<!doctype html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>CinePulse｜電影分析儀表板</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        body {
            background: #f8fafc;
            font-family: system-ui;
            color: #1e293b;
        }

        .card {
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }

        .list-hover:hover {
            background: #f1f5f9;
            cursor: pointer;
        }
    </style>

</head>


<body class="p-6">

    <main class="mx-auto max-w-6xl space-y-6">

        <!-- 首頁 -->

        <section id="page-home">

            <div class="card p-8">

                <h1 class="text-2xl font-bold">社群電影網</h1>

                <div class="mt-6">

                    <input placeholder="搜尋電影"
                           class="w-full px-4 py-2 border rounded-xl" />

                </div>

            </div>


            <div class="card overflow-hidden">

                <div class="px-4 py-3 border-b flex justify-between">

                    <h3 class="font-bold text-orange-500">
                        🔥 熱度榜
                    </h3>

                    <span class="text-xs text-slate-400">
                        回覆數 / 討論量
                    </span>

                </div>

                <div id="listHot" class="divide-y"></div>

            </div>

        </section>



        <!-- 電影頁 -->

        <section id="page-movie" class="hidden space-y-6">

            <button id="btnBack"
                    class="px-4 py-2 border rounded-lg bg-white">
                ← 回首頁
            </button>


            <!-- 海報 + 電影資訊 -->

            <div class="card p-6">

                <div class="grid grid-cols-12 gap-6">

                    <div class="col-span-4">

                        <img id="moviePoster" src="https://upload.wikimedia.org/wikipedia/en/0/0b/Princess_Mononoke_Japanese_poster.png"
                             class="rounded-xl shadow border" />

                    </div>


                    <div class="col-span-8 space-y-3">

                        <div class="text-xs text-slate-400">
                            電影
                        </div>

                        <h2 id="movieTitle" class="text-3xl font-bold">
                            魔法公主 Princess Mononoke
                        </h2>


                        <div class="grid grid-cols-2 gap-2 text-sm">

                            <div class="text-slate-500">導演：</div>
                            <div id="movieDirector" class="text-blue-600">宮崎駿</div>

                            <div class="text-slate-500">編劇：</div>
                            <div id="movieScenarist" class="text-blue-600">宮崎駿</div>

                            <div class="text-slate-500">演員：</div>

                            <div id="movieActors" class="text-blue-600">
                                <!-- 動態填充 -->
                            </div>

                        </div>

                    </div>

                </div>

            </div>



            <!-- 熱度 + 票房 -->

            <div class="grid grid-cols-2 gap-6">

                <div class="card p-6 text-center">

                    <div class="text-xs text-slate-400">
                        討論熱度
                    </div>

                    <div id="detailBuzz"
                         class="text-2xl font-bold mt-2"></div>

                    <div class="text-xs text-slate-400">
                        近期回覆數
                    </div>

                </div>


                <div class="card p-6 text-center">

                    <div class="text-xs text-slate-400">
                        本週票房
                    </div>

                    <div id="detailBO"
                         class="text-2xl font-bold mt-2"></div>

                    <div class="text-xs text-red-500">
                        最新票房統計
                    </div>

                </div>

            </div>



            <!-- AI票房預測 -->

            <div class="card p-6">

                <div class="grid grid-cols-3 items-center gap-6">

                    <div class="text-orange-400 text-lg space-y-2">

                        <div>一星:普通</div>
                        <div>二星:推薦</div>
                        <div>三星:夯</div>

                    </div>


                    <div class="text-center">

                        <div class="text-2xl font-bold">
                            AI票房預測
                        </div>

                        <div id="moviePredictionStars" class="text-5xl mt-6">
                            ⭐ ⭐ ⭐
                        </div>

                    </div>


                    <div class="h-[180px]">

                        <canvas id="chartDist"></canvas>

                    </div>

                </div>

            </div>



            <!-- 劇情介紹 -->

            <div class="card p-6">

                <h3 class="font-bold mb-3 text-slate-700">
                    劇情介紹 :
                </h3>

                <div id="movieIntroduction" class="bg-slate-100 rounded-xl p-4 text-sm leading-relaxed text-slate-700">
                    <!-- 動態填充 -->
                </div>

            </div>


            <!-- 網友評論容器 (由後端驅動) -->
            <div id="movieReviewsContainer" class="space-y-6">
                <!-- 動態填充評論卡片 -->
            </div>

        </section>

    </main>

    <!-- 引用外部腳本 -->
    <script src="js/script.js"></script>

</body>
</html>
