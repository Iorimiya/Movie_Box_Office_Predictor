# ==============================================================================
# Project Name: Web Service Configuration of Movie Box Office Predictor
# Description: Compute Node, CPU version
# Author: Iorimiya
# Date: 2026-01-21
# Version: 1.1.1
# ==============================================================================
name: mbop

services:
  compute-node:
    image: iorimiya/mbop-compute:${APP_VERSION:-v1.0.0}-cpu
    build:
      context: ../../
      dockerfile: ./environments/compute-cpu/Dockerfile.compute
    ports:
      - mode: host
        host_ip: ${HOST_IP:-0.0.0.0}
        protocol: tcp
        published: ${COMPUTE_HOST_PORT}
        target: ${COMPUTE_CONTAINER_PORT:-11100}
    volumes:
      - type: bind
        source: ${SRC_HOST_PATH}
        target: /app/src
      - type: bind
        source: ${DATASET_HOST_PATH}
        target: /app/datasets
      - type: bind
        source: ${LOG_HOST_PATH}
        target: /app/logs
      - type: bind
        source: ${MODEL_HOST_PATH}
        target: /app/models
      - type: bind
        source: ${CONFIG_HOST_PATH}
        target: /app/configs
      - type: bind
        source: ${INPUT_HOST_PATH}
        target: /app/inputs
#    command: ["gunicorn", "-w", "1", "-b", "0.0.0.0:11100", "-t", "600", "src.web_api:app"]
    command: ["sleep", "infinity"]
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "11100" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always

  llm-service:
    image: iorimiya/mbop-llm-service:${APP_VERSION:-v1.0.0}-cpu
    build:
      context: ../../
      dockerfile: ./environments/compute-cpu/Dockerfile.llm
#    ports:
#      - mode: host
#        host_ip: ${HOST_IP:-0.0.0.0}
#        protocol: tcp
#        published: ${LLM_HOST_PORT}
#        target: ${LLM_CONTAINER_PORT:-11434}
    restart: unless-stopped
