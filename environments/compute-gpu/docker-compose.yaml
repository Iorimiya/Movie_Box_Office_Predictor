# ==============================================================================
# Project Name: Web Service Configuration of Movie Box Office Predictor
# Description: Compute Node, GPU version
# Author: Iorimiya
# Date: 2025-12-30
# Version: 1.0.0
# ==============================================================================
name:  mbop-compute-gpu
services:
  mbop-compute-node:
    image: iorimiya/mbop-compute:${APP_VERSION:-v1.0}-gpu
    build:
      context: ../../
      dockerfile: environments/compute-gpu/Dockerfile
    container_name: mbop-compute-gpu
    volumes:
      - type: bind
        source: ${src_host_path}
        target: /app/src
      - type: bind
        source: ${dataset_host_path}
        target: /app/datasets
      - type: bind
        source: ${log_host_path}
        target: /app/logs
      - type: bind
        source: ${model_host_path}
        target: /app/models
      - type: bind
        source: ${config_host_path}
        target: /app/configs
      - type: bind
        source: ${input_host_path}
        target: /app/inputs
    ports:
      - host_ip: ${host_ip}
        mode: host
        protocol: tcp
        published: ${host_port}
        target: ${container_port}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint: ["tail", "-f", "/dev/null"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "11100"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always
