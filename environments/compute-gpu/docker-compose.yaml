#file: noinspection ComposeUnknownValues
# ==============================================================================
# Project Name: Web Service Configuration of Movie Box Office Predictor
# Description: Compute Node, GPU version
# Author: Iorimiya
# Date: 2026-03-31
# Version: 1.2.1
# ==============================================================================
name: mbop

services:
  compute-node:
    image: iorimiya/mbop-compute:1.2.0-gpu
    build:
      context: ../../
      dockerfile: ./environments/compute-gpu/Dockerfile.compute
    ports:
      - mode: host
        host_ip: ${HOST_IP:-0.0.0.0}
        protocol: tcp
        published: ${COMPUTE_HOST_PORT}
        target: ${COMPUTE_CONTAINER_PORT:-11100}
    volumes:
      - type: bind
        source: ${SRC_HOST_PATH}
        target: /app/src
      - type: bind
        source: ${DATASET_HOST_PATH}
        target: /app/datasets
      - type: bind
        source: ${LOG_HOST_PATH}
        target: /app/logs
      - type: bind
        source: ${MODEL_HOST_PATH}
        target: /app/models
      - type: bind
        source: ${CONFIG_HOST_PATH}
        target: /app/configs
      - type: bind
        source: ${INPUT_HOST_PATH}
        target: /app/inputs
    environment:
      TZ: Asia/Taipei
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    command: ["gunicorn", "-w", "1", "-b", "0.0.0.0:11100", "-t", "600", "src.web_api.app:app"]
#    command: ["sleep", "infinity"]
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "11100" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always

  llm-service:
    image: iorimiya/mbop-llm-service:1.1.0-gpu
    build:
      context: ../../
      dockerfile: ./environments/compute-gpu/Dockerfile.llm
    environment:
      TZ: Asia/Taipei
#    ports:
#      - mode: host
#        host_ip: ${HOST_IP:-0.0.0.0}
#        protocol: tcp
#        published: ${LLM_HOST_PORT}
#        target: ${LLM_CONTAINER_PORT:-11434}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: unless-stopped

  db-service:
    image: mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-movie_data}
      MARIADB_USER: ${DB_USER:-mbop_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-mbop_pass}
      TZ: Asia/Taipei
    ports:
      - mode: host
        host_ip: ${HOST_IP:-0.0.0.0}
        protocol: tcp
        published: ${DB_HOST_PORT}
        target: ${DB_CONTAINER_PORT:-3306}
    volumes:
      - type: bind
        source: ${DB_DATA_HOST_PATH}
        target: /var/lib/mysql
    command:
      - --character-set-server=${DB_CHARACTER_SET:-utf8mb4}
      - --collation-server=${DB_CHARACTER_COLLATION:-utf8mb4_uca1400_ai_ci}
      - --wait_timeout=86400
      - --max_allowed_packet=1G
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
