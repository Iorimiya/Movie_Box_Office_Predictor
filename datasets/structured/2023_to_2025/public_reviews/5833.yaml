url: https://www.ptt.cc/bbs/movie/M.1482755233.A.06B.html
title: '[討論] 哈利波特 消失的密室'
content: '我沒看過小說


  想問一下


  在麥教授的課堂上

  妙麗是從哪裡知道學校有密室這件事情的?

  電影這段讓我覺得好突兀


  隱形斗篷是真的能夠完全隱形嗎?

  感覺電影似乎有暗示 鄧不利多可以看穿隱形斗篷


  佛地魔是湯姆瑞斗也是日記

  這是分靈體的概念嗎?

  那把日記和湯姆瑞斗毀了 佛地魔不就元氣大傷?


  蛇妖這麼大隻是怎麼有辦法可以在學校的水管移動

  而且鄧不利多和其他教授這五十年來都找不到密室

  這怎麼可能.....難道沒有學校當初的建設或設計圖嗎?

  就算都沒有好了 五十年前發生的事情怎麼沒有持續追蹤並解決

  這不是太豪洨了嗎 最後還得交給小小的哈利一個人解決

  重點是鄧不利多還對哈利讚聲連連


  史萊哲林的人真的比較壞嗎?

  從鄧不利多跟哈利的對話真的會有這種感覺

  鄧不利多到底多賭蘭史萊哲林


  魯休斯到底跟佛地魔什麼關係?

  是暗地在勾結什麼嗎

  因為這次的事件我看跟魯休斯有很大的關係


  霍格華茲到底是怎麼徵選老師的

  哈洛這種人能當老師....

  電影中完全看不出來有厲害的感覺 只有自戀和刪除記憶最在行


  另外 JK羅琳的設定中

  有沒有學校發生重大的事情是學校人員無法處理的

  必須請校外的人士來解決?


  艾瑪華森小時候真的好可愛唷 可愛到令人想犯罪!


  --'
