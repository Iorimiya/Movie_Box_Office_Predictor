title: '[討論] 消失的密室一個小bug'
content: 'HBO正在哈利波特大串燒~


  本魯剛剛看到第二集哈利單挑蛇妖那幕發現一個小小的bug，哈利在非常帥氣的拿寶劍貫穿蛇妖的頭後，下一秒從被刺傷的手臂上拔出毒牙(?，然後才用毒牙摧毀日記本...


  欸不對啊~第7集就有解釋因為毒牙是至毒之物所以能夠摧毀分靈體，啊哈利被貫穿的當下不是應該馬上中毒嗎…怎麼完全沒事??


  請大家來一起解惑~



