url: https://www.ptt.cc/bbs/movie/M.1709441379.A.4A3.html
title: '[  雷] 掃毒3:人在天涯'
content: '防雷













































































  哇靠!這是以掃毒之名行戰爭之實了吧

  越到後面越離題卻火力全開

  除了一開始港口槍戰還有點上集影子

  接下來的一切都全方位升級啊!

  從搶車隊到後面的掃蕩給足了滿滿爽感

  甚至還有戰機的鏡頭,看到時還不敢相信自己的眼睛

  沒想到華語片可以給到這種程度

  雖然視覺上明顯還差好萊塢一大截

  而且這些都是在晚上拍應該是要省預算

  我覺得肯做出這樣的程度是值得讚揚的

  劉青雲的角色也讓我蠻喜歡的

  我很喜歡這種海派又亦正亦邪的人

  交給他發揮是再適合不過我

  郭富城的感情戲也有點綴的功用

  古天樂就比較雞肋,但還是樂見他的存在

  總之這部電影真是讓人大呼過癮

  就算充滿了老梗,還是再現了一定的實力

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  每當處在我人生的十字路口，我總是知道哪條路是正確的

  沒有例外，我總是知道，但我從來沒去做，你知道為什麼嗎？

  因為那實在他媽的是太難走了

  而現在的查理也正處在人生的十字路口，他選擇了正確的路

  一條通往原則、導向人格的道路。讓他繼續走完這旅程

  委員們，你們正掌握著他的未來。這會是個寶貴的未來


  --'
