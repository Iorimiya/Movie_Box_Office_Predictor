url: https://www.ptt.cc/bbs/movie/M.1690902294.A.4BF.html
title: '[好雷] 掃毒3: 人在天涯'
content: "1. 特映會, 一百塊的票, 松仁威秀的Titan廳\n   讚! 希望這類的場次多半一點, 比抽電影票舒服太多\n\n2. 邱禮濤導演, 就是一個你給他多少錢,\
  \ 就給你看多少錢畫面的導演\n   這次開頭就是滿滿的公司logo, 果然打好打滿, 滿滿的槍戰戲\n   最後的攻堅戰爭那個場面我想就連現在的好萊屋都難得給那麼滿的火力了\n\
  \n3. 有些預告沒看到的老港片演員:\n   方中信! 洪天明(洪金寶兒子), 羅嘉良, 肥雪\n   連陳國邦(南洋十大邪術)都有\n   謝君豪前陣子的毒舌大狀/濁水漂流都好老,\n\
  \   這部突然變得胖胖的很年輕\n\n4. 劇情沒反轉, 順順的走, 劇情就照著主角個性也一路發展\n   反正就一貫的臥底, 警匪, 毒梟, 兄弟情等老梗\n\
  \   這些劇情就連邱禮濤自己其實也都拍到爛了\n   不過也因為我是老人了, 新的年輕人也不一定會覺得是老梗\n   沒有瞎的橋段跟降智的劇情, 就是都是意料之內的東西\n\
  \n5. 罌粟花田的CG有點假\n\n6. 劉青雲演的反派很有魅力\n\n7. 身為一個從80年代開始導片,\n   歷經香港影業高峰低谷總總時機, 幾乎所有同期導演都已經踏入半退休時\n\
  \   仍然每年持續有作品產出, 讓大家有工開, 金主能回收\n   幾乎所有類型電影都拍過也懂得拍的國寶級邱禮濤導演\n   本片我只舉得出唯一一個缺點: 老梗\n\
  \   而且應該給他一個Respect\n\n8. 好看, 給好雷\n\n--\n\n我是在板上看到的喔"
