url: https://www.ptt.cc/bbs/movie/M.1667440281.A.C6A.html
title: '[好雷] 大俠胡金銓─斷腸人在天涯'
content: '繼上一部主要都在講胡金銓的拍攝電影使用技巧

  這部比較是在探討胡金銓的生平



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  胡金銓小時生在北京的一戶大人家裡

  跟據家裡的大宅院不難看出是有錢人

  但隨著中日戰爭開打 家裡怕胡金銓的留日經驗會讓他有不好影響

  於是就把他送到香港 但到香港的胡金銓也沒有過的很好

  生活只能藉由打零工來過生活


  不知是不是和電影有緣 他七個人成為結拜兄弟 而大家都變成了電影界的大咖

  （李翰祥、馮毅、蔣光超、馬力、沈重、宋存壽、胡金銓）

  後來一次因緣際會的情況下 有人問他要不要拍戲

  於是他就由演員當起 跨入了電影界


  在電影界他地位越爬越高

  也帶出了一堆電影界的後輩

  （但這裡就像是上一部就提過了一樣 這部反而講的很少）


  之後就到了新浪潮時代

  那時大家求新求快 都在追求一件事有多快回本

  像胡金銓這樣的完美主義反而慢慢的沒用武之地

  於是就開始了有點悲慘的晚年....


  晚年的胡金銓沒有拍電影的收入

  又回到各種窮的狀態

  想要來台灣教電影（當時他人在美國） 學校說沒博士畢業不能

  畫畫投稿報社 被說這樣的畫風不接受

  投書去報社 只能拿到微薄的薪水


  即使他對電影界是有著這樣重大的影響

  最後一部想拍的電影 華工血淚史 更是令人心酸

  劇本 場堪 田調 演員都找好了 但因為金主找不到所以只能"籌劃20年"

  但更戲劇性的一刻是 金主到位了 胡金銓竟然因為心藏手術失敗而離開人間


  上一部在談論技巧 所以個人覺得會有一點死板

  但我個人還是更看重一個導演他的想法 以及這些想法是怎麼形塑出來的

  所以相較上一部 我更愛第二部

  胡金銓想法/人性的部份

  例如他的電影都在講"俠" 跟據友人說法 他就是一個很俠氣的人

  或者他電影的劇情一直都在暗諷時事

  或者他對"俠"的看法

  或者他的家中充滿了書

  或者晚年陪伴她的一個女生小愉的事

  看到一位導演創造了時代 又被時代拋棄 實在是令人不勝唏噓....


  ====


  只要是2022/1/1後首映 到 2022/12/31 23:59:59 的由台灣人出資51%以上的電影

  我都會去看和PO出簡短的影評


  如果有興趣的可以來這粉絲專頁喔




  --'
