url: https://www.ptt.cc/bbs/movie/M.1765342507.A.C00.html
title: '[普雷] 純純的愛+人在天涯+迷情 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  最近看了純純的愛(1974)+人在天涯(1977)+迷情(1986)


  《純純的愛》是因為卡司點進去看，男女主角顏質都很高，


  加上當地雪景的特色，讓整部片看起來頗為詩意；


  《人在天涯》則是因為取景的地點是義大利，


  有一幕是次男女主角相約的地點就很威，約在競技場碰面，


  《迷情》是因為劇情，不過電影開始很像在看肉片，


  看到後面已經有點以為自己在看搞笑片嗎？！


  隨著年紀增長，越來越發現這些早年國片的愛情營造，


  跟自己看歐洲片裡面的情感營造，完全不同角度，


  也許是種族、文化背景、環境等等種種，


  不過人在天涯在那個年代可以去到義大利那麼遠的地方取景，也是很猛，


  純純的愛取景地點也是跑去韓國，也是讓觀眾一飽眼福欣賞雪國天地。


  --'
