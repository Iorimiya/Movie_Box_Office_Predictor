title: '[好無雷] 【誘見巴黎最後探戈】舞上錯誤的探戈'
content: '‧

  是藝術抑或情色？那份奶油隨著錯誤的探戈舞步，摻進了隨之一生的爭議與夢魘；兩位當

  紅導演、演員及一位即將嶄露光芒的新人女演員，在三人共舞後，善意的鎂光燈卻從不照

  映在瑪麗亞身上，這段70年代最為爭議的電影拍攝事件，用瑪麗亞那份複雜、悲傷、無助

  及氣氛的視角，來重現這段令人髮指的往事。



  ‧


  或許嘴中冠冕堂皇說著為了電影藝術，甚至只是為了捕捉演員最原始的反應，但並非用一

  句只是為了拍電影而敷衍了事；讓演員毫無預兆進行不存在於劇本與合約上的演出，甚至

  羞辱性的使用奶油來進行性侵，我想都會是種不可寬恕的共憤之舉。

  然而各種思想議題，隨著瑪莉亞氣憤跟眼淚，飄落在劇情的各個角落之中；除Metoo、取

  消文化，劇情也充滿了女性主權的訴求及家庭關係的闡述；不願被貼標籤而大聲說不的瑪

  莉亞，雖是70、80年代女權主義的先驅者之一，卻也是在潛規則巨獸下的犧牲品。



  ‧


  全劇攝影運鏡及光影深具質感，成功的重建那場奶油侵犯的現場，沉重的氛圍，不僅讓瑪

  莉亞覺得同時有2個男人都在強暴他，甚至是所有觀眾都身在其中；但更極為讚賞的是Ana

  maria成功的演繹出，瑪莉亞這個極具複雜心境的角色，在生活失敗與心理不穩定中，完

  美的顯示出對於情緒的掌控，以及心境的變化。



  ‧


  但究竟是什麼信仰才會讓人成為野蠻人？基於對於藝術，忠於對真實情感的表達演出？還

  是只是一種男尊女卑的不平權信仰？即便馬龍白蘭度與貝托魯奇為業界傳奇人物，但為了

  逼現最原始的情感情緒，其行為何嘗不是一種野蠻，而其後半生致力於平等與女演員工作

  條

  件改善的瑪莉亞施耐德，在2011不幸因病離世；同年導演貝托魯奇則是榮獲坎城影展的終

  身成就及獎，令人不勝唏噓。



  本片已於2025/01/10上映，有興趣的觀眾，推薦進場觀看。



  ‧


  「觀影的樂趣在於能獨自在那裡冥想一刻鐘」







  --'
