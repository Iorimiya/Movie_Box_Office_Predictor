title: '[好雷] 久別重逢 有點可惜了一個好題材'
content: '連著進行曲一起看的


  兩齣劇都以音樂演出為背景


  進行曲是一群高中生參加管樂隊


  久別重逢則是灰心喪志音樂人的奇幻之旅



  前者 管樂演出不是重點


  後者 鄭伊健彈唱倒是值得一聽


  前者 沒有校園劇必備的青澀愛情


  後者 帶你品嚐少年的遺憾和成年的懊悔



  故事設定算是有趣


  講述失魂落魄的主角，遇上已故初戀的女兒


  雙方一起到日本等奇蹟日出、灑骨灰


  最後發現這位女兒就是初戀


  雙方拿著奶奶給的魔法水晶項鍊挽回生命遺憾


  最後給個逆轉未來的美滿大結局



  電影拍得很平淡


  可能是想呈現成年人的現實


  女主許恩怡和鄭伊健的演技都很不錯


  有少女的熱情、也有長輩的惆悵和不耐


  就是結局給的有點突然


  明明前面一路充滿缺憾，看似要與遺憾共處


  卻突然峰迴路轉，來個改變未來的happy ending


  結尾有點突兀，顯得過程不夠精彩



  不論如何，看完還是心暖暖的


  港澳去年就上映了，不確定串流有沒有


  如果想要作個好夢 倒是值得一看



  --'
