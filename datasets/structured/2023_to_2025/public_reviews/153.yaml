title: 'Fw: [好雷] 《久別重逢》那些未曾失去的'
content: '作者: elvayanzimei (柏C) 看板: HK-movie

  標題: [好雷] 《久別重逢》那些未曾失去的

  時間: Sat Sep 13 18:41:07 2025


  部落格圖文版：


  「讓我試吓？」


  看到少年蘇昇華對著未來的自己，一邊哼唱，一邊補完「久別重逢」後半段旋律的那刻，

  真的要哭出來了 QAQ


  在文章的一開始，先利申本人是 Hellosss（Ian 陳卓賢的粉絲名），而《久別重逢》也

  絕對能成為一部粉絲電影。


  不管是從「現在」的鄭伊健回到青蔥歲月，在長鏡頭中看著 Ian 的背影一路奔跑的期待

  感（轉場後還故意先 take 許恩怡 XD）；學校庫房裡，少女夏文萱試著感受蘇昇華指尖

  下音樂的顏色與天氣，答案的「藍色」、「秋天」就像是跟 Hellosss 之間的密碼；還是

  那個和少女交換眼神後，衝回中庭大喊參賽編號隨即開始表演，不讓自己留下任何遺憾的

  大男孩。


  聽著電話另一頭的吉他聲，以及男孩對兩人能成為知音的靦腆道謝，內心小鹿亂撞的夏文

  萱，根本是粉絲的寫照吧。


  「但愛是，就算他不好，你仍然想留在他身邊，令他變返好。」


  可是序幕成年蘇昇華的逃避、憤世嫉俗，早已拋出一個大大的疑問：是什麼讓兩人漸行漸

  遠？電影的劇情得以成立，其中表現最亮眼的非許恩怡莫屬。


  自過去穿越到現在的少女夏文萱，起初想藉由焦糖布丁、「我的歌」，還有踩單車這些共

  同回憶去喚回她喜歡的那個蘇昇華。然而操之過急不僅使銀幕對面的我們感到尷尬，

  Demo 被擅自發出的蘇昇華，終究忍不住說出「我來是因為你媽媽，不是陪你玩。」的重

  話。


  「不緊要，我見到啦。」


  隔天，雖然海面上一片霧濛，跟想像中夢幻的達摩太陽似乎一點邊都沾不上，但夏文萱已

  經知道了蘇昇華對自己的心意。


  「但你一旦放棄，就什麼都沒了。」


  當年送別時，兩人始終沒說出那句「我愛你」。這次真的很愛很愛蘇昇華的夏文萱不再遲

  疑，


  「其實你還認不認得我是誰？」


  「就算我以後不在你身邊，你都是最厲害的那個。」


  而在看電影的過程中，其實我完全沒有想到自己會被鄭伊健成年蘇昇華的角色打動，一直

  以為最大的爆點就是夏文萱的穿越了。結果在兩人「久別重逢」後，蘇昇華竟然也回到過

  去，選擇跟心目中最好的自己重逢。


  「並沒有錯，縱使錯失太多。」


  不得不說當鄭伊健走向 Ian，我心裡冒出的第一個念頭是「這也太狗血了吧！」但看到靠

  酒精，靠封閉自己不斷逃避的蘇昇華，終於找回那個在夏文萱身旁，便好像什麼都做得到

  的男孩，


  「深深處還有我，在無覓處生火。」


  那些我們以為早已失去了的陽光，其實一直都在。


  「我見過將來的你。」


  相較於轟轟烈烈，《久別重逢》透過「奇幻」賦予最青澀，也最純粹的愛情與初心新的樣

  貌。在交錯敘事的編排下，即便整體節奏不慍不火，我始終相當期待兩條時間線，會如何

  慢慢地走到一起。


  而當故事來到了最後一頁，電影一改前面的克制，沒有留下任何懸念的直接給出最溫暖、

  最夢幻的結局。是真是假都好，看到四位主角在「久別重逢」的旋律中不再有任何遺憾，

  真的超級感動。而且無論是許恩怡、鄭伊健、Ian，還是蔡思韵，夏文萱、蘇昇華們看著

  彼此的表情，認真滿滿都是愛啊。


  最後，從承載了大量美好時光的夏日長洲，到總是有著那麼一絲溫暖的冬日四國，在《久

  別重逢》的鏡頭下都超級漂亮，感覺是時候來個電影巡禮啦 XD


