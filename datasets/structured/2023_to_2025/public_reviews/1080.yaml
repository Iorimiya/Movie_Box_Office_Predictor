title: '[好雷] 填詞L 推薦'
content: "1. 剛看完, 心情還很好, 趕緊來記錄這篇\n\n2. 鐘雪瑩真的太可愛了\n   戴眼鏡正 不戴眼鏡更正\n   不笑正 笑起來更正\n \
  \  一開始穿校服的樣子更是可愛\n\n3. 不過光憑鐘雪很可愛還不是會去電影院看的理由\n   是看到這篇hk01的新聞\n   \n\n   看完新聞就決定一定要買票支持一下\n\
  \   難怪整部劇充滿了真實感跟說服力\n\n4. 原來鐘雪小鬍子是在cosplay梁朝偉\n\n5. 其實她搬去英國唸書的朋友也很可愛\n\n6. 用了很多別出心裁的特效讓看起來低成本的片變得有趣\n\
  \n7. 喜歡廣東歌的看得也會很開心, 有講一些填粵語詞的撇步\n   像是以前胭脂拉鍊的40342 跟林子祥的數字人生突然都合理許多\n   當中年代裡面出現的歌也都讓人懷念\n\
  \n8. 潘源良! (現在好像是住台北)\n\n9. 天天利蘿蔔糕!\n\n10. 鐘雪瑩憑此劇入圍金馬獎金像獎最佳女主角\n    不過演技其次, 她真的很可愛!!\n\
  \    她就跟安雅泰勒喬伊還有小美人魚一樣其實眼距有點開開的\n    不過她開得很可愛!!\n\n11. 創業的老闆在哭那邊也很有感覺\n    不是只有女主一個人一直在遭受挫折\n\
  \n12. 好笑, 感動, 溫馨\n\n13. 整體觀影體驗有點像「魚之子」\n\n14. 最後要恭喜導演找到更適合自己的工作並把這些故事拍出來\n\n--\n\
  推~"
