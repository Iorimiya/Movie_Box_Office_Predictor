url: https://www.ptt.cc/bbs/movie/M.1709779205.A.C30.html
title: '[新聞] 黃綺琳自籌拍「填詞L」 不用扛預算壓力'
content: '黃綺琳自籌拍「填詞L」 不用扛預算壓力喊快樂



  中央社記者王心妤傳真 113年3月6日


  （中央社記者王心妤台北6日電）曾以「金都」入圍金馬獎的香港導演黃綺琳，將自己填

  詞追夢過程翻拍成電影「填詞L」。她自籌拍電影，笑稱反而不用扛預算壓力，是有史以

  來最快樂的工作經驗。


  「填詞L」由香港新生代女星鍾雪瑩主演，入圍金馬獎跟香港金像獎最佳女主角，笑中帶

  淚劇情獲得肯定，讓黃綺琳表示，「因為有她，才能順利拍出這部作品。」


  導演黃綺琳今天透過電影公司表示，這部片拍攝成本不高，15天內就完成拍攝。這次透過

  自己的資金完成電影，不需要面對預算壓力，她笑說：「我從沒有那麼開心過，大家同心

  協力把我想表達的故事完成，完全不像在工作，更不擔心哪個人不喜歡，只要我自己喜歡

  就好。」


  黃綺琳表示，一直有著當填詞人的夢想，電影完成拍攝後，也收到更多邀請，「因為我包

  辦了電影中所有歌曲的歌詞，讓更多人知道我可以填詞，合作也就變多了。」


  「填詞L」將於22日上映。（編輯：陳政偉）1130306






  《填詞L》電影預告



  --'
