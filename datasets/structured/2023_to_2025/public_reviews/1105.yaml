title: '[請益] 關於笨鳥的一些情節疑問（雷）'
content: '最近看了黃驥的笨鳥，

  除了導演的鏡頭很大膽之外，

  也能感受到留守兒童那種跌跌撞撞前行的痛苦，

  以及青春期少女對於性、同儕、家庭間的迷惘。

  但是戲中有兩部分不是很清楚：


  1. 為什麼媽媽檢查林森私密處之後，林森會去驗孕？這時候的林森還不知道她朋友被性

  侵，也就不會猜想自己有被性侵過的可能吧？加上後面大威看起來在旅店是第一次與林森

  有性行為，所以在那個時間點林森為什麼會驗孕？是因為她對於性的不了解嗎？我一直以

  為她那裡的不舒服是因為被同學塞雞骨頭所以有撕裂傷和感染。


  2.她在旅店裡似乎認定了大威是沒被抓到的強姦犯，這個認定是源於哪裡？是隨口亂說的

  氣話還是大威半強迫她口交加上爸爸是警察等同於不會被抓所以猜測大威是強姦犯？



  --'
