title: '[情報]  《柏靈頓：熊熊去秘魯》正式預告'
content: '2025年1月24日在台上映的 《柏靈頓：熊熊去秘魯》釋出正式預告如下：




  相較於前兩集， 《柏靈頓：熊熊去秘魯》有兩個更動。一是Paul King因執導 《旺卡》，

  未能繼續擔任導演，但仍參與劇本撰寫。二是Sally Hawkins覺得是時候交棒了，不再飾演M

  ary Brown這個角色，改由Emily Mortimer接替。


  --'
