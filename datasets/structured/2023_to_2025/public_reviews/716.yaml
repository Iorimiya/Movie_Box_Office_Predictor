url: https://www.ptt.cc/bbs/movie/M.1743840817.A.2F1.html
title: ［問題］非普通家族的撲陳？
content: '剛看完這部


  薛景求和張東健合演的劇情片居然頗冷門


  整體蠻好看的 情緒很飽滿


  但在反轉的撲陳上感覺有點生硬看不懂？


  哥哥明明幫一堆加害者打贏官司


  也沒看他去關心被害人 甚至不太有愧疚感


  但他事發後卻是第一個去看流浪漢


  而且也在流浪漢死後去關心與送錢？


  弟弟的反轉過程可以理解


  但在最後聽完兩個小孩的對話


  照他之前正義感的撲陳 至少該有點爭扎


  怎麼感覺走火入魔似的完全失去理智？


  若他本身是道貌岸然的偽君子 重視自己的形象


  又怎會在最後寧可揹上殺人罪也要撞死哥哥？


  討論太少了 希望有前輩分享我沒注意到的地方


  謝謝


  --'
