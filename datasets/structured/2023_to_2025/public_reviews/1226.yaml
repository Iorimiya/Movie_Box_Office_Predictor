content: "即刻起至10/29(四) 12：00，推文留言簡單回答一個問題\n\n『你看過最好看的韓國電影』\n\n\n例如:我看過最好看的韓國電影是【殺人回憶】\n\
  就有機會獲得10/30(五) 12:30試片(一人中獎,兩人同行)\n\n活動場次：\n《綠洲：數位經典版》搶先試片場 (一人2張，抽10組)\n時間：10月30日(五)\
  \ 12:30\n地點：台北真善美劇院《台北市漢中街116號一樓》\n\n\n\n搶先看活動時間：即刻起至10/29(四) 12：00\n（10/29（四)中午12:30\
  \ 推文公佈得獎名單）\n搶先看得獎名單：得獎名單將會公布於推文內，並寄站內信聯絡得獎者\n領獎事宜，請於10月29日(四）21:00前回覆資料，恕不接受逾期回覆\n\
  領獎事宜，請於10月29日(四）21:00前回覆資料，恕不接受逾期回覆\n\n注意事項：\n1.本場次非對外售票，嚴禁兜售等圖利行為\n2.光年映畫保留活動最終解釋權，以及修改及調整活動辦法之權利。\n\
  \n導演：《薄荷糖》、《生命之詩》、《密陽》、《燃燒烈愛》李滄東\n演員：\n韓國青龍獎、大鐘獎影后 文素利\n韓國大鐘獎影帝 薛耿求\n韓國名導李滄東跨世紀經典之作，台灣首度公開上映\n\
  2002年威尼斯影展最佳導演、最佳新人演員、影評人費比西等三項大獎\n2002年青龍獎最佳新人獎\n2005年美國獨立精神獎最佳外語片入圍\n\n正式預告 :\
  \ \n\n劇情介紹 :\n在洪宗道出獄後，家人對他十分排斥，而他之所以被判入獄，只是為了頂替哥哥過失\n殺人的罪名。心冷意涼的他，來到死者的住所拜訪家屬，遇到死者的女兒韓恭洙，卻發現\n\
  她是一名重度腦性麻痹患者，雖然她面容扭曲、手腳抽搐，但宗道卻被她吸引，並在衝動\n下做出大膽舉動…….\n    但在意外事件後，兩人卻彼此都萌生了愛情，兩顆孤獨心靈就此漸漸靠攏。他們看似\n\
  \    但在意外事件後，兩人卻彼此都萌生了愛情，兩顆孤獨心靈就此漸漸靠攏。他們看似\n身心不甚健全的非正常人，但卻擁有顆純潔之心，但卻一連串發生遭遇現實不公不義事件\n\
  。最後，命運是否就此放過戲弄他們的機會呢\n\n\n光年映畫FB：\n\n\n--"
