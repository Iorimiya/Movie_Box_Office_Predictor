url: https://www.ptt.cc/bbs/movie/M.1721054289.A.D75.html
title: '[雷] 長腿大負雷'
content: '不好看，千萬不要看

  我沒有看預告，但宣傳給我的感覺

  讓我以為類似宿怨或是仲夏夜什麼的

  我也不知道凱吉有演

  就衝去看了

  凱吉演一個撒旦教徒

  製作娃娃到處送給別人家

  娃娃會洗腦男主人殺掉全家在自殺

  曾經造訪女主家

  媽媽跟凱吉達成妥協

  偽裝成修女去送娃娃

  害死更多人

  女主也有一個娃娃

  娃娃讓他有第六感

  順利當上fbi

  後面不想講了

  根本不好看


  飽和冷色系拍攝畫面很美

  角色之間的謎語

  這些讓你誤以為劇情會逐漸合理好看

  而去忍受前半段超慢節奏跟講話類似亞斯的女主欲言又止

  直到最後揭曉媽媽跟凱吉的特殊性關係

  只會讓你覺得到底看了三小

  這段特殊性關係還是用口白跟直接的畫面演繹

  根本就是前半段拖節奏

  後面發現要演不完了趕快真相大白

  手法跟情節都爛的一匹


  最後女主到長官家 不先打爆娃娃，在那邊五四三，讓長官直接帶老婆去殺

  才想起來要抱走女兒？

  智商？

  X


  --'
