title: '[好雷] 兇器=好看版的長腿'
content: '就是這麼直白的類比

  邪教 節奏像 氣氛像

  但娛樂性更高  質感更好 然後看的懂


  很難說有沒有導演上一部這麼好 但有幾段是有保留他自己特色的


  我喜歡警察和毒販那兩段 就那種衝動行事 事不關己的美國小人物  內在社會問題 完全沒有恐怖 但很加分


  大扣分點是沒有解釋叫小孩來是能治什麼病 （不懂為何很多邪教片都要不解釋）


  阿姨選角偏普 後段不是全片最巔峰的部分


  結論：這導演技法算屌 但他的劇本一定要再走更深




  -----

  Sent from JPTT on my iPhone


  --'
