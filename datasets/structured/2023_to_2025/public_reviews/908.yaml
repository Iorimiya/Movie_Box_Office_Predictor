url: https://www.ptt.cc/bbs/movie/M.1720796359.A.9C8.html
title: '[普雷] 長腿 不會是近10年最恐怖的電影 '
content: '如果你是抱持著近幾年最驚悚的電影近戲院的話可能會失望

  在我心中另一標竿是2018年的Hereditary《宿怨》

  (如果你覺得本部難看，或許會覺得長腿好看)


  本片構圖很棒，這點是蠻值得進戲院的

  近年確實也較少優質的驚悚推理片，《長腿》的前半段也的確做到了層層抽絲剝繭


  可惜的是，本片也不全然的強調真實性，自然就不能與Prisoners《私法爭鋒》相提並論

  因此我才會與Hereditary《宿怨》比較

  (真實又有點超自然)


  後半段，導演還是沒有把前半段的大格局延續

  尤其著迷於殺人魔犯罪動機的觀眾，或許都看過Mindhunter《破案神探》

  導演把案情弄得橫跨30年，仔細深究又有點草草帶過


  尤其收尾更顯無力，敘事角度本片也拿捏不清

  全然把犯罪動機嫁禍給撒旦，反而弱化了凱吉所飾演的反派


  不過說到底，導演Oz Perkins往後的電影依舊可以期待一下。


  --'
