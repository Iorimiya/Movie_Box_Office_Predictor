content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  今天來跟大家分享我前幾天看ㄉ驚悚片《長腿》

  有興趣的先看一下預告




  沒錯！就是大名鼎鼎的尼古拉斯凱吉主演

  扮演連環殺手

  他會拜訪每個生日在14號的小孩

  然後派人送給他們禮物

  最後他們家裡就會死狀淒慘，無ㄧ倖免


  當然女主角兼FBI是唯一一個有存活下來的14號女孩，但作為交換

  她的家庭一定犧牲了一些東西




  我這邊不爆雷太多

  有興趣愛看宗教殺人片的可以看看

  整部片都很詭異～



  --'
