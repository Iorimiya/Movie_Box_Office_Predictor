title: '[新聞]「驚奇隊長」布麗拉森火辣長腿登影展 緊身'
content: '《驚奇隊長》布麗拉森「火辣長腿」登影展！　平口緊身禮服秀「健身成果」




  好萊塢女星布麗拉森（Brie Larson）以電影《不存在的房間》奪下影后殊榮，後加入漫

  威電影，以《驚奇隊長》、《復仇者聯盟：終局之戰》打開全球知名度。她主演的電影

  在多倫多影展舉行首映，現場她以一襲低胸禮服現身，性感又不失甜美的

  造型一出場就成了鎂光燈焦點。






  《不完美的正義》於當地時間6日在第44屆多倫多影展首映，女主角和在《黑豹

  》飾演反派的（Michael Bakari Jordan）等主要演員一同出席。布麗拉森日前

  曾於IG上傳健身影片，引起不少猜測是在做準備，此次現身影展，造型

  完美地展現了她的健身成果，穠纖合度的體態，一身紅色低胸拖尾長裙，露出一雙辣長腿

  ，殺了攝影師不少底片。





  ▲布麗拉森和麥可B喬丹合作電影《不完美的正義》。




  電影改編自布萊恩史蒂文森的暢銷書《不完美的正義：司法審判中的苦

  難與救贖》，麥可B喬丹飾演一名律師，和飾演人權鬥士的布麗拉森攜手幫助受到司法不

  公平對待的囚犯，電影預計。




