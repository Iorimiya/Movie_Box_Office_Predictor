title: '[負雷] 長腿太吃電波...早知道就去飛月情海'
content: '本篇文是長腿負雷!


  本篇文是長腿負雷!


  本篇文是長腿負雷!


  首先分享本人觀影習慣供其他觀望的人參考，


  我不是死忠的凱吉粉，但凱吉破產前的每一部動作片幾乎都看了，


  開始對凱吉的電影有陰影是從惡靈線索開始.....


  覺得媽的什麼爛片，後面凱吉的電影就是有一搭沒一搭的看，


  到了超吉任務之後，感覺過去凱吉片好像回來了，


  周末前要從長腿跟飛月情海2選1時，


  看到上週的相關新聞，又是戀童名著改變、又是驚悚、又是爛番茄100%....


  想說有那麼神嗎!?於是就期待了......


  電影前半是拍得夠驚悚，


  但中間也不少jump acare讓人覺得我只是來看驚悚片有必要用這招嗎?


  後半開始解謎我直接進入WTF階段.....覺得惡靈線索的噩夢又來了......


  出電影院後越想越不對勁，覺得一定要發文給大家避雷!!!!


  以下有劇情雷










  ~~~~~~~~~~~~~~~~~~~ 以下有雷主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  一言蔽之本片就是一個得到邪惡力量的邪教徒神經病利用手作娃娃下咒殺殺殺的故事


  而我自己一開始的預設認知是"驚悚片講合理性，恐怖片則可以各種放飛"


  而長腿這部片從片名開始就跟長腿叔叔沒有半點屁關係，


  長腿叔叔原著是一個養蘿莉，蘿莉長大後跟長腿叔叔在一起的故事，


  但長腿這部片你甚至很難指出這部片有明顯的蘿莉情節，


  神經病跟女主初相見女主是小女孩沒錯，但神經病只是以女主為開頭去殺人，


  然後化妝化得很猥瑣一直在言語上機歪跟噁心女主角，


  但男女主角間既沒有親情也沒有愛情，基本上感情完全沒有任何接觸或是共鳴，



  再來是我自己認知中


  "驚悚片應有恰當的解釋幫助讀者融入情境，看完後有不寒而慄的情緒"


  可以有不合理的橋段，但拋出的謎團應該要被解釋，營造出細思極恐的環節，

  (像是怪奇物語那樣，雖然有夠離奇但好歹解釋了)


  但這部片並不打算這麼做，他給了凱吉一個任何正常人看了都會感到不適的扮相，


  搭配上亂吼亂叫，最後自殘而亡的噁心畫面，


  讓人看了覺得這一點都不驚悚啊啊啊啊，只是在用噁心畫面跟凱吉粉嬉鬧而已。


  而神經病凱吉身為一個有下咒神力的邪教徒，沒有交代他是如何得到這個能力，


  然後也沒說明他進行這一連串的殺人行動的目的為何?


  只是不時高喊"撒旦萬歲"，看得我都為撒旦尷尬了起來......


  一個號稱對撒旦忠心的教徒，進行了前後過程30年的咒殺活動，


  結果只是為了高喊他心中的"撒旦萬歲"四個字....


  你好歹為了有點宏大的目標好嗎??


  像是這樣勤勤懇懇地幹了30年，就能夠召喚撒旦降臨或是其他的地獄軍團還是天災人禍，


  來點像樣的"魔跡"給眾人見證這樣......結果也都不是


  從頭到尾凱吉神經病就只是為了高喊撒旦萬歲才這麼做的，


  只是要殺人不是有更多更邪惡可以殺更多人的方法嗎??


  你講究這些儀式性到底是所謂何事?


  觀眾甚至不知道到底是不是撒旦叫他做的，


  也不知道他這些行為到底是如何榮耀了他心中的神，

  (我甚至懷疑撒旦跟他不熟)


  看到後半我惡靈線索的PTSD就整個出來了，開始覺得編劇導演瞎搞啊啊啊!


  結尾時有種在看不好笑的"超能輪胎殺人事件"的想法，

  (我覺得超能輪胎比本片好看，荒誕又好笑)


  就是導演跟編劇一開始就不想好好構思一個縝密又恐怖的故事，


  只是把一堆討人厭的嚇人元素加進去而已，


  但"超能輪胎"劇中有一批代替觀眾的角色群互相吐槽跟強調這一切就是"NO REASON"


  而長腿裡面埋的哏就各種破碎無法聯繫，


  劇中女主群敲開了另一個倖存受害者洋娃娃腦中的核，於是該倖存者跳樓，


  但女主娃娃腦中的核被擊碎後除了頭暈以外也沒看到啥負作用，


  那我就問你到底安排核被擊碎的橋段是在幹嘛~


  還有媽媽一穿修女裝就像勇者一樣可以隨便進人家門，


  還有為何要以女主的生日做為殺人的依據???不好意思片裡都沒解釋，


  也不像超能輪胎至少好好跟你做不解釋聲明，


  其他還有很多不知所云為何安排的橋段就不一一列舉了，


  女主前半的各種消極跟受驚反應我也都能接受，畢竟算是鋪陳了女主的童年陰影，


  但結尾要去阻止最後一波殺人案時就不知腦袋在裝啥了，


  眼睜睜看長官殺妻，欸不是耶，你不是一開始就拿槍要去阻止了嗎??


  你如果是不敢開槍打長官，那你也不用其他物理方式救人，


  何況長官衝出來要殺其他人時你也開槍了啊啊啊~


  所以為何不一開始就阻止長官殺妻呢呢呢?


  女主結尾完全有時間破壞詛咒娃娃，但非要等長官殺人後才開始試著要打爆娃娃...WTF?


  最後這一切爛帳都結束了後不到5秒，跳出一幕凱吉對你做鬼臉......


  嗯.....凱吉你他媽就是跟導演一起串通好要來噁心觀眾的就是......


  還說什麼要撒旦萬歲呢?根本就只是要榮耀你自己ㄅ!!!!


  真是被你氣樂了...OOXX


  也就是這最後的一幕讓我擺脫了惡靈線索的PTSD，


  我原以為是編劇導演太爛不知自己在拍什麼的垃圾，


  原來是故意拍垃圾啊.....怎麼不早說呢(笑)



  能享受被惡搞的凱吉粉就去看吧~~


  但如果不是凱吉粉或是沒那麼M的就完全不建議了，


  要論恐怖片絕對有畫面更噁更恐怖的，


  論驚悚片我看到後面解謎部分越看越氣覺得這能叫做解謎嗎?


  早知道去看飛月情海.....哭啊


  --'
