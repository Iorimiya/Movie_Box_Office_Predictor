url: https://www.ptt.cc/bbs/movie/M.1720794927.A.82B.html
title: '[好雷] 長腿'
content: "1. 過程幾乎沒什麼音樂,  有 也是令人不安的短音效\n   幾乎稱不上是電影配樂了, 可想而知有許多的Jump Scare嚇人\n\n2.\
  \ 劇情的編排很棒, 我覺得是我最喜歡的地方\n   總歸來說整個的概念跟故事並不是特別曲折\n   但是一步步釋放劇情的過程卻充滿懸念跟變化球\n   一邊看一邊有WTF的情緒出現\n\
  \n3. 先前的文內很多推文在喊尼可拉斯凱吉勒\n   其實看完後隔外有感, 其實凱吉的確有在預告裡出現\n   只是這次用了特殊的化妝\n   所以乍看之下看不太出來是他\n\
  \n4. 好在凱吉獨特的音色叫聲\n   有稍微拉回一點入戲恐怖的氣氛\n\n5. 鏡頭處理得很漂亮\n\n6. 女主角很漂亮\n   中間那個精神病患的短髮妹子也很正\n\
  \n7. Part1跟Part2是比較優秀的主段\n   壓迫恐怖的感覺讓人很緊張, 讓膽小的我看得很緊繃\n   Part3因為先前有一些小線索已經暗示了共犯跟故事的主軸\n\
  \   所以顯得稍嫌平淡\n   令人驚訝的是凱吉的戲份其實並沒有特別多\n   但都讓人印象深刻, 只是看到Pt3的時候那個特殊妝也沒有那麼恐怖了就是\n\n\
  8. 雖然預告行銷上是拿沈默的羔羊來類比\n   不過要我類比的話, 撇開恐部片的類型,\n   我想拿初看黑暗騎士的觀影經驗來比\n   撇開超級英雄的元素,\
  \ 我覺得兩部電影有類似的DNA在\n\n9. 看到這裡先別急著氣急連噓\n   實話實說, 雖然我覺得又恐怖又好看\n   但是同行的友人卻覺得奇爛無比, 又不恐怖又不好看\n\
  \   就是一群神經病搞來搞去, 也不喜歡撒旦崇拜, 惡魔等理由\n\n\n--\n很多地方都經不起推敲啊\n像是為何要先寄密碼信過去 不都是要靠當天現場的人偶作祟嗎\n\
  還有她媽也沒有理由突然殺探員跟拿像她女兒的人偶出去要開轟\n這些理由事後想似乎都只是為了推進劇情而存在的\n不過看電影嘛\n就是求個進入兩小時的架空故事來娛樂\n\
  這部電影我覺得有達到很好的效果就是了\n可以理解為何影評的評價會較高\n這些影評是連平常文藝片都得啃下去的\n影評評價好的電影多半會勝在別出心裁\n這片的別出心裁是有的,\
  \ 不過這樣子還想要買票的觀眾認同可能會有偏差在\n等到上串流評價應該會下降吧\n這片感覺是適合戲院的"
