title: '[普雷] 所以長腿到底是什麼'
content: '給普雷是因為全體演員演技都在線

  尤其是凱吉，演的很好

  但劇情非常零碎，而且最後結束不夠有張力

  很多事情都用超能力一筆帶過那你前面幹嘛辦案這麼久

  話說長腿到底是什麼？

  一開始凱吉就說我帶著我的長腿

  署名也是長腿，所以長腿是什麼東西，整部片跟長腿這兩個字有什麼關係


  --'
