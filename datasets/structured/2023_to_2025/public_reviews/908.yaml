url: https://www.ptt.cc/bbs/movie/M.1721015973.A.33C.html
title: '[新聞] 《長腿》北美首週末票房衝破 2200萬美元'
content: "《長腿》北美首週末票房衝破 2200 萬美元，打破多項紀錄！片商：《厄夜叢林》以來最\n瘋狂的獨立電影\n\n2024-07-15電影神搜\n\n\
  \n\nNeon 發行的恐怖電影《》引發不小的話題，並在北美創下了 2200 萬美元的票房佳\n績。\n\n這部由奧茲柏金斯執導，以及瑪嘉夢露主演的最新恐怖電影，成功打破了片\n\
  商 Neon 有史以來最高的開片票房紀錄，也成為了繼 2007 年的《\n》之後開片票房最高的作品。\n\n不僅如此，《》還是過去 10 年來第一部開片票房突破\
  \ 2000 萬美元的獨立恐怖電影\n。\n\nNeon 影業在聲明中表示：\n\n「自從 25 年前同樣在 7 月這一週上映的《厄夜叢林》以來，就再也沒有任何一部獨立\n\
  類型電影能夠如此瘋狂地超越外界的一切預期，整個產業似乎認為這是一部『不知道從哪\n裡冒出來的電影』。」\n\n本年度的夏季票房最近表現驚人，目前皮克斯的《》已經成為了\
  \ 2024 年票\n房最高的電影，也是今年第一部突破 10 億美元大關的作品，但照明娛樂的《\n》也來勢洶洶。\n\n\n\n《》不僅已經連續兩週獲得票房冠軍，同時也打破了《》系列的票房\n\
  紀錄。\n\n結算至上週末為止，《》已經帶領整個系列的總票房來到了 50 億美元。\n\n《》在本週末依然穩坐票房冠軍，再次進帳了 4470 萬美元的票房，北美累計\n\
  票房已經達到了 2 億 1110 萬美元。至於國際票房的部分，《》本週獲得了 8\n800 萬美元的票房成績，累計已達 2 億 2670 萬，意味著本片的全球總票房已來到\
  \ 4 億\n 3780 萬。\n\n\n\nComscore Senior Media 分析師 Paul Dergarabedian 表示：\n\n「2024\
  \ 年的夏季持續帶來驚喜與驚奇、以及其他爆米花強檔電影難以預料的票房表現時\n，尼可拉斯凱吉與許多普遍級且闔家觀賞的強檔電影、一部 PG-13 輔導級的恐怖系列電\n\
  影，以及宇宙競速浪漫電影為伴，這些電影都在今年夏天大放異彩，一同組成了影史上最\n多樣化的夏日電影陣容之一。」\n\n新聞網址：\n\n\n\n\n--"
