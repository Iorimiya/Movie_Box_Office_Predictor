content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~








  趁風雨小加上電影院有開

  跑去看長腿

  整齣鏡頭的運用

  還有片名中文字體

  讓我直覺想到了鍾孟宏



  以下有疑問雷







