title: '[負雷]超級大爛片，長腿！ '
content: "先講結論，八個字：\n\n裝神弄鬼，莫明其妙！\n\n前面的氣氛營造得不錯，但也只有這點可以肯定一下。因為氣氛營造完了，\n結果竟然是用惡靈來讓一切合理化，你這他X的根本是犯規好嗎？如果要用\n\
  惡靈來解釋，那什麼天馬行空匪疑所思的劇情不能用惡靈來解釋？然後片\n商還用“沉默的羔羊”來類比這部片。看，你可以不要污辱沉默的羔羊嗎？\n沉默的羔羊是在講惡靈嗎？\n\
  \n總之就是一部大爛片。有懸疑，沒推理，結尾就是用鬼神說來草草結束，\n硬拗瞎掰毫無邏輯，連看串流都是浪費生命。真的浪費了我218元的電影票\n，真是氣死人了！\n\
  \n--\n\n「這世界上不可能會有完全犯罪，因為只要是人做的，就一定會有破綻。」\n\n                                  \
  \          －我是古畑任三郎。\n\n--"
