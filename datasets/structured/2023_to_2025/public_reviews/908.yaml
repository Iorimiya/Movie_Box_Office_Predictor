url: https://www.ptt.cc/bbs/movie/M.1721060377.A.FB9.html
title: '[無雷] 評價兩極的長腿'
content: '我是覺得這部很好看


  詭異的氛圍跟壓迫感都很重，全程滿享受


  但是也能夠理解為什麼很多人不喜歡


  因為他裡面講的很多東西都不清不楚沒頭沒腦


  但其實不要太過在意


  就感受那個感覺就好




  還在觀望的人可能會問到的兩個問題


  Q

  長腿有很多突發驚嚇嗎


  A

  沒有，突發驚嚇都小小的，而且才兩三個，沒有那種大嚇一跳的


  Q

  裡面有那種長得很恐怖的鬼嗎


  A

  沒有，但有別的東西




  這部電影懸疑驚悚，最重要的是氛圍十分詭異，好幾幕都很毛，很值得一看


  評分7.7/10


  -----

  Sent from JPTT on my Google Pixel 6a.


  --'
