url: https://www.ptt.cc/bbs/movie/M.1721012701.A.D26.html
title: '[好雷] 長腿Longlegs'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  跟室友一起看了《長腿》預告片之後，就有打算一起去電影院看。週末在西門町的樂聲影

  城，觀影人潮超乎原本預想，原本一直擔心吃東西的聲音會影響觀影，沒想到開場沒多久

  ，就完全安靜。除了某一幕，一位觀眾情不自禁地發出聲音之外，都十分理想。

  《長腿》大概就是有這樣實力的電影。女主角魅力極高、凱吉的演出令人印象深刻且頗具

  魔性，聲音的運用深得我心。整體來說是值得進電影院感受的好片。


  至於「十年來最恐怖的電影」或是「《沉默的羔羊》之後最佳恐怖片」就還是當作廣告宣

  傳參考就好。個人覺得以恐怖度來說普通，但電影呈現出來的感覺很好，看完後會有印象

  並回味的不是主線，而是它的拍攝，因此覺得算是比較偏向影迷型的電影。




  ***


  這裡是我的樂園




  --'
