url: https://www.ptt.cc/bbs/movie/M.1536726162.A.84F.html
title: '[新聞] 長腿歐巴揮鐵鎚殺人　吃肥13公斤搞壞身體'
content: '新聞網址：


  長腿歐巴揮鐵鎚殺人　吃肥13公斤搞壞身體


  31歲韓國男星郭時暘擁有187公分高挑身形，在夯劇《我的鬼神君》等愛情劇受到歡迎。

  他跳脫過去奶油小生形象，在新片《致命目擊》飾演冷血殺人魔，為了符合角色外型，他

  特地吃胖13公斤，因台詞只有3、4句，全靠著眼神耍狠，讓觀眾嚇到冷汗直流。 《致命

  目擊》描述郭時暘飾演的殺人魔被目睹犯案過程，進而對目擊者展開追逐戰。


  他首度挑戰冷血角色，總台詞加起來只有3到4句，全靠眼神演戲，他說：「台詞本來就很

  少，到現在都還能背出來，但電影透過寫實手法去傳遞生活上的恐懼，我覺得眼神與行動

  反而更讓人感到恐懼。」


  他片中持鐵鎚殺人，加上鐵鎚比想像中還要重，讓他花費許久時間練習。77公斤的他為貼

  近角色，1個半月內增胖13公斤，每天都吃漢堡、炸雞等高熱量食物，他盡情大吃大喝，

  最後搞到胃與皮膚都出狀況，殺青後還得忙著甩肉，他笑說：「我現在一邊在喝高蛋白奶

  昔，一邊在積極鍛鍊身體，現在才減掉10公斤而已。」《致命目擊》9月14日在台上映。

  （陳薇安／綜合報導）


  --

  我是快樂、樂觀，有過N次豐富戀愛經驗的開朗零號男同性戀。


  現在會讓我擔憂的事情，只有爸媽的身體，以及買的股票會不會賠錢。


  --'
