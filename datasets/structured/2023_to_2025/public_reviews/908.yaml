content: '86歲謝賢陪短裙長腿美女漫步海傍？全白西裝有型又減齡 網民仔細觀察揭真相


  2023年04月09日 09:30




  86歲謝賢（四哥）去年7月憑《殺出個黃昏》勇奪金像影帝，當時謝賢行動及反應都被指

  大不如前，更一度傳出他曾經小中風而有些歪嘴。去年8月謝賢仍有出席祝捷會，當時謝

  賢顯得很精神，但之後都未見他再公開露面。直至年初長居加拿大的女兒謝婷婷返港探親

  ，並於IG上載家庭照，才看到謝賢近照。而近日內地社交平台流傳謝賢疑似在內地與一名

  身穿短裙的長腿美女漫步海傍的影片，不少網民大讚他精神非常好，一身白色西裝有型又

  減齡，但有網民經仔細觀察揭開真相。



