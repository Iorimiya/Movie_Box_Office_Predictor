url: https://www.ptt.cc/bbs/movie/M.1720808691.A.889.html
title: '[負雷] 長腿'
content: '女主角是FBI

  每次出任務都嚇尿

  嚴重懷疑她的FBI牌照是雞腿換的


  女主角的上司黑人哥

  看中女主的第六感，聘她一起做長腿專案

  結果女主不小心害證人全滅

  黑人哥很生氣

  看來他的FBI也是雞腿換的


  女主昏厥後，從地下室醒來

  為什麼不睡自己房間

  我到現在還是搞不清楚


  劇中所有人都是怪人

  對比長腿叔叔反而沒那麼怪了

  倒像個中二病患者


  電影開場的表現法很棒

  跑字幕會閃噁圖

  很像fight club 結尾閃屌照


  整部就是本格派詛咒娃娃恐怖片

  中間一長段很無聊

  因為女主跟魯夫一樣

  強項是直覺

  省略了很多辦案該有的推理

  ABCD四條路

  女主會選C

  你問為什麼是C

  她會說因為就是C，也只能是C


  那這部有到很難看嗎？

  其實也還好

  負雷是因為廣告不實


  這部既不恐怖

  和沉默的羔羊也沒關係


  如果是喜歡這種不祥氛圍

  去串流平台把A24的類型作找來看一看

  還是比電影票划算得多











  --'
