title: '[討論] iTunes特價 懸案密碼/驚獄77/地下情/千王'
content: '【2023/09/05 iTunes 特價報】

  第六感生死緣／懸案密碼／仲夏魘／驚獄77／八卦報不報／地下情／東京攻略／千王

  －

  今天趁著各大片商特價的空檔，介紹一些好萊塢以外的特價好片。首先是由推理小說改編

  的丹麥電影《懸案密碼：籠裡的女人》和《懸案密碼：雉雞殺手》的連續兩部特價，不論

  是原作小說和電影都有非常高的評價，推理迷們千萬不要錯過。然後是日法合拍的《311

  ：東京大震盪》，這部主要是以在日法國人的角度出發，描寫在災難發生時，身在東京的

  人們如何反應。畢竟舞台離災害現場很遠，嚴格上來說不算災難片，但有刻劃出危機感爆

  發時人們真實的一面，推薦給大家。

  －

  另外這次因應梁朝偉榮獲威尼斯影展終身成就獎，我們也整理了幾部他參演的作品，主要

  還是以早期的港片為主，有《地下情》裡的情慾流露，也有《東京攻略》裡的幽默耍帥演

  出。不過可惜的是，大家敲碗最多的《射鵰英雄傳之東成西就》和《無間道》都沒特價，

  不知道這次的獲獎有沒有機會推出相關的特價片單。

  －

  以上，祝大家看片愉快！

  －

