title: 'Fw: [情報] 《BLUE GIANT 藍色巨星》6/9 在台上映'
content: "作者: gary8442 (起秋風) 看板: C_Chat\n標題: [情報] 《BLUE GIANT 藍色巨星》6/9 在台上映\n時間: Wed\
  \ May  3 16:15:00 2023\n\n熱賣超過1100萬冊的超人氣作品躍上大銀幕\n\n《BLUE GIANT 藍色巨星》6/9（五） 在台上映\n\
  \n\n\n日本Yahoo電影4.5顆星超高分評價\n觀眾滿意度第一名，好評賣破11億日幣！\n第20屆日本文化廳媒體藝術祭漫畫部門大獎\n第62屆小學館漫畫大獎\
  \ 一般向部門\n\n熱血又激情的青春\n即將響徹大銀幕！\n\n《BLUE GIANT 藍色巨星》\n6月9日（五） 在台上映\n\n  日本Yahoo電影4.5顆星超高分評價，超越《灌籃高手\
  \ The First Slam Dunk》4.3、《\n超級瑪利歐兄弟電影版》4.1、《航海王劇場版：紅髮歌姬》3.8顆星\n 「聽得見聲音的漫畫」熱賣超過1100萬冊的超人氣作品躍上大銀幕！\n\
  \  日本上映首日觀眾滿意度第一名，好評賣破11億日幣！\n  改編自漫畫家 石塚真一 超人氣爵士音樂漫畫\n 《名偵探柯南：零的執行人》《路人超能100》動畫導演\
  \ 立川讓 執導\n  集結 山田裕貴、間宮祥太朗、岡山天音 三位人氣演員豪華獻聲\n  世界知名爵士作曲家兼鋼琴家 上原廣美 傾力打造片中樂曲\n  薩克斯風新星\
  \ 馬場智章、世界級鋼琴家 上原廣美、人氣樂團「millennium parade」\n鼓手 石若駿 擔任幕後演奏樂手\n  全力奏響不會再有的這個瞬間吧\n\n\
  住在仙台的高中生・宮本大（山田裕貴 配音）深受爵士樂吸引，每天都獨自在河邊吹奏次\n中音薩克斯風。畢業後他來到東京，住進了高中同學・玉田俊二（岡山天音 配音）的公寓\n\
  。某日，大在展演空間遇見同齡鋼琴家・澤邊雪祈（間宮祥太朗 配音），並邀請他共組樂\n團，受大影響而開始打鼓的玉田也加入組成3人樂團「JASS」。連樂譜都看不懂，只是一心\n\
  吹奏薩克斯風的大、從小就將一切獻給爵士樂的雪祈、以及初學者玉田，以在日本最好的爵\n士樂俱樂部表演並改變日本爵士樂風格為目標，盡全力投入在音樂活動之中。\n\n\
  \ #藍色巨星\n #車庫娛樂\n\n---\n\nDolby Atmos版本應該會引進吧？不然只能去日本看了~\n\n車庫好好弄別再搞特典轉蛋了\n\n--\n\
  \n\n我剛剛看沒人發就Po了，發完發現居然有人跟我幾乎同時發XD"
