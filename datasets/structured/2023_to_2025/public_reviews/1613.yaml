  連樂譜都看不懂，只是一心吹奏薩克斯風的大、從小就將一切獻給爵士樂的雪祈、以及初學者玉田，以在日本最好的爵士樂俱樂部表演並改變日本爵士樂風格為目標，盡全力投入在音樂活動之中。


