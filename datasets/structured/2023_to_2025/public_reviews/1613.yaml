url: https://www.ptt.cc/bbs/movie/M.1761990507.A.4FD.html
title: '[新聞] 《BLUE GIANT 藍色巨星》11月全台重映'
content: "《BLUE GIANT 藍色巨星》11月全台重映\n\n【大紀元2025年11月01日訊】（大紀元記者鄭舒文報導）曾榮獲第47屆日本電影學院獎最\n\
  佳配樂獎的動畫電影《BLUE GIANT 藍色巨星》，將於11月14日全台重映。改編自石塚真\n一同名漫畫，結合熱血青春與震撼音樂，描繪三位青年組成樂團追夢的動人歷程，感動再\n\
  現大銀幕。\n\n該片由動畫電影版《名偵探柯南：零的執行人》導演立川讓執導；由原作漫畫開始連載時\n就擔任責任編輯的NUMBER 8擔綱編劇；葛萊美獎得主世界知名爵士鋼琴家上原廣美擔任音\n\
  樂監製，並為電影中樂團「JASS」創作三首獨創樂曲與片尾樂曲《BLUE GIANT》，同時負\n責片中所有樂曲的鋼琴演奏。\n\n本片當時在日本上映首日觀眾滿意度第一名，日本Yahoo電影4.5顆星超高分評價，好評票\n\
  房突破12億日幣，並榮獲第47屆日本電影學院獎最佳配樂獎。漫畫原作作家石塚真一觀賞\n完電影後也表示：「如此巨大、真摯的聲音透過大銀幕如實傳達而出，真的非常感謝！」\n\
  \n故事敘述由宮本大（山田裕貴 配音）、玉田俊二（岡山天音 配音）、澤邊雪祈（間宮祥\n太朗 配音）組成的爵士樂團「JASS」以在日本最棒的爵士俱樂部表演為目標，努力投入\n\
  於音樂活動中，交織出令人熱血沸騰、感動至極的精彩樂章。\n\n在片中，山田裕貴為「宮本大」配音，是原作漫畫的超級粉絲。他表示這部作品難以用言\n語定義，越形容越削弱其魅力。他透露自己在讀劇本、看初剪動畫、錄音及觀賞成品時都\n\
  感動落淚，並說：「這部電影真的很厲害，是作品本身的力量。雖不強求觀眾與我產生同\n樣共鳴，但若能傳達那股動搖靈魂的情感，我的工作就很有意義。」\n\n主角「宮本大」在19歲時來到東京組成爵士樂團，對於19歲的回憶，山田裕貴表示：「我\n\
  高中畢業後就從名古屋來到東京，去了演技學校，每天都只專心學習演戲。打工時的名牌\n上還寫著『我會成為演員王』，因為我是個懶惰的人，就以這樣的方式督促自己。」\n\
  \n在本作中為鋼琴家「澤邊雪祈」配音的間宮祥太朗則表示：「觀賞完這部電影後，感受到\n音樂所擁有的力量！人類創造了音樂、電影、藝術的熱情令人讚嘆。」為鼓手「玉田俊二\n\
  」配音的岡山天音則說：「《BLUE GIANT 藍色巨星》以電影這樣新的方式呈現，希望能\n讓更多人看到這部作品，真的很榮幸自己能參與其中。」\n\n責任編輯：劉宇涵\n\
  \n\n\n--\n\n                  \n\n\n\n--"
