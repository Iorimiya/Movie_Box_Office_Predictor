  《BLUE GIANT 藍色巨星》劇情簡介



  住在仙台的高中生・宮本大（山田裕貴 配音）深受爵士樂吸引，每天都獨自在河邊吹奏

  次中音薩克斯風。畢業後他來到東京，住進了高中同學・玉田俊二（岡山天音 配音）的

  公寓。某日，大在展演空間遇見同齡鋼琴家・澤邊雪祈（間宮祥太朗 配音），並邀請他

  共組樂團，受大影響而開始打鼓的玉田也加入組成3人樂團「JASS」。


  連樂譜都看不懂，只是一心吹奏薩克斯風的大、從小就將一切獻給爵士樂的雪祈、以及初

