title: 'Re: [情報] 《BLUE GIANT 藍色巨星》Dolby Atmos版'
content: '放映這部片 Atmos音效版本 的戲院多了 “高雄台鋁秀泰影城” ，高雄的觀眾可參考。




  台中兩家影城上映這片 Atmos (杜比全景聲) 版本的場次時間～


  文心秀泰影城第11廳：早上 11：30


  新時代威秀影城第1廳：下午 17：50


  以上場次時間還是要以影城公告為準，兩家影城時間錯開大家可以依照自己的時間安排，

  兩家影城交通都算方便，新時代威秀在台中火車站附近走路五分鐘內可到達，文心秀泰影

  城也有捷運可以到。


  兩家影城設備，文心秀泰11廳～



  這廳是全台灣唯一的商用 4K LED銀幕影廳畫質很好，音效個人評價普通 (已經沒有剛開

  始那麼棒)， 座位環境舒適，早場票價260元較為便宜。



