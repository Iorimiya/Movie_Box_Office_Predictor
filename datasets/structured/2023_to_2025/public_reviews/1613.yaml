  各位安安，藍色巨星Dolby Atmos版將於7月28日上映啦！

  這次想試試看包音響設備好一點的電影院，但台中最低包場人數須達250人以上

  所以想調查大家的意願，有興趣歡迎填單，調查未達250人即流團


  此包場為拍手場，在表演前、solo結束、樂曲結束可拍手，就當作在現場欣賞live演出吧



  目前詢問電影院包場特殊廳需要百人以上，票價會根據每間影廳的價位而有不同

  時間和電影院還未確定，時間上會以六日為主

  所以想先調查人數是否有達標，若有辦成會盡力爭取官方特典，但不保證會有

  因為尚未簽約票價和廳別可能會有變動


