url: https://www.ptt.cc/bbs/movie/M.1689852815.A.60A.html
title: '[情報] 《BLUE GIANT 藍色巨星》Dolby Atmos版  '
content: '來源:


  　由日本漫畫家石塚真一作品改編，日前在台上映的《BLUE GIANT 藍色巨星》動畫電影

  ，電影公司車庫娛樂終於宣布 Dolby Atmos 版將於 7 月 28 日在台上映的消息。


  《BLUE GIANT 藍色巨星》劇情描寫以「成為世界第一爵士樂手」為目標的主角宮本大（

  山田裕貴 配音），為了追夢來到東京，與同年齡的鋼琴手澤邊雪祈（間宮祥太朗 配音）

  、鼓手玉田俊二（岡山天音 配音），以站上東京第一的爵士舞臺，全力投入在音樂活動

  之中。除了音樂找來葛萊美獎世界知名爵士鋼琴家上原廣美打造外，三位主演的聲優也在

  電影中有舉足輕重的存在。被問及配音過程中困難的地方與有趣的部分為何？山田裕貴表

  示：「雖然我經歷過好幾次聲音的工作，也獲得了許多成長，但這次的工作有種困難到不

  知道這些經驗能否完全發揮出來的感覺。平常會運用視線、表情和動作來傳達，這次只能

  完全傳達給聽覺。還有，雖然會依賴圖片配合角色的表情搭上聲音，但不只是聲音，也必

  須用心才能成立。」


  　《BLUE GIANT 藍色巨星》Dolby Atmos 版本，目前預定將於 7 月 28 日在台上映。此

  外，官方表示只要購買《BLUE GIANT 藍色巨星》7 月 28 日（五）起 Dolby Atmos 版電

  影票 1 張，即可兌換領取特製厚磅電影原版海報 1張。數量有限，送完為止。

  --

  根據車庫FB


