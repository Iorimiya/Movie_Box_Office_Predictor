url: https://www.ptt.cc/bbs/movie/M.1721444968.A.CA0.html
title: '[普好雷] 寂噤計畫其實還蠻好看啊'
content: '各位日安大家好

  昨天很臨時的被同事們cue去威秀

  因為都沒做功課所以隨便挑一部

  可以最快入廳看的電影

  結果進入影廳等待時爬了一下電影版

  靠背全部負雷是怎樣

  我就把負雷的內容推文拿給同事們看

  全部哭笑不得


  但是看完電影出來後…

  包含我總共7個人

  都給出還蠻好看的評價至少不是負雷

  還說ptt反指標喔XD


  先說一下

  就是非常單純的無腦片

  而且我覺得比一般無腦片還要好看很多

  不需要考慮邏輯或當下主角們的選擇

  我唯一出戲的就是車禍一直撞上來極度愚蠢

  現實中不太可能就是

  至少會有人打雙黃燈減速或開霧燈吧？

  而劇情很單純一定猜得到最後大概會剩哪幾個人

  我可能最不喜歡的角色就是屁孩

  不管哪一齣戲只要會四處搞事的小孩我都很賭爛


  大概4這樣，我真的覺得可以看

  沒有其他負雷這麼誇張


  --'
