url: https://www.ptt.cc/bbs/movie/M.1721206947.A.997.html
title: '[負雷] 寂噤計畫-剛看完-不能帶頭腦去看@@'
content: '有點不知道該怎麼評論


  剛在京站威秀看完


  劇情大綱就是一群有攻擊性（？的實驗狗狗


  在要送去撲殺的過程發生的故事


  這齣我看一半就想出去了


  整齣過程會讓人很躁= =


  以下有劇情雷









  ————————————————————————

  1.狗狗攻擊設定


  一開始狗狗可以自行破壞實驗籠的鐵籠


  結果後面被困在全是玻璃的遊覽車出不去？


  2.狗狗智商設定問題


  中間講的那群狗狗智商很高


  會埋伏 會逐一攻破 會把槍咬走


  結果後面看到主角群就變什麼都不會


  3.特勤智商問題


  一群特勤知道要對付的對象是狗


  結果居然不加強頸部跟手的防禦


  全部人被狗咬一下就沒了= =


  再來要撤退不走旁邊沒車的車道


  硬要走很難走的車道？


  4.大橋車禍設定問題


  劇情設定大霧 結果有人在上面飆車= =


  然後橋上大霧 車禍以後也不開閃黃燈


  居然是先尖叫下車 給後車撞…


  最後主角要逃離時 除了兩三具屍體


  其他全部自動消失


  5.主角老闆問題


  完全搞不懂這個人在幹嘛


  要隱瞞計畫也不好好隱瞞


  最後想撿尾刀還被搓破

  ————————————————————————

  反正這齣一堆奇奇怪怪的劇情設定


  然後硬要塞一堆跟親情有關的尷尬戲


  中間穿插反而讓人很躁


  想看李善均的話OK


  想看乖狗狗的話也OK（？


  但這部劇情很不OK= =


  以上分享


  最後曬一下家裡的狗狗平復一下


  --

  想說有狗狗支持一下QQ'
