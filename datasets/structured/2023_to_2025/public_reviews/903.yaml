url: https://www.ptt.cc/bbs/movie/M.1721573210.A.ECF.html
title: '[討論] 寂噤計畫好看嗎'
content: '預告片連結><


  這部片也是李善均的最後遺作之一

  令人懷念又感嘆，這麼優秀的演員，還好大銀幕為我們保留了懷念身影。


  《寂噤計畫》就是你很熟悉的那套怪物突襲驚悚類型，同時抨擊了政府的政治陰謀論。

  為了執行不光採的獵殺計畫，採取非人道主義培育出兇狠實驗生物。最後這個計畫搞砸，

  為了滅絕這群實驗生物，想不到運送過程遇到車禍，導致實驗生物之對橋上人們進行無差

  別攻擊。



  看很多觀眾的評價表示

  跟韓國眾多災難片一樣，主打群演角色

  尤其像《屍速列車》一樣，找來許多配角演繹詭異災難下的人心與人性刻畫(￣▽￣)


  目前還在猶豫要不要去電影看

  還是等上串流平台再看

  好奇大家覺得這部如何？


  --'
