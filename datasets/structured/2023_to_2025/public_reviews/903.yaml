url: https://www.ptt.cc/bbs/movie/M.1721379004.A.4EB.html
title: '[好雷] 寂噤計畫   宇宙第一爆幹超好看'
content: '差點被電影版害到錯過這部好片


  一些人覺得是問題的地方根本不是問題= =


  劇情節奏明快


  開場十多分鐘就馬上進入主線


  特效也不錯不至於覺得很假


  有人覺得小孩聖母


  整場也就救過朱智勛和李善均


  救朱智勛當下就是預告中所演的


  是開後車廂讓朱智勛自己跳進去


  並不是他媽明知道旁邊有狗還自己下車去救


  然後李善均是演小孩的爸爸


  理所當然會拼命去救


  我完全看不出聖母在哪裡= =


  比較覺得有問題的是狗的智商


  可以迅速殺死特工卻無法對付拿火把的普通人


  另外有人認為狗無法從遊覽車脫困不合理


  我的認為是當下研究員沒有筆電


  所以沒辦法控制狗去攻擊聲音來源


  這樣也能解釋開場時脫困的狗怎麼沒攻擊一般人了




  懶得打了


  真的覺得不錯的一部片


  比"水泥烏托邦"好看很多



  --








  --'
