url: https://www.ptt.cc/bbs/movie/M.1721208551.A.BE3.html
title: '[負無雷] 《寂噤計畫》我幹，有夠難看'
content: '在等龍卷風暴前，先看一片墊墊肚子

  哇塞，這什麼大爛片

  這大概是我寫心得文以來

  第一次用到「大爛片」這個詞


  在不該聖母的時候

  編劇給你聖母

  在不該降智的時候

  編劇給你降智

  在不該說話的時候

  編劇給你嘮叨


  看這片腦袋有多痛就有多痛

  吃個普拿疼可能都治不好

  劇情的發展非常智障

  而且是從一開始就這樣

  一直到結尾都是這樣


  整片濃霧也只是為了氣氛需求才搞出來的

  好幾個角色的行動可能連狗都不如

  我真的不知道既然那個那麼重要

  你還不早點撿回來

  降智之極

  相信等等龍捲風暴會變得特別好看


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
