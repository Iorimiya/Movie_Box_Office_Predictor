url: https://www.ptt.cc/bbs/movie/M.1721558805.A.E99.html
title: '[雷] 寂噤計畫 看到睡著'
content: '沒看預告

  兩部片風暴跟寂噤選一部去看

  風暴人太多就看這部

  開頭以為是汪汪版屍速列車

  還以為會很精彩

  結果狗狗的戰鬥力飄忽不定

  開頭把一堆路人雜魚清完就開始待機

  中間補了一堆特戰部隊 跟狗狗開始玩躲貓貓 後來也是把特戰部隊跟剩餘的雜魚清完 又

  繼續待機

  中間就睡著了


  醒來就看主角群就開著車逃出來 就沒了....


  --

  不覺得好看 狗狗太針對性 專殺路人 遇到主角群直接變阿呆 不是待機就是玩躲貓貓 然

  後劇情全部都在隧道跟橋上演 張力大打折扣

  沒看預告 但看得時候就有種屍速列車的調調 問題是除了一開始的連環車禍外 後面都根

  本不緊張 也不刺激 主角光環超重

  結尾豪不意外主角群全部好端端的逃出'
