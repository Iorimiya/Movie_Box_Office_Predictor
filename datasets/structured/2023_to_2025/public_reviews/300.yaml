title: '[新聞] 怪譚搜索(Bloat) 6/6上映 (人肉搜索團隊)'
content: '新聞網址：


  or


  or




  英文片名：Bloat

  類型：奇幻 / 恐怖 / 懸疑

  導演：帕普蘿‧艾森圖Pablo Absento


  “結合民間鬼譚與當代螢幕生活，真實滲入虛構”

  — Comic Book Resources —


  “情緒張力爆棚，撼動人心”

  —　SCREENRANT —


  “視覺效果極其詭絕，氛圍迷離，引人入勝”

  — Cinedump —


  ★ 《人肉搜索》系列原班製作團隊全新沉浸式驚悚鉅獻，穿透銀幕直擊當代生活最無孔

  不入的恐懼蔓延

  ★ 強檔卡司《萬惡高譚市》班傑明‧麥肯錫偕《猛禽小隊：小丑女大解放》寶珍娜‧諾

  娃柯維克聯手演繹，一場家破人亡的詭異災難悄然降臨

  ★ 日系恐怖名導偕同《弒訊》製片人聯手打造，融合日本民間妖怪傳說與現代科技元素

  ，大銀幕體驗沉浸式日式恐怖


  【劇情簡介】

  一場原本溫馨的家庭假期，卻因湖水的召喚墜入惡夢深淵——

  母親帶著兩個兒子赴日旅遊，遠在他方的父親僅能透過視訊陪伴。然而，在一次視訊通話

  中，小兒子竟在湖中離奇溺水，雖死裡逃生，卻彷彿從水底帶回了某種無法言說的「東西

  」。


  他開始出現不屬於這個世界的舉止，言語詭異、眼神空洞，怪異現象層出不窮——聲音、

  幻覺、詭譎夢境……彷彿有另一個存在正逐步滲透他的身體。


  民間禁忌悄然甦醒，父親遠在千里之外，卻從一段段影像中發現這場「意外」並不單純。

  這不只是溺水——是某種附身、是某種古老傳說，在數位與現實之間，隔著銀幕對這一家

  人伸出魔爪。


  螢幕連不回的家人，解不開的詭異訊號，一段真相逐格顯現的超自然危機悄悄蔓延……


  --'
