url: https://www.ptt.cc/bbs/movie/M.1695728709.A.0C8.html
title: '[新聞] 高宇蓁背部全裸「打入國際」《鳳姐》入圍'
content: '新聞網址：





  記者許逸群／台北報導


  「茶室版華燈初上」電影《鳳姐》 傳出捷報，入選第43屆夏威夷國際影展台灣電影焦點

  單元，並入圍「亞洲電影奈派克最佳新導演獎」。女主角高宇蓁得知後感到與有榮焉：「

  第一次當主演的電影就入圍國際影展，很開心也很榮幸！」




  ▲《鳳姐》釋出國際版海報。（圖／后花園數位影像提供）


  電影《鳳姐》今（25日）釋出國際版海報，高宇蓁衣衫半褪，以背部全裸姿態端坐在日式

  屏風前，完美曲線一覽無遺，該畫面雖未露臉，但她依然堅持親自上陣。片中殘酷寫實的

  劇情揭露台灣早期雛妓文化以及人口販賣真相，並深入刻畫台灣茶室私娼生活。




  ▲《鳳姐》深入刻畫台灣茶室私娼生活。（圖／后花園數位影像提供）


  高宇蓁特別提到，《鳳姐》是一個特殊題材的故事，她在片中飾演一名性工作者，劇情中

  有一些較為「激烈」的情慾戲，需要導演和演員雙方的互相信任才能順利拍攝。她很感謝

  導演邱新達給予她足夠的安全感，讓她能安心拍攝。


  高宇蓁甫聽到入圍消息時頗為訝異，心想：「外國人真的能看懂這部具有台灣濃厚在地色

  彩的電影？」她後來深入了解夏威夷國際影展的性質，得知該影展特別關注各地文化。工

  作滿檔的她承諾會排除萬難，期待能在夏威夷參與世界首映並且與當地觀眾相見歡。


  該片由新銳導演邱新達執導，邱新達的短片《不完美的完美》曾入選英國最大的獨立電影

  節雨舞影展。此次以《鳳姐》再度入圍國際影展主競賽，他深感榮幸並感謝所有參與該片

  的演員與工作人員，他希望能透過這部電影對性工作者「去標籤化」。



  --'
