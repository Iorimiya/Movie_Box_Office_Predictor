title: '[新聞] 高宇蓁化身百變鳳姐 打戲不靠替身'
content: "高宇蓁化身百變鳳姐 打戲不靠替身\n\n2024/10/12 05:30\n\n\n《鳳姐》高宇蓁詮釋性工作者完全豁出去，有場被客人打的戲，甚至打到鼻子腫起來。\n\
  （后花園影像製作提供）\n\n〔記者廖俐惠／綜合報導〕電影《鳳姐》昨公布前導預告，女主角高宇蓁為了飾演茶室工\n作者，完全豁出去，不但背部全裸上陣，奉獻多場情慾戲，就連打戲也不靠替身，打到鼻\n\
  子腫起來\n\n\n高宇蓁在《鳳姐》展現多種造型樣貌，最初以樸素鄉下女孩亮相令人印象深刻。\n（后花園影像製作提供）\n\n《鳳姐》由新銳導演邱新達執導，寫實地描繪台灣茶室女子生活，揭露早期雛妓及人口販\n\
  賣的真實故事。高宇蓁坦言片中有多場動作打鬥戲，非常具有挑戰性，開拍前3個月就上\n課準備，她憶及其中一場被客人打的戲，由於不停被打到，但還是得保持表演的狀態，有\n\
  一次對方不小心用頭撞到她的鼻梁，鼻子馬上就腫起來了。當下她超級痛，覺得鼻子可能\n斷了，所幸事後趕緊冰敷才沒有大礙。\n\n電影讓她展現多種造型樣貌，從端莊的日式和服到性感貼身絲質內衣都有，也因此她對飲\n\
  食管理上相當嚴格，幾乎每天只能吃一餐，並盡量避免油膩的食物，對自己要求甚高。\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛  \
  \      是 菩薩\n\n\n\n--"
