title: '[  雷] 電影《鳳姐》心得'
content: "在Hami video上映 且是第二名\n想說來看一下\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n這齣電影的女主角是鳳姐，\n\
  來台北找工作的故事，\n迫於現實的無奈，\n男人不懂得憐香惜玉，\n而懂得憐香惜玉的卻管不住自己的私慾，\n實在有點想說\n \n上圖擷取自裡面演員的Ig，\n\
  而最後女主角的選擇到茶室工作，\n畢竟以前也有這方面的經驗，\n這邊我一開始的想法也是，\n「最後還不是得靠自己身體賺錢」\n但後來想了想，\n外面的男人對你有意思，\n\
  誰知道是不是一時興起，\n誰知道之後會不會始亂終棄，\n萬一發生了什麼都沒了，\n不太有人想做這賭注，\n在茶室工作，每一次都是在你情我願下交易，\n萬一有人敢白嫖，萬哥也是會處理，\n\
  故事的轉折點應該是\n一個未滿18歲的女孩被賣到茶室做生意，\n而當時未滿18歲是不能接待客人的，\n鳳姐告知了警察，警察來處理，\n而在一場爭執下，萬哥失手傷了鳳姐，\n\
  故事的最後，鳳姐回家了，\n回到了他的阿嬤家，\n看到了這裡我也是有些難過。\n \n裡面故事情節幾乎都蠻好懂得，\n除了鳳姐肚子痛的毛病，\n原本以為後續是什麼劇情上的伏筆，\n\
  但後來看完後，\n好像就只是單純的肚子痛而已，\n原來是我想太多了\n \n以上是這齣戲的心得～\n----\nSent from on my iPhone 12\
  \ Pro\n \n--"
