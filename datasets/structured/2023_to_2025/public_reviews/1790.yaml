title: '[新聞] 全球【守護黑面琵鷺】，千億美金劃保護區'
content: '新聞網址：



  由《老鷹想飛》、《尋找神話之鳥》導演梁皆得，跨越30年、遍歷多國拍攝最新紀錄片《

  守護黑面琵鷺》，目前正在全台動人獻映當中。本片所紀錄的主角黑面琵鷺，雖然是台灣

  民眾耳熟能詳的鳥類動物，但隨著本片上映，才讓大家震驚目前黑面琵鷺仍是「全球瀕危

  物種」之一，讓全球各地區的學者專家，不分國界一同為這群「國際嬌客」以及生存棲地

  盡心盡力。不僅南韓仁川為牠們建置新的專屬人工島，寸土寸金的澳門，更仍以保育黑面

  琵鷺的棲地為優先；據導演友人透露，當地光是劃設保護區，地價就高達上千億美金。不

  過台灣也在推動保育工作上不遺餘力，台江國家公園從2020年開始，就和當地養殖業者合

  作，推動「友善棲地營造計畫」，共同為守護黑面琵鷺盡一份心力。





  《守護黑面琵鷺》所紀錄的，是台灣民眾再熟悉不過的黑面琵鷺，從國小課本、家鄉田邊

  到廟宇雕刻，都能看見黑面琵鷺的身影。在眾人的努力下，黑面琵鷺的數量已從2002年的

  969隻，成長到目前突破6000隻，而隨著本片上映，黑面琵鷺仍為「全球瀕危物種」的事

  實，依然震驚不少觀眾。目前黑面琵鷺所出沒的各個地區，學者們也都一同竭盡所能在守

  護著牠們。南韓仁川一處工業區的人工島，因觀察到黑面琵鷺逐漸聚集，甚至出現築巢行

  為，便以人工方式提供巢材，讓築巢數量直線上升，更在2018年時，特別再為黑面琵鷺們

  建置新的專屬人工島。此外，澳門的氹仔濕地也是黑面琵鷺的珍貴棲息地之一，導演梁皆

  得針對該濕地分享：「澳門是個寸土寸金的地方，那邊的開發壓力非常大，有大賭場也有

  大飯店，但澳門政府仍以保育為優先劃設保護區，從朋友那邊聽說那塊地的價值高達上千

  億美金。」



  身為黑面琵鷺度冬數量No.1的台灣，也同樣在黑面琵鷺保育上不遺餘力，台江國家公園從

  2020年開始，就和當地養殖業者合作，推動「友善棲地營造計畫」，申請合作的業者，在

  每年黑面琵鷺度冬時期配合曬平，連續五日以上維持一定的水位高度、不收下雜魚、不驅

  趕鳥類，也協助監測鳥類等友善行為，就能獲得津貼補助與輔導獎勵等，讓民眾能一起為

  「守護黑面琵鷺」盡一份心力。此外，每年在全球的黑面琵鷺出沒地，各地區還會串連起

  來同步進行「全球黑面琵鷺數量普查」，攜手完成這個重要的跨國任務。



  這部由《老鷹想飛》、《尋找神話之鳥》導演梁皆得，跨越30年、遍歷多國拍攝最新紀錄

  片《守護黑面琵鷺》，目前正在全台動人獻映當中。本片描述1992年歲末，一群黑面琵鷺

  在台南七股遭到不明人士惡意槍殺，引發全台民眾高度矚目。當時奉派採訪的攝影家王徵

  吉，自此走上長達三十年的守護黑面琵鷺之路。在當年，全世界黑面琵鷺的總數只有不到

  300隻，這個瀕危物種獲得來自許多國家的關注。不同領域的愛鳥人，以跨國合作的用心

  ，為開拓黑面琵鷺的生存空間披荊斬棘。其中的奉獻者包括學者、繪本作家、賞鳥人、基

  層公務員、養殖業者，以及更多的無名英雄，每個人都有自己的私房黑面琵鷺故事。而專

  情黑面琵鷺三十年的王徵吉，即使經歷喪妻、罹癌等生命逆境，也仍不改其志。如今，全

  球黑面琵鷺數量已經超越6000隻，但牠們並非就此高枕無憂，保育之路仍然持續繼續下去

  …。



  電影包場及團票訂購請洽「采昌國際多媒體」洪先生（電話：02-2658-8868#8505；手機

  ：0901-329-903；信箱：kelvinhong@ccii.com.tw）



  欲知本片最新消息，

  請上「跨越海洋的飛翔」臉書粉絲團



  「采昌國際多媒體」臉書粉絲團


  Instagram專頁查詢。



  --'
