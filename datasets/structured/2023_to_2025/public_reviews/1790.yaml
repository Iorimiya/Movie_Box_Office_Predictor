url: https://www.ptt.cc/bbs/movie/M.1676377112.A.98F.html
title: '[新聞] 【守護黑面琵鷺】台灣影史首度大銀幕呈現'
content: "新聞網址：\n\n\n台灣影史首部登上院線上映的黑面琵鷺生態紀錄片《守護黑面琵鷺》，是《老鷹想飛》、\n《尋找神話之鳥》資深生態攝影大師梁皆得，跨越30年、遍歷多國拍攝的最新力作。不僅\n\
  請來知名導演吳念真深情旁白詮釋，更由金馬獎最佳原創電影音樂獎得主林強打造配樂。\n本片不僅拍鳥也拍人，除了透過黑面琵鷺處境，反思棲地保護、人鳥和平共存等諸多議題\n\
  ，更細膩捕捉多位愛鳥人士，跨越不同國度、鍥而不捨守護黑面琵鷺的真情故事，也讓製\n作團隊選在情人節的今日（2/14）釋出正式海報及預告（\n），並正式定檔3月24日於全台「黑琵Together」上映。值得一提的是，黑面琵鷺大約每\n\
  年二月會開始換上漂亮的繁殖羽，三月中下旬之後會陸續飛離台灣北返繁殖，本片選在黑\n面琵鷺還在台灣的時候上映，更顯得意義十足。\n\n\n\n\n生態保育紀錄片正夯！繼《山椒魚來了》開創首週末票房佳績之後，以「黑面琵鷺」為主\n\
  角的紀錄片《守護黑面琵鷺》也將接力上映。本片透過人稱「黑琵先生」的攝影家王徵吉\n，他探索黑面琵鷺生態的生涯歷程為影片核心，並忠實紀錄一群默默守護黑面琵鷺的學者\n\
  、繪本作家、賞鳥人、基層公務員、養殖業者，以及更多的無名英雄，敘事真切、質樸、\n感性又知性。隨著導演暨資深生態攝影大師梁皆得的鏡頭捕捉，足跡遍佈日本、南韓、越\n\
  南、香港、澳門、中國等地，從人跡罕至的祕境，再到緊繃的南北韓交界停戰區，一窺黑\n面琵鷺繁殖地的神祕樣貌，更探討這群嬌客們面對棲地逐漸喪失的艱困處境。尤其黑面琵\n\
  鷺是台灣家喻戶曉的明星物種，有他們出沒的地方，總是可以看到大批民眾與攝影愛好者\n守候。每年都有超過一半的黑面琵鷺，選擇飛來台灣棲息，也讓台灣可說是牠們度冬最重\n\
  要的家園。\n\n\n在今日釋出的《守護黑面琵鷺》正式海報當中，藍天背景搭上黑面琵鷺的互動畫面，以及\n「一群熱血人們，為守護黑面琵鷺被破壞的棲地而努力」標語，清楚呈現出電影主題。此\n\
  外，本片也邀請到吳念真獻聲相挺，由他一手包辦全片旁白，配樂則由音樂大師林強操刀\n，堪稱年度最高水準的紀錄片。透過預告，吳念真以舒緩的語調，娓娓道來鳥友們在1980\n\
  年代中期發現黑面琵鷺蹤跡，從當時瀕臨滅絕的鳥類，再提及生態保育是場漫長的超級馬\n拉松，搭配震撼又具詩意的空拍鏡頭，絕對是必須透過大銀幕，才得以擁有的震撼與感動\n\
  觀賞經歷。\n\n\n\n\n對於耗時30年打造的作品即將上映，導演梁皆得首先提出哉問：「一個人的興趣能持續多\n久？」他進一步表示：「從1992年黑面琵鷺開始吸引大眾目光以來，至今這30年關於黑面\n\
  琵鷺，有很多的故事，有學者持續不斷進行研究，有喜歡拍照的人花了大筆金錢，跨國全\n心投入拍攝牠們的動人姿態。我們沒有辦法在影片中，把所有跟黑面琵鷺相關的事全部納\n\
  入，只能挑選這30年來持續關心黑面琵鷺的人來作紀錄。」\n\n\n尤其這是導演繼去年紀錄「黑嘴端鳳頭燕鷗」的《尋找神話之鳥》後，「跨越海洋的飛翔\n」四部曲的第二部曲，他坦言：「這是我開始拍攝紀錄片這30年來，一直想要拍攝製作的\n\
  紀錄片。」並且回憶：「記得1989年在中研院動物研究所劉小如老師那裡當研究助理的時\n候，因為幫劉老師收集黑面琵鷺相關的訊息，而有機會接觸黑面琵鷺。直到1992年買了第\n\
  一台16mm攝影機就專程去七股試拍，也疑似拍到一隻被槍打到翅膀而受傷的黑面琵鷺，後\n來三不五時有空想到就會去拍拍牠們，所以一直想拍一部關於黑面琵鷺的紀錄片。」導演\n\
  也對觀眾喊話：「經過30年，現在這部紀錄片終於完成了，也將要在戲院公開給全台民眾\n。請大家進戲院來看看黑面琵鷺在生存上面臨什麼樣的問題，我們可以怎樣幫助牠們，讓\n\
  牠們不要在地球上消失。」\n\n\n這部耗時30年，遍歷多國拍攝，並且是台灣影史首部登上院線上映的黑面琵鷺生態紀錄片\n《守護黑面琵鷺》，即將在3月24日於全台「黑琵Together」上映。本片描述1992年歲末\n\
  ，一群黑面琵鷺在台南七股遭到不明人士惡意槍殺，引發全台民眾高度矚目。當時奉派採\n訪的攝影家王徵吉，自此也走上長達三十年的守護黑面琵鷺之路。在當年，全世界黑面琵\n\
  鷺的總數只有不到300隻，這個瀕危物種獲得來自許多國家的關注。不同領域的愛鳥人，\n以跨國合作的用心，為開拓黑面琵鷺的生存空間披荊斬棘。其中的奉獻者包括學者、繪本\n\
  作家、賞鳥人、基層公務員、養殖業者，以及更多的無名英雄，每個人都有自己的私房黑\n面琵鷺故事。而專情黑面琵鷺三十年的王徵吉，即使經歷喪妻、罹癌等生命逆境，也仍不\n\
  改其志。如今，全球黑面琵鷺數量已經超越6000隻，但牠們並非就此高枕無憂，保育之路\n仍然持續繼續下去…。電影包場及團票訂購請洽「采昌國際多媒體」洪先生（電話：\n\
  02-2658-8868#8505；手機：0901-329-903；信箱：kelvinhong@ccii.com.tw）。\n\n欲知本片最新消息，請上「跨越海洋的飛翔」臉書粉絲團\n\
  \n\n「采昌國際多媒體」臉書粉絲團\n\nInstagram專頁查詢。\n\n\n--\n                                 \
  \     02/14 22:13"
