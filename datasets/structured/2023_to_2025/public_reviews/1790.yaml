url: https://www.ptt.cc/bbs/movie/M.1678292075.A.A3D.html
title: '[新聞] 【守護黑面琵鷺】首映揭台灣總數全球NO.1'
content: '新聞網址：



  由《老鷹想飛》導演梁皆得，跨越30年、遍歷多國拍攝的最新紀錄作品《守護黑面琵鷺》

  ，即將在3月24日於全台隆重獻映。本片選在今晚（3/8）舉辦世界首映，現場除了邀請到

  農委會林務局局長林華慶、中央社董事長劉克襄、衛福部國民健康署前署長邱淑媞，還邀

  請到中華鳥會理事長方偉宏、緯創人文基金會執行長周文玲、前立法委員張曉風、奇美醫

  院醫療副院長田宇峯，以及在本片現身說法的知名生態攝影家王徵吉、高雄市野鳥學會布

  袋鹽田專案經理邱彩綢、屏東科技大學教授孫元勳，與日本黑面琵鷺專家松本悟等人共同

  現身參與，眾人一字排開氣勢十足，也展現出導演的絕佳人緣，讓各界專業人士紛紛站台

  力挺。不僅松本悟特地從日本飛來台灣支持，現場更邀請到兩隻遠方嬌客－－黑面琵鷺「

  親自到場」，跟現場嘉賓一同「黑琵Together」，親自感受黑面琵鷺的模樣。





  紀錄電影《守護黑面琵鷺》，從1992年台南七股的「黑面琵鷺槍殺事件」開始，將台灣家

  喻戶曉的明星鳥種黑面琵鷺全面紀錄，並透過攝影家王徵吉，以及各界愛鳥人士們，攜手

  保育與追蹤，讓黑面琵鷺從當年全球僅有300隻，進展到現在已經超越6000隻的驚人成長

  。此外，本片也探討目前仍為瀕危物種的黑面琵鷺，必須面臨道路開發、光電廠蓋設而導

  致的棲地流失。面對這些問題，導演梁皆得也在今晚的世界首映會上表示：「這部片從

  1992年就開始陸續紀錄，其實30年來發生了很多事情，可惜無法全部收錄於84分鐘之內，

  希望還有機會再出續集將故事延續。」



  而繼《老鷹想飛》與《尋找神話之鳥》之後，再度力挺導演的林務局局長林華慶也特別提

  到台灣「領先國際」之處：「黑面琵鷺幾乎是台灣保育史的一半，牠們在台灣的數量從

  1992年的150隻，成長到最新數量有4228隻，佔了全球2/3的數量。這是台灣各界長期的努

  力，也是推動保育的重要指標物種。」黑面琵鷺在台灣的數量成為全球No.1，但棲地流失

  導致的生態危機，仍然需要大家的重視與關注。同樣對黑面琵鷺有高度關心的中央社董事

  長劉克襄也分享：「梁皆得導演的致詞總是最短，但故事卻最為濃郁，我們是在守護黑面

  琵鷺，但同時黑面琵鷺也正在守護著我們，讓我們能夠重新反思保育、濕地、國際推廣等

  多項問題。」並希望大家看完電影之後，能一起思考黑面琵鷺所帶給台灣的意義。



  首映會上，更驚喜邀請到兩隻來自遠方的嬌客－－黑面琵鷺「親自到場」，讓現場嘉賓又

  驚又喜，感受到黑面琵鷺的珍貴模樣。這兩隻黑面琵鷺，其實是國內知名動物醫師祁偉廉

  與其兒子，協助精心製作的仿真模型假鳥。梁皆得導演透露他們在模型上裝設小型攝影機

  ，得以靠近黑面琵鷺，進而捕捉牠們洗澡等珍貴畫面，讓觀眾們可以近距離欣賞黑面琵鷺

  ，一睹這群國際級明星嬌客的樣貌與行動。





  《守護黑面琵鷺》大獲好評，並且感動各界。許多人都敬佩梁皆得導演，用盡一生心血來

  紀錄鳥類，全心投入又堅持的精神令人讚嘆。在今晚的世界首映會上，本片核心人物－－

  「黑琵先生」王徵吉也特地從南部北上親臨現場。片中捕捉他追索黑面琵鷺的30年生涯歷

  程，以及他在過程中歷經的喪妻之痛，也曾走過罹癌之苦，但王徵吉仍堅持不懈拍攝黑面

  琵鷺，他的故事讓眾人為之動容。王徵吉在首映會上有感而發地表示：「這整整30年的經

  歷中，前20年我戰戰兢兢地走遍黑面琵鷺的繁殖區與度冬區，向當地民眾推廣與教育，而

  接著的10年我罹患大腸癌，很感謝奇美的田副院長救活我，讓我多了現在的10年，希望大

  家有機會能進戲院一起看看這個故事。」梁皆得導演則希望能透過本片，將王徵吉的樂觀

  精神傳遞給眾人，並讓台灣民眾對熟知的黑面琵鷺有更深一層的認識，並期許電影上映後

  ，能有更多人一起加入「守護黑面琵鷺」的行列。



  這部由《老鷹想飛》、《尋找神話之鳥》導演梁皆得，跨越30年、遍歷多國拍攝最新紀錄

  片《守護黑面琵鷺》，即將在3月24日於全台隆重獻映。包場預約請洽包場專線

  02-2658-8868#8505。本片描述1992年歲末，一群黑面琵鷺在台南七股遭到不明人士惡意

  槍殺，引發全台民眾高度矚目。當時奉派採訪的攝影家王徵吉，自此走上長達三十年的守

  護黑面琵鷺之路。在當年，全世界黑面琵鷺的總數只有不到300隻，這個瀕危物種獲得來

  自許多國家的關注。不同領域的愛鳥人，以跨國合作的用心，為開拓黑面琵鷺的生存空間

  披荊斬棘。其中的奉獻者包括學者、繪本作家、賞鳥人、基層公務員、養殖業者，以及更

  多的無名英雄，每個人都有自己的私房黑面琵鷺故事。而專情黑面琵鷺三十年的王徵吉，

  即使經歷喪妻、罹癌等生命逆境，也仍不改其志。如今，全球黑面琵鷺數量已經超越6000

  隻，但牠們並非就此高枕無憂，保育之路仍然持續繼續下去…。



