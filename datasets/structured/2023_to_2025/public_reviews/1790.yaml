title: '[新聞] 陳昇現身【守護黑面琵鷺】番外篇"要報仇"'
content: '新聞網址：



  由台灣資深生態攝影大師梁皆得執導的「跨越海洋的飛翔」第二部曲《守護黑面琵鷺》，

  即將在本週五（3/24）於全台隆重獻映。本片日前舉辦首映，映後感動無數觀眾，透過導

  演長達30年的紀錄，捕捉黑面琵鷺的處境，以及守護黑面琵鷺人們的心血，讓本片已在各

  界屢獲好評，加上導演本身的好人緣，讓本片湧入大量的預售與包場，尤其多達近40場的

  包場，更是讓本片還未正式上映，就已經累積突破百萬票房佳績！也因為30年的長時間紀

  錄，大量的影像素材讓導演勢必要有所取捨，無法將所有精彩的訪談與畫面全數網羅到電

  影當中，也讓劇組今天特別釋出「番外篇」的漏網彩蛋影像（

  ）。只見影像中驚喜看到「寶島歌王」陳昇現身，原來同

  樣關注社會議題的他，曾在1997年推出〈黑面鴨要報仇〉一曲，期望大家都能一起進戲院

  支持本片，也能一同加入守護黑面琵鷺的行列。





  《守護黑面琵鷺》以1992年台南七股的「黑面琵鷺槍殺事件」為起點，前後耗時30年捕捉

  ，透過各界愛鳥人士的熱血付出，全面紀錄黑面琵鷺的樣貌，也帶出因棲地不斷流失，使

  得這群鳥類失去家園的困境，為這些以台灣為家的黑面琵鷺們發聲。本片日前舉辦首映，

  獲得各界高度好評，就連台北市文化局長蔡詩萍也搶先觀賞，並有感而發地在自己的臉書

  上表示：「梁皆得導演做了了不起的『寫傳』工作，為守護黑面琵鷺的人寫了傳，也為王

  徵吉身後那一群群，跨越國境的黑面琵鷺守護者留下了身影。」蔡詩萍更讚道：「這是一

  部好看的紀錄片，讓我們知道愛台灣，護生態，也是一場漫長的付出，寂寞的守候，內心

  永遠年輕的堅持。」值得一提的是，本片在正式上映前，就不斷接獲來自各機關行號的包

  場與預售詢問，包場活動更直逼近40場，並已經陸續展開各式各樣的包場放映，這也讓本

  片還沒在戲院正式上映，就已經突破百萬票房佳績！





  耗時30年拍攝而成的《守護黑面琵鷺》，訪問過的對象，以及累積的拍攝素材都相當可觀

  ，然而無法在84分鐘的篇幅中完整呈現，讓導演梁皆得直呼可惜。不過他也特別剪輯出漏

  網彩蛋的番外篇，只見「寶島歌王」陳昇便在影像中現身說法。原來他曾在1997年推出〈

  黑面鴨要報仇〉這首單曲，推出時正是七股反濱南工業區運動的盛行時期，由於該地為石

  化重工業開發地區，同時也與黑面琵鷺的棲息地有高度重疊，因此開發行動收到各界的反

  彈聲浪，也促使「國際黑面琵鷺救援聯盟S.A.V.E」的成立。



  陳昇關注社會議題的形象眾所皆知，因此受到邀請，加入聲援黑面琵鷺搶救行動的一員，

  因此誕生出〈黑面鴨要報仇〉這首推動環境保育的經典歌曲。本片在製作過程中蒐集到這

  首歌曲，導演也因此邀請陳昇一同為「守護黑面琵鷺」做推廣。談到合作過程，梁皆得導

  演回憶：「陳昇大哥是個很隨和的人，我們詢問能否使用他的音樂，他說：『如果唱片公

  司可以就可以，我沒有問題。』讓我們很有效率地完成了這次的訪談。」而陳昇也特別在

  這支番外篇透露創作緣起：「當時整個政治體比較重經濟、重商，農的跟藝文的事件都比

  較疏離。當時黑面琵鷺事件有點要起來的時候，我們的領導者就說：『大概是十幾隻鳥有

  什麼關係啊？』我就覺得這當然有關係啊，因為所有的物種都是有連動的，所以我們來寫

  一個黑面琵鷺的歌吧。」他並進一步補充：「我們比較懂流行的通路，台灣會比較多人知

  道，所以到最後衍伸的就是有一、兩個演唱會，可以告訴全台灣說有這回事。」



  這部由《老鷹想飛》、《尋找神話之鳥》導演梁皆得，跨越30年、遍歷多國拍攝最新紀錄

  片《守護黑面琵鷺》，即將在本週五（3/24）於全台隆重獻映。本片描述1992年歲末，一

  群黑面琵鷺在台南七股遭到不明人士惡意槍殺，引發全台民眾高度矚目。當時奉派採訪的

  攝影家王徵吉，自此走上長達三十年的守護黑面琵鷺之路。在當年，全世界黑面琵鷺的總

  數只有不到300隻，這個瀕危物種獲得來自許多國家的關注。不同領域的愛鳥人，以跨國

  合作的用心，為開拓黑面琵鷺的生存空間披荊斬棘。其中的奉獻者包括學者、繪本作家、

  賞鳥人、基層公務員、養殖業者，以及更多的無名英雄，每個人都有自己的私房黑面琵鷺

  故事。而專情黑面琵鷺三十年的王徵吉，即使經歷喪妻、罹癌等生命逆境，也仍不改其志

  。如今，全球黑面琵鷺數量已經超越6000隻，但牠們並非就此高枕無憂，保育之路仍然持

  續繼續下去…。



