url: https://www.ptt.cc/bbs/movie/M.1677248230.A.1D6.html
title: '[新聞] <守護黑面琵鷺>一窺"黑琵先生"王徵吉30年'
content: '新聞網址：



  台灣資深生態攝影大師梁皆得，繼《老鷹想飛》與《尋找神話之鳥》之後，推出歷時30年

  、走訪多國拍攝的全新力作《守護黑面琵鷺》，成為台灣影史首部躍上大銀幕的黑面琵鷺

  生態紀錄片，即將在3月24日於全台「黑琵Together」上映。本片不僅紀錄黑面琵鷺的樣

  貌與環境，更捕捉不同愛鳥人士對黑面琵鷺的熱血付出。其中透過以拍攝黑面琵鷺而聞名

  的「黑琵先生」王徵吉，他追索黑面琵鷺數十年的生涯歷程為核心，一窺他喪妻、罹癌卻

  仍堅持不懈的人生故事。尤其他隱瞞自己罹癌的事實，帶導演前往日本捕捉黑面琵鷺雪景

  ，卻把開刀與住院通通推遲，讓導演印象非常深刻。他對黑面琵鷺的熱情，以及不愧對「

  黑琵（Happy）先生」的樂觀態度，就連主治醫生都直呼：「這是他抗癌成功的一個重要

  關鍵。」





  王徵吉本身就是充滿故事性的人物，過去曾在報社擔任攝影記者，1992年發生震驚各界的

  「台南七股黑面琵鷺槍擊事件」，他被分派前往當地拍攝，因此跟黑面琵鷺展開數十年的

  緣分，並從此踏上守護黑面琵鷺的旅程。當他決心要前往世界各地，捕捉琵鷺家族們的身

  影，卻在拍攝首站南非遇上嚴重意外，而陪同他一起出國的太太也在該次意外中離開…。

  回憶起這段悲傷過往，王徵吉坦言：「我大概沉寂了一整年，連相機都不敢碰。」拍攝計

  畫停擺一年後，王徵吉在各方親友的鼓勵下，重新拾起相機，像是為了實現跟太太的約定

  ，繼續踏上這段未完成的旅程。而在拍攝過程中，他痛的不只是心，更有荷包損失的痛。

  他曾在拍攝過程中，一個不小心摔落泥地，讓要價45萬元的專業攝影器材泡湯。當他談起

  這段往事，也笑稱自己摔倒時，第一個要旁人搶救的，不是受傷的自己，反而是相機，不

  僅充分展現他對拍攝的熱愛與重視，更讓人感受到他的開朗性格。



  此外，王徵吉的樂觀態度，更在日後成為救他一命的關鍵！2012年時，王徵吉被診斷罹患

  大腸癌第三期，為了帶《守護黑面琵鷺》導演梁皆得捕捉罕見的黑面琵鷺雪景，更隱藏自

  己身體不適的病況，索性就飛去日本，並將開刀與住院事項通通推遲。不過整趟拍攝旅程

  ，依然表現一貫的開朗樣貌，而他也用不愧對「黑琵（Happy）先生」的樂觀態度，走過

  無數次艱苦的抗癌療程，就連主治醫生都直呼：「這是他抗癌成功的一個重要關鍵。」





  在王徵吉的職業生涯中，他見證黑面琵鷺在保育之下的逐漸成長，卻也目睹棲地變化正深

  深威脅著黑面琵鷺的生存，甚至成為一大危機。2002年12月時，台南七股發生「黑面琵鷺

  集體肉毒桿菌中毒事件」，王徵吉也加入搶救行動當中。面對大量黑面琵鷺在眼前倒下的

  危急情況，他說道：「搶一秒鐘就救一條命，趕快下去把牠們抱上來，一共就抱了十幾隻

  。」回顧當時病亡的黑面琵鷺數量將近100隻，雖然看似數目不多，但當年台灣的黑面琵

  鷺總數不到600隻，已經佔有極高比例，這也反映棲地的縮減，讓黑面琵鷺密集聚在同一

  塊土地，只要有一次危機來臨，就可能釀成非常嚴重的後果。



  王徵吉飛到世界各地，捕捉不同時期與季節的黑面琵鷺景象，也結識來自香港、南韓、日

  本等地的黑面琵鷺專家。縱使語言不通，但靠著同樣熱愛黑面琵鷺的心，相談甚歡成為多

  年好友。這三十年間，王徵吉前後造訪形人坨四十次，才終於捕捉到黑面琵鷺下蛋的珍貴

  瞬間，更練就一身可以預測黑面琵鷺行為的技能，是十足的PRO級人物！雖然如此，王徵

  吉表示自己的任務尚未完成：「我想把黑面琵鷺整個全紀錄，從所有繁殖區一直到所有度

  冬區，把牠整個紀錄下來，留給我們的下一代，當一個黑琵的生態史，所以我很努力地活

  著每一天！」而他的這段旅程，也將透過《守護黑面琵鷺》一覽無遺。



  這部耗時30年，遍歷多國拍攝黑面琵鷺生態，並紀錄「黑琵先生」王徵吉人生故事的《守

  護黑面琵鷺》，即將在3月24日於全台「黑琵Together」上映。本片描述1992年歲末，一

  群黑面琵鷺在台南七股遭到不明人士惡意槍殺，引發全台民眾高度矚目。當時奉派採訪的

  攝影家王徵吉，自此也走上長達三十年的守護黑面琵鷺之路。在當年，全世界黑面琵鷺的

  總數只有不到300隻，這個瀕危物種獲得來自許多國家的關注。不同領域的愛鳥人，以跨

  國合作的用心，為開拓黑面琵鷺的生存空間披荊斬棘。其中的奉獻者包括學者、繪本作家

  、賞鳥人、基層公務員、養殖業者，以及更多的無名英雄，每個人都有自己的私房黑面琵

  鷺故事。而專情黑面琵鷺三十年的王徵吉，即使經歷喪妻、罹癌等生命逆境，也仍不改其

  志。如今，全球黑面琵鷺數量已經超越6000隻，但牠們並非就此高枕無憂，保育之路仍然

  持續繼續下去…。



  電影包場及團票訂購請洽「采昌國際多媒體」洪先生

