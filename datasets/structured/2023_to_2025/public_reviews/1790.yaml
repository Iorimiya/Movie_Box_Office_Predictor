url: https://www.ptt.cc/bbs/movie/M.1677606573.A.254.html
title: '[新聞] 吳念真0酬勞獻聲<守護黑面琵鷺>:談錢天道'
content: '新聞網址：



  曾主持《台灣念真情》給予民眾珍貴回憶、有「台灣最會說故事歐吉桑」之稱的導演吳念

  真，繼《老鷹想飛》之後，二度攜手資深生態攝影大師梁皆得，為即將在3月24日上映的

  新片《守護黑面琵鷺》「獻聲」旁白演出，娓娓述說著黑面琵鷺，以及一群默默守護牠們

  的人物的生命故事。尤其吳念真對生態環境的重視，以及跟梁皆得的好交情，讓他這回不

  收費用「零酬勞」力挺，甚至從電影初剪就提供諸多建議，可說是默默守護本片的幕後功

  臣之一。對此，吳念真今日（2/28）接受訪問時表示：「如果能有幫助環境的地方一定要

  幫，我能做的不多，而這是我唯一能幫忙的事情，所以如果再跟他們收酬勞，談錢的事簡

  直天理不容。」而他更透過今日曝光的真情推薦影像（）

  ，向觀眾表達自己的期望：「我希望大家看完這部電影的時候，能敬重你身邊所有的事物

  ，敬重你身邊所有的環境，也敬重你身邊跟你一起活過這個世界的所有生物。」





  《守護黑面琵鷺》是台灣資深生態攝影大師梁皆得，繼《老鷹想飛》與《尋找神話之鳥》

  之後，推出歷時30年、走訪多國拍攝的全新力作，透過人文環境紀實方式呈現，由導演吳

  念真旁白主述，也成為台灣影史首部躍上大銀幕的黑面琵鷺生態紀錄片。這也是吳念真繼

  《老鷹想飛》擔綱旁白之後，二度跟梁皆得合作「獻聲」演出，更情義相挺不收酬勞，甚

  至從電影初剪就參與編排意見，直到本片即將上映也積極協助宣傳。他與導演梁皆得今日

  （2/28）接受訪問，回憶起這段過往表示：「這部片從人物出發，他們花了一輩子來調查

  這些鳥，我很佩服他們把所有的精力都花在這上面。」據悉，忙碌的吳念真是在舞台劇演

  出結束後，才開始參與本片的旁白錄製，電影84分鐘的片長，約花費三、四的小時完成錄

  製，可說是非常有效率的配音，也可從中看出他與導演梁皆得二度合作的默契。





  吳念真也表示自己透過配音，關心環境也一邊拓展視野，看見黑面琵鷺飛至各個地區的故

  事，引發他對人類掠奪、與動物共存等更多環境相關思考。他也進一步表示：「如果能有

  幫助環境的地方一定要幫，我能做的不多，而配音是我唯一能幫忙的事情，所以如果再跟

  他們收酬勞，談錢的事簡直是天理不容。」導演則補充：「起初還是有跟吳導談到配音費

  用的計算，但吳導說不用跟他談錢的事情。」雖然本次是無酬勞協助配音，然而吳念真也

  開心地分享：「不過梁導有送我兩瓶黑面琵鷺特別版紀念威士忌，但被我兒子拿去喝了，

  然後還傳訊息跟我說『好喝』。」此外，在提及本片主角「黑面琵鷺」時，吳念真其實早

  就跟黑面琵鷺有著深刻淵源，表示當初在拍《台灣念真情》時，就已經拍攝過黑面琵鷺，

  他說道：「我很喜歡黑面琵鷺，牠們在南部又被稱為『喇杯』，嘴巴像湯匙一樣在水裡尋

  找、覓食，就像我們的生活一樣，到處在找機會與可能性，所以這個名字和我們很接近，

  我很喜歡。」



  這部耗時30年，遍歷多國拍攝黑面琵鷺生態，並由導演吳念真深情旁白的《守護黑面琵鷺

  》，即將在3月24日於全台「黑琵Together」上映。本片描述1992年歲末，一群黑面琵鷺

  在台南七股遭到不明人士惡意槍殺，引發全台民眾高度矚目。當時奉派採訪的攝影家王徵

  吉，自此也走上長達三十年的守護黑面琵鷺之路。在當年，全世界黑面琵鷺的總數只有不

  到300隻，這個瀕危物種獲得來自許多國家的關注。不同領域的愛鳥人，以跨國合作的用

  心，為開拓黑面琵鷺的生存空間披荊斬棘。其中的奉獻者包括學者、繪本作家、賞鳥人、

  基層公務員、養殖業者，以及更多的無名英雄，每個人都有自己的私房黑面琵鷺故事。而

  專情黑面琵鷺三十年的王徵吉，即使經歷喪妻、罹癌等生命逆境，也仍不改其志。如今，

  全球黑面琵鷺數量已經超越6000隻，但牠們並非就此高枕無憂，保育之路仍然持續繼續下

  去…。



