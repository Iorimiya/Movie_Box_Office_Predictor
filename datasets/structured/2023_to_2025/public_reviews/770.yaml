title: '[新聞]<當我的指尖觸碰到你的溫度時>2台片助演員'
content: '新聞網址：



  繼《語意錯誤》之後，又一南韓人氣BL劇《非意圖的戀愛談》，透過全新故事的衍伸電影

  《當我的指尖觸碰到你的溫度時》，即將在本週五（10/4）於台灣心動獻映。本片請來以

  《經常請吃飯的理事大人》、《想咬一口的嘴唇》等劇被觀眾譽為「值得信賴的BL女導演

  」楊慶熙執導。她透露本片的拍攝準備期很短，為了讓兩位男主角元太珉、燾宇可以快速

  進入角色狀態，特別指名要兩人事先觀賞《盛夏光年》、《刻在你心底的名字》這兩部經

  典台灣同志題材電影。不僅如此，她更找來《非意圖的戀愛談》男主角之一，同時也是人

  氣男團「B1A4」成員孔燦驚喜客串演出，讓觀眾們看得又驚又喜。





  電影《當我的指尖觸碰到你的溫度時》，是2023年南韓人氣BL劇《非意圖的戀愛談》的衍

  生電影，將劇情聚焦在《非》劇CP「浩泰」與「東熙」，兩人在學生時代的原創愛情故事

  ，更集結原始演員元太珉、燾宇再續前緣繼續演出。其中演繹「東熙」一角的燾宇，曾演

  出過《搜查班長1958》、《武林學校》、《我的完美新娘》、《Dear. M》等劇，以帥氣

  的外貌、愉快的性格擄獲大批女性粉絲的心，並被業界譽為是當今值得關注的男演員之一

  。這回他細膩詮釋出角色喜歡一個人，卻又壓抑自己喜愛對方的心意，結果卻屢屢受到對

  方傷害的心情，也將讓觀眾隨著劇情發展，為他的角色感到相當不捨。



  燾宇自認「東熙是我人生中無法忘懷的角色」，他也同時透露接演原因：「讀完劇本並了

  解角色之後，我覺得東熙這個角色深深打動了我，覺得他跟我有很多相似之處，所以很想

  演出這個角色。」尤其這回從《非》劇的配角扶正成為主角，他也興奮表示：「雖然有負

  擔感，但當拿到劇本的時候真的非常高興，演完《非意圖的戀愛談》之後還能再次演繹東

  熙，讓我充滿了感謝。」





  值得一提的是，《當我的指尖觸碰到你的溫度時》請來擅長打造美麗影像，以及細膩刻畫

  人物心境的女導演楊慶熙執導。她曾透過《佛羅里達飯店》、《想咬一口的嘴唇》、《經

  常請吃飯的理事大人》、《農情DoReMi》等多部充滿多樣化情感的BL作品，在粉絲群中獲

  得高度信賴感。這回接下本片導演一職，她也強調這次的執導重點就是「畫面營造」：「

  一邊寫劇本，一邊想用手持攝影拍攝這部作品，想透過攝影機展現出角色不安和不成熟的

  生疏感情，也想通過自然光展現出角色的青春樣貌，因此定下了這個拍攝風格。」她也找

  來《語意錯誤》攝影導演安謙書合作，共同透過絕美攝影打造出這部超乎期待的作品。



  攝影之外，導演也特別在乎兩位男主角的互動與化學反應，她透露：「拍攝準備時間很短

  ，希望演員能去看一些我提出的參考電影，例如《盛夏光年》、《刻在你心底的名字》等

  片。」也因為《非意圖的戀愛談》獲得全球觀眾的熱愛，她更「加碼」讓《非》劇男主角

  孔燦驚喜客串本片，以學生角色在片中露臉。導演對此表示：「看了剪輯版之後，反而覺

  得他的出現，可以讓角色關係更加突出。」至於談到如果《非意圖的戀愛談》推出續集，

  會想要為「浩泰」與「東熙」寫些什麼故事實，導演也笑稱：「應該能譜出甜蜜的模樣吧

  ，尤其這次呈現他們在高中的魯莽模樣，如果可能的話，希望之後能呈現出他們成年後的

  魯莽。」



  這部備受觀眾期待的南韓話題BL電影《當我的指尖觸碰到你的溫度時》，即將在本週五（

  10/4）於台灣心動獻映。台灣發行商也推出「入場特典」，只要購買本片電影票乙張，憑

  電影票於上映日起至原購票影城，即有機會獲得「電影原文A3主視覺海報」乙張，數量有

  限，送完為止。本片劇情描述浩泰（元太珉飾演）和東熙（燾宇飾演）從小如兄弟般一同

  長大，幾年前搬到首爾的浩泰，在父親的葬禮後重返江陵。另一方面，東熙在出櫃後被逐

  出家門，獨自住在浩泰的空房當中。也因為浩泰的回歸，讓多年不見的兩人重逢，並居住

  在同一個屋簷下，也讓東熙對初戀情人浩泰，那沉寂已久的心再度雀躍起來，並試圖壓抑

  自己的感情。反觀浩泰也對許久未見的東熙，產生前所未有的情愫。為了擺脫對東熙混亂

  的情感，浩泰試著隨便跟女生展開交往，而東熙也對浩泰如此輕率的態度感到受傷。兩人

  脆弱的感情關係，因為一次意外事件而逐漸開始改變…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
date: 2024-10-02
