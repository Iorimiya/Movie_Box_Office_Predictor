url: https://www.ptt.cc/bbs/movie/M.1727351754.A.BF9.html
title: '[新聞] <當我的指尖觸碰到你的溫度時>近滿分好評'
content: '新聞網址：



  繼《語意錯誤》之後，又一南韓人氣BL劇《非意圖的戀愛談》，透過全新故事的衍伸電影

  《當我的指尖觸碰到你的溫度時》，即將在10月4日於台灣心動獻映。全片唯美畫面、細

  膩情感、顏值帥哥、甜寵灑糖、江陵美景匯聚，並由《非》劇人氣CP元太珉、燾宇再續前

  緣繼續演出。曾在《黑幫的我成了高中生》一劇詮釋男主角忠心助手的元太珉，這回在本

  片演繹游泳健將，除了積極鍛鍊身體大秀好身材外，更展現歌喉演唱電影插曲〈What If

  〉，滿足觀眾視覺與聽覺雙重享受。元太珉表示本片劇情相當有趣，一口氣就讀完劇本：

  「這個角色太有吸引力，讓我想要來詮釋他。」





  電影《當我的指尖觸碰到你的溫度時》，是2023年南韓人氣BL劇《非意圖的戀愛談》的衍

  生電影，將劇情聚焦在《非》劇CP「浩泰」與「東熙」，兩人在學生時代的原創愛情故事

  ，更集結原始演員元太珉、燾宇再續前緣繼續演出。本片由《經常請吃飯的理事大人》、

  《想咬一口的嘴唇》導演楊慶熙，以及《非意圖的戀愛談》、《在你視線停留的地方》編

  劇申智安共同打造，也因為是全新原創故事，對即使沒觀賞過《非》劇的觀眾來說，都不

  會因為劇情連貫問題而產生看不懂的疑慮。透過這對人氣BL作品編導的攜手合作，將以細

  膩又唯美的手法，刻畫出浩泰與東熙更多的愛情故事，展現更加感性的氛圍與餘韻，再配

  合《語意錯誤》攝影導演安謙書的絕美攝影，共同打造出這部超乎期待的作品。



  尤其本片在南韓上映之後，也獲得觀眾廣泛支持，不僅進戲院進行多刷觀賞，更在兩大電

  影網站「Naver」與「CGV」，分獲9.21分與9.6分的超高金雞蛋指數，觀眾看完紛紛直呼

  ：「像輕緩流淌的詩，細膩又美麗！」「超级無敵好看，真的是神作！」「好看到我流淚

  ！」再度證明本片的高品質，絕對是喜愛BL與愛情電影的觀眾，絕對不容錯過的年度必看

  之作。





  《當我的指尖觸碰到你的溫度時》男主角之一的元太珉，日前因為演出戲劇《黑幫的我成

  了高中生》當中，由李瑞鎮飾演「金德八」的助手「東秀」一角，以忠心耿耿的形象深獲

  觀眾喜愛。這回在本片繼續詮釋「浩泰」一角，與燾宇所飾演的「東熙」在學生時代久別

  重逢，彼此產生難以言喻的微妙情感變化。對於有機會演出這部作品，元太珉回憶：「一

  家曾看到我演出作品的製作公司聯繫了我，說這個角色看起來很適合我，所以想約我聊聊

  。在這之前，我很緊張地閱讀故事，覺得內容相當有趣，一口氣就讀完了。尤其浩泰這個

  角色很有吸引力，讓我想要飾演他。」



  特別是元太珉為了突出片中「游泳明日之星」的角色設定，不僅游泳場面親自上陣，更因

  為要在片中秀身材，讓他在塑造身材方面下了許多功夫，觀眾也將在片中親睹他健壯的手

  臂、胸肌、腹肌，讓觀眾情不自禁眼冒愛心。此外，他更大展歌喉，演唱本片插曲〈

  What If〉，以纏綿悱撤的深情嗓音，擄獲所有觀眾的心，更滿足了大家視覺與聽覺的雙

  重享受。



  這部備受觀眾期待的南韓話題BL電影《當我的指尖觸碰到你的溫度時》，即將在10月4日

  於台灣心動獻映。全片劇情描述浩泰（元太珉飾演）和東熙（燾宇飾演）從小如兄弟般一

  同長大，幾年前搬到首爾的浩泰，在父親的葬禮後重返江陵。另一方面，東熙在出櫃後被

  逐出家門，獨自住在浩泰的空房當中。也因為浩泰的回歸，讓多年不見的兩人重逢，並居

  住在同一個屋簷下，也讓東熙對初戀情人浩泰，那沉寂已久的心再度雀躍起來，並試圖壓

  抑自己的感情。反觀浩泰也對許久未見的東熙，產生前所未有的情愫。為了擺脫對東熙混

  亂的情感，浩泰試著隨便跟女生展開交往，而東熙也對浩泰如此輕率的態度感到受傷。兩

  人脆弱的感情關係，因為一次意外事件而逐漸開始改變…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
