title: '[好雷] 陰陽路之我在你左右'
content: '(有雷空一頁)


  本文談的不是現正上映的常在你左右喔，


  而是陰陽路第二集的我在你左右。























  其實這部戲回頭看，


  我覺得算是港產恐怖片中數一數二嚇人的。


  而且結局也是最毛的：幾乎所有主要角色都死了。




  故事其實維持了港產鬼片那種因果關係的基本邏輯。


  一開始，古天樂騎車撞了一個"紅衣女鬼"，


  然後故事接續下去，


  原來古天樂，雷宇揚跟丁子峻都是廣播電台一個講鬼節目的製作團隊，


  這個故事就圍繞在這三個人身上，


  成了三段故事。




  我很喜歡這種分三段的港產恐怖片，


  這種被戲稱為"斬件式"鬼片的片種，


  其魅力在於故事很短，但是彼此都有所聯繫，


  而往往有一個整體的故事包覆在這三個看似獨立的故事之上。




  故事發生在丁子峻演的主持人講到一個故事，


  是一個男子在別人後巷隨地小便，結果尿到神牌，


  之後被由樓上往下丟的玻璃瓶給砸死的故事，


  警告大眾不要隨便小便，


  就算你喝得有多醉有多尿急都好。




  結果接下來的call in時間，


  有個叫做Anita的女子call in進來，


  聲稱前面丁子峻講的故事是真的，


  死者就是她的男朋友，


  爛醉如泥的Anita問丁子峻有什麼辦法能見到男朋友。




  結果不勝其煩的丁子峻就隨口叫Anita自殺，


  說自殺就能見到男友了。


  在旁邊的古天樂跟雷宇揚聽到整個嚇到了，


  說你怎麼可以在節目上教唆自殺，


  於是良心不安的丁子峻就到Anita聲稱的現場去看看情況。




  結果就這麼巧，


  從樓上跳下來的Anita就摔在丁子峻的車上，死在他眼前。


  若干天之後的節目現場，Anita打來質問丁子峻，


  說自己照了他的方法自殺了，可是依然沒有見到男朋友。




  之後丁子峻到Anita家去，希望能替她做一些事情好減輕罪惡感，


  結果Anita的媽媽帶他到Anita房裡面，他便帶走了Anita的日記。


  從此之後他除了看那本日記，


  其他什麼事情都不做，也深深地迷上了Anita。




  終於，在Anita的誘導下，他在同樣的地方，


  跟著跳了下去。有情人終成眷屬，可喜可賀可喜可賀。




  (這裡又有個伏筆，Anita的媽媽出現，收走了那本日記)




  三人死了一人，


  照道理節目也開不下去了。


  但是電台老闆不肯放手，因為丁子峻一死，


  這個恐怖節目的收聽率馬上大增，


  原來死人也有價值的，價值就在錢。




  決定去一身霉運的雷宇揚，


  於是約了黎耀祥跟張達明兩個死黨，


  又找了個美女伍詠薇坐遊艇出海，


  幫他們掌舵的，就是隨手將玻璃瓶往下扔，


  然後砸死Anita男朋友的吳志雄。




  結果眾人才剛出海，就碰到有一艘搜屍船在辦法事，


  原來有個少女在這片海域失了蹤，研判已經死亡了，


  於是有人在這裡做法事。




  遊艇繞過搜屍船之後卻遇上怪事連連，


  不是遇到死豬屍體，就是繞道結果繞到未知海域，


  結果眾人在未知海域內竟然救到了那個，被認定已經死亡的少女。




  只是問題才剛剛開始，


  怪事照樣屢屢發生，他們的電話訊號不通，時間四個人的錶都不一樣，


  而且吃飯還會吃到整盤菜都是蟑螂。


  最後極端恐懼的這幾個人終於看到有另外一艘船通過了，


  以為終於等到救星的張達明跟黎耀祥游水過去上船一看，


  才發現那艘船上只有兩個死人：就是那個少女，以及伍詠薇。




  這時他們才知道自己撞鬼了，


  一回自己的船上，發現雷宇揚跟吳志雄都已經死了，


  而一通打來的電話，通話的另一端，竟然是伍詠薇的聲音.......




  第三個故事可以說是本電影的結尾，


  由古天樂辭職開始，


  原來他查到，這個講鬼故事的節目，其實兩年前就停播過一次，


  因為之前接這個節目的主持人，統統都死於非命。




  老闆要挽留他，


  說現在丁子峻死亡，雷宇揚失蹤多日，節目的收聽率節節上升，有錢可以賺。


  但是古天樂認為保命要緊。




  於是他開始跟人尬摩托車過日子，


  一天晚上他跟隨著一個只有他看得到的紅衣女子的身影，


  到了一個巷尾，然後朦朧之間在Anita男友尿過神牌的地方，


  做了同樣的事情。




  結果他就一路衰到底，


  還遇到丁子峻跟雷宇揚，問他要不要跟他們一起死。


  而他的一個朋友試騎他的摩托車，


  結果竟然是才剛到路口被大卡車撞死。




  求助無門的古天樂試著去看病，


  但是醫生只說他是幻覺症狀，


  他只好去請教一個盲了的神婆求救，


  這個神婆，剛好就是Anita的母親......




  Anita的母親在古天樂的家畫了一道符，


  然後囑咐他這兩天最好不要出門，


  然後意味深長地要他"好好面對自己做過的事情"。




  結果，決定好好面對跟朋友的約定的古天樂，


  決定晚上去幫忙賽車，


  賽車賽到一半過彎的時候，


  卻遇上了電影一開頭的那個紅衣女鬼......




  急著閃鬼的古天樂就這樣翻車跌入車道外，車道外豎著一個牌子"陰陽路"。


  古天樂終於跟這個女鬼面對面講話了，


  原來一開始古天樂騎快車撞到的不是鬼，只是一個穿紅衣服的女人，


  但是撞死了以後，這個紅衣女鬼就一直跟著他到現在了。




  最後結局是古天樂死在車道下，旁邊是被撞得七孔流血的一個女屍，


  車道外豎著另一個牌子，


  "姻緣路"。




  最後結局，


  沒有人肯主持的講鬼節目，


  終於電台老闆谷德昭決定親自上陣，


  沒想到電台突然撥放那首Anita跟男朋友的定情之歌"我在你左右"，


  而古天樂、雷宇揚、丁子峻正在收音室外笑著看著谷德昭........




  =============================================================================


  這個故事之所以對我而言是最恐怖的"斬三件"式港產鬼片，


  有幾個原因，


  第一，這三個故事的主角們，是沒有解，沒有活路的。


  層層的敘事都在包裝著這個氛圍，


  包括之前的電台主持人全部離奇身亡，


  包括古天樂一開始就撞死了人，


  包括Anita開頭就自殺死在丁子峻的車上，


  甚至包括黎耀祥等人"引鬼入室"，以為找到了美女上船，結果.......




  他們一開始其實就已經把自己做死了，因果報應早就已經注定了。




  第二，情境非常絕望


  丁子峻愛上了女鬼Anita，所以無論如何都逃不了，


  Anita向他訴說，自己有了新男友，還讓他見了這個新男友，


  打開門一看，原來就是丁子峻自己，而一踏出這個所謂的"門"，


  丁子峻就從高樓屋頂摔了下來慘死。




  雷宇揚那個故事更慘，


  你在一個四周都是水，


  馬達發不動，收訊完全沒有，連吃的東西都忽然間變得噁心骯髒船上，


  根本沒有任何路可逃。




  古天樂也是，他走到哪裡都被髒東西纏住，


  不是紅衣女鬼害他尿神牌行衰運，


  就是老友鬼魂上來要他一起死，


  最後還是死在紅衣女鬼手上。




  第三，神婆這個角色更是讓人不寒而慄。


  一般而言，神婆道士龍婆這些角色都是讓你能消災解厄，脫離冤鬼的貴人，


  但是這個神婆詭異至極。




  她是Anita的媽媽，也知道女兒含冤而死，


  結果她放任丁子峻拿有那本日記，最後被鬼迷害死，


  事後又回去回收這本書。




  古天樂那個故事，她明明忠告古天樂不要離開家，


  卻又要他堂堂正正面對自己做過的事，


  間接害古天樂死亡，


  所以這個角色其實不是消災解厄的貴人，


  而比較像是幫鬼復仇的催命符。




  最後，這部有個拍攝手法我覺得很棒，


  就是在故事中，時不時穿插非常短，頂多兩格三格的"女鬼陰笑"的片段，


  讓人整個從頭毛到腳，


  真的有看著電影跟故事逐漸推展，感覺主角們無論在那裏在何時在幹什麼，


  這隻女鬼都在旁邊看著，"我在你左右"的恐怖感。




  不對，女鬼也許不是對著故事裡的主角們邊看邊笑，


  而是對著正在看電影的我們。




  我在你左右




  不過我覺得本片也有很多黑色幽默的地方，


  例如主角們雖然都死了，


  但是他們好像因此也"各有歸屬"，姻緣美滿，


  有李蕙敏伍詠薇這些"美女"相伴，在"姻緣路"上不寂寞。




  而谷德昭死要錢而不怕主持人死，


  結果最後自己上陣，卻看到了那三個已死的主持人，


  讓人有"人命何價"的感覺。


  故事在此停止，但我們知道，下一個死的就是你，老闆。




















  總而言之這是部氣氛十足的鬼片，


  推薦給喜歡這種分段式港產鬼片的朋友們。


  如果說這部電影有什麼重要的訊息的話，


  大概就是要告誡觀眾，千萬不要隨地大小便。




  尤其是強國人，千萬千萬要謹記這個教訓啊，


  呵呵呵。


  (飄走)



  --'
