content: '陰陽路系列是香港恐怖片史上的經典，同時也是香港電影史上最長壽的恐怖片，本傳就有

  19集，前幾年還有精神續作「常在你左右」。



  《陰陽路》（1997年）


  《陰陽路2：我在你左右》（1997年）


  《陰陽路3：升棺發財》（1998年）


  《陰陽路4：與鬼同行》（1998年）


