  《陰陽路8：棺材仔》（2001年）


  《陰陽路9：命轉乾坤》（2001年）


  《陰陽路10：宣言咒》（2001年）


  《陰陽路11：撩鬼攞命》（2001年）


  《陰陽路12：美容屍》（2001年）


  《陰陽路13：花鬼》（2002年）


  《陰陽路14：雙鬼拍門》（2002年）


  《陰陽路15：客似魂來》（2002年）


  《陰陽路16：回到武俠時代》（2002年）


  《陰陽路17：監房有鬼》（2002年）


  《陰陽路18：鬼上身》（2003年）


  《陰陽路19：我對眼見到鬼》（2003年）


  大家覺得哪一集/哪一個故事最經典？



