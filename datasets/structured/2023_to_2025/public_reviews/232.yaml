url: https://www.ptt.cc/bbs/movie/M.1528997441.A.231.html
title: '[負雷] 常在你左右 - 這不是我印象中的陰陽路'
content: '大家好

  我是專看恐怖片的LittleDiDi

  我又來介紹恐怖片了

  陰陽路20周年紀念作

  很有可能剛好是收攤作

  一個字

  慘



  Blog圖文版會更精采




  年份：2017


  國別：香港


  類型：靈異，鬼怪


  導演：邱禮濤




  [劇情簡介]


  《常在你左右》劇情描述罹患不治之症的計程車司機David，酒駕失控衝撞逆向來車，導

  致多人傷亡。警察Sam與妻子阿思幸運逃過一劫，雨欣的未婚夫卻當場身亡。為了贖罪，

  David來到雨欣開設的民宿幫忙。一場意外，一群毫不相干的人，一對陪葬的古老手鐲、

  一座旅客不斷自殺的民宿，一張播放中的黑膠唱片，駭人的恐怖與靈異事件正接二連三地

  發生……


  罹患不治之症的David（張智霖 飾）酒駕失控衝入對向車道，休假警員Sam（古天樂 飾）

  和妻子阿思（佘詩曼 飾）見狀及時避開逃過一劫，然而David的車卻與Sam車後方的另一

  輛車迎頭相撞，該車司機Patrick無辜慘死，而失戀尋死的小紅從頂樓一躍而下，恰巧落

  摔落於Patrick車頂上。此時，新人歌手Jamie與舅父駕車經過，好奇查看時，遭大型貨車

  撞死。


  負責處理小紅屍體的志強（林家棟 飾），因想還清賭債而偷走了陪葬的龍鳳鐲，卻一直

  不能將其變賣。Patrick未婚妻雨欣（蔡卓妍 飾），為完成丈夫的遺願經營民宿，卻接連

  發生怪事，David為了贖罪前來暗中幫忙。Jamie的黑膠唱片被扔掉後仍不斷重回到Sam和

  阿思家中，涉及車禍的人無不遇怪事……


  (以上引用自開眼電影網)





  《常在你左右》是陰陽路系列二十周年紀念作，也剛好是這系列的第二十部作品，片名仿

  自系列第二部作品《陰陽路之我在你左右》，除了找來邱禮濤執導，還有系列作的固定老

  班底如古天樂、"龍婆"羅蘭，還有許多港片的老面孔一同來共襄盛舉，算是一部意義性大

  於實質性的電影。


  不過說明白的，既然都說意義性大於實質性，各位也就不用太期待了。


  雖然我自認陰陽路系列我也看得不少，但要一時間談這麼大方向的專題也是很費勁，而且

  我也都是凌亂地看東看西，所以就不幫各位做回顧了，專注於這次的電影吧。《常在你左

  右》採用的是假單一主線真多重支線的敘述法，不過這也不是多新的手法了，算不上什麼

  特色。


  故事從一場嚴重的死亡車禍做為開端，牽扯出本片所有的主要人物，至於故事細節我就不

  詳述了，直接講本片的優缺點吧。


  相信各位對於《陰陽路》最深刻的橋段八成都是"陀地位"吧，除了詭異感營造得很棒之外

  ，也將電影院描寫得彷彿真的有這個不成文規定，是這系列作最成功的故事之一。從這裡

  我們可以看到，陰陽路系列經常引用禁忌、怪誕、因果、懲戒等作為題材而深植人心。


  然而這優良傳統，卻在這二十周年紀念作完全不可見。


  從營造恐怖、詭異感的角度來看待本片，我只能說用慘不忍睹來形容，光從開頭讓龍婆講

  出本片的主旨那段就能嗅出一點事有蹊蹺，不知道為什麼，我有一種導演是不是在玩龍婆

  的感覺，講個話裝腔作勢的，非常不恐怖還很滑稽，真不知道該哭還是該笑。


  至於恐不恐怖，連講都不用講，因為完全看不到哪裡是恐怖的點，不如把本片當作喜劇片

  看，可能還稍微有趣一些。


  說故事方面也都是萬年老梗，林家棟飾演一個走偏門偷陪葬品的爛賭鬼，然後就被鬼給制

  裁了；蔡卓妍飾演為了繼承亡夫夢想而當民宿老闆卻變成自殺勝地；古天樂則是與余詩曼

  飾演一對在那次車禍過後開始有微妙變化的夫妻生活，暗示相當明顯；另外有段小插曲就

  是唱片有鬼。


  我完全看不出來哪一段是值得看的，也算有，至少蔡卓妍的感情戲演得很好，張智霖的角

  色與蔡卓妍的角色迸出很特別的情感，其他真的不值一晒，毫無內容可言，龍婆如同虛設

  ，苑瓊丹王女歌星那段根本矯情。


  因為中國廣電法的緣故，發行了陸板與港版，差別當然在於鬼能不能明講，我不知道我看

  得是哪個版本，但我相信不會差太多。除了帶點血腥之外，我甚至很難將本片歸類在恐怖

  片，那又何來致敬之意。


  無聊到連吐槽的點都找不到，真的是不看也罷。


  即刻短評(滿分5)


  劇情： 2      >>老梗大雜燴，描寫得都又太淺

  結局： 2      >>一些感情戲營造得還算可以

  氣氛： 2      >>只推蔡卓妍跟張智霖那段

  駭人： 1.5    >>找不到嚇點，反而一堆人死的莫名其妙

  推薦： 2      >>本來就沒什麼期待，





  --





  歡迎參觀我的部落格



  --'
