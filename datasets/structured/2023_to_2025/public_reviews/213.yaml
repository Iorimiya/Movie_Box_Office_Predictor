title: '[好雷］Vaundy live in london'
content: '我是從裸の勇者這首歌認識他的，之後就不斷有聽著他的歌的習慣，當這次演唱會要到電影院播放的時候我是非常的期待，直到今天聽完我都不覺得我的期待有落空，反而是更想再去聽個兩三次


  好聽好聽好聽，真的很好聽！

  Vaundy到英國倫敦世界遺產「Old Royal Naval College」（舊王立海軍學校）所舉辦的演唱會，畫面非常的好看，鏡頭不管帶到哪都是十分美麗又充滿歷史的建築樣貌，加上那個場地所營造出的聲響，讓人彷彿身歷其境。


  當我坐在全黑的電影院裡，畫面帶入會場，當音樂開始響起，Vaundy的歌聲傳達到我耳邊，就好像我置身在會場的最前排，這是在家裡看電視看螢幕感受不到的體驗而且也非常貼心的每首歌都有上中文字幕，聽著歌看著畫面，讀者那些歌詞，就好像在看一篇短篇故事，真的非常非常非常推薦大家到電影院去觀賞。





  個人不是很擅長寫心得文的人，但我覺得好的體驗，就該讓大家有機會一起去享受，所以寫了一篇不算心得的心得，希望大家有機會，有空

  可以到電影院去感受一下Vaundy帶來的視覺和聽覺饗宴


  這真的不是在家用BD還是串流能感受到的感動，大螢幕大音響，超爽！


  -----

  Sent from JPTT on my Samsung SM-S9160.


  --'
