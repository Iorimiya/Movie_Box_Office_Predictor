title: '[極好雷] 你好，愛，再次'
content: '菲律賓愛情電影，你好愛.再見的續集，全劇也從香港移到對台灣觀眾而言較為陌生的加拿

  大城市卡利加，比起香港的城市廢墟風，擁擠的中環，有世界最乾淨城市之稱卡利加，無疑

  使全劇變得浪漫許多。延續上集，女主到了加拿大後，遇到了詐騙、疫情，及遠距離戀愛的

  不適，即使男主也飛往加拿大，但是雙方的價值觀還是沒有改變，前後呼應第一集的故事，

  何謂［家］，有的地方只是中繼站，只適合短暫停留，對男主而言香港長大的家，有自己的

  事業，朋友，家人，而女主的家則是想要自己的家人有更好的生活，無論是香港，加拿大，

  或是紐約，一個追求愛情，一個追求夢想，若沒互相妥協，注定走不長久。「有錢人才有資

  格選擇」，男主失去了所有，父親的離世，拋棄了自尊，而女主拋棄了夢想，了解有彼此的

  地方才是家。不止是浪漫愛情電影，劇中也有蠻多催淚的橋段，老奶奶的信，女主對於男主

  背叛的哭訴。全劇有相當長的時間都在灑狗糧，加上經典的歌曲，漂亮的風景，浪漫滿分，

  蠻值得進場一觀。我觀看的時候剛好剛上映，整廳都是菲律賓人，吻戲，床戲，跟浪漫橋段

  ，她們都會亂叫還蠻好玩的，怕吵可以快下映再去看，畢竟是菲律賓現象級電影，題材又跟

  龐大的海外移工相關，在菲律賓已刷新多項紀錄，影史票房亞軍，有望挑戰復仇者聯盟：終

  局之戰最高票房紀錄。


  --'
