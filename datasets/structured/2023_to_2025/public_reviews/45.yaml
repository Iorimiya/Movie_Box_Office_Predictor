url: https://www.ptt.cc/bbs/movie/M.1710485515.A.1B7.html
title: '[新聞] 吳慷仁與孫淑媚主演《南方時光》高雄開拍'
content: "吳慷仁去年接連拍完《富都青年》和《但願人長久》之後休息了一年沒接戲\n這次接演的新片是出身高雄的導演曹仕翰的首部長片《南方時光》\n\n曹仕翰導演之前曾以描寫高雄港口從事性交易女子和老船夫的《貓與蒼蠅》\n\
  入圍金馬獎最佳短片，該片的女主角潘之敏是他的太太，\n她在本片中飾演在港口賣春的智能障礙女子，獲得金穗獎最佳演員。\n\n這次曹仕翰的新片《南方時光》是他的首部長片，由易智言導演監製\n\
  2019年陸續獲選為台北電影節工作坊、金馬創投會議等前期開發相關活動\n經過超過五年的開發後，終於在今年開拍。\n\n特別的是，主演陣容大多都是高雄人，去掉台南出生的鄭有傑之外，\n\
  吳慷仁（原高雄縣大寮鄉）、孫淑媚（原高雄縣梓官鄉）、黃迪揚（高雄市）\n都是高雄人，首次主演電影，出身明華園玄字團的主角陳玄力也是高雄長大的小孩。\n\n這次的故事以1996年台海飛彈危機和首次總統直選為時代背景，\n\
  描寫青少年的成長故事。\n根據網路上找到的資料推測，\n吳慷仁飾演的應該是男主角當職業軍人的父親，因飛彈危機得回營區待命\n而孫淑媚則是男主角的母親。\n\n\
  ---\n\n以下是新聞稿：\n\n新聞網址：\n\n曹仕翰高雄拍電影「南方時光」 吳慷仁返鄉演出\n中央社記者林巧璉｜2024/3/15\n\n新銳導演曹仕翰執導電影「南方時光」3月在高雄開拍，此片由在高雄長大的演員吳慷仁\n\
  、陳玄力等人主演。故事主要場景在民族國宅，並於果貿國宅、左營舊部落、澄清湖等地\n取景。\n\n「南方時光」故事描述1996年台海危機少年面對家庭、愛情與友誼的徬徨失落，沒想到落\n\
  在高雄外海的飛彈竟加速了成長的痛楚與幻滅，電影將藉由許多在地場景，帶領觀眾返回\n1990年代的高雄場景與成長回憶。\n\n高雄市文化局自2011年開始以「高雄人」品牌投資近50部電影，文化局今天發布新聞稿指\n\
  出，「南方時光」也是由「高雄人」投資的電影。\n\n文化局表示，曹仕翰多次獲「高雄拍」短片獎助、開啟國際知名度，「南方時光」劇本由\n「編劇駐市計畫」孵育完成，最後獲得「高雄人」投資及高雄協拍中心的拍攝支援，是一\n\
  部「高雄製造」的原創電影。\n\n高雄市文化局長王文翠說，「高雄人」首創公部門的影視投資政策，以「良性迴旋圈」概\n念，讓政府投資回收的資金在產業內循環使用，做到永續支持台灣內容的成效。\n\
  \n文化局指出，曹仕翰從小在高雄長大，在金馬電影學院期間受到導演侯孝賢鼓勵，回到自\n己熟悉的成長地方拍電影，在曹仕翰執導「高雄拍」短片「春之夢」及「貓與蒼蠅」中的\n\
  海關宿舍、前鎮漁港都拍出高雄獨特人文風景。\n\n曹仕翰表示，對很多人來說，高雄元素也許是陽光、大海、工業，但對他而言，最特別的\n是一種高雄人特有率直與自由。「南方時光」講述1996年在飛彈危機、第一次總統直選旋\n\
  風之下，一名高雄少年的成長、自我追尋與做出自由的決定。\n\n「南方時光」主角、演員陳玄力從小在明華園天字團長大，曹仕翰提起見到陳玄力的第一\n印象，認為陳玄力有著「不知該如何是好」的純粹笑容，很貼合片中少年的迷茫感，「讓\n\
  你想更認識他」。\n\n文化局表示，片中飾演父親角色的吳慷仁是導演心中不二人選，吳慷仁與陳玄力同樣在高\n雄長大，有許多類似生活經驗；片中飾演母親、演員孫淑媚也是高雄人，讓人期待這組「\n\
  高雄新組合」會擦出哪些意想不到的火花。\n\n「南方時光」劇組上週在片中主要場景－民族國宅開鏡，休息將近1年的吳慷仁在臉書（\nFacebook）上發文指出，「感覺很像回到小時候去外婆三民區的家，舊公寓樓梯間的氣味\n\
  一樣，涼涼的、很通風，踏上階梯往上衝進2樓外婆家是最開心的事。」\n\n--\n　　\n　　　　　                  OF\n　一手拿著 靜止的羅盤\
