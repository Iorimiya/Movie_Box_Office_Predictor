url: https://www.ptt.cc/bbs/movie/M.1763390141.A.3D2.html
title: '[ 好雷] 南方時光-帶有雋永感的1996/1997'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~








  抽空去看＜南方時光＞

  而且威秀大廳還包場

  這是一部幾乎沒有爆點的電影

  復古的鏡頭、場景、人事變化

  可以快速拉到跟主角小洲一樣的年代，那也是跟我一樣的年代

  （1996到1997的國三生）


  導演想表現的鏡頭語言很多

  光是整個螢幕拉到幾乎是正方形的感覺，就不太一樣了

  很多表現很雋永的fu

  可能有點微一一感。


  許多角色都演得不錯

  幸好有找吳慷仁來演

  還有演出扣子的新演員蘇韋華

  也很不錯！

  他場次不多，但很吸引人

  讓人想到走紅前的許光漢




  --'
