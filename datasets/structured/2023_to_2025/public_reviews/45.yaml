url: https://www.ptt.cc/bbs/movie/M.1764132607.A.0DB.html
title: 金馬入圍電影《南方時光》突遭摩洛哥影展除名入
content: '金馬入圍電影《南方時光》突遭摩洛哥影展除名入圍　主辦表態：敏感因素




  吳慷仁、孫淑媚主演電影《南方時光》入圍金馬獎3項大獎，日前才準備風光前進摩洛哥，

  參加馬拉喀什國際影展正式競賽，結果還沒飛機起飛，就被一通電話取消入圍，原因竟出在

  「敏感因素」四個字。導演曹仕翰日前接受《中央社》記者電話訪問時說，提到今年7月31

  日獲知入圍，8月12日接到影展正式邀請函，原定本月29日與演員陳玄力前往摩洛哥出席盛

  會，如今已無緣出發。





  曹仕翰表示，摩洛哥不會核發電影放映許可及簽證，因此《南方時光》放映會等行程，以及

  原本安排好的機票和住宿均遭取消。目前看到的影展節目單上，已無《南方時光》放映時間

  和曹仕翰原定出席的活動。曹仕翰連自己也是直到被記者提醒才得知此事，有媒體詢問主辦

  方，迄今仍未回應。


  曹仕翰感到無奈且遺憾，「電影是探索與理解世界的文化之窗，卻因為『敏感問題』，某些

  未知原因插手干預而被消失。身為創作者，看到藝術在體制的力量前被強迫停止，想與世界

  連結的心被拒絕在門外。我為電影與所有參與付出的人們感到可惜。」





  這片什麼時候上映的，我怎麼完全沒印象= =


  --'
