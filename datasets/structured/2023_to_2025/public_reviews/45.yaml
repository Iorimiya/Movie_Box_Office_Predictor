url: https://www.ptt.cc/bbs/movie/M.1762853610.A.AF1.html
title: '[新聞] 《南方時光》台北首映 孫淑媚攜「兒」亮相'
content: "《南方時光》台北首映 孫淑媚攜「兒」亮相\n\n\n《南方時光》於11月10日晚間在台北誠品電影院舉行首映會。圖為孫淑媚與陳玄力。（百\n景映畫提供）\n\
  \n【大紀元2025年11月11日訊】（大紀元記者馬維芬報導）由新銳導演曹仕翰執導、易智言\n監製的電影《南方時光》，獲得本屆金馬獎最佳導演等3個獎項提名，該片於10日晚間在\n\
  台北誠品電影院舉行首映會，導演率主演孫淑媚、陳玄力、鄭有傑等人現身，分享新作。\n\n電影承載著導演曹仕翰自身的青春記憶與父子關係的深刻觀察，他以新導演之姿獲得本屆\n\
  金馬最佳導演入圍的肯定，曹仕翰表示很意外，「我從小是看陳玉勳導演的電影長大的，\n可以和他一起入圍，真的覺得非常榮幸。但我現在儘量保持平常心，努力做宣傳，希望更\n\
  多觀眾可以到電影院來看片。」\n\n\n《南方時光》於11月10日晚間在台北誠品電影院舉行首映會。導演曹仕翰（右3）率全片\n主演孫淑媚（左3）、陳玄力（左2）、鄭有傑（右），黃迪揚及温傑恩（左）亮相宣傳。\n\
  （百景映畫提供）\n\n影歌雙棲的孫淑媚，本來已要南下高雄進行演唱會的準備工作，特別為了首映會延後行程\n。她在首映會上亮麗現身，和片中的南台灣媽媽形象差很大。這次飾演一位性格鮮明又溫\n\
  柔的母親，出色的表現被形容「最貼近觀眾心中的媽媽」。\n\n孫淑媚表示自己從小就愛觀察人，媽媽也是自己長期觀察的對像，所以可以演出媽媽的模\n樣，因電影都是以長鏡頭進行拍攝，她很驚訝有時一個鏡頭要拍20多次，但也覺得很自然\n\
  融入角色，「角色充充滿生活感，很自然的就拍完了啊！」\n\n至於如何和片中兒子（陳玄力）培養默契，她表示除了一起吃飯，有空也會和他聊聊「明\n華園」（歌仔戲團）的故事，拉近彼此的距離。\n\
  \n而身為「明華園小王子」，陳玄力這次挑大樑飾演男主角小洲，要從歌仔戲轉變成大銀幕\n的演出，他坦言經歷了轉換的陣痛期，幸好導演和劇組幕前幕後的團隊都很有耐心的指導\n\
  他，讓他完成一次挑戰。\n\n對於轉戰演電影，陳玄力表示：「家人都很支持和尊重我。爸爸平常超忙的，很開心他今\n天能來看我的電影。」\n\n黃迪揚在片中演出面對大環境不確定的因素下，陷入周轉困難的生意人，雖然出現場次不\n\
  多，但每一次出現的情緒張力讓人難忘，他透露角色從冷靜到突然大爆發，需要花一點時\n間培養情緒，面對旁人的制止還必需不停掙扎，直說是種體能的考驗。\n\n鄭有傑這回在片中飾演一位完全以成績評斷學生的老師，主持人問他是否以自己學生時期\n\
  的老師為靈感？他笑說：「我也是經歷了考不好會被打的年代。其實到現在我們都還在經\n歷相同問題，只是現在這個時代，我們被打會懂得反抗了。」\n\n《南方時光》11月14日在台上映。\n\
  \n責任編輯：蘇漾\n\n\n\n--\n\n                  \n\n\n\n--"
