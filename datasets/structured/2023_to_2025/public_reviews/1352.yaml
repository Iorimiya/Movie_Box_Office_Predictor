url: https://www.ptt.cc/bbs/movie/M.1697707535.A.C95.html
title: '[好雷]《鑽石水族世界》，新南向政策的美夢縮影'
content: '部落格版：


  必須老實說的是，七月份在排台北電影節片單的時候，《鑽石水族世界》並沒有在我的考

  慮裡面，除了整部作品長達155分鐘的片長有讓我猶豫，另方面是我對電影題材不怎麼有

  興趣，所以很乾脆的就直接放棄掉這部紀錄片。直到後來聽到朋友在臉書稱讚《鑽石水族

  世界》，並且還預測這部作品有機會拿到台北電影獎百萬首獎、甚至最後還真的擊敗其他

  四大類作品得獎者，成為本屆台北電影獎最大贏家之後，又加上後知後覺的發現原來《鑽

  石水族世界》早在去年就榮獲台灣國際女性影展銀獎與觀眾票選獎殊榮，這才非常現實的

  引起了我的興趣。後來就一直在關注電影後續有無上映或者相關放映計畫，但紀錄片確實

  在台灣很難有上戲院大銀幕的機會，連去年金馬獎最佳紀錄長片得主《九槍》也是靠著群

  眾集資才得以院線上映，所以本來不太認為有機會能觀賞到《鑽石水族世界》，想不到最

  近有幸接到試片邀請，二話不說把事情排開報名參加。


  我是個不怎麼喜歡留下來聽映後的人，就算留下來通常也都是會期待有別的觀眾會向影人

  問到跟我同樣的疑問，如果沒有問到我也會就是會算了然後離開，基本上我不太會舉手發

  問還有表達自己對電影的感想，但是看完《鑽石水族世界》後我很難得想自主留下來，坐

  在位子上聽導演黃琇怡分享她對拍攝這部作品的想法、感受與感觸，也很難得在散場後跑

  去問導演關於電影的後續，當電影結束在新冠肺炎讓世界停止運轉的2019年，很想知道小

  杜哥、小蘇、Jojo他們的近況，還有乘載他們夢想的鑽石水族世界後來怎麼了？這大概是

  我觀影前的始料未及，沒想過會從原來對電影興趣缺缺，到後來觀賞完內心有很多的好奇

  很想被解答，導演黃琇怡獲獎後的感言提到自己「進到了影片裡面」，在跟著鏡頭走進了

  緬甸仰光，走近了小杜哥、小蘇與JOJO他們，在這個從陌生到熟識的過程，也許連觀眾都

  在不知不覺間進到了電影裡也說不定。



  2016年政府提出「新南向政策推動計畫」，秉持幾個核心理念並朝數個面向著手，期望與

  東協、南亞及紐澳等國家創造互利共贏的新合作模式，建立「經濟共同體意識」。然而這

  樣的政策卻引來不少質疑，許多聲音認為這項計畫可行性不高，主因為台灣人普遍對如越

  南、菲律賓等東南亞國家抱有歧見，覺得要達到資源共享等實際上的合作並不容易，這其

  中就包含了導演黃琇怡。因為心裡對於這項政策計畫的疑問，於是有了「拍攝到東南亞工

  作的台灣人」的想法，不過導演黃琇怡最初是想拍攝更多與新南向政策有關的內容，還為

  此跟著同樣在電影中出現過的阿元去到中國，只是後來礙於某些原因未能拍成，剛好當時

  阿元的合作夥伴小杜哥決定遠赴緬甸發展，導演黃琇怡趁機轉個方向跟著小杜哥在2017年

  來到仰光，更在小杜哥與當地擁有父親留下來的養蝦場的女孩小蘇達成合作協議共同創設

  「鑽石水族公司」之後，《鑽石水族世界》慢慢才成了現在觀眾看到的樣子。


  從政府新南向政策到導演黃琇怡拍攝電影的出發點，加上電影主要被攝者是台灣人小杜哥

  與緬華混血女孩小蘇這樣的組合，不難想像《鑽石水族世界》裡會有多少存在於兩方、甚

  至是多方之間的衝突與拉扯，從語言隔閡、文化差異、生活型態與價值觀的不同，就連對

  事業的想法與態度都成為《鑽石水族世界》不需刻意編造就自然會帶起的起承轉合。而跟

  著日子一天天過去，許多沒說的、導演黃琇怡選擇拍攝這樣主題時的疑慮，成了一個又一

  個的未爆彈替這段跨國合作埋下隱憂，最為顯而易見的就是階級關係與權力掌握，小杜哥

  所擁有對於養蝦的知識與經驗，讓他在合作裡悄悄掌握了最大的發話權，只是這樣子明著

  叫合夥可實際卻更像是獨攬大權的不平衡關係，或將隨著過程中不斷冒出的各種問題，逐

  漸撕裂著、消磨著彼此。最後不論是小杜哥、小蘇或是小蘇丈夫JOJO，就連導演黃琇怡都

  在裡頭受到挫折，新冠肺炎疫情看似來得剛好順勢停損，但就當時的結果來放大看新南向

  政策，卻更有種「終究還是一場想得太過美好的南柯一夢」的感慨。



  《鑽石水族世界》本來的主角該是小杜哥，可是到了中後段重心逐漸轉往小蘇與JOJO，這

  樣的改變確實讓電影有了不同的聲音，觀眾得以從不同的角度與立場去切入、去看待整個

  過程的發展，更藉著他們無法在對方面前說出口、只能對著鏡頭說給導演黃琇怡的心裡話

  ，去體會並理解他們處於其中的諸多感受。這其實是相當典型的拍攝手法，忠於真實的紀

  錄片必須要有的平衡，而如上段講到的，基本上主導權力都在小杜哥手上，那既然難以達

  到權力上的平衡，那麼或許能從「給觀眾看到的部分」來去下手，雖然導演黃琇怡自述電

  影中的重心轉變其實不是設計好的，而是拍著拍著就自然產生的改變，但我認為這是件好

  事。


  至少對於觀眾來說，即使這與「拍攝到東南亞工作的台灣人」的初衷有些偏離，卻反而能

  讓觀眾看見與聽見更多東南亞的發展與聲音，讓電影不是「我們怎麼看他們」也是「他們

  怎麼看我們」，讓政策所催生的合作交流順勢從單向轉為雙向，觀眾不再只是聽小杜哥就

  養蝦事業發表意見，或對小蘇與JOJO、其他員工給予肯定或抱怨，也能看到他們付出的努

  力與熱情，受挫仍去嘗試解決的韌性，此無意間的發展轉變意外替電影增加了可看性。


  《鑽石水族世界》簡單卻很有味道，前半段的理性到逐漸轉於感性的後半段，導演黃琇怡

  片段的取捨與剪輯的位置擺放讓一切推進的是如此順暢自然，成功讓《鑽石水族世界》成

  為一部很生活、很貼近觀眾的紀錄片，整個內容不僅是如新南向政策的施行縮影，也似是

  許多人平常面對著的日常，不論是小杜哥與小蘇、JOJO，或者是小蘇自己與JOJO、小杜哥

  和JOJO，他們所背負著的壓力、那些身處其中的拉扯與掙扎，尚未等到成功卻憂心失敗的

  浮躁，現實與自然環境的雙邊夾擊帶給他們的衝擊，還有更多的是無法真正達到相互理解

  的痛苦，都在鏡頭之前化為複雜情緒，透出銀幕而被觀眾清楚感受到。


  我更喜歡《鑽石水族世界》的是，導演黃琇怡到後來把自己也給放入了電影裡，從單純紀

  錄這段過程的旁觀者，從本來僅是轉述與簡單回應的中間橋樑，成為走入被攝者生活中的

  參與者，她承接並消化著他們丟給自己的情緒，卻也不知不覺受到感染，面對小杜哥、小

  蘇與JOJO還有觀眾，導演黃琇怡反饋著自己的真情，在電影近尾聲她對小蘇道出了心裡的

  歉疚，前半段無法插手眼睜睜看著小蘇受到傷害、不顧流產需要休息的身子急著回到崗位

  上的堅強模樣惹人心疼...，好多情緒都在導演黃琇怡把自己放進鏡頭裡後瞬間釋放，觀

  眾於是跟著小蘇接受然後釋懷。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
