title: '[好雷]《鑽石水族世界》緬甸的養蝦夢'
content: '來拚一次翻身，台灣人的緬甸投資夢


  創業當老闆，是很多台灣人在想努力賺錢環境中想到賺錢方法之一，不管事小本生意，還

  是加盟投資，創業除了需要勇氣外也需要大量的資金和多年的判斷，必要時還需要有好運

  氣眷顧。


  在公司當員工羨慕老闆掌握公司所有，但當自己開始試著做一個頭家，才發現其實很多地

  方只有站在老闆的位子才看得見，而且最常計較的永遠是下次的錢在哪裡？


  紀錄片《鑽石水族世界》是一部以台灣與緬甸為背景，描繪在緬甸投資的電影。有20年養

  蝦經驗的小杜哥隻身到緬甸，與有養蝦夢的緬台女孩小蘇一起，想在緬甸闖出一番事業。

  但才剛起步就遇到種種困年，必須找尋鹽度適當的水源、政府核准的公文遲遲沒有下文、

  溝通、銷售通路等都是莫大的難題，而就在這時候小蘇也懷上了孩子。







  《鑽石水族世界》是什麼電影：


  講到緬甸，因為軍政府與翁山蘇姬的關係通常都會牽扯到戰亂與民族矛盾，雖然如今也是

  緬甸國內自己的內戰不斷，在2010年，緬甸因為翁山蘇姬的釋放，一度有改革的趨勢，還

  在2015年時被貿易發展協會評價為出口指標市場潛力相當大的國家，讓許多投資者紛紛在

  東南亞多了一個選擇。


  但在2021年時軍政府又重新軟禁翁山蘇姬時，也讓許多投資者對於緬甸的開放市場有所疑

  慮，日韓、甚至歐美各國很多都放棄緬甸市場，但台灣投資主卻還是不少。


  例如在台灣台灣以鋁業為主的啟翔輕金屬，在台灣鋁材帷幕牆市場中，佔據了市場七成的

  份額，就花兩千萬美元在緬甸設置新廠區，擴展外銷與生產市場，讓公司成長了兩倍的營

  業額，可以說投資上有所斬獲。但並不是所有緬甸的投資和尋找新市場的人都像台灣啟翔

  輕金屬一樣，有著雄厚的資本和國際市佔率，從零開始和如何面對一個台灣以外的新市場

  ，異地創業可以說是一件不容易的事情。









  《鑽石水族世界》電影，是敘述在台灣有20年養蝦經驗的小杜哥，與緬甸和台灣混血的女

  孩小蘇意外的湊再一起創業。小杜哥想在緬甸開發新市場，而小蘇則是想要開拓過去家族

  養殖業，故剛好專業與資本都在一起，便開始在緬甸做起養殖工作。緬甸並沒有太多本國

  的養蝦場，幾乎都仰賴進口，而新創緬甸本土養蝦業，除了一項扎根也是全新的開始，小

  杜哥和小蘇從開始設置養蝦水池海水與淡水的濃度就遭受挑戰。


  即便有著小蘇這個在緬甸生活又能用中文溝通的夥伴，許多創業的困難還是接踵而來。小

  杜哥很快就面臨缺電、缺工，和器具毀損太快的狀況，甚至進口蝦苗的公文遲遲未到，還

  得面臨到與小蘇兩人認知差異的溝通問題，還有與小蘇老公間的矛盾。


  很快的第一批蝦苗就要隨飛機起飛，但該做的工作還有很多，在逐漸養蝦事業上軌道的時

  候，小蘇卻有了生孕，這寶寶的到來，不管對於工作是福還是禍，在緬甸的養蝦功課還要

  續繼。











  《鑽石水族世界》分析與延伸：


  電影導演－黃琇怡，本來就是紀錄片導演，通常作品以新移民的女性和環境等社會議題為

  主。這部《鑽石水族世界》取名為小杜哥和緬台混血的小蘇索取的公司名稱，會開始拍攝

  這個題材是因為黃琇怡導演參與了「流浪者計畫」拍攝前往東南亞創業的台灣人故事，而

  找到了以養殖業為主，準備前往緬甸的小杜哥，故才誕生了這部以緬甸創業的紀錄電影，

  這也是第一次黃琇怡導演深入台灣以外不一樣的東南亞國家，故整部片在拍攝上是受到挑

  戰。


  根據緬甸官方與台灣東南亞發展的相關資料，其實在過去緬甸就有開始培育水產養殖的市

  場，從2008年開始，水產養殖業產量每年以4％增幅穩定成長，在2020年，緬甸官方公布

  「2019-2023年國家水產養殖發展計畫」將緬甸水產養殖業視為永續發展，提供政策及體

  制架構和補助。


  雖然緬甸的土地很適合水產養殖，也有大量人力，但整體養殖的材料跟主體都需要仰賴進

  口，這點也需要不同國家協助，故小杜哥和小蘇可能是搭上這波水產養殖風潮。








  小杜哥所做的是亞洲常見的「海蝦養殖」，從70年代就因為歐美市場需求而開始這項水產

  養殖的發展，光是21世紀初就已經達到160萬噸的需求量，其中又以亞洲為最大的生產國

  ，幾乎近八成都是由亞洲國家輸出，這之中又以泰國蝦最為經濟實惠。


  台灣早期也有養蝦市場，但因為產量與工業化養殖逐漸被中國與泰國取代，故在1988年後

  ，台灣養蝦業幾乎崩塌，這也是為何小杜哥要尋找東南亞市場，繼續在他國振興他的養蝦

  事業。


  現在常見的工業繁殖的養蝦方式是出現在20世紀後，過去基本上是用低密度的方式圈養蝦

  子，最早可以追溯到15世紀的印尼，透過漁塘養蝦與其他作物，與旱季的稻米交互，成為

  農家補貼家用之物。傳統養殖蝦子方式是將野生的蝦苗困住在漁塘內，半放養的方式讓蝦

  自然成長，等蝦子成熟後捕撈。而開始出現人工養殖蝦則是在日本，為了提供本土市場而

  培育出人工養殖的日本對蝦，來彌補野生蝦貨不足的情況，可以說在現今市場人口對於食

  物的需求量可說越來越龐大，而不足。










  《鑽石水族世界》值得一看嗎：


  這部電影是很特別但又貼近時事的故事，台灣人到東南亞工作從過去其實就相當普遍，甚

  至很多大廠都有在東南亞等地設廠，與整個東南亞的經濟體可以說是有所牽連。通常創業

  的紀錄片相當多，甚至是在台成功大公司的紀錄片，但要以素人的視角去看待海外創業這

  件事，可以說這樣的紀錄片還不算多，尤其又是以與當地人合作的養殖業為主題的從頭開

  始的事業，我覺得是《鑽石水族世界》這部紀錄片很有趣的地方。


  裡面也很多有趣好玩但也有讓人省思與傷痛的地方，尤其是在緬甸的創業女孩小蘇身上，

  在《鑽石水族世界》的電影裡可以看到她與合作夥伴的小杜哥的意見不合，還有口角的部

  分，當然也有兩人攜手合作一起達到成果的地方。


  在兩人合夥下，站在旁觀的觀眾立場可以看出兩邊的差異，而且與其說是小蘇與小杜哥的

  差異，不如說可以看見緬甸與台灣人做事方式的不同。甚至在市場上有些區別，在電影裡

  呈現出來的會讓國際市場專業的人有所感觸。









  以我個人觀感我會認為，小蘇的男友JOJO是一個很有緬甸人代表性的例子。就像裡面JOJO

  表現的，他將水產養殖視為一項「工作」而不是「創業」，且有及時行樂，東南亞人的樂

  天感。


  但在年紀與台灣蝦業養殖失利的小杜哥不同，小杜哥是抱著必須成功不能失敗的意念在做

  養殖，在動機和工作方式上，兩人就產生皆然不同的價值觀。在讓往往夾在中間的小蘇得

  做出裁判，自己需要用何種角度面對。


  緬甸受到軍政府統治，長期在兵荒馬亂的日子裡，多少可以理解關於小蘇男友那種在不知

  道明天會如何，不如今天及時行樂的想法。但站在生意人的角度小杜哥用著過來人的經驗

  和養殖技術，拋去許多來到緬甸創業，兩人的出發點本身就有落差，也很難認同彼此的觀

  感，故在電影中看著兩方不斷拉扯，不知會走向何處的養殖場，是一部活生生的海外創業

  實例，《鑽石水族世界》以感性的方式拍攝，卻意外拍出那作夢與現實之間的平行線。




  --

  個人Blog：

  小說連載頁：


  --'
