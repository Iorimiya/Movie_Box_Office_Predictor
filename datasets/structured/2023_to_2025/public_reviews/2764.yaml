url: https://www.ptt.cc/bbs/movie/M.1631169402.A.052.html
title: '[情報] 孫藝珍、曹承佑、趙寅成《緣起不滅》重映 10/8定檔'
content: "2003年由孫藝珍、曹承佑、趙寅成主演的經典愛情電影《緣起不滅》\n\n台灣將於10/8經典重映，由甲上娛樂發行\n\n\n\n故事發生在一對年輕戀人身上，他們因誤會而分離，但卻又因命運的細繩緊緊相繫。當梓\n\
  希翻閱著日記，上頭記著母親珠喜 (孫藝珍 一人分飾兩角) 與俊河 (曹承佑 飾) 相戀的\n過程，泰秀請俊河代寫情書給珠喜，不料俊河、珠喜早已認識並互生好感；同樣的三角習\n\
  題在今日重現，梓希愛上了英俊的尚民 (趙寅成 飾)，而尚民卻已跟好友秀景在一起了\n...。\n\n\n本片由《我的野蠻女友》郭在容編導\n\n孫藝珍也以這部片獲得百想藝術大賞新人獎、大鐘獎新人獎\n\
  \n-------------\n\n孫藝珍主演的《腦海中的橡皮擦》也是由甲上發行，明日9/10上映\n\n--\n                     \
  \            09/09 16:02"
