url: https://www.ptt.cc/bbs/movie/M.1452421728.A.58C.html
title: '[討論] 電影「緣起不滅」是韓劇老梗還是新創？'
content: '大學時有次坐客運回台北，剛好放的就是緣起不滅


  看的熱淚盈框，覺得實在很催淚感人


  後來跟同學討論，他們說很多韓劇韓國電影都是這樣？


  用的手法跟元素很雷同


  因為很少看韓劇，所以不太清楚


  想請問大家，緣起不滅（The Classic）當時在韓國跟臺灣的反映如何？


  有紅過嗎？


  補上很好聽的主題曲






  --'
