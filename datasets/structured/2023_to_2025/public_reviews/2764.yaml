url: https://www.ptt.cc/bbs/movie/M.1707646414.A.F10.html
title: '[  雷] 緣起不滅'
content: '防雷


































































  這部也是多年前的愛情經典

  在韓國愛情片可能有前幾的地位

  有些片段和劇情安排的確是狗血了點沒錯

  尤其是最後女生還真的跟當年男生的兒子在一起

  這位兒子沒什麼經過鋪陳的狀況下如此安排

  會有刻意甚至嬌柔造作的效果

  即使這種愛情片比較不會被這個問題影響

  另外還有個小缺點吧

  過去篇幅也許很不錯,現代篇幅卻限縮不少

  應該是因為片長本來就偏長了

  如果能拍成兩個半甚至三小時的長片

  角色之間一定會更飽滿,也更可能改善狗血問題


  用理性點角度說了這部電影能更好的地方

  但這種電影必須用感性去看待

  就會覺得不只感動浪漫而且恰到好處

  不管是三角關係還是當年韓國的民風

  這些編排都放到了很適合的位置

  當然整個情感都會被牽著走

  看在餐廳一開始隱瞞失明的那段就知道了

  還有好友嘗試自殺背後的種種原因

  這些賺人熱淚的段落相信各位不陌生

  難怪這部電影能稱霸這麼久,畢竟這麼多的難以忘懷

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  萊斯特在最後敘述中講述了生活中有意義的經驗，他說，儘管他死了，他還是很高興，因

  為這世界上有這麼多的美


  --'
