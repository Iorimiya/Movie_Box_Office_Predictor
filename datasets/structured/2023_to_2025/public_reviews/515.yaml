url: https://www.ptt.cc/bbs/movie/M.1510174380.A.D60.html
title: '[有雷] 電影【死者的審判】暗喻諷刺的現世審判'
content: '本文出處(圖文BLOG)::






  對我而言【死者的審判】是個故事設定有趣的電影，


  它做了一個奇想假設：


  「假設冤死的人可以復活，向對自己加害者復仇，會是甚麼樣的情況？」


  亦是延伸了聖經所謂「最後的審判」，將「審判」這件事出現在現世，


  讓被害者的怨氣得到救贖，


  在電影的前半段，非常令我燒腦，拼湊著過程中的細節，完整故事的推理，


  是吸引人的地方。


  除了帶有「法網恢恢，疏而不漏」的寓意之外，還暗諷著韓國的司法，


  及涵蓋著人情世故、母愛親情，


  劇情推演步調上，並不使人感到無聊，有些配角關係稍微交代不清楚，


  但整體故事算是很完整，


  給了結局單一而絕對的解答（個人比較愛適當的留白，或稍微開放式的結尾）。




  另外，個人認為本片演技亮點的金海淑，演技依舊不減韓劇魅力，


  記得以前看她飾演韓劇中的媽媽，真的會哭死人，


  此片金海淑依然每一個地方都很到位，真的是超級會演媽媽。




  #母愛 #奇想 #最後的審判




  - - - - 以下內容含有劇情 慎入有雷區 - - - -


  - - - - 以下內容含有劇情 慎入有雷區 - - - -


  - - - - 以下內容含有劇情 慎入有雷區 - - - -





  本片的故事架構頗富創意，但不是獵奇電影，


  假設如果有超現實力量，這股無形的力量給予所有含冤或有怨氣的死者，


  能重返現世去審判兇手，


  這些死而復生的人稱做：「RV」跟活人一樣保有原記憶及思考能力，


  當完成復仇之後，他們就會自燃而消失。


  故事比較特別的是復活的母親（金海淑 飾）向自己兒子振洪（金來沅 飾）攻擊，


  引起調查研究RV的相關人員注意，


  也使自身是檢察官的振洪重啟了當初母親被殺害的案子。




  簡單而言，我覺得本片真正的意涵，


  其實是諷刺韓國警政草草結案的辦案態度及能力，還帶有道德警世的意味，


  關於自己的母親為何被殺？沒有找出真正的兇手就結案，


  身為檢察官的振洪在母親復活後，因為自己被懷疑是為了詐領保險金等等，


  才積極去尋找真正的凶手，


  這樣的行為也未免太令人不勝唏噓。（主角職業是檢察官也算蠻故意的故事設定）




  1.諷刺韓國警政媒體 自殺率過高的真相


  隨著草草被結案的受害者紛紛死而復活地向真正的凶手討命，


  給各個發生RV事件國家的警政單位不少壓力，


  間接證明吃案及錯誤的結案，或是辦案不力，為此可發現電影過程中，


  不少橋段地方都有背後的黑手，跟隨著主角或是被派來調查主角的檢察官之腳步，


  將證據消滅，或是掩蓋事實，


  把被RV復仇後的屍體往漢江丟，說道是最乾淨及簡單的手法，


  難以辨認的屍體就不易再被勘驗，也易被媒體渲染成自殺，


  這是處在自殺率高的國家好處，莫不同時暗諷著韓國媒體及警察。


  事實上，這些將證據消滅的行為，倒不是幫忙主角，而是不願將RV的事件擴大造成恐慌，


  追根究柢或許要說，怕這些莫名來到現世的復仇者揭開一些瘡疤，


  有一幕有趣的地方，主角振洪（金來沅 飾）說道，


  可是網路上面已經有很多RV的影片了（意思是紙包不住火），


  另一個人答，網路上也有很多UFO的影片阿，但你相信嗎?




  2.莫以善小而不為　莫以惡小而為之


  本片一開始，出現的線索確實讓觀眾不由地往「兒子與母親之間到底存在著甚麼事情?」，


  是否為了保險金，而殺害自己母親!?


  將保險金受益人莫名分給素不相識的陌生人，也是起初令人感到詭譎的地方，


  兩者之間的關聯，就讓觀影者自己去看了，


  然而隨著劇情直轉下，希望自己兒子能功成名就，有著大好前途的母親，


  可說是無所不極，感受到濃烈的母愛，


  但對於覺得卡車遺失尋回是小事，收受了賄絡的小警察，


  恰巧正是代表著社會各個地方不可缺少的小螺絲，


  有沒有曾經可以隨手幫忙，卻沒有出手幫忙？


  有沒有覺得是小錯誤，所以算了，而衍生出更大的遺憾。




  3.勇於面對 認錯的懺悔


  電影中的母親，將兒子酒後駕車的一切過失都掩蓋了，


  事實上主角或許可能真不知道他酒駕後的過失，但這是好事嗎?


  RV母親在昏迷的時候，也喃喃自語自己被兒子害死，


  為兒子前程可謂盡心盡力的行為，這樣真的好嗎？


  在母親生前，有幾幕都演出其實兒子對於母親的好意，有時不耐煩的態度，


  雖然不到大不孝的地步，但也讓思考著孝順的意涵。


  酒駕肇事，以及肇事逃逸，殺人卻逍遙法外，帶著僥倖的心情存活著，


  恰恰是在這片所看到要探討的無形審判，


  已經復仇RV母親為何還可以存在於現世，


  我的想法是因為她的母愛知道自己兒子有危險（清楚整個事件），


  存在的原因只是要阻止另一個RV向自己的兒子討命，結語說道原諒也可以代替復仇，


  或許該說放下仇恨，才是真正的結束。




  結論：


  這部片故事架構及腳色設定讓我感到新奇特別，中前段真的蠻喜歡，很吸引我，


  但結尾不知道為什麼讓我覺得有點惆悵，將主角的懺悔從無形力量的審判，


  帶往有形的審判（法院），


  說教意味稍嫌濃厚，但也是本片帶有警世及孝順的用意，


  或許結局下的太絕對，沒有留白讓觀眾稍微有想像空間，是個人覺得些微可惜的地方。



  --'
