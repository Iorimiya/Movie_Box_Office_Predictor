content: '今天租了這部來看,就上來爬爬文


  媽媽在徐檢的夢中說：是你害死我的,為什麼裝作不認識我

  （這時候徐檢看到了小女孩）


  所以當一開始聽到教友說到審判時引發了主動攻擊

  （後來的劇情有說RV會出現在被審判者的周圍1.5公里)

  再後來聽到徐檢叫媽媽,就解了這一個任務

  但後來徐檢去看媽媽時,媽媽沒有再發動攻擊標示指定不是殺兒子，

  所以後來兇手來了,就觸發復仇任務了

  抽絲撥繭後,也說服小女孩,後就一切執念放下成佛去了


  RV應該不是復活者,他只是亡者的代理人

  因為崔明淑說了,是崔明淑叫他來的


  整部片圍繞贖罪,贖罪方式有很多種

  以牙還牙,寬恕,懺悔等都是吧


  最後看完這部片其實有點小難過

  父母這樣的付出,真的很令人鼻酸



