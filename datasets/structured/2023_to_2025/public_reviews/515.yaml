title: '[問片] 殺死死者的兇手是誰?(日片)[微雷]'
content: '故事情節大約是:

  1.死者曾經坐過牢，獄友是拍AV的女優(B)。

  2.死者因為殺了人，要去溪裡自殺(溪裡水太小)，後來被一名廚師收留。

  3.死者和她的的弟弟(或哥哥)，因哥哥借錢給死者後，就斷絕往來了。

  4.死者的哥哥托自己的兒子(C)，幫死者處理後事。(C要叫死者姑姑)

  5.B去找C，要找出殺人兇手是誰？

  6.目前嫌疑犯是名跟死者有往來的流浪漢。(不確定是不是流浪漢,反正就是一位老先生)

  想知道片名，懇請神通廣大的鄉民告知，謝謝。


  --

