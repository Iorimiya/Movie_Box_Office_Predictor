title: '[問片] 美國特務去日本找兇手，順便照顧死者女兒'
content: "各位大大好，我是如思貓\n最近遇到一個很乖的小女孩，讓人想到兩部電影的小孩\n一部是魔法聖嬰，可是如思貓從頭到尾看不懂\n另一部是困擾好久的一部片，突然想到有電影板各位大神\n\
  \n以某次世界大戰為背景\n劇情一開始，是一個日本人去公共電話亭打電話\n之後一輛車開過來，對著電話亭掃射\n\n然後美國方派了日本人的情報員同事到日本查明事件始末\n\
  這位情報員同事是美國人，來到日本住到日本人家中\n遇上了日本人的小蘿莉女兒\n\n下面有雷\n\n\n\n\n\n\n\n\n\n\n中間片段，小蘿莉特地表演了一小段舞蹈，\n\
  說是特地準備要在自己生日那天跳給父親看\n男女主都很難過，但不忍心拆穿\n\n最後結局，男女主想辦法要告訴小蘿莉，他的父親已經......\n小蘿莉馬上回，父親永遠不會回來了\n\
  男女主很訝異，小蘿莉說，因為父親沒有在他生日那天回家\n所以父親永遠都不會回來了\n\n--\n\n只有這些部份印象深刻，其他都不記得了\n請各位賜教，感激不盡！\n\
  \n--\n  ： \n  \n\n\n     （請將上面網址，連中文及後面數字，全部複製到網址列貼上）\n\n--\n\n看來似乎沒人知道\n\n這部電影是很久很久以前的電影\n\
  最少是 30 年前（可能還更早）的電影了（好像透露年紀了）\n\n片頭被射殺的日本人被形容成無名英雄\n從美國人決定展開調查之後，整部片的場景就都在日本\n\n\
  不是尚雷諾和廣末那片，謝謝！\n因為小女孩年紀非常小\n\n--"
