url: https://www.ptt.cc/bbs/movie/M.1581431325.A.51A.html
title: '[問片] 一部去死者世界找妻兒的片'
content: '是一部大約10-15年前的歐美電影。


  不是<美夢成真>或<但丁的地獄之旅>。


  有在懷疑是否影集<魔界奇譚>，但跳著看了幾集不太像。


  太小的時候看的，劇情相當模糊，大致如下：


  妻兒（小孩大約2-3歲大）忽然過世，丈夫不願接受這個事實，


  決定開著車去類似死者世界/冥界的地方帶回他們。


  印象很深的是，剛進入冥界的地方非常陰暗，


  有很多骷髏在做苦工，還有開推土機之類的，都戴著工地安全帽。


  好不容易穿過他們之後，登上一個巨大的岩石（或是小丘？），


  很多人穿著白長袍在那裡排隊前進，隊伍的末端是懸崖，從天上有紅光照下來。


  丈夫在隊伍中發現妻兒，妻兒正在領取長長紅色的東西，似乎是木頭做的翅膀？


  妻子很驚訝丈夫出現在那裏，還解釋了類似「好人走到懸崖會變成天使飛走，


  壞人會掉下懸崖變成做苦工的永恆骷髏」這樣的事。


  妻子說自己沒有辦法起死回生，丈夫說那他一生做好事也是好人，他也要一起飛走，


  妻子說還沒死掉的人走到懸崖也會掉下去變成骷髏，勸他回去好好生活。


  結局忘記了。


  大概是這樣，很想好好的弄清楚劇情，困擾多年，拜託大神了！


  --'
