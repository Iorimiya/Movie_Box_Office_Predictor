title: '[討論] 極地追擊死者的悲情命運（有雷）'
content: '有雷小心…












  看完這片回家想了一下後發現其實死者的運氣還蠻悲情的，

  不論是不是那群反派出現，她多半都難逃死神的召喚…


  1.男主一開始發現死者是因為追蹤山獅的關係…線索一

  2.去死者哥哥住的地方發現有雪上摩托車單行上山的痕跡…線索二

  3.男主和女主循著痕跡騎到一半就發現樹林太密一定要下來步行…線索三

  4.男主最後在找山獅的洞穴時發現山下就是煉油廠…線索四


  如果上面都沒記錯的話，真相就是當天死者從哥哥住處騎車去找在

  煉油廠的男友，但是發現森林太密只好半路下來走，因此男友根本

  沒聽到死者車子的聲音，發生事情後只好一路跑到當時的停車處，

  但在半路上就不支倒地，可是這不就代表山獅洞就在這條路上？就

  算當天沒被攻擊，約會完回去牽車的路上不也難逃山獅的獅口？





  --'
