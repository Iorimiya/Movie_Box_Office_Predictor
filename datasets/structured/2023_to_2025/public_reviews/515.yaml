title: '[問片] 死者被埋到墳場（？）後會復活'
content: '如題，至少快要十年前左右的片子了，

  印象中一開始被埋葬然後復活的是一隻貓，

  後來開始有人被埋到那個墳場（還是某個特定地點？）後，

  又復活回到家裡。

  我記得透過這方法復活的生物性格都會變得很扭曲、暴力，

  後來好像有因為這樣造成悲劇發生。

  不好意思，因為是小時候看的、某些情節印象很深，

  但忘記片名是什麼了，還請眾版友幫助～

  謝謝大家！


  --

  對對對就是大家說的這部！剛剛看估狗好回味童年啊XD

  一樓說的應該是原著的書名～

  禁入墳場是電影的名字！謝謝大家！'
