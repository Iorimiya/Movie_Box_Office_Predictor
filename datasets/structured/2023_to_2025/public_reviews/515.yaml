title: '[好雷] 來自峽谷的死者 Die Tote aus der Schlucht'
content: '本片免費線上看連結，可搭配即時字幕翻譯欣賞：




  聖誕季到了，在德國二台媒體庫 ZDFmediathek 找找看有沒有什麼「銀色聖誕」的味道？是找到了很多聖誕主題電影，不過首先吸引我的還是一部遠方高山白雪皚皚、但地面秋意五顏六色、山村背景更有異國風情的
  "Die Tote aus der Schlucht" (2014) 直譯《來自峽谷的死者》。海報上除了景觀漂亮之外，還有一對令人看了就覺得登對的女同志主角：左邊小鳥依人的是現在德國四十世代常演小媽的Lavinia
  Wilson、右邊人高馬大的是現在德國三十出頭常演傻大姐的 Rosalie Thomass，兩人都是德國小螢幕演員沒啥國際知名度、但在山村出雙入對牽手查案就令人心花怒放！




  當然在這種片中女同戀情早就是再自然不過的背景，劇情真正主軸還是德國小螢幕最愛的「兇案」，剛好兩位女主一個法醫一個警察都不會置身事外。故事背景：德國東南段巴伐利亞邦靠近奧地利的阿爾卑斯山腳小鎮
  Ramsau bei Berchtesgaden 一間精神病院中，一位常年被綁定在床上的五十多歲人格分裂患者 Maria竟跑了出來，她過去一堆創傷腦中一堆影相心裡一堆怪力亂神都紛至沓來，果然不知不覺跑進山谷不慎失足摔死在溪邊！人高馬大的慕尼黑警察女主
  Susanne第一時間過來查案了，誰知她一看到死者的臉碰到死者身子、就渾身一震天旋地轉自己先昏倒 XD


  難道這死者與她有其淵源？她法醫女友 Isabell做個 DNA鑑定後還真發現有：這位死去的精神病友 Maria竟是 Susanne的生母！那奇怪啦，Susanne
  明明母親早在她五歲左右就過世下葬了、她也單親長大還與父親失和如今 25 年了、難道母親其實沒死卻被關在精神病院 25 年？這案子陰錯陽差查到自己身世來，只見這位一身風衣外表酷酷很
  tomboy 的女主角 Susanne既不哭啼也不憂鬱，就只是一臉若無其事公事公辦彷彿這也沒什麼... 但觀眾看她雲淡風輕的身段藏著顫抖的手指、風平浪靜的白天藏著惡夢的夜晚、若無其事的臉龐下閃現著模糊的驚悚回憶，都知事必有蹊蹺。




  於是 Susanne暫別警局與女友、踏上屬於她一人的查案尋根兼歸鄉之旅：(1) Maria 作為命案死者，是自殺他殺或意外？有多少人在後或從旁推了一把？這病院又有什麼不可告人？(2)
  Maria 作為她以為早已死去的生母，是如何流落此地？為什麼和自己五歲前的母親印象差這麼多？25年前自己五歲時她又發生了什麼事？家鄉小村又有什麼不可告人？(3)
  為了查案硬著頭皮回去見反目的父親，他知道母親的秘密嗎？墳墓裡埋的真是母親嗎？母親死時父親繼承她土地又迅速轉賣，是否背後另有陰謀共犯？最重要的是：父親對我的愛是真心嗎？我又能承擔父親的秘密與苦衷嗎？


  結果這案查起來，牽涉小鎮的土地開發與地方政治、家族秘密與集體利益、男性情誼與女性凝視、乃至傳統社會的顏面粉飾，令 Susanne拜訪越多線人越疑雲重重：精神病院院長
  Dr Mangold 處處阻撓她、孔武有力的男護士一次次架走她、爸爸對她訴求親情閃爍其辭迴避問題、小鎮男性跟她拼酒淨打哈哈轉移話題、老同學鎮長看似熱心幫忙其實都在誤導方向、旅遊業致富的鎮長老爸則劃下道來暗示這水很深...
  甚至她還被關後車廂被五花大綁被數度恐嚇！最囧的是她人高馬大身段煞氣看似超級女警、其實每次跟人衝突都被按在牆上 XD 有人好心解圍後整整衣服再耍狠放話。




  結果「這水很深」真有深到哪？光以兇殺查案的懸疑劇型來說，看到最後觀眾才會知道案情真相其實只是雷聲大雨點小 XD 與其說這在警匪劇情內有什麼驚人的「犯罪」，不如說在家庭劇情中有其隻手遮天的「秘密」，這秘密當然與阿爾卑斯山腳這塊
  Berchtesgadener Land 封閉小鎮保守傳統息息相關，小鎮守著秘密打死不願說出、就猶如 Susanne的傳統老爸 Josef藏著真心不願示人、而終極的「隱藏」上有屋頂閣樓下有地下墓穴等著
  Susanne大膽打開那禁忌... 雖然打開禁忌發現真相後令我們城市觀眾不免翻白眼，但也許那種鄉間小鎮保守社會真有可能做到如此極端。


  但若換個角度看當部家庭親情片、尤其當部德國 Heimatfilme傳統的「遊子歸鄉」片談論「父子情結」？那倒是伴隨著蕭瑟秋意處處有感，只要把「父子」換成「父女」關係在這主角
  Susanne身上都可通：她從城市回到家鄉重新適應了小鎮文化、作為城市女強人和鄉村男子拼酒一輪、在陌生的山間墓園拜訪陌生的逝去母親、帶女友拜見父親回味爸爸手藝、與女友擠在童年小床看童年照片；雖然回家查案為亡母「撿骨」令老爸與整個小鎮七竅生煙，卻也認識巴伐利亞紀念故人的「彩繪骷髏」習俗，令
  Susanne默默提起畫筆畫起另一傳統「聖誕彩球」期待下回的父女重逢...




  結果此片表面雖是「警匪懸疑片」，其實真正魅力都在小鎮風情，當部女版「遊子歸鄉片」頗有詩意美感！不過我覺得更大魅力還在這位人高馬大女主演 Rosalie Thomass身上：她表面強壯玩世不恭舉重若輕、但其實總是笨手笨腳惹一身腥，這姿態挺像德國男星
  Matthias Schweigerhöfer 戲路；而她煞氣查案卻每遇驚慌就昏倒、悠悠醒轉又整整衣服當作沒發生，亦頗有三分《斷頭谷》強尼戴普的小男子味道；而她搭配個頭嬌小也較女性化的Lavinia
  Wilson，看似很有肩膀保護女友其實都被女友救 XD 在我今年片單中可算「最萌銀幕女同」吧？推薦 ZDFmediathek 欣賞。



  --'
