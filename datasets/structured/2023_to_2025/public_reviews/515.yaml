url: https://www.ptt.cc/bbs/movie/M.1513597929.A.C15.html
title: '[好雷] 可可夜總會-當生者與死者相遇'
content: '迪士尼與皮克斯再度攜手帶來的動畫，在聖誕佳節期間，

  俠著冰雪奇緣的雪寶前來報到。

  不知道這種正片前的短片是否會成為傳統

  （記得第一次是「腦筋急轉彎」前的火山之歌"Lava"），

  其實不要影響到正片的節奏與風格，站在消費者的立場來說，就當是bonus賺到。

  當年的火山之歌一度讓我以為我進錯場XD 所以今年片商在電影片名上做了註記。

  而我們可愛的Elsa公主也為可可夜總會起個一個不錯的「序」，

  關於家庭的傳統價值、文化與智慧的傳承，

  雖然我沒有特別喜歡雪寶，但在看到Elsa公主還有冰雪奇緣的彩蛋時還是相當興奮，

  甚至有幾段讓我回味當初看冰雪奇緣的感動。（腦中又再度想起Let it go！）


  可可夜總會是我有記憶以來第一個直接以「生死」為主題的動畫。

  要如何讓觀看動畫的孩子認識死亡與死後的世界？

  要用怎樣的口吻與價值觀？

  觀影過程中，都可以感覺到這部份被小心翼翼細心地處理過。

  這部份的教育在華人的文化中相當少見，我覺得是一個大膽但卻又有趣的嘗試。

  以墨西哥的「亡靈節」當天的節慶為故事主軸，鉤勒出一個繽紛的生前與死後的世界。

  （真心覺得西班牙語好好聽～Hola～Gracias）


  除了生死之外，慎終追遠、文化傳承、家庭、單親、音樂、夢想甚至是

  上一代的恩怨情仇影響到下一代（不知是否有專有名詞指涉此概念）等等

  也都可以在可可夜總會裡見到。

  整體而言，雖然我感覺也許受限於篇幅與各類文化對於死亡不同見解的「留白」，

  可可夜總會在死後世界的刻畫，讓我感覺帶有敬重的謹慎而略顯得收斂保守

  （看過動物方城市還有腦筋急轉彎就懂我的意思），

  但在音樂、劇本還有故事的細膩感人程度都相當到味。

  奧斯卡年度最佳動畫應該是十拿九穩？


  電影字幕跑完後，我坐在位置上，聽著「Remember Me」，

  讓我想起了老爸在家裡的電話旁放著阿嬤的照片，

  而我就像是Miguel的視野，看著爸爸懷念著她。

  可可夜總會，就像一場華麗的音樂嘉年華，

  熱鬧、溫暖地串起了生與死兩個世界，

  讓生者的思念與死者的愛一起在亡靈節這一天相遇，

  再度擁抱彼此、感受到彼此、

  記得與被記得。


  --'
