url: https://www.ptt.cc/bbs/movie/M.1510670136.A.D81.html
title: '[好雷] 死者的審判 -- 實現公理正義的好方法'
content: '當兇殺案遲遲無法偵破，何不讓知道兇手的受害人復活追兇呢！




  在近現代的世界，兇殺死亡的受害人會復活緝兇，他們找到兇手以眼還眼將其殺害，達


  成復仇任務後，便在雨中自燃消失。這些復活的受害人被稱為「犧牲復活者」。




  年輕檢察官徐振宏的媽媽崔明淑在一個下雨的午後被機車騎士搶劫殺害，檢調單位卻急


  著將案件結束，甚至偽造DNA吻合的報告，用不相干的漢江浮屍張冠李戴，宣稱兇手投江


  畏罪自殺。身為檢察官的兒子雖然認為案件疑點重重，但只能屈服DNA「鐵證」。




  七年後，崔明淑復活並攻擊自己的兒子徐振宏，因為犧牲復活者只會攻擊真兇，徐振宏


  的處境變得很尷尬。隨著案件抽絲剝繭，發現多年前的意外是造成這一連串事件的遠因，


  徐振宏當然也牽涉其中。




  法學院時期的徐振宏得知自己通過高考，當晚外出與同學好友一起喝酒慶祝。爛醉的徐


  振宏想起過往母親賣菜的艱辛，竟偷開一輛滿載高麗菜的小貨車，在市區搖搖晃晃地行


  駛，意外撞死一位小女孩。




  當徐振宏昏沈沈地開著小貨車回到家，媽媽驚覺大事不妙，將小貨車開回事故地點，卻


  意外遇見小女孩的父親。小女孩的父親窮追不捨，崔明淑反而意外將他撞死。承辦警員


  接受崔明淑的賄賂，將事件結案。徐振宏因為酒醉，對自己的罪行渾然不知，當然更不


  可能知道母親幫他做的一切。




  機車騎士雖然刺殺崔明淑一刀，但真正導致崔明淑死亡的是復活的小女孩父親。他撿起


  機車騎士掉落的刀，朝崔明淑猛刺數刀，直到崔明淑死亡。




  為什麼檢調單位要急著將崔明淑的案件結束？




  一個犧牲復活者背後代表一個尚未解迷的案件，越多的犧牲復活者代表越多的案件，象


  徵國家的法治不彰，辦案不力。尷尬的是，如果先前警方已經宣布這些犧牲復活者的案


  件破案，代表當時的兇手根本不是真兇，只是為了破案而破案。




  小女孩也成為犧牲復活者，運用超自然力量準備殺害徐振宏。然而，同樣也是犧牲復活


  者的崔明淑哀求小女孩放過徐振宏，兩個人都選擇以原諒代替復仇，在雨中自燃消失。




  母愛是不求的回報的




  雖然崔明淑的死是徐振宏造的遠因導致，她復活後也確實曾攻擊徐振宏。不過，母愛似


  乎能逆轉復活的審判程序，反過來保護徐振宏免於小女孩的復仇。




  這個故事需要「犧牲復活」的架構嗎？




  如果沒有「犧牲復活」的架構，母親幫前途似錦的兒子掩蓋罪行，產生後續無窮的效應，


  最終還是牽連到自己與兒子的故事情節，已經有許多電影演繹過。加入「犧牲復活」可


  以額外探討政府掩蓋兇案的惡習，與人民期待能自行緝兇的渴望。




  小彩蛋




  飾演徐振宏姐姐的演員是張英南，她曾在「開心鬼上身」演出。雖然在本片的演出並不


  多，還是很開心能在不知情的情況下看到她。









  --'
