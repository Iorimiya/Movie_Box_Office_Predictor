url: https://www.ptt.cc/bbs/movie/M.1514938822.A.39B.html
title: '[普雷] 死者的審判 RV: Resurrected Victims'
content: "大家早安\n\n死者的審判\n\nRV: Resurrected Victims\n\n英文片名是\n\n復活的犧牲者\n\n所以到底\n\n\
  死者的審判\n\n是什麼？\n\n復活的犧牲者\n\n又犧牲了什麼呢？\n-----------------------------\n以上只是防雷頁\n\n\
  本片的命題很簡單\n\n如果有人含冤而死，就會復活，對加害人做出審判\n\n不過這樣實在太不合常理，所以就把設定當成魔幻劇情來看吧\n\n畢竟現實是人死不能復生，但為什麼韓國人還會拍這種片？\n\
  \n從他們家裡的擺設，牆上看到十字架，他們家庭是信十字教\n\nWIKI 查了一下，大約接近三成的韓國人，都信十字教\n\n在聖經中，耶穌也有復活的故事，死去的媽媽突然復活，也就不奇怪了\n\
  \n媽媽怎麼死的？難道真的是被搶匪殺死的嗎？\n\n發現另有其人，但這個人明明早就車禍死了？難道這個人跟媽媽一樣復活？\n\n男主角一直看到也是車禍死的紅衣小女孩瞪他，但一直搞不清楚為什麼？\n\
  \n難道紅衣小女孩也是像媽媽一樣復活？\n\n在一連串的蒐集證據之後，終於發現了真相\n\n當初警察看到紅衣小女孩的爸爸喝醉酒，小女孩要求警察帶她走\n\n但警察怕被爸爸告，所以沒帶她走，結果紅衣小女孩被喝醉酒的男主角撞死\n\
  \n其實一開始，男主角看到媽媽開貨車賣菜被刁難，裝作沒看到，和朋友聚餐喝了酒\n\n喝醉了，看到空無一人的貨車，才突然想到，媽媽賣菜討生活很辛苦\n\n想把貨車開回家，撞到紅衣小女孩也忘了\n\
  \n媽媽和妻子看見開回家的貨車上有血跡，發覺大事不妙\n\n媽媽開回現場，看到紅衣小女孩大量失血，被紅衣小女孩的爸爸騎機車看到\n\n媽媽想開貨車烙跑，又被追上，就撞死她爸爸\n\
  \n媽媽護子心切，又拿錢賄絡警察，叫警察把這兩件事，當成交通事故處理\n\n所以殺死媽媽的就是紅衣小女孩的爸爸！\n\n換紅衣小女孩要找男主角復仇了，但媽媽出現了！希望紅衣小女孩能原諒他\n\
  \n這次紅衣小女孩沒有復仇成功，但男主角還是接受了司法審判\n\n冤冤相報何時了？也許是媽媽的母愛，化解了仇恨？\n\n紅衣小女孩也是缺乏媽媽的母愛啊！\n\n\
  如果紅衣小女孩有溫暖的家庭，也許就不會一個人出門，到路上等爸爸回家了？\n\n如果警察不要那麼怕被告，也許就可以帶紅衣小女孩，先安全離開失能的家？\n\n如果當初男主角不避嫌的幫忙賣菜媽媽，不去喝酒聚會，也許就不會酒駕肇事？\n\
  \n如果不是因為男主角考上檢察官，也許媽媽不會那麼狠心撞死紅衣小女孩爸爸？\n\n如果警察不要收賄絡，也許冤案就會變少了？\n\n但這一切其實都來不及了\n\n\
  告訴我們，人要活在當下，堅持做對的事情，不要像酒鬼逃避問題，徒留遺憾\n\n--\n 安全、無毒的食物\n 有錢結婚生養小孩\n買得起的房子\n被老闆當人看\n\
  下班還來得及和親友吃晚餐\n租得起房子找得到工作\n\n--"
