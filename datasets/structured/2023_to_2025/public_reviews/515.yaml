url: https://www.ptt.cc/bbs/movie/M.1427098910.A.509.html
title: '[問片] 死者還陽的電影-洋片'
content: '我只記得劇情一開始是一個女主角開著車載女兒到一個類似鄉下的地方居


  住然後和女兒住進了一個老房子，老房子的前主人好像是牧師還是醫生之類的。


  然後女主角和女兒到懸崖時，女兒突然的失蹤了，接著男主角（爸爸）也回來


  找女兒，他們認為女兒可能意外落海，後來卻又出現了一個神秘的小女兒。



  　　但當她報出身份時，女主角卻發現他是前屋主已經死去多年的女兒。


  　　有一幕是小鎮有個秘密，好像是那個牧師還是醫生之類的吧，就騙了村民


  只要從懸崖跳下去就能永生之類的，但其實只是在為他死去的女兒舖路回陽間


  。


  　　後來男主角覺得女主角瘋了，甚至有人認為是女主角推女兒落海的，但女


  主角冥冥知道女兒可能還活著，於是就逼問了那個神秘小女孩一些事情。


  　　我記得那個女主角後來跳下懸崖之後好像真的到了另一個空間找到女兒，


  並把女兒帶回人間，但最後女主角以為自己也回來了，但是並沒有，而男主角


  以為女兒平安的回來了，但其實那個女兒其實是神秘小女孩借屍還魂。


  --'
