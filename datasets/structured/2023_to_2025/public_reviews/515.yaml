title: '[新聞] 亞歷鮑德溫拍片誤殺弄出人命 已與死者家屬達成和解'
content: '新聞網址：


  亞歷鮑德溫拍片誤殺弄出人命 已與死者家屬達成和解


  （中央社洛杉磯5日綜合外電報導）


  美國影星亞歷鮑德溫（Alec Baldwin）去年在片場意外槍殺工作人員及誤傷導演，面臨官

  司訴訟。他今天表示，自己與死者家屬達成民事和解。


  法新社報導，亞歷鮑德溫去年10月在美國新墨西哥州為低成本西部電影Rust進行排演時，

  手持一支柯特（Colt）手槍，射出實彈殺害當時42歲的女攝影指導賀勤茲（Halyna

  Hutchins）。


  亞歷鮑德溫是該片製作人兼演員，據稱他被告知這支手槍很安全，他先前曾稱自己沒有扣

  下板機，但美國聯邦調查局（FBI）報告判定，這支手槍運作正常，只有扣下板機才會擊

  發子彈。


  事隔約一年後，亞歷鮑德溫今天在Instagram發文表示，他己與賀勤茲的家屬達成民事和

  解，感謝為解決這場慘劇作出貢獻的每一個人。


  賀勤茲的丈夫馬特（Matt Hutchins）則在聲明中指出：「我對互相指責或究責沒有興趣

  。我們所有人都認為，賀勤茲之死是一場可怕的意外。」


  根據和解協議，亞歷鮑德溫的電影Rust將於明年1月恢復拍攝工作。


  （譯者：陳正健）1111006


  --'
