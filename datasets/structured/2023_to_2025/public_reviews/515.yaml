url: https://www.ptt.cc/bbs/movie/M.1510050393.A.0C9.html
title: '[微好雷]《死者的審判》　有些債遲早要還 '
content: '部落格版→

  以下有雷

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  　　《死者的審判》是一部引人入勝的懸疑片，因為它兼具了奇想科幻的元素，在劇情設

  定上有個新穎的設定：「死者會重返人間找真兇復仇。」這點就能為劇情埋下許多不確定

  因素，翻案或誤判等情況，在營造懸疑氛圍有很大的發揮空間，製造更多衝突感，更吸睛

  。


  　　本片在人物塑造方面，男主角振宏（金來沅飾），一心想抓到七年前在街上殘忍殺害

  母親（金海淑飾）的兇手，於是成了一個冷酷的檢察官，在性格、職業、動機方面都有合

  理的設定。可惜其餘配角除了母親之外，較無深度描繪，皆是用來推進劇情發展的棋子，

  屬於面孔模糊的角色（內心層面），對於觀眾來說，難有記憶點。若比較演技，在本片金

  海淑更勝金來沅一籌，不論是展現母愛的溫柔或報仇的憤恨，都很到位，尤其是她尋兇時

  的表情，真有股肅殺之氣。


  　　為了讓劇情難以捉摸，不易被猜到，所以《死者的審判》的劇情主軸用了案外案的題

  材，增添懸疑性，不過片長僅有90多分鐘，所以原本以為節奏會相當緊湊，但又不時插入

  一些不是很重要的角色，來解釋RVP（犧牲者復活現象）這個設定，龍套太多又搶話，以

  至於節奏略顯拖沓，但還好本身的故事性夠吸引人，再加上案外案的設定讓懸疑性加倍，

  整體來說，還是能保持一定的娛樂性，並不會令人感到枯燥。


  　　若單單以偵探懸疑類型電影來論，《死者的審判》在案情方面的撲朔迷離程度，並非

  特別的令人拍案叫絕，但用母愛和勇於認錯的普世價值觀來作結，表達法網恢恢疏而不漏

  的精神，也算收得不差，有個合情合理的走心結局。而本片有涉及警察、檢調機構的元素

  ，免不了跟其他韓國電影一樣，安排了收賄、包庇、擺官僚架子等劇情，藉機汙名化這些

  機構的人員。這年頭看韓國電影，關於警察或檢調的角色，十個有九個不靠譜，看來南韓

  人還真不太信任這些執法機構。最後，用一首十四行詩點評：


  男主角振宏是個冷酷的檢察官，

  一心想要調查生母被殺的懸案，

  某天母親竟復活出現在家裡面，

  並且攻擊男主角想拉他進黃泉，

  往生者重返人間追殺真兇申冤，

  這種現象被稱之為死者的審判，

  男主角從此被當成頭號嫌疑犯，

  為了自己和母親他重新查案件，

  但真相恐會危及國家公信威權，

  擔心社會動盪高層暗中搓湯圓，

  原來所有的癥結點在於七年前，

  酒後駕車撞死無辜是全案關鍵，

  本片闡述溺愛小孩是錯誤示範，

  如果有錯要改過自新勇於承擔！


  九品中正制度評分：四品，中上之作。

  （一品最高，九品最低）


  【同場加映】

  《亞人》影評→




  --'
