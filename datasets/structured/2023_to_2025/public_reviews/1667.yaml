url: https://www.ptt.cc/bbs/movie/M.1700746986.A.AC0.html
title: '[好雷] 很沈重的一部片 - 陰影下的她'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  一部從頭到尾充滿著絕望的電影，揭露了所謂產業建教合作被學校和企業玩弄的實習生。

  本來其實一直在期待著後面會在網路揭露這家公司或者是學校體系的醜陋面，但是直到結

  尾無論是學校、教育部門甚至是剝削實習生的公司，看起來沒有任何一個人為此付出代

  價......真的難以想像會有這樣的事情發生，但這可能真的存在，不只韓國，甚至台灣.

  ....


  看到一半的時候我也很好奇這麼不開心為何不直接離職，後來才知道如果離職，會被學校

  貼上標籤，做著最苦的工作直到你找到下一份工作，要不然你就會被退學，這根本是學校

  帶頭霸凌啊！看到這裡好想說 金道奇 彩虹運輸該出動了吧！！快被他們醜陋的嘴臉氣爆


  還有最可怕的是當被客戶辱罵，被公司學校威脅，素熙父母的存在感近乎為零，即便女兒

  求救，他們直接裝聾，就連女警問他們素熙是否曾經和他們講過什麼，素熙爸爸竟然還可

  以說自己什麼都不知道 = = 真的好噁心


  結尾女警看著素熙因為終於學會了那支舞開心地笑出來的影片，可能是全場最溫馨的片段

  ，但這樣快樂素熙再也看不到了，甚至女警都還來不及認識這位女孩QQ


  --

  原來是真實故事...有時候真的覺得韓國的升學文化好可怕

  最痛苦的就是給予過關心的組長自己卻受不了先自殺了，再看到後面那女組長超氣

  真的原本還期望後面會有什麼反轉，但真實的人生就是這麼殘酷QQ'
