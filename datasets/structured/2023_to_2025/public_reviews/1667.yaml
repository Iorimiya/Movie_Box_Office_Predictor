url: https://www.ptt.cc/bbs/movie/M.1704129989.A.E2F.html
title: '[好雷] 陰影下的她'
content: '雷文防雷資訊頁



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  連假在串流亂翻亂點，決定看這部。

  看到一半，才發覺，是韓國又一震懾人心的社會寫實電影。


  一開始平平淡淡的，

  包括女主角素熙在內，青春洋溢的一群高中畢業生，即將踏入職場實習生活，

  卻萬沒想到，這看似光亮的前程才是他們惡夢的開始。


  素熙實習的單位是一間外包再外包的客服中心，

  工作目標是要想盡辦法阻止客人解約，並再推銷商品。


  第一個男組長，讓我充滿感激與憐憫，

  他是個溫暖的人，卻也被困在不合理的體制裡，

  下場非常令人傷感。


  素熙有次加班到深夜，

  下班前對組長的那一瞥，頭輕輕的一點，

  似在道別，又像在道謝；

  組長在昏暗的另一頭，獨自對著電腦螢幕，沒有看見，

  那個畫面有一種蒼涼的悲哀油然而生，

  我忽想起，組長也許才是這個地獄裡最受折磨的人。



  電影分為兩條主線，前後各半，

  到很後來我才發現那位正氣凜然的警正，

  就是從前我看《空氣人形》時非常喜歡的裴斗娜，

  卻脫胎換骨一般，成為一個成熟、嚴肅、帥氣的角色，

  心情和目光完全被她的氣場扣住了！


  儘管她的同情心和正義感令人無比動容，

  她終究也只能以一種無力的、挫折的模樣，在事件邊緣遊走，

  在那些腐敗的體制與事不關己的人性中逐漸凋萎。


  最後一場戲我很喜歡，有如李滄東《生命之詩》，

  所有辛苦的壓抑，無聲的抗議，

  在此安靜的釋放。



  這部片也很會利用鏡頭語言來雕琢細膩的情感，

  除了前面說到的組長獨自加班的鏡頭，

  還有素熙從練舞室出來後，抬頭看見下雪了，

  或素熙在小雜貨店裡喝著酒，從門縫溜到腳邊的陽光，

  都令人悵惘。


  觀影過程中，

  我緊張的盯著每一次衝突，

  一再感知到劇中人沒有說出口的對白。

  揪著心看完後，長嘆了一口氣，

  鬱苦難言。


  --'
