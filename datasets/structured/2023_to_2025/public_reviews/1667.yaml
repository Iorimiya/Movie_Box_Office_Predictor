url: https://www.ptt.cc/bbs/movie/M.1683912358.A.8D8.html
title: '[好雷] 那張虛幻的網：《陰影下的她》'
content: "本文涉及劇情，且具個人觀點，推薦觀影後再讀。\n\n\n\n　　　　圖文網頁版：\n\n　　　　\n\n\n　　　　預告片：\n\n　　　　\n\
  \n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\n\n那張虛幻的網：《陰影下的她》\n\
  \n\n\n　　丁朱里執導的《陰影下的她》是一部很安靜的電影，像水流緩慢晃動，\n\n像從空中落下的雪，像冬夕逐漸偏移的短短暖意，但我們都知道很快就沒入\n\n\
  黑暗。\n\n\n\n　　十八歲即將畢業、還是高中生的金素熙（金施恩飾）因為學校的產學合\n\n作做網路公司外包的客服，一心嚮往成為白領階級的她，背負著導師與學校\n\
  \n的期待進入職場。所謂客服，不只是單純為客戶解決使用上的問題，還得學\n\n會「防禦」說服客戶延遲解約、續約與推薦商品，在秒數與通數的要求下，\n\n溫言軟語讓客戶滿意掛上電話，最好能在五個客服中心當中取得最高業績。\n\
  \n人的價值以數字為計，個人特質與尊嚴全被弭平，加上客服人員均是女性，\n\n舉凡發洩壓力、遷怒、情緒勒索、性騷擾的需求，就輕易尋得最合適的對象\n\n──但那樣無視需求（即使是剛死去孩子想要解約的悲傷父親），一再推銷\n\
  \n的「服務」如何能避開怒氣？公司卻用同樣的態度對付客戶與客服，收受客\n\n戶利益卻給客服最低待遇，讓後者承受前者的負面情緒。我印象最深刻的一\n\n次是，來電的男性不斷對素熙進行言詞鞭笞，而組長李俊昊一接過來道歉，\n\
  \n對方馬上轉變語氣──那樣清楚的，「知道對方是人」的語氣──只要挑到\n\n錯處就能「指教」女人的張狂，瞬間收合乾淨。\n\n\n\n　　被抹平個人殊異性的孩子，不只素熙。做吃播主的朋友恩雅，曾在現場\n\
  \n吃播被同店的向人批評（然後被在旁的素熙狠罵），在網路上則被指教不如\n\n賣身；她的男性朋友姜東浩、泰俊，則都剃了平頭，被工作和前輩欺壓得沉\n\n默無聲；而高竣熹因為高一在賣場工作遭到凌侮，學校卻不讓辭職，只得休\n\
  \n學在家，因為自責而酒精中毒險些喪命。他們曾經是彼此支持的好友，但在\n\n親眼目睹彼此的境況後，即使曾經無所畏懼、挺身而出的素熙，也只能轉身\n\n離去。李組長的自殺與遺書裡對公司的控訴與自咎都輕易的用保證書消滅，\n\
  \n素熙的結局亦早已預示。\n\n\n\n　　素熙不是沒有試著屈服與適應。她簽了否決李組長控訴的保證書，用最\n\n快的速度領會公司規定的要訣，然後取得第一名的業績──至少可以得到獎\n\
  \n金，這是適應社會了吧？但公司用各種名目壓低底薪、延遲兩個月發獎金，\n\n當她抗議，對錢的計較也能成為新任吳主管輕蔑的理由，憤怒與衝動也是不\n\n適任的藉口。就連辭職，也被大量譴責阻止，或者用沉默或勸導令其消音。\n\
  \n\n\n　　電影裡我印象最深刻的畫面，是素熙獨自喝過酒，走上山坡，望著水波\n\n粼粼的水庫，光影交錯猶如一張密網，讓人錯覺像是投身進去，將會被牢牢\n\n\
  網住。當素熙以凍結完整的屍首被送上岸，曾與她待同一練舞室的警正吳柳\n\n真（裴斗娜飾）開始追查她的死因，從生命開始，帶領我們倒著回顧她曾經\n\n拋下的東西：希望、尊嚴、金錢、信念、勇氣、樂趣、愛好……\n\
  \n\n\n　　吳柳真問金素熙的母親，是否知道她熱愛跳舞時，痛哭的、迴避求救訊\n\n號的母親說：不知道，如果我知道的話……要求解剖屍體的父親，也對柳真\n\n\
  說：不知道，我只對她說，你要認真工作。公司推給學校，不該推薦這樣的\n\n學生；學校推給公司與勞動部，說都在職場為何要學校負責？即使是地區的\n\n督學都嫻熟地推給教育部，說就業率高，高職才能獲得補助得以營運下去：\n\
  \n「我區區一個督學，能有什麼力量？」包括父母，沒有人願意為她的死承擔\n\n任何責任。\n\n\n\n　　素熙家境不佳，跳舞雖好，卻不如真正有才華的舞者。選擇就職，連父\n\
  \n母都不知道她對跳舞的愛好，就是明白那是即將成年的第一個妥協。只是彼\n\n時的她還不知道，學校、工作、父母、朋友，猶如原是製造存供的水庫上，\n\n那粼粼的紋網，從不承接她次次妥協後的沉沒──所以她刪掉了手機裡的全\n\
  \n部訊息與ＡＰＰ，只留下她最後在舞蹈室的、最後一支屢仆屢起、卻證實她\n\n仍身體自由的舞。\n\n\n\n　　但就如電影原名《下一個素熙》，那些以各種方式離去、得以存活的職\n\
  \n場新鮮人，將會成功攀附成為體制的網絡，她們的空缺將由下一批新鮮人接\n\n替；而那些墜落凍結解剖的，將會寂靜永眠。柳真奔波查問，最終只能回到\n\n原點，安靜地淌淚送她一程：看著活生生的素熙結束最愛的舞蹈，關掉人生\n\
  \n最後一次錄影。\n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\n     \
  \                             陳斐雯  貓蚤札（其三）\n\n--\n\n\n　　是。很多畫面都很安靜，但觀影結束後一直在心裡喧囂。"
