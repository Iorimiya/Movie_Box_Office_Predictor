url: https://www.ptt.cc/bbs/movie/M.1684077020.A.4D2.html
title: '[雷] 《陰影下的她》又一朵被體制摧殘的花蕊'
content: '文章取自「鳴影品」

  劇透不多

  --------


  看著韓國電影《陰影下的她》少女素熙的悲憤遭遇過程，不時會在心裡私以台灣經驗而納悶

  ，為什麼不PO網或向媒體爆料申張？為什麼還要繼續待下去？


  單論電影上的取材，南韓有個很強的優勢，是他們的社會活生生地持續不斷在上演許多嚴重

  不公不義的事，看在距離相對算近的台灣，常看得瞠目結舌。撇除殺人類型案件不談，《熔

  爐》的光州啟聰學校性暴力；《希望：為愛重生》8歲女童遭性侵致身體終生殘害，犯人刑

  期卻過於仁慈；《玩物》女明星因暗黑潛規則而尋短，這些真實改編的例子層出不窮；尤其

  我認真至今無法理解的世越號事件……


  回到《陰影下的她》，故事從學生實習制度變成職業學店與企業利益掛勾的勞力賤賣循環，

  延伸到底層青少年對於黯淡未來的了無生機；政府和社會就是那些漠視的惡魔目光。像素熙

  這樣對舞蹈有著熱情與天分的學子，若是沒錢沒勢的出身背景，無可奈何都可能進入這個無

  間地獄。


  電影的第一個小時，我們看到金施恩飾演的素熙如何消磨掉她對生命僅有的熱情而走向絕路

  ；第二小時，裴斗娜扮演的刑警帶領觀眾看見，即使試圖扳回公義，可是僵化的官僚政府體

  制，早已無視處處發鏽腐敗的問題；可是這又絕不只政府，也許整個麻痹的社會或守舊的父

  母周邊人都可能是共犯。


  丁朱里導演的《陰影下的她》獲選為2022年坎城影展國際影評人周閉幕片，可見殘酷現實受

  到的關注。金施恩今年憑此片獲得百想藝術大賞的女子新人演技獎。


  《陰影下的她》是一朵正在綻放的花被摧殘凋零。不公不義的真實在南韓層出不窮，電影讓

  人看得心寒。我們該引以為鑑，畢竟沒有人該成為下一個悲哀。



  --'
