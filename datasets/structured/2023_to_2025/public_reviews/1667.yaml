url: https://www.ptt.cc/bbs/movie/M.1684297530.A.426.html
title: '[好雷] 陰影下的她 - 生活隱然的線索與想像 '
content: '本片正在院線上映中


  很欣賞導演把這類本身是社會批判議題電影拍得很生活










  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  (刊登於網誌的原文)





  或許從電影介紹「社畜」用詞就已經預知電影會帶有批判意味，揭露韓國社會結構沉痾。

  包含好像不也太意外，教育部為了職業學校畢業生的就業率，造就失衡的實習制度，乃至

  於病態的業績文化讓實習生如免洗筷一樣，用完就丟。（抱歉，太批判的文字，反而寫得

  不太習慣）



  要說的是，也許這正是我們所認知到南韓背後真實與想像。近年來高度的經濟成長背後不

  為人知道的犧牲，包含略有耳聞的高自殺率。以三星集團為國家重要經濟命脈手機相關產

  業，伴隨著電影中背景網路供應商的客服相輔相成 ，還是狼狽為奸？如此想像對比著，

  自己因為要退租中華電信MOD，也接到類似勸說不要退租的電話，當然台灣的客服如同民

  族性 相較十分的談話總是挺和善，說如電影中硬要推銷倒還好。



  那些總是想起在我們生活中隱然存在的線索或記憶，自己好像也藉由這部片的偶然想起，

  如同過往的約聘制度下的上班族時光，或如同大家說的「學店」般，上課打混不知道未來

  要幹嘛的職校生活。或也曾經想像電話另一段的客服員的辦公室生活。



  就好像《陰影下的她》並非是全然二分地在處理女主角素熙（金施恩 飾）的不公平待遇

  ，關於勞資關係，一開始會想像是過去左派描寫著當代的紡織女工們被怎樣的剝削。但下

  班後她們同樣是喜歡吃喝玩樂消費者 (並非是左派那種對資本主義禁慾式的激進）。要說

  的是那些客服實習生，就像是以前職校的同學，或如街上遇到的周遭的一般人，會對工作

  抱怨，有時候也僅止於抱怨，並非會有什麼「起義革命」的念頭。



  於是電影中第一個死亡，也可以說是劇本上的巧思，眼睜睜地目睹，好像見證、喚起了，

  察覺事情不對勁的火種。但導演同時敏銳地知道，藝術創作面對，越沉重的議題，反而要

  越輕盈，精彩的正是那些隱晦的暗示。正如同素熙在內心萬念俱灰的當天，但看起來只是

  像日常的某一天，卻利用了下雪天氣，只穿拖鞋的暗示（或許已經麻木 ），也藉著細微

  的描寫，回想起來在自殺前喝的啤酒。還有門縫中灑下來的光線，不管陽光是幻覺，還是

  神諭，但還是感受得到溫度的嗎？



  電影結構後半段女警吳柳真（裴斗娜 飾）開始追查案情，中央政府教育部，地方政府教

  育局，層層共犯結構。就如同劇中網路電信公司，有總公司跟地方分公司一層又一層的單

  位，不斷地向下施加壓力（好比軍中士兵，士官，排長，連長，營長…如此階級化的似曾

  相似感）想當然而，電影到底會不會因為這樣的「小事」不斷往上追討，進而動搖國本？

  或如台灣電視劇《危險心靈》類似從學生上課看漫畫的「小事」出發，進而檢討整個台灣

  的教育制度與環境，而結尾處理，已經給了良好示範。



  導演也知道，面對社會現實的沉重，只要點到為止（並要也深知揭弊的功能性，與大快人

  心的有時只是一時激情的爽感），同時巧妙地安排女警在查訪案情二次回訪死者曾經到過

  的地方，同時在記憶中迴溯想像著那些看不見的線索，如同在雜貨店同樣喝著兩瓶啤酒時

  ，那道光線照射到腳邊的停頓共感，想像著此時與彼時，還有素熙遺留的手機剩下最後一

  支跳舞練習影片，也會讓人想起經過台北車站地下街偶然會看到那些對著落地鏡子再練習

  舞蹈的女生們。




  --


  拉特飯 - 以商業力量進入獨立市場

  (剛搬家內裝待修)


  --'
