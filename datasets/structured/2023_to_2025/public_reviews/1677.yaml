url: https://www.ptt.cc/bbs/movie/M.1683640654.A.351.html
title: '[好微雷]上流謀殺案 輕鬆的小品推理片 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這部英國推理劇，以一座位在英國小島上的古老房子為背景，老屋旁有著一大片陰森詭譎

  的樹林，傳遞著緊張不安的氣氛。




  影片的開頭是兩個看不清模樣的男性追逐扭打成一塊，影子投射到樓梯上，搭配繃緊的背

  景音樂，讓人對整部片開始有些想像。接著又出現蒸汽火車，也使人聯想到「東方快車謀

  殺案」。但是，受到邀請的人物只有六位，彷彿大幅降低了偵破案件的難度。




  因此，這一部的劇情在邏輯推理上並不會太複雜，劇情的步調會不時的放慢下來，並隨著

  故事的推進，透過每個人物的對話或行動，慢慢拋出一些線索，讓觀眾能夠跟著女主角米

  蘭達逐漸猜到發生的各種狀況究竟是怎麼一回事。而從電影的一開始，就不斷強調「凡接

  觸過，必留下痕跡」，提醒著觀眾記得注意各種細節。


  米蘭達以自身觀察入微的能力，偵破了發生在這幢老屋裡的謀殺案。如同米蘭達所說，每

  一個人都有嫌疑，但是因為不清楚彼此的關聯，所以無法推斷犯案的動機。然而，幾位受

  邀人之間的關係，也同時成為了真相當中的關鍵所在。





  最後一段兇手對自己殺人動機的自白，似乎某種程度隱射了有些人們經常對於他們心目中

  的上帝或所謂的造物主，僅只是冷眼旁觀人類深受痛苦，而從未伸出援手，感到怨恨與憤

  怒。相反的，他們之中能夠肯定自己的價值的人，宣示的理念則是由自己來定義自身的價

  值，靠著冒險的精神與不怕失敗的毅力，帶給身邊的人們更多的幫助。


  在看到電影的最後結局時，回顧整部影片，才發現確實如同米蘭達所說的，只要注意小細

  節，便能發現真相。包含幾位受邀來到小島的人們，來到老屋的第一場聚會，大家玩的兩

  真一假的自我介紹遊戲。




  這部影片在定位上，不會過於驚悚，幾乎沒有驚嚇的時刻，推理的經過也有著一定程度的

  趣味性，能夠擁有強烈的帶入感，享受與影片中的人們共同揭露真相的過程。



  --'
