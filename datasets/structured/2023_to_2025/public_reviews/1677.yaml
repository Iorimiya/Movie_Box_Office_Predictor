url: https://www.ptt.cc/bbs/movie/M.1683450448.A.5C1.html
title: '[普雷] 上流謀殺案Invitation to a Murder'
content: '以下有雷，請小心服用


  劇情故事擷取自網路

  1934年英國南方，六位素昧平生的陌生人被邀請至遺世獨居的億萬富翁 - 路易斯· 芬利擁?

  的小島中作客。一場突如其來的兇殺案奪走其中一位房客的性命，聰慧且強悍的格林不得不

  展開調查，直至真相水落石出......


  女主角米蘭達格林，本職是一位花藝師，厭惡枯燥乏味的生活，喜歡看推理小說，電影一開

  始就展現了女主角驚人的洞察力，像是跟書店朋友分享他收到富翁的邀請信函，朋友勸說他

  別去之餘，格林就發現書店裡有人在偷東西，起初對方不承認，但當格林指出書架上書本數

  目從46本減少到44本，犯人就從兜裡拿出偷取的2本書，認了罪，留下眾人的大吃一驚後，

  格林就轉身離開了書店，並堅定地踏上旅程。



  在這一趟旅途中結識了另外五位受邀作客的人，看似沒有關聯的人們，在後續發生的案件才

  知道大家是緊緊相扣的關係，殺人案件的發生只是個引子，透過格林的層層推理，在最後才

  揭露他們其實是彼此的兄弟姊妹！而他們聚在一起的原因則是因為富翁芬利知道自己即將老

  去，為了決定遺產繼承者是誰，所以才將他們召集在此，沒想到卻被自己其中一位子嗣給殺

  死，年輕時風流芬利，對於替他生下孩子的女伴不聞不問，但大家都已經是獨立的個體，沒

  有這份遺產他們還是能走出自己的人生



  有時候金錢是彌補不了那破碎的童年，錢能解決很多事情沒錯，但心靈上的痛卻是很難抹滅

  的，但錢給我的話還是會好好花的（？）



  --

  覺得氛圍沒有到很懸疑感'
