url: https://www.ptt.cc/bbs/movie/M.1683727234.A.07F.html
title: '[好雷] 上流謀殺案：不陷入泥沼就找不到答案 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  看完《上流謀殺案》內心十分譁然，

  因為結局真的是猜不到。


  這齣瀰漫著某種英倫浪漫氣氛，

  大概跟飾演女主角米蘭達·格林的米莎·巴頓有著濃厚迷人的英國腔有關，

  另一個熟面孔大概就是演唐納沃克的克里斯布朗寧（Chris Browning），但我有點忘了他

  的成名作是啥了，因為《全面攻佔3：天使救援》他只是個民兵。


  導演蠻擅長營造詭異氣氛的，

  開始就挺像史蒂芬金的驚魂記，

  尖叫的男聲驚響觸動全劇的脈搏，

  女主角的驚人推理觀察能力也被立體地形塑，

  簡直就像是被間諜家家酒的安妮亞附身一樣。


  就像其中一位主角沃克說的：「不陷入泥沼，就找不到答案」，

  究竟這齣劇會有幾個人被殺呢？

  兇手又是有幾個呢？

  結局有種宛如《東方快車謀殺案》般，

  到最後突然恍然大悟，

  卻又覺得十分驚奇






  --------------------------------------------

  【當世界都在跟你說教】



  --'
