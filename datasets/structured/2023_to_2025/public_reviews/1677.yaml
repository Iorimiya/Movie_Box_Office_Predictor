url: https://www.ptt.cc/bbs/movie/M.1683554460.A.D60.html
title: '[普雷] 上流謀殺案 有夠燒腦'
content: '─────有劇透──────


  女主角米蘭達格林簡直就是女版福爾摩斯，主角跟其餘五人，共六人受邀到大富豪－路易斯

  · 芬利的豪宅作客，在搭上火車，第一位律師跟她介紹每個人的來頭，米蘭達從邀請信函的

  端倪中，推斷出有一位客人是沒被受邀的！但律師只覺得這只是恰巧而已，但事實證明律師

  你就是那一個多餘的人啦！老實說要是普通人根本不會想那麼多，直接赴約就對了～


  抵達了豪宅，大家彼此不認識要玩個破冰小遊戲，透過每個人對自己兩真一假的描述，猜猜

  哪一個是假的，米蘭達總能在大家描述完的當下就說出真假，僅僅是透過一些細小的詞語表

  達方式就能立刻判定真偽，當下讓大家啞口無言



  而到富翁家裡也都沒閒著，到處走來走去觀察家裡的格局，只有我覺得這樣很不好嗎ＸＤ，

  我好怕下一幕女主角突然被人襲擊啊！但也多虧她這些舉動，在發生殺人案件的時候，她的

  所見所聞就能夠當作推理的依據，而究竟為什麼這群人會聚集在此，在其中一名管家被殺死

  的時候揭曉了這個答案，死的人正是豪宅主人芬利！芬利偽裝成管家只是為了刺探這群人的

  品行，他要將遺產託付給其中一人，因為這些人都是他年輕時風流過後的子女！看到這邊我

  真是傻眼，兄弟姊妹大集合，其中一對本來還在親熱瞬間就冷掉了ＸＤ



  只是這個當爸富翁的真的是很不應該，暗中觀察小孩們成長的過程，但是卻不聞不問，導致

  一些人的童年過得很困苦，因為他的無情，最後讓芬利慘死在自己兒子手上，所以童年的陪

  伴真的很重要阿，不然再多的錢也是挽回不了親情的，在看這一部的時候就是看米蘭達的推

  理過程，還滿過癮的，整部調性不會太驚險可怕，嚇人的地方不會太多，大家可以安心服用



  --'
