url: https://www.ptt.cc/bbs/movie/M.1684217005.A.D2F.html
title: '[普好雷] 上流謀殺案 典型推理電影 '
content: '對於推理的作品（無論是小說、漫畫、動畫、戲劇或電影）一直以來都算滿有偏好，

  我猜應該是因為小時候看了柯南劇場版《貝克街的亡靈》之後被老媽推坑福爾摩斯跟亞森

  羅蘋的關係 XD

  上次去電影院看電影的時候看到上流謀殺案的預告就滿心都是這件事情，這兩天終於有空

  去看了，坦白說沒有覺得特別峰迴路轉，但中間還是有些不錯的亮點，所以綜合評價算是

  普好～

  整部片算是很中規中矩的偵探片，有一個觀察敏銳的主角，有一群各懷鬼胎的 NPC（管家

  女傭之類的我歸在這裡），有幾個都有嫌疑但好像也都有所關聯的人們，一起登場在一個

  孤島的豪宅裡。


  典型處一：觀察敏銳的主角



  典型處二：不知道為什麼被聚集到一起的不確定有沒有關聯的人



  典型處三：一定要有的親密火花


  典型處三我真的笑死，有夠尷尬 XD

  卡門跟菲利浦的戲份意外的多，滿有趣的，知道大家都是兄弟姐妹的時候我有笑出來，反

  應很棒 XD



  另外提一個我覺得算是優缺都算的點，上流謀殺案整部的長度不算長，現在電影動輒兩個

  半小時，這一部一個半小時的篇幅算是真的很小品

  但也因為這樣的關係，很明顯可以感覺到對於角色個性及背景故事的敘事都有點不夠完整

  看到後半段也會開始覺得有點可惜，看起來是時間不夠收的稍嫌快速也有點浪費掉前面鋪

  陳的很不錯的氣氛

  我個人特別喜歡的是整部電影的營造手法都沒有刻意用很多嚇人的東西，可以真的讓人比

  較沉浸在推理的部分，最討厭那種想到一半被嚇超大一跳，剛剛腦子裡的東西都沒了！


  喜歡正宗典型推理劇的人可以參考看看，我覺得應該都算是會喜歡～


  --'
