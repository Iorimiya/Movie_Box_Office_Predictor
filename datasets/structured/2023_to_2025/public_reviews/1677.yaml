url: https://www.ptt.cc/bbs/movie/M.1683800993.A.09C.html
title: '[好微雷] 上流謀殺案  有點燒腦但又不會過燒'
content: "故事發生在1934年英國南方，六位素昧平生、個性不同的陌生人被邀請至遺世獨居的億萬\n富翁 - 路易斯楫漰Q擁有的小島-亞伯特島中作客。一場突如其來的兇殺案，開啟了一連\n\
  串的解謎、推理以及愛恨情仇的劇情…\n\n\n\n...........................防雷線..................…......\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n  以劇情部分來說，每個角色的人物介紹、個性詮釋都還蠻到位的，藉由富翁亨利要求僕\n人們去引發不同事件發生，藉機觀察每個人的做人處事以及個人特色，也讓觀眾隨著劇情\n\
  可以跟富翁一起更了解劇中所有角色。\n\n\n  而從命案發生後開始所營造的緊張懸疑感也都做得不錯，一些有用的、沒用的線索混在\n一起，大家互相猜疑、把重重線索堆疊後抽絲剝繭，進而尋找到真相。整個故事算順順的\n\
  ，沒有前後衝突，是蠻有偵探破案的感覺。劇中還穿插小情侶曖昧(醫生那對)的情愫，這\n部分有效的緩和緊張氛圍，有一總微甜蜜的感覺，只是他們最後居然不能在一起，好可惜\n\
  喔。\n\n\n  到了片尾謎底揭曉時，結局倒是還蠻令人出乎意料，角色們之間的關係居然不是這麼的\n陌生，以結局來說應該算是蠻溫馨的吧？？!只是他們互相接受的速度真得還挺快的，我\n\
  都還沒接受，他們倒是都接受了呢。而角色們到底有什麼關聯呢，就讓大家也猜猜摟，這\n裡就不爆雷了。\n\n\n  至於燒腦程度個人覺得還可以，是一般人可以看得懂的程度，本來以為以我金魚腦的腦\n\
  容量，看完燒腦片應該會有很多疑問要問，殊不知故事完整性還算不錯，我自己居然就看\n懂了，我想應該是我變聰明了吧，哈哈。是說劇情裡那些消失的兔子，應該真的只是編劇\n\
  編出來故弄玄虛增加緊張感的吧?? 雖然我一開始也被唬得一愣一愣，但它跟案情發展應\n該沒有關係對吧？?!還是說，這是其中某一個重要線索，是真的我沒有參透，我其實還是\n\
  一樣笨，喔不…\n\n\n\n\n\n\n\n\n--"
