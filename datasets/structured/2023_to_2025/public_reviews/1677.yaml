url: https://www.ptt.cc/bbs/movie/M.1683428490.A.063.html
title: '[負雷] 《上流謀殺案》，順理成章的推理電影。'
content: '部落格版：


  因為場次很近的關係，所以進場前還在在《上流謀殺案》和《指尖綻放的愛》兩部猶豫，

  後來因為怕早起上班撐不住所以決定選擇片長較短的《上流謀殺案》。事前只有看電影簡

  介的我，預期大概會是像肯尼斯布萊納執導的《尼羅河謀殺案》、《東方快車謀殺案》，

  不過實際觀賞正片後反而覺得《上流謀殺案》比較像Netfilx上的《7美疑案》，調性輕鬆

  、節奏輕快，而電影中角色、尤其是女主角米蘭達和卡門迷人的口音與腔調，莫名的讓《

  上流謀殺案》有種很有質感的錯覺。之所以說是錯覺，是因為若回到劇情本身來看的話無

  疑是讓人失望的，不論是整起案件的動機還有理當為重點的推理過程都相當無趣，導演斯

  蒂芬希梅克並沒有給觀眾任何參與解謎的機會，只是很理所當然的將資訊、或者說是線索

  與真相按照排程般的揭露在觀眾眼前，看到後來早已對電影提不起勁。


  《上流謀殺案》確實有個引人入勝的開頭，儘管發展有些過於快速，但從米蘭達於書店中

  的幾分鐘表現，再到她接受來自素未謀面的路易斯芬利的邀請，和其他五位受邀者前往孤

  島作客，都讓人會將電影忍不住想成是阿嘉莎克莉絲蒂筆下偵探白羅走進了《一個都不留

  》的故事裡，然而隨著眾人抵達島上別墅後開始，會慢慢發現原來還是自己想太多了。《

  上流謀殺案》比較好的是，除了別墅三位顯然有問題的管家與女傭外，包含女主角米蘭達

  在內只有六位受邀者，觀眾對於認識這些角色並不需要花費太多時間，而在眾人前往孤島

  的路上，藉著幾分鐘的介紹，能讓觀眾大致清楚他們的性格，自傲擅長注意到很多人不會

  注意到細節的米蘭達、寡言的王璐、關係曖昧的服務生卡門與醫生菲利浦、尖酸刻薄的記

  者唐納，還有話多被我忘記名字的律師，接著來到別墅後所玩的兩真一假遊戲，觀眾亦可

  以得知眾人的成長背景，那可疑的、剛好的有幾人「沒有父親」的共同點，還有其他人否

  認自己沒有父親這件事時的態度，都可以想到路易斯芬利和眾人的關係、以及是否後面即

  將會有的謀殺案的動機和此點有關？



  順著劇情展開，觀眾短時間內從上述資訊自行推出的可能劇本似乎有了被肯定的跡象，而

  電影的拍攝手法與呈現方式，在前半段、也就是首名死者出現之前，營造出了很有懸疑感

  的氛圍，感覺上每個人、包含管家與女傭都是各懷鬼胎，就算還沒深入認識也會覺得人人

  都有可能會殺人。但可惜的地方就是，導演斯蒂芬希梅克讓觀眾對角色的認識只停在很淺

  的表面，許多背景故事看似要說卻又沒說，導致於劇情從後半段、米蘭達試著進行推理開

  始，很難讓人跟上解謎的節奏，「人人都有可能殺人」是推理電影的必有誤導，然而觀眾

  卻幾乎沒辦法去真的找出那個「可能」，只看著鏡頭不斷在幾個角色裡切換，然後給出幾

  幕眾人形跡可疑的畫面，就看著米蘭達煞有其事的進行推理，就感覺上會有種電影裡米蘭

  達與電影外觀眾對其他人的認識程度有著無形的落差，才讓她推理的似乎合情合理，可聽

  在觀眾耳裡多少成了茫然之語，以致米蘭達的推理像是劇本為解而解的自圓其說，電影故

  弄玄虛感重了點。


  事實上，《上流謀殺案》在第二位死者出現之後就有了破綻，而這個破綻更可讓後續劇情

  難以成立。當假裝成管家的路易斯芬利遭到殺害後，首名死者、後來屍體不見造成人心惶

  惶的律師再度登場，在米蘭達的協助下揭曉自己的真正身分，原來是受僱於路易斯芬利、

  協助他舉行這場考驗六位他年輕時在外風流所剩下的子女，誰才是最適合繼承他遺產的繼

  承人，所以他的死亡其實是計劃中的詐死。看到這裡還算合理，但問題來了，為什麼他詐

  死時、身為醫生的菲利浦沒有發現？本來有想過會不會他也是計劃參與者因此配合演出？

  可是後來結果顯示他與計畫無關，那既然第二起事件他有檢查屍體狀況，又為什麼他沒有

  發現律師根本沒死？別提在當時他還有戴或摘下塑膠手套的畫面，表示他還是有盡到醫生

  工作檢查屍體，沒有發現的可能性實在趨近於零，除非律師採用了漫畫《金田一少年事件

  簿》中某集中有人用小球夾在腋下好使人誤判脈搏的伎倆，不過很顯然沒有，也沒有給出

  個可接受的解釋，導演斯蒂芬希梅克就這樣帶過，繼續讓謎底被順利成章的揭露，實在說

  服不了觀眾。



  順理成章四個字基本能用來形容電影後半段。米蘭達順利成章的成為群體中的發號施令者

  ，連被找來的警察都乖乖配合她；還順理成章的成為了偵探；而從頭到尾講話毫不客氣、

  惹來不少討厭、總是最不願配合的唐納連反抗都沒有的就順理成章的說出一切，同時還聲

  淚俱下讓人傻眼；當然最可怕的，還是所有人、包含米蘭達在內的其他四個人，都順理成

  章的接受彼此是彼此的兄弟姐妹的事實，還接續講出「路易斯芬利才不是我爸」、「我也

  不需要他的錢」、「因為我們擁有彼此」這樣的可怕肉麻台詞，然後彼此相視一笑，在最

  後結尾在船上並排勾肩搭背望著大海，來個順理成章的一家團圓快樂大結局。說實在話，

  如果來個卡門和菲利浦在知道兩人是同父異母的姐弟或兄妹還打算交往的驚天翻轉的話，

  我應該會願意給《上流謀殺案》普雷。


  整體來說《上流謀殺案》太快了，而偏偏這種快又不是精實的快，是那種觀眾掌握不了、

  只有主角能注意到足以推動劇情，或者說是進行推理的「小細節（線索）」的快。劇情沒

  有多少娛樂性，重點推理成分也不高，幾處轉折過於生硬，角色塑造不夠完整，在已經不

  長的篇幅裡有太多刻意要製造懸疑感可實際功能只能說無意義的浪費畫面，尤其是電影給

  了卡門和菲利浦太多的鏡頭，本以爲是有什麼劇情幫助，結果只是真的在談情說愛，兩人

  戲份多到看了很膩。與之相反的，是畫面少到整個影薄的王璐，台詞不多就算了，在這部

  片裡的幾次出場都莫名的較人困惑。


  --

