url: https://www.ptt.cc/bbs/movie/M.1683903604.A.3D4.html
title: '[普無雷] 上流謀殺案：當推理小說變成電影…'
content: '這部主打上流(?)犯罪推理電影

  事件背景是1934年的英國

  神秘富豪邀請了六位來自不同國度、素昧平生的人，到他的島上作客

  這六人似乎平常都很清閒，還膽大的獨自赴約XD

  說真的到了孤島，無論發生什麼事都是他們自找的哈哈


  敘事節奏還ok，劇情發展有反轉，結局也是我沒推想到的

  最後把事件全貌揭開，很難理解這位富豪的行為

  只能說我果然不是有錢人，有錢人跟我這個麻瓜想的不一樣


  這類電影就是一邊看，腦袋會不自主的運轉起來

  但或許是考量到進場觀眾推理能力不一

  所以關鍵線索都會很明顯拍出來

  雖然拍出來，但我還是沒料到發展方向跟結局QQ

  有時營造陰森的氛圍、還有懸疑感

  讓我中途幾度擔心畫風會變成鬼片或喪屍片...


  玩遊戲玩刺客這麼久，我還是第一次看到真實版的卡塔勒拳刃呢哈哈


  電影通常只會去看一次

  即使是多刷，觀眾也難以從畫面捕捉多少線索

  而小說讀者可以重覆咀嚼字句

  比起一閃即逝的畫面，能捕捉到較多的線索或痕跡

  所以即使故事有安排反轉，但整體發展的確讓人有順理成章感

  當推理小說變成電影…果然很難



  --'
