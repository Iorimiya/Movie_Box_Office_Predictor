title: '[好雷] 象棋的故事 Schachnovelle (2021 德奧片)'
content: '2023/03/09 更新：本片將於 03/10在台上映，台譯片名《蓋世棋蹟》



  上週看完院線德國片《永別了，柏林！》兩位德國蘿拉獎影帝的對戲，就來翻翻新科影帝 Albrecht Schuch舊片。話說他雖然資歷不深片單不長商業知名度不算高，但近年不論演主配角接起戲來都很會挑片，從2019《蘿莉破壞王》到2022《鐵幕下的筆羈》短短四年拿了兩個蘿拉獎影帝！不過這篇先來談談他演配角的另一片《象棋的故事》Schachnovelle
  (2021)，在去年蘿拉獎提名七項僅次於《永別了，柏林！》的十項！此片改編自 Stefan Zweig 褚威格小說，有看過《布達佩斯大飯店》的影迷大概對他文人精神可知一二，這精神又如何體現在他最後作品《象棋的故事》呢？




  小說《象棋的故事》關於「國王遊戲」西洋棋 Schachspiel，談一艘從紐約前往布宜諾斯艾利斯的渡輪上，兩位出身背景大異其趣的西洋棋手之對決，並在對決中訴說其人生故事與精神意志：(1)
  天才棋手 Czentovic是匈牙利難民，自小遇災滅門後陷入失語，在西洋棋中找到了表達能力更磨出超凡實力，是一眼看到棋盤就能以理性邏輯掌控全局的天才棋手；(2)
  來自維也納的財務律師 Dr.B 本棋藝平平，但維也納被納粹佔領時他被長期監禁過，竟偷書背譜自學成盲棋高手。（還有第三位蘇格蘭裔美國工業家 McConnor 基本是有錢人下棋充滿榮譽地位的征服欲，無須多提）


  本書趣味與精華，可能因不同讀者而異，以我個人來說是玩味褚威格向來關注的「老歐洲」文明與其黯然殞落。他當年在納粹前夕倉皇出逃最憂心的不只是致極權壓迫與戰雲密佈，反而更憂心整個歐洲富而好禮的民心都風雲變色已一去不返，這點在影迷們過去就看過的韋斯安德森致敬他的電影《布達佩斯大飯店》中可知一二：一次大戰時，儘管各國衝突失控了，但人民仍有其禮儀節度努力維持一個文明的社會，這樣的社會對事物有其道德原則與良心制約、人際間則禮尚往來與人為善，但二戰時別說上層極權霸道，連基層人民都忘卻道德拋棄儀禮致百鬼橫行。


  以這角度看，《象棋的故事》主舞台不談極權壓迫，而談幾種不同平民的意識型態交鋒，其中以錢為主的 McConnor 算次要不多談，真正的對決還在 Czentovic無文直率站在棋盤邊直線思考的基本棋力、與
  Dr.B 以文明儀禮勾勒更多層次抽象空間的想像棋力之間，畢竟西洋棋與任何棋藝拼到最後拼的已不是棋力技術、而是抽離自我設想對方（乃至多個替代自我與對方）的心理戰局。也許在褚威格心中，他所珍視的老歐洲「文明儀禮」並不只是個道德鄉愁，也認為這樣面面俱到長袖善舞拐彎抹角心照不宣的社會運行模式、在知性上解決問題也優於那些直挺挺來的基進主義者。




  說回電影，本片改編保留這「直線理性 vs 文明儀禮」的核心關注，擷取原著故事的基本內容竟做了個充滿想像的大幅更動：(1) 原著這艘郵輪是從紐約開往布宜諾斯艾利斯，本片則改為從鹿特丹開到紐約，算是改成了「從歐到美」的二戰前夕受難者逃亡；(2)
  原著棋戰中兩位主角人有平均的背景描述，本片則改為聚焦 Dr.B 一個人的背景故事具體演來，還給了他全名Josef Bartok；(3) 原著主舞台就是「郵輪上的棋戰」、兩人各自背景都只是倒敘的過去，本片則反轉過來把主舞台放在
  Dr.B 被蓋世太保監禁時的心理掙扎、而讓郵輪戲成為心理掙扎中預見未來的自由曙光。


  而最令人玩味的是：(4) 這艘在電影中被重塑為「未來自由」象徵的郵輪，真的存在嗎？它可以是主角 Bartok 被釋放後投奔自由的真實當下、可以是 Bartok
  身處牢籠中撐過痛苦的想像未來、亦可以是 Bartok 年老回憶的過去故事，總之它已成了一艘現在過去未來都可移花接木扭曲變形的「想像之船」；(5) 於是，本片中的這艘船會有很多鬼影幢幢、會有人突然消失也會有人驀地出現，會有很多張面孔與未來年老與過去囚禁日子裡遇到的面孔重疊、而這些重疊面孔彷彿在「想像之船」中提點「現實之我」如何面對！(6)
  結果故事主軸從「船上棋賽」變成了「抵抗囚禁」。




  電影情節概要：在 1938 年奧地利針對希特勒要求的政府改組進行「3/13公投」前兩夜，幫奧地利前王室管理財產的律師 Dr. Josef Bartok 還滿臉朝氣要給全家僕傭放個假「大家通通去投票」，要以民主大聲說出奧地利人的聲音！雖眼看路上到處都是奧地利失業民眾上街挺納粹，他仍滿心歡喜讓司機開著名車參加奧地利上流舞會，堅信這一切亂象都只是民主社會日常小喧囂，我們維也納文明儀禮必能引領眾生再次度過這一切...
  不過政界好友前來警告「沒有公投了」明早 3/12 他們將直接入侵！Bartok這才意識到事態嚴重文明崩毀，趕忙燒毀銀行帳密但想逃跑已來不及！


  蓋世太保要逼他供出瑞士銀行帳密以侵吞奧地利王室財產，於是給他與其他要逼供秘密的高級囚犯們開了一間高檔飯店 Hotel Metropole做「心理囚禁」：給你大房間完善設施不傷害生命折磨身體，但封閉一切完全沒心靈滋養，看你們知書達禮的維也納人撐不撐得過！可憐的他只有生活設施與三餐，完全沒有閱讀與資訊很快已不知今夕何夕。他唯一擁有的，是最後一夜燒帳密時匆匆翻過的荷馬史詩《奧德賽》，只能想像自己如奧德賽般風雨飄搖陷入無盡流離，甚至連壁紙上的波紋圖案都被他當成汪洋自己腦補出小船，只心懷希望我的
  Penelope 終有等到我歷劫歸來的一天。


  終於有一天，被蓋世太保長官 Franz-Josef Böhm叫去逼問時，趁亂隨便從納粹燒書分類櫃上偷了一本書回來當精神食糧，誰知偷到的竟是一本西洋棋名局棋譜令他好洩氣？原來「西洋棋」這東西從他監禁起始就是個心理陰影：有別於一般以暴力手段傷人身體逼人屈服的納粹鷹犬，這位蓋世太保長官
  Böhm自認有其日耳曼理性文明：我不會傷害你身體、但邀請你下一盤西洋棋，因為西洋棋就是「將人心智逼到極限」的心理競技、更是我們納粹日耳曼卓越人格優於所有種族的文化表現！對這種純粹卓越毫無人性的文化
  Bartok 當然嗤之以鼻，結果現在他的世界只剩西洋棋？




  電影在斗室之外的描繪非常重「文化」，尤其同屬日耳曼民族德語文化的「納粹德國 vs 奧地利」：一個是單純地理性冷靜不帶感情分析一切解決問題，自然會發展出種族優越論、生存空間論、乃至遲早要來的最終解決方案；另一個則重視這個社會既成的文化儀禮與人情義理、面對任何問題在理性面前一定重視傳統更珍視人性，就算解決民族或世界問題有多少理論指向什麼工具理性正解、我們身為人就絕不能如此極端而必須與人為善。電影還有很多小細節，從愛聽的音樂愛看的書愛喝的酒，乃至展現不同文明觀的紳士肢體，都處處看出
  Böhm vs Bartok的基本扞格。


  電影在斗室之內的描繪非常重「心理」，不但視覺上愛拍家徒四壁的全景、喜歡怪異視角以扭曲牆面側寫內心、甚至還一直有嘰嘰咕咕的日耳曼小酒館無腦歌舞轟炸他耳膜，幸仍有富而好禮的維也納圓舞曲在內心苦苦撐持...
  只是什麼也沒有只剩幾句《奧德賽》和一本棋譜的他，能怎麼在極限縮的「心理囚室」中打造無限世界呢？只能訴諸「西洋棋」：利用肥皂與地面磁磚打造棋盤下棋解悶，更在一人分飾二角甚至多角的對弈中慢慢學會人格的抽離與換位！有時抽離出來回視自己與對方，一切都不再患得患失而得冷靜清明，是否這納粹喜愛的心理競技也不一定是惡魔？


  慢慢地，在他內心的那艘汪洋輪船，已不知是將神話投射自身的《奧德賽》想像？是他堅定信仰的未來救贖？抑或其實他本人已在這艘未來船上回憶過去斗室苦難了？在這艘船上仍有原著的棋賽，只是由原著
  Czentovic vs Dr.B改成 Czentovic vs Van Leeuwen 兩位棋壇大師對決，而前者的面孔竟是拷問自己的蓋世太保 Böhm、後者的面孔竟然就是自己！難道在這想像之船或未來之船上，他倆終於展開這場
  Böhm在囚禁之始就囂張邀約的棋賽？甚至是在 Böhm給他長期監禁不給精神食糧的這場「心裡囚室」賽局中，他不但已決定正面迎戰甚至反客為主玩弄對方心理？




  說具體的，這場「心理囚室」賽局為何 Bartok 終能擊敗 Böhm而氣定神閒談笑風生撐過去？那從西洋棋自我對弈學來的「抽離」功夫功不可沒：相較於 Böhm那「逼人心智到最底」的納粹式直線理性，Bartok早已超脫它的物理限制與「精神匱乏」的心理限制、而能自己超脫抽離悠遊物外做出了無限。因此這場心理逼迫的逼供棋局
  Böhm只有投降的份，而他自認是納粹的文明理性代言人，當然也不會像其他蓋世太保流氓打手暴力逼供。


  而若以那場又像真實又像想像的「郵輪棋賽」來說，長得一張 Böhm臉的 Czentovic靠的是直接觀看棋局的理性棋路做到最強、長得一張 Bartok 臉的 Van
  Leeuwen則熟知人情世故亦能揣摩對方甚至能夠光憑腦中想像下「盲棋」這才勝出。本片到很後來，才用一個關鍵訊息暗示這場「郵輪棋賽」是 Bartok 在腦中想像出來以對抗現實囚牢的，這場腦內棋局的交鋒就是現實面對拷問的交鋒。而若以本片很強調的「文化」與文明取向來看，是否也意在指出：不論在腦內還是現實中，都仍是富而好禮重視人情義理的奧地利文化、勝過工具理性直線思考一意孤行的納粹德國文化？


  此片可以「一個囚徒」在斗室中想像心理郵輪的角度、欣賞他如何超越思考完成心理脫困，亦可以一個「投奔自由者」在船上回想他囚徒過去的角度、欣賞他如何面對過去討回正義！當然褚威格原著《象棋的故事》較直接清楚接近後者，是在說
  Dr.B 如何以過去面對囚禁時提升的心志、在當下這艘船上用在真西洋棋上完勝世界冠軍，雖令人振奮但這多靠「回述」講故事的小說手法稍嫌單調了點；而本片巧妙地將現在往過去的「回述」、大轉
  180度成為過去絕望中的「想像」，讓一趟腦內旅程成為驚濤駭浪鬼影幢幢的視覺饗宴！只令人好奇這「想像」真能成為「未來」嗎？




  也許褚威格向來珍視的老歐洲「文化儀禮」，不只是感性上令人珍視的人性美善、更是知性上更有效能的文明模式：能懂人情世故、能超脫自我、能設身處地、能換位思考，才能悠遊棋局上的自己與對手之間、現實中的多方立場之間、現實與想像的各種替代方案之間、甚至「自我本我超我」等多個替代的自己之間，能不自限於基進的直線理性把既定目標做到最徹底、反而能有更寬廣空間長袖善舞如魚得水達致最圓滿結果。想想我們當今世界好像又陷入一次兩大陣營各擁基本價值互不相讓的爭端、兩邊各以直線理性壯大自己擴張自我，其間還有「長袖善舞」的文明空間嗎？


  在本片飾演主角 Bartok 的是《希特勒回來了》中扮演希特勒的Oliver Masucci，在去年 2021 蘿拉獎季他就主演了此片與另一片《怪異天才》並拿到影帝！飾演主角對手
  Böhm的是如今 2022 已拿兩個蘿拉獎影帝的 Albrecht Schuch，去年 2021 蘿拉獎季除在此片當配角外還在《永別了，柏林！》當配角，幾乎已是當今德影100%優作保證的挑片演員。導演
  Philipp Stölzl就比較令人驚訝：他十幾年前拍登山災難片《北壁》與古裝傳記片《少年歌德的煩惱》寫實劇情悲喜表現都有做出基本功，但《象棋的故事》如此優遊自得又波瀾壯闊真令我驚豔！希望有天台灣會進。



  --

  話說去年 2021 德國電影獎 Deutscher Filmpreis，提名最多的就《永別了，柏林！》十項與《象棋的故事》七項，結果誰是最大贏家呢？倒是唐頓大表哥操英腔德語演機器寵男的《我是你的完美男友》、與宣示德語國家也能拍末日特效片的《地球重生》XD  話說這其中只剩《象棋的故事》仍無緣台灣院線...


  --'
