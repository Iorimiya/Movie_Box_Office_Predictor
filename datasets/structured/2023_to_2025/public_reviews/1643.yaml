title: '[好雷] 禁忌的畫像-卡拉瓦喬之影 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  先說個人看完電影的偏見：這部電影實在讓我對中世紀的天主教有夠反感的。



  電影背景發生在17世紀的羅馬，當時大概就是君權神授的時代，

  所有的藝術和哲學都是為了服務上帝而存在，所以這時期的畫家，

  最高的榮耀和成就大概就是可以為了教廷服務，不斷以聖經故事為題，

  畫出精湛的畫作送入教廷，成為教廷教會的裝飾以外，還成為祈禱默想的畫像。


  卡拉瓦喬就是個才華洋溢的作家，標準的藝術家風範，

  把路上所有的乞丐和妓女通通都抓來當成模特兒作畫，

  偏偏那個時代的畫作都以聖經為題，把妓女化為聖母，

  把乞丐化為聖徒，惹毛教廷跟一些衛道人士，

  電影裡面就剛好有個學院派的蠢蛋看卡拉瓦喬不爽很久了，

  趁著他被教廷打壓的時候帶兄弟要去海扁他，把他趕出羅馬，

  結果自己反而被殺了，故事從這裡開展。


  教宗派出密使影子去追查卡拉瓦喬到底該不該死，

  電影借密使影子的追查緩緩道來卡拉瓦喬的一生，


  卡拉瓦喬的激情和失序正是他創造的靈感泉源

  教廷以及其他貴族都珍愛卡拉瓦喬的才華洋溢

  又對於他的浪蕩不羈束手無策，雖然卡拉瓦喬是同志，

  但是在電影中，當過他模特兒的女性不少都被睡過，

  連自盡的妓女的屍體都可以被他撿回來擺位當成模特兒作畫。


  雖然他行為很脫序荒誕，同時也最富有情感的人物，

  但是他的情感往往都會帶來一些毀滅性的結果，

  他就是交織著豐富的感性，以及脫序的行徑，

  前衛的思想挑戰保守的教會力量。


  很難用二分法去評論卡拉瓦喬行為的是非對錯，

  只是他生在那個時代和那個國家，就注定是一場悲劇。


  結局就不爆雷了。


  先說幾個我個人的觀影觀點：


  1.我自己個人頗討厭密使影子的人設，雖然長得很帥，但是他那種過度正義的形象，

  我真的是有點生氣討厭，特別是他奉守天主教義，一直出現他虔誠祈禱跟讀經的樣子，

  跟他在電影中卻對所有窮困和妓女的處境毫無悲憫之心，用一種高姿態高道德的樣子

  怒斥妓女沒有愛人的資格以及鄙視教堂中出現的窮困老人樣，都讓我超想打他。


  2.電影藉著影子的口揭示天主教應該很討厭當時的新教，天主教稱誓反教，

  而馬丁路德是個禁忌話題，畢竟馬丁路德帶了一票人離開天主教另創門戶，

  電影也巧妙地帶過這個點，我個人覺得滿有趣的。


  3.電影裡面有個看似曾經也是個學院教授經典的修士，被教宗判了火刑，

  從那個被判火刑的修士口中點出那個時代是不能隨便批評教宗跟教廷的，

  連思想如果牴觸教廷或是教宗就會被視為異端，然後就會被燒成巴比Ｑ。


  4. 在17世紀甚至現在，天主教的聖經詮釋權都依然是只有教宗可以執行，

  差別就在17世紀的時代，如果自己詮釋聖經也會被燒成巴比Ｑ，但是現在不會。

  新教的聖經詮釋權者是在牧師身上，會眾也可以，這大概是兩教差別之一。


  5.這部電影讓人看了不爽的地方就是電影裡面，

  密使影子或是教廷都站在道德制高點在評斷一個人的行為舉止，

  那種單一價值的道德觀讓人看了非常感冒，而且會有點令人憤怒。


  最後就是這部電影還算是拍得不錯，不能當成自傳看，

  因為都是透過密使的視角去建構主角的人設，所以我覺得這部不能算是傳記。




  --'
