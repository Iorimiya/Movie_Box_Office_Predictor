url: https://www.ptt.cc/bbs/movie/M.1657796333.A.514.html
title: '[負雷] 魔女第二部曲 尷尬又拖戲'
content: '看完迫不及待來寫負評

  -

  -

  -

  -

  -

  -

  -

  -

  -

  以下有雷


  先梳理一下我理解的劇情，有可能是很多地方理解有誤。


  第二部分成四個團體


  第一個是前負責人

  第二個是李鐘碩

  第三個是具姿尹跟她帶出來的土偶

  第四個是農場家族


  土偶襲擊了第二部的主角（她有名字嗎？我連名字都記不得），主角雖然被打了頭但活下

  來，在馬路上被農場家族女兒帶回家。


  接著前負責人交代她的手下追殺她。

  土偶也在找她要殺她第二次。

  農場家族的黑道舅舅不知道跟誰聯絡也在找這個女的。


  最後農場大戰，互相殺來殺去

  具姿尹結尾出來收割，喔你是我妹妹我們去找媽媽吧。


  -

  這部難看的原因有太多了。


  1.無聊難笑尷尬無意義的對話

  尤其是前負責人的手下，兩人完全沒火花，對話大部分都無意義，但又很長，試圖想營造

  笑點，但完全GET不到。


  上海土偶找了韓國人硬要說中文，他們一開口講中文我就覺得尷尬的要死，說的話也沒什

  麼意義，頂多顯示出他們感情不太好，但對於劇情完全沒幫助，反正最後都要死光的。


  前負責人手下跟李鐘碩的對話，對於觀眾根本抓不到脈絡，想製造有情誼的互動，但一樣

  莫名其妙。


  2.沒有邏輯的打鬥

  李鐘碩派人跟蹤前負責人手下，然後打了一架，一場硬要打架的打架，對劇情完全沒幫助

  ，也提升了不了整部電影的質感。


  最後的農場打鬥，好像很厲害，土偶們簡直比漫威英雄更厲害。但那些瞬間生出斷肢、沒

  有物理法則支撐的移動，硬生生變成了魔幻片….

  不管是第一部或第二部開頭都試圖想以科學的角度去解釋魔女的誕生，但後面直接變成了

  超越科學的變種人…


  -

  具姿尹妳一開始在妹妹逃出實驗室時帶她走不就好了…

  李鐘碩這部也是露個臉而已，完全沒有發揮，不用期待了。



  建議這部等串流1.5倍速+跳轉觀看吧......


  --'
