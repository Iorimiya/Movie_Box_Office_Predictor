url: https://www.ptt.cc/bbs/movie/M.1744028035.A.592.html
title: '[新聞] 《飢餓遊戲》第二部外傳又一演員人選曝！'
content: '《飢餓遊戲》第二部外傳又一演員人選曝光！傑西普萊蒙有望化身「年輕版」菲力普西摩

  霍夫曼




  《飢餓遊戲》（The Hunger Games）系列的第二部外傳《The Hunger Games：Sunrise

  on the Reaping》自從前幾天在 Cinema Con 釋出超前導預告後，就陸續傳出多位劇組鎖

  定的演員人選，如新生代男星-查理普拉瑪（Charlie Plummer）有望扮演主角「黑密契」

  ，雷夫范恩斯（Ralph Fiennes）有望飾演中年版「史諾總統」等等，今天則又有另一位

  實力派進入這波名單。




  知名影視記者-丹尼爾瑞奇曼（Daniel Richtman）今早在他的《Patreon》頁面報導，傑

