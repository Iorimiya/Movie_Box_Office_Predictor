title: 'Re: [新聞] 《沙丘：第二部》史詩級復仇之戰即將開打'
content: '沙丘第一部是很棒的電影，唯一讓我覺得有點遺憾的是，飾演荃妮的千黛亞表現出戲。

  千黛亞(辛蒂亞)在第一部最後才出現，她的表現與戲中其他人相較，有些格格不入。

  她在第一部的戲份不多，表現差強人意尚不至於影響整部電影觀感。

  但會讓人擔心她在第二部作為女主角的表演，會不會也像第一部一樣出戲而生硬不協調。


  從第二部預告，可以看出千黛亞的確努力想要扮演好荃妮角色。

  然而千黛亞的氣質神采似乎還是不適合扮演荃妮，無法展現出作為女主的風範。

  千黛亞的氣質風采適合演少男少女電影，但卻缺乏剽悍含威風範，難以相符荃妮人設。


  沙丘導演當初選擇千黛亞扮演荃妮，或在考慮千黛亞在歐美市場之票房人氣。

  但不得不說就電影角色而言，選擇千黛亞飾演荃妮，是太難為她，也不似片中女主人設。

  這不是千黛亞演得好不好的問題，而是她適不適合扮演預言命運中這種女主角色的問題。


  --


  《推背圖諰：中國國運與人類命運之預言憂患》試讀本PDF檔 免費贈閱流通


  贈閱摘錄四一象至四三象(1949-2024…年)，終至海峽兩岸結局。


  --'
