content: "★ 改編自法蘭克赫伯特備受讚譽的暢銷小說《沙丘》\n★ 萬眾矚目的史詩續作\n★ 電影預告：\n★【沙丘：第二部】[保護級] 2月27日 (週二)\
  \ 搶先口碑場 2月28日 (週三) 大銀幕敬\n請 期待\n2D·3D·IMAX·D-BOX·4DX·MX4D·Atmos·Dolby Cinema 同步上映\n\
  \n隨著獲獎無數的導演丹尼維勒納夫，著手拍攝改編自法蘭克赫伯特著名小說《沙丘》後，\n【沙丘：第二部】將繼續述說這個傳奇故事，並且擴大網羅全球知名演員陣容。這部由華\n\
  納兄弟及傳奇影業所推出的電影可說是眾所期待，也是 2021 年榮獲六項奧斯卡金像獎的\n【沙丘】的後續作品。\n\n【沙丘：第二部】將探索保羅亞崔迪的偉大神祕之旅，他和荃妮以及弗瑞曼人聯手，對毀\n\
  滅他家族的陰謀者展開報復。保羅必須在他畢生摯愛與已知宇宙命運之間做抉擇，並且努\n力阻止只有他能預見的可怕未來。\n\n\n導演丹尼維勒納夫也再次與他的【沙丘】創意團隊合作，包含奧斯卡金像獎獲獎攝影指導\n\
  格雷格弗萊瑟；奧斯卡金像獎獲獎美術指導帕特里斯維梅特；奧斯卡金像獎獲獎剪輯師喬\n沃克；奧斯卡金像獎獲獎特效總監保羅蘭柏特；奧斯卡金像獎提名服裝設計賈桂琳威斯特\n\
  。榮獲奧斯卡金像獎的作曲家漢斯季默也再度擔任配樂的重任。\n\n\n《抽獎方式》\n2月21日 23:59前，推文留言你想要參加【沙丘：第二部】的〈場次〉與〈原因〉，就有\n\
