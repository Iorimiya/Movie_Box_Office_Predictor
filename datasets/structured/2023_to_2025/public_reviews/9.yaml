url: https://www.ptt.cc/bbs/movie/M.1496650860.A.7DC.html
title: 'Re: [討論] 大家期待蔡康永第二部電影拍哪種片型??'
content: '吳宇森把太平輪拍的有些無語

  相較於鐵達尼號

  不管是電影版還是電視劇版(回家)其實船都不是主角

  雖然鐵達尼號也是以人物的故事來推進劇情，但主要發生地點都是在船上

  太平輪電影及電視劇卻是發生在陸地上，最後的船只是一個希望的象徵

  然後結局則是絕望的表現



  希望蔡康永能用自己家族的經營者角度去拍這艘船

  把人物故事寫在開船前後就好，雖然因為它是離開上海沒多久就出事

  無法像鐵達尼號寫在船上那麼多天的日子

  不過從搶船票、經營者運送的黑貨、船長的判斷、航道、救援的決策錯誤等

  應該能半紀錄半故事的方式推進劇情，不需要雷瘋子跟蔣景星


  相較於鐵達尼號第一次出航就出事，太平輪其實是上海到基隆的定期航班

  已經往來很多趟了，不需要走鐵達尼號路線，可以從正常航班時代開始拍

  然後拍些內幕，最後怎麼變成超載的逃難船，誰放那些黑貨上去的

  五方股東人馬底下的角力等等



  --'
