  4.本特映會如遇天災等不可抗力因素取消，恕不補辦\n5.本活動得獎者提供之個人資料，僅供活動領獎身分核對及通知，不另作他用\n6.特映會票券為統一寄出，寄送過程中若有延誤或遺失，恕不補發\n\
