url: https://www.ptt.cc/bbs/movie/M.1708055230.A.CF3.html
title: '[新聞]《沙丘:第二部》外媒好評爆棚：戰爭戲媲美《雙城奇謀》'
content: '新聞網址：



  2024-02-16 11:20:12



  丹尼維勒納夫（Denis Villeneuve）回歸執導的《沙丘：第二部》（Dune：Part Two）即

  將於本月底 27 日在台上映，而華納兄弟影業稍早也舉行了世界首映會，並隨即開放參與

  放映的媒體們先行公開發表第一手簡短心得。一如前作，《沙丘：第二部》也獲得普遍高

  度的正面評價，無不盛讚片中的視覺奇觀、劇情改編上的適度精簡、以及某些演員的突出

  表現。



  「《沙丘：第二部》真的很厲害，維勒納夫拍出了一些極具開創性的時刻，奧斯汀巴特勒

  獻上了由內而外徹底搖身一變的精湛表演（我不是指造型而已），結局也非常感人。劇情

  是不是有點長？是有點。我看完的隔天是不是就會忘記了？是，但它還是十分壯觀震撼。

  」



  「《沙丘：第二部》是一場巨大的勝利！比第一部更宏大，卻也更親密 — 丹尼斯維勒納

  夫成功將這本書更不一閱讀的後半部，簡化為一齣引人入勝、動作不間斷的史詩。

  」



  「毫無意外地，我超愛《沙丘：第二部》。頂尖的製作、出色的配樂、全體卡司都表現極

  佳。我唯一的抱怨是：

  」



  「我對第一集的感受是有點五味雜陳的，但

  。我好想騎沙蟲啊！還有，奧斯汀巴特勒飾演的菲德羅薩

  貞的凶惡到不行，他真的是從地獄將惡魔給召喚了出來。」



  「《沙丘：第二部》是浩大的史詩鉅作，從奎格佛雷瑟（攝影指導）卓越的攝影，到派翠

  斯維梅特（美術指導）壯麗的世界觀構築，都是大師級的手筆。丹尼維勒納夫交出了他的

  生涯代表作，為後世執導出影史最棒的科幻電影之一。」



  「《沙丘：第二部》是維勒納夫的《星際大戰五部曲：帝國大反擊》和《阿拉伯的勞倫斯

  》，這部科幻歌劇不僅僅只是格局浩大，故事更是令人著迷、情感刻劃深具震撼力。奧斯

  汀巴特勒將成為許多人談論的話題焦點，但真正讓我瞠目結舌的，是提摩西夏勒梅。維勒

  納夫這部有如超脫涅槃般的沉浸式電影，無疑是一部科幻傑作。」



  「《沙丘：第二部》的某些視覺奇觀大為驚嘆，我感覺我終於明白，那些在 1977 年首次

  於戲院觀賞《星際大戰》的觀眾當時的感受了，這真的很不可思議。」



  「《沙丘：第二部》的格局浩瀚到令人讚嘆，張力幾乎沒有半刻是有減弱的。這是丹尼維

  勒納夫的游擊戰電影，只不過是以科幻史詩電影的規格去製作的。任何喜歡第一集的人，

  都會被第二集大大滿足。」



  本片依舊由維勒納夫與首集共同編劇-強史貝茲（Jon Spaihts）合寫劇本，「保羅亞崔迪

  」提摩西夏勒梅（Timothée Chalamet）、「潔西卡夫人」蕾貝卡佛格森（Rebecca

  Ferguson）、「葛尼哈萊克」喬許布洛林（Josh Brolin）、「查妮」千黛亞（Zendaya）

  、佛瑞曼人族長「史帝加」哈維爾巴登（Javier Bardem）、「拉賓哈肯能」戴夫巴帝斯

  塔（Dave Bautista）、「佛拉迪米哈肯能」史戴倫史柯斯嘉（Stellan Skarsgård）等

  原班底回歸演出。



  新加入的陣容則包括：「菲德羅薩」奧斯汀巴特勒（Austin Butler）、帕迪沙皇帝「沙

  德姆四世」克里斯多夫華肯（Christopher Walken）、沙德姆四世的長女「伊如蘭公主」

  佛蘿倫絲普伊（Florence Pugh）、「瑪格夫人」蕾雅瑟杜（Léa Seydoux）、安雅泰勒

  喬伊（Anya Taylor-Joy）等人。《沙丘：第二部》北美預定 03 月 01 日上映，台灣排

  定 02 月 27 日搶先登場。



  --'
