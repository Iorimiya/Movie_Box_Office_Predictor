  \       第2集安納金跟帕米戀愛戲(雖然評價差強人意)\n\n其實很多細節舉例不完，不要想合理性\n純粹只是123呼應456一些橋段，說是致敬也可以\n\
  盧卡斯的神來一筆，這才是正解\n\n\n\n新、舊部落格(無商業)\n\n\n\n--"
