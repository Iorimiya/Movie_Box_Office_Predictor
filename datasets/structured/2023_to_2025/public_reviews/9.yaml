title: '[好雷] 封神第二部：戰火西岐'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n這次去美麗華看IMAX廳，兩個半小時覺得滿值得的\n\n扣除殷郊那個藍色三頭六臂阿修羅特效美術風格太過突兀之外，大部分都是不錯的\n\n\n首先這集鄧禪玉帶兵打西岐，設計了很多地形戰\n\
  \n過橋渡河的河戰、峽谷之間的落石戰、峭壁邊的騎馬戰、夜襲的營帳戰、攻城戰、\n\n還有後面的十絕法陣戰、屍兵突襲戰\n\n多樣化的場景跟戰法打法的替換，的確有魔戒或一些史詩大片的影子，\n\
  \n但原本以為楊戩哪吒魔家四將跟雷震子特效會讓人出戲(殷郊神燈巨人畫風除外)\n\n沒想到融合得還不錯，有點黑悟空的感覺，而且也巧妙地用劇情推進讓他們發揮法力\n\
  \n再用劇情牽制這些修仙者超規格戰力，把重點拉回去姬發姜子牙鄧禪玉跟聞仲\n\n各種磅礡場面看IMAX覺得是有大加分的，就是一部爆米花電影，\n\n如果看小廳或串流，可能評價就會下修(或是很在意殷郊的特效)。\n\
  \n\n\n這集大部隊的場面調度跟主要腳色的打鬥，節奏掌握得不錯，\n\n雖然劇情跟主要腳色就順著第一集那樣，幾乎每個人都一股傻勁執拗到底，\n\n只有鄧禪玉有刻劃出個性變化跟成長，也難怪會變成有點像鄧禪玉傳\n\
  \n裡面那些民俗風的歌曲，編的挺有味道，\n\n劇中是多人合唱的歌隊形式，烘托氣氛的感染力很強\n\n唯一可惜的是紂王這集戲分有點少，而且這集他目的性很強，個性比較沒轉折，\n\
  \n但情緒勒索聞仲總覺得有點好笑\n\n另外聞仲的聲音不確定是演員原聲嗎? 之前看吳興國演戲已經是很久以前他演暴風雨\n\n跟記憶中稍微有些不太一樣\n\n\n\
  整體而言覺得是近期可以進戲院看的大片\n\n無視劇情跟殷郊特效就可以了(殷郊特效改成黑紅配色可能會好很多)\n\n--\n           \n   \n\
  \    ～～～       \n    \n     \n  \n\n--"
