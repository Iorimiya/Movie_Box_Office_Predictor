url: https://www.ptt.cc/bbs/movie/M.1688190244.A.61E.html
title: '[新聞] 《沙丘：第二部》史詩級復仇之戰即將開打'
content: '新聞網址：


  《沙丘：第二部》史詩級復仇之戰即將開打！曝光新預告


  2023-07-01 中時新聞網 翁紫曦


  改編自法蘭克赫伯特備受讚譽的暢銷小說《沙丘》、由導演丹尼維勒納夫執導的《沙丘：

  第二部》備受期待，今天曝光全新預告，預告中保羅亞崔迪聯手弗瑞曼人，即將展開一場

  史詩級的報復，戰爭場面磅礡浩大，引起不少影迷熱烈討論和期待。


  在《沙丘》中，亞崔迪家族被哈肯能家族殘忍殺害，保羅亞崔迪與母親潔西嘉女士在險惡

  的厄拉科斯星球，遇見了先前在夢中出現的荃妮，加入弗瑞曼人的生活。


  《沙丘：第二部》承接《沙丘》的故事，保羅亞崔迪逐漸適應弗瑞曼人的生活，並與荃妮

  、弗瑞曼人並肩作戰，對毀滅他家族的陰謀者展開報復。保羅也必須在他畢生摯愛與已知

  宇宙命運之間做抉擇，並且努力阻止只有他能預見的可怕未來。


  《沙丘：第二部》卡司同樣眾星雲集，包含曾獲奧斯卡金像獎提名的提摩西夏勒梅、辛蒂

  亞、蕾貝卡弗格森、曾獲奧斯卡金像獎提名的喬許布洛林、曾獲奧斯卡金像獎提名的奧斯

  汀巴特勒、曾獲奧斯卡金像獎提名的佛蘿倫絲普伊 、戴夫巴帝斯塔、 榮獲奧斯卡金像獎

  的克里斯多夫華肯 、史蒂芬麥金利亨德森、蕾雅瑟杜、史戴倫史柯斯嘉 、曾獲奧斯卡金

  像獎提名的夏綠蒂蘭普琳，以及榮獲奧斯卡金像獎的哈維爾巴登。


  --'
