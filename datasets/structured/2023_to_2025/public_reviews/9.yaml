title: '[新聞] 羅伯派汀森蝙蝠俠：第二部 將出現「羅賓'
content: '羅伯派汀森《蝙蝠俠：第二部》將出現「羅賓」明年春天開拍！《超人》第二集將聚焦「

  超人家族」




  （圖片來源：華納兄弟影業）


  華納兄弟探索 CEO 大衛札斯拉夫（David Zaslav）稍早致信給各家股東，宣佈羅伯派汀

  森（Robert Pattinson）回歸主演的《》（The Batman Part II）將於明

  年春天正式開拍，並確認（James Gunn）將繼續編導《》（Superman）第

  二集，而且還預告第二集會是以「」為主軸，札斯拉夫沒明講這個家族是指哪些

  角色，但沒意外的話，肯定會包含超人的堂姊「」卡拉佐艾爾。




  （圖片來源：華納兄弟影業）


  此外，知名影視記者 傑夫史奈德（Jeff Sneider）剛剛還在他的付費部落格《The InSne

  ider》補充，麥特李維斯（Matt Reeve）導演和編劇 麥特森湯林（Mattson Tomlin）合

  寫的《》劇本非常大膽，而且「」也會出場，是故事的一環。


  《》第二集已預定 2027 年 10 月 01 日上映，《》第二集則尚未定檔，但岡

  恩已在動筆構思，相信不會讓我們等太久。


  文：Joker



  新聞網址：




  --'
