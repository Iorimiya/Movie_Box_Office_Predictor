url: https://www.ptt.cc/bbs/movie/M.1709042610.A.44C.html
title: 'Re: [好雷] 沙丘：第二部  DUNE：PART TWO'
content: "首先，我是純電影觀眾，僅探討電影設定\n \n \n1）為什麼保羅沒有利用男爵？2）武力是否可以取得帝位？\n \n兩個問題一起講\n \n沙丘世界觀類似於中世紀，皇帝（或國王）的權威很大程度來源於貴族的承認\n\
  這也是為什麼皇帝必須有私軍薩督卡的原因，保護自己威懾貴族嘛\n平常皇帝貴族互不越線，貴族們承認皇帝統治的合法性，皇帝保證貴族們的利益和存續\n \n但今天你皇帝偷偷派私軍搞掉了一個公爵，其他貴族們（大氏族）會想，下一個是不是就是\n\
  我？\n一旦這件事被捅出來，貴族們會立刻不承認皇帝，然後發兵討伐，成功後就互打爭帝位\n \n和皇帝對峙時，保羅要葛尼發給大氏族們的訊息就是皇帝派私軍搞掉亞崔迪的事\n\
  目的一是逼皇帝自願退位，獲得繼承的正當性，至於這個繼承能不能獲得大氏族的承認其實\n不重要\n因為如上述，皇帝是不是權威，是要看大氏族的臉色的\n \n皇帝以前還有薩督卡來威懾大氏族，現在被弗里曼人滅了；\n\
  皇帝以前安分守己，現在他越界，把實權大氏族搞掉了；\n皇帝以前還是皇帝，現在被亞崔迪公爵逼退位了。\n \n發現了嗎？阻止大氏族們「自立為王」的合法性障礙，全部消失了\n\
  再加上保羅威脅他們不同意就用核彈摧毀香料產地，這剛好給了他們出兵討伐亞崔迪的理由\n：\n「保護香料原產地，討伐假皇帝保羅亞崔迪」\n至於在討伐之後，皇帝還是不是原本那個？那當然是誰有實力誰來當囉！\n\
  \ \n所以說，無論如何大氏族都是不可能承認保羅的，發出訊息只是告知大家他們要做什麼而已\n \n \n回到原本的問題，嚴格來說，保羅的訊息一發出，男爵就是個不再有存在意義的人\n\
  因為任何知道皇帝濫用薩督卡的消息的大氏族，都會因此起兵反抗皇帝\n而訊息一旦被揭露，全部有能力爭奪帝位的人就瞬間平等，從此只看兵力強度\n既然保羅自己就知道這個消息，也打算之後公布給大氏族們，且他也知道大氏族不可能這麼\n\
  聽話\n那留男爵還有什麼用呢？所以保羅當然就直接訴諸復仇了\n \n3）偷看無數劇本和成為哈肯能無關\n \n我自己的理解是\n「成為哈肯能」，也就是「以哈肯能的行事作風板倒哈肯能和皇帝」\n\
  哈肯能和皇帝偷偷合作板倒亞崔迪，所以他也要用同樣的方法，藉大氏族不再支持來逼皇帝\n退位\n可能保羅看到的無數劇本裡，只有這種能達成他的目標吧\n \n4）弗里曼人沒多少飛行員\n\
  \ \n劇裡特別給了弗里曼人操縱科技用品的不少鏡頭，荃妮也自己開過一架直升機\n雖然要直接升級到宇宙戰艦很不現實\n但既然沒給鏡頭，我比較傾向暫時不解釋到底戰艦是怎麼開起來的\n\
  \ \n畢竟在喜歡/不喜歡的人眼裡，沒有確切說明的一切都可以是懸念/劇情Bug\n \n----\nSent from on my iPad Pro (12.9〃)\
  \ 4\n \n--\n保羅當然還是需要大氏族的承認\n只是承認也可以是打出來的嘛，這不衝突\n \n重點是，既然大氏族無論如何都會反，那舉兵就是唯一的解決方法\n\
  所以你看最後保羅出兵的決定下得辣麼快\n \n大氏族起兵的合法性存不存在，其實是保羅說的算，因為他有人質皇帝本人\n無論老皇帝是死是活，大氏族都可以藉此起兵，而後帝位當然就不是老皇帝說的算了\n\
  大氏族會放過自己當皇帝的機會，應該不容易吧\n \n當然，既然有哈肯能也有亞崔迪\n那麼也可以很自然的認為有部分大氏族之所以不承認保羅\n是不認同他獲取權力的方法\n\
  \ \n然而出兵攻打這樣的大氏族，和出兵反擊主動攻擊的大氏族，又有什麼區別呢？\n反正都要打，那為了什麼而打和要不要打就不重要了\n \n不不不，「出兵攻打的正當性」\n\
  和「出兵攻打的核心利益」不是一回事\n\n正當性是秀給其他大氏族看的，核心利益才是他們想要的\n保羅提供給他們的就是出兵的正當性\n但支撐他們出兵的核心還是搶奪厄拉科斯\n\
  以及奪得厄拉科斯後，連帶獲得的「搶奪帝位的有利條件」\n（因為掌控了香料產地）\n\n皇帝的義務之一就是要確保貴族的利益，也就是分配者和協調者\n但反過來說，擁有足夠資源的人就會自然而然的成為分配者\n\
  而想統治銀河系，不依靠分封貴族們又是不可能的\n所以得到資源的人，就會滿足於分配者的角色\n其他的人能被分到資源和利益，也就不會公開反對分配者了\n\n當然這只是很攏統很概括的說法啦"
