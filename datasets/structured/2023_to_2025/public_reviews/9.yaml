  台中場：11月18日19:00 台中文心秀泰影城-SCREEN X\n高雄場：11月18日19:00 高雄夢時代秀泰影城-SCREEN X\n\n\n公布得獎日期：11月10日公布得獎名單於回文內,得獎者請於11月13日10:00前\n\
