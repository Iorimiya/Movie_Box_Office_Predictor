  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n先講結論\n\n第二部比第一部好看\n\
  \n如果第一部是我會在電視上邊滑手機邊看的程度\n\n那第二部就是電視轉到會叫家人朋友一起來觀賞\n\n這樣的差異\n\n\n場面依然宏大，導演擅長的攝影依舊滿分\n\
  \n但敘事密度遠比第一部緊湊的多，攝影也不像前一部大量鏡頭卻有種為拍而拍感，而是很好的穿插在故事中\n\n動作和戰爭場面不少，就算當科幻動作片看也沒問題，某方面來說就像是維勒納夫版的阿凡達\n\
  \n有記憶點的名場面很多，特別是騎沙蟲那段，光看這個就值回票價（雖然我是看招待的\n\n講比較誇張一點，相比之下第一部簡直是第二部的超長付費預告片\n\n\n\n\
  要說缺點的話\n\n整體故事大綱雖然依然照著原作走\n\n但是細節和精神相差太多了\n\n弗瑞曼人改的更的現代化具有獨立和批判性，結果失去了原作獨有的文化風格與用語的魅力，改的毫無特色。更有甚者，居然有弗瑞曼人嘲笑自己的信仰和污衊式的口吻描述自家的聖物…\n\
  \n角色個性被魔改，更沒復仇魂的保羅，不浪漫更有獨立思考的荃妮，沒威嚴的史帝加…更不用說幾乎被移除的重要角色像保羅妹、宇航工會\n\n被完全閹割的綠化、經濟、政治等沙丘原小說的最大賣點\n\
  \n原作結局本來講求談判、勢力彼此牽制才能達成的，變成無腦武力威脅\n\n用魔戒來譬喻\n\n就是剛鐸平原戰各方血淚奮戰的悲壯電影直接變亡靈平A過去的這種感覺囧\n\
  \n老實說啦，看在小說粉絲的我眼裡，這個魔改的方式只能說是維勒納夫的沙丘，而不是法蘭克赫伯特的沙丘，那個結尾到底要怎麼接沙丘救世主…\n\n\n但如果不看原作，電影本身相當精彩有料，看了不會後悔\n\
  \n\n\n-----\nSent from JPTT on my iPhone\n\n--\n                          七瀨~~學姐就在你身邊~~\n\
