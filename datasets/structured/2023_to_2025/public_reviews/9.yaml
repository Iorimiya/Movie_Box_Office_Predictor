title: '[好雷] 沙丘第二部 北美口碑場'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  《Dune: Part 2》★★★★☆

  「唯有毀滅者才能掌握絕對控制權」


  去年11月因為罷工延後上映，讓粉絲等待許久

  很幸運今天得到北美口碑場的票能先睹為快


  果然導演丹尼斯·維勒納夫沒讓人失望

  從《私法爭鋒》開始追蹤他《雙面危敵》《怒火邊界》

  《異星入境》《銀翼殺手2049》再回頭看《烈火焚身》

  他都能將故事核心精神詮釋得宜，手法引人入勝

  場面調度能力、畫面構圖、流暢的運鏡和剪接

  將觀眾深深地吸入這個沙漠星球無法自拔


  第一集就有的巨型與渺小對比視角這集依然有

  還有德國表現主義的人體幾何構圖也運用巧妙得宜

  弗瑞曼人集結高呼那段讓人有被煽動起雞皮疙瘩

  當然光影運用比首集更上層樓，特別是競技場畫面

  透過濾鏡柔白處理，呈現出角色更細緻的臉部張力

  而武打動作運鏡也不馬虎，總有拳拳到肉的緊張感

  還有漢斯·季默的配樂也是讓觀眾融入故事的功臣

  每每梵音響起或是鼓動的節奏出現總讓人熱血沸騰

  只是第二部也和第一部同樣大場面的戰爭畫面不多

  本來還期待能看到如《魔戒》般的太空戰爭


  演員部分，覺得這一集演最好的是千黛亞

  將荃妮從陌生到相戀再來質疑最後絕情

  每一個階段都演得有層次，且連貫完整

  相較起來提摩西·夏勒梅的保羅，後面黑化的不到位

  在和奧斯汀·巴特勒對打時，狠勁與氣勢完全被壓過

  感覺提摩西·夏勒梅不適合演反派，他好像也沒演過

  而佛蘿倫絲·普伊一貫撲克臉，她白寡婦還比較生動

  還有就是哈維爾·巴登這集變成保羅的迷弟也太有趣

  最後神秘客串安雅·泰勒-喬伊演保羅未出世的妹妹

  只有在預視小露臉，和第一集荃妮一樣大多是背影


  聽說丹尼斯·維勒納夫有計畫將《沙丘》拍成三部曲

  覺得電影第二部結束在小說第一本結束剛好，

  之後要多演一集不知道要收在小說哪

  但只要是丹尼斯·維勒納夫執導的電影都會期待


  附上口碑場的電影票和海報



  --'
