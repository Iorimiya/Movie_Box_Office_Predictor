title: '[新聞] 春節後最大片！《沙丘：第二部》北美預售'
content: '新聞網址：


  春節後最大片!《沙丘:第二部》北美預售大爆有望超越預期


  2024-02-09 自由時報電子報 記者 許世穎 綜合報導


  史詩鉅片續篇《沙丘：第二部》將於過完年後在台上映，不少影迷已迫不及待，隨著本週

  首集《沙丘》重返大銀幕先「複習」，順道搶先看壯觀的「第二部」搶先看片段。電影在

  北美預售也開紅盤，將輕鬆打破導演丹尼維勒納夫以及「甜茶」提摩西夏勒梅生涯開片成

  績。


  目前外媒報導《沙丘：第二部》的北美開片成績預估將達到6500萬美金（約台幣20.39億

  元），直接超車2021年首部《沙丘》開片的4101萬美金（約台幣12.86億元），不過當時

  發行該片的華納兄弟是採取院線和串流同步上映。


  但這個開片成績估計的還算保守，因為就目前的預售情況來看，《沙丘：第二部》領先去

  年暑假創佳績的《奧本海默》，該片首週末3天當初預測可以達到4000到5000萬美金（約

  台幣12.54到15.68億元），結果開片直接達到8245萬美金（約台幣25.86億元）。


  提摩西也不斷寫下自己紀錄，他主演的《旺卡》在北美已突破2億美金（約台幣62.74億元

  ）大關，也是繼暑假《Barbie芭比》和《奧本海默》掀起的「芭本海默」熱潮後，最賣座

  的電影。《沙丘：第二部》將於2月27日搶先上映口碑場，2月28日包括 IMAX、D-BOX、

  4DX、MX4D、Atmos、Dolby Cinema版本同步在台上映。台灣預售將於2月14日正式展開。


  --'
