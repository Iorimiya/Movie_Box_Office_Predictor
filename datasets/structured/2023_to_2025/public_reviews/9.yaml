title: '[新聞] 《黑暗騎士》成第二部美國電影保護局指定'
content: '《黑暗騎士》成《超人》後第二部獲美國電影保護局指定典藏英雄片！






  美國國家電影保護局一年一度的指定收藏時間又來臨了。自1989年至今，國家電影保護局

  每年底都會嚴選25部電影列入國家影片登記表（National Film Registry），這些作品必

  須符合上映超過十年的標準，並在文化與歷史方面、抑或美學上具有重要的價值，而今年

  被列入收藏的25部電影裡，其中一些較為近代的作品，又以《黑暗騎士》（The Dark Kni

  ght）最為大眾熟知。



  《黑暗騎士》是國家影片登記表當中非常罕見的超級英雄類作品，在此之前，唯一一部被

  收錄進國家影片登記表的超級英雄電影僅有1978年版的《超人》（Superman）。導演克里

  斯多夫諾蘭（Christopher Nolan）對此表示：「這不僅對所有投入《黑暗騎士》製作的

  人來說是莫大的榮耀，這同時也是對過去數十年來所有為蝙蝠俠神話付出過心血的藝術家

  和作家們的最大敬意。」





  美國國會圖書館館長卡拉海登（Carla Hayden）表示，他們也致力於紀錄女性與有色人種

  對美國電影工業的奉獻，因此我們可在今年的片單發現，國家電影保護局今年也持續收錄

  了九位女性導演與七部有色人種導演的作品。諸如讓凱薩琳畢格羅（Kathryn Bigelow）

  締造奧斯卡首位女性獲頒最佳導演紀錄的《危機倒數》（The Hurt Locker）、自1920年

  代至1982年間唯一一部由黑人女性導演執導的長片《Losing Ground》等作。




  其它今年獲選收藏的電影還包括《史瑞克》（Shrek）、《火爆浪子》（Grease）、《福

  祿雙霸天》（The Blues Brothers）等片，完整片單如下：



  《懸念》（Suspense）


  《威尼斯兒童賽車》（Kid Auto Races at Venice）


  《Bread》


  《世紀之戰》（The Battle of the Century）


  《With Cara and Camera Around the World》


  《月宮寶盒》（Cabin in the Sky）


  《駭人聽聞》（Outrage）


  《金臂人》（The Man with the Golden Arm）


  《野百合》（Lilies of the Field）


  《發條橘子》（A Clockwork Orange）


  《史威特貝克之歌》（Sweet Sweetback''s Baadasssss Song）


  《Wattstax》


  《火爆浪子》


  《福祿雙霸天》


  《Losing Ground》


  《Illusions》


  《喜福會》（The Joy Luck Club）


  《The Devil Never Sleeps》


  《樂士浮生錄》（Buena Vista Social Club）


  《The Ground》


  《史瑞克》


  《Mauna Kea：Temple Under Siege》


  《危機倒數》


  《黑暗騎士》


  《自由乘車者》（Freedom Riders）






