url: https://www.ptt.cc/bbs/movie/M.1451014497.A.DB0.html
title: 'Re: [討論] 星戰第二部劇末對決橋段 (雷)'
content: '我對星際大戰當中原力的使用 覺得蠻納悶的一點


  大部分絕地或西斯都是用原力抓東西丟人、用原力推人、或是移動物品


  但幾乎沒有用原力去移動自身身體，讓自己可以漂浮移動


  (有看過yoda坐在漂浮的石板上移動)


  但大部分狀況下不能像是萬磁王可以把控制金屬的能力玩到如此出神入化


  而且大部分實戰還是用光劍決鬥 (當然遇到原力相當的西斯還是得用光劍)


  讓人感覺原力似乎不是那麼好用


