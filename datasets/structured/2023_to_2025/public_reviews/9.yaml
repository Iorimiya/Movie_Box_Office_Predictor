url: https://www.ptt.cc/bbs/movie/M.1760175877.A.166.html
title: '[新聞] 《魔法壞女巫：第二部》北美預售又破紀錄'
content: '《魔法壞女巫：第二部》北美預售又破紀錄！全球巡迴行程正式曝光


  2025/10/11

  自由時報

  記者許世穎




  影史最成功的百老匯音樂劇改編電影《魔法壞女巫》即將以續篇《魔法壞女巫：第二部》

  邁向史詩最終篇章，週三（8日）北美展開預售立刻打破Fandango售票網站多項紀錄，今

  （11）日宣布全球巡迴行程，亞太首映會確定前進新加坡位於聖淘沙名勝世界的新加坡環

  球影城舉行，全明星陣容將出參加這場電影盛事。


  《魔法壞女巫》在去年締造影史紀錄，以超過7.56億美金（約台幣231.18億元）的全球票

  房、10項奧斯卡提名最終獲得兩項大獎，奠定影史最成功的百老匯音樂劇改編電影地位。

  《魔法壞女巫：第二部》預售開賣創下Fandango包括年度最佳24小時成績、影史PG級（接

  近台灣普遍級及保護級）最佳開賣24小時成績，同時也擠進預售史上開賣24小時前10名。



  全球巡迴行程將陸續造訪聖保羅、巴黎、倫敦、新加坡及紐約，豪華卡司包括奧斯卡提名

  女星辛西婭艾利沃、奧斯卡提名女星亞莉安娜、奧斯卡影后楊紫瓊、流行文化指標性人物

  傑夫高布倫，以及享譽國際的導演朱浩偉，他們將盛裝踏上紅毯，沿著象徵奧茲國的經典

  黃磚路，華麗現身位奧茲國中心。




  新加坡舉辦的首映會將是該片全球五大城市巡迴首映會的第四站，首映會當晚將舉行一場

  手印典禮，並且將在好萊塢龐特吉斯劇院舉行電影特別放映會，為整場盛會掀起最高潮。


  聖淘沙名勝世界度假村執行長李詩如對於該片來到新加坡首映直呼榮幸，「這次活動結合

  了好萊塢的華麗風采與新加坡環球影城的沉浸式體驗，充分展現聖淘沙名勝世界度假村作

  為享受世界級娛樂以及令人難忘的體驗首選觀光勝地的地位。」


  新加坡首映會將於11月13日舉行，李詩如也表示，這場首映也將為這間度假村今年一系列

  令人興奮的開幕活動劃下華麗的句點，「我們誠摯邀請所有人加入我們，一起感受奧茲國

  的魔法魅力，並且成為這場非同凡響的慶典的一部分。」


  參加這場新加坡首映的賓客，將有機會親眼目睹主要演員盛裝踏上黃磚地毯。當日限定的

  門票套票數量有限，影迷也可以關注新加坡環球影城官方IG帳號隨時掌握最新動態。《魔

  法壞女巫：第二部》11月19日在台上映。






  --'
