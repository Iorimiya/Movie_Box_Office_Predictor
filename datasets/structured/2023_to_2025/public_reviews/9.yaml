url: https://www.ptt.cc/bbs/movie/M.1741969436.A.6C0.html
title: '[討論] 封神第二部 試映感想 推爽片'
content: '本文無討論劇情內容，但若已經要去看並想避免被任何方面爆雷者請左轉


  —----------------防雷線-------------------
















  之前有在串流看過第一部，覺得特效很棒很震撼，那時候還後悔沒有去電影院看，後來發

  現是台灣沒有上映，昨天跟朋友去封神第二部試映會，現場真的人山人海，而且來看很多

  網紅耶~可以看出雖然是經典重拍成大螢幕的作品，依然不影響他的超人氣



  先說結論：這部在戰爭場面、視效表現上確實更勝第一部，IMAX 版本特別值得推薦，特

  效呈現明顯有「為大銀幕設計」的感覺，但強烈建議要坐在後面幾排，中途去廁所發現前

  面幾排的角度真的太刻苦了吧！


  大概分幾點講一下我的感想


  ● 視覺效果

  這次的戰爭場面確實有個人很喜歡的地方：若說第一部戰爭畫面是以人數龐大取勝，第二

  部則是以精細度為主，可以看出每一回交戰都是經過設計，融合不同的謀略或智取形式在

  裡面，為每一個戰爭或打鬥的段落帶來蠻大差異，才不至於像某集變形金剛打了幾小時都

  差不多、容易覺得無聊


  另外魔法與特效場景的確更為豐富，也極大程度跟出場人物設定大多會使用法術有關 --

  各種法術攻擊、神話生物與能量衝擊在戰鬥場面中大量運用，使得戰爭場景更具視覺張力

  ，而不只是純粹的冷兵器對決，也相應比第一部更有奇幻神話的感覺在裡面

  不過朋友專業評論認為有一些不夠細膩的地方、像是特效層次不夠統一、某些場景的光影

  與角色貼合度等等，不過我一產業門外漢倒是沒什麼感覺啦


  ● 劇情節奏

  這次的劇情相比第一部更加緊湊，開場不久就能感受到節奏的提升，戰爭與奇幻元素的比

  例比重增加，讓整體氛圍更加刺激。特別是姬發的成長線相對完整，畢竟第一部的故事線

  主要圍繞紂王、殷郊、姜子牙，這次則更聚焦在姬發的決策與轉變


  ● 演員表現

  我自己一直都很喜歡黃渤這位演員，他這次在封神裡不只是監製，也可以說是電影裡的搞

  笑擔當，能很有效地為每段劇情的氛圍帶來轉折點 – 他飾演的角色在戰爭戲之外，時不

  時會出現一些幽默的橋段，像是某場戲裡，他一邊吐槽情勢的危急，一邊還能自嘲，讓原

  本嚴肅的氛圍稍微緩和，還多了一點趣味


  總結

  整體來說，《封神第二部》是一部戰爭場面與特效表現值得進戲院觀看的電影，IMAX 版

  本更是讓這部片的臨場感提升不少。如果你喜歡第一部，這次應該會更滿意；如果上一部

  讓你覺得劇情拖沓，這次的節奏應該會讓你覺得流暢許多。但如果對劇情與角色塑造要求

  較高，可能還是會對某些部分有些疑問，畢竟受限於電影篇幅，還是會有所犧牲。


  昨天試映會結束後，演員吳興國老師也親自到場，他本人相當和藹，和片中聞仲那種堅毅

  且帶著威壓感的形象完全不同，後來我朋友跟我說他是演賭神中的「仇笑痴」!!真的是反

  差感滿滿耶。他與第一部開場飾演壯烈犧牲的冀州質子單敬堯也一起上台，分享了劇組在

  開拍前讓演員進行超過半年的集訓，希望讓每個角色都能最大程度地貼合故事背景與人物

  設定，從演員的準備程度也能感受到這部作品的用心程度





  如果對戰爭場面、特效爽片、奇幻劇情有興趣，這部片是值得進電影院體驗的！而且鄧嬋

  玉超嗆超辣(是我的菜)!



  --

  03/15 03:56

  我也推一個

  認同你的觀點，真的用心是有感受到的，雖然有可惜之處，但都是一個亮眼的成果

  真的，看到搥胸XDD 我朋友出來還在念這件事，大概念了十分鐘

  原來如此，難怪神仙戲分少這麼多

  你說的是《有女》那首歌嗎？一開始聽到還以為就單純一首諷刺的片段，沒想到．．．

  同意！原本想提但又怕劇透，不然我看完也是非常喜歡這個角色

  我也推一個'
