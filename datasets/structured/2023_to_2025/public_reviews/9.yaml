url: https://www.ptt.cc/bbs/movie/M.1628846045.A.3F9.html
title: 'Re: [新聞] 《黑暗騎士》成第二部美國電影保護局指定'
content: '雷




  黑暗騎士


  經典到不行的電影


  尤其是那小丑


  又瘋狂又聰明的犯罪者


  從開頭的搶劫銀行


  到小丑打電話炸掉警局逃出來


  每一段精彩的劇情


  放到今天 依然無數人在討論


  結果當年連入圍奧斯卡最佳影片獎都沒有


  甚至連提名都沒有


  我倒想問一下


  當年得到奧斯卡最佳影片獎的貧民百萬富翁


  放到今天討論度有多少？


  百萬富翁怎麼沒有列為美國電影保護局名單


  百萬富翁是不是政治正確所以得獎？


  印度 > 貧民窟 > 小孩


  有多少人一看再看百萬富翁？


  真的遺憾


  一部這麼經典的電影


  輸給了政治正確




  --'
