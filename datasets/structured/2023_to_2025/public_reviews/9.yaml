url: https://www.ptt.cc/bbs/movie/M.1683132233.A.DB3.html
title: '[新聞] 《沙丘：第二部》釋出正式預告影片 今年 '
content: '新聞網址：


  新聞標題：《沙丘：第二部》釋出正式預告影片 今年 11 月在台上映


  完整新聞內文：


  改編自法蘭克赫伯特著名小說《沙丘》、由丹尼維勒納夫執導的電影《沙丘：第二部》，

  官方於今日正式曝光了電影預告影片。


  《沙丘》故事描述一位聰明又富有天賦的年輕人保羅亞崔迪，肩負著超越自己能理解的偉

  大天命，必須遠行至宇宙中最危險的星球，以確保家族未來的延續。該星球出產極其珍貴

  的資源，一種能釋放人類最大潛能的物質，隨著各方邪惡勢力為搶奪資源大打出手，最後

  只有戰勝內心恐懼的人才能存活。


  而在《沙丘：第二部》中，故事將探索保羅亞崔迪的偉大神祕之旅，他和荃妮以及弗瑞曼

  人聯手，對毀滅他家族的陰謀者展開報復。保羅必須在他畢生摯愛與已知宇宙命運之間做

  抉擇，並且努力阻止只有他能預見的可怕未來。


  片中原有及全新演員包含：提摩西夏勒梅、辛蒂亞、蕾貝卡弗格森、喬許布洛林、奧斯汀

  巴特勒、佛蘿倫絲普伊、戴夫巴帝斯塔、 克里斯多夫華肯、史蒂芬麥金利亨德森、蕾雅

  瑟杜、史戴倫史柯斯嘉 、夏綠蒂蘭普琳，以及哈維爾巴登。


  　　《沙丘：第二部》劇本由導演丹尼維勒納夫及喬斯派茨改編法蘭克赫伯特的小說而來

  ，導演丹尼維勒納夫以此著手進行拍攝。製片包含瑪莉派倫特、凱爾波伊特、丹尼維勒納

  夫、譚雅拉蓬特，和派崔克麥考米克。監製則包含約書亞葛爾德、赫伯特蓋恩斯、喬斯派

  茨、湯瑪斯杜爾、布萊恩赫伯特、布萊恩馬瑞特、金赫伯特，並且由凱文安德森擔任創意

  顧問。


  　　導演丹尼維勒納夫也再次與他的《沙丘》創意團隊合作，攝影指導格雷格弗萊瑟；美

  術指導帕特里斯維梅特；剪輯師喬沃克；特效總監保羅蘭柏特；服裝設計賈桂琳威斯特，

  而作曲家漢斯季默也再度擔任配樂的重任。


  　　《沙丘：第二部》是在布達佩斯、阿布達比、約旦和義大利等地拍攝，目前電影預定

  將於 11 月在台上映，對於本作有興趣的人，可關注後續相關報導。


  --'
