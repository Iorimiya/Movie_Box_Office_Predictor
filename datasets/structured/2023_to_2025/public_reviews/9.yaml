url: https://www.ptt.cc/bbs/movie/M.1464354775.A.C9E.html
title: '[新聞] 湯姆福特第二部導演作品《夜行動物》上映'
content: '新聞網址：


  湯姆福特第二部導演作品《夜行動物》上映檔期鎖定年底獎季


  文/Jean


  知名時裝設計師湯姆福特（Tom Ford）在 2009 年帶來了編導處女作《摯愛無盡》（A

  Single Man）得到許多正面迴響，也讓主演的柯林佛斯（Colin Firth）獲得不少獎項提

  名。終於湯姆福特的第二部導演作品《夜行動物》（Nocturnal Animals）已經在 2015

  年開拍，目前也確定了上映檔期，將在今年底的熱門獎季登場。


  《夜行動物》改編自奧斯丁萊特（Austin Wright）在 1993 年發表的小說〈Tony and

  Susan〉，內容主要著重在藝廊女老闆蘇珊收到了前夫所寫的驚悚小說手稿為尋求她的看

  法，但是她將其故事視為前夫即將對她展開的威脅復仇。在原著小說中主要分成兩條故事

  線，一部份是前夫手稿的內容，一部分則是蘇珊本人的黑暗秘密。


  相當豪華的演出卡司包括傑克葛倫霍（Jake Gyllenhaal）、艾美亞當斯（Amy Adams）、

  麥可珊儂（Michael Shannon）、亞倫泰勒強森（Aaron Taylor-Johnson）、艾拉費雪（

  Isla Fisher）、艾米漢默（Armie Hammer）等，並再次找來了曾在《摯愛無盡》配樂師

  艾柏柯澤尼奧斯基（Abel Korzeniowski）配樂，並由《贖罪》（Atonement）攝影師西默

  斯麥葛維（Seamus McGarvey）掌鏡，由焦點影業負責北美發行 11 月 18 日限定上映，

  12 月 9 日正式上映。


  --'
