title: 'Re: [好雷] 沙丘：第二部  DUNE：PART TWO'
content: "我應該也算投好雷\n\n但美中不足的部分就是 後段節奏太緊了\n\n我沒看過小說但有補油管上的劇情解說\n\n不確定電影改編多少\n\n================================\n\
  \n\n\n\n劇情缺憾\n1 準男爵反派鋪成蠻不夠的 \n除了更變態嗜血以外 實在看不出他有什麼資格\n取代拉班 （競技場三個亞崔迪兵 \n選一個最老最瘦弱的不下藥\
  \ 我有點傻眼）\n或是成為另一個奎薩茲哈德拉跟保羅競爭\n就是以優秀遺傳因子來看的話\n\n然後最後一場打鬥戲我也看不出保羅怎麼打贏的\n\n2 保羅的戰略看不懂\n\
  \n既然有先知技能應該可以預見男爵反水想咬皇帝\n怎麼保羅沒加以利用 讓其他大氏族承認他的正統\n\n只是拿他生擒皇帝跟決鬥的戰績就想讓人投降\n未免太不合理\
  \ \n因為這樣代表其他氏族也可以在此時憑武力取得帝位\n更別說軌道上有空軍 有屏蔽場核彈沒用\n弗雷曼人可沒幾個飛行員\n\n偷看無數劇本後說只能成為哈肯能\
  \ 好像完全無關啊\n只拿來嗆聲外公跟表哥有啥用\n\n3 哥尼完全沒發揮嘛 \n印象中小說晶算師老頭有投奔哈肯能 似乎全砍\n哥尼對拉班那邊有夠草率的 簡直就是打小兵\n\
  拉班怎麼從開場掉漆掉到結束\n除了一直擊殺己方小兵毫無戰績\n-----\nSent from  on my Android\n\n--"
