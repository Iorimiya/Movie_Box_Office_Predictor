url: https://www.ptt.cc/bbs/movie/M.1742282164.A.8A4.html
title: '[新聞] 《封神第二部》票房封神！影城緊急加開'
content: '《封神第二部》票房封神！影城緊急加開場次 周華健也力挺：很精彩！


  新聞網址：


  由費翔、黃渤、吳興國主演的神話鉅作《封神第二部：戰火西岐》14日首登全台IMAX、

  SCREENX大銀幕，首周末票房突破500萬，登全台新片票房冠軍！「國民歌王」周華健15日

  應邀演員吳興國，攜妻子與同為演員的兒子周厚安共同觀影《封神第二部》，映後也大讚

  ：「很精采！封神榜的故事有了全新生命！」


  周華健與吳興國因當代傳奇劇場的代表鉅作《慾望城國》而結緣，兩人結識近二十年，共

  同為藝術創作努力、互相幫助，周華健不僅攜全家觀看《封神第二部》，映後更驚喜現身

  ，為當代傳奇劇場的傳奇之友活動站台宣傳，對此吳興國15日感性發文：「非常感謝華健

  近二十年的友誼，很高興他喜歡『封神二』！」周華健也表示：「聞仲騎的墨麒麟真的很

  帥！我要上網找圖去掛在我公司裡！」


  《封神第二部》講述由紂王（費翔 飾）、聞仲（吳興國 飾）、鄧嬋玉（那爾那茜 飾）

  主導的殷商大軍，討伐由姬發（姬發 飾）、姜子牙（黃渤 飾）帶領的西岐軍民，雙方各

  有魔家四將、雷震子、崑崙仙人等神仙與妖怪坐鎮，一時間兵戈相對、法術交鋒，不少觀

  眾看完後也熱推：絕無冷場！大銀幕看超過癮！結尾居然哭到不能自己！


  《封神二》除了戰爭大場面、法術特效等奇觀令人大開眼界，幾個年輕演員的表現更讓人

  印象深刻，其中飾演鄧嬋玉的那爾那茜堪為《封神二》的最大亮點之一，對此吳興國也對

  她讚譽有加！片中那爾那茜與吳興國有許多對手戲，而這也是她第一次與吳興國合作，吳

  興國進一步分享拍攝的幕後故事。電影中有一場戲是鄧嬋玉質疑聞仲不該殺害百姓，聞仲

  聽聞冷不防甩她重重一耳光，拍攝前吳興國提醒那爾那茜必須及時閃躲，避免被服裝上的

  鋒利戰甲劃傷，沒想到正式開拍時，那爾那茜反應超快，讓那顆鏡頭一次就過！吳興國大

  讚：「真是悟性極高的演員！」


  《封神第二部：戰火西岐》上映三天獲得全台觀眾的熱情支持與響應，不少觀眾強烈推薦

  必須直攻特規廳，才能完整享受這部片的震撼特效與視覺饗宴，對此片商也公布IMAX海報

  加印消息，並且加碼雷射光特殊工藝材質，回饋給所有熱愛《封神第二部》的影迷，封神

  迷千萬不能錯過這個難得的機會！更多詳情請洽電影《封神三部曲》粉專。


  備註：

  封神二台灣上映排片場次並不多，但首周末仍取得533萬票房不俗的成績

  (新片第一、全部第二)，使許多影城加開場次因應！

  建議直攻IMAX、SX等特規廳，才能完整享受這部片的震撼特效與視覺饗宴~


  台灣上周末票房榜：


  --'
