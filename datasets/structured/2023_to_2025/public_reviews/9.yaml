url: https://www.ptt.cc/bbs/movie/M.1749896817.A.014.html
title: '[新聞] 第二部《水深火熱》有望？雷尼哈林再戰'
content: "第二部《水深火熱》有望？雷尼哈林強勢回歸，再戰鯊魚電影與海洋災難片\n\n\n\n2025 年是《大白鯊》上映五十週年，這個數字也提醒了我們，它如何影響數世代的觀眾\n\
  ，讓他們一看見海洋就想到殺人利刃般的成排尖牙。《大白鯊》誇大攻擊行為的戲劇效果\n雖然出色，卻也強化大眾對鯊魚的盲目敵意。創作者即使已意識到保育鯊魚的重要，仍樂\n\
  此不疲地推出大量的鯊魚片，並將鯊魚的攻擊動機改成人為疏失或科學干預的影響，用人\n類自食惡果的主題，呼應人鯊共存的環保訴求。\n\n\n\n\n今天，我們已沒有過去那麼懼怕鯊魚，但鯊魚仍是動物反派的首選。保護鯊魚的非政府組\n\
  織「鯊魚盟友」(Shark Allies) 成員雷尼哈林曾對此現象提出有趣的解讀：\n\n「當電影主角進入某個陌生的自然環境，我們要讓觀眾迅速理解他們的孤單無助，這時鯊\n\
  魚就相當好用，因為他們看起來既強悍又頗具威脅性。然而這不代表他們真的如此兇暴。\n雖然《水深火熱》的鯊魚是因手術改造而攻擊人類，但我仍為了執導本片而感到內疚。」\n\
  \n\n除了《大白鯊》的原著作者與導演外，雷尼或許是最有資格說出這番真情懺悔的人。他在\n 1999 年執導的《水深火熱》被譽為鯊魚片的不朽傑作之一。它巧妙地平衡科幻與寫實元\n\
  素，無論是與觀眾唱反調的趣味轉折，或牙尖嘴利的自嘲幽默，都讓它從坊間一成不變的\n跟風作品裡脫穎而出。\n\n\n\n《水深火熱》讓這位擅長恐怖與動作題材，卻在九零年代後期不斷遭遇票房重挫的芬蘭導\n\
  演，再次嚐到甜美的果實，也實現了他讓恐怖片擺脫低成本製作地獄的心願。有趣的是，\n本片不但拯救他的事業，更替鯊魚片開拓另一條命脈。它啟發大肆改造鯊魚的科幻創作，\n\
  造就他們飛天遁地、銅牆鐵壁的拼裝形象。當鯊魚片變得更荒唐無稽，也在無意間大幅減\n低鯊魚的恐怖。或許這可說是對鯊魚保育的另類貢獻。\n\n《水深火熱》後來又出了兩部與雷尼無關的續集。故事與第一集大同小異，卻少了它的狡\n\
  黠與靈氣，讓影迷更盼望他能重拾此題材。但另一方面，這也反映一個無奈的現實，那就\n是他在《水深火熱》及 2004 年的砍殺片傑作《八面埋伏》(Mindhunter)\
  \ 締造創作高峰\n後，已陷入二十年的低迷狀態。\n\n\n\n雷尼哈林要拍攝虎鯨電影？\n\n這段時期雖看似產量豐沛，卻少有令人耳目一新的作品。在經歷雜亂無章的摸索期後，他\n\
  進軍中國的製片計畫，也在 2020 年後悄悄的撤退與轉型。沒有人比他更渴望《水深火熱\n》的奇蹟，而「雷尼哈林即將回歸鯊魚電影」的消息，恐怕也是目前最能凝聚觀眾熱情的\n\
  標題。這正是傳奇樂團 KISS 的創始元老金西蒙斯 (Gene Simmons) 在 2023 年帶著新成\n立的製片公司拜訪他時，所盤算的願景。\n\n\n\n\
  西蒙斯的主要目標是進軍動作驚悚片市場，因此當他需要一部聲勢浩大的創業作時，自然\n就想到老友雷尼。\n。《深水》是《大海嘯鯊口逃生》的澳洲編劇\n尚恩阿姆斯壯構思的第二部鯊魚災難片，可說是獨立卻延續類似主題的續集，它敘述一架\n\
  從洛杉磯飛往上海的班機在海上失事後，乘客如何逃出隨時可能沉沒的機艙，並與海域的\n飢餓鯊魚群搏鬥的經過。\n\n《深水》與《鯊口逃生》雖然提及鯊魚危險的一面，但鯊魚是在不可抗力的情況下誤闖人\n\
  類的生活區。《鯊口逃生》讓鯊魚捲入被海嘯肆虐的城市及超市，《深水》則是不請自來\n的空難事故，且生還者的內訌遠比鯊魚更致命。尚恩原本屬意由《3D驚天洞地》的導演亞\n\
  歷斯特格里森操刀，然而他的劇本卻因與同年發生的馬航 370 失蹤事件過於雷同，而遭\n到冷凍。\n。而劇本對人類與自然衝突的描寫，與研究鯊魚後投入保育工作\n\
  的雷尼可說是一拍即合。\n\n\n\n\n令人意外的是，正當外界對雷尼的新鯊魚作品感到好奇時，他又宣布自己正製作一部描述\n海洋災難的驚悚片《黑潮》(Black\
  \ Tides，暫譯)。而題材則是與鯊魚同樣備受誤解的虎\n鯨。雷尼的靈感來自西班牙曾發生的虎鯨衝撞船隻事件，但虎鯨並未傷害船員，而是因不\n明理由試圖破壞船舵。事實上，過去被稱為「殺人鯨」的虎鯨除非出現身心極端異常的情\n\
  況（例如紀錄片《黑鯨》(Blackfish) 提及的惡劣圈養環境），否則鮮少展現敵意。\n\n\n人類對虎鯨行為的研究，促使他們在電影的形象大為改觀。現今唯一的虎鯨災難片《大海\n\
  怪》(Orca, 1977) 也將虎鯨描繪成極富人性、為伴侶復仇而追遍天涯海角的海上戰士。\n有趣的是，《黑潮》似乎隱含類似的元素。約翰屈伏塔飾演的父親帶著關係疏離的兒女駕\n\
  船前往直布羅陀旅行，卻在途中與虎鯨群發生衝突，陷入生死交關的掙扎。故事以女兒蕾\n貝卡的視角為出發點，敘述他在解救家人之餘，所面對的創傷及糾葛。雷尼將會如何挑戰\n\
  半世紀以來創作者迴避的虎鯨反派角色，相信會是災難片影迷最關注的話題。\n\n\n\n/\n\n90年代的動作名導雷尼哈林在過氣之後跑到中國拍片，但成績也不見起色，後來又在好萊\n\
  塢拍了幾部過水動作片，現在回來拍鯊魚災難片其實也不太看好\n\n--"
