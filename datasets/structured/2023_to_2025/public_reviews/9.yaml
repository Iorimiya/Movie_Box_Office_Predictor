url: https://www.ptt.cc/bbs/movie/M.1725262300.A.67A.html
title: '[普雷] 沙丘第二部'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  慢了很多拍才去看沙丘第二部，劇情的部分老實說是有點難理解

  可能要再回頭看第一部回憶一下

  但這也無礙我欣賞電影裡營造的景色就是了



  最震撼的一幕還是男主角乘上沙蟲那段吧


  看主角勾上沙蟲後在風沙中掙扎然後慢慢起身

  搭上周圍氣氛渲染，真的會有種想要跟著喊利桑亞拉黑的衝動


  另外就是主角媽媽喝下聖水成為聖女這段

  當下還以為後面會上演什麼宮鬥劇

  但或許是因為時間的緣故吧？

  結果感覺也還好，沒有想像中的場景出現


  說到時間，看到蠻多影評都說這次因為時間的問題所以劇情有做刪減

  人物個性也有做調整，不然塞不完

  但以一個沒看過的原作的人來說，私心覺得三個小時真的是挺長的

  還好看的時候不是在影院看，不然我應該會憋尿憋得很痛苦XD


  --

  我還沒到那個境界XD

  這樣子很吊我胃口XD'
