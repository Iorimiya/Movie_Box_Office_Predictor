url: https://www.ptt.cc/bbs/movie/M.1690384991.A.990.html
title: '[新聞] 罷工持續進行！《沙丘：第二部》再傳考慮'
content: '新聞網址：


  罷工持續進行！《沙丘：第二部》再傳考慮延期全看9月決定


  2023-07-26 自由時報電子報 記者 許世穎 綜合報導


  美國演員工會罷工持續進行，好萊塢各大片商也開始思考新片上映計畫，在「無法依靠演

  員宣傳」的情況下考慮延期。繼先前《綜藝》報導華納兄弟影業正考慮延後上映年底大片

  《沙丘：第二部》，但須要和合作的「傳奇影業」達成共識，《Deadline》今也報導，「

  傳奇影業」也在觀察工會和製片商之間的談判，預計9月初決定該不該延後。


  由於演員工會禁止成員在罷工期間參加作品宣傳，對於《沙丘：第二部》的全明星陣容來

  說打擊相當大。根據《Deadline》報導，若「電影電視製片聯盟」能和演員工會在9月初

  勞動節週末前達成共識，《沙丘：第二部》可能會維持原定的11月初上映，但若罷工持續

  進行，預計將延後到明年3、4月，或是靠近坎城影展前的暑期再上映。


  該片主演之一的辛蒂亞主演新片《挑戰者》原定擔任威尼斯影展開幕片首映，之後預計今

  年9月上映，不過隨著演員工會罷工，先前已宣布延到明年4月上映，同時也取消開幕首映

  的計畫，目前由威尼斯競賽片《指揮官》取代擔任本屆威尼斯影展開幕片。


  --'
