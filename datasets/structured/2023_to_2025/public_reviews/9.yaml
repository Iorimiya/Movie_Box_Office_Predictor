url: https://www.ptt.cc/bbs/movie/M.1451012264.A.EE6.html
title: '[討論] 星戰第二部劇末對決橋段 (雷)'
content: "這陣子因為星戰7的關係, 特地又再看了前6部.\n昨天看完第二部複製人, 在劇末尤達大師和杜庫男爵的對決有一些疑問...\n\n對決橋段最後,\
  \ 杜庫試圖使用原力讓重物落下, 攻擊倒地不起的歐比王和安納金,\n尤達為了保護他們2個, 錯失阻止杜酷離開的機會.\n\n但這邊有幾個奇怪的點:\n\n1.\
  \ 該橋段不久前, 歐比王、安納金、佩咪因追擊杜庫, 佩咪摔到地面,\n   安納金本想降落救佩咪, 被歐比王曉以大義說服追殺杜庫為重而作罷.\n   表示歐比王認為追擊杜庫比什麼都重要.\n\
  \n   但尤達大師面對後來杜庫欲逃、2個絕地命危, 卻選擇救人而不追人...\n   目前想到原因如下:\n   (1) 尤達老糊塗, 情急下失去事情輕重緩急的判斷力?\n\
  \   (2) 尤達比歐比王精明, 認為杜酷逃走沒啥大不了, 救人要緊?\n\n2. 尤達選擇救人, 使用原力撐住掉落的重物, 可是瑞凡...\n   那個物體看起來比2人的體重多出百倍啊..!\n\
  \   原力明明可以移動人體, 為什麼尤達要選擇費盡心神移動那麼重的東西,\n   結果讓杜酷跑了?! 目前想到原因如下:\n   (1) 導演是白癡\n  \
  \ (2) 導演故意讓尤達耍白癡, 展現老人家原力好棒棒\n   (3) 導演把觀眾當白癡\n\n不知大家對於這段有什麼看法呢?  @@\n\n--\n\n2個絕地的命和銀河的和平,\
  \ 能比嗎?\n絕地本來就身負和平的使命, 犧牲2人又何妨?\n數百歲的尤達判斷力顯得怪怪的\n\n\n上面說的是我內文第一點, 其實也許可以不用救人, 阻止杜庫優先\n\
  第二點則是說, 既然決定要救人, 為什麼用那麼蠢的方式,\n雖然救人成功, 但敵人跑了..."
