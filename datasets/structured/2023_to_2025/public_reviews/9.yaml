title: '[微微好雷] 腦筋急轉彎1-比第二部好看0.03吧笑死'
content: "首先  這部有雷1跟2  劇透注意  沒看過2怕劇透也請先離開\n\n\n警告區  警告區  警告區\n\n警告區  警告區  警告區\n\n\
  警告區  警告區  警告區\n\n\n------------------------------------------\n\n\n真的是複製貼上的電影  超厲害XD\
  \  每一個片段都照抄\n\n但是第二集被第一集屌打到爆\n\n都是樂樂當主角然後被踢出  然後塑造一個北爛情緒  第一集是憂憂  第二集是焦焦\n\n然後接下來就是想辦法拖戲看怎麼扯\
  \  才能回去\n\n\n\n\n很多設定完全都一樣  什麼黑暗的秘密阿  想像的世界啊   這些梗都沒變\n\n漏洞跟邏輯都很差\n\n第一集演 樂樂不在 \
  \ 女主角好像變白癡 什麼回應都超爛的\n\n可是第二集樂樂一樣也不在阿  用焦焦控制也沒有回應太多白爛的回應\n\n那幹嘛演的好像沒有樂樂不行?就因為劇情需要囉\n\
  \n\n\n那為什麼相同的結構 同樣的和弦  我覺得第一集屌打第二集? 因為張力\n\n女主角因為搬家受到的影響是實質的新環境\n\n而不像是第二集純粹腦補自己同學討厭自己之類的\
  \  大巫比小巫\n\n當然兩集都是迷路然後在大腦那邊散步  第一集還什麼抽象區  都滿無聊的\n\n\n\n最後收尾至少第一集有大和解  大抱抱\n\n雖然收得很硬要XD\
  \ 突然在那邊  需要sad  超莫名其妙\n\n突然就變成救星了?傻眼\n\n衝回去在那邊冰棒冰棒冰棒冰棒冰棒也是超低能又無腦\n\n就算是小孩子  也應該會被這智障劇情嚇傻\n\
  \n\n\n但至少不像第二集  在那邊搞懸疑  有進隊伍還沒進隊伍都不敢寫出來\n\n\n整體而言這確實就是一個寓意不深的故事\n\n真的沒什麼高大上了不起的心理學意涵在背後\n\
  \n希望別再出第三集了  只會越來越爛\n\n脆上面說要有色色這個角色也是超沒梗==  低級當有趣\n\n\n\n而且講真的這部最大的缺點就是結構本身有超大BUG\
  \  到底為什麼樂樂也會崩潰\n\n樂樂也會哭  然後樂樂也會憤怒\n\n如果你的每一個情緒本身都也是千變萬化的個性  那就自打嘴巴阿\n\n那怒怒也可以開心\
  \  怕怕也可以憤怒才對  這樣寫真的很偷懶+破格\n\n\n既然要把情緒從個人身上抽離分化  那樂樂就是負責樂樂  這不就是你故事本身的寓意?\n\n結果寫到後面\
  \  為了劇情張力  為了推動劇情\n\n每次都要把樂樂搞到變成崩潰 智障樂  變成北七樂  何必呢????\n\n只能說給小朋友看的東西 真的不要還假掰在那邊說什麼\
  \  背後很深層  很心理學三小的\n\n大家當個5歲小孩 看看就好   給個微好雷  算是很客氣了\n\n\n以上  都是針對劇情討論  我們腦筋急轉彎3再見\n\
  \n--\n那是你自以為是的想法  重點就是劇本這樣寫很差\nNot to mention, there’s a lot of really bad implications\
  \ because of how thing\ns\n were handled. Frankly not always me more and more that\
  \ people are not talking\nabout it. Namely 1. Anxiety being villainized and also\
  \ being a joke. Which is\nreally damaging. Not to mention the fact of it being treated\
  \ as a thing that\nonly really shows up when you were a teen and once you’re an\
  \ adult, just seem\ns\n to largely disappear is also really bad. (in speaking of\
  \ someone who is\nstruggled with anxiety issues for over a decade at this point….\
  \ I was pretty\nticked.) 2. Any of the emotions being villainized largely goes against\
  \ the\npoint of the original movie, which was to say, “all of your emotions are\n\
  important and they have a job to do.” Not to mention the fact that they prett\n\
  y\n much treated anxiety is just as. “Oh, it’s just something you grow out of.\n\
  “\n外國網友跟我看法差不多 你練一下英文可以閱讀一下\n好好笑 你的阿怒好快發作  粉絲一貫伎倆  建議你去尋找你的樂樂\n然後控制一下你的阿廢\n你反串吧\n\
  1.不是一定要跟你們一樣才叫做看懂  2.不是一定要跟你們一樣才較有深度\n3.每個人都有情緒  但不是把情緒變成腦袋小角色就代表劇本寫得很好\n4.被感動到哭每個人都有不同理由\
  \  沒有比較高尚\n我看電影也有被感動過  這都不排斥我對這個系列有我自己的見解  我就是認為太幼稚\n當我說幼稚 有人說這是給小孩看  當我說給小孩看  又有人說裡面超深\
  \  大人都認同\n所以尊重別人有自己的見解 ok  沒人規定捧高高的才叫做看進去 看很深\n我是很客氣了 因為先看二  而且粉絲很兇 我不想要講太明白\n笑死\
  \ 邏輯崩壞還理直氣壯欸  那憂憂也可以開心啊  是在難過殺小\n你記得第一集樂樂離開控制台  剩下怒 害怕 討厭  之類的  照你的邏輯 他們當下開心\n就?\n\
  為什麼打臉自己這麼響亮XD  你真要戰  那我問你 第一集樂樂說要擁抱負面情緒\n那請問為什麼第二集開始  又在那邊鼓吹樂樂樂 爽爽爽  無腦開心 無腦蠢?\n\
  阿就是吃書還硬要講得很有邏輯幹嘛啦\n\n再者  第二集只針對一個事件  而不是青春期生活  也是浪費題材了\nIt was hard to relate to\
  \ this movie especially having a child around that age,\nit focused the whole movie\
  \ one specific activity rather than Riley's actual\nteenage years. I would have\
  \ loved to have this been at school and see her\nnavigate new crushes, friends,\
  \ pimples etc., stuff that actually relates to\npuberty. Having it only been hockey\
  \ related over the course of a weekend is\nhardly her \"navigating her teenage years\"\
  .\n國外很多人都認同我的觀點  應該說我們觀點就都差不多XD\n就只有台灣鬼島一堆奇怪組織跟也許有利益的人士  不准任何人說這部爛 這部難看\n很明顯就是想繼續催票房\
  \  好了啦  很賣了 很棒了啦  怒怒下去吧 乖\n你有幻想症？誰跟你說有關？\n就跟你說了劇本寫很差 貼一段國外網友心得\n你是哪裡幻想那是針對你的\n中文都不會看？\n\
  笑死你慢慢看 奴奴發作了嗎\n怒怒是你們這些瘋狂粉絲說出來的欸 讚讚怒怒\n怎麼只看到你崩潰在這邊XDDD 控制你的怒怒 ok  加油耶"
