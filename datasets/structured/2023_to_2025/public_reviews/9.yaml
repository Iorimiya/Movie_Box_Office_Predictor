title: '[查克雷] 反逆之月 第二部導剪版'
content: '哇噢

  這是我看完的最直接心得


  哇噢



  我本來想說再來寫寫哪來不一樣來的

  但寫這個已經沒意義了

  你只要看過第一部導演版就可以直觀感受到根本是完全不一樣的電影了


  這根本沒必要比

  講白一點幾乎等同ㄦ和ZSJL的差別了

  有ZSJL除了為了搞自己或是想研究點啥的否則根本沒必要看ㄦ一樣


  不論是增加一兩句對話使邏輯完整

  還是補完劇情邏輯和大場面的邏輯演出

  還是補完各種該爆頭該死亡的演出

  都使整個觀感完全不一樣了


  更別說是情緒堆疊上的慘烈和電影最後在危機中希望依舊的收尾

  在很多地方來說都讓我感受到ZSJL給我的那種我會期待這個世界的後續

  期待這部電影的續集

  那種很久沒有感受到一部新的IP新的原創電影帶給我的震撼感


  真要我說這部才是那個能拍出ZSJL守望者等等的導演應該拍得出的電影


  而不是那個活屍大軍


  也許有人覺得我根本粉絲濾鏡來的

  講得太過誇張

  的確也許有這種可能


  但是我的觀影體驗是不會騙人的

  至少不會騙我自己

  當你看完電影才發現自己的屁股已經硬到僵硬在和你抗議這點都沒讓你出戲就代表了你的感受是不會騙人的


  最少這部

  這兩部電影值得你空出時間去觀看


  我已經很多年沒有感受到這種類型的電影了

  扣掉ZSJL那個的狀態不一樣

  那個問題太特別了



  當然也不是說這部電影真的完美無缺

  你的確可以在一些打鬥場景看到不少暴風兵槍法就是了



  幹好久沒有這樣了

  我有點失去組織語言邏輯去說明我的感受了


  先講點別的好了

  在第一部的心得中的確有人提到查克導演版和普通版差異和為啥不一開始就處理好之類等問題

  其他人的導演版明明就不會搞得像是兩部電影一樣

  大概 只少我只知道查克是真的搞得像兩部電影一樣的導演



  這個其實是查克拍片方式和其他人不一樣的關係

  很多人都會提到好萊塢拍片是拍一堆素材到剪輯室裡面去組合而成

  而這樣就好造成許多沒用到又實際上是重複的片段

  也就是素材


  當時導剪版運動時的確有不少人認為所謂的沒放出來的東西不過就只是素材而已根本不會有啥太大的不同

  例如 X戰警未來昔日那樣

  只是稍微對於怎麼到那個場景的走向稍微不一樣可能多個誰出場或是啥來的這種片段


  在各種BD幕後和導演訪談和導剪運動時各種神秘地方流出的神秘片段和

  最重要的 導演自己說和演示給訪談的


  他拍片在劇本完成後最先處理的東西就是整部電影從頭到尾的分鏡

  也可是視為漫畫家決定好的分鏡搞只剩下給助手處理的狀態

  在動畫製作中很常見的處理手法


  也就是說他在拍片前就已經決定好了需要拍啥了根本不會有多余的片段

  除非被華納給斃了對BVS還有一場戲拍好了不給用

  JL蝙蝠俠打類魔有利於雙重繩索槍做掉類魔你還可以找到替身演員們訓練時的影片

  還有MOSBVSJL都會預先先做一段粗糙的3D動畫給演員了解他們現在在拍什麼鬼東西


  對這個人吃飽撐著這時候就會開始試剪了


  這些水管上理論上都還在

  被斃掉的話BILI 應該還有在RAC後面一大串的影片裡面


  所有看到這部大致上應該就能了解了

  他的電影在正式開拍時總時長就已經可以知道了

  基本上要動刀全都是減法怎樣都會東缺西邋


  所以MOS沒有什麼導演版

  BVS快上映才在那邊砍片長被砍成殘廢

  JL被ㄦ化

  現在多一個反逆之月pg13的問題


  （好吧現在我很確定活屍大軍是拍來療傷的）


  這部又更特別了當時pg13做好時

  導剪版的特效還在做

  扣掉幾個小地方是拍來給pg13用的之外很多場景都是一樣的場景但場面完全不一樣

  雖然我自己也很意外的可以不一樣到這種鬼程度


  老話重談稍微冷靜下來了


  第二部在第一部的基礎上沒必要解釋世界觀和收集同伴

  整體上而言補完的東西基本上都是劇情的完整性和一堆爆漿

  增加的東西體感上應該是第一部比較多

  不過第二部的最後那場戰鬥的高潮戲增加了不少東西就是


  說真的不一樣到這種程度你看過pg13版的的話不看導演版根本太浪費了

  把pg13版從你的腦海中用導演版取代掉啦



  題外話

  那個森林王子瓦力高到不行

  題外話2

  捏梅希斯那場戰鬥總算正常點

  不然那場戰鬥原本觀感真的很爛

  題外話三

  去看啦去看啦

  至少把第一部看完就知道真的差的太大了


  -----

  Sent from JPTT on my Samsung SM-S918N.


  --


  要說的話由於觀影體驗上升音樂這次感覺非常不錯

  有些部分其實和pg13一樣但我完全沒記憶可見體驗差了太多了

  打戲體驗也是等比上升

  pg13就是沒了很多畫面打起來才很詭異


  第一部心得有說到

  參考題外話三



  本來就是'
