title: '[新聞] 費翔、娜然、吳興國攜手　《封神第二部》'
content: '費翔、娜然、吳興國攜手　《封神第二部》角色深度全面升級


  新聞網址：


  費翔化身PUA大師，娜然犧牲法力救主，吳興國融京劇於銀幕，《封神第二部：戰火西岐

  》即將以磅礡史詩氣勢席捲影壇。這部由烏爾善執導、耗時十年打造的神話鉅作，不僅繼

  承了《封神第一部：朝歌風雲》的宏大格局，更在角色深度、視覺效果與文化內涵上全面

  升級，為觀眾帶來一場視覺與情感的雙重震撼。


  此次釋出的「殷商陣營」幕後花絮，揭示了費翔飾演的商紂王殷壽如何在重創後重整旗鼓

  。他在妲己的法力救治下死裡逃生，並開始謀劃奪取封神榜，成為天下共主。費翔以精湛

  演技詮釋殷壽的心理操控力，善於利用話術與精神控制，讓聞仲與鄧嬋玉為其效命。導演

  烏爾善更強調，殷壽的角色設計展現了人性弱點與權力慾望的極致運用，讓角色更加立體

  且耐人尋味。


  娜然飾演的妲己則展現出角色的情感新層次。她不僅耗損自身修為救助殷壽，還在內心掙

  扎中逐漸顯露人性的一面。美術指導葉錦添以服裝設計體現妲己的心理變化，從青蓮色轉

  為深紅，傳遞出角色情感的深沉與複雜。這些細節為角色注入了更豐富的層次，讓觀眾得

  以從視覺與劇情中感受到角色的轉變與掙扎。


  台灣京劇大師吳興國飾演的聞仲，則以戲曲身段與傳統美學詮釋角色威嚴。他親自設計的

  法壇步伐、咒語手勢與雌雄雙鞭的舞動，完美結合了京劇藝術與電影語言，為角色增添了

  獨特的文化魅力。與此同時，新人演員那爾那茜飾演的鄧嬋玉則以英姿颯爽的形象成為西

  岐的最大威脅。她經過長達506天的特訓，成功完成所有動作戲，展現出角色的力量與堅

  韌。


  此外，魔家四將的登場更是技術與藝術的結合。製作團隊採用真人拍攝與特效化妝技術，

  搭配微縮模型與3D掃描，呈現出巨人與凡人之間的震撼對比，為整部電影增添了史詩般的

  壯麗感。


  《封神第二部：戰火西岐》不僅在視覺效果上突破極限，更透過角色的情感深度與文化內

  涵，為觀眾帶來一場超越想像的神話冒險。


  電影將於3月14日全台上映，勢必成為年度最受矚目的神話巨作。


  備註：

  費翔是台灣歌手(飾演紂王)，娜然(飾演妲己)是台灣準媳婦，兩人因戲生情，成為現實中

  的情侶。

  吳興國是台灣演員，飾演聞太師，在另一部春節電影(射鵰英雄傳：俠之大者)飾演一燈大

  師。

  電影總票房已達55億新台幣，暫居全球年度票房第四名，僅次於哪吒2、唐探1900及美國

  隊長4。

  戲中也有哪吒、申公豹、太乙真人及元始天尊等角色出場，有興趣可以去看看~


  --'
