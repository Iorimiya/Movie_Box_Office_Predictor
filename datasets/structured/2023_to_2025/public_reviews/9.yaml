title: '[討論] 有哪些三部曲系列是第二部最佳的'
content: '大家好 最近看電影發覺很多三部曲系列電影


  （劇情有連貫的 蝴蝶效應那種不算）


  都是第一集或是第三集拍的最好


  畢竟多數第二部都是幫第三集扛轎


  很少有第二集是三集中的頂峰的狀況


  像是移動迷宮 駭客任務就是第一集屌打二三


  無間道 教父也是第一集最佳 但第二部雖強


  但還是輸給第一部


  魔戒就是三>一>二


  哈比人沒看過就請別人補充


  看過的片單中唯一第二集成神的只有黑暗騎士


  請問還有那些三部曲是第二部最強的嗎



  --

  美隊三我覺得算作弊 根本是復仇者聯盟的陣容'
