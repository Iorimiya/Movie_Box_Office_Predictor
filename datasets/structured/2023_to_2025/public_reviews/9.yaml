url: https://www.ptt.cc/bbs/movie/M.1713616986.A.49A.html
title: '[有雷] 反叛之月  第二部分嗯.....'
content: '如果不是他們在那邊補完各自的背景故事

  我都忘掉他們誰是誰了


  第一部都是去年的事了




  整體而言比上部好多了


  但也有不少地方你可以感覺到為了配合分級有去砍掉不少畫面



  本來一群農夫要打正規軍本來就很難

  不過在缺糧來幹糧食這個前題下用糧食當盾牌反而很合邏輯


  雖然我自己都忘了一開始他們就是為了糧食而來的

  本來我預期是他們一道就開始訓練農民

  但他們實際上也只有五天而已

  能開火就放炸彈就行


  分成

  斬首 保護後方 突襲

  這幾個在演出的計劃都很正常


  就是農民死的不夠多

  或是演出來有死的不夠多


  那偽金鋼狼的戲份意外的很可以



  要說的話拆成兩部反而成為問題


  劇本上來說感覺才一部而已


  但是就個別角色而言

  那個超....機器人的戲份在第二部分很好

  但是本體的故事線訪談中提到在第一部

  而且是導演版中才會演出來


  真的要說感覺就是明明覺得整部電影的時長不夠但在某種程度而言兩部有點多了

  弄成一部也許會好很多

  但又弄成一部那些角色根本不夠時間去描寫

  本來就覺得砍掉不少戲份了



  結論還是等導演版


  這次網飛的切割商法我有點覺得討厭




  雖然我知道他們是先把pg13版本的部分故事線先做完

  才去做導演版的特效等地方

  完整版還有近兩個小時

  而且本來就包含在原本的預算裡

  網飛你有夠靠背的



  不然說我有點討厭這部電影目前不是完整質

  而且是可感知到的不完整性

  這才是這部在觀影體驗上最大的毛病



  目前這部能在一堆柯南和不可能的任務一起擠在日本的前十觀看裡面

  只能說這次切割商法在點閱率上面還是很成功的



  但我個人來說只要讓我感知到被刻意咖斷我就會出戲這點而已第二部咖斷得地方大都還是戰鬥部分

  我覺得不行

  明明該帥該爽的地方比第一部好太多了

  但是咖斷點比第一部來說太明顯我反而一直出戲有點不爽


  當然有後續的話我還會想看就是

  畢竟整體而言感覺就是一個宇宙的第一部電影但是拆成了上下集有拆掉了血腥畫面和不少角色故事線



  結論等導演版


  -----

  Sent from JPTT on my Samsung SM-S918N.


  --



  --‐------------------------------------


  04/21 00:01

  我的確認為第二部比較好看

  但是因為第二部砍畫面更明顯導致我一下子就好出戲

  搞得我很煩

  04/21 12:36



  主角群這樣思考很正常啦上集他們才被搞過而已


  查克的確說過看完第二部你會發現他整個是一部電影而已'
