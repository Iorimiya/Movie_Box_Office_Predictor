title: '[情報]沙丘:第二部延期至2024年3月'
content: '一早投下震撼彈，

  原本佔盡IMAX檔期優勢，

  業界預估不會調整檔期的沙丘2最終還是移檔了


  華納宣布沙丘2目前檔期移至2024年3月15日，

  哥吉拉大戰金剛：新帝國則順勢移至4月12日，

  年底強檔的水行俠2（12/20）和旺卡（12/15）檔期則維持不變




  1、最大得利者是驚奇隊長2？直接接下原本沙丘2獨佔6週IMAX的紅利


  2、沙丘2新檔期看起來是不會報名2024奧斯卡，芭本海默的對手又少了一個？


  資料來源： deadline


  ----

  Sent from on my Realme RMX2144


  --

  《魔戒：洛汗人之戰》也從原本3月順勢延到12月了'
