title: '[討論] 封神第二部 台灣上映有望？'
content: '中國的商業大片「封神第二部」台灣已經有發行商～ “鴻聯國際” ，臉書上有消息說封

  神第一部會在1月3日在各大串流平台上架，而第二部也會安排戲院上映？？


  封神第二部 這種題材最適合在春節檔期上映，而且今年台灣春節檔根本沒其它商業大片

  ，如果 封神第二部 能搶在一月底春節檔上映最好，不過小發行商大概不會有什麼特殊版

  本 ( 中國商業大片通常什麼版本都是一應俱全)，而且大概也沒辦法和台灣其它大片商搶

  戲院大廳。



  --'
