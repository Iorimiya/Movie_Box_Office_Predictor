url: https://www.ptt.cc/bbs/movie/M.1537365960.A.3A3.html
title: '[情報] 雷恩葛斯林已開始籌備第二部導演電影、Netflix 有意出資製作'
content: '在 2017 年以《樂來越愛你》獲得奧斯卡二度提名的加拿大演員 Ryan Gosling 在近年可

  以說是身價水漲船高，原本就已經擁有高度知名度的他接演了《銀翼殺手》睽違 35 年的

  續集電影《銀翼殺手2049》。而在今年則再度與《樂來越愛你》的導演 Damien

  Chazelle 合作新片《登月先鋒》，這回在電影當中 Ryan Gosling 換上太空服演繹「登

  月第一人」的 Neil Armstrong，在日前於威尼斯影展首映後已經廣受好評，讓他有機會

  三度挑戰明年奧斯卡的影帝之位。


  不過呢，Ryan Gosling 除了在螢光幕前展現他出眾的演技以及外表之外，其實內心也擁

  有著藝術魂。他曾在 2014 年帶來他的電影導演處女作《遺落流域》，這部由電視劇《神

  盾特工局》Iain De Caestecker、電視劇《廣告狂人》Christina Hendricks 及《淑女鳥

  》Saoirse Ronan 主演的電影在當年入選了坎城影展的「一種注目單元」，也風光的在棕

  櫚海岸上舉辦了世界首映。不過很可惜《遺落流域》並沒有受到影評人的青睞，在當時有

  不少評論表示這部電影有著太多如曾經與 Ryan Gosling 多次合作過的《落日車神》丹麥

  導演 Nicolas Winding Refn、《穆荷蘭大道》美國鬼才大師 David Lynch 亦或是《永生

  樹》坎城名導 Terrence Malick 的影子，但電影本身的描繪卻不夠深入，甚至有種族議

  題方面的缺失。


  雖說《遺落流域》並沒有讓 Ryan Gosling 以新導演之姿驚豔影壇，但不可否認這部電影

  整體仍然擁有著相當高的質感，或許外界也因為他原本的身分而提高了對於《遺落流域》

  的標準。而 Ryan Gosling 的導演夢當然也沒有因此就此打住，根據外國媒體的報導，他

  似乎已經著手開始準備他的下一部導演作品。


  根據法國電影雜誌「Cinema Teaser」的報導，曾經替《遺落流域》擔任攝影指導的比利

  時攝影師 Benoît Debie 透露已經開始和 Ryan Gosling 討論下一部電影的製作方向。

  他說：「我和雷恩葛斯林有一個新項目。在資金方面還沒到位，但雷恩告訴我網飛（

  Netflix）想要製作它，不過條件是必須以數位拍攝。而且可能不會在電影院中上映。我

  告訴他這樣會很可惜而他也認同。」


  就 Benoît Debie 的說法看來 Ryan Gosling 的導演新片是勢在必行的，不過關於細節

  方面仍都尚未有近一步的消息。而 Netflix 雖然釋出善意想要替這部電影出資製作，但

  Ryan Gosling 對於 Netflix 開的條件似乎有所猶豫。回頭看《遺落流域》，當初這部電

  影即是以 35 mm 的膠卷拍攝，不難看出 Ryan Gosling 對於以底片拍攝的堅持，這都有

  可能成為了最終他回絕 Netflix 的原因。然而若資金不到位，或許 Ryan Gosling 仍會

  點頭妥協與 Netflix 合作。


  Netflix 今年才在威尼斯影展也交出了漂亮的成績單，包括 Alfonso Cuarón 的《羅馬

  》和 Coen 兄弟的《西部老巴的故事》兩部電影分別拿下了最大獎「金獅獎」以及「最佳

  劇本獎」，目前看來兩部電影也都極可能衝擊明年的奧斯卡金像獎。雖然 Netflix 總是

  在電影業界內爭議不斷，但也可以清楚的他見在這些年間他們已經不斷的提升了自己在於

  影壇內的地位，而 Ryan Gosling 有沒有可能也開啟與他們的合作，讓我們拭目以待。


  --'
