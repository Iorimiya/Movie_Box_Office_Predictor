url: https://www.ptt.cc/bbs/movie/M.1575817284.A.B65.html
title: '[情報] 劇場版動畫《妄想學生會》第二部制作確定'
content: '劇場版動畫《妄想學生會》第二部制作確定！2020年7月日本上映


  時間：2019-12-06 11:36:29 來源：官方 作者：3DM編譯 編輯：SkyHY


  根據最新消息，官方已經宣布制作劇場版動畫《妄想學生會》第二部，該劇場版動畫將於

  2020年7月10日在日本上映，以下為官方公開的相關細節。


  官方推特截圖：




  官方預告圖欣賞：





  據悉，《妄想學生會》原先是由日本漫畫家氏家ト全作畫的一部以高中學生會為題材的四

  格漫畫。這部漫畫起初在講談社旗下的漫畫雜志《MAGAZINE SPECIAL》上連載 ，隨後移

  籍到同社的《周刊少年Magazine》上繼續連載。


  《妄想學生會》的故事舞台和作者的代表作《妹妹思春期》相同，均將背景設定在男女學

  生數量比為28:524的櫻才學園。這部作品以青春期的少年少女們為主角，為漫迷們帶來很

  多搞笑的內容。雖然在漫畫中有不少暗示性的言語，但是從未出現過露骨的情色畫面，這

  也算是作者的一大特色。


  目前，官方已經宣布制作劇場版動畫《妄想學生會》第2彈，該劇場版動畫將於2020年7月

  10日在日本上映，敬請期待，感興趣的玩家可以點擊此處查看官網。




  --'
