title: '[好雷] 馬奎斯如何成為馬奎斯'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  2024台北文學季‧閱影展以西語藝術為主題，不但選取包括《再見哥雅：卡葉爾與布紐爾

  的最後巡禮》在內與電影大師布紐爾有關的電影，也收錄與逝世10週年的諾貝爾文學家馬

  奎斯有關的作品。從文學的魔幻寫實，到電影的超現實，深入探索不同藝術形式的美。



  馬奎斯是拉丁美洲魔幻現實主義的代表，也是諾貝爾文學獎得主之一。本片記敘馬奎斯的

  人生與工作，以及他對拉丁美洲的重大意義。



  電影從馬奎斯於哥倫比亞阿拉卡塔卡出生開始述說，除了訪談他的在世親人之外，也以馬

  奎斯的傳記作者口述為主，從最詳細、最直接的角度了解20世界最有影響力的作家。馬奎

  斯的父母在他小時候帶著幾個孩子離開原居住地，卻將馬奎斯留在祖父母身邊，傳記作者

  認為這段經歷對他未來的寫作與人生肯定也造成很大的影響。大家對馬奎斯的認識可能來

  自《百年孤寂》，但作者本人自己最鍾愛的卻是《沒有人寫信給上校》。這本中篇小說講

  述的是他祖父的真實經歷，或許正是由於與祖父母相處的年月在他生命中扮演非常重要的

  角色，這部馬奎斯心中最得意的作品才得以問世。



  魔幻寫實主義最早出現是用來描述畫家，因為他們將幻想與超現實的內容融合在傳統的寫

  實主義裡。到了20世紀，不少拉丁美洲作家開始以文字創作出魔幻寫實的世界，而馬奎斯

  也是其中的代表作家之一。在此寫作風格出現之前，只要講到小說，讀者就知道角色、情

  節與敘事都是虛構的，但魔幻寫實的故事卻是奠基在現實，而又憑藉作者的文筆，將故事

  中的世界描寫為反覆無常或荒誕怪異，虛虛實實、實實虛虛，讓人分不清真假的同時，又

  能享受故事所帶給讀者的魅力。獲頒諾貝爾文學獎的馬奎斯也認為，唯有持續筆耕不輟，

  才能確實知道自己存在世上。



  除了撰寫魔幻寫實主義的小說之外，長年擔任記者的馬奎斯也擅長報導文學。在報紙還興

  盛的年代，他靠著在各大報社投稿、工作與撰寫專欄，奠定自己的文筆。在《觀察家報》

  擔任記者的歲月，不僅給予馬奎斯旅外的經驗，也讓他接觸到政治的世界。報導文學不只

  是馬奎斯一生的熱愛，也是他所認定的志業，不論是受雇於人擔任編輯，抑或是與理念相

  同的朋友共同主導的報紙或雜誌社，堅持雇用沒有經驗的新鮮人，一步一步帶領他們進入

  報導文學的世界，都是新聞界不可多得的人才。



  講到政治，不得不提馬奎斯最具爭議性的朋友：卡斯楚。《馬奎斯如何成為馬奎斯》這部

  紀錄片裡，也毫不避諱地忠實呈現兩人的友情，甚至提到當時若有文人入獄，只要馬奎斯

  向卡斯楚美言幾句，很快就會獲得釋放。即便馬奎斯有自己堅定的政治立場，甚至也曾讓

  自己陷入無法入境特定國家的境地，但他對於政治與文學的分際一直分得很清楚，也知道

  自己的文字擁有左右政治與社會的能力，所以在使用上也很小心。不過，紀錄片裡也平衡

  報導，透過前美國總統柯林頓對馬奎斯文字的熱愛，以及他所提及兩人的些許互動，說明

  即使意識形態立場不同，文學還是能夠消弭歧見。



  就像聚焦台灣作家吳晟的《他還年輕》，講述文學的紀錄片經常採用讓影中人朗讀主角作

  品的方式，帶領觀眾進入其文字的世界，而《馬奎斯如何成為馬奎斯》也不例外。除了馬

  奎斯與柯林頓生前的朗讀與受訪影像之外，也邀請他仍在世的家人與傳記作者選取具代表

  性或自己特別喜歡的段落進行分享。透過故事回顧、口述歷史與文字段落的穿插，不管原

  本對馬奎斯的了解多寡為何，觀影結束後一定也會想要拿起一、兩本他的作品來拜讀一番

  ，感受魔幻寫實、政治與文學交織的魔力。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
