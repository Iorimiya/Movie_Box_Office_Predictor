title: '[好雷] 電影版殘念生物事典'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  改編自日本2016年出版的童書《殘念生物事典》的同名電影版，是一部大人、小孩都能樂

  在其中的動畫作品。日本在去年暑假上映，台灣則在清明假期前推出中文配音版，邀請大

  小朋友一起進電影院學習動物冷知識。



  在不斷變化的地球環境中，生物們陸續達到進化。這回，殘念生物們躍上大銀幕，將以擁

  有豐沛自然風景、棲息許多生物的南極、澳洲與日本長野縣為舞台，描繪一隻阿德利企鵝

  ，試圖將迷路的皇帝企鵝帶回家人身邊。



  一隻自認為最強的野兔，和膽小的黑熊一同漫無目的地在森林徘徊，直到遇見從來沒有看

  過的生物。



  既然是動畫，聲優就成為非常重要的亮點。澳洲篇的主角──無尾熊勒羅伊──由現年31

  歲的花江夏樹配音，他以擔綱機器人戰爭動畫《ALDNOAH.ZERO》的主角界塚伊奈帆、獵奇

  戰鬥奇幻冒險動畫《鬼滅之刃》系列的主角炭治郎與校園音樂動畫《高校星歌劇》的主角

  星谷悠太聞名，簡直是「主角代言人」，而且各種類型的作品他都能駕馭。這次為有點呆

  萌的無尾熊配音，一樣能讓角色發揮魅力。



  日本篇的日本兔則是由演員內田真禮聲演，她曾經演出過特攝劇《非公認戰隊秋葉原連者

  》、為古典奇幻異世界動畫《帶著智慧型手機闖蕩異世界。》、校園魔法奇幻冒險動畫《

  魔法科高中的劣等生》配音，並擔綱驚悚冒險推理動畫《約定的夢幻島》的主角。對於熟

  悉其作品的影迷來說，一聽到內田真禮的聲音就知道，日本兔「兔雄」即將踏上一場成為

  英雄的冒險旅程。



  至於南極篇的眾多企鵝，則完全都是由導演之一的內山勇士一「口」包辦。在原作改編的

  電視動畫裡，這種大叔式的閒聊是《殘念生物事典》的精髓。雖說既跳tone又違和，但聽

  著可愛的企鵝們用世故的人類口氣與語調談著自己的日常，也別有一番風味。



  《電影版殘念生物事典》以劇場的方式呈現，雖然不是一個完整的故事，但宛如三幕喜劇

  一般，透過擔任主持人的鼴鼠父女的串場，帶出三篇不同的故事。觀眾在吸收新知的同時

  ，不會由於資訊量太過密集而搞混或無法消化，每則故事之間也有些許時間稍微沉澱，整

  理好心情準備邁向下一段冒險，算是極為用心的銜接與處理手法，而不會給人只是將三篇

  故事串連在一起的感覺。三則故事的畫風也不甚相同，從聲優到作畫，整體氛圍上都賦予

  故事不同的感受。



  雖說原著是童書，但改編為電視動畫時，分類為少年向與幽默搞笑類，是相當ㄎ一ㄤ的一

  部動畫。第一季的電視動畫共有25集，每集5分鐘，是能夠隨時看上一集的極短篇小品。

  電影版在南極篇保留與電視動畫相同的氛圍與幽默感，但日本篇與澳洲篇則充滿小朋友可

  以理解的笑點，同時滿足大人與小孩觀看《殘念生物事典》時的樂趣。觀影時如果身邊有

  不少小朋友，不妨觀察一下，大人與小朋友的笑點真的很不一樣呢。



  《殘念生物事典》最適合小朋友觀看的地方在於，裡面收錄很多教科書上不會提到的生物

  冷知識，主要以動物為主，偶爾穿插一點點植物的冷知識。雖然這當中許多冷知識冷門到

  無用的地步，多認識一些動物畢竟百利而無一害。《電影版殘念生物事典》介紹的知識基

  本上都是電視動畫所沒有收錄的，不過，三篇故事中都各提到一些過去介紹過的知識，像

  是：袋熊的便便是方形的、皇帝企鵝的爸爸在媽媽出外覓食的兩個月期間負責孵蛋且不會

  進食、無尾熊因為要分解尤加利葉的毒素消耗體力所以必須睡很久等等。就像是上自然課

  一樣，多次複習才不會忘記。



  由於《殘念生物事典》所介紹的動物知識多半為讓人意想不到的可愛秘辛，而且通常都有

  點「可惜」，因此，才被稱為「殘念」。但是，整個系列的核心宗旨在於告訴讀者與觀眾

  「就算殘念也沒有關係」。生物在演化的過程中可能變得有點怪異，甚至為了生存下去而

  變得有點「殘念」，但誰都不知道幾百年後，這些特徵會不會成為該物種成功存活的關鍵

  。透過觀看《殘念生物事典》，我們得以從詼諧幽默的角度看待並認識世界的多樣物種。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
