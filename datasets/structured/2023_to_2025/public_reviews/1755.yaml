title: '[新聞] <電影版殘念生物事典>導演自爆人類殘念點'
content: '新聞網址：



  日本暢銷突破450萬冊，可說是小朋友人手一本的超人氣童書《殘念生物事典》，這回以

  《電影版殘念生物事典》登上大銀幕，即將在3月31日以中文配音版在台歡樂上映。本片

  由《角落小夥伴電影版》、《衝吧烈子》動畫公司「Fanworks」精心打造，將教科書學不

  到的冷門生物知識，以三篇全新故事登場。選定擁有豐沛自然資源，同時又存活許多「殘

  念生物」的地區，獻上不只能讓小朋友看得開心，大人們也可以看得超有感的溫暖故事！

  有趣的是，不只電影中的動物們很殘念，劇組也自爆「人類」有更多不遑多讓的殘念點，

  讓導演們深有所感地將自己熬夜、忘記時間、看不懂字跡等殘念祕密大公開！





  《電影版殘念生物事典》透過澳大利亞、南極、日本三個地區的故事所組成，並集結當地

  無尾熊、阿德利企鵝、日本兔三大明星物種，作為各個篇章的主角。有別於過去多會採用

  正面形象來描繪生物，本片則反向操作，透過有些可惜、有些小缺點的「殘念」角度呈現

  ，不僅不會讓人失望，反而更加貼近大眾與動物的距離，加深對生物知識的親近感。三篇

  故事的製作團隊，不僅參考研究資料，更親自走訪，甚至透露身邊的小朋友也是靈感來源

  ！不僅如此，三位導演更在訪談中大聊自己也是「殘念生物」的秘辛！



  澳大利亞篇的導演奈奧米岩田就表示：「我常在半夜要睡覺時靈光乍現，趕快把想法寫下

  來再去睡覺，但隔天起床後，卻一個字都看不懂。」爆料自己在創作靈感上也是相當殘念

  。負責日本篇的由水桂導演則分享，他觀察到人所說出的話，會和記憶裡有所落差，特別

  是「日期」的部分，他透露：「大家說出『原來是今天』的次數，遠比想像中還要多喔。

  」而南極篇導演內山勇士，更對熬夜的殘念之處有感而發：「我每次都忍不住熬夜，雖然

  常常會想『為了健康著想，我不可以繼續熬夜！』而盡可能培養早起習慣，而且起床時感

  受到陽光，都讓我不禁感覺真美好，只是一個禮拜過去，我又被打回原狀了！」他接著自

  爆：「我甚至不是工作到天亮，而是看YouTube一整晚呢！」





  看似專為小朋友打造的《電影版殘念生物事典》，其實製作團隊在描述生物知識之餘，也

  賦予許多成長與生存的意義在電影當中，保證讓大人們看了超級有感！舉例來說，澳大利

  亞篇以無尾熊「勒羅伊」離開媽媽，踏上尋找屬於自己的「家園樹」為主軸，對離開舒適

  圈而碰到的一連串冒險與威脅，都是為生存而努力的象徵，向觀眾們闡述不用勉強自己，

  只要活下來就已經是超棒的事情！導演內山勇士自導自編的南極篇則不走溫馨路線，而是

  加入大量日式「漫才」元素，看三隻企鵝一邊吐槽，一邊幫助皇帝企鵝找到回家的路，還

  用Instagram發美照變網紅，笑料百出的安排，讓其他篇的導演大讚：「第一個鏡頭就像

  是突然出拳般讓人印象超深刻！」日本篇則以親子關係為核心，導演也在製作時，想像跟

  家人一起觀賞的感覺，並透過森林裡的不同物種，畫出每個家庭對成長看法的差異。尤其

  本篇特別在生物習性上增添成長意義，希望觀眾在觀賞時，可以多加注意主角「兔雄」在

  故事裡前後的差別。



  本片雖然大量出現殘念元素，但全片核心始終都在告訴觀眾：「就算殘念也沒關係」，每

  一種生物都有其存在意義，而擔任該系列監修的今泉忠明則表示：「有很多有點殘念的生

  物，會讓你無意間笑出聲。不進化也沒關係，有點怪異也沒關係，每個生物都正努力存活

  著。」希望不管小朋友、父母或是每一個人，都有機會進戲院一窺生物們的可愛小秘辛，

  並從中獲得滿滿能量。



  這部暢銷童書全新故事登上大銀幕的《電影版殘念生物事典》，即將在3月31日以中文配

  音版在台歡樂上映。本片描述在不斷變化的地球環境中，生物們陸續達到進化。不過進化

  的結果，卻讓牠們成為有點缺陷的生物…。這回，殘念生物們躍上大銀幕，將以擁有豐沛

  自然風景、棲息許多生物的澳大利亞、南極與日本長野縣為舞台，描繪一隻被寵壞的無尾

  熊，踏上尋找屬於自己的尤加利樹之旅，並在途中認識陪伴牠成長的夥伴。三隻不同品種

  的企鵝好友們齊聚，試圖幫助迷路的皇帝企鵝找到回家的路。一隻自認為最強的日本兔，

  偷偷跑出去卻意外迷路，當牠在森林徘徊找尋回家之路時，竟遇見自己從未看過的生物。

  三個地區，三種不同的生物，讓大小朋友們一同進入牠們的奇妙世界吧！



