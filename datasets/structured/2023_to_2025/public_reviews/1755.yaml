url: https://www.ptt.cc/bbs/movie/M.1679922540.A.A9C.html
title: '[新聞] 夢幻聲優中文獻聲【電影版殘念生物事典】'
content: '新聞網址：



  曾改編為動畫、迷你電視劇的日本暢銷童書《殘念生物事典》，接續推出以全新故事登上

  大銀幕的《電影版殘念生物事典》，即將在本週五（3/31）以中文配音版在台歡樂獻映！

  這次幫三個動物主角配音的中文版聲優老師，可說是童年夢幻組合，邀請到曾為《名偵探

  柯南》、《死亡筆記本》、《七龍珠超》配音的李景唐老師，以及《蠟筆小新》、《我們

  這一家》、《新哆啦A夢》的林美秀老師擔綱配音。此外，本片配樂由擔任過多部好萊塢

  電影作曲家的鋒山亘創作，並集結各國樂器好手替電影演奏，製作人更欽點日本創作歌手

  秦基博為本片獻唱主題曲，讓整部電影宛如一場豪華的聲音饗宴！





  《電影版殘念生物事典》這回以中文配音版登上台灣大銀幕，讓台灣觀眾更能貼近殘念生

  物的世界當中，一同探索這些生物們的可愛祕辛。為此，特別邀請到曾幫《名偵探柯南》

  、《死亡筆記本》、《七龍珠改》配音的李景唐老師，以及曾為《蠟筆小新》、《我們這

  一家》、《新哆啦A夢》配音的林美秀老師，詮釋片中的三個動物主角。聲演「澳大利亞

  篇」無尾熊與「南極篇」阿德利企鵝的李景唐老師，對獻聲本片分享道：「這部動畫電影

  的畫風不同於一般動畫，也是我看過首部以動物間有趣對話，來敘述動物習性與演化的動

  畫電影。」談及配音時的有趣幕後過程，他也透露：「為了其中一場眾多日本狗獾寶寶們

  的可愛反應，我們還舉辦配音員徵選，聲音不可愛的一律淘汰（殘念）。」且由於製作時

  沒有唱歌片段的樂譜腳本，老師們還特別請專業人員協助，編寫了「遺憾三重奏」的三部

  合音編曲，讓中文版的音樂也能精彩萬分呈現。而為「日本篇」主角「兔雄」獻聲的林美

  秀老師，回憶起配音過程也表示本片是非常特別的作品，更向觀眾推薦：「這是一部充滿

  愛的作品，希望大家在欣賞電影的時候，能細細品味故事中的很多細節。導演和動畫師以

  及整個製作團隊都非常用心，有機會請一定要到電影院觀看喔！」





  不只配音卡司亮眼，《電影版殘念生物事典》的配樂也是眾星雲集，請來過去曾參與《雷

  神索爾3：諸神黃昏》（Thor：Ragnarol）、《尖叫旅社3：怪獸假期》（Hotel

  Transylvania 3: Summer Vacation）、《樂高玩電影2》（The Lego Movie 2: The

  Second Part）等多部好萊塢電影與遊戲音樂製作的作曲家鋒山亘創作，這也是他首度參

  與日本動畫電影。在製作澳大利亞篇時，為了以「好萊塢電影」般的震撼感來展現當地景

  觀的自然壯碩，他在一幕洞穴場景中，使用到澳大利亞原住民的特有樂器「迪吉里杜管」

  ，試圖創造召喚祖先與大地吶喊的聲音，也找來居住在紐約、日本、香港等各地區的優秀

  獨奏音樂家演奏，讓鋒山亘自己也讚嘆：「我們透過這麼豪華的表演陣容，將音樂發揮到

  了極致呢！」而本片的日本篇中，則以完全不同的可愛風格示人，鋒山亘透露：「關於兔

  崎前輩的主題曲，不知道為什麼有種昭和的衝動感被勾出，有個像是前輩又十分不可靠的

  角色滿好的。對於這樣的兔崎前輩，我幻想出『昭和感的隨和小哥』並以此形象來創作。

  」



  為了打造親近又充滿獨特色彩的氛圍，在音樂演奏的陣容上也是別有用心，集結世界口琴

  冠軍、史提夫汪達的吉他手等樂手，這也讓他分享：「由旅居香港的世界口琴冠軍Leo演

  奏出懷舊、甜美又略帶憂傷的口琴部分，尺八的美妙音色是Zac演奏，吉他方面則由中村

  楊平彈奏出『溫暖柔和且100%充滿愛』的滑順音樂，這樣的卡司集結在一起，讓我真的太

  興奮了！」而本片主題曲，更由製作人欽點日本知名創作歌手秦基博演唱，為電影創作出

  全新歌曲〈碳酸飲料〉，輕快又清新的動人獻唱，讓該曲成為這個春天的必聽歌單，也讓

  製作人對主題曲大讚：「只有秦基博可以做到！」



  這部暢銷童書全新故事登上大銀幕的《電影版殘念生物事典》，即將在本週五（3/31）以

  中文配音版在台歡樂獻映。本片描述在不斷變化的地球環境中，生物們陸續達到進化。不

  過進化的結果，卻讓牠們成為有點缺陷的生物…。這回，殘念生物們躍上大銀幕，將以擁

  有豐沛自然風景、棲息許多生物的澳大利亞、南極與日本長野縣為舞台，描繪一隻被寵壞

  的無尾熊，踏上尋找屬於自己的尤加利樹之旅，並在途中認識陪伴牠成長的夥伴。三隻不

  同品種的企鵝好友們齊聚，試圖幫助迷路的皇帝企鵝找到回家的路。一隻自認為最強的日

  本兔，偷偷跑出去卻意外迷路，當牠在森林徘徊找尋回家之路時，竟遇見自己從未看過的

  生物。三個地區，三種不同的生物，讓大小朋友們一同進入牠們的奇妙世界吧！



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
