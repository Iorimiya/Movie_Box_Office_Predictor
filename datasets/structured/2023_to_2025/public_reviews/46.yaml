url: https://www.ptt.cc/bbs/movie/M.1762013892.A.ABA.html
title: '[好雷] 睡覺的笨蛋，漫改但有些許不同的好電影'
content: '《睡覺的笨蛋》是一部漫改真人電影，原作是石黑正數，


  比較有名的作品是《女僕咖啡廳》(日文直譯:即使如此小鎮依然轉動)跟《天國大魔境》


  這位老師的作品一直帶有批判色彩，也常常在結尾加入超展開


  用時下流行的說法就是歐亨利式結尾。



  說多了，原作是我很喜歡的短篇故事，漫畫就一本單行本的量


  跟老師其他作品不同，這部幾乎沒有加入他常用的外星人、怪異等超自然等元素


  就用幾個看起來很詭異、很不尋常的人物特性


  去表達一個幾乎所有人都經歷過的青春迷茫


  這也是為什麼我非常喜歡這部作品



  但看完電影發現跟我期待的不太一樣，雖然一樣發人省思


  但我並沒有辦法很直覺地說出到底是什麼讓我期待不符


  於是我試著寫下這篇觀後感，企圖在這樣的回顧裡，挖掘我內心深處的一些想法


  ~~~以下內容有雷，有打算去看這部電影但還沒去看的人請慎讀。~~~
















  ~~~防雷結束，正文開始~~~


  對我來說最大的不同，是角色性格，差異最大的就是學姐


  漫畫裡的學姐是一個標竿型的角色，在所有人對生活迷茫時


  她就像是一座海邊的燈塔，將大家拉住，並輸出一些她心裡正確的理論


  雖然她的想法不一定正確、甚至有些憤世忌俗


  但在原作裡她是最明確的角色，宛如作者的代言人


  常常藉由她的口去說出這作品想要表達的東西


  而電影雖然一樣把學姐安排成，為了夢想而努力生活的自稱音樂人


  但卻是一個非常貼心、甚至想帶著大家一起邁向更美好未來的類媽媽型角色



  電影中很多跟原作不同的改編能看出一二：


  像是演出後只拿自己需要的部分報酬，還拿這筆錢去買柚實要的電子鍋


  在回家路上偶遇跟怪人晚餐後的柚實，貼心地拉著柚實離開


  在跟製作人見面後，怯生生地跟製作人說他們是一個樂隊，


  而不單單是瑠夏跟她快樂的夥伴



  這些情節有些是劇情安排：


  漫畫裡是樂團的人通知學姐去跟製作人見面，只打算捧學姐出道這件事


  樂團的人大概也都知道，自然沒有整個樂團去跟製作人見面的橋段



  這些情節之所以被我拎出來，是這些舉動跟漫畫裡的學姐行為大不相同：


  貼心拉著柚實離開時，會發現學姐有些膽怯


  怯生生跟製作人說她們是一個樂團那段，漫畫裡的學姐會大聲說出她認為對的事


  但電影裡的學姐則是先考慮周遭的人、再考慮當下的環境氛圍才會體面的發言



  這樣的改變我無法斷言是好還是不好


  或許我原本是想在電影院裡，重新感受一次學姐的生活態度


  但在電影裡我卻看到一個跟所有人一樣迷惘的學姐


  漫畫裡學姐的迷惘，是聽完製作人想要捧她出道才開始




  就像一開始柚實做的炸蝦尾天丼，漫畫裡的學姐聽到蝦尾的真相後


  是老老實實吃完後才對著柚實大吼「混蛋 開什麼玩笑啊！」


  電影裡則是聽到真相立刻一臉嚴肅地對柚實說「你在想什麼啊？」


  可以說，電影裡的學姐骨子裡就是個正常人，


  而不像漫畫裡那樣渾身帶刺、無所畏懼。


  在看漫畫時我會將自己帶入柚實的角色，去接收學姐的文化輸出


  但在看電影時，我卻是跟著學姐一起迷茫。



  再來說說我認為改編不太好的地方：


  1.在提到實現夢想的難度時，學姐打了個比方：






  這堵牆在漫畫裡出現了幾次，倒數第二次出現是製作人說了要捧學姐出道


  回到宿舍後，在學姐的想像裡，那堵牆在這樣的幫助下，很輕易就穿了過去


  最後一次出現那堵牆，是學姐搬進新家時拉開大門，就透過那扇門穿過了那堵牆


  這堵牆是很重要的暗示，但電影似乎沒有太多強調，我覺得有點可惜



  2.在田口道完歉後，柚實在停車場揮了田口一拳




  這段在原作裡是柚實搭田口車時越想越不爽，在田口開車時打了他


  車子因此撞到護欄，才會有那句「還好navy子沒有受傷」


  不知道是不是改編時沒處裡好，這段我看電影時有出戲。



  3.


  電影沒有明確說明少女A的出道計畫，只有簡單帶過，


  對原作黨可能沒有影響，但純電影黨可能不太理解，


  這設定讓舞台那幕強化了很多渲染力：


  少女A的初舞台最後，學姐拿著少女A安可不該帶著的吉他走上舞台


  在製作人的疑惑中，大聲宣告：作詞：在下，鯨川瑠夏！


  同時也宣告著她不願意在繼續當被操作的少女A。


  甚至最後跳下舞台逃離，看起來是那麼水到渠成。



  這些小細節其實不影響整部電影觀看，改編好的地方其實也很多：


  像是把柚實害怕生魚片的理由換掉，去對應DVD店怪人前輩的晚餐。


  navy子準備停止營運，知道這件事的田口好友重新坐回車上。


  樂團的三人在少女A的初舞台登場，


  讓最後的《ネムルバカ》不是只有吉他聲跟學姐的歌聲，


  更強化了樂團間的羈絆。



  做為一個原作黨，我是帶著濾鏡跟期待去看這部電影


  這讓我覺得有點可惜，如果我能更純粹地看完這部電影


  我相信一定能給我不同於漫畫的感觸及想法，而不是像現在這樣


  一點一點去比較著這部電影跟這個故事。



  最後，雖然臺灣上映的影院不多、時段也少


  3月在日本上映的電影也或許早就有線上串流


  我還是推薦去電影院看看這部片


  對我來說，這是一部發人省思的好電影


  --'
