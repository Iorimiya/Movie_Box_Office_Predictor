url: https://www.ptt.cc/bbs/movie/M.1761968087.A.FDB.html
title: '[好雷] 《睡覺的笨蛋》-不是說，越流行越悲傷? '
content: "平祐奈與乃木坂46的久保史緒里飾演\n\n剛上院線\n\n熱映中~\n\n\n雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\
  \  (網誌的原文，含圖片，與備註連結)\n\n\n\n\n看太多電影看到沒有感覺，有時電影本身沒有太特別，但看完卻讓人心頭一皺。\n\n\n《睡覺的笨蛋》漫畫改編（個人對動漫是真的不太熟），但對日本的觀察，日本人經歷二\n\
  戰軍國法西斯，到被投下核彈戰敗創傷與而後的經濟泡沫，成為極度資本化的國家，日本\n民族進化成另一種相當細微的情感狀態，顯示在某種日文語境之中，例如漫才、許多怪癖\n\
  ，變態，如此過於兩極化的口味：愛好者會十分投入，但有時候，會覺得太過over。\n\n\n只是一種日式情境，也致使 《睡覺的笨蛋》在大量對話建構的情境，前大半段帶有不著邊\n\
  際的，沒有太多故事推進的生活「鬆」感，同時也產生，電影就這樣無目地的漫遊，可以\n嗎？\n\n\n兩位省吃儉用的女性魯蛇（平祐奈與乃木坂46的久保史緒里飾演），無聊當有趣，（例如\n\
  ：因為太窮，只好將天婦羅丼吃完的蝦尾殼留下來，拼湊成沒有炸蝦的「蝦型」天婦羅丼\n）。女孩玩樂團的音樂夢，談青春夢想，想起早期山下敦弘的無賴電影，或脫力系冷幽默\n\
  ，百無聊賴，渾渾噩噩，反映日本社會現狀，與普遍年輕人出社會狀態，到底只是階段性\n的年輕氣盛的憤怒不滿，或乾脆放棄人生躺平。還是那種純真，其實是人類個體之於集體\n\
  社會的「真實」乍現，本質稍縱即逝隨即被隱藏在表面（例如：路邊無意中看到小女孩在\n跟店家門口的雕像玩耍動作的天真舉動媽媽被制止，大人說著妳在那邊幹什麼 快過來（\n\
  上樓回家））。\n\n\n電影談到，社會上大部分人根本不知道想要什麼，少數有真正想做甚麼的（所謂夢想），\n潛台詞：相對於大眾流行，小眾藝文自嗨同時珍貴的嫌疑。\n\
  \n\n想到佛教的因果論是這樣嗎？就我理解，比較重要的應該是，解釋諸現象皆是 整體世界\n的局部。而「因果」帶有入世解釋單一線性的無可迴返：因為這樣 才會如此。\n\
  \n\n但就輪迴來說，有沒有因果論的意思，並非科學，並非以現狀往回解釋分析（用數據統計\n來分析藝術家的才華）。而是，做了多少，就會回饋 （或報應）多少。\n\n\
  \n以現象解釋，雖電影對於憤怒青年與流行音樂，兩造有些過於二分的邏輯錯誤問題：大眾\n只聽流行，但不聽搖滾；或女主角被唱片公司打造成為隱姓埋名的Pop Idol，但不太相信\n\
  過去玩獨立樂團的歷史在這樣資訊便利的年代不會被知曉，於是片尾唱著看似相對吵鬧的\n樂團歌曲也應該要被粉絲們認同才對，或至少反應不是如此冷淡，過於二元。\n\n\n\
  但不管如何，《睡覺的笨蛋》的「童話」意味，所謂「夢想論」的純真，與自己也想著，\n電影後段出現去聽流行歌手，穿著粉絲T恤的大多數人們的「純真」。\n\n\n好比與以前公司同事或親戚的非功能性的日常對話，一如自己關心的事情\
  \ 永遠不會是別\n人所關心的，不斷的離題 又即刻「填補」的情境。自己也在話題的縫隙中，得以開展（\n存在即是存在自身）。\n\n並非是　望著腳下的深淵，而是就在深淵之中，但在幾秒之後又發現，其實深淵並不存在\n\
  ，如此看似無解的死路，早就是到達 終點的意義。\n\n\n「很好啊」，一如「好」這個符號所揭示的那樣，最終的善。\n\n--\n\n拉特飯 - 以商業力量進入獨立市場\n\
  \n--"
