url: https://www.ptt.cc/bbs/movie/M.1763134197.A.1E6.html
title: '[好雷] 《睡覺的笨蛋》電影心得：心痛爆擊'
content: '簡單分享《睡覺的笨蛋》心得，

  稍微修改後在電影版重發一篇。


  這部是石黑正數漫畫改編的真人電影

  我超喜歡石黑正數作品，

  金髮學姐+黑髮學妹這對組合，

  在女僕咖啡廳、我家的街貓也有登場（雖然個性不同，有不良風格也有廢材風格，

  這幾部都是我心目中的神作，所以自然是很期待這部，

  結果在意想不到的地方被爆擊了。




  整體劇情滿還原，

  剛好做完一集漫畫內容，

  又加上了演唱會的演奏這樣必須電影才能展現的部分，整體我算挺滿意。

  我以往很不喜歡日本電影常有的那種有一搭沒一搭的對話，

  但石黑特別擅長這種日常對話劇情，

  讓這部光日常的平淡橋段就很有趣！



  角色方面，

  鯨井學姐沒有用那個綁兩束的髮型，而是一直放下頭髮，

  我覺得這樣還不錯，畢竟比較貼近印象比較深的那個短髮學姐的造型。


  然而飾演學妹入巢柚實的久保史緒里則已經不只是好看，簡直是漂亮得過頭了！


  原本學妹的形象是更像後來《女僕咖啡廳》的步鳥，感覺有點天然或者說笨笨的，

  適合做出各種笨拙的行為或是吐槽，

  但是這個入巢有點太過漂亮，

  讓有些本來應該逗趣的橋段反而變得比較沒說服力？

  讓整部的搞笑成分降低了不少。


  例如學妹誤以為那個叫田口的同學喜歡自己，以及後來發飆的場景，

  本來應該是挺詼諧的，

  但是換成這種程度的美女來做，

  並不會覺得在搞笑，而是讓我看了有點疑惑到底是不是認真的？

  並不是演得不好，只是太正了所以同樣的行為做起來沒那麼有喜感。

  以往看漫畫真人化電影只嫌角色不夠好看，

  沒想到這次是太好看。


  學姐也是有些時候顯得有點太嬌小聲音太可愛，有點角度限定，

  原本學姐會給我更「我行我素」的印象。



  然後那個田口，

  真人就顯得比較宅比較像舔狗，

  他那個朋友也是由於造型不同所以印象改變了不少，

  原本一看就知道什麼時候是搞笑氣氛，

  真人角色倒是比較捉摸不透他是深藏不露或者在搞笑。

  例如露出變身腰帶時，我會多思考一下他是不是有什麼用意。



  然後是學妹打工的同事那個眼鏡男仲崎，

  從一個自命不凡的自戀男變成一個做頻道的胖子自戀男，

  一樣還是噁男但也發生有趣的微妙變化，

  原本是學妹遇到硬是要炫耀的怪人，但為了蹭飯還是答應了一次邀約，

  但是呢，

  學妹的打工裝扮實在有點好看過頭了，

  這角色原本應該是要呈現那種「自認為是藝術家的小圈圈自嗨」，然後學妹覺得傻眼，

  學妹等級差太多就變得只剩下肥宅在騷擾美女的印象。


  增加戲份的樂團夥伴的部分則是給人的感覺不錯，

  發現只有鯨井被看中，

  平常亂七八糟但還是願意相挺，

  最後雖然落於平凡但還是被音樂觸動。



  然後是重頭戲的演唱會部分，

  樂團自己的演唱還有最後的流行演唱會，

  畢竟有實際演奏加持，感覺還是不錯的。


  雖然做著自己想做的事，

  卻還是會對於未來感到茫然，

  面對才能無法逾越的高牆，曾經充滿無力卻意外找到輕鬆突破的方式，

  然而那是自己想要的方式嗎？


  學姐化名以後遵從公司套路發展，

  演唱會的前段還真的讓我覺得跟之前實際在一些演唱會聽過的歌感覺超像的，

  是廣受大眾歡迎的熟悉感覺，

  但她們想要的，似乎還是當初在地下室那樣彈著吉他吶喊。



  學姐最後吉他聲響起的那一刻，

  我想起了我第一次到現場看的，

  酸欠少女さユり的演唱會。

  其實歌曲風格或造型也不是說有多像，

  但是學姐奮力彈吉他的身影，

  不知怎的就是讓我突然想起當初聽到她在演唱會上聲嘶力竭的彈奏。


  總之明明不是什麼特別好哭的情節，

  卻意外地戳中了我個人的點，

  我都還沒有搞清楚就開始流下淚，

  到後來我竟然在電影院哭到上氣不接下氣，

  一直哭到電影結束眼睛都刺痛到睜不開。



  言而總之，

  這部整體氛圍還是不錯，然後又因為改編真人所以有著有趣的差異。


  --'
