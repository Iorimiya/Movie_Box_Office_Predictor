url: https://www.ptt.cc/bbs/movie/M.1699461203.A.33B.html
title: '[新聞] 賈斯汀隆為【劊樂時光】自主油膩大改造！'
content: '新聞網址：



  聖誕砍殺新片大玩「平行時空」題材，殺人魔就算換了一個時空照樣都要殺起來！即將在

  本週五（11/10）於全台駭人獻映的《劊樂時光》（It’s a Wonderful Knife），導演泰

  勒馬克林泰爾（Tyler Maclntyre）與編劇麥可甘迺迪（Michael Kennedy）不只熱愛砍殺

  電影，同時更是「恐怖片專業戶」賈斯汀隆（Justin Long）的大粉絲，將他譽為飾演本

  片反派人物的「夢幻人選」。賈斯汀隆也十分熱衷於角色外型塑造，自主提出外貌大改造

  ，貼上瓷牙貼片的造型更被網友笑稱：「瓷牙貼片可以拿下最佳配角獎了！」此外，本片

  也找來氣質獨具的珍維多普（Jane Widdop）飾演對抗殺人魔的英勇女主角，原因便是編

  導同是驚悚美劇《黃蜂》（Yellowjackets）劇迷，並被珍維多普在劇中的風采所吸引。

  不只如此，片中飾演「蓋兒阿姨」的凱瑟琳伊莎貝爾（Katharine Isabelle），過去也因

  為演出各種恐怖片獲譽為「尖叫女王」，而她這次演出的角色，更有向《驚聲尖叫》（

  Scream）致敬的小彩蛋，值得觀眾進戲院一探究竟！





  《劊樂時光》找來以經典恐怖片《毛骨悚然》（Jeepers Creepers）一鳴驚人，並曾演過

  《地獄魔咒》（Drag Me to Hell）、《人形海象》（Tusk）、《宿劫》（Barbarian）等

  片的「恐怖片專業戶」賈斯汀隆，飾演片中最惱人的反派角色，不僅在片中飾地產掮客，

  等來到平行時空之後，竟然變成當地市長，以油膩的政客嘴臉讓人印象深刻。同為賈斯汀

  隆鐵粉的導演與編劇，認為他絕對是該角色的「夢幻人選」。編劇麥可甘迺迪分享：「我

  已經是他的粉絲好多年了，我愛《人形海象》那些電影，當我們在尋找聖誕節大反派時，

  以許多愛作秀的政治人物為範本，有一點嬰兒潮世代的油膩感，而他可以傳遞出這種特質

  。」



  非常幸運地，由於本片在溫哥華取景拍攝，賈斯汀隆當時剛好就在溫哥華工作，因此有機

  會接演本片。他為了演出該角色，甚至在口音上下足功夫，也十分熱衷於角色外型的改造

  ，更自主提出把頭髮染成棕黃色的想法，甚至要求要戴上角膜變色片與瓷牙貼片，讓許多

  搶先在多倫多暗夜電影節（Toronto After Dark Film Festival）觀賞過的觀眾，都對他

  的大改造印象深刻，甚至開玩笑稱讚：「賈斯汀隆的瓷牙貼片，可以拿下最佳配角獎了！

  」






  入選多個恐怖奇幻影展的《劊樂時光》，演員們都是恐怖片熟面孔，除了賈斯汀隆之外，

  飾演拯救小鎮關鍵人物的女主角珍維多普，也因為在驚悚美劇《黃蜂》中的精彩演出，吸

  引了身為該劇劇迷的導演與編劇。導演泰勒馬克林泰爾對此分享：「我愛《黃蜂》的演員

  陣容、愛這部作品，維多普演的角色很有喜感，但同時又富有內涵。」因此便向她提出邀

  約，而她為試鏡所朗讀劇本的錄音，更是震驚了全劇組，讓所有人一致通過要由她來領銜

  主演！此外，本片還能見到曾因《女狼傳奇》（Ginger Snaps）、《愛殺瑪莉》（

  American Mary）、《人皮客棧2》（See no evil 2）等恐怖片而獲譽為「尖叫女王」的

  凱薩琳伊莎貝爾參與演出。值得一提的是，凱薩琳這回飾演女主角的阿姨「蓋兒皮斯考克

  」（Gale Prescott），更是在向《驚聲尖叫》系列中的兩位重要角色「蓋兒魏德斯」（

  Gale Weathers）和「席妮皮斯考克」（Sidney Prescott）致敬，足見本片從主題到小細

  節，都是滿滿的恐怖片元素，值得觀眾進戲院一探究竟！



  這部血腥惡搞聖誕佳節的驚悚新片《劊樂時光》，即將在本週五（11/10）全台駭人獻映

  。本片劇情描述一年前的聖誕夜，在薇妮（珍維多普飾演）居住的小鎮，出現一名血腥連

  環殺人魔。薇妮在追趕過程中，眼明手快地反擊對方，成功解救了小鎮居民。不過事發後

  的這一年當中，歷經好友過世、大學落榜、男友出軌，薇妮的生活既不順遂也不快樂，讓

  她不禁希望自己從未出生在這世上。沒想到，她卻一語成讖地來到平行世界，不過情況非

  但沒有好轉，反而更像噩夢降臨，因為當時的連環殺人魔竟然重返這座小鎮…。殺戮危機

  一觸即發，薇妮又該如何智取殺人魔，再度解救小鎮居民呢？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。


  --'
