url: https://www.ptt.cc/bbs/movie/M.1699023376.A.D53.html
title: '[新聞] 【劊樂時光】驚見月光騎士變殺人魔？！'
content: '新聞網址：



  由《窒友梅根》（M3GAN）製作群，聯手《姐姐妹妹殺起來》（Tragedy Girls）導演暨《

  換人殺砍砍》（Freaky）編劇，共同推出的驚悚新片《劊樂時光》（It’s a Wonderful

  Knife），即將在11月10日於全台駭人獻映。身為砍殺電影與佳節電影狂熱粉絲的導演泰

  勒馬克林泰爾（Tyler Maclntyre）與編劇麥可甘迺迪（Michael Kennedy），這回將以鮮

  血、凶器、連環殺手，結合時下最夯的平行時空元素，打造充滿惡趣味的血腥聖誕節。片

  中的殺手造型更是別出心裁，向經典《驚聲尖叫》（Scream）看齊，致力打造出「天使版

  鬼面殺手」，而該造型隨著海報釋出，全白披風掛袍的模樣，也引發網友熱議以為是「月

  光騎士」變身連環殺人魔。滿滿的血腥與驚悚元素，更讓本片強勢入選多個恐怖奇幻影展

  ，獲得觀眾滿載好評！





  血腥爽度滿點的最新聖誕砍殺電影《劊樂時光》，是編劇麥可甘迺迪繼《換人殺砍砍》之

  後，以經典聖誕電影《風雲人物》（It''s a Wonderful Life）作為創作靈感，融合拿手

  的砍殺類型，所為觀眾帶來新鮮又驚悚的恐怖力作。他興奮地表示：「我愛聖誕電影，也

  愛砍殺恐怖片，我一直想將兩者結合；對我來說沒有什麼比用鮮血、內臟和騷亂，致敬經

  典電影還要更好的方式了！」他找來同為砍殺電影與佳節電影狂熱粉的泰勒馬克林泰爾導

  演，兩人合體打造出這部瘋狂又血腥的作品，甚至利用可愛點心「拐杖糖」惡搞成爆頭殺

  人凶器，把聖誕老人的壞壞名單升級為「壞壞殺人名單」，更將聖誕節代表物之一的「天

  使」，打造成驚悚指數破表的連環殺人魔。泰勒導演也向觀眾推薦：「本片將有巧妙的毛

  骨悚然轉折，也會帶來心靈上的震撼，《劊樂時光》遵循既黑暗又令人振奮的相同傳統，

  適合那些圍坐在聖誕樹旁觀賞《驚聲尖叫》和《黑色聖誕節》（Black Christmas）的人

  ！」





  媲美聖誕殺人夜版《驚聲尖叫》的《劊樂時光》，也向《驚聲尖叫》看齊，尤其對殺手的

  造型別出心裁，致力打造出「天使版鬼面殺手」。不過初期設計的幾個造型，都因為「太

  漂亮」而遭導演打槍，因此轉而參考許多聖誕樹頂上的天使裝飾。對於這部分的設計過程

  ，導演也分享：「我們想要比『鬼面殺手』更大一點的東西，但仍要保有天使的感覺，要

  有連帽掛袍的輪廓，希望臉部可以是非常空白的樣子，所以參考很多那些常常看起來毛骨

  悚然的聖誕樹頂天使裝飾，嘗試能夠接近那種獵奇形象。」而最終完成的全白披風掛袍的

  殺手造型，在隨著片商釋出的中文海報當中，也引發網友熱議，以為是「月光騎士」變身

  連環殺人魔！



  本片充滿各式各樣血腥又驚悚的元素，也因此強勢入選加州超越奇幻影展、特柳賴德恐怖

  影展、多倫多暗夜恐怖電影節，並在放映後獲得一面倒的好評：「我沒有很愛聖誕節，但

  我超愛這個聖誕砍殺片的！」「裡面殺手超讚的！完美！」「引人發笑也引人尖叫！」



  這部血腥惡搞聖誕佳節的驚悚新片《劊樂時光》，即將在11月10日於全台駭人獻映。本片

  劇情描述一年前的聖誕夜，在薇妮（珍維多普飾演）居住的小鎮，出現一名血腥連環殺人

  魔。薇妮在追趕過程中，眼明手快地反擊對方，成功解救了小鎮居民。不過事發後的這一

  年當中，歷經好友過世、大學落榜、男友出軌，薇妮的生活既不順遂也不快樂，讓她不禁

  希望自己從未出生在這世上。沒想到，她卻一語成讖地來到平行世界，不過情況非但沒有

  好轉，反而更像噩夢降臨，因為當時的連環殺人魔竟然重返這座小鎮…。殺戮危機一觸即

  發，薇妮又該如何智取殺人魔，再度解救小鎮居民呢？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
