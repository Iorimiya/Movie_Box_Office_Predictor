title: '[新聞] 恐怖片熟面孔共創《劊樂時光》小彩蛋率先'
content: '新聞網址：


  恐怖片熟面孔共創《劊樂時光》小彩蛋率先揭開


  2023-11-09 自由時報電子報 記者 許世穎 綜合報導


  驚悚片《劊樂時光》導演泰勒馬克林泰爾與編劇麥可甘迺迪不只熱愛砍殺電影，同時更是

  「恐怖片專業戶」賈斯汀隆的大粉絲，將他譽為飾演本片反派人物的「夢幻人選」。賈斯

  汀隆也十分熱衷於角色外型塑造，自主提出外貌大改造，貼上瓷牙貼片的造型更被網友笑

  稱：「瓷牙貼片可以拿下最佳配角獎了！」


  此外，該片也找來氣質獨具的珍維多普飾演對抗殺人魔的英勇女主角，原因便是編導同是

  驚悚美劇《黃蜂》劇迷，並被珍維多普在劇中的風采所吸引。不只如此，片中飾演「蓋兒

  阿姨」的凱瑟琳伊莎貝爾，過去也因為演出各種恐怖片獲譽為「尖叫女王」，而她這次演

  出的角色，更有向《驚聲尖叫》（Scream）致敬的小彩蛋，值得觀眾進戲院一探究竟。

  《劊樂時光》明天（10日）在台上映。


  --'
