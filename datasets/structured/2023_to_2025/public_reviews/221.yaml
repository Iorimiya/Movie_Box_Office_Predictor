url: https://www.ptt.cc/bbs/movie/M.1753757001.A.55F.html
title: '[極好雷]哆啦A夢：大雄的繪畫世界物語心得 '
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n部落格連結\n\n\n\
  \ 實在太好看了....\n\n十幾年來，每年的哆啦a夢電影都進戲院支持\n\n綠之巨人、人魚大海戰、奇跡之島這幾部曾讓我對哆啦a夢的電影感到失望不已\n\n\
  甚至只期待原版的重製...認為在作者過世後已少有人能繼承意志\n\n不過，秘密道具、南極冰天雪地、金銀島、月球探測記\n\n每一部都有自己的有趣之處，也讓我漸漸找回對電影版的信心\n\
  \n反而是重製版這時候碰到了一些停滯不前的狀況\n【動畫心得】電影哆啦A夢：大雄的宇宙小戰爭 2021 - 重複太多次的\"為她人難過\"\n\n我認為由於時空背景的不同，\n\
  \n製作團隊很努力地將原版轉化為現代的情況\n\n可是卻在某些地方，把原作者的巧思改的索然無味\n\n又一再的強調與說教...  雖然一樣精彩，\n\n可是總覺得失去了哆啦a夢那種醍醐味\n\
  \n\n\n\n\n從2023年的理想鄉、2024年的地球交響樂\n\n到今年的大雄的繪畫世界物語\n\n讓我看到了哆啦a夢電影的另個新世界\n\n終於不是重複的說教，也沒有偏離原作者藤子F不二雄的理念\n\
  \n在一個長篇的故事中，所有的夥伴們一起冒險\n\n看了非常感動阿...\n\n\n\n大雄的繪畫世界物語是寺本幸代導演在秘密道具博物館後\n\n經過12年又再次執導哆啦a夢的電影~~\n\
  \n如同秘密道具博物館，或是她之前執導的鐵人兵團或是七人魔法使一樣\n\n我覺得整部電影真的充滿了細膩的表現\n\n還記得以前看藤子老師寫著電影版的說明\n\n\
  他說，故事的完成不是靠藤子F不二雄寫的，甚至有時候他根本還沒構思整體故事，\n\n他在腦海中想著這個故事該怎麼進行時，\n\n他也會同時站在每個角色的立場去想\n\
  \n如果我是大雄，我現在會做甚麼呢？而做這些事情，會導致怎麼樣的情況~~\n\n藤子老師一直用這樣的角色虛擬對話與角色互動，來推進劇情\n\n\n\n而寺本導演的細膩手法，還有角色互動\n\
  \n都讓我再次的感受到哆啦a夢角色的魅力，\n\n甚至感受到藤子老師對於大長篇電影的堅持\n\n\n\n覺得自己畫不好，但努力將自己心意畫出的大雄\n\n犧牲自己拯救同伴的胖虎\n\
  \n總是耍小聰明卻發現事物細節的小夫\n\n體貼，腦筋動得快很會利用道具的靜香\n\n一直陪在大家身邊的哆啦a夢\n\n別忘了，最後神來一筆講評的爸爸\n\n\
  每一個細節，都看的出來導演對於哆啦a夢的理解\n\n與想讓新舊粉都看得開心的努力程度\n\n\n\n(比如：靜香在本篇中曾用無生物催眠機催眠掃帚，成為幫助他人的魔法少女，在電影內\n\
  也重現了，爸爸在本篇也是小時候曾想要成為畫家，並且努力作畫過，在電影中講解著畫\n圖者的心意是最重要的，這也讓人很感動...)\n\n\n\n每位角色非常平衡\n\
  \n戰鬥畫面也是近十幾年來最讓人屏息緊張的\n\n(我家兩個孩子整場都在緊張...)\n\n各種伏筆也有好好地收回\n\n該怎麼講呢...  是一部看完以後\n\
  \n會很慶幸自己帶全家人，一起去看\n\n一直持續喜歡著的IP\n\n\n 我真的很喜歡哆啦a夢\n\n很謝謝藤子老師創造了這個動漫\n\n也非常謝謝寺本導演導了這麼好的一部片\n\
  \n 啊...  喜歡哆啦a夢真的是太棒的一件事情了\n\n\n\n\n--\n親子桌遊心得與介紹! \n\n--"
