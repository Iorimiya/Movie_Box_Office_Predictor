url: https://www.ptt.cc/bbs/movie/M.1754304957.A.999.html
title: '[ 好雷]  大雄的繪畫世界物語 感動心得'
content: '因為剛好有一段假日下午的時間空檔

  隨興的決定帶著老婆跟兩個小孩一起看了繪畫世界


  卻意外地被感動到全身雞皮疙瘩

  雖然忍住沒有哭出來

  但真的已經接近極限了


  勾起了非常多童年回憶

  真不愧是45周年紀念作品

  對年近45歲的我效果十分顯著


  (1)無雷心得


  這次的劇場版

  不僅僅是編排給小朋友看得冒險喜劇


  更是一部給伴隨小叮噹長大的成年人

  一封誠意滿滿的情書


  劇中所有的道具

  除了一開始就登場的那個關鍵道具外


  其他每一樣道具

  真的是每一樣道具

  都是來自於我們熟悉的原版漫畫


  而且致敬橋段多到數不清

  能接到球的觀眾

  一定會讚嘆劇組的巧思


  無雷心得只能講到這邊

  誠心推薦大人小孩都值得進電影院觀賞

  肯定值回票價


  ==雷公分隔線==
















  (2)經典道具回歸


  不用說

  最有印象的

  一定是水的加工粉末


  在劇場版一登場我就渾身止不住的雞皮疙瘩

  接著水大樓建築機跟那個材料罐一掛上去

  真的讓我很想要站起來原地大叫


  雖然早就不記得機器長甚麼樣子了

  但一看到就是回憶湧現

  完美還原


  劇情也是經典復刻

  不僅城堡造型情懷拉滿

  最後用水還原粉還原城堡

  都跟原版可以說一模一樣

  但劇場版讓還原的城堡化作擊退強敵的關鍵

  只能說讓我佩服的五體投地


  (3)經典大戰場景


  身為看小叮噹大長篇長大的大叔

  最終大戰必不可少的道具們

  空氣砲 閃避披風 瞬間膠槍真是太熱血了

  話說 這次是不是沒有看到縮小燈


  主角夥伴們一個一個被打倒時

  那個空白定格的模樣

  也讓我聯想到魔界大冒險的石化狀態

  不知道算不算致敬


  大長篇大戰場景中我最喜歡的

  當屬大雄的大魔境

  主角五人穿越時空回到大戰

  實現預言成為十人來解救狗狗國度

  感動石像內心(物理意義)

  真的讓我印象深刻


  小時候看到這種穿越時空的劇情都很糾結

  因為真的會想不透


  但長大就不會這麼糾結了

  反正解釋不通就是穿越時空

  完全沒有問題


  這次可蕾雅在最後也有穿越時空的劇情

  相信是為了讓劇情有點遺憾

  最後再讓觀眾鬆一大口氣的安排

  也把開頭的伏筆做了一個交代

  我個人是還蠻喜歡的


  (4)雄雄 糟糟


  大雄畫中哆啦A夢真的是神來一筆

  故事中段看到的時候

  以為只是一個搞笑橋段


  但沒想到後期又被拿出來用

  本來以為又是一個重複利用的搞笑梗

  但怎麼看著看著就快看哭了

  怎麼那麼感人


  這個段落我覺得真的很有藤子不二雄老師的風格

  創意之精采

  又有感動人心的溫暖

  更完美切合劇場版主軸—繪畫

  如果滿分100分的話

  我一定給到150分


  看完電影後

  家裡一直再說 糟糟~

  真的是有夠深植人心


  (5)總結


  完全出乎我意料之外地滿意

  非常好看的劇場版


  回家之後還特地找了動畫

  翻出 水的加工粉末和摩西手杖

  跟兩個小朋友一起重溫一下童年回憶


  看著看著感覺就像回到了自己的小學時光

  但一轉眼

  自己的兩個小朋友也已經比大雄都還年長了


  我只能由衷的感謝

  藤子不二雄老師

  能帶給我這麼美好的一段童年回憶

  跨越了45年

  竟還能跟我兒女共享這個經典話題

  無限感動




  --'
