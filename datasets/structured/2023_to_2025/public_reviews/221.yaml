url: https://www.ptt.cc/bbs/movie/M.1752918950.A.79B.html
title: '[大好雷] 哆啦A夢 大雄的繪畫世界物語'
content: '極力推薦！


  畫面，音樂，劇情都是上乘之作

  我覺得這是藤子老師離世之後，

  藤子工作室原創的最高傑作了

  搞笑，熱血，感人

  連戰鬥場景都不馬虎

  大決戰的史詩程度差點都要忘了自己在看哆啦A夢

  結尾收得也很漂亮


  以下有部分劇情雷

  請斟酌觀看





  這部劇情版有非常多舊作的致敬

  如果是跟我一樣的老粉一定會在很多地方被觸動

  看到痛哭流涕

  可能大部分人都不知道，大雄的爸爸其實有一個畫家的設定

  而且學生時還受到富商的青睞

  準備資助他去法國學畫

  可是大雄爸後來回絕了

  他想依靠自己的能力，不想為了某些目的去改變畫畫的初心

  雖然後來他成為了社畜，但他沒有背叛過自己喜歡畫畫的心

  所以電影結尾時電視上出現大雄的畫

  爸爸的評語真的讓我哭慘了


  還有靜香騎著掃把這個設定也是對原作短篇的致敬

  在原作裡靜香一直有一個當小魔女到處幫助人的夢想

  但因為很幼稚，所以她一直沒有讓別人知道

  後來在大雄跟哆啦用無生物催眠機的幫助之下

  她就騎著掃把，並帶著百寶袋去四處幫助有困難的人們

  想不到這次電影版回收了這個設定，讓靜香超秀

  能打能扛又有腦

  好幾度我雞皮疙瘩都起來了


  而且每個角色都智商在線，沒有雷包

  大家都有貢獻

  完全感受得到製作組對角色的喜愛

  胖虎是武打擔當

  師承空手道黑帶的叔叔，各種投摔美技

  大雄也是發揮神射手的長才，這次難得從頭到尾都不雷

  也好險有百發百中這個設定，不然真的不知道怎麼收尾

  小夫雖然沒有明顯的表現

  但也是唯一懂得帶現代食物去古代賄賂人的奸角

  而且多虧有他才能發現敵方的弱點


  然後就不得不提這次的反派

  古代傳說的災厄

  他ㄧ出場真的絕望感拉滿

  很多電影都有反派不夠強的問題

  這部絕對不會，反派強到不知道怎麼收尾

  最後只能給他一個劇情殺

  但也是殺得合情合理


  如果硬要雞蛋裡挑骨頭的話，就是五人組大決戰前的轉折太快了

  哆啦突然就從口袋裡掏出一堆道具要反殺回去

  以往的電影版他們都會先開小組作戰會議

  分工合作，有計劃的進行

  然後通常計劃都會超級大失敗（是要5個人小學生怎樣

  這次電影版就沒有這個部分

  可能是礙於片長的關係，但瑕不掩瑜了



  最後是超級大雷

  我最喜歡的部分，收掉反派的過程

  要去電影院的人拜託跳過









  大雄掉進自己畫的哆啦A夢畫裡時

  我的眼淚真的是控制不住

  明明沒什麼生離死別的狗血

  但那種感動真的是從電影的開場就在鋪陳


  「畫這幅畫的人相信，它就是真的」


  「原來從畫裡就可以感受到畫家的靈魂」


  大雄畫的哆啦A夢

  雖然一點都不像，而且很醜

  但他第一時間來到大雄的身邊

  幫助他，保護他


  因為大雄相信

  因為這是大雄的靈魂


  一直到結局我的眼淚都沒停過

  最後大雄爸用專業畫家的眼光點評


  「雖然不知道他畫的這是什麼，可是他一定是很愛畫中這個人物，才能夠畫出這樣的畫」




  神作

  拜託大家都去看

  我真的很感動

  我沒想到藤子老師離世之後還能夠看到這樣的作品

  藤子老師，你在天之靈可以安息了













  -----

  Sent from JPTT on my iPhone


  --


  而且看得出來他是真的對大雄把自己畫那麼醜很不爽

  狂抱怨

  哈哈哈哈



  真的藏了好多給老粉的彩蛋

  感動！




  時光巡警結尾有說他被押送回去了

  是在押回去的路上發現可蕾雅真身的




  關鍵道具剛好在保養是定番了'
