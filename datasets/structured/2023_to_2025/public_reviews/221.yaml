title: 好雷 哆啦A夢：大雄的繪畫世界物語
content: '這次的電影在地球交響樂團後面


  題材上一樣由大雄不擅長的事情做延續


  內容不要講太多，但是這次的轉折很棒 ，關鍵道具很好猜 ，不過用法跟演出出乎我意料


  誰說劇情一定要反轉再反轉才好，順順的跑，演出細膩，一樣很精彩


  水田版個人最愛 （哭爆的）

  地球交響樂團＞繪畫世界 ＞秘密道具博物館 ＞其他


  閃光看完片尾名單：製作居然有IG社


  我：不然你以為戰鬥畫面怎麼突然開始高速轉鏡頭


