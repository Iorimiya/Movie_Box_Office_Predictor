url: https://www.ptt.cc/bbs/movie/M.1752852413.A.B11.html
title: '[大好雷]哆啦A夢：大雄的繪畫世界物語 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這次的劇場版，劇情新鮮又有層次感，我覺得滿好看~


  開演沒多久就進入劇情核心---雅特利亞公國的部份，

  原本以為是時光獵人盜賣名畫的故事，沒想到高潮不斷，

  在黑暗騎士伊澤爾出現之後，才發現劇情是大冒險的路線

  但關於親情 友情感人的部份也不少


  伊澤爾變身為怪獸之後的打鬥，真的令人大呼過癮。

  最有創意也最感人的部份，就是哆啦A夢也被石化之後，

  居然是大雄畫的醜醜的哆啦A夢與道具救了大家！！！

  （不知道會不會出牠的周邊 雖然牠戲份台詞很少 但真的很討喜）


  另外還有小可蕾雅説自己其實也是畫中人物，慢慢消失的那一段，

  太悲情了，看了差點當場飆眼淚；還以為她已經不存在於世界上了。


  今天我看的是日文版，配音滿高亢的，但是因為動作場面多，

  所以聽起來還不錯。


  然後，有一個地方，不知道有沒有人可以幫忙解釋一下：


  哆啦原本打算使用摩西手杖引誘伊澤爾過來，然後再把湖水復原溶化牠，

  到使用閃避批風一瞬間發生了什麼事，轉變太快有點沒跟上；

  （看到畫面一閃然後所有東西就失去色彩）

  伊澤爾如果可以把水靜止下來，

  那為甚麼後來用水恢復劑復原的城堡的水對牠會有效果呢？

  有跟上的大大可以説明一下嗎？


  --'
