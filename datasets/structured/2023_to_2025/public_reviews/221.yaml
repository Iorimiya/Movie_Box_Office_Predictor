url: https://www.ptt.cc/bbs/movie/M.1754402690.A.96E.html
title: '[好雷] 哆啦A夢：大雄的繪畫世界物語'
content: '文有點長，這部的概念真的很好，非常喜歡編劇滿滿的巧思。


  我看完這部最大的感想就是這個編劇的名字一定要記住，查了一下原來伊藤公志也是電視

  版《哆啦A夢》的編劇，這是他首次撰寫《哆啦A夢》長篇電影的劇本，我覺得這位編劇很

  厲害，他把握在有限的角色限制中將故事好好說完，而且整部劇情是環環相扣的。


  這次的主題是「繪畫」，從繪畫連結到失落的古文明，從進入畫世界再透過原畫作一分為

  二這一點，穿越回去13世紀的現實世界，親身蒞臨失落的古文明雅特利亞公國，這個進入

  點很有巧思，但真要挑剔的話，我覺得後來的劇情跟當地連結實在太少，這點很可惜，比

  較不是發生在這個國家自然演變的事件，而是全都是時空獵人惡搞的關係，可能篇幅不夠

  ，這樣敘事上確實比較省力，但導致雅特利亞公國就變成一個單純的舞台而已，國王和王

  后都是很樣板的角色，也或許編劇經過取捨，要把心思好好放在「繪畫」這個主題。


  從大雄因為不擅長繪畫而被朋友嘲笑，雙面鋪陳麥羅與大雄爸爸對繪畫的想法，都在告訴

  觀眾，繪畫的好壞從來都不是技巧的高低，而是畫者的心意，只要你相信，它就「存在」

  。


  在那個沒有相片與影像的年代，沒有辦法永遠捕抓某一點或長期記錄某個畫面，靠的只能

  是畫家用他的眼睛與雙手去描繪他所看見的世界，當他完成畫作的那一刻，畫上的人事物

  便是永遠「存在」了。


  時空獵人：反正這個國家遲早都要毀滅，我這樣做只是保護這些畫作而已。


  大雄：那如果有一個來自更未來的人，跑來告訴你遲早要滅亡，請問你作何感想？


  我很驚訝，這一段話很有意思，已經可以說是哲理了，我們不能改變歷史，無論這個國家

  曾經多麼輝煌，但即使它沒落了，不代表它不存在，那些遺留下來的東西，就是這個國家

  曾經存在過的證明。


  連結到伊澤爾的傳說，電影中是用進入燈讓他具體化成為最後的大魔王，但回到最原始的

  傳說，伊澤爾奪去光明亦消除黑暗，當出現的是紅色巨龍，世界便終結，當出現的是藍色

  蝙蝠，便帶來幸運。


  我認為紅色巨龍的傳說應該暗指未來火山噴發會造成雅特利亞公國毀滅，具體化的紅色巨

  龍便利用奪去「顏色」這一點將雅特利亞公國化為全白的世界，印證了伊澤爾奪去光明亦

  消除黑暗，而藍色蝙蝠指的應該就是火山噴發後的沉積物，雅特利亞原石，是一種特有的

  藍色，也代表這個國家。


  因為雅特利亞原石並不是消滅紅色惡龍之後才出現，而是早已存在於這個國家的東西，所

  以推測火山不定期性噴發，人們因為恐懼漸漸訛傳成為伊澤爾的傳說，最好的印證就是麥

  羅父親早就利用雅特利亞原石製成的顏料，畫了一幅雅特利亞城堡的畫作，畫中的湖水就

  是那種特有的藍色，電影中則利用紅色惡龍被水消滅後的沉積物當作象徵。


  我覺得編劇的這個巧思很厲害，雖然雅特利亞公國是註定會消失的文明，但它獨有的繪畫

  技巧，透過畫作流傳到現今，成為它存在的證明。


  緊扣主題，所謂繪畫，是只要你相信，它便存在。


  又再度連結到不擅長繪畫的大雄，用百分之百的心意畫出了哆啦A夢，成為在最後絕望的

  關頭，成功化解危機的關鍵，我們看到那幅畫會大笑，因為我們覺得大雄畫得不好，但以

  大雄的角度，那就是它描繪出最好的哆啦A夢，所以大雄進入繪畫世界，他全然相信眼前

  的就是哆啦A夢。


  這個概念真的很神，而且很感人，有被觸動到，我覺得感人程度有讓我聯想到《腦筋急轉

  彎》Bing Bong消失那一段，用抽象概念簡單表達是最難的，可以稱作經典。


  最後，可蕾雅其實只是存在於畫作中的人物，但看到消失的這個匆促，心中就有點不好的

  預感，果然下一秒失蹤的可蕾雅就被找回來了，這裡的編排有點可惜，如果故事發展是真

  正的可蕾雅早在當時就已經死了，但為了和父親母親道別才回到城堡，最後消失回到畫作

  中，雖然很遺憾，但可能更感人。


  但不管怎樣，我覺得這次的劇本與概念都是上乘之作，主題甚至可以說是對藤子·F·不

  二雄老師的致敬，片頭一度出現漫畫版的哆啦A夢，當年這位畫家用他的雙手畫下他所想

  像的世界，影響至今，或許生命會消逝，但存在於畫作中的心意與精神會永遠存在，這或

  許就是繪畫的意義吧。


  --'
