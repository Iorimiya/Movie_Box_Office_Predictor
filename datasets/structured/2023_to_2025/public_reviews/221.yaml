url: https://www.ptt.cc/bbs/movie/M.1754743540.A.14C.html
title: '[好雷]《大雄的繪畫世界物語》以繪畫承接音樂，更將信念放大升級'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  部落格圖文版：


  「最重要的不是好看……」


  這次的《大雄的繪畫世界物語》，自己覺得很大程度延續了去年劇場版《大雄的地球交響

  樂》「任何聲音都可以是樂曲」的精神。同時在劇情的緊密鋪排之下，透過大雄與哆啦A

  夢之間的深厚羈絆將這份信念放大升級，直接逼出我的眼淚 QAQ


  其實一開始看到讓少女可蕾雅突然消失的迷途森林、原創的中世紀雅特利亞公國，與惡魔

  伊澤爾等等帶有魔幻元素的設定時，我還蠻擔心這次的故事會很兒童取向（後來想想好像

  每次都是這樣 XD），但電影裡一個又一個的關鍵轉折，真的都鋪陳的超級漂亮。


  這些不因年齡而打上折扣的，是胖虎、小夫差點摔落無底深淵，還有剩下大雄、米羅仍在

  奮戰的時候，我們在心裡吶喊「輕鬆釣魚竿」、「水恢復粉」的激動；「因為我就是時光

  巡邏隊……」是被弄臣和美術商人兩個可疑人物混淆的恍然大悟；最最重要的，是在大雄

  的畫裡（Literally），看到他與哆啦A夢任何時候都作為彼此最堅實後盾的感動。


  「是喜歡、在你心裡的樣子。」


  電影以畫畫為題，帶我們認識，或再次認識到畫家的心意是作品多麼重要的一部份。大雄

  畫中的哆啦A夢，也讓我不禁想起了自己的照片們——想分享從來不只是好看與否，同時

  在於彼此濃縮進照片裡的共同記憶。而大概是因此，小時候時不時就想逃避美術課的我，

  完全超乎自己預期地對這次的劇場版有共鳴（當然也有可能是因為我的畫風跟大雄一樣走

  真誠路線 XD）。


  整體而言《大雄的繪畫世界物語》用「繪畫」接棒《大雄的地球交響樂》中的音樂，不僅

  沒有重複的感覺，對於人人都可以藉由藝術表達自己，電影給了更加直接、充滿情感力量

  的肯定。Btw，八成是我看得太投入，一直到出了電影院才發現沒有色彩的世界，怎麼很

  像是上次沒有音樂的世界（？


  --


  部落格：

  FB：

  IG：


  --

  完全是！幸運自己在求學階段有遇過非常鼓勵大家的美術老師

  醜哆啦真的很可愛，看得超級感動'
