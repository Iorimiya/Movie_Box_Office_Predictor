content: '大家好，關於今年的《哆啦A夢：大雄的繪畫世界物語》，

  板上已經有人貼文分享心得，

  個人看完後也覺得很好看，非常推薦各位去電影院欣賞！^^b

  這次電影版的片頭曲很用心地穿插並改編了許多世界名畫，

  剛好這幾天在youtube上看到車庫有po片頭曲的預告。

  自己有嘗試上網搜尋了片頭曲中出現的名畫，

  但有些實在不確定要用哪些關鍵字來搜尋，

  歡迎各位知道答案的板友們來留言和補充，感謝！

  (網址過長的部分，之後會用縮網址或放到imgur，請大家先湊合著看^^”)














  感謝另外回覆的大大的解答



  (OP中與下圖互相組合)



  (OP中與上圖互相組合)










  感謝另外回覆的大大的解答










  大雄那幅擬人化的貓咪圖不確定是否改編自這幅作品？

  不過推測應該跟歌川國芳的貓咪擬人化或人物貓咪化繪畫概念有關。





  這繪畫名稱實在不好翻成中文，>_<"

  大大認為大雄的貓咪圖可能出自這幅畫的中間左下那隻貓，

  不管怎樣，應該能確認是改編自歌川國芳的繪畫貓咪的風格沒錯。0.0












  感謝另外回覆的大大的解答






