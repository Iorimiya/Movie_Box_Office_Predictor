url: https://www.ptt.cc/bbs/movie/M.1753844519.A.10F.html
title: '[分享] 哆啦A夢：大雄的繪畫世界物語房間內彩蛋'
content: '依照往年的慣例，大雄的房間通常會出現上一部電影版物品，或是相關配件

  看了閒君和小李今年的影評都沒特別提到彩蛋，像是之前：


  §2024《大雄的地球交響樂》有出現《大雄與天空的理想鄉》的


  §2023《大雄與天空的理想鄉》中有《大雄的宇宙小戰爭2021》原創人物搭乘的

  P.S.雖然是叫宇宙小戰爭2021，因疫情延後一年到2022才上映


  (畫面擷取自【公式】ドラえもん / 藤子・F・不二雄チャンネル主題曲特別版PV)


  §2022《大雄的宇宙小戰爭2021》時，雖然房間裡沒物件，但牆壁上有掛了一幅在《大雄的

  新恐龍》出現的，而且這隻恐龍還是小夫的知心好友


  (畫面擷取自東宝MOVIEチャンネル特報)


  §2020《大雄的新恐龍》掛衣架上有出現《大雄的月球探測記》原創人物的，書櫃

  裡也有


  (畫面擷取自東宝MOVIEチャンネル主題曲特別版PV)


  言歸正傳，回到今年，目前有找到三個：

  1.去年《大雄的地球交響樂》裡能吹出No音的


  (畫面擷取自東宝MOVIEチャンネル預告)


  2.桌上出現了《大雄的新恐龍》的(胖虎的知心好友)


  (畫面擷取自片商片頭OP)


  3.牆壁掛著一幅海報，是在《大雄的秘密道具博物館》的劇情中，前往的


  (畫面擷取自LINE TV)


  其他特別的彩蛋就有待還沒看電影的，或是已經看過要二刷、三刷、四刷...的大家一起進

  電影院幫忙找找囉！


  最後，還是想說一下，之前《大雄的南極冰天雪地大冒險》的時候，在南港喜樂時代影城曾

  辦過哆啦A夢生日活動，當時還有人偶見面會。

  主持人走下去詢問台下觀眾有沒有看過電影了呢？有位小男孩就回答說：

  雖然南極距離現在已經有快八年了，但我相信這類的問題依舊還是

  很頻繁的發生。想要給下一代小朋友正確的版權觀念，就要帶小朋友進電影院觀看，而且現

  在蠻多影廳都有提供假日親子場次，不怕小小孩在影廳內哭鬧，或是其他不可控制的因素，

  都能提供給全年齡層一個適合觀影的環境。


  希望哆啦A夢的電影能越來越受到電影院(沒錯~就在說威秀)重視，今年的哆啦A夢真的可以

  說是商業片等級了，純熟的敘事技巧，以及精湛的劇情，絕對堪稱近十年的佳作。大家一起

  支持起來！也希望中南部能有更多特別場，順便懇求辦一下電影造型人偶見面會！


  --'
