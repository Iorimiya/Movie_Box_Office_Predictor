url: https://www.ptt.cc/bbs/movie/M.1753375135.A.555.html
title: '[ 超好雷] 哆啦A夢，大雄的繪畫世界物語'
content: '無劇情雷。


  今天跟女兒去看哆啦a夢的電影，大雄的繪世界物語，讚。我給95分。


  因為是臨時起意，我也沒特別爬文哪部好看不好看。我私心本來還想看超人，但是問小朋友

  意見很自然的她會想要看哆啦a夢，因為超人他根本不認識，這也真是明智的選擇。


  節奏抓的非常好，一點都不拖沓。接近開頭的部分直接用一段小冒險的結束，巧妙地介紹出

  這次電影主要道具：進入燈。接著進入這次電影版的片頭曲。看完片頭去我就覺得神了。大

  雄在各個名畫中探險遊歷，孟克的吶喊，梵谷的星夜，葛飾北齋的浮世繪，達文西的蒙娜麗

  莎，（我叫的出來的就這些，其他好像依稀有印象，有請各位大神補完。）最後壓軸的是..

  .黑白漫畫的哆啦a夢！我的媽呀，看到這邊其實我有點感動到，陪伴整個跨世代人人長大的

  哆啦a夢，當然也要算是世界名畫。


  這次女主角很可愛，個性也很鮮明。

  電影敘事很多地方都有切中Chekhov''s gun的敘事手法。（如果你在第一章說牆上掛了一把

  步槍，那在第二或第三章它絕對要響。如果它不會被用來開槍，它就不應該掛在那裡。）

  簡單的說，梗埋得很好，也不算埋得太刻意。甚至說是埋給對對話有些龜毛的人看的，小朋

  友看九成不知道是埋梗，然後這個梗解開的時候還可以帶點教育意義，這也是家長會喜歡的

  。


  龜毛的我一直覺得從頭到尾劇情有個不合理之處都沒交代，非常不舒服，還想說是不是小朋

  友看的所以就糊弄過去就好，結果後面居然有交代！整個邏輯都通了之後，如果結局斷在這

  裡，我用大人的標準給這部片的分數99分，雖然很殘酷，不過這就是人生啊，小朋友們，森

  林是很危險的。但是後來這部分鬼轉硬要成happy ending，扣10分，但是想想終究主要客群

  是給小朋友看的，演那個99分結局大概家長就要抗議了，體諒一下，加到95分。


  作畫演出也是系列最頂，雖然不到鬼滅那種超規格的誇張，但是在年貨電影中也絕對是一流

  。最終boss的絕望感也有表現出來，對，絕望感。雖然我知道最後正義必勝，但是我真的想

  不到這場面最後是怎麼解決，看到最後出來救場的是它之後又覺得完全合理了，想不到單純

  是我資質太駑鈍電影看太少，


  總之，精彩！大概是有人找我二刷我會去的程度。



  --'
