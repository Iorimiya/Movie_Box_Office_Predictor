title: '[好雷] 大雄的繪畫世界物語 '
content: '昨天在華航機上看完了，非常好看，

  而且不是因為跟新宇宙小戰爭那部白癡作品比較的緣故。

  (新宇宙小戰爭確實是白癡作品，難怪那個導演會被趕出鋼彈界)


  主要是這次的敵人--那頭會吃色彩的紅龍--太強了，

  強到一個很恐怖的地步；


  雖然我有預想到最後會用"那招"來解決紅龍(看到水磚機的時候就有猜到)，

  但沒想到前面那個大招居然沒用，真的是給人一種強烈的絕望感...


  紅龍是藤子老師不在以後的新劇場版中壓迫感數一數二強的BOSS，

  如果新劇場版都能維持這個水準，那會是很不錯的發展。


  但我必須說，這部作品還是有一個缺點，

  那就是某位演員的棒讀配音。


  演員配音不是不行啦，但鈴鹿央士真的配得超棒讀，

  讓人非常出戲，不過人家事務所給力，這也沒辦法。


  總之，這是一部很好看的動畫，值得一看。


  建議搭配新宇宙小戰爭服用，會覺得更好看喔!

  (前提是看了新宇宙小戰爭沒有把飛機餐吐出來)


  --'
