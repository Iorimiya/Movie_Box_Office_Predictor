title: '[普雷] 龍族戰神：重生'
content: '雷文防雷資訊頁


  一早就衝去看早場

  然後就包場了

  這片是不是真的沒什麼人期待啊


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  畢竟有舊版存在

  免不了要去跟舊版做比較

  舊版就是一個歌德風格強烈的爽快復仇片

  新版的步調就很...亂

  主角個性跟造型很反差

  滿身肌肉全身刺青但是說話很溫吞

  甚至最後在復仇時我都感覺不太到狠勁

  而且主角跟女主角被設定成毒蟲

  男女主角甚至是在勒戒所相遇的

  很浪漫吧

  預告時很多人嫌的男主角造型我覺得還行

  雖然沒有經典長髮造型

  但是演員身材好還是看著很順眼的

  至少比女主角好看很多

  不知道是不是為了多元性選擇有色人種當女主角

  然後又設定成吸毒犯...?

  整體來說就還能看

  但是如果未來想回顧The Crow的話我會選擇舊版




  -----

  Sent from JPTT on my Google Pixel 6 Pro.


  --'
