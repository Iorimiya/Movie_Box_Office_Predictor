title: '[情報] 賈樟柯新片《風流一代》內容將橫跨 22 年'
content: '根據 Variety 的獨家報導指出，中國名導「賈樟柯」正在籌備他睽違五年的新片《風流

  一代》（We Shall Be All）。




  自 2018 年的《江湖兒女》以來已經五年沒有帶來劇情長片新作的賈樟柯終於開始正式突

  入他新片《風流一代》的製作。該片其實在今年三月已經傳出於中國立項的消息，而今天

  則在外媒中有了近一步的報導。


  據報導指出，該片籌備了長達 22 年之久，片中的一部份內容在 2001 年已經拍攝，其餘

  的將會在今年內繼續拍完。根據先前中國立項的劇情介紹：影片故事從2001年至22年，以

  中國北方小城戀人巧巧和郭斌的分分合合為主線，講述他們與身邊形形色色的基層小人物

  在新世紀頭20年的人生故事，刻畫社會變革背景下一代人不屈不撓的進取精神，描繪出一

  代人的生活。


  曾與賈樟柯合作文學紀錄片《一直游到海水變藍》的女編劇「萬佳歡」將再度和賈導共同

  編寫劇本，而女主角當然由趙濤坐鎮。


  《風流一代》依然由與賈導長期合作日本製片「市山尚三」，據悉這回還會有一位名叫「

  梁嘉艷」的女製片參與，他曾客串演出過《江湖兒女》與《不止不休》，實際上為平遙影

  展的執行董事。


  《風流一代》目前未公布檔期，應可望於明年坎城影展亮相。




  --'
