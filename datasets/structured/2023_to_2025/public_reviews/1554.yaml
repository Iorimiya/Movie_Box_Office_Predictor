title: '[好雷] GRIDMAN UNIVERSE 致那些小小的救世主們'
content: '圖文好讀：


  《GRIDMAN UNIVERSE》是《電光超人古力特》系列ＩＰ慶祝30周年的最新電影作，

  更進一步的說，是動畫《SSSS.GRIDMAN》、《SSSS.DYNAZENON》的直接續篇，也是

  整個系列目前唯一的大螢幕作品。


  作為續篇，自然有大量前作人物出場，劇情自然也是直接承續前作。比較簡略的說

  ，就是有新的神祕敵人在籌畫陰謀，而兩部前作的主角群甚至是敵人都要同心協力

  ，一同擊敗新敵人，迎來大團圓結局。


  一般的動畫劇場版大概就是這樣了，但是由於《SSSS.GRIDMAN》有兩個非常有特色

  的設定（有些觀眾可能會視之為缺點）在這部劇場版中得到延伸與發揚，使得《GR

  IDMAN UNIVERSE》成為真正意義上的「完結篇」，而不是一部可有可無的「劇場版」。




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  其中之一是，主角裕太在第一部動畫結尾揭露，其實本體一直處於昏迷狀態，是附

  身的電光超人在行動，也難怪他在動畫一開始會「失憶」，其實根本就是不同人。

  這很明顯是在致敬初代超人力霸王（奧特曼）降臨地球時撞死日本隊員，只好跟他

  合體幫他延命的橋段。


  這也就導致，當結尾電光超人達成使命離開後，真正的裕太其實是根本沒有整部劇

  情的記憶的。想必會有觀眾認為，我們看了十幾集的主角結果不是主角，主角其實

  等於根本沒登場過的路人，這根本就是在耍人。


  在劇場版中，主角裕太和上述的想法可以說是同步的。他一覺醒來，突然間本來沒

  那麼熟的同學成了生死與共的戰友，好像共享了整個世界只有三個人知道的小秘密

  ，偏偏只有自己根本不記得。劇場版前半小時中，女主角六花想要將電光超人的故

  事改編為班級舞台劇演出，和「戰友」們熱烈討論當時的戰況（也是幫觀眾複習劇

  情）時，可以看出裕太是困惑，甚至有一些抗拒的。


  裕太一方面對自己突然拉近了和心儀的六花之間的距離而感到慶幸，另一方面來說

  ，也對六花是不是一直在自己身上找尋「當時的裕太」而感到自卑。他之所以遲遲

  不敢對六花告白，恐怕有此原因。


  另一邊廂，離去的電光超人對自己奪走了裕太人生的一部分感到愧疚，這股愧疚感

  最終招來了劇場版的敵人，讓「怪獸」重現於裕太的世界中，似乎就是想要在真正

  的裕太面前「重演」過去的狀況，藉此「彌補」裕太的人生。


  因此「裕太不是裕太」這個當時看似乎有些畫蛇添足的設定，結果成了整個劇場版

  的起因，而裕太如何作出心理調適也一路貫串到尾。六花最後回應裕太告白的「幸

  好你告白得這麼遲，讓我有機會喜歡上你」，也表明了若是在打完第一部的魔王那

  時告白，六花多半是不會接受的；她看中的是經過之後一年相處、瞭解的裕太本人

  ，而不是電光超人。


  其中之二是，劇場版帶回了《SSSS.GRIDMAN》的「裏主角」新條茜（阿卡內）。在

  動畫中，茜揭露了自己是這個動畫世界的造物主，六花、裕太都是她的造物；而在

  最後，電光超人擊敗了引誘茜造出怪獸的幕後黑手，茜也主動離開了動畫世界，在

  現實世界（真的就是直接變成真人日劇）中醒來。


  683T新條茜幹走冷氣，至今逍遙法外。（《SSSS.GRIDMAN》)


  恐怕會有觀眾質疑，這不就是「夢結局」嗎？到頭來我們看的都是茜的腦內小劇場

  ？甚麼裕太和六花的感情都不重要，旁邊那個戴眼鏡的誰更不重要，反正都是茜這

  個「作者」說了算？


  在劇場版中，觀眾看到這個世界沒有了茜這個「造物主」後，其實依舊活得好好的

  ；甚至可能更好了，畢竟在動畫中茜很明顯只「造」了舞台所需要的一個小鎮，但

  劇場版的世界已經是完整而能自我演化的。


  主角群面對能篡奪電光超人力量的新敵人屢吃大虧，此時伸出援手的就是已經在這

  個世界之外的茜（又變回了真人日劇），茜再次進入動畫世界，用神之力協助裕太

  和六花等人擊敗了新敵人。


  然後呢？然後茜和同學們繼續去河邊撿垃圾去了。動畫世界的那場滅世之戰，不過

  就是她在清掃途中在廢棄家電面前表演的一段小劇場而已。這是不是說，這果然還

  是夢結局，這劇場版劇情根本不重要呢？


  不是的，而是只有看了這段劇情，才能理解在第一部動畫結尾茜自願離開（醒來）

  的選擇有多大份量。在動畫世界裡，茜是身材傲人的無敵美少女，不管實際上她多

  社恐、多不會說話交際也好，全世界都會捧她在手心；不管她有多無視六花、對六

  花多無禮也好，六花就是無條件愛她、絕不會傷害她的。


  她花五分鐘就能幫助動畫世界解決滅世危機，但在現實世界裡，她最多就是去河邊

  撿垃圾。


  主角裕太有一句話說，如果這是只有他能做的（拯救世界），那他就會去做。這是

  不是說，如果不只有他能做，他就不必去做了呢？動畫第二部就不是這樣，第二部

  的主角群使用的武裝DYNAZENON根本就是誰都能用，誰上都行；第二部主角群只是

  偶然撞在一起，但他們還是堅持到底，拯救了他們的世界。


  新條茜就像是兩部主角群的合體，只有她能在動畫世界中使用神之力幫忙，所以她

  去做了；而在現實世界中誰都能做的清掃環境，她也還是去做了。她會花個幾分鐘

  拯救一下世界，也會花上一整下午沿著河邊夾著無窮無盡的垃圾，兩件事有一個共

  通點，那就是能讓世界變更好。


  在量子宇宙中，也許一個念頭就有無數世界生滅；但在牛頓力學下，僅僅只是讓周

  遭變好一點點都要花上無數汗水；那顆想變好的心，和拯救世界卻是相同的。所以

  ，讓我們致那無數的、小小的救世主們吧！


  作為劇場版，音樂畫面也是更上一層樓，不過《GRIDMAN UNIVERSE》即將下檔，想

  要享受戲院級音響螢幕的粉絲恐怕手腳要快了。


  --

  我的方格子：　

  電影和動畫推薦，歡迎打賞

  我的patreon：

  一些會大量得罪人的東西，收費限定


  --'
