title: ' [好雷] GRIDMAN UNIVERSE'
content: '算有雷嗎?


  第一季的主軸是


  某個三次元生物無法融入自己的世界，而跑來電腦世界當神


  但只是孤僻阿宅的話，只能寫自慰故事


  被教訓一頓後回去了



  第二季的主軸是


  黨爭終究有個成王敗寇，大家認真討論，但輸惹也看開一點就好



  到劇場版阿?


  就是吐槽你們各位啊，不要以為會用AI繪圖和CHATGPT就懂寫故事惹


  真正的專業永遠比外行人更屌更強


  -----

  差不多是這樣，


  人生在世要守護的三樣東西:愛、約定、賞味期限


  差不多用一張電影票就能完成了。


