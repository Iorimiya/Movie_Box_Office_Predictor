url: https://www.ptt.cc/bbs/movie/M.1690094014.A.0A9.html
title: '[好雷] GRIDMAN UNIVERSE'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~























  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  有點不知從何下筆（因為我是打字），原先以為只是個系列作的電影版，為此還先把前兩

  季動畫看過一遍，掌握前兩季動畫內容後，想了大概的方向，也大概推測電影的走向會如

  何。但我萬萬沒想到原先以為會是個像慶典般、大拜拜似的大集合電影，居然可以讓我在

  電影院感動到完全控制不住淚水與笑容，更何況我還是加速的把前兩季二十四集動畫掃過

  ，很難稱得上是系列粉絲。只能說扳機社真的很懂喜歡大型機器人的粉絲到底要甚麼，如

  果有一天他們要開拍《天元突破紅蓮螺巖》的後續電影版，我覺得我看完會感動到走不出

  電影院。


  只是要看這部動畫多了點限制，真的要先把前兩季動畫《SSSS.GRIDMAN》、《SSSS.DYNAZ

  ENON》看完，而且還要對機器人動畫很有愛。但如果有達成前述兩點，電影版絕對會帶給

  你最頂級的感動。真是的，原先只是想接續《怪物》找個與日本校園學生處境相關的作品

  ，一不小心撞見了今年到目前為止帶給我最強烈感動的電影。




  【以下涉及劇情，請斟酌閱讀】




  其實剛踏進 Gridman 的世界，可能會單純覺得這就是一部機器人大戰怪獸的特攝類作品

  ，有很多超人力霸王的特色，像是那個變身時從俯視視角看著角色長高長大的橋段；有變

  身時間限制，時間到了會有個寶石狂閃；常備武器是從手臂射出光線等等。這也沒錯，因

  為它的前身是《電光超人力霸王古立特》這部９０年代的特攝電視劇。我是沒打算去找這

  部電視劇來看，一來年代久遠，二來其實我對特攝電視劇諸如《超人力霸王》、《假面騎

  士》這類作品向來興趣缺缺。可是動畫版的《SSSS.GRIDMAN》劇情架構大致上與《電光超

  人力霸王古立特》類似，只差在一開始的設備都是空降，少了草創時期的感覺。順帶一提

  ，原先的特攝電視劇主角群設定是初中二年級，那個日本超愛用中二少年開啟故事的時代

  。


  兩季動畫除了因為它是機器人動畫而吸引我之外，會讓我想要擺在《怪物》之後的原因是

  兩季主角群或多或少都有點邊緣人的特質。像第一季的內海將是個特攝宅，大反派新條茜

  更是為了填補自己的空虛心靈而創造出這個所有人都喜愛、崇拜她的世界；第二季主角群

  根本是邊緣人大集合，有為了愛人背叛同伴的失馬、單親家庭不知如何面對媽媽再嫁的麻

  中蓬、走不出姊姊輕生陰影的南夢芽、繭居族山中曆、逃學國中生飛鳥川千瀨；還外加貫

  串兩部作品的遊民第二代、被茜創造出來卻又被捨棄的有心怪獸安奇、甚至這兩部作品中

  的「怪獸」其實都算是人類在負面情緒下催生出來的產物。兩部作品主軸其實就是不斷的

  用光明希望擊退一個個負面念頭的心靈治療過程，最後甚至讓 Gridman 擁有修復一切的

  能力。


  所以我原本以為電影版會是這個概念的延續。一開始利用「大擠壓」這種壓縮多重宇宙的

  方式解釋為什麼兩部作品的角色會混在一起也蠻有創意，雖然前半段沒有太多打鬥場面還

  有那麼一點遺憾，但看到連傳說中的「公主大人」都出場了，再加上各種補完系列作缺憾

  的橋段，也算是了了不少心事。不過正在疑惑前述的概念怎麼還沒浮現，宇宙真相的轉折

  卻帶來另一波驚喜，原來就像新條茜創造了響裕太的世界一樣，麻中蓬的世界也是由  Gr

  idman 的意識創造出來，這種不是平行多重宇宙，而是《全面啟動》那樣層疊式夢空間的

  設定很有意思，再加上前面製作道具時讓大家各自畫下心中 Gridman 的樣貌最後成為整

  合 Gridman 意識的關鍵，這種一開始埋下的伏筆也很讚。


  並且這時才帶出這次的主題：「想像」。我很喜歡片中提到的概念：「人類社會就是因為

  相信虛擬的事物而形成。」人類社會中的道德、法律、體制、金錢、文字，都是由人們共

  同賦予這些事物一個虛擬的概念而形成並運作，這一切都源自某人或某群體的想像而創造

  出來，甚至可以說想像力就是人類社會的原動力。電影中有個橋段是六花在寫話劇劇本，

  想加入小茜的事情卻一直被說沒有現實感，但其實發生在周遭的一切事情卻完全的超越現

  實，這本來就是個空想世界，何不就讓彼此的想像力自由馳騁呢？所有劇情與意涵通通包

  含在片尾曲中，我真的很久沒有聽到一首歌可以如此切合電影主題，這麼相輔相成渾然一

  體，也難怪看過的每一篇觀後感都說片尾曲超級神。


  但真正讓我淚腺完全失守的是大決戰。決戰會是最高潮一點也不意外，而機器人動畫嘛，

  這種類型就是要瘋狂合體，所以我看到歷代機體各種解離重組時一直狂笑，但是動畫片頭

  曲一下，笑著笑著我突然發現眼淚也在不停的流，甚至笑到有哽噎音，又哭又笑的當下我

  還真覺得我是不是瘋了；而且新條茜直接從現實世界登入虛擬世界引導大家合體開始我就

  知道已經完全不用管劇情的合理性了，這就是一部慶典，開派對啦！甚至第二代還原地變

  大穿上機甲我真的快瘋掉！第一階段打完正想緩口氣馬上又來第二階段，全員分開然後用

  各種光線狂轟濫炸那邊又是一波高潮，剛停歇的淚水再度潰堤，片尾曲歌詞寫的超棒：「

  毫無疑問，這就是名為空想的大爆炸。」


  剛好前兩天看到有訪談諾蘭導演的片段，他提到現在很多人都錯將劇情當作電影的本質，

  而忽略了電影的重點是視聽娛樂體驗，原先還在想這是甚麼意思，但看了《GRIDMAN UNIV

  ERSE》後卻好像領悟了一點。其實動畫本身的劇情有點不嚴謹，最後的大亂鬥更是很容易

  就會讓人覺得到底在幹嘛，充滿各種不合理，可是那一整段打鬥場景的畫面、音效、配樂

  、動作絕對是頂級的視聽體驗，唯一遺憾可能是這種規模的製作不可能有ＩＭＡＸ，但要

  是能體驗４ＤＸ絕對也會物超所值。甚至對我個人而言，這部動畫決戰場景帶給我的感動

  是《環太平洋》的十倍（而那已經是我心目中最佳的真人版大型機器人電影了），我真的

  很少能單純被畫面打動成這個樣子。


  其實看完當下心情很複雜，因為這題材真的小眾，而且還要是喜歡機器人，並且一定要先

  看過兩季動畫才有感，所以有種滿腹感想不知到何處能抒發的壓抑感，也才拉里拉雜的打

  了這麼大一篇。但是如果有興趣一窺究竟，這系列動畫真的不會讓人後悔。


  --'
