url: https://www.ptt.cc/bbs/movie/M.1689359150.A.7DA.html
title: '[超好雷] GRIDMAN UNIVERSE 劇情整理'
content: "作者: yuizero (14) 看板: C_Chat\n標題: [閒聊] GRIDMAN UNIVERSE 劇情整理\n時間: Sat Jul\
  \ 15 02:23:58 2023\n\n因為看人家說不能不補SSSS.DYNAZENON\n\n所以下午3點就請假直接標回家把DYNAZENON補完\n\n\
  然後衝電影院早開演20分鐘了  所幸就直接連看2場\n\n上人權 \n\n\n另外放一個影片\n\n\n有去看的應該知道我為何放這影片了\n\n下面    當然有大雷阿\
  \  先防雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n  原來早在SSSS.gridman結束之後  gridman就被敵人抓住了\n\
  \n而敵人是曾創造怪獸的人的副作用  也就是思念集合體形成的實體\n\n只是模仿人的感情的混沌怪物\n\n\n   gridman本來就是沒有形體的意識體  形體是人類創造的\n\
  \n也因此 gridman本身也有創造能力  渾沌怪物利用創造能力造了gridman宇宙\n\nDYNAZENON的世界也是這宇宙之一  同時gridman的記憶中有各種怪獸素材\n\
  \n所以敵人也不缺創造怪獸  目的就是在混沌世界一直毀滅 然後再生\n\n\n\n    gridman為了求救 就發出求救訊號  一是在御太那發出訊息\n\n\
  二是把宇宙形狀改成gridman形狀\n\n\n然後這時渾沌神也把意圖轉向到新條茜創造的世界  也因為宇宙悄悄被gridman融合\n\n人物開始到處轉移  這訊息被真實世界的新條茜抓到\n\
  \n\n所以就開始了這次的故事\n\n\n\n\n\n   這次電影版把一些遺憾和梗給補齊\n\n公主 所有人物 以及DYNAZENON為何沒GRIDMAN存在\
  \ 還有人最重要的三件事...\n\n\n\n  以前在PTT一直有人堅持SSSS是夢結局  這次的電影真的大大了打了那個人一臉\n\n\n\n最後 沒想到是新條茜救場\
  \  為了拯救GRIDMAN而強行停止思念 最後和響 裕太融合\n\n原本DYNAZENON因為GRIDMAN宇宙消失是應該要直接被消滅的\n\n但是阿雷克西斯和新條茜給了GRIDMAN創造世界之力直接把DYNAZENON創造出來\n\
  \n\n而且BOSS知道GRIDMAN以前的所有攻擊方式  那就忘造新的方式打你臉\n\n\n一部電影  4場戰鬥下來  太爽了\n\n\n\n\n\n我的感覺就是\
