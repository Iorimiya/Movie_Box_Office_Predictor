url: https://www.ptt.cc/bbs/movie/M.1689868840.A.59D.html
title: '[超好雷] GRIDMAN UNIVERSE 值得你入場觀看'
content: "雷文防雷資訊頁\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n 我在上映隔天就二刷了\n\
  \n實在很希望更多人看到這部好作品 因此來這裡發個文\n\n推薦的幾個原因\n\n1. 熱血: 今年最熱血的電影之一，中學生拯救世界，機器人大戰怪獸，燃到爆\n\
  \n2. 畫面: 機器人對戰怪獸的畫面真的是非常完美，從動畫兩季品質就能看出來\n\n3. 青春: 女主角可愛，蜜大腿\n\n4. 情懷: 這一作品算是送給所有看過前兩季的粉絲一個完美的結局，\n\
  \n所有前兩季的遺憾、未能做到的告別、每一個人物腳色的成長，在電影中圓滿畫下句點\n\n即使你沒看過前兩季，其實光憑前三點我依然覺得很值得進場看，看隔壁藍色巨星，\n\
  \n大家都這麼捧場，甚至7/28要上映杜比版本，這片爽片真的沒人看好可惜。\n\n以上真心推薦，尤其如果喜歡機器人大戰怪獸的電影，即使沒看過前兩季，也能爽看\n\
  \n底下就會有雷了，請斟酌往下看。\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n\n開頭先來一首歌: \n\n這是第一季的OP 片頭曲 也是我超喜歡的一首歌\n\n尤其在第一季最後決戰撥出的時候直接爆哭\n\n沒想到這次電影也有放出來\
  \ 真的超感動\n\n故事從第一季的世界，裕太作為主角開端，因為裕太完全失憶\n\n所以他自己本人完全不知道第一季發生了什麼故事，但內海和六花兩位朋友都還記得\n\
  \n兩人也希望在即將到來的學園祭將GRIDMAN大戰怪獸的故事用話劇呈現。\n\n接著就開始第二季的腳色一一登場，原先懷疑是宇宙壓縮的影響，\n\n第二季的腳色們就這樣來到這個世界，後來發現原來是GRIDMAN被利用，\n\
  \n導致平行世界重疊再一起坍塌。 最終連茜也登入世界一起協助戰鬥真的是爽到爆。\n\n最後開頭的伏筆用來做結尾打贏BOSS的方式真的很酷，也沒有把故事寫死，\n\
  \n讓動畫有續作的可能。最後學園祭也畫下完美的Ending，真的是太甜了。\n\n我很喜歡這個故事敘述，是從第一季的世界和主角切入，也解釋了第二季世界的形成\n\
  \n並且對於為何裕太的世界還會產生怪獸也有解釋。\n\n第二季失馬和蓬未能好好道別，而在這次電影重逢，兩人變得更要好\n\n第二季蓬和夢芽修成正果，來到這個世界更是不在像原先的世界那樣壓抑\n\
  \n第二季失馬和公主隔了5000年未能碰面，來到這個世界不但碰面了還鼓勵了失馬\n\n第一季裕太和六花未能交往，終於在這次學園祭結束後告白成功，閃瞎了我\n\n\
  我跟著裕太一起比出Access Flash，也跟著蓬一起比出Instance Domination\n\n真的是超滿足，兩個主角都有發揮他們的本事，這次電影又端出更多新奇的機器人組合\n\
  \n升級後的機器人更強，要是台灣能買到機器人組合我好想收藏。\n\n我看的第一場早上10點全廳只有5個人，下午2:40的場次全廳也只有6個人，好可惜\n\n早上5個人中還有一對母子一起來看，媽媽帶著應該是小三左右的小弟弟來看，\n\
  \n我還以為是走錯廳，因為其他家庭組合都是去看10點的柯南，沒想到小弟弟很愛這作品\n\n他看到人很少還以為是不是走錯了，我跟他們說是GRIDMAN UNIVERSE，他們才放心入座\n\
  \n小弟弟我看你真的是很懂喔！媽媽也是很願意支持小朋友的興趣而陪同進場看。\n\n這兩場看完，我看到每個觀眾都是很開心的表情，很滿足的離場，真的是推薦給大家\n\
  \n最後一首歌:  電影的主題曲，真的是超好聽的\n==\n\n--"
