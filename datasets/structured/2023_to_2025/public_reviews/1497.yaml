title: '[討論] 岡恩表示藍甲蟲將是DCU首個登場角色'
content: "James Gunn says \"The first Dcu character for sure is Blue Beetle and the\
  \ first\n full dcu movie is Superman.\"\n\n「我是說，DCU的第一個角色會是藍甲蟲沒錯，而第一部全DCU的電影將會是超人。」\n\
  \n出自岡恩近日上Podcast節目《Inside of You with Michael Rosenbaum》的內容：\n\n\n\n（主持人Michael\
  \ Rosenbaum曾在《超人前傳Smallville》中飾演雷克斯路瑟）\n\n--\n\n1.看起來藍甲蟲確定延續到DCU了，考量到藍甲蟲們在原作和金色先鋒、和平使者等角色\n\
  的互動，確實蠻合理的。\n\n2.雖然不是《沙贊！》系列那樣今後發展未明的狀態，但感覺系列舊規劃打掉只留下部分\n演員的可能性也是有的，不過照這個邏輯的話飾演沙贊的柴克萊威可能也不會在DCU了。\n\
  \n3.而且比起藍甲蟲，自己比較好奇的還是年底《水行俠2》和角色們今後的去留，畢竟傑\n森摩莫亞自己也有意願，他真的很適合演暴狼這個角色。\n\n3.當然這樣說的話，不過前\n\
  幾天的新聞提到潛在的續集劇本已經有相關規劃了，沒意外應該就是放到Elseworlds去。\n只是薩莎卡勒的超少女真的很猛，如果演員沒有一起到DCU去的話，自己大概在新選角出\n\
  來前都不太容易想像其他演員詮釋《Supergirl: Woman of Tomorrow》這個故事了。\n\n4.《閃電俠》正式版將會有試映版沒有的片尾片段，之前一直認為會是讓DCU角色露臉，\n\
  但現在感覺賣情懷的機率可能更高？\n\n--"
