title: '[新聞] 美各大拉丁裔動員替 DC《藍甲蟲》催票'
content: "史首部拉丁裔主演超級英雄片！美國各大拉丁裔組織全體動員替 DC《藍甲蟲》催票\n\n\n\n（圖片來源：華納兄弟影業）\n\n對台灣觀眾而言，即將在下週上映的\
  \ 宇宙新作《》（）可能只是\n另一部超級英雄電影，但對海外的其他拉丁裔族群來說，本片卻是影史第一部卡司群均以\n拉丁裔為主、幕後編導團隊也主要由拉丁裔組成的超級英雄電影，在當今十分重視「\n\
  」的美國，可說意義非凡，而《》這般特殊的地位，自然也吸引諸多拉丁裔\n人士樂意相挺幫忙宣傳。\n\n\n\n（圖片來源：華納兄弟影業）\n\n由於美國演員工會正在和編劇工會一起罷工，使得好萊塢現在所有演員都不得替自己的新\n\
  片宣傳，就連《》的班底也不例外，而為了不讓《》等拉丁裔相關題材作品\n的曝光度因此降低，拉丁電影學院、美國西班牙藝術基金會、美國拉丁裔獨立製片人協會\n、美國拉丁裔國家博物館等多達\
  \ 27 個拉丁裔組織，日前便聯合簽署了一封公開信，倡導\n大眾積極支持那些正在罷工的拉丁裔演員和拉丁裔編劇們的作品。\n\n\n\n（圖片來源：華納兄弟影業）\n\
  \n公開信中寫道：\n\n「故事不僅僅是娛樂，它是改革社會的有力工具，它能推動我們的群體運動，為那些在歷\n史上缺乏代表性、以及被邊緣化的人們建立一個更平等的世界。」\n\
  \n信中接著表示：\n\n「我們對於今年夏天感到特別樂觀，我們正進入拉丁裔代表性的重要轉捩點，因為我們看\n到了一些我們非常喜愛的電視節目和角色們的回歸、令人期待的新上檔影集，以及準備即\n\
  將於大銀幕實踐的開創性時刻 — 也就是史上第一部全由拉丁裔執導、主演和編劇的超級\n英雄電影。我們期待已久的文化時刻終於到來。」\n\n公開信裡最後呼籲：\n\n\
  「為了當代和未來的拉丁美洲人，我們不會再推延我們的進步，我們邀請你加入我們，一\n同努力發揚無數拉丁裔藝術家辛苦孵育的作品，當他們無法推廣他們的作品之時，我們必\n\
  須主動去支持他們，這很重要。」\n\n他們希望，所有的拉丁人能夠在這緊要的時刻更加主動進戲院買票支持《》，或是\n透過其它形式去支持更多其他拉丁裔族群的創作。\n\
  \n文：Joker\n\n新聞來源： \n--"
