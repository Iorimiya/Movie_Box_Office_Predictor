url: https://www.ptt.cc/bbs/movie/M.1692926340.A.D44.html
title: '[好雷] 10歲孩子也喜歡的藍甲蟲'
content: '我跟孩子都很愛看電影，尤其是英雄類的


  以前很愛漫威系列，不過真的不是我看到疲乏，漫威變得太愛說教了，塞一堆沒意義的東

  西，我是來看英雄得到新能力克服困境打敗壞蛋的耶


  總之我帶孩子去看藍甲蟲了，習慣性我都會問孩子好不好看，做個簡單的總結


  孩子的角度：

  變身很帥，很像後期的鋼鐵人（奈米科技）

  武器很多變，比鋼鐵人方便想變什麼就變什麼

  很多地方好笑，雖然孩子沒有完全懂對話但表演方式也會覺得好笑


  我的角度：

  娛樂性很夠，也有一點教育意味，但很自然而且淺淺帶過，不過主角的個性不算很鮮明，

  只感覺到很重視家人，整體電影看起來沒有負擔，可惜的是戰鬥場面不夠浩大，應該做到

  可以一打多的局面才稱得上毀滅世界的武器



  結論：如果你的信用卡優惠可以讓電影票控制在200元以下我很推薦，250元以上可能就自

  己斟酌一下




  --

  我也是這樣想，在生活在融入一點教育的感覺

  哈哈哈！好像也是，我記得HBO GO一個月100左右，應該再1-2個月就有了

  真心沒有，而且文筆還不夠好，不過大大如果有這種資源跪求分享'
