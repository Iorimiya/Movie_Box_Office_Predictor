url: https://www.ptt.cc/bbs/movie/M.1693752873.A.BB2.html
title: '[優雷] 藍甲蟲'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  其實以一部超級英雄電影來說


  藍甲蟲是一部還不錯的片


  我想北美票房不賣座


  最大的原因應該是主角是墨西哥人吧


  老美最愛歧視了


  種族也歧視 地域也歧視 有錢也歧視貧窮


  所以不賣座一點也不意外


  比起奧本海默那種三個小時傳記的大爛片


  除了讓一些政治腦拿台灣的政治去亂類比以外


  根本沒啥看的價值


  藍甲蟲應該是一個新的故事線 後面還有埋下下一集的伏筆


  只因為主角的國籍就被給予低評價 爛票房


  實在太不公平了



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  故事是在說


  有一個叫做科德的科技公司，裡面有一個女反派叫做維多利亞‧科德，


  在某個地方找到了藍甲蟲。



  另外有一個墨西哥男孩叫做海梅(主角，他們一家是從墨西哥偷渡到美國的低端仔)


  去讀完大學以後回家 結果家裡破產 海梅決定要五年內賺大錢讓家裡有錢


  這一段貧富差距就帶得很好 海梅一家住破房子 望著遠方的高樓大廈


  妹妹在跟她聊天的時候說到有錢人怎麼剝削 搶奪窮人


  講得很生動 不過高貴的美國白人大概不喜歡這個橋段


  結果海梅沒賺到大錢，反而去維多利亞‧科德家裡當傭人。


  當傭人過程中，遇到珍妮‧科德(維多利亞的姪女)和維多利亞‧科德正在爭執，


  主要是珍妮‧科德繼承了爸爸公司董事的職位，想要繼承她爸的意志，不生產武器，


  但是維多利亞‧科德想要利用藍甲蟲生產大量武器。


  爭執過程中海梅幫珍妮跟維多利亞嗆聲，結果就被維多利亞FIRE了。


  然後珍妮答應幫他在科德安插個職位，第二天海梅就去找珍妮報到，


  結果珍妮發現維多利亞已經找到藍甲蟲正在發展秘密武器，就把聖甲蟲偷出來，


  過程中交給來應聘的海梅。


  海梅帶回家後被藍甲蟲選上、附身，然後變成超級英雄。


  之後的橋段大概就是維多利亞為了搶回藍甲蟲，去攻擊海梅的家，海梅被抓，爸爸被殺，


  然後一群人跑去救海梅，最後海梅跟聖甲蟲打敗BOSS，結束一整個回合。





  其實有人說藍甲蟲的出現不知道要幹嘛，拎北倒認為可能是要連接一個新的故事線，


  根本不會太突冗。拎北認為藍甲蟲不賣座，完全是因為主角的種族、代表窮人，


  高貴的白人不喜歡，也就是政治不正確。



  不然你看奧本海默這麼悶的爛傳記可以賣座，憑的是甚麼？


  不就是憑他可以發明原子彈炸爛黃猴子日本仔？


  還有更重要的一點，他是白人。


  嘻嘻


  --




  --'
