url: https://www.ptt.cc/bbs/movie/M.1653546218.A.373.html
title: '[討論] DC《藍甲 蟲》服裝造型曝光'
content: 'DC新作《藍甲蟲》目前正在亞特蘭大拍攝中，


  也曝光了主角的戰服全貌，據悉會使用實體戰服輔以CGI修飾並加上機械手臂的方式呈現

  。







  概念圖：



  電影聚焦於第三代藍甲蟲海梅雷耶斯的故事。原作和動畫中藍甲蟲時常跟金色先鋒一起行

  動，之前華納也宣佈會拍攝金色先鋒的個人電影，不過感覺已經石沈大海，不知道這部片

  裡會不會出現他的身影。




  雖然華納已經跟Discovery 合併，但這部依然是人事改組前的濱田宇宙時期就已放行的作

  品。


  本片由Angel Manuel Soto執導，Xolo Mariduena飾演主角海梅雷耶斯 ，奧斯卡影后Susa

  n Saranndon 飾演反派Victoria Kord。預計明年八月在北美上映。


  --

  欸我不確定，換個說法好了

  手機發文沒發現'
