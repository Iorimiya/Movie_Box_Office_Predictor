url: https://www.ptt.cc/bbs/movie/M.1692344007.A.96F.html
title: '[好雷]藍甲蟲  不是超甲英雄嗎?幹騙我'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  I think he likes me


  看預告說是超甲英雄所以去看了，結果根本跟甲一點關係也沒有，

  但是google到很多國外藍甲蟲BL的圖片

  類似




  好像以後會有一個穿黃色衣服的搭檔，

  不知道在後面兩集續集會不會出現。

  或許可以期待吧~


  很多人說女主角很正，我倒是無感，一直覺得她有點像艾瑪華生。


  也有很多人說討厭那個男主角的妹妹?

  這個我完全無法理解討厭的點在哪...

  或許有一點吧，就是女主被困在石頭堆中的時候，

  沒有盡力把女主救出來，明明她也有那個武器手套。

  就算再不濟等男主來的時候能夠正確的告訴男主說女主被困的位置也好吧。

  但是男主問她女主在哪裡的時候，她只有回答我們走散了。

  不過後來轉眼她就被蘇珊莎蘭登抓在直升機上了...



  男主角的臉不是很討人喜歡的類型，

  但是我覺得他演的小奶狗個性演得很自然，

  會讓人忍不住愛上這個角色，覺得有點像荷蘭弟版蜘蛛人的個性。

  雖然身材沒有到非常好，但是也還不錯了比較真實感一點。

  一頭捲捲亂亂的頭髮，不管怎麼髒(戰損)卻能夠保持可愛真的很難，

  還好電影中他沒有蓄鬍，

  他的長相和髮型留鬍子會變得太成熟不適合角色可愛的個性。




  I think he likes me

  男主角一開始還以為這個藍甲蟲是he

  結果明明是she

  Khaji-Da機甲是女生配音

  失望

  唯一可以幫主角找到的甲點已經沒有了



  其實我最想問的是魯迪叔叔...

  魯迪叔真的被壞人轟一拳一點傷也沒有也沒死嗎?

  整片牆都炸爛了他還沒事!?

  我覺得他一定有鬼啦!



  我無法確定是不是因為藍甲蟲也是外星移民

  所以這個電影背景故事也是講墨西格移民美國奮鬥打拚?

  但據我所知藍甲蟲是外星人想要毀滅地球而來的

  這樣暗喻墨西哥移民好像不太好吧

  沒啦 開玩笑的 我知道這隻藍甲蟲一定是善良的

  我想我猜續集才會解釋吧~


  --'
