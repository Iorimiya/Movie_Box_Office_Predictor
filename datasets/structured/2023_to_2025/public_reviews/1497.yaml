url: https://www.ptt.cc/bbs/movie/M.1543657558.A.0A1.html
title: '[新聞] 拉丁超級英雄！DC有意籌拍新片《藍甲蟲》'
content: '拉丁超級英雄！DC有意籌拍新片《藍甲蟲》


  隨著新片《水行俠》大受影評青睞，有望為士氣低迷不振的DC擴展宇宙再創高峰，而在正

  義聯盟、自殺突擊隊等知名角色之外，DC如今也正努力擴展旗下的超級英雄陣容，有意將

  較不知名的藍甲蟲（Blue Beetle）搬上大銀幕。


  藍甲蟲一角最早是在1939年登場亮相，至今為止總共出現過三任藍甲蟲，分別是第一代的

  丹蓋瑞特（Dan Garret）、第二代的泰德寇德（Ted Kord），而DC這次片中聚焦的，則是

  在2006年問世的第三代藍甲蟲海梅雷耶斯（Jaime Reyes）。


  海梅雷耶斯原本是一位住在德州艾爾帕索的墨裔美籍青少年，然而在無意間撿到了一隻神

  秘的聖甲蟲之後，聖甲蟲竟不知不覺地連接到他的脊椎骨上，每當遇到危機便會發動能力

  ，讓他穿上一身刀槍不入、功能強大的外星高科技裝甲。


  片商目前已邀得了《背道而馳》、《選美小姐》編劇蓋瑞斯鄧奈特艾爾科賽（Gareth

  Dunnet-Alcocer）為《藍甲蟲》執筆，電影則由柴夫福爾曼（Zev Foreman）操刀製作。

  如果本片最終真的如願開拍，也將成為DC擴展宇宙中第一部由拉丁超級英雄領軍之作。





