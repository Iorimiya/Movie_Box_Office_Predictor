url: https://www.ptt.cc/bbs/movie/M.1692631077.A.B4A.html
title: '[新聞]【影評】藍甲蟲不是爛片 但推出時間與存在意義都不明的DCEU倒數第二作'
content: "新聞網址：\n\n原標題:\n\n2023-08-21\n\n\nDC 在今年迎來了岡恩的重大改革，DCEU 這個宇宙也終將關閉，而就在 DC\
  \ 信誓旦旦，不\n管怎麼樣都得放到戲院上映的《閃電俠》失利後，緊接著迎來的是這部《藍甲蟲》，這幾\n乎沒有任何人期待且被等著看笑話的電影表現如何？\n\n\n\
  \n\n\n首先，《藍甲蟲》身為一部超級英雄起源電影，最重要的目的就是讓我們認識這個新的超\n級英雄，並且進而讓我們喜歡這個角色，而《藍甲蟲》確實演了一個有始有終的故事，但\n\
  整個過程都缺乏驚喜，它就像是漫威第一階段的產物，這句話並不是貶義，但現在已經是\n 2023 年，在大家看過這麼多超英片的情形下，又有多少人能夠接受如此平淡無奇的套路\n\
  呢？\n\n\n《藍甲蟲》主角原來只是一個平凡人，但因緣際會下不小心接觸到聖甲蟲，才被迫成為藍\n甲蟲，說真的這個塑造過程我覺得粗糙無比，電影不斷地強調是聖甲蟲選擇了主角，但在\n\
  我看來根本是主角手賤才變成這樣，硬要說根本沒有什麼「天選之人」或是注定背負使命\n這種課題，這讓這個超級英雄的前導顯得有些無力，且按照公式電影後半段肯定會安排一\n\
  段失去與覺醒之類的戲碼，不過這也產生了另一個問題。\n\n\n剛剛才說《藍甲蟲》主角並沒有需要背負什麼使命，也因此他幾乎不需要有成長的必要，\n但幾乎每個超級英雄又都得有一段悲劇式成長，所以電影強行塞一個悲劇在他身上就顯得\n\
  非常刻意，在電影中唯一能感受到他的成長就是他學會如何使用藍甲蟲的能力而已，他真\n的知道他經歷了什麼或學會了什麼新的價值觀嗎？沒有，看到最後都還是覺得這個超級英\n\
  雄誕生的莫名其妙，事實上主角可能也還是不清楚到底發生什麼事。\n\n\n\n\n\n再來，《藍甲蟲》整片調性偏向胡鬧的喜劇，這在過往 DC 是比較少見的，而且又以拉丁\n\
  裔元素為核心，確實是一個新鮮的看點，可是整部電影實在太過於卡通，不論是人物的個\n性表現或行為舉止，尤其是主角一家人，有時候都讓人覺得有點過了頭，甚至會看到有點\n\
  煩的程度，再搭配免洗反派與呆板的刻畫，儘管電影有發生悲劇，卻嚴肅不起來。\n\n\n《藍甲蟲》不像《星際異攻隊》那樣，該正經時很正經，該大鬧一場時就大鬧一場，能夠\n\
  做到胡鬧與感動兼宜，《藍甲蟲》只有整片都將家庭元素抓牢，卻不太懂得利用這點來拍\n出有張力的劇情，實屬可惜。\n\n\n\n\n\n而《藍甲蟲》動作場面也不怎麼樣，很多人在藍甲蟲的造型以及預告片釋出時，紛紛揶揄\n\
  它就是另一個鋼鐵人，當然這個說法還是有些不公平，儘管他真的有和鋼鐵人相似的鏡頭\n，但其實他更像是湯姆霍蘭德的高科技蜘蛛人，特別主打只要是想得到的武器，電腦都能\n\
  變出來。\n\n\n本來這個設定應該能在動作場面上有著更豐富且中二的變化，主角卻也只有變出一把預告\n片就有看到的大劍，其餘都是一些你在鋼鐵人身上就會看到的招式，《藍甲蟲》並沒有什\n\
  麼獨特的特色，如果在看完電影後還會有人說他是另類鋼鐵人或蜘蛛人，這不能怪他們。\n\n\n\n\n\n，在 DCEU 即將邁入尾聲之際，選在這個時\n間點推出一部我們從沒看過的超級英雄起源片，除了時間點意義不明，就連電影詮釋這個\n\
  超級英雄的存在意義也不明，尤其是在《閃電俠》票房爆死後，這部電影真的有比被砍掉\n的《蝙蝠女孩》更大的存在必要嗎？沒有人知道。\n\n\n假如你是連《閃電俠》都不願意進戲院看、對\
  \ DCEU 已經心死的人，那你完全沒有理由來\n看這部《藍甲蟲》。\n\n\n--"
