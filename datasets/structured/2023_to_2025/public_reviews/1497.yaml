url: https://www.ptt.cc/bbs/movie/M.1692623589.A.6FE.html
title: 'Re: [討論] 藍甲蟲北美票房爆炸'
content: '探索CEO怒斥DC影業總裁濱田沃特：「有錢你不去拍超人，拍沒人要看的英雄做什麼？」

  2022-05-31 01:36:27



  在探索傳播（Discovery）於今年4月以430億美元，正式收購華納媒體（WarnerMedia）

  之後，不少影迷首要關切的，就是至今仍然一盤散沙的DCEU，是否在「新老闆」探索傳播

  執行長大衛· 扎斯拉夫（David Zaslav）接手後帶來新的轉機。


  據消息，先前探索CEO扎斯拉夫在華納董事會議上時，針對現階段的DC電影不僅毫不留情

  地直接開嗆：「原本DC電影應該是華納兄弟那相當明亮的掌上明珠，結果現在卻像台沒有

  車頭燈的車子在黑夜裡亂闖。」



  而大衛· 扎斯拉夫更是拿先前宣布取消的英雄電影《神奇雙子》（Wonder Twins），來

  大聲斥責DC影業現階段的當家總裁濱田沃特（Walter Hamada）表示：「3500萬美金，有

  那麼多錢你不去拍超人、拍綠燈俠，結果你去拍連CW都還不太願意開發的《神奇雙子》

  到底想要做什麼呢？」


  ====================================


  藍甲蟲是濱田沃特留下來的殘壘

  自責分應該算在濱田沃特頭上


  只是說真的啦

  羅伯的蝙蝠俠也沒好到哪裡去............

  寫實不代表造型可以沒本來特色欸


  如果新總裁的大咖腳色電影也都那樣

  我一樣滿悲觀的








  --


  喜不喜歡，大家各有看法


  但我不喜歡不是因為他是凡人英雄

  是因為裡面不管的美術造型都太醜了


  還有說是偵探感，但劇情編排把老爺變太蠢


  就是想說羅伯的票房好

  如果新總裁決定要以羅伯當發展主線風格

  我不看好就是了


  算是討論未來


  當然喜歡不喜歡都是個人意見


  可以討論看看之後都這樣獨立發展

  但都這樣會發展如何'
