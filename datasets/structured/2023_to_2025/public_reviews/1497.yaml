url: https://www.ptt.cc/bbs/movie/M.1692858810.A.6BF.html
title: '[負雷] 藍甲蟲 就像十幾年前的起源電影'
content: '原本打算等串流上再看的


  剛好朋友聚會就選了這部








  這部濱田遺作、不確定到底是濱田宇宙還是岡宇宙的《藍甲蟲》給我的感覺，


  就像早該在十幾年前就上映的超英起源電影。


  意外獲得超能力的主角、家人對主角性格的影響、企業的陰謀、外型或能力和主角相似的

  最終反派……


  這部片的一切充滿著過去超英起源電影已經玩到爛的元素，像是套公式般跑完劇情SOP然

  後收工。


  而導演好像也不想藏，直接用整部電影告訴觀眾我就是在抄公式，而且還只抄到皮毛，並

  沒有讓人對故事感同身受，角色也缺乏立體感


  不用期待驚喜與突破，它就只是一部仿造漫威前兩階段、看完即忘的流水線產物。




  動作戲的部分，是有比個人預期好一點，至少看的當下是舒適的，


  不過走出戲院後，就已經想不起有什麼厲害的打鬥場面了。


  唯一印象深刻的，就是叔叔駕駛蟲艦，殺進反派陣營那一小段，明顯在玩《星艦戰將》的

  梗。


  至於宣傳一直強調的拉美家庭元素，家人間的互動有幾段是不錯，特別是叔叔和阿嬤，其

  餘部分更多的是讓人不耐的嬉鬧和碎嘴，還有些讓人聯想到尾燈的黃色笑話。


  整體來說就是一部老套、毫無驚喜的起源電影，但拿這兩年的超英片比的話，竟然已經是

  偏好的一部了。



  單純論「爽度」的話，大概是黑亞當=閃電俠>藍甲蟲>奇異博士2>蟻人3>黑豹2>雷神4>魔

  比斯


  沙贊2跟雙面人拍的那部我沒看




  大概是這樣



  --'
