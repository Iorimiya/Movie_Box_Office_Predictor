url: https://www.ptt.cc/bbs/movie/M.1689087876.A.7F8.html
title: '[新聞] 《藍甲蟲》主角：片中有其他DC 角色客串'
content: '作為新DC電影宇宙的開山之作，即將上映的《藍甲蟲》(Blue Beetle) 是否會有我們熟悉

  的超級英雄客串呢？本片主演索洛馬里達那有個非常肯定的答案。


  在接受《The Wrap》專訪時，飾演「藍甲蟲」的馬里達那，證實片中將有其他DC角色的客

  串：「我想如果你是個DC粉絲，那一定有超過一個你認得出的角色，這是我可以告訴你的

  。」


  目前首支預告已經提到了「蝙蝠俠」，然而片中將出現哪些DC英雄客串，仍有待觀察。


  在經過《閃電俠》(The Flash) 片尾的「改寫」後，DC電影宇宙未來的模樣值得觀察，不

  過根據新任總裁 詹姆士岡恩 (James Gunn) 確認，《藍甲蟲》將會是新DC宇宙的第一部

  電影，並將在8月18日上映。






  /



  記得之前某個配角演員受訪時暴雷這部片裡會有蝙蝠俠客串


  不過他說這句話的時候已經是濱田時代的事了



  如果是濱田時代的話，那應該是基頓


  就算基頓真的有拍客串畫面，


  在前途一片混濁的現在，也很有可能被剪掉了


  那麼有可能出現的角色應該就不難猜是誰了（？）



  另外第二支預告大概明天就會看到了



  這次幾乎沒什麼宣傳


  看來華納窮到決定放生這部了？




  目前看到的只有漢堡王聯名的詭異藍色漢堡











  --'
