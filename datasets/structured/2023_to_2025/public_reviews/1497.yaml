url: https://www.ptt.cc/bbs/movie/M.1691596954.A.7A5.html
title: '[新聞]《藍甲蟲》已有「三部曲」構想！導演原本想拍《蝙蝠俠》反派「班恩」'
content: '新聞網址：



  2023-08-09 21:06:52



  DC 宇宙近半年以來，一連歷經了《黑亞當》（Black Adam）、《沙贊！眾神之怒》（

  Shazam！Fury of the Gods）、《閃電俠》（The Flash）三部電影的票房重挫，使得外

  界多半也不敢指望即將上檔的《藍甲蟲》（Blue Beetle）能賣出多好的成績，更別說是

  推出續集，然而，這依舊沒有抑制身為導演的安傑爾曼紐索托（Angel Manuel Soto）早

  就已經繼續往下發想故事的熱情。








  曼紐索托接著表示：「第一集是傑米的故事，我們想先聚焦於他和他的家人，而電影的結

  尾，則會留下關於聖甲蟲的疑問，並希望我能在未來給予解答。在下一集裡，我希望講述

  有關聖甲蟲的整個背景故事，例如他來自何方？為什麼他被派遣？而他們又得將誰擊敗？

  」



  曼紐索托先前曾自承，


  。而在《The Playlist》的訪談中，曼紐索托則進一步

  透露了他對班恩這個角色的理解。



  曼紐索托形容，班恩在漫畫裡有點像是一個嚴重被世人誤解的角色，處境也跟《藍甲蟲》

  裡的反派「甲殼」頗類似，但從班恩的立場來看，他其實算是一名英雄。曼紐索托也舉例

  ，身為拉丁裔的他，對班恩的處境多少一些共鳴：「我們拉丁裔已經習慣在全世界的眼前

  充當電影的反派，這就好像是我們與生俱來的樣貌似的。」曼紐索托意指，無論是甲殼、

  班恩、抑或拉丁裔族群，他們給人的印象都是「他們所身處的環境形塑出來的」。



  曼紐索托回憶，華納兄弟的高層當初聽完他的《班恩》電影提案之後，雖然很欣賞他的熱

  情，但他們仍表明，他們之所以找他來，主要還是希望由他來執導《藍甲蟲》，而曼紐索

  托很喜歡當時已經寫好的《藍甲蟲》劇本，劇本裡描繪的拉丁裔家庭風貌尤其吸引他，因

  此也欣然答應。



  曼紐索托補充，雖然他目前沒機會開拍《班恩》，但他仍將原本《班恩》裡的元素投射在

  《藍甲蟲》裡處境相似的甲殼身上：「「當我在塑造甲殼的時候，我就想說：我不知道未

  來是否有機會開拍《班恩》電影，那何不就讓我將自己對班恩的喜愛、以及我想探索的班

  恩背景故事，先轉移到甲殼身上吧。內心某部分的我對此的設想是：也許班恩和甲殼是同

  鄉的呢！只是也許啦（笑）。」



  --'
