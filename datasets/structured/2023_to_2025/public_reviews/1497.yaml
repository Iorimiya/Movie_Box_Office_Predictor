title: '[普雷] 藍甲蟲'
content: '防雷































  節奏很拖、動作戲還可接受、陳腔濫調


  女主角加十分


  我是建議可以直接從變身後開始看


  因為我是從串流看的


  從電影開頭到變身這一段


  很想讓人按返回鍵


  又長又無聊


  變身後有好一點


  加上女主角戲份開始變多


  觀影體驗也隨著女主角的美貌提升許多


  劇情的部分就真的沒什麼好談的


  很多橋段都很老派


  例如有人在看後照鏡的時候被藍甲蟲撞斷掉


  家人太熱情讓主角難堪


  還有我阿嬤超強


  加上一位深藏不露的技工


  像大雜燴一樣通通丟進鍋子裡


  卻吃不出任何味道


  藍甲蟲被抓住要轉移能力的時候


  說主角會因為這樣死掉


  突然之間又變成不會死掉所以你等等結束要幫我殺死他


  然後因為名字一直被上司叫錯就寧願犧牲自己救主角


  這一段到底是？


  不過到現在我還是不懂女主角到底是怎麼愛上男主角的


  不如把前面那一段無聊的劇情拿來鋪陳跟女主角相關的故事還比較好


  結尾彩蛋好像想拍第二集


  --'
