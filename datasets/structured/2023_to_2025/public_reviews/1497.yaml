title: '[好雷] 《藍甲蟲》女主角推薦'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這是今年必看

  看完 今年別的片都會變好看


  藍甲蟲 由來故事沒有

  喔就掉下了一顆球 沒了

  主角學人家Family 更是毫無刻畫

  也是沒敘述 就說好有愛

  然後一家人超吵超煩

  妹妹不好笑也不可愛

  是認真吵到你會煩躁的

  主角的嘴砲也不好笑

  啊奶奶故事多屌也只有下次再講

  是在？？？

  大概30分鐘 我這場真的有一個人離場了XDD

  （這場也只有三個人）


  結果描寫最多的故事是反派上尉

  最後還要犧牲 他媽的我差點在這哭了


  打鬥也超爛 你想要的超人類對打絕對沒有

  一堆都是光炮


  很多特效也很粗糙


  但也有點同情 這部從頭就像被放生

  亮點在預告全都暴了

  華納再爛都算會剪預告 以往都會藏一些

  很明顯連宣傳都沒預算

  特映也很少 路上海報也超少XD



  好雷的原因


  1.女主角很正 讓我沒離場的理由


  2.查克有工商XD


  3.有一首插曲不錯聽～一開始去科德大樓的時候

  （應該沒記錯


  嗯 請大家一定要去看





  --'
