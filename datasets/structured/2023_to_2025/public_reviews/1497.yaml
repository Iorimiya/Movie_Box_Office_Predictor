url: https://www.ptt.cc/bbs/movie/M.1700469263.A.E13.html
title: '[普雷] 藍甲蟲'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  因為之前都沒時間進電影院，最近覺得無聊所以就在哈米上面買了之前錯過電影

  院的《藍甲蟲》來看。


  畢竟已經過了幾個月的時間，大概知道票房跟各方評價都不太好，所以也沒有抱

  著太大期待，不過看完之後....感覺......還可以?



  是因為，幾天前上電影院看完《驚奇隊長2》的關係嗎?



  我真的覺得還可以耶。




  雖然劇情跟反派也都很公式化，但總覺得至少沒有驚奇2那樣，沒有笑點硬要擠笑

  點出來，而且甚至尷尬到不知道哪裡該笑。


  而藍甲蟲雖然也沒有笑點可言，但至少不會給我那種「ㄟ笑點在這裡快笑啊」的那

  種尷尬感。


  而藍甲蟲裡面角色們雖然給我一種大家都很用力在演的感覺，不過這點也比驚奇2裏頭

  的角色給我一種我到底在幹嘛的那種感覺好多了....


  這就好像是，藍甲蟲裡的角色、對白跟情節都很公式化沒錯，但角色跟對白跟情節就是

  規規矩矩地在它應該要出現時出現、情節要怎麼轉折怎麼發展時就那樣轉折那樣發展。


  可是驚奇2給我一種....演員們看完劇本大綱，然後就開始演出，演到哪算到哪的的一種

  非常隨便而且平面的感覺。



  而且最重要的是，BOSS強度夠，「居然可以打趴主角」，上演一段很公式化的「先被打趴

  但是靠著愛與勇氣獲得外掛般的力量逆轉BOSS，接著就在荷蘭弟蜘蛛人要對諾曼奧斯本痛

  下殺手之際，藍甲蟲系統用堅定的眼神傳達了不殺對手的俠義精神給荷蘭弟，最後反派B

  OSS帶著邪惡企業家一起爆炸同歸於盡。」的公式化結局。


  但我至少看到這樣一段有來有往的肉搏戰，以我對超級英雄片的標準來說，這可以啦這過

  關了.......至少大家的目的、善惡觀念、人物設定都很明確，只是比較傳統了一點。


  至於驚奇2的反派...呃我對她怎麼死的老實說已經有點印象模糊了......。



  大概是這樣，總結來說，如果你想要看到普通以下的藍甲蟲，就直接去看藍甲蟲，如果

  還想要看普通以上的藍甲蟲，就先去看驚奇隊長2....


  --'
