title: '[新聞] 好評如潮！DC《藍甲蟲》首波影評解禁'
content: "好評如潮！DC 超英大作《藍甲蟲 Blue Beetle》首波影評解禁「DC 的巨大勝利」\n\n\n\n隨著電影即將於 8 月 17 日正式上映，超級英雄電影《》的首波\n\
  影評也於稍早正式解禁。\n\n有意思的是，目前網路影評幾乎一面倒的給予「好評」，甚至有人稱其為「\n」且「」，主角 Xolo Maridue更被點名表現優異，還有人認為這部電影對\n\
  於家庭的刻畫很是深刻，是部集動作、娛樂性以及戲劇張力於一身的優秀作品。\n\n作為當前 DCU 的倒數第二部作品（最後一部為《》），《》同時也是 \n旗下首部以為主角超級英雄電影。\n\
  \n故事講述主角第三代「」Jaime Reyes（Xolo Maridue飾演）意外尋獲外星生物\n科技「」，從此改變其命運。\n\n以下為部分影評：\n\n\
  「《》真是太有趣了，出奇的感人！主角 Xolo Maridue的表現相當亮眼，這小\n夥子很有天份。導演 Angel Manuel Soto 將拉丁裔所謂的「隱形」轉變為真正的超能力\n\
  ，真正鼓舞人心。我現在也想知道 Abuela 的起源故事了。」\n\n\n\n\n「《》對流行文化的考究令人印象深刻。從《MACARIO》到《魔鬼銀爪 CRONOS》以\n\
  及《紅蟻俠 》。但更讓人驚訝的是，School of the Americas 在故事中起到了至關重要\n的作用，這是真正瞭解並關心拉丁美洲的一部作品。」\n\n\
  \n\n\n「《》對"
