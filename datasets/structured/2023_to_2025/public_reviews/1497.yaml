url: https://www.ptt.cc/bbs/movie/M.1690735710.A.B03.html
title: '[討論] 查導：期待帶著我的孩子去看《藍甲蟲》'
content: 'ELsPF_yJg



  剛剛查克史奈德導演在推特發文


  表示「期待帶著我的孩子們去看《藍甲蟲》。」


  並附上一張新海報。




  然後導演很快就在自己的推特回應了：「謝謝大師。謝謝您的善意舉動。作為您電影的粉

  絲，也是您拍廣告以來的崇拜者，您不知道這個舉動對我和我的（拉美）文化有多大意義

  。」







  /


  之前幾部DC電影上映，都沒看他特地出來發文


  而這張海報也是之前沒有公開過的


  我猜可能是華納或岡恩那邊傳訊息附上素材請他幫忙發個文宣傳


  好好先生的他沒多想就答應了


  不然實在沒理由突然發文幫一部跟自己無關、票房又估計會很慘烈的片打廣告


  而且導演還能迅速回應



  另外他這篇一發出來，三小時內流量就遠超過華納官方跟岡恩個人推特上個月的宣傳文了









  --'
