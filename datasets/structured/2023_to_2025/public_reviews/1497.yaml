title: '[負無雷] 藍甲蟲'
content: '我相信看到一堆負評八成沒什麼人會想看

  但還是不提劇情

  因為劇情全部猜的到

  沒錯

  就是你想的那樣

  完全沒有任何變化

  閃電俠還有梗這部完全沒有

  前半段鋪陳到想睡覺

  中間開始大用特效

  最後就是打來打去一堆閃光然後就沒了

  主角就是鋼鐵人+蜘蛛人+死侍綜合體

  招式造型都有這些角色的影子

  至於續集應該不可能會有

  但也許岡恩會把這角色納入正義聯盟串場其他片

  畢竟裡面的企業跟史塔克有87分像

  之後不繼續搞事怎麼行

  啊 這不是就是漫威路線嗎

  -----

  Sent from JPTT on my iPhone


