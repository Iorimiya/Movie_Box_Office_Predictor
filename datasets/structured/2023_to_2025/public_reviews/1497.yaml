title: '[新聞] 《藍甲蟲》空降北美冠軍！芭比將稱霸'
content: '《藍甲蟲》空降北美冠軍！《芭比》將稱霸全球、北美年度票房


  2023/08/21 06:58


  〔記者許世穎／綜合報導〕


  最新超級英雄電影《》，上週末（8月18至20日）初步統計以2540萬美金（約台

  幣8.1億元）空降，將同為華納兄弟發行、已連霸4週冠軍的《》

  請下冠軍寶座。


  不過邁入第5週的《》票房依舊強勁，初步統計再收2150萬美金（約台幣6.86

  億元）拿下上周末北美票房亞軍。




  DC最新超級英雄電影《藍甲蟲》，上週末空降北美票房冠軍。（華納兄弟提供）


  目前《》北美累積票房已高達美金（約台幣180.92億元），本週將正式

  登上，同時該片全球票房也已高達12.79億美金（約台幣408.12億元）

  ，預計本月結束也將登頂。




  《Barbie芭比》即將登上北美及全球年度票房冠軍。（華納兄弟提供）


  導演葛莉塔潔薇已憑《》成為，而該片和同檔上映

  的《》掀起的「芭比海默」（或譯芭本海默）效應也創下驚人的雙贏吸金力，已

  共同為全球帶來了近20億美金（約台幣638.2億元）的票房。


  《》持續在全球上映中，全台票房粗估已破台幣元。


  新聞網址：







  --

  華納重返農藥（？

  要超越（？閃電俠應該有點難度'
