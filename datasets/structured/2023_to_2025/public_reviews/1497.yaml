url: https://www.ptt.cc/bbs/movie/M.1693648744.A.C03.html
title: '[無雷] 藍甲蟲，還滿好看的啊'
content: '不知道藍甲蟲為什麼被大家說的那麼不堪


  因為我不是超級英雄迷，看的超級英雄非常的少，很討厭看超級英雄電影，還要了解先了解角色之前的故事與來龍去脈之類的


  藍甲蟲這觀賞門檻就非常的親民


  跟蟻人一樣，就是一個把自己故事專心說好的小格局電影，這樣我就覺得很棒了


  有人說藍甲蟲在漫畫裡面根本就是個小配角憑什麼上電影版


  可是他是不是配角我其實不在乎，因為我本來就根本不認識誰是主角誰是配角等



  優點


  節奏大抵都很流暢，看了蠻舒服


  動作戲很好看很絲滑


  專屬bgm很不錯


  男主角帥女主角美


  戰鬥風格跟其他超級英雄很不一樣，有做出特別的設定


  缺點


  有點幼稚，很適合國小國中的來看


  或許有一點老套公式化，起承轉合都有


  反派不夠強



  總之是一部很不錯的爆米花電影


  超級安全牌哪一種


  評分：7.4/10




  -----

  Sent from JPTT on my Google Pixel 6a.


  --'
