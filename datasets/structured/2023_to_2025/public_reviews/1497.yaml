url: https://www.ptt.cc/bbs/movie/M.1692580584.A.7A3.html
title: 'Re: [討論] 藍甲蟲北美票房爆炸'
content: '這部是HBO MAX訂購的

  在剛成立的時候華納董事局給了權限

  每年可以製作千萬鎂級別專屬電影

  而2020年又將大批發行電影直上MAX

  沙丘系列原本也是規劃首映當日串流

  但製片商發起訴訟阻擋華納這麼做

  會直接影響製片公司分成


  經過一年嘗試加上製片公司不滿

  首映當日串流收益也變差

  MAX並沒有給出很好回報

  扎斯拉夫正式上任華納總座

  對HBO及DC子公司製影視全都審查

  避免浮濫投資發生


  而結果是DC哈媽打發起的電影蝙蝠女

  直接在國稅局見證下人間消失

  用來抵近千萬的投資稅賦


  而MAX訂購的查寧塔圖-舞力麥克3

  也被拉上戲院在今年初美國上映

  由於目的本就是想借票房先行回收

  並沒有投入太多行銷

  只有剛剛好的電視廣告預算上檔銷售

  台灣幾乎不見戲院引進

  成本約4千5百萬鎂獲得5千6百萬鎂

  上映兩個月後即上MAX發行藍光和DVD

  華納認可這樣看起來不夠高的票房收益

  畢竟相較串流已經能短期收回成本


  而藍甲蟲同樣也是MAX出錢向DC訂購

  但花了八千萬鎂預算

  同樣不被扎斯拉夫接受

  但相較蝙蝠女被徹底毀滅

  他同樣獲得升級戲院的待遇

  同樣藍甲蟲也只有剛剛好的行銷預算

  若真的徹底毀滅馬上就拉回MAX

  若剛好達到票房成績打平

  同樣3個月後才上串流並壓製藍光及DVD


  所以很多人不理解為啥這部能上戲院

  但對扎斯拉夫來說

  花八千萬鎂等串流點擊數字

  慢慢的攤平會計帳

  才是更不划算的產品

  其實昨天半夜美國媒體對藍甲蟲報導

  就沒有認為票房真的爆炸

  也就跟他電影本身一樣

  中規中矩的表現

  雖然類比其他英雄大片不行

  但他本來原始待遇就沒被期待拯救華納

  只是串流服務節目表中一個選擇而已



  -----

  Sent from JPTT on my Xiaomi Redmi Note 8 Pro.


  --'
