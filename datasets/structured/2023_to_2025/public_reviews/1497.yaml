title: '[新聞] 藍甲蟲終結芭比冠軍霸業 超英仍難再起？'
content: '「藍甲蟲」終結「芭比」冠軍霸業 超級英雄仍難再起？


  2023-08-21 21:24


  聯合報 記者蘇詠智／即時報導




  「藍甲蟲」女主角布魯娜馬爾科辛（中）俏麗搶眼。圖／華納兄弟提供


  今夏締造票房奇蹟的「」，全球票房雖然逼近13億美元，在北美地區終於被

  最新英雄電影「」逼下冠軍王座，「」北美首周末票房約為2540萬美元，全

  球首周末票房總和近4340萬美元，而且除了在北美之外，、印尼、馬來西亞及拉丁美

  洲的墨西哥、巴西等地都是，不過美國娛樂媒體仍不認為超級英雄電影有望因為

  「」的首周末賣第一而提振行情。


  相較於新冠肺炎疫情之前，超級英雄片無論票房或口碑上都有明顯的衰退，開年至今也只

  有「星際異攻隊3」和「蜘蛛人：穿越新宇宙」算得上叫好叫座。


  「」美國影評成績比起這一年來推出的「黑亞當」、「沙贊！眾神之怒」和「閃

  電俠」都好，卻因為美國演員、編劇工會雙罷工，宣傳重任都由導演安傑爾曼努爾索托一

  肩扛下，實在很難跟演員主打的戰力相比。


  其實「」男主角之前主演「」系列的續篇影集「

  」時，就累積了不少影迷，他在「」演出也獲好評，倘若能夠強力宣傳，很有機會

  脫穎而出、成為影壇搶手新秀，無奈時機不佳，也只能接受。


  「」的首周末冠軍票房在數字上仍與其他DC英雄片有一些些差距，沒有能夠再創高

  峰。


  在「」後，英雄片只剩下尚未挪後檔期、預計年底推出的「」，這部片

  因安珀赫德和前夫強尼戴普的世紀官司，早就未演先有一堆話題，各方矚目安珀的戲分剩

  多少，許多黑粉都高呼抵制，讓電影公司為此頗傷腦筋。




  「藍甲蟲」在美國、台灣、墨西哥等地都登上票房冠軍。圖／華納兄弟提供




  索洛馬里達那（中）在「藍甲蟲」表現頗有好評。圖／華納兄弟提供


  新聞網址：








  --


  搞不好有機會'
