title: '[新聞]【鬼太郎誕生：咯咯咯之謎真生版】2/7台映'
content: '新聞網址：



  引爆觀眾淚腺潰堤的日本話題動畫電影《鬼太郎誕生：咯咯咯之謎》，接續好評推出恐怖

  升級版《鬼太郎誕生：咯咯咯之謎真生版》，台灣片商並在今年元旦舉辦「4DX元旦特別

  場」，廣獲來參加的粉絲熱烈好評。因應廣大台灣影迷的期盼與敲碗，「采昌國際多媒體

  」順勢宣布《鬼太郎誕生：咯咯咯之謎真生版》確定將在2月7日於全台正式上映，並將同

  步上映4DX版本，消息一出，更是引發網友熱烈討論。這部比原版更加恐怖的《鬼太郎誕

  生：咯咯咯之謎真生版》，不僅血量大增、血液更鮮紅，製作組也精修人物與背景，並調

  整聲音，讓品質提升、沉浸感更強烈。而這個全新版本在去年於日本上映之後，也是佳評

  如潮，首三日便達到1億5600萬日圓的票房佳績。巧合的是，原先2D版是去年2月7日在台

  灣上映，這次是在「整整一年」之後，再度於台灣呈現升級的真生版，也請粉絲千萬不要

  錯過在大銀幕的觀賞機會！





  調整327個畫面，並讓恐怖感更加升級的《鬼太郎誕生：咯咯咯之謎真生版》，在上週三

  （1/1）搶先舉辦「4DX元旦特別場」後，廣獲粉絲熱烈好評，紛紛大讚：「4DX特效我給

  100分！」「共感強烈！」「畫面真的更細緻！」而沒有成宮參與到的粉絲，也大力敲碗

  希望本版本可以正式在台映演。就在粉絲們的千呼萬喚之下，台灣發行商也順勢宣布《鬼

  太郎誕生：咯咯咯之謎真生版》將在2月7日於全台正式上映，不僅引進2D版本，更將同步

  上映4DX版本！值得一提的是，「真生版」距離去年2月7日上映的2D版《鬼太郎誕生：咯

  咯咯之謎》正巧相隔完整一年，睽違一年得以再於大銀幕上觀賞到這部感動好評之作，粉

  絲們務必把握進戲院欣賞的機會！





  比原版更加恐怖的《鬼太郎誕生：咯咯咯之謎真生版》，是製作組歷時數個月經心調整的

  「再升級版」，不僅血量大增、血液更鮮紅，也精修人物表情、重製部分背景，讓真實感

  更加顯著。擔任角色設計與總作畫導演的谷田部透湖分享：「這次不僅是角色，就連一些

  背景美術也進行重製，甚至還有改變部分畫面的角度。角色的更新、動作的變化、背景的

  變動，甚至它們的結合，都是以大大小小的形式修正。雖然沒有新增全新鏡頭，但就工作

  量來說，確實還是相當龐大。」此外在聲音部分，製作組也同樣進行調整，讓整體品質提

  升、沉浸感更加強烈。



  「真生版」在去年於日本上映後也再度大賣，上映首三日便達到1億5600萬日圓票房佳績

  ，觀賞過的日本觀眾也紛紛給予好評，大讚：「4DX真生版的動作場面，更能感受到動作

  的快速與緊迫感！」「儘管已經看過，但還是有種新鮮感！」「真生版更加毛骨悚然！」



  這部更加震撼的全新版本《鬼太郎誕生：咯咯咯之謎真生版》，即將在2月7日於全台正式

  上映，並將同步上映4DX版本。本片劇情描述昭和31年（西元1956年），暗中掌控日本政

  商界的龍賀一族支配著哭倉村。在血液銀行工作的水木（木內秀信配音），為龍賀一族的

  當家「時貞」（白鳥哲配音）的死去進行弔唁。此時，鬼太郎的父親（關俊彥配音）為了

  尋找失蹤的妻子，也來到了這個村子。就在龍賀一族為了繼承時貞的遺產而展開醜陋鬥爭

  時，一名家庭成員卻在村莊的神社裡慘遭殺害。緊接著，一連串恐怖離奇的連鎖事件也相

  繼展開。在壓倒性的絕望當中，鬼太郎的父親與水木的命運也即將產生轉變…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
