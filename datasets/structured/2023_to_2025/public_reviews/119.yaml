title: 「影壇巨星」 Clint Eastwood 克林伊斯威特 被爆完成下部作品後退休
content: '「影壇巨星」 Clint Eastwood 克林伊斯威特 被爆完成下部作品後退休




  憑《鏢客》以及《緊急追捕令》兩大系列而縱橫影壇超過半世紀的好萊塢巨星

  克林伊斯威特（Clint Eastwood）雖然已92歲，但他仍然活躍於影壇

  每隔一兩年就有導演或演員作品問世。

  不過近日有傳他拍完下部作品之後就會結束導演生涯！



  克林伊斯威特早年憑「鏢客」一角走紅。



  其後憑《緊急追捕令》系列令他登上事業高峯！



  已92歲的克林伊斯威特將開拍最後一部電影。



  尼古拉斯霍特將成為克林伊斯威特最後一部電影男主角。



  東妮克莉蒂。


  據知他將執導以法律為主題的驚慄電影《Juror #2》，

  並由尼古拉斯霍特（Nicolas Hoult）以及東妮克莉蒂（Toni Collette）擔任男女主角。

  雖然今次將會是克林伊斯威特最後一部導演之作，

  但有指他未來可能會繼續主演及監製其他電影。

  新片故事講述一單謀殺案的陪審團成員懷疑自己與受害者的死有關，

  他最後會利用陪審團的身份來保護自己還是自首。



  90年代憑《殺無赦》勇奪奧斯卡最佳導演。


  今次將會是克林伊斯威特入行以來的第40部作品，

  他執導的《殺無赦》（Unforgiven）以及《登峯造擊》（Million Dollar Baby）

  先後為他贏得奧斯卡最佳導演及電影。



  克林伊斯威特奠定鐵漢形象。


  關鍵字 美國 克林伊斯威特


  東網


  --


  我沒那麼厲害精算到後續發展好不好

  我祇是覺得原本東網因為是香港翻譯成「奇連伊士活」

  這大家可能一時間根本想不到是誰，搞不好還想成「Killer・奇樂」咧

  因此好心服務改成我們臺灣藝名克林伊斯威特前面同時放上原名Clint Eastwood以示尊重

  那我其實很好奇當初究竟為什麼會把 Eastwood 翻成伊斯威特？

  確實是比翻成伊斯伍德好聽沒有錯啦，但為什麼這樣翻呢？

  　


  PTT桌機版標題長度有限的關係

  我相信用手機版看應該是顯示完整標題的'
