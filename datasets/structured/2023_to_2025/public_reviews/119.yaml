url: https://www.ptt.cc/bbs/movie/M.1431790545.A.EA4.html
title: '[好雷] 魔法黑森林(Into the Woods)'
content: '我會歸類到交作業電影，以下有雷














  1雖然是顛覆童話但是還是童話的範疇，差別是文本的讀者對象不是兒童而是成人，主題

  仍然是成長，另個角度來看，其實四個童話還是遵循"離家→冒險→挫折成長→歸家"，值

  得讚許的是電影保留戲劇語言和敘事結構，音樂性比瘋狂理髮師更豐富，ha ha，瘋狂理

  髮師純粹是為了看男主角。


  2裡面充滿無數的對造組，同樣是單親成長的主角,大人對比小孩，男生對比女生，傑克媽

  媽與女巫，男生對比女生等等。


  3王子腦袋有洞?還是為了對比溫室養出來的是蠢貨?太蠢了可以得到獨立的一點，兩個王

  子在河邊唱歌讓我覺得根本是中二屁孩啊啊啊，我比較痛苦，不我比較痛苦，現在是瓊瑤

  還還是唐伯虎在華府門口跟人家互比?


  4女巫太帥了我愛你!不過女巫都是老梗問題重現，梅姨唱stay with me還是得到我的眼淚

  感覺全場只有我在哭，女巫身上就是體現人生不是只有黑或白(圓形人物)，另外就是我覺

  得在對Rapunzel時真的是一個媽咪呀呀~<She''ll back>再看她唱<Last Midnight>,I''m ju

  st right, I''m the Witch,多數不一定是正確，而正確很常因為多數暴力而變成錯誤，不

  過女巫幹嘛死呢？她明明這麼有power,太可惜了真是!難道是要呼應天才都是寂寞，女巫(

  有能力的女子被汙名化的消滅，女性文學範疇了這個，不過女巫的毀滅並不是東方式的來

  自同性加諸的迫害，可以再討論一下女巫被賜死的原因是否雷同杜十娘一樣，來自於戲劇

  的需要)。


  5小紅帽根本是性教育童話故事，很多小女孩的童話故事都要談論到女性由孩童成長到成

  人所面臨身體與心靈上的轉變與探索，不過我覺小紅帽相對於傑克來說有點薄弱，因為小

  紅帽的家庭部分被弱化。


  6傑克從悲慘世界的小革命份子變成殺人犯，需要友情的背後是不是應該反思得不到友情

  的癥結在哪裡？巨人給予友情但是得到傑克的偷竊與背叛，傑克的行為被默許(小紅帽提

  出巨人是否無辜卻必須被殺死，從女性角度看男性被英雄化？非我族類是否等同於其心必

  異?)傑克究竟是不是戀牛啊？為何巨人比不上他的母牛，忍不住要歪掉想到西斯的某個創

  作文章......(原po自首十分糟糕)


  7麵包夫婦戲份超重竟然沒有給個姓名，作者你怎麼這樣啊！不過外遇橋段讓我大傻眼，

  是否能視為幸福結局不存在的代表，童話的結局是王子與公主從此過著幸福的生活，然而

  演繹出來的幾乎是婚後沒有幸福生活，於是超想有小孩，有小孩後才覺得有小孩也挽回不

  了婚姻，必須要一方死亡或是換個對象才能解決問題(灰姑娘就是後者)。


  真的是很適合寫報告的一篇電影，其實還可以寫很多，但是懶了，而且我漏寫了灰姑娘，

  哈哈哈誰叫她沒辦法用歌聲呼喚蟑螂跟老鼠，整場看完我都沒發現明日邊界的女主角是麵

  包店老闆娘太震驚了！


  如果用法律或是心理疾病的角度來看應該也很有趣，報告也可以把這兩個角度寫進去，科

  科。


  但是還是覺得百老匯版本比較喜翻，

  Rapunzel發瘋、傑克媽被打死比較有張力。


  電影真的不錯看呀～一點點心得推薦大家。



  --

  Sent from my Android


  --'
