url: https://www.ptt.cc/bbs/movie/M.1450061424.A.7C4.html
title: '[好雷] 好萊塢結局（Hollywood Ending）'
content: '網誌版：






  [心結] 我不敢說真話。


  電影從曲高和寡的落魄導演展開：

  Val 是一位在七零、八零年代拿過奧斯卡的導演，如今卻只能導演一些商業的商業電視廣

  告。起初，生活寬裕，每當他的構想和委託人不合，他可以瀟灑的辭職不幹。隨著委託案

  件減少，Val開始面臨失業、入不敷出的窘境。


  在生活壓力即將壓垮 Val 的當口，前妻 Ellie 向製片家男友推薦 Val 擔任一部商業大

  片的導演，報酬優渥。這時 Val 為了生計，放下原則，接下工作。沒想到因為壓力，竟

  在電影開拍前夕得了「心因性盲」（psychogenic blindness）。


  在經紀人好友的幫助下，Val 隱藏自己看不見的事實，在眾人面前上演了一場假裝耳聰目

  明的大戲。



  § 誰是贏家 / 誰有權決定誰是贏家？

  做為一位獻身電影工業多年的導演、編劇，伍迪．艾倫回頭通過電影《好萊塢結局》，拿

  自己熟悉的娛樂文化，向觀眾提出一個不容逃避的問題：「你是否真誠的面對自己的品味

  ？」


  這是一個很有意思的問題，讓我想起 06 年，《斷背山》（Brokeback Mountain）入圍奧

  斯卡八項大獎，典禮前，台灣媒體紛紛預測該片很有機會奪下最佳影片殊榮。頒獎結果出

  爐後，部份網民對於最佳影片頒給另一部電影《衝擊效應》（Crash）深感氣憤，都說李

  安拿最佳導演是安慰獎，是獎項分配的結果。


  那時候 PTT 電影板有位網友撰了一篇短文，大意是：任奧斯卡評審的電影學會，他們的

  品味向來一致，所謂「奧斯卡就是奧斯卡，不是柏林，也不是坎城或其他的電影獎」，奧

  斯卡一直都是帶有濃厚的商業、好萊塢色彩，大眾取向，並且有一定的保守度。


  金馬獎也有金馬獎一貫的取向與風格，在這裡成功或失敗，都不表示一部作品直接晉身影

  史「影史經典」之列，或毀滅性的影像垃圾。


  回過頭看，假設 PTT 是一項電影獎，它的本質是什麼？不就是讓許多鄉民可以在上面高

  談闊論，發洩情緒的頒獎臺。裡頭有一道主流的政治氛圍和意識型態，任何人都沒辦法要

  求 PTT 變得近乎絕對完美的客觀，這不現實，也沒必要。


  還有其他論壇，正如還有其他許許多多的電影獎（不談高度，就談取向）。


  又好比誠品書店牆上那片排行榜，時間才能檢證一部作品的本質，以週或月為頻率變化一

  次的排行榜，是否能檢證一本書的價值？回過頭來談，一部電影假如吵兩天就被遺忘，那

  這部電影的價值大概也謹此而已。


  回顧當年奧斯卡，入圍佳片，甚至更多因故沒有參加影展的電影，有多少人都看過呢？搞

  不好看完之後，心中的首選既不是《斷背山》，也不是《衝擊效應》。



  § 國王 / 臣民

  《好萊塢結局》，像是安徒生筆下《國王的新衣》現代諷刺版。


  《國王的新衣》描述國王因為害怕承認自己的不聰明，所以明明知道自己身上一絲不掛，

  仍然假裝身穿騙子裁縫聲稱「只有聰明人才看得見」的華服出巡。國王身邊的臣子與隨從

  ，以及路上民眾，有的畏懼國王手握生殺大權，有的不希望自己被歸類為不聰明的人，都

  不敢聲張自己眼前所見的是一位赤身裸體的國王。


  結果天真的孩子一語戳破謊言，點出國王的愚蠢。


  伍迪．艾倫通過《好萊塢結局》重新詮釋了國王的新衣，在他看來，愚蠢的不只是國王，

  騙子也不僅限於裁縫。實際上，滿城皆是騙子。


  國王被欺騙，是因為他的虛榮心作祟，所以他不敢承認自己的愚昧，以至於寧願冒著赤身

  裸體的風險，還是大張旗鼓地遊行。而身邊那些同樣因為虛榮，或是礙於國王權勢的臣民

  們，他們對國王說謊，同時也對自己說謊，他們都不是誠實的人，同是愛慕虛榮的人。



  § 比特幣 / 紙幣

  然而，環視我們身處的社會，回想我們成長過程中，長輩們的諄諄教誨。試問《國王的新

  衣》故事中那位孩子口中所說的就是真相？他真的戳破了國王的新衣？


  在一個社會，如果絕大多數的人都相信胸大是美的、英式英語比美式英語好聽，那極為少

  數站在反對意見的人，他們認同的概念是呈現了主觀的立場，還是客觀的視角？


  許多我們習以為常，被多數人認同的概念，對電影、對時尚或對那些被人們視為真理代名

  詞的權威，都具有某種同質性：「大眾造就的產物」。


  從事電影工作的法國哲學家居伊．德波（Guy Debord）曾諷刺的形容大眾文化的盲目性，

  廣告的效力取代了商品本身的真實價值，人們狂熱的追逐時尚，而這股盲目追求的浪潮本

  身又成了另一種商品，造就了奢侈品儘管具有不合理的價格，卻有一群荒謬的信徒不問究

  理的追捧著。


  為什麼我們要反過來認同少數人口中的概念，而不相信多數人認同的概念？好比在《國王

  的新衣》故事裡，國王對世人展現自然的胴體，相對希臘以來的裸體雕塑、繪畫等作品之

  美，會不會其實比各種人造的華服，更具有美的超越性？無論我們站在哪一個立場，我們

  能否明瞭我們認為一個事物為美的原因，乃是因為我們發自內心的感同身受，還是受制於

  他人的意見？我們是否在審美的過程中，真正做自己。


  借用德波的概念，國王身上那件不存在的衣裳，是經由廣告、宣傳創造出來的「宗教狂熱

  」產物。對權力的服從，對自身虛榮心的臣服，是通過當權者（國王/電影工作者）與心

  甘情願的受壓迫者（臣民/觀眾）對權力化身的「虛幻的共同體」（communauté

  illusoire）的盲目信仰。盲目信仰，致使我們做了一個接著一個，言不由衷的審美判斷

  。


  這件虛幻的衣裳，宛如數位時代被人們創造出來的比特幣，做為電子貨幣，表面上具備各

  國紙幣流通、兌換的功用，但它的價值和背後的信用體系是虛幻的——沒有黃金（如台幣

  對應台灣中央銀行的黃金儲備），或任何國家（如美金對應美國在國際間的信用擔保，受

  美國聯邦儲備系統管理）的信用可做為擔保——在人類的欲望與投機心理下，儘管隨時可

  能泡沫、倒閉，卻依舊有人冒著極高的風險加以投資。然而，比特幣就像任何一個網路遊

  戲裡頭的遊戲幣，隨時可能因為遊戲下架，不再具有功能，甚至消失。


  那些吹捧比特幣的人，如同那些為國王的新衣喝采的人，高喊「國王的新衣」存在，卻沒

  有人真正能觸摸到它。但這就是社會的有趣之處，有時面對的明明是虛幻的共同體，卻樂

  於承認其存在，只為了證明自己不是笨蛋，或者高人一等或其他非腳踏實地的因素。


  人們對權威與價值體系的盲信，反而使人遠離的真相，同時遠離了我們自身原初的判斷。



  § 典型 / 非典型

  Val 在失明的狀態下拍完了電影，Ellie 的製片男友和其他人坐在螢幕前都看傻了眼，他

  們看見一部不知所云的影像堆疊。果然，這部電影在美國一上映，便成為美國毒蛇評論家

  筆下的垃圾，觀眾眼中的廢棄物。


  正當我們以為伍迪．艾倫又在陳腔濫調的諷刺好萊塢製片方過份追求商業利益，忽視電影

  的美學內涵。電影立刻倒打一耙，Val 亂拍一通的電影，竟在法國評論家眼中成了充滿意

  義、手法新穎的世紀佳片。


  看著 Val 從狗熊變英雄，好似風向一轉，伍迪．艾倫貌把「藝術品味的盲從」利劍，無

  情刺向高談藝術美學闊論的法國電影圈。


  若更退一步看，會發現若觀眾為結局感到滿意——因為最後看到男女主角得到善終——為

  他們高興之際，其實形同落入一個最典型的「好萊塢結局」框架之中：主角威能，無論中

  間劇情多麼狗屁倒灶、邏輯不通，最後必定善有善報、惡有惡報，主角大獲全勝。



  § 我的結局 / 你的結局

  光靠騙子的嘴巴，無法創造出國王的新衣，是國王和眾人的自我欺騙，造就這件「薄如蟬

  翼」的華服存在。


  或許伍迪．艾倫所要諷刺的既非好萊塢電影圈，亦非法國電影圈，而是那些看見國王露出

  大肚腩，卻睜眼說瞎話，鼓掌叫好的評論家和觀眾。


  「明明不喜歡一部電影」或「明明不覺得這部電影像某位影評人說得那麼好」，卻為了顯

  示自己的品味同樣不凡，或礙於朋友圈的多數意見，所以我們放棄自己的真實感受和意見

  ，通過承認不存在的事物，我們欺騙了自己，遠離了我們自己的本意。剛開始，我們會反

  抗外人與社會強加的錯誤價值觀，但當我們一次、兩次讓步，開始習慣指鹿為馬的社會風

  氣，我們就無法真做我們自己。


  電影播畢，我彷彿聽見伍迪．艾倫吃吃的笑聲，但我不敢跟別人說，我怕他們覺得我瘋了

  。



  [解語] 說真話，並不因為真話必然高尚，但我們能在真話中見證自己昂然獨立的勇氣。






  網誌版：




