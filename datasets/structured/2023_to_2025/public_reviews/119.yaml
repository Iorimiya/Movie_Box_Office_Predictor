title: '[心得] The Woodsman 觀後感'
content: "本文同步刊登於中央情報局鍾情電影版\n----------------------------------------------------------\n\
  \n鏡頭語言帶著中性觀點而不置可否\n只是忠實地表現出弱勢族群的生活情況與心理狀態\n\n浪子回頭金不換\n這種冠冕堂皇的話語任誰都說得出口\n但真正面對時卻重重考驗著在主流價值觀中形成的道德與良知的標準：\n\
  只要不在自己身旁週遭都是無關緊要的旁枝末節\n一但有接觸到自我生活就變得茲事體大\n而近乎潔癖地排斥與抗拒接受\n\n一個甫出獄似乎有意改過自新的戀童強暴犯\n\
  是否真無法避免地必須持續承受眾人異樣眼光\n任何可能涉及的情狀都得接受警方無情地攻訐與懷疑\n\n\n我什麼時候能回復正常？\n\n\n一個期盼能自然低調回歸大環境的曾經犯錯者\n\
  難道比其他名似清白卻以身心理層面的暴行\n極力排除異己的所謂正常人來的低下嗎？\n\n\n真有所謂正常嗎？\n\n\n若是有  其間分野該由誰來界定？\n若沒有\
  \  那我們所身處 Walter所殷殷期盼者究竟為何？\n\n\n片中沒有指明Walter究竟是強暴者或是戀童傾向的強暴者\n但就他自己所述\"從不傷害她們\"\
  以及不斷注意隔壁校園內的學童看來\n應該是出於自身的戀童傾向而導致犯下罪行\n\n有時我不禁想要問：為什麼無法壓抑不合社會規範的想法？\n          \
  \        為什麼有不符合社會規範的行為產生？\n                  為什麼會產生難以適應社會規範的人？\n              \
  \    為什麼違背了社會規範就得遭受逞罰？\n                  為什麼社會無法真正包容千百萬種人？\n                  為什麼反而要人們努力遵守社會規範？\n\
  \n這不是反社會\n這是反省著我們再熟習不過的生活模式\n其間意義究竟何在\n\n全片畫面多為中低階層藍領階級的灰濛簡樸\n呈現主角近乎封閉人際往來般的衿力自持\n\
  正好面對著兒童公園的公寓窗戶\n幾乎也是諷刺般地考驗著他的心智與精神\n和熟人的言談間也多呈現出過去身旁所認識的人對於犯罪入獄者的難以接受\n\n犯罪者所付出有形無形的代價往往為一般人難以想像\n\
  那也絕非一句罪有應得就能夠道盡的心痛與沈重\n如果犯罪的原因真是出於本能的難以控制呢？\n把過錯全部歸咎於犯罪者本身不也是一種推卸責任嗎？\n而事實上真正承擔過錯者還包含了犯罪者身旁周遭的親友\n\
  這又是該如何才能釋懷的沈痛與罪責呢？\n\n若說無法接受犯罪者是否表示得自輿論般的無知與缺乏包容力\n若說可以接受犯罪者是否表示對於罪行本身似乎變得能夠接受\n\
  只有複雜與矛盾能夠形容\n\nKevin Bacon飾演的Walter雖極力壓抑\n但仍看得出他亟欲回歸社會再過正常生活的心情\n而一邊接受詢問一邊回想過往傷痛的情緒醞釀\n\
  鏡頭直接鎖定在他肩部以上的特寫\n非常能夠看出他這些年來所累積的深厚演技\n\n遭受警探懷疑怒斥時那副壓抑卻極度受委屈\n深刻受傷疼痛卻又無奈的內斂神情\n既內斂又活靈活現地表現出了這個角色極欲內心深藏\n\
  卻也必須時時刻刻提醒自己的極度矛盾\n仿若翻湧苦楚梗在喉頭卻無處可吐露\n\n影片將近結束時他一拳拳打在Candy身上\n不只是譴責著怒罵著悖離社會常規的行為\n\
  似乎更怒吼著控訴著自身所受歧視的傷痛\n卻仍舊必須回歸大環境主流價值的矛盾與無助\n\nKevin Bacon那略帶乖張的外型\n讓他從年輕時就演著我行我素的角色\n\
  無論是經典西部牛仔加怪獸電影Tremors\n或是經典驚悚與醫學類型電影Flatliners\n總是演出天不怕地不怕般的輕狂年少\n當這份叛逆轉換為獨立於社會常規外的天然外放\n\
  在The River Wild和Hollow Man的反派角色\n就都帶有他個人風格的傲桀難馴\n\n之後這種難為大眾所容的特質成功昇華為\n總是受到迫害與歧視的弱勢族群般的難為及無力\n\
  像是在Digging to China中的智障以及本片中的Walter\n同樣都是抱持著自身獨有傷痛而顯得社會適應不良\n是一個非常傑出而且能轉換多種角色特質並表現出極大差異性的演員\n\
  \n雖然這是Hannah Pilkes第一部演出的電影作品\n但她飾演最關鍵的角色Robin展現了超乎尋常的演技\n無怪能夠入圍2005年年輕演員獎的女配角最佳表演獎\n\
  \n而主流價值代表者的黑人警探Mos Def\n片中持續地以所謂正義知名近乎迫害地對待Walter\n最後發現一直怪罪的對象似乎並非如開始所想那般\n似乎責怪自己又顯內疚的複雜情緒切盡外顯\n\
  想來也是憑著這一小段精湛演出\n讓他獲得了黑膠捲獎的獨立影片最佳男演員\n\n片中最讓人難以釋懷的角色\n大概就是十分驚喜地由黑人饒舌女歌手Eve飾演的Mary-Kay\n\
  這個角色的個性定位似乎過於簡單直接而顯得主流化了些\n即使可以說沒有這樣的觸發也不會有之後的事件產生\n我還是覺得有點可惜了\n\n\n這樣沉重的作品中\n沒想到還隱藏了些許的黑色幽默\n\
  被Walter窺伺著並稱為Candy的男性即將誘拐男童的當兒\n居然出現了類似拳擊賽轉播的旁白……\n\n--\n☆★   終於開始了  我的電影觀後感文章Blog\n\
  \       有電影海報  有文字感想  有我....有你\n                ☆★\n\n--\n◆ From: 218.168.55.202"
