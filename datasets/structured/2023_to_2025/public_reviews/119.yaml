title: '[LIVE]原罪犯(Oldboy) @ Hollywood台'
content: '蠻震撼人的結局


  看過的不要爆雷啊


  簡介:




  (2003)本片獲得坎城影展評審團大獎，《原罪犯》是韓國導演朴贊郁「復仇三部曲」中最

  巔峰的作品，是根據日本知名的漫畫所改編。


  《原罪犯》是導演朴贊郁響譽國內外的「復仇三部曲」－《復仇是我的手段》、《原罪犯

  》及今年威尼斯競賽片的《選擇》等復仇電影之最。它的獨樹一格，讓全世界影迷都為之

  瘋狂，甚至朴贊郁導演的最新作品《選擇》都無法超越。


  《原罪犯》劇情描述大修（影帝崔岷植飾）有天夜裡突然被綁架，並無緣無故地被囚禁了

  15年，囚禁期間，他從電視中獲悉了妻子去世，自己更成為殺妻的疑兇。某天他突然獲釋

  ，但卻被迫要在五天內找到他被囚禁的原因，而這時已重拾自由的他，不得不全面展開報

  復行動…。


  本片日本版權已220萬美金賣出，創下了韓國電影的最高的出口價格記錄！朴贊郁在韓國

  創下的記錄還不只如此，今年在水都問鼎威尼斯金獅獎的他也像李安一樣，刷新了韓國電

  影史的記錄，成為唯一獲邀參加了歐洲3大影展(坎城影展、柏林影展及威尼斯影展)的韓

  國導演。


  --

  劇情最關鍵就是限制級的部分- -'
