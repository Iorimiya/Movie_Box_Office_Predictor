url: https://www.ptt.cc/bbs/movie/M.1426053614.A.D87.html
title: '[好雷] 成人世界之沒關係,是Die Antwoord阿'
content: '昨晚看了成人世界

  過了一個晚上還是覺得好歡樂所以來發感想了





  為了怕爆雷還是防雷一下



  不過,去看電影前先看看這部MV吧(內有血腥,慎入)



  DIE ANTWOORD - PITBULL TERRIER




  ----------------------------------------------------------------------



  不知道有多少人聽過Die Antwoord這個團體

  我是在隔日去找查皮相關資料的時候才發現的


  我就說嘛為什麼尤蘭蒂的聲音一直有種熟悉感

  如果把Die Antwoord的所有音樂都聽一次就會發現....



  ,完全沒有試圖改造一下Die Antwoord的形象

  MV怎麼穿劇裡就怎麼穿

  MV什麼場景劇裡就什麼場景

  MV會說什麼劇裡也就說什麼話


  難怪明明是唱歌的,演起戲來完全沒有生澀感

  連髮型都沒變阿尤蘭蒂你會不會太數十年如一日





  成人世界,演的根本不是什麼機器人

  ,兩小時版的


  如果看片之前有這個認知

  爽度會增加很多,真的


  你不會去計較MV裡面為什麼忽然出現一把鏟子可以揍人

  你不會去想想為什麼MV打到一半,壞人會叛變改幫好人

  你不會去考慮為什麼MV裡人躲得好好的,硬要出來埃個子彈死一下刷刷存在感

  更不會去想什麼,機器人具有意識之後跟真人的差異之類的哲學性問題


  是嘛~看個MV而已,出現豬在飛都不奇怪了~

  變成豬一般的隊友算什麼呢你說是吧~~(愉悅)


  所以我們就不要計較尤蘭蒂的NPC行為跟忍者的教壞小孩了

  我想這就是所謂的認賊作父了吧




  接下來我們談談迪昂(Deon)這部分

  迪昂的行為很明顯可以看的出來這廠區管理不善(真心)

  你看金鑰都可以隨時要拿就拿丟了兩三天還沒有人找

  還要等下一個偷用的人才發現不見

  最後竟然隨便就插在電腦上了阿阿阿


  這麼重要的東西用USB公規好嗎?

  隨插隨用沒問題嗎?不用再做一點防護措施嗎阿阿阿阿


  然後機器人也是,那麼一大堆東西幾箱的,說帶走就帶走了

  進出廠區都不用搜車的,每次看迪昂進進出出的搬東西把公司當自己家

  就有種在玩RPG遊戲的感覺...配上NPC尤蘭蒂更像了....


  該說幸好他們進出還知道要刷卡嗎...




  文生(Vincent)根本就是只想玩機器人的中二病阿...

  為了能玩機器人還把人家系統搞當機了..

  好好拿著你的神經傳導頭盔這技術轉賣出去不是很好嗎...


  看他的麋鹿被打爆的時候我都要默默哭了

  唉,金鋼狼怎麼就這樣啦~(跺腳)




  查皮(Chappie)就是蠢萌蠢萌的

  耳朵一轉一轉地很可愛,然後演查皮那個真人其實蠻帥的

  (請參考  )







  整體來說劇情的流暢度,雖然有哪裡怪怪的,但還算順

  最後是個快樂結局,很棒

  只有美國佬死的有點兒悽慘...他是Die Antwoord的成員嗎?


  對我來說一部片子,畫面好節奏棒

  結尾不要讓我猜到,不要挖太多坑又不埋

  就是一部好片


  照這個標準成人世界是好雷阿,期待第二集MV





  --

  是吧是吧~

  其實他們不算很主流的...只是莫名的就跟這部片好搭

  而且上面那篇影評實在太長!!


  我還是找OST的時候才發現Die Antwoord,可以上色一下嗎!!


  推~坑~成~功~

  快看快看!!

  記著,他不是要講什麼沉重的大道理

  就是一部紀錄片,紀錄南非,紀錄音樂,以饒舌的格式


  我倒是完全沒有認出來...只覺得整部電影都很微妙XD


  Rich Bitch超好聽的~我比較愛這首


  你好不包容!!!


  是MV(更正個毛)


  不能用機器人的觀點來看這部片阿XDD

  你會被雷死XD


  女生演NPC超成功阿

  她在MV裡也是這個路線'
