url: https://www.ptt.cc/bbs/movie/M.1255246230.A.BBD.html
title: '[好雷] Taking Woodstock 胡士托風波'
content: "兩個很多當時照片的網頁：\n\n40個你所不知道的Woodstock：\n\n\n\n雖然電影的故事背景是1969年8月15到8月17日的胡士托戶外音樂節，\n\
  但在影片中我們其實沒看見演唱會的中心，除了能看見舞台的人在五\n十萬人中實在算極少數外，影響後世最大的也不是演唱會本身，而是\n色彩繽紛的嬉皮，在六零年代的在美國與全世界，掀起的波瀾。胡士\n\
  托音樂節則是革命的里程碑。\n\n維基上對於嬉皮的普遍定義為：超脫制度、抵制中產階級價值、反對\n核子武器與越戰、尊崇東方哲學、捍衛性解放，多為素食者且愛好大\n\
  自然、提倡使用迷幻藥解放人類的意識、組成共同生活的小社群。利\n用另類藝術、街頭劇場、民俗音樂與迷幻搖滾作為生活型態的一部份\n，亦藉此傳達他們對於世界與人生的感受、反抗與觀點。嬉皮反對政\n\
  治與社會的正統價值，選擇溫和、非教條式、主張和平、愛與個人自\n由的意識型態，或許披頭四的『All you need is love』是嬉皮文化\n最貼切的縮影。因此在1969年中為期三日的的胡士托音樂節中，即使\n\
  朝聖的人數高達五十萬人，卻幾乎沒有暴力事件發生，的確落實了他\n們所堅持的和平信念，也是這個盛事流傳許久的最大意義。（不過有\n兩人死亡，一名因為吸食海洛英過量致死；另一名則是在睡袋中睡覺\n\
  ，意外被卡車輾斃，肇事司機一直沒被找到。）\n\n從嬉皮的觀點去看胡士托音樂節還是有些巨觀與模糊的，電影透過主\n角艾略特的經歷，讓我們看見胡士托音樂節不止帶出愛與和平，也帶\n\
  出偽善與權利之手的抹黑。警長之子在艾略特家外牆寫上諸如猶太人\n去死的字樣，呼應一開始在商會會議中，一名老太太想看猶太人被奔\n牛追著跑的輕視心理。美國雖然號稱民主平等大國，但歧視也從未少\n\
  過。本來感情和睦的居民們，因為一場音樂會而種族歧視的醜態畢露\n，艾略特母親一開始在銀行咄咄逼人的樣子，似乎也就不那麼庸人自\n擾了。見微知著也不難想像當時的社會氛圍。\n\
  \n相對於美國東岸的政治經濟重地，西岸的加州甚至是舊金山，就成了\n不容於社會『正統』價值者的天堂。這也是為什麼1969年的胡士托音\n樂節如此具代表性的關鍵之一，因為這些『不容於社會者』不再遷往\n\
  西岸，而是遷徙入東岸。短暫的造訪不會因此『解放』東岸，但他們\n向東岸的人們證明，他們並非如此不堪。電影中有演出參加的青少年\n打電話回家報平安的畫面，因為正是這些電話，讓他們的父母向媒體\n\
  澄清該音樂會並非如媒體所誤導的是個麻煩窟。一名撰寫報導的紐約\n時報的記者 Barnard Collier提到，他被施壓必須作該音樂會的負面\n新聞誤導視聽。經過激烈的抗爭，Collier\
  \ 終可自由地報導他所見所\n及，除了交通堵塞以及極少的違法事件外，Collier 強調這是一場和\n平與愛的盛事，而參與的人都充滿團隊精神。\n\n電影利用新聞帶出當時的社會氛圍，越戰戰事未歇，中東的崛起，登\n\
  陸月球為太空時代揭開序幕。二戰的勝利讓美國自信滿滿，韓戰、越\n戰、波灣戰爭未曾間斷。艾略特母親的大筆的私房錢說出市井小民的\n惶惶不安。戰後的資源限縮、金融與社會問題，隨之而來的控制與教\n\
  條，無形卻壓著人們喘不過氣。電影很忠實地呈現了當時的景象，席\n地而睡、湖中洗澡、大方裸露、雜交、呼麻、嗑藥，對於動物權、女\n權（燒胸罩）等等的爭取都不過是作用力下的反作用力。\n\
  \n然而，『解放』是否應該與迷幻藥畫上等號，我是持保留態度的。與\n其說那是一個純真的年代，不如說那是一個純真甦醒的期間。純真存\n在每個人的心中，可以藉由不同的方式讓自己再次碰觸心底那份不帶\n\
  目的的純粹，在當時迷幻藥是一個方式。但對我而言，我比較認為迷\n幻藥所帶來的是架空的虛幻，解放若是會隨著藥效消失，似乎成了另\n一種禁錮。艾略特的媽媽吃了大麻布朗尼，但醒來後她還是她，就如\n\
  同艾略特在房車跟陌生人開心完後，他與雙親間的問題還是存在。父\n母的放手，以及艾略特的出走，才是真正的解放。音樂會就像是群眾\n的迷幻藥，長達三日的神遊與放鬆，但不表示遍地垃圾也會隨之消散\n\
  ，除非你動手解決，否則它將永遠存在。\n\n劇中讓我很深刻的一幕是，艾略特在舞池中與建築工人情不自禁地擁\n吻，艾略特隨即回頭擔心是否被父親看見。其實，我總覺得他的父母\n\
  是知情的，希望將他留在家鄉，一方面是要艾略特陪兩老，一方面或\n許也是要避免他與同志愛人相戀吧。父親最終什麼都沒多問，就放艾\n略特離開，而即使妻子滿腹怒氣，兩人依舊相守四十年，因為這就是\n\
  愛。\n\n本片的配樂值得大推！雖然你沒看見舞臺上的人在唱歌，但那種遠方\n飄來的音樂讓你對那中心舞台有無限遐想。以及不同情景搭配的每一\n首歌曲，很完美的融合在劇情與畫面之中，就好像音樂節的影響力流\n\
  竄在人群中，即使你為親眼目擊，你還是感受得到那份魔力。\n\n我想若是可以不受限於社會價值的眼光做自己，就是解放了。\n\n\n來源：有圖網誌版\n\n\n\n\
  --\n◆ From: 61.57.132.148\n                                   10/11 15:31\n    \
  \                             01/11 02:22"
