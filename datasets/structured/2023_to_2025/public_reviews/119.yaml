url: https://www.ptt.cc/bbs/movie/M.1563960183.A.8D0.html
title: '[無雷] 觀後短感：橫越生死線 Little Woods'
content: "在美國中西部北達科他州（與加拿大相鄰）的小鎮，姐姐歐莉（泰莎湯普森飾）與妹妹黛\n比（莉莉詹姆斯飾）長期疏離，各自掙扎度日。當黛比意外發現自己懷孕之後，她無法再\n\
  負擔家計，只好搬回歐莉家，姊妹逐漸破除心防。然而嚴峻小鎮生活，迫使歐莉在假釋期\n結束前，為妹妹重操舊業，跨國私運毒品，而妹妹也需偷渡出國墮胎。對這對姊妹，真正\n\
  的難關才正要開始。\n\n預告 \n\n本片如此小品、低娛樂性，難怪場次這麼少。但它的好看，也不是訴求聲光效果的商業大\n片可比。如果《寄生上流》是用最戲劇性的手法描繪貧窮，這部就是以最寫實的調性見證\n\
  底層人物的悲歌，也帶到以往較少被探討的美加邊境問題。雖然宣傳文案提到的《赴湯蹈\n火》我還沒看（慚愧），但《橫越生死線》的荒涼感讓我想起《極地追擊》，而《赴》與\n\
  《極》的編劇剛好都是 Taylor Sheridan。《橫》是 Nia DaCosta 首部編導之作，期待\n未來再看到她的作品。\n\n歡迎追蹤粉專 \n\n\
  --\n泰莎湯普森演的角色是被領養的，這在片中有提到。"
