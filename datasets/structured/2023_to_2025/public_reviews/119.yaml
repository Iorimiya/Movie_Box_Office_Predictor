url: https://www.ptt.cc/bbs/movie/M.1506705409.A.6B6.html
title: '[普微雷] 販賣愛情 Boogie Woogie'
content: '此片沒啥「愛情」，原文片名典故出自荷蘭立體派繪畫大師蒙德里安 (Piet Mondriaan) 的兩幅作品 Victory Boogie Woogie
  與 Broadway Boogie Woogie，電影是虛構了一幅 Soho Boogie Woogie 來當片中人人爭搶的核心大作，由此出發展開一場藝壇亂象之旅，從藝評、仲介、畫商、藝術家、收藏家、從大人物到基層無一不批。這種電影本來就是諷刺喜劇類型，本片更是諷刺得無所不包，只是諷刺到後來實在有點疲勞轟炸，諷來諷去其實都是老生常談沒啥新意，而且諷完之後也沒有提出什麼擲地有聲的見解，就這樣冷笑幾聲混過去了。



  不過在 2017 年來看這部片是有其獨特的趣味，首先我們喜見 Christopher Lee老爺爺又上大銀幕！他居然還有生前的壓箱電影還沒上映？原來此片其實是
  2009 年作品，台灣是事隔八年後不知怎麼突然有興趣就進了，以今日眼光看可是眾星雲集！譬如：



  還是輕熟女的《X-檔案》Gillian Anderson；

  還是輕熟女的《不羈夜》Heather Graham（而且還有個直排輪妹，是誰呢？）；

  還是小咖只演過 2008 《媽媽咪呀》的 Amanda Seyfried；

  還能裝年輕稚嫩的《小鬼大間諜》Alan Cumming；

  還沒演過 2015 《賓漢》等大片主角的 Jack Huston；

  到 2015 《真愛繞圈圈》還能演叛逆少女的 Jaime Winstone；

  近年慈善事業做超大還一手催生「倫敦花園橋」的 Joanna Lumley；

  還沒演 2011 《雷神索爾》跟漫威紅遍全球的 Stellan Skarskard；

  多年一路演配角奸角到 2017 《神力女超人》的 Danny Huston。



  其中我覺得是 Stellan Skarskard與 Danny Huston 兩位慣常演配角的資深演員在這片穿針引線最有主角地位、表現也最精采，另年輕小輩中是知名度最低的
  Jaime Winstone 有演出一種走火入魔的率性瘋狂，都很值得欣賞。



  大體上，本片是在說藝術界追逐名利的虛無與偏執，完全能呼應我們一般人對藝術界難以理解的質疑。譬如我們會覺得一幅畫隨便幾條線塗塗色塊居然可以賣到幾千萬英鎊？本片蒙德里安作品就示範給你看，藝界眾人一路加碼追錢都追瘋了，只剩被他們視為食古不化頭殼壞去的痴呆老人還在珍惜那欣賞作品就花點小錢買幅畫的簡單初衷；但藝界真正追的不是錢本身而是藝術品價值，就算錢全被吞光只要藝術品還珍藏著才是真正坐擁金山。



  電影也很八卦地談「藝術與情色」老梗，許多人好奇我們看的叫 A片但你們拍的就叫藝術？本片也讓年輕藝術家的片尾展覽大喇喇放給我們看，還煞有其事談創意談深度談赤裸表達驚世駭俗的都是傻子、作者自己反而深知這一切只是個操弄人心鼓動觀眾的獵奇遊戲，純做來笑看人間名利輕鬆賺。當然藝界權貴與基層間的性騷擾、劈腿、包養、陪睡、遊走同性異性之間傻傻分不清等等...
  眾星一起演來不知有多少條不倫關係不在話下，年輕藝術家拿著攝影機若無其事玩弄這一切才真令人心驚。



  談性，有意識地用藝術消費性還不是最可怕，無意識地已經把性給藝術品化才是最可怕。色老頭準備吃小實習生，衣服都快脫下來時居然連色慾都沒了、眼睛變成放大鏡開始品頭論足當藝術品欣賞、甚至送給對方的情慾禮讚竟是
  Damien Hirst 屍體標本的人類姊妹版 XD 本片還請到了 Damien Hirst 當藝術顧問自己玩自己，當然是嘲諷的極致、甚至幾乎是個行動藝術了等著藝界鼓掌觀眾崇拜...



  不過說老實話，本片所有的嘲諷都只是皮毛、都是你我早已熟知的刻板印象、演員的角色性格都是呼應刻板印象的單面戲謔，並沒有真正要刻劃藝界眾生中任何一種人的心路歷程、也並沒有真要認真批判哪種亂象、更沒有要在批判亂象之餘提出任何藝術的價值與意義。真正還想認真追逐意義的那幾個角色，在本片勾勒的藝術世界中都是傻子、都沒什麼好下場只得一場空、只是當人家墊被或踏腳石繼續往上爬用的，用完就丟。



  當然，每條支線都還是有幽默的機鋒、偶爾還是有令人咋舌的亮點，但大體上整片一路是漫不在乎地淺淺嘲諷，連那背景配樂（我不知道算爵士還是藍調？會不會就是 Boogie
  Woogie？）都是輕描淡寫一路連續下來催眠用的。然而如果能夠撐過這些輕描淡寫，到全片最後一幕呼應片頭，電影才有了一次真正的重擊，彷彿宣告藝界僅存的真心誠意甚至真實意義都隨好人死亡了，兩個看似盡其在我其實只剩空殼的藝術仲介商相視一笑，繼續帶著大家在虛華中漫無目的走下去。




  當然啦，也許就像《金牌特務：機密對決》一樣，這《販賣愛情》又是一部來打我這種嚴肅影迷臉的電影，看部電影放輕鬆嘛、反正惡搞最開心、想在惡搞背後找意義就輸了 XD
  。的確，本片那有點「後設」味道的結局大秀，一部毫無意義只是拍拍日常賣賣狗血的性愛流水帳，就可以成為倫敦藝壇明日之星萬眾歡騰，豈不也是告訴我們觀眾「你也正在看一部藝壇腥煽色的無意義流水帳電影」？



  與其認真看片不如看美女還踏實多了，引起無數男士性幻想的兩代直排輪妹都不夠看，這位飾演藝術家的小辣椒 Jaime Winstone 才是最嗆呀，怎麼到今天還紅不起來呢？


  --

  也很妙的是許多人長得跟 17 年並沒差多少，倫敦藝廊風景也沒什麼大變化'
