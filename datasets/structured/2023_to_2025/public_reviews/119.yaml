title: '[普雷]《別跟山過不去》A WALK IN THE WOOD '
content: "因為工作關係開始接觸戶外活動，在老闆、廠商的夾攻之下，\n為了參加抽獎活動去看了這部平淡卻搞笑不斷的電影《別跟山過不去》，\n看了預告片才知道演員有《勇者無敵》金球獎影帝尼克諾特、\n\
  《美國隊長2：酷寒戰士》奧斯卡得主勞勃瑞福、\n《大夢想家》奧斯卡影后艾瑪湯普遜，\n不得不承認當時是衝著這幾個老牌演員才去看的哈哈。\n\n　　電影劇情是在講一位長年旅居國外的旅遊作家比爾\
  \ (勞勃瑞福 飾)，\n在參加一個訪談節目後，突然想去爬山看看自己的國家，\n不顧自己年事已高，及所有的家人反對，仍堅持與多年沒有聯絡的老友凱茲\n（尼克諾特\
  \ 飾） 去爬大多數人失敗的阿帕拉契山徑。\n\n　　在幾個月的路途當中，遇到怪咖登山客、差點被灰熊攻擊、\n凱茲勾搭上有夫之婦、一起掉下懸崖等等小插曲，\n\
  這也讓兩個原本有心結的老友，敞開心胸，對彼此述說內心深處的聲音。\n最後，兩個人雖然沒有完成阿帕拉契山徑，但卻帶著不同的心境回到原點。\n\n　　本片在大片的夾攻之下，不走高潮迭起的灑狗血路線，主打老牌演員，\n\
  劇情中夾雜一些幽默風趣的對話，我覺得是部可以跟老朋友一起觀賞的輕鬆小品。\n喜歡戶外活動的人，尤其有爬山的，應該會很有共鳴，順便抽抽獎也不錯哈哈哈！\n\n\n\
  \n-----------------------我是分隔線--------------------------\n\n\n順便分享一下抽獎資訊，若違反板規，自刪><\n\
  活動網址 \n\n\n--"
