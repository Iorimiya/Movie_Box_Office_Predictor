url: https://www.ptt.cc/bbs/movie/M.1561118593.A.AC9.html
title: '[好雷] 玩具總動員4，屬於Woody的冒險'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n網頁版:\
  \ \n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n還記得剛聽到Toy\
  \ Story竟然還要出第四集時，我心中難免覺得Pixar只是想要在賣一次情\n懷，在期待的同時又害怕出現狗尾續貂之作，然而看完Toy Story 4之後，才發現過往的\n\
  擔心只是多餘的，Pixar不僅不負眾望地再度端出了一部精采好看、笑中帶淚的優秀作品\n，更是替我們喜愛的牛仔Woody寫下一個完美的結局。\n\nToy Story\
  \ 4開頭就顯示了這集是屬於Woody與牧羊女Bo Peep的愛情故事，九年前還是\nAndy玩具的Woody依然肩負著Andy的喜愛與領導其他玩具們的責任，沒有選擇與愛人Bo\n\
  一同離開，將手抽離了裝著Bo的箱子，之後就這樣在Andy身邊繼續過了一段幸福的時光，\n\n但在Andy長大成人之後，Woody與老夥伴們來到了Bonnie家，對於Woody來說，這不僅僅是\n\
  換一位小孩那麼簡單而已，他面臨到的是強烈的身份轉換，他不再是最被喜愛的玩具，也\n不再是這群玩具們的領導者，甚至連跟Bonnie玩的機會也漸漸沒有了，\n\n\
  這對Woody來說並不是一件容易消化的事，他習以為常的生活慢慢地分崩離析，一直以來\n的重心也逐漸消失，改變帶來的不安全感就解釋了為甚麼Woody那麼積極地保護Forky，比\n\
  起讓Bonnie開心，更重要的是Forky提供了Woody生活中的重心，讓他可以再度感受到被需\n要的感覺。\n\n而Bo的出現則是讓Woody看見了他的另一個可能，也是他多年前放棄的另一個未來，但\n\
  Woody從來沒有度過不屬於一個孩子的人生，對他來說就算Bonnie不愛自己也依然必須要\n回到她的身邊，Woody認為這才是做為一個玩具的他真正需要的，就像Andy需要他一樣，\n\
  他認為Bonnie也一定需要他的幫助；\n\n但就在一蹋糊塗的失敗之後，面對了Bo對他的責備與Gabby Gabby渴望被愛的告白之後，\nWoody慢慢地改變了想法，漸漸了解原來Bonnie並不需要他，他早已完成了一個玩具的夢\n\
  想，給了一個小孩難以忘懷的回憶，而此時比其Bonnie來說，Bo才是那個更需要他的人，\n也是他最需要的那個人，\n\n在得到老朋友們的祝福之後，Woody最終選擇成為一位沒有小孩的玩具，與Bo一起幫助那\n\
  些沒有過孩子的玩具，或許我們再也看不見Woody全新的生活，但我想Woody再也不會為了\n其他人放開Bo了。\n\n我很難形容我對Toy Story 4故事的喜愛，Pixar聰明地利用身份轉換的主題帶出了這次的\n\
  故事，Woody其實就像是Forky一樣，明顯地無法適應自己新的身分，結果做出了許多讓人\n頭痛的事，比起Bonnie不再與他玩，我印象更深刻的是Dolly以領導人的身份指揮時Woody\n\
  不斷地想插話，\n\n這樣的情景我很難不想到一些空巢父母或是退休人士，面對了身份的轉換而無所適從，因\n此就像Woody一樣開始胡搞瞎搞，或許一開始這些事都沒有很糟的後果，甚至是朝好的方\n\
  向走去，但就像電影後段Woody的失敗一樣，這些事最終都只會落得一蹋糊塗的下場，\n\n如何面對這樣的身份轉換，我認為便是Toy Story 4最想表達的主題，而電影最後Woody決\n\
  定選擇放手離開，去過一個屬於自己的人生，我想也提供給那些面對無法適應身份轉換的\n人一個解答。\n\n當然，Toy Story 4也不是全無缺點，我雖然很喜歡電影中的反派Gabby，畢竟這個反派比\n\
  多數電影的壞蛋都還要有血有肉多了，但或許為了符合可以給小孩的調性，比起第三集的\n反派Lotso，Gabby與跟班除了外表恐怖以外，並沒有給予主角們太多的絕望感，甚至就連\n\
  Woody的聲音盒被拿走後也看來毫無差異，讓我覺得好像反派這裡處理起來有點太容易了\n一點。\n\n另外，這集除了Buzz以外，其他的老朋友都沒有甚麼發揮，甚至就連Buzz也單純的變成丑\n\
  角，雖然可以理解這樣安排的理由是為了讓焦點放在Woody身上，但作為Toy Story系列的\n續作，我想還是有許多粉絲是很期待看到這些舊腳色能夠有所表現，但是我還是很喜歡最\n\
  後Woody與眾人道別的畫面，從Buzz說出「她會好好的」之後，我的眼淚流了下來，最後\n那句「飛向宇宙，浩瀚無垠」時，更是令我哭到不行。\n\n雖然這集少了許多熟悉的老角色，但這集的新角色也都很迷人，尤其是女主角Bo，雖然不\n\
  全然是新角色，但過往都沒什麼表現，而Bo在這集我想應該就會圈粉無數了吧，在野外生\n活了許久的她，不再是Woody過去認識的嬌嬌女，成了一個連手臂斷掉也毫不緊張的帥氣\n\
  俠女，且雖然是動畫，但還是很難忽略Woody與Bo之間的火花，不管是在遊樂場再次相見的時候\n還是後面的各種相視而笑，不禁讓我覺得Toy Story 4或許會成為年度最佳愛情電影；\n\
  \n而除了Bo之外，不管是黑人二人組配音的Ducky與Bunny，還是Keanu Reeves配音的Duke\nCaboom都帶給了觀眾許多歡笑，替電影增添了許多特別的趣味。\n\
  \n在技術方面，我想Pixar的實力已經不用多說了，其動畫的所呈現的精緻感真的很恐怖，\n不同材質的玩具都有作出明顯區別，細節部分也處理得很好，完全沒有動畫的違和感，可\n\
  以很明顯地看出在動畫製作上所放出的心思，非常的令人佩服，\n\n而且不愧是動畫電影的老手，很懂得如何使用畫面說故事，我想大家都很難忘記那位沒有\n擊到掌士兵吧，完全沒有任何一句話提到他或是刻意帶鏡頭，就只是一個不重要的小細節\n\
  卻製造出了滿滿的笑點，就是這樣的厲害手法令人在看電影時更為開心。\n\n最後，雖然我還是認為Toy Story系列在第三集就已經有了最好的結尾，但Toy Story\
  \ 4的\n確讓Woody這個我們從小看到大的角色走向了一個更好更完整的故事終點，為了Andy與他\n的玩具夥伴們奔波了那麼久的他，在最後終於能夠好好的退休，跟他的愛人Bo在一起生活\n\
  ，這樣的結局真的很讓人感動，\n\n這也令人一方面期待能夠看見更多玩具們的冒險，一方面又令人擔心未來若還有續集會破\n壞現在已經完成的美好，只能祈禱接下來不管Pixar對這系列還有甚麼樣的計畫，都能夠\n\
  像現在一樣作出令人叫好的優秀作品。\n\n更多電影相關廢文追蹤:\n\n\n--\n我有看到，很棒的小細節\n可是後面我覺得Benson的行為蠻可愛的只是醜了點XD\n\
  我知道那個，還跟自己擊掌"
