title: '[好雷]艾德伍德(Ed Wood):笑中帶淚的黑色幽默'
content: '多圖無音樂好讀版:




  有幸在咖啡廳觀賞了這部比我還老一歲的黑白電影，從第一秒到落幕都非常喜歡。


  提姆波頓的黑色幽默，強尼戴普一貫的瘋癲幽默演技，與「史上最爛導演」艾德伍德荒唐

  的人生內容竟如此契合！！其實我是很不愛看傳記式電影的，但這部電影完全超越我對傳

  記電影的想像！


  （以下有電影雷，請斟酌閱讀）



  就如同我們所認識的提姆波頓，電影貫串了哥德式恐怖片的元素，而強尼戴普飾演的艾德

  本人也是鍾情於這種恐怖的導演。開頭雷雨交加的鬼屋與說書人般的吸血鬼，讓我聯想到

  小時候愛看的恐怖卡通「十三號星期五」，英文是＜Tales From the Crypt Keeper＞。

  下面這個影片是這部卡通的片頭。


  不覺得很對味嗎！傳統西方鬼怪加上貫穿故事的黑色幽默，或許就是小時候愛看這些卡通

  ，才讓我對提姆波頓的風格如此有親密感吧。


  我真的很喜歡艾德伍德那種天真善良的電影痴個性，也非常喜歡他那招牌的、看到明明超

  中二或超爛的場景卻感動不已的影痴笑臉。


  當他認定一個人好，他便用盡自己所有能力想幫助那人，或讓那個人進入自己的生命；例

  如他最喜歡的老吸血鬼演員比利，雖然已經過氣，但他深信他就是眾所仰慕的大明星，堅

  持讓他演出自己努力拼湊出來的每部Ｂ級電影。


  他跟比利的友情雖然有很智障好笑的地方，但也有非常讓人動容、覺得艾德真的是非常溫

  柔的地方。例如比利因為沒錢無法繼續住院時，艾德雖然無法籌出錢來，但卻騙比利「好

  消息，醫生說你的報告很好，你可以出院了！」就是因為說不出實話，怕讓比利真的覺得

  自己很沒用。


  還有出院後，比利難過地覺得自己真的老了，很希望能再拍一部電影，問艾德何時要有下

  一部；艾德雖然心知肚明下一部根本還沒著落，仍然從善如流地自己架起攝影機，沒有燈

  光、沒有收音，騙比利這只是要先拍一些電影的片段。這裡比利拒絕了艾德臨時亂掰的「

  趕著要去晚宴」的情境設定，問他不能慢點嗎？慢慢享受生命、聞聞一旁的鮮花的香味。

  這段讓我看了好心揪，覺得比利開始珍惜那種生命微小安詳的美麗，似乎是感受到自己壽

  命將盡了。（現在不可能再凌晨四點泡在冰水池裡跟假章魚搏鬥了吧！）


  比利跟艾德最後交談的地點正好是他們第一次相遇的街頭（如果我沒記錯的話），接下來

  就是艾德接到老友的噩耗了。喪禮過後艾德自己看著上面提到的那段他最後為比利拍攝的

  短鏡頭。結束後立刻回頭問放映師：「我可以再看一遍嗎？」媽阿，這裡差點騙出我的眼

  淚，我不是來看喜劇電影的嗎？


  不知不覺講了很多比利，除了比利外我最喜歡的角色大概是VAMPIRA夫人吧，因為她很辣

  ，聲音很有磁性。


  雖然戲份不太多，但後半段莫名加入艾德瘋狂的電影事業，有種兄弟不問行不行、只問挺

  不挺的感覺，蠻帥的。


  但長相讓我聯想到阿達一族的媽媽。嗯……還是現實中她們是有關連的啊？我也不清楚。


  至於整部電影的主軸，也就是艾德用荒謬毫無所謂「電影美學」的方法導的一堆科幻片和

  恐怖片，只有「廢到笑」三個字能形容，之後有機會一定要找來看看。另外就是他大罵教

  士胡亂找角色那段，莫名讓人看了很爽ＸＤ一直脾氣很好的艾德難得大抓狂，是因為教士

  觸犯到了他身為導演的尊嚴，足見他對電影的痴狂程度。


  最後，附上維基百科上艾德伍德本人的照片，只能說強尼戴普的還原度真高啊！！



  --

  六角影棧：90後的電影偏食症



  --'
