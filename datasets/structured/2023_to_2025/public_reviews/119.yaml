url: https://www.ptt.cc/bbs/movie/M.1624757877.A.F1F.html
title: '[無雷] 魔法黑森林 Into The Woods'
content: '《麵包師傅和他的妻子》、《傑克與魔豆》、《灰姑娘》、《小紅帽》、《長髮公

  主》都是家喻戶曉的童話，當這些故事的主角在同一齣作品出場，而且作者還續寫

  了 happily ever after 之後的景況，這就是百老匯知名劇作家史蒂芬.桑漢代表

  作之一的《拜訪森林》 Into The Woods。


  本劇首演於 1987 年，不熟悉音樂劇的朋友可能對這齣從頭唱到尾、童話劇情大雜

  燴的音樂劇感到不耐。其實這個作品問世之後，可是美國各級學校最愛的公演劇目

  之一，臺灣直到 2000 年之後，才有幾場零星演出，分別是 2006 年台北藝術大學

  戲劇廳（英文版，百老匯首演 DVD 復刻版）與中山大學逸仙（2010，劇場藝術

  學系畢業製作，全中文演出）；中國北京則在 2014 年底上演中文版，易名為

  《森林誘惑》，演出地點在解放軍歌劇院。


  * 個人有幸看過北藝大與中山劇藝這兩場演出，前者中規中矩，由於刻意模仿，

  了無新意；後者從舞台、服裝到唱功，處處是驚喜，新鮮感十足。


  從頭唱到尾，把對白放在歌詞裡向來是史蒂芬.桑漢的強項，如果你是安德魯.洛依.

  韋伯或羅傑.漢默斯坦的粉絲，自然對此種呈現方式感到陌生，其實這種演出方式

  有點類似十八世紀以降，流行過的歌唱劇（Singspiel），例如：莫札特著名的三幕

  歌劇《後宮誘逃》。但是我必須說，史蒂芬.桑漢對於曲子的處理其實更為細膩，

  像《拜訪森林》中的重唱〈沒人是孤單的〉No one is alone，或是《小夜曲》

  （A Little Night Music）裡的〈小丑出場〉 Send in the Clowns 都對失去

  親人、勞燕分飛的情緒描寫得絲絲入扣。


  《魔法黑森林》的選角，沒有太大的問題，每個人都很能唱，情緒也很到位，但是

  剪輯之後，總會讓人嚴重出戲；梅莉.史翠普飾演的女巫雖然能唱，但還是贏不過

  首演版的 Bernadette Peters。強尼戴普的大野狼也很OK，反正這種假鬼假怪的

  腳色超級適合他，不過他的戲份也僅止於此。


  上半場，中規中矩，每個角色的性格隨著歌曲展開；下半場則像是趕火車，更刪除

  長髮公主身故，女巫心碎的經過，情緒的不連貫，嚴重影響觀影心情。我也超不愛

  兩位王子對唱 Agony 那段，無病呻吟，甲到最高點，情緒完全不對。灰姑娘第

  三次從舞會離開那段，也誇張得不得了。（看過電影的朋友就知道，灰姑娘的心

  機變得很重，不過老實說，灰姑娘本來就是心機鬼XD）


  誰說童話故事都必須有個盡如人意的美好結局？人生原本就是充滿意外，那一座座

  黑森林就是社會的縮影，你不可能永遠都是不進入森林的小白兔，你準備好了嗎？

  讓我們一起拜訪森林！


  附註


  巨人母子應該是這幾個童話故事裡最悲催的角色，正所謂「無事家中坐，禍從天上來」。


  女巫演唱的《Children Will Listen》，很警世，千萬別以為大人的言行舉止，

  對小孩不會產生影響，其實他/她們都在傾聽，都銘記在心。




  --



  同意小羊大的說法，梅姨演技的確有其長處，但有的角色實在不適合她，製片方過

  於迷信大牌等於票房的結果，偶爾還是會踢到鐵板。


  影片雖然畫質不佳，但百老匯原版卡司絕對是一時之選。'
