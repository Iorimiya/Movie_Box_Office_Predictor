url: https://www.ptt.cc/bbs/movie/M.1668494632.A.871.html
title: '[新聞] 常被誤認哈利波特 E.Wood:願意演他傳記片'
content: '新聞網址：


  原標題:



  Yahoo奇摩電影戲劇編輯部

  2022年11月15日



  《魔戒首部曲：魔戒現身》（圖：Warner Bros.）



  【文／血紅蘭姆】「佛羅多」伊利亞伍德和「哈利波特」丹尼爾雷德克里夫如今雙雙承認

  ，彼此長得十分相似。



  兩人同樣都是年紀輕輕便揚名立萬，伊利亞伍德二十歲就以《魔戒》三部曲而紅遍好萊塢

  ，丹尼爾雷德克里夫則是早從十一歲起，就一路演了十年《哈利波特》系列電影，兩人的

  演員之路走來極為相近。



  而在告別成名作之後，兩人也都勇於挑戰獨立電影，好盡情發揮自己的一身演技，不再受

  限於商業大片的束縛。再加上



  《哈利波特:死神的聖物Ⅱ》（圖：Warner Bros.）



  丹尼爾雷德克里夫前一陣子曾向帝國雜誌的播客節目透露，在演出《哈利波特》之前，自

  己曾跟瑪姬史密斯合作過電視電影《塊肉餘生記》，也是拜「麥教授」瑪姬史密斯大力推

  薦之賜，自己才能雀屏中選。



  丹尼爾雷德克里夫打趣道，如果要拍自己的傳紀片，他就想飾演瑪姬史密斯的角色，「而

  無論在任何人生階段，伊利亞伍德都是飾演我的不二人選。這太超現實了。我們絕不會拍

  出一個很自然的版本。」








  雖然伊利亞伍德比丹尼爾雷德克里夫還年長八歲，更不可能去飾演幼年時期的丹尼爾雷德

  克里夫，但兩人如果能在大小銀幕上攜手合作，勢必會是影迷之福，就怕有許多觀眾分不

  清究竟是誰在演哪個角色了。


  --


  大家覺得長得像嗎???


  --'
