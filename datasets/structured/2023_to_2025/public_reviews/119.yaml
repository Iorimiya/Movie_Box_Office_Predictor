url: https://www.ptt.cc/bbs/movie/M.1491956741.A.39B.html
title: '[評論] 聞天祥談 / 伍迪艾倫（Woody Allen）'
content: "【聞天祥】看伍迪艾倫的電影 進入他的世界\n\n\n\n《小日子》015 期  夏日出發 短途旅行\n\n--\n\n一個經典　50 年拍了 40\
  \ 多部電影的導演\n\n1986 年夏天，升高二的暑假，我回校擔任新生輔導員。\n結束任務的中午，到西門町溜達，在當時的金獅戲院，也就是現在的新光影城，\n\
  看了伍迪艾倫（Woody Allen）編導的《開羅紫玫瑰》（The Purple Rose of Cairo）。\n\n影片以 1930 年代經濟大蕭條為背景，\n\
  一個叫做西西莉雅（米亞法蘿飾演）的女子，總能在大銀幕找到擺脫現實苦惱的良方。\n而且她不僅什麼片都看，甚至同一部片可以看好幾遍。\n就在她丟了工作、發現老公偷腥後，\n\
  她再度泡在戲院裡重看那融合了探險、愛情、歌舞的好萊塢電影《開羅紫玫瑰》。\n一遍、兩遍、三遍，結果「看」得電影中的探險家為她「跨」出了銀幕！\n\n這下好萊塢瘋了！扮演此角的明星（傑夫丹尼爾飾演）也怕苦心經營的演藝事業\n\
  毀在自己塑造出的角色手裡，於是趕來抓人。\n結果兩個長得一模一樣的男人（一個演員，一個角色）都聲稱愛上女主角。\n黃臉婆一下變成左右逢源，然而她的選擇卻導致黯然心碎的下場。\n\
  這時候，只有電影可以拯救她。\n\n\n這個燠熱的午後，是我生命中的重要分水嶺。\n從此，我對電影的信仰，忠貞不移。\n伍迪艾倫自然成了我的心頭愛。\n更有趣的是在不同階段，這部電影帶給我的樂趣也不一樣。\n\
  \n年少時血氣方剛，覺得兩個一模一樣的男人，\n真人反而捉摸不定，假的卻是從一而終，實在諷刺；\n大學鑽進電影知識裡，發覺本片結合類型、歷史、社會與心理學，益加崇拜；\n\
  到了晚近，則把它當作伍迪艾倫的電影情書，西西莉雅則是最純粹的影迷化身！\n可見變的不是電影，而是看電影的我。\n\n自此，每一部伍迪艾倫電影我都不錯過。\n而他也總不避諱在片中藉由藝術手法呈現自己當時的所思所感。\n\
  因此你會看到在八〇年代中期，他作品難得出現樂觀救贖，顯示情場得意。\n\n1992 年撕裂夫妻關係的《賢伉儷》（Husbands and Wives）\n在他和米亞法籮情變後推出，簡直怵目驚心地宛如分手實境秀。\n\
  爾後透過約翰庫薩克在《百老匯上空子彈》（Bullets Over Broadway）的質問與領悟，\n你彷彿聽出那是他對銀幕下年輕妻子的低語。\n\n幾乎年年都有作品問世的規律創作，\n\
  讓我們看他的電影就像跟老朋友的年度聚會一樣親切。\n\n\n步入新世紀，智慧與幽默毫不褪色的老先生卻有驚人之舉。\n連領獎都不出席的伍迪艾倫，竟然為了九一一事件後的紐約，上奧斯卡引言。\n\
  別人認為他永遠走不出曼哈頓，\n他卻一路周遊倫敦、巴賽隆納、巴黎與羅馬，再創事業高峰。\n\n\n伍迪艾倫就是這麼有意思！\n想進入他的世界，你不需要綁架或催眠他，\n\
  只消看電影就好，所有的密碼與指標都已在裡面。\n信手捻來的妙語及創意，教我好生欽羨且永不厭倦。\n\n\n--\n\n題外話：\n\n這篇是聞老師應《伍迪艾倫：笑凹人生》所寫的介紹文，\n\
  後面兩段為我看紙本書手動輸入的，原網址裡沒有。\n\n不過其實紀錄片裡有說到，早期他拍片是有跑到加州去拍攝的，\n但他比較習慣紐約都市的生活，後來跑到歐洲拍的片我最喜歡《午夜巴黎》，\n\
  《遇上塔羅情人》我覺得很有趣，去年的《咖啡・愛情》也很不錯，期待今年的新片。\n\n--\n   \n   ◥\n  \n \n  \n￣￣￣￣\n\n--"
