url: https://www.ptt.cc/bbs/movie/M.1574833582.A.01A.html
title: 'Re: [討論] Lost In The Woods這首歌(雷)'
content: '其實我看完之後，對這段有個想法:就是小時候我們看迪士尼，很常有女主角在開腦內小

  劇場，怕未知的未來、怕不被愛、期待被愛等等，躲在角落畫圈圈唱歌，但我們都不會覺

  得不自然，可是當這樣表現無助的腳色，變成男性的時候，大家反而覺得不自在了XD


  這段除了要致敬以前男孩團體風格的MV外，說不定也有給大家這類的反思。


  再加上最後Elsa其實有點變神格化，變成某種概念的「女神」，這些種種，都帶給下一個

  世代的小孩們，不一樣的訊息（有別於我們現在30-40歲世代小時候），就是，女孩好好

  愛自己、接受自己，總有天會成就自己，讓自己閃閃發光，或以後這些女孩兒長大交了男

  朋友，知道男性不總是那麼剛強堅毅，也有無助需要陪伴需要肯定的時刻……


  性別平等不是只是單方追求女性的保障或權益，而更希望能打破社會二元思考的性別框架

  （男生不一定就是表現陽剛堅強，女生不一定柔弱需要被拯救）


  如果往這角度思考，發現，Frozen2是個好棒的性平教材啊。



  --'
