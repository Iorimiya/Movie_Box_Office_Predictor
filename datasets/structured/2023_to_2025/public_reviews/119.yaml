url: https://www.ptt.cc/bbs/movie/M.1442563186.A.C62.html
title: '[普雷] 別跟山過不去-A Walk in the Woods'
content: '>>網誌圖文好讀版:


  《A Walk in the Woods：別跟山過不去》是一部適合有一定年紀的男性影迷觀賞的作品，才較能與劇中兩位難兄難弟歐吉桑的探險之旅產生共鳴，如同電影海報及預告提及的相似作品《白日夢冒險王》鎖定即將面臨中年危機或是在人生十字路口徬徨的觀眾，本劇的受眾也相當精準。由1973年奧斯卡男主角提名的勞勃瑞福（Robert
  Redford）與1992年奧斯卡男主角提名的尼克諾特（Nick Nolte）主演。


  《A Walk in the Woods：別跟山過不去》故事敘述旅遊作家比爾（Robert Redford）過著封筆後只能替其他人寫寫序的生活，身邊的好友一個個面臨病痛與死亡，生活裡彷彿已經沒有了前進的目標，僅剩下慢慢等待的衰老過程，在一次喪禮結束後，他重新思考著生存的意義，想著想著比爾決定重新找回冒險旅遊精神，挑戰登上阿帕契山徑走完全程。


  以下有較詳細劇情評論，請斟酌閱讀。


  下定決心後，比爾找了已經很久沒聯絡的過去的死黨凱茲（Nick Nolte）一同冒險，兩個人在沒有精心準備的情況下就這樣出發了。從對白台詞中可以看出劇情想要暗示他們曾經擁有最親近的友誼，卻因為一些摩擦誤會使得他們後大半輩子幾乎都沒有聯絡，如今靠著這個機會，試圖找回從前的情誼，兩人在旅途中漸漸地磨合。


  照這個設定發展下去的話，這部電影應該會變成以回憶為主的感人大和解故事，但是導演並不想太多著墨在這上面，將兩人和解嫌隙的過程默默藏在搞笑劇情之下，不讓它拖走原本想營造的歡樂感覺，卻讓情感戲的深度沒那麼足夠，有點可惜。對話中有許多兩人年輕時風流瘋狂的各種回憶，穿插在美麗的阿帕契山景中，卻缺了幾秒的回憶搞笑畫面來畫龍點睛，讓沒有做過那些事情的人在看這些片段時其實難以有共鳴，無法僅靠台詞就勾起有趣的回憶。


  兩人登山途中沒有經歷什麼太可怕的阻礙，都是一些日常的小驚險，遇見死纏爛打白目登山克、被熊偷襲、遇見暴風雪或是在休息站不小心勾搭到有夫之婦等。看兩位年邁的影帝幼稚打嘴砲，明明很老還硬要逞強的各種舉動其實滿有趣，那種就是不肯服老，堅持自己想法的精神恰恰反應了他們這把年紀（都接近80歲）還要演出這種需要體力的戲的實際情況。


  劇情後段搞笑完後揭露了兩人為何想要這趟冒險之旅的真正原因，比爾是為了找回寫作的靈感，雖然他嘴上百般地不願意承認，同時也仔細感受自己對妻子的愛，在生活裡找到可以持續珍惜的事物，這些並不是那麼地理所當然存在。凱茲則是一方面在逃避通緝，一方面反省自己過去混亂的人生，是一趟酗酒犯罪後的改過自新之旅。在平凡的劇情中提醒觀眾回憶思考自己人生的意義，雖然稱不上精采深刻，仍是能在心中種下小小的芽。


  結局兩人分道揚鑣，凱茲繼續過著流浪生活，比爾則重回空白的電腦頁面與浮動游標，打出這部電影的原著小說，當比爾收到凱茲在各個景點寫下兩人旅途回憶的明信片時，那更是有過共患難的好死黨才能體會的心頭暖意，溫馨地畫下故事句點。>>網誌圖文好讀版:


