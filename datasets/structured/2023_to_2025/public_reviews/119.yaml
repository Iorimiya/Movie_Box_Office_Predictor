url: https://www.ptt.cc/bbs/movie/M.1707589637.A.2DF.html
title: '[情報] 史嘉蕾喬韓森將主演《美國甜心》導演新片《Featherwood》'
content: '根據 Deadline 的獨家報導指出，《小行星城》奧斯卡提名女星 Scarlett Johansson 將

  主演《2016美國甜心》英國坎城名導 Andrea Arnold 的新片《Featherwood》。




  《Featherwood》改編自普立茲獎提名作家 Scott Farwell 曾於《達拉斯晨報》刊載的同

  名文章，並由《因為愛情》二部曲的編導 Ned Benson 執筆劇本，而這也將成為 Andrea

  Arnold 首部的執導非由自己編寫劇本的長片作品。


  故事描寫女主角 Carol Blevins 是一位海洛因成癮者和被稱為「Aryan Princess

  featherwood」的幫派成員。他成為了 FBI 的重要線人長達六年之久，為了調查一個名為

  「德州雅利安兄弟會」的新納粹殺人販毒集團。Carol Blevins 與這個幫派住在一起，他

  熟記所有的細節，制止了謀殺與搶劫事件，更讓 13 名成員被定罪。但是這個痛苦的經驗

  讓他的人生留下嚴重的身心創傷，並一直活在被其威脅報復的陰影之下。


  理所當然，Scarlett Johansson 將在片中飾演這位女主角 Carol Blevins，而目前則沒

  有其他演員的消息釋出。


  除了擔任主演之外，Scarlett Johansson 也將親任製片，與他所創辦的製作公司 These

  Pictures 的另外兩位夥伴《碧昂絲：檸檬特調》的雙製片 Jonathan Lia 和 Keenan

  Flynn 一起製作《Featherwood》。


  曾產出《花漾女子》和《異星入境》等佳作的 FilmNation 將會負責《Featherwood》的

  國際銷售，並在柏林影展的歐洲市場展上尋找國際買主，該片目前已經引起熱烈討論。


  Andrea Arnold 自在坎城影展三擒評審團獎的《2016美國甜心》後已經長達八年沒有帶來

  新的劇情長片，中間花了多時在美國拍攝《美麗心計》等電視劇，並在 2021 年推出頗受

  好評的紀錄片《Cow》。而他目前已經拍完了由 Barry Keoghan 和 Franz Rogowski 主演

  的新片《Bird》，極有可能在今年坎城正式亮相，而他也很快的也將突入再一部劇情長片

  《Featherwood》的製作。




  --'
