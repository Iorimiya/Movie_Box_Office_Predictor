url: https://www.ptt.cc/bbs/movie/M.1424402553.A.4F9.html
title: '[好雷] 魔法黑森林 Into the Woods'
content: '我是剛上映時在美國看的。我與同行的朋友都很怕電影會搞砸，晚餐時就先講好，如果看

  完很崩潰的話一散場就要衝去酒吧喝個大醉──萬幸，最後沒有用到這個急救計劃。

  　

  以下是速記：

  　

  1. 我非常喜歡。不拖戲、節奏掌握得不錯，唱得也挺好。看過現場的人一定要去看。

  　

  （以下有電影與舞台劇雷，生人迴避。）

  　

  　

  　

  　

  　

  2. 開場很好。把熱鬧的支線串在一起的節奏感絕佳。（硬要挑刺就是這段最後讓「全部

  角色」塞在同個畫面裡一起進森林，太刻意了。）

  　

  3. 灰姑娘下臺階那段的「時間暫停」特效相當完美，女角的唱與演在這幕也搭配得極好

  。很喜歡。

  　

  4. 梅莉史翠普的演技很好，但對我來說有點太過頭、太戲劇化了。相形之下麵包師傅的

  老婆演技好到嚇死人，每一段戲都說服人。最後回魂那段我都快哭了。（演技好到回家會

  立刻估狗她然後去她粉絲頁按讚的程度。）

  　

  5. 小紅帽女孩可愛中不失討人厭，很棒的選角，唱「Your Fault」時我都想揍她了。相

  形之下傑克的小男孩就還好，但跟牛的感情演得很好，感覺他是真的喜歡動物XDDD

  　

  6. 強尼戴普（很可能是）從影以來最失敗的演出。我完全不能接受他的裝扮、表演與唱

  功，最後那幕狼嚎的定場跟燈光我簡直不忍看。不明白為什麼不乾脆 CG 一隻狼就好。

  　

  7. 跟大野狼有關的部分都很糟。不知道為什麼掉進胃裡那段要這樣拍。不是「覺得很玄

  想不透」那種為什麼，而是「幹拎娘這在拍三小」的為什麼。

  　

  8. 這電影倒是提醒了我第一次看拜訪森林時就有的抱怨：長髮公主那對角色感覺只是為

  了鋪頭髮哏而加的，有點生硬。聽同行的朋友說，在音樂劇裡（我有看過──現場的跟影

  片都看過──但我不記得了）長髮公主是要死的，但電影裡改掉了沒有死。這讓這對角色

  更沒意義了。

  　

  9. 我很驚訝迪士尼竟然把灰姑娘兩個姐姐砍腳的那段演出來了，給個讚XD

  　

  10. 有看過音樂劇的都知道，這齣戲的「旁白」角色在下半場有個巨大爆點，讓觀眾非常

  難忘的巨大爆點。在電影裡──可能因為形式上的限制──被改掉了，但改的方式我完全

  能接受，不但不刻意，我甚至還有點感動。

  　

  11. 原版的拜訪森林是故意藏了一些跟「性」有關的小刺的：小紅帽大野狼的歌詞暗示、

  兩個王子對唱那段、還有麵包師傅妻子與王子的森林邂逅。某個程度上──因為這是迪士

  尼──所以這些都被閹割了。It''s ok to me, 不到不能接受的程度。

  　

  12. 魔女最後退場的那段太吵，不仔細看／沒看過舞台劇可能一時會搞不懂他們在丟豆子

  ／撿豆子，更重要的是，這段最最關鍵、堪稱是全劇精神的歌詞因為風暴的音效而聽不太

  清楚，很可惜。

  　

  13. 這點也是挑刺：音樂劇裡女巨人的臉是沒有出現的，（我竊以為）這多少有點象徵的

  意思。但電影裡把臉演出來了，雖然（可能是）為了保留音樂劇的精神而有些遮掩，但與

  其要這樣，不如一開始就不露臉啊。

  　

  14. 傑克媽媽的死法某個程度上在電影裡也被閹割了。不過好吧，這是迪士尼。It''s ok

  to me.

  　

  15. 最後不得不說，《拜訪森林》裡的女巨人比《進擊的巨人》裡的女巨人好殺多了。好

  殺一萬倍。（真心。）


  --'
