title: '"寶萊塢"一辭的由來'
content: '貧民百萬富翁得了獎以後聲勢炒得火熱，


  連帶著也有人對印度電影好奇了起來，


  而印度電影工業最為人熟知的，就是所謂的"寶萊塢"，


  以下內容是很久以前我在八卦版回應有人詢問寶萊塢的八卦，


  就當給有興趣的捧由參考一下囉，我看寶萊塢的時間其實沒多久，


  內容若有誤還請大家指正  ^^


  作者: lovelandbird (＊~NAMASTE~＊) 看板: Gossiping

  標題: Re: [問卦] 有沒有寶來烏的八卦？

  時間: Thu Jan  8 21:14:49 2009


  嗯...身為印度電影版的版豬，看到寶萊塢的話題，


  跳出來回文，我想也是很合理的...XD



  寶萊塢(Bollywood)是指位在北印度孟買的大型工業電影基地，


  這名字的由來，的確是跟好萊塢有點關係，


  大約是在1980年代印度媒體叫出來的，


  主要是結合了孟買(Bombay後來改成Mombai了)跟美國好萊塢，


  不可否認這名字其實是有向好萊塢致敬跟希望能夠達到跟好萊塢一樣成就的意味，


  但是其實印度第一部電影在1913年就出現了，之後他們的電影工業就一直很發達，


  所以他們有些人其實不太喜歡寶萊塢這名字。


  而寶萊塢也不代表全部的印度電影，


  因為在印度還有很多其他的大型電影工業基地，


  而因為印度方言眾多，所以這些影業基地拍出來的電影都有自己的主要發音語言，


  例如南印度的Tollywood拍的電影以泰盧固語為主(寶萊塢是用印地語)，


  另外還有以泰米爾語為主的Kollywood等等，


  而整個印度影業基地加起來光是電影(不包括電視劇，廣告等有的沒的影視產品)


  就有八百多部，所以才會有人說印度是電影年產量最大的地方。



  其實這跟他們的教育還有觀影習慣有關係，


  一來是他們不一定聽得懂全部的電影台詞(他們官方語言就有十幾種，方言更是多到嚇人)


  而且也沒有字幕，所以有時候真的是看爽的，那當然電影氣氛好跟歌舞精彩他們會看得比


  較開心，


  二來他們電影票價雖然便宜，但是也跟他們吃一餐差不多，


  觀眾當然會希望有值回票價的感覺，最好什麼片型都可以在一部片裡面看到，


  而觀眾的觀影習慣當然也漸漸讓許多寶萊塢片子有了拍片的固定模式。



  不過其實也不是每部寶萊塢電影都有歌舞，


  而寶萊塢以外的影視基地，有些其實是不喜歡在片子裡唱歌跳舞的，


  只是台灣比較常看到的片都是寶萊塢的，


  所以大家才會覺得印度電影怎麼都在唱歌跳舞。


  加上寶萊塢近年來有些導演其實比較有自己的主見，


  認為自己拍的片裡面硬要放歌舞真的很奇怪，所以也開始減少甚至不安插歌舞，


  例如去年底高雄電影節引進的Chak de India! 整片就是在講女子曲棍球隊的故事，


  導演覺得女生拿個球棍跳舞真是太可怕了........囧


  所以堅持只能有歌曲配樂，不要放舞蹈，


  沒想到印度票房居然..........賣得不錯XD，


  所以印度民眾的觀影口味其實有時候也是會變化的。



  不過就我個人來說，我還滿愛看歌舞的，


  所以我是希望寶萊塢電影可以繼續保有載歌載舞的風格啦XD


  :

  :


  這沒有什麼好怪的，


  我也是去年在第四台看到奇魔俠才開始知道寶萊塢電影，


  在這之前我也覺得電影演到一半唱歌跳舞很北七，


  結果現在.........


  我覺得我講話講到一半都開始想用唱的.....囧





  另外補充，嘟嘟嘟嚕搭答答跟寶萊塢電影其實是沒有太大的關係的，


  那首歌的歌手叫達拉米漢迪，


  因為印度流行歌曲其實很多都是電影歌曲


  (電影裡的歌曲大部分都是由專業的"幕後歌手"代唱的)，


  很少有單純的流行唱片，而直到1995年，這位紅遍國際的印度F4出現，


  印度才真正有獨立於電影歌曲以外的流行唱片市場被重視，


  所以他可以算是印度流行歌曲界的偉人呢XD



  然後北印跟南印對男明星的審美觀還差滿多的，


  北印的寶萊塢男明星通常都要具備帥氣的外表或是健美的巴底，


  而南印影迷則普遍覺得男人就是要有年紀有鬍子有肚子才算是正港的男子漢，


  所以他們超紅的明星很多在我們眼中都像大叔一樣，


  例如在南印超紅的印度麥可(赤拉維尼)那種型就是了.....XDDD



  不過北印南印對美女的標準倒是差不多...


  南印電影裡的女生也都很漂亮呢...


  --


  偷廣告一下，印度電影版在 視聽劇場-->批踢踢國際影城-->India-movie


  歡迎對印度電影有興趣的捧由來參觀唷^^


  --'
