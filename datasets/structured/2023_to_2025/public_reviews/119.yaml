url: https://www.ptt.cc/bbs/movie/M.1580028273.A.07F.html
title: '[有雷] <哪啊哪啊~神去村WOOD JOB！> 觀後感'
content: '本片的題材很普通，但卻因為它的普通，反而讓裡面的故事更像是真實發生在現實生活的

  體驗。



  男主角平野勇氣，是個隨處可見的大學生，喜歡玩樂，也有著不需煩惱的家庭經濟，但在

  面大學落榜時，卻也對人生產生了迷茫，他就像許多年輕人一般，可以享受當下的快樂，

  但卻看不到未來的自己將立身何處。





  而這樣迷茫的年輕人，剛好看到了一本印有正妹照片，招募林業人員的雜誌，雖然不知道

  要做什麼工作，但遵從本性追求快樂的習慣讓他隻身進入了偏遠的村莊，「神去村」，並

  成了林業的實習生，但當他來到這個地方，才發現這邊與他習慣的都市大不相同，沒有網

  路、也沒有五光十色的KTV和商店，只有凶巴巴的教官、累人的體力活、和水蛭、蛇酒及

  生肉食物等詭異的東西，那雜誌上神秘的女神也不見蹤跡，面對這些讓人不習慣又無法接

  受的事物，也讓勇氣才踏入森林就想要逃離這種恐怖的地方。



  男主角對於原始山林生活的不適應，就像是每個人到新環境都會經歷的事情一樣，別人認

  為稀鬆平常的事情，自己卻始終無法理解接受，也導致我們想要進入新環境時，往往因此

  而打退堂鼓，但在這個水土不服的時候，神秘的女神卻出現在男主的眼前，在經歷了許多

  自己根本不想體驗的事情後，終於找到了自己進入森林的目標，也讓男主角又燃起了期待

  ，但沒想到，讓自己撐下來的動力，不是女神的甜言蜜語，而是女神對於身為陌生人的自

  己毫不留情得怒罵和批評，但那不甘心在女神面前表現軟弱的倔強，卻也讓自己通過了實

  習的考試。





  而男主角的轉變，也成為了本片的精隨，一個極度排斥偏僻原始環境，又害怕兇死人教官

  的吊兒郎當男孩，要不是因為有漂亮的女神在山林，早就離開這個鬼地方，但在工作中，

  男主角卻發現能夠置身山林的美好、那凶巴巴的教官喜哥和奇怪的老伯們，也在自己習慣

  工作後，漸漸展現了純樸的一面。


  也因此，那迷茫的男孩，漸漸得愛上了這個地方，甚至在自己的前女友前來採訪時，因為

  他們瞧不起山林的態度，而大發雷霆，讓他們離開。



  也在此時，不只是男主角，也讓村里的人發現，這個男孩已經漸漸越來越像村子的一份子

  ，並默默得感動了一直很兇的大哥──喜哥，但就算如此，對於村里的長老來說，男主角

  仍然是外人，在即將展開的村落傳統祭典中，被長老們禁止參加，也使得愛上山林的男主

  發現，就算自己已經認為自己屬於這裡，但別人卻沒那麼輕易地接納自己。



  而在村里的傳統祭典快開始時，一個小男孩因為追逐甲蟲而跑入深山中，讓村裡的人為此

  跑入深山尋找失蹤的小男孩，而男主自然也跟著進入了深山，但山林廣大，視線也不好，

  要找人根本難如登天，而就在大家陷入困境時，白霧忽然升起，喜哥也示意男主不要動，

  因為這是山神的到來，一不小心可能會「被消失」在山林，但在此時一隻手卻拉住男主往

  前跑，而當那隻手離開，男主停下時，迷霧也散去，而失蹤的小孩就在出現在眼前，也讓

  男主在大家以為找不到小男孩時，像是英雄一般揹著小男孩出現在找不到辦法的眾人面前

  。



  也因為這個功勞，男主正式被村民認同，而得以參加村落的祭典，原本在得到認同前遇到

  了難以跨越的難關，那原本被認為難以親近又危險的山神，卻適時拉了他一把。



  山神雖然在片中只在這裡現身，且現身時間非常得短，但它也因此被刻畫得很好，平常雖

  然因為他的威嚴和力量而使人們記著他，但卻只會在最關鍵的時刻短暫現身，在解決問題

  後便神秘的消失，這種短暫幫助後就俐落離開的表現，完美得呈現了神明那神秘又超越常

  人的特質。



  除了有趣的劇情，在片中的許多橋段，都透過劇情和鏡頭讓觀眾對於文化和林業有了更深

  的感受。



  讓大家看到主角必須在危險的高大樹幹中辛苦工作，但在工作結束之後，卻又能看到那只

  有在高山樹林中才能看到的美好夕陽，讓觀眾就像是親身投入林業一般，自然而然體會到

  林業的辛苦和美好。




  而劇情中的有些話，也充滿著人類自古累積的智慧


  「把祖先的樹都砍掉，要怎麼留給下一代。」


  「我們種的樹，我們的工作表現，要在下輩子才知道。」


  這些謙虛、不忘本的精神，也讓人體會到，永續經營的重要性。


  在資本社會的現在，許多工作都以最大化收益為目標，但在拚命消耗資源的同時，卻也讓

  人們忘記了，當我們任由自己的慾望將所有資源消耗成自己想要的東西，那我們的下一代

  ，還能有什麼資源來生活。



  不懂得保留先人遺留的資源，產業又要怎麼延續，那些最原始工作才保留的職人精神，反

  而精闢得點出了現代社會的問題。



  而除了對於林業的描述，片尾也很有趣得表現了村落的傳統祭典，讓這部電影透過男主角

  的經歷，自然而然得將林業與自然共存的職業精神、農村獨特又悠久的文化，蘊涵在電影

  之中。



  這不只是一部帶給人們歡悅的小品電影，也是對於傳統產業、對於農村人們自然得與大自

  然共存的生活紀錄片，讓我們透過都市小男孩平野勇氣，去體會那最純真天然的農村生活

  。


  初日(hatsuhi)的部落格:



  初日(hatsuhi)的粉絲團:




  --'
