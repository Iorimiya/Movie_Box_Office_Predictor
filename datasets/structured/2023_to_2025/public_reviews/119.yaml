url: https://www.ptt.cc/bbs/movie/M.1424350667.A.80B.html
title: '[普雷] 魔法黑森林Into the Woods-所求不得'
content: "女巫、女師傅、女主角她們都真的得到所求了嗎？好像是，好像還是有憾。\n\n\n企圖將《灰姑娘》遇上《傑克與豌豆》、《長髮公主》、《小紅帽》完美揉合，也很巧\n\
  妙地利用實現願望(巫婆的和麵包師生子)串連長髮、紅披巾、白牛、水晶鞋，四個任務\n、二個願望，一次滿足。可是巫婆回復原樣究竟帶來什麼？好像也沒有比較好的結局。\n\
  頂多是麵包師之妻終於得子，看似新生命的希望罷了。\n\n然而灰姑娘的變身、傑克的冒險、長髮公主的脫出禁桎、小紅帽的被解救沒有更深入\n，很像是為了湊在一起的大雜燴。各自的生命課題想用音樂唱盡又嫌過短、過快，若能\n\
  跳脫音樂劇思惟，會不會有比較好發展的可能性？又急又密的連唱與接唱，好像是劇情\n的急轉版本，卻像極了巨人逼迫下無奈的「想走走不了」之胸悶現場。觀眾亦復如是，\n\
  電影院不能快轉，爾後在DVD快轉又失卻聽音樂劇的用意。那只有帶給人「說的說不定\n還真的比唱的好聽」的呼喊感。\n\n小紅帽的連結必要性何在？如果傑克是引出巨人，灰姑娘是引出王子，那長髮公主的描\n\
  述又過於花瓶，戲份太少，要說是畫龍點睛又不足夠，要完全刪除又感到可惜。明顯是\n麵包師之妹，看來也是片中唯一雙全的結局。這與另一位王子竟在黑森林和麵包師之妻\n\
  「短暫陷入愛河」的戲碼對比，好像前者更令人能接受。明日邊界的艾蜜莉布朗浪費了\n她的演技，倒是Mackenzie Mauzy長髮公主令人眼睛為之一亮，而歌喉讚的安娜坎卓克\n\
  是片中唱得最好的，自然無遺。可嘆的是女巫的悲劇性格與故事背景，顛狂、無奈、\n絕望，有種過猶不及的缺撼，雖是這樣說，最後獻身般的悲哀又顯得自暴自棄式的突\n兀不已，也許在母愛的可能性與另一種版本的自我放逐上可以再催加力道。\n\
  \n\n整體而言，灰姑娘的跌破眼鏡反轉版本，幸福始終留在當初最美好的想像中，王子竟\n然還真的就這樣離去，但願不如怪罪於黑森林的詭異迷霧或難以自拔的魔力上。這樣\n\
  的寫法要說是有創意呢還是也是某種意味的變不出新把戲？像是省成本的巨人，最終\n會面臨不得不露出可是又怪異無比的畫面，完完全全省略在天上的情節，只拍地上的\n事，又不能不讓巨人上場，好比除了沾醬油式的大野狼外，剩下的唯一、最後、「強\n\
  有力」的反派了。\n\n縱觀全片，該翻轉之處又不像黑魔女:沉睡魔咒的改寫來得深度與創意。似乎主打特\n色的音樂部分，變成令人難耐的忍受。僅有的亮點就是破關解任務式的RPG手法，四\n\
  件類寶物的蒐集，卻又沒有點出為何是這四個代表，有點像是為了勉強讓四人有所聯\n結的手法，創造出女巫難題。\n\n大體而言，這是種可以再改進的嘗試，大膽又嫌冗長、有新意又不夠昇華。是倉促又\n\
  是覺得好像過多了，是急迫又覺得有些不必要之處，是有流暢之處卻也有突兀的硬梆\n梆感，值得思考劇本的演出形式能有其它的變化嗎？\n\n\n\n\n\n魔法黑森林\n\
  Into the Woods\n上映日期：\n2015-02-18\n類　　型：\n音樂/歌舞、奇幻、劇情、喜劇\n片　　長：\n2時04分\n導　　演：\n\
  《芝加哥》羅伯馬歇爾\n演　　員：\n《穿著Prada的惡魔》梅莉史翠普、《神鬼奇航》強尼戴普、《明日邊界》艾蜜莉布朗特\n、《歌喉讚》安娜坎卓克、《星際爭霸戰》克里斯潘恩\n\
  發行公司：\n迪士尼影業\n\n每個童話裡都有一座魔法森林，還有會下詛咒的女巫；每個童話主角都期盼願望成真，但\n是，願望成真後不保證「從此過著幸福快樂的日子」。\n\
  \n改編自東尼獎得獎音樂劇，《魔法黑森林》結合了的許多耳熟能詳的格林童話，讓《灰姑\n娘》遇上《傑克與豌豆》，《長髮公主》和《小紅帽》一起躲避大野狼。童話中的主人翁\n\
  一起踏入黑森林冒險，還要提防會魔法的女巫。《魔法黑森林》賦予經典童話現代寓意，\n探討願望成真的代價。這部充滿魔力的音樂劇，由麵包師父和他無法懷孕的太太﹝艾蜜莉\n\
  布朗特飾演﹞開場，為了組成家庭，他們向會施法術的女巫﹝梅莉史翠普飾演﹞求助，到\n黑森林中冒險，一路上遇到了灰姑娘﹝安娜坎卓克飾演﹞、傑克、長髮公主、小紅帽、還\n\
  有惡名昭彰的大野狼﹝強尼戴普飾演﹞。\n\n本片由《芝加哥》及《神鬼奇航4：幽靈海》金獎推手羅勃馬歇爾指導，聯手百老匯當紅\n音樂劇WICKED製作人，集結演技派巨星梅莉史翠普和強尼戴普，當紅小生克里斯潘恩，聲\n\
  勢看漲的安娜坎卓克和艾蜜莉布朗特。大咖聯手，要顛覆大家對童話故事的想像。\n\n--\n[   在你能視別人為有價值的人之前，你首先必須視你自己為有價值的] 。P.203\n\
  \ [而那就是你們為何永遠無法真正的、單純的愛上別人的原因。因為你們從未真正的、\n單純的愛上你自己。]P.204【與神對話】\n\n\n--"
