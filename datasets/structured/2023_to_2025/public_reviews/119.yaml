title: 酸老頭伍迪艾倫(Woody Allen)十大名言
content: "原文： \n\n上回寫「愛情決勝點」(Match Point)時，曾說要整理一些\n伍迪艾倫(Woody Allen)這位酸老頭的名言，以下就是我心\n\
  中的伍迪艾倫十大名言，以及其他我認為非常好笑的話。\n\n所謂「十大」是依照我自己的評選標準，所以絕對主觀。\n\n***\n\nMy one regret in\
  \ life is that I am not someone else.\n\n這麼短短一句話，表達了「我一生都是個大遺憾」，那種酸\n氣，那種憤世嫉俗，天哪，我完全懂他的心情，有時候我真\n\
  希望自己是某部片裡面的角色，想把我的人生換成電影裡的\n人生。\n\n***\n\nI am not afraid of death, I just don't\
  \ want to be\nthere when it happens.\n\nI don't want to achieve immortality through\
  \ my work.\nI want to achieve it through not dying.\n\n每個人都怕死，伍迪至少很誠實，他不太可能是那個勸你不\n\
  要怕的偽君子。\n\n***\n\nI believe there is something out there watching us.\nUnfortunately,\
  \ it's the government.\n\nIf you want to make God laugh, tell him about your\nplans.\n\
  \nTo you I'm an atheist; to God, I'm the Loyal Opposition.\n\n我的觀念是，即使有上帝，他也不會理我。\n\
  \n***\n\nIf my films make one more person miserable, I'll feel\nI have done my job.\n\
  \n這也是我的人生目標，只是不一定是靠拍電影。安慰別人從\n來不是我的長處，我只知道如何消滅別人的希望。\n\n***\n\nIn Beverly Hills...\
  \ they don't throw their garbage\naway. They make it into television shows.\n\n\
  我覺得亞洲國家也是如此吧。\n\n***\n\nLife doesn't imitate art, it imitates bad television.\n\n\
  伍迪艾倫最愛開人生的玩笑了。\n\n***\n\nI feel that life is divided into the horrible and the\n\
  miserable. That's the two categories. The horrible\nare like, I don't know, terminal\
  \ cases, you know, and\nblind people, crippled. I don't know how they get\nthrough\
  \ life. It's amazing to me. And the miserable\nis everyone else. So you should be\
  \ thankful that\nyou're miserable, because that's very lucky, to be\nmiserable.\n\
  \n這是我高中時代第一次讀\"Annie Hall\"的劇本時，最震撼也\n最愛的一句話。多麼正確！多麼精準！我是從那時開始迷上\n伍迪艾倫的。\n\n***\n\
  \n其他某些我覺得也很好笑的名言，就列在下面讓大家欣賞吧。\n\nAnd my parents finally realize that I'm kidnapped\
  \ and\nthey snap into action immediately: they rent out my room.\n\nAnother good\
  \ thing about being poor is that when you are\nseventy your children will not have\
  \ declared you legally\ninsane in order to gain control of your estate.\n\nDon't\
  \ knock masturbation. It's sex with someone I love.\n\nDon't think of death as an\
  \ ending. Think of it as a\nreally effective way of cutting down your expenses.\n\
  \nFor a while we pondered whether to take a vacation or\nget a divorce. We decided\
  \ that a trip to Bermuda is over\nin two weeks, but a divorce is something you always\
  \ have.\n\nHaving sex is like playing bridge. If you don't have a\ngood partner,\
  \ you'd better have a good hand.\n\nI asked the girl if she could bring a sister\
  \ for me. She\ndid. Sister Maria Teresa. It was a very slow evening. We\ndiscussed\
  \ the New Testament. We agreed that He was very\nwell adjusted for an only child.\n\
  \nI didn't know he was dead; I thought he was British.\n\nI will not eat oysters.\
  \ I want my food dead. Not sick.\nNot wounded. Dead.\n\nI've never been an intellectual\
  \ but I have this look.\n\nIf Jesus Christ came back today and saw what was being\n\
  done in his name, he'd never stop throwing up.\n\nIf it turns out that there is\
  \ a God, I don't think that\nhe's evil. But the worst that you can say about him\
  \ is\nthat basically he's an underachiever.\n\nIf only God would give me some clear\
  \ sign! Like making\na large deposit in my name at a Swiss bank.\n\nI'm astounded\
  \ by people who want to 'know' the universe\nwhen it's hard enough to find your\
  \ way around Chinatown.\n\nI'm very proud of my gold pocket watch. My grandfather,\n\
  on his deathbed, sold me this watch.\n\nInterestingly, according to modern astronomers,\
  \ space is\nfinite. This is a very comforting thought - particularly\nfor people\
  \ who cannot remember where they left things.\n\nMore than any time in history mankind\
  \ faces a crossroads.\nOne path leads to despair and utter hopelessness, the\nother\
  \ to total extinction. Let us pray that we have the\nwisdom to choose correctly.\n\
  \nMost of the time I don't have any fun. The rest of the\ntime I don't have any\
  \ fun at all.\n\nOh, now there's only one kind of love that lasts. That's\nunrequited\
  \ love. It stays with you forever. (unrequited:\n無報答的；得不到報酬的)\n\nThere are two types\
  \ of people in this world: good and\nbad. The good sleep better, but the bad seem\
  \ to enjoy\nthe waking hours much more.\n\nThere are worse things in life than death.\
  \ Have you ever\nspent an evening with an insurance salesman?\n\nTo me nature is…spiders\
  \ eating bugs, and big fish eating\n little fish, and plants eating plants, and\
  \ animals\neating...It's like an enormous restaurant, that's the\nway I see it.\n\
  \nWhat if everything is an illusion and nothing exists? In\nthat case, I definitely\
  \ overpaid for my carpet.\n\nYou can live to be a hundred if you give up all the\
  \ things\nthat make you want to live to be a hundred.\n\nYou can't control life.\
  \ It doesn't wind up perfectly.\n Only...only art you can control. Art and masturbation.\n\
  Two areas in which I am an absolute expert.\n\n\n--\n\n   我的部落格: \n\n--\n◆ From:\
  \ 220.135.68.71"
