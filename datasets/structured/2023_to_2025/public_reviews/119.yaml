title: '[普雷]魔法黑森林 Into The Woods '
content: "圖文網址:\n\n\n   看【魔法黑森林】之前，我以為這部片就像是【黑魔女：沉睡魔咒】，將童話故事改\n\n編，但近期才得知本片是改編自百老匯的舞台劇，舞台劇我沒看過，以下影評並不與原作\n\
  \n做比較，單純就【魔法黑森林】本部電影做影評。\n\n\n　　快速評論這部電影，劇情普通，歌不難聽，角色的刻劃嚴重不足。本片故事內容集合\n\n了「小紅帽」、「仙履奇緣」、「傑克與豌豆」、「長髮公主」四部童話，並以一對麵包\n\
  \n師傅夫妻做為連結四部童話。四部的故事很多部份都以歌唱的方式帶過，並沒有演出來，\n\n全片重點還是聚焦在麵包師傅以及童話後的故事發展，所以在觀影前請不要期待錯誤了。\n\
  \n\n　　劇情的部分，以麵包師傅夫妻為主線貫穿其他四部童話，所以整部電影算是有五個故\n\n事，等五個故事都差不多要結束時，在最後彙整做一個結尾。整部片主要想表達的劇情並\n\
  \n不會太深奧，就如童話故事簡單；發生不幸的事時人人都想找戰犯，但那其實沒什麼意義\n\n，我們應該做的是尋找解決之道，並在日後幫助同樣不幸的人。而主線故事之外，還是有\n\
  \n\n許多的支線故事，但由於一部電影要分述五個故事，導致每個故事都沒有太深入的敘述，\n\n甚至埋了些伏筆沒有解釋，最後導致有些故事顯得不太合理。看的出來迪士尼想要效仿【\n\
  \n黑魔女：沉睡魔咒】將故事做些改變並使之合理化，但改變後只讓原先的童話變得更童話\n\n，非常多的地方讓人一頭霧水，且在欣賞音樂的同時還有時間去想劇情中矛盾的地方。\n\
  \n\n　　角色上就跟劇情一樣，太多的角色反而讓每個角色沒有發展的時間，就算身為主角的\n\n麵包師傅夫妻檔也沒太多的時間可以發展，每個角色的性格轉變都顯得太過於突然，明明\n\
  \n前一刻出現時還是個有點懦弱的人，下一刻卻突然變成一位勇者，不論是主角、配角、反\n\n派，都沒有太多的時間去刻劃。看完電影後不會對哪個角色特別印象深刻（對Emily\n\
  \nBlunt印象深刻原因是因為本人非常喜歡她在Edge Of Tomorrow的演出），看完電影之後\n\n我甚至覺得有些角色根本可有可無，個人認為把「長髮公主」這段故事給拔掉，整部片也\n\
  \n不會有什麼改變，整部電影看完只對幾首不錯聽的歌還比較有印象。\n\n\n\n  　總結這部電影，融合了太多童話故事的大雜燴反而變得有點四不像，許多感覺像是歌\n\
  \n劇的舞台效果被直接搬上大螢幕，反而造成反效果。\n\n【魔法黑森林】 6.5/10\n\n(差強人意，轉台轉到可以看一下，看的時候也不必太認真)\n\n\n\
  （以下有劇透，請注意！！！）\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n　　片中的巫婆弄瞎王子的眼睛遭到大家的撻伐，灰姑娘在成為皇后之後卻弄瞎繼母的眼\n\
  \n睛，卻沒得到什麼報應，完全不知弄瞎繼母眼睛這段是要做什麼。而這個世界的樹應該每\n\n個都比鐵塊還重，片中的巨人都不是樹的對手。本片分級是保護級，感覺卻比普遍級的【\n\
  \n爆走企鵝】更像給小朋友看的（？）。\n\n\n\n\n--"
