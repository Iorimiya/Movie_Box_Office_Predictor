url: https://www.ptt.cc/bbs/movie/M.1421173483.A.B5D.html
title: '[好雷] 壁花男孩之是男的一定要看'
content: '看見有艾瑪華森就租來看


  原本以為就是一般的少年維特


  結果意外的比想像中好很多


  很重要理由應該是劇中並沒有特別描述苦惱的部分(被wallflower誤導了~)


  反倒是很單純的就一段一段故事演下去


  而亮點是故事間很多人跟人之間的互動情節拍的很自然動人 相當突出


  看到就不自覺的會有溫馨共鳴的fu


  另外有很多幕的視覺效果也很棒 像是隧道跟雪地昏迷前&每一個Emma特寫鏡頭



  演員方面Patrick演得很基 特別是後段連罵son of the bitch都可以這麼娘


  如果不是本色演出的話還真是相當厲害


  主角就還OK



  最重要就是Emma正到爆炸 導致我很多時間都在感歎怎麼這麼正而沒注意到劇情在幹嘛


  I think she''s really acting , but all the camera captured is her beauty.


  應該說工作的女人最美麗還是這種意外的邂逅最動人咧


  總之這部電影滿滿的記錄了Emma Watson的正


  因此無論如何任何一個男性都應該來看看 正到爆炸!


  --'
