url: https://www.ptt.cc/bbs/movie/M.1366880298.A.706.html
title: '[好雷] 壁花少年 The Perks of Being a Wallflow'
content: "以下為純文字版\n圖文並茂版請看:\n==============================================================================\n\
  \n\n    這類探討青春期自我認同的YA片多如過江之鯽，若不是有人推薦，我實在也不知道該\n挑哪片來看。當初這片上電影院的時候，我等於是完全沒注意到(沒有特別喜歡Emma\n\
  Watson之餘、宣傳也沒很強力)，好在一堆朋友狂推讓我沒有錯過這片。\n    號稱文青怪咖必看的這片，確實說出了一些我們17歲時難以名狀的青澀鬱悶。\n\n\
  \n    劇情上偏向單純的單線發展，除了偶爾有童年回憶的flash back，全片主要都在講述\n閉俗的怪咖少年Charlie(Logan Lerman 飾)在備受排擠和學校適應不良的壓力下，如何跟\n\
  Sam(Emma Watson 飾)及Patrick(Ezra Miller 飾)從相識到深交，在彼此的成長過程當中\n扮演重要的角色。\n    這種故事的輪廓大致上類似，在此也不一一贅述，而是聚焦在這種片子分出高下最重\n\
  要的點: 有沒有能創造出一些經典的橋段及角色?\n\n\n    在橋段上面，最為搶眼的莫過於前後各出現一次的隧道快車。\n    光就感受上來說，昏黃迷離的燈光搭配上經典搖滾歌曲(David\
  \ Bowie的Heroes)，隨\n著傲氣的歌詞大聲唱著舞著、駕著快車不顧一切的向前駛去，這是每個青少年都做過的不\n羈夢，在這片就以這樣的形式凝結在腦海中，堪為經典。\n\
  \    就意義上來說，這場景前後都出現一次互相呼應但各異其趣。第一次是出現在在三人\n剛熟識時候，三人對友情、愛情、未來都充滿著希望，三個人笑的多麼天真彷彿這條路可\n\
  以沒有煩惱的一路開下去；而三個人一起走過感情失利、友情生變之後，能夠回到最初的\n地方一起攜手同遊，那是種成長的過程、也是Charlie永遠無法忘記的一刻。\n\
  \    年輕是一場熱病，誰能夠不發一次、不出一身冷汗就渡過?有著幾個爭吵、分離後還\n能相擁歡笑的好友，那不是我們每個人都期待的青春夢?\n\n    另外一幕我印象最深的，是在Patrick的戀情曝光，在學校餐廳被同學霸凌而後\n\
  Charlie出面解圍的那段。\n    當Patrick瑀瑀走向Brad(Johnny Simmons 飾)，問他You gonna do anything的那段\n\
  真是看到我都要淚崩了，最後那句faggot是最後一根稻草，但那不全然是生氣，而是悲憤\n到了極致的必然結果。不論是Patrick或是Brad，看著自己最愛的人就站在前面，卻得像\n\
  陌生人，不，是像仇人一樣，誰能不難過、誰能不心疼?\n    導演接著使用了flash back的手法處理拳腳相向，除了免去些殘暴的畫面、也符合\nCharlie一直有的幻覺的問題；接著補上Sam及Brad寥寥兩句的道歉，某種程度表達出了年\n\
  輕的我們對於愛情、道歉、和解這些字眼有多難說出口。\n\n    第三個想說的是這片著墨甚多、也是片中幾乎每個青少年角色都深陷其中愛情的部份\n。\n    不得不提到那句We\
  \ accept the love we think we deserve，第一次是困惑的\nCharlie聽英文老師說、第二次則是他領略了之後跟Sam說，同樣是一前一後的手法表現出\n\
  Charlie在這故事中的成長，也是這是片中的每個人為愛傷痕累累的原因，但回頭想想我\n們自己不也是這樣嗎?\n    選了不敢承認感情的人、不懂得珍惜的人，會不會都是因為我們自己也不夠愛自己?\n\
  很奇妙的，年輕時我們都在愛中委屈自己，長大後卻不想又不敢隨便再為愛改變，孰優孰\n劣，卡在中間的我們實在是很值得思考啊... ...\n\n\n    其他還有不少值得一看的橋段，像是在True\
  \ or Dare上的告白實在是最糟的時機但又\nYA的可以、幼年被性侵的陰影造成幻覺(這部份有點像神秘肌膚 Mysterious Skin)靠家庭\n友情的力量走出來...\
  \ ...但歸根究底，這些橋段的成功都是在三個基本角色塑造好的條\n件下才能達成。\n    名氣最高的Emma Watson擺脫了哈利波特 Harry Potter系列時較缺乏人味的演戲方式\n\
  ，這次的演出有其揮灑空間，也讓我們看到她不只是妙麗的一面；在我心中本來只有波西\n傑克森 Percy Jackson印象的Logan Lerman，這次成功的把一個本來膽怯內向、後來伸出\n\
  觸角探索世界的怪咖Charlie詮釋出來讓人刮目相看，也讓這片成功的成為他的代表作。\n    最後是看完這片熊熊愛上的Ezra Miller，第一次看完他在凱文怎麼了\
  \ We Need to\nTalk About Kevin的演出其實是帶著三分畏懼的，但看完本片完全改觀，不但表達出為感\n情傷痕累累的心碎，更能駕馭那開朗不羈瘋狂的一面，俊美如斯又氣質突出才21歲的他實\n\
  在是讓人對他的未來發展很期待啊!\n\n\n    總的來說，這部片子角色塑造成功、劇情生活化又不失深意，道出了許多殘酷青澀的\n青春紀實和長大成人的過程，絕對可以算是此類型YA片當中的佼佼者。實在是不只怪咖文\n\
  青會喜歡的一部電影，推薦給喜歡這種片子的你趕快去DVD店把它帶回家吧!\n\n--\n只是喜歡看電影的一個普通人：\n\nmovie版。z-6-10。\n\n\
