url: https://www.ptt.cc/bbs/movie/M.1428255103.A.A40.html
title: '[討論] 壁花男孩，Charlie與Sam在房裡說的話'
content: 'hi, 大家好


  看完這部電影，心裡當然有些想法，也看了版上 一些觀後心得


  大致上，能講的就不重複，不過有一點...電影沒有點出


  但我總有小疑問，依劇本


  Charlie跟阿姨的關係在最後呼之欲出，


  那回朔Sam的歷程


  高一時，經常跑趴醉倒(如同台灣常說的撿屍)


  選錯男人，感情中讓自己卑微(英文台詞應為small)


  那麼 Sam小時候是否經歷過與Charlie(阿姨)相同的事，影響著自己?


  線索 從導演與編劇 設計的橋段與對白


  場景1

  Charlie第一次走進Sam房間，Sam送一台打字機，


  Write about us


  I will.


  談到初吻時，大家熟知Sam說確保你的初吻的人是愛你的，但是當Charlie問Sam時


  Sam提到初吻是11歲，那個人Robert(?)是爸爸的老闆/同事...到這邊劇情就沒再交代


  接著第一次Sam kissed Charlie


  場景2

  Sam確定去賓大，告別聚會中，Charlie再次走進Sam房間，


  Sam提到剛分手的男友Craig(?)，共進午餐後，分手是對的，開車回來時


  Sam自認覺得在感情中好卑微，問了一句:為何我愛的人與我在愛情中找一個


  根本不會珍惜彼此的人相愛。。。


  We accept the love we think we deserve...


  後來在Sam的反問與逼問下(包含自我表述:我希望大家喜歡真實的我...


  Charlie說了


  I know who you are, Sam  (中間省略兩小句)


  how much we''re alike and ...how we''ve been "through the same thing"


  And you''re not small, you''re beautiful...


  然後兩人第三次親吻(第二次應是真心話大冒險)，中間的Sam觸摸讓Charlie一度暫停


  最後的劇情，才揭露 Charlie從小被阿姨侵害過


  從Sam的初吻，到Charlie的告白，是否可以推判出Sam也曾經歷過類似的事


  不然編劇的台詞就不了了之了...如果是，那戀童癖罪犯真的全該被抓進去關


  --'
