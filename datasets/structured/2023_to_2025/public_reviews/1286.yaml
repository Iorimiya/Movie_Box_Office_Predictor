url: https://www.ptt.cc/bbs/movie/M.1701602168.A.6D2.html
title: '[  雷] 壁花男孩'
content: "防雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n第一次看到壁花男孩是前年在看netflix下架片單時\n看到一個我可能會有著強烈連結的片名和劇情\n\
  之後的百感交集一路到現在不曾消退過\n這次重新上映當然不可能錯過重溫百感交集的機會\n查理真的跟我很像很像\n我跟他有著很像的個性、故事、困難和愛人\n幾乎每個劇情我都能身歷其境的感受他\n\
  (除了被海倫阿姨性侵我比較還好\n畢竟我很幸運沒遇過這種事\n一開始在派對時我一行淚就流下來了\n比起我查理更有勇氣的跨出一步\n也才能帶出派翠克和珊的友情\n\
  \n伊薩米勒即使破事做一大堆\n當一個演員還是相當不錯\n不過這個角色的設定他演起來應該是如魚得水\n艾瑪華森就算演技比較遜色\n但我還是能清楚明白查理對他的喜歡\n\
  他代表了人在感情中的盲區\n就是那句棒透的台詞:我們只接受自己認為配得上的愛\n\n(這段保羅路德的演出也很錦上添花)\n其他像是跟老師做朋友\n或是談一段自己根本不喜歡的戀愛\n\
  這些也是我實際做過的\n所以這部電影就算不是我心目中的第一名\n那份強烈的連結感絕對不是其他可以取代的\n結局把這些情緒變成了充滿感性台詞的感性場景\n聽著大衛鮑伊的heroes,查理吻著最愛的珊\n\
  一朵窩在牆壁的花,這時也綻放出了無限的希望\n此刻的一切皆是永恆...\n\n盡力只想寫個大概,結果已經有些分量了\n隨便抓一段出來都能寫出超過我平常的份量吧\n\
  還是要做個結尾吧哈哈\n感謝這次的重新上映讓我能感受這些\n影廳內幾次流淚就是最好的證明\n雖然脫離青春一段時間的話會比較難有所連結\n我還是希望大家有興趣和機會可以看看這部電影\n\
  也謝謝大家看完這篇夾雜我個人情緒的文\n好的電影就是為了這種心境而存在的\n----\nSent from  on my iPhone 14 Pro Max\n\
  \n--\n如果我是那雨滴的話...\n那麼，我能夠像把不曾交會的天空與大地連接起來那樣...\n把某人的心串聯起來嗎？\n\n--\n           \
  \                         12/04 16:38"
