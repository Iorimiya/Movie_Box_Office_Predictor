url: https://www.ptt.cc/bbs/movie/M.1452778967.A.FD1.html
title: '[有雷]《壁花男孩》—— 告別英雄 '
content: '沒多好讀版：



  ----



  你可能也有過一個老師，搞不好也教文學，

  但他沒有非得要在第一堂課就揭穿只有查理才知道的狄更斯謎底。

  起初你只覺得他不差，直到他居然用荒木經惟和森山大道的攝影來解釋詩品，

  你是真的看傻了，才驚覺自己缺少的原來不只是台相機而已。

  至於那次用Dream Theater的音樂來詮釋解構主義，你大概以為這就是最真的夢了，

  學妹問這首歌叫什麼？把歌名寫下來的人寥寥無幾，

  而你正在考慮究竟要不要出賣其實不存在的優越感，

  你知道並且也想讓他知道，你沒動筆，是因為根本不用抄。




  而你終於也擁有第一本影響你一生的小說。

  於是你試著像查理一樣，

  故意在鐘響後拖著其實並不沉重的腳步，走向不真的必要經過的教室前門，

  奇怪的是世界上所有的安德森老師似乎都有著相同的眼神，

  或許你不只是一個人，但你就是覺得，他知道你和身邊的人要問的東西不一樣。

  最後一堂課結束了，你用最拙劣的技巧把能問得到的都給問了，

  比你所能想像的搭訕都要還緊張，他直說沒必要，

  倒是熟練的把早已準備好的聯絡方式都留下了。





  你也有過那樣一個朋友的，現在只能假裝彼此有在聯絡。

  你們都不一定是派翠克那樣的同志，但曾經親得像影子。

  朋友翻夠了白眼，唉呀麻煩go get a room you two，沒料到竟有旁人當了真。

  女人的問題好解決，男人的問題卻從沒碰得這麼深，

  他不是真的看穿你，倒是你以為已經夠懂他了。

  回想起來都是談笑之間，你也沒有真的就把過了眼的都看作雲煙。





  你善於觀察、能解人意，你是一朵壁花，

  不用他替你舉杯，你自己明白。

  他甚至不能碰酒，只要一口，

  就沒人記得他真實的樣子，在他身上你也懷疑什麼才是真實。

  你不會忘記那些不堪的天明，你總是醒得很早，你知道那還是一個貼近風的年齡。





  你也可能有過一個姍，他不用和戀夏五百日裡的夏天一樣都愛死了The Smiths，

  他不一定是你的初戀，更不會是你的初吻，

  但光是起初那幾次曖昧的觸碰，都遠比你所擁有的吻都還要刻骨銘心。

  他並不希望你會遇到一個更好的人，他搞不好希望自己就是你所能遇到最好的人。

  他沒有像姍一樣都和爛人在一起，是因為你分不清楚誰比較爛，

  你不覺得自己比他們差，但同時你也學到，

  一個人爛不爛，和別人選擇要不要愛他，往往是一點關係也沒有。





  你的日子說不定也像查理一樣難熬，

  你的恐懼可能也一樣來自童年，更可能讓你遺忘整個童年。

  從此你害怕夜裡傳來的麻將聲，你更害怕它們突然就停下了，

  你知道房門外會傳來讓你淚流不止的爭吵聲，

  有時卻只是一片讓你更想流淚的寂靜。

  在那個年紀，你所知道的已經太多，卻又還不夠多，你的心裡還是存在英雄。

  你沒想過，有一天你會自己展開雙臂，你會說，即使只是當下也好，你都接近了永恆。





  David Bowie就這麼離開人間了，你又想起了高中那次英文課，

  就像查理把艾德唱片行說成了個樂團一樣，你也把David Bowie唸成了Bob Dylan，

  你感到一股搖滾樂迷特有的無謂羞愧，卻連英文老師都沒有察覺。

  你不一定要喜愛過大衛鮑伊，但是你遲早都會發現，英雄也只是凡人，

  他們的幻影，都會一個個跟著青春陪葬。

  你會永遠深愛那些幻影，但你也不真的需要那麼傷心。





  兩年後，那名老師沒有再回到中技教書，我也決定放棄了累積兩年的補教資歷，

  可能人都是會變的，不變的都只是定格在照片中的容顏。

  畢業前最後一次見到他，我們從九樓走到了停車場，

  其實也不能確定中間我們聊了什麼，居然還提到了德國的黑金屬樂團吧，

  此刻那居然一點也不像沉睡在心中的東西，我只想趕快結束這些遮遮掩掩的話題。

  忘了是誰先開口的，彼此告別過後，他突然又把走了幾步的身子給轉了過來，

  對望著自己背影的我，笑著說了一句：人一生追求的到底是什麼？我不知道。





  那天，我告別了心中所有的英雄。







  (David Bowie / Heroes)




  --'
