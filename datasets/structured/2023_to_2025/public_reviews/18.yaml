title: '[普好雷] 花漾少女心'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  斯洛維尼亞導演烏爾斯卡‧喬琪，在2019年於坎城駐村計畫孕育的首部長片《花漾少女心

  》，入選第27屆台北電影節《影迷新宇宙》單元，從世俗與宗教的角度看少女的成長。



  16歲的她正值青春期，在天主教女子合唱團中，她的穿著略顯稚嫩，小心翼翼地想融入團

  體，舉止卻難掩青澀。此時院內正逢翻修，魁梧工人們穿梭其間，粗獷身影撩撥著她們初

  萌的情思。



  電影的片尾曲是與英文片名「幾乎」同名的歌曲，美國另類搖滾樂團「音速青春（Sonic

  Youth）」的「Little Trouble Girl」。MV裡，一個外星人四處走著，格格不入的樣子就

  像青春期的女孩，而前奏不協調的和弦與古怪的曲調，則為整首歌多層次的旋律與內省的

  歌詞定下基調。歌詞與電影裡的故事不謀而合，講述女孩在成長過程中遇見初戀，媽媽的

  態度往往會從鼓勵其綻放轉變為反對，而讓女孩感到有些內疚。當然，假使媽媽希望女孩

  永遠是那個聽話乖巧的樣子，她也做得到，只是媽媽永遠不會知道女兒內心在想什麼，也

  不會知道她其實早已是個「麻煩的壞女孩」。



  片中的「麻煩壞女孩」看似就是主角露琪亞，其實以安娜瑪莉亞為首的一幫死黨都是，但

  她們真的壞嗎？塗塗口紅、偷拿工人上衣的惡作劇、半夜不睡覺玩真心話大冒險、偷溜下

  床、跑到河邊看工人洗澡、打小報告、練唱不夠投入，不正是這個年紀的孩子正常發揮嗎

  ？要說不得體當然是，但肯定不至於到罪大惡極的地步。《花漾少女心》以略嫌嚴厲的角

  度，帶領觀眾一同審視這群女孩在移地練唱的三天裡，經歷哪些變化與成長。



  在前往修道院移地前，畫面閃過眾多天主教教堂的聖母像，不斷加深主角們所處的社會可

  能相對保守的印象。正值青春期，對異性抱有幻想的露琪亞，進到修道院之後，雖說也朝

  工人多看幾眼，但真正吸引她駐足的還是聖堂裡莊嚴的聖母像。露琪亞的初經尚未到來，

  也不像其他女孩看過男人裸體，甚至有人已經有過性經驗，比起來她絕對比較「單純」，

  但這也讓安娜瑪莉亞質疑露琪亞在「裝聖女」。



  雖然她也詢問修女「禁慾是否困難」，但或許也是露琪亞在探索，自己究竟是比較鍾愛信

  仰還是世俗的觸碰與愛意。大冒險時，接到親吻修道院裡「最美女孩」的任務，她深思一

  會之後決定是聖堂裡的聖母像。說是為了逃離大冒險也好，但從露琪亞大費周章地穿越修

  道院，再拿椅子讓自己搆得到聖像，以及她堅定的眼神來看，露琪亞非常認真，也難怪一

  旁的安娜瑪莉亞會看傻了眼。



  世俗的愛來來去去，但上帝的愛永存。露琪亞這三天在世俗的愛間探索自己心之所向，最

  後鎩羽而歸。相傳造橋時，人類與惡魔進行交易，為了工程順利，從橋上獻祭了一位處女

  。被指揮從修道院趕出來的露琪亞，連男人裸體都沒看過，必定符合這個條件，哭著跑到

  橋邊時，她可能也正想起這個故事。假使電影就結束在露琪亞沐浴在河裡，便是一耐人尋

  味的開放式結局。不過，其後她還發現修女們正進行著神秘儀式的洞穴，不論是現實中真

  的有洞穴，還是露琪亞的幻想，這趟奇遇肯定已讓她不再糾結。立志成為修女也好，接受

  自己喜歡世俗的愛並沒有罪也罷，露琪亞已跳脫為情所困的少女情懷。



  片中出現不少與性相關的情節，但都極為隱晦，如同情竇初開的少女一般，懵懵懂懂。電

  影一開始的修道院壁畫，便是以女性外生殖器的形象呈現；露琪亞在練唱時看著安娜瑪莉

  亞性感的紅唇與若隱若現的肚臍出神；多個蜜蜂穿梭在玫瑰花蕊間的圖像接連出現，同樣

  象徵女性的外生殖器。從橋上看見的男人裸體，在河邊化為近距離洗澡的春光，若有似無

  ；將衣服還給心儀的男人後，按捺不住身體的激動，躲進廁所自慰。露琪亞在短短三天內

  轉大人，大幅提升自己的性探索，有點害羞卻也是成長的過程。



  對虔誠的露琪亞來說，對性抱有幻想是罪，偷拿工人的上衣也是罪，說謊當然是罪。安娜

  瑪莉亞引聖經《耶利米書》31章30節：「但各人要因自己的罪死亡；凡吃酸葡萄的，自己

  的牙必酸倒。」告訴露琪亞，這樣能夠贖罪。初來乍到的露琪亞也跟著照做，但是，隨著

  兩人的曖昧情愫越發升溫，她對信仰的虔誠也考驗著自己的選擇，最後與安娜瑪莉亞越行

  越遠。當下或許傷心，但從片尾露琪亞自在地溜著直排輪，再到市集買下一串香甜的葡萄

  不難猜想，她對於自己的選擇充滿堅定與自信。


  --

