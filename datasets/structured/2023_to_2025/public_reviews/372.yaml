title: '[好雷] 《超時空武士》短評：百年後，誰揮武士刀'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《超時空武士》好雷短評：百年以後，是誰在揮武士刀？\n\
  \n還好有聽 @yenyengomovie(延延聊電影） 的話來看，是當代人與我（剛好在職涯路口）\n都非常需要、會有共鳴的作品。\n\n《超時空武士》看預告就知道是很ㄎ一ㄤ的穿越劇，但真正好看的是後半段新座衛門面對\n\
  新世代做的選擇。\n\n幕府時代的帥氣日本武士，跑到沒什麼人看的時代劇裡跑龍套，本身就已經非常荒誕。\n\n更荒謬的是，新座衛門決定把被砍死的角色演到極致。跟不上時代的武術，卻在優子的慧\n\
  眼與劍心會的協助下，變成他獨一無二的優勢。\n\n他是求職轉職的最佳示範。從本身的既有技能下手開發，對接進新環境、新產業的即時需\n求。\n／\n\n\n\n\n\
  他們成為指引對\n方的榜樣，互相讓對方看到未來的希望，開創新局。\n\n\n\n\n新座衛門做出更偉大的選擇，放下過往恩怨與超脫生死的武士道精神。他腳踏實地活著，\n\
  並不斷回應太平時代的需要。\n\n保有風骨與態度，盡全力在時代中給出價值，那是現代\n武士最令人敬佩的模樣。\n\n\n\n／\n日本真的很會拍食物，簡單的飯糰都被形容拍攝的很好吃，想起《河畔小日子》。\n\
  ／\n這部也讓我想到高中看的一部電影《太陽的孩子》\n\n網頁好讀版>> \n\n–\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond\
  \ \n個人網站：\n\n--\n而且快下片了QQQ\n這部真的很推薦給求職轉職的人看\n或是擔心AI搶工作的人"
