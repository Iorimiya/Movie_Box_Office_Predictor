url: https://www.ptt.cc/bbs/movie/M.1746865912.A.953.html
title: '[討論] ［好雷］ 超時空武士 侍タイムスリッパー'
content: 'PTT首發獻給movie版！


  平時看完電影都會上版來看一下影評，


  但我沒有找到這部片有人分享，


  於是便來和各位分享一下我的心得。


  -以下有雷-


  電影背景是敘述一位武士，


  從幕府時期跳躍到現代生活的故事，


  從最初的驚訝、給人添麻煩、到被接受、貫徹武士道精神自我實現、再找到自己的價值，可以感受到主角 高坂新左衛門 一路的變化；


  高坂跑到現代面對新環境，仍然可以感受到身為一位武士的修養和原則


  一開始在片場的拔刀相助，待人的用詞和行為（各種鞠躬），從醫院逃離時將被子、衣物折好，以及發現過了140年後，在寺廟前雷雨交加，似乎下定決定拿出短太刀決定自盡之時，都可以感受到他身為一位武士，面對世界的態度。


  此外本部電影也有很多令人覺得有趣的笑點，第一個令我覺得有趣的是高坂誤入拍攝中的現場，每位跑龍套演員見到他不尋常的行為紛紛遠離的表情舉動，讓高坂也忙不著頭緒的模樣；


  其次是高坂離開了劇場，看見路邊一位女子挑選假石頭，搬起的瞬間，高坂驚嚇到的模樣；


  後面還有許多無厘頭又帶有意義的笑點待各位到電影院欣賞。


  除了笑料外，在想要傳達的精神上，我認為更是貫穿了整部電影，


  時代劇其實是整部電影的主軸，以我不了解時代劇背景的人，可以從電影中感受到是一種產業衰落的過程，也可以感受到日本人對於江戶時代的想像還有日常時代劇的依賴；


  這件事情在高坂第一次看到時代劇時，導演用簡單的剪接，把時代劇內容和高坂的情舉止相互出現的方式呈現出時代劇對於當時人們的衝擊 （這個片段寺廟主人和他老婆的表現也很好笑）


  也就是這樣的武士精神，高坂慢慢在生活中找到自己的定位，也在一次的臨演機會中找到自己的目標，更是全新投入到這個目標裡。


  中間有一段我還想說是在揮刀揮什麼，原來是高坂努力嘗試呈現出拿著真正的刀子的感覺時的練習畫面。


  隨著劇情向後推進，會發現劇中的男二 風見恭一郎 也是這樣來到了現代，而且也是要循著這樣方式存活下來，才會發現到原來「侍（さむら）」的精神到哪個時代都適用！



  演員張力的部分，印象最深的是高坂第一次吃到草莓蛋糕的時候，那激動的神情以及嘴巴說著「原來日本已經發展成一個豐饒的國家了啊！」的畫面，可以感受到一位從幕府時代為了生命拼博瞬間到現代的落差感，看著這一幕我不禁眼淚也跟著落下來（很怪吧！）


  但是導演沒有想要放過你，因為緊接著就是高坂鼻子沾到奶油被電視的時代劇嚇得不要不要的搞笑片段，這種反差也是電影裡令人感到新鮮一直想看下去的手法。


  然而身為一位武士，也會有情緒低落的時候，不論是風見還是高坂，都因為自己的過去、侍奉的信念有過迷茫，而彼此卻都是攙扶彼此走過的知音，


  電影中隨著兩位相愛相殺的互動，也來到的劇情的最高潮；最後的真刀打鬥畫面，


  是兩位武士對對方最高尊重的決定，兩人此時的打鬥場景也和前面時代劇的排演產生了強烈對比，就再到電影院觀賞了。


  最後收尾的方式也令人會心一笑！

  該不會你我各位都存在著這樣穿越的人們吧（笑


  -


  整部電影除了角色和劇情，還有令人值得誇獎的就是音樂了！每個場景轉換的音樂都不一樣，而且很快地讓人帶入劇情中，


  仔細一點的人會發現到最初和最後的真刀打鬥都是有真正的金屬聲音，而中間時代劇的竹刀打鬥反而都是一些比較沈悶的音效，


  除此之外，有一些粗糙的細節也令人感受到這部片很親民、日常，例如女主角 山本優子 一貫的髮型和不斷重複的衣著，有時候都想說是不是一幕拍完接著下一幕拍所以就沒換衣服了；


  以及高坂和寺廟夫婦吃晚餐時，喝啤酒的畫面，會發現到啤酒的泡泡突然多突然少，和劇情的時間軸不太一樣，這也是一個有趣的畫面，卻不令人出戲；又或是時代劇的一些人們穿著短襪就上場了（？


  後面查了才知道這部片在最初的拍攝經費並不多，或許是因為這樣才會有一些細節沒有被注意到（？），這也是我個人的臆測；


  然而這些都不影響觀影的品質，個人認為是一部很適合帶著輕鬆心情看待的電影，推薦給各位！





