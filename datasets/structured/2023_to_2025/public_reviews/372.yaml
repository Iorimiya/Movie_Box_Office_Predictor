url: https://www.ptt.cc/bbs/movie/M.1746872074.A.667.html
title: '[好雷] 《超時空武士》，直至那天之前，卯足全力'
content: '部落格版：


  從《廢柴電影夢》到《色情電影開麥拉》，過去看過許多談論著關於電影的電影，「拍電

  影」既是一封情書也是一個夢想，投入的不僅是時間與金錢，更多的是熱情與熱愛。對電

  影的熱情與熱愛，讓這些電影人們可以放下一切羞恥，向現實、向資本主義低頭，也不願

  意放棄讓電影從自己的生命裡離開。這部《超時空武士》何嘗不也是導演安田淳一對他所

  愛的電影的告白？記得前陣子看到《超時空武士》不僅是藍絲帶獎最佳影片得主，更在向

  來被認為只頒給東寶、東映、松竹、角川映畫與日活等五大片廠、排擠非主流商業片與藝

  術電影的日本電影學院獎中，以黑馬之姿獲頒最優秀電影時，好奇著這部電影是如何能讓

  主要由五大片廠職員組成的協會會員，願意將票投給這部電影？直到看完電影之後，想著

  在這個早已只想投資能夠賣座的電影的現代，《超時空武士》或許成功帶領著曾經歷過那

  個美好年代的電影人，再次找回滿懷熱血與憧憬的自己，投下的票是肯定也是對電影的共

  鳴。


  《超時空武士》看似又是一部再普通不過的時空穿越劇，看著幕府時代的會津藩武士穿越

  到140年後的日本，陰錯陽差成為時代劇專門被砍殺的被斬役，如何因時空差異鬧出不少

  笑話的這樣的劇情，然而隨著劇情一路往下，觀眾便會發現藏於電影裡的惆悵與悲傷，還

  有存在於每個追逐與堅持所熱愛事物的人心裡的某種即使時代更迭依然存在的精神。回不

  去的幕府時代，如同盛世不再的時代劇，武士高坂新座衛門意識到自己不再需要執行主子

  給予的任務，副導演優子同樣感受到人們不再收看時代劇。亂世平息，國家豐饒，各種類

  型電影與電視劇百花齊放，人們不再需要武士保護，也不再將時代劇視為唯一選擇，身為

  武士的他與因熱愛時代劇而投身時代劇拍攝的她，終於還是意識到了自己「似乎已經不再

  被這世界需要」，如果改朝換代與時代劇的被淘汰都是無可避免的結果，那他們還能為自

  己所愛做些什麼？



  「能將我們的精神留在時代劇裡的只有你了。」


  後來座衛門遇到了當時與他交手的山形彥九郎，原來對方同樣跟他穿越到了現代，只是比

  他早了30年。改名為風間宮一郎的他和座衛門都從被斬役起家，30年的時間讓他成為家喻

  戶曉的時代劇巨星，然而他卻也有段時間離開了時代劇。在他成為主角後曾經懼怕著每個

  被斬役倒下時看著他的眼神，這讓他想起在幕府時代殺人的痛苦經歷，於是他選擇逃離。

  即使30年後他決定再回過頭來替式微的時代劇付出，可他終究已是背棄武士道精神的逃兵

  ，但座衛門還沒有，他還沒有逃離戰場，不論是140年前還是140年後，不論是真刀還是道

  具刀，只要座衛門還沒有將刀放下，他依舊是站在戰場與片場的武士，在幕府時代尚未結

  束之前，在時代劇還沒被淘汰之前，在他不再被需要之前，他會卯足全力、將手中的刀握

  緊，誓死守護著他的主人，還有時代劇。



  《超時空武士》巧妙借用歷史來喻時代劇的處境，用時代劇的式微來回望歷史的更迭，安

  排武士的穿越不僅是製造時空差異的笑話，更是想讓觀眾更能直接透過他，去看見存在於

  每個人心中的武士道精神。假使座衛門成功回到了過去，可早就知道幕府時代會於未來的

  某天劃下句點的他，是否仍會為了必然到來的徒勞堅持？在沒有戰爭的現代，對於這群熱

  愛時代劇的人們來說，時代劇就是他們誓言保衛到最後一刻的主人，座衛門最後與宮一郎

  選擇改用真刀拍攝最後一幕，不只是為了解那場未完的決鬥，也是對內心迷惘的答案。導

  演山田淳一將這齣穿越喜劇獻給每個已經或者即將、終將被時間洪流吞沒的歷史，還有竭

  盡全力奮鬥到最後一刻的人們，選擇用輕鬆幽默的方式來面對不捨與傷感。


  《超時空武士》不論從何種角度切入，我都認為是部相當有趣且能所收穫的作品。最基本

  的，是看幕府時代武士穿越至現代看見高樓、火車、電視，還有吃到在普通不過的櫥窗蛋

  糕時各種反應，飾演高坂新座衛門的山口馬木也那有點木訥有點憨厚的反應，意外讓這些

  安排更有效果與笑果，周遭人物、例如寺廟裡的住持夫妻，恰到好處的適時反應也很加分

  。此外，貫穿整部電影的武士道精神同樣也讓人莫名感動，不過我個人最喜歡的，終究還

  是整部電影的「拍攝過程」。如同《色情電影開麥拉》讓我看見一部情色電影的誕生，《

  超時空武士》則讓觀眾去認識一部時代劇的幕前與幕後，那些看來有些浮誇荒謬的套招動

  作，不合理的進攻與防守、遭砍後的肢體與表情，還有主角自以爲很帥的收刀與特寫鏡頭

  ，看在現在你我的眼裡是多麼可笑，可在當時卻是每個被斬役拜師學藝，跟著老師學習每

  個招式，是如此認真的對待這份職業，雖然看上去是好笑，可卻也讓人非常尊敬他們。




  --'
