url: https://www.ptt.cc/bbs/movie/M.1746973770.A.463.html
title: '[好無雷] 超時空武士'
content: "如同預告片的內容\n超時空武士講述了幕末會津藩的武士 - 高坂新左衛門\n因緣際會穿越到現代的故事\n\n原本以為這是一部輕鬆的無厘頭搞笑劇\n\
  但看完之後，個人認為這是一部用喜劇包裝\n獻給所有即將、或已經跟不上時代的中年大叔的一首情詩\n\n大化革新後出現了講究義仁禮勇的武士道\n曾經在江戶時代武士階層被作為理想倫理\n\
  而如水戶黃門、暴坊將軍、大岡越前這類的時代劇\n也曾席捲了昭和平成時期的電視劇\n\n而在不斷滾動的時代巨輪下\n沒有不會闔上的書，沒有不會落下的幕簾\n\n\
  書闔上了，幕簾降下了，人的腳步往前了\n但心卻可能永遠停留在某個時間點了\n\n那些有著歷史痕跡的人們\n大可以選擇拋下過去的一切與時俱進\n\n或著像劇中的主角一般，接受自身成為小眾\n\
  溫和的與進步世界格格不入\n同時守住那些過往歷史在心中烙下的印痕\n堅定的與眾不同\n\n小成本電影有很多的力有未逮\n但影片播畢時，個人內心卻湧入了一點點悲傷\n\
  和很多很多的喜悅的複合情緒\n\n如果你能接受看步調緩和、低成本、輕鬆中又有點深度的電影\n同時又是個偶爾會感受到自己抓不到新時代的符號\n或是床底下有個裡面放著滿滿七八零年代的過時玩意的鐵盒的中年大叔\n\
  那這部電影應該也會讓你很有感觸\n\n\n\n最後還是忍不住要抱怨一下西門町的真善美戲院\n今天下午場後面觀眾一直大聲講話\n在劇情最高潮的時候還講不停，整場都他的聲音\n\
  有觀眾出聲制止也無視繼續講\n真的非常影響觀影體驗\n這對我而言已經是第二次發生了\n(上次是看逆轉拍賣師的時候)\n\n同樣是常播放小成本/藝術片的影廳\n\
  像是台北 / 華山光點、誠品電影院似乎就沒有遇到過\n想到手上還有一堆中影團票，心裡真的有點賭爛\n該不會每次去看個電影都要去拜拜吧馬的\n\n\n總之小弟我要抽時間去二刷了\n\
  --\n我這場就是有觀眾在大家屏氣凝神的時候機哩瓜啦\n我真的是昏倒\n我以後不敢支持了，畢竟中影團票現在台北也只剩真善美可用?\n大洗白沒有\n說教的話我是覺得也還好，頂多就闡述價值觀而已\n\
  日片的演員演得太用力，還有莫名就熱血起來幹瘋事的問題是有啦\n瑕不掩瑜就是了\n其實我覺得男主角山口馬木也在片裡中後期換髮型後\n還蠻帥的，是個帥叔，羨慕忌妒恨\n\
  這個真的很好笑XD\n那段真的很棒，不會有花拳繡腿套招的感覺\n力量節奏的呈現很令人眼睛為之一亮\n看得出這些製作團隊滿滿的愛\n這一陣子的心得\n獨立製片或小團隊的電影\n\
  像是之前看的貍太怨、我去死一下、喵的奇幻漂流，還有這部超時空武士\n雖然不能說棒到能夠和大成本大企劃叫板\n但有時候反而很能看到團隊的熱情和用心\n可能也是小弟我老了吧，與其執著處處完善的100分\n\
  反而更喜歡令人動容的70分\n這段我的理解是\n武士的任務是殺人\n斬られ役的任務是要讓時代劇的呈現好看\n目的不同，動作要學習並且某種程度的適應蠻合理的\n\
  那我的解讀會是\n人在沒有名氣的時候，就是跟著體制框架在做事情\n專業者說這樣做不行，那就是乖乖聽話\n(而且那時候只是擔任動作戲中諸多斬られ役的其中一員，綠葉不應壓過主角，\n\
  \ 我記得一開始主角往後舉劍就被唸說這樣會打到後面的人，要他舉高一點XD，\n 感覺就是在說 \"你要配合整個佈局阿\" )\n\n但其實最後決戰的時候\n主角是知名時代劇演員欽點的選角，自然比較有話語權了\n\
  那自然可以有一些自己的意思了\n\n換個方式來說\nNCAA 的賽事裡面，教練扮演的角色比較重\n球員練球時也可能會被糾正姿勢\n\n但在 NBA 裡面，其實常常會看到一些投籃姿勢和一般教課書上不同的球員\n\
  但人家是世界殿堂的選手，我這樣投準度高你教練就看我投就對了XD\n\n當然你說的觀點其實也挺有道理\n可能這就又犯了小弟上面講的，日片的老毛病\n\"一群人莫名其妙就熱血起來幹瘋事\"\
  \n\n可能也是小弟我對於電影邏輯性的要求並不高就是了\n藝術品嘛，太計較邏輯好累\n覺得感動這件事情比較吸引我哈哈"
