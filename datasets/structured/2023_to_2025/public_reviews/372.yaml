url: https://www.ptt.cc/bbs/movie/M.1747647876.A.E3C.html
title: '[普雷]《超時空武士》屬於現代的武士道'
content: '時代淘汰武士也神化武士，穿越後的武士道


  對於台灣人來說，鄰近國家的日本總是有著神秘又熟悉的味道。也可能是因為過去在歷史

  上日本殖民台灣的期間，對台灣人有著很深入的歷史道標，再加上80、90年代，大量合法

  非法的日式娛樂在台灣，使得台灣人對於日本的認識，可說有可能高於其他國家。


  不過也有一些是不分國家對日本的認知，其中武士、忍者、藝妓，這些有著代表性的職業

  ，更是歐美對於日式文化的認識，也逐步認識到一種存在於過去日本社會，稱之「武士道

  」生活哲學。


  小成本電影《超時空武士》，是一個有趣且探討過去武士精神對日本現代影響的有趣作品

  。故事敘述幕府末年，高坂新左衛門在與仇敵對決的雨夜，因為雷擊而穿越到當代日本的

  時代劇拍攝現場。為了在這時代生活下去，作為武士的高坂只好以時代劇臨演適應生活，

  並且學習如何被砍、被殺死，他也重新思考武士在當代日本社會的意義。






  《超時空武士》是什麼電影？


  對於從「日劇時代」跟「電視動畫黃金年代」長大的孩子來說，對於日本保持好感有時候

  好像是不可避免的一件事，畢竟對於過去看著日本娛樂、聽著日本流行歌長大的世代，有

  些歌曲可能比台灣中文歌曲更讓我們這些宅宅懷念，如同《神奇寶貝》（寶可夢）大過周

  杰倫、灌籃高手的角色倒背如流，但台灣籃球員可能認識不到五個，對於這樣成長的台灣

  御宅族來說，從喜歡這些日本作品到想了解日本文化似乎是理所當然的事情，也因如此在

  長大後以前喜歡的日本，漸漸地也成為想了解日本文化的問題與脈絡。


  而可能不只有台灣，應該所有對日本電影、ACG、遊戲等事物有興趣的人，都會很好奇日

  本過往的文化，其中影響現在日本最多的江戶時代，似乎成為一個好奇與傳統文化的起始

  點，了解所謂的江戶（東京）人。


  日本獨有，過去的武士文化當然是名正言順，相當吸引海外人士考究的地方。但如今在武

  士早已成為一種不存在的職業，佩刀、決鬥與武家踢館，已經不合時宜之時，連日本新一

  代年輕人可能也很少，在對於對於武士、武士道精神有所了解，但其實有一些武士道的價

  值觀反而深入日本人心，成為一種日常也說不定？







  日本電影《超時空武士》，是一部小成本製作電影，電影導演－安田淳一受到同樣低成本

  成功的電影《一屍到底》的啟發，拍攝江戶時代武士穿越到現代日本，拍攝時代劇成為臨

  時演員的故事。這部電影本來只有在池袋單一電影院放映，但因為社群媒體不錯的口碑，

  而擴大到日本全國上百家電影院放映，成為2024年下半年在日本獲獎無數的本土電影黑馬

  。也是久違以幽默和現代的方式探討，日本落寞的時代劇的產業縮影，讓年輕一代看見曾

  經輝煌的武士故事。


  安田淳一的首部劇情片，是以昭和風為題材拍攝的《槍與荷包蛋》，拍攝出復古的昭和特

  攝英雄，與現代不同沒有華麗特效的假面英雄，為了保護心愛的女孩和日本的和平而戰，

  呈現出老派的英雄浪漫受到好評。


  有意思的是安田淳一其實是一個務農的電影導演，父親過世後，他接手了父親的稻田成為

  稻農，一邊務農一邊製作電影，而後拍攝一部少女回老家接受父親稻田，透過耕種來回憶

  父親為何還要農作的故事《吃飯》也是因為自身經歷而拍攝出來的故事。










  《超時空武士》分析與延伸：


  時代劇是泛指一個特地過去年代為背景的故事，有可能是虛構也有可能是真實，是跳脫於

  現代社會的存在，如同中國的古裝劇和歐美的歷史劇，都是時代劇的範疇。日本時代劇起

  於1920年代，在當時因為大眾文學受到一般民眾喜愛，故大家都很樂於看到以這些為文本

  的翻拍故事。在當時，時代劇的產值與數量，遠遠超過現代劇，以以1936年為例，時代劇

  就多出現代劇快100部，直到90年代，本土偶像劇、動畫興起、外國電影的輸入，才讓時

  代劇逐漸式微，如今時代劇也面臨著夕陽產業的危機。


  《超時空武士》電影中雖然是穿越劇，但有個有意思的點，在主角高坂新左衛門所在的時

  期是「幕末時期」，也是一個日本社會封建制度的崩毀，轉換到新的社會制度的時期，高

  坂新左衛門這樣的底層武士，其實對於現代化改革的日本社會轉型，自己的身分和未知感

  到迷惘，而他穿越的是一個日本時代劇也正面臨轉型和適應新時代的迷茫，兩邊時空交織

  點意外的契合。


  而高坂新左衛門，不管是以武士或時代劇演員的身分，都恰巧在一個最不好的時機點，而

  這也是這部電影想點出關於在歷史轉折點上，一個職業和一個人該怎麼面對未來轉變的方

  式。






  被雷劈中，從守舊體制走向一個全新體制，並且必須適應一種新觀念、新想法是相當困難

  的，如同過去商家只需要開店、販售商品，偶爾促銷就可生存營利，但在如今的社會商家

  需要有售後服務、社群宣傳、並且還有懂得怎樣跟風跟上流量，這些都是傳統過去的商店

  文化所沒有的。如何面對新事物或是舊有即將被淘汰的事情，有些可能因為傳統概念而走

  不出來，並且造成對立面，例如女性主義、LGBT、甚至是種族、文化觀等，因為與過去概

  念不同，卻也無法理解新的思潮，也就如同《超時空武士》般，過往我所信奉的武士之魂

  ，在現代的日本將何去何從？


  而在主角高坂新左衛門，所在的幕府末年到明治時代的真實歷史中，下級武士失去社會功

  能只能另求生路，而高坂新左衛門穿越到現代選擇成為一個跑龍套藝人、被斬殺的武士，

  其實也是呼應舊時代下級武士在體制崩潰之路。


  如果以台灣的時代來看，如同在國共內戰之後，跟隨國民政府來台的老兵、或是日本戰敗

  被丟棄的日本軍身份的台灣兵，在一夕間你所信念的東西不復存在了，在這樣的時代裡，

  生為舊時代產物的這些人該把什麼留下？又該如何改變？需要很長一段的陣痛和適應期，

  故在每個時代裡，就是不停的在新舊碰撞中去蕪存菁，而轉而邁向新的道標前進。








  《超時空武士》值得一看嗎？


  低成本的電影其實有低成本電影的可看和有趣，其中因為製作成本不高，故在某方面要展

  現的往往是導演的風格，和題材的掌握度與實驗性。例如《一屍到底》展現出幕前幕後的

  幽默、《超越無限兩分鐘》輕科幻故事的想像，這些都是屬於沒成本有沒成本的玩法，《

  超時空武士》也用穿越到片場，展現出過去堤防生死的武士，到了現代要成為隨時死去拍

  攝時代劇的龍套，這樣有趣的對比，展現出有時候在新時代裡，你過去的那些固執可能根

  本不值得一提，或是即將被捨去。


  但《超時空武士》並非再說一個完全否定武士道精神的故事，武士道其實是一套日本封建

  制度時武士階級所有的信念跟價值觀，甚至是生活方式。武士道其實受到戰國儒家思潮、

  印度佛教禪宗思想、日本神道教等，構成武士的理念。


  這樣的理念，如果轉換成將工作或生活與興趣執著的態度，其實就是如今我們所見各行各

  業達人、匠人，或是像運動員和創作者對於自我能做甚至感興趣的事物，有著執著並想達

  到完美的境界，全心全意地投入，這在電影中也可以看到身為一位時代劇演員，演好演出

  那個時代的執著。







  不過也許是《超時空武士》小成本製作之故，並且導演身兼數職（電影裡安田淳一，獨自

  擔任導演、編劇、攝影師、燈光師、剪輯師），我認為導演有太多想留下的畫面，故讓整

  體劇情在前半部一個小時都很拖沓，而顯得後面在講述另一位對手的故事時，節奏感有所

  落差性。


  並且在劇情方面，是很簡單的過去武士穿越道現代時代，適應融入現代社會的經過，在這

  裡劇情的安排，感覺拿捏的時好時壞，例如高坂新左衛門很輕易的就接受拍攝片場和現代

  的街道風景、但卻被電視機畫面和蛋糕的美味嚇到，如以歷史來說的話，兩者的驚嚇程度

  應該是倒過來的，這點讓人有點無法融入故事角色的情感內。


  但在那種自己被時代所拋棄的感觸上，我認為《超時空武士》較柔軟且不直接的敘述方式

  ，讓我覺得這部電影，其實對於一個可能要走入歷史或是成為非主流，漸漸消逝的事物，

  有著它的溫柔之處。台灣電影與韓國電影，往往會採用相對衝突和戲劇性的碰撞，很直接

  的點出問題，日本電影有時候反而比較像是淡淡的敘述一件事情，讓人沒來由的感傷，我

  想這也是《超時空武士》一部跨在現代新的時代劇呈現，並且用它的方式展現出時代劇的

  魅力與武士道義這些可能很八股的故事結構，老派有時候並不是錯誤，錯的是我們忘記擦

  亮曾經美好、有著時代憶痕的老東西。




  --

  個人Blog：

  小說連載頁：


  --'
