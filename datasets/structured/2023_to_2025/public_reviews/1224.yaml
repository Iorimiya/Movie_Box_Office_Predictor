url: https://www.ptt.cc/bbs/movie/M.1745262574.A.143.html
title: '[普偏好雷] 法拉利'
content: '防雷




























  麥可曼恩我大哥,他的作品我一定支持

  不知道是不是他收官之作的法拉利

  其實這部電影還滿微妙的,各方面都是

  一方面題材跟以前很有差,表現也是很有微妙感

  亞當崔佛倒是受到導演影響變超帥

  他本身就不是帥哥,但這次灰髮就很適合他

  潘妮洛普克魯茲每秒都是深宮怨婦的摸樣

  一開始看還有新鮮感,久了就會知道：

  喔！又是個為事業有成的男人犧牲青春的女人

  情婦的部分也是還好,但我喜歡結尾的父子互動


  傳記片最重要的我想是敘事

  只是這部電影的敘事還滿特別的

  兩小時不算短,看完後卻又覺得沒什麼劇情

  可能都在為結尾的意外鋪陳吧

  之前就有耳聞這段的殘酷

  絕命終結站看多了是覺得還好啦

  甚至那個撞擊很像保齡球全倒,有點喜感？

  我想法拉利是個典型事業有成但充滿缺陷之外

  如同其他賽車片一樣總是闡明賽車的高危險性

  這部電影是麥可曼恩的作品中算很普通的

  希望他能真的生出烈火悍將的衍生作


  ----

  Sent from  on my Samsung SM-S9280


  --

  每當處在我人生的十字路口，我總是知道哪條路是正確的

  沒有例外，我總是知道，但我從來沒去做，你知道為什麼嗎？

  因為那實在他媽的是太難走了

  而現在的查理也正處在人生的十字路口，他選擇了正確的路

  一條通往原則、導向人格的道路。讓他繼續走完這旅程

  委員們，你們正掌握著他的未來。這會是個寶貴的未來


  --'
