url: https://www.ptt.cc/bbs/movie/M.1702945250.A.652.html
title: '[新聞] 文化挪用！對拿破崙、法拉利採用美國'
content: "歐洲影評：這是文化挪用！對《拿破崙》、《法拉利》採用美國演員感到憤怒\n\nYahoo奇摩電影戲劇編輯部\n\n2023年12月18日 週一 下午8:10\n\
  \n\n\n《法拉利》《拿破崙》《杜巴利伯爵夫人》《大師風華：真愛樂章》《神鬼戰士》劇照\n\n1.法國、義大利代表性人物「講英語」讓歐洲影評怒了\n\n2.「一堆白人演另一堆白人！」有一群歐洲一線演員還不用？\n\
  \n3.「強尼戴普講法語才難受！」聽美國人講法語也是折磨…\n\n【文／太空小姐】\n\n近來兩部歷史與傳記電影，（Ridley Scott）的《》與（Mich\n\
  ael Mann）的《》都遭受歐洲影評抨擊，原因出自於「」。\n\n文化挪用被視為一種政治不正確的行為，一般指說較為強勢的個體或文化群體面對相對弱\n勢的個體或文化群體時，以未充份理解、誤解、取笑、歧視或不尊重的方式，直接採用、\n\
  侵佔、剝削、抄襲或複製弱勢文化。\n\n法國和義大利影評對於兩部電影的導演竟決定邀請美國演員出演其國家的代表性人物感到\n相當不滿 （Joaquin Phoenix）飾演拿破崙波拿巴（Napoleon\
  \ Bonaparte）\n，舉世聞名的法國軍事家、政治家、改革家、共和國第一執政與帝國皇帝；而（\nAdam Driver）飾演的則是義大利車汽車製造商法拉利創始人恩佐法拉利（Enzo\
  \ Ferrari\n）\n\n\n\n\n《法拉利》劇照\n\n至於法國《GQ》雜誌也對《》中，拿破崙與愛人約瑟芬講英語這個設定評價為「感\n覺非常笨拙、不自然且出乎意料地滑稽。」\n\
  \n義大利資深男星皮耶法蘭西斯柯法維諾（Pierfrancesco Favino）接受英國《每日電訊報\n》訪問時提到，「。」\n\n他認為導演麥可曼恩明明能輕鬆選擇眾多令人敬重的義大利演員同行，托尼塞爾維洛（To\n\
  ni Servillo）、阿德里亞諾吉安尼尼（Adriano Giannini）、瓦里歐馬斯坦德（Valerio\n Mastandrea）…但偏偏卻選擇一個來自美國加州聖地牙哥的人。\n\
  \n\n\n《拿破崙》劇照\n\n「\n。」\n\n當然請一位巨星用英語演出一位著名的外國歷史人物已經成為好萊塢悠久且屢獲殊榮的傳\n統了，從斯巴達克斯、賓漢等故事，到雷利史考特2000年的電影《》都是。\n\
  \n但文化挪用成為選角上的爭議話題，特別是在頒獎季。\n\n\n\n《神鬼戰士》劇照\n\n像是非猶太裔的（Bradley Cooper）在《大師風華：真愛樂章》飾演猶太裔\n\
  美國音樂家李奧納德伯恩斯坦（Leonard Bernstein）；愛爾蘭演員（Cillian M\nurphy）在《》飾演美國物理學家羅伯特奧本海默（Robert\
  \ Oppenheimer）；英\n國演員（Helen Mirren）在《贖罪日之戰》飾演以色列第四任總理猶太裔的高塔\n梅爾（Golda Meir）都遭受質疑。\n\
  \n法國《電影筆記》評論家亞爾薩達特（Yal Sadat）提出，但讓《》和《》\n被特別挑出來講，是因為「。」\n\n\n\n《大師風華：真愛樂章》劇照\n\n\
  畢竟有段時間部分評論非常主張歐洲演員應也獲得同樣的強勢聲量，像是法國的尚杜賈爾\n登（Jean Dujardin）、吉翁卡列（Guillaume Canet）、馬修亞瑪希（Mathieu\
  \ Amalric\n）；義大利的路卡馬林內利（Luca Marinelli）、里卡多史卡馬西奧（Riccardo Scamarc\nio）等，其實也都是一線巨星。\n\
  \n\n。\n\n\n\n《杜巴利伯爵夫人》劇照\n\n薩達特表示，飾演的拿破崙講英語還不至於對他冒犯，「看到強尼戴普（Jo\nhnny Depp）在《杜巴利伯爵夫人》努力、拙劣地講法語才難受！」\n\
  \n因為感受到某種文化上的優越感存在這些電影中，「\n。」\n\n不過對於多數法國、義大利觀眾來說，他們會選擇以配音版來觀賞電影，而《》和\n《》都在票房上獲取了不錯的成績。\n\
  \n\n。\n\n\n新聞網址：\n\n\n\n--"
