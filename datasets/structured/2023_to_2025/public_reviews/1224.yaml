title: '[情報] 【法拉利】Ferrari 正式預告'
content: '本作改編自 Brock Yates 知名著作《Enzo Ferrari – The Man and the Machine》，背

  景設定在 1957 年夏天，前職業車手 Enzo Ferrari（Adam Driver  飾）的人生陷入空前

  危機，他和妻子 Laura Ferrari（Penelope Cruz 飾）十年前創立的工廠面臨破產，兩人

  的婚姻也因為兒子的過世而岌岌可危，他決定把一切都賭在一場比賽上，那就是賽程長達

  一千英里的「Mille Miglia 千里賽」。


  ★2023威尼斯影展競賽片

  ★《奧本海默》《絕地營救》製片團隊打造年度鉅獻

  ★《落日殺神》金獎名導麥可曼恩睽違7年最新作品

  ★《婚姻故事》奧斯卡提名男星亞當催佛化身法拉利創始人

  ★《分岐者系列》知名女星雪琳伍德利再創演技新巔峰

  ★《瘋狂競賽片》奧斯卡獲獎女星潘妮洛普克魯茲加盟演出

  ★《蜘蛛人：穿越新宇宙》奧斯卡提名作曲家打造動人樂章

  ★《曼克》《控制》奧斯卡獲獎攝影師構築精彩畫面

  ★《模仿遊戲》《時時刻刻》奧斯卡提名美術巧手重現歷史場景

  ★幕前幕後陣容華麗，強勢問鼎2024奧斯卡！


  不知道跟Rush還有賽道狂人比起來如何


  --'
