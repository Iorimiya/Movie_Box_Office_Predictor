title: '[新聞] 克里斯丁貝爾退出《法拉利傳》拒增重影響健康'
content: '曾多次在大銀幕上增重減肥的Christian Bale，原本預計由他主演的已故義大利傳奇賽車

  手法拉利(Enzo Ferrari)傳記電影，近日他以健康因素拒絕再增重為由，退出電影拍攝。


  由於影片預計春天開拍，目前導演Michael Mann和片商正積極找尋新扮演者。本片將由

  Vendian 與中美合作的 YooZoo Bliss Fund 一同出資拍攝，後者也將負責中國發行，

  國際發行則由派拉蒙影業接下，確切上映日期尚未排定。





  --'
