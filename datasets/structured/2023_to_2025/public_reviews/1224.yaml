url: https://www.ptt.cc/bbs/movie/M.1549104726.A.D4F.html
title: '[好雷] 馴龍高手3之法拉利座椅'
content: '1.影片名稱 :馴龍高手3


  2.觀影時間 : 今天啦！


  3.觀影地點 : 喜樂時代影城 永和比漾店


  4.觀影方式 :福袋688



  沒看過1跟2直接跳3


  因為不想回家只好硬選一部電影


  選擇新開幕第二天的永和比漾店


  剛好推出福袋，想試試手氣......


  結果就兩張電影票跟兩張套餐

  所以不如直接買票就好，


  這裡的廳都很小，我這廳只有四排，


  而且工作人員可能還不熟悉，


  沒人幫我驗票就叫我就進去座了（三條線）


  號稱法拉利系出同門的高規皮革沙發座椅


  第一排還給你椅子抬腳


  整廳還算可以 只是有棉被會更好


  哈哈......進入電影主題......


  因為沒看1、2就跳3


  小部分接不起來......


  譬如那個沒牙怎麼可以號召那麼多龍...


  這我就不清楚，不過沒牙跟光煞都好可愛


  看完覺得不錯啦！


  感覺是最後一集了，春節期間要好好補1跟2


  --'
