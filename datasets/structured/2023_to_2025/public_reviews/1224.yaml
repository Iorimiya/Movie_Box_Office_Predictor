title: '[負雷] 法拉利'
content: '法拉利真的是最近比較不優的傳記電影 導演敘事能力不好 沉悶 無趣 沒把汽車業的鬥爭演

  活 私生活的戲碼也稱不上出色 主角居然還是我很喜歡的亞當催佛（星戰）

  他長得太高帥 美式口音

  很不合適演這自私又傲慢的義佬

  風格很奇怪 我對整片的評價跟賽道狂人差多了 美式車才熱血啊


  ----

  Sent from on my Xiaomi 2210132G


  --'
