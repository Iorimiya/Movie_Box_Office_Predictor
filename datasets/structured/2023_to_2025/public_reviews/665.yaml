title: '[極沉重雷] 由島至島 上集'
content: '雷文防雷資訊頁


























  前幾天版上在吵南京照相館


  昨天剛好公視就播了這部記錄片的上集，算是有點諷刺的巧合


  這是部2024年出品描述了台籍日本兵和日籍日本兵在東南亞的暴行記錄


  包含了當時參戰過的軍人和倖存者的訪談和影像照片


  然後讓觀眾思考人性與正義與生存之間如何拉扯?


  侵略歷史裡日本人那種完全泯滅人性的暴行何以可以被執行?


  自已在觀看過程中有幾段會有種和差不多的感受。。。


  幾乎是一直蹦緊背部肌肉和不斷用指甲刮手背的狀態


  看到一半還轉去cn台看了一下阿甘妙世界


  因為真的太難過。。。


  兩位新加坡的倖存者


  一位婦人講到了她姑媽將孩子綁在自已身上然後被日本兵搶走之後用刺刀刺穿


  這位婦人自已也在日本人清算(屠殺)當地華人的行動親眼目睹了母親被殺害


  期間她一直是使用日本鬼、日本鬼子來講還說如果她遇到當時那個日本兵(的後代)


  她會毫不猶豫的刺他殺他來。。。



  另一位阿伯也是逃過一劫，然後他那個還在學爬的弟弟爬到他身邊要找他


  他將弟弟抱起來準備安撫時才發現還是嬰兒的弟弟已經被刺刀刺了，腸子大便都流出來


  快死了


  講到這邊阿伯情緒就有點崩潰(我也哭出來


  可以感受到這個畫面這個惡夢刻在他腦子中幾十年依然清晰


  之後換到馬來西亞描述日軍如何屠殺當地人


  男女分開，男的帶往碼頭，5到6人綁在一起刺刀刺一刺踢進水裡


  女人小孩集中帶到學校命令脫光衣服，不從的、脫較慢的就當場刺殺


  剩下的人自然脫得快了，然後就大規模侵犯後殺害含孩子


  其它也還有要求上繳慰安婦和禁止收屍等等的暴行


  新加坡、馬來西亞都是差不多的做法


  總之這都是同為人類卻做得出來的事，因為戰爭中


  有一位台籍參軍過的老人，女兒問他對這些事有什麼感想


  老人也只是說：


  講到這邊阿伯情緒就有點崩潰(我也哭出來


  可以感受到這個畫面這個惡夢刻在他腦子中幾十年依然清晰


  之後換到馬來西亞描述日軍如何屠殺當地人


  男女分開，男的帶往碼頭，5到6人綁在一起刺刀刺一刺踢進水裡


  女人小孩集中帶到學校命令脫光衣服，不從的、脫較慢的就當場刺殺


  剩下的人自然脫得快了，然後就大規模侵犯後殺害含孩子


  其它也還有要求上繳慰安婦和禁止收屍等等的暴行


  新加坡、馬來西亞都是差不多的做法


  總之這都是同為人類卻做得出來的事，因為戰爭中


  有一位台籍參軍過的老人，女兒問他對這些事有什麼感想


  老人也只是說：




  如今隨著當時的參與者逝去與現實中國際交流的現實考量


  也更少人會訴說這些歷史了


  記錄片中也有一句台詞描述新加坡政府刻意淡化這段歷史


  畢竟哪壺不開提哪壺


  過去的事已成歷史已成教訓


  如此沉重的歷史放在心裡記著就好


  向前的步伐才能輕快一些。




