url: https://www.ptt.cc/bbs/movie/M.1731721653.A.16E.html
title: '[影評] 《由島至島》台灣人的戰爭責任又是什麼？'
content: "釀影評｜《由島至島》：戰爭是什麼？台灣人的戰爭責任又是什麼？\n\n  何欣潔\n\n\n我出生於八〇年代，是一個祖先早在 1949 年前，便已居於澎湖的台灣人。\n\
  \n當我說出這句話時，意味著我的祖父母這一輩人，是出生於日治時代晚期，青少年時經歷\n過太平洋戰爭，於戰後度過餘生時光，如今漸漸走入歷史的一群人。\n\n小時候，不知聽了誰說「阿公在日本時代曾經報名去從軍」；又據說，後來沒有成功\n\
  上戰場的原因，是因為他體檢未過被「退貨」。軍隊不願意收這營養不良的澎湖人擔任\n天皇的士兵，這才有了後來的家族與我。\n\n我問過他，阿公，這是真的嗎？你曾經在日本時代報名從軍？\n\
  \n可惜，他當時已經有初期的阿茲海默症狀，只答非所問地回我道，「戰爭很可怕，我們\n不要再戰爭，我希望永遠都保持和平。」\n\n如果我阿公順利從軍，應當也有很高的機率被派往南洋戰場。命運會送他去參與日軍\n\
  在新加坡與馬來西亞的大屠殺嗎？他也會以母語與當地的華人攀談、取得情報，好讓\n日軍順利屠村嗎？\n\n他會犯下那些，如今我甚至不願意以文字再次複述──那怕只是假設──也極其不願\n\
  他的名字與之連動的罪行嗎？\n\n\n我必須承認，在看《由島至島》（From Island to Island，2024）之前，我與片中許許\n多多的受訪者一樣，不知道日軍曾經在馬來半島（今分屬新加坡與馬來西亞）施行大規模\n\
  、無差別的平民屠殺。\n\n就像片中平實卻堅定的追問：為什麼廣島人對原爆的記憶知之甚詳，廣島地區甚至有\n多座猶太人遭納粹屠殺的紀念館，卻沒有任何一座博物館，告訴他們廣島子弟所組成的\n\
  軍隊，曾經在馬來西亞雙溪鐳（Sungai Rail）施行屠村行為，造成 368 名男女老少平民\n死亡？\n\n看完《由島至島》後，我回想起這段對話，腦中不可抑制地浮起一個念頭：我彷彿意外地\n\
  走進了亞洲版的安妮之家，但發現自己（祖先）所站的位置，竟是如此地接近劊子手。\n\n導演廖克發以宏大卻節理分明的敘事結構，為我們說了一個很不一樣的台灣二戰故事。\n\
  關於台籍日本兵的身影，我們自《綠的海平線》（Shonenko，2006）等作品中，曾經窺見\n一二；關於台籍日本兵在南洋戰俘營的角色，今年在《聽海湧》（Three\
  \ Tears in\nBorneo，2024）上映後，許多觀眾也已有基本輪廓概念。\n\n然而，由不同視角全面切入，跨越台星馬日多國的紮實訪談、拍攝所構成的《由島至島》\n\
  ，毫無疑問地將這份關於戰爭的考卷做得更加完整。\n\n\n堅信自己在戰爭時身不由己的台籍日本兵、自歷史中現身控訴的屠殺倖存者、與日軍合作\n而被視為「漢奸」的馬來西亞華人後代、因馬來人身分而不被波及的屠殺目擊者、領導屠\n\
  村任務的少尉後代、年年帶著學生返回村子掃墓致意的日本教授，甚至還有廣島當地猶太\n人屠殺紀念館的館長......\n\n甚至，在台灣人心目中，以特別優秀的成績擔任帝國大學醫學教授的杜聰明，也被平實地\n\
  問了一個至關緊要的問題：對於日軍 731 部隊在新加坡設立實驗室，培養跳蚤作為黑死\n病生化武器，作為全台頂尖醫學菁英的杜聰明知情嗎？\n\n片中，杜醫師的兒子給出了快速而篤定的回答。然而，在其他的故事線中，我們也可以\n\
  看見，許多父祖輩經歷了戰爭的後代，對於先人當年的角色，並不完全了解。\n\n他們或許會看見祖父缺席、死亡造成祖母痛苦，也願意在日常生活中捐血行善，盼能\n贖愆祖先的罪孽。然而，當史料揭示更多祖父當年在戰爭中的選擇與行動時，他們依舊\n\
  短暫沉默了數秒。先人的血脈無可切割，他或將以更多的捐血行動來撫平心中的不安\n與罪惡感，這以文明的方式「血償」歷史債務的故事，令人十足震撼。\n\n若當年尚未出生的孩子，都會為了祖父的罪而思索、行動，那麼，近年來致力尋找自身\n\
  歷史、建立新主體的台灣人，毫無疑問地，也該坦然地接受自身在二戰期間的角色，\n是複雜而多面向的。\n\n\n如果說《聽海湧》的史觀像基礎版的少年小說，讓我們初步認識歷史、看見台灣人角色的\n\
  微妙與無奈；《由島至島》對台灣人而言，就近似於一部冷冽而不留情面的杜斯妥也夫斯\n基小說。在罪與罰之間，人可以有千般無奈與身不由己的因果，然而人在其中做出每一個\n\
  決定時，又確實存在著選擇空間，並不完全是無路可退，因此總是存在著道德評判，與期\n待人們做出更好決定的可能性。戰場上的人如是，和平時期的人更如是。\n\n正如片中對廣島人的提醒：或許想像自己是受害者，會是比較容易的狀態，但人們在戰爭\n\
  中的角色，往往同時有受害者與加害者兩種面向。如何在這兩種狀態中取得平衡，才是\n面對戰爭的唯一方法。無論那是一場已經過去的、現正發生的，或者未來可能會來臨\n\
  的戰爭。\n\n\n但，正是在這部對台灣人的二戰責任「不留情面」（卻也始終保持正色，而沒有絲毫揶揄\n嘲諷）的作品裡，我感受到了導演對台灣厚實的勇氣與深刻的愛意。畢竟，全片的開端，\n\
  安排了導演兒子對他的提問：\n\n「有一天，我兒子問我，臺灣士兵被派到了東南亞戰場，東南亞，那不就是我們來自\n的地方嗎？臺灣士兵，是在那裡看見了什麼？或做了什麼嗎？讓他們今天變成了沉默的人\n\
  ？」\n\n來自馬來西亞的男子，與台灣女性結為夫婦，以父親的身分，在台灣接受兒子的提問，\n展開了這卷由島至島的繁複航行。來回往返各個不同的島嶼之間，決意「以思考創造新的\n\
  記憶」，是《由島至島》為台灣歷史，乃至於人類戰爭史記創造的新地平線。毫無疑問，\n如果有人問我，則《由島至島》是我心目中、台灣人必看的紀錄片之一。\n\n\n\n\
  \n--"
