title: '[好雷] 我最愛的笨男人 (感動到從頭哭到尾)'
content: "雷\n\n\n\n\n\n\n故事在台中市中心\n鄭智偉是台中角頭老大\n跟老婆方馨帶三個小弟\n姚淳耀、郭泓志、范逸臣\n\n鄭智偉是市中心的大地主\n\
  縣市合併後積極開發都更案\n議會要發展市中心就想搶地皮\n\n大反派是胖胖的議員好像在演顏清標\n從桃園找來有錢有勢的大姐頭林美秀\n兩人用奸計殺了鄭偉志跟方馨搶地盤\n\
  \n透過反奸計策動姚淳耀當背骨仔\n就像艋舺裡面的阮經天和英雄本色\n裡面的李子雄殺自己的兄弟跟老大篡位\n姚淳耀怕被林美秀給殺光光就背叛老大\n\n故事開始是范逸臣是個爛賭鬼\n\
  他老大跟大嫂沒小孩，收三個小弟\n當親生兒子，大概靠收地租維生\n所以三個小弟就像富二代不愁吃穿\n輸光了一樣有龐大的地租可以收錢\n\n郭泓志是個一介武夫忠肝義膽\n\
  四肢發達頭腦簡單，但最能打\n負責保護老大當保鑣或護法\n全身都是刺青的傳統流氓\n\n姚淳耀最小但最聰明\n所以鄭智偉把他當成繼承人\n未來可以把他的地盤更壯大起來\n\
  開頭這一家五口都很和樂融融\n\n范逸臣在賭場贏了錢後就中計\n林美秀派一對苦情母女去乞討\n姚淳耀讓林美秀知道范逸臣是爛好人\n心軟會同情弱勢，就從范逸臣開始下手\n\
  \n找了一對苦命夫妻帶女兒\n去詐騙范逸臣，乞討騙到錢就跑\n范逸臣看到小女孩可憐就甘願被騙\n但老大鄭智偉知道後就一定會討回來\n\n就帶郭泓志、姚淳耀跟一大票小弟\n\
  去掃平賭場要逮這兩個詐騙夫妻\n詐騙老公供出是某人指使設計陷害\n鄭智偉就帶范逸臣郭泓志去找主謀\n\n結果一開門鄭智偉就被槍殺\n然後埋伏的一堆殺手出來要幹掉他們\n\
  范逸臣背老大去醫院急救\n郭泓志一個大流氓打十幾個8+9\n讓范逸臣跟老大脫身\n\n結果在雨中姚淳耀穿著雨衣\n在背後拿槍幹掉了老大就快閃\n老大死後姚淳耀繼承了老大的事業\n\
  \n郭泓志背個擔子去酒店賣滷味小吃\n范逸臣繼承老大的水電行當釘子戶\n一天姚淳耀找范逸臣去職棒簽賭\n說他能操控球賽賭盤穩贏的\n贏了就能娶妻生子，不用再做水電\n\
  \n到現在郭泓志跟范逸臣都還不知道\n姚淳耀是叛徒背骨仔，只知道家道中落\n老大被殺才害他們虎落平陽\n但姚淳耀還是會照顧兩個兄弟跟大嫂\n還給范逸臣錢讓他追到酒家女劉奕兒\n\
  \n因為老大的遺言就是希望范逸臣\n戒賭好好做水電娶妻生子\n范逸臣也謹記遺言追到大美女\n戒賭好好做水電，四年後讓老婆懷孕\n但老婆還是繼續去陪酒，因為家裡窮\n\
  \n老婆說范逸臣拿幾百萬回家他就生\n不然就拿掉小孩繼續去陪酒自力更生\n范逸臣被小孩老婆逼急了就破戒再去賭\n就拿水電行的地去抵押給姚淳耀賭職棒\n\n想當然就中計，釘子戶水電行就被拔掉\n\
  這樣鄭智偉所有的地都是林美秀的了\n姚淳耀也只是幫林美秀做事叛徒而已\n就像艋舺的阮經天也是幫王識賢做事\n幹掉自己的兄弟們跟老大馬如龍篡位\n\n但林美秀的律師發現地契需要\n\
  四個人的簽名才能轉讓給林美秀\n就是姚淳耀、郭弘志、范逸臣跟方馨\n少一個繼承人的簽名都拿不到地\n姚淳耀就去找大嫂勒索她簽名\n\n說不簽就殺掉懷孕的劉奕兒\n\
  大嫂愛媳婦就忍痛簽了\n但簽完就被姚淳耀殺了\n真的跟李子雄一樣六輕不認壞到爆\n\n劉奕兒回去跟范逸臣講後\n范逸臣就帶郭泓志跟新收的小弟大根\n三個像英雄本色2一樣帶兩顆手榴彈\n\
  衝去林美秀的公司大樓要同歸於盡\n\n結果第一顆先丟老大庫存正常的手榴彈\n結果放太久過期沒爆，林美秀就放心了\n想說他們身無分文只能拿玩具來嚇嚇人\n就拔槍開了郭泓志背上好幾槍\n\
  郭泓志就丟出他自己做的\n第二顆超大土製手硫彈\n\n然後林美秀看比剛丟的那顆真的更像玩具\n就不會再被嚇跑，沒想到這顆威力更大\n一爆炸人都被炸成灰不見了，郭泓志也死了\n\
  但他一直抱著小弟大根，為他擋槍跟手榴彈\n之前帶小弟大根拜祖師爺鄭智偉一生做兄弟\n教育對兄弟有義、對愛人有情、對外人要公平\n三個幫規家訓\n\n後來范逸臣也幹掉了姚淳耀拿回地契\n\
  掃平了林美秀桃園來侵門踏戶的外敵\n\n片尾跑完字幕後還有彩蛋 :\n范逸臣跟劉奕兒後來就繼承鄭智偉的位\n大根就當繼承人帶了一大票黑衣人\n去墳上祭拜祖師爺鄭智偉跟老大郭泓志\n\
  \n\n\n完\n\n\n這片我是因為一個IG網友才去看的\n她在裡面演劉奕兒阿公店裡的媽媽桑\n她是像女版金城武一樣沖繩中日混血\n因為她才冒險去二輪看這片\n\
  \n不然預告片感覺就是一齣鬧劇\n跟九把刀的加強一樣完全不會想看\n但沒想到看完感覺比拿破崙還要好看\n劇情跟艋舺和英雄本色一樣的套路\n都是賣江湖流氓兄弟的生死情義\n\
  只是場景換成講台語的土流氓而已\n\n這片幾乎90%都是台語片\n除了從北部來的反派是講國語\n范逸臣自稱西屯之虎\n說西屯路以前沒人不認識他\n郭泓志自稱中港之龍\n\
  都是在台中市中心很長的一條大路\n\n裡面演胖議員跟林美秀官商勾結\n就像前台中縣海線大甲來的顏家一樣\n找桃園幫來搶台中市中心地主的地盤\n說手上那麼多地都不肯賣也不肯都更\n\
  那台中那麼多空地是要怎麼發展\n(台中市中心的確很多閒置的空地\n尤其是中友百貨正對面的空地廢墟)\n\n\n在台中剩最後唯一一間的\n二輪戲院全球影城看完後\n\
  從頭哭到尾，很棒很認真的一齣好戲\n不是像預告片或加強一樣的8+9黑幫鬧劇\n坐我後面有四個阿姨從頭笑到尾\n那四個阿姨感覺就像是片中的方馨一樣\n好像全是老大的女人，年輕時都是劉奕兒\n\
  感覺這片所吸引的客群都是跟片中的角色\n\n我查導演，這是他拍的第一部片\n場景設在台中，看他是靜宜大學大傳畢業的\n畢業後就在拍MV，拍得還不錯，尤其是郭泓志\n\
  能夠讓素人演員演得那麼自然都是導演的功力\n演反派的姚淳耀更是演技派的影帝，演得最好\n林美秀也是，這片的反派都演的非常棒\n演小弟跟律師都演的超級壞，應該都是找\n\
  真的台中流氓來演的\n\n\n\n\n\n--\n                                12/09 16:56"
