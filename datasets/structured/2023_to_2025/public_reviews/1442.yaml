title: '[ 好雷]'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  防雷完畢


  這是一個相當寫實的電影。我是因為郭泓志才進場看電影的。想不到這些演員的演技超越

  我的想像。以一個職棒選手來說，電影也能演的這麼好？還蠻意外的。


  雖然一開始沒有寫清楚時代背景，但是整部戲還是非常順暢。真的是非常道地的臺灣台中

  背景電影。


  希望各位多進場看電影。以下是心得。我會努力不爆雷。



  這部戲居然讓我直覺到有翁啟南命案感，真特別。我給這部電影高評價。元素足夠，故事

  線不發散。


  很有艋舺+當男人戀愛時的混合體電影。

  但是去除了艋舺主角群的尷尬感。戀愛戲的份量也沒有當男人戀愛時多。


  本劇主角的下場比當男人戀愛時的邱澤好多了。


  這部電影與其說跟愛有關。

  不如說接近某幾個個在地小混混一生的縮影。

  想從良的小混混想跟八大小姐結婚而改行去當普通人的故事。


  這樣的人可能不止台中有，全台灣都有。


  整部電影節奏輕快，敘事順暢。沒有拖戲，有笑有哭有仇有恩。只能說，這部忠奸分明，

  有主角配角還有丑角。


  這部電影是很寫實的台中地區背景的艋舺。把艋舺改成西屯就是了。


  表面上講愛情故事，根本偷渡各種議題。例如為了利益殺人。


  有部電影叫艋舺。有句名台詞


  「為什麼你明明是我兄弟，我卻要弄死你......」


  --'
