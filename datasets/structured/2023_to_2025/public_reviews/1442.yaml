title: '[好雷] 我最愛的笨男人'
content: '在參加首映前沒有特別看電影介紹，原本以為是愛情小品，No 完全不是，更多的是存在

  大人世界的人性面.現實面；劇情不拖整場無冷掉的鏡頭。

  劇中一幕姚淳耀抿緊了嘴唇，哭到鼻涕都流出來，隔著螢幕是真的感受到他心裡糾結。

  記憶依然停在海角七號時的范逸臣，這次他詮釋一個天天的癡情男，也詮釋的很有味道！

  劉奕兒，好正好美，哭戲也哭到讓人心裡酸酸的。

  你以為郭泓志只會投球！我就說他這次可以入圍金馬獎最佳新人獎，夠北七！夠講情義！

  （你再給我講成花木櫻道 試試看）

  方馨 、 林美秀 雖然戲份不多，但演技派就算一個眼神都是滿滿戲份，演的實在太壞了

  ！

  真的好看，推薦給大家。



  --


  今天這場口碑場真的演藝圈人跟職棒的人很多，但這些都不是重點，重點是電影真的好看

  。'
