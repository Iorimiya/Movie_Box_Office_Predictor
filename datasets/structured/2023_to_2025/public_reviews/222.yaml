url: https://www.ptt.cc/bbs/movie/M.1753602833.A.F4A.html
title: '[普好雷] 藍色小精靈大電影 我為精靈精靈為我 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  藍色小精靈這個系列也被重啟了第三次了

  從一二部的真人版 到3D動畫藍藍村 再到這次的大電影


  這次可以看的出來預算都花在請蕾哈娜上了

  所以動畫的部分並沒特別出彩

  但一開始在精靈村載歌載舞那段水準還是很高的

  蕾哈娜版的小美人也有表現出該有的特色跟態度

  整體來說能在大螢幕上看到滿滿的小精靈還是非常療育的

  劇情部分就是常見的劇情小精靈成長對抗大巫師


  但唯一一個小缺點就是其他隻精靈的戲份也太少了QQ

  小力士 小自戀 小廚師 小音效 小搗蛋等等...

  不是被關起來就是沒被傳送到現實世界

  我反而覺得可以不用加入勢力卜跟黑衣小精靈

  把重點放在精靈村的精靈對抗巫師會更好


  --'
