title: '[情報]【藍色小精靈大電影】精彩預告 - 7月18'
content: '【藍色小精靈大電影】精彩預告 - 7月18日 中、英文版同步歡樂登場




  藍色小精靈超嗨節奏即將來襲！

  【#藍色小精靈大電影】原聲帶 + 全新單曲《HIGHER LOVE》由Desi Trill攜手DJ卡利、

  卡蒂B、娜塔妮亞以及SUBHI重磅打造


  故事簡介 :

  當精靈老爹（約翰古德曼 配音）神秘地被邪惡巫師亂不妙和賈不妙綁架後，小美人（蕾

  哈娜 配音）就決定帶領藍色小精靈來到現實世界，踏上拯救他的冒險旅程。靠著新朋友

  的幫助，藍色小精靈必須找到他們真正的使命，並且拯救整個宇宙。【藍色小精靈大電

  影】星光熠熠的配音演員陣容包括蕾哈娜、詹姆斯柯登、尼克奧佛曼、JP卡利亞克、丹

  尼爾李維、艾米塞德麗絲、娜塔莎雷昂、吳珊卓、奧塔薇亞史班森、尼克克羅爾、漢娜

  衛丁漢、艾力克斯溫特、瑪雅厄斯金、比莉洛德、索洛馬里達那以及寇特羅素與約翰古

  德曼。


  派拉蒙動畫呈獻

  Ty Ty與傑布朗製作

  藍色小精靈大電影


  製片 : 傑布朗、Ty Ty史密斯、蕾哈娜、萊恩哈里斯

  根據沛優創作的角色與作品

  編劇 : 潘布萊迪

  導演 : 克里斯米勒

  卡司 : 蕾哈娜、詹姆斯柯登、尼克奧佛曼、JP卡利亞克、丹尼爾李維、艾米塞德麗絲、

  娜塔莎雷昂、吳珊卓、奧塔薇亞史班森、尼克克羅爾、漢娜衛丁漢、艾力克斯溫特、

  瑪雅厄斯金、比莉洛德、索洛馬里達那以及寇特羅素與約翰古德曼


  中文配音版



  --'
