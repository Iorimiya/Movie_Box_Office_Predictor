url: https://www.ptt.cc/bbs/movie/M.1753021293.A.BBA.html
title: '[普好雷] 藍色小精靈大電影 至少有滿滿的小精靈'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  \n\n先來防雷一下\n\n\n\n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n上次看藍色小精靈真的很久了\n除了老爹跟小美人都不記得啦XD\n\n這部我看的是英文版\n中配的版本我就不知道了\n\n整部片劇情滿直觀的,\n就是老爹藏了一本魔法書\n\
  然後被反派抓走去救他 沒了\n不過既然是兒童向的\n這也許是個優點(?)\n\n先說缺點好了:\n\n-角色除了無名跟小美人以外都沒啥交代\n 反派除兄弟鬩牆以外也很平板\n\
  \n-跟實景的搭配很突兀\n 尤其巴黎跟慕尼黑那段實景真的有夠尷尬\n\n-前半節奏算快\n 但是後半節奏又有點混亂\n 稍微梳理好一點會比較容易看\n\n-歌曲插入集中在前半段\n\
  \ 導致前後風格不一致\n 整個看起來有點不連貫\n\n優點也是有一些:\n\n-歌曲都不錯聽\n 而且插入時機都不錯\n 會想去找OST來聽\n (欸 這部是來打歌的對吧)\n\
  \n-無名的成長曲線\n 以兒童向的電影我覺得處理不錯了\n 從想要不平凡\n  -> 變成不平凡(魔法)\n  -> 不平凡的不是我(通通不是我做的)\n \
  \ -> 失落\n  -> 重拾信念\n  -> 只要有足夠信念\n     就算平凡也能發光\n 這條線我覺得不錯\n\n-小精靈模組做得頗生動\n 開頭精靈村就是火力展示\n\
  \ 可惜後面沒有多秀一點\n 至少比起2011年版\n 我比較喜歡這版的模組\n (尤其小美人)\n\n-巴黎分部那個設定不錯\n 想看John Wick版的小精靈(X\n\
  \n-小美人找蕾哈娜來配原本擔心不太合適\n 不過以這部的調性來講反而很適合\n\n-9次元那邊玩了一堆梗 好評XD\n 8位元魔法書 跟 日式格鬥 那邊我笑了\n\
  \ 還特別找日本聲優來配 很會\n 阿怎麼沒有順便變成北斗風(欸\n\n-大笨貓的模組還不錯\n 雖然沒像喵的奇幻漂流那麼活靈活現\n 不過以偏誇張化的動畫表現來說不錯\n\
  \ 有貓就推(X\n\n-小音效還滿好笑的\n 這個設定我很喜歡XD\n\n整體來講\n劇情偏簡單直觀\n順順的就演完了\n至少有把故事講完\n小朋友應該滿容易理解\n\
  但不要期待深度\n\n然後前半部的風格不錯\n一言不合就開唱我覺得很讚\n可惜後半就沒有了\n如果能延續到後半也許能給個好雷吧..\n\n整體而言我覺得還是可看\n\
  (至少比地球特派員好 不會看完有股莫名的怒意)\n你能認同無名跟小美人的動機\n也能好好的帶入劇情\n\n--\n可以理解啦\n畢竟缺點不少\n我是看完還滿開心有被娛樂到XD\n\
  不像地球特派員我看完是我到底看了三小(憤怒)"
