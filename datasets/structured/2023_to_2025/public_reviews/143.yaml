url: https://www.ptt.cc/bbs/movie/M.1748346825.A.886.html
title: '[討論] 《96分鐘》首支預告'
content: "監製｜鄒介中\n  導演｜洪子烜\n  演出｜林柏宏 宋芸樺 王柏傑 李李仁 姚以緹\n　　　          蔡凡熙 李銘忠 呂雪鳳 黃奇斌\
  \ 鄭志偉\n　　　          陳雪甄 巫建和 孔令元\n\n簡介：\n一場震驚全台的炸彈攻擊案，以無辜死傷的悲劇收場，拆彈專家宋康任（林柏宏 飾）從此\n\
  一蹶不振、退出前線。三年後，他與刑警妻子黃欣（宋芸樺 飾）搭上台北直達高雄、僅需9\n6分鐘的高鐵列車，卻在途中接獲前上司李傑（李李仁 飾）傳來的警告──列車上藏有炸彈\n\
  ！\n\n為挽回婚姻，物理補教名師劉楷（王柏傑 飾）也搭上這班列車，同車乘客還有昔日爆炸案\n罹難者的家屬、準備求婚的戀人、返鄉的生意人  全都被捲入這場突如其來的死亡危機。\n\
  \n列車一路往南疾駛，時間緊迫倒數。宋康任不僅必須在96分鐘內找出炸彈、解除危機，更要\n直視自己深埋心底、不可告人的秘密。在雙壓力逼迫下，他能否成功拯救所有人的性命？\n\
  \n-----------------------------------------------------\n\n《狂徒》導演的新作，從幾年前就有聽聞這部電影的消息。一直都很期待這部電影，畢竟台\n\
  灣這類型的電影相對較少，希望以後可以有越來越多的動作片。\n\n我覺得有時候好壞是其次，當然能夠有好的表現最好，就算成果不如預期，至少也可以累積\n經驗，我認為有個開始總是好事。\n\
  \n\n--"
