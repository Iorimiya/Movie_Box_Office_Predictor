url: https://www.ptt.cc/bbs/movie/M.1757162660.A.852.html
title: '[普雷] 96分鐘-突破國片框架，但還可以更好'
content: '開頭無雷


  一開始知道這部片，是在跟新幹線大爆破上線差不多的時間

  國片長久以來為人詬病的一個缺點，就是題材侷限在一個很固定的範圍

  96分鐘則是國片為數不多，踏出舒適圈的嘗試

  類似的題材在好萊塢已經不新鮮了

  但在台灣則真的是頭一遭

  抱著捧場的心情，我買票進了場


  看完以後，我掙扎著究竟該給他好雷還是普雷

  如果以國片普遍水準，這片的製作值得給個好雷

  但如果希望我國電影越來越好，走向國際

  誠實的面對之下，本片確實還有不少進步空間

  所以最終還是給了普雷


  給普雷的理由其一，是特效方面

  作為一個以爆炸案為題材的電影

  本片在特效場景的選擇上卻相當保守

  我覺得相當可惜


  背後的原因當然可理解是成本考量

  但如果你讓觀眾看電影的時候意識到這點

  難免就讓人出戲了


  給普雷的理由其二，是劇本與剪輯的問題

  我覺得腳色可以更精簡，戲份可以整併

  不然有些腳色的存在對故事的推進沒有幫助

  如果你要給這個配角鏡頭，那就要讓這顆鏡頭是有意義的


  故事節奏可以更緊湊

  導演要給觀眾多一點信任

  伏筆跟線索埋在那邊給大家去撿起來推理

  然後等解密的時候再一次爆就好

  否則過程中帶太多次，反而感到疲勞與重複


  另外就是主要腳色的名字不太有真實感(個人觀感)

  少數對白不夠自然，都是讓人覺得略感可惜的地方


  但反過來說，只要能改善這些點

  這部片是有賣到國外的潛力的

  希望票房能賣到讓投資方與導演都繼續努力下去的程度




  (以下有雷)




  前面說的特效鏡頭問題，指得就是爆炸場景

  本片總共發生三起大小爆炸，但卻沒有一次真的看到爆炸發生

  (勉強來說最後一次是有，但只看到車內爆炸的驚鴻一撇)


  作為一部爆米花電影，該放煙火的時候還是要放的

  前面節省成本用其他方式帶過可理解

  但至少最後一次該做出一個大場面

  但我們只能看到炸完以後的結果

  真的是相當可惜


  再來是劇本，本片的劇本設計上是有使用敘事詭計的

  也就是開頭的雙炸彈案真相如洋蔥一樣一層一層剝開

  最終才揭露事情的真相


  但如果要這樣設計，每次發生時給的資訊就該更少一點

  謎底揭曉的時候也該更有衝擊性，才值得一個場景描三次

  但我覺得設定的還不夠直觀，導致揭曉時不是讓人感到恍然大悟

  而是想著"所以呢?你們就只會愣在這邊?"


  除了接受犯人的安排外，你們應該還有減災的對策吧?

  戲院的炸彈拆了百貨公司會爆，那你們不會趕快撤退嗎?

  畢竟啟動的時候都還有3分半可以跑，能跑多遠是多遠

  結果李傑只會要阿任剪下去，沒有任何疏散現場人員的行動


  來到高鐵上的時候也是一樣，為什麼就沒人想過分離車廂這招?

  這不是電影列車炸彈處理的SOP嗎?

  人都撤到車頭or車尾，然後分離有炸彈的車廂

  危機不就解除了?


  另外夜店章抓犯人這點，導演可能是怕觀眾看不懂

  李傑被掐死前特地特寫了他拿夜店章，但我覺得這多了


  你可以同樣拍李傑死前掙扎(但不用拍出夜店章)

  然後主角方去察看屍體時發現他手上有某個東西(仍不用拍出夜店章)

  最後在李銘忠以為完美犯罪，準備脫身離開月台時

  主角方才用黑燈找出他是兇手(並用蒙太奇揭曉李傑手中是夜店章)


  同時，既然你最後才要讓李銘忠被抓

  那過程中也沒必要主動先揭曉犯人是誰

  可以讓觀眾猜到最後一刻

  再揭曉是他，並解釋犯案原因


  這樣也不會像目前的剪輯這樣

  李銘忠與妻子的事也重複講了幾次

  不夠簡潔有力


  對白方面，特別讓我感到出戲的有:

  片頭百貨公司爆炸後，阿任找到黃欣時

  抱著黃欣說："我沒救到他們，我沒救到他們"

  我就是無法不覺得此情此景這樣的講法很不自然

  (甚至在謎底揭曉以後感覺更不自然)

  阿任為了確保黃欣沒事所以剪了戲院的炸彈

  (劇情理解沒錯的話，他當下並不知道剪了百貨會爆炸?)

  所以剪完以後聽到爆炸聲他緊張的問那是甚麼聲音


  既然百貨公司的炸彈不在他的預想之內

  那他又何來"我沒救到他們"的歉疚感?


  假如說他知道剪了百貨公司會爆，那心情就更不該是"我沒救到他們"

  而是"我害死了他們"，由於他無法對黃欣說出口，

  所以面對黃欣，說"至少你沒事"然後痛哭，這樣的反應比較對

  (以上都是個人想法)


  另外就是有臉有對白的腳色可以再精簡一點

  雖然不一定不符合現實狀況，但比較能幫助觀眾快速進入劇情

  譬如說乘務員or列車長主要就只要一個知名演員飾演的腳色參與劇情


  乘客也只需要幾個比較重要的功能性腳色

  阿任的媽媽是多餘的，因為車上已經有黃欣這個阿任重要的人

  同樣的阿斌也是多餘的，如果只是因為唱主題曲而客串

  戲份可以不用這麼多


  著重描寫求婚情侶、無助小孩(好像沒解釋他同行的家長怎麼了)

  劉楷等少數腳色就好，目前的乘客配角數量還太多

  戲份也不太重要


  總之，希望台灣能繼續拍出這樣突破舒適圈的電影

  並越來越好


  --'
