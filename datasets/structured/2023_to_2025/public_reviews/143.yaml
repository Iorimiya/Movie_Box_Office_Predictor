url: https://www.ptt.cc/bbs/movie/M.1757770537.A.1B9.html
title: '[新聞] 《96分鐘》上映7天票房3200萬 摘單日冠軍'
content: "《96分鐘》上映7天票房3200萬 摘單日冠軍\n\n林柏宏在電影《96分鐘》中飾演防爆警察。（華影國際影藝提供）\n\n【大紀元2025年09月12日訊】（大紀元記者馬維芬報導）災難動作片《96分鐘》在台灣上\n\
  映七天票房突破3200萬，摘下單日冠軍。該片主演林柏宏、宋芸樺、李李仁、姚以緹、蔡\n凡熙將於本週末（13日）起一連三天兵分多路，勤跑戲院謝票。\n\n該片由《粽邪》系列監製鄒介中領軍、《狂徒》導演洪子烜執導，集結金獎製作團隊與好\n\
  萊塢級技術班底打造，林柏宏、宋芸樺、王柏傑、李李仁、姚以緹、蔡凡熙、李銘忠領銜\n主演。\n\n電影上映以來口碑與票房持續衝高，繼首週末開出破1800萬的票房後，上映七天票房累積\n\
  突破3200萬，勇奪全台單日票房冠軍。各地戲院不僅加開場次，更臨時調換大廳放映。\n\n\n電影《96分鐘》，首度引進好萊塢團隊Previs預演拍攝技術。（華影國際影藝提供）\n\
  \n為感謝觀眾支持，《96分鐘》主演林柏宏、宋芸樺、李李仁、姚以緹、蔡凡熙將於本週末\n三天兵分多路，全台勤跑戲院謝票，與影迷近距離互動。\n\n在片中突破自我、全力投入角色的林柏宏感動表示：「看到大家這麼支持《96分鐘》，是\n\
  身為演員最幸福的一刻。」受到大量觀眾肯定的宋芸樺深有同感：「在戲院看見每一張專\n注的臉、聽到觀眾真誠又不同的回饋，所有疲憊都變得值得。」\n\n\n宋芸樺與林柏宏在《96分鐘》中飾演新婚夫妻在危急關頭時並肩作戰。（華影國際提供）\n\
  \n李李仁也分享：「能和這麼多優秀演員一起完成這部電影，是我很難忘的經驗，謝謝觀眾\n進戲院給我們最大的鼓勵。」\n\n歷時九年傾力打造的電影《96分鐘》，導演洪子烜選擇在台灣觀眾熟悉的環境中建構虛擬\n\
  世界觀，其中包含高鐵列車運作的作業流程，都和真實的操作實務不同。\n\n除了緊張刺激的災難情節，《96分鐘》透過每一個角色在極限情境下的選擇與行動，描繪\n親情、愛情與責任的抉擇，激發觀眾反思：「為了自己最愛的人，你願意犧牲多少？」\n\
  \n\n台北電影節開幕片《96分鐘》記者會，導演洪子烜、監製鄒介中率堅強卡司（由左至右）\n林柏宏、宋芸樺、李李仁、林昀希、葉靜涵出席。（台北電影節提供）\n\n\
  關於本週末影人出席映後場次資訊請見《96分鐘》官方粉絲團。\n\n責任編輯：辛幼安\n\n\n\n--\n                 \n   \n\n\n\
  \n--"
