url: https://www.ptt.cc/bbs/movie/M.1758966870.A.67E.html
title: '[新聞] 《96分鐘》票房破億 宋芸樺從美國趕回台'
content: '《96分鐘》票房破億 宋芸樺從美國趕回台灣慶功



  【大紀元2025年09月26日訊】（大紀元記者馬維芬報導）台灣首部以高鐵為題材的災難動

  作片《96分鐘》，自5日上映以來話題不斷，今（26）日舉辦破億記者會，監製鄒介中、

  導演洪子烜率領林柏宏、宋芸樺、李李仁等主演齊聚一堂，公布電影至25日累積票房已破

  1.1億台幣。



  主演群今天在現場分享電影票房突破億（台幣，下同）的心情。



  《96分鐘》上映票房突破1.1億元，主創團隊於9月26日出席電影破億記者會，歡喜慶功。

  （華影國際提供）


  宋芸樺表示真的很開心，立刻取消她在美國原定的課程，搭上飛機回台灣參與慶功活動、

  跟大家共享這個好消息。她感動說：「平常自己會在網路上看大家觀後心得，有很多警消

  人員及家屬看完片子覺得有很大的共鳴，這部分真的讓我很感動，也是我一開始拍這個戲

  的目標。」


  林柏宏分享首次挑戰大規模災難場面，他坦言至今只要看到信義區那場戲，仍會忍不住鼻

  酸想哭：「一想到角色『宋康任』的心境，就能理解他表情裡的心虛與愧疚，我就會被那

  情緒拉回去。」



  提及電影票房破億的好消息，林柏宏雖然表示非常開心，但被問到是否會繼續接拍動作片

  ，他笑笑回應：「現在想到動作片就偏害怕，短時間不會想再接，除非劇本非常好。」這

  次參與很多映後活動，觀眾的反應他也覺得很驚喜，「大家映後的情緒很激動，有很多人

  説看完痛哭或者是爆哭。」



  林柏宏於9月26日出席電影破億記者會。（華影國際提供）


  被網友封為「噴淚婆婆」的呂雪鳳今天第一次加入映後座談活動，自嘲她以往拍完戲後就

  不關心電影後續，關於票房破億的好消息，她也表示非常開心，直說現場大家都是她的福

  星，「當初我看到這個劇本就覺得一定要談下來，降價也可以，一定要咬著不放。」



  呂雪鳳於9月26日出席電影破億記者會。（華影國際提供）


  李李仁也分享，這次有遇到「15刷」的觀眾，真的非常感動，也非常開心並且期待台灣電

  影有更多不同的元素。



  李李仁於9月26日出席電影破億記者會。（華影國際提供）


  蔡凡熙則直言，這次對他來說是演藝生涯中最難忘的一次挑戰：「很多觀眾會說直到電影

  播畢才發現蔡凡熙有演，或是映後看到我走進影廳才發現，這樣很好，這跟我設定的目標

  很像。」



  蔡凡熙於9月26日出席電影破億記者會。（華影國際提供）


  《96分鐘》劇情描述，一場震驚全台的炸彈攻擊案，讓拆彈專家宋康任（林柏宏 飾）從

  此退出前線。三年後，他與刑警妻子黃欣（宋芸樺 飾）搭上台北直達高雄的高鐵，卻接

  獲前上司李傑（李李仁 飾）的警訊──列車上藏有炸彈！為挽救婚姻的物理補教名師、

  爆炸案罹難者家屬、毫不知情的返鄉乘客們，全被捲入這場突如其來的死亡危機，宋康任

  必須在列車疾駛的96分鐘內解除炸彈，同時面對內心深埋的秘密。他能否力挽狂瀾，在倒

  數中拯救全車性命？


  電影劇情環繞一場突如其來的危機，搭配緊湊節奏與逼真特效，成功營造出前所未有的沉

  浸式觀影體驗。


  監製鄒介中在記者會上感性表示，電影從籌備到完成歷時九年，期間歷經無數挑戰與困難

  ，能夠獲得觀眾支持並順利衝破一億元票房，對團隊而言是莫大的鼓勵。接下來電影還會

  在星、馬、香港、越南等地上映。



  本片用驚險刺激的劇情、精湛演技與高規格製作贏得市場肯定，正如導演洪子烜所說：「

  我們希望透過這部電影，告訴大家台灣能拍出自己的災難動作片，甚至能自信地走向世界

  。」


  責任編輯：辛幼安




  --








  --'
