title: '[普雷] 96分鐘  任務結束 '
content: '黃欣傳了一段最後對方收不到訊息


  任務結束，辛苦了。


  收的很好




  台灣第一高鐵災難動作片

  值得鼓勵




  兇手阿輝中間莫名現身沒有驚喜感 動機也蠻不夠強

  但夜店印章抓最後boss那處理還不錯有梗




  楊婷娟最後明明可以幫宋康仁推炸彈

  不然也幫忙輔助

  多少也有她的鍋

  結果她最後在那邊陪小朋友玩

  最後讓宋康仁被炸死

  但這編劇就是要這樣壯烈犧牲吧



  30公里跳車那有點好笑..


  --'
