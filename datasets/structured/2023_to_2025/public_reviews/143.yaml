url: https://www.ptt.cc/bbs/movie/M.1757084747.A.BB6.html
title: '[  普雷] 96分鐘'
content: '由於當初看預告的時候很期待這部電影，也覺得台灣很少有這種題材的電影，今天第一天

  上映就進場支持一下，不過看完後有點小失望，以下防雷線



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  以下是我覺得不太喜歡的地方或是很明顯會出戲的地方：


  1.  感覺整部電影在找兇手跟炸彈的過程沒有很充實，就是手機響起來然後就發現炸彈在

  哪裡了？然後藉由兇手的姐姐告知就知道下一顆炸彈的位置…這感覺太輕鬆了吧


  2.  整部戲的主軸好像都圍繞在當初那場爆炸背後的原因？甚至多到有點搶了主線了，主

  線應該是要看主角在車上怎麼找到炸彈跟兇手，如何移除炸彈跟拯救其他人，但大部分時

  間都去回憶之前的爆炸案強化兇手的作案動機了


  3.  疏散民眾那邊我也有點出戲，高鐵南部除了高雄記得都是高架段吧，為什麼跳車跳下

  去是在草坪上面？而且那高度跳下去應該也重傷吧，跳下去後空拍角度看到列車離地面的

  距離感覺那應該是火車跟火車月台吧


  4.  兇手作案動機我也覺得有點牽強，本來就只能優先救隧道裡面的人啊，雖然我也覺得

  李李仁講那句我們不是英雄也有點多餘就是了，而且為什麼兇手可以在追思會上面發言？

  他的親人又不是在百貨公司爆炸案過世的


  5.  最後林柏宏跳上車後還慢慢走去看其他乘客，但重點不是應該要先拆彈嗎？而且拆彈

  過程完全沒有緊張感，就是已經知道要剪哪條了而且林柏宏也很明顯要同歸於盡了也沒有

  看到跟時間賽跑的壓力，覺得很可惜的是前面堆疊出來的緊張感在最後完全消失了


  但也是有幾個優點可以說啦：


  1.  動作戲的部分雖然沒有很多，但還算可以，林柏宏跳車飛過去那邊真的蠻厲害的


  2.  整部戲有前後呼應，有扣緊少數多數的選擇上，最後林柏宏選擇犧牲自己（少數）拯

  救多數，也算是呼應了電影開頭強調的我們只能優先救多數


  總結：有點小失望，感覺劇情過多著重於過去的爆炸案強化作案的原因，整部戲的內心戲

  是蠻強大的，但這部片的性質跟我想像的不太一樣，可能我是以空中救援這種片為目標吧

  ，原本以為會是看了很爽的救援系列商業片，但看完了反而更多是對人性的探討


  如果是想看商業爽片的不建議進場觀看，因為武打戲也不多，整體拆彈過程也沒有緊張感

  ，整體真的有點空，以商業片的水準來說我認為是不及格的，但如果單純想支持藝人或是

  進場支持國片還是可以啦




  --'
