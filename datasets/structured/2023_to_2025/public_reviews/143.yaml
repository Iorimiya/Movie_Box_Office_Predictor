url: https://www.ptt.cc/bbs/movie/M.1762423259.A.1BA.html
title: '[新聞] 96分鐘全台票房破2億仍難回本 海外疲軟'
content: "《96分鐘》全台票房破2億仍難回本！海外疲軟恐虧損逾五千萬\n\n04/11/2025 6:25\n\n\n\n《96分鐘》劇照\n\n林柏宏、宋芸樺主演的台灣動作電影《96分鐘》週日（11月2日）正式突破\
  \ 2 億元（新台\n幣，下同），正式超越《角頭－鬥陣欸》 1.88 億元的票房，成為年度票房最高的台灣電\n影。\n\n電影成本製作高達 1.6 億元，本報先前預估，若扣除政府專案補助金額，本片須賺進至\n\
  少 2.7 億才得以回本。\n\n製片方華影國際影藝先前指出，《96分鐘》已於新加坡、馬來西亞及香港等地上映，年底\n還將進軍越南市場，期望藉由海外票房回收部分成本。\n\
  \n經查證，雖官方未公布具體數據，但該片在新加坡上映首週僅排當週第 8 名，次週跌落\n至第 9 名後即自榜單消失；至於在馬來西亞，則未曾進入票房排行。\n\n\
  回顧過去，《周處除三害》、《當男人戀愛時》和《比悲傷更悲傷的故事》等片皆曾在海\n外收穫極度優異的成績，三片分別在中國入帳 29 億、11.6 億和 42 億元；《關於我和\n\
  鬼變成家人的那件事》更因為題材特殊，在香港、越南和南韓三個市場賺進 1.24 億元。\n\n然而，大多數台灣電影在海外市場平均最多賺進 2000 萬元至 4000\
  \ 萬元，僅極少數作品\n能夠成功。\n\n若以近期新片為例，《角頭：浪流連》在香港和新加坡收穫約 2149 萬元；《該死的阿修\n羅》在香港入帳約 16 萬元；《女鬼橋2：怨鬼樓》則在香港、越南和俄羅斯累積約\
  \ 1835\n 萬的票房。\n\n根據資料，《96分鐘》暫未確定會在中國上映，若海外其他市場的票房表現疲弱，本片預\n計將虧損超過 5000 萬元；不過，《96分鐘》已衝破最低的「2\
  \ 億門檻」，仍然超出不少\n業界人士的預期。\n\n雖電影可透過串流管道賺進額外收益，但授權收入有限，主要仍依賴票房表現。\n\n影視經紀人林珊珊曾在接受《鳴人堂》訪問時表示，「合理的授權費是製作費的\
  \ 2.5％\n到 4％。」\n\n若依照傳統，《96分鐘》製作成本 1.6 億元，數位授權費最高為 640 萬元；若計入單次\n付費平台（TVOD）40％ 的分潤，整體串流收入約可至\
  \ 2300 萬元，電影仍恐虧損超過 27\n00 萬元。\n\n值得注意的是，文化內容策進院週二（4日）的「2025 TCCF創意內容大會」活動中，提及\n\
  本片成功衝破 2 億門檻的消息，並宣布設立兩項跨國內容投資基金，包括南韓 CJ 娛樂\n集團（CJ ENM）與遠傳電信的「台韓娛樂與文化內容基金」，以及專注於台灣\
  \ IP 的「遠\n傳創意娛樂基金」\n\n（編輯／Caesar Yang）\n\n新聞網址：\n\n\n\n--\n你再說你唷 我晚點去檢舉好了"
