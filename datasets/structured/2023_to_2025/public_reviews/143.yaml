url: https://www.ptt.cc/bbs/movie/M.1757240141.A.18F.html
title: '[普雷] 96分鐘 史上最雖小男主'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  基於支持國片的立場會給它個普雷，一些敘事如何更好，前幾篇已經有人說明很清楚就不

  贅述


  事後覺得男主角雖小程度實在不亞於柯南周遭的人

  荒謬到有點好笑ww





  林柏宏飾演的是防爆拆彈專家警察

  第一段天災導致兇手老婆在隧道內掛掉，李李仁下令拯救隧道外生還者，這些完全不干林

  柏宏的事


  兇手後來安排百貨公司雙炸彈想炸死李李仁，結果林柏宏聽從長官命令拆除眼前炸彈，間

  接引爆百貨公司的炸彈造成數十人傷亡

  以林柏宏立場完全沒問題，收到長官指令，職責是拆除炸彈，他人已經在電影院的炸彈面

  前，唯一能做就是排除眼前的東西（誰知道兇手威脅是真是假）

  兇手還要因此對他產生殺機，因為你沒幫我順便殺死痛恨的李李仁XD?


  事隔三年，在高鐵上又發生雙炸彈

  重點當時林柏宏已經辭職，他根本就不是警察囉！

  然後前長官再一次情勒，只有你能拯救、只有你能拆炸彈，所以你必須這樣做

  欸哈囉，你現在在要求一個普通人幫你拆炸彈嗎？


  蔡凡熙（一個被仇恨蒙蔽雙眼的路人打手）要求視訊對峙，脅迫公開當年真相，李李仁拒

  絕說明，所以我們被情勒的林柏宏只好挺身說明當年受到兇手威脅必須二選一的真相，受

  害者家屬配合劇情跳腳繼續情勒林柏宏說他是殺人兇手，不爽林當時被說是爆炸案的拆彈

  英雄，但是完全不合邏輯，沒人知道始作俑者才是炸彈客嗎XD？（有啦有聽到一句民眾台

  詞有講……）



  此時的我已經看到快高血壓，林柏宏這角色到底造了什麼孽XDD 要被這樣對待

  英雄也不是他自己冠上的，放炸彈的也不是他，決定要繼續拆電影院炸彈的也不是他，當

  年天災也跟他無關，要被受害者轉移憤怒罵說是兇手？？？此時身為普通民眾的他還受到

  生命威脅


  全部全部都是因為，

  “只有他會拆炸彈”

  完美呈現什麼叫能力越大責任越大、能者過勞死

  身為社畜的我真的看的有夠憋屈


  好，然後後來他必須到另一台高鐵去拆炸彈

  去了要先被民眾投以冷眼旁觀

  還要跟蔡凡熙搏鬥外加用尖嘴鉗捅肚捅胸

  失血過多還被編劇安排拉巫建和一把

  我本來以為被踐踏的巫建和一命嗚呼

  結果被拉起來看起來只是像剛冬眠完的熊，一臉茫然哀嚎幾聲繼續逃去第一車廂

  留下流更多血的林柏宏

  看得我？？？？？？

  （再吐槽一下，在緊急逃難當下求婚戒指什麼掉了真的就不要去撿了==，就算是信義區地

  契你沒命了還享福什麼？身為他女朋友的話，我應該覺得他不分輕重緩急，氣到分手XD）


  最後林柏宏成功把炸彈移到最後車廂一起殉職

  不是，他根本只是一般民眾，他還不算殉職，請問他領得到殉職慰問金嗎啊啊啊啊？

  他甚至一開始也不知道賴秉成當年是假兇手

  他跟兇手老婆的死一點關係都沒有

  我除了心塞還是心塞，滿頭問號疼惜這個有夠雖小的角色



  兇手最後被物理之神抓到，痛打在地時說

  “你打死我吧，我早就想死了”

  等等老兄，你想死的話早在最一開始你直接把李李仁炸了然後去自殺，反正你最後還不是

  親手把他勒斃

  還不用搞這一齣百貨公司跟高鐵炸死一堆人，還多拉一個拆彈專家一起陪葬ㄟ

  我們柏宏不用領便當，可以快樂跟老婆去度蜜月，辦南北流水席婚禮@@


  --'
