url: https://www.ptt.cc/bbs/movie/M.1757674910.A.A1D.html
title: '[好無雷] 好久沒看到那麼刺激的國片了《96分鐘'
content: '一開始進場期待放的很低

  畢竟是國片+動作片+災難+劇情片類型

  說真的不是很看好= =


  然而開頭的劇情就讓我想起了太魯閣案

  一下子就代入到電影之中

  後面開始就沉浸於炸彈的那份刺激感之中

  尤其是劇情進入主軸後非常的緊湊

  讓人很難喘息

  很久沒看過這類型的作品了

  我甚至覺得這部比超人和F4優秀(其實我也有點超英疲勞了


  沒有什麼降智橋段

  也沒有太過刻意的部分

  一切都很平常

  在這種作品中營造出的不正常

  正是這類型片的難處

  加上天人交戰的電車難題

  我認為編劇塑造了一個非常好的犯人角色

  同時其他綠葉也不遑多讓

  演員群的表現算是可圈可點


  只希望大家可以多進場支持

  盡可能讓這種好片回本

  讓國片挑戰更多類型的作品


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
