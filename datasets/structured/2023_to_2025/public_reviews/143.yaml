title: '[  雷] 96分鐘'
content: "題材部分選擇台灣人最習慣大眾運輸工具\n   和加上台灣文化風格的道地國片\n\n   連劇情也是台灣鄉土劇通病\n\n   前段劇情都很好猜，大家都很清楚\n\
  \   阿揮一定不是兇手，但劇情又在這繞圈\n\n   後面就跟鄉土劇一樣在灑狗血，賣情感\n   情緒帶不起來反而還會覺得很無聊\n\n   反而片名叫96分鐘，\n\
  \   卻沒有製造出時間的壓迫感\n   節奏也不夠緊湊，像鬼打牆一樣都在賣情感\n\n   高鐵車廂那麼多節，\n   但你好像也只看到一節的人而已\n\n\
  \   炸彈的壓力劇中你也感受不出來\n   帶太多感情戲上去了\n\n   像當年的捍衛戰警，把劇情都放在跟\n   歹徒鬥智，炸彈壓力，和乘客反應，時間壓力\n\
  \   這部片就不會那麼無聊\n\n--"
