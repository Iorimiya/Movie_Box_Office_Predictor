url: https://www.ptt.cc/bbs/movie/M.1757430997.A.154.html
title: '[負雷] 96分鐘 看得尬到我想找快轉鍵'
content: '雷文防雷資訊頁


  首次在電影版發文不確定防雷頁是否夠長，請見諒

  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  各位電影愛好者，請見諒我這次分享的心得可能會讓不少支持者不喜


  但在我今天下午滿場影廳，看完這部"96分鐘"後實在心情不舒服到了現在


  以下是我覺得此部電影讓我覺得反邏輯反直覺的地方：



  1. 主角在凌亂高鐵車廂中的奔跑速度：


  到了劇末，男主角自述將炸彈放到車尾(畫面有帶到車廂12)，再自身逃跑至車頭


  (車廂1)時間尚有3分鐘，非常充裕。


  這對我來說太出戲了！就算這不是實體的"台灣高鐵"，你要怎麼在已經發生一次小爆炸/


  凌亂/還有很多隔間門的車廂內快速奔跑12節車廂啊！退一步來說，就算男主那時候決定


  犧牲小我與炸彈同歸於盡，那你大可不必還拖著殘軀拉著一條血線啊！可以英雄一點對著


  鏡頭堅強而不是像被鍘刀鍘過後拖地板啊



  2. 時速30km/hr下跳車：


  這可能和我個人經歷有關。以前在高中的時候就被師長分享千萬不能在火車過站/離站


  的時候跳車，就算看起來很慢也不行！因為那時候有一個應屆畢業的學長剛考上大學


  為了和女朋友約會(?)火車慢速過站未停/駛離下跳車，結果因為從運動坐標系跳到


  靜止坐標系，腦部會迅速著地死亡。(新聞上也可以搜尋到很多類似案例)


  所以當看到一堆人擠人搶著跳車滾動的時候我腦子又出戲了，出戲完看到一堆跳車成功


  的人又站了起來，我這時候就好想按下快轉鍵....



  3. 五分鐘疏散(?)：


  到計時五分鐘的時候，男主角拖著殘軀走進車廂，和大家說趕快跑到車頭去...


  有點忘了那劇情，但怎麼表現出來的好像不是五分鐘要爆炸了，而是五十分鐘


  (然後你手上還推著炸彈行李箱)



  4. 男女主離別的感情戲：


  可能我平常很少看動作片吧，但以我有印象的洋人動作片，通常最後關頭互相告別後


  就是一個長吻，然後男女各奔東西，節奏一個順暢；


  但來到本片....不是欸！炸彈要爆了啊！怎麼還能對手戲這麼久，台詞這麼多


  讓我看劇的情緒就整個打斷，我又繼續出戲了，又想按快轉鍵了...



  其他剩下嘈點也漸漸淡忘了，但....整部戲讓我出戲魂飛走的地方實在太多


  看完只有一種，我看了什麼的感覺。



  和各位國片愛好者分享一下，謝謝。


  --


  繼續補充一下覺得劇情不順的部分：



  5. 炸彈客如果想繼續再玩一次二選一的拆彈遊戲的話，你應該一開始就要趕快說有兩台


  車分別有兩顆炸彈吧... 套上降速縮短引爆時間/停車即死的設定你就沒有預期另一台車


  的炸彈有拆解的可能吧！？所以結論犯人設計的遊戲是男主願不願意犧牲自己救另一車


  的人，順便把犯人自己也炸了



  那你一開始早說啊！怎麼不早說，等物理之神計算後送男主跳到二車後才接露有第二顆


  炸彈會不會太慢了？(雖然不影響到結果)



  6. 物理之神？


  懷疑幕後的幕後就是物理之神了。


  a. 是你計算30km/hr跳車的，其實你想一鍋踹了二車吧？(雖然不知道老婆在車上)


  b. 如果不是你的提醒，以兩位警探的知識儲備看得懂降速縮短引爆/停車即死的設定嗎？


  c. 兩車併行90km/hr跳車的建議也是你算的，不過跳車劇情我覺得合情合理


  其實寫到上面一堆邏輯謬誤的時候就想說基礎物理邏輯可以再順暢一點，全劇就很順暢了



  "人家說二選一你就一定要二選一嗎？"這句話也是物理之神說的，我怎麼感覺你是在嘲諷


  警探警察跳不出框架，拆彈只會二選一；山洞事件只會二選一...



  如果再認真一點探討拆一爆一的設定，尤其又是用手機來控制的話(影城事件手機響)


  那是不是屏蔽訊號就可以解決這個問題了，例如用錫箔紙包住


  當然不排除是兩顆炸彈是實時連接，一旦斷訊即爆的設定；但考慮到過山洞時訊號可能會


  中斷的可能，這種設定可能性又更低了。



  綜合以上，認認真真的思考電影的邏輯設定，惟一能讓我覺得邏輯自洽的結論就是


  幕後的幕後都是物理之神的手筆，也解釋了怎麼製作炸彈的原因。




  雖然上面很多朋友分享看電影幹嘛想科學想邏輯，但其實我也沒在想啊...


  30km/hr跳車如果是發生在主角團我會覺得是主角buff沒問題，但就是一堆路人跳...


  以上，希望如果拍續集的話可以讓劇情更融洽一點。'
