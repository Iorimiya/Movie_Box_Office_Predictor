url: https://www.ptt.cc/bbs/movie/M.1759155523.A.31E.html
title: '[普 雷] 96分鐘最後主角'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  前面看不論劇情和拍攝 覺得都還不錯


  但是在最後主角將炸彈推到最後車廂 我就覺得很瞎 有個邏輯很大的問題


  有當過警察都知道首先第一任務就是先確保自身安全


  我想這都是共識


  明知道自己已經受重傷 而且將這麼重的炸彈推到後車廂可能自己也不一定能完成


  WTF?


  為什麼一定要自己逞強


  硬要自己獨立去完成?


  我記得車廂還有些乘務的工作人員


  明明就可以請他們協助完成 或是幫忙搬 我看主角這麼慢的推到最後一節


  時間還至少有一分鐘 那其他人用跑的推過去 在回到第一節車廂一定是綽綽有餘!


  然後自己就不用白死  除了造成老媽 和女友的傷心


  而且若自己體力不支 沒辦法推到最後面的車廂 中間就掛了


  這樣不就整車的人都說再見?




  所以我不得不說滿爛尾的~



  雖然這樣拍確實比較可以讓大家看得很感動 賺觀眾眼淚



  但是以邏輯來說這邊確實是很大的硬傷  希望拍第二部的時候


  邏輯能更縝密  ~






  --'
