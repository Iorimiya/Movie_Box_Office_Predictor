url: https://www.ptt.cc/bbs/movie/M.1760324943.A.E1A.html
title: '[普負雷] 導演價值觀怪怪的96分鐘'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~
















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  老實說，導演的拍攝技術跟手法是不錯，但價值觀怪怪的，腦子不知道在想什麼。



  首先就是那個白癡弟弟真的很蠢 有個人跑來跟你說你姪子被人炸死


  都是因為警察把他們那邊炸彈拆掉的關係 就因為他們拆了炸彈才會害你這邊炸彈爆炸


  你看警察是不是很可惡！！你是不是很想報仇 來來來～我這邊剛好有兩顆炸彈


  我們去裝在高鐵上吧 go! go! go!




  智商是要多低才會信這種鬼話？有人這樣跟你講 腦沒壞都會覺得 幹 抓到炸彈魔了!!


  炸彈就你這王八蛋裝的吧! 怎麼會傻傻的信以為真 還真的恨上警察了


  他一打視訊過來 林柏宏就應該一臉嫌棄地看著他  你是豬喔？ 還是腦子被炸壞了？


  我這邊一拆彈 百貨公司就爆炸 這種事你也信？ 而且就算是真的 這誰跟你講的？


  這麼機密的訊息他怎麼知道？ 如果他不是警察 那一定就是兇手 要不然就共犯啊


  幾歲人了 拜託長點腦OK?




  李傑比較可議的是隨便找個替死鬼把案結了 當時好好查 兇手搞不好早被抓到了


  放炸彈的真凶還在外面亂跑 他就隨便找個倒楣鬼把案子給結了 這真的誇張


  但如果是因為開頭那個救多數人的決定來譴責他 就很莫名 救難資源有限


  誰他媽不想每個人都救？但現實就只能盡力救大多數人啊



  林柏宏老實說就拆炸彈的 有個炸彈在你面前要爆 怎麼可能不拆？


  炸彈眼看要爆 然後兇手忽然說百貨公司還有一顆　你這顆拆了那邊就會爆喔~~　


  首先就百貨公司誰知道是不是真的有炸彈？那邊搞不好根本沒有 我不拆豈不白白被炸


  再來就像李傑講的 就算有 這邊不拆那邊也不見得不會爆 犯人講的話根本不可信　


  到時兩邊都爆 本來可以救的都沒救到　豈不更慘?


  最後就是即便你講的都是真的 我先救我跟我女友這邊也沒什麼不對 我又不是聖人


  你死個老婆都能發瘋放一堆炸彈了 是在機歪什麼 還想道德勒索喔？


  所以導演最後把林柏宏寫死 實在太瞎　還是說導演想呈現悲劇英雄的悲壯感？


  但我看完只覺得是好人盡忠職守卻沒好報 衰毛碰上個神經病



  然後所有炸彈都他放的王八蛋兇手 最後還好意思哭哭賣可憐


  怎麼沒有人出來嗆他 你要是真相信死後有靈 你死了也會下地獄 不會跟你老婆團聚啦～～


  ㄟ 不是死了老婆就什麼事都能做得耶　你跟李傑或是林柏宏哭慘就算了


  這列車上每個人都有家人被你害死 你還好意思哭? 世堅情都要怒了


  睜眼說瞎話 你是在哽咽什麼啦？哭什麼哭 沒出息！


  最後真應該所有家屬衝上去一人一腳把他踹死才對




  總之國片能挑戰這種題材是值得鼓勵 劇情的張力和緊張感有出來


  但導演或編劇不應該為了不落俗套 標新立異 搞這種看完讓人覺得三觀有問題的劇情


  --

