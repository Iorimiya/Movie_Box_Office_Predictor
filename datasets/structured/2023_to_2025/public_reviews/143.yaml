  （難得有不一樣題材了，希望大家支持一下國片）\n要討論96分鐘，其實就很難避開前幾個月在Netflix 上的新幹線驚爆倒數\n兩者推出時間接近、題材相似，也有不少類似橋段\n\
  或者說，在列車上有爆裂物的主題再怎麼拍大概也就這樣了\n如果兩者真的要殘酷的比較，當然還是新幹線驚爆倒數好\n但是差距真的沒有很大，搭配影院大銀幕和音響，96分鐘看起來還是挺爽的\n\
  尤其那個百貨爆炸的持續時間之久我都害怕影院音響受損\n\n劇情沒問題，就是最後離別的橋段有點太拖了\n\n另外本片雖然是高鐵主題，但是和實際的台灣高鐵還是有些區別。從乘員制服、公司LOGO、\n\
  車站站體。\n不知道是不是刻意區別或是沒得到台灣高鐵官方支持\n日本舊版的新幹線大爆破也是沒有官方支持就是了\n\n還是希望大家能多支持一下國片。\n\n--"
