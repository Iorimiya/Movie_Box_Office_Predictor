url: https://www.ptt.cc/bbs/movie/M.1758468360.A.F08.html
title: '[討論]【96分鐘】在楊季章之外，有一位時空旅者'
content: '先來鎮樓





  還是感謝這位好人男主角

  在我們看見公車廣告，

  跑去Ｇoogle這部電影時

  看見這則幕後花絮




  男主角自述的經歷時

  我腦袋跑過的是這個





  在白米炸彈客之前

  【年，拆彈的警官】

  ￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣








  去找了台灣演義

  台灣重大新聞，總有他們的整理成輯



  可怕的是，

  臺灣演義敘述的楊儒門案

  監視器最初拍到的嫌犯畫面

  不是後續在一小時內抓到的楊儒門



  『也就是我們的鎮樓圖』







  現在呢？


  各位呢？

  真的會覺得『後來抓到的楊儒門』確實是監視器這個畫面？


  ..


  老實說本片男主角

  還比較像這個【『不是楊儒門』的最初嫌犯】










  在【】

  ￣￣￣￣￣￣￣￣￣￣￣

  炸彈也就是裝在麥當勞天花板【茶葉罐】裡。





  本片，到後來，

  【李傑】被『本片找到茶葉罐的賴大叔』打了


  終於說出當初【百貨公司爆炸案】

  找了替罪者。






  但是各位真正去看臺灣演義

  會明顯發現

  『楊儒門案』監視器有拍到犯人





  警方一小時內抓到的

  【 張震嶽（楊儒門)】

  ￣￣￣￣￣￣￣￣￣￣￣￣




  這也就無異於『李傑自白中的替罪者』

  ￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣

  只是找替罪者的國家機器

  又塞給替罪者很多『人權團體有興趣的title』

  案子的順理成章似乎就更牢不可破了







  （三）【這個-】



  是用來吸粉絲的嗎？

  快丟給阿米們




  ￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣

  我本來是EＸØ粉絲뜊當然覺得

  此人怎麼看都像隔壁的【Ｊ-Ｈøｐe】



  詭異的是

  眾所週知，金鐘仁有姊姊，


  ￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣


  每次


  ..


  不知【Ｊ-Ｈøｐe】有冇姪子？









  （四）惡魔


  惡魔應該就是假裝找到茶葉罐的賴大叔

  一邊指揮著楊澧輝

  一邊操弄情緒



  每個人都有重要的人

  【但正義不是『以愛之名』】









  綜合歸納【】

  ￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣

  而『不只是把引爆摩天樓』拍成臺灣電影




  最好奇也最驚悚的可能是


  楊婷娟那句【親愛的...


  各位不可能感覺不出『楊婷娟也希望楊愷死』




  於是死者應該是有


  【楊季章】

  ￣￣￣￣

  【楊儒門（特赦）】

  ￣￣￣￣￣￣￣￣

  【楊澧輝】

  ￣￣￣￣￣

  【楊楷（本片未死，先抖３抖）】

  ￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣







  慕容玄瑟



  他是最奇怪的人


  很像是【穿越[時空]重返此現場，呂雪鳳[真兒子]】

  ￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣



  ①【總是在[某個時間點]保護這位大嬸】


  ②【而大嬸（呂雪鳳）明明有認出他】

  ￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣


  （而不只是因為幾乎從頭哭到尾）





  觀眾不可能察覺不到

  那問題是


  【片中設定是大嬸兒子的【宋康任】其實應該是『假兒子』】

  ￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣







  【尤其是在宋康任自述『電影院拆彈經過』】



  像是【用說的，怎麼可能是真相】

  的感覺




  各位別忘大嬸這個畫面比對


  【『Ｊ-Hope』這節車廂挾持的人們】






  【大嬸（呂雪鳳）應該是『賴大叔』那邊的人】



  而這位真兒子應該是位『改頭換臉復仇者』

  一定跟大嬸（呂雪鳳）真兒子原先的臉

  不一樣。







  【但大嬸對真兒子是有記憶且眼熟的】

  ￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣



  假設，可能像【Ｔotal Ｒecall（魔鬼總動員）】

  【涉及了假記憶的存在】

  【那有著假記憶的，居然只有宋康任!?】





  （那【賴大叔】依然是最可怕且實力堅強的）

  （教唆殺人犯）


  --




  翻譯蒟蒻來囉！'
