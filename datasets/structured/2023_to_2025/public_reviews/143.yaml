url: https://www.ptt.cc/bbs/movie/M.1757089921.A.A22.html
title: '[普雷] 96分鐘'
content: '原本今天打算去刷F1，但想到96分鐘今天上映，擇日不如撞日，就臨時改看這部。


  我預告沒看完，演員表也沒仔細看，只知道男主角是林柏宏。

  之前看過他演的《關於我和鬼變成家人的那件事》和《愛的噩夢》，

  對他的演技印象不錯，我就在這樣的情況下走進電影院。


















  以下是以一個路人買票進場的觀後感：





  我的評價是介在【好雷】與【普雷】之間。


  電影一開場是在電影院拆炸彈，我心裡只想：為什麼不開燈？為什麼不開燈？= =

  看起來也不像斷電了，拜託工作人員開個燈吧……

  逃難人潮的場面也有點假，把三角錐移開，讓人群好逃一點不行嗎？orz

  前10分鐘劇情偏平淡，演員的語氣像在唸稿，一直到上高鐵後，資深高齡演員陸續登場，

  自然的語調和台語對白，才讓我比較進入狀況。


  劇情主軸算簡單：男主宋康任（林柏宏飾）三年前與長官李傑（李李仁飾）

  在電影院拆除炸彈，雖然成功拆除，但同時卻引爆了另一棟百貨的炸彈，造成多人死傷。

  三年後，載滿當年受害者家屬的高鐵，在他們參加完追思會返程途中，意外捲入一場

  復仇陰謀。


  整體來說，我覺得槽點不少，前半段鋪陳有些鬆散，缺乏讓人想追下去的懸念，

  中途我甚至一度想走出去透透氣，這高鐵...不只96分鐘吧，感覺都要開到屏東(?)了


  後半段林柏宏從115車跳到289車後，前面的鋪陳才開始發揮作用，轉變為一連串爆點。


  「人性辯論」的部分，我覺得氛圍掌握得很好。

  當車廂內的乘客得知當年雙炸彈案的真相後，眾人群起責怪宋康任才是真正的兇手。

  他的母親含淚面對大家的指責，卻無法為兒子辯解，那一幕讓人心痛。


  當你遇到「二選一」的抉擇時——你會選擇大義救多數人，還是保護自己心愛的人?

  這樣的主題在很多電影中都出現過，《96分鐘》也呈現了相同議題，雖然覺得有些老套，

  但因為氛圍處理得當，讓我確實感受到了那份掙扎與壓迫。




  我真的得吐槽一下女主角的人設。

  不知道是因為劇情重心都放在林柏宏身上，還是編劇有其他考量，

  前半段女主的存在感幾乎毫無意義，除了不斷大喊「維持秩序」，她幾乎沒有實質作為，

  宋芸樺外型亮眼，但這樣的角色安排，險些讓她變成了花瓶。

  她的角色意義直到結局才明朗——原來只是為了與兇手的過往形成一種悲劇性的對比。


  如果不是為了這樣的對照，我會覺得改成雙男主設定、兄弟情或手足分離的劇碼，

  ，搞不好更催淚。


  幸好在結尾，宋芸樺終於有比較多發揮空間，哭戲和最後遠望的畫面，都讓人感受到

  她內心的痛與掙扎，也算稍微補回了前面的空洞設定。


  撇除對女主角設定的不滿，其他角色和演員的表現我都很喜歡，

  289車次裡幫忙打開炸彈行李箱的高鐵乘務人員，演技非常出色，

  她的眼神在恐懼與堅毅之間拿捏得恰到好處，氣場也很穩，只要鏡頭帶到她，

  我都會被她吸引，某些角度甚至讓我想到韓國演員何智苑。


  還有路人情侶，不論男生還是女生，講電話的語氣都很自然，完全不尷尬，

  路人情侶是真愛! 我本來以為男生被逃難人潮踩死，還好最後有活下來。


  另外像是物理老師、阿輝、阿輝的姊姊、阿任的媽媽，還有跳車時被分離的母女

  ……每位演員的表現都很到位，把角色該有的情緒詮釋得非常好。

  不知道被推下車的小女孩，最後有活下來嗎?

  她媽媽在雨中抱著她的畫面，真的讓人鼻酸，差點落淚。





  其實兇手不難猜，前半段某位大叔的特寫鏡頭異常頻繁，多到讓人覺得突兀，

  所以當他露出真面目、準備勒死李傑時，我一點也不意外。

  真正讓我嚇到的，是那場勒斃戲，鋼線緊勒在李李仁脖子上，細節處理得非常逼真，

  他臉上浮現的青筋和窒息掙扎的神情，讓我一度忘記自己是可以呼吸的。XD


  至於兇手的復仇動機，兇手愛人在多年前一場災難中，因李傑的決策成為被犧牲的少數

  而喪命，這與開場的雙炸彈事件中，李傑與宋康任選擇優先救重要之人的行為，

  形成明顯對比，也成為兇手行兇的理由。


  這樣的動機有些流於「兒女情長」，不過為了不偏離劇情核心，

  可能也只能這樣處理，挺可惜的。




  在一定預算的情況下，特效處理得相當不錯，不會讓人覺得很假，

  高鐵在雨中奔馳的畫面，速度感十足，畫面與音效結合得也非常逼真。

  我是在in89觀影，in89的廳都配有杜比7.1聲道，這部片在音效上的處理顯然

  下過功夫，整體聽覺效果非常出色。


  打戲部分是整部電影最讓我驚豔的亮點，雖然打戲不長，但「一鏡到底」的拍攝手法

  非常精彩，節奏流暢、一氣呵成，完全打破我對台灣電影打戲的既有印象，

  這段真的讓人看得很爽快，有值回票價的感覺。




  如果你問我，這部電影值不值得進電影院看？就打戲和音效而言，我認為是

  值得的，劇情部分就見仁見智了。


  結局林柏宏與宋芸樺的對手戲（雖然是分開拍的），

  兩人演技都非常投入，情感渲染力強，我滿喜歡結局，不是典型的皆大歡喜，

  而是留下遺憾，活下來的人，必須帶著傷痛堅強走下去。


  林柏宏在片中的一句台詞：「我不會讓車上的任何人死去！」

  欸 等等，這不是炎柱大哥說過的話嗎？XDD


  滿滿插旗味，結果真步上大哥後塵...保住了大家，自己卻死了orz


  雖然劇情還有不少改進空間，但作為台灣首部以高鐵為題材的災難動作片，

  整體表現算是亮眼，許多場面處理得相當精彩，我覺得這部片是值得進戲院支持的，

  也期待導演未來的作品，而且結尾的安排，看起來似乎也留有續集的可能。


  0分鐘 → 1分鍾



  --'
