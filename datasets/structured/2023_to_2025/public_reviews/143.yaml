url: https://www.ptt.cc/bbs/movie/M.1757229859.A.5FF.html
title: '[無雷] 96分鐘'
content: '昨天晚上去台中大遠百看

  下午三點去買只剩五點場

  說買兩張，但只剩一個位子

  那就買下一場21：45才有


  就在遠百裡一直待到開演

  終於進場後發現全部坐滿

  我已經很久沒看過客滿的片

  特別還是部國片，非常驚喜


  之前看了這個導演的前作‘’狂徒‘’

  就很期待能看到他的下一部片

  沒想到他第二部片就搞那麼大

  跟狂徒一樣是犯罪類的警匪片


  狂徒是以雨衣大盜為題材

  這片是以恐攻炸彈客為主

  先不論內容好壞與否

  拍國片能把戲院塞爆

  感覺就是一種成功行銷


  特別還有鬼滅角頭競爭

  感覺讓電影院充滿生氣

  特別看完出來外面還有

  一堆人準備等看午夜場

  等電梯去停車場都大排長龍


  對國片的未來充滿希望

  雖然這片導演第一次拍大片

  有點像張藝謀首次拍英雄

  感覺沒什麼拍大片的經驗

  所以有點慌亂跟急躁

  所以細節就沒狂徒那麼沉穩


  像張藝謀到現在還是

  拍大片都沒他拍農村片好看

  但票房就是會比他

  拍小成本農村片高很多

  估計跟大明星大場面有關


  剛好一個鐵路警察跟我一起看

  我想警察應該不會很喜歡這片

  就像醫生不喜歡看醫療劇一樣

  可能會讓他們觸景傷情吧


  還是希望洪導下部片能拍得更棒

  說不定跑去拍劫機犯也說不定

  但不管拍武俠片還是動作大片

  還是希望能多注意細節

  魔鬼藏在細節裡


  做大事如烹小鮮

  越細膩的大片越能觸動人心

  可以跟詹姆斯卡麥隆多學習

  學學魔鬼大帝跟異形2、終結者2

  不會太煽情灑狗血的劇情實打實


  總之能在塞爆的戲院裡

  一起看國產動作大片很幸福

  導演加油，小野加油，台灣加油！


  --'
