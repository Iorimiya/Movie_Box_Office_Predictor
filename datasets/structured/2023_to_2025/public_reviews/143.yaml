title: '[  好雷] 簡裝版拆彈專家  96分鐘'
content: '補個防雷線





















  ------

  基本上這部的架構 跟拆彈專家其實大同小異


  就香港警匪片 多了一堆台灣元素這樣


  男主有陰影或黑暗面存在


  最後男主自我犠牲救了全部的人


  林柏宏角色的基本上就是劉德華那角色


  然後那放炸彈的弟弟 很明顯就致敬安志杰


  最後高鐵格鬥那一段


  致敬今年初甄子丹跟喻亢的地鐵格鬥戲


  不過主角群很明顯就第一次演這類型的電影


  演出看得出生澀感


  跟拍警匪片拍到爛那群香港老鬼演員不能比


  但這是國片第一次這樣嘗試


  不再是89 鬼 甲 王淨這四個元素重覆出現


  個人認為第一次表現這樣算給過了



  --


