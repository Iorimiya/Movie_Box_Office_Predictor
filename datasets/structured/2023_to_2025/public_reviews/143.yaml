url: https://www.ptt.cc/bbs/movie/M.1750446803.A.DCA.html
title: '[好雷] 《96分鐘》 炸彈版的屍速列車'
content: '片尾有30秒內小彩蛋，簡單講一部災難爽片，但有大量的情感線，是台灣電影少有類型，

  不論在攝影、音效、美術、配樂、特效、動作技術面都無話可說，在這類型都是台片標竿

  等級。但如果你是抱持著導演前作《狂徒》看動作片可能會小失望，因為武打戲不到十分

  之一，劇情有賣點有缺點，人物邏輯需要部分無腦去觀看，主要演員幾乎沒有一個在馬虎

  ，都相當精彩。

  —————————————————————-

  以下有嚴重雷

  .

  .

  .

  .

  .

  .

  .

  曾經以狂徒一鳴驚人，帶給台灣商業片新的開發角度洪子烜導演，睽違多年挑戰高鐵災難

  片，從96分鐘不難看出導演的野心變得相當大，不想只是挑戰動作片，而是把災難、愛情

  、親情、人性、懸疑都搬上來做挑戰，已經逐漸有新韓港電影味道的雛形。很多鏡頭和調

  度都相當有巧思，除了他擅長的動作鏡頭調度，比如運用主角鏡中導演作為回憶的轉場，

  在逃亡中埋下各種劇情的伏筆，運用時間線來造成錯位，只要好好再把議題深度和人性刻

  畫再多打磨一點，會很期待導演未來的作品。


  劇本上不難看出，導演從狂徒到96分鐘都喜歡翻玩英雄主義，男主角們都套上這樣的方式

  塑造角色，在這狀況下英雄的，導演用非電影常用英雄的神聖結局，解脫他們的他

  們前面的角色困境和鋪陳，有為電影帶出另一個層次，可惜也是在這個脈絡下不得不而二

  元分出反派，反派動機也刻畫不夠深切極其可惜，不過反派的最後一場都拍的很好。

  劇情上運用簡單的電車難題當做主軸，算是相當聰明好懂的方式，但我覺得最可惜的地方

  ，可能是為商業考量，拍攝大量感情橋段犧牲一些角色行為的動機，造成人物不合理的選

  擇跟邏輯是無法無視的缺點，也造成後面有些橋段令人覺得拖沓。


  整部電影演員堪稱都是在飆演技，從主角到配角都各自有許多精彩時刻，尤其在這麼多感

  情戲發揮下，這一邊是看的過癮。在類型片的情況下林柏宏幾乎撐住整部電影，除了必須

  帶出內心陰影外也必須融入拆彈專家的角色相當不易，宋芸樺在最後情感的執著與崩潰不

  捨，李李仁亦正亦邪的神情，都有高光時刻。配角們呂雪鳳用一顆顫抖乞求和焦躁不捨的

  鏡頭驚艷著觀眾，李銘忠的戲中戲塑造的高難度演出，還有對於責任偏執和憤怒灌注全身

  的蔡凡熙，委屈又能保持魅力的姚以緹，都為電影創造出優秀的表演，在這種類型片實屬

  難得。


  我很喜歡特效與實景的搭配運用得已，更不用說為了高鐵場景所創造的美術和仿佛真實的

  炸彈，飾品雕像都有許多細節。電影中許多情緒和節奏投入仰賴精準的音效和得宜的配樂

  ，攝影和剪輯在這種高難度的劇本，需要多俐落精準，確實是近年台灣電影不可多得的新

  挑戰，雖有瑕疵卻很值得嘗試與投入。



  對了電影片長沒有96分鐘


  --'
