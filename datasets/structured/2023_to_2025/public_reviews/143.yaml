title: '[新聞] 《96分鐘》砸2000萬打造高鐵攝影棚　真'
content: '《96分鐘》砸2000萬打造高鐵攝影棚　真到讓李李仁有錯覺




  動作片《96分鐘》以高鐵被放置炸彈為背景，全片有8成以上場景在高鐵車廂拍攝，劇組

  特別砸下2,000萬搭建了全台首座高鐵智能攝影棚，全片殺青後攝影棚保留在台中霧峰中

  台灣影視基地，今（14）日也舉辦開幕記者會，在片中飾演警察的李李仁透露在虛擬棚拍

  戲，就跟真的在高鐵上一樣有微晃感，且戲裡他還被宋芸樺上銬，砸到手都瘀青。


  李李仁繼《周處除三害》後在《96分鐘》中再度飾演警察，但他強調和以往形象相當不同

  。和高鐵車廂攝影棚朝夕相處的他，也大讚場景相當逼真，拍攝時車廂兩側有數百片LED

  螢幕，模擬導演洪子烜親自從台北搭到左營錄下的風景影片，片中隨著列車行進到何處，

  LED螢幕便會播出相對應地點的風景，讓李李仁直呼：「等戲時候看著窗外，就有種我要

  回家了的錯覺。」


  片中李李仁動作戲不少，導演大讚他的表現精準俐落，讓電影剪接起來相當流暢，其中有

  一場戲，對戲的宋芸樺很用力地將手銬硬銬在他手腕上10幾次，讓他手腕整個瘀青。演過

  多次警察，對上手銬動作已很熟練的李李仁儘管現場教導宋芸樺該怎麼銬，但因這顆鏡頭

  是連續動作很難借力，所以即使教了也沒用。李李仁也不住誇讚電影的美術組很強大，連

  炸裂物道具也製作得相當逼真，仿真程度讓李李仁大驚：「帶這出門會被管制吧！」


  《96分鐘》監製鄒介中曾任《痞子英雄首部曲：全面開戰》製片，他回憶當時從美國加州

  買了一台廢棄飛機回來，並請到好萊塢鉅片《全面啟動》的專業團隊來台打造全亞洲首座

  的飛機攝影棚，卻因為後續場地規劃和管理問題，不得不解體拆除。鄒介中見到後來《賽

  德克巴萊》《天橋上的魔術師》等作品都面臨相同狀況，令他更堅定保留車廂攝影棚的決

  心，這座得來不易的高鐵車廂，成為繼李安導演拍攝《少年Pi的奇幻漂流》後留下的造浪

  池攝影棚，第二個將在中台灣影視基地永久保留的智能攝影棚，目前已有新加坡、香港等

  劇組來詢問，希望未來可以為海內外的影視產業效力，並帶動台中當地觀光和經濟。


  --'
