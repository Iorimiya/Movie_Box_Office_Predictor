url: https://www.ptt.cc/bbs/movie/M.1750649582.A.847.html
title: '[新聞]台灣首部列車動作片《96分鐘》預告衝百萬'
content: '新聞網址：



  民視新聞網 / 台灣首部列車動作片《96分鐘》　預告衝破百萬、北影開幕場搶售一空



  台灣首部列車災難動作片《96分鐘》，從籌備到拍攝耗費9年之久。(圖／華影國際提供)


  歷時九年、耗資1.6億元打造，台灣首部列車災難動作片《96分鐘》，日前釋出首支正式

  預告後，在網路平台迅速掀起熱潮，幾天內便突破百萬次觀看，躍升今年度最受關注的國

  片之一。


  不少觀眾在社群留言表示：「台灣終於有不一樣的類型電影」、「今年就等這一部台灣製

  造的災難動作大片」、「預告看了整個熱血沸騰」。


  韓國藝人玉澤演也在林柏宏的社群帳號留言：「兄弟，預告看起來超讚！」意外引發跨國

  討論。




  作為本屆台北電影節的開幕片，《96分鐘》剛開賣即於一分鐘內售罄，搶票成功的影迷在

  社群上分享興奮心情，「看到結帳畫面轉圈那刻，心臟都快跳出來了！」


  也有不少網友發文求票「求一張北影開幕的票，我不在乎要坐在哪」。


  高討論度也讓《96分鐘》被視為今夏最受期待的國產電影之一。



  宋芸樺在電影《96分鐘》飾演女打仔，並表示該片是她演員生涯中角色情緒最緊繃的一次

  。(圖／華影國際提供)



  對於北影開幕場次迅速完售，演員團隊也表達感謝。林柏宏在片中演出拆彈專家，他表示

  ：「拍這部片身心靈都挑戰極限，但看到觀眾這麼支持覺得一切都值得。」


  飾演女打仔的宋芸樺則說：「《96分鐘》是我演員生涯中角色情緒最緊繃的一次。」


  李李仁也提到：「我們這部片真的每一秒都在倒數，聽到場次秒殺的瞬間我雞皮疙瘩。」


  監製鄒介中則表示，這部片歷經九年等待，不只是為了克服技術門檻，而是希望打造一部

  具國際水準、能代表台灣的災難動作作品。


  --'
