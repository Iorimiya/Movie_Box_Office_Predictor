url: https://www.ptt.cc/bbs/movie/M.1757331493.A.316.html
title: '[普雷] 如果你是96分鐘的導演你會怎麼拍'
content: '最近threads上好多人在討論96分鐘，看到大部份都是推薦也就自己跑去看了，果真看完

  之後覺得真的不錯看，以下有幾點我自己覺得很不錯跟值得更好的點分享一下





  以下心得有雷








  ———————————









  先說推薦的點


  1. 特效和場景調度比預期好很多，高鐵群體驚慌和局部失控的節奏，利用一些燈光 + 後

  製營造得蠻自然，沒有廉價感，場面情緒帶得住


  2. 對話和劇情細節寫得算貼地，我說的不是其他國片裡面出現國罵的那種貼地，是災難

  和危機發生的時候那種恐懼卻又帶著隱忍的互動，覺得這點在商業片裡比較少，好像獨立

  電影比較常出現這樣的情緒呈現手法


  3. 除了災難主題以外，劇情上還是有埋伏筆，這點我覺得不錯，為整部片增添了不少豐

  富度


  4. 整部片也圍繞主軸關於「人性抉擇」議題，我自己蠻喜歡這種題材，看完也在想自己

  若是宋康任會怎麼選？有沒有辦法毅然與生死拚一把？我想我是沒有那個勇氣的，恐怕在

  跳到另一台車的時候我就腿軟了


  那如果我是黃欣，我是否可以做到完全支持另一半的抉擇？我覺得我應該也是做不到，畢

  竟已經明知攸關生死風險，講真的我沒有辦法看著另一半衝向深淵還給予支持，我恐怕會

  把對方打暈帶下車


  而若我是李傑，我是不是也會一樣選擇隱瞞？真的在職場上拚了這麼些年，很多機會來之

  不易，我也曾經發生過工作疏失幾次，如果是有辦法圓過去的都會盡量補救，很難直接先

  對主管或客戶坦承



  再來不免還是有一些吐槽的點


  1. 首先覺得動作場面還是比預期少，朋友說像《狂徒》動作戲份就很多，這片反而集中

  在心理張力，但我也不是說他一定要像爽片那樣，只是原本預告看起來會比較多"動亂"、

  "動作"的戲份，但實際看起來反而真的是情緒層面帶得深一點


  2. 兇手安排有點明顯、少了反轉的感覺，這一點真的略感可惜，可能他是把反轉的點埋

  在動機的部份，我自我理解是導演更想聚焦主角心境，所以兇手方面就沒有做更多的安排

  ，不過結尾是有個回馬槍，應該算是補足這部分的劇情




  目前看完比較有印象的是上面這些，話說有看到threads上很些網友提到最後的反轉不夠

  震撼鋪陳有點長，我比較好奇如果大家是導演的話最後會怎麼安排？我自己是想到其實可

  以讓全車的人投票要救另外一台車或是自己這一台，讓人性的醜露面可以被放大，不然全

  部的壓力都讓男主角一個人扛比較難引起一般人的共鳴，畢竟大部分的人不是軍警消應該

  很難體會到他們的感受


  各位對結局的部分有沒有什麼好點子??


  --'
