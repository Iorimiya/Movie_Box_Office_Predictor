url: https://www.ptt.cc/bbs/movie/M.1758203076.A.9AF.html
title: 'Re: [普雷] 96分鐘結果不止96分鐘'
content: "我覺得第一點比較像是編劇沒講完整的問題，或許是考量台灣社會觀感或政治敏感等問題吧\n所以沒著墨太多...不然其實正常發揮這類劇本是會更好的打臉反派，像是N打臉夜神月那樣\n\
  或像鳴人嘴遁相信我會是比較完整的安排\n\n回來這部我覺得其實其中一個關鍵點是：局長\n\n他其實才是那個比較關鍵的點，但又變得有點功能性，然後什麼都沒講清楚就死了\n\
  如果能把這角色塑造的更立體，決策理由更清楚，不管要讓他作為鐵血長官堅持原則、或是小人心態只為升官發財\n應該都能讓劇情表現得更好，也不會讓觀眾只能一直看男主在那邊哭哭灑狗血\n\
  \n行李那邊就真的很讓人想吐槽：看不救\n叫好手好腳的幫忙推是不行是不是\n非得讓一個殘血的去推炸彈（還不需要他拆彈耶只要推到指定點）\n這邊我處理的話，大概會讓他在推炸彈途中碰上意外受傷，想找人也來不及的狀況吧\n\
  \n--\n 所以我自己覺得如果至少把局長形象塑造好，更能讓反派的復仇更具張力\n\n 打個比方，假設局長就是那種只為名利和升官發財、只想考績好的人，當年隧道選擇好救的、爆炸案\n\
  \ 選擇最不用扛責任的(實際給主角扛了)，於是這樣一路坐上高位，那他與反派間的善惡動機\n 就會變得更模糊且具張力，也可以讓他與主角互動中的衝突(道德訴求/不照SOP)更好發揮，後面利用\n\
  \ 主角未婚妻逼迫他剪電線這個爆點也會更具價值。\n\n但目前的劇本演出就是停留在一個比較曖昧不明的狀態，局長的形象不立體，也讓最後那個情勒\n秘密顯得只是多一個小爆點，但實際對觀眾看待警匪的道德善惡沒太大衝擊"
