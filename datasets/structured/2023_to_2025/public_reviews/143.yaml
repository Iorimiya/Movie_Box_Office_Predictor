title: '[好雷]96分鐘 幾個吐槽點'
content: '在吐槽別人之前先吐槽自己幾句順便防雷。

  我還真以為片長96分鐘，買票後才嚇一跳XD

  出來後先看了其他心得文，發現大家都知道演員名字，但我誰都不認得，真不好意思XD

  還有我也沒看過大家拿來比較的新幹線，我自己看的時候會喚起的是國片《查無此心》，

  就是一種國片的辦案氛圍（？）。還有劉德華的拆彈專家，因為要拆彈。

  我給好雷的理由跟別人其實差不多，能跳出框架，挑戰拍不同的片什麼的。也覺得拍攝手

  法、節奏什麼的有比以前的國片更好，但要實際說出好在哪，我還真沒那素養XD


  防雷結束，正文開始

  開場長官進事件現場的時候用走的、還有後面要去拆彈時主角還聽民眾陳情（？）讓我超

  想吐槽！給你再多講兩句！炸彈再5分鐘就要爆了！


  有看文章說兇手的動機不能太好，我覺得這部片有掌握在一個折衷點，能理解兇手的苦恨

  ，但是又顯得兇手在發神經。

  最後兇手也毫無悔意、愧疚、反省，甚至只求一死，就覺得超不爽的。

  以前看柯南作者訪談說都要讓兇手認錯，這下理解到這種橋段的必要性了。


  而要說主角方有什麼錯，首先長官當年救災時說話不夠委婉，沒留（推卸責任的）餘地，

  不過這也更顯示他負責的態度。

  不知是否升官後處世更加圓滑，長官搞了一堆掩蓋真相的手段。要不是長官將罪責推給前

  科犯，或許就能調查出當年救災時死者的家屬有何嫌疑。

  但也許就是當年不加修飾的言語令他吃了許多苦，因此壓迫他的媒體，乃至於整個社會，

  都可說是事件的推手！


  由於之前的文章對電車難題已經充分的討論過了，我來討論另一個題目：什麼情況下適合

  向民眾公布炸彈的存在？

  長官一開始用可能只是惡作劇訊息來拖延，而後的騷動讓炸彈的存在揭露。

  原先害怕的民眾隨著劇情推進，似乎接受了炸彈不是在自己搭的A車上，而是在先行的B車

  上，導致一陣「快停車讓我們下車，別再靠近B車」的騷亂。在拋出電車難題之後，民眾

  基本上都安分了。

  這段有被兇手推波助瀾，但是我感覺收得挺輕易的，還可以再鬧大一點，讓幾個刁民喊「

  就讓他們死啊！」之類的。這畢竟是部動作片，多點壓制刁民的場景不好嗎XD


  寫一寫發現公布炸彈信息這段奇怪的地方蠻多的，一開始主角們以為自己A車上有炸彈，

  後來在B車上找到之後，他們好像就沒去考慮自己車上有沒有炸彈了。

  民眾也一樣，好像都沒人討論到自己車上有炸彈的可能性。不過畢竟沒設備去照，讓沒受

  訓練的人去找炸彈也沒門，就只好接受這個安排了。有一種遊戲打不出好結局，只能打到

  一般結局的不爽快感。


  而身為民眾的協助者物理名師，先吐槽一下他夫妻倆比男主角夫妻的顏值還高得多XD

  他兒子成為罹難者，讓我想到以前的補習班老師，在喪子之後跟我們說他現在把我們當他

  的小孩。不知道電影這老師是不是這心態啦，但是你會讓你小孩進夜店喔XD

  後來男主角跳車的數學感覺好像沒經過他計算，可能是電影拍攝這種危險行為不能經過權

  威背書吧？


  啊跳出去失手那一下本來以為會轉鏡頭到女主他們臉上，結果意外的沒有XD 更厲害的是

  他們跑去看時表情都蠻鎮定的，我自己是覺得看到親人在高速行駛的列車上飛走，應該要

  更驚慌點。

  然後明明B車有按計劃開車門，啊怎麼沒人接應啦？明明就還有人員在車上啊。要是說原

  本計劃是全體疏散，單純用設定時間，沒有接應人員，那不就還好老師的老婆剛好在旁邊

  接到人XD


  老師的老婆，以下簡稱姊姊，跟她弟弟之間的關係挺微妙的。感覺姊姊夫妻倆是精英階層

  ，我腦補弟弟可能原本就有自卑感，也因此侄子…應該要叫外甥吧？總之出事後，他自責

  之下聽到另有可怪罪的人就整個被拐走了。

  我聯想到之前看過說教感很重的漫畫中，批評學運的本質是給那些不成熟的年輕人一個過

  度簡化的藉口。弟弟也像個不成熟的人一樣，完全被操弄了，甚至沒懷疑能夠得知「秘密

  」的共犯就是兇手，把他當作恩人。

  片尾的鏡頭昭示了主謀另有其人，那個嚇人鬼臉出自他的手筆。想想也對，片中的兇手哪

  有這種閒情去嚇人。這樣變成本片中的兇手至死都被利用，可悲的成分又更重了。而對主

  謀逍遙法外、計劃成功（股票畫面）更是又氣又恨！


  一開始我覺得男主怎麼演技那麼差，反轉了之後才明白那時的情緒是有來由的。但是這樣

  安排讓我先入為主覺得男主演技不好，很多地方都讓我想挑刺。

  即使在片中反轉的當下也沒反應過來，是出影廳之後看心得文，才慢慢把他合理化。

  另一個反轉則是讓兇手有點可悲，還得自演XD可能他原本以為手機響起就會有人去找來接

  ，但是響半天沒人接才自己演這齣XD


  --

  啊忘了吐特效。主角被捲入爆炸那一幕貼圖感蠻重的，但是百貨爆掉跟列車炸掉在夜晚留

  一條火龍的畫面就不錯。要是把主角爆炸的鏡頭換成空拍列車爆炸，會加分很多。

  姊姊被審問那時我還不理解發生了什麼事，不是便當了嗎？所以是那個路人就剛好包包還

  是鑰匙圈跟姊姊的一樣喔？

  記得那個鑰匙圈也被特寫過很多次，但是就看不出有什麼連結。

  有印象那個婆婆倒了，不知道是什麼狀況小朋友又落單'
