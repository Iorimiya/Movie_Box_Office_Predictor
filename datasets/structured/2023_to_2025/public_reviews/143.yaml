url: https://www.ptt.cc/bbs/movie/M.1757334946.A.2B1.html
title: '[新聞] 「96分鐘」笑納1800萬！高鐵生死存亡太'
content: "新聞網址：\n\n \n\n\n\n  「96分鐘」笑納1800萬！高鐵生死存亡太刺激「炸出好口碑」\n2025-09-08 17:21\n聯合報\
  \ 記者陳穎／即時報導\n\n李李仁(左)和林柏宏在「96分鐘」一起面對炸彈危機。圖／華影國際提供\n李李仁(左)和林柏宏在「96分鐘」一起面對炸彈危機。圖／華影國際提供\n\
  整理包／江祖平控三立高層兒性侵 雙方說法、觀點分析一次看\n電影「96分鐘」由林柏宏、宋芸樺、王柏傑、李李仁、姚以緹、蔡凡熙、李銘忠領銜主演\n，上映首周票房突破1800萬，登上台北新片票房冠軍，社群口碑炸裂。觀眾大讚電影兼具\n\
  國際級質感與情感張力，直呼「一定要帶夠衛生紙進戲院！」主演林柏宏、宋芸樺、李李\n仁、蔡凡熙勤跑映後宣傳，場場人潮爆滿。\n\n\n「96分鐘」於上周五正式上映，首周末即開出破1800萬的票房佳績，登上台北新片票房冠\n\
  軍，LINE TODAY電影聲量榜更是衝冠，引發社群平台熱烈討論。觀眾紛紛讚賞「96分鐘」\n不僅展現台灣本土故事，也具有國際級的電影質感，緊張劇情與情感張力兼具，許多影迷\n\
  觀影過程中完全忘記吃爆米花，被電影的緊湊節奏與情感張力深深吸引，而結局更是催淚\n動人，觀影後都趕緊發文建議：「一定要帶夠衛生紙進戲院！」\n\n\n主演林柏宏、宋芸樺、李李仁、蔡凡熙分組勤跑映後宣傳，走遍台北、台中、高雄各大影\n\
  城，與觀眾進行近距離互動，引爆影廳內滿滿人潮，現場氣氛熱烈，電影方也搶先預告本\n週末將會繼續在全台戲院與觀眾見面。「96分鐘」今天更釋出電影幕後花絮挑戰篇。\n\
  \n\n林柏宏回憶：「當初看到劇本就覺得這是非常難得的題材，拍攝過程像經歷了一場生死存\n亡的挑戰。」宋芸樺則表示：「『96分鐘』不只是單純的動作片，背後還有很多情感層次\n\
  ，拍攝時我們每個人都帶著真實的恐懼和情感走進角色。」李李仁直言這是一次「極限挑\n戰」：「每天都在極度逼真的場景裡拍攝，對演員的體力、情緒掌控都是非常大的考驗。\n\
  」每次都要花上四小時畫特殊傷妝的蔡凡熙則坦言：「起初不知道怎麼詮釋這角色有點害\n怕，但是被大量動作戲吸引，決定要好好挑戰自己。」\n\n\n除了主演群全神貫注投入，「96分鐘」車廂內的乘客也全是戲劇專業演員，他們在開拍前\n\
  集體接受表演課程訓練，由擔任本片表演指導、同時飾演列車長的陳雪甄親自帶領。陳雪\n甄表示：「這些演員都身懷絕技，可以快速接受表演的指令，讓觀眾更加身歷其境。」電\n\
  影「96分鐘」在台上映中。\n\n\n  \n\n\n\n\n\n\n  ---------------------------------------\n\n\
