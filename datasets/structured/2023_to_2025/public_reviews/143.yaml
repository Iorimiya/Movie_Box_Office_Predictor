url: https://www.ptt.cc/bbs/movie/M.1757922465.A.4DD.html
title: '[負雷] 一整個尷尬的“96分鐘”。'
content: '來支持國片了。


  但我覺得大家真的很誇張，把這部片也講得太好了（竟然還有人說要二刷？？）我看完真

  的只有一整個尷尬。


  劇情有太多的不合理；對白膚淺；特效也粗糙又便宜行事。幾個該完整拍出來的大場面結

  果只是簡單帶過（例如一開始百貨公司的大爆炸）。如果是因為經費不夠那還可以理解，

  但如果是故意要這樣拍的那就是導演說故事的功力不行，還要再多加油。


  結果整部電影拍得最好的只有在暴雨中飛馳的高鐵畫面，還有比畫面和劇情還緊張的配樂

  ，其他真的就乏善可陳了。給不及格太殘忍了，但最多就六十分吧，我沒辦法給再高了。


  我覺得要拍這種動作片，台灣，真的還要再多加油啦。


  --'
