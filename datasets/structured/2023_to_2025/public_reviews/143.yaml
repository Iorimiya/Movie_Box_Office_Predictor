title: '[新聞] 《96分鐘》將破億 宣布進軍海外'
content: '新聞原標：

  《96分鐘》賣破9600萬將成今年第二部破億台片！宣布進軍海外



  電影《96分鐘》上映第三周票房持續攀升，至今累積突破，距離破億近在咫尺，將

  成為。


  本片在第三周票房，單周票房表現甚至超越前兩周。除了在台灣掀起熱潮，電影

  方今日正式宣布海外上映計畫，將於9月25日登陸新加坡、10月2日、10月30日

  ，並於12月底在盛大上映。



  由金曲才子黃奇斌創作演唱的主題曲〈若無你我欲去佗位〉，也掀起熱潮，

  ，電影片花版也在短短兩天逼近百萬次觀看。該曲誕生於他參與《96分鐘》演

  出時的真切感動，在拍攝現場的氛圍令他深受觸動，當下便主動向監製鄒介中表達：「我

  要做這部片的主題曲！」並將自己代入林柏宏與宋芸樺在角色情境，成功打造出靈魂之作

  。

  —————————————————————

  96分鐘很厲害的是連三週末票房幾乎沒什麼跌的成績，甚至第二週漲很多。



  96分鐘 1546.0萬，累計: 1792.2萬


  96分鐘 2521.8萬，累計: 5691.1萬（當週末票房冠軍）


  96分鐘 2475.3萬，累計: 9664.2萬（當週末票房冠軍）



  目前今年台灣電影前三

  NO.1 角頭－鬥陣欸 1億8000萬左右（可能會破2億）

  NO.2 96分鐘 9700萬左右（即將破1億）

  NO.3 有病才會喜歡你 6200萬左右


  --'
