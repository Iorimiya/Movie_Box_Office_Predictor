title: 'Re: [負雷] 一整個尷尬的“96分鐘”。'
content: '有

  為

  句

  方

  能

  作

  情


  記得好像有人說過

  台灣電影的台詞

  基本上就是『寫小說』的本


  用小說的觀點

  去看電影那些尬到不行的台詞

  一瞬間全部說得通了！



  這也是沒有好的文案、編劇造成的結果

  因為一開始就是用小說思維去拍電影

  所以才會處處都是滿滿『文藝』風


  看之前台灣+9片

  還在探討人生意義的哲學問題


  我就覺得神經病



  而那些文青寫出來的對白

  就是因為他們急著求『有深度』的對白


  最好是一個台詞

  能夠讓觀眾記一輩子


  把王家衛當成偶像之類的


  明明是最緊張刺激的時候

  就一定要有一句讓人拍案叫絕的台詞

  也不管符合顯示與否，放進去就對了


  運氣好中了

  我的編劇能力被欣賞，下場戲工作穩了


  沒中，太尬

  導演問題，跟我沒關係

  我繼續寫小說即可




  所以台灣電影往往跟現實脫節

  每個人看一遍尬一遍。


  --'
