url: https://www.ptt.cc/bbs/movie/M.1758273016.A.3E8.html
title: '[好雷] 96分鐘'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~





  若說《痞子英雄：全面開戰》把台灣的動作片推到高點（雖然那之後好像就沒有了？）

  那麼《96分鐘》便可視為災難題材的一個里程碑。


  對我來說缺點比預期的少，就只是爆破場面稍顯保守，

  不過即便如此這部片仍成功展現出台灣開始有能力處理大型災難場景，開啟了更多元的可能性。


  比較喜歡的點：主角並沒有被塑造成超人般的存在，反而更貼近現實，個人頗為欣賞。劇

  情後段雖然帶有明顯的煽情意圖，使走向稍嫌侷限，但尾處理得還算完整，大部分角色都有合理交代，避免了「角色消失」的問題。



  比較可惜的點：兇手的設定理應是觀眾期待的一大看點。但在呈現方式上，導演選擇了相對直白的揭露，懸疑感不足。

  只要稍微有帶腦看的話，觀眾幾乎不用費心推敲就能猜出來，這也大大削弱了驚喜度。



  總之，於我而言，《96分鐘》雖有一些小缺憾，但作為台灣第一部災難動作片，它展現出的格局與野心還是挺值得肯定。

  緊湊的節奏、演員的亮眼表現，再加上在有限資源下也努力突破的技術呈現，都讓它成為一部值得推薦的作品。


  --'
