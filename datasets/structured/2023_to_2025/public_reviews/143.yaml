url: https://www.ptt.cc/bbs/movie/M.1711627860.A.49D.html
title: '[新聞] 王柏傑 林柏宏合體動作片「96分鐘」 高鐵'
content: '新聞原標：王柏傑、林柏宏合體動作片「96分鐘」 極速高鐵遇炸彈


  新聞網址：




  王柏傑、林柏宏合體拍攝動作片「96分鐘」，故事是他們在極速的高鐵行駛下遇上炸彈危

  機，王柏傑也表示，「期待了很久，終於要開拍，並希望一切順利！」


  「96分鐘」是來自台北至高雄最快的一班直達車行駛時間，劇情融合了親情、愛情等多重

  元素，耗時8年的籌備與策劃，這部由「粽邪」系列電影監製鄒介中與「狂徒」新銳導演

  洪子烜攜手合作的動作大片即將於近日展開拍攝。


  電影引進好萊塢「曼達洛人」、「阿凡達2」特效團隊開發的『特效預演拍攝（Previs）

  』技術項目，並結合虛幻引擎（Unreal Engine）捕捉演員的表演互動。導演洪子烜認為

  ，在動作電影上演員的表演非常困難，而首次參與Previs預演能夠使劇組人員清楚導演想

  要的最終呈現，也實現拍攝時間控制及預算上的管理問題。擔任「96分鐘」男主角的林柏

  宏表示，這是他第一次嘗試的電影類型，是非常巨大的挑戰，很興奮也很期待！


  另外，監製鄒介中也提到，近年許多影視作品搭建的拍攝場景都因種種因素沒能留下重複

  使用，造成產業與資源的浪費。因此這次希望能將高鐵車廂在拍攝後保留，以供未來本土

  及海外劇組在中台灣影視基地內進行拍攝使用，使台灣民眾熟悉的交通工具，能以不同形

  式帶動另類產業鏈，同時拓展觀光資源。「96分鐘」預計2025年上映


  —————————————————————

  終於要開拍，從疫情就聽到現在，期待狂徒導演新作品，國片少數中很有拍動作片潛力的

  導演。


  前導花絮



  --'
