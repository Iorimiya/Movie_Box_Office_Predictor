content: "台灣影史首部！《96分鐘》挑戰高鐵災難動作片\n\n2024/06/03 14:44\n\n\n李李仁（左）、李銘忠加入《96分鐘》演出。（華影提供）\n\
  \n〔記者鍾志均／台北報導〕台片《96分鐘》以高鐵炸彈危機為背景，日前在台北信義區百\n貨商圈封街拍攝，短短500公尺內，包括醫護人員、警察、記者、義消背景人員、防爆小\n\
  組人員等人，動員人數高達近500人，場面浩大。\n\n該片由《粽邪》系列電影監製鄒介中以及《狂徒》導演洪子烜執導，於中台灣影視基地搭\n建全台首座智能LED攝影棚，更成功引進好萊塢的Previs預演技術，開拍前即釋出超前導\n\
  花絮，曝光AI換臉的林柏宏角色，話題十足。\n\n\n《96分鐘》日前在台北信義區百貨商圈封街拍攝。（華影提供）\n\n《96分鐘》集結林柏宏、王柏傑、蔡凡熙、巫建和、孔令元共演，眾人搭上《96分鐘》高\n\
  鐵疾速列車，另外也有李李仁、李銘忠等卡司，挑戰台灣史上第一部高鐵災難動作片。\n\n劇情融合親情、愛情元素，刻畫在生死存亡時刻，人性的掙扎與抉擇，預計2025年上映。\n\
  \n\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
