title: '[討論] 為什麼《96分鐘》在新馬港澳票房不好?'
content: '《96分鐘》辦了破2億記者會

  但是新馬港澳在上月底之前也已經上映了

  卻完全沒有水花


  問AI回答我說


  未查到／績效資訊沒有公佈海外各市場（新加坡、馬來西亞、香港等）具體票房數字。

  有報導指出：在新加坡首週「僅排當週第8名」，次週第9名後即從排行榜消失。

  在馬來西亞尚未進入當地票房排行榜。

  沒有資料顯示已在中國大陸市場上映／有票房。


  那ㄟ阿捏??

  台灣電影在這個地方完全沒有票房號召力了嗎?

  我知道香港電影倒是在新馬還有不錯票房

  接下來越南票房恐怕也不樂觀吧

  這樣還有機會去日韓中三國上映嗎?

  海外票房不好也會影響賣給網飛的價格吧


  --'
