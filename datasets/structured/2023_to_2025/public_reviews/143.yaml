url: https://www.ptt.cc/bbs/movie/M.1762703315.A.1F3.html
title: '[新聞] 《96分鐘》票房破2億 林柏宏揪王柏傑上班'
content: "《96分鐘》票房破2億 林柏宏揪王柏傑上班\n\n04:10 2025/11/09 中國時報 杜欣穎\n\n\n《96分鐘》累計票房突破2億元，導演洪子烜（左起）、主演孔令元、呂雪鳳、林柏宏、\n\
  宋芸樺、王柏傑、姚以緹、蔡凡熙以及監製鄒介中8日出席謝票記者會。\n（華影國際提供）\n\n台灣影史首部以高鐵為題材的災難動作鉅作《96分鐘》突破2億票房，主演群林柏宏、王\n\
  柏傑、宋芸樺等人8日齊謝票，這是林柏宏、王柏傑「雙柏」首度公開合體。\n\n先前在澎湖拍戲的王柏傑透露，林柏宏一直說他不工作，甚至還傳訊息給他：「該來上班\n\
  囉！」收到訊息後他便趕緊加入映後活動，沒想到看到廳內滿滿的觀眾，深受感動。\n\n林柏宏也打趣回應：「謝謝柏傑的加入，幫我們衝起破2億的票房。」兩人一來一往，默\n\
  契互動笑翻全場。特地從美國回來快閃工作、謝票的宋芸樺，表示身邊有許多朋友們都正\n在敲碗上映，期待《96分鐘》列車可以一路開到歐美，王柏傑也接力許願：「期待監製帶\n\
  我們去LA找宋芸樺。」\n\n《96分鐘》強勢入圍今年金馬獎5項技術獎項，蔡凡熙更自信回應：「他們有入圍，代表\n我們執行得很好。」監製鄒介中難掩激動地表示：「拍攝過程非常艱辛，從災難場面的設\n\
  計到角色情感的拿捏，每個細節都傾注了團隊的心血。能被觀眾看到、感受到，是我們最\n大的榮幸。」他透露，《96分鐘》後續仍有多項海外洽談計畫正在進行，希望讓更多國際\n\
  觀眾看到台灣團隊的製作實力。\n\n#工作 #謝票 #監製 #災難 #透露\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛   \
  \     是 菩薩\n\n\n\n--"
