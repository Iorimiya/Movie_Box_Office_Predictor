url: https://www.ptt.cc/bbs/movie/M.1755764341.A.46C.html
title: '[新聞] 台首部高鐵災難片《96分鐘》林柏宏挑大梁'
content: "台首部高鐵災難片《96分鐘》林柏宏挑大梁動作戲\n\n2025年8月20日，電影《96分鐘》舉辦試片記者會，主演李李仁、林柏宏、宋芸樺出席。\n\
  （大紀元）\n\n【新唐人亞太台 2025 年 08 月 21 日訊】模擬高鐵列車遭炸彈攻擊，台灣電影團隊，引\n進好萊塢團隊的預演拍攝特效技術，打造災難動作片《96分鐘》。拍攝過程，打造了台灣\n\
  影史上最大，匯聚700片LED的虛擬棚，高鐵智慧攝影棚，1比1模擬車廂直接拍攝。曾獲金\n馬獎最佳男配角的林柏宏，飾演拆彈專家，在片中挑大樑，擔綱高難度的動作戲。\n\
  \n\n\n高鐵列車有炸彈，看起來好緊張。斥資1.6億新台幣，台灣第一部，高鐵災難動作片《96\n分鐘》，20日週三，卡司未演先轟動，匯聚台灣金馬男配林柏宏、剛在紐約亞洲電影節奪\n\
  得演員獎的宋芸樺，還有北影、金鐘男配李李仁，呈現高鐵上的安全危機。\n\n演員 林柏宏：「幾乎每一個鏡頭，都拍了10幾個Take。大家有看到一場很長、很長的，\n\
  一鏡到底的動作戲嘛，然後這個角色在這《96分鐘》裡面，心理上越來越痛苦，然後生理\n上也越來越慘。」\n\n林柏宏第一次有這麼長的動作訓練。林柏宏片中飾演拆彈專家，李李仁飾演林柏宏的銀幕\n\
  上司，而宋芸樺出演林柏宏的銀幕刑警妻子，大量高張力情感演出 ，還有一場跟李李仁\n，在狹窄車廂的動作戲，展現俐落身手。\n\n演員 宋芸樺：「殺青也一段時間了，所以最近坐高鐵的時候，是有一點點想念，那時候\n\
  拍戲的感覺。」\n\n演員 李李仁：「去北海道，去打了3天的那個火車的司機電動，就看到就很想玩，然後就\n回想拍，高鐵這一段時間。」\n\n\n2025年8月20日，電影《96分鐘》舉辦試片記者會，監製鄒介中（右）、導演洪子烜（左\n\
  ）率領主演林柏宏（中）、宋芸樺（右2）、李李仁出席。（大紀元）\n\n台灣電影《96分鐘》，故事展開在，退居幕後的拆彈專家林柏宏，與妻子宋芸樺，搭上台\n北直達高雄的高鐵列車，毫不知情的返鄉乘客，全被捲入這場，突如其來的死亡危機。\n\
  \n《96分鐘》電影監製 鄒介中：「找了好萊塢的一個來做，我們的藝術總監、特效總監，\n溫大（溫兆銘）他就是之前，在星際大戰、阿凡達2特效公司，我們特地請他回來。」\n\
  \n特效技術直接到達，好萊塢等級。台北電影節今（2025）年開幕片《96分鐘》，就要在9\n月5日震撼上映。\n\n新唐人亞太電視 胡宗翰 甯郁翔 台北採訪報導\n\
  \n\n\n--\n                 \n   \n\n\n\n--"
