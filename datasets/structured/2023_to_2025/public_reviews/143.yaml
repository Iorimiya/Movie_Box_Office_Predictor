url: https://www.ptt.cc/bbs/movie/M.1757076211.A.F57.html
title: '[好無雷] 96分鐘    有誠意的國片'
content: '今天上映就跑去看了


  主要是國片這種題材的很少


  整部片場景都是在車上


  尤其裡面有一鏡到底的打戲 真的讓人驚艷


  如果說跟前陣子日本新幹線電影比較


  我覺得一樣都是放炸彈在列車上


  但兩部的敘述跟編排 完全不一樣


  甚至真兇我認為96分鐘比較讓我信服


  新幹線我看完後還是覺得真兇很牽強


  至於特效方面


  還是沒有到很好  但畢竟國片難得有突破


  還是感受到誠意


  這部片也不是災難片


  特效也不是重點


  而是在這段時間的緊繃感


  這部片的確有讓觀眾感受到了


  當然將近兩個小時片長


  還是有幾個時刻會讓人不小心放空跟分心


  但也是瑕不掩瑜了


  平常看電影的我  國片跟外國片大概1:3


  有認真拍的國片我是都會進場支持


  這種國片才有資格領補助 拍更好的電影


  而不是騙補助的爛片




  放上今日的票根




  題外話  主角在列車上 保護各位


  還以為無限列車重映了


  大哥沒有輸xdddd



  -----

  Sent from JPTT on my Samsung SM-N770F.


  --'
