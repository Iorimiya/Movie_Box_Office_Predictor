url: https://www.ptt.cc/bbs/movie/M.1758983899.A.3F2.html
title: '[好無雷] 96分鐘 瑕不掩瑜'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  看了一些網友的評價，原本以為和痞子英雄程度差不多


  但沒想到比想像中的更好看







  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  先說缺點


  1.中前期的敘事手法有些混亂


  因為劇情包含了懸疑和倒敘的成份，加上又有蒙太奇的鏡頭


  中前期的敘事確實會讓觀眾有些混亂，但這種情況到中期劇情明朗後就沒有了


  這部份我認為是這部電影最大的問題，也是導演未來可以改善的地方



  2.時間流逝的不合理


  中後期在時間流逝上有不合理之處，大概就是明明說好10分鍾


  但觀眾就是覺得已經過了半小時，


  只能說是為了劇情和氣氛需要，就看觀眾能不能接受這點。


  3.場景簡單


  除了前期有電影院和市區外，中後期的場景幾乎都是在車箱攝影棚內，


  不過這部片的故事本來就是在車箱內，所以也不是問題


  有人提到特效太假，只能說大家胃口都被好萊屋養壞了


  成本1.6億 NTD的特效就是這樣的程度



  再說優點


  1.劇情懸疑


  因為沒看過預告，原本以為劇情就是單純的災難片，類似「十萬火急」或「屍速列車」


  單純描寫災難時的人性


  但沒想到是像柯南一樣要和兇手鬥智鬥勇，外加接露隠藏的真相


  使整部劇情內容飽滿十足



  2.節奏緊湊


  有網友說中前期節奏緩慢，但我不這麼覺得，整部片從開頭就是讓人秉住呼吸的爆炸案，


  如果真的要說比較放鬆的部份，大概只有上車後的20分鐘，接下來氣氛就開始緊張了。



  3.打戲水準


  其實海報上是寫動作片，但真的動作部份其實沒有很多


  然而唯一的打戲部份水準是夠的，並沒有草率带過去。


  這個導演之前也拍過另部動作國片「狂徒」，所以在這部份還是有用心



  4.電車難題


  這部片除了災難時人性外，更著重在電車難題


  當你面對一定有人要犧牲時，該怎麼選擇


  5.在地國片


  這部片場景是大家都熟悉的高鐵


  （雖然是特製的車箱攝影棚，非真實高鐵車箱）


  裡面的站名和地名也都是大家所熟悉


  印象中好像也有出現幾句台語(不確定)


  讓台灣觀眾在看片時更有真實感




  台灣在疫情後，電影產量真的有變少


  難得出現這部成本較大，值得進電影院的好片


  還是希望大家可以支持一下。







