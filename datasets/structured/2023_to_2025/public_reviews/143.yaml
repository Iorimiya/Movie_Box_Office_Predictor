url: https://www.ptt.cc/bbs/movie/M.1757089188.A.B24.html
title: '[ 好雷] 96分鐘 滿滿誠意的國片'
content: '第一次在movie版發文


  身為不可能的任務系列的影迷，難得看到國片拍出新高度，真的很感動

  雖然MI系列還是錢砸的多也更精緻

  （剛看了電影專訪 這部片的音效公司真的有合作過不可能的任務、玩命關頭

  難怪很有feel



  *看這部記得晚一點走 有彩蛋



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  認真建議想提升刺激感 可以選信義威秀看這部

  當中蠻主軸的一部分是在信義威秀拍攝的 可以提升觀影體驗


  會在開頭提到MI 主要是當中敘事手法、愛情親情友情交流點到為止的部分

  真的蠻偏美式的 也運用空拍機拍攝提升刺激感

  也有一小部分的武打戲

  整體表現手法、鏡頭語言都有提升一個檔次的感覺


  但又不同於英雄式電影

  這部收尾的方式恰到好處 餘韻猶存

  不會有特別形塑英雄 讓光環與希望集中在特定的人身上

  畢竟一切並不會隨電影的結束 而到此為止


  總之是部值得花錢進場的國片

  今晚首映我那一廳滿座率不到一半QQ

  希望之後票房可以起來



  --'
