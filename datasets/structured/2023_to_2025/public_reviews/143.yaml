  不然是偏負的

  百貨爆炸那段拍的不錯

  爆炸動畫、信義區陷入火海

  這裡的表現很有感覺

  列車動畫就算了

  劇情雖然有前後呼應還不錯

  但犯人手法也許有參考柯南的引爆摩天樓XD

  .

  中間的演出太偏向推理和拆彈

  還是炸彈能正常拆掉沒有問題的那種

  一整個少了些緊張感

  就算有時會跳出倒數數字

  看到也只是…喔 時間更少了

  物理老師算數學…好吧 反正只是要說他頭腦好

  最後還留伏筆 但也不一定會拍續集吧

  建議能去信義威秀看這部

  一開始就很有臨場感～



  -----

  Sent from JPTT on my iPhone


