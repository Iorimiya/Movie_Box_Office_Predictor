url: https://www.ptt.cc/bbs/movie/M.1756795222.A.1C0.html
title: '[新聞] 林柏宏、宋芸樺宣傳《96分鐘》 現身台灣北'
content: "林柏宏、宋芸樺宣傳《96分鐘》 現身台灣北中南鬧區\n\n\n林柏宏、宋芸樺為宣傳《96分鐘》，來到高雄駁二掃街造勢。（華影國際提供）\n\n\
  【大紀元2025年09月01日訊】（大紀元記者馬維芬報導）台灣首部以高鐵為題材的災難動\n作片《96分鐘》將於9月5日全台上映，片中夫妻檔林柏宏、宋芸樺上週末（30日）舉辦戲\n\
  院七夕特別場、見面會，更現身台灣北中南鬧區，所到之處都引來尖叫聲。\n\n在戲院舉辦的特別場中，兩人和幸運觀眾大玩情話環節，還貼心逐一合照，陪上千名影迷\n度過專屬情人節。趁著週末假日，林柏宏、宋芸樺在高雄、台中舉辦見面活動，和搶先看\n\
  過電影的觀眾挑戰計時遊戲，兩人鬥嘴互動讓全場笑聲不斷，現場秒變大型同樂會。\n\n\n林柏宏、宋芸樺為宣傳《96分鐘》，上週末出席北中南四場七夕特別場，與上千名影迷共\n\
  度情人節。（華影國際提供）\n\n除了影廳與見面會，林柏宏、宋芸樺更把宣傳搬到街頭，驚喜現身台北信義區、高雄駁二\n與台中逢甲夜市，所到之處引來民眾熱情尖叫聲。\n\
  \n\n林柏宏、宋芸樺為宣傳《96分鐘》，驚喜現身台北街頭。（華影國際提供）\n\n\n林柏宏、宋芸樺為宣傳《96分鐘》，突擊台北信義鬧區引起全場騷動。（華影國際提供）\n\
  \n隨著電影上映日倒數， 電影《96分鐘》話題熱度持續升溫，林柏宏與宋芸樺也誠摯邀請\n大家，把這份熱情帶進戲院，一起體驗這場「96分鐘的心跳冒險」，感受災難背後的真情\n\
  與勇氣。\n\n責任編輯：蘇漾\n\n\n\n--\n                 \n   \n\n\n\n--"
