url: https://www.ptt.cc/bbs/movie/M.1757692402.A.1DA.html
title: '[新聞] 從分鏡模擬到精準拍攝 《96分鐘》引進好'
content: '新聞網址：


  從分鏡模擬到精準拍攝 《96分鐘》引進好萊塢技術革新片場


  電影《96分鐘》引進好萊塢特效預演、虛幻引擎技術，台灣電影製作也邁入精密化時代。

  2025/9/8

  文：王心妤／攝影：翁睿坤／圖片提供：華影國際


  9月甫上院線的《96分鐘》，打著台灣影史首部高鐵災難動作片的Slogan，引起

  不少影迷關注，當影片中民眾熟悉的高鐵身影從台北站出發，心情也跟著倒數計時，炸彈

  何時引爆，該選擇多數還是少數的掙扎，觀眾的內心也像林柏宏飾演的拆彈警察一般，心

  中的天秤七上八下。


  然而觀眾體感上的96分鐘，是整個劇組花費近10年籌備劇本、4年設計動作，甚至引進好

  萊塢技術，並蓋出高鐵車廂打造的心血。


  監製鄒介中是台灣知名恐怖《粽邪》系列的監製，他苦笑說：「這部片的成本，大概粽邪

  1、2、3加起來都不夠，常常睡到一半就醒來，睡得最好的一個星期大概是疫情期間，請

  製片算完每天要空燒多少錢後，覺得反正也無法拍的時候吧！」


  導演洪子烜則是台灣擅長拍攝動作片的中生代導演，從讓林哲熹跟吳慷仁大打出手的《狂

  徒》到女子拳擊為主題的《倒數回擊》，這次規模更大，換挑戰拍出高鐵速度感、拆彈刺

  激感還有車廂打鬥的窒息感，整部片籌備期長。


  但洪子烜跟團隊引進好萊塢Previs技術，從打鬥、群眾跳車等都在前期設計走位跟動作，

  讓拍攝期縮短到僅有55天，更包含2個星期的信義區封街拍攝。


  復刻高鐵車廂 新加坡也心動

  為了拍片，《96分鐘》蓋了節高鐵車廂，現在仍被保留在中台灣影視基地的C棚，逼真到

  宛如真正的高鐵，新加坡文策院去年也曾來參觀並表達想使用來拍片的想法。


  不過，劇組的忙碌從造高鐵前就開始。


  Previs（Previsualization、特效預演拍攝）是由好萊塢「曼達洛人」、「阿凡達2」特

  效團隊開發的技術，結合虛幻引擎（Unreal Engine）捕捉演員的表演互動。


  洪子烜解釋，車廂內空間有限，不只要讓演員移動，光是一台攝影機要移動，還得要有幾

  個攝影助理跟著位移，遑論收音師、燈光師等，甚至是其餘器材的擺放位置，這些問題使

  用Previs系統時都能迎刃而解，「此次有通常打戲、災難戲在真正開拍時都會延遲最久，

  但前期先走過後，就可以讓我們拍攝時間更精準。」


  洪子烜表示，片中有5個場次使用Previs，包含打戲、跳車戲、民眾逃難戲，手繪完分鏡

  後，再請動作人員做動作捕捉，接著把人物放進程式模擬的車廂裡，所有工作人員都能直

  接看到電影會呈現的樣子，美術組回推車廂怎麼設計和哪些部分需要拆解、動作指導理解

  空間大小並設計出適合的打鬥動作、攝影組能直接看見畫面成果，各個組別再來溝通。


  「像是車廂側面的窗戶可拆解，又或是部分車廂天花板能夠拉開空拍，而車廂連接處也能

  再開一扇門，讓攝影團隊有更多空間能移動。我們不需要讓車廂每個地方都可以拆開，也

  可以先想好攝影機要放哪裡，大家都知道自己要做什麼。」


  Previs預先模擬 鏡位更到位

  洪子烜表示，像是一場有數十名觀眾擠出車門口跳下月台的戲，除了演員都是有經驗的舞

  台劇演員，劇組事先也使用Previs模擬群眾逃難的狀況，走位、鏡位都能夠事先規劃好。


  林柏宏片中飾演防爆小組的拆彈專家，他在片中有場跟蔡凡熙的打鬥戲，兩人從走道打到

  車廂連接處。洪子烜透露，這場戲也是先請動作指導設計動作，接著以Previs模擬2人的

  打鬥動作，「演員練得越習慣越不會受傷，很多細節沒有處理好就無法讓演員安心，他們

  才能習慣這些動作，甚至變成反射性動作，知道自己下一秒要幹嘛，要做到這個程度我們

  才可以拍，不然大家在擔心跟害怕時，是拍不了東西的。」他舉例，像是林柏宏要翻過座

  椅的動作，就完全不靠外力，讓他對片場安心，能放心做出大動作。


  雖然好萊塢已經有大量使用Previs的經驗，不過放到台灣卻是新挑戰。洪子烜指出，像在

  列車長室的戲，美術組規劃的空間放到系統才發現若擺上攝影機會難以移動，但觀眾從畫

  面看起來，列車長是已經大到可能會出戲，這部分就可以讓美術組先規劃車廂哪個部分可

  拆開並擺放攝影機，「雖然國外有自己的程式，但我們在台灣是找了幾間特效公司合作，

  中間發生許多技術困難，但我認為最寶貴的就是這些。」


  洪子烜強調，「因為大家都經歷過從沒做過的事，我們不只要記得他們的經驗，還要想辦

  法克服，做成我們能使用的，這過程就會學到很多東西。」


  信義區封街炸大樓 特效更逼真

  《96分鐘》除了技術跨出一大步，拍攝上也邀請防暴小組、消防隊等專業團隊教授演員真

  實技能，並在台北市最繁華的信義區封街拍攝。


  談起片中讓信義區大樓爆炸並由空中俯瞰大樓燃燒的畫面，鄒介中自豪的表示，不只爆破

  戲是特效，整棟大樓也是靠特效憑空造起。


  《96分鐘》特效總監溫兆銘曾在好萊塢工作，並參與《星際異攻隊》、《水行俠》、《復

  仇者聯盟3：無限之戰》等大片的製作。洪子烜表示，跟溫兆銘合作過程很明顯感覺到對

  方曾在好萊塢工作的經驗值高，像是在美學判斷上，很快就能找到契合《96分鐘》的特效

  ，「特效不只有真假的問題，還有畫風要考慮。如何讓特效鏡頭跟寫實鏡頭完全契合，甚

  至有加分效果，這件事滿重要的！」


  洪子烜舉例，溫兆銘曾說過擅長動態爆破、激烈碰撞的特效鏡頭，這部分在《96分鐘》就

  能有大量的運用，「有時候特效多一分就會太浮誇、太有『漫畫感』，少一分又稍嫌不夠

  ，這東西就很考驗特效總監的美學。」


  海外影展試水溫 老外都驚訝

  前陣子，《96分鐘》跑了多個海外影展，鄒介中說，「其實國外的影人看了都很驚訝，原

  來台灣也可以拍這類型的片子，甚至都覺得很不像台灣的電影，因為跟他們既有的認知的

  台灣電影都不同。」


  1981年上映的《火車進站》常被誤認成人類史上首部電影，雖非首部仍不可否認是開創電

  影的代表作，洪子烜談起這部片難掩期待的說：「希望大家以後討論到列車動作電影時，

  至少也能說我們有一部這樣的電影，我們有個《96分鐘》可以跟大家討論，不管你比較喜

  歡好萊塢、韓國、日本的都好，可以各有所好，但我們也有個作品，是可以跟大家一起討

  論的。」


  從台北站到高雄站的高鐵，在《96分鐘》拍攝之初，時常需要96分鐘，但鄒介中笑說：「

  我們籌備拍攝了很久，現在高鐵也進步了，直達車已經縮減到94分鐘。」


  電影工業同樣持續進步，觀眾的觀影感受也在提升，創作人將繼續探索可能，引進新技術

  ，用技術革新推動產業進化，讓拍攝流程跨入精密時代。




  運用新技術Previs模擬、預演

  節省拍攝成本與時間

  引進好萊塢特效

  看來效果也不錯

  魏導也可以學學這個?


  --'
