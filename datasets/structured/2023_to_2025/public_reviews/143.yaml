url: https://www.ptt.cc/bbs/movie/M.1757139047.A.E17.html
title: '[負雷] 96分鐘'
content: '這片明明打著緊張限時的噱頭

  結果整體節奏超散完全沒那種被時間追著跑的壓迫感


  劇情到處插支線

  一堆莫名對白拖時間

  主角群的動機也寫得很薄 行為前後不一致 看得一頭霧水。


  對話常常像在念劇本 完全沒生活感

  情緒轉折也超突兀 想共鳴根本難。


  攝影剪輯也很隨便 鏡頭亂切

  該營造緊繃時卻空有聲光效果

  配樂又太愛刷存在感 吵到破壞氛圍


  整部片最大問題是「不專心」

  該專注在主線衝突卻一直繞遠路 緊張度被磨光


  原本以為能看到一部貼近現實節奏俐落的犯罪驚悚

  結果只是浪費96分鐘在等高潮卻沒高潮

  整體完成度像半成品缺乏扎實鋪陳與角色深度

  如果你對片長有限節奏要求高，

  這部真的不必浪費時間，錢拿去看別的片更值


  最後補一句台灣電影吃屎


  --'
