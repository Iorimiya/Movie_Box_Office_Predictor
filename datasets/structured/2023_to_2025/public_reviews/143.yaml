title: '[好雷] 96分鐘'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  列車上有炸彈、停下來會爆炸的劇情，

  是台灣影史上以高鐵為題材的災難動作長片。


  眾多演員演技都相當精湛、賺人熱淚，

  不過一定也有人會覺得眼淚太大滴了。


  是不是還有哪裡需要加強？


  但我私心先頒給 林柏宏 最佳男主角。


  [有雷]

  有一幕男主角在車箱裡面回頭看到過往的災難畫面，

  相當感動我。


  --

  最後 李李仁，當然是最佳男配角。

  不過他應該以「進行曲」的父親得獎，

  還是以這部片的拆彈指揮官得獎呢？


  --'
