title: '[普雷]  96分鐘  小小遺憾 還不錯'
content: '防雷
















  高鐵真的會讓乘客跳車逃難嗎..... 最後那個妹妹平安嗎....



  其實這部最搞不懂的就是倒數跟時速的公式是什麼


  只能等串流暫停看了

  本來我以為加速後會補數字回來 結果沒有

  搞得前車要用跳的逃難


  遞減又跟時速有關係  王柏傑這角色很適合玩密室逃脫唷XD


  因為這原因不能兩車等速慢  但是可以等速快吧

  讓吳伯宏跳得安全些  （還是劇中有並排等速嗎？！）


  然後題目的96分鐘結果在劇中高鐵早就在行駛了 根本不會花到96分鐘  一開始都會覺得時間倒數96分鐘    雖然表示上車就有啦

  只知道北高兩站的時間  但是關聯性很低



  結尾故意埋伏筆  看票房有機會續作？！


  -----

  Sent from JPTT on my Sony XQ-EC72.


  --'
