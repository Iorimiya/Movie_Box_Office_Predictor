url: https://www.ptt.cc/bbs/movie/M.1758204807.A.7CF.html
title: '[好雷] 七重點靠《96分鐘》開創台灣電影新風格'
content: '網頁版點這裡：







  看更多電影點這裡：






























  近年來，台灣電影雖然在技術與敘事上有逐漸進步的趨勢，但題材仍多圍繞在親情或是愛情的主軸上。畢竟這類型的作品不需要高額的製作費，靠著演員精湛的演技、到位的情緒便能擄獲人心。然而，今天要推薦的這部電影，不僅突破了台灣電影的既有框架，還大膽嘗試以大型交通工具為題材進行災難動作片的拍攝。究竟這部頂著台灣首部「災難動作片」光環的《96分鐘》，會為觀眾帶來怎麼樣的全新體驗呢？



  重點一：「96分鐘」的意思是？


  關於這部《96分鐘》，乍聽之下會誤以為該「片名即片長」，實則不然，這是一部片長近2小時的電影。至於「96分鐘」蘊藏著哪些含意，只有看完電影才會知道了。該部電影的優點在於故事講述不拖泥帶水，快速進入主軸，敘事節奏很快且幾乎沒有什麼冷點。唯一美中不足之處在於部分的橋段與角色確實必要性沒那麼足，若是能將電影時長壓縮至96分鐘，那就真的是神作了！



  重點二：優秀的演員陣容


  該片最令人驚豔的莫過於飾演主角「宋康任」的「林柏宏」，該演員一直以來都很擅長扮演奶油小生或是鄰家弟弟的角色。然而這次他突破以往形象，成功轉型成硬派的拆彈專家，很多人甚至連看到宣傳海報的第一眼都沒認出他來呢！除了主角，詮釋冷酷局長「李傑」一角的「李李仁」也一改其往日溫和的形象，讓人留下了深刻的印象。其他演員誠如宋芸樺、王柏傑、李銘忠、蔡凡熙等也紛紛演技在線，為電影起到了畫龍點睛的作用。



  重點三：台灣首部災難動作片


  如果說「蔡岳勳」導演的《痞子英雄首部曲：全面開戰》算是台灣動作片的天花板，那《96分鐘》絕對可以稱得上是台灣災難片的里程碑。「洪子烜」導演歷時9年籌備，耗資1.6億所打造的作品，在預算有限的限制下，特效雖然精緻逼真但爆破場面略顯不足。但瑕不掩瑜，本片確實證明了台灣也是有能力拍出具規模的災難電影，也為台灣電影的未來奠定了多元題材的可能性與契機。



  重點四：劇情與收尾的表現


  本片主角不過度「開掛」的設定確實更加貼近現實，比起好萊塢那些明明是個普通人卻比超人還要勇猛的設定要少上很多吐槽。而後半段的劇情明顯感受到導演想要營造出煽情的氛圍，也因此有些限制了劇情的走向，不過對於結局的安排還是要給予肯定的。《96分鐘》並不像其他電影一樣有出現「角色蒸發」的現象，大部分的主要角色都有交代後續，稱得上是一個漂亮的收尾。



  重點五：略帶可惜的兇手


  既然講得是「高鐵炸彈案」的故事，那猜測兇手的環節也該是本片的重點之一。然而，不知是不是洪導過度擔憂觀眾們的理解力，兇手揭露的方式略顯直白，完全缺乏懸疑感，在無須勞心傷神去猜測誰是反派的情況下，確實降低了驚喜感與娛樂性。回到飾演兇手的選角，能撐起反派氣場的演員也就那幾位，在導演沒打算反轉的情況下，台劇或電影看得多的朋友應該很容易猜出兇手是哪位......



  重點六：電影的意涵


  《96分鐘》的主軸圍繞著「人性」所運轉，其中「少數」與「多數」的定義更是耐人尋味的假議題。「失去親人的傷痛」對比「背負自責的苟活」，真的有哪一方更值得同情嗎？明明該被譴責的是喪心病狂的炸彈客，但人們卻總是將矛頭指向警方的無能？最令人唏噓的不是電影裡面的橋段有多麼黑暗，而是這些虛構的情節正赤裸裸地映照出台灣社會悲哀的現貌。



  重點七：片尾的意圖是？


  沒想到連這部電影也安插了「片尾」畫面，這年頭「片尾」是不是儼然成為電影內容的標配了呢？特別在此呼籲想要進場觀影的朋友們，如果看完電影著急離開就走吧！這顆片尾並沒有交代什麼關鍵的劇情，充其量就是劇組為了不知道會不會誕生的續集所埋下的伏筆。關於續集的看法，雖然《96分鐘》本身是好看的沒錯，但該片的收尾已算是恰到好處，實在是不必強求延伸。



  儘管網路上對《96分鐘》的評論略顯苛刻，但就以災難動作片的標準來看，本片已是台灣電影史上的一大突破。雖然仍有一些小瑕疵跟可以進步的空間，但靠著演員們出色的演出、結構穩固且流暢的劇情敘事，加上技術層面也在資源有限的情況下展現出了滿滿的誠意，因此，這部電影無疑是一部值得推薦的佳作。




  --

