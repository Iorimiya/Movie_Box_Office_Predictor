title: '[選片] 96分鐘 vs 鏈鋸人_蕾潔篇'
content: '96分鐘 高鐵災難片


  目前有看過日本的新幹線驚爆倒數


  覺得還不錯 只是兇手動機不太合理 有點怕劇情雷同



  鏈鋸人 蕾潔篇


  有看過動畫沒看過漫畫


  覺得不錯看 聽說最近公仔漲翻 評價也一致好評



  如果只能選一片推薦, 哪片比較推薦呢?


  --'
