url: https://www.ptt.cc/bbs/movie/M.1757090927.A.2E9.html
title: '[好雷]  96分鐘'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看之前我是沒有抱太大期待的

  畢竟過去幾年無論是商業片還是劇情片

  台灣電影令我失望的佔絕大多數


  但是96分鐘交出令我滿意的答卷

  劇本、導演調度、演員演技、動作武打、音效視效全都有合格

  甚至我會給到80分以上


  兇手動機合理

  不是汪洋般的殺意 鼻屎大的動機

  利用經典的列車難題

  還是兩次

  一再的考驗主角也在考驗觀眾

  該做出何種選擇?


  列車難題最無道德心理負擔的解答

  就是選擇撞死一人救五人

  但如果賦予那一人更多身分訊息上的填充

  例如幼童、老人、孕婦、偉大的科學家、救過很多人的醫師、消防員

  甚至是你的親人

  你還會選擇撞死那一人嗎?


  兇手對主角與隊長在鐵軌隧道案與信義區爆炸案兩次抉擇的質疑貫穿整部片

  3年前的真相採用剝洋蔥似的手法逐漸告訴觀眾

  原來列車難題的真正解答不是人數多跟少

  而是你要救的人與你的親疏遠近以及在你心中的價值

  3年前的宋康任在猶豫不決時

  隊長故意呼叫與宋康任處在同一棟電影院的未婚妻黃欣

  黃欣的聲音讓宋康任最終選擇解除他們所在的電影院炸彈

  這是自私嗎?

  不是

  這是我們身為人類天然具有的區分內外、親疏有別的本質

  道德規律不應該凌駕於我們人類的本質

  這是兇手他沒想到的關鍵點

  或者他自己也盲目了?


  最後補教名師劉楷抓到兇手是劇情開頭埋的一個伏筆

  這個編排也很不錯


  我印象一開始這部電影前期好像是宣傳林柏宏王柏杰雙男主的

  不曉得是不是因為王柏杰酒駕問題導致他的故事線被砍了??

  但是現在這樣的安排戲份比例安排還蠻適當的



  片尾曲結束後還有畫面顯示兇手不只一人

  看來如果票房好的話是可以拍續集的


  希望這部片票房可以大賣

  如果之後會上網飛的話

  我看好這部可以打破《咒》的網飛台灣電影排行紀錄


  --'
