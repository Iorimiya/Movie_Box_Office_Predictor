url: https://www.ptt.cc/bbs/movie/M.1759005164.A.B3E.html
title: '[好無雷] 96分鐘/進行曲：李仁的公職宇宙'
content: '疫情以後就鮮少進戲院了


  沒想到這個月就進場看了兩次


  而且兩部都有李李仁


  感覺他快變成軍公教專門戶哈哈


  他不會搶戲但又有一定的顯眼度


  如果換成跟他同齡的金城武來演


  焦點可能就完全不一樣了~~~


  (我還是很期待金城武復出呀)



  進行曲和96分鐘都值得進戲院


  進行曲是青春小品但劇末有大場面


  96分鐘則是整部都緊湊


  剪輯節奏掌握得很好


  沒想到臺灣能拍出這樣的片  很棒



  兩部都讓我流下眼淚


  也都比想像中好看唷


  而且選角選得都很適合


  就是在大銀幕上能讓你目不轉睛


  欣賞演技和表情細節的那種



  像進行曲除了颯爽的男主群


  還有兩位畫龍點睛的女孩


  真的好漂亮好可愛


  讓人一直期待她們的畫面



  96分鐘的男女主就是新生代自然演技派


  沒有刻意的口條或姿態


  就是會出現在你我身邊的年輕人


  在工作上付出


  規劃著想做的事


  必須聽命於主管但有時也會勇敢


  精神上追求平等


  裡面幾個配角選得很好


  臨界感恰到好處


  那種邊緣感讓人不舒服


  可是最後又會打動你~



  最後提一下場景


  兩部片的場景滿真實的


  進行曲說的是30年前的臺灣


  街景校景與家居佈置都很寫實


  最後的片段是整部片的精華


  完整的創作


  可以理解為何觀影者被吵到會氣到動粗


  (但打人還是不可以的唷)



  96分鐘場景就是大家都熟悉的地點與交通工具


  沉浸感很強


  同行的大孩子還問我是不是真的發生過


  (這部是輔導級要滿12才能看唷)


  動畫看得出來但不會違和


  中間有段劇情雖然扯


  不過騎機車回家的路上我感受了一下


  這個速度好像...真的可以捏



  總之這兩部片都讓我很滿足


  而且片尾都好好聽


  以前我會刻意進場去支持國片


  但這幾年大都是題材與人生經驗有關


  或成功引起我好奇所以才進場


  就跟選擇好萊塢的片一樣


  不用費心與擔心



  最後再次給進行曲和96分鐘拍拍手


  感覺兩個製作團隊都超級用心喔


  喜歡你們對細節的講究


  也謝謝你們的作品充實了週末


  讓我找回進戲院的體驗和感動


  下次大銀幕前見啦~


  --'
