url: https://www.ptt.cc/bbs/movie/M.1758039383.A.C6A.html
title: '[普雷] 96分鐘結果不止96分鐘'
content: "先說朋友傳給我說要看時我還想說片名在哪？阿怎麼只截片長...\n\n\n以下算是一些簡單微雷心得\n\n要怎麼給這部分數想想還是有點為難\n\n\
  畢竟要打鬥有打鬥要特效有特效要演員有演員要爆破有爆破，該有的都有，但要說作為及格的爆米花片，又好像稍微可以再加強一些\n\n整體上來說算是值得鼓勵的方向，畢竟算是難得的列車動作片類型\n\
  \n走向是不錯的，但整體劇本上似乎還可以再精雕一些\n\n尤其感情路線有點灑狗血過頭了，甚至會有些懷疑為狗血而狗血的橋段，多到會覺得拖時間了，感覺如果可以把這部分更精簡化\n\
  \n\n挪多餘時間去對各角色做鋪陳和銜接劇情會更好一些\n\n\n\n\n\n\n\n\n\n阿然後這世界線警察態度真的有點不知道是在派三小的...\n\n--\n\
  \ 直接銬人那邊我是懂啦，只是覺得那女警對民眾講話氣口我都有點被戳到了，要說安撫\n 也沒安撫只有煩躁感，劇中警方如果都這種態度就有種...恩難怪家屬會不信任耶\n\
  \ 覺得警長和反派的背景可以多鋪陳些會更好，有些實在過於工具。更別提某人老婆了，突然蹦出來從頭到尾很不入戲的感覺"
