url: https://www.ptt.cc/bbs/movie/M.1758334671.A.887.html
title: '[好雷] 96分鐘'
content: '雷文防雷資訊頁


  96分鐘

  96 minutes

  2025台灣電影


  台灣電影難得看到的驚悚大片：首部高鐵災難動作片之類型，場景及危機類似今年Netfli

  x上架的原創日本電影〔新幹線驚爆倒數〕，但去電影院看此片之前，已經看到有些負評

  文，對此片的預期有降低，但是這種類型片，是我的菜，加上演員卡司及劇設吸引了我，

  仍然決定去電影院感受此片。看片過程中，劇情畫面緊張緊湊，主要角色刻畫有理有據，

  令我感覺沒有冷場地挺入戲，而為之揪心，對於本片反派，真的就是可憐之人必有可惡之

  處，超級厭惡也害怕這種人。本片在編導安排之下，我錯誤預期本片是驚悚動作爽片，結

  果根本是...，這不是爽片！是人性選擇取捨下的悲喜劇！為本片設定提及的dilemma取捨

  困境，思惟一下，實在難為也！


  雖然本片有一些人提及之尷尬點及不滿點，但全片氛圍及場景劇情有令我欣賞的亮點，

  個人滿意度80分。


  以下有劇透。


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  1.這是一部讓我全程緊緊盯著螢幕、不敢鬆懈，令我揪心的電影。劇情沒有多餘的鋪陳，

  每一個畫面都真實到讓人心頭發緊。危險、緊張、刺激的張力，交織著人性中最細膩的情

  感表達，虐心卻不做作，沉重卻自然。演員的表演，讓我相信了角色的痛苦與掙扎，而導

  演與攝影的掌握，更是將整個氛圍推到極致。主角林柏宏的精湛演出及其角色設定，令人

  為之難受及感動，一些災難受害人角色的刻畫，有被設計洗腦及邪惡計畫的反派，都令人

  憤怒，可憐又可惡，全片角色都給我一種浮世繪的感受。


  另外，本片音效和配樂相當優秀，令人有震撼感，最後那首歌曲更是點睛之筆。建議不要

  急著離開戲院，坐下來聆聽完片尾，才能真正感受到故事之後，那股心酸與餘韻。


  2.《96分鐘》不只是災難片，它更深刻地把人性，放到極端情境裡檢視。當面臨生死，人

  們在為己「自私的愛」與為他人「無私的愛」之間，往往會憑本能做出選擇，沒有誰對誰

  錯，只有赤裸的人性。看著角色在困境裡依然選擇展現善意與勇氣，我被深深觸動。本片

  會讓一些人包括我，在電影院裡淚光閃閃，也讓我不禁反思：如果是自己，會如何抉擇？


  3.本片是台灣難得拍攝出來的災難片，台灣災難電影能有本片這樣的表現，雖然有吐槽點

  缺點，但閃亮點感人點優點不少，令人有所思惟，及思考容易代入自身處境的議題，推薦

  ，值得一看！


  96分鐘

  96minutes

  2025台灣電影

  高鐵不能停

  台灣首部高鐵災難動作片

  凶手根本是遷怒害死多人的大垃圾人物

  這種人是否仍然不會判死刑


  --'
