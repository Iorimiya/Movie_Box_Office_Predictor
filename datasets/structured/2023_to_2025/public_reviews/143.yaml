url: https://www.ptt.cc/bbs/movie/M.1759100425.A.F52.html
title: 'Re: [負雷] 一整個尷尬的“96分鐘”。'
content: '我看過的電影至少上百部，可以很明確地說，這部片的問題並不一定在演員身上，畢竟有

  些演員的戲多多少少我還是有在看。



  在緊張的情境下，角色卻說出「我們一定可以搞定」「你一定要回來」(類似的話，原句

  不記得)這種空泛又不帶情感的話，完全就像在照稿念。有些觀眾一聽就能察覺，呈現方

  式僵硬得令人出戲。


  這種煞有其事沒有靈魂的台詞，對有多年觀影經驗，或心思比較細膩的人來說，一眼就能

  看出來。


  整個觀影過程代入感極低，我過程不斷出戲。


  時時刻刻在想，如果這時候把這場景拿去對照這類緊張氛圍處理得更好的作

  品，然後納悶：這種爛台詞到底是誰想出來的？



  不過話說回來，我也好幾年沒看國片了。國片確實還有很多容易被挑剔的地方




  撇開那些生硬的台詞、偏薄弱的特效和音效，甚至一些不太合理的情節，


  其實整體劇情算是有看頭的。

  ，這點真的值得肯定。


  --

  哈哈，抱歉啦 我甚至連預告片都沒看，就稍微看看評論說不錯看，但已經預期有“尷尬

  感”，我大概就是點出這尷尬感可能不會是演員的問題。

  畢竟留言區也有人提到，某些演員資歷不淺，確實我也對某些演員在別劇的表現也是值得

  讚賞。

  你點出一個重點「一字一句」，確實'
