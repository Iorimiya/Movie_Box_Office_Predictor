url: https://www.ptt.cc/bbs/movie/M.1761393583.A.920.html
title: '[新聞] 《96分鐘》票房看漲 林柏宏成「金馬遺珠」'
content: "《96分鐘》票房看漲 林柏宏成今年「金馬遺珠」\n\n\n林柏宏與宋芸樺在《96分鐘》飾演共患難的夫妻，情感流露真摯動人。（華影國際提供）\n\n\
  【大紀元2025年10月24日訊】（大紀元記者馬維芬報導）台灣首部以高鐵為題材的災難動\n作片《96分鐘》，自9月5日上映以來口碑與票房持續延燒，上映至今（23日）票房持續上\n\
  升，本週有望超越先前台灣電影冠軍《角頭－鬥陣欸》，成為2025年度台片票房冠軍。\n\n根據統計，截至21日《96分鐘》累積票房已突破新台幣1.87億元，與目前2025年度台片票\n\
  房冠軍《角頭－鬥陣欸》僅剩數百萬元的差距。\n\n《96分鐘》憑藉緊湊懸疑的節奏、震撼動作場面與情感張力，寫下近年罕見題材的台灣電\n影票房新紀錄。該片上映至今八週，票房氣勢驚人，全台各地更掀起「再衝2億」集氣熱\n\
  潮。\n\n除了票房熱度不減，該片在剛公布的第62屆金馬獎入圍名單中，獲得五項技術類獎項提名\n，包括最佳攝影、最佳視覺效果、最佳美術設計、最佳動作設計與最佳音效，充分展現團\n\
  隊在視覺與動作場面的實力。\n\n\n《96分鐘》電影劇照。（華影國際提供）\n\n隨著金馬獎氣氛升溫，《96分鐘》片商宣布將於11月8日與11月13日於金馬影展舉行特別\n\
  放映，並邀請主創團隊出席映後座談，包含監製鄒介中、導演洪子烜、動作設計洪昰顥、\n音效杜均堂與陳維良，以及夢想動畫創辦人林家齊。\n\n該片雖未入圍表演類獎項，但男主角林柏宏憑藉細膩又爆發力十足的演出，被評審讚為本\n\
  屆「影帝遺珠」，引起不少觀眾熱議與惋惜：「他最後那場戲不入圍太可惜！」。\n\n觀眾在社群留言：「這部片讓我重新相信台灣電影的力量」、「劇情太緊湊，看完還在回\n\
  想那96分鐘裡的選擇與命運」。而今，電影票房即將邁向2億大關。\n\n責任編輯：蘇漾\n\n\n\n--\n\n                  \n\n\n\
  \n--"
