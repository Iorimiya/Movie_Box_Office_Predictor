content: '版上神文很多

  我這個人不吹毛求疵，直接給這部國片99分！


  96分鐘完全出乎意料的精彩！

  可以說是從頭到尾都讓人屏氣凝神

  尤其是高鐵高速行駛的畫面

  轟隆轟隆 彷彿戲院也在震動 很是震撼！



  劇情其實不複雜 但鋪陳不錯  緊湊流暢

  看完覺得當警察真衰小！


  唯一覺得誇張的就是男主角跳車去另一輛

  居然沒摔死 果然是電影XD



  喜歡男主角最後犧牲的結局

  很怕女主剪下去 結果根本沒事 那就爛尾了

  還好沒有。




  96分鐘這真的是令人驚豔

  台灣新的里程碑

  真的受夠無病呻吟的文青片了

  台灣也可以做出如此厲害的商業片！



  今年金馬獎最佳影片不頒給它

  真的說不過去啦！




  附上人權照



  宋芸樺本人真漂亮！



  --'
