url: https://www.ptt.cc/bbs/movie/M.1746167633.A.0E3.html
title: '[新聞] 第27屆北影開閉幕片《96分鐘》《進行曲》'
content: '原標：災難動作片《96分鐘》獲邀2025北影開幕片 兩屆大使林柏宏 宋芸樺同台飆戲 青

  春熱血電影《進行曲》擔綱閉幕片 非常新人牧森 余杰恩挑大樑演出


  新網網址：



  2025第27屆台北電影節今（2）日揭曉本屆開、閉幕片，開幕片為《狂徒》導演洪子烜最

  新鉅作《96分鐘》，由去年及今年北影大使林柏宏、宋芸樺，及曾獲得北影最佳男主角的

  王柏傑、最佳男配角的李李仁、最佳女配角的姚以緹攜手演出鬥智鬥勇、分秒搏命的災難

  動作電影；閉幕片則為億萬票房電影《角頭》系列導演姜瑞智熱血新作《進行曲》，由北

  影「非常新人」牧森、余杰恩及新生代演員劉育仁共同演出高中樂旗隊奮力逐夢的青春紀

  事。


  開幕片《96分鐘》為台灣少數擅長拍攝動作片的新導演洪子烜新作，從劇本構思到完成作

  品歷時九年，為了打造臨場感，

  。故事講

  述由林柏宏飾演的拆彈專家，和出演其新婚妻子的刑警宋芸樺，因搭上台北往高雄的高鐵

  快車，被迫解決炸彈引爆危機，在生死交關的96分鐘中，全車乘客的命運交付在他們手中

  。


  得知《96分鐘》獲邀成為北影開幕片，前任影展大使林柏宏相當興奮：「這是我第一部在

  台北電影節成為開幕片的電影，對我來說是在演員生涯清單打了一個勾！」宋芸樺接獲消

  息也十分驚喜：「今年能擔任台北電影節影展大使已經很榮幸了，沒想到開幕片居然還是

  《96分鐘》，這個雙重身分的安排，我相信是宇宙偷偷寫好的劇本。」兩人也號召影迷6

  月20日來北影，期待和大家一起看世界首映。


  除了，《96分鐘》還集結了等

  實力派演員同台飆戲，驚心動魄的災難動作場面與角色之間精彩的情感糾葛，為台北電影

  節拉開了緊張刺激的序幕。



  閉幕片則邀請以《角頭》系列電影創下億萬票房佳績的導演姜瑞智最新作品《進行曲》擔

  綱。影片由《痞子英雄》編劇陳慧如和《聽見歌再唱》監製陳鴻元歷時六年開發完成，由

  北影「非常新人」飾演一群面對社團存廢危機的高中生

  ，齊心對抗體制，追求夢想的過程。牧森為了出演下足苦功，不僅卯足全力進行體能訓練

  ，更從小號生手練成純熟的樂旗隊員。對於首次挑大樑主演電影，他沒有將「主角」這件

  事想得太重，「就是好好把角色演好。」而余杰恩雖然從小就學打鼓，但為了完美詮釋角

  色，還是一週三天、每天八小時背著20公斤的鼓練習行進，甚至手都流血破皮，他卻甘之

  如飴：「從前置到拍攝，到下戲後的情感交流，都讓我深深愛上演員這份工作，非常幸福

  。」


  除了新生代演員，《進行曲》還有等實力派演員的精彩演出，加

  上由金獎電影配樂侯志堅擔任音樂總監，一手打造閉幕片的青春熱血與滂薄氣勢，滿足觀

  眾的觀影享受，為影展劃下圓滿句點。


  --'
