title: '[好雷] 96分鐘 暢快的動作爽片 '
content: '做個無雷分享

  96分鐘與新幹線很不一樣

  新幹線時間軸拉得夠長

  可以多出很多外部操作


  台北到高雄就只有96分鐘

  站點少時間短

  更仰賴列車上的人處理危機


  這部片在時間有限的情況下

  仍讓車上角色各有發揮

  轉折也堪稱合理

  這部很值得一看



  那高鐵列車移動視覺效果很好

  看幕後才知道竟然是搭景配螢幕

  等正式上映會再來二刷


  --




