url: https://www.ptt.cc/bbs/movie/M.1757146173.A.3CE.html
title: '[微好雷] 96分鐘值得進場但還可以更好'
content: '先來貼總結


  題材新穎，整體值得進場支持，但我覺得還可以更好。

  我本來就是衝著林柏宏進場的啦 XD，但有些地方我覺得可以再更好就是了。








  下面就是有雷分享了請斟酌













  ~~~~~~~~~~~~~~~~~~~友善 雷文主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  簡單分享一下讓我印象深刻的地方：


  1.有幾幕轉場真的滿亮眼的，不知道大家有沒有注意到？

  就我這幾年有在關注國片的經驗來說算是滿耳目一新的


  2.我覺得有把緊張、時間緊湊有呈現出來


  3.林柏宏、李李仁、王柏傑演技都很出色


  4.動畫特效表現不錯，像是列車高速行駛在鐵軌上，

  或李李仁被勒斃的場景，都處理得滿好



  但還是有幾點比較主觀的小吐槽：


  1.林柏宏那段失血過多還能硬走、還能拉巫建和一把，這戰力已經有點超人類了吧 XD


  2.有些場景或幾幕感覺可以刪掉，對劇情推進或情感鋪陳沒什麼幫助。

  可能因為配角比較多，需要交代鏡頭，才導致有點冗


  3.後段一些明顯要賺人熱淚的橋段，對我來說鋪陳不太夠，反而沒什麼感覺

  （雖然現場還是聽到有人抽衛生紙 XD）


  4.這點想問很久了，從「模仿犯」到最近的「零日攻擊」，是不是台劇壞蛋都很愛

  用變聲器？XD


  感覺已經是標配了，每次看到我都會有點出戲（只有我嗎 XD）。


  5.最後竟然還有兇手沒抓到（驚訝） 我猜就模仿犯吧?




  以上個人主觀心得，感謝大家


  -----

  Sent from JPTT on my iPhone


  --

  我進場前還想說該不會又有變聲器來推進劇情，結果還真的有XD

  好好奇為什麼台劇這麼愛變聲器

  其實我覺得那些乘客滿冷血的 看到林柏宏失血這樣只顧自己

  但的確啦生命關頭一定只想到自己

  這確實

  冤枉啊XD

  我其實覺得男主領便當是不錯的,但通常應該會有一些反思或是很深的理念

  (像TDK3阿蝙衝去自殺)

  我反而覺得媽媽比較出戲XD

  然後弟弟原本要殺死男主後來突然想通了我也是空氣(???)'
