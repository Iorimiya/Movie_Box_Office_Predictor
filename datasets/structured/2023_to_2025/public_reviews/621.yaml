title: '[好雷] 殺人結業弒 2022日本電影'
content: '雷文防雷資訊頁


  殺人結業弒

  Lesson in Murder

  2022日本電影

  死刑にいたる病




  筧井雅也某天他收到了榛村大和的信，榛村為一名連續殺人犯，因24起謀殺案中的九起案

  件定讞，被判死刑。榛村被捕前經營一間麵包店，高中時期的雅也常常光顧那間麵包店，

  見到雅也後，榛村直接承認罪刑，但卻聲稱第九起案件是誣陷，要雅也找出真正的凶手，

  當雅也開始調查此案後，才發現真相遠比想像的更加殘酷…





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  本片是雙男主角阿部貞夫和岡田健史，但個人感覺帶領劇情穿針引線的岡田的戲份最重，

  全片看岡田健史（水上恆司）傾情投入演出，看地過癮。心狠手辣，毫無人性的連續殺人

  犯(阿部貞夫)，專門挑選乖順無辜男女高中生下手，痛苦折磨後殺害致死，有夠可惡，死

  刑算便宜他了，該讓這罪犯，遭受到他折磨別人的相同之恐懼和痛苦。


  結局畫面，竟然如此收場，不敢相信。

  個人滿意度80分（滿分100）。


  這片看到昔日日劇女王中山美穗扮演岡田健史的媽媽，是驚喜。


  以下有劇透，暴雷。不喜者，請勿往下看。




  本片劇情的警世作用很有感，詐騙一般目標是取財為主，而有些不是取財，是處心積慮地

  對你好，或和你的心意投合，騙取信任，淘空你的智能判斷力，取你的靈魂，別說不可能

  ，那麼多邪教教主的存在不就是？

  本片的連續殺人魔榛村大和的存在，儘管身在監獄中，如同操控人心的邪魔，掌握少數人

  的人心，持續為非作歹，這種人判死刑不足以彌補其罪行，若持續有廢死聯盟的支持，真

  的是令人悲憤交加。


  筧井雅也（岡田健史）在故事中的人設劇設，看到平凡人被操弄的情節，令人生起寒意，

  就是邪惡的有心人，利用人的貪嗔痴慢疑等等，如：家暴，對家人不滿...趁虛而入，以

  達到所要的目的，雅也的最後的警醒，令人欣慰，但最後那橋段...

  唉，我們可以粗暴地下結語：跂袚~障重，所以遇到了？


  殺人結業弒

