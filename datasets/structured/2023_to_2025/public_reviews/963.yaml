title: '[無雷] '
content: '窺探者：

  1.開頭很奈沙馬蘭式的懸疑。

  2.整部電影很平順，不是很緊張刺激，也不會到很枯燥。

  3.結局合理、不牽強，完整說明整個故事的由來

  4.這部片出場人物不多，可以看得出是低成本的作品

  5.總結：不會讓你感到枯燥、想離開，但也不是非常的刺激、緊湊。喜歡奈沙馬蘭電影風格的觀眾可看看。

  -----

  Sent from JPTT on my iPhone


  --'
