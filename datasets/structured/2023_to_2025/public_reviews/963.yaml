content: "HBO\n窺探者(The Watchers)\n2024-12-07(六) 21:00\n\n導演  伊莎娜·奈·沙馬蘭\n主演\n達科塔·芬妮\n\
  喬吉娜·坎貝爾\n奧利佛·芬尼根（Oliver Finnegan）\n歐雯·弗勒\n\n窺探者》（英語：The Watchers，在英國和愛爾蘭記作The Watched[2]）是一部2024年美\n\
  國超自然恐怖片，由伊莎娜·奈·沙馬蘭編導（長片編導處女作），其父奈·沙馬蘭監製\n，改編自A·M·希恩（A. M. Shine）的同名小說。電影由達科塔·芬妮、喬吉娜·坎貝\n\
  爾、奧利佛·芬尼根（Oliver Finnegan）和歐雯·弗勒，講述28歲的藝術家米娜受困於\n愛爾蘭西部的一片森林中，並在安身處與三名陌生人待在一起，每晚都被神秘生物監視並\n\
  跟蹤[3]。\n\n電影2023年7月至9月完成主要拍攝；2024年6月7日在美國上映。這部電影獲得影評界負面\n為主的批評，受批評的部份在於編劇與節奏拿捏。\n\
  --------------------------------------------------------------------------------\n\
  HBO\n孤狼救援（Gunner）\n2024-12-07(六) 22:40\n\n導演 迪米崔·洛戈塞蒂斯\n主演\n路克·漢斯沃\n摩根·費里曼\n\n《孤狼救援》（英語：Gunner）是一部2024年美國動作驚悚片，由迪米崔·洛戈塞蒂斯執\n\
  導，蓋瑞·史考特·湯普森編劇，路克·漢斯沃與摩根·費里曼主演；講述特種部隊士兵\n的兩個兒子在森林中遭販毒集團綁架，導致他深入敵陣解救家人。電影2024年8月16日在\n\
  美國採限量放映及數位發行。\n\n--\n   \n\n--"
