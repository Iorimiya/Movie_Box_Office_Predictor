title: '[  雷] 窺探者....三部曲??'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  預告片感覺還蠻不錯，看到網上一片爛評，讓我更好奇了。

  就奈沙父女聯手拍出的奇幻驚悚片為賣點來說，全片看完跟本上是自己嚇自己。

  以下瞎猜的雷








  片尾的半仙子以衪的能力，潛伏在人間，能飛能模仿....不就是變種人嗎?

  奈沙的驚心動魄不也是驚悚片，只是拍到分裂、異裂才貫穿故事的完整性。

  然後教授為了重生妻子，給仙子去模仿，但又嫌棄人家模仿的不像。


  性癖可以冷門，但不能邪門。

  古人和教授....


  --'
