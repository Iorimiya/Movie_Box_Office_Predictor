url: https://www.ptt.cc/bbs/movie/M.1709117889.A.BDD.html
title: ［情報］沙馬蘭新作【窺探者】前導預告
content: '來源：華納兄弟台灣官方YOUTUBE



  【窺探者】由M.奈沙馬蘭擔任製片，伊莎娜奈沙馬蘭自編自導，改編自A.M. Shine的小說

  。故事描述28歲的藝術家米娜，突然被困在愛爾蘭西部一片廣大無邊、人跡杳然的森林裡

  ；當米娜找到安身處時，才察覺到自己與三個陌生人一起受困，而且每晚都有神祕生物在

  監視和跟蹤他們。


  你看不到它們，但它們什麼都看得到。


  【窺探者】的主要卡司包含達科塔芬妮（【從前，有個好萊塢】、【瞞天過海：八面玲瓏

  】）、 喬吉娜坎貝爾（【宿劫】、影集【誰是綁架犯】）、奧利佛芬尼根（影集【詭奇

  怪談】、影集【異鄉人：古戰場傳奇】）和歐文弗勒（【北方人】、【色遇】）。製片是

  M.奈沙馬蘭、阿什溫拉詹和尼米特曼卡德；監製則是喬霍米伍德和史蒂芬鄧比澤。


  ==========================

  提醒一下 導演是伊莎娜奈沙馬蘭 奈沙馬蘭只是製片

  目前看來監視的有可能不是人類 反轉有可能又是人類 但也有可能反轉不是生物(?


  --'
