content: "★ M.奈沙馬蘭擔任製片，伊莎娜奈沙馬蘭自編自導\n★ 改編自A.M. Shine的小說\n★ 電影預告：\n★【窺探者】6月7日 (週五) \
  \ 端午連假 你在看我嗎？\n\n叢林密室逃脫遊戲正式開啟\n想活命請遵守遊戲規則故事\n\n描述28歲的藝術家米娜，突然被困在愛爾蘭西部一片廣大無邊、人跡杳然的森林裡；\n\
  當米娜找到安身處時，才察覺到自己與三個陌生人一起受困，而且每晚都有神祕生物在監\n視和跟蹤他們。\n你看不到它們，但它們什麼都看得到。\n\n《抽獎方式》\n\
  5月31日 23:59前，推文留言你想要看【窺探者】的原因，就有機會\n獲得電影交換券\n（如：我想看窺探者，想知道森林裡究竟有什麼秘密）\n\n《獎項內容》\n\
  【窺探者】電影交換券 X 20組（一組2張）\n\n《中獎通知》\n6月1日公布中獎者於回文內，並寄站內信通知得獎者得獎事宜。\n6月3日12:00 前，請各位中獎人務必回覆領獎資訊，恕不接受逾期回覆。\n\
  \n《注意事項》\n1.交換券為非賣品，嚴禁兜售等圖利行為。\n更多電影資訊：華納兄弟台灣粉絲團 \n\n--"
