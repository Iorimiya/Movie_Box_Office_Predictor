url: https://www.ptt.cc/bbs/movie/M.1717853686.A.56C.html
title: '[微好雷] 窺探者，可怕的鏡頭'
content: '先附上人權圖。


  簡單來說是一部中規中矩的劇情電影，在進戲院前查看了板上的評論，原本以為會很糟，

  但對我這個沒有看過原著小說的人來說，故事設定以及民間傳說的部分還蠻不錯的。


  以下有雷















  不喜歡的地方有兩點，

  1.蟑螂的畫面對我來說太多，像之前看水行俠2一樣，雖然只是閃過幾秒不是特寫鏡頭，

  但還是哎額了一下。


  2.結尾硬要傳達人類很正面的部分感覺可以省略，或是米娜最後去找雙胞胎姐妹露西的時

  候，特寫她手腕上沒有被指甲划傷的傷痕（表示瑪德琳幻化成的），可能會比較不那麼平

  鋪直敘。


  怎麼會米娜嘴砲幾句話，就讓祂勾起人類好的一面，然後就放過她飛走...？？？？？




  --'
