url: https://www.ptt.cc/bbs/movie/M.1673858303.A.7DD.html
title: 關於我和鬼變成家人的那件事觀後心得
content: "關於我和鬼變成家人的那件事 高雄夢時代秀泰場\n\n一開始以為要看的是喜劇\n卻沒想到它不只是喜劇\n整部戲的節奏非常的流暢\n開場完美的詮釋一個厭同的直男有多厭同\n\
  而他到底是怎麼被掰歪的\n這就歡迎大家一同進戲院見證掰歪的心路歷程\n\n戲裡沒有鋪陳的是新郎0號的家庭\n但很明顯的就是他跟親情好像很不熟\n沒有同理心也沒有換位思考\n\
  就很單純的中二病的大直男\n\n不單單是掰歪的過程值得一看再看\n親情,友情,甚至與寵物之間那個羈絆\n每條線都非常的飽滿\n甚至讓人看完後,會再回味思考\n\
  甚至故事跟你想像的完全不同\n翻轉, 翻轉, 再翻轉~~~\n你或許能猜到了開頭,但你一定猜不到這個結局\n\n總之這部戲真的很值得大家進電影院\n一刷再刷甚至N刷\n\
  \n但友善提醒\n電影開場前你一定要先去化妝室\n因為全劇\"無尿點\" 每個環節都絲絲入扣\n你根本捨不得離開你的坐位\n甚至到結局你才發現原來時間流逝的這麼快\n\
  \n面紙也是必備項目\n它除了用來擦拭看到許光漢那\"青春的肉體\"而流下的口水外\n還有其他的用途喔\n\n本劇最大看點\n除了許光漢那完美的巴低之外\n還有林柏宏的軟萌可愛\n\
  配角更是一個比一個會演\n就連客串的角色都超會演的\n話不多說了\n2/10 上映一定要記得去看喔\n\n\n\n#不論愛男生還是愛女生最重要的是張大眼挑對人\n\
  #眼見不一定為實\n#有種愛叫爸爸說不出口的愛\n#不論任何東東丟到垃圾桶之前還是先確認一下吧\n#不敢相信的事情真的很多\n#除了二大帥哥外馬念先也好帥\n\
  #導演功力真的很好\n#制片人超美的好咩\n#關於我和鬼變成家人的那件事好笑好哭又好看\n#高雄秀泰的椅子真的太好坐了\n#我也好想要林柏宏送的台詞T\n#2/10正式上映喔\n\
  \n--\n只是貓\n    一隻用咖啡跟醇酒眷養的..\n              再加上任性冷漠不可愛的材料...\n\n--"
