url: https://www.ptt.cc/bbs/movie/M.1676446498.A.3C8.html
title: '[好雷] 關於我和鬼變成家人的那件事'
content: '其實我不太看國產的喜劇片，因為常常都是賀歲片形式的笑點，硬要塞台灣元素讓我覺得

  尷尬，這部電影看預告覺得新奇有趣，早早就列入了觀看名單。


  整體而言，劇情屬於前期輕鬆搞笑，後期懸疑解謎+感人，國片常常一個故事都說不好

  ，或是讓人覺得沉悶，【因為片名太長，所以我都懶得打，請見諒】本片能做到令人又哭

  又笑又嚇人，已經算是不錯了。


  如果是腐女向的觀眾，可能會覺得有點意猶末盡，但整體而言，還是值得推薦給大家觀看

  的電影。


  ~~~~~~~~~~~~~~~~~ 【有雷部分】可能會牽涉到劇情，請自行評估。 ~~~~~~~~~~~~~~~~


  一開始我就被嚇到了，因為我本來是抱持著看喜劇片的心態，沒想到在幫毛毛剪指甲的時

  候突然來個打雷，一點蘊釀都沒有…，後來伴隨著滿嬌姨的一句靠么啊，才發覺，啊！原

  來這是喜劇。


  沒辦法，一開始的美術設定其實很到位，那種詭異的氣氛，舊宅院的靈堂、門牆，都很精

  美的讓我覺得認真的拍個恐怖片應該也不錯。


  劇情進展蠻明快的，開頭就把主要角色的人物設定刻劃的很明顯，讓人很好懂。應該說，

  一開始的人物設定，真的就是屬於普羅大眾心目中的刻板印象，衝動沒大腦、髒話不離口

  的直男，品學兼優但氣質陰柔的死gay(死掉的gay)。但隨著劇情的推進，可以看到人物在

  刻板印象以外的面貌。


  片中的飛車追逐畫面，有的人會覺得特效很假，但我自己心知肚明，在了解全片含行銷總

  共才六千萬的預算之後，個人認為這樣的畫面呈現已經算是很有誠意了。反正我是來看喜

  劇片的，又不是來看漫威。


  三位主角的演技發揮都不錯，但以個人喜好程度來說，是林柏宏>許光漢>王淨。


  首先講林柏宏的部分，我最開始認識他，是從超級星光大道開始，當年那個青春小鮮肉，

  現在都已經長得如此成熟了啊…(我是指戲外)，這也不是他第一次演gay的角色了吧？之

  前在「帶我去遠方」中就有演過同志了，但二片的調性不同，所以也沒什麼好比較的，總

  之就是能看得出來他演技的成長。


  林柏宏飾演的毛毛，一開始些許的「娘」味，其實會讓我覺得「好膚淺，現在還認為gay

  就應該是這樣子」的演法。畢竟喜劇片的表現手法總是會比較浮誇，可是隨著劇情的進展

  ，慢慢覺得毛毛真可愛，很像我的38好友，彷彿他就真實的存在我的生活當中。而當毛毛

  因為親情、愛情落淚的時候，又會替他感到心疼。


  看完後，我覺得他演得很「自然」，並不是gay就「應該」陰柔，而是陰柔只是他生而為

  人的一部分「特質」，這就是他的本我，膚淺的反而是我一開始的想法。


  許光漢飾演直男警察吳明翰，這是我第一次看他演戲，先前紅到翻天的想見你，我也沒看

  過。單就本片的角色來說，搞笑很放得開，雖然直男的詮釋有點太過用力了，但想想，似

  乎也真的就是有如此暴躁的人。


  一開始我對這個角色的定義就是來賣肉的，也不會有太多的期待，但當搞笑的片段過了之

  後，看著他原本「恐同」的心態，經過跟毛毛的相處，漸漸的轉化為家人般的支持，從替

  毛毛揍渣男、在河邊跟毛毛說要養他一輩子的台詞，一直到在救護車上的那句「跟我老公

  」，讓我對於這個自大無腦的壞印象，轉化成溫柔熱心的憨厚暖男，實為良配。


  其實我蠻喜歡本片並沒有要「硬掰彎」的設定，如果真的這樣做，或許可以造成很多泰劇

  BL那樣的熱潮，但這樣就顯得太無腦姨母笑爽片了，雖然明翰承認了「老公」的叫法，但

  我們更可以理解是身為家人那樣給予的支持，而不是雙方真的彼此來電了。


  王淨飾演花瓶(疑)女警林子晴，老實說戲份不算多，掛為主演應該只能說是名氣大比較好

  打廣告吧？如果純走BL路線的話，這個角色應該可刪除，但加了這個角色，能夠加深本片

  的深度，對於男主許光漢的劇情規劃，也會有更多元化的發展。


  以片段來說，會覺得王淨演得不錯，但是她的台詞總給我一種刻意營造的感覺，相較於雙

  男主來說，比較沒有那麼自然，包括假扮孕婦那邊的笑點，我個人就沒有覺得很好笑。


  片長129分鐘，覺得可以再精鍊一點，在病房將所有劇情真相大白的那一段，雖然很感人

  ，可是我覺得太長了，而且襯在背景的音樂有點大聲，很像是要提醒我「這邊我要賺人熱

  淚囉」。我最推薦的一個畫面，是明翰在救護車上已經沒有了心跳，而靈體已經非常虛弱

  的毛毛，仍然不顧一切的附身在擋在前面的每一台車駕駛身上，擋在路中的汽車像摩西分

  海那邊讓出一條路來，沒有音樂、沒有人物的臉部表情，純粹就是這樣「為愛奮不顧身」

  的劇情，這邊才真真切切的讓我哭了出來。


  整體來說，這部片用喜劇的甜美好入口外包裝，包裏了人們對於刻板印象的探討，或許還

  偷渡了一些反核、挺同、環保的概念。這是一個關於愛的故事，雖然主角是同志，但並不

  是聚焦在討論同志愛情，而是在家人之間、朋友之間，有著更多的刻劃，是近年來難得好

  看的國產喜劇片，希望它的票房能夠好一點。


  --'
