title: '[負雷] 關於我和鬼變成家人的那件事 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~







  關於我跟鬼變成家人


  一開始看蠻有動力想看下去的 覺得男主火爆警察的演技還不錯 結果後來在那邊跳蔡依林

  的旋轉跳躍就尷尬死了 後來鬼男主也演得不錯 於是再勉強看了一下 然後接下來就一連

  串的尷尬 後續登場的人都覺得是把他在別的電影的角色原封不動搬來這片


  重點: 看了我們與惡的距離、 模倣犯, 等等覺得演技部分的尷尬好像久了可以改進 但編

  劇跟台詞都還是很怪 就拿我與鬼變成家人來說 好像很僵硬的把環保置入劇情 當然我個

  人是非常支持環保 出門都帶環保杯 吃便當自備筷子湯匙 但是這與劇情實在不搭


  至於台詞我是覺得 "幹"這個字其實有點怪怪的 通常幹是當發語詞主要是講後面的話 或

  是幹也有時候表示無話可說 但是這劇裡面的幹變成好像有點用念的 反正就是很怪 但是

  陽光普照裡面的8+9一堆 也不需要講一些髒話就讓你發毛 所以我覺得演員演技雖然重要

  但是像鍾孟宏這樣的導演以及編劇台詞組更是靈魂 能跟演員一起把劇演好


  --'
