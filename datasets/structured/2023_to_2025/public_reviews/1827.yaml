url: https://www.ptt.cc/bbs/movie/M.1668697408.A.4B0.html
title: '[好雷] 《關於我和鬼變成家人的那件事》喜劇里程'
content: '算是目前台灣電影頗具誠意的喜劇，類型上在台灣甚至華語片很難找到相似的電影，整體

  電影漸入佳進，大量特效、飛車、槍戰動作融入電影裡，議題上也講同婚、職場性別困境

  相當多元，而且依然保持導演風格，整體演員表現亮眼，尤其是林柏宏再次證明他擁有良

  好的演員資質，多年不見大銀幕的庹宗華演出把整個電影上升到一個層次，真的是「不敢

  相信」。


  ———————————————————————-

  有雷….對電影很重要


  有雷


  有雷


  有雷



  不得不說劇本野心相當的大，整部片以懸疑動作片為基底融入喜劇元素，而且幾乎把這幾

  年台灣電影能賣的都用上，同志、愛情、親情、靈異、犯罪放在一起，卻巧妙融合，這部

  絕對是明年台灣電影票房指標的重要電影。有別於九把刀以劇本服務電影、程偉豪更擅長

  用電影去劇本，確實可以帶領台灣商業片走出除了九把刀不同路線的重要導演。

  整個劇情是以直男標籤刑警與意外死亡的同志，闡述整個兩件重要的辦案過程，有各種不

  同的伏筆和反轉，節奏分明卻相當流暢，比較可惜的是直男刑警背景比較淺薄，和花瓶刑

  警支線收得太快，但還好沒有影響整個電影協調性。但我實在很喜歡電影對於性別標籤的

  反思和同婚過後思考，自然卻毫不刻鑿，把議題丟還給角色而不是丟給觀眾說教。



  整個電影是以飾演鋼鐵直男的許光漢為主軸，他這次除了有大突破演出，把一個不討喜的

  角色演到可以說服觀眾其實不容易，而且堪稱另類的得獎場，唱著舞孃跳鋼管舞需要對表

  演有很大功底。有一大亮點的是飾演同志車禍意外身亡的林柏宏，說誇張一點的是他演員

  生涯另一個蛻變，不僅把陰柔的氣質細節演出來，毛毛面對愛情的不安、婚姻的躊躇、親

  人的奢望，都表現傑出有層次，成功塑造令觀眾印象深刻帶有口頭禪的經典角色，這在一

  個喜劇電影是多麼困難的一件事，兩位主演確實有帶起喜劇節奏。

  而飾演擺脫花瓶刑警的王淨是電影裡的戲眼之一，戲份不多但表現得令人印象深刻，有把

  深沈的細節藏在表演裡，對於喜劇節奏的表演更進步了。而另一個大亮點是飾演同志爸爸

  的庹宗華，表面上我們看到固執的父親實際是不善表達卻富含溫暖，完全展現能收能放的

  表演。


  電影有大量的特效為電影增添很多看點，雖然我覺得追車場面有炫技嫌疑，但確實滿足台

  灣觀眾愛看大場面的心理，只是希望牛頓不會爬起來指指點點，鬼魂特效倒是還不錯，美

  術造型也相當用心，冥婚場面設計的很有風味。而且把鬼片的jump scare和氛圍運用成喜

  劇元素也頗具創意，音樂也誠意滿滿除了原創也把蔡依林歌曲也運用的巧妙，如果要說我

  覺得最可惜的地方就是電影醫院戲太煽情，但相信一定會有人掉不少淚，還好演員有撐住

  這場戲。


  可以看得出來程偉豪電影風格逐漸成熟，在紅衣小女孩開創台灣商業電影的鬼片里程碑，

  拍懸疑電影也比目擊者更具成熟，野心極大確實是對於台灣未來電影很重要導演之一，或

  許能讓台灣喜劇電影不只流於玩梗的表面，而是更深入議題和角色深度，和電影本身，如

  果台灣電影能成長到這樣蠻讓人欣慰。或許我們人人都會對於性別貼標籤，不管是直男對

  同志，不管是同性戀對異性戀，但關鍵還是在我們怎麼想。


  --'
