title: '[好雷] 關於我和鬼變成家人的那件事'
content: '松仁威秀TITAN剛看完，觀眾超過八成

  意外買到事先沒公佈的驚喜場，許光漢出席映後XDD


  許光漢本人真D帥，可以理解迷妹的花痴愛心眼



  滿分10分，給7.5-8分吧

  劇情精簡一點會更高分，後面在憋尿中度過zz

  男主角槍戰中受傷，上救護車時OHCA了

  結果送到醫院還能救活，真是醫學奇蹟

  飛車追逐的場景也是略顯浮誇


  整場笑聲不少，我笑點不高，不少地方有笑

  劇情走向很好猜，內鬼的人選就幾個人而已

  許光漢演的不錯，林柏宏更搶眼

  王淨沒太多能發揮之處，這角色對她來說太簡單

  許光漢大概很少罵髒話，髒話罵的有點尬


  庹宗華演技最好，但台語聽得出來平常不常講

  毛爸的自白不爭氣地哭了，邊憋尿邊哭…

  對比蔡振南台語夠道地，被毛毛附身也演得好

  兩個老牌演員就是不一樣


  掐指一算，票房應該有2億以上

  想看許光漢優異身材的粉絲千萬不能錯過


  --'
