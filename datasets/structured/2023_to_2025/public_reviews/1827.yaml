url: https://www.ptt.cc/bbs/movie/M.1700910583.A.3A4.html
title: '[好雷] 關於我和鬼變成家人的那件事 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  【好雷】關於我和鬼變成家人的那件事：人鬼殊途，同歸




  今晚就是金馬獎頒獎典禮了，這次的男主角入圍名單真的可說是顏值最高，看這入圍的照

  片，

  《關於我和鬼變成家人的那件事》的兩位男主角林柏宏跟許光漢可說是共同夾擊阮經天想

  要來個３Ｐ（還是其實是５Ｐ），這次你會投誰一票呢？




  其實很久之後才看《關於我和鬼變成家人的那件事》，但是在開演之前，覺得宣傳真的做

  得很好，許光漢被附身後唱著蔡依林的名曲《舞孃》唱著：「旋轉跳躍我閉著眼」後，從

  此腦袋就已經不斷旋轉著，我要去看我要去看我要去看。導演程偉豪還真的是無鬼不歡，

  拍的電影十部有九部都是靈異題材片，然後這次邀請的演員都是一線十分愛的，像是有怪

  物般新人之姿的王淨飾演警察林子晴，除了兩位男主十分吸睛外，配角像是販毒集團老大

  林孝遠（蔡振南飾）、毛毛的前男友家豪（炎亞綸飾）、張永康（馬念先飾）、毛爸（庹

  宗華飾）都是選得十分地好。




  都說喜劇要演出一個讓人刮目相看的層次不簡單，關於我劇的劇情鋪陳其實是起承轉合得

  挺恰到好處，從許光漢演的直到不行的直男警察吳明翰的鮮明恐同角色，到最後慢慢地對

  於

  林柏宏演的毛毛不討厭甚至是接受，就處理得挺好的。比較會讓人出戲的，大概就是王淨

  跟蔡振南大反派被發現的那個橋段，節奏似乎有點讓人不知所以。




  但就是因為這樣，讓喜劇的「荒謬感」更凸顯出來。既有喜感，又有淚中帶笑感。會讓人

  有洋蔥的點，大概就是關於LGBT關於愛與認同這件事，尤其是要怎麼跟家裡的人come out

  這件事，因為不管外面的眼光如何地看待，若是連最親的家人都無法獲得認同的話，那真

  的就只能死不瞑目(喂~)，所以第一個洋蔥點其實就是毛毛跟毛爸的對戲，其實毛爸內心

  是十分地關心毛毛，只是身為父親處理與表達的方式容易讓人誤解，第二個洋蔥就是毛毛

  被前男友劈腿，這其實說明了同志跟異男的愛戀也沒什麼不同，只是被劈腿後卻是悲劇收

  場。




  最後的第三個洋蔥就是毛毛願意捨己甘受魂飛魄散的風險，讓每一台車都移開，讓帶著吳

  明翰的救護車得以順利通過的那一幕，這一幕其實看完還常常出現在腦海中，什麼是家

  人?就是甘願捨身救己而不所求。那看這齣劇的你覺得自己改變了什麼呢？


  --------------------------------------------

  【當世界都在跟你說教】




  --'
