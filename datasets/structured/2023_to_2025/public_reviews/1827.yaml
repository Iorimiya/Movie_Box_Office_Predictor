url: https://www.ptt.cc/bbs/movie/M.1692457844.A.9E4.html
title: '[負雷] 關於我和鬼變成家人的那件事'
content: "抱著很期待的心看的\n\n畢竟應該是今年到目前最賣座的國片吧？查了一下，3億6380萬吧？\n\n以這樣的成績、票房，但我越後面越是忍著看完，只能說真想吐血\n\
  \n這部不算太爛片，但也不算是好片，更不能稱得上是佳、多讚的片\n\n↑以我的主觀來講啦\n\n想吐血的原因還不是覺得這片有點差\n\n是這水準竟是今年至今最賣座...國片真的是...不知道該怎麼講了\n\
  \n\n先講優點：\n\n1.題材還算有趣  2.同志議題  3.林柏宏、許光漢的「姿色」\n\n4.蔡振南的口氣，但他講話時間可能加起來只大於1分鐘吧\n\n\
  5.王滿嬌、劉冠廷、庹宗華的戲份都還可以，但同樣，每個人都很短\n\n6.林柏宏有過半（就是非全部）戲份滿俏皮、可愛，算演的還可以、討喜\n\n加上幾段不錯的部份：\n\
  \n7.飛車那段的前1分20秒，後面幾秒就...普通\n\n（這邊滿好奇是不是有些地方是經過後製動畫輔助？）\n\n8.移靈上車、路上、上樓這20秒\n\n9.在G空間愛無赦歌舞的40秒\n\
  \n（以上3點都是電影前半的戲份）\n\n好，沒了XD\n\n\n接下來後半段，越來越是忍著看\n\n直到結局時庹、許、林三人在病床前的感人戲碼似乎不錯？但我已無法太多感受\n\
  \n好，至此，優點真的沒了XD\n\n\n除了以上提的那些時間，在願意享受題材、接受二個男主的姿色下，勉強看完\n\n其它所有時間，能想像到的方面，諸如導演、動作、剪輯、運鏡、攝影、女主、造型、\n\
  \n台詞、場景、口白、音效等等等等\n\n只能說平庸、平淡、很入門感\n\n以一開始前5分鐘就有的許光漢在健身房摔人那一鏡頭來舉例，以此來示整片：\n\n就鏡頭對著摔..這樣而已，就跟看運動摔角比賽那樣而已..\n\
  \n沒有一點鏡位轉換、視角切換、聲音的加持\n\n\n然後不知道是我對自己的語言沒有信心了？還是因為聽懂、熟悉才要求過份？\n\n或者是國語（中國那邊稱我們這叫普通話吧）語調實在不容易演？\n\
  \n我還是覺得聲音演技上，戲份最多的二男主、一女主都還是演得不好\n\n\n還有很多地方，像上面講的其它所有時間、能想像到的方面，別說不完美，是都不太好\n\n\
  我也不是專科出身，不太會鉅細靡遺地講出專業問題\n\n只能說一路上到看完片\n\n要不是有一開頭講的那些優點\n\n我是不可能忍得住看完的\n\n我看的韓國片雖然不多，才5~10部，雖然都是挑網路上評價很高的來看\n\
  \n但這些韓國片都可以讓我投入、直至看到完還津津有味\n\n以一個目前今年最賣座的國片水準\n\n竟然是無法讓我這個不專業、純看熱鬧的人也投入到底的水準，想當然爾我會很嘔XD\n\
  \n\n還有一點缺點，充斥著整片，就是想拖的感覺\n\n像是明明可以20秒卻硬要弄成25、30秒，這企圖我主觀覺得明顯了點就是\n\n感覺拖一點點、慢一點點，似乎就有了人文氣質一樣XD\n\
  \n又感覺是一部東拖、西慢，總能偷到、湊到一部電影所需要的時間一樣\n\n\n從以前滿多的國片，到現在我看的鬼家人\n\n怎麼還是來這一套？\n\n（設定如一開頭所述的1~9優點，用題材、用議題、用票房明星、用大咖明星短短的加持\n\
  \n　用短短還可以、還不錯、或感人的短短片段、用拖與慢來顯示人文素質...\n\n  用以上這些，來包裝整部電影工業工藝，導致這方面過半、甚至八成以上乏善可陳..\n\
  \n\n  國片滿多以這種「票房明星號召、剪輯精彩的當預告」，等到上映時，只希冀觀眾\n\n　看到某一短段影片時會笑、會叫好、會哭，然後還能從慢中體會意境XD\n\
  \n  然後總是忘記、不提，因為最難、最不好做的地方，也是電影生意盎然的基礎本質\n\n　就是能不能讓觀眾，投入地看完一整片，且帶來隨之的情感、情緒、感官享受）\n\
  \n\n看這種片我是覺得時間若多，在網媒上可勉強加減看\n\n若要去電影院看，是吸引不了我的\n\n\n（抱歉，打一堆字沒很斟酌字詞，希望不會引起錯誤的意會）\n\
  \n--\n通常都是看歐美片，很少看韓國電影，會找來看，都是那時自己片慌下的抉擇\n所以找的都是稍有、滿有名氣的韓片，從大眾流行話題找來看的\n沒資格用推薦，因為不熟，在網路上搜一些每年韓片推薦名單，十之七八我都沒聽過\n\
  其實現在還是不會特地找韓片看，不知為啥？可能是看到人家拍得好看時，有點惆悵？\n像今年我只一口氣找了犯罪都市、犯罪都市2、犯罪都市3，看三片而已（3明顯遜於1）\n\
  回憶了一下大概看過的有原罪犯、偉大的隱藏者、屍速列車、我的野蠻女友、雞不可失\n駭人怪物、大叔、與神同行、與神同行2，可能還有，但想不起來，大多都很大眾化吧?!"
