title: '[好雷]關於我和鬼變成家人的那件事~好長的片名 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這部真的不錯，很可以看！

  畫面好看！演員演技很棒！

  編劇把很多梗都串在一起，看了非常輕鬆有趣捧腹大笑，喜歡看喜劇可以去紓壓一下！

  有很多驚喜的亮點.....笑點非常打中我，蔡振南那個part真的崩潰好笑....

  哭點的部分我比較沒辦法被觸動到，

  但對於有些人應該是可以蠻好哭的....

  許光漢好適合演這個角色....正義直男！各種臉部表情再升一層樓！

  林柏宏的聲音簡直印在腦海中，離開電影院都一直響著"不敢相信"，我幾乎忘掉他以前演的所有角色，洗腦太成功了！

  王淨實在好適合大銀幕，有她就是好看，而且她的角色人設設計得好棒！



  以下有雷
























  撿紅包的梗設計得很有趣，

  本來想說這個梗還可以怎麼變化，這齣戲給了有趣的亮點！太好笑了！

  但話說林鶴軒到底是哪一幕有出現？為什麼我好像在片尾看到他的名字？？？




  --'
