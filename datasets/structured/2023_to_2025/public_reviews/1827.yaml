title: '[普雷] 鬼家人'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  先說結論：優質小品，但不建議進院觀賞。


  個人看電影習慣是連預告都不看，避免各種雷或腦補


  但這部片被很多人說超棒，所以期待很高，但看完真的很失望。


  整個劇情可以切成兩部分來看，主線就是讓毛毛投胎，副主線就是各種搞笑


  主線煽情做到了、情緒也有了、各種刻板印象也齊全了，但看完，也就這樣，尾聲劇情很催淚。




  這部賣點就是各種衝突跟刻板印象，但我看完的感想就是嫌直男不聽人講話，同志何嘗不是。


  電影裡面，劇情的推動都是許去主動（我看完還是記不住他叫什麼），雖然許是為了自己。


  毛認清事實，許幫毛完成遺憾，這些都不是毛主動請許幫忙，看完只覺得許是濫好人，為了

  一個非親非故的這麼付出。

  整部劇情就是及格的小眾電影，但論我後悔進院觀影程度，應該可以有前三吧。




  -----

  Sent from JPTT on my iPhone


  --

  s

  他不願傷害兒子啊，但毛毛有想過為什麼嗎？

  事情都是一體兩面，毛毛就是自詡悲情主角，覺得沒有人理解他，蔡依林的MV也是這樣演的，毛毛就是一廂情願的想法，變成好像都要別人主動了解他。


  就電影做的好像很到位，但我接收到的情緒都沒有延續，沒感覺可以順著哭或是笑


  我看完想法是，我應該等串流就好，對我來說不該買票進場看。

  看完有感動的地方就值得進電影院看，媽的多重宇宙我也是看HBO，我也覺得看串流就好'
