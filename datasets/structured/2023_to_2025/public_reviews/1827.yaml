title: '[  雷] [好雷］《關於我和鬼變成家人的那件事》'
content: "這部片看完好一陣子了，看它紅成這樣就僅存的印象也來分享一下心得好了，其實一開始\n預告片出來的時候就覺得驚為天人，整個故事設定跟剪接都很有趣，所以上映沒多久就跑\n\
  去看了。\n\n開頭的氣氛其實有點詭異，大概換個方向拍就是恐怖片了(抖)，然後雖然之前就知道是劉\n家凱製作配樂，不過在音樂中隱約聽到家凱的歌聲還是覺得很妙，而且旋律跟歌詞的come\n\
  \ with me有夠洗腦XD。\n\n------------以下滿滿雷--------------\n\n前面的飛車追逐畫面很用心，但真的會疑惑是不是花了太大批的警力在追一個人XDDD，是\n\
  說後來看花絮才知道都是特效還滿厲害的。\n\n兩個男主角的性格反差搭在一起很有萌點，許光漢之前沒有看過他的作品所以不知道他在\n紅什麼XDDD(太失禮了)，但看完這部真的一秒圈粉，這腳色演得活靈活現，連被車撞飛的\n\
  姿勢都很棒，被附身的戲實在太自然太好笑太敬業了XDD，吳明翰跳舞孃那個的笑容一直\n在腦海裡揮之不去，而且可能裸露的鏡頭很多，看著看著已經習慣裸體了(天啊)，劉冠廷\n\
  那一段更是畫龍點睛啊!! 不過說真的毛毛整吳明翰真的下手好重啊....\n\n夜店那一段相視的戲真的滿讓人心動的，但是也想跟毛毛說請自重XDDD，然後有炎亞綸出\n\
  現還滿驚喜的，覺得他演戲也很自然，期待他推出有趣的作品~\n\n林柏宏之前就滿常看他的電影，這部表現依然是可圈可點，有點傲嬌跟任性的腳色意外的\n滿適合，熱愛環保的設定超煩XD，用恐怖的臉說：「你的環保杯呢~~?」真的好逼人XDDDD\n\
  ，覺得查案子的時候毛毛抱著吳明翰的手特別可愛，而且那個「不敢相信」太洗腦了，看\n完電影好一陣子都會想要講這句XDD\n\n子晴的部分真的想不到她的腳色如此關鍵，跟蔡振南那一整段超煩XDDD，不過她的腳色在\n\
  警局有時候感覺有點突兀，可能是長得實在太漂亮太精緻了XDD(喂)，之前看王淨演的腳\n色好像都比較苦，這次真的滿讓人眼睛一亮，希望能看到她演更多喜劇XD\n\n\
  最後救護車那一招很有創意也很感人，然後到醫院那一段，我內心其實好像沒有覺得特別\n感動，但不知道為什麼回過神兩頰都是淚XD(天啊)，許光漢的哭戲太有感染力了，是說毛\n\
  毛說有看到爸爸都用環保餐具超煩XDDD\n\n結局的部分很溫馨很喜歡(是說站起來沒穿褲子也太自然XD)，雖然毛毛沒有再回來，但讓\n吳明翰跟奶奶他們連結為一家人的感覺很棒！\n\
  \n整體來說還滿有趣的，真的是有笑有淚而且很有梗XD，不過感覺整部電影可以再縮短緊湊\n一些，主線劇情如果更有緊張感一點會更好，覺得年紀大了以後越來越需要這種看完餘味\n\
  很好的療癒喜劇，希望台灣可以再多一些這種片子，也很期待導演跟演員們未來的作品！\n是說看完這部才驚覺(?)許光漢真的長得很好看，演技又很有魅力，之後可能會去找想見\n\
  你來看一下XDDD\n\n最後致敬一下電影海報XD\n\n\n--\n\n謝謝～\n推～\n謝謝～\n感謝！\n祝你下次可以遇到喜歡的片～\n煩煩的又沒辦法不理他w\n\
  網飛怎麼會沒有呢～\n真的不是XD\n謝謝\n確實是有點假假的，不過動態很順暢可以考慮拍動畫片XD(大誤\n很棒\n這部真的感覺有機會在韓國紅一波\n真的希望出國也大賣特賣～\n\
  謝謝！\n應該不會差才是XD\n讚讚\n超洗腦！故事設定是真的很有趣～"
