url: https://www.ptt.cc/bbs/movie/M.1677261249.A.B00.html
title: '[無雷] 關於我和鬼變成家人的那件事 節奏怪怪'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  今天看了關於我和鬼變成家人的那件事

  整體來說還不錯 屌打蟻人3


  許光漢 林柏宏 賞心悅目  演技都有在線上

  庹宗華也是很會演 但他聲音真的跟庹宗康好像 (最近看太多營業中 微出戲)


  不過以一部喜劇來說 雖然影廳滿場

  但好像沒有哪一段是有全場大笑的

  就是有笑點  可以聽到笑聲  但沒有全場笑到翻那種

  雖然可以感受到編劇很努力在想笑點了 但總覺得笑點的節奏哪裡怪怪的


  然後髒話多 雖然可能想營造親切感 但好像太兇了??

  有時候髒話多 太兇的話 好像反而不太好笑

  感覺導演在這部分的指導太用力了


  劇情的話就是用冥婚包裝的大鍋炒劇情  (就警匪賀歲片)

  我一直想到小栗旬Border靈異界線影集

  (Border中間有一集超級感人 比關於我和鬼還感人)

  可惜許光漢林柏宏現在都大咖了 不可能再合體演電視劇

  不然感覺這種模式蠻適合演影集 每一集破案的劇情


  然後關於同性戀的描述   我是不曉得同志怎麼想

  但同志看到電影裡面一些刻板印象  真的會開心嗎XDDD

  一開始就有提到以藥助性的事情 雖然真的蠻多的 但感覺同志不太想提這個事


  整體來說還不錯啦  近期檔期最好看的了

  分享一下


  --'
