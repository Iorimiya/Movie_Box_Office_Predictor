url: https://www.ptt.cc/bbs/movie/M.1683110454.A.D45.html
title: '[情報] 關於我和鬼變成家人的那件事  香港票房'
content: '鬼家人票房表現不太理想

  香港4月27日上映，在首週是最大規模排片的情況下，場均人數只有三十幾人，連同

  優先場累計460萬港幣，雖然前天官方新聞稿說已破600萬


  這個檔期算很好，沒有好萊塢大片，又避開香港本土去年最紅的新導演何爵天的喜

  劇新作，再加上中國51長假，這票房有一部份是中國人跑到香港看撐起來的，電影

  在豆瓣評分高達誇張的8.9分，感覺有在刷分，這幾天觀察就發現有類似暱稱相同頭

  像的帳號反覆留言評分，內容大同小異，8.0分左右比較合理


  相反鬼家人在香港評價一般，雖然比何爵天的喜劇新作死屍死時四十四好一點，但那

  片畢竟是香港本土電影，講的又是樓市，香港人會更有共鳴，所以票房已破兩千萬


  鬼家人可能因為同志題材，再加上是台灣拍的喜劇以及很長的片名讓人卻步，過往台

  灣電影在香港大賣幾乎都是愛情電影，近年票房能破千萬的非愛情電影只有一部返校


  這星期三位演員要到香港謝票，可望再衝一波票房，新加坡就是第二週票房比首週高

  但不一樣的是新加坡一開始是小規模上映，再加上R21級限制，是靠著口碑傳播，目

  前還在院線撐著，跌幅很低，慢慢磨票房，雖然目前也只有四十幾萬新幣，但鬼家人

  在香港評價一般，票房要再成長可能有難度


  目前海外賣最好的是越南，超過130萬美元


  --'
