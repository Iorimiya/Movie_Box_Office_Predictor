url: https://www.ptt.cc/bbs/movie/M.1676034881.A.885.html
title: '[好雷]關於我和鬼變成家人的那件事_要帶面紙'
content: '上半部無雷 下半部有微雷



  什麼許光漢要冥婚?什麼還是跟林柏宏!?

  雖然我認為這部電影應該還是粉絲向

  但我也稱不上這兩位的粉絲(但是想見你真的一生推)

  可是光是同志、冥婚、許光漢幾個關鍵要素已經讓我下定決心一定要去電影院看啦

  所以幾個月前看到這部片的消息時就已經迫不及待的還記在行事曆上


  ....我以為是很歡樂的電影，沒想到我會哭的這麼慘

  完全忘記帶面紙 整個超狼狽

  因為外面飄小雨 我的外套還是防潑水的材質無法吸水=.=

  只好用戴著的口罩偷偷擦我的淚

  一邊抱著背包擦我的眼鏡片，不然真的看不到前面了

  真的看得很狼狽，哭點低的一定要多帶點面紙QQ






  =======下面有雷 防雷線============


  其實一開始我很無法理解為何劇情要營造主角明翰(許光漢)是一個討厭同志的形象

  像是同事還會調侃說你還打同志(打GAY高手4ni?

  sue gay?

  或是看到紅包袋裡的男生照片說很噁心怎麼是男生之類的

  但是他的同事小胖不就是GAY嗎 小胖說我是胖子又是gay 且都差點直接告白了

  可是他也沒有討厭小胖啊

  還是戲中描述的直男就是只在乎自己比較蠢還不知道小胖是GAy


  阿嬤很可愛 雖然年紀大但是心態比年輕人開放

  但是我覺得如果他不喜歡男生就不要逼他比較好

  否則兩個人冥婚後也不會幸福啊

  紅包袋怎麼不去毛毛最愛的gay bar前面丟呢

  啊不對 歡場的男子也不是好對象 不好意思扯遠了


  毛毛(林柏宏)的前男友應該就是那種標準的渣男

  毛爸(庹宗華)帶了三個「蚵仔煎」去幫兒子提親的時候

  不小心看見毛毛的前男友(炎P)出軌現場

  所以回來才找藉口拒絕毛毛結婚的要求



  ↑這個心理測驗真準 選擇蚵仔煎的人被渣男收服的指數最低



  毛毛說怎麼辦如果我心願是要找到一個愛我的人才能投胎

  那我就永遠沒辦法投胎了


  算命的說兩個人前世有一段很深的緣，明翰就是毛毛前世養的狗。

  明翰很可愛的安慰毛毛說沒關係你前世養我，這輩子我養你啊

  反正養你都還不用花飼料錢。

  這段品翰的魅力滿點真的整個三魂七魄都被品翰勾走了

  我想毛毛應該真的愛上品翰了，

  (雖然他後來嘴硬說什麼

  當時假裝去投胎其實是覺得這一輩子都要跟他在一起很恐怖所以落跑了XD



  阿嬤不是說冥婚會旺夫!其實沒有你我活不了!


  當明翰被槍打進心臟血流不止的時候

  可是救護車送醫途中卻塞在路上

  毛毛用僅存的一點魂魄一個一個的附身去一整條路上的駕駛

  把車往兩邊開去人行島上讓開中間一條路讓救護車能及時送醫

  這邊是我哭最慘的 戲院裡也突然很安靜也有聽到幾個人在啜泣的聲音

  真的太感動了 QQ

  對應到了電影前面剛開始不是飛車追毒販的時候被兩輛車卡住

  阿嬤不是說冥婚旺夫果然是真的吼


  以後路上的紅包記得撿啊 各位姑爺早日脫單






  --'
