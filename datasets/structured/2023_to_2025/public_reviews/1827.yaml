title: '[好無雷] 關於我和鬼變成家人的那件事 花瓶場'
content: '先說結論

  真的好看 比奇異博士2跟黑豹2好看不知道幾百倍

  (很主觀 不要鞭我)


  劇情很強，如果你單看這部片的元素可能會想說

  "阿不就gay跟直男跟冥婚的喜劇，差不多就那樣吧~"


  錯，大錯特錯!

  務必去看，好劇本跟好演技不該被埋沒

  劇本結構很完整，入場前完全沒有想到這麼強

  (或是我已經被漫威第四階段弄壞了)


  每個段落的強度都很厲害

  搞笑就是大笑 情感戲就是會掉淚


  而且全程真的無尿點

  看的過程精彩到無感時間流逝

  散場才發現原來已經兩小時過了 我跟朋友都嚇爛


  好 我有點怕把大家期待拉太高

  總之很好看，沒有太出戲的地方，至少我跟朋友都沒有

  對我來說一張電影票的錢可以讓我不出戲

  好好的笑好好的哭我就覺得很超值了

  (奇異博士2跟黑豹2真的出戲到爆 白眼都快翻不回來)


  希望大家有機會也可以去電影院體驗一下順便支持國片~




  --

  對阿尤其我是看完媽的多重宇宙之後去看

  真的是.....

  .......無言...



  這個要講的話可能會爆雷哈哈哈

  前面有講到飛車

  就飛車來說

  我花了八秒大概兩三個鏡頭才確認是動畫

  發現是動畫的當下當然是有點點出戲


  其實出戲的都無關劇情啦~

  像是拳頭打下去就明顯沒有打到阿之類的

  所以就會有一點點被拉回來



  抱歉啦很主觀 可能是很久沒有被電影娛樂到

  但影廳內的大家是真的又笑又哭不誇張

  我不是喔，只是一般路人，朋友最近要出國沒辦法看 所以搶特別場

  不瞞您說 我也是看其他人都有標我才標的 我還以為是什麼次文化還是什麼潛規則'
