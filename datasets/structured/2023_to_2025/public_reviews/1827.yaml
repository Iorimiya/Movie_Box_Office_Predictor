title: '[討論] 關於我和鬼變成家人的那件事  小細節'
content: '不知道該歸類是小彩蛋還是小細節

  總是" 關於我和鬼變成家人的那件事 "有不少劇組安排的可愛的小巧思，比如:





  ( 以下算有一點雷  所以空一下 )






  1. 吳明翰的警員編號是59487 (我就是白癡)


  2. 吳明翰開的車子  車牌是GY-9487


  3. 公園撿紅包的那場戲  毛毛阿罵用來遮(偽)臉(裝)的報紙上面寫了"金盞花新片破億"


  4. 冥婚現場  門上寫的是"永結同志"


  5. 吳明翰被毛毛附身後，隔天跑去找幫他們證婚的師公求助，那間廟叫做"正港北瀾宮"


  6. 林孝遠家裡(?)的牆上有掛他的肖像畫


  7. 毛毛結婚時的紙紮裡  有一隻跟小毛一模一樣的狗



  其他歡迎鄉民補充!!



  p.s 據說片尾名單有初音未來，有人找到出現在哪嗎?




  --'
