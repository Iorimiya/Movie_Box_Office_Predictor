url: https://www.ptt.cc/bbs/movie/M.1678788030.A.DA2.html
title: '[超好雷] 關於我和鬼變成家人的那件事'
content: '【關於我和鬼變成家人的那件事】講述一位恐同的年輕警察被迫和一個同性戀死者冥婚，


  並引發後續各種荒謬離奇的事件。

  -


  覺得程偉豪導演的前幾部片都滿可惜的，


  他算是很能堆疊懸疑感的台灣導演，劇情都引人入勝，


  但看完總覺得就是少了點什麼，而且後段常常拍得不如前段精采。


  像【紅衣小女孩1 2】到第三幕有明顯的特效出戲，


  【目擊者】和【緝魂】都不錯，只是結局的力道好像差了點，


  整體上我都會覺得是佳作，但也不會把它們歸類在年度必看的電影。


  雖然如此，依然能透過這幾部作品看到他不斷突破與嘗試，


  製作技術越來越純熟、劇本也下了許多功夫。


  而我認為他累積的經驗與實力終於在【鬼家人】得到全面性的回饋。

  -


  這部融合了靈異、搞笑元素，並利用主角的人設製造很多衝突和笑點，


  隨著故事進行，恐同的男主角慢慢地對這場冥婚改觀，


  甚至最後沒有要離婚的意思了（我自己覺得有點誇張XDD


  故事架構其實偏老梗，但拍出來的效果很好。


  笑點很多，我看的那場充滿歡樂氣氛，聽毛毛時不時就來一句「不敢相信」、


  婆婆媽媽的標配行為、主角各種雖小不情願、最後刻意老梗的槍戰跟內奸戲碼，


  都很讓我印象深刻。


  而特效不足的地方，導演懂得用故事本身的張力來藏拙，


  當然也因為是喜劇，對特效的部份就比較不嚴格XD


  然後許光漢和林柏宏的表演幫電影加超多分，兩人有很多化學效應，


  我很開心劇本沒有把他們最後安排成情侶，而是變得像好搭檔。


  其餘像王淨、蔡振南、馬念先也都演得不錯，整體演出都在水準之上，


  大家也不會因為在演喜劇就放掉該嚴肅的地方。


  除此之外，這部在恐怖、搞笑、劇情反轉多種調性切換得流暢，


  最後還丟一顆大洋蔥，真的該有的娛樂性都沒少。


  -


  除了明顯CGI的飛車追逐，幾句微出戲台詞的國片老毛病，沒什麼大缺點。


  我上回商業片看得這麼開心已經是半年前的【子彈列車】了，


  不覺得臺灣有其他人能拍出這樣的商業片，


  也覺得程偉豪在這部的調度比上一部【緝魂】更值得入圍金馬導演。


  期待他的下一部作品！



  --

  確實，不過喜歡這片所以還是想稱讚一下。

  我的意思其實是最後主角樂於接受這場冥婚，沒有想要離婚的意思XD

  希望台灣能有更多商業片。'
