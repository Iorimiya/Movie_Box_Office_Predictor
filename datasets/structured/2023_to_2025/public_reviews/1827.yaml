url: https://www.ptt.cc/bbs/movie/M.1679804200.A.D5E.html
title: '[新聞] 關於我和鬼變成家人的那件事票房破3億'
content: '關於我和鬼變成家人的那件事票房破3億 國片第8名


  中央社記者王心妤台北25日電


  電影「關於我和鬼變成家人的那件事」口碑票房受好評，2月10日上映至3月23日止，全台

  票房累計為新台幣3.38億元，成為台灣影史國片票房第8名，同時暫居今年最賣座國片寶

  座。


  台灣影史國片票房第1為「海角七號」，第2至第7依序為「賽德克楔痤隉]上）：太陽旗」

  、「那些年，我們一起追的女孩」、「大尾鱸鰻」、「我的少女時代」、「當男人戀愛時

  」、「KANO」，而「關於我和鬼變成家人的那件事」票房成功超越「陣頭」，排行第8。


  「關於我和鬼變成家人的那件事」由程偉豪執導，他曾執導「紅衣小女孩」、「目擊者」

  、「緝魂」，創作類型多元。新作「關於我和鬼變成家人的那件事」融合靈異、偵探、喜

  劇。劇情描述警察許光漢在辦案蒐證時誤撿地上紅包，被迫成為同志冤鬼林柏宏的冥婚「

  老公」，攜手緝毒追凶，展開笑中帶淚的旅程。


