url: https://www.ptt.cc/bbs/movie/M.1676213297.A.E3F.html
title: '[ 好雷] 關於我和鬼變成家人的那件事：不敢相信'
content: '我已經三刷了，不敢相信！


  在1月時看過家宴特別場，覺得2個小時咻一下就過了，整場又笑又哭的。

  當時就決定正式上映後還要二刷、三刷。

  結果二刷、三刷後還是哈哈笑死，後面嗚嗚哭爆，不敢相信。


  一直覺得有些電影題材是只有台灣能夠拍出來的，這部就是一個很棒的例子。

  我想像不到還有哪一個國家能夠拍出：臭直男、死掉的Gay，然後他們還冥婚了，最終變

  成家人的故事。


  毛毛他是同志、是環保人士，愛護流浪動物；明翰是臭直男，還恐同；子晴是大家口中的

  花瓶。


  但後來子晴告訴大家，就算她是花瓶，那也是超辣超猛的花瓶。

  他們身上都有一些標籤，但撕不撕標籤其實無所謂，標籤底下的這個人是怎樣的人才是最

  重要的。


  毛毛就像我們日常生活中的gay朋友、明翰也是我們某個講話有點白爛、很直，但其實本

  質很溫柔的人。


  這部電影裡面有很多的議題，但並不會有說教感，沒有任何一個角色必須去「做」什麼，

  他們就只是走在他們選擇的路上而已。



  （以下有大雷，沒有看過電影千萬別看，會影響電影體驗。）










  許光漢和林柏宏演技真的讚，毛毛有夠可愛，到底哪裡能撿到這種SSSR紅包，拜託請告訴

  我，我直接蹲點。


  雖然這不是BL，但我非常喜歡明翰和毛毛兩人間的互動和隨著劇情加深的感情。


  不是戀人之間那種愛情，而是家人間的愛。


  明明就吵架了，都把神主牌帶到渣男家裡，結果演變成明翰暴打渣男現場。


  明翰吼：「你把毛毛弄哭了啦。」


  或是用直男方法安慰毛毛，笑著跟他說我穿了你挑的內褲哦。

  又說養狗還要花飼料錢，養你又不用，上輩子你養我，這輩子我養你啦。

  後來又說毛毛騙他感情XD


  明翰早就不知不覺把毛毛當成自己人了，很護著他，可能明翰自己都沒發現。


  最後在救護車上，毛毛說雖然自己已經死了，但不準明翰來陪他。


  明翰說：「雖然你說死人都沒有在認識的...但我認識你了啊...」


  在救護車上被問說你到底在跟誰說話？


  明翰：「跟我…老…公。」


  看到這邊，我是毛毛我也會做出相同的事情的。


  明翰之後醒來第一時間也在找毛毛，找不到還：「毛邦羽…你不要嚇我。」


  我：嗚嗚嗚嗚嗚嗚QAQ

  好多人跟我一樣，從救護車那邊就開始大噴淚到結尾。


  毛爸和毛毛的親情線也很催淚

  毛毛的阿嬤和三姑六婆親戚部分我也好喜歡，看了三次我還是會笑出來。

  老牌演員果然厲害啊


  也非常喜歡結尾的部分，毛爸阿嬤和明翰的視訊，最後帶到毛毛照片那邊。

  毛毛雖然已經不在了，但怎麼說，對明翰來說他永遠都在的吧。

  呼應了這邊電影的片名，毛毛是他的家人啊。


  真的很推薦大家去看，兩個小時沒有冷場的笑笑哭哭，而且演員們和主創都很認真在跑宣

  傳。


  不然，光是蔡振南的那句：「不敢相信。」就很值得大家買票進場了。


  偷偷說一句，雖然明翰還是臭直男，但我覺得他這輩子不會結婚了XDD













  --'
