content: '沒錯...剛開始的地方特效非常無言

  還以為在看遊戲動畫..

  最後車子卡住那邊, 全場觀眾傻眼(因為聽到不只一個人說 "蛤???")

  有看的人就知道... 這太扯了吧

  已經是小學生都會覺得奇怪的畫面了


  滿滿的尷尬感  還好後面沒出現了

  前面真的尷尬


  就像你說的 前後呼應  但又做半套  滿硬轉的

  不會讓觀眾有 "哦~~~原來是這樣啊" 的感覺


  整部片就爸爸演得最好, 沒有之一

  要是這部片沒有爸爸的戲份, 可能會很慘....



  整體來說, 算是還可以殺時間的國片

  但是如果要說 超好看  超感動

  真的不需要..



  但還是可以給這部片很多鼓勵, 已經是進步許多的國片了

  而不是只有愛來愛去的老梗

  假如韓國電影現在的等級是10, 這部片差不多就是初級1~2的程度


  可以去看, 但不用抱太大期望


  給還在觀望的人一點參考~




  --'
