url: https://www.ptt.cc/bbs/movie/M.1677692183.A.F3A.html
title: '[好雷] 關於我和鬼變成家人的那件事'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  本來連假是打算看別場電影的，不過因為預購的票遲遲沒送到，

  本來想改看灌籃高手的，但是因為我妹推這部片所以只好當天改支持一下國片這樣。



  先說結論，這部片搞不好有紅到國外的潛力，裡面描述的是十分可愛的台灣文化。




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  首先第一個吸引到我的點是在最開始的追車場景，因為那個動畫感太重了，看起來就

  不像是直接在馬路上實拍，出電影院之後馬上就猜應該是UE和虛擬攝影棚技術。


  老實說這個技術十分的創新，我第一次親眼看到是在2020年Sony的CES攤位，對於製作團隊

  已經有辦法把它放在商業作品上面感到十分的佩服。



  只是讓我這個外行人看出來是用UE和虛擬攝影棚應該就代表還有一點努力空間存在。



  再來是整部片裡面可以發現團隊想要帶給觀眾超大量的「觀念」，例如環保杯、捐錢給環

  保團體、認養寵物、女性職場歧視、反核旗、救護車讓路等等的，太多了，反而讓劇情主

  線印象失焦，但是如果轉一個方向去想，這個就像是同志遊行裡面的感覺，他是十分多元

  的，有各種聲音百花齊放的。


  在這之中我最喜歡的橋段是在毛毛和吳明漢講子晴是個警察，不是真的需要被保護的對象

  因為在現實生活中，我們確實很容易不小心就讓某個人的性別或是性傾向所帶來的標籤蓋

  過對方在這個職位上的專業能力。


  這部電影裡面其中我一個很在意的點是母親角色的消失，這部分也許有想像空間，也許

  毛毛的背景其實也是來自一個同志家庭，只是因為是沒有婚約的時代，所以父親被背

  叛過，不願意兒子走上一樣的道路，所以才和阿嬤說好要守好這個秘密。


  另外是父親角色的劇本設定，原先我以為會是有更強烈的轉折或是更鮮明的人物輪廓，

  讓父親從原本反對變成支持，在另一部台灣探討社會議題的作品「我們與惡的距離」中

  「沒有一個爸爸媽媽會花二十年去養一個殺人犯」很鮮明的去刻畫出了在鎂光燈壓力下

  作為加害者家屬的痛苦。


  在這部戲的父親變成只是因為不擅於表達因此失去兒子的角色感覺有點張力不足，雖然

  是有點真實過了頭就是了。


  演技部分我很喜歡在跟監行動要被識破時子晴靈機應變演成怪罪男朋友路痴的部分，真的

  要說的話就是一般的刑警真的有這麼厲害的演技嗎?XDDD


  然後有個我覺得很可惜的點，整部片裡面有些警察處理程序其實是不太合法的，例如偷行

  車記錄器裡的資料作為證據，一來是會讓民眾誤以為因為是警察辦案，所以這樣做可以，

  二來反而會增加不知情的民眾對警察的期待，原先我以為會是公開在某公社徵求影片，然

  後發現某個路人拍抖音上不小心拍到了事發經過上傳網路的發展，結果居然是違法取證。


  最後一個想分享的應該是初音的位置，我猜是吳明翰在看的A片的日語配音。

  因為日語發音聽起來沒有台灣人的腔調，但是演員名單中沒看到其他日本人，

  另外是A片應該還是有著作權，所以如果要使用真實的片源的話結尾應該要附上番號才對。


  希望我的推理是對的。


  --

  人紅是非多，活益比非多。


  --'
