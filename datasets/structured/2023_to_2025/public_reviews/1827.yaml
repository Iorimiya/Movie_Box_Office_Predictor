url: https://www.ptt.cc/bbs/movie/M.1676920200.A.C3F.html
title: '[好雷] （內有疑問）關於我和鬼變成家人的那件事'
content: '（第一次在版上發文，分類若有錯誤再麻煩大家告知，謝謝！）


  首先恭喜票房破億！！！


  但還是要抱怨一下

  片名真的好長哈哈哈哈哈哈

  花很久的時間才記住XD

  剛剛還去確認一下有沒有打對

  目前跟朋友聊天都以「鬼那部」代稱XDDD


  -


  先提出疑問

  我目前只有看過一遍

  但看完後對於工作人員名單上

  有些字被變成紅字很不解

  就…看不出一個所以然

  有想過會不會是彩蛋之類的


  剛剛有稍微爬文看有沒有人討論

  但沒有看到（也可能我比較目小）


  於是想來問

  版上刷了很多次大大們

  知不知道為什麼

  或是有參加影人場的大大們

  導演有說過關於這個部分的事嗎？








  覺得有點可惜QAQ

  本來以為會是藏頭之類的哈哈哈哈

  還很期待是不是有什麼特別的涵義


  —————————以下有雷—————————











  來說說有雷的部分！

  （完全想到說什麼，希望不會太亂）


  1. 在上映前看到預告片後就很期待，看完後覺得是近幾年好看的國片，雖然有一些小缺

  點，但又好笑又感動，覺得錢花得很值得。


  2. 真的太喜歡林柏宏在裡面的樣子了，有夠可愛，而且覺得他好適合這個角色！不過希

  望他有機會接觸其他類型的角色，例如反派之類的，感覺他有一點被定型了QAQ


  3. 很喜歡蔡振南被毛毛附身那段，超厲害！！超會演！不愧是老演員！！！那個不敢相

  信一整個笑爆


  4. 劉冠廷的台詞不多，但一舉一動都是笑點，從陽光普照後就持續關注他，蠻期待他日

  後的發展！


  5. 整部電影埋了很多梗，每次發現時都很驚喜，也完全感受到他們的用心！例如：0號1

  號、吹狗螺（希望大家看得懂XD）......等


  6. 最後的反轉超級出乎意料，同時也覺得王淨在最後那段的表演比較自然一點，前面有

  種說不出的怪，但也可能那樣比較符合角色的設定，只是我沒有get到


  7. 被毛毛鬼的樣子嚇兩次，第一次出現時超不解為什麼會是那個樣子（頭歪一邊），但

  後來解釋時有恍然大悟的感覺，但那真的有點恐怖：）每次出現必定嚇到ORZ


  8. 跟朋友對最後面毛毛附身在一個兄弟身上，然後去親其他人那邊很印象深刻，完全沒

  想到會是那樣的發展，也覺得演員很厲害！




  整體上真的蠻喜歡的，朋友算是超級不愛看國片，對國片不抱太大希望的人，覺得劇情很

  容易猜到，演員演技可能沒有那麼好或者是拍攝技巧不像國外那麼厲害，結果看完後也覺

  得不錯，除了對某些地方的小吐槽之外XD


  我自己算是很常支持國片，但很容易看完後覺得「啊...不太好看，或是我到底看了什麼

  啊

  ...」的失望感，而這部在我心中評價蠻高，有機會會想去二刷，目前瘋狂推薦身邊的朋

  友

  去看，看到很多朋友都有曬票根蠻替他們開心的！


  現在對某些劇情內容有點忘記，但完全記得自己笑得很開心，後面也哭得很慘就是了TAT


  --



  感謝f大的推薦，我有看過無聲跟怪胎！


  個人還蠻喜歡無聲的，甚至還去二刷哈哈哈哈哈，很喜歡那位韓國演員和陳姸霏的詮釋，

  但這真的是一個難過的故事，每次看都覺得有些微的不舒服。


  怪胎覺得題材很酷，視覺上是一種享受也很驚艷，不過沒有那麼喜歡結局QAQ


  詭扯我會找機會去看的！謝謝！



  這邊附上底下Y大那篇，oaeenforever推文裡的影片，大概在5:50有導演的回覆。



  本來還以為會是藏頭之類的QAQ

  得知真相後有點失落哈哈哈哈


  感謝Y大跟l大的回覆

  我果然目小QAQ




  應該要補充一下是台語，在民間傳說裡指「狗看到鬼或是其他髒東西時會發出吼叫聲」在

  電影一開始要舉辦冥婚那，有照到一隻黑狗對著天空吼叫～



  查了一下發現導演真的拍過很多部片，不過大部分是鬼片所以都沒看過QQ




  有可能是因為不太熟悉台語，所以有可能沒聽過（？

  但我也是很小到時候聽過，長大就比較少聽到了XD



  無聲真的看了蠻不舒服又難過的QQ

  我會找機會去看詭扯和聖筊！



  感謝M大幫忙解釋～

  一開始看到頭歪一邊覺得太突兀了

  真的超忽然被嚇到

  到後來得知原來是車禍造成時就懂了哈哈哈哈



  有！有看到相關資訊，感謝推薦！



  有可能是因為不熟台語嗎？我也不太確定

  但身為2001出生的我知道！小時候有聽老一輩說過！'
