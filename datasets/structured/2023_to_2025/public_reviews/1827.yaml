url: https://www.ptt.cc/bbs/movie/M.1677136515.A.7C6.html
title: '[好無雷] 關於我和鬼變成家人的那件事  '
content: '《關於我和鬼變成家人的那件事》7/10分


  國片前段班的程偉豪導演新作

  程導出馬 必屬佳作(幾乎啦)

  抱著這樣的期待下進了戲院看這部片


  整體依舊有在水準之上

  尤其在故事的編排上層次很豐富

  一直都有事件在推著故事前進

  即使知道了大方向

  但很多支線的編排

  仍讓觀眾在過程中一直保有驚喜感

  這點很不容易

  而且整體看下來沒有什麼不合理的地方

  可以說是一氣呵成

  在各式各樣的突發事件中

  最後匯集成一條主線收尾

  光是這點就要給編劇們一個大大的讚了


  但仍是有些許的小缺點

  像是特效的部分還是略顯粗糙

  當然比起很多國片已經算很不錯了

  只是放到韓片或是好萊塢等級還是有差


  另外就是演員的部分

  可能因為國片是大家熟悉的語言

  所以在演技或是台詞上仍然有些許的尷尬感

  像是不夠口語

  或是為了口語而添加的國罵有時略顯太多了


  還有劇情的部分

  雖然很豐富 開了很多支線

  但看完後總有種「咦? 沒了嗎?」

  只收了一條主線

  但其他支線似乎就草草帶過

  這也是略顯可惜


  但程導不愧是拍恐怖片起家的

  在喜劇與恐怖片中游刃有餘

  互相穿插卻不會突兀

  整個氛圍拿捏到位


  也要給許光漢跟林柏宏一個掌聲

  演出同性戀的角色

  在大部分的時間不會覺得出戲或突兀

  加上編劇不管是在動作或是台詞上的細膩編寫

  有些時事梗或是致敬我覺得很棒

  都讓兩位主角的塑造更立體


  總體而言是很不錯的國片

  雖有缺點但瑕不掩瑜

  比起蟻人3更推這部叻


  --


  無雷 電影/影集短評IG：




  --'
