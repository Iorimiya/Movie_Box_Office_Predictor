url: https://www.ptt.cc/bbs/movie/M.1677498195.A.88E.html
title: '[好雷] 關於我和鬼變成家人的那件事'
content: '《關於我和鬼成為家人那件事－可以給點提示嗎？》


  其實這段才是這篇我想打的標題全文，可惜標題有字數限制XD。


  --------------


  扣掉稍後要吐槽的地方，這部電影仍然值得一看，整部電影主要人物之間感情互動的部分

  意外地打動我，笑點也頗多，至少我和同場的觀眾都有被逗笑XD。



  開場的喪禮（尤其剪頭髮和指甲的部分）有點可怕，所幸隨著劇情發展（因為不願意冥婚

  而導致吳明翰各種離奇的衰運），加上後來真相大白的擲筊內幕，漸漸讓前面的陰沉氛圍

  一掃而空，特別是躲在桌腳邊的毛毛好可愛（立刻被林柏宏圈粉）！


  第一個讓人覺得想落淚的地方是阿嬤拿出相簿細數和毛毛的回憶時，兩人一起參加彩虹遊

  行的舉牌照片QQ


  而臭直男與死GAY幾次對決後最終屈服喊老公的模樣也很好笑，從最初阿嬤為了完成孫子的

  願望所以幫他辦冥婚（雖然我覺得冥婚不能離婚實在是太不合理XD）、毛爸為了兒子向渣

  男低聲下氣求幫忙解鎖手機及冥婚，家人之間都以自己的方式愛著毛毛，只是毛毛不知道

  （尤其是爸爸的部分）；但還是忍不住想吐槽如果毛爸可以早點說出渣男劈腿的事實不就

  沒事了…= =


  我也很喜歡兩個主角吵架互嗆自私的那段劇情，大吵一架反而意外鼓動彼此說出心中的想

  法。

  毛毛提到同婚法案通過之後，自己第一次意識到或許真的能夠跟心愛的人結婚、相守一生

  的心情，引起內心的共感：雖然事後證明陳家豪是個不值得自己付出的渣男（而炎P也完美

  地詮釋了此男之渣），但看到逐漸有所改變的直男為了毛毛去揍了渣男，還講出一番自己

  以前從來不曾想過的話這段，讓觀眾感受到直男在心態上的轉變（對不同性向的人產生同

  理心），十分慶幸劇中的吳明翰不是直接被掰彎愛上毛毛。



  （至於劇中的警方辦案過程晚點再吐槽，先跳到槍戰結束後。）



  吳明翰因為中彈失血過多而送醫，毛毛甘冒魂飛魄散的風險，卯足全力往前衝、附身前車

  的駕駛人，原本擋在救護車前的所有車輛全部因此開上分隔島，為吳明翰闖出一條生路，

  劇情又迎來一波高潮。


  待吳明翰醒來發現毛毛已經快消散於天地間，他能幫毛毛圓的最後一個心願就是幫助他與

  家人（毛爸）間的和解，至此毛爸才講出心裡來不及對毛毛說出口的話，毛毛瞭解其實自

  己一直被愛著而不自知，終於完滿心中的遺憾；而吳明翰也從一個「恐同直男」轉變為「

  直男」，即使原先是出於被迫，但他也終於能夠理解並試著同理。


  末了更因為毛毛的緣故，而為吳明翰牽起另一段緣份，和阿嬤、毛爸及狗狗成為一家人，

  呼應了整部電影的主題，沒想到這次看電影居然沒有踩到雷，不敢相信！！！


  （上一部被雷的是我的婆婆怎麼把○○搞丟了…Orz）


  --------------


  好的，接下來就是各種劇情不合理的吐槽。


  首先是讓人看了直搖頭的草率辦案過程，充斥種種違法搜索、扣押和違法逮捕，這在現實

  情況下，吳明翰絕對不只丟工作，還會被吉到死，豈是區區調派出所的處分這麼簡單就能

  輕鬆打發。


  再來是角頭老大要偷渡的劇情，到底哪個要跑路的人會帶那麼多小弟還大張旗鼓？

  （不過這邊雖然不合邏輯，但大家還是被附身大亂鬥及蔡振南的演技逗得哈哈大笑就是了

  XD。）



  間諜女角那邊的劇情也是滿滿的突兀，完全沒有任何劇情鋪陳。

  雖然劇中一直提到可能有內鬼而導致行動屢屢失敗，但在這種情形下，沒有更換別的偵查

  組來承辦也很不合常理，是當檢察官是人型立牌嗎？

  （不過劇中也完全沒有提到應該要負責指揮專案執行的檢察官就是了…Orz）


  至於前面攻堅的劇情則是更扯，本來就應當報指揮、聲請搜索票直接進倉庫搜索扣押了，

  誰還在那邊跟你假裝銷售員賣東西兼通風報信？更不用說林子晴的報仇動機出現得莫名其

  妙，整段報仇過程也令人匪夷所思，不知所云的收尾讓觀眾看得一頭霧水。


  間諜的部分鋪陳不夠，不僅是孝哥，就連觀眾也需要再多一點提示好嗎？


  ------------------


  以上，如果滿分十分的話，對於主要角色間的感情互動，我會給到八分；但如果納入上面

  吐槽的荒謬劇情，分數會降到七分，不過總結來說還是推薦的XD。












  --


  採取的報仇手法也很怪異，向雙方自曝間諜身分後不是幹掉孝哥或同事，反倒是帶走孝哥

  的錢遠走高飛，我看了一臉黑人問號，而且她最後到底能不能順利偷渡脫逃，我也是非常

  困惑。



  一副「我OK、你先開」、大家（排隊）輪流開槍的樣子真的很尷尬，要是沒有槍聲大作的

  背景音效輔助，整個槍戰場面看起來真的完全沒有任何緊張感= =



  這邊我覺得還好，因為隊長也不時要吳明翰交代線人是誰，加以林子晴在劇中和他是夥伴

  的關係，吳明翰沒頭沒尾地突然講出裡面的人在狂倒東西，若是其他人不追問反而才讓人

  覺得奇怪。



  如果我有乖乖先上電影版看評價的話，就可以避免浪費錢去看○○了…QQ


  這部是因為噗浪上不少友人推薦，而且還有看到有人特地二刷之類的訊息，才敢放心進電

  影院看XD。



  （握）


  不知道和q大有共鳴的地方是不是如下述，如果不是的話也請容我再補吐槽一下XDD。


  常常看到電影中提到檢警或司法的部分都被寫的荒腔走板，不禁想問這部分的劇情找個顧

  問幫忙盯一下會很難嗎？


  希望可以多加注意細節，不是只要劇情主軸好笑（或溫馨）就可以隨便亂寫，就算多了鬼

  神之類的奇幻元素，也不應該忽略該有的嚴謹性（除非編劇表示這是一個有著自己特有法

  律及規則的的平行世界）。



  謝謝z大回文提供不同觀點，毛毛的家人真的都用自己的方式在默默愛著他QQ



  因為整部電影就要結束了，只好在病房中趕快把真相講一講XDD。



  看到吳明翰對著渣男說出那番話，確實很讓人欣喜這個角色的成長（拭淚），願意理解才

  能懂得尊重。'
