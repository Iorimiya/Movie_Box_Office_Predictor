url: https://www.ptt.cc/bbs/movie/M.1673795795.A.D1D.html
title: '[好無雷] 關於我和鬼變成家人的那件事'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  答應主演們跟監製不能爆雷

  想說批踢踢好像沒什麼心得文，所以簡略的寫一下

  文筆不好還請見諒QQ


  特別場開放售票的時候系統幾乎都炸裂

  有幸搶到台南場兩張票（熬了45分鐘QQ）

  帶著被我臨時約出門的朋友一起穿上紅色衣服去看


  好久沒有又哭又笑的看完一部電影了

  昨天先看過台中場影迷心得說會哭，以為是到很後面才會有哭點

  但不敢相信本人哭點低到演不到一半我的眼角就忍不住失守，儘管很快的又被劇情惹笑了


  開頭的美術設計覺得蠻厲害的，有認真做功課

  中間看到舉行儀式地點後頭門上對聯寫的字真的忍不住想笑XDDD

  劇情後面的反轉算在我意料之中，不過這部分還能再反轉真是不敢相信，私心蠻喜歡這樣的

  安排

  配樂我也蠻喜歡的，走出戲院甚至響起了某段輕快的配樂旋律


  最後想特別提的是柏宏，光漢跟王淨的演技不需要多說，但在看過主題曲MV跟正片後真的被

  一直在進步的柏宏驚艷到～

  2/10正式上映後應該會再重看一次

  -

  因為是無雷文，大家推文時要記得團隊請大家保密的三大雷點哦QQ

  -----

  Sent from JPTT on my iPhone


  --


  幫你修一下XDD

  刻板印象都有提到而且我覺得處理得蠻不錯的～期待上映後的討論

  根本夢幻組合啊QQ 謝謝辛苦的幕後團隊

  而且還不用太奇裝異服就能拍，恥度低的人真心感謝T_T

  資深演員演的片段真的無法不哭～

  我用了三張面紙鼻涕差點流出來，供參考（？

  啊啊想到昨天放映前還有播特別版的影片提醒手機要關靜音，超喜歡XD

  劇中每個議題都處理得很好很流暢也是不容易的事XD

  沒上過年檔期真的有點可惜，但相信這部不管什麼時候上映都會有成績的！'
