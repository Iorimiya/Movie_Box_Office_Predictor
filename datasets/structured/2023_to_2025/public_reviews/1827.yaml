url: https://www.ptt.cc/bbs/movie/M.1676438783.A.B2A.html
title: '[有雷] 關於我和鬼變成家人的那件事'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~













  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  不敢相信！這會是今春最洗腦的台詞！嗎？不管怎麼說應該有成為迷因的潛力。雖然這句

  聽多了有點尷尬，但是後續成為某種標誌性的台詞還蠻有趣的，讓人會心一笑。


  題材相當有趣，看得出來導演野心很大，想結合許多元素於一身，不過主軸還是關於同志

  認同的溫馨喜劇，所以其他的元素就只是淺淺的沾到一點邊，或是在喜劇為主的氣氛下淡

  化了。


  譬如兩段比較大的動作場景，槍戰感覺有點戲謔，隨隨便便就打中人或輕鬆從槍陣中溜走

  ，能理解這只是個過場，只是就少了點緊張感。飛車追逐有點微妙，有明顯的電腦特效感

  ，但畫面又顯得相當真實，所以我不知道這樣到底算做得好還是不好，當然現階段要求能

  像玩命關頭一樣做出很真實的唬爛感是相當勉強，但還是有種不協調感。


  劇情走向算蠻直線與公式化的，比較驚訝的片段大概是林子晴的角色立場吧，或許我也在

  不知不覺中掉進了導演的刻板印象陷阱中，至少在中段以前我一直都懷疑隊長有問題。許

  多人的評價都是又哭又笑的電影，不過雖然笑點有打中我，但是哭點我卻比較無感，可能

  因為後段一直有種不斷踩煞車的感覺，這種煞車感多半都跟毛毛有關，劇情設定他一直附

  身會傷元氣，可能魂飛魄散，有這個設定就可預期一定會有需要他狂附身的時候，可是等

  他真的開大絕時，又踩煞車讓他停在非常虛弱到快消失，但又沒有消失的狀態，只因為劇

  情還附加了另一個條件，就是他有遺願未了，而比較敏感的人或許早就猜出來他的遺願會

  是甚麼。到了最後關頭，應該是很感人的父親認同橋段，我卻總覺得情緒差了一點，不知

  道是不是因為毛爸把吳明翰抱起來時，我腦海中浮現的：「好痛。」打亂了情緒；或是看

  到庹宗華就一直想到庹宗康讓我嚴肅不起來。總之這段我連眼眶泛紅都沒有。同樣是長輩

  認同的橋段，隔壁棚《詐團圓》裡謝瓊煖眼淚一掉我馬上哭爆，連可作為《關於我和鬼變

  成家人的那件事》前傳的蔡依林《親愛的對象》MV情緒累積都做得比較好。


  但有趣的是這部電影沒有真正的情侶，吳明翰只是單方面的對林子晴隱約有點意思，林子

  晴只把他們當成墊腳石，而主軸的吳明翰跟毛邦羽也沒有發展成吳明翰性向覺醒之類的橋

  段，不走甚麼「恐同即深櫃」的老套路，反而是讓原本恐同的他變得認同身為同性戀的毛

  邦羽，也與片名巧妙呼應，變成「家人」。


  許光漢的形象與前陣子剛看完的《想見你》差非常多，只是有點刻意地想要塑造常說髒話

  講話直接粗魯的直男形象，反而顯得他平常不是這種人好像也不錯，不過我也好奇怎樣叫

  自然的說髒話，大概是平常講習慣了反而不知道甚麼是自然。林柏宏有把同性戀的神韻演

  出來，又不至於太誇張給人在塑造刻板印象的負面觀感。王淨演的花瓶警花角色設定蠻有

  趣的，只是礙於主軸是同志認同，所以角色代表的女性在警界這種以男性為主的世界裡生

  存不易的概念顯得很薄弱，最後的立場轉換雖然有爆點，但是連環轉又很令人錯愕，尤其

  是最後要丟下吳明翰跟隊長時，那種踩煞車的感覺又出現了，既然要走幹嘛還掛念，既然

  會擔心為何不出手救人，徒留懸念。但全片亮點絕對是蔡振南，他可以玩這麼大真是太歡

  樂了，他最後那一段是我笑最開心的一幕，他真的有被附身吧。


  電影中有一段我覺得很有意思，是毛毛述說他對婚姻的想像那邊。在同婚合法前同性戀的

  交往有種沒有未來、沒有結果，只有當下享樂的感覺。所以情侶間的聯繫好像並沒有這麼

  緊密，至少分手尋求新歡的成本沒有這麼大，或許像電影中陳家豪那樣想要一個接一個玩

  下去而不用給承諾的人並不少。但當同婚合法後，這個擋箭牌瞬間失效了，同性戀擁有了

  給出一生的承諾的權力，同時也代表會有人希望他們給出這樣的承諾，如何去調適這種以

  前完全不用考慮的衝突感，好像也是個值得討論的角度。


  電影很多笑點乍看很政治不正確，但實際上這些角度都是為了襯托後面的政治正確，或許

  這就是現代處理這類笑點較佳的方式吧，你要明白點出你在取笑的人是那些政治不正確的

  傢伙，而不是像幾十年前一樣丟個地獄笑點還保留想像空間。

  《關於我和鬼變成家人的那件事》是部有趣的電影，跳脫以往同志電影總是要賣悲情賣慘

  賣苦戀的框架，雖然混雜元素很多而又有點淡，但仍是不錯的調味料，也不會搶走主菜的

  風味。今年有不錯的開局。


  --'
