url: https://www.ptt.cc/bbs/movie/M.1676732173.A.888.html
title: '[普好雷] 關於我和鬼變成家人的那件事'
content: "有雷\n\n\n\n\n\n\n\n\n如果你還沒看\n\n\n\n\n\n\n不要再往下滑了\n\n\n\n\n\n\n對國片一直都不抱期待，\n\
  這次是衝著兩位主演以及冥婚的題材才進戲院支持的，\n坦白講以國片來說和鬼變成家人已經算表現不俗了，\n不會硬塞不好笑的梗、演員唸對白也自然不少\n（除了第一次在警局場景負責接電話那位，根本像三金頒獎典禮走錯棚=\
  \ =）\n反派的反轉也有驚喜到，邏輯也能自圓其說\n特效雖然還是看得出來痕跡，\n但以國片來說真的算細膩了\n\n整體來說是一部值得觀賞的電影，\n雖然多少還是有點說教意味在，\n\
  而且後面打鬥戲吳明翰的身手其實不錯看，\n但硬要塞蔡依林的歌當配樂有點多餘，\n就算主角是同志也不用把同志的元素塞到滿出來吧！\n\n\n個人評分78分，\n\
  如果算上許光漢的屁屁就有90分，\n然後片尾沒有彩蛋，可以不用等。\n\n\n對了，林子晴回憶媽媽的那段是不是在致敬門徒啊？\n\n\n--\n它就是為了呼應前面gay吧那段啊，我是覺得可以有更好的選擇\n\
  異性戀太狗血也是照樣反推，有什麼問題嗎？\n同檔期國片中的確是這部最讓人有動力買票支持\n 算是爸爸跟毛毛的和解，也解釋了前面埋的伏筆，所以不可能剪掉的"
