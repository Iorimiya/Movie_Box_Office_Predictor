title: '[好雷] 關於我和鬼變成家人的那件事'
content: "電影版首PO，內容有雷，純心得分享，沒專業角度\n\n本原PO原本是對國片一直提不起興趣幾乎只買單國外爽片的人\n\n對國片的認知一直處在賣情懷或是要配很濃的台語元素\
  \ (非貶義，單純生活圈沒有共鳴)\n\n不然就是主打年輕人愛情糾葛的青春劇場 (個人看這種會想睡覺\n\n然而在前陣子一直被預告刷後就興趣大增\n\n光是預告林柏宏的台詞「叫老公還是叫死gay」這句話就很有打動我看的意願XD\n\
  \n如果是一部單純同志之間的故事我可能還提不起興趣\n\n但看一個直男跟gay的相處是一個很新穎的題材，有種看濃縮版的偶像連續劇既視感\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\n\n\n\n\n\n\n整部沒有台語元素卻在對話內容中含有非常多的髒話，反而讓我對生活圈很有共鳴(?\n\
  \n電影內容帶有大量\"挺同\"與一點點\"環保、反核\"的政治色彩\n\n因為剛好這些都與我沒牴觸，所以覺得很ok\n\n尤其林柏宏將gay的動作儀態演得維妙維肖\
  \ (非刻板印象，單純讚嘆能把形象塑造起來\n\n還有罵許光漢是臭直男的部份，為何我會一直覺得好像自己也被罵了XDDDD\n\n\n\n\n整部劇情的情感環節大致分為感情、好笑、驚嚇，比例大概55%、40%、5%\n\
  \n驚嚇部份就單純有兩幕的特效讓鬼的面目比較有張力，其他片段並不含有任何鬼片元素\n\n而感情部份從前面的淺淺刻劃到後面的加重猛藥，尤其給救護車讓道那幕差點飆淚\n\
  \n還有最後父親在醫院那段對兒子的致歉有種體現出現在社會對同志逐漸認同的態度\n\n反而是阿嬤一開始就認同孫子是同志這件事讓這個議題不顯得沉悶\n\n笑點部份則前面比較多，後面比較少，很多年輕人梗\n\
  \n加上這些梗不少是由阿公阿嬤來講更顯得風趣 (反而不覺得不自然，有種拉近距離的fu\n\n驚嚇的部份感覺是為了配合劇情，不過後續回味起來覺得有些不自然，怪怪的\n\
  \n要特別提到一下\n\n前面吳明翰(許光漢飾演)的恐同態度到後面跟毛邦羽(林柏宏飾演)說：「這輩子我養你」\n\n整個感動到起雞皮疙瘩，戳重我的點不是接納同志這件事\n\
  \n其中也沒有去塑造被掰灣的情節(好險沒有)，而是體現出友誼最無私、打抱不平的那面\n\n\n\n\n\n劇情部份個人覺得中上\n\n畢竟要同時兼顧感情、警匪\n\
  \n所以看上去就變成感情部份有到位，警匪片段就稍顯不足，幾個不合理之處\n\n但畢竟我是帶著看喜劇的心態看的，吐槽的部份與那些動作爽片的劇情相比完全能將就\n\n\
  反正也不是要凸顯警匪的劇情，只是背景設定是如此，這裡就不吐槽了\n\n\n\n\n最後，沒彩蛋\n\n但是可以去YT找蔡依林《親愛的對象 Untitled》\n\
  \n我覺得那MV就算是一個彩蛋\n\n也許劇情中有些地方可能塑造過頭，反而讓同志族群覺得被冒犯\n\n但至少我認為與整體想要呈現的內容相比，不會因此造成失焦\n\
  \n很高興在台灣同志婚姻是合法的\n\n突然想到一句話：「世界上只有一種性向，叫做心之所向」\n\n--\n\n\n                     \
  \ 我顛覆了整個世界\n\n                                        只為擺正妳的倒影\n\n\n--\n以為要飛升那幕超揪心QQ"
