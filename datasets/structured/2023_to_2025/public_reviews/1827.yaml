  來是砍半再砍半。





  這種用國外票房來說明的方式，會產生出因為芭比這部片在中東票房不好，

  可以說明這部片不是很好看的結論。

  (電影「芭比」因性別價值在中東上映時遇到強大阻力。黎巴嫩以「宣揚同性戀」為由將予

  禁映，科威特也跟隨黎巴嫩腳步；沙烏地雖可上映，但不清楚電影裡有哪些地方被刪。)



  至於冥婚的呈現華人圈外看不看得懂。

  網飛熱門十大電影排行第七名，應該是看得懂。




