title: '[好無雷] 關於我和鬼變成家人的那件事'
content: '因為主持人（好像是監製？）說ptt跟Dcard都還沒有看到有人推薦，

  所以就想說也來拋磚引玉一下好了～

  （寫的不好也請見諒，我是長期潛水客）


  先上結論：

  值得一看，不會失望，真的會「笑死」

  （在場有人哭，但我哭點可能比較高，我沒哭。

  但我看「講話沒有在聽」有爆哭。）


  之前知道是許光漢和林柏宏主演時，就有點期待。

  看到預告時，更是加深了我想看的心。

  後來陸續加了本片的FB和IG，

  得知居然可以在2月10日正式上映前，

  就能參加佳嬿(X)家宴(O)場搶先看，

  還可以看到演員，讓我更是滿懷期待。

  （最後每個人還能跟導演、演員們合照，這福利有夠讚！）


  本來有點小擔心笑點是不是都在預告裡笑完了，

  但看了本片後，真的不用擔心，還有更多笑點在本片，

  真的如預告說的，會「笑死」。

  (但沒看過預告直接看本片的話，我覺得會更加笑死XD)


  然後開場沒多久就有開車追逐戰，拍得很酷，

  我也分心在感嘆：「這個怎麼這麼會拍，這樣拍要花多少錢啊」XD


  因為我都在看劇情，沒在動腦，所以劇情翻轉的地方我都覺得蠻酷的。

  後面翻轉的地方比較快，之後若有時間，應該會再二刷吧？

  覺得本片真的不錯看～（喜歡蔡依林的別錯過此片XD）


  --'
