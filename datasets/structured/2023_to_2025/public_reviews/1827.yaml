title: '[請益] 關於我和鬼變成家人的那件事年齡差距'
content: '請教各位細節大師，昨天去看了「關於我和鬼變成家人的那件事」夜場有點睡意沒記清楚

  ，阿嬤跟毛爸年齡差距是幾歲？



  電影中阿嬤跟吳明漢吃飯時說，兩年前參加同志遊行是70歲（我有記錯嗎？）；

  毛爸跟陳家豪下跪時說他都快60歲；

  假設阿嬤今年70+2歲=72歲，

  毛爸說今年快要60歲算他58歲好了，

  阿嬤跟毛爸的年齡差距72-58=14會不會生不太出來？（雖然可能那年代沒有兒少性剝削問

  題）


  請各位大大解惑惹感恩


  --

  四阿哥生母ㄚ？'
