title: '[普無雷] 關於我和鬼變成家人的那件事'
content: "看完的當下本來是覺得還ok，普通\n\n但回來看到版友怎麼都好雷居多\n\n想說給點比較不一樣的方向，給還在觀望的人考慮考慮\n\n\n1. 特效很假!\
  \ 有夠假，有些撞擊跟人倒地很明顯完全忽視物體慣性\n\n   偏偏又不好笑，也不覺得有趣，我個人是覺得有點尷尬\n\n2. 明明是搞笑劇情片，不懂為什麼要穿插兩幕鬼臉來嚇人，我不排斥但很不能理解\n\
  \n3. 劇情鬆散凌亂，看似有前後呼應但其實轉折很牽強，是那種轉折硬要轉的最佳例子\n\n4. 除了庹宗華，還有一些配角阿嬤演員都演得比王淨 許光漢好...林柏宏只能算正常\n\
  \n5. 片長130分鐘真的太久了，有些劇情根本可以刪減甚至沒必要，硬要增加片長讓我有\n\n   一種導演甚麼都想加進去，但甚麼都不專精的感覺\n\n\n\n\
  個人覺得唯一優點大概就是親情吧\n\n算是導演處理比較好的部分\n\n\n但你說好雷?  很好笑?　超好看？　\n\n個人是覺得離那程度還有一大段距離\n\n\
  可以看，不難看，但就是可看可不看那種等級\n\n--"
