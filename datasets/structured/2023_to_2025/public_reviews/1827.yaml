url: https://www.ptt.cc/bbs/movie/M.1692534636.A.358.html
title: 'Re: [負雷] 關於我和鬼變成家人的那件事'
content: '原本也是期待滿高，以為會是笑到爆的感人電影，但看完就覺得偏普，笑點跟哭點都是微

  微搔到，卻又力道不足；不至於像原po給到負雷，但頂多也只能給到普好雷吧！



  覺得很可惜的是附身梗可以再加強，最直接可以聯想到類似的橋段就是王牌天神（主播被

  操控的那段），完全鐵了心就是催到底要讓觀眾笑爛。


  但鬼家人的附身笑梗大概只有舞孃、蔡振南的不敢相信、小嘍嘍的接吻攻擊，但都只是點

  到為止，才剛開始發笑而已就結束了，長度跟力道都必須再加強一些，讓附身梗能有更大

  的反差。


  整部最好笑大概就新郎零號跟劉冠廷。



  至於情感戲的部分卻是相反地太過冗長，最後在病房裡的台詞太多都打不到點，明明吵架

  然後天人永隔的橋段應該很好發揮的，而且最後毛毛要跟毛爸說的居然是都有用環保餐具

  以他為榮？真的是？？？有夠解嗨….知道導演想要倡議環保意識，但真的要在情感戲講

  這個？


  遺願的部分放北極熊跟淨灘也都太宏大，那些橋段都只能淪為過場，遺願放進阿嬤跟家豪

  ，讓角色更立體肯定都會比較好，小毛就是個不錯的安排，可愛又能跟觀眾有連結。



  以上個人不專業見解，雖然笑不夠好笑、哭不夠好哭，但整部看下來還算可以接受啦，只

  可惜不如評價與預期。


  --

  但放在台詞就真的不行..可以拍個毛爸買東西用環保餐具毛毛看到這樣就夠了

  爸亂丟煙蒂、兒子淨灘其實不衝突啦

  真的，那邊算是最好笑的，可惜有夠短'
