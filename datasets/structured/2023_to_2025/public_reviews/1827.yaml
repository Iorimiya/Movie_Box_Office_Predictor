content: "喔喔～\n不對 是不敢相信～\n\n這部看預告很好笑就直接列入選單了然後二刷\n\n第一次心得\n\n1.片頭特效果然還是不行嗎 撿紅包頭尾鋪陳的還滿順的\n\
  \n2.冥婚迎娶氛圍讓我聯想到正英那部紅白煞進而對導演的鬼片產生興趣\n\n3.不敢相信就是一直不敢相信\n\n4.我笑點低 全部都很好笑\n  印象最深是馬拉桑的你到底在跟誰講話\
  \ 還有大家都是自己人\n  可惜這邊我已經在憋尿了 笑得超痛苦\n\n5.因為在憋尿所以後面病房那段整個覺得冗長只覺得在交代\n\n二刷心得\n\n1.因為大家都說南哥說不敢相信那段演很好\
  \ 所以二刷特別看了一下\n  suge～大概是我第一次看時在邊笑邊憋尿\n  所以南歌表情肢體小動作都沒看到\n\n2.我不是許跟林的粉 有看過林的其他片 許完全沒有\n\
  \  這部是第一次看許 覺得他很厲害有驚艷到 回去補了想見你\n  二刷則是針對林 他在舞池那邊很媚感覺就是印象中的gay\n\n3.二刷比較沒有憋尿 所以後面病房那邊有稍微耐心看\n\
  \  對比彩虹河那邊 明翰要照顧毛毛 可能是出於bromance\n  我覺得明翰在這邊已經完全接受理解gay了 不僅止於他跟毛毛之間\n  因為前面要靠毛毛比手畫腳說出帶毛毛回娘家（雖然用說的也可以啦）\n\
  \  但是這邊毛毛只是一直哭 然而明翰卻說出無條件的愛\n  其實gay就跟家人一樣沒有啥\n\n4.笑點低哭點高 不過還是有被救護車那段戳到心頭揪了一下\n\n\
  以上\n\n最後 為啥沒有彩蛋補個王淨去買傢俱\n到了～到了～終於到了～\n這樣不是更好笑嗎 我難過 嗚～\n\n--"
