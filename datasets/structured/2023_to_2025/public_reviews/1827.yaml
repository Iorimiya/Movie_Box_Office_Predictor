url: https://www.ptt.cc/bbs/movie/M.1677414836.A.53E.html
title: '[新聞] 關於我和鬼變成家人的那件事票房有望破2'
content: '關於我和鬼變成家人的那件事票房有望破2億 許光漢林柏宏合體謝粉絲


  中央社記者葉冠吟台北26日電


  國片「關於我和鬼變成家人的那件事」上映至今，全台票房已達新台幣1.68億元，有望突

  破2億元。劇組今天舉辦粉絲同樂會，片中演員許光漢、林柏宏、炎亞綸現身，引起全場

  尖叫。


  劇組今天在台北信義區舉辦「有你們真好同樂會」，監製吳明憲及金百倫、導演程偉豪率

  演員許光漢、林柏宏、王淨、馬念先、王滿嬌、庹宗華、炎亞綸出席，敲鑼歡慶票房一飛

  衝天。


  另外，劇組為酬謝觀眾支持還發送500杯梅子綠茶，甚至搬出電鍋、T恤等周邊商品進行票

  根抽獎，讓全場粉絲直呼「不敢相信！」


  吳明憲喊話，預估今天電影票房就有機會突破新台幣2億元。


  曾參與國片影史最高票房電影「海角七號」的馬念先也開心地回應，希望有機會超越「海

  角七號」票房，他笑稱「快忘記票房衝上第一的感受了，我們就先5.7億吧」。


  劇組被問及如果「關於我和鬼變成家人的那件事」票房成功突破2億元，要如何回饋粉絲

  。對此，程偉豪表示，還需要時間思考。


  其他人則力拱「點子王」炎亞綸幫忙出主意，炎亞綸開玩笑說，「2億真的是不容易，我

  先露一個頭，2億就二頭肌好了，那3億交給柏宏露三頭肌。」


  對於炎亞綸的說法，許光漢也搞笑附和表示，「那我露下面的腳趾頭。」


  在電影裡愛恨交纏的許光漢、林柏宏、炎亞綸今天共同亮相，3人手勾手象徵大和解。片

  中，炎亞綸飾演林柏宏的渣男前任，炎亞綸坦言要講出各種傷害對方的台詞最困難，「我

  其實是個心很軟的人，看到柏宏的角色因我而哭的時候，我也非常心疼，但要演渣男就必

  須這樣。」


  林柏宏則說，「感謝亞綸講得很夠力，讓我更容易進入角色狀態，真的蠻難過的。」


  近期國內雞蛋產量減少，炎亞綸日前在網路上發文指稱「我最近每天都吃到蛋」引發爭議

  ，他隨後也緊急發文道歉指出「最缺的就是我的同理心」。


  炎亞綸今天再被問及相關議題，他表示，自己勇於道歉的原因是因為「我的出發點是愛，

  又不是恨，因為愛而變成恨，就是你表達方式有問題。」





  許光漢腸胃炎身體不適


  今天晚上的影人QA取消6場（都是美麗華）




  --'
