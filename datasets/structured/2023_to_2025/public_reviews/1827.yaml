url: https://www.ptt.cc/bbs/movie/M.1691866946.A.8BD.html
title: '[普雷]  關於我和鬼變成家人的那件事'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~







  身邊朋友對這部電影的評價很高，所以Netflix一上線就立刻安排時間看完了！



  先說缺點：


  1.

  這部電影充滿著對同志的刻板印象，健身房看對眼就去淋浴間打炮、gay吧毒品交易、自

  拍性愛影片、渣男無縫接軌等等….


  關於這些刻板印象，有人說「不要代替同志被冒犯。」、「我是gay我覺得很好笑。」，

  也有評論說這種表現手法是故意的，藉由貼標籤來強化戲劇效果，還有些評論說這就是喜

  劇片，好笑就好無需較真。


  事實上這部片也的確得到大部份的觀眾買單，只能說是沒打中我的笑點吧～



  2.

  不知道是不是為了領補助金（還是清心置入？）而安排做環保的情節，前面的淨攤、環保

  杯就算了，毛爸去買蚵仔煎那段也要把用環保餐具演出來，不是說做環保不好，但這些片

  段加得實在太生硬，很讓人出戲。



  3.

  冥婚的題材很有趣，但整部電影想呈現的素材太多，冥婚、同志婚姻、恐同異男、做環保

  、花瓶的逆襲、飛車追逐、鬼魂辦案、毒品無間道再到最後的大和解，看似緊湊但實際觀

  影體驗是有點瑣碎。




  再來說優點：


  1.

  《鬼家人》在台票房大賣，上串流平台也立刻衝上排行榜，有非常多的觀眾喜歡且被娛樂

  到，對於國片發展與商業價值來說都是一部非常成功的喜劇片。



  2.

  雙男主演的顏值和身材都很養眼，許光漢的屁屁讚。



  3.

  蔡振南被毛毛附身的那段很好看，被附身的瞬間整個人氣場變化，好會演。



  4.

  毛爸最後的醫院戲雖然很老套但看到庹宗華的表演還是被打動了，把一個傳統思想、不善

  表達的父親，最後因為對孩子無條件的愛而產生的心境轉變演得很細膩，完全感受到毛爸

  內疚的心QQ



  5.

  正港分局的設定很可愛，馬念先和陳彥佐作為警局的綠葉角色，再搭配許光漢和王淨歡喜

  冤家搭檔辦案，感覺可以發展出不錯的支線XD




  總體來說是部適合放空看的電影，以上，希望國片可以越來越好！



  --


  追車那段真的太長了，主要特效假假的所以也沒有跟著緊張的感覺



  正港分局的日常很不錯～



  原來如此，謝謝大家的說明～

  可能是我對前面淨灘、環保杯這幾段覺得很生硬，後面看到毛爸拿環保餐具想說怎麼又來

  ，反而沒覺得溫馨XD



  好奇大家是本來就知道台大城鄉所=文青路線的設定嗎XD


  老實說我是看完電影去爬別人的影評才看到有人提起，如果是要表現毛毛走文青路線，我

  覺得片中演到毛毛領養流浪狗、參加同志遊行、房間有反核旗幟這些片段反而比較自然的

  帶出毛毛是個熱心社會議題的人～


  王淨一開始被當警局花瓶雖然老梗但其實滿好發揮，也呼應這部片的議題（性少數、平權

  ）


  後面突然交代身世，上演半吊子的毒品無間道真的看不懂，這也是我覺得劇情太瑣碎的原

  因之一，不如讓馬念先演內鬼就好了



  這段有感人～許光漢從恐同到接受毛毛的轉折還不錯！



  謝謝你的說明，有比較理解台大城鄉所的設定了！可能是我見識太淺，在觀影的當下沒辦

  法瞬間想到後面這麼多關聯@@


  沒有要代替同志覺得被冒犯啦～

  只是電影強化同志負面刻板印象的方式我沒有get到笑點，不過大部份的觀眾覺得好笑那

  就是成功了XD


  貼標籤容易，撕標籤很難

  希望你永遠站在社會的多數



  原來 想說毛毛這麼緊張lol



  我也不覺得那是笑點，但我的同志朋友覺得健身房那段很好笑，可能每個人的笑點真的不

  太一樣XD


  這些行為同性戀會做，異性戀也會做，如果對你來說是「正常現象」，那是你的生活圈如

  此，與你的性向無關。


  如果不是，那你口中的「正常現象」，只是你的猜測，是你基於片面資訊的判斷，事實上

  就是對同志的刻板印象呀。


  我根本沒說不能接受毛毛堅持做環保，我也會用環保杯買飲料折5塊ㄟ，我表達的是做環

  保的戲份太多太瑣碎==


  反核只有一幕帶過就讓人有印象了

  做環保的設定有重要到要用好幾段來講嗎？

  （所以我才好奇是不是因為清心置入硬加）


  上面很多版友有說他們覺得用環保餐具感動的點，我可以理解～畢竟每個人感受不同，但

  我的觀影感受是這幾段做環保的戲份生硬且不感動，就醬～'
