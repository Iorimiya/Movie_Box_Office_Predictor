url: https://www.ptt.cc/bbs/movie/M.1675526976.A.2B5.html
title: '[笑淚微雷] 關於我和鬼變成家人的那件事-特映'
content: '雷文防雷資訊頁


  導演跟編劇的敘事能力不用多說

  因還沒有正式上映

  就不特別提到劇情細節

  但因為提到「親愛的對象」MV與劇中的場景與情緒會放個防雷線。其他可親自2/10到場支

  持。





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  「關於我和鬼變成家人的那件事」從預告就知道與同志的愛情、鬼魂、遺願甚至是參雜動

  作的戲，這是一部「有愛」的故事。


  如果你喜歡喜劇，這是部有很多場景跟台詞會讓你沒有預料的笑出來，還有搭配時事梗與

  迷因梗，完全有感受到團隊在面對年輕族群與社群的分析有到位，觀眾也能共鳴，有好幾

  句台詞真的是笑到不行。


  如果你喜歡親情劇，看這部戲建議先看完「親愛的對象」MV後，你會看到劇中的阿嬤還有

  其他家庭角色對孫子「毛毛」的思念與承諾，家人的刻畫與同志面對出櫃革命的矛盾就是

  真實同志內心最柔軟面對家人的那塊，有苦痛有和解有溫暖有眼淚，最重要的是和解支持

  與包容。


  如果你喜歡追車動作戲，其實還真的有警察追兇手這段，也不得不讚揚台灣對特效這塊的

  處理有進步，尤其追車戲這段，看得蠻過癮。


  不論你是直男或死Gay，這部片你將看到「部分直男與同志的真實行為」包含言語、態度

  、反射、環境，真的就是我們周遭一部份的日常，會有共感，一種「X，我那個直男朋友

  就是這樣啊」或是「我Gay閨蜜就是這樣」的既視感。


  另外想點出許光漢與林柏宏，兩位演技派真的是有做足功課，演繹直男與同志特別到位。

  然後請留意「庹宗華」這位老字號演員的角色跟表演，堪稱一大亮點。


  最後唯一覺得稍微可惜的是，導演跟編劇能力絕對沒話說，不過可能很想傳達很多事，包

  含愛情、親情、人鬼戀、冥婚、傳統文化、犯罪、寵物等，在節奏上的拿捏跟處理有些倉

  促（純粹個人認為）。


  總言之，這樣的題材結合絕對是國片史上的首度與嘗試，我非常喜歡。


  備註：想要「看肉跟身材的」，許光漢絕對不會讓你失望（笑）。






  --'
