url: https://www.ptt.cc/bbs/movie/M.1676007277.A.F1B.html
title: '[好雷]《關於我和鬼變成家人的那件事》，願所?'
content: '部落格版：


  如果沒有意外，《關於我和鬼變成家人的那件事》應該會是我今年最喜歡的台灣電影。雖

  然嚴格來說，早在去年金馬影展就已經看過這部作品，但時隔幾個月的再看第二次，依然

  還是讓人很喜歡。記得當時看完影展版本時，回家寫下這段「從《紅衣小女孩》、《目擊

  者》、《緝魂》然後再到《關於我和鬼變成家人的那件事》，導演程偉豪不斷證明自己有

  那個能力且是輕鬆當成在走廚房一樣的在各種類型與風格的電影裡來去自如。」，看完第

  二遍之後，我的想法依舊。也許套句電影中毛毛的口頭禪「不敢相信」，不敢相信導演程

  偉豪能將他過去幾部作品的各種類型與風格搗碎、重組，並換上全新的喜劇風貌來呈現，

  展現其強大的導演能力。同時亦不敢相信，除了類型與風格的多元性外，《關於我和鬼變

  成家人的那件事》在題材選擇上也具有寬大的包容力，不論是傳統民間習俗「冥婚」或是

  近年才剛通過的「同婚」通通放入其中，這兩種從觀念到道德上都有著尚未被完全接受的

  爭議婚姻，以意想不到的形式結合，翻轉、顛覆觀眾的想像。


  《關於我和鬼變成家人的那件事》充滿著各種刻板印象，從直男到同志、就連女性都成了

  消遣對象，直男就是這樣、同志就是那樣，然後女性就是擺美的花瓶，幾乎每個角色都以

  他們最讓人「熟悉」的樣子出現在電影裡。但經驗告訴我們，往往這些誤會都是來自於不

  了解，於是導演程偉豪藉著劇情的編排讓角色們不僅相遇、相識，更被迫要經歷長時間相

  處，就是為了讓彼此有機會消除對對方的歧見，在對方身上看見自己過去從未看到過的不

  同面向、打開視野接納更多不同，進而達到理解而後尊重的目的。只是同時《關於我和鬼

  變成家人的那件事》亦反向利用了這些刻板印象來達到另種目的、也就是電影懸疑部分的

  反轉，來製造驚喜與激出高潮，先姑且不論劇情走向的好猜與否，能讓角色們將這些擅自

  被人貼上標籤的刻板印象當作自身武器，進行一次讓人措手不及的精彩逆襲。


  鋼鐵直男和死掉的Gay冥婚，陰陽殊途、性向不同的人鬼該如何相處？光是這樣的劇情設

  定本身就已讓人充滿好奇與想像，不過《關於我和鬼變成家人的那件事》並不是單純賣腐

  的純愛之作，從主角之一的明翰職業為警察、以及故事開端源於一場與毒販的追逐戲便可

  大致猜到，電影將會是部以喜劇為基調的「愛情動作片」。而事實上電影確實也朝著這個

  方向前進，有愛情、有動作、也有親情然後再加上靈異、懸疑，觀眾幾乎可以獲得多方面

  的滿足，導演程偉豪把這些其實各自能發展成一條主線的支線化零為整，將之有系統性的

  收攏為一個幾乎沒有任何尿點、盡是笑點與哭點的故事。



  「上輩子你養我，這輩子我養你啦！」


  喜歡《關於我和鬼變成家人的那件事》的是，許多前半段讓人笑出聲的互嗆台詞，都在後

  半段變成動人的浪漫告白。導演程偉豪不只讓明翰有著對同志來說是直男的討厭，也讓他

  擁有著異男的溫柔，他笨拙的表達自己不擅長表達的情感，那些說不出好話的詞不達意裡

  盡是他的體貼與心疼，吵吵鬧鬧的拌嘴成了他的關心，毛毛感受到了、觀眾也感受到了，

  於是忍不住的跟著毛爸一起想著，「如果毛毛當初是跟明翰在一起就好了」，但相信導演

  程偉豪自己也知道要是真讓明翰愛上毛毛就太狗血，所以他並沒有讓明翰對毛毛動情、也

  沒有毛毛或許真的愛上明翰的明確跡象，只是任憑這股說不上來的曖昧在空氣裡流動，帶

  走了毛毛的悲傷，帶給了他溫暖。


  「你只是希望有個人能夠愛你一輩子。」


  法師告訴明翰，要想擺脫毛毛就得完成他的遺願，如果生前遺願已解那麼毛毛也許就能成

  佛升天，因此劇情便是順著「要替毛毛完成遺願」而發展。只是連毛毛自己也對自己有什

  麼遺願毫無頭緒，明翰只能亂槍打鳥的從捐款救救北極熊、淨灘撿垃圾、用環保餐具響應

  環保到追查開車撞死他還逃逸的嫌犯是誰都試試，不過顯然都不是。最後他們改從毛毛生

  前的愛人下手，本想藉著明翰之口來告訴對方不要太難過，要趕快找到比他更好的人，看

  著他幸福他也就能安心離開，豈料他們看到的是早已和新歡打得火熱的前男友，且對方還

  讓毛毛知道，原來結婚從來只是他一廂情願，會不會「有人可以愛自己一輩子」是根本完

  成不了的遺憾？如果今天毛毛還活著，那眼前的不過就是無縫接軌或是劈腿被抓包的劇碼

  ，但幸好的是導演程偉豪選擇讓毛毛成了鬼。


  成了鬼以後，給了讓活著的人有了說出心裡話的勇氣，也給了死去的人聽到真心話的機會

  。即使無法當面的原諒與和解，但當觀眾聽著無法穿越陰陽界線的告白，只有坐在銀幕這

  頭的我們才知道的放下，反而成了電影最美的遺憾。就像是那些互嗆台詞到後來變成浪漫

  告白，《關於我和鬼變成家人的那件事》亦將許多前半段的畫面，到後半段一一將真相給

  揭開，還原當時的數分鐘全貌，讓恍然大悟之後隨之而來的那股感動、震驚力道增強不少

  。跟著劇情我們知道了毛爸曾經目睹毛毛男友偷吃，因此他才會堅決反對他們結婚，只是

  聽在毛毛耳裡卻還是無法被父親認同的痛苦。毛爸就與許多傳統父親一樣，固執而又倔強

  ，明明是怕兒子知道會難過，可曾表示沒辦法接受兒子性向的他，又怎能拉下臉來說自己

  想法已變？父親的面子與尊嚴讓他言不由衷，才導致了後來的憾事發生。明翰的出現，成

  了這對父子的對話橋梁，換種方式來相互理解，父親的告白讓毛毛知道，這個世界還是有

  個人認真的愛著他，用著一輩子的時間在保護他，愛情的愛也好，親情的愛也好，總都是

  愛，毛毛的遺願終於已了。



  「花瓶哪是你能一眼就看穿的，能一眼看穿的叫做玻璃杯。」


  回到電影所談的刻板印象，如前面提到的，《關於我和鬼變成家人的那件事》許多角色都

  擅自被這社會貼上了標籤，就連子晴和明翰那總被笑只會吃的同事都是。兩個人不論多麼

  努力與有能力，每個人還是不會給他們公允的評價，以子晴來說，即使她是靠自己的實力

  還有實績來爬到現在的位子，但免不了的還是會被閒言閒語，認為女警只要擺美拍宣傳海

  報、在典禮上幫長官別胸花就能往上升，她早已經懶得去解釋還是去證明什麼，因為這個

  社會不就是這麼一回事，根深蒂固的刻板印象總能輕易的抹煞一個人的辛苦。於是，每個

  深受其苦的人們在現實裡得不到的肯定，導演程偉豪在電影裡還給了他們。子晴完美利用

  了男性對女性的歧見，在黑白兩道都吃很開，再在吃乾抹淨之後狠甩兩方，華麗轉身遠走

  高飛，雖然無法說這個黑吃黑的反轉編排特別出色，但真相揭曉後配上子晴花瓶和玻璃杯

  理論，實在是諷刺滿點。


  「雖然你說鬼沒有在認識，但至少我認識你了。」


  哭著哭著就笑了、笑著笑著就哭了，放在《關於我和鬼變成家人的那件事》一點也不誇張

  ，導演程偉豪很清楚知道觀眾想看什麼、哪些橋段可以逗笑觀眾，又有哪些情節能夠讓觀

  眾掉眼淚，有了前幾部作品的經驗，這次他不論是在編或是導演方面的功力有著明顯進化

  。而且不僅如此，在這部混搭多元的電影裡，他也展現他指導演員表演的功力，除了資深

  演員蔡振南、庹宗華和王滿嬌本就已然精湛的演技外，他讓觀眾看見了不同於以往的許光

  漢、林柏宏還有王淨，從過去他們的作品中多少能找到相似類型的角色，不過這次他們脫

  下了自己，讓靈魂沉進角色身體裡、發揮的極致，幾乎成為了他們、至少是許光漢和林柏

  宏的演技代表作。另外，不得不提的是劉冠廷，早就見識過他喜劇的魅力，這次短短客串

  幾分鐘依舊笑果十足，替電影起到了畫龍點睛的效果。


  《關於我和鬼變成家人的那件事》是部各方各面來看都相當成熟的商業電影，尤其在特效

  部分能感受到滿滿企圖心，開頭那場警匪追逐放在台灣電影來看實在難得，而毛毛生氣後

  的厲鬼姿態也比《紅衣小女孩》特效好上許多。同樣寫在金馬影展版本之後，預測如果沒

  有太強勁對手的話，《關於我和鬼變成家人的那件事》有機會在金馬獎上斬獲不少，在技

  術方面的獎項，如視覺效果、音效、動作設計、原創電影音樂等都可佔下一席。至於演員

  部分，這類電影角色本就難獲青睞，但還是私心想推林柏宏角逐男配角，如果《六弄咖啡

  館》的演出都能獲獎，沒理由他這次的表現連提名都沒有。還有，戲份或許沒有許光漢等

  人多的庹宗華，卻貢獻出了整部電影的最大淚點，鐵漢柔情對兒子有著說不出口的愛，他

  眼裡的歉疚與深情惹人心疼，同樣希望他能入圍金馬獎，如果可以那就順便帶上王滿嬌吧

  ，她也讓我紅了幾次眼眶。


  「曾為誰受過傷，很缺憾的時光，在消散之前就用愛原諒。」


  願所有人都能被理解、被善待與被愛，然後溫柔的被接住。



  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --

  所以我不是說如果沒意外的話嗎^_^你的回文也是讓人笑死欸'
