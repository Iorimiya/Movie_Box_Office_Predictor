url: https://www.ptt.cc/bbs/movie/M.1677569038.A.D9E.html
title: '[好雷] 關於我和鬼變成家人的那件事-好笑但... '
content: '雷文防雷資訊頁

















  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  連假衝了電影院


  關於我和鬼變成家人的那件事  50分鐘前買2人的票  竟然只剩前兩排了


  這片票房真的猛啊


  早知道就不要省訂票錢了QQ


  以下心得條列式



  1.個人覺得林柏宏的演技相當不錯


  毛毛這角色不是他演的話  可能不會這麼出色


  一些年輕演員普遍不佳的口條  林的表現也可圈可點


  乍聽尷尬的台詞從他嘴裡說出都不太有違和感



  2.這片的笑點蠻對我的味的  幾個笑點出來的時候全場幾乎爆笑


  不過幾個笑點預告就已經爆了 正片演出時就比較沒那麼驚喜



  3.最後病房跟毛爸那段  理應最高潮感動的點


  但我覺得節奏有點怪  有點破壞情緒


  應該是剪接問題吧  拖太久了


  在河堤毛毛消失那邊還比較感動 (然後他又出現了)



  4.我又又又遇到看電影一直氣音講話的人了


  電影院這麼安靜  真的不要以為氣音跟隔壁講話就不會影響別人啊




  總而言之


  關於我和鬼變成家人的那件事  對我來說是可以讓人放鬆大笑的好看電影


  感動的部分我倒是覺得尚可  沒很打動到我


  還是推薦


  --'
