title: '[  負雷] 關於我和鬼變成家人的那件事，就是矯情'
content: "作為lgbt，我對許光漢沒意見\n反而是劇本的毛毛問題很大\n\n單\n\n何況\n同志形象真相當刻板\n\n借用中國對火影忍者女性分析，基本上改一下完全能對上\n\
  \n毛毛不可能餘情未了前，就對丈夫裝帥發花癡湊著吻\n就程導觀點看來，同志是一種第二性的類似於直男挂件的東西。\n同志只有四種，地母，蕩婦，女巫，聖女。\n\n\
  在他們看來，無私奉獻的母親，慈愛，溫柔，勇於付出，這是他們對於同志最大的讚美。\n這是以大地母親為基礎結合同志的生育功能的抽象化的一種存在。\n\n最壞不過是蕩婦，對於感情的不忠貞。（然而很多時候他們又渴望又厭惡蕩婦）比如說濫\n\
  交的議員之子和炎亞綸。\n\n\n女巫，這代表著那種神秘的特別的，無法理解的同志，比如說厲鬼。\n雖然強大，是某種自然力量的化身，但是往往也是不好的自然力量。\n\
  其實毛毛的冤死是可以厲鬼化，但勢必會和地母身分和喜劇色彩衝突….不好處理\n\n聖女，指的是為一群人犧牲的同志，比如背景版的胖同志。\n\n而毛毛是第一種，地母。\n\
  作為物品去看她們，她們還算合格。\n\n在程導看來，要怎麼突出她作為同志最美麗的那一面？就是去送死，愛到去死。\n 她們可以有自己的想法，但是都必須要次於直男們的，她們不過是第二性的，並且也絕\n\
  不會有什麼複雜的想法。\n\n 比如說毛毛，前期作者給予了她他認為的同志的最大的缺點，嫉妒、感性、爭風吃醋（\n例如開始之對吳明翰的刻薄），這反而是因為偏愛她，願意塑造她讓她突破改變所以才給\n\
  她這些缺點。\n除此之外的缺點？不可能的，有的話就是厲鬼。像帶土，長門這種複雜的心理過程，同志\n是不會有的。\n\n設計思路不應該是“我要設計一個為了xx犧牲的同志”\
  \ 而應該是“我要設計一個人，恰\n好是同志，又恰好因為性格原因和xx結緣。\n\n\n\n這才是同性異性都一樣\n事實上只要你不是白痴都應該知道，\n同婚法還沒完全適用民法，就一樣會有殺人騙保，人口販運這類爛事\n\
  \n\n台灣.......可以再鄉愿些阿\n\n\n\n\ncome with me 劉家凱實在軟趴趴\n\n濱渦正志的痛苦指數max屌打啦\n\n\n\n\n\
  \n\n-\n近幾年來我參加過的同志遊行\n好像通過了同婚\n就天下太平了！\n錯\n這只是開始\n\n完全適用民法\n是否要人工生殖法規畫代孕\n避免殺人騙保，人口販運"
