content: '看片名加預告

  以為是要走同志 冥婚 故意搞怪搞笑路線

  看完

  不敢相信



  片頭一開始的古厝靈堂 弄得很有質感

  甲到爆的健身房

  飛車追逐拍起來也很刺激不假 超高水準 令人驚艷

  以國內來說算的上前幾名(應該?!看得不多)

  毛毛在舞池忘情跳舞拍得很美

  笑點也不老梗 新又不尷尬

  哭點從爸爸私下跑去找家豪開始


  救護車上

  Q:你到底在跟誰講話 A:跟我老公



  全片看起來無冷場

  沒有煩躁無奈感

  有笑有淚拿捏很好

  值得上電影院看

  雖然非假日 但幾乎爆滿狀態

  要看建議提前買票


  --'
