title: '[討論] 關於我和鬼 破三億啦！！'
content: '官方今天宣布上映滿月破三億啦！


  正式進入國片票房前十名，恭喜！！



  今天三位主演在香港出席亞洲電影大獎活動

  紅毯人氣超高！直播刷一排韓文

  好電影果然讓人氣再攀高峰

  希望台灣能持續創作出這麼成功的國片！






  這部真的很耐看，

  昨天去電影院四刷時，發現居然滿場好驚訝！

  大家來分享印象深刻的台詞吧！


  --

  以這部的好看度跟經典度，四億真的很有可能

  沒問題的，鬼家人票房一直穩居全台第二

  會成為經典的神作

  15


  覺得監製的這個回答好好笑'
