url: https://www.ptt.cc/bbs/movie/M.1676564285.A.42A.html
title: '[好雷] 關於我和鬼變成家人的那件事'
content: '雖然上映不到一週


  但如果從金馬影展開始算的話也已經默默刷了幾次


  想從幾個面向談一下這部電影的優點


  有一點劇情雷所以還是防雷一下










  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  想從幾個面向簡單分享一下我喜歡這部電影的地方







  電影一開頭就把所有角色的標籤貼好貼滿


  恐同直男、死Gay、花瓶等等


  一直到後半段開始才慢慢把彼此身上的標籤撕掉


  原來恐同直男不是恐同，而是對未知的不了解


  原來在Gay Bar狂歡、被說只會嗑藥打炮及時行樂的同志們


  在心裡深處也只是想要有人可以愛自己一輩子




  整部電影也很切合主題


  因冥婚「結合」的恐同直男和死Gay


  雖然沒有真的變成相愛的兩個愛人


  卻變成了更深厚情感的「家人」


  家人之間的愛才是我覺得整部電影的核心


  毛爸和毛毛因為愛著彼此反而互相傷害


  最後也因為了解彼此間的愛而解開彼此的執念








  很久沒有幾乎所有演員的表演都沒讓我有感到尷尬的感覺了


  幾位主演的口條都很順暢，肢體也很放得開


  許光漢電影裡有不少要大吼大叫的場面


  但聲音聽起來卻滿清楚的


  (在此就不點名好幾部其他電影主演在演大吼大叫的時候完全聽不懂他們說什麼)


  雖然宣傳感覺有點在主打賣肉的部分


  但裡面他的動作戲和搞笑的表情動作表演反而更吸引我


  林柏宏飾演的毛毛我第一次看的時候其實不太適應他比較刻意字正腔圓的咬字


  但看了第二次以後就有點明白他為什麼會選擇這樣詮釋


  裡面有一些比較文謅謅的台詞(像是驟然離世這種比較不生活化的詞語)


  搭配毛毛的聲線咬字反而意外很搭XD


  而且林柏宏的聲線和肢體也很按照普羅大眾對同志應該有的想像去表演


  但又不會太過度


  而且不管是古靈精怪調皮整吳明翰的表情


  或是在Gay bar沉浸時的表情都詮釋地很細膩


  真的是滿厲害的


  王淨在整部劇能表現的地方就比較少


  但每個鏡頭的小表情(像是翻白眼XD)都滿讓人印象深刻的XD


  最驚喜的應該是蔡振南飾演的孝哥被附身


  看了好幾場沒有一場觀眾沒有爆笑的


  演技好到不敢相信


  王滿嬌和庹宗華的毛嬤和毛爸也是很戳全場的淚點







  除了一些看完電影就會在腦海中揮之不去的那句「不敢相信」之外


  很喜歡那些用歌詞接龍接梗來來回回像打乒乓球一樣的鬥嘴


  像是最開始的「只想到績效沒想到積點口德喔」

  「沒有，因為你只想到你自己」

  「要不然天天想你喔」


  或是後面的「最後的疼愛是手放開」


  這種單看台詞會讓人尷尬到不行的接歌環節


  在這部電影中的前後融合後卻顯得恰如其分XD


  整部電影的前半段這種台詞梗笑點接得很環環相扣


  這部分也是要稱讚寫台詞的編劇真是有才華XD






  自從第一次看完最後演員表發現有大鶴之後


  後面幾次看都很認真在找大鶴XD


  目前是有在Gay Bar舞池看到一個戴惡魔角格子襯衫的人長得有點像以外


  最後面第四台被上身的車後座也有看到


  不知道還有人有看到其他地方嗎?XD






  最後想再說


  「關於我和鬼變成家人的那件事」


  不只是一部以同志冥婚的喜劇電影


  更是關於愛與尊重包容的電影


  不論性別、年齡、性向


  都可以在看完這部電影後得到一些感動和歡笑的


  推薦大家進戲院觀賞


  --'
