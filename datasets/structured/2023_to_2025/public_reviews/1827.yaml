url: https://www.ptt.cc/bbs/movie/M.1677999321.A.DB1.html
title: 'Re: [討論] 關於我和鬼變成家人的那件事  小細節'
content: '前天又去刷了一次發現一個大家沒有討論到的小亮點

  記得第一次看的時候在片尾看到贊助商有Dr.情趣還在想怎麼沒什麼印象

  結果這次發現吳明翰最後跟阿嬤毛爸視訊的時候

  電腦左邊放了一個Dr.情趣的潤滑液XD


  順便分享一下小小的觀影心得


  笑點和驚嚇點都抓得剛剛好

  色調很漂亮 歌也很好聽

  去年剛失戀所以最有印象的是家豪那條線

  可能也是因為這樣我的哭點跟大家不太一樣

  我是在吳明翰揍人那段偷抹眼淚的

  可惜現實世界沒有人會幫我揍冷暴力渣男

  就算有 我也和毛毛一樣捨不得看他被揍

  看親愛的對象mv可以感受得到毛毛是會自己腦補很多小劇場的人

  可能生前也用這些小劇場欺騙自己家豪很愛他吧

  這樣的人最殘忍的是他讓你眼睜睜的看著他一天比一天要來得不愛你

  因為知道你離不開他 在有下一個人之前都會繼續待在你身邊折磨你

  就像家豪已經有新男友了就想用冷暴力想把毛毛甩掉一樣

  後面醫院因為在預料之中所以沒有特別觸動到我的淚腺

  不過還是有感動到 大概是拿爆米花的手停了幾分鐘的程度這樣www


  我第一場是看包場 導演跟百倫有來映後

  那時候就有人問導演飛車追逐是不是因為經費不足才用特效

  我有點忘記導演那時候是說了什麼

  大概就是導演說他希望每次拍片都可以用一些不一樣的技術來精進自己

  總之整個映後問答都能感覺到監製跟導演都是很有想法的人

  期待金盞花的下一步（部）！


  --

  You know there''s many different ways that you can kill the one you love,

  The slowest way is never loving them enough.


  --

  有看到導演的色彩學 不只這個 金盞花的YT頻道有很多可愛的花絮可以看'
