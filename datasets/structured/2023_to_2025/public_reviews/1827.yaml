url: https://www.ptt.cc/bbs/movie/M.1677487325.A.210.html
title: '[好雷] 關於我和鬼變成家人的那件事'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  近年國片題材越來越多元，即便是喜劇也都會結合溫馨元素。2022年金馬影展的閉幕片《

  關於我和鬼變成家人的那件事》，甚至還結合冥婚、恐怖、懸疑與查案元素，讓這部喜劇

  片更豐富且笑中帶淚，是部適合闔家觀賞的優質國片。



  習慣是能夠養成的，鋼鐵直男吳明翰一開始被「死Gay」毛毛逼迫資助環保團體，只想捐

  助300塊，被迫多加一個零。與毛毛經歷過片中的一切之後，簡訊收到扣款通知，吳明翰

  也默默接受。電影最後，觀眾看到吳明翰坐在同樣一張書桌前，但桌上的擺設卻大不相同

  。除了他開始使用環保杯之外，他也開始關注同志議題，環保杯上貼著2016年流行的標語

  「人鬼可以冥婚，同志不能結婚」。



  電影的主題是「無條件的愛」，吳明翰從一開始恐同而排斥毛毛，到後來真心想幫毛毛伸

  張正義，兩人之間也建立起家人的情誼，毛毛終於想投胎之時，吳明翰反而有些捨不得。

  最後的任務中，吳明翰中彈生命垂危，毛毛也不顧自己再附身接觸陽氣會魂飛魄散，硬是

  要親自為對方開路。恐同的吳明翰不再討厭毛毛，毛毛也真心希望對方好好活下去，這是

  無條件的愛。



  整個故事的背景起源自疼愛毛毛的阿嬤想為他找個歸宿，所以安排冥婚，由蔡依林演唱的

  主題曲《親愛的對象》MV劇情有演出毛毛身前祖孫倆的互動。原來，兩人都由於與眾不同

  的小秘密，而互相體諒、相知相惜。對阿嬤來說，只要毛毛快樂，喜歡誰都可以。就連一

  般較難接受的父親，也在媽媽勸說並幾經考慮之後，決定帶著毛毛最愛的蚵仔煎去與兒子

  及兒子心愛的人共進午餐，沒想到，卻撞見兒子遭人劈腿現場。明明是怕毛毛受傷，卻又

  嘴硬堅持是自己無法接受同性婚姻，其實不論是毛毛生前還是死後，爸爸都已經盡自己最

  大的努力表達內心的愛。



  亞洲父母常常無法將自己對孩子的愛親口說出，但默默做的事也有同樣的份量。醫院裡那

  場催淚的戲，吳明翰對毛爸說「毛毛都聽得到」，讓毛爸說出自己對兒子滿滿的愛，也讓

  毛毛了無遺憾，能夠放心去投胎。最後，因為這場「冥婚」而成為毛家女婿的吳明翰，也

  確實成為毛爸與阿嬤的家人，他們固定會吃飯、視訊，就像毛毛說自己最大的心願就是找

  到一個可以愛自己一輩子的人。能夠找到相守一生的人固然幸運，但家人果然還是最無條

  件的愛，這也就是吳明翰「和鬼變成家人的那件事」，甚至與鬼的家人都變成家人。



  感動之餘，作為一部喜劇，《關於我和鬼變成家人的那件事》也非常成功。從開頭的冥婚

  儀式後，三姑六婆一起把毛毛的紙紮搬到吳明翰家時，紛紛說「紙做的還這麼重」，到毛

  毛調皮捉弄吳明翰讓他全裸上街，甚至最後蔡振南被鬼附身的「不敢相信！」與「我殺人

  了！」都讓觀眾笑得合不攏嘴。另外，由於導演是拍鬼片出身的，不少人也擔心片中少數

  有鬼影或屍體之處會不會很嚇人，但除了突然出現時的突發驚嚇（jump scare）之外，整

  體來說都還是以搞笑成分居多。全片的笑點自然不刻意，反而是這些大家會在不經意間脫

  口而出的話最有「笑」果。



  講到這裡就會發現，其實，「同婚」、「同志」與「性別議題」只是這部電影「順便」提

  到的主題而已，這才是推廣LGBTQ+電影的最終目標。當這類議題習以為常地出現在其他類

  型的電影中，並且不是主要探討的主題，那就成功了。不過，在走到那一步之前，程偉豪

  導演用喜劇的手法告訴「恐同」或「性別歧視」的人，不了解的事情了解之後就沒事，無

  須害怕。吳明翰如此，毛爸也是如此。電影從一開始貼上無數標籤，最後再一張張撕下，

  透過鋼鐵直男吳明翰的視角去理解，除了喜歡的人性別與自己相同之外，同志對愛的渴望

  或是其他所有一切都與非同志者無異；晴晴的反轉也是對性別歧視的一種反噬。



  搭配上民間習俗「冥婚」的元素，可以說是絕配的「混搭」。除了呼應「人鬼可以冥婚，

  同志不能結婚」的標語之外，也讓整部電影更出乎意料，更無厘頭。不論是短片《保全員

  之死》、《搞什麼鬼》，還是長片《緝魂》與《目擊者》，眼光敏銳的程偉豪導演時時刻

  刻都將觸角伸向國片尚未開發但潛力無窮的領域。這次《關於我和鬼變成家人的那件事》

  混搭極為成功，也讓人期待未來導演還會端出什麼菜色。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
