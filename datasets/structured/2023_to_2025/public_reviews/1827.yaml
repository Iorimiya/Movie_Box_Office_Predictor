title: '[好雷] 關於我和鬼變成家人的那件事'
content: 'Movie版首PO~

  雖然已經很多人PO過了，但是只有自己寫出來的心得，才會是自己的。

  這部真的是一片好哭又好笑的片，推薦大家進電影院觀賞~













  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  很久沒進電影院看片了，去年確診之後加上各種事情忙碌，唉唉~

  看到預告的時候就覺得這部片應該蠻有趣的，實際看了之後也不辜負了期待。


  先來說說幾個印象比較深刻的片段吧：

  片中一開始的時候有點恐怖片的元素，直到阿罵那句靠X出來之後，馬上緩解了氣氛XD。

  許光漢在浴室翻鏡子的那段，應該是在致敬某部恐怖片?

  但是忘了是哪部? 還請高人指點。


  觀後感：

  雖然主線劇情略顯單薄，飛車追逐的動畫有點生硬，還有很多進步空間，

  林子晴的計中計中計看的也有點唐突，但基本上整部片瑕不掩瑜。


  雖然親情之間的題材並不是什麼新鮮的東西，但有時候並不一定要追求創新

  把既有的題材處理好，也會是一部值得看的電影。

  就像毛爸一樣，很多事情我們有時候不知道怎麼開口，但往往之後

  才會後悔當初沒有好好說出來。毛爸碰到家豪跟新男友在親熱之後，心情還沒整理好

  的當下，又聽到毛毛提出想要結婚的事，而且原本就一直不知道怎麼面對同性戀這件

  事，最後就在飯桌上反射性地打斷了毛毛的談話。雖然劇中沒有交代毛爸的成長環境

  ，但是從台詞中就可以刻劃出他的性格，以及他試著努力去接受兒子是同性戀。


  吳明翰和毛毛之間的友情(請允許我先這樣說XD)也是如此，並不是創新的題材。

  兩個人從互看不順眼，到互相合作，相知相惜。

  很多時候我們主動去追求的感情，往往都沒有成為美好的結局。

  吳明翰對林子晴的心動，毛毛對家豪的掏心掏肺，都只落的一場空。

  也許就像廟公所說的，緣分就是天註定。

  但你不走過那段路，不去跌倒受傷過，你不會知道何時該堅持，何時該放手。

  不要執著於那些錯過的感情，而是要去愛那些珍惜你的人。

  當兩個人一起經歷各種困難和考驗，這段感情才會更加堅定。


  劇中很多的哭點，都來自於失去後的悔恨或不捨。

  人生沒辦法重來，時鐘的指針不會往回走，希望大家也能珍惜愛你的人。

  不論那是什麼樣形式的愛 :3


  --'
