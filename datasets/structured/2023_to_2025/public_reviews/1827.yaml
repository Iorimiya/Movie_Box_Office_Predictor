url: https://www.ptt.cc/bbs/movie/M.1691903688.A.4CC.html
title: '[好雷] 關於我和鬼變成家人的那件事  愛的延續'
content: "雷文防雷資訊頁\n\n有超大雷 慎入!!!!!!!!!!!!\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n《關於我和鬼變成家人的那件事》，讓人深深體會到，在生命中遇到的重要他人，確實會\n\
  在自己身上留下痕跡，受到極大影響，甚至改變我們未來人生甚鉅，無論最後那個人，是\n否仍然留在我們身側。如毛毛愛環保，遇到毛毛後的吳明翰，在片尾開始用起環保杯，恐\n\
  同的他，還在杯子上貼上了彩虹貼紙。也因為這場冥婚，他多了毛毛的家人，成了自己的\n家人──即使毛毛已經投胎，這段冥婚已經算是結束，可是那些感情延續下來，成了日常\n\
  。\n\n　　這部片幾乎從頭笑到尾，非常多梗，不勝枚舉。不過後半段如網友說的一樣，會忍不\n住落淚!!!!!從毛毛到處附身只為了救吳明翰，以及後來毛毛爸向吳明翰訴說內心話，展\n\
  現對兒子無限的愛那段，就像毛毛說的，因為他的爸爸，讓他明白了何謂無條件的愛，於\n是他心願已了，終於明白其實自己早已得到，他以為永遠都不會擁有的「有人可以愛自己\n\
  一輩子」，得以投胎。\n\n　　戲裏的吳明翰，老公力超足，看到毛毛傷心難過，直接霸氣表示:「反正你又不\n需要飼料，上輩子你養我，這輩子我養你啦!!!!」超級帥氣，如果我是毛毛都要愛上他了\n\
  XDDDDD只是他們羈絆彼此的緣分，是因為吳明翰上輩子是毛毛養的狗，真的超級搞笑。\n\n 　  兩個人隨著時間相處，產生了感情，雖然應該不是愛情(!?)但確實產生了關心和愛\n\
  (!?)，會擔心彼此的安危、顧慮對方的心情，為了保護對方，即使知道會陷自身於危險，\n仍在所不惜。\n\n 　　許光漢和林柏宏，如果以”個人”來說，平常對他們沒有特別的喜愛，換句話說，\n\
  是對他們不那種迷帥哥偶像的愛~~但是只要一演戲，立刻就會愛上他們戲裡的角色。這樣\n來說，兩人真的是好演員。喜歡他們，不是因為演員個人的魅力，而確實是因為受到演技\n\
  影響而喜愛~~\n\n　　看完這部，也不禁覺得應該要學學毛毛，做點對社會有貢獻的事情(他反核、愛環保\n常淨灘，吳明翰在幫他了卻遺願清單時還對他大吼:「你每天拯救地球、拯救流浪狗不累\n\
  嗎?就沒有膚淺一點的遺願嗎?」 超級好笑。)\n\n 　　這部片是部輕鬆有趣的電影，但也意外的，有不少地方讓人省思。可以排在我的國\n片前三名了~~是難得會想讓人想再重看的國片。另外兩部是《聽說》和《怪胎》，《怪胎\n\
  》也是林柏宏演的，雖然當初看完，發現網路上評價不怎麼樣，但我覺得，它告訴了我們\n，人要為自己的所愛，努力一把，畢竟，世上要遇到另一個能懂自己的”怪胎”是何其困\n\
  難，若非努力過後才發現彼此終究不適合的話，哪能輕易放手呢?\n\n　　然而感情或許也像《關於我和鬼變成家人的那件事》說的，姻緣天注定。天意讓他們\n相遇冥婚，改變彼此、成就彼此。如果沒有毛毛，吳明翰不會變得柔軟；如果沒有吳明翰\n\
  ，毛毛恐怕沒有辦法了卻心願，順利投胎。\n\n　　如同自己曾在生命中遇過的某些人一樣，無論如何，對方確實早已成了自己生命中的\n一部分，無法忘卻也無法分割，就像一開始說的，那樣的一個重要他人，沒有遇見對方，\n\
  就不會長成現在的自己。很多東西，或許一輩子都放不下，然而我們會學會與它共處，繼\n續下去自己的生活與人生，開始，或延續別的幸福。\n\n--"
