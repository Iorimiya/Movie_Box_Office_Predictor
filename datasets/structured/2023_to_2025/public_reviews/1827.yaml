url: https://www.ptt.cc/bbs/movie/M.1676087331.A.291.html
title: '[普偏負雷] 關於我和鬼變成家人的那件事'
content: '看完《關於我和鬼變成家人的那件事》，我忽然能夠明白導演監製前一部《當男人戀愛時

  》上

  映後，被身邊不少女性友人罵翻的心境。


  我真的很少看一部喜劇片，沒有笑容，只有生氣。不過如果是抱持爽片的心情去看，套句

  朋友說的，不用大腦去觀影，也許會比較自在吧。




  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  劇情其實就非常直線的在進行，從警察飛車，到撿到紅包冥婚，到警界黑吃黑（結果黑吃

  黑也是演半套），然後賣弄一下親情溫馨，沒了，就沒了。


  撇除CG動畫真的假到靠北，劇本那些不合理的人設真的就算了（許光漢那麼拼那麼嘶吼我

  也是服了），這部片從頭到尾給我一種消費男同性戀的既視感，或說得更精準一些，是非

  常過分的去刻版化這個社會對男同志的既有印象。


  並不是說性別議題不能碰觸，也不是說談及性別就必須苦悶而乏味，而是導演的意圖總讓

  我覺得，他不斷藉由一個看似好笑的故事，來不斷深化某些刻版印象。但其實圈內才不止

  ，或不是，也根本不會這樣。


  也許這是為了迎合直男眼中的同志形象，所不得不生硬的呈現，但連電影裡扮演同志角色

  的些微舉止，都讓我覺得過分失真時，反而讓我更加的出戲，甚至覺得自己莫名被消費了

  。


  更甚在撇除這些成見，劇情過於直線的進展，加上許多求好的元素，如愛情，動作，性別

  意識等混雜在一起，都讓這部電影徹底失真。


  要定位成喜劇嗎？但直線發展的劇情，以及不斷玩弄的直男與同性的衝突，加上電影中一

  直把異男形塑成講髒話，粗魯，國罵幹來幹去的形象，而在面對同性戀的陰柔嫵媚象形而

  出的對比，其實說直白一點，許光漢除了罵幹，林柏宏除了擺鮮陰柔氣質之外，我真的覺

  得沒什麼好笑，也真的好難笑。


  而要定位成溫情劇嗎？片中有非常開明的阿嬤與她一票「女性」親友，唯獨「只有一個男

  性父親角色」反同。對這個設定我也是極度反感，為什麼非要一再樹立傳統嚴父必然反同

  （而且整個家族只有他一個男生？），而女性必然知性（整個家裡就剩爸爸這個男丁了？

  ）


  此外，選角的口音也非常糟糕，阿嬤的氣口，以及過分開明的形象，怎麼會養出台語講也

  講不好，思想傳統的父輩？


  而若要論及警匪動作，那就更糟糕了，整部片開高走低，甚至到一半都能猜到劇情，CG特

  效的粗糙濫造，真的只有不堪入目可言。


  若非要說甚麼好看的，有啦，主角們帥的帥，美的美，資深的演員仍是老戲骨。若真的不

  帶大腦去看就是一部爽片。


  但對我而言，就算摘掉大腦去看，我還有腦幹，而這部片確實是讓我呼吸都會感到憤怒的

  雷。


  喔，我還沒說裡面一堆開了體態玩笑，結果沒有圓回來設定，原來被物化這麼讓人生氣。


  ==============================


  另外，看完這部之後我腦中立刻想起《我的左眼見到鬼》這部老港片。其實一樣有鬼魂，

  愛情，喜劇的組成，反而《我的左眼見到鬼》更能精準把主軸故事說好，同時讓支線陪襯

  出喜劇的情節。


  相反的，《關於我和鬼變成家人的那件事》也許想涉及的太多，太廣，太雜。許多要素到

  最後都只是一種噱頭，同志議題是如此，即使抽離，其實也不影響整部片的調性，既然如

  此，又何必硬要畫蛇添足。


  我就講難聽一點，男同性戀就算再愛蔡依林，也不會無限循環＜愛無赦＞，到底是把天后

  其他作品，還有妹Mei姊的歌放到哪裡去，這就是我覺得導演完全不知道圈內的模樣，強

  加亂消費而讓我反感的地方。


  另外關於電影中林柏宏給許光漢的穿衣建議，也真是有夠超現實，包括內褲料子，一看就

  不對啊，那麼不貼膚最好包覆性很好！


  當然回到同行友人說的，看個電影何必那麼較真？記得第一部接觸這位導演的作品是《緝

  魂》，當時對於其劇情專業部分的設定就感到非常混怒與誇張，冷靜想想也許是自己真的

  導演的作品風格八字不合，才會有如此深的成見。


  最後，提一個自己自以為是的小彩蛋，電影開頭冥婚的配樂，不曉得有沒有人發現，似乎

  是改編自電影《我們》（喬登皮爾）的＜ANTHEM＞？




