url: https://www.ptt.cc/bbs/movie/M.1692232562.A.F5D.html
title: '[大負雷] 關於我和鬼變成家人的那件事'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  夜深人靜老婆說想看部能輕鬆笑笑的喜劇廢片


  就開了這部片來叫我一起看


  然後就開啟了讓我無言的兩個小時














  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  老實說全程沒有一個笑點我有笑過，也沒有任何一個哭點我有哭過





  首先開場健身房釣魚抓賊還好。



  飛車特效很多人吐過就不說了，看過過程


  以台灣、尤其是台北的交通密度可以做出那些超速跟特技甩尾?


  開過車跟看過台灣警察追逃犯就知道，市區逃逸根本不可能直線，逃多久就會被卡了


  大部分都是在路上或巷內低速繞一繞企圖擺脫追擊


  全速衝過然後被兩車夾住的神奇物理引擎也讓我很無言




  下一段撿紅包在警方辦案的狀況雖有現實不合理但動機上尚可接受


  證物應該是找其他警察一起戴手套蒐證，不然警察要故意跳灰你也洗不清


  隨便在路邊撿一堆東西就誣賴是你的不就百口莫辯?





  然後紅包這東西的存在十分牽強附會到不合邏輯的部分


  不是刻意要炒作同志話題性就是導演根本不懂文化，當然我傾向是前者



  傳統上不論性取向，只要是生理男性就不需要丟紅包這種事情


  丟紅包的原因是因為所謂的"女性不入宗祠 "的傳統民俗信仰


  未婚女性如果死亡就會無宗祠可供俸，淪為孤魂野鬼


  所以才要安排冥婚讓女性魂魄有所歸宿


  而男性本來就會入祖宗牌位，所以根本沒有丟紅包的意義



  就算是應死者生前有什麼強烈要求，死者也應該是會要求與其男友冥婚


  沒有任何丟紅包的意義





  接著從相處看到毛的個性塑造來說。


  無關性向性取向，這種活在幻想粉紅泡泡中、自我為中心的類型


  我真的沒什麼感到共情或是共理或是討人喜歡的部分。



  撇開對方是渣男的部分


  遇到不順自己的意就強迫他人去完成，不順自己的意就造成他人困擾


  強加自己的理念在他人身上，緊迫逼人又要把自己灌醉等。



  要不是是鬼跟同志，這些因素放在活人身上根本妥妥的情勒地雷


  活該人家不喜歡你


  我要是伴侶，就離這人遠遠的


  我要是父母，就好好開導別讓你出去害人






  緝毒線也很無言


  有人說過的健身房演出很自然，到酒吧反而莫名其妙就不提了



  依照那個時間


  毒販大清晨後面一直跟著一台車，毒販不會懷疑?連民眾平常開車都會懷疑了


  這是老江湖該有的警覺性嗎?



  還有益生菌業務特地到偏僻"工業區廠房"去兜售益生菌


  我是沒看過這種反常到可疑度滿滿的鬼神操作啦。




  且說到內鬼，一般有好幾種辨別方式


  1.對每個內部人員放出假情報，藉此抓出內鬼


  2.跨組聯合，或是跨層聯合，把情資交給高層或是他組指揮去聯合處理



  總之也不是直接開口問"誰是線人"這種方法?


  或是 A說B要偷渡 我們快出發!  B說C要偷渡 我們快出發!


  你們出發前都不用老大統一指揮命令的嗎?




  很多演員的反應過於浮誇也反常俗套


  黑道老大尖叫的時候，小弟居然一起手足無措尖叫


  通常不是二把手接手把眼前的人處理完再善後嗎?




  接著說到女主，內鬼通常是組織之秘，不被雙方所知。


  結果內鬼到一開口全組織的人都知道他是內鬼，也是神奇的組織之秘了





  到最後與父親間的和解，算是一個可預見的結局


  沒甚麼大缺點，但也就是那樣




  全片來說邏輯缺陷過多，一部片如果只有一兩個地方吐槽就還好說


  全片邏輯都不在線實在讓我覺得相當無言


  如果不是為了陪太太看，我真的難以想像如何度過這90分鐘



  劇情來說就是俗濫到大家的浪漫鬼屋或是跟生靈相處那類片的山寨片


  只是改成同志版本所以有話題



  是不算非常難看，畢竟不是什麼負面情緒滿滿，或是演技出戲，或是劇情完全破碎的爛片



  但以觀影體驗來說，如果把腦袋丟掉來看或許會比較好。



  --




  --

  不是不能，而是拍出來好不好看


  東京甩尾涉谷街頭滿滿的人潮就這樣直接甩過去


  成龍動作飛車追逐片直接撞翻街攤果攤


  終極殺陣也是飛車之間穿梭，直接撞翻兩側街景



  這部片?網路上滿滿警匪追逐飛車的資料那麼多，一到片中完全領域展開進入異世界。

  正常一顆雞蛋挑骨頭是我的問題，生的出一顆雞蛋裡面全是骨頭我也沒辦法。

  是說過很多次了，的確每次挑的片都雷


  也有比較不雷的，像是當男人戀愛時就普普


  但是大部分都是雷

  山道猴子好看多了

  海角七號雖然沒啥劇情，但是歌好聽  男帥女美有樂團有搞笑有金句


  可以說亮點比劇情重要



  這部喔，劇情跟邏輯是"大缺陷"，又沒有什麼其他的亮點。



  像陣頭、艋舺那些國片 基本上邏輯缺陷都只有一點點


  很少看過像本片一樣從頭缺到尾的

  我看錯時間單位

  連宗祠都有的，更不可能不知道習俗啦....


  一般人連牌位都沒有的才有可能'
