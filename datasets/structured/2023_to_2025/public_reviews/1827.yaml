title: '[有雷]關於我和鬼變成家人的那件事漏網驚喜彩蛋角色'
content: "( 有特地在原文裡面 跟 Google搜尋 雙重確認過了，\n  板上還沒有這個未解之謎的答案。 )\n\n除了在電影上映之前有從 歌手蔡依林\
  \ 方Youtube頻道釋出的\n《親愛的對象 Untitled》Official MV ｜「關於我和鬼變成家人的那件事」電影主題曲\n\n電影的\"前導\"\
  故事 - 毛邦羽/毛毛 生前的故事 之外，\n\n官方也有在自己的 Youtube頻道釋出了：\n電影《關於我和鬼變成家人的那件事》漏網驚喜彩蛋角色林鶴軒\n\n\
  \n2023年3月19日  #謝謝各位家人的喜愛 #大鶴原來在這裡\n#飾演_礙於家裡壓力不敢坦白面對自己性向所以才會欺負毛毛的gay\n#謝謝各位家人的喜愛\n\
  金盞花大影業最後提供電影漏網驚喜彩蛋\n\n『大鶴 林鶴軒』特別演出 片段\n毛毛在Gay Bar享受狂歡時，\n目睹到高中時嘲笑他、欺負他性向的同學（大鶴 飾演）也在Gay\
  \ Bar熱舞，\n啊～沒想到原來同學也是Gay啊！\n\n#大鶴原來在這裡\n#飾演_礙於家裡壓力不敢坦白面對自己性向所以才會欺負毛毛的gay\n#毛毛在GayBar感到釋懷及放下\n\
  #眼尖的你們有發現大鶴的身影嗎\n\n\n《關於我和鬼變成家人的那件事》全台上映\n場次查詢(實際場次請以影城公布為準)\n/ /   \n\n不確定這個段落是在哪場試映後就被拉掉沒有放進去正面裡面，\n\
  但如果在官方已經有舉辦過這麼多次，但還是沒有得到正確解答的情況下，\n會不會是官方一開始在拍了之後，另有做考量，就剪掉，另外弄成彩蛋漏網片段？\n\n/ / \
  \  霸凌是不對的。   霸凌是不對的。   霸凌是不對的。\n      但如果是為了自己的交友圈關係，\n      而特地跟特地跟自己實際違背的小圈圈親近的話，\n\
  \      這個畢竟是每個人自己的選擇。\n      只是還是不鼓勵採用霸凌的方式。\n      對 當事人自己實際的內心，祝 好\n\n:\n:\n\n\
  --\n\n不敢相信？ 真的是同志族群建議剪掉的嗎？ (單純好奇)\n就我而言，我會建議該剪掉的段落，想一想就不特地贅述了，怕會飄離主軸。\n但這部片裡面變相說教的段落已經夠多了，\n\
  我自己是認為這個段落放進去正片裡面，應該也可以吧？\n\n對我 - 會帶入思考 的角度來講的話，\n我想毛毛當初看到這個畫面，回想到之前學生時期遇到的事情，\n\
  心裡面應該也是有惆悵感吧？\n然後邊看同學在跳舞，邊陷入學生時期思考時，\n被\"叫回來\" 轉頭之後，就被 吳明翰 給電到了。\n\n這個段落代表的意義，我覺得也不適合在這邊多加贅述。\n\
  但對我沒有需要特地隱藏自己性向的情況下，\n看到這個段落，對我來說是個\"衝擊\"的想法。"
