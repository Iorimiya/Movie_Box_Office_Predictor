url: https://www.ptt.cc/bbs/movie/M.1693381291.A.DF2.html
title: '[情報] 2024台灣奧斯卡代表《關於我和鬼變成家人'
content: '《關於我和鬼變成家人的那件事》

  獲選代表臺灣 角逐2024年美國第96屆奥斯卡金像獎最佳國際影片


  文化部影視及流行音樂產業局受中華民國電影戲劇協會委託辦理，召開甄選會議，推薦由

  程偉豪導演執導、臺灣影史票房排名第七的國片《關於我和鬼變成家人的那件事》，代表

  我國角逐美國第96屆奥斯卡金像獎最佳國際影片。





  該片在臺上映獲得3.6億的票房，創下臺灣影史票房紀錄第7名外，在南韓、香港、越南等

  當地戲院上映也都獲得不錯的票房。8月15日上架國際影音串流平台Netflix後，更是獲得

  臺灣、香港、新加坡及越南的觀看排行榜冠軍，電影上線5天即擠進Netflix全球非英語影

  集排行榜第7名，於各大國際影展舉辦期間，亦獲得THE Hollywood REPORTER等國際媒體

  的介紹與報導。


  文化部表示，臺灣擁抱自由且尊重各種創作及想法，具有多元文化底蘊，是激盪及製作電

  影的重要養分，文化部將持續積極輔導產製多元類型影片，強化劇本創作媒合與人才培育

  ，產製具我國文化觀點的電影，並同步拓展國內映演通路，促進臺灣電影整體產業鏈均衡

  發展，提升國片的國際能見度及競爭力。



  甄選委員小組名單（按姓名筆劃依序排列）

  李亞梅、李遠、姜秀瓊、陳鴻元、聞天祥、蔡珮玲、蔣顯斌


  --'
