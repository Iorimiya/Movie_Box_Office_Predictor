url: https://www.ptt.cc/bbs/movie/M.1676102968.A.912.html
title: '[好雷] 關於我和鬼變成家人的那件事小問題'
content: '無雷前言


  很喜歡程偉豪的作品


  節奏一向都滿快的


  這部也不例外


  劇情推展非常快


  不會讓人覺得乏味


  雖然有許多刻意的笑點但還是不爭氣的笑了


  結尾那邊也是刻意營造哭點但我沒有哭


  可能同志的感情比較難體會吧


  庹爸算是拯救了演技部分


  主角群的演技還是有點不太給力


  當喜劇片來看還算是有及格的


  對了我沒有看預告片


  只有看了蔡依林的MV就去看電影了


  後來才發現MV根本是前導預告片的概念


  推薦大家可以先看MV再去看電影


  配樂也是這部電影很加分的地方



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~















  最後阿翰是真的愛上毛毛（變成同志）嗎


  雖然有喊毛毛是老公


  但看不太出來是愛情還是友情


  要把鋼鐵直男轉換成同志應該沒那麼容易吧


  我個人是覺得應該只是捨不得毛毛離開的友情而已


  不知道導演想表達的是哪一種呢





  --'
