url: https://www.ptt.cc/bbs/movie/M.1677997855.A.6F2.html
title: '[好雷] 七重點之《關於我和鬼變成家人的那件事》'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  近期內國片真的是有如雨後春筍般冒出，其中最令人「不敢相信」，上映短短九天票房就破億的《關於我和鬼變成家人的那件事》則最為人所稱頌。至於這部集動作、奇幻、溫情、推理、驚悚於一身的喜劇電影為什麼如此炙手可熱？我們可以從幾個面向來剖析它。



  重點一：何謂同志片？


  並不是電影內只要有同志作為主角，這部片就是同志片好嗎？同志議題在這部電影中只是其中一條任務線而已。如果你是想看直男被掰彎，或是期待有色色畫面，還是追求CP灑糖的朋友們，相信我，這部片真的不適合你們。



  重點二：標籤貼滿滿


  別的電影都是不敢往角色身上貼標籤深怕被輿論抨擊，這部倒是標籤貼的很開心？無腦衝動的直男，想同婚卻死掉的gay，寧願當花瓶也不願當玻璃瓶的警花？典型愛說不出口的亞洲父親等。這些標籤乍聽之下著實令人火大，但不知為何到了這部電影裡就都變成笑點了呢？



  重點三：不要再鞭特效了


  對於看慣好萊塢特效的朋友們，對這部電影的特效絕對是槽點滿滿。但說實話，特效就真的不是這部電影的重點，更別說特效頂多才佔整部電影10多分鐘而已啊(不管是飛車還是槍戰)！真心覺得沒必要為了特效而放棄一部好電影。



  重點四：不敢看鬼片怎麼辦？


  雖說這部電影的導演「程偉豪」是導鬼片出名的(沒看過應該也聽過《紅衣小女孩》吧？)，但這部片打著喜劇的封號，所以鬼嚇人的場面跟剛剛上面提到的特效一樣屈指可數。雖然驚悚的部分是真的有點嚇人啦，但整場只需花不到10分鐘的時間遮一下眼睛應該也還好吧？



  重點五：真的會笑死嗎？


  對，預告片的副標寫的是「哈哈，笑死」，演員們在跑宣傳的時候也是一併力讚電影的「笑」果十足。這部分本人在看完之後是覺得不到捧腹大笑，但某些橋段也確實令我笑出聲來。當然每個人的笑點不同，但單論娛樂性來說，這部電影應該還是能夠取悅大部分的人的。



  重點六：演員大加分


  雙男主的部分為電影增添不少的可看性，畢竟觀影前實在是沒想到許光漢白馬王子形象會崩塌，林柏宏的死gay可以演得如此傳神？看他們一人一鬼被迫綁在一起卻又屢創佳績的劇情著實過癮。至於其他那些老戲骨們就不需多提了，他們的演技只會加分不可能會扣分的。



  重點七：元素太滿了啦！


  這部電影最大的問題不外乎就是給的東西過多了，冥婚、恐同、緝毒、飛車、家庭、反轉、靈異、驚悚、搞笑、煽情、霸凌等。這些元素確實都極具話題性，但過多的議題也容易產生比例分配不均的窘境，也會造成許多觀眾對特定議題抱持過高的期待反而導致失望落空的現象。



  最後，其實感受的到導演企圖心非常的強烈，在挑戰情感戲以及喜劇電影之餘，也不忘加入自己所擅長的推理以及驚悚元素。如果今天這是一部影集，有足夠的時間發揮，這部戲絕對會更為出色；反觀在電影有限的時間內，或許單純聚焦在喜劇以及情感戲的發揮會更合適。


  即便如此，這並不會完全掩蓋《關於我和鬼變成家人的那件事》這部電影的成功，畢竟這部真的可以稱得上是近期台灣電影難得的喜劇佳作！





