url: https://www.ptt.cc/bbs/movie/M.1673805656.A.E09.html
title: '[好無雷] 關於我和鬼變成家人的那件事'
content: '昨天看了家宴場，原本預想這部片會是恐怖驚悚為主、搞笑可能佔一點點元素，但實際看

  之後恐怖的部分其實不多，幾乎沒有什麼嚇點（有1、2個Jump Scare，但音效其實都不大

  而且都是搭配笑點）。


  怕恐怖片的人也可以看，反而是整部片笑點滿滿，預告並沒有把所有的笑點演完。


  映後監製有說這個應該是最終版，先前神秘場跟金馬放映有聽取觀眾意見做了調整。因為

  沒看過先前版本無從比較，但正式版整體下來很流暢，該有的動作戲、搞笑、驚喜甚至是

  轉折都有做到，這部其實很適合放在過年當賀歲片，檔期有點可惜。


  林柏宏、許光漢、王淨在劇中的火花也不錯，演技很棒也沒會讓人覺得尬。


  另外爬文有看到先前神秘場放映有人反映特效太假、太長這件事，正式版「感覺」有掩蓋

  掉這些缺點（因為沒看過先前的版本所以用「感覺」來形容），就是特效畫面快讓觀眾覺

  得假感出來時，畫面就切掉了。但如果你是常看好萊塢特效片，或對這方面有研究的人，

  其實老實說還是會覺得假，但又會覺得已經比其他國片做得好了。


  硬要說缺點的話就是片長130分鐘有點長，但觀影過程不會讓你覺得不耐，故事也說得很

  完整。只是覺得如果能刪掉幾場支線變成100分鐘，或許就會更完美了。


  整體而言是部會想推薦給朋友看的娛樂片。


  --'
