url: https://www.ptt.cc/bbs/movie/M.1683526980.A.3A0.html
title: 'Re: [情報] 關於我和鬼變成家人的那件事  香港票房'
content: '更新第二週票房，鬼家人在香港表現真的不理想

  場均人數由三十幾人滑落到十幾人，票房累計670萬，雖然新聞宣傳稿說目前已經破

  800萬，本週星際異攻隊3強勢登陸香港，囊括大部份票房，局勢大致已定，監製金百

  倫說破2500萬要再訪港謝票，基本上是不可能的，不要說1500萬，連1000萬都是很拼

  才能衝破，前篇一樓推文說票房賣的很好，如果以同志題材來看是不差，但如果以事

  前宣傳和排片規模來看，這表現很差


  香港片商這次是給足面子，高規格款待訪港的三位演員，大陣仗的媒體採訪，新聞媒

  體宣傳呈現出鬼家人好像在香港很受歡迎，但像前篇說的，這票房有一部份是中國人

  到香港看撐起來的，還沒有真正打入到香港本地市場


  只是有件事很納悶，香港早就全面取消口罩令，但這次鬼家人香港謝票前官方卻希望

  參加的觀眾能戴口罩，新聞畫面看到值勤的保鑣也都戴口罩，有幾位是外國人，外國

  人是最不喜歡戴口罩，不知道這是香港片商自己決定，還是台灣電影公司要求的，如

  果是台灣這邊要求的那就太誇張了，不只是大頭症還是歧視，連香港本土最紅的MIRROR

  團員去謝票時也都沒有要求觀眾戴口罩


  --


  香港市場很重要阿，雖然只有七百萬人，但電影方面消費能力是很強的，一堆香港本

  土很一般的電影都能有很好票房，像去年的闔家辣和阿媽有咗第二個都有三四千萬以

  上的票房，雖然也和疫情解封以及MIRROR成員也有關

  鬼家人是台灣商業片的新嘗試也是里程碑，如果台灣賣座的商業電影在香港市場也能

  穩定維持兩千萬以上的票房，對台灣電影發展絕對是好事阿，香港電影人就是已經完

  全不重視台灣市場，才會變成現今港片在台灣票房都淒慘無比，就連破紀錄的毒舌大

  狀都乏人問津'
