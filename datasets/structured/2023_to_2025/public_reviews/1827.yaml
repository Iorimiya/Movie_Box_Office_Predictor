  \ \n \n \n當初這部上的時候版上不喜歡佔多數\n今天懷著有點戰戰兢兢的心看了之後\n嗯...很好看很輕鬆很歡樂啊\n已程偉豪的作品看目前排名最後的還是緝魂\n\
  更何況緝魂還是有點東西的\n而這部電影我會建議看之前先做一件事\n先把腦袋丟一旁好好看長達2小時的笑話\n他是那種禁不起考證和邏輯的喜劇式爽片\n但從商業片角度來看這些粗鄙笑鬧是吸引一般觀眾的\n\
  要講嚴重一點甚至有些總白癡化啦\n如果你對他認真,那你就有很大機會跟他不合\n畢竟他是大部分都朝大眾口味看齊的作品\n他可以是一堆議題喇一起水2小時的合輯\n\
  也可以是反映現在一般觀眾口味的商品\n我個人會把那些缺點盡量想成特色啦\n當然缺點還是不免俗的國片硬傷就不多提了\n無論如何我看完是心滿意足的\n----\n\
  Sent from on my iPhone 14 Pro Max\n \n--\n一旦踏出去，就無法再回頭，朝三千世界的血海而去\n \n--\n我明白你噓的點\
