title: '[新聞] 【史蒂芬金之猴子】爆血尺度遭電視台拒播'
content: '新聞網址：



  改編史蒂芬金（Stephen King）短篇故事，由《厲陰宅》（The Conjuring）溫子仁（

  James Wan）監製，並由《長腿》（Longlegs）奧茲古柏金斯（Osgood Perkins）編導，

  這部集結「恐懼大師金三角」的年度娛樂恐怖強片《史蒂芬金之猴子》（The Monkey），

  即將在2月27日（週四）於台灣震撼獻映。本片劇情描述本該可愛童趣的發條猴子玩具，

  竟然成為陰魂不散的殺人詛咒，每當發條聲響起，一連串血腥爆表、超乎想像的離奇死亡

  事件瘋狂展開！奧茲古柏金斯大膽結合幽默與恐懼，透過大銀幕嚇瘋觀眾之餘，更挑戰要

  讓觀眾荒唐大笑，更掛保證：「真的非常瘋狂！」奧茲古認為既然要拍喜劇，就得極端到

  底，因此讓全片充滿琳瑯滿目的創意死法，以及血量爆棚的死亡場景，意想不到的程度媲

  美《絕命終結站》（Final Destination），甚至連預告都慘遭美國電視台拒播！值得一

  提的是，奧茲古的名人雙親都因為難以想像的原因離世，讓他坦言與本片「每個人都會死

  」的核心精神不謀而合。





  改編「恐怖大師」史蒂芬金同名短篇小說的最新恐怖片《史蒂芬金之猴子》，以發條猴子

  玩具為主軸，讓它在可愛的外表之下，竟有著瘋狂殺戮的兇殘詛咒。編導奧茲古柏金斯認

  為面對詛咒玩具的題材，不適合過度嚴肅處理，因此透過幽默來打造獨特恐懼，他對此分

  享：「我完全無法想像用嚴肅的方式來拍這種題材。對我來說，以那種方式處理會顯得完

  全不真實，所以我乾脆朝反方向前進。」他的終極目標就是要嚇瘋觀眾，同時又能在戲院

  荒唐到大笑出聲：「這部電影就像是一場特別的雞尾酒派對，既有令人作嘔的恐怖場面，

  又有極度荒謬的搞笑時刻！」他也掛保證：「真的非常瘋狂！」



  而他認為，既然要拍恐怖喜劇，就得拍得極端到底，因此讓整部電影充斥琳瑯滿目的創意

  死法，還有血量爆棚的死亡場面，舉凡七孔流血、保齡球爆頭、魚叉槍穿腸等，讓拍攝現

  場一度相當混亂，他說道：「我們注入的血量，遠遠超過真實人體的量，片中有幾個人爆

  炸，讓場面非常混亂。」本片的瘋狂連環殺戮程度，可說是媲美《絕命終結站》，就連預

  告都慘遭美國電視台拒播，根據電視台的說法為：「基本上每個畫面都有問題，過度暴力

  ，包含血漿四濺與斷頭畫面。」也讓網友直呼光預告就如此激烈，正片尺度一定會大爆表

  ！





  編導出《史蒂芬金之猴子》的奧茲古柏金斯，是經典驚悚片《驚魂記》（Psycho）主演安

  東尼柏金斯（Anthony Perkins）與知名攝影師暨演員貝瑞貝倫森（Berry Berenson）的

  兒子。他的父親死於愛滋病引發的肺炎，母親也不幸在911事件裡被劫持的飛機中喪命。

  對於雙親皆以難以想像的原因離世，奧茲古認為與本片「每個人都會死」的核心精神不謀

  而合，並開玩笑表示：「這隻玩具猴子的問題在於，它周圍的人都以瘋狂方式死去，而我

  可是這方面的專家！」他並坦言：「我父母的死亡方式都瘋狂到成為頭條新聞，我花了很

  長時間從悲劇中恢復過來，那種感覺非常糟糕。不過我現在年紀大了，開始明白每個人都

  會遇到這種事，每個人都會死。」



  這部集結恐懼大師金三角，共創令人振奮恐懼新驚典的《史蒂芬金之猴子》，即將在2月

  27日（週四）於台灣震撼獻映！本片劇情描述雙胞胎兄弟哈爾和比爾（席歐詹姆斯分飾）

  ，找到一隻父親的舊玩具猴子，但兩人隨後發現，這隻猴子似乎伴隨著邪惡詛咒，每當發

  條轉動，身邊就會發生一連串駭人死亡事故，讓心愛的人一個個死去…。為了擺脫這場噩

  夢，兄弟兩人決定將它丟棄，並各自過上新的生活。沒想到多年過去，不明連環死亡事故

  再度發生，讓哈爾不得不與比爾再度聯手，試圖找到徹底摧毀這隻猴子的方法…。



