url: https://www.ptt.cc/bbs/movie/M.1740630861.A.00B.html
title: '[好雷]《史蒂芬金之猴子》，猶如人生。'
content: '部落格版：


  人終將一死，意外和明天誰會先到永遠沒人知道，以爲的來日方長卻抵不過世事無常，誰

  知道前秒剛說再見，下秒轉身被車撞死。好多電影總試圖要觀眾去學會如何珍惜現在，不

  要等遺憾發生了才去後悔，然而《史蒂芬金之猴子》卻是反而要觀眾去理解「如果每個人

  到最後都會死，是自然老死還是意外死去有什麼差別？既然死亡終究會到，又何必去震驚

  意外的措手不及？與其陷入離別的悲傷，倒不如坦然接受然後盡情跳個舞吧。」


  《史蒂芬金之猴子》確實會讓人聯想到《絕命終結站》系列，許多沒想到的意外發生與各

  種離奇的死法都讓人邊喊痛邊喊扯，但所謂的意外不就是想不到才叫意外？不論是《史蒂

  芬金之猴子》或者《絕命終結站》系列雖都誇張化了意外，不過觀眾依然能從中看到確實

  可能發生的真實。兩者看似不同，可仔細去想會認為兩者所談的核心精神原來都是一樣的

  ，兩者同樣用無法解釋的超自然力量來包裝現實生活中會有的死亡，《史蒂芬金之猴子》

  裡詛咒的猴子玩具與《絕命終結站》系列裡的死神，其實都是無可違逆的死亡本身，世界

  上從來沒有「大難不死，必有後福」，有的只是注定好的時間，企圖逃避與抗拒死亡只是

  徒勞，下個轉角死神依然會再次出手收命。



  《史蒂芬金之猴子》像是本回憶錄，是男主角哈爾回憶目前為止的人生中發生的死亡經歷

  ，觀眾彷彿跟著哈爾的述說，認識眼前他父親留下來的遺物，一隻轉動發條便能擊鼓的玩

  具猴子，也跟著見證它所擁有著的邪惡力量。站在上帝視角的觀眾，知道哈爾曾試圖向猴

  子許願想要不斷欺負他的雙胞胎哥哥比爾死，沒想到轉動發條後死亡的卻是母親，瞞著真

  相的哈爾就這樣和比爾一起被親戚收養，當仍然半信半疑的哈爾再度轉動發條造成叔叔的

  死亡後，兩人決定徹底埋葬這隻猴子，避免這股邪惡力量再次奪走身邊的人的性命。只是

  本想事情該就此結束的兩人，猴子卻如詛咒般的跟著他們。


  長大後的哈爾與比爾不再聯絡彼此，對於哈爾來說一方面是心裡對害母親死亡的愧疚，一

  方面也是為了逃離猴子的詛咒，深怕糾纏著他們家的邪惡力量會繼續奪走與他們親近之人

  的性命，於是就算要背負著爛人之名，他也選擇推開深愛的妻子與兒子，為的就是想要保

  護他們。而與哈爾相反的，比爾深深受到猴子吸引，當他瞞著哈爾回到他們將之丟下的那

  口井，猴子早已不知去向，直至長大的這些年他不斷尋找著猴子的下落，為的不是要將之

  給摧毀，而是與愛相反的復仇，因為他心裡隱約知道，當時母親會死全是因為哈爾轉動了

  發條，他也知道猴子不會殺害轉動發條的人，卻也不會實現轉動發條的人的願望，如他所

  想全部屬實，那哈爾不僅是殺害母親的兇手，也曾向猴子許下殺了他的願...


  如同裝著猴子的盒子上所寫的，「猶如人生」。與其說猴子的力量是詛咒，倒不如說更像

  是不可違的命運，「人生順其自然就好，最好不要試圖掌控一切」更成體悟。儘管比爾藉

  著實驗推測出猴子不會殺了轉動發條的人，但怎麼也不明白為什麼每次死的都不是哈爾？

  還想著換個人來轉動發條看看是否能殺死哈爾。只是換個角度想，是誰告訴比爾猴子不會

  殺了轉動發條的人呢？其所認定的這件事看似為真，可其實就像上面提到過的，「人都會

  死，也都有著注定好的時間。」，不是今天也許就是明天，不是明天也許是下個月，怎麼

  轉就是殺不到哈爾不是因為猴子不實現轉動發條的人的願望，就只是剛好時間還未到而已

  。明明都在同台車內，傾巢而出的蜂群卻只鑽進後座的人的嘴裡，不是因為哈爾幸運逃過

  ，而是還不到他的時候；當年沒死的比爾，在多年後的今天用自己的死讓觀眾意識到了這

  點。



  時常在意外事故發生後，會聽到有人說「幸好因為怎樣，所以自己沒有怎樣...」來慶幸

  自己逃過一劫，卻沒想過可能即使自己搭上了失事航班，自己也會是活下來的那一個？不

  是大難不死而是命不該絕。比爾不停轉動發條，幾乎造成了整個鎮的人死亡，就是殺不到

  弟弟哈爾也是這樣。我在想不論哈爾最後是否理解了這件事，在他開口邀請兒子去跳舞的

  時候，他總算能夠明白當年母親在喪禮完後說的那番話，後來回家她與自己還有哥哥跳著

  舞的模樣，原來都是對人生、對生命的體悟，寧可盡情享受生命的每一分鐘，也不要因不

  曉得什麼時候會來的死亡活得戰戰兢兢。最後哈爾選擇將猴子留在身邊，如同選擇接受意

  外與死亡隨時都在自己身邊。


  導演奧古斯德柏金斯繼玩轉經典兒童文學《長腿》後，再度將恐怖大師史蒂芬金1985年收

  錄在短篇集《史蒂芬金的故事販賣機》中的同名短篇故事進行改編。《史蒂芬金之猴子》

  是恐怖片、是驚悚片，同時它也是部黑色喜劇，我認為導演奧古斯德柏金斯找到了某種平

  衡，能滿足不同口味的觀眾需求，比起前作大幅降低血腥程度，重於不安與壓迫的氛圍營

  造，《史蒂芬金之猴子》直接給予毫不客氣的血漿噴灑，各種死法在大銀幕上放送，讓觀

  眾即使忽略了電影中蘊含著的人生哲理與寓意，還是能從中收穫不少的痛快樂趣。



  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
