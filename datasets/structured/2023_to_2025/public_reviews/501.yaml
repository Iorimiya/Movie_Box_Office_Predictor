title: '[普雷] 史蒂芬金之猴子之我看了什麼'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  看完

  我是誰 我在哪

  我剛剛看了什麼？？？？



  1.喜劇遠多過驚悚，基本上不太恐怖


  2.血漿普通多，死亡的畫面有刻意帶開並詼諧化，然後還會放有人要死囉～的殺人預告配樂，就是怕你看這片看到怕


  3.主角的某人被做成肉醬慘死，更慘更糊的是劇情，什麼都沒有，看到後來就是等下一次哪個人要怎麼死？創意夠不夠？血噴多不多？


  4.前半還勉強有點氛圍和邏輯（？），後半段根本亂拍放飛自我，猴子殺戮完全沒有規律跟法則，不用轉發條就可以殺、想殺幾個就殺幾個、騰雲駕霧一般來去自如，這隻去大鬧天宮我看是如來也鎮不住


  5.我的評價嘛，明明有可以好好發揮的題材但有人只想交差亂拍的東西


  6.普雷是因爲當B級片看還及格，進場期待莫要錯誤





  -----

  Sent from JPTT on my iPhone


  --


  真的 看他花式打鼓真的瞎



  就是那一段屠殺很出戲囧



  絕命的死神還有演得像意外

  這猴子完全不演



  看來大家的感性一樣喔（握



  我知道

  就是Pete轉完明明打了一輪了

  人也殺了（黃蜂殺

  然後就打一半停哥哥去凹他繼續打

  猴子彈飛哥哥後就5倍速暴打一波

  這邊…是有轉啦

  可是轉一次打幾下殺幾個根本隨他開心啊XD'
