title: '[負雷] 史蒂芬金之猴子'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  觀影證明：



  前言：

  看預告感覺類似絕命終結站，而且有哈比人男主、有好一陣子沒看到他雖然他後期的電影

  都不太熱門。


  心得：

  與絕命終結站不太相同的氛圍，恐怖會帶有詼諧的幽默且很快會轉換比較快樂的背景音樂

  ，在保母被斷頭，媽媽爆血管，舅舅被馬踩死，姑姑被燒頭，被霰彈槍爆體的房仲有點在

  帶劇情使人昏昏欲睡，最後雙胞胎哥哥也被保齡球抱頭，弟弟帶小孩載著猴子開車駛離遠

  處公路。



  小弟智商可能不太能理解電影的鋪陳，只記得一句話；人難逃一死，但希望自己不是慘烈

  的死去都好！睡夢中或者英勇的尤佳。


  以上。



  --

  詼諧不錯，有幾首經典年代曲風的歌、另外就是時空背景25年前他們還沒在用手機，成人

  之後弟弟應該是拿水果14因為有瀏海。'
