url: https://www.ptt.cc/bbs/movie/M.1740060054.A.67A.html
title: '[新聞] 【史蒂芬金之猴子】導演感謝迪士尼"阻"擊'
content: '新聞網址：



  由《長腿》（Longlegs）奧茲古柏金斯（Osgood Perkins）編導的年度恐怖娛樂強片《史

  蒂芬金之猴子》（The Monkey），即將在2月27日（週四）於台灣震撼獻映。本片改編自

  「恐怖大師」史蒂芬金（Stephen King）的同名短篇故事，原著中那隻連環殺人的詛咒玩

  具猴子，原先是以敲鈸形象登場，沒想到迪士尼卻因為動畫片《玩具總動員》（Toy

  Story）擁有形象版權，導致猴子無法敲鈸，讓劇組無奈只能大刀修改，沒想到修改後的

  效果卻意外讓導演奧茲古大讚：「謝啦，迪士尼，我更喜歡這種感覺！」而奧茲古也希望

  能傳遞出史蒂芬金的幽默感，以本片向他致敬，因此每週跟劇組開兩次「死亡會議」，藉

  此激盪出片中五花八門的荒誕死法，而史蒂芬金不僅給予他寬廣的發揮空間，更在觀賞本

  片後大讚：「瘋狂至極！」尤其本片近期也在國外進行一連串試映活動，讓搶先觀賞的觀

  眾們紛紛因為稀奇古怪的殺戮場面感到驚嚇不已，國外媒體更紛紛給出超高好評！





  改編自「恐怖大師」史蒂芬金同名短篇故事的最新恐怖懼獻《史蒂芬金之猴子》，以一隻

  會瘋狂殺戮詛咒的發條玩具猴子作為主軸。據悉，原著中的玩具猴子，原本是以雙手敲著

  銅鈸的形象登場。劇組原本想要忠於原著，沒想到卻因為迪士尼而必須大刀修改此設定。

  導演奧茲古柏金斯對此解釋：「製片人告訴我，因為《玩具總動員》裡的一隻猴子，迪士

  尼擁有了敲鈸猴子的形象版權，所以我們不能使用銅鈸。我當時在想，那如果改成鼓呢？

  或許可以帶點節奏感，一種令人不安的氛圍，就像在說『請準備好，要發生事情囉！』」

  最終這隻「敲鼓猴子」呈現出來的感覺，甚至比原先設想得更具有戲劇效果，也讓導演興

  奮喊：「謝啦，迪士尼，我更喜歡這種感覺！」





  值得一提的是，《史蒂芬金之猴子》編導奧茲古柏金斯，為了能夠傳遞史蒂芬金的幽默感

  ，並透過本片向他致敬，因此每週跟劇組召開兩次「死亡會議」，來實現片中各式各樣的

  荒誕死法。在劇本創作過程中，史蒂芬金也給予奧茲古很大的發揮空間，並在觀賞完電影

  完成品之後，於社群平台Threads上大讚：「我從來沒看過像《史蒂芬金之猴子》這樣的

  電影，它瘋狂至極！作為一個不時也會沉迷於瘋狂之事的人，我對此深表欽佩。」



  尤其本片近期在國外進行一連串試映活動，讓搶先觀賞的觀眾們，紛紛在廳內被琳瑯滿目

  的瘋狂殺戮場面嚇到目瞪口呆、驚呼連連！國外媒體也都為本片給出超高評價，娛樂主播

  傑克漢密爾頓（Jake Hamilton）：「《史蒂芬金之猴子》將成為我餘生反覆觀賞的恐怖

  電影之一！」娛樂網站CinemaBlend：「直接的喜劇感，與其極端的血腥效果完美搭配！

  」恐怖新聞網Bloody Disgusting：「奧茲古柏金斯拋開邏輯，轉而追求深夜狂歡般的娛

  樂性，讓死亡變得前所未有地有趣而且血腥！」



  這部改編史蒂芬金短篇故事，由溫子仁（James Wan）監製、《長腿》奧茲古柏金斯編導

  ，以這「恐懼大師金三角」陣容，共創恐懼新驚典的《史蒂芬金之猴子》，即將在2月27

  日（週四）於台灣震撼獻映！本片劇情描述雙胞胎兄弟哈爾和比爾（席歐詹姆斯分飾），

  找到一隻父親的舊玩具猴子，但兩人隨後發現，這隻猴子似乎伴隨著邪惡詛咒，每當發條

  轉動，身邊就會發生一連串駭人死亡事故，讓心愛的人一個個死去…。為了擺脫這場噩夢

  ，兄弟兩人決定將它丟棄，並各自過上新的生活。沒想到多年過去，不明連環死亡事故再

  度發生，讓哈爾不得不與比爾再度聯手，試圖找到徹底摧毀這隻猴子的方法…。



