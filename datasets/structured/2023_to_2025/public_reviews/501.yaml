url: https://www.ptt.cc/bbs/movie/M.1747406559.A.CA1.html
title: '[好雷] 1.史蒂芬金之猴子, 2.猴你死'
content: '雷文防雷資訊頁


  MOD上架

  二部

  2025美國恐怖片



  史蒂芬金之猴子

  TheMonkey


  猴你死

  TheJollyMonkey


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  以下二片，是我的菜，所以很快追看完了。


  一，

  史蒂芬金之猴子

  The Monkey



  全片拍攝成果，非常有〔絕命終結站〕的恐怖身亡畫面fu...也有黑色喜劇的氛圍，但仍

  偏向恐怖黑暗，有這樣的玩具，比鬼娃恰吉還恐怖，傷害程度更大。

  這片的導演Osgood Perkins在本片客串演出的角色，死狀劇設觸目驚心    。


  本片的劇設人設有趣，片中那些離奇意外而慘死的人物角色，從頭到尾，都令人印象深刻

  ，血腥殘酷，不宜觀看本片的人很多吧。


  這片挺好看的，可惜一些劇情安排，我不太滿意，低於我的高預期80分，所以滿意度只有

  75分。


  以下有劇透。




  1.最後收尾的畫面，根本...宣導乘車時不要把跂伸出窗外的最佳影片。可以重看一遍，

  看清楚導演的用心。


  2.雙胞胎兄弟主角，兒童及成年演員外型好看，可惜劇設人設沒有兄弟愛，哥哥的心理變

  態所致，才有後半段的故事。


  3.本片一開始的劇情畫面，呼應這種毁滅不了的猴子玩具之設定，加上本片客串的一些知

  名演員及角色，是本片的亮點。


  二，

  猴你死

  The Jolly Monkey



  原本以為是模仿上述影片的劣質片，美國影片很多這種類型片，結果不是。


  這片的中文片名，乍看很胡鬧，

  但看完，覺得片名符合劇情，很貼切，哈哈哈。

  低成本的B級恐怖片，


  本片劇情後半段的反轉，感覺很有意思，雖然imdb評分極低，是劣質片的水準，

  我對於本片的欣賞，是比較不理智的，結果有超乎我的低預期60分，所以個人滿意度75分

  。


  #史蒂芬金之猴子


  #猴你死

  nkey

  #猴子玩具背後的真相真可怕


  --


  太恐怖的交通宣導片。謹記：請勿把頭手放到車外。'
