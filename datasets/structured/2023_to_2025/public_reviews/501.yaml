url: https://www.ptt.cc/bbs/movie/M.1740836106.A.AA5.html
title: '[好雷] 《史蒂芬金之猴子》：陽具廢退'
content: '（當然的，有雷）



  這部片不倫不類的玩味花式死亡手法，是絕命終結站之猴猴做歹誌。



  它黑色喜劇式的敘事，無法掩飾那瀰漫在基底揮之不去的哀傷：


  失措的男人，及對其的汰除。




  它的提問是：為什麼當代的男人，不再能當好一名父親？




  所以，首先，我們要問的是，「猴子」到底是什麼？




  當然了，電影講的很明白，就是雙胞胎哥哥比爾嘲笑弟弟哈爾的那句話：


  「你要說，我喜歡吸它的香蕉。」




  猴子——或確切來說，牠的香蕉：猴子尾巴——


  就是那根曾經讓美國偉大如今光輝不再的陽具。



  （稍早川普示範了一次：「別告訴我們會有什麼感受！


  你沒有資格決定我們怎麼感受！我們會感覺非常好、非常強大！」）




  我們在這之後會看到為什麼越強調「能夠」，


  越顯示其欲蓋彌彰的空洞：對陽痿的恐懼。



  （或許這也是川普當選的民意基礎：藍領男性唯恐美國不再能「勃起」？）



  回到《史蒂芬金之猴子》。


  故事講述雙胞胎比爾和哈爾．薛伯的單親身世。


  一次，父親藉故買菸離家，自此之後，了無音訊。


  這是整部片的原爆點——一個不在了的父親。


  而我們的經驗是，就算爸爸不是去買包菸，他也會以某種形式缺席。


  這是《破案神探》（Mindhunter）說過的話：「父親總意味著缺席的父親。」



  兩個深愛彼此也憎恨彼此的兄弟，在樂觀母親的照顧下，


  非但沒有成為理想的大人，相反，缺乏父親典範的男孩們各自歪斜成不同的樣貌。


  （這部電影肯定無法通過性別歧視量表「貝克德爾測驗」，


  《猴子》是專為男人／男孩拍的電影。）



  買菸出走之後，父親留下了一隻醜陋的猴子。



  它來路不明，卻擁有生殺大權，齜牙咧嘴，敲打鼓面。


  每旋轉一次發條，至少就有一條生命將會逝去。


  兄弟倆目睹一系列光怪陸離的死亡，甚至包含母親駭然的逝去。


  他們終於決定合力拋棄猴子（另一個版本的《牠》？）。


  此後，兄弟倆埋葬童年，不再聯絡。


  直到這隻猴子又開始肆無忌憚地讓家鄉鎮民一個個死去，


  哈爾才帶著他即將失去監護權的兒子返鄉。



  很有意思的是，薛伯家的遺產，具現為這隻隨機殺人的猴子——


  權力的最高體現：擁有讓人或生或死的權柄。


  （而最誘人的，莫過於旋轉發條者不在死亡之列。）



  在我們最近的例子裡，那些擾亂美國校園安全的所謂的


  INCEL（非自願單身者）——以為自己一槍在手，精液無窮的男性——


  揣著一把半自動步槍，就能內爆成校園槍擊的殺手。即為此一隱喻的影射。



  我們也將得知，單身者哥哥比爾，正是這一系列死亡的始作俑者。



  無論從物理的陽具，到形而上的陽具中心主義——


  男人最脆弱之處，全繫於下體的那根小東西站不站得起來。


  真相就是：勃起，是無法控制的。


  男人恥於承認這一點，否則，它不會在午睡或晨醒勃起時讓人不耐，


  卻在床笫之間無法硬挺而使人心哀。



  再也沒有比「威而鋼」更能代表「閹割」的例子了——


  因為一個男人為了表示陽剛，他必須仰賴陰莖的兩種狀態：


  勃起，與不勃起。



  而陽剛的證明不就是仰賴它那隨機性的持久性嗎？


  你比較持久，一夜七次，而他不持久，兩次便鳴金收兵。


  威而鋼破壞了規則——那不正確確實實地昭告，


  它所造成的恆久豎立，正在掩飾它一點都不持久的真相嗎？



  它之所以力證自己持久，全寄託在它可能的萎弱。



  越是無所不能，越顯示其無能。



  如同哥哥比爾，隨意轉動發條殺遍全鎮的瘋狂，


  觀眾在之後得知了他的理由，極為悲哀：


  因為媽媽不在了。他無法接受母親的死亡。



  至此，似乎已罪證確鑿，可以繼續沿用「有毒的男子氣概」這個17年後因川普上任和


  Metoo運動而大量擴散的詞彙，來概括所謂「男子氣概」的「天生有毒」。



  可是片中的弟弟哈爾，卻羸弱自卑，缺乏一點點攻擊性。


  他是背向「男子氣概」的失敗者：一名魯蛇。



  哈爾無法當好一個父親，甚至必須交給伊利亞伍德飾演的專家養育。



  這個擁有所有白人菁英資源的繼父，看起來是著名意見領袖與作家，


  很能擔保其子未來的生活（同時，這也是性別戰爭最容易豁免於戰火的階級：


  白領女性與藍領男性鬥爭甚酣）。



  弟弟哈爾和兒子彼得談到那隻猴子：「這是我父親留下來的，但我不想要它。」


  一個爸爸不想要父親的職責——因為它象徵上一代有毒的男子氣概。


  有別於哥哥比爾，哈爾不想繼承這受詛咒的遺產。


  於是他的陽具就萎弱了，如同猴子演化成人類時，那根多餘的尾巴。



  「男子氣概」成了原罪。社會懼於承認男人也正面對危機。


  「許多政治左翼人士似乎很害怕，連承認男孩跟男人的問題，


  都會削弱大家對女人和女孩付出的努力，這等於是進步派版本的零和思維」，


  「對保守派來說，男子氣概是解方；對進步派來說，男子氣概是問題。」


  （《男性廢退》，2025）




  進步派忽略男性困境，然而保守派卻將希望放在過去。


  左右兩派對失落的男子氣概提出的解方都是提油救火。


  這造成的後果即是，美國性平戰爭中DEI的長年爭議，


  中間傾向的男孩被推向了柯文哲，推向了PUA，推向了紅藥丸，


  最後，推向了極右翼。沒有人是贏家。




  （這也就是「直男行為研究社」可議之處，哪怕我也愛看各種奇葩的騷擾言論，


  但忽視結構性問題，見獵心喜式的挑選投稿個案，無助於化解男性情感教育上的匱乏。）




  事實上，女人的焦慮在於，被逼迫要為社會、家國生育孩子


  （「不生孩子是國安危機」，以及川普當選後，反墮胎勢力的反撲）。



  恐怖片對瀰漫社會的恐懼和焦慮向來敏感，


  因此去年有許多「借腹生子」的故事，如《鬼聖胎》（Immaculate）、


  《天魔：惡之初》（The First Omen） 、《7A公寓》（Apartment 7A） ）。


  這些孩子生出來根本就是惡魔，女人還不被允許厭惡她恐怖的孩子。


  甚至，母職侵蝕了事業與創造力，把女人降格（也升格）成一隻野蠻的母狗，


  於是又另外有了《夜母》（Nightbitch）發出的抗議。


  這一系列電影顯現女性的焦慮。



  那麼，男人的焦慮何在？



  村上龍無情指出：「男人只能在制度下成為父親。


  而女人則和其他動物一樣，能成為生物學上的母親，


  這是兩者之間最大的差異。認真努力想成為好父親的男人，是仰賴制度的沒用男人。」


  （《所有男人都是消耗品》）




  問題即是：從一開始生育權就不在自己身上的生物，孩子生了，要怎麼當一名父親？




  女人想要墮胎的選擇，男人卻想要有當一個父親的權利。




  片中的雙胞胎哈爾和比爾，相愛相殺，就是聖經裡的該隱與亞伯。


  一個承擔了父系的債務，一個惶恐不安地拋棄繼承。


  男人困惑於「男子氣概」真有那麼糟嗎？




  連那個前髮遮眼、活像古代牧羊犬的白癡角色穿上父親的警察制服，


  揮舞著好大一把槍威脅哈爾時，都老實承認：


  「其實我根本不喜歡我老爸，也不喜歡警察。」


  這個試圖模仿父親而失敗的沒用男人，下場果真悽慘，


  流彈打中了蜂巢，群蜂宛如一把回彈的陽具插入他的嘴巴，口爆而亡。




  藍領男性不斷為白領男性說對不起，感到失落孤僻、徘徊無依，卻不知道問題出在哪裡。


  貴族精神逝去，封建騎士的紳士風範被指責為性別歧視、


  斯多葛主義式的教養（「壓抑情感、保持耐心」）沒落了。


  男生被鼓勵要勇於表達脆弱，可是當脆弱顯現，卻被女孩們視為軟弱；


  勇氣、獨立、自信、榮譽感、責任感便隨之一併瓦解。



  女人強大了，男人便萎了、躺了。男人去了哪裡呢？



  還用說嗎？



  看動漫、打電動去了。


  斗內直播網紅去了。被愛情詐騙去了。


  不婚不生了。拒絕社會了。


  更糟的是，一起上活網靠北女孩子「超大杯」、「咖啡」，


  自嘲「哥布林」去了。



  於是繭居襲來、尼特崛起，少子化如海嘯衝擊，下流老人蓄勢待發。


  渣男成了海王，暖男搖身一變為中央空調。


  剩男剩女相互怨懟瞋恨，MGTOW（米格道）讓男人改當僧人，


  Alpha男和Beta男讓位給Sigma男，性別分離主義甚囂塵上。




  我們終於抵達了劇情的高潮：在比爾瘋狂旋轉發條後，鼓棒遲遲不落下，


  還要等待新世代彼得繼承那可怕的厭女精神，才能啟動往後的仇恨列車。


  也難怪有了片末地獄般誇張的末世場景，


  啟示錄的景象直接投影在這座緬因州小鎮，


  它都直接用聖經讀給你聽了：「我觀看，見有一匹灰馬；騎在馬上的，


  名字叫作『死』。陰間也跟隨著他。他們得了權柄可以管轄地上的四分之一，


  又要用刀劍、饑荒、瘟疫和地上的野獸去殺人。」（《聖經啟示錄 6:8》）



  這趟無可挽回的列車，也只有在彼得的父親哈爾與哥哥和解後，才告解除。



  但即使如此，比爾還是得付出殺人無數的代價——


  被那顆弟弟從童年就想砸在哥哥臉上的保齡球爆頭，「該隱的封印」畢竟如影隨形。




  那麼最後，導演對這個問題有什麼答案呢？


  在這一片末世的性別戰場，失落的男子氣概該怎麼辦呢？


  真的是「生為異男，我很抱歉」嗎？



  想一想《金牌特務》中的「Manners maketh man.」（「禮儀，成就不凡」）。


  「男子氣概」曾經帶領人類文明好長一段路，


  它不僅僅只是一枚有毒而須去之後快的糟粕，


  那隻「猴子」是一個頑固而尷尬的「硬核」，無法以任何物理的手段毀滅，


  兒子問這個曾經失格的父親：「我們該怎麼辦呢？」



  終於，我們見到一個新父親的誕生，


  他承認的同時，也接受，「猴子」（男子氣概）果真會傷人，


  但也不能放任它落入別人手中，


  這個嶄新父親的選擇堅忍而令人動容，他說：



  「我們要帶著它，接受它是我們的一部分。」





  ——————————————————————————————




  --


  你說得對，對死亡無常的接受是本片的主題，不過這有些老生常談，


  其他文章應該都會提到，就不多著墨，我也願意承認，


  這部片在某些時刻有無聊的地方，但無損我在它身上發現的光芒，


  我認為「歪讀」這隻猴子，正好符合它荒謬怪誕的喜劇調性。


  謝謝你的提醒~



  男子氣概有正面與負面的部分，我認為當代女性主義除了肯認男人身上的陰柔之外，


  也必須回頭看見這些曾經高貴的，有關責任、榮譽、大氣、內斂的特質。'
