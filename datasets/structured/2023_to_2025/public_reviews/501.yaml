title: '[新聞] <史蒂芬金之猴子>刷新北美年度恐怖片票房'
content: '新聞網址：



  由「恐怖大師」史蒂芬金（Stephen King）短篇小說改編、溫子仁（James Wan）監製、

  奧茲古柏金斯（Osgood Perkins）編導，集結「恐懼大師金三角」聯手打造的年度恐怖強

  片《史蒂芬金之猴子》（The Monkey），即將在明日（2/27）於台灣震撼獻映。導演期望

  可以由高顏值硬派男星，詮釋片中普通又常說話結巴的男主角，藉此創造反差感，因此找

  上他心目中夠帥又沒有偶像包袱的席歐詹姆斯（Theo James）演出。席歐在片中還要一人

  分飾兩角，同時演出反社會人格的男主角哥哥，為此他耗費多時，透過細微動作與語調來

  創造出角色差異，更以大前輩湯姆漢克斯（Tom Hanks）的演出作為借鏡。此外，本片在

  開拍前幾日，也意外邀請到《魔戒》（The Lord of the Rings）主演伊利亞伍德（

  Elijah Wood）特別客串，讓觀眾看到大感驚喜，也讓這部話題滿載的電影，上週甫於北

  美上映，便開出1420萬美元（約新台幣4.4億元）的票房紅盤，不僅空降北美新片票房冠

  軍，更刷新北美年度恐怖片票房成績，影迷勢必要搶在第一時間進戲院觀賞！





  由《長腿》（Longlegs）奧茲古柏金斯編導的最新恐怖強片《史蒂芬金之猴子》，導演希

  望可以由高顏值硬派男星，詮釋普通又常說話結巴的男主角「哈爾」，創造出顛覆形象的

  有趣反差，既要有演技實力，有要能夠一人分飾兩角，還要可以同時演出反社會人格的男

  主角哥哥「比爾」，遊走在兩種表演風格之間。而曾演出《分歧者》（Divergent）的席

  歐詹姆斯，正符合導演想像中夠帥、沒有偶像包袱又有實力的形象，他分享：「我覺得讓

  他這樣一位典型的硬派男主角，來詮釋結巴的普通人『哈爾』會很有趣。到了『比爾』，

  他則能夠展現更狂野、強悍的一面，甚至帶點《鬥陣俱樂部》（Fight Club）的氛圍。」

  他並開玩笑表示席歐的鋒利下顎線，更是選擇他的關鍵原因。



  席歐詹姆斯挑戰分飾兩角，一個內斂平凡，一個暴躁狂妄。他和導演討論過後，彼此有共

  識地不希望太過依賴妝效或刻意表演來區分，因此他耗費多時調整細節來創造差異。席歐

  對此分享：「哈爾是個壓抑的普通人，所以我讓他的語調顯得有些不確定，說話時會結巴

  、重複詞句，動作也沒有目的性，像被拉著走一樣，猶豫不決。比爾則完全相反，動作很

  有方向感，說話更清晰，聲音也更穩定。」其中他更參考電影《錢坑》（The Money Pit

  ）中的湯姆漢克斯，來詮釋哈爾的好人氣息。





  年度恐怖娛樂強片《史蒂芬金之猴子》，在開拍前幾日還意外邀請到《魔戒》伊利亞伍德

  共同演出。據悉，本片以溫哥華為拍攝地，當時伊利亞正到此地參加動漫展，導演奧茲古

  柏金斯便抓住機會提出邀請，而伊利亞也馬上點頭接演，並表示：「在他邀我加入之前，

  我就已經知道他了。順便說一下，我在那部電影裡有最微不足道的一小部分，但我首先被

  他打動了，他非常慷慨仁慈，並寫了一個很棒的劇本，找了很好的演員，我為此感到興奮

  ，因為這隻猴子，與他拍過的任何作品都截然不同。」尤其本片上週已在北美上映，不僅

  好評滿載，更開出1420萬美元（約新台幣4.4億元）的票房紅盤，不僅空降北美新片票房

  冠軍，更刷新年度恐怖片票房，值得台灣觀眾進戲院親自體驗刺激暢快的恐怖饗宴！



  這部改編自史蒂芬金短篇故事，由溫子仁監製、《長腿》奧茲古柏金斯編導，以這「恐懼

  大師金三角」陣容，共創恐懼新驚典的《史蒂芬金之猴子》，即將在明日（2/27）於台灣

  震撼獻映！本片劇情描述雙胞胎兄弟哈爾和比爾（席歐詹姆斯分飾），找到一隻父親的舊

  玩具猴子，但兩人隨後發現，這隻猴子似乎伴隨著邪惡詛咒，每當發條轉動，身邊就會發

  生一連串駭人死亡事故，讓心愛的人一個個死去…。為了擺脫這場噩夢，兄弟兩人決定將

  它丟棄，並各自過上新的生活。沒想到多年過去，不明連環死亡事故再度發生，讓哈爾不

  得不與比爾再度聯手，試圖找到徹底摧毀這隻猴子的方法…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
