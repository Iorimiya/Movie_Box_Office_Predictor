url: https://www.ptt.cc/bbs/movie/M.1741267640.A.6F5.html
title: '[新聞] 《山忌 黃衣小飛俠》6月恐怖登場'
content: "新聞網址：\n《山忌黃衣小飛俠》台灣靈異傳說搬上大銀幕！劉以豪領銜主演，6月恐怖登場\n縮: \n\n《紅衣小女孩》製作團隊打造2025全新恐怖電影《山忌\
  \ 黃衣小飛俠》，將台灣流傳真實\n山林靈異傳說搬上大銀幕！\n\nby Ren-2025/03/06更新\n\n繼《紅衣小女孩》、《人面魚》之後，全新驚悚之作《山忌\
  \ 黃衣小飛俠》即將登場，改\n編自台灣真實靈異事件「黃衣小飛俠」，找來劉以豪、袁澧林、曹佑寧攜手主演。\n\n「黃衣小飛俠」是什麼故事？\n「黃衣小飛俠」是早於「紅衣小女孩」之前，台灣流傳長達近50年的真實山林靈異傳說，\n\
  最早從七零年代的山屋管理員親身經歷開始口耳相傳，登山客親身遇見黃色身影的事件層\n出不窮。據傳，在台灣多處山區，登山客曾目擊身穿黃色雨衣、頭戴斗笠的神秘身影，祂\n\
  時而隱沒於樹林間，時而現身於濃霧之中，行蹤詭譎難測。更令人不寒而慄的是，凡是與\n祂對視或跟隨指引的人，往往會迷失方向，甚至永遠消失於山林之中。多年來，這個傳說\n\
  在登山界廣為流傳，成為台灣最駭人的禁忌之一。\n\n《山忌 黃衣小飛俠》演員卡司\n《山忌 黃衣小飛俠》由劉以豪、袁澧林、曹佑寧一同演出，陳孝萱也加盟出演，首次挑\n\
  戰驚悚題材的劉以豪坦言私下幾乎不看恐怖片，但仍強迫自己看完導演的指定片單，他笑\n說：「我會把聲音轉到最小，全程遮著眼睛從指縫看完。」問及接演原因，劉以豪透露因\n\
  為劇本實在太特別，更是他從未嘗試過的挑戰。\n\n《山忌 黃衣小飛俠》電影劇情\n《山忌 黃衣小飛俠》描述嘉銘（劉以豪 飾）、玉欣（袁澧林 飾）和安偉（曹佑寧\
  \ 飾）\n是大學登山社的好友。某次登山途中，他們意外迷失方向。儘管沿路綁上白布條作記號，\n卻不斷繞回原地，彷彿陷入無盡迴圈。慌亂之際，濃霧中隱約出現一個身穿黃色雨衣的身\n\
  影，讓三人燃起希望。沒想到，詭異意象卻接連發生，真正的噩夢才剛剛開始……\n\n《山忌 黃衣小飛俠》何時上映？\n《山忌 黃衣小飛俠》將於2025年6月6日上映。\n\
  \n《山忌 黃衣小飛俠》電影預告\n\n\n--"
