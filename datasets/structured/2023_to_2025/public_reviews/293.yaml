url: https://www.ptt.cc/bbs/movie/M.1748939255.A.795.html
title: '[ 無雷] 山忌 黃衣小飛俠觀影心得'
content: '昨天去看了山忌黃衣小飛俠試映




  先說總結 我覺得可以進戲院感受一下

  劇情的節奏算順暢

  故事情節也挺吸引人(感覺編劇有認真著墨)


  原本以為只是常規恐怖片

  但是感情線也埋得很深 很長

  在驚悚氛圍與細膩情感之間的平衡 拿捏的不錯

  整體比較像是愛情恐怖片(?


  如果要我拆開來評分

  以愛情片的角度，我會給9分

  情緒的轉折跟描寫自然，不會讓人覺得很突兀

  有些橋段還不小心逼我落了兩滴淚


  但是以恐怖片的角度

  傳說中的靈異詭譎的氣氛是有營造出來

  沒有特別的嚇人

  但值得稱讚的是沒有用廉價的音效 為了嚇而嚇

  恐怖的氣氛營造大概有6.5~7分


  自己是覺得整體中上

  推薦給喜歡看劇情片或是想嘗試恐怖片的新手

  因為劇中愛情的戲份也挺吃重的

  所以也蠻推薦情侶也可以手牽手一起去看


  P.S 話說本來覺得預告感覺有點無聊

  看完才知道原來電影藏了個梗

  而且是以蠻意外的的方式來呈現

  對我來說算是個加分的驚喜





  --'
