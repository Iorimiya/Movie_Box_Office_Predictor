url: https://www.ptt.cc/bbs/movie/M.1749311493.A.BEE.html
title: 'Re: [ 爛雷]  山忌 黃衣小飛俠'
content: '很早就看透這種片，所以能避雷。


  一查導演來歷，就又更篤定是「那種片」。



  《紅衣小女孩》後掀起的台灣新一代恐怖片潮流，常以民間信仰、現成的鄉野怪談與都市

  傳說要素加以改編，搞人、神、魔大戰，反倒忽略了最基本的說故事能力，與恐懼的本質

  。


  日本《怪談新耳袋》、《闇芝居》系列有不少佳作短篇，「未知」是厲害的恐怖元素，中

  山昌亮《不安的種子》漫畫更是靈光乍現的恐怖精華，想拍恐怖片的台灣導演宜先做這類

  功課，並從短片開始練功。


  可惜，一查這群台灣恐怖片編導的名字，真的會發現，有很多是從電視、廣告甚至網路影

  音界「空降」電影界的，有些從沒拍攝類型長片經驗。這種片子到底是如何促成的？上面

  的金主、大頭們，抱持怎樣的心態在搞電影？


  看看《杏林醫院》、《人面魚》、《粽邪》系列、《化劫》、《頭七》……都是這些半路

  出家的導演，就連當年突破新局面的《紅衣小女孩》程偉豪在此之前，對恐怖片也僅有一

  部短片《搞什麼鬼》的經驗。《紅》片的聲量、票房，多半還要歸功它是大家都熟悉的經

  典靈異照片和話題，程更擅長的，應是現代都會的人際關係。


  然後，《紅》片的成功，就是吸引一狗票感覺有利可圖的業內業外人士跟進，找來一堆沒

  練過功、基礎薄弱、不懂恐怖片怎麼拍的導演下去當白老鼠，一部分還是能吸引觀眾捧場

  ，但另一部分如《杏》片的負評（甚至是拍攝現場與後製期的八卦）都如雷貫耳。


  遲早的，也不難預料的，果真又來了部《黃衣小飛俠》，導演，一樣是那種的。



  台灣恐怖片真的需要更多有sense的電影公司長官、製片和投資人，還有更多肯練功、厚

  積薄發的編導，否則就會這樣爛下去。


  --

  學生作品等級賣院線，厲害了！

  《屍憶》不愛，《咒》還行，

  《鬼家人》真的不能算恐怖片。

  各有各的喜好。

  某些人真的很喜歡質疑非我族類。

