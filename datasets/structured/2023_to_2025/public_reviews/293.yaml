title: '[普雷] 山忌 黃衣小飛俠'
content: '改編自山友都聽過的玉山小飛俠的《山忌 黃衣小飛俠》終於在上週上映，玉山小飛俠幾

  十年來就是眾多登山社學長嚇唬學弟妹用的題材之一XD從幾年前得知要翻拍成電影就期待

  至今，而且還有山哥參與演出，身為四分衛老粉更是非看不可。



  看過預告本以為是有愛情元素的山難驚悚片，殊不知只是在山上鬼打牆的愛情片，如果是

  這樣也就罷了，至少片名中的黃衣小飛俠戲份重一點也好，結果小飛俠的存在感就跟輕便

  雨衣的塑膠材質一樣薄，片名把黃衣小飛俠抽掉只剩下山忌兩個字大概也成立。



  傳說在天氣不好的玉山南峰附近，遇到戴著斗笠穿著黃色雨衣的三人組向人指路，千萬不

  要跟著他們走，因為他們會把迷途的人帶去跳崖。電影把「迷路」這個元素轉化成角色在

  他們的人生迷了路，鬼打牆過著重複日子的這個做法，我其實滿喜歡的，把出現在高海拔

  的玉山小飛俠改到中海拔的黃衣小飛俠也是不錯，因為台灣中海拔其實是最容易迷路的地

  帶，黃衣人、壞天氣、墜崖等等重點也都有呈現，不過也就這樣而已，大部分劇情都集中

  在男主角要拯救女主角的各種橋段。



  只是設定改到中海拔，那片頭的登山客還有可能會失溫到脫光全裸的嚴重程度嗎？也許是

  因為深夜被雨淋到全身濕、也或許是因為寒冬上山造成失溫，那小飛俠出現把人掐到半空

  中是在幹嘛......可以好好把人帶去跳崖就好嗎？小飛俠也太累了吧爬山還要練舉重，合

  理懷疑那個橋段只是為了要賣演員的屁股肉。



  如果《鬼才之道》的恐怖程度是幼兒班、《咒》是成人班，那《山忌 黃衣小飛俠》大概

  只有小學生等級，推薦給有點怕鬼又喜歡愛情片的觀眾，畢竟單論愛情部份的劇情還是寫

  得算OK啦。



  --'
