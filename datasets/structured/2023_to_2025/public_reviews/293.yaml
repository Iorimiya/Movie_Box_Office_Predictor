url: https://www.ptt.cc/bbs/movie/M.1749366729.A.B8A.html
title: '[爛雷] 山忌 黃衣小飛俠'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  一部電影除了各個演員的表演，劇情也肩負著述說故事的責任

  如果故事很長說不完，那就刪減不必要的地方，把重點著重在故事上

  但這部除了演員表演尷尬，故事也說得非常爛，剪輯也荒腔走板

  甚至說重一點，如果正片是照著劇本演的，劇本是怎麼審過的？？




  從一開始的脫衣服我就一臉問號

  阿是為什麼脫衣服，然後還脫到全裸光屁股

  就算你各種癢痛，也處理好點

  25年前的神鬼傳奇都已經示範過聖甲蟲的入侵方式了




  每天重複過同一天，明日邊界也示範過了

  阿湯哥示範101種死法，很搞笑很歡樂，也展示了練等

  玉欣要101種死法也是可以，但起嘛恐怖一點，跟劇情有點關聯好嗎

  面無表情拿刀捅脖子，在浴缸溺死，突然吐血死，被車撞死，莫名頭撞牆

  我也是一臉問號

  如果想不到比較有關聯的死法，那可以畫面快速帶過就行

  不需要花時間著墨在這




  愛情的元素也多到很可笑

  我在看鬼片，一堆撒糖是怎樣，還給我看求婚戒橋段

  好，你要愛情元素就算了

  但問題是兩人互動很尷尬，活像沒愛要分手了，一點都不像要步入婚姻

  為什麼不把這部分帶過就好

  真正的黃衣小飛俠根本沒細說，也沒有前後因果鋪陳

  就只是藉個都市恐怖傳說，來演三角戀情山難片




  嘉銘在不斷輪迴的每一天找出破解方法，遇到了那對夫妻

  找出當年是他們三人打斷法會，讓彼此牽扯上

  但直到最後一part夢迴過去，也沒演到那對夫妻到底尋獲小孩屍體沒

  輪迴過程要開副本劇情不是不行

  但好歹也花點時間把副本敘述的好一點

  結束後覺得，所以又是跟黃衣小飛俠一樣

  夫妻跟小孩的故事，就只是襯托他們的三角戀情山難




  演員發揮不太行，劇情沒帶到核心，太多愛情元素，副本沒敘述好，不必要畫面太多

  這片爛的程度真的跟一堆東南亞莫名其妙的低成本恐怖片有得比

  一個好好題材發揮成這樣，真心覺得失望透頂


  --

  呃 把人物因果關係拼起來，形成了「三角戀情山難片」

  然後黃衣小飛俠這片名跟恐怖核心成為走個過場...

  我記得他是恐怖片而不是山難片

  爛雷懶人包

  1 黃衣小飛俠這鬼故事的前因後果沒仔細交代，僅過場帶過

  2 太多篇幅浪費在愛情元素跟每天都在輪迴，恐怖片變成愛情山難片

  是的，沒錯'
