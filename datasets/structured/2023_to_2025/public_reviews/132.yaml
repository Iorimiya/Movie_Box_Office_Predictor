url: https://www.ptt.cc/bbs/movie/M.1727248519.A.AF9.html
title: '[情報] 張吉安《搖籃凡世》首支預告'
content: '馬來西亞導演張吉安以《南巫》在第57屆金馬獎一鳴驚人且獲得最佳新導演獎，在去年也

  以《五月雪》入選了威尼斯影展，並於年底第60屆金馬獎影展擔任開幕片並獲得了金馬獎

  九項提名。


  在去年威尼斯影展結束後，回到馬來西亞開拍新作《搖籃凡世》，集結了馬來西亞及香港

  的眾多實力派演員：廖子妤、袁富華、許恩怡、蔡寶珠、原騰。


  今年的東京影展於今日公布片單，《搖籃凡世》入選亞洲未來單元，將於該影展進行世界

  首映。


  《搖籃凡世》以女性、棄嬰為主題，故事講述吉隆坡一所24小時營運的棄嬰保護艙，每一

  位女性志願者，日以繼夜地發揮“母性「天職，成為拯救初生嬰兒的搖籃手，但是她們過

  往卻同樣承受過性別不公的傷害。一名資深棄嬰保護艙的女性志工阿麗與尋求幫助的未婚

  先孕少女小曼之間邂逅的故事。


  --'
