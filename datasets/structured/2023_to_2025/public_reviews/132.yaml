title: '[好雷] 搖籃凡世'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  馬來西亞編導張吉安擅長將身邊的真實故事，結合其略有涉獵或深入研究的各種美學、人

  文與宗教元素，拍成魔幻寫實、充滿符號，同時主線敘事仍舊非常清晰的作品。這次拍攝

  《搖籃凡世》不但是張吉安第三度直搗馬來西亞的禁忌話題，也再次入選「世界民族電影

  節」，將女性最真實的困境搬上大銀幕。



  絕境母親無力撫養新生命，望著棄嬰艙關上倒數的三十秒，是煎熬的煉獄，也是生命的救

  贖。當保守質疑聲浪甚囂塵上，麗心和同事們仍堅守其中，陪伴那些走投無路的母親，也

  哼著搖籃曲，照看初生的嬰孩。



  雖說目前世界上大約三分之二的婦女能夠合法墮胎，但多數國家仍然需要特定條件或證明

  才能執行，像是父母感情生變或遺棄、胎兒患有重大遺傳疾病或身體缺陷、亂倫、節育、

  經濟困難、強暴、像《珍愛熱線》裡的孕婦一樣罹患致死性疾病、未婚或未成年懷孕等族

  繁不及備載。基本上，人工流產在全世界大部分的國家都依舊備受爭議，原因不外乎道德

  倫理、女性身體健康、生育權與宗教文化等因素。



  即便全世界大約40%的婦女可以在「沒有理由」的情況下合法墮胎，還是有不少國家不論

  如何都無法人工流產。基督宗教中的基督新教、伊斯蘭教與猶太教尤其反對由人而非神終

  結另一個生命，天主教教義更連避孕都嚴格禁止，而馬來西亞由於屬於回教國家，刑法裡

  明定「任何人自願導致女性流產，可被判監禁最多3年，或罰款或兩者兼施」。不過，即

  便如此，也不代表墮胎在馬來西亞不存在，反而會為需要人工流產的婦女造成額外的身心

  負擔。



  《搖籃凡世》中的小曼，即使非穆斯林，墮胎後還是因為被性侵的陰影與內心的愧疚感而

  時常做惡夢。人在脆弱時，更容易尋求宗教的慰藉，但就像前段所提，人工流產在馬來西

  亞並不合法，所以小曼前往求助神壇巫師時，當然不會找親友陪同，才讓這些神棍有機可

  乘。這些婦女二次受害後，一來沒憑沒據，二來還得承認自己是為了請對方「送走嬰靈」

  才找上門，自然也就不會揭發他們。



  雖然電影也提到墮胎，但《搖籃凡世》的主線故事依然是以「保嬰艙」或「棄嬰艙」為主

  ，2022年日本導演是枝裕和拍攝的韓國電影《嬰兒轉運站》也是以保嬰艙為主題的作品。

  馬來西亞國內現有13處棄嬰艙，部分由政府經營，其餘則由民間自發，而片中的單位更是

  由穆斯林女性主持。目前全世界已有很多國家設置保嬰艙，其中又以德國最多，但許多保

  守人士仍舊持反對態度，認為棄嬰艙的設置與存在本身都是鼓勵性行為與遺棄嬰兒。



  但是，比起人工流產所帶來的身心靈傷害，使用保嬰艙服務的母親，至少都已承受懷胎十

  月的辛苦與折磨，真的有不得已的苦衷而必須放棄孩子，不管是社會觀感還是宗教倫理，

  再怎麼說都比選擇墮胎來得偉大，也能夠讓孩子有機會獲得更好的成長環境。《搖籃凡世

  》不僅呈現出棄嬰艙機構的運作模式，也真實揭露其實不少孩子都沒能活下來等到一個愛

  他們的家。



  無論是被繼父、舍監性侵的未成年少女，還是如主角麗心與辛苦叫賣孔雀羽毛的印度婦女

  一樣，男友不願負責，在女方懷孕之後就一走了之，都可能不願把孩子生下來，或者生下

  後不想或沒有能力留下撫養，保嬰艙的設置至少讓這些孩子免於遭遺棄在垃圾桶、廁所或

  水溝的命運。從門後的柔軟小床，放置後用來提醒社工與安撫孩子的音樂，到現已不存在

  的30秒反悔倒數計時器與社工在帶著孩子前往醫院前第一時間先進行的簡易醫療處置等，

  都看得出棄嬰艙的存在是充滿愛，而非只有殘忍一個面向。



  導演在映後座談提到《搖籃凡世》的故事取材自他的穆斯林朋友，但由於題材本身已經極

  具爭議性，他為了不要再碰觸當局與社會的敏感神經，便將主角的種族從馬來人置換為華

  人，但全片還是充滿多元的宗教色彩。除了接近華人信仰的神壇巫師之外，片中還有母系

  社會的米南加保人獨特的周歲宴、佛教象徵覺悟反思的菩提樹、伊斯蘭教的齋戒月與物化

  女性的電子花車。



  米南加保人是來自印尼的原住民，因為土地與財產由女性繼承，因此生女兒才會大肆慶祝

  。片中與麗心及小曼分享的米南加保人說，河對岸的祖厝被家族裡的男性偷偷賣掉換錢，

  持續加深導演以女性的角度來拍攝這個故事時所呈現的父權壓迫，就連母系社會也無法倖

  免。由於信奉伊斯蘭教的馬來人在馬來西亞占多數，所以片中麗心遭煙嗆咳想喝水舒緩時

  ，還遭到旁人指責不尊重正在齋戒的信徒，導致她回到中心後，不好意思在大家面前吃午

  餐，而躲到廁所去。



  其實，光是齋戒月的橋段，導演就放進很多女性遭受束縛的符號。發現麗心在廁所用餐的

  同事告訴對方，自己剛好月經來，也沒辦法齋戒，而初次出現並未戴頭巾的院長，卻在下

  班前包起頭巾，並恭敬地吃起開齋的椰棗與飲水，辦公室的照片卻透露出，身為華人的她

  ，在婚前其實也勇於展現自己。不論是因為體貼女性經期體虛因此不需齋戒，還是認為不

  潔淨而禁止齋戒，21世紀的今天，穆斯林女性在齋戒月期間仍然會遭遇「月經羞辱」，

  BBC也已多次報導這個議題。（齋戒月的「月經羞辱」：「我受夠了假裝禁食」與齋戒月

  ：女性在經期進食的「羞恥」）



  由於導演在片中或批判或忠實呈現特定宗教的某個面向，所以除了較為中性的內容之外，

  《搖籃凡世》中的神祇都是導演自己憑空捏造的，像是神誕花車與神壇神棍，以免對應宗

  教對號入座，讓導演本來就經常挨刀的作品平添更多麻煩。其他元素如慶祝豐收的印度孔

  雀舞或中心屋頂上徘徊的嬰靈，都是導演展現馬來西亞多元宗教文化的方法。



  張吉安的電影本就很少人物特寫，他讓觀眾與片中角色保持距離，才能以客觀的角度看待

  故事，而《搖籃凡世》的「觀看」又更為有趣。電影開頭首先呈現一位母親將孩子帶到保

  嬰艙，卻又在30秒後反悔，便在中心大吵大鬧，導致院長必須為此寫報告。可是，這段過

  程其實是觀眾跟著中心的社工從電腦觀看監視器畫面，一層又一層的鏡頭，隔開母親與觀

  者之間的連結。就算觀者確實知道母親是誰，也都只能假裝不知道，這也是保護母親與孩

  子的一種方式。



  麗心第一次前往神壇，觀眾也一直是在簾幕後，彷彿偷窺一般地看著她與神棍之間的互動

  ，聽到麗心說自己人工流產或許也會不經意地為她倒吸一口氣，卻沒想到這一切都是要戳

  破神棍騙局的計畫。麗心在家運動不知為何要測試攝影機，最後才揭露她是為了偷錄神棍

  的犯罪證據在做準備，而換好白衫白褲後緊張兮兮地撥打電話，也是為了成就完美大結局

  的鋪墊。全片最有趣的觀看，則是麗心與小曼到藝術電影院去看《廣島之戀》時，開頭的

  裸露性愛畫面被放映師以手遮擋。導演笑說那其實是他的手，因為直接播放的話，在馬來

  西亞也會被剪，自己主動「閹割」，也是導演對當局的嘲諷。



  《搖籃凡世》出現許多「水」的意象，不管是讓穆斯林女性說出月經來潮與印度母親說自

  己在廁所破水分娩這種隱晦的「液體」，還是米南加保人慶典旁的河流、電影院的廁所地

  板氾濫成災的髒水與小曼就著水龍頭清洗害喜後的口腔等顯而易見的「水」，都是女性的

  各種面向。片中還讓一名反對棄嬰艙的穆斯林男人，將以色列的國鳥「戴勝鳥」放進保嬰

  艙，而這隻戴勝鳥也在社工將印度媽媽具有雙性性徵孩子的臍帶埋進院子後，將其銜出作

  為保佑。



  在馬來西亞的伊斯蘭文化中，接生後的臍帶不是丟到垃圾桶，而是埋在土裡，並露出一小

  截讓動物去咬，若是由鳥帶上天則是最好的結果。片尾字卡寫到「戴勝鳥帶領蘇萊曼在曠

  野尋找水源，牠一眼就能看出地面與水的距離。」這在伊斯蘭文化裡，如同神一般存在的

  鳥，可能毫不費力就能得知「母親在哪」，而即使是來到這個世界勢必會很辛苦的雙器官

  寶寶，牠也不吝給予祝福。只是，揭發神棍後的麗心依舊無法與自己的兒子相見，騎車回

  中心的路上還得知遭勒令暫時停業，路上歡慶豐收的孔雀舞是由放棄孩子的母親所跳，而

  背景裡的米南加保母親則將自己生下的男嬰丟進河裡，「天堂在母親腳下」，但，真的在

  母親腳下嗎？


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
