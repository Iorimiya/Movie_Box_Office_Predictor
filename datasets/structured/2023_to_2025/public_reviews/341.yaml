url: https://www.ptt.cc/bbs/movie/M.1423517514.A.C86.html
title: '[好雷] 【黃金時代】千秋萬世名，寂寞身後事'
content: "電影【黃金時代】The Ｇolden Era　\n\n片長：  １７８分\n\n上映時間: 2015/ 2/ 13\n\n★第51屆金馬獎最佳導演許鞍華得獎作品\n\
  ★湯唯、馮紹峰挑戰演技，從影以來最深刻演出\n★全新手法紀錄民國四大才女之一─蕭紅傳奇一生\n\n\n\n\n看完這部片，感覺蕭紅好似不是存活在那個年代的人，\n\
  骨子裡有那世代特有少見的叛逆，以及對於自我的堅持，\n在那個封閉時代勢必是要承受龐大的壓力，其實她原本的家境優渥的，\n出生於地主之家，受過良好教育的女人，但自己選擇了一條崎嶇不平的路，\n\
  而顛沛流離，不矯作地隨波逐流，也讓她的文學經過時代的洗滌後，\n如璞玉般再現受到矚目....\n\n專注自我，在短暫的人生中，才華發揮到最大值，\n像是燃燒到最後殆盡，將自我奉獻在文字中留給了世人．\n\
  \n過去如雲煙一般消散，而著作是其存在過的證明~\n更可以佐證人生不在於長短，而在於精彩！\n\n這部以半紀錄片的方式呈現，並且用不少旁人評價來呈現一個模糊不清的曾經，\n\
  我想，蕭紅僅３１歲的貧困寂寞人生，真正能陳述或考究的....有限....\n\n用湯唯的來演那時代的女性是很適合的，\n她的外貌是可以普通地不起眼，但也可以是耐看的很自然～\n\
  \n將近三個小時的片，原本詫異著稍嫌刻板生硬的方式（半紀錄片），\n看完後卻頗具餘韻，讓人對那時代那些人忘懷不已！\n\n沒有講太僵固，留給觀眾一些空間去探討孰為真實的遐想～\n\
  \n最主要的是透過像是採訪的方式藉由在蕭紅附近的旁人，\n也就是透過第三者觀察去闡述他們對於蕭紅的看法，\n我覺得因為不是用第一人稱的表現手法，而是摻入了第三人的看法在內，\n\
  這樣的表現，對於所呈現的會採取半質疑的態度，\n所以這某部分是留一半空白空間讓觀眾去度量的！\n\n再者導演捕捉角度及運鏡的流暢度絕佳，在運鏡間讓空氣中都瀰漫著文人的氣息，\n\
  不愧為金馬獎最佳導演～\n\n但一開始引發我興趣想看此片的重大原因，除了湯唯以外，便是此片的電影設計海報～\n\n非常具有文學的空間感，湯唯站在筆墨之間，氣勢迴盪又富力道！\n\
  \n忘卻不了，難以忘卻，就記在這裡了！\n\n\n\n－　－　以下內容含有劇情　慎入有雷區　－　－　－\n\n\n\n蕭紅與她的男人們\n\n要說影響蕭紅的男人，除了親人外，我認為是三名男人，\n\
  或許她的緋聞都留在蕭軍或是端木身上，\n\n但本片中在愛情裡，我覺得還有一個起頭人物，\n就是她的未婚夫汪恩甲，某部分而言，蕭紅給我的感覺是任性且倔強，\n或許要說她要是活在我們現在的年代，日子會好過很多，\n\
  還會被稱為新時代的女性，也會被看待平常，也不必走向逃婚，\n而讓家族蒙羞而必須舉家遷離的事，\n（所以我認為她像不存在那時代的人～\n或許說很難想像她可以這樣生活在那傳統保守的時代，也不怪乎生活得如此辛苦！）\n\
  \n為此，我覺得蕭紅是很看重她的愛情且熱愛自由，所以寧願逃脫，\n也不願嫁給她不愛的人！然而她的愛情卻背叛了她，\n相信是給她了不少的挫折，\n所以旁人對她的形容是：”處理文章英武，但感情卻勝過理智”\n\
  \n現實又逼迫著她不得不求生存，也許是愧疚，也許是補償，\n她回頭去跟曾經拋棄的未婚夫，我想那是一半是迫於經濟為了生活，\n對於感情，我更認為到後來她有點囫圇吞棗，\n\
  到了最後我已搞不清楚她是，為了經濟？為了陪伴？還是為了愛情？而在一起，\n還是說這些原因本來就難分難捨呢！？\n對於一個經濟無法獨立的女人來說，或許這些都是原因．．．\n\
  \n\n\n<<偶然想起>>\n\n去年的五月，\n\n正是我在北平吃青杏的時節，\n\n今年的五月， 我生活的痛苦， 真是有如青杏般的滋味! - 蕭紅\n\n\
  \n\n不少文人朋友都跟蕭軍說：\n”蕭紅的文學造詣，在你之上！她是一種天賦，而你是努力來的！”\n\n蕭軍則說：”雖是如此，但她不能沒有我！”\n一方面顯示出蕭軍的大男人性格，另一方面也暗示著，\n\
  蕭紅的生活經濟來源大部分是仰賴著蕭軍的支應，蕭紅除了寫作之外，\n沒有其他謀生收入的能力～\n\n而且奇妙的是，這些出現在蕭紅生命的男人，都在蕭紅懷孕的時候，\n\
  不是拋棄她／就是離開她／要馬就是不在她身邊～～\n\n某部分而言，我也在想是這些男人無情呢！？\n還是蕭紅自己個人的因素.....！？\n怎麼這些男人，都是在這女人懷孕的時候離開她了，\n\
  留給她獨自面對生產分娩的孤獨！？.....\n\n表面上沒有一個孩子是留在蕭紅身邊，除了可能生活困苦無法負擔，\n寧願選擇了然一身，也讓這個人物的身影顯得份外單薄（我甚至懷疑她都將孩子送養）\n\
  她體弱多病的身軀，更有可能是因為懷孕，沒有保養身子所致，\n再加上跟當時的醫療及困苦環境，導致造成她身體孱弱的因素是脫不了關係．．．\n\n”筋骨要是痛得厲害，皮膚要是流血，也就麻木不覺了．．．”\n\
  \n而蕭軍執意從軍，我想也是壓倒彼此最後的導火線，\n藉由在火車分離的那幕，看得出蕭紅的愛意，\n但太深的愛讓對方感到沉重了，\n以至於透過旁人的一句話點醒：”你這樣，被愛的是不舒服！”\n\
  只是已經將對方視為家人，面對生死離別又怎能不激動呢！？\n兩蕭相處，也多次露出蕭軍的多情，蕭紅的默然～\n\n”分開，是一個問題的結束，也是另一個問題的開始！”\n\
  \n從蕭軍跟之後相遇不久的女人結婚，並養育八個孩子看來，\n除了顯示這個男人不會是個因為孩子而停留的人，\n是因為找到認定能長久的伴而選擇穩定，我不得不說蕭軍跟蕭紅兩位，\n\
  事實上某部分應當都是性格剛毅倔強的人，\n但彼此都在尋求著可以使自己安然得到慰藉的另一半，\n這點可以從蕭紅離開蕭軍，選擇跟與蕭軍相比性格懦弱的端木結婚在一起可以看出來，\n\
  \n沒有跟走了六年共患難困苦的伴侶結婚，\n對造著當初的逃婚，經過了生活的跌宕崎嶇，終究嘗過酸苦候後，\n想要有個名分，有個平凡穩定可以生活的伴侶，\n這個男人可以柔軟地接納她，甚至是肚子裡的孩子！\n\
  所以說端木弱懦，我倒是覺得未必！\n\n在當時的文人圈中，想必這是個口耳相傳的大緋聞，\n對於兩性民風保守的年代，端木可以無視旁人的目光，甚至說道：\n\n”他以為我會因為你肚子裡有孩子，而不跟你結婚嘛！？”\n\
  \n”我必須明確我和蕭紅的關係！否則蕭紅會置於何地！？”\n\n要是這男人弱懦，我倒還覺得他有幾分勇氣！\n至少為了愛，他可以放下別人對他的異樣眼光，\n包容懷孕的女方，我已覺得十分大肚難得，端木的心讓我覺得溫暖！\n\
  \n蕭紅也自己言道：”我的文章以後不知道會不會有人看，但我的緋聞卻永遠流傳”\n可見其飽受輿論的壓力，但事實證明緋聞就如同我們現在的八卦新聞一樣，\n是禁不起時間考驗，日子久了，誰也不記得誰，\n\
  惟有她當時曾用盡生命所留下來的文字帶給後人滿滿的感動～\n\n\n時間，有時殘酷，但倒也還給人該有的真理！不重要的都會去蕪存菁．．．\n\n\n魯迅與蕭紅\n\n\
  這部片另一個特色是把魯迅給加入了其中～魯迅最有名的著作是＜阿Ｑ正傳＞\n\n透過魯迅這角色，潤飾了蕭紅也淡化了魯迅身為左翼文學先驅的菱角，\n\n幾個場景在咖啡廳，及在魯迅家吃飯的互動，著作及銀兩的交換～\n\
  \n口頭沒有一句言語的稱讚，直待到午夜最後，\n送蕭軍蕭紅到車站，惜才愛才之心倒是溢於言表!\n\n\n\n\"不必問自己要甚麼，要問自己能做甚麼！？\"\n\n\
  ”孩子偶爾看一下是有趣的，但養起來一整天下來，也是麻煩的很！”\n\n\n\n其實，魯迅講這些話的時候，某部分我也在猜想導演是否是透過魯迅的口，\n在講蕭紅的想法，\n\
  \n現實中蕭紅並不擅交際，生活單純少言，\n\n除了提拔之外，大大改善兩蕭的生活及文章能見度，\n更藉由魯迅對於蕭紅的衣著配色，暗暗影射著魯迅對於蕭紅留下的影響～\n\
  \n\n\n”延緩生命，倒不盡是為了我的愛人，大半是為了我的敵人！”\n\n\n\n其實此片刻意將當時敏感政局給避開，因為位在文學界先驅前端，\n被視為靶的機會當然很容易，這句倒是被我認為是對魯迅內心世界的一種心情寫照，\n\
  也將當時文筆戰爭作為一種淡然抒發．．．\n\n”敵人是不足懼的，但真正可怕的是自己堡壘裡的蛀蟲！”\n\n雖說那時候文學思想豐沛，對照著蕭紅獨樹一格，有種逆向而毅然的堅韌，\n\
  有各種不同的作家，就該有各式各樣的文學風貌，\n更顯示出她思想上不受限而超然的心境，堅持保有自我，\n當下的她在文學上是幸福的！思想上的幸福！\n\n每個人都追逐潮流下，經過時間的洗滌，也間接證明了真理．．．\n\
  \n然而魯迅先生的死，對蕭紅而言等同是頓失一個文學巨擎支撐，所受的衝擊不小～\n\n她形容道：\n\n”一個人的死是必然的，但知道那道理是道理，但真要來時總不行的！”\n\
  \n”面向除了墳墓以外，毫無希望的未來～”\n\n\n\n蕭紅的靈魂是自由的\n\n”一個偉大任務站在你面前時，該怎麼忘卻自己的渺小！”\n\n這部電影共提到她的三部著作＜商市街＞　＜生死街＞　＜呼蘭河傳＞，\n\
  對於人生而言，蕭紅是幸福的，\n\n就算生活物質上飢餓困乏，物質上的貧脊並未影響她對自我的追求，\n\n她非常瞭解自己，也知道自己的所長，所以對她而言偉大任務是甚麼，她自己很清楚，\n\
  \n就是她的文章／她的著作／她的字句／她的才華！\n\n一個人的成就在於發揮長處，直到生命最後～\n\n但對於追求自我而言，是幸福的！她是瞭解自己的～就算環境如何偏激，\n\
  她最難得的是可以無動於衷，仍能堅持自己的理念而不放棄，\n在文壇上我覺得可以用”勇士”來稱呼她，\n\n所以電影也特別用蕭紅的話形容代表著她：\n\n\n\n\
  ”該怎麼活就怎麼活，這是無所畏懼的時代，一切是自由的.\"\n\n”自由和舒適，平靜和安閑，經濟一點也不壓迫，這真是黃金時代，是在籠子過的”\n\n\n\n個人並不覺得那時代真的自由，真的無所畏懼，\n\
  而是因為戰爭紛亂，生死未料，並不是真的無所畏懼，\n而是對於現實中的無奈失望，文人們所能僅僅保有的只有思想上的自由，\n更甚者我認為這是帶有一種阿Ｑ思想的言語，\n\
  \n因為不怕死，不怕貧，不怕飢了，不怕失去，當然是無所畏懼！\n\n真是暢所欲言嗎？倒是慶幸著蕭紅短暫的生命，回頭看來，這是種幸，\n\n逃過了被批鬥的後來～\n\
  \n雖然在此之前我不認識蕭紅，但謝謝這部電影讓我認識了曾經存在的她！\n\n讓人瞭解擁有如此美麗文采的民初才女，\n\n曾經的沉重，現在變得輕巧，一切如過往雲煙～\n\
  \n大時代的悲歡，\n\n千秋萬世名，寂寞身後事．也許每個人都是隱姓埋名的人．．．\n\n\n--\n\n 如果你要走，我不會留．．\n  但請記得當我牽你手的時候，我心永留存．\n\
  \   離別並不可怕，回憶會在我心中把你留在最美的時候．\n　　\n\n--"
