  \n所以影片內的字幕是簡體字，討厭簡體字的人勿入。\n\n\n\n我試圖辨識到底是那些香港電影，\n\n不過有好多個真的是完全辨認不到，\n\n也歡迎版上各方高手也一起下來猜猜看，一起下來同樂。\n\
  \n============================================================================\n\
