  但有一個問題~


  在遠古時代達克賽德出征地球的時候，

  有看到猛男宙斯跟兒子阿瑞斯出戰抵抗，

  裡面的阿瑞斯看起來是好人，而且跟神力女超人裡面邪惡好戰的阿瑞斯是不同角色，


  請問電影的設定是同一個人嗎？還是說在DCEU中的設定戰神是名號可以繼承轉讓的呢？


  -----

  Sent from JPTT on my Samsung SM-N960F.


  --'
