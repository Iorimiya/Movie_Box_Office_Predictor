url: https://www.ptt.cc/bbs/movie/M.1422828521.A.4F1.html
title: '[新聞] 「黃金時代」是最後作品？ 許鞍華批宣傳過頭'
content: '新聞網址：


  去年拿下第3座金馬獎最佳導演獎的許鞍華，為「黃金時代」上映來台宣傳有問必答，她

  表示下部新片還在研究，並直率否認之前傳「黃金時代」是她最後作品的傳言，笑說自己

  非常不喜歡不實的宣傳手法，不如說她死了會不會更有效果？


  許鞍華去年拿獎時笑說本來做好為藝術犧牲的準備，昨她表示早知這樣題材和手法，沒有

  刻意去討好觀眾是有風險的，但她覺得蕭紅精神層面很吸引人。


  「苦難對一般人也許沒好處，對作家而言卻是創作的靈感。」蕭紅的一生即使以現代眼光

  來看也有點驚世駭俗，許鞍華坦言要讓觀眾投入一個有點負面的人物中很困難，但想法本

  身沒問題，重點在於怎樣把這個想法變好看。


  許鞍華可說是華語影壇最才華洋溢又堅持藝術創作路線的女性導演，她說話和她的作品一

  樣誠實而溫暖，除了反對片商誇大宣傳，對演員降價演出一事，她也說：「這也是宣傳手

  法，我真的不喜歡這樣，人家是演員，下部戲怎麼收錢呢？別的導演會說難道他拍的就是

  爛戲嗎？」


  許鞍華昨天在光點華山電影館前舉辦簽名會，吸引許多粉絲來拜見天后導演，「黃金時代

  」實景拍攝，女主角湯唯更穿了上百件戲服，電影劇照極為精美，今起至2月26日止，在

  華山文創的咖啡時光舉辦海報展。

