url: https://www.ptt.cc/bbs/movie/M.1424147822.A.891.html
title: '[好雷] 撤退的藝術：電影《黃金時代》'
content: '很少貢獻什麼文字給ptt

  剛好寫了一些感想就貼上來分享了

  沒什麼劇透應該不需防雷線


  網誌版：


  --



  《黃金時代》這部電影，令我喜歡，不是一看就感覺驚艷的那種，而是綿延著餘韻的。而

  它也沒有想像中時代的沈重感，它說的是一個時代的故事沒錯，說得深刻但清新，沒有商

  業大片那般影像豐富與情緒渲染，也不是經典文藝電影常見的完美格局。導演運作畫面的

  功力其實深厚，但不賣弄（也不是故意忍住不賣弄，而是無賣弄意圖），沈穩優雅是基礎

  ，在這個基礎裡，卻有一些非常大膽又別緻的設計。它當然一定有它的瑕疵，畢竟《黃金

  時代》是一部願意冒險的電影，她不消費作家的愛情八卦（或許行銷宣傳裡有些，但電影

  本身沒有），也不張揚導演的個人詮釋，所以它票房慘澹。光是願意冒險這點，就沒辜負

  蕭紅這個女作家。


  願意冒險，不是喜歡冒險，只不過在那樣的時代，即使蕭紅只想有個安身的地方安心寫寫

  東西，都如此困難。說到底，她要的是徹底的精神自由，那徹底的自由所要求的，僅僅是

  一個安靜的房間，寫作的紙筆，有得吃，偶爾和朋友吃些喜歡吃的，就好了。但她那彷彿

  為了不辜負自己寫作天才而召喚來的現實，卻處處是令她「不樂意」（註）的，可她依然

  願意。蕭軍初見蕭紅時說，「妳怎麼不去自殺，妳自殺條件充足啊」，生活如此不堪，她

  卻是願意的。她隨性任性，看起來不怎麼愛惜身體，包括從自己身體生出的孩子，但她熱

  愛生命的本質，這一點絕對是真誠真摯的，因此什麼冷漠貧病看在眼裡，她依然能從中提

  煉美，那些詩意的字句，有時更像一幅幅的畫作。


  導演的鏡頭，便也透過同為作家的友人們，看見蕭紅。同樣是畫，於是有時畫內，有時畫

  外，時代推著一群年輕人從北方撤退到南方，而劇本在過程中不斷把人推出入推出這場撤

  退的連環戲，且戲還不是那麼照著時間軸走的。途中多次閃回，好像記憶並不那麼穩固也

  不那麼重要，甚至開頭就讓蕭紅對著鏡頭簡短說完自己的一生，彷彿人都撤退成了鬼。有

  所令人不樂意的，所以撤退，但撤退其實更像冒險，表面是退，其實是進。很多時候，撤

  退至當下就是突圍。突圍是連續不斷的過程，那圍著存在的界線不會一直在原地，界線會

  動。在生命結束的那刻之前，人生的突圍，是擁無休止的。


  蕭紅再清楚自己不過，在幾乎所有知識青年都把關懷投注於政治局勢的時代裡，她從未跟

  隨，她甚至從愛情撤退回文學，把自己的心撤退回家鄉呼蘭河。而《黃金時代》這組編劇

  與導演，也再清楚自己不過，在這影音的黃金時代裡，關注自我表達的創作是主流，再不

  就是拍記錄。《黃金時代》的創作能量無疑是豐富的，它卻謙遜地將這能量服務於好好說

  一個真實人物的故事，而且是說給普羅大眾的。《黃金時代》像是編導、演員們與蕭紅、

  魯迅等一干作家，彼此間一場穿越時空的合作。


  不久之前，我們可能還想著，傳記吧，怎麼說都是作者帶著多少程度的揣測進行的。如今

  導演許鞍華與編劇李檣給了我們一個示範，就是從個人觀點撤退，把揣測完全丟開了，因

  為不需要，已經有的材料就夠多了。說一個蕭紅不難，給她的朋友們去說就好。有意思的

  是，這樣選擇撤退，撤退回一個好好說故事的人，非但沒把我們自己時代的特質掩蓋，反

  而這份越發無為的時代精神，透過電影作品，定定地發光。我覺得這是難得的開始，所以

  我願意而且樂意推薦大家去看看這部作品。


  註：電影預告二版中，透過湯唯飾演的蕭紅，旁白出一段文字，其中包含改編自魯迅文章

  《影的告別》裡三句經典：「有我所不樂意的在天堂裏，我不願去；有我所不樂意的在地

  獄裏，我不願去；有我所不樂意的在你們將來的黃金世界裏，我不願去。」預告旁白在這

  三句後加上了：「我只願蓬勃生活在此時此刻，無所謂去哪，無所謂見誰。那些我將要去

  的地方，都是我從未謀面的故鄉，那些我將要見的人，都會成為我的朋友。以前是以前，

  現在是現在。我不能選擇怎麼生，怎麼死，但我可以決定怎麼愛，怎麼活，這是我要的自

  由，我的黃金時代。」，個人覺得頗有一種詩人海子附體的感覺...不過滿好的。



  --'
