url: https://www.ptt.cc/bbs/movie/M.1447745068.A.9C9.html
title: '[好雷] 黃金時代：愛要「為己」，還是「為人」'
content: '網誌版：





  [心結] 愛得自私，有錯嗎？


  這個問題，本來擱在案頭好長一段時間，寫了幾次都有感狗尾續貂，沒法把這個經常被問

  到的難題寫完。


  沒想到前些日子，先是看了電影《蕭紅》，接著看了《黃金時代》。接著抱回劇本，搭配

  蕭紅寫的《生死場》和《呼蘭河傳》，斷斷續續的看完後，對自私與愛情的交錯關係，悠

  然地雲開霧散。



  § 寫以為己

  臨汾，蕭紅和蕭軍在一起六年，愛了六年，也吵了六年。她還懷著孩子，蕭軍就愛上她，

  和她上床，然後帶著她在中國各地流轉。走過那麼多刻苦的道路，好像幸福的彼岸就在不

  遠處，但他們像是都不再願意繼續欺騙自己──那個彼岸總有一天會來，只是跟隨自己上

  岸的，怕並非眼前人。


  蕭軍和蕭紅，就像現在台灣許多年輕文字創作者的縮影。


  蕭軍醉心創作，同時關注社會與政治議題，國家有難，他不願意袖手旁觀。放在今天，他

  會停筆去凱道創作，和夥伴一起綁上黃絲帶。將所見所聞，以及他對社會與政治議題的理

  論寫成一篇篇洋洋灑灑的專論，好讓自己參與進改變國家命運的歷史洪流中。


  蕭紅說自己不懂政治，她的人生觀很純粹，「我只想找個地方安安靜靜的寫作。」她也確

  實做到了這一點，寫自己對生命、生活與生存的所有感悟。被動的在波濤洶湧的時代，為

  了如星芒的邊緣一般渺小的願望，顛沛流離。彷彿長期做為命運的玩物，早已坦然。


  在蕭紅的短篇小說〈後花園〉尤其可以讀到人生於世的無奈，彷彿在她的眼中，生命的進

  展是有限選擇中的一扇窄門。


  當生命寥寥可數的可能性擺在我們面前，我們既接受，又不接受。終有一天這都不重要，

  也不需要想。如蕭紅筆下，主角馮二在傾慕的小姐出嫁後，對生命的眼光一下子變得尖銳

  。但最後，他接受了生命的現實，和一位心境相似的寡婦成婚，有了孩子。之後老婆、孩

  子相繼過世，物換星移，但馮二的心有如石磨子，動和不動已無分別。


  「不問世事，沉溺於創作」，每每於民初動盪時代為背景的電影中，這類人通常是被編劇

  和導演批判的頭號公敵。面對蕭紅，我們卻沒有辦法輕易的去說她，因為她不屬於隨波逐

  流，偏偏又混得特別好的人，她是戰爭底下的難民，跟其他社會底層的人活得一樣卑微。

  儘管躍上文學舞台，她也沒有因為站在那個舞台上，就從此過著小資的生活。


  也許她的不幸除了時代，除了命運，還要怪罪於她自己的性格。但她受的苦，使她在文學

  上的專注，這項她自己求來的救贖，顯得振振有詞。



  § 人己間的雲與霧

  對事業的愛，或是對伴侶的愛，經常以「自私」兩字做為指責一個人不懂事，過份注重自

  我感覺的批判。對此，我想起《論語．憲問第十四》一段話：


  子曰：「古之學者為己，今之學者為人。」


  對於這段話的解釋，《顏氏家訓》說得分明：


  古之學者為己，以補不足也；今之學者為人，但能說之也，古之學者為人，行道以利世也

  ；今之學者為己，脩身以求進也。夫學者猶種樹也，春玩其華，秋登其實；講論文章，春

  華也，脩身利行，秋實也。


  顏之推以為不能單從字義上把「己」當成自私的同義詞，也不能把「人」簡單視為「推己

  及人」之意。所謂的「己」和「人」在不同目的的人身上，各有不同詮釋。


  從現代教育的角度來看， 為己其實是「自學」精神。


  自學不是放棄學校體制，而是打破學校的藩籬。自學的精神也不是體制外的專利，適用於

  任何階段的學習者。進而，為己，自然學起來常保樂趣。為人，學習的熱情與世界交會，

  真正落實為具體事物，增進社會福祉。兩者皆發於初心


  相反地，某些人不談個人學習的熱誠、道德的培養，他對己身的追求是謀職、仕進，為的

  是實質利益。在他們眼中，缺少內在學習動機，他們的動機往往是外在的，受他人的眼光

  ，社會的價值觀而變動。有時他們做了一些有助於社會的事，並非為了他人的幸福，而是

  為了獲得褒獎。



  § 愛以為己

  如果將「學」換成「愛」，什麼是「自私的愛」？


  生活中何嘗不是如此，那些口口聲聲「我是為你好」的長輩、伴侶、朋友，他們可能只是

  用自己的價值觀來論斷你，還妄想要改變你，好讓你變得跟他們設想的一樣美麗，而非接

  納原原本本的你。


  有些人唱著「我們要一起努力」的調，執行起來倒是競選標語，所謂的一起是以他的目標

  為目標，並不存在兩個人共同協調出來的新方向。


  自私的愛所帶來的痛苦，源於把伴侶當成完成自己理想的工具：他不愛對方，而是對方給

  自己帶來的附加價值。


  自私的愛會以多樣化的方式體現，像是給孩子一切，然後要孩子照個自己的計畫成長，一

  旦孩子偏離預期，不惜用威脅、哀求等等方式，就為了讓孩子重回控制。或是每次趁著醉

  意對伴侶使用暴力，之後又跪地求饒，不斷循環「失控、道歉；道歉、失控」循環模式的

  枕邊人。


  社會上，還有些人用某一套高道德標準去框架他人，站在道德制高點上，以我尊你卑的姿

  態，自以為苦口婆心的在「教育」民眾，「積功德」。說穿了，他們沒有真正用敏感的心

  靈去體察他人的感受，他們是冰冷的旁觀者，隨時等著狩獵那些心志不夠堅定、缺乏主見

  ，徬徨無助的靈魂。


  自私的人非常脆弱，因為他們如果不利用別人，就沒辦法好好的活下去。

  他們走不進別人的心，他們的心中只有自己；別人也走不進他們的心，因為別人都只是自

  己向外投射的東西，不是有血有肉有感情的生靈。


  如果學以為己的正向精神是「自學」，愛以為己的正向寫照便是「自愛」，而非自私，是

  「為己，以補不足；為人，行道以利世」的展現，在愛的滋味裡見證自己的軟弱與自卑，

  故在愛中學會堅強。對於愛中的伴侶關係，所作所為能真正呼應對方內心的聲音，貼近對

  方的需要。



  § 時代中人：既為人，也為己

  回過頭看，蕭紅自私嗎？她完全忠於自己的心志，正是在亂世中，天真的保有自己對寫作

  的熱愛，在文學的世界建構一個理想國。放在整個文學的世界與歷史，她做的是開疆拓土

  的大事。


  蕭軍自私嗎？他忠於自己的理想，儘管蠻橫，但至少他不是為了慕得虛名而打游擊──這

  也是他的魅力之處，無論喜歡的人是否聲名狼藉，是否許有婚姻，他都說愛就愛，卻也說

  走就走。


  蕭父為了不想被女兒玷污家族名聲，連夜搬家，和女兒恩斷義絕。汪恩甲、端木、駱賓基

  ，他們都曾一度守在蕭紅身邊，但他們分別懷著的是什麼心？是一時間對女神的崇拜，還

  是真正接納蕭紅整個人的光與暗？


  若從「為人」、「為己」之分來看《黃金時代》中的每個人物，哪些是可愛的，哪些是可

  恨的？哪些是徒慕虛名，實則自私；哪些又是似自私，實則無私？


  那些圍繞著蕭紅而生的人，同時也有其他人圍繞著他們而活。每個人都在書寫自己的時代

  ，但有人花了很多篇幅去寫貌似客觀的歷史，他的筆下是時代的全貌。


  有些人像蕭紅，在愛情與文學的世界，不刻意向魯迅、矛盾、蕭軍等試著紀錄歷史大江大

  海的偉大人物致敬。她不企圖影響身邊的人如何生活，正如她離開蕭軍，選擇端木，她就

  是想換個生活方式，而非求要求別人換成自己想要的生活方式。


  她走自己的路，寫自己的文章，以飽受折磨的一生實踐一位藝術家對創作的謙卑。




  [解語] 凡事量力而為，才能恰到好處。





