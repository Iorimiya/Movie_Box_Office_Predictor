url: https://www.ptt.cc/bbs/movie/M.1422803470.A.8EB.html
title: '[新聞] 黃金時代後不再拍 許鞍華駁斥'
content: '（中央社記者鄭景雯台北1日電）


  導演許鞍華拍「黃金時代」再奪金馬最佳導演，傳出這可能是她拍的最後一部片，許鞍

  華直言，「我懷疑是公司宣傳手法，太沒新意。」


  「黃金時代」描述民國傳奇女作家蕭紅的一生，她歷經動亂及深刻的愛情，有如民國版

  的「亂世佳人」。


  許鞍華今天來台灣舉辦簽名會，先前有傳聞「黃金時代」可能是許鞍華最後一部作品，

  她直言，「我懷疑是公司的宣傳手法，這樣太沒新意了，這個手法沒必要，也不能保證

  效果」，直接否定這樣的說法。


  先前也傳出片中男主角馮紹峰是零片酬演出，許鞍華說，「這也是一種手法，我不是很

  喜歡這種手法」，她認為只要有這樣的傳言，那演員之後再演其他戲會很難要片酬，但

  也坦言這可能是在市場競爭激烈下不得已才有的手段，她也沒法管。


  「黃金時代」跳脫過去電影拍攝手法，讓片中演員會在某些片段跳脫當時的情境，走向

  鏡頭前敘述當時的狀況，這種手法讓外界的接受度很兩極，不過許鞍華說，這是編劇李

  檣提出的構想，而她也接受，「這不像流水帳，也不是很戲劇的故事，但能呈現寫實的

  感覺」。


  拍片多年，許鞍華也不是一路順遂，她回想在拍「傾城之戀」時，那時太年輕有點誤解

  故事原意，作家張愛玲的劇本描寫情場如戰場，但她卻想拍成蕩氣迴腸的愛情悲劇，當

  時怎麼拍就覺得不對，「但現在知道了，不會拍第二次」。


  當時要拍「黃金時代」，許鞍華腦中浮現的第一個人就是湯唯，而湯唯對於蕭紅也感同

  身受，認為在那個年代及處境，蕭紅周圍出現的男人肯定都是她的救生艇。


  蕭軍對蕭紅而言是感情寄託，最後蕭紅和端木蕻良結婚，但端木卻只是替代品，不過眾

  多才氣男人圍繞身旁，湯唯認為，蕭紅其實最喜歡的是魯迅，這讓許鞍華跳出來說，這

  是在拍作家創作的環境，不是在拍作家的男女情愛。


  許鞍華今天也分享最近發現的史料，當初蕭紅在和端木結婚後，端木曾離開蕭紅一段時

  間，原因是發現蕭紅和駱賓基走得很近，這是在拍電影時沒發現的事情。


  回歸到電影，許鞍華表示，「黃金時代」還是要描述蕭紅在那個年代身體不好，又沒有

  錢，總是在飢餓邊緣，但又要創作，是個了不起的女人。


  「黃金時代」13日在台灣上映。


  --'
