title: '[好雷] 《黃金時代》導演許鞍華專訪'
content: '【Y!專訪】比較永恆的觀點來看人間悲歡離合：《黃金時代》導演許鞍華專訪


  原文刊於Yahoo!奇摩電影

  連結：


  【文／吳老拍】


  小提醒：文長慎入，且文中有劇情雷。


  作品總是充滿濃濃人文情懷、擅長捕捉人物細膩情感的香港女性名導許鞍華帶來新作《黃金時代》，這次邀請《色，戒》民國女性形象深植人心的湯唯，來詮釋民國四大才女作家蕭紅的傳奇一生；以古裝劇「蘭陵王」四爺深情形象贏得台灣觀眾喜愛的馮紹峰，則飾演蕭紅的作家愛侶蕭軍，精采詮釋兩人之間的情愛糾葛。


  許鞍華導演於本片盡力還原蕭紅在大時代裡顛沛流離的種種生活樣貌，也邀請眾多實力派演員「戲劇重演」，帶領觀眾重回民國文人的生活場景與情境，重現當年民國知名文人如魯迅、丁玲等人的左翼作家群像；同時大膽在片中安插多段假紀錄片訪談的破格形式，藉著眾文人受訪的口白說出蕭紅的種種事蹟，以流動的視角呈現多方觀點的不同角度，也令觀眾思考「究竟什麼是真實？」。電影將蕭紅短暫精彩的一生呈現在大銀幕前，交由觀眾自己去評價這位民國才女，並盡力保留民國文人的時代精神，再度展現出深厚的執導功力。


  許鞍華導演勇於突破既有框架，追尋電影純粹的藝術價值，以本片榮獲金馬獎最佳導演實至名歸，也成為首位三度奪得金馬最佳導演的女性導演。（其他兩位曾三度榮獲金馬最佳導演的得主分別是李行與杜琪峯導演）。許鞍華導演接受Yahoo!奇摩電影專訪，與觀眾分享和演員在東北零下三十度的拍片點滴與創作心情。


  湯唯氣質像文人，表情的變化特別迷人。


  問起為什麼會想找湯唯來飾演蕭紅？導演說：「我們在開始寫劇本時，已經想找湯唯了。李檣是編劇，他跟我都認為她是非常理想的人選，她演技又好，氣質又有點像文人，樣子也是看起來蠻平常的，但在有表情的時候看起來特別迷人，因為蕭紅應該不是個大美人吧。如果我們找了一個特別漂亮的演員來演就不太對，可是如果在表情的變化裡頭迷人，我們都覺得特別好。當然還有她是個大明星。」


  許鞍華導演從影近四十年，林青霞、鍾楚紅、張曼玉、陸小芬、陳玉蓮、趙雅芝等一代影星，都曾在她鏡頭下留下了最燦爛的青春年華。也唯有拍過無數大明星的她，才會說湯唯不是特別漂亮吧。


  湯唯非常投入跟拼命，充滿敬業精神


  湯唯拍戲時，有什麼令她印象深刻的小插曲？導演說：「湯唯是非常投入跟拼命的演員，比如拍飢餓的戲，她會兩天或至少一天不吃飯，到了現場才吃，去表達那種飢餓感。要表現很冷，她第一天就穿得非常單薄，在零下三十度的室外走來走去，說要體驗那個寒冷，我們全都嚇死了。倒不是因為擔心她的生死，而是因為如果她一病，我們全劇組就得停下來。（笑）」


  湯唯的敬業精神不只在忍耐飢餓和體驗受凍，有場比較危險的橋段，蕭紅要從東興順旅館逃脫，導演幫她找替身，但她不用替身，親自從三樓小梯子旁攀爬往下跳，只為了努力詮釋當時被困在旅館內，懷孕又窮困潦倒的蕭紅急於想要逃離的心情。


  馮紹峰挑戰自己，特別想演蕭軍


  為什麼找馮紹峰來演男主角？導演說：「馮紹峰除了樣子很帥，他還是一個裡裡外外都非常好的演員，他不只能演自己的那種角色，還能演不像他的角色。我看過他在《鴻門宴》、《太極》，發現他演霸王跟自己本來外型不符合，也演得很到位，所以覺得他能演蕭軍。加上他覺得蕭軍對自己來說是項挑戰，特別想演，我們就請他來演。」


  印象最深刻的戲？導演說：「有一場戲是蕭紅跟蕭軍分手後，蕭軍站在裝滿冷水的洗臉盆前面，突然將整盆冷水從頭潑自己，全身都濕了。他也沒告訴我，他臨時就演了。我們都嚇一跳，這是在山西，我估計零下十五度到二十度吧，也夠嗆的了。」


  馮紹峰鮮活呈現出蕭軍曾從軍卻搖筆寫作，又去打游擊的東北左翼熱血作家形象。他慧眼識出蕭紅才華，引領蕭紅進入文壇，自己卻陷入才情不如蕭紅的窘境，又外遇而讓蕭紅陷入痛苦感情糾結，這和馮紹峰之前在「蘭陵王」中深情溫柔的四爺形象截然不同。


  所有的歷史都不是百分之一百客觀跟正確。


  為什麼會想以流動的視角來呈現蕭紅一生？導演說：「這是編劇李檣想這麼做的，劇本從頭到尾大概寫了三年，都是他獨力完成再給我看。有一天，他說想到一個方式來表現蕭紅的一生，他覺得非常棒，跟我說，我也說這很棒啊。他就照著這個方式去寫了。我覺得他呈現方式的獨到之處，就是跟你說，其實所有的歷史都不是百分之一百客觀跟正確。」


  「從蕭紅的身世本身就可以印證，相關當事人自己也有好幾個版本。李檣差不多百分之九十的內容都是從第一手材料中取得，不是從當事人自己寫的文章、小說、散文、信，就是從朋友們在某些重要場景，還是身歷其境的，可是這和說出來的那個版本都還是不太一樣。當然當我們選出來的角度，他們說的那些事，也都有我們的立場跟觀點。」


  從一個比較永恆的觀點來看人間的悲歡離合。


  如何來呈現多元的觀點呢？導演接著說：「就是根據他們當初寫的東西，因為我們沒有炒作她比較聳人聽聞的那些經歷，就是給人家看，好像是非常客觀、非常克制。我們把比較低俗的或是廉價的八卦都隱晦淡化，採取的立場比較客觀，以事論事。而不是說誰是好人、誰是壞人，誰特別特別壞，騙人啊。」


  「只是把蕭軍跟蕭紅的這段感情，蕭軍有背叛蕭紅，可是他始終沒有失去自己做為一個人的尊嚴，只不過是他性格如此，可能這種立場是不太討好的，可是沒有辦法去指責另外一個人，比如說你把蕭軍寫得特別壞，我特別同情蕭紅；我們只是從一個比較永恆的觀點來看人間的悲歡離合。其實愛情過了一定時間，多半會消失。」


  「像蕭紅跟端木蕻良，她以為她能離開蕭軍，因為蕭軍讓她感到痛苦。然後她就好好找一個人結婚，雖然她沒有像愛蕭軍這麼愛端木，可是事後她才發現這讓自己更痛苦。我們也不能說，如果從比較俗氣的角度，你會批判說蕭紅這樣做，無非是找一個代替品，就好像欺騙、不忠實，很不地道。可是我們也沒有這種立場，我們就是把她做了這件事，她承擔的後果給觀眾看。」


  動人都不是情節的問題，而是情調的問題


  問導演如何拍出蕭紅跟蕭軍貧窮時互相扶持，單純動人的愛情？導演說：「動人其實都不是情節的問題，而是一個情調的問題，所以我說真的去零下三十幾度拍，好處就是在那麼冷的地方，人的狀態很不一樣，就是不停在哆嗦、哈氣，非常原始跟很艱難的感覺。在這種艱難的感覺裡頭，大家感情好，就覺得特別感動。」


  片名黃金時代的由來


  問起片名為什麼會叫《黃金時代》？導演說：「這是蕭紅在日本時寫給蕭軍的一封信，她說這是她的黃金時代，這麼多年唯一一段時間，不用擔心錢的問題，沒有經濟負擔，不用熬窮跟餓；可是同時間她也很不開心，因為離開了蕭軍。他們之間有一個很大的誤會，她在信中寫下：『對！這就是自己的黃金時代了。』我覺得這段話，特別能顯示蕭紅作為一位藝術家，同時能看到生活裡的矛盾。」


  反抗封建的家庭、也反抗時代的招喚


  導演會認為蕭紅是那個民國時代爭取女權的代表嗎？導演說：「她當然是爭取女權的代表，她反抗父親、她反抗封建的家庭，然後要念書、又拒絕她父親安排的婚姻，逃跑、私奔，所有可以叛逆的事情都做了，而且做得非常非常極端。」但是在反抗那個封建體制，映照女性自主意識的同時，蕭紅卻又屏棄大時代的精神召喚。


  在民國時代，很多作家的作品反映了救亡圖存的愛國精神。但和同時期作家不同的是，蕭紅只想安安靜靜寫作，寫的是童年的美好記憶，回歸作家的心靈，而留下了「呼蘭河傳」的經典。作品穿越時代，喚起不同世代讀者的心靈，片尾結語「千秋萬歲名，寂寞身後事」，就是蕭紅這一生特立獨行的最佳註解。


  拍《黃金時代》經歷了美好的感動


  導演在劇本書中曾提到，能拍《黃金時代》是個神奇的緣分，可否跟觀眾分享？導演說：「整體電影生態很不利於我們的電影，因為這個電影是需要人家一兩年，在拍攝的時候最少五、六個月靜下心來，好好地投入，每一個部門都是。可是你看現在拍戲狀態十分蓬勃，演員有許多戲找上門來。你請他們五個月不接別的戲，他們又不能軋戲，他們也不願意軋戲，因為會從角色狀態中抽了出來。」


  「連工作人員都不停有人來找他們拍其他戲，在這種環境下人家會支持你嗎？會有這麼多人準時來拍嗎？可是我發現在拍這個戲的時候，有三十幾個演員沒一天是脫漆的，全都來了，我覺得這很令人感動。工作人員也沒一個半途而廢，就是可能因為太辛苦或不愉快而中途走掉，沒有。全都非常投入，把這個戲拍完。這個極其難得，是我前所未料的。然後老闆也從沒懷疑過我們，沒有東說說西說說，一直都是精神上十分支持。」


  《黃金時代》在拍片的五個多月中，輾轉於哈爾濱、北京、上海、山西、武漢等地，於零下十五至三十度的戶外室內實景拍攝，而且劇組無論編制或演員陣容都十分龐大；加上拍攝民國三零年代的戲，不管美術、服裝、道具、佈景全部還原時代背景，這的確是非常難能可貴的機緣。


  就是為了做這個事而做這個事


  談到蕭紅投入在文學創作的純粹，導演在拍片時會有追求完美的創作者心情嗎？導演卻謙虛表示：「我覺得主要就是不要去顯示給別人看，我們究竟做得多好，主要不是為了表示你跟別人不一樣，可能會做得更好，而去做這個事，因為這也是一重誘惑。就是其實不是說你怎麼怎麼了不起，怎麼怎麼偉大。」


  「其實如果你真正投入這份工作的話，你不會怕那個後果，你也不是要表現得比別人好，你只是很投入，這特別難得，就是為了做這個事而做這個事。人的虛榮心，也許是自尊也很厲害，很難說。我不能說我沒有競爭的心態，也不能說我不是想表現得比人好。這個肯定是有的，但我還是希望，我主要是為了把這個戲拍好。」


  採訪側記：可愛真誠的創作者


  最後，許鞍華導演聊到，在這個大環境中能夠靜下心來，花五、六個月跟演員和劇組拍這部片，對她而言是很感動的時刻。我說：「對觀眾來說，能夠靜下心來好好看三個小時的《黃金時代》，也是很感動的。」她則謙虛說：「謝謝台灣有好多觀眾很真誠地喜歡這部電影，我特別高興。」


  我是最後一個採訪的媒體，訪完後與導演合照留念。片商宣傳跟導演說今天行程結束了，只見她開心地主動和宣傳說，那我們也來拍合照紀念一下，還跟宣傳互加手機通訊軟體，導演不太會用手機，還問這要怎麼加帳號。一點都看不出來已經67歲的導演，怎麼還能夠這麼可愛。她是真誠對待每一位有機會和她一起共事的合作對象。這個場邊花絮便一直記在我的心中。在這個過於喧囂的年代，許鞍華導演真的是一位可愛真誠的創作者。



  --'
