title: '[好雷] 黃金時代/年少時代 兩個人的人生點滴'
content: '「黃金時代」描繪的是呼蘭河傳作者蕭紅傳奇的一生，和張愛玲一樣都會寫時代的情愛，

  但一個算是富有，而另外一個則是貧窮一生。


  導演用了好多半紀錄的口白讓蕭紅、蕭軍、和那些與他萍水相逢一場的文才作家們，從他

  們的片段的記憶、對蕭紅文章的理解又或是如旁觀者般的說書人，在永不復見蕭紅的他們

  自己後半生，去拼湊完整了她那大概10年中不平凡但卻短暫的後半生，是講一個蓋棺論定

  、眾人緬懷的歷史定論。


  「年少時代」講的是一個男孩從5歲到17歲，從孩提到高中畢業的一段平凡人生。


  愛在黎明破曉時的導演李察林克雷特花了12年的時間，拍攝了小男主角(當然還有其他演

  員)的成長故事，就像是一部縮時的電影，把12年的光陰用3小時的時間呈現在我們的面前

  ，應該是前所未見的方式，我們無法預期這個小男孩的下一分鐘會變成怎樣，會變成同性

  戀？成績會很好？能夠找到未來的方向；演他家人的那些演員們呢？老了，胖了？變成票

  房巨星？又或還是一樣默默無名。這是一部電影，更是一部似真似假紀錄片，在過去的每

  一刻，我們都成為了那個人，但在未來，仍是一場未知。



  還沒有了結的生命還須自己去獨自開創，三小時的電影，如同小男孩在17歲要離家上大學

  時問著伊森霍克：「所以你講這麼多，是要告訴我甚麼？」因為連伊森霍克也不知道，那

  1995年在維也納與Celine命定相遇的Jesse會在14年後一樣遭遇到了那些夫妻間難解的老

  掉牙爭執，只是都還是有機會的，只要下一刻，不是別人來回味拼湊我們一生的那一刻，

  甚麼都有可能。



  --'
