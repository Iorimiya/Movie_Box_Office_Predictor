url: https://www.ptt.cc/bbs/movie/M.1425867105.A.520.html
title: '[好雷] 許鞍華【黃金時代】'
content: "(文圖完整版：\n\n關於【黃金時代】，是許鞍華前所未有的大製作，不論是劇情、拍攝場景或攝影。\n\n【黃金時代】電影內容，是以認識蕭紅的人所為之陳述或紀錄加上蕭紅作品文字，\n\
  \n來堆砌蕭紅這個「人」。從而「黃金時代」，更像是文壇上紛擾騷動卻充滿生命力\n\n的民國初年。下文只針對編劇說說。\n\n\n****\n\n關於劇本(編劇)，【黃金時代】一方面歷史龐雜的資料(如許鞍華提過，二十年前\n\
  \n他就想拍蕭紅了，可是資料量太大，沒編劇想接)；另一方面試以特別的角度觀看\n\n歷史角色，至少我認為，劇本刻意使演員與真實人物間存在一絲疏離感，亦即不硬\n\
  \n要湯唯具體地像蕭紅，馮紹峰具體地像蕭軍，王志文具體地像魯迅(畢竟這不可能)\n\n，但卻又有些許倒影與親切之感。\n\n另編劇上捨棄一般時間線性陳述，使用「間離效果」將空間移轉與時間穿插交錯，\n\
  \n讓【黃金時代】不只是蕭紅一個人的黃金時代，而是蕭紅與民國初年文壇友人的黃\n\n金時代。\n\n****\n\n「間離效果」：理論發揚光大者為托爾特 布萊希特\
  \ (1898~1956)。\n\n疏離效果/ 陌生化效果/ 間離效果(Verfremdungseffekt)，這詞確立於1936年。易\n\n言之，就是使戲劇中的事件、動作與角色對觀者而言感到陌生、奇怪，而造成種「\n\
  \n距離感」，使觀眾在看戲的時候可以保持批判與客觀，讓觀眾知道，表演是現實的\n\n反映，而不是現實本身。方式有如，故意暴露舞台技術執行過程、讓演員對演出內\n\
  \n容進行評斷……避免觀眾情緒投入。但這並不表示觀眾從頭到尾都會被強制處於在\n\n客觀情境下，關鍵是藉由編劇者掌控審美距離，讓觀者時而融入時而脫出，在這不\n\
  \n斷進進出出中，形成共鳴與疏離的動態，進而建立觀念。\n\n*****\n\n就像【黃金時代】中，故意使蕭紅作家友人們，突然對著鏡頭開始講述對蕭紅的印\n\n\
  象及事件經過、老年蕭軍、端木的回憶錄字句節錄、事件片段交錯(片頭在講述幼年\n\n蕭紅時，突然跳到蕭軍與初次見面的蕭紅說：他媽在他六個月時就死了；表現蕭紅\n\n\
  與蕭軍同居初期情況時，跳到許廣平先生看蕭紅1935年出版的[商市街]，而感嘆蕭\n\n紅寫貧困是如此深刻……)，這手法模糊化當事人當下角色扮演的特定性，將時間事\n\
  \n件順序錯間，加上陳述者之「後見之明」，以類似相互辯證或資料對比方式，逼迫\n\n觀者跳出「蕭紅故事線」主軸之安排，以更全觀的視角看蕭紅、看民國初年文壇、\n\
  \n看歷史經過。\n\n\n****\n\n對人物傳電影來說，間離效果處理方式，實有助於使觀者脫離一廂情願地相信特定\n\n人之陳述，偶像化被敘述者\n\n另外，關錦鵬導演之[阮玲玉]，亦使用間離效果，惟方式係以演員這個人本身對阮\n\
  \n玲玉與其所扮演之角色，對應現今經驗進行評論陳述(舉例來說，飾演阮玲玉者為張\n\n曼玉，在播送阮玲玉一段事件後，會突然跳出張曼玉敘述阮玲玉所面臨的這件事與\n\
  \n我張曼玉所最近遇到的事有何交集與我的想法是如何)。一樣使觀者客觀清楚明白，\n\n我們可以對謎般的歷史事件進行評斷，面對類似之事件，歷史人物與我的抉擇間有\n\
  \n何不同，而進行一種跨時代的對話互動\n\n****\n\n本片敘述手法，是以空間遷徙為基調(像婁燁的[頤和園]、侯孝賢的[南國再見，南國])\n\n，更彰顯動亂下的流離失所。(該片僅在片頭提及生蕭紅死之年份，之後完全無時間提示)\n\
  \n蕭紅1911年，出生於，初中到讀，畢業後獨自向南逃婚到讀\n\n高中，因為沒有錢，就回並與蕭軍相遇。因為寫作內容有抗日之嫌而遭滿州國查緝\n\n，兩人遂向南逃至，之後又南渡，此時漸有名氣。在友人提議與想要離開蕭軍下\n\
  \n，東渡寫作，但又因蕭軍緣故而回。淞滬戰爭爆發，隨後西遷至。半年後北\n\n上至民族革命大學任教，同時與蕭軍分手，並向西移至續行創作。不久\n\n便答應端木蕻良的求婚，向南到端木家鄉結婚。後因戰事急迫，便向西到。復因\n\
  \n重慶仍不斷受日軍轟炸，便一路向南到達，於1942年病逝於該地。\n\n****\n\n其實，對於蕭紅真實人生如何，後人也只能從文書中撿取線索，其他的就自由心證\n\
  \n吧，像是蕭軍用冰塊割一截鞋帶給蕭紅繫鞋；蕭紅問魯迅：我這件衣服好看嗎；蕭\n\n紅在日本居所玩貓；蔣錫金責備蕭紅出手太闊氣等事。我想就只是製造一段氛圍吧！\n\
  \n將片段的回憶填補罷了。是故，意欲掌握這部電影任何細節以好好認識蕭紅這人，\n\n實在是野心太大了！\n\n****\n\n另一方面來看，先看蕭紅作品會對【黃金時代】有更好的理解嗎？答案自然是肯定的\n\
  \n，雖說不看蕭紅作品完全不影響劇情理解，但看完【黃金時代】後，確實深刻理解蕭\n\n紅的【呼蘭河傳】之所以能在近代中文文學中佔有一席重要位置的原因。\n\n\
  會推薦【黃金時代】嗎？肯定是推薦的，只是不會激動到把身邊所有人都推入這坑，\n\n畢竟片長178 min. 又不緊張刺激(認真)。但精緻的畫面，巨觀處理單一人物傳，分子\n\
  \n角色對著鏡頭另一側的「我」說話，丁玲精神地伸出手說：你好！ ，蕭紅在難堪時硬\n\n是找機會笑一笑，三小時什麼的完全不礙啊！此外，這是一部值得再看一次看的電影，\n\
  \n第二次觀看時，會體會編劇「間離效果」無所不在的深刻與巧妙。\n\n【黃金時代】是我看許鞍華導演的電影中，讓我第一次在劇終上卡司時依然有點難過\n\n精神狀態欠佳的持續坐在椅子上。所以，很謝謝他。\n\
  \n\n\n****\n最後亂入本片畫面用色構圖，許鞍華真的在【黃金時代】這部片突破到另一種境界\n\n(這根本就不是以往樸實的許鞍華阿！)，畫面與用色美到讓我覺得七千萬人民幣預\n\
  \n算完全值得(不是吧！)。優雅的對比色實在太逼人了。就做了一張「黃金時代色階」\n........\n\n\n--\n  ▃    ▃  ＿▂▄▃▄▆▇█▅▆█\n\
  ▎\n▍       \n▏         \n ||\n   ▕▕    \n\n--\n感謝樓上二位，已更正。(汗顏)"
