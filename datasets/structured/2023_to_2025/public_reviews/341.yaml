url: https://www.ptt.cc/bbs/movie/M.1426051543.A.6FE.html
title: '[好雷]無用之用－黃金時代 '
content: '第一次是在金馬影展看《黃金時代》的時候，過於驚訝於電影的敍事方式，花了大半時間

  在適應，過了三分之一以後，才比較能進入狀況。第二次看這部電影的感受很不一樣，不

  再花心力於適應敍事，劇情發展也已了然於心，所以注意到許多第一次看時沒有注意到的

  東西，像是畫面的安排、交錯的敍事、人物的動作等等。這一切細節，使我比第一次看時

  還感受到這部電影的精彩細膩。


  想起前幾天看到許鞍華在一個訪談裡說：「（電影《黃金時代》）以一個這樣長度的戲來

  講，比如長的戲都感覺好看，可是其實也沒什麼情節，為什麼綁鞋帶啊那些，不過就是比

  較長。可是一短呢，你就好像是一個偷懶的話外音解釋的東西了。所以應該多一點那個長

  的戲。然後你在那些對鏡頭講話的那些抽離一點，就明白了，你先投入你才能抽離嘛，如

  果你從頭到尾都是淡淡的，就無所謂抽離跟不抽離了，我感覺是這樣。」（引自張士達，

  〈專訪《黃金時代》許鞍華：「我覺得我以前拍戲太溫情了。」〉）那些長戲看起來沒有

  演什麼，卻充滿了吸引人的細節，使電影走出了一種節奏，先是讓人投入然後抽離，漸漸

  地我們觀眾會感受到整個時代和每一個角色之間的關係。


  忘了曾經在哪裡看到過，侯孝賢導演拍《海上花》的時候，阿城曾跟他說：「多找一些沒

  用的東西。」沒有用的東西多了，故事就真了。許導說的長戲的作用，也許就像阿城說「

  沒用的東西」的作用一樣，使故事變真、變活。那些好像也沒做什麼的長戲，默默地給每

  一個角色不一樣的形象，讓他們變得立體而真實。一個角色一個樣子，然後每個角色在整

  部片裡有一位子，都從某一個特定角度去陳述與觀看。


  不同於小說改編的電影，《黃金時代》透過那些戲和細節編織成了一部論文般的蕭紅傳，

  每一個角色都有身份、立場，所陳述的事實都是一個觀點，而最終展現出的不單是一個有

  血有肉、有性格有思想的蕭紅，也映射出她與同時代一群人的異與同：同的部分是，他們

  共處一個時代；異的是他們為不同目的創作。


  蕭紅的小說不針對他的時代各種的問題，而是從他的生活經驗裡提煉出來活生生的世界。

  她與同時代作家不同，也因此電影裡呈現她與所處的左翼文人圈的關係顯得特別的微妙。

  整個時代（特別是蕭紅所處的左翼人文圈）的趨勢是向著政治化、強調社會與革命、充滿

  批判戰鬥意識的小說。蕭紅的生活頗倚賴這一個文人圈，但在創作上卻與他們不同。她走

  她自己的路，而且為了好好地走，可以說是與蕭軍還有他的一票朋友們分了道，走上孤獨

  的創作道路。



  電影的最後把這樣一種後見之明的觀點呈現出來，以蕭紅自己的文字與同時代的編輯的訪

  談表達出「蕭紅的小說像是熬過嚴冬留下的永恆花朵」這樣一個觀點，呈現出時代問題與

  創作之間的關係。雖然當時有部分作家意識到蕭紅創作的獨立與真實，但整個時代的人都

  捲入時代政治和戰爭漩渦，使蕭紅的創作的價值直到那時代過去之後，才被重新發現。《

  黃金時代》結束在這個地方，彷彿訴說了一個現代人不太相信的道理：對時代無用的並不

  等於沒有價值，而有永恆價值的東西並一定為時代所重。我個人很喜歡這樣的結局，甚至

  以為這樣一種對純粹藝術的欣賞和追尋，還是有一些缺乏，無論是蕭紅的時代還是我們的

  時代。



  --


  這裡是我的樂園：




