title: '[普雷]黃金時代 '
content: '當下看很悶，看完後幾天卻會有些感慨的電影。




  網誌圖文版：


  在看這部電影之前並不知道內容是關於什麼，只是純粹聽過飾演兩蕭的湯唯與馮紹峰，加

  上海報拍得漂亮而已。結果一看之後不得了了，黃金時代的女主角是蕭紅，撰寫呼蘭河傳

  的蕭紅 (其實還是不知道是什麼，但其中賣麻花的情節，似乎是在以前的國文課本上有出

  現的)，總而言之，黃金時代就是滿清被推翻後，戰亂不斷的中國裡關於一群文采洋溢作

  家們的故事。本片長度長達將近三小時，表現的方式與傳統電影不太一樣，有點像是舞台

  劇，有點像是紀錄片，尤其是一開始蕭紅以黑白的畫面說自己死於三一歲，特別讓人印象

  深刻。不過由於是寫蕭紅的一生，雖然他也是近代非常傳奇的女作家了，但比起電影的劇

  情還是有點平淡，看的時候仍然覺得有些沉悶。不過在沉澱過後的幾天，電影裡的人物與

  個性突然栩栩如生地浮現在腦海裡，蕭紅的瀟灑、三郎的一見鍾情、端木的懦弱與勇敢，

  前一世紀的人物，好像又活過來了一樣。


  黃金時代是怎麼樣的一個時代呢? 這群流亡的東北作家們，或許各個都有不同的註解。想

  愛誰就愛誰，想去哪就去哪，想怎麼活就怎麼活，我對蕭紅的瀟灑與豪邁特別喜歡，兩次

  懷了孕，一次隨手招了船夫自己爬了下二樓跳上船，一次隨興花光身上僅剩的錢財請客，

  那種活在當下無所畏懼的感覺很和我的胃口，或許人就該像這樣，一無所有才能真正的享

  受當下。雖然是蕭紅的故事，但電影裡也敘述了不少其他近代文壇的作家，甚至連以前考

  試常常會出現在考題上的魯迅也出了場。黃金時代的故事連貫性與劇情不是這麼強，不過

  在於腳色的個性上描述得相當不錯，從場景、服裝到人物的一顰一笑，都可以感受到這些

  人物的存在。


  老實說，我在看電影的當下是有些不耐煩的，畢竟我自己的文學造詣不是挺厲害，對於當

  代的歷史背景也是一知半解，所以整部電影其實看得有些霧煞煞。這樣的題材配上這樣的

  表現方式，自然票房不好也是情有可原了。但儘管如此，黃金時代仍然讓我對那個年代的

  文人產生好奇，在戰亂的時代揮筆，究竟是什麼樣的感覺? 他們的文采與我們這時代的文

  青有所不同，後會無期裡的那種惆悵是比較虛無的；黃金時代的痛苦則是活生生的。兩個

  時代不能說誰好誰壞，只能說是不一樣的時代。


  蕭紅能寫出令人有所感動的小說文章，我想是可以預想的到的。文字這種東西憑空想像有

  其極限，要有其個性以及經歷才能寫出真正動人的東西。過年的時候有空應該會找生死場

  來看看，或許對於這部電影能有更多的想法。蕭紅的黃金時代過去了，那我們的黃金時代

  呢? 如果等到臨死前的一刻，才發現自己的黃金時代早已過去，或是根本沒有屬於自己的

  黃金時代，似乎也是相當可悲。


  --'
