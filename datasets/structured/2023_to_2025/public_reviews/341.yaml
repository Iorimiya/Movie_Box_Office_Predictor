title: '[有點悶雷] 黃金時代'
content: '先說結論，整部片的氣氛很悶，悶到一直看錶。

  但是為了看主角的後續，又忍不住看下去。


  蕭紅前一小段的事跡，在當時被認定是亂七八糟的女人；

  連家族都不恥與她為伍。

  後來與蕭軍天雷勾動地火後，開始有些色彩。


  劇中各式各樣的文人中，最令人印象深刻的就屬霸氣十足的魯迅吧。

  不過魯迅的台詞，就跟他文章的行文一模一樣，不知道實際上魯迅的

  說話方式是不是就那樣？總覺得有點做作。

  可是他不疾不徐的語氣，加上一針見血的觀點，又很有民初戰神的威儀。

  雖然沒跟周海嬰有很多互動，但幾句對白中似乎又可以感覺到"橫眉冷對

  千夫指，俯首甘為孺子牛"的情感。


  當時的知識份子真是多災多難的一群人。丁玲、聶紺弩、蕭軍、端木這些

  人，先被日本人整、後被國民黨整、最後還被至高理想的共產黨往死裡整

  ，真是超級諷刺。還不如做個吃飽睡睡飽吃的平民。


  習慣了好萊塢的電影節奏，蕭紅最後生死掙扎中的片段，才讓我開始有看

  "電影"的感覺了。


  另外，唐藝昕真的很正。


  --

  Sent from my 3310


  --'
