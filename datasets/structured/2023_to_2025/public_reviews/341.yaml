url: https://www.ptt.cc/bbs/movie/M.1416572719.A.176.html
title: '[極好雷] 黃金時代'
content: "網誌圖文版，滿滿的湯唯！\n\n\n 「我不能選擇怎麼生，怎麼死，但我能決定怎麼愛，怎麼活。這是我要的自由，我的黃\n金時代。」\n\n在看《黃金時代》之前已聽聞許多人認為太過沈悶，是部失敗作品，所以不抱任何期待的\n\
  捧著咖啡進入影廳觀賞。結果，我只能說，這是我從沒看過的許鞍華，也是我看過她的幾\n部作品以來最喜歡的一部！太好看了！簡直是藝術品。\n\n我能理解大夥討厭這部的原因，無非是過於沈悶、內容貧乏，看起來像是蕭紅一生的流水\n\
  帳等等。的確，前一小時的鋪陳有點緩慢，讓人抓不清楚這部片的重點為何。但蕭軍一出\n現，與蕭紅陷入熱戀以後，整部戲漸入佳境，重點也慢慢浮現，講的是蕭紅一生中那些影\n\
  響他甚深的男人與她的牽絆，包括汪恩甲、蕭軍、端木、駱賓基，甚至是文壇前輩魯迅。\n\n我特別欣賞整部片的敘事結構，基本上是照時序而發展的故事，但在期間很巧妙地穿插與\n\
  蕭紅相識的作家好友們的口述，大剌剌的對著鏡頭說著他們對蕭紅的看法與當時她的狀態\n。這種手法前所未見，以往傳記電影碰到紀實性的資訊都利用口白或是字幕帶過(例如一\n\
  代宗師)，從沒人敢如此刻意地打斷觀眾涉入的情況，用第三人稱角度拉開早已進入原先\n故事的情緒裡。\n\n這種相當實驗與前衛的作法的確需要一段時間適應，若無法適應便很容易在三個小時的片\n\
  場裡失神、打盹。另一個致命的特點是，這種手法讓整個故事充斥了疏離感，若無法一氣\n呵成的隨著劇情置身於主角觀點中，很難同情、憐憫甚至理解劇中人物。但這種疏離感我\n\
  認為是許鞍華刻意設計的手段，就是不讓觀眾完全單單沈溺於蕭紅一個人的觀點，而是以\n一個更恢宏的高度、更複雜的多方視角來參與蕭紅一生。這點實在創新，手法獨到而冒險\n\
  ，令人不得不欽佩。\n\n事實上，劇情推演到後半段，我們還是能清楚地了解到蕭軍與蕭紅兩人的感情遇到問題，\n蕭紅去了日本，原以為能讓雙方冷靜，但以旁觀者的角度來看都能了解，這只是逃避問題\n\
  。爾後，蕭紅隨著感情的破裂，戰事的吃緊，開始過著顛沛流離的後半生。這時，觀眾也\n會隨著蕭紅的遭遇而心生憐憫，隨之感動，先前的疏離感漸漸消去，但經過先前的多方視\n\
  角訓練，已培養了用更高視野看待蕭紅一生的角度，整部電影的格局就展現出來了。不過\n份沈溺、不刻意矯情，直接利用形式的轉變將《黃金時代》昇華到過去電影沒有達到的境\n\
  界，太不容易。\n\n然而，敘事結構不只是添加突如其來的其他角色對白。我想，編劇李檣為了不讓三個小時\n的蕭紅生平看來像是個平凡無奇的流水仗，試圖在過程中混亂了時序，這技巧對岸稱為「\n\
  閃回」。例如片尾從丁玲(郝蕾飾)的口中得知蕭紅過世，骨灰已灑在香港海中，下一幕畫\n面跳到蕭紅隨著蕭軍來到香港，進而遇見生命中最後一個男人駱賓基的故事。\n\n\
  這種先預告蕭紅死訊的方式，觀眾能先有個底，沉著地看待蕭紅生命中如何面對死亡的這\n段日子。雖然說，這種方式有可能混淆一般觀眾的時序概念，但我認為只要是從頭到尾認\n\
  真觀賞不致於會產生問題。反倒是透過這種技巧，使三小時的電影不會太過於理所當然與\n沈悶，個人很喜歡這種處理方式。\n\n關於蕭紅的故事也曾被改編成電影和舞台劇，但許鞍華在訪談中提到，她的《黃金時代》\n\
  是拍給大家看的，所以並不會刻意吊書袋或者是偏重蕭紅的某一面。也就是說，盡量還原\n歷史，劇中對白也都來自於各角色對蕭紅的真實回憶，故劇情通俗易懂，絕對是了解蕭紅\n\
  生平的入門作品。\n\n另一個傑出的技術環節就屬攝影。片長三個小時的時間裡，幾乎每一幕都像一幅畫，但這\n種美，並非《白日焰火》般的絢麗和不真實，反而是利用定鏡攝影專注於景框內的任何細\n\
  節，構圖之講究，足見攝影師王昱的用心。《黃金時代》有好幾個時候讓我想起王家衛電\n影中的攝影風格，美的像藝術品一般，很想好好保存。這屆金馬竟然沒有入圍最佳攝影，\n\
  有點說不過去。\n\n基本上，黃金時代就是蕭紅，那蕭紅等同於湯唯嗎？對於觀眾來說，若熟識湯唯的程度更\n勝蕭紅時，那要怎麼說服觀眾眼前的角色不是湯唯而是蕭紅呢？關於這點，我認為是本片\n\
  最大的問題所在。電影前半段，那個古靈精怪，單純又直接的她，很難擺脫過去湯唯的印\n象。還好到了後段，經過大時代的淬鍊，蕭紅內心想飛的欲望，先讓蕭軍像個鳥籠般囚禁\n\
  ，而後飛翔到一半時，又被戰火波及，折翼隕落。\n\n這個角色的內心複雜性從此顯現，也與前半段形成反差，這點湯唯便有抓住身為文人作家\n的氣質和那分被禁錮的落魄。舉例來說，蕭紅懷有身孕時投靠梅志(袁泉飾)，毅然地把剛\n\
  出生的孩子處理掉，臉上的怨恨和漠然都讓人理解這個孩子對她來說僅僅代表了蕭軍的影\n子，這一幕湯唯成功地傳達這個訊息給觀眾，可說是可圈可點。也讓人信服眼前的湯唯不\n\
  是在演戲，而是蕭紅本人了。\n\n但湯唯的演技並沒有在《黃金時代》中完全釋放，畢竟電影是一個時期一個時期的順序拍\n攝，又沒有足以讓觀眾印在腦海中的情緒爆發代表戲，這些都讓湯唯的演出打了折扣，這\n\
  話並非否認了湯唯的演技，而是受限於劇情裡，湯唯能發揮的空間不大，可惜了她的螢幕\n魅力。\n\n換個角度來想，湯唯的詮釋，儘管在後段顛沛流離中還是保有獨特的氣息，這個氣息反倒\n\
  合理化了這幾個男人對於蕭紅的癡戀。莫名拋棄她的汪恩甲不說，從蕭軍已降，包括端木\n蕻良和駱賓基，都是被蕭紅的文采給吸引，但電影裡強調寫作的場景不多，提及她著作內\n\
  容的時刻也很少，尤其在後期重病又流離失所時，很難說服觀眾這種悲慘的狀態還會有男\n人願意捨身照顧她、陪伴她身旁。\n\n幸好，湯唯美麗的外表和劇中後期呈現的嬌弱氣質有助於說服觀眾這點，我想，不要說是\n\
  劇中角色，就連底下的觀眾也都會對湯唯飾演的蕭紅感到同情，甚至是產生愛慕。可以說\n，湯唯出色的外表反而達到另一種效果，而這效果是成功的。\n\n《黃金時代》的大膽不由分說，完全顛覆過去傳記電影的敘事結構，穿插不同視角的小技\n\
  巧也讓人眼睛為之一亮。唯獨這樣的方式不一定能讓大眾接受，電影放映以來也受到很多\n批評，但我認為，唯有這樣處理，才能對得起蕭紅短暫卻又十足落寞的一生，「千秋萬歲\n\
  名，寂寞身後事」便是蕭紅一生的最佳註解。或許十年後、二十年後回過頭來看，我們不\n一定會記得《桃姐》、《天水圍的日與夜》，但一定會想起許鞍華曾經拍過如此獨一無二\n\
  的《黃金時代》。\n\n--\n我的電影部落格\n\n\n--"
