title: '[好雷] 黃金時代'
content: '圖文好讀劇情版：


  《黃金時代》是個令我相當驚豔的故事。


  整體而論，許鞍華導演為蕭紅這個傳記故事，

  以類紀錄片的方式透過各種第三人稱來訴說，

  相對客觀地讓觀眾了解到蕭紅這樣的一個人物。

  一個一個的說法，加上湯唯的詮釋，

  逐漸堆疊起蕭紅這麼一個人物，一個真實存在過的作家。

  呈現方式相當大膽，劇本與拍攝都可見其細膩之處。


  老實說在此之前，我並未聽聞過蕭紅這位作家，

  但經由電影，我會想更深入的閱讀蕭紅的作品，

  我想這就是許鞍華導演說故事成功之處。

  片長將近三個鐘頭的傳記電影應該可以說是漫長了吧，

  但導演不以時間軸來訴說故事，跳躍訴說著關於蕭紅的點滴，

  看似混亂卻也不會讓觀眾沒了頭緒，

  觀影後，那餘韻逐漸令人感到漫長縈繞。


  ===以下有小涉劇情，請慎入囉===







  關於蕭紅生命裡幾個重要的男人，

  我想汪恩甲、蕭軍、端木、駱賓基肯定都置身其中，

  而討論中，也早已經不乏對這四個人之於蕭紅的影響了。

  那麼，我就來說說蕭紅的爺爺和魯迅吧。


  故事的前後呼應了蕭紅的爺爺，

  前串起生，後串起死。

  爺爺說「快快長大，長大就好了」，

  卻未料，蕭紅長大後卻是豐盈顛沛的一生，

  但就一個才華飽滿的作家而言，

  仍舊可以說是璀璨輝煌的經典。

  一如蕭紅曾說的「這是我的自由，我的黃金時代」。


  而魯迅，對於蕭紅來說，除了伯樂和知音外，

  我猜想也是個引領著自己的長者吧。

  蕭紅因為蕭軍的感情動盪而痛苦時，

  最終是魯迅給了他一扇前往日本的窗，

  雖然二蕭間的問題並未因此而解，

  但這趟日本行，對於蕭紅的思維卻仍有著啟發和改變。

  因此魯迅的死亡，對蕭紅打擊甚大，

  面對死亡，知道是知道，遇到了還是不一樣。

  小時候的蕭紅，面對爺爺的死亡時仍懵懵懂懂，

  但這回，魯迅的死，才是她真正面對死亡的時候。



  我很喜歡劇中蕭紅說的幾段話，她似乎是這樣說的，

  「我們每個人都是隱姓埋名的人，他們的真面目，我們都不知道。」

  「若干年後，我不知道我的那些作品還有沒有人讀，

  但是我知道我的緋聞將永遠流傳。」

  「筋骨要是疼得厲害了，皮膚流點血也就麻木不覺了。」


  電影所讓我們感受到的蕭紅，對於自己的感情並不特地多言，

  但這些感情中的牽引與力道，卻深刻的鑿在作品裡和言談的字裡行間。

  那些淺白的字句，讀著讀著，彷彿我們也漸漸懂了蕭紅，

  那屬於她的愛情、屬於她的時代背景、屬於她的生活。



  湯唯詮釋的蕭紅，帶著漂泊與滄桑的文人氣質，

  任性、倔強，受限於大環境與另一半，但仍始終保有心和寫作的自由。

  詮釋得相當不錯，但卻因為電影敘事手法的跳轉，

  讓許多事件情緒難以醞釀到一個飽滿，

  但我想這就不太是湯唯本身的問題了。

  不過，挑戰這樣一個敘事手法，總是有點相對犧牲是不難理解的。


  婚姻的選擇上，

  蕭紅面對反差極大的蕭軍和端木，最終和端木結婚，

  或許就是端木彌補了蕭軍所不能給予的那一塊，

  而端木的懦弱與堅強，我想終歸只有蕭紅能說出見解。

  可二蕭間的緣分糾結，卻也看出兩人對彼此的吸引和愛慕，

  只是或許，往往最愛的那一個，不見得是最合適的那個人。

  即便如此，我仍認為，二蕭間的愛情是命中注定的。


  《黃金時代》推薦給喜歡看傳記故事的朋友，

  也推薦給喜歡文學的朋友，相信是不會令您失望的。

  但如果對於紀錄片或者跳躍敘事非常排斥的朋友，

  建議就別花三個鐘頭進電影院看囉～



  圖文好讀劇情版：


  --

  電影、文字、攝影、生活




  --'
