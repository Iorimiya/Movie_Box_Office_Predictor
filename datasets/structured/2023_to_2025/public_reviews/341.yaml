url: https://www.ptt.cc/bbs/movie/M.1541497565.A.F9B.html
title: '[極好雷]敬那美好搖滾黃金時代-波希米亞狂想曲'
content: "雷文防雷資訊頁\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n1.影片名稱\
  \ :波希米亞狂想曲\n\n2.觀影時間 :11/4\n\n3.觀影地點 :高雄環球影城\n\n4.觀影方式 : 自行購票\n\n§其他防雷說明(非必要) :只要你對搖滾有喜愛之心,就算不認識他們,沒聽過他們的歌!\n\
  \                        也很爽!!!!\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  此區為發文防雷頁\n可選擇性提供上列 1~4 資訊  或不提供亦可\n觀影心得於分隔線下方發布即可\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線\
  \ ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n假日的高雄電影院大概有將近一半的滿客率,其中有些是約莫國一國二的年輕人,真的有點好奇,這個年紀的小朋友怎麼會對這個80年代的樂團有興趣?\n\
  影片主要是以Freddie Mercury為主,我想如果這片名改成一個巨星的誕生應該也不為過\n故事從佛萊迪的家庭背景開始,一路介紹他們成軍,爆紅,如果對資深歌迷來講的話,這邊被草草帶過應該會稍嫌不夠精彩\n\
  電影的重點幾乎是放在中後段,佛萊迪與樂團失和,沉淪到最後重新振作的部分!對電影來講這個應該也會是比較可以引起大眾共鳴的部分吧!!\n\n其實我不算QUEEN的歌迷,對他們的歌也只聽過最有名的《We\
  \ Will Rock You》《We are the Champions》甚至我連佛萊迪是雙性戀也不知道(囧)\n但是在整部片之中,非常享受他在劇情的鋪陳,讓我更了解這樣的人是如何組成享譽國際的樂團\n\
  雖然對其他團員的描述比較少,但是電影中還是有帶到一些團員的相處,以及知名歌曲創作的過程\n讓對他們歌曲即使不熟也能夠很快融入,甚至在片尾後的演唱會都快要可以熱血激昂的一起唱出來\n\
  我想作為一部關於QUEEN的商業電影這樣算是很成功的了!!\n\n在電影中描述的佛萊迪,其實是很孤獨的,但是他何其幸運能遇到一個超越愛情的親密友人!!\n一如電影中演的,就算知道他是HIV的患者,依然毫不避諱接受他擁抱他的團員,我想這是非常不容易的!!\n\
  但或許也正是因為這樣的孤獨卻又溫暖的感覺,讓佛萊迪帶給我們的歌聲,如此的深刻又感人!!\n完全不愧80年代經典樂團的名聲!!\n\n電影的選角也真的很強,每個團員的長相相似度極高!!簡直就像是真的團員穿越時空到布幕前演給你看的一樣!!\n\
  尤其最後的Live Aid根本是經典HD重現!!光是這一畫面就值回票價了~!!!\n\n對我僅僅能抓住90年代尾巴的搖滾歲月,這部片所描述的黃金搖滾日子真的很嚮往,現在像片頭佛萊迪去看樂團表演的吧,也幾乎快不存在了\n\
  那相信著只要組樂團跟團員一起就能征服世界的美好夢想\n謝謝這部片讓我看到!!!!\n\n「I consider it a challenge before the\
  \ whole human race\nAnd I ain't gonna lose\n(And I need just go on and on, and on,\
  \ and on)」\n\n－We Are The Champions\n\n--\n感謝指正已修改~Freddie真的很像魔性同性戀啊~!!!帥慘了>////<!!"
