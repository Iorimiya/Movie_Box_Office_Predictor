url: https://www.ptt.cc/bbs/movie/M.1425865297.A.848.html
title: '[雷] 【黃金時代】與【蕭紅】'
content: "以下是稍微暴雷郭建起的【蕭紅】與許鞍華的【黃金時代】，這兩部電影。\n但以【蕭紅】為主要論述對象。\n\n文圖完整版：\n\n======================================\n\
  \n郭建起導演之【蕭紅】(2013) 如題就是關於蕭紅的電影，但更精確言之係「蕭紅與生命\n\n中四個男人的故事」。這部片在中國國內得了不少獎(像是金雞獎最家女主角，同年競賽\n\
  \n者還有[一代宗師]章子怡 冏...)\n\n看完後的感想是，沒有很好看但也不至於會看到一半就關掉或瘋狂快轉。\n\n****\n\n該片以編年體為傳記陳述方式，讓病危的蕭紅說自己的故事給駱賓基聽，中間插敘論述者\n\
  \n的時空，讓回憶不至於無聊也好開新話題，是一般的回憶錄電影......但關於第一任同居\n\n男友汪恩甲與蕭紅家庭狀況確實有比【黃金時代】(2014年，許鞍華)\
  \ 有較多的描述。\n\n【蕭紅】片中的蕭紅就是個市井上充滿緋聞的女作家，這樣說好了，就是某位女子總是遇\n\n不到好男人，不斷被拋棄與被外遇，技能只有寫文章、煮飯和被小三吃得死死的，而他的\n\
  \n名字剛好是蕭紅。\n\n****\n\n這部電影忽略蕭紅於文學上之地位，流於一般愛情電影，僅存的文藝大概就是角色是作家\n\n吧，還有不斷提醒觀眾「蕭紅是作家」這事……\
  \ 就像林徽音被搞到只被大部分人曉得他\n\n和徐志摩是一組的，而忘了或不知他其實是位挺有名氣的詩人、作家，而令人深感可惜！\n\n遂引用【黃金時代】中，蕭紅所述，來呼【蕭紅】巴掌：\n\
  \n\n****\n\n從電影海報開始，【蕭紅】其實是神怪片(點菸)。\n\n\n\n關於選角，【蕭紅】的演員盡量貼近角色原型。飾演蕭紅的宋佳，恩……樣子真的有比較\n\
  \n像蕭紅這人，但總少了蕭紅的精神與靈魂。\n\n\n選角化妝，蕭紅長這樣其實還滿像本人的，但會突然變成別人.......\n\n\n\n\n一定要說，全片裡最不像原型人物的就是駱賓基(張博\
  \ 飾)，這小哥帥到犯規阿！\n\n\n****\n\n關於畫面用色基調，【黃金時代】與【蕭紅】在此即有明顯不同。我想，這還是與導演想\n\n要呈現出什麼氛圍有關，這麼說好了，蕭紅一生坎坷艱辛，【蕭紅】電影，是真的很辛苦\n\
  \n很艱困，如同大風雨中的芒草隨時會被吹起沖走。但【黃金時代】呈現的蕭紅與大環境是\n\n辛苦中帶有笑聲與繼續進行生命的動力，雖然芒草很脆弱，但至少還有同伴為他撐起一把\n\
  \n金黃色的傘，傘被吹斷還是會自己想辦法度過。\n\n因此，悲劇的【蕭紅】以灰黑色為主要畫面顏色；而有點正面的【黃金時代】以黃金色為\n\n主。我想，用色與「蕭紅」的個性多少存在著關連性吧！\n\
  \n****\n\n「兩位」蕭紅同樣經歷一場哈爾冰做大水的災難，但在色調、人物編排、配樂卻迥然不同\n\n。【黃金時代】黃色的泥水與藍色的牆面招牌形成鮮明對比，高亮度與黃色泥水讓情境看\n\
  \n起來有精神許多，還有兩個屁孩在開心玩潑水......而【蕭紅】就是慘澹的淹大水悲劇，\n\n飄著菜葉垃圾的混濁汙泥，與灰暗的天空......\n\n\n****\n\
  \n同是在淹大水時要趁亂逃離東興順旅館，「兩位」蕭紅所採取的步驟完全不同......\n\n\n****\n\n同樣是樹葉，【黃金時代】的亮到眼睛要瞎了；【蕭紅】的卻顯得髒髒的......\n\
  \n\n****\n同樣的蕭紅與端木蕻良婚禮，可以看出兩部電影的編劇是如何看待端木蕻良這男人，\n\n蕭紅的結婚致詞都一樣：\n\n\n\n但【黃金時代】的端木就是一負要靠著蕭紅生活的害羞懦弱樣子，搞得結婚致詞才會由蕭\n\
  \n紅說，說：「對端木蕻良沒有什麼過高的要求」，還有點心酸，結果端木就轉過身哭起\n\n來了...；至於【蕭紅】的端木卻很有自信很可靠的微笑著，使得蕭紅不要求端木云\n\
  \n云顯得不搭。\n\n\n****\n\n最後來說說【蕭紅】幾個很神秘的片段，我也不太清處到底發生什麼事......\n\n安安，有事嗎？\n\n\n蕭紅與蕭軍經濟情況變好後的.....哈爾濱光觀宣傳片?\n\
  \n\n蕭軍與蕭紅兩人都沒工作，好不容易有麵包吃，蕭紅在沾麵包用的鹽上......畫愛心\n(這蕭紅超級少女心阿)。\n\n反觀【黃金時代】的蕭軍與蕭紅倒像餓死鬼一樣。\n\
  \n\n****\n\n總的來說，偏好淒美愛情故事、第三者不斷亂入的刺激情節，或對人臉辨識技能不佳的同\n\n學們，可以看看【蕭紅】。但看完後請勿將劇中蕭紅的印象施加於真的的蕭紅身上。相較\n\
  \n之下，【黃金時代】似乎太龐雜太包山包海了，但我寧願相信這位蕭紅的主業是作家而非\n\n主婦。\n\n--\n  ▃    ▃  ＿▂▄▃▄▆▇█▅▆█\n\
  ▎\n▍       \n▏         \n ||\n   ▕▕    \n\n--"
