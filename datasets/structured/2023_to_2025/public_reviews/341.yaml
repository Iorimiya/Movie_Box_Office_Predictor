content: '《黃金時代》限時免費看：

  (《愛奇藝》台灣站11/5當天《黃金時代》限時免費看。)

  ●第51屆金馬獎最佳導演許鞍華得獎作品

  ●湯唯演技爆發成功詮釋民國四大才女之一蕭紅傳奇一生


  簡介：民國四大才女之一蕭紅 (湯唯 飾)，一生短暫卻好比波瀾壯闊，她經歷了痛切心扉

  的愛情、翻天覆地的時局，擁有過似有還無的理想、掌握以外的宿命。蕭紅生於哈爾濱

  ，因抗拒父親逼婚而展開顛沛流離的一生。


  蕭紅邂逅了文人蕭軍，跟著他，與一幫北方文人相識相知。後來，蕭紅的才華得到魯迅

  的賞識，主動為她寫序，幫她出版作品，令二蕭成為當時文壇的一對璧人。但好景不長

  ，二蕭感情出現裂痕，讓蕭紅再次踏上漂泊之路。


  但無論環境多窘困無論身處何地，蕭紅從未放棄過寫作，在戰火紛飛裡，由哈爾濱、重

  慶、武漢一路南下來到了香港，她仍拖著病重的身體完成了名作《呼蘭河傳》，以愛為

  名、不斷叛逆和出走，最終客死香港，結束了僅31歲的短暫一生。


