url: https://www.ptt.cc/bbs/movie/M.1481820502.A.C5B.html
title: '[好雷] 樂來越愛你：重返好萊塢歌舞黃金時代'
content: '原文連結：



  《樂來越愛你》(La La Land,2016)是一部向40''s、50''s風華正茂的好萊塢歌舞片(諸如《

  花都舞影》、《萬花嬉春》)黃金時代致意的浪漫歌舞片，在回望的同時也烙印作者的印

  記，導演是《進擊的鼓手》達米恩查澤雷(Damien Chazelle)，本身就是狂熱音樂愛好者

  的他，為電影注入了如綿密鼓點般的律動節奏與磅礡氣勢，之所以扣人心弦的關鍵無關形

  式與片型，源自於導演對音樂及電影的一往情深，導演在訪談時曾說希望讓這部電影有史

  詩(Epic)感，毫無疑問他做到了。



  La La Land是洛杉磯的別名，有虛幻之地(幻境)的意思。從正面表述來說，也就是有種教

  人興奮到飄飄然、踏不著地的魔幻感(無怪乎會有在天文台內星空飛舞的戲了)，影像充滿

  飽和感的色調、使人物好似生活在油畫背景中。其實本片與其說聚焦在愛情的主題上，不

  如說核心是關於兩位主角的星海浮沉記。故事以冬春夏冬四季作為章節，Sebastian(雷恩

  葛斯林Ryan Gosling)的不羈性格，從他在恰逢耶誕假期的餐廳，不應景的彈奏新年快樂

  歌曲便可見一斑；Mia(艾瑪史東Emma Stone)則是屢敗屢戰的試鏡小咖演員，兩人有各自

  的孤獨與焦慮—Sebastian的孤獨來自於爵士樂本格派的日暮西山、不被年輕聽眾所擁抱(

  Mia說爵士是像Kenny G這樣的情境音樂嗎？)，彷彿聽見他內心的不甘願地吶喊：「這分

  明是種變化無窮又自由刺激的音樂呀！」。Mia的焦慮，來自於試鏡的女演員不少人與自

  己長得相像、卻是更漂亮的進化升級版，她深恐淹沒在茫茫星海中，所以獨角戲很自然地

  成為她尋覓與證明自我的形式，而他們的共同點在於不放棄初心。



  Sebastian後來接受邀請成為流行樂團的鍵盤手，會讓這決定不顯得突兀的，是來自於Mia

  和母親的電話對話。因為巡迴，他開始有穩定收入，同樣也因為巡迴，分隔兩地的兩人產

  生鴻溝。Sebastian想給Mia的生日驚喜演變成因關愛而起的衝突對話。


  「難道妳不喜歡我們的音樂嗎？」


  「我喜歡。但你真的喜歡嗎﹖」


  「至少我終於被人喜歡。」


  「你難道只想被人喜歡嗎？」


  「哈﹗妳是演員呀！妳說這！」


  她在意、心疼他的夢想，她知道他並不真正的樂在其中。他也在意她的夢想，只憑著圖書

  館的關鍵字就找到她老家轉告試鏡。他們都是彼此夢想的一部分，只可惜在各自追逐的道

  路上終究走上了離別的分岔路口。也因為如此，從Mia之口說出的「I will always love

  you.」那糾結又釋然並存的微妙表情才使人低迴不已(這是同一句台詞中，個人看過表情

  聲音最動人深刻的，光是這幕我就認為Emma Stone是奧斯卡影后的有力角逐者)。



  五年後，Sebastian回歸初心開了爵士吧、Mia成了大紅大紫的當紅女星也步入婚姻，這樣

  的相逢戲很難不想到《秋水伊人》，但那段神來一筆的剪接，可以說是更加圓滿與悵然(

  端看用什麼角度去看待)，可以看成男女主角在重逢前腦海中各自排練過無數次的「如果

  …當初」的假想未來、也可當成是編導用平行時空來填補角色/觀眾遺憾的溫柔。至於Mia

  那回眸一笑和Sebastian還以的一抹微笑，有懷念、有祝福、有遺憾，更重要的是，都替

  彼此感到驕傲。


  --

  我同意你說的，這部我覺得導演是真的對歌舞片有愛才拍的出來，所以感染力很強。導演

  在《進擊的鼓手》打出名號前，第一部長片也是跟音樂有關。'
