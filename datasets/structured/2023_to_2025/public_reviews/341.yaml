url: https://www.ptt.cc/bbs/movie/M.1562660833.A.DCC.html
title: '[新聞] 昆汀:好萊塢電影明星的黃金時代'
content: '新聞來源：


  為了他的新片，傳聞布萊德彼特、李奧納多狄卡皮歐兩大天王不惜降價，破天荒首次攜手

  演出《從前，有個好萊塢》。這是大導演昆汀塔倫提諾的第九部長片，也是他最私密、情

  感最濃厚的一部作品。

  訪問的前一天，電影公司特別把來自全球各地的記者飛到洛杉磯，只為了搶先目睹八分鐘

  的電影片花。當時是五月初，電影才剛剪接完成，昆汀還沒有率領三位主要演員，布萊德

  彼特、李奧納多狄卡皮歐和瑪格羅比踏上坎城紅毯。對於保密到家的內容，每個人都充滿

  好奇心。但是看完電影片花，只感到一頭霧水。因為跟早先曝光的前導預告，幾乎沒有甚

  麼差別。不同的是出現更多六十年代的洛杉磯場景，更多的演員，如艾爾帕西諾、達柯塔

  芬妮、以及日前過世的路克派瑞。

  一如以往，眾星雲集的大牌卡司，昆汀再次吊足大家的胃口。開拍之前，不少報導指出這

  是昆汀十年來寫過最棒的劇本，讓電影更加備受矚目。《從前，有個好萊塢》時空背景設

  在1969年的好萊塢，故事關於一位過氣的電視明星瑞克達爾頓(李奧納多飾演)與他長期合

  作的替身搭檔克里夫布茲 (布萊德彼特飾演)兩個人如何在娛樂圈浮沉打滾，努力為日落

  西山的事業做最後一擊；而此時瑞克的隔壁鄰居、年輕貌美被視為明日之星的莎朗蒂(瑪

  格羅比飾演)卻突然慘遭曼森家族殺害。

  「總而言之，這是一個『愛的故事』，是昆汀寫給好萊塢的一封情書。」與昆汀合作長達

  25年的製片香儂麥金塔(Shannon McIntosh)，為電影下了一個耐人尋味的註解。


  --'
