url: https://www.ptt.cc/bbs/movie/M.1503842186.A.954.html
title: '[情報] 黑澤明《亂》4K數位修復版 9/29上映'
content: '角川官網




  日本由角川發行 4/1上映，

  台灣由ifilm傳影互動代理，9/29上映。




  久經沙場的老將也終將卸甲歸田，一文字秀虎在七十歲這一年宣佈退位，由長子接任家督

  重職，卻引發三子強烈反彈，遭父親逐出家門。秀虎本以為可以就此安享天年，沒想到一

  件件手足相殘的事件，讓一文字家陷入殺聲震耳的連天烽火。


  《亂》是黑澤明晚年的代表作品，以莎翁悲劇《李爾王》為骨幹，再融入戰國大名毛利元

  就的「三矢之訓」逸聞，從中捏塑出歷史上所不存在的架空武將一文字秀虎， 亦是導演

  自身的投射。影片獲得了英國影藝學院最佳外語片及奧斯卡最佳服裝設計獎。


  --

  今天上午在誠品電影院的場次

  算是首映吧，跑去看了，很讚


  --'
