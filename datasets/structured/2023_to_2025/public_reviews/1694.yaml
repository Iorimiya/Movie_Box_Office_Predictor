url: https://www.ptt.cc/bbs/movie/M.1499192060.A.F40.html
title: '[好雷] 北影 薔薇的葬禮 4K數位修復版'
content: "薔薇的葬禮\n\n日本新浪潮導演先驅－松本俊夫\n首部的劇情長片\n極具實驗性風格的前衛電影\n同時也是日本同志電影的先鋒之作\n\n在電影前段\n\
  我一直想拼湊出故事\n但內容真的太破碎了\n根本就難以看清楚劇情的完貌\n然而在劇中角色的一串對話後\n『你看得懂你們拍的(藝術)電影嗎？』\n角色/演員 笑說『看不懂啊~』\n\
  我才明白了些什麼(笑)\n\n然後看到電影當中\n快轉動作/畫面 搭配上音樂\n我驚覺原來庫柏力克\n也被這部作品影響之深\n***\n前衛的電影語言\n刻意誇張的表演演出\n\
  精彩的攝影機運動\n大量實驗性的電影畫面\n毫無頭緒的蒙太奇剪接\n\n電影故意破壞傳統的敘事結構\n以跳躍的非線性剪輯\n在過往童年、現實與電影拍攝間交錯\n\
  透過拍攝電影的後設\n增強幻夢與現實的理想殘酷\n\n由面具道出『人』的雙面性\n我們所愛與憎恨的\n有沒有可能就只是他人的面具？\n\n也點出自我認同不過是在尋求集體意識的悲哀\n\
  生而為人\n難道只能在他人眼光下乞求認同嗎？\n***\n電影中不斷出現的 伊底帕斯王 海報\n也漸接地暗示了他的伊底帕斯情節\n而男主角(同志)在未來的憤怒弒母\n\
  也延伸出(同志)對女體的迷戀卻也恐懼\n\n在男主角父親發現自己\n愛上的女人居然是他的親身兒子(同志)\n便選擇了自刎\n那這邊他難以接受的究竟是身理(身體)亂倫\n\
  還是心理(親屬)上的?\n\n男主角驚見自刎的父親\n難掩悲痛\n拿起了一旁染著父親鮮血的刀子\n而全片最為驚悚的莫過於這刻\n導演毫不遮掩的拍下他將利刃刺入眼球的畫面\n\
  頓時血漿狂噴\n\n雙眼皆殘的他蹣跚的走向大街\n(不得不提 電影中出現的兩場階梯戲都拍的好極了!)\n但此時的路人卻都投已異樣、冷漠、嘲笑的眼光\n指出現代社會對異己(同志)的不包容、排斥\n\
  \n看不見的雙眼\n沒有未來的明天\n\n***\n而在電影最後導演親自出現的解說\n才是把後設與Film on Film玩到極致的表現！\n也是對現實殘酷與作品風格兩者的自我解嘲吧\n\
  \n【個人的精神\n   必須透過不斷的否定\n   才能真正的達到自我】\n《2017台北電影節 中山堂》\n\n--"
