  #20大韓國經典電影\n#韓國影史百大電影\n#大鐘獎最佳影片等五項大獎\n#坎城影展導演雙週入選影片\n\n資料來源：甲上娛樂粉絲專頁\n\n--\n期待\n\
  感覺演的地方好少QQ\n幫QQ\n忠孝國賓復業後都排主流片了"
