url: https://www.ptt.cc/bbs/movie/M.1762100462.A.549.html
title: '[好雷] 地獄新娘 4K數位修復版'
content: "這部應該是不用防雷了吧XDDD\n\n\n\n\n\n\n\n\n\n\n\n\n\n之前就滿喜歡這部的氛圍,\n有機會在大螢幕再看一次當然毫不猶豫進場XD\n\
  \n4K修復畫質不錯,\n連Victor/Victoria臉上的棉絮都看得很清楚(欸\n(當年看的時候年代有點久遠..我記得是看不出棉絮XD)\n\n當年看的時候覺得結局有點小遺憾,\n\
  不過這次看完想想也許正是這個結局讓Emily的角色更飽滿,\n這部也才會這麼好看吧.\n\nBGM不用說, 經典.\n主題曲, \"Tears to Shed\"\
  , 四手聯彈那段都很棒,\n\"Remains of the Day\"還常常被拿出來做成梗圖XD\n\n陽間的灰白色調對比陰間的五彩繽紛,\n只能說活著真是太沉重了...\n\
  \n\n\n這次仔細看其實也有發現有幾個地方動起來不夠自然:\n\n像是使用烏克蘭鬧鬼(Ukrainian Haunting Spell)短期旅行回來大吵一架之後,\n\
  Emily要走回去她的床唱\"Tears to Shed\"那段,\n走路的動作看得出來缺了幾個frame.\n\n還有Emily最後走到教堂門口丟完捧花,\n\
  準備要變成蝴蝶之前那段婚紗的飄動也看得出來缺了幾禎.\n\n不如說其他部份其實都很流暢以定格動畫來講滿難得的($$$$$)\n(查了一下 去年的蝸牛少女回憶錄預算\
  \ $4.5m, 這部$40m\n 流暢度差很多 補禎的代價真的高$$$$ 也許最近的AI補禎有機會降低成本?)\n\n\n這部片長77分鐘,\n不過把故事講得很完整.\n\
  人物交代都很清楚,\n劇本雖然淺顯易懂,\n但也很能令人共鳴.\n\n不知道是不是我的錯覺,\n最近幾年似乎越來越少這種短小精悍的片了.\n片長拉到接近3小時,\n\
  故事卻沒有更令人感動 看完只覺得發散XD\n\n--"
