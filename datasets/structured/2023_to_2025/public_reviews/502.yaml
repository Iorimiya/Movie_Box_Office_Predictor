content: '我真的沒辦法理解那些用富豪看不起主角來合理化主角行為的人


  主角真那麼屌那麼有理念 倒是可以自己找投資人蓋他的集中營啊 而不是偷渡理念到別人

  用來紀念老媽的建築

  在我看來這些人就是當乞丐還最大聲


  以當時的背景 富豪願意在你被堂哥掃地出門後用人脈幫你把老婆姪女搞到美國 這恩惠不

  夠大嗎?


  這邊當然不是說有人對你略施小惠 你就應該任對方予取予求 但也不該恩將仇報吧

  但在資本社會下 富豪給你麵包也幫你找回愛情 這到底還有什麼好不知足的啊?


  最後那段什麼重點不是過程而是要看目的

  今天猶太人站在資本的最高點掌控世界怎麼還能說出這種噁心到極點的話




