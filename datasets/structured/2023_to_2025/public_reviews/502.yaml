url: https://www.ptt.cc/bbs/movie/M.1742141549.A.E3E.html
title: '[  雷] 粗獷派建築師'
content: "第一次發文 格式有錯還請指教\n \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  有雷\n \n \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n 想討論強O的部分\n\
  \ \n 業主自己有開玩笑提過自己沒什麼文化，所以很仰慕主角（非性意味）。\n這個很常見於暴發戶在金錢上不虞匱乏後，急於補足自己的文化底蘊，而最快的就是結交設\n\
  計師，因為他們總歸是要賺錢的，不只教你有深度的生活方式，至少明面上還會捧著你。\n \n我自己是讀室內設計的，就有聽過幾個設計老師炫耀某某業主的什麼品味是自己教的，其中\n\
  包含品酒、藝術等等。\n電影對設計師和業主之間的關係描寫，某部分來說有點寫實。\n設計師無論有意無意，會讓人覺得很秋，因為他們要讓人信服自己可以為人帶來更好的生活\n\
  或品味，這也是業主們願意掏錢的其中一個原因，好像付了錢你就能超越這層優越感了。\n（這是我個人的看法不代表其他設計人，我也已經離開設計業了，請不要為難你們的設計師\n\
  。）\n \n業主跟設計師的關係常常不太平等，說白了點，設計是商業行為，這意味著就算有好的想法\n也需要金錢支撐。\n另外電影裡也有提到這些美國白人還是有點歧視在。所以追根究底，電影裡的業主根本看不\n\
  起主角，至少需要確保主角低他這個階層一等。\n \n那個年代 美國沒什麼底蘊但有錢，業主本人也是自卑又自傲。\n主角帶著業主到義大利，也可以說相較於業主，那邊更像是主角的地盤，他們說著自己不懂\n\
  的語言，襯著自己像個文盲，這個他得勢後急於擺脫的沒文化的感覺捲土重來。\n明明自己才是業主，但在這邊卻說不上話，主角也沒有把所有話翻譯成英文，業主這邊也有\n\
  可能腦補過多，自己內耗。\n業主在採石場時把臉貼上去那邊讓我整個覺得這傢伙真的是很裝喔，那邊粉塵很多，也還沒\n打磨，用手摸摸還行，用臉貼上去就太矯揉造作了。我在想這邊有沒有可能是其實在表達業\n\
  主根本看不懂卡拉拉的美，所以在強撐？\n \n看到主角在舞池裡如魚得水，而自己格格不入，自卑感爆發，偏偏自己人生地不熟，連回住\n處也只能依靠主角這個自己心裡看不起的人。\n\
  所以看到主角頹頹在路邊的樣子就想著教訓他一頓，口頭上說了些冠冕堂皇的屁話然後就開\n幹了。\n前面也有老鴇問要不要讓男性服務主角、主角和其他男性過從甚密的畫面，可能也有點暗示\n\
  主角要馬雙性戀要馬是同志天菜，當然無論如何這都不該是強暴的理由，但我這樣想的同時\n，也想起業主在強暴前有提到的受害者有罪論，所以猜業主強暴的理由：\n \n\
  1. 因為主角是弱勢——窮+寄人籬下+當時真的無力反抗+太醉了可能是後不記得或不敢揭露\n \n \n2. 挑戰他的權威——設計師對成本的抗拒（業主不懂高度和建材，所以會被解釋成\
  \ 因為自\n己不懂的原因要花大錢）+在義大利感受到的地位反轉\n \n3. 主角很辣（？）（如前所述）\n \n不過我自己看那段時，原本以為他只是要扁人一頓，嚇壞。但我沒有到不能接受，對有些人\n\
  來說，性的確代表代表強勢、控制與支配力，就像狗的騎乘行為一樣。與愛無關。\n感覺像 「業主把主角當狗一樣收養、疼愛、栽培（至少業主會這樣想）、拿出去炫耀，\n\
  所以無法容忍地位被挑釁，最後反而自己做出了獸行。」 有這樣的諷刺意味在。\n \n另外我雖然跟很多人一樣不認同主角拿別人老媽的紀念場所做文章，但以電影角度，我覺得\n\
  種族歧視老太太的紀念場所最後是集中營風格這個諷刺性很讚，畢竟這個不是真人真事。\n \n \n \n--"
