title: '[激好無雷] 《粗獷派建築師》成本是一個台灣三'
content: '終於找到時間來看這部

  體感並不會很漫長

  中間還有中場休息時間

  大概是提醒觀眾「下一個篇章」要開始了

  「讓你們喘一口氣」


  這片透過建築這個題材

  點出了美國所存在的種種問題

  種族歧視、包容性、脆弱的根基、虛假的自由、暴發戶心態等等

  也帶出了些許集中營的色彩

  在整體建築的構造下

  更是反應了階級問題存在的痛苦

  只是這份痛苦如影隨形

  甚至滲透到「美國人」之中


  這部是反川普作品吧？


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
