url: https://www.ptt.cc/bbs/movie/M.1737902830.A.8A0.html
title: '[負雷] 粗獷派建築師'
content: '有雷












  今天本吉

  去看了粗獷派建築師

  210分鐘的電影

  中場還休息15分鐘


  真要擠甚麼優點

  大概就蓋皮爾斯、安德林布洛迪演技在線


  其他的那些甚麼拍得很美

  老實說也就一般水準，沒有到特別好

  甚至可以說一些性愛鏡頭

  真的是拍的不怎樣


  音樂主題曲蠻有記憶點

  但是並不到好聽


  故事銜接的不到亂七八糟，但是很零碎

  情緒好不容易堆積了，馬上又被打散


  拉斯洛逃到美國，他的表兄弟阿提拉接濟他

  前一秒夫妻拉斯洛三人還很開心的跳舞

  下一秒老婆就暗示要拉斯洛自己搬出去住


  哈里遜一開始趕拉斯洛走

  下一秒就要請人家吃飯請他蓋社區中心

  再下一秒又偷偷找人砍預算

  拉斯洛和砍預算的吵起來又馬上叫預算哥離開

  說相信拉斯洛


  一個火車翻車意外，傷了兩個人就說不蓋了不蓋了

  下一秒又說阿算了一下還是蓋一蓋好了

  結果挑石頭挑到一半竟然把男主角肛了


  幹這三小

  就算真實人事物是這樣

  你搞這甚麼大直男講故事阿


  結局莫名其妙用一堆幻燈片充秒數

  然後姪女出來代替拉斯洛演講

  停格!

  沒了!!

