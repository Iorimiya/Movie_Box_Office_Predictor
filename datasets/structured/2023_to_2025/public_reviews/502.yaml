url: https://www.ptt.cc/bbs/movie/M.1741075034.A.BA4.html
title: '[偏負雷] 粗獷派建築師 這價值觀無法接受'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  先說我對這部片完全沒有認識，就是早上看到男主角得奧斯卡，晚上就訂票看了。

  藝術流派我也是一竅不通，但我相信對美麗事物的感覺是無師自通的。


  這部片有設定中場休息，上半部是一部非常經典的美國夢故事。猶太主角逃離歐洲戰場，

  輾轉來到美國重新開始。雖然經歷親人的背叛、工作上的委屈，但整體都是在向好的方向

  發展。上半場結束前，主角已經有穩定的建築設計工作、配房配司機，他的投資人甚至還

  準備透過政商關係把親人從歐洲難民營撈出來。


  到了下半場劇情開始比較現實。初來美國的妻子跟姪女皆因戰爭有後遺症，工程因為意外

  暫停。因為長期在美國受到次等公民對待，姪女成人後決定離開，主角則選擇另一種方式

  -用毒品麻痺自己。最後與投資人的義大利旅行終於讓主角看清權貴最醜陋的一面，那種

  想要掩蓋仍然會無意識流露出的絕對傲慢。終於在妻子面臨生死邊緣的時刻，主角也決定

  離開美國，他心中唯一掛念的，是那棟終於復工的建築。因為就像主角的理念一樣，他的

  建築在歐洲，歷經戰火仍屹立不搖，本身就是一種象徵，而他也要在美國這個看似自由的

  巨大難民營中，留下自己存在過的價值。


  =============================================================================


  我相信如果劇情停在上面說的這裡，最後鏡頭再帶觀眾走過完工建築亮麗的內外，然後講

  解主角設計中的巧思或隱藏的意涵，這部就是滿分。


  但後面的劇情是，一個猶太人表彰大會，主角的姪女代表發言，說主角把當初投資人給他

  的社區活動中心項目，硬生生蓋成集中營風格，更別提這個活動中心本來是用來紀念投資

  人過世的母親的。


  相信有點裝潢經驗的都知道，一般人對於空間、環境氛圍這些東西是沒什麼概念的，就算

  是早期的樣品屋還是現在的3D模擬圖，等到真正做出來的時候，都還是會有相當大的落差

  。


  雖然電影裡的投資人想法天馬行空，同時想蓋教堂、體育館、圖書館等等，但應該不難聽

  出他要的就是一個公共空間，讓周圍的人們可以來此聚會，同時也能以此紀念母親。這種

  建築不管是在外觀還是功能性上，應該都要是舒服輕鬆的、讓人想常來的。結果主角非但

  沒有符合客戶的需求，反而用一個從頭到尾都沒展示內部細節的樣品屋，加上一個十字架

  型的天棚採光唬住所有有信仰的權貴，從來不說他的理念其實是塑造一座集中營來反諷美

  國。自從建築成型以來，看主角走在裡面就讓人喘不過氣，我還一直期待有反轉，是不是

  像開頭的書架一樣有什麼天才設計，結果真的就只有這樣，完完全全違背客戶的期待。


  重點是!這裡所有的設計，是在一開始，也就是主角剛與投資人解除誤會，就已經設計好

  了。不管投資人後面變成什麼模樣，但剛開始他是第一個信任主角，並願意幫助他的家人

  ，給他新的人生的人。


  到了這裡，我除了認為主角自私自利、拿了別人的錢卻不顧他人感受之外，也不知道要怎

  麼形容他。最後的劇情是，主角被投資人性侵不敢講，還是他生病的老婆跑去跟投資人理

  論，鬧掰後跑回新建國的以色列。然後就是主角年老的時候開建築展，一群猶太人跑到一

  個第三國，一邊很自豪地訴說在美國如何用投資人的錢，蓋了一個監牢來自我滿足，另一

  邊又無病呻吟，好像全世界都容不下猶太人，只有以色列才是完美國度。廢話這種工作方

  式誰容得下?


  我真的到了最後這段，才發覺這是一部徹頭徹尾的猶太主義大外宣，還是負面的那種。難

  怪電影裡說移民是社會蛀蟲，這主角根本已經蛀到地心。


  --

  這部分沒錯，但我不齒的是他計畫開始的時間。後面投資人的確是險露本性，但前期他

  認識到錯誤，並主動還主角錢，並請他幫忙設計紀念母親的建築，應該是非常尊重了'
