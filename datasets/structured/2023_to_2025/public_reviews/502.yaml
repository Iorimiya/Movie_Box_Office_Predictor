url: https://www.ptt.cc/bbs/movie/M.1741190572.A.41D.html
title: 'Re: [偏負雷] 粗獷派建築師 這價值觀無法接受'
content: '我也有疑問

  可能真的台灣社會和猶太人關聯性極低所以電影很多地方

  我都沒有立刻get到要點

  包含最重要的，在討論到底要蓋什麼的時候

  主角講的是「會堂」，而不是教堂

  這個會堂我一瞬間以為是大禮堂之類的集會場所

  到中場休息看到結婚照才恍然大悟：啊他想蓋的是猶太教的教堂


  我的疑問就是業主爆菊到底爆什麼意思的

  根本沒端倪沒跡象啊

  人家才剛剛幫忙業主也覺得很美的大理石

  根本也沒忤逆業主啊

  到底幹嘛突然要他聽話點

  這裡的劇情真的很怪無法理解

  而且也沒有什麼很明確的伏筆


  若說業主兒子真有強X左菲亞這還有很多伏筆

  但是主角被強X這真的頗意外

  也沒有任何伏筆顯示業主好這味

  主角跟黑人朋(毒)友XX我還覺得比較自然


  或者這是一種象徵手法？象徵戰後來美國的猶太人被無情壓榨？

  真實情況是這樣嗎？


  總之我覺得這裡是電影的大敗筆

  因為如果刪去這個部分

  業主與建築師的關係算是滿完整且寫實的

  配上猶太人與新教徒的矛盾，關係也算富有張力

  可以撐起本片主體

  而且業主、建築師老婆的演員表現也都很亮眼

  難怪都入圍最佳配角

  真的是業主強X主角太超現實讓人問號


  其實本片和性有關的部分都很多餘

  包含開頭手天使的部分也是

  不知道必要性在哪

  不會是導演想看Brody的裸體吧



  不過最後要幫「重點是結果而不是過程」說句話

  這應該是專指建築工程而言

  確實設計圖畫的多精美多厲害都沒用

  要蓋的出來才是重點

  沒有任何一位建築師是因為建築設計圖畫的很棒而出名

  都是實際存在的建築物留存下來而成名


  個人覺得「重點是結果而不是過程」在電影中不盡然要上升到猶太主義

  就劇情中發言的場合應該還是在講建築







  --

  不是啊 這些都過去了

  人家都離職去紐約當繪圖員了，過幾年外甥女都懷孕了

  又再把人叫來拉去義大利挑大理石

  然後再強X人家

  這很怪吧，義大利之旅也沒有爭吵或怎樣

  該找的大師有找到，石頭也找到完美的，配合度很高啊

  我從台詞可理解是宣示主控權而不是同性之愛

  但是他們沒有衝突，為何馬上就要用最極端的方式確認主導者是誰？

  通常如果沒有衝突，那就是初見面要來搞這套來確認誰聽誰的

  但這也不是初見面，而且男主角當下應該是「無行為能力者」

  也不具威脅性，這個動機實在是不懂

  整個採石場派對的戲，前面隱約可以感覺到業主想做什麼事

  他的眼神有點戲，但他也只是看到男主跟某個女路人跳舞而已

  「擁有」這個動機可能性滿高的耶

  如果考量那個時代對於性的觀念的話，那佔有慾是有可能

  只是這樣最後業主消失就覺得好像收尾有點虛

  我覺得下半場的採石場也是拍得絕美

  但就是那場戲毀了這段

  不然我也想體驗一下採石場裡開派對

  可是這樣老闆一遇到困難就把人趕走就會很怪，

  不是說要佔有？怎麼又這麼輕易的把人掃地出門

  如果腦補說被指控強姦犯因為自尊更重要所以當場要解雇

  那第一次因為火車意外解雇就說不通了

  跟自尊無關，也不是建築師的錯

  難道只是因為建築師說不可以解雇火車工人？

  越寫越覺得好難解釋阿~~

  刪掉強姦戲最快'
