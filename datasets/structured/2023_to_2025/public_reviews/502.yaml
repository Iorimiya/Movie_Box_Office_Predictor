url: https://www.ptt.cc/bbs/movie/M.1758636772.A.81B.html
title: '[微好雷] 《粗獷派建築師》有些失望的建築電影 '
content: '威尼斯影展最佳導演

  2025年奧斯卡入圍多項獎項


  今年初還沒上映之前就引起關注






  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  刊登於方格子的原文




  《粗獷派建築師》(The Brutalist)慎重地看完，七零八落之感，在歐美建築文化遷徙的

  客觀歷史性與美國土地上存有者的主觀戲劇性之間兩邊拉鋸但有力未逮，沒有中心思想是

  主因，創意不足也是其次。



  猶太人被納粹迫害逃難至美國同時傳來歐洲文化與現代性，相較於美國當時的地方性，這

  點很有趣。但得到的，只是電影特別的teaser宣傳，看了電影發現這只是一點點文化、設

  計的行銷手段，沒有對建築史的探討回顧，例如：猶太文化宗教與現代包浩斯建築的演進

  ，太多可以以談的，但完全沒看到。



  看似的「建築電影」依附在具有才華建築師角色成長的史詩，但問題是故事也沒有講好啊

  ，描述天才的自負與自傲，得到金主的資助之後，原本維持像是《塔爾》有些描寫藝術家

  的fine的氣氛開始走樣，沒有張力，只有壁壘分明善惡之力的生硬轉折。



  同時漸漸揭露的幾個老掉牙的主題，美國夢的政治作用力，建築師與金主的權力爭霸。那

  些說歐陸被濫殺無辜，但建築的恆久性是基於人的紀念碑，而非水泥石塊原本的質性，



  《粗獷派建築師》可見是要走比較藝術性但以戲劇敘事為主，如:PTA《黑金企業》或馬

  丁史柯西斯路線，但這部的「建築宣稱」會讓我期待，彼得格林那威的《建築師之腹》(

  註)建築電影（長片）的可能，看來還差得遠。



  當然就形式上，選角布洛迪仍成功演譯延續《戰地琴人》流亡的猶太人形象，攝影迫切地

  想要尋找戲劇之外的物質感可能，配樂不用說，預告片就被那前奏烙印記憶之中，卻也只

  像是偶有亮點的形式。



  於是最後粗獷派建築的水泥質感，與集中營冰冷牢籠感的連結至美國的現代生活居所形式

  追隨功能，卻只是停留在歐洲逃難到美國的迴返，再次為一種美國夢碎，這樣有點耳熟，

  有些cliché的歐洲人文主義論調。




  (註)

  關於《建築師之腹》可以參考筆者許久以前舊文



  --


  拉特飯 - 以商業力量進入獨立市場


  --'
