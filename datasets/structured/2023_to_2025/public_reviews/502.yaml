url: https://www.ptt.cc/bbs/movie/M.1741771432.A.7B5.html
title: '[有雷] 粗獷派建築師 The Brutalist (2024) 二刷小記'
content: '一、開場外甥女 Zsofia 受審戲，審問者語氣咄咄逼人但審問內容並無威脅性，頂多就是要她證明和主角妻子 Erzsebet 是否有親戚關係，這點在前半片中主角也有有努力過...
  不過這段審問關鍵句在最後一句「送你回家」。到底她與他們猶太人的家應該在何方？這看來是本片大哉問：下一個鏡頭就是舅舅一人到了美國看自由女神、舅舅整片努力在美國打造自己家，只是後半片末舅舅舅媽車上吵架憤恨控訴「他們根本不想要我們」、片末終鏡頭尾呼應的外甥女則在以色列找到了歸宿。大概這就是個吧。


  二、主角 Laszlo 下船這晚還沒搭巴士先去找妓女，妓女問他「我哪裡最美」他先敷衍一陣後來才挑個缺點，並非身材胸部而是「兩眼上方距離」真有種！下半片中我們知道營造商找了商業建築師來把他「狹長空間」砍了四公尺、他也當場改圖「上面砍四我下面就補四」、直到片末威尼斯建築展外甥女才揭曉那是「集中營受害經驗」的空間比例精準再現！哎哎狹就狹長還要特定比例這也太執著...
  話說回來最愛量「兩眼上方距離」的向來不是納粹醫生嗎？誰知他身為猶太也這麼在意。


  三、主角從投靠表哥開始就一路「寄人籬下」，在許多場合看得出他：當他寄人籬下受人恩惠時，他是靦腆羞澀滿懷感恩甚至有點卑躬屈膝逆來順受的；但當他能助人時譬如能幫黑人小弟排隊拿麵包、當他能發揮時譬如書房完工點了支煙準備向生氣的
  Van Buren說明，在在看出只要給他機會他也超有傲氣絕非池中物！在此也可見 Adrien Brody 在霸氣大師與喪家之犬間的演技切換，尤其甩打火機點起香煙吞雲吐霧就做足架勢
  let''s talk business。


  四、主角受邀來設計「社區中心」，應算是他摩拳擦掌躍躍欲試覺得可以落地生根的契機，尤其 Van Buren還有律師友人幫忙牽線可帶來妻子甥女這夫復何求？上半片他測量勘查設計討論還在蜜月期，儘管風格引人側目仍有
  Van Buren力挺，只是？剛好就在下半片開場：首先妻子甥女都來美國了、Van Buren 也邀來晚餐接風洗塵了，然而就在晚餐出現宛如對待擦鞋小弟的 "One
  penny saved"這又是何等作態？果然翌晨就向主角劃下道來「營造商找了另一建築師」幫你改圖省預算、而且「沒錯他是個混蛋」我就是找他來當個混蛋！


  五、也許上半片時主角身為建築大師的「自我中心」性格還不算太明朗，譬如社區中心竟獨尊基督新教、他雖質疑「這不是開放所有人的嗎」也還是乖乖照做了，但看來下半片起他被
  "One penny saved"洗臉一次後已暗暗毛起來、接下去面對「改圖省預算」與「比例不精準」他絕不妥協 (!)甚至不惜花自己的錢！我個人認為「花自己錢」表示他已將這建案，從此不再認為是自己在提供服務幫助別人圓其夢想、而是這棟建築就是我的
  brain child沒別人可動！


  六、發現主角開始龜毛起來自命大師不與外人妥協時，Van Buren 還是一臉好好先生樣卻開始玩，營造商 Leslie 與商業建築師 Simpson都跟主角吵個面紅耳赤再由
  Van Buren出來當個和事佬，甚至某天公子 Harry還來跟主角勾肩搭背：你要拿自己錢來補貼預算並非好徵兆、你橫著走路我們旁觀已久 we tolerate
  you！至於公子接近外甥女是真有惡行還是純作態威脅那就不好說...


  七、也很令我好奇但尚未理解的是 Van Buren與主角妻子 Erzsebet 的關係：他第一晚就在她面前對她丈夫搞 "One penny saved"這擦鞋童戲碼，這是純對主角劃下道來？還是同時之後
  Van Buren仍多次對 Erzsebet 一派紳士風範大獻殷勤，是否也想透過她對老公曉以大義聽業主的話？甚至再往前回推我也好奇「接來妻子甥女」是否也是關鍵時間點：在接來前
  Van Buren都把主角捧在天上從沒暗示過一個不字，是否終於接來之後已對主角仁至義盡、從此覺得主角身為建築師服務業主皮該繃緊點？


  八、一刷時我就覺得本片最令人失望的「男男強暴」戲應是 Van Buren殘酷宣示 "I own you"，二刷注意強暴台詞才更看出 Van Buren身為：「你覺得你很漂亮、你受過高等教育」，彷彿自卑我們美國老粗雖然文化品味比不上你、但不只建案連你人生甚至身體都歸我掌控！然而看前半片
  Van Buren & Laszlo 一個知遇一個報恩真人間佳話，為何最後仍要走到這一步？


  九、這可能牽涉到不同觀眾對主角姿態的價值判斷，本版前幾篇也有不少版友已做過討論，我在這裡也分享我的觀點：在商言商一個建案該長怎樣當然都業主決定，畢竟他的土地他出的錢圓的是他的夢想，建築師設計監造都是提供服務怎能懷抱私心？然而本劇
  Laszlo 可是「建築大師」會被人稱一聲 Maestro，儘管真 Maestro應該早被重金挖角 XD 但我們就當他害羞面嫩不願找過去人脈... 這種 Maestro恐怕心裡多少都住著個「安東尼高第」或「李奧納多達文西」、發光發熱留下不朽傑作！


  十、本片「」與「」這兩線敘事又有何關係？我個人認為至少在概念上確有其呼應：(1) 猶太人以為到了美國努力工作發揮才能，久而久之落地生根「美國就是我的家」，誰知你來這裡只是打工過客一再寄人籬下，逢迎討好努力奉獻挖空自己才恍然大悟「他們根本不想要我們」；(2)
  建築師 Laszlo 覺得自己才能出眾在歐洲作品等身，與其說是我服務業主不如說是有「伯樂贊助」讓我徹底發揮，然而熱情憂鬱堅不妥協做到最後才恍然大悟「我的建築不是我的建築」從頭到尾都是業主的。


  十一、這仍是我個人價值判斷：(1) 我仍覺得一個民族與其堅持要有「自己的家」徹底伸張自我沒人能管我，不如認清，譬如 Laszlo 雖在美國寄人籬下但 Van Buren對他又有什麼不好了？如果他安分守己受人之託忠人之事怎會走向片末的衝突悲劇？難道唯有「猶太復國」建立以色列全沒有別人
  (!)才是伸張自我？(2) 我也覺得一個建築師就算再有才能都要謹記你是在「受人之託」，你的才能洞見可以啟迪業主但終究該聽業主的最終決定，這建築是要服務業主與在地社群而...


  十二、再談談本片建築，我覺得：前半片的「鋼管椅」離經叛道鶴立雞群令人看了坐立不安、但「圖書館」窗明几淨極簡有力單一傢俱 (!)簡直就是戰間歐洲「玻璃盒子現代主義」降臨在美國！尤其
  Laszlo & Attila兩人一邊打開門板那攝影節奏真令人雀躍！但後半片這「高丘上的社區中心」拍這麼久觀眾一直霧煞煞，上半片端出的模型那設計密度就只是個「概念模」，他口口聲聲「隨著光影變化」但怎麼變化都嘴巴說說卻全無鏡頭！到下半片就算
  Laszlo 導覽工地也沒什麼具體東西，直到片末整棟建築也只短暫露出幾個片段元素。



  最後，本片「回家敘事」看來訴求猶太人四處找不到家、唯有「以色列建國」才是完全自由徹底揮灑的終極解法，本片「建築敘事」則訴求建築才子渾身才氣卻被壓抑掣肘、但最後他能把每個設計變成他自己的、「再現猶太苦難記憶」？看來對主角
  Laszlo 與他傳人 Zsofia 來說這就是他們苦路一遭的最終歸宿，但我們並非猶太人也不是建築師又會怎麼看？還是推薦大家若有興趣也來瞧瞧《粗獷派建築師》The
  Brutalist (2024)，雖然片長超長但攝影音畫處處是饗宴，只是本週已場次有限沒剩幾廳恐要把握機會呀...


  --

  這個就是我小小心靈不太願意承認的了 XD

  覺得至少那個模型要做多點細部：量體動線虛實開口都要有，至少他們現代主義「形隨機能」總要讓人能一眼看出，譬如 Van Buren對主角做功課時翻出的雜誌照片就能令人相信是真的建築。

  的確是很美，我從片頭字幕的車上攝影就已目不轉睛

  關於老闆打從心底怎麼歧視，這個是他腦內黑箱，其實我們出去國外走動都知很多人心裡其實歧視 XD 但形諸外表能以禮自持就不是「差別待遇」discrimination。看這業主初登場就是「那個
  negro」顯然已把歧視黑人形諸外表了，但哪裡顯示出他「歧視猶太人」了呢？他圈內友人不是也包含一位猶太律師及其夫人嗎？不正是這對猶太夫婦幫主角妻子甥女來到美國嗎？

  也值得想想到底什麼是「次等公民」：主角來這裡下船後就是一連串「寄人籬下」，但其中有多少是因他「身為猶太」？有多少是因他「身為難民」？有多少是因為他「身為受僱者」本就次於雇主？在他與表哥表嫂的關係中，或有表嫂這個天主教徒不喜歡猶太的成分在；他在其他地方流浪打工住大通鋪遭遇的一切，則比較像是身為難民；但面對業主
  Van Buren就是僱傭關係了，只是「建築師」這個自命品味過人更往往有淑世理想的職業，硬是有一部分才子以歷史大師為標竿、覺得自己是業主上賓，殊不知這本質上仍只是僱傭關係，只是業主對你其實已經非常禮遇了。

  對，「猶太復國」概念在片初就有廣播過、在電影後段主角夫妻也不苟同，只是最後「根本撐不過去」嗎？那倒也不至於。這當然就要看「強暴」戲我們是否認為必然會發生：有人可能認為這個業主本來就把你當禁臠一定強暴你，我則認為你若在他手下安分一點提供服務也並不會踩到他紅線。總之在美國這種資本主義獨大的地方，與其心懷理想主義訴求絕對的互相尊重，不如謹記現實主義知道有錢是老大、在老大下面需仰其鼻息。

  他沒什麼品味，但他算盤打很精也很會摸頭玩權，與其稱他草包我比較想說他「財大氣粗」但想透過藝術提升自己文化資本。

  應該不會有人說被強暴是「咎由自取」，因為無論如何犯下暴行的都是施暴者，就算主角再惹到他、強暴都是他一人的罪咎，就好像女性就算再走暗巷穿再性感交遊再龍蛇混雜、被人強暴也絕對是
  100% 施暴者罪咎。只是這又是個「理想主義 vs 現實主義」的問題：理想上，我們彼此自我伸張平等對話怎可施暴？但現實上，權力不對等的關係中，你真惹到對方對方才沒在管什麼公道與人權，而你受暴也很難期待透過什麼可行途徑討回公道。


  這麼說吧，如果秉持理想主義訴求自我必須 100% 伸張，那真的人人都必須有自己的土地絕不寄人籬下、每個民族也都必須有自己國家絕不與其他民族混居；但世界上所有地方在「民族國家」出現之前都是多民族混合的，我們就算覺得某些地方民族單一頂多是因我們沒去注意到當地非主流。只是猶太人作為一個民族在兩千餘年來一次次被針對迫害，被迫害到累了想成立自己國家亦良有以也。然而光就本片建築師與業主關係看，我個人認為是他自我伸張踩過紅線了，而他做別人案子又有什麼正當性去踩線呢？公道地說，他真有被人迫害到無處容身嗎？


  但這也是我覺得本片導演取巧之處了：業主要給主角狠狠教訓還有很多方法，但導演選了「強暴」這種征服身心的終極暴力，那就是一番兩瞪眼，絕無繼續待下去的可能。但也值得問問觀眾們：我們覺得片末這個「強暴」處理如何呢？會感覺毫不意外還是莫名其妙呢？

  也許現實地說來，「僱傭關係」從不是平等，但有其公道的權利義務，若想硬拉成平等一來是緣木求魚、二來是何德何能。但要說這個不平等關係關於「荷裔美人 vs 猶太」？不知我們在哪些劇情細節中能找到跡象呢？

  也謝謝你提出異見討論。關於事物「應該」要怎麼樣，譬如位階差異都應以禮相待，這點我想可能大家比較容易達成共識；但關於事物「會不會」照它應該的方向進行，這點可能就比較現實了。譬如一般雇主會不會罵婊子或罵其他髒話？二十年前我可能還會說不應該這樣、若這樣就是個失格的雇主，但二十年後我發現這樣講話如喝水自然的人越來越多、反而堅持不分位階差異永遠「以禮相待」者早已成異類...
  那我們要不要在這炎涼世界學習小心求存呢？那仍是要的。一方面是自己縱有權力也要謹守分際不侵害他人，另一方面是自己若無權力那更要謹守分際以趨吉避凶。'
