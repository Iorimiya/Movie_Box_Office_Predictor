url: https://www.ptt.cc/bbs/movie/M.1740663931.A.3DD.html
title: '[好雷] 粗獷派建築師'
content: "【電腦發文排版不易/不喜已不建議左轉，請直接滑掉 XD】\n\n\n\n\n\n在二月初看到錯過試映會感到可惜\n後來看到比預期的228 還早一天當然要來看\n\
  \n\n\n本來就很喜歡男主的戲\n\n再加上 建築 這個關鍵字\n\n\n外行反而更只能用隻字片語反映感受\n這幾天事務也較多 就只用幾個重點分享 好雷的原因了\n\
  \n有些台詞只憑印象並不精確 也請見諒\n\n\n------------------- 以上已防雷-----------------\n\n\n\n\n\n\n\
  \n普通的片頭片尾橫向上捲字體，硬是用了轉了角度橫卷的畫面，再加上大量有<路>的鏡頭，很難不想這是一段\"追求\"的故事\n\n在片尾提到「重點是追求目標，而不是過程」，倒是一反通常安慰人的心靈雞湯句型，反而會想，有追求的人生是什麼樣子\n\
  \n片頭一開始的 自由女神像 也不是像常規立著鏡入畫面，而是倒的、斜的配著一片空白陰暗天空映入觀眾眼廉，彷彿從一開始就在說 自由是場笑話\n\n\n另外第一次看到中場休息的電影，時間足夠上廁所和跑到樓下飲料店點杯飲料(平日下午)，除了中場，還有明顯的\"\
  序曲、第一幕...\"等文字\n\n\n(雷)其實上下場最大的差別是男主的老婆是以書信(溫軟)、身驅(堅毅)的存在男主的身邊，這也會相當於男主怎麼看自己\n\n\
  \n\n\n\n\n\n\n\n\n片名The Brutalist 與 粗獷主義Brutalism 在谷歌上看起來是差不多的意思(有待專業補充)\n\n事後查維基上說\
  \ 風格是「使用未塗漆的鋼筋混凝土或磚，呈現角形幾何形狀和主要單色調色板」\n\n\n\n不免還是會想到是一種赤裸裸想要表達 自己的樣子 給其他人理解 的感覺\n\
  \n\n片尾提到該建築是以在 集中營當中的經驗設計出有如封閉卻在天頂上使用狹長的光線、玻璃帶出自由想像的空間\n\n\n\n\n   突然想到這部片中不語的人\
  \ 封閉內心的人\n\n   都像是在表達 受難 的情緒\n\n\n   在戰爭後興起的此類建築風格\n\n   反倒更像因為壓抑後無奈的靜語\n\n\n  \
  \ 像是希望 也像是在集中營後所提出的存在主義\n\n\n   到了美國 是又見希望\n\n   卻又有如富人的欺伍 只是自己想像的一場空\n\n\n\n  \
  \ (補充) 書房真的好美\n\n   好的建築真的會像是一個好的藝術品 讓人玩味\n\n\n   如片中所述「重點在基底，壁畫只是裝飾」\n\n\n\n\n\n\
  \n\n\n\n\n(雷)\n\n\n\n\n這部片有四個另我印象深刻的性場景，包括：A招妓、B女主幫男主套手槍、C男主幫女主摳摳、D還有男主受富人的侵犯\n\n\
  \n\n\n於A的部份，感覺男主到了美國，希望發洩慾望所以只是讓妓女口交(以致鴇母後來問他要不要男生)，又保守壓抑又期待的心情，連自己都有察覺不到的渴望 (表嫂的發言雖然混障但也象徵男主在陌生的環境裡，有著自己都無法覺察的一面\n\
  \n\n\n於B的部份，在女主被救援到美國以前，男主靠著吸毒來維持自己的運作，彷彿美國夢(和後來女主吸毒後做愛)都是一種美夢的情境(又同時像是 飲鴆止渴\n\n\
  而女主的到來，似乎也象徵現實與過去(Tradition)的到來，強硬的要幫男主打手槍，也像是即將要被現實開始強暴的男主，對浪漫的面對\n\n\n\n於C的部份，同理，像是要治理現實/過去(女主象徵)，但毒(美國夢)反而要將過去逼近死路，這段會讓人覺得\
  \ 男主在面對選擇之後，接受了來自異地的自己\n\n於是，男主回歸一般人生活\n\n\n\n於D的部份，是當男主重新暢想美國夢(完成心目中的作品)後，才發現這一切都只是為人作嫁，到頭來都還是一場被強暴的過程\n\
  \n從一開始富人/富人兒子(代間傳遞)這個象徵美國的角色就可以無端耍賴不付帳、中間要停工就可以停工，到後面開除就開除，哪一段不是權力地位不均被欺負的過程呢?\n\
  \n\n\n\n\n\n        所以? 然後呢?\n\n        既使如此，他還是要為自己發聲\n\n        要直接用作為展示給世人看\n\
  \n\n\n不解釋的風格 「我想要做出\"立方體\" 我想要用建築引起政治刺激 讓左岸不只只有XXXX(忘了)」 這是當男主回答富人詢問為什麼要當建築師的話語\n\
  \n\n想想 建築本身就是一個靜默的所在\n\n也許 直接做出目標 就是一個做出改變、推動這一切最好的倡議\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  男主\n女主\n\n表哥表嫂\n外甥女\n\n黑人父子\n富人\n富人之子\n\n其他鹹魚：富人之女、監工與建築顧問、律師夫妻、外甥女丈夫、州長\n\n\n\n\
  \n本片片長雖長 但角色並不算多\n\n而個性與寓意也都各有象徵\n\n\n\n下半場出現的 女主原本是坐著輪椅 也可以說是象徵 傳統/現實被打折的印象；有如子女的外甥女，原本皆是無語甚至被同為二代寓意的富人之子欺負(從樹林走出、告戒男主已經隱忍很久)\
  \ 直到要結婚回以色列那幕才第一次看到開口，回歸原本的自我脫去美國外衣就能夠活的自由自在\n\n富人之子 也像是衝突下的矛盾體 要接受富人(美國)接受難民 但又不願意這麼接受上一代人的決定而不斷挑刺冷嘲熱諷，也蠻符合還沒充份多元融合的文化體\n\
  \n富人之女 是跟富人之子一樣雙胞胎的存在 但卻不似哥哥受陽剛氣質的父權印象 願意在女主最後到家邸申訴不公時出來阻止 也可能代表當時女權運動覺醒後的意象\n\n\
  \n女主說男主再也不會去看望表哥、而男主說表嫂的污蔑時，彷彿也在控訴過去在原本國家的土地上受美麗的表嫂(後來的文化/表哥到美國時表嫂都還沒出生的意象)污辱\n\n\
  \n\n\n在上半場剛開始的時候 (忘了誰說的/應該是男主說表哥) 但有一句話蠻深刻的「自以為自由的人，比任何人更不想自由」\n\n相較最後回歸和外甥女住的男角\
  \ 表哥一家才是 被美國捆綁放棄自我的(不想要自由)\n\n\n\n\n\n\n其他的荊棘與助力 是反覆刺激男主思考\"我是誰\" 的提醒\n\n在女主(現實)的提醒下\
  \ 男主最後在車子裡哭喊出 「其實他們都不想要我留下來」\n\n\n\n\n是啊 要成為一個與眾不同的聲音有多困難\n\n\n\n這樣 更像是在說美國夢 就像一場謊言\n\
  \n多元併容的未來 就像他的建築是要花好幾年之後才能突破(甚至還要放棄一些的/圖書室)\n\n\n\n用三個時間段表現：改店名的 表哥→ 與黑人為伍創造夢想 →由已變回以色列公民的外甥女上台發言\n\
  \n\n要被受到肯定 需要時間\n要感受到改變 也需要時間\n\n然而 人會老去 (老梗)只有美會留下\n\n\n建築本身 不急不迫的成為見證這一切波動與改變的歷史\n\
  \n而歷史跟時間本身就是美的\n\n\n有如這部片中透過不同時間的光影 所感受到的 「信仰」\n\n\n\n\n\n美 或者說 做自己\n\n本身就是一種信仰\
  \ 大概是這樣吧\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n--"
