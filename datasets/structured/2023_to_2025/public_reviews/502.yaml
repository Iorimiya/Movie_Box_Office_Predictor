url: https://www.ptt.cc/bbs/movie/M.1741493426.A.369.html
title: '[普無雷] 【粗獷派建築師】量角器畫錯了下半場'
content: '‧


  上下半場是兩部截然不同的電影，上半場之前絕對是我心中BP等級的電影，進入下半場後

  ，忽然覺得有看小丑2的即視感，把那種觀眾想看的，偏偏導演就不拍出來，狠狠教訓了

  觀眾一頓的打臉感，用破碎劇情的方式回應給觀眾；下半場在技術面來說的確還是很優秀

  沒錯，但一味的美學構圖畫面輸出，卻好像忘了逐漸邁入結尾的劇本才是更為重要，下半

  場支離破碎的劇情，像是刻度錯誤的量角器，怎麼量都無法寫入進觀眾心中。



  ‧


  這部具有相當野心的作品，開頭的確令人著迷，無論是攝影、音樂，都堪稱一部極為藝術

  品等級的電影，尤其丹尼爾布隆伯格的配樂，絕對是為了大銀幕而生，除非家庭的設備夠

  強，不然實在很難在串流上重現本片配樂的震撼。


  自由女神象徵懷抱熱血的美國夢，但托特卻如同女神像艱辛的製作過程，標誌了他充滿各

  種元素的人生旅程；這樣的要點很吸引觀眾，當然期待看到一部天才洋溢的移民建築設計

  師，艱苦來到美國後的重新振作；卻因劇本的時空跳躍，跳掉許多應該一部以虛構傳記電

  影應該要做的事情，尤其下半部進入義大利之後，風格完全丕變，隨之又直接跳往1980年

  代，其呈現風格完全不同於前面90%劇情，突然充滿電音式的80年風格，瞬間可能讓觀眾

  無法適應風格的轉換，成為擁有非常良好的開場，

  卻倉促的結尾。



  ‧


  雖然艾諾拉並非我心中的BP，但粗獷派建築師如此的掉隊，我想也不意外，至少艾諾拉的

  風格與整體劇情都相當一致，不過排除下半場，上半場的所有演員及攝影配樂，的確令人

  賞心悅目，布洛迪絕對是今年不作第二人之想的奧斯卡影帝，更被戲稱演出了史上最感動

  的自慰戲。


  雖然下半場確實讓人十分失望，但導演布萊迪寇貝特還是讓我們看到了一部充滿美感的電

  影，看到他為了拍這部電影，相當辛苦的生活著，這也是劇中主角為了堅持自我的的寫照

  ；很可惜的是粗獷派建築師在整體表現上來說，可能沒辦法成為當代經典，但在攝影美學

  上，絕對可以在影史上佔有一個位置。



  ‧


  【粗獷派建築師】還是一部值得進場觀看的大銀幕作品，甚至劇院才是它最推薦的觀看方

  式，上半場斷點相當的漂亮，且能好好地保留情緒，雖然下半場的後段瘋狂的脫離了掌控

  ，但仍然是一部以欣賞演技及畫面構圖，就足夠掏錢進戲院觀賞的作品。



  ‧




  追蹤茶太郎IG



  --'
