url: https://www.ptt.cc/bbs/movie/M.1749087054.A.597.html
title: '[好雷] 粗獷派建築師The Brutalist'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  花了一個下午看完《粗獷派建築師》，歷史魂與藝術魂有點重燃，喜歡各種光影鏡頭的呈

  現，看到最後有一種卸下重擔、豁然開朗的心情，真的唯有如此的電影長度才能做到。然

  而俗的角色有夠俗、蠢的角色有夠蠢、壞的人有夠壞，還是令我非常意外！總覺得有點復

  古味道，目前無法確定是好是壞。

  看完之後跟已經看過的朋友聊，簡單看了些網路上的討論，才總算是把看時的內心疑惑解

  開：這不是一個傳記片，故事主角確有所本，但是非一個人（可能有一個較為核心），而

  是二戰後在美國發展的猶太裔建築師的經歷融成。


  整個故事要傳達的歷史情境與角色所象徵的集體氛圍，可以帶出許多的討論和想法。無怪

  年初奧斯卡最佳導演與影片頒給《艾諾拉》時，有不少人為本片叫屈。當初只看了《艾諾

  拉》，無法對這樣的討論有什麼想法。事隔多月，補完《粗獷派建築師》後，似乎可理為

  何會有那些討論。


  以電影而言，《艾諾拉》各種調度與整體表演更精準，好看度絕對是極高，在大獎競爭上

  可以想像其優勢。不過奧斯卡畢竟就是一個獎項，放長遠來看，《粗獷派建築師》所呈現

  的世界與觀點（甚至ＡＩ技術的運用），可能在戰後美國、建築藝術的討論中被拿出來放

  映和討論。



  ***


  這裡是我的樂園:




  --'
