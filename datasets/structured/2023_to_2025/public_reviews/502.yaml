url: https://www.ptt.cc/bbs/movie/M.1740648795.A.1A6.html
title: '[好雷] 粗獷派建築師 The Brutalist (2024 美國片)'
content: '今年如果只有空去一次電影院，我要看的就是《粗獷派建築師》The Brutalist (2024)！記得近十年前我就很愛另一部拍「粗獷主義建築」的電影《摩天樓》High-Rise
  (2015)，那片有抖森主演有艾朗壓陣還有一堆明星大亂鬥，雖然真要說「建築美學」那片顯然並不著重 XD 但那現代主義建築自以為能改善社會的「時代精神」倒拍得怵目驚心！總之可說該片原著作者電影編導就算對建築研究不多、但至少對建築的時代精神與意義都有其掌握。那今年這部《粗獷派建築師》導演
  Brady Corbet 又怎麼理解建築拍攝建築呢？很遺憾，我覺得他儘管看似用了不少力，但白費功夫。


  不過至少他的畫面色調與光影構圖、他的配樂旁白與音畫搭配、他對一棟房子從概念到施工的從無到有、他對不少建築攝影明顯的景仰與迷戀、然後他心目中的「建築師」也有不少能令圈內人會心一笑的誇張作風...
  這些美學講究與激情飆戲 XD 令我看得津津有味就值得 [好雷] ！然而真要說它有無發揮「建築」尤其「粗獷主義」？我個人覺得都只談到皮毛，充其量就是個門外漢拍他的想像，也並沒讓厲害的建築顧問改變他視野影響他劇本幫他做設計...
  說直白點本片主角是不是「建築師」，都無礙他想談論的主題，畢竟真主題並非建築而是「移民悲歌」與「猶太苦難」。




  當導演 Brady Corbet 心中有個「苦難猶太建築師」故事時，有沒有史實人物可供他參考？那還真的有，建築界咸認他取材 1902 出生的匈牙利猶太建築師 Marcel
  Breuer，此人出身包浩斯做鋼管椅起家、後來的確成為「現代主義建築」幾大旗手之一在歐洲聲譽卓著、然後 1937 見納粹迫害日益嚴重就和幾位大師相繼逃來了美國...
  只可惜本片主角 Laszlo 儘管在專業設定上顯然採用他，但在「逃來美國」的時間設定上就有了出入，畢竟那時歐陸建築大師來到美國人人爭相邀請都來不及呀！本片劇情只好安排
  Laszlo 待過集中營幸存活下來，來到美國一貧如洗只能打零工。


  誒誒你既是大師出身包浩斯，難道沒有包浩斯校友一下船就挖去當建築教授？就且當他是「天縱英才」但「沒沒無聞」的藝術家等待伯樂吧，畢竟 Adrien Brody 演來「剛毅木訥」「曖曖含光」一臉小家碧玉不願給人添麻煩...
  然而伯樂一來他傲氣一起 (!)登時舉手投足抽菸睥睨都是大師味！只是既然他第一場戲是從黑暗船艙初見光明看見「自由女神」，顯然接下來三小時劇情就是這「自由幻夢」的殘酷除魅，也許「殘酷」brutal
  就是 Brady Corbet 對「粗獷主義」brutalism的字面理解吧 XD 接下去每遇一人都先令他感激涕零願效犬馬、但沒兩天被倒打一趴又墜入地獄：




  首先《疾風禁區》Alexandro Nivola 演同鄉學長 Attila、乍看是他初來乍到熱情拉拔的第一個貴人？甚至語帶誘惑分享女友 XD 一度儼然「三人天堂」？但其實他自己事業不順對
  Laszlo 這塊瑰寶能用就多用，順風順水時載歌載舞是換帖兄弟，案子觸礁惱羞成怒翻臉不認人；最糟的是他儘管同為猶太熱情相挺，但天主教女友動念趕人他置之不理，反而壞人都讓女友來做他都故作天真在旁不沾鍋。再來「比利林恩」Joe
  Alwyn 多年不見已成小油條 XD 演富二代 Harry Lee就是建築室設最怕的不穩定業主：時程排很急話不說清楚、有求於你時滿臉堆笑、若有不順都由你背鍋。


  還好「小喬」Martin Stacy演起富妹 Maggie 還算是清流，整片美國上流一片口蜜腹劍把人吃乾抹淨，唯她在片末絕望時刻尚有點人性光輝... 至於兩兄妹的富豪老爸
  Van Buren，儘管算是主角貴人給他舞台如再造之恩，但看看 Guy Pierce 這張壞人臉 XD 人人都知 Laszlo 跟他掏心掏肺絕無好下場！儘管本片這「山丘上的社區中心」前衛建案諸多階段拍了將近兩小時，但中間亦有「白臉黑臉」讓
  Laszlo 陷漫長苦路：總是業主 Van Buren花言巧語杯觥交錯把他吹捧到天上、但刪減預算悍然改圖都給營造商 Leslie 當壞人，如他仍冥頑不靈還另有終極手段宣示
  I own you。




  本片到底 Brady Corbet 拍了一堆 Laszlo 與家人的「猶太苦難」與「移民悲歌」是想揭櫫什麼？看來漫長戲份堆到片末就是這場 "I own you"，只是這種表現手法還真八點檔，可能他覺得「粗獷主義者」brutalist
  就是遭遇各種 brutal 對待 XD 才千錘百鍊「化苦難為力量」成就不凡建築吧... 最後在史實 1980 第一屆「威尼斯建築雙年展」中安插的「Laszlo
  Toth 建築特展」，真能劃下什麼史詩句點令人醍醐灌頂？大概不外就是「諸般苦難」成就了旁人難以親身經歷的建築靈感，但沒關係一切苦難「過程」都是人生養分、苦盡甘來的「終點」才是總結一生的圓滿結晶。


  嗯以片中如此苦難敘事，的確值得觀眾為他欣慰，也希望曾經苦難的那一代人都有屬於自己的「創作療癒」找到心圓滿，雖然本片 Laszlo 臨到老來是否真得圓滿 (?)這個導演也沒拍清楚...
  然而這「第一屆威尼斯建築雙年展」的 1980 是什麼年代？那可是「現代主義」已百病叢生人人喊打、「後現代主義」百花齊放的全新年代、真的還能給正典現代主義的 Laszlo
  如此一個光榮致敬回顧一生嗎？至少史實建築師 Marcel Breuer晚年好像沒那麼風光... 至於「粗獷主義」到底是什麼？有興趣可看專書《SOS 粗獷主義：臺灣與全球建築選輯》(2020)，或滑
  IG 也能找到很多！




  也許本片拍粗獷主義建築還是在談美國白人「看見異種建築如見異國移民」都想趕走拆掉吧... 那還是來談本片真在意的「移民問題」與「猶太復國主義」吧。首先「以色列建國」的「聯合國大會
  181號決議」那廣播言詞給本片播來一整個驚悚！看主角與其妻對這號召都不甚苟同，看來導演自己也對那「該地住民自己做好準備」的聯大傲慢感到不以為然。然而難道猶太人本不應復國而應四海為家？「四海為家」在本片的戰後年代是前進美國，結果前半片見證諸般種族歧視與移民辛酸、猶太學長被迫改宗甚至回頭欺負自己人、最終「這個地方根本不要我們」那又還能去何方？


  不談建築就一臉窩囊的主角Laszlo，委曲求全為人作嫁仍被 "I own you"，還是中年轉型的「兔牙」Felicity Jones演起賢妻 Erzsebet
  能不卑不亢頂天立地與人平起平坐、更能毫無畏懼挺身而出不惜被驅之別院... 一個移民被凝視剝削用過就丟就算早已是宿命、也絕不應乖乖接受而應抵抗爭取無論成敗！倒是《聖鹿之死》Raffey
  Cassidy演起主角姪女 Zsofia 雖默然不語，但也許她「阿利亞之旅」回歸以色列 (!)才承繼了苦澀夢想：我們想要的也就安身立命、但為什麼唯一歸宿仍只剩「猶太復國」？然而想想今日猶太在美勢力多大
  XD 這個「卑微訴求」我們且聽聽就好。



  --

  謝謝解答，其實我把前面審問細節都忘光光了 XD'
