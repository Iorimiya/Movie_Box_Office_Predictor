title: '[負雷] 所以親親會消失對不對'
content: "本週新片\n \n\n \n話說這部有送海報\n \n\n \n不過我會去看倒不是為了海報，而是這片名剛好可以做成一張梗圖\n \n \n \n\
  \ \n \n雷文防雷資訊頁\n \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n \n\
  \ \n \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n \n \n正好是台中市北屯路上有間本土戲院名字就叫親親，開業30多年的老字號，希望這梗圖不\n\
  要用到啊。\n \n \n劇情方面，承接預告片透漏的，女主遭受詛咒，只要跟愛上的人親親對方就會消失，連屍\n骨都不見。\n因此女主再也不敢愛人。\n然後住在名為家園的集合住宅社區，地主是個老奶奶。\n\
  \ \n某天老奶奶死掉之後，繼承人孫子也就是本片的男主，改成家園。因為男主投資失敗，計\n畫賣掉家園。\n因此當地居民試圖用各種方式勸說男主不要賣掉房子\n \n\
  一開始男主追女主的目的是因為她的詛咒，希望親親之後自己消失然後就不用還債了(真\n是個好逃避的做法)\n經過一段劇情，女主就愛上男主，這中間靠一隻天竺鼠幫忙天竺鼠名為cookie結果翻譯翻\n\
  成「妹妹」\n(就為了讓字幕出現「他進入了我的妹妹」，不過就是天竺鼠跑到男主家裡面。。。)\n \n等到某天真的愛到一個程度親下去才發現，欸不會消失欸～\n \n\
  然後就各種親親各種放閃光，然後這種愛情時刻一定會下雨(是因為這樣感覺比較浪漫嗎)\n然後親來親去就結束了，真是好棒棒\n \n至於親親就會消失的詛咒，根本沒這回事，那些消失的人只是因為出家、出國才消失的\n\
  (真有夠牽強，我還寧可拍個男主真的被消失的劇情，我還會比較滿意)\n \n \n個人主觀評分：4/10\n \n \n順帶一提，在戲院看的時候遇到幾個移工也來看這片，應該是來看家鄉的電影吧。他們購\n\
  買力真是驚人，影城套餐點心一個不少。\n \n--\n如果上了就太尷尬了\n \n看了網路解說，這對是菲律賓知名CP\n所以我終於懂這部片的賣點了。"
