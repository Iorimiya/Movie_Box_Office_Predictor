title: '[負雷] 梅爾維爾 影子軍隊 (1969)'
content: '最近光點在辦梅爾維爾逝世50週年回顧展


  選了好幾部他的片播


  但檔期很短，不確定下周會之後還會不會有



  其實我之前沒聽過這個法國導演


  看了iMDB評分都偏高，光點跟車庫在選一些經典重映眼光都不錯


  就打算選一兩部來看，


  第一部是影子軍團，也是iMDB分數最高的。


  第二部原本要選賭徒鮑勃，但是由於時間太晚有點懶，


  影子軍團也不太對胃口(這篇負雷)最後就先放棄






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  開始吐槽前，我先說以下是我的主觀意見，我覺得負雷點比較偏向我胃口不合


  豆瓣上面有些影評頗析(或說腦補，看個人口味)得不錯


  而iMDB上也有好幾篇負雷跟我給負雷的點有對到


  想找深度的影評可以參考(PTT好像目前找不到這部的討論)



  1. 導演不管是對白上或字幕上都很省話，沒有預先看影片介紹，又對西方歷史(二戰)


  敏感度不高的情況下，會有點搞不清楚發生什麼事。舉例來說一開始主角在囚車上被送


  集中營那段，地點我不太確定在哪，對白是法語還德語我也沒辦法分辨。只知道很多不


  同人種被送進來，原因可能是被懷疑有一些政治相關的危險性。主角被發配到"德國軍


  官"什麼的房間。德國軍官指的是他的室友還是看守他們的，亦或是他們可能勞動服務的


  單位? 一頭霧水只能大概猜。或許我有漏看什麼吧(畢竟忙著看字幕)



  2. 整體節奏不算快，片長快兩個半小時，這算是老片通病。


  3. 最後這點是負雷主因，沒有人發現這些反抗團體從頭到尾都在瞎忙嗎??? 從頭到尾，


  只讓人覺得，有人要抓他們，他們都要秘密進行一些"任務"，但從頭到尾沒有傷害到納


  粹，連添麻煩都沒有! 少數耍狠展現決心的鏡頭則是殺了兩個法國人? (第一個是被抓到


  的叛徒，第二個是可憐的媽媽瑪蒂達。啊對，一開始逃命被騙往外跑的少年仔八成也GG了

  )


  。我不確定會不會是導演其實在故意反諷看有沒有人看出來，畢竟最後主角從刑場逃出來


  後在小屋裡說到他要一直寫報告給英國讓他們認為有在做事。中間有段冒死前往英國也不


  知道實質上去幹嘛，聽到同志被抓馬上可以心情不好馬上返回。欸幹不是啊，你回來還自


  己說不可能衝進去救他，費了那麼大的功夫去英國可以直接忽視"任務"，說閃就閃，不是


  還隨身準備氫化鉀什麼的有決心，有大局觀。結果去了只是跟官員見個面，偷看人家軍官


  把妹妹子跳舞? 這個操作真的有看沒懂。從集中營離開的時候唾棄室友窩囊，結果自己被


  告知成通緝犯了要跑還隨便上館子吃飯被抓，被救出來以後恩人被抓了開始講一些垃圾話


  ，同意大義滅親上倒是果斷得很。這個影子軍隊實在讓我很難給好評。



  --

  場次真的少到哭 不然我應該會想再挑一部試試'
