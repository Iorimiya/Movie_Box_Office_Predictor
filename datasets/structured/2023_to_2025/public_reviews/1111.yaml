url: https://www.ptt.cc/bbs/movie/M.1717922315.A.B68.html
title: '[普好雷] 破墓'
content: '氛圍營造到位 音效甚至比畫面嚇人


  港產僵屍片的既視感 看到那個豎棺就知道飛天殭屍要出來了


  (還真的會飛) 恭喜正英叔後繼有人


  女主角 金高銀 跳祭祀之舞時，投入的神情滿性感的，有特別倒轉來看，我沒了。



  劇情設定還是有些難苟同之處：


  祖先之靈再怎麼怨妒 也不會希望自己後代絕子絕孫


  （頂多帶衰家族 提醒他們把祖墳弄好一點而已）


  而且還是位有協和號速度的鬼魂 穿透不了玻璃 卻可以一路飛到美國彼岸去找曾金孫


  恭喜金孫出身即喜獲鉅富 因為其他繼承人都掛得差不多了。



  以為挖到日本統治時代的生化兵器巨棺 家屬都說要處理掉了


  不趕快燒掉，還要一起吃麵喝酒做死


  不趕快通報軍隊 明明戰機都出動了 再怎麼強的精怪 軍隊轟幾下


  還需要什麼民國初年桃木劍 濕木剋鐵嗎 又不是哥吉拉


  只是位關原之戰的萬人斬 被可惡的陰陽師利用 一副可憐軀體罷了。


  恭喜沒有一隻雞在這部片中受到傷害 被捕的代罪熊熊就不知道了


  熊熊哭喊：「歸剛誒！」



  也有點《哭聲》的既視感，韓國很愛拍這種妖魔化日本統治時期的電影。


  不同於台灣的懷念氛圍，"KANO"棒球電影也要歌頌一番 八田與一。


  就像小時候去韓國就聽導遊說，長一輩的TAXI司機會拒載日本客，


  被日本帝國統治後的民族共同意識。



  謝謝消耗了一個下午 身為攝影師 終於學好片尾韓文的 1、2、3


  hana tul set


  謝謝收看。



  --

  買當天 在台發表

  買 當天發表規格

  兩度在展出後歇業 ; 獲得，隔年停辦;

  買 EP系列終止；買 發表 ；買賽提Thomas球衣，轉了好幾隊；

  買A9 A7R3發表；買A7R3 A7III發表；拿到 Sigma fp發表;

  砍台積電276 當天漲回292;訂A6600，發表；買PZ16-35，發表。


  --'
