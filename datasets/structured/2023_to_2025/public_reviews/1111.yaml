  \n-----\nSent from JPTT on my Samsung SM-S9180.\n\n--\n一個都沒有 我坐在正中間，全程睜開眼睛，我還期待被嚇...\n\
  好吧，可能我在另外兩部片都有被嚇，是我過度期待在這部片找到嚇點\n 03/08 16:35"
