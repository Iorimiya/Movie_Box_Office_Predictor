url: https://www.ptt.cc/bbs/movie/M.1710382191.A.7BE.html
title: '[  雷] 破墓小疑問'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~







  破墓好看推推

  個人覺得這種背景設定

  比起厲陰宅之類的純鬼片更引人入勝

  大致上的歷史背景 宗教 風水都還算是解釋的通

  更呼應了片頭提到的

  「有些事情介於超自然與科學中間」


  只是劇情中有個設定我很在意

  看各家影評也都沒有提到

  就是第二段將軍在開無雙的時候

  為什麼都是想吃肝

  將軍本身五行屬火燒的金

  所以老伯最後用濕掉的木頭解決他

  我記得肝在五行中屬木

  不知道是不是木生火的概念

  火又對應到心

  所以吃肝對將軍本身的法力形體有加強效果


  以上是我自己理解的不知道有沒有過度解釋

  希望有高人指點




  --'
