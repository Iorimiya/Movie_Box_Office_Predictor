url: https://www.ptt.cc/bbs/movie/M.1711799651.A.1CF.html
title: '[雷] 破墓'
content: '雷文防雷資訊頁

  先說，這篇一定雷，不想被爆不要看到底

  講些無雷的

  這次演員陣容算是有心的，至少選角跟詮釋上有看得出來很批配劇情跟角色，不會有那種「

  又是這咖跑來演這個而且演得不怎麼好的感覺」，所以在意角色詮釋的人應該大機率不會因

  此失望，劇情上也算是可以吧，

  但是內容安排有些硬傷跟BUG我留在後面討論。


  配樂、角色詮釋、氣氛老實說還可以，如果是為了殺殺時間想看電影（或是消耗掉公司送的

  電影票的那種人）還是可以選擇的

  至少比那種無腦英雄爽片好得多，認真的，


  劇情上節奏安排跟一些內容也不錯，除了我剛說的BUG跟硬傷之外.....



  個人評價奉上了，

  至於是好雷還是壞雷.....我很難形容，所以就一個雷字結尾吧


  喔對，差點忘了說

  想聽狐狸怎麼叫的不要錯過，裡面中後段有萌萌的狐狸很友善的在叫喚

  （至少我是這麼看得啦）





  雷

  雷

  雷











  雷

  雷

  雷











  雷阿

  雷








  先說那個不知道是奶奶還是甚麼存在的角色，我真的覺得劇情的BUG真是夠了，她後來演出

  來是真的什麼都不知道的樣子，你一開始就不該演得好像甚麼大佬在看老照片，還叮嚀兒子

  甚麼鬼都不能透露，

  結果是不要透露個屁，妳根本甚麼都不知道好不好....我囧.....演員演得很好但是這Bug很

  不好



  然後是廟，不得不說除了破墓之外還得提破廟

  破廟是真的破，連屋頂邊邊都是鐵皮，住持說這廟有一百年歷史，但我一看就感覺它應該很

  快會敗在這住持手上......



  最後是劇情設定上最大的硬傷，我覺得是大Bug，

  前面都詮釋很到位了，也說那破墓就是立在狗不拉屎的極陰之地，連袍墳都還要順便血祭的

  鬼地方

  可是後面卻說那邊被插鐵棒很不好怎樣怎樣的，

  我走出來越想越不對：你這邊本來就不毛之地，插不插鐵棒根本不影響整個朝鮮半島運勢

  （而且還是鐵棒.....阿鐵棒怎麼惹你了.....鐵棒他說它難過）

  就算那邊是朝鮮半島的腰子，被戳了鐵棒根本不影響因為既非龍脈也非靈泉冒出的地方，那

  地方只是一個極陰之地啊！！！

  就像在玄關上插把刀可能不吉利，但是沒人會管糞坑上有沒有刀啊，何況是個普通鐵棒

  （鐵棒再次說它難過）

  我看九龍傳說這麼久都沒有非寶地插鐵棒就差的說法

  我甚至打文章打到一半反而覺得凶穴插了根鐵棒這邊反而運勢會變好才對，

  （別，別想歪，我很認真，這裡不是色版）

  因為破壞了凶穴氣勢，把煞氣給煞住了




  最後是我覺得劇情跟時間沒交代清楚的部份

  - 那間破廟到底甚麼來歷，住持一問三不知劇情上廟好像也可有可無

  （好啦我知道住持請他們吃喝不錯，但不能吃完就給人家賣肝阿）

  - 女主角的幻覺裡面的女人跟大樹究竟甚麼關係？看見那女人在那邊跳過大神就沒後續了，

  而且後面女主除了在大樹燒迷香騙騙日本精怪之外也沒了，不明不白

  - 女主角她奶奶後來怎麼了？站在那邊不動被三振？劇情是我忘了還是我害怕起來？

  - 殺那隻怪蛇到底有什麼禁忌？後面也沒有特別解開，風水師被嚇到就沒了，連埋都沒埋


  以上我沒整理的很詳細，反正就那樣，分享一下心得

  喔，破墓的意思是袍墳的第一鍬，順帶一提

  雖然那真的是個破墓



  ----

  Sent from on my Xiaomi M2103K19G


  --

  哀，真的一言難盡'
