title: '[請益] 破墓中的一個疑問'
content: "想請教大家，我看完破墓後有上網搜尋一些新聞，\n\n  發現片中李到晛刺的經文，螢幕翻譯是金剛經，\n\n  但我發現車庫娛樂的官方IG卻說會員專屬首購禮\n\
  \n  是送太乙保身經的書籤（護身符），網址如下：\n\n  \n\n  然後我又查到line today的新聞，裡面有提到\n\n  李到晛身上刺的經文是太乙保身經，且文章末還註明消息\n\
  \n  出處是：車庫娛樂、一個韓文字（抱歉我無法打韓文）\n\n  網址如下：\n\n  \n\n  我google了一下，也詢問會韓文的朋友，韓國的確有「太乙保神經」，\n\
  \n  是否源自中國道教的「太乙救苦護身妙經」尚不得而知，\n\n  可是金剛經是佛教的，鬼武士將軍也貌似是佛教徒（？）\n\n  道教跟佛教並不相同，會對劇情設定有影響（個人觀點）\n\
  \n  所底是否是翻譯錯誤呢？我傳訊給片商車庫娛樂詢問，\n\n  結果至今已讀不回，想請教各位神人板友的意見，謝謝！\n\n\n\n--"
