title: '[好微雷] 先人豎著葬 後人一定棒 破墓'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  「先人豎著葬 後人一定棒」


  不知道有沒有進場的版友跟我一樣

  這部片的中間看到豎棺的時候

  心理就自然浮現九叔的這段聲音了

  只是這部跟殭屍先生一樣

  豎著葬的後人好像都沒有很棒XD


  原先這部片完全是衝著李跟金進戲院的

  後來看到崔岷植大叔 才想到我好像看過「看見惡魔」這部片

  看到這個卡司還真的挺驚訝的

  到最後大決戰的時候

  出現糯米還有馬(黑狗)血的時候

  就在猜棺材裏面484殭屍

  結果還真的是類似的精怪生物

  看完整部片就是韓國版的殭屍先生啊

  對於喜愛港片的我來說算是很不錯的娛樂觀影體驗

  而且恐怖的地方其實不太多 可能對於喜愛極度恐怖血腥的不會覺得太爽

  但後面主軸變成黑日本只能說不意外

  這可能是韓國近幾年流行的政治正確吧

  整體來說算不錯

  大螢幕的視覺特效搭配韓國傳統神道文化算是耳目一新的體驗



  --

  確實是任老爺說的 不是九叔

  不過破墓前面挖墳那段完全就是韓國版僵屍先生啊XD


  閣下難道是大龍大帥?


  我看一定是威逼 (轉身


  我只給了他45斤糯米，所以是75斤，你算錯啦

  是不是任老爺家裡?

  阿!!!婷婷!!

  喂！公平競爭啊！'
