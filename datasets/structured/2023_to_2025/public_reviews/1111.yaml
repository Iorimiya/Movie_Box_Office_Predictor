url: https://www.ptt.cc/bbs/movie/M.1710689973.A.024.html
title: '[請益] 破墓的疑問 (有雷)'
content: '看完破墓，也看過版友和網上討論的文章，很多問題都解決了。但還

  是有幾個疑問，不是想找破綻，只是想聽聽大家的想法，解開自己沒

  有理解的部分。


  朴志勇的爺爺被葬在風水不好的地方，應該就讓他的兒孫後輩家道中

  落，但看起他們還是富裕了兩代，長孫輩才開始出現問題，這劇中是

  否有說明？又為什麼朴的媽媽反對遷墓破墓呢？


  護國寺長老說很多人上山盜墓，或看文章說那些人其實是想找鐵樁的

  其他風水師前輩，但事實是那個墓根本都沒有被挖開破壞過呀，那之

  前的盜墓者或風水師到底有沒找到墓？或做了什麼？


  陰陽師把將軍當鐵柱插下破壞韓國運勢，又指使賣國賊葬在該地，所

  以他活了好幾百年，這是不是也不太合理呢？


  以上想聽聽大家的想法，謝謝~


  --'
