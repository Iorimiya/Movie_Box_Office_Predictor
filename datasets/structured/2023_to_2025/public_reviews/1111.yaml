title: '[討論] 有雷，破墓和哥吉拉負一，要站哪一邊'
content: '《哥吉拉-1.0》是去年就知道的會有這部片的

  片名-1.0，我就知道會出大事

  畢竟曾經的大東亞共榮圈一定不爽，

  發動戰爭你變0，我們算甚麼


  負一哥只在美日院線上

  網飛負一哥也沒作宣傳


  東寶很明白

  亞洲人還在生氣


  果然，今年的韓國上映破墓


  老實說，破墓不如導演上次的娑婆訶

  畢竟敘事在美韓之間跳，而且冗長到要用六章說完故事

  同類型的中島哲也只用三章...


  基本上，是用意識型態推動故事的


  不過也能看到，韓國對日本的怨，至今還是深入骨髓的


  那科學怪人的石田三成，和負一哥其實是差不多的


  若論是非，破墓和哥吉拉負一，真不明白要站哪一邊


  --

  負一哥只在美日院線上

  但破墓有在亞洲院線上

  網飛負一哥也沒作宣傳


  就知道東寶很明白

  亞洲人還在生氣的'
