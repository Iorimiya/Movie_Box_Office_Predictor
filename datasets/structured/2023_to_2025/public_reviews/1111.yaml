title: '[普雷] 破墓'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看金高銀去看的，我認為她這部巫女演得很好

  一開始恐怖氣氛~懸疑內容都到位

  但不像鬼片有突然嚇人橋段，可以放心看

  整體演員演技在線，這些我覺得好評


  以下有雷


  但後半部就很莫名了，這邊就是負評

  你這算是鬼片或恐怖片，也要扯日本侵略

  這如果說得通~要不要歌舞片也加入日本侵略

  還是學中國，不管科幻仙俠都可以滅日屠美?

  扯得有道理也就算了，問題就在亂扯導致劇情變很不合理


  首先是差個鐵柱對韓國有啥影響嘛? 從劇情中根本沒看出來

  然後日本狐狸要坑害你 蛤這狐狸法力很高會看風水

  還會看經緯度!? 高科技狐狸阿 你確定這是風水?


  再來你把鐵柱封在棺內，一開始說看起來像是怕裡面東西跑出來

  結果他不但可以自己跑出來，還會自己跑回去??

  然後風水大師自己一個人跑去挖? 靠你自己去不怕出事?

  挖到他也沒反應 是在睡覺還是白天不會動XD

  我本來想說是殭屍類的東西，但影片說是精怪

  一個日本將軍(我不知道指誰)，跟鐵柱結合而成的精怪

  但為啥還會餓肚子??? 還會想吃香魚跟肝 然後自己跑去豬舍吃豬肉BUFFET??

  等一下你既然那麼餓，又可以自己破棺而出，

