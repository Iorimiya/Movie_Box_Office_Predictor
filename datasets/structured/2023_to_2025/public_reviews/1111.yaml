url: https://www.ptt.cc/bbs/movie/M.1710341900.A.833.html
title: '[新聞] 《破墓》臉寫字意外掀中韓網友筆戰'
content: '新聞網址：




  南韓電影《破墓》掀起風潮，在韓觀影人次已經達800萬名，台灣上映3天票房就

  已飆破1750萬，氣勢相當驚人，劇中主演金高銀、李到晛、崔岷植、柳海鎮都有

  在臉上寫下佛經漢字避邪的場面，怎料掀起一陣粉絲在偶像照片臉上P字風潮，

  並間接地掀起中韓網友之間的網路罵戰。



  X上有網友曬出粉絲在偶像臉上P字的一系列圖片，評論寫下

  「在中國，在臉上寫字或刻字的行為是非常侮辱、屈辱的行為，韓國人在臉上P根本都

  不認識的漢字，真是可笑」

  「因為電影《破墓》韓國人開始各種往自擔臉上P漢字，誰來救救我的母語羞恥」


  相關發言意外地引起中韓網友之間的大戰。


  相關討論被轉貼上到theqoo（註：韓國知名論壇）上，PO文網友附文寫著「看起來像是

  非法觀看電影後在發瘋，中國不愧是韓國的文化附屬國，漢字不等於中文」。



  底下南韓網友紛紛批評

  「看來不久後，中國人會開始說：在臉上寫字的行為是中國傳統文化」

  「沒人關心中國人的想法」

  「到底關他們屁事」

  「英國人有在管其他國家的人，怎麼用英文字母嗎」

  「看起來像是在批評把字P在偶像臉上的人...但那又怎樣？管很多」。


  由於在theqoo掀起不小的討論度，因此討論留言又被搬到了微博，中國網友也不甘

  示弱，回嗆



  「從韓國人身上悟到了沒文化真可怕這件事」

  「人家只是科普中國古代在臉上刻字是非常屈辱的」

  「主要是古代往臉上刻字的只有流放的罪犯啊…韓國人484傻…」

  「你猜漢字為什麼叫漢字」

  「韓國人真的好大的口氣」

  「問題是誰看你這電影了啊…？看圖片也是非法？ins上都有」。


  ———————————————————————


  心得：這場中韓筆戰，精彩程度不輸電影喔XD也恭喜電影韓國與台灣都熱賣！


  --'
