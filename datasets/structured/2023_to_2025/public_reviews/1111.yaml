url: https://www.ptt.cc/bbs/movie/M.1713982686.A.744.html
title: '[微雷] 破墓觀後感'
content: '防雷















  觀後心得

  不知道有沒有人發現 這前段故事架構跟

  暫時停止呼吸幾乎一摸一樣 雖然港韓劇本合作翻拍很多部但這麼早期的片還是覺得有點

  搞笑


  有錢人任老爺家中不安寧於是去開墓 結果是蜻蜓點水穴 棺材還是立著葬 點錯位葬壞了

  原來是祖先取得土地得罪風水師 結果屍變變殭屍 然後棺材也是因為底座沒斗到墨對應馬

  血糯米那段所以殭屍就跳了出來


  然後飯店手機那段致敬惡鬼 你給我開門呵 差點笑出來 雖然那段蠻緊張刺激的


  整體表現算是滿精彩的 拍攝也是水準之上

  我也覺得最恐怖的 是女主腿軟那裡 其實武士沒出來之前都很恐怖 但看見整隻時就沒那

  麼恐怖 甚至有點搞笑 不過把日本鬼火運用到那麼巧妙還是頭一次看到


  後面劇情就有點混亂 幸好還算有收回來 如果有些部分刪掉可能會更簡潔有力比如狐狸陰

  陽師 風水五行 關原大戰的斬首武士 病房奉吉 多數都帶過 也沒說得更清楚


  總之觀影體驗是還可以 老酒新瓶用韓國人的角度重新說了一次故事挺有趣的


  --'
