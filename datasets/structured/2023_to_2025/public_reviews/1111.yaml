  電影中段  那位有錢的委託人在飯店，電話是鬼祖先打來、門口是真男主角敲門那邊


  鬼祖先是用什麼方法去打電話給那位有錢的委託人?


  劇情裡鬼的控制方法大多是讓對方產生幻覺 然後在你耳邊講話要你開窗 最後附身


  可是打電話那邊 鬼祖先是用什麼邏輯去撥電話呢?


  這邊睡覺前想很久百思不得其解 QQ




  --

  詐騙也是這樣 (誤)

  說的也是 感謝樓上各位說明'
