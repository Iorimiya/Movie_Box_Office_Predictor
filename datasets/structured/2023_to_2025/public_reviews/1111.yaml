url: https://www.ptt.cc/bbs/movie/M.1717909281.A.AE8.html
title: '[討論] 終於看了破墓'
content: '這周終於在串流平台看了傳說中的破墓，本來以為是恐怖片不敢看，沒想到其實是商業劇

  情片，看到片尾竟然有看復仇者聯盟的快感。


  這片最強的就是劇本，不僅結構有層次，更結合民俗禁忌.陰陽五行.日韓歷史的元素，打

  造出這個全新具特色的恐怖韓影。


  感覺破墓小組可以繼續受理新案發展續集，真是令人佩服韓國電影真的好強。


  --'
