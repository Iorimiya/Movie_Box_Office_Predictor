content: '笑死了 人家仇日 台灣人在喊燒


  日本歷史上侵略韓國幾次？


  搞過幾次屠殺？慰安婦至今沒道歉


  拍片臭你剛好而已


  不服氣可以學德國總理去波蘭下跪道歉啊


  一個把殺人魔戰犯放在神社裡面拜的國家


  還怕被人臭喔？


  全世界只有台灣被人殖民


  當次等公民 被屠殺 還整天舔前殖民者的吧


  台灣人就標準的自己沒骨頭 笑人家韓國有骨頭的


  唉喲 臭日本在台灣搞屠殺


  是不是又要拉國民黨救援了？


  說國民黨殺更多 好了啦 兩坨屎在比臭喔？


  還是要說日本幫台灣建設了？


  先去多讀書喔 搞懂什麼叫農業台灣 工業日本


  被人當奴才還在讚嘆主子 笑死


  台灣起飛是靠小蔣 一堆沒讀書的在吹日


  難怪會發這種沒營養的心得


  花錢進場看到日本大哥哥被臭很不爽齁


  我是看的很爽啦  當初軍艦島核爆日本更爽


  日本現實中不承認 就別怪人家拍片臭


  -----

  Sent from JPTT on my iPhone


  --

  我都忘了有美國 反正沒日本的事就對了 日本在台灣那些建設是統治台灣的必要支出 真以為為台灣人好喔 好了啦 日本人有把台灣人當人看 就不會搞屠殺了啦 鬼子什麼德性
  誰不知道

  把台灣山上樹材資源砍光不知道算不算齁 反正哈日的會說那本來就日本的資源 顆顆

  便宜又近 去花錢當大爺怎麽了？ 你這非黑即白的邏輯跟反中就別用MIC一樣 還呵呵勒 覺得自己很懂喔 笑死

  原文根本沒認真看吧 就看到人家臭日本 心理就直接認定是爛片了 畢竟在我們大部份台灣人的心中 日本大哥哥是完美的 誰敢說大哥哥的壞話就要出征你 看看蔡阿嘎  只是上網寫篇負評算對你客氣了XDD

  說事實 他們就直接扣你舔中的帽子 超級可悲

  你比較急 乖

  皇民就標準的井蛙愛裝懂 看多他們留言就知道了

  皇民就白癡啊 自己舔日就算了 別人不舔也要出征 我之前說我不喜歡日本 皇民直接說我仇日 這種只會二分法的腦袋 難怪會當皇民嘛 自己媚日 結果人家韓國不媚日 就覺得是人家有問題
  笑死人

  舔日啊 之前某部台日合作的影集 裡面還刻意強調以前台灣被日本統治過勒 你說賤不賤'
