url: https://www.ptt.cc/bbs/movie/M.1710673020.A.E23.html
title: '[普負雷] 破墓(有雷)'
content: '---有雷---




  破墓的背景時代應該是跟日本的國仇家恨有關，部分設定還蠻有趣的，但覺得有些劇情實在

  是讓我覺得沒辦法給好雷，說明如下：


  1. 來求遷墓的朴家，在鬼魂跑出來之後，不太懂為什麼主角們還要先招魂？？為什麼不是

  趕快去取得同意後火葬？還要等幾個人過世後才進行？


  (1) 火葬看起來除了會讓鬼不好走之外，沒什麼副作用吧？第一段收在火葬後劇情就沒有往

  後琢磨了，所以看不出來為什麼不在鬼魂跑出來後，馬上就安排火葬？

  (2) 女主角在魂魄跑出來的時候就知道是個厲鬼，為什麼不趕快把厲鬼收了？還一直先招魂

  或想別的方法？


  2. 女主角的奶奶有多猛？劇情都稍微帶到，是要我們通靈嗎...


  3. 日本鬼變成鬼火之後也太精采了吧？跟放煙火一樣，為什麼要在天空飛那麼久？有什麼

  特別的意義嗎？


  從網路上看了一下其實這部片做了很多功課，也有很多暗喻，但劇情邏輯的部分實在不太像

  正常人遇到的邏輯，只能說是還算是可以看的動作冒險片，但要說恐怖的話，可以說是完全

  沒有。



  --'
