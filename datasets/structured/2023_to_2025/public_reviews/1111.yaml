title: '[  普雷] 韓國殭屍片：破墓'
content: '看了預告，大概就猜想不是恐怖片了

  畢竟韓片真的沒拿出什麼會恐佈的恐怖片

  就算不提韓國製恐怖片，哪國拍都一樣不恐怖

  恐怖片對我來說我只看氣氛營造跟劇情故事編得如何而已


  劇情大綱就不再贅述了


  其中比較欣賞的是帶有港片的元素

  如挖墓開棺

  以台灣習俗來說，這些場地儀式都會有煞氣，大人們會拒絕讓孩子在現場參與，所以極少

  有機會參與過程

  所以就畫面上看來，算是能一睹開墳的神秘儀式


  賣國賊爺爺這段我比較無感，也比較令人詬病


  套一句媽佛版常說的：為何死去的先人總是要影響後代？


  我尊重習俗，比如清明掃墓

  如果缺什麼的要託夢我也沒意見

  但動不動就要後代的命我就覺得不合理了…

  雖然片中有講到男主角一家的男丁常做惡夢，好像長年不祭拜，導致心生怨恨…

  但畢竟是自己的後代，親手取命也太過了

  如果可以改成因意外死亡就比較合理了，我個人覺得啦～


  而且感覺設定錯誤

  片中被索命的理應是家中男丁，如主角，主角爸，主角兒子

  但好像多要了主角媽的命了

  如要照此設定，那主角的老婆應該也逃不掉了


  所以這條故事線我就pass了


  第二欣賞點

  帶有港片元素的寄棺

  如林正英電影出現的義莊，安置棺材後總是會要求弟子好好處理正事，如腳尾飯，彈墨斗

  防禦


  片中則是用糯米圍跟馬血來處理


  然候也出現了弟子的疏忽導致棺內殭屍不見了的劇情


  這些都很港殭片的味道


  第三欣賞點

  精怪跑去豬舍屠殺


  這邊讓我想到魁星踢斗/猛鬼差館的劇情

  張學友許冠英跑去牛舍找吸血殭屍

  結果通通被送進青山XD


  這裡我想說的是，終於有類似港片殭屍吃人的畫面了

  也許是懷舊，對這畫面總是興奮不已


  第四欣賞點

  精怪吃飽了，也現身了


  這裡就像港殭片一樣，吸完血就要回床睡覺了

  然候主角還留在現場的緊張感


  這裡我個人喜歡的點是高大的身形，未露面的神秘感


  有點像麥浚龍的殭屍裡撐傘的鬼差


  然後

  接下來

  就靜靜的看完了～


  結論：

  晚上畫面偏暗

  爺爺線那邊都看不太清楚倒影

  可看可不看，消磨時間好用

  但如果在家等看串流，相信觀感會差很多，負雷會多更多


  但我想問，會給負雷的，能推薦幾片好雷的恐怖片嗎？

  好雷的標準是真的很恐怖嗎？

  這年頭啊有可以看的恐怖劇情片就偷笑了，要求好看的恐怖片再等等吧



  --'
