url: https://www.ptt.cc/bbs/movie/M.1718106335.A.06D.html
title: '[好雷] 破墓-但還是有讓人出戲的點'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  以下有雷

  昨天看了破墓


  我自己是覺得還蠻好看

  但是關於板上分兩派 一派覺得超好看 一派覺得很爛

  都非常可以理解XDD

  這部片的恐怖指數不是太高 除非一個人看 不然應該覺得有些地方蠻好笑的(?)


  破墓的四個主角群演技實在太強了

  這四個就幫這部電影不知道加多少分了


  但這部電影有幾個讓我自己覺得很出戲的點

  就是


  鬼到底怎麼飛到美國的

  雖然知道這只是電影  鬼只是跟著怨念去找子孫

  但還是好在意 好在意  有夠在意

  在意到不行

  你到底是搭大韓航空過去還是直接飄過去的

  雖然覺得不需要執著這個點  可是我前三分之一  一直在想鬼到底怎麼去美國的


  然後後面日本鬼將軍那段  變成鬼火 我整個問號

  超想在電視上面畫 ???

  你怎麼有辦法變成鬼火在天空這樣飛來飛去

  不說我還以為是澎湖花火節


  另外覺得出戲 還有有點在意的

  就是前半段的鬼是無形體的 可以漂來漂去

  後半段卻變成殭屍 (電影裡叫作精怪)

  就覺得 這個世界觀的鬼  也太多種類

  啊這幾個不是身經百戰嗎  怎麼感覺戰鬥力不是很高


  儘管有這些點


  但還是覺得這是一部很棒的電影

  整個流暢度  演技 劇本

  從女巫 風水師  五行 帶入  最後延伸到日韓的歷史恩仇

  還是蠻厲害的


  以上


  --'
