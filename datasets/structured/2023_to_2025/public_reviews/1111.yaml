url: https://www.ptt.cc/bbs/movie/M.1714838859.A.18E.html
title: '[ 好雷]  破墓 風水五行'
content: '雷文防雷資訊頁

  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  上個月看完破墓 綜合來說還算普上

  特別是前半段

  好久沒看到這麼精彩的驚悚恐怖片了


  但到了後半段畫風就有點走味

  尤其不能接受被風水師的血染濕的木頭打鬼那一段

  看完簡直滿頭問號？？？？

  這樣也行？

  木剋金？

  濕木剋火金？

  認真嗎？


  我看了很多評論  有人也說不能接受這段

  有人說電影裡有出現五行圖

  看那張五行圖就知道為什麼這樣設定

  但畫面太暗了 我看電影時就沒看清楚那張圖過= =


  後來在FB看到關於這段五行相剋的說明




  我覺得我有被這個說法說服


  如果照這樣五行反剋的設定的話 好像也沒錯？

  所以還是給好雷


  其他一些小細節：


  1風水師在跟有錢人的姑姑談墓主人時

  説到：我不知道令尊原來是個名人

  ——「在賣國方面」

  看到這裡有點震撼到

  感覺風水師的語氣是有點譴責意味的？



  2墓主人的鬼魂跑去洛杉磯找老頭

  在窗外叫老頭

  老頭一直在叫父親父親

  這時這個老頭的聲音給我感覺比鬼還可怕


  3金高銀跳大神

  不用說當然是非常精彩了

  看她拿手上的刀割臉跟自己的腳都沒受傷

  還以為是沒開鋒的刀

  卻可以割豬肉

  只能解釋為神靈護體了


  4風水的部分很懸疑

  可惜著墨有點少


  5那個日本鬼 自稱死在關原之戰

  葬在什麼寺

  我還以為是石田三成

  但應該不是啦


  6洛杉磯富豪朴志龍

  他一出場一直讓我想到年輕羅時豐

  有人也覺得像嗎'
