url: https://www.ptt.cc/bbs/movie/M.1710595875.A.314.html
title: '[討論] 破墓好看'
content: '今天看完破墓.真不愧是韓國鬼片

  前陣子看了水殺鬼

  那個氣氛真的不錯

  中間的轉折真的很精彩

  很像林正英的殭屍片～本來以為要結束了

  金高銀的演技也是超棒

  推薦看看

  底下要開始小劇透


  一開始帶到一個有錢人家

  兒子一閉眼就聽到尖叫聲

  孫子還送到醫院

  就請金高銀去看

  沒想到是祖先的墓有問題

  但總總疑雲.沒人知道為何葬在那邊

  而且還是無名墓

  也是金高銀一群人拼命移墓出來

  卻讓裡面的惡鬼爺爺跑出來(這邊不知道為什麼那個人要開棺)

  殺了兒子

  後來強制把屍體燒掉落墓

  本以為會接下一個故事

  沒想到移棺的工人中邪

  風水師又過去墓地看

  發現了底下還有棺木

  而且很巨大

  棺木底下再放棺木他們叫做重棺

  而且是豎著的

  這真的很像林正英的片

  後來他們移出那個墓

  裡面的精怪跑出來.發現是日本鬼

  助理也差點死掉

  為了救助理

  風水師與金高銀決定去處理那個日本鬼精怪

  最後是靠著風水師悟出五行

  才解決

  整部片沒有冷場

  而且接得很好

  雖然有些沒解釋的很到位

  但還是很值得一看




  --



  原來～我以為跟他們家族有仇

  咒真的不錯看.剛開始我看到有點想睡.沒想到越看越有精神

  真的

  我也期待咒能夠有延續'
