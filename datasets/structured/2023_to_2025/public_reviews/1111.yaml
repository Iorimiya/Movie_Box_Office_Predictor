title: '[普雷] 破墓:韓國活雷鋒'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  我愛說實話 直接進入主題


  破墓雖然很多幕 但是大致可以分成三個階段


  1.第一口棺


  2.第二口棺


  3.回去打boss


  邏輯順序也剛好就是 還不錯>怪怪的>到底是三小



  第一階段 就不多說了 反正中規中矩


  為了錢甚麼都好說



  第二階段 到底為什麼要自己把棺材拔出來


  然後還要放在外面等等的 把腦袋一橫 也算了



  最無法理解的就是第三段 都已經知道是妖怪了


  然後都發現那個日本妖怪在那邊睡覺了


  為什麼不報警說自己發現屍體就好?


  為什麼不報警說自己發現屍體就好?


  為什麼不報警說自己發現屍體就好?


  真的不理解 所以問三次



  總結 就是另一部抗日神劇 韓國活雷鋒


  高配版 粽邪3


  沒看過的可以等串流


  或者你沒帶腦也可以去電影院看


  --'
