title: '[無雷] 很難看的破墓'
content: '新聞稿還有廣告文宣講說非常恐怖，事實上完全不恐怖


  而且也不緊張刺激


  風水與墓地這個題材明明很好發揮，但是卻處理得非常糟糕，講的東西非常粗淺


  大概就是金木水火土左青龍右白虎坐北朝南這種程度


  而且也是點到為止不去講說為什麼凶險


  再來我是不管日本韓國過去有什麼愛恨情仇啦


  身為台灣觀眾只覺得攪在一起硬要講很莫名其妙


  而且重複的橋段不斷出現，好不容易有一個hook，馬上又草草帶過


  少數的優點是可以看到金高銀穿著巫女服跳韓國的民俗驅魔舞蹈吧，畫面還不少，很有意思


  其他真的是漏洞百出，中間一度很想睡覺


  稱不上是一個合格的娛樂片


  評分5.2/10





  -----

  Sent from JPTT on my Google Pixel 6a.


  --'
