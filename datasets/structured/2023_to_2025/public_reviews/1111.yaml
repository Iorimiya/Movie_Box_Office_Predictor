url: https://www.ptt.cc/bbs/movie/M.1709888423.A.D64.html
title: '[好無雷] 破墓'
content: '整體來說非常的懸疑驚悚

  不是一直有鬼出現嚇人的類型

  很少jump scare  或是為嚇而嚇的片段

  更多是在壓抑的氛圍

  詭譎的劇情發展

  還有轉折處表現的很棒


  有些畫面是異想不到的離奇

  看的時候心中會一直浮現：

  哇！天啊...！！

  怎麼會這樣...

  會有隨著事態發展

  一直感到訝異的情緒狀態


  風水民俗的成分描繪的很好

  整部片的節奏  除了開頭較緩

  後面都一路充滿懸疑詭秘

  結尾交代的也很完整

  片長也算有誠意

  很推薦~


  想說冷門時段去看應該沒什麼人

  結果廳滿滿的人

  只能坐第二排

  可能廣告真的打很大有差


  --

  也有拿到這個 很精美 酷酷的XD

  鬼片 恐怖片品質落差很大容易踩雷

  這部我覺得是水準之上  值得推薦

  如過喜歡看血腥殺人的 可能會不滿足

  這部血腥片段不多

  因為這部主打懸疑 不會很恐怖 所以我覺得小廳影響不大，如果是鬼玩人這種就差很多'
