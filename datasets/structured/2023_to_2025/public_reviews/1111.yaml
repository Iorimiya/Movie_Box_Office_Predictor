url: https://www.ptt.cc/bbs/movie/M.1710265688.A.F4C.html
title: '[雷] 破墓 熱血驅魔片'
content: '雷文防雷資訊頁






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  衝著金高銀看的

  在完全沒有做功課的情況下去看的

  先說想要看恐怖片就算了

  這部片類型比較像民俗文化片

  這部片讓我想到薩滿

  前面都是結合民俗文化去解決事件

  後面遇到的其實更大條

  但比薩滿好看很多薩滿到後面三分之一根本編劇跑路==



  前半段朴家的劇情那部分算比較可怕一點

  但以常看鬼片的人來說應該應該就是沒什麼

  朴家就是一個障眼法

  但前面的氛圍真的不差

  志龍被電話迷惑那段讓我想到日本的電影來了

  也是用電話迷惑很有趣

  聽到開窗戶就知道志龍死定了


  但這爺爺有夠缺德被放出來就跑出來實行斷子絕孫術

  但不知為何要幹掉媽媽？

  以為棺材燒掉後爺爺會作妖一陣子結果就沒了

  姑姑跟志龍講的好像有什麼大秘密結果就是爺爺是叛國賊嗎？不懂



  後半段就是國家大義跟熱血驅魔片

  後半很像梵蒂岡驅魔師

  熱血打怪一點都不可怕

  但劇情真的很欠吐槽


  金師傅就開始不斷作死

  說好聽點是有職業道德後續服務做的很周到

  說難聽點就是找死

  也沒有解釋人面蛇是什麼我覺得那是全片最可怕的東西

  挖到棺材後還把它拖出來？？明明知道這東西不要碰


  後來特寫棺材裡的畫面整個是暗的

  角色看起來超害怕但我就是一臉蛤？？？

  看到頭盔才知道原來裡面是頭盔


  遇到精怪後金師傅還跑去那個地方再挖

  真的就是作死

  後面還扯到國家大義叫大家去送死


  但不得不稱讚紅豆杉那一段金高銀演的很棒

  氣氛整個很到位相比之下金師傅那裡有夠蠢的

  整個人一直在伸張民族精神


  武士精怪一點都不可怕就是一個大巨人

  會讓人覺得是在打金剛

  我都覺得出現一幕腳的日本精怪還比較可怕


  整體來說把這部片當作梵蒂岡驅魔師來看會很熱血


  定位正確就是一部不錯的片

  感覺就是想再出續集

  但有的話應該也是會去捧場

  這四人組組合很有趣

  還有本部片沒有可愛的小動物受到傷害

  以恐怖片來說非常的棒




  --



  對對  希望能多著墨一些職業的部分

  好像是一個湖被蓋了一座橋

  真的看到那畫面真的毛一下

  原來如此感謝P大科普

  想說把媽媽宰掉很不合理

  前面真的有到位 後面小可惜一點

  真的感受到導演一直在臭日本哈哈

  哈哈所以定位正確就不會難看了

  感謝J大科普


  對 劇情也沒有說明 那臉真的讓我嚇一跳'
