url: https://www.ptt.cc/bbs/movie/M.1710086376.A.D15.html
title: '[討論] 《破墓》'
content: '《破墓》的故事從四位風水師、葬儀師、巫女、巫覡接受了一個巨額資金委託案開始。他

  們被這一場觸目驚心的未知力量吸引，踏入了一個詭異墓地，由此展開了一連串驚悚無法

  預測的駭人事件。影片劇情紧凑，風格獨特，無論是過於親近的死亡威脅，還是那些充滿

  神秘色彩的角色，都將讓你陷入深淵的恐懼之中。


  附上購票禮




  《破墓》的魅力在於它將恐怖與神秘完美結合，將超自然元素與現實生活巧妙地交織在一

  起。


  劇情發展過程中，無數驚險刺激的場面讓人屏住呼吸，而劇情結束後，留下的卻是深深的

  思考和反思。


  感覺整場一直在聽誦經

  蠻訝異金高銀會接這種角色

  不過演的很好真的蠻像真實的巫女

  雖然做法有些畫面有點血腥


  總體來說喜歡風水民俗劇的應該會喜歡

  劇情很光怪陸離


  --

  03/11 00:02'
