  -

  防雷


  結束

  -

  -

  .

  .

  .

  為什麼殯儀館的人說爺爺沒有入殮？

  「入殮」，俗稱「入木」，是台灣喪禮習俗中一個重要的儀式環節，比較白話一點的解釋，

  就是「將逝者的遺體處理後放入棺材內」的這個動作



  不是已經放入棺材內了

  哪裏沒有入殮？？

  不太懂這一塊


  --



  謝謝大家 車庫娛樂的翻譯一直都蠻有問題'
