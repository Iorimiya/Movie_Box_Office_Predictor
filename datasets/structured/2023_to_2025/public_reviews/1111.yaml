title: '[請益] 破墓最後一段的一些疑問'
content: '請教大家，

  劇中峯吉被抓肝臟

  躺在醫院顯示縫線肚子左邊？

  我以為我看錯了

  劇末金相德被精靈破肚抓肝臟後

  也是左邊破肚？？

  但是

  肝臟是位於腹腔右上區塊！！



  然後墓穴內抓起華林和高長老時

  劇中開始還原精靈武士的由來

  先有一把武士刀燃燒

  武士被斬首

  然後術士把武士頭拿起來後

  將武士刀嵌入武士身體

  再把武士的頭和身體縫合

  術士和武士在陣法中央

  外圍是陰陽師唸咒做法

  但是最外圍是日治朝鮮時期

  “日本軍部”的軍人監督法會！！

  最後由軍人將棺木垂直吊入墓穴中


  武士不是關原之戰就斬首了？

  葬在大德寺後被帶（盔甲）來破壞朝鮮國運？

  怎麼會有屍體出現在日本統治朝鮮的二戰期間？


  我看完破墓後有上網找資料和YT 祖寧破墓解析，好像沒人問過導演？



  --

  我也是這麼想'
