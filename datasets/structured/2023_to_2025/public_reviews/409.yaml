title: '[好雷] 警上添花'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  印度裔的英國紀錄片女導演桑蒂亞‧蘇里，首部劇情長片還是從剖析印度的社會議題下手

  ，沒想到一鳴驚人，不但代表英國獲選2025奧斯卡最佳國際影片15強，還入選坎城影展一

  種注目單元競賽片。今年金馬奇幻影展也收錄在「極致驚悚」單元，帶觀眾看見印度最驚

  悚的真實面貌。



  桑托絲結婚兩年，她的警察丈夫剛在一場暴動中殉職，她隨即也被狠心的婆婆逐出家門。

  桑托絲雖身為女性，卻毫無任何優勢，甚至得周旋於一群濫用公權、爭功諉過的警察同仁

  之中…。



  當一名低種姓的年輕女孩遭到謀殺，屍體還被扔進鄉村的井裡。桑托絲的認真負責與正義

  感，讓高級女督察莎瑪印象深刻，亦師亦友的兩人於是聯手辦案，同時面對來自社會深層

  ，包括階級、性別、信仰、種姓制度等問題，以及警察執法時的各種弊端…。



  一般人對歷史悠久的種姓制度並不陌生，至少在求學時期的社會課本內一定都讀過，不過

  ，即便印度憲法明令禁止種姓歧視，對居住在大城市的年輕人來說，種姓的影響也已經不

  大，但時至2025年的現代，在鄉下與傳統印度社會中，種姓制度仍舊無所不在。《警上添

  花》的故事背景便是設定在鄉村，所以不要說居民之間的對立與歧視，就連警察都不願處

  理低種姓少女的屍體。



  由於種姓制度本質上來自印度教，因此，不少低種姓的人民為了逃離低下階層的生活，在

  改革種姓制度的時期紛紛改信佛教或伊斯蘭教。片中的女孩德薇卡甚至是不屬於任一種姓

  的「賤民階級」，而與她曖昧的男孩薩林則是來自貧窮的伊斯蘭家庭，可想而知對村長階

  級的人來說，他們都是不足一提的人，或不配稱為人。



  高種姓者將虐死後的貓狗屍體投入低種姓村落的井裡，讓他們無法擁有乾淨的飲用水，而

  不得不跋涉到高種姓的村落來取水，但因為兩者間的階級差異，還得受到言語上的諷刺、

  騷擾或污辱。從德薇卡的案例來看，她甚至遭到性侵，匪夷所思的是，倘若賤民階級真的

  如此不堪，那這些與她發生關係的男人豈不陷入「不潔」的困境？只能說，何為容許的接

  觸，何為不容許的接觸，都是高種姓者的自由心證。



  「要先達到量變，才能達到質變。」



  除了種姓制度之外，《警上添花》也從兩位女警的角度看待印度的性別議題。其實，不光

  是情節重大的性侵與謀殺，就連日常生活的相處與婚姻關係，都還是看得出印度的性別不

  平等。根據國際人口科學研究會與人口理事會的調查，印度只有不到5%的婚姻是「自由戀

  愛」，也就是說，幾乎所有的婚姻都是「包辦婚姻」或在網路發達後出現的「半包辦婚姻

  」。



  但是，桑托絲與丈夫是自由戀愛成婚的，電影開宗明義就告訴觀眾，主角是名懂得獨立思

  考的新女性。她甚至在婚後不與公婆同住，而是與丈夫一同住在警察宿舍內，所以丈夫殉

  職後，婆婆認定桑托絲幾乎不曾待過那個家，決定將她掃地出門。不得已之下，桑托絲才

  靠著喪偶優惠繼承丈夫在警隊內的職位，因此即使她也是通過警察考試的正式雇員，同事

  仍然不把桑托絲當一回事。



  印度良心阿米爾‧罕製播的電視節目《Satyamev Jayate ( Truth Alone Triumphs) 真相

  訪談》第一季的第一集便是討論由於嚴重的重男輕女觀念而導致的墮胎問題。可是，隨著

  社會進步，女權意識漸漸提升，印度重男輕女的問題逐漸減少，又或者真的有減少嗎？



  調職過來追查德薇卡命案的莎瑪警官，在上任第一天的演說裡就清楚表達，這些性別剝削

  造成的慘案，一部份的原因是警隊自己內部的女性同仁人數都太少，實際的性別平等才會

  無法實踐。莎瑪警官致力於偵破此樁案件，她認為如果能夠殺雞儆猴，以後這些該死的男

  人在非禮女性之前才會懂得三思。《警上添花》從各種非正式與正式的性別互動關係告訴

  觀眾，女權的確已經漸漸在印度抬頭，但距離性別平等還有一大段路要走。



  「對社會大眾來說，公平正義已經聲張，你就這樣想就好了。」



  懂得獨立思考的桑托絲，在拜訪德薇卡家時，發現手機內與曖昧對象薩林的簡訊，所以開

  始追查對方。不過，證據不足與未經審判的定罪過程讓她對真相為何耿耿於懷。在親自查

  看薩林的手機之後，桑托絲發現對方的確如其所言，在案發那幾天前往孟買，甚至還將自

  拍照傳給心儀的德薇卡。得知真相的她無法接受，前去找莎瑪警官對質，沒想到莎瑪警官

  居然告訴桑托絲，在印度要遠離兩種人，一種是沒人想碰的賤民階級，一種是碰不得的高

  等人。對莎瑪警官來說，她的目標是威嚇未來意圖不軌的男人，那這個結果雖無奈但也已

  經是最好的結局。



  「你不會有事的，未來會前途似錦、錦上添花。」



  莎瑪警官對桑托絲來說，是導師一般的存在。她看到同仁不重視這位潛力十足的菜鳥警花

  ，便把桑托絲帶在身邊，親自指導她，也會在兩人成功擒拿嫌疑犯之後，體貼地為桑托絲

  別上鑽石鼻環，或是在對方半夜睡不著覺或工作夜歸之後，溫柔地送上安眠藥或熱騰騰的

  晚餐。就算在親眼看見莎瑪警官也會刑求嫌疑犯之後，桑托絲對這位導師的尊敬減少幾分

  ，甚至連慢跑都不再穿著莎瑪警官送她的運動服，但在刑求東窗事發時，莎瑪警官一肩扛

  起所有責任，保護好她認為尚未遭警界污染的桑托絲。



  當然，凡是正直的人，都無法忍受這樣的有毒工作環境。桑托絲也不顧自己本來是否會前

  途似錦，便毅然決然離職。本來要返回來家的她，在火車站聽到誤點兩小時的廣播，看著

  對面月台的情侶互動，想到德薇卡與薩林此時可能正在天上開心地相聚。早已體會到權力

  與自主的桑托絲，根本無法回鄉去過著受人擺布的媳婦生活，便跳上孟買的火車，前往薩

  林口中的夢想之地。或許到那裡之後，自己的人生才終於可以錦上添花吧。



  《警上添花》尖銳地呈現出印度警界的黑暗面，因此這部描寫當地故事的作品，卻遭到印

  度「禁演」。電影從桑托絲的角度出發，像是誤入叢林的小白兔一般地一點一滴看見更多

  。不論是用餐時看到拿中國與印度警察相比的諷刺短影音，還是親身經歷很照顧自己也尊

  敬萬分的長官，冷嘲熱諷需要報案的賤民，甚至是在無意間發現警察亂抓人只為取得賄賂

  ，或是為了不要讓自己變成薪水小偷，只好跟著長官們一起刑求嫌疑犯，卻沒想到皮鞭留

  下的傷痕讓莎瑪警官面臨停職。



  比起很多探討社會議題的電影，《警上添花》在觀影過程中並不會太過沉重，因為劇情不

  斷地翻轉再翻轉，讓人沉浸在破案的高潮迭起之間。但當坐在火車內的桑托絲，小心翼翼

  地將鑽石鼻環交給兜售餅乾的小女孩，觀眾的心卻不像放下的鑽石鼻環，反而才正要被片

  中角色的犧牲與無奈給狠狠攫住，喘不過氣。


  --

  Viola''s World：Screen Scream影迷尖叫屋


