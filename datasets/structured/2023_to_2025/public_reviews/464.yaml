url: https://www.ptt.cc/bbs/movie/M.1743345768.A.222.html
title: '[好雷] 大畫特務2 遠超出期待的收官之作(應該)'
content: '五年前我好像是板上唯一給前作負雷的


  帶著對人物設定的熱愛與劇情發展的期待，今天買票進場支持


  本來前半段加了不少配角，還有很尬的漫畫場景跟三角戀愛，以為又是一部負雷


  (即便新女角很香、演員演技在線)


  但到了故事中段，當阿俊開始重新構思漫畫作品時


  那個漫畫場景結合現實的分鏡創意，直接把我啪啪打臉


  而且後半段的劇情張力屌炸天，片長剩下不到一半的時間


  要把BOSS的動機跟背景交代清楚，同時讓反派智商在線其實沒那麼簡單


  當然這種喜劇片，重要的主角配角一定都不可能領便當的，反之不重要的就...


  最後走出電影院，我仔細回味劇中的感情線，可以說編劇跟導演都下了苦功吧


  父女、夫妻、特務三人組(前半段迷弟跟隊長各種截胡超有義氣)


  鋪陳都很清楚，女兒那段為了媽媽的自白更是震懾人心


  這部片最衰小的就是漫畫編輯還有總部被偷襲的後勤們


  片中也有一些致敬影視動漫作品的橋段，提到韓國時事，看了讓人會心一笑



  大概就笑到這吧


  想到明天的台股，我露出像影片中阿俊看著手機的苦瓜臉


  起碼人家有很正的老婆，唉


  --'
