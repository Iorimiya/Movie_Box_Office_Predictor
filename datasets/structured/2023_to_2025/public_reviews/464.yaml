title: '[好雷] 大畫特務2'
content: '我看電影還滿挑剔的，也很會猜劇情，一些劇情太容易猜的電影，會覺得比較無趣


  但這部真的滿有趣，有創意的，沒那麼好猜


  然後也真的笑得滿開心的


  對韓國電影有點刮目相看了



  然後可能因為白雪公主佔了主要的廳，整個電影院都沒什麼人，連廁所都只只有開放1/5


  我看大畫特務2整廳也只有我們兩個人


  真的覺得這部不錯，要給大家看到，推一個


  --'
