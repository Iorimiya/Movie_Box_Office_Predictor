url: https://www.ptt.cc/bbs/movie/M.1455453609.A.3F5.html
title: '[好雷]單身啪啪啪-花若盛開 蝴蝶自來 '
content: '這部片如果單純只看預告片跟片名的話，真的會以為是部一堆單身者瘋狂約砲的爛電影，

  只能說片名取得實在很差。但在214情人節這天，不怕被閃瞎的魯蛇我自己跑去電影院看

  了這部疑似很糟糕的電影，說出「單身啪啪啪一張」這句話時，真的是無比的尷尬。


  ----------------------以下有雷-----------------------












  ALICE-故事的主角，突然想要享受單身生活的一位女孩，在故事一開始便不顧她男友的感

  受，提出了暫時分開的想法，之後認識了羅蘋，與她一起開始享受荒誕的單身生活。


  在ALICE玩夠了之後，想要再回到原先男友身邊時，原先男友卻已經有了新的女友，ALICE

  只能選擇繼續尋找新的對象，但我認為此時的ALICE，只不過是不干寂寞而不斷地想尋求

  心靈的慰藉，她愛上的，不是其他的男人，而是依賴。一種能讓自己繼續依賴他人活下去

  的感覺，在沒有男人陪伴時，她連自己的衣服都脫不下來，連電視切換回英文這類小事都

  無法自己完成。


  而在有人可以依賴時，她卻只不斷地將自己形塑成對方所愛的樣子，而不是思考如何讓自

  己成長。


  在不斷地自怨自艾後，被好友羅蘋給點醒。她開始練習過自己的人生，不再為了別人而活

  ，她開始練習自己將衣服脫下來、挑戰自己一個人登上大峽谷。因為ALICE已經明白，當

  她更愛自己時，所展現出的自信，便能夠為她吸引來下一段愛情。


  「一轉身，愛情就來了。」

  在擺脫了別人的陰影並且想通之後，ALICE成長了，或許也遇到真愛了。





  在單身時，我嘗試了很多以前不敢做，或者是想做但一直沒有動力做的事情，舉凡一個人

  旅行、一個人騎上一整天的車、在書局讀上一整天的書、自己一個人看電影等事情，以前

  的我曾經做甚麼事情都會有所顧慮，但在剩下自己時，就沒有後顧之憂，也是讓自己成長

  的時刻了，並不是為了再次追求下一段感情而不斷地去改變自己的本性，而是改變自己本

  來的缺點，做自己本來不敢做的事情，因為相信花若盛開，蝴蝶便自來。


  愛情不是迎合，而是彼此吸引。


  當一個人愛自己且有自信後，便會產生吸引力。


  這部片很適合每一個單身的人，別再認為自己沒人愛，那是因為你/妳還不夠愛自己。


  --'
