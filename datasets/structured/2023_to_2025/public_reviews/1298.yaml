title: '[新聞] 「花若盛開」記錄耆老郭火炎 守護山林的堅持'
content: '「花若盛開」記錄耆老郭火炎 守護山林的堅持


  2023/11/4 12:43（11/4 14:26 更新）



  客委會紀錄片「花若盛開」歷時3年拍攝，記錄苗栗縣獅潭鄉98歲耆老郭火炎一家的故事

  ，帶觀眾看見客家族群與山林共生的智慧。（春雷創意提供）中央社記者王心妤傳真 112

  年11月4日


  （中央社記者王心妤台北4日電）客委會紀錄片「花若盛開」拍苗栗獅潭鄉98歲耆老郭火

  炎一家人，他從小接受日本教育後來養育一家大小，現在雖行動不便仍堅持行走守護山林

  ，能看見客家族群與山林共生的縮影。


  電影公司透露，生態作家劉克襄觀影後分享，曾在獅潭與駕駛農機車的郭火炎擦身而過，

  被對方般勇猛駕車的速度嚇到差點開到山溝裡，沒想到他正是電影的主人公，這樣的緣分

  很特別，「電影藉著阿炎伯的一生，近幾年的現況，去推衍山城的現今，也撞擊出一個新

  的里山情境。」


  「花若盛開」同時走進大專院校，有馬來西亞交換學生因紀錄片對客家文化產生好奇，座

  談結束後仍跟導演邱銘源額外聊近2小時，讓邱銘源相當感動。


  「花若盛開」歷時3年拍攝並曾獲金鐘獎肯定的春雷團隊拍攝，昨天起開放觀眾報名特映

  會，18日在台北及台中起跑 ，19日抵達桃園、新竹及苗栗，25日在台北、高雄及花蓮，

  26日前往屏東及台東，期待讓觀眾看見台三線桐花山林之下獨特的人文風景與生活樣貌。

  （編輯：李亨山）1121104



  --'
