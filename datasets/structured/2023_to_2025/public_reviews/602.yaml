title: '[負雷] 死命必達'
content: "月初看的，因故拖到現在來奉獻一篇\n\n十年以上沒看泰國片了\n以前看完泰片都感嘆他們電影工業之優秀\n看完這部大傻眼\n明明照著開頭拍\n就能成就一部有趣又好笑的鬼片\n\
  非要穿插個很硬凹的愛情線\n\n一開始把外送跟靈異結合很有創意\n本來準備看他們的奇遇，各種爆笑外送經驗\n結果……戀愛？？？台詞還尬成這樣orz\n我只知道男女主角很受歡迎\n\
  但對手戲完全看不出他們的演技\n越看越煩，很希望快點結束\n\n兩位大叔配角從頭到尾一搭一唱很爆笑\n每次出來的台詞都很絕妙\n我就問男女主角為何一對話就很尬？！\n\
  \n女主角明明人設聰明伶俐\n急轉直下變成要人拯救的角色\n讓她成為一起評鑑鬼屋的厲害女角不好嗎？\n\n其他鬼屋部分其實拍得不錯\n但愛情線佔了全片一半以上\n\
  所以實在不推，可惜了兩位好笑有梗的大叔\n\n\n--\n\n     「完全犯罪就像第一次下廚的的老爸，注定會失敗。」\n\n               \
  \                                     －古畑任三郎\n\n--"
