title: '[討論] 洪常秀《四層公寓》的一個小梗？'
content: '今晚剛看完洪常秀的新片《四層公寓》，是說我自己發現片中一個有趣的點，不知道是不

  是洪導故意的，分享給大家～


  權海虓飾演的男主角和宋宣美飾演的廚師女友交往後在餐桌上的對話，權海虓說不想去參

  加國外的回顧展了，宋宣美回說本來想藉此出國走走，後來權海虓說不然可以去日本，之

  前他去過的「福岡」很不錯。





  聽到「福岡」我就笑出來。因為我馬上聯想到權海虓 2020 年主演張律的電影《福岡》，

  劇情描寫幾位韓國人到福岡發生的一點日常小事。中國裔的韓國導演張律和洪常秀年紀相

  仿，兩人的電影風格時常被拿出來比對，不過張律的國際名氣應該算小輸洪常秀一節。恰

  巧，《福岡》在 2020 年的柏林影展首映，入選論壇單元，同年洪常秀的《逃亡的女人》

  在主競賽拿了最佳導演。而今年柏林上張律的《白塔之光》終於進了主競賽，洪常秀的《

  在水中》則去了邂逅單元。


  不知道這是不是洪常秀因為知道自己常被跟張律作比較，又用了同樣的演員，拿來自嘲的

  小梗，或是一切只是偶然XD


  不知道有沒有人跟我一樣發現這個小地方XD


  --'
