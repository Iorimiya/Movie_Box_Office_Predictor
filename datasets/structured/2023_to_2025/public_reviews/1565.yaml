url: https://www.ptt.cc/bbs/movie/M.1688961477.A.130.html
title: '[好雷] 四層公寓 Walk Up'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~












  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  網頁版：


  故事圍繞在一棟公寓，四間住戶，一場夢境。一位導演，幾名女子。一開始是導演帶著自

  己女兒來找一位室內設計師，看起來似好久不見，女兒想學室內設計，所以帶她來拜師，

  在一張桌子上，左側是室內設計師aka公寓房東，右側是導演與女兒，三人對談中時有時

  無的停頓與凝滯，塑造出的不自然感很自然，每個人各有各的欲言又止，那些客套寒暄問

  候，都藏著不同的念頭。


  對洪常秀的電影不是很熟，但前一部看的正好也是權海虓擔綱主演的《那天以後》，該部

  電影中他詮釋一名小有名氣的出版社社長，這次則是電影導演。同樣是充滿才情的男性，

  劇情脈絡也圍繞著幾個不同的女性轉，但電影最富興味的是角色之間的對話，以及打破線

  性的敘事手法。


  非線性敘事開展的夢境故事


  《四層公寓》裡，每一層都正發生著不同的故事。電影用一種如夢似幻、分不清是現實故

  事還是想像畫面的剪接敘事，讓觀眾一同陷入迷霧之中，剪接的點十分巧妙，幾乎不著痕

  跡的轉場，尤其是最後一段透過進入車裡、再從車裡下來的橋段，完美銜接回故事一開始

  分歧的節點。


  設計師房東，是帶動整個故事流動的主要人物，畫面隨著她拾級而上，由她口述介紹每層

  樓的住戶樣貌，從一二樓的餐廳私廚、三樓情侶的套房，到住著畫家的頂樓。最後到頂樓

  時，她與導演的一席談話，誠摯地表示如果導演來住這裡，她甚至可以不收他房租，這成

  為後續故事開展的開關 — — 住在這棟公寓裡，會有什麼樣的發生？


  另外，在女兒與設計師房東的對話中也埋下了伏筆：什麼才叫做最真實的「自己」？是在

  家人面前那個膽小、較女性化感覺的導演；還是在工作領域才華洋溢、感覺無所畏懼、充

  滿自信的他？


  在第二段故事中，導演與設計師房東到了二樓餐廳吃飯（有別於第一段是在一樓的餐廳）

  ，在與女廚師以及設計師房東的三人對話中，言及導演嚮往在國外定居、靈感滿溢的生活

  狀態，以及對於自己無法真正回家 — — 與家人格格不入的矛盾感。在他拍出一部部好

  電影的檯面下，其實仍滿載現實與理想的角力。



  到了三樓，導演與另一半居住在兩人公寓，因健康微恙中止了拍電影，整天在家，過著吃

  素養生的生活，儘管出現到國外參展的邀請，他仍礙於自尊與個人理念而裹足不前。對照

  房屋處處漏水卻未能修繕，就像是從裂縫中滲透而來、不得不面對的現實窘境。當女友出

  門久未歸，他躺在床上邊睡邊等待的同時，出現畫外音的兩人對話，更深刻模糊了夢境與

  現實的疆界，如果躺在床上的是自己，那畫面以外與女友對話的那個又是誰？


  最後在頂樓的生活，導演與不動產公司的女業務交往，在寬敞的頂樓，兩人吃起了燒肉，

  女生央求再聽一遍他曾說過看見耶穌的神蹟體驗，他繪聲繪影地重新講述了一遍耶穌告訴

  他：「你會在濟洲島拍十二部片。」所以他現在只要籌劃搬去濟州島，一切就沒問題了。

  （這段同時令人聯想起第一段設計師房東介紹想搬去濟州島的頂樓房客、以及與女廚師聊

  天提到關於宗教的存在性。）



  有趣的是，這一段和上一段，都同樣安插設計師房東前來敲門，以不小心拆了他的信的藉

  口，來找導演，而兩次導演都提出要求房東處理的問題（三樓漏水、頂樓浴室排水堵塞）

  ，這兩個小地方環環相扣，更加深了這四場故事的共時性。


  最後，住頂樓的導演跟女房仲下樓要出門兜風，導演隻身站在一樓屋外抽菸等待著，這時

  一樓餐廳的男服務生開著導演的車出現，下車寒暄了一番，稱讚著他這部中古車保養得很

  好，也很好開，後來導演上車，下車。下車後，接回第一段女兒跟設計師房東說要下樓去

  便利商店買酒回來，對白馬上切換到最一開始女兒和設計師在等待暫時外出的導演該段主

  線，無縫接軌。



  黑白的畫面襯托富有色彩的畫面與對白


  個人最喜歡則是第二段導演、設計師房東、女廚師對話的場景。女廚師不斷表明自己是導

  演的電影粉絲，不只一次重複提到「你真的拍得很好」，導演也不只一次詢問「你喜歡我

  拍的電影哪個部分」，加上好幾次的乾杯與倒酒以及重複性的對白，營造出一種生硬感，

  連觀眾都不禁侷促難耐。但當設計師房東離開畫面去拿威士忌，安排導演問了一句「你害

  怕嗎？」最後兩人凝視對方靜默的片刻，將疏離與親暱的矛盾糾結張力拉到最高。那一刻

  兩個人在想些什麼？留給觀眾自行想像。


  導演演繹了四層公寓中不同版本的自己，卻在這些不同版本的故事裡，映照出相同的命題

  ，關於內在的恐懼與外顯的無畏；關於現實和理想之間徒勞無功的拉扯；那些夢境角色之

  間表現出的尷尬與突兀，或許就是男主角內心的矛盾展現。


  如果沒有看過洪常秀導演的作品，或者平常較少看這類型電影的話，大概會覺得有點難進

  入劇情，想要看的話，最好就趁上映期間到電影院觀賞，才能確保在不會分心的兩小時內

  ，好好感受它帶來的體驗。




  --



  世間所有的相遇，都是久別重逢。


  --'
