url: https://www.ptt.cc/bbs/movie/M.1689752579.A.3C0.html
title: '[好雷] 四層公寓 - 恆常建築與不斷相聚離去的人'
content: '南韓歐美影展常客洪常秀的新片

  目前院線還零星上映中


  另外

  那個文章不知不覺放了一些自己過去對於日常的空間與時間的體悟

  如果不喜歡可以略過







  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  (刊登於網誌的原文)




  似乎重拾導演洪常秀作品早期對於日常生活中相似愛情經驗的場景、人物、事件進行結構

  性的錯位與重組。而這次發生的主要場景：公寓，儼然將焦點以往是重構的組件提升成一

  種概念方式。並從過去洪常秀電影焦點往往放在角色關係與對話上，讓人更加察覺其實他

  在空間的鏡頭的呈現、安排與描述有其獨到一面，甚至就科幻一點來說，一種生活上對於

  空間與時間的想像（錯置），其實不就是一種科幻狀態的嗎？有別於諾蘭那種強調科學史

  的神聖感的正統方式（舉例），《四層公寓》的物質建築與人的虛幻意識之間的科幻感還

  更加地讓我們融入在日常經驗的其中。



  主角（權海虓飾）身為導演職業參與了公寓每層樓的三段故事，邏輯上故事間具有因果關

  係（例如漏水、帳單等等）。但主角身為導演除了是以往洪常秀作品的創作者主人翁，於

  是看似角色扮演本身每一故事都有部分的主觀設定，但也許更重要的是，近年來洪常秀創

  作早已從對愛情的描述明顯更加關懷生命的狀態，如同《四層公寓》描繪的客觀性企圖：

  結尾時又巧妙地回到的電影開頭原初的畫面，像是畫了一個圓圈；如同《在你面前》結尾

  偷偷像是回到電影最一開始的「迴圈」：人生就像是做一場很長很長的夢（註1）。意謂

  著導演生命（或影射著我們的人生）像是原地踏步似的。



  公寓的每段故事印象最深刻大概會是《四層公寓》的長鏡頭畫面，如此推測必須仰賴著演

  員的即興，內容也涉及了洪常秀不同時期的創作者主人翁心態，例如：「愛情說來可笑」

  風格，仰慕導演的才情卻也說不出到底喜歡導演的甚麼，如此以「形而下」的喝酒喇賽是

  洪尚秀過往招牌男女互動方式（註2）；或是另一方面近期更加思考生命與人生，一段睡

  著遇見上帝令人想起《引言》，只不過《四層公寓》比較是在嘻笑的邊緣偷渡人生體悟；

  又或者因為導演年紀逐漸老邁（如洪常秀），話題時常膠著著健康、飲食、喝酒與抽菸等

  在嚴肅與隨便看待之間。



  而故事之外的留白與轉場是《四層公寓》精心設計抑或洪常秀多年直覺與創作功力的展現

  ，並且依舊保持著（不刻意）日常的偶然性，如在陽台上每個人偶會經歷的放空，這樣的

  短暫無時間感，對峙著公寓的場景描述黑白的空間感，如白色階梯貼著黑色止滑貼條，像

  是暗示著黑色的必然毀損與水泥的長駐（若沒被刻意拆除，至少大於人類生命）。



  於是當利用角色扮演的主觀性與某種似曾相似感的客觀姿態，也像是指稱著特殊事件與日

  常時間性之間的關聯。或是就好比地理上的客觀（電影四層公寓的客觀），就如同現實中

  等紅燈時會想到，自己回家時熟悉不過的路（日常），對有些人（周遭的騎士）來說可能

  是第一次的來到（特殊），無法相見的經驗差異（註3）。



  又好比「平行宇宙」，這類西方科學理性斷定的時間與空間的科幻經驗肯定不適合用來詮

  釋《四層公寓》的鬆散隨意，也許用「石橋」佛教典故解釋會更加周延：外界的物質不變

  ，只是自己的心境使然，一切像是夢境般經驗。僅僅為了人世間「遇見」的偶然與緣份。

  也許只是在五百年的輪迴當中，相對於化做石橋（無感）的風吹雨淋（作為人）僅僅一次

  的相遇，飽受生命的造化之苦，正是那愛情、親情、甚至《四層公寓》中創作電影所有的

  情感羈絆之苦。



  於是在《引言》中的海灘與旅館，還是導演以前作品常見的那個海邊旅館嗎？就如同日本

  藝術家杉本博司曾經拍攝各地的海面，像是地球最古老的「化石」，生命不斷來去，但海

  洋幾乎永恆不變（註4）。



  素樸的時間性。



  好比大晴天，看到遠方的山脈層次一清二楚就好像很開心、很有希望。但下雨天的山，陰

  霾霧濛濛幾乎看不到了，但是山還不是都一樣，默默地承受外在賦予的一切，不管晴天雨

  天照常繼續。《四層公寓》在恆常的水泥建築上演一段又一段故事中那些不斷相聚又離去

  的人，以及相對於偶然會看到在建築物外（或陽台上）（也許不認識）那位抽菸的人。時

  間照常繼續，（老師音樂下，謝謝。）這時就會開始響起了洪常秀式配樂。




  （註1）詳見筆者《在你面前》舊文





  （註2）

  用了輕浮的社交男女關係，才能對比出藝術的「抽象」與高深莫測，…藝術本來就應該是

  甚麼都不是的東西，因為無法語言地無法定義，才需要一個名詞去形容它，這種狀況其實

  在一般人遇到無法解釋的事件很常發現。但這邊不是要討論藝術是甚麼，而是片中那個在

  喇賽與認真對待的創作生命，最後好像也只能一笑置之，…

  詳見筆者《錯戀/這時對，那時錯》舊文




  （註3）關於「地理上的客觀」概念：該怎麼看待等紅燈時旁邊騎機車的騎士？之前因為

  辦事要騎機車到三峽這個有點遙遠的地方，遙遠到騎車的人像是陌生的自己，要回家的時

  候，有時候會想，旁邊一樣騎車的人，並非像自己一樣特地來三峽只有在這個時刻才會出

  現，而是他們可能每天下班都那樣地經過；就如同自己回家時熟悉不過的路，對有些人來

  說可能是第一次的來到，無法相見的經驗差異。




  （註4）詳見筆者《置移的時空》舊文中提到《引言》





  P.S.

  洪常秀的《四層公寓》 英文是walk up 韓文title "PTT無法顯示"（top 頂端（不是BIGBANG的成員

  ） / tower塔 ）。


  突然想到 台北眾多的步登（老）公寓「walk up」apartment並有其特殊的歷史淵源。很

  遺憾，並沒有拍出這樣（建築感）優秀的作品（不是很愛酸啦（不然你來），真的只是突

  然想到）




  --


  拉特飯 - 以商業力量進入獨立市場

  (剛搬家內裝待修)


  --'
