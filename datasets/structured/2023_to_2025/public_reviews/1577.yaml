url: https://www.ptt.cc/bbs/movie/M.1688184028.A.BA9.html
title: '[普雷] 惡靈古堡死亡島—比瑪利歐還粉絲向'
content: '先別會錯意，瑪利歐確實是很粉絲向的電影

  但即使不是粉絲，電影本身娛樂性也夠，

  敘事跟劇情順暢讓一般觀眾也能好好享受。


  相對來說惡靈古堡的粉絲就偏小眾一些，

  而惡靈古堡動畫電影又更小眾了，

  所以整部電影大概只有系列粉絲看得下去。

  非粉絲的人如果被男/女友或朋友拖去看，

  心得大概除了吉兒奶子真大以外，

  就是滿滿的「屁啦」跟「我看了三小」。

  而身為系列作粉絲看完死亡島以後，

  我的心得也是「屁啦」跟「我看了三小」，

  但惡靈古堡動畫電影一直以來就是那個調調

  甚至遊戲本身還玩得更過分，

  所以就會知道這些只是製作組腦洞的常態。


  首先場景間的轉場都有夠突然。

  劇情的交代也都很破碎，銜接得很不自然

  當你還在試圖理解發生什麼事的時候，

  就被各種槍聲搞得震耳欲聾。

  這邊要稱讚一下這次的音效，

  不論槍聲或爆炸都做得很到位，

  在大螢幕聽確實很過癮。


  主角們的關係則是幾句台詞就帶過，

  沒有其他太深入的互動，

  不是系列作粉絲還真的會覺得莫名其妙。

  主角體質則是一個比一個還鬼扯，

  女生化人可以一拳揍穿水泥柱，

  卻揍不穿里昂結實的胸膛、

  扭不斷里昂粗勇的脖子、

  擋不住里昂矯健的腿功；

  吉兒跟大猩猩兄妹即使被生化兵器甩得老遠

  硬生生撞在水泥柱上，依舊能拍拍身上灰塵

  然後站起來跟沒事人一樣繼續開槍。


  本作主角群唯一的正常人只有可愛的蕾貝卡

  大家都在飛簷走壁只有她乖乖地滑壘，

  每一次閃躲都閃得很狼狽，不花俏。

  帶隊送頭被襲擊時表現的又比特種部隊冷靜

  可以看出雖然沒有其他主角歷練這麼豐富，

  但仍有一個人單幹暴君跟半棟洋館的氣勢。

  另外我也很喜歡她跟克萊兒的互動，

  比較可惜的是兩位魔王戰只有跟鍵盤奮鬥，

  沒有更多動作戲。

  不然前面看克萊兒扁殭屍其實蠻爽的，

  尤其我又剛玩完RE2。

  我想這大概是本次連粉絲都無法忍受的缺點

  搞了這麼豪華的陣容結果都沒有更多互動，

  頂多互相嘴砲幾句帶點氣氛，

  大家想看的配對都沒有太深入的發展，

  反倒是覺得吉兒x里昂其實蠻有趣的。


  敘事破碎則是系列作一直以來的缺點，

  但咱今天就是來看是哪個衰腳有這個福氣，

  值得一次動用系列元老這麼大陣仗來鎮壓。

  故事啥的一點都不重要。

  原本以為是在拉昆市跟其他人有點淵源的人

  結果只是個衰小被派過去送頭的保護傘傭兵

  因為被迫殺了自己隊員而崩潰，

  但相比某個每次出勤都死隊員仁兄，

  以及某個第一天上班就被拉昆市盛大歡迎，

  甚至被迫親手殺死美國總統的探員相比。

  反派的動機真的顯得微不足道，

  他甚至還有臉拿這點嘴主角們，

  難怪反派嘴完以後主角們一點感覺都沒有，

  五告扣連。


  另外小抱怨一下，這次角色們講話時，

  感覺嘴形都對不太上。

  而且雖然一些汗毛、光線、溝等等的細節

  都做的很細緻很有質感，

  但人物本身的畫質卻感覺沒有遊戲本家優秀


  雖然酸了這麼多，但粉絲還是看得很開心。

  這次還難得帶入其他代遊戲的劇情，

  可惜五代席娃依舊被忽略，

  同樣是保護傘傭兵的卡洛斯也沒有客串。

  不過能在大螢幕看到遊戲裡的老面孔搞事，

  也算是滿足了，推薦系列作粉絲都可以去看


  題外話，

  強烈懷疑這集另一個目的是賣吉兒的臉模

  吉兒的臉感覺做得比其他角色還用心，

  出場時間多又長，胸部裝甲大幅強化，

  各種角度福利還給滿，還有最多的動作場面

  老卡果然還是懂人心的。



  -----

  Sent from JPTT on my iPhone


  --

  非系列作粉絲真的不建議，玩過遊戲或看過

  前面的人動畫電影其實還是很推的。


  沒錯，比起那些胡搞瞎搞的真人版，

  我寧願看外掛元老主演的B級動作片


  這次幾乎都她的戲，真的很可以'
