title: '[普雷]《惡靈古堡：死亡島》喪屍們快逃啊！'
content: '雖然不看好，但還是每一部動畫電影都有看

  勉強因為對遊戲角色的愛還是給普雷


  ---
















  純粉絲向作品，眾星雲集表現卻中規中矩


  近期有越來越多老牌ACG作品都力求轉變與給粉絲增加不同的新鮮感，例如《海賊王》即

  將推出真人版在2023年8月登上串流平台。


  但翻車的案例從過去也是比比皆是，像這次《聖鬥士星矢》的真人化票房完全翻車，故保

  持原作風格是重要之事，但有時候也不免讓人想：到底要保留多少原作的影子，才是不錯

  的改編作？


  老牌遊戲公司卡普空知名作品惡靈古堡系列推出新電影版《惡靈古堡：死亡島》，故事接

  續2017年的電影版《惡靈古堡：血仇》事件結束後一年。為了找到握有機密情報人士的里

  昂、與調查感染途徑不明由拉昆市延伸的異類病毒的克里斯一行人，在一座名為「死亡島

  」觀光之地的孤島中相遇，試圖阻止背後主謀的病毒計畫。










  《惡靈古堡：死亡島》是什麼動畫？


  如果提到遊戲公司卡普空，經典遊戲幾乎隨口一說都在玩家之間眾所皆知，例如以野外狩

  獵和高操團隊合作為主軸的《魔物獵人》系列，橫向捲軸闖關遊戲，在一代人心中相當經

  典的《洛克人》系列，甚至一直到現在都還有高人氣的格鬥遊戲《快打旋風》系列作，可

  以說是款款經典的製作機。其中參考電影、經典遊戲《甜蜜之家》將喪屍病毒發揚光大的

  遊戲《惡靈古堡》系列更是不斷有討論度。


  目前根據官方所統計《惡靈古堡》系列正傳已經出到八代，雖然不時有新角色出現，但從

  過去一代到今的一些人氣角色依舊還是常常露面，其中《惡靈古堡6》更是有著多個新舊

  角色一起出現組成三組人馬的大團隊。


  但有別於遊戲本傳，《惡靈古堡》系列真人電影則是被粉絲表示完全與遊戲無關，就連重

  啟之後雖然背景基本還原，但卻因為角色還原度太低且更改性格而不被接受，影集版也因

  為原創角色的關係，變得毫無人氣。








  在真人電影第三部《惡靈古堡：大滅絕》時，主角幾乎成了超人已經脫離了整個遊戲故事

  的主軸，卡普空也開始跟動畫公司合作製作以遊戲為基礎的動畫電影作品，在2008年推出

  《惡靈古堡：惡化》稱之為《惡靈古堡2》之後劇情交代，和後面幾代故事的補完作品。


  之後每隔重大遊戲新作的推出不久，就會有類似的故事補完動畫產生，很明顯的比起真人

  化的荒腔走板，遊戲動畫的《惡靈古堡》系列是全心全意以遊戲粉絲為走向的作品。


  2023年推出的《惡靈古堡：死亡島》基本上延續前三代動畫電影步調，繼續一個全新的病

  毒外傳篇章。除了兩位不可少的多代當家男主角：里昂、克里斯外，克里斯的妹妹2代女

  主角－克蕾兒、最早出現在任天堂GC主機上0代女主角－蕾貝卡、還有經典初代女角－吉

  兒，可以說是眾星雲集。五人將踏上有謎樣新病毒的死亡孤島，找尋這次變異的主因，同

  時也揭開了一場過去在拉昆市的保護行動。











  《惡靈古堡：死亡島》分析與延伸：


  過去《惡靈古堡》動畫推出通常都帶有補完設定，和連結兩到三代的故事一些延伸和角色

  之間去向的交代。不過從第三次的動畫電影《惡靈古堡：血仇》來看，似乎有想脫離交代

  遊戲，走向一些遊戲沒有的原創番外篇章。


  在這次《惡靈古堡：死亡島》中可以看見有別於以往，在展開的全新的病毒，甚至反派有

  部分連結到《惡靈古堡：血仇》的劇情，和一些更久遠的初起故事，可以看出動畫以同樣

  的人氣角色走向原創，後續再串起的可能？


  這次動畫《惡靈古堡：死亡島》的島嶼原型參考美國舊金山附近的阿爾卡特拉斯島，當地

  的居民認為這島嶼被詛咒故別名又稱為「惡魔島」。有這傳聞主要是這裡過去曾經被設為

  軍事監獄，從1934年開始29年間被設為聯邦監獄，之後便荒廢，在1972年有資本家想將這

  邊改造成黑暗觀光，惡魔島的名氣才以一個旅遊景點的方式傳開，但是像是鬼故事」詛咒

  的傳聞還是約略有聞。








  《惡靈古堡：死亡島》這次的行銷以粉絲和海外市場為主，除了不採用日本聲優外，也交

  由之前2021年在Netflix上製作影集《惡靈古堡：無盡闇黑》的導演來執行這次動畫電影

  。《惡靈古堡：無盡闇黑》是一個四集的短篇動畫，故事則是以《惡靈古堡》4代跟5代中

  間，抓住其空擋交代里昂、克蕾兒兩人的去向的原創故事。


  《惡靈古堡：死亡島》有可能是則是接續於6代之後《惡靈古堡：血仇》的故事篇章，2年

  後就進入了全新第一人稱視角主角《惡靈古堡7》的伊森，後續救妻行動則是在遊戲時間

  2020年《惡靈古堡8村莊》。


  整題而言因為《惡靈古堡：死亡島》雖然是2023年上映的電影，但時間線和世界觀卻還停

  留在2015年《惡靈古堡6》過後不久，這已經是11年前上市的遊戲，故有些設定和久未出

  現的人物之間的關係，可能都還要再稍微思考一下。不過因為部分主要角色頻繁出現，且

  透過對話可以略知一二他們所屬的陣營，整體而言應該也只有玩家跟粉絲才會去計較《惡

  靈古堡：死亡島》的時間線歸屬。









  《惡靈古堡：死亡島》值得一看嗎？


  不只這次的動畫電影，應該說每一部《惡靈古堡》動畫電影。我都不推薦非粉絲、或沒玩

  過遊戲的玩家去看，因為如果沒有了解角色是誰？或是他們前期在做什麼、後期又有什麼

  遭遇，整部動畫會比真人版電影更讓你滿頭問號。當然也可以乾脆放空不想，享受他們虐

  殺殭屍裝做自己很弱，甚至彼此明明都知道對方，互動還如同最熟悉的陌生人，整體從人

  物互動、反派動機、到最後殺敵的高潮，其實都是中規中矩。


  雖然是原創故事又一次就有五位讓老玩家掛念的角色，尤其是吉兒的出現，極力洗刷她在

  五代所做的一切，並試圖重新開始。這一次《惡靈古堡：死亡島》很明顯在塑造吉兒在經

  歷過一次挫敗後的成長，然後依舊活躍在追查病毒的前線，甚至依舊與克里斯有所合作，

  但是如果沒玩過五代遊戲的人，誰會知道吉兒在糾結什麼，克里斯知道什麼。


  就像是與里昂一戰的反派，如果不翻找前一代動畫電影又怎麼會知道反派想要抹殺他的原

  因，最後只能粗略想吉兒過去有創傷、反派對付里昂是因為里昂一次行動任務殺害她父親

  的關係等，必須用簡單的方式讓人接受，才能繼續看下去。







  整體而言電影的感覺像是在看遊戲過場動畫但卻沒有遊戲畫面，甚至還有好幾次人物下個

  鏡頭瞬移位子，甚至打鬥過程堪稱較好的也只有最開始與剛踏上死亡島，後續反派話多到

  不可思議、想法也很不可思議、甚至放任主角破壞的作法也完全意義不明。而至少故事也

  免強算是能接受他的動機和理由，但整體而言只能用腦袋有洞形容這次的反派。


  畢竟是粉絲向的動畫作品，《惡靈古堡：死亡島》集合了歷代五位主要角色，甚至在預告

  就大肆宣傳，這點讓人覺得很不妙。不妙非指劇情或人物，因為，《惡靈古堡》動畫電影

  看那麼多年，基本不指望它的劇本，不描是指動畫中的喪屍跟反派可能這次會遭遇這次五

  色戰隊聯手毒打、圍毆。整部作品看完果然正如預期，需要為反派默哀。


  --

  個人Blog：

  小說連載頁：


  --'
