url: https://www.ptt.cc/bbs/movie/M.1688043445.A.5A9.html
title: '[普雷] 惡靈古堡：死亡島'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  　　先說結論，滿分10分的話給6.5分，基本上就是一部沒有太大缺點，同時也沒有太大

  亮點的外傳電影。上映前觀眾總是戲稱這集是BIO元老郊遊記，事實上──還真的沒錯。


  　　製作群聲稱這部電影是「惡靈古堡宇宙的復仇者聯盟」，但很顯然他們沒能真正理解

  到，復仇者聯盟不止是讓英雄們站在一起打壞蛋而已，還要讓他們的性格與理念互相碰撞

  、磨合，讓他們面對非彼此合作不能解決的危機，藉此讓每個人都有所變化成長，但在死

  亡島中完全看不到這些心態上的轉變，這讓觀眾看到元老們齊聚時，只會覺得他們真的是

  偶然一起來辦公兼郊遊，感受不到集結的重要意義。


  　　五大元老碰面非但沒有內心的變化，互動上也沒有什麼火花，對話以公事內容居多，

  缺少私人層面的交流。甚至除了里昂一如往常會噴點垃圾話之外，其他元老的對白都寫得

  很乾，很難看出性格描寫。比方說克里斯和克蕾兒再會的那場戲，如果不是玩過遊戲的玩

  家，恐怕沒人看得出他們是兄妹。唯一稱得上有火花的，只有初期克里斯與吉兒的一場戲

  ，這場戲會勾起老玩家很多回憶，可惜也僅止於此。期待克吉CP的觀眾可能會很失望，官

  方給的糖非常少，當然照慣例沒有描述他們的感情狀態。至於支持Cleon的玩家，恐怕不

  要抱任何期待比較好，戲裡的克蕾兒和里昂甚至很難稱得上有說過話。至於期待艾妲、比

  利、卡洛斯等等角色出場的人，我只能說你們想太多了。


  　　電影中間讓克里斯、克蕾兒、里昂三人都受到感染，上演「主角即將會變成活屍」的

  活屍電影老戲碼（克里斯的無感染紀錄很遺憾地在此集破功），但玩家都知道卡普空不可

  能讓主角在外傳電影（及漫畫）遭受不可逆轉的傷害，所以這種戲碼很難令人產生危機感

  。不過透過主角們感染老半天都沒突變、一般民眾感染立刻就突變的差異來看，也許可以

  說官方間接承認了主角群天生就比較有抗性的設定。這一場戲有一點官方吐嘈的後設趣味

  ，像是迪蘭罵克里斯:「每次跟你出任務的隊友都死光，但你還是不停把人送上戰場。」

  可惜迪蘭對主角們的指控，也並沒有對他們造成真正的影響。如果真的要說有影響，就是

  吉兒透過這趟任務證明了自己的鬥志和存在意義，但坦白說有沒有其他主角在，都和吉兒

  的想法沒什麼關係。


  　　和同為深見真編劇的血仇相比，《死亡島》的劇本沒有容易讓人出戲的漏洞，動作戲

  雖不如血仇誇張華麗，但比同樣是羽住英一郎導演的無盡闇黑要豐富，有幾場戲還算不錯

  。大反派迪蘭的描寫值得一提，故事賦予他的創傷和小習慣，都讓他比主角群更有一種人

  味（主角群被寫得很像一群反恐機器人），有其值得同情的地方，雖然他在動畫系列的反

  派中不如柯提斯兇殘，不如女總統聰明、不如艾利亞斯能打、不如傑森像一台跳針的恐懼

  唱片機，但還算是有記憶點的反派。突變後雖然擊殺數是系列最低的0（傑森都起碼掐死

  了兩個人），血卻是系列最厚的，不論火箭砲或電磁砲都無法一發了結，堪稱最強的肉靶

  。


  　　總而言之，《死亡島》不是最糟的BIO電影，但離優秀也還是有段距離，玩家可以放

  空大腦輕鬆享受。不論未來執掌這個系列的是誰，都期待卡普空可以越拍越好。


  --'
