title: '[新聞]幫殭屍 QQ !《惡靈古堡：死亡島》里昂吉兒'
content: '幫殭屍 QQ !《惡靈古堡：死亡島》里昂、吉兒、克里斯等歷代主角在系列最新動畫電影

  組隊打怪，搶先日本在台灣上映！


  2023-06-13 電影神搜




  里昂、吉兒、克里斯、克蕾兒以及蕾貝卡等人集結一堂，為了找出使人變成殭屍的怪異病

  毒真相，前往疑點重重的神祕孤島……日本 CAPCOM 公司旗下暢銷遊戲《惡靈古堡》系列

  作品全球知名，銷售量已突破 1 億 3,000 萬套，並推出有各種跨媒體延伸作品如好萊塢

  的真人電影系列、近期的 Netflix 影集……等等，而根據遊戲原作改編的 2023 年最新

  CG 動畫電影《惡靈古堡：死亡島》（バイオハザード デスアイランド），也由台灣代理

  片商普威爾宣布於 2023 年 6 月搶先日本正式在全台灣上映。




  《惡靈古堡：死亡島》電影預告



  《惡靈古堡：死亡島》登場人物介紹


  里昂·史考特·甘乃迪（レオン·S·ケネディ）


  最早於 1998 年《惡靈古堡 2》（PS、N64、DC、GameCube 及 PC Game……等平台）以男

  主角身分登場，拉昆市警察，就任第一天就碰上 T 病毒引起感染事件，之後成為了美國

  政府的直屬特務。


  克里斯·雷德菲爾（クリス·レッドフィールド）


  最早於 1996 年《惡靈古堡》（PS、SEGA SATURN、NDS、PSN 及 PC Game……等平台）以

  男主角身分登場，曾是美國空軍的飛行員，之後加入拉昆市的特殊部隊執行任務，硬漢形

  象深受好評。




  吉兒·華倫泰（ジル・バレンタイン）


  最早於 1996 年《惡靈古堡》（PS、SEGA SATURN、NDS、PSN 及 PC Game……等平台）登

  場，與克里斯皆服勤於拉昆市的特殊部隊，善於開鎖。


  克蕾兒·雷德菲爾（クレア・レッドフィールド）


  最早於 1998 年《惡靈古堡 2》（PS、N64、DC、GameCube 及 PC Game……等平台）登場

  ，是克里斯的妹妹，喜歡機車與紅色，在遭遇病毒引起的一連串事件後加入 NGO 以幫助

  更多遭遇不幸的人們。


  蕾貝卡·錢柏斯（レベッカ・チェンバース）


  最早是 1996 年《惡靈古堡》（PS、SEGA SATURN、NDS、PSN 及 PC Game……等平台）登

  場的過場角色，在拉昆市的特殊部隊當中擔任醫護人員，也是 2002 年《惡靈古堡 0》（

  PS3、PS4、GameCube、Wii、Xbox 360、Xbox One 及 PC Game……等平台）的女主角。




  《惡靈古堡：死亡島》電影劇情故事介紹


  即將推出的動畫電影《惡靈古堡：死亡島》，透過預告可以先一步看到本次將精彩呈現遊

  戲原作中的恐怖驚悚情節。劇情故事描述安東尼奧・泰勒手上握有機密情報而遭武裝集團

  綁架，為此美國總統專屬特務里昂前往追查，卻意外遭遇一名神祕女子妨礙，讓犯人得以

  逃逸。




  另一方面，反生化武器組織「BSAA」的克里斯、吉兒以及擔任顧問的蕾貝卡，正針對舊金

  山一帶所發生感染源不明的殭屍疫情進行探查。在克蕾兒所屬的組織協力調查之下，發現

  病毒確診者全都去過監獄島・阿爾卡特拉斯。


  為了調查真相，克里斯一行人於是搭乘渡輪往監獄島出發……


  《惡靈古堡：死亡島》台灣上映資訊


  《惡靈古堡：死亡島》安排自 2023 年 6 月 29 日起搶先日本，在台灣盛大聯映，代理

  片商普威爾更爭取在台推出兩款 A3 特典海報，只要購買一張電影票，即可隨機獲贈一張

  特典海報，各家戲院分配數量有限，送完為止，喜歡《惡靈古堡》系列的粉絲們可要把握

  機會前往了。




  資料來源：普威爾


  電影神搜



  --'
