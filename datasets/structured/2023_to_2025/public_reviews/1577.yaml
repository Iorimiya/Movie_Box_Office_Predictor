title: 'Re: R: [選片] 印第安那瓊斯5 vs. 惡靈古堡:死亡島'
content: '無雷


  剛看完印第安納瓊斯

  經典的IP

  確實拍出同樣風格的印第


  沒有女權問題

  也無接班企圖

  這就是一部福伯的印第

  請放心觀看


  賣情懷的第五集

  確實因為福伯的年紀

  動作上已經很夠誠意了


  劇情ok

  乾女兒表現不差

  沒有教育女權

  一樣是歡樂刺激的冒險片


  最後一幕有感動到

  但必須是看過系列的人才懂


  無法給評分

  對我而言就是從小到大的情懷

  還能看到福伯演第五集

  很夠本了


  片長很長

  但看完卻不累

  很想抽根菸上個廁所

  買杯飲料繼續看一次


  這是我看完時的即刻想法


  --




  就經典的福伯印第，完全感受不到什麼女力議題，連接班都感覺不出來，甚至最後還幽默了

  一下，好像在告訴大家，福伯還有第六集XD但那只是幽默啦，當然也可以解釋成二個方向，

  一個是這系列還會拍下去（主角換人），另一個就是福伯的印第，永遠不會被取代。

  可以。但我很愛最後一幕（並不是最後一個畫面），那個互動讓我感動落淚，你有看過前系

  列應該會有印象。



  一定看得懂，但不建議。最低標要看過法櫃奇兵，第五集致敬法櫃太多了，有沒有看過差很

  多。


  只有你認為吧，很好奇你看到哪裡去了？'
