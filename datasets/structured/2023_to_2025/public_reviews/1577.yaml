url: https://www.ptt.cc/bbs/movie/M.1688216464.A.349.html
title: 'Re: [普雷] 惡靈古堡死亡島—比瑪利歐還粉絲向'
content: '認真談談劇情問題


  這部剛看完只會感到劇本十分不合理，反派哪來的技術資源?

  最後的場景為甚麽這麽多東西讓主角們花式表演?

  但如果無視掉這些東西，只聚焦在整個事件


  我的感想是"編劇你其實很討厭這遊戲吧‘’

  越是粉絲越能體會這部電影的不合理之處

  整部電影的核心其實只在反派和主角羣的對話


  “在經歷拉昆市事件後，你們這班人根本甚麼都沒幹”


  以下有雷

















  這部的反派，原雨傘公司的小兵

  在拉昆市事件時被上級要求殺死所有受感染的隊友才能撒離

  結果是他親手殺死了自己的好友，且整個小隊也只有他一人生還

  而殺死好友的情景則在腦海中反覆迴響


  花了7年時間，從小兵成長為手握大批資源的反派

  在政府眼皮子下建造了整個生產設施

  順便還把T病毒改良了

  1.去除了傳染性

  2.能精準全球定位打擊至個人目標

  的生化兵器


  靠，這除了不是把人殺死而是變喪屍外根本是完美的武器好不好

  而他的目標只是想為好友報仇而已



  看看同為拉昆市倖存者的其他人

  特工，BSAA，NGO

  看似都在對抗BOW的第一綫，如反派所說，都只在治標不治本

  而我們的反派，則因拉昆市的經歷認為，要幹就要把下令制造出地獄的人幹掉



  對比下真的顯得各大主角這麽多年都在混一樣




  以結論來說

  整個事件說白了就只在反派想邀請各位拉昆市畢業生，開個畢業成果發表會順便給自已一

  個理由自殺


  整部電影看似各位主角大顯神通，各種死裏逃生

  但以另一角度看就是反派各種放水，給主角們機會


  甚至每次計畫關鍵時刻都自己玩一次俄羅斯輪盤

  在主角羣面前長篇大論給吉兒殺掉他的機會

  結果到最後他真的該幹的事情都幹完了還沒死，只好爽快地注射病毒變身給主角們散心了


  而全劇最不合理的軍火庫完全可以認為是他留給主角羣開派對用的

  不然一般軍火哪能連電磁炮也能翻出來？


  --'
