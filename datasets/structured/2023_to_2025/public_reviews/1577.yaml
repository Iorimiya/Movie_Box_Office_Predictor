title: '[普雷] 惡靈古堡：死亡島'
content: '防雷















  其實劇情很直線，不好也不壞


  有鑒於此系列的時間線都是跟著本傳的發售日期，時間線確實設定在6之後7之前。（2015）



  而吉兒會用RE3的建模則是使用在5代被威斯卡洗腦後

  好不容易又重返回當外勤特務來當藉口（但我記得不是在啟示就又當回來了？）

  可是我不記得吉兒在RE3有這麼大啊


  這五位元老稍微有點交心的場面就克里斯跟吉兒稍微有點互動，其餘跟本沒什麼火花


  頂多里昂跟吉兒這對學弟學姊終於見面了的場面，還稍稍有趣



  反派狄倫想製造生化危機的理由我覺得超爛

  因為他經歷的事情這五個元老也沒少經歷過，況且人家在經歷這些後是想從體制內改變


  而這傢伙就單純只是我很慘，你們都沒我慘的把元老都數落了一遍，說他們都只是幫既得

  利益者跟政府高層掩埋真相以及打工而已



  講真的，看完他的理由再看到這五個元老出動

  真心只會覺得啊你就這樣馬眼似的心眼還敢拉這五個人來打你？？


  雖然他的計謀有讓克里斯、克蕾兒、里昂感染到，但是還弄到補師蕾貝卡出馬


  真的是不知道你怎麼敢呢，狄倫（還敢說我都算到了



  整體而言就是部很中規中矩的娛樂片


  也有些小彩蛋，像是RE3的電漿步槍、侏羅紀公園

  還有克里斯負責當里昂的人體槍托，真不愧是大猩猩呢（讓我想到城市獵人）




  如果是惡靈古堡的粉絲是能稍微看一下，畢竟能看到五位元老嘛XDD


  可惜王阿姨沒出現，真的好希望她突然用繩索飛出來丟火箭筒<3



  然後里昂的座駕H2R的引擎聲在電影院聽真爽，雖然又壞了


  -----

  Sent from JPTT on my iPhone


  --





  只有幾場有點亮眼'
