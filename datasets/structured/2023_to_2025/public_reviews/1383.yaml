url: https://www.ptt.cc/bbs/movie/M.1697813834.A.421.html
title: '[普雷] 城市獵人：天使之淚  經費有點窮的感覺'
content: '雷文防雷資訊頁

  特典


  建議當特別TV版看比較好

  劇情就很一般類似玩命關頭那種感覺

  人物動向很迷

  動作戲只有一段還不錯


  7/10


  如果彩蛋有戳到加1分 （看過的就懂）


  賣肉的點意外少

  一堆上世紀黃色梗

  戰鬥不夠暴力（尺度比鬼滅少）


  但決戰至少有帥ㄧ波

  給過







  以下有雷


  真心希望有下一步尺度可以再大一點

  6+有點不給力啊

  真心覺得天使塵走驚悚風比較好

  來點骨折還會動

  或一些人體很奇妙吧的姿勢

  大概就完美了


  鋼彈那邊真的超好笑欸

  獨角獸真的親兒子經費比城市獵人高了



  -----

  Sent from  on my iPhone


  --



  --'
