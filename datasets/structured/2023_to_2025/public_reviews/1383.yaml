url: https://www.ptt.cc/bbs/movie/M.1697980883.A.966.html
title: '[負雷] 無情懷的人看城市獵人:天使之淚'
content: '小時候並沒有看過城市獵人（任何版本都沒有），

  但因為追日綜的關係，有看過節目上表演OP1跟Get wild這兩首歌曲，

  當時的印象很不錯，所以上一部"新宿之眼"就當了城市獵人的入門作


  "新宿之眼"我還算蠻喜歡的，後來巴哈上也有重溫，

  即便劇情相對簡單，人物也沒有很立體的塑造，

  但至少沒有生硬的轉折，而且很認真投入在懷舊上，

  各種主題曲切入都很讚，最後下Get wild時也很感動，

  所以對這部"天使之淚"我也是抱著一樣的期待，

  但老實說看完還蠻失望的


  首先，我不是很確定這部電影的定位是什麼，

  上一部是睽違多年的動畫電影，目標就是情懷，

  所以在把控節奏跟主題上就相對清楚，

  但這部就...我看完感覺有點尷尬，

  去爬評論看這部應該不是漫畫的天使之塵篇，

  而片尾又有說要做最終章（應該就是天使之塵篇吧？）

  所以這部的定位是...暖身？新譯？

  總之看不太懂它的定位是什麼


  而會有上面這個疑問，也跟它的劇情安排有關；

  因為看過上一部的關係，我對劇情的要求並不太高，

  只要能順走，就算很簡單也無所謂，

  好好把場面跟復古的感覺做出來就好，

  但這次好像有點...用力過猛？

  想在９４分鐘的裡塑造很多比較立體的角色，

  最後節奏就變成忽快忽慢，

  很多場面拖太長（例如前面的日常，後面獠跟安潔的對峙），

  又很多場面很帥氣，但前後都缺乏鋪成，

  感覺一瞬間就結束了（例如開槍打直升機），

  包含魯邦的客串，前面日常時影廳裡還有些許笑聲，

  這個客串全場卻鴉雀無聲，感覺突然到沒什麼人反應過來


  當然上部賣情懷這麼成功，這部一定會比較困難，

  但就算撇除其他元素，這部在基礎的"劇情、氣氛掌控"實在問題太大，

  看完感覺很像腳本失敗的"純黑的惡夢"，

  後來爬了一下製作名單這次好像不是兒玉直接執導，

  腳本也換了，下部入場前應該會看一下Staff再考慮，

  但我衷心希望能再在電影院被Get wild感動一次


  --'
