title: '[情報] 劇場版城市獵人天使之淚 正式預告'
content: '《劇場版 城市獵人 天使之淚》公開正式預告 預定 9 月 8 日於日本上映


  動畫（GNN 記者 Akito 報導） 2023-06-13 18:12:04


  以北条司的漫畫為原著改編，動畫《城市獵人》最新劇場版《劇場版 城市獵人 天使之淚

  （暫譯，原名：劇場版シティーハンター 天使の涙）》，官方於今日公開了主視覺圖、

  正式預告影片以及新角色資訊。




  《城市獵人》描述雖然好色卻卻又身懷絕技的主角「冴羽獠」，與個性開朗的女主角「小

  香」共同經營私人偵探事務所。在一次次艱險的委託任務中，他們以其獨特的方式鏟除城

  市中的罪惡。


  而隨著今日資訊的曝光，官方也公開了數名新角色的資訊以及片頭曲資訊。在角色的部分

  ，安潔將由澤城美雪詮釋演出、海原神則是交給了堀内賢雄、皮拉魯克由關智一、艾斯帕

  達則為木村昴、來生瞳交給了戶田惠子、來生淚由深見梨加，來生愛的部分則是交給了坂

  本千夏詮釋演出，而片頭曲則是將使用 TM NETWORK 的「Whatever Comes」一曲。


  目前《劇場版 城市獵人 天使之淚》預定將於 9 月 8 日在日本上映，對於本作有興趣的

  人，不妨先藉由正式預告一探究竟。




  --'
