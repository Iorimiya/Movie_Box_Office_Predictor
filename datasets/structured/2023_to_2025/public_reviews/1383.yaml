url: https://www.ptt.cc/bbs/movie/M.1677040422.A.078.html
title: '[新聞] 《劇場版 城市獵人 天使之淚》秋季上映'
content: '《劇場版 城市獵人 天使之淚》預定秋季於日本上映 官方公開特報影片


  （GNN 記者 Akito 報導）


  以北条司的漫畫為原著改編，動畫《城市獵人》最新劇場版作品，官方於今日公開了劇場版

  將名為《劇場版 城市獵人 天使之淚（暫譯，原名：劇場版シティーハンター 天使の涙）

  》的消息。




  《城市獵人》描述雖然好色卻卻又身懷絕技的主角「冴羽獠」，與個性開朗的女主角「小香

  」共同經營私人偵探事務所。在一次次艱險的委託任務中，他們以其獨特的方式鏟除城市中

  的罪惡。新作劇場版中的主角冴羽獠將仍舊由神谷明擔綱配音演出，片尾曲也將繼續使用 T

  M NETWORK 的「Get Wild」。而在本次的故事中，將以冴羽獠的過去以及他曾經的夥伴「慎

  村秀幸」為核心所展開。


  此外，官方也公開了一部份的製作小組名單，這次劇場版將交由《城市獵人劇場版 新宿 PR

  IVATE EYES》的兒玉兼嗣執導、むとうやすゆき撰寫劇本、並且交由 Sunrise 以及 The An

  swer Studio 共同製作，目前動畫預定將於秋季在日本上映，對於本作有興趣的人，可關注

  後續相關報導。







  --'
