title: '[好雷] 冥婚淒談──愛的執念與寂寞的永恆'
content: "盡量不爆大雷，但看本文，請務必做好踩雷準備。謝謝！\n另推送票人真的很有誠意，也希望這部片能大賣，\n這樣送票人才能再引薦更多好作品給大家看。:)\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n    我個人並不是因為偏愛飽受驚嚇的刺激而看鬼片，事實上，只要是有好劇情的電影，\n\
  我都很愛看。但不知為何，往往看預告或簡介，劇情看似很有意思、很懸疑、很詭譎的鬼\n片，真的看了全片，常常感到失望，而且不知所云。儘管我總是被預告一騙再騙，這回看\n\
  到《冥婚淒談》的預告片，還是被挑起好奇心，最引誘我的就是簡介裡「沒有影子的妻子\n」這句話，透過文字，幽微的恐怖緩緩爬上我的心頭。\n\n    《冥婚淒談》實際上是三段故事匯集而成一個半小時左右的影像流轉，片名翻譯的部\n\
  分很多人都提出意見，首先是太拗口，其次是冥婚只不過是其中一個故事，還不如電影一\n開始的字幕《奇談》，更能表現出這部片的氛圍。不知道是誰翻譯片名？老實說，這片名\n\
  有類戲劇《藍色水玲瓏》的fu，情節上也頗有鄉野奇談的味道，不過畢竟是一部電影，影\n像手法、情節安排之懸疑、弔詭、配樂都不是類戲劇比得上的。我以為如果要融入鬼片市\n\
  場，片名譯為「鬼醫院」之類的，爛則爛矣，至少不像《冥婚淒談》，讓人看了會先愣一\n下。\n\n    三段故事其實是在四天裡同時發生，電影開始之初，幾個鏡頭迅速帶過安生醫院裡的\n\
  三位主人翁，然後開始分段敘述，這樣的敘事手法其實蠻好的，雖然一開始會覺得混亂，\n但後面卻能因為每個故事的一氣呵成，而讓觀影者的情緒不被中斷。\n\n    被當作電影譯名的〈冥婚〉故事，其實是三個故事裡，顯得比較普通的一段，蒙受院\n\
  長恩惠的實習醫生被安排在停屍間值夜班，殊不知這是院長的設計，院長心愛的女兒變作\n一具冰冷的屍體躺進了停屍間，作為一個母親的私心與癡心，不願女兒到了黃泉猶逢負心\n\
  人，費心安排了人鬼婚，也真的如她所願的促成了人鬼戀。不得不說實習醫生正男與院長\n之女葵子完婚的場面實在太唯美了，美得讓我覺得掉入聊齋的世界裡。\n\n   \
  \ 第二個故事與第三個故事相當精彩。\n\n    第二個故事，主角是一名車禍中倖存的小女孩麻子，夜夜惡夢，飽受驚嚇，更因此失\n語，大家都以為她是因為獨自存活下來而感到罪惡，唯有擁有相同經驗的醫生秀仁懂她、\n\
  理解她，並幫助她走出惡夢。隨著每一個惡夢得展開，在驚懼的過程裡，窺視的觀眾也逐\n漸釐清小女孩夜夜惡夢的真正原因。我很喜歡這一段藉夢境交錯車禍事件還原的影像，堆\n\
  砌出一連串麻子戀父情結的心理描寫。令不少人印象深刻的麻子媽媽拔尖鬼聲，我倒沒那\n麼驚奇，暑假看過一部劇情很不通的鬼片《叫魂》，片中的紅衣女鬼動輒便發出比麻子媽\n\
  媽更令人不舒服的鬼叫聲。\n\n     第三個故事就是一開始吸引我的「妻子沒有影子」的故事。這一段懸疑氣氛營造得\n很好，而且最後還來個大反轉，起初是身為醫學教授的丈夫發現妻子沒有影子，赫然想起\n\
  妻子在一年前亡故於日本，然而丈夫太愛妻子了，就算妻子是一縷幽魂，只要可以和妻子\n永遠在一起，怎樣都好！但是醫界權威的丈夫漸漸發現妻子的行為怪異，跟蹤之下竟發現\n\
  妻子與連續殺人案有關連，愛妻深切的丈夫無條件為她掩飾罪跡，然而鏡頭之下的故事不\n斷抽絲剝繭，一層層迷霧逐漸散去，更驚駭的事實與結局方使人感到愛的純粹與沉重。\n\
  \n    嚴格說起來我不認為這是鬼片，因為片中恐怖的畫面不一定就必須解釋為真的是鬼來\n了。正男與葵子完婚的場面倒不如解釋為在尼姑作法後他姦屍，唯美而虛無的影像或是在\n\
  那之前恐怖的一幕不過都是他腦海裡奔騰的意象。麻子遭遇的種種恐怖視覺、聽覺衝擊更\n是她心病未除所揮之不去的惡夢，更何況麻子媽媽滿身是血都要保護她的安全，也說了不\n\
  會怪她，母愛遠比我們想像得無私，這樣的母親是不可能變作恐怖的鬼影來嚇唬自己珍愛\n的孩子。沒有影子的妻子更是與鬼無關了，一切都是源於生者對亡者的不捨與眷戀，正如\n\
  妻子銀縈面對學生時所說：「我個人很願意相信靈魂的存在，要是沒有的話，豈不是太寂\n寞了嗎？」\n\n    我把這部片解讀為描寫愛的執念與寂寞的永恆，片中的人物愛得太深、太強烈，生與\n\
  死的訣別令他們難以承受，一如簡介所言：「死亡，是治癒愛情唯一的良藥……」不論是\n院長或是銀縈，選擇死亡只不過是難以忍受獨自活著的寂寞，至於醫生秀仁，他曾說：「\n\
  麻子多活的這些日子是為了安眠吧！」麻子有了醫生叔叔，才得以撫平心上的傷痕──自\n覺害死母親、繼父、老婆婆的罪惡感，然而秀仁的傷痕誰來撫平？童年時墜入深井，哥哥\n\
  為了救他而死去，跛足的他勇敢的長大，成為醫生，幫助了許許多多人，以及和她有相似\n傷痛的麻子，但他的傷呢？也許一直在流血，只是隱藏得太好，麻子的出現是他這抹舊傷\n\
  的一帖藥，最後麻子離開了，醫生也離開了，互相療癒的過程裡，他們成了不可分割的一\n體。\n\n\n    活下來不一定就是幸運，作為故事的主述者正男活的是多麼寂寞啊！\n\
  \n--"
