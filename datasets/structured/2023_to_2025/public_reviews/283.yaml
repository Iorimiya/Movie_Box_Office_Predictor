url: https://www.ptt.cc/bbs/movie/M.1211629843.A.6E5.html
title: '[好雷] 冥婚淒談--溫馨鬼片'
content: '我總覺得看鬼片是自虐的行為，何必看電影看的那麼辛苦咧！把自己嚇得要死！但是韓國

  鬼片「冥婚淒談」顛覆我對鬼片的印象，恐怖？當然有，但這恐怖又帶有溫馨與淒美，是

  一部充滿美感的鬼片。


  怎麼把溫馨、美感又恐怖元素融合在一起呢？導演拍攝手法的確高明。




  車禍後，母親不顧自己滿身是血，抱著還有一絲氣息的女兒在雪地中求救，終究失血過多

  ，躺臥在雪地上。紅色的血蔓延雪白山丘，片片雪花輕輕飄落在兩人雪白絲絨上，鮮紅的

  血在白色雪地映襯下，更顯閃耀刺眼。兩人手緊緊握著，母親溫柔的喚著女兒「沒事了，

  不是妳的錯」，女兒自責的淚水滑落臉龐，如此美麗卻又哀淒的景象，讓人動容。


  惦記著住院的女兒，出車禍已死的母親，夜裡拿著梳子幫女兒梳頭。全身血淋淋、眼中佈

  滿血絲，女兒被母親恐怖的模樣嚇到渾身顫抖，然母親的眼中竟是疼惜，嘴裡還咿咿的碎

  碎唸著….


  男孩和女孩冥婚的場景，兩人穿著華麗的和服，坐在和式塌塌米，每開一扇門，就是人生

  的一個歷程，戀愛、結婚、生子…。時光荏苒，配合布景的點綴，落英繽紛、雪花輕輕抖

  落，或是楓葉飄散，呈現一幅幅幸福美滿的場景，只是隨著在一扇扇象徵美好的門開啟中

  ，心裡卻被緊緊揪著，怎知下一扇門是否藏著不安與驚嚇的畫面。


  南柯夢一醒，男孩驚覺自己吻著女孩冰冷的屍體，而那女孩美麗蒼白的臉龐詭異的爬滿蝸

  牛，嘴裡不斷滲出血水….


  男醫生不願接受妻子死去的事實，幻想著妻子一直陪伴在身旁。總依偎著一起散步、聊天

  ，一切是如此幸福美好。卻發現那散步的腳印怎麼只剩一雙、怎麼對方沒有影子。抓花的

  手臂、塵封的記憶一一浮現…，劇情一步步揭曉，抽絲剝繭中，又是讓人震撼的事實，死

  去的竟不是妻子，而是丈夫…


  原來不能接受事實的是女醫生，她只能欺騙自己，用幻想減輕心中的悲痛，卻讓自己陷入

  迷亂的情境中。女醫生臨終前說「好孤單…」讓人好心疼，她心中是如此空虛哀傷！


  回想起，女醫生上課時的一段對話


  『教授，妳是說，妳相信鬼魂存在。』


  『我相信我們是有靈魂的』

  『如果不相信，就太壓抑我們內心了。』




  看似三段不同故事，導演以倒序的方式呈現，虛虛實實又曖昧不明的鋪陳讓故事更具神秘

  與詭異。直到最後，時空交錯呈現，謎底也一一揭開，但先前詭異的佈局卻在腦海盤旋，

  餘波盪漾。這是近來少見的情感豐富強烈情節，隨著劇情牽動觀眾的精緻配樂，及專業的

  攝影和燈光效果，比起一向僅靠驚嚇殘忍畫面劇情來打發觀眾的恐怖片來說，這部作品算

  是經典鉅作。果然，這部唯美驚悚片得到2007年韓國電影獎項獎肯定，包括最佳攝影、燈

  光、技術、美術四項，導演也入圍最佳導演。


  原來，鬼片不一定要用驚恐畫面來嚇人，那種「氣氛」與「故事性」的營造才更高明！







  --

  ◆ From: 122.120.129.17'
