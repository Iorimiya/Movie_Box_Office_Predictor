url: https://www.ptt.cc/bbs/movie/M.1746764577.A.95D.html
title: '[普雷] 《冥婚鬧泰大》，盡力且有誠意的改編。'
content: '部落格版：


  2023年由導演程偉豪執導的動作喜劇《關於我和鬼變成家人的那件事》將冥婚習俗與同性

  婚姻題材融合，用意想不到的方式與內容來包裝之，溫柔的擁抱許多尚無法被社會完全接

  納的聲音，成功開創出不同於過去台灣類型電影的新風格。當時上映時不僅票房口碑雙贏

  ，更於同年金馬獎提名八項大獎，是我那年最喜歡的台灣電影。時隔兩年，泰國翻拍版本

  《冥婚鬧泰大》於台灣上映，本以爲電影或許會循當時《關於我和鬼變成家人的那件事》

  模式，先於接近且調性相符的金馬奇幻影展放映，然後在台灣再正式上映，結果是直接等

  到五月上映。不過也沒關係，幸好還是有在上映前接到邀請先觀賞到這部我個人期待很久

  的從作品，好奇泰國會如何替電影注入不同的新血、賦予電影不同於台版的新生。然而實

  際看完電影後，我自己對於《冥婚鬧泰大》的感覺相當一言難盡。


  《冥婚鬧泰大》可以說是台骨泰皮，基本上沒有對原版進行多少改編，人物安排也是同樣

  配置，不僅從開場由普提蓬阿薩拉塔納功飾演的阿明在健身房扮同志誘惑並接近持有毒品

  的高官兒子，到後面由雅拉查芃普金帕可飾演的可兒上演的反轉，或者是讓人動容的附身

  駕駛在高速公路上替救護車開道等等，就連分局也有個和台版小胖相似的同事負責偶爾的

  吐嘲。當然《冥婚鬧泰大》並非全然照搬台版，不過多數屬於不會影到劇情的那種小改動

  ，例如泰版中的阿明並不是像台版吳明翰一樣是警察，而是因偷竊遭到逮捕、被可兒說服

  來當警察線人，若是建功不僅能功過相抵，更還有機會被推薦去上警察學校的魯蛇等等。

  若說整部電影最大的改動應該是讓對應台版炎亞綸飾演的家豪的角色阿丁和販毒集團有了

  關聯，也讓阿丁不單單只是不愛迪迪而偷吃劈腿，而是純粹想從他身上詐財而假裝自己是

  名同志，讓與迪迪朝夕相處逐漸理解對方身為同志在社會面臨到各種問題的直男阿明，對

  於阿丁這樣的行為感到憤怒與對迪迪的心疼更為強烈。



  關於阿丁角色的設定是我最喜歡的泰版改動，只是除此之外，《冥婚鬧泰大》並沒有給觀

  眾更多的驚喜與印象。可以看出導演查揚諾布普拉寇有試著於減與加之間所找到平衡，既

  想保留著原來的台味，也想讓觀眾嚐到異國的泰味，不僅將主戰場移至泰國拳館，也將阿

  明與迪迪追著藍波到夜店裡的時間拉長，讓迪迪重溫夜店搖擺的快樂，更是上演一場姊妹

  尬舞的戲碼。不過這些並無法真正讓觀眾感受到泰味，畢竟除了泰拳外實在找不到更多的

  泰國文化，我自己覺得《冥婚鬧泰大》最濃重的泰味來自於角色、或者說是演員本身的氣

  質、說話方式還有肢體與口音。事實上從最早看《初戀那件小事》裡馬力歐莫瑞爾到幾年

  前《模犯生》中查農桑提納同庫，再到這部中的兩位主角，說話都會有種獨特的奶音，不

  論長相清秀或者粗獷，開口直接讓人彷彿置身泰國。沒有看見更多泰國文化、拍出實質意

  義上的泰版《關於我和鬼變成家人的那件事》，是我覺得《冥婚鬧泰大》非常可惜的地方

  。


  再回到劇情部分，在原來台版中的後段，吳明翰曾一度懷疑隊長張永康是毒梟集團老大孝

  哥安插在警局裡的內鬼，直至後來才發現原來暗戀的女警子晴才是真正的內鬼，更在最後

  上演精彩的黑吃黑橋段。既讓劇情維持在懸疑的緊張感，也藉著子晴身分的反轉製造驚喜

  感，同時亦讓毛毛那句口頭禪「不敢相信」發揮絕妙效用。然而《冥婚鬧泰大》將後半近

  尾聲的這段高潮幾乎刪去，不光是隊長的戲份比旁邊的小胖都少，可兒也沒了兒時因目睹

  母親吸毒過量而死、進而怨恨著販毒給母親的喬老大、有了復仇念頭的過往故事，僅是單

  純不滿因性別的刻板印象被抹煞其努力、於是轉為替喬老大做事來報復警局，最後也不是

  因黑吃黑受傷，而是無法完成喬老大要她殺掉阿明的任務，所以反遭喬老大開槍射殺。在

  幾乎照搬台版劇情整部電影的時間，卻在後面刪去替電影製造懸疑感、帶給至少沒看過台

  版的觀眾驚喜感的機會。



  前面提到，《冥婚鬧泰大》不光是劇情，許多台版好笑的橋段也都被完整保留，其中當然

  包含最經典的在浴室因怎麼都不肯叫老公而遭附身，無意識裸體上街跳鋼管舞的那段，記

  得當時看着許光漢熱跳蔡依林的《舞娘》，然後搭配上客串警察的劉冠林的表情，意外構

  成非常有趣的畫面，而那句台詞「要叫死Gay（すげい）還是要叫老公？」，也展現出台

  灣人熱愛諧音梗的幽默編排。回到泰版部分，我自認有時候接收不到泰式幽默，儘管是同

  樣的劇情橋段、同樣的場景畫面，不知道為什麼就是笑不太出來，好幾處曾經看台版笑得

  很開心的地方，搬到泰版上來看就莫名的感到無趣，當然也有可能是因為看過所以再看就

  無感的關係。或許是有預想到水土不服的情況，《冥婚鬧泰大》顯然也在字幕翻譯上下足

  功夫，用盡力貼合台灣觀眾口味的翻譯試圖補足觀眾可能抓不到的泰式笑點，至於效果如

  何可就見仁見智。


  就我看來，《冥婚鬧泰大》是一部已然盡力且有誠意的改編作品，許多《關於我和鬼變成

  家人的那件事》中觸及到的議題都全然保留，還有主要的愛情線與親情線也都還在，若不

  是早已看過且喜歡台版，我想泰版依然能帶給觀眾不少的省思與感動。最後想談談幾位角

  色的演出，我認為在所有出場的角色中，唯一超越台版的大概只有對應小胖的角色，在被

  增加的戲份中有效的貢獻出為數不多的笑點，是泰版難得有讓我會心一笑的地方。其他例

  如隊長、可兒或者迪迪父親，不是戲份整個被刪除，就是所負責支線被抽掉或減少佔比，

  讓他們沒多少可以發揮的空間。至於兩位主角普提蓬阿薩拉塔納功與克里特安努艾德奇康

  ，過去就曾在電視劇《以你的心詮釋我的愛》中合作，之間自然存在著不小火花，只是相

  比台版許光漢與林柏宏的自然生動，泰版兩位男主角就顯得有些僵硬與刻意，特別是克里

  特安努艾德奇康沒有林柏宏的妖嬈與狡黠感，哭戲方面也讓人出戲，相比之下，普提蓬阿

  薩拉塔納功就稍微好一些。



  --'
