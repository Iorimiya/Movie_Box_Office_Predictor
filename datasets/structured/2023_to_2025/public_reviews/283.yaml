url: https://www.ptt.cc/bbs/movie/M.1440263701.A.C61.html
title: '[大好微雷][屍憶]近年來最棒的冥婚鬼片'
content: '好一段時間沒去看電影，在等待排隊買票的途中，不經意地被這張電影海報[屍憶]吸引住

  目光，於是最後選擇了這部電影，度過了令人屏氣凝神，卻又餘韻無窮的周末夜，它的故

  事主題選的是台灣人耳熟能詳民間習俗[冥婚]．然而以此為題材，故事又說得精彩的電影

  卻不多，這鬼片實可說是近年來難得的佳作．


  故事的前段節奏稍微緩慢，然而看似尋常的生活點滴，卻已在層層鋪疊．而劇本的用心，

  更可在交纏的敘事主線，前後呼應的情節鋪陳得到應證．驚悚的橋段不落俗套，也不會透

  過突然放大跳出的畫面嚇人，而是經反覆堆疊一系列不安的氣氛，音樂與音效，讓冥婚

  的現場彷彿近在眼前．比方說，當媒人婆邊喊著吉祥話「新娘行入廳，金銀財寶滿大廳

  ．」伴隨紅燭映照，叮鈴叮鈴的朱幔紅絲，反而顯示出一種難以言喻的怪異恐怖．


  影像語言及氣氛在經拍攝過《七夜怪談》、《咒怨》的恐怖大師一瀨隆重巧手下，呈現

  出一種乾淨，但又詭譎怪異的美感(如鬼新娘..)．而經吳慷仁，謝欣穎這些近年來在偶像

  劇活躍的演員們細膩對手戲詮釋下，後期更會有讓人恍然大悟的體悟．


  鑑於網路上討論的人似乎還不太多，很怕這部近年來難得的鬼片佳作就此湮沒，寫來推薦

  給喜歡或不排斥看鬼片/恐怖片，及對台灣傳統民間傳說[冥婚]習俗感到好奇的人．


  --'
