url: https://www.ptt.cc/bbs/movie/M.1195465506.A.B7F.html
title: '[影評] 《冥婚淒談》死亡，真的是終結嗎？'
content: "死亡，真的是終結嗎？\n\n文/SUPERMAN\n\n原文出處：\n\n經原作者SUPERMAN同意轉載\n\n冥婚淒談中文官方網站：\n\n\
  以下有雷喔~:)\n\n\n\n\n\n\n\n\n        1979年，二次大戰時期韓國京城(今首爾)裡最好的西式醫院「安生醫院」要拆除\n了，醫學院教授朴正男滿心感慨。舊地重遊，翻閱老相本，他回憶起20歲那年，他在安生\n\
  醫院中當實習醫生時的幾件靈異經歷，那短短的四天，把活著的、已死亡的幾個人和鬼的\n命運緊緊連繫在一起，時過卅多年，他知道，該來的，終於躲不過……。\n\n  \
  \      從我首次從《三更》這部泰國、韓國和香港合作的三段式電影中接觸到韓國鬼片\n後，就對片中跳躍式的劇情和毫不手軟的「血腥」描述印象深刻。這部《冥婚淒談》，更\n\
  是將這個特質發揮得淋漓盡致，在情節推理的吸引和不斷出乎意料的視覺衝擊下，成就出\n一部風格強烈的靈異怪作。\n\n        打片子一開始，立刻就是一段老年正男在課堂上播放為日本軍官打開後腦袋瓜動\n\
  手術的紀錄片，接續短短的敘述，一回憶，鏡頭馬上就跳到解剖室裡死人的手臂，和年輕\n正男(陳玖飾演)作勢欲嘔的表情，編劇兼演導的鄭氏兄弟，似乎自始就打定主意不給觀眾\n\
  太多喘息的機會，務必要讓人毛骨悚然到劇終最後一刻不罷休。\n\n        於是乎，氣氛的營造是不用說了，古老的醫院，陰冷的停屍間，忽明忽滅的燈光\n，詭異的尼姑……，鬼都還沒出來，氣氛先就令人窒息。當以為鬼要出來了，偏偏歸於平\n\
  靜，當以為沒事了，淒厲的鬼卻猛地出現，驚得人差點要跟劇中人一同尖叫──任你膽子\n多大，明知只是電影，是假的，都難免心驚膽跳。\n\n        其中有一幕，出了車禍的母親抱著女兒，結果雙雙滿身是血地倒臥在雪地中的鏡\n\
  頭，鮮紅配上雪白，視覺效果極其突出，使人震撼。類似的影像很多，不一而足，就像貫\n穿全片的小蝸牛，黏膩又似有目的的蠕動，傳達出渺小卻不可忽視的恐怖影響力，意境深\n\
  遠。\n\n        不過嚇人的鬼片多的是，大多用突如其來的巨響嚇你一下的也比比皆是，但是真\n相呼之欲出的時候，往往使人覺得不過爾爾，純粹進戲院當被虐待狂而已。然而\n\
  \n\n\n\n\n        所以嚴格說起來，全片其實主要是由醫院裡三段不相干的個別事件──正男和女\n屍的冥婚，從車禍中存活的小女孩朝子和醫生秀仁(李東奎飾演)之間的情愫，以及女醫生\n\
  仁英(金寶京飾演)因精神妄想症而生的殺戮──所串聯起來的，每一段都具有個別的意義\n，探討愛情所衍生出的人性自私、佔有慾和精神上的無法解脫，以一部鬼片來講，可以說\n\
  內容相當豐富。\n\n        比較可惜的地方是動畫技術仍有待加強，特別是用藍幕嵌鑲影像，處理「沒有影\n子」的人的部分，人體的大小和周身都和背景無法完全融合，很明顯的突兀，倒不如用其\n\
  他方式來表達沒有影子，還不會這麼自曝其短。\n\n        我的感覺，韓國人個性上的剽悍，也在這部電影裡表露無遺。──小女孩朝子竟\n會以行動來忌妒母親和繼父的親密，而母親死亡後，竟然夜夜化作厲鬼不放過女兒，不是\n\
  嚥下最後一口氣的時候說了「媽媽不會怪你的」嗎？最驚悚的是朝子居然會對愛護她的醫\n生秀仁展開了終極的佔有，真叫人思之不寒而慄。那麼說起來，仁英的執念，甚至於女艷\n\
  屍對冥婚夫婿正男的苦苦糾纏，也就不足為奇，一脈相承了──好暴烈的個性啊！如果是\n這樣，那\n\n        看罷這部片子，我人似乎像剛從電影中的停屍間與冰天雪地、那種舊時代的恨海\n\
  難填裡跳出來一樣，渾身發冷。走出戲院，外頭雖然冷雨天，但是白花花的午後天光，卻\n感覺出奇的溫暖，不外是因為這場電影──\n\n\n\n        真嚇得我差點要去收驚，我這種看恐怖片往往不痛不癢的人。也是次難得的經驗\n\
  。\n\n\n\n\n＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊＊\n\n\n\n中文官方網站： (內有中文預告片)\n\n韓文官方網站：\n\
  \n--\n◆ From: 220.132.126.216"
