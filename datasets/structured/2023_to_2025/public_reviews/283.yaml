url: https://www.ptt.cc/bbs/movie/M.1472183402.A.F16.html
title: '[片單] 像冥婚淒談這種類型的片'
content: '昨晚看完之前的韓國恐怖片冥婚淒談

  很喜歡這部的配樂與特效

  還有敘述故事的方式和使用的意象

  像是冥婚的男主角突然被女屍托進屍櫃

  還有車禍女孩做惡夢夢見鬼媽媽

  那種陰慘的畫面真的嚇到我了

  另外就是意像的部分真的很唯美

  像用雌雄同體的蝸牛作為陰陽兩隔的冥婚象徵

  三段故事敘述手法也頗特別


  有別於美國那種直線式劇情的俗爛恐怖片或是融合搞笑的泰國鬼片

  真的很喜歡這種型的片

  不知道有沒有大大能推薦這種風格的電影

  感恩


  --'
