url: https://www.ptt.cc/bbs/movie/M.1639756575.A.AF4.html
title: '[新聞] 許光漢、林柏宏將合作新題材「同志冥婚'
content: '期待！許光漢、林柏宏將合作超新題材「同志冥婚」 雙帥合體網暴動

  2021-12-15 18:17:40

  by 可可

  若要說現在誰是新生代的男演員，許光漢與林柏宏絕對榜上有名。許光漢出演的《想見你

  》到現在都還是無人能敵，林柏宏也接連演出了台灣質感好戲，這兩位目前的聲勢持續上

  漲中。沒想到就傳出許光漢與林柏宏合作的消息，而且這次還是超新穎題材：同志冥婚。




  兩人合作的新戲《關於我和鬼變成家人的那件事》目前已經開拍中，也有網友們捕捉到煦

  光漢的新造型，許光漢留起平頭，身穿著警察制服，手帶白手套，這段同志、冥婚與警察

  辦案的故事，讓許多人都很期待呢！





  不僅男主角的大有來頭，導演程偉豪也曾經執導過《紅衣小女孩》、《緝魂》等作品，並

  由《當男人戀愛時》團隊製作打造。雖然現在《關於我和鬼變成家人的那件事》還沒有正

  式宣傳，不過已經讓人非常期待林柏宏與許光漢會擦出什麼樣的火花了！





  --'
