  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  在DVD看過犯罪都市2後

  看到3的預告

  就很想看


  平常是看五股工業區內的國賓

  國賓你知道的

  某原因沒在國賓上映


  這次選樹林秀泰看

  觀看時間為20230606

  觀看廳為11廳

  時間為2000


  此廳優缺點

  優點

  較新

  入場明亮

  畫面大  聲音有不錯


  缺點

  椅子坐起來沒那麼舒服


  一張票全票290元

  沒買吃的


  犯罪都市3觀後感


  我只看過2跟3

  只拿這兩部作比較


  優點是

  拳拳到肉

  幾乎秒殺解決

  是爽片

  還蠻舒壓

  一些像是朋友聊天的笑梗還可以

  但沒上集好笑


  缺點

