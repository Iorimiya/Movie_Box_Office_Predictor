title: '[普雷] 犯罪都市3'
content: '看過犯罪都市1跟2，當然也是要看3一下


  但這集明顯沒有前兩集好笑和好看


  首先就是馬因為升上廣搜隊，所以以前的有趣同事長官不見了，少了一味


  個人覺得沒以前爽的感覺就是，這次因為有兩個壞人頭目，基本上壞人都是在殺壞人，比

  較沒有那種壞人欺壓百姓壞到讓人生氣的感覺



  然後壞人根本沒有前兩集的壓迫感和讓人覺得馬東石可能會陷入苦戰的感覺



  韓國惡警只會打被綁起來的人，日本黑道是拿武士刀砍拿小刀的，根本都是虐菜


  不像前兩集的壞人那種狠勁



  最後讓人不爽的是，馬東石那邊的線人，也是流氓，強迫一般百姓買泡水事故車累犯，最

  後還是跟馬東石那群一起慶功


  讓人傻眼


  ps：因為聽過朋友買二手車買到泡水車，車商處理的方式，所以看了可能特別不爽吧


  --'
