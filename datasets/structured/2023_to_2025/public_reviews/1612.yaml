url: https://www.ptt.cc/bbs/movie/M.1685871682.A.746.html
title: '[負雷] 犯罪都市-這片真的有夠爛'
content: '為什麼說這片有夠爛


  因為這片根本太寫實了


  無論是路上充滿8+9


  還是官商勾結


  公職人員跟黑道勾結


  通通都跟台灣正在發生的一模一樣


  要看這種片打開新聞看就好了


  看甚麼電影


  還要花錢



  艮！


  真的有夠浪費時間



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  故事是說三個韓國警察(朱成哲與他兩個快樂下屬夥伴)跟日本黑道勾結在韓國販毒的故事


  韓國警察為了賺大錢 居然偷偷拿日本黑道的毒品去賣給中國黑道的故事


  故事一開始是販毒集團約定在碼頭交易毒品


  結果被掃毒組的組長跟蹤了


  然後掃毒組的組長還沒來得及叫人就被抓了


  最後被朱成哲拿棍棒打爛他的頭 然後丟包下海裡




  後來鏡頭切到路上有行車糾紛


  鬼切8+9自己有錯 卻幾個人下車揍直行的民眾


  貌似有練過拳擊的樣子


  然後主角馬錫道就下車揍那些8+9 差點被警察同行抓


  然後就進廣搜隊的畫面 說馬錫道太暴力了一些有的沒的


  後來接到電話 有個女森墜樓 結果查出是吸毒致死以後被丟下去 而不是自殺


  然後馬錫道等人就開始到各夜店查毒品來源


  抓了幾個卒仔


  然後有掃毒組的同事跟馬錫道說他們組長失蹤了


  失蹤前就是在查這批毒品


  然後馬錫道去找朱成哲要調閱調查記錄


  朱成哲就知道馬錫道在調查毒品案了 但朱成哲那時還沒把他們看在眼裡


  但是朱成哲偷拿毒品去賣的事被日本黑道發現


  日本黑道派了殺手瑞奇到韓國追查毒品下落


  並接管了韓國分部 把叛徒殺光光 連拿毒品去藏起來企圖保命的叛徒也殺了


  馬錫道、朱成哲、瑞奇三組人就開始在找毒品


  馬錫道是為了查案


  朱成哲是答應了中國黑幫要賣毒給他們必須找到毒品


  瑞奇則是因為日本的老大說要找回毒品


  然後馬錫道先找到毒品 叫線人打電話去給朱成哲約交易


  朱成哲騙瑞奇說可以在某個地方拿到毒品


  然後馬錫道暗中護送線人帶假毒品去交易地點


  然後線人被揍 馬錫道出來保護 被瑞奇的手下用球棒偷襲兩下暈到(應該是故意裝的)


  然後被瑞奇壓到他們的地盤去詢問


  同時朱成哲埋伏了馬錫道的同事的車 把真毒品搶走了 準備要拿去賣了


  拿了300億韓元以後偷渡中國逍遙快活


  後來馬錫道到了瑞奇的總部把瑞奇和他的手下痛揍了一頓抓起來


  然後跑去朱成哲辦公的地點 把朱成哲也揍了一頓抓起來


  最後慶功宴


  然後The End









  整部片講的


  第一個就是官商勾結 喔 看看精美的i.mb 不是一樣的道理嗎


  第二個劇裡有8+9在路上亂打人 二手車商拿泡水車逼一般民眾買單 旁邊還站著流氓


  跟台灣差不多


  然後打來打的片看多了 說真的沒啥意思


  boss也太弱了 挨幾拳就暈


  太寫實的電影根本就不需要花錢去看


  跟看千萬別抬頭有異曲同工之妙


  所以給負評


  --


  是，也是。




  --'
