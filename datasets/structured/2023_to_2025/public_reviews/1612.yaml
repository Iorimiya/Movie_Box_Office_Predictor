url: https://www.ptt.cc/bbs/movie/M.1684249113.A.933.html
title: '[新聞] 馬東石《犯罪都市3》再開扁 對手增重20公'
content: '新聞網址：


  2023-05-16 中時新聞網 李承陽


  馬東石《犯罪都市3》再開扁 對手增重20公斤仍不敵巨拳壓迫感


  電影《犯罪都市3》是主演馬東石率領去年韓國年度票房冠軍《犯罪都市2》原班團隊打造

  的痛快續作！韓國片商於6天前在官方YouTube公布的電影預告，目前已突破百萬觀看次數

  ，許多觀眾都已等不及進戲院看馬東石痛懲惡棍們，台灣片商也於今日公布《犯罪都市3

  》中文版電影正式預告，動作全面大升級！


  繼《犯罪都市》和《犯罪都市2》後，在《犯罪都市3》中實現正義的馬東石強調想在本作

  中做些改變，馬東石表示：「隨著『馬錫道』（角色名）來到首爾廣域搜查隊，新型犯罪

  與反派角色也登場了。我想多展現全新的樣貌，若說前兩集的動作戲是一氣呵成，那這次

  則是更有節奏感的連擊！」


  另馬東石之前曾將在《犯罪都市》、《犯罪都市2》中飾演反派角色的尹啟相和孫錫求分

  別比喻為老虎和獅子，這次他則將《犯罪都市3》中飾演反派人物「朱承哲」的李浚赫、

  飾演「瑞奇」的青木崇高分別比喻成狼和禿鷹，他表示：「『朱承哲』就像野外飢餓的狼

  般單打獨鬥時很強，但也會利用團體的力量爭取想要的東西；『瑞奇』則像禿鷹一樣，站

  在高處俯瞰著，若出現獵物的話就會等待對方上鉤！」


  馬東石，透露拍攝《犯罪都市3》時有許多煩惱和感到辛苦的情況，他表示在他小時候準

  備當拳擊選手時，肩膀曾不小心受過傷，因此會多注意不讓自己掛彩，但馬東石無奈表示

  ：「即使已經很注意安全地進行拍攝了，但手指和腳趾還是很常受傷。」且他還透露：「

  為了拍攝拳頭停在臉前1公分距離的細節畫面，我真的費盡苦心，總是煩惱著該怎樣做才

  能讓動作看起來很俐落，還因此壓力大到有了圓形禿！但在看到拍攝的畫面後，覺得所有

  煩惱都消失了！」


  出道17年的李浚赫，這次在《犯罪都市3》中飾演反派「朱承哲」，他不僅是毒品案的背

  後主導者，更是系列作品中首名在「馬錫道」面前仍毫不畏懼的惡角。而且李浚赫還為了

  「朱承哲」這個角色增重20公斤，努力運動鍛鍊身材，並在動作戲上費盡苦心。


  李浚赫還吐露和馬東石共演動作戲時辛苦的地方，他說：「以前打拳擊時曾被揍過肚子，

  即使已經穿上護具且精準地調整打法，仍忍不住痛苦地哀嚎！而且馬東石前輩的拳頭在我

  眼前1公分的距離來來回回時，雖然我努力不閉上眼睛，但巨大的拳頭有著不尋常的壓迫

  感！」


  --'
