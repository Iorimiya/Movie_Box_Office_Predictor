title: '[好雷] 犯罪都市3-拳拳到肉高爽度'
content: "雷文防雷資訊頁\n \n \n看過1.2集，必須支持的觀影好選擇。\n以下多劇情雷，慎入。\n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \ \n \n \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n \n \n\
  \ \n角色介紹：\n一、東哥&拳律師、快樂收割小伙\n二、黑警鄭伊健、快樂打雜小伙\n三、日本背骨仔\n四、日本殺手組\n五、中國倒霉仔\n六、特別介紹-柯有倫\n\
  \ \n劇情大綱：\n東哥尋著一宗凶殺案追出日本在韓的販毒組織，一路跟著拳律師查探到鄭伊健是連同背骨仔\n暗槓組織毒品的幕後黑警，除了殺手組跟鄭伊健能在拳律師手下走2回合，其他都是痛快俐?\n\
  的2秒KO，中間不時穿插小笑點，整體視覺享受和娛樂效果都相當不錯。\n \n嘈點：\n一、鄭伊健被吹太高，單槍匹馬解決白鯊魚幫，虐菜倒霉仔，遇到拳律師時表現遠不如前面\n\
  的Boss，浪費編劇還特意安排同橋段賄賂台詞。\n二、柯有倫算是案情推動的一大助力，不給他一點好處真的慘，只得到了一小條的車窗縫縫\n，反觀前2集的串場角張會長夷帥在彩蛋中看來越來越發達啦。\n\
  三、燈籠在本集完美取代張夷帥的角色，還順便臭了一下二手車行的水好深。不過中間有提\n及白鯊魚幫的當初都被處理掉了，那燈籠是漏網之魚？\n----\nSent from\
  \ on my iPhone 8\n \n--"
