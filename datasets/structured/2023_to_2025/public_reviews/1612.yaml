title: '[新聞]《犯罪都市3》瘋狂橫掃韓國票房 預售占比飆'
content: '《犯罪都市3》瘋狂橫掃韓國票房 預售占比飆破87% 打破韓國影史紀錄！


  Yahoo奇摩電影戲劇


  2023 年 5 月 31 日 週三 下午 9:35



  馬東石、李浚赫、青木崇高向臺灣觀眾問好！


  馬東石最新動作鉅獻《犯罪都市3》今天（5/31）在韓國正式上映首日上午8點，預售量逼

  近64萬張，預售率占比突破87%，比起《玩命關頭X》的1.5%的預售率整整多出58倍！而這

  也超越2019年《寄生上流》在韓上映首日上午8點預售量50多萬張的紀錄，同時也是韓國

  電影睽違5年預售量突破60萬張的電影作品！還超越了《與神同行：最終審判》（2018年

  ）、《軍艦島》（2017年）當時上映首日（上午8點）的預售量50萬張，讓《犯罪都市3》

  躍升成為韓國電影影史上映首日預售率TOP1！而《犯罪都市3》的這項紀錄也遠遠超越了

  去年韓國年度票房冠軍《犯罪都市2》上映首日上午8點預售量31萬張的紀錄，因此許多媒

  體都認為《犯罪都市3》是韓國電影復活的信號彈！



  《犯罪都市3》馬東石



  《犯罪都市3》李浚赫



  《犯罪都市3》青木崇高


  此外，《犯罪都市3》在韓國正式上映前，就以限量放映形式進行口碑場上映，在5/29（

  一）就擊退《玩命關頭Ｘ》登上票房冠軍寶座，預售率甚至飆破86%，截至昨日（5/30）

  的累積觀影人次已達48萬3344名，累積票房突破51億韓元（資料來源：KOFIC），引爆全

  韓觀影熱潮！《犯罪都市3》主演馬東石、李浚赫、青木崇高也特地錄製影片向臺灣觀眾

  問好（），他們表示：「系列作中首次有兩名惡角同時登

  場，將展現更痛快的動作場面！希望大家能藉由無可取代的本作紓壓，請大家多多支持《

  犯罪都市3》！」年度動作震撼鉅獻《犯罪都市3》本週五6月2日在臺上映！



  《犯罪都市3》馬東石



  《犯罪都市3》李浚赫



  《犯罪都市3》青木崇高


