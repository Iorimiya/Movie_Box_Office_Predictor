title: '[新聞] 馬東石超威 《犯罪都市3》韓7天吸15億'
content: '新聞網址：


  馬東石超威 《犯罪都市3》韓7天吸15億


  2023-06-10 中時新聞網 孫伊萱


  韓國「最強大叔」馬東石親自企劃、主演動作片《犯罪都市》系列再度成為韓國電影救世

  主，最新1集《犯罪都市3》在韓上映1周，累積觀影人次便超過600萬，票房近600億韓元

  （約15億台幣），台灣晚韓國2天上映，也是不到1周賣破千萬，不僅空降全台新片票房冠

  軍，更是上映3天便勇奪今年韓片在台票房第1名寶座。


  《犯罪都市2》去年5月中上映，恰巧遇上韓國全面解除疫情相關規範之時，加上爽度破表

  的劇情，成為民眾疫情後解悶的首選，最終以1269萬觀影人次的佳績，成為暌違3年觀影

  人次破千萬的韓片，相當於韓國五分之一的人口看過該片，票房高達1321億韓元（約31.1

  億台幣），在此之後都尚未有其他韓片可以突破。


  今年上半年韓影市場更是低迷，雖陸續推出高成本的大製作，卻只有以韓國烈士安重根為

  題材的音樂劇電影《HERO》最終獲327萬觀影人次，勉強接近損益平衡點，玄彬、黃晸珉

  主演《火線交涉》和朴敘俊、IU主演《Dream》等陣容華麗的作品，觀影人次竟未超過200

  萬，連拍片成本都賺不回，在台票房也很慘烈，目前賣最好的韓片《火線交涉》票房僅

  643萬，再來則是《靈魂伴侶》305萬。


  雖然近年韓片持續在國際影壇發光發熱，但由於戲院狀況仍不明朗，多部強檔決定直接賣

  給串流，不少業內人士擔憂韓片會不會因此從院線消失，甚至透露目前投資商已紛紛將目

  光轉往電視劇，演員們受到《魷魚游戲》成功的刺激，也都更傾向於演出國際串流平台的

  作品。幸好《犯罪都市3》扭轉了這個頹勢，票房上升速度甚至更勝前作，為韓國電影打

  了一劑強心針。


  另外，前1集大反派找來當時因《我的出走日記》暴紅的孫錫久演出，讓他人氣再上一層

  樓，這次則找來曾演出《城市獵人》和《秘密森林》的李浚赫飾演惡角，隨著票房持續上

  漲，李浚赫的討論度也不斷飆升，現年39歲的他，帥氣程度完全不輸當紅小鮮肉，就連出

  席映後活動穿上宣傳T恤的照片也能登上熱搜，讓不少網友看到後直呼「衝著這張臉我一

  定要買票進戲院支持」。


  --'
