title: '[普雷] 犯罪都市3'
content: '前兩集我已經忘光了

  但這次有日本流氓的加入


  可以看到不同元素的打鬥

  可以看到日本人拿武士刀亂砍

  日韓兩種風格碰撞滿舒服的



  但是有些小缺憾

  例如馬東石的拳頭感覺沒有打到肉上

  取而代之就是揮拳過去之後的音效

  還有人飛很遠


  但我想看的是紮紮實實的打到身上那種衝擊感



  再來械鬥的感覺很不真實

  可能因為台灣黑槍太氾濫會覺得裡面的人都敢殺人了為什麼不用槍！

  攸關三百億的利益比起拿小刀揮怎麼不用槍！

  （雖然最後面還是有用、加上這是一部打架動作片當然要把畫面留給馬東石揍人）


  還有反派明明只是個警察組長到底有啥本事跟日本大黑道叫板

  有一點出戲（應該給他更厲害的背景或是警界更高地位才對）



  我看爽片幾乎都不太在意劇情但是這部還是些微出戲，打擊的部分能再更拳拳到肉就更好

  了


  馬東石的拳擊動作真的很帥，整部也算舒壓，但沒有非要進電影院看不可


  近期的爽片都有看



  推薦順序

  玩命十

  變形金鋼

  罪犯罪都市3


  --'
