url: https://www.ptt.cc/bbs/movie/M.1685798961.A.DA2.html
title: '[好雷] 犯罪都市3 亞洲第一鐵拳東石哥'
content: '看過1跟3 2沒看~今天剛看完3

  雖然1忘了很多不能直接比較 但至少3從娛樂面跟戰鬥場面來說

  我是覺得好看的~ 我大馬哥簡直比以往更神勇 每一拳貫的都超爽超遠

  反派基層其實感覺也有升級 日本有幾個都打的很不錯


  劇情也算是有設計過了 節奏也快 時間很快就過去

  這次就是壞韓警+日黑道+馬哥兄弟 三方勢力的彼此牽制

  然後好笑的地方還是很多 全場真的蠻多笑聲的


  馬哥嚴格來說 我覺得比前兩集都強了 武力值再升級

  只是為了強調敵人 以及馬哥也是人 所以這次馬哥也挨了很多頓揍

  被撞 被打到昏 被砍........... 不過某程度反而讓劇情更扯 幾乎快變不死之身了XD


  壞警察動手不算太多 但身材好 演技壞的也不錯


  整體而言小缺點 其一就是這系列共通的Bug

  大家都很講武德 除了警察一次用槍壓制 其他時間大家都很江戶風

  不是動拳頭就是有志一同最多球棒跟刀子(最多)


  另一個比較可能讓人失望的就是 不曉得是不是要凸顯馬哥威能

  或者不能讓日本人太威... 看到左之助拿起武士刀 第一段真的很殺很爽

  問題到最後 真的像之前版友所說... 最後一戰小弱掉 變成反而本體是武士刀的感覺

  反而前面的手下 接連打了兩戰 纏鬥時間似乎還比較強一點

  變成這第一殺手有點雷聲大雨點小...這點真的是導演端的失誤

  畢竟剛出場刻劃的真的很好(我反而覺得青木崇高那場是本戲最精彩一場)

  青木崇高之前演神劍時 整個劇情也很強調要練真的 他應該也是有底子的

  不然至少讓馬哥也拿個武器之類 而不是馬哥一樣一雙鐵拳就把武士刀高高手就痛扁


  最後一關還是回到本土韓國壞警察 但這邊也就稍微抗衡一下

  本來就沒要特別凸顯他的武力 大部份時間也是挨揍


  但... 扣除最後應該可以更爽 這真的是夠狠又夠爽的片了

  完全不留手 夠暴力 夠血腥~ 想享受聲光娛樂跟動作片的真的可以推


  --

  題外話 又一次看到國村隼又笑了出來

  他真的是韓影御用日本壞蛋了呀XDDDDDDDDDDDDDDD


  --'
