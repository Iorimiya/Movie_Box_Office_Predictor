content: '優點：


  節奏很快，不到兩個小時一下子就過去了


  劇情非常好懂，但不會無聊，笑點不多，但都很自然有趣


  黑道很狠，不會囉哩八嗦的，真爽快。便當很敢發，就是直接一刀捅進去砍進去之類的


  看馬東石揍人很過癮，拳拳到肉擊打的感覺很真實，尤其是重拳出擊，打到人之後看到人飛出去，加上電影院的重低音真的很爽


  這部片也是娛樂好片，非常舒壓


  至於沒有看過第一集跟第二集完全沒差


  只有片尾小彩蛋有一點看不懂而已但也沒有關係


  評分：7.9/10








