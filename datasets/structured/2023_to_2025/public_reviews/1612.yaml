title: '[普雷]犯罪都市3 - 打戲很過癮劇情稍顯普通 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  本來就是抱持著來看馬東石打戲的一部爽片，整體上來說不會到失望，除了拳拳到肉的戲

  份之外，還是有一些好笑的地方，尤其高圭弼和全錫浩哈哈哈，一到他們的戲份看他們被

  馬東石打的抱頭亂竄，最後還不得不配合就覺得很好笑。


  有一幕馬哥去找燈籠問他Tomo桑在哪，本來燈籠不想跟去怕被殺，結果馬哥一句你現在不

  去馬上就會被揍，燈籠不帶任何猶豫地馬上起身說走吧，真的超好笑！！還有一本正經的

  說雖然朱成哲長得很帥，跟他一樣是美男子XD 不知道為什麼我就很吃這種梗哈哈哈



  除了打戲中間穿插的輕鬆對話之外，整體劇情必須說跟一般警匪動作片來說沒什麼太大的

  差別，尤其警察監守自盜的部分也是很常見的戲碼，而且最後解決Ricky和朱成哲時根本

  就是在虐菜，而且我以為像朱成哲這種壞事做盡的人，應該會隨身攜帶槍才對。但是他看

  到馬哥的第一個反應也是拿個棒球棍而已，後面才想起要拿槍...就雖然打戲是大家看這

  部的重點，但就有點覺得不太符合常理


  總之單純以想看馬哥精彩的打戲的話，這部還是可以順順地看完，看完也會覺得很爽，但

  比較在乎劇情的人，可能就會覺得小可惜的一部片


  題外話韓劇看太多真的很容易串戲哈哈，尤其前面在橘子夜店裡販毒的那個人長的超像模

  範計程車2毒品那集的victor，後來發現就是同一個人！！他是被定型了嗎怎麼都演這種

  的XD 還有李浚赫一出場馬上就想到最近非法正義裡他演一個有點瘋瘋的男主粉絲～



  --'
