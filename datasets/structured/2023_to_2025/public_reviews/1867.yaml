url: https://www.ptt.cc/bbs/movie/M.1675848083.A.CC0.html
title: '[好雷] 山中森林含意之深非主流的拍攝'
content: '雷文防雷資訊頁


  其實會進電影院完全是衝著李康生男主角進去的，另外也很好奇這部電影的拍攝手法。


  而且看完的時候滿驚訝的，因為我整部看哭了好幾次


  除了導演捨棄了狗血跟戲劇張力的拍攝手法


  改用寫實的鏡頭下去拉近


  我當下其實滿佩服導演的尬斯，因為在這個抖音跟YT充斥的時代


  選用反其道而行一定吃不到觀眾共鳴(畢竟不是吃聲光跟特效的爽片)


  又採用演技跟內心戲的描寫手法


  一看之後就覺得這個團隊真的是有燒錢不回本的想法


  與其說他是黑道電影，對我而言他真的更像是一部很真實的記錄片



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  我覺得這整部片的描寫是深層而且需要細細品味的


  有好幾幕的畫面其實滿衝擊到我，需要出去抽根煙平復情緒回來再看



  一開始生哥剛出來，對於隔絕了十多年外面的世界，感到陌生又熟悉


  遇到了小靜

  話說李千娜這邊的床戲真的讓我腳指頭摳出一室三廳

  如果導演要轉行一定可以去拍AV，保證部部都是經典(開玩笑)


  其實不難看出所謂的黑道也有一般世俗人的煩惱

  而且身為江湖中人的他們，不管身在哪個位置，都有著他們自己的身不由己



  整部戲其實讓我印象最深刻的是

  生哥坐在故宮的台階上看向遠方的時候

  錯過了蓮花式溫婉青窯

  而為了生活下去只能將自己染了一身黑

  好像世界剩下的就是象徵身份地位的超跑名車

  可是自己卻捨棄了光鮮亮麗的生活以及光明前途的未來

  自己世界除了黑不能有也不會有其他色彩




  尤其片尾穿插莊子跟惠子知魚之樂

  生哥看著魚缸然後又死在夜市的撈魚池


  就很像說，不管你今天是一隻破萬的金龍

  還是一隻夜市的小金魚，一樣都活在魚缸當中


  為了食、為了情、為了利益

  不停的游不停的爭鬥，終其一生


  就很像我們都是生活在世道當中的人，只要活著


  「就沒有一個人是局外人‧」


  而且穿插著兄弟的義氣，當然也有糾纏不清的愛情

  為了利益、為了公司、為了位子

  站在位子上的每一個人為了這些事情付出的犧牲與代價



  尤其是浩子

  讓我印象很深刻除了他是癡情種之外

  他是整部戲當中最有"色彩"的

  除了對艾莉絲的深情到後面的婚禮

  開著麥拉倫陪著馬子在摩天輪約會


  也為了恩情跪著求生哥讓他一起跟著出海

  雖然這樣對不起了懷孕的艾莉絲

  但這也鮮明的角色，的確靈活的呈現每一個江胡中人的敢愛敢恨


  我比較意外導演在本片用了很多高深的隱喻

  像宋代青窯，徐志摩的偶然到片尾的莊子知魚之樂。穿插的好深奧啊

  小靜在車上唱的就是徐志摩的偶然


  當然還有很多深刻的描寫手法

  從一開始生哥還想要回頭，念舊他爸的香腸車的無可取代(重感情)

  到倔強從北海岸走回台北市區

  雖然輕描淡寫，但懂的就懂導演撲寫出來的世界是什麼



  或許在那樣世界的男人，就算哭就算失去了一個好兄弟

  對於他們而言也只能在浴室當中隨著灑出的水混雜著淚水

  邊搥著牆壁邊宣洩自己的情感吧!?





  我反而對於感情線覺得還好

  因為小靜本人

  可能對生哥是一種感恩吧

  謝謝他給她重生的機會


  在計程車上邊唱著"偶然"也只不過去接受早已知道的結果


  成年人就算哭都是靜音的

  只是學會從無理取鬧變成默默接受而已




  沙鷗哥完整呈現了一個大哥從小到大到隕歿

  演的真的恰如其分

  角色鋪陳這個角色真的很會寫，哈哈哈哈(指)



  小靜這個角色喔

  我個人覺得她只是真實反現出這個社會的一個小縮影而已

  而且清楚自己的人才會懂得自己要什麼

  就算面對像生哥這樣的大人物，看的一樣是生哥的本質

  達到自己目標之後毫不戀棧的走了


  在許多時候她可能也是一個小女孩需要依賴需要愛情

  需要有人在旁邊陪伴

  很慶幸她還是回到正途，但是她會不會又回去阿(?)





  本部最不一樣的可能是因為導演非本科出身

  也沒有灑狗血的劇情，反而更貼近於現實當中，讓角色更加鮮明生活化





  黑道電影圍繞的就是情一字

  不管是兄弟之間的義氣互挺

  還是皓子跪著求大哥償還恩情的那一刻


  *導演請給我一刀未剪一鏡到底的浩子* 看我打這麼多字心得文


  其實很多時候真的滿灑淚的(這個真的每人感受度不同)


  那種道盡無奈卻訴不盡無奈的深觸，嘖嘖



  還有面對心愛的人不得為為之的無奈

  還是要提醒大家一句

  那個最為你好的，絕對是最愛你的。

  無論選擇了什麼樣的路，一定要珍惜身邊的人事物

  #宋朝青瓷蓮花式溫碗






  本人的電影觀在此謝謝各位，也謝謝這個電影團隊拍了這麼好的作品給我們

  像新聞說的，這真的是一個深度寫實片


  至於被刷一星，我也只能替導演抱不平

  因為不同於現在的誇張與戲劇化的非主流，自然得不到網路世代的共鳴


  但我本人是真的給很高的好評(我個人真的滿嚴格的)

  有興趣的可以去電影院看看



  --'
