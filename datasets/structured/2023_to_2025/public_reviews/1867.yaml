url: https://www.ptt.cc/bbs/movie/M.1681315726.A.33E.html
title: '[好雷] 山中森林-再看小康的「臉」'
content: '本文以蔡明亮電影的小康

  與近期的臉 紀錄片

  脈絡切入


  給大家參考參考




  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  本以為抱著在粽邪2李康生的出戲感，同時身為熟稔蔡明亮影迷的逗趣後設解讀，沒想到

  在《山中森林》裡的小康成為不僅是延續著蔡明亮電影歷程與現實生活的整體生命，並且

  還從「單純」的藝術世界跨越到入世的黑幫電影中的花花世界成為另一種時間的積累，無

  疑解放了蔡明亮後期過於佛系的美術館fine art「樸實無華」路線，賦予了更加生活不同

  生命經驗的「臉」。



  大哥因為義氣開槍殺人被關了12年出獄後重新進入社會，面對幫派與兄弟的歷練考驗。如

  此好像沒有太過意外的劇情，除了典型的黑幫片有仇殺駁火，愛情或性愛場景，權謀與懸

  疑情節等等，也像是因為李康生的加入，多了類型電影沒有的紀錄片式的生活感，雖然自

  己只是因為去年工作室回家時常騎腳踏路過林森北，卻在電影中約略可以感受到某種好像

  其實也沒幹嘛的（往往就是在KTV酒店應酬盤撋（puânn-nuá））兄弟生活。同時映照著

  小康升級成大哥出獄後，沉默寡言時常眉頭深皺喜歡放冷箭卻與年輕後輩折射出不少意外

  效果。



  電影中出現不少李康生臉孔與身體的特寫獨白，若說蔡明亮的《臉》已經把過往的人生都

  濃縮到一張「抽象」的臉，無疑《山中森林》中小康的臉又像是再墮入紅塵，呼喚出蔡明

  亮早期如《青少年哪吒》對於台北城市生猛又疏離的創作活力。而早已步入中年的小康，

  除了還能在蔡明亮中當流浪漢成為無處可去（no way out），飾演出獄大哥的又稍微無縫

  接合著同樣歷盡滄桑的生命歷練，幾個鏡頭還讓人想起溫丁黑芬（Winding Refn）的罪無

  可赦（Only God Forgive）中把黑道類型片影像藝術化的企圖。



  也許就正常的黑幫電影來說《山中森林》介於藝術與商業感有點不上不下，同時小康的演

  技與口條特別的「疏離感」時常讓人覺得出戲，但身為「前」蔡明亮影迷，更欣然看見小

  康在蔡導好像已經不會有甚麼「新作品」的「入定」，自己獨自跨出藝術小圈子同溫層的

  企圖，甚至也感染著原本商業類型片制式化的敘事與氣氛。





  --


  拉特飯 - 以商業力量進入獨立市場


  --'
