title: iTunes多部$80起 五星主廚快餐車.掃毒3.山中森林
content: "完整收藏片單 :\n\n\n$90 五星主廚快餐車 : \n\n爛蕃茄87%，美食小品口碑之作，鋼鐵人導演強法夫洛自導自演。\n\n-\n\n\
  $90 假面飯店2-假面之夜 : \n\n東野圭吾原著改編，木村拓哉.長澤雅美主演，蠻少見覺得比第一集好看很多。\n\n-\n\n$90 掃毒3：人在天涯 :\
  \ \n\n邱禮濤執導.郭富城.劉青雲.古天樂主演，算是蠻經典長青的香港大型動作片系列。\n\n-\n\n$90 山中森林 : \n\n李康生.李千娜主演的黑道劇情片。\n\
  \n-\n\n$90 叛諜檔案 : \n\n黑暗騎士雙面人 亞倫艾克哈特 主演的小品諜報動作片。\n\n-\n\n$90 雉岳山怪談 : \n\n正宗韓國怪談，改編真實山難事件，電影還加入了一點克蘇魯元素，前半段懸念氛圍營造\n\
  的真的有怕到，後半段算是腦洞大開。\n\n-\n\n$80 幽靈戰場 : \n\n真實事件改編，故事敘述戰亂末期的一天內，四名年輕美軍士兵在山區面臨的嚴酷考驗。\n\
  \n-\n\n$80 復仇母親 : \n\n李英愛主演的韓國社會議題型懸疑片。\n\n-\n\n$90 他馬克老闆 : \n\n知名漫畫IP改編社畜喜劇，盧廣仲主演。\n\
  \n-\n\n$90 超慄方殺陣Cube : \n\n翻拍科幻虐殺經典異次元殺陣，菅田將暉.杏.齊藤工 主演。\n\n\n\n--"
