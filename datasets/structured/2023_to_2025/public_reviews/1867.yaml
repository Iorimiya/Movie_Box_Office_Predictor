url: https://www.ptt.cc/bbs/movie/M.1674654910.A.197.html
title: '[有雷] 山中森林'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



























  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  吐槽點很多的黑道電影，多到差點以為這是喜劇。再加上從中英文片名就開始流露出的文

  青感，《山中森林》是劇情主要發生地點中山區林森北的倒裝，Lost in Forest 大概是

  指迷失在水泥叢林裡，拿來形容黑道兄弟或許是別有意味的標題。只是搭配上一開始的獄

  中談話，阿生出獄後想做的是去故宮看汝窯，吉哥出獄後是要阿生帶他去林森北看乳搖，

  雖然阿生進一步可能只是想拿汝窯碗來當香腸攤的骰碗，只是這樣的想法差距莫名給我一

  種「所以你這派的黑道比較高尚囉？」的感覺。這個感覺一出現，後面看整部片的氣氛大

  概都歪掉了。


  有個讓我很出戲的點是整部片一直有意無意地強調他們到處亂丟菸蒂。彈菸丟菸蒂的動作

  在很多電影都出現過，都沒有甚麼問題，只是這部片中一直出現，搞得我都覺得是不是想

  表現「我們在台北街頭亂丟菸蒂喔，我們超壞的對吧！」此外再加上真的是貫串全片的香

  腸車，或許是想表達阿生對父親的思念寄託在香腸車上，又或者是懷念以前看著父親開香

  腸攤的日子，香腸攤在林森北開了幾十年，可見阿生從小就在林森北附近長大，或許也因

  為這樣才加入那邊的黑幫。只是阿生每次見到沙鷗都要提，還是不管場合的那種，雖然展

  現了阿生不會想太多的個性，只是次數多到讓人有點煩躁，再加上李康生的語氣，有時反

  而讓我笑出來。


  說到李康生的口條也是蠻微妙的，很多人都不喜歡他說話的聲調，再加上他實在是沒甚麼

  表情變化，我也是蠻好奇他為什麼有這麼多角色可以演。不過換個方向來看，或許他的存

  在也是讓觀眾有對角色刻板印象的挑戰，誰說黑道說話一定要殺氣十足或油裡油氣、船長

  講話就要很沉穩、同志說話一定要高亢或吱吱喳喳、道長說話一定要裝神弄鬼？要是今天

  一個黑道拿兩把貝瑞塔指著你，然後用李康生的音調說給我跪下，應該也很少有人真的會

  笑出來吧。只是平板聲調加上面無表情，他好像蠻適合演殺手的？不過他說閩南語時的表

  現就跟說中文差很多，這也是很奇妙的事情。


  整體電影的畫面表現得很不錯，很多光影的呈現或是角度的選取都很漂亮，只是我不是專

  業的，再多說只是自曝其短。不過我也蠻好奇電影中有很多意味不明的剪接畫面，像是菸

  蒂掉進水溝蓋（突然覺得我好在意菸蒂？）或是很快速的切換角色表情。也許是導演想要

  表達一些事情，但這些畫面可能不到一秒就切走，搞得我有點不知道留這些畫面是想要說

  甚麼？


  電影中有些差點讓我覺得是喜劇的片段，像是小靜去找阿生，結果阿生就把還睡在床上的

  淑貞抱到床旁邊地上，這幕我真的忍不住笑出聲音，你到底在幹嘛？我甚至原本以為他是

  想把淑貞塞進床底下。不過也展現出阿生單純的個性，以及他應該真的很在意小靜吧，如

  果只是普通玩完就算了的女人那何必在意她會發現床上有別人。還有一段是我自己腦海中

  腦補的，當愛麗絲在猶豫要不要把驗孕棒給成澔看時，我腦海中浮現的台詞反而是：「欸

  ，我兩條線，確診了，要居家隔離。你是同居人，也要隔離14天，所以不能出去喔。」當

  想到這段台詞我就知道我看整部片的角度已經整個歪掉了。


  另外沙鷗死後，阿生在樓頂連開五槍，給我一種是不是想致敬《少年吔，安啦！》中高捷

  在葬禮對天開槍那一幕的感覺。可是高捷即便帶著墨鏡你都能感受到他的悲憤，李康生演

  起來卻好像沒事開幾槍試試的樣子。還有船上的槍戰也很讓人出戲，你手上拿著槍，三打

  一想從背後偷偷制服一個持槍的敵人，結果你第一個動作居然是去勾他的脖子？任何人被

  這種方式襲擊都會嚇到開槍吧？你從背後襲擊的目的不就是不想讓外面的人發現嗎？既然

  都留給對方開槍示警的機會，你幹嘛不一開始直接朝頭開槍就好了。整段槍戰給我的心得

  就只有買槍記得加購滅音管。


  不過整部電影讓我最有感觸的應該是最後從成澔跟愛麗絲道別，到他跪在阿生面前求他讓

  他跟著去的這段。成澔真的欠阿生太多，整部片都看得出來成澔可以為阿生赴湯蹈火，所

  以當遇到這種狀況，絕對不要相信成澔說的「這次不會怎樣，做完這件事就收手」，因為

  欠這麼多，要做一件事就能還完債，那這件事一定超大條。而他跪在阿生面前說做完這件

  事他才能放下洗手，呈現了兄弟之間多重視道義情感，也呈現了成澔內心的糾葛，他當然

  想去找愛麗絲，可是不做這一次，要是出了甚麼事，他一輩子都走不出來的。這整段真的

  是用很文青的方式在表現江湖義氣這件事情，其實整部片都是這樣啦。


  至於如果說李康生的面無表情很讓人出戲，我覺得郭雪芙也不惶多讓，她真的是整部戲一

  號表情從頭臭臉到尾，看到她我好像懂了為什麼真紀真人氣會這麼高。


  從劇情結構的安排感覺得到導演編劇除了拍藝術片外，也有想把這部片做成商業片的意圖

  ，只是一些情節的處理方式或許還沒有這麼大眾化，不過整體看起來導演應該還蠻有潛力

  的，有點期待他之後的作品。


  --'
