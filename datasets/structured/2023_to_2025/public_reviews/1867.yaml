url: https://www.ptt.cc/bbs/movie/M.1667144034.A.03A.html
title: '[討論] 關於電影『山中森林』的二三事...(代轉發)'
content: '朋友怕死要我幫他轉發的...


  =======================================================================


  晚上去看高雄電影展閉幕片：山中森林

  隔壁隔壁一對情侶

  已經開演好久才進場

  不但整場戲都大聲聊天

  女的還整場都在擤鼻涕

  結果電影演完

  他們兩個好像早就知道之後的映後宣傳

  會叫劇組人員往前站

  早已經蓄勢待發

  等台上導演叫劇組人員往前

  站到前面去拍照時

  他們全衝到前面去不說

  還留下滿地...一大盤的水餃！



  因為現場確實有很多刺青的阿尼基來觀影(或讚聲)

  我很怕去問她

  她到底是得了流感

  還是武肺？

  還有地上那堆水餃

  為什麼可以丟得這麼自然？

  還是擤鼻涕擤整場

  從包包裡滿出來的？

  我很怕如果這樣問

  我會不會像電影裡面的兄弟那樣

  最後全部都...(不劇透)


  如果他們真的是劇組人員

  希望你們日後到別的城市去做宣傳時

  別把病毒跟水準

  留在人家電影院的地上好嗎

  電影院的工作人員

  也是人生父母養的

  病毒方殷

  可以放其他的城市一馬嗎


  你可以用這種「剛好不小心遺忘」的方式

  來瞧不起今年的高雄電影節

  但請也表現應有的水準

  好嗎


  過兩天

  我應該也會去做快篩

  有病我不會傳給別人

  這是高雄人的美德


  只希望支持山中森林

  但別把病回家才好啊



  --'
