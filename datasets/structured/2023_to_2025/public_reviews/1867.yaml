url: https://www.ptt.cc/bbs/movie/M.1673793027.A.77B.html
title: '[好微雷] 《山中森林》合格的黑幫賀歲片,歡笑也'
content: '《山中森林》以黑幫作為背景題材

  男主角阿生(李康生飾)為救好兄弟沙鷗(謝承均飾)，入獄12年

  假釋出獄的他只想遠離黑幫的是非，安穩生活

  但他的兄弟跟小弟都還在道上混，引發許多複雜的糾紛

  逼迫他在個人利益與兄弟義氣，兩者之間作出選擇



  以劇情內容來看應該是部喊打喊殺的沉重電影

  但敢在春節檔期上映

  懂的帶給觀眾歡樂，笑梗還真不少

  尤其是李康生飾演的生哥

  特殊的說話風格總是能切中觀眾笑點

  還有許多觀眾能輕易get到黑色幽默的台詞

  不想爆雷，分享一段給大家聞香一下就好

  版友自行評估是否合自己胃口


  防雷線



  防雷線



  防雷線



  防雷線



  出獄的生哥(應該是)從台中回到了台北

  以前小弟恰巧遇到他說要接他

  但說車上有東西(應該是指毒品)要送

  生哥馬上嗆：「來接我還帶東西，讓我台北一日遊喔！」


  連手遊置入也很絕，每次出現的時機都讓人想笑

  以賀歲片的角度來看，這部絕對合格



  看完這部，我覺得演員大部份都選的不錯

  單純心軟的阿尼基---阿生，李康生來演真的很適合

  有腦袋、城府深的現任阿尼基---沙鷗，由謝承均來飾演，光是外型就很有感了

  讓我想到這兩年戲劇非常流行雙男主劇

  明明不是BL劇，卻能讓女觀眾嗑生嗑死XD

  我覺得這部電影編劇是否也有這種意圖？

  李康生和謝承均兩人身高差，加上角色人設的個性差、智商差

  完全符合讓腐女嗑雙男主的條件



  深愛女友、卻更重情義---成澔，由王子邱勝翊飾演

  跟他以往給人的形象差很多，印象他戲劇or電影也沒演過這種角色

  說實在話一開始確實看不習慣他抽煙耍痞的模樣

  但過一陣子就習慣了，還算演的不錯



  專門來吸仇恨值的反派角色---猴子，黃遠演技很扛啊XD


  主要的女演員有三個：李千娜、郭雪芙、陳德容

  李千娜真的超級辣！尺度算大！愛情動作片的部份真的很讚



  郭雪芙是女神級，扛本片顏值，也有小露身材喔！

  陳德容必推，雖然要算是上一代女神了

  但她怎麼還是這麼美？到底怎麼保養的QQ


  如果你真的對黑幫沒興趣，對什麼恩愛情仇，浪子回頭沒興趣

  那至少推薦男的可以無腦看，光女演員就真的香~~~


  --'
