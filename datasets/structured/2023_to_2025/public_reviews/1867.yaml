url: https://www.ptt.cc/bbs/movie/M.1673682988.A.9B9.html
title: '[普好雷] 《山中森林》兄弟謝啦！'
content: '短評：外省北部黑道色彩最鮮明且真實的黑道電影。


  《山中森林》給我的感覺是田野調查詳實，甚至懷疑導演姜寧本人曾經涉入地下社會過。


  本片的開頭是阿生準備出獄，紅龍究竟是在裡面快樂還是在外面快樂？用魚缸作為監牢的

  表現手法是台灣早期藝術片的特色，讓人感覺到姜寧似乎想傳承些什麼。


  前半段的劇情老實說想交代的事情似乎太多了，所以比較片段，回想起來感覺自己好像看

  了很多畫面，卻又好像什麼都沒看到。


  我很喜歡裡面生哥剛出獄，在阿吉安排的車上點菸的樣子，李康生的若有所思，讓人沉浸

  其中，正式進入山中森林的世界。


  林森中山，山中森林。


  我會認為《山中森林》是一部沈浸式的電影，它夾在商業與藝術之間，讓人摸不著頭緒，

  卻也產生出新的樣貌。


  《山中森林》充滿隱喻、暗示，也充斥著比較陽春、無趣的因果關係，讓整部電影蒙上一

  層神秘色彩，好似每個段落都有它的用意，也就是說，這是一部需要看兩次以上才能通透

  的電影，換句話說，就是如果你第一次沒被吸引到，你就會錯過這部「好電影」。


  《山中森林》擁有的哲學對比這幾年的戀愛國片、角頭等類的黑道國片、豬哥亮的賀歲片

  ，彷彿承繼了蔡明亮的藝術性中，又隱含著觀眾喜歡的劇情，我個人會認為姜寧這個導演

  再繼續成長下去，將來可以開創新的國片形式。


  --'
