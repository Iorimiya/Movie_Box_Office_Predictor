url: https://www.ptt.cc/bbs/movie/M.1680042888.A.6B1.html
title: 'Re: [ 負雷] 所以山中森林是在演啥？'
content: '聽說這是在講台北外省黑幫的真實故事

  林森北路很多老外省掛黑道開的酒店

  山中森林倒過來念就是 林森北路中山區

  台北的歌舞伎町一番街特種八大風化性專區


  跟角頭系列的本省掛很明顯的不一樣

  拜託找個好導演來導才好看

  像角頭2就換了個姜導演來導才好看

  這片拍的差強人意，很像角頭1一樣

  很真實但很無聊，可以挖角姜導來導


  看王子還以為是真的林森北路的黑道

  沒想到是棒棒堂的偶像團體成員

  對棒棒堂很不熟，還跟郭雪芙演床戲

  他一整個就像騙無知少女入火坑的黑道一樣

  沒想到裡面的大部分都是專業演員跟藝人



  可能真正的大哥會更遲緩，甚至沈默寡言

  搞不好講話還牙齒漏風口齒不清也有可能


  當然是愛李康生，他可是金馬影帝

  還有歐洲市場，跟他演戲能紅到歐洲去

  連尹馨、波多野結衣、江宜蓉都跟他演過床戲

  歐洲咖的氣場就是不一樣，豔福不淺

  之前李千娜演顏正國的少年吔就說不想演酒家女

  結果這部為了想跟李康生一起紅到歐洲去

  就什麼都敢演了，看尹馨現在也是影壇大姐


  在片中不愛李康生就沒法還清債務

  有個黑道老大照顧可以少走一點冤枉路

  果然替她拿回本票贖身，才能回歸正軌


  碰到李康生以為他淪落到賣香腸就去寒暄兩句

  一聽到在搞建築就覺得值得依靠才一起去夜市玩

  追李千娜的方式跟在幫幫我愛神追尹馨的方式一模一樣

  傻人有傻福，看他在金馬獎把台下張艾嘉逗得那麼開心

  就知道這個在電玩店被蔡導發掘的8+9不是等閒之輩



  王子的粉絲，還有他片中的兄弟跟郭雪芙


  就他之前開槍幹掉的賭場三板橋的小弟來尋仇

  合情合理，結局就是告訴大家黑道下場就這樣

  全部撲街死光光才能徹底脫離黑幫徹底解脫


  角頭1跟這部有得比

  越真實越難看票房越差

  我一直很想看外省幫派的黑幫片

  但拍的真的很難看，還是要找對導演才行

  希望能看到拍竹聯幫、四海幫裡面的故事

  或是拍江南案受政府所託去美國暗殺的故事

  竹聯幫四海幫怎麼成立的等等等這種傳記片


  角頭的反派是毒販屁孩

  這片的反派是軍火屁孩

  各個擁槍自重，倒是這片沒有毒品

  看來這部戲的外省幫不碰都毒品

  只碰土地開發案，幫建商搶地皮

  被建商養的黑幫，開酒店來洗錢


  -----

  Sent from JPTT on my iPad


  --'
