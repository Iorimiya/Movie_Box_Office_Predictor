url: https://www.ptt.cc/bbs/movie/M.1667249314.A.F1D.html
title: 'Re: [討論]關於電影『山中森林』的兩三事...(代轉發)'
content: '代回。


  不好意思哦，這不是劇組的人哦。


  我是演員的經紀人，當天只有導演及演員跟經紀人下來總共十人。


  全程都有雄影主辦單位陪同，且宣傳事宜皆由高雄市立電影館負責，山中森林明年才會上

  映。


  目前不會有任何宣傳人員與所謂劇組人員。電影拍攝結束後，所謂劇組人員就會到下一個

  劇組工作。


  建議不妨把拍到的照片公布，因為既然有拍攝到亂丟紙屑甚至是傳染物品的人是可以直接

  檢舉的，可以把照片提供給衛生局或是館方查明。


  切勿自己任意猜測，疑似栽贓摸黑。


  場次是有開放售票的，民眾的行為工作人員難以預料，還望下次有類似情形發生時可以立

  即反應。


  電影演員及導演風塵僕僕從台北千里受邀來高雄作客。還望同理此心，


  最好的解決辦法是去檢舉當事人，把影像公布。而不是妄自下論，慎介。


  更何況文內說兩人是情侶說說笑笑演一半才進場。


  明顯就是觀眾。


  所有演員跟導演都是館方親自去高鐵站接送。而且都是從後台進出。怎麼會有工作人員是

  自己買票當觀眾進來？這很明顯就是觀眾。


  --'
