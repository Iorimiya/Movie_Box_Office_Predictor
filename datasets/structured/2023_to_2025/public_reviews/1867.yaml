url: https://www.ptt.cc/bbs/movie/M.1674720849.A.41A.html
title: '[好雷] 山中森林 耐人尋味'
content: '點著菸把影評寫完了。


  說是獨排眾議似乎太自命清高，我喜歡山中森林這部電影，但我並沒有喜歡裡頭的演員。


  從劇本到配樂到運鏡到表現手法，山中森林無疑是一部上乘之作，但裡頭的選角大部分都

  太讓人失望了。


  我猜裡頭花費最高的演員就屬李康生，而這筆花費就算要用掉電影大部分的預算我覺得都

  很值得。


  生哥這個角色只能由李康生來演。


  大多數人都批評李康生的口白、表情生澀僵硬，但回過頭來思考，這部電影真的是圍繞李

  康生在「演」嗎？李康生飾演的是一個出獄的黑道大哥，他和社會脫軌了十二年，你說口

  白出戲？一個被監獄關一年的人都會笨了，十多年不笨嗎？


  笨，才造就了生哥的故事。


  傻到兩把貝瑞塔替兄弟擋子彈。


  傻到對一個騙人的雞銷欠款。


  傻到自己的女人差點被兄弟睡走。


  傻到一個大哥的氣魄只能靠口耳相傳。


  傻到出獄了先想著賣香腸金盆洗手。


  真傻，到底哪個人可以脫身江湖而沒有一身腥臭？


  來談談其他角色吧。


  李千娜飾演的小靜，可圈可點，作為生哥出獄的第一發，婀娜多姿、韻味十足，不是那種

  大奶濃妝，而是任誰都暈眩的魅惑和不諳世事的假掰。


  帶感。


  裡頭最糟的是郭雪芙。


  郭雪芙整部劇一點靈魂都沒有，實在不配作為一個電影角色，在文青咖啡店裡一點都不像

  老闆娘，作為黑道的女人一點都不成熟，除了吵鬧不給面子啥都不會。最可笑的是，放閃

  也放的一點愛意都沒有。要耍狠也不夠狠，超級尷尬的存在。


  王子也是讓人鼻酸，整部片裡面的小弟一點兄弟人的感覺也沒有。完全不誇張，王子真的

  就是王子，一點狠勁都沒有，整齣劇圍繞著他的感激，但實在看不出哪裡感激，完全沒看

  到他對生哥的尊敬，這角色讓我真的太出戲了，偶像還是乖乖當偶像吧，不該找沒有兄弟

  氣的來演男二。


  黃遠飾演的猴子也是，不知道為什麼台北黑道被演成墨西哥毒梟，整齣劇主角光環超大，

  明明超爛隨便死的咖小，搞到跟最後大魔王一樣一直仰臥起坐，真他媽有夠命大，演技也

  是不如回去演酸甜之味，還比較好。


  這部電影感覺就是錢不夠，請完李康生之後就沒錢了，請了一堆不太會演戲的不知道在幹

  嘛。


  還沒進戲院的真的建議進去看一下，看完之後開始期待導演拿到錢之後能不能拍下一部作

  品的那種。


  浪費了很多美好的表現手法。


  --'
