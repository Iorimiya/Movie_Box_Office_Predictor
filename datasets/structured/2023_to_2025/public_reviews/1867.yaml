url: https://www.ptt.cc/bbs/movie/M.1675330815.A.0A7.html
title: '[新聞] 沒看就批《山中森林》爛片！'
content: '新聞網址：





  記者張筱涵／綜合報導


  今年賀歲片類型眾多，有歡樂搞笑、刺激動作、懸疑恐怖等類型的9部電影，其中《山中森林》票房突破千萬，導演姜寧卻無奈發現有許多惡意和中傷評論，宣布提告後那些一星評論都瞬間消失，他強調現在刪除也沒用：「咱們法院見哦。」



  姜寧日前宣布要對在《山中森林》版面惡意批評和中傷造謠的網友提告，沒想到一說完，有許多一顆星評論都瞬間消失：「應該是彼此互相認識，要不就一個人分飾多角。要不就是水軍頭收到到案通知了。走進山中森林本來就不怕蚊蟲咬，但蒼蠅拍，捕蚊燈，驅蟲劑還是不能少。」


  對他來說，善意批評和指教都是可以接受，也很願意接受的，但姜寧卻發現有很多人看都沒看就說是「爛片」，他也希望藉由這次提告基會，看看那些酸民的嘴臉：「現在刪也來不及了，在網路警察都很專業哦。一個都跑不掉。反正我三月開始很閒，要亂罵人就不要躲在鍵盤後面，跟我來個直球對決才是英雄好漢阿，咱們法院見哦。


  -------


  原標題太多字，故刪減標題


  現在雲也會被告了@@





  -----

  Sent from JPTT on my Xiaomi 21091116UG.


  --'
