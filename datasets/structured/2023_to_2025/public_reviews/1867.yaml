title: '[負雷] 山中森林'
content: '之前就聽說此片的風評奇差


  正好最近跟朋友租Netflix就來看一下


  開始不到十分鐘就來個「汝窯(乳搖)」的國小生等級笑話


  角色之間的對話要馬超級沒意義


  要馬被男主的棒讀搞得很尷尬


  整部片就看著這些撐不起江湖氣息的人


  只能用著幹片等級的台詞強調自己在林森北多威風


  然後大場面也蠻少的，最終決戰耗時很短，一點也不讓人血脈噴張


  這點也跟不能真的動武的中國幹片很像


  講來講去，越來越覺得這是幹片成癮者所拍出來


  自己覺得超帥的高級幹片


  --

  這應該是我看過最低分的台灣幫派片

  我對她的外貌沒啥興趣欸= ='
