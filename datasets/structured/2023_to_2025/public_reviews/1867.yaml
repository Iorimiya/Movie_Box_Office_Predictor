url: https://www.ptt.cc/bbs/movie/M.1674923619.A.EAA.html
title: '[新聞] 揭《山中森林》真相 大佬:這部屁孩看不懂'
content: '新聞網址：


  原標題:


  記者許逸群／台北報導



  擔任電影《山中森林》聯合製片人的王雍文說道，劇中有許多橋段就是他小時在林森北路

  的真實生活，




  ▲江湖大佬國華哥（左二）包場力挺。（圖／禾力文創提供）



  王雍文分享，《山中森林》講述的是台灣幫派外省掛的故事，因此大部分就是國語發音。

  他自己曾經支援過電影《角頭》的拍攝，他認為這是兩個截然不同的幫派電影，



  ▲製片人王雍文曾帶謝承均親自拜訪江湖大哥。（圖／禾力文創提供）



  導演姜寧說，劇中主要講述他20多歲時所見的林森北，他只是想將自己親身的生活經歷用

  大眾藝術氛圍呈現，沒有想要美化黑道，但有人的地方就有是非、有是非的地方就有江湖

  ，電影在最後結局留下許多選擇讓觀眾自己決定誰的對錯與去留。



  姜寧表示電影當中所有人事物都是有所本的，自己用20多年的台北夜生活經驗做田野調查

  ，應該是非常地道跟精準的，希望透過電影能夠讓大家寫實地參與沉浸其中。




  --'
