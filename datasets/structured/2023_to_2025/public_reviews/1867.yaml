title: '[負雷] 把看山中森林的錢省下來去看灌籃高手 '
content: '雷文防雷資訊頁:


  這部片適合昨天都沒睡覺，想趁機透過看電影時間補個眠的人。


  我後悔看這部電影前不該睡太飽，劇情老套到睡著的夢還比較有趣


  推薦大家如果因為工作不得不看，或另一半要求你不陪看這片就分手，


  那你至少要買個大包繼光香香雞進去，這樣太無聊的時候至少有點事做，


  吃飽後剛好睡一下，你醒來的時候電影剛好就演完了，恭喜你渡過去。



  ---------以下有雷-----------


  黑道老大李康生因為持槍殺人在獄中蹲了十二年，同房獄友小胖子因為一些


  我們觀眾無法得知的理由而非常尊敬李康生。



  出獄前李康生的老爸給兒子寫了一封信，很懷念跟兒子一起去故宮看汝窯，小胖子


  誤把汝窯當乳搖、「宋朝?送我都不要」刻意表現幽默的對話，會讓你以為在看豬哥亮


  賀歲片。



  李康生孑然一身但穿著超合身黑色時尚西裝突兀的出獄，跟外面好幾輛接風賓士車小弟


  擋菸，才知道口條好到像舞台劇演員的小胖子居然是台中黑道老大，你說這是看不起台中


  還是看不起黑道我已經不明白了，但總之因為一些不為人知的原因而很尊敬李康生的小


  胖子很耐斯的載李康生回台北。沿路都在拍李康生抽菸憂愁看窗外的鏡頭，從這裡你就要


  開始有心理準備了，整部戲最多的畫面就是李康生抽菸、李康生亂丟菸蒂，偶爾加上李康


  生打炮。




  李康生回台北後被模范棒棒堂的王子跟其他帥到讓觀眾不明白他們為什麼不去當藝人或直


  播主網紅的8+9們盛情迎接，跑去王子的女友郭雪芙當店長的網美咖啡店門口舉辦出獄過


  火儀式讓郭雪芙很生氣，8+9們再跟王子抱怨他馬子很機歪。先不論現在這個時代還有沒


  有人在講馬子這個媲美「壓馬路」、「酷妹」、「LKK」的老人用語，你只要知道郭雪芙


  很正就好了。不要思考為什麼郭雪芙身為店長卻穿全白禮服在文青咖啡廳工作、8+9聚


  會為什麼不會嚇走東區網美客人們?為什麼要在東區咖啡廳辦過火儀式?辦在環河南路三


  清宮門口不好嗎?總之這些細節計較就輸了，我們現在還醒著就是為了忍一下看郭雪芙的


  床戲。



  過火完的李康生跟小弟四處亂晃找爸爸的香腸車，王子很尊敬李康生是因為12年前李康生


  曾經幫王子擋了一刀，其他小弟則是因為李康生對他們的老大沙鷗有恩所以尊敬他，但12


  年黑道居然沒什麼變化，可以讓李康生出獄後無縫接軌，說明了台北市的治安相當穩定。



  8+9們為了慶賀李康生出獄，替李康生叫小姐清理12年的存貨。這時候李千娜就出場了，


  我們觀眾都應該替李千娜慶賀她的職業是歌手而不是真的從事性工作者的小姐，


  不然從她在罵客人在房間抽菸等行為看來，我們可能看不到她活著替這部片唱配樂。


  「爸爸生病所以需要賣身替爸爸治病」的從業理由爛到我以為是開玩笑的，但沒關係不


  要生氣，我們在這裡欣賞千娜的性感內衣與傳教式還有李康生假到不行的刺青就好了。




  李康生的換帖兄弟沙鷗跟華哥是仇家。某次夜店衝突中，正當我們以為makiyo要打計程車


  時，黃仲崑的兒子黃遠aka華哥的打手猴子，失手打死了沙鷗金主蕭董的兒子，


  蕭董要求沙鷗幹掉猴子，砸場失敗的沙鷗派讓猴子又回來幹掉沙鷗，李康生要殺掉猴子


  替沙鷗復仇，如此這般打來打去的復仇故事構成劇情主線，然後再穿插李康生抽菸與


  亂丟菸蒂，構成這部片。



  劇情完全沒有讓你意外的地方，當你覺得這個角色要領便當了，就會真的領便當。


  等一下有人要打電話來打斷郭雪芙的床戲了，就真的會有人打來。當你看到李康生


  登上裝有煙火的船時，你就該知道等一下船上會有槍戰引爆的煙火秀。至於台中黑道


  老大獄中同房小胖子為什麼要親自來開船，不交給手下辦事就好了?可能是因為買煙火


  預算很緊了，多請演員會讓導演賣房子來拍電影的錢不夠用，所以不要再挑剔了。



  結尾是原本以為海上槍戰領便當的猴子居然沒死，回來王子與雪芙的婚禮復仇，開槍殺


  王子時，雪芙捨身替王子擋槍。而李康生也沒有好下場，被自稱三板橋的楊銘威在夜市開


  槍殺掉，(他出場時我內心只想著不是啊你不是在來吧營業中跟鬼鬼一起開店嗎)李康生睜


  眼死在撈金魚池裡面，感覺李康生演這段眼睛應該滿痛的。



  結尾有補上李康生12年前替沙鷗開槍殺三板橋前夕的故事。但可能是因為選角的關係，


  只要有沙鷗的鏡頭，就像在看意難忘、世間情、家和萬事興。




  整部片還是有意外的地方。我在看的時候就覺得這編劇也太俗套了吧、該用畫面表現的


  人物個性刻劃都是用台詞唸出來、台詞有一堆名字和稱謂(和嫂子對話的王子幾乎每句都


  要再重叫陳德容一次嫂子，到底)，但這居然是得獎的編劇。果然世界上令人不懂的


  事情還很多，就像為什麼電影圈都很愛用李康生來演戲一樣。



  總之，如果有人說這部片很好看，那他應該就是朋友或喜歡的名人有演這部戲的親友團


  以後他推薦什麼，你就不要買什麼就對了。


  --'
