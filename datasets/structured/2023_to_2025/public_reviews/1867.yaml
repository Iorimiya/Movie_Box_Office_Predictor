title: '[討論] 《山中森林》電影中菸的意象分享'
content: '菸，臭？壞？黑道？讓人反感？


  電影中的菸總代表不同的「意象」，有的以火光代表希望《愛你讓我自由》，有的以氣味

  代表愛情《世界上最爛的人》，也有的以菸的綿延和型態來做分鏡，也有的以菸代表禁忌

  。


  電影中，以菸代意的時刻多不勝數，在不少影評中，都提出《山中森林》這部電影的李康

  生為何「每一幕都在抽菸」？甚至有人譏笑，李康生為了演這部電影抽到都快肺癌了，所

  以我想來聊聊《山中森林》這部電影中，菸所代表的意象。


  一、回歸（點菸）


  生哥剛出獄的時候，在監獄外草爺所飾演的小弟看不起他，也沒打算幫他點菸，到後來阿

  吉出來說話才勉勉強強地當生哥是個「哥」，但到後來十三等人，只要有出現在鏡頭前，

  都會主動幫生哥點菸，很顯然，剛出獄的時候生哥還沒辦法跟這個世界接軌，真正把他的

  「大哥」位凸顯出來的是回歸「所屬」的時候。也利用「點菸」這件事情來印證了生哥這

  位老大哥的正式回歸。


  二、無奈、煩惱


  生哥幾乎每個畫面都點菸，讓菸緩緩地飄，剛出獄的他在每一件事都使不上力，跟外界隔

  離太久的生哥，大多表現出來的都是無奈，只能任由沙鷗的安排。


  每一幕生哥都會點起菸，結束的時候生哥都會拋掉菸，象徵著把煩惱拋去，把無奈拋掉，

  推進到下一個環節。


  三、森林的煙霧繚繞意象


  我覺得這是《山中森林》最有趣的意象展現，每個人有不同的菸，每個人的菸也各自代表

  不同的意思，但總結起來，都是「森林」中，繚繞、瀰漫、霧氣四溢的表現。


  山中森林是林森中山倒過來的取名方式，但也間接傳達出社會事就如同山中的森林一樣，

  煙霧繚繞，難以見及真貌，沒有任何一個人是安全的，也沒有人是絕對的老大，森林中的

  詭譎、多變，也體現在電影的情節中。


  總結來說，在看這部電影的過程中最痛苦的應該是看到劇中的角色瘋狂哈菸，哈到自己都

  快受不了，結果還沒辦法走出影院趕緊哈兩口的時候吧。


  看了一些影評，覺得大家都對菸的意象不是很明白，所以想上來分享一下我個人在山中森

  林看到的「菸」。


  --'
