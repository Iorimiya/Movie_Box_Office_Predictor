url: https://www.ptt.cc/bbs/movie/M.1664203239.A.62D.html
title: '[新聞] 觀眾搶票！「山中森林」雄影場首日已賣出9成'
content: "觀眾搶票！「山中森林」雄影場首日已賣出9成\n\n2022-09-26 19:09\n\n聯合報 記者蘇詠智／即時報導\n\n\n謝承均是「山中森林」的要角之一。圖／禾力文創提供\n\
  \n由新銳導演姜寧執導、金馬影帝李康生監製與主演，並有李千娜、邱勝翊（王子）、郭雪\n芙、謝承均等堅強卡司陣容的新片「山中森林」，獲選為今年高雄電影節的閉幕片，早鳥\n\
  票本月25日第1天開賣，即獲影迷熱情捧場，除影廳內角落位外，已售出近9成，成績相當\n亮眼。\n\n片中又監製又演出的李康生，和謝承均、王子各自透過臉書及IG發佈限時動態，替片子催\n\
  票，果然收到成效，他更有信心的表示，距離10月30日的雄影閉幕放映還有1個多月的時\n間，尚未售出的位子應該會在這2、3天內完售達標。\n\n一向是偶像劇中貴氣男主角的王子，在片中搖身一變為帥氣黑幫分子，不僅所有打戲、動\n\
  作戲都親自上陣，完全沒有用替身，跟郭雪芙搭檔演出情侶也火花十足，亦是緋聞焦點，\n堪稱全片最吸睛的配對。\n\n號稱「兄弟版『華燈初上』」的「山中森林」預計明年上映，高雄電影節閉幕場不僅是世\n\
  界首映，也是2022年唯一能先睹為快的場次，因而吸引不少高雄影迷的注意，更由於題材\n圍繞著黑幫故事，除了眾家主角們的粉絲在開賣第一天搶票外，還有不少真正的「兄弟」\n\
  搶先劃了戲院裡視野最好的位子，屆時片子放映，現場必然更增寫實氣氛。\n\n\n李康生（中）主演「山中森林」又兼監製，在社群網站上催票。圖／禾力文創提供\n\n\n\
  王子（中）在「山中森林」角色大突破。圖／禾力文創提供\n\n--\n佛教經典的\n是 是菩薩成佛之道\n        是 佛經\n  是 佛      是 菩薩\n\
  \n和破十方諸佛\n\n--"
