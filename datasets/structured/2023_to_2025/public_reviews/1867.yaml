url: https://www.ptt.cc/bbs/movie/M.1673682078.A.DDC.html
title: '[好雷] 山中森林 一部可惜的作品'
content: '「兄弟謝啦！」


  這是山中森林最讓我印象深刻的台詞。


  山中森林如果要做個短評的話，我會說：「可惜。」


  如果其他電影大的滿分是5分，山中森林的極限是4.9分。


  全劇可以看出導演姜寧的用心，但電影不是用心就行的，而是「別有用心」才能創造出更

  好的電影。


  山中森林中規中矩，平順平淡沒有太多的躁進，不好也不壞，但足以讓人回味。


  劇情的鋪排零碎且片段，導演親自操刀了很多部分，想傳達的意象太多，導致劇情有點分

  裂且兩小時的片長交代不完全，所以讓人覺得可惜。


  包含影片開頭的紅龍、父親的香腸車、阿生的心理變化、謝承均的角色塑造、王子和郭雪

  芙的愛情段落、李千娜的角色塑造、反派的「厭惡感」全部都差「臨門一腳」。


  阿生是典型的黑道角色，卻沒有gangster電影應有的魅力，李康生飾演的阿生樸實但奢華

  。


  樸實感讓人覺得貼近，或許是李康生的演技使然，這是以往黑道電影沒有的。


  奢華在哪裡？


  阿生好像愛著前妻，卻又好像愛著李千娜，阿生照顧小弟，卻又不顧小弟安全；阿生對郭

  雪芙的蠻橫不發一語，看來並不是大哥的虧欠和寬容，更像是軟弱。阿生並沒有表現出一

  個「為了朋友開槍入獄的大哥」應有的樣子。


  整體來說，在不爆雷的狀況下這部片的影評是相對難寫的。


  對我來說，山中森林太可惜了，但值得慶幸的是這是導演姜寧的處女作，只是處女作就有

  國片及格以上的水準，讓人不禁期待往後的作品。


  山中森林值得進戲院一看的原因在杜篤之的配音增添了不少震撼感，劇情的轉折到後半會

  讓人著迷，如果能耐過前半段的乾澀，迎來的甘泉是值回票價的。


  --'
