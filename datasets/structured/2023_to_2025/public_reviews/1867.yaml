title: '[負雷] 千萬不要看 山中森林'
content: '打給厚


  小弟我一直都還蠻算喜歡台灣本土的兄弟片


  雖然無法取得什麼共鳴但娛樂成分頗高


  對這類型的片標準也不高，直到看了這一檔的山中森林


  預告讓人認為是藉由兄弟情在講台北林森北路那段聲色場所崛起帶來的紛爭


  但其實大多只聚焦在李康生、邱勝翊兩人可有可無的羈絆


  一直很好奇為什麼李康生一直有片能接

  劇情從他一開口講話我就已經出戲了


  毫無情緒起伏的語調、到頭到尾都那張死人臉


  十二年前為了幫兄弟謝承均出頭開槍而服刑

  服刑期間雙親都已過世


  出獄後馬上暈船暈給用什麼父親住院急需用錢這種爛大街理由的傳播妹李千娜


  號稱什麼最大尺度演出

  結果畫面只有簡短帶一下美背跟內衣

  剩下時間都在看李康生的屁股 靠北

  李千娜是有沒有那麼缺錢


  與兄弟謝承均會合後 只提到要找他爸的香腸車


  謝承均在大哥服刑期間事業做起來

  順便也暈船暈到李康生的前妻那邊去


  另一邊邱勝翊飾演李康生的小弟

  整天待在女友郭雪芙開的文青咖啡廳裡


  這種網美店 整天都有一隻89猴子守在那

  時不時還會帶整團猴子來

  有誰敢去啊？


  期間 李康生的兄弟 謝承均 他勢力範圍的酒店跟一幫叫做蕭董的勢力底下的89「猴子」

  起了衝突 鬧出人命

  （你沒看錯 就真的叫做猴子）


  然後李康生還沒找到他爸的香腸車


  中間帶一下李康生跟謝承均的兄弟情

  如何共患難 順便叫謝承均能不能幫忙把李千娜的欠債清掉

  一個黑道大哥被這種理由呼嚨真的很好笑


  後來在一場猴子策劃的襲擊事件

  邱勝翊的手臂中了一刀

  郭雪芙因此怪罪於李康生 並且說她已經懷孕

  希望李康生讓邱勝翊不要再當89了


  結果李康生說

  沒辦法 要不要混兄弟是他自己決定的


  靠北 沒看過這麼爛的大哥

  離開前還偷摸郭雪芙的手 超噁心


  這期間 李康生還沒找到他爸的香腸車


  李康生跟前妻(大嫂)敘舊完後一起回飯店

  但沒有辦事 只任由前妻睡在床上

  突然謝承均喝醉來訪

  李康生不知道在緊張什麼 直接把熟睡的前妻用棉被裹起來丟在床下

  我看到這段還以為這邊開始要變搞笑片了


  酒醉的謝承均 跟李康生吐露了很多真心話

  並說自己因為猴子那邊的事鬧出人命 準備要跑路避風頭了 打算把事業都交給李康生


  這種看似幕後黑手其實是真兄弟的反轉還不錯


  後來李千娜拿到欠債的本票後

  交給邱勝翊旁邊戲份不少的長髮小弟

  兩人的關係好像匪淺

  說什麼 不要再賭了 整段沒頭沒尾的

  李千娜的支線到這邊莫名其妙的結束了


  一大早李康生接到小弟電話要他快開電視

  原來是謝承均已經被猴子的人馬暗算身亡


  李康生的表情到這邊終於有了變化

  就是瞳孔稍微放大了一點這樣


  氣到腦袋一片空白的他跑到酒店頂樓對著空氣連開好幾槍（為什麼？）


  李康生把全部小弟召集到謝承均遇害的停車場


  這時候 突然 突然


  他爸的香腸車出現了==


  啊之前怎麼都找不到

  算了


  李康生點了一根煙插在車上說：

  兄弟！一路好走！


  不是誒 那是你爸的香腸車

  跟謝承均有什麼關係==

  算了


  一幫89闖入幕後黑手的基地

  李康生這時候開始耍狠了哦

  說把兇手猴子交出來


  幕後黑手聯絡兇手猴子 結果猴子也是瘋狗

  電話講一講生氣

  猴子就對著空氣連開好幾槍（為什麼？）


  李康生請來他服刑時的獄友偷渡犯阿吉

  （人設上也是台中大哥級的人物）

  來安排猴子等人要跑路用的漁船


  這時邱勝翊在家休養

  看氣氛是準備跟女友郭雪芙來一發的節奏


  同時接到長髮小弟的電話


  結果他就 呃

  他就出門了


  跟郭雪芙來一發 & 出門看李康生的死人臉

  應該是沒有這麼難選吧


  總之 為了阻止邱勝翊做傻事

  郭雪芙猶豫要不要拿驗孕棒給邱勝翊看

  最後還是放棄了 拿行動電源給他

  好喔==


  不是 五新這麼重要的事 你都跟李康生講了

  結果到現在還沒跟事主邱勝翊講

  這個人腦子是有沒有問題==

  算了


  邱勝翊到現場後 李康生斥責長髮小弟 說

  啊我不是叫你不要跟他講嗎

  長髮小弟回答

  是他自己要來的


  ……..


  同學，你大概十分鐘前才跟他講電話記得嗎？

  算了


  李康生希望邱勝翊回去 但邱堅決不回

  直到李康生向邱勝翊說郭雪芙懷孕的事


  由自己大哥來告知自己的女友懷孕 真的是再正常不過的管道了


  邱勝翊聽完後默默回頭 又突然轉頭跪下反而更堅持他要去的決心

  真的已經不知道怎麼吐槽這群人了


  總之三人上船埋伏

  由阿吉哥帶猴子等人上船

  猴子們也是疑心病很重 船上搜的徹徹底底


  上船之後 三人組悄悄的從地板摸出來

  居然是不是找猴子 而是三對一先處理小弟

  而且還反被制服 搞到整船人都知道

  阿吉哥中槍 猴子小弟中槍

  邱勝翊把長髮小弟推開 自己龍骨中了兩槍

  終於知道為何長髮小弟怎樣都要叫他來了


  邱勝翊中槍後話也說不清臉色嘴唇都發白看來應該是沒了 行動電源都還沒用到


  李康生很生氣對著猴子小弟屍體連開好幾槍

  接下來跟猴子對槍全都泡掉


  一發打到船上載的煙火

  槍戰就在漫天煙火中結束了


  畫面突然轉到郭雪芙跟邱勝翊的婚禮

  旁邊還有拄著拐杖的長髮小弟


  我看到這我以為是郭雪芙的夢之類的

  結果真的是邱勝翊吐便當回來娶某

  我的天

  好算了


  從他跟長髮小弟的對話

  得知猴子本人似乎已經屍沉大海


  李康生則洗手回到條通賣香腸 跟老爸當年一樣

  途中遇到已經從良的李千娜

  兩人便一起去逛夜市


  婚禮這邊

  猴子穢土轉生 帶著槍到婚禮現場

  看剪接手法應該是邱郭兩人雙雙遇害


  真的很靠北

  上一秒說屍沉大海

  下一秒直接帶傢伙送你全家去探親

  真的沒看過這麼爛的

  敵人在明 你們在暗 優勢打沒了也就算了

  目標也處理不掉還給機會回來尋仇賠掉郭雪芙

  真他媽虧爛

  真的不知道這幫人在忙什麼==


  李康生則是跟李千娜在撈金魚的時候

  被十二年自己曾經襲擊過的仇家尋仇

  連開好幾槍後倒臥在金魚池中

  感覺是很淒涼的一幕但看起來莫名好笑


  我明白電影本身想強調歹路不通行的道理

  但這種詮釋手法已經背離電影本身的主題了

  到底是要講歹路不通行

  還是要講林森北酒店崛起的腥風血雨

  還是要講李跟謝的兄弟情

  一次全塞在一起講 還找一票念稿仔來演

  真的是看沒有

  我寧願看郭雪芙穿婚紗跑步兩個小時==


  媽的爛片



  最後再次恭喜本片最大贏家


  猴子









  -----

  Sent from JPTT on my iPhone


  --

  可能的 可以的 真的可惜了




  幸福好不容易怎麼你卻不敢了呢?



  --

  我是因為工作關係必須要看 哈哈

  呃...有什麼問題嗎 我標題有寫吧'
