title: '[ 普雷]  尷尬的山中森林'
content: '山中森林太普了



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  進電影前 我本來是要看王子的笑話的 直覺他演技應該很差 郭雪芙也是花瓶一個


  看完整場電影 我錯了 王子跟郭雪芙是少數亮點



  主角李康生 演技很差 別跟我嘴得過什麼獎 拍過什麼電影 給觀眾的感覺就是一直出戲

  很差



  大反派刺青男  刺成這樣不但沒有很狠  反而很像吸毒吸到傻掉的那樣8+9

  台詞尷尬 演技也尷尬 後期跑路的時候 在排滿蠟燭的陽台 讓我尷尬到去上廁所


  最大遺憾-謝承均

  演過鬥魚 加上多年8點檔老班底

  給他當大反派有機會扭轉本片的低評價


  最大亮點 王子

  原本以為會是尷尬的笑話 但意外演的還可以



  --'
