url: https://www.ptt.cc/bbs/movie/M.1672827247.A.0FC.html
title: '[討論] 《山中森林》音效大師杜篤之專訪'
content: '這次有幸見到台灣得過最多金馬獎的音效大師杜篤之本人。


  起因是臨時在上週被找去看一下記者和杜老師的專訪，在後來的零碎時間裡姜寧導演和記

  者先出去談話，我也獻上了姜寧說的「束脩」，我自己公司釀造的蜂蜜氣泡酒孝敬杜老師

  。


  因為很多問題記者都問過了，可以去新聞稿上看到，所以我這次就問了一些比較「自己」

  的問題，就是比較粉絲向一點，也是可能大家會好奇，但平常沒機會「聊」的。


  跟杜老師聊天的過程很短，幾乎不像是專訪更像是閒聊，很感謝杜老師對我的態度如此友

  善，一個大前輩如此謙虛，真的讓人很喜歡。


  所以特別來電影版分享一下我的閒聊內容：


  我：


  其實先前已經把杜老師的訪談都看完了，就像是您喜歡「奶油味」的酒香，雪莉桶的味道

  ，所以才會拿我公司的酒孝敬您。


  杜老師：


  （笑）


  我：


  我曾在您的訪談中看的您說：「看電影的觀眾會想了解導演想傳遞的訊息。」那我很好奇

  想知道像姜導這麼奇怪的人，您在《山中森林》中究竟接收到了什麼？甚至站在一個前輩

  的立場，您接收到了什麼特別的資訊可以跟我們分享？


  杜老師：


  有的，其實他第一次給我看的版本音樂鋪得很滿，如果沒弄好甚至會變成一部音樂片。但

  是你梳理他會有一個脈絡，只是他不知道要怎麼呈現，但他其實是有給出一個他想要的樣

  子。我就把他整理好，你要知道每個鏡頭、段落他想要幹嘛。


  我：


  其實姜導在鏡頭裡面埋了很多他覺得想傳達的，但要看好幾次才知道。但我們很少會重複

  看好幾次。


  杜老師：


  沒錯沒錯。我就想要把這些呈現出來，然後在最短時間表達給觀眾知道。


  我：


  那老師的身分就像是一個整理師？


  杜老師：


  那當然，這就是我的「基本功」。


  我：


  （笑）老師真的非常謙虛。


  杜老師：


  在這個過程中要用到很多手法、手段，前面有些很厲害的音樂，你可能要把他降低去製造

  波浪。波浪的形成、條件，我要把他組織起來。


  我：


  老師講話很多名言佳句。老師曾經在訪談中提到自己「浸淫在製作電影的過程中」，那我

  想請問老師，在《山中森林》中，您最沈浸的部分是什麼？


  杜老師：


  我其實是這樣，我自己給自己最舒服的時候，就是在做電影的時候，因為你把其他煩惱都

  丟掉了，你可以在這個故事裡，隨著情節、表演、對白起伏，這個是做這個工作最舒服的

  時候。在一個黑色的盒子裡，你什麼都看不到聽不到，你所有的聽覺視覺都是這個電影。

  你在這麼好的條件底下享受一部電影，而且你是一個可以改變這部電影的人。你可以尋找

  還有什麼機會、空間去讓這部電影變得更好。


  我：


  尋找的部分是您最沈浸的？


  杜老師：


  對，每部電影你可能看，做完了你可能可以再找到那個縫隙，你看了每一次都不虛此行。


  我：


  這是不是就像您在《小逃犯》中做的事情一樣？這是您第一部得到亞太影展最佳音效的電

  影，我也非常喜歡這部電影。


  杜老師：


  蛤？你有看哦？（笑）


  我：


  對！我非常喜歡這部電影，所以我想知道《山中森林》這部社會幫派電影，你有沒有什麼

  巧思可以跟我分享看看。


  杜老師：


  我想看看有沒有比較具體的部分可以跟你說。


  我：


  虛無縹緲也沒關係。


  杜老師：


  （笑）其實我很佩服姜寧在李康生後段的編排，還有幾個小弟在喬事情，李康生帶著他們

  的片段我每次看都好喜歡，其實他們那個移動很荒謬，但真的又非常非常好看，反覆沈浸

  ，真的讓人很喜歡。


  我：


  那在跟姜導合作的過程中有什麼有趣的事情可以跟我分享嗎？


  杜老師：


  （笑）


  我：


  還是大部分都不能講？


  杜老師：


  （笑開懷）那我分享，我分享一個，反正都最後一天。姜寧每次都會送我一瓶酒，但其實

  我沒這麼需要別人送東西，收嘛，不收嘛，感覺都很奇怪，我又沒喝這麼多。


  我：


  我們這次拿來的濃度不高，很好喝，老師可以多喝。


  杜老師：


  （笑）當然當然，好像被大家認為我是一個喜歡喝酒的人。


  我：


  我多拿一點給你。


  杜老師：


  （笑）


  //////


  以上！


  有空再來上色。


  跟杜老師聊天真的非常有趣。


  山中森林的第一版到最後一版真的因為「音效」產生了很多變化。










  --'
