url: https://www.ptt.cc/bbs/movie/M.1673624716.A.51A.html
title: '[微雷] 山中森林'
content: '看完電影，講一下幾點心得。

  覺得滿多點可以討論的。

  放個預告在防雷之前















  ————————————————————————————————


  開場紅龍的意象讓人印象深刻，然後獄卒對主角阿生的台詞也貫穿全片。

  他欲言又止地看著魚缸中的紅龍，問說：

  「你覺得牠在這邊還是出去快樂？」


  李康生飾演的阿生身上明顯有很多的遺憾在。

  在片中其實他有很多的欲望，

  而故事軸線擇是去呈現他面對這些欲望時，做出了怎樣的「選擇」和「放下」？


  而我自己看下來，覺得山中森林的重點是側重於

  ——你想要做怎樣的人的「選擇」？


  從一開始爸爸寫給獄中阿生的信就有暗示了，

  阿生想要去看故宮汝窯，獄友則是想去林森北路看乳搖。


  汝窯和爸爸的香腸車。

  是同一組暗示，我認為代指的是「阿生」這個人，他自己想要過的生活。

  但劇中在這個部份留白了，

  我的解讀是阿生其實內心渴望著寧靜的生活。

  就像是結局的時候，他選擇帶小靜去夜市開槍打氣球一樣。


  而「乳搖」和劇中不時穿插的性元素。

  則彰顯了「生哥」的現實。

  他在身為阿生之前，是大家的生哥，生哥當年入獄了。

  現在出來了，所以大家都又開始聽生哥的話，只有生哥叫的動他。


  在劇末沙鷗遇事時，做為生哥的他，只能出來擺平。

  因為他是生哥，他如果不出面？那誰會出面呢？

  片名叫做山中森林，也就是林森中山的倒裝。

  所以這終究是在描寫發生在林森北路上，

  發生在中山區裡頭，一群兄弟們的故事。


  阿生有太多放不下的事情，

  他放不下有肉體關係的酒店妹小靜的委託。

  他放不下自己的小弟成澔，更不希望成澔步上他的後塵。

  他放不下兒時玩伴沙鷗。

  即使再相見的時候，沙鷗已經長成了他不認識的樣子。

  沙鷗再也不是跟在他後面，可以一起放浪形骸在海邊縱酒，看著海風，聊著那些狗屁倒灶

  的事情，或是哪個妹正點的那個跟班。


  他同樣也放不下前女友淑貞，


  所以出獄以後，他的舊識都見了一面，但唯一他不敢見的就是淑貞。

  選擇了不見不是沒有感情，是因為淑貞的份量實在太重，所以才選擇不再見面。


  整部片最常出現的一個稱謂是「兄弟」。

  每一個人對於兄弟都有不同的詮釋，沙鷗突顯出的兄弟，比較多是只為自己

  雖然最終他也放不下阿生。

  他一開始在海邊提出要給阿生一干人兩千萬，請阿生解決掉對頭。

  在被阿生拒絕後，他帶了林森北上知名的宵夜們來找阿生，告知他，他自己要選擇出境避

  禍。


  放不下的不只是生哥，還有成澔。

  其實發生在阿生和小靜。

  以及發生在成澔和愛麗絲身上的故事，都是一樣的主題。


  成澔原本要回歸平凡，但因為阿生的出現，所以他走不了。

  所以他的選擇，只能是做完最後一票再走。

  而他和愛麗絲最後的結局，也是因為他最後的選擇，才導致了這樣的結果。



  整體而言，山中森林想要處理的核心主題比較深一點點。

  滿多鏡位都有在做暗示，像是前後貫穿的紅龍，以及討論怎樣才是自由？

  以及在後照鏡中，每一個兄弟的眼神。

  是一部比較需要時間消化的片。




  除了內核的部份

  其實感官刺激上，尺度還滿大的XD，

  郭雪芙和王子的調情鏡頭充滿曖昧，




  然後有李千娜的畫面。

  一整個就是大尺到不行。




  李千娜和李康生的床戲真的是很猛，

  聽說已經是刪減之後的版本，

  所以才再次只看見生哥的屁股，雖然大片刺青很帥

  但我更想看千娜的啊靠腰  (敲碗

  誰要看屁股啊



  誰手上有完整版我想要上車> <






  ————————————————————————————————





  以上防雷

  總之，有些部分比較文青一點，

  如果有版友也有去看，可以來討論一下。

  目前還在消化中。

  大概想到的就先打下來了=  =



  --'
