title: 'Re: [負雷] 千萬不要看 山中森林'
content: '真意想不到有人可以看得這麼仔細


  身為一半相關的從業人員我從初剪看到完整版還真的沒辦法這麼仔細


  我猜你也是工作人員之一吧


  不知道你跟導演發生了什麼，但看得出來你怒氣值很高（拍肩


  也說說我對山中森林的看法吧


  其實不太認同你說劇情圍繞在李康生跟王子身上


  反而我覺得姜寧的敘事手法很零碎、片段


  沒有好壞之分，就是他的敘事手法，也可能是導演生手的關係，導致前半部的劇情為了堆

  疊後半部是零碎的


  看了山中森林的觀眾應該多少會有「前面好想睡，後面才精彩」的感覺。


  李康生在監獄中跟阿吉對話的片段我自己覺得有點尷尬，但我完全不會覺得李康生出戲，

  而是這樣的語調更讓人「不覺得在拍電影」，而是真的一個這樣的角色出現在身邊。


  出獄後跟李千娜的互動我反而也不覺得是暈船，李康生飾演的這個角色其實很笨拙，在黑

  道裡面會當「槍手」的人大概都不是什麼大人物，而是進去洗一輪才變厲害的，出來才能

  帶頭。


  相比謝承均飾演的沙鷗，李康生彰顯了武鬥派（沒腦）的黑道樣貌。


  你說他暈船李千娜？沒有，就只是無聊對個看對眼的小姐好而已，從頭到尾沒感覺出他暈

  船。


  反倒是長髮emo男才是那個暈船又不知道怎麼辦的廢物小弟


  李千娜確實尺度很大吧，身材也確實很好，感覺是你太喜歡李康生了一直注意他。


  文青咖啡店我認同，太拖戲了。


  黃遠飾演的猴子才是尷尬感滿滿，有點搞不懂一個台灣黑道為什麼會弄成墨西哥黑幫，想

  裝狠結果只是路邊吸毒89。


  上船之前李康生說：「要不要混兄弟是他自己決定的。」


  其實這句話不是李康生爛，而是如果他不在這時候讓王跟著他，那王子是不可能離開的，

  而且劇情裡也有提到王子對這個「兄弟義氣艇」是放不下的，真正的黑道就是不是你說走

  就走的。


  跟大嫂的敘舊片段我其實蠻喜歡的。


  這裡來的謝有兩個可能


  第一個是死了，李康生做夢。


  第二個是活著，真的見面。


  我傾向是第一個。


  這就是比較意識流的作法了，這裡的沙鷗準備跑路了，李康生也同意，其實到此之前我都

  以為沙鷗是反派。


  但他不是，這也是這部片讓人猜不透的地方。


  從這裡開始山中森林對我來說才正式開演。


  長髮小弟跟李千娜我看不是很懂，應該是李康生被傳播妹騙了的意思，老爸根本沒生病或

  是沒這麼嚴重。


  李康生開槍很有道理啊，自己的好麻吉死了欸。


  後面在停車場那段蠻震撼的，沙鷗來的時候有講香腸車找到了，所以不突兀。


  後面船上打架的片段到結局。


  我覺得跟沙鷗那段一樣，就是夢或現實的兩種可能


  可能王子在船上就死掉了


  也可能沒有


  但最後就是無論如何王子這個人都得死


  這就是黑道的命運


  當然李康生也是


  整部片要講的就是這個吧。


  不過你中間的吐槽我覺得滿好笑的就沒什麼意見了。







  --'
