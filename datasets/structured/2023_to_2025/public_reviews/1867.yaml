title: '[討論] 山中森林為什麼可以這麼難看?'
content: "昨天不小心看到山中森林\n\n裡面的人拍起來都沒有演技\n\n整部片沒有主軸\n\n為了公司也不是 為了要找香腸車 結果也沒有爆點\n\n\n\
  然後不知道哪個人騙我的\n\n說李千娜跟知名甲甲李康生做愛的時候 整個是背部全裸的\n\n結果根本是李康生背部全裸\n\n這片到底是怎麼回事啊\n\n\n這片好像就東操操西抄抄\
  \ 整個沒有主軸\n\n好像大學期末作業最後一天亂複製貼上的東西\n\n然後標點符號和格式也沒整理\n\n有半形有全形 中間還有單行間距和1.5行間距混再一起的\n\
  \n\n這導演拍完片之後 沒有發現他中間亂七八糟沒有主軸嗎?\n\n還有\n\n陳德容怎麼可以老化的這麼快?\n\n--\n火鍋芋頭 三色豆 香菜 生洋蔥 皮蛋\
  \ 豬血糕 臭豆腐\n\n 圓寶老師盯著你不能挑食\n\n--\n他跟蔡明亮不是情侶?"
