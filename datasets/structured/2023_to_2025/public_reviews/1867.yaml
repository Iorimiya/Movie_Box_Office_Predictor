url: https://www.ptt.cc/bbs/movie/M.1673684102.A.DC7.html
title: '[普雷] 山中森林 唯美的黑道國片'
content: '出來混還是要還的，老大或小弟都是凡人，誰也無法拯救誰。


  這是我對山中森林的看法。


  以下劇情雷，介意者請繞道：


  我很喜歡一開始魚缸外的對話：「在裡面快樂還是在外面快樂？」


  我原本預期這是比較傳統的暗示，暗示獄中生活與外面生活的「自由」區別，但讓人意外

  的是，這部片想傳達的竟然不是自由。


  更像是李康生就是這隻紅龍，在裡面在外面，不都一樣嗎？


  ——無論你是誰，你都平凡無奇且被命運擺佈。


  出獄時，沒有任何人來接應他，只有裡頭認識的阿吉所帶來的小弟，甚至這些小弟也不認

  識「生哥」，那生哥呢？


  生哥也不在乎。


  整部片貫穿的就是李康生演技精湛所傳達出的「無所謂」，不管發生什麼事，最痛苦的是

  失去沙鷗這個兄弟，到頂樓開幾槍然後報復對方，除此之外，李康生幾乎沒有任何波動，

  彷彿觀影者是李康生，我們正冷淡地看著一切社會事發生。


  你開槍又怎樣？你為兄弟入獄又怎樣？厲害在哪裡？


  十二年後，無人問津，即使知道你是哪個「兩把貝瑞塔」的狠人，小弟們依然不會尊敬你

  。


  回到原來的地盤，小弟們也只是突然地又尊敬了生哥起來，十二年了到底有什麼好繼續尊

  敬他的，這裡我有點看不太懂？


  緊接著的片段都讓人以為「沙鷗」就是最後大魔王，勢必會跟李康生來一波角頭爭霸戰。


  事實上沒有。


  該說導演姜寧夠「賤」，知道觀眾在想什麼，我就是故意不給你看，還是導演姜寧太聰明

  ？


  談談我很喜歡的鏡頭。


  中間一直在找香腸車，我特別喜歡小弟們載著李康生到處跑的畫面，映襯了一股詼諧感，

  節奏讓人很喜歡。


  後段李康生和沙鷗在海灘上講事情，彼此的拉扯，感情上的、兄弟之間的，可以看出一些

  掙扎感，生哥似乎是「累了」，這些社會事他已經不像過往這麼招搖，但也就不像他了，

  沙鷗感恩生哥似乎陌生了起來。


  長鏡頭，蔡明亮擅長的長鏡頭，在此出現了。


  而後到沙鷗被謀殺，都增添了整部電影的美感、出乎意料，直至這裡以後，故事突然緊湊

  起來，


  後半段我覺得非常好看，幾乎可以說是黑道國片的巔峰，無論是在停車場拜香腸車的陣仗

  ，到後面跟黃遠的「船戲」都讓人屏氣凝神。


  簡單來說，山中森林是我近年看過最好的黑道電影了，頗有台灣教父的感覺。


  --'
