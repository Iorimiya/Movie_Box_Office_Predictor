url: https://www.ptt.cc/bbs/movie/M.1673835142.A.F68.html
title: 'Re: [負雷] 千萬不要看 山中森林'
content: '昨天去看了，導演說他賣房子拍了這部片，不要寫負評

  先不討論台灣人要有房子才能拍片這件事情

  現在行銷電影還要靠賣慘賣肉賣緋聞嗎?

  這部片的行銷是都有賣了.....



  整片充滿吐槽點與難以言喻的黑色笑點

  那種笑點是說了也不好笑

  頻率有對到的話也很難複述在笑什麼東西



  那些地方導演應該也不是要拍來當笑點的

  他就是很正經地想發揮他的美學

  但是，嗯


  p大這篇寫得算是貼切，雖然有些地方有出入




  那套內衣是不是透膚到露點了?

  因為特寫只有一兩秒看得不是很清楚




  這邊是因為李千娜來找他，所以他把前妻丟下去

  但千娜從門口看到裡面有女性衣物所以沒進去

  拿了東西就走了

  千娜走之後謝承均才來




  我想了一下，姑且不說浪費子彈的問題

  在外鳴槍很容易引起注意

  他不是假釋中嗎...

  但全片太多這種奇怪的地方，就不要跟他認真了




  我都想說康生眼睛不痛嗎，金魚池水很髒啊.....



  而且導演到底是康生的粉絲還是跟他有仇

  從頭到尾一直讓他抽菸，每一幕只要他一出場就是點菸然後吸幾口再隨地一丟

  鏡頭很強調這個畫面

  我們看他抽了兩小時的煙，實際拍攝他一定抽更多，看得我肺都痛了



  有些鏡頭疑似想致敬青少年哪吒，

  但蔡明亮只有一個，學一部分又貪心想放其他東西就.....嗯

  蔡明亮看李康生的鏡頭語言是無法複製的


  想藝術藝術不到位

  想商業卻又還很生澀

  只能說是畫面比較精美的台北物語

  可惜的是，台北物語的成功方式也是很難複製的



  以下講一下看點

  這部的音樂是滿不錯的

  有些鏡頭的畫面也拍得很漂亮


  導演本身是經營夜店出身，電影中應該是相當還原了台灣黑幫生活的樣貌

  但也因此讓電影的前半部很無聊，

  因為不管職業是黑幫還是上班族，生活的日常就是流水帳



  另外有別於一般台灣黑道電影的是，

  這部戲的大哥小弟說話是以國語為主，

  像角頭系列那樣滿口台語烙狠話的角色反而不多，

  也許這才是比較貼近北部台灣黑社會的一般說話方式



  --'
