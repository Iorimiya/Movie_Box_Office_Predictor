title: '[新聞] 連恩尼遜新作《爆復》爛番茄負評連連！'
content: '新聞網址：


  2023-08-24 11:18:08



  「地表最強老爸」連恩尼遜（Liam Neeson）近年星途可謂相當不順遂，接續主演多部「

  救援系」作品皆未能收穫出色口碑。而近期上映的《爆復》（Retribution）同樣在網路

  上開出慘澹的評價。



  《爆復》改編自西班牙電影《炸掉銀行經理》（El desconocido）講述他所飾演的金融家

  麥特透納，在送小孩上學途中接到不明電話，恐嚇他的座位下方裝有炸彈，一旦任何人離

  開座位便會瞬間引爆，展開了一連串驚悚刺激的對峙場面。




  ，成為連恩尼遜影史第八部在該站上被評「爛」的電影。目前隨

  著更多負面評價湧入，分數勢必將持續下探。



  連恩尼遜屢屢踢到鐵板，根據網站紀錄，自從2019年《日常的愛》（Ordinary Love）開

  始，連恩尼遜所主演的電影作品，就再也沒在爛番茄網站上獲得新鮮評價。去年其所主演

  的犯罪片《馬羅》（Marlowe）以及 2020年愛情片《下一站，托斯卡尼》（Made in

  Italy）評價也不盡理想，但動作電影仍占多數比例。網站便分析，如果連恩尼遜持續無

  法接到好劇本，那麼他的「救援」之路很可能會隨時告終。



  --'
