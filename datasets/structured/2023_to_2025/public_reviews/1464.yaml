url: https://www.ptt.cc/bbs/movie/M.1689692532.A.4DF.html
title: '[新聞] 連恩尼遜再現「最強老爸」《爆復》改救超'
content: '新聞網址：


  連恩尼遜再現「最強老爸」《爆復》改救超帥兒子


  2023-07-18 中時新聞網 翁紫曦


  由《捍衛任務4》《空中救援》製片群打造、《不可能的任務7》動作團隊操刀動作場面，

  《即刻救援系列》動作巨星連恩尼遜主演的火爆動作鉅片《爆復》，故事描述一名高階銀

  行經理在開車送小孩上學的途中，意外接到一通未知來電，警告座位底下有個炸彈，只要

  他離開座位就會爆炸！


  自從2008年《即刻救援》上映之後，連恩尼遜就以「最強老爸」的形象聞名於世，然而，

  其實自2015年《一夜狂奔》以來，連恩尼遜已經有長達八年的時間未在大銀幕上解救家人

  ，《爆復》可以說是他回歸「最強老爸」身份之作。值得一提的是，連恩尼遜片中的兒子

  是由以《阿凡達：水之道》裡的「蜘蛛」一角聞名的美國新生代男星傑克查恩（Jack

  Champion）飾演，讓人期待兩代紅星會擦出什麼火花！《爆復》預告片在網路上公布之後

  ，也引起影迷熱烈討論：「（《即刻救援》後）過了15年，大家還是不斷找連恩尼遜的家

  人麻煩。」「連恩尼遜的電影看再多也不膩！」「連恩尼遜永遠不會讓我失望，等不及了

  。」「連恩尼遜的嗓音永遠那麼銷魂。」


  爆復》製片安德魯羅納（Andrew Rona）和艾力克斯海納曼（Alex Heineman）過去曾與連

  恩尼遜合作過《空中救援》、《疾速救援》，這兩部電影的故事舞台分別是飛機和火車，

  《爆復》則是一輛裝了炸彈的汽車，這三部幾乎可以視為一套「交通工具三部曲」。兩名

  製片回憶，他們是在《疾速救援》的片場跟連恩尼遜介紹《爆復》的故事，而他很快就被

  緊湊的劇情節奏吸引。安德魯羅納表示，與前兩部作品相比，連恩尼遜在《爆復》裡既不

  是美國聯邦空警，也不是退役警察，只是個平凡人，「即將度過人生中最糟糕的一天。」


  連恩尼遜早年主要演出文藝片，晚年則轉型成動作演員，選劇本的眼光，可以說是他在影

  壇保持長青的秘訣之一。連恩尼遜近期接受美國雅虎訪問時，透露了他挑選劇本的獨門秘

  方，而這跟他熱愛的「茶」有關。「如果我的經紀人寄給我一份劇本，我讀到第五頁時，

  我冒出『我必須泡點茶來喝』的念頭，這就不是個好兆頭。」連恩尼遜說：「相反地，如

  果我能把一個劇本從頭到尾讀完，直到最後才想到要泡茶，這就是個好兆頭。」


  --'
