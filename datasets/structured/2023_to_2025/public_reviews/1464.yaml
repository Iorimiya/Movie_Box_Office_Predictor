url: https://www.ptt.cc/bbs/movie/M.1693139342.A.ED5.html
title: '[普雷] 爆復—老爸變司機了'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  我只能說


  是因為對連恩尼遜有愛才來看


  但老爸的動作戲已經趨近於零


  想當初好歹還會掙扎一下


  跟反派來個看起來勢均力敵的扭打


  這集怎麼搞的


  就變成了賓士新款廣告


  從頭到尾只記得分別炸了一台特斯拉，


  BMW，瑪莎拉蒂和我們主角的賓士


  喔對了


  他的車庫還停了台保時捷


  他和他老闆就是吸血的基金盤


  標準的龐氏騙局即將垮掉


  老闆打算像捲款而逃還想讓男主背鍋


  弄了幾場炸彈案把人炸一炸


  還偽裝自己死掉


  不過還是不太高明


  自己還是上了賊船


  沒料到男主從頭到尾只在乎妻小平安


  當爸爸的總是視死如歸


  劇情由於標榜最強老爸


  我一開始還想說會有什麼超猛動作戲


  比方說飛車躍下


  讓車子把老闆弄爆


  沒想到最後是側躺河邊落水


  不對啊 側躺的時候壓力就變了吧


  算了老爸活著就好


  聽著連恩尼遜那熟悉的嗓音


  還是想支持他進戲院一睹風采


  但我還是希望看到他掄拳救援啊


  不要只有開頭打沙包好嗎


  --'
