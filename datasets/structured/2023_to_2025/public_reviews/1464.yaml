url: https://www.ptt.cc/bbs/movie/M.1703758217.A.54F.html
title: '[好雷] 爆復-沒有新意但也不浪費時間的最強老爸'
content: "（本文只有30％劇透）\n\n\n\n\n\n\n\n\n\n\n這部是最近在mod上架的爆復（Retribution）算是最強老爸連恩尼遜的新片，\n\
  \n片中也當然有親子和家庭這種我這個YA板主會感興趣的元素。\n\n\n預告：\n\n\n片中的主角Matt 是個金字塔頂端的基金經理人，本片就是豪宅名車看飽飽，\n\
  \n但看到有錢人這個設定又是最強老爸，肯定主角運氣不會被編得太好，\n\n不只忙著工作老婆想離婚、孩子死握數位裝置不放也不想理老爸，\n\n還有各種中年危機，因為管錢管到弄丟客戶的錢，想必招黑無數，\n\
  \n就跟柯林法洛的絕命鈴聲一樣死到臨頭才要各種患難見真情挽救關係。\n\n\n\n最後的大魔王我是沒有猜到，光這點懸疑感刺激感都能滿足。\n\n雖然動作大場景少了些，但飛車爆破都有，只是最強老爸幾乎都是文戲，連槍都不太握。\n\
  \n\n\n但Matt一開始知道被安座位炸彈到最後的_____（怕爆雷自行模糊處理）\n\n都顯示他足智多謀，能對付暴徒又能靠投資基金管理鉅款，絕不是紙老虎。\n\
  \n\n本作品IMDB：小童星Lilly Aspell和Jack Champion都很會演又顏質高，\n\n連女友Emily Kusche騎個重機都顏質和身材爆表。\n\
  \n\n\n\n總而言之算是可以一看的片，如果闔家觀賞當「數位疏離警鐘」看會更好XDDD\n\n片中一把將孩子們的手機丟窗外，不知道是多少家長的夢想XDDD（開玩笑的）\n\
  \n\n再來就是歡樂的吐槽時間，本文說本片「毫無動作場面」實在是睜眼說__話，\n\n要是我是片商肯定請對方先修改一下囉，這片的片商好佛心。\n\n\n  （截圖作證一下，電影神搜這麼棒的平台\n\
  \n居然沒審稿嗎？）\n\n明明片中有飛車有爆破還有警察派拆彈機器人介入，女警官還很政確地是個黑人\n\n也安插得毫不突兀，自稱影評居然說「毫無」動作場面？\n\
  \n\n本片發生在柏林也是翻拍之作，不算多有新意，\n\n但仍有不少柏林味，除了地標之外也看得到英勇冷靜的柏林警察，\n\n不少小動作都非常專業，不會讓我覺得浪費時間。\n\
  \n--\n\n幻想●---------------☆\n/﹀\n/\\ \n\n按a加入最愛\n\n--"
