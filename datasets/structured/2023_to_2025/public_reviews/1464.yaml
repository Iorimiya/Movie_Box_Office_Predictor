title: 'Re: [討論] 這次正義聯盟很有機會打爆復仇者聯盟'
content: '雖然不知道原PO是不是反串，但底下推文確實有DC憤怒粉出沒


  絕大部分喜歡看超級英雄電影的人，Marvel和DC都會去嘗試一下的


  所以何必用貶低A的方式捧B呢？


  一樣東西會不會受人支持，有時候並不是靠其本身吸不吸引人，反倒是受其支持者的影響

  更大


  你這樣不會讓更多人去看你所支持的電影，電影如果失利了反而會有更多人笑你


  這讓我想起了一部兩年前的勸世影片




  現在很多東西還沒出來，DC粉不要這麼激動啦







