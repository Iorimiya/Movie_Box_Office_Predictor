url: https://www.ptt.cc/bbs/movie/M.1703921887.A.89B.html
title: '[ 大負雷] 整個莫名奇妙的爆復'
content: '忘記hami 上面是不是這個片名了

  昨天晚上看他第一名點進去看

  這部片不知道省成本還是怎樣幾乎整部片都在車上進行

  然後有很多莫名奇妙的點像是

  他兒子女朋友追尾他們家

  然後他兒子竟然說連恩尼遜有什麼問題幹嘛要撞她

  他兒子女朋友也一副我沒有錯的三寶樣子


  中間一段最扯的是

  整部片應該就這個黑人而已

  偏偏他就是最雞巴最討厭的那個

  就知道有炸彈然後他女兒快死了還在那慢吞吞


  還說什麼我們有EMT

  幹他的那個傷口不是EMT 就能處置的好嗎

  最後竟然是拆彈的人隨意把他抱走

  說好的EMT呢？？？


  最後真的只是他同事為了錢

  然後就搞了好幾顆炸彈

  為什麼知道他今天會送小孩 沒說

  什麼時後裝的 沒說

  最後連恩尼遜有沒有洗白 沒說

  他女兒有沒有截肢 沒說


  然後結束了

  不知道有沒有人去電影院看這個

  感覺好空虛


  --'
