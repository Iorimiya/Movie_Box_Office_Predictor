url: https://www.ptt.cc/bbs/movie/M.1469373609.A.7A9.html
title: 'Re: [討論] 這次正義聯盟很有機會打爆復仇者聯盟'
content: "其實我也滿希望 正義聯盟能屌打復仇者\n\n紀錄就擺在那 正義聯盟希望能破復仇者的紀錄\n\n\n雖然 BvS的三巨頭都現身 隨便一個最低知名度的都樂勝復仇者任何一個角色\n\
  \     但是票房還是輸復仇者聯盟系列一大截\n\n\n雖然 BvS的導演知名度也不比復仇者聯盟導演差  但是票房還是輸復仇者聯盟\n     一大截\n\n\
  \n雖然 BvS的票房還算不賴 但是和未在大陸上映的死侍相比 似乎沒差太多?\n\n\n\n\n\n說了那麼多 我只是 嗯 想備份和平衡一下\n論美術風格配樂什麼的\
  \ BvS絕對樂勝\n\n\n但是劇情的編排 人物性格的塑造 看到目前為止真的差評\n\n\n\n所以 正義聯盟..................嘛 不期不待不受傷害\n\
  是說 我還滿希望札克拆成兩集 上集著重在找齊夥伴 下集合體解決魔王\n不是很好嗎 也不會片長抱炸 再度被華納亂剪一通吧\n\n\n總不能每次札克大老的電影 我就是得等完整版吧...........\n\
  \n--\n把黑色的心臟\n\n          藏在腐爛的身體裡\n\n                        裹著這無趣的世界\n\n--"
