url: https://www.ptt.cc/bbs/movie/M.1469348985.A.4DB.html
title: '[討論] 這次正義聯盟很有機會打爆復仇者聯盟'
content: 'BvS跟諾蘭的蝙蝠俠拍得太高深

  雖然有點深度的觀眾都能了解 但是沒有抓到看爽片的族群


  導致輸給那種主打違法亂紀價值觀的美國隊長3與復仇者聯盟


  這次正義聯盟的預告 ,看來爽度就提高了不少

  應該能在深度與爽度之間取得平衡


  況且成員一字排開

  蝙蝠俠、超人、神力女超人、閃電俠、Aquaman、Cyborg

  每一個知名度都屌打那群雜魚知名度的復仇者聯盟


  在知名度最高的X戰警不可能回歸的狀況下,

  非常看好這次正義聯盟能完全擊敗復仇者!


  --


  看到那個什麼奇異博士拍出跟全面啟動有87%像的預告片


  基本就可以說明那個系列的創意已經到盡頭了


  DC能從你我小時候延續到現在不是沒道理的



  自己去找我文章,我立場一直都很一致


  從我小時候就是DC最紅,什麼鋼鐵人還美國隊長本來就是不紅的joke


  早晚會被超人跟蝙蝠俠把市場吃回去


  你不知道導演版的BvS評價已經逆轉了嗎?


  早晚的事'
