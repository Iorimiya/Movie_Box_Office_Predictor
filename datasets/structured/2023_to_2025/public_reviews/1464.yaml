url: https://www.ptt.cc/bbs/movie/M.1469377805.A.DC7.html
title: 'Re: [討論] 這次正義聯盟很有機會打爆復仇者聯盟'
content: "科.........又是這種文\n\n首先 我重申一次結論『這兩部片根本沒有可比性』\n\n一者掙錢 一者留名 是要怎麼比??\n\n你會拿賣座大片變形金剛1~4\
  \ 去和影史經典魔鬼終結者2比嗎?\n\n根本不會 因為賺錢很空虛 連郭台銘賈伯斯都說過類似的話\n\n更何況...我說了你們也別生氣　 ==> 　也不是你在賺錢\
  \ ^皿^\n\n\n\n\n我們走進電影院應該要想想\n\n你想要的到底是什麼　如果只是想讓血壓脈搏上升　感官刺激(這個很下乘 我懶得說)\n\n那麼變形金剛\
  \ 復仇者聯盟系列做到了 然後你走出戲院 你會發現你什麼都沒得到\n\n\n\n\n如果你想要從片子中找到一點人生的感悟 進而對大腦有所啟發 再進而了解宇宙蒼生\n\
  \n那麼廢話不用多說BvS是你的最佳選擇嘛\n\n一次可以收穫那麼多 看的是準得獎片 又能順便提升您的智商和素質\n\n這票價花得太值了\n\n告訴各位 走出戲院我完全沒有看變形金剛系列那種悵然若失\
  \ 空虛的感覺\n\n反之 是一種蕩氣迴腸 餘韻悠然的滋味\n\n神力女超出場的重低音響戰歌 至今不絕於耳 真的是震撼人心\n\n出了戲院當時 我立刻 家都來不及回了\
  \ 找了間網咖馬上PO了我的心得文\n\n我看片一向很挑的 you know　能讓我立馬po文的片子 坎占一般不低\n\n\n\n\n好了 我覺得以後這種比較文\
  \ 也別再po了\n\n我不會去怪原po\n\n但是私以為 BvS > Marvel全系列 在這個板應該是共識了\n\n你要討論可以 得先承認這個大前提才能談下去\n\
  \n否則我會覺得你是來鬧板的\n\n謝謝大家 晚安\n\n\n--\n   很多啊 可以打一大篇 比如原來有跟人長得一樣的外星人 在宇宙中 我們並不是唯一\n\
  \   還有 人類只要經過努力和智慧 是可以戰勝原本看似不可能戰勝的超人\n   還有啊 叮叮叮叮.....叮叮叮叮叮叮\n   別笑了別笑了 啊啊啊啊啊啊啊啊"
