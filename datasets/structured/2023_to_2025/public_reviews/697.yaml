url: https://www.ptt.cc/bbs/movie/M.1749462636.A.B19.html
title: '[雷] 我談的那場戀愛 觀後感'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《#我談的那場戀愛》觀後感：兩個寂寞的短暫相遇\n\
  \n「愛情，只要你相信，就是真的。」\n用網路愛情詐騙案件辯證愛情：如果對方從頭到尾都在騙你，這些付出和得到都還是真的\n嗎？\n\n談戀愛的過程，少不了包裝和美化，所以女主角一開始也先隱瞞了喪偶和自己的年紀。被\n\
  騙者和詐騙者，雙方都有自己隱藏的事實與目的。\n\n這部片也呈現了很多感情發展的技巧和進程。有人對你感到好奇、投入金錢與時間的沉默\n成本、攜手共畫夢幻大餅、廉價卻稀少的口頭關心、一步步營造的命中注定感。這是人們\n\
  在愛情裡嚮往的體驗，也是為何心甘情願被騙的原因。\n\n兩顆心真的連結、愛情開始的瞬間，不在那些花言巧語，而是他們交出了自己，同時面臨\n生命的失落與寂寞。那時才是雙向的心動。\n\
  \n如果男主角沒有在愛情摔一跤，我想他到最後只會沾沾自喜，自己在女主角的生命佔了多\n大地位、有多少影響力。\n／\n「你真的沒被騙嗎？」女主角堅定的說沒有，她談了一場戀愛。也許在愛人面前一步步剖\n\
  開自己、揭開傷口的過程，與感情詐騙的差別，就在他有沒有要利用你的弱點、圖你的錢\n。\n\n可能這跟所謂短暫陪伴的「伴遊／一日男女友」，差別只在先後付款，以及場景的虛實吧\n\
  。\n\n愛情的定義很多種，短暫的交集也能帶給對方療癒陪伴。話說回來，這樣命定的戀愛感，\n到底值多少錢呢？當愛情幻滅、人設崩塌的時候，能這樣笑看自己曾經的相信跟付出嗎？\n\
  \n–\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n\n--"
