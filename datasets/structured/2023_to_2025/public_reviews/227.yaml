url: https://www.ptt.cc/bbs/movie/M.1441070683.A.727.html
title: '[討論] 我的兄弟情人與關於愛情的心得(有小雷)'
content: '這兩天因為實在太有空了，就把之前一直想要看的泰國片我的兄弟情人及關於愛情兩部片給看完了。


  　　之前原本對於我的兄弟情人蠻有興趣的，畢竟近幾年推出的同志電影都不是以學生時期為主。

  　

  　　但看完後說實在話有點小失望，劇情來說…就是蠻老套的：喜歡上異男，好不容易打動了，交往後被發現、阻止、然後分手。但這次新增了兄弟路線，然後……就沒什麼新特色了（疑?）　


  　　其實也不是說演員不好還是怎樣，至少看兩個小鮮肉主角心情上是不錯的，但導演的功力真的有待加強，很多場景的轉換感覺蠻突兀的就算了，結局也是走韓劇路線，出完車禍後發現主角得腦癌，另一個主角腎功能有問題必須捐腎，就把腎捐給對方後，就因為腦癌死了。


  　　

  　　我是在看十年前的韓劇嗎◢▆▅▄▃ 崩╰(〒皿〒)╯潰 ▃▄▅▆◣，導演你是覺得出車禍死會被觀眾罵，就想說改成腦癌死比較淒美還是跟我們說，你看，是他自己身體不好原本就有病的，不是我寫死他的呦!



  　　而且配角每個永遠都會讓你覺得他只是在想辦法刷存在感，導致劇情線很單薄，我只能一直看著主角Bank的臉撐著把整部戲看完




  　　後面抱持著要嘛補血不然就是吐血死在床上的心情，我改成看愛情來了。



  　　其實愛情來了的劇情套路也是跟一般的同志電影差不多，主角阿甘喜歡上鄰居奈，然後曖昧了一下(我真的覺得只有一下，而且也不知道轉折點在哪)，不過最後居然是少見的交往結局



  　　媽!我是不是來到異世界了!居然有同志電影的編劇願意不整死主角耶


  　　因為實在太難得了，所以直接給葛萊芬多加50分



  　　不過若是認真來說，其實我覺得這部戲的配角運用的就比兄弟情人來的好，不管是好基友三人組，還是雷大嬸，角色都很鮮明，甚至連阿甘的媽媽都覺得個性很可愛，而且主角群們也都很不錯(捂鼻血)，但主角阿甘我覺得算是少數主角的顏值低於配角的愛情劇，最近好像要出第二集的樣子。


  　　若是以兩部片來說，我想我應該不會推第一部，第二部則是無聊時可以看一下打發時間的電影。



  　　以上純屬個人心得，若有不同意見也請不要拿刀刺我，謝謝。



  --'
