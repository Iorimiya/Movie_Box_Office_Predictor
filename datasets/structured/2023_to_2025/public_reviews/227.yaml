url: https://www.ptt.cc/bbs/movie/M.1460043744.A.B06.html
title: '[普好雷]《性本愛》，關於愛與性的二三事。'
content: '部落格版：


  初看之下會不是很喜歡且習慣《性本愛》的呈現方式，時而現在時而過去的交互剪接並不

  少見，只是本片的呈現方式卻會讓觀眾混淆，一時半刻分不清現在究竟是兩年前還是現在

  ？但待釐清之後便可以好好的去咀嚼品味本片所帶來的感官刺激，以及那大量裸露畫面、

  性愛鏡頭背後的想法，關於性愛與愛情的本質探討。愛與性是否可以單獨存在，或是兩者

  並存在得以延續關係？頗耐人玩味。


  《性本愛》原本在去年底就會在台灣上映，只可惜礙於尺度過大遭到文化部阻擋，並要求

  剪接內容才能得以在台灣上院線，對於這件事情在當時爭議其實頗大，有人認為文化部禁

  止《性本愛》上映是老舊思想，對於現今開放、自由的社會，每個人都有權利選擇自己想

  拍攝的電影、觀眾也有權決定是否要進電影院觀賞，更何況台灣實施級別制度多年，大可

  把本片列為「限制級」即可，只要影院嚴格控管購買人年紀即可規避掉所謂，會影響未成

  年這個隱憂，看見國外許多國家對於電影類型越來越多元，藝術電影蓬勃發展，許多人認

  為文化部該拋開既有思想，以健康的眼光去看待藝術電影，不要用有色的眼睛去把片中裸

  露、性愛場面視為情色，不健康的事物，盼台灣應該是要越活越進步，而不是越活躍倒退

  。


  事隔近半年《性本愛》總算得以在台灣上映，而相當有幸的受邀欣賞到一刀未剪版，經過

  詢問知道正式版本會刪減2分鐘左右的戲，而被剪掉的部分是電影開頭的2分鐘，這2分鐘

  有多刺激？也就是女主角替男主角打手槍直至射精為止，被剪掉就是這部分，但是不止這

  開頭，全片的過程中近距離的畫面，生殖器的鏡頭不少，女生幫男生口交、男生將手指快

  速在女方下體抽插、甚至男女交媾的畫面一個都不少，著實會讓人在感到血脈噴張。



  本片的性愛場景至少占掉全片一半以上的篇幅，但是這看似不斷做愛做愛做愛的劇情裡，

  卻透過三人關係去傳遞最簡單卻又最難的問題，「性與愛」，男主角墨菲與女朋友伊蕾莎

  從公園派對認識，而他們對於情愛的價值觀達成某種程度的共識，他們可以盡情享受性愛

  ，甚至大膽提出想3P、到色情夜店與陌生人做愛、找變性人來幹男友等等，看似荒誕的兩

  人，卻有著深愛彼此的內心，他們堅信著彼此是可以把性與愛分開來看待、享受，他們可

  以享受無止盡的性愛，但是彼此才是唯一的愛。


  一切就在搬來的鄰居、被邀請3P的歐米懷孕後變調，伊蕾莎認為自己被背叛，她愛著墨菲

  ，也堅信彼此曾許下要保護彼此的承諾，對她來說，她是一個重信諾的人，她不喜歡過去

  ，但深信未來會有美好的日子再等她，可是墨菲卻沒辦法守住承諾，讓伊蕾莎徹底失望。


  其實到這裡有人會認為明明是伊蕾莎提議墨菲3P，且兩人不斷與陌生人發生關係，如今歐

  米的懷孕是個意外，但卻也是兩人如此放縱下的結果，那麼伊蕾莎為何還可以指責墨菲？

  我想這就必須回到故事本身，「性」與「愛」能否分開存在的問題上面，伊蕾莎以愛至上

  ，可是墨菲卻在一次與他人對話中認為性是人生最美好的事情，一人重愛一人重性，理念

  不合加上無法遵守承諾，可能正是伊蕾莎崩潰離開的主因，而且歐米懷孕了，她不可能要

  求她墮胎，認為墨菲會讓歐米懷孕，就是不懂得保護自己，保護彼此。


  「不要讓他人介入我們」卻被他打破，這是一個墨菲犯下最大的錯誤。



  「人生最美好的是什麼？」


  「愛？」


  「除了愛以外呢？」


  「性」


  「當性跟愛並存就是世界上最美好的東西」


  這是段看似平常卻富有思考空間的問題，而這也是《性本愛》本身想要跟觀眾探討的部分

  。你可以把本片視為性愛滿滿的害羞作品，也可以把它換個角度思考，在來來去去的男女

  間，思考自己對於男女關係的本質，性跟愛，性的根本是愛，而愛的底下有性，兩者看似

  可以分開成立，但或許相互相存才能成就最美好的男女關係。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
date: 2016-04-07
