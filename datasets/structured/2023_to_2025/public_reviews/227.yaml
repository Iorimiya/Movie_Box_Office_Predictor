title: '[好雷]《戀愛倒帶中》那夜關於愛情的哉問'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  發現自己是上了年紀，有了滄桑的曾經，才懂得欣賞法國文藝片。總向平淡無奇的日常丟

  出一顆震撼彈，再默默收拾殘局、撫平傷口的痕跡。《戀愛倒帶中》就是這樣一部，處理

  女人對婚姻產生質疑但仍不忘拾回戀愛初衷的電影。


  電影開頭，Chiara Mastroianni飾演的中年司法學女教授Maria，禁不住在簾後窺視有女

  生向她的男學生兼床伴進行言語挑逗，大膽地在房裡現「身」，揭露了她與男情人們偷歡

  的日常。直到接連而來的告白簡訊意外被丈夫Richard察覺、引爆一場婚姻危機，Maria才

  自覺她對婚姻的厭倦及自我衰老的恐懼，正推她走向缺乏罪惡感的性愛上癮症，於是與丈

  夫短暫分開、逃離到對街飯店，成為她的不二選擇。神奇的是這夜，在212號房內，她經

  歷了回到「過去」的旅程，展開了直達內心深處的自我探問。


  中文片名譯作《戀愛倒帶中》，片裡確實點出了讓愛情倒帶的理由，包括女人對愛情會有

  的動搖和猜疑：「我還愛他嗎？」、「要和他繼續走下去嗎？」，也正是這般捫心自問讓

  Maria偏離了常軌，開始在婚姻生活外追求性刺激。然而「隔離」的這一晚，她遇見了初

  識時的丈夫，是那樣秀色可餐、母親與祖母總帶著斥責提醒她的為人、年邁的傳奇男歌星

  說要來做她意志力後盾，過往勾搭過的男士們也一夕出現在她房內，與她進行對話。


  其中丈夫的初戀情人、同是幼時的鋼琴老師Irene，最令Maria感到妒忌。作為同樣上了年

  紀的女性，她除了擁有與Maria相似的擔憂和不自信，更因曾選擇放棄與Richard的愛情，

  對人生帶有更多的悔恨。「已經錯過了一次，我們能不能有機會重來？」是她所發出來的

  愛情哉問。雖然最終Richard的拒絕讓她絕望心死，卻也因此讓她重生、對當下放不了手

  的愛情產生了不同的感悟：或許現在過不去的坎，多年後來看，根本沒我們想得那麼嚴重

  。在這點上，片中對這兩個女人的心境轉折刻畫得真實而細膩。


  本片試圖探究了愛情的命定、提出婚姻被視為終身職業的辨證，談到了女性對歲月的懼怕

  ，也突顯「距離」在夫妻關係中的調合作用，甚至意想不到的，用具象化的拍攝手法呈現

  主角腦海裡的虛像，既魔幻又帶有舞台劇的即視感。本來單一空間調度場面的電影，容易

  讓人感到悶燥，這部除了穿插回憶片段、毫無冷場外，角色對白不時展露法式幽默及深刻

  的人生哲理。


  47歲的女星齊雅拉馬斯楚安尼（Chiara Mastroianni）和26歲男星文森拉寇斯特（Vincen

  t Lacoste）在片中除了有精彩的對手戲，也一同獻出不少養眼的床戲，增添觀影興致，

  卻絲毫不減電影藝術深度。


  滿推薦遇上感情或人生瓶頸時觀賞這部，給自己一個呼吸和思考的空間，探問自我真實的

  需求後，再重新出發。


  --'
