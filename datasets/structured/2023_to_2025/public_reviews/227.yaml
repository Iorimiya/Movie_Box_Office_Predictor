url: https://www.ptt.cc/bbs/movie/M.1413561594.A.802.html
title: '[好雷]【控制】關於愛情的觀後感 '
content: '圖文完整版


  我是朝著無雷的方向寫下這些心得，但我可以確定的是只要是談論這部電影，都很難不雷

  到人，所以請斟酌觀看。






  還

  是

  防

  雷

  一

  下

  好

  了







  你在想什麼？你覺得如何？我們對彼此做了什麼?


  在愛情中，不管兩人多相愛對方，不管兩人多麼的不分你我分享所有，不管兩人不斷互相

  勉勵來共同經營一段感情，但不可否認的，我們都想要成為愛情中的贏家。成為了贏家就

  代表別人得依賴我、離不開我，加強了自己對於愛情的信心，奠定自己在感情中的地位。

  說穿了，是一種虛榮，讓自己自命清高的獲封為對方的真命天女或白馬王子，是一場為自

  己舉辦的加冕儀式。


  於是我們想著如何成為愛情中的贏家，而《控制》告訴我，搶得先機是關鍵。


  兩人在相識時不管是誰追誰，大多都帶著兩情相悅的成份在，追求的先後順序通常並不清

  楚。但為什麼當被別人問到「是誰先追誰？」的時候，兩人總是會指著另一方的鼻子說「

  是你先追我的！」呢？因為被追的那一方等於是搶得了先機，在感情的一開始就拔得頭籌

  ，在之後的感情關係中就能獲得優勢地位，「他先追我的」翻譯一下就等於「他愛我比較

  多」，所以誰也不想認輸。


  然而就算輸在起跑點，也不代表就要一直輸下去，所以想反敗為勝，就得控制。「你看那

  男的妻管嚴好可憐」、「那個女的百依百順像小貓一樣」只要想想誰聽到這些會高興得起

  來，就可以理解大家為什麼在潛意識之下都想著要控制別人。如同電影中班艾佛列克說的

  ：結婚後他會想要改造你，但最恐怖的是控制。在愛情中誰能不承認自己不是控制狂呢？

  要是連控制的慾望都沒有，說不定還要仔細想想自己是不是真的愛這個人呢。


  而一段感情結束的時候，搶得先機就會變成一場劍拔弩張的爭奪戰。先提分手的人不只可

  以避免成為每天以淚洗面的那個人，在之後別人提起時也不用抬不起頭，可以理直氣壯的

  說「是我甩掉他的」。然而沒先搶到分手麥克風的人也不用氣餒，只要比另一方先跟別人

  分享這段感情的結束，大家就會站在你這邊，之後你的形象就會比另一方好很多。搶得先

  機公開說一段自己的感受，就能在大家眼中寫下有利於自己的結局（現在有FB更是方便許

  多）。聽起來很殘酷很心機，但與其哭哭啼啼，還不如做點有利於自己的事。


  仔細回想一下，就能發現《控制》的每一個轉折都來自於優先權的輪替，這邊就不多說了

  ，大家可以看電影時自由發揮。


  若是要約會的話可以考慮看這一部，保證兩人要嘛就是瘋狂討論和爭辯增進感情，不然就

  是一堆話悶在心裡不敢問最後心中產生疙瘩，但往好處想就是可以當感情的試金石囉（抱

  著一種去死團的心態XD）。這絕對不是大衛芬奇作品中最好看的一部，不過一定是今年可

  以排進前十的電影。它有點誇張所以我邊看邊笑，但看完後覺得這些都是建立在現實上的

  浮誇，就突然覺得背脊一陣寒意。只要撐過前面一小時的小平淡，後面的一個半小時就不

  是問題了。


  --'
