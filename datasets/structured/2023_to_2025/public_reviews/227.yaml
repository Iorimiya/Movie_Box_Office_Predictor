url: https://www.ptt.cc/bbs/movie/M.1534856353.A.060.html
title: '[好雷]'
content: '《小偷家族》


  7.9分/關於愛的形式



  前一陣子剛看了《無人知曉的夏日清晨》，於是對小偷家族的劇情走向倒是沒有很意外，

  突如其來的發生倒也適應良好。




  〈以下有雷〉

  所有的愛是否都並非純粹？

  在這部電影裡我強烈的有些懷疑。


  這個家族裡除了物質層面的偷竊，每個人也都試圖藉由一些心靈層面的偷竊，來完整自己

  。


  初枝透過這個家庭得到了老年時期所欠缺的家人所帶來的溫暖與愛；

  亞紀在青春叛逆時期的離家也透過這個家族有了依歸；

  而信代與治一方面照顧初枝奶奶取得生活欠缺的必須金錢，另一方面又在外頭救了由里及

  祥太，得以完整無法養育兒女的缺憾。

  最後祥太與由里就不用說了，能夠脫離原生家庭，對於他們自己本身來說，或許就是一種

  救贖。



  這個家族就這樣建立於彼此的缺乏，透過巧妙的平衡形成如烏托邦的完美生活。但現實就

  如初枝奶奶所說的，幸福是很短暫的，片刻的美好時光總是轉眼即逝。



  從祥太受傷那一刻起，表面和諧的家庭終究支離破碎。

  警局裡每一幕的質問片段，都是當代社會道德價值觀對導演所要表達的概念形成一種審問

  與對比。


  尤其是女警與信代的那場戲，

  「那祥太與由里怎麼稱呼你的？母親？媽媽？」

  一顆長鏡頭把一些沒辦法言喻的情感都表達了。

  信代哭是因為自己終究沒辦法做好母親的角色嗎？

  還是她對自己所認知的家庭與愛，竟然在這個社會裡是完全不被接受的而感到挫折？


  其實很喜歡這部電影裡頭，對於家庭與愛的詮釋，但可惜的是現實社會裡，就算真的有著

  愛，背後所隱藏的那些情緒甚至利益我們都無從掌握。而所謂的家庭，或許真的就是一種

  不可逆的羈絆，無論好的壞的，我們終究只能被框架在這樣的一個既定形式之中了。





  PS.安藤櫻真的好厲害，超級會演。




  --'
