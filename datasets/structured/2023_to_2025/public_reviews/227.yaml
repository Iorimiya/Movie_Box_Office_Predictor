title: 'Re: [討論] 關於愛情的對白'
content: "很喜歡的有記下來:\n\nForever turned out to be too long.\n<真愛一世情>\n\n\"You gave me\
  \ my first glimpse of a real life.\n Then you asked me to go on with the false one.\n\
  \ No one can endure that.\"\n\"I'm enduring it.\"\n<純真年代>\n\nI do. 'Til you and\
  \ I die, and die, and die again. 'Til death do us part.\n<閃靈殺手> 一死再死永不分離 好濃烈阿\n\n\
  [Bleeding together over a river.]\nMickey: We'll be living in all the oceans now.\n\
  <閃靈殺手> 最喜歡的台詞之一\n\nWe are who we are. People don't change.\n<烈愛風雲>\n\nEven though\
  \ I guarantee you that the girl will only hurt you terribly,\nyou'll still pursue\
  \ her. Ain't love grand?\n<烈愛風雲> 愛情的面貌不就是這樣?\n\n\"Do you know what this is ?\"\n\
  \"My heart. And it is broken.\"\n<烈愛風雲> 聽著也跟著一起碎了\n\n\"I'd like to somehow make\
  \ a difference in peoples' lives.\"\n\"And I... I would like to buy them all a Coke.\"\
  \n\"And you wonder why we never got involved?\"\n<四個畢業生>\n\n\n「我曾經說過我不到最後也不知道最喜歡的女人是誰，不知道她正在做什麼呢?」\n\
  \ <阿飛正傳>\n\n「你越想知道自己是不是忘記反而記得更清楚，醉生夢死只是她給我開的一個玩笑。」\n <東邪西毒>\n\nKnowing is the easy\
  \ part; saying it out loud is the hard part.\n<輕聲細語>\n\n\"Will you love me for the\
  \ rest of my life?\"\n\"No, I'll love you for the rest of mine.\"\n<第三類奇蹟>\n\nI\
  \ realized love won't obey our expectations,\nit's mystery is pure and absolute.\n\
  <麥迪遜之橋>\n\n\n\"What do you hate most?\"\n\"A lie. What do you hate most?\"\n\"Ownership.\
  \ Being owned. When you leave here you should forget me.\"\n<英倫情人>\n\n\"When were\
  \ you most happy?\"\n\"Now.\"\n\"When were you least happy?\"\n\"Now.\"\n<英倫情人>\n\
  \nEvery night I cut out my heart. But in the morning it was full again.\n<英倫情人>\n\
  \n\"You think love is simple. You think the heart is like a diagram.\"\n\"Have you\
  \ ever seen a human heart?\n It looks like a fist, wrapped in blood! Go fuck yourself!\"\
  \n<偷情> 好痛\n\nNo one will ever love you as much as I do. Why isn't love enough?\n\
  <偷情> 為何「愛」還不夠呢\n\nDo you know what it feels like getting up everying morning,\n\
  helpless, knowing that the love of your life is waking up with the wrong man?\n\
  But, at the same time hoping that she still finds happiness even if\nit's never\
  \ going to be with you.\n<全民情聖> 全戲最令人動容片刻\n\n\nI will never get old.. YOU will get\
  \ old..\n<1997情色風暴> T___T 無可救藥的悲\n\n\n\n太多了..\n\n--\n◆ From: 123.193.4.159"
