url: https://www.ptt.cc/bbs/movie/M.1752647140.A.A05.html
title: '[好雷] 關於愛'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  作為挪威中生代導演達格．約翰．豪格魯德「性愛夢三部曲」的第二部，雖說對話仍舊佔

  據電影的大半部分，但《關於愛》不像《關於性》一般哲學，反而呈現較多劇情發展，讓

  觀眾自己去體會與思考「愛」。



  瑪麗安是一位務實的女醫師，托爾則是一位富有同理心的男護理師，兩人都想逃避傳統方

  式，各自尋找親密的另一半。托爾分享自己靠Grindr「隨意性關係」的經驗與觀點，讓瑪

  莉安產生興趣，開始嘗試用Tinder交友，並思考自己是否也能接受這樣的關係…。



  瑪麗安認為自己與歐爾的關係尚未進入下一階段，所以也想多方接觸新對象，而且不論是

  在交友軟體上認識，還是在郵輪上巧遇，如果一次約會後覺得合不來，不主動聯繫就再也

  不需見面也很容易達成。然而，聽在幫她撮合對象的朋友海蒂耳裡，卻覺得瑪麗安一邊與

  歐爾約會，一邊與陌生人發生關係很不上道。聽起來主角的愛情觀是性愛分離，況且與歐

  爾也還不是認真的關係，但即便是在相對提倡性自主與開放思維的北歐，旁人總還會對順

  性別女性的「性」指指點點。



  電影也稍微碰觸男同志性行為遭汙名化的議題，就像女性享受性的愉悅不見於社會，男同

  志的性也經常招來異樣的眼光，但同樣是同性關係的女同志就沒有受到相同的歧視。明明

  關鍵在於固定性伴侶與安全性行為等衛教知識，世人卻總將男同志與愛滋病畫上等號，這

  可能正是為什麼導演選擇將主要角色設定為男同志與女性，從更客觀的角度去思考性與愛

  的不同面向。今天如果是女同志或順性別男性，或許片中的討論都不再是問題。



  「這段關係最好的發展，就是我們在渡輪上巧遇。」



  《關於愛》多處場景設定在往返挪威其他城市與首都奧斯陸之間的渡輪上，有兩名主角瑪

  麗安與托爾討論彼此對發展關係的看法與分享目前關係的進展，也有他們分別透過交友軟

  體認識某個對象的經歷。除了藉機展現奧斯陸的美景之外，也帶出傳統尋愛方式還是有一

  定的吸引力。在交通工具與交友軟體上認識對象，都是全然陌生的，但在交通工具上巧遇

  給人一種「命定」的感覺，彷彿《愛在》三部曲一樣的浪漫。



  「我做這些不是為了追求他。」



  從一開始就能看出，托爾是一位溫柔的護理師，他會特別注意病患是否聽懂瑪麗安的建議

  與醫囑，至於持續關心自己在Grindr上認識的病患，托爾也說是出於同理心。由於身為同

  志的他深知，切除前列腺對男同志來說，不但得面對勃起障礙的復健與調適，就連由他人

  從後方肛交的愉悅都會被剝奪，是兩倍的受傷。雖然托爾口口聲聲希望自己不要給出錯誤

  的訊號，但提供居家照護、留下過夜、主動幫忙採買日用品，的確會讓人誤會。不過，愛

  本就有多種面貌，他可能真的純粹想要提供自己能力所及的協助，而這又何嘗不是一種愛

  呢？



  瑪麗安與歐爾上床後，對方向她提出結婚的邀請，瑪麗安瞬間退縮，解釋自己不想要有孩

  子，因為這樣只會讓兩個相愛的人被迫永遠綁在一起，而婚姻本就是為了生產而存在的單

  位。歐爾聞言也表示理解，並稱自己不會再提，看來兩人的愛情觀不太相符，又或者面對

  這段關係的態度尚未同步。但當兩人下樓看見歐爾的女兒由於瑪麗安在屋內而獨自坐在門

  口，她卻也感到內疚，而後瑪麗安與歐爾前妻的對話也讓觀眾思考，即使我們現在無法馬

  上得知這段關係的結果如何，但這幾個人之間肯定是充滿著愛的，浪漫的愛與親情的愛。



  「如果你已婚，你就不會期待更多。」



  瑪麗安在Tinder上認識的第一個對象這樣說，如同給她一場震撼教育。兩人小聊幾句後，

  發現彼此合得來，便到碼頭去散步、游泳，最後發生關係，卻沒想到對方是有婦之夫，讓

  瑪麗安無法接受。就像愛有多種樣貌，每個人對性的觀感也是如此，有些人覺得只要自己

  深愛著伴侶，與別人發生性關係不算什麼，這番對話也映照回三部曲的第一部《關於性》

  裡所探討的議題，但對有些人來說，婚姻就是是否得以性自主的依據，甚至有人認為感情

  專一的定義是只要有約會對象，都不該與他人發生關係。



  姑且不管托爾對比雍的關心是出於同理還是愛意追求，他是在知道對方或許再也無法勃起

  的前提下付出，因此必定不是為了交換性行為而做。如同托爾與瑪麗安分享自己使用

  Grindr的心態，只是能夠認識人、與人接觸，畢竟對象總是得先遇見才有後續，就算當下

  瑪麗安對他並沒有隨便與在Grindr上認識的人發生關係感到驚訝，但顯然交友軟體對托爾

  來說並不是約砲軟體。他都能體貼到幫罹患前列腺癌的男同志想到遭剝奪的愉悅，「性」

  對托爾來說肯定在關係中扮演重要的角色，但絕對不是全部。



  「Tinder就是一間免費的妓院。」



  即便瑪麗安與朋友海蒂的愛情觀明顯不同，兩人都無法認同這句話，但交友軟體的確讓「

  性」的取得變簡單，只是是否讓世人更容易找到「愛」就不得而知了。速成愛情可能是未

  來的趨勢，而交友軟體在現代社會雖說也見怪不怪，但多少給人一種「純約砲」的感覺，

  導致不少認真找對象的人，也都羞於啟齒自己有用交友軟體。原因無非是上面有這種想法

  的人，即使自己再怎麼小心篩選，也難保不會遇到渣男、渣女，甚至在暈船之後無法全身

  而退。但是，多方嘗試都不是壞事，大家最後終究都會找到自己最喜歡、最適合也最舒服

  的「尋愛」方法。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
