url: https://www.ptt.cc/bbs/movie/M.1753404197.A.CF1.html
title: '[普雷] 關於愛Love'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  似乎一如預期地無法超越個人對《關於性》的喜愛，思辨大抵上是有意思，但觀影感覺偏

  扁平，頻率算是沒什麼對上。反而透過故事，對奧斯陸有更多好奇與想像，譬如男性護理

  師的比例這麼高嗎？像foodpanda的外送都騎自行車！甚至立馬看起了奧斯陸地形與氣候

  。若說是城市電影，它可說非常成功。


  想起來頗為合理的是「性愛夢」作為三部曲，之間的連結就是這個城市與人，這些出場的

  角色會出現在同一個廣場和同樣風景，面對不同的人生問題。三個主題可以說都是被討論

  到已經有點難在出什麼新意，因此「關於性」的有意思似乎多是來自於兩位主角簡約而細

  膩的表演，讓人生卡頓感隨著敍述與時間，慢慢消解。「關於愛」出發點似乎也是如此，

  醫療現場到渡輪通勤，落在一個生活與意外場景的區間，對白依然是頗有巧思。然而由城

  市慶典串起全場，使整個故事所指涉的性與愛，略顯得「力圖表現開放實際仍放不下」的

  尷尬。




  ***


  這裡是我的樂園:




  --'
