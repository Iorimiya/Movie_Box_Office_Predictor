url: https://www.ptt.cc/bbs/movie/M.1456760373.A.CF8.html
title: '[請益] 關於愛在他鄉的問題(有雷)'
content: '請問女主角在百貨專櫃裡，幫客人把不知道什麼東西放近管子裡，再拿出來給客人，那到

  底是什麼東西?在做什麼啊？


  以下是一點感想，文筆不好，簡單寫一下：


  電影一開始，女主角說自己得到sponsor，可前往美國工作時，我立刻想起在澳洲打工度

  假的日子！在澳洲時，台港背包客常在聊要不要申請二簽、或找到雇主願意sponsor工作

  簽證，再慢慢申請PR變公民。大多數背包客也曾像女主角一樣，想說是否就在澳洲留下吧

  ！在家鄉和異地間拉扯。


  不過看到女主角回到家鄉後的表現，我感到非常失望…。在我看來，女主角儼然是狡兔三

  窟的人生勝利組，愛情事業兩得意，把自己媽媽，兩個男人連同他們家人耍得團團轉，等

  著她最後對誰微笑…。我實在無法欣賞，只有我覺得真是個爛人嗎?只能想說她內心一定

  天人交戰，被大西洋兩岸來回拉扯吧…。


  女主角最後選擇回到異鄉，留老母獨自生活。這幾年對這開始感到感慨。爸媽耗費青春把

  孩子拉拔長大，孩子長大要往外闖時，爸媽也越來越衰老，越來越需孩子陪伴…。這是人

  類社會裡很難取得平衡的必然…。


  講點輕鬆的，我超愛每次女主角和房東、室友們在餐桌的對話。房東一直說不能說這個，

  又不能聊那個，那吃飯時到底能聊什麼啦(翻桌)XDDD 尤其愛看房東跟那兩個三八阿花室

  友的鬥嘴，看那兩個室友大笑我就好想笑!最後房東又在嫌她們倆輕浮，她們憋笑那幕更

  是逗趣。


  --'
