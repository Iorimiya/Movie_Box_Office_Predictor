title: '[訪問] 金城武：關於愛的事，金城武只願與他談'
content: '電影【喜歡你】的宣傳



  明星 ｜金城武：關於愛的事，金城武只願與他談



  金城武和陳可辛是一對相識十多年的好朋友，從《如果愛》到《喜歡你》，他們一起合作

  過四部電影。陳可辛說，為了拍金城武，他等了十年。在陳可辛面前，金城武也難得如此

  放鬆，開懷暢談了電影、工作、愛情等一系列話題。



  = 對談摘錄 =


  陳可辛：

  「電影好看就沒有邏輯的，電影是沒有邏輯的，因為電影的邏輯是情緒帶動的。

  看劇本的時候呢，是很難情緒帶動的。看劇本是用腦看的，但是看電影是用情緒看的。」



  金城武：

  「那但是同時有一個另外一個身份，就是叫做金城武。他們喜歡這個人，我現在

  會覺得這是一個大家做出來的一個image，我只是那時候莫名其妙的在這個殼子裡面，陪伴

  著他這樣，直到現在，我有這樣的感覺....所以我也不能辜負他。」




  電影【喜歡你】泡麵版預告 5/5 甜到爆炸




