url: https://www.ptt.cc/bbs/movie/M.1308621745.A.A3D.html
title: '[好雷] 關於愛情的碎片-戀夏500日'
content: "This is not a love story... this is a story about love.\n\n再沒有比這更貼切的句子來形容這部電影了。\n\
  \ (高畫質預告片)\n\n故事講述男主角Tom，生命中「擁有」女主角Summer的500天。經歷過暗戀、曖昧、熱戀、\n穩定、爭執、冷漠、破裂、悲傷、挽回、絕望、放下的500天。\n\
  \n導演巧妙的用時間序列跳來跳去的手法讓觀眾看到各個關鍵場面和其中的小細節，沒有把\n每件事情都說清楚，但被喚醒愛情記憶的我們會自動將他補完。然後赫然發現，那些愛情\n\
  的碎片原來仍刺在我們心中最柔軟的位置，從未消失，隨著劇情的跳躍而隱隱作痛著。\n\n\nTom的一舉一動那麼貼切地傳達出喜歡一個人的心情。經不住想要多瞧Summer幾眼卻又害\n\
  怕被發現，莫名其妙地認定對方和自己應該有特殊的默契，嘴裡說著不可能不在意心底卻\n暗潮洶湧，因為Summer和他的簡單互動就深深沉淪，又因為她無關緊要的一句話陷入自憐\n\
  自艾的哀傷，越是在乎她的每一個小動作和特徵，越是覺得自己渺小。\n\n與其說是Tom愛上Summer，不如說他是愛上迷戀Summer的感覺，所以他根本說不出口自己\n\
  的喜歡，在幻想的愛情世界越充滿劇情，跟現實的相處越難接縫吻和，而陷於消極被動，\n只怕心中的幻想破滅。Tom是個幸運的傢伙，他喜歡的女孩對他有興趣，在感情態度上也\n\
  成熟到願意主動(當Summer微醺著問Tom是否喜歡她時真是令人心跳不止，也讓我很想往這\n時候還要口是心非的Tom臉上打下去)，這段感情從萌芽之初就已經顯現出某些脆弱的預兆\n\
  ，當兩個人在一起，只有喜歡是遠遠不夠的。\n\n\n愛情，是讓兩個獨立的個體建立起最親密的連結。戀人們不只住進彼此的心房，也闖進彼\n此的生活和未來。在眾多童話故事、愛情電影的影響下，我們往往跟Tom一樣看到前者的\n\
  甜蜜，卻忽略後者的沉重。Summer卻是個能體會愛情之重的女人，所以她不相信愛情，更\n不輕易許諾愛情。她任性地想要將愛情的兩個本質拆開，只要兩個人相處時互相歸屬的開\n\
  心愉快，而撇開對彼此的要求和責任，就像Summer對她的黑色長髮一樣，珍愛至極，卻又\n能不帶感情地剪掉。\n\n但Summer高估了Tom，也高估了自己。Tom這個情場菜鳥，有不顧一切的熱情和浪漫，但也\n\
  盲目看不見未來，只要Summer待在他身邊就好，如果Summer能夠保持初衷，她可以輕易地\n掌控這樣的Tom，或許感情的保味期限會長很多。可是兩人相處的默契和歡愉讓Summer也\n\
  陷進去了，她對Tom打開心防，感受到這個男人對自己獨一無二的意義，於是對Tom產生期\n待，戰戰兢兢地一步步試探、忍耐，期待Tom能如他自己所說的一樣，給予她真正的愛情，\n\
  負責任地攜手走向共同的生活和未來。\n\n\n中職球迷說得好，正所謂「不期不待，不受傷害」，Summer一期待，Tom的缺陷就嶄露無\n遺。在現實中，Tom沒有追求自己想要生活的勇氣，只安於靠自己的小天賦受人誇讚待在\n\
  城市一角；在感情中，Tom處理不好自己的欠缺自信和情緒，更沒有餘力去顧及Summer細\n微的情感變化，他只能一貫地用自以為是的方式去愛Summer，從不改變。有太多小徵兆在\n\
  告訴我們，Summer是在乎的，可是Tom沒有辦法回應那種在乎。看完【畢業生】這部電影\n湧起對未來的徬徨不安，Tom說這只是電影阿；在酒吧Summer被陌生人搭訕時，一旁的Tom\n\
  光喝悶酒沒有動作，直到自己被挑釁後才有所回應，還要堅持這全是為了Summer；當\nSummer肯定他有建築天賦時，Tom卻開玩笑譁眾取寵，掩飾自己的不思進取。Tom成功了，\n\
  他的熱情讓Summer相信愛情，期待愛情；Tom卻也失敗了，他給不起這樣的愛情。於是某\n日，Summer離開了Tom，沒有解釋為什麼。難道我們還能說Summer是毫無理由，殘酷地拋\n\
  棄全心愛她的Tom嗎？她是愛了，但他沒辦法愛，才是分離的真正原因。\n\n已經相信愛情，願意承受愛情副作用的Summer很快找到新的對象並且結婚，這個角色從頭\n\
  到尾沒有出現，但相信他能給Summer她所期待的愛，不能保證就此永遠幸福、不受傷害，\n但那個敢在公園裡大喊「penis」的Summer一定不會害怕這場冒險。而看到婚戒絕望的Tom\n\
  ，杜絕了「the one」那種不切實際的想像，轉過身來檢視自己的生活，再也無法接受自\n以為是的工作和幻想，一陣混亂後，Tom也展開屬於自己全新的冒險。大膽辭去工作投身\n\
  夢想的行業，對Autumn的態度積極務實，不再等候命運安排，這樣的Tom迷人至極。\n\nSummer成功了，她的自信決絕讓Tom看見自己的缺失而成熟；Summer卻也失敗了，直到她\n\
  轉身遠離後，Tom才能成為她理想中的男人。在公園長椅重逢的那一幕分外令人感動。到\n了此時此刻，兩人真正能夠呼應彼此的情感，卻已錯過最佳的時機。於是Summer用戴著婚\n\
  戒的手輕撫Tom的手，而Tom叫住Summer給她一聲最真心的祝福。在愛情中，吸收彼此的養\n分，他們都更加完整，更懂得如何去愛。因為，他們是那麼認真深刻地愛過一次，痛過一\n\
  次。\n\n\n戀夏500日給我們零碎卻意外完整的愛情片段，伴隨著令人捨不得到心疼的遺憾，但這些\n都是愛情最真實迷人的樣貌，引得人心碎顛狂、如癡如醉，明知痛楚卻仍眷戀不已。\n\
  \n這是一段關於愛情的故事，讓所有愛情故事黯然失色的故事。\n\n--\n萬里江山千里路 紅塵喧囂 盡看破\n時光匆匆逝 彈指間今人亦古\n且閒散 但隱江湖 慣看夏雨冬陽秋月春風\n\
  一壺薄酒喜相逢 上自黃帝下溥儀 古今多少新鮮事\n盡付山光湖色底 漁翁樵父笑談中\n\n--\n◆ From: 111.240.230.201"
