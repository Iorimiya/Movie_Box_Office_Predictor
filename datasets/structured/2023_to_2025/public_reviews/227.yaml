url: https://www.ptt.cc/bbs/movie/M.1439834673.A.3B3.html
title: '[負雷] 進擊的巨人－－關於愛與成長的故事'
content: '其實這部電影沒有那麼不堪，只是要認清他的定位：


  這是個愛與成長的故事。


  這是一個講述了懵懂的愛情遭遇現實打擊之後，主角奮力拼博的故事。


  我們都有這種經驗吧，小時後心儀的女生，因為某些因素，可能是搬家、升學或者其他更

  無聊的瑣碎理由而分離，直到某一天你們再次相逢，卻發現一切都不一樣了，她的身邊已

  經有了另一個人－－但是在你傷心難過的時候，你又發現，不只是她變了，你其實也走過

  了一段沒有她參與的人生，她有了新的他，你也認識了新的她。


  差別只在於，拆散你們的，不是會冒煙的巨人。


  她身邊的那個人，不是個嬌情做作的大叔。


  你新認識的她不會趁你傷心難過的時候直接抓起你的手去摸她的奶。


  撇去這些無傷大雅的小細節不論，這還是個關於愛與成長的故事。


  因為到最後，你還是會發現，初戀的滋味難以割捨，小別終究勝新婚。


  可是你要怎麼辦呢？你缺席了她的人生，她有了新的他。


  現實的壓力又不放過你，儘管你奮力拼博，最後還是被無情的現實一口吞下（更別說這個

  努力的過程可能還要忍住羞恥求教於那個取代了你的他）


  這就是愛情，這就是人生啊。


  ＢＵＴ，人生還有個ＢＵＴ可以拯救你。


  －－只要你有個了不起的老爸。


  你可以失敗，沒有關係。最後那個老爸偷偷藏在你身體裡面，可以力抗所有現實問題的遺

  產終究會發揮作用，然後你帥氣變身，痛打那些長相醜陋看不起你的噁心上班族大叔。


  爽快發洩之後，妹子也如願回到你的身邊。


  很棒的結局，不是嗎？


  --



  臉書專頁：


  BLOGGER ：


  --'
