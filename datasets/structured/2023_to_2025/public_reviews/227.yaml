title: '[好雷] 練愛iNG -關於愛的每個樣子'
content: '以下有雷


  一開始是在阿ken上一些我有訂閱的youtuber 的影片宣傳聽到這部片，我記得他說：「這

  部電影每個人都可以看看，不管你會不會談戀愛。」


  我覺得這部電影很真摯。真摯的點在於，這個故事的過程與經歷都是真實的，甚至看完以

  後我想問：惠欣（紀培慧）跟魏宏仁（阿Ken）是不是真的在一起啊？


  每個選角都很恰如其分，不會像是硬要將各個大咖湊在一起而拍，我最喜歡應該是惠欣跟

  宏仁在夜店那段，一個伴舞一個對嘴，尤其惠欣亮眼的讓人捨不得移開目光！


  雖然動物園的猩猩讓我出戲了一下子，但我覺得裡面談到關於感情的事情都是我認同的，

  尤其寶嫂對宏仁說的：「我跟他在一起是因為我很開心，而且我知道這個人真的很愛我，

  光是這樣，我們就絕對值得在一起。」


  還有關於感情道歉這件事情好像很難，總是很難開口。明明就那麼抱歉，但還是沒辦法鼓

  起勇氣說出口。


  總之這部電影看完心情會很好很舒服，裡面的笑點都不會很尷尬，是真的會推薦別人去看

  。


  --

  我猜nwo大應該還沒看過這部？趁還沒下檔前去看看吧

  謝謝Mars文

  可能大家都有共鳴？

  QQ

  我弟跟我一起去看 他也覺受益良多哈哈

  真的 不要預設立場

  其實我覺得不錯欸 可能不合你胃口吧'
