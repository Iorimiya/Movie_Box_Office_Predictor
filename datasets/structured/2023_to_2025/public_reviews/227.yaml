url: https://www.ptt.cc/bbs/movie/M.1413547405.A.95E.html
title: '[轉錄]楊雅喆專欄／關於愛與希望及夢想起飛的故'
content: "娛樂重擊\n\n\n楊雅喆專欄／關於愛與希望及夢想起飛的故事\n\nBy 楊雅喆 on 2014-10-15\n\n「這幾年國片的起飛，以及中國大陸電影市場的崛起，華語電影的前景大有可為，我認\n\
  為要讓電影可以真正成為一個產業，要從根本做起，首先就是要提升編劇的待遇才會有\n好的品質」\n\n編劇，是一劇之本。\n\n他想起一部老港片，《南海十三郎》。十三郎是個傳奇編劇，能夠同時口述創作三個故\n\
  事，聽他口述抄寫劇本的人往往跟不上他的速度而叫苦連連。\n\n「編導、編導！什麼時候你聽過導演在編劇前面？」這是令他印象深刻不忘的台詞。\n\n旁邊的製片人夸夸其談。這已經是這半年他參加的第N場文創產業的座談，發言的是「\n\
  國片起飛」後崛起的製片大腕，官員助理勤做筆記的端正姿勢跟馬英九一樣有模有樣。\n\n會後，不免兩岸三地的影人來場紅酒晚宴，這位令人矚目的製片人設宴在自己的辦公室\n\
  內，請來的法（ㄈㄚˇ）國外燴餐點十分的迷人，佐上黑桃牌香檳更令人飄飄欲仙，製\n片人介紹起新收購的一幅春郊圖。\n\n那是一幅橫軸長畫，一群年輕男女在春日桃花樹下野宴，更遠的是兩男一女騎著三匹駿\n\
  馬往山林溪水奔去。\n\n「焦首朝朝還暮暮，煎心日日復年年。」\n\n製片人解釋著畫上的題字，原來是作畫的王爺思念自己早逝的妃子憶起年少時春日郊遊\n情景而留下的感慨。\n\
  \n「一場春日狩獵中發生了意外，作畫的王爺失去了他的摯友與妃子，所以他一生常伴青\n燈，終生未娶。」透過翻譯，讓外國友人紛紛感受到這幅名畫背後淒美的故事，「這幅\n\
  畫背後的故事讓畫的價值遠大於它的價格。」\n\n「但是有另外一則傳說，這場意外的製造者就是這個王爺。」他喝了酒忍不住多話：「\n摯友與妃子有了一腿，所以王爺設局謀害了這對狗男女。」\n\
  \n王爺留下的題字，也不過是日日夜夜良心不安的掩飾罷了。\n\n「焦首朝朝還暮暮，煎心日日復年年。」\n\n法（ㄈㄚˇ）國人搞不清楚狀況天真地問了：「那麼哪個傳說是真的呢？」\n\
  \n「我們都相信愛，我們相信正向能量。」製片人搶了話，「不是嗎？」\n\n這個慌亂的時局裡，沒有什麼比正向能量更重要的了。如此才能給世人一些心靈的安慰\n，何必管那些紛紛擾擾呢？所以最偉大的創作往往是可以激勵人心的作品。\n\
  \n他的手機傳來訊息，原來是和編劇朋友們約定的聚會被他給遺忘了。\n\n匆匆告辭之後轉往另個路邊熱炒場合，幾個編劇互相協助，因為他年紀稍長，總是要在\n劇本完成後請他幫忙看看給些意見，就像是當年互相指導的論文一樣。\n\
  \n其實這幾個朋友寫的東西也都能獨當一面，要他看看給個評語也就是希望同行能給個讚\n許，這樣或許被導演一再刪改劇本而受傷的心靈能找回自信。\n\n他自然曉得年輕人的心情，吉祥話多過了對於劇本的要求。誰知道氣氛熱烈熱炒吃完了\n\
  繼續叫來一箱台啤。眼看著電影產業欣欣向榮大家都有案子在接，百業蕭條中，電影也\n算是政治人物口中的黃金十年了。\n\n席中他們談起了近來的生活，也有些人被中國片商看上準備西進大賺人民幣，有關於對\n\
  岸「編劇老師」們可以拿的價碼如何驚人也都不是新聞。\n\n不過大家言語之中還是有些擔心，西進寫些符合審查的劇本，最後是否會忘了初衷。\n\n初衷是三小？審查又何妨？\n\
  \n有個已經拿了大獎的男生憤怒起來，他和同學合寫了劇本拍成電影，前年票房不俗，而\n且也大獲好評，然而\n\n「我們整整花了一年的時間寫劇本，」他猶豫著到底要不要說出那個數字。大家慫恿下\n\
  終於說了出來，「20萬，我們兩個忙了一整年。」\n\n那是一個號稱五千萬製作的電影，給的編劇費是，20萬。\n\n20萬兩個編劇分配，是什麼概念呢？是一個製作助理三個月的薪水而他們忙了一整年的\n\
  概念。\n\n一個編劇的薪水差不多是聽打字幕工作員的薪水。\n\n而那個製片人正巧是今天坐在他旁邊夸夸而談，談著要提升一劇之本待遇的那個人。\n\n他瞬間感到反胃，原來許多為了夢想掙扎的年輕人是這樣被作賤的。\n\
  \n其他的同學紛紛談起自己悲慘的遭遇：遲遲不簽約，簽了約又回頭說「打個八折吧！」\n或者從中國搬了大筆的預算回頭找台灣編劇改本，結果忙了半天，只值六萬。\n\n\
  「為什麼只付你六萬？」他開始翻找電話簿，想要傳最惡毒的髒話給那些人。\n\n年輕的編劇看到大家都生氣了，連忙用了另外一套說法：「因為，他們覺得這就是我工\n作天數的行情」（而不是一個劇本）。\n\
  \n「而且他還說，我們是替你圓夢」\n\n大家哄笑起來，能講出這種台詞的製片，怎麼不去當喜劇編劇呢？笑著流淚是喜劇的最\n上乘啊！\n\n西進要去賺人民幣的人大方的付了酒水錢，大家既是羨慕又是提醒的告別。他不想再說\n\
  什麼吉祥話了，獨自揮手叫了計程車，司機問他要去哪裡，他猶豫該回去香檳宴上還是\n回家去。\n\n電話響了，春郊圖製片打了電話來：「陳老師，今天您跟我說的那個事情」他從未\n\
  感受到「老師」二字所帶來的屈辱都在一個晚上發生。\n\n「什麼事？」他沒有好氣地回，知道是報的價碼製片想要砍價，但想給自己幾秒想賤話\n。\n\n「你知道，」雖然復興了，但是市場就是這麼小，「可以打個八折嗎？」\n\
  \n八折，七折，從三十年前他進這個行業起，不論是多少的價碼得到的回應，永遠是「打\n個X折可以嗎？」\n\n一個編劇一輩子能得到的回應，其實和泰國夜市兜售紀念品的小販也沒有兩樣。\n\
  \n「你兒子今年幾歲？」他突然這樣發問。\n\n「十六。」製片人一下子被他的氣勢唬住了。\n\n「他還可以活三十年？四十年？五十年？」無法抑制的惡毒台詞終於可以噴發在日常生\n\
  活中了。\n\n你希望你兒子以後的日子也打八折嗎？\n\n「老師，您喝多了，我們的社會，咳，需要多一點的正面能量，咳」\n\n正面能量，咳，正面能量，咳\n正面能量，咳，正面能量，咳\n\
  正面能量，咳，正面能量，咳\n\n他掛了電話，這幾句話還在腦中迴盪。\n\n被司機趕下了車吐完了黑桃牌香檳以及台啤的混和體，他反而有點過嗨了。\n\n編劇就是平常唯唯諾諾，屁都沒有的一群人，最後只敢把慾望、憤怒、抱怨，一股腦化\n\
  成台詞與動作的一群廢物而已。\n\n「你他媽的傻B啊，咳，這個字的潛台詞是什麼意思呢？你們不會接嗎？」\n\n像是訓示學生一樣對著空空的馬路，他以為他們還在眼前。\n\
  \n「咳這種潛台詞，不會嗎？」\n\n電視上的豬跟製片人一直咳一直咳讓他愈來愈憤怒。\n\n咳的潛台詞就是：「我呸！」啊！\n\n\n\n********************\n\
  \n\n楊雅喆\n\n楊雅喆，電影導演、編劇，作品包括《囧男孩》、《10+10》（〈唱歌男孩〉）、 《女\n朋友。男朋友》等，曾獲台北電影獎劇情長片最佳導演獎，以及金馬獎最佳導演、最佳\n\
  編導提名，亞太影展最佳編劇提名等。\n\n\n\n********************\n\n\nCOST DOWN 萬歲\n\n--\n        \
  \                           10/17 20:04"
