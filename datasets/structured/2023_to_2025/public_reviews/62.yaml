title: '[情報] 【琳達！琳達！4K數位修復版】預告'
content: '12.31《琳達！琳達！》4k數位修復版


  ★紀念上映20週年 重新與影迷相遇！

  ★從《琳達！琳達！》愛上韓國影后裴斗娜！

  ★開啟《孤獨搖滾！》《K-ON！輕音部》熱音動畫風潮！

  ★日本天團 The Blue Hearts 成名曲〈Linda Linda〉 熱血再現

  ★《去唱卡拉OK吧！》《深夜食堂》知名導演 山下敦弘 大銀幕成名作

  ★非凡人物樂團 The Smashing Pumpkins 吉他手 James Iha 配樂

  ★「21世紀最棒的日本電影之一」── IndieWire

  ★2005日本電影旬報年度十大


  【一部16歲搖滾，20歲沸騰，30歲感動的青春電影！】


  2004年，高中生活最後一次的文化祭就要開始了，原定要壓軸演出的女子樂團，卻面臨解

  散危機？！轉任吉他手的小惠，賭氣找來連日語都還說不好的韓國同學小宋擔任主唱。四

  名成員朝夕相處、密集訓練，決意要在校慶當天，賭上全力以赴的青春，表演八O年代 The

  Blue Hearts 名曲〈琳達！琳達！〉。 校園裡的風風火火，也讓熱血終於達到沸點……


  《琳達！琳達！》4K數位修復版 12.31 跨年與你相遇

  #琳達琳達 Linda #リンダリンダリンダ







