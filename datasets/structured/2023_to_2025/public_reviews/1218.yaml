title: '[新聞] 感恩節票房預測“星願”可能不敵飢餓遊'
content: '新聞網址：



  感恩節連假的票房預測有意料之外的發展，飢餓遊戲前傳有望與迪士尼星願競爭票房第一。

  業界預測“飢餓遊戲前傳：鳴鳥與游蛇之歌”將會在連假獲得約四千一百八十萬鎂的北美票

  房，有望超越“星願”預測的的四千萬鎂。

  雖然飢餓的四千四百萬鎂首週票房並不是特別出色，它最主要客群25歲以下女性（占37%觀

  眾）給該片平均93%的高評價，是該片票房續航力的主要動力，預計在週末結束前國內票房

  會達到九千八百萬鎂。


  迪士尼星願的Cinema score獲得A-，和冰雪奇緣2相同。觀眾平均給它71%的分數，但男性的

  評價高於女性（男80%女65%）。


  拿破崙則是預期會在五天連假獲得2千九百萬到3千3百萬鎂，Cinema score則獲得B-，低於G

  ucci: 豪門謀殺案的B+，此片觀眾男性為大宗佔了69%。


  -------------------

  更新：飢餓遊戲前傳已確定成為連假票房第一，預計連假結束國內可達一億鎂。

  星願又在被調降，連假票房預測落在3500-3800萬鎂。



  迪士尼竟會連飢餓遊戲次週票房都打不過，會不會有點太慘..'
