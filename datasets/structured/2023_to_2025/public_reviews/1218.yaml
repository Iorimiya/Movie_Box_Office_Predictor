title: '[新聞] 迪士尼《星願》票房差 連鎖戲院股價慘跌'
content: '迪士尼《星願》票房差 連鎖戲院股價慘跌


  2023/11/28 11:03




  迪士尼最新動畫《星願》北美首週末票房不如預期。（美聯社）


  〔娛樂頻道／綜合報導〕


  推出全新動畫鉅作《》（WISH），沒想到，美國於感恩節週搶先上映，

  ，甚至連連鎖電影院AMC的股價都受影響，掀起討論。




  《星願》背後製作預算高達2億美元。（美聯社）


  《》於北美感恩節的週末首映票房為1950萬美元（約新台幣6.1億元），上映首五天

  票房為3,170萬美元（約新台幣9.9億元），與預期的5000萬美元（約新台幣15.7億元）相

  差甚大，有網友分析，

  。




  網嘆迪士尼作為家庭娛樂正向品牌的聲譽將持續下降。（美聯社）


  值得一提的是，美國感恩節期間到訪戲院人數稀少，對連鎖戲院造成嚴重打擊，電影院AM

  C（AMC.US）的股價一下跌了2%；而《》的感恩節週末票房完全輸給2019年的《

  》所帶來的2.62億美元（約新台幣82億元），。



  新聞網址：






  2023 年是迪士尼自2014 年以來第一年沒有一部10 億美元的電影。


  --

  有魚人小美醜嗎？'
