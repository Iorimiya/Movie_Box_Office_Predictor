title: '[新聞] 星願票房口碑全翻車！迪士尼CEO 說重話'
content: "《星願》票房口碑全翻車！迪士尼CEO說重話：創作者忘記了首要工作是娛樂觀眾，不是\n推銷價值！\n\n\n\n今年慶祝迪士尼100周年，年末最後一檔壓軸大片《》（Wish）即將於12月29日在台\n\
  灣上映，配音卡司都打出一線陣容，中國版女主角找來劉亦菲、張靚穎演唱主題曲，台灣\n還待公布。\n\n不過這部原創迪士尼公主動畫新作早已於感恩節提早在美國上映，《》全球上映首周\n\
  票房竟只收入4900萬美元，成績甚至贏不過已經上映第二周的《\n》和歷史戰爭大片《》，跌破業界眼鏡。\n\n\n\n《星願》是迪士尼歡慶100周年的2023壓軸大片Photo\
  \ from Disney\n\n\n\n 《》上映前預告以2D手繪風融入3D的獨特效果備受期待，沒想到在美國開映之後，\n不只票房表現遠不如預期，就連美國媒體口碑都崩盤，影評網站爛番茄只有50%新鮮度，\n\
  好萊塢老字號媒體Variety給出50分不及格，並寫道：\n\n「\n\n？」\n\n電影雜誌Total Film則給出60分：「一個可愛又真摯的童話故事，卻不夠用心」\n\
  \n其他影評人則寫道：「作為迪士尼100周年的動畫電影，《星願》很快就會被世人遺忘。\n即使它擁有一群才華洋溢的配音陣容，迪士尼經典的歌曲和人物，但\n」\n\n\
  「我覺得《星願》是一個擁有值得挖掘的好故事，但迪士尼闡述的方法實在太可惜了這個\n人物塑造。」\n\n\n\n《星願》預告掀起許多觀眾期待Photo from\
  \ Twitter\n\n\n\n2023年毫無疑問對於迪士尼是重挫的一年，昔日引領好萊塢的漫威超級英雄從《》\n到《》都讓觀眾明顯感到疲乏不已，漫威今年唯二獲得廣大好評的作品只有《\n\
  》和影集《》，更驚人的是《》已經是今年迪士尼所有作\n品中最賣座的電影，全球票房竟然還沒有突破10億美元！\n\n讓迪士尼影視在100周年這一年顯得格外黯淡。\n\
  \n相較於公式對手華納兄弟影業今年就以《Barbie芭比》擊出全球14.41億美元驚人票房成\n績，還有極大規模的「粉紅」商業效應。\n\n\n\n由克里斯潘恩配音的《星願》羅薩斯王國的國王，守護著各地人們的願望Photo\
  \ from Dis\nney\n\n迪士尼CEO Bob Iger現在接受紐約時報和CNBC最新訪問，正面指出：\n\n「現在迪士尼的創作者們，好像都忘記了他們的工作首要目標應該是去娛樂觀眾，而不是\n\
  推銷訊息或價值觀。當然能向全世界傳遞價值觀的故事非常棒，但它不應該成為主要的工\n作目標。」\n\n曾經兩度進出迪士尼總裁的Bob Iger過去被給予相當高的評價，外界曾期待他成為拯救迪\n\
  士尼票房的救世主，現在他也強調迪士尼2024未來方針：\n\n「！」\n\n\n\n迪士尼年度動畫《星願》12月29日在台灣上映Photo from Disney\n\
  \n許多影迷聽了Bob Iger的最新發言都想問：「迪士尼這次真的清醒了嗎？」\n\n無論是迪士尼公主、漫威或是星際大戰等重量級IP，粉絲也希望迪士尼別再砸鍋，尤其是\n\
  迪士尼剛曝光不只即正在開發《》，\n！\n\n這也讓粉絲一則以喜一則以憂，希望迪士尼千萬別搞砸了21世紀最成功的動畫姊妹檔「\n」的原創故事。\n\n\n新聞網址：\n\
