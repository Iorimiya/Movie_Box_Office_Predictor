url: https://www.ptt.cc/bbs/movie/M.1517395065.A.DB6.html
title: '[討論] 為啥某些知名亞洲影星願意去好萊塢打醬油'
content: '前陣子看完<氣象戰>

  本以為吳彥祖的戲份會很多

  結果沒想到又是一個戲份不多的配角


  當然

  他比起冠希哥好上許多

  想當年<黑暗騎士>的冠希哥竟然只在電影裡露臉不到三秒


  如果我是冠希哥

  根本不會考慮去演好嗎??

  (要演也是演那個還有點戲份的會計師)


  說是為了錢嘛

  但是一個戲份根本不多的路人腳色

  好萊塢會凱到這種腳色給10萬美金以上的片酬??


  如果是為了名

  但是那種影薄到不行的戲份又能賺到啥名氣??


  若想吸引好萊塢片商的注意

  以換取未來更高的位置

  但是那種戲份怎麼可能??


  如果依冠希哥的身家地位

