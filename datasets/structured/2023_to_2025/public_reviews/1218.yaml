content: '迪士尼動畫電影《星願》公開中文主題曲音樂宣傳影片


  動畫（GNN 記者 Akito 報導） 2023-12-15 12:05:10


  迪士尼動畫《星願》，官方於今日公開了由王心凌演唱的同名中文主題曲音樂宣傳影片。




  為了慶祝迪士尼 100 週年所推出的動畫鉅作《星願》，藉由「向星空許下心願」的主題

  ，與粉絲一同展開一場美夢成真的旅程。被問到 2023 年完成的心願有什麼，心凌回答：

  「製作了新專輯，巡迴演唱會以及與迪士尼合作。」再問到 2024 年的心願是什麼，心凌

  更俏皮的回答：「再次與迪士尼合作！」




  「星願」歌詞中寫著「就像音樂改變了我，精彩我的生活，像河流不會迷惘，總是一直往

  前流，不會再回頭…..SO I MAKE THIS WISH 願望的聲音，不會停息」，王心凌用她溫柔

  堅定的聲線，唱出勇敢追夢，跟隨星星指引，努力前行的心聲。


  《星願》將在本月 29 日全台上映。




  --'
