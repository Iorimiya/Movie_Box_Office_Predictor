title: 'Re: [討論] 迪士尼星願看來不妙 - 巨雷'
content: '以下有巨雷與彩蛋 就是如此弱智 不想被雷請左轉



















  是的劇情就是如此弱智


  女主是國王學徒，一次許願大會上，國王不給女主爺爺實現願望，因為他說他願望是啓發

  後代（inspire future generations)。國王說這願望太寬鬆有可能會產生問題。所以給另

  一個大媽實現願望希望全國小孩都有新衣。女主因而對國王肚爛。


  女主私下許願 something more 一個星星天降（機械神勒？） 國王知道後去圖書管找尋著

  星星來歷擔心會對國家有害（合理）因為未知所以想要處理掉這星星。


  女主與朋友說服皇后對抗國王說因為這是虛假的繁榮，人民沒有自由意志（問號）

  ，皇后同意幫忙（問號），最後聯合全國人民一起許願放逐國王到一個魔鏡世界（問號）。


  彩蛋所有迪士尼公主出來暗示這是公主宇宙，國王變成日後的魔鏡（本來要接白雪公主吧）

  ，女主暗示為日後神仙教母（又洗黑）



  國王從頭到尾都是沒做錯什麼大事只想保護繁榮國家。沒反轉。


  片長不含彩蛋78分鐘，所以塞了歌舞後很趕沒鋪陳。


  --



  我也覺得是在反保守派

  克蘇魯反轉

  假設跟許願星許願發現是邪神造成問題後理解國王的謹慎理由後，與國王一起打倒邪神

  這樣的劇情會變神作，暗示保守與自由派要和作中庸。許願星邪神被關到鏡子變魔鏡也

  很合理。


  突然想到 同樣是許願星的劇情 鞋貓2的劇情他媽的屌打這100條街以上耶'
