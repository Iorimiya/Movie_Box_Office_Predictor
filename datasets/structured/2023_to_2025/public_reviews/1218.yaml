content: "現在負責老鼠動畫的 創意長Jeniffer Lee, 是冰雪1的編劇團之一，不過老鼠的編劇團很大\n，所以一個人影響還好。但在2就變成主寫手，後來升任創意長。其後有破壞王2，魔法滿屋\n\
  ，奇異，星願。\n\n冰雪2的反白人反殖民\n破壞王2 拉爾夫變成智障\n魔法滿屋的女性當家\n拉雅女力\n奇異lgbtqabcde\n星願的反威權反白男\n\n\
  這有一系列的脈絡可尋，她主導後的風格與敘事就整個偏掉。\n\n奇異與星願雙核爆，她如果還沒下台大概之後的冰雪3之類也不用太期待。\n\n跟盧卡斯的KK一樣，人家女生耶，無法被開除。\n\
  \n星願最噁爛的是把女主說成是整個迪士尼公主宇宙的神仙教母，把神仙教母洗黑真的是噁心\n操作。\n\n--\n\n\n\n                  \
