title: 'Re: [討論] 迪士尼還有片能爛過星願的嗎？'
content: '哇你居然自願去看這部！（我也看了……）



  看到這裡我就放心了，D 又氣走了一個。



  羊至少是他們家的……寵物？有感情的。



  因為它喜歡女主角，就這麼簡單。


  覺得幹怎麼可能嗎？


  因為他的原案大概是「星星化成帥哥」來與看顧已久的女主角相愛（或者一見鍾情）。


  後來硬改成幼兒感十足的調皮玩偶。



  其實中間有一段她跟殘障的一起翻書的時候有查是不是有還原的方法。


  只是她知道沒有以後就整個超級決絕的XD


  另外一個奇怪的地方就是，這本書……只要不直接觸碰，想怎麼讀都可以。


  那就弄個抄本不就好了XD



  用最善意的解釋來看這部：


  阿公 = Walt


  老白男 = CEO


  國民 = D 的員工


  阿霞 = 熱血新進動畫工作者（U18）


  願望 = 最想做的卡通


  實現願望可能是企劃通過吧。


  王后我不知道。


  羊在一壘(X)


  成為 D 的員工的動畫師都放棄了自己最想做的卡通，


  投入上頭要他們製作的動畫。


  他們大概是覺得自己做了一堆無法 inspire 人心的東西，


  想要搬出老 Walt 來 inspire 人心這樣。


  總之有這麼一說啦。


  --

  那是星星本星，算是星星王子吧。'
