title: '[新聞] 水行俠跨年檔億哥 星願稱霸新片'
content: "水行俠跨年檔億哥 星願稱霸新片\n\n2024/01/03 05:30\n\n\n《水行俠 失落王國》穩坐跨年檔冠軍，全台票房突破1.44億。（華納兄弟提供）\n\
  \n〔記者許世穎／台北報導〕2023年最後一個週末加上跨年檔票房出爐，12月29日於全台正\n式破億的《水行俠 失落王國》穩坐跨年檔冠軍，截至元旦全台票房正式突破1.44億。歡\n\
  慶迪士尼100周年的動畫《星願》則拿下新片冠軍，全台票房突破2448萬。\n\n\n迪士尼動畫新片《星願》在跨年檔勇奪新片票房冠軍。（迪士尼提供）\n\n由「甜茶」提摩西夏勒梅主演的《旺卡》在台上映近1個月，上週末拿下全台票房第3名，\n\
