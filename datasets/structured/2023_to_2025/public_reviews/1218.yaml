url: https://www.ptt.cc/bbs/movie/M.1700224025.A.E50.html
title: '[討論] 迪士尼星願看來不妙'
content: "底下有微雷\n\nReddit上今天看完口碑場的心得\n\nIt’s a hot garbage 一個垃圾\n\n整片在趕場，塞太多歌一個80分鐘的電影前25分鐘就塞了四首歌。也沒啥記憶點。\n\
  \n反派根本不是反派（這預告就有人提出這問題），原本運作好的願望機制因為女角自己的”\nfeeling”硬是要挑戰原本的制度，硬是把白男變成反派。衝突點等級就冰雪2那麼低能。\n\
  \n穿插整片的是無意義漫威等級對話與笑點，已經很短的電影插了一段2分鐘雞跳舞，但全程\n沒人笑。劇本等級跟拉雅差不多。\n\n老鼠的編劇真的死光了，這部再爆看還有啥藉口。\n\
  \n\n--\n                                      11/17 20:33"
