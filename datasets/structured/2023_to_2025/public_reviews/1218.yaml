title: 'Re: [討論] 北美票房哥吉拉第二週超越星願第二週'
content: '片商FB，

  應該算是暗示已經有準備了。


  我覺得真的不用猜那麼多理由，

  最有可能的還是上次2016年新哥吉拉的海外票房把代理商嚇死，所以集體都在觀望不敢馬上

  下手，

  新哥吉拉的海外票房只有全體票房的4%不到，這4%還有大半是美國的，

  台灣票房按照新聞首周只有250萬台幣不到，最後的數字可能還沒8位數，

  偏偏新哥吉拉當時藉庵野的名字搞不好代理費還不便宜……


  所以也不難理解這次片商遲遲不動手，大概就是想等北美票房有個概念再去談引進吧。






  對了，強烈建議最近想看哥吉拉消息少看B站跟貼吧。



  --



  --



  等實際上線就知道了，

  最近看一些被小粉紅牽著鼻子走的謠言有點煩。'
