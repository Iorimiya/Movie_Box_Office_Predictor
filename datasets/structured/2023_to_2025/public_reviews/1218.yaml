url: https://www.ptt.cc/bbs/movie/M.1704514211.A.558.html
title: '[普雷] 迪士尼《星願》差強人意的百年大作'
content: '因為小孩想看所以才去看

  我們是去林口三井的威秀


  以下簡單幾點心得：













  ——-


  1. 歌曲大致上都還不錯

  但我不太喜歡主題曲This Wish

  雖然副歌很好聽

  但其中有一段感覺塞太多歌詞進去

  又有很多忽高忽低的跳音

  聽起來不太順暢

  幸好主唱Ariana DeBose很厲害

  把他唱起來了

  但我個人認為這首歌沒有寫好


  2. 之前看到有人說

  不習慣這部採用的畫面質感

  我倒是覺得這種類似繪本的風格是個好的嘗試

  當年3D風格動畫剛出來時

  我也是不適應

  其實看了一段時間就會習慣

  對我來說不會影響觀影體驗


  3. 電影裡提到很多迪士尼以前的經典作品

  有些是直接提到(小鹿斑比等)

  有些是用暗示的(會講話的香菇-幻想曲)

  我個人覺得有時候有點太刻意

  不過不影響流暢度


  4. 之前看到網友說情節不合理

  我個人覺得還好

  因為劇中明確闡述國王因為童年陰影

  無法克服自己的恐懼

  所以最後走火入魔

  還拿魔棒指著髮妻的喉嚨

  我要是他老婆我也心寒


  況且國王確實是給了人民虛假的期盼

  也不能怪大家質疑他

  當國王也是要顧民意的


  5. 有一場戲是女主角跟朋友在地窖

  唱歌表達反抗的決心

  這一段我非常不喜歡

  因為一邊唱著要革命

  還一邊高興地敲敲打打

  實在是很違和

  而且其中有些場景的拍攝方式

  簡直就像樣板戲

  實在太不自然了

  我認為這一段的設計是失敗的


  總而言之

  我認為這部沒有達到迪士尼百年紀念大作的水準


  不過我家小孩看得很開心就是了

  說那顆星星超可愛

  (可是長得好像卡比)


  --'
