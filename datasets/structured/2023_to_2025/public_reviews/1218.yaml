title: '[好雷]  逆風推一下星願其實還不錯看'
content: '之前看到板上資訊已經知道大不推

  國外也是票房口碑都不佳

  但看在迪士尼100週年

  動物可愛

  還有主題曲我很喜歡的份上還是來看看




  以下微雷喔




  喜歡的點&心得：


  1. 這新畫風我覺得很強耶

  雖然很多人說融合失敗

  但我覺得很像繪本粉蠟筆風格可以如此3D化

  加上迪士尼描繪人物神情和動作細節還是很強

  我覺得非常厲害


  2. 主題曲好聽

  就是主題曲的副歌真的不錯

  配音的歌手聲音也很棒

  森林裡動物大合唱也好聽


  但其他歌曲說實在都有一種說不出的協調感

  特別是男主(反派)的歌都蠻 怪

  革命歌也不太好聽

  而且缺點是這次很多歌唱完

  角色會停在一個戰隊般的尷尬畫面

  這也太突兀


  3. 小星星可愛 動物可愛

  小星星真的超級可愛

  動物得到魔法也都好可愛 而且很有用

  最喜歡小兔子 小老鼠 小松鼠 小刺蝟他們

  迪士尼就是要有這些尖著嗓子的動物好可愛


  4. 雞那段真的好笑

  我們這一廳都是大人情侶笑得很開心


  5. 傳遞的理念還可以啦

  心願被收走等於忘記自己人生夢想

  這個概念是可以的

  國王怕自由意志太多動搖國本

  選擇用洗腦式的隱性威權統治也可以理解

  最後擊敗反派的方式還是蠻感人的

  在女主角引導下

  國民終於理解每一個自我都是閃閃發亮的星星

  一起勇敢的點亮星光反抗威權(???)

  突然疑惑編輯是不是台灣人

  連抓耙子的理由都是威權統治的犧牲品

  快選舉了不敢寫太多政治的聯想 哈哈


  覺得可惜的地方：


  1. 女主一開始有點自私

  我以為她一開始就是要偷回所有人的心願

  結果只偷自己家人的 搞屁啊XD


  2. 迪士尼永遠不給反派改過的機會

  既天外奇蹟我替反派抱屈之後

  我覺得這次的反派也很可惜

  如果最後王后可以用她對國王的愛

  用百姓對國王的信任

  喚醒國王的良知 讓他知道

  其實他可以勇敢的讓國民追求自己的心願

  豈不是更有教育意義？

  為什麼一個只有這件事走偏的國王

  不能被教育然後反省？然後皆大歡喜？

  (只有觀眾能被教育)



  總之結論是以迪士尼100週年紀念作來說

  花300多帶女朋友帶家人小孩去看

  我覺得還是推薦

  片尾一個一個經典角色出現喚起很多感動回憶

  也有很多新的歡樂

  小星星可愛 動物可愛 歌好聽

  個人跟女友都是給好評啦

  是一部能讓大家想向星星許下心願的作品


  --'
