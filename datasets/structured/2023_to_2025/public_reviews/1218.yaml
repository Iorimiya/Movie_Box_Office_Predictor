url: https://www.ptt.cc/bbs/movie/M.1701098556.A.520.html
title: '[新聞] 感恩節周末票房 迪士尼「星願」輸「飢餓'
content: '感恩節周末票房 迪士尼「星願」輸「飢餓遊戲」


  迪士尼100周年動畫電影「星願」(Wish)原本有望囊括感恩節周末電影票房，但根據26日

  的最新估計，票房冠軍由「飢餓遊戲：鳴鳥與游蛇之歌」(The Hunger Games: The

  Ballad of Songbirds and Snakes)拿下，「星願」和「拿破崙」(Napoleon)兩部熱門新

  片都未能擠下「飢餓遊戲」系列電影的前傳。


  「飢餓遊戲：鳴鳥與游蛇之歌」周末票房2880萬元，五天假期票房共4200萬元，該片上映

  兩周在國內的票房累計1億元，全球票房進帳2億元。


  第二名的位置競爭激烈，「拿破崙」以微弱優勢擊敗「星願」，這一傳奇人物史詩電影在

  五天周末的票房累計3250萬元，全球票房已累計7880萬元。


  「拿破崙」由奧斯卡影帝瓦昆菲尼克斯(Joaquin Phoenix)主演，凡妮莎寇比(Vanessa

  Kirby)飾演其妻約瑟芬·德·博阿爾內(Joséphine de Beauharnais)；影評褒貶不一，

  爛番茄的新鮮度為61%，CinemaScore的觀眾評分為B-。


  第三名的「星願」原本預期會有更亮眼的首映票房表現，迪士尼過去在感恩節推出的「冰

  雪奇緣2」 (Frozen II)、「無敵破壞王2：網路大暴走」 (Ralph Breaks the Internet)

  、「可可夜總會」(Coco)都有不錯的佳績，但「星願」卻不夠理想，五天票房為3170萬元

  ，全球票房進帳1730萬元。


  該片由「冰雪奇緣」導演珍妮佛·李(Jennifer Lee)、克里斯·巴克(Chris Buck)共同編

  導，亞莉安娜黛博塞(Ariana DeBose)、克里斯潘恩(Chris Pine)獻聲演出。


  影評對「星願」的反應並不熱烈，表示該片更像是一種行銷，而不是電影魔術，因此「星

  願」不僅沒有扭轉迪士尼跌宕起伏的一年，還加劇了近期令該公司頭痛的一些問題，包括

  表現糟糕的「驚奇隊長2」(The Marvels)。





  --'
