title: 'Re: [討論] 迪士尼星願看來不妙 - 巨雷'
content: '前面的劇透有一些錯誤，根據某些消息，星願的老白男真的蠻壞的，就好像賈伯斯沒

  有分我一半的財產，壓榨勞工賺那麼多錢一樣壞


  國王個性真的蠻橫，而且還會發出邪惡的笑聲，看不順眼的東西都想要消滅


  打倒國王的方式，就是國民一起唱歌就可以把國王的禁忌黑暗魔法直接幹掉了


  據說其實歌還蠻好聽的，還有蠻多好笑的梗，不比魔法滿屋和奇異冒險差


  目前爛番茄已經剩下51分了


  不知道老鼠到底是怎麼分配預算的，驚奇隊長和小美人魚都及格了，這部這麼慘


  然後我看以後迪士尼以後都要用暗黑兵法了，先放出一堆正確東西讓大家把期望降到

  谷底，然後看完覺得其實還不錯這樣


  --'
