url: https://www.ptt.cc/bbs/movie/M.1696599852.A.E08.html
title: '[新聞] 迪士尼百年大作《星願》反派是最大特色！'
content: '《冰雪奇緣》導演操刀迪士尼百年新作《星願》透露「克里斯潘恩」大反派是最大特色！




  迪士尼100周年紀念動畫《星願》（Wish）由《冰雪奇緣》系列的導演組合珍妮佛李（Jen

  nifer Lee）和克里斯巴克（Chris Buck）聯手打造。亞莉安娜黛博塞（Ariana DeBose）

  為本片全新公主「亞莎」配音，而人氣影星克里斯潘恩（Chris Pine）則為本片大反派「

  摩尼菲國王」配音。




  在倫敦電影節上，現任迪士尼創意總監的珍妮佛透露，《星願》電影最大的特色之一，就

  是探索這位反派的起源和成長。


  她稱讚表示，潘恩是飾演這位「邪惡國王」的最佳人選：「我們從來沒有這麼深入地去探

  索一個反派的旅程。而克里斯潘恩也為此做出了貢獻，因為他需要深入角色的情感核心。

  他是一個非常棒的合作夥伴。他很聰明，而且會唱歌，所以他每天都展現了越來越生動的

  熱情。」




  《星願》採用了2D和3D動畫技術相結合的方式，呈現出繽紛奇幻的世界。電影預計2023年

  11月22日在美國上映，12月29日在台灣上映。




  --'
