url: https://www.ptt.cc/bbs/movie/M.1712476571.A.CC2.html
title: '[討論] 迪士尼還有片能爛過星願的嗎？'
content: '假日無聊就看disney+


  想說星願 哇 迪士尼新的動畫電影 來看看好了


  防雷

















  看完真的是讓我嚇死了


  這到底是什麼史詩級的爛片


  這電影講白了根本就是  的故事



  老白男要決定誰的願望能不能實現是不應該 但也要你參加儀式吧


  說穿了就是一個願打一個願挨


  更扯的是這個老白男竟然還沒收國民租金


  幹0糧 根本德政吧 難怪大家那麼愛這個老白男 民意支持度我看99%



  結果這個黑女想當人家學徒 學徒沒當成開口沒幾句就要老白男實現阿公的願望


  對啦對啦 都人家欠你的


  黑女被老白男羞辱一頓以後 半夜許願便毫無理由的天降奇蹟 降下魔法星


  為了拉高這個老白男的觀眾仇恨值 毫無理由的直接被黑魔法書腐化


  便開始典型的3D動畫片追逐戰乒乒乓乓



  但星願最讓我感到不解的是 沒有任何人物塑造


  說真的我不知道為什麼女主角要有這幾個朋友


  而這些朋友的性格就像是套套模板產生出來的


  這也就罷了 女主旁邊的吉祥物小諾更是毫無討喜之處


  為什麼這些人要這麼幫女主？是有什麼共患難的精神與歷史嗎？有彼此諒解或理解嗎？


  沒有！


  好 要說大家都是多年交情也都是好人 那也就棒了


  我真搞不懂為什麼平白無故從天而降的許願星要這麼挺女主角？ why?????


  反正這動畫所有的困難與挑戰都不存在 許願就行了


  七龍珠至少還懂得便秘叫演一下 鏡頭抖一抖


  星願所有的問題都是機械降神解決的


  最後老白男吸取所有人願望以後 唱唱歌就沒事了 大家又突然很懂得願望的力量了



  最讓人不解的是這個皇后 我都搞不懂你到底是愛老白男還是不愛


  對於老公被黑魔法腐化無藥可救 接受之快 也毫無懊悔或悲傷的情緒


  結局馬上直接篡位還顯得很爽 我看這皇后肖想很久了吧 根本最大贏家




  最後阿公拿著樂器在街頭彈奏 說真的我是毫無感動


  幹0糧咧 你的願望那麼容易實現你們是在靠北什麼？？


  這到底是哪來的巨嬰國？看完不可思議我最同情的人竟然是老白男


  我是不是欠迪士尼教育？迪士尼是以後都要拍這種教育片嗎？


  --


  我倒是很希望有人能告訴我星願的劇情好在哪XD


  星願除了rendering比較屌跟彩蛋 我是真的看不到任何亮點



  我寧可他們直接套公式


  這部最大的問題是:


  將老白男塑造為一個年輕遭遇悲劇卻仍努力奮鬥建立王國提供人們安居樂業，但卻又


  有著極低的EQ，在與女主角相遇不到10分鐘唱唱歌就把自己的商業機密全盤托出


  但是劇組無法解釋為何這種「你情我願」的願望"信託"機制需要被摧毀

  ，所以只好強行安


  插一個能夠使人惡墮的黑魔法書



  我情願是把這個國王一開始就設計成為了吸收居民願望而營造騙局的邪惡巫師，也不


  要半吊子的設計兩種價值觀衝突

  然後連劇組自己都無法合理說明為何前


  者比較好，只是讓最後拿起樂器的阿公看起來像個小丑一樣



  更可笑的是，女主角伸張正義的方式也不是靠努力，而是不勞而獲地使用從天而降的神


  秘力量。國王是靠自學魔法才有今天的成就與地位，要是按公式，就算主人公是天才


  好歹也要像功夫熊貓一樣苦練一番才揭竿而起，但這坨屎不是，就是直接一顆星星啪地


  砸你臉上，我真的不知道這動畫片是要傳達什麼價值觀


  突然懂了 反諷的最高境界



  主要是訂閱給我家人讓他們打發時間的 我自己大多看N



  這部唯一看點 萬惡老白男唱歌'
