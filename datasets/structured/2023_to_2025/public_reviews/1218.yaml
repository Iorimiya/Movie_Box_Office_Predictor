url: https://www.ptt.cc/bbs/movie/M.1701853031.A.7BE.html
title: '[ 負雷]  星願'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  先上個票根防雷，在烏節路等另一半，想說有時間加減看個電影，結果看了坨屎！


  劇情：低幼到5歲以下才能夠忽略，不講之前大家討論的劇情，光是整個劇本銜接，太多

  解釋性對話，女主角發現國王不願意實現某些願望這件事情，跟家人講一次跟山羊講一次

  然後再跟同伴講一次，前面還要看你演一次。


  歌曲：無記憶點，算是迪士尼歌舞的下下作，女主角唱要許願類型的歌唱三首，國王的我

  很帥歌也唱兩首，唱歌都超級突兀。


  美術/畫面：畫面偏向灌籃高手的技術，灌高至少看個半小時能夠適應，星願到最後還是

  很突兀，美術部分更慘，劇中人物完全沒有一個人換衣服喔，更不要說冰雪一的形象變化

  。




  真心建議台灣上可以省點票錢


  --

  你就太年輕，計劃推翻國王那段，整個教育歌啊

  烏節路卲氏票價11塊

  大致可以這樣講，反派的手段跟動機都很薄弱，正派也是

  品質真的是公主系列算低的，不要說政治正確，連水準都很差'
