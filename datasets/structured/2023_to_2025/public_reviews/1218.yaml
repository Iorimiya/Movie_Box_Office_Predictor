url: https://www.ptt.cc/bbs/movie/M.1703993427.A.0D1.html
title: '[  雷] 星願電影劇透讀後感 - 演出比預期好看'
content: "雷文防雷資訊頁\n\n\n\n《星願》電影劇透與讀後感 - 演出比預期好看的動畫\n\n這部是2023年底播映的電影，為迪士尼成立滿100週年的紀念作品。描述一個17歲的少女\n\
  艾霞在羅莎王國向著一顆星星許願開始的故事。我當初看影評評價不高，票房也普通，再\n看看這個SJW人設擺滿的宣傳畫面，一直在糾結要不要進場看這電影，但是看了以後意外\n\
  地還不錯。本作沒什麼冷場，比想像中好看，也順便解釋了為什麼迪士尼動畫的吉祥物都\n會說話的設定。\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n\n宣傳照的艾霞看起來是個長髮髒辮的黑皮膚女孩，本來以為這個SJW人設擺滿的劇情會很\n難看，卻與想像中有很大的不同，艾霞因為是個會將關心他人放在優先順序的女孩，因而\n\
  被皇后看上而成為國王(薩尼菲)的學徒，身為國王學徒的艾霞發現國王會先挑選願望去實\n現願望，也就是有些願望一輩子也不會實現，因此女主角才會向國王提出要歸還國民的願\n\
  望的這一看法，艾霞一開始的念頭或許只是為了家人與朋友著想，後來因此引發一連串事\n件，最後成功解放了國民的願望。\n\n劇情和網路上的劇透差不多，宣傳畫面上的國王薩尼菲是本作反派，但他如何成為反派的\n\
  就比較少影評提到。劇情一開始國王是在一個荒蕪的小島以魔法組建一個王國，並且蓋了\n一個塔保存國民的願望，每個月實現一個國民的願望。保存願望這件事情也許能加強魔法\n\
  與保存魔法，這實際上就是烏托邦的翻版，由於國民的願望為私有物變成國家的東西，就\n有可能控制人們的行動，在劇中能控制情感，而且國王是個自戀類型的人，事情就慢慢地\n\
  走偏，就有點像死筆的夜神月，國王一開始或許是為了心中的理想，排除外敵而組建了這\n個國家，後來想法慢慢地變質，開始發現用禁忌魔法犧牲看似不重要的事情，例如本作國\n\
  民的不重要或不大可能實現的願望，就能得到更強的力量，後來進而去控制輿論、控制他\n人，以便於達到自己的目的，變成了一個自戀型反派。\n\n\n本作的編劇為珍妮佛·李、克里斯·巴克，曾做過冰雪奇緣。因此本作的反派也是很有意\n\
  思，本作的反派可說是史上最帥氣反派沒有之一。\n\n劇情的部份，影評普遍認為劇情有點老梗，轉折得有點快，怎麼人民唱一首歌就能打倒國\n王的禁忌魔法，有點老梗。至於觀眾會覺得比想像中好看的原因，我自己也是看宣傳照女\n\
  主角的樣子就以為這是SJW動畫之類的刻板印象，卻沒想到是對抗失控暴政體制的劇情，\n而且演出還不錯，看了影評覺得國王是反派一定是個大惡人，結果並不全是如此，皇后一\n\
  開始支持國王，後來加入反抗陣營，暴政也不是一開始就暴政，而是逐漸演變而來的，女\n主角是個真心會為朋友著想的人，因此朋友才會協助女主角對抗國王。\n\n真要說本作的缺點就是人物(女主角、星星)設計不大起眼，女主角就是第一眼看怎麼又是\n\
  樣版人物，個性就和同近年看到的迪士尼公主的樣版，同質性偏高。本作的主題曲看似中\n上，沒有說特別好聽，但卻是那種可以在一些反抗暴政體制下的場合演奏的主題曲(天啊\n\
  這主題曲原來是這樣的嗎)，這部電影也許初看不起眼，劇情卻比想像中好看，因為本作\n有好的演出，因此即使看了宣傳照，被劇透國王是反派，也是值得看的地方。\n\n\
  彩蛋的部份，女主角的七個朋友聽說是參考七矮人，森林裡動物唱歌本來就有很多致敬對\n象就不提了，國王的台詞也有彩蛋，這邊只是心得，就只能交給更專業童話系鄉民的分析\n\
  了。\n\n\n詳細文章連結：\n\n\n\n\n--\n          05/30 02:16\n\n--"
