url: https://www.ptt.cc/bbs/movie/M.1704574465.A.272.html
title: '[負雷] 星願'
content: "就是對星願的不滿。\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\
  \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n還是一樣先講點好話。\n\
  \n1. 首先是我覺得山羊挺可愛的。\n\n   跟木偶奇遇記的驢子很像，但是說話不說話的流程卻是反過來的XD\n\n2. 彩蛋爆幹多。但是這其實也是缺點，後述。\n\
  \n3. 畫面的畫風還有人物動起來的方式好看。\n\n   對，我對人物設計意見很大。後述。\n\n4. 歌其實好聽。但，後述。\n\n5. 致謝名單、片尾彩蛋很好很催淚。但直接播會更好。\n\
  \n   那堆 Disney 明星被用繁星勾勒出來的時候真的好感動。\n\n   片尾終於演奏出 When you wish upon a star 了，好感動，但。\n\
  \n6. 看豆瓣評論，看到對岸很多人感覺被戳到了X'D\n\n   其實我很五味雜陳。\n\n   就看到小粉紅被戳還蠻好笑的，可是這是因為把 Magnifico\
  \ 比作維尼……\n\n   然後他們覺得自己活在快樂的 Rosas……\n\n\n吃老鼠奶長大的我真的要斷奶了= =\n\n迪士尼百年之後，真的「百年之後」了嗎？\n\
  \n===生氣分隔線===\n\n\n上面幾乎所有優點我都加了但書……\n\n1. 先從彩蛋說起\n\n   我是認為彩蛋很妨礙觀影的那一邊。\n\n   致敬要有意義。\n\
  \n   看到一群人拖著長長的影子排路隊卻不是吹口哨回家，就怪怪的。\n\n   頭髮被風吹動翻飛，然後露出林梢星空卻沒看到星星點綴成的山貓臉的失落。\n\n\
  \   那套袍子直接逼我意識到神仙教母、\n\n   到處亂灑法術的星星讓人想起睡美人十六歲生日前夕的仙女棒混戰、\n\n   說著自己很乾淨的老鼠（這一點都不重要，而且事情明明很急）、\n\
  \n   書本一本本飛起來也讓我有梅林打包的既視感。\n\n   然後是 Magnifico 跟 Simon 則是反派集合，\n\n   壞皇后做變身藥、Maleficent\
  \ 對城堡下荊棘咒都出現了。\n\n   往低處瞄準發射法術子彈的烏蘇拉也有。\n\n   某程度上他的化學實驗室甚至讓我想到隔壁棚的神仙教母……\n\n  \
  \ 而 Simon 的戲份更過份。\n\n   他變身騎士的畫面怎麼看都有野獸變人的影子，\n\n   他化身 Magnifico 追捕阿霞的騎馬，停頓更是 Philip\
  \ 追愛的翻版。\n\n   只是上次他是被仙女棒幫助過關前往城堡，而這次是被仙女棒阻擋。\n\n   彩蛋這樣用的，我真的快氣死！！！！！\n\n   然後一想到「男主角」們近年來的待遇，更氣。這就故意的啊。\n\
  \n2. 我不討厭繪本風格，真的。\n\n   可是我覺得他們想得太天真了。\n\n   我只提一個我覺得違和感太重的地方：阿霞作為導遊登場的背景。\n\n \
  \  做成 2D 手繪風格≠背景不會動。\n\n   可是他們直接讓城門內的時間靜止？\n\n3. 女主角的無趣造型與無趣人設我已經快無力吐槽了。\n\n  \
  \ 首先大概又是一個反傳統的「Disney Princess」，\n\n   不是沒有皇室王室身份就是沒有「漂亮正裝」穿。\n\n   （對我來說，我真的很希望看到花木蘭能穿上三傻的宮女服讓我看看QQ\n\
  \n     漂亮正裝大概就是類似這樣的意思。相親那套真的不夠好看……）\n\n   至於黑皮、雀斑、髒辮還有御用側髮，我放棄了，要素過多。\n\n   然後個性跟行為也真的沒辦法讓我喜歡她，就一個自私鬼。\n\
  \n   在後面的劇情裡被國王通緝了，就想要推翻他。\n\n   還有在她每次說到「deserve」這個字的時候那副「嘴」「臉」真的醜。\n\n   當然更別提那七個據說是七矮人轉化成的朋友。\n\
  \n   人種各異是 Rosas 的設定沒錯，其實劇情裡面也有把七矮人的名號唸一遍，\n\n   但恕我直言，太廉價。\n\n   更何況這七個角色站出來，一直讓我想到那張\
  \ 2025 白雪公主的片場照……\n\n4. 到歌的段落嘍～\n\n   先說一下好幾首歌的共同問題：歌詞太滿，沒空去聽懂或看懂歌詞。\n\n   導遊歌：\n\
  \n       是很歡樂沒錯，也隱約在歌詞裡埋著「扭曲、心痛、遺忘」這些關鍵詞。\n\n       但是我聽第一次只覺得太急，我上 YT 補了好幾遍才知道在唱啥。\n\
  \n       不過畫面跟歌詞還是很搭的，這首只是聽一遍記不起來而已，沒有大缺點。\n\n   保護你：\n\n       不知道在幹麼的歌。\n\n  \
  \     不知道為什麼國王突然詩興大發想要唱唱保護你。\n\n       （聽說這首本來是阿霞跟星星王子的定情歌啦……）\n\n       好像一切都只是為了讓阿霞看到爺爺的願望而唱的。\n\
  \n       阿霞不惜犧牲一切都想要保護爺爺這樣。\n\n       我覺得這裡是黑國王的好地方，應該要讓觀眾看到國王偏執的點，\n\n       就是看到國王唱歌的對象是「王座」。\n\
  \n       但編劇讓我們看到的是一個愛民如子的國王。\n\n       雖然只是用他自己的方式去愛，但他的愛仍是真誠的。\n\n   主題曲：\n\n\
  \       我到後面才知道原來阿霞的願望是「與星星相連」。\n\n       這是什麼鬼願望？這跟她剛剛知道讓她痛苦的真相重擔有什麼關係？\n\n   \
  \    為什麼許了這個願望就可以讓他們有比「這個」更多的東西？\n\n       「這個」到底是什麼？更多的「東西」又是什麼？\n\n       這首明明就是一首很正能量、很激勵人心的歌。\n\
  \n       （即使我其實對每次都有強調自己被打壓那種顧影自憐的歌詞其實很感冒，\n\n         我還是覺得作為一首流行歌，是一首不錯的歌。\n\n\
  \         對，如果不是放在這個故事裡的話，是好的。）\n\n       可是卻單純留給我一堆問號，而且在我還在滿頭問號的時候……\n\n   我是星：\n\
  \n       這首給我更多問號的歌出現啦！\n\n       我完全不知道他們在唱什麼。\n\n       歌詞我是看得懂啦，但是我覺得這首「解答阿霞疑惑」的歌……\n\
  \n       只是給我更多疑惑而已啊哈哈XD\n\n       然後這首的彩蛋們也很干擾我，約翰熊跟斑比鹿很糟，\n\n       硬塞這兩個名字是怕我看不出來公鹿是致敬大王子、熊熊是致敬羅賓漢是不是？\n\
  \n       啊，對不起，我真的看不出來羅賓漢的影子。那隻比較像熊的傳說吧？\n\n       總之這首也是給人一種不知道哪裡搬來的歌的感覺。\n\n \
  \      其實有一種風之彩、We are one 的感覺，可是就沒有打到點上。\n\n       大概是畫虎不成的感覺吧。\n\n   王黑化：\n\n\
  \       這首被國外 YT 們批評得一文不值，但這首我給的評價最高！\n\n       輕快的曲風讓這首抱怨歌充滿一種濃濃的諷刺味道，加分。\n\n \
  \      除了垃圾話有點多，抱怨的內容實在很合理。\n\n       而且我聽越多遍，聽出的藍色窗簾越多，驚喜無限……\n\n       第一遍就是單純的劇情歌。\n\
  \n       第二遍則是我自己的心聲：「And this is the thanks I get?!」\n\n       提醒一下，這片北美是在感恩節連假上映的。\n\
  \n       把本片當成是迪士尼給粉絲的感謝函應該不過分。\n\n       可是看看他們到底給了我什麼……\n\n       第三遍我把國王想成 Walt\
  \ Disney，簡直貼切啊。\n\n       「See this kingdom? I built it up!\n\n         And you\
  \ still complain? Ungrateful much.」\n\n       抱怨 Walt 的東西太過時的人不就是 Ms. Weird 這類的人嗎？\n\
  \n       第四遍我才驚覺，原來 ungrateful much 的人是我自己！\n\n       這是迪士尼在抱怨我的抱怨！\n\n   雞跳舞：\n\
  \n       其實很可愛，音樂也好聽，畫面一看就知道在抄 Be our guest。\n\n       可是我真的很傻眼。\n\n       劇情有太多該被演出來而不是說出來的東西了，現在他們居然還塞這種段落？\n\
  \n   革命歌：\n\n       YT 上有、對岸也有不少人都說這首是迪士尼的 Do you hear the people sing。\n\n    \
  \   嗯……\n\n       我自己是覺得這首是第二首 The mob song。\n\n       看到這邊我終於明確感覺到阿霞其實是反派了……\n\n\
  \       總之阿霞說服人的方式跟 Gaston 沒兩樣。\n\n       歌聲真的好聽，但是我有先聽過 YT 宣傳版才去看，那個畫面內容就是很糟。\n\
  \n       我不是指線條、人物背景融合度、色彩搭配什麼之類的，\n\n       就是分鏡還有人物情緒那些，反正音樂跟畫面分離感很重。\n\n    \
  \   我最不喜歡的地方就是踩餅乾那邊還有星星抓著木桶被風吹起的畫面。\n\n       情緒被切分音嚴重打斷，還有那堆朋友突然就很義正詞嚴一起唱革命……\n\
  \n       雖然沒有到完全沒有鋪陳，但我覺得轉變有點太快，\n\n       特別是代表開心果跟害羞鬼的兩位怎麼突然不夠開心也不害羞了？\n\n   \
  \    喝湯歌裡面，七矮人可是用各自的風格在喝湯的啊！\n\n       難道被批評個性不顯眼的理由不就是因為沒把握住可以賦予個性的地方嗎？\n\n   主題曲再臨：\n\
  \n       只看這段的話其實還是很不錯的。只從這段開始看的話。\n\n       畢竟大場面的營造還是挺精彩的。\n\n       而且也不會知道前面阿霞有多機車、國王有多仁慈、王后有多無情無義。\n\
  \n   工作人員名單：\n\n       本作最佳片段，稱之為本體也不為過。\n\n       這種東西才叫做 100 週年紀念啊，迪士尼。\n\n  \
  \ 片尾彩蛋：\n\n       雖然是很棒沒錯。\n\n       但因為前面的爛彩蛋，連帶這邊的名聲也臭掉。\n\n       因為會讓我感覺到滿滿的消費感。\n\
  \n       也是單獨拉出來看會很感動的片段，記得單獨看。\n\n\n會給負雷最主要就還是因為迪士尼並沒有擺脫最近那種 SJW 說教的常見邏輯謬誤：\n\n\
  人種性別性向多元＝good movie，\n\n只要滿足前項，劇情邏輯就不用通順、人物設定就可以隨便。\n\n（我看到了一些設定稿，阿霞本來可以更漂亮，本來會有星星王子，還有反派夫妻檔！）\n\
  \n\n再來就是因為彩蛋踩我大雷！\n\n出戲我可以忍，但惡搞我喜歡的經典片段就該死。\n\n要惡搞怎麼不把公主全部嘲諷一遍？？？？？\n\n像是用看水井、袖子卸半臉妝表現自戀、\n\
  \n用摸針頭來獲取邪惡力量、召喚南瓜馬車追阿霞？\n\n或者讓反派在激流中划著獨木舟、煮秋葵湯之類的？\n\n--\n這也不是沒有鋪陳，可是後面那樣決絕真的很寒心。\n\
  他們特別的點在於覺得維尼被戳。\n不是臭國王的問題，小粉紅並沒有覺得敘事邏輯不妥，他們討厭的是「影射維尼」。\n也是少數讓我很想刷片尾的片。\n\n主題曲……應該是因為想要讓這首適合各種情境吧。\n\
  所以歌詞非常模稜兩可，可是這根本不是音樂劇的寫法。\n試想 A whole new world 裡面阿拉丁一直在說世界多美而不照顧茉莉，\n或者 Part of\
  \ your world 拿掉 feet、fire、burn、street、people know 這些詞。\n何必呢？\n剛剛看了一片 YT 分析，說得不錯：「看起來像是用\
  \ AI 寫的歌詞。」\n因為他知道歌曲的情緒，但不知道背後的故事。\n\n我想我知道我看彩蛋看到的問題是什麼了。\n這裡面的彩蛋……以前的片敢這樣用的話，絕對被嫌棄抄襲+原創不用心。\n\
  但這次他們就是放飛自我。\n\n歌詞的不知所云也可以從對作曲家的採訪看出來，她只知道主題而不知道劇情。"
