title: 'Re: [轉錄] 迪士尼"星願"首2日票房是"奇異冒險"近2倍'
content: '這部片比奇異冒險和看阿，一堆人不信


  我其實有一個強烈懷疑，這部片其實有偷偷進廠維修過

  因為這部片很早就拍好了，一直各種原因一直延期，所以偷偷重做其實沒人會發現

  反正新聞也不需要報導


  我懷疑的理由是:後期老白男反派突然變成惡霸真的很奇怪

  迪士尼的反派從來就是從頭壞到尾，像是早期小美人魚那樣

  或是漫威那種，壞人其實是好人

  很少有壞人本來沒那麼壞，後來莫名其妙越來越壞


  我合理懷疑內部試片有人看到公主在搞我們隔壁鄰居的，鬥爭那套

  發現大事不妙，緊急下令趕快把國王搞壞

  所以我們看到的可能其實已經被修正過了


  --

  冰雪的王子不蠻橫，做壞事情的時候還很優雅'
