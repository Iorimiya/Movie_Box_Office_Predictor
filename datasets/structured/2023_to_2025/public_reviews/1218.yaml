url: https://www.ptt.cc/bbs/movie/M.1704336688.A.846.html
title: '[負雷] 星願'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  看之前沒有特別去查這部的評價如何


  看完後越想越不對勁，去查評價還好不是只有我覺得有問題


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  首先講這部優點


  星星很可愛


  劇情裡的笑點都有讓我笑出來


  就這樣，沒有其他優點了



  角色造型設定與作畫倒是沒有特別想法



  再來講缺點


  歌曲的部分毫無記憶點


  以前的冰雪奇緣、魔髮奇緣、魔法滿屋、海洋奇緣


  都至少有一首歌會讓我印象深刻並事後上網查歌詞


  而這部看完，我幾乎不記得他們有唱過什麼


  唯一有記得的是國王唱自己被人民背棄那段吧



  國王的人設變來變去最讓我頭痛


  一開始把國王塑造成一位親民愛民


  把全部國民當作一家人的好國王


  可以理解他不實現某些願望的原因


  但他卻不還給人家願望？


  一個親民愛民的好國王，毫無理由瞬間變成自私的國王？


  Excuse me, WTF？



  女主招喚星星後國王人設又變了


  直接變得不相信自己的人民，利誘國民要大家去當抓耙子


  甚至還動用自己也知道不該碰觸的禁忌魔法


  欸不是，依前面的人設國王應該會跟國民詢問


  一起跟國民找出問題吧？


  直接用恐怖統治的方式去處理？？


  Excuse me, WTF?



  後面變成超級自戀狂也是讓我問號


  但我把他理解成碰觸禁忌魔法的副作用



  劇情也是很莫名


  因為國王不實現我們的願望又不還給我們願望


  走！我們一起推翻他！


  王后也會加入我們一起推翻國王！


  推翻成功！國王關到鏡子裡！王后繼位！


  呃...這鬼劇情是誰想出來的？



  中間我還期待大家會一起把國王導回正軌


  結果直接設定用了禁忌魔法就回不去了...


  真的覺得國王有夠可憐的...


  下次迪士尼的動畫我會先查過評價再去看= =...



  --'
