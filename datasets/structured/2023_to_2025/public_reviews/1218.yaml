url: https://www.ptt.cc/bbs/movie/M.1703912425.A.95A.html
title: '[ 負雷]  星願'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  畫面 滿分10 給6分

  感覺有努力想要用星星 希望 等元素 和光線投影 做出類似冰雪奇緣 冰宮城堡那般絢爛的畫面

  但因為斧鑿的痕跡真的很明顯

  最後呈現的效果就只感覺他們能力不足 但盡力的感覺


  歌曲 滿分10分 給4分

  曲調很複雜 沒辦法聽過幾次就有旋律在心中

  歌詞會讓人覺得腦袋空白 沒辦法理解角色想傳達的意思

  感覺知道他們在唱歌 但是不知道為什麼而唱 還有到底在表達些什麼情緒給觀眾


  劇本 滿分10 給4分

  大綱是主角努力讓居民們都重新獲得嘗試圓夢的機會


  夢想被保管的角色 只用好像生活失去了某件事 但是他們其實也沒深刻的感覺有什麼不妥 還是歌照唱 舞照跳


  夢想被粉碎的角色 都只是突然的哀傷起來 但是他們甚至不知道自己為何哀傷 劇中主角的媽媽只是說一句 我就是感覺哀傷來帶過


  國王沒有讓觀眾對於他認真保管人們夢想 避免他們因為心懷夢想 但無法實現而難受 這份理念有太多的共感


  至少回憶一段 他的過往 因為夢想無法實現 他當時有多痛苦 也許會讓觀眾更有共鳴 劇中只用一面角落被燒焦的旗幟來帶過


  國王崩壞的也很突兀 導演可能是想表現 國王辛苦為大家好 幫大家把不知不覺封存夢想 結果大家卻不領情 所以國王黑化

  但是國王幫大家保管夢想 劇情中不會感覺國王有多辛苦 都是揮之即來 實現居民夢想他也沒什麼困難 手一揮就實現了 完全感覺不出來 他不幫居民實現夢想到底有多深刻的理由

  劇情展現 國王保管夢想既不辛苦 實現夢想也不困難

  何來居民不領情 他有要黑化的必要

  如果國王每天都要榨取他的力量 才能保管夢想

  如果實現居民夢想會讓國王花費很多精力

  也許感覺國王真的用心良苦 卻沒人理解他 因而黑化也許更合理


  劇情中居民的夢想 也都是沒什麼大不了的小確幸

  並不像國王所說的會毀滅王國 和造成傷害

  最後呈現的就是 國王只是因為擔心 完成夢想 會動搖他的權威

  但其實他輕易的可以完成居民的夢想 對他只是舉手之勞 他反而能收穫更多的愛戴

  這就讓國王的動機變得很薄弱 和編劇硬要的感覺


  在國王動機薄弱的情況下

  主角的奮起 也沒辦法讓觀眾感覺 夢想真的很重要 不能被人剝奪保管 只會覺得尷尬 他們怎麼突然就奮起了


  節奏編排 滿分10 給4分

  劇情和歌曲的銜接也很生硬 沒有辦法被渲染 期待 失落 憤怒 或是 反抗奮起的感覺

  其中有一段動物們突然都會講話 並開始唱跳的部分 讓人覺得超尷尬

  然後母雞群 全體歌舞起來的部分 也是感覺非常硬要


  我的總結 大概是滿分10 給4.5分


  因為家裡小朋友(8歲)看完之後還是說覺得不錯看

  只能說如果不是劇情太讓大人出戲

  也許還是能讓小孩滿意的吧…

  雖然他看到一半好幾次都把頭埋到椅背上 我也不是很確定他真的有認真的在看…


  --'
