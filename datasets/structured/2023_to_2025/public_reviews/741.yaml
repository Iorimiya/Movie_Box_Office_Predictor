title: '[好雷] 樂一通大戰外星人：粉紅末日'
content: '太菲鴨與豬小弟，這對搭檔曾經是樂一通早期的招牌明星；雖然隨著兔巴哥的崛起，逐漸

  淡出了樂一通頭號招牌的行列，但幾十年下來仍舊擁有許多粉絲的愛戴；2024年最新登場

  的樂一通大戰外星人裡，再度與豬小弟聯手闖蕩這個瘋狂的樂一通世界；也讓觀眾首次看

  到，從未有的太菲鴨與豬小弟原創起源故事。




  樂一通大戰外星人的手繪動畫品質非常精良，在懷舊的情懷上，增添了現代創新；而在瘋

  狂的劇情裡，讓觀眾隨著太菲鴨奇怪的腦迴路，不斷著如雲霄飛車一樣上上下下，這樣瘋

  狂的樂一通世界，只有更狂的太菲鴨能駕；不過有些幽默的喜劇點，對於脫離童年已久的

  觀眾，的確火力是不太夠，但如果是小小觀眾，我想是絕對能夠讓他們的笑聲充滿了整個

  影廳，也是在這充滿血腥恐怖電影的萬聖檔期中，少數或是唯一推薦的親子電影，至少參

  與的試映場，小朋友們反應真的非常熱烈開心。




  在這原創的故事裡，我們可以看到以往樂一通角色比較不同的一面，例如太菲鴨往往被認

  為是自私的鴨設，但在此次的劇情裡，卻顛覆了觀眾的印象，雖然瘋狂依舊，但其中卻包

  裹著纖細體貼的心。


  劇情環繞在太菲鴨、豬小弟與豬小妹拯救地球的故事中，也剛好在萬聖節期間，劇情充滿

  了可愛的萬聖鬼魅風格，算是非常應景的風格氛圍；但最讓人意外的是某個台灣之光，卻

  成了劇情的關鍵，雖然新聞已經暴雷，但還是讓觀眾們可以親自進場看看，到底是哪個台

  灣之光，成為解救地球的秘密武器。


  雖然太菲鴨、豬小弟與豬小妹不斷出槌、搞笑，但三個臭皮匠，也許真的能拯救地球也說

  不定；成事不足，敗事有太菲鴨，加上2個豬隊友，這個樂一通世界太有趣了！




  樂一通對我而言是什麼存在？在國外度過的童年，除了一本翻到爛的哆啦A夢漫畫外，就

  屬樂一通能夠填補我的童年；也許樂一通大戰外星人對於成年人而言，一些幽默橋段有點

  火力不足，但卻是能讓人慢慢找回那時候的電視童年，那個跟隨著太菲鴨、豬小弟、兔巴

  哥與嗶嗶鳥等角色，一起把樂一通世界搞得天翻地覆的童年。




  中英文版都推薦，但更推薦中文版







  --'
