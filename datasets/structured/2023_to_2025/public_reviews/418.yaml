url: https://www.ptt.cc/bbs/movie/M.1744725119.A.FAA.html
title: '[微雷] 《器子》它其實不是復仇片呀～？'
content: '看完器子的第一個感覺

  我覺得整部電影其實講的是一段「以一切換取女兒未來的平靜」的故事


  ——你說它是復仇片嗎？

  我倒認為，器子本身更像是一封給親情、贖罪和人性掙扎的長信。


  故事本身既暴力且克制，

  導演沒有急著用反轉或狗血劇情來吸眼球，

  而是一層層堆疊。觀眾被關在主角的內心裡，和主角一起掙扎。


  這點我很喜歡，因為它不只是在演一個失去孩子的父親有多瘋狂，

  而是一步步讓我們理解他為什麼只能走這條路？


  我認為張孝全的詮釋是全片最大亮點。

  他演的不是一個「帥氣型復仇者」，

  而是一個每天都在壓抑、在懷疑自己、但最終只能一條路走到黑的普通人。

  他的情緒常常不是爆炸式的，而是壓得很低、幾乎不發聲，但那種痛是藏不住的。


  這部片讓我想了很久的一點是，

  如果「愛」這件事，當它跟「毀滅」綁在一起，還算不算愛呢？





  主角為了女兒做的選擇，從旁觀者角度來看，

  太極端也太絕對了，但如果你站在他的立場，

  那或許是唯一剩下的選擇了。


  在這麼絕望的故事裡，真的有沒有光明存在嗎？

  我覺得有的，只是那光不是來自結局，也不是的正義被伸張。

  這是私法正義，最終迎來的也不是所謂的真正的正義。


  器子是一部很壓抑的電影，但同時也充滿衝突。

  但我看到的一個人選擇不放棄愛，

  為了女兒不惜付出一切的可能性，即使他為此變成我們眼中的怪物。

  這份堅持本身，就是光明了。



  --

  選張孝全來演真的是選對了，如果不是他 我想不到還有誰可以撐得起那個氣場'
