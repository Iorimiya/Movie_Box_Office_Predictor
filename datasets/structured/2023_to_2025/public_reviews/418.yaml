url: https://www.ptt.cc/bbs/movie/M.1744376508.A.197.html
title: '[好雷]《器子》最熟悉的陌生人'
content: '(以下有雷)


  在本片看到張孝全跟李沐的搭配，不由得讓人想起他們在《誰是被害者》裡面演的父女檔

  ，這次也不例外，不過兩個角色的個性都跟劇作相去甚遠。甚至在劇情的編排上，他們雖

  然是父女，但是相處的時間其實相當短暫。李沐本來在劇中呈現的角色是接受張孝全女兒

  活摘器官的富家女孩，對張孝全來說是仇人之一。沒想到在復仇的過程中，發現自己的女

  兒居然還沒有死，而是被養在器官買家中，等著「養」到一定的歲數才要強摘心臟的人畜

  。到這裡已可看出本片所呈現的社會黑暗面是頗為與眾不同。


  我想探討的是，在這「仇人」跟「親生女兒」角色的轉換期，其實在劇中是非常短暫的，

  主角是豁出一切想要報仇，所以各種非法的施虐手段，甚至取人性命，都已經在他的計畫

  當中。但當發現自己想復仇的對象其實是自己一直想要重逢並保護的人，這件事不但對觀

  眾心裡造成衝擊，對角色的內心轉折更是無比的艱難。




  我們可以看到李沐在戲中呈現的徬徨，從小依靠的父親及好友，居然是要強取自己心臟的

  惡魔，對於自己的親生父親原來是打壞自己完美生活的惡徒，她的心路歷程其實很難拿捏

  ，在她有限的出場時間內，心情如斷崖式的轉變，我覺得可能在一開始她缺乏了一點嬌生

  慣養的驕氣，以致後來心情轉變並不是很明顯，但這應該是非戰之罪，畢竟本片的戲份絕

  大部分還是壓在主角身上。




  在張孝全的部份，我們能看到兩人的陌生感就是他在車上錄製的告別獨白，我認為安排這

  場戲算是別有用心，像前面提到的，他跟女兒其實並不相識，但自小孩被偷走乃至坐牢的

  十年間，他心心念念的復仇動機，卻活生生的出現在他眼前。但這時候他已經成為了復仇

  機器，對其中涉案的人，即使是居中介紹的人都毫無憐憫之心，論「惡」的程度，他已經

  變成自己在當棒球教練時無法想像的暴力狂徒。


  也因此，就算自己的女兒還活著，他也用盡一切將她救出恐怖的社會黑暗角落，他知道自

  己做的這一切還是要付出代價的，他不確定自己還有沒有能力去給予女兒正常的生活，他

  只能在最後一博之前，用錄影機向她交代一切的真相，畢竟，就像他自己說的，他們是「

  世界上最親的人，卻也是最陌生的人」，張其茂是被復仇吞噬一切的人，而在他心中，這

  個人並不適合陪著女兒繼續長大，他只能完成自己的任務，並付出對等的代價，他早就是

  死過一次的人了，知道女兒還活著並且有人照顧，對他來說已經是最好的遺願，但也對自

  己生死不待相見的親人以及觀眾，留下了滿滿的惆悵。


  --


  張孝全的演技自然不用質疑，他這次轉變成打戲猛男出乎我意料之外



  我個人覺得就是器官買賣的黑道，斷後路



  我覺得比例算不錯！'
