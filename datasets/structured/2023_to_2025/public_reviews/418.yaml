url: https://www.ptt.cc/bbs/movie/M.1745281250.A.954.html
title: '[ 負雷] 器子'
content: '純就劇本設定來說，

  這部戲的「上限」非常高，

  聳動、痛快、懸疑、反轉、感人……

  好電影的要素幾乎都湊齊了。


  但偏偏，

  不知道怎麼回事，

  廚師把和牛這麼好的食材，

  做成了大便口味的珍珠奶茶，

  真的爛到超乎想像的爛。


  如果這個劇本，

  可以重新好好架構，

  給韓國他們去翻拍的話，

  應該會成為另一部暴力經典，

  可惜……

  真的可惜了……





