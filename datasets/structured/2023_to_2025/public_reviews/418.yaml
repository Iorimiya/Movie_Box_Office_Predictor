url: https://www.ptt.cc/bbs/movie/M.1744744621.A.F2E.html
title: '[偏好雷] 器子，好在有張孝全'
content: '今天去看了這部片

  真的我看完

  我覺得整部最值得看就是張孝全

  打戲開無雙雖然很扯

  但看了真的很爽

  角色本身也是鋪陳的很完整

  張孝全就很適合這種壓抑便秘臉的狠角色


  其他的

  我很多片段看了就是滿頭問號

  應該說就是國片的老毛病

  題材很好演員很棒

  想要探討的也很多

  可是劇情的編排節奏沒有掌握好

  很多地方情緒或是劇情都沒有鋪陳到位


  像女兒算是很可惜的一部分

  李沐的角色我期待的是

  女兒知道真相後的掙扎糾結

  最後做出自己的選擇

  但實際上演出

  知道真相後反派很快就撕破臉

  後面就變成看直播的立牌毫無作用

  缺少了中間糾結

  最後一章的眼淚變得很刻意不知所以

  也白費的演員的演技


  警察臥底的毫無鋪陳

  孤兒院復仇者聯盟的莫名其妙集結鏡頭

  但大部分人後面都毫無作用


  這部基本上我覺得

  就是去看張孝全還有動作打戲跟刑求虐殺畫面

  還算是值得在電影院大螢幕看過一次的吧

  -----

  Sent from JPTT on my iPhone


  --'
