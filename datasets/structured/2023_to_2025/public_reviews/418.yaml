  命中註定那頭鵝還是拿補助的

  請問這樣子該跟納稅人道歉嗎

  器子 你們對得起電影產業

  對得起我們還傻傻支持國片的觀眾嗎


  我得說 如果連我都有天不願意進場了

  國片就真的沒有人看了

  請有才氣和認真的人 快快拍一部片子來滋養

  讓國片還有一口氣 留一個出路吧



