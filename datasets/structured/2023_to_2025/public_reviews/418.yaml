url: https://www.ptt.cc/bbs/movie/M.1743508056.A.0E0.html
title: '[微雷] 《器子》｜如果是你，你能走多遠？'
content: '這部好像蠻多特映場？

  幸運好某場有報名到就先看看了


  這部電影，真的是第一個鏡頭就讓我心裡揪了一下。

  加上主演是張孝全+李沐，

  這個組合基調很難不讓我想到「誰是被害者」的經典組合。


  以下防雷








  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  故事是使用半倒敘的方式呈現，


  男主角張其茂剛出獄，

  他第一件事不是喘口氣，更不是找工作，彌補空白的人生。


  他馬上投入找女兒的行動。

  雖然女兒失蹤是十多年前的事情，但即便女兒可能已經死亡，他還是想要找到女兒的去處

  。


  而且不是那種「慢慢來」的尋人之路，

  這部電影，本質上，像發了狂一樣，一邊查線索，一邊砸人、一邊砍人。


  他整個人像失控的野獸，但你又無法怪他。

  在他的視角中，他女兒被活摘器官了。


  那一些被活摘器官的孩子們。

  被稱之為「器子」，聽起來很殘忍，但整部片最殘忍的不是那些血腥畫面，而是他心裡的

  那種「明知道回不去了，但還是要衝到底」的絕望。


  整部片讓我一直在想一件事

  ——如果是我，為了救最重要的人，我願意犧牲什麼？


  是金錢？

  是自由？

  還是整個人生？

  甚至是，變成一個我原本最討厭的樣子？



  張其茂的選擇絕對不漂亮，

  他不是什麼完美英雄。

  但他很真。他沒有退路，沒有依靠，

  連警察、醫院、社會都像在看笑話，

  他只剩一個念頭：我要把女兒救回來。


  這不只是動作爽片，也不是單純的復仇故事。

  它其實講的就是「愛」，和誰是被害者一樣，討論的都是「愛」這個主題，但那種愛已經

  不是溫柔的，而是狼狽的、瘋狂的、會讓人崩潰到瀕臨壞掉的那種愛。



  我好像可以能理解張其茂的選擇，

  但是如果今天換成是你，自己的親人遭遇這種事，你會走到哪一步？


  怎麼做會比較好呢？


  --

  誰是被害者既視感太重了XD

  我覺得每一次他都很認真去

  但這一次特別凶沒錯，整個全程打好打滿

  滿震撼的'
