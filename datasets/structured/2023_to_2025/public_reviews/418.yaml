title: '[普雷] 器子'
content: '整部片用剪接方式埋伏筆跟轉折

  救了張從頭到尾的一號表情

  開頭喪妻、中間復仇虐殺、後面悔恨（應該是吧）

  很多地方表情都差不多…


  整部片亮點在後面劇情翻轉

  這點倒是沒有預料到

  剩下的主角無敵跟反派弱智就算了

  主要還是要表達器官販賣產業鏈

  並不是少數人就能完成

  而且有錢真的是萬能

  至於虐殺部份很有奪魂鋸感覺

  只差沒在直播時說出play a game


  裡面有幾位八點檔常見演員

  被打成豬頭又被電的謝承均…如果沒有天台那段戲根本看不出是他演的

  還有串場的王金虎似乎是幕後主使！？

  但沒有特別交代這角色後續(難道有續集？）

  扮演協力者的棒球隊成員有本土歌手

  只認得頑童、陳零九….其他我不熟


  整部不難看

  但最後一章很拖

  標題是贖罪但看不出是要贖什麼罪

  嬰兒被偷？虐殺一堆人（但沒殺掉）？沒辦法陪女兒長大？（沒死不是很好嗎），這裡很難理解導演想表達什麼就是了…


  最後我只覺得

  發現真相時閨蜜的表情真的很綠茶婊

  一副就是我是婊子來打我啊笨蛋

  那臉真的超欠打的～



  -----

  Sent from JPTT on my iPhone


  --'
