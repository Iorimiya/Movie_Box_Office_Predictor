title: '[新聞] 《器子》暴力張孝全上線 私刑教育敵人賞釘'
content: "暴力張孝全上線　私刑教育敵人賞釘槍射手\n\n\n外型看來溫和樸實的「國民老公」張孝全，在新片《器子》成為「最強老爸」，為了復仇\n做出一連串殘暴驚悚的反擊。包括用鋼筋插腿、釘槍射手掌、塑膠袋套頭、浸水滅頂、電\n\
  椅刑求，他還自嘲：「會不會看起來很變態？」\n\n《器子》釋出前導預告，張孝全以銳利剪刀揮抵敵手的脖子逼供，使出各種刑求招數，例\n如把目標綁在電椅上、拿出尖銳鋼筋準備插腿、釘槍瞄準身體、用塑膠袋套頭、甚至把人\n\
  整個浸到水裡，招招凶狠無比。張孝全坦言，拍攝前有與導演簡學彬進行充分的溝通討論\n，導演和編劇設計的刑偵內容，配合鏡頭呈現出來都效果十足。\n\n片中張孝全為了妻女展開復仇追查，有場戲他單槍匹馬以一根球棒對抗十個人，強悍飛踢\n\
  、猛勁揮砍，預期將有更多痛感強烈的動作場面，也因此他在拍這部片時發生意外，導致\n胸椎骨折，靜養了好一陣子才復拍。\n\n張孝全透露：「開拍前做了非常多的訓練，動作訓練每次至少都2到3個小時，練習的時間\n\
  非常長，而且這次的訓練也有特別模擬現場環境和所有道具，擬真的訓練方式雖然過程辛\n苦，但實際拍攝時就覺得一切都值得。」\n\n李沐和婁峻碩也各自上演了驚險場面。婁峻碩手持電擊棒，李沐則是雙手緊握利刃，步步\n\
  後退。雖然目前僅只出現短暫畫面，卻已引來各方粉絲及影迷們的高度關注。\n--------------------------------------------------------------------\n\
  \n《器子》前導預告  \n\n領銜主演｜張孝全 李沐 婁峻碩 尹昭德 薛仕凌 小春 黃健瑋 程雅晨\n\n特別演出｜吳承洋 陳零九 大淵 林鶴軒 吳翔震 賴晏駒\
  \ 邱鋒澤 游書庭 潘君侖 梁瀚名\n\n\n\n\n--"
