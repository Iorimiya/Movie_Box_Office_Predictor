title: '[新聞] 台灣電影《器子》演繹最強老爸！5大看點'
content: '新聞網址：


  張孝全打擊活摘器官非法集團！台灣電影《器子》演繹最強老爸！5大看點全都錄



  【文 / 黑色馬卡龍】賣座電影《可不可以，你也剛好喜歡我》導演簡學彬挑戰復仇類型

  片《器子》由張孝全、李沐所主演，該片即將於 4/11（五）上映，故事描述張孝全所飾

  演的棒球教練女兒被抓去當活摘器官非自願捐贈者，雖非國有器官，但非法集團看上的，

  不是女兒的「嬰兒腎」而是嬰兒心臟！事隔多年張孝全追查到「女兒的心臟正在李沐身上

  跳動」，接下來他將展開最暴力的復仇地獄之路！



  《器子》中，張孝全（右）與林映唯經歷生死離別。（華映娛樂提供）


  作為「 2025 上半年最用力台灣電影」，本文整理出《器子》5 大亮眼看點，走過路過不

  要錯過。


  《器子》看點1：張孝全緊咬活摘器官非法集團、以命相搏！


  張孝全在電影裡飾演的棒球教練，不但女兒被偷、老婆自殺，後來還被栽贓入獄！出獄後

  他不放棄要查出偷走女兒的幕後活摘器官集團，使出所有手段、就算以命相搏也要將惡人

  逮住！而「台版地表最強老爸」也不是喊假的，片中張孝全有打人戲和被打戲、虐人戲與

  被虐戲也全都來，展現父愛不遺餘力！




  《器子》看點2：卡司超豪華！2025上半年最亮眼台灣電影


  主演群包括張孝全、李沐、婁峻碩、薛仕凌與小春等，在加碼「五堅情」陳零九、賴晏駒

  、邱鋒澤，「頑童MJ116」大淵與黃健瑋、尹昭德、游安順、于子育、李杏、陳妤、林映

  唯、林鶴軒（大鶴）、謝承均等演員助陣，堪稱2025卡司最壯大亮眼的台灣電影。



  《器子》華映娛樂提供


  其中，薛仕凌所飾演的警察「很有戲」，有望為他搶得今年台北電影獎的最佳男配角獎入

  圍席次。為了《器子》，張孝全與薛仕凌事前做了大量訓練和排演，兩位演員都有跟專業

  的動作指導演練過，算是以武會友。演出這類動作爽片也讓演員演出時腎上腺素大飆升，

  值得大家期待！



  謝承均（右）為《器子》犧牲超大，險些無法呼吸。（圖／華映提供）


  《器子》看點3：虐殺橋段好痛又好美？！


  《器子》電影很重口味，令人印象深刻的有尹昭德所飾演的富豪被張孝全抓去拿釘槍釘手

  掌！究竟兩人誰是專屬天使老爸？誰又是來自地獄的索命使者？一切實在太謎樣！



  《器子》華映娛樂提供


  另，謝承均則是被綁在電椅上、電到冒煙！還有李杏被水刑，各種刑求戲。除了一開始兇

  殘制裁手法很嚇人，後頭還有奪命勒脖戲和激烈槍戰，也很觸目驚心。奇特的是，這些虐

  殺橋段雖然看起來都好痛，但是攝影又將這些慘絕人寰的情節拍得很美，有種微妙的反差

  衝突感，可見攝影對於暴力美學有所追求。



  《器子》李杏慘遭張孝全刑虐。（圖／華映提供）


  《器子》看點4：劇情峰迴路轉難以預料


  為了讓觀眾享受到與張孝全同樣的沈浸式殘酷人生體驗，《器子》隨著張孝全（非全知）

  視角一路追查非法活摘器官集團的營運方式，從對接者的基層逐漸查到幕後大老闆！而最

  後的真相真是令人驚呆了！劇情峰迴路轉難以預料，電影不看到最後，不會知道最後真相

  ！



  《器子》黃禮豐被關進水牢。（圖／華映提供）



  《器子》看點5：簡學彬導演十年磨一劍！


  《器子》可說是《可不可以，你也剛好喜歡我》導演簡學彬十年磨一劍的嘔心瀝血之作，

  為了為國片帶來商業娛樂類型的新鮮感，簡學彬做出像程偉豪導演拍《目擊者》時所做的

  類型呈現和文本設計嘗試，期望為台灣國片的未來開闢新出口。



  《器子》華映娛樂提供


  該片日前宣布風光入圍義大利烏迪內遠東國際影展（FEFF），電影氣勢愈燒愈旺，即將於

  11日上映，全台共97家戲院同步揭曉犯罪真相！



  《器子》華映娛樂提供


  -


  補個《器子》前導預告




  感覺還可以？

  前幾天也有看到其他報導，

  像是張孝全為了拍動作戲提前兩個月開始訓練，

  還有他說角色那種「壓抑到極致的父親情緒」

  讓他拍完也很難抽離，這部應該不只是動作爽片而已


  預告片其實就復仇＋懸疑＋親情的綜合體，

  那種「一個人對抗整個系統」的設定蠻對我的胃口。


  個人非常喜歡張孝全的作品，但怎麼感覺他近期作品不太多？


  --

  對 就是因為這個主題

  所以我才覺得可以去電影院看一下

  這組合就很容易讓人想到這部= =

  主角沒有很神啊XD 棒球隊才神

  對 真心覺得猛

  拍攝的部分我比較有疑義的是

  很多場景對我來說太暗 但是可以理解導演的選擇

  台片不能和歐美大片比 以台片角度來說 這部票房應該還可以

  沒那麼慘吧 你看過更多台片就會覺得這部其實可以'
