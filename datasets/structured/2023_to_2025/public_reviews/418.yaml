url: https://www.ptt.cc/bbs/movie/M.1745163999.A.3F1.html
title: '[好雷] 器子'
content: '雷文防雷資訊頁










  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~








  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  劇情簡單不複雜

  但在某些地方交代的不清楚還是會讓人疑惑

  像是：

  孤兒院院長意外死了，被主角埋起來就沒後續

  片尾殺掉徐元哲父女的人是誰？



  看似龐大的犯罪集團在棒球隊面前幾乎不堪一擊(棒球隊組織根本是殺人者購物中心)

  整部劇就看主角威能和無敵棒球隊

  陳祖烈、徐元哲在片中看起來都是被主角輕鬆擄走

  最重要的換心手術竟然一堆人也打不贏主角

  徐元哲家裡也幾乎沒什麼防衛(剛被擄走回來竟然也沒警察站崗巡查一下)


  不過徐元哲父女最後朝著李沐的樣子想起來還是很驚悚

  還有佳佳抱著李沐心跳聲說掰掰時...

  以國片標準來說其實還不錯了


  --

  如果是黑警放走張孝全也有點怪，應該要多帶些鏡頭說明(開完槍交談之類)'
