title: '[討論] 器子-藏鏡人黑手的線索線(有雷)'
content: '—------------------防雷—------------------














  薛仕凌演的警察楊劭武

  最後發現他是幕後黑手在警察中的臥底

  工作內容是幫忙栽贓給無辜的人

  前面還取得主角信任，靠著兩面手法差點活到最後


  先說個人觀點

  覺得他偽裝的最好的是:

  1.主角接觸時，果斷的假裝難以置信，並且鏡頭也有他在調查，想要找出幕後黑手的感覺

  2.搜查過程中放水，給男主機會

  3.輩分看起來比較菜，雖然是曾敬東的搭檔，但又有點跟班的感覺，威脅性低

  4.置身事外的感覺，從頭到尾的態度都比較消極，靜觀其變


  個人感覺到的線索

  1.雖然一直都有在調查曾敬東，但毫無進展，以有心想查的幹練刑警來說怪怪的

  2.警察中的間諜應該有兩人:

  第一個是負責逼供的曾敬東；另一個是不知名的屍檢人員

  屍檢人員是最後主角透過幫手拿到的，前期這點就是迷，只能知道至少是警察



  整體來說我覺得他藏的挺好的，透過靜觀其變不涉入事中的這一手幾乎沒被發現

  要不是拿到了當初的屍檢報告，那大概就是安全下庄的人了

  還有沒有是他也是黑幕之一的線索?


  --'
