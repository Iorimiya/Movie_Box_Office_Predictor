url: https://www.ptt.cc/bbs/movie/M.1740885665.A.683.html
title: '[普無雷] 【器子】有罪？無罪？還是原罪？'
content: '‧


  一票華麗的演員名單，算是撐起了整部電影，以綁架嬰孩，做為黑市器官交易買賣為主，

  張孝全冷酷的復仇演技，的確稱職扮演好張其茂這個父親角色，但劇本的漏洞、剪輯的怪

  異，可惜了這部具有議題性的電影。


  本片要列出演技有張孝全、薛仕凌、游安順、于子育、黃健瑋等人，要有流量明星也有李

  沐、婁峻碩、頑童，但劇本佔比著重在張孝全一人身上，壓縮了其他演員的表現，導致許

  多演技派的演員，沒有甚麼太多發揮空間。



  ‧


  全片的畫面質感相當良好，低壓的氛圍節奏，很恰當的隨著主角張其茂的心境而走，但中

  途加入了不少武戲成份，卻成了剪輯怪異的缺點，這樣必須具有亢奮情緒的打鬥，卻來去

  倉促，也不甚精彩，將原本一直維持低壓的氛圍，突然拉起又輕輕放下，有點拖垮了觀眾

  觀影節奏。


  而前面提到因劇本原因，許多角色完全沒有太多發揮空間，甚至有些佔比較重的配角，則

  是可有可無的存在，像是婁峻碩，其實完全拿掉這個角色，對於劇情也是毫無影響，但有

  追星流量的明星就是香，但他也沒表現不好就是了；也算是夏日檸檬草另一個方式的重逢

  ，而我比較期待的薛仕凌，因為劇本角色設定的關係，封印了他大部分的演技，但隨著劇

  情的推進，還是能好好的欣賞他細膩的表情情緒詮釋。



  ‧


  而張其茂與劇情中棒球隊的情感連結，沒有很強烈，雖然電影有自有的邏輯美學，也理解

  劇情的設定是為了加深張其茂與棒球隊之間的羈絆，但有些背離常理的手法，還是覺得有

  點點出戲；劇本充斥的小漏洞，加上部份劇情解釋有點牽強或不清，造成對於欣賞劇情上

  的一點小阻礙。

  不過就於題材上，雖不算新穎，但卻也是國片上少有，建議看完此片後，可以補上【自由

  之聲】，更能了解人蛇集團的可惡與可怕，也許認為的誇張劇情，其實卻在每個社會角落

  ，正悲慘上演，真的別當個心臟大的父母，孩子不要輕易離開你的視線。



  ‧


  當然可能因為是在疫情期間拍攝的作品，拍拍停停下，難免有著無可忽視的缺點，但整體

  上還是部質感良好、演員演技是亮點的國片作品，張孝全的冷酷演技，雖稱不上他最佳，

  但還是能很過癮的享受那內斂且冷冽的角色情緒。


  【器子】做為一部社會議題式電影，有成功表達出黑市器官買賣及一位父親復仇的要點，

  當然之中也蘊含其他值得關切的話題，雖然缺點明顯，但仍然是一部值得進場觀看的作品

  ，至少蕭煌奇所演唱的主題曲「默聲」實在太強大，建議在片尾時好好聽完，隨著張其茂

  那身體面的西裝，將情緒沉浸至最大。


  喔對了，如果有在看棒球的觀眾，尹昭德的扮相實在太像球評袁定文博士了吧！



  本片預計於4/11上映。



  ‧




  追蹤茶太郎IG




