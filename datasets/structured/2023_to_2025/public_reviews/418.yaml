url: https://www.ptt.cc/bbs/movie/M.1745830624.A.04C.html
title: '[有雷] 器子-為父不仁'
content: '快看，是S級英雄金屬球棒，我們有救了



















  (防雷)


  遭遇女兒被偷、喪妻、逼供以及17年冤罪、熱血棒球教練逐漸黑化走向復仇之路。


  器子是黑話，就是有著"適合"器官的孩子，透過集團犯罪將器官移植到有錢人的體內。人命不曾等價，是人類還是肉塊，取決於出不出的起價錢。


  看電影的時候，隔壁廳剛好是國有器官專場，真是有夠巧XD


  過程就頗王道: 主角黑化，私刑正義，萬能後勤，球棒無雙，故事反轉、最終一搏；然後壞人該死，英雄末路。


  隨著劇情推進，逐漸顯示這個犯罪集團龐大的陰影，就連公權力也混雜其中；滿絕望的，看到後面都在想主角什麼時候會死，他不死他的學生怎麼辦?  這故事怎麼收?


  結果....不盡人意但可以理解。


  劇中反叛最後的吶喊:  [我只不過是做了一個父親會做的事情罷了，換作是你，你一定也會這樣做。]


  對阿，如果有一切的條件，你願不願意犧牲一個陌生人，換取自己至親至愛的性命?










  .

  ..

  ....


  問我?


  首先我必須要有一切的條件才能客觀談這個，我有滿足嗎?  回答我! Look in my eyes!!




  --'
