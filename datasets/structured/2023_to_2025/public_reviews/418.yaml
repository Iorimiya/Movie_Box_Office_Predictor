title: '[討論] 《器子》 今日網飛全球電影榜第五'
content: '器子昨天在網飛上線

  單日排行第六

  今天上升至第五


  這是《咒》以來

  台灣電影在網飛最好的成績

  希望後勁能維持



  《器子》跟《有病才會喜歡你》可說是成績相反

  有病的院線票房較好

  在網飛卻沒水花

  器子票房不好

  網飛成績卻令人驚喜

  看來有些電影天生適合在小銀幕播出

  當初院線上映時我給70分


  --'
