title: '[雷] 《器子》  剪輯救了這部片'
content: '及格的商業片

  台灣電影院票房太慘了

  大家可以給戲院跟片商一口飯吃


  看的時候我覺得電影敘事亂七八糟的

  節奏、畫面跳來跳去

  到結尾時突然意識到剪輯超強

  這部片不這樣剪就沒救了

  可惜散場時急著尿尿等不及看剪輯者的名字


  如果這部片的剪輯正常照順序剪

  大概只有50分

  正片把故事剪得稀碎再重新拼湊

  讓電影有達到65分的水準


  看電影前我有被暴雷到李沐又演張孝全女兒

  但是多虧剪輯

  我途中想說我被爆的是假雷

  直到真相揭曉

  這點真的要給剪輯拍拍手


  第四章贖罪我覺得整段廢戲

  很傳統國片賣弄溫情的樣子

  尿急的人可以看到第四章就先去尿尿再回來聽蕭煌奇唱歌

  應該要把這整段刪掉多補充棒球隊的細節才對

  整部片還有很多不知道是bug

  還是忘了填充細節導致的瑕疵

  不過觀影體驗還是不錯的


  --'
