url: https://www.ptt.cc/bbs/movie/M.1741492928.A.932.html
title: '[好可雷] 器子與美國隊長四'
content: "前幾天 因為抽到盲測票 到微風看這部器子 這部的題材是器官 不禁讓我聯想到金田一的器\n官買賣題材過門軌跡\n\n一開始的剪輯 算是蒙太奇嗎？是有點突然，需要讓劇情推移\
  \ 才知道那段是回憶 基本上是\n稍微非線性的 第一章需要稍微理一點思緒\n\n不過第一次在國片看到凌虐劇情 算是做的很到位 然後後面的劇情也都蠻順的 最後的轉折\n\
  的確令人驚訝 不過好像國片都很愛在最後搞濫情 我是覺得大可不必\n\n缺點 主角演技不錯 但說是棒球教練 總覺得少了一點氣口 畢竟我們在電視上也看了蠻多棒\n\
  球教練的\n\n然後出乎意料的那位竟然知情 未免太壞了 比老爸還壞 不能說完全不可能 但實在有點不尋\n常 然後主角的助力 雖說有刻意安排 但要全部沒工作來幫忙\
  \ 也是蠻不尋常 尤其暗網 這應\n該技術沒那麼容易吧\n\n然後北市棒球教練 但感覺劇情畫面都一直在基隆 為何不直接設定成基隆 比較有地緣關係\n呢\n\n\
  不過整體能把一個故事說好 我覺得就可以給好雷了\n\n\n美國隊長也是抽到優惠票 雖然也沒有多優惠 但我還是跑來看一下 是說 我看之前有看過很\n多評論在臭 我有心理准備了\
  \ 但認真說 我並沒有覺得這部有那麼糟啊\n\n就前面的劇情 其實已經有在鋪他的心理背景 所以讓他後面成為嘴砲戰士沒有什麼問題 我\n們 重點是嘴砲內容有沒有說服力\
  \ 這點在影集就開始了 我是覺得偏弱 主要還是靠羅斯的自\n我控制 這應該是全劇最糟糕的部分\n\n但其他還行吧 一開始搶東西 以人質為優先 就是好人隊長的正確解\
  \ 後面鋪黑美隊去參加宴\n會 也都合乎邏輯 主要是真的反派太弱了 感覺沒有發揮到超級大腦的能力 美隊隨便都能找\n到他 沒有墨教授的能耐 講什麼超級大腦 他好像也只能控制雜魚\
  \ 因為美隊不殺雜魚才逃跑\n 最後還要靠自己入獄弄羅斯 還蠻廢\n\n然後那個女主角 感覺是要複製黑寡婦 整部片美隊二的影子真的很重 而且紅屋出來的那麼\n\
  輕信美隊真的蠻奇怪的 但實際上這個角色是挺討喜的 至少我不討厭\n\n然後那個美隊裝備 坦白說 就跟美隊二不一樣了 明顯強化跟高科技 我是不覺得裡面表現強\n\
  度有什麼問題 畢竟漫威之前奈米科技裝甲都能打薩諾斯軍隊了\n\n所以我覺得整體還行吧 絕對沒有美隊二那麼好看 但至少有第一階段普通水準 認真覺得並\n沒有那麼差\
  \ 至少劇情是順的 給個ok雷應該沒問題\n\n----\nSent from  on my Google Pixel 4a\n\n--"
