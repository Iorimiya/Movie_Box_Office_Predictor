url: https://www.ptt.cc/bbs/movie/M.1759661723.A.3F8.html
title: '[新聞] 《器子》Netflix飆全球第4   46地區TOP 10'
content: '台灣電影發威！《器子》Netflix飆全球第4…張孝全復仇片46地區TOP 10



  台灣2025年上映電影《器子》（Organ Child）在國際串流發威！該片由張孝全主演，描

  述遭誣陷入獄的男主角，在出獄後展開以暴制暴的復仇行動，故事牽涉活摘器官的犯罪集

  團，電影於9月30日上線Netflix，目前登上全球電影熱門榜第4，成為黑馬之作！


  根據電影票房網站統計，《器子》於4月11日上映至7月中旬，票房累計1936萬，電影由華

  映娛樂出品，故事描述男主角才3個月大的女兒疑似被販嬰集團擄走，他遭誣陷入獄，妻

  子自責自戕，出獄後得知幕後黑手是活摘器官集團，女兒成了被非法取走心臟的「器子」

  ，也是片名的由來。張孝全飾演復仇老爸，同片演員包括李沐、婁峻碩、尹昭德、薛仕凌

  等人，血腥程度挑戰觀眾視覺，而電影導演是簡學彬，導演前作《可不可以，你也剛好喜

  歡我》曾創下票房7900萬紀錄。


  《器子》屬於犯罪動作電影題材，透過國際串流Netflix上架5天，據網站「Flixpatrol」

  的統計數據，該片擠進全世界46個國家地區的電影熱門前10名，除了台灣、香港、新加坡

  都有奪冠，亞洲地區衝進日本、南韓、泰國、越南、印尼、馬來西亞，歐美地區更包括西

  班牙、阿根廷、南非、墨西哥等。


  而台灣電影上線國際串流，最強紀錄目前是2022年上映的恐怖片《咒》，該片票房創下破

  億台幣，同年上架Netflix，登上全球電影榜前10名，最高紀錄是全球觀看第3名，觀看時

  數破千萬小時。




  --'
