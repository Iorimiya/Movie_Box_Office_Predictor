url: https://www.ptt.cc/bbs/movie/M.1744449081.A.5E4.html
title: '[討論] 器子 你還要洗腳嗎？'
content: '剛看完《器子》，整部片的氛圍其實滿壓抑沉重的


  有點喘不過氣，但其中有一句

  你是不是還要洗腳？


  卻還是戳到了我的笑點。

  真的有夠荒繆的，

  這句台詞突然冒出來，打亂了原本悲傷的節奏。

  用一種有點荒謬、但又很貼近現實的方式，

  把我們拉回到一種很生活化的場景裡。


  我覺得是一個很漂亮的轉場，

  它讓悲劇不至於陷入一種單調的悲傷堆疊，

  反而是在一瞬之間，拉出一個「人性裂縫」。

  觀眾因此有機會在這樣的情緒缺口中重新調整呼吸，

  也更能承接隨後劇情即將帶來的下沉。


  這不是單純為了搞笑，

  而是把角色在極端情緒裡的慌亂、逃避，甚至是防衛反應給呈現出來。


  這讓我想到過去有一些電影也會用這種方式處理

  但效果好不好就…………



  比如《父後七日》 《大佛普拉斯》，

  我都覺得還算是加分的，

  比如當年《健忘村》，就覺得有點太多了……


  總歸來說，這部其實不錯，器官買賣議題讓我聯想到

  tank近期的換心手術大家也可以關注一下

  雖然我沒有特別想指涉什麼，不過一個台灣人可以到中國去成功換心

  還是覺得可能是運氣太好了？




  --'
