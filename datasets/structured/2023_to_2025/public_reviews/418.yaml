url: https://www.ptt.cc/bbs/movie/M.1743508207.A.256.html
title: '[好無雷] 《器子》剪輯讓人眼睛一亮'
content: '本來是衝著張孝全的動作戲進場！！想說這幾年時不時可以看到他分享健身房的照片

  應該是拳拳到肉的電影，結果沒想到開場10分鐘就開始懷疑自己是不是買錯場哈哈哈

  乾我男神被打>< 好心疼

  電影開頭就有點嚇到我，沒想到台灣也拍得出來有點恐怖但很合理的劇情，這部片並不是

  敘事照著時間線拍攝的電影，每個片段之間像是記憶碎片，拼不出完整畫面，被打散後再

  慢慢拼回來


  前期的劇情跳躍感很強，觀眾一時之間還拼湊不出完整畫面，反而更容易陷入迷惑

  這種剪輯方式不是為了炫技，而是真的在說故事，隨著時間拼圖一片片的拚上，反轉部分

  後勁很強，最後所有線索都能對上，就會發現整部片的結構其實縝密到可怕


  張孝全這次除了能打之外，角色的掙扎感也很到位，不只是單純靠肢體表演，而是眼神裡

  都有戲。有些場面台詞不多，但光是他的細微表情變化，就能讓人看懂角色的心理狀態


  李沐這次也蠻讓人驚艷，她的角色轉換塑造得很有層次，後半段有幾場爆發戲，情緒堆疊

  得非常細膩，尤其是某場崩潰戲，那種近乎絕望的反應，讓觀眾完全能感受到整個事件的

  惡意，帶入感極強，這次的表現真的讓人期待她未來更多的作品


  哦還有一點，這部片的光影拍攝得很精彩，燈光與色調的變化非常有層次，從幽暗的犯罪

  場景，到情感衝擊的戲碼，每一幕的氛圍都能襯托角色的心理狀態，讓人更能沉浸其中，

  很會運用氛圍感帶出緊張、壓抑以及角色的心理狀態


  整體來說完全是推薦可以進電影院看，那個壓抑的氣氛會比較強烈


  --'
