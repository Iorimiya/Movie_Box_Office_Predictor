title: '[新聞] 張孝全《器子》太暴力兒子不能看！自曝育'
content: '張孝全《器子》太暴力兒子不能看！自曝育兒底線　2原則要遵守



  台片《器子》將在本週五（11）上映，今日在台北西門町舉辦盛大的封街首映會，導演簡

  學彬率領主演張孝全、李沐、婁峻碩、薛仕凌與小春等人一同出席。張孝全還提到戲中太

  多刑求場面，導致他才6歲的兒子不能觀賞，之後更分享育兒經，「對兒子的底線是不能

  說謊、不能沒禮貌」。


  張孝全化身最強老爸　首映會分享育兒經


  張孝全在戲裡是一位為了愛女復仇變身的「最強老爸」，但他在戲外是一個6歲孩子的父

  親，他還分享自己的育兒理念，「我對兒子的底線是不能說謊，還有不能沒有禮貌，跟週

  末才可以吃零食和用3C」。


  張孝全在《器子》中有許多刑求場面，因此電影也被列為輔導級，兒子自然不能觀賞，他

  說道，「兒子有看過我年輕時期的作品，會指著電視說『爸爸在電視上』，但我都會跟他

  說不要在學校說爸爸在做什麼，就說『沒有在做事』」。


  近期受到川普對等關稅的影響，有人就擔心會影響民眾進戲院觀影的意願，對此李沐則是

  笑說，「我們要引導大家報復性消費，看電影大快人心！」而婁俊碩則是說，從小的夢想

  是在西門町封街辦活動，「原本以為會是唱片簽唱會，沒想到電影先幫我實現了」。





  --'
