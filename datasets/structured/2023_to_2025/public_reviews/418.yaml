url: https://www.ptt.cc/bbs/movie/M.1744701094.A.69A.html
title: '[請益] 好雷【器子】電影裡的一些疑問？'
content: '導演拍過「可不可以，你也剛好喜歡我」

  「器子」比起「可不可以，你也剛好喜歡我」，可以說是好太多了。


  「可不可以，你也剛好喜歡我」當初看預告配上鄧紫棋的「很久以後」

  還以為會是感人落淚的片，結果正片加入那個"促成3對絕緣男女"，

  根本是鬧劇一場。


  「器子」一開始看到是同個導演，我是覺得滿抖的，沒想到是很不錯的片

  ，尤其對國片來講。














  以下是電影的疑問，有雷


  1.電影前半段孤兒院院長是對男孩童做了什麼？


  張孝全跑到院長的座位說：「你敢不敢來對質？」

  後面，院長又找了一個男童，才被推倒、被鐵桿貫穿(？)

  我以為是要性侵男童，但是又沒有演出來




  2.孤兒院長死了被張孝全埋起來就結束了？完全都沒有人發現他失蹤了？


  孤兒院應該會有其他工作人員，院長應該也會有親朋好友來找他吧？

  就算都沒有好了，孤兒院要營運也需要經費那些的，

  就這樣消失都沒有人追查，好像怪怪的




  3.婁峻碩的媽媽(于子育)在李沐家幫李沐打針(或是抽血)。

  後面，婁峻碩的媽媽查李沐病歷的時候也有說「那她平常吃的那些藥是？」


  電影感覺就是把李沐塑造成有疾病的人，但其實她身體是好的啊！

  那些藥是....維他命嗎？那打針(或抽血)是....健康檢查嗎？

  婁峻碩的媽媽原本是醫護人員，總有些醫學背景吧



  4.最後把李沐有錢的假爸爸(尹昭德)、徐佳佳、謝承均兒子都槍殺的人是誰？



  感謝回答


  --'
