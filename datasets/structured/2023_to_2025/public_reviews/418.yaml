url: https://www.ptt.cc/bbs/movie/M.1745350597.A.BA7.html
title: '[普雷] 器子（有劇情雷）'
content: '雷文防雷資訊頁



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  聽說剪接很糟，但實際看的感想，其實剪接不特別糟，很多地方甚至掩蓋了一些劇情上的

  問題，不過還是有不好的地方


  例如前面交代孤兒院背景快速帶過是好的，可是竊嬰的部分與被誣陷入獄一段，仍然用前

  面的剪接節奏，過分均勻導致沒有營造出感覺


  另外動作戲總是沒有拍關鍵畫面，這明顯是動作指導和導演的鍋，剪接師是巧婦難為無米

  炊的



  而劇情上則有著明顯的問題，但我沒有覺得特別糟是因為，有滿多的劇情漏洞其實可以用

  很簡單的方式解決


  例如殺院長和竊嬰兩事接連發生，但這兩件事卻沒有真正連結，就是一件怪事，它讓懸而

  未決的殺院長一事，一直掛在心上到後段


  簡單的解決方式應該是，先有孤兒院童不見，後有竊嬰，然後發現院長是變態被殺後，為

  了不讓孤兒入獄，孤身一人的主角自願入獄


  這同時解決了幾件事，首先兩案就有關聯，孤兒院很明顯應該是器子最佳選擇，但因為有

  特殊血型問題，主角女兒才會被盯上，後續就可解釋為何要養大，是因為心臟夠大才能移

  植，這在嚴格邏輯下當然還是有問題，但起碼可以接受


  另外惡警為何不在主角出獄時就想辦法幹掉的疑問也沒了，影薄的告密護理師也可在主角

  出獄時改作為第一線索，協力團幫主角的動機也更明顯，因為他們也是器子的可能人選


  所以後面幾個安排也很奇怪，主角女兒怎麼可能是器子一號，那消失的孤兒是？之前看起

  來很有組織的背後勢力？


  另外要揭露協力團是孤兒院出來的，僅需一場接投球戲加點蒙太奇，就可讓觀眾得知真相

  ，口條又不好，用講的做什麼


  還有一點，主角女兒家的兩個傭人，就直接打為惡角吧，他們是好人會有很多事說不通


  最後是結局的安排，搞兩次悲傷場景實屬沒必要，一起開到海邊然後主角死，就是老套又

  有效的結局了


  這片並沒有全很差，起碼演出 攝影色調可以了，就是很多可以解決的小問題卡在很多地

  方


  不成熟 應該算是這片應有的評價



  --'
