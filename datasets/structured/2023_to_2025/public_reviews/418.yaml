title: 'Re: [新聞] 《器子》Netflix飆全球第4   46地區TOP 10'
content: '本來不想看這片

  因為網飛變國際名片

  去看完後覺得還不錯

  讓老外看台灣有多黑


  這種賣器官的題材不少

  韓國香港拍得很多

  台灣則很少見


  預告一看到刑求就不想看

  但看完後感到滿滿的父愛


  劇本很棒的犯罪電影

  看尹昭德最近都在演反派

  而且還是高智慧的反派

  不是哈佛大學回來的醫學博士

  就是生技公司的大老闆

  在角頭2也在演賊頭


  蠻喜歡看他演反派的

  記得他在法國片裡演尹清楓

  未來有望像梁朝偉一樣

  成為歐美影展的影帝


  李杏也是都開始走反派路線

  可能這樣紅得比較快吧

  壞到讓人印象深刻


  發現台灣不賣的片

  在國外都會大賣

  像周處台灣不賣

  但在中國就大賣

  臥虎藏龍跟

  比悲傷更悲傷的事也是


  而台灣賣錢的片

  在國外就沒人想看

  例如海角跟賽德克巴萊

  所以台灣票房跟香港票房

  的數字已經不重要了


  現在最重要的是網飛收視率

  還有歐美跟中國印度的票房

  這樣才能靠拍電影發大財

  不會像顏導魏導澎導一樣

  拍電影拍到債台高築被告


  這戲把李沐拍得很美

  感覺她成熟長大了

  雖然演高中生但變美了


  反派都很到位

  終於看到電視演員來拍電影

  王中皇跟謝承均都是熟面孔

  看來電視沒人看所以轉戰影壇


  王中皇應該算是最大的反派

  包山包海，連警察全都買通

  一個小孩200萬，真的有夠黑

  兒童器官變成一種商用醫療

  提供給權貴才有的醫療服務


  記得殺破狼的貪狼也有類似的題材

  說泰皇也是需要換心

  所以就去路上找遊客開刀

  結果找到古天樂的女兒

  古天樂就一路殺到泰國去

  一槍幹掉幫泰皇換心的東莞仔林家棟


  這個台灣版

  反而薛40跟黃建偉兩個警察演得好

  還有一整個棒球隊更讓人動容

  這種事果然需要整個犯罪集團

  才辦的到


  但沒想到商界 警界 醫界

  才是最大的黑道犯罪集團

  看完大概不會想捐器官

  我免費捐的血、器官

  讓別人花錢搶來用

  然後醫院賺錢也不會分我

  所以生死還是順其自然的好


  所以多拍點老外愛看的片吧

  像角頭也是只有台灣89愛看

  但願能拍到像這片一樣全球前十

  像魷魚遊戲全球收視冠軍

  應該就拿金球奧斯卡了


  例外推薦尹昭德的另一部醫學片

  就是我說他演哈佛醫學博士的片

  也蠻好看的，演到後來卻變反派


  生而為人




  --

  慧過人'
