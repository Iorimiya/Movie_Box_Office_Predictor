url: https://www.ptt.cc/bbs/movie/M.1716572630.A.2CD.html
title: '[好有雷]鬼舞村：詛咒起源，至少畫質不錯'
content: '今天看了這部最新上映印尼鬼片

  劇情不確定是不是因為沒看過前作

  所以感覺不出來哪裡可怕

  而且劇情連接也狗屁不通

  轉折老套外加有時候不小心顯露的浮誇話劇社演技


  不過拍攝的畫質、運鏡及演員表現都還可以

  跟二十年前的西洋片有得拼

  這個部分確實有驚艷到我


  建議想看這部電影的

  可以改看兩次芙莉歐莎


  --'
