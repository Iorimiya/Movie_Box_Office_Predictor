url: https://www.ptt.cc/bbs/movie/M.1740328627.A.479.html
title: '[普雷] 【吸血鬼：諾斯費拉圖】被愛「婚」了頭'
content: '‧


  改編翻拍1922默劇電影「不死殭屍—恐慄交響曲」，【吸血鬼：諾斯費拉圖】是第三部重

  翻拍這部經典吸血鬼作品的電影；相較於含有一點喜劇成份的1922年版本，此次風格完全

  走向極度氛圍壓抑，並且加入了歐洲民間的傳說及歷史文化，讓觀眾能夠沉浸在這帶有黑

  白柔和色調風格，充滿抑鬱情愫的19世紀德國城市之中。



  ‧


  劇情整體與1922年版本的差異性並不算大，但加入了歷史與傳說的細節，在劇情上有更多

  樣的可看性；例如在南歐民間盛行的獵吸血鬼儀式，利用處女或處男騎著白馬，當經過邪

  靈墓地時，馬不會踏進墓地，以及騎馬者與馬匹皆會受到驚嚇，來探測此墓是否為邪靈所

  以愛，算是相當印象深刻的橋段。


  而此次版本加入了鼠疫事件，無非是利用曾經在中世紀爆發的鼠疫黑死病，來更具象化吸

  血鬼對於人類的威脅；並且更顯示宗教對於吸血鬼（瘟疫）的束手無策，將城市民眾的無

  力感，用集體恐懼的方式，傳達給觀眾；加入這樣的設定，是非常值得讚賞的手法，雖然

  篇幅並不多，但更可以用「科學」方式，來顯示吸血鬼對於人類對於病疫造成的生命剝削

  ，有著更加直接的影響及情緒，而當然鼠派的諾斯費拉圖，面對人物設定有著貓元素的艾

  倫及阿爾賓教授，這樣另類的貓鼠對決，也算是做為互相對手的小細節。



  ‧


  如果做為一部恐怖片來看，我認為僅能算是勉強及格的水準，雖然依靠著良好氛圍及音效

  ，前段的確營造出令人不適的氛圍，尤其當哈特步入城堡之時，攝影運鏡、美術及音效，

  非常完美的樹立了第一幕的精彩，但可惜的是劇情越往後走，風格就越不一，前段壓迫的

  風格，到了後段就稍微消散無存，走向了一般較為平淡地恐怖手段，至少我認為的試膽時

  刻，算是相當少且無感。


  加上情慾的部份，雖然是為了區別與過去版本的不同，加上從開頭艾倫的呻吟聲，到中段

  的夫妻性愛，乃至最後結局橋段，我想會讓不少觀眾會以為諾斯費拉圖就只是個管不住小

  頭、精蟲衝腦吃醋的色鬼，搭配劇中出現的紫丁香，其花語代表著初戀、愛情萌芽，更讓

  這位橫空出世的吸血鬼男爵，加入了愛「婚」頭的元素。



  ‧


  但實際上從1922年與此次版本來看，這個設定僅僅只是為了增加劇情張力，用淫慾來加深

  精神力的拉鋸抗衡，但我認為立意良好，但執行不足，反而是拖累本片最被詬病的節奏問

  題，後半部的有著野心想增添素材，為即將到來的結局做好準備，但卻是非常平淡無奇的

  結束，連最後的結局橋段，拍得像是兩人高潮升天而死，但艾倫與諾斯費拉圖是否真有性

  愛之事，並沒有展現得很清楚，畢竟1922年版也只是吸血，新版則是邊做邊被吸嗎？那艾

  倫也真的太辛苦（笑），總之要擴展這樣的情慾設定，卻大部分只是點到為止，在於要著

  重重新設定艾倫這個角色來看，算是相當可惜的一點。



  ‧


  如果要將【吸血鬼：諾思費拉圖】以恐怖片來看，的確會讓人有點失望，但攝影及美術效

  果，的確是部令人驚艷的電影作品，加上演員的出色表現，尤其是星二代的莉莉蘿絲戴普

  ，不虧是強尼戴普的顏質遺傳，外貌演技都令人深刻，不輸辭演的安雅泰勒喬伊；當然最

  令人期待威廉達佛，這尊大佛依然沒人讓失望，雖然戲份不多，但算是能滿足粉絲的期待

  ；如果對吸血鬼題材有興趣的觀眾，可以進場觀看。



  ‧




  追蹤茶太郎IG




  --'
