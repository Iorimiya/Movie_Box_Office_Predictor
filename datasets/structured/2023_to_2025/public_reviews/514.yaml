title: '[好雷]諾斯費拉圖：一個痴漢cosplay德古拉的故事'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~















  去年十二月這片一推出就在國外獲得一片好評，引起了我的興趣。

  在台灣上映後終於有時間抽空去看，看完後可以理解為什麼評價不錯。

  故事本身就是1922年版本重拍，導演、演員都是有名氣也有實力，

  畫面華麗氛圍弄得相當好，算是各方面都有一定水平的作品。


  至於要說最凸出的部分，我覺得是演員的部分，

  尤其是比爾·史柯斯嘉扮演的歐拉克伯爵，不用露臉就能感覺的角色強大的氣場。

  角色獨特的口音讓他一出場就有強烈的壓迫感與特色

  ，可以看出史柯斯嘉對這個角色真的有下功夫。而其他的演員，

  也都看的出來是卯足全力在演，演得非常用力，

  莉莉戴普演到臉都變形了XD真是值得嘉獎！


  不過雖然演得這麼用力，我卻完全感覺不到劇中的情緒......

  不是在說演得不好，是編排的方式真的有點怪。

  像是嚇人的橋段，就是搭配個音效讓歐拉克伯爵出來 say hello不到一秒，

  然後什麼事都沒有發生！

  所以到底是在幹嘛？是怕大家不記得伯爵長什麼樣子嗎？這根本連跳臉都不算阿！

  不然就是一個長鏡頭加特寫配上懸疑音樂，然後...一樣什麼都沒有發生XD

  就算是要吊人胃口觀眾都被你吊到煩了啊！導演在恐怖橋段上真的很沒哏！


  然後雖然演員演得賣力，講了很多，不過仔細想想，就會發現其實剛才什麼都沒講！

  莉莉要對霍特講她的小秘密，先用了幾分鐘用咬文嚼字迂迴婉轉的講了一堆五四三，

  然後開始發神經，被霍特強壓開始18禁，最後伯爵出來say hello......

  所以搞了半天到底在幹嘛啊？

  一個1分鐘搞定的東西要搞到所有角色演一遍嗎？

  在學校寫作文都沒有導演這麼會拖！

  再不然就是像威廉達佛終於發現是出了什麼問題，

  意味深長地說到：啊我知道了，這個就是諾斯費拉圖 ！

  阿這不是廢話嗎？

  都演一個小時了，諾斯費拉圖出來say hello好幾次還已經上船了，

  世界上就你山寨凡赫辛不知道而已，不用演一堆給觀眾看阿！3秒鐘帶過不就好了嗎？


  然後最大的問題角色都很喜歡自己破哽！

  「等一下我要犧牲自己，不要跟其他人說喔！」

  「等一下我要過去你們文明世界囉！」

  我說你們少講幾句賣個關子會怎樣嗎？

  哽都破光了然後也不弄個驚喜轉折，

  明明演員演得很賣力，劇情卻完全沒有想演的意思！這個反差感真的很大。


  劇情上，這片真的留了一堆空白沒有解釋，也沒有明確的提示，看完滿頭問號！

  只能回家自己查。

  所以經過我自己融會貫通腦補一番後，

  才驚訝地發現，這是一個老痴漢的故事阿！

  故事大概是這樣：


  很久很久以前，在外西凡尼亞住著一個名叫歐拉克的痴漢。

  這個痴漢有一個夢想，就是有一天會有一個女孩會自願以身相許，

  然後他會和這個女孩徹夜狂歡直到自己精盡人亡！


  這對於住在這一代的痴漢來說本來是輕而易舉的事，

  例如住在他家隔壁的德古拉，有錢有房人長得又帥，

  不用出門就一堆妹仔往他身上貼，也沒有人會叫他是痴漢！


  痴漢歐拉克看的心裡好生忌妒，但回頭一看自己家徒四壁，連一個僕人都沒有，

  人長得其貌不揚，還帶有特殊傳染病，

  讓大家避之唯恐不及(歐拉克心裡OS: X，怎麼所有痴漢裡只有我長這樣.......)。


  他往窗外一看，除了旅館打掃阿嗓和沒有奶還要硬抖奶的吉普賽，

  沒有一個它看得上眼的女孩。

  他只好托夢給他鄰居，要他們介紹個女的，要他們把她全身扒光帶到他房間前......

  結果當然是沒有人理他XD痴漢的名聲還在當地流傳了開來！


  但是歐拉克不放棄他的夢想，他願意等，像一個痴漢一樣靜靜地等。

  於是就這樣一天又一天，一年又一年，

  歐拉克化身為那座500年的橋，只為了等那女孩走過。


  有一天，歐拉克聽到了一個聲音從遙遠的德國傳來，

  他定神一看，她不是一個女孩，是一個小蘿莉！

  歐拉克看到她後驚為天人，瞬間被小羅莉電到不要不要的！

  他心中的的真命天女終於出現啦！

  他決定要騷擾...阿不是，要追隨這個蘿莉直到她願意以身相許。

  他就這樣天天傳愛的訊息直到小羅莉長大成人，

  還幫他找了一個老公，讓他多增加了一個人妻屬性，之後攻略起來更有成就感！


  之後歐拉克開始搞起詐騙產業，

  在他與他不知從哪找來的僕人的一陣胡搞瞎搞神操作之後，

  終於把老公騙到柬埔寨...阿不是，是外西凡尼亞，關起來，

  自己風城僕僕的趕到德國要見那女孩。

  途中大概是走錯路走到海邊去，硬著頭皮租了艘船XD

  女孩見到這位騷擾...阿不是，關注自己多年的追求者後驚恐萬分，

  但在痴漢歐拉克超有說服力的聲音下終於屈服，

  不情不願的「自願」簽下同意書。

  歐拉克看著自己多年的計畫終於要成功了，

  故不了什麼自不自願這種小細節，馬上開始和女孩大戰三百回合，

  家裡被放火燒了也不管了，反正他已經決定不回去了！


  最後他看這早上緩緩升起的太陽，

  回憶著他的一生，感到已經此生無憾，

  所以就安心地，死去！


  這個故事合不合現代人胃口，我不知道。

  我只知道把一百年前就開始流行的吸血鬼拍成痴漢，是一個頗新鮮大膽的嘗試！

  試圖讓這十幾年被美化成高富帥的吸血鬼回歸到他傳統上的樣子，

  我想是這個導演想要看到的結果吧！


  歐拉克在劇中呼風喚雨，大家都拿他沒轍，

  要不是他最後自己精蟲衝腦(還是腦充血......)不然看起來還是可以在多搞個一陣子。

  俗話說人不要臉鬼都怕。那如果鬼不要臉，那神仙都沒有辦法啦！

  我想這個故事告訴我們，長的醜，沒有關係，沒錢沒地位，沒有關係，

  只要夠不要臉，總有一天會心想事成，成為一個有成就的好痴漢！


  最後總結我對這片的心得，就是一句話：噁心！



  --'
