url: https://www.ptt.cc/bbs/movie/M.1742785444.A.84E.html
title: '[微好雷] 《吸血鬼：諾斯費拉圖》 '
content: '今年二月在台灣上映的電影







  雷文防雷資訊頁






  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  從《燈塔》或許內涵不足但可視為的當代的「新表現主義」，擅長蒐集西方古典鄉野傳說

  並將之電影化，重塑成淒厲、可怖、駭人的表現性，如《女巫》、《北方人》，並且雅俗

  共賞的Robert Eggers作品。



  本身不是吸血鬼專家，對於其宇宙也是麻瓜程度（如果說港片的殭屍還比較有感），《吸

  血鬼：諾斯費拉圖》查了一下改編《德古拉》過往情節沒有太大差異（年輕時期看得穆腦

  版本早忘光，沒看過荷索版本）。於是談的依舊時熟悉的科學與鄉野奇談、神祕學之間拉

  鋸，同時加強夢境與現實的模糊、混淆不清。談的「惡魔」源自於人類之愛，同時是在夜

  晚出現的自身羞恥、恐懼等暗黑裡層帶有精神分析式徵候。



  畫質變好的古典氣氛，甚至攝影質地強調著某種繪畫感（不太確定這會不會是一種好處）

  。除了影像表現，還有什麼可以說的？ 女主角和吸血鬼愛慾糾葛可以說是一種量子糾纏

  ？



  很多事情早就註定好的，只是在那邊等著你/妳。電影關注「人」本身，與西方基督教對

  於定義，意義的詮釋，可能會是Robert Eggers作品能不能走得更遠的瓶頸，在此能不能

  扯到東方的命運觀或者萬物皆有靈觀點？忽然想到所謂的「自然」也必須尊重創作者本身

  的自由發展，於是會發現，《吸血鬼：諾斯費拉圖》拿掉經典的《德古拉》文本，與導演

  過往作品好像沒太大差別（只是預算變多，畫面變華麗了），顯露了與《女巫》、《北方

  人》文本特殊性跟表現相得益彰，同時也看到了Robert Eggers創作的侷限性。




  --


  拉特飯 - 以商業力量進入獨立市場


  --'
