url: https://www.ptt.cc/bbs/movie/M.1740405791.A.411.html
title: '[好雷]吸血鬼-諾斯費拉圖'
content: '期待了大半年，終於等到台灣也上映了，秒速觀賞！

  先說無雷心得！

  只能說我就是很吃導演Robert Eggers這一套，儘管他的前作我只有看過"The

  Lighthouse"，而且我也沒看過原版或是前一次翻拍的版本(基努李維那版)，但是我真是

  非常非常喜歡這部電影。


  很多人都說戴普女兒演技差，我個人是覺得她正常的戲確實演技有點麻麻的，但中邪戲

  (?)如果不是特效，那是真的蠻嚇人的。不過她的長相實在不是我會欣賞的類型，配角

  Emma Corrin扮相都比她好看地多。


  至於男角大多演得很好。Nicholas Hoult的戲份比我想像中還多，他在對女主的感情爆發

  戲演得很好騙了我幾滴眼淚(?)

  Aaron Taylor-Johnson我有點被他的帥氣外表迷惑，但是他的角色就很倒楣，最後那場戲

  也演得很好。Willem Dafoe就不用說了，可惜這個角色以他來說也不算很特別，駕輕就熟

  吧，戲份有點少就是了。


  至於我們的一番大男主Bill Skarsg緳d，寶寶你又頂著奇奇怪怪的特殊化妝了，除了身

  高一點也沒看出來是你XD

  這次的伯爵造型有很奇怪的髮型跟俏皮的鬍子，外型說嚇人其

  實也不嚇人，但是他的聲音加上奇怪的氣喘聲非常有壓迫感，加上導演最擅長的畫面+氣

  氛+音樂營造，有幾個片段的壓迫感真的很重很嚇人。


  本作的畫面真是非常的美麗，步調稍微慢了點，但是畫面美、長鏡頭也很過癮。馬車那幕

  真的很像該隱赫斯特，可惜伯爵的城堡都好破舊啊啊啊真是個不修邊幅的吸血鬼。

  至於劇情就不破梗了(更何況是老梗)，但是個人覺得追加了一點雙向救贖(或是相愛相殺)

  的宿命感，比原版浪漫太多了，反正我是很喜歡。


  以下有雷心得


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  先說明一下，我不是原作的粉絲，也沒看過其他版本，

  更不是吸血鬼類型作品的專家(吸血鬼類型有接觸但沒有深入研究考據)，

  以下心得都是我個人針對這個版本的主觀感想。


  劇情的解析，其他大大的文章已經有詳述過了，我想針對幾個特別在意的點來聊聊。

  有關伯爵和艾倫的關係，我去查過原版的設定，

  是吸血伯爵看了照片才對房仲的老婆一見鍾情，


  但2024的版本則是改為艾倫有靈感力(就像一位天生的超級靈媒)，

  在她幼年時期就因為對陪伴和性慾的渴望，

  不小心喚醒了長期潛伏於黑暗的吸血鬼；


  而吸血鬼這邊的狀況則是，

  受到詛咒的人類巫師

  (具體是怎樣的詛咒沒說清楚，

  反正就是這麼一回事。)

  本來過著不見天日如同野獸的生活

  (可以推斷大概也沒啥神智)

  但是被艾倫''喚醒''之後，開始和她遠端網戀。


  簡單來說可以想成兩位異類莫名其妙通靈上了，就開始網戀。

  咱們這位網公長的很恐怖、給人的感覺也很恐怖，事實上也很恐怖，

  小女孩會害怕也是正常的，但又拒絕不了刺激的誘惑，

  她又愛又怕，長期被精神和肉體折磨(這裡的肉體指的是夢遊和癲癇，別想歪)


  直到她遇上房仲老公，發現新的大帥哥能帶給她她渴求的陪伴以後，

  艾倫毅然決然拋棄了網公，和老公湯瑪斯過上''正常''的生活。

  接下來的劇情大致上和原版一樣，只是追加了網公的陰謀成分。


  被拋棄的網公想方設法要奪回自己的初戀情人，

  然而他是怪物，所到之處伴隨死亡和瘟疫，儘管他有一部份可能是網戀受害者，

  但不能否認的是他天性邪惡的陰暗面，確實造成了災害；

  而艾倫從頭到尾知道自己是始作俑者，在自己的親朋好友以及整座城市都受難以後，

  才決定要負起這個責任，和伯爵同歸於盡。


  老實說，我其實有點懷疑艾倫到底愛不愛湯瑪斯。

  我感覺艾倫依賴湯瑪斯，大部分是因為在湯瑪斯身邊，她能保持''正常''。

  事實上劇情並沒有提及到艾倫和湯瑪斯有什麼其他特別深厚的過往。


  然而湯瑪斯對艾倫的愛，才是讓我有點意外甚至動容的，

  且不說他前期傻呼呼的自投羅網，在外面遇難感覺笨笨的，這都是人之常情。


  但是他拚了死命回來以後，面對艾倫在他面前中邪的恐怖行徑，居然還能搞她(。。。)

  接著又這麼深情地安慰她，決心要為她對抗怪物，且不說其中有多少大男人主義成分，

  但我覺得這個真是個好老公啊...幸好他最後還活著，沒有倒楣的犧牲...


  至於好朋友一家，真是超級無敵倒楣...

  尤其是兩個小女孩被殺的那幕真的很嚇人...

  最後在墓穴那裡，ATJ向妻子懺悔說再也不睡了那段真的很難過。


  至於這部電影的結局，其實我看了是很被觸動的(不知道為啥)

  奧洛克在本作的形象跟以往的吸血鬼帥氣魅惑的形象截然不同，

  以往我們總是覺得哇！吸血伯爵這麼帥！我自願被咬！

  但是本作的吸血鬼很明顯就是醜陋又恐怖的，然而他的魅惑(精神控制)魔力，


  讓受害者又愛又怕，極其矛盾，這一點不只在艾倫身上，在房仲老闆身上也能看見。

  在奧洛克身上的是一種原始、霸道扭曲的邪惡力量，我覺得這才是最恐怖的一點。


  事實上奧洛克知道自己是什麼怪物，也知道艾倫根本不想和他在一起。

  他沒有用奢華的生活誘惑她、也沒有承諾什麼永遠相伴的未來，

  畢竟一直以來他連最基本的生活品質都不顧，他哪還會想到什麼未來？

  我覺得他除了要得到艾倫以外根本沒有其他想法，

  所以最後他終於如願以償地得到艾倫的時候，

  面對如此情動、自願的艾倫，他會迷失也是很正常的，

  或者說他寧願留在那也不想離開吧。


  我很喜歡他奧洛克和艾倫一起在晨光下的那一幕，

  看得我眼淚漣漣Q_Q(真的不知道為什麼，大概電波對到了)


  另外，本作的尺度其實沒有我想像中的大，頂多都只能算是性暗示吧...

  最大的場面居然是夫妻倆，而不是跟伯爵！

  本來看大家的心得，還以為最後一幕會拍得很露骨，

  與其說是上床，吸血的行為還比較明顯(頂多就是赤裸地吸血?)

  而且我查了一下這個結局跟原版一樣呀！也不是現在才改的，這就是他浪漫的地方吧。



  總而言之，我個人很喜歡這部電影，除了他的Jump Scare有點多以外，

  劇情、演員、畫面、音樂各方面我都很享受。

  絕對是會想二刷或買BD來收藏的作品。

  推薦給喜歡古典恐怖、稍慢步調電影作品的人！


  --

  有看到！但是不知道是特殊化妝還是本人的（羞

  Bill本人有192公分捏（身高，勿想歪）

  不怕跳嚇的話真的推薦！

  啊啊啊啊啊啊笑死我了！原來最愛伯爵的是湯瑪斯！

  沒錯，國內外都還是有好多人看完電影覺得他帥XD

  沒錯，非常大方的一家子。

  唉，看完第二天，還沈浸在那個情緒裡，一直在聽OST的最後一首...後勁好強的一部電影

  嗚嗚嗚

  啊啊啊謝謝喜歡！其實這部電影傷我很深（？）看完第二天聽原聲帶還會哭QQ但是這篇文

  是希望吸引更多觀眾進場，才用比較輕鬆的方式表達！我個人也不算膽大，這部電影嚇人

  都是一閃而過的跳嚇，數量不超過10次，有心理準備應該還好！真的很推薦！'
