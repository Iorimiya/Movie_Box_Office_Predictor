title: '[好雷] 諾斯費拉圖 大師之作'
content: '真 大師之作


  很久沒看到這精緻的古裝電影


  每一幅畫面都是精雕細琢


  環球在北方人後繼續投資Robert Eggers獲得了美好成果


  個人體感是比北方人好很多


  但別期待節奏有多快


  因為就是堅持把電影當民族誌拍的狂熱份子


  缺點是宿命感不夠

  強（女主角跟傻老公）我也不特別喜歡Bill Skarsgård的演出


  不過Robert Eggers在我心中已經跟Ari Aster黃金交叉了

  -----

  Sent from JPTT on my iPhone


  --'
