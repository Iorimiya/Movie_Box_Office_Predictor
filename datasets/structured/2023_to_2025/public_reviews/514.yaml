url: https://www.ptt.cc/bbs/movie/M.1740136565.A.D64.html
title: '[好雷] 吸血鬼：諾斯費拉圖'
content: '自從看到，連環球影業都強調這一次絕不

  撤檔來讓觀眾安心，身為他的忠實粉絲似乎也沒有不入場的理由了（但果然還是最想在戲

  院看《北方人》啊！




  沒想到這一次居然還有機會抽到ptt上的特映票，當下就覺得如果上映後還沒有板友發心

  得，就自己來寫一篇拋磚引玉好了～


  ，但《吸血鬼：諾斯費

  拉圖》承襲自古典恐怖片那種詭譎的氣氛營造、絕美的攝影依然很值得一看的！





  艾倫因孤獨而祈求超自然力量的陪伴，然而她意外喚醒了一個神秘的生物，而這個生物

  要求她立下永世效忠的誓約。


  數年後，1838年的冬天，隱瞞了這段過去的艾倫與新婚丈夫湯瑪斯一同居住在德國的維斯

  堡。湯瑪斯受地產商諾克先生之託，要將一處破敗的莊園出售給世居在喀爾巴阡山一帶的

  奧洛克伯爵；艾倫則飽受夢魘困擾，夢中她與死神結為連理，並看著周遭的人一一死去。


  艾倫對於自己在夢境中居然獲得了歡愉感到不安，她懇求湯瑪斯留下，但湯瑪斯為了追求

  更優渥的生活，仍然向著奧洛克伯爵的城堡出發了…




  《吸血鬼：諾斯費拉圖》（2024）改編自同名的1922年默片，當年的故事其實就是改編

  《德古拉》的小說，只是因為沒取得版權的關係，把「德古拉伯爵」換成了編劇另外創作

  出來的「奧洛克伯爵」，當然最後依舊是吃了一記版權砲，也因此該片能夠流傳至今，單

  純就是因為有些拷貝在法院要求銷毀前，就被送到德國以外地區的關係。


  1922年版「奧洛克伯爵」最廣為人知的形象，大概就是在《海綿寶寶》裡的客串（還被認

  成了「夜光閃亮亮復仇鬼」）。而儘管當年的導演Murnaw最初的創作意圖就是暗示「奧洛

  克伯爵」=「那位」德古拉，1979年Werner Herzog翻拍的《Nosferatu the Vampyre》中

  的吸血鬼更是直接名為德古拉，二者間還是存在著許多顯著的差異，像是相較於小說中，

  德古拉可以輕易周旋於人群的紳士形象，奧洛克一脈的吸血鬼有著非人怪物的外型等等。


  本片以1922年的默片為主要改編對象，因此在的同時，捨棄了吸

  血鬼作品發展至今的各種常見元素，然而《吸血鬼：諾斯費拉圖》（2024）相較於1922年

  版乃至其他版本，可以說是各種意義上都非常現代的改編/擴寫，尤其是有著出色演出的

  Lily-Rose Depp，（

  ），也讓她得以跳脫過去版本

  裡，犧牲自己讓英雄得以擊敗怪物的貞女形象。始終抗拒著自己窺視另一個世界能力的艾

  倫，需要的不是被拯救，而是擁抱自己的天性。


  艾倫的靈性敏感受到了文明社會的鄙夷，被認為是需要透過麻醉劑與拘束衣控制的，然而

  面對帶來瘟疫的死神，「現代」世界沒有應對手段，只能仰賴女子的能力，一如Willem

  Dafoe飾演的弗朗茲教授所言，遊走於現世與靈界之間的艾倫註定擁有更偉大的使命，只

  是恰好生在了錯誤的時代。


  年幼孤立的主角渴求陪伴，而惡靈回應了呼喚，並以淫靡惡夢侵擾著她，不安卻又充滿誘

  惑的夢境讓當年的她陷入罪惡感與自我厭惡，而這些內心的黑暗渴望，在艾倫自以為抽離

  的多年後又重新找上了她。


  從與終極邪惡之間的拉鋸，到最後直面自己的心魔，與怪物同歸於盡。明確的主題，與片

  中不時出現生命力與死亡、光明與黑暗對立的畫面呈現一同，讓《吸血鬼：諾斯費拉圖》

  成為了。


  另外則是奧洛克伯爵一角，一如他自己所言，他就是「慾望」（appetite），靠著褻瀆神

  聖、吸取健康之人的生命力來苟且存在於世的怪物，不同於能製造出更多吸血鬼的德古拉

  ，奧洛克只會帶來和他自身一樣的腐朽與毀滅，他渴望與艾倫合而為一，但艾倫既不會使

  他快樂，也無法讓他變得完整，對他而言艾倫只是一頓特別美味的佳餚。


  比起傳統的吸血鬼，奧洛克伯爵更像是惡靈，除了身上隨處可見死亡的意象外，他也是艾

  倫所壓抑性慾望的具象化，是艾倫極度孤獨的回響、所渴望卻又不願渴望的伴侶。對於這

  一點，個人認為由於吸血鬼電影往往難以擺脫被與戀童情節放在一起檢視（

  ），在這一版的改編裡，艾倫與奧洛

  克之間某種雙向的渴望，搭配上Eggers風格強烈的視覺呈現，以及電影有意模糊處理角色

  的年齡設定，其實不難想像有觀眾可能會感到不適。






  最終，艾倫成功欺騙了奧洛克，讓他相信自己已經屈服於內心黑暗的渴望，並使他因為陶

  醉於鮮血而迷失了時間感，破解了奧洛克對於陽光的謹慎迴避，一如在過往的版本裡，因

  為艾倫是出於崇高的理由而自我犧牲，她最終仍得以保有靈魂的純潔與自由。然而

  ，Eggers證明了百年前的故事依舊能

  引人入勝、有它再講一次的獨特價值的同時，卻在許多地方都沿用默片版的劇情，例如沒

  有給出不同於以往的結局安排就一件事。


  本片在架構上大體承繼了默片版而沒有做太大改動，步調又不像默片版走緊湊路線的情況

  下，很。像是

  艾倫很多時候被周遭認為是偏執、癲狂的，理應比劇中其他自詡理性的角色更能夠同理她

  的觀眾卻很難找到立足點；而電影對艾倫過往的著墨相對較少，或許也讓人覺得她似乎太

  快就接受自己的命運…這些，然而都屬於較為瑣碎的個人感想

  ，。


  而提到優秀的配角陣容，我最喜歡的大概還是Willem Dafoe和Nicholas Hoult，與Eggers

  的御用演員Ralph Ineson。Dafoe應該算是貢獻了這部片不多的笑點，不過有《北方人》

  的宮廷弄臣珠玉在前，自己對他這一次的演出反而比較沒有深刻印象；而單從傳統演技的

  角度看Hoult應該是配角裡最亮眼的，沒意外這應該也是他去年的三部強片（台灣應該不

  會上映了的《The Order》遺憾還沒看過）裡最讓人驚艷的演出。


  Emma Corrin跟Aaron Taylor-Johnson都超適合古裝扮相，尤其是前者，看完後朋友說她

  是《死侍》系列的彈頭（），讓自己驚訝得無以復加；

  Taylor-Johnson飾演的Friedrich堪稱本片最不討喜，礙於篇幅沒看到更多這個角色帶來的

  衝突是自己覺得蠻可惜的一點。


  最後，Eggers在這部電影裡再次發揮了自己對

  ，不過最讓我印象深刻的，大概還是奧洛克伯爵是以蓄鬍鬚的

  形象出現，再配上特殊化妝就直接遮住了Bill Skarsgard很大一部分的表情呈現，雖然

  這不是他第一次演需要特殊化妝的角色，但能感覺到這次對他而言又是完全不同的挑戰！


  --


  謝謝j大！

  一直有種在哪裡聽過伯爵聲音的錯覺，後來想想可能是想到《沙丘》的皇帝軍團了w



  多謝W大！來編輯一下內文～'
