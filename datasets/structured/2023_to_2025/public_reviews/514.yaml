url: https://www.ptt.cc/bbs/movie/M.1727745517.A.EBA.html
title: '[新聞] 《吸血鬼：諾斯費拉圖》全新預告曝光 '
content: '《北方人》導演翻拍《吸血鬼：諾斯費拉圖》全新預告曝光！比爾史柯斯嘉、威廉達佛同

  台飆戲






  由《燈塔》（The Lighthouse）、《北方人》（The Northman）導演勞勃‧艾格斯（

  Robert Eggers）自編自導，改編自 1922 年的經典恐怖片《不死殭屍—恐慄交響曲》（

  Nosferatu – Eine Symphonie des Grauens）的新版電影《吸血鬼：諾斯費拉圖》（

  NOSFERATU）今日釋出全新預告。



  由強尼‧戴普（Johnny Depp）的女兒莉莉-蘿絲‧戴普（Lily-Rose Depp），以及《牠》

  （It）的比爾‧史柯斯嘉（Bill Skarsgard）所共同主演。《吸血鬼：諾斯費拉圖》講述

  被鬼魂糾纏的年輕女子和一名對她有所迷戀的吸血鬼之間的關係，導致聯發一連串的恐怖

  與災難。



  《吸血鬼：諾斯費拉圖》演員陣容還包括 尼可拉斯‧霍特（Nicholas Hoult）、《獵人

  克萊文》（Kraven the Hunter）亞倫‧強森（Aaron Taylor-Johnson）、《王冠》（

  The Crown）艾瑪‧可林（Emma Corrin）、威廉‧達佛（Willem Dafoe）、《哈利波特：

  死神的聖物Ⅰ》（Harry Potter and the Deathly Hallows – Part 1）根賽門‧麥克伯

  尼（Simon McBurney）、《辦公室風雲》（The Office）拉爾夫‧尹愛森（Ralph

  Michael Ineson）等。



  本片預計 2025 年 2 月 21 日於台灣上映，北美則搶先在 2024 年 12 月 25 日上映。





  --'
