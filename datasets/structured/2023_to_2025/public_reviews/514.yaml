url: https://www.ptt.cc/bbs/movie/M.1749782832.A.9F8.html
title: '[普雷] 吸血鬼：諾斯費拉圖Nosferatu'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  完食了在國外似乎頗有好評，但在台灣沒有什麼聲息的《吸血鬼：諾斯費拉圖》。此前看

  過導演的《女巫》和《北方人》（很明顯是為了安雅?），《燈塔》則是挑戰了幾次都沒

  有成功（雖然聽說也有安雅)，非常可以理解導演的想法，在幾部片中反覆展現。整體美

  學想是導導的長項，對於古裝的設計與歐陸深山的景色是這時代不容易的講究。


  講這麼多其實這片終究不是我的菜，深究起來還是對於電影所呈現的1838年德語區(特別

  去查了一下，巴伐利亞王國的維斯堡小鎮，嗯，翻作德國大約是方便今年理解)不夠信任

  。那世界也許確實存在科學理性與中世紀傳說之間的交替氛圍，導演顯然也有意將這部片

  列上全片討論的焦點。然而，劇中對白透出的思想、糾結的問題仍給我非常美國而不歐洲

  的感覺。


  如同早幾天看畢的友人所言，本片大量米奇可能比吸血鬼更恐怖。但作為一個現代

  再詮釋之作，仍有其可以觀看並思考之處。




  ***


  這裡是我的樂園:




  --'
