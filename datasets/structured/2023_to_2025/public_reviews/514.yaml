url: https://www.ptt.cc/bbs/movie/M.1735834805.A.EFB.html
title: '[新聞] 吸血鬼：諾斯費拉圖 票房熱賣！導演預告'
content: "亞倫強森、尼可拉斯霍特主演《吸血鬼：諾斯費拉圖》票房熱賣！導演預告將推出藍光加\n長版\n\n\n\n（圖片來源：環球影業）\n\n《北方人》（The\
  \ Northman）導演 勞勃艾格斯（Robert Eggers）翻拍自同名經典《不死\n殭屍 — 恐慄交響曲》（Nosferatu, eine Symphonie\
  \ des Grauens）的《吸血鬼：諾斯\n費拉圖》（Nosferatu）上月於北美聖誕假期公映，旋即收穫諸多好評，也開出超過 4000\n 萬美元的首週票房，對一部製作費僅約\
  \ 5000 萬美元的恐怖片來說，是相當亮眼的成績\n。\n\n不過觀眾在院線看到的並非最完整的內容，未來還有篇幅更長的版本。\n\n\n\n艾格斯於《Esquire》雜誌的最新專訪影片（見上方連結）中透露，在電影裡飾演吸血鬼\n\
  「奧洛克伯爵」的比爾史柯斯嘉（Bill Skarsgard）有一些鏡頭為了保持該角的神秘感，\n而被他們在院線版忍痛刪剪了，但這些鏡頭我們仍會在日後發行的藍光影碟加長版中見到\n\
  。\n\n艾格斯並未透露加長版的總時數有多少，但環球和藍光官方日前已經發佈了本片一般藍光\n、 4K 藍光的外殼封面專屬設計（下圖），上頭確實已經註明會同時收錄院線版和加長版\n\
  。\n\n\n\n（圖片來源：藍光）\n\n本片其餘卡司還包括：莉莉蘿絲戴普（Lily-Rose Depp）、亞倫泰勒強森（Aaron Taylor\n-Johnson）、尼可拉斯霍特（Nicholas\
  \ Hoult）、賽門麥柏尼（Simon McBurney）、雷夫\n伊內森（Ralph Ineson）艾瑪柯琳（Emma Corrin）、威廉達佛（Willem\
  \ Dafoe）、史黛\n西蘇斯（Stacy Thunes）等人。\n\n一如舊版電影和它的取材原著《德古拉》（Dracula），新版《諾斯費拉圖》故事同樣發\n\
  生在 19 世紀的德國，聚焦於一位古老的吸血鬼對一名年輕女子的癡迷之情。\n\n台灣預定 02 月 21 日上映。\n\n文：Joker\n\n\n新聞網址：\n\
  \n\n\n\n\n\n\n這次應該真的會上映......吧？！\n\n--\n反正也常常有人在文章下面造謠啊～笑死"
