title: '[普好雷] 吸血鬼 諾斯費拉圖'
content: 'I have seen things in this world that would make Isaac Newton crawl back
  into

  his mother''s womb!

  We are not so enlightened as we are blinded by the gaseous light of science.

  I have wrestled with the Devil as Jacob wrestled the Angel in Penuel,

  and I tell you that if we are to tame darkness, we must first face

  that it exists!

  We are here encountering the undead plague carrier...

  the Vampyr... Nosferatu!"


  整個電影院只有我一個人在笑

  這段威廉達佛的燈塔感讓我欲罷不能

  就這段就值回票價了

  雖然我前面的情侶檔好像看到睡著 只有吸血鬼jump scare才會抖一下


  Nosferatu

  我期待很久

  Robert Eggers每一部我都看了

  這部的攝影跟畫面很有那噁心的美感

  只要是吸血鬼的畫面就是黑白 這種跟其他場景的對比

  節奏上就以往的慢 多了幾個我覺得頗無聊的jump scare

  像鄰居老婆看樓梯轉頭被女主角嚇到這種東西


  劇情上 雖然我這部預告片出來那時候我就看了最經典的1922默片版本

  在知道劇情下看也是還算有趣

  也有很多很棒的改動 像是去的路上的小鎮 各種噩夢 瘋掉的僕人

  也有一堆我不知道在幹嘛的變化 女主角突然就是女巫之類的

  棺材裡面不裝泥土 沒有一大堆吸血鬼僕人 女主好像隨時都在發情

  吸血鬼不知道幹嘛要整天全裸吸奶子之類的

  我不知道欸 我怎麼覺得這部其實不需要這麼多情慾相關的東西

  真的有必要癲癇中邪一樣狂抖 下一秒抱住男主角大腿

  跟他說吸血鬼的老二比較好吃嗎

  這段我整個出戲到笑出來

  我走出來還是覺得這段很好笑


  恩

  算了

  氣氛片 氣氛片


  整部我唯一嚇到的是威廉達佛在一堆老鼠中間放火

  我以為他瘋了要自殺 害我難過了一下

  結果最後跑出來抱一隻貓站最後C位


  帥爆了 10/10




  --'
