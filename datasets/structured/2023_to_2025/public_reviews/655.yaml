url: https://www.ptt.cc/bbs/movie/M.1473517790.A.ECA.html
title: '[好雷]《聽說桐島退社了》讓我看看悲傷的愛吧！ '
content: "舒服無廣告版\n\n\n\n\n\n談論迷惘跟未來的戲。\n\n\n此戲得到不少獎項，也有不少負評，如果喜歡用不同視角重複敘述同件事的話，很適合看\n\
  看此作。\n\n桐島，學校的人氣王、資優生，長得帥又運動全能，在師長與同儕眼中無疑是重要的存在\n，卻在某天無來由的退出社團，甚至沒有人知道他去了哪裡。這樣的變動，打亂了每天按\n\
  表操課的學校生活，對不同親疏遠近、不同社交地位的人，各自產生了不同影響與變化。\n本片中，重複的用不同視角去觀察細微的心境變化，在同件事情上利用不同角度重複觀測\n\
  ，使觀看者能輕易的易地而處，才發現：儘管有時候以為自己是躲藏、內向的角色，但也\n有時候是高傲的、傷人的，或者受傷的。\n\n\n原本是桐島的好搭檔，在學校總是由兩人引領風騷，優秀帥氣擺明人生勝利組的弘樹，一\n\
  直以來追尋著桐島的身影，把桐島視為更優秀的存在。但在桐島退社消失後，才驚覺自己\n無處可去，於是問了班上的角落人物，參加冷門電影社的前田：\n「你這樣一直練習拍電影，是為了成為導演嗎？」\n\
  「不，我想不會，但是偶爾，只是偶爾，自己喜歡的樣子跟自己正在做的事情有所連結的\n時候.....」\n\n\n不擅長運動，成績跟長像也不突出，乍看之下失敗的眼鏡男前田，講到自己的愛好卻有隱\n\
  藏不住的滿臉笑意，有自己的熱情與目標。努力的用粗糙的道具與特效製作殭屍片，向學\n校這個小社會反擊自己飽受歧視的生活，嘶吼自己的追求、努力生存。\n『我什麼都不是。』他的笑意讓弘樹哭了。\n\
  \n\n什麼都不是。\n\n\n此片每個角色在片尾都加註社團名字，彷彿有所歸屬，而弘樹的卻留下空白（ ），在他\n認真迷惘後，這空白像是未完待續，或許有天能填入些什麼吧。\n\
  \n\n\n\n\n\n\n當然，青春片不能不拍單戀，當老師發下志願表叨念升學有多重要，請同學好好迷惘、好\n好探索時，已經看見自身侷限的弘樹望向窗外，坐在後方暗戀他的女孩，也隨弘樹的視線\n\
  轉了頭，一起將講台上老師的嗓音變為模糊，即便平日在人際關係之中無法有所牽連，看\n著窗外的那一秒，\n\n那一秒即是她與弘樹共處的小世界。\n\n      \
  \                               本文刊於《文角》2016/9/5\n\n\n\n\n\n--\n《Hipster's Nook\
