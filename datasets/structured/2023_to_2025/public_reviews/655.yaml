url: https://www.ptt.cc/bbs/movie/M.1733890087.A.344.html
title: '[好雷] 心情愉悅的韓版聽說'
content: '劇情上的起承轉合其實大致上很忠於原著

  除了導演有說 因為韓國的長幼更有序

  把姐妹的順序調換之外 大概上看過原版聽說的觀眾 至少不用擔心被鬼轉

  (喔 突然想到 還加了個姊妹家庭 但這邊我覺得是好的加筆)


  當然因此有些朋友會挑剔的原版後段轉折部分

  稍嫌不夠細膩的問題也存在


  但整體而言 整部戲仍是愉快且賞心悅目的

  台詞的部分 蠻多有趣幽默的小亮點

  演員的部分更是優點 姊妹倆盧允瑞跟金珉周都是看了就會微笑的美人

  金珉周在這部的演技更是讓我有點驚艷 原本沒想到能演這麼好的


  男主角洪慶不熟 但就像是更高比較嫩一點的宋仲基 演技也是不錯

  燈光攝影也漂亮 應該是部不錯的約會電影:)


  --'
