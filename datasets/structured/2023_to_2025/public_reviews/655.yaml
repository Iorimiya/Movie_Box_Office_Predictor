url: https://www.ptt.cc/bbs/movie/M.1733467622.A.92B.html
title: '[普雷] 韓版 「聽說」'
content: '雷文防雷資訊頁










  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~










  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  早上首場就看完了。


  原本在電影院那邊，看完的心情，就想要給好雷的。


  但是在回家以後，又立刻重看了一篇台版的作品做對比，


  所以就改成普雷了。


  ==


  整體劇情走向上，沒有什麼大改。


  就是修改了一些年代不同的科技線，


  然後韓版的編劇加了兩段不同劇情。


  但是我覺得增加的部分算是扣分，



  韓版多加的過場，你要說服觀眾，女主角真的聽不見，


  有點不合理...


  ==


  整體來說，就故事劇情的演譯，我覺得台版的呈現比較好。


  彭于晏、陳意涵、陳妍希的組合，


  在造型上比較平衡，比較貼近一般小市民的視角。


  在述事上讓觀眾有空間去體會劇情和角色的心路。




  在韓版之中，也是我原本要給好雷的主要原因。


  就是畫面實在太漂亮了~~~~。



  真的男的帥、女主角美、女配角也美。


  整個就是高規格的典型韓劇造型下去拍。


  男主角：洪慶


  笑容有年青的宋仲基和許光漢的影子



  女主角：盧允瑞  (浪漫速成班主演)

  女配角：金玟周  (IZ*ONE 出道歌手)



  整個畫面上，我幾乎都覺得只在看正妹~~


  就像在新莊棒球場坐在熱區，卻只看富邦三本柱一樣~~~~


  相對的，韓版也省略了一些刻畫女主角人設的小片段。


  ==


  綜合來說，


  台版的適合男女一起看，體驗那種曖昧的感覺。


  韓版的反而更像是啦啦隊見面會，適合男性族群。





  --'
