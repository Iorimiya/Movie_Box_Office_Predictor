  因為每部電影就同樣一個娃娃擺在那 殺人 就這樣而已


  請大家幫我解答!


  確定上映日期是什麼時候? 目前最想看的是13號的猩球崛起最終章(前兩集已補完)


  謝謝大家  我愛洽吉!!(大吼)


  --


  那個....那個.....實現我的夢想(小聲)  摸你的頭  欺負你到哭


