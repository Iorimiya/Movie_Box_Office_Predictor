url: https://www.ptt.cc/bbs/movie/M.1505268896.A.E99.html
title: '[請益] 聽說桐島退社了  看不懂...'
content: '如題 這部很多人推 也拿過很多獎 我也因為這樣去補了


  但看完後不知道整部電影要表達的是什麼...


  他們的關係我都有搞懂 並沒有看不懂的情況


  像是誰喜歡誰 誰討厭誰 還有他們幾個高中生內心的各自想法 我都知道


  但給我的感覺好像是電影才演一半而已 都找不到重點


  整個電影就好像把出場的各個人物都理解完弄清楚後就結束了


  例如:


  管樂社的澤島亞矢:一個發現她喜歡的男生跟別人在一起後就回去管樂社的女生


  棒球部的菊池宏樹:一個沒已經在打棒球可是又想回去打棒球 猶豫不定的萬人迷


  電影部的前田涼也:一個堅定朝著自己夢想前進的人



  看完電影後只感覺到 疑?結束了? 的這種感覺


  就好像連續劇剛演2.3集把各人物都搞懂後就突然結束了 那他們之後的故事呢?


  請問電影要表達的主題是什麼以及電影的重點在哪...


  我不知道我文章描述的好不好 有人看得懂我再說什麼嗎...


  --








  --

  我有看過啦~還看3.4篇了

  像是第一篇影評他說這電影要表達的是誰說青春只有酸甜戀愛或者熱血運動。


  所已是因為我高中時沒有特別追求酸甜戀愛或者熱血運動 所以才沒辦法對本片共鳴嗎

  還好吧 我高中就管樂社的阿 我國中到大學都是管樂社'
