url: https://www.ptt.cc/bbs/movie/M.1631434028.A.68A.html
title: '[新聞] 恭喜好萊塢得梁朝偉！網爆聽說他頭很大'
content: '恭喜好萊塢得到梁朝偉！網爆「聽說他頭很大」杜汶澤曝內幕


  2021/09/12 10:45 娛樂中心／王意馨報導


  港星梁朝偉首次接演好萊塢電影就迎來佳績，他在《尚氣與十環傳奇》中精湛的演出受到

  許多影迷讚揚，全球票房也持續刷新紀錄，更早已飆破40億，話題不斷，而同為港星的杜

  汶澤，在昨天到電影院觀看後，也忍不住讚爆表示：「作為一個從來不喜歡Marvel 電影

  的我，深受感動。」




  ▲杜汶澤在看完《尚氣》後，在臉書大讚梁朝偉。（圖／翻攝自杜汶澤臉書）


  杜汶澤在昨（11日）前去IMAX電影院觀看梁朝偉最新演出的漫威電影《尚氣與十環傳奇》

  ，事後也在臉書分享觀影心得，他在個人臉書提到：「如果有人否定美國電影是紫禁之巔

  ，這不過是酸言苦語，否定他的演技，更是外行之談。他就是美國電影史上最好的華人演

  員，同時亦是香港演員在外發展的最佳代表，他就是最好的。」


  由於這是梁朝偉出道40年來首次接下好萊塢電影，這也讓杜汶澤不禁寫下「恭喜荷李活（

  好萊塢），你們終於得到梁朝偉了」。




  ▲《尚氣》在全球票房持續刷新紀錄。（圖／翻攝自Marvel官方推特）


  杜汶澤回想起他與梁朝偉的淵源是「從中學年代看『新紮師兄』，到長大後有機會一起拍

  電影，到有幸能和他同屆提名金像獎最佳男主角」，坦言「這比起得奬更開心」，並表示

  「梁朝偉一直是他的偶像，沒有之一」。


  貼文一出立刻引來上萬名網友按讚，討論度爆棚，不過卻也有網友留言歪樓說：「聽說他

  （梁朝偉）頭很大。」杜汶澤回應網友：「是，以前邵氏有個不明文規定，做主角頭一定

  要大。」




  ▲《尚氣與十環傳奇》（Shang-Chi and the Legend of the Ten Rings）梁朝偉。（圖

  ／翻攝自HOT TOYS微博）


  新聞網址：


  --'
