title: '[討論] 鄭浩南 聽說當年紅過周潤發 ???'
content: '鄭浩南


  香港演員


  1985年出道


  外型俊朗


  英雄正派腳色能演


  反派三級片腳色也能演


  聽說當年紅過周潤發?


  吳宇森的英雄本色本來要找鄭浩南演小馬哥


  但鄭浩南因為忙著拍其他電影而婉拒


  最後才由周潤發頂替演小馬哥


  反而讓周潤發大紅大紫



  反過來


  鄭浩南之後就淡出演藝圈


  不知所蹤了



  怎麼會這樣呢?


  當年紅過周潤發


  後來沒什麼好作品就消失了


  現在銷聲匿跡




  有人也對鄭浩南這個演員感到好奇與可惜嗎??




  --'
