title: '[好雷] The Face of love 聽說愛情回來過'
content: "當一段關係結束 無論以何種形式收場\n\n人\n\n是否總會找尋 相似 的替代品？\n\n\n在茫茫人海中一眼就可以認出的身影\n\n熟悉的香水味\
  \ 似曾相似的聲音\n\n\n即使再認識了新的對象\n\n所愛上的\n\n是否只是潛意識裡那難以抹滅的熟悉感所投射出來的假象？\n\n\n\n你/妳 真的 走出來\
  \ 並完全的復原了嗎？\n\n\nThe face of LOVE\n\n喪偶5年後 遇到跟丈夫長得幾乎一模一樣的人\n\n\n飾演Nikki的Annette\
  \ Bening  回想起事發現場\n\n坐在泳池旁邊 閉上眼 仍是那不敢置信的一幕\n\n直到手中的酒杯摔破 提醒著自己 回到現實\n\n先生溺死後 再也沒有下去過那個替她一手打造的豪宅泳池\n\
  \n只剩鄰居過來游泳 女兒只有調侃對方的份\n\n\n鄰居(Robin Willams)對Nikki的愛慕\n\n當你愛慕一個人許久 假借各種名義只想待在對方身邊\n\
  \n卻得知對方突然墜入愛河 一股莫名油然而生的醋意\n\n讓大腦不聽使喚 脫口而出的是充滿酸味的嘲諷字句\n\n戲棚下站的再久 不是你的就不會是你的\n\n現實生活中\
  \ 不是每個大仁哥都可以不用再收集好人卡\n\nNikki回應的很好 並沒有撕破臉讓友誼無法繼續\n\n\n一個女人幸不幸福 看臉就知道\n\n遇到Tom後的Nikki\
  \ 不再是三不五時陷入回憶裡哀傷的寡婦\n\n\nNikki 因爲投射作用愛上Tom 卻讓Tom覺得是真命天女\n\nTom是真心愛著Nikki 也是片中最悲情的角色\n\
  \n前妻遇到真愛後離開了他\n\n畫家沒有了Muse 如何畫出動人的畫作？\n\n直到他遇到了NIkki 跑去跟前妻說了那段話\n\n前妻跟他感覺非常適合 Tom話都沒有說完\n\
  \n前妻馬上知道他遇到了真愛\n\n稀鬆平常的對話中\n\n\n\" 這句話我等了10年 \"\n\n\n在感情結束時 被留下的那個有太多的問號\n\n先離開的人不見得沒有悔意\
  \  雖然 不見得可以被接受\n\n\n- 愛情來的太快 讓人始料未及 請原諒我的自私 希望你也能找到一個愛你的人-\n\n這是句事過境遷後 才能有的真實體會\n\
  \n\n兩個病人的對話 替片尾埋下了伏筆\n\n\n“  愛情自始至終就只有一個答案\n    即使荒謬的全世界都覺得是錯的都沒關係\n    只要你們兩個人覺得是對的就好\
  \  ”\n\n忘了在哪看到這段話 在愛情裡的角色不同\n\n感觸 也會有所不同\n\n\n所謂真正的愛\n\n就是在對方離開自己後 能夠希望他找到真正的幸福\n\
  \n這種冠冕堂皇的話\n\n在事發當下\n\n甚至過了好長一段時間 一定不能夠理解\n\n\n直到自己遇到了真愛\n\n才能瞭解 凡事 上天 都有祂的安排\n\n\
  \n一開始 女兒Summer為了男友離開了家\n\n被留下的Nikki有點失落 希望女兒不要為愛癡狂\n\n\n戀愛中的人是盲目的 不管旁人如何告誡\n\n總是願意拿時間去證實一開始就發現的鬼遮眼疑點\n\
  \n\n直到自己遇到了Tom 連鄰居老友Roger 的電話都可以不接\n\n像個小女孩般的嬌羞傻笑答應了約會\n\n\n生活 似乎回歸正軌\n\nNikki也怕\
  \ 大家發現她愛上的 或許只是替身\n\n所有的爆點 就在女兒跟男友分手後直接回家\n\n一開始還非常正向想看看新男友\n\n直到發現Tom的長相跟自己爸爸幾乎一模一樣\n\
  \n無法理解自己的媽媽為何這樣變態\n\n看到Tom  複雜跟喪親的情緒一時湧上\n\n瘋狂的大哭大鬧\n\n\n\n最無辜的\n\n就屬於毫不知情的Tom\n\
  \n\n\n\n(**************這邊開始大雷**********)\n\n\n\n\n\n\n\n生命即將到盡頭 活在當下似乎已是不二選擇\n\n\
  不知情的Nikki 按照自己的劇本把Tom當成替身\n\n想完成當初那個沒有回程的旅行\n\n\n一切隱藏的如此美好\n\n卻在事發地點的被Tom拆穿\n\n\
  Nikki恍神的跳到海裡 終於說出那句隱藏了5年的問句\n\n\n\n有時候 人們追求的答案 其實早在自己內心\n\n只是希望讓自己的行為 有個藉口\n\n\n\
  回魂後的隔天\n\nNikki第一次喊出了\"Tom\"\n\n\n很自私\n但也因此可以正式對內心那個早已支離破碎的喪偶Nikki告別\n\n\n\n時間拉到一年後\n\
  \nTom 過世了 前妻幫他辦了一個畫展\n\n受邀出席的Nikki 不懂為何前妻一看到她馬上認出來\n\n\n直到站在那副畫前面\n\n\n眼前的世界 跟內心的世界\
  \ 是否一致？\n\n\n\n\nNikki 找回勇氣\n\n\n在那個丈夫為他親手打造的泳池裡 微笑的重生\n\n\n這部的原聲帶很棒 看完電影很久才把心得寫好\n\
  \n蘇打綠這首 我好想你 很適合這部電影\n\n推薦給大家:)\n\n\n\n開了燈 眼前的模樣\n偌大的房 寂寞的床\n關了燈 全都一個樣\n心裡的傷 無法分享\n\
  \n生命\n隨年月流去 隨白髮老去\n隨著你離去 快樂渺無音訊\n隨往事淡去 隨夢境睡去\n隨麻痺的心逐漸遠去\n\n我好想你 好想你 卻不露痕跡\n我還踮著腳思念\
  \ 我還任記憶盤旋\n我還閉著眼流淚 我還裝作無所謂\n\n我好想你 好想你 卻欺騙自己\n\n開了燈 眼前的模樣\n偌大的房 寂寞的床\n關了燈 全都一個樣\n\
  心裡的傷 無法分享\n\n生命 隨年月流去 隨白髮老去\n隨著你離去 快樂渺無音訊\n隨往事淡去 隨夢境睡去\n隨麻痺的心逐漸遠去\n\n我好想你 好想你 卻不露痕跡\n\
  我還踮著腳思念 我還任記憶盤旋\n我還閉著眼流淚 我還裝作無所謂\n\n我好想你 好想你 卻欺騙自己\n\n我好想你 好想你 就當作秘密\n\n我好想你 好想你\
  \ 就深藏在心\n\n\n\n\n\n\n\n--"
