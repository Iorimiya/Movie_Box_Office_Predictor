title: '[好雷] 聽說桐島退社了'
content: '試想長大後的在回憶你的校園生活


  你的記憶裡還剩下什麼




  「戰鬥吧，這才是我們的世界，因為我們不得不在這個世界活下去。」






  桐島是一位全能的學生，聽說長的帥、又聰明、體育好、女朋友很正。


  當聽到桐島要退社了，圍繞在他身邊的人的世界一下子崩塌



  排球部的隊員們，對於失去王牌，大賽又將至的徬徨。


  桐島的後補自由球員，突如其來的先發，隊員給予的壓力，自己期望的崩潰。


  桐島的女友，失去明星男友的聯繫，面對眾人的質問的無助。


  桐島的跟班們，失去了頭頭，生活也失去了重心，連打個籃球都是因別人而打


  桐島女友的花瓶同學，當全世界的關注從自己身上移除，才發現自己什麼都不是。




  在這崩塌的世界裡，還能夠在軌道上運行的，就是電影部了。


  僅管不是生活在主流的軌道上，但不盲目追隨的生活


  持續的做好自己的事情。


  就算世界崩塌了，我的重心仍在繼續轉動。






  用了很多角色的視角去拼湊這個故事


  雖然到結尾前都看不懂主旨，但過程中卻讓人無法分神的魔力


  直到結尾慢慢浮現了一些想法...卻還抓不住


  在結束時宏樹看著棒球部仍在練習，搭配著主題曲


  心中的那個惆悵莫名的升起



  我的世界是否為自己而活而轉動過。


  --'
