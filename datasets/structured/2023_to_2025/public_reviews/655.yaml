title: '[請益] 電影"聽說"的小細節(有雷)'
content: '電影後段男主角帶女主角和自己父母見面時,


  女主角說出了 我願意


  原來女主角是聽得見的0_0



  比較明顯的地方是女主角臉從泳池起來後,聽到男主角說話,然後流淚


  是說這邊女主角的臉滿滿都是泳池的水,加上眼睛流出來的淚水,意境頗有意思


  因為淚水和臉上泳池的水混和在一起,


  男主角才沒察覺女主角有掉淚,安排得很巧妙.



  想問大家,電影之中還有那些劇情暗示女主角聽得見?


  細節的部分請教大家~


  ---


  所以妳願意嫁給他嗎?(紙板)


  (夾手搶過)她都還沒答應要嫁給我,你這樣問...


  你沒有求婚怎麼知道人家不答應?


  她還不是我女朋友啊


  不然是什麼友啊?


  "我願意"


  我願意(點頭)



  --


  剛剛在跳著撥放聽說時 發現女主角家裡的門鈴"有聲音"


  如果聽不見,理論上門鈴不需要聲音,只需要紅光閃亮就好,


  覺得自己的推論有點薄弱,但我還是補充一下XD'
