url: https://www.ptt.cc/bbs/movie/M.1559145868.A.2C6.html
title: '[普雷]哥吉拉2 聽說怪獸片是不見血的? '
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  1.影片名稱 :哥吉拉2 怪獸之王


  2.觀影時間 : 2019/5/29 19:00


  3.觀影地點 :板橋威秀 IMAX 3D


  4.觀影方式 : 自行購票




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  不是哥粉，掛免戰牌ING....





  防





  雷





  頁


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  在怪獸單獨展現實力的時候確實是魄力十足，像是我們的輻射大鳥鳥拉頓在空中跟戰機

  纏鬥時的急速上升、展翅還有旋轉通通霸氣外露，讓我超期待接下來的怪獸摔角



  反觀大魔王基哥因為劇情裝甲，所以根本撞不破主角群作的魚鷹，感覺超弱的



  說道基哥就想講，這次基哥是不是不夠金啊?就算是自帶暴風雨也看起來太灰了點....






  接下來回到標題:怪獸都不會流血的嗎?


  在電影裡面雖然打戲不少，但是實在很難感受到怪獸間打得很激烈阿，據說這也是怪獸電

  影的傳統了?



  像是最後一戰的摩姐對拉頓，雖然從後面的表現看起來，拉頓的幾次壁咚對摩姐傷害很大

  但那也是後來摩姐蹣跚的爬到哥老身上才感受的到，不然只看摩姐左擺頭右擺頭就讓拉頓

  自撞下去了。



  哥老吃了好幾發的引力光線也像是只痛不傷，基哥用胸口接原子吐息也堪堪被擊退而已

  這種誰都打不動誰，加上不停切人類視角的作法很沒有感覺啊!!!像是拉頓跟基哥的

  戰鬥切到人類方之後拉頓就跪地求饒了，看到只覺得WTF




  不過基哥那招地球上投感覺真的有夠痛的，好像也只能用躺在地上的時間判斷攻擊有沒有

  效果了



  之所以提到流血是想到環太平洋1的戰鬥，雖然常在海中和夜裡，但是觀眾對於戰況的掌

  握還是很清楚的，想了想發現是因為怪獸受傷就會流出螢光藍的血液，大家就會有



  "歐歐歐歐歐歐歐這招有效了!!!!" "快用等離子炮轟他啊!!!"的感覺



  或許是因為大怪獸在粉絲心中的地位，在電影裡除非必要否則都不會有永久性的傷害，

  不過這也造成了戰鬥實在沒什麼緊張感呢



  期待很久的電影，自己卻HIGH不起來，只能給普雷了。









  --'
