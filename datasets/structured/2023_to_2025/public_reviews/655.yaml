title: '[好雷] 超級瑪利歐兄弟,聽說影評很差☺  '
content: '☺  防雷

  ☺  ☺  防雷

  ☺  ☺  ☺  防雷

  ☺  ☺  ☺  ☺  防雷

  ☺  ☺  ☺  ☺  ☺  防雷

  ☺  ☺  ☺  ☺  ☺  ☺  防雷

  ☺  ☺  ☺  ☺  ☺  ☺  ☺  防雷

  ☺  ☺  ☺  ☺  ☺  ☺  ☺  ☺  防雷


  前言：

  本來還在猶豫要看《鏡之孤城》還是《超級瑪利歐兄弟》，今天早上被

  熱門文章燒到，決定今天先看瑪利歐，明天再去看孤城。

  預告片播到暑假會上映的《變身少女露比》接著是《小美人魚》，兩部都很期待，

  我打算看《變身少女》。


  劇情簡介：

  瑪利歐劇中設定是主角瑪利歐兄弟兩人都在真實世界的布魯克林，

  而且本職是水電工(水管工)。

  兩人意外通過了連結異世界與現實世界的水管。但在前往異世界的途中，

  兩人分別被帶到由魔王庫巴統治的黑暗王國和碧琪公主所在的蘑菇王國。


  想從魔王庫巴的手中救回弟弟的瑪利歐，與為了防止蘑菇王國被侵略的碧琪公主

  一同踏上旅途。


  心得：

  一開始就塑造出瑪利歐是勇敢、靈活、無畏、有兄弟情誼且不屈不撓的形象。

  即使一度自我懷疑、喪志，但他仍能快速振作，突破困難。

  路易吉則是相當害羞的人，雖然總受到瑪利歐的保護，但其實他十分有潛力，

  才能逃脫骷髏烏龜的追捕。在瑪利歐危急之時，

  他也會義無反顧獻身。


  雖然主角是瑪利歐兄弟，但對碧琪、庫巴、奇諾比奧和咚奇剛，甚至是瑪利歐的家人

  等角色都賦予獨特的個性和故事。


  除此之外，慢慢龜和耀西等等大家熟悉的角色也有出現，粉絲們一見到皆驚喜連連！


  結局是庫巴被囚禁，而片尾的彩蛋則有耀西的蛋孵化的徵兆，看來是為了

  續集做伏筆。 ☺

  -----

  Sent from JPTT on my iPhone


  --'
