url: https://www.ptt.cc/bbs/movie/M.1649264177.A.8EF.html
title: '[討論] 怎麼看＃聽說＃這部電影？'
content: '如題


  有雷


  前幾天看了 今年奧斯卡最佳影片


  樂動心旋律



  老實說我覺得普雷


  關於親情與夢想之間的掙扎


  身為家裡唯一聽的到的小孩


  常常被同學霸凌


  又為了要保護家人不可以惹事


  我覺得這一部分拍的不夠虐心


  不夠讓人入戲


  但是很勵志


  關於聽障的電影


  這讓我想起國產電影聽說


  彭于晏跟陳意涵演的


  這部電影我覺得拍的很溫馨


  陳意涵為了照顧姐姐


  必須工作養家


  姐姐雖然是聽人 但努力追求夢想


  最後姐姐希望妹妹不用過度照顧她


  希望妹妹去交男友


  去過自己的人生


  這部電影最後的爆點


  我覺得是整部片最厲害的地方


  陳並不是聽人


  而是正常人


  陳以為彭也是聽人


  於是兩人談了一場 聽不到的戀愛


  我覺得聽說的深度


  完全不輸今年奧斯卡最佳電影


  各位怎麼看




  --'
