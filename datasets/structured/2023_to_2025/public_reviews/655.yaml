url: https://www.ptt.cc/bbs/movie/M.1520952147.A.D1E.html
title: '[新聞] 俄大學台灣電影週 勵志片聽說打頭陣'
content: '（中央社莫斯科13日電）俄羅斯莫斯科市立師範大學外語學院12日起舉辦「台灣電影週」

  ，首部電影為導演鄭芬芬執導的「聽說」，未來一週還將播放5部台灣電影，包括奧斯卡

  得主李安的經典「推手」。


  莫斯科台灣同學會與莫斯科師範大學外語學院共同策劃的台灣電影週，12日至16日放映多

  部電影，包括「聽說」、「翻滾吧！阿信」、「推手」、「艋舺」及「魔法阿媽」等多部

  具代表性的台灣影片。


  2009年台北舉辦聽障奧運，鄭芬芬執導，陳意涵、彭于晏主演的「聽說」，描述用愛與勇

  氣追求夢想，跨越聽障，充滿溫暖與青春的愛情電影，曾在新加坡、香港、南韓、中國等

  地放映，獲得高度評價，2010年獲得日本大阪電影節最受歡迎人氣獎。


  駐莫斯科代表處文化組長許德明表示，台灣電影週的影片是由財團法人國家電影中心徵稿

  提供，期望將台灣電影擴大到其他地區放映，提升台灣影片的能見度。（編輯：廖漢原）


  新聞網址：


  --'
