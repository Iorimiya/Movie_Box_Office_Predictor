url: https://www.ptt.cc/bbs/movie/M.1624730061.A.7E4.html
title: '[討論] 聽說 桐島 退社了'
content: '2012的電影了

  因為最近台灣很常講到類似的詞...

  被演算法推薦

  然後看到得到那麼多肯定就補看



  以下雷

  整部電影 電影名字裡面的那個人都沒出現

  但他做什麼都能影響著大家

  其中神木隆之介是屬於邊緣人的角色

  不過他比起其他討論桐島的那些

  學校的核心人物？

  更知道自己要做的是什麼

  彷彿在暗示觀眾思考 誰才是生活的邊緣人

  需要大家自己想想才會知道？


  感覺是一部讓人能好好思考的電影

  不過中間我暫停好幾次才看完


  板上有看完的人覺得如何？


  --'
