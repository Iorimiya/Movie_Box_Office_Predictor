title: '[新聞] 《世界最長的照片》月底公開 導演聽說高'
content: "新聞網址：\n\n\n改編自譽田哲也同名暢銷原著，金氏世界紀錄保持人山本新一真人真事的《世界最長的照\n片》，由新世代偶像高杉真宙、武田梨奈主演，電影描述一個看似內向又毫無企圖心的攝\n\
  影社成員，在一個偶然的機會，得到一台特殊設計的全景相機，進而說服讓全年級的同學\n一起參與並拍攝了一張145公尺長的全景照片，也讓大家對他的印象完全改觀。高杉真宙\n\
  表示，自己和主角的個性基底非常像，消極內向，又無法坦率說自己的意見，讓人誤會自\n己是個很沒有想法的人。「我在中學時代也經常說不出自己真正的想法，總是只會『是，\n\
  我明白了』地應和他人，隨波逐流。現在應該有好一點，畢竟面對工作，還是得說出自己\n的主張及意見，不好好表達出來是沒辦法守住自身角色的。」他表示，可能是因為對演戲\n\
  產生的渴望，所以要更學著坦率說出自己意見，這種感覺就像主角宏伸之於相機，找到了\n不可不堅持的連結。而導演草野翔吾也表示，身邊的人向他推薦高杉真宙，說他謙虛、穩\n\
  重，又帶點宅男的感覺，聽到這樣的評語，他甚至還沒見過本人就把高杉真宙當成這個角\n色的不二人選。草野翔吾：「實際上確實也是如此，一到拍攝現場就覺得是非常正確的選\n\
  擇。」電影成果如何？待11月30日正式上映便可揭曉給觀眾。\n\n本片改編自以《草莓之夜》及《武士道》系列作聞名的暢銷作家譽田哲也的同名小說，而\n故事的藍本是來自日本愛知縣福祉大學附屬高中的一件真人真事，山本新一是目前金氏世\n\
  界紀錄拍攝最長(大)照片的紀錄保持人，以一台手工的全景相機做拍攝，照片共長145公\n尺、高35.6公分，在2000年12月登記金氏世界紀錄，至今無人能超越！除此之外，本片也\n\
  集結了許多新一代青春偶像，包含去年以《散步的侵略者》等六部電影作品一舉獲得第九\n屆TAMA電影獎最佳新進男演員獎的高杉真宙，今年作品也多產，是近期頗受矚目的新星演\n\
  員，有空手道美女演員之稱的武田梨奈，今年不僅有主演電影在日上映，廣告代言也不少\n，是近年人氣升高的女星之一，另於今年夏季日劇《謝謝你，在世界的角落找到我》首次\n\
  主演的松本穗香，海內外人氣扶搖直上，這也是他爆紅後首次電影作品登台。另外偶像團\n體BOYS AND MEN的水野勝驚喜的客串演出，也為電影增加了不少亮點！\n\
  \n電影故事講述沒有夢想及目標的高中生內藤宏伸（高杉真宙　飾），漫無目的地數著饅頭\n等畢業，就連加入攝影社也常因作品遲交常常被三好社長（松本穗香　飾）臭罵。在高中\n\
  生涯最後的暑假中，宏伸在表姊溫子（武田梨奈　飾）經營的古董店發現了一台特別的相\n機，好奇心驅使下，宏伸去詢問了附近攝影店的店主宮本賢一（吉澤悠　飾），進而發現\n\
  這是一台「為了拍攝世界最長最廣角的照片而設計的特別相機。」於是，在宮本的指導下\n，宏伸開始使用這台相機拍照，每天騎著單車尋找漂亮的風景，也被一張張前所未見的照\n\
  片所感動，突然間，像是找到了生命的熱情般，宏伸的生活找到了目標，決定和社員們一\n起研究如何用這台相機拍攝出「世界最長的照片」，為高中生涯做個美好的總結。台灣將\n\
  於11月30日正式在台上映，更多電影訊息請上中影國際粉絲團查詢。\n\n\n--\n                                 11/05\
  \ 21:19"
