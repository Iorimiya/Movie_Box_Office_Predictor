url: https://www.ptt.cc/bbs/movie/M.1739571686.A.908.html
title: '[普好雷] 狠狠愛'
content: '從大學開始在批踢踢已經二十個年頭 movie版是最早加入我的最愛清單的幾個版之一

  也常常在看完電影後 拜讀大家的影評



  自從二寶出生後很少有機會可以進電影院

  情人節這天好不容易丟包小孩給阿嬤三小時 就想記錄點甚麼

  沒想到這一篇竟然會成為我電影版的首po


  先說結論好了  我覺得意外的還不錯!

  也不知道是不是太久沒進戲院(上次是阿凡達2)太開心所以標準很低

  但我覺得蠻緊湊的至少沒讓我看到想睡覺



  會想看這部片主要是因為還蠻喜歡關繼威 而且他的演員之路故事很勵志

  所以想要支持一下

  昨天忍不住偷偷瞄了imdb的評分 分數不是很好有點緊張 想說會不會很爛

  出乎意料的我還蠻喜歡的



  這是一部很簡單的戲

  如果很注重角色心路歷程堆疊、劇情反轉、深刻的情感表現等的觀眾可能就會覺得

  這部片很莫名其妙

  做為一個輕鬆看不要想太多、不要太在乎合理性的爽片倒是很不錯





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  說說我喜歡的點吧

  第一是那種有點荒謬的黑色喜劇感


  1.詩人殺手和地產公司的女助理突然墜入愛河

  2.殺手二人組邊執行任務邊嘴砲

  3.房仲對手不自量力跑來幫忙結果秒被爆頭

  4.男主哥哥每次出場都在喝手搖而且武器竟然是吸管

  (那吸管是甚麼可怕的強化塑膠 以後吸管要列入捷運違禁品了>"<)



  第二個我喜歡的 是看到殺手的人性面

  一般的動作片對於這些追殺主角的人通常是各個滿臉橫肉 面目猙獰

  而且就是要看主角終結他們 完全不會憐憫他們的死活

  但這部的其中一個殺手還在煩惱跟老婆吵架怎麼辦

  而另外一個詩人殺手則因為愛

  跟地產助理去找男主時 還很乖乖的聽話沒有一進門就目露凶光 大殺四方

  反而像頭被（暫時）馴服的野獸

  不覺得這些殺手很可恨、可怕   反而覺得有點可愛


  第三個喜歡的點是打鬥的配樂

  明明很激烈但好像很常聽到很歡樂(?)的聲音


  第四個喜歡的是主角哥哥的老巢是dvd出租店

  最後決鬥有一個場景還有很像霸王別姬的海報

  讓整體的氛圍有種致敬港片的意味



  我先生說他不太喜歡很多背景用口白的方式呈現 他覺得應該要「演出來」

  但我反倒是蠻可以接受的

  這部片才83分鐘是要交代甚麼

  聽聽口白自己全部腦補完然後趕快入戲就對了!!!!!!!



  我一般是喜歡比較嚴肅的劇情片

  但可能帶小孩太累了 現在只想看能放鬆笑一笑的片

  如果版友們有甚麼推薦的帶點荒謬感但畫面處裡好看、配樂好聽的片

  歡迎推薦!!



  --'
