url: https://www.ptt.cc/bbs/movie/M.1738902514.A.C5B.html
title: '[負無雷] 【狠狠愛】虎頭蛇尾的情人節電影'
content: '‧


  有著良好的第一幕開場，很快的將親和房仲及退休殺手人設反差，快速展露讓觀眾了解，

  加上關繼威的奧斯卡光環加成，【狠狠愛】打算透過這樣的元素，打造出適合情人節的動

  作喜劇；但一部動作喜劇，如果缺乏了動作或喜劇成份中的一環，導致要喜劇沒笑點、要

  愛情沒浪漫、要親情沒感動、要打戲也缺乏亮點情況下，我想演員再有魅力或者光環，也

  難以救援劇本所帶來的平淡無奇。



  ‧


  問題都大概出在第二幕劇情中段，短短84分鐘片長的電影，卻讓人感到無比的冗長感，敘

  事有點雜亂，節奏瞬間緩慢許多，武打動作雖然不算非常出色，不過打鬥鏡位還算良好，

  還是有成龍武打喜劇的影子，但的確還是能滿足一點的娛樂效果，當然也出現了捍衛任務

  的梗。


  雖然是部情人節電影，但關繼威與亞莉安娜之間的愛情化學反應，少之又少，遠遠少於兩

  名配角莫名其妙的一見鍾情，甚至兩人前因後果也只是略略帶過，但亞莉安娜在劇中還算

  是個美麗迷人的角色，雖然戲份不算多，至少比獵人克萊文裡的演出還要好一點。



  ‧


  我仍然喜愛關繼威這位演員的演技及魅力，也更愛他背後的勵志演藝人生，但【狠狠愛】

  在許多環節上出了點問題，做為一部情人節檔期的作品，雖然是可以不帶腦放鬆觀看的爆

  米花約會電影，觀看門檻也低，但也許有其他更好的選擇。



  「阿祖，收手吧！強求的親情不會甜

  你手中的手搖飲比較甜。」




  ‧




  茶太郎日常雜談





  --'
