title: '[好雷] 《我恨我自己》- 世界上最自戀的兩個人'
content: '網頁好讀版：



  看到《我恨我自己》是世界上最爛的人製作團隊，我就決定一定要看！



  北歐電影真的都領先我們十年以上。

  當我們還在討論身心障礙者的生活空間跟保障，

  芬蘭《不看鐵達尼號的男人》已經在討論身障者的「自由」；

  當我們在討論對愛情工作的追求，

  《世界上最爛的人》已經承認我們永遠都在追求的迴圈跟往返中無法停止而傷害別人。



  而當我們在討論抖音或社群媒體對年輕人的影響，

  已經有人用如此有創意又激烈的手段表達「求關注」跟「自戀」的主題。



  本片英文翻譯非常有意思，Sick of Myself，可以說是我自己生病了、我自己的病，也可

  以解釋成I''m sick of myself，無論怎麼解讀都很有意思。



  ---------以下大雷--------------




  本片開始就充滿嘲諷。女主角席格娜跟男友湯瑪士在高級餐廳過生日

  （我們甚至不確定是不是真的生日），

  叫了2300美金一瓶的紅酒，並請餐廳人員送上蠟燭跟蛋糕，

  真的是演到極致，然後計劃好將紅酒偷走不付錢。

  此時，席格娜說：那你要跟朋友說是我偷的。為什麼？

  就為了後續派對可以跟朋友炫耀，可以在派對中成為焦點，成為最酷的人。

  但在派對上，席格娜還是不受重視，她只是一個藝術家的女友。　




  那男主角湯瑪士從事什麼樣的藝術呢？

  去家具行偷家具，偶爾稍微加工，

  然後找上有名的藝廊老闆在小有名氣的藝廊幫他展出。

  就這樣，真的就這樣。

  就靠這樣成為被藝術雜誌採訪的藝術家。

  我們不得而知雜誌社是否知情，若知情也認為這是藝術，真是太黑色幽默了。





  展出前後，席格娜跟男友在跟朋友或參展眾人中都不是焦點，

  她故意嗆明男友想的展覽名稱為何要用英文而不用挪威語，

  在我看來只是為了發表意見而發表意見，讓人覺得她有點見地。

  展覽後，她發現無法跟任何人搭上話，甚至男友都沒提過她，

  很多人還以為她是湯瑪士的妹妹；她突然聲稱自己堅果過敏，

  勉強可以跟旁邊的人攀談幾句，後來開始乾脆演出嘔吐，

  終於引起眾人關注叫救護車，但男友堅持講完自己的展覽感想，

  大吼：我只想做個總結！




  這兩人真的是一個鍋配一個蓋，我還真不知道誰比較耽溺自戀。




  逐漸逐漸，她為了「引起注意」，開始說謊跟做奇怪的事情。

  一天她在烘焙坊，遇到有人被狗咬倒在她懷裡，

  有其他人伸出援手她卻要大家離開，並告訴警察跟記者：

  大家都只是旁觀。

  但發現這件事沒有引起什麼注意，她竟然想逼路邊的狗咬她。

  一天，她發現一種來自俄國的抗憂鬱藥物會引起嚴重的皮膚病，

  她慢慢服用，終於有天達到她要的效果：

  她爆發嚴重且找不到原因的皮膚病，

  蔓延全臉跟部分上半身。在這裡，當她在做腦部ＣＴ時，

  她開始了臆想：

  醫生發現她竟然為了博取關注而使用禁藥，已經請警察準備逮捕她，

  她在

  ＣＴ中大尖叫而中斷。無論跟臆想有沒有關聯，她拒絕更精密的檢查並出院。




  出院後的她，第一句台詞是：

  56則訊息跟幾個人探病，就這樣繼續過日子？

  有趣的是，雖然這裡有說出社群訊息，

  但電影中僅有這幕跟另一幕要求湯瑪士幫自己拍照上傳社群媒體的段落。

  導演在維基百科中說：他寫這個劇本時人在洛杉磯，很大受到那邊氛圍的影響，

  所以我們可以理解也許北歐這種「求關注」的問題沒那麼嚴重，

  反而是洛杉磯文化開始有這樣的轉變，而且不只是出現在社群媒體上。





  超變態，女主角當時皮膚已經很嚇人，

  為了得到人們的關注，要做到什麼程度？更變態的還在後頭。



  自戀噁男湯瑪士跟帶著燒傷面罩的女友上公車，

  發現有人看著他們，於是他環繞女友的脖子，

  並親暱地將臉靠上去，對方都感動了。




  被關注跟維持形象，就是他們兩人生活重心。

  女主角病後主動求歡，

  連做愛時都是想著自己的葬禮有多長的人龍，自己最恨的人也出現

  但不得其門而入，要「被關注被在乎」才能高潮。




  而她也終於如願上了新聞，在採訪期間，

  湯瑪士甚至希望她不要坐自己偷來的椅子藝術品，「會影響展覽。」

  還是很想說真的一個蘿蔔一個坑。

  沒想到新聞一上就被槍擊案蓋過；

  後續她獲得成為模特兒的工作，

  某時尚雜誌主編希望「像她這樣的人」也能成為時尚，

  這裡充滿諷刺，主編雇用盲人當助理，

  可理解盲人倒水、帶位都有難度，

  主編明顯不耐煩卻硬是為了雇用而雇用，其實跟對女主角態度一樣。

  當她跟朋友分享自己終於成為模特兒，

  朋友有點擔心的說：會不會像是把受害者展露給外界看的感覺？

  女主角大怒反嗆：妳就不會恭喜我？難道妳最近有什麼建築曠世巨作？

  朋友們無語，只說男主角永遠在批評女主角，而他們也受不了女主角這種苛薄了。




  她為了維持「熱度」，什麼謊話都願意說。

  派對上有人提到某樂團，她就說她是粉絲，

  他們竟然轉貼她生病的新聞，

  被男友反嗆那妳最喜歡哪首歌卻講不出來；

  發現新聞記者朋友在討論賣藥給她的藥頭，

  直接跟人家說藥頭死了，然後突然開始抽蓄，

  之後有更多的身體狀況，反正只要出狀況，大家會停止話題並開始注意她。




  女主角出現許多臆想：

  成為模特兒後她那高高在上的男友終於求她當自己下次展覽的主體

  、她上了新聞台，她最恨的兩個人都來道歉、她甚至成了暢銷書作者。

  後續也有她後悔，跟記者坦承她是讓自己生病的。

  最有趣的是藥頭把藥給自己跟媽媽吃，也出現一樣症狀，

  這裡，我一點都不認為她有罪惡感，她只是怕被發現。

  後續也有藥頭跟記者說明這一切都是謊言的片段。

  本片許多臆想跟現實的剪接並不明顯，哪幕為真何處為假，

  哪些是女主角最深沉的渴望，就要靠自己判斷了，非常有趣。




  最後她因為用藥過量無法完成模特兒的工作，

  她為了成名不擇手段到把別的模特兒關在廁所，

  但最後只能淪落到在長照中心講出自己終於變得很嚴重的病症

  （一開始被其他人嗆根本還好），

  而且在那裡，完全沒有人聽過她男友是誰，

  再也沒有其他光芒遮蓋她了。我的電影摯友郭律師說：

  這個結局實在很適合她，她可以一直講話不被忽略，

  而且說的也都是真的了（或許持續誇大病症？）。





  我必須承認，在《世界上最爛的人》中，我比較有共感，

  我認為大多數人都經歷那樣的糾結；

  但這部片雖然讓我比較沒有共鳴，畢竟我不太在意社群媒體，

  陌生人跟點頭之交最好也不要來煩我，

  但其表達手法讓人驚艷，有種「怎麼想得到」這種主題的感覺，

  我也在思考到底是網路世代才有這種問題，

  還是地區差異，無論如何值得一看。







  --'
