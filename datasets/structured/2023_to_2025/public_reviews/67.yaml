url: https://www.ptt.cc/bbs/movie/M.1760783253.A.9E7.html
title: '[普無雷] 闇黑電話2'
content: '簡單來說，這部就是第一集的擄童犯被消滅以後，透過某種力量化身為惡靈繼續展開殺戮

  。




  本劇其實主要擴充前一集的世界觀，除了跳脫原本那座小鎮的侷限，這次還藉由擁有靈異

  體質的女主角而分成了三個時間軸，回追到早於「第一集之前」和「ㄧ與二集之間」未因

  擄童犯消失而停歇的失蹤案，片頭甚至率先帶出前作未曾提及的重要角色，讓整體架構更

  為完整。



  但問題來了！導演採用了舊式膠卷鏡頭的質感來展現過去或夢境的片段，而這原本就是很

  常見也很有懷舊感的拍攝手法，但問題是本片對於這種風格的依賴過於頻繁，長時間大量

  靠著這種方式主導整段劇情，再加上畫面又過於模糊且顆粒化，長時間觀看下來，對我而

  言真的有點不舒服啊！



  而劇情的部分，前半段主要以持續惡夢纏身與通靈電話的鬧鬼橋段為主，角色多處於焦慮

  或無助的狀態，所以在整體氛圍感覺上會顯得較為詭異、懸疑。而後半段隨著真相逐漸揭

  曉，加上惡魔的身分更加明朗，然後無時無刻還穿插不少黑色幽默的元素，對比起來，後

  半反而就不怎麼恐怖了。



  但整體來說，劇情方面還算是成功啦！畢竟身為一部恐怖片，確實展現出了編劇該有的豐

  富想像力，就算再怎麼凹，只要能合理解釋、讓觀眾信服，基本上其實就是恐怖片成功的

  一環了。



  只是美中不足的地方是，故事雖然一應俱全了，角色也更加立體了，但是整體大多還是呈

  現平鋪直述的敘事方式，節奏略顯緩慢，缺乏眼前為之一亮的驚喜，且在收尾時感覺又來

  的太過倉促，在最後那ㄧ通的心「電」感應，不知道是不是我太沒同理心了，實在沒有打

  動到我XDD



  至於本片觀影氛圍趨向「劇情大於恐怖」，不管有沒有看過前一集的人，如果重視的是故

  事結構，能接受些許不合邏輯但仍有解釋的劇情，那這部還是值得一看的，不過對於追求

  重口味、恐怖刺激的觀眾來說可能會有些失望，而且噁心和驚悚的畫面通常都輕輕帶過，

  整體表現上這方面確實還蠻平淡的，既不算很恐怖也沒有到很精彩！





  觀影證明




  133


  --

  算有始有終 主要是走劇情路線'
