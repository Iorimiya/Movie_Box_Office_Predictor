url: https://www.ptt.cc/bbs/movie/M.1422712530.A.85B.html
title: '[好雷] 推拿'
content: "防雷頁\n\n另外有提到一點《浮城謎事》，所以兩部電影雷都有XD\n\n\n\n\n\n\n\n\n---------------------------------------\n\
  \n\n\n\n\n    我與婁燁電影的初次相見，是在2012年的《浮城謎事》，所謂相見恨晚，大抵說的就\n是如斯。\n\n    14年婁燁帶著《推拿》再次強勢問鼎金馬，有幸在當時的觀眾票選最佳電影場次即已\n\
  得見，當時便跟其他同時入圍的四部和在一起寫了個大鍋炒，幾句就交代了過去，確實是\n懶惰了些。拜有關當局(怎麼寫個陸片連文字都官腔起來？)修改相關規定之賜，今年得以\n\
  在院線再與《推拿》相見，只好乖乖再交一次作業。\n\n    我最喜歡婁燁的地方，還是在飽滿如怒濤般奔洩的情感釋放，直接而兇猛，每次出手\n幾乎都是刀刀見骨的直接往你心底掏挖，從《浮城謎事》的犀利人妻到這次《推拿》的多\n\
  角糾結皆然。這次除了情感上的衝擊之外，為了表現這樣一部以盲人為主題的電影，婁燁\n更同時帶來視覺與聽覺的技術層面震撼。為了呈現令觀眾觀影時能對片中盲人世界感同身\n\
  受的盲視覺，整部電影幾乎就是一場大型的光影實驗，無論明暗、焦點等的來回切換，在\n炫目迷離之外，更具有強烈的象徵意義。而為了表現取代盲人視覺而成為最重要對外感知\n\
  的聽覺，我們也看(ㄊㄧㄥ)到在電影中一場場的群戲裡，同時不只一處發生的對話中精彩\n無比的聲音表現，還有幾場即使閉上眼睛，也無損觀眾接收當下情感表達的經典對戲。\n\
  \n    不過在我第一次看完《推拿》之後，其實是有些覺得不太滿意，這種期待越深失望越\n大的情緒，直到這回第二次看過總算是比較有了些概念。相較《浮城謎事》中聚焦在兩個\n\
  女人之間，《推拿》同時占據主要篇幅的角色更多，至少同時三條主線進行的狀況之下，\n難怪任何一條線於我都總有點意猶未盡交代不清之感。想通了這點，於是對於自己期待同\n\
  樣於《浮城謎事》中濃烈後勁而不可得的失落，便也釋懷許多。\n\n    想起我自己曾形容過這部電影是盲人版《世間情》，其實是不太精確，但同樣的劇情\n文本，如果把盲人角色通通改回一般明眼人不知又會是怎樣的一番景象？是會俗艷而不可\n\
  耐還是同樣能有如此令人仰望的藝術成就？\n\n\n\n\n--"
