title: '[好雷]推拿'
content: '自由，包含「選擇的權力」。這個詮釋是否完美，也許就在我們對自由的反問中有了答案

  ，「如果自由是選擇，那麼選擇少，或者沒有選擇是否意味著失去自由？」


  § 看得見與看不見

  婁燁的作品《推拿》，讓我想起兩部作品，一個是電影《盲流感》（Blindness），世界

  流行一種傳染病，得到的人都會失明，女主角本身因體質特殊，所以她依舊保有正常人的

  視覺。但為了融入社會，她選擇隱藏自己「正常」，但不合群的能力，直到和一些值得信

  賴，不以利用她為目的的朋友相遇，以及面對部份企圖剝奪他人權益，滿足私利的失明者

  迫害，她才對少部份人坦承自己的特殊性。


  另一部作品是則日本作家的短篇小說，內容描述一位橄欖球選手受傷住院，但因為一些醫

  院方面的問題，他和一群弱智住在同個病房。有天夜裡，他發現護士會幫這些弱智者打手

  槍，將之是為工作的一部分。橄欖球選手鼓舞這些弱智者，要他們活得更有尊嚴，拒絕護

  士幫自己手淫。後來弱智者們響應他的理念，直到有天橄欖球選手出院，他們失去了意見

  領袖，意志日漸軟弱。慢慢地，一切又恢復往常，幾個夜裡，護士會幫這些弱智者打手槍

  。



  § 自由的辯證

  在《推拿》中，婁燁描述的，正是一群被剝奪者。


  盲人，有些是先天失去視力，有些是後天造成。無論先天或後天，相較正常人，他們在一

  定程度上都是權力的被剝奪者。多數人都能看得到，看得到是正常，失去權力，等於失去

  正常。失去正常，意味著失去人的本質，變得不像人，變成一種獨特的存在。但這種獨特

  不是令人稱羨的，而是在這個「正常人」充斥的社會，活得綁手綁腳。


  部份的自由被剝奪，有時比完整的自由被剝奪更讓人痛苦，就像介於生與死之間，就像貧

  窮的程度接近可以領取低收入戶補助，卻還差那麼一點悲哀，以至於活在不上不下的灰色

  地帶中，最接近下線的區塊。那是最痛苦的區塊，而部份盲人就活在這個區塊。在盲人推

  拿院中，沙復明等人都有謀生能力，可能日子還活得比某些幹保潔的民工強，但他們的失

  明是無法改變的事實，就像都紅的美是一個永遠無法被看見，只能在沙復明腦海中的模糊

  想像；就像愛情對於金嫣，婚姻對於泰和；就像挑動小馬情慾的嫂子；就像王大夫在家中

  ，做為一位身有殘疾卻深黯事理，挺身照顧全家，幫軟弱的父母照顧游手好閒的弟弟，微

  弱而不公的親情。那些東西都隨著眼前的黑暗，成為摸不著也看不見的東西。



  § 失去，還是交換

  有些東西失去不可怕，可怕的是失去的人佔了少數，自己正巧屬於少數。盲人用觸覺去感

  受一個人的輪廓，用聽覺去理解一個人的話語。通過話語我們試著理解一個人，但在觸覺

  與聽覺之外，埋藏在黑暗中的人心是那麼的不可解，而最可怕的就在於有時我們理解了一

  個人，看見了那個人的缺陷，我們卻無法與之分別。當有人抗議伙食費被阿姨坑了，多數

  人選擇沉默，這一個事實，早就是按摩院大夥兒睜一隻眼、閉一隻眼的事實。這是一種選

  擇，選擇用部份的黑暗換取光明——用部份的退讓，換取在生活上能得到正常人的照顧。


  已經失去的不可能回得來，無論是不是盲人，我們在生活中通過進行各種交換，好得到當

  下我們最需要的事物。這使得「失去」可以變成一種「獲得」的途徑，「被剝奪」能夠轉

  化為一種「交換」，取得選擇的正當性。這個正當性，被某些人視為人性的一部分，性交

  易的合法與否，同樣也是一個「交換」的倫理議題：贊成性交易合法的人，認為用肉體「

  交換」金錢符合人性；反對性交易合法的人，認為「犧牲」肉體獲得金錢是一種人性的墮

  落。


  但即使是最反對出賣靈肉的人，在面對必非為了名牌包和富裕生活，而是真的因為生活困

  頓，沒有其它選擇的性公工作者，也不得不給予其投身賣淫的同情。當反對者只能給予同

  情，卻無法給予解決之道，反倒使得其反對的立場在生存面前失去正當性。


  反過頭，盲人怎麼看待自己的盲？至少「失去視力」這一點是毋庸置疑的事實，而在這個

  事實之上，對於生活中不的不進行的妥協，那是否是他們探問幸福的一種交換？就像張一

  光看著幾乎快對嫂子犯罪的小馬，帶他去嫖妓，這是幫助小馬找回心靈的平靜，回歸正常

  生活，還是推其入坑的損友行為？


  不盲的人，生活安逸的人，是否有權力因為自己在人數和能力上佔優，而去界定一個標準

  ，用自己的世界觀去規約他者的自由？


  畢飛宇通過盲人按摩院的故事，婁燁又通過畢飛宇的故事，他們共同訴說著盲人的生活，

  指涉著自由的課題。最終我發現無論我們怎麼給自由下定義，都無法用自己的自由觀去批

  判他人的自由觀。



  §結語

  王大夫和小孔做愛，小孔問他：「我們是幾個人？」王大夫說：「一個。」


  有些被剝奪是看不見的，有些是看得見的，若自由是選擇，選擇造成失去與獲得。對某些

  人來說，他們起初的選擇就比其他人少，他們在更多的失去與獲得之間，選擇通過交換的

  方式，讓自己即使得不到更多，至少不要有更多的失去。


  明眼的小蠻和盲眼的小馬之間的愛情，在充實心靈的交往中，他們跳脫了盲者的失去，在

  彼此的靈魂看見不足與豐滿，進而相愛。


  誰不是這麼活著？


  誰真的比王大夫活的自由？


  「我們都有部份的盲，且有部份的自己活在黑暗中」，我只知道這麼多。





  --'
