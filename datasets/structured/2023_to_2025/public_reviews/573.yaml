url: https://www.ptt.cc/bbs/movie/M.1422189295.A.BD1.html
title: '[好雷] 推拿 - 是誰的痛？'
content: '無音樂網誌好讀版：


  (註：本篇不特別介紹劇情內容，但文中可能提及劇情片段，不喜慎入)















  一張看起來非常痛的電影畫面截圖，

  應該算是電影《推拿》的寫照。


  導演婁燁不改《頤和園》的敘事手法，

  無論是情慾的探索、生活的挫折、內心的掙扎等，

  鏡頭下的角色總是將豐富的情感化為衝動，

  呈現在觀眾眼前的結果便是一幕又一幕的「痛」。




  「痛」當然不是明眼人的專利，

  因此《推拿》中的人物雖是盲人，

  「盲」在導演眼中卻只是一種狀態，

  而非他最重視的敘述核心。


  如以主流社會的觀點，「盲」是一種生活上的不便、

  一種重要且受汙名的自我特質，

  但《推拿》意不在討論「盲」與「明」的差異性，

  而是在「盲」的脈絡底下詮釋劇中人物的目標和慾望。


  正因如此，這部電影讓我們看到一種不同以往的觀點 --

  試圖以盲人為敘事主體，反觀整個「主流社會」。




  實際上要做到這點並不容易，

  因為「電影」本身的性質已將盲人杜絕在外，

  但導演仍大膽地做了許多實驗性的嘗試 --


  包含開頭利用旁白朗讀演職員表、電影開頭的黑白畫面，

  及以特殊拍攝手法模仿小馬恢復部分視覺後的視角等，

  確實能讓觀眾對盲人所處的情境有更多覺察。


  不過，除非整部電影全無畫面只有聲音表演，

  許多較為細膩的情節仍有賴視覺才能被傳達；

  比如小馬對「嫂子」的非禮、

  沙老闆偷聽小馬及都紅對話等，

  都只成立於「盲」的互動基礎上。


  因此我們更能深刻理解，

  一個明眼人或許能試圖捕捉「盲」的概念，

  卻很難抓住「盲」的真正精隨 --

  只因他仍存有視覺的想像。




  這也點出先天失明及後天失明者的差異；

  劇中後天失明者如小馬、金嫣、張一光等，

  都曾有過「視覺的想像」，

  每個人應對這種「失去」雖有不同，

  但卻很難跟「天生就不曾擁有」一樣。


  因此直到聽見別人說都紅「美」之前，

  沙復明都不曾可憐過自己，

  而小馬卻在得知視覺再也不會恢復那一刻就拿著碎碗抹向頸動脈。


  躺在地板上血如泉湧的小馬，

  對照電影尾聲他雖恢復了部分視覺，

  卻閉上眼睛大大微笑，

  此情此景著實非常動人，

  一如片尾曲的歌詞：

  「如果時間可以倒流，我會在第一天就閉上眼，然後什麼都看不見」




  除「盲」以外，本片的另一個觀看重點是「社會」。

  許多人認為沙宗琪推拿中心是社會的縮影，

  也有評論提到該中心的分崩離析，

  證實了社會主義難以成立。


  從未生活在社會主義脈絡下的我，

  無從為這層解讀下任何註解，

  然而在我看來，沙宗琪推拿中心亦非是單純的社會縮影。


  首先，在這裡的人幾乎全是盲人，

  先天上有一種共同的限制，

  對於這種限制，所謂「健全人」的認知非常片面。

  再者，推拿中心仰賴健全人的光顧而無法自給自足，

  因此便時時刻刻必須面對健全人的刻板印象所帶來的挑戰。


  這些特質不僅使得推拿中心孤立於主流社會，

  同時亦使其成員彼此間的距離較一般人親密；

  缺乏隱私的生活更讓每個人的事放大成所有人的事。




  高度相依存所激起的碰撞與火花，

  相較一般社會當然強烈許多，

  且婁燁鮮明的敘事風格亦十分切合主題；

  但我們仍不僅要問：

  貫穿全片、具有濃濃文藝腔的旁白是否有其必要？


  如果目的是為了讓盲人也能欣賞本片，

  那麼他們需要的是對「看不見」畫面的補充，

  抑或是看似詩意、實則浮誇的內心註解？


  對於影片到底是拍給明眼人還是盲人「看」，

  我認為導演應提出更明確的答案，

  而非讓一切留在「實驗性的嘗試」。


  如此一來，觀眾或許更能體會本片的沉重，

  而非在旁觀導演、演員用盡全力嘶吼的同時，

  不僅冒出劇中人物是否能有其他選擇的疑惑。




  個人評分：6 (好看)


  --'
