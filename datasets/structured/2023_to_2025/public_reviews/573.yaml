url: https://www.ptt.cc/bbs/movie/M.1426176221.A.C59.html
title: '[影評]聽電影囉！《推拿》(有雷)'
content: '《推拿》


  透過指尖與氣味才能感受的情慾


  在「聽」這部電影之前，一連串機械式報讀，介紹著導演、演員、以及工作人員的突兀女

  聲讓人一時摸不著頭緒。隨即就了解到，因為這是《推拿》，一部不只拍給明眼人看，更

  是給盲人欣賞的電影。


  《推拿》改編自茅盾文學獎得主畢飛宇同名小說，原著作者在由在南京按摩院裡給人推拿

  得到靈感，寫下了這篇小說。描述著一間盲人按摩院《沙宗琪》由按摩文化興盛的年代至

  沒落的點點滴滴，每一個角色都有各自的故事，同時也互相牽扯，交流著彼此的情誼與情

  慾。缺乏了視覺，還是能夠透過其他感官傳遞著自己的想望，而且更為強烈。ꀊ


  電影從意外失明的青年小馬(黃軒飾)展開序幕，尋死不成的小馬，靠著在盲人學校習得的

  按摩技能，來到了《沙宗琪》-這間由沙復明(秦昊飾)與張宗琪(王志華飾)兩位老闆所創

  立的盲人按摩院。原本平靜無波的生活，在沙老闆朋友王大夫(郭曉冬飾)的愛人小孔(張

  磊飾)到來後開始起了波瀾。體態略顯豐腴的小孔，或許在明眼人眼中算不上美女，散發

  出來成熟女性戀愛中的荷爾蒙卻化成惑人的氣味，對於血氣方剛的小馬來說有著致命的吸

  引力。幾度幾乎克制不住對小孔的侵犯，不顧旁人的目光，慾望瀕臨崩潰邊緣。一旁的同

  事們雖然眼盲卻都了然於心，只是沒人敢說破這一切，深怕一發不可收拾的後果誰也承擔

  不起。直到玩世不恭的按摩師傅張一光(穆懷鵬飾)硬是將小馬帶到了應召按摩院，結識了

  風塵女小蠻(黃璐飾)，算是解決了這場僵局。初嘗女性體溫的小馬彷彿成了癮，而對小蠻

  來說，本該逢場作戲的心態獨獨對小馬產生出不同的感情。畢竟風塵女子眼明，見到的卻

  不一定是真；按摩師傅眼盲，感受的也不見得是假，電影最後的小馬為了小蠻爭風吃醋被

  打的頭破血流，疑似意外的得回失去的光明，和小蠻遠走高飛。ꀠ王大夫與小孔，表面上

  是來投靠老同學沙老闆掙口飯吃，實情卻是私奔來到異鄉。王大夫與小孔之間的情感既濃

  且烈，小孔在和王大夫歡好之時總不忘在王大夫耳邊呢喃著，彷彿要透過耳膜烙印在他腦

  中的咒語：「我們不是兩個人，我們是一個人。」亦即兩個人之間缺少了任何一方都將不

  再完美。王大夫對小孔的深愛也足以讓他情願以血代錢來償還胞弟的債務，只為了保住用

  來迎娶小孔的半生積蓄。也許就是這份濃情，讓王大夫不說穿小馬對小孔的侵犯，畢竟將

  真相戳破對兩人而言都會是一記重擊，情願埋藏在心中，保全小孔的尊嚴。ꀊ


  按摩院老闆沙復明雖是一位盲人，卻也不甘於平淡生活，電影甫帶到沙老闆出場時便是在

  熱鬧跳著交際舞的場合。他滿腹經綸，尋覓著如同小說情節一般能夠伴他一生的對象，又

  往往受限於天生的殘疾鍛羽而歸，《沙宗琪》的美女按摩師都紅(梅婷飾)在這樣的情況下

  不知不覺讓沙老闆留上了心。客人總是稱讚都紅的清麗，這些讚美對沙老闆來說如同開啟

  了一道追求美之一物的大門，讓他情不自禁的對都紅表白，只是美麗一詞對看不見的都紅

  來說沒有任何意義，她明白，對沙老闆也沒有。因此電影中她說到：「你喜歡的不是我，

  是你心中對於美的概念。」狠狠的拒絕了沙老闆的求愛。ꀊ

  《推拿》赤裸裸的描寫了劇中角色對於情慾的追求與執著，無關乎視覺。女按摩師金嫣(

  姜丹飾)知道自己逐漸衰退的視力總有一天會完全失去光明。因此毫不保留的追求同在《

  沙宗琪》的木訥按摩師的泰和(黃軍軍飾)。相對於金嫣，都紅對小馬也有一份若有似無的

  感情，表現卻是隱晦且曖昧，在電影中她對小馬說道：「人和人對撞是相戀，車和車對撞

  是車禍；但車和車總是撞，人和人總是讓。」而後小馬疑似視力復原，回到《沙宗琪》見

  到了都紅，忍不住對都紅說她確實很美，對美麗一詞相當敏感的都紅卻只是笑罵他現在才

  知道。由此窺出端倪。只是都紅的心意終究沒有明白的傳達給小馬，在小馬和小蠻私奔之

  後，都紅也因為意外夾傷了手指，斷送了身為按摩師傅的生命，悄悄離開《沙宗琪》，尋

  找自己新的生活。ꀊ

  在一部以盲人為主軸的電影中，《推拿》對視障觀眾有貼心，但仍有不足。幾幕情慾交流

  的片段，沒有對白，靠著喘息聲或許可以摸索出當下劇情的輪廓。比如在宿舍中，眾人在

  打鬧之際小馬禁不住的輕薄了小孔，其他人默不作聲的尷尬，以及原本和小孔小馬一起並

  坐在床沿卻被擠出出外的王大夫，這段沉默便需要說明提示。又都紅在與小馬對話之後，

  鏡頭帶到了其實一直坐在同一個房間另一端的沙老闆，兩人都沒發覺他的存在，觀眾看的

  明白，視障者卻無從得知。不過導演婁燁仍舊設計了一些運用聲音的技巧來牽動聆聽者的

  知覺，不少場景時常都伴隨著水聲，雨水時為細密，時為滂沱，反映著情緒的高低起伏。

  抑或沙老闆辦公桌上的風鈴，即使人不作聲，仍然能夠洩露他的行蹤。ꀊ

  聲音，對於視障朋友而言，是目前唯一能夠享受影像作品的方式。如同按摩師傅們等待在

  房間中依靠著對講機指引一般，這是盲人取得資訊的指標。聽說以後在電影院觀影時，可

  能還會有導入散發氣味還有震動座位等等…讓觀眾能夠更加深入其境的設計，如果能夠再

  搭配上聲音提示的導讀，對視障者而言實在是種再貼心不過的進化。沒有了視覺，所有其

  他感官的運用便顯得格外敏感，就如同本片《推拿》所呈現的概念之一。期待未來的電影

  呈現都能留給失去視覺，但仍然想感受大螢幕震撼的人們這樣的空間。


