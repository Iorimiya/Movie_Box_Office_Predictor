title: '[好雷] 推拿 看不見如何出走'
content: '盲者的世界裡

  同凡人的性情皆相同

  貪婪的狂妄的自私的卑劣的

  愛慕的狂戀的矜持的嫉妒的

  彷彿被困在孤島上人人焦躁心情

  這孤島叫做沙宗琪推拿中心

  於是

  每個人都在尋找自己生命出口

  卻無法從這樣的泥沼中離開

  從餐盒打菜到使用三輪車

  到曖昧不清的數份情愫交纏

  日子這樣一天過著一天

  最驚艷還是那段下雨天午後

  沒有顧客上門的清閒

  抽煙的人抽煙，養烏龜的養烏龜

  傾訴心事也互相安慰

  屋外傾盆大雨路樹上的寥落

