title: '[情報] 《推拿》《盧貝松之聖女貞德》7月重映'
content: '由婁燁執導 獲得金馬獎最佳劇情片的《推拿》


  前景娛樂將於7/10重新排映


  《推拿》獲得51屆金馬獎含最佳劇情片7項提名


  贏得6項 差一座最佳導演未贏得 該屆為《黃金時代》的許鞍華贏得


  該片攝影師曾劍也獲得64屆柏林影展藝術貢獻獎



  可樂電影也將於7/24排映《盧貝松之聖女貞德》


  此片為盧貝松和蜜拉喬娃維琪的二度合作


  當時上映後評價兩極 在凱薩獎獲得8項提名 贏得最佳服裝設計和最佳音效



  重映風潮持續 暑假應該還是重映片占大多數


  --'
