url: https://www.ptt.cc/bbs/movie/M.1422631817.A.DD6.html
title: '[新聞] 《推拿》難回本 婁燁不怪市場盲目'
content: '中國時報【陳亭均╱專訪】


  １座銀熊、６匹金馬，各大影展早為電影《推拿》獻上毋庸置疑的敬意。但成本高達１億

  ，在大陸票房竟只有3500萬，作為市場上流通的商品，《推拿》終究血本無歸。《推拿》

  是談「盲」的好電影，票房慘淡，究竟是婁燁瞎了還是市場瞎了？婁燁說：「這是主流社

  會的必然性，不存在尊不尊重、盲或不盲。」


  籌拍時為資金苦惱


  主流排擠非主流這檔事，對婁燁來說見怪不怪，他曾因《頤和園》被大陸禁拍５年，因此

  陷入低潮，《推拿》在他被禁拍的2006年冬天誕生。儘管他當時已是名導，情緒還是很差

  。在美國時，遇著《推拿》作者畢飛宇，「他告訴我要拍這部片，因為『安全』！不會被

  禁。」


  於是《推拿》之於婁燁，就像黑暗中一根稻草，把他稍微拉出黑暗，「從那時起，這片早

  晚要拍。」然而籌拍時，他還是為了資金苦惱不已，甚至有製片人對著他劈頭直說：「我

  就不會去電影院看一部瞎子的電影！」他最後靠著自己的財產、大陸和法國力挺他的投資

  方，終於把電影拍成了，對他來說，能完成作品已是萬幸，「電影沒有商業回報，我就當

  這是自我考驗。」


  他為了「安全」拍了《推拿》，但他沒因此喪失血性，他在《推拿》做的事，依舊是他這

  輩子一直在做的事，《推拿》是不是像哲學家傅柯作品《瘋癲與文明》那樣，意圖挑戰病

  態和正常的界限？他笑說，當然有這種意圖；看來他還是屬於「政治不正確」的那掛人。

  以後還會擔心作品被禁嗎？他笑說：「現在的狀況，沒人可以限制導演拍什麼了！我拍了

  一部安全的，接著大概會拍３部不安全的。」


  新聞網址：


  --'
