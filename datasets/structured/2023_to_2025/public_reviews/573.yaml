url: https://www.ptt.cc/bbs/movie/M.1422983964.A.AD2.html
title: '[選片] 鳥人/進擊的鼓手/推拿 該選哪部進院線看'
content: '最近比較沒錢但又心癢想和朋友去看院線片


  鳥人/進擊的鼓手/推拿


  該選哪部進電影院看呢？



  先二題驗證題，我們對對口味：

  1.你覺得「星際效應」好看嗎？

  2.你覺得「控制」好看嗎？


  我覺得普感。


  覺得普的人繼續往下看，對這兩部片推到爆的人請左轉。



  [鳥人]

  最吸引我的點是瑞蒙卡佛，我很喜歡他的小說，

  還有用即興的鼓伴奏音樂很酷，

  還有演技跟鏡位好像也蠻可看的。



  [進擊的鼓手]

  想看是因為我是個鼓手啊，但看了預告片覺得那教練也太S了吧，

  也有人提到這部片根本一點也不爵士，不知道我看了會不會出戲？

  不知道最後是否有特別的驚喜？



  [推拿]

  我周圍口碑很推薦，但我沒看過婁燁的片，

  不知道會不會覺得很沉悶？




  已經跟朋友連續看過幾部覺得普感（例如上述那兩部）的片了，

  如有冒犯版友的口味還請見諒，

  真的想進院線好好看一部強片！


  因為口袋很淺先排除會上二輪的


  以上


  懇求建議！感謝！






  --'
