url: https://www.ptt.cc/bbs/movie/M.1426128013.A.9BB.html
title: '[好雷] 推拿━人最初的樣貌'
content: "以下有雷\n\n\n\n    【推拿】人最初的樣貌\n\n    盲人甚至比健全人更相信命運，因為命運是看不見的。對盲人來說，看得見\n  \
  \  的東西不一定是真的，看不見的東西才真的存在。《推拿》\n\n    自從受過婁燁導演的《頤和園》震憾洗禮後，他所導的片我就不可能錯過\n    了。婁燁電影裡都有強烈的愛慾，直截了當的性禁忌，濃郁的哀愁，難解的\n\
  \    迷惑，相當程度之下也啟發了我的創作。新片《推拿》相較以往就溫和許\n    多，婁導由外而內，這次，潛入看不見的內在世界。\n\n    片頭介紹劇組不用字幕而是用聲音表達，我頓時明白，這是拍給盲人「聽」\n\
  \    的電影，觀影時，我也時常閉上眼，聽雨聲，腳步聲，呼吸聲，聽畫外音敘\n    事，讓些許畫面溜過，真的也能跟著故事前進，睜開眼，看見的是雨天裡的\n\
  \    氣味彌漫，光影之中互相觸碰感受的體溫，很特別的體驗，觸覺嗅覺與視覺\n    彷彿在相互轉換。故事一線的小馬，嗅聞愛戀的氣味尋找嫂子小孔(為什麼\n\
  \    是嫂子我也不懂)，而不是人人稱美的都紅，反思著，如果我們都看不見，\n    依尋原始的費洛蒙尋伴，愛情是否簡單的多？\n\n    觸覺、嗅覺所構成的盲人世界很直觀，但畢竟是人，也有愛恨虛榮。演員裡\n\
  \    我最欣賞秦昊所飾演的沙復明，他嚮往健全人的生活，開店、跳舞吟詩、相\n    親，「聽說」都紅長的極美，於是展開追求，他被美這個問題給纏住，撫摸\n\
  \    著都紅的臉，可是手又怎麼能摸出美呢，舉手投足處處內蘊含光，演技相當\n    入味，他為了此片還在眼睛裡貼膜，十足敬業。而都紅直白的對沙復明說，\n\
  \    「你以為那是愛情，其實就是你的虛榮心迷戀上的一個概念而已。」這句話\n    彷彿打了我一記耳光，現今我們追求表相不重視內在靈性，不就是虛榮心迷\n\
  \    戀上的一個概念嗎？而都紅其實也追求一種憧憬，憧憬她自己美麗的外表，\n    可是很快就放下了，她知道盲人的外相了無意義，而關於愛情她說：沒有哪\n\
  \    個女人是看不到愛情的，眼瞎的女人尤其看得到。簡直就是一語雙關。\n\n    妓女小蠻是健全人，喜歡故事，因為故事都是假的，假得有趣，假得好玩，\n\
  \    扮家家酒。但是，故事裡卻夾雜小馬的了投入和真誠，她卻害怕。小蠻難道\n    不就是在講健全的我們嗎？片中有一句對白：盲人把健全人當鬼神，因為鬼\n\
  \    神看不見，就像健全人盲目膜拜鬼神一樣，盲人也敬健全人而遠之。\n\n    觀影時，我試著將自己拉高到鬼神的角度，觀察他們近距離說話方式，用手\n \
  \   撫摸對方，用鼻子嗅聞情感，說出坦白而認真的話語，即便有人犯錯，也只\n    是一笑置之，他們的行為或許在健全人世界中可笑可憐，但那不正是人最初\n \
  \   的樣貌嗎？反觀我這個看不見的「鬼神」，在意別人眼光所以帶著面具過\n    活，說不願說的話，不敢接近想接近的人，假惺惺的笑，回家偷偷的哭，不\n  \
  \  更是好假好笑好可憐。\n\n    人都有七情六慾，但盲人表面看似波濤洶湧，在海底卻沉穩寂靜，因他們看\n    見最深沉的黑，我私自認為，他們更懂得割捨與犧牲(原本就接受了失去視\n\
  \    覺)也更懂得珍惜所有。不論是以血償債的王太夫，還是緊抓愛情的小孔，\n    以及原諒廚娘的所有盲人。在什麼都看不見的世界裡或許容易寬恕和遺忘，\n\
  \    眼不見就是淨。試想，如果沙宗琪裡都是健全人，或許會有更多糾葛情仇，\n    甚至死掉幾個人也不無可能，而故事就不會這麼簡單動人。\n\n    沙宗琪結束營業，小馬失蹤，大家各奔東西，一切都好像沒有發生過。盲人\n\
  \    的記憶也是直的來、直的走，不留痕跡。視覺讓我們看見色彩，也容易記住\n    難以忘懷的傷害，如果苦難沒有畫面，是否就昇華成另一種模樣？這是我不\n\
  \    能體會的。另外，一直以來婁燁導演的電影習慣挑戰禁忌，這次選拍盲人的\n    生活，我也稍微聞出某種批判中國體制現況的味道。就像電影對白「盲人在\n\
  \    明處，健全人卻藏在暗處，這就是為什麼盲人一般不和健全人打交道的根本\n    緣由。」盲人是誰，健全人是誰，之前屢遭中國政府禁拍的他只說了一句：\n\
  \    如果此片都無法過審，那除非是有人眼瞎了。\n\n\n\n--\n\n\n\nKAI\n寫小說散文詩，寫電影音樂生活，也寫人生百態。\n\n\n--"
