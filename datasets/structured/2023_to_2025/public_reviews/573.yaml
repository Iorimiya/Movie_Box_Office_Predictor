url: https://www.ptt.cc/bbs/movie/M.1416713138.A.834.html
title: '[新聞] 評審內幕解析 中國《推拿》6獎大贏 台僅4獎港3獎'
content: '本屆金馬最佳劇情片中國電影《推拿》7項入圍中6獎，成最大贏家，中國電影共獲14個獎

  項。《KANO》以3.2億元票房成今年最賣國片，但昨6項入圍全軍覆沒，令人扼腕！尤其

  。金馬主旨是以鼓勵華語電影，台灣電

  影在21個獎項中廣義解讀僅拿4座，比去年6獎還差，港片今年成績也不理想，僅獲最佳導

  演、最佳視覺效果和最佳動作設計3獎。


  中國演員萬茜在《軍中樂園》演軍妓獲最佳女配角，她昨發願：「因為第1次（得獎），

  我希望可以許個願，有生之年，還能夠站在這個舞台上，再拿到1座女主（角）！」她到

  後台親吻獎座，直呼「有點抖」，被讚身上的龍袍裝氣勢旺，她笑說：「剛剛皇上（陳建

  斌）覺得我偷了他的衣服。」



  她和郭富城、馮德倫共17位評審昨

  僅花6小時完成所有投票，比以往快。


  最佳劇情片方面，5部片預投票時各有支持，正式投票第1輪《推拿》便達共識，以「創造

  引人入勝的盲人世界，完全具備電影感」勝出，另獲改編劇本、攝影共6獎。該片導演婁

  燁和《黃金時代》許鞍華戰到第3輪，許鞍華以「68歲的導演仍有逆流而上的勇氣，形式

  突破」，1票險勝。


  入圍8項的《白日焰火》最後僅得美術設計獎。《KANO》前天同時獲觀眾票選獎、國際影

  評人費比西獎，最有觀眾共鳴又展現台灣電影工業水準，昨卻6項入圍全軍覆沒。




  ，他與《一個勺子》陳建斌爭至第2輪，評審稱讚陳建斌已自成風格，用簡單喜劇

  探討人性，但有極大衝擊。


  2位台灣新演員曹佑寧、許瑋甯皆被熱議，最後由視障素人張磊以《推拿》奪獎，陳冲說

  ：

  此獎是否該考量未來發展？陳冲說：「好比許瑋甯，有人覺得她會大有可為，但此

  次仍就作品而論。」


  台灣電影本屆獲獎勉強可算4座，靠影后陳湘琪、原著劇本易智言守住江山，《軍中樂園

  》也奪男、女配角，但得主陳建斌、萬茜其實皆為中國演員，嚴格來說只有2項。去年評

  審團主席李安曾說「台灣電影氣有點虛」，時過1年，言猶在耳，獎項雖不能論定成敗，

  但台灣片確實該加把勁。


  陳冲說台灣片優勢是溫馨與人情，而中國片受限審查制度，卻仍有許多作品堅持批判時代

  ，方法得更巧妙不易，台灣創作環境自由，成績不該僅有如此，也讓網友非常失望。





  --'
