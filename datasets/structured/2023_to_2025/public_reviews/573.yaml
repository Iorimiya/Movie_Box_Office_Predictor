title: '[新聞] 金馬新聞／「推拿」橫掃金馬成大贏家'
content: '新聞網址：


  【聯合報╱記者唐守怡╱即時報導】          2014.11.23 12:00 am


  大陸電影「推拿」橫掃金馬，成為今晚大贏家， 拿下壓軸大獎「最佳劇情片」，劇組集

  體上台分享榮耀。導演婁燁代表致詞，感謝台上劇組以及沒有到場的盲人演員們陪伴這部

  電影，製作人吳毅接著說，過幾天就是51歲生日，與他的名字諧音，謝謝父母給他起好名

  。


  稍早頒獎人張艾嘉感謝評審冒著生命危險拿出今晚名單，讚金馬獎數十年來沒有改變過，

  一直熱情、公正、包容；陳冲也說對金馬獎情有獨鍾，認為金馬獎是最受尊重、非常嚴謹

  公正的獎項，得到金馬獎是最令電影人開心的事。

