url: https://www.ptt.cc/bbs/movie/M.1424600260.A.500.html
title: '[好雷] 推拿'
content: "短評：透過電影拍攝一群真正的盲人無疑是個非常新鮮大膽的嘗試，\n光是這點就非常值得一看了，而婁燁在畫面上概念的準確，以及題材\n呈現的創新，使得這部作品或許不是完美的，但讓他在金馬奪魁卻依\n\
  然當之無愧。\n\n    改編自同名小說，記述一群盲人在按摩院裡的生活，而婁燁也真\n的選擇了一些盲人擔任其中的一些角色。有別於其他講述盲人的電影\n，這部作品透過真正的盲人擔任演員（儘管不是全部）並且試圖在螢\n\
  幕前建立起盲人的生活邏輯。\n\n    （因為通常不雷劇情，但以下為了討論重要橋段，所以先特別標\n示一下）當然這樣的題材首先會遇到的困難就是：要如何透過視覺呈\n\
  現盲人題材。婁燁的作法是有很多焦很淺或者甚至沒有焦的畫面，此\n話畫面鮮少全景或全身，亦即透過畫面上無法完整呈現空間或地理關\n係，以透過畫面上受限的感覺來逼近呈現盲人在視覺上的不便（例如\n\
  整間按摩院都口頭上介紹過了，但視覺上卻一直很難一目了然地窺見\n全貌）。這樣的手法或許在小馬視覺恢復的橋段時會顯得有點陳腔爛\n調且沒那麼精準（該橋段的手法和其他橋段的手法無法做出分常明確\n\
  的區分，因此觀眾很難直接而立即地透過畫面了解到小馬的視覺恢復\n了）；但換個角度思考，這部作品本來就選擇了高難度的呈現方式，\n因此即使有瑕疵也是瑕不掩瑜。\n\
  \n    此外個人其實對於劇中最漂亮的女角色出口成章的對白感到有點\n突兀，因為整齣劇只有她是這種講話方式，且她咬文嚼字的時機點其\n實處處都尷尬，畢竟婁燁對於橋段的設計並非高潮迭起，因此這種比\n\
  較戲劇性的對白其實很難不著痕跡地安排進這類風格的作品（除非是\n透過旁白）；但同樣地，面對這麼一部大膽嘗試的作品，這些段落即\n使大家都覺得這樣的處理有瑕疵，其實也都該被包容的，因此這部作\n\
  品帶給我們其他更多的東西。\n\n    最後想要聊一點劇中有一點滿有趣但或許是矛盾之處：盲人由於\n視覺上受限，因此在盲人愛情的世界裡外表並非決定性因素，所以他\n\
  們的一見鍾情更是真正完完全全憑感覺的；也因此，在劇中設定最美\n麗的角色，卻未必完全獲得男性的青睞，最後也只能因為受傷和小馬\n的離開而黯然離開；然而另一方面，重獲視覺的小馬最後為何能夠放\n\
  棄對嫂子的執念？會不會是因為他終於看清楚他所執著的對象的真面\n目？如果真是如此，豈非從失明變成無明？本劇最後試圖以小馬的結\n局作為戲劇張力的解除以致於結局，但換個角度想，或許只是從一種\n\
  執著換成另一種罷了。\n\n\n\n--\n\n其餘電影短文請見：\n\n--"
