url: https://www.ptt.cc/bbs/movie/M.1418647419.A.6D3.html
title: '[新聞] 《推拿》再傳捷報　獲亞太電影評審團大獎'
content: '記者翁新涵／台北報導


  今年金馬獎勇奪最佳影片等6項大獎的《推拿》，再傳捷報，榮獲第8屆亞太電影大獎（

  APSA）「評審團大獎」。


  該獎項賽前並沒有入圍名單，但必須與來自中國、俄羅斯、日本、韓國、土耳其、伊朗等

  ，亞太地區所有國家的入圍強片共同競爭，《推拿》此次再度交鋒《黃金時代》、《白日

  焰火》、《闖入者》依然拔得頭籌，並且擊敗今年坎城影展金棕櫚獎得主《冬日甦醒》實

  屬不易，這也是繼柏林影展銀熊獎後，再度贏得國際電影大獎。


  婁燁導演的御用攝影師曾劍，代表劇組前往澳洲領獎，上台發表感言說：「如果整個電影

  產業失去了藝術電影，那電影也會因此變得暗淡無光！謝謝亞太電影大獎和評審團對藝術

  電影的支持！謝謝對《推拿》的喜愛！謝謝所有看見《推拿》的你們！」


  《推拿》日前於大陸上映獲得極大好評，並獲得當地藝術電影院的支持，將以每周六、日

  放映兩場模式，繼續長期放映一年。至於在台灣上映時間，則是明年1月23日。


  新聞網址：


  --'
