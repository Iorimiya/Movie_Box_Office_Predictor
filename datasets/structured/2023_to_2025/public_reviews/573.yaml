url: https://www.ptt.cc/bbs/movie/M.1455453676.A.54E.html
title: '[討論] 小說與電影的【推拿】'
content: "畢飛宇小說【推拿】與婁燁電影【推拿】，恐怕要讓「忠實於」小說內容的改編\n\n電影觀者徹底失望，電影太多刪增與更動，讓【推拿】電影與小說間的關聯性不\n\
  \n甚緊密。然而，若從「中度緊密關聯」的要求來看，這兩部都可謂挺好的作品。\n\n就像婁燁所說，以下嘗試從小說與電影檢視【推拿】：\n\n\n附小說段落版：\n\
  所重視的是每個推拿師與「健全人」(小說文本中的用語)的互動過程，包\n\n括他們到「沙宗琪」之前的經歷、與家人間的關係、與社會的關係及自身思緒的\n\n流動。畢飛宇寫小說的角度，像是以全知全能的局外人客觀地看「沙宗琪推拿中\n\
  \n心」的所有員工，他明白每個人的經歷與心思，不論是健全人或是盲人。如果要\n\n說主角，其實也就是推拿中心的員工們。就像帶著讀者(健全人)認識雙方的世界\n\n\
  差異與心態。\n\n\n而所重視的，則是推拿師的愛情與慾望，愛情與慾望其實就是婁燁一直以來\n\n的電影主題，在這取捨下，不僅避開小說細密繁雜的意識流與說明，及身後身的\n\
  \n個人史，更將時空鎖定在「沙宗琪推拿中心」，強化小馬、小孔與王大夫間的慾\n\n望與占有關係；擴大沙復明追求都紅，都紅追求小馬的印象；增添小馬追求小蠻\n\n\
  甚而離開推拿中心自營的情節及小馬貌似恢復些許視覺的段落，將這些人設定為\n\n主角。\n\n\n\n因此看待【推拿】小說原作與改編電影的視角，比較好的方式會是\n\
  \n\n電影劇本整體上比較可惜的是，看似完整的劇情，其實常沒把話交代明白，而馬\n\n上換下一幕。導致劇情不甚深刻，讓【推拿】變成看畫面很精采、看情慾衝突很\n\
  \n激烈的電影。\n\n\n但話又說回來，若純粹把【推拿】當電影來看，這些說明似乎讓曖昧遐想空間縮\n\n減不少，而婁燁又是喜愛營造浪漫想像空間的導演(笑)。婁燁之前的故事改編電\n\
  \n影 [花] 與 [浮城謎事]，皆為如此，大量排除故事本文中日常生活的低俗、暴\n\n力、衝突、無盡的碎念抱怨與物質匱乏，加強伴侶關係中慾望與愛情的糾纏。有\n\
  \n沒有錢用、伴侶有多賤，就是點到為止，他們只是小要素而非重點。\n\n\n\n\n另外一點值得一提的是，電影和小說可是有巨大的差別。\n\n【推拿】電影中的小馬，可是編劇與導演特別厚愛的一名角色，讓小馬當片頭，描\n\
  \n述他九歲時車禍失明與之後自殺未遂的段落，增加他為了小蠻和其他客人打鬥，之\n\n後還恢復些許視力，婁燁與曾劍用大篇幅手持模糊，色調分離的美麗畫面，呈現他\n\
  \n所見與觀者所見的小馬，是全片中最美、最詭異、最迷人的片段！之後更成全小馬\n\n與小蠻，讓他們遠走到其他地方生活。相反地小說中，小馬去找小蠻而被警察抄到\n\
  \n後，就再也沒出現了…….\n\n\n\n至於結局，能明顯看出婁燁與畢飛宇所關注的事項並不相同：一為，另一為\n\n。電影在沙復明吐血後，交代了「沙宗琪推拿中心」員工們各自的去向，\n\
  \n重點是在推拿中心的「人」與他們的結局；而小說則是完結在沙復明吐血後，大夥\n\n們擠在醫院的走道上，焦急地關心沙復明狀況，護理小姐為他們的真摯所感動，重\n\
  \n點放在「看得見與看不見」這本質上的差異，而開啟無限的想像。\n\n\n    \n\n\n--\n  ▃    ▃  ＿▂▄▃▄▆▇█▅▆█\n▎\n▍ \
  \      \n▏         \n ||\n   ▕▕    \n\n--"
