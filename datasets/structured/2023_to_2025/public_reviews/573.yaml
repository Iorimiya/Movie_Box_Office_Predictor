url: https://www.ptt.cc/bbs/movie/M.1415769810.A.851.html
title: '[新聞] 鍍金中國片突破配額限制 《推拿》趁燒攻'
content: "新聞網址：\n鍍\n金中國片突破配額限制《推拿》趁燒攻台\n                                    \n\n2014年11月12日\n\
  \n【張哲鳴╱台北報導】中國電影要在台灣上映，過去需抽籤靠運氣，每年僅有10部配額，\n時有揚名影壇的佳作，卻落得無法在台公映的下場。文化部本月公布修正辦法，只要獲得\n\
  奧斯卡、坎城、威尼斯及柏林影展的正式競賽獎項，或奪下金馬獎最佳劇情片、導演獎的\n中國片，就不受配額限制。\n\n額度10部得獎片例外\n\n此修正辦法從今年開始算起，所以最先受惠的是婁燁的《推拿》，該片年初已獲柏林影展\n\
  攝影銀熊獎，伊能靜的準老公秦昊在片中飾演盲人按摩師。台灣前景娛樂剛買下版權，本\n準備研究抽籤辦法，前天隨即收到放寬通知，暫定明年1月上映。\n\n曾監製國片《總舖師》、《女朋友。男朋友》的葉如芬昨說：「這樣很好啊，當然我更希\n\
  望都不要限制，愈多愈好，大家可以公平競爭，先前有意開放到15部，現在暫時還是維持\n10部，但至少多了得獎片，算妥協的開放。」\n\n另1部已符合資格的《白日焰火》是年初於柏林榮獲最佳影片金熊獎，由金馬影后桂綸鎂\n\
  、廖凡主演，台灣正有片商議價購買。\n\n《白》片、《推拿》和許鞍華《黃金時代》、陳建斌首次執導《一個勺子》，皆為今年金\n馬獎最佳劇情片入圍的中國電影。\n\n\
  --\n                                                             \n\n\n--"
