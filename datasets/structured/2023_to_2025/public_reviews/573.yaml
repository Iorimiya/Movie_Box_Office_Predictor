url: https://www.ptt.cc/bbs/movie/M.1422500521.A.F68.html
title: '[好雷]《推拿》什麼是光，什麼是黑'
content: "無音樂圖文網頁版\n\n想起月無波曾說過：「眼盲心不盲，心盲有何用。」\n\n\n幾位受過專業訓練的視障按摩師\n一同工作位於南京的「沙宗琪推拿中心」，\n\
  為了生活為了錢，為了尊嚴為了情，\n他們努力活著。\n\n\n這是一個情感的故事，\n改編自大陸名作家畢飛宇的同名小說，\n獨立製作的劇情長片。\n視障者與健全人活在相同的社會裡，\n\
  縱使生理上的條件差異，\n透過的情節所傳達的意識形態，\n宛如每個人眼淚的形狀不同，\n眼淚的理由卻相似。\n亦貼近描寫差異個體的共通點：\n人的自尊、人的虛榮。\n\
  涵蓋人情世故的段子，\n情感層面對於愛情明顯著墨較深，\n製作群嘗試告訴大家，\n在推拿中心的工作環境裡，\n有著一群視障人士，活著、愛著、也痛著，\n內心的意念相較於健全人，\n\
  並無二致。\n\n當中出現\n一定比例以上的主觀鏡頭與旁白解說，\n不僅嘗試增添臨場感，\n讓健全人透過畫面體會視障者的世界，\n也設法拉近距離感，\n讓視障者盡可能「聽懂」這部電影。\n\
  雙管齊下的手法，\n在類似題材的電影裡，相對少見。\n\n【幾句對白幾個念頭】\n東西太近，東西太多，\n健全人容易看不清楚，\n向來用心體會的視障者，\n這種時候比起健全人，更能看清。\n\
  「在命運面前，其實盲人與健全人一樣都是迷信的，\n多多少少有一點迷信，\n他們相信命，\n因為命是看不見的，盲人也看不見，\n所以，盲人比健全人更了解什麼是命，\n\
  對於盲人來講，\n看得見的東西不一定是真的，\n看不見的東西，才是存在。」\n這一串出現在當中的長旁白，\n有其生活的哲學。\n生活中看不見卻依然存在的東西多如牛毛，\n\
  愛情正是其一。\n\n人們說愛情是盲目的\n那麼，視障者的愛情，\n又會是什麼模樣呢？\n想起有段對白這麼說道：\n「對面走過來一個人，\n你撞上去，那就是愛情；\n\
  對面開過來一輛車，\n你撞上去，那就是車禍。\n但是，\n車和車總是撞，人和人總是讓。」\n也許期待又怕受傷害，傷害造成怕期待，\n每個人自有解讀，\n如何是撞，如何是讓，\n\
  的故事也有它生動精彩的描述。\n\n\n第五十一屆金馬獎，\n獲得最佳劇情片、\n最佳改編劇本…等六項肯定。\n導演婁燁身為中國第六代導演代表人物，\n生涯作品幾乎皆以獨立製片方式呈現，\n\
  相較於商業製作，\n此法較能直接傳達導演說故事的想法，\n其過去的作品：《蘇州河》、《春風沉醉的夜晚》\n都是典型的例子。\n\n無音樂圖文網頁版\n\n--\n\
  \                                         01/29 11:04"
