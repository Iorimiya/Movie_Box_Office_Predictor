title: 'Re: [活動] 金馬獎最佳影片《推拿》台中限量放映場 '
content: '剛看到這個訊息 整個人超驚訝

  金馬獎最大贏家台中竟然不會上映!

  八家首輪戲院竟然挪不出一個廰給這部傑作!


  當初看到這部電影 是在金馬觀眾票選的放映

  看完十分激動 滿足

  觀影過程中 感受到強烈的感官震撼

  彷彿真的走進盲人的世界


  陳沖評推拿："渾然天成，電影中的電影"

  再貼切不過

  推拿或許會被歸類在藝術片

  但它真的非常好看 我甚至覺得它比多數商業片還更好看

  而且推拿片長也不長 很適合推薦給一般大眾


  也許這並不是會大賣的電影 中國票房好像也不算好(不過中國只能看閹割版)

  但是讓好電影被更多人看見應該是愛電影的人共同的願望吧

  希望台中能有戲院業者考慮上映推拿






  --'
