url: https://www.ptt.cc/bbs/movie/M.1422980079.A.7A3.html
title: '[好雷]愛情的美好與殘酷─專訪《推拿》導演婁燁 '
content: '愛情的美好與殘酷──專訪《推拿》導演婁燁


  圖文版原文刊載於獨立評論@天下 2015/02/02



  作者: 吳老拍


  （編按：本文將透露劇情，讀者請斟酌閱讀）


  《推拿》是描述一群「盲人推拿師」靠自己過活的故事。這看似平淡不過的題材，才氣縱

  橫的婁燁導演卻將其拍成充滿戲劇張力的好片。盲人，被明眼的觀眾「看見」他們的生活

  ，如同發生在你我周遭看得見的日常生活，觀眾投入其中，感受到真實情感的力量。不僅

  如此，婁燁更克服技術的重重障礙，用實驗電影的精神，運用像說書人的口白，開場演職

  員表是口白，片中角色動作與心理狀態，也都有旁白，搭配演員的日常對話，用心拍出「

  給盲人看」的電影。


  ● 電影提醒觀眾：「他們，其實也是我們，只是我們都忘記了。」


  盲人眼睛看不到，我們忽略了他們，盲人眼盲但心眼亮，反倒是一般人眼不盲心盲。盲人

  也是人，也有七情六慾，片中寫實呈現出盲人們赤裸裸與毫無保留的慾望，讓明眼的觀眾

  感受到盲人與明眼人一樣，都渴望被愛與被需要。《推拿》講的是人性，是友情、是親情

  、也是愛情，更是人與人之間情感的美好與殘酷。


  《推拿》取材自作家畢飛宇的同名小說，他將常去南京家旁的盲人推拿店做推拿的經歷與

  感悟寫成小說，婁燁導演讚譽：「《推拿》小說是一幅微型的《清明上河圖》。」由《頤

  和園》編劇、也是婁燁的妻子馬英力改編為劇本，將小說散點透視的文字群像，改以影像

  敘事來傳遞文學精神。


  ● 寫實與寫意之間，從容不迫


  婁燁導演成熟的執導火候是成功的關鍵，就如同老子名言：「治大國，如烹小鮮。」


  各個角色關係戲分恰到好處，演員表現精采，職業演員演技逼真寫實，素人演員演出自然

  生動，不論攝影、燈光、美術、音效、配樂等環節也十分到位，展現全方位的調度功力。

  全片不浮誇，不躁進，如行雲流水，卻富有節奏感。鏡頭有著十分寫意的詩意影像之美，

  婁導在寫實和寫意的分寸拿捏游刃有餘，從心所欲。


  《推拿》片中的生活場景，寫實描繪出盲人對情感的執念。王大夫（郭曉東飾）為了留住

  自己和小孔（張磊飾）的結婚基金，不被追討弟弟債務的黑道奪走，不惜以刀割肉痛苦自

  殘，以死明志的堅決，瞎子愛錢，連命都可以不要，背後是為了拼命守護和愛人得來不易

  的感情；推拿店老闆沙復明（秦昊飾）苦求不得的「美」的本質，不就是都紅（梅婷飾）

  一個始終沒有對小馬說出口的「愛」字；小馬（黃軒飾）與小蠻（黃璐飾）由性生愛，身

  體是誠實的，讓兩人拋開無謂的道德枷鎖，真實去面對愛情，嘈雜熙攘的外在變化，比不

  上小馬和小蠻內心對愛的渴望。


  ● 婁燁：「電影是暗黑裡的一道光。」


  這些盲人的情愛故事，其實每天都在我們身邊發生，就像壹週刊每期坦白講專欄的芸芸眾生相，坦白講書寫小人物真實的人生，直白犀利卻刀刀見骨，正中人心。《推拿》演員們的演出卻是渾然天成的真，讓觀眾忘了他們是在演戲，全心全意投入盲人的感情世界，彷彿讓那些貪嗔癡的執念透過光影穿透大銀幕，直指觀眾內心深處。


  ● 樸實返真的影像與聲音美學


  攝影師曾劍的影像有著樸實留白的詩性美學，如《老子》：「見素抱樸。」現其本真，守

  其純樸。手持鏡頭，讓攝影機捕捉盲人的視角，還原了盲人生活的場景，讓觀眾不只是「

  看到」盲人在沙宗琪推拿中心的日常生活，更感受、融入和諧表象之下的慾望暗流與人際

  衝突中。觀眾的情緒感知被盲人的痛苦喚醒、更被他們的七情六慾牽動心緒。聲音指導富

  康讓觀眾感受到彷彿就在盲人的主觀世界，在現場收音，非常接近於現實，開放式的舞台

  現場。影像與聲音融於無形，在光影流轉之間，讓觀眾反思自身的生命經驗，不斷敲擊心

  房，細細反芻再三。


  ● 婁燁：「電影像是書法，是一種書寫。」


  有趣的是，美術設計杜艾霖在設定人物表情語言是透過書法的不同字體，創建每個角色的

  性格，特殊的群戲安排，讓角色們好像調色板各種顏色，被調和成同一個色調，細看都有

  其獨特性，抽離出來又有各自色彩。剪接也是樸素，婁燁導演跟剪接師孔勁蕾、朱琳說：

  「要像沒剪過一樣。」《推拿》後製一年，每一個畫面都是導演和剪接師精煉而成，剪接

  超過一百個版本，朱琳說，導演幾乎每三天必須完整地看完一遍全片，整個後期看了不下

  百遍。時間的積累，各種可能性的不斷嘗試，才能成功提煉出簡約的詩性美學。電影不但

  是光與影的故事，同時也是時間的藝術，《推拿》是影人用熱情與生命精煉的影像詩。


  ● 藝術的本質，來自於生活


  《推拿》獲得第51屆金馬獎最佳劇情片、最佳改編劇本、最佳攝影、最佳剪輯、最佳音效

  、最佳新演員六項大獎，榮獲第8屆亞太電影大獎（APSA）「評審團大獎」及第64屆柏林影

  展傑出藝術貢獻「銀熊獎」（攝影），堪稱是2014年華語片實至名歸的傑作。《推拿》映

  照出藝術的本質，來自於每一個人在生活的當下。電影的溫暖結尾。愛情不是用「看」的

  ，是要去感受的。不只是愛情，情感也是看不見的，卻是最真實的，用心就能感悟。


  【以下為作者專訪婁燁全文】


  問：看完《推拿》，心頭浮現的是老子的一句話:「治大國，如烹小鮮」，這部片的美，不

  只是讓觀眾能真心感受到盲人的生活，情感的體驗，諸多細節都是很寫實的，但鏡頭又保

  留了許多詩性美學，又是很寫意的，讓觀眾看完又能回扣到自身的生命經歷，各自產生深

  淺不同的感受，在寫實和寫意之間，您是如何拿捏這中間的分寸呢？


  婁：記得第一次開剪接會議的時候，我給大家看顏真卿的《祭侄稿》，希望能夠學習那樣

  的一種東西，就是筆墨寫實和寫意，乾濕濃淡的書寫變化，和情感以及作者態度的演進形

  成一種平衡和互動，有時候感覺電影的很多東西其實有點像是書法一樣，是一種書寫，是

  沒法去事先拿捏的，只能從心到手到筆再到紙，寫起來看，這其實是我們筆墨的傳統。


  問：您的作品向來都十分關注城市底層的小人物，《推拿》也不例外，不僅拍出盲人在南

  京潮濕而陰鬱的城市生活氛圍，如同王大夫被黑道追債的生活場景就十分真實，讓觀眾也

  回想自己在城市中的生活，在《推拿》中您如何呈現城市小人物的生活樣貌？


  婁：其實我們不是太清楚那些是不是「底層」或是「小人物」，我的周圍的很多人和事情

  差不多是這樣，我們也在其中，所以最簡單的辦法就是拿起攝影機拍你身邊的人和事情。


  問：您的作品往往有對情感與慾望的直接表露，在《推拿》中仍然有著濃烈情慾的赤裸展

  露，如小馬與洗頭妹小蠻的由性生愛，尤其動人，最後也帶來了溫暖的力量。愛情是《推

  拿》很重要的情感戲碼，可否和我們分享這次與過往作品的不同與相同之處？


  婁：愛情或者說性愛實際上首先是一種身體感受，「看」也是，只是太通常了，所以被我

  們忽略，這就是為什麼有時候看不見的盲人的感受更敏銳，所以和「看」一樣的，「盲」

  也是一種身體感受。


  問：在《推拿》裡每個人都恰如其分，但人都是偏心的動物，忍不住想問，導演您最喜歡

  那個角色，在真實生活中，導演您比較想要過那個角色的人生，為什麼？


  婁：喜歡小馬，他差不多是一個自由主義者哈，他跟隨身體的感受，比如「氣味」「觸覺

  」，相比沙復明對有眼睛的主流社會的嚮往，小馬並不迷信有眼睛的世界，他相信自己的

  感悟，他相信閉上眼睛也能夠看到愛情和這個世界。


  --'
