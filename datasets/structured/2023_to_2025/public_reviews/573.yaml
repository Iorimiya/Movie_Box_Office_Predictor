title: '[新聞] 本色演出好嗎？易智言：《推拿》在台灣肯定賠錢'
content: '第51屆金馬獎頒獎典禮22日晚間揭曉，台灣電影僅靠影后陳湘琪、原著劇本得主易智言守

  住江山。易智言23日凌晨出席慶功宴時，被問到台灣人只得2座獎，心情是否很複雜？他表

  示：「當然是複雜啦，台灣電影就是要加油，這個市場會離開。」


  本屆金馬新人獎台灣5佔3，卻全數槓龜，易智言說：「我沒有看其他電影，但他們一定有

  他們特殊之處才入圍。」而


  台灣電影在第51屆金馬獎中黯然失色，易智言說，我們這幾年得獎比較少，「不是我們進

  步的不夠快，就是別人進步的太多了，那這個要檢討。」台灣當然有許多先天上的問題，

  比如市場的規模，觀眾的單一化、只看某種電影而不多元，電影有些什麼不一樣就在網路

  上罵，這些東西對電影是不健康的。從投資人、電影工作者、電影觀眾都需要進步。


  李烈說，有網友罵「台灣市場太小眾，大家不要一直在想著賺錢！」但，「那你想要什麼要想清楚，等

  到台灣電影這個市場成熟，有些人就會更清楚要拍市場片、或是For影展的片，就是不要

  想要影展或市場。」


  易智言說，如果今天大陸片《白日焰火》或《推拿》如果今天在台灣拍，就是賠錢貨。如

  果現在是大陸市場，就有50個台灣那麼大，票房是乘以50、乘以100；《KANO》如果是中國

  大陸電影，票房3.5億乘以50，真的回賺很多。那台灣市場能不能變大？「可以，跟中國大

  陸合拍。」那合拍之後還是不是台灣電影？「這就是目前香港電影的困境。不是拍武俠、

  就是神怪，像香港《救火英雄》只得了一個特效技術獎，香港比我們更早面臨困境，也是

  苦思不得解決。」





  --'
