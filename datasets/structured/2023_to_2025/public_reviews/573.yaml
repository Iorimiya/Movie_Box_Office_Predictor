url: https://www.ptt.cc/bbs/movie/M.1416799621.A.24F.html
title: '[新聞] 《推拿》１月登台 得獎３陸片明年見'
content: '2014年11月24日 許世穎／綜合報導


  日前文化部放寬陸片在台映演的條件，在每年10部大陸片配額外，只要曾獲得坎城、威尼

  斯、柏林、奧斯卡競賽單元獎項，或在金馬獎拿下最佳劇情片、最佳導演獎者，就不受配

  額限制，今年金馬獎包括《推拿》、《白日焰火》、《黃金時代》３部陸片因此受惠。



  大陸導演婁燁執導的，在金馬獎拿下最佳劇情片等６項大獎，更早在柏林影展獲

  得銀熊獎，已確定明年在台上映。由桂綸鎂、廖凡主演的，在本屆

  金馬獎雖僅獲得美術設計獎，但該片也在柏林影展勇奪最佳影片金熊獎與最佳男演員，預

  計與台灣觀眾見面。


  讓許鞍華３度獲得金馬獎最佳導演的，則暫定登台。而金馬入圍片

  中唯一未上映的國片將於在台上映。



  --'
