url: https://www.ptt.cc/bbs/movie/M.1417402192.A.F19.html
title: '[好雷]2014金馬影展─慾望牽引盲人摸愛《推拿》 '
content: '看不見的愛情，更想緊緊抓住。


  2014金馬影展


  ＃No.2《推拿》（Blind Massage）


  中國導演婁燁愛拍禁忌題材，當年因《頤和園》觸及六四事件，又未獲中國批准參加坎城

  影展，讓婁燁遭罰5年禁拍電影，但他還是偷偷在南京拍了《春風沈醉的夜晚》這部探索

  同志情慾的片，想當然這些電影都跟中國觀眾無緣，直到《浮城謎事》終於解禁、送審也

  過關，是婁燁首度在中國上映的作品，不過最後因內容被刪減，讓他決定不掛名上映。


  至於剛拿下金馬最佳劇情片的《推拿》，證明婁燁已經更上層樓，也拋開《浮城謎事》結

  尾的綁手綁腳，透過盲人受限的感官，建構出扭曲的人物角色及人類本能對愛慾的渴求，

  看得我幾乎窒息，當電影結尾忽然綻放光明，深吸一口氣後，忍不住在心中吶喊：「好想

  談一場轟轟烈烈的瘋狂戀愛啊！」


  《推拿》改編自畢飛宇同名小說（我沒看過小說），描寫盲人按摩院裡男女推拿師「看不

  見」的暗潮洶湧，如同劇情介紹所說「少了光，他們愛得更豪放，沒有拘束，也就更徬徨

  」。



  .....以下有雷.....









  電影開場就讓因意外而後天失明的小馬割喉自殺（說明了他的邊緣性人格），不過他沒成

  功，後來進入「沙宗琪盲人按摩院」工作。不久院長老友王大夫和未婚妻小孔加入推拿師

  陣容，誰知青春氣盛的小馬居然愛上「嫂子」小孔的氣味（正在發情嗎？），他被小孔薰

  得神魂顛倒，可以形容為一聞鍾情吧。


  有場戲很有趣，按摩院宿舍是男女分開，有一晚王大夫帶小孔來男生房聊天，小孔被夾在

  未來老公和小馬中間，她跟小馬互相嘻鬧，卻從你推我打變成倒在床上拉扯調情，兩人呼

  吸急促喊著對方，你一句「嫂子」我一句「小馬」，搞得小孔衣衫不整，當然室友們，包

  括王大夫都安靜了。


  「盲了不代表瞎了」，但看不見的好處就是可以「假裝沒看到」。


  小馬為了發洩「精」力，去到純理髮廳找妓女小蠻當作嫂子的代替品，結果他性愛成癮，

  三不五時就跑去找小蠻來一下，「看得見」的小蠻居然愛上了小馬（人帥真好），幸好電

  影結局給了個Happy Ending，從性生愛的他們甩開傷痛，留下純粹的愛情，小蠻最後一抹

  笑容真的好美，所以才說看完好想戀愛啊。


  伊能靜未婚夫秦昊演的院長沙復明是另一個我感興趣的角色，他心中同樣有面撞不破的牆

  ，一心追求美麗，迷戀客人「眼中」第一美女推拿師都紅，卻沒想過都紅總把這些讚美當

  諷刺，一個看不見的人何苦在意世俗審美標準呢，但他渴望愛的心情毫無疑問很濃烈，只

  是還沒遇到對的人。


  或許盲人的世界很單純，但《推拿》的盲人好複雜，這片厲害之處就在於帶領觀眾體驗一

  個前所未有的世界，當然婁燁採用專業演員穿插盲人素人同台演出，也是個很高明的手段

  ，但這部片角色眾多，每個人都彼此牽連也各有過去，當太多事要說時，難免造成某些角

  色的強度不足。


  然而《推拿》剛在中國上映了，是婁燁第一部「掛名」作品，這次他妥協了暴力和色情的

  高潮點被刪減，他認為在沒有分級的情況下，不影響原作精神的修剪可以被接受，這部片

  也確定明年1月23日在台灣上映，建議想看這部片的人真的要去電影院，這片攝影玩很兇

  （拿到柏林影展最佳攝影銀熊獎、金馬51最佳攝影），模糊畫面、黑幕、失焦，很多時候

  光線又暗到爆，不在戲院看，肯定會錯過一堆「暗摸摸」的激情戲碼。



  圖文部落格版：



  --'
