url: https://www.ptt.cc/bbs/movie/M.1422189234.A.23A.html
title: '[好雷] 推拿'
content: '圖文好讀劇情版：



  《推拿》一開始，除了銀幕上的文字外，

  也由聲音告訴我們誰參與了演出。

  是的，這是一部關於盲人的電影，

  這串語音引導我們一起進入關於盲人的世界。



  === 以下涉劇情，有雷喔！===














  整個故事看完，彷彿，

  我們早已經忘卻了這是個關於盲人的故事。

  沒有我們和他們，就是人而已。

  每個人都在尋找愛、摸索愛、體會愛、

  在愛裡受傷、在愛裡茁壯、在愛裡認清現實與自己。


  如果用最簡單的一段話來說這個故事，

  我會說《推拿》是個關於生命在面對愛的故事，

  無關乎盲人，因為故事裡的一切是人都會面對，

  但關於盲人與明眼人，這部電影卻有值得思考的視角。


  =.=.=.=.=.=.=.=.=

  沙宗琪推拿中心，有著各式各樣的盲人，

  先天盲、後天意外盲、逐漸盲，還有明眼人的工作人員，

  就一如我們的社會多元那般。


  電影尾聲說，盲人和明眼人是盲人在明處、明眼人卻在暗處，

  這樣的比喻特別地諷刺，卻也很真切。

  那段話是這樣說的：

  「盲人和健全人終究還是隔了一層，道理很簡單，

  他們在明處，健全人卻藏在暗處。

  這就是為什麼盲人一般不和健全人打交道的根本緣由。

  在盲人的心目中，健全人是另外的一種動物，

  是更高一級的動物，是有眼睛的動物，

  是無所不知的動物，具有神靈的意味。

  他們對待健全人的態度完全等同於健全人對待鬼神的態度：敬鬼神而遠之」。

  而故事中也一度說到「他們把有眼睛的地方稱作主流社會」，

  但整部片看完，其實我們早已經忘記了這是個敘說盲人故事的故事，

  主流？或許也只是一種自以為是的虛榮的優越感而已。


  明眼人自以為自己是社會的主流，帶著優越感與高高在上的心態，

  卻沒想到，明眼人看見得卻比盲人更不真實。

  許多盲人是「眼盲，心不盲」，

  明眼人在所謂主流社會的框架下生活著、行進著，

  但卻也經常在這框架裡迂迴著、造作著、自欺欺人著，

  更誇張一點來說，心盲比起眼盲，更令人悲傷和遺憾。

  =.=.=.=.=.=.=.=.=


  電影中有許多用模糊的方式來呈現的拍攝手法，

  對於要帶領觀眾以盲人的視角來進入故事本身，

  有著引導的味道，透過模糊，多一點點的體會和瞭解。

  看完了電影後，這種拍攝手法，令我想起了眼睛不好的父親。

  我曾問過眼睛黑色素沈澱嚴重的父親，你看到的到底是什麼樣的世界，

  他說朦朦朧朧的，可以看出個大概，但卻看不真切，

  但這樣的我的父親，耳朵和心的靈敏卻也讓他有更細膩的情感與關懷。

  =.=.=.=.=.=.=.=.=


  電影中令我最印象深刻的角色，大概是小馬了。

  除了一開始就抹脖子嚇到我以外，小馬也是電影中前後情緒反差最大的角色。


  小馬的故事在電影裡相對是比較完整的，頭尾呼應外，

  也更加體現了盲人與明眼人世界之間的差距。

  小時候的車禍，導致小馬失明，

  電影的開端裡，他就握著那個齒輪，

  長大後自殺失敗的小馬也依然握著那個齒輪，

  最後，小馬離開了，齒輪卻留下了。

  齒輪似乎代表著小馬對於自己失明遭遇下的過不去，

  而在被毆打後意外恢復視力後，小馬彷彿回到了所謂的主流。

  於是，他帶著小蠻離開，他再也不需要那個齒輪了。


  小馬在迷戀著小孔的過程裡，慾望向他不停地招手，

  小蠻成為了小馬的出口，但那份對於小孔的迷戀，

  依然是一種未知，依然是一種探索，依然是一種吸引，

  以致於小馬一度向小孔激動、失控的說著對不起你。

  直到小馬的復明，許多事情，出現了緊繃下的破口。


  故事裡一度被毆打時，小蠻喊著「他是瞎子，別打」，

  凸顯出了電影中所謂的主流，所謂明眼人的主流。

  而這一打，將小馬帶回了有眼睛的主流，

  卻也引人省思和遐想。

  嚮往著重見光明的小馬，看得見了，

  但他最終還是選擇了推拿的工作，經營著小馬推拿。

  命運，總愛開玩笑，而這無所謂主流不主流。


  在推拿中心的小馬，總令人感覺緊繃，不苟言笑，眼神肅殺。

  但和小蠻約會的小馬，卻有著自然的情緒，

  電影結尾時那個小馬的笑，印在我腦海裡許久，

  彷彿方才電影裡面那些沈重和血腥，都不曾出現。



  其他部分，都紅對小馬的那番告白，很難不令人會心一笑，

  「車和車總是撞，人和人總是讓」很微妙很隱諱又很直接的表白。

  而關於她對沙復明說「迷戀上美的概念」，我想觀眾們可以重新想想，

  屬於自己的那種對美的認定，而不是一味尊崇著所謂主流的美，

  誰說主流就是正確，主流也可能是一種愚昧。

  故事裏沒對都紅背景有所著墨，但這樣的角色肯定不只是個一般女孩而已。


  王大夫的家庭背景其實令我好奇，家中長子，盲人，負責任，

  弟弟雖是明眼人，卻絲毫沒有擔當，但父母卻也莫可奈何。

  王大夫的以血抵債嚇傻了父母，驚訝了討債人，相信觀眾應該也難預料。

  以社會寫實的角度來看，實在令人心痛卻又真實，

  現實，許多時候逼迫著不少人以傷害自己的方式來生活下去。


  沈重之餘，泰和和金焉那段故事裡，泰和說金焉比紅燒肉還好看，

  讓電影院的觀眾們都笑了，多麼純真的浪漫。

  而金焉那想要抓住看得見的愛情的執著與傻氣實在可愛，

  就留給大家進電影院時品嚐了。



  電影裡總說著主流，如果主流是推拿中心裏的那個大魚缸，

  或許我們都只是等待著命運隨手撒下飼料的魚兒罷了。

  盲人與健全人，在命運的面前，並無不同。


  《推拿》是一部值得深思的好電影，推薦給大家～



  圖文好讀劇情版：


  --

  電影、文字、攝影、生活




  --'
