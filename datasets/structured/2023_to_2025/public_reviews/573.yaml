url: https://www.ptt.cc/bbs/movie/M.1421808821.A.ADE.html
title: '[好雷]《推拿》，歡迎來到沙宗琪推拿中心。 '
content: '部落格版：


  在去年金馬影展的時候就買了《推拿》的場次，結果好巧不巧在那時候接到兵單，本來以

  為這部片沒機會在台灣上映了，畢竟台灣有所謂的給中國電影的播映配額只有十部，好險

  《推拿》在第五十一屆的金馬獎大放異彩，而台灣也放寬中國電影上映條件，才讓我有機

  會再看到這部我很想看的作品。


  好不容易拿到特映會的票，找了老姐一起去看，是在我很喜歡的誠品電影院，但今天（20

  號）發生了一些插曲，那就是不知道為什麼有好幾組觀眾的票被重複劃位（包含我，好險

  我有早點進場，不然就沒位子了），而誠品還滿聰明的有留一些保留席給這些客人（當然

  也有一些座位是本來就沒人的），不過令我疑惑的是，明明知道會有特映會，為什麼不及

  早準備而造成這樣的問題呢？如果今天是熱門大片，很難保證被重複劃位的觀眾會有位子

  坐，希望下次可以改善劃位的問題。


  OK，接著我們來談談《推拿》，「推拿」這個詞是在中國出現的，在台灣我想更多人比較

  知道是「按摩」，而誠如電影中所演出的，觀眾看到的，在沙宗琪推拿中心的推拿師傅全

  是盲人，僅有幾個櫃台人員及煮飯金大姐是健全人，在台灣我們也是四處可見很多按摩院

  ，無論是在捷運站裡、百貨公司地下街裡、路邊等等，到處都可以看到打著「盲人按摩」

  的口號的按摩店，為什麼？為什麼按摩店師傅幾乎都是盲人？我記得前幾年，台灣有在爭

  論，是否要開放按摩師工作給健全人，也就是「按摩師工作不只侷限於盲人」，當然，有

  人反對也有人支持，有人認為各種行業都不該受限，但有人就跳出來啦，說如果健全人也

  來當按摩師傅，盲人就失業了等等。這件事情到最後怎樣我就沒有再去探究了，而按摩院

  （推拿中心）到底是不是盲人的全部我也不曉得，我只知道，「沙宗琪推拿中心」絕對是

  《推拿》劇中推拿師傅的全部。


  一開始乃至於後來，我都一直在想，《推拿》到底想講的是誰的故事？是小馬的嗎？小孔

  與王大夫？還是沙復明？金嫣與泰和？都紅？而最後我才了解，《推拿》所講的，是「大

  家」的故事，是「盲人」那看不見，卻能正常感受的愛恨情慾。


  在沙宗琪推拿中心裡，有著許多推拿師傅，有人全盲；有人半盲；也有人慢慢失去光亮，

  而每個人看不見的原因都不見相同，例如，天生看不見的王大夫、沙復明、都紅；意外奪

  走視力的小馬與泰和；以及逐漸失去視力的金嫣，但他們聚集在沙宗琪裡，我想不僅是為

  了餬口，也是因為身旁都是盲人，多少能感受到一股安心，那種體會跟健全人一樣，彼此

  互動的感覺。


  「怎麼會這樣呢？」「怎麼不能這樣？」印象最深是有一位客人問著都紅，那種彷彿惋惜

  、同情的話語聽起來格外刺耳，誠如都紅的回答一般，她為什麼不能這樣？難道身體有缺

  陷就該被同情、被可憐嗎？大家都是出外討生活，為什麼要這樣子問她呢？


  劇中每個人都在愛，都在試著去體會愛，去感受愛，小孔與王大夫間；小馬迷戀上小孔；

  泰和與金嫣之間；小蠻愛上小馬；都紅暗戀小馬；沙復明的假性癡迷都紅...大家都像正常

  人一般，去享受愛情所帶來的歡愉、挫折、與全新的感受。盲人跟健全人沒什麼不同，他

  們同樣談戀愛，同樣做愛，可以很激情，也可以很理性，或許就像電影裡面提到的，正因

  為他們看不見，所以才能看得更清楚。


  「其實就是你的虛榮心迷上了一個概念。」美是什麼？美是一種主觀想法，每個人對於「

  美」的定義不甚相同，不過對於看不見的盲人而言，美不美，重要嗎？因為來的客人都說

  都紅人美、身材好，就讓渴望愛情的沙復明「自以為」愛上都紅，或者更該說「應該也要

  這樣」般的迷戀上都紅，但對都紅而言，這不是愛情，愛情應該是用心體會的，尤其對他

  們來說，正因為看不見所以更要用心去感受，不是嗎？如果哪天，沙復明重見光明了，那

  麼他看不見時的都紅的美，在他看見了之後，還美嗎？還會追求她嗎？


  我喜歡都紅對小馬所說的一番話（怎麼辦我好喜歡都紅），「對面走過來一個人，撞上了

  ，是愛情；對面開過來一輛車，你撞上了，是車禍。但不曉得為什麼，車和車總是撞，人

  和人呢，總是讓。」幾句短短的話語道盡了她心中的感受，很明顯都紅是喜歡小馬的，纏

  著她的卻是沙復明，暗戀的小馬偏偏卻是癡迷小孔，但小孔有王大夫了啊，好不容易小馬

  不愛小孔了，結果又多了個小蠻，怎麼會這樣呢？惆悵啊。


  我很喜歡片中的「明暗理論」，起初我以為他們想講的待在明處的是健全人，待在暗處的

  則是盲人，結果卻是相反的，對於盲人而言，健全人就像神鬼一樣，神聖不可侵犯卻又令

  人感到畏懼，能躲多遠就躲多遠，或許是因為他們看不見，才會更加坦承赤裸的面對彼此

  ，但健全人儘管看的見，卻有太多太多不真誠的想法與內心，所以盲人就像生活在光明處

  一樣，坦然的去接受，坦蕩的去愛，而健全人則躲在暗處，愛的有所保留。


  電影的最後，沙宗琪推拿中心消失了，被轉賣了，員工只好各奔東西，我想這不是因為小

  馬與小蠻私奔，都紅手受傷無法工作，導致師傅不足經營不下去（當然很多客人都是衝著

  都紅美而來的），更大原因可能是在暗示推拿事業的夕陽化，醫療的蓬勃發展，讓推拿變

  成僅是讓人花些錢去放鬆身心的休閒活動而已，沙宗琪的沒落是有點那麼淒涼的。


  《推拿》在金馬獎收穫豐盛，不僅張磊憑藉小孔一角奪下最佳新演員，也拿下金馬獎最大

  獎的最佳影片的殊榮，算是替這部如果是靠著配額上映一定很少人知道的中國電影打了一

  個不錯的口碑，希望大家多多進戲院看《推拿》囉。


  《推拿》片尾曲－《他媽的》（原唱：堯十三）

  這首歌歌名很酷，歌詞赤裸直接，旋律簡單卻吸引人，口琴那段也好有感覺啊。


  節錄歌詞：


  媽媽，我愛上一個姑娘，可是她在別人的床上呻吟。

  我想知道，她是不是真的快樂，我去問她，她沒有回答。

  媽媽，我做了一個夢，我夢見我在紅色的天空飛翔。

  可是媽媽，我知道我沒有翅膀，所以我死了，就像我出生一樣。


  如果時間可以倒流，我會在第一天就閉上眼。

  然後什麼都看不見。

  什麼都看不見。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
