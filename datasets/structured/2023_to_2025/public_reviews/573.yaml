url: https://www.ptt.cc/bbs/movie/M.1424347602.A.4AC.html
title: '[普雷] 推拿--情不自禁想要抱怨的作品'
content: '我沒看過畢飛宇的其它作品，但我覺得《推拿》不好。或許是畢飛宇太急於展現盲人

  世界的特殊性，敘述性的句子佔了累累篇幅；而炫爛的技巧又顯得畫蛇添足。或許是說書

  式的吧，天花亂墜的散亂空中，而支離破碎。如果你不知道我到底在說什麼，或許我舉例

  如前，也或許舉例如後：「怨是不可怕的，可怕的是積怨。積怨是翅牓。翅膀唯一能做的

  事情只有一個，張開來，朝著相反的方向振翅飛翔。」


  　　一看就知道，多了。不過不得不說，它是個令人想要往後翻的故事，每個人的生命都

  拉得長長的，追本溯源的說了一遍。


  　　我也覺得婁燁改拍的不好。且先不說我還沒喜歡過婁燁的作品（我也只看過《頤和園

  》與《浮城謎事》），但單就這部作品，我有點拿不準，我應有的標準為何？小說的字句

  一直在我心中冒出，但我當然知道改編的作品總有些取捨。而電影嘛，難以處理長篇

  小說──總然原著有好一些純為炫技的雜頁──，切割打磨使其更易融於電影本是必然

  。但有些切掉的脈絡在我心裡實在太強烈了，我反而覺得與其要硬塞不如不要出現。像羊

  肉事件，在小說裡化開的是兩位老板心中的結，但在電影中就像是事件中帶過了。而王大

  夫憑什麼對不住父母？沙老板吐血是為了什麼？金嫣跟泰來幾幕的空間想要些什麼，而哭

  過後呢？以上種種整個刪掉對電影有差嗎？本是多麼精彩的橋段變的不痛不癢，我瞅著也

  覺得有些可惜。


  　　見皮不見骨了吧這，更何況畢飛宇的骨本就沒有相當踏實。


  　　所以呢？婁燁想說什麼？旁白振振難免，印象未見卻也呈現了小說的某些樣貌，而如

  沒有那些解說明眼人也不見得能見其中梗概。但多了少了；裡邊有一段說命運是看不到的

  ，盲人也看不到，所以盲人比明眼人更瞭解命運。是嗎？還是希臘神話中預言者必然是瞎

  子而致的文學比喻或有關於中國傳統中的什麼？此外，對於電影本身的提醒又是什麼？過

  不在手法，過在婁燁的濫。對於鏡頭的擺弄也是，柔焦鏡或許是說明小馬的惶恐，但依然

  多了。


  　　不過不可否認的是有些地方相當動人，如王大夫與小孔甫出場，我眼框就不禁覺的濕

  了。小馬一開始就將小孔壓在床上，舔其胸部而後的嬌嗔，其他人傻愣靜默著若有似無的

  知道些什麼，是本片最精彩的改編；而片中的兩張照片（我記得小說中沒有，但不太確定

  ）相當動人，浮出水面而想被人看見的印記。


  　　其他呢？其他就沒有了。我很喜歡開頭的構想，把屬於字幕的名單念出來；但最後的

  演員名單聲隱了，可惜。演的既是一群盲者，讓他們真實的存在於其中更為重要。可惜了

  。


  --'
