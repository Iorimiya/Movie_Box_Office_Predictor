url: https://www.ptt.cc/bbs/movie/M.1517552441.A.2EA.html
title: 'Re: [情報] 一一/青梅竹馬：限量藍光BD套裝 獨賣活動'
content: '結果，吃個午餐回來就看到傳影新的公告修改了活動細節，也算是有講有改進啦


  主要是修改了每人限購數量由"10"->"4"，這個數量看起來就正常多了

  另外則是蝦皮數量增為200，看來就外縣市的同好來說應該也算是有個量了


  畢竟以個人收BD到現在的經驗來說，"200"不算是極少量

  得利近期幾片當紅的鐵盒可能也差不多200-300左右

  而這類經典重發的片子銷量其實是很難評估的

  能除了現場之外再有200套提供網購其實算是很OK了


  情報來源：傳影互動FB





  ＊　＊　＊　＊　＊　以下為FB活動原文　＊　＊　＊　＊　＊


  各位好：

  活動辦法更新如下：現場每人限購套數由10套改為4套，預先保留網路銷售的數量也調整

  為200套。

  　

  限量總數沒有特別公告，我們考量其實便是不想讓「買來想脫手轉讓」的黃牛有噱頭、或

  是以數量多寡去評估收購數量、甚至哄抬價格的幅度等等。目前的總套數，除了依照大家

  對此份商品的期待及關注，也評估了我們過去的藍光銷售經驗，以希望能盡量滿足想要購

  買的觀眾為原則。

  　

  關於銷售通路方面，考慮到眾多影迷為學生、且為了盡可能降低蒐藏的門檻，而同時在製

  作規格必須有一定水準的要求下，本次商品的成本相對高出平均許多。若以大家熟知的方

  式鋪貨通路實在難兩全，這便是我們僅能折衷自行銷售的原因。

  以上還請各位朋友理解。

  　

  其餘問題回應如下：

  1. 活動當天僅接受現金交易，無提供刷卡服務。

  2. 除了實體光碟，《一一》《青梅竹馬》於各大線上平台皆有銷售線上高畫質觀看版本

  。

  3. 本次發行數位修復版《青梅竹馬》來自「世界電影計畫」之數位拷貝、《一一》為標

  準蒐藏 The Criterion Collection 提供之數位拷貝。


  ＊　＊　＊　＊　＊　以上為FB活動原文　＊　＊　＊　＊　＊


  不過老實說其實我只想收《一一》....(被毆

  《青梅竹馬》太硬了QwQ


  --








  --'
