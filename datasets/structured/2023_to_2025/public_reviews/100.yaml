content: '【2022/05/10 iTunes 特價報】

  花火／一屍到底／聯合縮小兵／拾光人生／一一／灼人秘密／是枝裕和作品

  －

  今天的特價片單是華語片和日片的回合，首先推薦雙雙特價的到$150，北野武的兩部代表

  作《花火》和《奏鳴曲》。這兩部都是貫徹北野武電影美學的經典，現實無比的社會劇情

  ，還有久石讓操刀的音樂表現，都是讓觀眾回味無窮的元素，很值得收藏。另外《一屍到

  底》的第一集也非常難得特價到$190，這部以電影現場為背景的喜劇，在當年可說是話題

  十足，推薦入手。

  －

  華語片的部分我們這次整理了三部$190的好片，其中楊德昌執導的最後一部電影《一一》

  是這次片單亮點，本片架構在平實的背景上，以劇中透過各個角色戲份安排對社會提出不

  同的詰問，讓觀眾產生強大的共鳴。$90的部分則是推薦伊麗莎白歐森主演，賺人熱淚的

  《拾光人生》，喜歡公路電影的朋友簽完不要錯過。

