url: https://www.ptt.cc/bbs/movie/M.1504450719.A.5C1.html
title: '[思考好雷] 一一'
content: '“人只能看到一半，另一半自己看不到，所以我拍給你看。”



  戲如人生，常常人的外表跟內心是不一樣的，戲中人也如此。


  看似油條的大學同學卻乖乖被太太公然嗆也不吭聲，反而最老實的“好人”NJ其實從沒愛

  過太太，開開心心毫無愧疚去外遇一星期。


  一生的愛放棄也“不用再重來了。”


  沒愛的人卻倒頭來是一起繼續生活，說真心話的家人。


  一屋子家人卻沒有愛。


  自己女兒去開房間，兒子一直被霸凌，在學校也被老師惡搞，不知道也不想知道。爸爸還

  好意思說“女兒像情人，兒子像朋友”


  義憤填膺駡兒子怎麼可以不關心婆婆，

  拒絕跟婆婆說話的媽媽自己拋家棄子最爽快。


  看似好人工具人的姊姊其實根本在玩愛情遊戲，如胖子怒吼的沒真的愛誰，也在玩假工具

  人，一有機會就跟“好友”的男人開房間。（看到開房間那幕，胖子嚇得抖如風中殘燭，

  姊姊卻鎮定凝視，我真的笑了，

  楊德昌很會，看起來很乖的女生常常玩得其實很大XD）


  投資有成，事業有成，在同學間有人望的雲雲姨卻是無怨無悔的工具人。

  看似潑辣會搶男人的舅媽其實一嚇就打回原形變小女人哭著認錯。


  從外表到內心都徹底渣男的舅舅，卻只有他在某刻洞悉了一切，看著新生兒說“好可憐”


  有氣質的會拉大提琴的鄰居卻是最破的。


  應該是教導學生關愛學生的老師，不管是國民義務教育還是“最難考”的北一女，都是人

  渣。


  會裝可憐躲媽媽們懷裡撒嬌的女孩們卻是霸凌者。


  植物人的婆婆卻是家裡大家告解的“神明”


  聲嘶力竭哭喊的女人，卻其實最自私，大言不慚的從以前到現在都把男人當工具人：年輕

  時逼男友念可以賺錢的系，老了告白時還是開口閉口不離錢。


  你唯一的愛也不在你身邊，（NJ組）

  真愛你的人也不能在你身邊。

  （舅舅雲雲姨組，胖子破麻組）


  好人都沒被好對待，壞人可以腦滿腸肥左右逢源還突然就大賺一筆，跌倒加吸瓦斯一夜也

  不會死，好人幫忙情竇初開的外孫女倒個垃圾就變植物人。


  正要開始的人生，小小年紀找到就找到自己一生所愛的事的人，卻說“我覺得我也老了。

  ”


  反覆發生似曾相識的場景時空，即使能互相解釋呼應，卻如NJ所說的

  “說不上來，不知道為什麼”

  解釋不了開頭也阻止不了劣化。

  我們在導演精心設計的這齣劇裡，

  看著以這家人為中心向外延伸的人們的人生百態。


  電影我最喜歡的部份是愛如電光石火展開。


  至於成年後愛不是一切，

  獨自在海邊承受心如浪般波濤洶湧的中年男子，

  跟不分城市各自因私欲在玻璃窗邊，

  在梳妝台前，痛哭涕淚縱橫的中年女子們，

  我則都沒興趣，雖知其所以然，

  不過還是覺得，你們就這樣吧~（冷漠臉）


  楊導大概也覺得受夠這群哭腰哭北自私自利的中年男女了，他唯一的溫柔是給了小綠綠。

  全片最跳tone的部份就是那邊了，不過沒人不喜歡吧XD


  光看吳念真演愛情戲站在棉被前抱著女人，我已經很容忍了~

  雖然我喜歡吳念真，但看時一直在怕

  “拜託喔～我不想看吳念真親跟床戲”

  厭惡度更勝看渣男小舅子露毛～


  本來覺得楊導真是討厭小綠綠，

  ”牯嶺街少年殺人事件“裡的北一女姊姊根本是家裡的工具人，“一一”也是，後來覺得

  其實楊導更討厭建中的吧？兩部建中的都被戴綠帽還殺人www


  喜歡的西班牙youtuber說“一一”改變了他的一生，讓他決定長大後要來台灣看看。

  而常協同拍攝工作，吃盡楊導苦頭的小野，吳念真寫的一堆心路歷程的書我也看得不少，

  老實說，台灣討厭楊導的人不在少數，我對他也沒好感。當知道他選擇不在台灣上映的原

  因，我是冷笑的。

  這也讓我多年刻意迴避這部電影。

  如今終於進入戲院看這部電影，多少有解任務的感覺~


  這部片設計精緻，要講的也涵蓋很廣，

  看完後再一一細讀各種影評，思考回味，

  是看經典片的附加樂趣之一啊～



  --

  死胖子的確是緊要關頭發現自己真愛的是莉莉才臨陣脫逃，爸爸的初戀情人為姊姊作了旁

  白：她的確是想用性確認愛。不過姊姊也只是借假愛情消遣失眠時光，玩超大的~

  都第二次了XD滿滿的惡意啊～

  看死胖子受驚倉皇逃離，我鬆了一口氣，覺得好險。

  小妹妹婷婷痛哭，我則在想幸好唷～老一點才會懂（婆婆式微笑）

  她的確是想用性以擁有什麼，

  當然憧憬跟好感是有的，

  不過婷婷給我的感覺是在哪裡都當合作的乖小孩（工具人）以換取一個生存空間：

  在家不用說，

  在學校被公然婊也直覺的跟著笑，

  全班沒人會為她說話，

  交朋友也是。

  沒人愛她，她也不見得真愛誰。

  如：一直看弟弟被霸凌，

  她也無動於衷，只是剝蝦吃。

  （除了婆婆讓她在意到能傷害她跟拯救她）

  如果真的在乎就會跟隔壁莉莉一樣又哭又叫了

  （當然片裡哭越大聲的越自私）

  也可能在婷婷家哭叫沒用，

  所以她早就不會哭了。

  愛情也是她期待幻想的一個出口沒錯啦

  ！'
