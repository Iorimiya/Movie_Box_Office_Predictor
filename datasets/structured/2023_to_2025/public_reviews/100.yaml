url: https://www.ptt.cc/bbs/movie/M.1513210970.A.EB5.html
title: '[好雷] 星戰8 大量致敬前作橋段再一一顛覆'
content: '防雷





























  不知是不是因為Ep7被批與Ep4套路太像

  Ep8這次採取一種

  「讓觀眾以為劇情又是朝某個經典橋段的方向發展 最後結果卻完全不同」


  例如：

  1.「遇到愛錢如命、形象無賴的隊友加入，一起入侵敵方陣營」

  Ep4：韓蘇洛最後沒有拿了賞金就走 還返回救援

  Ep8：主角們被出賣


  2.「主角走進充滿原力的山洞中，尋找自己的秘密」

  Ep5：路克遇到黑武士幻影，打倒後發現面具下是自己

  Ep8：芮發現只有孤獨的自己


  3.「主角與使用黑暗原力的敵方首領以及其大將對峙、同時我方艦隊慘遭打擊」

  Ep6：路克與黑武士對打，最後黑武士良心發現殺掉皇帝

  Ep8：凱羅忍馬上幹掉史諾克，但目的是篡位


  4.「久違的師徒相逢，光劍對峙兼敘舊」

  Ep4：歐比王最後自殺

  Ep8：原來路克是幻影→看到這段時我在想，如果等下路克也學歐比王那樣，我會想丟鞋


  此外：這部電影也有很多顛覆觀眾期待的橋段


  1.很多電影常會有那種

  「不受拘束的主角看不下去高層的保守與不作為，決定自己行動，事後成功解決問題」

  而這次波發動兵變 但事後證明他的確太過魯莽行事

  （雖然我不解 何朵其實可以告知他們是要前往舊基地的事）


  2.芮的父母原本以為會是影響銀河系的大人物 但真的就是Nobody

  （雖然我還是期待Ep9再打臉一次）


  3.路克看到光劍 在Ep7結尾拍得有點感人 沒想到Ep8直接丟掉 囧


  總而言之 這集充滿各種神展開 而且是建立在對前幾集熟悉的前提之上

  雖然前面有網友抱怨太多致敬了

  我反而覺得以一個知名系列來說

  這種先致敬再打臉的做法 反而是這集好看的地方啊！


  --'
