title: '[好雷] 一一裡的肖查某'
content: '不知道為什麼


  但我想起了牯嶺街裡的小明。


  想了她對小四說，這世界是不會改變的，我是不會改變的。諸如此類的話。



  其實我非常喜歡[一一]


  關於遺憾，無法放下的遺憾。沒有人似乎能比中年將老的楊德昌更明白。



  但是電影裡充滿那麼多歇斯底里張牙舞爪的女人角色，對我來說，非常有趣。


  當然小綠綠婷婷不是，她非常溫和 差點讓人懷疑她念的是不是溫良恭儉讓其中一班。


  (看到的拷貝好暗，我實在沒注意班級名稱



  但是她媽媽是。


  當NJ好平常心地在辦公室打了那通國際電話給初戀情人


  一回到家，媽媽敏敏就在暗掉的房間裡崩潰大哭，因為覺得生命平淡她擁有得很少。


  此其一。



  而隔壁家的單親媽媽蔣太太更是，


  她會跟情人(or炮友)吵架，吵到對面都聽得見。


  她會大聲叫床，叫的淫聲充滿整個樓梯間。


  此其二。



  而蔣莉莉，更是完全蛇蝎女典型


  不僅玩弄清純建中男生，連媽媽炮友英文老師都搞上


  更別忘了她敞開大門的一場大喊


  “你是我英文老師，妳是我媽媽耶！！！！"


  此其三。



  還有柯素雲的阿瑞。


  多年不見，她看到老情人沒多久，多激動


  聲淚俱下，“你為什麼沒有出現，你知道你害得我慘！”(之類的


  然後一趟旅行，就要NJ跟她重新開始。激動，哭喊，擁抱。


  NJ只淡淡說，這個project太大了，我做不完。


  超靠北的。


  此其四。



  當然也別忘了蕭淑慎的小燕，跟死對頭雲雲之間。


  雲雲一開始在婚禮鬧場，小燕也在滿月酒上發飆。



  女人的情緒 女人的欲望


  在楊德昌那麼壓抑的電影語言中，


  顯得如此張牙舞爪，如此無法掌控


  就連最乖的婷婷，當她跟胖子進到旅館，逃跑的人也是胖子


  電影裡，懦弱的，從來都是男人。



  女人做出決定，而男人只能被動地順從，或是逃跑。



  從小明到莉莉，這種因為環境而產生的人盡可夫的女人角色，


  對我來說，非常有趣。


  她如此令人難以捉摸，如此致命，總是引發殺機。


  但因為總是“她”，是第三人稱，


  所以這裏頭，沒有主體的論述性。



  在電影裡我們看到莉莉各種行為背後的原因，


  但是她不為自己說話


  我們因此也就看不到她內心的繽紛或是荒蕪。



  她如果到了另一部片，可以變成性愛成癮的女人。


  但是在[一一]，她就只是，一個少年兇殺案裡的關係人。




  一個中年將老的男性導演


  手中老是把玩這樣火一般形象的女人



  對我來說，真的是很有趣的一件事。










  --

  感謝

  啊 是小明！ 已改！

  有啊！我很確定?!

  的確在楊的電影中女人是很複雜的樣貌

  但我說不上來 好像是滲透著某種無法控制的恐懼感？

  那麼張牙舞爪的女人們，但NJ的確比較像是第一人稱，而女人們 像是第三人稱？

  恩恩，是，我只是想點出一個面向是，片中的男人好像比較少大吼大叫 女人比較激動點？

  誒對！是這樣沒錯。

  但是好像都是被女人的欲望所惹毛的？

  恩恩 我只是想點出 這部電影裡的女人形象 對我來說 就是很有趣 可以再想一想

  但蔣太太跟莉莉的呈現 都不是很正面的？

  我的感覺只是，這些充滿欲望的女人 好像 很自我？很具破壞性？

  女人和欲望 於是不是導向一個歡愉地 享受欲望的結論？

  我覺得胖子比較像退而求其次 但莉莉比較像玩弄？

  我知道她有她的原因 相信我 我懂

  可是她念那些激動對白的樣子 哎 我不知怎麼說才好呢

  是！我要說的就是這個

  天兒啊 我喜歡你id 哈

  男人軟弱遇事就逃 更襯出女人的力道

  但視角還是在NJ身上的 雖然很多時候跟著婷婷走 但婷婷比較像個載具？

  我是說 電影裡的男人雖然都軟弱 可是他們得到了很多同情跟關注

  女人強勢 張牙舞爪 但觀者進不到他們內心

  真的 然後那過大的制服 跟回家路上都要卷一本書 到底是怎樣啦啦啦啦！

  真的！ soul mate! 我好喜歡大田那角色！

  男人的情誼果然就是牢不可破啊！

  謝謝支援！

  好啦好啦 我是女人 我最可怕！'
