url: https://www.ptt.cc/bbs/movie/M.1529002089.A.064.html
title: '[討論] 一一是討論層面最廣的台灣電影嗎'
content: '前幾天看完傳說中的 一一


  雖然我私心喜歡楊比較早期

  老台北的氣氛


  但一一故事探討層面之廣

  令人震撼!


  中年危機.青少年愛情.性啟蒙.世代差異.教育傳承


  連諷刺台灣產業短視近利都寫進去了


  幾乎每個角色都有1~2個代表的價值面向 哇靠!


  有這樣近3小時篇幅的國片本來就不多

  牯嶺街4個小時 但包含的層面跟角色線明顯沒有一一廣


  我在想

  一一是否就是國片

  故事所觸及的層面最廣的了


  還是有其他接近的作品呢?


  --'
