url: https://www.ptt.cc/bbs/movie/M.1541030419.A.0DE.html
title: '[新聞] BBC百大非英語系電影 《悲情城市》《一一'
content: '新聞網址：


  BBC百大非英語系電影 《悲情城市》《一一》入榜


  【李子凡╱綜合報導】英國廣播公司（BBC）邀請來自43國共209位國際影評，選出「百大

  非英語系電影」，兩位台灣大師級導演──侯孝賢與楊德昌，分別以《悲情城市》獲得第

  18名，《一一》則是第25名；黑澤明執導的《七武士》被評選為第一。

  侯孝賢1989年推出的《悲情城市》，曾獲威尼斯影展金獅獎榮銜，以台灣228事件為背景

  ，藉林家4兄弟的故事，描繪當時台灣人歷經的痛苦與掙扎。該片在台灣解嚴後2年上映，

  也讓台灣人再度檢視這道歷史的傷口。


  楊德昌遺作獲盛讚

  《一一》是楊德昌生前最後一部作品，被BBC影評譽為是他的極致傑作，藉由一個台北中

  產家庭的婚禮、愛情三角習題與葬禮等生活大小事，體現日常生活的紛擾、創傷與喜悅。


  --

  從今天起勉勵自己告別過去的荒唐，重新開始新的人生


  希望能在離開這個世界之前，真正的為其他人貢獻付出


  --'
