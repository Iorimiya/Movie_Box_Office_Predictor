title: '[好無雷] 一一值得一看'
content: '我在2010年讀大學時候有跟別系的女同學借DVD來看 而我去小七買巧克力飲料請她喝

  內容非常平淡無奇 當我看完要還她的時候 她有跟我討論一下劇情 (算是考我)

  我回她 我記憶較深刻的就是阿婆迴光返照

  到我剛剛看完 整部片印象最深刻的我也是只能說阿婆那段

  但是雖然內容沒什麼特別的爆點 但你會發現時間過很快 一下子就過了174分鐘了

  而在這段時間內 我非常融入劇情 完全沒看手錶


  看完意猶未盡 真的演的不錯 我也就只記得女主角是北一女的學生這片段

  不敢說很好看 但是相信看完會收穫滿滿 但就像上次那"夜校女生"

  我劇情也快忘光了...


  --


  那個....那個.....實現我的夢想(小聲)  摸你的頭  欺負你到哭


  --'
