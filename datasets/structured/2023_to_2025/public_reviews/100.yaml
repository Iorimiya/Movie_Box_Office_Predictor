title: '[請益] 一一的討論（有雷）'
content: '防雷頁


  1.在建中男（胖子）殺人後的社會新聞中，最後使用類似快打旋風的遊戲呈現，而之前NJ

  公司第一次跟大田的簡報中，大田先生說現在的遊戲都是打人殺人，但是可以有更多可能

  ，不是我們不了解電腦，而是不了解人類自己

  這兩個畫面，是有想要前後呼應嗎？

  自己感覺可能有，但連結點說不上來，有人也有想過這邊的嗎？

  順道一提

  新聞畫面帶到胖子的時候，牯嶺街的畫面又上來了

  而新聞上面寫胖子姓龐，這是他叫胖子的原因嗎？（音近）



  2.看完一一後，更覺得楊導的作品都讓我很難想像是台灣人拍出來的

  為何這樣說呢，因為從小到大接觸過的國片

  幾乎想不到能有同等的結構跟運鏡

  一一裡面我蠻喜歡的幾個鏡頭分別是


  1.NJ跟婷婷回家整理，從地下室開車上來時，畫面隨著車子運行，鐵捲門緩緩升起，整個光線慢慢進來，照亮車廂



  2.阿弟跟小燕的在圓山（是嗎？）婚宴中，站著桌上跟同學喝開了，喝著特調的深水炸彈，

  整個畫面中，新娘的嬌羞，美國的起哄，旁邊爛醉的朋友被扶起來有倒下去，整個畫面給

  人非常快樂的氛圍



  3.洋洋砸完水球躲到視聽教室，小老婆（糾察隊女生）進來找人時，被勾到裙子的畫面（

  啊啊不是），是之後她站到前面找人，搭配自然科影片介紹天氣時，剛好講到閃電的畫面

  ，隨著婷婷的四處查看,面部被閃光照亮著,是我整部最喜歡的一段


  大家還有什麼喜歡的畫面

  一起來分享看看吧～

  有人說一一是藝術片

  但我覺得它更像是那個時候的台北濃縮

  把當時的生活完整呈現

  雖然在胖子跟婷婷的約會中，提到如果電影拍的跟生活一樣，就沒人要看電影了

  但楊導這部片我覺得呈現的很好

  就像是大田說的，每一天都是全新的，同一天不會重複兩次

  把週而復始的生活拍的每天都看似不同，更是需要對生活細膩的觀察才做得到

  而整部片拿著相機到處觀察的洋洋似乎就是表徵



  最後，真的蠻推薦大家去看看的，雖然片長偏長，但跟牯嶺街一片一樣，個人覺得每個故事線收線都很流暢，都沒感覺到時間過了，是一部值得進去看的作品


  --

  真的，我出戲院才發現

  可能再等台灣時機成熟再上吧，只不過楊導沒等到

  我一開始看到婆婆醒來很開心

  但是婆婆一直沒回應婷婷的自言自語

  之後才意識到婆婆已經走了

  婷婷說：妳醒了，我才睡得著啊

  婷婷這次終於睡著了，但是因為婆婆不會再醒來了

  我也這麼想

  我也這麼想

  小弟八年級生，無緣躬逢其盛

  紅柱子～

  你是幾年級的呀？

  我知道你說的！

  莉莉好可憐呀...

  我有想過是不是在呼應一個醒來另一個就入睡的對稱

  這邊旁白我都沒注意聽到，聽到水循環就沒仔細聽了，原來有這段！

  我單純沈浸在畫面中

  解讀是很有道理呀

  我有注意到，親下去變綠燈

  我沒想到這個層次欸！

  最後兩個男人都沒那個膽'
