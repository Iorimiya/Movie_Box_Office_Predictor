url: https://www.ptt.cc/bbs/movie/M.1758452128.A.8D3.html
title: '[好雷] 一一觀後感，仍然感動人心'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  這禮拜適逢楊德昌導演的"一一"以數位修復版的方式重新回到院線，第一次看到這部電影

  是在大學的通識課，也因為這部電影，讓我從此走入電影美好的世界．．．。


  距離第一次看也快六年了，當時印象也沒有哪個場景是特別有感觸的，就覺得這部電影說

  故事的方法觸動到我的內心。或許是當時面臨即將畢業邁入職場的不安，這部片讓我感

  受到其實人生沒有這麼複雜，世界上還是處處充滿溫情。


  去年自己第一次自己一人到東京旅遊，其中一天就是安排到東京的赤坂冰川神社去走走。

  出發前在再看了一遍電影，隨著年紀增長，好像慢慢地知道自己想要的生活，也努力的往

  自己憧憬的未來去實踐。隔了幾年再看，最感動地的是ＮＪ跟阿瑞在日本的那段，尤

  其是在神社的長階梯，ＮＪ跟舊情人訴說當年不告而別的原因，其實第一次看我很不能

  理解，年輕的ＮＪ跟阿瑞應該都是深愛著對方，只是因為對未來生活的理念不同，就能

  如此狠下心來決定離開，感情難道不是兩個人一起努力往下走嗎？　如果兩個人真心

  相愛再一起，但卻因此而分離，是不是代表這段感情某些方面失衡，另一伴沒法接住

  對方的感受？

  也或許在故事裡面，ＮＪ也透露了一些：考上電機系那天，爸媽很高興，女朋友很高興，

  反而我是最不開心的那個人。可能是時空背景不同、價值觀不同、感情歷程不同，可以感

  覺到ＮＪ說出來背後的心酸與難過，但是畢竟這是自己的決定，而故事裡的ＮＪ也有了一

  個自己的家庭，或許這是所謂人生中的無奈？

  或許有些事情勉強不來，但我沒經歷過，就請大家補充吧．．．。



  回到阿瑞身上，他說當時等不到ＮＪ，覺得自己人生都完了，後來在熱海的飯店，誠實

  的將自己心中的想法傾訴出來，只是兩人都已經不是當初的自己了。都已經有各自的家庭

  、事業，縱使想要回到年輕時相愛時候，時間、地點、環境都已經不同了，唯一相同的是

  ，他們都還記得彼此的習慣，阿瑞緊張的時候會打嗝，ＮＪ緊張的時候會流汗。

  我真的好喜歡這段日本的故事，能夠留下記憶的，是那些最平凡不過的時光。


  這部電影確實帶給我很多的啟發以及對於價值觀的改變，也因為一一讓我認識楊德昌導演

  ，也帶領我走入電影的世界。也很感謝再大四的自己修了那們認識台灣電影的通識課，看

  了很多台灣新浪潮時期的作品，藉由這些作品知道在我還沒有出身以前的台灣的樣子，也

  謝謝這些作品將台灣的文化保留了下來，雖然我沒來得及參與，但至少在電影裡面，可以

  暫時享受那時候的美好．．．。


  我覺得這部電影每個角色都有一段想要說的意義，喜歡一一的朋友們，不妨也分享一下吧

  ～

  最後跟大家分享東京赤坂冰川神社的照片，仍然跟電影裡一樣的平靜美好。


  謝謝看到這邊的你，祝大家有個美好的周日夜晚。

  --'
