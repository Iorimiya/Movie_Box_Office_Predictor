url: https://www.ptt.cc/bbs/movie/M.1501538883.A.2AC.html
title: '[ 好雷] 一一 The young know everything'
content: '奧斯卡.王爾德曾說過：「The old believe everything, the middle-aged suspect eve

  rything, the young know everything. 」


  對我來說，楊德昌電影《一一》用了三小時、一個家庭四個人的故事體現了這句名言：


  明白人生百般日常之必須的媽媽敏敏；


  放下如果再重活一次，愛也註定缺遺的爸爸NJ；


  懷疑著如果不做愛自己是否就不配被愛的女兒婷婷；


  最後是對愛、對生命好奇探索的小兒子洋洋，以他的角度告訴我自己所看不見的背面，還

  有這世界的背面。


  生命的答案多半簡單但總是那麼地不完美，不完美到我們無法接受，只好丟掉答案又繼續

  苦苦追尋。


  留白，實實在在也是彌補了一首詩，一幅畫它們最美好的模樣。


  看完後，我覺得我也老了，但還是相信自己能永遠緊握著青春。


  --'
