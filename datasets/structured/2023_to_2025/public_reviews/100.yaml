title: '[討論] Apple TV 特價 隔離島/母親！/微笑/一一'
content: '【2024/10/25 Apple TV特價報－派拉蒙大片特價＋萬聖節片單+爆米花日】

  隔離島／赤眼玄機／母親！／天才雷普利／暗湧情事／微笑／驚聲尖叫系列／七夜怪談西

  洋篇

  －

  特價連發來囉！這一波是爆米花日和萬聖節的應景片單，還有我覺得超有料的派拉蒙$190

  大片特價。首先馬丁史柯西斯執導，李奧納多主演的燒腦大戲《隔離島》是這次絕對不能

  錯過的一部。這部片的一大樂趣就是跟著主角的視角一步步推敲島上的狀況，沉浸在虛實

  交錯的劇情迴路當中，是會讓人想一再回味的好片。另一部超難得特價，珍妮佛勞倫斯主

  演的《母親！》則是評價兩極的爭議之作，我覺得算是難得的收藏機會，有興趣的朋友可

  以把握。

  －

  緊接著是今年的萬聖節片單，一口氣特價了許多恐怖系列。除了最近推出續作的《微笑》

  算是風頭上的話題之外．娜歐蜜華茲主演的《七夜怪談西洋篇》也相當齊全，風情跟日本

  原版大有不同，值得入手新手。《驚聲尖叫》更是有經典的前兩集特價，相當超值。稍微

  可惜的是《月光光心慌慌》只有少數在列，《十三號星期五》的特價也獨漏同樣有在架上

  的第一集，當然想要補齊收藏的朋友還是可以考慮。

  －

  最後是爆米花日，濱口竜介的早期代表作，影像和對白都非常厲害的《暗湧情事》終於特

  價到$90。這部應該有不少人在等，建議把握時間趕緊入手。楊德昌值得紀念的大作《一

  一》也在本次片單中，一樣都是為期三天，大家不要猶豫太久。

  －

  以上，祝大家看片愉快！

  －

