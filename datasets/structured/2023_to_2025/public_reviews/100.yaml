title: '[討論] 我是唯一一個預測"復仇４票房＞鐵達尼的"'
content: '剛爬文看了一下


  好像我是第一個...也是唯一一個預測到 復仇４票房會屌虐鐵達尼的??



  其實我原話是說 復仇4最終票房會坐落在28億美金左右 會超越阿凡達這ㄍ廢片


  既然都超越阿凡達了  那鐵達尼也只是小菜一碟



  我剛看一下新聞  專家也預估復仇４票房會落在28.2億美金


  跟我預估的非常相近  只能說 專家所見略同...哼 抄我的當然略同= =



  我預言的一一實現ing 下一步就是我預言的 復仇４會拿下奧斯卡+金球獎不少大獎



  1.男主角rdj

  2.男配角 美國隊長

  3.最佳導演-羅素兄弟

  4.最佳影片

  5.最佳劇本

  6.最佳人氣電影

  7.最佳視覺設計

  8.終身成就獎(rdj 他要退隱了)

  9.最佳配樂

  10.最佳服裝設計



  說實在話 復仇４根本不是商業片.....他就是藝術片、哲學片


  處處皆藝術 處處皆哲學  但是卻偏偏是史上全球最賣座ㄉ電影


  羅素兄弟>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>昆汀+諾蘭+李安





  --'
