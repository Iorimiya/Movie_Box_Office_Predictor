url: https://www.ptt.cc/bbs/movie/M.1522824585.A.468.html
title: 'Re: [思考好雷] 一一'
content: '大前天在誠品電影院看了<一一>，


  連同之前在公視看的，應該算是我第二次看這部吧。


  只是......都沒有看完整，看公視時不時分心轉台，在誠品電影院觀看時因遲入場錯過了

  前面約14分鐘。




  剛才在版上找尋"一一"，發現這篇(偽)好雷心得文。 XD



  乍看以為是惡意攻訐，


  因為片中一般觀眾覺得溫柔敦厚的角色，作者認為他們其實是冷漠虛偽；

  而潑辣混亂的角色，作者認為他們其實是熱情真誠。


  細心看下來，竟也言之成理。



  推薦這篇心得文給諸位版友，特別是覺得<一一>溫柔敦厚的版友們 ^^



  註：我是很想反駁他啦，只是個人思想淺薄，一時三刻辦不到 (汗)




