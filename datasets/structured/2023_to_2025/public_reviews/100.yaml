url: https://www.ptt.cc/bbs/movie/M.1501166569.A.95C.html
title: '[新聞] 電影一一首映 金燕玲怕哭慘不敢看'
content: '（中央社記者鄭景雯台北27日電）導演楊德昌電影「一一」時隔17年才正式在台灣上映，

  片中演員金燕玲、張洋洋、李凱莉全員到齊，金燕玲感動到哽咽，她怕會邊看邊哭，今晚

  不敢看首映，之後要獨自進戲院再看。


  電影「一一」今晚在信義威秀影城舉行首映會，相隔17年才在台灣上映，先前只有在部分

  影展期間播放，片中演員金燕玲、李凱莉、張洋洋、蕭淑慎、唐從聖、陳希聖今晚齊聚，

  獨缺男主角吳念真。


  吳念真透過影片獻聲說，「要記得一一，也要記得楊德昌。」想起既嚴厲又重視電影的楊

  德昌，金燕玲不禁眼眶泛紅，不過金燕玲說不敢看首映，怕會邊看邊哭，要獨自進戲院看

  。


  談及當年拍攝的趣事，從沒有拍攝經驗的兩位素人張洋洋、李凱莉表示，現在回想起來實

  在不知道當年在演什麼。


  蕭淑慎更打趣表示，有一場戲有她，但劇本卻都沒有指示，讓她好生沮喪，但是楊德昌告

  訴她，「妳很重要，要相信我」，讓她重燃信心。


  金燕玲則說，身為演員可以參與到楊德昌的作品很幸運，「他的作品真的非常好」。金燕

  玲和楊德昌的前妻蔡琴、遺孀彭鎧立都有好交情，但當時都不過問她們和楊德昌的感情事

  ，認為每個人說出來的面向都不同，沒有必要過問。


  新聞網址：


  --'
