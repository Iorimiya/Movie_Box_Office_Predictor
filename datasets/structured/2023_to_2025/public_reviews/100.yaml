url: https://www.ptt.cc/bbs/movie/M.1638109148.A.352.html
title: '[ 超好雷] 一一'
content: '雷文防雷資訊頁





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  以下照慣例，我會用凌亂的敘述打出我對「一一」這部電影的看法。


  20年了這部電影的背景，我們暫且稱他為自由戀愛後「情慾仍被封鎖」著的年代背景。


  現在的台灣有比較好嗎？


  電影一開始，用了個前女友到婚禮鬧場的狗血劇情，雖然狗血，但我想這種狀況，卻應該

  實實在在發生在某些人的生命裡的。


  故事節奏緩慢卻又筆直的前進著。


  在婚禮結束時，在電梯門口南峻（吳念真飾）碰上了阿瑞。


  他的初戀，在寒暄交換完名片後，阿瑞突然跑了回來，說著我一直在等你，一直在等你。


  那或許是一段，10幾年前的愛戀。


  他們也都中年並有家室了，原來愛一個人可以愛那麼長，愛那麼久。


  這讓我想起了一個已婚育有兩子的朋友，偶爾心情不好就會在社群軟體上用極小的字說：

  「我好想他」（前男友）


  我覺得好悲哀，但又如此深刻。


  或許得不到的才是最好的嗎？



  兩個女人愛上同一個男人，婚禮裡出現過一次，而扛著經濟壓力的阿弟，又常打腫臉充胖

  子，再某次聚餐結束後，泡澡似想自殺，最後妻子提早發現了他。


  慶幸的是沒有悲劇的產生。


  可愛八歲洋洋，總在與大人問答中說出了他超脫的見解。


  「你跟我看的不同，是不是永遠無法看見對方在看什麼」


  「我們是不是只能看到事情的一半，因為背面看不到」


  那想要點醒的是那自以為事的大人，或許從沒從小孩視角去關心他。


  而他也發現了，大家總是拿那看到一半的事拿出來評論而已，不問原因與背景。


  洋洋因為看過女同學游泳，某日他跳下了水，鏡頭未拍他上岸。


  我以為悲劇要發生了，最後也是濕淋淋的回家而充滿微笑。


  我想微笑或許是有人救他，也或許是他終於學會游泳，或知道什麼是游泳。


  年輕人三角戀，狗血的發生在每個人的周遭或自己，


  劈腿的人去找回舊愛，舊愛與別人有了感情，又回去找原本的愛。


  這段感情大家都是受傷的。


  而最後的悲劇確是敏敏跟與媽媽發生關係的英文老師發生不倫戀，導致小胖殺了英文老師

  。


  在電影結尾，突如起來的沈重讓我久久不能自己。


  我想那都是愛，每個人都很認真愛，沒有人有錯啊。


  可是怎麼會這樣？


  或許有人會認為英文老師死好，但我仍有百分之五十的相信他的愛也是認真的愛，對於敏

  敏和她母親都是。


  不過是有人受不了了


  永遠不可逆的悲劇就產生了




  而已婚的兩人南峻剛好與初戀情人阿瑞在東京一起出差，牽著手時說：「時間不同、地點

  不同、年紀也不同了。」


  阿瑞：「你濕濕的手依然」



  後來阿瑞突然又情緒崩潰的說：「那天我一直在那等我一直在那等，等不到你我就全完了

  」


  南峻本不想說出來的一一的娓娓道出，場景是遠鏡頭，彷彿敘述著，南峻已經看淡。


  他說：「父母與你都期待我考上電機系賺大錢大家都很開心，人是不可能讓人教你怎麼活

  下去，如何過日子，那是很悲哀的你知道嗎？但偏偏那個人是我最愛最愛的那個人。所以

  妳知道我的心有多難受？」






  到了分房睡的旅館時，阿瑞歇斯底里的又對南峻說：「現在的我不需要你養，我們可以私

  奔….，你是不是不愛我？我們重新在一起好嗎？對不起對不起。


  她鼓起勇氣表達了她的愛


  南峻：「抱歉什麼，還有人比我還了解你嗎？」


  阿瑞：「我每天都想到你，你知道嗎？」


  南峻溫柔的說：「想 慢慢的想」


  接著南峻一個人到了提防邊看著海浪抽菸


  後來兩人又回到旅館時


  晚上南峻要談生意，阿瑞說他很累可能一覺到天亮，正當阿瑞門關起來時，南峻叫了她跟

  她說。


  「我從來沒有愛過另外一個人」


  這是一段長達十年以上的戀愛，他們都還沒忘記彼此，但卻永遠無法回到最初了，有著各

  自家庭要背負向前。


  若你說「那些年一起追的女孩」是一部陽春的初戀故事，而在沈佳宜對著許多同學說：「

  你們想怎麼親吻我，就怎麼吻新郎」柯景騰毫不猶豫的擁吻了新郎，那份青春的摯愛讓我

  落下眼淚。


  那麼「一一」這部20年前的電影，則是在重逢初戀愛人的最美故事。


  他把台灣人的情感，簡單俗套卻又耐人尋味的一鏡一鏡拍著，不疾不徐的完成這部電影。


  面對親人的重病，小孩對學校大人所承受的重，年少那無法負荷的情感，直到長大了我們

  卻仍然被情慾束縛著，愛一個人就一輩子了吧？


  這是我最近的感觸


  愛一個人，其實就一輩子了。


  就算你後來討厭他，甚至交惡斷聯，但當你跟他有過一定交集後這種愛就自然而然的延伸

  了一輩子。


  「電影至少延長人類壽命比以前多三倍」


  這是電影裡的對白


  看完這部電影，好像就過完了一生。


  那個屬於他們的一生


  在他們身上或許可以找到自己的影子，於是你會更像電影，或更像自己一點。



  20年前的電影，放在現今仍然感動雋永著。


  人與人的情愛糾葛一樣大同小異。


  我想這是一部很棒的人生或初戀電影，安靜緩緩的不會想帶給你多大情感衝擊的電影。


  若要有情感衝擊，必定你是一個懂導演的人。


  你必須用自己的情感與之碰撞


  你才會發現 他 淡的很深





  最後獻上我在電影剛開始就發現，這首歌是否在致敬的歌曲「十二月的妳」


  看完電影建議服用



  我只是那個愛電影的人












  --

  他描述的那年代真的很棒 每個男生都會喜歡時一個恰北北女生

  怎麼說？

  哈哈 可能是想表達行屍走肉的人們，又不明亮但又知道有些人正在工作。 我是覺得楊導

  真的猛，不過目前只看過牯嶺街和一一

  對 很緩慢 到很像沒有要說什麼 卻又說的太多

  不錯不錯

  推

  我只能說是完全不同類型的導演，差很多

  我不太懂為什麼妳會覺得是老頭對少女的意淫，外貿演技演一個高中生都沒什麼問題啊。

  獨白我倒沒有太大感觸，真的有點硬要感，但說生硬也不會，因為洋洋的角色設定就是一

  個哲思的小孩

  覺得你說的很好，蠻怪我一直覺得怪怪的，一直以為是那年代風格什麼，但也不是。應該

  就如你所說的劇場感，但我並不會因為這樣反感，或許會有點切割故事流暢性，但另一個

  角度，則是每個故事每個角色在對話都是獨立的故事。我想或許就是他的自我風格吧。頓

  點多了點，但不會有硬頓的或許感覺也是他的技術。'
