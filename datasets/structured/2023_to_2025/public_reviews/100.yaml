url: https://www.ptt.cc/bbs/movie/M.1517517410.A.035.html
title: '[情報] 一一/青梅竹馬：限量藍光BD套裝 獨賣活動'
content: '情報來源：傳影互動FB





  ＊　＊　＊　＊　＊　以下為FB活動原文　＊　＊　＊　＊　＊


  萬眾期待 楊德昌限量藍光套裝版正式公開！

  限量藍光套裝版內含各一份藍光 ，一套共二份，定價 $1,300 合賣不拆售。


  保證空前絕後、唯一獨賣會


  本數位修復產品「不會」發行大幅壓縮畫質之 DVD 版本、未來也「不會」於市面上任何

  通路銷售，僅可直接向本公司購買！


  2/10(六) 下午1:11pm 至 5:11pm 於 #光點華山電影館 中庭開賣。


  本活動於開賣前一小時(12:11pm)開始發放號碼牌，開賣時憑號碼牌依序購買，每人限購

  10套。當天無論是否銷售完畢，剩餘套數皆不會在其他通路銷售。


  活動當天所售出之前 100 套商品，將隨貨隨機附贈楊德昌導演《一一》《青梅竹馬》《

  牯嶺街少年殺人事件》《恐怖份子》四部任一之 Apple iTunes 數位版序號，憑此序號可

  兌換數位高畫質版電影全片。序號贈送為隨機，且不提供更換。


  備註：


  無法於當天到場購買之消費者，我們將預先保留50套，隔天2/11(日) pm1:11於蝦皮賣場

  開賣，為期十日，銷售至2/21止，並統一於2/23出貨。2/10現場銷售若有剩餘套數會合併

  一起於蝦皮購物銷售。


  ＊　＊　＊　＊　＊　以上為FB活動原文　＊　＊　＊　＊　＊


  其實《一一》能在台灣發行BD是一件很值得高興的事

  這部分真的要感謝CC那邊的修復、中影跟傳影互動的努力(認真


  只是這BD....先不提那個微妙的包裝

  台版《牯嶺街》BD已經被我用三片裝SCANAVO空盒讓他跟CC兩片團圓了XD

  這次的台版《一一》大概也會被我用換下來的兩片裝SCANAVO空盒跟CC團圓


  我真的很無法理解這個所謂的獨賣活動....


  首先我個人認為讓消費者只能跟代理商購買其實是不錯的選擇

  對代理商來說可以直接對消費者、減少盤商跟店家這兩個環節的利潤


  而且以這次價格來看真的有反映在售價上

  一般來說兩部電影都個別特殊包裝，單片起碼要800起跳

  兩片1300其實還算是個不錯的價格啦，這點我個人覺得值得讚賞

  只是可憐了片商員工要多做一些工作了XDDD


  但是你單就在台北辦限量獨賣會，還一人限購十套就很微妙了


  而且全文從頭到尾也沒告訴你到底是限多少的量

  基本上壓片廠基本量再低應該也有500片，再不然給你壓到300嘛

  分個三次，北中南各100片，每人限購2片不是比較好嘛


  不然只辦在台北，還只扔50套放在蝦皮手速擂台上讓外縣市的搶

  說實話我真的覺得對外縣市的同好們不公平


  再來是一人限購十套這個真的是我看過所謂的"限量"活動數一數二大的量....

  當然你可以說三五好友揪一揪一起買，所以才開一個人那麼多的量

  但是說實在的，這個我就更好奇了....


  我收BD收那麼久，台灣的BD市場又爛成那個樣子....

  連身旁不熟的好友都加進來可能湊不到十位有在收片子的....


  而且如果有九個好友都讓我一個人去排隊買這個我一定跟他們絕交阿!!!!(炸

  怎麼會一個人開放到十套勒，其實感覺到最後會爽到黃牛就是了


  只能說片商想辦活動是很好啦，只是這個真的挺半吊子的....


  --








