title: '[請益] 《一一》結尾婆婆告別式的美國'
content: '喔斯，大家好，我大木啦。


  我在找到第一份工作的第一個中秋連假，

  一個人在租屋處，窩在暗暗的小房間裡，

  看了《一一》，這是我第三次重看了，每次看都有不同的感受，

  也有一些問題想請益。


  像這位大佛普拉斯的劉三成......不對，是阿弟的死黨朋友美國，


  按照劇情的鋪成，我不明白他跟阿弟一家有多親密，尤其婆婆死的時候，

  阿弟打的第一通電話是打給美國，跟他說婆婆過世的消息，

  然後在靈堂前，他哭得特別慘。


  所以想要請教大家，關於這方面的問題，是不是我漏看了什麼。


  --

  1.我們政府很有錢。

  2.我們水城鄉，地靈人傑。

  3.你海口人？腔口這麼重，幹！

  4.看到空服員從前面走過，下意識提醒自己，回到台灣，入境時記得給你買一條黃長壽。

  5.我也是冠軍，打手槍世界冠軍，綽號鐵手。

  6.我就跟這個世界一樣，這個世界是不會變的。  請試著回答以下台詞出自那些國片？


  --'
