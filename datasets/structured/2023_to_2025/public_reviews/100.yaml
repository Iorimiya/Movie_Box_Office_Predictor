url: https://www.ptt.cc/bbs/movie/M.1754820657.A.B4A.html
title: '[  普無雷] 鬼滅無限城一一些問題討論'
content: '各位安安，本偏無雷，放心觀看





  首先聲明我幾年前已看完鬼滅漫畫，

  此次看板橋IMAX 版本，

  鬼滅動畫製作自然不在話下，

  肯定是很值得進場看，

  未來可能會二刷

  但有些問題我想提出來討論一下：



  1.節奏

  首先節奏問題這個很多人提到，

  我個人當初在看漫畫就思考過，

  無限城若要做電影版一定不好做，

  因為原著就是分好幾組戰鬥+一直切回憶，

  節奏肯定不會很順，

  起承轉合不會像是完整的電影，

  但就算是這樣

  我覺得動畫相比漫畫

  還是有很多可以改善的方法

  這部分就是沒有做到很好


  2.打戲

  這個我也看到有人提起

  覺得這部打戲沒有無限列車甚至電視動畫那樣燃

  為什麼沒做到以往那樣？

  整個打戲編排製作沒有以往細緻到讓人印象深刻


  3.配樂

  最後一點也是我最在意的點

  這次配樂很明顯存在感低

  在無限列車裡面

  大哥跟akaza都有很明顯自己的bgm

  後來打在一起的配樂

  把兩首bgm交織在一起

  打戲跟配樂合作的很好

  直接燃到飛起來

  當然我知道無限城一各角色bgm 都有出來

  但編的就是沒有到之前水準


  總結：

  其實我一直在思考

  這部無限城一是不是有趕鴨子上架的可能？

  導致在配樂跟打戲編排上

  我覺得少了之前的靈魂？

  有卦嗎？


  聽說後續兩集分別在2027,2029上映

  希望可以改善以上幾點

  不然一個ip就這麼一次機會

  浪費掉有點可惜


  總之這部還是很有水準，

  如果無限列車100分，

  這部至少也有80分，

  僅僅是針對一些小瑕疵提出討論，

  不知各位怎麼看？






  --

  感謝blueshya大解說'
