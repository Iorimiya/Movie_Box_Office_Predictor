title: '[討論] 一一的小老婆和婆婆'
content: '唸高中第一次看一一

  影片畫質 收音 都不太好

  很多細節

  透過這次修復版才注意到曾經忽略的


  小時候不太懂南峻的murmur

  只覺得他很爽：

  90年代

  可以隨便拿出900萬借阿弟舅舅

  又跟大學同學合夥開電腦公司

  家住大安區電梯大樓

  四房二廳二衛帶一個平面車位


  現在長大終於體會 南峻做人有多苦悶

  他的煩惱就像對婆婆說得一樣：

  ‘’每個人都有自己內心的煩惱

  只有自己知道。‘’


  回歸主題 有三個細節想不通：

  主任的小老婆其實不只一個吧！

  畫面中 數了六個小女生

  一起嘲笑洋洋的花錢藝術照片

  其中二個小女生有喝可樂

  主任是不是偏心 讓其他人沒飲料喝？

  還是劇組道具不夠用

  剛好只有二罐？


  有一幕 洋洋丟水球誤砸主任

  逃到視聽教室

  小老婆接著進教室

  裙子瞬間拉起來 看到白色底褲

  到底是門勾到的 還是主任拉起來的

  畫面剪接太快 幾乎看不清楚

  是不是導演刻意安排留白 讓人想像？



  再來是婆婆迴光返照摺紙哄婷婷

  婷婷醒來 手上真的拿著紙蝴蝶

  這真的是婆婆摺紙

  還是婷婷幻想得到婆婆原諒

  記憶錯亂 自己摺出來？


  板上的大家：

  第一次看得時候

  跟現在進戲院看4K修復版

  有沒有注意到以前看不清的細節？





  --'
