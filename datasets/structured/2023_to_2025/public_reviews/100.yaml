url: https://www.ptt.cc/bbs/movie/M.1589902429.A.14C.html
title: 'Re: [情報]誠品電影院《一一》二十週年紀念放映'
content: '除了《一一》適逢二十周年紀念放映之外


  中影也預計在6/24於院線安排重映楊德昌導演三部作品


  分別是《牯嶺街少年殺人事件》《海灘的一天》《恐怖分子》


  到時確認的上映戲院還請各位影迷查詢嘍



  在這邊也特別感謝版主們置底我當時整理的預計重映名單


  目前各片商還是有計畫安排一些經典影片於院線放映


  有任何新增我都會隨時修改加上


  如果版友們也有消息的話也能推文 我看到也會加上





  --'
