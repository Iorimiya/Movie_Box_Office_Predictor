url: https://www.ptt.cc/bbs/movie/M.1503234854.A.E36.html
title: '[討論] 為何大家會說"一一"是文青片?'
content: '終於找時間在電影院看了這部當初在台灣沒上映的電影了


  以下有劇情雷
















  看完發現整部電影除了一些裝逼臺詞，或是不斷重複說話有點超現實之外


  基本上整部片都是非常生活又現實的議題


  用不渲染也不特別故意文藝的手法老實呈現出來


  長者昏迷照顧，前任現任糾纏，工作在商言商的無奈，青春期的大小事


  可以說是非常地平易近人，是生活的每個人都會面對到的一般事情


  鏡頭語言也不張狂，遠遠地，用半旁觀的方法紀錄著


  音樂也是最通俗大家耳熟能詳的，


  總而言之整部是很老實又誠懇的


  除了步調比較慢，我真的想不到這部跟普遍認知的文青片有什麼共同點


  還是都沒看過在喊的啊???


  --

  好奇而已啊 說不定會有個"一一就是他媽文青片"的標準正確解答 我看不出來所以才發文

  討論 你也是不用這樣想 人生比較輕鬆'
