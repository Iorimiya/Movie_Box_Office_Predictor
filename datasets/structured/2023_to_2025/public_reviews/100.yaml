url: https://www.ptt.cc/bbs/movie/M.1758120653.A.C17.html
title: '[好雷] 楊德昌《一一》：就整個很懷舊'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《一一》好雷：整個就很懷舊\n\n\
  ■ 推薦語\n\n把上世紀末的台北，從社會發展、民情、時代氛圍完整捕捉，臨場感十足。人生的幼、少\n、長、老，各個階段藉由簡家完整呈現。有優美之處，也有八點檔橋段，是一部受眾好球\n\
  帶寬廣的佳作。\n\n■ NJ、敏敏、舅舅\n\n三個角色分別呈現面對人生的三種態度。\n\nNJ的人設是個老實讀書人，我覺得這樣講也太客氣了，不如說是個懦弱之人。公司快倒閉\n\
  ，他沒有任何把握，也無法像其他夥伴一樣保持盲目樂觀。於是他戴起耳機，不斷追憶過\n往來逃避。\n\n未來太不確定，而玫瑰色的初戀仍未褪色。\n.\n面對未來，舅舅完全沒有想法，他是個滿口玄學命理的投機份子。因為機運而破產，也因\n\
  借勢而靠中國房市致富。從來都是被動接收，對小燕跟雲雲都來者不拒，舊愛新歡互打，\n男人又美美隱身。\n\n可悲的是，在勢頭上的時候，這樣的空心男比NJ這種老實人更能抓住機會。一切個性的\n\
  好壞，都視當下局勢而定。\n.\n敏敏的命題，則與兩者完全相反。她的每一天都長得一模一樣，就這樣可預測的持家到死\n。前方完全不值得期待。\n\n後來她上山求佛，希望可以悟出這樣的人生還能有什麼意義。或是，她還能找到什麼其他\n\
  意義。\n／\n活在過去、隨波逐流、尋求信仰。\n\n人可以一輩子瞎忙不對自己誠實，但當看到將死的婆婆，連膨風成性的舅舅都囂張不起來\n，頻頻嘴軟。\n\n畢竟，人都要死了。這些幾乎等同自我對話的陪伴，給了自省的機會。（也創造他們講出\n\
  這些不太生活化句子的合理性）\n\n■ NJ和阿瑞的回春日本行\n\n「時間讓原因失去了意義。」NJ 知道自己對不起阿瑞，也知道這樣的追悔已毫無意義。\n但阿瑞的邀請一來，他還是馬上赴約，畢竟他始終愛著她。\n\
  \nNJ和阿瑞、婷婷和「胖子」，一對走在台北街頭、一對漫步日本，成為完美對照。都是\nfirst love、最美的初戀，這畫面實在太唯美了。\n\n他們回憶當時的不告而別，剖開哪些早已不重要的苦衷，也細數過往多麼相愛。\n\
  \n他們當時卡在NJ想要做自己，而阿瑞想飛。最愛的人，但是不適合彼此。一切終於明瞭。\n\n當NJ婉拒阿瑞的復合請求，在房門前告別。到這都還算令人心碎而成熟。\n\
  \n後來，阿瑞已經艱難嘗試放棄，NJ突然一個回馬槍說：「我沒有愛過其他人。」我的眉頭\n就此深鎖。\n\n難得有一幕讓強調誠實的我，要請大家保守一點了。你都狠心的把對方推開了，前面一直\n\
  甜蜜的回憶少年少女時代，意思都到了、該懂的都懂了。\n\n結果，你又跑出來放個餌，讓阿瑞的心再度放不下，只為了完成自己沒有走向阿瑞的遺\n憾。\n\n不會在一起還給人家希望，NJ用他愚蠢耿直的決定，證明了有些遺憾不需要追悔，不告而\n\
  別已經非常好了，因為他只能做到這種程度。\n\n懦弱的放棄找回舊愛的機會，與後來合作機會被搶先，形成映照。同樣的機會擺在眼前，\nNJ沒有任何的勇氣拿起，只能不斷嘆氣後悔。\n\
  \nNJ演活了一個懦弱怕事的草食男。這些緬懷只會停留在時光隧道，而不會通往未來。\n\n■ 洋洋、婷婷\n\n對我來說，洋洋跟婷婷，主要在藉由角色回顧青春和兒時的處境。\n\
  \n洋洋常被女生和掌權者（老師）欺負，但他卻看得最透。後來父親給了他相機、一道閃電\n開啟了他的天線，他的觀察力開始有了地方著力。\n\n他追尋每個路過的人，拍攝他們的背影。他觀察喜歡的女生，出自本能學習對方游泳、模\n\
  仿她游泳的姿態。\n.\n「只有你醒來我才睡得著。」婷婷忘記丟垃圾，間接導致婆婆跌倒而自責不已。\n\n她無從排解這些困惑，而鄰居告訴她：「書讀的好就好，其他都不要緊。」婷婷的痛苦無\n\
  處可去，而她看到了「胖子」跟莉莉有多快樂。少女的痛苦驅使她追求愛情，因為愛情的\n深刻讓人忘卻煩惱，每天也多了盼望。\n\n後來，「胖子」殺了英文老師，刺破了粉紅泡泡。愛情並不是人生的萬靈丹，莉莉很可能\n\
  在媽媽和男人的依附關係中淪為犧牲品。苦痛並不是「你愛我，我愛你」能拯救的。\n.\n《一一》很常描繪一種「最初的悸動」，像是啼哭的嬰兒，或是洋洋驚雷般的情感啟蒙、\n\
  婷婷青春的愛情夢，甚至已經中年的NJ，也留戀高中時的純愛。\n\n也許這種旺盛的好奇心和欣喜，是人還活著的證明。也是《一一》不斷傳遞給觀眾的訊\n息。\n\n\
  ■ 結語\n\n《一一》陪觀眾由喜至喪，細數每個人生階段會有的困境和幻滅。\n\n洋洋口中說的：「人生哪有那麼難。」其實是更難面對的現實。因為當你看破了一切，代\n\
  表你必須對自己的生活負責，也誠心接受成敗的隨機性。\n\n看破了沒了盼望、看少了惶恐不安。人生最好就是卡在洋洋這樣，有一些別人不知道的事\n情想講，但又沒看破到緘默不語的地步。\n\
  .\n電影裡的角色，很常忙來忙去，突然就忘記自己本來要做什麼了。因為人生從來都不簡單\n，難在如何記得初衷、身體力行。\n\n楊導選擇繼續訴說自己的發現，每天復刻初生的喜悅，讓生命永流不止。\n\
  \n\n–\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n--\n真誠的抱怨，在裡面已經相對認份實在了\n\
  只是去找初戀的應對很敗好感@@\n一一不難懂，應該說台詞很多都有寫出來\n至於對比跟對照要仔細看畫面跟調度\n對我來說，赴約跟好好談論往事就夠了～\n有些事情就是點到為止才美"
