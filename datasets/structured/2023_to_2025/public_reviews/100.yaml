url: https://www.ptt.cc/bbs/movie/M.1518242812.A.A96.html
title: '[新聞] 《一一》＋《青梅竹馬》開賣藍光版'
content: '新聞網址：


  〔記者許世穎／台北報導〕曾引領台灣電影新浪潮在國際影展拿下多座大獎的導演楊德昌

  ，經典作品《一一》去年終於首登台灣大銀幕，讓影迷直呼「盼了整整17年」。電影下檔

  後終於將推出影音商品，並於今天正式下午正式首賣。


  楊德昌讓世界看見台灣電影的偉大，他的經典作品重回台灣大銀幕，也再度引起新一代影

  迷追捧，掀起新一波「楊德昌電影熱潮」。而《一一》除了首次在台上映，也終於推出高

  畫質藍光供影迷收藏。萬眾期待的「楊德昌限量藍光套裝版」包含《青梅竹馬》、《一一

  》兩部作品，且將不發行DVD版本，今天下午1點11分至下午5點11分於台北光點華山電影

  館中庭開賣。


  ~~~


  前幾天傳影也在FB上放上了包裝的影片


  看起來是真的做得挺精美的，晚點買回來再跟CC版一一開箱一下好了


  --








  --'
