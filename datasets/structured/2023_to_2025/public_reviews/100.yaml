title: '[討論] iTunes特價 K星異客/戲夢巴黎/猛毒2/一一'
content: '【2023/05/05 iTunes 特價報】

  猛毒2：血蜘蛛／極樂世界／人肉搜索／ K星異客／戲夢巴黎／沉默的雙眼／密弒遊戲／

  MIB星際戰警

  －

  今天的片單不長，但是有很多低價的特價片！首先湯姆哈迪主演的反英雄續作《猛毒2：

  血蜘蛛》，以及麥特戴蒙與茱蒂佛斯特連袂演出的科幻大片《極樂世界》都直接特價到

  $90。另外喜歡驚悚片的朋友也可以把握這次《密弒遊戲》的兩集特價，都是4K相當划算

  。

  －

  其他特價片方面我個人大推凱文史貝西主演的《K星異客》，這部以精神病院為舞台的片

  完全就是凱文的演技個人秀，主角的雙重身分疑雲（外星人＋精神病患）在說服力十足的

  演技中更加撲朔迷離，結局也相當值得玩味，大推。還有妮可基嫚和茱莉亞羅勃茲兩大影

  后合作的《沉默的雙眼》也在這次特價之列，一樣推薦給大家。

  －

  最後是剛剛發現《MIB星際戰警 - 三部曲》現在也有$390的優惠，如果今年年初沒有跟到

  單部特價的話，這一次也是非常好的入手時機。

  －

  以上，祝大家看片愉快！

