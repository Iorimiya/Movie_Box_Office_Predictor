url: https://www.ptt.cc/bbs/movie/M.1517023718.A.9F8.html
title: '[新聞] 楊德昌大作公視免費看 《一一》首度電視'
content: '（張哲鳴／台北報導）


  楊德昌導演離世逾10年，他的告別作《一一》曾獲坎城影展最佳導演獎，也被BBC選作「

  21世紀最偉大的100部電影」第8名。該片於2000年完成後，一直到去年才在台灣電影院正

  式上映。公視也破天荒進行該片的電視首播。


  為回顧這位一代影人，

  ，選播3部不同時期作品《牯嶺街少年殺人事件》、《一一》與《青梅竹馬》的數

  位修復版本。


  《牯嶺街少年殺人事件》獲第28屆金馬獎最佳劇情片時，楊德昌曾說：「這戲有百分之七

  十的工作人員，至少7、80位在去年夏天還不知道攝影機長什麼樣子。他們非常辛苦地跟

  我工作，只憑了2樣，一個是對電影的熱愛，一個是對自己的自信。」


  1985年的《青梅竹馬》描寫80年代與台北一同起飛的都會男女故事，是楊德昌的第2部劇

  情長片。當年侯孝賢抵押房子出資拍攝，更擔綱電影男主角，戲裡戲外都見證當時影人間

  的情誼；侯孝賢更以此片提名第22屆金馬獎男主角，證明也有演戲實力。


  【2018/01/26 19:05 蘋果即時】


  新聞網址：



