url: https://www.ptt.cc/bbs/movie/M.1519120723.A.1EC.html
title: '[開箱] 台美版 一一 精裝版 CC版 藍光BD'
content: '網誌圖文版：



  這片應該算是我第一片接觸到的楊德昌導演作品吧XDDD

  以前年紀尚輕，說真的不管是一一或是牯嶺街少年殺人事件都覺得挺悶的


  後來再看的時候記得是看香港版的DVD吧，真的是驚為天人！

  那時候是真的是第一次覺得這麼棒的神作．台灣竟然沒有發行，甚是可惜


  當然近期也沒甚麼起色就是了

  很多台灣電影只發DVD不發BD對我來說其實跟沒發片一樣


  後來才從一些人口中知道楊德昌導演當時對台灣發行體系的不滿

  這也讓楊德昌導演的作品變成了很多影迷的收藏遺珠


  不過還好幾年前國外The Criterion Collection發了修復過的BD

  雖說售價十分昂貴、也無中文字幕，卻是完美收藏這部電影的唯一選擇

  之前我也曾在Video版開過一次箱


  而一直到了去年，才由傳影互動初次發行並在台灣上映

  也在幾天前正式發行了藍光BD，雖說販售方式令很多人不甚滿意

  不過就目前的市場來看，其實也不失為一種嘗試，只希望未來能再多多改善


  底下先來開箱：


  台傳影互動精裝版


  包裝與碟片


  雖然不想開青梅竹馬，還是合照一下XDD








  美The Criterion Collection版


  包裝與碟片




  小冊子與節錄







  這是幾年前在工作之餘弄到的簽名XDD

  剪接師：陳博文師傅

  飾演NJ：吳念真導演

  飾演阿弟：陳希聖製片


  畫質部份我還沒有時間再重看一遍

  不過基本上CC跟傳影應該都是用同一份修復母帶製作

  我想畫質應該跟美CC版不會相差太多才是


  至於CC版畫質跟港DVD版比較請參照下面網址



  包裝呢....我只能說這是個精美的包裝....

  可是老實說，我不是很喜歡這種包裝....


  就整體包裝大小來說實在是難以收藏

  要拿出來觀看也不方便，那個卡榫設計又很奇怪


  真的不是我在說，楊導的作品發了藍光我是很高興啦

  可是每部包裝都不一樣，而且還一個比一個奇葩....

  真的很難收藏耶....


  最後決定跟台版牯嶺街少年殺人事件一樣的處理方式....



  之前買了個Scanavo三片裝空盒將牯嶺街少年殺人事件台版跟CC版裝起來

  弄完後就剩了一個替換下來的Scanavo雙片裝空盒，還好有留下來

  這次剛好可以拿來裝一一XDDD


  原本的包裝我看之後弄個框裱起來好了，就當裝飾用XDD


  P.S.不過對我來說更麻煩的是一一綁青梅竹馬一起賣....

  青梅竹馬真的硬到我不是很想重看阿Orz



  --








  --'
