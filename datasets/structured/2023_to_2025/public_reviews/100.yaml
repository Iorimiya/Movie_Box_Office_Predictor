url: https://www.ptt.cc/bbs/movie/M.1688487051.A.28D.html
title: '[請益] 一一日本取景地點'
content: '嗨大家好

  從剛進大學的時候有一次在華山看一一以來已經看了差不多四五次

  其中有一個場景一直打到我（我自己也不太知道什麼原因哈）

  但遍尋不著

  想說趁這次打算去東京玩個一陣子

  要是能順便去探尋一下就太好了，所以想說來問問看碰碰運氣


  這個場景就是NJ在東京浮氣的時候

  晚上跟阿瑞走過一個高架電車站下面

  然後說很像以前過公館到新店的平交道的地方

  畫面左下角有一間疑似叫つばさ（也有可能是つばき）的文字燒店

  但我無論如何都找不到這間店，不管在食べログ還是在谷歌地圖上都沒找到


  之前有看過版友問過一些取景地的文章

  裡面也沒有提到這個地方


  雖然其實這個樣子的高架鐵路出了二十三區之後應該很容易就可以找到一樣的

  但內心還是有一個小小的執著

  所以來這邊求助各位大大

  感謝大家QQ


  --'
