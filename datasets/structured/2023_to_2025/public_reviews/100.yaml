title: '[情報] iTunes多部$80起 一一.鎌倉物語.藍波5'
content: "完整片單如下 :\n\n\n$80 生存家族 : \n\n小日向文世、深津繪里主演。住在東京的鈴木一家人在全日本斷電災難之中，開始了有如\n原始人一般的生活。\n\
  \n-\n\n$80 花漾奶奶秀英文 : \n\n雖然表面上只是講銀髮族學習英文的故事，但韓國真的很會拍這種幽默溫情，情緒張力強\n大的電影，頗推薦\n\n-\n\
  \n$90 鋼鐵墳墓 : \n\n史特龍+阿諾的逃獄爽片，第一集真的蠻好看的。\n\n-\n\n$90 藍波5最後一滴血 : \n\n有點像是藍波版的小鬼當家，但該有的爽度還是有\n\
  \n-\n\n$90 鐮倉物語 : \n\n日本奇幻電影，講述裏鎌倉的怪奇世界，全明星陣容 堺雅人、高畑充希、安藤櫻、堤真\n一 主演。\n\n-\n\n$90\
  \ 一一 (經典修復) : \n\n21世紀BBC影史百大第8名，楊德昌導演經典作品修復版。\n\n-\n\n$90 騎機男孩 : \n\n口碑挺好的泰國勵志喜劇。\n\
  \n-\n\n$90 養老金都沒了啦 : \n\n天海祐希的日式喜劇，講述辛苦存的養老金被一波又一波意外事件給奪走。\n\n-\n\n$90 哪吒之魔童降世 :\
  \ \n\n中國奇幻動畫片，歷年影史票房第4，視覺效果跟敘事都很流暢可觀，角色塑造也細膩，\n真心頗好看\n\n-\n\n$90 淘寶少年 : \n\n爛番茄95%，天堂的孩子導演社會寫實新作。\n\
  \n-\n\n$90 高山上的熱氣球 : \n\n金馬獎最佳原著劇本入圍台灣電影。\n\n\n\n\n--"
