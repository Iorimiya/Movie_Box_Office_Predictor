title: '[討論] iTunes特價 金甲部隊/一一/臥底/真情假愛'
content: '【2022/09/30 iTunes 特價報】

  金甲部隊／臥底／真情假愛／歌喉讚系列／一一／記得愛過你／無味神探

  －

  今天的大消息是史丹利庫柏力克的大作《金甲部隊》終於特價了！而且是這次官方主推的

  $190，這也表示這個優惠只會維持一周。這部作品描述美國海軍陸戰隊參與越戰的經過，

  從入伍開始演，對軍人的心態有著極寫實的描繪，各種撼動人心的劇情轉折也讓人難以忘

  懷，是一部必看的戰爭片，而且還給到4K，大推！

  －

  $90的部分則是難得的巨星雲集！丹佐華盛頓、克里夫歐文和茱蒂佛斯特主演的《臥底》

  ，從一椿搶案和看似單純的警匪對峙開始，延伸出各種出人意表的懸疑情節，是很厲害的

  犯罪片。另一部《真情假愛》則是由喬治克隆尼和凱薩琳麗塔瓊斯連袂演出，幽默的對白

  和男女主角的精彩演出是這部片的看點，這也是柯恩兄弟的第一部愛情喜劇，值得收藏。

  另外《歌喉讚》三部曲也在同時特價中，喜歡歌唱片的朋友可以把握機會入手。

  －

  最後是這次誠意滿滿的爆米花日片單，楊德昌的經典作品《一一》直接特價到$90，這部

  片從一個台北家庭為中心，以流暢的多線敘事和豐富的議題獲得各界極度好評，是這次一

  定要收的一部。另外也有《記得愛過你》和《優雅的謊言》等評價不錯韓國劇情片，一樣

  都只限時三天，想收的話要把握一下時間了。

  －

  以上，祝大家看片愉快！

  －

