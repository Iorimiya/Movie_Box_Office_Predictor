url: https://www.ptt.cc/bbs/movie/M.1502028402.A.C22.html
title: '[好雷] 一一(無雷)'
content: '零星的雜感

  --


  「電影誕生了以後，人類的壽命延長了三倍，因為我們的經驗擴充了，沒有殺過人也都知

  道殺人是怎麼一回事」


  「我們只要對人好，別人也會對我們好，幹嘛知道殺人這些事情呢」


  很抱歉，每個人只能看到一半的事情，算了半天命是富是貴依舊不由己，待人以誠也只能

  為了合夥情誼和生意出賣原則，日復一日枯萎的靈魂上了山也是重複一樣的台詞，波赫士

  的岔路重回分歧點也沒有什麼意義了


  「婆婆我以後要看到大家看不到的東西，教會大家」


  到時候只會學會唯一一件事，你幼年時就已經知道的，就是你會老





  --


  因為陪老婆看第二次一一

  深深被故事迷上

  結構完整，就像沒有贅肉般穠纖合度

  敘事冷靜但情感濃厚，適度的說理讓深度擴充提點觀眾

  電影中人生的百態，充滿深深的無力感

  17年後首次在台上映，很奇妙的像是種時空膠囊

  回看2000年時的台北大安區

  大推大推！


  --



  --'
