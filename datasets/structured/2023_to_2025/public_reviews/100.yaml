url: https://www.ptt.cc/bbs/movie/M.1722435771.A.E5B.html
title: '[片單] 隊友一一擋住敵人讓主角打王前進的片？'
content: '《蠟筆小新：大人帝國的反擊》，最後反派要搭電梯上鐵塔釋放懷舊毒氣時，


  廣志先擋住電梯的門，讓抱著小葵的美犽跟小新跑上樓；接著，追擊的手下趕上時


  抱著小葵的美犽往後摔擋住手下。最後，小白也擋住手下，讓小新一個人衝刺。



  想想《神龍之謎》、《鋼之煉金術師》都有這樣的情節，所有重要不重要的角色都將


  期望放在主角身上。讓主角在盡量無損的狀態下對上王（好像《死神》也有我有點忘了）


  總之是老梗但熱血的設置，用得好會很感動～





  好像這種比較常出現在少年漫畫／奇幻電影，但也不一定（？）


  魔戒好像是

  永恆族（但不太急迫少了點熱血）

  Jojo冒險野郎第五部黃金之風 (應該有吧)





  都還好～先謝謝大家^^


  --'
