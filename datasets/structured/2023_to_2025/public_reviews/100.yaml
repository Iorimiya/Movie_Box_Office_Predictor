title: '[Live] 21:00 一一@公共電視台'
content: '【公共電視台】

  2018/2/3(六) 21:00 一一

  IMDb 8.1 / 爛番茄 96%


  電影預告



  導演： 楊德昌

  編劇： 楊德昌

  演員： 吳念真、金燕玲、張洋洋、李凱莉


  本片獲2000坎城影展最佳導演獎，楊德昌一生的代表作，影片從未在台灣院線發行，為楊

  德昌最後作品。維持其一貫敏銳的社會觀察，透過典型三代同堂的家庭故事，呈現台北都

  會生活的縮影。


  八歲的洋洋成長於台北的一個中產家庭，身為電腦公司總經理的父親NJ（吳念真 飾）面臨

  生意及婚姻的交叉口，母親 敏敏（金燕玲 飾）面對一成不變、成日照顧家中病倒的母親

  的生活，決心尋求改變，就讀北一女的姊姊 婷婷則是處於悸動的青春年華。洋洋喜歡拿著

  相機拍人的後腦勺，以他的視角來看大人們的世界，拍攝家人看不到的「背面」，城市中

  的人們看似接近，但都各自有著無可逃避、必須面對的苦惱，面對人生的提問，答案或許

  沒有這麼複雜，卻總是不完美。


  --'
