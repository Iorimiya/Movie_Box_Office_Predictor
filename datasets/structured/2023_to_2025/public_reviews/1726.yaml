title: '[ 大負雷]'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  大致說一下劇情

  有個信仰聖恩主公的豪族

  （聖恩主公，是恩主公上了聖屬性嗎？）

  需要有男丁傳承家業

  （這一段超複雜，反正好像聖恩主公超父權，一定要男生才能繼承）

  媽媽已經生了兩個女的

  於是為了生男打算使用咒語

  在這咒語下如果同時有兩個人懷孕

  就能提高生男的機率（啊不然咧？）

  於是爸爸就從外面搞大了別人的肚子帶回來

  （這段真的超亂，我也沒有看很懂）

  總之豪族家那天生了兩個男孩

  媽媽的孩子較晚出生

  法師說這孩子的命運會非常坎坷

  而另一個男孩則會命很好

  （看到這邊大概就知道會有小孩互換的情節了）

  於是媽媽把二奶趕走

  自己當了四個孩子的媽

  爸爸搞不清楚是在哪個時間點死掉了

  估計是因為兩個老婆都很偏離大眾審美

  於是在浴缸裡自殺

  前面生的兩個女孩

  二姐忘記為了什麼反正成了神經病

  而自以為是三哥的四弟

  不小心把自以為是四弟的三哥推到山上的大坑

  讓自以為是四弟的三哥下肢癱瘓

  自以為是三哥的四弟非常自責

  媽媽決定將其送到美國讀書

  二奶離去十八年後再次回來想看自己兒子

  一頓爭吵後被媽媽推入河中溺斃

  媽媽擔心二奶回來索命

  將其骨灰禁錮每天施咒

  家中則經常鬧鬼

  所有傭人被嚇跑到只剩一男一女

  （我不知道骨灰被禁錮那是在鬧什麼鬼？）

  而女傭人正是隱藏身份的二奶的妹妹


  自以為是三哥的四弟七年後回國

  此時無人得知自以為四弟的三哥的腳已然康復

  二奶的妹妹女傭告訴自以為是四弟的三哥

  二奶才是他的親生母親

  為報母仇自以為四弟的三哥以五行元素

  作為這一季的主題進行一個殺人的動作

  裝神弄鬼的殺了二姐、姑姑（很沒意義的角色）、自己......自己坐輪椅衝進水裡被自以

  為

  三哥的四弟救了、大姐夫

  正要解決大姐的時候  陰謀被拆穿

  自以為四弟的三哥叫自以為三哥的四弟拿二奶的骨灰來換媽媽

  一陣混亂之後

  總之最後媽媽幹掉了自以為四弟的三哥

  並承擔起所有殺人罪名入獄


  二奶妹妹女傭來探監時，告訴媽媽自己的身份，並且告訴媽媽，自己當初偷換了兩個男嬰

  ，其實自以為四弟的三哥是三哥，而自以為三哥的四弟才是四弟，總之媽媽幹掉的是自己

  的親生兒子，女傭出去後，換手真四弟進來，而媽媽還是逃避真相，稱呼四弟才是自己真

  正的兒子。

  真四弟離開探監室，與女傭並肩而行，解釋自己早已知道一切，即便獨處的時候也會演得

  跟真的一樣，是因為要騙過別人前要先騙過自己......全劇完



  這是我這幾年看到最生氣的電影

  懸疑片裝恐怖片我ok

  兩個不符合大眾審美的大媽爭風吃醋我忍了

  沒有道理的裝神弄鬼我放棄

  不過看到主角最後說自己的不合理反應

  是因為騙人前要騙自己

  讓我徹底潰堤

  導演和編劇根本把觀眾當白癡

  還自己覺得很聰明

  我在劇一半左右就把劇情猜得差不多了

  只因主角真四弟獨處的時候還在推理案情

  所以沒有猜到他早已知情

  （然後被個爛理由噁心到......）


  演員人均民視八點馬景濤

  怒目圓睜、撕心裂肺

  編劇心想事成

  任性程度堪比要有光便有了光的上帝

  導演......不予置評


  總之不認真看看不懂

  認真看又看不下去

  裝神弄鬼又完全沒有合理解釋

  當成恐怖片會想怒

  當作懸疑片會想笑

  與其看涅槃咒

  我情願二刷沙贊二

  我情願看漫威四階段馬拉松

  我情願三屏同時看猛毒1、2+魔比斯


  提議看這部電影的我

  在電影結束的第一時間向同行的女子道歉

  並且主動請了一頓燒肉以表歉意

  你可能覺得請個燒肉又如何？

  這麼說好了


  「我是客家人」






  總之 不要去看不要去看不要去看



  --'
