title: '[好雷] 夢行者保羅'
content: '結論 - 推薦給喜歡黑色電影的朋朋

  今天（12/8）全台正式上映。


  以下有雷：




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  喜歡編劇選擇用「夢」這樣顛倒、輕薄、沒有邏輯、睜開眼就煙消雲散成為夢幻泡影的東

  西，來談所謂的趨勢（trend），或者說大眾流行文化的喜怒無常甚至集體暴力。



  用「全世界夢到你」代表現代社會一個素人毫無理由的爆紅，蠻哲學的，是新鮮有趣的比

  喻。



  看尼可拉斯凱吉主演的中年魯蛇教授保羅如何樓起，又如何樓塌變成過街老鼠人人喊打，

  整個過程真的比什麼夢都恐怖，超現實，而且悲劇。尤其是他迫於輿論壓力，不得不錄影

  公開道歉的那段劇情，實在很難不立刻聯想到之前莫名到家的「奇軒道歉」事件。



  而最後當他終於被大眾遺忘，重新得到平靜，人生也早已經變形回不去，只能夜夜逃到夢

  裡，在幾片名為昨日的碎屑裡，溫習不復存在的甜蜜。


  --'
