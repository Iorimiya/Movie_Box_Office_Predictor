title: '[普無雷] 夢行者保羅'
content: '現在出的凱吉電影都先抱著爛片心態去看

  標準放低後就會覺得…喔～沒想像中的差啊

  .

  夢行者這部片是荒謬的

  事件莫名其妙開始

  也莫名其妙結束

  很多時候我都覺得電影該結束了吧…然後又繼續演

  看到後面到底是現實還是夢境又很難界定

  這部片就像窮人版全面啟動

  編劇懶得想那麼多規則

  特效幾乎沒有

  夢境也是荒謬居多

  總之都給凱吉演就對了

  裡面有些片段還不錯笑

  像是助理那段凱吉的演出…

  .

  至於這部推不推…其實很五味雜陳

  因為我沒看到睡著那還不算爛

  但對話很多所以不喜歡看劇情片的可以跳過

  結局雖然溫馨

  但整部剪接不知道是爛還是故意要混淆觀眾

  到底整部都在做夢又或是真有其事

  那就是 “一個凱吉 各自解讀”吧


