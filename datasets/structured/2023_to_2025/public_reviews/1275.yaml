  \n「慧黠扭曲、滑稽到令人痛心，並有 爆炸性的視覺饗宴，還夾雜著 溫暖、諷刺 和 令人\n驚嚇的恐懼 的作品，能看到這部令人著迷、按揉大腦皮質層的電影在大銀幕上大放異彩\n\
