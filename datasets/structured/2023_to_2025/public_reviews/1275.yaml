url: https://www.ptt.cc/bbs/movie/M.1709825950.A.172.html
title: '[好雷] 夢行者保羅'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  開頭先寫些東西防個雷。



  前幾天在 MOD 上看了這部片，

  把板上的討論爬了一輪後，還是決定拾人牙慧的多寫一篇心得XD


  談電影的觀看者如何凝視夢。



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  在電影中段，保羅咒罵了（剽竊了自己想法的）即將出新書的舊識後，

  隨即接著的是他透過權勢欺壓學生的夢，甚至是充斥著暴力的橋段；

  看到他命令、斥責女學生的段落時，我還跟一同觀影的家人討論「保羅是不是瘋了」，

  直到後面出現見血的畫面，才確定這只是夢，

  當電影的觀者亦有可能被混淆於夢與現實的切換之下，

  要去同理這些因著做惡夢而疏遠保羅的人們似乎也不是什麼不可能的事。


  而最後，當保羅絕望地想要去看女兒的演出，卻不幸傷人之際，

  我原先看著受傷的老師懷疑這又是一場夢，

  等到後面出現廣告的臺詞提到保羅傷人，才驚覺這是現實，

  保羅終究坐實了自己為他人夢裏那個殘暴之人的形象。


  從他人的虛實不分，過渡到了虛實難分。



  對這樣一個有人性脆弱面、會受名和色所誘惑的中年教授保羅而言，

  他沉浸於最初的成名，陶醉於那種「每個人都有機會成名」的快感，

  卻難以接受後續被排斥的事實，認為自己是無辜的，

  無法同理惡夢痛苦的他仍然希望自己被當正常人對待，

  直到最後連他也做了惡夢，才聲淚俱下的道歉，但他依然認為自己是無辜的。


  他確實也是無辜的。


  但他成為了這場風暴中的唯一一個犧牲品。


  這場風暴結束得突然，做惡夢、道歉、傷人，之後對他人而言船過水無痕，

  差異是商人嗅到了商機，而保羅失去了自己曾經珍視的事物。


  他學會了妥協。


  接受自己只能在地下室辦理簽書會，

  被書商改書名也只能接受這才是他真正會吸引來的客群，

  被視為夢魘卻再也無力反駁，

  只能晚上希望自己進入妻子的夢——透過那個極度貶抑他自己的產品，

  他不是黑白相間的斑馬，他只能努力地在身上塗抹上黑白的顏色讓自己融入群體，

  而夢中一切一如往常，只是醒來已然都改變了。



  看完這部電影會有很深的無奈。


  前段的展開滿有趣的，中段顯得有些悶，

  但正是這樣的鋪陳，才能讓觀者見證到保羅赤裸又殘忍的墜落和沉淪，

  終究停在結局的無能為力。


  看完當下或許會覺得有點空虛，

  但沉澱一下便會對這個嗜血的、速食的社會和媒體有所反思，

  就在這一百分鐘裏，觀眾一路跟隨著保羅，看著他得到再失去，

  或者像是反著演的約伯記：他一開始得到多少，最後就會加倍損失。


  尼可拉斯凱吉的演技也撐起了最後的滄桑，

  算是前面展開有趣、收尾留下尾韻的佳作。


  --

  Чи

  миний

  инээмсэглэл

  минь

  болсон


  --'
