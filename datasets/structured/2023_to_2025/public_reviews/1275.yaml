url: https://www.ptt.cc/bbs/movie/M.1701707701.A.3BF.html
title: '[普雷] 夢行者保羅'
content: '預告防雷





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  今天(12/04)信義威秀有個新片神秘場


  就是播這部尼可拉斯凱吉主演的夢行者保羅


  打著媽的多重宇宙的名號 又是A24出品的 算是有合我的胃口




  保羅原本只是個平凡的教授


  某天他突然開始出現在各個陌生人的夢裡


  原本大家夢的內容都只是很詭異而已


  例如有個女學生夢到自己坐在某個房間的桌上 地板上有兩隻鱷魚在爬

  保羅只是在門外站著什麼都不做


  又例如有個男學生夢到自己西裝筆挺的在走在荒野裡吃著香菇

  突然有個身材高大的怪物向他走來 他躲到某棵樹下

  這時保羅從另一邊走來 卻只是看著旁邊樹上的香菇什麼也不做


  現實的保羅在這時成了爆紅炸子雞 本來想藉這機會出版他的書

  還有間新創公司想利用他做些天馬行空的廣告



  新創公司裡有個女員工也對保羅說有夢到他


  只是跟之前保羅聽到的不太一樣了 她竟然夢到保羅在跟她做愛 而且還很爽


  保羅聽到後接受她的提議陪她去她家裡 想重現夢的情境


  想不到保羅在被脫褲子的時候就射了XD 羞愧地奪門而出



  而從這天起開始慢慢變了樣


  大家的夢從很詭異變成很殘暴


  例如當初那位吃香菇的男學生夢到他走在路上 保羅突然從旁邊衝出來

  用榔頭狠狠地敲他的頭


  還有個女學生夢到保羅在他房間門外說有重要的事情進去房間講

  結果她讓保羅進入後 保羅卻企圖掐死她


  連保羅自己也夢到原本他在運動 卻被一個和他極為相似的人用十字弩射了好幾箭



  保羅這時成了全民公敵


  大家開始怕他 光是看到他就覺得不舒服


  外出吃飯時餐廳想請他離開、學校不想讓他女兒的成果發表會、他的車被噴上LOSER字樣



  最後衝突點是保羅不顧一切衝去學校想看他女兒


  結果不小心使一位想擋住他教職員的手受傷了



  神奇的是那件事之後 保羅不再出現在大家夢裡了


  有間公司藉著這件事做了一個手環 能使戴上手環的人進到別人的夢裡


  風波平息 保羅暫時與妻子女兒分開


  因為他出版了一本書要去歐洲辦簽書會 原本書名想取"夢的情境(Dream Scenario)"


  卻被出版商改成"我是你的惡夢" XD 還拍了一系列戴金屬手套的宣傳照



  結局是他自己也買了那個手環 想進到妻子的夢裡


  夢中的他救了陷在火圈中的妻子 並攜手走回家


  然後說了句"好希望這夢是真的" 保羅放開她的手 緩緩升空


  電影結束



  給普雷是覺得滿可惜的是劇情點子開頭不錯 但結尾沒什麼特別的爆點


  整體是好笑的 凱吉依舊是凱吉


  --

  畢竟我標題都選普雷了= ='
