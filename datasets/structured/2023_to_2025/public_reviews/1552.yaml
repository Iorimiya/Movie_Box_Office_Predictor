url: https://www.ptt.cc/bbs/movie/M.1688465027.A.D5E.html
title: '[好雷] 回不去的那座山'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  改編自義大利作家帕羅‧康提的同名獲獎山岳文學小說《八座山》，《回不去的那座山》

  不但奪得2022坎城影展評審團獎，也入選2022釜山影展與2023日舞影展。將大自然景致與

  童年友情結合的深情故事，也選入第25屆台北電影節的「電影萬物論」單元。



  那年夏日，12歲的城市男孩皮耶托邂逅了荒敗山城中的最後一個孩子布魯諾，從此展開他

  們綿延40多年的偉大情誼。年少無憂，曾經冒險嬉鬧，也曾遙望分離；人生路茫茫，直到

  一絲牽掛，再將他們繫回阿爾卑斯的山腳下。只是輾轉來到不惑之年的他們，又是否已看

  清自己的樣子？



  童年建立的友情是最寶貴也最純粹的，來自大城市的皮耶托與成長於格拉納山城的布魯諾

  一見如故，但兩人之間的關係彷彿琦君的散文〈一對金手鐲〉裡的小春與阿月。布魯諾空

  有天分但父母不願讓他受教育，讓皮耶托的父母決定供他食宿，送他去上學。沒想到，布

  魯諾的爸爸反對這項提議，對他來說，孩子盡快跟著自己出去攢錢才是最實在的。就像小

  春在學校讀書的時候，阿月正忙著幫忙挑水、砍柴、種田與餵豬一般，布魯諾與皮耶托的

  世界也漸行漸遠。



  不過，正如伍思凱在歌曲「分享」中所唱：「時間已做了選擇/什麼人叫做朋友/偶而碰頭

  /心情卻能一點就通」。真正的朋友，即便分隔多時，再碰頭之時，心情必定能一點就通

  。片尾皮耶托說，他認為世界上再沒有比他更了解布魯諾的人，反過來也是一樣，他們就

  像是彼此的手足一樣陪伴著彼此。即使兩人都是不善言辭的男人，靠著皮耶托媽媽從中充

  當傳聲筒，不論什麼樣的冷戰與爭吵最終都能平息。



  故事明確揭示受教育與否造成布魯諾與皮耶托兩人人生的差異，當皮耶托自私的希望將自

  己的好友留在這個「好山、好水、好無聊」的山城，不要進到自己討厭的大城市染缸，布

  魯諾意味深長地看著他心愛的山說：「待在這裡，我每天只能跑來跑去，還能做什麼？」

  最後，布魯諾還是沒能到城市裡與皮耶托一起上中學，皮耶托本來可能不覺得這有什麼影

  響，只是感覺自己與對方的距離越來越大。



  直到他在尼泊爾遇見心儀的女孩，皮耶托是這麼形容她的：「她做跟我媽媽類似的工作。

  」不論皮耶托的媽媽是家教還是學校老師，總之，是她堅持讓布魯諾受教育很重要，這時

  候的皮耶托看見女友的角色能夠在尼泊爾發揮怎麼樣的作用，便也認定自己找到落腳的地

  方。



  「只有都市人才會稱山林溪壑為『大自然』。」



  皮耶托周遊列國，到處去爬山，在外人眼中好像很厲害，還成為暢銷作家，但他心裡知道

  ，只能在八山、八海之間徘徊的他只是個凡人；而摯友布魯諾才是那個爬上須彌山且堅持

  所愛的勇者。遊歷世界後回國的皮耶托，與布魯諾分享印度教認為世界的中心有須彌山，

  而周圍圍繞著八山八海。皮耶托從城裡帶來的朋友，看見兩人合力蓋成的小屋，不禁讚嘆

  在山林間生活多麼愜意，布魯諾馬上嗤之以鼻表示他們把事情想得太簡單，而且山民是不

  會幫自然景色取名的，他們眼中看到的就是最純粹的本質與樣貌。



  「每個人心中都有回不去的那座山。」



  年輕時不願與父親一同爬山，又為了休學與否與父親大吵一架後離家的皮耶托，萬萬想不

  到自己會在父親驟逝後，回到這座他早已不再眷戀的山。與布魯諾重逢後，對方說要完成

  對爸爸的承諾，於是開啟兩人徒手在山上蓋避暑小屋的四個月相處。在這段過程中，兩人

  不僅找回兒時的默契，皮耶托也發現布魯諾取代自己成為那個「與父親一起征服山岳的兒

  子」。這也讓皮耶托決定，要循著父親的地圖，一一踏上他倆曾一起走過的路線，閱讀著

  山友日記，他宛如重新認識爸爸。



  如同《追風箏的孩子》一樣，阿米爾一直無法成為父親眼中「成材的兒子」，直到恩師離

  世前，他才知道，自己從小的摯友兼玩伴哈山其實是自己同父異母的兒子。如果說，阿米

  爾與妻子不孕是他的懲罰，那皮耶托在此之前不得志且找不到人生方向也是如此吧。即便

  哈山已經過世，但回到阿富汗去救出哈山的兒子變成為阿米爾重新與父親連結並贖罪的任

  務，就像皮耶托透過與布魯諾一起完成小屋並重回爸爸曾經爬過的山，重新認識爸爸並找

  回自己失去的那些年一樣。



  為了建小屋，布魯諾與皮耶托在整地時將一棵針葉樹移植到別處，布魯諾說這種樹很奇怪

  ，在原生地長的很好，一到外地就死了。沒想到，他們當年移植的這棵樹，歷經多個寒暑

  仍舊屹立不搖，或許這就是皮耶托的寫照吧。他來自山林，但他善於適應，即使不是可以

  常居山林的山民，但他能夠周遊八山、八海；而布魯諾或其他山民，可能如他所說，注定

  離不開這座山。雖說布魯諾最後死在不曾傷害他的愛山上，但皮耶托心裡知道，這是他的

  摯友最想要結束自己生命的方式，只是，皮耶托再也沒有回去那座山的理由了。


  --

  Viola''s World：Screen Scream影迷尖叫屋


