title: '[情報] 越南影史最賣座恐怖喜劇！《見鬼發財》'
content: "越南影史最賣座恐怖喜劇！\n\n票房破千億 過年沾喜氣\n\n《》1月17日(五) 全台上映\n\n  \n\n賺錢別聽巴菲特，靠鬼更勝馬斯克！\n\
  \n\n\n\n  越南影史最賣座恐怖喜劇\n\n賣座超過1280億！2024越南電影票房TOP3\n\n越南影史最賣座電影《再愛一次》\n男主角陳維俊主演\n\
  \n阿藍（陳維俊 飾）是一位因為好賭而欠債累累的年輕人，某天他在躲避債主的過程中，\n意外結識了女鬼娜娜（葉寶玉 飾），娜娜請求阿藍幫助她尋找失聯的孩子，作為交換條\n\
  件，她將運用鬼魂的力量協助他發大財……\n\n資料來源：\n\n--\n不知，車庫沒寫"
