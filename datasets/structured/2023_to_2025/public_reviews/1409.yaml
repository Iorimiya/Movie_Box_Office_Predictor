url: https://www.ptt.cc/bbs/movie/M.1695357962.A.2F7.html
title: '[新聞] 陳柏霖謝欣穎力挺藍正龍 成功補習班祭票'
content: '新聞網址：


  （中央社記者葉冠吟台北21日電）金鐘視帝藍正龍自編自導的青春成長電影「成功補習班

  」今天舉辦首映會，友情力挺的陳柏霖、謝欣穎也現身，祭出千萬票房公約，藍正龍更透

  露已在規劃第3部電影，將以親情為主題。


  首映會現場除了導演藍正龍，主演群詹懷雲、邱以太、巫建和、林奕嵐、侯彥西都盛裝出

  席，飾演家長的鍾欣凌、嚴藝文、王自強與補習班櫃檯小姐的百白到場力挺；和藍正龍共

  同詮釋成人版「三劍客」的陳柏霖、謝欣穎也重新還原電影造型。


  談到友情演出，陳柏霖二話不說就決定接演，「導演找我吃飯後聊了一下他的劇本，我覺

  得他跟小志老師之間的情感，那份心意讓我覺得一定要來演。」


  謝欣穎則飾演巫建和長大後的跨性別角色，笑說回放時被自己嚇到：「可能我在詮釋角色

  時，回話比較直接，講話會很凶但是臉還是有女性美」。藍正龍表示，他和謝欣穎認識很

  久，覺得她的聲音很有磁性，才想邀她演跨性別者，「而且巫建和跟謝欣穎的眼神魅力很

  像」。


  巫建和在片中得扮女裝，因為是運動員出身，試裝時一度肌肉炸開。為了穿衣服好看，拍

  攝期間得瘋狂減重、穿高跟鞋跳繩，只能吃健康餐，結果藍正龍常忘記他要瘦身，不停問

  他要不要吃臭豆腐。


  藍正龍坦言拍「成功補習班」壓力不小，這是部關於「愛」的電影，下週正好是教師節，

  「小志老師（陳俊志）是我人生很重要的老師，我會把這部片送給他」，尤其電影改編自

  他的青春生活，致敬已故導演陳俊志，也記錄他和高中好友程翔的友誼。


  藍正龍今天更祭出「成功補習班」票房公約，破3000萬就會釋出詹懷雲、邱以太片中的舌

  吻影片，破新台幣5000萬就考慮現場版，更開玩笑說如果破億，更願意和真實的「程翔」

  舌吻，「不過程翔本人走鐘走很遠，沒有變成陳柏霖啦。」


  演而優則導，藍正龍繼「傻傻愛你，傻傻愛我」、「成功補習班」後，他已在考慮第3部

  執導電影，想寫關於親情的主題，目前電影初稿已完成，「到我這種年紀的中年男子，上

  有老，下有小，蠟燭兩頭燒，有很多快樂，也有很多怕失去的東西，有很多可以講。」


  至於是否考慮再演戲，藍正龍笑說，他很願意演戲，只是目前較熱愛創作，因此花更多時

  間在創作上。「成功補習班」22日正式上映。


  --'
