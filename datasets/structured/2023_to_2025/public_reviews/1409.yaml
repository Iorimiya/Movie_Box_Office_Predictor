url: https://www.ptt.cc/bbs/movie/M.1695652250.A.7BF.html
title: '[好雷] 成功補習班'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  不知道為何版上沒什麼人在討論這部片

  沒有搶到北影的票，所以在上映當天就衝去看了，聽說跟北影的版本有點不同，

  不知道有沒有看過北影版的觀眾可以分享一下的？


  先說，還沒有看過這部片的人，強力推薦不要看預告，正片比預告片好看太多了

  ，雖然成功補習班有很多的瑕疵，但真心的被藍正龍想念陳俊志的心情給大大大

  感動，滿多人把它定義成同志片的，但我反而覺得這部片更像是導演對自己最親

  愛的老師告白，以及對自己的青春告別的一部電影。


  很多人覺得張正恆做出來的選擇很自私，但我反而很喜歡這樣的一個走向，而不

  是為了要滿足觀眾，讓正恆接受了程翔的愛，有些時候，有遺憾而使一件事情變

  得美好，我很喜歡導演把這份遺憾變成了美好。


  另外，也很喜歡導演從直男角度出發去探討性向這件事情，很喜歡他處理的程翔

  ，他愛的是張正恆，無關性別的這個設定，還有禾尚跟爸爸和解那邊，真的是瞬

  間眼淚就噴了出來，雖然這部在一些事情的處理上略顯粗糙，但整體來說，我喜

  歡這部探討的同志議題勝過於鬼家人，真心推薦大家去戲院觀看，是部會讓你看

  著看著就笑了，但笑著笑著就流淚的題材。


  而且詹懷雲也太棒了吧！整個被他圈粉欸！！！


  --'
