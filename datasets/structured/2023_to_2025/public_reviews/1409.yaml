url: https://www.ptt.cc/bbs/movie/M.1695560119.A.ED1.html
title: '[好雷] 成功補習班'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~








  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  昨天去看了

  先講不喜歡的部分


  說真的

  確實老師講那些勵志的話、唸那些東西是有點尷尬

  我覺得台灣演員在唸這些東西時

  總有一種想要裝快樂、或激勵的感覺

  其實可以像Morgan Freeman那樣

  用低沉的聲音

  像唸書給要睡覺的小孩子聽那樣

  反而真實而有說服力

  意圖說服的聲音

  很像高中生演講

  很容易變得尷尬


  製造補習班老師禿頭的笑料

  也感覺很刻意

  而且他演得很認真

  就讓這種刻意又變得尷尬


  gay老師上課用性愛相關來教英文很棒

  但他是個同志

  講話就不會這麼拘束

  要多一點動作、多一點三八、多一點勁爆

  不然還是尷尬

  就算是九零年代的補習班老師

  其實勁爆起來還是很厲害的


  還有林奕嵐的那個妹妹頭真的很母湯

  瀏海很厚還眉毛很濃

  把她的美貌降低一百倍

  看起來甚至有點噁

  青春劇的女主角要出場就很可愛

  她這個造型真的有讓我嚇到


  老師教張正恆拍影片

  張正恆又說自己長大要拍電影

  結果成年的他沒演這些部分

  就讓人看不出到底老師對他影響了甚麼？

  為甚麼他的死讓他這麼激動？

  不過就是跟他去拍過幾次影片的補習班老師嘛

  又沒真的影響他的一生

  至少講一下你從某某影展拿獎回來之類

  代表你因為老師而長大成為成功的導演嘛

  不然會變成戲裡的人在為戲外的陳俊志致敬

  怪怪的



  除了這些

  我很喜歡這部片的感情線

  讓我願意給它好雷


  張正恆喜歡女主角陳思

  陳思卻喜歡和尚

  和尚跟陳思在一起

  卻只是喜歡穿女裝

  但又不敢告訴張正恆

  張正恆對他生氣

  卻也不想真的揍他

  只能揍牆壁

  結果第二拳揍在程翔身上


  然後程翔在跟張正恆在同志酒吧跳舞時

  旁班的男生都擁吻著

  他想起兩人在一起的點點滴滴

  一時動情

  就吻了張正恆

  由於前面暗潮洶湧地鋪陳了很多

  讓觀眾隱隱覺得「他們每天光著上身在寢室胡鬧，做甚麼都在一起，不會有問題嗎？」

  結果就吻下去了

  這個高潮處理得很棒

  讓人心中砰砰跳


  後續的吵架跟和解也很溫馨

  不是過去那種鬧翻

  或是一直都剪不斷理還亂、很悲情

  或是異男乾脆變成同志、或其實是隱藏的同志

  張正恆很清楚自己喜歡程翔

  很接近情愛

  但不是

  至少跟喜歡陳思不同

  但要跟陳思結婚時

  他又去失戀的海灘

  好像失戀了一樣（結果讓也同時出現程翔變得很開心）

  這樣不為這段關係下明確定義

  保留模糊和朦朧的感覺

  我非常愛


  我不喜歡一向喜歡女生、只要一次喜歡男生

  大家就認定「你一定就是雙性戀」的感覺

  張正恆沒有排斥男生

  也沒歧視同性戀

  但他就是個異性戀

  只是每天跟程翔在一起

  對他有了超乎朋友或家人的感情

  很多異性戀男生都會有這樣的朋友

  但不代表他就是雙性戀

  就必須對程翔的感情負責


  愛是有很多形式的

  不是每一種強烈的愛

  都必定是愛情

  都必須歸類為甚麼戀甚麼戀

  然後愛得要死要活

  程翔願意當他的伴郎

  然後自己去日本尋找真愛

  這樣對他自己好

  對他和張正恆之間更好

  多的是同志跟好朋友異男忘

  告白之後就鬧翻、形同陌路

  這部片這樣處理很棒


  青春的愛

  不見得就是要轟轟烈烈

  而是青春無畏

  不畏懼愛

  不畏懼表達

  卻也不畏懼成全

  讓各自做自己


  而古怪的陳思知道他們兩個的感情

  也一點都不介意

  沒有演出BL劇那種女朋友發現男朋友愛上男生

  就開始跟他鬥

  最後慘敗退出的肥皂劇

  很讚

  他喜歡和尚

  但發現他只是喜歡女裝

  還是願意跟他成為好姊妹

  這段也很棒


  當然最後和尚的父母支持他變性

  也很感人

  可以說在愛情或自我認同上

  這部片寄託了很多理想

  也都令人感動

  但它就不是主流的男歡女愛、校園青春片

  我想票房應該不會很好


  然而關於青春期在性別、性傾向的模糊與掙扎、新舊一代的矛盾

  和解與放下

  我覺得處理得超級好

  影片一開始只有男女主角和程翔

  卻沒有和尚

  我超級擔心是不是和尚自殺了還是怎樣！

  天幸這部片沒為了票房做這種狗血的處理

  簡直可以說有很棒的教育意義


  然後

  兩位男主角的肉體很讚　哈哈

  很養眼

  程翔是我的菜

  太可愛


  還有巫建和扮起女裝令人吃驚的搭

  很美耶！！

  有嚇到我


  故事講得流暢

  用張國榮的Monica當插曲也很好聽

  演員的演技也都不錯

  我覺得是滿可以進場支持一下

  也許它無法讓每個人都可以從中touch到自己的青春點

  但會讓你想起身邊一些人

  甚至跟你很親近的人

  你隱隱約約感覺他們好像有甚麼古怪、有甚麼曖昧

  卻又不知細節

  看了之後有一種「喔......原來他們當年可能是這樣」

  這是主流的校園青春片  旁邊的暈影

  我覺得它的可觀性在這裡








  --'
