url: https://www.ptt.cc/bbs/movie/M.1695039816.A.782.html
title: '[好雷] 《成功補習班》劇情的小疑問'
content: '私心強烈建議想看這部的人不要先看預告


  北影時沒特別注意到這部


  後來知道是藍正龍導的


  因為他導的第一部我還滿喜歡的


  就滿想看


  但看之前沒看簡介沒看預告甚至沒看卡司


  所以驚喜還滿多的 XD




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  祝《成功補習班》票房大成功 ：）




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  居然有陳柏霖！（雖然戲不多）

  而且好像也有提到變成怎樣的大人之類的

  有點《藍色大門》（我的愛片）的感覺


  前面的tone調感覺很像青春YA片

  沒想到後來探討了滿多東西的

  1994年應該還是相對保守的年代

  在課堂上講性別認同跟保險套算是滿前衛的吧


  找卜學亮來演媽媽桑我也是很意外

  腦中覺得這個角色

  可能有想過找某個已經退出演藝圈的人演w


  在Gay bar兩個男主角好像都很想下去玩

  不太懂程翔是當下才驚覺自己喜歡正恆

  還是早就已經暗戀他很久

  如果是後者

  那肉碰肉事件的時候程翔幹嘛不就給他親算了

  因為是初吻要比較慎重嗎 XD


  告白大亂鬥的收尾我覺得可以更好

  正恆說的台詞感覺太硬了

  而且那應該就是聯考前幾天吧

  要怎麼在畢業前談一場轟轟烈烈的戀愛啊

  那進度要很快耶 XD

  還是聯考完還要很久才畢業？

  好久以前的事我真的不記得了w


  其實後面感覺能講的篇幅還很多

  或許還滿適合拍成像《爆炸》那樣的迷你劇集吧


  看到片尾張國榮經典作品〈Ｍonica〉

  作曲居然是「NOBODY」

  瞬間以為真的是無名氏

  估狗才知道是一個日本樂團 XD


  整體而言我滿喜歡這部的

  雖然有些地方滿無腦的

  但有看到完整有趣的故事

  然後

  詹懷雲真的帥 <3



  下面是關於劇情的一點小疑問

  不知道是不是有QA過

  希望有板友能解答 XD



  1.正恆跟程翔送瑪丹娜的「X」給和尚

  　掉出眼鏡跟光碟時

  　好像有人說「那是我哥偷藏的啦」

  　但正恆應該是獨子

  　程翔的哥哥（弟弟？）應該是後面出現的唐寶寶

  　所以光碟到底是怎麼回事

  　難道是程翔一開始就在準備試探正恆了嗎

  　但他不會擔心和尚帶走嗎？


  2.正恆只穿一條內褲跑到公車站時

  　為什麼司機要示意他上車

  　又為什麼要他在新公園下車

  　1994年兩個男生一起騎腳踏車上課很普通吧

  　難道司機一看就覺得他們是Gay？

  　還是純粹因為常被他們擋車就故意想整正恆？


  3.這部特別提到是真實事件改編

  　所以程翔這個角色有真實的範本嗎

  　還是陳俊志就是［小志老師+程翔］

  　另外在藍正龍演正恆的階段

  　陳思就沒有出現了

  　難道在寫劇本的階段就已經知道要離婚了嗎

  　不過最後小孩說要玩Pokeman的時候

  　藍好像還是有跟小孩說要問媽媽就是了w


  --'
