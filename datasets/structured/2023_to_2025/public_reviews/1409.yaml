url: https://www.ptt.cc/bbs/movie/M.1696126203.A.BBE.html
title: '[ 好雷] ☆他馬克老闆☆成功補習班☆都～很～好看'
content: '最近看到兩部還不錯的小品

  一部是他馬克老闆

  一部是成功補習班


  以下有雷

  。

  。

  。

  。

  。

  。

  。

  。

  。

  。


  他馬克老闆真的很好笑，很紓壓

  受盡職場折磨的盧廣仲飾演馬克

  他或是他同事許多反應都寫實描繪出上班族的生活樣態和內心世界的爆炸感

  整部片很有舞台劇感

  像一幕一幕的代入

  算是不一樣的電影敘事風格

  。

  然而，精彩的是黃宣☺  ☺  ☺


  每一次飾演死神的黃宣出場

  我都笑得美丁美當

  他的表演完全撮中我

  但有一場他出現

  卻把我逼哭了


  黃宣那場的表現其實是故事帶動的

  因為他只要準備帶走一位逝者，

  他會cosplay逝者的角色情境，

  他說這樣對方就會感覺很熟悉，

  不那麼陌生錯愕。

  是個好溫暖的死神，

  但有一場他打扮得好像馬克（盧廣仲風）

  讓我瞬間掉淚了。。。。因為他準備的是馬克他老母。


  這部片的亮點之一是鄭人碩，

  他一向帥氣逼人，

  但這部演出一個有肚子還結巴的中年男子，

  好多劇情都好瘋好好笑，

  看這檔真解壓。


  再來是成功補習班，

  我覺得片名應該可以取得更貼切，

  因為我本來以為是青春校園劇，

  遲疑了一回是不大想看的。

  後來想知道它如何描繪劇中老師的角色，

  因為我沒有看太多劇情相關的宣傳，

  這部電影反而讓我很驚艷，

  我好～喜歡巫建和的表演，

  本來覺得他跟其他高中生感覺層次差異太大，

  除了他已經是台劇熟面孔，

  演技的感受就很不一樣，

  跟其他人擺在一起就是很不搭，

  但是隨著劇情推展，

  我越來越認同這個角色給他詮釋是最正確的，

  他完全可以撐起來這個角色要帶給觀眾的張力


  兩位男主角的表演也讓人非常喜歡

  非常自然流暢，很好看

  我也很喜歡侯彥西表演的老師，

  侯彥西的每一檔戲我幾乎都有追，

  #尤其最近的女兒大人加個賴好好笑喔


  整部戲我被感動兩次

  一次是巫建和跟爸爸互動的那一幕

  太厲害了。當爸爸說我們陪你去，我就掉淚了。

  另一次是侯彥西扮演的老師跟男主角詹懷雲說「去愛吧，就像不曾受過傷一樣；跳舞吧，

  就像誰都沒有看到一樣；唱歌吧，就像沒有人聽一樣；生活吧，就像今天是世界末日一樣

  。」～by Alfred D’Souza


  最後我很喜歡這部片把Leslie唱的Monica放進去

  這首歌有股力量

  可以把很難過很難過的事

  放得很輕盈很自在

  做自己像是世界上最不容易的事之一

  一旦套入某種身份

  就被代入某個框架

  人必須感受跟體悟

  才能創造生的價值


  --'
