url: https://www.ptt.cc/bbs/movie/M.1695568477.A.B59.html
title: '[新聞] 藍正龍導《成功補習班》認自私'
content: "藍正龍導《成功補習班》認自私\n\n04:10 2023/09/24 中國時報 翁紫曦\n\n\n藍正龍（左）找侯彥西扮演電影中的靈魂人物「小志老師」。（陳俊吉攝）\n\
  \n藍正龍執導的《成功補習班》熱映中，電影描寫他與已故紀錄片導演陳俊志亦師亦友的真\n實故事，陳俊志一角由侯彥西扛重擔。藍正龍說：「拍這部電影，我先跟大家說聲抱歉，\n\
  我就是很自私，拍了一個關於我自己的故事，而它並不華麗、顯擺。」\n\n談到再次擔綱導演，藍正龍坦言：「這部電影對我意義重大，是我一部份的青春，這讓我\n感到赤裸。」他不諱言現實面的考量，一個人要扛千萬的製作費、成本，讓他時常半夜睡\n\
  不好，擔心成果不如預期。\n\n藍正龍仍執意要拍、執意想把單純的電影做好，「我覺得要炫技、要講求技術，我當然也\n可以做到，但我就是希望這部電影『純』。」他舉例，男主角詹懷雲在片中有許多光著上\n\
  半身橋段，但他不希望詹刻意健身，他要的是真實感、不是商業感，「我想法很簡單，哪\n怕拍攝的當下有片雲剛好出現，我也會用。」\n\n34歲的侯彥西出道17年，演過許多不同類型的角色，對於藍正龍要的「純」，他坦言：「\n\
  我覺得我現在介在兩者之間，現在的我知道鏡頭在哪、該怎麼做，但我又怕拿捏不好，變\n得太匠氣；身為演員，我會說我現在的狀態像在堆積木一樣，一層一層疊加，但會變成何\n\
  樣，我還在思考。」\n\n提到與藍正龍合作，「他不要求我跟陳俊志一模一樣，但他希望我演出像陳俊志一樣給人\n的感受。」藍正龍給的提點，幫助他詮釋角色更有自信。\n\
  \n談到導戲，藍正龍笑說：「每個演員需要的不一樣，面對那2個大男生有一套做法，面對\n彥西這個階段的演員有另一套做法，我不強求，我喜歡演員有所回應。」\n\n\
  藍正龍將陳俊志視為恩師，是讓他踏上導演這條路的一道指引燈，若沒當上導演？藍正龍\n笑回：「那個年代，傳統父母都希望男生可以當工程師，但我看計算機就覺得它是死的東\n\
  西，一點溫度都沒有，就算我沒有當導演，我也不會當工程師。」透露叛逆時期的他，考\n試作弊時，連磁碟片都插反，他不但毫無興趣，也不想浪費時間。\n\n#坦言 #當工程師\
  \ #華麗 #導演 #演員\n\n--\n佛教經典的\n是 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
