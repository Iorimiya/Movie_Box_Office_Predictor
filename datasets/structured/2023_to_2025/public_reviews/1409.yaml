url: https://www.ptt.cc/bbs/movie/M.1695134360.A.6C7.html
title: '[影評] 成功補習班:真摯動人，以青春浪漫包裝「'
content: '影評 / 《成功補習班》：真摯動人，以青春浪漫包裝「議題」之苦



  《成功補習班》整部片子上有著各種修修補補的痕跡，但故事內裡的議題討論跟情感核心

  非常動人，而且不讓人感到對跨性別/同志族群有消費感。侯彥西的表現絕對是近年最好

  ，搭配《Monica》的絕妙舞動場景，神采讓人迷戀。當然藍正龍在導演技術上只能給及格

  分數，技巧並不好，但演員調整得很好。只是《成功補習班》絕對能夠更好，讓這部片變

  得很可惜，比如選角策略上就有很大的討論空間。


  而在後期跟特效鏡頭上其實處理得很複雜，這點必須稱讚。攝影跟剪接上其實處理得很好

  ，這裡是指輔助導演的敘事層面。雖不是年度最好台片，但肯定是最好看最動人的台片之

  一。真摯動人讓我哭到不行，然而影片毛邊稍多，可以肯定在獎項上不會吃香，甚至直接

  被犧牲。我還記得大學時候有一年去聽陳俊志跟李維菁的講座，看完《成功補習班》，深

  思留著活下來的人，也許能做到是告訴更多人，他們貢獻了什麼。


  《成功補習班》是一部充滿社教意義的作品，其中的青春洋溢確實也呈現了每個人在理想

  與現實之間的無奈。「如果不讓自己快樂，那就只能哭了。」









  很少看到這部的影評，順手貼過來，有其他人看過了嗎？



  --'
