url: https://www.ptt.cc/bbs/movie/M.1705476490.A.E9C.html
title: '[普雷] 成功補習班'
content: '剛看完

  有雷小心




  看完只有一個記憶深刻的亮點

  就是巫建和扮女人真的有夠像


  "波多野結依"


  他扮女人那個五官

  一開始感覺很眼熟

  不知道到底像誰??

  後來突然靈光一閃

  對!就是像波多野結依


  以前大家覺得波多野像林志玲

  現在反而看到波多野會想到巫建和

  完蛋了，拜託巫建和趕快再去

  找鍾孟宏演陽光普照2裡的8+9

  看能不能一路演到變黑道議長立委



  再來給藍正龍的一封信:


  看完這片感覺是藍正龍的自傳

  好像在模仿九把刀那些年的套路

  三個臭男生壞學生的噁爛生活

  就像黑的教育一樣的死屁孩三人行

  但九把刀再怎麼變態上課打手槍

  還是因為女神考上交大當名作家

  像哈利波特一樣累績一票死忠書迷


  而且那些年是靠柴智屏當監製

  找來怪胎的導演當執行導演才拍的好看

  後面九把刀自己導跟監製的片都很難看

  (春風愛洗頭妹的加強稍微好一點點)


  因為有大監製大編劇柴智屏在旁邊監督

  拍那些年他才不敢隨便亂拍，惡搞亂搞


  我是因為流星花園跟波麗士

  才開始喜歡藍正龍的

  所以形象就是草根大帥哥

  不太會念書才會去考警專


  所以應該要找個大導演來拍你才對

  就像成龍也有很多御用導演跟攝影師

  專門拍演警察，一路演到變台灣警察代言人

  從A計畫、警察故事、重案組等等等


  但願藍大導演也能演一輩子警察

  把波麗士的形象繼續發展下去

  找桂綸鎂、謝佩恩、鄭有傑、林佑威、馬志翔

  陳慕義、慕思明、汪建民、卜學亮、樊光耀等

  再把這些班底找來發展出一部警匪片系列

  最好找魏德聖或陳國富的雙瞳組合來導

  他們兩個都比較適合拍動作片


  眼看現在時下黑道片那麼猖獗

  民眾那麼討厭8+9，但黑道片還是拍不停

  好像完全不計成本的在靠電影洗黑錢的感覺

  反正也不需要電影賣座

  因為兄弟靠黃賭毒騙發大財

  不靠電影吃飯，就有興趣隨便玩玩

  賠光也沒差，當作做公益

  給電影人工作賺錢的機會

  愛看不看隨便你

  他只想拍給小弟看老大們

  年輕時的忠肝義膽


  所以藍正龍導演應該幫警察多拍幾部好片

  就像香港以前也有專門拍警察電影宣傳的

  "警察公共關係科"


  多幫皇家警察建立良好的形象

  就像007幫英國建立很好的軍事特務型像

  大家看完痞子英雄都對警察工作很熱血

  反而台灣幫警察拍的片幾乎都很很難看

  像查無此心等等等，都很悲情的感覺


  所以期待藍導下部片能拍波麗士大人電影版

  或許第一集你可以自己導導看，不好看再換人導

  但你永遠是男主角劉漢強

  就像警察故事的陳家駒一樣



  --

  藍有演流星花園橫刀奪愛的小王

  藍跟大S就是演流星花園相戀的!

  網上說在17集客串演假表哥亞門

  但我去找YT，奇怪好像被刪掉了

  難道有合約內幕 ?

  還好我沒花錢，主要是藍的電影都爛到爆

  但他還能一部一接一部的拍，不愧是偶像

  好像跟大仁哥一樣只能當金鐘獎一哥

  想當影帝跟電影大亨還得找李安拜師'
