content: "來了\n\n\n\n眾所期待！終於登台！\n\n日本首部鯊魚特攝災難動作片！\n\n《》11月21日(五) 全台上映\n\n\n\n432條鯊魚，準備大開鯊戒！\n\
  \n全美大開近200間電影院盛大上映！\n\n  \n\n鯊魚電影年度大賞 金獎\n\n第1屆 東京國際鯊魚電影祭 觀眾獎\n\n第35屆西班牙聖塞巴斯提安恐怖奇幻影展\
  \ 正式入選\n\n瑞士納沙泰爾國際奇幻影展 正式入選\n\n日本小眾電影院票房TOP 1\n\n致敬好萊塢名導經典作品《》\n\n眾籌每付出1000日圓，電影中就加碼一條鯊魚！\n\
  \n電影中共有432條鯊魚，準備大開殺戒！\n\n 在S縣暑海市，市長推動大型觀光設施建設之際，卻接連發生溫泉旅客失蹤事件。\n\n警方調查後發現，死者皆遭鯊魚襲擊。\n\
  \n警察署長與海洋生物學博士進一步揭開驚人真相——\n\n太古時代甦醒的凶殘鯊魚，正穿梭於市內各地溫泉之間，肆虐人群！\n\n--"
