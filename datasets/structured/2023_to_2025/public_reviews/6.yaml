url: https://www.ptt.cc/bbs/movie/M.1763794142.A.D2F.html
title: 'Re: [好雷] 溫泉鯊.....'
content: '抱著不能只有我有看到的心態推坑


  這部簡單來說就是


  寶可夢ZA DLC(溫泉鯊大量出沒）

  使用天竺鼠車車的拍攝方式完成


  故事劇情用寶可夢ZA來說

  大概就是


  米阿雷市因過度開發溫泉造成

  棲息在海底火山的尖牙鯊大量出沒

  鯊鯊可以讓土壤液化到處游來游去


  市長+科學家+會開五檔的人形奧特曼一起組團打怪的故事


  整部拜託不要帶腦拼命吐槽就好

  例如潛水艇射出魚叉射歪

  然後泳裝男突然瞬移到艇外另一邊

  接到魚叉再射回來等場面


  血腥程度0

  實體鯊魚吃人的畫面大概就是

  人抱著IKEA鯊魚哇哇扭來扭去

  噴稀釋番茄醬的程度


  天竺鼠車車的拍攝風格讓畫面很可愛

  臨演逃難還有看到邊跑邊笑

  就是一部到底再看鯊小的電影


  可惜是低成本電影

  傑森史塔森應該不要接巨齒鯊來演這部

  應該會更好笑


  台南新光帶小孩整場只有我們三人

  放心的大笑吐槽實在很有趣的觀賞體驗


  推推 希望能多支持這種電影




  --

  這部的樂趣再於以往的鯊魚電影是，幹片劇本演的很認真，溫泉鯊是-我很認真的演幹片

  給你看XD'
