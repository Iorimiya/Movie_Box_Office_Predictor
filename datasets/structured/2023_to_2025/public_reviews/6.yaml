url: https://www.ptt.cc/bbs/movie/M.1763774665.A.759.html
title: '[好雷] 溫泉鯊.....'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n溫泉鯊的故事\n發生在位在日本，一個虛構的、以溫泉著名的城市\
  \ - 暑海市\n\n暑海市在近日發生了數起身上有著鯊魚咬痕的全裸屍體命案\n死因判定都是因為身體被壓縮，全身粉碎性骨折\n一心想退休，想不透為什麼沿海都已經用圍網圍住\n\
  卻還會有鯊魚出沒的警察署長，找了專家前來暑海市進行調查\n\n專家研究指出，由於鯊魚只有軟骨，所以可以透過壓縮身體進入溫泉管道\n並在攻擊人類後再回到海洋中，所以不管怎麼圍網都沒有用\n\
  遺留的鯊齒證據顯示，攻擊人類的鯊魚品種為古生物 - 溫泉鯊\n\n毫無懸念的演到這，就是人類展開徒勞無功的反擊的時刻了\n但溫泉鯊口吐甲烷、勞倫氏壺腹還可以放出電磁波(媽的三小)\n\
  無論人類派出軍隊或是科學戰艦都徒勞無功\n不但如此，溫泉鯊還大舉進攻\n不但會出現在溫泉會館、一般住家的浴缸\n連行走的路面和公園也出現其蹤跡(媽的三小)\n\
  警察署長更為了救市長被鯊魚咬傷得了鯊魚病(媽的三小)\n\n日本總理大臣此時宣布了命令\n表示溫泉鯊害過於嚴重，將行使美日安保條約把整個暑海市炸了\n要暑海市市民盡速撤離\n\
  \n此時平常只想著出名，讓自己的臉可以印在饅頭上的市長良心發現\n良心發現但束手無策的他，和專家想出了一個計策\n透過3D打印機印出了一艘不怕電磁波的高科技潛艇(媽的三小)\n\
  他和專家要進入深海內消滅溫泉鯊\n這時從電影一開始就出現的不明來由的肌肉兄貴也加入了獵鯊行動\n\n進入深海後，市長和專家才發現整個溫泉鯊族群數量極為龐大\n\
  雖然肌肉兄貴歐拉歐拉一拳一鯊，依然無法將其消滅\n於是市長心生一計，將鯊魚引誘到也是由 3D 打印機印出來的暑海市溫泉飯店正下方\n透過炸掉地基，讓飯店整個沉沒到海中，將所有的溫泉鯊埋葬\n\
  \n就在三人慶祝勝利的同時\n頭上長著有如皇冠突出物的溫泉鯊之王出現了!!!\n面對無論怎麼毆打也毫髮無傷的溫泉鯊之王\n肌肉兄貴選擇被其吞噬，進入體內大鬧特鬧\n\
  並用摩斯密碼和潛艇內的市長與專家聯繫\n要他們在溫泉鯊之王受不了張嘴時開槍，藉此引爆體內的甲烷\n市長和專家雖然擔心兄貴的性命，但還是以大局為重開了槍\n終於幹掉了溫泉鯊之王了!!!(..........)\n\
  \n暑海市恢復了往日的寧靜\n因得到鯊魚魚翅內的血清康復的警察署長\n在海邊吃著印有市長的臉的饅頭時，肌肉兄貴緩緩的從岸邊站起\n伴隨著熱血的片尾曲，帥氣的走向鏡頭，也迎來了結局\n\
  \n\n\n觀影重點：\n1.飾演本片第一女角鯊魚專家的演員中西裕胡演過美少女戰士舞台劇\n  其實看久蠻好看的，有種熟女的魅力\n\n2.主題曲灼熱の戦歌蠻熱血的\n\
  \  \n\n3.超低成本拍攝的特攝片，水準大概在以前老三台的浴火鳳凰靈芝草人等級\n  比昭和哥吉拉還粗糙，轉場生硬加上話劇社演技，根本以前宇宙囧片王會\n\
  \  出現的電影\n\n4.講不出來了，想去電影院看的請抱著一顆包容、放鬆、不要帶腦的心，\n  個人是看得很開心啦，雖說是瞎到不行的糞片，但相較這幾年行銷過頭的\n\
  \  商業樣板爛片，反而也蠻能看到製作團隊的活力的\n\n5.送的海報是高磅數的，印刷上比較沒有一堆工藝，但海報整體不差\n--\n你胡說，你胡說\n全場傻笑到結束，優質好片\n\
  女人沒有，鯊魚也沒有，兄貴有\n他有續集?XDDDDDDDDDDDDDDDDDD\n他媽的一定進場支持，笑死\n方便糾正一下哪裡寫錯了嗎?小弟來修正\n看到後來都在傻笑，不太知道自己在幹嘛了\n\
  謝謝糾正，我看到後來已經不太知道自己在看甚麼了\n對...你說的沒錯\n你好強，這部片從一開始第一次鯊魚出現後我就開始傻笑放飛了XD\n你看的好仔細，我一開始太想努力把人名記起來\n\
  有些地方就漏了，這是逼我二刷嗎\n捲筒衛生紙有笑點，超白爛XD\n不然說姐姐型好了\n現在小孩這麼早熟，鐵定覺得無聊吧\n會喜歡的可能只有像本人這種長不大的40路中年男子"
