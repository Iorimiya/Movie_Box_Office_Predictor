title: '[普雷] 聖奧梅爾殺嬰案Saint Omer'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  聖奧梅爾殺嬰案Saint Omer


  確實是拍得好，角色對白設計精準，領觀眾思考作為移民承受的壓力與可能帶來的心理影

  響（或說完全破碎）。第一代移民與第二代移民的狀態對比也耐人尋味—我認為片中暗示

  作家女主角是第二代移民，她與母親之間的代溝是來自於整體狀態的差異，她無法理解和

  親近母親，但透過這場審判，她彷彿參與了某種跨時代的第一代移民心聲，或許也像是開

  啟她理解她母親的橋，走完整場審判，她從不理解的一岸走向另一岸。一個人如何去理解

  另一個親近卻不能理解的人呢？這電影算是給了明確的答案。


  不太能欣賞的原因可能是麊k國文化太不熟之外，法庭戲中的檢查官太討厭（？）、律

  師人又太好（？？？）。



  ***


  這裡是我的樂園:





  --'
