title: '[好雷] 聖奧梅爾殺嬰案'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  2016年，塞內加爾裔的法國媽媽法比安娜‧卡布（Fabienne Kabou）由於殺害親生女兒被

  判20年有期徒刑。一般很難想像母親狠心傷害自己的骨肉，但事出必有因，或者一定有嗎

  ？依據導演出席審判時的所見所聞改編而成的劇情片《聖奧梅爾殺嬰案》，便從母親的角

  度來看待這場判決。



  本片改編自真實事件，法國新銳導演愛麗絲迪歐普首部劇情長片，榮獲威尼斯影展評審團

  大獎及最佳首部電影，更代表法國角逐奧斯卡最佳國際影片並入選15強。



  當幻想模糊了愛，意識超脫於罪罰之上，她殺的只是她的孩子嗎？北法小鎮聖奧梅爾的法

  庭上，一名年輕文學教授、小說家哈瑪，為了重新詮釋希臘神話美狄亞的新作而出席旁聽

  一起審判：蘿倫斯柯利，年輕黑人女性、塞內加爾移民，被控遺棄她15個月大的女兒於漲

  潮的海岸遭溺斃身亡。究竟哈瑪與蘿倫斯之間有著什麼連結？是命運還是偶然，亦或血液

  裡流竄承載的創傷。



  雖說全片大部分的場景皆在法庭內，但導演不但讓觀眾觀看庭訊的過程，更透過各種凝視

  、話語與沉默來擴大故事的張力。鏡頭不僅聚焦在蘿倫斯與哈瑪身上，更多的時候是透過

  法庭內其他人的視角來觀看，給予觀眾身歷其境的感覺。片中不少角色在正式介紹出場之

  前，觀眾就透過哈瑪的眼睛若有似無地看到他們在法庭內的肢體語言與眼神，像是蘿倫斯

  的媽媽與情人，在法官傳喚他們上證人席之前，觀眾便已能猜出他們的身分，但若想藉此

  觀察蘿倫斯每句話後他們的反應，卻又不是那麼全面或容易看見。讓觀眾不再是觀影時的

  全知角色，更能全心投入電影想告訴我們的訊息。



  甚至在電影最後，蘿倫斯的律師一段對在場陪審團所說的話，鏡頭是直接對著律師，這段

  話無非是對著觀眾訴說。就像蘿倫斯所說，不論女兒是否死亡，她都將永遠活在蘿倫斯身

  上。律師提到，大部分的人都知道母親懷孕時會透過臍帶與胎兒交換血液與養分，但很少

  人知道在這個過程中，其實一部份的細胞也交換了，這就彷彿希臘神話裡一種獅頭、羊身

  、蛇尾的吐火怪物奇美拉（Chimera），所以醫學界也將這些細胞稱為「奇美拉細胞」。



  一般來說，這種交換細胞指的嵌合體現象出現在骨髓移植或異卵雙胞胎，前者因為骨髓包

  含能夠發展成血球細胞的幹細胞，因此符合定義；後者則是受精時為雙胞胎，但其中一個

  胚胎在懷孕早期就死亡，最後順利出生的兄弟姊妹身上就會帶有當時「吸收」該胚胎的細

  胞，而在不知道自己曾是雙胞胎的情況下成為不知情的奇美拉。



  不過，更常見卻較不為人所知的反而是懷孕期間所形成的微嵌合體，通常都是發展成自體

  免疫疾病後，才會被發現。蘿倫斯的律師說，殺害親生女兒的母親，任誰都會認為是「怪

  物」，但其實所有的母親都是「怪物」。此言非假，不單只是片中所提的「奇美拉細胞」

  ，光是媽媽們能夠挺過懷胎十月的不適與分娩的痛苦，就肯定是怪物無誤。雖然片中的蘿

  倫斯尚有身為小三此一「罪行」，但原型角色甚至墮胎過兩次，她們最後決定將孩子

  生下來一定是鼓起很大的勇氣且下定決心，沒想到最後還是沒能獲得愛人同等的愛，這當

  中的犧牲完全不對等，產前與產後憂鬱症也就此找上門來。



  電影利用主角哈瑪的文學教授背景，將古希臘詩人歐里庇德斯的著名悲劇《美狄亞》拿來

  比對，非常適切。這部文本描寫的主題為「婚姻」與「愛情」的悲劇，在丈夫喜新厭舊、

  拋棄自己的情況下，美狄亞一口氣殺害四個人，包括「小三」、小三的父親與自己的兩個

  幼子。不同的是，文本最後美狄亞獲機械降神（Deus ex Machina）一臂之力，免受制裁

  ，而蘿倫斯與原型角色法比安娜都鋃鐺入入獄。這可能也是為何蘿倫斯在法庭上自述她將

  女

  兒帶到海邊時有月光灑落，而晚上哈瑪在飯店觀看《美狄亞》的電影時，同樣有月光灑落

  的呼應橋段。



  由於孩子是兩人的「愛」的結晶，即便自己也將承受喪子之痛，唯有殺害孩子才能讓背叛

  自己的丈夫感到痛苦，畢竟比起分娩與懷孕的痛苦，將孩子殺掉搞不好包含更多「不甘心

  」的情緒，但對於這段時間什麼都沒有付出的爸爸來說，失去以為獲得的孩子才會有椎心

  刺骨的痛。



  《聖奧梅爾殺嬰案》透過蘿倫斯與哈瑪間巧妙的對比來讓觀眾反思社會上的案例與自己的

  家庭狀況。在審判開始之前，觀眾先是認識哈瑪，從一場家庭聚會得知，哈瑪與丈夫的家

  正在進行整修，至於為何整修，哈瑪表示「原因不重要」，因為電影主題是殺嬰案，不難

  猜到他們正為了新增嬰兒房而整修，至於為何哈瑪會侷促不安，才是電影後面要告訴我們

  的。



  蘿倫斯在法庭上說明父親外遇，很早就離開家庭，讓她看見母親的悲傷與辛苦；哈瑪的父

  親老年才因病過世，但是片中不斷穿插的回憶告訴我們，哈瑪的童年並非不快樂，但她目

  睹很多母親的哀傷。當時的她不懂，以為自己只是不被母親愛，或許也的確如此，如果沒

  有步入家庭、沒有生養小孩，媽媽仍能保有自己的夢想、生活與尊嚴，如果沒有小孩，蘿

  倫斯可能早就完成學業。當男人過著幾無二致的生活，女人的人生卻在懷孕那一刻就此有

  了不只180度，甚至可說是360度、720度或更多度的不可逆轉變。如同360度與720度一樣

  ，生產完好似轉了好幾圈後一切又回到原點，但一切卻再也無法恢復原狀。



  哈瑪記憶中一幕是放學後，看到媽媽一個人坐在房間打扮得漂漂亮亮，將所有的首飾穿戴

  上身，但臉上卻流下一行行的淚，這或許就是媽媽在哀悼自己本來可以擁有的一切美好與

  快樂。同為擁有白人伴侶的非裔法國人，法庭上的所見所聞都讓哈瑪擔心，自己會變成媽

  媽，或者成為蘿倫斯。她開始體會小時候媽媽不是不愛她，而是由於媽媽有自己的課題要

  克服。我們無法得知電影最後哈瑪是否對懷孕這件事情釋懷，但她回家去陪伴年邁的母親

  便是一種與媽媽、與過去的和解。



  《聖奧梅爾殺嬰案》與去年底的港片《正義迴廊》相似，都是法庭片，可是後者呈現出許

  多案發的畫面，而本片與之不同的是，不管是法官問話或蘿倫斯自述，都著眼於行為背後

  的動機，而非行為本身，因此只有在電影一開始的時候，呈現出蘿倫斯抱著剛喝完奶、安

  靜睡著的寶寶緩步走向海邊的場景。就連傳喚愛人當證人，也沒有任何兩人過去相處的畫

  面供觀眾想像，取而代之的是主角哈瑪過去與現在的回憶與經歷。畢竟電影的重點並不是

  要我們擔任陪審團，為蘿倫斯的罪行給出一個判決，而是感同身受她的高學識與高智商為

  何會做出如此選擇。



  就像原型角色所說，正是因為無法親手殺害孩子，才選擇讓大海帶走她，而如果自己打從

  一開始就不想要這個小孩，也絕對不會願意承受懷胎十月的痛苦，還撫養她十五個月才動

  手殺害，更何況除了孩子的父母之外，沒人知道她的存在，也沒報戶口。而蘿倫斯與原型

  角色口中所說導致她們做出此項決定的「巫術」，更是長久籠罩在母親或所有女性身上的

  壓力。


  --

  Viola''s World：Screen Scream影迷尖叫屋


