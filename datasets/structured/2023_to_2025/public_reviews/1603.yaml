title: '[好雷] 《聖奧梅爾殺嬰案》消失的絕不只一個嬰兒'
content: '（前面沒什麼劇透）

  這不是一部很好理解的電影，雖然超過一半的戲在法庭上，但並非我們熟悉的雙方律師唇槍

  舌戰的攻防場面。這部片很靜，大量使用長鏡頭凝視著葛絲拉基梅蘭達（Guslagie Malanda

  ）飾演的嫌犯，年輕黑人女性蘿倫斯柯利。她的每一題陳述，鏡頭不移動，甚至鮮少切換剪

  接，觀眾是如此被迫注視，導演就要你仔細傾聽她的一字一句。


  柯利被指控在法國北方小鎮聖奧梅爾（Saint Omer）的海岸，遺棄她15個月大的女兒使之溺

  斃身亡。因為案件太過離奇，法官鉅細靡遺詢問她關於家庭出身、求學、感情交友乃至犯案

  動機。在她一連串近似心理剖析的陳述之後，我們仍無法了解全案真相。


  因為導演不是要用這些參照真實記錄的對話來給答案，而是藉以讓世人發現更多問題。柯利

  並未直接指控何人何事，她像在對群體發出沉重責難。其中極大的關鍵是，柯利身為塞內加

  爾移民。


  （後面也沒什麼雷，一些些劇透）

  …

  …

  …

  …


  部分台灣觀眾也許無法立即承接這個身分背後的指涉。據2021年統計數字，法國人口有一成

  的比例是移民，約近700萬的移民，其中47.5％來自與法國殖民關係深厚的非洲國家。另有

  一成已是第二代移民，換句話說，法國有1/5的人口由第一或二代移民組成。


  在法國社會的精英主義底下，不少移民家庭為了讓下一代有更好的生存，從小逼孩子只專注

  學法語。柯利就是，她自幼在塞內加爾被父親禁止說母語，所以她無法跟母親講母語，無法

  跟同儕親近，也無法學習自己的文化。


  她移民法國後果然能說一口優雅法文，可是一名在庭上受質詢的她的教授，卻嘲諷她雖能講

  優雅法文，但寫作脈絡混亂，指她想研究的是德國語言學家，卻不研究自己文化裡的人。


  上述對話布滿了導演的暗示，像柯利這樣背景的人無法迴避的是移民問題，她的身分正在消

  失。對比她在感情關係中的被忽視，甚至她懷孕生產皆如隱形一般被無視。電影似乎沒有要

  討論種族歧視，而是移民議題；失去身分的恐懼，如同一個人活生生從世上消失。


  身分也是來自於母親血緣的連結。電影是由凱伊耶卡加梅（Kayije Kagame）飾演的另一位

  年輕講師哈瑪的視角說起。哈瑪也是非裔移民、也將成為人母、同樣也與母親有著相處隔閡

  。她看著柯利在法庭上陳述經歷，像對照自己。電影開頭，哈瑪透露是為了撰寫關於希臘神

  話「美狄亞」的文章，才遠赴該處旁聽這場審判。直到後段，「美狄亞」才又出現第二次，

  在哈瑪的飯店房間電視上，正播放改編美狄亞神話的老電影片段。美狄亞在希臘神話裡是殺

  害自己兩個稚子的悲劇人物。


  哈瑪原本對於將成為人母是徬徨的，也有過掙扎留不留孩子。在她深入了弒嬰題材，在她逐

  漸感受肚裡寶寶心跳呼吸的連動，才又回過頭去解開自己與母親的心結。那個習慣在沙發上

  鋪罩一塊紗龍布的母親，以及習慣在飯店床墊鋪上從家裡帶去的蓋布的自己，無法改變是流

  著相同血液必然相互影響的母與女。


  殺嬰案，在電影拋灑千迴百轉的思考之後，有沒有罪已經不是討論重點；而是，母親真的要

  殘害自己的孩子？抑或是拯救？不讓她也落入這個無間地獄？


  拍攝紀錄片出身的法國新銳導演愛麗絲迪歐普（Alice Diop），在此首部劇情長片中，運用

  許多凝視一般的記錄式鏡頭，尾聲，辯護律師的結案陳詞，她不講案情，是向陪審團提出了

  承襲母親血液的論點。這場戲，導演讓她直面向鏡頭說話，形成她持續盯著正在看電影的我

  們；像衝破第四面牆要你正視呼籲。


  雖然導演吶喊著殘酷的質問，但她終究沒有忘記希望的力量。尾聲，哈瑪握著沙發上打盹的

  母親的手，血脈再次緊密相連。導演在整部片最明顯的音效設計就是女性口腔音，前段出現

  的是呼叫吟息或殘喘，意義不太明確；最後再次使用凸顯了母女二人交疊相通的呼吸聲，母

  性的傳承始終飽富正向希望的力量。


  --'
