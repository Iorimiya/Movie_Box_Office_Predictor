title: '[好雷] 如「和」能「解」：《聖奧梅爾殺嬰案》'
content: "本文涉及劇情，且具個人觀點，推薦觀影後再讀。\n\n\n　　　　本片已上映第二週，有意者請把握本週時間。\n\n\n　　　　圖文網頁版：\n\n\
  　　　　\n\n\n　　　　預告片：\n\n　　　　\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n如「和」能「解」：《聖奧梅爾殺嬰案》\n\n\n\n　　如果人生是四通八達的道路，女性自出生的選擇往往就比男性少，成長\n\n過程至成年更會被周遭逐漸限縮，如果再加上種族歧視、移民身份、菁英主\n\
  \n義的限制，不知不覺，就會被逼到窄巷，關進不見天日。\n\n\n\n　　電影《聖奧梅爾殺嬰案》改編自法國2013年發生的「法比安娜・卡布殺\n\n嬰事件」，敘述來自塞爾維亞的法國移民蘿倫斯・柯利（葛絲拉基・梅蘭達\n\
  \n飾）被控告殺死女兒：她將自己十五個月大的女兒艾莉絲放在法國北方城鎮\n\n聖奧梅爾（Saint Omer）海灘上，讓漲潮帶走她的生命。已孕的文學教授與\n\n\
  小說家哈瑪（凱伊傑・卡加梅飾）為了改寫希臘神話的新作《美狄亞邊緣人》，\n\n也因與蘿倫斯的身份背景相近，便前去旁聽她的審判。\n\n\n\n　　我們面對刑案加害人，往往先訴諸「善惡」的審判，更進一步則是了解\n\
  \n「動機」，但善惡由何而生？動機如何判斷？電影片頭，哈瑪在課堂介紹美\n\n國女作家莒哈絲在創作《廣島之戀》「如何敘事昇華現實」時，提到「汙名\n\n會存在記憶」，更強調「女性是恥辱的客體」，以此為前提，女性還未落筆\n\
  \n就已是罪惡的化身，除非在寫作者有意識的書寫下「備受恩寵」。這正是這\n\n部電影試圖呈顯的方式──讓我們看見一個接近真實的女人。過去拍攝紀錄\n\n片的導演愛麗絲・迪歐普曾在訪談中提到：「不可能回到那個審判現場，所\n\
  \n以不可能拍成紀錄片，只能用這些素材來編造一個虛構電影。」電影中所有\n\n演員的法庭臺詞是真實的庭審記錄，在拍攝現場，也請來了聖奧梅爾居民參\n\n與演出，飾演旁聽民眾，是一種「紀錄劇場」的形式。導演在「紀錄片」與\n\
  \n「電影」之間的灰色地帶相會，為的不是窺視或展演，既無意為蘿倫斯柯利\n\n脫罪，更無意審判她，而是呈現她的人生，她複雜的內在，讓觀眾在這種游\n\n離中，「看見」蘿倫斯柯利從不可知的透明而至認識，再從認識而意識到女\n\
  \n性的不透明性。\n\n\n\n　　蘿倫斯柯利是塞內加爾移民，塞內加爾位於西非，自1864年成為法國殖\n\n民地，二戰後的1960年 6月20日才正式獨立，其中主要民族為沃洛夫族占了\n\
  \n全國人口的 40%，但其官方語言為法語。蘿倫斯從小父親不許她說母親的沃\n\n洛夫語，母親更嚴格要求她能說一口流利優雅法語──每個人生來就得面對\n\n一個既有的語言世界，無論種族或性別，蘿倫斯所擁有的都不屬於自己；而\n\
  \n相較於語言的慣性與滑溜，得以留駐、經由思想而生的文字更需要嚴格的自\n\n我審視，因而她的哲學教授說她善於言辭卻寫作凌亂，嘲笑蘿倫斯想要研究\n\n德國語言學家路德維希‧維根斯坦，而不是「來自她自己文化的人」──這\n\
  \n是移民者的困境，要融入當地，就必須捨棄一部分的自己才能躋身文化系統，\n\n再被評判「那不是你」。蘿倫斯自小沒有朋友，不擅交際，成績優異愛好文\n\n學，父母離異後由父親供她上學，但當她拒絕法律選擇哲學時被斷了金援，\n\
  \n只能選擇保母換宿維持生活，跟房東文森太太與堂姐均無法相處，此時２４\n\n歲的她，成為５７歲呂克先生的外遇對象，被他藏在工作室裡直至懷孕，呂\n\n克先生絲毫不想負責，發現時已無法處理，還懷疑不是自己的孩子，蘿倫斯\n\
  \n回答「別擔心，她是我的」並只能生下女兒，為了照顧她，整整六個月沒有\n\n出門，孩子長水痘卻沒有看醫生，付出龐大犧牲的同時，「父親」卻能置之\n\n不理，在法庭上更一味只談自己，毫不在乎她的憂傷。\n\
  \n\n\n　　逐漸走投無路的人生，外在矛盾致使內在世界崩塌，她的失敗無法解釋，\n\n因而法庭上男性檢察官的鞭笞均針對她的「不完美」質疑她的動機邪惡，這\n\n\
  樣的批判如此熟悉且毫不意外，若在台灣，想必亦是絕大部分男性對她的審\n\n判。她在法庭透露曾向靈媒求助，聲稱自己被巫術掌控，後發現極可能是負\n\n責調查的預審法官訊問時誘導蘿倫斯作此解釋，既呈現了她的孤立無援，亦\n\
  \n如哈瑪創作《美狄亞邊緣人》被認為題目太平凡、「美狄亞」少為人知難得\n\n讀者青睞般，女性的真實聲音與思想總是缺乏理解的管道，若非蒙上費解的\n\n色彩以便貶斥，就是受到重重阻撓。\n\
  \n\n\n　　這部電影除了移民、女性處境，還有母女關係的複雜苦楚。蘿倫斯和哈\n\n瑪皆與母親不睦，前者的母親奧黛爾（Salimata Kamate 飾演）待她嚴格，\n\
  \n要求她的姿態教養，為了不讓她遭到輕視，以致關係緊張；蘿倫斯懷孕，每\n\n月一次與母親通話，能一眼看出哈瑪有孕的奧黛爾，懵然不知她生下女兒。\n\n哈瑪得到母親厭女的愛，生活與懷鄉的疼痛和愛一起給予女兒，對女兒的嫌\n\
  \n也是對自己的嫌。母親怕女兒步上自己的後塵而日夜工作，女兒更怕複製、\n\n同時必須加倍壓抑因其而生的疼與愛，原該最為相似與理解的母女，造就了\n\n彼此無法親近的距離。\n\
  \n\n\n　　蘿倫斯仰慕的哲學家維根斯坦曾言：「對於不能談論的東西，我們必須\n\n保持沉默。」虛構的角色哈瑪，正與蘿倫斯的充滿話語相反，影中幾乎保持\n\n\
  緘默，感知卻幾乎與蘿倫斯同步，一如女性觀眾的我──看女性電影的好處\n\n是，沉默是終於能專注於女性的處境與感受，不若其他不是邊緣就是異化，\n\n然後被逼消音；但女性的苦痛平日迴避淡化的，也會在此刻凝聚起來直接撞\n\
  \n擊，就像蘿倫斯最後面向攝影機，似是給予哈瑪，但更是給予觀眾的微笑，\n\n當時的我心頭一震，彷彿被問著：你懂得了什麼？觀眾感受的未及當事人的\n\n十分之一，蘿倫斯一次次的「我不知道」既是對自身行動與意識的身不由己，\n\
  \n也是生活加諸給她的、無法擺脫的痛楚與孤獨，使她無人可訴，只能逃避進\n\n幻覺與巫術，一如最後她的律師所言，她想隱藏的不是女兒，而是自己。\n\n\n\n\
  　　電影的最後，蘿倫斯的辯護律師分享了這麼一段故事：蘿倫斯曾經夢見\n\n未能活過兩歲的女兒艾莉絲，與她同在監獄當中。這樣的夢從何而來？律師\n\n從科學解釋母親懷孕期間，ＤＮＡ與細胞會與胎兒互相轉移，並存留印記伴\n\
  \n隨一生，這些細胞被稱為奇美拉細胞：\n\n\n\n　　「奇美拉是一種古希臘的異種怪獸，擁有獅頭與羊身。我們女人都是奇\n\n美拉，我們的身上有母親也有女兒的痕跡……我們女人某種程度上是怪獸，\n\
  \n是有人性的怪獸。」\n\n\n\n至此，殺嬰的、被妖魔化的母親還回人形、獸形，這番話使始終處於防禦的\n\n蘿倫斯初次哭倒在律師懷中，也使我們看到更接近真實的、女性猶如困獸之\n\
  \n鬥的處境：除了母女相互交織的科學事實，女兒往往害怕自己成為另一個母\n\n親，更怕女兒成為另一個自己。來不及和母親、也與自己和解的蘿倫斯，最\n\n終只能與女兒在夢裡相伴；但即將成為母親的哈瑪，試著親近原本疏遠的母\n\
  \n親，片末三種融合的呼吸，伏在母親膝上撫著肚子的她，還有機會得到母親\n\n少一點憎惡的愛，和成為一個少一點懼怕的母親。\n\n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n\
  我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\n                                  陳斐雯  貓蚤札（其三）\n\
  \n--"
