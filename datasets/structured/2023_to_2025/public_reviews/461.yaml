url: https://www.ptt.cc/bbs/movie/M.1742804334.A.7D0.html
title: '[好雷] 【Queer】這種美，是醍醐灌頂的享受'
content: '‧


  【Queer】無疑是對我這種擁有對A24極高信仰的觀眾，給予一種醍醐灌頂的享受，充滿美

  學質感的每一幀，實在無法用像串流平台小編的“倍速玩笑”來觀看，放慢的速度，才能

  真正完美呈現【Queer】所帶來的美感。


  但這並不是部容易觀看的作品，也可以說稍微有一點觀影門檻，眾多符號及突兀怪誕獵奇

  隱喻，必須在腦中消化許久才會恍然大悟，但只要你對A24作品有一定程度的認識，我想

  基本理解應該不會有什麼太大問題。



  ‧


  符號是【Queer】的核心概念之一，從主角「李」開頭對大衛之星項鍊的揶揄，巧妙批判

  著猶太正統教派對於同性的禁止，或是城鎮上的鬥雞，正是為李做為全劇最好的角色註解

  ，李擁有鬥雞的強烈性格，他急於找尋能夠與自己均衡互鬥的對手，但無奈只能找到掛有

  蜈蚣象徵的男子，短暫用雞嘴吸允飽食，而蜈蚣在中世紀象徵著危險、黑暗、連結及恐懼

  ；更是不潔淨之物，正好恰恰說明了在早年社會對同性戀者的刻板印象。


  當遇見尤金時，首次對話時的畫面符號相當特別，寬闊的街道上，數隻狗不斷在路上嗅聞

  味道，更如同尤金對李一樣，尤金擁有著李無法抗拒的味道，李像隻發情的公狗般的不斷

  緊黏，甚至在腦海中幻象意淫了千百回，但李知道，尤金是他夢寐以求的對手，是最有可

  能深入他內心的酷兒，但卻可能不會有愛情的成份；當他們第一次進行吸允時，可以看到

  李的小心翼翼，他瘋狂迷戀尤金每一寸肌膚、每一刻味道及每一絲毛髮。


  縱如鬥雞或發情野狗的李，我們可以從他不離身的「左輪手槍」及夢境小刀看出，李也許

  因為戰爭或其他原因，讓他有著對內心的緊張或生活中的恐懼，導致他孤獨感傍身；所以

  他不斷以毒品安定內心，也企圖以奇特植物「亞赫」來深入與尤金的心靈交流，因為尤金

  是他唯一讓他感到安心、在意、極度渴求的人。


  當李昏倒時，看到了同在這座城鎮的人們，他們都是無法跳脫出眾人給予同性戀的印象牢

  籠，而幾位穿著囚服的角色，更像是在控訴納粹對於當時同性戀者的迫害，也拉回開頭的

  大衛之星項鍊。


  乃至到最後，就算被百般警告不要接觸「亞赫」，李也不為所動；因為它可以是一面心靈

  鏡，卻也可以是面照妖鏡，照出血淋淋的內心醜陋或美麗；等開啟了心靈之門，雖然尤金

  並非李所想像那樣，當他看到逐漸淡化的彼此，尤金承認他並非酷兒，但他消逝的身軀，

  就像一個空洞的靈魂，縱使他愛上了李，不過對於自己的身分認同依然是非常飄渺不定，

  但他們依然享受彼此體溫靈魂上的交換，如同李在重病時，感受到互相交足般的溫暖。



  ‧


  而李最後的再一次觀看自己的內心，那是一棟大樓，屬於尤金房間裡有條銜尾蛇，那是象

  徵著一種自我內心吞食後的循環體現，不斷死亡又不斷再生，銜尾蛇所帶來的，是李要擺

  脫對尤金愛戀或是寄託，再一次將自己重生，即便傷心落淚。


  當尤金頂著杯子，彷彿要李射殺的動作，在劇情前段也有這樣的場景，這邊是講述原著作

  者威廉柏洛茲在墨西哥城，因酒醉不愼誤殺了妻子的事件，這個事跡在往後的威廉柏洛茲

  的作品中，都曾經出現過，如裸體午餐等等，【Queer】中的一些小梗，如打字機、蜈蚣

  等等，都有在威廉柏洛茲中出現過，等他射殺後，然後依依不捨的撫摸尤金美麗的臉龐，

  但終究人事已非。


  時光苒苒，當老年的李再出現在那個房間時，他依然無法忘掉那與尤金相擁在床上的時光

  ，那四腳交足的體感，是他安定內心的最大依靠，李重生了嗎？可能有，也可能沒有，但

  他依舊在享受屬於他與尤金之間的disembodied，脫離現實的心靈契合。



  ‧


  【Queer】是一部非常美的電影，美得怪誕、美得強烈，甚至美到醜陋，也充滿了原著威

  廉柏洛茲中的各項符號，德魯史塔基與丹尼爾克雷格，將這一對酷兒冰與熱，完美的演繹

  呈現，如同劇中的冰火冰淇淋，或是銜尾蛇的一紅一白、一陽一陰，只能用超越美學的質

  感演出來形容。

  但的確不是部容易觀賞的電影作品，許多充滿獵奇成份的橋段，雖不是A24有史以來之最

  ，但其深度與寓意並不是能夠輕易了解，不過還是推薦給A24的信徒及對此類題材有興趣

  的觀眾們。



  本片已於全台上映中。


  ‧




  追蹤茶太郎IG



  --'
