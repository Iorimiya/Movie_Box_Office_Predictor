title: '[普雷]《Queer》：老少男同志的中門對狙'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n《Queer》有雷影評：老少男同志的中門對狙\n\
  \n■「你不是酷兒。」Queer不提的那個字。\n\n到底什麼是酷兒？到處釣男人的李在開場就下了註解：把酒言歡、每個配合的眼神與微笑\n，都只為共度春宵。\n\n\
  享受當下、釋放慾望，電影建立了論調基礎：Queer的認同，建立在身體歡愉，彼此不言\n說的默契。\n\n電影通篇未提到「愛」這個字，一切情感建築在慾望的紅大門內。那都是渣男遇見真愛（\n\
  高手）前的說詞。\n\n■ 渣男、海王的公然對賭\n\n李在看見尤金的第一眼，就愛上他了（這裡演得極好）。你可以看到他們瞳孔裡的化學反\n應。\n\n聊天、回家、上床，一切流程無異於李和其他年輕男孩的故事，只是前奏拉的比較長。\n\
  \n感情的勝負總在事後的餘韻。當李感受到尤金的疏離和冷漠，開始有被拋棄感、不安，甚\n至以舔狗之姿苦苦追尋和付出。觀眾馬上明白，這場渣男海王的對決中，付出真心的李已\n\
  經徹底輸了。\n\n這裡是非常脆弱又真實的一幕。旁人對於李赤裸展現的迷戀與崇拜，展現出鄙夷，因為這\n打破了長久以來的潛規則，卻也是李首次打破自己的框架，想全身心的投入一段關係。\n\
  \n在此電影畫風突變。為了達到身心合一，他們展開啟靈聖水之旅（還為此去看dodoman那\n集）。主角李暈船暈到，想要靠死藤水的幫助，與尤金建立更深層的連結。\n\
  \n\n\n\n\n從忽冷忽熱中抓取蛛絲馬跡、放大解讀苦樂中值得回味的區塊。一場不對等的賭局，是李\n吞下最大的敗仗，最難忘的愛戀回憶。\n\n■ 結語\n\n\
  情慾、旅遊、迷幻，《Queer》三個願望一次滿足。\n\n\n\n\n至於尤金到底愛不愛李？他是酷兒嗎？自我掙扎下該如何去愛？可以去愛嗎？\n（尤金有給出他的答案：他享受跟李交歡的過程，但自我認同不是酷兒，這樣可能算異男\n\
  忘？我想尤金還在自我定位的路上。）\n\n只要李能這樣想就好了，就夠了。\n\n網頁好讀版：\n\n-\nIG：Fishpond_like \n臉書：魚池 FishPond\
  \ \n個人網站：\n\n--\n                             03/24 20:46\n有些關係一言難盡，事後咀嚼韻味無窮\n（本人不希望再遇到哈哈哈哈哈哈\n\
  1 善於調情挑撥曖昧勾搭\n2 不習慣、沒有習慣確認關係（以及處理後續的溝通）\n\n邏輯上沒有承諾，也就沒有背叛\n當然有很多不得已，包含自我定位混亂、承諾困難、習慣獨身不敢離開舒適圈......很多\n\
  可能\n這也是聰明人會利用的模糊空間\n\n這段關係中李和尤金的不對等非常明顯（在發生關係後到出國之後的一些互動）\n你可以說「敢玩就要玩得起」，李自願簽訂了不平等的條約\n\
  但我自己很難說出「一個願打一個願挨」這樣的話（可能我比較代入李的角色）\n\n跳到對方角度，尤金在認知自己不是酷兒的時候，離開了李，也許已經做得夠好了。\n\n\
  當發現一方已經付出超過的情感，雙方能否察覺、觀察自己的付出是否超出負荷，以及開\n啟必要對話的勇氣？\n\n在模糊關係裡，還在探索、還沒愛上的那方，都要小心利用了他人的感情，以及背上這樣\n\
  的罪名（這邊最容易有認定不一致，如同我與lucy8722的想法完全不同，因為關係沒有定\n義）。\n\n看愛情電影，也是讓自己理解更多種不同的關係樣態跟愛情觀（嘗試中\n\
  \n我講靠北一點：\n炮友 暈船 被開發的年輕小gay，甘心花錢帶他旅行環遊世界\n對方已經暈到（已經發展到）帶他去喝啓靈聖水，付出許多金錢與時間\n小gay最後發現無法過自己那關，狠狠斷開"
