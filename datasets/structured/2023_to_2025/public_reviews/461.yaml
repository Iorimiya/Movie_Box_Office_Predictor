url: https://www.ptt.cc/bbs/movie/M.1742577850.A.A98.html
title: '[普雷] QUEER 看完滿頭問號 '
content: '《QUEER》是2024年上映的歷史浪漫劇情片，由美國和義大利合拍，義大利導演盧卡·格

  達戈尼諾執導，賈斯汀·庫里茨克斯編劇，改編自美國作家威廉·柏洛茲1985年出版的同

  名小說。故事發生在1940年代的墨西哥城，一名居無定所的美國僑民迷上一位年輕男子。





  前半部免強看得懂

  後半部 我看了甚麼

  不是單純愛情片



  A24作品太藝術

  完全無法理解

  一些日常生活瑣事

  例如走在路上 吃飯

  好幾次突然出現恐怖陰森背景音樂

  結果甚麼事都沒發生




  兩個帥裸男在叢林裡交纏跳八方雲集看不懂的現代舞




  有條蛇蛇吃自己尾巴呈現∞

  邊吃邊哭??



  還有一些詭異片段



  兩個男主的感情戲也曖昧不明

  李明確迷戀尤金

  尤金卻對金有好感 但有時又超冷漠 有可有無

  床戲時又算蠻主動 享受

  不知道是不是片中說的

  只是一個慾望的個體

  有被滿足就好 是誰都無所謂



  目前還沒看到甚麼評論

  不知道有沒有專業大大整部完整解說


  --'
