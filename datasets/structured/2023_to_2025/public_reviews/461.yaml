url: https://www.ptt.cc/bbs/movie/M.1745374519.A.4B9.html
title: '[好雷] QUEER'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看《秘密會議》的那場被《QUEER》的預告片燒到，看到它是Luca的新片，就挺想要進電

  影院一探。中間家中發生不少事，拖著拖著，總覺得大概看不到時，查了場次竟然還有。

  總之是看到了，在買票時都還沒辦法正確唸出ＱＵＥＥＲ，好在櫃台人員已經見識過太多

  ，平安進場。

  在看前就已經略知《QUEER》評價偏向兩極，最初一兩天大概是目標觀眾去看，洗了一波

  超好評在我版上，後來陸續浮上的評價有好有壞，也有人拿Luca幾部名片來類比，總之絕

  非《以你的名字呼喚我》那樣浪漫的電影。好奇但不期待的心情入場，是非常正確的選擇

  。


  Luca的男色真的是拍到一個極了，但這片最令人佩服的還是把Lee拍得又怪又老，那飢渴

  的樣子對比於Drew Starke演出的年輕男子，可以說是完全刺進觀眾的心裡。讓人重親看

  清Daniel Craig實力。


  可以感受到Luca試圖讓視覺和聽覺完全貼合到角色身上，進電影院可以看得非常仔細。個

  人最喜歡到叢林找死藤水的第三段，一直在想要如何表現，結果令我非常驚豔。總覺得前

  前後後都為這段而存在。


  看完回程細細思考這部片，心裡隱隱覺得它算是一部歷史電影。發生在電影中的那種心理

  ，大概已經很不一樣，但去深描細寫那時代的細節，說不定比直接地講述今日的同志文化

  ，更可以進到人自己都不知道的地方（也許就像是喝了死藤水一樣）。


  此外，無關於劇情主線，卻持續繞在我腦中的是：那年代的人願意冒的風險真的是我們今

  日無法想像的（無論是不安全性行為、鴉片及各種毒品、坐超爛飛機去到荒野叢林，當然

  還有死藤水），只要可以擺脫慾望的痛苦任何風險都值得。或者說在那歷史時空裡，生命

  重要性並沒有高過其他所有事。



  ***


  這裡是我的樂園:



  =


  --'
