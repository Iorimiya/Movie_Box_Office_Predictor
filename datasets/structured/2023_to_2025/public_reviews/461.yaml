title: '[新聞] 丹尼爾克雷格【QUEER】深情詮釋同志孤寂'
content: '新聞網址：



  《以你的名字呼喚我》（Call Me by Your Name）名導盧卡格達戈尼諾（Luca

  Guadagnino），改編《裸體午餐》（Naked Lunch）作家威廉布洛斯（William S.

  Burroughs）同名小說的最新動人愛情力作《QUEER》，即將在3月21日於台灣唯美獻映。

  本片主演丹尼爾克雷格（Daniel Craig）一直渴望能跟盧卡合作，因此在接獲本片邀約後

  ，絲毫不看題材便立刻點頭演出。她在片中完美演繹中年同志對愛情的渴望與孤獨，讓他

  榮獲奧斯卡獎季近30項最佳男主角獎提名，他更坦言：「這就是我一直在等待的角色！」

  此外，他也參與治裝過程，主動向擔任本片服裝設計，同時也是精品品牌「LOEWE」創意

  總監的強納森安德森（Jonathan Anderson）提議，要穿上「吊襪帶」重現原著作者布洛

  斯與情人的舊照。片中一場他跟飾演其情人的德魯史塔基（Drew Starkey）的關鍵舞蹈戲

  ，兩人耗時兩個月進行舞蹈與肢體訓練，初相識便穿上緊身衣在地上打滾，特別的經驗也

  讓丹尼爾印象深刻。值得一提的是，台灣發行商也將在3月14日推出「白色情人節特別場

  」，不僅能透過TITAN廳超高品質大銀幕中搶先觀賞片中唯美場面，更能帶走「台灣獨家

  限量QUEER電影厚磅帆布托特包」，請粉絲千萬別錯過這難得的觀影機會！





  名導盧卡格達戈尼諾的最新愛情力作《QUEER》，由《007》男星丹尼爾克雷格領銜主演。

  由於導演是丹尼爾的粉絲，因此在討論合適演出人選時，便提出希望能有機會與他合作。

  同樣地，丹尼爾也一直渴望能有機會跟盧卡合作，因此他絲毫不在意會是什麼樣的題材，

  一收到演出邀約便立即答應演出，並表示：「吸引我加入這個項目，最簡單的答案就是盧

  卡。我從過去幾年開始，每部他的電影，上映後我都會虔誠地觀賞，並對他每部作品的獨

  特性，與他不斷挑戰電影界『可接受範圍』的做法感到深深震撼。」



  丹尼爾在片中演繹愛上年輕男子的50歲美國移民，深情演繹對渴望之人的迷戀，細膩詮釋

  角色尋找愛情過程中的苦痛、脆弱、孤獨，精湛演技讓他榮獲奧斯卡獎季近30項最佳男主

  角獎提名，而他也坦言：「這就是我一直在等待的角色！能夠在我的職業生涯中做到我所

  做的一切，然後在這個階段接到這樣的角色，真是一種難以置信的榮幸。在這部電影裡，

  我幾乎把所有面向都展現了出來。對我來說，能演繹這樣的角色，就是讓人每天起床的理

  由。」





  《QUEER》也請來精品品牌「LOEWE」創意總監強納森安德森，擔綱本片服裝設計，從西裝

  到內著都充滿設計感與細節。丹尼爾克雷格在治裝過程中，也主動向強納森提議想穿上「

  吊襪帶」，來重現原著作者布洛斯與情人的過往畫面，丹尼爾分享：「強納森本來不確定

  我會不會願意穿那種內裡，但『吊襪帶』是我自己提議的。有一些非常美的舊照片，拍的

  是布洛斯和他情人躺在床上，穿著這種內裡，襪子上扣著吊帶，我有點想要重現那個畫面

  。」片中更有一場他與情人關鍵又親密的舞蹈戲，為此他與飾演情人的德魯史塔基，耗時

  兩個月時間進行舞蹈與肢體訓練，來培養身體與情感的化學反應。尤其兩人初相識，便穿

  著緊身衣在地板上打滾，也讓丹尼爾笑道：「這就是我和德魯的第一次見面：進入一個房

  間，脫掉衣服只穿緊身衣，開始在地板上滾來滾去！這通常會打破僵局。我們當時就開始

  笑了，一直笑到拍完為止！」



  值得一提的是，台灣發行商也搶在上映前，於3月14日搶先舉辦「白色情人節特別場」不

  僅能在松仁威秀影城的TITAN廳，用超高品質的大銀幕欣賞導演創造的唯美畫面，本場更

  能帶走「台灣獨家限量QUEER電影厚磅帆布托特包」乙個。活動現正熱售中，購買詳情請

  見


  ，請粉絲千萬別錯過這難得的觀影機會！



  這部由「金獎製造機」A24唯美打造，探索人性與孤獨，追尋愛慾與渴望的年度動人愛情

  力作《QUEER》，即將在3月21日於台灣唯美獻映！本片劇情描述1950年代的墨西哥，年近

  50歲的美國移民威廉李（丹尼爾克雷格飾演），居住在當地的美國小社區當中，除了與幾

  位美國友人聊天喝酒，他日復一日地在孤獨的陰影中度過。儘管內心燃燒著對愛情的渴望

  ，卻始終無法觸及那份深刻的情感。某天，他邂逅了年輕俊美、剛到墨西哥的尤金阿勒頓

  （德魯史塔基飾演），讓他的內心宛如一顆石子拋進平靜的湖面，激起一圈圈未曾預料到

  的漣漪。隨著兩人的關係逐漸發展，威廉的內心世界被深深觸動，並在孤獨與渴望的交織

  之下，讓他開始面對一段無法預測的愛情旅程。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
