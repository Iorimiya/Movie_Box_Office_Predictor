url: https://www.ptt.cc/bbs/movie/M.1742393847.A.720.html
title: '[新聞] 俊美男神【QUEER】裸裎相見丹尼爾克雷格'
content: '新聞網址：



  改編知名作家威廉布洛斯（William S. Burroughs）半自傳小說，由《以你的名字呼喚我

  》（Call Me by Your Name）名導盧卡格達戈尼諾（Luca Guadagnino）執導的最新動人

  愛情力作《QUEER》，即將在本週五（3/21）於台灣唯美獻映。據悉，導演在挑選男主角

  的鮮肉愛人時，從朋友手中收到俊美碧眼男星德魯史塔基（Drew Starkey）的影片，立即

  被他的男神魅力所打動，即使看了300位演員的試鏡片段，德魯俊美的臉龐依然在他腦中

  不斷盤旋，始終念念不忘，讓他進一步徵得男主角丹尼爾克雷格（Daniel Craig）同意，

  正式向他遞出演出邀請。為了忠於布洛斯愛人路易斯馬克（Lewis Marker）的模樣，德魯

  也狂減13公斤，一度瘦到被導演要求必須增胖，前後更嘗試換戴40副眼鏡，才定下最合適

  的造型。值得一提的是，本片描繪愛慾與渴望，德魯更在片中與丹尼爾克雷格大搞基情，

  並上演激烈性愛場面，兩人在開拍前培養絕佳默契，讓他坦言：「我們對彼此的身體感到

  很自在，對裸露場面完全不避諱！」大膽的演出更讓德魯因為本片帥翻全球觀眾，成功晉

  升好萊塢新生代男神。




  譜寫刻骨銘心情感糾葛的《QUEER》，由義大利名導盧卡格達戈尼諾執導。當本片確定由

  丹尼爾克雷格領銜主演之後，劇組便著手進行飾演他同志愛人的演員選角。過程當中，導

  演從朋友手中收到因為演出《外灘探秘》（Outer Banks）而人氣大漲的德魯史塔基，他

  為其他作品錄製的試鏡影片，立即被他的魅力打動，並分享：「我立刻把這段影片拿給丹

  尼爾看，他也完全認同我的想法。我們看了上百段其他演員的試鏡影片，當我們看到大約

  300段時，我們便決定：『不必再看了，德魯就是我們要找的那個人。』」而德魯對角色

  從內心到外在極其細膩的詮釋，更讓導演大讚：「德魯是我職業生涯中的另一個精彩時刻

  ！」



  本片改編自知名作家威廉布洛斯的半自傳小說，並忠於他的精神，呈現他與同志愛人無拘

  無束的愛戀經歷，尤其為了呈現出布洛斯愛人「路易斯馬克」的模樣，德魯花費大量時間

  與導演討論外貌與舉止，更在四個月內狂減13公斤，他對此分享：「有關路易斯馬克的照

  片不多，而這個角色就是以他為原型，但他非常瘦。那個時代的人，身形通常不會很健壯

  ，讓我花費大約四個月時間，減掉約 13公斤。」不過他卻因為瘦過頭，而被導演要求必

  須增胖。此外，他前後更嘗試換戴40副眼鏡，以呈現出最合適的角色造型。





  值得一提的是，丹尼爾克雷格與德魯史塔基在《QUEER》當中有激烈的性愛場面，讓導演

  盧卡格達戈尼諾特意將這些場面抽出來討論，德魯表示：「他讓我們能夠以獨立方式去理

  解、去適應這些場景，希望我們能夠對彼此感到自在。」大量的默契培養，也讓兩人在開

  拍前，就已經對彼此相當熟悉。面對大量裸露戲碼，他也絲毫沒有猶豫或不安，並坦言：

  「我們對彼此的身體感到很自在，對裸露場面完全不避諱！丹尼爾和我只是希望能夠呈現

  出真實感和自然性，就像兩個人在親密互動時發生的那樣，不需要額外修飾。」而他大膽

  又迷人的演出，也引發觀眾熱烈討論，更讓他以本片晉升好萊塢新生代男神，值得台灣觀

  眾進戲院，透過大銀幕親自體會他的魅力！



  台灣發行商也為本片推出台灣獨家「QUEER台灣獨家厚磅帆布托特包」，扎實布料與細緻

  縫線，影迷們千萬別錯過。商品現正熱售中，數量有限，敬請把握，購買詳情請見

  。



  這部由「金獎製造機」A24唯美打造，探索人性與孤獨，追尋愛慾與渴望的年度動人愛情

  力作《QUEER》，即將在本週五（3/21）於台灣唯美獻映！本片劇情描述1950年代的墨西

  哥，年近50歲的美國移民威廉李（丹尼爾克雷格飾演），居住在當地的美國小社區當中，

  除了與幾位美國友人聊天喝酒，他日復一日地在孤獨的陰影中度過。儘管內心燃燒著對愛

  情的渴望，卻始終無法觸及那份深刻的情感。某天，他邂逅了年輕俊美、剛到墨西哥的尤

  金阿勒頓（德魯史塔基飾演），讓他的內心宛如一顆石子拋進平靜的湖面，激起一圈圈未

  曾預料到的漣漪。隨著兩人的關係逐漸發展，威廉的內心世界被深深觸動，並在孤獨與渴

  望的交織之下，讓他開始面對一段無法預測的愛情旅程。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
