title: '[好雷] 日子'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~







  1~5分鐘看小康在浴缸裡不動 5~8分鐘聽雨聲畫面也沒動 第一次看蔡導很新奇


  後來慢慢看懂在拍甚麼 小康生了病去療養 然後遇到了個弟 後來兩人回到自己

  的日子


  原本是無法接受這個每一幕都停留很久 然後都不太知道在說甚麼 後來才發覺這

  些畫面如果只停留個10秒鐘 就無法顯現那個日子到底有多平常不過 而且每個畫

  面也都很美 拍攝主體明顯 構圖很讚 人的走動也很生活 真的不像是拍電影 就像

  是自己的日常


  那個音樂盒在那邊響了半天 本來覺得有點乾 但是這其實是重點 後來也就發覺在

  這部電影裡蔡導才是主體 小康就是很精準地把蔡導要傳達的表達出來 那個亞農

  也是一樣 不用很會演 蔡導教你怎麼拍就好了 絕對會是個好電影


  看完後到美術館聽蔡導說話 覺得只有一句話可說 大師的每句話都是大師 他的腦裡

  都是故事 信手拈來都讓人耳朵豎起想聽 舉例他說最後有一個獎盃要跟大家講 就是

  33年前他得的獎 是張國榮頒給他的 哇 這一幕就是個電影了


  又有一幕他說在香港反送中時 他去唱一首歌 哇他輕描淡寫的講 我在旁邊覺得那一

  幕應該是壯觀到不行 大師就是大師


  以下是現場拍的一些照片 第一次拜讀蔡導 深覺每個人都要看一部蔡明亮



  在一樓


  這張是亞農唱歌 大師聆聽



  大師站上白紙 就是大師


  這張再往左走一些就是張國榮給他的獎盃


  換個角度拍一張

  --'
