title: '[討論] 今天是螢火蟲之墓清太在車站掛的日子'
content: '昭和20年（1945年）9月21日深夜，神戶市三之宮站，15歲衣衫襤褸的清太被清潔員工發現坐在柱旁一角餓斃，


  這幾天才在網飛上重看這部片


  以前覺得這部片阿姨真的很貪心


  長大出社會才發現 阿姨就是這個社會的縮影


  不過也發現清太原來是心態崩潰的邊緣人


  妹妹在哥哥不在的時候餓肚子還會吃土


  小時候就是天真無邪


  長大就是鑽各種蠅頭小利


  世態炎涼 人心不古

  -----

  Sent from JPTT on my iPhone


