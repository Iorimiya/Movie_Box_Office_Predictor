title: '[極負雷] 真愛挑日子 (one day)'
content: '這部愛情片，當初是搜尋一下關於愛情的電影

  發現蠻多版友推薦的，於是就租來看一下


  恩~看到女主角是安海瑟威~手有抖一下，不過還是相信她再給他機會


  結果，恩，看完我龜覽趴火，也所以我花這麼多時間再打字發文


  1.請問一下哪裡有真愛??

  這部電影敘述男女主角難分難捨，彼此等待的戲碼

  乍看之下真的很專情很感人，是嗎?


  我唯一看懂男女主角認識，就是由大學畢業時

  男方跟女生約砲，然後女生也想要，就一起回房間

  結果呢~~因為一些事情耽擱了，男生跟女生出去散步

  散步到一半，男生還繼續約女生回他房間完成幹砲的行程


  我的天啊這是他媽什麼真愛阿??

  我根本沒看到半個情節是男女主角之間真誠的情愫阿

  從頭到尾都是約砲，不然就是煽情戲碼~乾~真愛殺小



  2.真愛無敵所以其他雜魚都是活該失戀??


  男主角有眾多女友，包含電視台認識的

  此外男主角娶了塞爾維，還生了一個小孩

  我他媽都一個孩子的爸了，心還在女主角那邊

  也難怪老婆要偷吃阿，最後離婚到底要怪誰啊


  另外女主角的相聲男友也真夠無辜的

  雖然演員長的不怎樣，但是請問他哪裡做錯了阿

  憨厚老實的陪女朋友，女主角心也不再他身上阿

  乾~~如果今天是湯姆克魯斯演相聲男友

  安海瑟威不被罵翻才怪，根本價值觀有問題


  3.男主角到底可憐在哪?

  男主角睡過的女人應該都可以組拉拉隊了

  還要塑造一個他很專情的樣子

  到底要騙誰阿....乾~

  想到他幹一火車女人最後孤單寡人

  我完全沒有替她難過的心情阿



  這部電影基本上就是一個約砲男吊到一個平凡女

  不知為何，也不知道他們到底情感有多深，有多少美麗回憶全都沒演

  只是一些約砲跟勾引劇情，阿女生相對比較保守，砲沒幹到然後一直聯絡

  然後過程中所有出現的雜魚，抱歉不是真愛，全都活該失戀滾


  最後女主角掛掉，我得說真的很突兀

  感覺就是狗血愛情劇會發生的事情

  劇情薄弱，情感膚淺，過度誇飾的情感起伏



  真沒想到這部片居然有這麼多版友推...

  完全失望了


  我知道一定會被嗆個人觀感差別，沒慧根體會不到感動點之類的

  於是我翻翻爛番茄評分跟評論，笑了~~~~不須爭這些



  感想::版上推薦的~~參考就好~~別期望太高


  --'
