url: https://www.ptt.cc/bbs/movie/M.1681842754.A.FBA.html
title: '[好雷] 還有愛的日子- 崩塌同時也是自由本身'
content: '深田晃司新片

  去年金馬以及12月悄悄上映過院線


  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~









  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  仔細想想那位亂入告別式的鬍渣大叔，分明就是刻意在電影中原本俊男美女的夫妻日常中

  讓人跌破眼鏡（或現在講什麼顛覆三觀）。



  相較著導演早期成名作《臨淵而慄》的裡帥氣的淺野忠信，如此「理想」當然的出軌，好

  比是之前新聞上有一位街友很有型被時尚雜誌拍到的那種特例，絕對不會是《還有愛的日

  子》那位不知道哪裡冒出來的中年邋遢大叔，還竟然是美麗女主角的前夫（同時還是死去

  小孩的親生父親），如此驚人「反差」，就如同電影之外我們在街頭上看到真正的流浪漢

  ，像是可以「親歷」著看似生活的崩壞。



  深田晃司入圍去年威尼斯競賽片《還有愛的日子》持續描述日本家庭關係的暗潮洶湧，說

  起來以往只是擅長女性的心思與解放位置，並不太處理整個家庭關係的深田晃司，這次則

  是帶點是枝裕和式描述著夫妻和前任的糾葛與遺留下來的繼親之間的關係。



  以及活脫是濱口竜介《睡著也好醒來也罷》的深田晃司版本。不那麼幸福的說，那是同樣

  是潛伏日常突然冒湧的意外，像是找到身為人的意義，同樣是追求自由的女主角忽然地與

  流浪漢前夫「私奔」到韓國，丈夫是地方政府社會局的主管，看出來是十分安穩的「好人

  」，甚至因為「抓包」老婆跟前夫在陽台玩遊戲也只能看起來很生氣，因為他知道妻子是

  因為前夫突然去自由飛翔了，她當時找不到前夫才有機會跟身為社工的老婆在一起（外遇

  ），如此與《睡著也好醒來也罷》如出一轍，而《還有愛的日子》還補充了更多社會現實

  面的線索。



  不那麼幸福的說，《還有愛的日子》還讓人想到《東京奏鳴曲》爸爸失業還假裝去上班並

  且跟著遊民排隊吃免費食物。如同電影前段在小孩因為在浴缸玩水意外身亡，死者為大，

  眾人不敢責怪女主角忘記清洗的浴室（沒把水放掉），卻變成了必須前往公婆住處（隔壁

  大樓）洗澡的心理陰影。只有前夫在亂入葬禮看似白目地賞了她大一巴掌，卻讓女主角得

  以解脫，崩塌同時也是自由本身。




  --


  拉特飯 - 以商業力量進入獨立市場


  --'
