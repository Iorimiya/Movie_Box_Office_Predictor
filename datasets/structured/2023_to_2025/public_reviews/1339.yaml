url: https://www.ptt.cc/bbs/movie/M.1580303645.A.B38.html
title: '[新聞] 台片發光！蔡明亮《日子》入圍柏林影展'
content: "台片發光！蔡明亮《日子》入圍柏林影展\n\n2020/01/29 20:45\n\n〔記者吳琬婷／台北報導〕第70屆柏林影展將於下月20日舉行，\n\
  今（29）公布主競賽入圍名單，導演蔡明亮以劇情長片新作《日子》3度入圍，\n成為本屆唯一入圍的華語片，也是台灣電影暌違15年後再度征戰金熊獎，\n上一次台片入圍主競賽是蔡明亮的《天邊一朵雲》，\n\
  更一舉奪下最佳藝術貢獻銀熊獎殊榮。\n\n\n導演蔡明亮（右）以《日子》再度征戰柏林影展，左為演員亞儂弘尚希。\n（汯  霖電影提供）\n\n柏林影展藝術總監卡洛夏堤安在入圍公布記者會上表示：\n\
  「蔡明亮憑著一部又一部的作品，以其獨特的美學，展現並創造電影獨有的特質；\n在虛擬實境（VR）與其他形式的挑戰及實驗後，蔡明亮帶來了一部，正如片名所揭示，\n\
  極為純粹的作品《日子》。我會稱它是一部關於『痛苦』與『安慰』的電影。」\n\n蔡明亮首部作品《青少年哪吒》就入選柏林影展觀摩單元，\n第三部作品《河流》得了評審團大獎，最受爭議的《天邊一朵雲》更拿下銀熊獎。\n\
  這次再度出征柏林影展，蔡明亮開心表示：「有人問我會不會擔心《日子》沒獎？\n不會，我年紀大了，心境自然改變，能保持每一部片都入圍大影展的競賽記錄己經不易，\n\
  非常開心了，獎不獎，聽天由命。」\n\n\n《日子》由李康生主演。（汯  霖電影提供）\n\n蔡明亮的《日子》由老搭檔李康生和在泰國街頭發掘的新秀亞儂弘尚希主演，蔡明亮說：\n\
  「我總以為自己一生能拍10部劇情片就滿足了，《日子》是我的笫11部，\n這是上天給我的禮物，因為小康生病，我們沒法拍別的，\n我跟他說：『拍你的病吧，等你好了演也演不出來。』沒有計畫、沒有構想、沒有劇本，\n\
  斷斷續續拍了4年，拍來做什麼？當時也不知道。後來在曼谷遇見了一位寮國朋友亞儂，\n透過視訊，見他在簡陋的房子煮他的家鄉菜，我又忍不住飛去拍他。」\n\n蔡明亮接著說：「這大概就是因為，早已厭倦所謂的電影工業製片模式，\n\
  講故事啦、談預算啦、大隊人馬啦、市埸啦，我走的是另一條路，別人電影越拍越大，\n我卻越拍越小，越小越自由，想拍什麼就拍什麼，想怎麼拍就怎麼拍；\n我現在拍的都是生活，是小康的日子、亞儂的日子，也是我的日子。」\n\
  \n蔡明亮於2013年《郊遊》奪下威尼斯評審大獎之後，\n便宣告不再拍攝只為了商業服務的院線電影，近年提出「手工電影」、\n「美術館院線」及「作者的觀看方式」等創作與展演理念，遊走美術館與電影院之間，\n\
  透過裝置展覽、行動藝術、快閃賣票及街頭演唱等方式，開拓自己的觀眾與市場。\n\n本屆柏林影展將於2月20日至3月1日舉辦，導演蔡明亮與兩位主角李康生與亞儂弘尚希，\n\
  將於2月23日抵達當地，並出席27日的世界首映。\n\n--\n、。帝釋所問經講記77頁拆穿佛法的。\n《毗婆舍那講記(含法的醫療)》開示如何修四念處增加智慧斷除所有煩惱。\n\
  《正念禪修方法(毗婆舍那實修教學)》簡短說明如何修四念處禪法。\n才是 是菩薩成佛之道\n、、、、()、、是佛經。\n  是佛          是菩薩\n\n\
  --"
