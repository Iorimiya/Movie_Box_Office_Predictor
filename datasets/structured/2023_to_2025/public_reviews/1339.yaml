title: '[活動] godgod777-到未來日子（英雄本色2）'
content: "ＩＤ：  godgod777\n連結： \n歌名：到未來日子（國語版）\n出自電影： 英雄本色2\n心得:\n這首粵語版歌名叫「奔向未來的日子」\n\
  而國語版歌名改成「到未來日子」\n\n這首台灣ktv國語粵語都沒有，所以唱不到\nktv裡面唱不到的歌就是我最愛唱的歌，物以稀為貴\n\n像陳嘉上的聊齋畫皮張靚穎唱的主題曲畫心也是唱不到\n\
  還有楊丞琳演的刺青，他唱的主題曲ktv一樣唱不到\n就連英雄本色第一集的主題曲當年情曾經都只有粵語版\n還好王治平讓她女兒再把國語版唱出來送上ktv讓大家唱\n\
  \n希望能有第二個歌手能把國語版的到未來日子也唱出來\n然後再ktv也能唱得到，然後要放英雄本色1&2的電影當mv才好\nKtv找張耀揚詮釋華人西部片酒館一整個很怪的當年情的感覺\n\
  還是張國榮唱的最好，就算找楊宗緯或蕭敬騰也唱不出那種味道\n\n歌詞：\n\n到未來日子（國語版）\n\n作詞：黃霑\n作曲：顧嘉煇\n編曲：顧嘉煇\n原唱：張國榮\n\
  \n別問我今天的事　不必知也別問意義\n有意義　沒意義　怎麼來判　不想　不記　不知\n\n＊別問我一生的事　不必提失去的往事\n有情　無情　不要問我　不管　不悔　不解釋意思\n\
  \n＃無淚無語\n心中傾出鮮血不願妳知\n一心一意陪妳到未來日子\n我以後陪著妳去找好的事\n\n△別問我傷心的事　不必說不要再提\n這事　那事　都不得已　中間經過沒人知　沒人知\n\
  \n\n\n原版\n\n\n-----\nSent from JPTT on my iPad\n\n--\n感謝深愛華語系國片的同道中人總是情誼相挺"
