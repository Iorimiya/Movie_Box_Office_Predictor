title: '[好雷] 平凡微小幸褔的《河畔小日子》'
content: "《河畔小日子》\n\n喜　好｜9(滿分10)\n評　價｜IMDb7.7\n片　長｜02時01分\n類　型｜劇情 #日本電影\n導　演｜荻上直子\
  \ (《海鷗食堂》)\n演　員｜松山研一、室剛、吉岡秀隆、柄本佑、田中美佐子、藥師丸博子、緒形直人、滿島\n光\n配　樂｜PASCALS(知久壽燒)\n發　行｜政駒實業/光年映畫\n\
  簡　介｜「不與任何人牽連，決定一個人生活的我；卻在遇見一群怪咖後，咀嚼到詩意般的\n小小幸福。」這是一部關於「美食」與「小確幸」的電影。\n其　他｜20221017\
  \ @長春國賓 / 導演荻上直子同名小說改編/食物造型師飯島奈美\n\n.\n\n\n夜半打開電腦準備把寫到一半的心得補完，才發現沒有存檔。遇到這樣的情形我通常就會擱\n\
  筆擺爛，但今天這種荒謬感好像更實切地把我拉回觀影當下，非預期的、平凡的、微小的、\n反反覆覆的，無論幸福或者悲劇，這就是人生。\n\n頗喜歡該導演執導的《#當他們認真編織時》，但到了今天留下的印象只剩下恬淡的氛圍及\n\
  #\n生田斗真 精湛的跨性別演出。原本想略過這部，但卻見社群一片好評，在我的小圈圈裡聲\n勢更勝商業大片，使我不禁好奇，真的這麼值得一看嗎？\n\n但真正促使我觀賞的動機，或許還是緣分吧。中午看完了《小藍》特映，晚間尚未有安排，\n\
  又懶的移動到其他地方所以決定就地選部片來看，時間最剛好的就屬《河畔小日子》。\n\n『這部電影正是為此而生，讓你可以回到原點、生活的初衷，並即刻體會到溫度，重新評估\n\
  進而修正生活方式與工作態度，不被事物、環境，地點所束縛，荻上直子用她最擅長的食物\n、美術、對話來表現，回應觀眾對於「幸福究竟是什麼」的提問。這是一部看了會讓人「想\n\
  跟誰一起吃飯」的幸福電影，導演用簡單的美食幽默描繪出「小小幸福的瞬間」。』這段話\n是劇情簡介裡寫的。\n\n我覺得一個作品的良劣，除了觀看作品本身，或許更能從「觀看者」的回饋裡找到答案。好\n\
  作品總是這樣，能啟發更多優秀的創作。觀影後回頭去看他人心得(觀影前會盡量少看預告\n和影評，想保留自己最原始的解讀)，篇篇情感真摯動人。\n\n電影中的畫面、聲音，還有米飯香氣，久久不散。\n\
  \n----------以下有雷、很多雷(不小心寫成流水帳了)，建議看過電影再來----------\n\n電影的開頭是關於「牟呼栗多」的解釋、颱風後河畔的空景與口白，我其實有點不確定氛圍\n\
  的走向，畢竟日本河畔給我的電影印象總是胃痛的(#令人討厭的松子的一生 、 我很好 ...\n...)，角色出現後來了句「只要夠努力的話，就會被重新接納。」這是甚麼慣老闆幹話阿？\n\
  我的表情和男主角呈現一致 。更生人回歸、工作與租屋，還有一個好好人的女角，或許\n和漫畫《#前科者》類似？啊，又猜錯了。隨著角色們一個個出現才總算看懂了故事主軸－\n\
  關於「牟呼栗多」這個社區居民們的小小日常。\n\n這個社區簡直怪人集散地，主角山田或許是最「正常」的，然而他們都怪的如此可愛，比\n如「極(ㄈㄨˋ)簡(ㄉㄢ)主(ㄅㄨˋ)義(ㄑㄧˇ)」奉行者的生活哲學，西裝筆挺靠兒族墓碑\n\
  推銷員的食物描述廣播劇、或是死心踏地到令人同情的寡婦房東小小邪惡心思。\n\n剛開始的山田是憤世嫉俗緊閉心房和房門的。也是，生活裡又沒甚麼好事，剛回歸社會迎\n\
  接自己的竟還父親大體！\n\n然而煮飯天分引來鄰居島田先生厚臉皮的不請自來，「我還沒有心理準備！」「有熱水就\n好」「揪斗！」「嘛嘛～」，幾頓共食後心房也漸漸打開。\n\
  \n島田先生說「不論他是甚麼樣的人，你都不能當他沒存在過」，於是去認領骨灰，看著那\n些像是物品堆放在倉庫的骨灰，山田只能愣愣地問「最後的表情是甚麼？」社會課(?)職員\n\
  回答「喉結骨燒得很漂亮哦！像是佛祖雙手合十至於胸前」。從遺物裡去猜測父親死因，是\n孤獨死嗎？最後的通話停在「生命線」，那麼是自殺嗎？\n\n有些人得在大太陽底下努力推銷，有些人則能輕易花200萬買墓碑(還是買給小狗的)，這\n\
  些難以言喻的荒謬感覺只能透過吃吃美味的食物釋懷了。社區居民們圍繞鍋前聊聊不著邊際\n的話，比如忘記自己死去的岡本太太，共享著美食、共享著這無奈人生裡的平淡幸福。\n\
  \n畢竟是電影，還是需要一些戲劇化的衝突場面。島田先生的疏離使得山田崩潰。真是成也\n島田先生敗也島田先生啊。被我誤會是慣老闆的老闆此刻成了知心張老師：「不能辭職！」\n\
  「不要用腦去想，用手！」\n\n受老闆開導的山田決定直面過去的心底疑問「父親是自殺嗎？」，他撥了生命線的電話尋\n求解答，生命線專員則回以「天空中游泳的金魚」的故事。山田再次找上了社會課職員，他\n\
  說「不能否認」但「自殺的人頭會朝內，孤獨死則會朝外，您父親兩者都不是。」透過死前\n未喝完的牛奶，山田確認了與父親間的聯繫。\n\n片中插敘一段女房東視角的經歷也很精采。她帶著女兒去掃墓，回程的司機大叔說：「樹\n\
  葬好啊」「無論甚麼類型的墓其實都是在療癒在世的人」然後分享了一個浪漫的煙火故事「\n碰！」。\n\n前幾天我去聽《凡尼亞舅舅》新書講座，主講者(該書翻譯)說，有一段台詞她覺得翻成「\n\
  吃我！」最為情色，所以這麼翻了。當看到滿島光飾演的房東咬著丈夫遺骨，我滿腦子都是\n「吃我」。確實情色 。\n\n與島田先生和好後故事也來到尾聲，大家一起和房東女兒的金魚道別。「死去的金魚會\n\
  去哪裡？」墓碑推銷員和大家分享了「天空中游泳的金魚的故事」。這是不是暗示著作為父\n親的他也曾站在臨界點？廢棄家電堆中傳來了「拎拎拎」的聲響，不明生物在天空中搖盪。\n\
  \n山田似乎放下了些甚麼，他把骨灰磨成了細細的粉末。大家一起為山田父舉辦葬禮，沿\n著河畔慢慢前行。\n\n我在觀影後於限動寫下的短評「是個很適合在颱風後觀賞的電影。有點奇幻的劇情和有\n\
  點奇怪的人們講著不著邊際的話語怎麼就這麼療癒呢？必須仰賴微小的幸福而生的我們，大\n概也會慢慢演化出尋找幸福的能力吧。」我是這麼期許的。最後，請跟我一起念三遍：\n\
  \n「我沒有錢！」\n「我沒有錢！」\n「我沒有錢！」\n\n—————————\n\n‧坐在窗櫺搖著扇子的西裝父子檔\n‧廢棄家電堆上的的口風琴演奏\n‧蜘蛛之絲\n\
  ‧吹泡泡的和尚\n‧島田先生雨中跳舞\n‧烏賊眼睛\n‧舊式家用電話\n\n\n「夏天自給自足，現金留給冬天」\n「我不是廢物，我有思想」\n「吃著美味蔬菜，活著真好」\n\
  「『我沒有錢』，一喊就有轉機」\n「不論他是甚麼樣的人，你都不能當他沒存在過」\n「飯啊，比起一個人吃，和別人一起吃會更好吃。」\n「遺棄骨灰是犯法的，但變成灰就沒問題」\n\
  「我死去時，有一個人會寂寞就好了」\n\n\n小黃瓜、番茄、醃蔬菜、醃烏賊、關西風味壽喜燒、白飯、牛奶、麒麟啤酒、冰棒、口\n述生魚片、骨灰\n\n\n--\n\
  Sent from my iPhone 13 Pro\n\nPiTT \n\n--\n\n\n謝謝，這是莫大鼓勵；）\n原來 還沒看過她的作品所以認不得\n\n\
  很高興你也喜歡：）\n看完得吃三大碗XD\n我沒有錢._./ !\n真的好好看！"
