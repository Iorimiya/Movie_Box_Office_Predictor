url: https://www.ptt.cc/bbs/movie/M.1586270964.A.B6C.html
title: '[新聞] 《日子》未上映竟遭洩漏　蔡明亮怒喊提告'
content: "《日子》未上映竟遭洩漏　蔡明亮怒喊提告\n\n\n影帝李康生在「日子」有精湛的表演。\n\n2020-04-07 19:10 聯合報 記者陳建嘉／即時報導\n\
  \n蔡明亮執導新片「日子」獲選今年柏林影展競賽類，並拿下泰迪熊評審團獎，\n電影原定下半年上映，未料電影還未上映，就驚傳片源外流遭到盜版，\n讓蔡明亮非常氣憤，不僅在大陸網站「豆瓣電影」發文呼籲大家別看盜版，\n\
  受訪時也強調絕對會追究源頭，\n「我找到他之後，會公開他是誰，一定會告他，太過分了」。\n\n蔡明亮表示7日早上被朋友告知，表示「日子」在大陸網站有片源外洩，讓他非常痛心，\n\
  並表示該片先前在柏林影展首映，因為有些媒體及片商需要，才先提供他們樣品片，\n沒想到竟遭盜版，他更透過工作室在「豆瓣電影」發文，\n「有人把樣片資源流了出來，非常非常令人震驚，以後我們還要相信什麼？\n\
  人和人之間還會有信任嗎？」\n\n蔡明亮並呼籲影迷不要看盜版，因為「日子」是一定要看大銀幕的作品，\n「如果你是我的影迷，或是電影的愛好者，我懇求你不要像那位傷我的人那樣傷我，\n\
  那樣的傷一部作品」，\n也說自己絕對會找到影片外洩的源頭，\n「也許我永遠也查不到是誰，但我深信人在做，天在看，\n你知，天知，只是時候未到而已」，影迷們也紛紛力挺留言「拒看盜版」。\n\
  \n\n蔡明亮執導「日子」在國際間大獲好評。\n\n\n蔡明亮執導新片「日子」起用新人演員亞儂弘尚希。\n\n--\n、。帝釋所問經講記77頁拆穿佛法的。\n\
  《毗婆舍那講記(含法的醫療)》開示如何修四念處增加智慧斷除所有煩惱。\n《正念禪修方法(毗婆舍那實修教學)》簡短說明如何修四念處禪法。\n是 是菩薩成佛之道\n\
  、、、、()、、是佛經。\n  是佛          是菩薩\n\n--"
