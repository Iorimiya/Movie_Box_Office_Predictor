url: https://www.ptt.cc/bbs/movie/M.1493976108.A.B04.html
title: '[普雷]嗑電影：我發瘋的那時日子'
content: '"你可以叫我湯姆"

  .

  圖文護眼完整版歡迎上：


  .

  我承認，


  我是衝著克蘿伊摩蕾茲去看的，


  她的作品我只看過：


  特攻聯盟、暗處、雨果的冒險與星光雲寂這幾部，


  加上今天這部剛好第五部，


  也剛好是第一部她掛名主角的演出(以我看過的來說)，


  第一次挑大樑，


  就演出如此有難度的角色，


  還詮釋的相當的精彩，


  十分的有爆發力的演出，


  讓我對她刮目相看，


  可能是之前與一些演技派演員合作有吸收到吧~


  她的演出可以算是這片最大最大的亮點了！


  .


  克蘿伊的演出很棒，


  但是整部片的步調卻太快了，


  前段還好，


  克蘿伊的演出，父母的堅持，男友的深情，


  都有某種程度上的著墨，也讓人期待收尾的後座力。


  但是…


  找出病因之後，


  整部電影的節奏不曉得是在趕什麼似的，


  感覺還有故事還沒講就硬生生、趕急急的把故事給結束，


  虎頭蛇尾的太明顯，後座力嚴重不足，


  是這片最大最大的敗筆了，


  因此，我個人也只能給予：6/10的分數了…


  .


  弦外之音~


  克蘿伊最後一場戲的造型真漂亮…


  令人難以忘懷的正啊~~~~~！！


  --

  Sent from my Windows


  --'
