url: https://www.ptt.cc/bbs/movie/M.1579586627.A.66C.html
title: '[新聞] 蔡明亮 合體李康生發威《日子》攻進柏林'
content: '新聞網址：



  蔡明亮 合體李康生發威《日子》攻進柏林影展


  第70屆柏林影展2月20日登場，蔡明亮的新劇情片《日子》是繼2015年侯孝賢《刺客聶隱

  娘》在坎城影展奪最佳導演後，再度有台灣電影入圍3大國際影展主競賽單元；另外，


  趙德胤《幕後》傳捷報


  台灣電影新年捷報還有一樁，趙德胤的VR作品《幕後》也宣告入選2020年鹿特丹影展。

  但張藝謀新片《堅如磐石》原有

  望進入其一單元，但目前消息指出，該片尚未取得龍標，依規定不得參展。另，


  -------------------------------------------------------------------------------


  恭喜蔡明亮導演


  繼續維持每部劇情長片都入圍國際三大影展主競賽


  1992《青少年哪吒》未報名三大影展

  1994《愛情萬歲》威尼斯影展正式競賽片 獲得金獅獎

  1997《河流》柏林影展正式競賽片　獲得銀熊獎－評審團大獎

  1998《洞》坎城影展正式競賽片

  2001《你那邊幾點》坎城影展正式競賽片

  2003《不散》威尼斯影展正式競賽片

  2005《天邊一朵雲》柏林影展正式競賽片　獲得銀熊獎－傑出藝術貢獻

  2006《黑眼圈》威尼斯影展正式競賽片

