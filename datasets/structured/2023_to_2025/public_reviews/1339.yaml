url: https://www.ptt.cc/bbs/movie/M.1559248234.A.0E4.html
title: '[好微雷] 從此，我們過著幸福快樂的日子'
content: "雷文防雷資訊頁\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n1.影片名稱 :\
  \ 從此，我們過著幸福快樂的日子 (中)\n             We Have Always Lived in the Castle (en)\n\n2.觀影時間\
  \ : 05/30\n\n3.觀影地點 : 住家\n\n4.觀影方式 : 網路，iTunes 美國版商店\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n美國哥德恐怖小說前輩 Shirley\
  \ Jackson的第二部長篇小說《鬼入侵》已改編為影集由 Netflix發行，她第三部也是最後一部《從此，我們過著幸福快樂的日子》也於同年拍成電影了，由此前拍過一部女同志電影\
  \ \"Concussion\"(2013) 的女導演 Stacie Passon執導、由三十出頭的 Alexandra Daddario 與二十出頭的 Taissa\
  \ Farmiga 飾演主角姐妹倆。這整個女性情誼攜手抗敵的格局非常強烈，詮釋原著小說古堡孤女相依為命的故事，在基本面就是深具潛力的。\n\n\n\n在敘事面呢？這本小說在主角姐妹\
  \ Constance 和 Mary-Katherine \"Merricat\" 之間，是選了古怪妹妹「瑪麗喵」以她第一人稱視角說故事，於是扛下全片敘事調性的重責大任就在飾演瑪麗喵的\
  \ Farmiga身上了、而電影整個視覺聽覺的攝影設計配樂節奏之風格，也以捕捉這位 18 歲古堡怪妹的乖張心思為參考座標。事實上，姐妹倆都很古怪，住在這 1950s的新英格蘭虛構小鎮「雪莉鎮」的山丘森林古堡大宅中深居簡出，姐姐基本足不出戶已六年、妹妹兩週才進小鎮一趟，而這一趟可是全神戒備上緊發條、要跟小鎮居民來場流言蜚語針鋒相對的日常戰爭...\n\
  \n從小鎮向山上的視角看，這兩姐妹神秘又恐怖，這古堡禁忌而危險，是鎮民們都要保持距離的、是小孩們要避而遠之否則小心被吃掉的... 小說曾經煞有其事談吃小孩的鬼故事恐懼，電影也當場重現一次在成真邊緣的吃小孩情境\
  \ XD 不過反過來，當古堡孤女下來鎮上採買物資時，就是小偷銳面鄉民在後冷言嘲諷霸凌辱罵只差沒丟雞蛋的復仇時刻了... 電影給瑪麗喵的開場一趟小鎮之旅 walk\
  \ of shame，馬上為全片的空間關係定了調！也為那美國在 60s解放前的 50s保守舊社會定了調。只是這城堡小鎮天上地下的「階級」對立，真的是理解衝突與恐懼的唯一軸線嗎？\n\
  \n看海報就知，此片與其原著提出的軸線是「性別」，不過還是先提出另一個「世代」的假設。這間大宅在六年前一場家庭晚餐時，被人用砒霜混糖下毒死了好多人，堡主夫婦與堡主弟媳都死了，只有大女兒吃飯不加糖沒事、小女兒那天被罰不准吃飯也沒事、她們的叔叔則中毒沒死半身癱瘓且失智，於是這六年姐妹與叔叔相依為命過日子。倒是擅長煮飯的大女兒\
  \ Constance被當弒親嫌犯還被調查過，雖然法律最終還她清白但已被當代鄉民獵巫安上臭名，於是六年來再也不敢出家門一步、只敢在家當煮飯公主；妹妹瑪麗喵誓言保護姐姐絕不受外界傷害，而且要用她獨門的魔法！\n\
  \n\n\n這故事，先提出姐妹的神秘恐懼、再描繪小鎮階級的劍拔弩張、再隱隱帶出一個神秘過去、而後終於要慢慢揭開面紗了解恐懼的生成了。我認為電影選擇的瑪麗喵視角與身段、以及電影視聽覺調性的選擇與營造，是此片成功的關鍵。它理應是歌德恐怖、觀眾理應對兩姐妹如女巫般害怕、但同時又要去理解兩個女巫的苦衷？這理應矛盾的觀影情懷用一種文青系的怪妹身段粉色包裝了。\n\
  \n也不是粉色，反而是一種灰天綠草紅花藍衣的高彩度對比構圖與配色，讓這外人以為陰森的古堡其實處處充滿少女花草香，兩位外人眼中的恐怖女巫只是不善社交有點 creepy\
  \ 的怪美眉，她們不知為何失去了連結人與世界的基本能力，但仍像兩尊機器娃娃般結結巴巴地試圖找到一點愛。\n\n她倆怎麼變成今天這樣子？誰也不知道，不過答案很快就要呼之欲出，卻也從沒說破而是啓人聯想：這天來了個斯文帥氣風趣幽默的堂哥\
  \ Charles，本片交給渾身散發男人誘惑的「冬兵」Sebastian Stan魅惑演出！城堡終於又有了個好手好腳心志健全頂天立地的男人，還令看似有戀父情結的姐姐開心地覺得「他長得好像我們父親」、甚至很快遞補上這個家中的父親生態位。\n\
  \n\n\n不過一臉恐懼憤世的妹妹瑪麗喵從第一眼就排斥到底，因為他太像父親了！兩個女兒，面對一個高帥斯文的男子有這樣截然不同的反應，我們不由得聯想她倆過去與父親的不同關係。關於父親的過去，原著很壓抑幾乎從沒說，電影也從沒在對話中直談，只有幾次性別暴力近在眼前打開姐妹的恐懼開關時，那「父親原諒我」這類的潛意識才會悄悄蹦出來。\n\
  \n畢竟這是歌德恐怖小說改編、真正恐怖的過去連小說都沒正面提電影更只是保留鬼影幢幢不說破，那我這篇也別爆雷，就留給有看片者自己玩味。總之這片有成功地將兩位姐妹做到驚人地反社會也驚人地\
  \ creepy ，每每看 Farmiga飾演瑪麗喵嘴上決絕面上陰狠手上做法宛若魔鬼附身、或是看 Daddario 飾演 Constance每每假掰笑容逢迎討好鞠躬哈腰乞求垂憐，那極剛極柔到病態的演出身段，在本片的花草系視聽覺包裝、以及女性情誼為核心的敘事視角下，竟然越是病態越令人疼惜、越是恐怖越令人感嘆那家庭與小鎮中的性別階級等權力關係如何扭曲了純真心靈再也不復返。\n\
  \n然而，扭曲的心靈儘管早已病入膏肓扭不回來，就這樣扭一生未嘗不能找到另類出路攜手走下去，儘管這荒煙蔓草的古堡遭遇更多災難加倍傾頹，姐妹倆仍然可以在廢墟中簞食瓢飲過下去。至於那壓垮孤女心靈的性別幽靈、那鄉民獵巫千夫所指的保守幽靈、以及天上地下誓不兩立的階級幽靈，這屬於\
  \ 1950s前彷彿千年不變的歷史創傷，大亂鬥一場直到進入（原著小說寫作的）1960s 後，也許都終於能得到理解與和解。昨日的貴族盛宴，咱們以毒解放，而今日的農民盛宴，咱們試著放心享用吧！喔當然如果歷史幽靈重生再來，那重生的孩子也是照吃不誤的\
  \ XD\n\n\n\n不知道 Shirley Jackson那著成於 50-60s 的懷舊恐怖小說，在今日讀者之間是否仍流行？連我們現在無人不知的史蒂芬金都受這位前輩影響深重呢。這一兩年影集有《鬼入侵》、電影有這部《從此，我們過著幸福快樂的日子》，不知是否有機會掀起這位哥德女作家的新一波風潮？光就此片來說，那一種哥德小說疑雲幢幢的神秘感、社會衝突的無奈感、對未知事物的恐懼感、對創傷歷史殘破心靈的滄桑感、以及對有限視界中珍愛事物的迷戀感，我覺得在這部電影中整合得很好！\n\
  \n曾幾何時我們的恐怖電影都變成鬼怪嚇人的試膽電影了？但我個人比較偏好從恐怖情節回視社會人心，這系老哥德恐怖則更是正視種種社會與歷史邊緣的孤寂心靈，那 creepy\
  \ 感倒不像恐怖而更像關懷。推薦喜歡 Taissa Farmiga & Alexandra Daddario兩位女演員的、喜歡 Shirley Jackson或其他哥德恐怖小說的、喜歡女性電影關心性別處境的、喜歡\
  \ 1950s復古風情的、喜歡魔幻寫實風的、以及喜歡高彩度花草系文青風的觀眾，有興趣值得看看。\n\n\n--"
