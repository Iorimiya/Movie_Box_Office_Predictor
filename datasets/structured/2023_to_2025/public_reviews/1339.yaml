url: https://www.ptt.cc/bbs/movie/M.1523676684.A.A09.html
title: '[新聞] 金球影后為演《最後相愛的日子》等待30年'
content: '新聞網址：


  59歲金球影后安妮特班寧（Annette Bening）在愛情電影《最後相愛的日子》演出曾於50

  年代顛倒眾生卻逐漸消失於大銀幕的美豔女星葛洛莉亞葛拉罕（Gloria Grahame），演過

  無數角色的安妮特班寧在90年代初就聽聞這段愛情故事，很希望飾演葛洛莉亞葛拉罕，但

  礙於當時的年紀不符合葛拉罕談這段感情時的年齡，講究真實的班寧沉澱近30年，直到這

  幾年成為年紀相符的熟齡女才正式投入製作，也正因為她與戲中的葛拉罕年紀相仿。


  《最後相愛的日子》改編自英國演員彼得特納的同名回憶錄，描述他與紅極一時的好萊塢

  女星葛洛莉亞葛拉罕之間纏綿浪漫又溫馨暖心的祕戀，安妮對於這段年齡差距懸殊的忘年

  之戀更能感同身受，也更能領略葛拉罕的心境，她說：「我想葛拉罕很清楚自己的年紀比

  對方要大得多，也很在意對方如何看待她，那正是因為她深愛著他；一旦深愛某個人，就

  會在那個人面前變得敏感脆弱。但同時，這個年紀的熟女知道什麼對自己來說更重要，反

  而不在意外界眼光，更覺得自由與坦蕩。」


  該片描述奧斯卡女星葛洛莉亞葛拉罕（安妮特班寧　飾）在倫敦與小演員彼得特納（傑米

  貝爾　飾）墜入愛河，她成熟的魅力讓彼得為之傾倒，而他對她的迷戀更讓她癡迷，但葛

  洛莉亞癌症突然復發，不願拖累彼得的她決定隱瞞病情與他分手，為炙熱的愛情畫下句點

  。三年後，重病的葛洛莉亞到彼得在利物浦的老家休養，一直深愛著彼此的兩人再度相聚

  ，攜手度過最後的相愛時光。13日在台上映。


  --'
