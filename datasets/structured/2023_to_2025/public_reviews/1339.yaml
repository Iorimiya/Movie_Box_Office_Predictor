title: '[普雷] 真愛挑日子 '
content: "雖然不太喜歡真愛挑日子(One Day)\n那種劇情跳躍式的拍法\n不過可以看到女主角Anne Hathaway在戲中越變越美，且越有自信\n\
  而男主角Jim Sturgess則在戲中大起大落，甚至一度自我迷失\n我很喜歡戲中Patricia Clarkson所扮演的母親角色\n那種對男主角溫柔中卻帶有最嚴厲的責備:\n\
  \n「我相信你是一個好孩子，我也知道你不會學壞；\n但我只擔心現在的你沒有以前那麼好了。」\n\n語氣平和卻有著對兒子極大的失望，讓人印象很深刻~\n雖然結局也讓人看了會不開心~\
  \ (吼~男女主角也真的是倒霉)\n不過這種淡淡的說故事方式，也是對感情另一種的詮釋方式吧~\n\n--\n台灣小人物商家分享\n七三茶堂   果然匯 \n嚐私\
  \   ZABU \n法蕾   OPPa \n騷豆花   小食代 \n貓友達   水云濮 \n\n--"
