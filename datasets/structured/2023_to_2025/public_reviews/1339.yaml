url: https://www.ptt.cc/bbs/movie/M.1438784347.A.FF9.html
title: '[專欄] 在越南最後的日子 時代悲歌下的常風行動'
content: "【幕迷影評】電影知識 專欄分享\n\n\n[紀錄] 《在越南最後的日子》（Last Days in Vietnam） 時代悲歌下的常風行動\n\n\
  by XXY\n\n\n網頁版文章（有圖文解說）：\n\n\n\n還記得去年2014年奧斯卡金像獎頒獎典禮上，有出現過哪些電影作品嗎？在關注長篇短篇\n\n電影的同時，紀錄片的競爭也是相當精彩的！在第87屆奧斯卡金像獎的最佳紀錄片當中，\n\
  \n共有五部紀錄片入圍，分別為記錄有關前美國國安局雇員爆料者-愛德華斯諾登的《第四\n\n公民》（Citizenfour）；聚焦於剛果維龍加國家公園內盜採石油黑幕為主題的《維龍加\n\
  \n》（Virunga）；紀錄傳奇攝影師薇薇安邁爾的《尋秘街拍客》（Finding Vivian Maier\n\n）；介紹巴西攝影師賽巴斯蒂薩爾加多的《薩爾加多的凝視》（The\
  \ Salt of the Earth\n\n）；以及紀錄美軍在越戰撤離過程的《在越南最後的日子》（Last Days in Vietnam）。\n\n獎項最終頒給了《第四公民》，但有關《在越南最後的日子》是一個非常有趣又值得一看\n\
  \n的作品，內容不但記錄了當年美軍在越戰終期灰頭土臉的從南越撤離，同時也聚焦在南越\n\n平民面對共產勢力的恐懼以及被國際盟友拋棄的無助感，相當寫實又揪心。\n\
  \n\n\n\n\n事實上，這段不願被美國人或者一些民主陣營國家再次提及的恥辱，是70年代冷戰中期的\n\n一件重大歷史事件。作為美蘇兩大陣營冷戰中的熱戰，越南戰爭的衝突可說是非常複雜又\n\
  \n激烈。除了牽扯到當時美蘇兩大勢力的國際局勢，同時也因為越南長期受到法國、日本等\n\n國殖民統治，民族意識逐漸抬頭所致。在二戰過後，越南如同朝鮮半島一樣，南北分治的\n\
  \n情形也讓這場民主與共產間的對峙逐漸升溫，戰爭一觸即發。\n\n\n\n\n\n不論如何，越南戰爭自1955年美國介入下不斷升溫，從最初派遣軍事顧問團，到時任美國\n\
  \n總統的詹森不斷投入軍事物資及兵力，戰爭在60年代間持續白熱化。而在許多國際壓力、\n\n綁手綁腳的軍事規範以及美國國內的反戰聲浪，越戰於1969年時任美國總統的尼克森宣布\n\
  \n逐步撤出美軍開始，北越蠢蠢欲動的南下擴張，最終導致了南越被赤化的局面。\n\n\n\n\n\n回顧電影，《在越南最後的日子》這部紀錄片正是紀錄了這段時代下的悲歌，代號為「常\n\
  \n風行動」（Operation Frequent Wind）的軍事撤離行動，正是1975年4月29日美國執行西\n\n貢（當年南越的首都，今日的胡志明市）大規模撤離美國僑民及南越相關人士的非軍事行\n\
  \n動。在紀錄片中，並不聚焦於越南戰爭的過程，反而將歷經19年越戰，完全寫實呈現了身\n\n心俱疲的美國，面對南越政權在放棄與支持之間的兩難，最終執行了這場規劃已久的常風\n\
  \n行動。紀錄片在開頭利用了大量訪談、新聞紀錄影片以及動畫、圖表等方式，清楚重現了\n\n當年不安的氣氛，觀眾足以感受到身為當地居民的無奈，以及美國急於撤離的焦慮。\n\
  \n\n\n\n\n事實上，這場撤離行動原定是利用鄰近西貢的新山一國際機場，利用大型運輸機將平民送\n\n出南越，前往附近包括菲律賓、印尼、臺灣等亞洲國家。但在該年北越發動的大規模春季\n\
  \n攻勢下，勢如破竹的北越軍隊控制了週邊機場，並開始逼近西貢市區。採用海上派遣直升\n\n機撤離的第二方案正式啟動，在1975年4月29日當天下午2點開始，西貢天空出現密密麻麻\n\
  \n的直升機，不斷在市區、海上穿梭。大量的難民逃往美國大使館，爭先恐後透過關係試圖\n\n混上直升機，場面相當混亂。直到隔日凌晨，時任美國駐越南大使的馬丁撤離，民眾開始\n\
  \n恐慌，場面失控，戒護的海軍陸戰隊成員甚至使用催淚彈，阻止暴動的民眾。最後一批的\n\n海陸隊員困守在大使館屋頂等待救援，直到早晨近8點，最後一架飛離越南的美國直升機\n\
  \n載走了最後一批美軍，代表了美國正式退出了越南，以及南越政府的滅亡。\n\n\n\n\n\n根據統計，這場常風行動的直升機班次共有682次，50,493名人員離開越南。過程中除發\n\
  \n生一起原因不明直升機墜海事件，造成駕駛失蹤的意外，其他撤離的人員皆平安抵達位於\n\n南海的軍艦與運輸船，整體的撤離行動算是成功。今日，胡志明市的美國駐越南大使館仍\n\
  \n保留了當年直升機降落台的階梯，其中一段更保留在美國密西根州的福特總統博物館中展\n\n示。另外，當年載出馬丁大使，以及南越空軍少校黎邦的兩架直升機，分別展示於美國加\n\
  \n州密拉瑪海軍陸戰隊航空基地以及佛羅里達州彭薩科拉海軍航空基地，供人參觀。\n\n\n\n\n\n除了本部《在越南最後的日子》紀錄片，完整記錄了常風行動，其他如知名的音樂劇《西\n\
  \n貢小姐》（Miss Saigon）中的開頭，男女主角分離的感人場景，便是在這場具歷史意義\n\n的時代背景下所描述的愛情故事。回顧歷史，一場戰爭的爆發，前因後果值得後人深思，\n\
  \n並反省不再發生。而不論如何，最後的受害者都是這群徬徨無助的平民。政治角力下的國\n\n際情勢，也在在說明了國際間沒有永遠的敵人，也沒有永遠的朋友。在經歷過這段歷史的\n\
  \n人們，見證了過度依賴西方勢力的南越政府毀滅的過程，令人不勝唏噓。而作為同為亞洲\n\n民主國家的台灣，其實越南戰爭的歷史也與我們息息相關，這部《在越南最後的日子》雖\n\
  \n最終未能拿下奧斯卡小金人，但其背後的歷史意義，值得一看。\n\n\n\n\n延伸閱讀及相關資訊：\n\n《在越南最後的日子》IMDb電影資訊：\n\n\n\n\
  \n--\n\n===================== power by =====================\n           幕迷影評 \n\
  \    臉書粉絲頁 \n====================================================\n\n--"
