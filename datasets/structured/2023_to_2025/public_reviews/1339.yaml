title: '[好雷] 在河畔徘徊時：《河畔小日子》'
content: "預告片：\n\n\n　　　　本文涉及劇情，且具個人觀點，建議觀影後再讀。\n\n\n　　　　圖文網頁版：\n\n\n　　　　\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n在河畔徘徊時：《河畔小日子》\n\n\n\n　　如果有一天，生命線擴增為能用視訊，去電的人覺得「雖然或許死了會\n\n比較好，但像我這樣的人還無法死的話，該怎麼辦？」或許那一頭的義工，\n\
  \n可以跟他建議：\n\n\n\n　　嘿，要不要一起看《河畔小日子》？\n\n　　這時有人再打進來，還可以一起看喔。\n\n\n\n　　這部電影會讓我聯想到《靈魂急轉彎》，只是後者尋找的「火花」是擦\n\
  \n撞後察覺生活接近藝術之美的燦亮，《河畔小日子》像是河水奔流時，在陽\n\n光下閃爍的瀲灩，或者仰頭時變化的雲彩，很平凡，可是已經足以令人往前\n\n再走一點，走到足以暫得安適的所在。\n\
  \n\n\n　　無論是更生人做著薪資微薄的醃漬章魚好能重新被社會接納露出笑容，\n\n以極簡主義的「思想」來躍過「負擔不起」的柵欄，飢餓到極限的貧瘠時收\n\n\
  了蔬菜就無法拒絕借浴室分享白飯，漸漸變成互享共食的豐盛；或半年販賣\n\n不出墓碑與靈骨塔也繳不出房租的推銷員父子，藉由聲色描述來渡過精神的\n\n枯瘦，終於賣出給富人家的狗終於得以吃一頓關西壽喜燒；或丈夫癌逝的房\n\
  \n東女子帶著女兒活下去也讓別人能活下去，收到準時繳交的房租會給一顆牛\n\n奶糖作為獎勵，卻在看見孕婦時會想「踢一腳」，只能拚命騎腳踏車避開，\n\n邊啃著冰棒邊傾訴「想到肚子裡是不同的人，就覺得很獸性」；或者聞到壽\n\
  \n喜燒香味後大喊「我沒有錢」就足以成為共享的理由，一齊吃飯時討論起那\n\n個抽菸澆花、忘了自己已經死掉的婆婆……就算曾是被唾棄、滿身黏膩的蛞\n\n蝓，也能等到大雨傾盆時洗一個徹底的澡，再慢慢地，往前爬行。\n\
  \n\n\n　　他們或許都在生死之界徘徊，若能生還，仍有人慶幸你的存在、為你擔\n\n憂；也有人在颱風夜後被河流沖走，沒有新聞報導，成為無主屍骨，但總也\n\n\
  有人會投注目光，欣賞如佛祖趺坐合掌的喉骨；或放在心上，留下來用啃食\n\n來思念，磨成粉裝進煙花，然後在黑夜裡綻放。只要在乎過，即使是渺小的\n\n蜘蛛，也可能懸弔希望之絲；即使死去的是金魚，即使生前毫無關係，只要\n\
  \n死後發現那一點點的共通之處，也要好好安葬，因為「不論他是什麼樣的生\n\n命，你都不能當他沒存在過。」\n\n\n\n　　「死去時只要有一個人覺得寂寞，那樣就夠了。」\n\
  \n\n\n　　全片最能令我共鳴的，大約是在河堤邊埋葬金魚，當電話忽然響了一聲，\n\n兩個孩子進行召喚外星人的儀式，天空不知何處飄來了章魚風箏，像是金魚\n\n\
  的靈魂在空中飄行，那位河畔的遊民忽然伸手哭喊「把我一起帶走！」又或\n\n者是，當島田喝醉酒，邊吐邊哭著連聲說「對不起」；又或者是，山田躺在\n\n地板上，面向外面孤獨的姿勢──如果沒見過面的父子都能同具泡完澡喝牛\n\
  \n奶的習慣，山田父親死時既非向外也非向內的姿勢，或許是既非預期卻又早\n\n已期待的、那種「啊，終於可以把我帶走」的欣慰吧？\n\n\n\n　　但在那來臨之前，又該怎麼活下去呢？\n\
  \n\n\n　　「剎那、呾剎那、臘縛、牟乎栗多」是岡本太太生前死後常叨念的話，\n\n也是「牟乎栗多」社區名稱的由來。據俱舍論卷十二載：「一百二十」是指\n\n\
  一呾剎那，是印度用來描述即短時間的計量：時極短者，謂剎那（0.01333秒）\n\n也。一百二十剎那為一呾剎那（1.6秒），六十呾剎那為一臘縛（相當於1.6\n\
  \n分鐘），三十臘縛為一牟呼栗多（相當為48分鐘），五牟呼栗多為一時（相\n\n當於現在的四小時），六時（六時，即晨朝、日中、日沒，以上為晝三時、\n\n初夜、中夜、後夜，以上為夜三時）合成一日一夜。（出自：台大獅吼佛學\n\
  \n專站：）\n\n\n\n　　山田問南小姐那是什麼意思，南小姐說：「就像天空的顏色出現又消失，\n\n就是描述時間的流逝吧。」或許，就算是這樣彷彿找不出價值、不要用腦而\n\
  \n是用手才能持續下去的生活，不知道什麼時候會被挖出的章魚眼睛凝視過往\n\n犯下的錯、只能維持泡澡、喝牛奶、吃飯、種植盆栽、好好活下去的人，在\n\n死之後也能被頌著經的和尚，用河邊被遺棄的樂器吹奏曲子，由素未謀面的\n\
  \n親人好好的，灑著骨灰，灑在電話上、花上、塌塌米上，在天空變化的顏色\n\n裡隨著流逝的時間往前──能為這樣的畫面觸動的我，或許就能記得久一點、\n\n那一點點微小的，幸福的真諦吧。\n\
  \n\n\n　　有趣的是，在看這部電影之前，正好讀完了森博嗣的《孤獨的價值》，\n\n也提到了「孤獨死」：「每個人最終都得面對孤獨。接受孤獨，意味著得到\n\n\
  自由。……要是斷了羈絆，便能得到孤獨與自由。」我想，森博嗣老師是內\n\n心豐富到足以滋養生命的人，故而能追求孤獨與自由的價值；相較之下牟乎\n\n栗多社區的居民，就是在死亡之河畔徘徊，前後排著次序，戰戰兢兢往前的\n\
  \n人，如果讓他們孤獨，在颱風夜就會不小心會掉進河裡，一去不返吧。\n\n\n\n　　倘若每個人都在河畔徘徊時，都有人能及時陪伴一段，那麼，僅僅是白\n\n飯的美味，小黃瓜的清脆，或者用倒背七七乘法度過恐懼的雨夜，或許就能\n\
  \n讓他好好的，再走下去。\n\n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\n\
  \                                  陳斐雯  貓蚤札（其三）\n\n--"
