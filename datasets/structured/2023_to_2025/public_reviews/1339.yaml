title: '[請益] 我在黑社會裡的日子 的標叔是誰演的'
content: '我在黑社會裡的日子，


  有周潤發、耀揚哥、大傻、陳慧敏的那部，



  裡面有一個穿白衣服，總是用下巴看人的大哥，


  這個演員叫啥名字，想查都查不出來，


  我覺得他演得很有味道。



  有人知道嗎? 謝謝~



  --


  奧茲：你可以吃一堆香蕉！

  芬利：哦，我懂了，就因為我是一隻猴子，所以我一定要喜歡香蕉！

  奧茲：你不喜歡香蕉嗎？

  芬利：別傻了！ 我當然喜歡香蕉，我可是一隻猴子！我只是不喜歡你的推論方式。



  --'
