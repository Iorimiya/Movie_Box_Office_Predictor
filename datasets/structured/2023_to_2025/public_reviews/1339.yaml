url: https://www.ptt.cc/bbs/movie/M.1586253559.A.BD3.html
title: '[討論] 蔡明亮《日子》樣片被惡意流出！！！'
content: '蔡明亮導演剛剛在《日子》的豆瓣討論版發文說明全片的樣片被惡意流出





  今天我感到非常沮喪和失望 我倒沒有太過憤怒 因為這樣的事總會到來 只是早或晚 而這

  回來的過早 早得令人感到詫異 令人不知所措 對人性感到一股的寒意


  不久前帶去柏林參賽的《日子》我的製片因應部份媒體及片商的要求 把影片的樣片寄到

  某些人士手中 我們是多麼的信任每一個人對著作權的重視 但事情就發生了 有人把樣片

  資源流了出來 非常非常令人震驚 以後我們還要相信什麼 人和人之間還會有信任嗎


  這事傷了我們的權益 傷了我們的作品 也傷了我們的心


  如果你是我的影迷 或是電影的愛好者 我懇求你不要像那位傷我的人那樣傷我 那樣的傷

  一部作品 認真的拒絕在這情況下看《日子》也幫忙我阻斷所有的輸送 甚至幫我查到發放

  的原兇


  也許我永遠也查不到是誰 但我深信人在做 天在看 你知 天知 只是時候未到而已


  蔡明亮




  柏林結束才一個多月就被這樣惡意流出 而且都沒公映


  支持蔡導和公視走法律途徑處理 這真的是太誇張了

  --


  --'
