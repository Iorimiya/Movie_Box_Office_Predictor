url: https://www.ptt.cc/bbs/movie/M.1582894175.A.2E3.html
title: '[新聞] 蔡明亮秀《日子》放映師誤為停格嚇壞'
content: "蔡明亮秀《日子》放映師誤為停格嚇壞\n\n04:10 2020/02/28 中國時報 江珮瑜\n\n\n蔡明亮（左起）、李康生、亞儂弘尚希出席柏林影展記者會。（汯\
  \  霖電影提供）\n\n導演蔡明亮的新作《日子》入圍第70屆柏林影展主競賽單元，\n柏林時間27日下午全球首映，在上午則率先與全球的媒體見面，\n蔡明亮帶著兩位男主角李康生、\n\
  寮國新人演員亞儂弘尚希（Anong Houngheuangsy）亮相。\n\n記者會前，影展搶先播映了《日子》片花，片中李康生在飯店把一只音樂盒交給亞儂，\n\
  看見了蔡明亮鏡頭底下的生活日常。\n當記者問起音樂盒播出的音樂為何選用默劇大師卓別林的歌曲，蔡明亮答：\n「我愛所有老音樂，我覺得卓別林基本上是外星人！他來到這個星球帶給我們禮物，\n\
  而片中音樂盒的音樂我非常喜歡，這是我第2次用這首歌，\n第一次用是在作品《黑眼圈》。」\n\n討回禮物當做道具\n\n蔡明亮回憶道：「我和製片去年在阿姆斯特丹電影美術館買到這個音樂盒，送給了亞儂，\n\
  不過在拍攝的時候，又想起了這個東西可以作為電影道具，就把禮物先討回來，\n由小康（李康生）在片中重新送給亞儂。這音樂盒除了是給亞儂的禮物，\n也是給每個生活不易的人的人生禮物。」\n\
  \n蔡明亮對《日子》一連4場放映相當慎重，在前一晚凌晨，冒著接近攝氏零度的低溫，\n一行人趕到柏林影展主場地的波茨坦廣場劇院做最後測試。製片王雲霖表示：\n「在大銀幕上看《日子》的畫面，的確很有感覺，而且聲音的部分，\n\
  導演從不同角度和位置試聽，也反覆調整不同音量，為觀眾帶來最好的觀影品質。」\n\n有趣的是，《日子》片中有一個鏡頭是無聲且幾乎無動靜的畫面，仔細看的話，\n才會發現樹影些微晃動，測試的放映師以為影片停住，整個嚇到。\n\
  記者會上蔡明亮表示自己喜歡自然的聲音，\n「我的電影有很多這樣的設計，更多是還原，提醒我們生活的真實面貌，\n對我來說，這些真實的聲音也好像音樂一樣，\n表示我們生活的環境其實是有很多美妙的聲音。」\n\
  \n(中國時報)\n\n--\n、。帝釋所問經講記77頁拆穿佛法的。\n《毗婆舍那講記(含法的醫療)》開示如何修四念處增加智慧斷除所有煩惱。\n《正念禪修方法(毗婆舍那實修教學)》簡短說明如何修四念處禪法。\n\
  才是 是菩薩成佛之道\n、、、、()、、是佛經。\n  是佛          是菩薩\n\n--"
