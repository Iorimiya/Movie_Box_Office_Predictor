title: '[新聞] 蔡明亮《日子》入選紐約影展'
content: "蔡明亮《日子》入選紐約影展\n\n04:10 2020/08/15 中國時報 李承陽\n\n\n蔡明亮（右）執導、素人演員亞儂主演的《日子》頻獲國際影展重視\
  \ 。\n\n蔡明亮新片《日子》再傳捷報，繼柏林影展擒泰迪熊評審團獎後，13日又入選今年紐約影\n展，巧的是，《日子》原訂在今年5月於紐約現代美術館（MoMA）進行北美首映，無奈行\n\
  程因疫情取消，這回透過紐約影展首映，繞了1圈又順利登上紐約的大銀幕，蔡明亮有感\n而發：「每部電影都有它自己的命運。」\n\n蔡明亮與紐約影展不陌生，至今共5度入圍，但他實際赴影展只有1次，是在2001年與李康\n\
  生帶著《你那邊幾點》到林肯中心放映，蔡明亮回憶說：「那是劇場等級的戲院，我們被\n安排坐在2樓的包廂，雖然是2樓，但全部的人都看得到，放映完有燈照在我跟小康身上，\n\
  我們就起立接受大家的鼓掌。」至於《日子》何時在台上映，他預計會落在明年。\n\n他也透露今年下半年的計畫，除了2場宜蘭壯圍沙丘的夜宿活動和展覽，年底還有1個重要\n\
  的大型活動，就是要前往巴黎龐畢度中心作回顧展，屆時將有他的個人電影回顧展以及《\n行者》系列展覽，預計連映6周，此計畫雖有可能因疫情生變，恐延到後年，但他已著手\n\
  開始忙展覽的事物，並請李康生先排開11月後的所有工作。\n\n--\n、。帝釋所問經講記77頁拆穿佛法的。\n是 是菩薩成佛之道\n、、、、()、、是佛經。\n\
  \  是佛          是菩薩\n\n和破十方諸佛\n\n--"
