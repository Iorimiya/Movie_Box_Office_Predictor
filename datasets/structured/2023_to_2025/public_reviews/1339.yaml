title: '[好雷] 真愛挑日子-One day~愛在千迴百轉後'
content: '電影取材於大衛·尼克爾斯的暢銷小說，

  講述了艾瑪·莫莉（安妮·海瑟薇）與德克斯特·梅休（吉姆·史特格斯）

  在畢業當晚邂逅。

  之後的一年，艾瑪在倫敦一家墨西哥餐廳當女服務生；

  而德克斯特則一邊週遊世界，一邊酗酒濫交。

  最終，德克斯特成為了一檔吵鬧的深夜電視節目主持人。

  幾年之後，艾瑪曾經的室友舉行婚禮，艾瑪與德克斯特同時被邀請參加。

  在典禮上她得知德克斯特已有了未婚妻，且即將為人父。

  之後德克斯特離婚，並希望能與艾瑪走未來的人生。

  再來後他們真的結婚、也渴望著孩子，有著自己的一家店……只是後來艾瑪意外身亡.

  只留下德克斯特對艾瑪的思念~


  這部電影海報，讓kate 好喜歡，用著復古舊色調，

  就好像是在說明這電影，以一種時間性做為表態。

  其實看電影最原先的2個原因是：安海瑟威 + 愛情文藝片

  (故事內容其實先爬了其他心得文，大約知道了一下)


  男生看這片會覺得很悶吧！因為就連我都覺得中間小悶了一下……

  男主角德克斯特--- 也很糟(一片至少有一半都在演他的糟)，

  覺得就是沒有什麼腦袋，腦袋和智慧無法同步......

  (大概就是一般人說：『長年紀沒有長腦袋』如此吧.)

  所以我完全可以理解艾瑪在餐廳和他大吵一架，墮落、墮落 and 不斷的墮落.

  曾聽聞一個男人長大的關鍵時間是在--- 當丈夫還有當爸爸，

  不過現在的社會，我覺得還可以加一條『離婚』.

  電影中的男主角就是完全的經歷這三個男人長大的階段，


  kate 只能說，長大後的男主角好多了，也順眼多了.


  而女主角艾瑪呢，真的很佩服 安海瑟威，可以從大學生演到步入社會成功的女生.

  而且蛻變的越來越美.

  初初畢業社會人時，呆呆的社會人，必需為的是生活的糊口，打理自己約莫是 = 0，

  慢慢的生活上了軌道，越發美麗，在一起去餐廳吃飯時穿衣服就好漂亮，

  但那鞋子搭的實在是……算了！跳過~

  之後重逢的相聚，一整個美麗的氣勢大放光采，

  (真的不得不說：女人丫！請妳好好活出自己的光彩，因為妳當越來越了解自己時，

  會懂什麼是適合自己的，最舒服自在，散發的光芒，好美麗來著.)

  一直到她在巴黎的短髮，簡單俐落：)

  怎麼可以有人把短髮留的這麼好看XD(是kate 整部最喜歡的造型).


  艾瑪--- 或許她夠幸運，就好像……一個人倦了看盡了身邊的景色而停了下來，


  很難去說這是不是備選論調，這樣太殘忍...但又好像有幾分現實.

  總之，能擁有與心中最愛的人事物相處，至少這一點是很沒有遺憾來著：)

  雖然故事的近末時是以一種強烈的起伏表達一個轉折，

  大出意料之外，確也揪著心要人痛著.


  kate無音樂圖文誌


  --

  r大、w大、m大~只能說這是挑人看的一部：)

  她演的很棒，在劇中也越來越美，說明一個女人越來越懂自己要什麼，而且打理好.

  同感，覺得和真實人生貼近，但不是大家都愛~胃口很難討好地.

  兩位m大(missdeer是不是也出現蟹版)、f大、z大

  其實我覺得不難看，但版上好雷好像不多……確實有一小點悶，

  只能說個人感受不同，懂那種感覺或是能感同身受的人，確實會被故事感動.

  只看一次就大哭----催淚來著.

  雖然已是幾年前的片子了，但看到很多人有同感，一樣喜歡這片子，

  還是覺得好片不寂莫：)

  所以看完的感覺是……？

  目前只看過一次，因為……如w大所言--- 後勁很強！

  覺得安的漂亮是把人生歷練還有蛻變演的很好：)

  好片值得一再品味：)'
