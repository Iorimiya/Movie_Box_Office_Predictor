url: https://www.ptt.cc/bbs/movie/M.1608648839.A.6F5.html
title: '[普無雷]《順其自然的日子》勾起青春的回憶'
content: "雷文防雷資訊頁\n\n無雷心得推薦文\n\n網頁好讀版：\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n改編志村貴子同名短篇漫畫，電影包含四則跨越性別\n\
  與年齡的故事，看似毫無關聯，然而都在述說著對於\n感情，大家都是相同的心情，「不知道為什麼」。\n\n畫風很特別的作品，採用水彩畫的風格建構電影畫面。\n而角色像是由簡單的線條所組成，沒有過多生動的表情\n\
  變化，對白也極為簡單，卻似乎能夠看穿角色內心的想法。\n\n有別於前兩則故事有股陌生感，我最喜歡的是第三則故事。\n角色設定相當逗趣討喜，一來一往的對話也很有共鳴。\n\
  不過對於現今小學生的想法，竟已如此成熟感到吃驚......\n\n看完預告所預期的，是部看完心情應該會輕鬆許多的動畫小品。\n意外地從電影幽默敘事的風格中，感受到些許的惆悵感。那種不\n\
  知從何處萌生相當在意對方的心情，在感情世界裡是個相當平凡\n的日常吧。《順其自然的日子》用相當輕柔卻大膽的敘事口吻，\n述說著即將或正要踏入感情世界中的男女，最令人困惑的疑問之一。\n\
  \n\n『總有一天，戀愛時的苦痛，會化為一段美好的回憶。』\n\n- - - - - - - - - - - - - - - - - - - - - - - -\
  \ - - - - - - - - - - - - - - -\n\n\n《高雄電影誌K.M.M》 \n\n如果喜歡這篇文章，歡迎到粉絲專頁按讚，謝謝。\n\n\
  --\n\n比較少接觸漫畫，期待下面有人回答您囉，謝謝。\n\n\n如果喜歡小清新類型的作品，可以嘗試看看呦。"
