title: '[情報]蔡明亮《日子》泰坦廳搶先場贈親簽海報'
content: '轉自 蔡明亮臉書｜


  10月21日周六13:00 松仁威秀影城特地推出《日子》的搶先埸 將在我最喜歡的泰坦廳放

  映 這對我來說是重大消息 我要趕快來告訴大家 也請大家幫忙轉po這好消息


  我私心最希望觀眾在泰坦廳看《日子》使我想到我的影展經驗 荷蘭鹿特丹電影節的某一

  間大戲院 落地的超大銀幕 聲色效果超強 每個投射的影像都氣勢非凡 像我這種不講故事

  而追求畫面細節和質感的影像最適合不過了 2020年《日子》入圍金馬  就是在泰坦廳放

  映 也讓我印象深刻


  我跟雲霖說 安排我跟亞儂看泰坦廳的《日子》吧 我要陪觀眾一起看 結束後我會和聞天

  祥一起聊聊 還會拿到我跟亞儂的簽名海報


  ---

  《日子》TITAN SCREEN大銀幕獻映

  ▎ 蔡明亮X聞天祥 .映後對談特別場  ▎

  購票即可獲得 #蔡明亮導演親筆簽名「電影國際版A3海報」

  並可參加 蔡明亮導演及聞天祥老師之映後對談(預計40min)

  訂票連結：


  ------------------------------------------------------


  之前金馬在泰坦廳看真的蠻震撼的，最印象深刻的泰坦廳觀影經驗之一。

  推薦給大家。


  之後正式上映要在這麼大的廳播映機會應該不大了


  --'
