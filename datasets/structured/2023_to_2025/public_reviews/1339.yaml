title: '[討論] 過氣的演員或童星 後來都怎麼過日子'
content: '前些日子看到演小魔女的古靈精怪小女孩


  在12歲那年演出最後一部電影因為眾多壓力而退出演藝圈   成年後偶爾發表散文和寫專欄

  現在為了出書   還要回到公眾場合揭開自己傷心的過往


  這才想到  還有不少曾經絢爛一時的童星和一般演員


  如果不再受演藝圈青睞  他們都怎麼討生活？


  領失業救濟金？ 當酒店公關？被富商包養？

  當上班族？ 這一下就會被扒糞記者發現吧

  當業務賣商品？   去咖啡店打工？同上.....

  開店做生意  然後和過去的粉絲拍照？

  新天堂樂園的小童星多多就是這樣

  在自己的家鄉開意大利餐廳

  店裡掛滿新天堂樂園的海報和劇照....令人不勝唏噓


  還有其他的案例嗎？


  --'
