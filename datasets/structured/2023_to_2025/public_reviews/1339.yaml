url: https://www.ptt.cc/bbs/movie/M.1582898998.A.9C8.html
title: '[討論] 蔡明亮《日子》柏林場刊評分出爐'
content: '今年柏林影展唯一入圍競賽單元的華語片 蔡明亮的《日子》昨日於柏林首映


  場刊評分剛剛也出爐 綜合評分為3.3 排名第2





  而在俄國影評的綜合評分則是4.2 也是排名第2


  和洪尚秀的《逃走的女人》與俄國電影《DAU. Natasha》並列




  俄國影評的場刊評分第一是


  Benoît Delépine和Gustave Kervern聯合執導的《Delete History》


  綜合評分為4.4



  目前競賽單元還有兩部片尚未放映


  分別是潘禮德的《Irradiated》與Mohammad Rasoulof《There Is No Evil》



  分享三個片段給大家 應該是國際宣傳用的








  希望蔡導能拿個金熊啊!!!!!



  --'
