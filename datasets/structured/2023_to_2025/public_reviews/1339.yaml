url: https://www.ptt.cc/bbs/movie/M.1599162156.A.835.html
title: '[好雷]《紐約茶館》真愛挑日子導演新作療癒暖心`:'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  《紐約茶館》真愛挑日子導演新作療癒暖心



  時間發生在紐約的冬天，一家子飽受家暴的克拉拉(柔依卡山 飾)  帶著孩子們遠離父親

  理查(Esben Smed 飾)開車來到紐約，到公公家求援卻被斷然拒絕，只得靠偷竊、混入派

  對內偷食物，偏偏車子停在路旁的車子不見了，他們只好偷睡在稱為【冬宮】俄羅斯餐廳

  的餐桌底下，在社會底層維生，而另一方面家暴父親也透過他的人際網路，想找回他們。

  有天偷睡在餐廳他們被發現了，但是身為更生人的經理馬克(塔哈拉辛 飾)也很體貼，提

  供他的家讓他們安身；另一條線是個有點兩光的年輕人Jeff(卡賴伯蘭里瓊斯 飾)，找工

  作碰壁連連，常常做沒多久就被人辭退，有天被趕出租屋房子的他來到遊民的供餐所想來

  覓食，卻被誤認為是義工來幫忙。從此就留在教會、遊民食堂幫忙，也重拾自信心。幫助

  他的是一名斜槓護士愛麗絲(安德麗亞瑞斯波羅格 飾)，她也是【冬宮】的常客，平時正

  常上班，其餘時間就帶支援團體，以及發送遊民食物。但時間一長她也做得身心俱疲，甚

  至不去上班了，此時她的醫院伸出了橄欖枝，推了她一把，提供資源讓他又重新恢復起動

  力。



  電影靈感來自於「我總是仰仗陌生人的善意」劇作家田納西威廉。



  裡面的角色幾乎都是些日常生活的小人物，努力在艱困的環境中求生存，剛好有陌生人的

  伸出援手，否則恐怕都會餓死、冷死紐約街頭。有點令人意外的是片中的這些人剛好都遇

  到了好人幫忙，得以度過人生的低潮期及難關。但這也許也正是導演的用意，想拋磚引玉

  ，想告訴觀眾，世界上還是有許多美好的事情，只要我們關心留意，甚至去幫助人，都有

  可能帶來美好的連環效應。這裡面發生的故事特別暖心，但也加雜著曖昧的愛情調劑。



  裡面最喜歡的一幕是當克拉拉一家人偷睡在餐館的長桌下，經理馬克發現後卻不是驅逐他

  們，反而是貼心的提供餐點，還不時換餐，真的是一位迷人的大好人。



  導演瓏雪兒菲格之前執導的電影大部分為改編，包括像是電影《真愛挑日子》、《他們的

  美好時光》、《名媛教育》等作品，後兩者不太記得有沒有看過，倒是《真愛挑日子》是

  我的愛片，在愛情片名列前茅，這次看花錢進戲院看紐約茶館也是因為這個原因，想看看

  導演的新作有沒有什麼驚喜及新東西。



  這部片適合闔家觀賞，不限年齡，可以感受片中傳達的正面互助能量，療癒人心且感人。


  原始出處：



  --

  有閒來坐:D


  ~ 卵生水筆仔 ~



  --'
