url: https://www.ptt.cc/bbs/movie/M.1504544269.A.AAA.html
title: '[情報] 安妮特班寧主演《最後相愛的日子》首支預告'
content: '目前奧斯卡的兩大重點影展 － 威尼斯和特柳賴德影展都如火如荼的展開當中，其中已經

  有非常多部備受矚目的英語電影陸續首映，也陸續開出評價，奧斯卡獎季前哨戰也正式開

  打，而這之間有一位演員是絕對不容忽視的，也就是美國資深實力派演員 Annette Bening

  ！


  Annette Bening 今年來勢洶洶，同時在秋季獎季開戰的初期擔任了威尼斯影展主競賽單元

  的評審團主席，而他主演的另一部新片《Film Stars Don''t Die in Liverpool》（台暫譯

  ：最後相愛的日子）也同時在前日於特柳賴德首映，並且開出了整體中上的評價，包括衛

  報給了四顆星、The Playlist 給了 B，不過 IndieWire 給了 C-，雖然意見有些分歧，但

  似乎沒有到兩極的評價，整體還有偏佳的口碑，而其中當然 Annette Bening 的演出獲得

  了高度的讚譽。


  然後今天釋出了首支預告！


  連結：


  有趣的是，EW 在一篇整理各家評論的文章中提到了認為 Annette Bening 在這次的獎季中

  是不會缺席的，並認為他很有可能在他這第五次的入圍拿下他早開拿到的小金人，為何如

  此說？除了 Annette Bening 的絕佳演技之外，有趣的是這部電影在北美的發行商是索尼

  經典，他們認為 Bening 有機會依循 2014 年 Julianne Moore 以《我想念我自己》的路

  線封后。


  除此之外，劇中飾演 Bening 戀人的 Jamie Bell 也同樣交出好表現，依然有不小機率搶

  男主（配？）的入圍名額。


  《Film Stars Don''t Die in Liverpool》在美國及英國的發行商分別是索尼經典和獅門影

  業，都是相當具規模的發行商，看來 Bening 今年的確有不小的機會在 90 大屆封后！


  台灣已由 CatchPlay 代理，預計 2018-01-19 上映。


  中文簡介：


  ★ 入選 2017 多倫多影展主展映單元

  ★ 真人真事改編 年輕演員與傳奇女星在生命最後共擁最璀璨的愛情

  ★ 金球獎影后 安妮特班寧 X 英國奧斯卡影帝 傑米貝爾 真摯動人的完美演出


  本片改編自英國演員彼得特納（Peter Turner）的回憶錄，描述他與好萊塢傳奇女星葛洛

  莉亞葛拉罕（Gloria Grahame）之間的羅曼史。1981年，葛拉罕到英國演出，罹癌重病的

  她向前男友特納求助，特納帶她前往老家利物浦休養，也為葛拉罕在所剩不多的生命時光

  中，帶來無比的慰藉與勇氣，更讓葛拉罕在人生最後展現最耀眼的光芒。


  班寧衝一個啦！！！！


  --'
