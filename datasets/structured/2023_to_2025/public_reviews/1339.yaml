title: '[新聞] 蔡明亮為日子上街賣票 兩個月售8千張票'
content: "蔡明亮為日子上街賣票 兩個月售8千張票\n\n2023/10/17 05:30\n\n\n蔡明亮（左起）和《日子》主角亞儂、李康生一同上街賣票。（汯M電影提供）\n\
  \n〔記者鍾志均／台北報導〕導演蔡明亮的電影《日子》與展覽《蔡明亮的日子》將在台同\n步展映，他自2001年執導電影《你那邊幾點》起開始上街賣票，至今超過20年，這次他同\n\
  樣親力親為，從8月初至今勤跑30場活動，銷售近8000張票，毅力驚人。\n\n蔡明亮放下「國際名導」身段，親自走入人群，遇到熱情粉絲將《愛情萬歲》電影海報刺\n\
  青在自己身上，也遇過太激動，全身發抖的粉絲，無論影迷要求簽名或合照，蔡明亮皆來\n者不拒。\n\n有感於近年體力不如往年，蔡明亮仍致力美學教育，他說：「《日子》也許是我最後一部\n\
  劇情片了，也可能是我最後一次上街賣票了。」\n\n另外他也分享道：「在街頭賣票的感覺很奇妙，剛開始賣時很不好意思，有時甚至覺得丟\n臉，很想逃走，直到終於有人願意靠過來，聽我講話。」認為和觀眾相遇就是機緣，對此\n\
  非常珍惜；《日子》27日全台上映，展覽《蔡明亮的日子》同日於北師美術館開展。\n\n--\n佛教經典的\n是 是菩薩成佛之道\n        是 佛經\n \
  \ 是 佛        是 菩薩\n\n\n\n--"
