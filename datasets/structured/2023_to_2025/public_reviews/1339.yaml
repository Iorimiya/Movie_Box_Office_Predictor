title: '[好雷]  我發瘋的那段日子'
content: '我不是職業影評者。

  看完這部電影，我情緒激動走出電影院。


  這部電影敘述非常簡單，起承轉合剛剛好。

  那為何是好雷？


  當發瘋時，過去稱之為神經病，現在稱之為身心失調。嚴重病症者，思覺失調症，躁鬱，

  憂鬱。


  我們多少都有貼標籤的傾向。如果這發生在台灣，那人不是到身心科病房。不然就是求神

  問卜、喝符咒。可能還說這是業障病。在如此醫學和身心靈療法發達的國家，這部電影帶

  來的省思值得深討。腦神經科學的研究是個未知的世界。


  關於腦部病變，主角演得恰到好。

  彷彿像失了魂的身體，不受控制。



  如果沒那些支持她的家人愛人同事，活下去的機率渺小。

  幸好他父母堅毅不屈的信念也救了她。

  雖然他老爸常也會失控。




  我有同樣類似的病症，共處了十餘年。

  在台灣目前的環境是無解的謎。




  如某人所說，非在其境，難以體會。



  那些神經病的標籤，大部分深植在意識中。


  自言自語的流浪漢、突然大吼大叫的路人，忽然脫光的脫軌行為、胡言亂語....


  甚至暴力行為，都有可能是腦神經醫學可探究的範圍。


  這是我看完的感想




  --'
