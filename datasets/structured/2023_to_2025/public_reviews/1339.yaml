url: https://www.ptt.cc/bbs/movie/M.1582941616.A.5D8.html
title: '[新聞] 蔡明亮《日子》勇奪泰迪熊評審團獎'
content: '新聞網址：


  導演蔡明亮執導新作《日子》日前代表台灣參與第70屆柏林影展，而在今日清晨，傳出作

  品肯定的好消息，《日子》率先於會外單元獎項獲獎，勇奪柏林影展泰迪熊評審團獎肯定

  。


  蔡明亮上台時首先感謝泰迪熊獎，接著表示：「我要把這個獎獻給我生活的一個最開放、

  最自由、最有包容力的，我生長生活的地方台灣，謝謝！她在前年通過了婚姻平權法，我

  希望更多的國家跟上來！」而在《自由時報》的獨家專訪時他表示，「泰迪熊獎台灣拿到

  很多個，這個獎跟台灣很有緣，我們會跟這個獎很靠近，也因為我們是一個這麼開放的社

  會。」並補充「證明台灣是一個非常自由、包容，很有愛的一個地方，創作也不會受限」

  。


  蔡明亮於柏林影展間也參與文策院舉辦的大師講座，近幾年威尼斯影展常選入蔡明亮的作

  品，去年他受邀前往威尼斯影展，參與威尼斯影展以4Ｋ修復《不散》的經典單元放映活

  動。蔡明亮指出，像他這種適合被放在美術館放映的電影，是一種新的概念與可能，在歐

  洲已經是習以為常的映演方式，但在亞洲這樣的形式正在萌芽階段，特別到場支持的威尼

  斯選片人波萊契（Elena Pollacchi）在現場也頻頻點頭稱是。


  蔡明亮導演以經典歌曲、懷舊電影以及生命經驗，圍繞著此次講座的主題「工業時代的手

  工電影」，也讓柏林的影人聽眾們，重新對於蔡明亮導演的創作理念，有了更深的認識。

  蔡明亮導演入圍主競賽片的《日子》，已於柏林時間2月27日舉行世界首映會，競賽結果

  將於2月29日宣布。


  -------------------------------------------------------------------------------


  恭喜蔡導！！！


  期盼稍晚也能有好成績！！！


  --'
