url: https://www.ptt.cc/bbs/movie/M.1663050799.A.A4E.html
title: '[情報] 2023 烏克蘭奧斯卡代表：《沒有煙硝的日子》'
content: '烏克蘭在日前公布了提交 2023 年奧斯卡「最佳國際影片」的作品，將以《沒有煙硝的日

  子》（Klondike）作為代表。




  《沒有煙硝的日子》為烏克蘭女導演 Maryna Er Gorbach 的最新作品，今年初於「日舞影

  展」的「世界劇情片競賽單元」首映並且拿下「最佳導演獎」，後續再度入選柏林影展的

  電影大觀單元，且獲得會外的「基督教評審團獎」。


  「2014年頓巴斯戰爭爆發，位於烏俄邊界、烏東的頓涅茨克（Donetsk）首當其衝。居民伊

  爾卡的客廳被親俄勢力炸出大窟窿，懷有身孕的她不願撤離，堅持整修快崩塌的房子。然

  而丈夫托里克暗自盤算帶她投奔俄羅斯，伊爾卡親烏的弟弟也想帶她撤離邊界。直到有天

  ，一架波音客機墜毀在他們家門前。


  客廳的大窟窿，彷彿成為凝視這場戰爭的大景框。本片作為 2022 年烏俄戰爭爆發後的「

  反戰電影」之一，雖然時空背景設定在頓巴斯戰爭發生不久、馬來西亞航空 MH17 班機失

  事的 2014 年，但戰爭與悲劇帶來的創傷，並不僅止於這座烏俄邊界的小村莊。 伊爾卡

  會為了小孩離開家園嗎？戰爭的創傷會慢慢癒合嗎？導演透過這名烏克蘭女人的視角，向

  世界控訴女人如何成為戰爭的犧牲品。」（取自 高雄電影節）




  這是導演 Maryna Er Gorbach 首次代表烏克蘭征戰奧斯卡。烏克蘭因為國家歷史的關係，

  一直到 2003 年後才穩定的提交電影競逐奧斯卡，至今雖尚未獲得任何提名，但曾推派出

  不少在國際上廣受好評的作品，如《著魔的國境》和《末日荒蕪詩篇》等片．


  《沒有煙硝的日子》將由政駒發行，今年的高雄電影節上策劃了導演專題。



  --'
