title: '[好雷]<志明與春嬌>有菸抽的日子 '
content: '看完<志明與春嬌>的一些小感想




  抽菸

  吸進去的是毒，卻讓人舒服。

  吐出來的是煙，讓人彷彿成仙。

  外包裝的恐嚇圖片毫無嚇阻作用，

  就算菸稅漲了還是照抽無誤。

  你抽了好幾年的菸以為已經戒不掉，

  但其實只是沒有個理由而已，所以就繼續抽著。

  習慣了濃菸，不見得抽不慣淡菸，更不是不可能離開菸。

  沒有菸抽的日子也自在，但懷念的是一種依賴。

  你說抽菸和愛情有什麼不同?大概是被菸蒂燙傷的疤，比被愛情傷到的心容易復原多了吧。

  都市男女的愛情，來的可以這麼快，

  快到成了無法適應的轉變，再漸漸轉變成無法持續。

  沒有時間拐彎抹角、沒有心力疑神疑鬼，只求直接坦率，只貪享受當下，只願付出無悔。


  這是一部可以好好回味一番的電影，

  就像《愛在》三部曲一樣，相信每次回頭看都能有不同的感觸。

  角色們看似對愛情灑脫，各個是情場老手，

  但當收到簡訊或終於等到對方回應時的一抹傻笑，

  才發現在每段愛情中，大家都還是回到新手的程度。

  電影中時代的簡訊傳情，有著現在Line無法取代的曖昧和浪漫，真是讓人懷念。

  電影的台詞看似隨便，卻覺得有很多值得再解釋的空間，

  搭配舒服的配樂還有輕鬆的步調，沒什麼高潮卻值得細細品味。



  推薦給大家~


  --'
