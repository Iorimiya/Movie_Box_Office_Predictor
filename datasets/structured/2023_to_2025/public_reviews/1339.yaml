title: '[好雷] 蔡明亮 日子'
content: '~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  平常是潛水ptt或是出沒ＷＯＷ、ＰＳ版的宅宅　

  好久沒ｐｏ電影心得文


  關於這部片的賞析跟故事敘事，可以參考爬文３年前

  聞天祥老師為日子所寫的影評　很詳盡的電影導讀


  我在看日子之前不是蔡明亮的影迷，我自己看過的作品依序是

  2005年天邊一朵雲，當時媒體都在宣傳最後那場戲，也因話題性獲得很好的票房

  2017年　家在蘭若寺ＶＲ短片　在金馬影展看的

  在蘋果準備2024年推出Vision pro的時刻 蔡導很早就有VR作品

  2019年 你的臉紀錄片 整部片凝視13張臉孔 打光非常精彩

  算是最艱澀or很難欣賞的作品


  在2020年日子獲得柏林影展泰迪熊獎之後有注意到這新聞

  2023年隨著解封跟還有跟今年同志大遊行同一週全台上映 算是一個宣傳安排


  自己看完蔡導的日子 ，就是在鏡位、打光、人物日常，畫面美感

  去摸索到自己有吃到電波的魔幻時刻

  還有電影院觀看日子當下 整廳的觀眾沉浸在無對白 或是出現男男按摩高潮戲碼時

  共感整廳觀眾的欣賞 or 不自在?尷尬的?

  也是很有趣的體驗

  (我印象最深刻的共感體驗就是2004年的吉姆卡維佐受難記

  整部廳的人一直有拿出面紙的細碎聲音 哈哈 哭的超慘)


  就是如同去美術館看畫的感覺去入門蔡導作品就可以了

  塩田千春：顫動的靈魂當時在北美館大展 當時在台灣展覽的人潮轟動

  也代表台灣是可以 有很好的藝術欣賞

  只是這次 是到電影院看罷了


  今天看完日子會想po文最大的原因是

  侯導退休 跟 馬修派瑞的新聞

  有一個為台灣電影爭光非常多回的大導蔡明亮還在努力拍電影 還在產出

  還在華山奔波賣票，導覽自己電影

  李安導演的李小龍 也面臨好萊塢罷工停止製作


  希望能多一點點，多幾個網友，願意珍惜這位大師 進影院支持一下蔡導


  新人寮國演員亞儂是小鮮肉  或許對同學 或是女性觀眾

  會有不錯的觀影體驗??? 哈哈(文章歪掉)


  最後也想祝福蔡導身體健康~










  --'
