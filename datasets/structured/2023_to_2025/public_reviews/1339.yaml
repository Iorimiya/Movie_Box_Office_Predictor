url: https://www.ptt.cc/bbs/movie/M.1739342087.A.D81.html
title: '[極好雷]《河畔小日子》：怎麼能不愛荻上直子！'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n《河畔小日子》極好雷影評：怎麼能不愛荻上直子\n\
  \n當初首刷走出電影院，沉澱了一下，我轉頭跟同行友人說：\n\n\n看他們吃飯也哭、開心吃高級壽喜燒也哭、閉上眼睛，單純聽最後重複的笛聲也哭。二刷\n之後，一直想戳中淚點的到底是什麼？我想可能是，裡面的\n\
  \n\n這個作品既架空又寫實。他們都善良的不可思議，即便有些防心，也都保持基本的信任和\n善意（現實生活難得一見）。但當你細究他們的人生，每個人都有自己的過去和糾結，遺\n\
  憾與缺陷讓角色更加真實平凡。\n\n\n#貧窮與死亡的觀點辯證\n\n\n這部電影交代人物故事手法有兩種，一種是周遭角色的口耳相傳，第二種由角色親自演繹\n，為的就是讓觀眾體驗觀點轉換的力量。拿電影裡關於貧窮的詮釋為例：同樣是種菜自給\n\
  自足，鄰居島田給自己「極簡主義者」的稱號，和尚小剛則在島田口中，變成生意失意下\n不得已的選擇。\n\n他窮是真的窮，但你也無法反駁島田大叔的觀點：即便外人眼裡他擁有的不多，他的確過\n\
  得逍遙自在。他活得非常明白也滿足。\n\n《河畔小日子》也討論到面對死亡的心態。房東南對已逝的丈夫充滿懷念不捨、墓碑銷售\n員溝口說這是我們必經的過程，不必害怕、小孩子們則天真懵懂，可以用想像力編織故事\n\
  說服自己，靈魂去到了更好的遠方。主角山田則是在看過這麼多不同的態度和選擇後，從\n不知所措，漸漸地修復整合，走向接受與放下。\n\n除了客觀定義生與死、富與貴，你自己對於這些的看法呢？怎麼樣的活法、死法，能讓你\n\
  由衷滿意的笑？\n\n\n#微小幸福的具象化\n\n\n\n\n\n\n\n當屋外的風雨喧囂宛如地獄之聲，可以選擇更認真品嚐嘴裡踏實的小確幸。\n\n\n二刷之後，它精妙捕捉了人際距離細微的進退和游\n\
  移。孤獨不斷蔓延，同時滿溢著愛，以及對愛的渴望。\n\n每當心底升起對活著的疑惑時，不妨回想這部《河畔小日子》。那些微小而真實的體會，\n可能藏在對陌生人的突兀坦白、炎熱午後大口咬下的清爽黃瓜（還有讓人口水直流、粒粒\n\
  分明的白米飯），或者每個讓你由衷說出「咦？」的奇妙瞬間。\n\n\n\n\n\n電影配樂：\n\n-\nIG：Fishpond_like \n臉書：魚池 FishPond\
  \ \n個人網站：\n\n--\n樓上 這禮拜還有場次～"
