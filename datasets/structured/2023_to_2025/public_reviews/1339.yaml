url: https://www.ptt.cc/bbs/movie/M.1705919433.A.9FC.html
title: '[  雷] 真愛挑日子'
content: '防雷
































































  情節狗血了點,道德更是瑕疵了點

  我還是蠻喜歡這部電影的,很多人在噴的點也沒有錯啦

  以理性角度來看會很問號(可能再加驚嘆號)

  但我當時被感性牽著鼻子走

  所以用了另一個角度去看他們

  應該是說片中的很多行為都能用不同角度

  像女主角交往過的老兄為例

  他很可憐跟一個沒那麼愛她的交往

  也可以說在感情中不被愛的才是第三者

  單看要怎麼去解讀罷了

  還有片名可能也一定程度誤導了人

  主要在於真愛的定義適不適用在男女主角的感情

  總之要覺得浪漫也可以,要覺得愚蠢也可以

  比起男女主角的瞎我更想用他們的契合和成長看待

  至少女主角死前的那段時光我真心祝福

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  你在明天將變成蛇，於是便會開始吃人，

  你吃人的那張嘴依然說還愛著我，

  而我真的能像今天一樣，說出自己還愛著你嗎？


  --'
