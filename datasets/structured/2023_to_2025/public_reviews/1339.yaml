url: https://www.ptt.cc/bbs/movie/M.1667904950.A.90D.html
title: '[雷] 竹劍少年 台版陽光燦爛的日子'
content: '感謝linmiou板友贈票

  週末看了張毅導演的竹劍少年

  想說不發個心得說不過去


  因為大部分人都沒看過

  所以簡單流水帳下劇情

  基隆港邊高中青少年六人幫

  頭頭是文青麥子（侯冠群飾演）

  麥子父在美國

  麥子時常寫信給他

  母親在基隆鬧區開時裝店

  家住和式洋房

  母親與一個叔叔有曖昧


  其他成員有雙胞胎（李志希、李志奇）

  一個胖子（九把刀說過的胖子定律）

  及其他兩個不重要的成員


  少女Sunny（田麗飾演）常與他們鬼混

  但也常周旋於其他港邊碼頭工人們


  暑假開始

  一個水手丁由在Sunny生日當天與六人幫結識

  自稱跑船去過里約的丁由

  從此衝擊這群青少年的生命


  當晚生日派對在麥子家舉辦

  丁由跳起了森巴舞

  還邀請麥子母親共舞

  胖子與其他夥伴為了Sunny 爭風吃醋

  胖子出門買飲料時被碼頭工人混混們欺負


  隔日麥子去找Sunny

  觀眾才會知道Sunny家是打鐵的

  她一直想逃離基隆

  連名字都故意取個洋化的

  丁由也去雙胞胎家的碼頭冰庫工作


  一日八人聚會時

  胖子手持竹劍

  原來是為了自衛而去學劍道

  眾人便跟著一起到道場觀摩

  眾人皆瞧不起劍道

  丁由還去挑戰劍道師傅

  結果比劍時慘敗在師傅手下

  眾人因此心悅誠服加入學習劍道

  丁由也因為滿滿的費洛蒙

  出人意料的行為舉止

  成為整個團體的Alfa 男


  麥子對丁由是不太服氣

  一日眾人決定看A片

  接著麥子跟丁由打起青少年的嘴砲

  之後丁由帶著除麥子外的眾人去登Dua狼

  麥子心情鬱悶回家

  卻意外看見母親與叔叔在親熱

  麥子被激到隔天一大早就強拖帶拉丁由

  讓自己也去登Dua狼

  結果事後才知道其實前一天大家都臨陣脫逃了

  最終真正有登Dua狼的只有麥子一人


  麥子與丁由打了一場劍道之戰

  麥子之後搬離家中與丁由一起居住

  也到雙胞胎的工廠工作

  母親到冰櫃裡找麥子回家

  麥子卻不願相見

  丁由指責麥子辜負母親

  也揭露自己是孤兒的身分


  一日眾人聽聞有女學生在森林公園被強姦

  大夥決定到公園行俠仗義

  剛開始找不到犯人

  故決定以Sunny為誘餌

  沒想到Sunny差點被奸

  眾人才找出兇手是敵對的碼頭工人

  用竹劍教訓了一番後

  來到中元普渡當天

  Sunny被擄走輪姦

  對方還來到冰櫃嗆聲

  丁由一氣之下拿鐮刀砍對方鎖骨

  眾人把丁由藏到秘密山洞中躲警察

  Sunny來到山洞請求丁由帶她上船離開台灣

  丁由才揭露以前自己都在吹噓

  他沒上過郵輪

  沒去過里約

  內心受不了的丁由逃離山洞而被警察抓獲


  六人幫決定以暴制暴

  拿著竹劍到基隆夜市襲擊敵對的碼頭工人

  最終也全被警察抓走


  但最終麥子母親到警局保釋眾人

  也向麥子說自己與麥子父親早已離婚數年

  自己並無不忠

  麥子才知道原來父親在心中的完美形象全是假的


  最終結局麥子搬回家裡

  丁由上了漁船出海

  六人幫在海堤上為他送行

  而Sunny卻從此消失不見了

  —————-結束———-


  看完心得

  直覺就是這部是台灣版陽光燦爛的日子

  儘管姜文拍陽光的時間還要晚了十年


  主要是兩者所要描繪青春成長故事

  都離現實的中國、台灣一般年輕人太遠

  陽光燦爛的日子是一群軍中大院的紅色子弟

  而外邊正在因為文革而天下大亂呢


  竹劍少年是一群高級外省人的青春故事

  住洋房開趴體

  讀著當年諾貝爾文學獎作品

  父親在美國

  家裡開高級時裝店或進出口生意

  主角們拿著劍道竹劍到處傷人

  最後竟然如無事般準備開學

  Sunny則不過是個崇洋的本省女子

  儘管令這群外省子弟魂牽夢繫

  丁由則是個低級外省人孤兒

  儘管衝擊六人幫的世界觀

  但仍只是他們生命中的一抹流星

  是這群人的成長踏板罷了


  看完這部片

  突然體悟到我為什麼這麼討厭陽光燦爛的日子

  根本是姜文的自我陶醉之作


  --'
