url: https://www.ptt.cc/bbs/movie/M.1569057648.A.C1A.html
title: '[好無雷] 《返校》堅忍的年代，共體時艱的日子'
content: '昨晚看完返校真的很感動，在那個政局動盪不安的時刻，大家能一起共體時艱得走過，除

  了團結還是團結。


  看著學生一起唱國歌，讓我不爭氣地冒出淚水在眼眶裡滾動。唯有這樣的精神與態度，大

  家才能共同成長與進步。因為隨時都有可能因為密、盜、亂、唆等行為，讓國家、讓台灣

  在一瞬間變成對岸的囊中物，更不用說從學校裡學習知識、認識朋友。


  白教官其實也是個鐵漢柔情的軍人，從他在搜書包時，叮嚀學生「這樣會被記過der」的

  語氣，讓我想起了我的教官。當初要是沒有教官拉我一把，我可能行為就次偏差。就如「

  握手不一定友好，責備不一定仇恨」，我想白教官最後的行動是當他對面到問題時，表現

  的工作態度及專業性。試問007遇到敵方時還能跟你嬉皮笑臉、睜隻眼閉隻眼讓事情過去

  嗎？再說我們是以上帝視角來看返校的事發過程，所以很容易分辨清白與冤枉，但假如今

  天我們身為是當事者呢？在那個動盪的年代，誰能保證張明輝真的是張明輝？阿聖是不是

  易容後的假阿聖？殷老師又是不是另一位川島芳子？


  自由得來不易，隨手可得又不能珍惜

  最後謝謝國家先烈、謝謝阿兵哥們、謝謝白教官，也謝謝生活在那個年代的人們。


  --'
