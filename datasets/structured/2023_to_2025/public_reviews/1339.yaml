url: https://www.ptt.cc/bbs/movie/M.1523764986.A.FF4.html
title: '[好雷] 《最後相愛的日子》，風華絕代，傳奇謝隕'
content: '葛洛莉亞對彼得曾說：「每個人都在等待角色上門。」，可往往最令人懼怕的，就是再也

  沒有角色找上門，所以葛洛莉亞才會選擇轉換跑道，從電影跑去演舞台劇，看看是否能演

  出事業第二春。因此若你要說《最後相愛的日子》是部愛情電影我也找不到理由反駁，可

  就我眼裡看來，這更像是一部關於好萊塢明星的浮沉錄，從本來默默無聞如你我般的彼得

  透納的角度來看與敘事，一切顯得更為心酸。




  「最愛獨角戲，因為台詞全都是你一個人的。」


  電影開頭事葛洛莉亞坐在梳妝台前，為了演出舞台劇《玻璃動物園》做準備，只是當她要

  準備上台的時候卻因身體不適倒下，但她卻不願接受建議送醫院檢查，而是選擇請人連絡

  前男友彼得透納，然後與之一同回到彼得家鄉利物浦，葛洛莉亞住進了彼得家，接受其家

  人照料，拒絕讓家人知道她生病的消息。當時還不知道葛洛莉亞罹癌的彼得，就這樣開始

  陷入了回憶之中。《最後相愛的日子》便從此開始，一路過去與現在來回穿插著，透過彼

  得的角度，訴盡他如何與葛洛莉亞相識、然後相戀、再到最後爭吵分手的一切經過。


  劇場小演員彼得透納，因緣際會下住到了大明星葛洛莉亞葛拉罕的隔壁，一日葛洛莉亞因

  為接下需要跳舞的角色，於是她提出請彼得喝酒、然後他當她舞伴練習的提議。本來兩個

  八竿子打不著的人就這樣結識了，並且越走越近甚至產生了曖昧情愫，最後兩人依著自己

  的心選擇彼此成為伴侶。電影跟著彼得前進與後退，從他的眼神裡去看這段感情，以及他

  們之間曾存在過的矛盾與爭執，當然最重要的就是葛洛莉亞的「感受」與「想法」，對彼

  得而言許多開玩笑的詞句，聽在葛洛莉亞耳裡卻可能變成極其在意的嘲諷，例如年紀、例

  如衰老。而葛洛莉亞也相當在乎「面子」，當她開心帶著彼得到家裡作客，姐姐卻句句帶

  刺，不僅用她最喜愛的莎士比亞的經典劇《馬克白》裡的馬克白夫人形容她，更揭露她第

  四任丈夫是自己的繼子（第二任丈夫的兒子）的「醜聞」，這令葛洛莉亞氣炸離去，留下

  來的彼得聽見葛洛莉亞母親對他說「千萬不能娶葛洛莉亞，不論她如何拜託你。」，究竟

  葛洛莉亞是位怎樣的女人，讓母親和姐姐都這樣子看待她？


  或許從這開始，彼得才懂得放下熱戀期的衝動，冷靜地開始思考這段感情，並非不愛了，

  而是在思索著他愛上她的理由、這段感情的本質，還有經營這段感情的方法等等，當思考

  通了這些，他才能真正的且義無反顧的愛著葛洛莉亞。




  「反正這輩子一直有人離開我。」


  電影近尾聲時，進入了彼得和葛洛莉亞爭吵分手的部分，導演先讓觀眾從彼得的角度去看

  事，葛洛莉亞沒來由的爆發留給彼得（和觀眾們）一個問號，就好似單方面被分手的人，

  根本不知道自己做錯什麼，就這樣帶著各種情緒回到單身，幸運的人可能會在許多年後，

  從當事人、從旁人口中聽見當時的真相，然後看是要原諒還是不諒解，祝福對方找到更好

  的人，或者一輩子再也不相見。若沒那麼幸運的人，終其一生可能都只能繼續現在困惑裡

  ，茫茫然然地找下一段感情。而慶幸的是，彼得和觀眾都是幸運的，最後導演將視角切換

  到「主角」葛洛莉亞身上，透過她那雙盈滿淚水的雙眸，去拼湊出整件事情的始末，她對

  感情的堅持與固執，還有她對彼得的愛，遠遠勝過於其他所有。


  「給你越多我就越富有，只因兩者皆無窮盡。」


  《最後相愛的日子》最感人橋段，便是彼得租下劇場，邀請葛洛莉亞與自己在台上演出《

  羅密歐與茱麗葉》，這部葛洛莉亞最想演出的莎劇，即便葛洛莉亞已經沒有體力演出了，

  他倆依舊坐在兩張椅子上，單靠著聲音傳達對彼此的情感，愛戀、不捨、滿足，短短幾分

  鐘不到的戲，是影響著能否將這段愛情故事演進觀眾心底的關鍵。若能成功，飾演葛洛莉

  亞的安妮特班寧功不可沒，她的舉手投足、一顰一笑都散發著熟女的性感與調皮，輕而易

  舉的勾住傑米貝爾的心並成功說服住觀眾，最後幾場戲安妮特班寧根本鎮壓全場，完完全

  全展露出她早該獲奧斯卡肯定的高明演技。而飾演彼得透納的傑米貝爾戲分最多，他幾乎

  都是靠著眼神再帶領觀眾走進這部電影與他們的回憶，若不小心極可能會被吃掉，可說演

  出難度不小於安妮特班寧，兩人此次搭配意外契合，與故事本身達到絕妙平衡，值得一看

  。


  --

  感謝指正'
