url: https://www.ptt.cc/bbs/movie/M.1494078228.A.72C.html
title: '[新聞] 新片看板 喜歡你戰我發瘋的那段日子'
content: '（中央社記者王靖怡台北6日電）演員金城武與金馬影后周冬雨主演「喜歡你」，迎戰金

  獎影后莎莉賽隆監製「我發瘋的那段日子」、以跨越時空為題材的「與妳的第100次愛戀

  」及恐怖片「驗屍官」。


  1.喜歡你（This is not what I expected）改編網路暢銷小說，剪輯師許宏宇首度執導

  演筒，導演陳可辛與許月珍共同監製，由男神金城武及金馬影后周冬雨主演，藝人林志玲

  與楊祐寧助陣演出。金城武化身霸道酒店總裁，周冬雨飾演個性迷糊的酒店廚師，譜出浪

  漫情緣。


  2.我發瘋的那段日子（Brain on Fire）改編真人實事自傳小說，奧斯卡金像獎影后莎莉

  賽隆（CharlizeTheron）監製，好萊塢女星克蘿伊摩蕾茲（Chloe Grace Moretz）主演。

  描述「紐約郵報」記者蘇珊娜卡哈蘭罹患罕見疾病，歷經病情爆發、誤診與長期住院後，

  幸運獲得正確診斷而治癒康復過程。


  3.與妳的第100次愛戀（The 100th Love with You）以跨越時空為題材，由演員(土反)口

  健太郎及歌手miwa主演，描述大學生「葵海」出車禍，驚醒發現在課堂，當她困惑時，青

  梅竹馬「小陸」說「我可以回到過去」；為改變命運，「小陸」回到1年前，兩人成為戀

  人，但車禍那天又將到來。


  4.驗屍官（The Autopsy Of Jane Doe）描述市區發生神祕凶殺案，整家人都死了，一具

  完好女屍被埋在樹下，驗屍官父子受警方所託，調查女屍死因，當他們解剖後發現死亡關

  鍵，她的可怕祕密也喚醒所有躺在太平間的屍體，綁在查殮屍體腳踝的銅鈴也鈴聲大噪。


  新聞網址：


  --'
