title: '[情報] 《順其自然的日子》動畫電影公開前導視覺'
content: "《順其自然的日子》動畫電影公開前導視覺圖與特報影片、製作團隊\n\n（巴哈勇者：楓月 報導） 2019-11-22 14:58:13\n\n原文出處\
  \ \n\n志村貴子所創作的漫畫《順其自然的日子》宣布將推出動畫電影，官方近日公開前導視覺\n圖與特報影片、製作團隊，將於 2020 年初夏在日本期間限定上映。\n\
  \n\n\n《順其自然的日子》講述了各種各樣的隨處可見的戀愛故事。製作團隊部分，監督為佐藤\n卓哉（《牽牛花與加瀨同學》、《時光沙漏 fragtime》等）、角色設計為佐川遥（《山\n\
  田君與 7 位魔女》作畫監督等），動畫製作則由 LIDEN FILMS 京都工作室負責擔綱製作\n。\n\n\n\nSTAFF\n\n原作：志村貴子「どうにかなる日々」／太田出版\n\
  監督：佐藤卓哉\n演出：有冨興二\n腳本：佐藤卓哉、井出安軌、冨田頼子\n角色設計：佐川遥\n色彩設計：仲村祐栄（BeLoop）\n美術監督：齋藤幸洋\n撮影：髙津純平\n\
