title: '[好雷] 真愛挑日子 － 最終，我們都是自己一個人'
content: "我記得「與神對話」裡有段話：\n「我們無法藉由另一個人來讓自己完整，\n  但是沒另一個人，我們卻誰也不是。」\n這真是人生裡最難以理解、\n\
  也最奧妙神奇的地方。\n\n\n劇中的男主角Dex，\n在我看來，就是個無法獨處的人。\n因為他從小就帥、幽默、又渾身散發著光和熱，\n所以很自然地吸引到一堆人，根本不用學著獨處，完全不愁沒有人陪。\n\
  但可惜，這樣的人，沒辦法靠本錢吃喝一輩子。\n\n我記得國學大師南懷瑾說過：\n「最不幸的就是天生完美的人。\n  他可能從小就因為太優秀、一切來得太輕易，\n\
  \  而學不到謙卑和努力、學不到對弱者的同情。\n  他會很容易被人生擊垮，只能緬懷年輕的榮光。」\n\n男主角Dex，活脫脫就是這段話的寫照。\n他年紀輕輕就成為節目主持人，\n\
  卻在三十幾歲時一無所有。\n\n而女主角Emma，則是另一個相反的對鏡。\n在前面那段話之後，南老師還說了下文：\n「最幸運的就是那些有才華、卻從小沒自信的人。\n\
  \  人生會慢慢琢磨他們、讓他們培養出自信，\n  然而，他們卻會因為幼年的沒自信，而學會謙卑和努力。\n  也因為他們知道奮鬥就能得到，所以相信一切會更好。」\n\
  Emma的人生，就是如此。\n我們看到她越來越美、成就越來越高，\n男主角卻越來越頹圮、把自己搞得越來越糟。\n\n\n而很美的是，他們真的在一起了。\n更美、卻更哀傷的是，\n\
  Emma愛著他、卻不得不離開他。\n\n我很喜歡片中Dex的神情轉變，\n特別是他在Emma走後的樣子。\n他老了，開始有白頭髮，\n臉上仍有一抹玩世不恭的笑\n\
  但卻更沈穩、更有力量，更堅定。\n那是被淬鍊過的神情。\n\n\n我想起自己三十多年來所經歷的榮光和傷痕。\n我沒有男主角那麼完美無缺，\n卻也不像女主角那麼卑微。\n\
  我介於南老師說的幸與不幸之間。\n我明白輕易得手的狂妄，也瞭解一無所有的心碎。\n這幾年學會了謙卑和努力，還有面對人生的勇氣。\n所以我看著男主角的神情，\n\
  被深深地觸動著。\n\n我猜，\n他應該已經學會獨處了吧，\n他應該已經學會腳踏實地、不糜爛了吧。\n或許他也已經明白，\n不論我們這輩子深愛過誰，或曾被誰深深愛過，\n\
  在生命的最終、在面對死亡的那一瞬，\n我們都得自己走，沒有別人。\n\n這個體悟有點哀傷，\n但我卻在明白到這點後，\n愛得更加深切和寬闊。\n因為我們會明白，\n\
  無論如何緊抓不放，\n在最終的最終，是怎麼努力都抓不住的。\n\n\n啊，人生。\n「我們無法藉由另一個人來讓自己完整，\n  但沒有別人，我們卻誰也不是。」\n\
  這實在是太深奧了啊。\n\n--"
