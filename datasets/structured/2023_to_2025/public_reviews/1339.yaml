url: https://www.ptt.cc/bbs/movie/M.1766152331.A.5A5.html
title: '[好雷] 《旅與日子》旅と日々 '
content: "現正上映中\n\n\n2025盧卡諾影展金豹獎\n改編漫畫家柘植義春的《海邊敘景》與《哄亞拉洞的弁先生》\n惠子不能輸 三宅唱執導\n\n\n\n\
  \n\n\n雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n (刊登於網誌的原文，含圖片，與補充)\n\
  \n\n\n身為機遇型創作者，時常在街頭創作（或把作品放外面，或收集材料），本片像是傳授「\n旅行式創作」心法。但必須要承認，旅行式創作只是創作的某一種類型，意味著本片談的\n\
  旅行狀態不能是某種普遍性，而是某種局部，是稍微可惜的一點，對我而言也驚喜不足。\n\n\n相較來說洪常秀《旅人所嚮》更有旅人式生命態度，而非《旅與日子》在形式上嵌合劇本\n\
  /演出，想像如果電影是如《雙面薇若妮卡》默默被命運牽引的旅人會不會更好？比較起\n來《旅人所嚮》像行為表演與《旅與日子》劇情片擬仿，在力度上是稍弱一點，不過電影\n\
  說著旅行/放逐，離語言遠去的方式，說來也不是那麼拗口，還是蠻自然的。\n\n\n但也不能抹滅本片精彩地，一分為二的結構，前段的內心劇本與後段實地旅行劇本，歷經\n\
  烏龍事件，啟發創作兩者（開頭與結尾）鏡位的交會的時刻，同時也是《惠子不能輸》開\n場的手寫書桌，連結了吳爾芙陰性創作生命，回答了旅行儘管體驗不同地方（everywhere\n\
  ）的人事物，但終究回到書桌，僅僅以書寫的孤獨存有（註1），如此又回到，面對「眾\n人」，乃至於「無人」（註2）。\n\n\n同時再回到 電影中段座談時那個回答\
  \ 其實是心有所感：作品永遠尚該努力。 虛懷若谷\n，這應是自我膨脹的創作者，該時常提醒的。\n\n\n劇本上有些日本感過重，日本式對白呈現日式的幽微情感，也不能抹滅在加入了韓語「他\n\
  者」，帶有疏離 更加客觀看待的「旅人巧思」，同時以東亞位置，更有指向世界性。\n\n\n發覺這次三宅唱，空景vibe 加上配樂的渲染的比重提高，靠配樂carry也不知道是灌水，\n\
  還是另一種意境展現（炎熱海灘─過渡颱風─雪景，說來其實蠻精彩的）。\n\n\n\n（註1）\n電影同時以旅人的行走，無非想起不斷行走的朝聖之路，像是do nothing\
  \ also do the\neverything，必須以身體極限，不是極限運動的極限，而是極其簡單的行走，見證自我生\n命與世界的關聯。\n\n\n所以蔡明亮的行者只是觀看一位行走的人，對我來說只是影像的問題，行走的答案必須是\n\
  行走之人不可訴說的個人經驗，接近了信仰 （宗教性）。\n\n\n\n（註2）\n見筆者《旅人所嚮》舊文（連結如下）\n\n\n\n--\n\n拉特飯 - 以商業力量進入獨立市場\n\
  \n--"
date: 2025-12-19
