url: https://www.ptt.cc/bbs/movie/M.1555836765.A.772.html
title: '[新聞] 安海瑟薇 真愛挑日子 做不好這件事被譙8年'
content: "安海瑟薇「真愛挑日子」做不好這件事被譙8年！\n\n2019-04-21 04:05 聯合報 記者蘇詠智╱即時報導\n\n安海瑟薇自從奪得奧斯卡最佳女配角獎之後，在美國就從甜心變成公敵，一舉一動都會被\n\
  嫌棄，她也好不容易終於學會不管別人怎麼罵、開心做自己。然而有件事，她知道自己真\n的沒做好，誠心接受批評，那就是「用英國腔演戲」。她曾經在浪漫文藝片「真愛挑日子\n\
  」用英國約克郡的口音詮釋片中的角色，卻讓英國觀眾與影評人大搖其頭，片子在歐美評\n價不理想、票房也不出色，事隔8年她又要在新片「詐騙女神」演英國人，她嚴陣以待，\n\
  提早一周苦練英國腔，劇組也幫她聘請語音教練，希望這一次的表現能令英國人滿意。\n\n好萊塢影片常將其中部分角色設定為英國人，卻不一定找貨真價實的英國演員來扮演，因\n\
  此美國演員不少人都得接下「裝英國腔」的挑戰，往往被英國人嫌得一無是處，安海瑟薇\n也躲不掉。有了「真愛挑日子」的失敗，她在「詐騙女神」做了更充足的準備，要讓英國\n\
  觀眾看到她的努力，她也特地與片中另一位女主角瑞貝爾威爾森一起上BBC「葛雷漢諾頓\n秀」宣傳，透露更多影迷不知道的秘密。\n\n原來安海瑟薇雖然靠歌舞片抱走小金人，她的兒子強納森卻不是她歌聲的粉絲，只要聽到\n\
  她唱起歌就會揮著手、直呼：「媽媽，不要，不要。」只有她開始唱佩佩豬卡通裡的歌，\n他才會接受。\n\n--\n\n帝釋所問經講記77頁拆穿的。\n毗婆舍那講記(含法的醫療)說明如何修四念處增加智慧斷除所有煩惱。\n\
  \  PTMC 寂靜禪園\n、、、、()、、是。\n  是    是\n\n--"
