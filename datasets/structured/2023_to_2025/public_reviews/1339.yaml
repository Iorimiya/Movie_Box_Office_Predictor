url: https://www.ptt.cc/bbs/movie/M.1466934865.A.748.html
title: '[普雷]《音浪青春》，關於青春，那些迷惘日子。 '
content: '部落格版：


  其實如果硬要說，我會說《音浪青春》最精彩，且是最值得一看的，是片尾近15分鐘。


  前面1個多小時，宛如一場人生迷途，20幾歲尚且可稱作青春的小夥子，涉世未深、總是

  幻想且自以為能做大事，但回過頭來，才發現社會不比校園，那些教科書沒教得太多太多

  ，走了幾條錯路，做了幾件錯事，體會過那些紙醉金迷的荒誕日子，痛過哭過傷過一回後

  ，未來想走的路才模糊成型。


  青春，就像個犯錯能被原諒的赦免詞。


  而電影透過4個迷惘卻又不認為的小夥子，放進很多人間誘惑，性愛、毒品、派對、音樂

  ，他們即便沉浸在這些，卻依然保有一顆尚未被侵蝕的心，用還是光亮的眼睛看世界，去

  和已經經歷許多歷練的「大人」們相遇、對立，去製造出那種矛盾感，那種想擺脫稚嫩，

  卻不曉得改成長為什麼樣的人的矛盾。



  《音浪青春》有著青春YA片固有的套路，從立誓要做大事、遇到貴人（恩師）、鑄下大錯

  、發生足以改變自己的衝擊事、悔改、找到方向、完美結束。


  而這中間過程必定會有的，就是友情，愛情，朋友吵架不可少，為了女人放鳥朋友不可無

  ，最重要的，就是愛上朋友（恩師）的女朋友，是否有上床那就是後話了。


  4個青少年花了很多時間在繞路、思索，沒有繼續升學，腦中想法天馬行空，掙扎著該用

  什麼方法，才能賺大錢享受人生，原先想利用音樂開派對賺取利潤，但後來卻發現不可行

  ，沒名聲、自學根本無法接到大場合案子，能賺的錢有限，於是他們輾轉跟著他人做房地

  產，看著大人們如何用可以說是骯髒的手段騙財，另一方面，柯爾遇到知名DJ，體內的音

  樂夢仍在，現實與夢想互不相讓，想同時擁有，卻拿捏不到平衡點，於是讓自己摔傷。


  「以後我們會比現在長進嗎？」


  這句話我認為是本片最重要的核心，每個成長階段的青少年，總會問著自己，或別人，自

  己到底有沒有比過去長大了？在經過連串事情後，他們就這樣問著彼此，可能有吧，可能

  沒有，但下一秒繼續在新租的房子開趴，其實看的時候我是滿有感的，一腳踩著稚嫩，一

  腳踩著成熟，界線仍模糊不清，心容易跟著浮動，於是，又是一個興致一來，口中的「長

  進」成了隨手拋去的紙屑。


  但在這場狂歡派對之後，松鼠死了，這個事情重擊剩餘3人的心，強迫他們去成長，強迫

  那條界線漸漸清晰，逼使他們將另一腳也踏進大人的世界。



  但其實在看《音浪青春》前面的時候，我一直覺得這部片角色個人鮮明，但可惜劇情鋪陳

  不足，失去那種成長的前後反差感，不過這部片是我覺得柴克艾弗隆演最好的一部作品，

  尤其是最後在音樂節的那幾分鐘。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
