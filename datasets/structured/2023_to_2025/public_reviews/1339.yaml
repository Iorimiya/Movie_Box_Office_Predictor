url: https://www.ptt.cc/bbs/movie/M.1467000218.A.F46.html
title: '[負雷] 《喬治失蹤的日子》你試過無套肛交嗎？'
content: "-------------------------------------------\n「你試過無套嗎？」\n\n「我可以把套子脫下來，你會幹得更爽！」\n\
  \n---------------------------------------------------\n\n有肉照、有帥照的圖文網誌版：\n\n---------------------------------------------------\n\
  先不論導演的聲明與解釋，就我個人看過整部電影的主觀想法。\n\n這部作品僅是台灣藝術大學日間部大二聯合實習期末作業，但在預告片段中出現了台詞「\n你試過無套嗎？」涉及無套肛交的男男床戲情節因而遭網友瘋傳。截至今日，臉書版預告\n\
  瀏覽率上看六萬四千人次。甚至影片被下載重新上傳至中國網路社群媒體討論，擴及率無\n法估計。單以一部台灣影視系學生作業，此等曝光關注度的確驚人。\n\n\n\n\n\
  不過網路上隨即出現兩派聲浪。\n\n很大一部分網友是想看這部電影，被當中高顏值演員裸露與大尺度情慾床戲所吸引；\n\n另一部分意見則是斥責這部影片「故意加深民眾恐懼、宣揚錯誤愛滋訊息、妖魔化男同志\n\
