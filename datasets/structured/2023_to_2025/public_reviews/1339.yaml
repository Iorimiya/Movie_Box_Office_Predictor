title: 'Re: [討論] 今天是螢火蟲之墓清太在車站掛的日子'
content: '我覺得從感性上來說，清太是個好哥哥。


  你說在理性上，他沒有好好擔負起照顧妹妹生活的責任，從結果來說的確如此，在兵荒戰危的世道中，只有浪漫的愛不能養家活口。但如果只有責任心而沒有愛，妹妹不會那麼喜歡清太哥哥。


  在阿姨家兩兄妹被減飯吃的時候，節子心中也不開心，清太帶著她說我們不要委屈我們走。這當然不是實際的好方法，但他體貼妹妹的心情，我想節子心中會很開心。


  在外的生活，清太盡可能的讓節子感到快樂，搭個小天地，陪著節子，開心地讓她以身為一個兒童好好地玩耍。戰火下無依無靠的窮小孩本該沒有開心的權利，但清太卻陪著節子度過她那短暫無憂無慮的片刻。最後清太必須負擔來得太晚的責任時，節子只能孤零零待在家，終究被迫早熟。責任跟溫柔的愛在顛沛的世界中，就連大人都很難兩全了，何況兩個孩子。


  我是觀眾，我也覺得清太是不是做得不夠。但如果我是節子，我知道我會死，但我不會怪哥哥，我會謝謝他那麼溫柔地陪我走完人生。


  -----

  Sent from JPTT on my Samsung SM-M115F.


  --'
