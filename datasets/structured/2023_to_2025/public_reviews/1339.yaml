url: https://www.ptt.cc/bbs/movie/M.1637157123.A.8E7.html
title: '[暖好無雷] 河畔小日子（金馬影展，會上院線）'
content: '《當他們認真編織時》的荻上直子導演對人性的觀察與捕捉強到世界等級。他所寫的劇本

  看似描述簡練的平凡小日子，角色間的互動和對白卻令人莞爾，也提供了不少思考空間。

  鏡頭跟配樂帶出來的畫面有好多好多的細節值得品茗。如果國語辭典每個詞語都有一部電

  影，那《河畔小日子》就是會心一笑。明明是典型的日式溫柔，可是又做出那種比公式範

  文更好的樣貌，令人想起《橫山家之味》。






  父不養母不親的更生人主角山田（松山研一 飾）背負著對自己乃至於周遭的不信任與不

  自信來到這個陌生的小鎮過著單調乏味的生活

  。看似平淡的生活但他卻沒有笑過，一直到跟「奇形怪狀」的鄰居和暖心的老闆相處下才

  找到自我。

  到底要如何溫柔地接納重新出發的自已，這部作品給了很好的解答。



  男主3次笑（颱風天、壽喜燒、外星通話）的部分都好喜歡，然人想到《海邊的曼徹斯特

  》

  裡男主角最後跟姪子乘船那種稍稍釋然的微笑。


  室剛擔當的可愛78人是這部電影一大亮點，你明明都會知道他要出來鬧事了卻還是會笑

  （可是他又常常可以跟女神演CP，到底？）


  處於日本三十歲女星巔峰的之一的滿島光雖然戲份不算多，但那份演出張力足以令大家動

  容。



  整體而言是很療癒看完心情會很好，也能解答一些內心困擾或困惑的電影。

  誠摯推薦！絕對值得進場！





  附上近期愛歌：





  ~~~~~~~~~~~~~~~~~~~ 輕雷 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~















  滿島光拿著亡夫的骨灰自我愛撫的部分真的演得太神了，看過就懂......

  結尾拍的送葬隊伍好美好體貼。


  --'
