url: https://www.ptt.cc/bbs/movie/M.1565636025.A.646.html
title: '[好雷] 最後相愛的日子'
content: '可能是我平常看太多爛片

  所以這部片我覺得好好看好好看

  我租來看的

  一個晚上看了兩次

  第一次有一部電影讓我一個晚上看兩次


  不過

  喜歡歸喜歡，

  有一些想法跟之前的感想文的想法有點不大一樣



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  這部電影是故事的男主角Peter出的書

  我沒看過書 所以不知道跟電影有沒有不同

  但單純以電影來看

  我覺得他們的愛沒有電影寫得這樣的偉大跟炙熱



  第一

  當女主角葛洛莉亞知道自己的重病復發而且很嚴重時

  在一次的爭吵中，他把男生趕出去，分手


  電影想把大家導向為，

  因為女主角認為自己時日不多，

  所以把男主角轟出去，讓他有更好的人生


  可是我覺得這邊有點把愛描述太偉大


  葛洛莉亞這樣的心情，男主角怎麼會知道?

  更何況，男主角飛去美國跟女生同居時

  男主角跟家人通電話時

  家人就責備他怎麼可以沒有工作

  可見他非過去跟相差29歲的女友住在一起

  就是給女生養

  說難聽一點就是小白臉

  因此我覺得女生把男生轟出去被解讀為是因為不想耽誤男生

  有點太牽強




  第二

  當女主角要死掉的前幾天住進男主角的家裡

  當男主角發現女主角葛洛莉亞得了重症之後

  那一天

  男生竟然沒有在家裡過夜

  電影拍的是跟女性好有訴苦

  說好心疼 好愛他


  但事實上就是你把你的前女友帶回家

  你卻不住家裡

  讓你的全家人照顧你的前女友

  這邊的邏輯就很有問題


  換作是你是葛洛莉亞你也會很難過吧

  我來你家住結果你跑去喝個爛醉夜不歸




  第三

  當男主角全家人在樓下吵架打架

  說這個女人快要死了，還不讓她家人知道

  還不快送走她


  女主角在樓上聽的時候

  卻不時地出現她當時把男主角趕走的畫面

  當年她趕走別人/現在別人要把她趕走

  為何要特地做出這樣的比較圖

  所以我覺得女主角去住男生家裡時，

  彼此是否有愛情不可考，但不會是電影裡提到的這麼愛




  第四

  女主角重病

  最後要送回美國的醫院

  電影用 "葛洛莉亞想回到紐約的XX醫院治療"帶過

  但已經這麼不舒服了，為何不直接待在英國的醫院治療

  此外

  若男主角真的這麼愛女主角

  他也可以飛去美國陪她最後一段光陰，不是嗎?



  綜合以上幾點

  就我已片面的觀點來看

  我覺得電影裡面的愛情(或者小說)有過於誇大

  更何況作者是男主角本身

  當然要把自己寫的很癡情



  個人一點點的看法

  但我說了這麼多

  我還是很愛這部電影

  並非愛情戲讓我喜歡

  而是看一個過去女演員最後的生活

  看了很心疼 很悶



  以上，希望有看過的人可以討論唷


  --'
