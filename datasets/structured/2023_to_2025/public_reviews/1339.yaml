  \n編導辜健耀認為電影主軸是恐慌與寂寞。他藉由主角恐慌感染的情節表達恐懼往往被無限\n上綱地擴大。恐懼的本身即是恐懼，而這樣的恐懼源自於孤獨而產生，尤其當一個人自己\n\
  面對時。劇中主角凱文便是一名孤獨者，導演故意設計他很難相處、朋友少、對於家人也\n不擅表達。凱文的胡思亂想使他把恐懼放大。導演認為不只是愛滋，任何事情的恐懼都是\n\
  如此。\n\n對於拍攝同志議題電影，辜導演於網路聲明曾表示「作為一名同志導演，我拍攝這樣的題\n材可以說就是拍攝自己所經歷的一些故事，也用我的專長去做一點能為同志做的事情。」\n\
  在劇本創作，他以自身的同志身分發想、自己身邊也有很多同志朋友。他再三強調，他沒\n有要放大愛滋恐懼，恐懼比病毒更可怕。\n\n\n\n有觀眾詢問凱文於結局的轉念是否過於快速，導演回答每個人的想法本來就會不一樣。\n\
  \n\n\n\n\n\n\n我解釋於前言對於《喬治失蹤的日子》的描述：\n\n我最不能認同《喬治失蹤的日子》在於主角的轉念。他僅過了一晚、朋友的一句話就不再\n\
  焦慮，這非常地不符合邏輯。就導演的解釋，他似乎認為這種轉念與期末考前恐慌、上台\n報告緊張、彗星撞地球世界末日焦慮雷同，當你改變心境就可以不再恐慌。不過我要說，\n\
  愛滋恐慌這些恐慌是截然不同的。你當然可以不害怕愛滋，只要你深入瞭解它如何預防、\n如何控制風險、知道感染後就醫流程，有著正確的知識，它的確不可怕。但導演卻認為這\n\
  種恐慌可以看個海、一句話、改變想法就轉念消除，簡直痴人說夢。愛滋恐懼的消除靠得\n該是瞭解而非轉念。\n\n就這點，導演真該好好訪談那些愛滋篩檢工作者遇到的慮病個案，而不是胡亂自己瞎想撰\n\
  寫錯誤劇情。\n\n單就觀賞完整電影的主觀想法，我認為《喬治失蹤的日子》是一部恐性、強化愛滋汙名的\n電影。主角責怪自己衝動、把憤怒轉嫁在提議無套者、甚至路上崩潰說「自由把我們慣壞\n\
  」，這讓我覺得電影在批判性濫交、無套性交的行為，似乎它成為一種「會令人後悔的過\n錯」。當然，這是你選擇的角度，你有詮釋作品的自由，你可以盡情地偏頗。但你就必須\n\
  承受隨之而來的批評指教，而不是憤怒一概推託為「網路霸凌」。\n\n\n我不能明白主角的焦慮。他都懂得上網搜尋「愛滋　發燒」，那他會沒查到現今台灣醫院\n有提供「預防性投藥」？這讓我覺得導演為了讓角色焦慮而焦慮寫出這樣劇本，這不符合\n\
  現實的情狀。劇中甚至讓角色喊出「自由把我們都慣壞了」這種不口語適合由旁白朗讀的\n台詞，也令我匪夷所思。\n\n根據查閱，辜導演似乎也是個同志電影迷，許多經典電影他都曾看過，包含今年柏林泰迪\n\
  熊獎最佳觀眾票選的《5:59愛上你》。既然如此，他就應該知道有許多涉及愛滋議題的前\n人作品可以參照（《早霜》、《愛之風暴》、《費城》、《世紀末的哭泣》、《藥命俱樂\n\
  部》、《血熱之心》、《Holding the Man》等）。\n\n\n相比之下，\n\n在2016年的今日他是否選擇一種最「刻板」的方式詮釋對於愛滋慮病這件事呢？\n\
  \n\n\n\n\n\n\n現場觀眾曾於映後舉手對導演發問，劇中有一幕凱文打開Grindr介面，導演是否有取得介\n面上16位露臉露身材的網友同意。導演回答沒有，更說他拍攝東區路人時也沒有經過同意\n\
  。\n\n我認為此舉已經侵犯這些人的肖像權。同時Grindr為同志交友軟體，這顯然會有「出櫃」\n的疑慮。使用者利用自己照片公開交友是給同樣使用軟體的使用者瀏覽（通常即為男同志\n\
  ），並不代表他願意公開至銀幕上給觀眾看見。導演這種行為無疑是在幫這些他根本不認\n識的人出櫃。\n\n\n除了違反隱私倫理，我更認為涉及個資的侵犯。\n\n\n\
  \n\n\n\n\n\n\n\n不清楚導演在愛滋公衛這塊做了多少田野調查，但就我知識看來漏洞百出。首先導演稱『\n「一次無套肛交的感染率為2%」這項數據源自澳洲2010年的愛滋報告』，但他知不知道這\n\
  種量化研究數據往往有許多詬病問題或是研究方法的漏洞，台灣這方面就出現許多次紕漏\n。對於愛滋慮病者，不管感染機率是2%或是98%在他們眼裡都是100%，你既然影片講的是\n\
  愛滋恐慌，那你有沒有考慮過你在預告片安插這句話同時也可能把恐慌散播出去。假如今\n天六萬觀賞人次中有幾萬人因為看了這段話而開始慮病、恐懼愛滋，試問電影團隊有否責\n\
  任？\n\n再來，這種數據化的研究甚至會因迥異情況而有所變動。例如：你是1號、你是0號、有無\n內射、感染者那方是否有服藥治療病毒量已趨近於零，這些對會影響數據。因此你今天單\n\
  單講出這個數據卻沒有在影片中作任何解釋，這除了是無知，也是一種不負責任。\n\n更不用提這句話的英文翻譯有種根本性的錯誤，或是缺乏說明。英文中使用了AIDS\n\
  infection rate來描述，但是感染HIV病毒並不代表你就會發病罹患AIDS（愛滋病）。假\n若故事中主角不清楚AIDS與HIV這可以理解；但這係劇組放置於網路影片中的字卡，這個\n\
  錯誤是否不該發生？\n\n\n\n\n\n在劇情中，主角曾去做「核酸檢測」，醫生（或醫檢師）告知結果為陰性。但是於劇情末\n段又出現來自檢驗所的電話。我認為這也錯的。根據我對實務工作者詢問，一般來說不會\n\
  稱「核酸檢測」而是「RT-PCR」才對。而這種檢測方式在告知結果後就不會有另外一個篩\n檢結果告知。我認為導演把快篩或是驗血的結果搞錯合在一起。即使當事人同時付費做了\n\
  一般篩檢與RT-PCR，那也應該會是前者的結果先出爐（有可能電話告知），後者時間耗費\n比較長，過了一陣子才去檢驗所親自看報告。而且，應該不會同一個單位同時做快篩又做\n\
  RT-PCR，先告訴了PCR結果又跟你說快篩結果。\n\n\n\n\n因此，導演這種劇情編排明顯地有瑕疵。\n\n\n\n\n\n\n\n\n\n\n導演為體現主角凱文的愛滋恐慌，利用似實驗電影方式將主角包覆於保鮮膜之中，象徵他\n\
  躲在保險套的保護之中。這是他的安全感來源。當無套肛交發生後，他緊張焦慮上街尋找\n砲友，保險套的爆裂聲響暗示了安全感的瓦解。這種手法為電影提供另一種影像思考。類\n\
  似《聽說桐島退社了》，導演刻意不讓喬治一角露臉並於開場戲後消失，也使電影增添了\n一份趣味性。\n\n綜觀這次《寄緒》班展，我認為《喬治失蹤的日子》是相較其它三部作品最難拍攝的一部\n\
  。辜導演沒有因為僅是作業就輕率應對。《喬治》除了場景相較它人多且遠，不走學生同\n志電影常見的小情小愛而選擇大膽拍攝情慾床戲（還拍得不錯），這都是值得讚許的。\n\
  \n我在查資料時看過導演於馬來西亞大同韓新傳播學院拍攝的兩部作品《兩者》與《新伊甸\n》預告片。對比《喬治失蹤的日子》進步之大，無論是劇情、攝影、燈光、聲音、角色塑\n\
  造或是意識自由度，都可見導演兩年在台藝大的明顯累積。（與台藝大劇組相甫相乘）\n\n另外，我也必須稱讚演員莊岳，除了他的高顏質、為戲苦練的肉體外，最訝異是他是名直\n\
  男。經由導演導戲描述肛交快感、同志社群文化，讓莊岳能夠詮釋開場床戲。雖可見許多\n演技瑕疵、口條待磨，但那種支撐全戲的表演魅力是讓人期待他日後作品的。\n\n\n\
  \n\n\n在罵了很多後，其實我在思考，一個人可不可以拍反對同志、愛滋汙名的電影。《喬治失\n蹤的日子》觀者會有的憤怒多數源自認定此行為是「歧視」。而斷定歧視的標準則來自觀\n\
  者心中的道德、政治正確、性別正確。\n\n1990年代初期，歐美曾掀起一陣新同志電影浪潮（New Queer Cinema）。在那段時間，同\n志可以不用「正確」，許多過往在銀幕鮮少掀露的面向都得以登臺。但隨著同志驕傲論述\n\
  與婚姻平權意識形態的遠播，部分同志電影（尤其美國好萊塢最明顯）變得非常「正確」\n、非常煽情，為的是讓全球民眾感受同志族群的困境進而更加支持當前同運。這樣的轉變\n\
  使得同志面向反而變得某種形式的單一。\n\n\n\n在我們用「歧視」、「性別正確」評判一部作品時，是否也使得創作被框住了呢？\n\n我沒有答案，\n\n也許我就在那樣被思緒裡，才會對《喬治失蹤的日子》有所情緒吧。\n\
  \n\n\n\n根據《喬治失蹤的日子》劇組於網路回應：「關於網絡的發佈，近期並沒有放上網絡的打\n算，因為短片在放映後也會參與各種比賽和影展。但之後有在網絡發佈的話，均會透過臉\n\
  書向大家宣傳。」\n\n\n若對於本片有興趣的網友，\n請追蹤劇組粉絲團（）。\n\n---\n[註1]此番言論截至導演個人臉書的公開訊息：\n\n\n[註2]網友會有如此嘲諷行為，我認為原因是台灣疾管局往往使用不周全的量化數據去告\n\
  訴大眾男同志約砲、性濫交行為感染愛滋病的機率，以達一種「恐性」殺雞儆猴的教育。\n可能《喬治失蹤的日子》預告片中將無套肛交與愛滋感染率連結被網友認為與疾管局行徑\n\
  類似。對於男同志性社交文化與疾管局數據的評論，可詳見資深同運者喀飛所寫的文章〈\n糾葛愛滋污名的男同志轟趴風潮〉：\n\n\n\n\n[註3] 《喬治失蹤的日子》導演聲明：\n\
  \n\n--\n歡迎加入粉絲團 一起當愛看電影的鍵人~\n\nmovie板：z-6-6\n\n--\n                            \
