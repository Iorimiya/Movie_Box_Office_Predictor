url: https://www.ptt.cc/bbs/movie/M.1672755245.A.209.html
title: '[好雷] 降伏如軟土：《沒有煙硝的日子》'
content: "本文涉及劇情，且具個人觀點，建議觀影後再讀。\n\n　　　　本片已自12/30上映，有意者請把握場次。\n\n\n　　　　圖文網頁版：\n\n\
  　　　　\n\n\n\n　　　　預告片：\n\n　　　　\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n降伏如軟土，豈有不掘之理：《沒有煙硝的日子》\n\n\n\n\n　　身在台灣，經歷過這次選舉之後，對戰爭加深了憂慮：強化對抗，會不\n\n\
  會更激怒對方？開門降服，表明無涉政治，是否就能得到保全？\n\n\n\n　　２０２２年代表烏克蘭角逐第95屆奧斯卡國際影片的電影《沒有煙硝的\n\n日子》，為烏克蘭導演瑪麗娜．艾爾．戈巴赫受２０１４年頓巴斯戰爭的真\n\
  \n實事件啟發，給了我們一段就近發生的借鑑。不同於一般戰爭電影以男性為\n\n中心，導演藉由馬來西亞航空ＭＨ１７班機在烏克蘭領空遭親俄份子擊落的\n\n事件，以一位即將臨盆的孕婦伊爾卡為主角，帶出烏俄邊界烏東頓內茨克地\n\
  \n區人民生活逐漸遭到戰爭破壞的日常。\n\n\n\n　　電影在日舞影展首映後不久，烏俄戰爭便即爆發，一如有孕在身的伊爾\n\n卡家被砲彈砸出一個大洞，打破戰爭與日常的界線；接著家中的車子被丈夫\n\
  \n托里克的朋友桑亞不告而借，可能無法即時去醫院生產。狀況如此艱困，與\n\n伊爾卡同居的兩位男性，卻各有異心：托里克一心希望能投靠俄羅斯，對桑\n\n亞推託還車的承諾束手無策，在俄兵經過時，幾乎有求必應；念過大學未婚\n\
  \n的弟弟亞力克，堅持想把姐姐帶離邊境，無法容忍姐夫的媚俄行為，卻無意\n\n理解身處邊界生活的艱難。導演將國家戰爭濃縮至家庭上演，便能看見烏克\n\n蘭境內兩種民眾意見的分歧與紛爭，自是難以同心向外。伊爾卡則一心想重\n\
  \n建家園，好好生下孩子，儘管在戰爭當中，她始終被視為「女人」：屢次被\n\n俄軍要求作飯「餵飽我們」，服務丈夫的性連同補償被同性輕視的羞辱，以\n\n及孕育生產。牆壁被砸後，嬰兒車第一個被毀損；俄軍進來要「吃肉」，看\n\
  \n中他們家的乳牛瑪雅，托里克便在太陽底下一刀一刀的殺牛切肉，回到家卻\n\n只能自己找醃漬食品止飢。當他切開黑白分明，遍地血腥，也從此失去安身\n\n之處。慶幸他還在乎妻子的意願，但他的好友桑亞，不只一次把這種在乎嘲\n\
  \n弄為「怕老婆」。\n\n\n\n　　導演自言這部片是對戰爭的發聲，將鏡頭化為戰鬥工具，但不過度強調\n\n暴力，因這樣的視覺影像容易消弭反戰的訊息，故而選擇用一種黑色幽默的\n\
  \n基調，去凸顯戰爭的荒謬。那荒謬是什麼？因恐懼而放大了敵軍的強大，因\n\n逃避而認為只要順服，就能免遭蹂躪。但在如今的社會，人人享受平等的權\n\n利，也須負起保家衛國的義務，無一例外，所謂不涉政治是放棄發聲的權利，\n\
  \n助長了姑息。總也有人願意開門作揖，藉此獲得利益與特權，如桑亞；或者\n\n為了保全無力反抗的家人，如托里克相信同語言、同血源，表明無辜無涉政\n\n治，得到「通關密碼」就能倖免於難。然而被擊落喪命的民航機乘客，誰又\n\
  \n不是無辜？尋找失蹤女兒的父母，因是外國人還有離開的機會；可能目擊空\n\n難的當地居民，除了死，又如何能得到俄軍的信任？隔著肚皮的忠誠，真正\n\n的「自己人」光是同種族、同語言如何得證，同一家庭尚且思想分歧，須得\n\
  \n穿上同樣的制服才能顯示徹底降服。既降服如軟土，豈有不掘之理；都躺上\n\n了砧板，魚肉怎能不切？於是俄軍輕易侵入，還不必費力對付反抗者──畢\n\n竟砲彈不問口號，毋須辨別對象，若能倖免，「誤擊」就足以解釋一切──\n\
  \n姑息與助長，加速了自毀家門。\n\n\n\n「她如果生女的我就幹她。」\n\n「那如果是男孩就給我幹。」\n\n\n\n「你不是分離主義者。你是奴隸。」\n\
  \n\n\n　　波蘭電影《大獲拳勝》裡，被俘虜進集中營的拳王泰迪固然失去自主權\n\n與自由之身，成為侵略者觀賞戰鬥的娛樂，卻在求生存的同時，利用一切機\n\n\
  會保護己方──奴隸以身服從，仍會隨時伺機掙脫。托里克則是無論現實怎\n\n麼擺在眼前，無論伊爾卡和亞力克如何不認同，都麻醉自己相信俄羅斯的承\n\n諾與特權，讓自己與別人都安住於這樣的生活。最無害的服從既是放棄一切\n\
  \n武力對抗匍匐在地，對侵略者來說自是不必費心費力巧取豪奪，一句命令，\n\n便會盡獻其上：有肉飽腹，有車代步，就能節省體力搜集武器，用來殺戮更\n\n多反抗者；性之所至，不分性別年齡，都有洞可用；而利用奴才的忠誠來對\n\
  \n付反抗者永遠是省力而有趣的遊戲，面對秉持著「敵人必須都死光，戰爭才\n\n會結束」的侵略者，一把槍射殺家人以表忠誠的生存抉擇，都證明了在戰爭\n\n裡，沒有人能因為先跪伏而倖免於難，一如邱吉爾曾言：「選擇屈辱，仍得\n\
  \n面對戰爭。」──只是喪失尊嚴之後，便會順勢成為侵略者的武器。\n\n\n\n　　電影自始畫面全黑，只有夫妻對話，苦中作樂地說要把打破的牆改建成\n\n一扇大窗戶，然後以緩慢移動的鏡頭帶出屋子遭受的破壞，和屋外無邊無界\n\
  \n的荒涼、無處藏身的地獄。國境的屏障被擊出一個洞，還有人開門揖盜，接\n\n著就是家的牆，人的尊嚴；但換個角度思考，難道不是有人先捨棄尊嚴，於\n\n是接著是家的牆，國的屏障遭到毀損嗎？至終，伊爾卡一家試圖改建被毀損\n\
  \n的家而設置的塑膠布被輕易撕開，那些將兩位男性殺死後去而復返的士兵，\n\n來來回回搬走武器，伊爾卡倒在擋住破牆的沙發上，艱困的產下胎兒，在新\n\n生的嬰孩終於掙扎著發出哭聲的過程，正展現了在男性主導的煙硝底下，女\n\
  \n性以其韌性延續求「生」意志，有力地控訴了戰爭帶來的犧牲：傷害不問晝\n\n夜，沒有煙硝的日子，取而代之的是黃土與塵灰般無止境的絕望，在戰爭底\n\n下的人們，誰都不能倖免這樣的剝奪與死亡。但死亡之前是什麼姿態，槍口\n\
  \n是對內或對外，在歷史、現況，乃至這部電影的借鑑底下，相信每個人都會\n\n有自己的答案。\n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n\
  有時候，眼睛只肯告訴我這麼多。\n\n                                  陳斐雯  貓蚤札（其三）\n\n--"
