url: https://www.ptt.cc/bbs/movie/M.1442663678.A.6FC.html
title: '[請益] 真愛挑日子(One Day)的7月15日之約'
content: '------推文有雷 請小心別踏過頭-------



  各位板友好


  看預告有提到，男女主角約定每年7月15日不論如何都要碰面

  可是我看電影內容，沒看到這一段耶

  請問是我錯過了嗎? 是在哪一幕約定的呢?


  我發現我看完整部片，爬文才知道這個約定

  難怪看著看著就覺得納悶，為什麼一年一年的標著

  而且每年都發生一點事，那其他時候他們在幹麻?

  後來才知道，那就是7月15之約

  讓我整個電影體驗少了一半感覺阿阿阿阿 囧


  謝謝各位


  --

  有種熟悉總在你心裡深處、眼光餘角出現

  越是追求越是千里尋不著

  日覆一日，漸漸的也就淡忘

  實際卻如影隨行、無聲無息的埋藏在潛意識裡‧‧‧

  也許夜深人靜時又會不經意的輕敲你心房


  --

  對呀 還是很浪漫 哈哈

  我已經下訂小說囉 不太好買

  希望封面是男女主角擁吻的封面

  感覺小說好像不是唉...

  應該是西方版的 16個夏天 噗

  也採用一年一年的方式去演

  真的假的

  我看電影看到差點放棄的說

  前半段好平淡好悶，差點看不下去

  就在想這不會是我可能不會愛你國外版吧?

  女主角弱弱的 卻有帥氣多金的完美男主角好感著 最後回頭跟女主角相戀的老劇情

  看著看著整個...直到男主角墮落，彼此遇到彼此的另一半，才開始緊湊起伏了起來


  老實說我也剛看完真愛每一天(About Time)

  真愛每一天一開始就緊緊抓住目光，並且把我容入角色的情緒裡

  男女主角的愛情讓我感到很幸福且美好


  而真愛挑日子，不知道是否小說本來就這樣

  這20年來的陰錯陽差，都是這麼的淡淡帶過，沒有讓人覺得情緒很深

  我容不進女主角或男主角的情緒裡

  理論上這20年的巧妙錯過，應該是要一直扣著觀眾的心弦

  讓觀眾一起入戲，一起生氣遺憾膽怯不敢踏出的強烈感覺，可惜沒有唉...

  不知道是電影拍淡了，還是小說本來就很淡'
