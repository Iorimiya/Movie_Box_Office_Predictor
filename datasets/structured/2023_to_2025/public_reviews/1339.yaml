title: '[好雷]旅與日子如果再長一點會是今年最佳電影'
content: '不誇張 如果這部拍到100-120分

  就再多那十幾二十分鐘 多點劇情 或跟前面短片做呼應都好


  應該會是2025我最喜歡的片


  超中這次的電波

  這麼純粹 美得這麼有詩意

  跟他之前作品有點不一樣


  一點洪常秀一點濱口 但還是屬於山宅唱的電影


  前面河合優實在雨中游泳 後面他們去偷鯉魚 美到想哭


  為什麼要拍成像半成品 不知道 (對我來說就是有很大缺憾)

  真正的餘韻並沒有被激發出來


  日片今年真的很精彩

  有國寶這種正統大史詩

  也有像旅與日子的極簡純粹




  --'
