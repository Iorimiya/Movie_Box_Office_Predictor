title: '[心得] 真愛挑日子 OneDay'
content: "圖文網誌: \n\n\n內容有雷　請想清楚再繼續往下閱讀>\"<\n\n\n2011年美國愛情片，由安海瑟薇和吉姆史特格斯主演。\n\n改編自大衛·尼科爾斯的同名小說。\n\
  \n如果是以一個對劇情有要求的愛情片來說，\n\n與安海瑟薇的另一部作品《愛情藥不藥》一樣，\n\n我的評價大概就是很普通。\n\n（膚淺一點來說至少愛情藥不要還可以看到安海瑟薇露點）\n\
  \n\n--\n\n\n\n內容看起來有許多會讓人感動的點，\n\n但還是滿因人而異的，畢竟我是沒有被感動到。\n\n許多環節似乎殘酷又寫實的呈現複雜愛情關係和現實生活，\n\
  \n像是Emma深愛著Dexter卻跟喜劇演員交往這麼久，\n\n而且他唯一逗她笑的那次還是跌下樓梯的時候。\n\nDexter在最難受悲傷的時候，只想說話的人是Emma，\n\
  \n而卻跟別的女生結婚生子，妻子打回來的時候他接起電話的第一句話居然是「Emma!」，\n\n不過妻子也跟自己的麻吉外遇就是了。\n\n\n\n這部電影最成功的應該在於描述的手法的很特別，\n\
  \n有點像是利用快轉的方式帶過漫長的光陰，\n\n僅僅透過每年的 7/15 （聖斯威辛節）就可以讓大家了解整個故事來龍去脈，\n\n這一天也是讓故事中人物特別印象深刻的一天。\n\
  \n在主角的造型和心境方面的鋪設也很好，\n\n剛開始的Emma只是不太打扮的樸實女孩，是個缺乏自信的女孩，\n\n到後來那個很搶眼的中國旗袍，還有之後換了中性的髮型加上美麗的禮服，\n\
  \n而Dexter則是開頭像是放蕩的浪子，當上知名主持人更顯囂張與華麗的模樣，\n\n後期逐漸變得平淡，失意之後頹廢，以重生的姿態樸實的樣子收尾。\n\n 隨著每年不同的裝扮造型變化，同時也是心態與心境的轉折，\n\
  \n即使一年只講一天你錯過了另外的３６４天，\n\n但從對話與他們的外貌環境中，多少可以看出或猜出現在的他們是甚麼樣的人。\n\n\n\n這部片除了愛情以外，也牽扯到了家庭與事業的內容，\n\
  \n不管是哪一個多多少少都會讓人引起些共鳴，\n\n加上男女主角帥氣美麗的模樣，還有獨特的敘事法。\n\n這部片應該會惹不少人喜愛，但主軸劇情真的讓我難以接受。\n\
  \n客觀一點來說，應該是想表達兩個從見面就彼此有好感的兩人，\n\n變得越來越了解越熟悉對方，經歷了許多挫折、痛苦與歡笑，\n\n最後仍然明白彼此才是自己的真愛。\n\
  \n\n可是在我看來就是一個渣男把深愛著他的女性好友當成備胎，\n\n等到完全灰心喪氣走投無路，才發現Emma是自己最愛最信任的那個人。\n\n而Emma最後秒甩男友投入Dexter懷抱，\n\
  \n也是讓人不懂哪裡讓妳值得這樣做了。\n\n個人覺得電影看起有想表達一種，Dexter因為受到Emma的影響而改變成長，\n\n我自己是這麼覺得啦，但並不是很成功，\n\
  \n我的角度看來Dexter轉變多來自於個人因素和失意，並非被Emma感動，\n\n大概只有最後兩人結婚後短暫的美好時光，\n\n近二十年在身邊才發現的真愛的突然離開，是的確讓整個故事很難過，\n\
  \n但並不是說以悲劇收場就必然是個好電影，\n\n說起來看過另一個部也是車禍結尾的電影《刺蝟優雅》覺得比較好看。\n\n\n\n還有最後有一段回憶過去兩人認識當天的回憶，\n\
  \n以為會是多浪漫美麗的回憶，\n\n結果是約砲失敗隔天想要繼續約砲的爛對話阿，\n\n帶著小孩到山上回憶起跟妻子初次相遇的約砲回憶並沒有很感人。\n\n\n\
  --\n\n\n\n大笨貓電影院＞ｗ＜\n\n--\n謝謝 已修正\n知道英文名字 可是換成中文就莫名卡住惹XD"
