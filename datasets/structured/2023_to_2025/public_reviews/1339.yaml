url: https://www.ptt.cc/bbs/movie/M.1456273312.A.8A6.html
title: '[請益] 真愛挑日子'
content: "片中Dex到她女友家，玩打頭的遊戲，那種美式遊戲是怎麼玩?\n\n        一點都看不懂，只知道說幾個字就一直被打頭\n\n      \
