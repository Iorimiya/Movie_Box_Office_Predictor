url: https://www.ptt.cc/bbs/movie/M.1517474455.A.82A.html
title: '[新聞] 認愛已婚男星！小泉今日子道歉：他的家庭'
content: '認愛已婚男星！　小泉今日子道歉：他的家庭因為我被埋沒了


  51歲日本女星小泉今日子發出震撼聲明，除了宣布從36年的經紀公司獨立，同時承認和已

  婚男星豐原功補的不倫戀。她從女偶像出道，至今已經是眾所皆知的實力派女星，外傳男

  方早已離婚，聲明中強調「他是有家庭的人」、「我對他的家庭感到萬分抱歉。」


  據日媒《SponichiAnnex》報導，小泉今日子從「BURNING PRODUCTION」公司獨立，正式

  為自己的演藝事業做主，同時。她獨立第一天便公開不倫戀，聲明中說「豐原先生有家庭

  ，最初週刊報導時，我告訴工作人員，千萬不要給對方家人造成困擾，結果事與願違，數

  年後過去了，網路和雜誌都謠傳他已經離婚，結果連他的家庭也被報導埋沒。」


  小泉今日子說：「這一連串的報導奪走了豐原先生發言的機會，也可能是因為我的關係，

  變成這樣我對他的家人萬分抱歉，同時我對過去以來不能發言的事感到非常後悔」，除了

  吐露複雜的感情現況，她同時表達獨立後的心情，「獨立開公司後，我將有做為一個人承

  擔的覺悟，雖然是私事，為了要做決斷所以特地在此報告。」


  同時豐原功補也同步發表聲明，公開和小泉今日子的關係，「我跟她是志同道合的夥伴，

  也抱持戀愛感情。」他承認有妻子和家庭，對家人感到非常抱歉，「責任全都在我」，同

  時說明和家人已經分居3年以上，最後請求媒體不要採訪自己的家人。


  兩大實力派演員公開承認不倫戀，堪稱史上頭一次，令全國民眾超傻眼，網友忍不住反問

  「根本就是不倫宣言」、「不離婚嗎」、「不是應該男方先做決斷嗎」、「只分居不離婚

  ，老婆好可憐啊！」





  --

  沒隱婚 男方已婚有家庭，小泉表示周刊報導他已經離婚了但其實對方沒有離婚。最初是懷

  著不影響對方家庭的前提下的想法交往的

  獨立開公司 順便自爆不倫'
