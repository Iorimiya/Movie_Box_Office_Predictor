url: https://www.ptt.cc/bbs/movie/M.1581596112.A.597.html
title: '[新聞]三度角逐金熊獎 蔡明亮：日子是很棒的作品'
content: '三度角逐柏林金熊獎 蔡明亮打包票：「日子」是很棒的作品




  時間：2020-02-13 16:27    新聞引據：採訪    撰稿編輯：江昭倫


  第70屆柏林影展將於2月20日登場，蔡明亮導演的最新作品「日子」再度入選競賽單元，

  也是本屆唯一入圍柏林影展華語電影。蔡明亮導演今天(13日)特地偕同演員李康生、亞儂

  ・弘尚希(Anong Houngheuangsy)一同亮相。，至於得不得獎，他不會有壓力。


  繼1997年「河流」、2005年「天邊一朵雲」之後，導演蔡明亮第11部作品「日子」在相隔

  15年後，今年將第三度叩關柏林影展金熊獎。


  蔡明亮13日帶著兩位演員李康生與他在曼谷街頭發掘的寮國新人演員亞儂・弘尚希，一同

  出席影展行前記者會。




  蔡明亮：『(原音)


  李康生幽默的說，誰都不想在鏡頭前呈現自己生病狼狽的模樣，，所以拍攝過程究竟要演還是自然呈現，他其實很困擾。李康生：『(原音)心情有點排

  拒啦，對，因為那個樣子真的很狼狽，導演又一直拿著鏡頭對著我，對，後來因為就是相

  信他嘛，因為合作20幾年，還是給他拍。』


  至於亞儂・弘尚希一開始並不知道蔡明亮是導演，李康生是演員，以為蔡明亮只是紀錄他

  日常生活，後來得知是拍電影，感覺好像夢想成真。亞儂・弘尚希：『(原音＋翻譯)跟我

  之前回答的一樣，如果可成的話，我就想要當演員，因為這是我高中時候的夢想。』




  除了蔡明亮的「日子」入選第70屆柏林影展競賽單元，今年也有台灣3位優秀影人入選柏

  林新銳營。另外，今年柏林影展，台灣也將首度由文策院接手組隊參加。文策院院長胡晴

  舫表示，今年台灣館將全面升級，「台灣之夜」也會以更時髦接地氣的方式呈現；更將首

  度啟動「台灣作品媒合會(IP Showcase)」機制，帶著由金馬創投評選獲獎的3部作品「氣

  」、「神人之家」、「無聲」主動出擊市場展，為台灣參與國外展會帶來新的氣象。



  --'
