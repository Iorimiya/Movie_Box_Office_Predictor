title: '[好雷] 式日 你知道明天是什麼日子嗎'
content: '天空很美

  星星很美

  月亮很美

  光線很美


  只要我不存在的話


  大家都很美




  你知道明天是什麼日子嗎？





  式日是一部很美的作品

  無論是畫面還是配樂 台詞的語調

  寫實工業遠景下的帶著迷幻感的故事


  男人透過鏡頭把現實化為虛幻 逃進想像中

  女人扭曲自己 讓時間停滯 使虛假化為現實


  相反的人 靠近又遠離 互相凝視 若即若離

  兩條平行線 在軌道車跟電車下持續前進


  我很喜歡逃避行

  但我從沒想過 最美 最遠的逃避行

  是在原地 關在大樓裡 躺在浴缸中 逃離自己



  --'
