title: '[新聞] 雖無緣主獎項 蔡明亮新作日子獲稱柏林影展高潮'
content: '最新更新：2020/03/01 22:06


  （中央社記者林育立柏林1日專電）電影導演蔡明亮新作「日子」代表台灣闖進柏林影展

  競賽單元，



  明鏡周刊（Der Spiegel）評論說，2名寂寞男人的生命道路在旅館交錯，一人的痛苦在另

  一人的奉獻中得到解放，這是一個美妙的、攸關存在本質又安慰人心的觀影時刻，無需對

  話但道盡了人類需要親密的基本需求，。


  南德日報（Süddeutsche Zeitung）說，「日子」是一部沉默的電影，事實上感人、有時

  荒謬，還可看到對文明的批判。除了主角的臉，表面看來什麼事也沒發生，但說的故事卻

  比其它話多的電影還豐富。


  南德日報指出，「


  」。


  公共媒體柏林-布蘭登堡廣播公司（RBB）指出，蔡明亮是減法的大師，沒有對話不表示聲

  音不重要，他讓聲音去創造氛圍和推進劇情。從精簡的電影語言來看，「日子」是一部典

  型的蔡明亮電影，甚至可能是蔡明亮到目前為止最溫柔的電影。


  「日子」未獲柏林影展的主競賽獎項，不過卻獲得會外的泰迪熊評審團獎（Teddy Jury

  Award）和德國影評的一致讚賞。

  （編輯：韋樞）

  1090301




  心得:


  雖然沒得到主競賽獎 但能拿到這樣的評比也算是很大的肯定了 恭喜蔡導


