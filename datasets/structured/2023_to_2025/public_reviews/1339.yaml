url: https://www.ptt.cc/bbs/movie/M.1333812573.A.A12.html
title: '[好雷] 什麼鳥日子：那隻拯救世界的怪鳥'
content: "圖文版請點閱\n\n\n\n之前特映去看的，推薦給歌迷們。\n是一部很輕鬆可愛，很誠懇的電影。\n以下有雷\n\n\n\n\n\n\n\n\n\n\
  意外的這片相當清新可愛，沒有什麼包袱，很適合放鬆腦袋，不用花力氣理\n解或分析。畫面中韋禮安的臉孔和其他原素都嗅得出青澀感，但也正因如此，\n才讓觀眾感受得到職業老將手下難以出現的輕鬆和快樂。\n\
  \n\n昨天在電視上看了韋禮安的訪問，深覺是個有禮貌，言行樸實大方的好孩子。\n在這部片中他扮演的就是他自己，氣質毫無矯飾。為什麼敢不加修飾就讓他以\n原汁原味上戲呢？與其說劇組是抱著初生之犢的勇氣，不如說這個年輕歌手／\n\
  素人演員確實是塊璞玉，擁有獨特的潤澤。在無厘頭的劇情和生澀搞笑的演技\n之下，突然出現的吉他和歌聲如此成熟懇切，真的會讓人驚豔。這片感覺得出\n拍得輕鬆無負擔，卻還是能在戲院裡博得滿場歡笑，相當不容易。\n\
  \n\n整部片當然不能說完美，也沒有俐落緊實。但是自由自在的作風當中，還是細\n膩鋪梗，直到結尾都有始有終，讓觀眾懸念圓滿落幕，穩健大方的節奏實在令\n人嘉獎。例如突然現身的玩伴鳥頭人，一路看似天馬行空，最後現出真面目居\n\
  然是早逝的爸爸，還讓他重燃初衷，開口鼓勵他別怕走沒人走過的路，這正兜\n起了貫穿整部片的重要中心概念。室友、歐葉、警察等配角都很搶眼，搞笑也\n很到位，最後一段追逐塗鴉紙的過程夠緊湊，也令人心焦。整部片安排由警察\n\
  開頭，又以警察做圓滿結尾，而且居然還是河岸留言的客人，算是值得讚賞的\n小品巧思。\n\n\n鳥頭爸爸鼓勵他做自己的選擇，別為一個「萬一」阻礙自己。這聽起來雖像是\n\
  老生常談，但在清爽的奇幻風格中，偶爾出現一兩次這類對話並不為過，也並\n不造作。對於一部以年輕創作者為主角的電影來說，這反而是相當點題的。仔\n細想想，那隻拯救世界的怪鳥居然就這樣降臨在馬雅文化預言的世界末日2012\n\
  年，雖然牠可能無法破解這古老的詛咒，但至少牠讓一個年輕人認清自己的理\n想，並且繼續勇敢向前走，繼續傳播他的音樂，繼續想像著有一天能夠拯救世\n界。\n\n\n\
  \n--\n\n\n有事看片 無事生花  \n\n\n--\n◆ From: 114.43.151.228\n                        \
  \             04/07 23:29\n                                       04/08 00:39"
