url: https://www.ptt.cc/bbs/movie/M.1605343195.A.E86.html
title: '[好雷]親愛的房客-你不在的日子裡我依然實踐著愛'
content: '這是一部期待已久的電影，

  演員莫子儀、導演鄭有傑、監製楊雅喆的組合，

  是不看預告就能走入電影院的一種信任。

  從2006年的《一年之初》鏡頭裡的莫子儀到2020年，

  十幾年的化學變化，都如espresso萃取般，

  成為電影時光的印記和風味。



  陰鬱的基隆雨日場景有另一種親切，那是一種很在地的取景，

  映出這城市的平凡日日，在日復一日中，

  生生死死愛別離苦，都並不突兀。


  房東奶奶周秀玉久病懨懨，驟逝被檢驗出用藥問題，

  毫無血緣關係的林健一以「房客」之姿寄人籬下，

  但所作所為，皆不是一般「房客」所為，

  他照顧著秀玉跟孫子悠宇，親力親為，不以為苦。


  但看似斯文無害的鋼琴老師，竟然會成為法庭之中受質疑的兇手？


  警官跟法官的詰問，那些刻意的逼迫跟不自覺的歧視，

  在被懷疑的過程中，想必是不舒服的，

  然而在愛人意外死去，成為被留下的一方，

  與那份痛楚相較之下，能陪在他的家人身邊，

  延續那份愛，去守護那個孩子，是更為重要的。


  帶有強烈罪惡感跟自責感的健一，以他的方式，與悠宇繼續生活。

  最後在山中，完成了一段懺悔跟追尋，

  那場離別戲，跟前一段的離別戲，

  就這樣跟著山嵐一起印在心底了。



  其實，整體的敘事並不太意外，

  最後的兇手也不能以兇手論之，

  頗有近年來日本人情推理小說中的謎底之感。



  這個故事中，真正的謎題是，



  導演用一種的架構，說了一個的故事。



  記得那個孩子以早熟的口氣說出了確認關係之語：






  這就是一段不可斷的關係了，他們都不是對方的過客，

  而是那延續愛跟希望的重要他人。


  在鋼琴聲跟稚嫩的嗓音中，看見陽光灑在重生之人的臉龐上，

  那份愛還延續著，

  它曾轉化為一份被認同被接納的無悔，

  也成就了一個孩子心中被全心全意愛過的記憶。



  p.s

  原聲帶相當耐聽，尤其在這樣整日的雨日中。

  法蘭的配樂悠揚、主題曲旋律溫暖，

  雖然在幾幕的配樂情緒有點太滿，但整體來說相當完整，

  有一首配樂〈山〉更讓我想到《星際效應》配樂那般的觸動，

  當然，能重複聆聽莫子儀的嗓音也是一大美事。



  --


  心と云う毎日聞いているものの所在だ。


  【所謂的心】分享我的電影、音樂及閱讀記事


  --

  心會揪

  嗨 謝謝你，已修改，但電腦選字不是故意的，不用噓吧QQ

  配樂跟畫面真的很搭'
