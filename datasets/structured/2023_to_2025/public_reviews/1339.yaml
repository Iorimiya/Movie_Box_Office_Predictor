url: https://www.ptt.cc/bbs/movie/M.1169489388.A.BB5.html
title: '[好雷] 生日快樂──特定日子的思念'
content: "雖然說是心得感想，但依舊小小的爆了些雷，\n\n如果沒看過的人兒，請盡速離場。\n\n讓電影帶給你最直接的感動。\n\n整部片真的很細膩，我含著眼淚大推。(淚眼)\n\
  \n心得正文開始──\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n怎麼樣的愛讓人願意用一生去等待？\n\n是心有靈犀的三匙糖？還是不謀而同的一句『加辣』？\n\
  \n在分隔之後，彼此的習慣依然被溫習著，在思念中反覆背誦。\n\n\n\n這是小南與小米之間的故事。\n\n在每一年特定的日子裡，才能放縱自己回憶的愛情。\n\n\
  \n\n\n不停的錯肩而過，是命運的玩笑，是醞釀愛情的契機，\n\n於是，不敢接受的退卻，與無法承諾的遺憾，交織成一生綿長的等待。\n\n小米是愛著小南的，全心全意，在第一次見面時就悄悄種下了淺淺的喜歡，\n\
  \n於是在小南窘得不知所措時，替小南解了圍。\n\n小南如此耀眼，要什麼有什麼的自信讓他身邊總是圍繞著鶯鶯燕燕，\n\n那是小米的第一眼印象，觸動小米埋藏在心裡的不安。\n\
  \n小米幼年的陰影是片烏雲，籠罩著她對情感的接觸。\n\n\n\n不安在那個夜晚爆發了，冷掉的心型飯團，酸澀帶著些微苦味的梅菜苦瓜，\n\n是小南吃進嘴裡的滋味，是小米在夜闌的感受。\n\
  \n冷掉的菜可以再次溫熱，而冷掉的心要多少的濃情蜜意才能再次加溫？\n\n於是兩人各退一步，回到比『好朋友更好一點的關係』。\n\n但是日子依舊過著，BBCALL轉變成黑白手機，\n\
  \n兩人之間共通的回憶隨著時間遞增，那些曾經培養的默契從來都沒有被遺忘。\n\n黑咖啡，三匙塘，墨魚丸被戲謔的扔進辣得通紅的湯鍋裡，激起心底的漣漪。\n\n\n\
  \n\n愛過的人，曾經緊握的雙手，不是說要遺忘就能夠輕易被遺忘的，\n\n只能自欺欺人的將一切鎖在記憶的某個角落，在特定日子翻起，勇敢的思念。\n\n\n\n\
  小米被動的等待，等待著什麼？\n\n『等小南不再那麼花心，等我有多一點安全感。』\n\n但遲遲等待不到她想要的答案。\n\n多少年，換來的卻是小南要結婚的消息。\n\
  \n於是帶著想分享給小南的喜悅在寂寥的廣場不停打轉著，\n\n在愛情已經走到了盡頭，無路可尋時，尋覓一個出口。\n\n\n\n\n當小米在車上崩潰時，我的眼淚也潰堤。\n\
  \n我是知道故事的，在我想跟你走的書裡，我早已明瞭一切，\n\n但看見不知情的小米心痛難當的模樣，又明白小南斷下決定的苦痛，\n\n我在兩方之間，感同身受不住潸然。\n\
  \n\n\n\n\n紅色沙發是一枚句號，每年的生日快樂是一把開啟記憶的鑰匙，\n\n小米在特定的日子放縱自己，大口吸著熟悉的味道，吐出一圈霧白，\n\n思念著曾經擁有的美好。\n\
  \n嗅了嗅手指上淺淺的懷念，渴望聽見牽縈在心上許久的聲音，\n\n一句『喂？喂…』，讓她用一生來記憶。\n\n\n\n\n故事沒有真正的完結，待續。\n\n待續是多麼美麗的字眼，哄騙著感動不已的我，\n\
  \n如同一劑嗎啡，麻痺了我因故事而顫慄的知覺神經。\n\n\n\n\n123，睜開眼。\n\n只能在這一天，勇敢的思念。\n\n生日快樂。\n\n--\n  \
