url: https://www.ptt.cc/bbs/movie/M.1494164482.A.898.html
title: '[普雷]《我發瘋的那段日子》，Girl On Fire。'
content: '部落格版：


  《我發瘋的那段日子》以鮮為人知的罕見疾病「抗NMDA受體腦炎（NMDA receptor

  encephalitis）」為題材，用再簡單不過的劇情去解釋此疾病與過往時常被搞混的精神分

  裂症有何差異，以及那些被錯誤診斷的病患下場、家屬的心理煎熬等等，但或許電影的本

  意是想讓社會大眾更加認識這個疾病，於是劇本相當平鋪直敘，並沒有特別精彩之處，也

  就是找不到一個「重點」，加上結尾收得太過突兀、讓本片不像是部電影，反而更像是一

  部健康教育宣導片。


  ｢我感覺不到她在那裡。」


  新銳記者蘇珊娜進入夢寐以求的報社工作，獨自在紐約打拼追求夢想，身邊還有個很愛自

  己的音樂家男友，可以說是愛情事業兩得意，工作上也逐漸得到上司賞識，被指派了一件

  採訪議員的重要任務，豈料某日開始她查覺到自己身體出現異狀，起初並未特別在意的蘇

  珊娜，隨著日子越拖越久，症狀也越來越嚴重，耳鳴、幻聽、情緒失控、失眠、食慾不正

  等等，最後甚至半邊身體麻痺不聽使喚，注意力難以集中讓她在公司失控崩潰，差點丟掉

  飯碗，後在前輩好友瑪爾戈的求情下才得以保住工作，但主管理察卻要求她先待在家工作

  。某夜她從床上坐起，男友史蒂芬原先以為她只是夢遊，結果她卻開始低鳴接著劇烈抽蓄

  ，送醫診斷後接受不同醫生檢查，最後判定蘇珊娜罹患了精神分裂症（現稱思覺失調症﹙

  Schizophrenia﹚）。



  蘇珊娜住進醫院後，彷彿整個人靈魂被抽走般，一天比一天更像是木偶，什麼反應都沒有

  僅僅呆坐在病床上，連大小便都需要人協助。即便經手三位醫生、每項檢測都做過，蘇珊

  娜父母始終不願接受蘇珊娜罹患精神分裂症，更別提要她住進精神病院，但三位醫生卻無

  法從各項檢驗報告看出任何端倪，因為每項檢測都顯示為正常，他們僅好依靠經驗與蘇珊

  娜症狀自斷她就是得了精神分裂症或者是躁鬱症。


  但其中一位女醫生可罕似乎不願就此斷定蘇珊娜的症狀，於是她跑去尋求另一位醫界權威

  納傑醫生協助，後兩人經過不斷的討論、檢測，納傑最終發現蘇珊娜其實罹患的並不是精

  神分裂症，而是症狀相似的抗NMDA受體腦炎，根據電影中的白話文解釋，此病簡單來講就

  是身體機能出現問題進而引發自身免疫反應，最終向上攻擊大腦，導致腦部過熱引起腦炎

  ，據資料顯示此病可能會致命，但康復的機率相當高，只是如同電影所言的，病患必須被

  正確診斷並找出病癥，若蘇珊娜沒碰上納傑醫生，她恐怕一生都無法康復，僅能被當成精

  神病患，一輩子找不回她自己了。



  《我發瘋的那段日子》對我而言虎頭蛇尾的非常嚴重，最後的收尾方式非但無法打動觀眾

  ，反而還拉低了不少分數，瞬收的結果搭配蘇珊娜的一段自白，讓電影完全不像電影，比

  較像是你我可能在路上常見或者是電視上常看見的警語、宣導片那樣，什麼「喝酒不開車

  開車不喝酒」之類的，要求大眾多重視這個疾病，呼籲醫生在檢查時要在更仔細吧拉吧拉

  的，劇本的薄弱鬆散讓《我發瘋的那段日子》無法和精采畫上等號，相當可惜了克蘿伊摩

  蕾茲在本片裡的優異表現（跟過去的她以及電影相比之下）。


  若要講我對這部電影的印象，可能除了克蘿伊摩蕾茲外我真的想不起來，她的演出是本片

  亮點，同時也是我認為的唯一重點（可看處）。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
