title: '[好雷] 九降風  青春的故事總是發生在夏天的日子'
content: "究竟是他們的青春還是我們被遺忘的過去?\n                                             _____九降風\n\
  \n\n\n\n\n\n\n\n青春的故事總是發生在夏天的日子，站在頂樓上吹著風俯瞰全校的畫面，\n是我一直都會記得關於青春的記憶。\n在頂樓上與一群朋友聚集抽菸、打屁，只是為了短暫逃離聯考的壓力，\n\
  那裡曾經是屬於我們的秘密基地，\n那裡也被無形的刻劃青春印記。\n九降風是一部關於一群人的青春的電影，\n究竟是他們的青春還是我們被遺忘的過去?\n我不小心又憶起那故事外的曾經。\n\
  \n認識我的人都知道我是一各棒球迷，\n而且是很迷很迷的那種，\n從棒球元年開始一直到現在....\n算起來我的青春也結束在那一場場再見三振的比賽。\n九降風用棒球賽紀錄青春，也用了那各不能被提起的過往來描繪青春，\n\
  誰能無過?我們總在犯錯的時候這樣提醒自己，還是只是一種逃避承認的藉口?\n逝去的青春就該被原諒?那麼那些被浪費的過往又要拿什麼來補償?\n我想勇敢承認才是唯一可以被原諒的方法。\n\
  \n1997職棒涉賭案爆發，\n或許沒辦法想像這各新聞對於我們每天都守在收音機前的球迷有多麼嚴重的衝擊，\n好像暫時失去了人生重要的目標，\n生活變得猜忌不再相信任何事情，\n\
  而其實我忘了我是怎麼選擇原諒或者再度相信，\n甚至幾年之後連我最愛的三商虎也宣佈解散!\n我曾經一度不再關心任何與棒球有關的消息，\n但我發覺做不到!\n就像你想要拋棄舊有青春不好的回憶，\n\
  卻怎麼甩也甩不掉，\n你可以忘記童年的歡笑，但卻沒有辦法忘記青春的慘綠...\n是因為那些年我們都在青春裡掙扎。\n\n\n電影中大叫[我們不是兄弟嗎?]\n\
  我們一直以為相信的道理，等到有天突然發現那所有虛偽的真相，\n那不夠堅強的我們經不起反覆猜忌與煎熬，一觸即潰...\n棒球是假的，笑容是假，友情是假的，背叛是真的，懦弱是真的，淚水是真的，\n\
  那宣判死亡停止呼吸的長聲在閃過兩各畫面依舊響著不停，\n打開封鎖青春秘密的鎖，卻看見空盪的一切，\n確實!我們再也回不去了，青春再見。\n\n叛逆是我們都會有的過往，而最後是學會成長還是繼續墜落?\n\
  站在教室的頂樓難道就可以證明與別人不同?\n我們只不過是一直再奔跑，尋找逃脫的出口，\n沒有辦法了嗎?\n電影最後給了一各最後打擊的希望，\n總說棒球兩人出局才開始，至於最後誰勝誰負，那都已不再重要，\n\
  不是嗎?我們已經賠了青春這各賭注。\n\n\n九月的風似乎來得有點晚在夏天結束的時候，\n九個人七個朋友的故事，發現了更多被深鎖埋藏的記憶，\n其實早已活在那電影情節裡，試圖尋找當年的身影無法自拔，\n\
  最後還是相同的那句，青春再見。\n\n\n\n\n片尾響起雨生熟悉的聲音，\n外面的天氣早已沒了雨聲，\n1997年從此消失在世上的一切，又時空倒轉活了過來，\n\
  電影散場之後的我，一直站在路口吹了幾秒冷風才回過神來。\n\n\n--\nBack to British:\n\n\n\n--\n◆ From: 202.151.50.165"
