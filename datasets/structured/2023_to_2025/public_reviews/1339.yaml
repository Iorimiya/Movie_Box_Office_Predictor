url: https://www.ptt.cc/bbs/movie/M.1524060511.A.F0C.html
title: '[好雷] 《最後相愛的日子》來的太晚，但我喜歡'
content: "圖文好讀版 \n\n\n- 以下有《》劇情雷 -\n\n\n\n\n\n《最後相愛的日子》是一部講述奧斯卡女星葛洛莉亞葛拉罕(安妮特班寧飾)姐弟戀\n\
  的故事，透過男主角彼得特納(傑米貝爾飾)的回憶錄改編，道盡了傳奇女星生命中\n最後一段不為人知的浪漫戀情。\n\n如果你說姐弟戀有什麼好稀奇的，差個10歲不算什麼，那麼差個29歲呢？如果你說\n\
  他的愛情只是太晚相遇，那麼早已結過四次婚的戀情會不會讓人介意呢？如果你說\n孤家寡人求個歡愛又有什麼關係，那麼早已有 4位兒女相伴，你比他兒子都還要小\n，是不是還讓你覺得無所謂呢？就算在相對開放的今日，那1980年代的故事，依舊\n\
  讓人看見愛情魅力與不被年齡設限的魔力。\n\n\n\n\n雖然是姐弟戀的情節，但沒有轟轟烈烈的戀情，也沒有可歌可泣的劇情，從同是演\n員的臭味相投，到吃飯、電影、沙灘和看星星，已逾50歲的葛洛莉亞，不再是愛作\n\
  夢的年紀，享受大放大鳴不如平淡的愛，只求有個人可以傾心與相伴。\n\n較為鮮肉的彼得，也不因年紀上的差距怯步，該有的激情、床戲或調情，如同一對\n平凡的戀人般開心愜意，雖然偶爾不安份的手和說者無意聽者有心的關鍵字總會挑\n\
  起敏感的神經，但對於能在鎂光燈前大膽說出「這些人都想要上我」的露骨對白，\n小男孩始終是青澀的可愛。\n\n\n\n\n「日月逝矣，歲不我與。」可惜歲月這把無情刀，終究在人的臉上留下了痕跡。電\n\
  影中從葛洛莉亞曾經顛峰的一面，走向時代變遷風光過後的淒涼，一代巨星縱使再\n過樂觀，還是面臨「等待角色上門」的無奈，只是轉戰的跑道外多了彼得到來，這\n段戀情是不是來的太晚。\n\
  \n突如其來的癌症，終於讓這份愛隔了開來。一次關心的對話變成了風暴，面對小男\n友的將來，採取蠻橫不講理的手段，將這份本不被家人看好，連自己都不知道病後\n如何收尾的愛徹底斬斷。電影透過當局者迷的茫然，觀影者清的苦澀，一路走完了\n\
  相識、相愛、相處和相離，卻道不盡心酸的浪漫。\n\n\n\n\n從開場一件一件拿出擺滿的化妝品，到落幕一件一件收拾的行李，人生的高潮迭起\n，亦如兩人表演的舞台劇般，掌聲過後還是得鞠躬離開。葛洛莉亞病重的最後時刻\n\
  ，選擇的不是家人，而是這位男友，回味著以愛情為名，彼此對戲的時光。\n\n彼得更以成就葛洛莉亞莎劇的夢想，讓兩人真正的在舞臺上演出《羅密歐與茱麗葉》\n，綻放出短暫卻永恆的光芒，為純粹的愛流下動人的淚，彼此相知相惜的情感，在\n\
  大風大浪過後，或許曾經滄海難為水，也只羨鴛鴦不羨仙了。\n\n\n葛洛莉亞葛拉罕，曾經的奧斯卡女配角，在致詞時僅說了謝謝就灑脫的離開，而人\n生的傳奇色彩與風華絕代，卻也學習了她的瀟灑，無畏各種壓力與挑戰，留下了深\n\
  刻動人的美好，成為每個人心中的一種崇拜。\n\n----------------\n\n女人不論何時，都是渴望愛情的小女孩，尋找一位讓她傾心的男孩\n\n電影說輸人的電影開箱文\
  \  \n\n--"
