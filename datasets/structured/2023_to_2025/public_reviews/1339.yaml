url: https://www.ptt.cc/bbs/movie/M.1620136014.A.776.html
title: '[新聞] 防疫太好 日子太爽「雷神」澳洲開趴 重災'
content: '新聞網址：


  完整新聞標題: 防疫太好 日子太爽 「雷神」澳洲開趴 重災區人民嫉妒

  新聞來源:UDN聯合新聞網

  2021-05-04 聯合報記者 蘇詠智 報導


  新聞內容:

  新冠肺炎疫情雖然還未從世上消失，但有的防疫出色國家，人們過的生活和重災區民眾簡

  直是天壤之別，代表就是成績突出的澳洲。


  近來漫威大片「雷神索爾4」等都在當地拍攝，除了克里斯漢斯沃、娜塔莉波曼等系列主

  角都歸隊外，上一集就有客串的麥特戴蒙也又回來助陣，加上同樣加入客串的羅素克洛、

  梅莉莎麥卡西與大反派克里斯汀貝爾等，巨星雲集。


  身為澳洲地主的克里斯在拍攝空檔舉辦一場又一場夢幻派對，他曾經演過「玩命關頭」系

  列的妻子艾莎巴塔奇、他主演過「飢餓遊戲」系列的弟弟連恩、他演出影集「西方極樂園

  」的大哥路克、他在好萊塢最好的朋友麥特戴蒙等都是出席來賓，由於派對主題是白色，

  只見眾人都穿得一身白、都沒戴口罩也未保持社交距離，但照樣玩得超開心。艾莎立刻把

  派對的照片發布在社群網站上，來自新冠肺炎重災區的網友，看得又妒又羨又心酸。


  有人回應道：「我覺得她一半的圖文需要註明一件事，澳洲已經好一陣子沒什麼新冠肺炎

  疫情了，他們過的是另外一種日子。」加拿大的網友則寫道：「看起來似乎很好玩，真的

  好嫉妒你們還能跟自己的好朋友聚在一起。像我們加拿大安大略，甚至不能跟不住在一起

  的人碰面，祈禱能夠早日回到過去正常的生活。」目前還在疫情高峰的巴西，當地網友的

  發言就更令人同情，「能住在再也沒有新冠肺炎的國家一定很棒，巴西離這還遠得很。」


  --'
