url: https://www.ptt.cc/bbs/movie/M.1538796594.A.DC0.html
title: '[雷] 陽光燦爛的日子'
content: '好喜歡的一部片，有點像是當日記在寫，第一次電影版發文請多見諒，對於這樣幻想多於行

  動的青春


  北京變得這麼快。二十年的功夫，他已成為現代化的都市。我幾乎從中找不著任何記憶裡的

  東西。事實上，這種變化已經破壞了我的記憶，使我分不清幻覺和真實…


  最近開始把姜文電影看過一遍，很喜歡他這種開頭以旁白點題的方式。具體上是說北京的變

  化，從自行車到汽車、從公社到開放…等事物的變遷使其對小時的印象不太真實；由長大後

  的馬小軍說著這段旁白也表示著從少年到成年，已無法重回當初。


  看這部片會發現這不僅是姜文自己的青春片，會發現青春時多少人不是如此，充滿自我為是

  的英雄幻想與單純的愛情想像。


  關於英雄，從哨子、勳章到望遠鏡，都可以看出馬小軍的得意，但同時也從被公安抓看出了

  馬小軍的懦弱。總是期望著自己的勇猛被人瞧見，總是期望著自己能被群體接納，總是不習

  慣喜歡的女孩在自己面前和別人開心聊天，總是在懦弱後為自己的懦弱做出平反。電影中闡

  述著一個愛逞強而內心脆弱少年，誰不是呢？


  關於愛情，在這年紀稱的上愛嗎？姑且算是吧。從第一次對於照片中米蘭的迷戀和到對記憶

  的變造，可就稱得上是成長的過程了吧。在故事中充滿了竄改回憶的痕跡，包括有段小軍與

  米蘭翻看著相簿卻沒有泳裝的照片、在陽關燦爛處他倆跳著舞而畫面卻只有夏日倒印的光影

  。　


  我最喜歡的橋段在最後一幕，大家坐在車上，看見外頭久不見的傻子，他們叫著傻子，傻子

  回了句：傻逼，便又騎著自己的木棍自顧的走了。


  儘管成年了，儘管變化多大多快，在心中，少年時對於愛情的渴望依然像的傻子。


  到現在回想那些關於少年的記憶是很零碎片段的，前些日子和人聊天算是補上了一些。用人

  稱呼似乎顯得太淡薄，人是指那個我初戀的女孩，這樣講又顯得尷尬，儘管那也是好久以前

  的事了。


  部落格：

  電影/陽光燦爛的日子/



  --'
