url: https://www.ptt.cc/bbs/movie/M.1438776165.A.522.html
title: '[好雷]《真愛每一天》：美好的日子，有人愛著'
content: '網誌版：



  你喜歡你現在的生活嗎？如果給你一點超能力，那麼你最想回到過去改變什麼

  事情？你有把握每一次的修正都能讓人生更完美嗎？我一直在想，穿越時空此

  一題材的出現，反映現今社會上大多數人對於現狀感到不安、在某些人生片段

  留下遺憾、某些時光想重來第二遍，或是渴望改變命運......。我們深切明白，

  世界上沒有時光機，犯錯來不及竄改，錯過來不及告別，悔恨來不及原諒，因

  為我們沒有能力重新啟動過去的某一天，所以往往揮霍眼下的日子，不在意現

  在手邊擁有的。



  對我來說，《真愛每一天》最深刻的意涵是，「二度」經歷日子，才明白如何

  能過得更好，就算無法過得更好，也能轉換心態重新體驗那一天；重新體驗，

  再重新失去，對生命才會有深刻的感覺，才知道把握當下，享受每一天的美好。



  對21歲的提姆來說，他只想用超能力交到女朋友。《真愛每一天》的第一課是

  就算有超能力也無法讓對方喜歡上你。一個沒有緣分的女孩，就算利用超能力

  回到過去的任何一個時刻跟他告白，結果依舊相同。而提姆去了倫敦工作之後

  ，認識了瑪麗，儘管為了幫助同居的劇作家而錯失瑪麗，但藉由努力，提姆仍

  與瑪麗再度相遇、相識與相惜。我想，穿越時空改變不了內心的那份愛，即便

  如何地錯過，再度重來，對的人仍會碰頭。



  原先以為這部片穿越時空的設定僅用在男女主角的愛情線之上，但精巧的是，

  關於妹妹與父親的親情線。穿越時空有一個重大的原則，即是若回到孩子出生

  之前，便會影響孩子的樣貌。簡而言之，牽一髮而動全身，穿越時空並不是毫

  無阻礙，而是會產生一些蝴蝶效應，獲得這一方的修正，就會使另一方的結果

  也跟著變更。



  我很喜歡婚禮現場，突如其來的大風大雨，搞砸了原本應該美麗與歡快的婚禮

  。但這場大雨並沒有澆熄親朋好友的祝福的心，大家依舊開懷大笑，人生總有

  許多意外與不完美，你可以當它是場災難，但也可以當它是場驚喜，提姆沒有

  運用超能力改變這場婚禮，是因為他與瑪麗即便在那樣的時刻，仍然緊緊相依

  ，堅固的愛比外在打造的形式來的更珍貴。



  《真愛每一天》將孕育／死亡作一對照，當瑪麗提議生第三個孩子之時，提姆

  心中必須作出抉擇，當第三個孩子出生之時，他便無法再回到過去，否則將影

  響孩子的樣貌。新生兒象徵未來，父親即將死亡象徵過去，提姆並沒有選擇耽

  溺於過去的傷痛，而是決定迎接未來的生命。最後一次與父親見面，兩人決定

  回到童年，好好的重溫過往的平凡又幸福的時光，那是陪伴，無可取代的陪伴

  。父親的死亡不是結束，因為提姆的記憶是在的，唯有失去，他才能感受到當

  下的可貴，才懂得未來的每一天，都是堆疊出回味之日的美好基底。



  無論生活和生存都不浪費，在生命的本質下，無法重新來過，活著的價值就是

  不斷地前進，即便已逝的日子不盡完美，但它終究帶給你一些經驗與養分，讓

  你繼續前行，讓你知道自己該如何好好地活過每一天，試著將每一天當成新的

  日子來練習，它或許平凡，或許不凡，全看生活的心境，這一刻起，你不需要

  再穿越時空了。


  --'
