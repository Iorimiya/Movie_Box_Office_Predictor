url: https://www.ptt.cc/bbs/movie/M.1450043387.A.1D4.html
title: '[超好雷] 爆漫王--那每一個有漫畫與夢想的日子'
content: '雖然多年前就有朋友推薦我看原作，但直到真人電影上映的此時，我仍是在完全沒有


  看過原作的情況下去看了這部電影。



  　　身為一個追日系藝人，從2次元、2.5次元和3次元都略有涉獵的迷妹，我原以為自己


  會抱持著看演員的心態去看這部電影。而實際上在影片剛播前五分鐘時，的確也是懷抱著


  追星的心情在看。但，或許是前陣子與影劇漫畫等脫節許久的日常生活過度壓抑所致，


  我很快就跟著劇情回到更久以前把日劇動漫當成日常一份子的狀態。



  ------------------------------------------------------------------------------

  以下含劇情雷角色雷衍生雷，總之全都雷。不想被雷的板友請左轉囉～～

  ------------------------------------------------------------------------------



  　　整體來說，劇情節奏很流暢。所以即使片長2小時，觀影過程也完全不覺得累或不耐

  。



  　　佐藤與神木都算是日劇日影的熟面孔，可能因為各種因素，偶爾還是會被放在賣外表


  不是賣演技的那塊。也有人說，他倆角色應該對調。但我覺得現在的佐藤健，演非正常人


  的角色、或者是說....不那麼有偶像包袱、不中規中矩的會更吸引我。




  　　劇情前段的校園部分，兩人的動作神態都很有青春校園劇的感覺；我特別喜歡真城和


  高木從樓梯滾下去，一直到亞豆說會等真城，結果真城高興到表情扭曲那段。基本上，我


  只要看佐藤健的顏藝就覺得很舒壓XD　不過健君在片中有很多地方的眼神都詮釋得很好，


  十分到位，幾乎都讓我忘了他有大小眼這件事XDDD　




  　　川口的「漫畫家」感也詮釋得超棒；熱愛漫畫、為漫畫付出了一切甚至生命，到最後


  輸給了漫畫卻也無悔，完全就是非常自虐嚴格的日本人性格。我到片尾字幕時才知道這個


  角色由宮藤官九郎飾演，果然是脫離影劇太久了……




  　　JUMP之現實是有在看漫畫的人都知道的事。或者該說漫畫業也如同各行業般現實，但


  JUMP是把它發揮得淋漓盡致且最廣為人知，富樫的不合作也是經常被拿來嗑瓜子的材料。


  之前似乎都轉去舞臺劇活動的山田孝之，這次擔任外型不起眼，但存在感很重的編輯一角


  。我最喜歡他在和主角群把原稿交給編輯長時，回覆的那句：「和漫畫家站在一起的才是


  真正的編輯。」真是太帥了！在現實壓力下，又有幾人能做到如此程度呢？





  　　劇中飾演不良少年系漫畫作者的桐谷健太，託角色的福加上他的氣質感，也是令角色


  非常搶眼。好像又回到看ROOKIES那樣的熱血；為了取材而被打，感覺很蠢很超現實，但


  又沒有違和感。看到他面對來訪的真城時一臉興奮，真的很想跟他說……請你也先把鼻


  血擦一下好嗎XDDD




  　　女主角部分，我只覺得她的眼睛很美，很純真乾淨，有森林系的感覺。她有好幾幕都


  讓我覺得好像隨時會融在光裡消失，但又不是超脫人世的形象。這功勞應該有蠻大部份要


  歸給攝影師，角度和採光都配何得恰恰好。聲優也是很辛苦的工作，特別是近幾年，相較


  於男聲優來說，業界對女聲優的條件要求越來越偶像化，所以「禁愛令」這種規定也不是


  那麼難以想像的。劇情後段，豆亞帶著美麗卻淒絕的笑對真城說：「不可能會一直等你。


  」的瞬間，讓故事的現實面更加提高，將最後一點點日系浪漫都擊碎。但，置之死地而後


  生，「我先走一步了。」開啟了下一輪的轉折，迎向收尾。這對其實還抱著一絲小小狗血


  期待的我來說，是很令人記憶深刻的手法。





  　　都沒有提到神木隆之介，好像我不喜歡他似的，其實不是XD 我到今天才發現自己有


  時會把神木和本鄉搞混；明明知道誰是誰，但有時就是會忽然想不起來或連錯人。神木


  很適合演高中生；如同他在劇中的角色「高木秋人」所說，他們倆比起天才漫畫家新妻更


  貼近一般人。帶著調皮、有時失控有時傻楞萌，有時會賣隊友有時讀空氣的高中生，比起


  中規中矩的偶像路線更適合神木隆之介。而高木在劇本分鏡上認真、在醫院因不甘心落淚


  、在連載獲得好成績的天真雀躍神色，都確實讓我感覺到角色的鮮活立體。






  　　角色部分，最後提一下新妻吧。我對染谷這位演員真的沒有印象。不過在劇情後段，


  新妻來到主角群的工作室，主動插手替真城幫人物描線時，喃喃地說出他對真城畫技的觀


  察，這根本是鐵粉才辦得到的事，一反前面全部劇情塑造的不可一世感。




  　　JUMP鐵三角：「友情、努力、勝利」。



  　　新妻給人的驕傲俯視感，並非來自天生個性，而是實力，但又不是刻意造作的外顯…


  …是一種有實力當靠山，慢慢養成而透露在言行中的感覺。這樣的一個人是JUMP的TOP，


  偏偏他又是極其孤單、甚至孤獨，很有諷刺的感覺。或許連他自己都沒有查覺，他的內心


  深處是很希望有朋友的吧！所以才會對真城和高木說出具有宿命的對手感的發言。





  　　啊對了，我一直覺得飾演畫水獺漫畫的演員新井，長得好像殭屍電影的文才。



  　　除了演員們的精采表現外，看這部片很開心的一點就是處處可見小細節的用心，還有


  不時令漫迷們噗哧一笑的梗與CG的巧妙應用。如果你是90年代漫畫到近期進擊的巨人都有


  加減看的人，會特別有「啊！我知道這個www」的感覺。



  　　穿著體育服的真城在和亞豆分開後的笨拙小跳步、只要場景在編輯部時，那整片如山


  似海般的漫畫原稿參考資料、真城總是提著的帆布袋上有叔叔成名作的角色、高木的手機


  殼(感覺好像是FF系列，看不太清楚)和在研究分鏡做的筆記本上，給觀影者驚鴻一瞥的夜


  神月……慶功聚裡大家模仿知名動漫人物的台詞，或是以CG呈現的連載對決，高木真城拿


  的分別是鋼筆和鉛筆，一直到片尾字幕掃過各漫畫的作品，居然還出現了DN單行本XDDD





  　　可能有些人會覺得連載對決部分的CG很冗長，不過我倒是挺喜歡的；帶有一點打鬥感


  ，配上難得的漫畫分鏡CG，以筆為刃的對決！給靜態的漫畫對決帶入近似武打的實質動作


  感，而佐藤和神木也都演過神劍電影版，這對他們來說應該都是小意思了。




  　　個人認為值得一提的是，如果有看過鋼鍊的電玩，主角有一招是鍊成拿著畫筆大暴走


  的乳牛(即作者自畫像)，乳牛會在場上亂揮畫筆開殺。爆漫王這段拿著筆的過招CG，瞬間


  讓我想到鋼鍊的電玩場景，蠻有趣的。



  　　劇末，主角兩人在教室黑板大畫特畫設定稿的CG，也是挺賣技術感XD







  　　要說缺點的……大概只有幾處中文字幕翻得不是很適合吧。像是「不經寒徹骨，焉得


  撲鼻香」，這段其實照日文字面翻就足夠，把半文言放在少年熱血系，總覺得不太搭嘎。




  　　總之，我個人非常推薦進電影院看爆漫王的，即使沒看過原作也完全不影響觀劇感。


  如果會上二輪，我也會再去看個一兩次吧。但若是原作迷，可能多少都會覺得不夠好，這


  是難免的。




  　　不過，以劇情的熱血基調來說，何妨就放鬆心情，讓演員們陪大家渡過現實又不失熱


  血趣味的2小時吧！




  　　最後的最後……想到這幾年不斷有漫畫家逝世的新聞，再看看這部電影；週刊漫畫家


  真的不是人幹的行業啊！！！


  --


  感謝舉例～原PO是個和日劇日影脫節三百年的人....



  真的，沒愛誰管你筆觸長怎樣啊～　所以我該來補寄生獸嗎，好像有在第四台看到過...



  迷弟樣的神木，感覺萌！



  d板友你是不是很累的時候去看的呀？



  沒看JOJO所以....我是覺得那個顏色很像FF9的上色



  灌高出現的比例好高啊！



  什麼？！我是有覺得比較常看到他了，但原來已經有到（每一季）了嗎！



  s板友也是2.5次元同好嗎XDD


