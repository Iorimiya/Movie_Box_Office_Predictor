url: https://www.ptt.cc/bbs/movie/M.1755170828.A.A4D.html
title: 'Re: [ 普雷] 稍嫌失望的凶器'
content: '恕刪



  我很喜歡這部電影的風格，但也同意它存在許多劇情漏洞。不過，我會盡可能依據自己記

  憶中的細節，嘗試給出一些解釋。


  ‧校園議題的暗面


  《凶器》圍繞著當代校園問題展開。


  片中的老師與警察都有酗酒傾向，老師甚至有酒駕前科與行為不檢的紀錄。保羅與妻子的

  對話中，也透露出類似問題，甚至可能伴隨更嚴重的心理與暴力傾向，從他在被刺傷後

  對小偷的暴力反應，就能窺見一二。


  小偷則象徵毒品的威脅。為了購買毒品，他能不顧一切闖入 Alex 家，卻對家中情況視而

  不見；他對懸賞告示的關心只是表面功夫。從他與家人的電話對話可看出，他也是家庭的

  「寄生蟲」，毫無貢獻，只有消耗。


  薩諾斯在協調會上的怒斥，顯得不分青紅皂白，甚至用紅油漆惡整老師，呼應了他兒子馬

  修對 Alex 的霸凌行為。屋頂夢境中出現的槍枝，可能暗示美國校園槍擊議題；而「2:17

  」的細節，或許影射《馬太福音》2:16-17 中屠殺伯利恆兒童的故事。馬修房間裡的槍枝

  海報，進一步暗示了他潛在的暴力傾向。


  校長則以「垃圾食物」作為象徵。酒精、毒品、槍枝、霸凌、垃圾食物，構成了校園中多

  種有害元素。而阿姨則像是「成癮」的觸發者，一旦染上，便如同喪屍般被操控。


  ‧邪教與控制的符號


  從冬蟲夏草的紀錄片、黑板上的「寄生蟲」字樣，以及阿姨首次施展巫術的儀式來看，她

  是透過「宿主的私人物品＋施法者的血液」達成控制狀態（警察被誤傷的血液事件也與此

  相呼應）。


  鈴鐺上的「6」與三角形符號，暗示了邪教與黑魔法的連結。在部分文化中，三角形象徵

  「控制」。甚至宿主奔跑時，手部與軀幹的姿勢也形成了三角形，似乎在視覺層面呼應這

  一點。


  阿姨透過吸取宿主的生命力達到續命目的，也可能將能量輸送給盆栽來延續生命。宿主被

  控制的時間越久，恢復期就越長（片尾有暗示）。



  ‧Alex 為何能活下來？

  電影中，阿姨必須保留一名健康者來餵養宿主，並偏好選擇容易聽話的孩童。但這裡確實

  存在邏輯漏洞與敘事不嚴謹之處，讓觀眾難免感到疑惑。



  --'
