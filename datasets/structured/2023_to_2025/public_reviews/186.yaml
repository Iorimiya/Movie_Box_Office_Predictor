url: https://www.ptt.cc/bbs/movie/M.1755249091.A.6F8.html
title: '[好雷] 凶器'
content: '感覺很久沒看到像咒怨一樣的非線性碎片化敘事了


  再加上部分重複情節但不同視角的演出也讓人驚艷


  連片段前面先打出人名也讓人覺得好熟悉




  鏡頭語言很有沉浸感


  好幾個鏡頭讓人有不寒而慄的感覺


  例如女主跟蹤到小男孩家門外晚上在車上睡著時


  小男孩媽媽被操控著朝車子一跛一跛走來那段真的讓人寒毛直豎




  而整部我覺得最出彩的是配樂


  把懸疑的氣氛渲染得很好




  至於劇情上我認為這種片就不需要太多的解釋


  把懸疑的氣氛弄到位，結尾高潮給出讓人耳目一新的表現就行


  這裡就帶出我自己覺得唯一美中不足的地方，就是結尾的幽默部分和好結局缺少了一種後勁


  有點在最後沖淡了整部片的恐怖懸疑基調偏向平淡


  如果最後女巫其實沒有被消滅，例如亞契最後抱著亞歷克斯的特寫時給個亞歷特克斯眼睛像

  女巫的眼睛一般閃爍一下這樣，讓我走出戲院時能夠保有種不寒而慄的感覺就太好了


  當然這只是因為我喜歡像異形智慧這樣的結局，所以才會覺得兇器的收尾不太夠力，你如果

  不喜歡可能就不會認同我的看法




  總的來說我自己覺得兇器>宿劫


  完美的配樂+有趣的鏡頭敘事+編排到位的劇本


  如果喜歡懸疑帶點恐怖氛圍的片那真的是非常推薦


  --'
