url: https://www.ptt.cc/bbs/movie/M.1534229915.A.5E3.html
title: '[新聞]馬克華柏格演膩無腦CIA 護送人間凶器'
content: '新聞網址：


  好萊塢男星馬克華柏格（Mark Wahlberg）在動作新片《拳力逃脫》（Mile 22），身兼製

  片與男主角，日前出席電影首映時坦言「演膩了無腦動作CIA」，他說:「與我之前演過的

  CIA探員都不同，《拳力逃脫》中的特工很真、很酷，個性就像你我身邊會出現的人，他

  壓抑、躁鬱，給自己及周遭的人極大壓力，但要他接受的任務，一定使命必達。這是我見

  過最聰明的動作片，讓你猜不到下一步，也絕對會讓觀眾驚豔。」


  他在片中要護送「線人」伊科烏艾斯逃離城市，22哩路的距離生死奪命，若無法在限定時

  間完成任務將全數斃命。以電影《全面突襲》（The Raid）驚豔好萊塢的印尼男星伊科烏

  艾斯不只演出關鍵角色，更擔任全片武術指導，所有打鬥設計均不假他人之手，他說:「

  真正厲害的打者是不靠武器的，因為他自己本身就是個『人間凶器』，舉凡車內安全帶、

  車窗、警用手銬、病床等等都能成為致命武器。」


  除了華柏格，《陰屍路》女星蘿倫柯漢在片中飾演女特工，與烏艾斯均有精彩搏博動作演

  出，她說:「在我飾演一位身手矯健且殺人不眨眼的特工，打得很爽，伊科設計的武打動

  作讓人血脈賁張。』而以電影《全面突擊》驚艷好萊塢的印尼男星伊科烏艾斯則說:「設

  計武打動作就跟編曲一樣，一對一很無趣，但若是很有韻律的一打多，就像跳舞一樣有趣

  。」電影本周五在台上映。（謝宛儒／綜合報導）



  --'
