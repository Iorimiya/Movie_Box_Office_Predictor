title: 'Re: [討論] ［劇情雷］凶器'
content: '原po問題已經有人回答了 就不贅述

  分享幾個觀察到的狀況

  一樣防雷



























  自己觀察到的女巫施法規則

  1.必須都要在室內施法

  2.必須被明確邀請進入房子

  3.必須由房子主人給予一盆水

  4.控制對方需要葉子、對方物品、水盆、鈴鐺、施法過程要在對方面前

  5.攻擊目標要目標頭髮、施法者血、跟樹枝

  6.取消攻擊命令是把折枝丟進水盆中

  7.盆栽不能被陽光照射


  大概是這些，有對應到為什麼不控制老師或家長

  等細節，有錯或是有什麼新的規則可以大家討論。

  整部我自己覺得還蠻有趣的，就是現代女巫版的都市傳說，整體評價給好看，但沒有一定要去電影院看，相反比較適合在家看





  --

  Sent from nPTT on my


  --'
