url: https://www.ptt.cc/bbs/movie/M.1755568322.A.FB1.html
title: '[好雷] 凶器Weapons'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  極具喜感與節奏感的敘事，好合我胃口。整個觀影的過程都非常愉快，音樂安排也算上加

  分。恐怖度來說，還好（為數不多的嚇人，沒有真正嚇人。基本上算是氣氛型恐怖），有

  一點緊張同時又有很多讓人發自內心想笑出來的部分。看得心情複雜而愉快。


  很為朱莉亞嘉納感到開心，之前跟室友一起看《黑錢勝地》最後就是最喜歡她演的那個角

  色。雖然有感覺她因此而有名，後續除了影集外，也有好些大銀幕作品，但總覺得以演出

  來說，好萊塢的強者太多，單拼表演實在很難有什麼突破。看到這部片中的她，那種親切

  感又回來了。也許導演就要她這個型，她這樣的演出，就像喬許布洛林在其中也是如此自

  然暢快。加上本片靈魂級的阿嬤和小男孩（也許還有那位Ｃ毒的男生），完全就是我想看

  的那種電影。


  當年很愛《宿劫》，但這次《凶器》的預告並沒有立即吸引我，直到週末幾位友人看完大

  推，才決定一衝。沒想到，從電影開場五分鐘就令我發自內心地笑了（就我目前印象所及

  應該只有這導演做到）。


  至於有沒有像此前看到北美影評出來的那麼經典和震撼，我好像無法確定。如果不是遇上

  左右兩邊都聊天的觀眾（雖然必須說他們滿有品，用氣音之外，手機也低光），我想我會

  更滿足一點（當時一刻都不想錯過，所以沒有換位置，不知道是不是錯誤的選擇）。



  ***


  這裡是我的樂園:




  --'
