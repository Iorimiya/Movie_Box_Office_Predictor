url: https://www.ptt.cc/bbs/movie/M.1745974383.A.C23.html
title: '[討論] 【凶器】官方預告'
content: '【凶器】是由新線影業與【宿劫】鬼才編導札克克瑞格一同打造的最新恐怖驚悚片。


  同一個晚上的同一個時間，同一個班級裡的所有小孩，都神祕地失蹤了，除了一個小孩。

  整個小鎮都開始懷疑，究竟是誰或背後有什麼原因，導致這些小孩都不見了。


  主要卡司包括喬許布洛林、茱莉亞加納、艾登艾倫瑞克、奧斯汀亞伯姆、凱瑞克里斯多夫

  ，以及黃凱旋和艾美麥蒂根。


  這部電影由札克克瑞格自編自導自製，其他製片人還有羅伊李、尹米莉、傑迪利弗席茲和

  拉斐爾馬爾古萊斯，監製則是蜜雪兒莫瑞賽和喬許布洛林。


  幕後創意團隊包括攝影指導拉金西波、製作設計湯姆哈默克、剪輯喬墨菲及服裝設計翠許

  桑莫菲爾。配樂則是萊恩哈樂戴、海斯哈樂戴和札克克瑞格。


  【凶器】由新線影業出品，Subconscious/Vertigo Entertainment/Boulderlight

  Pictures公司製作，導演札克克瑞格作品，華納兄弟影業發行，同步推出2D、IMAX版本。


  --'
