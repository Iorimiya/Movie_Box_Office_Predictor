title: '[新聞] 宿劫導演驚悚新作《凶器》第二支預告公開'
content: "眾家漫威明星助陣《宿劫》導演驚悚新作《凶器》第二支預告公開！小孩集體失蹤、大人\n相繼失控\n\n\n\n（圖片來源：華納兄弟影業）\n\n近年因廣受好評的恐怖電影《》（Barbarian）而引起影壇高度矚目的札克柯瑞格（Z\n\
  ach Cregger）導演，今年八月將推出最新自編自導的又一恐怖力作《》（Weapons）\n，今天則接續公開了第二支預告片。\n\n但和四月底釋出的前導預告一樣，依舊沒透露太多劇情訊息，照舊賣足關子，充分營造神\n\
  秘感。\n\n官方劇情簡介：\n\n同一個晚上的同一個時間，同一個班級裡的所有小孩，都神祕地失蹤了，除了一個小孩。\n\n整個小鎮都開始懷疑，究竟是誰或背後有什麼原因，導致這些小孩都不見了。\n\
  \n本片與《》設定在相同宇宙，是同系列的衍生作，北美預定 08 月 08 日上映。\n\n\n\n\n\n\n（圖片來源：華納兄弟影業）\n\n本片主演卡司網羅了「」（Benedict\
  \ Wong）、即將在《驚奇4超人：第一步》（\nThe Fantastic Four：First Steps）以「」身份亮相的（Julia\n Garner）、「」（Josh\
  \ Brolin）、即將在漫威影集《》（Iron\nheart）亮相的艾登艾倫瑞克（Alden Ehrenreich）四位 MCU 成員、以及來自 HBO 人氣\n\
  影集《》（Euphoria）班底之一的奧斯汀亞柏拉罕（Austin Abrams）等人。\n\n文：Joker\n\n\n新聞網址：\n\n\n\n--"
