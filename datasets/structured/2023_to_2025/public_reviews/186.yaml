url: https://www.ptt.cc/bbs/movie/M.1754678878.A.C29.html
title: '[好雷] 兇器:好慢的恐怖片'
content: '凶器是由「宿劫」導演執導，講述一個小鎮一雲小孩開始火影跑離奇失蹤，女主角被怪罪

  開始一步一步的揭發真相


  建議預告不要看，甚至影評也不要看，或是還沒看的看到這裡就好了，我就是被影評雷到

  以至於前90分鐘都覺得步調很慢，前面我貼的老王片段也不要看，那是很後面的了，劇情

  推進在這部非常的慢，本片採用多角色視角去講述同一個故事，所以重複的東西很多

  而且劇情推進的非常緩慢，甚至要等一個嚇點都要等很久，如果被劇透一點點都會覺得

  很無聊


  女主角就是驚奇四超人女銀衝的演員，老實說她拍的那場床戲不知道為什麼特別的騷

  然後跟她外遇的警察也很好笑，明明老婆胸前偉大還要去外遇飛機場女銀衝


  跳嚇非常多，不喜歡的要注意，然後血腥片段也多，而且是那種慢慢折磨人的類型，不是

  一刀捅死人的那種，是拿很多種利器慢慢噴血的，還要大塊扯肉的


  笑點沒想像中的多，確實蠻好笑的，不過可能是最近看太多驚悚喜劇，像是絕命終結站

  或在一起，這部沒想像中的好笑


  然後現在導演都喜歡偷渡是怎樣?窒友梅根偷渡自己喜歡的科幻片，這部偷渡火影忍者

  對了火影是美國史上最暢銷的漫畫，超越海賊王，所以觀眾不可能不注意到，偷渡

