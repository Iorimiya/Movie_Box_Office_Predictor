title: '[請益] 有雷-有關"凶器"沒看懂~'
content: '抱歉 各位版友


  請問下 凶器看完了，但是我一直沒弄懂那個巫師婆婆到底為什麼要這樣做?

  只是因為平常沒人關心他，所以產生了報復社會的心態?


  還是因為搬到那位小朋友家以後 家人沒有很歡迎他(甚至有點嫌棄)所以就故意惡整??


  本人領悟力不足 還請各位版友指教 謝謝


  --

  所以簡而義之 整篇故事就是一個吸人生命力的巫婆 到了小鎮肆虐以吸收更多人的生命力就是了~'
