url: https://www.ptt.cc/bbs/movie/M.1755059723.A.327.html
title: '[好雷] 凶器 多重元素 一次滿足'
content: '忘記是史蒂芬金還是哪一位作家說過


  寫出好小說的第一步


  是用一句話概述主題就能深深抓住讀者的注意力和興趣



  "17名同班小學生在深夜同一時間從家裡往外火影跑 再也沒有回來"



  大概除了火影跑這個動作有點問題外 這一句話呈現的故事主題應該會非常吸引人才是



  預告也成功達到話題吸住不少人的眼球


  一部恐怖片該有的賣座元素看來都到位了



  但成功的地方也可能是失敗的開始



  畢竟本片的節奏不是一般人習慣的步調


  不是預期的步調 往往就是現代人評為爛電影的理由



  但事實上電影內容是極為精彩的


  本片使用了我還未見過用在驚悚、恐怖片型上的非線性敘事


  當然可能是我看的電影不夠多 如果有相關電影也是一樣手法的請告訴我


  非線性的結構讓觀眾用各角色的視角窺探事件


  既有懸疑效果也讓各個電影角色個性鮮明飽滿


  我個人很喜歡前半段寫實的描寫


  班導隨時有被報復的危險 連想追真相也被不是她職責也不應該打擾學生隱私拒絕


  失蹤小學生之一的爸爸整天魂不守舍 不知如何是好的無力感


  連警察工作的標準SOP呈現也不馬虎 水管上隨身密錄器拍美警值勤時真的就像那樣


  搭配偶而出現的jump scare提醒你這還是一部恐怖片



  前半段那些看似不太相關的片段終於在步向結局的過程中匯流一道



  接著 畫風丕變 原本妥妥的驚悚恐怖 加入了邪典元素


  最後 在高潮之中 轉變成讓人啞然失笑的喜劇片(誤)



  這太讓我拍案叫絕了  你以為很單純的一部恐怖片


  如今多重享受 各種片型都摻在一起做成撒尿牛丸 太值回票價了


  各位 這不是諷刺 而是讚嘆 真的非常精彩



  我還因此不斷搜尋片中那種超自然力量的來源是什麼


  儀式看起來非常到位 是吉卜賽? 還是印地安嗎?


  後來看到有個說法是巫毒教派 正確答案我還尚未查出


  但看到巫毒娃娃的圖片後 我突然理解為什麼片中要用火影跑了





  --

  對 雖然有些畫面失焦處理或一閃即過 但該有的血腥都沒有少 尤其那個削水果皮...'
