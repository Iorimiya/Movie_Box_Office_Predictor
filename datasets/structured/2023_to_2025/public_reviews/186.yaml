title: '[好雷]  凶器'
content: "《凶器》有雷觀後感\n\n1. 整體故事非常簡單，但用多人物視角方式慢慢揭密，說出一個ok的故事。\n\n2. 意外的很好笑，欣賞導演非常有製造笑點的能力～\n\
  \n3. 關於現實意義，目前只想到家暴、家內議題外界要怎麼提供協助\n\n電影裡所有人的善意雞婆，當然是讓孩子們得救的主因，但沒有人知道，自己能否從謊言\n與利用的風暴中全身而退。\n\
  \n有聯想到X調查講的一個日本婦人洗腦控制6個家庭的案件，本片最後除了埋了很有續集潛\n力的伏筆，也暗示這類洗腦控制造成的創傷，需要很長的時間復原與修正。\n\n\
  –\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n\n--\n跟朋友聊，覺得很多設計，比較偏為了把人物串在一起的過橋\n\
  探討的部分淺到感覺可有可無\n但這片還是很有趣\n被玩的很開心（？"
