url: https://www.ptt.cc/bbs/movie/M.1754854409.A.0BA.html
title: '[新聞] 《凶器》以 4250 萬美元的亮眼神秘數字'
content: "新聞網址：\n\n \n「《凶器》以 4250 萬美元的亮眼首映成績，《辣媽辣妹2》以 2900 萬美元強勢開局」\n \n恐怖懸疑片《凶器》（Weapons），講述一群失蹤兒童的故事，以及身體交換喜劇《辣\n\
  媽辣妹2(Freakier Friday），在本週末聯手出擊，在夏季電影季即將結束之際，提振\n了票房銷售。\n \n儘管《驚奇4超人》以 1.176 億美元的強勁開局，但隨後幾週票房大跌，\n\
  第二週下滑超過 67%，上週末又再跌了 60%。這部超級英雄電影在國內票房累積 2.3 億\n美元，最終票房可能將低於其競爭對手 DC 影業最新的漫畫改編電影《超人》（Superman\n\
  ）。\n \n《凶器》的成功應該會讓 Cregger 躋身頂尖導演行列；他已經受邀重啟《惡靈古堡》\n系列。\n \n位居第四名的是環球影業和夢工廠動畫的《壞蛋聯盟2》（The\
  \ Bad Guys 2），上映第二\n週獲得 1040 萬美元，較首週下跌 53%。這使得這部動畫續集在國內的總票房達到 4340\n萬美元。其前作在北美的最終票房為\
  \ 9700 萬美元。\n \n在派拉蒙影業被 Skydance 收購後，其舊體制下最後一部上映的電影《脫線神探》（The\nNaked Gun）則位居第五。這部由\
  \ Liam Neeson 和 Pamela Anderson 主演的動作諷刺喜\n劇，在第二個週末進帳 830 萬美元，使其在北美的總票房達到 3300 萬美元。\n\
  \ \n在其他新上映的寬螢幕電影中，專門製作信仰題材節目的 Angel Studios 推出了奇幻喜\n劇《怪奇寶貝》，首映票房為 250 萬美元。\n \n\
  \ \n海外票房全面撲街，好萊塢真的不行了\n \n--\n海外票房比例低成那樣，理論上凶器應該更高好嗎?\n精簡，不然你發一篇阿\n第一周票房不可以提，你分篇連噓會水桶喔!我剛剛已經成功檢舉過一個人了\n\
  一周以上可以啊，問題?"
