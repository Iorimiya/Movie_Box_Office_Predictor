title: '[討論] 暑假的觀影素質毀了《凶器》'
content: '我是在信義威秀看19:00的場


  觀影前，角頭的宣傳片同時也在宣導電影院守則


  不要用手機、不要聊天、不要踢椅背..之類的


  這麼鄭重的宣導短片捏




  但天哪..看這個暗咪謀的懸疑電影


  我的右邊、左邊、左後方依然都在講話


  還給我用手機不調低光



  右邊的講話完全沒有試圖用氣音


  左邊的兩個女學生幾乎從頭聊到尾，還給我講三句以上


  左後方也是依然故我地聊



  (我不是最多只能接受"要吃嗎"、"廁所"、"借過"、"手機收起來"

  以上這類句型)



  天哪  可以窸窸窣窣到三句以上到底有沒有羞恥心？


  我稍微往前坐，轉頭死死盯著左側的女學生


  但她們毫無節制、還一直笑得花枝亂顫




  在凶器演到緊要關頭時(第一次要進那個房間時)


  左後方的人總算被罵(好像其中一個是外國人?)


  有一個女性聲音突破寂靜的氛圍


  一聲「閉嘴」就這樣迸出~





  老實說我也是看得很不爽


  但除了怒瞪、嘖一下，也不敢像她那樣直接罵


  畢竟開罵也同時影響到其他人了 難為...


  早知道多花點錢去松仁威秀看、素質好一點


  可惜時段有點晚




  大家遇到會怎麼做呢？


  --

  今天週四 哭哭 而且這些人也不是小孩了 詭異

  這場就是屬於不能溝通的兩成..

  你人真好  我懶得選字  複製你的囉

  華山、光點、誠品確實素質差很多，但也跟上的片類型有關。低素質人口不看歐洲藝文片

  真的，我以為觀眾素質會越來越好，現在宣導片和網路都很多內容在提醒了。結果居然..

  ..

  會不會是紅姐？

  凶器爆滿，只剩前兩排有空位，而且我們坐定位時很難找到附近的人之後會如何。真的只

  能賭運氣...'
