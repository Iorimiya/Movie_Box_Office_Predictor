url: https://www.ptt.cc/bbs/movie/M.1755350728.A.DF1.html
title: '[普雷]    預告片很強'
content: "防雷頁\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n好的  今天來介紹 近期上映的 低成本恐怖片\n\
  \n凶器\n\n\n先說結論\n\n值得一看，但不值得進電影院\n\n評分為 6/10\n\n導演是之前拍  宿劫  的導演\n\n\n兩部片的拍攝手法也類似\n\
  \n都是拆解成多人視角敘事方式\n\n各種不同視角來拼湊出完整的事件\n\n這類拍法在日本鬼片已經很多了\n\n所以對亞洲觀眾來說沒有很新鮮\n\n\n\n\n\
  喜歡玩狼人殺的\n\n這部片有點類似\n\n你在看各玩家表水\n\n只是結局就........\n\n\n\n開頭蠻吸引人\n\n用小女生的說話方式開頭\n\n\
  馬上把重點說出17位小朋友集體失蹤案\n\n讓觀眾開始想推理知道完整真相\n\n也是電影的最大賣點\n\n\n\n\n\n憤怒的家長將怒火指向老師\n\n在她車上噴漆女巫、開會議各種指責\n\
  \n\n其實家長心理都知道跟老師沒關係\n\n但就像中世紀發生瘟疫\n\n村民都會亂抓女巫出來燒死一樣\n\n怒火需要發洩而亂找標的\n\n\n\n\n從老師視野來開始故事\n\
  \n讓觀眾知道老師是真的無辜的\n\n她真心關心著沒有失蹤的ALEX\n\n也帶出警察PAUL是她的前男友\n\n現在還愛著她的關係\n\n雖然我覺得這段很多餘\n\
  \n但應該是想表達出老師是正常人吧\n\n也會有慾望情愛\n\n\n\n\n\n家長 亞契\n\n因為兒子 馬修  不見而開始追查案件\n\n也是在賈斯汀車上噴漆的傢伙\n\
  \n\n亞契情緒控管有問題\n(把怒火發在老師身上、噴漆)\n\n所以兒子馬修也有暴力傾向\n(房間的槍枝海報、霸凌ALEX)\n\n隨著亞契跟蹤賈斯汀\n\n\
  看到賈斯汀被校長馬可仕像瘋狂的追擊\n\n開始發現事情並不尋常....\n\n也證實了賈斯汀是無辜的\n\n之後兩人一起調查案件發現ALEX家有不尋常\n\n\n\
  \n\n\n警察 PAUL\n\n\n賈斯汀前男友\n\n身分是個警察但並不太靈光\n\n上司還是岳父\n\n追查毒蟲JAMES時可以看出沒有很靈光\n\n爆揍了一頓後發現行車紀錄器拍下自己的影像\n\
  \n怕被申訴只好把他放了\n\n並警告他不要出現在他眼前\n\n結尾是看到JAMES出現在警局外\n\nPAUL 開車開始追殺他後發現他只是想提供17位小孩消失的線索\n\
  \n兩人一起組隊到ALEX家\n\n\n\n\n\n\n\n毒蟲 JAMES\n\n就是個毒蟲\n\n到處偷東西亂賣\n\n一有錢就買毒吸\n\n意外闖入ALEX的家發現他的爸媽跟人偶一樣不會動\n\
  \n地下室有大量小孩也不動後逃跑\n\n因為協助破案有5萬獎金\n\n前往警局想提供線索\n\n接著就跟PAUL組隊前往ALEX家\n\nPAUL單獨進入沒多久後\n\
  \n像是失了神一樣將JAMES拖入屋內\n\n\n\n\n\n校長 馬可仕\n\n這個篇章開始帶出ALEX家中住有一位姨婆 格拉迪斯\n\n說話很詭異且希望不要有人來家訪\n\
  \n最後 格拉迪斯  主動拜訪 馬可仕的家\n\n直接演給觀眾看他就是女巫對 馬可仕 下咒\n\n成為了她的 凶器\n\n\n看到這裡就覺得頗為失望\n\n原本以為的推理解謎變成了女巫下咒\n\
  \n泰國、老港片都很多這類題材\n\n\n\n\n\n學生 ALEX\n\n最後篇章直接演給你全部怪事原由\n\n格拉迪斯 假冒 ALEX的姨婆\n\n更正:\n\
  \n阿姨  看起來太老  一直覺得是 alex媽的阿姨\n\n設定好像是姐姐才對\n\n\nALEX爸說 15年以上沒見面\n\n阿姨卻說他出生時候看過他\n\n\
  可以推測這個阿姨是假的\n\n冒用身分來他們家\n\n用著巫術來吸收當地人的生命力\n\n先是爸媽，再來是17位小孩\n\n\n為何不殺ALEX\n\n因為小孩好威脅好掌控\n\
  \n且這些 凶器 部隊  需要人照顧來維持生命\n\n整部片一直給你一個概念\n\n當你被下咒後\n\n就會像被寄生一樣\n\n完全沒有自我意識任人擺布\n\n\
  \n很可惜的點是\n\n沒有說為何要17位小孩\n\n單純先備好??\n\n所以ALEX很可憐的一人照護 2+17 很長一段時間.....\n\n每天光餵食就累死\n\
  \n\n最後ALEX氣到不幹\n\n直接用你的魔法對付你\n\n對你下咒\n\n17個小孩直接把你分屍\n\n\n\n看到這我只覺得這部應該要叫   咒術迴戰\n\
  \n巫婆最大的敗點就是\n\n沒事給他加重工作負擔\n\n員工不幹了直接逆襲殺了妳這慣老闆\n\n\n片尾  告訴觀眾\n\n女巫死後眾人有慢慢恢復\n\n看你被操控多久恢復期就會拉長\n\
  \nALEX爸媽被操控很久\n\n聽說還在被餵著湯\n\nALEX搬家被另外一位姨婆照顧著\n\n有些小孩慢慢恢復到可以說話\n\n\n\n\n\n這部片就是虎頭蛇尾\
  \  越演越失望\n\n沒有解謎推理環節\n\n最後直接跟觀眾說\n\n\n嘿嘿嘿  有一個大壞人啦\n\n\n\n詛咒細節不交代\n為何來這不交代\n為何要17位小孩不交代\n\
  .............\n.............\n\n整部片的觀後感就是想抄史蒂芬金的作品\n\n但看完覺得編劇還不到位\n\n\n\n\n\n打到這好像應該要改5分\n\
  \n但其實前作 宿劫\n\n也是很類似的結局方式\n\n只能說他的行銷跟預告片剪的不錯\n\n國外好像都還是覺得蠻好評\n\n而且他兩部作品都很低成本\n\n\
  然後獲得高票房\n\n這導演下一片不敢進戲院了\n\n\n\n\n\n補幾個小彩蛋\n\n\n1.   2:17  這個數字是致敬  鬼店  的房號(小說版)\n\
  \n2.   被控制的人的跑姿靈感來自越南的小女孩照片  三角形象徵被人控制著\n\n3.   巫婆跟校長馬可仕 說話時候 說ALEX爸媽有一種病不嚴重  是中世紀的用語\n\
  \n     校長聽不懂，可以推測他這樣吸命已經活很久了\n\n4.   巫婆有去毒蟲的帳篷附近嚇他   我個人覺得有點類似 IT  可能是致敬\n\n\n\n\
  \n\n\n\n\n\n\n--\n\n\n\n\n\n\n\n--"
