url: https://www.ptt.cc/bbs/movie/M.1757343552.A.9DD.html
title: '[幽默雷] 凶器：看到結尾下巴掉下來'
content: '年紀越大，越來越不敢看驚悚片。不是因為 jump scare，而是越來越能共感主角因為「

  失去」伴隨而來的痛楚與執念：失去孩子、失去家人、失去寵物。當你在意的事物變多，

  入戲也就更容易跟著角色自問：「這是我的錯嗎？我能不能做些什麼阻止這一切？」真正

  讓人害怕的，其實是那份不可承受之重。

  .

  因此，一開始是不打算看《凶器》的。特別是廣告詞寫著「前一晚凌晨 2 點 17 分，甘

  迪老師班上的每個孩子都醒了。跳下床、走下樓、打開大門，跑入黑暗...他們再也沒有

  回來。」設定確實耐人尋味，但也擔心又是一部純嚇人的恐怖片，看完給自己找罪受。

  .

  但我終究被它的優異口碑動搖了。兩年前就有耳聞這部片因為好萊塢罷工被迫重新選角，

  但卻無損華納對這部片的信心，還因內部試映反應熱烈提前半年上映，將這樣的驚悚劇情

  片排進暑假黃金檔。

  .

  看完後，我完全理解華納的信心：這不只是驚悚片，更是一場精心設計的拼圖遊戲。一開

  始先靠零碎圖像拼出邊角，隨著故事展開、看懂線索如何連結，殘酷的全貌也隨之清晰。

  當最後一塊拼圖落下，恍然大悟的驚喜遠遠勝過單純的驚嚇 ─ 不只是氛圍鋪陳，更是敘

  事巧思，讓《凶器》先讓人拍案叫絕、終於意猶未盡。


  /


  延續廣告詞的詭譎情境，劇情從事發隔天正式展開：甘迪老師（茱莉亞加納 飾）走進空

  無一人的教室，座位只剩下名為艾利克斯的學生。導演札克克瑞格將故事拆分成六個章節

  ，透過六種視角 – 除了甘迪老師，還有校長馬克斯、心碎父親亞契、婚姻失和的警探保

  羅、流浪癮君子詹姆斯 – 拼湊失蹤事件的真相。這種非線性的敘事讓角色不只是符號，

  而是在視角交錯間，碰撞出壓抑的慾望與深埋的秘密。

  .

  本片成功的關鍵在於精準的選角。如果啟用明星感太強的演員，很可能破壞觀影樂趣，讓

  觀眾預設誰是兇手、誰又能活下來。因此本片的大小角色多是陌生臉孔，即便是茱莉亞加

  納與喬許布洛林等近年比較常參與商業大片的實力派演員（因為獨特氣場不約而同加入漫

  威宇宙，以特效面目擔任反派），也是因為演技出色、而非星味壓場。

  .

  沒有看《黑錢勝地》《創造安娜》，總算在《凶器》見識到加納的銀幕魅力，從冷漠、壓

  抑，到主動出擊、抽絲剝繭的歷程詮釋得層次分明；布洛林則將痛失孩子的絕望內化成堅

  毅，時而展現非常手段的強悍，冷硬外表下藏著些許反差幽默，恰如其分地呼應本片獨有

  的黑色基調。其他配角如奧斯汀亞伯拉罕、艾登艾倫瑞克與王漢斌，也都把「我到底惹上

  什麼麻煩」的莫名煩躁演得真誠而荒謬，反而更強化了電影的詭趣氛圍。

  .

  但本片最令人難忘的，絕對是艾美麥迪根飾演的葛拉蒂斯阿姨。這個宛如潘尼懷斯之於《

  牠》、瓦拉克之於《厲陰宅》的存在，氣質神秘詭異。麥迪根雖然演藝資歷豐富，但近年

  淡出影壇的她的確不是觀眾熟悉的臉孔，她以誇張妝容與虛偽笑容，成功將觀眾帶入一種

  「她怪怪的，但說不上哪裡不對勁」的不寒而慄。


  /


  但要說《凶器》的真正靈魂，非導演札克克瑞格莫屬。他太懂得如何吊觀眾胃口：爆點往

  往突如其來，當劇情走向難以預料、故事又說得引人入勝，觀眾也就放棄推理，全心投入

  。

  .

  不過，他不一味追求驚嚇，而是以喜劇演員的出身，適度顛覆熟悉的驚悚片公式。從《宿

  劫》到《凶器》都在營造恐怖、塑造角色、拆解議題的同時，融入一種不按牌理出牌的幽

  默感。

  .

  這不代表《凶器》不可怕。驚聲尖叫的橋段夠詭異，該血肉模糊的也沒少，但真正讓人心

  驚的，是那些「門」的意象。克瑞格對房屋空間的運用堪稱一絕，門像是一種致命的邀請

  ，觀眾心底暗叫「千萬別打開」、又不禁好奇門後藏著什麼。《媽的多重宇宙》攝影拉金

  賽普勒為影像注入活力：將鏡頭置於衝突正中央，不論車門猛力關上、由肩後捕捉角色奔

  跑，都打造出第一人稱視角的張力。

  .

  但最令人悚然的，莫過於那些畫質粗糙、燈光昏暗的監視器畫面：孩子們在深夜打開大門

  、雙臂張開奔入未知，噩夢般的一幕成為撕裂小鎮的陰影。

  .

  當孩子離奇失蹤成為故事核心，我們很難不聯想到校園暴力與槍枝氾濫的美國現實（尤其

  布洛林角色夢中那朵槍型雲）。當大人對於「悲劇被武器化」選擇噤聲、視若無睹，那些

  受傷的孩子將長成什麼模樣？克瑞格說，他們終將成為新的「凶器」。

  .

  此外，克瑞格也不吝回頭凝視女性在社會眼光下的處境。《宿劫》的怪物是來自父權遺毒

  產物，《凶器》則藉由甘迪與葛拉蒂斯兩個角色對照，展現社會對「女性是否擁有家庭庇

  蔭」的雙重標準。甘迪獨居、有飲酒習慣，意外發生時輕易被貼上冷血女巫的標籤；而真

  正懷有惡意的葛拉蒂斯，卻因外表和藹、寄住親戚家反而躲過懷疑。


  /


  「恐怖片現在是少數還容得下創意的主流類型。其他大片都穿著緊身衣，兩億美金的製作

  費，幾乎無法冒險。」


  克瑞格這麼說，而《凶器》就是最好的證明。當好萊塢多數商業片陷於續集、重啟、真人

  化的 IP 來降低風險，像《凶器》《罪人》這種兼具原創與角色關懷的作品顯得彌足珍貴

  ，正如《凶器》片頭旁白所說：「很多人在這個故事裡，以很奇怪的方式死去。」但真正

  令人驚恐的，是我們看見那些人在故事裡裡「如何活著」的荒誕與惆悵。


  更多影評推薦，歡迎按讚追蹤：

  img_index=1


  --

