url: https://www.ptt.cc/bbs/movie/M.1754676835.A.714.html
title: '[好雷] 【凶器】無雷心得'
content: '心得通篇無雷，請板上各位安心服用。

  -


  【凶器】是2025年美國的懸疑恐怖片，由【宿劫】的Zach Cregger導演，茱莉亞加納、喬

  許布洛林、班奈狄克王主演，故事環繞在一間小學的學生集體失蹤案。

  -


  這部的娛樂性非常高，導演懂得用類型片的套路來玩弄觀眾，但也不會用得太老梗以至於

  常看這類片的人覺得無感。幾個嚇人橋段、劇情揭露都安排得不錯，故事在節奏掌握也都

  是水準之上。基本上看過【宿劫】覺得不錯的人，都可以放心進場看【凶器】。

  -


  前一篇心得看到有人在問電影裡的笑點會不會打斷情緒，我個人是覺得還好，很多笑點都

  有呼應到當下劇情，有一段甚至全場大笑，影廳裡的氣氛很歡樂XD但電影的基調還是偏嚴

  肅恐怖的，有幾段很認真要嚇觀眾，而且有讓我聯想到Ari Aster跟Jordan Peele的風格

  。當然這兩位在編劇上有點放飛自我，Zach Cregger在【凶器】裡還是遵循懸疑片該有的

  故事套路走，結局算有交代清楚故事前段的謎團，但也留有想像空間。


  另外，我覺得導演在這部和【宿劫】裡都有拍出一種美國的當地感，但畢竟我不是美國人

  XD在這點上就給不出太具體的評論了。

  -


  總結來說，雖然【凶器】是不到「人生必看的恐怖片」這種等級，但也是一部年度好片了

  ！期待上映後有更多的討論，也期待導演下一部作品！


  如果有板友想問一些無雷的問題或討論也都很歡迎。


  --

  會，有2-3段滿殘暴的。

  從選角上翻轉期待是嗎XD這次沒玩這個梗，不過有個演員是彩蛋。'
