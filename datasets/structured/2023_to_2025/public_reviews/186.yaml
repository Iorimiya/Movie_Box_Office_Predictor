url: https://www.ptt.cc/bbs/movie/M.1755928123.A.177.html
title: '[好雷] 凶器 Weapons'
content: "雷文防雷資訊頁\n\n凶器\nWeapons\n2025美國電影\n\n新上電影院線檔的美國恐怖片〔凶器Weapons〕，看完覺得很好看，很合我口味，個人滿\n\
  意度90分。看到最後，感覺劇情和片名很呼應，本片導演Zach Cregger過去作品2022〔宿\n劫barbarian〕也很好看，但這片更勝一籌。\n\n故事講述在梅布魯克小鎮裡，同一個班級的17個孩子同時神秘失蹤。最後這事件的真相是\n\
  ？\n本片片首及片尾旁白的小女孩（Scarlett Sher）聲音，增加一種怪奇氛圍，很加分...\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n以下有劇透，大爆雷。\n\
  \n\n1.故事設定很簡單，一個教室裡的17個孩子一起在半夜2：17失蹤了。這懸念很吸引我。\n    劇情詭異恐怖，讓人從頭到尾都提心吊膽。影片巧妙地平衡了恐怖元素和喜劇元素，\n\
  緩解了潛在的緊張感。故事情節跌宕起伏，本片用了六個主要角色：女老師Justine（Jul\nia Garner）,失蹤孩童之一的父親 Archer（Josh Brolin）,警探\
  \ Paul（Alden Ehrenrei\nch）,學校校長Marcus（Benedict Wong）, 流浪漢James（Austin Abrams）, 17個學童失\n\
  蹤的班級，唯一沒有失蹤的男孩Alex（Cary Christopher）做出六個分段，來鋪陳整個讓\n人懸念重重的故事。故事以如此的結\n構展開，讓觀眾從不同角色的角度拼湊出所有線索。\n\
  \n2.劇本精彩，執行結果更讚。本片是一部獨特而扣人心弦的恐怖片，許多演員的表演非常\n出色，每位演員都奉獻了紮實、情感真實的表演。兒童演員們發揮了精彩的群體表現，恐\n\
  怖氛圍緩慢而有序地鋪墊，但一旦爆發，便會真正爆發，血腥場面令人血脈賁張，有慘不\n忍睹的感覺            。反派角色設定一流，演出令人毛骨悚然，怎麼外表那麼邪門？\n\
  Witch? 核心概念精準到位。一些劇情畫面的精彩時刻，尤其是廚房和加油站的場景，緊\n張刺激，拍攝精美。整部影片的攝影技術都非常出色，尤其是在高潮部分，即使是像販售\n\
  酒類店面之這樣的日常場景，也呈現出一種詭異的熟悉感。影片籠罩著一層神秘的陰霾氛\n圍，隨著故事的碎片最終交織在一起，結局也完美結束。\n\n3.看得很過癮，本片毫不畏懼地加入了一些爆笑橋段？來緩和緊張氣氛。\n\
  看到本片最邪惡的老太婆角色，害死了不少人慘死，還食髓知味的玩弄一堆人，最後自食\n其果的下場，真的好歡樂，大快人心。\n\n\n--\n\n樓上，你是正確的。\n\
  \n\n的確我也想再看一遍。\n\n\n謝謝樓上一些人指正，已經修改完成。\n\n各花入各眼，任何片有人認為很棒或很喜歡，也有人認為過譽或不好看，都是個人的主觀\n\
  意見。但終究有一公約數，看好或看壞的勢力孰大孰小而已。\n總之，愛其所愛吧。看到很中意的影片，也是個人的小確幸。\n\n\n\n\n謝謝樓上的留言。\n\n\n\
  我不是行銷公司的人，是個人主觀意見。\n這年頭都會遇到樓上這樣的人之留言，會認為貼文喜歡某片的人，就是行銷公司的人，實\n在令人不開心。為何不能夠接受有些人看片，就是和你看法不同？\n\
  貼文分享自己主觀的經驗，要一直練習冷處理這些留言。"
