content: '基本上無雷，請放心觀看

  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  《凶器》上映前在家先看了導演的前一部作品《宿劫》，本來預期是恐怖片，直到 Justi

  n Long 出現才驚覺這是黑色喜劇吧？因為跟預期想要看到的不一樣，沒有恐怖氛圍的對

  話我直接倍速跳過，後來發現這些內容才是笑點呀，所以當時並不覺得《宿劫》好看，只

  覺得後面亂七八糟演什麼東西，WTF


  這次看《凶器》有稍微調整心態，告訴自己這是部黑色喜劇，該笑的時後要笑，因為在戲

  院無法倍速觀看，這時候會發現角色對話內容荒繆得讓人發笑XD，WTF


