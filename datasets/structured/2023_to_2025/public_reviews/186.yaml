url: https://www.ptt.cc/bbs/movie/M.1755267328.A.61C.html
title: '[普微雷] 凶器'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  這部對我來說算是繼《微笑》之後，較少見的恐怖片類型，自己還蠻喜歡這種題材新穎、

  帶有創意的作品，尤其是那種超自然靈異元素更是對味，而這部大概是繼《絕命終結站：

  血脈》之後比較好看一點的恐怖片了。



  劇情採用多線敘事的方式，但缺點就很明顯，就是節奏偏慢。看完這線可能還不一定有任

  何實質的進展，然後換到另一條線，又覺得跟那些失蹤的小孩好像也沒沾上什麼邊，接著

  另一條線又繼續沒完沒了，導致前半段大量時間就這樣耗掉。



  雖然前半歹戲拖棚，然後廢話了那麼久還是沒給出一個明確的交代，但是整體來說還是過

  關啦！！畢竟本片能值得稱讚的地方也不少，最大的亮點大概就是煥然一新的恐怖片劇情

  ，和「凶器」尚未揭露前所營造出的那股極度不安的懸疑與詭譎感，一開始看似互不相干

  的角色，最終卻全部捲入了對抗「凶器」或被它對抗的風暴裡。



  雖然那個真相揭曉之後感覺有一種「後繼無力」的感覺，甚至到片尾最高潮大魔王就直接

  給我一整個弱化，但我反而覺得是荒謬得很加分，畢竟恐怖片本來就是越簡單越乾脆俐落

  越好，如果硬要搞出一個什麼很龐大的組織出來操弄人心那才真的是在折磨觀眾啊！



  另外，演員們的演技表現都蠻出色的，加上角色塑造和劇情流暢所以帶入感很好，或許這

  是慢節奏下所帶出來的優勢吧！雖然整體可圈可點，也有幾個部分邏輯上會讓人有點出戲

  ，但如果不吹毛求疵的話都還算說得過去，還是有它一定的可看性。



  至於恐怖和血腥程度算小兒科等級，本片也沒有依賴太多音效嚇人（時常安靜到連吞口水

  都覺得會被旁人聽到），而是透過視覺呈現與氛圍塑造來製造壓迫感，對於喜歡追求刺激

  爽片的人來說就不太推薦，但對於享受氛圍和不喜歡用高分貝音效嚇人的觀眾來說，這部

  是合格的，只是偶爾幾個突發驚嚇還是有。





  2da


  --

  濃縮+刪減一些前面多餘橋段換大魔王提早出場可能比較好XD'
