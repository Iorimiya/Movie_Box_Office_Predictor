url: https://www.ptt.cc/bbs/movie/M.1688571243.A.C1C.html
title: '[新聞] 邊驅魔邊戀愛！《化劫》全台票房破3000萬'
content: "邊驅魔邊戀愛！《化劫》全台票房破3000萬\n\n14:21 2023/07/05 中時 孫伊萱\n\n\n黃冠智跟雷嘉汭在電影裡邊驅魔邊戀愛，幾度要告白卻慘遭邪靈干擾。（台北双喜提供）\n\
  \n\n黃冠智一場「阿呆拯救王羽凡」的橋段，揹了雷嘉汭跑好幾趟。（台北双喜提供）\n\n愛情靈異片《化劫》全台票房破3000萬，黃冠智跟雷嘉汭邊驅魔邊戀愛，為了彼此不顧一\n\
  切的犧牲，虐心愛戀讓觀眾大為感動，五月天的師妹琳誼，也特別為了男女主角量身訂做\n主題曲〈那年盛夏〉，心疼他們幾度要對彼此坦誠愛意，卻遭受神鬼鬼干擾，讓2人受傷\n\
  ，依然不願接受命運安排，守護對方。\n\n黃冠智所飾演的阿呆，是從小在萬應宮長大的高中生，出生就帶天命，為了平安長大，認\n臨水夫人當乾媽，左手擁有「神力」但卻不會控制，也對於自己擁有不凡的命運感到抗拒\n\
  ；雷嘉汭飾演的王羽凡跟阿呆是青梅竹馬，對彼此都有好感，卻因為王羽凡帶有靈異體質\n，2人命中水火相剋一直被告誡保持距離。\n\n黃冠智在拍攝「阿呆救王羽凡」的一場戲時，劇情講述王羽凡跟同學們辦化劫法會失敗，\n\
  被惡靈攻擊，阿呆趕到現場揹起王羽凡回萬應宮浸泡符水保命。黃冠智表示那場戲揹了雷\n嘉汭來回跑了好幾趟，本來很累，收工後沉澱一下子，莫名其妙哭出來，入戲太深的他體\n\
  會到阿呆的無力感，覺得自己好像是一個無能沒用的人，在關鍵時刻總是遲了一步無法保\n護最愛的人。\n\n《化劫》由華語靈異天后笭菁經典小說「禁忌系列－化劫」所改編，相較原著，導演施文\n\
  翰在電影裡加了很多感情戲份，因為看完整部小說的他認為阿呆與王羽凡願意無條件為彼\n此犧牲，有一個重要的因素是來自「愛」，兩個主角是高中生，青少年的感情是最純粹、\n\
  最美麗，因此會不計較回報，甚至不在意後果，賭上一切義無反顧地付出。即使是靈異恐\n怖片，導演還是希望觀眾看完電影能獲得感動以及正能量。\n\n#阿呆 #王羽 #化劫\
  \ #黃冠智 #靈異\n\n--\n佛教經典的\n是 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
