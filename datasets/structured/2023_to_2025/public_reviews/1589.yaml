title: '[大負雷] 吐槽很多的化劫'
content: '自《咒》之後看的第一部鬼片

  先說結論，看完後完全沒有值得討論的地方

  劇情、音效、演技

  真的讓我不知道該說什麼了：）

  過程中我的血壓真的一直往上飆升

  男女主角的邏輯思維真的不是一般人

  不是普通的有勇無謀

  大家最好別去嘗試理解他們^^

  下面開始細數幾大糟點


  ~~~~~~~~~~~ 以下有劇透~~~~~~~~~~~~~~




  1. 演技

  男女主角的演技真的非常尬，

  尤其女主角台詞的功力不太行，

  超級出戲的其他配角倒是還好


  2. 人物設定

  這個我真的不得不大吐特吐

  首先男主角，中二英雄情節，

  女主角作死讓自己跟別人陷於險境，

  男主角還要一直說：「是我晚來了！」

  呃呃呃呃呃女主角自己作死

  你為什麼要怪自己？？？

  而且明明根本沒什麼能力，

  還要一直去救愛作死的女主

  幾乎都是男主的爸爸媽媽出來控場啊啊啊

  就是一個腦衝怪，

  爸爸媽媽在要擊敗被附身的女主時，

  還把爸爸媽媽推開來，乾，真的不肖子^^

  再來說女主角，

  我真的很久沒看到這種不討喜的人設了，

  沒本事又愛搞事，

  還又一副理所當然的感覺

  嘴上說不想把男主拖下水，

  當男主晚到法會現場時，

  又質問男主為什麼這麼晚才來？？？

  法會要男主在場（有神明+體質）比較安全

  卻還是執意時辰一到就要開始，

  明明什麼都沒準備

  男二都跟你說要等男主來了！！！

  然後，男主的爸爸媽媽發現

  女主姑姑可能不對勁時，

  還要轉頭回家找姑姑，

  幹，你就已經知道你姑姑可能被附身

  明明沒有能力你回去幹嘛啦？？？

  也已經看到社團同學死於非命ㄟ？？

  也知道上神不是什麼好貨

  是去當麥當勞歡樂送嗎？？

  呃呃呃呃呃我真的打到這邊血壓真的飆高

  還帶著腦衝男主跟小跟班男二

  一起直闖大本營

  最後三個一起被抓^^

  有沒有女主角才是反派的卦？


  3. 劇情邏輯死亡

  第一、

  這個世界觀裡，我認為警察是不存在的

  一個社團內有三名學生離奇死亡，

  也不是隱蔽的消息

  完全沒有任何警察要來調查欸？

  所以我覺得這個世界裡

  應該是沒有警察的存在

  第二、卍宮被營造是一個很詭異的地方，

  結果男主就這樣混入信徒裡面，

  ㄟ也不能說是混入喔

  就很泰若自然的拿著神像走進去，

  整個人非常的突出

  也完全沒發生任何事？

  好像誰想去就去欸

  第三、女主最後在火場那一段

  也超莫名其妙欸

  拉著男主說不要放開她，

  怎樣，是想一起葬身火海嗎

  第四、男主的鬼手到底是有意識還沒意識，

  為什麼男主要拜託他幫忙救女主？？

  第五，女主上輩子應該幫了男主很多，

  不然男主到底怎麼會願意

  為了女主犧牲一切的感覺，

  呃呃呃感情線真的很硬要

  在我看來兩個人就只是還在曖昧階段的人

  第六、死掉小孩的家長，都沒有人要去找

  那個社團老師討個說法嗎？？小孩都是死在社辦

  沒有警察就算了，這部分完全空洞


  4. 特效音效

  凡有紅光必有鬼，

  堪比戲說台灣或藍色水玲瓏的綠光

  超級無敵假

  然後鬼反派的音效是怎樣？？？

  我以為我在看終極一家或終極三國欸

  那個變音器真的爛到爆超級low的


  最後、在看這部片的時候

  我一直在看什麼時候才會結束

  想說錢都花了^^

  這部片還有很大的改進空間













  -----

  Sent from  on my iPhone


  --

  天啊民雄跟杏林到底多爛

  白目小美是指男主媽嗎 鬼手我超困惑的

  沒看過原著，但這個改編的太爛ㄌ'
