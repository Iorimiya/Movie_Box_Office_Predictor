url: https://www.ptt.cc/bbs/movie/M.1688137630.A.3A6.html
title: '[普雷] 化劫-結尾直接崩盤'
content: '我是沒看過書直接看電影的觀眾


  整部片的燈光、道具、素材都可以感受到用心，滿滿的傳統元素，但有點一開始就給太多，變得沒有層次，中後段坐上轎子那邊是整部片我覺得氣氛營造最好的部分


  資深演員跟男配角演技很可以，男主角就差了點但還可以接受，女主角就真的不行，從片頭就覺得她講話很怪（不知道是口條？還是配音導致？）女主角只要開口我就會出戲煩躁


  比較像是主角群跟鬼（魔）對抗，主角群都不怕鬼（除了男配）


  男女主角設定智商太白癡，尤其是女主角，看到後面真的很想打她



  以上優缺點綜合之後如果在推續集我應該也是會去看，但是最後結尾男女主角抱在一起轉圈圈，整個讓我大出戲（我到底是看鬼片還是看愛情偶像劇？？） 前面騎腳踏車點一下校園愛情感還可以接受，最後來個回憶愛情戲碼+偶像劇轉圈圈真的不行…


  可惜了這部劇，感覺導演還想拍一系列…但我覺得真的沒辦法



  -----

  Sent from JPTT on my iPhone


  --'
