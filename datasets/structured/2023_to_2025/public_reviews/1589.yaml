url: https://www.ptt.cc/bbs/movie/M.1687608078.A.75C.html
title: '[雷] 化劫-我到底看了三..啥毀'
content: '超負雷



  雖然知道改編一定有差異。但這實在改的太瞎了



  優點

  看到一半真的超想進去賞男女主角巴掌

  （能演的這麼讓人火大也是需要技巧的）




  缺點：


  先講角色


  阿呆


  劇版：戀愛腦的不孝子而且是真的行為很阿呆


  書版：叫阿呆是因為外型而不是行為

  有時侯有點雷但基本都算可靠跟成熟

  （而且沒有那個鬼手）



  羽凡


  劇版：煩死人的三八


  書版：雖然喜歡多管閒事但基本都能自保沒有特別雷







  小胖（班代）


  劇版：其實跟書差不多只是比較開朗點


  書本：沉穩的人



  學姊、學長、阿原：不知道為什麼被創造出來的原創角色


  對了阿原的外型其實蠻像小說形容的阿呆

  （這算是一種彩蛋嗎？）





  開始噴劇情：


  我到底看了什麼毫無邏輯的劇情

  到底是恐怖片還是校園愛情喜劇？




  那個鬼手到底是三小、而且整部片根本跟化劫沒關係啊？  叫還比較符合吧？






  女主行為超三八又煩又腦衝我真的超想賞她巴掌。難怪賀爸希望阿呆遠離她。跟這女生在一

  起肯定沒好事


  然後萬應宮完全沒發覺到也是怪怪的


  這兩個宮看起來明明就相隔不遠阿？

  （小說是臺南跟雲林）


  就放著他們在那作妖。


  快結尾那邊我真的理智斷線

  腦衝女主角帶著戀愛腦男主角跟相對正常人男二直接跑去敵方大本營送死

  然後女主角直接被上身。兩男被綁起來差點game over


  敢問女主角妳根本是敵方臥底吧？



  書裡面雖然是阿呆腦衝帶著羽凡跟舒雅老公衝去敵方大本營


  但羽凡跟小胖至少還私下討論要保持聯繫

  才在關鍵時期讓萬應宮的人即時救場



  電影裡面的人到底在衝三小？



  結尾那段火燒兩人的那段我其實蠻想哭的

  因為禁忌系列的最後一集就是阿呆親手燒死羽凡。兩人還接吻並表達心意。


  當年看小說我看到爆哭加發呆了好幾天欸

  撇除前面那些很瞎的劇情。個人是喜歡這段的




  --'
