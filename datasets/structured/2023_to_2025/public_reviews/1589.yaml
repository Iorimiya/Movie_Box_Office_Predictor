url: https://www.ptt.cc/bbs/movie/M.1687351523.A.157.html
title: '[普雷]《化劫》，這不是我心中的那本《化劫》。 '
content: '部落格版：


  真的不止一次在其他文章、特別是關於鄉野奇譚、都市傳說等題材的文章裡，提到自己有

  多喜歡笭菁這位作家，基本上除了她的言情小說之外的系列我都看過，大半也都有買回家

  收藏，從《陳小美系列》、《禁忌系列》、《異遊鬼簿系列》一、二部、《惡童書系列》

  、《禁忌錄系列》到《都市傳說系列》一、二部等我都有整套，而且早在還是便利商店49

  元口袋書時期就買了，後來推出改版後的25開特藏版也都有買，因為我真的滿喜歡笭菁的

  ，或許她的文筆不是最好的，但她的每個故事、或者說是題材都很吸引人。整個國中開始

  後的求學階段，都是笭菁、Div、夜不語、星子等恐怖小說派跟藤井樹、穹風、晴菜、

  Sunny、橘子、蝴蝶等言情小說派陪我度過，因此當之前得知《化劫》要翻拍成電影時有

  多興奮跟期待，還為此特地再重新讀一次小說。


  《禁忌系列》總共有六集，《畢旅》、《借胎》、《醫院》、《化劫》、《試膽》跟《返

  魂》。包含著後來出的《禁忌錄》系列八集是以從古流傳至今的「禁忌」為故事核心，例

  如進飯店房間前要先敲門；掃墓時不能坐在別人墳頭上；八字不能亂給不能亂算；孕婦不

  能參與搬家；搬進新家當天不能睡午覺等等的，聽起來有些荒唐可笑但時常被耳提面命千

  萬不能觸犯的各式禁忌，沒有人知道是真是假，也不曉得這些禁忌從何而來，可總是被告

  誡著「一旦犯了禁忌就會有不好的事情發生」，笭菁的《禁忌系列》正是在告訴讀者，寧

  可信其有也不可信其無，因為如果剛好犯了百項假的禁忌裡唯一的一項真的禁忌，那就真

  的為時已晚。而如同每個系列，單本分開來看是各自成立的一個故事，可故事與故事之間

  會用一個埋在裡頭的故事來貫穿，像是在《禁忌系列》中就是用「萬應宮與陵c」的正

  神邪魔交戰為主線，從首集埋下的伏筆增加懸疑感，然後到最終章來個正面對決、迎向高

  潮結局，讓一個系列是相當完整的。


  而同個系列會有同個或組主角，從最早的陳小美、阿呆三人組、異遊鬼簿三人組、都市傳

  說四人組等等，從首集到最終集的出生入死，甚至每部主角彼此都有著關係存在，偶爾還

  會相互客串登場一下，隨著集數多了都讓讀者對這些角色有更深的認識與情感，我認為這

  是很重要的部分。回到電影版《化劫》來看，《化劫》是系列作中的第四集，選擇這集來

  做改編對我來說是很可惜的是，因為雖然前面提到每集是個別獨立的故事但是有著關聯的

  ，選擇從中間集數切入，新觀眾不僅對靈魂人物、也就是阿呆三人組不熟，也對萬應宮和

  陵c的關係與淵源少了基本認識，當然也沒有人說選第四集改編不行，就看劇情要如何

  改寫到讓沒看過小說的觀眾也知道《禁忌系列》再演什麼。



  「感謝上仙降臨，化解歷劫重生。」


  實際看完《化劫》之後發現，電影至少改了一半以上，雖然是以原版小說的劇情為底，還

  同時能稍微看到第六集《返魂》的結尾寫法，但從讀者角度來看電影版《化劫》早已不是

  原來我所熟悉的《化劫》。從我的角度來看電影版的《化劫》自然是失望的，被改寫的太

  多、即便我知道這些改動是必要的，對沒讀過原著的觀眾是貼心的，可內心還是覺得成品

  是可惜的。在小說裡，廖舒雅就是個故事登場的角色，不過在電影則被寫成了王羽凡的姑

  姑並且名字變成王舒雅，這項改動其實不錯可從某方面來看又很可惜。我印象中的王羽凡

  雖然有時有勇無謀但很善良，能夠為了別人、成全別人而犧牲自己，因此當看到電影版中

  的王羽凡竟帶著其他人往危險裡走時是難以接受的，可是由於在這裡她和王舒雅成了親戚

  ，加上其他參與法會的同學被教練、也就是王舒雅丈夫利用，這讓這件事有了合理且可被

  接受的動機，此外，本該才是最適合邪魔降身的廖舒雅，在這裡也被寫成了是被利用來抓

  住「真正的肉身」王羽凡的棋子王舒雅，不僅帶有微微反轉的效果，同時也能讓「王羽凡

  有特殊體質」是有明確的跡象。


  只是可惜的是，這項改動也注定讓《化劫》最精彩的部分沒辦法實現。當正港萬應宮追著

  陰廟陵c來到山裡時，除了阿呆三人組以的所有人都來助陣，包含著阿呆的母親、擁有

  二十多個守護靈的陳小美（賀媽）還有曾為萬應宮宮主、有著高強法力的阿呆表姐等人趕

  來助陣，最後讓神佛依憑在王羽凡身上試圖將邪魔從廖舒雅身上趕出去，進行一場整本小

  說高潮的決戰戲。而在電影版則沒那麼震撼，不光是戰力看來有著落差，賀媽沒有想像中

  厲害，乾媽守護靈跟表姐也沒出現，只靠電影版特有的阿呆鬼手一搏，整個失去小說裡的

  神魔大戰的熱血沸騰，加上火燒祭壇的特效有夠假，都有些浪費掉我覺得其實營造的很好

  的懸疑緊張氛圍。再來，小說花了六集鋪陳然後完整萬應宮和陵c的淵源，電影裡只簡

  單交代陵c是萬應宮協助建立的，只是後來走偏變成陰廟，做為單集反派來看氣勢是有

  ，不過拉長遠來看的話，要當系列最大反派又稍嫌不足。



  笭菁作品有個特點，除了那些當作劇情主幹的、像是禁忌、都市傳說、鄉野奇譚等的之外

  ，大多都會再以「人性」來做為觸犯或者開啟事件開端的引子，意即即使有著這些禁忌、

  傳說的存在，若非人性誘惑還不太可能會引發後續危機。例如在《畢旅》中許願能夠得到

  父母關心的同學抱持惡意，助燃了他們無意見所觸犯的禁忌，造成更可怕的傷亡，這點其

  實電影版有保留住，也是我少數有對電影版驚艷到的地方。原先我認為電影版自創角色、

  三位空手道教室學生，以及他們各自稍微提到的背景，與他們所做的法會很多餘，不如多

  花時間放在描寫刻畫陵c的背景，但隨著劇情發展到後面，一些困惑的點開始有了關聯

  ，為什麼學生要執意辦法會？他們怎麼會有神像？結果都是教練為了救妻子而利用了他們

  ，甚至看到片尾還會覺得說不定也是他安排王舒雅去找陵c求助的。這樣子為了自己、

  為了妻子利用他人、不顧他人死活，即使嘗試怪力亂神也無所謂的自私，正是笭菁不斷提

  起的人性，至少這點電影版《化劫》是看得到的。


  如同電影中提到數次的，去年夏天曾發生王羽凡被附身的事讓阿呆自責，可是電影打算放

  在續集或是前傳補充，所以當下觀眾根本不曉得什麼事，看得只怕是一臉茫然，而觀眾也

  對阿呆和王羽凡、還有其他人，包含他的鬼手的還有被形容的很強大的乾媽背景都不了解

  ，因此在這集電影裡，至少就我來說、要不是我有看過小說，可能會很常時間對情節、對

  電影有著疏離感。當然之後真有續集跟前傳的話自然可以逐步認識這部系列，可純論這部

  《化劫》難免又會認為電影有要為新觀眾著想可又不夠貼心。另外，姑且不論有沒有看過

  小說，電影最讓我困惑的是，所謂的化劫就字面上來看應該是「化解劫難」，可是一個希

  望能贏比賽、一個希望能離開父親，怎麼看都不像是人的「劫難」，當然你說是陵c欺

  騙他們，或者說他們愛賭博、愛家暴的父親是他們的劫難也解釋得通，但就感覺上實在有

  點失去「化劫」的意義。


  平心而論《化劫》的劇情不差，就是和小說的落差感讓我沒辦法給電影好評，而上述提到

  的幾個可惜加起來也成了電影的缺點，把化劫拍成了愛劫、前因後果選擇留在之後說讓人

  無法投入電影、特殊化妝不錯可特效有待加強、包含主角在內的許多角色描寫不多...，

  但最讓我難以接受的，還是電影把阿呆跟王羽凡在小說裡的特質與性格寫得讓讀者不認識

  了，兩人都變得太過軟弱了，軟弱到失去角色原有魅力，後來兩人在火中相擁一句「我不

  會放開你」、一句「不要放開我」然後陷入回憶，真的就是尷尬。最後的最後就是，飾演

  阿呆的黃冠智表現空間太少，而飾演王羽凡的雷嘉汭演技實在不行，表情、語氣都撐不起

  來這個角色，溫吞慢速到叫人出戲，在我這裡是相當失敗的選角，綜合上述提到的，即便

  沒看過小說，我都覺得電影版《化劫》是部相當可惜的作品。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
