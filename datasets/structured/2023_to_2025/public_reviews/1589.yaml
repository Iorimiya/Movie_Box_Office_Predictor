title: '[新聞] 于子育柯叔元曾莞婷齊聚大甲迎媽祖(化劫)'
content: '于子育、柯叔元、曾莞婷齊聚大甲 靈異電影迎媽祖求好運


  2023.04.22 19:13 臺北時間


  文｜娛樂組


  曾莞婷（中）、黃騰浩（右）、雷嘉汭（左）參與大甲媽祖遶境活動並抬轎。（台北双喜

  電影提供）



  華文知名靈異作家笭菁改編的《化劫》，故事來自自真人真事，在粉絲引頸期盼之下，今

  （22日）正式定檔6月21日端午連假上映。電影由新銳導演施文翰執導，黃冠智、雷嘉汭

  、劉子銓、曾莞婷、黃騰浩、柯叔元、于子育等實力派眾星主演。宣布定檔時逢大甲媽祖

  遶境，導演施文翰特地率7位主演前往台中參與盛會祈福，除準備結緣水為香客們補水應

  援，也搭起大棚迎接天后神轎。


  大甲媽吸引許多信眾到大甲。劇姐首場宣傳活動並且要迎接大甲媽祖，「本土劇女神」曾

  莞婷凌晨趕完南部行程立即飛奔，于子育、柯叔元、黃冠智等也喬出軋戲空檔，力拚全員

  到齊。為了恭迎大甲鎮瀾宮天上聖母聖駕，《化劫》宗教指導許白龍臥雲隆重安排江西龍

  虎山嗣漢天師府台灣弘法團，及中華道教伏魔宗師府團隊，引領劇組群體接駕團拜，祈求

  票房長紅、跑宣傳順利，儀式結束後，演員們再扛鑾轎交還轎班，難得的體驗讓眾人直呼

  ：「永生難忘！希望在媽祖婆的加持下電影大賣。」


  《化劫》宣布定檔6月21日，劇組特地參與大甲媽祖遶境盛會求票房大賣。左起為劉子銓

  、黃冠智、柯叔元、于子育、導演施文翰、曾莞婷、雷嘉汭、黃騰浩。（台北双喜電影提

  供）



  「千萬不要進錯了廟、拜錯了神，把八字給了不該給的人。」台灣人愛算命拜拜求神，甚

  至有人因為執念亂拜廟引來災禍；《化劫》首支概念預告，結合時下最夯的線上算命，生

  日數字看似沒什麼嚴重性，但八字如果落在邪魔歪道等有心人的手上，會招來什麼可怕的

  後果？


  《降河洄游》黃冠智、《哭悲》雷嘉汭、《無聲》劉子銓3位年輕演員是《化劫》核心「

  打怪3人組」：阿呆、王羽凡、小胖。面對邪惡的反派，3個人將以堅定的友情，一起攜手

  度過難關。柯叔元跟于子育則一起飾演男主角阿呆的爸媽，也是戲裡「萬應宮」的廟公跟

  文乩，是新鮮又可愛的組合。曾莞婷跟黃騰浩首度合作，演出為求化劫卻身陷危險的夫妻

  ，是引發一連串事故的重要主因之一。


  《化劫》劇組特別準備結緣水為參加大甲媽祖遶境的香客應援，左起：導演施文翰，演員

  黃騰浩、曾莞婷、于子育、雷嘉汭、劉子銓、柯叔元、黃冠智。（台北双喜電影提供）



  《化劫》導演施文翰在美國從事影視產業多年，執行過許多好萊塢作品的開發，首次擔綱

  華語電影長片導演，改編暢銷小說IP《化劫》，打造「禁忌」系列宇宙觀，找來參與美國

  電影特效製作的王重治擔任視覺總監，融合八字、宮廟、符水、法會、咒語等元素，透過

  鏡頭將台灣民俗傳統色彩呈現得如畫，希望拍出一部很美的恐怖片。電影將於《化劫》6

  月21日上映。




