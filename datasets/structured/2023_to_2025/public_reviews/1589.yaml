  認識的姊姊去一間廟點了光明燈結果慘遭附身

  還被那間廟的信徒當成菩薩來拜

  家人四處找高人處理

  才發現女子身上的是魔不是鬼

  覺得這個故事很不可思議

  因為只是點光明燈@@


