url: https://www.ptt.cc/bbs/movie/M.1687357421.A.767.html
title: '[討論] 有關化劫的一點感想'
content: '我是從國中第一本就開始看化劫的笭菁粉絲！

  就開始看化劫就愛上到無法自拔，完整追完緊急系列，每一集都劇情緊湊超級好看。

  直到最近發布小說電影化整個期待到不行！！


  ———前言結束

  今天剛上映就衝首場，心得就是…蛤？

  先說如果沒看過小說的話，當首次看電影的人或許會覺得劇情切場有點快，主角群演技有

  點生，除了演小胖的劉子銓比較自然以外，哈哈。


  有看過小說會發現阿呆整個改掉…裝扮整個跟小說不太一樣（除了髮型），羽凡個性跟小

  說也不太一樣，變得內向一點，演員部分最不滿意的是這個部分…

  雖說笭菁有說角色改動有什麼不好，但我真的感覺演員不太能駕馭…看了有一點點怪。


  再來劇情上，因為化劫是禁忌中的第四部（小本跟大本的好像是都第四部）所以劇情中會

  一直切到前一集的故事，會有點突兀…也會有點搞不太懂穿插的劇情在講什麼，到結尾好

  像也沒特別交代，然後學生之間的故事也是輕描淡寫帶過的感覺，總感覺不太適合拍電影

  ，可能拍成一個迷你影集上架到netflix會不會更好述說這些故事呢？

  不過說真的裡面配樂搭上很詭異的場所，加上曾莞婷的演技，真的會有毛感。

  只可惜劇情銜接上好像有點怪，有點說不出來，有看過的一起分享一下心得 哈哈


  期待續集可以更好一點～～～


  --'
