url: https://www.ptt.cc/bbs/movie/M.1687228553.A.C79.html
title: '[新聞] 笭菁圓夢《化劫》搬上大銀幕'
content: "翁紫曦\n\n即將在端午連假上映的《化劫》，改編自華文「靈異天后」笭菁經典的《禁忌》系列作，\n此次改編找來新銳導演施文翰執導，2人一起走過拿下輔導金到拍攝完成的過程，笭菁表\n\
  示：「作品可以被改編上大銀幕，是每個作家的夢想。」\n\n《禁忌》系列是作家笭菁最知名的作品之一，該系列數度再版，每次都銷售一空，即便上\n網買仍一書難求。提到作品搬上大銀幕的感受，笭菁笑說：「整個製作過程很長，等到確\n\
  定會上映才真的放鬆下來。」\n\n她表示，；她許願這次《化\n劫》大賣，這樣書迷就更有機會看到《禁忌》系列的前傳跟續集。\n\n導演施文翰為了打造《化劫》中的驚悚氛圍，煞盡苦心。被問到電影中的陰廟如何呈現？\n\
  施文翰侃侃而談：「陰廟是劇組參考很多東南亞宗教、藏傳佛教、台灣佛教等融合在一起\n蓋起來的。」他第一次在現場看到的時候非常震撼，他大讚曾莞婷敬業，因她的戲分都在\n\
  極度陰森的地方拍攝，但她仍不為所動，甚至常常要求「重來」。\n\n施文翰暌違8年再拍長片，之前長期旅美的他，回台後感觸很深，表示美、台的拍攝文化\n不同，笑說：「我如果提出高難度的要求，劇組人員都會一臉為難，但我一轉身，他們就\n\
  把我要的效果變出來了。」大讚台灣劇組人員臨場反應快，但他也感嘆，在台灣的劇組人\n員常面臨預算不夠的問題，只能用創意補足。\n============================================\n\
  \n禁忌－化劫  \n\n預告  \n\n\n\n\n\n\n--"
