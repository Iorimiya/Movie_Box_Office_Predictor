url: https://www.ptt.cc/bbs/movie/M.1684681903.A.762.html
title: 'Re: [討論] 笭菁原著《化劫》正式預告'
content: "內有小說的雷\n\n\n\n\n第一次看這本小說也已經14年前了（遠目\n\n那時候還是便利商店一本口袋書才39還49的年代\n\n化劫是禁忌系列的其中一部\n\
  （又稱萬應宮系列）\n\n單獨看是可以理解的。畢竟整個系列除了最後兩集之外都是獨立的故事\n\n此系列主角為：王羽凡、賀霖焱（阿呆）、莫ㄧ立（班代）\n\n\n\
  其他相關系列為\n\n陳小美系列（算是作者處女作）：主角為賀霖焱的爸媽及伯父伯母\n\n\n異遊鬼簿一：莫一立長大後的故事\n\n\n異遊鬼簿二：賀霖焱長大後的故事\n\
  \n異遊鬼簿三：王羽凡長大後的故事（X）、是賀霖焱表哥的故事。\n\n\n王羽凡沒有長大，因為禁忌系列的結局是賀霖焱親手燒死王羽凡\n\n\n總之\n\n沒想到14年前看的小說竟然會拍成電影阿..\n\
  \n\n異遊鬼簿後來根本變超能力大戰跟主角都是帥哥美女所以其實感覺沒那麼喜歡….\n\n\n\n\n希望票房好的話可以把禁忌系列都拍成影集…\n\n--\n\n\
  \n    其實隔壁marvel版有化劫小說全文XD\n      最讓我受不了的是後面根本開始超能力大戰。 中間有個號稱梵蒂岡最強的驅魔師登\n場好像根本沒做啥就死了\n\
  \ 這角色根本只是來捧阿呆的吧...\n\n我漏了什麼0口0\n\n長大的阿呆完全就是仗著帥臉在性騷擾惜風啊（雖然我覺得這對蠻有火花的）\n但最後公布死神也是個帥哥的時候我只有WTF？\
  \ 這是甚麼帥哥都愛我的爽文啦\n異遊三我就沒看了。聽說結局之後又接另一個系列..."
