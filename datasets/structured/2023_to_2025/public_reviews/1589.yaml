url: https://www.ptt.cc/bbs/movie/M.1688338811.A.B62.html
title: '[普雷] 化劫，那些年我們的戲說台灣'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  無雷部分：

  大概是喪屍片+戲說台灣+那些年，

  本片完全不驚嚇，整體來說普普。


  笑的時間蠻多的，日常鬥嘴的部分很可愛，

  前面有這些調劑不錯，但結尾不推。


  -

  -

  -

  -


  以下有雷：


  以為會看到神鬼，結果看到好多隻喪屍，

  差點以為跑去看末日喪屍片？


  好幾幕畫風完全是甜寵劇，總覺得是大雜燴，什麼東西都摻一點，反而會有點不知所云。


  結尾硬要加個彩蛋，看起來是要埋下一集的伏筆，但火場逃生真的太扯了，難道神明還可

  以把濃煙和火勢消滅嗎？假如有下一集，我應該也不會看。


  那些年的回憶場景，是橘黃色調的，整體看起來很偶像劇，前面溫馨接著後面恐怖，這部

  分跳的還不錯，但實在太像喪屍，沒辦法被嚇到。


  作法、附身使用紅色調，會聯想到［恭請慈姑渡四靈顯四方，整體畫面是好看，有種在看

  台灣職業考究節目的感覺。


  霸凌人的空手道男/女同學，女的有個賭鬼老爸，因此急需要比賽獎金還債；男的霸凌主

  角和陰沉阿原，但帶到家的鏡頭，他爸常批判他的選擇。

  陰沉阿原的記憶點比較少，只記得身材還不錯。


  不會因為知道原因，就洗白某個人，但就會想著，每件事背後，總是有個原因呢。


  戲劇裡，很常營造出主角就是正義，其他人要是跟主角不同掛，就是反派的印象，不知道

  有沒有很像反派的主角呢？

  （有的話請推薦我，感恩）


  --'
