url: https://www.ptt.cc/bbs/movie/M.1687968157.A.E7A.html
title: 好雷- 化劫
content: '剛剛看完電影，沒有像大家分享那麼難看，

  因為我不是書迷，沒有既定想法，

  整個電影看來，我是可以理解的，

  節奏很緊湊，女主角演技確實沒那麼好，

  可是其餘每個人表現都很不錯

  尤其是賀爸賀媽！


  **昨天看完就先發文，以下繼續補充，有雷**






  可能看過評價後才去電影院看，所以我的期待並沒有那麼高，可就算期待沒那麼高的情況

  下，我還是不覺得像大家講的辣模難看耶 XD

  甚至是高於我所期待的。



  我個人認為看用什麼角度觀看這部片，通常給出差評、極差評的，都是原著書迷以及抱著

  看「恐怖片」心情的人。因為已經有既定印象，所以特別排斥與原作不符的情節及人物性

  格，或是恐怖片中不該加入過多小清新戀愛情節等。



  我沒看過原著，就只是支持國片而買下電影票。整場電影除了阿呆做了個夢去前情提要之

  前女主角被附身要殺阿呆，這個部分出現得有點突兀之外，整部電影的節奏都算很緊湊，

  該有的氣氛有做到位。

  有做到身為一部恐怖片該嚇人的責任，某些片段看的當下很有毛毛的感覺。


  蠻喜歡卍應宮是魔的安排，我討厭無差別殺人的恐怖片，比如咒怨，而卍應宮是魔，讓劇

  情裡那些發瘋崇拜的信徒瞬間合理。

  以及魔要找適合肉身，騙信徒給八字，那些不適合當肉身的被殺成為祭品；適合當肉身的

  被留下來。這情節安排也很不錯。


  整場劇情我是真的真的真的沒有覺得像大家講的這麼雷片，應該不是我品味特殊吧XD


  我一直以為乾媽會出來carry一波，或是賀爸賀媽會像林正英出來收妖，想不到居然是鬼

  手carry起來的。


  喔，有一個地方是我覺得比較好笑，「萬應宮」招牌居然是LED夜店風，在電影院裡我直

  接笑出聲。




  女主角雖然演技青澀，可是！大家沒有覺得她長得很像袁詠儀嗎？？




  我覺得蠻值得去看的！


  --


  很中立，比端午立蛋還中立。

  我真的覺得還不錯啊XD


  看到這麼多人質疑我，我都快要質疑自己了！



  有看過原著的好像都不太能接受鬼手'
