url: https://www.ptt.cc/bbs/movie/M.1687439321.A.EEE.html
title: '[普雷] 就算把化劫當作一部原創電影…'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  身為一個資深的笭菁書迷，選在上映的第一天馬上衝去看化劫，

  下場就是端午節的意難平。




  如果要直接說感想就是：到底為什麼會改成這樣啊？




  其實一直都知道要把小說改編成電影是很困難的，電影也不可能只拍給書迷看，


  更多的受眾應該是沒看過原著的人。




  所以從知道化劫要被改編之後我一直都不去再翻閱和裡面主角人物有關的任何一本書。


  就是希望自己不要帶太多原著的濾鏡去看被改編過後的電影。




  更何況《化劫》已經是禁忌系列的第四集，笭菁已經花了三本書的時間來舖陳


  阿呆、羽凡、班代之間生死患難的友情，這是沒辦法在電影中詳細交代的事情。




  但或許導演想要拍前傳的企圖太過明顯，


  導致有很多劇情沒辦法講清楚，就顯的很突兀。




  就算不論阿呆胸口的傷到底是怎麼來的、阿呆媽需要雲遊四海的理由。




  但至少也可以用一點點的篇幅來說一下羽凡和姑姑之間的感情吧？




  就因為導演對這部分幾乎沒有任何的著墨，所以到了最後在祭壇，


  明知山有虎，偏向虎山行的王羽凡看著姑姑說：我替她還。


  真的只會忍不住想要罵王羽凡是個笨蛋。




  這部電影命名化劫，並且主張化的劫都是要還的。


  但在卍應宮的牌匾上又寫著「有求必應」




  可我看到的是空手道學姐、兩個學長都各自有不同的心願，


  沒被實現但許下的承諾就是要還。


  我能理解電影把這三個角色當作是上仙的祭品，


  而他們被當成祭品的原因似乎就是因為把八字給錯了人、拜錯了神。


  雖然是主因，但是太跳了，沒能好好處理我覺得可惜。




  另外的細節部分，法會前阿呆誤闖卍應宮看見眾人祭拜的儀式，


  明明就沒拍出王舒雅的模樣，他也能認出是王舒雅，


  如果能拍出看見王舒雅的臉，所以直奔法會救了已經失控的法會更加合理。




  法會出事後鏡頭馬上跳到阿呆三人組一起寫功課，羽凡和阿呆的曖眛情感，


  我不知道導演是不是只是想舖陳這兩人隱約的愛意，但跳的有點莫名奇妙，


  到了晚上羽凡變臉、傷了阿呆，阿呆媽即時救下了阿呆。


  結果！兩、三個場景之後賀爸打電話叫阿呆媽回來？


  這裡我真的看不太懂，有看過的人可以幫我解釋一下這整段的順序嗎？




  以上都是針對電影細節部分的不理解，如果可以處理的更細緻，應該電影會更好。




  陳小美的人設被改我就不多說了，但阿呆鬼手的設定到底是怎麼想出來的？


  就不能維持他是一個帶天命、擅長使用水的高中生人設嗎？


  這應該比鬼手的設定更簡單而且更合理呀！！




  電影的最後，阿呆和羽凡在火中緊緊相擁，讓我直接夢回《返魂》的劇情，


  看到紅了眼眶，和化劫本身無關，就是想起對當年大火中羽凡的意難平。




  喔，對了，我恍然大悟，不只前傳，導演還想拍續集嗎？




  總而言之，如果是書迷建議不要抱任何期待去看。


  如果只是一般觀眾，就當作支持國片去看也可以。



  --'
