url: https://www.ptt.cc/bbs/movie/M.1687483168.A.A7A.html
title: '[中上雷]  一抹春風百劫身 《化劫》 '
content: '虎變


  據聞西漢時武帝開掘昆明池，及至底層，所出皆墨灰，即使是當朝能人東方朔，亦不能詳

  其實。後有西域僧伽施然而至，眾人問之，答曰：「世界終盡，劫火洞燒，此灰是也。」


  而現實世界裏，劫燒過後，創傷事故存活下來的個體就如同灰燼般，綿澹，虛散，究竟應

  當如何自處？倘若有機會重來，又可以透過什麼樣的法門扭轉乾坤？施文翰執導的《化劫

  》（Antikalpa），便聚焦在這類妄圖逆天改命的主題事件上。不若前此許多單向推進、

  解謎式的類型電影，導演今此設法綰結「邪魅無情」與「真愛無敵」兩條情節敘述線：一

  端是為執念所苦的人母，為求得償所望而終於誤入魔道；一端則是青春期通靈少男少女，

  同樣不惜代價參犯宿命業緣，幸得最後證成他心通，修得了階段性的正果。


  除了改編自作家笭菁的小說（而該小說據稱又改編自真人真事），編導也著意於片中凸顯

  各式各樣的對位關係，比如姑姪的尋親念想，比如父女對錢財的渴望，比如男主角兩代人

  各自的情感追求；更精彩的，則是以偏門的「卍應宮」參照正廟「萬應宮」……愛別離求

  不得，一字之差，拜錯了便墮入無門地獄。


  儘管美術組和道具組相當用心，那樣的布置、特效和取景適足以呈現詭秘的異教氛圍，但

  對自小耳濡目染、置身相關文化語境的臺灣觀眾而言，部分設計或嫌太儀式化、太「滿」

  了──從滿室符紙到荒山野林的信眾和祭壇，從海盜頭子般的獨眼龍法師到末尾浴火重生

  的擁抱場景，張揚有餘，卻不啻少了若隱若現的含蓄美學。






  --'
