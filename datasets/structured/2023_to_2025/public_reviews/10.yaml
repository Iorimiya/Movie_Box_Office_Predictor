title: '[情報] 【好孩子】預告 12月5日上映'
content: '電影介紹

  ★ 變裝皇后真人真事感動改編！《男兒王》導演王國燊又一動人編導力作

  ★ 勇奪第62屆金馬獎最佳男主角、最佳造型設計兩項提名

  ★ 紅星大獎最佳男主角許瑞奇 x 金馬獎最佳女主角提名洪慧芳主演

  ★ 榮獲大阪亞洲電影節閉幕片、香港亞洲電影節影迷別注單元



  劇情簡介

  變裝皇后阿好在舞臺上自信奔放，但不被家人真正接納，直到父親離世奔喪反家，才

  驚覺失智母親菊花嫂需人照養。阿好擔下重任，更索性「將錯就錯」，調皮以女兒之姿

  闖入母親生活。隨著兩人親密升溫，阿好卻意外揭開自己的身世真相。《男兒王》導演

  王國燊編導新作，改編真人真事，新加坡實力男星許瑞奇把角色的自尊與傷痕，做出

  層次分明的演出，與《花路阿朱媽》洪慧芳演繹母子情真，笑中帶淚。







  --'
