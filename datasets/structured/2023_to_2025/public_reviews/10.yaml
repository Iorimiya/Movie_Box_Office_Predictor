title: '[好雷] 好孩子'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  新加坡導演王國燊在2020年拍攝《男兒王》奪得金馬獎最佳造型設計，這次再探討性別議

  題，同時討論更多社會面相，以《好孩子》再次入圍最佳造型設計，而飾演變裝皇后主角

  李家好的許瑞奇，更憑藉情感收放自如的精湛演技強勢入圍金馬獎最佳男主角。



  變裝皇后阿好為了照顧罹患失智症的母親菊花嫂，在多年疏離後決定返家照料。



  在這場意外的「母女」誤會中，兩人開始重新學習如何相處。隨著母親的記憶時而清晰、

  時而模糊，親情的溫度在笑與淚之間悄悄復燃。



  《好孩子》改編自新加坡知名變裝皇后阿真（Sammi Zhen）的真實人生故事，他在導演拍

  攝《男兒王》時擔任顧問，有次因緣際會下與導演分享自己正在照顧失智的母親，而阿真

  長期受到歧視的身分也讓他更能體諒母親的心情。電影將失智症照顧者的困境與心聲完整

  地攤在大銀幕上，阿好與家裡的關係本就疏遠，由於母親需要，他便回家幫忙，但童年的

  創傷與往事卻由於媽媽的記憶退回到過去而回來糾纏阿好。



  片中一名看護告訴他，失智症患者經常會產生被偷錢的幻覺，但媽媽還真的是一直記得過

  去曾經被偷錢的事實，也同樣與當年一樣，一直把這莫須有的罪名強加在阿好身上。家屬

  照顧失智症患者的同時，自己的身心靈也需要人照顧，幸好他身邊有David，除了情緒穩

  定，經常扮演家人衝突間的潤滑劑之外，也給予阿好各方面的陪伴與安慰。就像另一部講

  述失智症的真人真事改編作品《老爸歌單未完待續》，阿好也幫媽媽創建一個社群帳號，

  這並不單因為他個人的半公眾人物身分，也是在最後的日子盡力把媽媽的影像留下的方式

  ，同時鼓勵與他們有相同經歷的人。



  其實，早在阿好的爸爸過世之前，媽媽就有一些失智的徵兆，突逢巨變，病情可能又快速

  加劇。為了避免成為子女的負擔，媽媽本想開一氧化碳自殺一走了之，殊不知兒子家強剛

  好返家阻止，卻讓這一生本就很苦的阿好更加辛苦，讓媽媽很是愧疚。從阿好回家幫忙後

  的居家改造，不難看出照顧失智症患者，就像家裡有特殊需求的孩子一樣，友善的家庭環

  境很重要。不論是把瓦斯爐改成配備計時器的電磁爐，還是換為感應式水龍頭，都符合正

  確的失智症居家安全原則。



  「再怎麼不開心，都離不開的，就是家吧。」



  《好孩子》探討「家」與「家人」的真正意義，電影最後揭露阿好並不是李家的親生兒子

  ，但就像哥哥後來前去道歉求和時所說：「媽媽過去怎麼對你，你最清楚。」無法從喪女

  之痛走出也好，真心不在意阿好的性別表現與性向也罷，從媽媽的幻覺與記憶錯亂，以及

  阿好的夢境能夠看出，媽媽過去為了在爸爸面前保護阿好，也受盡委屈。小時候媽媽對阿

  好的疼愛，甚至到讓哥哥嫉妒而偷錢栽贓給他的程度，可以想見媽媽真的非常愛阿好，完

  全超脫血緣。第一次的「母女」誤會時，媽媽脫口而出的「月好」似已埋下「女兒」的伏

  筆，但直至秘密揭露再沒有其他暗示，觀眾某種程度上也與阿好一樣震驚。



  一段與媽媽鬥嘴的對話，更無意間透露，小時候是媽媽在照顧、守護著阿好，現在他則已

  找到懂得珍惜他的另一半。挑嘴的阿好最喜歡吃菜脯蛋，不能太鹹要過水，還得加糖，而

  這正好就是幾顆鏡頭前，David正做給阿好吃的料理。最愛自己的人總是連最細微的小事

  與飲食偏好都會記得，即便失智，又或是再怎麼麻煩都不會忘掉。David與阿好的互動，

  媽媽看在眼裡，也才會在最後拍攝全家福時，邀約對方一起拍照。即使沒辦法正式成為夫

  妻，在媽媽的心裡，他早已是自己最驕傲的女婿。



  「藍色的是你，其他的，就是我們囉！」



  電影看似想要討論太多議題，但其實每個議題都穿針引線得很好，也沒有全部混在一起讓

  人搞不清，而是一個接一個地帶出，循序漸進推疊衝突的能量。片中以《海底總動員2：

  多莉去哪兒》做為比喻極為適切，失智的媽媽就像多莉，但只要她身邊有眾多能夠「變性

  」的美麗小丑魚陪伴，媽媽就無須擔心，而這也成為阿好單口相聲的段子。不過，小丑魚

  並非可以隨心所欲地變性，而是「順序性雌雄同體」，只能先公後母，但套用在阿好與好

  姊妹身上仍舊很貼切。



  「政府不給，媽媽給。」



  雖說路斯明飾演的David是台灣人，阿好也曾經問對方是否想帶自己去台灣，畢竟作為亞

  洲第一個承認同性婚姻的國家，這裡還是比較友善。雖然台灣在2019年就通過同性婚姻，

  但當時的法律規定，若對象是外國人，則對方國家也必須通過同婚才行，一直到2023年才

  終於改為「除中國外，不限外籍配偶的國籍」。現在，阿好只需繼續創造回憶，專心照顧

  媽媽，如同他在直播時回應網友：「媽媽還在，不能動變性手術。」就算早已獲得媽媽全

  然的認同，體貼、孝順的阿好也「不敢毀傷受之於父母的身體髮膚」。或許等到媽媽真的

  離開的那天，David與阿好才會到台灣去成婚也說不定吧。



  「我原諒你。」



  《好孩子》是一部講述和解的電影，阿好不但與家人和解，也與自己和解。因為媽媽罹患

  失智症，他才有辦法透過「扮演」媽媽的女兒，而真正展現自己真實的樣貌並成為家裡的

  女兒。過去身為兒子的阿好，失去不少與媽媽相處的時間，但女兒身的阿好，不僅能夠與

  媽媽享受一同踏青、逛街的母女時光，也增添很多親密感。過程當中，他不只更了解媽媽

  ，也從媽媽口中聽到許多過去從不曾聽過的對自己的稱讚。



  爸爸以前對阿好很不諒解，覺得好好的男孩子怎麼打扮成這樣，不管是生前交代給媽媽的

  遺言，還是媽媽自己的體會，爸爸終究還是藉由媽媽的口向阿好道歉。失智後的媽媽，成

  天吵著回老家找東西，甚至為此在廁所摔傷，都是為了及時讓阿好知道自己的身世。前往

  老家的路上，經過阿好遭退學的中學，媽媽堅持要進去向校長討公道。時光荏苒，人事已

  非，當年的校長早已不任職該校。雖說阿好當年的老師還在，他也趁機為自己平反，但一

  切都為時已晚。阿好無奈表示：「都過20年才幫我出頭。」但他想必對媽媽心裡一直惦念

  著這件事既感動又感激。



  無論是小時候的女孩裝扮導致家裡沒有留存照片的創傷，還是離家多年，覺得自己未盡孝

  道的愧疚，都由於媽媽罹患失智症、「母女誤認」以及揭露家裡原來還有個過世的女兒，

  慢慢抹平與癒合。每次只要爸爸因為女性化的行為與裝扮要打阿好，媽媽總是會叫他一起

  「躲進衣櫃」，如今，阿好再也不需要躲進櫃子裡，他完完全全是媽媽最美麗、最疼愛的

  女兒。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
