title: '[好雷] 《金權性內幕》真是單純的好孩子'
content: '用政治揭開政治陰謀，靠體制消滅體制害蟲，金權性內幕不是只有內幕，還有很

  多幫人蓋好的墳墓。





  主角朴泰秀(趙寅成飾)本是打遍天下無敵手的高中小混混，直到某天看見父親被

  檢察官羞辱，才發現自己表面風光，未來還是會輸給那些現在被他瞧不起的書呆

  子，於是發奮圖強考進首爾大學，立志將來當個檢察官，繼續享受把人踩在腳下

  的權力。


  只是當上檢查官之後，好像又不如他所想那樣，整天都在負責打架、外遇、車禍

  等芝麻蒜皮的小事，這樣怎麼會有高人一等的快感？直到有天終於等來了一件勉

  強能抬上檯面的性侵案，性侵學生的體育老師與誇張的合解金，案情似乎並不單

  純。





  這次正義感發酵的主角決定來刷一下自己身為檢察官的存在感，卻沒想到引來前

  輩楊東哲(裴晟佑飾)關說，這關說背後的代價，竟然是可以蹂躪更多人的權力，

  尤其是看見一線當紅女星都能握在手心，雖然嘴巴上說不要，身體倒是很爭氣的

  有了反應。


  在半推半就(X)期待已久(O)之下，進入了韓江植(鄭雨盛)為首的勢力圈，這中間

  心路轉變非常有趣，看人如何泯滅自身良知，享受萬人追捧的崇拜，連相親對象

  都能從台北車站排到總統府外，這樣的誘惑，你覺得你能成為濁水中清流嗎？





  深入淺出的電影，將政治手段用「無利不往」四個字一筆道盡。包含如何引導風

  向、收買人心、控制財團甚至掌握國家走向，層層疊疊的複雜關係繫之一字利。

  同時培養黑道勢力，不聽道理沒關係，反正我還可以動用暴力，黑白兩道只不過

  是這些人的工具。


  順風順水偶爾也會遇到水星逆行。政治這種東西就要像「尚書大人還真機靈，風

  往哪吹就往哪倒」的精神，隨時做出最有利選擇，不顧一切打擊所有競爭對手與

  不聽話的傢伙。而當一把黑道勾結風波的火燒到韓江植時，朴泰秀一樣是可以犧

  牲的旗子，走狗就是走狗，心狠手辣的算計，加入些許血腥殘忍畫面，讓人明白

  這才是真實的社會。





  當世界都拋棄自己，還有什麼事是不可以。經過一場死亡車禍後，永遠願意挺身

  而出的兄弟與家人，見識到亂世之中唯一情感，也藉由妻子(金亞中)千金小姐背

  景，再打一場揭露官僚黑暗的選舉戰，自解的告白投下一顆政壇的震撼彈，所以

  沒有後台還真的是不行。


  「眼看他起朱樓，眼看他宴賓客，眼看他樓塌了」－出自〈餘韻〉。是的，當復

  仇之火點燃，知己知彼的攻守更加激烈，你會用「醜聞要用更大的醜聞去掩蓋」

  ，我也能用政治「以其人之道還治其人之身」的哲學應對，面對昔日長官今日敵

  人，最後這場鬥爭如何，玩弄選民後還權於民的政治電影，結局讓觀眾們自行決

  定。




  一氣呵成的劇情，透過消滅主角的天真浪漫，混淆正確價值觀與誘惑墮落的精美

  設計，只是成王敗寇誰能笑到最後，各種橋段的安排，將觀影者情緒牢牢掌握，

  絕對是不在顏值之下的精湛演出。


  --------------


  安東河回的微笑面具，笑的你心裡發寒


