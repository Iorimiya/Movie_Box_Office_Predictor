title: '[好雷]《你是好孩子》，有多久沒有擁抱自己了呢 '
content: '部落格版：



  《你是好孩子》用三條主線交錯進行，最後在連成一線，讓所有情感直接重擊觀眾的心底。


  水木太太總是不自覺的傷害自己的小孩，彩乃，對外總是穿上好母親的表皮，回到家卻始終板著臉孔，貌似對彩乃每個舉動都不滿意，也許是因為丈夫長期在外出差，獨自撫養女兒的壓力造成，但更多，是來自從小長大的陰影。


  記得之前看過一本書還是一部電影，內容再講著一名母親對著自己的小孩暴力相向，心裡覺得這樣不對但卻無法控制，她是愛自己的小孩的，但正因為愛，所以無法愛。無法愛自己的小孩所以只好傷害他。


  大學時期參加了一個提案比賽，內容正是跟「受虐兒」相關，當時我們給我們的報告起了個題「一種暴力，兩種傷害」，一種暴力來自於親人，兩種傷害是對於自己還有未來的孩子，根據調查，近3600名施虐者中，就有快800名透露童年曾有受虐經驗，即平均每五名施虐者至少有一名曾是受虐兒，另外，光就台灣來說，家暴事件可以說是逐年增加，每72小時就有一名小孩死於受虐，當然家庭暴力範圍涵蓋廣泛，也不單指父母，可能來自兄弟姊妹、爺爺奶奶、親戚等，甚至繼父繼母也有可能（心理學有個名詞稱作「灰姑娘效應」）。小孩不知道反抗，只好一昧承受，最後在心눊z留下傷痕，長大後不是如同前述例子，無法愛人，就是變成另一個施虐者，如此惡性循環。


  水木太太明顯偏向我先前看過的例子，不懂得如何去愛人，不懂得如何去愛彩乃，其實我原本一直覺得水木怎麼會在眾多婦女中選擇跟輝輝母親更親近些，仔細想想，也許水木只是想從輝輝母親身上學習如何去愛彩乃吧，想從她對小孩的方式，與小孩相處的模式，說話、動作去了解自己缺少的是什麼，究竟要怎樣才能跟她一樣，正常的去愛彩乃。


  至於輝輝母親則是看出了水木太太的過去，同樣出身受虐兒，所以她想在水木太太犯下大錯前，擁抱她，祈求她原諒自己，放下過去受傷的自己，不僅要學習愛彩乃，更要學習愛自己。



  小孩本來就會有多種個性，調皮搗蛋、乖巧懂事、早熟嫻靜等等，岡野身為小學導師，要面對這麼多個性迥異的學生，還要面對各種問題，怪物家長、學生搗亂...


  這條劇情除了點出老師的為難，還有小孩子在成長過程中的可能性，也實在的點出了許多問題不能歸咎於孩子，家長也是要負點責任，自己的孩子罵不得，別人的孩子死不完，或許這兩句話偏激了點，可事實上正是如此，所以有的問題都是別的小孩的錯，是老師的錯，打鬧嬉戲被推倒受傷了，就責怪老師沒顧好，怪罪別人小孩太皮，往往選擇性忽略問題明明是自己小孩主動推人，或者在教室裡追逐嬉鬧本身就不對，總是覺得自己是對的，覺得小孩教育是老師的問題，但是，孩子的教養呢？值得思考。


  「絕不會跟爸爸媽媽還有其他人說。」這句話應該可以視為老師的終極手段吧，一旦遇到擔心說出實話會被責罰的學生就會說出這句話，其實這個問題的結果責任誰該去扛沒有答案，如果老師（大人）不問出實情，無法想出解決辦法（家庭拜訪等等），甚至到時候出事矛頭勢必指向自己（責備老師怎麼可以不知道狀況等等），但一旦知道了，去與父母溝通，或者去找其他小朋友（例如霸凌者）溝通，誰會不知道說出事情的，正是那個當事人小朋友？老師（大人）有難處，小孩亦然。



  第三條主線可以說是戲分最短但卻是最催淚的一段，關於秋子婆婆與弘也的故事。


  秋子婆婆從別人口中說來是名失智的老奶奶，始終獨自一人住在房子裡，而弘也則是就讀小學特教班，被人認為有殘疾（智能不足）的孩子，偶然際遇下秋子婆婆邀請弘也到家裡作客，看似照顧他，卻同時也是幫秋子婆婆排遣寂寞。當弘也母親下班來接弘也時，慌亂失措的一直道歉，不過卻在秋子婆婆的安撫下痛哭失聲。


  對弘也母親言，自己的孩子這樣子，不管走到哪一定都是被用異樣眼光看待，不管他有沒有做錯，總是下意識地去認為自己的孩子造成別人困擾，「這是弘也第一次被誇獎，不管走到哪都要道歉，兩個人在一起，雖然是自己的孩子，有時卻無法覺得他可愛。」可是，有的時候，孩子只是需要被稱讚而已。



  在這些人與人的相處裡，人們總是在互相虧欠、互相原諒，最後在互相救贖。


  「想跟媽媽穿一樣的鞋。」就算每天被打、被罵，彩乃還是渴望母親的愛，想要與母親穿上同一雙鞋，出現在公園裡，穿給別的小朋友看，說著，你看，我跟媽媽好到穿一樣的！


  不管輝輝母親如何引誘，就算只是開玩笑的說要不要去當她家的小孩，彩乃還是緊張得立刻轉身抱緊水木，口中嚷嚷著不要，不管怎樣，孩子都是愛著自己的父母親的，哪怕對自己多兇。誰說孩子還小就不懂愛，在某些層面裡，他們更比大人還懂得去愛。


  最後，「我要怎麼樣，才能成為一個好孩子？」劇中出現的孩子雄太，當最後每個人都得到了愛，得到了等待已久的擁抱，岡野奔跑過後停下來注視的雄太家門，雄太有沒有也得到了父親的擁抱？有得到愛了嗎？電影沒告訴我們，是否，岡野出的家庭作業，雄太完成了沒有。


  《你是好孩子》在情感的濃淡上掌握的很好，不必要的部分不會給你過多，但該給你的就不會吝嗇給予，而本部片也不是一昧地歌頌大人的偉大，或者小孩的不是，還是有用客觀的角度去詮釋出大人與小孩各自擁有的各種面向，如在學校面對孩子的岡野，在離開學校後雖然會思考教育，卻也一直在抱怨別人的不是。


  每個人都會累、會疲倦，適時的一個稱讚，一個擁抱，一個簡單摸頭的動作，都可以讓對方或者自己得到心靈上的慰藉，《你是好孩子》對於孩子，更適合長大了的大人來觀賞。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
