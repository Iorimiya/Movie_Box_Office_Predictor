title: '[討論] 關於哈利波特 混血王子的背叛一幕'
content: '如題，現在我把光碟拿出來重看

  之前都沒發現什麼，結果現在我看到這個0.0






  不知道是不是當時綠幕後製的關係造成麥教授跟石內卜一比


  感覺麥教授就像用貼上一樣



  還是當時麥教授因為開刀乳癌的關係，所以只來拍幾幕其他的用後製？


  --


  哈哈哈，是沒錯啦XDD

  可能我們是麻瓜，完全無法接受（誤


  可是我把這橋段多看幾次，發現麥教授幾乎是每個畫面都是


  石內卜並沒有這麼多，所以我就沒特別拿出來講


  是qn大!!!!!!!!'
