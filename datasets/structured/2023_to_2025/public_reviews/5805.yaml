  衛斯里先生和路平被引出去後食死人又繞後回來燒了衛斯里家

  (然後第七集又若無其事的復原)


  這段小說裡印象中沒有

  電影看了很多次也不懂這段想表達的

  對後面劇情推展好像也沒什麼差

  有人知道這段的用處是什麼嗎


