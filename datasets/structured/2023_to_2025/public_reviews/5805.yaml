title: '[討論] 哈利波特混血王子的背叛'
content: '哈利波特這集因為拿到了混血王子的筆記

  學會了撕淌三步殺這個咒語

  還拿來打傷了馬份

  最後以為石內卜殺了鄧不利多

  也使出了這招

  電影看起來攻擊打在石內卜身上沒效果

  然後記得他說了

  「你竟然想用我發明的咒語攻擊我，我就是混血王子」


  想問哈利波特有這個設定說

  咒語的發明人遇到自己的咒語會無效嗎

  因為看起來石內卜也沒啥反擊的感覺



  最近重看哈利的時候

  覺得他爸爸還有其他三個死黨

  有一個看起來真是格格不入

  很難想像他是怎麼加入的


  --'
