url: https://www.ptt.cc/bbs/movie/M.1248365656.A.F79.html
title: '[好雷] 哈利波特：混血王子的背叛'
content: "圖文版： \n\n整體說來，我覺得「哈利波特：混血王子的背叛」﹝\n以下簡稱「哈六」﹞是目前六部哈利波特電影中，與\n第三集「阿茲卡班逃犯」可以相提並論的，雖然還是\n\
  差了一點。我喜歡的順序分別是：3 > 6 > 4> 5> 1>\n2。「哈六」是六部中最沉重的一部，卻也是最幽默\n的一部，雖然未來看起來更黑暗了，但進入青春期的\n\
  主角們卻開始上演「仲夏夜之夢」一般的愛情鬧劇，\n使得整部片不會太讓人難過。而且導演對於細節很仔\n細，大概跟他英國電視導演的出身有關。不過由於原\n著內容很龐雜，電影版本刪減了許多，若不是書迷、\n\
  或是沒看過前幾部「哈利波特」電影，可能有些地方\n沒法看懂，我在看的過程中不斷回憶起一些書中提供\n的重要資訊，幫助我更了解劇情，但在電影中很多都\n被省略了。另外，有些劇情甚至完全被刪掉，例如新\n\
  的魔法部長Scrimgeour完全沒被提到，片尾的戰役顯\n得太簡單、太不合理，以及石內卜在小說結尾的新角\n色也隻字未提，這些是比較可惜之處。改編過前面四\n\
  集、只漏了第五集的編劇Steve Kloves又回來了，雖\n然他依然被迫割捨許多劇情，至少他修正了第五集的\n大問題。\n\n雖然大部分朋友應該都知道本集劇情了，不過在此讓\n\
  我簡短提一下。食死人肆虐倫敦，正邪交戰山雨欲來\n，校長鄧不利多帶著哈利去找老友史拉轟，希望他來\n霍格華茲擔任教授，鄧不利多私下要哈利波特想辦法\n，向史拉轟取得一段很重要的記憶，以對付黑魔王。\n\
  同時，哈利喜歡上榮恩的妹妹金妮，但她卻與其他人\n交往；而妙麗暗戀榮恩，榮恩卻跟極為主動的文妲在\n一起。哈利在學校的頭號敵人跩哥則越來越陰鬱，似\n乎在謀畫一個恐怖的計畫..\n\
  \n以下有雷\n\n電影開頭食死人在倫敦作亂的畫面一開始，我就深深\n被吸引了，那段攻擊既有節奏感又有美感，大概是想\n宣示這集的攝影與特效都有超高水準，後面的魁地奇\n\
  比賽與尋找分靈體的部分，特效也叫人難以忘懷。但\n除了這些花俏的手法，導演也在許多小細節中，顯出\n他的心思細膩。例如電影最開始的時候，是承接第五\n集片尾哈利與黑魔王交戰後，媒體與其他人一擁而上\n\
  ，但鄧不利多校長摟著哈利的肩膀離開，這段畫面不\n但交代了「哈六」與上集的承接，也對應了「哈六」\n片尾哈利俯在鄧不利多屍體旁的難過哭泣，而鄧不利\n多對哈利的照顧與關心、兩人亦師亦友的深厚感情、\n\
  以及鄧不利多希望哈利更堅強但又想保護他的種種心\n情，都在「哈六」片頭這一摟中表達了；其他細膩的\n例子還包括鄧不利多向哈利解釋分靈體，說到那樣的\n黑魔法「會留下痕跡」的時候，朝哈利的額頭瞄了一\n\
  下，為第七集的劇情發展留下伏筆；另外，鄧不利多\n死後，鏡頭特別帶到哈利進入校長辦公室的畫面，鄧\n不利多的書籍、眼鏡、未喝完的茶都還放在桌上，好\n像他只是出個遠門一樣，牆上他的畫像看起來只是在\n\
  打盹，似乎一切都只是惡夢...這種睹物思人的傷感\n，相信是任何經歷過親友往生的人都可深深體會的，\n導演保留這段畫面，使得劇情更令人感動。另外，在\n看原著時，跩哥並沒有太讓人同情，但在電影版本裡\n\
  ，導演安排這角色表現許多心理掙扎與壓力，讓大家\n看到他與鄧不利多對決時多麼痛苦，片尾又讓哈利回\n答妙麗問題時提到「跩哥無法對鄧不利多下手，他把\n魔杖放下了」，使得跩哥這角色的層次又多了些。\n\
  \n在緊湊的劇情中，導演及編劇也不忘為下一集電影的\n情緒鋪陳，例如「哈六」雖然省略了很多劇情，但仍\n安排了路平與東施出現，雖然只有很短一幕，但若你\n看過第七集，知道他們的未來，應該會有點心酸吧。\n\
  \n還有，雖然本片充滿了青春愛情的歡笑與淚水，但導\n演表達的方式倒不是大哭大笑，而是用較為內斂、微\n妙的方式處理，例如妙麗為了榮恩心碎想哭時，她自\n己躲到階梯哭泣，哈利發現她及時給她友情慰藉，這\n\
  是很安靜的一段，但卻很動人。另外，導演也很善用\n時間表達這些多角戀，例如魁地奇比賽時，除了讓觀\n眾看到特效、以及榮恩的轉變以外，還不忘靠鏡頭剪\n接表達文妲、妙麗等人的情緒。不過雖然電影中段充\n\
  滿這些青春校園劇，導演還是有用一些小片段提醒大\n家，世界還是一樣黑暗危險，例如有回食死人的黑影\n曾向霍格華茲攻擊，只是被魔法擋住了。\n\n不過，片頭哈利在麻瓜餐館的劇情怪怪的，中間哈利\n\
  與金妮的愛情戲有點拖戲，片尾的戰役也讓我頗失望\n，很難想像馬份花那麼多心思把消失櫥櫃修理好、找\n來其他食死人幫忙，竟然只為了讓他在殺鄧不利多時\n，有人在旁壯膽，之後他們一行人似乎只燒了海格的\n\
  家，就不見了，而且也刪除了哈利在戰役前擔心朋友\n安危、給他們幸福藥水的片段，使得電影後段少了很\n多戲劇張力，最奇怪的是連石內卜都不知去向，完全\n沒交代他在霍格華茲變成了什麼。這些省略導致整部\n\
  片好像沒有結尾，只是上下集電影的「上集」。不過\n最後大家哀悼鄧不利多時，還是讓我掉了不少淚。\n\n但回頭想想，片尾大戰被刪掉也沒關係啦，在珍貴的\n兩小時半裡，讓我選擇的話，我比較想看精彩演技與\n\
  其他特效，至於拿著魔杖揮來揮去的場面...實在沒\n辦法太精采，而且在第七集裡終究會出現，那不如先\n省略吧。\n\n「哈六」的攝影非常令人感到震撼，運鏡流暢又充滿\n\
  美感，例子太多實在舉不完，隨便說一個，例如火車\n行進時，鏡頭先拍某個車廂裡的對話，然後穿過窗戶\n拉到車體外，拍一段列車行進畫面，越過幾個車廂後\n，鏡頭再進入榮恩與哈利在的車廂，穿過玻璃進入他\n\
  們的隔間拍攝對話。\n\n年輕演員中，飾演榮恩的Rupert Grint大秀喜感，以\n後乾脆去演輕鬆喜劇好了；妙麗﹝Emma Waston﹞真\n是正的不得了，好可怕；哈利﹝Daniel\
  \ Radcliffe﹞\n則很可能變成本片成年演員中最矮的，扯遠了，很高\n興他在這集不需要像以往兩集那樣陰鬱生氣了；我過\n去一直擔心演金妮的Bonnie\
  \ Wright會搞砸，不過她\n沒有，而且多了一種沉靜的美；Tom Felton成功將馬\n份帶往更黑暗的方向，但22歲的他看起來老好多呀，\n看起來像是三十而立的金融業工作人士，不曉得是否\n\
  為了戲劇效果扮滄桑，若不是的話要保養一下啊。有\n趣的是，本片中飾演11歲Tom Riddle﹝佛地魔的本名\n﹞的人Hero Fiennes-Tiffin，正是雷夫范恩斯﹝飾\n\
  演佛地魔﹞真實生活中的姪子！\n\n飾演鄧不利多的Michael Gambon在本集終於有較多重\n要戲份，他的演出很細膩，例如片尾石內卜即將殺他\n時，他說\"\
  please...\"的謎樣眼神，非常到位，幸好\n這眼神對了，否則到第七集就接不下去了。海倫娜寶\n漢卡特(Helena Bonham Carter)飾演的貝拉也太棒了\n\
  ，她竟然能讓這麼邪惡的角色變得如此讓觀眾愛看，\n真了不起！I love this crazy bitch!\n\n不過「哈六」最驚艷的演員，當然要屬新加入的Jim\n\
  Broadbent了，他的演出輕鬆詼諧，到了感性時刻又\n不會太灑狗血，英國老牌演員真是強手如雲，Jim\nBroadbent曾以「長路將盡」(Iris)拿下奧斯卡最佳\n\
  男主角，同時也是Bridget Jones的老爹、「終棘警\n探」(Hot Fuzz)裡面胖警察的警長爸爸、「紅磨坊」\n(Moulin Rouge)的主人Zidler﹝還唱了\"\
  Like A\nVirgin\"﹞等等，是位表演很全方位的資深演員。\n\n我很高興David Yates還要繼續導哈利波特第七集，\n畢竟看過我舊文章的就知道，我從看了他的「紅塵\n\
  浮生錄」(The Way We Live Now)就很欣賞他，而他\n加入賣座電影導演的行列後，似乎越來越有自信了\n，「哈六」明顯比上一集進步很多。我已經等不及\n\
  看下一部電影啦！哈利波特第七集將被分為上下集\n上映，時間分別為2010年11月與2011年7月。好久啊\n！\n\n另外，對於我們這種把小說全看完的書迷而言，哈\n\
  利波特電影是很難完美的，想想看每回羅琳都寫了\n多少東西，有多少書迷不忍割捨的劇情或典故，這\n樣一本書要塞成三小時以內的電影，本來就會有很\n多遺珠之憾。所以我會把「已經看過書了」當成一\n\
  種幸運，因為這樣在看電影時，我可以好好欣賞各\n位導演的詮釋方式、精彩的畫面，而被遺漏的部分\n，就靠對小說的記憶、或是靠把書再翻一遍來補齊\n。\n\n後記：剛剛瞄了一下影評分數，爛番茄的分數頗高\n\
  ，但批踢踢這邊負雷好像不少，不曉得是不是大家\n不習慣David Yates這種有點偏向英式電視劇的處\n理方法，但我自己是非常喜歡。無論如何我都希望\n「哈利波特」保持全英式的風格、全面聘用英國演\n\
  員、並盡量由英國導演來執導，畢竟這是英國人的\n小說作品，保持多點英國味也無可厚非吧。所以我\n很慶幸當年史蒂芬史匹柏拒絕執導「哈利波特」，\n他當初拒絕的理由，據說除了覺得沒挑戰性以外，\n\
  還包括他不要全是英國人的演員表，他想找海利喬\n奧斯蒙(Haley Joel Osment)來擔任主角哈利波特\n，老天爺，那個早熟到讓人發毛的小孩。給我英國\n\
  演員！\n\n扯遠了。總之，那個海利喬奧斯蒙版本的哈利波特\n沒有發生，而David Yates已經著手開拍第七集，\n我終於放心了。\n\nDumbledore:\
  \ Oh to be young and feel love's keen sting.\n\n\n--\n◆ From: 118.168.137.97\n \
  \                                   07/24 10:48"
