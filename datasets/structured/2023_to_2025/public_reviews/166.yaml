content: '說真的，我開始懷疑永野在"乒乓少女大逆襲"裡面的形象才是本色了。


  她在乒乓少女裡面演一個搶人家男友的小惡魔，

  跟她後來討喜的戲路(Ex.川合)差很多。


  很多人都沒看過那個角色，但我看過，所以她會鬧出這麼多肉食誹聞，

  我受到的衝擊反而少...


  推薦大家都去看那部片，我很喜歡，

  畢竟主角是新垣，還有可愛的遠藤憲一。


