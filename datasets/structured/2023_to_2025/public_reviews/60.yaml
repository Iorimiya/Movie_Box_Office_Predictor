title: '[粉絲不雷]  遲來的《ONE IN A MILL10N》'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  陪朋友去看的，剛好對TWICE也算了解，算是路人粉吧？

  補一下心得：


  總之看完《ONE IN A MILL10N》後其實有點意外，整體給我的感覺比較不像紀錄片。

  段落編排滿跳的，情緒才剛要醞釀就又切到下一段，會不太確定現在主題走到哪裡

  而且稱讚的語句真的很多，身為ONCE的隔壁都看到有點聽覺疲乏了


  原本以為會看到更多從出道到十週年的心路歷程、低潮或差點撐不下去的片段，結果大多以訪談為主，稍微覺得可惜

  也覺得成員之間聊天、一起互動的畫面偏少，很想再多聽他們彼此分享的感受。


  因為個人段落切換得滿快的，所以每位成員分享的內容量也差很多，還沒吸收完就又換下一位，節奏真的有點亂

  但優點是：有不少未公開畫面，還有成員為十週年準備的驚喜表演，這部分真的很加分，也還是讓我哭得亂七八糟

  只是以「紀錄片」來說，會覺得有點小小可惜啦。


  以粉絲向來說當然不會雷，可是應該可以更好更用心XD


  --'
