title: '[情報] 2023 柬埔寨奧斯卡代表：《回到首爾》'
content: "柬埔寨甫公布了申報明年奧斯卡「最佳國際影片」的作品，將以《回到首爾》（Return to\n Seoul）作為代表。\n\n\n\n《回到首爾》為柬埔寨裔法籍男導演\
  \ Davy Chou 的最新作品，曾執導過《金映歲月》和《\n迷夢鑽石島》等電影。《回到首爾》是繼在坎城影展影評人週獲獎的《迷夢鑽石島》後晉\n升官方單元「一種注目」的作品，雖然沒有獲獎，但好評不斷的該片陸續入選雪梨、多倫\n\
  多、釜山和紐約等大型影展。\n\n「帶著一張生母照片，弗萊蒂離開巴黎，踏進陌生的故土韓國，本該是落葉歸根，卻像是\n侵門踏戶，尋找血親與根源，在異鄉裡找原鄉。雖然能從五官看出她的大韓古老血脈，但\n\
  她舉手投足間卻散發出十足的法國氣息。領養中心找到了她的名字、聯繫上生父，弗萊蒂\n與在地友人一同前往拜訪。生父的家人熱情接待，領她走訪所謂家鄉，當來處的面貌越顯\n\
  清晰，她卻越感背離親緣，巴黎也逐漸遙遠；而她的生母，仍不願現身。」\n\n\n\n這是導演 Davy Chou 首次代表柬埔寨征戰奧斯卡。柬埔寨自 1994 年以來只報名過\
  \ 10 次\n奧斯卡，曾在 2013 以同為柬埔寨裔法籍的名導 Rithy Panh 的動畫紀錄片《遺失的影像\n》獲得一次的提名。此外美國巨星 Angelina\
  \ Jolie 執導的電影《他們先殺了我父親：柬\n埔寨女孩的回憶》也曾作為柬埔寨的代表電影，當年大熱的該片提名了金球獎和 BAFTA，\n但在奧斯卡上不獲青睞，連短名單都未入選。\n\
  \n《回到首爾》由捷傑電影代理，預計 12 月上映。\n\n\n\n--"
