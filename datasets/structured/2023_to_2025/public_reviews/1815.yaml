title: '[好雷] 回到首爾'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  2022年12月21日，美國影藝學院公布第95屆奧斯卡金像獎的短名單，最佳國際影片獎項從

  92個地區與國家選出15部出線，其中也包括柬埔寨代表《回到首爾》。改編自柬埔寨裔法

  籍導演周戴維朋友的真實故事，《回到首爾》是他的第三部劇情長片，從跨越法國與韓國

  文化的主角深切剖析養子女找尋生父母的心路歷程。



  正值 25 歲的弗萊蒂第一次到南韓──這是她被一對法國夫婦收養之前出生的國家。這段

  旅程不斷發生變化，從弗萊蒂到身旁親友無一倖免，有如「新人」之姿得以蛻變，同時身

  陷泥淖般，無法喘息。



  過去不少韓國電影都有提到「領養」的議題，包括《冠軍大叔》、《那個閃閃發亮的家》

  、《成為母親之後》與《完美搭檔》，天下雜誌也在「為什麼南韓人的孤兒都送外國領養

  　自己不領養」文中解釋這個現象。片中也安排弗萊蒂在領養中心翻閱南韓領養史的書籍

  ，簡單地交代韓戰過後大量南韓小孩送到海外供人領養。問題是，他們多半不是「孤兒」

  ，領養只是南韓政府為了加深與西方國家的連結、解決未婚媽媽的問題與減少貧窮人口壓

  力的手段。很多被收養者在成年後發現自己的身世遭到偽造，去年9月，被收養者更集體

  向首爾的真相與和解委員會提出調查申請，可見南韓由於領養衍生出許多問題。



  弗萊蒂一向討厭過生日，《回到首爾》裡拍出她三次過生日，每一次弗萊蒂都為了更了解

  自己的身世更勇敢一點。第一次是在她短暫的首爾行之後，毅然決然留在韓國後兩年，弗

  萊蒂在有人不顧自己的不悅硬是為她舉辦生日派對後，致電給曾經約炮的法國軍火商，決

  定轉換職涯跑道。雖說聽起來荒謬，但就像後來與父親見面時弗萊蒂所說，她當年因為戰

  爭被送養，如今是為了和平而販賣軍火，也算是以自己的方式在為南北韓的和平而努力。



  第二次則是又過五年後，弗萊蒂看著生父寄給自己的電子郵件，不禁會心一笑。留在韓國

  夠久的她，按照生父當年的願望學會一點韓文，所以已能正常看懂生父的文字，兩人間的

  距離也讓壓迫感大大減少，弗萊蒂便決定要再次與父親見面。經過這些時日，父親與她都

  有所成長，父親為了弗萊蒂已戒酒，女兒也為自己現在已能正常與父親以電子郵件或簡訊

  互動而感到欣慰。



  最後一次則是在終於與生母見面後的一年後，遠在英國旅行的弗萊蒂，拿出一直隨身帶著

  、寫著母親email的紙條，用Google翻譯小心翼翼地翻譯出自己寫給生母的第一封信，最

  後祝福媽媽永遠快樂的韓文還是她的韓文名「妍喜」。即便馬上收到系統退回的通知，但

  走過這段尋根、找自己的旅程，這時候的弗萊蒂彷彿已經釋懷，面對每次生日都有成長的

  自己，她走到飯店的鋼琴前，翻閱陌生的琴譜，再次經歷「識譜」的恐懼，最後坐下開始

  彈奏。弗萊蒂可能需要時間，但她全然接受即使面對未知，也願意勇敢面對的自己。



  《回到首爾》全片講述弗萊蒂的身分認同危機，她在法國長大，但到韓國之後，典型的韓

  國五官反而讓弗萊蒂格格不入，大家自然而然對她講韓文，弗萊蒂也只能尷尬表示自己是

  法國人。不論是韓國人不知所以的習俗，還是亞洲人的含蓄與幽默，她一概不想理解。或

  許是一種近鄉情怯的感覺，弗萊蒂本來可能覺得由於前往日本的班機取消，剛好得以前往

  自己的出生地是一種緣份，但實際抵達之後，她卻又不願承認自己的韓國出身。



  對韓國陌生到弗萊蒂不知如何接近也好，身為法國人的優越感也罷，這些或許都是原本養

  父母希望能夠透過與她一同前往以避免的困擾。面對生父家人的愧疚與熱情，弗萊蒂完全

  不知道該如何回應，語言不通又一直將韓國的價值觀強加在她身上，讓本就陷入迷惘的弗

  萊蒂對自己的身分認同更加茫然。



  女主角弗萊蒂在《回到首爾》中不斷交替不安、迷惘、茫然、憤怒、膽怯、害怕與怨懟等

  負面情緒。電影多數時候都籠罩在陰天或雨天之中，唯一的陽光灑落在她獨自前往山林踏

  青時與遠在法國的養母視訊通話，但就算是那通電話，弗萊蒂的心情也一點都不美麗。這

  樣複雜的情緒表現，對於資深演員來說都不容易，更何況是新演員。飾演弗萊蒂的朴智敏

  並非專業演員，她本身是韓裔法籍視覺藝術家，可能是朴智敏敏銳的觀察力幫助她捕捉這

  些情緒的詮釋方法，再加上朴智敏本身也是兼具法國與韓國兩種文化，電影在坎城放映後

  她的演技驚豔國際影壇，完全沒有新演員的青澀。



  《回到首爾》不但是女主角弗萊蒂與自己的出身和解的故事，也是她的生父與自己二、三

  十年前做出的這個決定和解的過程。弗萊蒂無法理解也不想理解父親為何當年親手將自己

  送至領養中心，她覺得現在說再多話、再多的彌補都為時已晚。不過，雖然生父表示自己

  將這個秘密埋藏心底，後來再娶的妻子與女兒都不知道弗萊蒂的存在，但妻子在夜深人靜

  之時以翻譯機告訴弗萊蒂，自己的丈夫每次只要喝醉酒都會哭著提到自己無緣的女兒，可

  見生父無時無刻不把弗萊蒂放在心上。畢竟不是每位被領養者都能順利找到自己的親生父

  母，因此，與生母相認的過程幾經波折，最後好不容易見到面又斷了聯絡也才讓弗萊蒂與

  生父的互動顯得更難能可貴。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
