title: '[普雷]《關於性》有性感性理性溝通性'
content: '談論性，是重審自己的性範圍，或一段自我認同？


  亞洲人鮮少談論「性」，雖然台灣已經算是亞洲社會較為開放，能接受不同樣貌的性與性

  傾向的國度，但我們仍然很少認真的談論彼此對性的看法與見解。


  性有它的私密之處，也有著它獨特的魅力與特殊性，但即便是伴侶或夫妻之間，也很少坐

  下來認真談論自己對性是有著怎樣的渴望與邊界，這些往往是日後矛盾的開始，但也可能

  是找尋和了解另一半的可能性。談論性除了那些情色片上的器官之事，是否更有自由的論

  點，或是彼此的底線？


  《關於性》是挪威導演「性愛夢系列」的首部曲。故事以兩位煙囪工人的奇遇和夢境為開

  端，工人朋友談論自己，一位不斷夢到自己被男明星給凝視，讓他困惑但卻有著複雜心境

  。另位工人則是一時興起和同性發生關係，並分享給老婆，卻導致兩人之間的感情發生危

  機，在夢境與性愛裡，他們與友人和伴侶之間，展開一場性的感受思辨。






  《關於性》是什麼電影？


  我自己喜歡聽談話性節目，但是又很受不了多人對談的吵雜。因為妹妹推薦的關係，在

  Podcast上聽了些由同志和女性談天說地的節目，但不知道是否節目主持群本身就健談，

  雖然討論的故事有意思，但總必須控制一下音量鍵。


  在名為《瘋女人聊天室》的節目頻道中，主持人之一的同志坦言自己與老公為開放式關係

  ，而另外一位友人嘉賓則是談論自己女裝與異性戀者發生關係的性經歷，則都讓我再次思

  考關於當今台灣社會對於性愛價值觀，和族群的開放性，在90年代金賽量表報告至第三次

  女性主義中，都再次模糊化關於性的與性別的絕對性。


  性與愛，永遠伴隨著時代有著不同的哲學思辨，從過去關於生育或宗教啟示，所誕生關於

  性的解釋，又或是生物本來的愛，如同母愛、父愛等。如今時代伴隨著科學與社會風氣的

  轉變，愛變得更多元，性也不再是那宗教裡提到「不做害羞的事」，從為了繁衍後代，到

  彼此性愉悅，最後是彼此尊重，如：女性性自主權的重視，和對男性根深蒂固那有害陽剛

  氣息的刻板，對於愛的選擇條件，性是否又為必然？又或是性愛真的能分開，當告知戀人

  與同性別的人發生關係，是否就表示性趣的轉變？







  挪威導演－達格·約翰．豪格．魯德的「性愛夢三部曲」首部曲電影《關於性》，是一部

  攤開來，以理性的角度探討性在當代時代中再次詮釋和激盪的角色。以「煙囪工人」歐洲

  傳統的藍領階層人士，來詮釋普遍男性氣質的代表，並用中年男性作為探討性、卻不流於

  傳統父權男性視角的模式去敘事。故事中兩名煙囪工人相互吐露自己近況，一位做著被男

  明星凝視，無法言語喜憂的感覺；另者則是最近與男性客戶發生性關係，與自己老婆分享

  這件奇遇。兩者試圖當作一次聊天內容，但卻漸漸對於這樣的感覺，使自己的家庭與生活

  發生變化。


  在這部電影中，導演試圖由性為主題，透過角色理性的去討論他們所看待的性，甚至用敘

  述夢境內容來建構性傾向的模糊，與腦袋中真實的慾望。中年成熟男性在社會上被看成是

  最具有性主導與陽剛社會權力的標籤。


  但在《關於性》這樣的角色卻因為生活上的遭遇，而模糊化或是成為反諷的題材。性傾向

  的不絕對、自我對性認同隨著時間和了解改變、性到底是自由坦然或預留彼此的空間，導

  演希望藉由兩對傳統異性戀夫妻的交流，來傳達當代性的多元性與伴侶之間的性標準的磨

  合和討論。








  《關於性》分析與延伸：


  不只是亞洲社會，看似開放與現代，甚至是讓世界上許多人認為先進思想與社會架構的北

  歐，也存在著對性的刻板、和傳統女性樣貌，和男性主導社會的思維和價值觀。《關於性

  》除了探討性與愛之外，也是對於挪威傳統社會陽剛主義下的諷刺性。


  而這次並不把陽剛主義的壓迫放在女性，而是轉而放在通常被人以為的既得利益者「中年

  男性」。就像是電影裡所展現的社會通常對男性有著傳統該扮演的樣子，這點男性也與女

  性一樣受到關於刻板的束縛。故在被被同樣是男性凝視的夢境裡，自己覺得苦惱又愉悅的

  煙囪工人，不知道該不該說出自己的困惑、或是迷茫，這樣的感覺是否不符合一家之主的

  男性地位。


  電影也同時探討關於當男性與男性發生關係時，是否代表該男子是同性戀者？與男性發生

  性行為的煙囪工人向朋友談白、同時也在發生事後作為一項新奇的體驗跟自己老婆敘述，

  卻沒有意識到他自我對性與愛的認知，可能與老婆的認知有所差異，讓煙囪工人的老婆困

  惑，對於老公為何會跟男性發生關係？或是兩人是否也有性衝動，在到如果有性行為是否

  包含愛，或是用性行為確認是否還愛，這也讓工人與老婆談論過去兩人還是男女友時發生

  的軼事。讓圍繞在性與愛、同性與異性之間，有了更多元的方向，並表達出性並非哪一個

  性別或性向人士的主導體。





  即便我們常常覺得北歐社會有著多於亞洲社會、甚至台灣，高度自由與多元性選擇，電影

  裡卻呈現出挪威家庭男、女也是對於這樣的多元性有著不解、排斥、仍需要討論，並且不

  管在家庭中或婚姻中，男、女的角色定位和透過性來確認愛，或是愛才有了性，尷尬的性

  自白與性描述，讓人很難坦然面對，自我慾望的本質。在《關於性》電影中，冷調的溝通

  與兩性對愛與性的詮釋，又或是夢境和生於當代早熟的孩子，在社會上維持以「傳統婚姻

  」為名的陽剛男性主體的主流婚姻觀，是否該是變革之時？


  有趣的是《關於性》電講述宗教向來不喜歡的性與愛的議題，卻獲得柏林影展中的「天主

  教人道精神」獎。由基督與天主教兩個宗教團體的媒體組織所建構的獎項，是以宗教和人

  道關懷與社會人與人的尊重為出發點的獎項，聚焦在電影呈現的倫理與精神層面的創新和

  價值。


  可以說在歐洲傳統宗教也多有認同，他們在看待性與愛，應該有更多以人為本的出發點，

  而非死板的教義本身。電影裡，不停做著被男人凝視自己夢境的煙囪工人，本身的宗教背

  景，讓他有所顧慮，但還是渴望被人理解自己那種被看到的愉悅和困惑的內在矛盾。









  《關於性》值得一看嗎？


  首先這部電影不推薦給喜歡有起伏、有結果、甚至希望有個核心價值的觀眾看，並不是排

  他性，而是這部電影幾乎八成都是由對話建構而成，並且會經歷過各種價值觀的翻轉在翻

  轉，像是與同性發生性行為是否就為同性戀者、但只是單純的性欲和一次的同性關係就是

  同性戀，這樣無愛的性是否成立？但同時有了性行為與老婆的愛和性又該如何解釋？面對

  這樣的思辯在《關於性》的電影中有很多，角色透過不斷的對話溝通來完整自己對性與愛

  的界線和理解，最後希望對方可以同理，或表達自身的價值觀。


  就像一位美國的影評人－史蒂夫．埃里克森所述：「這部電影雖然名為性，但並沒有性愛

  場景，而是深達兩個小時關於性與愛的對話。」這些探討的對話是精彩的，例如偷情的定

  義、夫妻之間對於愛的詮釋與忌妒、甚至是一場有趣又讓人深思的脫口秀。


  跟以往我們認為所謂的討論「性」就該有性愛肉慾、激情情感，奔放且禁忌的展現在螢幕

  上，《關於性》反而用最冷調、理性務實的成面，講述男女面對性，這點對我來說到是很

  符合我心裡刻板的北歐電影所要的感受。








  這部片以中年男性做為主題描繪性，卻不落入一般的男性主義或陽剛思維的俗套，同時也

  不以女性觀感和視角為主，描繪出當代其實很容易被人忽略，出生或活在一個女性運動，

  多元價值觀下成長起來的男性群體。


  在傳統中與過去女性運動中時代的男性有毒的陽剛特質是一個將被推倒的觀念，但在當代

  卻無人探討當這些有毒的陽剛特質被推翻，女性主義崛起後，男性新型態價值觀的架構，

  當大家都在討論新女性正面型態、與刻板過時的男性反面，《關於性》給予了一場平等且

  新的男性主義該有的價值觀，如同女性主義追求的是平權，新世代的男性主義，理因也是

  不該被忽略的平權主義。




  --

  個人Blog：

  小說連載頁：


  --'
