title: '[好雷] 關於性Sex'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  1. 這是一部就算是不小心知道故事是什麼也不影響觀看的電影。純粹去看由演員，他們

  互動、表情，感受他們的想法與思索他們的內心。在看到這部片之前，我一度以為這種不

  點破的技藝已經失傳（？？），只有在老一點的電影才能看到。


  2. 每個人會被故事吸引的點一定都不同，有時候需要在對的時候看，電波頻率才對得上

  。在看《關於性》以前，根本無法想像這部片能有什麼有意思的地方，看完內心：挪威人

  吵架都這麼理智冷靜、思考都這樣清明嗎！？連面對中年危機都如此嗎？太強了（重點大

  誤）。看的過程中會不斷加入角色立場去思考，當時他們的感受是什麼，要怎麼去辨識自

  己的感受，以及如何從所遇到的困局（表面來說，一個人困局大，一個人困局小，但同這

  故事一路走來，終是明白，無論困局大或小，都是必須認真反覆去處理才能明白）。而最

  深深給我重擊的是近期領悟到的一件事：人需要朋友，真正可以深入，完全信任的朋友（

  中年人有沒有比過往更需要朋友我不知道，但人到某年紀會清晰感受到朋友漸少，許多事

  無法與人討論，容易陷入某種無法說，無法形成一個以自己感受為主的敘事。因為腦中的

  問題，當它還在腦子裡時，沒辦法被完全地整理出來，同時也就不真能令自己看清）。電

  影或者著重於男性對於自身的性與性別的思考，但隨著電影推移，友誼的關係在我眼中比

  其他任何都還顯目。


  3. 三部曲分別為「性」、「愛」、「夢」，這部一看完就立刻明白，三部應該都以這三

  主題構成，只是偏向方向不同。正因如此，才會對評價似乎更好的後兩部更加期待。



  ***


  這裡是我的樂園:




  --'
