title: '[好雷] 關於性'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  甫落幕的台北電影節，今年其中一組焦點影人單元選到挪威的中生代導演達格．約翰．豪

  格魯德，其中也收錄他橫掃柏林影展與威尼斯影展的「性愛夢三部曲」，《關於性》便是

  這個系列的序曲。



  如常午後，兩名煙囪工人聊著昨日各自的奇遇。兩場奇遇，來自感官與內心的兩記震撼，

  重擊著中年直男們的不惑人生。



  「你聊天的對象形塑你的人生，慎選聊天對象。」



  電影幾乎全由對話組成，兩名煙囪工人的「Men''s Talk」、煙囪工人與老婆的談心、煙囪

  工人與兒子的對談，以及煙囪工人與聲樂老師、醫生的對話。這些對話不但碰觸話者想談

  論的主題，背後其實都延伸出哲學思辯，不論是彼此對性的看法、不同性別對同一件事的

  想法，抑或是某個話題導致的自我認同，在這些對話穿插進行的同時，觀眾也被迫在腦中

  進行一場對談。不管自己認不認同某個角色的論點，要附和或反駁似乎都不是那麼簡單的

  事。



  兩名煙囪工人其實都有名字，但在片中卻沒被提及，只因那並非導演想討論的內容。夢見

  大衛‧鮑伊的工人，因其將自己看為女性的「眼神」而感到困擾，但卻不是由於這種凝視

  讓他感到不舒服，反而是享受與自由的感覺。不過，工人同時又為自己的愉悅感到不安，

  這是否暗示著他「喜歡」以女性的形象示人？與他的性別認同或性傾向又是否有關？比起

  另一位未經審慎思考就實際採取行動的工人，他只是「夢見」就開始懷疑自己，這可能也

  與這名工人較為保守又是基督徒有關。對他來說，光是「日有所思，夜有所夢」讓這些情

  景出現在夢境裡就夠煩心的，更何況，這名工人根本不喜歡大衛‧鮑伊！



  《關於性》不僅透過對話討論「性」，其中也包括不同的性別角色的觀點。兩名工人分享

  自己的經歷時，雖說也告誡對方不要說出去，但某種程度上都是在分享奇遇，甚至發生男

  男性行為的那位還以得意的口吻敘述這段故事。雖然同事也對於他那覺得不怎麼樣的口吻

  感到驚訝，但至少還能諒解，尤其是在工人保證自己絕不是同性戀之後。



  但是，他與妻子分享時就不是這麼一回事了。當然，在老婆眼中看來肯定不一樣，但這也

  包含作為伴侶的顧慮，她並不是單純考慮是否該離婚或自己是否受傷，而是倘若丈夫是同

  性戀，是否該放手讓他自由。沒想到，聽到老婆相對釋懷之後，老公反而覺得對方想要把

  這個故事占為己有而感到委屈。固然並非每位女性或男性都會如此想，導演也不是要以偏

  概全，但由此可見男子氣概在一段關係中扮演的角色有時候比我們想的還要多。



  電影大部分的篇幅都在討論與男人做愛的工人，畢竟他一向不避諱談性，所以老婆自然會

  想繼續追問，好釐清工人當初這麼做的原因，以及兩人的關係現在到底是什麼狀況。作夢

  的工人就沒有這麼灑脫，他是一位連向聲樂老師求助都會隱瞞自己是基督徒的人，一直壓

  抑到片尾才終於找妻子討論自己奇怪的夢境。相比於他一直針對夢中大衛‧鮑伊看自己的

  眼神感到困擾，妻子反而對於他說「能夠被看作女性讓他感到自由」覺得不以為然。就像

  他與兒子在診間與醫生的對話提到，經痛很折磨，老婆肯定不會覺得自己當下是女神。總

  是被物化，受到各種束縛的女性，絕對不會覺得男性凝視讓自己感到自由。



  「愛他，就放他自由。」



  有趣的是，《關於性》的電影類型尚有「愛情片」的標籤。明明片名開宗明義要談性，但

  全片沒有任何露骨的畫面，而是透過這些對話，呈現出兩對夫妻間鶼鰈情深的相互支持。

  發生男男性行為的工人從一開始完全不覺得自己做錯任何事，到發現妻子好像真的很受傷

  ，便表達如果會傷害到對方，他保證絕對不會再發生，但妻子的想法卻是擔心老公為了自

  己屈就。



  得知先生與男人做愛，妻子當然很難接受，但在幾次對話梳理自己的情緒，也與朋友、諮

  商師分享後，她突然覺得老公只是很傻，而自己也還是願意包容著對方，即便這或許會是

  兩人之間永遠的疙瘩。另一位妻子聽到先生說出「被看做女性很自由」後，雖說不是很認

  同，但她更關心對方是否壓抑著變裝癖或是性別認同而讓自己感到痛苦，這些都是角色愛

  的表徵。



  那電影到底討論哪些有關「性」的內容呢？大概是透過這些對話讓觀眾去思考不同看待性

  的態度。發生男男性行為的工人顯然認同性愛分離，只要事後馬上告訴伴侶，便不算是劈

  腿，而妻子認為性是兩人獨享的親密關係這件事，反而會給他一種「性是愛情的全部」的

  感覺，但如果妻子這樣想的話，婚姻反而是限制住「性的可能性」，而且當初兩人交往初

  期，妻子也為了確認自己的感覺而與前男友睡一晚，當時的他也很受傷。



  可是，相對保守的觀眾可能比較認同妻子的說法，甚至會支持她的好友提出的解決方法「

  離婚」，或者像另一名工人一般，本來就是保守到不會隨便談論性的話題，因此這種事情

  從來無法出現在自己的想像裡，要是伴侶真的發生類似的事，大概就天崩地裂了。或許每

  個人對性的想法本來就不是非黑即白，並非不是開放式關係，就一定要從一而終，或者保

  守就是連「月經」兩字都不能從嘴中吐出，開放就是性事都要到處與人分享，深怕別人不

  知道，而是更接近光譜的概念，而尊重每個人對性的看法與界限，不只是人際相處時的課

  題，更是伴侶能夠長久走下去的關鍵。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
