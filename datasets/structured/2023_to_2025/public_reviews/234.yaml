content: '1. 請簡述自身需求片單理由 或 欲尋找電影的類型或特徵（請盡量描述清楚）


  很久以前看了素媛、熔爐、韓公主等等(可能還有一些一時想不起來名字的)

  之前還有感謝上帝、夜鶯的哭聲等等

  37m7m這類電影主要都是在講述正義伸張和內心的變化

  尤其是越著重於各個角色在內心上變化的越好，或是發人省思，讓人去思考電影中所隱含的

  議題

  能和法律牽扯上關係，那就更好了


  2. 已知符合需求的電影或偏好的電影類型

  素媛、熔爐、韓公主、感謝上帝、夜鶯的哭聲


  3. 不喜歡的電影類型

  看了才知道喜歡不喜歡……

  沒有特別不喜歡的，主要不喜歡爛尾、落於俗套


  感謝


  --'
