title: '[好雷] 關於夢（性與愛）Dreams (Sex Love)'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  在看《關於愛》的時候看了這部預告，當時在想：啊，這部網路之前在影展的網路討論度

  和評價好像最高，但好像比較浪漫一點，可能不是我的菜？

  看完：就像大家說的一樣好看呢！


  把暈船寫得如夢似幻，穿插入媽媽、外婆與最後致暈者本人的觀點，讓單薄的少女青春愛

  情變得很立體，既悲傷又快樂（還有許多活過一個年紀才懂得的幽默）。好喜歡詩人外婆

  ，感謝這世界有她，全片最愛就是她那天梯之夢。


  此外，片中將寫作從一股衝動、為自己寫、捕捉記憶、留作紀念、給身邊最信任的人讀到

  出版成書與其後可能發生的種種，算是另一種「夢」。無論是情感線還是寫作線都讓我看

  見講述「夢想很豐滿，現實很骨感」可以如此溫柔。


  （以下爆雷）


  1.故事中的媽媽第一時間讀到作品時，想到女兒小時候的樣子而產生不適，覺得女兒可能

  有被「性侵」（因所寫內容描繪到許多身體）；而相對應的老師那一方讀完卻在想自己是

  否被「性騷擾」。這組特意的對比，給我感覺非常當代的感覺（尤其是歐洲一些自認為在

  各種社會議題與性別意識都更加清楚的地方）。在女主角的主述裡，這是一個單戀失敗中

  間夾有成人與孩童的距離（以及師生關係），在媽媽保護女兒的心中女兒是否有可能是被

  騙了，而在老師看來自己被單方面戀慕但沒有真正被了解或認識（更無從發展出有親密關

  係或是愛）。電影劇情設計讓觀眾可以看到這些不同角度，除了對故事有全然不同的看法

  外，也可以感受到現實世界的諸多可能性，並非在黑與白，某人對某人錯之中。界線固然

  重要，但不確定造成的某種狀態，似乎也是值得細細切分開來討論，特別是在電影或小說

  這樣的作品中。


  2.青少年真的是寫不爛拍不完的一個題材，有某部分的純真，正在快速變化，有時行為看

  起來還童稚，內心卻已蛻變。媽媽與外婆作為對比，特別是她倆在山間對話，討論《閃舞

  》的內容，顯示出上一代的青春期，亦有她們成長的故事。


  3.隱隱存在一種個人成長背景差異導出的思維方式。例如女主角友人說羨慕女主角家有自

  己的山屋、女主角的母親與外婆都是相對開明，所以女主角可以保有許多空間，實際上的

  空間與情感思想上的空間（也許不是其他同儕所擁有的空間）。




  ***


  這裡是我的樂園:




  --'
