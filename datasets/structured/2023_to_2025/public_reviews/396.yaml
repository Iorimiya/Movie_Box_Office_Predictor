title: '[微好雷] 白晝之雨-等待雨後天晴的彩虹'
content: "邊看心得文邊聽歌\n\n\n\n本文同步獨家刊登於ViewMovie\n\n\n個人圖文網誌版(pixnet安全連結)\n\n\n\n\n二十幾歲的清潔工岡田，外表平庸、沒談過戀愛、沒什麼錢、只有一份糊口的\n\
  打工工作，因為前輩安藤要求他幫忙牽線，而認識了安藤暗戀許久的女服務生\n由佳。又彆扭又不會說話的中年魯蛇安藤面對心目中的女神，根本不敢出面，\n只好一直推岡田跟由佳交談，從而得知了她最近因為碰到恐怖的跟蹤狂而不安，\n\
  誰知道那個跟蹤狂竟然正好是岡田的中學同學森田，拗不過安藤的威逼利誘，\n岡田只好出面跟森田周旋。結果岡田居然因此意外獲得了由佳的愛慕，這下子\n岡田不只搶走了前輩的女神、還惹上了詭異神祕的森田，自此被捲進他從未\n\
  預料到的血腥風暴之中。\n\n\n【白晝之雨】改編自同名漫畫《白晝之雨 Hime-Anole》，拼音唸起來是將\n兩個字的意思組合在一起，延伸為「成為強者之餌的弱者」之意。沒看過\n\
  漫畫原著的我，很難聯想到原著作者古谷實就是畫《去吧！稻中桌球社》的\n漫畫家。\n\n\n電影開頭岡田對安藤傾訴，自己沒有嗜好、沒有興趣、沒有愛人，下班回家\n\
  就是吃飽睡、睡飽吃，每天渾噩度日，生活沒有一點目標。最糟糕的是，\n自己竟然還對這樣的情況感到不滿，他對這樣的自己實在很不安。\n\n\n安藤聽了淡然地說，這是正常的，不安跟不滿才是生活的動力，這世界根本\n\
  沒有心滿意足的人。連億萬富翁也會對生活感到不滿意的。所以每個人\n都一樣，沒有什麼好不安的。\n\n\n但森田卻對岡田相信這樣的說法嗤之以鼻：才不一樣！你跟我是沒救的失敗者，\n\
  人生已經徹底完了，生活中什麼都沒有，是不可能逃出來的。再怎麼努力也\n不會有什麼改變的，我們早就徹底沒機會了。億萬富翁才不會這樣，只有\n幸福的人、有機會的人才會說那種話。醒醒吧，不要被騙了！\n\
  \n\n\n\n\n電影前半段鋪陳了岡田與安藤的搞笑魯蛇日常，跟由佳的無厘頭相打電\n愛火醞釀，對森田的迂迴敘舊試探，演了大概至少4、50分鐘，直到森田找上\n\
  由佳的租屋處發現她不在家，爆氣的他惡狠狠地踹門後怒喊：\n「我要殺了岡田那傢伙！」螢幕倏地打上斗大片名【白晝之雨】，陸續列了\n出演者的名單，宣告電影現在才正式開始，一分為二，兩個世界。\n\
  \n\n幾個殺人的片段，讓我數次反胃想吐。【白晝之雨】的虐殺算不上特別\n血腥殘忍，但卻真實得恐怖。森田闖入陌生人家中，姦殺了妻子，丈夫下班\n回家時，看到的是坐在餐桌前木然吃著咖哩飯的森田，他抬頭看了丈夫一眼\n\
  旋即起身到廚房拿了刀子回到客廳，這時候嚇傻的丈夫看到倒在地上下半身\n赤裸的妻子，再看到拿著刀子出來的森田，雖然死命地往門口跑，卻在大門前\n被森田追上。\n\n\
  \n第一刀從背後刺入，丈夫潔白的襯衫遲了一兩秒後，慢慢地滲出暗紅色的血漬，\n第二刀、第三刀、第四刀…...血漬染紅了整件襯衫，龐大的男人身軀逐漸癱軟\n在地上。\n\
  \n\n第一刀其實是最難的吧，我邊壓抑噁心感邊想著。當第一刀有勇氣刺入時，\n接下來，只是重複著第一次的動作，沒有意識、沒有意義，跨過了那條\n隱形界線後，只剩節奏。罷凌大概也是這樣？\n\
  \n\n也許有人覺得，這有什麼？我們看過了那麼多電影中殺人、打鬥、血腥的畫面，\n為什麼【白晝之雨】中的畫面會令人特別難受。我想是因為太過寫實，\n森田只是個普通人，不是警察、不是黑道、不是英雄、也不是街頭混混，就是\n\
  一個沒有人生方向、已經拔除掉同理心的人。\n\n\n對於森田為了殺自己卻旁及無辜的安藤，岡田自責地對由佳坦承，\n自己在中學時，曾經為了避免被牽連而背叛了森田，成為罷凌他的幫凶，\n\
  但他永遠忘不了那時森田死寒的目光。\n\n\n片尾森田挾持岡田開車逃跑，岡田不解又害怕地問:「你為什麼要這麼做呢？\n你不是這樣的人啊，森田你一直是很溫柔的人。」森田咒罵地再刺了\n\
  岡田兩刀，但一回頭前方出現了一個狗主人牽著一隻小狗，就像森田中學時\n家中養的那隻，森田突然慌了將車子一偏撞上了電線杆，經過撞擊恍惚醒來的\n森田滿臉鮮血，緩緩回過頭後，開口笑著招呼岡田來家裡玩新出的TV遊戲，\n\
  接續上恍如隔世、還有長長未來的少年時光。\n\n\n【白晝之雨】有許多東西並沒有太仔細著墨，其中最令人在意的就是森田並未\n認真掩蓋自己的行跡，中學時殺了同學、在住處殺了阿和與未婚妻後\n\
  放火燒屋、甚至殺了追查失蹤案的警察，怎麼竟可以一路逍遙法外？而森田剛\n扮演失去人性的連續殺人犯，冷漠無感的眼神確實有營造出令人發毛的恐懼感，\n但是劇本對森田這個角色的描寫若能更複雜深入一點，可能可以更自然在結尾\n\
  處理出返樸歸真的唏噓對比，而減少刻意的痕跡。\n\n\n森田\n在中學時不斷被罷凌，甚至被逼著當眾脫下褲子打手槍。有一天終於\n受不了了，用計把罷凌者帶到山上，暴力凌虐致死，被森田逼迫一起參與\n\
  報復行動的阿和，竟看到這時的森田開始對著屍體打手槍。不堪背負著如此\n沈重的殺人枷鎖，阿和在未婚妻的慫恿下決定一同前來殺了森田，結束多年來\n被威脅勒索陰影下的痛苦生活，卻被反抗的森田一刀刺穿了頸動脈而倒在地上\n\
  抽搐等死，森田回過頭一棒棒擊殺阿和的未婚妻，畫面同時穿插岡田跟\n由佳的床戲，透過高潮一波波地推進，過濾聚焦出動物的本能，而逐漸脫離\n人類理性的境界。\n\n\
  \n我們看著森田，人性退化，動物性竄出。岡田說他忘不了森田在教室中被逼\n打手槍時看著他的眼神，我想是褪去了身而為人的尊嚴，只留下動物性的\n眼神吧。在被羞辱到極致後，只有在抽離掉身而為人的身分，才有可能允許\n\
  自己存活下來，不是嗎？\n\n\n觀看【白晝之雨】，我們沒有必要推理解謎誰是兇手，因為從打上片名開始的\n後半段風格陡變，視角就從岡田轉到了森田的身上。我們跟著森田從反擊\n\
  同學阿和及他的未婚妻開始，看他尾隨姦殺OL，侵入上班族家中殘殺了\n夫妻二人及前來探訪的警察，拷問虐殺由佳的鄰居，還有跟搞不清楚狀況的\n安藤正面衝突。\n\n\
  \n\n\n\n森田的凶惡與殘暴，只針對比自己弱、無力反抗的人。否則不會從小鋼珠店\n出來，就被小混混搶走了剛贏來的錢，還被痛揍一頓。\n\n\n食物鏈的上下游是個單行道，而生存是一場追逐戰，求生意志催促弱者\n\
  往前跑，也催促掠食者追索捕殺。但這場遊戲是比較值，處在哪個陣營\n完全不是自己可以選擇的。在強者面前的弱者，只能在揭曉對手的那一刻，\n拔腿狂奔。\n\n\n\
  我忍不住想起最近正在看的一個美劇影集Stranger Things（劇透劇透\n劇透！），小鎮上的男孩離奇失蹤，周圍的親人朋友努力尋找線索，片片斷斷\n逐漸拼湊出一個詭異的可能--陸續消失的人們，仍然跟我們身處在同一個世界，\n\
  卻進入了不同的維度。他們看到的家還是一樣的家、學校還是一樣的學校、\n小鎮還是一樣的小鎮，卻是個嚴寒破敗的黑暗世界，雖然人就在我們身邊，\n我們卻看不到、聽不到，他們跟我們無法溝通交流，彷彿從這個世界上消失、\n\
  死亡了。而那個維度世界裡有著恐怖的未知生物，隨時會衝出來吞噬人類，\n被拖入那個世界的人，他們能做的，除了逃亡，就是等待死神降臨。\n\n\n有時候我們以為社會新聞上那些殺人、吸毒、暴力傷人的人，是跟我們身處在\n\
  不同世界的人，我們只當看故事一樣去理解。以為是他們自己墮落、自己選擇\n把生活過成那樣失敗沒有希望的樣子。但是如果，是有一股外力將原本跟\n我們一樣、在同一個世界生活的他們，用力一拉，而墮入那個找不到出口的\n\
  深淵呢？遠方陌生的人們被拖入、吞噬，我們只當做茶餘飯後的話題，\n聊過便忘。只因為我們沒能想像，萬一有一天，那頭恐怖的怪獸，竄到了\n我們腳邊，拖下的是我們的朋友、親戚、家人，甚至自己，該怎麼辦？\n\
  \n\n\n\n\n我們不該只是鄉愿地導向同情森田這樣的人，而包容他殘忍的罪行，\n更該做的是試圖理解，何以這樣的人會從一個人開始、慢慢丟失了\n身而為人的自覺，放棄身而為人的理性權力，逐漸任由體內的動物性\n\
  操縱自己的行為。\n\n\n理解了以後，想想我們能做甚麼，可以在某個關鍵時刻，讓事情產生\n一點點的不同。\n\n\n第一次看還以為是兩段不同影片的預告\n\n\
  \n＊＊＊本文如需轉載請先詢問確認＊＊＊\n本文電影圖片來源：絕色國際\n\n\n歡迎來我的粉絲專頁聊書、聊音樂、聊電影\n♬我歇斯底里的愛戀♬\n\n\n\n\
  \n\n--\n\n  沒有一顆心會因為追求夢想而受傷。\n\n  當你真心想要某樣東西時，\n\n  整個宇宙都聯合起來幫助你完成。\n\n--\n    \
  \                           10/07 00:17"
