title: '[情報] 綜藝獨家披露《滯留生》劇本涉嫌抄襲'
content: '無影無蹤 FB：

  綜藝原文   ：


  根據綜藝掌握到的電郵與劇本，作家兼劇本家西蒙．史蒂芬森（路卡的夏天、天才

  貓奴畫家與柏靈頓2等）1月中寫信給美國編劇工會，主張亞歷山大·潘恩執導、大

  衛·海明森編劇的《滯留生》抄了他在2013年的作品《Frisco》。


  史帝芬森後續通訊更指出，他在老家英國當過二十年作家，很清楚同行有時借鑑一

  些元素，但「確實壓倒性」的證據顯示《滯留生》逐行抄襲，故事、角色、結構、

  場景、對話全抄，許多重要的橋段一字未改，甚至任何看過簡短範例的人幾乎都會

  認為「厚顏無恥」。


  同時，《滯留生》唯一掛名編劇是海明森，但潘恩在獎季採訪多次承認他形塑劇本

  ，但第三人的電郵顯示潘恩2013年跟2019年兩度讀過《Frisco》劇本。綜藝在網站

  提供了他們掌握的書面證據，潘恩與海明森沒有置評。史蒂芬森確認電郵是他寫的

  ，但沒有進一步評論。


  --'
