url: https://www.ptt.cc/bbs/movie/M.1709384039.A.8EA.html
title: '[好雷] 滯留生The Holdovers'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  電影背景在1970年代的巴頓學院，講述一位古文明史老師-保羅、住宿生-安格斯及學校主廚-瑪麗在聖誕假期間的故事。


  保羅的教學原則不通人情，堅持不放水讓背景好的學生通過考試，因而得罪學校高層。


  安格斯學業成績好，因為家庭因素導致自己被退學好幾次；瑪麗擔任學校主廚拉拔兒子長大，卻因兒子高中畢業後讀不起大學，被徵召入伍，不幸因戰爭逝世。


  聖誕假期到一半時只有安格斯沒有家人的允許，獨自留宿。在他的抱怨下，保羅允許進行三人校外教學。參加其他學校職員的聖誕派對，瑪麗因對兒子的思念而情緒崩潰，到後來在妹妹住處送給妹妹未出生的小孩衣服才釋懷。


  保羅因自己的病導致體臭而不敢和異性相處。在波士頓溜冰完巧遇昔日同窗，塔利幫他圓謊，事後才得知原來保羅在哈佛大學因同窗家庭背景比他好，被控抄襲論文使他被退學。


  塔利和保羅看電影時藉口上廁所獨自搭車卻被保羅誤會要逃跑，實際上是要去精神病院探望親生爸爸。


  電影最後三人的校外教學被校長發現，保羅承認一切是他的主意而被解僱，安格斯得以不被退學。


  令我印象深刻的片段是安格斯探望爸爸後和保羅說：「我很怕會跟爸爸一樣，爸爸原本也很正常，後來生病就住進精神病院，但保羅跟他說你跟你爸爸不一樣，你有美好的未來值得你全力以赴」。


  電影中的角色刻畫鮮明，主角彼此從一開始冷漠到後來相互交心。


  推薦給喜歡溫馨小品的版友！













  -----

  Sent from JPTT on my iPhone


  --'
