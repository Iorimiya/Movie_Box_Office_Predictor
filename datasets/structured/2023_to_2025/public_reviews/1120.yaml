title: '[超好雷] 滯留生'
content: '防雷



































  一直對這種師生關係的電影很有感覺

  一般對於師生關係的定義總是比較嚴明點

  這種電影可說是打破了現實的藩籬

  也許這部電影的一切都在意料之中

  他優秀的表現還是常讓我嘖嘖稱奇

  比較可惜的是前面的群戲沒有持續很久

  我原本很期待有不同背景的幾個人

  能夠彼此產生化學效應,畢竟牛刀小試了效果不錯

  當然之後師生倆的互動也都很精彩


  老師真的很雞拜,現實世界可能被打的那種

  然而越演越發現他的個性都建立在反差之上

  滔滔不絕於歷史,令人費解的堅持

  所有人都覺得他是怪人吧

  但這種人還是能找到這麼幾個人惺惺相惜

  少年也是一樣,在同級生中比誰都高大

  卻反而顯得自己格格不入,還讓大家差點不能補考

  他有著一般青少年比較難以想像的煩惱

  這些要素可說是跟老師同病相憐

  也造就了他們永生難忘的一次聖誕節

  最後老師的犧牲換取不用轉學,也許就是一種愛吧

  雖然不免覺得有些亂來,這段比較偏劇情需要


  我很高興自己沒有錯過這部電影

  他不會過於正面說教也能適當的溫暖人心

  不管是老師學生,還是其他配角

  都有自己的心路旅程,可能是喪子,可能是徬徨

  他們都在用自己的方式走出自己的路

  推薦給可能會喜歡的人


  ----

  Sent from  on my Samsung SM-S9280


  --

  一旦踏出去，就無法再回頭，朝三千世界的血海而去


  --'
