title: '[極好微雷]滯留生 (The Holdovers) '
content: '雷文防雷資訊頁








  小雷，想自己雷自己可以google查劇情













  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  個人相當喜歡、推薦這部片。


  片名叫Holdovers，劇情開始於一個個性古板的老師，以及幾個奇形怪狀的學生，


  被迫一起留在校園度過一個聖誕節的故事。



  節奏很好，配樂很好，演員演出相當好。



  保羅吉馬蒂是一個相當常見的綠葉演員，(有點好萊塢顧寶明的感覺)


  在本片中飾演主角，我覺得演得無可挑剔，完全展現他的演技功力。





  Dominic Sessa飾演學生，但是戲份基本上和主角差不了太多。


  我覺得他演得也很好，而且又是年輕演員，


  不過沒想到獲得金像獎最佳女配角的是飾演廚房阿姨的那位。




  其實前半段跟勵志溫馨小品電影也算雷同，


  可是隨著劇情展開，


  我覺得這部片並沒有用常見的俗套方式去進行類說教或是化解問題，


  使得這部片相當真實且能引起共鳴。



  結局後勁相當強，


  沒有用灑狗血合家歡的方式來處理，卻相當動人。





  老師和學生這兩個角色我覺得設計得相當好，


  雖然他們真的處境真的很魯，


  而且其實也有不少缺點，


  但是仍然展露人性的光輝面。






  對我來說這部片有點類似[幸福綠皮書]的留校察看版本，


  但是我覺得這部比[綠皮書]更能引起共鳴，


  後勁更強。





  我十分推薦這部片，相當撫慰人心。




  --

  奧茲：你可以吃一堆香蕉！

  芬利：哦，我懂了，就因為我是一隻猴子，所以我一定要喜歡香蕉！

  奧茲：你不喜歡香蕉嗎？

  芬利：別傻了！ 我當然喜歡香蕉，我可是一隻猴子！我只是不喜歡你的推論方式。




  --'
