url: https://www.ptt.cc/bbs/movie/M.1719115776.A.983.html
title: '[普微雷] 亡命機劫'
content: "第三部進電影院看的韓國電影\n撇除類型，單看個人滿足度的話\n破墓>白頭山>亡命機劫\n\n首先想提一個小疑問\n大家看的片頭韓文字卡是不是都沒有中文字幕？\n\
  我這場看是沒有的\n所以我直到片尾才知道這是真人真事改編\n如果提早知道的話，我覺得觀影的氛圍會更好一點\n\n會這樣說主要是針對情節編排\n我覺得短促或重複的事件太多了\n\
  然後一些危機事件的後續影響有點小（EX:人物受傷）\n感覺好像拿東西綁一綁就沒事了\n\n但如果有先知道是史實改編\n那為了把實際的事件串起來，就有可能這樣安排\n\
  觀影時對情節順暢度的要求調低一點，應該會更享受\n(類似\"聯航93\")\n\n優點的部分，演員跟特效真的都很優秀\n最後有幾幕確實是催淚\n\n整體來說算瑕不掩瑜\n\
  算是看了能被娛樂到，但不會留下深刻印象的電影\n\nPS: 演空服員的蔡秀彬，這齣裡的扮相一直讓我想到吉岡里帆\n    前半段有幾次她開口不是吉岡的聲音我還會楞一下\n\
  \n--"
