title: '[無雷] 很特別又好看的闇黑對決'
content: '這一部片是在講韓國黑暗的選舉與政治


  我們台灣用選票選舉，看了也應該蠻有共鳴的


  裡面揭露了很多選舉文化的黑暗面


  而且結局很不一樣


  至於哪裡不一樣


  這部分還真的不能講


  因為這樣子可能會暴雷


  總之不是一般套路的選舉電影就是了


  整部片還蠻精彩的，劇情非常緊湊不會讓人有想睡覺的感覺


  評分7.3/10


  -----

  Sent from JPTT on my Google Pixel 6a.


  --'
