title: '[新聞] 【超完美狗保姆】柳演錫憶愛犬淚灑記者會'
content: '新聞網址：



  年度最萌、最可愛的寵物話題電影《超完美狗保姆》，昨日（2/15）在南韓首爾舉行試映

  記者會，全場記者被片中萌翻天的狗狗們逗得樂不可支，紛紛直呼：「真是一部得以思考

  毛小孩對飼主意義的溫暖之作！」曾以《菜鳥警校生》榮獲大鐘電影獎「最佳新導演獎」

  肯定的金周煥，率領男主角柳演錫、車太鉉共同現身記者會。沒想到柳演錫在分享拍片過

  程當下，因為想起過去飼養的寵物狗，不禁哽咽落淚，連他自己都訝異這個突如其來的失

  態，趕緊收拾好情緒表示：「出道有一段時間了，但這是第一次這樣，所以很驚慌失措。

  」一旁的車太鉉見狀趕緊圓場：「這可不是演出來的喔！」靈活轉換了氣氛，讓現場莞爾

  一笑。柳演錫同時表示，自己在拍完本片之後，便領養了一隻流浪狗：「如果有能夠幫助

  的毛小孩，就應該作為家人一起生活，這個想法對我來說變得更加明確。」《超完美狗保

  姆》台灣也將緊跟南韓檔期，於3月10日在台溫馨獻映。





  《超完美狗保姆》是《鋼鐵雨：深潛行動》製作公司精心打造的年度溫馨力作，故事描述

  面臨「提早登出」危機的狗主人「民秀」，和人生本來就面臨危機的「真國」，為了替愛

  犬「魯尼」尋找完美保姆而展開面試，意外以「犬」為名義持續奔走的故事。而在尋找完

  美狗保姆的過程中，兩人一路從首爾到濟州島，與各個狗保姆候選人展開有趣的面試。導

  演金周煥在昨日的試映記者會上表示：「為了準備電影，在流浪犬收容中心進行很多調查

  ，聽到很多讓人心痛的故事，也讓我想要向觀眾表達這種情況。」他並透露：「以前養過

  狗狗，但現在沒有養了，不過以後我的孩子們想養的話，我也會考慮重新飼養的。」他接

  著表示：「看到片中民秀與真國互相撐腰的模樣，因為我是獨生子，所以不太瞭解兄弟的

  感覺，但也再度感受到兄弟愛跟對寵物狗的珍貴。」



  而柳演錫突如其來淚灑記者會現場，也造成一波小騷動。原來是因為他觀賞完本片之後，

  想起過去跟寵物狗分離的往事，不禁悲從中來：「從小學開始，家裡一直都有小狗狗，但

  即使有非常漂亮的毛小孩陪伴在身邊，但因為跟牠們的生活步調不同，所以有時候家中不

  得不送走這些毛小孩，也因為送走的時候太過心疼，所以我都會故意裝作不理睬。」和寵

  物狗一起度過的回憶，甚至也延續到他對本片的選擇。那一瞬間讓柳演錫為之哽咽，也因

  為無法控制自己的情感而流下淚水。他甚至為了擦拭眼淚而暫停了一段時間，並接著表示

  ：「出道有一段時間了，但這是第一次這樣，所以很驚慌失措。」只見一旁的車太鉉見狀

  趕緊圓場：「這可不是演出來的喔！」靈活轉換了氣氛，讓現場莞爾一笑。此外，柳演錫

  也分享拍完本片之後，領養了一隻流浪狗的心路歷程：「我在獨立之後一直沒有養寵物，

  因為要送走牠們絕非易事，雖然只在父母家裡撫養毛小孩，但如果有能夠幫助的毛小孩，

  就應該作為家人一起生活，這個想法對我來說變得更加明確。」





  值得一提的是，除了柳演錫與車太鉉之外，《超完美狗保姆》還有八隻狗狗共同演出，並

  在專家指導下安全地進行拍攝。演員們與狗狗們精湛的合作演出，讓車太鉉透露接演理由

  ：「跟動物一起拍攝真的很難，我以前跟馬一起拍電影《冠軍》時，就是這樣認為的，但

  閱讀本片劇本之後，讓我想說能否再挑戰一次，也想過狗狗會比馬更好，所以進行了挑戰

  。」柳演錫也說：「看完電影後，我覺得再怎麼分析劇本，再怎麼努力演戲都沒用，只要

  狗狗們搖一下尾巴、笑一下、氣喘吁吁就能讓我卸下武裝，什麼都不做，呆呆看著牠們也

  能傳達出心意，所以我認為真正的搶鏡者，就是這群狗狗們。尤其狗狗們的表現是毫無修

  飾的，也因為表情跟反應都是來真的，所以只能一起跟狗狗交流，將情感原封不動地透過

  電影傳達給觀眾。和狗狗們一起演戲，讓我學到了很多東西。」他也補充：「希望大家都

  能觀賞這部電影，改變對寵物狗的想法。牠們因為無可奈何的情況而被拋棄，希望這樣的

  情況可以愈來愈少，透過我們的電影，有找到新家人的機會，也會讓這部電影的意義變得

  更加重大。」



  這部由柳演錫、車太鉉主演的笑中帶淚溫暖力作《超完美狗保姆》，即將在3月10日於台

  灣溫馨獻映。本片劇情描述民秀（柳演錫飾演）跟女友求婚，對方竟爆出讓他驚呆的真相

  ！原來女友對狗狗過敏，以至於每次跟民秀的黃金獵犬「魯尼」相處時，都必須先吞下抗

  過敏藥物…。面對愛犬與愛人必須二選一，民秀不得已只好幫魯尼尋找一個完美保姆！他

  找來想開咖啡廳卻落空，人生也同樣面臨危機的表哥真國（車太鉉飾演）協助，一起為魯

  尼尋找合適的新保姆。於是，兩個男人一隻狗，踏上從首爾到濟州的「狗保姆面試」之旅

  。他們在路上遇到許多不同的狗狗，也讓他們開始思考「家庭」究竟該是什麼模樣…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
