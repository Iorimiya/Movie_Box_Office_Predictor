title: '[新聞]柳演錫、車太鉉展綜藝魂宣傳<超完美狗保姆'
content: '新聞網址：



  由柳演錫、車太鉉領銜主演的寵物話題電影《超完美狗保姆》，即將在3月10日於全台溫

  馨獻映。適逢南韓當地也將上映，兩位人氣男星近期更卯足全力，從廣播、電視、

  YouTube展開全方位宣傳打片。只見車太鉉穿著獸醫服、柳演錫戴著狗狗髮帶現身上週六

  （2/25）播出的綜藝《驚人的星期六》作客，展現充滿智慧的口才，也讓固定成員、也是

  「少女時代」成員太妍直呼：「我要二、三刷！」至於在上週日（2/26）播出的人氣節目

  《Running Man》中，製作單位則參考電影情節推出「管家的一天」特輯，讓車太鉉變身

  只會剝削的刻薄屋主，柳演錫則變身帥氣管家，透過轉盤遊戲上演屋主爭奪戰。尤其柳演

  錫還在節目中大秀完美廚藝，讓成員劉在錫讚嘆：「這不是開玩笑的，肯定很好吃！」其

  他成員也被他的料理實力給吸引，引爆唾腺強烈分泌！





  柳演錫、車太鉉為主演新片《超完美狗保姆》，作客25日播出的人氣綜藝《驚人的星期六

  》。該節目是由成員們賭上全國的熱門市場美食而進行遊戲任務，只見車太鉉穿著獸醫服

  ，柳演錫戴著狗狗髮帶登場，一同演出的成員也換上狗狗造型，模樣讓人忍俊不禁。第二

  次參與節目的柳演錫感嘆：「上次按照鄰座金東炫的建議，做了自己想做的事情，結果反

  而變成固執的形象。」表現出自己懊悔的模樣，這回原本想要逆轉形象，沒想到卻又不自

  覺發揮出固執本能。另一方面，車太鉉也以幽默的綜藝感與愉快的存在感，為節目炒熱氣

  氛。不僅展現爽快的口才，甚至為了加快節目流程，還進一步指揮成員們，證明自己才是

  節目的忠實觀眾。此外，成員們也都積極協助為本片宣傳，也讓柳演錫謙虛表示：「其實

  我們沒什麼好看的，大家光是看片中的毛小孩們就足夠了。」也讓一旁的成員太妍回應：

  「我要二、三刷！」





  而在26日播出的國民綜藝《Running Man》中，車太鉉與柳演錫更透過《超完美狗保姆》

  的劇情概念，變身缺德屋主與帥氣管家，與成員們展開「管家的一天」競賽。作為管家候

  選人，成員們一開始都穿著正裝現身，當同樣是管家後選人的柳演錫登場，全場便陷入騷

  動，紛紛直呼：「太帥了！是貴公子啊！」「這不是能當管家的類型吧！」車太鉉作為屋

  主也相當活躍，不僅讓至親金鐘國唱歌，更還直接催婚：「希望我們這位管家能快點結婚

  」引來現場爆笑。不僅如此，平常被稱為「料理狂」的柳演錫，更在節目中展現完美刀法

  ，即使沒有食譜也熟練地製做「豬肉番茄燉菜」 、「辣蟹燉雞」等佳餚，展現高水準的

  料理實力，甚至表示自己有證照吸引人們視線。



  此外，現場還出現標示「對」跟「不對」的超大轉盤，車太鉉目睹全昭旻只要看到柳演錫

  就會害羞，調皮地標誌「柳演錫跟全昭旻今天會變得更親密嗎？」並轉動轉盤，結果指針

  只向「對」，即使亂點鴛鴦譜也讓全昭旻心花怒放。之後成員們也為了搶當屋主，展開激

  烈的轉盤戰爭；柳演錫更為了擁有權力而施展各種伎倆，反轉呆萌形象的野心也引發觀眾

  的好奇心。



  這部由柳演錫、車太鉉主演的笑中帶淚溫暖力作《超完美狗保姆》，即將在3月10日於台

  灣溫馨獻映。本片劇情描述民秀（柳演錫飾演）跟女友求婚，對方竟爆出讓他驚呆的真相

  ！原來女友對狗狗過敏，以至於每次跟民秀的黃金獵犬「魯尼」相處時，都必須先吞下抗

  過敏藥物…。面對愛犬與愛人必須二選一，民秀不得已只好幫魯尼尋找一個完美保姆！他

  找來想開咖啡廳卻落空，人生也同樣面臨危機的表哥真國（車太鉉飾演）協助，一起為魯

  尼尋找合適的新保姆。於是，兩個男人一隻狗，踏上從首爾到濟州的「狗保姆面試」之旅

  。他們在路上遇到許多不同的狗狗，也讓他們開始思考「家庭」究竟該是什麼模樣…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
