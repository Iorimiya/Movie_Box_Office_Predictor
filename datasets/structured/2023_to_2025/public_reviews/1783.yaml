url: https://www.ptt.cc/bbs/movie/M.1678360450.A.186.html
title: '[新聞] 韓星力讚<超完美狗保姆>，車太鉉享受療癒'
content: '新聞網址：



  南韓年度話題寵物電影《超完美狗保姆》，即將在明日（3/10）於全台溫馨獻映。本片同

  時也是《與神同行》男主角車太鉉，睽違六年再度回歸大銀幕的主演作品，並與柳演錫飾

  演表兄弟，展現出如親兄弟般的不凡默契。曾養過寵物狗的車太鉉透露，他在正式開拍前

  ，持續前往訓練所與共同拍攝的狗狗們見面，彼此累積親密感，卻也因為前往真實的流浪

  狗收容中心去拍攝，感受到當地的惡劣環境，以及空氣中瀰漫的難聞氣味，讓他覺得在那

  邊工作的人實在了不起。雖然這樣，他也不因為拍攝而感到疲憊，反而直呼這是一部讓他

  更加療癒的作品，尤其按照劇情時序前往濟州島拍攝，更是讓他心曠神怡。此外，本片正

  在南韓上映當中，持續在指標電影網站「NAVER電影」獲得9分以上評分，「CGV」的金雞

  蛋指數也始終在90%以上，就連名導林順禮，以及韓星朴敘俊、俞承豪、崔嬉序、2PM成員

  黃燦盛、權娜拉、李敬揆、李雪、林華映、朴智賢等人，都在社群網站發文推薦，鼓勵粉

  絲踴躍觀賞，也讓本片的無害感，勢必讓戲院充滿療癒的正能量。





  《超完美狗保姆》以輕鬆愉悅的敘事方式，詮釋與珍貴而微小的生命一起生活的人生價值

  ，刻劃出真正的家庭意義。男主角之一的車太鉉，在本片飾演為了製作世界上最棒的咖啡

  而創立咖啡店，最後卻慘敗收場，讓人生陷入危機的「真國」。不過他樂觀積極的個性讓

  人難以討厭，當片中的表弟柳演錫陷入人生苦惱當下，他毫不猶豫找他踏上尋找「超完美

  狗保姆」的旅程。出道已達一萬天，演藝經歷近28年的車太鉉，這回無愧自己「生活演技

  達人」的頭銜，以親近感和人性美讓本片發光發熱，就連導演金周煥也稱讚他簡直跟角色

  一模一樣，雖然個性調皮，卻比任何人都還要溫暖。柳演錫也說：「當聽到車太鉉前輩要

  演出的消息後，我就絲毫不用擔心跟哥的『兄弟情』。在我當年什麼都不知道、失誤連連

  的時候，在電視劇《急診室的春天》現場第一次遇見他，他非但沒有露出討厭的表情，反

  而教了我很多東西，給了我勇氣。」尤其本片還有一個小彩蛋，就是片中主角牆上貼著兩

  人年輕時的合照，實際上就是兩人當時拍攝該劇的紀念照。這也讓柳演錫直呼：「當時我

  就在想，我和哥有什麼緣分，難道這就是命運嗎？」



  尤其本片是車太鉉睽違六年重返大銀幕的主演之作，他透露因為過去養過寵物狗，所以對

  本片有許多共鳴：「拍攝前去訓練所一直跟狗狗們見面，積累了親密感。」他還對流浪狗

  收容中心的拍攝印象深刻：「那裡環境惡劣，氣味也很濃郁，讓我覺得在那邊工作的人非

  常了不起。」他回憶該場戲的拍攝：「因為那個場面有喜劇成分，也有想要傳達的重要訊

  息，所以我不能用單一的喜劇表演方式，但也不能一本正經地演出，所以那場真的很難演

  。此外，雖然記不清具體是什麼場面，但每次跟狗狗們做動作時，我都會即興演出，讓我

  直覺這真的是部需要演技爆發力的電影。」他同時透露在濟州島的拍攝，讓他同樣印象深

  刻：「濟州島的拍攝地很好，我也很喜歡劇組按照電影時序拍攝的方式。通常其他電影無

  法按照故事順序拍攝，但這部電影是順勢拍攝，也是我第一次有這樣的經驗。多虧如此，

  本片幾乎沒有讓我感到疲憊的時候，反而是讓我更加療癒的作品。」





  值得一提的是，《超完美狗保姆》剛在南韓上映，便獲得各界一致好評。近期剛執導電影

  《火線交涉》、同時也是南韓動保團體「Korea Animal Rights Advocates」（KARA）代

  表的林順禮導演表示：「車太鉉的歡快，柳演錫的溫暖，狗狗魯尼的可愛聚集在一起，是

  動物愛好者也可以放心觀賞，愉快又溫暖的動物電影。」而透過電影《菜鳥警校生》跟金

  周煥導演結緣的朴敘俊也大讚：「在有很多刺激性事物的年代，出現了這部溫暖人心的電

  影，在觀賞過程中一直面帶欣慰的微笑，希望想要感受溫暖的觀眾，一定要來戲院觀賞。

  」 演員權娜拉則表示：「即使沒有寵物也一定要看，希望大家都能感受到家人的溫暖與

  感動。」演藝圈公認的愛狗人李敬揆也表示：「積極推薦給喜歡狗狗的觀眾，尤其看完電

  影後，家裡的狗狗也會看起來不太一樣。」演員李雪則稱讚：「這是一部沒有反派、美麗

  、可愛、無害的電影。」演員林華映則說：「希望全家人都能一起觀賞的溫暖人心電影。

  」不僅如此，2PM成員黃燦盛、演員俞承豪、朴智賢、崔嬉序等人也都在自己的社群網站

  上打卡推薦，鼓勵粉絲踴躍觀賞，也讓本片的無害感，勢必讓戲院充滿療癒的正能量。



  這部由柳演錫、車太鉉主演的笑中帶淚溫暖力作《超完美狗保姆》，即將在明日（3/10）

  於全台溫馨獻映。本片劇情描述民秀（柳演錫飾演）跟女友求婚，對方竟爆出讓他驚呆的

  真相！原來女友對狗狗過敏，以至於每次跟民秀的黃金獵犬「魯尼」相處時，都必須先吞

  下抗過敏藥物…。面對愛犬與愛人必須二選一，民秀不得已只好幫魯尼尋找一個完美保姆

  ！他找來想開咖啡廳卻落空，人生也同樣面臨危機的表哥真國（車太鉉飾演）協助，一起

  為魯尼尋找合適的新保姆。於是，兩個男人一隻狗，踏上從首爾到濟州的「狗保姆面試」

  之旅。他們在路上遇到許多不同的狗狗，也讓他們開始思考「家庭」究竟該是什麼模樣…

  。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
