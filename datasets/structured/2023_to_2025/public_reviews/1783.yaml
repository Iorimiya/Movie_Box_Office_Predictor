url: https://www.ptt.cc/bbs/movie/M.1678507956.A.019.html
title: '[好雷] 《超完美狗保姆》，給我香甜手！'
content: '部落格版：


  談論、描寫關於親情、家人關係的電影有許多，例如去年在金馬影展看過、時隔多月才終

  於在台上映的香港作品《過時溯L節》。作為首部劇情長片作品，導演曾慶宏的表現可說

  是可圈可點，在處理存在於一個家裡可能存在著的各種問題與矛盾上雖然有些小心翼翼，

  但至少他想藉著電影來省思「家」對於每個人的重要性之目的是有達到的。而同樣在本週

  上映的韓國電影《超完美狗保姆》則試著從人與毛小孩之間的關係，來去延伸探討並且重

  新定義何謂「家人」。不同於2017年的《為了與你相遇》與其續集以狗狗當作主視角，以

  數次的輪迴冒險去探尋寵物的存在意義與使命，《超完美狗保姆》就好像是《與狗狗的10

  個約定》的公路冒險版，導演金周煥回歸至從飼主的角度出發，在經歷連串事情與認識更

  多人之後，重新憶起當時帶牠走進自己生命裡承諾給予的愛與責任。



  過去時有所聞不少與寵物相關的新聞與話題，導演金周煥將這些寫成劇情放入《超完美狗

  保姆》中，不僅會讓有養毛小孩、有養過毛小孩的觀眾有感，也能給想要養毛小孩的觀眾

  趁機教育，從「牠們對於自己來說到底是寵物還是家人？」想到「為什麼想養寵物？」，

  不同對象可以有不同的思考方向，是《超完美狗保姆》相當有意思的地方。導演金周煥像

  是替主角民秀設計了幾個情境，讓他與表哥真國在從首爾開車前往濟州的沿途，遇見和許

  多形形色色的人們，他們各有不同的養與想養毛小孩的原因和理由，有人是為了增加孩子

  的免疫力、為了炫耀、為了賣出、為了平復傷痛，也有的人就只是單純想要有個陪伴，而

  這些不僅都成了民秀替魯尼選擇新家的參考，看著他們與毛小孩間的相處、對待毛小孩的

  方式與態度，亦讓民秀再次陷入思考，魯尼之於他的意義，以及在他心裡到底是如何看待

  魯尼的？


  「不論發生什麼事都會在一起，那才是家人。」


  不過雖然前面提到過，《超完美狗保姆》可以讓人去替毛小孩的存在做個重新定義，但既

  然電影早已是「民秀將魯尼視為家人」的情況，那麼關係上的認同轉變自然就不會是重點

  ，因此觀眾或許能將關注點放在民秀該如何去處理家人（或即將成為家人）間的問題上頭

  ，例如民秀的未婚妻誠京對狗口水過敏，他就想著要替魯尼找個他能夠信任的新家；又或

  者說我們可以假設有天魯尼老了會尿失禁，民秀會不會又想著要把牠送到寵物療養院？可

  是家人不是應該不論發生什麼事情都要一起面對、不能放棄彼此才是家人嗎？哪怕沒有血

  緣關係，既然決定成為家人那就要走到底，不是嗎？於是《超完美狗保姆》在看的，反而

  其實是民秀要怎麼解決誠京和魯尼、也就是他的家人們的矛盾。



  剛開始的時候我一直在猜會不會最後是由真國接手照顧魯尼？結果當旅程中越來越多狗狗

  加入他們，連真國都接下要替叔叔照顧拉布拉多犬的任務，以及從收容所救下了一隻即將

  要安樂死的巴哥犬之後，就知道應該猜錯了，而最後結果確實也是猜錯，但導演金周煥還

  是給了一個圓滿的溫馨結局。整體上來看，《超完美狗保姆》在節奏掌握上處理的很好，

  用喜劇來作為電影包裝是個很正確的選擇，以如此生活化的題材來說，其所給的笑點不會

  像是刻意硬塞，而是相當自然流暢的點綴在劇情裡，這場公路冒險看似有不少巧合，不過

  在導演金周煥的編排下讓這些發展變得合理，而點到為止的民秀與母親間的故事線在我這

  裡是加分，剛剛好的矯情既不會搶過主線風采，也為後來民秀「不想再失去任何家人」而

  做出來的決定增加說服力。


  《超完美狗保姆》雖然論劇情稍微過於理想化，但並不會讓人吃不下，是部讓人看得很舒

  服的電影，兩位主角柳演錫和車太鉉一人負責感性部分，一人則負責製造笑果，各自分工

  、默契十足，可兩人湊在一起一搭一唱也很具火花。不同品種的毛小孩客串登場，從首爾

  到濟州的沿途景色，都是《超完美狗保姆》的額外收穫。


  --'
