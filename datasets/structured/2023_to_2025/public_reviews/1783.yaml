title: '[普雷] 《超完美狗保姆》與狗狗的公路旅行'
content: '毛小孩也是家人，踏遍各處尋找愛狗之家


  隨著現代社會養育子女的費用越來越高，有許多不婚族和不生主義的伴侶，會選擇養寵物

  來陪伴他們的人生，不管是毛小孩，還是爬蟲或鳥、甚至較為偏門的寵物，只要可以好好

  愛護陪伴，都是一件讓人感到溫馨的事。其中家中養狗的人在世界又佔大多數，雖然愛狗

  人士多，但有時候現實往往考驗著飼主與狗狗之間的情感，和面對難題的應變能力。


  《超完美狗保姆》是以毛小孩為題材展開的公路電影，故事敘述上班族敏秀每天的動力就

  是與自己的愛犬魯尼相處，但在他跟女友求婚成功後，卻得知女友對狗有過敏反應。


  他詢問表哥真國，真國表示在濟州島有個狗狗天堂，也許可讓魯尼到那裡快樂生活，兩兄

  弟與狗踏上了公路旅行，但在旅行之中，敏秀卻開始猶豫自己的決定。








  《超完美狗保姆》是什麼電影？


  如果要說什麼動物跟人類最親近，那犬類一定名列前茅，狗是人類歷史上最找馴化的動物

  ，從過去看管家畜與保障家中安全，到如今變得像小孩一樣呵護的玩賞犬，可以說不管是

  在勞力與心力上都與人類文化有著不小的關係。這種說來貓派人士一定不服，但貓咪可是

  神，我想神應該不會跟人類的狗狗朋友計較。


  雖然過去人們養寵物大多是為了保護財產，但隨著時代中人類行為模式的改變，動物與人

  之間多樣化的情感，開始已經不是主僕或物化可以解釋，尤其在當代一些針對動物與人類

  心理的研究，用貓、狗陪伴老人家不孤單的動物治療，或是與孤兒院合作讓兒童情緒穩定

  等，被稱為寵物療法。


  但這種方式也有許多動物學者和動物權利倡議人士對此提出疑慮，認為把狗當寵物其實就

  是對動物的一種禁錮。









  先撇開許多爭議話題，一般人養寵物多少都帶著愛與責任，當然以動物為主角的電影裡更

  是傳達這樣的理念，韓國寵物公路電影《超完美狗保姆》講述在出版社工作的上班族敏秀

  ，每天的動力就是跟家中的黃金獵犬魯尼互動，在與女友求婚成功後敏秀意外得知女友家

  族有對狗口水過敏的遺傳史，過去一直都吃著藥物勉強與敏秀的寵物互動。


  得知這件事的敏秀面臨了愛妻與愛犬二選一的兩難，找了表哥真國想辦法，表哥真國決定

  幫助自己的表弟，他聽說濟州島有一個狗狗天堂，裡面的狗都過得很快樂，他們也許可以

  把魯尼載過去讓牠快樂生活。


  就這樣兩個男人和一條狗踏上了首爾到濟州島的公路之行，但在旅途中想到即將失去一直

  以來的毛小孩魯尼，敏秀的心裡越來越複雜，選擇也越來越搖擺不定。












  《超完美狗保姆》分析與延伸：


  這部電影的確是韓國導演金周煥為了動物所特別製作的狗狗公路電影，從2018年開始編寫

  劇本並且改編，電影被選為2022年第五屆首爾動物電影節的閉幕電影，裡面寵物狗主角魯

  尼就取於他過去所養的愛犬的名字。


  籌拍動物電影經過許多困難，在面臨演員更換，與資方撤資的情況下，最終導演找到願意

  認同他理念的演員來拍攝這部劇，可以說是多位韓星友情幫助。


  為了在不傷害狗狗的情況下拍攝，《超完美狗保姆》中動物演出是在專家的指導下，還有

  確保狗狗們的安全下才會拍攝，但是動物拍攝很大的狀況是很難受到控制，但現場也因為

  有動物的陪伴讓拍攝中出現與狗狗交流的各種逗趣狀況，導演想將這種與寵物一起的家人

  情感傳達給觀眾，並且展現狗狗們毫無修飾真誠的樣貌。










  而這部電影也是真實的公路電影，為了配合狗狗演員，拍攝的場面都是真實的戶外場景，

  並且以動物們真實展現的姿態為主，在由演員去配合他們演出說出台詞，可以說導演的拍

  攝許多心思在呈現狗跟人互動自然的一幕，而不用特意為了劇本達成特定動作。


  這也是導演認為動物電影必須要有的模樣，而不是為了展現某一隻狗的特色，而刻意人囗

  的干涉狗狗玩耍的自由。


  電影是為了展現寵物的面貌所拍攝，反映出一些韓國養狗的生態，導演並不想太過嚴肅，

  故以喜劇、親情、和各種可愛狗狗的特寫來傳達出他想說的內容，其中電影也表示飼養一

  隻狗，和與寵物陪伴的感情，有時候是難以被其他事物所取代的。就某方面導演金周煥將

  自己對於現在韓國對寵物的感覺，透過影片傳達他的一片真心。












  《超完美狗保姆》值得一看嗎？


  我認為這部電影其實很適合給吵著養狗的孩子，一場不嚴肅的教育電影。電影裡用搞笑與

  親情包裝許多養狗的人會考慮到的心情，還有到底為什麼養寵物這件事，是為了炫耀、孩

  子、自己心情陪伴，或許多事情養狗，不管是以什麼動機開始，選擇養育動物就要有責任

  負責牠到最後一刻，這才是養寵物最辛苦與快樂之處。


  透過公路電影的按牌，《超完美狗保姆》將許多養狗會遭遇到的風景濃縮在其中，並且結

  合主角的親情故事來敘述對於一段情感的重視，不管是對人或對動物都是同等的。


  以往韓國電影有時候會有老毛病就是過度煽情無法收斂的情況，但這部動物電影的情感面

  展現的恰到好處，並沒有太過於狗血與看不到盡頭的高峰，這點是我自己在觀迎時感覺很

  不錯的地方。










  但是因為是動物的公路電影，故劇情並不複雜，如果對於常看這種家庭溫情片的觀眾，會

  很容易猜到故事的走向，故會降低很多期待值，而在劇情方面有些地方很明顯有剪輯過的

  痕跡，並且在跳剪部分手法太過粗劣是可惜的地方，最遺憾的是主角親情的部分和寵物之

  間牽連部分過少，讓我覺得像是電影突然最後想起未收尾的伏筆，趕緊補完的狀況。


  但整體來說《超完美狗保姆》很適合喜歡狗狗和家長讓孩子對於養寵物的想法有前置功課

  的電影，裡面比起台灣電影有時候會過度說教，整體來說鎖要倡導的養狗觀念都展現的很

  自然，但是笑點部分可能較為直接，我自己不是很喜歡這些喜劇橋段的安排，但狗狗太可

  愛，所以就忽略了。


  --

  個人Blog：

  小說連載頁：


  --'
