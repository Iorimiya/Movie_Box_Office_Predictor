title: '[新聞] 韓媒推薦！人氣群星搶當【超完美狗保姆】'
content: '新聞網址：



  年度最萌、最可愛的寵物話題電影《超完美狗保姆》，即將在3月10日於全台溫馨獻映。

  本片除了由柳演錫、車太鉉領銜主演，其他演出的群星陣容也讓人眼睛一亮，包括鄭仁仙

  、姜信一（又譯姜信日）、朴昣奏（又譯朴真珠）、太元碩、金裕貞、柳秀榮、金志映、

  禹棹奐、鄭智勳、李浩貞等知名演員全體出動，展現強烈存在感的同時，更為電影增添豐

  富色彩。尤其近期以戲劇《The King：永遠的君主》人氣飆升的禹棹奐，將以意想不到的

  方式客串登場，搭配兩位男主角對他的即興演出，保證讓人發出會心一笑。此外，本片上

  週在南韓舉行試映會，也引發韓媒熱烈迴響，光是媒體對本片的一致好評，就讓外界看好

  票房前景。





  《超完美狗保姆》是《鋼鐵雨：深潛行動》製作公司精心打造的年度溫馨力作，故事描述

  面臨「提早登出」危機的狗主人「民秀」，和人生本來就面臨危機的「真國」，為了替愛

  犬「魯尼」尋找完美保姆而展開面試，意外以「犬」為名義持續奔走的故事。尤其兩人展

  開從首爾到濟州的旅程，路上與多位保姆候選人，以及各種充滿特色的角色相遇，更是豐

  富了劇情張力。曾在戲劇《加油吧威基基》演出金正賢女友的鄭仁仙，這回在本片成為跟

  柳演錫論及婚嫁的女友，更是讓對方展開旅程與成長契機的關鍵角色。以深厚演技內功著

  稱的資深演員姜信一（又譯姜信日），則飾演車太鉉的叔叔，在短暫瞬間展現獨一無二的

  存在感。據悉，他因為跟導演金周煥在《菜鳥警校生》結緣，讓他將在片中進行引人側目

  的特殊裝扮，勢必讓觀眾忍俊不禁。而在戲劇《那年，我們的夏天》演出女主角好友的朴

  昣奏（又譯朴真珠），則演繹為了孩子免疫力與情緒發展，因此想領養狗狗的媽媽，將用

  自己獨特的幽默節奏，巧妙詮釋新手媽媽的歇斯底里，展現誘發笑聲的自然演技。此外，

  曾與導演合作電影《驅魔使者》，近期又以戲劇《The King：永遠的君主》人氣飆升的禹

  棹奐，則飾演朴昣奏的老公，將以意想不到的現身方式，讓觀眾享受尋找他在哪邊的樂趣

  。



  此外，太元碩在片中成為患有潔癖的保姆面試者，在短暫場面發揮自己120%的演技實力，

  既想跟毛茸茸的狗狗成為家人，又因為潔癖而怕狗毛掉得到處都是，將給觀眾帶來諷刺趣

  味。男星柳秀榮與童星鄭智勳則飾演想要領養狗狗的父子，柳秀榮不僅展現如同實際爸爸

  一樣多情而真實的演技，鄭智勳更成功詮釋失去小狗而陷入失落感的敏感中學生。有趣的

  是，鄭智勳甚至還發揮自己的武術實力，跟柳演錫在片中展開荒唐的動作混戰。資深女星

  金志映則飾演流浪犬收容中心所長，在表現流浪狗令人惋惜的情況時，她甚至數度落淚。

  同時，模特兒出身的李浩貞，將以台詞同步讓觀眾反思寵物狗跟家人的意義。主演過戲劇

  《雲畫的月光》的金裕貞，也將飾演最後一位神秘的保姆候選人。全程坐著演出的她，透

  露因為閱讀劇本產生共鳴，便欣然同意接演；角色在引發好奇的同時，更在傳達電影主題

  方面起到很大作用。





  《超完美狗保姆》上週在南韓舉行試映會，也在所有年齡層觀眾中引發熱烈共鳴，媒體更

  對本片一致好評，足以證明票房前景。MBN Star表示：「致命的可愛，如同溫暖春天般療

  癒。」Sports韓國力讚：「穿梭在笑點和淚點之間，溫暖地擁抱觀眾。」The Fact則說：

  「超越寵物狗，讓人思考家人意義的愉快與感動。」STARNEWS也熱淚：「美麗到讓人流淚

  的旅程，富含導演與演員們真心的作品。」此外，媒體更大力推崇兩位男主角的演出。

  Edaily：「要流淚了，狗好可愛！柳演錫與車太鉉的無公害化學效應，加上可愛寵物狗們

  的名品演技，都讓人露出愉快的微笑。」OSEN ：「柳演錫和車太鉉自然的生活演技，讓

  我觀賞的時候一直面帶微笑。」YTN Star：「愉快的兄弟情，可愛又溫暖的療癒默契。」



  這部由柳演錫、車太鉉主演的笑中帶淚溫暖力作《超完美狗保姆》，即將在3月10日於台

  灣溫馨獻映。本片劇情描述民秀（柳演錫飾演）跟女友求婚，對方竟爆出讓他驚呆的真相

  ！原來女友對狗狗過敏，以至於每次跟民秀的黃金獵犬「魯尼」相處時，都必須先吞下抗

  過敏藥物…。面對愛犬與愛人必須二選一，民秀不得已只好幫魯尼尋找一個完美保姆！他

  找來想開咖啡廳卻落空，人生也同樣面臨危機的表哥真國（車太鉉飾演）協助，一起為魯

  尼尋找合適的新保姆。於是，兩個男人一隻狗，踏上從首爾到濟州的「狗保姆面試」之旅

  。他們在路上遇到許多不同的狗狗，也讓他們開始思考「家庭」究竟該是什麼模樣…。



  欲知本片最新消息，

