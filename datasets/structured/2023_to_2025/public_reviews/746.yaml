url: https://www.ptt.cc/bbs/movie/M.1729165500.A.1C7.html
title: '[新聞]<陰陽師0>染谷將太搭山崎賢人成凹凸雙人組'
content: '新聞網址：



  改編知名小說家夢枕貘《陰陽師》系列的精緻古裝奇幻大片《陰陽師0》，即將在本週五

  （10/18）於全台華麗獻映。由於原著當中的主角「晴明」與「博雅」，是夢枕貘根據平

  安時代版的「福爾摩斯」與「華生」的想法誕生而成，為了創造出「凹凸二人組」的感覺

  ，同時又能兼具演技在線，導演佐藤嗣麻子邀請到日本實力派演員染谷將太演出源博雅一

  角。染谷為演出本片下足功夫，不僅要駕馭馬術課程，更得減去拍攝《相撲聖域》時增加

  的10公斤，結果他卻認為不盡理想。此外，他也與山崎賢人在開拍前進行「角色互換」研

  討會來揣摩角色。研討會中，他扮演的晴明也讓山崎賢人大讚：「我真的很喜歡！」更透

  露：「我有從染谷那邊偷走一些晴明的優點。」





  《陰陽師0》是《陰陽師》系列的全新篇章電影，由於原著作者夢枕貘是根據平安時代版

  的「福爾摩斯」與「華生」而誕生出故事主角「晴明」與「博雅」，讓導演佐藤嗣麻子為

  創造出「凹凸二人組」的感覺，特意在選角上想要製造身高上的差距，同時在挑選飾演源

  博雅的演員時，她表示：「晴明會扮演吐槽的角色，所以需要一位能夠出色接哏的人來演

  出博雅，此外還要負責片中談戀愛的戲份，這需要相當高超的演技。」思考過後，她認為

  唯有日本實力派演員染谷將太才能勝任，因此邀他來演出。



  接獲邀約之後，染谷將太為本片下足功夫，像是為了片中的騎馬戲份，他與山崎賢人一同

  接受馬術訓練，難得的經歷卻讓他苦惱喊道：「其實最困難的就是騎馬！這是時代作品中

  特有的部分，但不論練習多少次，最終都還是要看馬的心情啊！」同時，他還得減去先前

  拍攝日劇《相撲聖域》所增加的10公斤，他對此分享：「導演有告訴我要減肥並保持下去

  ，最後減掉7、8公斤，沒有完美減回去原本的重量…。」也成為這次演出他的小小遺憾。





  值得一提的是，在拍攝《陰陽師0》前夕，山崎賢人與染谷將太也特別進行「角色互換」

  研討會，來加以揣摩角色，透過演繹不同的模式，掌握人物可能的行為與反應。當染谷將

  太在演練晴明的角色時，帶有個人風格的演出，讓山崎賢人大讚：「他沒有試圖模仿任何

  人，或強行創造什麼，而是以自己的風格在詮釋，我覺得真的是太棒了，他在感情與技術

  方面的運用都十分出色，我真的很喜歡！」他甚至自爆：「我有從染谷那邊偷走一些晴明

  的優點。」而染谷將太也謙虛表示：「我沒有借鑒自己，是我借鑒了角色，一邊演出也一

  邊在調整。」



  這部集結日本豪華卡司的年度精緻古裝大片《陰陽師0》，即將在本週五（10/18）於台灣

  華麗獻映。全片劇情描述世間有名者皆受咒束縛。千年前的平安時代人鬼共存，魑魅魍魎

  橫衝直撞，卻又藏匿於人心的各種欲望。陰陽寮的學生安倍晴明（山崎賢人飾演），傳聞

  是狐妖之子，雖然天賦異稟，卻對追求名利毫無興趣，一心只想揭開父母遇害之謎，特立

  獨行也引來眾妒。某天，皇族徽子女王（奈緒飾演）的住所發生奇異事件，貴族之子源博

  雅（染谷將太飾演）受託前來尋求晴明相助。同時，陰陽寮也有學生離奇死亡，各種異象

  顯示邪惡陰謀籠罩平安京，種種謎團即將解咒，真相讓人不寒而慄…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。




  --'
