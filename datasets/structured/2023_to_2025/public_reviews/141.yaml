content: '康娜真的超可愛的

  小小的手手

  肥肥的大腿

  還有那根尾巴

  我好懂才川的感覺啊

  真的是萌死人


  這部目前動畫在Netflix上可以看到


  而看這部就需要補動畫版

  算是一個門檻


  整體而言算是很棒的一部電影作品

  節奏通順

  劇情緊湊且富有含義

  雖然有說教情節

  但不會太多

  整體還是偏溫馨的調調


  康娜粉都快點來看這部吧！


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
