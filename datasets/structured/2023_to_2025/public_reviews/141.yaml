title: '[好雷] 電影版小林家的龍女僕：害怕寂寞的龍'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  連載中的奇幻喜劇日常番《小林家的龍女僕》，在推出兩季電視動畫之後，也登上大銀幕

  。來到劇場版，就是要來點大場面，不再是以日常生活為主的輕鬆幽默搞笑，而是以冒險

  、救援任務與戰鬥撐起故事。雖說是少年向的作品，但刻劃親情羈絆還是滿感人的。



  來自異世界的龍——朵露，化身成女僕，與單身人類OL小林，還有同為龍族的康娜、伊露

  露共同生活。康娜的父親突然出現在現實世界當中，並帶來龍界兩大勢力即將開戰的消息

  ，甚至堅持要康娜返回龍界、加入他的陣營以助戰勝。小林相信，康娜有權做出屬於自己

  的選擇，並努力修補她跟父親之間的關係。父女的羈絆、戰爭的真相，以及他們所珍視的

  溫馨日常，究竟能否成功守住呢？



  由京都動畫製作的《電影版小林家的龍女僕》，作畫上出現兩種截然不同的畫風。一是充

  滿鮮豔色彩的日常番甜美可愛風格，但一旦進入戰鬥，馬上變為大色塊碰撞，以線條為主

  的陰暗電玩風，就連打鬥的爆破電子音都很有電玩的感覺。音樂方面，雖說是劇場版，但

  居然還有開場主題曲（OP）與結束主題曲（ED），彷彿在看加長版的單集，光是短片頭結

  束後突然下OP，就能夠讓人感覺到整部片活潑熱情的調性與即將到來的衝突。



  雖然整部動畫基本上是走可愛風格，但龍的畫風卻非常陽剛，符合本作少年向的設定。如

  同前情提要裡，小林告訴所有沒看過漫畫或電視動畫的觀眾，她現在跟大家刻板印象中代

  表邪惡的「龍」住在一起，塑造出反差感。除了外貌的對比，在《電影版小林家的龍女僕

  》裡，更特別強調龍族與人類在性格上的差異。對龍族來說，同胞就是一起戰鬥的夥伴，

  沒有什麼情感羈絆，但與小林同住的朵露、康娜與伊露露，以及其他隱身在人類世界的龍

  族，他們就像移民一樣，深深受到這個世界的文化影響，而開始有不同於其他龍族的思考

  ，這也形塑這部劇場版的衝突基礎。



  主題是家庭，但對象是本來就不那樣看待「家人」的龍族混沌勢力首領奇慕卡姆伊與渴望

  人類親情的女兒康娜，再加上最後小林也沒有說自己就是康娜的家人，只是情同家人的朋

  友，《電影版小林家的龍女僕》並沒有要跟觀眾傳授什麼家庭和樂的大道理，而是透過奇

  幕卡姆伊慢慢習得人類親情的過程，以及人類魔法師阿薩德由於妹妹死於龍族之手而懷恨

  在心的反差，去建構「家庭」的不同面貌。不夠體貼的爸爸不一定不愛自己，他可能真的

  不懂；毫無血緣的同住者或同學也可以建立深厚的情誼；即便身為人類，假使內心只有復

  仇與憎恨，也得不到想要的幸福。



  原作的主角龍是朵露，但就像《灌籃高手》劇場版的主角為良田一樣，《電影版小林家的

  龍女僕》選擇「害怕寂寞的龍」作為副標題，從康娜的角度看這個故事。康娜不但怕寂寞

  ，她也渴望親情，所以在待在小林家與跟爸爸一起生活之間，康娜最終選擇後者。不過，

  這時候的奇慕卡姆伊已經稍微懂得人類的情感，因此叫她去與「只能活在當下的人」一起

  生活，只要兩人經常互相拜訪就已足夠。即使身為龍族的康娜早已超過一萬歲，但當劇情

  從她化為人形的視角出發，不僅讓故事更「可愛」一點，也讓片中的抉擇都顯得更困難一

  些。光是想像康娜幾千年來都無法獲得爸爸的關愛與注意，就夠可憐的，但或許未來奇慕

  卡姆伊也會常常去與小林小酌也說不定呢。



  除了朵露之外，心臟大顆到收留龍的小林，當然也是本次冒險的最大功臣。《電影版小林

  家的龍女僕》並沒有狗血地販賣無限強大的親情，反而是透過揭露小林成為魔法師的潛力

  來打贏這場戰鬥。如同片中的龍族不斷對小林說，她必定有什麼不為人知的能力，才能關

  關難過關關過。明明只是個普通上班族，想必小林自己也很想知道她到底擁有什麼能力。

  專務要傳授「絕招」給小林時，她還很擔心究竟必須做出什麼「犧牲」，沒想到只是放棄

  對小林的工作一點用都沒有的「魔力」而已。這也告訴我們，在各種意想不到之處，也許

  每個人都無比強大。



  總的來說，不論喜歡精彩戰鬥，還是可愛日常番，《電影版小林家的龍女僕》都會是愉快

  的兩小時。就算不是系列影迷，也不會看不懂角色之間的互動，雖然人物眾多，但前半段

  稍嫌緩慢的鋪墊，絕對會幫大家為後半段高潮迭起的情節做好準備。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
