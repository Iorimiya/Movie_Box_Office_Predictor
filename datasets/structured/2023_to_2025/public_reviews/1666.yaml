  一部很成龍的電影，可惜台灣沒上映

  不知道何時串流才會上，像龍虎武師致敬

  以前拍過那麼多好戲讓港片大紅大紫

  一路紅到美國去拿奧斯卡

  我最喜歡的成龍片是：

  A計畫

  警察故事

  福星高照

  快餐車

  奇蹟

  威龍猛探

  龍兄虎弟

  飛鷹計畫

  飛龍猛將

  皇家威龍

  尖峰時刻


  成龍未來壽終正寢後

  不知道誰會當接班人？

  可能還沒出生？





