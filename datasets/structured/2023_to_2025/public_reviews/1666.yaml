url: https://www.ptt.cc/bbs/movie/M.1683155204.A.5B2.html
title: '[新聞] 《龍馬精神》成龍承認自己老了？退居'
content: '《龍馬精神》成龍承認自己老了？退居動作明星後竟淪落街頭 令人鼻酸




  《龍馬精神》


  當替身、玩特技、跑龍套，只有拍過玩命的動作，危險的場景，渾身傷痕累累的動作演員

  ，才能被稱作「龍虎武師」──


  成龍曾經在拍攝《龍虎兄弟》時從樹上摔落，造成腦出血；在拍攝《A計畫》時從鐘樓跳

  下，造成頸骨重傷、鼻骨斷裂；拍攝《警察故事》時從二樓跳下幾乎癱瘓；在《醉拳2》

  跳進火坑，全身多處擦傷。


  成龍說：「龍虎武師」代表一種榮譽，也代表要比別人付出更多的努力。


  而他與成家班也奉獻了一生來證明了這份努力




  成龍敘述「受傷就是龍虎武師的命」，圖為成龍拍攝《龍虎兄弟》時重傷照片


  成龍主演的《龍馬精神》5月12日全台上映，片商於昨日釋出的正式預告中見到成龍從風

  光一時的動作明星，淪落為穿著奇裝異服當街頭藝人，前後反差令人心酸。


  電影中，成龍本色出演一位老去的龍虎武師，而這也是成龍從影60年以來最不一樣的角色

  。




  《龍馬精神》致敬成龍在《上海正午》的印第安角色與《我是誰》的原住民造型


  而預告中，成龍和吳京首次驚喜同框。


  作為兩代動作巨星，成龍與吳京在拍攝時不約而同地淚灑片場：「有些對白真的打動了我

  們，這些台詞其實就是我們以前的經歷，所以一戳到內心就會忍不住泛淚。」


  吳京在預告中一句「跳下去容易，走下來難。」正是龍虎武師一生的縮影，飽含感動與深

  意。


  兩人首度大螢幕真情致敬龍虎武師精神，令人期待。




  「龍馬京神」版海報，成龍、吳京、赤兔齊聚片場、驚喜同框


  另一個預告驚喜亮點，無疑是成龍從10層樓高的摩天輪一躍而下的驚險場景，為了呈現最

  好的效果，讓導演可以近拍，年近70的成龍堅持要親自上去拍攝。


  當拍攝結束，成龍穩穩落地時，所有工作人員都鬆了一口氣，只有成龍開心地像個孩子，

  直呼：「很久沒有站這麼高！」


  面對大家的掌聲，他也笑笑地說：「這麼小的事情有什麼好拍手的，以前做的更危險。」




  成龍在電影《龍馬精神》中親身跳下10層樓高的摩天輪


  除了正式預告，片商也終於公布了《龍馬精神》光輝歲月特映會，活動將於5月6日舉辦，

  一人購票、兩人免費，最多可攜三人一起看電影，邀請闔家共同進戲院回味那些年青春歲

  月，並加碼抽成龍親簽版特典，活動票券即日起於博客來售票網啟售，詳情請洽鴻聯國際

  粉絲專頁。




  新聞網址：




  --'
