url: https://www.ptt.cc/bbs/movie/M.1684129993.A.7B4.html
title: '[普雷]  龍馬精神'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  很喜歡郭麒麟在慶餘年內演的演出，所以才來看這部電影。他是個很優秀而且很認真的演藝人員，希望能有更多人認識他。


  成龍&女兒：剪輯跟人物的變化跳轉太快，尤其女兒的情緒跟翻書一樣快，一言不合就耍脾氣，完美呈現(可能)沒有公主命但卻一身公主病。如果我是做父親的我真的也是不想認這個女兒(但此情況並不適用在現實生活)


  馬：馬的演技很好，牠值得一個獎項。(新人或是配角?)


  龍虎武師：這段其實感觸蠻深的，從以前的武打、爆破場面、親自上陣沒有替身(先不探討號稱不用替身的成龍到底有沒有用過替身)。直到現在可以後製上特效，降低了許多危險性。代表著電影產業的進步與轉變，同時也向那些為了電影事業一直默默耕耘付出的人們致敬。


  龍馬精神就是一部很大眾化的題材-親情，也是最好騙眼淚的。整部戲下來不少片段都能聽到啜泣聲跟抽衛生紙的聲音，但還是蓋不過看完後覺得匪夷所思。



  -----

  Sent from JPTT on my iPhone


  --'
