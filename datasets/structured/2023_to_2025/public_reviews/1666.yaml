title: '[預告] 龍馬精神'
content: '教你怎麼幹武行當龍虎武師

  那麼多武行只出現一個成龍

  正所謂一將功成萬骨枯，無可取代

  從王羽、狄龍、李小龍、成龍

  、李連杰、甄子丹、吳京

  功夫武俠巨星一脈單傳下來

  就像美國的史特龍、阿諾、范達美、007

  尚雷諾、基努李維、小布、阿湯哥一樣


  這部片沒成為賀歲片反而在清明連假檔上片

  大概是讓爸媽帶小孩兒童節去看成龍搞笑吧

  台灣看不到就只能自己想辦法問人找管道看

  好像只要下片的中片都會放在YT上

  不怕你當免費仔，就怕你看不到



