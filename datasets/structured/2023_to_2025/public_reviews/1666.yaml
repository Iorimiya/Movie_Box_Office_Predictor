url: https://www.ptt.cc/bbs/movie/M.1679709060.A.3B4.html
title: '[無雷] 龍馬精神郭麒麟'
content: '這片是龍馬精神的主題曲

  成龍跟郭麒麟一起合唱

  郭麒麟是郭德綱的兒子

  郭德綱是中國相聲大師

  他兒子還沒什麼知名度

  想當電影明星找成龍吳京抬轎

  他跟成龍的共同點都是喜劇演員

  但一個說相聲的後代想當動作明星

  除非學周星馳拍功夫、少林足球一樣

  用特效跟袁和平才辦得到

  能找郭麒麟演這個面生的角色

  感覺就跟黃子華一樣

  未來影視界真是網紅跟脫口秀明星的天下了

  說相聲的也跟脫口秀豬哥亮主持秀算是同行吧

  哪天博恩主持金馬金鐘或拿金馬奧斯卡影帝應該也不奇怪



  -----

  Sent from JPTT on my iPad


  --'
