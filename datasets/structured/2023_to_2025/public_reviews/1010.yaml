title: '[新聞] 【地獄的逃走劇】打造反烏托邦動畫世界觀'
content: '新聞網址：



  影史最狂超燃系戰鬥動畫電影《BLOODY ESCAPE：地獄的逃走劇》，即將在本週五（5/17

  ）於台灣震撼上映。導演谷口悟朗游走在電視與電影動畫製作多年，是日本老牌動畫導演

  之一。他表示這回執導本片，就是想在電影中做些在電視上做不到的事，並透露：「本片

  最有趣的地方，是東京變成廢墟，我所知道的城市變成反烏托邦。」尤其他透過「改造人

  vs.吸血鬼vs.黑道」的新穎題材獲得觀眾肯定，他更透露原本是構想讓改造人對抗吸血鬼

  ，但後來認為創造一個全新的「第三力量」會更好，於是便加入黑道元素，讓故事得以擴

  展。導演也期盼觀眾：「本片不僅具有動作片的大場面，更也會讓觀眾對『生活在社會』

  這個主題進行深入思考。」值得一提的是，片商也順勢推出「戲院入場特典」，只要購買

  本片電影票乙張，就有機會獲得「電影限定A3原文海報」乙份，數量有限，送完為止。





  《BLOODY ESCAPE：地獄的逃走劇》由曾執導《航海王劇場版：紅髮歌姬》，以及《Code

  Geass 反叛的魯路修》系列的日本老牌動畫導演谷口悟朗擔任原案、編劇與導演，並由曾

  打造過《哥吉拉：噬星者》與《亞人》等片，並被譽為「3D 動畫先驅」，甚至曾五度榮

  獲艾美獎肯定的「多邊角動畫」（Polygon Pictures）擔任動畫製作。導演谷口悟朗表示

  ：「雖然這部作品是作為電影完成的，但在企畫啟動時，還沒有確定製作形式，但無論我

  們把它拍成電視還是電影，我們都要先創造那個世界，然後採取一種方法，讓我們能夠以

  任何想要的方式去剪輯它。」他也說本片是他最喜歡的類型：「最有趣的是，東京變成了

  廢墟，我所知道的城市變成了反烏托邦。」尤其片中的新宿，呈現方式讓人印象深刻，他

  進一步表示：「泡沫時期我注意到新宿歌舞伎町，雖然這裡在白天是荒無人煙之處，但到

  了晚上，霓虹燈便會照亮那隱藏的廢墟感。我就在想，如果我們把小野友樹聲演的主角放

  在這裡，就會產生娛樂性。」



  除了由小野友樹擔綱聲演之外，本片也由曾配音演出《鬼滅之刃》栗花落香奈乎、《

  SSSS.GRIDMAN》新條茜等角色的聲優上田麗奈，來聲演女主角「露娜露」。露娜露居住在

  新宿，對外界一無所知，只能透過學習對外界一知半解，所以很期盼能有機會離開新宿，

  去別的地方看看。對於這位角色的塑造，導演表示：「我想讓她成為一位獨立女性，或是

  正在努力變得獨立的人。一些動漫出現的女性角色，往往會符合觀眾和創作者所期望的模

  式，但我想塑造一個跳脫模式、有獨立思想的角色。」他更稱讚上田麗奈：「她本人很認

  真，對待自己聲演的角色也很認真。當時看到她的態度，就決定邀她聲演《航海王劇場版

  ：紅髮歌姬》中的迷你培波一角。 她當時的表現很棒，所以這次又請她去試鏡，結果她

  就如我所想像的露娜露一樣。」





  值得一提的是，《BLOODY ESCAPE：地獄的逃走劇》透過「改造人vs.吸血鬼vs.黑道」的

  反烏托邦新穎題材，獲得觀眾們的一致肯定。導演谷口悟朗表示：「一開始，我想到的是

  改造人，就是所謂的半機械人和吸血鬼。在某次會議上，我向負責製作的同事建議，如果

  我們加入第三力量，故事就更得以擴展。我認為創造全新的第三力量是個好主意，後來就

  出現了黑道。但如果黑道出現，他們會是改造人？還是機械人？意思是一樣的，但是修改

  成人類會更好，這個設定對我來說很有意義。」他也進一步表示：「本片不僅具有動作片

  的大場面，更也會讓觀眾對『生活在社會』這個主題進行深入思考。片中的人物都遭受不

  同形式的『飢餓』，而我們內心隱藏的慾望，有時會在不知不覺中被社會壓制和抹去。當

  故事落下帷幕時，觀眾能本能地感受自己在『渴望』什麼，本片就是如此擁有一個讓觀眾

  思考『人的尊嚴是什麼』的劇本。」



  這部由谷口悟朗執導，小野友樹聲演，多邊角動畫製作的影史最狂超燃系戰鬥動畫電影《

  BLOODY ESCAPE：地獄的逃走劇》，即將在本週五（5/17）於台灣震撼上映。片商也順勢

  推出「戲院入場特典」，只要購買本片電影票乙張，就有機會獲得「電影限定A3原文海報

  」乙份，數量有限，送完為止。本片劇情描述因為人體實驗而成為改造人的如月（小野友

  樹配音），受到以稱霸東京為目標、由吸血鬼集團所組成的「不滅騎士團」追殺。另一方

  面，黑道們也誓死要為被殺害的老大復仇，進而共同追緝如月。三方亂鬥，發展成一場大

  型抗爭。「雖然本來就沒有要活下去的原因，但也沒有被他們所殺的理由──。」如月因

  此驅動體內所埋藏的武器，以及自身特殊的「血」，並為了保護純真的少女，讓他展開地

  獄般的逃亡！



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
