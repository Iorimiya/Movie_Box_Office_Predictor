title: '[新聞] 【地獄的逃走劇】聲優小野為角色禁食兩天'
content: '新聞網址：



  影史最狂超燃系戰鬥動畫電影《BLOODY ESCAPE：地獄的逃走劇》，即將在5月17日於台灣

  震撼上映。據悉，本片在2022年疫情嚴峻期間艱辛製作，許多業務都無法順利推展，不過

  劇組決定採用大膽的「先配音再進行動畫繪製」的「事前配音」（Prescoring）方式，讓

  聲優先配完所有台詞，再配合發音嘴型與抑揚頓挫來設計運鏡，也讓片中的角色比其他動

  畫更加生動流暢。而幫男主角「如月」配音的知名聲優小野友樹，更為了配合角色從人類

  變成吸血鬼，再成為改造人，不飲血就無法生存的身體狀態，刻意在配音前禁食兩天。他

  對作出如此驚人舉動苦笑表示：「一般情況下，你不應該在配音時這樣做，這只會讓你的

  肚子咕咕叫，但身在東京，我實在想不出其他方法來感受飢餓。」面對角色多舛的命運轉

  變，也讓小野有感而發透露，自己原本想當足球員，卻因為受傷而開展聲優生涯：「當然

  ，我沒有像如月經過那麼嚴酷的改造就是了。」





  《BLOODY ESCAPE：地獄的逃走劇》由曾執導《航海王劇場版：紅髮歌姬》，以及《Code

  Geass 反叛的魯路修》系列的日本老牌動畫導演谷口悟朗擔任原案、編劇與導演，並由曾

  打造過《哥吉拉：噬星者》與《亞人》等片，並被譽為「3D 動畫先驅」，甚至曾五度榮

  獲艾美獎肯定的「多邊角動畫」（Polygon Pictures）擔任動畫製作。透過「改造人vs.

  吸血鬼vs.黑道」的反烏托邦新穎題材，獲得觀眾們的一致肯定。據悉，本片大膽採用「

  先配音再進行動畫繪製」的「事前配音」方式，讓片中的角色比其他動畫更加生動流暢。

  導演對此表示：「因為沒有影像，聲優能傳遞的訊息量會變得很少，如果表達範圍受限，

  聲優的配音表現也會受限，我個人認為這不是件好事。對此，我和多邊角動畫進行討論，

  我讓他們創造一些預視化的模擬素材，提供聲優參考，讓大家能發揮最好的表演。」



  值得一提的是，聲演男主角「如月」的小野友樹，因為在《BLUE LOCK 藍色監獄》飾演主

  角之一的「國神鍊介」而聞名。他在片中的精彩表現，讓人感受到角色在冷酷外表之下所

  隱藏的溫暖。為了扮演如月，小野更在配音前禁食兩天。小野對此解釋：「我是透過試鏡

  被選中的，但在錄製之前，我收到谷口導演令人印象深刻的一封信，信中寫著兩個訊息：

  『我希望你忘記至今所培養的所有演技』，以及『我希望你在扮演如月這個角色時，表現

  出你的飢餓』。所以我就試著禁食了。」當導演一聽到也連忙解釋：「我沒有要求你禁食

  啦，是要你決定去如何挨餓。不過，看來還是有效果的。」看到導演稱讚他所付出的努力

  得以成功，也讓小野苦笑說：「一般情況下，你不應該在配音時這樣做，這只會讓你的肚

  子咕咕叫，但身在東京，我實在想不出其他方法來感受飢餓。」





  《BLOODY ESCAPE：地獄的逃走劇》男主角「如月」，起初是身為低等奴隸的普通人類，

  由於某些原因變成吸血鬼，如今又變成全身佈滿機關的改造人，命運相當坎坷。小野友樹

  分享他所聲演的這個角色：「他是一個非常誠實而人性化的人，不過環境卻不允許他充分

  利用這點。結果，如月便背負很多重擔，讓他受到命運的擺佈。」不過小野也對角色的命

  運有感而發：「就像我現在的處境，也是被命運折騰的結果。」他補充：「起初，我想成

  為足球員，不過在高三的時候摔斷右腿，被迫放棄了這條道路。從那時候起，我便轉向聲

  優，一邊重塑自己，一邊展開聲優生涯。」他也笑說：「當然，沒有像如月經過那麼嚴酷

  的改造就是了。」



  這部由谷口悟朗執導，小野友樹聲演，多邊角動畫製作的影史最狂超燃系戰鬥動畫電影《

  BLOODY ESCAPE：地獄的逃走劇》，即將在5月17日於台灣震撼上映。本片劇情描述因為人

  體實驗而成為改造人的如月（小野友樹配音），受到以稱霸東京為目標、由吸血鬼集團所

  組成的「不滅騎士團」追殺。另一方面，黑道們也誓死要為被殺害的老大復仇，進而共同

  追緝如月。三方亂鬥，發展成一場大型抗爭。「雖然本來就沒有要活下去的原因，但也沒

  有被他們所殺的理由──。」如月因此驅動體內所埋藏的武器，以及自身特殊的「血」，

  並為了保護純真的少女，讓他展開地獄般的逃亡！



