url: https://www.ptt.cc/bbs/movie/M.1715225411.A.6BC.html
title: '[新聞] 《BLOODY ESCAPE：地獄的逃走劇》打造影'
content: "新聞網址：\n\n影史最狂超燃系戰鬥動畫電影《BLOODY ESCAPE：地獄的逃走劇》，即將在5月17日於台灣\n震撼上映。本片透過被魔幻改造的東京作為舞台，描述一位原本是普通人，之後成為吸血\n\
  鬼，接著再透過人體實驗變成改造人的男子，為了拯救一位普通女孩，所展開的逃亡故事\n。本片交由曾執導《Code Geass 反叛的魯路修》系列，並以《航海王劇場版：紅髮歌姬\n\
  》斬獲超過200億日圓（約新台幣43.2億元）票房的老牌動畫導演谷口悟朗擔任原案、編\n劇與導演，甚至連五度榮獲艾美獎肯定的「多邊角動畫」（Polygon Pictures）都加盟本\n\
  片動畫製作，讓本片無疑是含金量頗高的動畫之作。尤其劇情透過「改造人vs.吸血鬼vs.\n黑道」的反烏托邦新穎題材，更是獲得日本觀眾一致肯定。導演也分享本片在新冠疫情嚴\n\
  峻的2022年開始製作，許多事情都變得困難重重，加上自己熱愛改造人與黑道題材，並融\n入吸血鬼這個海外觀眾都能理解的通用名詞，試圖讓本片更能獲得全球觀眾的喜愛。\n\
  \n《BLOODY ESCAPE：地獄的逃走劇》以反烏托邦題材，描述不久後的東京，人口已經達到\n顛峰，正開始走下坡，人類於是創造人工智慧來管理生態系統，以確保物種繁榮，甚至還\n\
  進行讓人類得以多樣化的人體實驗。片中，透過人體實驗成為改造人的男主角「如月」，\n正被以稱霸被分裂的東京為目標的不死吸血鬼集團「不滅騎士團」所追殺。此外，為了替\n\
  被殺害的老大復仇，就連黑道集團都加入這場追擊，演變成一場改造人vs.吸血鬼vs.黑道\n的腥風血雨之戰。全片最大看點，就是如月該如何憑藉身體改造而成的武器，和可殲滅吸\n\
  血鬼的特殊血液持續戰鬥，並帶領人類女孩逃離東京。逃亡過程驚險刺激，戰鬥場面目不\n暇給。\n\n本片更交由曾執導《航海王劇場版：紅髮歌姬》，以及《Code Geass\
  \ 反叛的魯路修》系\n列的日本老牌動畫導演谷口悟朗擔任原案、編劇與導演，並由曾打造過《哥吉拉：噬星者\n》與《亞人》等片，並被譽為「3D 動畫先驅」，甚至曾五度榮獲艾美獎肯定的「多邊角\n\
  動畫」擔任動畫製作，打造片中末日般的驚人視覺效果。多邊角動畫的3DCG也透過本片取\n得顯著進步，不僅充分發揮3DCG特性，更將充滿噱頭的戰鬥場面描繪得力量十足。這也讓\n\
  日本觀眾在觀賞後，紛紛大讚：「動作太給力了，如月太酷了！」「人和城市都被神奇改\n造的未來世界很有趣！」「逃亡故事被貫徹到底，是部很有力量的動畫！」\n\n入行邁入26年的導演谷口悟朗表示：「我們從\
  \ 2022年1月開始《BLOODY ESCAPE：地獄的\n逃走劇》的製作分鏡，7月錄音，之後才開始實際工作。」並透露大部分合作都是從2022\n年1月才陸續展開；也因為疫情流行的關係，許多工作都是透過線上完成。」他進一步透\n\
  露：「我真的很感謝能與多邊角動畫合作，雙方建立了在線製作系統。雖然無法將所有配\n音演員聚集在一起進行錄製，但他們還是盡可能地去紀錄演員之間的互動。如果他們不在\n\
  一起的話，這一切都會很麻煩，但我們設法以某種方式度過了難關。」\n\n對於以「改造人vs.吸血鬼vs.黑道」這個新穎劇情為題材，導演也表示：「我出生於1966\n\
  年，我們生活在特效英雄的鼎盛時期，所以改造人是個重要元素。我對吸血鬼其實沒什麼\n特殊情感，但他們不但在日本很受歡迎，在世界各地也都很流行。」海外觀眾可以普遍聽\n\
  懂，是最容易理解的通用名詞。至於黑道，我喜歡原創的黑道故事，所以透過吸血鬼為全\n球象徵，黑道是日本象徵，加上我個人所喜愛的改造人，於是成就出這部作品。」\n\n\
  史上最狂超燃系戰鬥動畫電影《BLOODY ESCAPE：地獄的逃走劇》，即將在5月17日於台灣\n震撼上映。欲知本片最新消息，請上電影官方臉書粉絲團與Instagram專頁查詢。\n\
  \n--\n                                 05/09 11:30"
