url: https://www.ptt.cc/bbs/movie/M.1699344300.A.EEF.html
title: '[情報]半夜不要看！【屍禁】最陰降頭預告'
content: '小心唸咒慘遭下降頭！

  震撼東南亞！見證真實最陰「鬼洗屍」嚇破8億鬼片冠軍 恐怖超越【薩滿】

  【屍禁】12/1 全台戲院驚嚇上映




  【屍禁】

  SEWU DINO

  上映日期：2023年12月1日（五）

  電影類型：恐怖 靈異


  監製：《KKN舞者村社區服務計劃》馬諾吉龐遮普（Manoj Punjabi）

  導演：《蜈蚣降》齊莫史坦波（Kimo Stamboel）

  演員：

  《血咒之術》咪卡譚巴勇（Mikha Tambayong）

  《勾魂秘林》里羅得萬托（Rio Dewanto）

  《坤蒂拉娜：重返秘林》卡琳娜蘇萬迪（Karina Suwandhi）

  《蜈蚣降》吉塞爾瑪菲爾曼夏（Gisellma Firmansyah）

  《4大殺手：重出江湖》馬提諾里歐（Marthino Lio）


  ★ 驚嚇飆破8億台幣，票房更勝《薩滿》《鬼搖靈》！

  ★  #今年最賣座恐怖冠軍 ，刷新影史票房冠軍團隊再創懼作！

  ★ 印尼年度現象級鬼片，狂吸5百萬觀眾大銀幕朝聖試膽！

  ★ 改編社群瘋傳真實靈異故事，重現東南亞古老最凶猛 #降頭咒！


  劇情簡介

  最陰鬼洗屍儀弒，破解最兇降頭咒

  席莉（咪卡譚巴勇 飾）經友人介紹下，到有錢人家應徵幫傭，女主人面試時一句「一旦

  接受就不能放棄」讓她困惑不已，但為了支付重病父親的醫療費，她接下了這份高薪的工

  作。當她和另兩名女傭被載至深山小屋，她們才明白真正工作，竟是替女主人遭下降頭的

  孫女妲拉驅邪，她們必須每日為死屍般的妲拉淨化身軀，一旦做滿千日將能破解降頭咒。

