title: '[新聞] 《屍禁》女子為高薪被騙去「鬼洗屍」，邪'
content: '防雷資訊頁


  防雷資訊頁


  防雷資訊頁










  防雷資訊頁


  防雷資訊頁


  防雷資訊頁


  新聞網址：


  《屍禁》女子為高薪被騙去「鬼洗屍」 邪門降頭嚇壞500萬人


  Yahoo奇摩娛樂 記者許瑞麟／綜合報導


  更新時間： 2023年10月31日 週二 下午2:03


  電影《屍禁》驚悚刻畫東南亞降頭咒，在印尼上映時，以8億台幣的驚人票房、狂吸500萬

  名觀眾，榮登2023年票房冠軍，刷新當地影史紀錄。本片改編自社群軟體X流傳的恐怖故

  事，女子為了高薪被騙去山上幫人「鬼洗屍」，貼文不僅在網路上瘋傳，登上印尼熱搜排

  行榜第一名，後續更受印尼最大的電影製作公司看中翻拍成電影。


  本片劇情描述，女主角席莉經友人介紹，到有錢人家應徵幫傭，女主人面試時一句「一旦

  接受就不能放棄」讓她困惑不已，但為了支付重病父親的醫療費，她接下了這高薪工作。

  當她和另兩名女傭被載至深山小屋，才明白真正的工作竟是替女主人遭下降頭的孫女妲拉

  驅邪，她們必須每日為死屍般的妲拉淨化身軀，一旦做滿千日將能破解降頭咒。


  預告中，可見擦澡過程怪事不斷，中邪女孩不僅會突如其來以鋸齒爆咬女傭手掌，瞬間鮮

  血直流，整個人還會抓狂般邪笑且不自然攀爬。本片由《蜈蚣降》、《虐殺人魔》印尼恐

  怖大師齊莫史坦波（Kimo Stamboel）執導，他當時一看到劇本就決定接下，直呼：「絕

  對沒看過的邪門降頭，絕對能夠被嚇到！」本片近期也入圍印尼媒體電影獎7項大獎，口

  碑票房雙收。


  《屍禁》將於12月1日在台上映。


  --'
