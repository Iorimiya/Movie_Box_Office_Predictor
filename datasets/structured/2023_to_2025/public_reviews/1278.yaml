url: https://www.ptt.cc/bbs/movie/M.1127450768.A.820.html
title: 活屍禁區：殭尸的美麗新世界
content: "一般來說，我對殭尸片的興致不高、也不認識喬治羅密歐。\n\n    日前耳聞喬治羅密歐喜愛將個人對權力關係、經濟結構與價值批判等理念嵌藏在電\n\
  \    影裡。對於這種帶點崇拜的解說型描述，我實在沒什麼感覺，畢竟我不會主動把黏\n    液外星人或殘暴活屍跟資本主義反思湊在一起—語言上的遊戲與直觀上的感受往往\n\
  \    是不一致的—一如我不會為了思索存在哲學而看【駭客任務】，吸引我的單純只是\n    挑戰地心引力的武打與爆破而已。\n\n    再說，雖然對殭尸電影不狂熱，但這類小成本次級驚悚電影早期本來就是約會專用\n\
  \    的產品，情侶開著中古敞篷車帶著爆米花與可樂遙望著隨風擺盪的露天銀幕，看到\n    一半就接吻擁抱抽插舔吮，在上位者的餘光掃到隔壁的車子，同樣微微地上下晃動\n\
  \    。\n\n    在我的想像中，殭尸電影的功能大概就是這樣。\n\n    帶著這樣的想像，我看了【活屍禁區】，當然我沒有敞篷車，沒有帶著能在殭尸嚎\n\
  \    叫下跟我親熱的女生，也沒有爆米花和可樂，倒是買了鹽穌雞和難喝的法國「天然\n    」橘子氣泡飲料—越強調自然的東西越是可疑—坐在半滿的東南亞戲院，前面是三\n\
  \    個看來單身的高中女生，後面則是擁著三十歲妙齡熟女的五十歲歐吉桑。\n\n    然後我覺得，認定喬治羅密歐把理念「嵌藏」在電影裡，真的僅僅是我個人的無謂\n\
  \    想像。他什麼都沒有藏，一切的主題就像天體營裡的性器官一樣地攤露在觀眾的眼\n    前。\n\n    雖然有著不知為何而生的活屍，但這依舊是個典型的、弱肉強食的現代社會。\n\
  \n    以考夫曼為首的綠洲社區，毫無疑問地直指當代美國的權力核心，考夫曼面色猙獰\n    地說「我們不跟恐怖份子談判！」、「他們沒有權利這麼做！」（原文為「They\n\
  \     don't have the right.」，銀幕翻譯為「他們太過分了！」，反而喪失了原意）\n    ，正是反映美國當局長年塑造的國際警察與民主法治形象。\n\
  \n    綠洲社區的奢華墮落，對應到邊緣居民的苟且生存，可直接投射至美國當代嚴重的\n    貧富差距；最終活屍突破圍牆、破壞綠洲大廈並殘殺其中居民，清楚地明喻著美國\n\
  \    以消費文化勉強支撐的體系可能遭致的不幸未來。\n\n    而以萊利與小丘為首的傭兵團隊，則像是與美國有微妙合作關係的共產主義集團，\n    有著軍事化的嚴謹結構，卻不斷在內部交流著資本主義的享樂形態，更有著處心積\n\
  \    慮想躍升至上流階層的投機份子，不惜代價地為自由社會道貌岸然的領導階層執行\n    著見不得人的邪惡勾當。\n\n    他們也像與美國反友為敵的中東舊同盟，日後以美國自製的武器對其造成威脅。死\n\
  \    神號一如美國的核彈，鞏固著美國的霸權、卻也不時衝撞著美國的存亡。與考夫曼\n    反目成仇的小丘，宛如帶著炭驅熱—這個美國也曾投資研究的破壞性武器—的破壞\n\
  \    份子，孤注一擲地為了生存挑戰著過往的衣食父母。\n\n    一樣被視為待除對象的萊利，則像是有著恐怖份子稱號、實際上真心堅持宗教道德\n    理想的殉道者，能夠為信念冒險犯難，心中真正希冀的，不過是靈魂的淨化與祥和\n\
  \    。恐怖份子，終究只是相對的道德標籤，不符合宰制集團利益的邊緣份子，往往不\n    自願地背負著如此污蔑的惡名，一如萊利。\n\n    至於以黑人為首的活屍集團，則象徵著被利用殆盡後被遺棄了的文盲、低收入戶與\n\
  \    老人的聯集，被社會主流視為非人的邪惡生物，以各種名義被壓制著排擠著甚至消\n    滅著，生存權在各種冠冕堂皇的私慾之下被踐踏殆盡。唯有活屍般的啟蒙反撲、無\n\
  \    產階級大革命似的覺悟，才能撼動光鮮亮麗卻無血無淚的邪惡資產階級。\n\n    當然，在社會學的真正專家眼裡，以上的論述可能只是賣弄術語的廢話、裝模作樣\n\
  \    的胡扯，僅是沒有實學的偽知識青年—根本就是我這種人嘛—觀影後班門弄斧的為\n    賦新辭強說愁。再說喬治羅密歐真的有心以結構化的方式創造活屍版的美麗新世界\n\
  \    嗎？天知道，我真的跟他不熟，只知道他確實想反映什麼，至於那是否遠多於他對\n    殭尸虐殺的興趣，就很難說了。\n\n    畢竟我不打算進電影院尋找啟示，喬治羅密歐或許是活死人電影的大師元老，一如\n\
  \    威廉佛雷金曾以【大法師】晉身名人殿堂，但去除朝聖的崇敬，這樣的東西真能在\n    二十一世紀帶給老觀眾什麼新感動嗎？恐怕還是看緣份吧，相較之下，我反而喜歡\n\
  \    【毀滅倒數二十八天】活力十足的鏡頭語言，即使就輩分來說，他可能只是小輩中\n    的小輩。\n\n    但，我絕不是在否定這部電影。實在說，我也算有盡興到，殭尸撕扯著人體的鏡頭\n\
  \    還不錯，我尤其喜愛小妞被扯下肚臍環的畫面，可惜沒有進一步被撕裂，女人在好\n    萊塢虐殺電影中似乎總被寬待著，就算直接慘死，通常也會遭致剪片，呈現被蹂躪\n\
  \    之事乃男人的主要責任，這不又是另一種男女雙重標準的迷思？\n\n    然而，何必想那麼多？要是能開著敞篷車、看到一半就在尖叫聲中做愛，該有多好\n\
  \    。這才是殭尸電影的真正神髓嘛！\n\n--\n\n            文字是迷途者在黑森林中唯一的慰藉。\n\n            我的網誌：\n\
  \n--\n◆ From: 163.29.153.141"
