url: https://www.ptt.cc/bbs/movie/M.1701600695.A.A74.html
title: '[負雷] 屍禁看到脾氣都失禁'
content: '太多bug，嚴重懷疑印尼票房灌水

  還是印尼沒看過真正的恐怖電影

  這真的令人滿頭問號



  前面舖陳太長，長到我都快睡著

  女主角都知道她要淨身的女孩是被下了降頭被鬼附身

  居然人家在喊她時，她還去跟鬼聊天順便交心，

  平常媽媽沒有教你不要跟陌生人說話嗎，

  更何況還是被鬼附身的人

  結果被鬼嚇到了吧


  接著女主角睡覺時會進入靈界

  她的僱主大老闆說只有她能跟被下降頭的女生做連結

  請求她進入靈界救回女孩的靈魂

  這裡突然就變英雄片，女角跟降頭師鬥毆

  然後帶著女生  靈魂一路跑向要回人界的路

  都到終點了也不跨過去，還在那裡等著鬼追來

  是多想跟鬼 打架，明明鬼追過來還有一段時間啊！！我一度還以為在看什麼美國B級恐怖片


  回到人間時又變成了溫馨家庭電影，大老闆跟被救回來的女生二人相擁而泣，從頭到尾我

  都只有被一開頭的音效嚇到，還有其他吐槽滿點的片段就不贅述了，總之真的很不推

  -----'
