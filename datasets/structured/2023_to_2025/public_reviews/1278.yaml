url: https://www.ptt.cc/bbs/movie/M.1702880398.A.F9D.html
title: '[負雷] 屍禁，沒甚麼恐怖感的恐怖片'
content: '雷文防雷資訊頁


  以下可能會有部分劇透，請各位謹慎觀看














  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  上週五跑去看了【屍禁】


  因為一開始是從媽佛版看到的翻譯文，而且頗受好評


  所以想說好不容易上映了，就去看一下


  但一開始我就分不清楚誰是誰了，三個女性角色長得太像


  然後裡面的嚇人情節，幾乎都是靠著音量、跟突然咬人、攻擊的那種方式來呈現


  這對於從小看鬼片看到長大的我，根本超~~~~~無感


  高中畢業我在百視達打工，一直到百視達倒閉，我幾乎天天都拿鬼片回家看


  基本上，屍禁的套路比較偏歐美類型的，一開始的氣氛也沒出來


  就是很平鋪直敘的在講一件事情，前30分鐘左右，大概我都看到有點恍神


  30分鐘之後，迎來第一個驚嚇點，但後面的驚嚇點其實都差不多了拉


  如果要以國片來做一個譬喻的話


  應該【紅衣小女孩1】比較適合


  屍禁就是前面大概是紅衣小女孩，然後更無聊5倍左右


  紅衣小女孩的前期至少氛圍感、詭異感都有稍微出來一點點


  但紅衣小女孩一開口說話，我就開始覺得變成搞笑片了


  因為裡面的魔神仔在叫人名字【何志偉】的時候，那個聲音跟蛋黃哥一模一樣


  忘記是在哪個時候，紅衣小女孩的音調突然變高變尖


  一開口我就跟隔壁跟我一起看的朋友直接笑翻




  ↑這是蛋黃哥貼圖語音，1分08秒那個最後一個貼圖


  聽起來根本也也是在叫【何志偉】


  然後講回屍禁的後半段


  後半段的鬼，就很動畫感，很像大法師裡面的鬼的妝容


  然後就是跳來跳去，咬來咬去，要血腥也沒有很血腥、要恐怖也不恐怖


  要說詭異感，也是完全感受不到，最後還想弄個懸念感


  說甚麼事情知道越多越怎樣怎樣的


  結果完全無感......


  然後整體的電影色調偏灰暗，很多細節都被弄得暗暗的


  導致很多地方根本看不太清楚重點，我是不知道為什麼鬼片都覺得弄得黑黑暗暗的


  就會讓觀眾感到恐怖，可能對一些不常看鬼片的人，會覺得可怕


  但對我們一直在看恐怖片的人來說，只覺得看起來會很吃力


  原本以為最後面的劇情會有大反轉之類的，但沒想到就這麼平凡的過去了QQ


  然後就是三個女生掛一個，其中一個是背叛者，但也不知道背叛的原因是甚麼？


  或許有演出來，但到後面我根本已經看到恍神＋杜菇了......


  我大概可以很肯定的跟大家說


  台灣從2015年到今年年底之前所有出的恐怖片


  幾乎都比屍禁好看，就連我覺得最無聊的　民雄鬼屋　跟　杏林醫院　這兩部


  我都寧願二刷，也不會再看屍禁


  不要說2015年，就連1990年的【鄭進一的鬼故事】，裡面的布袋戲的鬼故事


  都比這整部電影來的恐怖


  建議常看鬼片的人，想要感染恐怖氛圍的老鳥，可以不用去看了


  如果是鬼片新手，還會被音效、突然出現的鬼嚇到快失禁的，可以去看看


  然後如果想要看不同類型的恐怖片


  就去看泰國片


  幾乎都是前面恐怖，後面直接變成搞笑片了


  心得大概就是這樣，謝謝大家


  --


  我當初就是看他限制級，想說很厲害，才想去看


  後來完全不知道限制級在哪裡，我覺得 咒 的尺度 還比 屍禁 大


  結果才輔導級....



  只好改看伊藤潠二QQ


  杏林醫院贏在語言，我就算恍神或心不在焉，至少還可以聽懂在講甚麼


  *[1;37m推  12/18 15:21'
