url: https://www.ptt.cc/bbs/movie/M.1744562137.A.9E2.html
title: '[ 普好雷] 《有病才會喜歡你》用謊言堆的感情'
content: '無雷心得


  可以說是有種喜劇版的那些年我們一起追的女孩，只是稍微更成熟和加入一點浮誇漫畫式

  的風格，整部電影沒什麼太大瑕疵中規中矩，節奏不拖沓，其中最大亮點還是新生代演員

  的演技水準整齊，江齊、詹懷雲、黃冠智都相當亮眼，尤其是黃冠智是配角戲份但相當搶

  眼。


  —————————————————————-

  有雷

  .

  .

  .

  .

  .

  雖然從那些年之突然出現大量一些校園清新青春愛情片，但在近十年這類型的清新愛情片

  還是有逐年下降卻從不缺席，每年還是有固定兩到三部這種類型電影，但能脫穎而出玩出

  新意的並不多，我們觀眾也逐漸疲乏可想而知。所以有病我喜歡你要怎麼在討好觀眾又要

  不一樣的視角下功夫？


  既然台灣電影市場脫離不了青春愛情愛情片這命題，導演就從「有病與裝病」這件事玩弄

  視角，讓電影看似老套卻不落俗套帶來一些反轉與驚喜，我很喜歡電影前期用剪輯方式翻

  玩人稱和視角，達到伏筆和鋪陳效果，究竟是女主角的有病有破綻？還是男主角裝病有破

  綻？而電影用第三人稱視角讓我們逐漸揭開有有病的謊言，確實相當趣味。


  這類型電影劇情上不免俗的還是發生情愫角力，但命題上不只是純粹愛情議題還代入一些

  生死議題，可見編導還是有一些野心想讓故事不那麼簡單只是一部青春愛情片。而我也很

  喜歡電影玩弄台詞，把女主角的我其實才是喜歡你的，變成有病才喜歡你再配上音效的處

  理，讓一場唯美的告白戲變得意味深長，還有男主角前期不敢面對的以後，到後面慢慢解

  開心心結台詞時常出現「以後」的轉變，把同名同姓加入情節裡，以及「說一個謊就要用

  很多謊言來彌補」的台詞來點出電影的主旨。


  不得不讚賞電影啟用大量新生代演員的決定，尤其是在台灣電影市場這麼低迷狀況下實在

  不易，但也交出不錯的成績單完全沒有輸給裡面的實力前輩。詹懷雲把魅力結合頑皮的葉

  子傑撐起來還要不時帶著童年陰影，我想如果許光漢如果演那些年我們一起追的女孩真的

  會像這樣。初生之犢不畏虎的江齊，把面對感情矜持又生病的葉梓潔詮釋出色自然，尤其

  是把心裡期望走到以後的戲爆發出來。但最喜歡的還是黃冠智飾演搞怪無厘頭的死黨土豆

  ，雖然是配角卻展現相當強大的表演能量。


  可惜電影類型題材的選擇上讓電影的深度有限，配角的發揮功能空間不大，電影後面有點

  太濫用蒙太奇推進劇情和歌曲等等問題。但還是有被如同消失的情人節魔幻的水族館時空

  暫停，和千紙鶴的告白等鏡頭調度給觸動到。


  --'
