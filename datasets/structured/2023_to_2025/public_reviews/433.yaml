url: https://www.ptt.cc/bbs/movie/M.1757254357.A.07E.html
title: '[普雷] 有病才會喜歡你'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  剛看完

  覺得前面好看後面整個普掉


  前面男生裝有病女生裝沒病的校園青春愛情劇

  什麼都很剛好

  臺詞剛好 節奏剛好 演技剛好 角色剛好不會太多

  連女主角都清純可愛的剛剛好

  原本覺得要給十個讚


  但從後面鬼轉變狗血劇後整個崩掉

  二年級的有病眼鏡哥先領便當

  從這邊開始感覺想狗血但狗不動了


  後面不意外的換有病女主角復發

  原本兩個人剛剛好的演技要狗血時就不行了

  兩個人哭的有夠乾

  BGM也沒有把情緒推起來

  覺得可惜

  只能給普雷


  女主角江齊第一次看眼睛大大的有夠可愛

  還想說這可以當王淨接班人

  結果一查比王淨還大一歲= =




  --'
