  原本是不打算看這片


  是因為剛好時間趕不上本來想看的


  想說將就著看


  沒想到出乎意料的好看


  敘事結構完整


  又有一點點學生的稚嫩


  也有與時俱進用智慧型手機聯繫


  只能說片名取得不錯


