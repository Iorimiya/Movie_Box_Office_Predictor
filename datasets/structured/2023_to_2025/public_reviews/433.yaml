  沒錯這片我也有看


  也是出乎意料的讓人蠻愉快的


  雖然我現在還是不知道男主角演員名字


  但蠻明顯有捧他的感覺


  回到影片本身


  雖然劇情有點狗血有點老套


  但女主角氣質實在太過清新


  男主角也很帥又很痞


  以國片水準來說，應該是今年最棒的


  但沒什麼人討論


  整體很推薦大家去看！


  不然應該很快就下檔了


  -----

  Sent from JPTT on my iPhone


