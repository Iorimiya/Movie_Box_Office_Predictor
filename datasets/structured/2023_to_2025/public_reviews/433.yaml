title: '[討論] 有病才會喜歡你是不是有點猛？'
content: '如題

  今天連假第二天

  想說很久沒看電影了跑去電影院

  結果不知道要看什麼就看了台北票房觀測站

  看看最近什麼片賣的比較好

  結果看到這個國片

  有病才會喜歡你


  厲害了

  沒有一個演員聽過的

  看起來都是小咖

  唯一聽過的是導演許富翔

  因為是陳意涵的老公


  結果竟然賣破五千萬

  太強了吧

  這種卡司 賣個五百萬就差不多了

  一千萬就可以慶功了

  結果竟然五千萬？


  有病才會喜歡你是不是有點強？



  對了我最後看雷霆特攻隊





  --'
