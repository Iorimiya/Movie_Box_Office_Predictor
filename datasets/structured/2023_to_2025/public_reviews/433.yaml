title: '[負雷] 有病才會喜歡你'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  第一次分享觀後的心得

  若有違反規定或是排版不順請見諒



  想拍出學生校園的戀愛

  但塞進的要素過多，死爸媽、死好友、死女友

  每個死去的角色都讓我錯愕

  這部要是再延長個半小時不知道是不是土豆也會死


  想用爸媽的死帶出男主心靈上的不安

  但沒什麼太大的轉折在片中間就可以笑著侃侃而談（？

  好不容易與男二關係才好了起來，下一鏡頭就掛了（？

  然後與女主才第一次出遊，沒多久女主也掛了（？

  這主角怕不是姓柯吧？


  能理解導演想表達活在當下的想法

  但每條故事線來不及太好的描繪就收尾

  整部將近兩小時，但看完只覺得倉促


  然後也不少出戲的地方

  比如暗喻考到隔著台灣海峽的金門

  女主突然就出現在學校找男主

  這我還可以理解，但兩人騎摩托車晃了兩個鏡頭後

  下一幕突然就跳到潛水，還想說郵筒怎麼會在金門


  爸媽是個悲劇，但從頭到尾沒有著墨太多

  電影中與主角爸媽描述最多的就是那筆理賠金

  好像爸媽罹難只是為了帶出理賠金而已


  整部片平淡無奇，看片頭就可猜到片尾的類型

  沒有淚點，有的也只是很刻意拍出來的尷尬

  多餘的男二，多餘的阿姨，多餘的爸媽


  評價起來，這部片就像女主爸煮的粥


  --'
