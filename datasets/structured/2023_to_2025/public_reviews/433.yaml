content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\n\n\n\n\
  剛看完，覺得滿好看的\n\n台詞不會很尷尬，很像日常打屁聊天\n\n喜歡月老、我的少女時代、那些年，我們追的女孩的觀眾\n\n應該也會喜歡這部\n\n一些觀後感\n\
  \n1.看的時候覺得男主角有我的少女時代裡，王大陸玩世不恭的影子，\n\n  女主角眼睛很大，某些角度像王淨，難怪票房不錯?\n\n  男二喜劇十足也是一大亮點\n\
  \n2.主題曲方面\n\n  韋禮安-如果可以\n\n  田馥甄-小幸運\n\n  胡夏-那些年\n\n  這部電影的主題曲，告五人-我天生有病\n\n  沒有那麼爆紅的感覺\n\
  \n3.演主任的女演員-百白上過康熙\n\n  \n\n  是有錢人家的千金\n\n\n電影裡一些鏡頭很漂亮，海底潛水、告白的千紙鶴落下\n\n推薦!!\n\n\
