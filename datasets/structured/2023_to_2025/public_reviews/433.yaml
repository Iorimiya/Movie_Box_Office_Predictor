url: https://www.ptt.cc/bbs/movie/M.1743562155.A.54D.html
title: '[好無雷] 【有病才會喜歡你】喜歡你才會有病'
content: '本文無劇情劇透


  ‧


  在一場夜晚磅礡的大雨中，對於「未來以後」，一個渴望、一個不希望，兩片不同樹種的

  葉子，卻飄落在同樣的落雨之中。


  雖然依舊是部國片常見的校園青春愛情戲，但劇情流暢，演員的表演也出乎期待及水準，

  尤其是「葉子」江齊的笑容，扣住了觀眾不捨的心，在劇末對著葉子杰那抹微笑，既是堅

  強，也是一種落寞，但更是一場窗外映進藍天的開心笑容；而另外兩位男配角劉修甫與黃

  冠智，顏質不僅高，存在感完全不輸於男女主角；可惜詹懷雲不到出色的演出，但依然還

  是有把握住該有的角色演繹，雖然我認為在台灣國片中，還是只有柯震東，能把握住這樣

  情緒外放但內心薄弱的學生角色。



  ‧


  劇情十分的四平八穩，不會有太大的驚艷，也沒有太明顯的瑕疵，也是這樣平淡如水的節

  奏，才可以細細體會面臨生死離別的愛，是如此的揪心刺骨；整體的風格氛圍相當舒服，

  前半節奏相當快，但中段後的忽然小煞車，雖然會有點節奏不一，但就像在一場青春校園

  鬧劇後，突然開始彼此成長，能夠緩下心來靜靜聽故事，聽場子杰與梓潔的心靈對話。


  積極求生與消極過活，成為圍綁在兩人之間的紅線，男女之間的火花來得快，但對於子杰

  與梓潔來說，有些不是時候；我可以完全體會，病患對於未知的未來，格外小心翼翼，而

  也對毫無期待的未來，有著相同的共感；但子杰與梓潔在教室的隔壁座位上，卻找到了彼

  此的未來。



  ‧


  這邊要特別提到的是百白，有時從她個人社群中的字裡行間，發現她是有想法原則及深度

  的演員，但近幾年來，似乎都是接些詼諧角色，真心希望百白能夠有機會演出更多層次深

  度的角色。



  ‧


  對我而言，【有病才會喜歡你】是部能夠舒適觀影的一部電影，無論江齊的笑容、劉修甫

  與黃冠智的出色演出，乃至於讓大家都想當姨丈的林思宇，都是讓這部國片成為顏質度極

  高的校園電影。


  在一場夜晚磅礡的大雨中，我生了病


  生了一場只有喜歡你才會得的病


  那是種相思病



  ‧




  追蹤茶太郎IG



  --'
