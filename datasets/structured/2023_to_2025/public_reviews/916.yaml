url: https://www.ptt.cc/bbs/movie/M.1720334774.A.D35.html
title: '[負雷] 海關戰線'
content: "老婆超過五年沒進電影院看電影，好不容易有她感興趣的電影，\n還有張學友和吳鎮宇，沒想到卻是尷尬的開始!\n\n\n\n雷文防雷資訊頁\n\n\n\
  \n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n整部電影吐槽點太多，不知從何吐起...\n\n1.去非洲執行任務，被空襲時硬要謝霆鋒去救一個坐在路中央的小女孩?\n\
  \n2.歹徒去海關危險物品倉庫搶武器，一台飛機亂入居然沒被攔截或擊毀?\n  一個正常國家會有未經允許的飛行器在領空飛沒被攔截的嗎?\n\n3.激戰之後，海關掛了3個外加2個命危，然後還想自己主導解決事情?\n\
  \  忘了自己主要是查緝走私的海關不是特種作戰單位?\n  最扯的是長官還同意了???\n\n4.後面歹徒搶貨船，一台燕鷗式的貨車貨櫃門都開開的，裡面至少1X個歹徒拿槍，\n\
  \  碼頭人員還問:你們要幹嗎?不能隨便進去...然後就被幹掉了。\n  正常人看到1X把槍對著你不是舉雙手投降就是趕快跑吧???\n\n5.同4的場景，幹掉碼頭人員後，才說要留女主角當人質。\n\
  \  人質不是越多越好嗎?\n  怎麼幹掉碼頭人員後才想到要留女主角一個人質???\n\n6.潛水艇的門可以從外打開，哪謝霆鋒幹嘛爬進去?\n  坐門邊把門打開潛水艇就無法潛水，\n\
  \  看歹徒是要上來關門再把他拖出來打,還是等人來支援就好，\n  幹嘛冒險爬進去???\n\n7.最後的外國人說:為什麼要救我?謝霆鋒說: It's my duty...真的很尷尬!!!\n\
  \n\n總之，整部就是滿滿的吐槽點，還有很多看了很尷尬的地方。\n張學友沒好好的發揮到演技，吳鎮宇更是蜻蜓點水式的帶過而已，\n浪費兩個影帝級的實力!!!\n\n\
  --"
