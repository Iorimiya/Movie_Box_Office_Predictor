title: '[ 好雷]  海關戰線'
content: '我跟大肚子的老婆在馬來西亞旅遊

  因為天氣太熱大肚子的老婆也懶得走路

  於是在武吉免登電影院

  看了電影兩個人才台幣$210

  以下有雷











  沒想到大家都覺得是內鬼的人

  也許是刻板印象太重

  完全沒有人想到我們的學友大大居然是內鬼

  反倒是我問我老婆好不好看

  他說謝霆鋒就像跳蚤一樣，

  一直在那邊跳來跳去打也打不死

  根本就是一隻跳蚤

  癡情又變態的跳蚤

  分手一年零八天都記得一清二楚

  他這麼說，我好像也沒什麼可以反駁

  反正我覺得很好看電影本來就不太需要去講究太多細節主角演得好動作好看大場面這就是

  花錢的目的，不是嗎？

  總之女人就是不懂

  我覺得謝霆鋒可以當中國隊長了

  什麼跳蚤 我不想跟女人看電影了


  --'
