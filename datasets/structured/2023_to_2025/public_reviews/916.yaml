url: https://www.ptt.cc/bbs/movie/M.1720319785.A.09E.html
title: '[普雷] 海關戰線'
content: '很久沒有進電影院去特別看港片了


  會進場也是因為張學友。


  先說這片優點，基本上來說有槍戰，有大場面。


  最後張學友還有獻唱<很遠的地方>















  雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  身為一個張學友的粉絲，真的覺得可惜。


  我家學友怎麼可以當內鬼呢!!!!!


  這劇本整個就很失敗，我還一直在想會不會有大反轉，


  完全沒有反轉，張sir 就是內鬼。


  講白了一反轉，整個劇就活起來了...


  虧你把學友放在海報那麼大一幕


  虧你還在林嘉欣、吳鎮宇上面著墨，故作懸疑...





  這齣戲失敗的地方很明顯是想要增加偵探懸疑


  但是很明顯就失敗


  然後想要傳達不要戰爭，世界和平，但是突然莫名奇妙跑去非洲國家


  感覺就很硬要


  還有那個羅博士，我一直以為最後會現身的大BOSS，結果也沒有。


  最衰的應該就是泰國男警察，被抓走後，然後就沒戲分 免洗


  還有那個謝霆鋒的前女友，突然槍戰一波，然後就沒戲分 免洗




  最讓我出戲應該是最後的外國BOSS表示: 為什麼你要救我


  謝霆鋒說: It''s my duty


  整個尷尬癌發作...




  結論，不難看，但是學友是內鬼，我真的不行啊! 所以普雷!


  --


  反派嗎? 不太算


  算是被長官欺壓又不敢頂回去，只能用每個人有每個人的位置欺騙自己的人


  算是奢望跟另外一半安安靜靜過下半輩子的可憐仔


  怕被林嘉欣知道自己貪財，內心糾結悶出病的笨蛋QQ...'
