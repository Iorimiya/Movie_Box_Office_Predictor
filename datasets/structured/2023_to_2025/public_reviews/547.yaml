title: '[ 好雷］哈爾濱'
content: "雖然應該不會爆雷，但還是用玄彬來當一下防雷頁\n\n\n\n\n\n\n剛剛稍早去西門國賓看了電影「哈爾濱」的特映影人見面場，玄彬本人文質彬彬又謙遜有\n\
  禮，不論顏值或是身形都帥出天際，再加上溫柔的嗓音，真的覺得他能受到這麼多影迷的\n喜愛不是沒有道理！\n\n\n\n\n\n\n\n\n\n======防雷結束======\n\
  \n\n\n\n這部電影裡，不論是玄彬獨自穿越的大冰河或是空拍沙漠中騎馬，都是實景拍攝，用大螢\n幕看起來非常有感！電影裡的殺戮場景拍攝真實，劇情編排帶著一些轉折，值得期待！此\n\
  外，幾個主要角色的表現都很優秀，其中玄彬跟李棟旭完全跳脫出他們韓劇裡的樣子，演\n技大爆發！原本擔心看著玄彬的帥臉會一直看到”玄彬”本人而不是角色，尤其是在近距\n\
  離看完真人之後立刻接著看電影，一下子很難從看偶像的心情中抽離，但他精湛又真摯的\n演技讓我真的看到了那個為國家獨立而奮鬥、品格高潔的”安重根”將軍！(品格高潔這\n\
  個詞有出現在電影裡面，有看過電影就能體會為什麼這麼描述他）有幾場他詮釋痛失隊友\n的場景，真的深刻的感受到他巨大的悲傷與絕望！\n\n\n劇情整體還算流暢，個人覺得不錯，同行友人覺得可以再更好，但整體而言還是瑕不掩瑜\n\
  ！\n\n\n看完電影後，除了觀影的體驗外，還會對國家主權維護有更深刻的體會，尤其最後的暗殺\n行動帶出的震撼，值得大家進電影院感受！\n\n\n\n\n--\n\
  \ 01/16 02:21"
