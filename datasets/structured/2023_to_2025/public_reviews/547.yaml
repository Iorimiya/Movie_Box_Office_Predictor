url: https://www.ptt.cc/bbs/movie/M.1738334146.A.629.html
title: '[ 負雷]  哈爾濱-為了醋包了頓餃子'
content: '先講優點


  雪國場景拍攝風景很漂亮，剩下就沒了




  缺點會有雷，可以這時候跳出






  缺點


  這個故事是改編自刺殺伊藤博文的安重根，但刺殺就是10秒鐘的事情，編劇就開始往外編

  。


  第一幕的安重根帶領突襲日本哨所，本來以為會為整部片血腥程度定下基調，但讓人興奮

  就到這邊了，接下來就死一個同伴而已。


  整部應該說是諜報片，但全員降智嚴重，日本軍官兩句話離不開安重根，他這麼重要放間

  諜回去的時候為什麼不抓起來？


  玄彬整部戲就剩一張帥臉，剩下就沒了，毫無領導力感，最後還放過間諜，打仗啊～大哥

  ，你當大家去哈爾濱郊遊？


  很多人稱讚攝影，但我覺得玩過頭了，太多場景的陰暗一點意義都沒有，大段的舞台劇式

  的演出也沒有爆點，劇本太容易猜，人物都扁平化。


  最後刺殺的俯拍鏡頭一點意義都沒有，人群中都暗殺掉一個日本軍官，旁邊人當沒事一樣

  。


  總之就是太無聊了，上串流大概看不完第一幕那種。



  --'
