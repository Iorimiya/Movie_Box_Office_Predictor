url: https://www.ptt.cc/bbs/movie/M.1737563489.A.9F2.html
title: '[ 好無雷] 【哈爾濱】東風漸寒兮，壯士義烈'
content: '‧


  冰封的圖們河，孤獨的男人走起來特別步履維艱，就像這場韓國獨立運動一樣，充滿了荊

  天棘地的道路；這個男人被稱為亞洲義俠，也是位韓國獨立鬥士，他是安重根。


  全片改編至1909年「伊藤博文遇刺案」，3聲槍響加上羅列出伊藤博文的15罪狀，讓這一

  場驚天動地的暗殺事件，更影響加速日後的日韓合併計畫。



  ‧


  【哈爾濱】的音樂、攝影、美術、場景及服裝，堪稱極為優秀表現，無論是開場的冰封圖

  們河，或者是各種蒼茫雪景，乃至室內光影呈現，許多幕的場景，都擁有極高質感的存在

  ；本片絕對適合在能夠呈現細緻畫質的影廳中觀看，此次威秀在台中老虎城新改裝的泰坦

  廳，用極為細緻的畫質加上鮮明顏色呈現，用以開場一打上銀幕的冰封圖們河，完全能呈

  現【哈爾濱】的攝影及美術場景高水準表現。


  配樂在部份橋段也是極具磅礴及刺激，無論是開頭的戰爭戲，還是最後暗殺事件的劇情高

  潮，都將當下所有劇情氛圍感提至最高。


  而本片除了日韓彼此對抗的諜報戰外，堪稱雙方戰爭時尚的衣帽對抗，也是極為精彩，各

  式剪裁合身的生活防寒大衣，或是威風凜凜的挺拔軍大衣，穿著在每一位演員身上，都擁

  有極為英氣時尚的元素；尤其在劇情中段的列車諜報，幾乎所有人都身著的大衣及紳士、

  英倫帽，簡直時尚無限列車；而做為劇中唯一女性角色的全汝彬，一套黑色連身服飾，搭

  配精緻的韓國臉孔，也是相當吸睛。



  ‧


  【哈爾濱】的劇情節奏雖到中段緩慢下來，但基本上都為流暢，而除了開頭戰爭劇情外，

  其餘較少動作場面，多為推進暗殺劇情的任務橋段；透過沒有太專注在單一演員的手法，

  讓整體角色更可以發揮出以各自的角度看待安重根的好與壞、抉擇與失誤。


  而劇情結尾戲還是略微倉促，雖然在極強的配樂下， 讓那聲「大韓獨立萬歲」更為鏗鏘

  有力，但可惜劇情花了2/3在鋪陳，應該添加更多戲劇化的刺激性，讓前面所有的情緒、

  氛圍一股作氣大發洩在安重根槍口之上；劇情並沒有把安重根必殺伊藤博文的動機，完全

  對應史實15罪狀，雖為日韓情仇作品，但可能為了考量伊藤博文在日人心中是重要的君主

  立憲推手，不以電影劇情做出太多歷史評斷。


  不過全片最讓我在意的不是以上這些，而是劇情末段，玄彬戴上英倫帽加上鬍子，拍起來

  有夠像周杰倫。



  ‧


  【哈爾濱】是部標準的日韓情仇電影，除了劇本稍微偏淡外，各方面都有極具高水準的表

  現，挑選銀幕畫質好的影廳，絕對會大加分；雖然整體風格不符合春節的愉快氛圍，但做

  為一部歷史事件電影，是絕對推薦觀眾進場觀看。


  在那冰封圖門河上行走的安重根，看似孤獨，但心中卻隱含著救國的宏遠志願，只是沒料

  到這一槍之後，還得再36年，韓國才迎來了獨立日，也沒料到在10幾年後，發生了福田村

  事件以及殘忍的關東大屠殺。







  ‧


  「觀影的樂趣在於能獨自在那裡冥想一刻鐘」


  追蹤茶太郎IG




  --'
