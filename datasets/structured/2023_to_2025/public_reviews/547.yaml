url: https://www.ptt.cc/bbs/movie/M.1737862705.A.D8F.html
title: '[好雷] 實拍畫面就是讚的【哈爾濱】'
content: '因為朋友招待，提前先看了「哈爾濱」這部韓國年度話題大作。


  這部片講的是韓國追求獨立，1909年反抗軍中將安重根刺殺時任韓國統監伊藤博文


  的故事，製作規格很大，主要在拉脫維亞與蒙古拍攝，也有相當多的韓國大明星，


  雖然我不認得，但相信有不少的基本盤粉絲。導演禹民鎬之前的作品大多都是韓國


  政治與社會寫實片，這些類型的電影韓國真的很厲害，相當勇於自我批判，呈現也


  毫無顧忌。



  整部電影可以看的出來許多大場面都是實際拍攝而不是虛擬棚拍，尤其是在冰湖上與


  沙漠中的實拍景色相當驚人，實拍場面看起來就是震撼啊



  要將歷史事件改編成電影，能夠戲劇化吸引觀眾，也不能偏離史實，是相當有難度的


  一件事，這點「哈爾濱」做得相當不錯，像我對這段歷史完全不了解，在觀影的過程中


  也能夠隨著故事而理解並隨之心情起伏。只是我覺得韓國義軍的刺殺行動實在太衰了，


  當計畫接連受挫的時候只想說拜託你們去廟裡拜一下吧。




  觀影過程中，對於我這個臉盲來說有點困擾，因為我一向都是用造型來認人(髮型、


  服裝、鬍子)，但片中演員男的個個都留八字鬍，髮型略有不同，但都穿西裝戴帽子，


  每次畫面上超過兩個人就讓我心發慌，總是搞不清誰是誰，但是後來因為主角的夥伴


  陸續領便當人變少就比較沒問題，但這是我個人的因素就是了，多數人應該不會有


  這種困擾。




  壯闊的場景，震撼的大場面，加上眾多明星，容易理解的故事，雖然情節略顯沉重，


  但「哈爾濱」這片還是春節假期看電影的好選擇，記得要選大廳才能體會壯闊的


  大場面。


  --







  --'
