url: https://www.ptt.cc/bbs/movie/M.1738485024.A.976.html
title: 'Re: [ 負雷]  哈爾濱-為了醋包了頓餃子'
content: '只對這篇同感


  這部片感覺製作水平不錯，聲勢不小，

  原本算滿期待~殊不知...

  看似有模有樣，但無法被觸動。




  1.開頭戰爭血腥場面有點冗長

  要表達慘烈與負向情感不見得要把時間拉長


  2.主角徒有聖母殼，被說高尚品格

  但就是無法進入視角


  3.劇情節奏拖沓，好多時間在抽煙講話

  我們無法在那些對話感受到人物的立體性

  或是危機感、情感等


  4.每個人都相似裝扮，或許真實感就是要這樣

  但黑壓壓色調+戴帽子，人物不好分辨

  或是察覺他們的情緒。


  5.基於真實歷史改編，雖然結局已定，

  但或許可以靠劇本的展開去增加張力

  內鬼應該就是吧（？  但衝擊好小


  6.音樂下的時間太多，時機也有點不當


  ---


  這部片讓我想起某些電影

  比方說《355：諜影特工》

  預告看起來有模有樣，實際去感受

  卻是食之無味，都買票了就看下去吧..

  的感覺。


  對了，

  沙漠與冰雪的場景太刻意了，無感。



  --'
