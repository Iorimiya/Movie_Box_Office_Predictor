url: https://www.ptt.cc/bbs/movie/M.1738132705.A.38F.html
title: '[好雷]哈爾濱'
content: '早上去台北信義威秀看早場10:00哈爾濱,大概8:50才開門,網路寫8:00開門可能不一定正


  確,票價300元,去年看350元可能是非早場票.


  歷史背景大概始於1905年的乙巳條約,此條約將韓國變成日本的保護國.



  開局戰鬥應該是1908年朝鮮義兵在咸鏡北道與日軍進行戰鬥的地方,咸鏡北道在目前北韓


  最東北方的行政區.至於為什麼安重根要放過日軍俘虜,並不完全是要洗白安重根.因為安


  重根認為日本非法併吞大韓帝國,他率領的朝鮮義兵與日軍是交戰團體,故要遵守所謂的國


  際公法.



  至於什麼安重根要放過日軍某校級軍官,讓他變成抓安重根的宿敵,應該就是純粹的戲劇效


  果.1909年1月，安重根在俄羅斯煙秋與金起龍、姜順琦等人結成斷指同盟，血書的大韓獨


  立則確有其事,可惜筆者對俄羅斯地名不熟,無法查到俄羅斯煙秋在那邊了.



  之後就是重頭戲刺殺伊藤博文,本來想在大連刺殺,但被日軍看破,說啥裝扮不像一等車廂


  的人.靠,本片整體是陰暗色調,只有少數城市與野外風光比較亮,所有人都穿一個樣戴帽子


  ,然後你跟我說他們裝扮不像一等車廂的人,我聽你在放狗屁.



  於是安重根等人偷襲日軍,兩幫人在火車上扭打,安重根等人順利逃走,只有一人逃走失敗


  被日軍抓到,在毒氣室被嚴刑逼供下被迫反叛,恩這毒氣室拷問是我也受不了.


  安重根等人逃往海參崴,要找孔夫人去找某個前朝鮮義兵,後來改當馬賊的獨眼龍拿炸藥.



  因為最近疑似背部搬重物拉傷,側睡都會痛睡不好,跟獨眼龍拿炸藥那段對話睡了一下.


  大致上獨眼龍認為自己為了獨立戰爭搞到家破人亡,單眼失明不說,連剩下的那眼都快瞎了


  ,不過最後還是給騎馬四人組炸藥.


  註:騎馬四人組為安重根,日軍臥底,禹德淳,孔夫人,安重根與禹德淳真有其人.



  騎馬四人組拿到炸藥回海參崴,疑似被日軍臥底出賣,所以日軍與俄軍埋伏在海參崴基地外


  .諸人和日軍與俄軍激戰,那個一開始反對安重根放走日軍戰俘的人被抓壯烈犧牲.安重根


  與某人開始要抓內鬼玩無間道,謊稱不是在哈爾濱刺殺而是在蔡家溝刺殺,總算抓出日軍臥


  底.



  當然有所謂日軍臥底可能只是戲劇效果,實際上安重根等人是分批看南滿鐵路與東清鐵路


  (後稱中東路,所謂中東路事件就是在爭這條鐵路)中間有沒有機會下手,是有分站看有沒有


  機會提早暗殺伊藤博文.


  註:哈爾濱在南滿鐵路與東清鐵路交點,這是近代哈爾濱崛起的原因之一.




  上圖為南滿鐵路與東清鐵路大致路線圖.




  日軍臥底被派到蔡家溝,先前被放的日本軍官火大怒打日軍臥底,火速趕到哈爾濱但已經來


  不及.我一開始還以為是孔夫人出手殺先前被放的日本軍官,看來她殺的可能是日本軍官的


  部下.



  安重根刺殺後高喊大韓獨立萬歲的俄文,翻譯出來應該是Korea 烏拉,俄語烏拉有類似萬歲


  ,歌頌的含義.安重根之後被判絞刑,還以為電影到此結束,沒想到有一小段後續.在戶外某


  公園中,先前被放的日本軍官與日軍臥底對話如下:


  先前被放的日本軍官:要不是我救你你早死在大牢,禹德淳已經出獄說要殺你,我給你接近


  金九的新任務.


  日軍臥底:.................


  先前被放的日本軍官:我要你收下!


  先前被放的日本軍官:這個金九讓我們日本政府很困擾我要你接近他,還有安重根殘黨在哪


  ?


  日軍臥底:安重根殘黨在海參崴有報社掩護,還有安全基地.


  先前被放的日本軍官:安全基地在哪?



  結果日軍臥底爆氣,偷襲秒殺先前被放的日本軍官,前日軍臥底正式洗白XD.


  原來禹德淳本來要殺死日軍臥底,但安重根認為他也在掙扎,我們要再相信他一次.最後騎


  馬三人組離開,繼續為韓國獨立奮鬥.


  註:騎馬三人組為禹德淳,孔夫人,還有剛才洗白的前日軍臥底.



  無聊查金九只比安重根早出生三年,所以把金九與安重根當作是同一時代的人也是可以的.


  這個金九有活到抗戰勝利之後,與中華民國政府也有淵源,可惜被韓國右派暗殺.這個前日


  軍臥底洗白得不錯,勘比葉問一的李釗了.









  --

  不乳搖的胸部不能算胸部


  絕園的暴風雨第五集


  --'
