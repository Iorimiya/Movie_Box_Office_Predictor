title: '[新聞] 玄彬宣布來台宣傳《哈爾濱》！1月15日'
content: '新聞網址：





  玄彬宣布來台宣傳《哈爾濱》！1月15日、16日「與影迷同歡2天」


  記者陳雅蘭／綜合報導


  由玄彬、 朴正民、 趙祐鎭、 全余贇、朴勳、劉在明 、李棟旭主演的《哈爾濱》即將於

  1月29日在台上映，「網銀國際影視」今（30）日宣布重磅消息，導演禹民鎬將率領《哈

  爾濱》團隊包含主演玄彬及演員朴勳等人於1月15日、1月16日訪台宣傳，並出席影人見面

  特別場。


  「網銀國際影視」表示台灣是《哈爾濱》海外宣傳的亞洲首站，也是玄彬睽違5年再度來

  台，台灣影迷即將親眼目睹男神風采。導演禹民鎬率主演玄彬、朴正民、 趙祐鎭、 全余

  贇 、朴勳、劉在明 、李棟旭與台灣粉絲打招呼的驚喜影片也曝光，以中文一齊開心問候

  「大家好！」 玄彬更表示：「很高興聽到《哈爾濱》即將在台灣上映的好消息。」


  玄彬全力宣傳《哈爾濱》，不僅破天荒在韓國登上各個人氣節目，玄彬也將與朴勳、導演

  禹民鎬將來台與觀眾分享拍戲心得，並近距離與觀眾互動。首映《哈爾濱》 影人見面特

  別場資訊即將公布，詳細資訊請上WANIN Visual MOVIE官方粉絲團、WANIN Visual （網

  影）官方粉絲團查詢。


  《哈爾濱》故事介紹　推出獨家特典套票組


  《哈爾濱》故事敘述韓國獨立運動家安重根（玄彬 飾）率領獨立軍組織，在新亞山與日

  本軍隊的戰役中取得重大勝利。安重根遵守戰爭國際法，釋放日本戰俘，卻導致獨立軍內

  部出現分裂；時隔1年，獨立軍同伴重新集結，當他們得知日本政治家暨韓國首任日本統

  監伊藤博文即將前往滿洲與俄羅斯展開談判後，旋即決定前往哈爾濱進行暗殺任務，日軍

  獲得情報後追捕，不僅面臨敵人威脅，組織內部也暗藏危機，安重根面臨內憂外患的嚴峻

  考驗。


  「網銀國際影視」也宣布推出台灣獨家預售套票，典藏預售套票每組590元，內含獨家典

  藏的玄彬、李棟旭明信片5張以及2張電影預售票，即日起在博客來開賣。


