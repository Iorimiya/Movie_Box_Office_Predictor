title: 'Re: [情報] 動畫大師宮﨑駿經典作品【紅豬】9.4上映'
content: "紅豬的浪漫不是電影浪漫\n是宮崎駿的個人的浪漫\n當你看多了宮崎駿的電影\n當你看多了宮崎駿寫的書\n當你看多了別人討論宮崎駿的書\n(尤其是押井守訪談聊吉卜力八卦的那本)\n\
  \n你就會發現\n紅豬就是滿滿宮崎駿個人的物慾\n能夠這麼毫不掩飾的拍一部滿足自己物慾的電影\n紅豬大概就是這種浪漫XD\n\n很多導演或多或少都有所謂戀物癖\n\
  例如吳宇森總是要在電影中放入白鴿這類\n宮崎駿的物慾說穿了就是:飛機 反政府 未成年少女\n\n\n1.紅豬裡面的飛機\n\n只有主角波哥那架不是 那架是憑空想像的\n\
  但除此之外\n對手的飛機 空賊的飛機 義大利空軍的飛機 吉娜的飛機等等\n全部都是真實存在過的\n都是真實考究的\n光說到這些你就知道宮崎駿本人平常有多瘋飛機\n\
  所以當然紅豬內就要把飛機們\n放好放滿~~\n\n\n2.關於反政府\n宮崎駿的電影裡\n你會發現 \n天空之城裡面政府要去找天空之城 空賊是主角一群人\n魔法公主裡面\
  \ 政府派軍隊要去殺山神\n霍爾的移動城堡 霍爾整天就是在跟政府打仗\n甚至神隱少女 經營湯屋的湯婆婆其實也是一種政府\n只是化身成資本家\n\n紅豬當然也不例外\n\
  政府派人要去抓紅豬\n政府當然是反派\n\n宮崎駿以前被酸是共產主義者\n事實上真正來說是無政府主義者\n一天到晚就想推翻政府\n空賊山賊好棒\n政府好爛\n\n\
  \n3.關於未成年少女\n這被講很久了 宮老的電影女角幾乎都是未成年少女\n但在紅豬裡面\n菲兒不只是未成年而已\n\n沒錯 對大胸部的迷戀其實也是宮崎駿的僻好\n\
  風之谷裡面 女主角娜烏西卡其實也是大奶妹\n不過後來大概是不好意思過度展現自己的僻好\n所以他後來女角都平胸了\n但紅豬這部就不藏了\n他的菲兒就是個大奶妹\n\
  \n\n4.所以紅豬你可以發現就是宮崎駿嗜好的大集成\n滿滿歷史上出現過的帥氣飛機\n空賊是壞人但是很可愛\n政府好爛 戰爭沒意義\n美魔女痴痴的再等主角\n\
  大奶未成年少女還會偷親主角\n雖然波哥會去抓空賊\n大家都是打打鬧鬧世界和平\n沒有人受傷沒有人戰死\n\n電影不浪漫\n是宮崎駿自己滿滿的浪漫\n\n我覺得很多男生會對這部電影有強烈共鳴\n\
  是因為主角是隻又醜又肥的中年豬\n說穿了我們大部分男生都不是又高又帥\n看到又醜又肥的豬還可以同時被兩個女生喜歡\n又被大奶妹偷親\n實在太滿足了~~\n\n\
  對了片尾曲是久石讓改編加藤登紀子的歌\n這首常年就只有出現在紅豬電影原聲帶CD內\n以前加藤登紀子自己的CD沒有收錄過這首\n但最近幾年出的精選輯終於有收錄了\n\
  如果想在串流上聽這首片尾曲\n要搜尋加藤登紀子\n\n--\n同期的押井守 主角幾乎都是成年人好咩"
