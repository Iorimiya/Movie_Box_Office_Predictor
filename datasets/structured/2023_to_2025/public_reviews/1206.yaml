url: https://www.ptt.cc/bbs/movie/M.1758086464.A.C62.html
title: '[討論] 紅豬'
content: '最近特意去電影院看了紅豬，大螢幕看還是比電視強


  小時候第一次看紅豬就印象深刻，和魔法公主是宮崎駿系列中我最愛的兩部


  小時候喜歡紅豬，單純覺得紅豬怎麼可以活得這麼自由瀟灑，獨自隱居在無人島（從小就社

  恐，夢想住在深山野嶺）。


  最近剛好是要跨入四字頭的年紀，再看紅豬，回頭想想自己的經歷，發現原來紅豬不是小時

  候想像的那樣瀟灑、自由。


  看似瀟灑自由的荒島獨居，其實是自我逃避（療傷）的方法，逃避現實、友情、愛情。因為

  年少偉大的夢想，被現實重重打擊，尖銳的稜角被現實磨平，只想一個人躲起來，表面上裝

  作活得自由瀟灑，其實也是一種求關注的表現，或許有一天就這樣默默消失在世界上（死去

  ），會變成大家口中的傳說，朋友們之間永遠無法忘懷的記憶。（不會飛的豬，只能是一隻

  普通的豬）


  曾經經歷打擊和挫折，身上背負著許多自以為是的原罪、包袱，覺得自己無法再背負更多責

  任，面對錯過的機會，不敢再踏出一步去追求。


  菲兒的出現、美國佬的挑釁，重新激起紅豬曾經有過的夢想和熱血，讓他願意重新踏進現實

  社會，最後主動追尋那個雖然錯過，但卻一直都在的身影。


  回想自己當初踏入現在的工作領域，也是出自愛好，有對未來充滿了期待，覺得自己一定能

  有一番成就（充滿莫名的自信），但在行業內才能體會到的真實情況，真的是一步步的把熱

  情、信心消磨殆盡，不知道什麼時候起，想要做好事情的心情，已經變成可以交差對得起良

  心就好。


  碰到挫折的時候，真的就想把自己縮在一個無人的角落，自我療傷（內耗），睜開眼睛就想

  著，今天是不是應該要請個假。


  紅豬因為菲兒、美國佬，才能擁有最後的美好結局，然而現實中的我們是不是也差一個這樣

  的人、這樣的機遇，能夠重新找回年輕的熱血和勇氣。


  我想宮崎駿是不是當年也想用這部作品鼓勵自己，雖然在這樣的年紀，我們內心深處仍有那

  顆年輕的心，只是缺乏一個喚醒的契機。而那個機會只是還沒到來而已。


  --'
