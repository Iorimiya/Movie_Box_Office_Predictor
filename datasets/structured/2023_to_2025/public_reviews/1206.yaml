title: 'Re: [請益] 紅豬 到底在演啥啊'
content: '這部我也很喜歡


  如果解釋不對歡迎討論

  義大利語的豬 porco  空耳唸法波魯克


  最後菲兒說的波魯克沒出現

  我的解讀是 ：沒有豬樣了

  畢竟波魯克本名是馬可嘛～

  但知道馬可本名的人似乎不多

  連在秘密基地睡覺時的菲兒也不知道

  面前的波魯克就是他小時候聽到的床邊故事主角

  所以對菲兒來說馬可跟波魯克是不同人

  結尾的菲兒說波魯克沒再出現也能理解

  -------------------


  也是為什麼卡地士後面說：你的臉，讓我看看!


  -------------------

  結論:女人間的小秘密好可怕



  最後附上紅豬幾個不錯的台詞


  一、靠戰爭賺錢的是壞人，賺不到賞金的是無能


  二、不會飛的豬，就只是頭普通的豬


  三、那些死了的傢伙才是好人


  四、要變成法西斯我寧願變隻豬


  解讀的比較表面還請見諒



  -----

  Sent from JPTT on my Samsung SM-S9060.


  --'
