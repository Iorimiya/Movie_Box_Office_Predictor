content: "新聞網址：\n\n\n\n如果奇幻冒險是您的菜，我想彼得傑克森籌備多年後推出的Mortal Engines應該是\n值得期待的年末大作。\n\n\
  今天本片發表第二支預告，在這裡跟大家分享。\n\nHera Hilmar赫拉希爾馬飾演海絲特(Hester Shaw)\n\n\n導演：克利斯汀瑞佛斯\n  \
  \         (魔戒電影特效/美術製作團隊成員, 哈比人電影系列副導演)\n\n演員：\nHugo Weaving雨果威明(來自中古數碼世界)\nHera\
  \ Hilmar赫拉希爾馬(Da Vinci's Demons電視影集, 來自冰島)\nRobert Sheehan羅伯特席安(Geostorm氣象戰)\nJihae韓國創作歌手\
  \ 智海\nRonan Raftery羅南拉夫特瑞\n             (Fantastic Beasts and Where to Find Them,怪獸與牠們的產地)\n\
  Leila George蕾拉喬治\nPatrick Malahide派屈克馬拉海德 (Game of Thrones)\nStephen Lang史蒂芬朗(阿凡達)\n\
  \n編劇：法蘭華許Fran Walsh(魔戒, 哈比人)\n      菲利帕鮑恩斯Philippa Boyens(魔戒, 哈比人)\n      彼得傑克森Peter\
  \ Jackson(魔戒, 哈比人)\n\n配樂： Junkie XL\n\n原著：菲利普雷夫(Philip Reeve)\n\n製片：贊恩韋納（【哈比人】系列）、\n\
  \      亞曼達沃克（【哈比人】系列）、\n      黛博拉佛特（【怪物遊戲】）、\n      法蘭華許和\n      彼得傑克森\n\n執行製片：肯卡敏斯（【哈比人】系列）、菲利帕鮑恩斯\n\
  \n大災難摧毀了人類文明，數千年後，人類終於適應並找到自己的生存之道。裝載巨輪的\n移動城市橫行地球，無情併吞彼此，弱肉強食。\n\n提姆（羅伯特席安 飾）移動城倫敦的見習生，自從遇見危險的逃犯海絲特\n\
  （赫拉希爾馬 飾），他就一直為生存而戰。\n\n截然不同的兩個人，本來不會有任何交集，沒想到竟然結為盟友，共同改變人類的未來。\n\n紅豬(指!)\n\n\n\
  移動城市：致命引擎 Mortal Engines\n上映日期：2018年12月7日\n\n\n\n--"
