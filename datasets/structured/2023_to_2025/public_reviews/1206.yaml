title: '[請益] 紅豬 卡地斯疑問'
content: "昨天下午衝了紅豬的重映\n\n為了換海報刷了兩張票，這也是男人的浪漫…吧\n \n\n很小的時候看過一次，當時對劇情沒有什麼共鳴，只覺得最後肉搏拳擊賽很好笑，但其實那\n\
  架紅色帥氣的飛行艇早已深深烙印在我腦海而不自知，所以長大後買機車汽車我都挑紅色的\nXD\n\n\n有一個問題我想請教，\n\n就是片中可愛又迷人的對手-卡地斯\n\
  \ \n\n在很顯眼的左胸口上一直有著荷蘭國旗，\n\n但他在片中並未提到與荷蘭的淵源？\n\n只有反覆提到他是美國人、以及最開始有提到他的1/4義大利血統\n\
  \n請問他胸口上的荷蘭國旗有什麼用意嗎？\n\n謝謝\n\n\n步入三、四十歲後的男人都該重新踏入電影院享受這部作品，真的是用享受來形容。\n----\nSent\
  \ from  on my iPhone 13 Pro Max\n\n--"
