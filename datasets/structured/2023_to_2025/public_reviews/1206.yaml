title: '[  雷] 紅豬'
content: '防雷



















































  「會飛的豬豬」乍聽之下很可愛

  但在宮崎駿底下的每個特色都沒有簡單過

  看起來所向無敵的紅豬也有自己的難題

  意即意氣風發底下的自我障礙

  身分的認同、耽擱了愛人、不能輸的壓力

  “一頭豬如果不能飛便一無是處”

  這句台詞精準點出了他的困境

  也能嗅出一種失意的fu,很像中年男子會有的

  （然後不知道為什麼剛出社會的我這麼感同身受

  後面各飛行員往空中飛去真的很壯觀

  也帶出了宮崎駿招牌的反戰理念

  這部電影是真的挺有意思的

  跟印象中幼齡向的宮崎駿動畫不一樣

  大人世界的元素這次都不怎麼藏

  當然充斥著打打殺殺的設定還是有好好處理

  於是既卡通又不隱諱的成人世界就這樣被呈現了

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  你在明天將變成蛇，於是便會開始吃人，

  你吃人的那張嘴依然說還愛著我，

  而我真的能像今天一樣，說出自己還愛著你嗎？


  --'
