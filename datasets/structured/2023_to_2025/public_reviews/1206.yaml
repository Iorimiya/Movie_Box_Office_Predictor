title: '[新聞] 宮崎駿電影《紅豬》將在中國上映 '
content: "宮崎駿電影《紅豬》將在中國上映\n\n宮崎駿於1992年執導的動畫電影《紅豬》官宣，將於11月17日於中國全國藝聯專線上映。\n 《紅豬》改編自宮崎駿漫畫《飛行艇時代》，被網友譽為最像宮崎駿自傳的作品之一，\n\
  豆瓣評分為8.6分，IMDb7.7分。\n\n《紅豬》講述了講述了王牌飛行員羅森的故事。 打擊空中搶匪的羅森被施了魔法變了一\n頭豬，匪徒們為了對付羅森，請來了超級飛行員卡基斯。\
  \ 卡基斯在對決中將羅森擊落，\n羅森將飛機送修時，遇上了朋友比克羅的孫女菲歐，菲歐幫羅森修好了飛機，兩人一起翱\n翔藍天對付空中劫匪。 這時卡基斯出現了並對菲歐一見鍾情，他向羅森提出決鬥，於是\n\
  兩人再次浴血藍空。\n\n\n\n--"
