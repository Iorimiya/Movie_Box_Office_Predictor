url: https://www.ptt.cc/bbs/movie/M.1757326859.A.379.html
title: '[  好雷] 紅豬'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  久聞《紅豬》是宮崎駿最具反戰思維的作品，但一直沒有機會在家完整看過。這次剛好搶

  到威秀特別場的票，還附海報，當然要衝一波 XD


  劇情講述一位豬頭人身的飛行員——波魯克的故事。片中女性角色的比重很高，尤其在修

  理飛行艇時，一整排工人幾乎全是女性，讓人看到戰爭時期女性不容忽視的後援力量。雖

  然主題是反戰，但片中還是藏著許多對戰爭的觀察：人們不是泡在酒吧，就是參加沒有實

  質意義的比賽，荒誕又帶點無奈。


  故事開場，波魯克在海灘午睡時接到委託，要去打擊空中海盜。比較出乎意料的是，人質

  似乎並不害怕，甚至有點像是自願跟著空賊。最後波魯克擊落飛行艇，也沒有趕盡殺絕，

  只帶回人質就放過他們了。這些情節更像一場鬧劇，而不是生死搏殺，雙方都在其中各取

  所需。


  整部作品裡幾乎沒有真正血腥的打殺畫面，只有在回憶中稍微出現過。大多數地方都以詼

  諧幽默的方式處理，但依然能感受到戰爭對人們的深刻影響。波魯克甚至寧願化為豬，不

  願以人的身份存在(反對法西斯主義)；然而無論外表如何，飛行依舊是他的驕傲和信念，

  也是他生命中最重要的支柱。


  兩位女主角都很鮮明：一個青春大膽，一個成熟內斂，各自用不同方式表達對波魯克的情

  感。雖然劇情沒有給出明確的答案，但在戰爭氛圍下，這樣的溫柔情感更顯得珍貴。尤其

  是片中吉娜因為丈夫是飛行員而多次喪偶，更凸顯戰爭的悲劇：活下來的人未必更幸福，

  反而要承受更沉重的痛苦。所以她一再提醒波魯克要珍惜生命，遠離危險。


  最後不得不說，宮崎駿的畫工真的頂。這部片比我還年長，但畫面水準一點也不輸現代作

  品。無論是空中飛行場景還是街景細節，都美得令人讚嘆。不同於《波妞》的夢幻之美，

  《紅豬》展現的是偏向現實的美感，帶來一種踏實又浪漫的觀影體驗。

  也聽聞劇中的片段多數都是採取寫實的，服裝跟一些場景設計都是，更加令人感到驚嘆啊

  ，真希望有一款遊戲可以使用這種背景畫風，肯定會很棒~



  整體來說，這真的是一場很棒的觀影經驗，不僅看到反戰的思考，也感受到人生的惋惜與

  溫柔，後面也暗示了波魯克已經恢復人形態了也是令人開心，終於解開了自己的詛咒，我

  想他的詛咒也就是戰爭之下摯友死去，只剩下自己獨自存活下所否定的自己吧!


  --'
