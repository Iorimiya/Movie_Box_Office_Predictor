url: https://www.ptt.cc/bbs/movie/M.1753076204.A.A3E.html
title: '[情報] 動畫大師宮﨑駿經典作品【紅豬】9.4上映'
content: "「一起熱血飛行，這才叫帥！！」\n動畫大師宮﨑駿經典作品【紅豬】9.4翱翔天際!\n\n終於要起飛啦\n電影預告 \n\n\n電影介紹\n日本動畫大師宮﨑駿執導經典之作，一生必看吉卜力動畫大銀幕磅礡登場\n\
  \n飛行艇冒險追逐，深具傳奇色彩的人物描繪令人目不暇給\n\n吉卜力最具成熟魅力代表作，寫給大人觀眾的一封空中情書\n\n日本上映票房大賣54億日圓，榮登當年日本電影票房榜冠軍\n\
  \n繼《魔女宅急便》後，再度刷新日本動畫電影票房新高\n\n知名電影網站爛番茄96分高分好評，入選百大最佳日本動畫電影\n\n殿堂級音樂大師久石讓打造磅礡熱血配樂\n\
  \n榮獲安錫國際動畫影展「長篇電影獎」、日刊體育電影大獎「石原裕次郎獎」\n\n劇情簡介\n一起熱血飛行，這才叫帥！\n1920年代，地中海地區航行的船隻經常遭受駕駛飛行艇的空賊集團打劫財物，而他們的剋\n\
  星，就是駕駛一艘紅色飛行艇、以追捕「空賊」賺取賞金的飛行員波魯克，這個由於不明\n原因被魔法變成豬的男人，大家都稱他為「紅豬」。「空賊」中的曼馬由特隊被波魯克打\n\
  得抱頭鼠竄、顏面盡失，因此決定找來美國的飛行好手對付波魯克，兩人將進行一場以榮\n耀、女人和金錢為賭注的空中對決…。\n\n--"
