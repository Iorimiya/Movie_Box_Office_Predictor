url: https://www.ptt.cc/bbs/movie/M.1661135338.A.8DA.html
title: 'Re: [請益] 紅豬 到底在演啥啊'
content: '一個有故事的中年飛行員，

  雲淡風清的過著他的日子，

  誰知來自美國的另外一個飛行員，非要跟他較勁不可，

  於是在這個中年發展任務開始時，

  他選擇了跟他PK，可能為了面子也可能不為什麼。



  生命中的兩個重要女人，

  一個有著與馬可複雜的情愫---也代表馬可情感上無法再前進的「退縮」，

  一個是青春無敵想做就做的年輕女孩---也代表馬可當時最欠缺的「發展」，


  馬可有故事，但故事其實還沒有終結，

  電影的結局比開放式更有無限想像空間，

  但生命就像是飛機一樣，不是損壞了，就是繼續飛翔，

  馬可的朋友往著更高處飛走了，

  而他的飛機在修護中找到救贖，以及在人世間的停留。



  我喜歡這部電影給人的悵然，也喜歡這部電影的所有配樂，

  其實也很想說，

  這部電影的中文配音也是吸引我的一部份，

  楊少文的馬可國語對白，恰如其份的帥氣，

  與他當演員時幾乎都是丑角居多的形象落差極多。


  以上。


  --'
