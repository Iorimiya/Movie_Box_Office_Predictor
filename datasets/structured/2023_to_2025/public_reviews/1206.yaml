url: https://www.ptt.cc/bbs/movie/M.1756991520.A.570.html
title: '[新聞] 2025才第一次看《紅豬》！阿夫笑喊：有這'
content: '新聞網址：


  2025才第一次看《紅豬》！阿夫笑喊：有這麼荒唐？


  2025/09/02 20:24


  〔記者鍾志均／台北報導〕宮﨑駿經典鉅作《紅豬》將重返大銀幕，今（2）在台北松仁

  威秀首映，邀請曾服役4年半、因軍旅實境節目走紅的「魔鬼班長」雲朵與搭檔阿夫擔任

  熱血飛行嘉賓；阿夫戴上飛行帽與墨鏡角色扮「紅豬」，自嘲膚色較黑，比較像「山豬」

  。



  阿夫（左）、雲朵扮《紅豬》經典角色出席首映。（甲上提供）


  雲朵則綁馬尾cosplay天才飛機設計師「菲兒」，表示對《紅豬》中王牌飛行員波魯克的

  人生故事相當有感：「《紅豬》真的很特別，他表面帥氣瀟灑，但其實內心孤單又堅持，

  反差感讓我超感動。」


  現場兩人重現軍旅節目的經典橋段，雲朵口令一出，原本態度很chill的阿夫瞬間繃緊神

  經，完成新兵點名、稍息、立正、向後轉等動作，阿夫更因運動受傷帶傷上陣，仍精準過

  關贏得滿場觀眾喝采。


  《紅豬》當年在日本以54億日幣（約台幣11億元）的亮眼佳績榮登年度日本票房冠軍，繼

  《魔女宅急便》後，再度刷新日本動畫電影票房新高；全片充滿著宮﨑駿最熱愛的戰鬥機

  、反戰等自傳色彩以及浪漫、愛情、夢想等吸睛元素，被影迷譽為「大人系動畫的極致」

  。


  今晚是阿夫首度朝聖《紅豬》這部電影，他笑說：「2025才第一次看《紅豬》，有這麼荒

  唐的事？」雲朵聽說今晚首映會有特別從日本來的觀眾，推薦說：「這是一部很適合大人

  看的電影，看完之後會獲得新的人生方向。」



  阿夫、雲朵出席《紅豬》首映，和全場觀眾大合照。（甲上提供）


  此外，片商邀請金獎設計師方序中與藝術家董十行再度聯手打造，以湛藍海面襯托經典紅

  色飛行艇，透過打凸工藝展現立體感，並暗藏隱形飛機群等細節彩蛋。


  全球限量僅5萬張的A2尺寸特典海報，凡於上映首周（9／4至9／11）至全台戲院購買兩張

  《紅豬》電影票，就有機會獲得A2尺寸限量特典海報一張，資訊請追蹤甲上娛樂粉絲團；

  《紅豬》將於9月4日起全台上映。





  --'
