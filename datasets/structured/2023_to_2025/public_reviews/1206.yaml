url: https://www.ptt.cc/bbs/movie/M.1661133066.A.C69.html
title: 'Re: [請益] 紅豬 到底在演啥啊'
content: '一些八卦

  基本上你多看很多跟吉卜力有關的書就會看到這些八卦



  1.紅豬是第一部在台上映的宮崎駿電影

  之前都沒有上映過

  那時候是我媽帶我和我弟去電影院看這部



  2.電影片尾那首超經典主題曲

  是久石讓重新編曲的版本

  這首之前在串流沒有

  當時只能買CD或黑膠唱片才聽得到


  不過剛剛找了一下發現終於上了XD

  是這首



  3.在日本動畫界業內

  紅豬評價很差

  尤其宮崎駿身邊的人幾乎都很討厭這部

  如果多看一些討論宮崎駿的書都有提到這些八卦

  像是有人直接對宮崎駿說:

  拜託不要再拍這種電影

  你如果有中年危機了話

  回家自己看書就好了!


  快笑死XDDDDDDDDDDD



  4.押井守有次問他女兒想要甚麼生日禮物

  女兒回答 想要紅豬的賽璐珞片!

  押井守非常不可置信

  然後自己覺得很丟臉的跑去找吉卜力 要了紅豬的賽璐珞片



  --

  是拍完才被念啦XDDDD

  大家覺得你為什麼不繼續拍龍貓這類給小孩看的電影?

  你如果要拍給自己看的 那你回家自己看書就好啦XD

  宮老也有聽進去啦

  所以後來拍了神隱少女


  不過最後一部 風起

  其實又有點回到 給自己看的味道

  那時候已經很大了 應該是國高中生

  我剛剛又找了一下

  發現真的有上了

  不過要在加藤登紀子的精選輯裡面找

  真感動o.O

  因為之前的作品拍得太好

  風之谷 天空之城 龍貓 魔女宅急便

  大家喜歡宮崎駿這類 拍給小孩看 拍給年輕人看的電影

  所以對紅豬這部

  宮崎駿拍給自己看得

  當時圈內人不以為然居多'
