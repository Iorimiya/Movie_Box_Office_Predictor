title: '[好雷] 【我推的孩子】電影版'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  改編自同名漫畫的電視動畫《我推的孩子》在2023年掀起轟動，除了推出第二季之外，也

  改編為真人版電視劇與電影，甚至連片中的舞台劇都真實演出。雖說去年底完結的原作結

  局讓粉絲哀鴻遍野，但作為電視劇版大結局的電影版，不但還算成功處理本來為人詬病的

  結局，角色還原度也非常高，對於系列影迷來說，值得一看。



  任職偏遠醫院的婦產科醫生雨宮吾郎，是超人氣偶像星野愛的忠實粉絲，沒想到小愛某天

  竟現身在他面前看診，吾郎更驚訝得知小愛懷了一對雙胞胎，讓他下定決心要好好守護小

  愛的孩子。以為自己已經死亡的吾郎，赫然發現自己意外轉生成小愛生下的雙胞胎兄妹中

  的阿奎亞。



  即便現在電腦特效發達，除非故事設定在架空的宇宙，不然真人實拍總是有其侷限，但動

  漫與動畫則能夠天馬行空地滿足作者所有的想像。不過，這也讓不少改編為真人版的作品

  陷入虛實切換無法平衡的問題，所以大家才會常戲稱作品「慘遭真人化」。但是，有鑑於

  《我推的孩子》漫畫結局實在讓粉絲太失望，反而稱這部作品「慘遭漫畫化」。幸好，電

  影版從段落的選擇到角色的還原度，都讓觀眾回到看電視動畫的感動。



  為了照顧對故事背景不熟悉的影迷，《【我推的孩子】電影版》前半段，快速演繹電視動

  畫第一集90分鐘的轉生前情節，接著以蒙太奇快速轉場的方式帶過主角兄妹在演藝圈的經

  歷，直接進入主題「復仇」橋段。由於真人版電視劇並未提及轉生前的故事，而目前已推

  出的電視動畫與電視劇涵蓋到「終幕將至」前，因此只要看過其他改編作品，演藝圈的故

  事都不會太陌生，以單集電影來說，這樣的呈現方式還算平衡。



  角色還原度方面，粉絲最期待的想必是星野家的「星星眼」，如果單純利用電腦特效讓露

  比與阿奎亞如電視動畫一般眼睛隨時閃耀著星星，對於觀看真人版的觀眾來說會極為出戲

  ，所以，只在關鍵時刻讓他們的眼睛發出亮光，不僅兼顧現實感，也保留原作在此的奇幻

  設定。選角上，電影版延續電視劇的演員，造型設定也在保留現實感的前提下，讓看過其

  他改編作品的觀眾一眼便能認出角色，不論是導演、經紀公司社長，還是偶像團體的樣貌

  都很鮮明。



  除了現實生活中復刻無法達到同樣效果的黑川茜藍髮與愛的紫髮之外，電影版的角色特徵

  與電視動畫如出一轍，就連有馬佳奈的紅髮都以流露出些許紅色的亞洲人自然髮色為主。

  可是，茅島水樹飾演的黑川茜，在電影版裡相對不苟言笑，給人一種冰山美人的冷艷感，

  與電視動畫裡帶點憂鬱的青春洋溢有點差別。至於事前保密到家的神木輝，則是由看起來

  相當無害的二宮和也飾演，他在片中一臉天真，滿不在乎地說著狠話的角色演繹，真的讓

  人恨得牙癢癢。



  「在這個世界，謊言就是武器。」



  電影一開始是與電視動畫一樣的獨白，解釋著謊言在這個世界上的威力有多大，而在演藝

  圈更是如此。如果說，《我推的孩子》的中心主旨就是「謊言」，那在漫畫版結局讓人看

  不出意義何在的安排，電影版都為大家解答。就像當年劉德華與朱麗蒨密戀將近20年，才

  得以公布，身為「偶像」，說「愛」粉絲當然不是謊話，但他們又怎麼會真的「愛」粉絲

  呢？為了這些私生飯可能會有的可怕行徑，偶像們只好編織一個又一個的謊言，包裝自己

  的完美形象。阿奎亞這些年來沒說出口的計畫，又何嘗不是一種善意的謊言呢？



  「我整個人都是用謊言堆砌而成的，但『我愛你們』絕對不是謊言。」



  在《我推的孩子》中，謊言的相反並不是真話，而是「愛」。要說這是為什麼作者要把主

  角的名字設定為「愛」也好，總之，這才是隱藏在謊言背後真正的中心主旨。電影版明白

  演出愛的童年是如何缺乏愛，飽受母親虐待，並被送進孤兒院，因此才懂得利用謊言獲得

  喜愛。渴望被愛與愛人的她，在遇到神木輝之後意外懷孕，雖然愛為了不讓已被演藝圈侵

  蝕的他承受更沉重的負擔而說謊離開對方，但從相戀到生下雙胞胎，已經讓愛體會被愛與

  愛人，所以她在死前才終於有辦法將對孩子的愛說出口。



  「我是為了復仇才轉生的。」



  對吾郎醫生來說，轉生成小孩的他沒能在狂粉來襲時保護好愛，變成他轉生前後最大的遺

  憾。加上從前世帶來的能力與記憶，從小就有辦法開始計畫一系列的復仇計畫。調查過程

  中，也曾經誤以為真凶生父已逝而決定開始好好度過自己的新人生，沒想到最後還是走上

  玉石俱焚的復仇之路。電影版最後告訴大家要「活在當下」，彷彿是打臉觀眾一路走來期

  待真相大白的心。雖說大家最後還是知道真凶生父是誰，但如同阿奎亞所說，露比想要原

  諒對方，而愛則想要拯救他，阿奎亞心裡應該覺得自己到底是為誰辛苦為誰忙吧。不過，

  這既已是原作的設定，電影版至少有改掉粉絲最討厭的「自傷」情節，還算可以接受囉。



  其實，《我推的孩子》受歡迎的主要原因，除了動漫常見的復仇與轉生情節之外，也是因

  為其以演藝圈為主的複雜情節與新穎題材。雖然電影版快速帶過兄妹倆在演藝圈打滾求生

  的段落，但光是描述《15年的謊言》就從前製期的選角、製作會議、找預算、演員準備到

  拍攝期間演員軋其他工作的疲累，甚至後期的剪接、宣傳特映，都搬上大銀幕給大家看。



  就連讓年輕的神木輝黑化的關鍵也是由於被年長的女演員性侵導致，情節裡透露很多演藝

  圈潛規則。攤開「27俱樂部」的成員名單，其中不乏毒品、酒精濫用或自殺，而即使不是

  在27歲殞落，也不乏無法承受演藝圈的鎂光燈與壓力而選擇提早離開人生舞台者。或許就

  像《我推的孩子》裡所說，表演與演唱技巧是一回事，成為偶像是需要天分的。



  總的來說，《【我推的孩子】電影版》在製作上是一部十分精緻嚴謹的電影，也彌補系列

  粉絲對於爛尾的遺憾。但是，主角兄妹轉生後的段落，突然出現一堆沒有交代前因後果與

  姓名的角色，對於任何系列改編都沒看過的觀眾來說，應該會無法理解角色間的關係，更

  遑論在第一時間就確實掌握誰是誰而不會錯過劇情的推進。至於只追電視動畫的影迷，跳

  過漫畫與電視劇直接看電影版的大結局，是會被徹底暴雷的喔！


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
