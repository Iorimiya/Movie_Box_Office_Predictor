url: https://www.ptt.cc/bbs/movie/M.1736856258.A.369.html
title: '[新聞] 【我推的孩子】電影版原著激讚品質掛保證'
content: '新聞網址：



  轟動全球人氣動漫改編的《【我推的孩子】電影版》，即將以真人化邁向故事最終章，並

  將在本週五（1/17）於全台正式上映。本作透過人氣漫畫家赤坂明的故事，加上橫槍萌果

  的作畫，以深入刻劃的角色交織，以及刺激又感動兼具的故事，深深吸引全球讀者，至今

  累積的漫畫銷量已經勇破2000萬冊。不過要將現象級爆紅漫畫改編成真人電影，誓必要面

  對四面八方的不同意見。就連原著作者赤坂明聽聞要真人化時，都不禁對演員跟劇組產生

  「真的沒問題嗎」的質疑，不過當他觀賞完本片之後，也放心地掛保證：「無論是劇本還

  是演技，大家都把這些當成是自己的一部分去做。很感謝作品從構成階段就讓我們進行確

  認，讓我能真切感受到劇組對原著的尊重。」而橫槍萌果更是對喜歡原著的粉絲們背書：

  「我比任何人都滿意，我覺得這次的真人化是非常精彩的還原！」





  《【我推的孩子】》不只漫畫火紅，就連2023年推出動畫版也引發廣大迴響。製作人井元

  隆佑表示，他深深被赤坂明故事裡那些令人印象深刻的台詞，以及橫槍萌果筆下那些完美

  散發角色內心光芒的作畫所吸引，從故事一開始就用極度衝擊的展開緊抓讀者的心，讓他

  永遠都無法忘記首次看到漫畫時的衝擊。而這次推出真人化的《【我推的孩子】電影版》

  ，讓赤坂明回憶當初收到改編提案時：「我認為這部作品並不會有被拍攝成真人版的一天

  ，在這樣的情況下，當聽聞要拍攝真人版時，我不禁對所有演出的演員跟劇組產生「真的

  沒問題嗎」的質疑。對於接受這份挑戰的人們，我的感謝無以言表。」



  然而當他觀賞完本片之後，所有質疑也都煙消雲散，並大力稱讚：「無論是劇本還是演技

  ，大家都把這些當成是自己的一部分去做。很感謝劇組從構成階段就讓我們進行確認，我

  能真切感受到劇組對原著的尊重。真人作品中的台詞和漫畫中的台詞有所不同，漫畫台詞

  不一定能直接搬到真人電影當中，但如果我修改一下，它又會變得太像漫畫了，所以我覺

  得這未必是正確的做法。片中有句台詞是『只能相信並交給他了』，讓我感覺這部作品，

  確實是以尊重原著的態度來進行創作，所以我也能以尊重的心態去選擇相信。」他更進一

  步表示：「透過演藝圈人們的視角，我認為真人版的這部電影，有了更多的真實感。我希

  望觀眾們都能從作品中，感受到這些當事人內心的呼喊與掙扎。」





  不僅如此，擔任《【我推的孩子】》作畫的橫槍萌果，看完本片後也開心表示：「非常有

  趣，我覺得自己想表達的主題都得到了適切的傳達，並很好地表現出來，這讓我非常開心

  。」據悉，由於橫槍專注在連載漫畫的作畫部分，因此真人版的監修大多由赤坂明負責，

  這也讓橫槍能以一種「完全新鮮」的心態來觀賞這部電影：「《【我推的孩子】》也有描

  繪一些『寫實的黑暗』，讓我有些擔心這些是否適合真人化。我也曾想過，自己的畫風和

  角色設計或許並不那麼適合真人化，尤其是髮型和服裝的重現，應該都會很困難，但最終

  發現這些擔心完全是多餘的，服裝和背景都被精緻地還原，這讓我非常滿意。畫畫時，常

  會因為時間不夠，無法畫出自己理想中的服裝，但製作團隊這次成功補強了這些不足。當

  時我也和服裝設計師溝通過，成果真的完全符合我當初的設想！」



  最後，橫槍也對原著粉絲們背書：「我比任何人都要滿意，我覺得這次的真人化是非常精

  彩的還原。看完真人版後，我終於能以局外人的角度，重新去看待這個故事，並感受到『

  這部作品真是有趣』、『我真的很喜歡』。在我無法親自完成的細節上，透過很多人的努

  力，讓作品的完成度有了大幅提升。如果大家能從不同的角度享受這個故事，我相信你們

  對角色的愛也會更加深厚。」尤其已經觀賞完本片的日本觀眾，也紛紛對本片的精良製作

  提出讚美：「成功的真人漫改典範！」「我無法掩飾對電影高水準的驚訝！」「完美的真

  人化！我被它的製作精良給震撼到了！」「真的是超越原著！」「從每個角落都感受到演

  員和工作人員的真愛！」



  這部轟動全球現象級作品，改編真人版登上大銀幕的《【我推的孩子】電影版》，即將在

  本週五（1/17）於全台盛大上映。台灣發行商也推出「第一週戲院入場特典」，只要在各

  影城開放販售日起，購買本片第一週（1/17-1/23）期間場次電影票乙張，即贈送「電影

  主視覺A3中文海報」乙張。本片劇情描述任職偏遠醫院的婦產科醫生雨宮吾郎（成田凌飾

  演），是超人氣偶像星野愛（齋藤飛鳥）的忠實粉絲，沒想到小愛某天竟現身在他面前看

  診，吾郎更驚訝得知小愛懷了一對雙胞胎，讓他下定決心要好好守護小愛的孩子。然而，

  吾郎卻在小愛預產期準備分娩當天，被人推下懸崖殺害。以為自己已經死亡的吾郎，赫然

  發現自己意外轉生成小愛生下的雙胞胎兄妹中的阿奎亞（櫻井海音飾演）。不明原因成為

  偶像之子的他，原以為從此可以跟小愛與妹妹露比（齊藤渚飾演）過著幸福快樂的生活，

  沒想到某天卻再度出現變故，讓阿奎亞決定展開復仇並找出兇手…。此時，一部以小愛為

  主角，並奠基在她人生故事改編的電影《15年的謊言》即將開拍，也讓阿奎亞的復仇齒輪

  再度轉動…。



