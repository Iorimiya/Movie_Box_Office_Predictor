title: '[新聞] 【我推的孩子】電影版B小町唱進夯播節目!'
content: '新聞網址：



  轟動全球人氣動漫改編的《【我推的孩子】電影版》，即將在明年1月17日於全台盛大上

  映。本片除了由齋藤飛鳥飾演傳奇偶像團體「B小町」當中，有「永恆C位」之稱的「小愛

  」，更匯聚了齊藤渚、原菜乃華以及人氣女歌手ano共組「新生代B小町」，以強大陣容讓

  網友紛紛讚譽是「神選角」，完美呈現出原著角色的魅力。三位女星不僅在片中以精湛演

  技大放異彩，更大膽挑戰歌舞表演，展現出強大的舞台實力，尤其一場演唱會表演，更是

  讓觀眾讚不絕口，甚至被譽為「全片最精彩的部分」，網友並直言：「光是看那場演唱會

  ，就值得買票！」三人更將電影中的歌曲帶入現實，以片中角色及團體身份，身著夢幻全

  白打歌服，參與上週五（12/27）在日本播出的歌唱節目「Music Station SUPER LIVE

  2024」，現場演唱主打歌〈SHINING SONG〉，出色表現更是備受各界盛讚。不僅如此，本

  片也融合偶像文化與動漫情節的精髓，無論是演技、歌舞，還是角色塑造，都讓人期待不

  已，絕對是影迷與動漫迷的年度必看之作！





  讓全世界為之瘋狂的現象級作品《【我推的孩子】》，終於以真人化電影登上大銀幕。本

  片故事描述由櫻井海音飾演的男主角「阿奎亞」，意外轉生成自己喜愛的傳奇偶像「小愛

  」的小孩，並為了找出殺害小愛的真兇，與妹妹「露比」一同踏入演藝圈；而露比也追循

  著小愛身影，組成新生代女團「B小町」。至於飾演露比的齊藤渚，本身就有偶像團體「

  =LOVE」的經驗，在2023年初從「=LOVE」畢業之前，她參與演出的電視劇《明天，我會成

  為誰的女友》也獲得極大迴響，讓她身為演員的評價水漲船高。據悉，劇組希望她能充分

  發揮在偶像時期所培育的所有經驗，加上她本身天真浪漫的個性，無疑跟原著中的角色神

  似，所以對她發出邀約。在片中飾演她哥哥「阿奎亞」的櫻井海音也表示：「她就像照耀

  了拍攝現場的太陽一般。」本來就是原著粉絲的齊藤，表示飾演露比一直是她的夢想，她

  也投入超越常人般的情感，演繹出向夢想不斷進行的身姿，讓她說道：「這是一部讓我有

  很多全新體驗的作品。」



  除了齊藤渚，新生代「B小町」另外兩位成員「有馬加奈」與「MEM CYO」，也由童星出身

  、曾為動畫電影《鈴芽之旅》女主角配音的原菜乃華，以及跨足多重領域的人氣歌手ano

  分飾。對於以「演技」為重的有馬佳奈，劇組一開始就決定要起用實力派年輕演員，所以

  向演藝經歷宛如角色一般的原菜乃華提出邀約。至於在選角時不清楚演技實力的ano，劇

  組也看出「她就有如MEM CYO一般，是個影響力與說服力並存的藝人」而讓她雀屏中選。

  開拍之後，ano的舉手投足都充分展現MEM CYO的人格魅力，甚至是劇組公開卡司陣容後，

  ano第一時間就是被網友們欽點「最佳神還原」的演員，也足見她的魅力。





  畢竟要在《【我推的孩子】電影版》中合組偶像團體，讓齊藤渚、原菜乃華、ano除了飆

  演技，更要在演唱會上唱歌跳舞。當談到三人所演唱的歌曲時，齊藤渚表示：「我喜歡所

  有歌曲，但我們三人最喜歡的還是主打歌〈SHINING SONG〉。」原菜乃華也說：「其實，

  從拍攝出道現場到畢業現場，距離拍攝只有一星期時間，但這首歌讓人聽著聽著就感動落

  淚，好像我們也經歷過一樣。」至於另一首演唱曲目〈Twilight〉，ano也回憶：「記得

  拍攝MV那天，天氣很冷，當時我們三人才剛認識，所以交流得並不多，但我們很快就成為

  好朋友。」



  值得一提的是，三人不僅在片中演出，甚至還以角色身份來到現實生活當中，以 B 小町

  身份參與上週五（12/27）播出的「Music Station SUPER LIVE 2024」。她們先是以充滿

  活力的原創歌曲〈我們是完全無敵的偶像！！〉開頭，接著熱唱主打歌〈SHINING SONG〉

  。對於難得的現場表演，齊藤渚表示：「扮演B小町真是太有趣了！我還是很緊張！我幾

  乎要哭了！」原菜乃華也說：「沒想到能在如此精彩的舞台…！這是我一生中最緊張的一

  次表演，我的手腳都在發抖！這是最美好的回憶！感謝大家對B小町的支持！！」至於本

  身就是歌手的ano，不僅要以自己的歌手身份參與演出，更要「分身」以本片角色加入B小

  町演出，她對此表示：「能以B小町的MEM CYO身份自信地享受表演，真的很高興，如果是

  我自己的話，應該無法做到那樣的表情和舞台呈現，所以我非常尊敬並喜愛B小町，服裝

  也非常具有偶像感！」而三人的精采表現，也獲得現場跟網友們的滿堂彩，紛紛大讚：「

  實在是太可愛了！」「真是最無敵的偶像！」



  這部轟動全球現象級作品，改編真人版登上大銀幕的《【我推的孩子】電影版》，即將在

  明年1月17日於全台盛大上映。本片劇情描述任職偏遠醫院的婦產科醫生雨宮吾郎（成田

  凌飾演），是超人氣偶像星野愛（齋藤飛鳥）的忠實粉絲，沒想到小愛某天竟現身在他面

  前看診，吾郎更驚訝得知小愛懷了一對雙胞胎，讓他下定決心要好好守護小愛的孩子。然

  而，吾郎卻在小愛預產期準備分娩當天，被人推下懸崖殺害。以為自己已經死亡的吾郎，

  赫然發現自己意外轉生成小愛生下的雙胞胎兄妹中的阿奎亞（櫻井海音飾演）。不明原因

  成為偶像之子的他，原以為從此可以跟小愛與妹妹露比（齊藤渚飾演）過著幸福快樂的生

  活，沒想到某天卻再度出現變故，讓阿奎亞決定展開復仇並找出兇手…。此時，一部以小

  愛為主角，並奠基在她人生故事改編的電影《15年的謊言》即將開拍，也讓阿奎亞的復仇

  齒輪再度轉動…。



