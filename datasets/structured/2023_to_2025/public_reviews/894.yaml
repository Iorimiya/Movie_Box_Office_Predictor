url: https://www.ptt.cc/bbs/movie/M.1722923667.A.49F.html
title: '[好雷] 驀然回首'
content: '雷文防雷資訊頁


  這部的迴響蠻大的防雷應該不用太多吧



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  我算是半個藤本樹的粉絲


  鏈鋸人之後的作品包括短篇都有買(炎拳等哪天心情來了就會看了 吧)


  會突然發病的風格就不多說了


  我最喜歡的是藤本樹對角色的表情描繪


  浮誇的臉部表情跟臥蠶下睫毛讓他筆下的角色真的很生動


  電影剛開始不久藤野看到京本畫技時吃驚的表情就讓我覺得


  「這就是藤本樹的作品」


  (反觀某天才的文青寫實風)


  劇情方面


  因為已經看過漫畫所以在中後段那邊倒是還好不會到忍不住眼淚的程度


  最讓我想哭的一幕反而是藤野京本出去玩


  京本在電車上跟藤野說還好今天有出來


  一直以來對這種情節都招架不太住


  不過這幕吸了點鼻涕後後面就還好


  這點就要提到聲優的表現


  我一直以來蠻不喜歡動畫電影找非專業聲優的


  大概是看過的動畫電影如果找非專業聲優


  感覺都很像在念稿


  不過這部兩位主角的聲優我覺得都配得很好


  整體來說很自然不會過於浮誇


  也不會讓人覺得生硬


  另外不知道有多少比例的觀眾是看過藤本樹的作品的


  不過如果是粉絲進場觀看的話還能看到一些小彩蛋蠻有趣的


  包括鯊魚人封面跟內容基本上就是鏈鋸人


  電影中的內容就像是在預告蕾潔篇一樣


  另外還有一幕是爆炸的場景


  我一開始以為是鏈鋸人op


  後來想想感覺更像是再見繪梨最後一幕的場景


  喔喔喔超興奮的


  因為單純以漫畫來說我更愛再見繪梨


  以驀然回首的成績來看


  應該可以相當期待再見繪梨也做成動畫吧


  哇苦哇苦


  --'
