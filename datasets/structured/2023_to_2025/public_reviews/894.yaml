title: '[好雷] 驀然回首的小彩蛋'
content: '剛剛看完電影，有發現一些彩蛋，覺得製作組很用心。


  1. 藤野被刺激到後開始買書瘋狂練習時，有一張圖    面好像有龍珠的悟空，那個髮型太好認了。



  2. 再來就是有一幕在藤野房間牆上有貼一張電影 蝴蝶效應 的海報：




  簡單提一下這部電影，他跟驀然回首很相似，也是主角回到過去的某個時間點做不一樣的選擇試著改變未來的結果，這部電影蠻推薦的，而且還有兩個不同結局的版本。


  3. 最後就是藤野的單行本封面，那個配色還有每一本封面的角色，根本就是鏈鋸人嘛XD

  有看到真紀真、帕瓦跟早川。



  不知道還有沒有什麼其他彩蛋可以一起討論

  -----

