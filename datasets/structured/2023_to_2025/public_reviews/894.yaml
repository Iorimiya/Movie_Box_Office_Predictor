url: https://www.ptt.cc/bbs/movie/M.1766307229.A.64F.html
title: '[情報] 【驀然回首】前導預告'
content: "「坎城名導」是枝裕和ｘ「漫畫鬼才」藤本樹《#驀然回首》超特報預告公開｜2026年 全\n台大銀幕上映\n\n\n《驀然回首》真人版電影，依是枝導演的要求，整部電影以底片拍攝，於2025年2月到4月\n\
  及5月拍攝了冬天．春天的部分；7月拍攝了夏天的場景；11月則是秋天的部分，歷時近一\n年於四季中實景拍攝。\n\n\n音樂則由曾經手電視劇《大豆田永久子與三個前夫》和動畫《怪獸8號》等影像作品之配樂\n\
  、歌手米津玄師和宇多田光歌曲的音樂家—#坂東祐大 負責。\n\n\n《驀然回首》\n2026年 全台大銀幕上映\n\n《小偷家族》《怪物》是枝裕和導演 自編自導最新作品\n\
  改編自《鏈鋸人》漫畫家藤本樹同名動人原作\n「坎城金棕櫚獎導演」是枝裕和ｘ「漫畫鬼才」藤本樹 眾所矚目夢幻合作\n全片於原作作者藤本樹故鄉秋田縣仁賀市取景拍攝\n\
  \n一心以成為漫畫家為目標的兩位少女——藤野、京本之間青春動人的故事。\n\n\n\n\n\n\n--\n                          \
  \        12/21 18:01"
