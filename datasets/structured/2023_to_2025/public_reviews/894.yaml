url: https://www.ptt.cc/bbs/movie/M.1723038318.A.249.html
title: '[有雷] 驀然回首'
content: '雷文防雷資訊頁


  他們倆個在彼此眼裡都是最珍貴的那個人，純粹且單純的看到對方的美好


  直接而且毫無掩飾的看到內心最真誠的話語，即便想要掩飾或者迴避


  說出再多違心論，都被真摯且熱切的眼神看透


  都無法排拒那直擊內心的希冀，這種關係一輩子只要一個就足夠







  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  先說在前面，我好喜歡好喜歡那段田埂路。走過無數次的田埂路


  熟悉到不用看著路面走的田埂路，這段路幾乎是他們兩個的一切


  無論是快樂還是分離，無論是未來還是永恆




  毫無疑問的，藤野是個天才


  簡單的筆觸就可以輕鬆抓住別人的目光，有趣對他來說是信手捻來的想法


  他的天才不純粹是在繪畫，繪畫只是讓他展現天才的手段。


  但小學生看到的是他會畫，他很棒。京本畫得更好，所以京本更棒


  京本，是個努力的人。他用盡全力，近乎所有的時間全部投入繪畫，因為恐懼


  這是他唯一能做可以做也會做的事情。


  京本的天賦是看到這個世界的真實與美好，繪畫也是她展現天賦的手段


  藤野羨慕京本，就像是一個人用相較不擅長的那一面去競爭用盡全力在那項技能的人


  而他渴望的是那個被看到的自己努力的一切。


  他期待著一個可以真真切切看到自己的人，跟自己往前走。


  京本羨慕藤野，因為他看到自己近乎一輩子永遠也不可能擁有的天賦在自己眼前


  閃閃發光。然後對方居然看到自己，帶著自己一起走。


  他們很幸運的可以看到彼此，他們很幸運的可以碰到彼此。


  這段時光是藤野數一數二幸福時刻


  當然絕對是京本人生中最幸福的時光


  因為一切的美好都是藤野帶給他的，各種挑戰和各種新鮮的事物


  各種夢想跟著藤野的腳步一點點一點點的實現，走到了幾乎心目中最憧憬的那個目標


  但京本知道自己不行了，用盡力氣奔馳的自己快要跟不上對方邁開往前的腳步


  一種恐懼，不是害怕被拋下，也不是害怕對方看不到自己


  而是害怕自己會成為累贅，越往前走越覺得不足。越往前走越覺得羞愧


  他需要更厲害，他需要補足藤野的需求。所以他需要更有力量


  京本的離開不是為了自己而是為了藤野...



  這成為一切痛苦的根源：沒有京本的世界藤野的努力還有價值嗎?



  那個平行世界建構出來的是，京本最終也會前去念大學。


  不是為了藤野，是為了他自己。最終兩人再次遇到，走上同樣的路




  這個妄想希望是真實的，這個妄想希望是存在的


  但這個妄想兩人看不到彼此、看不到未來、看不到夢想、犧牲了藤野一部分的快樂


  也犧牲了京本這輩子所有經歷過最美好的事物...


  如果用對方所有一切的美好，換取對方現在還在自己眼前


  我想京本的答案是：不可能



  所以藤野，只能和京本一起走下去。揹著京本的夢想和最美好的一切走下去


  因為只有他看的到京本、知道京本、理解京本。能夠讓他永遠的存活在自己生活和作品裡



  那個情緒沒辦法哭，沒辦法笑。那個努力永遠都有價值，因為努力了他才會活著


  京本才能活著，永永遠遠的活著



  藤野有多努力，那個活在自己心中的京本就能在大家面前活得多燦爛


  這一刻的京本才真正屬於藤野，這一秒他們兩個才成為了一體




  而我覺得一開始兩個人本來就是獨立的


  先不說藤野還是繼續往前奔馳，京本就算沒有藤野。還是能夠繼續往前走


  還是會繼續走到這個位置，沒有屬於或者不屬於的問題


  而是因為喜歡希望嚮往所以兩個人走到了同一個位置往前進


  藤野希望有人能夠看到那個真實的自己，而不是自己表現出來臭屁違心的表象


  京本希望那個閃閃發光的天賦可以繼續發光發熱，因為他知道那是珍貴的


  即便沒有自己在旁邊他也會繼續發光發熱。


  但實際上，藤野不能沒有京本。因為沒有了京本她就走不到這個位置


  京本可以沒有藤野，但京本這輩子都不會希望沒有藤野


  因為兩個人在一起，所以才有現在珍貴的彼此


  --'
