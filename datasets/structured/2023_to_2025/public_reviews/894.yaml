content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《驀然回首》好雷觀後感：利刃是溫柔\n\
  \n1. 我都忘記創作是多麼孤獨的事情了，藤野跟京本相知的友誼非常珍貴。\n\n2. 畫工是一般讀者比較好分辨的部分，所以同學才覺得京本勝出。其實一個攻於角色和\n\
  個性，一個有耐心細膩雕琢，同樣拿著畫筆，完全不同的專長。\n\n3. 藤野決定放棄的那一刻，我看到的是進步，藤野看到的是差距。為了追上京本，她已\n經走得離起點很遠了，可惜她當時沒有發現。\n\
  \n\n4.「畫漫畫有什麼用？」\n\n當作者展開 if 線，讓大家知道：\n\n早在她小學連載漫畫的開始，她就成為京本的指路人。\n\n這與放不放棄、厲不厲害完全無關。\n\
  \n「還有番要追」是許多粉絲活下去的動力，所言不假。京本會持續看著藤野，無關乎是否\n在她身旁。（當然看她們一起畫畫更催淚）\n\n\n\n5. 配樂絕對的MVP，光聽配樂就可以開始哭了。\n\
