url: https://www.ptt.cc/bbs/movie/M.1723278463.A.7CF.html
title: '[負雷] 驀然回首'
content: '上禮拜看到朋友群組在那裏誇驀然回首多好看

  一堆人在電影院看到哭


  想說好像真的很神，就跟風去搶了今天泰坦廳特別場

  感覺也是按下去就買到票了

  想說不是應該很熱門嗎，心裡當下就覺得不太妙了


  後來進電影院，一開始的四格漫畫動畫

  說真的蠻尷尬的，有點無聊當有趣的感覺


  又看了一陣子

  看到老師要女主角拿畢業證書去給藤野

  我白眼就都快翻到後腦勺了

  一個都不去學校上學的人，可以拿畢業證書?

  哇靠當去上學的都傻子是不是?

  背景是多硬阿???


  然後升上國中，也不用去上學

  每天就窩在女主角的房間畫畫，一起吃一起睡

  女主角的爸媽是都沒有意見嗎?

  就算女主角的爸媽沒意見

  藤野的爸媽看到小孩每天不在家，應該也有意見吧

  這個人設完全跟現實脫勾的太遠了


  看著看著忍不住就睡著了，結果睡沒多久燈就亮了

  哇靠這電影才不到一小時喔

  不到一小時，收我700塊，多送兩張紙和一些壓克力片

  是把觀眾都當盤子嗎??


  總之不是很推，有要跟風的可以參考一下

  省一筆錢去看死特與金剛狠比較值得一點，起碼片長長很多

  可以睡得比較飽


  --

  這句話喔，看你有沒有覺得需要跟我道歉吧

  以電影一般標準來說

  這部片的片長跟抖音有甚麼兩樣?

  要是知道這麼難看我也不會在電影院睡

  還好吧，我就中午午休華納的APP按一按就結束了

  雖然現場看起來人很多，但說真的不難搶阿

  不早講，壓克力片我扔了

  那兩張紙昨天父親節回老家給我爸媽拿去裁一裁摺紙盒

  還算是有點用途

  所以我沒跟你收700'
