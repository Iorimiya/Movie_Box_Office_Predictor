title: '[新聞] 【驀然回首】10天賣破6億，票房雙週奪冠!'
content: '新聞網址：



  《鏈鋸人》鬼才作者藤本樹的短篇漫畫神作《驀然回首》，即將在8月1日（週四）於台灣

  盛大上映。本片不僅勇奪日本新片票房冠軍，上映第二週更憑藉百分百的優秀口碑，讓觀

  影人數直線上升。只見票房毫無衰退，戲院數更不減反增，順利蟬聯日本雙週票房冠軍之

  外，上映10天的總票房更突破6億日元（約新台幣1.18億元），讓本片被趨勢觀察家認定

  是繼《一屍到底》之後，在日本影廳數少卻創造極高票房的黑馬之作！不僅如此，本片也

  請來知名動畫師井上俊之擔任罕見的「原動畫」職務。他在上週出席本片放映活動，透露

  他跟擔任導演的「怪物動畫師」押山清高合作，被他超乎常人的熱情與毅力所震撼，甚至

  透露導演在對外試映會前一週裡面，努力畫出了1000張原畫：「他是超人，根本不像人類

  ，我認識他很久了，他有非凡的毅力！」





  《驀然回首》自6月28日於日本上映以來，憑藉超強話題與優異好評，上映十天票房突破6

  億日元（約新台幣1.18億元），吸引超過36萬觀眾入場觀賞，強勢蟬連日本雙週票房冠軍

  。尤其多家戲院一票難求，讓原本不看好這部電影的戲院業者，驚覺本片的票房實力而紛

  紛加演。這也讓本片從上映首週的119家戲院，直到上週五（7/5）再新增12家戲院，再到

  本週五（7/12）再追加近40家戲院，戲院數不減反增成為日本影壇異例。諸多日本電影網

  站上的滿意度評分更屢創高分，甚至在社群媒體上的評論也好評如潮，並一度在趨勢榜上

  留名。雖然上映戲院數不多，卻創造超高票房成績，這也震撼日本影壇，更有趨勢觀察家

  認為：「上一部出現這個現象的電影，已經是2017年的《一屍到底》了！」



  本片不僅在日本引發轟動，更在國際上處處留名，尤其上週在北美最大的動畫展覽會「

  Anime Expo」上進行北美首映，更是座無虛席。根據人在現場的「少年JUMP+」編集長細

  野修平透露：「全場觀眾起立鼓掌！反應如此之大，有些人甚至哭了…。」至於本片在全

  球引發廣大迴響，他在觀賞本片之後也感觸良多：「我真的無法用語言來形容，但我真的

  很感動。向所有漫畫家、持續創作的人與創作者表示敬意和感謝，我真的很想讓你們看到

  這部電影。」





  值得一提的是，《驀然回首》上週在東京舉辦放映活動，邀請到知名動畫師井上俊之分享

  本片製作秘辛。他曾擔任《魔女宅急便》、《千年女優》、《狼的孩子雨和雪》等片「原

  畫」職務，與宮崎駿、今敏、細田守等多位動畫大師合作過，甚至還被押井守譽為：「完

  美的動畫人」。這回他參與本片製作，並被列入「原動畫」這個非常罕見的職稱。其實在

  本片幕後團隊當中，有八個人負責「原動畫」，其中六人負責數位化，而井上在內的兩人

  則在紙上手繪。第一次被這樣稱呼的他，透露本片花費一年多時間製作，他的部份約佔據

  十個月：「通常，手繪動畫的流程，是『動畫工作人員』將『原畫工作人員』繪製的線條

  重新繪製成乾淨、有組織的線條，從而創建最終角色，但在本片當中，導演盡可能使用原

  畫，因此保留了原畫當中的細緻線條差異。」他透露本片約莫有700個畫面，他負責其中

  25%，導演押山清高則負責其中50%：「押山導演必須做很多修改和命令，我好多次收到諸

  如『抱歉，我必須做出重大修改』之類的建議。他畫了一半的原圖，並對其他部分進行諸

  多修改，最終得到如此美妙的動畫呈現。」



  井上更對導演的熱情印象深刻：「在對外試映前的最後一週，押山先生畫了1000張原畫。

  他是超人，根本不像人類，我認識他很久了，他有非凡的毅力。」他透露自己以前簡單畫

  圖的時候，說不定還可以每個月畫1000張圖，但現在每個月只能畫大概300張圖，足見押

  山導演能力之偉大，也讓井上感嘆：「他從不考慮工作的難度，我相信，如果你在動畫創

  作上投注大量精力，這個精神一定會傳遞給觀眾。」



  這部由《鏈鋸人》作者藤本樹打造的短篇漫畫神作《驀然回首》，在粉絲的殷切期盼下，

  終於製作成電影登上大銀幕，即將在8月1日（週四）於台灣盛大上映。本片劇情描述擅長

  創作四格漫畫的小四生藤野（吉田美月喜配音），意外得知長期「家裡蹲」拒絕上學的京

  本（河合優實配音），也跟她一起在校刊上連載四格漫畫。在藤野眼中，京本的畫功優異

  於她，讓藤野在自尊心作祟下，將其轉化成自己的成長動力，卯足全力鑽研畫功，花費一

  整年時間試圖追上差距，卻自認仍舊無法超越京本，導致她心灰冷意，決定放棄繪畫。直

  到小學畢業前夕，藤野在老師的請託下，轉交畢業證書給待在家中的京本。兩個性格相反

  的少女，也在此時正式相會，不僅促使藤野重燃對漫畫的熱愛，更牽起兩人不可分割的羈

  絆，共同踏上創作之路。隨著歲月流逝，兩人的逐夢之路有悲有喜，然而一場殘酷的意外

  ，卻粉碎了她們對未來的一切幻想…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
