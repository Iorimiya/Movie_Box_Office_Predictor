url: https://www.ptt.cc/bbs/movie/M.1764836429.A.46C.html
title: '[新聞] 真人版《驀然回首》殺青 官方海報發布'
content: "真人版《驀然回首》殺青 官方海報發布\n\n\n日本動畫電影《驀然回首》劇照。（采昌國際多媒體提供）\n\n【大紀元2025年12月03日訊】（大紀元記者葉子杰編譯報導）當地2日，《驀然回首》（\n\
  Look Back）真人版電影已殺青，目前在進行後製，並發布了兩張劇照，預計2026年上映\n。由坎城影展金棕櫚獎得主是枝裕和（Kore-eda Hirokazu）擔任導演及編劇。\n\
  \n據《Deadline》報導，藤本樹（Tatsuki Fujimoto）創作的《驀然回首》漫畫已改編為真\n人版電影，在仁賀保市低調拍攝完成，目前正在後期剪輯中。故事講述兩位少女滿懷熱情\n\
  地追夢，想成為漫畫家。這部漫畫在2021年於《少年Jump+》上推出後就在日本引起轟動\n，首日就有250萬人次點閱，總銷量達到90萬冊。後來還在全球37個國家出版，國際銷量\n\
  超過75萬冊。\n\n真人版《驀然回首》電影的首張官方海報（點這裡看照片）也已發布。此外，另一張電影\n劇照的海報也已公開，展現了全新的視覺氛圍。據報導，該片除了在日本發行外，也已確\n\
  定在台灣和韓國發行，Goodfellas則負責亞洲以外地區的國際銷售。\n\n\n\n真人版《驀然回首》由曾榮獲坎城影展金棕櫚獎、亞洲電影大獎和日本電影學院獎的導演\n\
  是枝裕和執導、編劇和剪輯。電影投資基金K2 Pictures參與了該片在日本的發行與製作\n，隸屬於該基金的日本電影製片人小出大樹擔任監製。\n\n是枝裕和談到他想拍這部電影的原因，「有一次從京都回東京的路上，在品川站的書店裡\n\
  被一本書封面上一個背影所吸引，沒多想就拿起來看了，那是我第一次接觸《驀然回首》\n。那晚我一口氣看完了。雖然漫畫和電影是不同的領域，但身為創作者，我感受到這部作\n\
  品背後那種拼命的決心。」\n\n是枝裕和繼續說：「我幾乎能感受到，藤本樹先生應該是非得畫出這部作品不可才能繼續\n往前走。對我來說，《無人知曉的夏日清晨》就是這樣的作品。」是枝接著說，製片人小\n\
  出大樹邀請他把《驀然回首》改編成真人電影，並安排他與原作者藤本樹會面。\n\n藤本樹說：「如果是是枝裕和導演要拍《驀然回首》，我沒什麼好說的，我很期待！」\n\n\
  根據漫畫《驀然回首》的劇情簡介，「藤野」與「京本」，一位是天資平凡卻不服輸的少\n女，一位是才華出眾卻無法適應校園生活的隱形人。四年級學生藤野為校報繪製四格漫畫\n\
  ，她的畫作很快就讓她成為班上的明星。但有一天，她得知一個經常沒來上課的學生京本\n也想投稿她的作品……\n\n責任編輯：蘇漾\n\n\n\n--\n 神韻晚會觀眾反饋（2025）\n\
  \n--"
