title: '[雷] 驀然回首 普上雷'
content: '驀然回首這部動畫電影

  描述兩個少女之間純樸真摯的

  漫畫創作過程

  很溫馨很小品

  過程只有一小時


  剛看完會有一種 蛤 就這樣？

  沒有反轉？350塊沒了！？

  但再仔細回顧

  會有一種感覺湧上心頭

  那是青少年時期那種義無反顧奮鬥的回憶

  還有摯友一同努力的青春

  那是一種很靜謐很純粹的感動

  想起來就令人起雞皮疙瘩


  我認為這部劇是要

  大家從小孩子角度出發

  喚醒年少時那種純真無往無顧的

  精進力和純粹的成就感


  為什麼說普上雷

  是因為劇情上還是吐嘈點很多的


  1.整天待在家畫漫畫是錯誤選擇

  主角藤野上學整天在那邊畫漫畫

  副角京本不上學整天宅在那邊畫漫畫

  這都是本末倒置

  你要上學廣泛吸收文化知識和邏輯

  從小學開始就不上學也太離譜

  畫出來的漫畫內容框架才有營養

  而且當不成漫畫家至少還有其他出路


  2.京本被殺原因完全搞錯

  京本不來上課也可以拿畢業證書

  而且老師連畢業證書也不叫家長來拿

  粗略推測這就是個

  家裡很有錢可以賄賂老師

  家長整天在賺錢不照顧小孩

  的單親家庭小孩

  而且

  京本營養不良到大學連胸部都沒有發育

  推測她吃東西都亂吃缺乏蛋白質


  你們或許說以上這不是重點

  錯了這其實才是重點

  這個京本就是因為單親缺乏溝通能力

  也缺乏蛋白攝取質鍛鍊體魄或跑速

  也缺乏自衛意識

  最後才被殺人犯殺掉的

  京本沒有社交溝通能力==>

  單獨行動很容易一個人被犯人逮到，而且他也不會大叫呼救

  京本沒有強健體魄和跑步能力==>

  犯人武器是鐮刀，持鐮刀跑起來遠比正常人慢京本逃跑完全追不上，而且他第一下揮空了京本變壯的話近身後可壓制

  京本沒有自衛意識==>

  京本如果平常有攜帶辣椒水，犯人揮空以後邊後可撤邊噴

  所以說

  藤野發現京本被殺以後

  說是自己帶他畫漫畫所致

  完全錯誤  關他屁事 一廂情願

  小朋友才會這樣想

  啊不過這本來就是未成年漫畫


  3.平行時空做法設計不合理

  平行時空中

  藤野透過不畫漫畫

  專心練空手道拯救京本

  然後繼續跟他畫漫畫

  這就治標不治本

  你又沒辦法隨時守在身邊

  難保以後殺人犯不會出現

  或者京本不會被職場霸凌到自殺

  正確成熟做法就是

  帶他進入朋友圈多練習社交

  帶他上健身房重訓每天跑十公里

  帶他上空手道課練習隨身帶辣椒水


  以上

  整體還是可以看的啦

  配樂分鏡情感都很讚

  畢竟不喜歡看的話時間上也只有浪費一小時

  沒有很虧


  -----

  Sent from JPTT on my OPPO CPH2579.


  --

  有點同意你的說法

  所以你老兄也分裂出兩個帳號來回嗎XD

  YAP

  如果內容好看的話確實會覺得賺阿

  有一部分是啊但是內容要精彩

  強者，五次，拜服

  嗯感覺都有吧

  原來日本可以不登校就畢業嗎？劇情看起來連雲端授課都沒有這樣可以畢業嗎？

  塞翁失馬焉知非福

  不是欸 是在指責被害人朋友亂哭一通浪費觀眾時間 並且提出可行性方案

  好的，謝謝

  當初鄭傑案很多人沒被殺就是人多壓制

  今年高捷案就是有人當場奪刀

  這兩個例子不就告訴我們人數+自衛意識有助於防止自己被隨機砍人嗎？

  至少改變京本沒事就看地板不看人的毛病吧？這兇手持把大鐮刀走到他前面才發現，這不送頭？'
