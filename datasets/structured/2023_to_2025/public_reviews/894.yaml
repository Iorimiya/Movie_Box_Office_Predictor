title: '[新聞]河合優實 吉田美月喜"驀然回首"聲優初體驗'
content: '新聞網址：



  演出《極度不妥！》成為話題女星的河合優實，近日不僅在日本Oricon公信榜公佈的「

  2024上半年突破演員排行榜（女性篇）」中榮登冠軍寶座，更在日本最大影視評論網站「

  Filmarks」拿下「2024上半年人氣演員排行榜」冠軍，奠定演藝生涯又一巔峰。這回她與

  演出《今際之國的闖關者》當中「九條朝陽」一角的吉田美月喜，共同聲演現象級動畫電

  影《驀然回首》，雖然兩人都是首度挑戰配音工作，卻也獲得原著作者藤本樹力讚表現出

  色：「既沉穩又帶有動畫特有的氣息，我認為會被大眾廣泛接受。」不僅如此，本片已經

  在日本蟬聯兩週票房冠軍，也吸引到日本知名動、漫畫家們入場觀賞，不論是漫畫家奥浩

  哉、篠原健太、村田雄介，或是動畫導演本鄉滿、吉浦康裕，甚至是吉卜力工作室製作人

  鈴木敏夫等人，都紛紛給予一致好評。而這部年度話題強片《驀然回首》，也即將在本週

  四（8/1）於全台盛大上映。





  首度挑戰聲優工作的河合優實、吉田美月喜，這回在《驀然回首》分別聲演女主角「藤野

  」與「京本」。當問及對配音的印象時，河合謙虛表示：「我想知道如果我沒有聲優技能

  的話，我還能做些什麼；除非我嘗試，否則就不會找到答案。我想誠實將我所培養的東西

  ，和我自己的情感融入到角色當中。這也是我第一次獲得可以加入動畫世界的機會，我用

  盡全力嘗試，希望能為藤野配上適合的聲音。」當河合談到她所聲演的藤野時，也有所共

  鳴地表示：「當看到完成作品時，我彷彿看到了自己的童年時代，我也像是與藤野一樣的

  孩子。如果我有比別人做得更好的事物時，我就會變得自大。我認為這是藤野的缺點，但

  這些缺點也很可愛，而我在自己身上看到了這些缺點。」



  另一方面，吉田美月喜也分享：「配音途中，我一邊看著未完成的畫面，一邊想著『哇！

  這個世界真的存在！』讓我不僅充滿感激，也情不自禁地流下眼淚，讓我更加喜歡藤野與

  京本了。」她並透露自己的練習過程：「我透過網路影片觀察專業聲優實際錄音的畫面，

  但當我真正嘗試配音時，卻驚訝於他們可以如此流暢地運用自己的聲音。」她也靦腆笑說

  ：「專業聲優可以用一隻手翻頁，以避免發出噪音，所以我也常常練習，但實際配音時，

  我還是使用雙手翻頁了…。」





  事實上，河合優實和吉田美月喜都一致認為，她們的聲優初體驗「非常困難」，不過《驀

  然回首》導演押山清高卻對兩人的表現讚譽有加：「感覺不像是初體驗，已經跟專業聲優

  不相上下了。河合比平常更進一步，她擅長在存在感中加入細微差異，讓她在試音過程中

  明顯發光，聲音也很有魅力。吉田則需要練習快速地說秋田方言，但在正式配音時也完美

  無缺，讓我十分吃驚。我很幸運在試音時找到了兩位的聲音。」不僅如此，就連原著作者

  藤本樹也稱讚：「兩位都非常出色！她們的聲音有點像吉卜力工作室的風格，既沉穩又帶

  有動畫特有的氣息，我認為會被大眾廣泛接受。」



  也因為本片故事聚焦在主角「對繪畫的熱情」，並已經在日本成為現象級電影，因此吸引

  到不少日本漫畫家與動畫導演入場觀賞，更不吝於分享他們的讚賞。《殺戮都市》漫畫家

  奥浩哉：「作畫很真實，我也喜歡分鏡的感覺，我覺得動畫人的繪畫真的很厲害。」《彼

  方的阿斯特拉》漫畫家篠原健太：「我想二刷，作畫跟漫畫內容一致實在是太棒了。」《

  一拳超人》漫畫家村田雄介：「真是一部傑作。」《蠟筆小新》導演本鄉滿：「強烈建議

  要在電影院觀賞這部電影，充滿了『動漫力量』。」《讓我聽見愛的歌聲》導演吉浦康裕

  ：「這是一部只有動畫才能將角色的真實性和故事性完美契合的傑作。」甚至連吉卜力工

  作室製作人鈴木敏夫也盛讚：「作品到底是為誰而描繪？答案就在電影裡面。」



  這部由河合優實、吉田美月喜首度挑戰配音工作，備受日本各界盛讚的年度話題動畫電影

  《驀然回首》，即將在本週四（8/1）於全台盛大上映。只要在各影城開放販售日起，購

  買本片第一週（8/1-8/8）電影票乙張，即贈送遠從日本原裝空運來台的「藤本樹原作分

  鏡本」乙本。一人限兌換四本，數量有限，送完為止。本片劇情描述擅長創作四格漫畫的

  小四生藤野（河合優實配音），意外得知長期「家裡蹲」拒絕上學的京本（吉田美月喜配

  音），也跟她一起在校刊上連載四格漫畫。在藤野眼中，京本的畫功優異於她，讓藤野在

  自尊心作祟下，將其轉化成自己的成長動力，卯足全力鑽研畫功，花費一整年時間試圖追

  上差距，卻自認仍舊無法超越京本，導致她心灰冷意，決定放棄繪畫。直到小學畢業前夕

  ，藤野在老師的請託下，轉交畢業證書給待在家中的京本。兩個性格相反的少女，也在此

  時正式相會，不僅促使藤野重燃對漫畫的熱愛，更牽起兩人不可分割的羈絆，共同踏上創

  作之路。隨著歲月流逝，兩人的逐夢之路有悲有喜，然而一場殘酷的意外，卻粉碎了她們

  對未來的一切幻想…。



