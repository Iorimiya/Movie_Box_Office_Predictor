title: '[好雷] 驀然回首Look back'
content: ".\n..\n…\n….\n…..\n….\n…\n..\n.\n來一頁防雷頁\n.\n..\n…\n….\n…..\n….\n…\n..\n\
  .\n \n \n《驀然回首》是藤本樹短篇漫畫改編的電影，片長共57分鐘，前些日子推出了單行本！這也\n是我人生中看過數一數二不到一小時的電影XD\n \n \n\
  \ \n我很喜歡故事的最後段來到電影的高峰，藤本樹用平行時空的方式訴說京本的故事。在平行\n時空中，藤野和京本雖然沒有在小學時期見面，反而在大學時期，藤野英雄救美，解救了即\n\
  將被傷害的京本。京本感謝藤野的救命之恩，藤野也向京本表明繼續創作漫畫，並邀請京本\n當她的助手。京本畫的四格漫畫此時也飄入藤野手中，請她Look Back往後頭看，發現京本?\n\
  藏了藤野所有的創作作品、四格漫畫以及掛在京本房內她在小學時幫京本簽名的大衣，鼓勵\n了藤野負重前行，持續創作的動力。\n \n雖然京本害怕人群、害怕出門，但她鼓起勇氣願意衝出門與自己的偶像見面，這是京本最大\n\
  的動力，也鼓勵藤野持續創作，不要放棄畫畫這一條路。\n \n故事小品，畫面寫實，背景畫風真的非常厲害。\n \n不管是平行時空的京本還是藤野，兩人都在創作道路上以不同的方式互相扶持和鼓勵，在漫\n\
  畫這一條康莊大道中，成為最閃亮的星。\n \n\n眾裡尋他千百度，驀然回首，那人卻在燈火闌珊處。\n\n無論彼此在哪個時空中，都仍相遇。\n\n總之是溫暖的小品，我很喜歡充滿線條感的人像以及寫實的背景，搭配舒服溫情的音樂，恰\n\
  到好處的故事節奏，是一部令人深思的電影。它通過細膩的情感刻畫和獨特的敘事手法，讓\n觀眾在感受故事的同時，也反思自己的生活和人際關係。這部電影不僅是一段動人的友情故\n\
  事，更是一場關於自我成長和反思的心靈之旅。\n\n--"
