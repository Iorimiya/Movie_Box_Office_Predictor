url: https://www.ptt.cc/bbs/movie/M.1760459127.A.ABF.html
title: '[新聞] <藤本樹17-26>揭<鏈鋸人><驀然回首>原型'
content: '新聞網址：



  在台灣創下破億票房佳績的《劇場版『鏈鋸人蕾潔篇』》，原著作者藤本樹在17至26歲之

  間創作的短篇漫畫集《藤本樹17-26》，終於在全球漫迷的殷切期盼下，以動畫電影形式

  躍上大銀幕。作品將分成「PART 1」與「PART 2」兩部，從本週五（10月17日）至10月30

  日與日本同步，在台灣進行為期兩週的限定上映。尤其日本在9月3日公開本片預告之後，

  至今的播放次數已經突破130萬次，更一度登上Yahoo熱搜榜冠軍，讓本作勢必成為繼《劇

  場版『鏈鋸人蕾潔篇』》之後，又一深具票房潛力的話題之作。其中「PART 2」集結四部

  題材迥異、風格鮮明的短篇動畫：《人魚狂想曲》、《醒來變成女生的病》、《預言的那

  由多》、《妹妹的姊姊》。四部作品皆由日本頂尖導演和製作團隊傾力打造，從神秘浪漫

  的人魚傳說，再到探索自我性別認同；從命運詛咒的黑暗奇幻，直到姊妹之間複雜而真實

  的情感糾葛，勢必帶給觀眾全方位的視聽震撼與心靈觸動。





  《藤本樹17-26》分為「PART 1」與「PART 2」兩部同步在台上映，其中《人魚狂想曲》

  由以《BLUE LOCK 藍色監獄》、《排球少年！！》聞名的渡邊徹明執導，融合島崎望精細

  的角色設計，以及石塚玲依的悠揚配樂，呈現人類少年與人魚少女在海底的唯美邂逅。本

  作透過細膩的情感刻畫與夢幻的視覺風格，探索失去與尋找、記憶與羈絆，宛如一首淒美

  動人的戀歌，讓觀眾沉浸在海洋深處的神秘魔力，以及那若有似無的淡淡情愫之中。配音

  陣容同樣令人驚艷，由菊田千瑛與幸村惠理領銜，以饒富層次的聲音，與細膩演繹的情感

  ，為作品注入靈魂。



  而由《魔法使的新娘》系列導演寺澤和晃自編自導的《醒來變成女生的病》，以敏銳而溫

  柔的筆觸，描繪主角醒來，突然發現自己變成女生，以及之後所要面對的身份認同與社會

  偏見。本作挑戰性別框架，展現出人性的脆弱與堅韌，配合德岡紘平的角色設計與石塚玲

  依的音樂氛圍，深刻而不失溫暖。榊原優希、河瀬茉希與山下誠一郎的聲演，完美詮釋主

  角在變化中的迷惘與成長，帶給觀眾強烈共鳴與反思。



  另一方面，渡邊徹明除了《人魚狂想曲》之外，也同步打造另一部短篇《預言的那由多》

  ，以宏大的奇幻設定與細膩的情感刻畫，描述被稱為「毀滅世界的惡魔之子」的那由多，

  與她哥哥健二的親情羈絆。本作邀請到澳洲知名作曲家凱文彭金（Kevin Penkin）操刀，

  充滿神秘與壯麗的旋律，與作品畫面完美融合，營造出壓迫與希望交錯的氛圍。咲咲木瞳

  與松岡洋平的聲演，則更添人物魅力與故事深度，讓觀眾感受到命運與人性的激烈碰撞。



  最後，由《派對咖孔明》導演本間修執導的《妹妹的姊姊》，則聚焦在美術學校當中，那

  錯綜複雜的姊妹關係；描繪為了洗刷屈辱而努力的光子，與她妹妹杏子之間既矛盾又深刻

  的親情糾葛。本作由以「工作系列」聞名的P.A.WORKS負責製作，佐川遙擔綱角色設計，

  得田真裕譜寫音樂，讓本作在視覺與聽覺層面皆展現高度藝術水準。尤其本作更邀請到中

  島瑠菜、中井友望與今井朋彥三位演員擔綱配音，賦予角色更豐富的情感層次，帶領觀眾

  體驗姊妹之間的糾葛與成長。





  值得一提的是，PART 2中的兩部短篇《預言的那由多》與《妹妹的姊姊》，被許多讀者視

  為藤本樹人氣作品《鏈鋸人》與《驀然回首》的創作原型，因此備受關注。對於學生時期

  創作的這些作品，如今被改編成動畫，甚至登上大銀幕，藤本樹本人也坦言既興奮又不安

  ，並表示：「真的可以這麼做嗎？會不會變成過度依賴他人靈感的作品呢？」不過他也表

  示，雖然自己尚未親眼看過這些動畫版本，但他深信這些出自才華洋溢的導演之手的作品

  ，一定會展現出應有的精彩水準，成為真正值得稱道的作品。這份坦率與信任，也讓動畫

  版《藤本樹17-26》更添話題性與期待值，勢必成為今年最受矚目的焦點動畫之一，影迷

  絕對不容錯過。



  《藤本樹17-26》將與日本同步零時差，在本週五（10月17日）至10月30日進行為期兩週

