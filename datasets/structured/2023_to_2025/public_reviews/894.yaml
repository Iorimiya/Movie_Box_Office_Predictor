url: https://www.ptt.cc/bbs/movie/M.1736771450.A.01F.html
title: '[新聞] 【驀然回首】作曲家驚嘆：聖歌彷彿從天降'
content: '新聞網址：



  由《鏈鋸人》鬼才漫畫家藤本樹同名作品改編的現象級動畫電影《驀然回首》，即將以全

  新「杜比影院」（Dolby Cinema）版本在本週五（1/17）於台灣隆重獻映，同時還將新增

  更多戲院重映原本的2D版本，消息一出，獲得影迷們的廣泛支持。透過色彩更鮮豔、對比

  度更高的杜比視界（Dolby Vision），還有透過360度環繞音效體驗極致臨場感的杜比全

  景聲（Dolby Atmos），都將合而為一在杜比影院版細緻展現。這也讓負責本片主題曲與

  配樂的音樂家中村遼感動表示：「片尾合唱團的聖歌彷彿從天而降，就像聽到一種新的聲

  音，彷彿音樂重新而生。」此外，台灣發行商也祭出全新入場特典，只要在各影城開放販

  售日起，購買本片杜比影院版電影票乙張，即贈「Dolby Cinema限定A3原文海報、日本原

  版進口色紙」各乙張；購買本片2D版電影票乙張，也可以獲得「日本原版進口色紙」乙張

  ，數量有限，送完為止，敬請把握觀賞良機！





  《驀然回首》自去年8月1日在台上映以來，連續映演至今都仍未下映，總票房已經突破

  5700萬，展現出驚人的續航力，也成功反映台灣觀眾對這部高品質作品的熱情。不僅如此

  ，本片上週也勇奪知名電影社群網站「Letterboxd」的「年度動畫電影類觀眾評價冠軍」

  肯定，可說是叫好又叫座的優質必看之作。台灣片商也加碼引進「杜比影院」版本，透過

  色彩鮮豔、高對比度、360度環繞音效的三大特色，為觀眾打造極致的觀影體驗。



  尤其為全片打造主題曲與配樂的音樂家中村遼，更是獲得觀眾一致肯定，尤其當片尾曲出

  現時，更是逼出不少觀眾的淚水。首度參與動畫電影音樂製作的中村遼，也對觀眾的支持

  表達感謝，這回更因為全新「杜比影院」版本，讓他再度檢視《驀然回首》的配樂，他對

  此透露：「為了在杜比影院的杜比全景聲音響系統下重新調整音效，我重新檢視了配樂。

  透過杜比全景聲營造出栩栩如生的的音效，讓片尾合唱團的聖歌彷彿從天而降，就像聽到

  一種新的聲音，彷彿音樂重新而生。」尤其本片大受好評並持續上映，也讓他感謝地表示

  ：「期盼大家能再度走進電影院，沉浸在這全新的音效當中。」





  值得一提的是，《驀然回首》即將上映全新「杜比影院」版本，還將新增更多戲院重映原

  本的2D版本，台灣發行商也再度祭出難能可貴的入場特典。只要在各影城開放販售日起，

  購買本片杜比影院版電影票乙張，即贈「Dolby Cinema限定A3原文海報、日本原版進口色

  紙」各乙張；購買本片2D版電影票乙張，也可以獲得「日本原版進口色紙」乙張，數量有

  限，送完為止，敬請把握觀賞良機！另一方面，桃園青埔新光影城與美麗華杜比影院，也

  分別將在1月18日與19日舉辦本片的「Dolby Cinema特別場」，參加者同樣也將贈送精美

  入場禮，詳情請見活動貼文：


  。



  這部由《鏈鋸人》作者藤本樹打造的短篇漫畫神作《驀然回首》，台灣即將在本週五（

  1/17）上映全新「杜比影院」版本，2D版也將持續上映當中。本片劇情描述擅長創作四格

  漫畫的小四生藤野（河合優實配音），意外得知長期「家裡蹲」拒絕上學的京本（吉田美

  月喜配音），也跟她一起在校刊上連載四格漫畫。在藤野眼中，京本的畫功優異於她，讓

  藤野在自尊心作祟下，將其轉化成自己的成長動力，卯足全力鑽研畫功，花費一整年時間

  試圖追上差距，卻自認仍舊無法超越京本，導致她心灰冷意，決定放棄繪畫。直到小學畢

  業前夕，藤野在老師的請託下，轉交畢業證書給待在家中的京本。兩個性格相反的少女，

  也在此時正式相會，不僅促使藤野重燃對漫畫的熱愛，更牽起兩人不可分割的羈絆，共同

  踏上創作之路。隨著歲月流逝，兩人的逐夢之路有悲有喜，然而一場殘酷的意外，卻粉碎

  了她們對未來的一切幻想…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
