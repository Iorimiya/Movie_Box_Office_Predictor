title: 'Re: [好無雷] 驀然回首 / Look Back　(影仔)'
content: '整部給[中好雷]

  之前看了漫畫 很喜歡這個作品 情感鋪陳得很好

  所以去看了動畫，個人感覺 整個做的還不錯，但有好有普的地方

  好的點，在整個說故事的節奏很順暢，把人物平時的活動表現

  很生靈活現展現出來，整個很流暢舒服

  比較可惜的點，就是作品幾幕最關鍵的鏡頭，藤本樹展現的氣氛跟

  情感還是好，這也難怪他能成名，成為漫畫名家的緣故

  如那幕雨中漫舞，原作呈現的效果有其特別的感覺，藤野一個人

  在雨中展現獨特的舞姿，呈現自我的格調，與有些自我陶醉的浪漫情懷

  而動畫就是感覺像個小學生非常振奮地揚手自我喝采，滿可惜的

  那是整部最特別的一幕


  另外，在藤野進到京本家，經過轉角，漫畫用一個長條畫面

  把整個堆滿滿的素描本到京本房門，那一幕算是第一個很重要的點

  那個素描本是藤野的好幾倍，讓觀眾可以感受到藤野的訝異與震撼

  可惜動畫處理的沒有弄的很好，沒有傳達出那份震撼的感受


  後面最重要的鏡頭就是紙片穿過門縫，第一次撕碎穿過去

  藤本樹用一個全景跨頁呈現轉頭的京本來看，效果很好，動畫導演

  則切成幾個鏡頭，想要有別於漫畫，但並沒做出更好的讓觀眾驚訝

  的效果，反而將此段的效果變平淡了，後面那次也如此


  再來其實片長是可以更適度加長，因為其實演出得很流暢

  中間其實可以再演出一些內容，不然整部57分鐘有些短

  如中間兩人一起創作一起討論，都可以來演出呈現

  如聽到電話得知噩耗，下個鏡頭就靈堂，然後就是藤野在門口

  中間的過程應該可以做些演出來呈現當時藤野的情境


  但其實個人推測就是，這部的成本應該是頗有限

  有限的成本所以才會變成這麼短

  如所提到兩人一起創作討論漫畫，躺在床上那段

  居然是用單張圖，連續幾張單張圖連動都沒有地呈現過去

  整部作品應該僅能算如netflix的單集1hr動畫作品

  規模還不夠能成為一個電影劇場版

  還有如那段藤野打到犯人，躺在救護車，整個場景

  除了藤京兩人，居然就一位救護人員，這種轟動的事件

  旁邊至少要有一堆警察與封鎖線與調查人員吧 或者也要有

  記者跟民眾在圍著吧，也要放些會閃爍的警示椎等

  可是都沒有，只有一個救護車司機 等兩位對完話

  就走過去關門開車了

  人家原作都有畫出好幾台警車與警員路人等

  真的讓我感覺成本不夠

  如果有更多些成本來多做一些橋段就更好了


  另外，音樂真的滿好的，把整部作品的氣氛都展現出來

  優美又清新，這部是獻給創作者的一首歌




  --'
