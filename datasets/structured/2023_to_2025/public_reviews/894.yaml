title: '[好雷] 驀然回首心得＆9/1台中電影包場宣傳'
content: '用台中包場宣傳文當防雷


  9/1(日)《驀然回首》台中電影包場 正式報名



  日期：9/1（日）

  開演時間：14:00～15:00之間

  地點：站前秀泰（台中市東區南京路76號）

  票價：280元/人

  人數：46位

  特典：包場特典明信片




  填單後會收到匯款資訊，完成匯款才是報名成功



  采昌效率超好，送出申請單超快就收到包場明信片

  而且首周特典備貨量很足，不會有場次開放第一天特典就沒了的慘案發生

  真的喜歡這部作品一定要去戲院支持一下XD




  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  不知道大家對劇種哪段印象深刻呢？



  我喜歡京本從房間追出來跟藤野告白(?)，完全就是阿宅看到心目中的大神的樣子www


  這段不一定要會畫漫畫才有感，只要在現實中你努力做好一件事，有人用力誇獎支持你

  那種感覺永遠記得一輩子不誇張


  也喜歡動畫讓開頭藤野的四格漫畫動起來，呈現出ㄎㄧㄤ到爆的畫面XDDD



  短篇要寫得好很難，常常看過太多作品想講的故事太多，最後爆走整個炸掉

  藤本寫短篇真的厲害，而且分鏡直接搬到動畫也沒問題



  但有可能我先看過原作，某些情緒上的堆疊沒有漫畫給我的感覺震撼

  印象比較深刻是藤野在工作室聽到報導帶出那段


  漫畫是跨頁用對話框從右上往左下走（跟著對話框視覺引導，衍伸出情緒被往下帶）

  讀完最後一個對話框接藤野驚訝的動作


  動畫是背景原本有播報員的聲音但聽不清楚在說什麼，先是藤野焦躁和編輯談助手的問題

  結束話題後播報員聲音變清晰，講述大學發生隨機攻擊事件（京本死亡）


  可能是要營造出事情太突然的感覺但我沒fu？

  因為我先看過原作覺得沒有當初看漫畫突然被打一棒震撼(?)，同樣藤野在雨中奔跑比較喜歡漫畫的分鏡



  自己覺得藤本的漫畫要搬到大螢幕很難，畢竟載體不同要完整呈現原作的味道不是很容易

  但動畫還是值得一看的，由少數幾位原畫師作畫，看的時候會覺得跟平常的動畫不一樣



  若仔細看會發現很多作畫的筆觸，不過不影響觀看體驗

  應該說劇情和畫面優秀到讓人不會在意這些地方，而且彩蛋也多


  除了鏈鋸人第一部外，編輯林士平和導演押山清高的名字有出現

  背景海報也藏了很多，但閃太快實在是看不到什麼，準備多刷慢慢抓出來



  推薦給努力做好每件事的人，或是想看藤野京本的女生香香相處也行

  藤本的女角給人一種魔性的感覺，其他短篇《再見繪梨》、《17－21》、《22－26》也大推



  --

  一生推的兩部作品


  《神威》佐一＆


  《超能100》茂夫(路人)＆新隆



  --'
