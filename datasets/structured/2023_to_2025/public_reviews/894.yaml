title: '[新聞] 【驀然回首】熱賣近1700萬登新片票房冠軍'
content: '新聞網址：



  《驀然回首》在台上映後叫好又叫座！自上週四（8/1）上映以來，不僅票房一天賣破500

  萬，三天破1000萬，截至昨日（8/4）累積票房更直逼1700萬，順利登上首週末新片票房

  冠軍寶座！台灣片商也乘勝追擊，在今日（8/5）公佈「第二週入場特典」，只要購買本

  片電影票乙張，即可獲得遠從日本空運來台的「雙面四格漫畫書籤款式A」乙張！另一方

  面，本片也在日本持續熱映當中，更已經吸引超過84萬民眾入場觀賞。導演押山清高昨日

  也率領主演聲優之一的吉田美月喜出席謝票活動，共同分享本片製作秘辛。吉田不僅自曝

  因為本片喜歡上自己的聲音，更透露跟父親一起觀賞的趣事，讓她滿意表示：「很開心能

  向父親展露自己美好的一面。」





  將《鏈鋸人》鬼才漫畫家藤本樹，他的同名短篇漫畫神作搬上大銀幕的《驀然回首》，在

  台上映後好評不斷，從一般民眾到各領域名人，都在觀賞後紛紛寫下推薦，美譽本片「絕

  對是今年必看之作」！不論是戲院的觀賞人潮，或是在社群上的推文密度，都傲視其他上

  映電影，也讓本片不負眾望，一舉奪下首週末新片票房冠軍，上映四天的累積票房更直逼

  1700萬，也讓各界看好本片有望繼《SPY x FAMILY CODE: White》、《排球少年!! 垃圾

  場的決戰》、《名偵探柯南100萬美元的五稜星》之後，挑戰成為今年第四部有望破億的

  日本動畫電影。台灣發行商也乘勝追擊，在今日（8/5）公佈本片「第二週入場特典」，

  只要在各影城開放販售日起，購買本片第二週（8/9-8/15）電影票乙張，即可獲得遠從日

  本原裝空運來台的「雙面四格漫畫書籤款式A」乙張。每人每次至多限兌換四張，數量有

  限，送完為止，勢必將再現戲院兌換特典的排隊人潮。





  另一方面，《驀然回首》也在日本持續熱映當中，目前已經吸引超過84萬民眾入場觀賞，

  還在不斷增加當中，同樣展現銳不可檔的票房氣勢。導演押山清高也積極為本片進行各式

  催票行程，昨日（8/4）便率領為片中「京本」配音、並曾在《今際之國的闖關者》當中

  飾演「九條朝陽」一角的吉田美月喜，共同出席位在東京的謝票活動。押山導演首先表達

  感謝之意，並透露日前跟原著作者藤本樹碰面，得知：「藤本先生也在電影院看過這部電

  影了，還說放映過程中，他身旁的觀眾看到淚流滿面。我認為這位觀眾，一定沒料到藤本

  先生坐在他旁邊。」



  至於為角色配音的吉田美月喜則表示：「這是我第一次喜歡上自己的聲音。到目前為止，

  我都對自己的聲音沒什麼好印象，但因為這次擔任了配音，讓我能夠有時間真正聆聽自己

  的聲音。」押山導演則對此回應：「她所聲演的京本，雖然有很多困難的場面，但配音都

  進行得很順利，讓我認為她很擅長這部份，尤其她更能夠從一開始，就處理好這些細微的

  配音差異。」吉田更透露自己已經在電影院觀賞過本片兩次，第二次是父親主動揪她一同

  觀賞。據悉，她的父親平常不太會看動漫或電影，也很少談論她的作品。吉田對此透露：

  「我父親突然聯絡我說：『今天有空嗎？我們現在就去看。』讓我心想『啊？！』就興奮

  地跟他一起去觀賞了。等父親看完電影後跟我說：「等觀賞到一半的時候，就已經忽略這

  是女兒的聲音，非常專注在故事當中。」這也讓吉田滿意地表示：「很開心能夠向父親展

  露自己美好的一面。」



  這部由《鏈鋸人》作者藤本樹打造的短篇漫畫神作《驀然回首》，現正在台好評熱映當中

  。本片劇情描述擅長創作四格漫畫的小四生藤野（河合優實配音），意外得知長期「家裡

  蹲」拒絕上學的京本（吉田美月喜配音），也跟她一起在校刊上連載四格漫畫。在藤野眼

  中，京本的畫功優異於她，讓藤野在自尊心作祟下，將其轉化成自己的成長動力，卯足全

  力鑽研畫功，花費一整年時間試圖追上差距，卻自認仍舊無法超越京本，導致她心灰冷意

  ，決定放棄繪畫。直到小學畢業前夕，藤野在老師的請託下，轉交畢業證書給待在家中的

  京本。兩個性格相反的少女，也在此時正式相會，不僅促使藤野重燃對漫畫的熱愛，更牽

  起兩人不可分割的羈絆，共同踏上創作之路。隨著歲月流逝，兩人的逐夢之路有悲有喜，

  然而一場殘酷的意外，卻粉碎了她們對未來的一切幻想…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
