url: https://www.ptt.cc/bbs/movie/M.1692950418.A.DE5.html
title: '[好雷] GT跨界玩家 爆米花指數來到驚人的99%了！'
content: '這題材在台灣真的很冷門

  禮拜三上映那天跟朋友一共6個人去看新光MX4D

  全場大概才十來位

  哭哭

  希望是因為平日晚場的關係

  看接下來六日有沒有機會衝一波票房

  不然這年頭要看到不說教不政確的單純爽片越來越難了


  不難理解為什麼爛番茄影評給出低分

  劇情就很平鋪直述，就，恩，你想的那樣

  不意外，不驚喜

  前面有人說根本是Ai寫的劇本，還真的有這種感覺

  然後主角在應該高潮迭起的轉折處演技都一個死人樣

  不過好在除了主角以外的人都很會演

  所以還不至於太出戲

  但我就是進場看賽車電影賽車的人

  只要賽車賽得好就給讚

  然後我跟大家說齁


  MX4D爆幹爽！！！！！！


  座椅震動模擬車室內行進時的路感

  椅子前後大力搖晃模擬G力的貼背感

  適時的煙霧跟風吹效果

  搭配Atmos的引擎聲浪

  視覺的衝擊，聽覺的包覆，身體的錯覺

  爽

  有夠爽

  超爽

  每次油門踩到底時全場共同發出的驚呼聲

  就好像你真的坐在一台加足馬力的跑車上一樣


  而且還划算

  為什麼很划算？

  你去台北的模擬賽車體驗店，4dof的動態椅20分鐘就要跟你收500大洋

  GT跨界玩家mx4d幾乎快整場給你搖滿兩小時

  也才520

  有夠划

  划死


  妹子正，音樂好聽

  劇情簡單粗暴

  電影本體我給7.5分

  但如果加上Mx4d的體驗我給9分（滿分給布羅利

  推薦給大家




  然後現在台中新光有賽車體驗活動

  有興趣的朋友可以參考看看

  我不是來業的，但如果廠商看我寫得好要給我錢也不是不行

  不然你們活動人潮看起來真的有夠可憐





  -----

  Sent from JPTT on my iPhone


  --


  所以我是有騙你是不是




  裡面有混進一個長頭髮的


  這種時候4D就很重要了

  昏昏欲睡時硬是給你震一個精神都來


  沒有MX4D的話我都還覺得給高了呢'
