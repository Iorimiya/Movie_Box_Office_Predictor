url: https://www.ptt.cc/bbs/movie/M.1692356505.A.F96.html
title: '[ 好無雷] GT:跨界玩家'
content: '先說我的背景

  對賽車沒興趣,也沒認真玩過賽車遊戲

  但從PS4開始就是主機玩家

  所以對這種遊戲改編最沒轍了

  （很多小小的PS彩蛋讓我會心一笑）


  整部片劇情很簡單

  就是看賽車玩家怎麼蛻變成職業賽車手

  扣除掉前面一小時鋪成比較無聊

  坐上真實賽車後就開始爽了

  各種引擎甩尾聲瘋狂轟炸

  是個不用帶腦袋進去看的片


  另外整部片就是個大型商業片

  從賽車車身到安全帽到飛機托運箱

  處處都是贊助商的Logo

  在這上面找自己認識的牌子也是一個樂趣


  總結來說這片是個值得一看的商業爽片


  --'
