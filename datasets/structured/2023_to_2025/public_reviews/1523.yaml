url: https://www.ptt.cc/bbs/movie/M.1692778466.A.7A1.html
title: ' [普雷] 跨界玩家閲後感'
content: '覺得劇情很普通…






  防雷！






  就有位日本人，山內一典開發了一款逼近真實的模擬賽車遊戲跑車浪漫旅，而日產要提升車

  子銷量，於是勒苟拉斯提了一個看似不太可能的提案，要從這些玩家中開發買家，舉辦一場

  全球的賽車電競，培養當中的冠軍成為真正的賽車手，來為日產比賽，日產姑且試之，但要

  勒苟拉斯找到一名賽車負責人，被一堆人打槍後，總算找到一位前車手，現在擔任技師的傑

  克。


  傑克一開始也覺得不太可行，電動歸電動，現實是現實，電動翻車重來就好了，現實翻車可

  沒這麼簡單，直到傑克被車隊上的雞歪車手尼可拉斯嗆，傑克一氣之下才答應了勒苟拉斯的

  邀約。


  主角揚當然是位該款電玩跑車浪漫旅的遊戲高手，這邊我覺得主角是位幸福的小孩，父母都

  很疼他，只是爸爸是用比較務實的方式去保護他，而媽媽則是用鼓勵的方式讓他放手追夢。


  被警車攔檢逃跑那段，我忽然出戲聯想到之前公視曾播的一齣短片，請登入現實，有時重度

  玩家真的會在現實中出現電玩場景的既視感XD


  之後就不出意外的，主角一路成功贏得電競比賽，成為日產簽約車手，只是我比較好奇的是

  有一場比賽，主角第一次遇到雞歪車手尼可拉斯惡意撞他，這種手法，在電玩裡應該也沒少

  遇過吧？怎麼感覺很簡單就著了他的道？


  後面的劇情就主角遇到了一些挫折，傑克帶他重新站起，然後在比賽中獲得好成績…


  完。


  嗯…就還可以的爽片一部。


  --

  　 百年孤寂

  夜色淒涼人獨醉

  簫聲宛轉淚雙垂


  --'
