url: https://www.ptt.cc/bbs/movie/M.1678363717.A.301.html
title: '[新聞] 《GT：跨界玩家》宣布 8 月在台上映'
content: "《跑車浪漫旅》改編真人電影《GT：跨界玩家》宣布 8 月在台上映\n\nGNN 記者 犬拓 報導\n\n改編自 Sony PlayStation\
  \ 熱門遊戲《跑車浪漫旅（Gran Turismo）》的電影《GT：跨界玩\n家》釋出最新畫面，由魔戒「勒苟拉斯」奧蘭多布魯與《怪奇物語》影集中的哈普警長大衛\n\
  哈伯主演，將於 2023 年 8 月 11 日（五）正式在台上映。\n\n《GT：跨界玩家》改編自年輕賽車手揚馬登伯勒的真實故事，電影描述這位《跑車浪漫旅》\n\
  年輕玩家因為其高超的電競技術，贏得一系列 Nissan 舉辦的電玩比賽，並且最終美夢成真\n，成為一位在真實賽道上馳騁的職業賽車手。\n\n《跑車浪漫旅》是 PlayStation\
  \ 旗下知名賽車系列作，自從 1997 年第一代遊戲上市以來\n，系列已經在全球賣出超過 9 千萬套，成為 Playstation 旗下有史以來最熱賣的遊戲之一\n\
  。索尼影業發行的《GT：跨界玩家》成為首部改編這款賽車遊戲的電影，本次也搶先曝光幕\n後花絮。\n\n從最新釋出的片段中可以看到，《GT：跨界玩家》再現遊戲中的賽車場景，觀眾將踏入駕駛\n\
  艙以第一人稱手握方向盤，以時速 320 公里奔馳，體會賽車時的震動與刺激感，身歷其境\n感受熱血沸騰的震撼引擎聲。特別為電影院大銀幕量身打造的《GT：跨界玩家》以動作戲運\n\
  鏡加上無人機拍攝，呈現出職業賽車手的速度快感，讓觀眾與主角揚馬登伯勒一同挑戰成為\n專業賽車手的訓練，馳騁並征服世界各地知名的魔鬼賽道。\n\n\n\n\n\n\
  改編自年輕賽車手揚馬登伯勒的真實故事，電影描述這位青少年《跑車浪漫旅》電玩玩家，\n因為其高超的電競技術，贏得一系列 Nissan 舉辦的比賽，並且最終美夢成真，成為一位真\n\
  正的職業賽車手。\n\n\n片型：PS 熱門電玩改編\n導演：《第九禁區》、《極樂世界》尼爾布洛姆坎普\n演員：《神鬼奇航》系列 奧蘭多布魯、《怪奇物語》大衛哈伯、《仲夏魘》亞契馬德維\n\
