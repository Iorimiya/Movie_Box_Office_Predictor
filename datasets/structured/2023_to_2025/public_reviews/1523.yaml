url: https://www.ptt.cc/bbs/movie/M.1693066367.A.F36.html
title: '[ 好無雷] GT 跨界玩家'
content: '從前幾個月就被預告片吸引，這次觀賞影廳為imax, 全片的發展算是相當好猜，劇情大概就預告片那樣，但完全無損觀賞體驗


  整片場景安排相當到位，幾乎無冷場，70%的時間都令人期待下一幕的發展，真的默默忘記吃手上的爆米花。


  可以看出劇組對於賽車畫面的呈現下足功夫，從引擎活塞的運轉，伴隨著機油滋潤，懸吊的行程伸縮，各項brembo/AP卡鉗的畫面，以及賽道路面的視覺呈現，身為愛車的阿宅，真是感動滿滿，同行女伴，也覺得這部是很值得一看的電影


  另外值得一提的，雖然感情場景不是這部的重點，但飾演父親角色的 吉蒙·韓蘇 （代表作血鑽石、迷因who ） 在短短一份鐘的對白，還是感動到我，其演技真的很厲害，可惜一直都是綠葉角色。


  這部很值得大家一看，強烈推薦去大影廳看，好好享受聲光效果。另外看完的第一心得是






  -----

  Sent from JPTT on my Google Pixel 7.


  --'
