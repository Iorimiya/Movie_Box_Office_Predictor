url: https://www.ptt.cc/bbs/movie/M.1692977220.A.F8C.html
title: '[新聞] 《GT：跨界玩家》空降全台冠軍！猛創多項紀錄'
content: "《GT：跨界玩家》空降全台冠軍！猛創多項紀錄\n\n2023/08/25 06:56\n\n\n《GT：跨界玩家》一上映就拿下全台票房冠軍。（索尼影業提供）\n\
  \n〔記者許世穎／台北報導〕熱血賽車電影《GT：跨界玩家》，前天（23日）正式在台上映\n，首日票房飆破 台幣600萬，榮登全台票房冠軍，並創下多項紀錄，包括近年來賽車類型\n\
  電影最高開片紀錄、影史開片票房最佳的PlayStation®遊戲改編電影，這部不可思議的\n真人真事改編賽車電影有望再創票房里程碑。\n\n《GT：跨界玩家》除了引起台灣影迷熱烈討論，也在知名影評網站「爛番茄」獲得98%爆\n\
  米花評價，外媒《綜藝》盛讚電影完全超出觀眾對動作電影的高度期待，「賽車以時速\n300公里狂飆在蜿蜒的賽道上，畫面完美融合電玩的技巧和特色，但是故事卻又非常真實\n\
  ，就像剔除中二駕駛行為的《玩命關頭》系列，真的能感動到觀眾。」\n\n\n《GT：跨界玩家》賽車場面讓觀眾腎上腺素飆升。（索尼影業提供）\n\n電影描述年僅19歲的《跑車浪漫旅》電競玩家揚馬登伯勒，從臥室裡的電玩宅男跨界成為\n\
  職業賽車手的驚奇之旅。曾執導過《第九禁區》及《極樂世界》的南非導演尼爾布洛姆坎\n普，在這部電影中展現他最擅長的場面調度功力，並且使用最新的攝影科技呈現出最逼真\n\
  的賽車速度感。\n\n片中令人腎上腺素飆升的畫面，得歸功給攝影團隊實驗性的嘗試，布洛姆坎普從無人機比\n賽中得到靈感，首度在電影中使用無人機來捕捉高速行駛GT-R賽車的生動畫面，「觀眾能\n\
  感受到像駕駛一樣急速過彎的快感，真的是一個非常特別的體驗！」《GT：跨界玩家》全\n台上映中。\n\n重溫本報專訪影音：\n\n導演尼爾布洛姆坎普\n\n\n\n\
  主角揚馬登伯勒本尊\n\n\n\n--\n佛教經典的\n是 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
