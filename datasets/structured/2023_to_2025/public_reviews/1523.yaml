url: https://www.ptt.cc/bbs/movie/M.1692777120.A.184.html
title: '[好雷] GT:跨界玩家-名垂青史'
content: '無雷概括: 爽片，賽車部分拍得很棒，


  不管是轟隆隆的引擎聲還是大銀幕上鏡頭俯衝向疾馳的賽車，


  佔了大約有片長一半的篇幅但是一點都不覺得膩


  其他像劇情或角色演技還有討論空間，競賽部分爽度沒話說



  文戲算過關，進訓練營前比較無聊，幸好這段日常不長


  而且跟主角對戲的爸爸還有教練演技都很棒，彌補了一部份主角比較弱的缺點，



  (底下開始有劇情雷)
















  防雷
















  防雷警告














  進場前我完全不知道這個人的戰績，只知道是遊戲玩家然後成為職業賽車手


  看完出來查資料才發現他有些賽事跟經歷在電影裡都換過順序


  電影的編排比較戲劇性，但可以理解，拍電影嘛...


  另一方面也證明這種故事(電競玩家成為真正的賽車手)就像日產一開始的目的一樣


  真的充滿噱頭跟行銷價值


  畢竟進場的觀眾大多是凡人，誰不喜歡看平凡小子揚眉吐氣名垂青史的故事呢?




  只是看的時候有個問題一直很疑惑，


  CAPA隊的車手抗議說業餘賽車手造成職業車手的危險，後來變成連署希望取消揚的資格


  OK，這我能理解，畢竟是開著時速300公里幾百公斤的怪獸在同一個場上跑


  運氣不好被技術爛的撞到自己就GG了


  但CAPA跟片中另一個喜歡逼車的角色，他們的行為就算不犯規，難道不是更危險?


  不明白那麼振振有詞是怎麼一回事-_-





  --


  我本來擔心的是，會不會我進場然後要看大篇幅主角的糾結跟成長


  跟家庭吵架 跟質疑他能力的人吵架 自我懷疑 然後跨超越自己極限這種


  結果看到滿滿賽車，我很滿意XD 我進這場就是要看這個，引擎聲在電影院聽真棒



  然後取消的部分教練也說FIA不能因為這樣取消


  但是連署會影響贊助商意願，所以必須拿出成績，說服贊助商主角是有價值的'
