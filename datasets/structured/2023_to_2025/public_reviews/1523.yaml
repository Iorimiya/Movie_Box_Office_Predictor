url: https://www.ptt.cc/bbs/movie/M.1703742826.A.EE1.html
title: '[好雷] 跨界玩家'
content: '個人認為美版的GT跨界玩家

  是今年2023唯一最好看的洋片

  看過台版跟日版

  美版最專業最好看

  但台版是最先被拍出來

  聽版上說這都是賽車界的真實故事改編


  這片看了兩遍才認出那個發起人

  是演魔戒帥哥弓箭手的奧蘭多布魯

  魔戒之後就沒再看過他

  奶油小生也變帥大叔

  已經從偶像變專業的演技派演員

  但個人覺得裡面演得最好的是教練


  這片好像從頭到尾都是日產汽車的宣傳片

  還有宣傳那個賽車遊戲模擬器

  在日產汽車試車場竟然還用直升機來訓練

  看來豐田跟日產都薄利多銷的賣車發大財

  國際市場市占率極高


  不知道這個故事的版權是屬於誰的

  台版竟然可以先拍這個故事

  是不是拋磚引玉才有了日本跟美版

  而且這三個故事都不一樣，但大同小異

  日版最小成本，只有兩台車在比甩尾賽而已

  台版貴一點，聽說好像花了三億台幣

  感覺美版這片的基本拍片成本一定是

  目前台日韓都還無法超越的天價


  台版日版都只有在台灣日本

  美版帶你環遊世界最棒的賽車場

  最後一場竟然還有法國陸軍

  從直升機上用繩子滑降下來授旗

  歐洲大賽的排場就是不一樣

  拍的也像真的要去打世界大戰一樣

  的尊重國際大賽的運動選手


  拍的就是比台版日版更好看

  沒去過好萊塢就別說你會拍電影

  得要像李安跟奉俊昊一樣

  請好萊塢最棒的幕後人才

  才能拿到奧斯卡金像獎


  就算中國砸2億美金去拍大片

  但砸在徐克陳凱歌身上就是浪費錢

  要砸在史匹柏卡麥隆身上才是花在刀口上

  就像日本的UNIKURO就砸錢在文溫德斯手上

  就把役所廣司捧成了坎城影帝


  所以台版只要錢夠

  請的起史匹柏、卡麥隆

  或朗霍華、林詣彬來拍

  就能把台灣演員捧成奧斯卡影帝




  美版




  台版




  日版



  --

  WOOOOOOOOOOOOOOOOOOOW !

  但台日美應該都是同一個人的真人真事改編

  只是美版應該最接近真實故事'
