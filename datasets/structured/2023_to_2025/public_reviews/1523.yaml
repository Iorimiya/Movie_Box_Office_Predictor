url: https://www.ptt.cc/bbs/movie/M.1693451554.A.D20.html
title: '[普負雷] GT-跨界玩家'
content: '1.特效：效果一般，大概比網飛上自己發行的電影好一些，不過賽車相關的電影大概就這樣


  2.音效：我在桃園新光杜比影廳場，聲道環繞不錯，但可惜賽道真實賽車的聲音不怎麼突出


  3.演員：都表現的不錯，但奧蘭多布魯這個生意人角色演的不夠油膩，韓蘇還是一樣的演技自然


  4.敘事：本片賽事條件魔改嚴重，一圈差6秒可以輕鬆追上，但最讓我無法接受的是勒芒24小時，從來都是跑最多里程數的上領獎台，本片居然魔改成衝線排名


  讓我再選擇一次的話，我會在串流平台上看就好


  --'
