url: https://www.ptt.cc/bbs/movie/M.1693471731.A.C4F.html
title: '[普雷]GT：跨界玩家 還有什麼運動能比照辦理 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  今天去電影院看了GT：跨界玩家

  內容大概講述尼桑某高層找了一群在賽車遊戲的佼佼者

  並把他們打造成真實賽車手

  並成功轉型的故事


  裡面提到的一個論點我覺得蠻有意思的

  就是遊戲裡的不論是賽車、零件、賽道都是非常仿真的

  所以遊戲玩家在裡面獲得的技術是可以真實轉換到實際賽場

  舉例來說那些比賽賽道，專業賽車手不可能一天到晚在那練習

  但在遊戲的空間裡你可以一天練上無數次

  所以對賽道路線的掌握可說是不輸職業賽車手


  這就讓我好奇了還有哪些運動能比照辦理（遊戲轉職業）

  因為賽車選手相較於一般肉搏性運動更側重的是選手的反應、意志力、對臨場狀況的判斷

  等等

  這些東西是比較跟身體條件無關的

  當然還是要體能相關訓練


  我的意思是對比籃球或是美式足球那類需要靠身材條件的運動

  賽車的身體要求相對低

  不太可能說你遊戲打的好

  就能上場打球

  有網友認為還有哪種運動可以套用這個勝利方程式嗎？


  --'
