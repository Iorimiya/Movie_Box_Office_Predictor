url: https://www.ptt.cc/bbs/movie/M.1693558973.A.D02.html
title: '[普雷] GT：跨界玩家 搔不到癢處'
content: '真人真事改編


  但劇情與現實的時間軸不同


  為了因應劇情 所以有做過調換


  但拍出來給我的感覺


  整部片就是跟著劇情拍而已(或是想要更多置入行銷)


  而不能好好地說出一個故事


  導致要熱血也熱血不起來


  角色沒什麼靈魂(除了楊他爸以外


  以至於我沒有辦法很投入看楊的經歷過程


  對我而言是滿可惜的


  呈現出來的內容 導致說勵志也沒那麼勵志


  要說爽也爽不到點


  是可以無腦看


  但整體來說就是搔不到癢處









  雷文防雷資訊頁



  揚馬登伯勒因為他爸五歲帶他去玩賽車


  他就有了當賽車手的夢想


  普遍認為打電玩沒前途的家庭衝突


  父親為孩子著想 希望楊能踏實 賽車很花錢


  楊則認為那是他的夢想 他甚至可以從基層開始做起



  奧蘭多布魯說服高層開辦GT學院


  篩選有能力的玩家進入賽車界


  以此誘發更多潛在汽車用戶購買


  但多數人並不認為宅在家裡打電動的玩家


  能晉升成真正賽車手


  前面故事就圍繞在這兩者間做切換


  也就是楊從虛擬遊戲玩家變成真正賽車手的過程


  也就是電影標題 跨界玩家


  而能把這兩者串連起來的便是


  GT 賽車遊戲模擬器


  由於他的高度擬真 很貼近現實面的操控和反饋


  就成了前往現實的一個橋梁


  但外人可不這麼理解


  賽車手需要高度的心理素質 扛壓 體能


  翻車了可不能重來


  對應到後來的車隊對楊嗤之以鼻的態度：菜鳥


  是個正常人都會這麼理解


  所以在GT學院裡


  有人吐了 有人退出了


  以及訓練採訪環節我覺得都有到位



  可惜的是傑克擔任的首席工程師


  之後變得比較像是楊的經紀人


  沒能把他過去身為傳奇賽車手的經驗展現出來


  基本上都是交由楊的天分自主發揮


  或是對這賽道跑好幾千場的自我體驗


  還有開著很嚇趴黃金跑車的那個對手


  沒能把對手格好好塑造出來


  讓我在最後楊逆轉時心中也沒什麼波瀾


  楊他弟 跑去踢足球後面直接完全消失


  楊的女朋友 沒有好像也沒差


  親親畫面親超久的


  你們倆之前到底是怎麼好上的阿 靠碼頭喝酒嗎


  楊翻車的時候


  畫面一直呈現他媽一直在那邊悲痛


  我當時心裡想：


  阿妳是要哀多久這畫面我還要看多久


  這種痛苦還要持續多久 = 皿 =



  因為我是去看4DX


  賽車過程的畫面會有各種角度切換或是暫停


  所以震動沉浸感不是很好


  你就不能有一整段是能好好地給我震完嗎=  =



  角色沒什麼靈魂的話


  可以用配樂幫忙輔助角色現在內心狀態


  但這部也沒什麼配樂 就可惜了


  但楊他爸和楊互相理解那段真是深入人心


  爸很遺憾當下沒能好好支持楊


  天下父母心


  楊也在安全帽上一直有貼爸爸球隊的貼紙


  作為回應


  這是整部最感動也是最讚的地方



  這部真要講比較扯的地方


  就是繞離輔助線還能開比對手快


  一圈追回六秒


  有夠出戲 =  = 這根本不可能好吧



  總而言之


  對遊戲玩家或是純看爽的人這部應該會不錯


  但對我這種想看真人改編


  或是注重在普遍不被看好的情況下


  跨界玩家會如何逆轉


  就沒那麼有趣了


  因為主要是置入行銷 細節部分就是輕描淡寫


  不適合我QQ


  去年看的極速甩尾我還比較喜歡


  --'
