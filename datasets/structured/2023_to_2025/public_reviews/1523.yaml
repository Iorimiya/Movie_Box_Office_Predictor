title: '[贈票] 美麗華影城 x GT:跨界玩家 競速贈票'
content: '【GT:跨界玩家】  8/18－20（五－日）熱血口碑場｜8/23（週三）電影院大銀幕競速上映


  改編自年輕賽車手揚馬登伯勒的真實故事。電影描述這位《跑車浪漫旅》年輕玩家，因為

  其高超的電競技術，贏得一系列Nissan舉辦的電玩比賽，並且最終美夢成真。


  即刻起至2023/08/20 下午23:59


  追蹤美麗華影城臉書粉絲團及IG帳號，享受第一手電影訊息


  臉書粉絲團：



  IG帳號：



  並於此篇留言(推噓不限)寫下你想對美麗華影城說的話(內容不影響抽

  獎)

  就有機會獲得「GT:跨界玩家」特映票2張


  獎項內容：

  08/22(二) 19:00 美麗華影城 【GT:跨界玩家】特映會入場券 10名(1人中獎 2

  人同行)

  得獎名單將於8/21(一) 18:00前以站內信公布，請得獎人於8/22(二)14:00前將領獎相

  關資訊以站內信回傳，並於8/22(二) 18:00~19:00至影城6樓特映劃位區出示個人證件領獎


  影城會確認得主是否符合抽獎資格(含臉書按讚IG追蹤)，若未完成任務或違反規定將取消

  中獎資格，敬請見諒


  *本活動「中獎後」需提供基本個資作為領獎及比對資格使用，版友們可自行斟酌是否參

  與



  電影簡介：


  本片由魔戒「勒苟拉斯」奧蘭多布魯與《怪奇物語》影集中爆紅的哈普警長大衛哈伯主演

  ，改編自年輕賽車手揚馬登伯勒的真實故事。電影描述這位《跑車浪漫旅》年輕玩家，因

  為其高超的電競技術，贏得一系列Nissan舉辦的電玩比賽，並且最終美夢成真，成為一位

  在真實賽道上馳騁的職業賽車手。


  《跑車浪漫旅》(Gran Turismo) 是PlayStation®最受歡迎的賽車系列大作。自從1997年

  第一代遊戲上市以來，《跑車浪漫旅》系列已經在全球狂售超過9千萬套，成為

  Playstation®旗下有史以來最熱賣的遊戲。這次索尼影業發行的《GT：跨界玩家》成為

  首部改編這款賽車遊戲的電影。


  因執導《第九禁區》、《極樂世界》而聲名大噪的南非導演尼爾布洛姆坎普在訪談中提到

  ：「除了賽車動作場面外，我們在角色的發展也下了很多功夫，這是一個能感動人心的故

  事，加上演員實際坐入駕駛艙，在真實的賽道上以驚人速度飆車，還有能比這更令人興奮

  的電影嗎？」《GT：跨界玩家》在賽車場面中使用與《捍衛戰士：獨行俠》一樣的攝影技

  術，利用VENICE 2攝影機和RIALTO分離系統，將攝影機的鏡頭與機身分離，讓製作團隊能

  夠在狹小的空間裡放置多台攝影機捕捉畫面，就像《捍衛戰士：獨行俠》中戰鬥機的空戰

  場面一樣，機械與駕駛的完美結合，讓人身歷其境的G力速度感即將在大銀幕上重現。


