url: https://www.ptt.cc/bbs/movie/M.1693494182.A.CDE.html
title: '[無雷] GT：跨界玩家 4DX'
content: '很典型的勵志片，劇情就是你想的那樣(?)

  首刷感想就是及格爽片，覺得是可以進去給引擎聲炸一下的。

  看完IMAX後感覺4DX會非常適合就跑去二刷了。


  4DX賽車的部分是真的搖，但完全不動的時間體感蠻長反而出現落差感，

  會默默的有點不耐煩，加上這部的劇情其實禁不太起二刷...


  比較大的問題是賽車有些段落不是頻繁切到其他地方就是瘋狂暫停，

  看IMAX的時候覺得還好，但4DX椅子會變成動一下停.動一下停.動一下停。

  真的就是這樣...整個很躁==


  不過還是得說最後一場賽事非常過癮，尤其是入夜那段，

  第一次體驗到這種規模的效果整個笑出來XD (就先不爆雷


  結論，雖然好像抱怨偏多，

  但如果想體驗4DX，這片相比其他片個人覺得絕對是不錯的選擇。


  --'
