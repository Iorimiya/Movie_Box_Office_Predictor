title: '[討論] Apple TV 特價 GT:跨界玩家/變形金剛系列'
content: '【2024/09/12 Apple TV 特價報】

  GT：跨界玩家／變形金剛全特價／神啊，你在嗎？／奇蹟俱樂部／奪天書／大逃殺 4K數

  位修復版／南山的部長們

  －

  Apple TV目前的$90特價片中突然出現多部近期4K電影，其中首推描述電玩玩家成為傳奇

  賽車手的真人真事改編作品《GT：跨界玩家》，這部片除了講述了一段追求夢想勵志故事

  ，相信也能讓身為賽車迷和電玩迷的觀眾們看得過癮，是打點很廣，娛樂性十足的一部片

  ，非常值得收藏。同時改編自青少年成長名著的《神啊，你在嗎？》也在本次特價之列，

  相當難得，建議大家趕緊入手。另外《噤界：入侵日》也有小特價$390，對這部系列新作

  有興趣的朋友可以參考看看。

  －

  接下來是《變形金剛》系列的回合。應該是為了配合新片宣傳，《變形金剛》系列目前來

  到難得的全系列$150大優惠！這應該是近年來最全面且划算的一波，連《變形金剛：萬獸

  崛起》都列入了，讓大家能在觀賞新作前，一口氣回味柯博文與密卡登歷年來的恩怨情仇

  。不管是想一次收齊或是補遺單部的朋友都千萬別錯過了。

  －

  最後我們也整理了幾部超級有料的日韓電影。《大逃殺 4K數位修復版》又$90了，照以往

  慣例這種特價不會持續很久，之前沒跟到的朋友就別猶豫太久了。另外還有我個人非常喜

  歡，改編自韓國知名政治事件的《南山的部長們》，李炳憲在其中的演出非常精彩，誠心

  推薦給大家。

  －

  以上，祝大家看片愉快！

