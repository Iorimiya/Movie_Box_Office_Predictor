title: '[請益] GT跨界玩家是翻拍我們的叱吒風雲嗎 ?'
content: '最近幾年看到很多洋片都有台片的影子


  例如

  世界上最爛的人時間停止像消失的情人節


  GT跨界玩家整片主題都像叱吒風雲


  金牌拳手3壞朋友找上門找麻煩

  像陽光普照


  限時追捕裡面監視器丟手榴彈

  像顏正國導的少年吔


  好像全世界都在關注台片的感覺

  可能台片在國際影展常露臉

  有些導演看完就馬上學起來

  畢竟台片現在產量很少

  所以一年份的台產片要全看完不難

  但中國片應該就爛片多到不想看


  天下文章一大抄

  電影應該也一樣


  --'
