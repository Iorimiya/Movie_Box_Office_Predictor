url: https://www.ptt.cc/bbs/movie/M.1692604211.A.E21.html
title: '[好雷] 簡單粗暴-GT跨界玩家'
content: '口碑場看的  內文真的有雷




  慎入






  皮卡



  皮卡




  丘~~~~~




  十萬伏特雷










  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  跨界玩家


  劇情簡單粗暴-很直球對決(公式)的一部，


  大部分著墨在賽車上，占比比例：賽車85%/親情10%/愛情5%


  一開始用家庭矛盾讓人知道主角的狀況，

  再用開真車載弟弟知道，主角可用遊戲經驗帶入開車讓人知道他真的會賽車，而不是用遊

  戲的方式，這點代入感很貼切，

  找教練的方式就是讓人爆氣我要讓看不起我的人，知道林杯爆幹強，

  收到通知，到GT學院，與同儕競爭，用煞車片的方式讓教練知道主角是有料的，

  取得賽車證->挫敗(車禍)->教練講過去自我經歷(釋懷)->再次站上舞台，


  師徒情這邊有加上日本送教練那個禮物，到後面講經歷，

  這個禮物就顯得非常重要，沒有這段，後面講經歷的感覺就不夠強烈，


  再次站上舞台，中間因為有人翻車，然後主角又再次陷入當下情況，教練用他放的音樂，

  讓主角覺醒，作為轉折真的很有效果，


  賽車的部分，大量的CG競速面劃、車輛零件作動畫加上環繞音響，看起來聽起來就很熱血

  ，不用太用大腦就可以好好地觀看。



  值得一看


  --

  看他們去日本散步給個5%啦XD

  就部分細節可以再看

  真的不錯

  不算耶 猴子沒有那麼強的意志力跟技術

  蠻推的 盡量挑音響好一點的廳

  音效我覺得不錯啦 賽車的聲音 蠻爽的'
