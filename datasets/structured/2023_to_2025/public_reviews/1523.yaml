title: '[新聞] GT：跨界玩家險勝芭比 登北美票房冠軍'
content: "GT：跨界玩家險勝芭比 登北美票房冠軍\n\n2023/8/28 18:09\n\n（中央社洛杉磯27日綜合外電報導）據北美院線聯盟（Exhibitor\
  \ Relations）報告，改\n編自熱門遊戲的「GT：跨界玩家」(Gran Turismo），本週以些微差距擊敗「芭比」，以\n1730萬美元登上北美票房冠軍寶座。\n\
  \n分析師葛羅斯（David A. Gross）說，「這對改編自電玩的動作片來說，不算是太強的開\n片」，尤其是在和在全球收入達4.39億美元的「魔獸：崛起」（Warcraft）、票房累積達\n\
  4.28億美元的「毀滅大作戰」（Rampage）相比更是如此。\n\n這部由大衛哈伯（David Harbour）和奧蘭多布魯（Orlando Bloom）主演的電影，講的是\n\
  一個賽車學院的故事，那間學校招募老練的電玩玩家，將他們訓練成真正的賽車手。\n\n在此同時，「芭比」（Barbie）本週有1710萬美元的票房排在第2，表現依舊出色，國內\n\
  累積5.94億美元的收入。\n\n累積至此，「芭比」已凌駕「超級瑪利歐兄弟電影版」（The Super Mario Bros. Movie\n）的5.74億美元，成為國內年度票房冠軍。除此之外，「芭比」的海外收入達7.45億美元\n\
  。\n\n上週票房冠軍「藍甲蟲」（Blue Beetle），本週收入1280萬美元排名第3。\n\n第4名的是票房估計有900萬美元的「奧本海默」（Oppenheimer），這部講原子彈起源的\n\
  電影，國內總收入已超過3億美元，海外總收入達4.77億美元。\n\n「忍者龜：變種大亂鬥」（Teenage Mutant Ninja Turtles: Mutant\
  \ Mayhem）本週以610\n萬美元排在第5。\n\n排名第6至第10的電影依序為：「巨齒鯊2：海溝深淵」（Meg 2: The Trench），510萬美\n\
  元；「復仇狗聯盟」（Strays），470萬美元；「爆復」（ Retribution），350萬美元；\n「希爾」（The Hill, 暫譯），250萬美元；「幽靈公館」（Haunted\
  \ Mansion），210萬\n美元。（譯者：李晉緯/核稿：陳政一）1120828\n\n#芭比 #芭比\n\n--\n佛教經典的\n是 是菩薩成佛之道\n\
  \        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
