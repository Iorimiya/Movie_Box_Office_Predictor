url: https://www.ptt.cc/bbs/movie/M.1693076731.A.4AA.html
title: '[普無雷] GT 跨界玩家 觀後感'
content: "結論 :\n\n         這部比較適合喜歡四輪，但又不懂賽車or單純想看爽片的人\n         如果是這樣應該會看得蠻開心的\n\
  --------------------------------------------------------------\n\n其實整部很像是為了工商跑車浪漫旅跟ps的商業電影\
  \ XD\n\n也許是為了要合大眾口味，所以比較像講故事\n如果是想看GT賽車內容的話基本上是0\n印象中完全沒有講到賽車的東西，有的話也是非常淺\n\n我自己是喜歡兩輪四輪、賽車運動的\n\
  這部好看是好看，但就是很淺的講故事\n\n如果是GT迷看這部應該會覺得有點小無趣(但整體電影算優秀的)\n一般人應該會看得很開心\n\n\n所以有些人會給負評我也能理解\n\
  因為賽車的內容幾乎沒有，劇情走向也很好猜\n但撇除那些，差不多算普上的一部電影\n\n\n話說PS的LOGO也太多了吧XD\n\n--\n   對啊 太多了\n\
  \   我也覺得主角很普\n   要置入是沒問題，但太多了 xd 一直吹gt有多擬真多真實，\n   但懂得人都知道也比不過ac跟acc\n   對啊，所以我說喜歡賽車競技的會看得比較無趣一點"
