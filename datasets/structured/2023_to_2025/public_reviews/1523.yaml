  畢竟是GT遊戲真人改編，故事平鋪直敘


  從開頭到結尾就是漸進式增強，沒有意外



  優點是賽車場面、音效都算是不錯，爽感是有的


  缺點就是轉場的過程真的演技僵硬，情緒無法醞釀



  不過屌打日本那部類似遊戲賽車手的電影就是了


  大概75/100吧


