title: '[  雷] GT跨界玩家'
content: '防雷






















































  我對賽車幾乎一無所知

  只知道都飆超快然後很容易出大事

  所以對一個連賽車小白都稱不上的我來說

  有人批評的沒針對賽車部分深入的缺點就沒差

  我是看得蠻津津有味的,個人很喜歡開快車

  而且要從在虛擬很強到在現實很強

  本身就是很酷的旅程,而且充滿成長的故事大家都喜歡

  想當然一個不支持自己的老爸

  和講話機掰有著過去的教練是匹配

  但他們和男主角的互動還是起到了畫龍點睛

  整體節奏也很舒爽流暢,所以我看的是開心的

  就算對賽車本身沒有更認識

  還是對一個人的故事駐足了印象

  不過那個24小時不打烊的比賽太酷了吧

  真的是把選手操到極限耶,規模是真的很宏大氣派啦

  ----

  Sent from  on my iPhone 14 Pro Max


  --'
