title: '[情報] 《元素方城市》台灣7月6日暑假檔期上映'
content: '《元素方城市》最新中文版預告公開 台灣 7 月 6 日暑假檔期上映


  （GNN 記者 阿Lu 報導） 2023-04-14 16:27:31


  由華特迪士尼與皮克斯動畫工作室最新聯手打造的動畫電影《元素方城市》，台灣上映檔

  期確定改至 7 月 6 日暑假檔登場。




  在一座聚集風、土、水、火四大基本元素居民的「元素市」中，強悍機智但脾氣火爆的「

  小炎」在與隨遇而安且充滿樂趣的「水弟」邂逅後，顛覆她對於周遭世界的觀點，並且探

  索內心更加基本的「元素」：在原本水火不容外表下的彼此共通之處。




