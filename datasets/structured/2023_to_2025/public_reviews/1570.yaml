title: '[新聞] 超越《小美人魚》！元素方城市創Disney'
content: '超越《小美人魚》！《元素方城市》創Disney+今年電影最佳開播紀錄


  2023年9月21日 週四 上午10:57




  《元素方城市》（圖：Disney/Pixar）


  1. 本片甫上映時不受世人看好，以為會慘遭票房滑鐵盧。


  2. 豈料電影竟一路倒吃甘蔗，每週票房都絲毫不曾衰退。


  3. 本片如今更創下Disney+今年電影的最佳開播紀錄。


  【文／血紅蘭姆】


  《》一登上便大受歡迎，觀看次數甚至超越了《》。


  在連續三部皮克斯電影都選擇直攻串流，讓觀眾養成了不買票走進戲院的觀影習慣，又主

  打著皮克斯常見的擬人化路線，而前一部作品《》還重重跌了一跤之下，《

  》在甫上映之初曾看似前途一片灰暗。




  《元素方城市》（圖：Disney/Pixar）


  何況本片的北美首週末票房只抱回了不到三千萬美金，創下了自首部電影《

  》以來的最低開票紀錄，讓世人都以為本片勢必將慘遭票房滑鐵盧。


  豈料電影竟一路倒吃甘蔗，週週票房都絲毫不曾衰退，在注重首週末票房的好萊塢成為極

  其罕見的異數。


  《》不僅成為好萊塢自2017年以來首部突破四億美金大關的原創動畫電影，尤

  其在更是大受歡迎，榮登

  。


  在一路長賣、聲勢不墜之下，本片終於在9月13日登上，而根據迪士尼透露，《

  》上線前五天就吸引了兩千六百四十萬次觀看，不僅創下了今年電影的

  最佳開播紀錄，也打進了史上電影最佳開播成績的前十名。


  相較之下，《》開播前五天則在全球吸引了一千六百萬次觀看，比起《

  》仍然略遜一籌。


  本片同時也成為自《》以來開播觀賞次數最多的動畫電影，甚至還在拉丁美洲

  一舉超越了《》，創下Disney+在該地區史上最佳的開播紀錄。


  《》已在上線。


  新聞網址：






  --'
