title: '[閒聊] 元素方城市 好奇其他種族世界 '
content: '跟朋友看完元素方城市

  我個人原本都是在看情感線

  但朋友瘋狂跟我討論各個元素的世界應該長怎樣

  一開始有點小煩畢竟我還在情緒裡 眼淚還在眼角

  但後來想想真的也滿好奇各族的個性和背景的


  像是故事設定水族除了感性以外

  是住在這個城市中的蛋黃地區，就像是天龍國的居民

  是否跟水這個元素本身是萬物的起源，所以住最核心有關係？

  重要的交通管道看起來也跟水有關

  整體來說家庭觀也比較開放前衛


  火族除了相對理性外，就是比較刻苦的外來族

  環境圖看起來是最有可能被洪水滅了的區域（邊緣族

  火容易引起災難是鬧事角色，所以要當城市邊緣人

  但火又是能夠推動人類文化的重要元素～


  那像是風和土呢？很好奇他們的區域有沒有什麼特別地方

  只知道小樹人個性可愛搞笑 有點愛現 每次都會表演腋下開花

  風族喜歡娛樂 還有自己的比賽 是不是全城最無憂無慮的角色呢？


  另外這次大玩一些元素梗也很有趣

  例如聖火是最高溫的藍色 火族能夠塑造玻璃

  土族的情趣是幫彼此摘蘋果（？好謎哈哈

  風族搭上交通工具就會充氣 下車會再洩氣

  如果元素出其他短篇動畫真的會想看耶 像動物方城市+ 那種一集短短的


  大家對哪個元素種族最感興趣啊？


  -----

  Sent from JPTT on my Google Pixel 7.


  --'
