url: https://www.ptt.cc/bbs/movie/M.1695818860.A.2AC.html
title: '[好雷] 元素方城市 小炎的家庭教育心有戚戚焉'
content: '分享一下近期的愛片《元素方城市》

  裡面對家庭教育的探究是非常有感的

  小炎的家庭就很像我們東方人的模式

  火爸因為自己吃過很多苦頭

  為了怕小炎碰壁受傷

  所以對她過度保護 希望她能走一條被安排好的安全路

  少一點跌跌撞撞

  但反而忽視了小炎心中真正所想

  在高壓教育下小炎也不敢說出自己的心聲

  漸漸兩人心中的結越來越大 最後就爆了


  看到這段我內心是非常有感觸的

  因為我們家的教育正是如此

  媽媽從小就幫我安排好一切

  記得我只要一有什麼與媽媽不同的意見提出時

  就會換來一頓爭吵

  漸漸的我也不想說了

  順著她就是

  記得最後的引爆點是當時大學選系

  我媽一直逼我選法律 說將來當律師或是考公職比較好

  但我其實想讀的是設計

  想當然的也只能順從 進去後實在讀的很痛苦 最後二一收場

  記得告訴媽媽這消息時她又是如往常般責難

  最後我也爆了 大概是我爆最嚴重的事

  一路從小開始講起 講到最後我跟媽媽願意互相理解抱在一起哭

  所以電影看到最後那邊炎爸跟小炎鞠躬行禮那段

  完全觸動我內心的情感 止不住淚水潰堤


  相較於小炎

  水弟家的教育就是讓你去闖

  失敗了我再陪你一起哭

  畢竟那是你的人生課題

  父母能做的只有陪伴跟給建議

  不是主導


  相同經歷更加深了我對此片的感受

  相信這部片帶給父母或是孩子的啟發很多

  期許各位爸媽與孩子看完都能從裡面得到收穫



  --'
