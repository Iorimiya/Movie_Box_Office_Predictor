title: 'Re: [情報] 元素方城市爛番茄出爐'
content: '我真的很期待很期待敵視尼今年年底的財報


  深潛....小烏魚子預算2e美金

  宣傳費保守一點抓1.5e

  (不會有人真的相信這部片的宣傳才1e吧？）

  這種大片票房都要成本二倍才算回本

  全球票房樂觀一點最終抓5e

  所以小烏魚子起碼賠2e起跳


  接下來的老套人設換皮教育片動畫元素方程式絕對也虧

  可能不會像奇異冒險哪樣虧1.9e

  但是看齊巴斯光年我覺得很有機會

  也就是虧1e


  然後是匯集大餅臉+漫威史上最爛影集肥胖少女+路人爆炸頭黑女的經期隊長二

  我估計票房跟蟻人三差不多

  可能虧個0.5e


  最後是福伯的畢業作印第安納瓊斯

  這一部目前影評和劇情走向都很不妙

  但是印第畢竟是很多人的偶像加童年回憶

  給福伯一個respect

  祝福這片打平好了


  就算這樣光這四部片下來敵視尼今年起碼也要虧3.5e美金也就是一百億臺幣起跳


  然後D+持續虧損

  周邊玩具除了小尤達古古根本沒一個熱賣


  今年又沒有任何一部像阿凡達二那樣的賣座片carry 虧損

  死抱著SJW 教義不放的敵視尼今年到底能虧出怎樣的一個新高度呢？


  我好期待啊XD




  --


  因為更虧的還陸續要開出'
