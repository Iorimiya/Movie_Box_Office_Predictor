title: '[情報] 《元素方城市》票房破4.23億美元倒吃甘'
content: '皮克斯《元素方城市Elemental》首週在北美僅有票房3,000 萬美元，被評為皮克斯最慘

  淡的動畫電影，但此後，該片的國內首映票房突破了 5 倍多，這是自《玩具總動員》以

  來皮克斯電影的最高票房成績。在全球第八週已突破4.2 億美元。票房倒吃甘蔗，成為20

  23年疫後票房最高的原創電影。




  有機會全球總票房突破5億美元




  日本8/4上映後，穩定佔據前三名



  韓國可說是票房大票倉，自6/14上映以來，票房已超過4780萬美金，預計暑期結束前會突

  破5000萬美金。




  --


  製造2億、行銷1億

  可以全球一起超越嗎XD

  覺得超過小美人魚就及格哈

  對，原本也是看到兩億，後來的新聞更新到1億，想說這部行銷跟其他皮克斯比已經差很

  多了

  對XD 其他爆這麼慘 這部相對好一些。

  看看之前賺這麼多就知道了XD他們不缺錢

  五億可能及格了！

  行銷新聞稿已更新為1億美，製作則是兩億美


  非常有可能都給小美人魚拿去'
