url: https://www.ptt.cc/bbs/movie/M.1704011209.A.04A.html
title: '[好雷] 元素方城市 Elemental'
content: '網誌版



  在回國的飛機上看了這部電影格外應景。故事用了「元素」巧妙的代表「種族」或者「文

  化背景」此類沉重的議題，用詼諧有趣的方式呈現火元素Ember一家與其他元素互動成長

  的故事。Ember的父母年輕時離開故國到了新環境，在火元素的聚落裡創立了自己的小事

  業。Ember的家庭就如同火，炙熱、嚴肅、傳統，父母犧牲了一切成就她，而對她最大的

  期待就是希望她能傳承事業。


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  Ember雖然脾氣火爆偶爾得罪客人，但也非常爭氣努力學習不讓父母失望，卻在一個工作

  的插曲中意外遇上政府檢查員Wade。Wade是水元素，家裡人人多情似水，從不吝展現對彼

  此的感情。兩人的感情逐漸升溫，但跨越元素愛情卻不得到Ember父母的祝福。電影非常

  有趣的利用在香燭上點火占卜來描繪傳統眼光中如何不看好這種水火不容的配對，但Wade

  卻也用創意化解了此次的挑戰。同一時間，Ember也漸漸發現了自己內心真正渴望發揮自

  己的才能，而非繼承父業，但卻不知道該如何向父母開口。


  移民二代的掙扎，隨著故事的高潮迭起被一一攤開，當然，最後有了皮克斯動畫可愛圓滿

  的結局。我最喜歡的是當Ember踏上新旅程時，與父親拜別，父親還禮，是祝福，也是彌

  補自己當年的遺憾。


  --'
