url: https://www.ptt.cc/bbs/movie/M.1694768062.A.278.html
title: '[負雷] 元素方城市，空泛的情感和公式化的劇情'
content: '雷文防雷資訊頁


  元素方城市這周在Disney+上了，看完的感想是慶幸我沒有進電影院看，算是繼二分之一

  的魔法後最失望的皮克斯電影，情感的描述太表面、劇情的設定太公式。


  沒有像靈魂急轉彎那樣看完直擊你的心靈，也沒有像可可夜總會溫暖但不留痕跡的反轉，

  取名Elemental，但實際都是水跟火的故事，和腦筋急轉彎那樣喜怒哀樂各有特色的互動

  完全不同，其他元素根本就是跑龍套的。


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  整部電影貫串也困擾著男女主角的問題是，最後城市大淹水，男主角蒸發，那最後問

  題怎麼解決的，我們不知道，這可能不是電影的重點，但這是男女主角花了整部電影的時

  間關心的問題，如果連怎麼解決的都不說明，那我們前面都關心火

  的家人要怎麼接受水弟嗎？那我們來看看水弟最後怎麼說服他的家人。


  最後男主角看似來英雄救美，但他除了幫忙擋門幫女主角和救了家傳的藍火，實際上他做

  了甚麼嗎？並沒有，他只是剛好和女主角困在同一個空間而逐漸蒸發，沒有犧牲到值得讓

  人流淚，當他從眼淚匯聚慢慢復活時，他們念著台詞，天啊太套路了，這一Part公式到我

  覺得是拿以前皮克斯的劇本出來照抄結局而已。


  我也很討厭男主角說教感太重的台詞，而女主角被說教還一副輕易被說服的樣子，而她的

  人設偏偏是火爆易怒，兩個水火硬容得太尷尬了，直到最後我都沒有被說服，他們的浪漫

  都像是為了浪漫而浪漫。


  嗯他做的就只有這樣，我們整集關心的火跟水在一起要怎麼被接受…嘿結果用20年、30年

  甚至50年前就寫得出來的方法：



  以為固執的老爸結果也開明到不行，所以我們一開始就為了女主角的想太多在浪費時間嗎

  ？


  感覺就是為了趕結局，匆匆把老爸該有的衝突和人設輕輕帶過，女主角也是，搞得好像她

  爸逼著她接店，從小就是她一直說她想接爸爸的店，一直問爸爸她可以接店了嗎？她給我

  們的成長片段和回憶都是她很想趕快接店，讓爸爸休息，結果水弟的一席話她就突然改變

  夢想了。


  說自己是被逼，她不想接店，她想做自己的事，

  ，不要突然改夢想改得這麼理所當然，從小到大的畫面，並沒有透露出Em

  ber有一點點的不情願，沒有鋪陳的情感，最後的傾瀉，一滴都流不進人心，這對男女主

  角真的都沒有辦法喜歡。


  我知道韓裔的導演藏了移民的元素在隱喻，也許是亞裔到美國生活的格格不入，設立了這

  樣一個大方向，但結果卻是草草帶過，我看不出來火是怎麼融入元素方城市的。


  而且水弟一家人不就很開明的迎接Ember嗎？給我的感覺就像這家人在故步自封，女主角

  從一開始就預設太多立場，有一種導演是用充滿刻板印象的方法再教育觀眾不要刻板印象

  ，完全可以理解這部的評價和各大網站的評分，為什麼遠遠不及接近高分的靈魂急轉彎、

  腦筋急轉彎和可可夜總會，劇情和人設實在是太粗糙，太跟著前面的腳步在走，一點新鮮

  感和角色深度都沒帶出來，不推薦。


  --


  我爬了文，我覺得好雷的原因都很牽強..

  也許皮克斯看不多的人會喜歡吧，但對我們這種老粉絲，很難接受啊



  深有同感，不至於到不好看，但確實是會看完感到很失望



  我說空泛的是角色情感，哪裡變成形容別人給好雷的原因？


  我用的是牽強吧，這跟直接批評別人的喜歡空泛是不同的，請不要移花接木



  我同事也很喜歡，我也沒有打算說服她XD就各有各的喜好，人生經歷不同、看過的電影不

  同，覺得好看的程度就不同



  我是搜尋這個版發現好雷還不少啦



  皮克斯其他的電影就不是給小朋友看的嗎？我舉例的可是皮克斯的其他電影，電影本來就

  是一門藝術，你可以輕鬆看待，不代表別人不能認真看待



  靈魂急轉彎我超喜歡QQ 22最後在黑暗裡狂奔的那段重擊我的心臟，哭點超高的我都眼淚

  打轉


  非常同意...角色塑造太扁平，很難投入



  人各有所好，我也尊重你的喜好



  就像我不會去好雷文下面罵這部片一樣，這篇是寫給同樣覺得不好看的人一起討論的，如

  果你喜歡這部電影，又來負雷文生氣，又是何苦呢



  呃 你的推文有比較不自以為是嗎？'
