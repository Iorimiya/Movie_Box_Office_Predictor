title: '[選片] 怪物 or 元素方城市'
content: '各位週五好，週五下班就想看個電影，如題，想請問要看哪一個？


  不太喜歡是枝裕和那種步調緩慢的感覺，看過他的小偷家族及無人知曉的夏日清晨知道這就是他的特色，但就是喜好對不上

  但很喜歡坂元裕二的四重奏及花束般的戀愛，所以在猶豫要不要看這部

  有看過的鄉民可以告訴我這部片比較偏是枝裕和還是坂元裕二嗎><


  然後元素方城市就是

  一直都喜歡腦筋急轉彎或動物方城市這種擬人的動畫片，覺得很有趣～


  再麻煩看過的鄉民再幫我選擇


  --

  Sent from nPTT on my iPhone 13


  --'
