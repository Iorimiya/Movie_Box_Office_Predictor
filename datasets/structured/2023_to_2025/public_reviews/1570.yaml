url: https://www.ptt.cc/bbs/movie/M.1693582304.A.A07.html
title: '[新聞]《元素方城市》從票房毒藥翻身成賣座奇蹟'
content: '新聞網址：


  原標題:


  2023-09-01 22:23:26



  迪士尼影業、皮克斯工作室耗資高達 2 億美元製作的原創動畫長片《元素方城市》（

  Elemental），今年六月在北美上映首週僅開出 2950 萬美元的慘澹票房，名列皮克斯創

  業史上第二低的開票成績，當時各界都認為，《元素方城市》已成註定賠本的票房炸彈。




  。雖然扣除製作成本、行銷成本

  與戲院拆帳之後，這個票房數字可能不足以令迪士尼和皮克斯大賺，但最起碼絕對能免

  去財務虧損的災難。



  而《元素方城市》奇蹟似的成功擺脫原本「票房毒藥」的臭名，似乎也讓迪士尼對此片重

  燃信心，有意將其扶正成一套系列作品。權威票房分析師-傑夫布洛克（Jeff Block）日

  前在播客節目《The Town with Matthew Belloni》受訪時爆料：「





  《元素方城市》的共同編劇-凱特利蔻（Kat Likkel）前陣子曾透露，他們原本有要在結

  局置入一段隱藏片尾，向觀眾展示「水弟」和「小炎」後來有生下一名蒸氣寶寶，假如續

  集或外傳影集的計劃順利成真，或許我們未來還真有機會看得到蒸氣寶寶的登場。



  --'
