title: '[討論] 元素方城市是不是還行啊？'
content: '先說我對於教育事業完全沒意見


  一開始對這部電影沒興趣的原因是覺得水火不容的設定很老梗


  又要走向和解共生 推翻前一代預設的框架做自己這種走向


  總之覺得好像很老梗就沒興趣了


  第一週也只有開兩千多萬想說果然不怎樣


  不過剛剛看它北美票房已經默默來到快1.5億了 世界加總也快4億


  其實這個數字算是還不錯了吧？


  而且感覺除了一開始的宣傳之外好像也沒像小美人魚那樣鋪天蓋地的新聞攻勢


  看它的逐週跌幅也很小 爆米花分數也不錯高


  該不會其實真的是靠口碑長賣的好片吧？



  --'
