title: '[好雷] 元素方城市 這對 CP 我是嗑了'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看完皮克斯和迪士尼兩位大佬的新作《元素方城市》，感嘆著新奇華麗的視覺以及世界觀

  ，

  當中看起來很勇其實卻無法下定決心的火族女孩Ember，遇到了又暖又軟，

  好像永遠搞不清楚狀況但又無所不在的水族男孩Wade，

  兩個從水火不容的冤家變成愛情，不曉得是因為互補還是異性相吸呢？

  這對水火 CP 真的很可愛呀！



  其實在很多時候看到莫名其妙混在一起的人們都會有這樣的感覺：無厘頭？啥毀？

  可是他們就像是Ember和Wade，只要能夠找到彼此間的共同點，就這樣湊在一起了


  這個故事不只適用在愛情上，友情也是如此

  很多可能像是忘年之交、忘形之交，都是不顧世俗眼光而締結的緣分

  看到Ember和Wade，不惜種族反對，或是身理上讓彼此感到稍微不適

  但很多的肢體碰觸創造出的火花，就像是Ember和Wade這樣炙熱

  互相刺激彼此的化學反應對吧～ 我覺得這部分描繪得很好哈哈



  不知道有沒有身在異地戀、忘年之戀 或種種不符合世俗眼光的戀情當中的你們

  看完這部電影也許會受到一點鼓勵和安慰

  兩人如是真心相愛跟適合，一定能攜手突破困難獲得幸福的

  就跟電影中可愛的Ember和Wade一樣，祝福大家有情人終成眷屬！


  --'
