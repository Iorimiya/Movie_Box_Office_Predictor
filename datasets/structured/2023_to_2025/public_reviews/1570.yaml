url: https://www.ptt.cc/bbs/movie/M.1693623839.A.8D5.html
title: 'Re: [新聞]《元素方城市》從票房毒藥翻身成賣座奇蹟'
content: '喪事喜辦的最高境界


  這片成本2億 如果是正常的票房曲線，這部要x2.5= 5億才打平

  (這五億是已經假設PVOD，賣DVD這些都加進去了）


  但這部的曲線是後面長賣，加上莫名高的韓國票房，等於票房都被戲院收走，

  所以才會有要x2.75 甚至x3來計算。(5.5億~6億）


  這部只能說是從一開始的預估虧2億鎂，變成虧0.5億

  媒體真的很愛替老鼠抹粉



  --

  絕對沒有 鞋貓有賣給網飛這邊是確定賺的

  老鼠的串流都是自家左手轉右手而已


  串流電視?哪家有播?還是你說PVOD?那個補不回來'
