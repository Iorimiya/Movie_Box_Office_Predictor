title: '[  雷] 好雷 元素方城市'
content: '雷文防雷資訊頁

  很好看，比想像中更適合大人


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  用化學反應來表達真的很棒，靈魂急轉彎或是急轉彎系列，還有動物方程式已經讓我覺得好

  像很難超越，但這部真的很棒。


  劇情很順，表達手法好特別，題材有水火元素組成很特別，而且各種化學反應真的是長大之

  後來看有另一種風味。長大後才會對彩虹有另一種想法，或是對一些汽化啊，蒸發，覺得更

  美，賦予一層詩意。


  雖然男主有點太大愛的感覺，就感覺很the one，對女生太好。女生真的就是火元素，火爆浪

  子，現實的話我可能被她那樣不承認、否定。不會有勇氣再去示愛。

  但牽手的微微蒸發，女主捏出玻璃都好棒，第一次很驚艷的小爆點就是第一次造出玻璃吧。


  這種化學反應真的好讚哦

  ----

  Sent from  on my iPhone 11


  --'
