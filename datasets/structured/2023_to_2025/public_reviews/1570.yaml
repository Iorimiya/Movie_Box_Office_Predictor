url: https://www.ptt.cc/bbs/movie/M.1689912823.A.2C3.html
title: '[新聞]《元素方城市》首週票房創新低！迪士尼CEO'
content: '新聞網址：



  Yahoo奇摩電影戲劇編輯部

  2023年07月21日



  【文／克里斯蒂】迪士尼影業集團正面臨新的營運危機，旗下動畫大廠皮克斯工作室最新

  電影作品《元素方城市》，近日在北美地區上映票房破新低。對此，迪士尼首席執行長鮑

  勃艾格（Bob Iger）出面發表看法，詳細分析了他認為導致皮克斯近期票房陷入困境的因

  素，其中包括串流平台Disney+的影響。




  。然而，皮克斯工作室在近幾年中，並未能複制過去的成

  功，




  鮑勃艾格分析其票房不理想的原因，


  另外，我想大家必須承

  認，作品上可能也有一些創意性的問題。」



  眾所周知，由於串流平台的興起和COVID-19疫情的攪局，電影行業在過去幾年中經歷了大

  規模的震盪改革，觀眾有很長一段時間內無法進入戲院。然而隨著電影院人氣復甦，似乎

  有一些工作室受到的影響比其他工作室更大，皮克斯就發現他們最近推出六部電影的觀影

  人數大幅下降。



  皮克斯工作室的霉運始於2020年上映的《1/2的魔法》，因為疫情關係中斷了戲院放映期

  ，接下來的三部皮克斯影片《靈魂急轉彎》、《路卡的夏天》和《青春養成記》都直接登

  上串流平台播出。而

  ，對比2017年上映的《可可夜總會》

  ，在沒有前作加持下，仍在北美票房熱賣2.1億美元。皮克斯的當務之急，是找到一種方

  法讓Disney+及其院線電影能夠共生，而不是相互對抗。



  --'
