url: https://www.ptt.cc/bbs/movie/M.1694788397.A.B23.html
title: 'Re: [負雷] 元素方城市，空泛的情感和公式化的劇情'
content: '我覺得現在的電影都在傳達一個很不好的觀念


  你各位帶小孩看真的需要多加開導



  沒有什麼是應該給你的“資產”


  不管是白雪公主的王國


  不管是一間移民的商店



  不是說你小孩一定要自己出來創業


  而是資產的不確定性太大


  你整天在別人面前說


  人家牙起來不給你 你也沒得抗議喔



  資產也不是長輩說要給你繼承


  你就可以整天在人家面前要



  你各位真的不要讓小孩子以為他一定有得繼承什麼


  多的是兩個小時後就被攔胡



  --'
