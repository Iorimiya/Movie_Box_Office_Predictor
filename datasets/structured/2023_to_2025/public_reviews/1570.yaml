url: https://www.ptt.cc/bbs/movie/M.1689421078.A.F98.html
title: '[好雷] 元素方城市 屬於成長過程必經的路'
content: '以下有雷，慎入

  -

  -

  -

  -

  -

  前天剛看完元素方城市，覺得還滿有趣的

  除了四大元素的設定很吸引人之外，還探討了個人成長、愛情、親情的議題

  我自己蠻喜歡當中描述職涯選擇那部分

  從小我就蠻羨慕知道自己興趣在哪、要做什麼工作的人

  之前在選擇大學科系時，我不知道要怎麼辦，但也不想按照父母的安排

  他們總會反問我，那你想做什麼？我也是沒辦法回答

  甚至跟Ember的狀態一樣，偶爾也會被壓力逼到想爆炸！


  印象中元素有段台詞是

  Ember：我一直想努力 接手爸爸的店

  Wade：為什麼要讓別人決定你生活的可能性？


  看完這段後我豁然開朗，因為對照到一開始Ｗade所說的

  Wade其實也不知道自己要幹嘛，算是有點因緣際會做到這個工作

  而他也在嘗試...

  不過，即使不知道自己要做什麼

  也可以什麼都先試試看，至少知道自己不喜歡做什麼...


  這段蠻有共感的，其實包括我現在也是，我大學讀的科系跟我出社會做的職業方向也是完

  全不同

  人的一生中好像有辦法找到自己熱愛還能維持一輩子的工作蠻困難的

  我周邊大多數朋友也跟我一樣，都不算是有明確的工作目標

  不過慢慢嘗試總能摸索出自己適合的方向


  皮克斯的動畫對我來說還是有魔法的

  劇情圍繞親情、愛情、自我意志的矛盾或許有點老套，但這不也是每個人成長的課題嗎？

  我們總能在皮克斯的動畫世界裡看見自己

  天馬行空卻也符合邏輯，在想像與現實裡交錯

  看完電影除了滿滿視覺饗宴之外，也帶走一些感動跟領悟


  --'
