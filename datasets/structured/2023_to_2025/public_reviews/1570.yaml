url: https://www.ptt.cc/bbs/movie/M.1695830425.A.161.html
title: 'Re: [好雷] 元素方城市 小炎的家庭教育心有戚戚焉'
content: '我也愛這部，主題曲有夠好聽的


  但對這部的愛情部分有點意見


  汪水弟就是個紈褲子弟，一事無成，工作一個換過一個


  沒毅力又不努力，反正家裡超有錢，沒事就環遊世界散散心


  而火小炎出身窮苦人家，努力工作為五斗米折腰


  然後....然後就愛上有錢公子哥，過著幸福快樂的日子....



  這個故事如果發生在現實生活


  就是火小炎遠離家鄉後，發現自己沒那麼有才華


  工作挫敗與離鄉背井的雙重壓力讓兩人相處越來越多磨擦


  最後汪水弟被迫移情別戀，火小炎悲傷回到老家顧雜貨店


  某天遇到一個專情老實普男度過餘生



  是不是爛透了但每天都發生在現實生活中


  卡通包裝成一個勇於追求自我，並突破種族歧異的美妙故事


  不得不說迪士尼很厲害，而我也是看得很開心，最近兩周大概看了4次 XD




  --'
