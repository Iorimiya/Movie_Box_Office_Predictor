url: https://www.ptt.cc/bbs/movie/M.1680025397.A.3F2.html
title: '[討論] 皮克斯新作〈元素方城市〉完整版預告'
content: '導演是Peter Sohn，執導的前作為《恐龍當家》。


  補充一下：

  《恐龍當家》在製作過程中遇到很多問題，

  包含創意結構的分歧，皮克斯內部資源的分配等等，

  導致原本的導演被撤換掉，而Peter Sohn是之後進來救火的第二任導演。



  雖然水火不容的劇情感覺是有點老哏啦，

  不過還是很期待會不會有什麼出乎意料的創意與驚喜～



  臺灣預計六月底上映。










  --'
