title: 'Re: [情報] 元素方城市爛番茄出爐'
content: '拔了好嗎?你是聽老鼠還是媒體的？

  沒拔的話老鼠就不會告佛州了，沒拔的話艾格就不會股東會爆氣罵DeSantis


  你會以為沒拔是因為媒體當初報導說Reedy Creek 轉換管理時老鼠最後一秒

  塞了一些但書，保留很多既有權力，媒體就說DeSantis被擺一道，老鼠沒有

  失自治權。 後來DeSantis取消老鼠的但書，老鼠就去告佛州，現在還在等

  初審。現在Reedy Creek Improvement District (RCID)已經被佛州新的管理

  會取代。


  現在老鼠已經喪失大部分的特權（蓋機場，蓋核電廠，自我驗收等等)，回歸

  到新的管理會，全部都是佛州州長與議會指派的。


  老鼠與艾格還在股東會上犯了大錯說了老鼠=RCID，這邊有犯稅法的問題，因為

  RCID賣特殊債是免稅的，但如果是公司債要繳稅。但老鼠自己說溜嘴說自己就是

  自治區，變成之前都沒繳稅，已經開始刑事調查了。這些老鼠跟主流媒體都沒

  特別報導因為DeSantis要選總統，所以要宣傳他連老鼠都打不贏，這邊政治的眉角

  很深的。


  --'
