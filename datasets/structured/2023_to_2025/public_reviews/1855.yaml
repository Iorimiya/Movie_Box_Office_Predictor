title: '[情報] iTunes多部$80起 日麗.坂本龍一OPUS.月球'
content: "完整片單如下 :\n\n$90 坂本龍一．OPUS : \n\n爛蕃茄100%，坂本龍一的謝幕音樂影像作品。\n\n「這個電影的構想，是以一種值得保留到未來的方式去紀錄我的表演——在我還能表演的\n\
  時候。」 - 坂本龍一\n\n-\n\n$90 日麗 : \n\n爛蕃茄96%，算是前近年獨立電影圈現象級作品，保羅麥斯卡有入圍奧斯卡最佳男主角，\n當年也拿下時代雜誌年度10大佳片。\n\
  \n-\n\n$90 月球隕落 : \n\n真．空想科幻災難之作，災難片果然還是要看羅蘭艾默瑞奇，就算常被國外影評批空有大\n場面，但就是有個醍醐味在，很適合暑假娛樂性很夠很滿。\n\
  \n\n$90 追海豚的長崎夏日 : \n\n類似 \"站在我這邊\" 那樣的少年暑假冒險故事，有對異性的好奇，有滿滿夏天跟冒險氛圍\n(影像質感大好)，只是沒有屍體，豆瓣有到8.5分。\n\
  \n-\n\n$90 天龍八部之喬峰傳 : \n\n甄子丹自導自演金庸經典作品，雖然劇情稍微微妙，但幾段武打不管是場景還是結合特效\n的方式真心有爽到，能看出來甄子丹作為導演的野心。\n\
  \n-\n\n$80 月光下的藍色男孩 : \n\n橫跨20年的成長故事，爛番茄98%，拿下奧斯卡最佳影片、最佳男配角以及最佳改編劇本3\n項大獎。\n\n-\n\
  \n$80 困禁 : \n\n有點類似 \"戰慄空間\" 風格的驚悚片，狹小空間與反派的求生與鬥智。\n\n-\n\n$80 刺殺小說家 : \n\n繡春刀系列導演的史詩奇幻作，雷佳音主演，最近快要推出第二部，口碑還蠻不錯。\n\
  \n\n$80 乒乓少女大逆襲 : \n\n新垣結衣．瑛太 主演熱血運動劇\n\n-\n\n$90 鄰人X．謎樣的女子 : \n\n獲獎小說改編，社會議題派小品科幻片，劇情的設定就跟MIB一樣，整個日本社會已經有\n\
  非常多潛藏的外星人。上野樹裡．林遣都．黃姵嘉 主演。\n\n\n\n\n\n--"
