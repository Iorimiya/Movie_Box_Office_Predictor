url: https://www.ptt.cc/bbs/movie/M.1677264044.A.3AE.html
title: '[好雷] 日麗'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  近年以電影《神之造物》、《失去的女兒》與影集《正常人》走紅的愛爾蘭男星保羅‧梅

  茲卡爾，在蘇格蘭導演夏洛蒂‧威爾斯的長片處女作中，超齡演出父親的角色，一舉入圍

  奧斯卡最佳男主角獎。旅行本該快快樂樂，但《日麗》在描繪一場父女同行的假期時，隱

  含著淡淡的哀傷。



  充滿好奇心的11歲女孩蘇菲和她年輕的單身父親卡倫，一起前往碧海藍天的土耳其渡假。



  從卡倫幫蘇菲擦防曬油、各種細心呵護到教授防身術，不難看出他是一位好父親，或至少

  他試著成為一名好父親。電影開始時，假期早已開始，觀眾對卡倫與蘇菲的認識是後續透

  過兩人的對話慢慢建立。卡倫20歲時成為蘇菲的爸爸，但不知為何他並沒有與蘇菲的媽媽

  成婚。在這段假期的不少時候，導演都佈下巧妙的暗示，告訴我們即便愛蘇菲，卡倫並不

  是一位負責任的「大人」。他在有孩子需要照料時毫不猶豫點下第三杯啤酒，他也在經濟

  不寬裕時衝動買下非必需品的手工地毯，他仍舊是當年那個尚未成熟的毛頭小子，這可能

  也是為何蘇菲的媽媽並未選擇與他成家。



  即使極力掩蓋自己的傷痛，成熟的蘇菲還是或多或少感受到爸爸的哀傷。不論是只能住在

  房內沒有電話的飯店，還是參加完渡假村活動後必須逃跑不給小費，甚至是「打腫臉充胖

  子」承諾蘇菲要送她去上歌唱班，但其實自己根本沒有財力。雖然收入不是一切，但如今

  已經31歲的卡倫連自己都照顧不了，更遑論把蘇菲照顧好。所以，就算當年的小蘇菲認為

  自己已經感受到父親的陰鬱，也盡量體諒對方，但都遠不及卡倫實際憂鬱的程度。



  片中以「跳舞」來象徵多處喜與悲，蘇菲多次稱卡倫的舞步讓她感到尷尬，但仍然會笑著

  欣賞爸爸在舞池裡快樂地舞動；過去與現在虛虛實實的交會成為一支黑暗舞池中的舞，成

  年的蘇菲試圖理解當年的父親發生什麼事，但卻無法如願；隨著歌曲《Under Pressure》

  樂聲起舞的卡倫與蘇菲，享受著兩人共有的當下，渾然不知歌詞裡所唱真的是他們的最後

  一支舞。即便平常總是嫌棄爸爸的舞步，但蘇菲還是很喜歡且珍惜與爸爸共舞的時光，那

  是多美的一幅景象啊。



  除了透過音樂與舞蹈傳達的愛意之外，片中出現很多「家庭錄影帶」的畫面。不論是以懷

  舊的質感播出錄製好的畫面，還是呈現給觀眾看當年蘇菲拍攝時的情況，父女之間最可愛

  、最自然的互動表露無遺。不過，鏡頭之外才是最真實的卡倫，而他將最好的一面都留給

  女兒的攝影機。當卡倫向蘇菲表示自己不想在鏡頭上談11歲的生日，蘇菲不但照做，還非

  常暖心地表示自己會以大腦攝影機記錄下爸爸的答案。待這趟旅程差不多到尾聲之時，觀

  眾也才意會到，原來方才這一段將近兩小時的旅遊回憶與紀錄，都是成年的蘇菲看著過去

  的家庭錄影帶懷想父親。由於當年的回憶太過美好，當一切結束，事後回想，才會更加難

  過。



  《日麗》裡呈現出許多旅行時會遇到的各種狗屁倒灶的事，但是，不管好事還是壞事，全

  都是旅行的一部份。其實，只要一起旅行的人是對的，一切的不順心都能一笑置之。既然

  這趟旅行是卡倫與蘇菲最後一次一同出遊，那麼所有的回憶都最刻骨銘心。無論是飯店誤

  將兩人的雙人床房訂成單人床房，還是飯店對面正在施工吵雜聲不斷，甚至是弄丟潛水鏡

  或心煩意亂地吵架，在成年的蘇菲眼裡看來，都肯定是最難能可貴的經歷，畢竟再也沒有

  機會創造出這樣的回憶。



  踏上這趟旅程的蘇菲11歲，正值青春年華，即將進入青春期情竇初開的年紀，面對渡假村

  裡的「小小孩」，蘇菲有種「小大人」的成熟與傲氣，認為自己更該屬於大孩子那一群。

  然而，大孩子們將蘇菲看作小孩，純粹由於她撞球打得好而讓蘇菲加入。不管是罵髒話、

  聊情事、接吻愛撫，他們都認為不該「汙染」蘇菲，卻不知她早已看在眼裡，對懵懂的愛

  也有著憧憬。



  女孩往往較能與媽媽分享心事，但當蘇菲告訴卡倫自己與一起玩遊戲機的男孩接吻，一直

  努力成為好父親的卡倫極為真心地說出全片最感動人心的話：「我希望你明白，隨著你長

  大，無論以後遇到什麽事，去什麽派對，遇到什麽男孩，都可以隨時講給我聽。」不論卡

  倫在這趟旅行後是自殺、意外身亡，抑或只是覺得無法照顧好女兒的自己沒有資格再與她

  見面，他們之間的父女之愛永遠存在於這句話所乘載的意義、充滿回憶的家庭錄影帶與蘇

  菲每天起床後腳下踩著的那塊土耳其地毯裡。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
