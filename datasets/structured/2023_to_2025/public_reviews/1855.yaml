url: https://www.ptt.cc/bbs/movie/M.1676823280.A.23B.html
title: '[好雷] 日麗 片名及內容雜感'
content: "覺得這部電影的中文片名翻譯得真妙\n日麗 寫在一起 就是曬\n像底片一樣 曝光後越來越清晰\n也代表離發生的當下越來越遠了\n就像拍立得裡面 比著勝利V的爸爸\n\
  也許表示這趟旅行成功了 但也結束了\n\n英文Aftersun 看IMDb有人說\n片名就像一種曬後乳液名稱\n用來安撫曬傷的疼痛\n那些留下來的影片紀錄\n\
  就是故事之後療癒的處方嗎？\n\n我很喜歡這部片裡 影片後拍攝的人\n看影片的人 還有影片裡的人\n三種角度很巧妙的跳轉\n有一段 女兒說著爸爸131歲了\n\
  兩人的身影映在沒有開的電視螢幕上\n也是非常有意思的設計\n\n爸爸跟女兒在機場說再見後\n鏡頭的後面是一個安靜的走道\n他推開門 進入了舞池\n從門的這頭看\n\
  彷彿走進「什麼都沒有」的空間\n也像是暗喻面對女兒之外\n他的人生是那扇吞噬掉他的、安靜幽深的門\n\n而門的另一頭\n爸爸走入（或說走出）門之後\n兩人再次見面就是在像夢境一般的舞池裡了\n\
  我對舞池的解讀是\n每次女兒看影片 或回想頭腦存檔的畫面時\n都模模糊糊地遇到了爸爸\n某天看到他的痛苦\n某天看到他的側臉\n某天終於在這種遙遠虛幻的相遇之中\n\
  跟爸爸擁抱\n\nAftersun 也讓我想到陳綺貞的歌「太陽」\n整首歌的歌詞都讓我覺得很像爸爸的心聲…\n「我是我 疲倦流浪的太陽。\n   無法為自己 無法為誰\
  \ 靜止下來\n\n   我是我 一碰就碎的太陽\n  我熱切的希望\n  能在消失之前\n  得到信仰」\n\n真的是後勁很強的一部電影\n感覺寫出故事的人\n\
  經過很深刻的沉澱\n才能把這些灼熱 疼痛 心裡的種種翻騰\n變成顏色和諧的畫面\n\n\n\n--"
