url: https://www.ptt.cc/bbs/movie/M.1677136449.A.950.html
title: '[無雷] 日麗 - 烈日之後  只剩陰影'
content: '《日麗》6/10分


  簡單來說就是父女VLOG?

  整部片就是很日常的出遊紀錄

  穿插一些DV片段與幻境


  不時提到父母為何離異

  以及女兒天真無邪的想法


  以極平實的旅遊片段紀錄這對父女相處的點點滴滴

  甚至沒有太大的劇情轉折

  就像是每個人小時候跟父母出遊一樣

  有點無聊 有點小爭吵 有點暖心時刻

  但回想起來

  這些都是無法再重來的珍貴記憶


  看的時候並沒有太多感受

  直到電影收尾後

  卻越來越能感受到電影的後勁

  隨著年紀的增長 感受會越來越大


  就像英文片名一樣 aftersun

  出遊的這段時間

  就像在陽光下般的充滿活力與親情悸動

  但結束之後

  剩下的卻是離別的感傷

  與不知何時才能再見到女兒的惆悵

  父親回到現實生活中繼續苟延殘喘

  女兒回到沒有父親陪伴的城市


  一切在烈日之後  只剩陰影



  --


  無雷 電影/影集短評IG：




  --'
