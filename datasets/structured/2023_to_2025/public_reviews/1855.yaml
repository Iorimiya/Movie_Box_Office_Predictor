url: https://www.ptt.cc/bbs/movie/M.1676905053.A.741.html
title: '[  雷] 日麗觀後感討論「悶，尋無答案的為什麼」'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  劇情概略》》


  觀影的我們，跟著31歲的蘇菲夢醒、惆悵，尋索31歲的爸爸那時是怎麼的樣子？


  破破碎碎的回憶自己11歲時、爸爸31歲時

  跟著已離婚分居的爸爸在土耳其度過生日長假


  想到這場旅行有一些經濟窘迫，但爸爸還是盡可能的好

  爸爸有一些悲傷，傷口，不知道從何而來


  有一些錄影，父女聊天，嘰哩呱啦日常

  彆扭爭執愧疚，爸爸教我打太極、防身術


  平平淡淡地點點滴滴

  很珍惜很珍貴不想回家，只想留在當下

  那時候的爸爸是怎麼樣的


  那時候的我，也想要飲料喝到飽，好想要玩飛行傘，開始步入青春期，懵懵懂懂理解男女

  ？性，男男？ 嘗試戀愛


  期待爸爸跟媽媽復合，那一晚爸爸不知道怎麼了，晚上都不在房間..


  現在的我也有了自己的伴侶孩子，好像約略知道爸爸的心情


  爸爸喜歡跳舞，但轉身就自顧自的走去舞池跳舞了...


  觀後心得》》


  心裡看完很惆悵，沒有答案悶悶的

  有點莫名其妙，又感受得到爸爸對女兒的愛

  ，女兒對爸爸的愛只能拼拼湊湊，看心得找答案


  再連結電影前面旅行的片片斷斷，可能爸爸有些精神心理問題，有些不對勁，有些巨大的

  悲傷，


  看完後，我像是蘇菲在燈光明滅的舞池遇到跳舞的爸爸，想著他...為什麼...試圖拼湊出

  答案，但沒有解答


  納悶不解，思念,愛......




  --'
