url: https://www.ptt.cc/bbs/movie/M.1676483018.A.3C9.html
title: '[極好雷] Aftersun日麗'
content: '防

  個

  雷

  雷

  雷

  雷

  雷

  雷

  雷

  雷

  雷

  雷

  雷

  雷

  雷

  雷

  雷

  ＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿



  看完《日麗》，我的心情卻如陣雨。



  從上禮拜六到今日，仍是一種很深沉的憂傷。

  這部片潛藏的情感，如此幽微，又如此龐大，

  以朦朧的面目盤踞在我心中。無以名狀。



  初時被片名吸引，如今卻成為美麗的錯誤——

  如果「日」是那段時光的隱喻，那麼，

  在多年以後也無論如何都不可能明「麗」的。



  因為「麗」這個字有一種美好、乾淨的質地。

  當年的日光或許明亮而熾熱，

  多年以後，也只會成為DV錄像的粗糙顆粒。

  11歲的蘇菲或許年紀還小，

  然其早慧、易感，更接近青春期的少女。

  渡假的時光並不總是美好，

  父親滿懷著心事，她當真懵懂無知？



  相較「日麗」，

  英文片名aftersun多了一點暗示，

  在日光的背後、在那段時光之後，

  導演欲言又止。



  你看了電影簡介，

  以為這部片從頭至尾都是成年蘇菲的視角，

  泯除了年紀的差距，試圖擁抱當年的父親。



  看了電影才發現，

  實際上仍有一些，即便是長大了也無法知曉，

  有關個體生命的孤寂。



  幼年的蘇菲不知道，成年的蘇菲也不知道。

  而導演讓你知道，在機場告別的，

  其實不是那個東跑西跑奮力揮手的女兒，

  而是那個，轉身離去、走進昏暗舞池的父親。



  逝者已矣。

  徒令人惆悵。


  ..

  ----

  Sent from on my Sony G3426


  --'
