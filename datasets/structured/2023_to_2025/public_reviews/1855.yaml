url: https://www.ptt.cc/bbs/movie/M.1676821192.A.841.html
title: '[好雷] 《日麗》Aftersun的影像時代性 '
content: '蠻喜歡大部分前段的自由感，但結尾必須刻意有點不喜歡





  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  《日麗》絕大部分作為更「純粹的影像」，意思是電影幾乎沒有什麼劇情，或是說更接近

  「生活」。像是好比自己的「無聊」回憶，那種跟家人出去玩的「凝滯時空」：好像也沒

  幹嘛就這樣逝去了。



  經驗過就代表擁有了嗎？那麼擁有是什麼？



  說是把《日麗》看成攝影的敘事方式，除了是構圖往往並非是工整，而是如同塑膠相機日

  常中的隨興拍攝，只是一種當下感覺，更接近某種散文性的自然與自由。



  《日麗》除了在旅遊紀錄的DV與電影底片的畫質切換中交叉回溯，幾乎是唯持直線的感性

  敘事，並非像如南韓導演洪常秀在日常中帶點理性利用蒙太奇翻玩結構，《日麗》一直到

  了接近片尾必須給出明顯的意義之中透露出的不自然感，拉出的「戲劇」反差，因為唱歌

  事件的賭氣，帶出海灘的死亡意象與結合像是夜店閃爍燈光的時間暫留感強化，女兒到了

  父親DV影像中年紀的時空相遇。



  也許電影的劇情只是一句話就能概括：「蘇格蘭單身爸爸（已離婚）難得帶著女兒去土耳

  其旅遊，及隱隱透露其失落過去。」說是父女的感情描寫覺得只是基礎，更像是父親藉由

  女兒延續自己的生命，並查覺到自己正在失去生命。



  像是藉由影像的接力（如藝術家登曼波的《父親的錄影帶》），更像是某種的輪迴，《日

  麗》不斷重複招喚（recall）的「時代性」，是此時與彼時的影像本身，與它的不同畫質

  交互溶接（dissolve）。



  --


  拉特飯 - 以商業力量進入獨立市場


  --'
