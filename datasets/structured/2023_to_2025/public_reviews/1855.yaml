url: https://www.ptt.cc/bbs/movie/M.1688276540.A.400.html
title: '[心得雷]《日麗》：在明亮與晦暗間循環往復 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~








  《日麗》：在明亮與晦暗間循環往復的生命實相


  致謝Savoir｜影樂書年代誌刊登本文：


  “蘇菲（Sophie）：我想我們分享同一片天空很棒。（I think it''s nice that we

  share the same sky.）

  卡倫（Calum）：什麼意思？（What you mean?）

  蘇菲（Sophie）：嗯就像...有時在遊戲時間，我看向天空，而弱我能看見太陽那麼...我

  想我們都能看見太陽的這件事，即便我們不在同一個地方而我們不真的在一起...我們有

  點像，你知道嗎？就像我們兩個都在同一片天空下，所以...有點像在一起的感覺。”


  《日麗（aftersun）》的片名中英文正好作為對比，一者為如同日正當中的普照陽光（日

  麗之時），一者則是在這個時刻的之後（aftersun）。這種時間序的間差正好對應到故事

  的形式，分別是31歲與11歲的年齡、成年與童年、現實與回憶。


  在後見之明我們可以知道的是故事來自於蘇菲的記憶，一個在90年代與父親卡倫在夏日假

  期前往土耳其由DV影像記錄下的旅行。影像所能記錄的必然只是片段，影像沒能紀錄下的

  只能由回想來填補，別說數日前的記憶已然模糊，何況故事是在31歲的蘇菲回憶著11歲時

  的自己與父親，尤其這段快樂回憶更可能是在不斷地回憶而更加地清晰，同時，也模糊。

  人類的記憶之不可靠在林肯的法律故事中已被說明證人的證詞可信度是可疑的，我們所以

  為的真實往往只是主觀的認知，與客觀的真實往往有若干的距離。


  11歲的蘇菲處在青黃不接的尷尬時期，也就是青春期，電影畫面可說就是蘇菲的記憶，記

  憶中她在廁所中聽見了同年齡層的少女與男孩的性事，在玩電動機台與男孩麥可（

  Michael）認識到片尾的初吻，與大自己一些的青少男女打撞球與到泳池，看著他們擁抱

  與接吻，在這些畫面的暗示下讓我不禁想到庫斯杜力卡在《亞利桑那之夢》中的台詞提到

  ：「艾克索（Axel）：我的英語老師說到這個俄羅斯傢伙說如果你在書的前半看到槍，你

  可以確定在後半一定會開火。有人會去用那把槍。」尤其在電影的「R」級分類下，在常

  規的劇本安排中預期著會出現血腥或暴力的情節。但這些完全都不被劇情所包含，卻不過

  是一個簡單的童年夏日假期回憶。


  但這並不代表電影是歡樂的，日麗之後的日後（aftersun）同時代表著時態與狀態，日麗

  可說是11歲時童年的繽紛，日後則是31歲時成年的晦暗，連接這兩者的是DV的影像，而在

  「現實」的時態中，蘇菲也正是在這成年的色區。回憶中的31歲父親卡倫，已經離婚且與

  約會對象並不順利，經濟狀態可能也不甚樂觀。除此之外，卡倫的行為也有些莽撞，例如

  站立在陽台欄杆上、把刷牙泡沫吐在飯店鏡子上、對晚餐的表演丟擲物品、沒有潛水執照

  卻仍潛水、喝醉酒走入海中再裸睡於父女共享的床上。但他對待蘇菲仍然是溫柔的，他在

  蘇菲與其他青少男女互動時陪伴著她，甚至說出了作為父親十分溫暖的話語，即告訴蘇菲

  無論發生什麼都可以告訴他、嚴肅認真地教導她防身術。我們看見了角色扮演，我們小時

  看見的某些「大人」其實不過是這些人扮演「大人」的樣子，這件事情在我們成長的過程

  其實就能發現，我們其實跟小時的自己並沒多少不同，我們不過是在年幼者面前表現出長

  者的姿態而已。或許卡倫是在逞強，故事中的他經常打著太極，調節著呼吸似乎要壓抑住

  什麼，這個什麼，是故事中的蘇菲記憶沒有說清的，也不可能說清的。


  而這或許要被壓抑的「什麼」，是卡倫向蘇菲吐露的他的11歲童年。在他的11歲生日沒有

  人記得，而他告訴了他的母親，然而卻使得母親憤怒，憤怒著要求著卡倫的父親帶他去買

  玩具。這看似沒什麼大不了的小事，但卻足以作為童年創傷。在我們成長的過程中也有諸

  多類似的事情，這些事情對於作為外人的我們無足輕重，但卻可能是那位孩子成長過程的

  瘡疤。


  我們以為孩子不記得的，反而孩子都記得。


  當然，卡倫也面臨著其他的問題，然而電影中的兩個時間點之一的11歲，那時的蘇菲在生

  日時卡倫也因醉酒而無法與其完成每次生日上台唱歌的慣習。這件事對於我們作為觀者，

  甚至是作為成人的卡倫，是無足輕重的，然而，在31歲蘇菲的故事現實時間中，色調同樣

  是黯淡的，我們或許可以猜想這也成為了她的童年創傷。


  在電影中，除了敘事之外，也有著31歲的蘇菲在記憶中與31歲的父親在陰暗的舞廳中，看

  著父親埋頭跳舞，而這對應著假期的尾聲中卡倫對蘇菲跳舞的邀請在蘇菲的拒絕後一人在

  舞池中舞蹈著。舞蹈通常有著快樂的意象，但在我們對故事的了解中，卡倫閉著眼跳著舞

  反倒像是一種「他的太極」，一種讓自己平靜的方式，透過持續地擺動來平衡內心的紛擾

  ，就像負負得正一般，內心的騷亂必須經由肉體的同頻才能中和。


  我們在電影的結尾見到蘇菲（31歲）擁抱了卡倫（31歲），這就像蘇菲（11歲）在夏日假

  期中請託眾人為父親唱生日快樂歌一般，而在這段之後隨之而來的是卡倫一個人在房裡的

  嚎哭，雖然童年創傷並非那麼容易—甚至不可能被治癒的，但這是蘇菲對父親的愛所做出

  的努力，就像從片首到片尾在舞廳中狂舞著的卡倫最後被蘇菲擁抱一般。


  11歲是個童年與青少年兩個期間的尷尬時期，這時的個體（孩子）處在「青春期」的階段

  而會有各式各樣的變化或是起伏，這些都能被世人所理解與體諒。但同樣的，31歲也是在

  成年後與接近中年的尷尬時期，這時的個體所處的期間卻沒有一個適當的名詞可以代表，

  似乎像是經過了青春期之後的個體就靜止一般直到65歲才進入老年，諷刺的是在老年之前

  的那段時間，反而有更年期可以去解釋那時期的行為。但31歲也是成人之後要進入「壯年

  」的時間，也同樣會有如同11歲時的徬徨與不安、困惑與抑鬱，然而這時的個體已經「成

  人」，卻不再如11歲時有父母的照護。回到前述的童年創傷的連接點上，31歲的蘇菲也與

  其同性伴侶有著孩子（或許是領養），因此整個故事成為一種循環，童年創傷的循環，試

  圖治癒的循環。


  另一項在電影中出現的物件是卡倫在土耳其買的地毯，這張地毯出現在31歲蘇菲的房間裡

  ，我們不曉得是否卡倫已經死了，但在電影最後的360度鏡頭從DV影像轉到31歲的蘇菲再

  轉到關起DV走向門後一片黑暗的卡倫時，我們可以說卡倫已經離開了蘇菲的生命，無論他

  是生是死，至少這段夏日假期是蘇菲所保有的對於卡倫最美好的回憶。那片門後的黑暗我

  們可以說是舞廳，回到舞廳的卡倫必須持續地舞動，不停地轉，來平息自己。事物的兩面

  性如同日一般，日麗與日後，日後又再是日麗，就如同11歲與31歲、親子之間的循環往復

  一般，生命之間就這樣交纏擺盪著，電影描寫著這樣的生命的實相。










  --


  エル・プサイ・コングルゥ


  --'
