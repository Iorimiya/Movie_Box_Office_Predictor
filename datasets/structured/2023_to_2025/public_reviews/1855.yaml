url: https://www.ptt.cc/bbs/movie/M.1676940275.A.E4A.html
title: '[好雷] 日麗 這就是我想要的國片啊'
content: '雷文防雷資訊頁





  晚上場

  賣藝術電影的票價

  看的人比想像中多很多


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~









  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  其實也沒什麼好防雷

  故事非常簡單

  31歲的離婚爸爸帶11歲的女兒去土耳其玩


  全片有90%的場景都是在度假旅館和土耳其的觀光點

  女兒 就是個常見的小屁孩

  在爸爸鼓勵下 跟其他旅客一起打電動 打撞球 打水球

  看到別的青少年玩親親 也會想玩親親

  覺得自己爸爸很摳 很羨慕別人有飲料免費喝到飽的手環


  爸爸 就是個常見的中年人

  戲裡沒有對他旅行前的背景交代太多

  很想花錢 又很節省 又想展現愛女兒的一面 自己好像又很不開心

  好像隨時會跑去自殺 但是從頭到尾也沒真的去

  整天看太極的書 練了兩手太極 打起來卻顯然是初學者


  沒有什麼核心的大事件

  來度假 度完假回去

  唯一一個不可解的場景

  就是非常黑、閃光燈狂打的舞廳

  爸爸跟未來的女兒在跳舞


  這個作品的自溺程度 絕對不亞於台灣國片

  整體的影片成本 也應該跟台灣國片差距不會太大

  但在便宜與自溺之下 卻是滿滿的寫實細節

  爸爸的骨折的手 女兒的曬傷

  看到散場時(對啦 就是那個奇妙的結局)突然感覺到

  這不就是國片常見的題材嗎?

  很文青 很憂鬱 看不懂

  可是如果國片都能拍成這樣

  那我要看10部


  --'
