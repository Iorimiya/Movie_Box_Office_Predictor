title: '[好雷] 日麗 Aftersun 2022英國電影'
content: '雷文防雷資訊頁


  日麗

  Aftersun

  2022英國電影




  『★橫掃影展多項大獎 ★入圍奧斯卡影帝 在土耳其藍天下共度難忘的父女假期、久久不

  能忘懷之深刻情感。』每當風和日麗，我就想起你......充滿好奇心的11歲女孩蘇菲，和

  她年輕的單身父親卡倫，一起前往碧海藍天的土耳其渡假。即將成為青少女的她，珍惜與

  父親難得的共處時光，那裡的每一件小事，更不知不覺刻劃出他們互為磐石的情感。20年

  後，她回想起那年夏天的記憶碎片，熟悉又陌生的父親，逐漸顯露出她不曾察覺的憂傷..

  ....



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  這部片上架後，立刻吸引我追看，因為三月初看過這超級精彩的腦補超多之影片心得文，

  印象深刻。




  影片看完後，對於習慣看娛樂片的我，真的感覺平淡無味咧，雖然有些隱藏的點滴挺耐人

  尋味，卻又搔不到癢處。


  結果再看一次上列那腦補文章，茅塞頓開，竟然好看回味的程度大幅提昇，不敢相信。



  這片單純看父女的對手戲，眾人度假的生活日常及土耳其風景，可能會感覺索然無味？但

  是若心思再細膩一些，會感覺到棉裡針，令人有點刺痛？是一部很有意思的影片。


  日麗Aftersun的片名，會聯想到風和日麗？其實看完劇情，會偏向那篇腦補文的看法：是

  曬aftersun...


  總之，本片是一部細思極...的好片？


  本片個人滿意度80（滿分100）。沒有再看那篇文章的話，滿意度是70.


  日麗

  Aftersun

  英國電影


  --


  就是三月初看到的本片蘇致亨心得文大作，感覺很有趣啊。上週hami上架後，就追看了。



  取中文片名，很會。



  的確如此，提升看片後回味好看的程度。



  對啊，大開眼界，大開腦洞。哈哈哈。'
