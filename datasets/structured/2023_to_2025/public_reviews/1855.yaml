title: 'Re: [好雷] 《日麗》Aftersun的影像時代性'
content: '看了這片感覺小女孩真可愛

  還有沒錢結婚婚子就會這樣

  難怪現在一堆人不婚不生

  看到那個爸爸簡直把我給演活啦

  我看到他被女兒給氣跑了之後

  在外遊蕩把路過美女丟掉的菸蒂撿起來抽

  完全是我會做的事情，沒想到被他演出來

  還以為他抽著菸就走去海裡自殺

  原來會游泳只是去海裡冷靜冷靜


  還有想玩拖曳傘但太貴了沒錢玩

  還找藉口說小孩太小了不適合玩

  才會被一句沒錢還搶著買單激到

  一直不知道男主角的工作是什麼

  難道是在夜店工作？酒保、毒蟲、圍事？

  所以最後送走女兒後又再回去夜店生活？

  感覺那個女兒很愛他爸爸

  所以心裡才容不下第二個男人


  這片感覺是導演在拍她跟爸爸的暑假故事

  11歲時一起去土耳其玩的回憶

  還看到1997年當時流行的舞蹈

  所以小女孩長大後拍電影就把這段拍出來

  估計小女孩的媽媽家應該非常有錢

  所以男主角高攀不起才會分手

  就像歐洲我的野蠻女友一樣

  女強男弱大部分都這樣

  而且沒錢也很難當導演

  沒錢也不會想玩拖曳傘

  表示小女孩應該過得很富裕








  -----

  Sent from JPTT on my iPad


