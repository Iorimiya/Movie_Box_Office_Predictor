title: '[好雷]日麗 aftersun '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  朋友圈中最熱的一部片，從知道開始就一直無法放下期待的心情，終於在此次連假去華山

  看了早場。

  看完，想說它是近期最喜歡的一部電影，或者應該說最接近我心中電影樣貌的電影。故事

  幾乎不直接說明所要說的東西，而是透過影像及聲音的剪接，讓觀眾自行在腦中合成故事

  。


  一開場我就被它的聲音吸引，接著是錄影機的畫面，然後快速閃光的現代影像，再過來才

  回到故事：小女孩與父親的最後一次旅行。在這條故事主線裡，我們看到是十一歲的小女

  孩的視角，關注的是她對性與關係的好奇與探索，但父親的狀況慢慢進入到我們的視野，

  讓我們無法忽視他的陰影。因此這是一部成長電影，同時是一部憂鬱與愛的電影。


  用說的一點意思也沒有，用看的卻回味無窮。我想這是這部電影於我而言最具魅力之處。



  ***


  這裡是我的樂園:




