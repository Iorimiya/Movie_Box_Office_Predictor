url: https://www.ptt.cc/bbs/movie/M.1678699787.A.820.html
title: '[好雷] 日麗'
content: '【日麗】講述一對父女出遊度假，慶祝父親的30歲生日，旅途中留下許多美好的回憶。

  -


  看預告跟無雷介紹，大概知道是那種能洗滌心靈、畫面唯美的電影，


  但原本以為它是走正向能量的路線，這部演到後面卻滿滿的負能量XD

  -


  雖然是出遊玩耍，但電影呈現的氛圍非常沈重陰鬱，


  電影也馬上把這氛圍和父親的心理狀態連結在一起。（片頭也有暗示）


  父親的人設在開頭就一目瞭然，年輕爸爸、早已和媽媽離婚，經濟和心理狀況皆不佳。


  即便這趟旅行在名義上的目的是要慶生，


  但他一點都開心不起來，和自己獨處時常常是憂鬱大便臉。而途中他也不斷被戳傷疤，


  像被誤認是哥哥、潛水教練分享自己成家、女兒詢問11歲生日等等，


  但他只要回到女兒身邊就會收起情緒，對他來說，這一切都是為了女兒。


  他對女兒各種體貼呵護，互動也不是傳統上對下的關係，更像是溫柔的大哥在照顧妹妹。


  前段可愛的親子互動更襯托父親後面和女兒吵架的懊悔，


  電影也不斷暗示他的自毀傾向，讓氛圍又更加沈重。

  -


  後段女兒長大的flash forward讓主題逐漸明朗，


  整部電影像導演的回憶錄，同時也是獻給父親的情書。


  破碎的敘事、時不時用DV的呈現也都像人們回憶一段過往的感覺。


  女兒11歲時無法理解父親矛盾的情緒，


  當年的天真爛漫與好奇心都對比她未來對父親的同情與理解。

  -


  電影中呈現父親的孤獨就像是每個人在深夜失眠常有的情緒低落，


  各種懷疑人生、對自己感到不滿，不知道自己為何而活。


  即便以上各種沈重，但導演呈現的親情很細膩真實，美好的回憶也讓人心暖。


  而且兩位主角都魅力十足，看完很想接著追Paul Mescal的【正常人】！

  -


  對了，看完電影也不禁浮現一個想法，






  沒錢真的先別生小孩。


  --

  是指沒錢的部分嗎XD

  哈哈其實是半開玩笑的啦XD但我自己推測當年他是無預警生小孩的，而主角一定也很懊悔

  自己怎麼無法給孩子更多。'
