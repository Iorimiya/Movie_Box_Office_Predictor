title: 'Re: [好雷] 日麗 這就是我想要的國片啊'
content: '回應本文討論，導演接受衛報採訪時，問及一題：「你的電影觸動許多人，那麼有哪些電

  影如你的作品那樣感動你呢？」


  他提名的片單之中，除了楊德昌，也有張艾嘉2015年的作品念念，而且特別寫了一小段文

  字描述他觀影時的體驗。


  訪談內容很棒，講到這部電影觸及了一些或許不常看電影的觀眾，並引來他們分享自己親

  子經驗的共鳴，相當感人。另外，導演有些想法也很有意思，如他羨慕一張優異的照片、

  或者一首三分鐘的歌曲，就能捕捉九十分鐘電影的感情；不過他說，電影彙集這些表現形

  式，或許強項是讓這些視覺、聽覺的元素彼此矛盾，傳遞出更凌亂的體驗。


  原文可以參考：shorturl.at/wCIY1


  最後加一行我的心得：看完多天以後，放空發呆時思緒還是會繞到這部電影，比散場時的

  感受還多，真厲害。


  --'
