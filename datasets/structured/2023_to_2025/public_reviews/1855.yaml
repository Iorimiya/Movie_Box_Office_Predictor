title: '[悲傷雷] 日麗'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~










  爆個雷


  裡面劇本是監製她看到自己以前父親的照片


  突然想到 原來現在的自己跟當時的父親是一樣年紀

  而產生這個劇本的


  所以編劇在訪談裡面也講到


  她原本還有點害怕 這種非常私密的個人經驗

  用各種鏡頭切換、色調對比等等方式


  可能沒辦法帶給觀影者有類似的共感

  但是目前看來 整部片還是蠻成功的









  故事當然就是圍繞著雙主角C與S

  而裡面穿插著各種記憶及成年後的S畫面


  代表著這一切

  是成年後的S在回憶當年與父親旅遊的往事


  而小時候的S 並沒辦法體會到

  父親那時候的壓力與痛苦


  即使學了太極拳

  看了冥想的書籍

  但是C還是沒辦法越過心中那個坎


  最後走向那個昏暗閃爍的舞池









  當年的S 還只是個想要早點了解大人世界的小女孩


  不懂為什麼爸爸不想跟她上去一起唱歌

  叫我別抽菸 但是自己卻在陽台抽得很開心

  為什麼要學太極拳

  沒什麼錢為什麼還要裝闊買地毯


  各種的疑問

  C都沒有透露出什麼答案給她


  C是對S說

  希望你以後 可以做你想做的事情

  變成你想要成為的人


  但是深藏自己心中的那個焦慮

  他自己也沒有辦法去處理







  後段 C的狀況越來越不好


  甚至還跑到了海裡，最後勉強回到飯店睡覺

  也完全忘了 S還在外面遊蕩的這件事情


  要離開飯店前

  S還問C說，能不能一直待在這

  代表著她是真的很喜歡與爸爸待在這裡的時光的


  C最後也勉強了自己

  與女兒跟自己跳了段舞

  讓這個旅途有個還不錯的結尾


  只可惜 這似乎也是爸爸留給她的最後印象









  夢醒時分

  想到了跳舞 想到了游泳

  想到了擦防曬油


  你會有什麼樣的感觸呢


  整個畫面效果也可以知道

  C當時的狀態


  是給S一個什麼樣的感覺


  相較自己的暖色調

  C一人獨處時就大多偏冷










  電影裡面的音樂選擇也都很棒


  最後結尾的配樂

  沉靜悠遠卻又異常悲傷


  這是一部後座力很強的片子

  線索很多 要慢慢去挖掘


  整部片的畫面看起來有點鬆散迷離

  但這其實是一部 需要觀眾把各種破碎的玻璃


  拿起來一片一片黏貼起來

  才可能看得出架構的片子



  --





  --'
