url: https://www.ptt.cc/bbs/movie/M.1676121582.A.D8E.html
title: '[好雷] 《日麗》在那麼有限的生命中'
content: '有雷 防雷



























  這天是蘇菲的生日，已有伴侶及孩子的她，想起了在11歲那年，與當時正要過31歲生日的

  父親卡倫去土耳其的一次度假，於是她重溫當時DV錄下的點點滴滴。由於父母離異，蘇菲

  跟著母親一起生活，因此難得跟父親的出遊對蘇菲來說格外珍貴。「當你11歲的時候，你

  有想過現在的自己會是什麼樣子嗎？」，面對蘇菲的問題，卡倫的反應是沉默不語，並把

  她邊問邊錄的DV給關掉。多年後當蘇菲回頭看，那時候對父親一些不能理解的地方，現在

  的她好像能夠懂了…


  初看覺得有些零碎，二刷時卻能感受到這對父女的親密感情在電影中無處不在。從某個角

  度看這部片，會看到一些讓人舒心的日常片段，但轉個角度，就能發現電影中隱密的憂傷

  。「我喜歡看著太陽的時候，我是說，當我下課時看著天空，雖然你並不在我身邊，但想

  到我們都在同個天空下，就覺得我們其實是在一起的。」，是的，這是部在講父女情的電

  影，以及他們各自所面對的一切，雖然他們很親近，但仍會有各自獨處的時候、也會有兩

  人無法溝通的隔閡。


  蘇菲的角度相對來說較為單純，聰明且敏銳的她，正在體驗成長過程中會發生的種種：從

  廁所孔中窺視少女們的對話；跟大許多歲的青少年們一起打撞球、嬉戲；被大姐姐贈送無

  限暢飲的手環時，似乎有著不一樣的感覺；跟男孩麥可在泳池邊的初吻。小時候我們會知

  道自己什麼時候是快樂的、什麼時候是生氣的、什麼時候是憂傷的。到了某個年齡後才會

  發現：快樂跟悲傷可能同時存在，快樂的表情下也可能包裹著悲傷。在和諧的相處中不時

  陷入自己心事的父親，是當時的蘇菲無法理解的。


  父親的角度則像是混合著中年人的失意，不時被蘇菲的話語刺痛的他，其實代表他對當下

  的自己失望。從愛丁堡到倫敦，他仍未找到自己的歸屬之處；當卡倫跟潛水教練說：「我

  無法想像自己的40歲，連能撐到30歲我都很意外了。」、以及跟蘇菲鬧彆扭後，他獨自一

  人走入夜晚的海中，都暗示他可能的自毀傾向。然而把《冥想入門》、《太極》當成愛書

  的他，其實已創造了自己獨特的人生哲學。他教給蘇菲的防身術，意外地立刻就派上用場

  ；明明經濟拮据卻咬牙硬買的地毯，也成了長大後蘇菲家中的紀念品。蘇菲跟卡倫即便親

  密，卻因為自我的堅持而無法時時刻刻都活在「我們」裡面：卡倫內疚於自己無法給女兒

  更好的生活，但蘇菲更在乎他們能一起累積更多的回憶。當卡倫生日當天，兩人在山邊一

  起做著太極；以及假期最後一晚，不喜歡跳舞的蘇菲為了讓爸爸開心，跟卡倫一起共舞，

  那幾個時刻、他們暫時放下了自己、成為了緊緊相依的「我們」。



  片中不時穿梭著電音舞池的片段：有時在舞池的是當年的父親，有時則是長大後的蘇菲。

  這個設計讓我聯想到，在現今許多靈性相關的課程中，冥想練習的開始常是先設想一個場

  景，然後延伸到：想像自己在那個場景跟過去的某個人說話，進而和解。在電影尾聲，父

  親在機場跟蘇菲告別後，轉身便走入電音舞池的一幕，似乎有些魔幻、不真實；假期快結

  束時，父親對蘇菲說：「以後不管妳經歷了什麼事，妳都可以跟我說，妳想去派對、嗑藥

  、想做什麼都可以，但記得都告訴我、我都想要知道。」，而在電音舞池的場景裡、跨越

  了時空，長大後的蘇菲竟能跟當時的父親相遇。後來的蘇菲會想告訴當時的卡倫什麼呢？

  也許是：「因為你努力給的一切，才成就了現在的我。」不論當時的父親、或是長大後

  的蘇菲，他們似乎都陷入了「要是我能對你再更好一點就好了」的愧疚裡；但不管多麼愛

  一個人，對方都會有自己跨不過的坎，並不是給更多的愛就能克服的。也許放過自己、相

  信自己已經夠愛對方、也真心感激對方給自己的愛，才能成就兩人之間真正的圓滿，無論

  各自在什麼地方。


  --'
