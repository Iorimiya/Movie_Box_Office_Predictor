url: https://www.ptt.cc/bbs/movie/M.1694925411.A.7EE.html
title: '[好雷] 威尼斯魅影謀殺案'
content: '剛在台中的親親影城看完了

  一廳很大但觀眾不到十人...

  以下節錄自維基百科



  "本作同時是肯尼斯·布萊納繼《東方快車謀殺案》和《尼羅河謀殺案》後，第三部改編自

  阿嘉莎·克莉絲蒂小說著作的電影。"


  本片跟前兩部作品不同的是場景

  前兩部在火車上及船上

  此部則在一棟(有死過人的)豪宅內

  過程中有很多鬼怪的體驗

  讓除了解謎外有不同的感覺

  另外本集的疑點跟可疑之人都很多

  此點應該是超越前兩集


  倒數十幾分鐘

  主角又開大絕

  瞬間指出兇手把案件解決

  他靠什麼能力呢?


  1.超精準的觀察,不放過任何細節

  並對任何不正常之處(=行為跟平時不同)懷疑並推斷

  2.有超高智商才能抽絲剝繭,判斷兇手

  3.跟在場所有人一一面談,把有動機的人排除掉

  兇手可能外表無辜或表面上沒動機,甚至是身邊的人


  不太想暴雷

  指出幾個疑點給大家思考就好

  1.片中作家為何找上主角?真的是表面上的要他重出江湖嗎?

  2.保鑣的行為跟平常不同?

  3.從不相信鬼怪的主角,為何這次會看到聽到他們?

  4.這些人被邀請過來,是誰邀請的?有不良企圖嗎?


  最後還是推薦本片

  雖然兇手的動機有點薄弱,但瑕不掩瑜


  每個人都有自己的故事

  表達可用語言,但非語言的表達

  才往往是破案的關鍵!


  --'
