url: https://www.ptt.cc/bbs/movie/M.1699897930.A.0BE.html
title: '[好雷] 威尼斯魅影謀殺案'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  個人蠻喜歡這種推理懸疑片

  威尼斯魅影謀殺案這部電影從開頭就很精彩 營造了神祕又懸疑的色彩

  推理的戲碼不多 但是從一開始到結尾的氛圍都營造得很好

  相比前面兩部 個人覺得這一集的氣氛最好

  東方快車表現一般般 對於推理迷來說可能會有點不夠有趣



  而尼羅河謀殺案整體的表現有提升



  一般懸疑推理的片子都會有很多出場角色

  要在短時間內把所有角色的背景故事跟疑點全部解釋並串接起來本身就是不容易的事情

  但是好在這一系列一部比一部好看



  威尼斯魅影謀殺案和前面兩作最大的不同就是推理部分相對較少

  但是如同前面講的 氣氛營造得很好

  只可惜我是在D+上看 雖然院線片這麼快就能上串流確實很爽

  但是有點後悔沒去電影院裡看 昏暗跟音效帶來的氛圍感應該會更加強烈

  不過在家裡看就是可以隨時暫停去尿尿 各有各的優勢拉



  總而言之 個人覺得喜歡推理的朋友肯定會喜歡第三部

  而比較大眾口味的朋友也可以嘗試從東方快車那一部開始看 絕對會越看越上癮的


  --'
