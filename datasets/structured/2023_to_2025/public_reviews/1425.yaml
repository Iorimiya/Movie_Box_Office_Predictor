url: https://www.ptt.cc/bbs/movie/M.1695272536.A.F80.html
title: '[普雷] 威尼斯魅影謀殺案 答案是偷看來的嗎?'
content: '作為推理電影，

  實在稱不上是一部合格之作，

  不過若作為一部結合推理與恐怖要素的電影那倒是還滿有趣的。



  在看過本片之前的推理偵探劇只有 小勞勃道尼 的《福爾摩斯》，

  與《福爾摩斯》不同的是這片比較偏純推理，

  但在各種推理的細節解說上…

  幾乎是完全沒有解釋的就講出謎底，

  讓人摸不著頭緒，

  對比以往看偵探小說那種解謎的爽感完全不一樣，

  主角講出答案時我心中只有滿滿的疑問，

  這個答案是怎麼來的？

  難道是劇本告訴你的！！



  對比網路影評的評價來看，

  這作是第三部作品，

  比前兩部白羅系列《東方快車謀殺案》、《尼羅河謀以案》的評價都還要高，

  經過這一作的感想，

  前兩部應該是不用特地去補完了。


  --

  呃....原來前兩部的推理也都是偷看劇本的???

  一點都不爽的解謎感這還真是我第一次看偵探劇的感覺'
