url: https://www.ptt.cc/bbs/movie/M.1698761184.A.21E.html
title: '[好雷] 威尼斯魅影謀殺案'
content: '雷文防雷資訊頁


  萬聖節的應景影片

  威尼斯魅影謀殺案

  A Haunting in Venice

  2023年10月31日上架Disney+


  改編自小說Halloween Party

  by Agatha Christie


  推理迷最愛的「世界級推理女王」阿嘉莎克莉絲蒂電影宇宙終於在今秋推出全新第三篇章

  《威尼斯魅影謀殺案》，與前兩部曲不同的是，這次作品中加入了超自然恐怖元素，懸疑

  恐怖感滿分的系列新作不只讓影評人驚呼是「系列最佳」，更滿足了台灣人對恐怖作品的

  熱愛與渴望。隨著這部作品即將在萬聖夜登上Disney+，務必要在萬聖節當天與朋友們挑

  戰壯膽，享受前所未有的驚悚系解謎體驗！《威尼斯魅影謀殺案》故事講述二次世界大戰

  結束後，過著周遊列國退休生活的名偵探白羅來到觀光勝地水都威尼斯，卻意外來到一座

  鬼影幢幢的老舊宮殿參加一場通靈會，並且再度遇上來賓慘遭謀殺，但他這次要揪出的兇

  手可能不是人而是鬼！


  威尼斯魅影謀殺案

  A Haunting in Venice

  2023英國_美國電影




  劇情簡介：


  本片是繼全球票房雙雙破億的《東方快車謀殺案》和《尼羅河謀殺案》之後的最新第三篇

  章，史上最暢銷小說家阿嘉莎克莉絲蒂全新推理謀殺電影宇宙於大銀幕上繼續擴張，打造

  出更勝前作的華麗靈異嶄新風格！


  肯尼斯布萊納第三度自導自演詮釋阿嘉莎經典系列、化身推理功力無人能及的神探白羅，

  這回改編從未登上大銀幕的系列小說《萬聖節派對》（Hallowe’en Party），全新意外

  結局要讓忠實書迷都無法預料，而且不僅設於世界著名水都威尼斯的絕美背景令人神往，

  鬼影幢幢的暗黑氛圍，也比前作更加懸疑驚悚！


  連續在橫越歐陸的東方快車及世界最長河流尼羅河上偵破謀殺案後，退休的神探白羅現身

  水都威尼斯參加一場通靈會，楊紫瓊飾演的靈媒召喚鬼魂，卻又讓他遇上來賓慘遭離奇謀

  殺，令他語重心長地說：「今晚所有觀眾人心惶惶，我們終究難逃自己的鬼魂。」隨後更

  在鏡中看到魅影就在他背後！締造奧斯卡史上入圍最多獎項紀錄且蔚為得主的肯尼斯布萊

  納，繼續拓展由他主導詮釋的阿嘉莎克莉絲蒂推理謀殺系列，也再度飾演為人津津樂道的

  經典角色神探白羅，更把從未拍成電影、先前僅有廣播劇和電視影集版本的白羅系列小說

  《萬聖節派對》首度搬上大銀幕，背景也搬到美景如詩如畫、令人神往不已的水都威尼斯

  ，而且不只延續前兩集疑雲密佈的兇案主線，還有詭譎驚悚的靈異情節，令人再度推理燒

  腦之餘，更因驚嚇連連而大呼過癮，這次不只要問人是誰殺的，更令人深怕有可能是鬼殺

  的！


  肯尼斯布萊納深植人心的神探白羅是唯一回歸角色，全新卡司陣容再度令人驚豔無比，新

  科暨首位奧斯卡華人影后楊紫瓊這回放下矯健武打身段，前所未見飾演捉神弄鬼的神秘靈

  媒，再展令人折服的百變演技，其他演員還包括繼《貝爾法斯特》再和布萊納合作的「格

  雷總裁」傑米道南與天才童星裘德希爾、熱門影集《超級製作人》喜劇天后蒂娜菲、《福

  爾摩斯》系列電影英國實力派女星凱莉萊利，以及《西城故事》俊帥小生潛力新星凱爾艾

  倫。


  本片幕後團隊也一如前作十分堅強，包括繼前兩集再度操刀劇本的王牌編劇麥克葛林、肯

  尼斯布萊納的老搭檔攝影師哈里斯贊巴爾盧柯斯、《真愛每一天》美術設計師約翰保羅凱

  利、《蟻人》服裝設計師珊咪薛爾登，和《恐怖大媽》剪輯師露西唐諾森等影壇菁英，此

  外，這次更邀請到憑《小丑》橫掃奧斯卡、金球、葛萊梅等多項大獎的冰島配樂大師希爾

  迪居茲納多蒂爾為新作譜曲，她近期的作品還包含了《T糠塔爾》；另一位金獎票房大導

  雷利史考特再度擔任製片，齊力打造重新呈現阿嘉莎克莉絲蒂經典推理謀殺小說、充滿歐

  洲異國風情的華麗靈異懸疑驚悚嶄新篇章。





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  萬聖節晚上，看到Disney串流平台上架此片，非常應景，影片故事就是在萬聖節發生在義

  大利威尼斯古堡，名作改編，很吸引我，卡司陣容強，背景場景美，追看完畢，個人滿意

  度80分（滿分100）。

  被害人有哪些？凶手是誰？動機是？結局？主角經由此案件後的改變？

  本片看到密室殺人解謎，看到人性的執迷，猜疑，無知及其引發的悲劇，看到對上帝及鬼

  神的信和不信所影響的言行，本片有很多層面的劇情及聯想。


  以下有劇透。




  1.本片是對一本棘手的推理小說的良好改編。白羅現已退休，過著流亡生活，他的朋友知

  名女小說家說服他，去調查一位靈媒的誠實和正直，這位靈媒將去探望失去親人的母親Ro

  wena。


  可以理解為什麼前二部電影，為何選擇尼羅河謀殺案和東方快車謀殺案，但本片的原作萬

  聖節派對並不完全適合改編？但本片改編成果來說，是有效的非常好，有很多加分項。


  本片主要的亮點之一是視覺效果！我想威尼斯的場景是不會失敗的，看起來很氣派，攝像

  機角度和焦點真的很好，非常大氣，而且適當地呈現出此地方的險惡面，本片的劇設時空

  ，面具、長袍和服裝看起來非常漂亮，確實為本片帶來了萬聖節的氛圍。


  2.主角Kenneth Branagh外型柔和的小鬍子肯定起到了作用，他感覺更像名偵探白羅。Kel

  ly Reilly飾演的Rowena非常出色，而扮演Leopold的青少年Jude Hill也很棒。2023年榮

  獲奥斯卡最佳女主角的楊紫瓊，在本片扮演的靈媒角色，非常有意思，可惜戲份少，但令

  人印象深刻。Tina Fey在本片扮演的暢銷小說家Ariadne Oliver，白羅的好友，狡黠機智

  ，令我聯想到本片原作者Agatha Christie.


  3.本片較前二部白羅主角的前作，是一部規模較小的偵探小說，具有一些優勢，解決了所

  有剩餘的問題，同時仍然是一個引人入勝的謎團，對偵探小說給出了令人滿意的答案。

  白羅角色，仍然充滿了無窮的娛樂性，由於故事的黑暗性，這裡的幽默感有所減弱，但到

  最後，他角色再次成長。 每個人都經歷過不同的考驗，首先是他的道德，然後是他的人

  性，而在本片中，他的理智被推到了崩潰的邊緣。

  由於本片主要局限於一個較小的、內部密集的地點，創造出一些令人不舒服的時刻的橋段

  ，相當精彩。雖然本片創造出的氛圍，並不恐怖。本片從威尼斯的一些美麗鏡頭開始，我

  立刻就被這部電影的精美拍攝所吸引。 本片適合萬聖節季節，並且沒有愚蠢或血腥地實

  現了這一點。這部電影沒有辜負人們的期待。 儘管本片大部分場景，都發生在一座封閉

  的建築內，但我仍然感受到電影中的場景有多棒。

  謎題本身確實做得很好，我根本不熟悉這個故事，當一切都被揭露後，給我留下了深刻的

  印象。 本片演員陣容，雖然可能不像前二部那樣明星雲集，但仍然做得非常棒。


  我不知道本系列電影，是否計劃停下來不拍或繼續拍攝，但若有續作，仍然會追看！



  --'
