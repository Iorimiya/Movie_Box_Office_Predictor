url: https://www.ptt.cc/bbs/movie/M.1694794192.A.FF3.html
title: '[好雷]威尼斯魅影謀殺案-欸我是來看推理片的耶'
content: '防雷







































  這嘗試還真是有趣

  居然把推理片拍成恐怖片

  整部電影都在陰森恐怖的氣氛下進行

  嚇死人的靈異場景還有靈騷現象一直出現

  不過最後都有解釋…看你能不能接受就是


  電影一開始先讓你看看威尼斯的美景

  然後白羅已經是完全不理事的退休人士

  請了一個保鑣擋著所有前來求援的人

  只是突然間有個知名小說家跑來

  跟他說有位靈媒超神奇她完全看不穿她的手法

  要白羅一塊跟她去揭穿那位靈媒

  當時有一名喪女的退休歌星打算請靈媒來通靈

  想再見見自己被怨魂殺死的女兒

  因為他們住的地方其實是個廢棄幼兒醫院

  當年傳說有很多小孩被拋棄於此活活餓死

  在女兒的前男友、生前的家庭醫師父子、母親和小說家與白羅的圍繞下

  通靈儀式開始了

  可是被白羅秒揭穿手法

  但靈媒此時出現了異狀

  開始發狂並以女兒的聲音說出自己被謀殺了

  並且出現了白羅還無法理解的靈騷現象

  不服氣的白羅跑去跟靈媒嗆聲

  結果靈媒半開玩笑的把她自己的法袍穿在白羅身上

  導致白羅差點被暗殺

  靈媒也被殺死

  在稍作休息喝了女歌星泡的蜜茶後

  推理劇從此開始

  但是….整部片開始大鬧鬼啦！

  一下靈騷現象一下小孩唱歌一下看到鬼影

  拼命的用各種靈異片的手法嚇觀眾

  但是我們的白羅還是克服鬧鬼的恐懼看穿了一切

  還解了當年的女兒兇殺命案

  至於詳情大家可以進電影院看看

  不過要記得這要當恐怖片看喔

  嚇死人的推理片我還是第一次看過

  好看


  --'
