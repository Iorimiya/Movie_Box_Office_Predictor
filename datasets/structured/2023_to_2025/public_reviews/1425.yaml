url: https://www.ptt.cc/bbs/movie/M.1694928702.A.D2E.html
title: '[普雷]威尼斯魅影謀殺案'
content: '當一般推理片可以看

  動機手法都算合理 風景很美 演員帥哥美女都有

  因為大改原作到基本上只剩名角色字跟萬聖節是一樣的元素

  所以整體還算有驚喜

  裝神弄鬼的部分也挺有趣的


  但如果你是白羅粉絲 可以跳過 肯尼斯還是肯尼斯

  白羅依然不是白羅

  但更糟糕的是



  -----以下有雷-----





















  這次奧莉薇夫人也不是奧莉薇夫人


  原本想說這次大幅改編 就算白羅依然是白景濤

  其他的角色崩壞應該不會太明顯

  結果奧莉薇直接崩壞到變成反派


  原作的奧莉薇是白羅好友

  親和可愛 有些異想天開 靠女人的直覺來推理

  自行創造出一個怪怪芬蘭偵探的暢銷作家

  是個有趣的傻大姊型角色


  結果肯尼斯版本的奧莉薇夫人

  不僅利用白羅的故事取材寫書成名

  還認為白羅的名聲是自己的功勞

  因為最近書賣不好就串通靈媒想利用白羅來炒作新書

  十足陰險狡詐的女人

  最後居然還說白羅根本沒有朋友


  我說誰想要跟你交朋友啦!


  至於白景濤這次其實意外的前半還挺像原作的

  看起來只是個有些挑剔難搞 驕傲的小老頭

  但是開始推理以後白景濤又上身

  推理出奧莉薇在搞鬼是不錯

  結果後面又衝動的把殺人也推到她身上

  算了 反正都第三集了 沉著冷靜的白羅本來就不存在於肯尼斯的腦海中


  案件本身基本上是大改特改了

  原本是個愛現的小女孩亂講話造成兇手害怕過去的案件曝光引發一連串的事件

  電影把除了小女孩改成靈媒之外 其他人的關係也大幅更動

  裝神弄鬼的部分拍起來不錯

  但真相就推理小說常見的套路

  不是暗樁就是幻覺

  兇手大概在鎖門那邊就昭然若揭了

  動作實在太刻意了

  不過我一直不懂助手兄妹說聽到音樂房有人聲

  不是說幾乎完全隔音嗎?


  --'
