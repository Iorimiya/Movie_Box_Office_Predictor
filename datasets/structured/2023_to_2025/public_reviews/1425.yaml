url: https://www.ptt.cc/bbs/movie/M.1695338696.A.DE7.html
title: '[普雷]威尼斯魅影謀殺案 義大利觀光宣傳片'
content: '不知道疫情後

  義大利砸多少錢讓人拍片補助

  從上一部死刑教育3 義大利南部阿馬爾菲海岸

  阿爾托蒙特小鎮的美麗純樸


  現在換威尼斯魅影謀殺案1947二戰後

  水都威尼斯那種奇幻世界

  片尾還用空拍方式展現威尼斯特色

  根本就是觀光宣傳片


  回到正題威尼斯鬼魅謀殺案

  若已懸疑推理小說來說

  比較像是金田一那種模式


  以下是有雷的劇情提問


  以故事劇情媽媽是有控制欲

  想管控女兒不要嫁給窮小子

  不想讓有心機窮小子奪富人家產？

  但是劇情後半又被醫生勒索買通假巫師

  說沒有錢財修正這棟鬼魅建築物？

  還有窮小子也有品嚐瘋蜜 卻沒有幻覺？

  明明白羅也只喝一點點茶加瘋蜜？

  窮小子是把瘋蜜塗抹傷口及嘗一口


  對於導演拍攝手法畫面非常嚮往

  經常採用俯視拍攝及仰視拍攝人物及建築物

  區別不是推理重點畫面


  若是重點畫面一定是水平畫面

  不知道是故意的還是本來想這樣角色突兀

  整部片結構速度快

  對於破解謀殺的手法不會冗長說明

  會簡潔有力如同小說


  整體音效不錯

  也帶入詮釋人類是群體動物

  希望被群體接納

  情感驅使下自然會服從權威和體制

  人的行為會因為從眾和服從

  而失去思考和辨別的能力


  最後結局 開始的始作俑者另有其人

  *修正片名打錯

  --'
