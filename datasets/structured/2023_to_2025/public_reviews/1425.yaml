url: https://www.ptt.cc/bbs/movie/M.1695083617.A.819.html
title: '[新聞] 《威尼斯魅影謀殺案》評價勝前集 阿嘉莎'
content: '新聞網址：


  《威尼斯魅影謀殺案》評價勝前集 阿嘉莎曾孫支持「繼續翻拍剩下的30部」

  2023年9月18日

  記者許瑞麟／綜合報導


  改編自暢銷作家阿嘉莎克莉絲蒂著作的電影《威尼斯魅影謀殺案》，在台上映首周票房86

  4萬新台幣，北美票房1450萬美元也略勝前一集。奧斯卡影后楊紫瓊片中飾演靈媒喬依絲

  ，導演肯尼斯布萊納（Kenneth Branagh）大讚楊紫瓊為角色注入靈魂，讓觀眾從她出場

  的那刻起便目不轉睛，楊紫瓊則說：「我很沉迷於謀殺懸案，但這次的作品在每個細節深

  處增添了恐怖元素。」


  蒂娜菲（Tina Fey）飾演的作家阿蕊登，則參照阿嘉莎克莉絲蒂本人的真實形象，甚至堪

  稱她在大銀幕上的化身，肯尼斯誇讚蒂娜菲：「阿嘉莎的創作充滿刺激、娛樂又逗趣，蒂

  娜則將這些特質注入此角。」並形容她有著智慧及幽默於一身的特質，令觀眾看到兩個風

  格迥異的偵探共同辦案。


  阿蕊登在片中也把白羅化為自己筆下的人物，戲裡戲外的對照令人玩味不已，蒂娜菲自己

  卻笑稱：「扮演一個絕望的女作家，對我而言根本像本色出演。」自嘲很幸運不需要揣摩

  角色，她也不忘如阿嘉莎克莉絲蒂「推銷」本片：「這不是一部單純的謀殺懸疑片，靈異

  元素讓本片更出色。」


  該系列先前已推出《東方快車謀殺案》、《尼羅河謀殺案》，《威尼斯魅影謀殺案》相較

  於前兩部反而獲得不錯評價，阿嘉莎的曾孫詹姆斯普里查德（James Prichard）表示，他

  相當支持肯尼斯布萊納翻拍剩餘的30部著作，「如果這部電影成功，而肯（尼斯）想要拍

  更多，20世紀也想拍，而我們卻不這麼做，我會感到很驚訝。故事還有很多，我的曾祖母

  寫了33部長篇白羅小說，有很多素材可以選擇。」


  詹姆斯普里查德認為，票房成功與否也是關鍵，「我們一次只拍一部，希望這部能成功，

  然後有人會想拍另一部，如果那部成功，就接著拍別部。但在某個時候可能會有狀況，如

  果肯有其它想做的事，時間上是有限的。」目前連續3部都由肯尼斯布萊納自導自演，但

  目前官方尚未宣布是否會繼續拍攝阿嘉莎克莉絲蒂的其它作品。


  --'
