  自由之聲 - 會不會有太重的宗教情節，還是只是正常的敘述每個上帝的孩子應該被重視

  之類的，因為不想要太多讚揚宗教和傳教的內容，如果是一般的正向能量表達但有提及神

  是可以接受的。


  威尼斯 - 很少看這種類型的片，同行者中有比較怕鬼的，會不會看完睡不著之類的…還

  是這部比較像推理驚悚類的，不是那麼刻意為嚇而嚇的（就是故事結構比較紮實）那可能

  會比較好接受。


  其它有什麼個人感受或推薦原因也歡迎哦

  感謝大家～


