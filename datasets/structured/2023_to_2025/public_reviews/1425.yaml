title: '[好雷] 威尼斯魅影謀殺案'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  因爲這部片對威尼斯的風景大飽眼福

  即便是透過螢幕也能感覺到現場的美

  真的會讓人想要去旅遊


  不過很可惜的是主要劇情都發生在住宅裡面

  而且畫面超暗，一度很想打光來看



  白羅穿上黑斗逢被壓在水里到靈媒被謀殺

  一整段下來真的很有恐怖片的氛圍

  不說都不會想到這部其實是推理片



  還有到樓上花園，房屋女主人的對話

  依稀猜的出兇手是誰?

  雖然其中有房屋古老故事的鬧鬼事件在模糊焦點

  還有點神經質的家庭醫生、老成的醫生兒子


  跟一開始的靈媒靈異事件

  都讓這部劇很有節奏感跟有趣

  是部挺好看的電影


  --

  好像是

  必須二刷三刷'
