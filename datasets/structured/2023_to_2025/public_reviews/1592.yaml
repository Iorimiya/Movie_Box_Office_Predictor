url: https://www.ptt.cc/bbs/movie/M.1687239795.A.853.html
title: '[普雷] 溟溟 與家人一同包場觀賞'
content: "雷文防雷資訊頁\n\n本來是想說自己生日，家人臨時約要看南方寂寞鐵道\n\n主要原因是我沒看過也還沒挑到時間觀賞，其他人都想二刷就特別再約\n\n\
  去了電影院才發現該場次已經被公司包場了\n\n正在猶豫要怎樣決定下一步時，發現了一個演員封面看起來不錯的片就直接購票進場\n\n結果發現我們也是四人包場看片\n\
  \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n因為是事前不知道任何資訊就直接觀賞\n就片名而言已經會以為是恐怖片了，加上廣告時段插了一支恐怖片預告\n\
  差點在電影一開始就立刻走出影廳\n\n\n片中描述了三個時間軸：前世、今生、幼年\n光是釐清人物關係就會需要比較高的腦力去分析\n\n再來雖然主題是透過星空與莊周夢蝶去串接前世今生\n\
  但因為主角是天文學者的關係，已經讓我歪掉到這部片到底是在講研究還是講情感鳩葛\n導致整部影片不至於到尬，卻會因為看起來有些多餘的元素而無法對焦主題\n\n像是日本人的部分，過去是在時空背景下要表現造成衝突的原因\n\
  ，但現在的學弟就變成只是亂源的感覺\n然後做夢的人對我而言有一點多，不太能掌握住誰夢了甚麼，是不是夢到自己\n還是只是在旁觀整個事件，當然也有可能這樣才是故事主軸\n\
  小時候的部分，除了繼承長時間未得志的部分，哥哥也變成了純粹的見證者\n而且也是到劇情尾聲才有交代發生了什麼事情\n\n扣除掉整體節奏有那麼點混亂的情況，其實演員與環境音樂的表現都不錯\n\
  能夠同時在片中處理三個不同的文化也確實不容易\n要我說的話我確實比較喜歡相對沒這麼混亂的前世線\n黑狗的表現真的印象很深，而且名子還很特別\n\n另外意外的點是有找到自己比較有在關注的聲音工作者來配旁白的部分吧\n\
  大概寫到這邊，看完所有人的反應都溟溟\n\n有想看藝術片的話還是可以嘗試一下\n\n--\n仔細一看發現自己喜歡的角色似乎都偏冷門...           \
  \        ↓開燈\n \n \n \n \n \n\n--"
