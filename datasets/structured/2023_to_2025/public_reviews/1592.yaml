url: https://www.ptt.cc/bbs/movie/M.1683214258.A.AE6.html
title: '[新聞] 台灣電影《溟溟》由金馬影帝莫子儀扮演懷'
content: '新聞網址：


  新聞標題：台灣電影《溟溟》由金馬影帝莫子儀扮演懷才不遇又不良於行的天文學家定檔

  6/16上映


  完整新聞內文：


  金馬影帝莫子儀於2020年金馬獎得獎隔天就進組拍攝的電影作品《溟溟》正式定檔6/16在

  台上映，由新生代導演陳子揚編劇、執導，金馬影帝莫子儀、劇場女神鄧九雲、獨立音樂

  歌手葉穎及實力派的高英軒領銜主演，《溟溟》是以前世今生為主軸，講述亡靈若沒有在

  忘川喝下孟婆湯，靈魂便困在無盡的輪迴中難以爭脫，讓今世受盡折磨。金馬影帝莫子儀

  扮演深受前世記憶影響的天文學家，總是陷入前世今生的泥沼中，加上因小兒麻痺症不良

  於行，再次挑戰高難度演技。


  今發布電影前導海報和預告，從不見主角的海報可以看出電影獨特的風格，兩個在溟河流

  動水波中的人影，似乎互相影響，也帶出了電影的前世今生主題。在前導預告中可以見到

  莫子儀因前世的悲傷愛情故事的夢境，讓他今生的生活陷入混亂，事業與家庭都走向困境

  ，更覺得人生非常孤單。


  在《溟溟》中莫子儀飾演一位致力於預測「超新星爆炸」研究的天文學家，年輕時曾獲研

  究獎項肯定，前途看似一片光明，但長期下來卻一直難有更進一步的研究突破，造成個性

  漸漸陰鬱，也因天生腿部殘疾，生活需求都靠妻子鄧九雲打理。莫子儀為讓角色形象深化

  ，演出更為自然，他在日常生活中也拄手杖練習，不斷揣摩跛腳的走路姿態，逼真到令人

  誤以為他真的受傷了。


  莫子儀表示為了角色請教醫生，也拜訪很尊敬的劇場前輩鄭志忠，了解小兒麻痺的患者對

  身體及心靈造成的影響，才知道其實對一般人來說很安全的搭公車，對小兒麻痺患者而言

  ，連維持平衡其實都是很危險的事情，「在練習角色的過程中，很不好意思的是在公車上

  一直遇到要讓座給我的人，很謝謝他們，但也覺得很不好意思。」


  導演陳子揚小時候長居國外，回台灣後有好一段時間不適應，受到很大的文化衝擊，有一

  次聽到孟婆湯的故事，聽到靈魂在重生前，得喝湯來忘掉記憶，才理解到自己的問題，他

  說：「我一直活在過去，不願意接受現況，無法前進才讓自己如此地痛苦。人如果不打破

  習慣，也只會一直犯一樣的錯，重複一樣的問題。」陳子揚認為這個循環是每個人都試著

  在打破的，各自的循環也往往圍繞著他人。圍繞在身邊的人，通常都不是一世的緣分，都

  是因為忘記的恩怨情仇把我們人生連在一起。而《溟溟》是個記憶的創作，個人的記憶，

  周遭的記憶，文化的記憶，夢境的記憶，所有串在一起的奇幻故事。《溟溟》由華映娛樂

  發行，6/16上映。


  《溟溟》故事描述葉承修（莫子儀 飾）是一位將生命奉獻給研究的天文學家，年輕時曾

  獲研究獎項肯定，之後卻一直難再有突破。他因天生腿部殘疾，生活多半靠妻子雅潔（鄧

  九雲 飾）打理，但他和家庭關係非常疏離。同校學弟的研究在國際上得到首獎肯定，更

  讓他備受打擊， 這一陣子，他常常在睡夢中，看見一段部落青年和部落公主莎瓦祖佳揚

  （簡孝儀 飾）的愛情悲劇，他深信這是自己的前世記憶。課堂上，他對一位神秘的女學

  生Pluto（葉穎 飾）留下印象，兩人多次的巧遇，讓他忍不住揣想Pluto是他前世情人的

  投胎轉世，但面對已有妻小的狀況，他更深陷兩難的抉擇之中…他可以爭脫前世的束縛，

  面對今生的問題嗎？《溟溟》由犢影制作電影有限公司、華映娛樂股份有限公司、馬棋朵

  數位影像製作公司共同製作出品，海王天璽文化傳媒聯合出品。更多新訊息請隨時關注「

  溟溟」官方臉書。


  --'
