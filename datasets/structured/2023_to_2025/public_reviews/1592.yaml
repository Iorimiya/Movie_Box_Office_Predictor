url: https://www.ptt.cc/bbs/movie/M.1687948183.A.ADD.html
title: '[負雷] 溟溟'
content: '今天吃午餐時突然想到有這部

  想說就有空去看一下

  結果看到一直杜孤....


  整部片實在是太文藝

  攝影鏡頭很慢(但其實滿不錯的) 人物對話很節省

  音樂很棒 只是這部劇情本來就不是很明顯好懂

  在緩慢的劇情以及不夠多的暗示下注意力就會很分散





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  電影主要有三個時間軸

  日治時期

  葉承修小時

  葉承修中年


  日治時期和中年 "如果注意觀察的話" 這二個時間有很強烈的對應

  但老實說我覺得這裡線索可以給更多一點

  尤其是劇情的推進那麼慢 但某些線索卻一閃即過

  排灣少女那條原來是忘川


  再來是 因為預告一直強調輪迴 所以小時就變的有點和主軸不搭


  很多人的情緒也很怪 或者說不夠立體

  例如

  我知道男主角忽略家庭很久 但女兒說忘了他就大哭

  以及排灣少女穿和服後 日本少女尖叫並拿槍打她的腿

  WHY?????

  有一種人物塑造不夠立體就讓他們情緒爆發

  排灣少女一直沒有看到他的情緒跑出來

  葉承修的老婆在浴室裡哭那一幕也是

  葉承修的日本學弟也是 感覺就是劇情工具


  最後我想提一下 把排灣少女和漢人的孟婆(這個我還是看字幕才知道的)搭在一起....

  我覺得很不協調


  --'
