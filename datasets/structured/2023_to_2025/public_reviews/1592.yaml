title: '[新聞] 金馬影帝莫子儀新片《溟溟》開拍！拄杖現'
content: '文／楊景婷　圖／華映娛樂




  新科金馬影帝莫子儀得獎後馬不停蹄，新片《溟溟》無縫接軌開拍，該片由年輕導演陳子

  揚編劇執導，是以「忘川」、「孟婆」為概念，有關靈魂學習如何前進的愛情故事。莫子

  儀將搭檔「創作才女」鄧九雲主演，為讓角色形象深化，他近日常拄著手杖不離身，讓身

  邊友人都嚇傻，誤以為發生什麼意外，令他哭笑不得。


  莫子儀一向自我要求嚴格，新片開拍前一定做足功課，就連頒獎典禮上等開獎的同時，還

  心繫新片劇本，就怕自己準備不夠 ，「我是一個演員，今晚之後，仍舊是一個演員。」

  獲獎隔天莫子儀準時出現在《溟溟》劇組排戲，他片中飾演天生腿部殘疾的天文科學家，

  對前世留著記憶，但記憶裡的這段青澀的戀情卻是悲劇性地結束並輪迴著，為讓角色形象

  深化，他拄手杖不離身，身邊友人還以為他出意外。


  《溟溟》導演陳子揚在台灣出生，在美國阿拉巴馬州成長求學，小時候長居國外，回來後

  有好一段時間不適應，受到很大的文化衝擊，在一次聽到孟婆湯的故事，聽到靈魂在重生

  前，得喝湯來忘掉記憶，才理解到自己的問題。陳子揚說：「如果說歲月是一條河，生命

  就是水的流動。如果生命不前進，水不流動，就會慢慢惡臭，而往往讓人生無法前進的都

  是習慣與記憶。」一直活在過去，不願意接受現況，無法前進才讓人痛苦。


  這是陳子揚第一部劇情長片，特別找來有默契的電影學院兩位同學助陣，分別是好萊塢攝

  影師Christopher Purdy 以及《馴龍高手2》、《猛毒2》的華人音效師Sam Fan范文銳負

  責聲音設計，范文銳重要的華語電影作品是《大象席地而坐》。



  ，台前組合新鮮亮眼。《溟溟》將在

  台北、新北、桃園、屏東等地取景，預計拍攝一個月。


  【Nov 25 , 2020 15:00 明潮 找電影】


  新聞網址：



  --'
