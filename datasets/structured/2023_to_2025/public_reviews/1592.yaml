url: https://www.ptt.cc/bbs/movie/M.1687535784.A.CD3.html
title: '[好雷] 溟溟'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  《溟溟》讓人覺得有趣的其中一點，大概是行銷方式和真實內涵的落差。影片簡介中，莫

  子儀飾演的天文教授葉承修被敘述成「常常在睡夢中，看見一段部落青年和部落公主的愛

  情悲劇，他深信這是自己的前世記憶」，並且「課堂上，他對一位神秘的女學生Pluto留下

  印象，兩人多次的巧遇，讓他忍不住揣想Pluto是他前世情人的投胎轉世」，然而他又是深

  陷中年危機的已婚男子。於是，影片被包裝成一個圍繞前世議題、帶有神秘色彩的愛情誘

  惑和道德難題的故事。事實上，宣傳裡提到的中年危機、前世背景和情感糾結確實是重要

  元素，但遠不是敘述中的片面或單純。我只能想像是因為影片的內容和手法，對於市場來

  說過於抽象，故只能以這樣的措辭來表達自己。


  讓人覺得抽象的不是輪迴轉世這樣的神秘題材，而是影片處理前世議題的方式，和它基本

  的敘述手法。前世題材可以被表現得很明確，只要讓觀眾一眼看出前世的A等於今生的B，

  或是強調某些人物關係和事件在不同時空中的延續性即可；但《溟溟》沒有採用這樣簡單

  的對應關係，它在日治和現代兩個不同時間軸中的人物、事件，乍看之下沒有直接關聯，

  甚至可以說在結局以前，只是鬆散的以星空、黑狗這類模糊的自然意象聯繫起來。比如天

  文學教授葉承修刻苦研究十萬年、二十萬年才有一次的超新星撞擊，就像日治時期被迫分

  離的原住民情侶，將希望寄託於遙遠的星辰。


  影片中三個主要的時間軸：日治時期、葉承修的少年與中年時期，除了後兩者有明顯相互

  說明的關係以外，作為「前世今生」議題重要的日治時期與其中的部落青年戀情，與主角

  在現代時空的生活故事，像是兩個彼此平行，卻又不斷被並置的世界，觀眾始終被提醒這

  兩段故事的關聯，卻又難以將它們確切聯繫起來。這麼並置的效果，反而讓「關聯性」這

  件事或對它的猜想，被醞釀成籠罩整部電影的迷離氛圍：葉承修在會議上發表不被欣賞的

  天文研究、原住民女孩的情人說他將離開，到星星那裡去；日治時期尋不著女孩的黑狗在

  雨中茫然四顧、葉承修在飽含回憶的老家因屋外的犬吠聲分神；葉穎飾演的文青女學生對

  老師吐露屬於她的寂寞惡夢，而寂寞其實籠罩著故事中的許多人：被強納為妻的原住民少

  女、自我隔絕的葉承修、無力支撐感情的葉的妻子，或許還有主角不被父親接受的兄長，

  或那個因思念亡母而痛恨父親續弦的日本女孩。這些相互隔離的人物在觀眾眼中構成了一

  團星雲，儘管彼此間有光年之遙。


  於是，日治時期的愛情悲劇，雖仍作為某種「前世」而對今生發揮影響，但與其看成傳統

  輪迴故事裡一對一的關係，不如說更像一種抽象無形體的執念或未解之情，不特定屬於誰

  ，而是被打碎嵌入了葉承修及其周遭的人事物中，每個人都成為這個無名星團的部分。這

  種迷離感或許要直到片尾，觀眾終於看到某種勾連前世今生的暗示，才稍微緩解。


  上面提到的這種暗示，其實還是不大容易看出的（我自己看完後補了一點影評才比較理解

  ）。但無論是一聲槍響串連起少女的死因和葉承修身體缺陷的關聯，或是女兒畫中的星星

  與黑狗，跨越時空捎來守候的訊息，這些徵象的隱約符應，或許使那個盤旋於今生之上、

  屬於前世的模糊星雲，在現世找到了一點落腳的錨點。故事最後，葉承修的婚姻危機因為

  女兒的一次意外而絕處逢生，忘川旁的原住民少女強忍淚水，放下她未竟的一生。前世的

  真相、今生的了悟，伴隨觀眾對前世今生關聯性的理解，同時步入了微光之中。說是微光

  ，實在因為影片處理的方式太隱微，幾乎要讓人覺得無疾而終了。


  看完這部在可解不可解之間的電影以後，我倒是有個比較具體的問題：為什麼要將原住民

  少女的死後經歷放置在「孟婆」這樣一個漢族色彩的傳說框架中呢，難道沒有更符合文化

  的安排嗎？


  --'
