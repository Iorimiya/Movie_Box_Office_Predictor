url: https://www.ptt.cc/bbs/movie/M.1681224277.A.501.html
title: '[普雷] 《溟溟》身處於冥河的冥冥之中'
content: '2020就開拍的《溟溟》預計6月上映，目前

  沒有預告釋出，只靠著電影簡介進場，其實

  就快等於盲猜場。



  劇情本身節奏屬於緩慢沉悶，不是部有什麼

  冥界或太多情愛糾葛的奇幻題材電影，在還

  沒觀賞前，前世今生的愛戀加上忘川設定，

  是我相當感興趣的一環，電影開頭出現在山

  林唯美的忘川、孟婆，加上穿著染滿鮮血襦

  袢的少女，讓人感覺有中日合併的奇幻風；

  回到的現世，莫子儀的天文學家設定，時不

  時提到黑洞、超新星等劇情，一度讓人以為

  這部片是天文學+前世今生+冥府設定，讓我

  期待了一下，但隨著劇情的發展，卻是不折

  不扣的文藝片。



  劇情分為三個時序「日殖民的前世」「主角的

  年幼時期」「現世」，但這三個時序間沒有太多

  的關連，至少在前一小時是幾乎各演各的，在

  劇情後段才稍微串連，且劇情剪輯過於凌亂，

  不斷在各時序中插換，都可能要即時在腦中自

  行編排劇情邏輯，才不會造成看不懂或是出戲

  。



  其實題材是好的，但覺得並沒有好好利用，

  各時序的前世今生，並沒有運用好連結，導

  致覺得很多段劇情沒有也沒差，例前世情人

  今生為學生的角色，感覺上很莫名的帶過，

  完全沒有覺得這段前世今生值得演出，還是

  只是為了讓唱出好聽主題曲的葉穎能嘎上一

  角？


  雖然覺得劇本再娛樂點，可能比較容易觀賞

  下去，但也許這部並沒有本身設定就是沒有

  甚麼太高的娛樂性，適合靜下來慢慢的看這

  部電影，在心中好好思考生命如何像流水一

  般的好好活下去；然後鏡頭運鏡及音配樂也

  是讓人讚賞的地方，加上如果是常看劇場的

  觀眾，應該可以看到很多熟悉的劇場人客串

  ，算是小驚喜。



  至於莫子儀，雖然沒有《親愛的房客》那樣

  精湛的演技，但在平淡劇情中，能夠演繹出

  備受內心煎熬的研究學者，雖然沒有太大的

  情緒劇情，但臉部表情、眼神演技發揮的非

  常的精湛。



  生命中所有的事都會像河流中的水一樣

  溟溟之中，你要選擇喝下忘川水遺忘？

  還是不願遺忘，只求記得妳眼裡依戀？


  總結可能就文藝版的再世情緣吧




  --'
