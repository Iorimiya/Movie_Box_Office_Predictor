title: '[普雷]水泥烏托邦：末日浩劫-逆風的勇敢嘗試 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看到前半段(一個強者開始受眾人擁戴那邊)，覺得蠻有趣的，有在猜是不是會類似「惡魔

  教室」(The Wave)那樣，透過一個巨大災變，以及災後的群眾心理，來反諷或影射南韓早

  期的強人政治，也就是劇情的推展其實是在映射或反諷南韓的政治歷史進程。


  但看到後半段，又感覺導演似乎不是往歷史反諷發展，而比較像是退縮回了一個一般的災

  難片，最多只是更加著墨於群眾之間的心理鬥爭與組織抗衡，並以一個中性的角度，以及

  女主角片尾的一句話「他們只是平凡的一般人」，來表達政治制度似乎沒有對錯，強人政

  治自然會在適合它與需要它的環境與土壤萌芽茁壯，若是以不同的時空(如公寓遠方救援

  女主角的社群，類似現在的民主社會)來批評「皇宮公寓」所發生的事，反倒有失公平與

  不切實際了。


  這樣勇敢逆風的表達嘗試，我個人是感到敬佩的，尤其是在現今世界局勢的大環境(俄羅

  斯入侵烏克蘭)之下。但真實世界的強人真的能如本片的金煐卓一樣，相對(我要強調是相

  對而已)克制自己的權力慾，甚至在被反對後，還能在外強侵入時願意挺身反抗入侵者犧

  牲自己嗎?我有些存疑就是了。


  --

  我的電影心得分享



  --'
