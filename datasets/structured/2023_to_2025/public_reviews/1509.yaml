title: '[情報] 2024 韓國奧斯卡代表：《水泥烏托邦：末日浩劫》'
content: '韓國稍早公布了提交 2024 年奧斯卡「最佳國際影片」的作品，將以《水泥烏托邦：末日

  浩劫》作為代表。




  《水泥烏托邦：末日浩劫》為韓國知名演員「嚴泰九」的哥哥「嚴泰和」執導的最新作品

  ，他曾經以電影《消失的時間》聞名，以此片獲得大鐘獎最佳新導演的提名。《水泥烏托

  邦：末日浩劫》改編自人氣韓國網漫《愉快的霸凌》的續作《愉快的鄰居》，上週正式在

  韓國上映後獲得影評的高評價，目前也開出了優異的票房成績。


  「因為大地震而一夜化為廢墟的首爾，一切都崩塌了，就只有一處「皇宮公寓」仍屹立不

  搖，聽到傳聞的外部倖存者們紛紛湧入皇宮公寓。為了生存而成為一體的他們，以新住民

  代表煐卓（李炳憲 飾）為中心，徹底阻止外部人士的進出，為了公寓住戶訂定了新的規

  則。幸虧如此，和外面如地獄般的世界不同，對住戶們而言沒有比皇宮公寓更安全平和的

  烏托邦了。然而在無盡的生存危機中，他們之間也開始出現了出乎意料的糾葛……倖存者

  們的生存規則——究竟該遵守還是離開呢？」（取自 GaragePlay 車庫娛樂）




  根據韓國「電影振興委員會」的公告指出，今年一共有 13 部電影申報競逐國家代表，《

  水泥烏托邦：末日浩劫》之外其他包括《贖命救援》、《HERO》、《逃出寧靜海》、《火

  線交涉》、《Target》、《闇黑對決》、《Hopeless》、《神鬼海底撈》、《誆世巨作：

  蜘蛛窩新宇宙》、《鬼夢遊》、《Road to Boston》和《The Hill of Secrets》。


  今年七名評審最終縮小範圍在《水泥烏托邦：末日浩劫》與《誆世巨作：蜘蛛窩新宇宙》

  兩部作品中做選擇，並一致通過選出《水泥烏托邦：末日浩劫》。由女演員「方銀珍」作

  為主席的評審團認為該片在商業與藝術中取得優秀的平衡，與《寄生上流》擁有一致的寓

  意性。且該片由李秉憲等在美國擁有知名度的演員主演，在公關造勢上已擁有先天的優勢

  。該片目前似乎尚未賣出北美的版權，接續電影振興委員會將與樂天共同努力在北美尋找

  有力的電影公司進行宣傳，而該片先前已入選獎季的大站「多倫多影展」，將作為第一步

  的宣傳重點。


  韓國在 2020 年曾創下歷史以《寄生上流》成為奧斯卡史上首部拿下最佳影片的外語電影

  ，接續幾年則尚未能延續熱度，僅有《分手的決心》在今年初入選短名單。



  --'
