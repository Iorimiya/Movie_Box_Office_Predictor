content: "《》\n\n公開！\n\n《》團隊斥資200億\n\n打造今年最驚心動魄災難浩劫！\n\n全球浩劫    首爾滅絕\n\n除了我們的公寓以外，一切都崩塌了...\n\
  \nx x 末日求生！\n\n\n《》\n\n8月10日 (週四) IMAX 同步震撼上映！\n\n電影預告：\n\n\n\n上映戲院：\n\n\n\n繼《》後韓國又一熱門話題漫畫\n\
  \n改編電影即將席捲全球！\n\n全球152個國家爭購版權瘋搶上映，\n\n又一災難巨作！\n\n2023 加拿大多倫多國際影展 正式入選\n\n2023 西班牙錫切斯影展\
  \ 正式入選\n\n2023 美國夏威夷國際影展 正式入選\n\n《白頭山：半島浩劫》、《梨泰院CLASS》、《婚禮的那一天》\n\n等實力巨星精彩共演\n\n\
  全球經歷一場世紀大地震後，一切都崩塌了，在化為廢墟的首爾中，倖存者們展現患難中\n堅強的求生意志，也面臨殘酷的人性抉擇，這場災難浩劫中的生存戰，誰能活到最後？\n\
  \n #\n\n資料來源：\n\n--\n怎麼不是回韓國電影不推吧"
