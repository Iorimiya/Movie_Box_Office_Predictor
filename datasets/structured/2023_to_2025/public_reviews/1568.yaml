url: https://www.ptt.cc/bbs/movie/M.1689667863.A.917.html
title: '[負雷] 不可能的任務：致命清算 第一章'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  這系列第一次接觸是4的鬼影行動

  我都還依稀記得當初在電影院看的時候有多緊張

  各種看似不可能的任務，非常的名符其實

  從那之後後續有推出新的作品都會去電影院看


  這集致命清算推出前，還特別在網飛上把1 2 3集補完

  就帶著老婆去電影院看

  結果看完後我們兩個一致認為很普

  不知道是我們胃口被養大了還是怎樣

  內容很不像不可能任務會有的水準


  整個劇情上沒有讓我感覺到什麼重大危機

  沒有什麼核彈要發射

  什麼兩國一觸即發那種危機感

  就是個看不見的AI說牠會造成威脅

  AI哪來的也不知道



  以下內容憑印象打的，可能會有錯誤，請見諒



  首先電影中不知道為什麼伊森對葛莉絲整個很執著

  一直不斷的去抓她，然後跑走，又再抓，又跑走

  第一次抓她可能不了解她，所以烙跑還可以理解

  但都知道對方很會跑了，還一直讓他有機會跑

  伊森不知道為什麼整個抓上癮，看她比看伊爾莎還重


  而伊爾莎明明是個特工，理論上應該很強才對

  結果莫名其妙的被蓋布瑞刺死

  劇情給我的感覺很像故意送頭

  難道就因為前面再談判的時候蓋布瑞預告說AI說兩個女的會死一個

  所以這兩個女的就像嗜血鯊魚一樣一直往蓋布瑞的位置衝去?


  或許可以說是因為AI誤導的關係才導致葛莉絲往蓋布瑞那跑去

  但誰說一定要戀戰的？況且葛莉絲打到一半伊爾莎衝過來參戰

  葛莉絲就不知道跑哪去休息，直到伊爾莎被幹掉，伊森過來掉眼淚

  葛莉絲才跳出來說都是自己的錯

  而且蓋布瑞有夠聽話，AI說死一個就真的只殺一個，直接放過葛莉絲


  伊森跳傘更是感覺沒有很必要

  你有辦法把葛莉絲送上火車，為什麼自己沒辦法一起上去?

  蓋布瑞有辦法把自己裝在行李箱偷渡上車

  派瑞絲有辦法從橋上跳上火車(這最嘲諷，感覺有夠簡單，蓋布瑞為什麼不一起跳?)

  然後堂堂伊森，什麼地方都有辦法潛入的伊森，沒辦法搭火車，完全問號


  然後班吉也不知道在忙什麼，在那邊瘋狂開車，不知道要開去哪裡

  開到一半還換成自動駕駛開始打電腦

  打到一半還很火大的叫伊森快點跳傘，他壓力好大

  完全看不出班吉壓力大在哪裡


  而且降落傘的速度要能夠算準高速移動的火車的窗戶

  還要破窗而入也太扯了吧?

  難怪伊森跳傘後畫面就切掉了，不讓觀眾看他怎麼上火車的


  另外伊森上火車前的葛莉絲被追這段也很想吐槽

  敵人已經看到鑰匙在桌上，還不開槍打葛莉絲

  還要另一個同伴先過去拿鑰匙，拿完鑰匙自己不開槍，叫同伴開

  同伴聽到命令後不知為何一整個超慢動作的掏槍

  緩慢到我還以為再看中國古裝劇，根本擺明就是編劇不想讓葛莉絲死



  最後火車掉落有比較精彩，但是火車掉落的橋段感覺看很多了

  不知道為什麼沒有覺得很緊張(胃口被養大了?)

  然後伊森本來快掉下去，還被瞬間移動的派瑞絲抓住

  派瑞絲在前面因為被蓋布瑞捅一刀奄奄一息，不知道哪裡來的神力瞬間移動

  還力大無窮的把伊森+葛莉絲抓上來，抓上來後又突然奄奄一息


  而且派瑞絲被捅一刀也很怪

  前面伊爾莎或葛莉絲會死說是AI算出來的結果

  那現在蓋布瑞捅派瑞絲一刀是因為他覺得派瑞絲會背叛

  結果派瑞絲反而是因為被捅了一刀才背叛

  AI沒有跟蓋布瑞說如果你背叛派瑞絲，派瑞絲就會背叛你嗎?

  退一步說，如果懷疑派瑞絲會背叛，又幹嘛讓他一起聽機密訊息

  不能叫她去外面待命嗎?

  讓人家聽訊息，聽完後說妳會背叛是在搞笑嗎?

  真的怕人家背叛還把自己關在行李箱，不怕派瑞絲不來幫你解鎖嗎?

  而且覺得她會背叛，為什麼不直接偷襲派瑞絲就好?

  還要預告說我現在要捅你一刀了，因為你可能會背叛


  最後蓋布瑞逃跑的方式也很奇怪，燒炭工都被他幹掉了

  沒人燒炭，加上火車時速也不是定速

