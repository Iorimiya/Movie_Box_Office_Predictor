content: '看原PO下面推文都說第四集很好看


  我其實也覺得很讚


  但是又有點美中不足的地方是


  反派不覺得跟連恩一樣都很廢嗎


  不是以往那種大BOSS很會打架那類型


  比較像鬥智型的 跟大陸翻譯碟中諜一樣概念


  一個是鬼影行動只會戴面具變臉的大BOSS


  一個是失控國度只會叫手下去做事


  大家都不會覺得這老大很爛想造反嗎


  後面被玻璃圍起來之後覺得怎麼那麼爛又弱的感覺


  但完全不會減少精彩度就是了


  大家覺得大BOSS有沒有很會打很重要嗎～



  --'
