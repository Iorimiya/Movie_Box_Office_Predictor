url: https://www.ptt.cc/bbs/movie/M.1689152126.A.65F.html
title: '[贈票] 不可能的任務：致命清算 第一章'
content: '已贈出，

  感謝大家的來信，就不一一回信了




  手上有多一張票，如果丟掉也是浪費

  看看電影板上有沒有人想要一起去看


  時間地點如下


  2023/07/16 1300 信義松仁威秀影城

  因為是包場的，所以威秀官網不會出現該場次



  希望是喜歡阿湯哥以及具有良好觀影水準的人來信

  因為我會坐你旁邊，所以不希望是雷包


  不遲到、不中途離席(包含上廁所)、觀影中不用手機/開靜音、

  電影開始放映至結束前不交談



  以下是來信要回答的防呆題


  「你」最討厭在電影院遇到什麼行為影響到你看電影的觀眾及其原因




  請先確定時間跟限制條件都符合再來信回答防呆題，謝謝


  --

  超雷，遇到這種的我會直接怒買二刷的票



  片長很長沒錯啦，但入場前上個廁所應該不難吧？


  如果自認膀胱小的，那該更有自知之明不要在觀影的時候喝太多液體。

  我之前看 TOP GUN 1+2 連映也是從頭坐到尾沒離席過喔，

  包含第一集播畢後的休息時間都是坐在位置上的(笑)


  真的非常不喜歡放映期間中途離席的人



  合者則來，不合則去

  還是有能配合的板友來信來索票

  這次純粹是不想浪費票才上來贈票

  不然我平常都一個人看電影居多

  因為身旁很多朋友沒辦法配合我龜毛的原則



  我自已也有戴 apple watch，進場後都直接取下來丟進包包裡XD



  之前遇過看動畫片，放預告片時有小孩放聲大哭，家長 HOLD 不住、安撫不下來

  我就直接開口說要哭就去外面哭不要干擾其他人看電影



  好慘..拍拍你QQ

  遇到這種我會直接再二刷一次..



  謝謝眾多板友的來信

  已順利贈出'
