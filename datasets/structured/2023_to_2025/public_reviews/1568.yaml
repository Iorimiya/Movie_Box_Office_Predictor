url: https://www.ptt.cc/bbs/movie/M.1688661023.A.530.html
title: '[無雷] 不可能的任務：致命清算 第一章'
content: '剛看完特映，真的是為大銀幕而生的電影，光是看阿湯哥一直跑跑跑就值回票價了。進場

  前是抱著很高的期待去看，沒想到看完很滿足。


  預告裡面的單手開車、高空跳傘、火車墜落都是來真的，目前網路上都有釋出一些幕後花

  絮，看完之後真的會覺得阿湯哥很努力在打造一部「戲院專屬」的電影。


  劇情部分滿直線的，預告就可以看出有搭上前陣子很夯的話題，就是大家搶奪一個東西然

  後跑遍全世界，而且算緊湊一直有動作戲跟緊張感。將近三小時的片長尿點卻不多，大家

  進場前多上幾次廁所、少喝一點水。


  這部唯一的缺點就是如同片名是第一章，劇情會在一個還算合理的地方中斷，期待下一集

  。


  今天是看一般廳，看完會想二刷IMAX。


  --


  第4集太經典了無法超越，4在我心目中是最喜歡的一集。'
