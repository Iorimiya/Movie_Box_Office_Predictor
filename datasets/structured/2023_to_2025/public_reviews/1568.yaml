url: https://www.ptt.cc/bbs/movie/M.1689731190.A.9F4.html
title: '[ 好雷] 不可能的任務：致命清算 第一章'
content: '雷文防雷資訊頁


  不可能的任務：致命清算 第一章

  Mission: Impossible – Dead Reckoning Part One

  2023美國電影



  劇情講述伊森溥皐S和他的不可能任務情報局（IMF）團隊展開他們迄今為止最危險的任務

  ：阻止一件威脅著全人類的危險武器落入惡人的手中；隨著世界的命運危在旦夕，伊森過

  去的黑暗勢力也找上門來。




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  個人滿意度80分（滿分100），低於看片前的預期，驚險橋段及畫面特效很讚，火車上的

  緊張危險戰鬥，前陣子看了2023電影印第安納瓊斯：命運輪盤，也有，不約而同的劇設，

  都在瑞士？本片的劇設人設不滿意，前段燒腦，看到霧煞煞，後段改善一些，續集仍然期

  待。


  以下有劇透，爆雷。




  本片劇設人設不滿意。


  1.三位女性主要角色，硬要設定某位領便當，某位存活接替，把人設弄得不討喜及懷疑為

  何...，某位已不像前系列的人設感覺。編劇大筆一揮，命運已定，性格及行為設定就是

  朝向死亡的界限。但看起來就不夠自然，更不開心。


  2.前系列劇情拍案叫絕的感覺降低，劇設是常見的AI vs 政府黑幕人物vs反政府...多方

  交戰陰謀設定？


  3.可以注意到很多場景只有少數幾個人，想像工作人員都戴著口罩，以及鏡頭不在他們身

  上時的演員們的狀況。 在新冠肺炎大流行期間製作一部這樣的大電影，並不容易，但它

  確實呈現了這一點？


  4.A.I.的情節相當不錯，Tom Cruise扮演的主角，他一開始仍未知的背景故事也很有趣，

  但整個故事基本上都是圍繞著：“我拿到了鑰匙，現在她拿到了鑰匙，現在他拿到了鑰匙

  ...”等等。 偷來偷去的劇設，令我傻眼。


  5.劇設有一點毀掉電影預告片中，摩托車從高空跳躍的高度期待。 如果你看過預告片，

  你就看過這個場景。 實際上本片只有幾個驚險動作系列的橋段，沒有什麼是我們以前沒

  見過的。 我個人最喜歡火車快飛，主角群在火車內，快掉到橋下去的驚悚橋段。



  --'
