  《不可能的任務：致命清算 第一章》正式在羅馬世界首映，由於湯姆克魯斯臨時和義大利

  總理喬治亞梅洛尼會面，活動延遲了 90 分鐘才展開，但當阿湯哥、導演克里斯多弗麥奎里

  和電影群星蕾貝卡弗格森、賽門佩格、凡妮莎蔻比等人抵達首映會現場，粉絲依然給予熱情

  掌聲。


  《不可能的任務：致命清算 第一章》延續了《不可能的任務：全面瓦解》中的事件，湯姆

  克魯斯飾演的伊森杭特和他的特工隊伍在一連串的雙重背叛中，從核末日中拯救了世界。20

  18 年的上映的《不可能的任務：全面瓦解》是該系列至今最賣座的作品，全球票房收入近

  8 億美元。



  正如預期，《不可能的任務：致命清算 第一章》在首映中由於其驚人的特技而好評如潮。

  上映前宣傳中，最讓人印象深刻的驚險場面就是湯姆克魯斯親自騎著摩托車高速從懸崖俯衝

  而下。


  《不可能的任務：致命清算 第一章》將於 7 月 11 日在台上映，首映會後，首波媒體反應

  也已解禁



  《Collider》作者 Perri Nemiroff：


  「《不可能的任務：致命清算 第一章》是這個系列的另一次勝利。電影中的動作設計，拍

  攝起來會讓觀眾真正覺得自己置身於行動之中，你可以感受得到。這次電影也真正挖掘了任

  務以及他們所追求的技術如何影響角色的性格發展。


  湯姆克魯斯一如既往是 A+ 等級，蕾貝卡弗格森也還是最受歡迎的角色，但新加入這個系列

  的海莉艾特沃最讓我眼睛一亮。她什麼都可以！動作片、喜劇片，擅長許多方面，同時也在

  其他部分發揮自如。她是電影最迷人的表演／角色設計之一，也是一個非常令人愉快的角色

  。


  她和湯姆有一個和飛雅特 500 有關的場景，笑到讓我流眼淚。再提一個動作設計——火車

  戲中有一個特定的場景讓我驚訝到下巴直掉地板上。 這 2 小時 43 分鐘，我會一遍又一遍

  地愉快地觀看。」




  Gizmodo & io9 資深記者 Germain Lussier：


  「《不可能的任務：致命清算 第一章》非常棒。 具有爆炸性、適合當下故事、優秀的新角

  色，種類繁多的動作設計，最終大場面在整個系列中是前 2-3 名。 電影有時會變得有點愚

  鈍，但靠著步調和緊張程度，可說是瑕不掩瑜。」



  《Indiewire》執行編輯 Kate Erbland：


  「最近一連串瘋狂的電影上映後，《不可能的任務：致命清算 第一章》有很多目標必須達

  成，但我可以很快速地說，在最近一堆分成 Part 1 和 Part 2 的電影之中，它是做得最好

  的！電影確實在為下半部做準備，但同時也保留了完整性。」



  爛番茄影評 Erik Davis：


  「觀賞《不可能的任務：致命清算 第一章》絕對是一段超棒的體驗，一部完美製作的動作

  片，娛樂性滿點。每段動作戲都不短、瘋狂又激烈，故事非常龐雜，但我喜歡電影拍的很完

  整，又讓你死也想知道接下來發生什麼事。」



  《Collider》主編 Steven Weintraub：


  「《不可能的任務：致命清算 第一章》非常不可思議。這是好一段時間以來，我看過體感

  最短的 2 小時 30 分鐘以上電影。今年最好的電影之一，阿湯哥又再度做到了！必須要在

  最大的銀幕上觀賞才行，我會瘋狂推薦這部電影。」







  --'
