url: https://www.ptt.cc/bbs/movie/M.1689680403.A.728.html
title: '[普好雷] 不可能的任務：致命清算 第一章'
content: '雷





















  先說為什麼給普好雷


  1.

  片長跟上一集其實只差了十幾分鐘，上集體感時間很短、劇情流暢，而這集的節奏跟剪輯

  卻讓人覺得有點怪，有些橋段其實可以更精簡一點



  2.

  伊爾莎從前兩集的演出來看，其實算是頂級戰力，但這集卻以莫名的方式發便當（先撇除

  可能跟隔壁family 一樣假死或復活的可能性），改讓葛蕾絲上位的意圖很明顯，這部分

  應該能處理得更好




  再來是我覺得不錯的部分



  1.

  中間伊森跟派瑞絲（加一位雜魚）在威尼斯巷弄的打鬥，有把伊森的心急如焚的感覺呈現

  出來，打起架來有股痛感，派瑞絲的演出也夠瘋



  2.

  結尾的越野機車+跳傘特技，知道是本人親自上就更覺得驚人，像阿湯哥這種堅持實拍的

  在好萊塢越來越少了，且看且珍惜


  綠幕如果善加利用雖能呈現更漂亮的畫面，然而實拍畫面的樸拙感與誠意卻是難以取代的


  這樣的堅持或許反映了戲裡對抗人工智慧的主軸






  總之雖然有節奏不順、稍嫌冗長的缺點



  不過單看動作場面還是不錯的




  --'
