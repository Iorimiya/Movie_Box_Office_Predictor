title: '[  雷] 不可能的任務：致命清算 第一章'
content: "好幾年沒回老家的電影院看\n票價早已高到嚇死人QQ\n \n \n防雷\n \n \n \n \n \n \n \n \n \n \n \n \n\
  \ \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n\
  \ \n \n \n \n \n \n \n \n \n \n \n \n \n先說結論：依然不錯看,但有人不喜歡完全不意外\n所謂的不喜歡大概有兩點\n第一個在於片長太冗長\n\
  第二個在於這集和過往系列作風格有變\n \n第一個很好解釋\n不可能的任務向來都是乾淨俐落的用一集的時間\n跳了一場精彩緊湊的諜報之舞\n大家如坐針氈的同時會興奮的為他拍手\n\
  但這集不只沒有延續此風格,節奏也抓不是很好\n \n第二個就是一些不一樣的風格,主要在於扒手女主角\n她的出現讓這集混入了不同的東西\n在我看來是現代商業片會有的尷尬場面\n\
  像是羅馬那段他們換黃色車車之後的笨拙逃亡\n跟這個系列沒有很合得來,這裡也是最該被剪掉的\n還有過往的角色我印象中根本沒有什麼是雷包\n但這位小姐一直想自保逃跑反而惹出更多麻煩\n\
  這些早就了她不討喜的原因\n（不過他最後加入對這個角色的曲線做了很棒的安排\n \n雖然這集絕對有著不可忽視的缺點\n（而且有沒有看過前面六集也有差\n但我依然覺得很不錯,最讓我喜歡的莫過於\n\
  Pom Klementieff的角色,她真的真的真的好帥啊！\n每個有她的畫面我都捨不得眨眼睛\n那開車時的狂野和微微拔刀出鞘的殺氣\n我願意被她撞死或砍死（愛心\n\
  咳咳,我想說她也算駕馭角色很不錯\n螳螂女感覺就跟她高冷形象完全不搭,但還是演的可愛\n我覺得她下集會復活,不然說她還有脈搏就沒意義了\n \n其他角色就算是大致維持水準\n\
  班吉還是很搞笑,路德依然很沈穩\n除了比較有爭議的艾爾莎這集比較沒表現機會\n她的話我是覺得真死了,但我猜蕾貝卡弗格森不想演了\n不然我覺得很可惜這角色沒有給她一個完整的安排\n\
  而伊森還是很帥氣,雖然這集他的打戲也明顯退步\n然後作為賣點的摩托車跳躍不算太短但也不夠長\n看來真的是湯姆克魯斯想玩這個藉由拍片實現\n但還是很棒很不容易啦,我還是看的瞠目結舌\n\
  \ \n總之這集有人不喜歡完全很正常\n我也是後面比較習慣節奏了才看的比較享受\n不過如果他是在疫情時克難拍出來的\n有些不足倒是可以理解,希望下集能扳回一城\n\
  還有無論這部電影的好壞,真的要且看且珍惜\n現在有誰會為了觀眾這樣玩命？\n只要想到這個我就願意繼續買票進場\n----\nSent from on my iPhone\
  \ 14 Pro Max\n \n--\n萊斯特在最後敘述中講述了生活中有意義的經驗，他說，儘管他死了，他還是很高興，因\n為這世界上有這麼多的美\n \n--"
