title: '[新聞] 阿湯哥 致命清算 第一章 雙十上串流'
content: '終於放棄掙扎？阿湯哥「致命清算 第一章」雙十上串流


  2023-09-12 21:45


  聯合報 記者蘇詠智／即時報導




  「不可能的任務：致命清算 第一章」戲院票房不如預期，期望在影音上架後反敗為勝。

  圖／摘自IMDb


  湯姆克魯斯今年推出的力作「不可能的任務：致命清算 第一章」，由於成本高達2億9000

  萬美元，美國票房僅及1億7100萬美元，全球總票房至今為5億6300萬美元，預估戲院收入

  將會賠本，而派拉蒙似乎認清現實，放棄繼續在北美各地戲院再做掙扎，宣告10月10日開

  始在數位平台上架，10月31日推出 4K超高清藍光。


  「不可能的任務：致命清算 第一章」上映之前，被各方看好會是今年暑期最熱賣的大片

  之一，由於湯姆克魯斯去年的「捍衛戰士：獨行俠」全球票房逼近15億美元，美國賣座也

  破7億美元，雙雙締造他從影以來的新紀錄，各方推論觀眾對他的支持可望延續到「致命

  清算 第一章」上。


  不料該片上映後一周多立刻面臨「Barbie芭比」與「奧本海默」的聯手重擊，賣座遠不如

  預期，反而成了今夏的票房大輸家。


  有網友表示看到「第一章」就覺得還會有「第二章」，顯然片子並沒有結局，還需要等到

  下一集，因此打消上戲院的念頭。


  現在該片即將轉戰影音平台，能否反敗為勝？各方都在等著瞧。


  對於湯姆克魯斯而言，「致命清算」的「第一章」賣座反應對於「第二章」影響重大，就

  算戲院表現不佳，影音平台若能有不錯的迴響，至少能夠稍稍彌補。




  「不可能的任務：致命清算 第一章」即將於10月10日在數位平台上架。圖／摘自IMDb


  新聞網址：






  --'
