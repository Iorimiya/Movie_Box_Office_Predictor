title: '[好雷] 不可能的任務:致命清算 第一章'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  其實也沒什麼雷可以寫


  整部看下來都很精采


  除了羅馬追車跟跳火車有點冗


  其他都還不錯  除了愛爾莎領便當  QQ  為啥主角們都不愛拿槍


  令人失望的部分就是少了各種意想不到的科技小物


