  接下來戲份要給女小偷吧


  每個人拿到可以毀天滅地的鑰匙

  都隨手放口袋

  一直被偷

  真的有很重要?



  劇情 打鬥比很多特務片差

  還是只是前菜

  就等接下來會不會比較精彩了


