url: https://www.ptt.cc/bbs/movie/M.1757937588.A.810.html
title: '[新聞] 《捏造：史上最惡殺人教師》綾野剛、龜梨'
content: '新聞網址：


  《捏造：史上最惡殺人教師》　綾野剛、龜梨和也大銀幕對決


  綾野剛（中）飾演遭家長控訴體罰虐待學生的小學教師。（光年映畫提供）

  文 項貽斐


  日本懸疑話題電影《捏造：史上最惡殺人教師》由鬼才導演三池崇史執導，兩大實力派演

  員綾野剛與龜梨和也主演，故事改編自福田真澄獲得新潮紀實文學獎的『捏造：福岡「殺

  人教師」事件的真相』，真實重現2003年日本福岡一宗震驚日本的懸案，再次掀起社會對

  「媒體審判」深刻反思。

  電影描述小學教師藪下誠一被家長冰室律子指控對其子施以體罰，母親憤而向週刊記者投

  訴，週刊以「實名報導」刊出調查文章，並以煽動性標題震撼社會。事件一經曝光迅速發

  酵，小學教師陷入輿論風暴，遭受停職、誹謗、朋友疏遠與家庭瓦解的多重打擊。

  隨著媒體不斷擴大報導，支持學生家長的聲浪如滾雪球般擴大，甚至組成多達550人的龐

  大律師團提起前所未有的民事訴訟，社會輿論幾乎一致認定教師必敗無疑。然而在法庭上

  ，教師與律師堅決否認所有指控，展開辯護。真相與謊言的界線愈發模糊，觀眾將被迫直

  視媒體操弄、群體審判與人性灰色地帶的恐怖現實。

  演技派男星綾野剛在片中飾演同時帶有危險氣息與脆弱靈魂的教師，他形容這是一次極為

  罕見的挑戰：「劇本呈現多面現實，每一場戲都像跨領域的格鬥賽，與不同世代的演員正

  面交鋒，每一次對戲都必須全力以赴。17年後再度與三池導演合作和14年後與龜梨共演，

  讓我充滿戰鬥的快感。」綾野剛特別讚賞原著作者福田真澄的調查精神，真實全貌或許無

  人能知，但作者以驚人的毅力挖掘真相，這份精神卻深深打動他。




  《捏造：史上最惡殺人教師》中的龜梨和也飾演鍥而不捨的八卦記者。（光年映畫提供）

  龜梨和也挑戰詮釋帶有強烈矛盾感的週刊記者，角色既肩負揭露真相的社會責任，又因報

  導可能成為「加害者」。他坦言接下這個角色時內心掙扎：「這並不是一個可以立刻答應

  的角色，但能與綾野剛再度合作，最終推了我一把。拍攝過程中我不斷思考，人類的複雜

  遠超想像，很多時候並不存在唯一的正解。」

  片中最令人屏息的高潮場面，莫過於綾野剛飾演的教師在傾盆大雨中懇求證人出面，而龜

  梨和也飾演的狗仔記者守候多時冷眼按下快門。實際拍攝時因突如其來的豪雨持續拍攝，

  導演乾脆將天候變化納入場景，使畫面更顯真實。

  綾野剛憶起那場戲笑說：「現場像真正的綜合格鬥，每一秒都在與極限對抗。」龜梨也盛

  讚對手：「綾野是一個冷靜且無法被取代的存在，他的表演讓人完全投入。」，兩人自

  2010年《妖怪人間貝姆電影版》合作以來雖14年未共演，但私下仍保持聯繫。龜梨透露：

  「雖然上一次合作只有短短兩三天，但那段時間留下的情誼一直在心中，這次能再度並肩

  作戰，像是命中注定。」


  《捏造：史上最惡殺人教師》將於9月19日全台上映。


  --'
