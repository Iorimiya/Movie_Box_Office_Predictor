title: '[好雷] 捏造：史上最惡殺人教師'
content: '這是一部改編自真實事件的電影。



  事件發生在 2003 年，那個網路尚未像現在這麼普及的時代。當時，僅靠報章雜誌與新聞

  媒體的報導，就足以毀掉一個人，更何況是那些未經證實的消息，往往能讓人瀕臨崩潰。



  小學老師藪下誠一（綾野剛 飾）被所謂的「怪獸家長」冰室律子（柴崎幸 飾）指控，對

  自己的孩子施以體罰，並進行言語上的歧視與霸凌。事件在被週刊記者報導後，導致藪下

  誠一遭受無止盡的謾罵與批評。



  校方的教務主任與校長一心只想息事寧人，一味要求老師不論對錯先道歉再說，反而使事

  態更加惡化。



  然而，事情的真相其實只是孩子因害怕犯錯被家長責備，才隨意將責任推卸給老師。雪球

  越滾越大，家長開始將各種憑空捏造的謊言一一說出口。所幸最後遇到一位好律師，才得

  以贏得這場艱難的官司。



  電影開頭從家長視角出發，呈現「殺人教師」般的形象。綾野剛將說話冷酷無情、體罰兇

  狠的模樣演得令人毛骨悚然，在這樣的鋪陳下，觀眾真的會認為柴崎幸那一方才是真正的

  受害者。



  隨後鏡頭轉向藪下誠一作為老師的真實面貌，兩者反差極大，也再次讓我佩服綾野剛精湛

  的演技。



  柴崎幸飾演的怪獸家長冰室律子同樣令人印象深刻。她面無表情地陳述著完全不符合事實

  的指控，壓迫感十足。



  中段有幾場戲特別令人難忘：藪下看到電視新聞報導後情緒崩潰、怒踹電視，接著氣到尿

  失禁；以及在證人家門口與記者對峙，最後在暴雨中痛哭的場景，都深深烙印在腦海中。



  後段法庭上一鏡到底的意見陳述，更是充分展現綾野剛不凡的演技，絕對稱得上是他的代

  表作之一。



  如果這部電影有推出中文版藍光，我真的會想買來收藏。


  --

  幫你改錯字了w

  這部確實是最近看過的電影中主角演技最強的一部

  如果那群孩子是在踢足球的話我會想到老菜鳥w'
