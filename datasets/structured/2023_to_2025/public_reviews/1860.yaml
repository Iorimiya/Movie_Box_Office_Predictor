title: '[好普雷] 淘氣小企鵝啵樂樂：巨龍城堡大冒險'
content: '今天帶姪兒姪女去看~ 有點可惜應該是欠宣傳

  廳內的人很少~ 不過明明這個卡通在幼幼台跟木棉花都播過

  應該有一些小朋友粉絲~ 照理說應該會有更多觀眾才是


  給普雷是因為如果用大人的眼光 劇本確實有點平鋪直述太簡單~

  就是龍王因故失去力量 力量被封印 壞人想搶走 啵樂樂企鵝帶領同伴幫忙 最後贏了


  但其實以小朋友眼光 淺顯易懂 最後也是在強調友情的重要性

  過程中有魔法 有搞笑 有龍 有可愛動物 有機器人

  也有充滿各種元素的大混戰~ 這樣已經夠了

  個人覺得10歲以下的小朋友都可以看的蠻開心

  就算來不及上電影院看 之後上串流也不失是個讓小朋友不要吵安靜看卡通的選項XD


  比起故事本身 其實更佩服的是韓國連動畫電影領域都開始有模有樣了

  僅管流暢度可能還略遜好萊塢 但是3D跟手繪的表現已經很成熟

  主要的兩首OST也都是專門寫 找專門歌手為動畫唱的


  希望台灣的動畫電影 也能有等量齊觀的成長跟進步呀(嘆)


  --'
