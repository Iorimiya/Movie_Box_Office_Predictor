url: https://www.ptt.cc/bbs/movie/M.1723476590.A.C65.html
title: '[負雷] 圈套 看過最爛的糞片'
content: '我這邊先說


  我未來如果再去電影院看奈沙馬蘭的片我就XXXXXXXXXXXXX


  馬的現在想到還是很氣，我看完到底看了什麼鬼

  這應該是我有生以來去電影院看過最爛的電影了


  早知道就先看PTT影評，之前不看影評是因為預告說什麼鬼反轉，反轉在反轉

  怕被雷到，糙! 電影院400我寧願拿去丟地上也不想浪費時間看這什麼B級片

  說B級片還算是稱讚他了，比好萊塢電影台播的變形蛇王，環大西洋還要爛!!


  以下防雷 (幹，好像也沒什麼雷)




  預告片真的很屌，屌到還以為這部電影是在一個演唱會裡面，兇手如何用智慧去逃脫

  警察的追捕


  結果殊不知他X的整場都是看奈沙小馬的爛他女兒在那邊唱歌跳舞唱整場的

  不說我還以為我在看什麼演唱會紀錄片，整部片105分鐘，至少有1小時都在聽她在唱歌


  整場唱完就算了，還得看他女兒的爛演技!!


  不懂喬許哈奈特怎麼會接這種糞片，要劇情沒劇情，要動作沒動作，要鬥智沒鬥智

  要反轉也沒反轉，可以再去客串大熊餐廳第四季或是演關鍵密碼2嗎? XD


  整場除了看她女兒在唱歌，就是喬許在那邊走來走去，看人不爽推個人下樓

  把瓶子拿去油鍋搞爆炸，偷個警用無線電，威脅人帶他出去...

  被警察圍捕瞬間就逃脫，直接忽略是如何逃脫的，還有時間穿上警用制服上車


  最後還很白癡的犯完案又回到他家找他老婆然後被抓，結束!


  隨著電影院的燈亮起，我懷疑我中了預告片的圈套才會去看這部電影..X


  --'
