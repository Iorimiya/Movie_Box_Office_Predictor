url: https://www.ptt.cc/bbs/movie/M.1722533601.A.DA9.html
title: '[負雷] 圈套-我不是來看你女兒開演唱會的'
content: '以下無雷心得


  看完頭好痛，覺得最大的圈套是我進電影院卻只是看導演女兒開演唱會。


  一直很喜歡奈沙馬蘭以前的片，即便看了詭老和敲敲門依然不離不棄的我活像個白癡。


  劇本極其敷衍，不縝密也不合理，更完全沒有要側寫主角的心理，因為女兒的演唱會比較

  重要嘛。


  鏡頭隨便，根本不在乎觀眾看到什麼。

  拍女兒鏡頭倒是很認真對焦，連演一下都不演。扯到最後我不知道該哭還是笑。


  演唱會的場景設計跟調動大概費了電影最大的心力。


  到底有哪個導演大膽到直接設圈套給粉絲？

  喔，我知道你很愛你女兒了，然後呢？


  好吧，說點好的，男主角演技進步很多。


  --

  《窺探者》相較之下氛圍算不錯～

  但是女兒演唱會我不行 哭

  真後悔當初沒有進電影院看她演唱會，聽說很讚！

  我倒是忘不了了 哈哈

  毫不掩飾的父愛

  再給你幾天好好想想～

  是不是因為女兒在的時候鏡頭都特別認真（笑）

  欸我反對，《探訪》滿可愛有新意的吧～

  而且我喜歡《破天荒》

  接下來很多好看的電影，可以先看別部片，這部片等平台吧（認真）

  把錢拿去加碼小丑2去更好的廳享受，不是很好嗎？


  或者你可以去試試～這絕對不是圈套～


  如果硬要支持一下奈沙馬蘭，可以去二輪看他另一個女兒拍的電影《窺探者》，雖然評價

  有好有壞，起碼是認真地呈現一個故事。（不知道還有沒有上）

  以新導演而言我覺得還不錯。'
