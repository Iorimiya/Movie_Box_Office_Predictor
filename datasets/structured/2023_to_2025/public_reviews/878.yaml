title: '[普雷] 圈套 Trap 喬許1對5女力含4母愛，刻意？'
content: '這部片開頭的鋪陳我沒認真看，反正它基調就設定要由淺入深


  中間開始，定調這部就是賣喬許哈奈特的顏藝、小動作與穩定的攝影、運鏡、小成本控制得

  宜的場景規劃，剩下就是劇情與節奏間隔


  到後面有點可惜，雖然可以說是要表現他多精明能有讓人意想不到之舉，一直到最後一幕也

  是


  不過從第一次被 FBI 包圍抄家能聲東擊西加變裝 SWAT 開始，就有點出戲


  也可以說是效果處理得不夠好，節奏輕重開始問號


  然後，我感覺到那股怪怪的感覺是什麼了…



  就是5女力含4母愛


  兒子扣掉不算在內，不是我硬扣的喔，他真的沒什麼戲份啊就是個連「發聲或勸說感化」都

  沒有也沒有緊張戲份的裝飾…與底下五女力的對照吧？



  女兒，鏡頭不少但仍像裝飾用吧，懶得形容


  渡鴉夫人，就演個當紅女偶像歌手的角色，大眼大睫毛大鼻子大奶小隻馬蘿莉黑人…到底是

  不是故意找個很不協調的大眼柔膚濾鏡臉的演員呀？還是真的在展示 AI 套用到真人演員的

  臉的技術？


  不時有鏡頭露臉的 FBI 負責帶隊跟這個屠夫案調查圍捕和側寫專家的老女人…根本沒戰力

  呀！

  只會裝專業穩重，不如沉默的羔羊演菜雞的無敵茱蒂


  讓兩個同事兩把電擊槍包圍，電不夠，一個同事被喬許靠過去戳眼窩倒地，大家反應極小，

  無戰力女組長專家補補第三把電擊槍，欸，就成功逮捕了(沒人理倒地的同事明明鏡頭就在

  旁邊)


  老婆，後面被男主角追問，原來她早就發現老公不知有說謊自然的專業能力和怪怪的行為，

  也意識到可能老公就是屠夫，選擇偷偷私下技巧性幫 Cover


  男主角的媽媽，以回憶、心魔、幻想的方式出現，在表達與男主角小時候的「初期可能有被

  媽媽看出異樣」的描述時特別會被召喚出來



  女力就是這五個，母愛就是女兒以外的那四個



  這是很刻意的設定？好像至少沒比硬要讓迷人的梅嬸走唐僧感化路線又為了票房平衡而硬湊

  三代同堂的蜘蛛人3，至少沒那麼刻意


  可是最後看起來，男角色幾乎就男主角一個

  另外先後且最後又湊齊一起的女力有五個


  嗯…


  我知道 魅惑 裡的柯林法洛和

  妮可基嫚、Kirsten Dunst、萌傻妹專武艾兒芬妮…總共也有至少五個女生，他一對多沒錯


  在劇情、安排、互動關係上，都沒這種感覺呀。



  我是覺得很可惜啦，扣掉這部分的劇情處理與角色安排，其餘整體包括小成本拍攝的規劃與

  唯一真正撐演技、在非主流與獨立電影打滾多年的喬許哈奈特，都很不錯的。


  老師不是人

  珍珠港

  停機四十天

  萬惡城市只有頭尾兩個片段


  他光這幾部片就看得出是很能演又跨度高的

  可惜，不知是不得不在製作上配合還是要這樣才能獲得支持開拍讓他演？


  --'
