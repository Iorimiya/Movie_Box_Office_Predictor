url: https://www.ptt.cc/bbs/movie/M.1722700901.A.6B4.html
title: '[微好雷] 圈套'
content: '雷文防雷資訊頁


  之前就還蠻喜歡這導演的風格


  看完覺得還OK啦沒有版上大家罵得那麼慘吧XD


  不過我看之前不知道其中有演員跟導演是家人


  這點可能讓我對某些劇情反感程度較低


  以下慎入有雷


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  個人比較喜歡敘事角度特殊的片


  之前有上版上問過有沒有敘事主角不斷更換的電影


  這部讓我蠻喜歡的是由壞人為視角來拍


  雖然不算獨樹一格但也在各種一般懸疑驚悚片來說算特別


  而且導演一開始也很明確的就告訴大家主角就是兇手


  我還一直很期待會不會有超級反轉其實不是喬許


  他只是假裝平民想從另一個角度揪出兇手


  結果根本沒有XD



  演唱會橋段的確有點過多...


  但我看的當下不知道演員跟音樂是導演女兒


  如果知道的話應該的確會很火大XDDD


  真的還是要去看的話可能要把這點放下


  觀影感受會好一點



  最後稍微有點意外就是以為結局大概就是男主在家中被捕


  結果竟然神奇的逃出 還逃了不只一次


  然後所謂的反轉是要帶出原來老婆才是害他露出馬腳的人


  僅此



  總結 整部片BUG的確偏多 劇情反轉也不夠驚人


  但敘述過程還算流暢 節奏也算緊湊


  配上男主傑出的演技 個人覺得不會到爛片


  看完還算可以接受 分享心得給大家參考囉


  --'
