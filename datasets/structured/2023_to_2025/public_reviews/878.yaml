title: '[無雷] 圈套，演得太好了'
content: '優點：


  主角喬許哈奈特演得太神了，也是本片最大的賣點，很多類似杰哥上一秒燦笑，下一秒摘眼鏡變臉的鏡頭，讓人看了不寒而慄


  配樂用的很好，不安緊張的氣氛充斥著全片，從頭到尾沒有冷場


  缺點：


  雖然是奈沙馬蘭，但是這一部比較不奈沙馬蘭，超自然奇詭與反轉的部分比較少甚或沒有


  外掛偶爾開的有點兇，不過正反兩邊算是都有精彩攻防



  是一部不太需要動腦，緊張刺激的犯罪攻防片


  分數7.7/10






