url: https://www.ptt.cc/bbs/movie/M.1724208104.A.F42.html
title: '[負雷] 圈套，可惜了好題材'
content: '如題。

  整部充滿了滿滿的吐槽點，劇情就不細說了，版上很多，只說吐槽點


  1.可惜了這麼好的題材

  壞人當主角的電影畢竟不多，我很喜歡那種希望主角逃跑成功但又希望被抓到的感覺。

  尤其演唱會上搞破壞來想辦法逃走的構想，這種大型半封閉式空間看主角能玩出什麼把戲，

  很吃導演跟編劇的功力，但我沒有看到什麼驚喜的感覺，只覺得處處不合邏輯。


  2.不合邏輯的滿滿吐槽點

  承1，比如莫名就透漏一切的販賣部粉絲、能混進小吃部把碳酸飲料扔進炸鍋&快速換裝（欸

  欸你把外套就留在那邊好嗎？不是應該扔進垃圾桶嗎）、把人推下樓梯卻沒人注意、逃跑後

  還回家、眾目睽睽下摸走自行車輻條...。

  還有個最想吐槽的就是在後台時一開口就暴露自己身份，而不是先賣弄一下感情牌，說女兒

  白血病剛康復，希望能坐一下您的車blablabla...


  3.這電影本身就是個圈套

  這整部戲就是沙馬蘭為了自己女兒打歌跟造勢的圈套，女兒唱歌不錯，應該是可以到007開

  場的那種等級，但演戲就真的很尬，車上跟男主的戲根本對不起來，特寫女兒生硬演技的大

  臉鏡頭讓我一直出戲。

  拜託，沙馬蘭，一個人即使只是會唱歌也已經夠好了，沒必要安排這種很硬要的戲，白費了

  好題材也浪費了男主。




  但這部片也不是一無是處，我很喜歡最後的片尾，喬許哈奈特把屠夫的顛狂本性演繹的很好

  。



  --'
