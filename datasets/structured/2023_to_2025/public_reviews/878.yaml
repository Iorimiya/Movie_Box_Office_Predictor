url: https://www.ptt.cc/bbs/movie/M.1727626196.A.5D9.html
title: 'Re: [負雷] 圈套 看過最爛的糞片'
content: '我今天剛看完這部片

  其實沒有那麼糟

  如果5分 可能給他3.8左右

  在查評價時發現一些極度偏激的影評這邊還是要說明一下


  <====確實是兇手運用它的智慧逃脫沒有錯


  <===完全不正確,演唱會只有前面三分之一

  女兒演技普通,但前面演唱會過程的確是都在設法逃脫



  <====做這些都是為了試著找逃脫的路線,確認各逃脫的出口難度


  <==確實這段演的不好 被扣分,

  實際上是主角似乎做了一個地道引警察下去,應該有埋伏警察,

  再穿上警察衣服,再回到演唱會女角的車(只是這中間速度轉折太快)

  應該要演再細膩一些


  中間在車上逃脫時也是瞬間就逃走,偽裝成路人

  應該也可以再加強,例如灑錢讓路人檢錢時混亂偽裝人路人逃走


  <======一點都不白癡喔 因為主角發現他老婆告密警察是他被發現的關鍵點

  並不是無故的,剩下都是犯人的內心戲


  整體看下來，這部份並不是

  走爽片路線,以為要打打殺殺 分屍並沒有


  裡面最值得稱讚也就是有一位側寫師這樣的角色加入 ,

  以及演唱會女角處理事情方法


  我反而覺得他走的是寫實路線

  並沒有演的那麼誇大

  氣氛是還不錯就是幾個轉折的地方要調整





  --'
