content: "★【分裂】M奈沙馬蘭 全新驚悚懸疑鉅作\n\n★【奧本海默】喬許哈奈特 精湛演出\n\n★ 這部電影真的太完美、太棒了！- X / THEORYOFWALLOWS\n\
  \n★ 喬許哈奈特演繹出角色的黑暗面與人性，非常迷人 - Joseph Deckelmeier\n\n★ 電影預告：\n\n★【圈套】[輔12] 8月1日 (週四)\
  \ 無處可逃\n\n名為演唱會的圈套，一名父親陪同青少年女兒參加一場流行音樂演唱會，他們後來發現自\n己正處於一場黑暗邪惡的活動中。\n\n隨著音樂高潮迭起，危機也慢慢浮現，請提高警覺，令人聞風喪膽的連環殺手「屠夫」可\n\
  能就在你我的身邊！\n\n【圈套】由M.奈沙馬蘭自編自導，主要演員包含喬許哈奈特、艾莉兒多諾格、瑟莉卡沙馬\n蘭、海莉米爾斯和艾莉森皮爾。製片是是阿什溫拉詹、馬克賓斯托克和M.奈沙馬蘭；監製\n\
  則是史蒂文施奈德。\n\n\n《抽獎方式》\n7月28 日 23:59前，推文留言你想要看【圈套】原因，就有機會獲得電影交換券\n（如：我想看圈套，想看喬許哈奈特精湛的演出）\n\
