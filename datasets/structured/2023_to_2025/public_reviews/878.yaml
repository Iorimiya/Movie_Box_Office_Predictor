title: '[大負雷] 圈套 爆爛'
content: '整片不合理 BUG一大堆




  老婆都懷疑自己老公是連環殺手

  不直接請警方暗中調查

  還舉報連環殺手會去演唱會

  千萬人混亂中查起來會比較好查??




  FBI 路人一堆眼瞎

  男主角在豪車上被眾人團團包圍

  沒半個人看到有人下車??



  男主角最後被捕

  眾目睽睽下還可以偷鐵件開鎖






  主角幸運點好點滿

  想怎樣

  劇情都照著走


  說好的反轉再反轉

