title: '[普無雷] 《圈套》真的有反轉嗎？'
content: '我很好奇

  聽說這片有反轉

  還有再反轉？

  怎麼從一開始就能看出結局了？


  說實話我想給負雷

  劇情毫無新意

  平庸且平淡

  沒有什麼驚人場景

  都是靠演員在撐的

  透過演員的表現其實就能猜出後面很多的發展了

  比起前面幾部

  (敲敲門我漏看了)

  這部完全感受不到奈沙馬蘭的魅力

  時好時壞

  偏偏碰上了壞的那一面

  可惜


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
