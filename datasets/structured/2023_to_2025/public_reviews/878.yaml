url: https://www.ptt.cc/bbs/movie/M.1722523307.A.4EA.html
title: '[普雷] 圈套'
content: "1. 喬許哈奈特的身高, 又坐搖滾區\n   整個後面的觀眾妹妹都不用看了吧\n   為觀眾默哀\n\n2. 第一個感想是臨演費很貴吧\n\n\
  3. 原本以為一直預視到的老奶奶(反派老媽)跟側寫師後面會有更多戲份\n   或者是超展開, 結果也沒有\n\n4. 她女兒的個性感覺人蠻好的\n   一度我有點想為庫柏(喬許哈奈特)加油,\
  \ 希望他能成功逃脫\n   免得將來女兒會很傷心\n   可惜後面還是拍得太壞了無法支持他\n\n5. 這回庫柏就是一個很條列式的反社會人格\n   高智商,\
  \ 慣性說謊, 毫無同情同理心, 翻臉極快, 有魅力等等\n   全演出來了, 而且還不停的逃脫成功, 實在狡猾\n   最後結局還停在又逃成功了奸笑, 算是演技不錯收得可以\n\
  \n6. 原本我以為故事會停在渡鴉夫人跑到喬許家中那邊結束\n   結果沒想到後續還有, 然後竟然後續還有, 結果又逃脫又還有\n   整個劇情比想像中跟預告演的拉很長\n\
  \   有部分的好雷我給在這邊, 如果真的到了他家就收尾\n   那就真的太平淡無奇了, 贏在故事夠長\n   反而營造出一種90年代的警匪片感, 這部分我覺得不錯\n\
  \n7. 結果高潮是坐在側寫師安排的第二個圈套\n   也就是回到他家餵他吃毒\n   但客廳跟房子四周早就安排好重重警力等著他自投羅網\n   不過這段我覺得沒有把「TRAP」的感覺拍出來\n\
  \   造成警方出來用電擊槍時顯得有點可笑\n   可能會讓觀眾沒有意會到這是另一個陷阱\n\n8. 渡鴉夫人在房內自唱的歌蠻好聽\n\n9. 大導演這回客串舅舅\n\
  \n--"
