title: '[普雷] 圈套-全片靠喬許哈奈特的演技稱場面'
content: '看HBO Max 串流的，看完喬許哈奈特在奧


  本海默的演技，剛好系統推薦這部就順便看了，還好


  可以快轉不看唱歌的橋段（有夠拖台錢 = =）




  整部片高潮都在中後段；身為一個連環殺人犯，0秒


  脫衣+換衣也是理所當然是吧（？




  我不懂的地方是當初是老婆故意把演唱會的收據洩漏


  給警方，側寫師知道犯人有強迫症，他是絕對不會犯


  這種錯誤的，警方怎麼認定這個匿名舉報是正確的？




  當天逐一審問3000位男性，警方沒有證據or線索屠夫


  的特徵，外加主角已經可以神情自若的在Swat旁邊裝


  咖啡了，被審問也不會露餡吧，難不成側寫師可以觀


  落陰直接抓到他？？？




  整部下來感覺屠夫跟夜神月一樣，先在電視殺人被L


  抓包奇樂在日本活動，沉不住氣就已經被將軍了。


  全片都是靠喬許的神經病演技凱瑞這部片，不然真的


  是會給負雷捏



  現在MAX首頁推薦有小丑2，突然有種魔力想看到底


  有多難看XD



  --'
