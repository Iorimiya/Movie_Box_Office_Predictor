url: https://www.ptt.cc/bbs/movie/M.1722521987.A.BC9.html
title: '[好雷] 圈套，計中計中計'
content: "雷文防雷資訊頁\n \n看預告片就蠻喜歡的感覺\n果不其然是喜愛的類型\n以下多劇情雷，慎入\n \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \ \n \n \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n \n劇情大綱：爸爸帶著女兒參加偶像的演唱會，各種看似貼心的舉動殊不知是為了逃出包圍網\n\
  的各種嘗試，最終仍法網恢恢，逮捕連續殺人犯。\n \n雖然是為了讓男主有各種嘗試逃脫的可能，但太過刻意的一些漏洞，真心認為可以讓緊張感\n再加強一些。\n \n\
  例：\n一、印象中部分警匪片的側寫師都會大致描繪嫌疑犯的推測人畫像，但這部卻沒有。\n二、全場員工都受叮囑要注意特定特徵的人了（側寫師行前說明會），就是賣衣服的跟屋頂\n\
  狙擊手再放水一點沒問題。\n三、全場每個「觀眾」出去的都要經過盤查，算是開了最大後門給男主了，讓他抓漏搭上歌\n星的保姆車逃離封鎖圈。\n四、最後一點最問號的就是…都放上囚車了不按慣例放幾個陪同監視嗎？另外給男主開了手\n\
  銬腳鐐又如何？下車難不成上演特務片一打全？要暗示可能有續集應該用別的方式吧？\n \n結語：bug不少，但在演唱會的劇情安排的很過癮，男主冷靜的考慮各種可能，也善用各種操\n\
  弄人心的手段。（賣衣服套交情、挑選女兒上舞台、威脅女星上保姆車）\n \n愛看懸疑片的推薦進廳觀影喔。\n \n----\nSent from on my iPhone\
  \ 8\n \n--\n\n\n可以推測是的，側寫師有對太太說建議你不要這樣做，跟孩子去一起接受安置比較好。\n 08/01 22:31\n 08/01 22:33\n\
  \ 08/01 22:35\n其實安排兩人吃蛋糕，男主一邊訴說為什麼會對妻子這麼特別憤怒的原因解釋蠻多的喔\n 08/02 00:16"
