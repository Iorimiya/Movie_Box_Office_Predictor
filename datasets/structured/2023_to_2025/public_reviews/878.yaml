url: https://www.ptt.cc/bbs/movie/M.1722959206.A.E90.html
title: '[負雷] 圈套'
content: '因為手上有快到期的兌換券


  朋友選這部所以就跟著一起進場


  進場之前幾乎沒什麼上網看資訊


  只有在前幾天看片時看到開頭預告片演唱會混進一個連環殺手


  還有海報說甚麼反轉再反轉


  ---------------------------------------


  這部片也沒什麼在藏


  開始沒多久大概就知道男主角應該是屠夫


  反正預告片也沒在藏


  只差沒上字幕說這老爸就是屠夫了


  所以我一直在想預告說的反轉再反轉到底會怎樣


  前中期一直帶到女兒跟同學不好 甚至被霸凌


  會不會女兒是屠夫


  男主角是掩護


  然後那個歌手說她老爸小時候離開她


  但她釋懷了


  會不會歌手是屠夫


  演唱會就是她的最後一票


  恩


  都不是


  屠夫94男主角


  而且動機甚麼的也很簡單


  因為男主角有第二人格


  有強迫症


  然後看不慣那些自以為人生完整的人


  所以幹掉他們


  反正也不是很重要


  整部片充滿極度不合理的地方


  首先


  FBI跟SWAT要設局抓一個連環殺手


  會讓整個演唱會的上到歌手下至賣場工作人員都知道？


  整部片的故事就是建立在你一些內部細節讓口風鬆的員工洩漏出去


  接著


  我以為男主角是消防員


  原來是超能力者


  可以偷偷地摸走通行證跟無線電


  在一堆人的食品部跑進去內場對油鍋動手腳


  更扯的是在大庭廣眾包圍之下神不知鬼不覺偷偷地下車混在人群逃跑


  如果你覺得看不懂我上面這句話在寫甚麼


  我也不知道怎麼解釋


  因為電影就這樣演


  你問這麼神通廣大的男主角怎麼會被抓包然後最後落網？


  可能是編劇怕收不掉所以讓男主角稍微粗心了一點


  包括被妻子跟蹤沒發現 然後藏身地作案地點沒鎖門隨便一個人都能進去


  然後在最後要幹掉妻子之前還和樂融融地吃掉妻子做的摻進鎮靜劑的派


  男主角在最後恍然大悟


  原來圈套不是演唱會


  而是早在家中就被設下了


  設下的人是他老婆


  而我


  思索許久才想通


  原來


  電影本身不是圈套


  圈套是即將到期的兌換票


  而設下圈套的人


  就是說要看這部的我朋友


  我哭了......


  ---------------------------------------------


  看廢片打廢文


  但最後還是要問一個問題


  因為我跟我朋友在工作人員名單下來之後就離場了不知道最後有沒有真結尾或彩蛋


  中後段


  那個歌手的作曲家好友


  在後台通道跟男主角父女打招呼的時候


  很刻意地摸摸腰間


  男主角看到後馬上收聽無線電 得到警方會在入口攔檢所有男人的這件事


  所以這代表那個作曲家也是一夥的嗎？


  還是只是跟整部片一堆無關緊要的片段包括演唱會還有女兒同學一樣毫無意義？


  --'
