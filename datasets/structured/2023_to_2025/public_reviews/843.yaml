url: https://www.ptt.cc/bbs/movie/M.1763912497.A.A55.html
title: '[新聞]「死侍」夫妻檔《到我們為止》官司糾紛為'
content: '「死侍」夫妻檔《到我們為止》官司糾紛為作品蒙上陰影！作者坦言：我快不敢承認原著

  是我寫的了


  《到我們為止》（It Ends with Us）導演-賈斯汀巴多尼（Justin Baldoni）與女主角兼

  製片人的布蕾克萊芙莉（Blake Lively）、萊芙莉的丈夫萊恩雷諾斯（Ryan Reynolds）

  互相提告的誹謗及性騷官司，讓原本在全球熱賣超過 3 億美元的這部小預算愛情片，就

  此蒙上一層陰影，甚至可能還無緣再繼續翻拍原著小說的續集。如今連小說作者-柯琳胡

  佛（Colleen Hoover，下圖）都表示，她現在自己都羞於承認是這部電影的原作者了。


  胡佛近日接受《ELLE》雜誌專訪時坦言：「我現在甚至無法對外推薦這本書，我感覺官司

  已經掩蓋它，我幾乎快不敢承認是我寫的了。當有人問起我是做什麼工作時，我都只回答

  ：『我是作家，但拜託別問我寫過什麼書。』」


  胡佛還透露，由於該書是改編自她母親的真實經歷，而她母親的情緒也因官司風波而受影

  響：「這本書的靈感來自於她的故事，而現在我們一想到這件事，就會有 PTSD。我感到

  很抱歉，因為我覺得她從這部電影的後續餘波中所承受的痛苦，比她當年和我父親承受的

  痛苦還多，光是看到這一切醜陋不堪的紛亂就夠折磨她了。雖然久而久之，時間會沖淡我

  們所有人的痛苦，但這仍然令人難過，因為我曾經為那本書感到非常自豪，現在我依然為

  它感到自豪，只是不再表現地那麼公開了。我不知道啦，也許我需要接受心理治療吧。」




  --'
