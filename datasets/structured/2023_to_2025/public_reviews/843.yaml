url: https://www.ptt.cc/bbs/movie/M.1736436223.A.EEA.html
title: '[新聞] 到我們為止導演指控：萊恩雷諾斯在死侍'
content: '《到我們為止》導演指控：萊恩雷諾斯在《死侍與金鋼狼》替老婆出氣，用「善死侍」嘲

  笑他！




  （圖片來源：漫威影業、Pinterest）


  布蕾克萊芙莉（Blake Lively）與《到我們為止》（It Ends with Us）導演兼男主角的

  賈斯汀巴多尼（Justin Baldoni，上圖右），現在已經延燒到電視上。


  巴多尼前幾天才在訴訟中聲稱，萊芙莉的丈夫萊恩雷諾斯（Ryan Reynolds）為了替在片

  場受委屈的老婆反擊，動用關係要求經紀公司 WME 解約他（雷諾斯夫妻倆和巴多尼皆屬

  WME 旗下藝人），如今巴多尼的律師布萊恩費里曼（Bryan Freedman）又上電視受訪加碼

  指稱，雷諾斯有在自己主演的《死侍與金鋼狼》（Deadpool & Wolverine）穿插嘲笑巴多

  尼的劇情。


  費里曼日前接受知名主播梅根凱莉（Megyn Kelly）採訪時指出，《

  的，因為「死侍」在片中一直攻擊善死

  侍溫柔和藹的性格很偽善，而且善死侍形容萊芙莉客串飾演的「女死侍」身材好到看不出

  剛生完小孩，馬上就被死侍警告不該這樣評價女性，但善死侍隨即澄清，他是女性主義者

  ，絕無惡意。




  （圖片來源：索尼影業）


  那段對話被巴多尼的律師解讀為是存心要影射他的客戶，因為萊芙莉就是控告巴多尼在《

  到我們為止》片場多次言語性騷擾，然後又常自詡是女性主義者。


  該集採訪片段播出後，網友還加碼猜測，

  新聞網址：











  --'
