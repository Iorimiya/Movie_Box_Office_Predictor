title: '[新聞] 布蕾克再告到我們為止導演求償片酬損失！'
content: "布蕾克再告《到我們為止》導演求償片酬損失！導演則求償《紐約時報》2.5 億、怪死侍\n害他被解約\n\n\n\n（圖片來源：Pinterest）\n\
  \n上個月，（Blake Lively）突然再掀新一波《》（It Ends with\n Us）風暴，提告導演兼男主角 （Justin Baldoni，上圖右）性騷擾、找公\n\
  關公司操弄媒體風向、散播不實謠言、惡意毀滅她的形象，而聖誕假期過完、跨年跨完後\n，萊芙莉又向法院提起了更正式的訴訟，要巴多尼、巴多尼聘請的公關、巴爾多尼的製作\n\
  公司 Wayfarer Studios 全部賠償她這幾個月來的事業損失和精神損傷，所謂的事業損失\n包含她因而失去的工作機會、個人護髮品牌 Blake Brown\
  \ 剛上市就受波及的慘澹銷量。\n\n\n\n（圖片來源：Us Weekly）\n\n但巴多尼的陣營也不是只有挨打的份，他們在跨年前幾小時，就已正式向《》（\n\
  The New York Times）求償高達 2.5 億美元，因為他們認為，前陣子大篇幅爆料這起案\n件諸多細節的《》擺明是和萊芙莉站在同一陣線，接收了萊芙莉單方面提供的資\n\
  訊和說法，然後斷章取義扭曲事實。\n\n巴多尼還聲稱，由於他和萊芙莉、萊芙莉的丈夫萊恩雷諾斯（Ryan Reynolds）都是簽給\n同一家經紀公司 WME，雷諾斯於是便利用這層關係向\
  \ WME 施壓，要求 WME 跟巴多尼解約\n，但 WME 目前已經否認了這項指控。\n\n文：Joker\n\n\n新聞網址：\n\n\n\n--"
