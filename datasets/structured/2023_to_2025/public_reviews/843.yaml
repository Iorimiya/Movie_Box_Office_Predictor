title: '[新聞] 泰勒絲衰捲《到我們為止》官司！遭要求出'
content: '泰勒絲衰捲《到我們為止》官司！遭要求出庭　火大發聲明開轟


  記者劉宛欣／綜合報導


  電影《到我們為止》性騷擾風波，起因為女主角布蕾克萊芙莉與導演兼男主角賈斯汀巴爾

  多尼幕後失和，在去年12月控告性騷擾，現在輪到導演反告布蕾克與老公萊恩雷諾斯毀謗

  。泰勒絲無辜捲入這場訴訟風波，被法院傳喚作為證人，不滿地發表了聲明。


  根據外媒報導，導演賈斯汀巴爾多尼不僅否認布蕾克萊芙莉的性騷擾指控，還反控她與丈

  夫萊恩雷諾斯惡意誹謗，更聲稱兩人曾強行要求將泰勒絲牽扯進劇組製作，甚至連劇本內

  容都受到布蕾克萊芙莉的影響。賈斯汀巴爾多尼更指控布蕾克萊芙莉邀請泰勒絲到家中會

  面，意圖以此施壓，並強調：「布蕾克說她是因為泰勒絲的壓力，才被迫修改劇本。」


  面對這些指控，泰勒絲方面火速發聲明澄清，斬釘截鐵否認參與電影製作任何環節，表示

  自己「從未參與《到我們為止》的製作、導演或選角」，唯一的牽連僅是她答應授權歌曲

  〈My Tears Ricochet〉為電影配樂。對於賈斯汀巴爾多尼害她捲入訴訟風波，她怒斥對

  方「利用明星的名氣來吸引媒體注意」，不滿被拖下水。


  同樣參與該片演出的女演員伊莎貝拉費雷爾（Isabela Ferrer）則曾在受訪時表示震驚：

  「聽說泰勒絲也有參與試鏡，我很震驚。」但此說法目前並未獲得泰勒絲證實，至於她是

  否會出庭作證，目前仍未確定。





  --'
