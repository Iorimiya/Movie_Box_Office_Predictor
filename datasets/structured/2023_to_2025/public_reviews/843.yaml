url: https://www.ptt.cc/bbs/movie/M.1725413850.A.A82.html
title: '[好雷] 到我們為止的導演也太帥太強了吧 '
content: '導演跟男主角是同一人


  先說我沒有覺得Blake那種行銷方式錯


  或許現在這樣才是對這部片最好的


  不管理由先拉第一批人進場 後來發覺片子比想像中好看認真 自然會有口碑


  整部電影給人的感覺就很舒服 節奏極好


  波士頓的景 音樂 表演 回憶過去切換的時間點


  完全只能用剛剛好來形容 導演才華威能 跟Blake一點關係都沒


  甚至覺得女主角年輕時那段才是拍最好的 公車接吻那裏夠浪漫


  最後Lilly說要把小孩取名成過世哥哥那裏


  男主角第一時間的反應 那個臉部肌肉的抽動 真的催淚


  這是女性成長電影 但很多地方的感人其實是普世的


  要說缺點就是後半部分回憶的戲份大幅減少 那就沒有前半段這麼神


  我本來還期待他至少至少 最後要拍那個愛心刺青是怎麼來的 但是沒有....


  總之這個導演真的屌 雖然他受了委屈 但未來是屬於他的



  --'
