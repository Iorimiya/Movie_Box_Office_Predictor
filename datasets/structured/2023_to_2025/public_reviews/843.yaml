  是很慶幸自己有看到這一部電影，也感謝k大的討論～～


  推 11/11 20:29

  我是晚餐前看了一次睡前又刷了一次XD 也蠻訝異的

  看這部心情好複雜，某方面來說我很同情萊爾，那麼深愛對方卻得知其心裡

  其實一直住著另一個人，真的很不好受也很心痛，所以一時被情緒支配可以

  想像（在我看來比較確立的暴力事件應該是推下樓跟咬刺青，烤箱那實在有

  點模糊），可這就要讓莉莉餘生都活在這種終日惶惶不安的關係中嗎？似乎

  更是一種對彼此的折磨

  當然那刻我想了很久，面對這種情況究竟該怎麼處理比較好，但好無解，

  只能說如果深愛對方到不願失去，就得避免讓情緒支配自己做出後悔的事；

  最後以那句反問來收尾真的不錯，尤其是女兒的情況下感覺更強烈


  推 11/11 23:55

  在板上只看到一篇心得真的覺得挺訝異的

  p大也說到我對於這部電影感到最困惑的地方！這是一部家暴電影吧，結果對

  於莉莉這方面心境上的描寫好少哦，看到時間軸剩30分鐘左右才要正式進入

  該部分的探討實在有點錯愕，不曉得是不是家暴過於沈重的關係，所以更側

  重於兩段感情上的部分，可這就讓我覺得有些顧此失彼，會讓人不禁懷疑這

  究竟是家暴片還是愛情片？ 或許像p大說的真的拍的太浪漫了

  也感謝p大回覆～以後有機會再多發心得文


  推 11/14 00:37

  我那時候人在南部，回台北就忘了QQ 回憶真的好讚，但感覺少了一個適合的

  收尾


