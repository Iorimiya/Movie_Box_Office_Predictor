title: 'Re: [普雷] 巨齒鯊2：海溝深淵'
content: "我也看完了，是覺得還可以，就看你用什麼角度來看這部片\n   把它當一級片的話肯定不行，但如果拿B級片的角度來看，我覺得還過得去\n\n   感覺上第二集增加了太多無謂的包袱，造成必須要加在劇情裡的東西變多\n\
  \   後來的感覺有點不三不四\n\n   其實原來的巨齒鯊第一集我覺得就是很棒的鯊魚片，在B級片裡可說登峰造極\n   而且整體來說從一開始傑森史塔森在深海遇到事件，沒人相信他導致他自我放逐\n\
  \   到後來講到溫躍層，下方有遠古生物，因為他們潛入讓溫躍層破壞，巨齒鯊游上來\n   都滿合理的，原本是去進行潛艇搶救任務的傑森史塔森，就變成了要殺死巨齒鯊\n\
  \n   然後裡面加入了李冰冰跟當時年紀還小的梅英，這對母女的感覺就很不錯\n   李冰冰在片中就是漂亮，而且為了顧及中國觀眾，也沒有讓傑森史塔森跟她上床\n\
  \   兩人一直維持著淡淡情愫，而傑森史塔森的前妻還叫李冰冰放膽去追愛咧\n   那種關係其實滿和諧又好玩，大家都在拱他們送作堆\n\n   加上一個壞老闆在那邊搞事，後來出現第二隻巨齒鯊，繼續與牠作戰直到幹掉牠\n\
  \   這整個過程都是滿標準的鯊魚片，幹掉一隻還有第二隻的劇情雖然老梗但也不錯\n\n   但是這個二集缺點就不少\n   我覺得很大的問題就是李冰冰沒有演了，然後原來的梅英還在\n\
  \   所以劇情就變成了李冰冰死掉但傑森史塔森還愛著她，吳京變成她弟\n   這些感覺就很硬凹，而且重點是\n   這樣就沒有女主角了，整個巨齒鯊第二集是沒有女主角的，感覺就少了點什麼\n\
  \   沒辦法，因為李冰冰在第一集裡就很突出了\n\n   然後第二集的劇情就加上了很多東西\n   原本到潛水進入海底工作站都還勉強可以，對方在深海挖礦勉強說得通\n\
  \   但是到後來就明顯讓人覺得怪了\n   因為吳京同樣做為重要角色，我感覺他在跟傑森史塔森分擔劇情\n   而且他頗有要當主角的感覺，這樣其實有點失衡，尤其在沒有女主角的狀況下\n\
  \   劇情似乎為了吳京所以一直在把兩人做平衡分配\n   其實吳京直接降成配角會比較好，就幫幫傑森史塔森的忙就好\n   劇情中吳京承擔不少重要工作，整部片的平衡就怪怪的\n\
  \n   然後劇情一直走下去，最後變成上島作戰，島上一堆科摩多龍(又不像科摩多龍)\n   然後海上不但有巨齒鯊還有章魚，再加上邪惡組織\n   陸上也打海上也打，感覺太雜了\n\
  \n   而且傑森史塔森竟然騎著水上摩托車帶幾根炸彈長矛就跟三隻巨齒鯊硬幹\n   跟第一集完全不同，第一集的設定是巨齒鯊大到無法正常對戰\n   我覺得光是這樣，片名叫巨齒鯊第二集就有點怪了，畢竟還有章魚跟科摩多龍\n\
  \   我個人覺得這種鯊魚片或是怪獸片，還是邊逃邊打比較有緊張感，或是追蹤\n   巨齒鯊現在在傑森史塔森的眼前好像只是用根魚叉就能叉死的傢伙，緊張感降低很多\n\
  \n   還有就是梅英小妹，很明顯她的戲份也被過度加重，她腦衝我覺得倒沒什麼\n   長得已經不像小孩時那麼可愛，然後妝好像也讓她變得更老\n   我覺得她有太多不必要的台詞與表情，實際上不用拍她拍這麼多\n\
  \n   總之我是覺得民族主義是會毀一部片的\n   其實吳京設定在配角，甚至故意壓低他出場的時間，只要劇情跟演技好\n   他同樣能成為很出色的角色，而且還能讓觀眾有一種沒看夠的感覺\n\
  \   這樣一來在未來的續作裡甚至可以直接讓吳京當主角\n   (從地心竄出就是這樣，後來的這麼多集的主角也不是凱文貝肯，而是那個拿槍大叔)\n\n   不過如果以B級片的角度來看，這一集沒什麼問題，打來打去夠熱鬧\n\
  \   動作也不少，確實好像幾乎沒有見血，我覺得是故意的\n   搞不好是設定觀眾有小孩所以不能一直讓鯊魚還有怪物把人咬碎\n   反正好像已經確定會有第三集了，希望下一集能更好看吧\n\
  \n\n\n\n\n--"
