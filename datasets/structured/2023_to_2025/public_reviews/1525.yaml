title: '[新聞]今夏最爽深海怪獸大片巨齒鯊2：海溝深淵'
content: '今夏最爽深海怪獸大片《巨齒鯊2：海溝深淵》全台雙週票冠軍


  今年暑假最爽的深海怪獸大片【巨齒鯊2：海溝深淵】，由傑森史塔森聯手吳京，對戰多

  隻凶狠殘暴的巨齒鯊，以及前所未見的全新生物。片中驚險刺激又帶點幽默，加上火力十

  足的戰鬥，收穫不少觀眾好評，全台票房累積破8,600萬新台幣，蟬聯雙週票房冠軍，邁

  向破億。


  【巨齒鯊2：海溝深淵】延續第一集受觀眾喜歡的調性，不過度認真、開心享受樂趣及驚

  嚇，但同時也呈現更多動作場面及深海怪獸。製作團隊認為：「當你要拍巨大鯊魚的電影

  ，就不能裝高尚，所以我們要繼續保持歡樂，讓調性輕鬆愉快。我們給大家更多生物，也

  賦予巨齒鯊更多個性，而且在海溝中發現更多驚奇。」






  新聞網址：




  --'
