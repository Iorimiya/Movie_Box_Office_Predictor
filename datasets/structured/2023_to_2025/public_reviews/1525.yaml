url: https://www.ptt.cc/bbs/movie/M.1693475745.A.5C5.html
title: '[普雷] 巨齒鯊2：海溝深淵'
content: '最近院線其他大片幾乎都看過了，


  就挑了巨齒鯊2來看。


  在看之前就做好準備要看見各種詭異的中文台詞跟牆國大外宣，


  看的當下抱著「我只是來看cgi 怪物和傑森史塔森，其他都嚇不倒我」的心態。



  對從小看各種B級片長大的我來說，


  已經可以自動忽略這類型電影推進劇情的奇怪邏輯，


  以及令人無法理解的角色行為（最主要是女孩的腦衝行徑）



  中間一大段進入海溝的橋段處理的不錯，



  能讓人感受到困在深海、各種怪物虎視眈眈的壓迫感。



  結尾巨齒鯊和兩棲怪物在度假小島開吃，


  傑森史塔森騎水上摩托車狂飆對抗鯊魚蠻緊湊的，


  可惜這集一樣幾乎沒有見血，好像少了些什麼。


  另一個主角吳京除了開頭演講的大外宣以外，


  演技跟ID4續集的英九辣寶貝比起來至少算不錯了，跟配角群製造不少笑料。



  個人覺得有比第一集好一點點，


  第一集光是最後那個惹人厭的路人小胖和難聽的插曲就很難讓人喜歡了。




  如果不介意大外宣，


  可以忽視幾乎沒有劇情的劇情，


  而且對怪物片標準很低的話，


  還是可以看看的，


  至少特效比大多數B級怪物片好很多。







  --'
