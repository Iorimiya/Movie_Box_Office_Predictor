title: '[好雷] 巨齒鯊2：海溝深淵'
content: "人權：\n\n\n中信秀泰優惠單張180\n*可用Apple Pay付款便利又帥氣.\n\n搭配975優惠激省! 中爆大可兩份90元\n\n\n\
  \n雖然觀影前知道有幾項不喜愛的內容, 但為了傑森哥還不去看(應該至少要三次)\n\n基本上沒有傑森哥的場景真的坐不住, 大多就是像板友提到因有非英語夾雜實在很出戲,\n\
  其實他們如果都講英文反而好, 突切笑死.\n\n經查詢首級是2018基本上都忘得差不多了, 也因疫情關係延到現在了吧, 電影動作指導真\n的很重要, 不然打鬥戲真的很乾,\
  \ 像小弟就覺得臥虎藏龍那個不行.\n\n（以下雷內容）\n這次穿越溫躍層沒有第一級難的港覺, 由失事潛艇步行到研究設施那段很令人緊張的, 第\n一男隊領便當是章魚對吧,\
  \ 好像沒看得太清楚這幾天再重看, 逃離成功前兩位女隊很令人\n惋惜, 前者放棄逃生讓吳京, 後者潛水裝內爆難過, 看到潔絲背叛讓人拳頭硬所幸被鯊魚\n咬爛,\
  \ 隨行女隊沒刺傑森哥值得鼓勵, 傑森哥直接游出逃生艙取回設施掌控權, 硬!!!!漢\n ., 好像有一段吳京跑回救生艙用跑酷視角小弟笑死, 反派男很屌拉著一個類似浮球的物\n\
  體就輕鬆返回海面對比正派人, 大章魚真面目沒露面僅在水下, 被直昇機切手手很療癒(\n好似攻擊力有點弱), 大反派女持槍被拖走也有笑死, 有錢沒命花惹, 吳京被炸回直升機\n\
  跟持炸藥打章魚還不錯, 至少不算是個只會製造麻煩的傢伙, 三鯊被三殺(爆頭, 爆口,\n跟章魚沈入海底), 蜥蜴因為沒什麼特色就不提了, 不過被DJ爆頭不錯,\
  \ 那段大概是用某\n爆笑電影橋段吧, 李冰冰沒加入很可惜(直接2021過世不知為何), 然後…小女孩很像艾斯\n特基本上跟首集可愛模樣天差地別, 然後一直不聽傑森哥的話,\
  \ 算了! 愛屋及烏看來傑森\n哥很愛李冰冰啦～電影畫面也由深暗轉為陸地明亮很棒, 傑森哥真的硬漢, 他好像保養的\n不錯感覺近期電影他變化不大.\n\n電影沒片尾,\
  \ 不過既然溫躍層爆裂應該第三集很上映, 也希望有玩命系列重生(還李冰冰\n啊), 吳京看下來好像沒小女孩討厭94, 希望跟阿湯哥第二章排在暑期, 夏天看這個消暑\n\
  ～\n\n--\n印象中除海琪好像有另外三隻.\n傑森哥影迷就當買他的票還有面子囉～\n小弟以為共四隻, 一隻是海琪! 今晚再去看看.\n不論電影, 傑森哥說的也符合現實人類與巨齒鯊不可能相容～\n\
  小弟以為有三隻外加海琪共四, 看起來確實只有三隻.\n但沒演到保護層已修復不是嗎, 第三集大概有片段是反派男載具駛出後不只那幾隻跑出乃\n.\n暑假結束絕對沒有再爽的了."
