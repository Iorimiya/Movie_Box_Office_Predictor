url: https://www.ptt.cc/bbs/movie/M.1690513128.A.CB0.html
title: '[贈票] 【巨齒鯊2：海溝深淵】全台特映會搶先看 '
content: "今年夏天，準備好感受腎上腺素激升的終極快感！【巨齒鯊 2：海溝深淵】比2018 年上\n映的賣座電影【巨齒鯊】更加刺激精彩，不僅動作戲更上一層樓，甚至深入更深的海域，\n\
  有更多龐大的巨齒鯊、更多意想不到的驚險！傑森史塔森潛入未知水域，帶著大膽的研究\n團隊，潛到海底最深處進行探勘。然而，這趟探勘很快就陷入混亂；一場惡意的採礦作業\n\
  威脅到他們的任務，迫使他們捲入一場高風險的生存之戰。為了要對抗龐大的巨齒鯊及無\n情的環境掠奪者，英雄們必須靠智取、智勝，甚至要游得比恐怖掠食者更快，才能贏得這\n\
  場與時間的賽跑。觀眾將可以完全沉浸在今年最刺激的【巨齒鯊 2：海溝深淵】中—在這\n裡只有無法言語的快感才能與海洋的深度相比！\n\n《抽獎方式》\n7月29日\
  \ (週六) 23:59 前，推文留言你想要參加【巨齒鯊2：海溝深淵】的〈場次〉與〈\n原因〉，就有機會搶先看電影！\n（如：高雄場，熱到不行的夏天想好好消暑一下）\n\
  \n《獎項內容》\n【巨齒鯊2：海溝深淵】電影試映券（一組2張）\n\n《特映會場次》\n台北場：8/1 (二) 19:00 台北信義威秀影城(4DX) 10組\
  \ （一組2張）\n桃園場：8/1 (二) 19:00 桃園新光影城(DOLBY) 10組 （一組2張）\n台南場：8/1 (二) 19:00 台南南紡威秀影城(3D)\
  \ 10組 （一組2張）\n高雄場：8/1 (二) 19:00 高雄大遠百威秀影城(3D) 10組 （一組2張）\n\n《中獎通知》\n7月30日 (週日) 12:00前，公布中獎者於回文內，並寄站內信通知得獎者得獎事宜。\n\
  7月31日 (週一) 10:00前，請各位中獎人務必回覆領獎資訊，恕不接受逾期回覆。\n\n《注意事項》\n1.試映券為非賣品，嚴禁兜售等圖利行為。\n2.票券尚未劃位，請於開演前60分鐘自行劃位，座位劃滿即不受理。\n\
  3.請準時入場觀賞，電影開演後10分鐘戲院與主辦單位有權謝絕入場。\n4.因應疫情期間，請民眾中央流行疫情指揮中心發布之防疫規範，持續配合防疫措施，守\n護彼此健康。\n\
  5.如本活動因不可抗拒之特殊原因無法執行時，主辦單位有權決定取消、終止、修改或暫\n停本活動與延遲得獎公告。\n更多電影資訊：華納兄弟台灣粉絲團 \n\n--"
