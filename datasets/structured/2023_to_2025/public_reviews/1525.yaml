title: '[負雷] 巨齒鯊2海溝深淵'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

























  比起第一集，第二集的劇情可吐槽的更多了 ...


  中資橋段就讓大家自己進場感受一下，


  主要談論一下劇情，


  李冰冰的角色有稍微提到已經去世了，原因不明


  主角團的研究站哪來的巨齒鯊可以養??不是第一集就殺光了嗎??


  巨齒鯊衝破研究所也沒任何的警報，這研究所的警戒好弱。



  溫躍層不是比馬里亞納海溝還要更深入的地方嗎?


  主角團還需要更先進的潛水小艇才能下去，


  結果反派早在下面蓋了一大座基地站，用以挖取底下的稀土，


  這基地站是怎麼蓋的??搞得溫躍層好像離海面很近一樣。



  主角團要逃出海溝還得找到潛艇才能逃生，


  反派穿個新科技潛水裝掛個浮球就可以浮上來了??這樣身體不會出狀況??


  第一集的夥伴到了第二集叛變也很妙，只能說反派頭頭錢真的給很多。


  海溝裡的怪物爬上岸也沒任何的不適?



  海溝跑出來的除了一些小怪物外，


  就三隻巨齒鯊(一隻養的兩隻野生的)，大章魚一隻，


  大章魚被野生巨齒鯊吃了，


  野生巨齒鯊1被炸掉頭顱，野生巨齒鯊2被光頭拿直升機殘骸從嘴巴戳爆


  結尾就這樣放了曾經養的巨齒鯊回到大海??不會造成更多浩劫嗎???





  最後我只想表達，


  巨齒鯊的腸胃真好，甚麼都吃，小船、強化玻璃、木棧板...等


  都不會消化不良啊???



  --'
