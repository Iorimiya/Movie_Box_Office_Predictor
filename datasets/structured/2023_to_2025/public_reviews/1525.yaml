url: https://www.ptt.cc/bbs/movie/M.1691317819.A.7DD.html
title: '[好雷]《巨齒鯊2：海溝深淵》同時放大優缺點，結論就是爽度滿點！'
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  1.影片名稱：巨齒鯊2：海溝深淵


  2.觀影時間：2023/08/06


  3.觀影地點：信義威秀


  4.觀影方式：片商交換券


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  部落格圖文版：


  在看《巨齒鯊2：海溝深淵》之前，對於五年前上映的《巨齒鯊》，我只依稀記得在電影

  的最後，傑森史塔森和巨齒鯊在海南島三亞灣大戰一場。而除了傑森史塔森之外，我唯一

  還說得出的角色，就是該片的女主角李冰冰。


  由於我對《巨齒鯊》實在沒有太多印象，因此對於續集也真的無從期待起。然而在傑森史

  塔森飾演的泰勒一行人先是在海底求生存，後還必須對抗更多巨齒鯊的過程中，我體感上

  續作《海溝深淵》的節奏比首集好上不少－原因在於電影去除了刻畫人物的蕪，同時留存

  了爽度與刺激感的菁。


  而這樣的「去蕪存菁」，當然不是意味著電影中應該毫無「角色塑造」，而是《巨齒鯊2

  》選擇集中火力。從下潛，海底逃亡，基地脫困，到重返水面，再到「歡樂島」的最終決

  戰，《海溝深淵》無時無刻都在刻畫泰勒兼具冷靜及勇敢，並且在關鍵時刻挺身奮力一搏

  的英雄特質－最唬爛的絕對是因為有鼻中膈彎曲，所以能夠直接不穿潛水裝備減壓的一幕

  。


  相反地，電影中的其他人物則是幾乎得不到什麼敘事能量，不只扁平更不時讓人感覺十足

  「愚勇」－沒錯！就是一直想要到處「探索」一下的九溟與玫盈兩叔姪。整個探險隊在海

  底不斷地貫徹「偏向虎山行」的鬼片邏輯，然後一面對危機要不就「不行了…」*，要不

  就像九溟一樣點完信號彈後準備從容就義，真的一度讓我以為自己看的是《傑森史塔森與

  他的拖油瓶小夥伴》…


  * 最意外的是氧氣用光和面罩快破的兩個隊員還真的都被花式發便當XD 吳京的支持跟鼓

  勵看起來完全無效（X


  然而當主角們在逃離瑪納一號基地，煞有其事地說出和巨齒鯊們的決戰地點就在不遠處的

  「歡樂島」時，《巨齒鯊2》瞬間從緊張的逃生現場，切換成歌舞昇平的度假景象再配上

  歡快的音樂。這時人物愚蠢的缺點，反而成為了推升出最終高潮的契機。


  不管是講中文拉仇恨值的九溟，自備救命包（aka 百寶袋）的DJ，還是出師未捷先誤闖防

  狼噴霧的麥可，當綠葉們綜藝滑稽的形象得到確立，他們互搶安全簡單的任務，通通跑到

  倉庫和傭兵狹路相逢，還有吳京用加油槍把蜥蜴射個滿臉種種廉價的笑料反而不落得尷尬

  ，更莫名契合地以「廢到笑」的氛圍，承接並維持住那邊廂傑森史塔森大戰三隻巨齒鯊的

  爽度。


  「This place, Meg proof.」


  Btw，兩個反派一個被巨齒鯊一口吞掉，另一個被蜥蜴叼走的領便當方式，也是蠻符合這

  種荒謬到可笑的調性的啦！XD


  而歡樂歸歡樂，最關鍵的，始終還是爽度與刺激。由於《海溝深淵》加入了盜採稀土的人

  類反派，交錯來自巨齒鯊／傭兵的威脅大大減少了感官刺激的疲乏程度。另外巨齒鯊和一

  起跑出深海的八爪章魚，相比首作都用更多的篇幅在襲擊海邊衣著繽紛的遊客，將畫面的

  衝突感拉得更強烈。*


  * 雖然《巨齒鯊2》的CGI很客氣，無論是人還是動物都不會被咬碎（X）


  至於全程唯一智商在線的傑森史塔森，仍然是帥到不行！騎乘水上摩托車不管什麼角度，

  總是能命懸一線的鯊口逃生，再加上靠著自製炸彈魚叉，以及在魚叉用罄後透過直升機翼

  反殺的不同獵鯊手法都帥度滿點！真的就是海底救援那段，從減壓到險險在最後一刻取得

  基地控制權，完全就是唬爛到不行。XD


  《巨齒鯊2：海溝深淵》放大了《巨齒鯊》「爽度」的優點，同時也更凸顯敘事和人物塑

  造的弱項：不只綠葉，就連反派的動機都是被「環保版007」喬納森抓去坐牢過，或是一

  個字－「錢」！這類直接粗暴到不行的理由。


  然而當主角光環通通回到傑森史塔森的身上，不再著眼於巨齒鯊為什麼棲息在深海，不會

  來到海面之類的科學理論，而是單純又暴力地加進滿滿的刺激元素與廉價笑料。《巨齒鯊

  2》純然以爽為訴求，真的讓我看得又爽又開心！


  「…四海遊龍。」


  Btw，由於是中美合拍片，其實《巨齒鯊2》還有在各種系統上加中文，開場九溟的致詞也

  充分體現大國胸懷，然後玫盈跟九溟甚至在一群人中間開中文小視窗XD


  --


  部落格：

  FB粉專：


  --'
