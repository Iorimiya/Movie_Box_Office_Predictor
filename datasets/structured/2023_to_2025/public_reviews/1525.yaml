title: '[情報] 巨齒鯊2海溝深淵 爛番茄開盤'
content: '《巨齒鯊2：海溝深淵》（英語：Meg 2: The Trench，新加坡譯《巨齒鯊2》，中國大陸

  譯《巨齒鯊2：深淵》，香港譯《極悍巨鯊2：深溝》）是一部2023年美中合拍的科幻動作

  片，2018年電影《巨齒鯊》的續集，改編自史蒂夫《深海巨鯊：奪命海溝》一書

  。


  電影由班懷特利執導，傑森史塔森、吳京、蔡書雅、佩吉甘迺迪、賽吉兒佩里斯-曼切塔

  、絲凱樂塞繆爾斯、席安娜蓋蘿莉和克利夫柯蒂斯主演。


  劇情講述喬納斯 泰勒（Jonas Taylor，史塔森飾演）率領一支研究小組潛入未知水域的

  最深處進行探勘，但一場惡意的採礦作業造成他們的阻礙，眾人被迫捲入更加危險的爭鬥

  之中。



  第一次看到0的......傻眼......



  更新：




  《MEG 2：THE TRENCH》首次亮相，在爛番茄上獲得 32 條評論，獲得 16% 的好評。



  上升了～不過還是很低......



  --

  逆向操作嗎？有梗

  我自己看完覺得沒那麼差，當爽片看還可以。

  這部沒有，說她掛了

  這部沒有'
