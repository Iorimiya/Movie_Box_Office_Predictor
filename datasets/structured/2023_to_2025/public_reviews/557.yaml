url: https://www.ptt.cc/bbs/movie/M.1738251793.A.362.html
title: '[負雷] 天使營救──充斥DEI與臉譜化矛盾的爛片'
content: '熱騰騰的負雷文


  上週才和高中好友討論過年回鄉要不要一起看部電影

  偏偏只有初二才一同有空  選片選一選就看到這部「天使營救」 (Dirty Angels)



  想說有以前就覺得眼睛有深邃美的Eva Green主演  還有皇家夜總會的Campbell導演

  妥妥是個保底好萊塢動作爽片的選擇吧

  然後看完以後感想是  這到底是什麼大便




  以下微劇情雷






  這部劇情充斥著DEI的內容

  我認為創作中的DEI要素是好的  但原諒我用充斥這種講法

  DEI象徵的diversity equity inclusion應該是要打破所謂臉譜化的敘事

  好壞黑白一目了然  黑人就是要愛吃炸雞  高大的斯拉夫人一定要當反派


  為了DEI  這部編了個理由組成了以女性為主的特種小隊

  為了DEI  陣中美國白人男性在前面的小槍戰就全部便當了  剩下Reza Brojerdi疑似男主


  那為什麼


  綽號Bomb的白妹就一定要在地雷引爆成功時像瘋子一樣歡呼

  綽號Geek的黑妹就一定要全場臭臉  前面處處刁難女主


  George Iskandar演的反派Amir就一定要在某些時候看起來很聰明

  某些時候又回到正港好萊塢反派的邪惡無腦

  最後決鬥時槍都不用  還一定要拿把阿拉伯彎刀和女主對砍


  壞人和叛徒一定要死的不明不白  讓觀眾哈哈活該




  設定上的過份刻意和DEI自己與臉譜化的矛盾只是一部分

  撇開特種部隊的演出到底專不專業的部分  畢竟我只是一年掃地兵

  劇情的邏輯和安排也是一塌糊塗


  只用一句話說三角洲部隊被滅了  只能請女主和一堆DEI妹

  女主說她的線人情報比前期疑似男主的Christopher Backus更可信  大家就都OKOK聽她的

  最後發現線人背叛還是因為女主的妹子任務中出意外導致被俘虜處刑

  女主洩憤打昏線人以後看到手機才知道的？？？


