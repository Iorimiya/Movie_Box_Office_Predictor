url: https://www.ptt.cc/bbs/movie/M.1738350488.A.1AD.html
title: '[雷] 天使營救 純粹的B級電影'
content: '不要看車庫宣傳詞寫什麼

  “皇家夜總會億萬名導團隊聯手打造”就信了


  黃金眼成本         6000萬美金（1995年！！）

  皇家夜總會成本 1億5000萬美金

  天使營救成本     3500萬歐元（3650萬美金）



  3650萬美金差不多就是B級片成本上緣

  看這成本就該知道製作規格是B級片等級了...


  出來的結果也確實

  從劇情/特效/人物設計/鏡頭設計都不負期待的很B級片...



  合理懷疑Eva Green是跑來拍著玩過過癮

  或是想轉型動作片先試個水溫


  可以看得出來她在劇情裡確實演得很用力

  但是劇情實在太災難

  再加上很明顯拍攝團隊沒有找相關的軍事指導

  太多鏡頭擺拍感嚴重


  導致她的用力演出跟劇情裡下的某些猛料

  不但沒有烘托出主角團隊的悲壯感

  反而讓主角團隊跟整部片都展現出無能跟滑稽


  軍事不軍事 諜報不諜報 驚悚不驚悚

  基本功沒打好 其他地方用力過猛也沒用...


  --'
