url: https://www.ptt.cc/bbs/movie/M.1738345628.A.B30.html
title: '[負雷] 【天使營救】這部片真的出事了'
content: '‧


  如果選擇在初四看這部【天使營救】，那在心情上可能會出了大事，衝著伊娃葛林及瑪

  麗亞巴卡洛娃兩位女演員而進場，沒想到迎來一場災難性錯誤的選擇；除了畫面場景質感

  外，其餘全部都是令人失望且可以大吐嘲的劇情，加上部份爆頭血漿及爆炸火焰的低廉動

  畫，完全是在好萊塢電影台，深夜冷門時刻會上映的電影作品。



  ‧


  在這個以女性為主題的滲透營救小隊，男性的死亡率高達75%，這麼高風險的工作，領便

  當卻是相當青菜；隊中的醫生隨便一槍被爆頭死也就算了，男指揮官退場方式完全令人傻

  眼，外面就在槍林彈雨的火拼了，車子外殼也不斷被子彈在掃射，你大哥下車方式跟一般

  人下車買飲料一樣悠閒，難怪會被打死，要輕鬆領便當也別這麼隨便好嗎？


  然而這個小隊是今年犯太歲嗎？兩次出任務，都無功而返，都還死隊友，再給你們多出幾

  次任務，埋屍體的庭園都快變成集合式公墓了，最倒楣的還是提供土地的配角老人，最後

  還是敵不過犯太歲小隊的咒力，一樣最後隨便領便當回家。


  最莫名的還不只是這樣，女洛基隊員為了阻擋公車前進，連人帶車衝進底盤，還演出了「

  繼兄，我卡住了」情節，雖然這明顯是劇本殺，但這樣阻止方式也太瞎了，隨便把機車擺

  在路中央並揮手阻擋，都還比這個合理。



  ‧


  【天使營救】是部劇情極差、演員表現不佳的一部動作電影，真不曉得是導演及編劇拿來

  練功，還是製片高層裸照在手裡，做為一部應當刺激的滲透戰爭片，卻完完全全沒有緊張

  刺激感；而這幾年有著不錯且相同類型的電影，如「絕地營救」、「贖命救援」等，都是

  非常好抄答案的素材，但搞成這樣，完全是浪費觀眾時間。


  這團犯太歲團隊裡的成員，每個都一副我很屌、我很強，但實際上完全感受不到各自專業

  ，就連基本的持槍，都有濃厚的擺拍感，有點像夜市在射靶的路人；在最後滲透進敵方基

  地時，好歹也演個戰術移動，一群人站一排在前進，當星光大道走秀？


  原本很期望的伊娃葛林，幾乎就那一號表情，但還是很美就是了，我真的很喜歡她在王者

  天下的演出；而在狂人法則有出色演出的瑪麗亞巴卡洛娃，很可惜沒有什麼太多表現空間

  。


  ‧


  【天使營救】不是部能推薦給觀眾的動作電影作品，甚至上串流我也覺得無須花時間觀看

  ，會有更好的選擇去享受剩餘不多的春節假期，不然也許在這個初四日，你的心情也會出

  了個大事。



  ‧




  追蹤茶太郎IG




  --'
