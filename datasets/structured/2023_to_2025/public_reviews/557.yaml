url: https://www.ptt.cc/bbs/movie/M.1738254841.A.2FF.html
title: 'Re: [負雷] 天使營救──充斥DEI與臉譜化矛盾的爛片'
content: '今天下午跟家人去看電影

  網上搜了一下

  分數比較高的只有這部9.x 和木法沙8.x

  因為家人不看卡通 所以選了這部

  結果提議的老爸中間狂打鼾


  看介紹是007團隊做的 結果卻像Expendables

  敢死隊雖然劇情沒邏輯 轉場也很跳痛

  故事說得很流水帳很沒記憶點

  但人家賣的是大咖雲集懷舊感


  這部真的只有故事難看演員更難看

  演技超尬又一堆無意義對話不然就是特寫屎面


  以下劇情雷






  女主真的從頭機掰到尾

  開頭在isis集中營被救出來後

  因為沒救到所有人負責營救任務的駕駛被她投訴

  連長官跟紀錄員都不想鳥她 罵一頓後直接結案

  然後訓練時打實戰又輸不起沒品到家


  從正式出任務開始全程不是屎面就是歪嘴笑


  好像其他人都欠她錢還是她最屌一樣


  鋪陳了一半時長想說開始深入敵境

  精彩的是不是終於要開始了


  結果後半就是看女主各種花式雷隊友

  為了回收隊友屍體害死指揮官

  （雖然理由還說的過去


  找個線民說信任她帶在身邊結果對方是雙面間諜


  一直說不會拋下任何人

  結果一個女隊友被卡在公車下

  叫她被抓一定要講英文然後女主就跑了

  就跑了？？？


  （這邊也是看的很莫名其妙

  路這麼寬也能逆向騎去給車撞？？？


  前面回收隊友是怕被發現是美國人任務會曝光

  然後這裡出發前又要大家把假證件都燒光

  出事就報自己是美國人身分 才能得救


  不是到底敵人會相信假身分還是不會相信

  你自己說法能不能統一一下？？？

  結果後來任務還是曝光了

  因為自己帶在身邊的線民全程在給對方實況


  我真的無言了


  而且那個女兵到死也沒講英文

  所以這橋段到底有什麼意義？？？


  最後的最後要逃離洞窟也是

  直接放黑人女去死


  前面那個任務才剛開始你為了完成任務不想死沒關係

  啊這裡已經都到最後了其他人都已經逃出去了

  救援直升機都降落了

  只剩你和黑人女殿後了你不陪陪人家嗎？？？


  啊你兩次拋下隊友 開頭罵駕駛孬種是罵心酸的嗎



  總之整部就是女版DEI路人演員組成的敢死隊

  想看女版帥氣007或是慕尼黑那種故事緊湊的諜報片的可以省了






  -----

  Sent from JPTT on my iPhone


  --'
