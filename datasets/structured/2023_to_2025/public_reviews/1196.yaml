title: '[微好雷] 完食洋蔥料理-鬼媽媽的假期'
content: "前幾天在friday看完這部韓國電影\n看完真的哭到不行QQ\n腦海直接想到IU的knee的歌詞(超哭)\n雖然很多人認為珍珠真的很爛\n明知道母親的難處\
  \ 卻還是沒給母親好臉色看\n但我個人認為珍珠的內心是真的很糾結\n一方面是自己是可以在韓國找好工作\n卻逃避到美國 導致母親過世也沒能送最後一程\n最喜歡的一幕是\
  \ 福子對著嚮導說\n我的女兒正在受罪\n接下來就是跟在夢裡珍珠度過最後一天\n來化解女兒真正的心結 讓她能向前走\n\n整部電影真的滿滿的洋蔥 從麥當勞那邊開始想哭\n\
  最後尾聲忍不住直接哭爆 直接想到IU的knee\n希望4月看IU演唱會 聽到knee不要再哭了QQ\n\n--\n 之前看過熔爐跟素媛 真的超級震驚也很絕望...\n\
  真的是好片，推薦上串流看\n我也喜歡麥當勞那段!!"
