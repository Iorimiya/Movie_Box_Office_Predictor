  料理，使原本擔心的他勾起彼此共處回憶。\n\n《鬼6怨》\n◎ iTunes 立即看 NT$390 >> \n◎ YouTube 立即看 NT$350 >> \n\
  \n集結《The 8 Show》話題影星李周英等諸多實力韓星，上演六段欲望驅使\n的恐怖經歷！不論是實現心願投入的無止盡舞蹈挑戰、橋下分身獻入學考\n試秘訣、旅館房間禁止踏入真相，還是百萬訂閱網紅直播做出離奇行徑，\n\
  伴隨緊湊情節、駭人畫面強化，催生身歷其境的體驗。\n\n《無聲夜》\n◎ iTunes 立即看 NT$390 (4K) >> \n◎ YouTube 立即看 NT$350\
  \ >> \n\n《太空使命》金甲蟲獎演技派巨星喬爾金納曼投入無聲制裁仇家激烈火拚\n！金馬大導吳宇森秉持《英雄本色》等作硬派動作對決風格，任喬爾本來\n陪伴家人的平安夜，被幫派飛車追逐送走骨肉、損害發聲，決定一連串嚴\n\
  謹訓練，後續踏入向報復對象償命的洩恨旅途。\n\n《絕地追擊》\n◎ iTunes 立即看 NT$390 >> \n◎ YouTube 立即看 NT$350 >>\
  \ \n\n三屆金鐘入圍諧星九孔甩開過往搞笑形象，扮起地下交易龍頭！《拆彈專\n家》角逐香港金像獎名導邱禮濤率劇組進雲南熱帶雨林取景實拍，用模擬\n洪水裝置依山區地形製造土石流，重現中國\
  \ 1990 年代武警查獲邊境觸法\n藥物通路的多重難關。\n\n《12.12：首爾之春》\n◎ iTunes 立即看 NT$390 >> \n◎ YouTube\
