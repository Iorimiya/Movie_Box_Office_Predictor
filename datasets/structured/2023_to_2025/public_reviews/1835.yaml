url: https://www.ptt.cc/bbs/movie/M.1647696734.A.5A1.html
title: '[普雷]　青春養成記--這是種族歧視吧 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


























  我說的種族歧視不是裡面的權威父母

  不是功課好，不是壓抑


  而是女主角的外型


  記得以前日本漫畫有被抗議過

  為什麼黑人都是爆炸頭　黑幫嘻哈風

  所以就有漫畫重製時改掉了



  那黃種人呢?

  長得漂亮的亞洲女生就不會被威權管教?

  長得漂亮的亞洲女生就不會功課好?

  長得漂亮的亞洲女生就不會壓抑?



  其實劇情已經是滿滿的刻板印象了

  但畢竟確實很多華人父母是如此

  那就是種文化呈現


  但這外型真的沒辦法


  一言以蔽之

  用人家心中覺得難看的形象來代表對方

  這就是個歧視



  --'
