title: 'Re: [情報] 皮克斯《青春養成記》將直接上架迪士尼+'
content: '迪士尼這兩年的作風真的讓製作組很心寒吧

  看看天兵阿榮 不說都不知道這部片上映了

  廣告有夠少 雖然上映一陣子才上串流

  但是連上串流都沒在跟你打廣告的

  個人認為天兵阿榮才是2021最棒的動畫唱片

  魔法滿屋根本不知道三小 只有歌好聽

  結果魔法滿屋到處都看得到廣告

  更不用說漫威的電影了 廣告打到翻過去

  如果巴斯光年還被這樣惡搞的話

  如果你是他們的工作室 真的待的下去嗎

  -----

  Sent from JPTT on my iPhone


  --'
