title: '[選片] 飛鴨向前衝 vs 青春養成記'
content: '下禮拜想選一部電影來看


  蜘蛛夫人各方評價都是雷，就先淘汰了


  剩下  飛鴨向前衝 vs 青春養成記


  飛鴨向前衝:看版友說好像很好笑


  青春養成記:皮克斯腦筋急轉彎團隊，劇本似乎很強


  我喜歡爆笑的電影，不過之前腦筋急轉彎讓我讚嘆，非常有創意!


  很難抉擇，是否有人看過這兩片可以推薦一下?


  --'
