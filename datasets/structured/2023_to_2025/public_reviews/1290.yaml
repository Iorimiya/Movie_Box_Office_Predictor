url: https://www.ptt.cc/bbs/movie/M.1702609849.A.764.html
title: '[好雷] 老狐狸'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  你想要怎樣的人生???????????????


  情義跟利益你選哪一個???????????


  1.善良正直努力苟活的失敗者 賺錢但沒能好好的站著


  2.冷酷無情眾叛親離的成功人 站著但傳不到錢


  你想要哪一種人生 陳慕義演得真的很好


  陳慕義就像殺人鉅裡的立鉅一樣 是偉大的人生導師


  因為看到白小弟和他共同的樣子 悉心指導 最後還為他破例了 用不平等創造更多不平等


  這實在太有哲理


  如果把他跟白小弟當雙男主 劉冠廷當男配


  陳慕義有沒有可能挑戰吳糠仁的影帝呢




  劉冠廷是真帥啊 但是也真孬 兩個美女有沒有都拿下來


  90年代初期還真有人情味 有看過這麼善良美麗的漂亮房東嗎 就這照顧 漲房租都應該



  歷史永遠不停的循環 不管何時何地 人類總是被最貪婪的人帶領著 食用著 然後集體毀滅


  之後等待下一群更加貪婪的人 房價物價股市上漲 窮人過得更苦 一樣買不起房子


  有點能力的還要被割韭菜 經濟狀況不好 窮人首當其衝 有錢人反而有更多的機會


  再次瘋狂掠奪



  所以 你選擇當誰呢 陳說你就是我 白說我不是你 最後白活出了自己的樣子


  他用建築專業的不平等 創造了對客戶的不平等 然後守住心中那個小小小小的公義


  站著把錢給掙了 但如果有一天兩全不能其美 魚與熊掌不能兼得


  他應該還是會先選利益吧



  最喜歡的一幕 陳跟劉說 我果然沒有看錯人 那一刻的表情眼神既悲傷又欣慰啊


  白小弟很厲害 不知道是不是他刻意下白眼 那一刻他就給人感覺活得很辛苦 陰陰的


  跟親愛的房客裡一樣 但是顏值高 可愛 就惹人憐惜


  最後我還是要說 三百真的太便宜啊



  很好看的電影 比富都小曉更完整 真的很好奇 到底石門怎麼拿下最佳影片的


  --'
