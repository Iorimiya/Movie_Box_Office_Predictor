title: '[ 好雷] 老狐狸'
content: '起於買房子，終於蓋房子

  房子一直在台灣這50年，圍繞你我，

  房價一直漲。

  人權照片先上


  本票看片重點如下

  1.背景聲音小細節：

  我一直聽到時鐘的聲音跟雨聲。

  2.20秒內，一人死亡，二人頭部被重擊，有點震撼。

  3.聖誕樹有大有小，小的開心，大的不開心

  3.女秘書的大紅色衣服跟口紅代表富貴。

  4.不平等對待

  5.小孩演的很好，那種癡呆，執著樣子

  6.最後廖同學還是變成他爸爸，有同理心。

  後續想到再補。

  7.人前留一線，日後好相見。

  8.全場四個人


  9.家庭代工是海軍船型帽，本人海軍軍官退伍

  0.開放式結局，沒有答案，自己幻想

  1.廖泰來出餐廳門口先拿一個包子給流浪漢

  2.歷史還原很細膩，包括廁所的壁癌、電鍋等

  2.蛋黃酥是秘書暗戀廖泰來的暗示

  3.樓下還在辦喪事,廖弟說：干我屁事，被廖泰來打一巴掌，有震撼到

  4.同學說（廖界）是抓耙子，後來他出賣漂亮姐姐。

  5.漂亮姐姐被打後，去廖家，看廖界的眼神，很細膩

  6.廖泰來就是狐狸媽，廖界就是老狐狸

