url: https://www.ptt.cc/bbs/movie/M.1700999131.A.9A1.html
title: '[負雷] 老狐狸是部好「電影」'
content: '其實也沒有什麼好防雷的

  因為這部電影的劇本內容實在太少了

  想要雷也雷不出個所以然


  只是真的可惜了很多優秀演員和精美的服化道和場景

  劇本如果充實內容可能劉冠廷/劉奕兒會有比較好的發揮空間

  不過劇本只有這點內容

  於是只有老狐狸本人陳慕義得獎

  有幾個鏡頭老狐狸的表情實在觸動人心


  例如預告中這個時間點的特寫


  觀影的過程中可以發現許多觀眾看著看著

  都雙手抱胸 然後扭來扭去

  很容易察覺到大家不耐煩的情緒

  在故事架構上真的是鋪陳太多

  結果主題只有一點點

  「在乎別人感受的人是失敗人，但卻是偉大的 可愛的人」


  在這個主題下老狐狸是怎樣得到

  「在乎別人感受的人是失敗的人」這個結論？

  這關鍵性的議題 很可惜還是要靠觀眾腦補許多情節


  有些感覺有官商勾結的地方也拍得不明不白

  造成很多配角演員的情緒與動機也都需要觀眾腦補

  看完也看不懂華嫂楊小姐到底在發什麼瘋 不過這也不重要


  這部電影的畫面與造型力圖呈現1990年代的生活況味

  確實很有說服力，造型得獎也是實至名歸

  大螢幕看真的是懷舊感滿滿


  照理來說在這麼好的造型與場景裡面

  演員應該很容易進入狀況

  可惜就是劇本給的空間太少

  就算想單純呈現那時的時代風貌，應該穿插幾個小故事也可以

  但基本上劇本只給人物動作和畫面



  本來看預告想說劉冠廷會不會入圍最佳男主

  結果看來是挑戰失敗

  人物的個性是揣摩到了 但這部電影他的表現也比較沒有突破性

  個人覺得關鍵問題是缺少了一個爸爸看小孩的深情眼神

  倒是老狐狸有將這部分表現出來

  結果變成老狐狸和小男孩的對戲都特別有張力

  小男孩和爸爸的互動則讓人覺得沒什麼感覺

  （還是說編劇想特別致敬小王子？ 這樣的話是滿有創意的）



  最後想問問看有沒有蕭邦達人解說一下這個曲子


  Waltz in A minor, B 150, Op. Posth

  好像近年很多台灣影視作品在遇到特殊橋段時很愛用這首

  老狐狸也是，還很罕見的幾乎整首播完


  --

  可是這首曲子實在稱不上名曲

  沒有學過鋼琴彈過蕭邦的人 可能都沒有聽過

  我是在俗女養成記第一次聽到這首曲子，劇情是陳嘉玲鋼琴學不下去了

  其實最後廖界拿老狐狸的咒語來對付老狐狸的橋段

  是滿好的設計，又有種哈利波特的感覺

  這裡劇情走向兩人都頓悟，覺得不該是這樣的，很順理成章

  可能整部電影就是為了這一刻而存在

  為了這一刻而鋪陳了這麼久

  其他人如果能再豐富一點立體一點，這會是很棒的作品。'
