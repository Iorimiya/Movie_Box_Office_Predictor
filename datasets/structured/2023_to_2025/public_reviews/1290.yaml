url: https://www.ptt.cc/bbs/movie/M.1701863443.A.0CA.html
title: '[好雷] 老狐狸'
content: '前幾天因為被這部電影的心得給轟炸

  所以就想說來看一下


  在看完後才知道這部的導演導過范保德

  我還滿喜歡范保德的角色 攝影

  老狐狸在這二個地方我覺得也滿讚的



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  這部片和一般的商業電影比較不同的地方在於

  他需要時間的累積

  例如他不會很直白的跟你說為什麼廖界想要成功/變有錢人

  但是看到廖界被小孩三人組霸凌 房價大漲 洗澡要關熱水器 爸爸要騙人送蛋黃酥

  一再的刺激下 廖界想要變成有錢人的立場就會變的很可以理解

  還好結局導演還是給了廖界一個劫富濟已（？）又保留良善的結局


  影片中很有趣的是 導演用了類似侏羅紀公囻的方法

  在前15分鐘左右 謝老闆一直都只有在各個角色的口中出現

  一直到廖界躲雨的那一幕謝老闆才真的進入到戲裡

  前面略顯沈悶的鋪陳在廖界還有謝老闆在超跑＋家裡聊天那一晚整個都爆發開來

  前面的二人的價值觀 都在那晚整個大衝突

  謝老闆終究對著和自己出世很像的廖界起了同情心

  想要教導著他"成功"的方法 但徒弟卻不怎麼領情的一直說"乾我屁事"

  謝老闆那句"跟我一樣不好嗎？"實在是心酸到令人想哭

  看看他兒子 看看廖界 原來不是大家都覺得有錢就是一切

  或許是前一晚的對話對謝老闆太過刺激

  後面在老兵過世那一幕難得看到老狐狸露出激動的一面

  當他激動的喊出"約束就是約束" 他是不是有著同情心在心中拉扯？

  最後廖泰來說"讓給林家"

  老狐狸那句"我果然沒有看錯你"

  我有種他自己覺得可以賺錢又可以保有同情心的安心感


  廖界雖然一直想要有房子

  但看看因為自己當抓耙仔的結果是害漂亮姐姐得到一頓暴打

  這真的是自己想要的嗎？

  雖然或許不是本意 但他對霸凌他的同學說著"跟你媽媽說倉庫有閉路攝影機"

  這二個方面還是看的出來他無法變成像謝老闆那樣的人

  結局在他融了謝老闆和廖泰來的特質走出了自己的路

  也算是導演給這部電影的溫柔


  但有點可惜的是 廖泰來雖然被謝老闆口中說是"富有同情心的人"

  但一直到謝老闆講出這句後才有演出他有同情心的一面

  而他和青梅竹馬的回憶也是有點可有可無

  雖然華嫂在這部電影中有強化主軸的功用（每次吃飯都點很多 就像他老公會一起來吃一

  樣）

  但在劇中存在的意義還是有點薄弱


  然後最後要說的是

  這部片的美術和角色都有一種美感

  老狐狸的富豪

  管家像機械一樣的動作

  廖泰來在做服務生時面面俱到的招呼

  漂亮姐姐的儀態等等的

  都為這部片增添了不少美感


  ==


  我的台灣電影心得都會放在這粉絲頁喔




  --'
