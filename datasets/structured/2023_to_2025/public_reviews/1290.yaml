title: '[普雷] 老狐狸  像我一樣有什麼不好'
content: '這兩天看完網飛上的老狐狸


  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  看完以後其實覺得滿平淡的

  但是在今年的瘋狂大牛市來看還是別有一番風味




  其中我最在意的是

  電影裡面大家都說老狐狸不好

  他不是好人  他害人妻離子散


  但是說實話.....

  我看完

  完全沒有覺得老狐狸不好阿


  不好的點是因為他為富不仁嗎？

  是因為他開除在倉庫亂搞的員工嗎？

  是因為他擁有多戶房產嗎？

  是因為他氣租客把房子變成凶宅嗎？

  不至於吧


  對廖家也是有情有義

  租客經濟上有困難

  給寬限沒有任何刁難 反過來還多給了不少小費


  發現有人出高價

  也是讓原買主自己決定要不要放棄


  唯一比較值得說嘴的就是

  他發現疑似被出賣

  一氣之下打了祕書

  但是被視如己出的員工出賣

  任誰都會這麼氣吧



  電影裡面

  家暴的不是他

  吸金的詐騙集團也不是他


  主角爸廖泰來說老狐狸不是好人

  因為他害阿傑妻離子散


  問題是

  阿傑本來計劃從老狐狸身上詐騙取財欸

  反而是老狐狸

  利用自己的機智

  旁敲側擊避免陷入投資陷阱

  詐騙犯死全家剛好而已吧


  當純以戲內的線索推敲不藍色窗簾的話

  老狐狸有哪裡不好被所有人嫌棄嗎？


  對阿

  像他一樣有哪裡不好？


  --

  hmmmm. 我自己是不會這樣講

  他只是不是敦厚的好人而已

  你說他不好嗎？不至於吧


  被詐騙集團騙錢所以自殺

  但是對屋主來說好好的不動產租給你

  結果變成凶宅

  是你的話心裡幹不幹

  直接害你資產減少兩百萬

  而且還是民國八十年代的兩百萬


  有人害你帳戶損失幾百萬

  你還會拍拍肩膀跟他說辛苦了嗎？


  講到這個就更偽善了

  主角爸要兒子不要跟老狐狸往來

  但是自己跟詐騙未遂犯好來好去

  他兄弟阿傑人就很好嗎？

  交集少的富人可能為富不仁要提防

  因為他有同同理心

  所以罪犯好兄弟妻離子散好可憐

  我看是理盲濫情+仇富吧


  他那麼有錢幹嘛不給阿傑騙一下


  我猜你是想說喪家

  但我覺得老狐狸是連帶的受害者

  不能完全怪他就是了


  劇情裡他也的確沒有主動去害過人

  那你也只能說廖爸個性被他拿捏死死的

  是你的話

  猶豫要不要為了錢破壞約定

  乾脆把球拋給對方讓他自己決定

  多問一下有機會多賺幾百萬

  是你問不問


  還是ptt大家都這麼富

  幾百萬眼睛都不眨一下

  只有我還斤斤計較QQ

  你這樣順過感覺就合理多惹

  雖然沒有主動去迫害人家

  但是有利益衝突的時候也不會太留情面

  所以沒人想長久跟他混

  此外還有個重點

  老狐狸不是因為租客自殺要回房子

  而是租客本來就沒有要續租

  他只是依照原計劃叫李家搬家而已


  房子可能已經找到新租客 新買家

  如果延後的話

  等於關於這棟房產的後續處置都要被打亂了

  這些協調成本都是老狐狸要負擔的


  今天是廖泰來已知是凶宅的狀況才這麼好處理

  如果是正常找到的買家

  肯定會覺得晦氣


  要嘛殺價 要嘛不買

  如果已經簽約 甚至交付部分款項了

  老狐狸要不要賠償

  這時老狐狸就有得頭大了'
