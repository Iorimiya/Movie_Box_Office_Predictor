url: https://www.ptt.cc/bbs/movie/M.1702096517.A.8BD.html
title: '[好雷] 老狐狸，奸詐卻討喜的角色'
content: '雷文防雷資訊頁












  ----------------------------------------------------


  整部戲劇情算是平淡，


  但看著看著，就被拉入了那個古早的年代，


  以及捲入角色們的故事及情感


  及各自的立場裡，


  特別是老狐狸這個角色，


  撐起了整部電影，


  也是我整部戲裏最喜歡的角色，


  小時候我們總會有著，大人們為什麼都這樣呢


  明明有比金錢更重要的事物，


  長大後一定不想成為這樣的大人，


  但老了漸漸臣服於社會及金錢，


  慢慢的變成了自己最不想變成的樣子，


  不是每個人都有那個命可以一直在人性全面的良善和物質面取得雙贏的結果，


  勢必大部分人都得面臨必須取捨的時刻，


  人，從來不是非黑即白，


  縱使老狐狸是個天秤倒向勢利及金錢的人，


  仍然會在意自己的承諾即約定，


  不是毫無原則，


  整部片裡最喜歡的片段，


  就是老狐狸來到自殺租客的家中，


  這裡的細節讓老狐狸的角色更為鮮明及立體，


  「約定就是約定 !你知道這嗎？やくそく」


  下次次早點講，差了一點時間就差了兩百萬，


  還在靈堂罵三字經，


  看得出來這次在利益跟誠信上，


  老狐狸對利益做出了妥協，縱使萬分不捨，


  但這幕卻讓我覺得老狐狸很可愛，


  老狐狸一生，


  都以利益大於他人遭遇感受為原則，


  以資本主義的價值來看，


  他獲得了巨大的成功（金錢取向），


  但心裡卻仍然迷惘，難道像我這樣不好嗎？


  為什麼你們都用這種眼神看著我，


  老狐狸坐擁著金山銀山，


  但在廖界跟他兒子的視線裡，


  老狐狸只是站在垃圾山上俯視著他們，


  我們的價值觀如此的迥異，


  卻都活在同樣的世界，


  我們如此需要別人的認同，


  卻都不懂的尊重對方的價值觀，


  這部片寫活了資本主義普遍出現的問題，


  就是金錢的力量過於強大，


  讓其他重要的良善價值式微，


  但電影的最後告訴我們，


  我們並不是完全沒有選擇，


  也算是，導演想傳達一種資本主義下，


  仍然需要保有人性溫暖的重要吧


  （雖然現實當然不可能這樣美好QQ)


  看完仍然沉浸在電影的一些場景裡，


  就像裡面的人都是我們熟悉的朋友一樣，


  想繼續關懷著他們。


  ----

  Sent from  on my OPPO CPH1917


  --'
