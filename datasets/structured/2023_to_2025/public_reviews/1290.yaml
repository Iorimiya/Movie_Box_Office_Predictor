url: https://www.ptt.cc/bbs/movie/M.1720410972.A.45B.html
title: 'Re: [新聞] 快訊／陳慕義再開砲《老狐狸》導演蕭雅全'
content: '陳

  拿

  的

  外

  全

  不



  蕭雅全




  中午醒來，爆滿的留言，我很意外，決定跟家人去山上，思考該回應你嗎？既然你點名我

  ，沒有，我沒有不感謝演員，慕義哥，我感謝演員。


  事情有個分寸，電影是全體合作構成，就像金馬你我致詞時，異口同聲所說，是幕前幕後

  ，很多人的貢獻。


  有件事情比較嚴肅，「被壓迫」的抗議，通常用在「無選擇權者」身上，對我來說，放在

  「可自由參加的比賽」並不恰當，這就是我心裡一直覺得疙瘩的事。當我選擇參加比賽卻

  沒贏，我可能會翻白眼說評審沒品味，但無法說自己被壓迫，因為我永遠有不參賽的選擇

  。同時我也會謹慎，避免誤揮舞我在乎的「反壓迫」大旗，因為濫用會使它廉價化。我會

  警覺是否過度簡化？我會問自己：事情真是那樣嗎？


  我在不同場合說過很多次：「享受比賽，但不當真。」把比賽當真會有一種風險，就是把

  肯定自己的權利，交到別人手裡。朋友，這話我也跟你說過：「肯定自己的權力，要握在

  自己手裡。」


  雖然對你發文不爽，我還是喜歡你昨晚與我們一起上台並說你想說的話。「我是言論自由

  者」，這句話我當面對你說過多次。回憶昨晚，我為所有入圍者高興，很多人第一次得獎

  ，也很多人第一次面對失去，包括我們劇組的同事。昨天對他們來說，無論輸贏，都將成

  為未來生命中的曾經，就像去年金馬之於你我一樣。


  為何要參加比賽？我在比賽中明明輸的多過贏的，為何還要參加？因為我在之中經歷了情

  節，獲得故事，那構成我成長的一部份。且我看到我的同伴，包括你，都有去體驗輸贏的

  熱情，於是我們來了，不是嗎？


  最後，我選擇你扮演謝老闆，是因為你的才華，而非其他。我不審判任何人的性向，宗教

  ，政治信仰，這是我對你引用歐威爾話的回應。


