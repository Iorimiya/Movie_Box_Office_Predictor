title: '[好雷] 老狐狸Old Fox'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  去年十一月買了華山年票，今年一月就用掉一半，本以為今年會買第二套，沒料到中間半

  年間，不是想看的片沒在華山上，不然就是場次太少時間合不來。到這個月還有兩張，打

  算趁著金馬獎季趕上院線這陣子，把年票用完。


  原本這週要看《五月雪》，但時間完美的卻是蕭雅全這部《老狐狸》。此前並沒有太發漏

  《老狐狸》的消息，但對《范保德》印象挺好，便決定直接進場。


  好看不失望，劉冠廷正常發揮，白潤音、陳慕義的部分讚讚。故事帶點寓言味，很是我的

  菜。雖然女性角色單薄了點，但在不同男性之中展現出的光譜令人動容，同時捕捉到1990

  年的台灣社會，有種時代切片感。音樂也聽得我入迷。


  推薦給喜歡溫和不刺激的朋友。





  ***


  這裡是我的樂園:





  --'
