url: https://www.ptt.cc/bbs/movie/M.1720315638.A.7DB.html
title: '[新聞] 快訊／陳慕義再開砲《老狐狸》導演蕭雅全'
content: '新聞網址：





  快訊／陳慕義再開砲《老狐狸》導演蕭雅全「3度登台沒感謝演員」




  ▲陳慕義不滿《老狐狸》導演蕭雅全北影3度登台，卻沒感謝到任何一位演員。（圖／陳

  慕義臉書）


  記者薛羽彤／綜合報導


  2024-07-07 09:13:10


  2024台北電影獎頒獎典禮，昨（6）日晚間於台北市中山堂圓滿落幕，電影《老狐狸》拿

  下本屆最大獎項「最佳劇情長片」，先前不滿自己因為「戲分不足」原因沒進入圍名單的

  演員陳慕義，上台時表示，「《老狐狸》這個片子得了一堆獎，除了演員沒得半個獎以外

  ，全部都得了一堆獎，滿奇怪的。」今日他再度於臉書上發文砲轟導演蕭雅全，「蕭雅全

  3度登台領獎抓著麥克風，誰都感謝了，獨獨沒對全劇的演員表示什麼，他應該同時『不

  同意』這部劇情大片是有什麼演員幫忙撐起來的。」




  ▲陳慕義再度開砲《老狐狸》導演蕭雅全。（圖／陳慕義臉書）



  --'
