url: https://www.ptt.cc/bbs/movie/M.1731041689.A.8CD.html
title: '[負雷] 老狐狸'
content: '整片看起來很順暢

  但其實沒甚麼主軸

  過多奇怪的分支

  讓人看不懂到底主軸是甚麼



  片中提出很多似是而非的觀念

  想表現出特別的道理

  實際上完全是狗屁不通

  甚麼叫做不平等才是通往成功的道路

  老狐狸跟小孩子說要去利用不平等才會成功

  問題是不平等的地方就是優勢者利用不平等去壓迫你玩這遊戲

  舉例來講

  片中舉了小孩跟高壯的人打拳一定輸

  所以別跟他打拳

  但現實其實是有優勢者逼者你跟他玩他有優勢的遊戲

  就像老狐狸劇裡當個大地主

  劇裡面的人有哪個有本事不跟他玩買房的遊戲?

  現實社會有三種不平等

  階級不平等

  資產不平等

  智力不平等

  這靠的是完善的社會制度去消除

  而不是你說你智力比其他人高

  就只跟人家比智力

  那我想問如果生在北韓

  要怎麼跟小胖比智力?

  人家讓你只跟他玩他有優勢的遊戲

  又如何靠者自身優勢去玩另外一條路


  另外一個似是而非的觀念

  會在意其他人的人=失敗者

  然後教導小孩不要在意其他人

  先不論他論點對不對

  我強烈懷疑這件事情是可以被教學的

  然後導演又想包裝這件事情

  把老狐狸寫的很悲慘

  沒有人理他

  最後還問小孩說像他不好嗎?

  如果一個完全不在意其他人看法的人

  根本就不會問這句話

  就像got裡面的jaime說的

  為何獅子需要在意綿羊的看法

  這才是實際情況好嗎

  綿羊覺得獅子很可憐

  獅子只會回甘我屁事

  怎麼可能會去在意羊的看法


  片中把老狐狸描述成為了成功放棄了所有東西很可憐的一個人

  而小孩他爸有人情味有朋友但失敗

  實際上真實世界可能比較像寄生上流那樣

  沒錢的人劣根性反而比率比較高

  當吃都吃不飽的時候

  有誰會去關心其他人?


  --

  哈哈哈...'
