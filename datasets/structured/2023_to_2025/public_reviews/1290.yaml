url: https://www.ptt.cc/bbs/movie/M.1717384108.A.4FB.html
title: '[好雷] 老狐狸 理想人生的條件?'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  很喜歡老狐狸這部電影，

  導演的手法有適度留白，但又很寫實呈現了一個時代的縮影，

  尤其廖界想買房的願望，在現在看來也依然如此，


  然後關熱水器那段，不知道有多少人會有類似經歷？

  我小時有也有類似經歷，

  但更狠的是我爸是時間到會直接關熱水器的那種，

  強制省瓦斯(x



  後來長大了，跟不同的朋友聊過這個故事，

  有些人有類似經歷，自然而然就能感同身受，

  有些人雖然沒有經歷過，但還算可以同理，

  有的人則是完全不能理解怎麼會怎這種情，洗澡不就是喜到爽為止嗎？


  這種能否同理的差異，

  除了有在電影中被探討之外，

  我覺得也是造就這部有不同評價的原因，

  但整體來說，站在我的角度，

  我覺得導演把角色的心境都捕捉得很好，

  他最近拍了房仲廣告，細看其實也是一樣的語彙，

  一樣把一些細節拿捏得很精準，


  相信對於大部分人來說，看完多少都會有共鳴，

  會覺得這一定是導演本身就有經歷過的吧？

  不然怎麼會可以拿捏得這麼剛好(?


  回到結局，

  看到了小人物、大老闆的人生經歷，以及長大成人的廖界，

  我腦中想到的第一個想法是，

  所謂的理想人生，到你需要哪些條件呢？

  每一個選擇的當下，要選擇成為甚麼樣的人，我們才可以更靠近自己想要的人生？


  --'
