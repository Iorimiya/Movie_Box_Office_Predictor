title: '[討論] 老狐狸vs誰偷了垃圾桶'
content: '雖然這兩部根本不同類型


  不過看完後覺得連印度片都屌打國片了吧


  老狐狸在台灣得了一堆獎


  上串流時還有點期待


  甚至還有人說是台版繁華


  好不容易看完覺得台灣導演連個只有幾個演員的故事都講不好


  還有一些硬要的橋段跟戲份


  雖然知道劇情大概要講什麼但總覺得演出好陳舊


  誰偷了垃圾桶其實一開始沒抱太大期望


  但一開始的發展就很抓人眼球


  中間的蒙太奇敘述讓人有點混亂但事後想到也合情合理


  跟沒料到之後的反轉


  真的是一部不錯的電影


  台灣娛樂影視是不是真的不行了







  -----

  Sent from JPTT on my iPhone


