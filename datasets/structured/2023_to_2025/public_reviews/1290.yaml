title: '[好雷] 老狐狸 什麼是成長?'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~












  這是繼大佛普拉斯後

  看國片有更深刻感覺的一部片了


  整部片講的就是

  何謂正確的價值觀


  這個世界上，有錢才能講話大聲嗎

  是 也不是


  沒有錢，我們也沒講話

  並不代表我們要失去自我


  謝老大在後段對於廖泰來講的

  說他沒有看錯人


  原本我以為是在酸他在當濫好人







  導演作弊

  直接給了廖界一個好的結果


  當然這過程中，老狐狸到底有沒有幫忙

  我們不得而知


  可至少導演要傳達的就是

  我們每個人，做一件事情之前

  我們都可以自己做選擇，往好的，或是壞的方向


  而廖界看樣子似乎是往好的方向走 (?


  裡面老狐狸跟廖界的互動真的是整部戲的經典

  漂亮姊姊前中段我還以為跟廖泰來有戲


  也還好導演沒有走狗血橋段







  至於謝太太(楊小姐)這一角色

  是一個插曲，其實反倒是可有可無


  老狐狸的演技就不用說了

  世故、圓滑、歷經滄桑的歲月感


  在他的台詞跟演出中

  真的看得出一個演員的成熟表現


  整部片簡單講 也並不是什麼太複雜的劇本

  但是可以講到有深度

  這並不容易


  又有一個演技那麼厲害的童星

  更讓人有感


  很棒的一部國片，不多爆雷

  推薦一下!









  --





  --'
