url: https://www.ptt.cc/bbs/movie/M.1723619541.A.57F.html
title: '[情報] 2025 台灣奧斯卡代表：《老狐狸》'
content: '《老狐狸》獲選代表臺灣角逐2025年美國第97屆奧斯卡金像獎最佳國際影片


  文化部今（14）日發布新聞稿表示，

  ，經甄選委員會議熱烈討論

  後，


  《老狐狸》取材創作靈感源自於導演蕭雅全童年時期的困惑，時代背景為1989年股市狂飆

  創下歷史高點年代，臺灣貧富差距逐漸擴大的起始，從一名10歲小男孩視角出發，描繪與

  長輩生活衝突中的經歷，透過小男孩內心掙扎，叩問人性世故與良善間的價值辯證，重現

  臺灣1980年時代經典氛圍，也反映了導演對當時臺灣社會的回應，影片題材與美學風格掌

  握，完整傳遞作品情懷與訊息。


  《老狐狸》去（2023）年於金馬獎榮獲最佳導演、男配角、造型設計、原創電影音樂4項

  大獎後，今年持續於台北電影獎強勢抱回最佳劇情長片、最佳導演、最佳造型設計、最佳

  攝影、最佳編劇等共5項獎項，成為年度金馬獎及台北電影獎最大贏家國片，且


  此外，


  文化部表示，臺灣文化多元、自由且富創造力，為激盪及製作臺灣電影的重要養分。因應

  國際發展潮流，文化部持續進行「匯聚臺流文化黑潮計畫」，全面性關照藝術、出版、文

  創、影視音、文化科技、文化外交等6大文化藝術面向，強化資源挹注我國電影，開發國

  際市場，壯大臺灣文化內容，促進臺灣電影整體產業鏈均衡發展，提升國片國際能見度及

  競爭力。





  --'
