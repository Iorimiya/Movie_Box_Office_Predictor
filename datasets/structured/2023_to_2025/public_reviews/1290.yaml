url: https://www.ptt.cc/bbs/movie/M.1701419966.A.0F1.html
title: '[雷] 老狐狸'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~










  上周去看的

  最近在電影院的觀影體驗

  都稱不上太好


  但是這部讓我很驚艷

  整部電影營造的很有年代感

  很有在看老電影的感覺


  古樸泛黃的傢俱與裝潢

  附近店家的菜單與親切的招呼

  服裝的搭配與打扮也是

  把復古的氛圍用細節堆疊 塑造得很不錯


  我覺得最加分的是節奏的把握得宜

  另外音效的部分我覺得也很棒

  老時鐘滴滴答答的聲音 嘩啦的雨聲

  看電影的當下讓人很沉浸


  本來以為是因為股票家庭破裂的故事

  沒想到是破裂的是別人家

  而主角是旁觀者 但也受到了不少的影響


  男主是個國小生弟弟 媽媽過世了 家裡只剩下爸爸

  爸爸雖然細心溫柔 但也因為工作繁忙

  不免有無法顧及孩子的時候

  弟弟很懂事聽話

  不過卻少了可以陪他聊天的對象 他也不肯太叨擾大人


  這個時候 某個雨天

  他遇到了一個看起來就很奸詐的老頭

  他從其他人的嘴裡得知 他是房東 叫做老狐狸

  他覺得這個房東能夠賣給他們家房子

  能夠讓他圓媽媽生前的美髮店夢



  故事很簡單 有點難形容他具體好看在哪裡

  說是精彩但也沒有特別精彩

  但是用很舒服沉穩的步調 勾起觀者的好奇心沉浸在內



  老（陳慕義）中（劉冠廷）青（白潤音）

  都演得很不錯

  陳慕義是我本來就很喜歡的演員

  對他在「下一站，幸福」裡的表現印象很深刻

  很開心他獲獎~下一站的演員跟工作人員都很棒

  當初看花絮完全能被他們的認真與溫柔感動

  （後來看他演太善良的角色都還是會有點陰影 阿財叔QQ）

  劉冠廷本來沒啥印象 後來才發現看過幾部他演的電影

  只是都是反派 完全認不出來XD 氣質眼神都依不同人設呈現的很棒

  白潤音弟弟的作品是第一次看 但很靈動 蠻驚艷的 把討喜又執拗的國小生演得很好

  題外話 白小弟長大後是溫昇豪演的 一開始只有導入他的聲音 突然驚覺 他聲音好有特色喔

  == 馬上就知道是誰




  喜歡的某些橋段

  弟弟爆氣說你很討厭*n

  真的就是這個年紀的小孩會做的事情

  在說你很討厭的時候 帶著哽咽委屈的語氣表現得很好

  而爸爸心有愧疚的表情與肢體語言也應對得很好


  爸爸在餐廳內 看了一眼明顯是青梅剛離開的桌子

  正要走的時候 抓了一顆包子

  我本來想說是他肚子餓 結果是拿給蹲在門口的無家者

  從小細節就能看出爸爸的良善助人之舉


  青梅vs華哥 美女姐姐vs老狐狸 麵店老闆vs麵店老闆娘

  三場衝突戲的剪輯


  樓下出事後

  爸爸跑去弟弟的房間陪弟弟 抱著他睡覺

  雖然沒有台詞 但完全從肢體與表情 就能看出兩人害怕不安的心情


  美女姐姐跟青梅的打扮

  超有韻味 很有魅力





  --'
