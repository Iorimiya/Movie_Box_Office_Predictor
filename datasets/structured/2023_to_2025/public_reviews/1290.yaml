title: '[好雷]老狐狸。留白的寓言'
content: '關於。老狐狸

  我很難跟你解釋，它是什麼電影


  感覺像是被現實轟炸了整天

  深夜獨自返家時，有人為你留了一盞燈


  講究的美術設計

  恰到好處的配樂

  平凡生活的台詞

  但除卻以上

  講的是一個再簡單不過的小故事


  一個彷彿現代寓言的童話

  卻也是六、七年級生經歷過的真實


  關於。斷絕同情的方法


  喝冰開水

  閉上眼鏡

  剩下的是我至今仍學不會的第三個步驟


  導演留白處相當高明

  電影散場時，很多觀眾都坐在位子上不發一語


  我在想

  是否 對自己人生歷程自我投射

  是否 為了不同價值觀的信念拉扯

  是否 也在為像與不像的親子關係掙扎著


  我曾聽過一句話

  「留下什麼，我們就變成什麼樣的大人」


  那如果將來人生下戲了

  會不會也變成自己小時候討厭的大人？


  關於。老狐狸

  我很難跟你解釋，它到底哪裡好看


  但如果你剛好有一個下午的時光

  不妨走進戲院親自感受


  導演為你留的那一盞燈

  雖微弱但雋永

  .

  .

  .

  .

  .

  .

  其名為 良善...


  #老狐狸



  --'
