title: 'Re: [負雷] 老狐狸'
content: '可是，我看起來超級卡的耶，

  每一段都很抽離，感覺像是一場場獨立的舞台劇，

  導演好像是廣告出身吧？

  又或者像是一片片獨立廣告，說著很帥氣的台詞，

  硬湊起來。


  嗯啊，薩克斯風是三小、初戀那也是，

  灌輸觀念的部分也挺認同的，根本亂七八糟又突兀。



  其實我最想講的一個點是：衣服、場景乾淨到爆炸！？


  超級出戲的耶，每件衣服都是剛買回來的？


  再來小男孩的部分，先說，絕對是導演的問題，


  整部片我只記得小男孩下三白的死魚臉= =


  還有啦，果體關瓦斯XD


  如果要以小男孩當作主角，就要讓人代入他啊，


  大家都有年幼無知的時候，


  你不會想代入一個白目小孩吧。


  哀，我是看金馬好像得很多獎才找來看看，


  真的沒想到能爛成這樣，


  比一些完整敘事的Youtube 的影片還遠遠不如

  《失戀男的殼》，


  其實看到前面就覺得這是在學《四海情深》，


  但只能說畫虎不成反類犬，


  建議去找這部片來洗洗眼睛，


  兩種不同教養方式的衝突、兩種人生觀的碰撞。


  --'
