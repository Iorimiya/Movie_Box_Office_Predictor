url: https://www.ptt.cc/bbs/movie/M.1700907810.A.AFD.html
title: '[好雷] 老狐狸'
content: '雖然機會不大，

  但私心希望這部片能得今晚金馬的導演獎，

  讓這部好片被更多人看見。

  以下有雷




















  尾段收的很好很好，狂起雞皮疙瘩，

  而且也終於聯想到，這就是寫出《范保德》的導演會寫出來的溫柔啊


  電影在講「人能如何影響另一個人」這個主題，

  切入的角度蠻創新，不會覺得這已經有人講過了

  當然精確一點說，電影講的是父親影響兒子，

  不過如果身邊存在著年齡/經驗差距的關係，

  看了應該也會有共感。


  電影重心在廖泰來跟謝老闆這兩個「父親」，

  如何影響著廖界，

  但翻面來看，謝老闆也苦尋著自己的傳承，

  從自己的兒子、漂亮姐姐、到廖界，

  他一直尋找繼承和認可，來填補自己的缺憾。

  然而他其實也很認同自己的母親，

  而非單純只有字面上說的「失敗的人」，

  也因此才有後面對廖泰來講的那句：

  你果然沒有讓我失望。

  到了一個年紀，

  對事情能不能朝自己想要的發展，

  會不再那麼執著，而能比較平靜看整個過程


  因為口碑很好，對於這部會好看並不意外，

  意外的是看完之後的滿足感。

  以「你想活出怎樣的人生？」的主題來說，

  這部片也做了很好的示範。

  金馬最佳影片跟原創劇本其實都值得入圍，

  然後傅孟柏是「片中角色已故」的代表演員嗎？

  光是自己有看過的，這已經是第三部了




  --'
