url: https://www.ptt.cc/bbs/movie/M.1704421702.A.C3F.html
title: '[好雷]  老狐狸—敬每個平凡而偉大的台灣人'
content: '該講的彩蛋很多人都說了


  我想從另外一個視角出發


  這是一部台灣文化感帶入很重的電影


  記錄的不是小男孩，而是每一個台灣人




  老狐狸看見小男孩想到他的兒子


  他一生的遺憾就是自己兒子討厭他



  他本來也是有同理心的人


  母親的死讓他黑化、讓他捨棄他的同情


  但同時也捨棄了人與人間的單純情感



  老狐狸看似堅強


  內心卻很迷茫


  他想透過讓跟他一樣個性的小男孩


  體驗權力與不平等帶來的爽感


  做出跟他一樣的選擇


  弭平自己內心的迷茫


  讓他不再懷疑自己當初的決定是否正確



  然而他失敗了


  小男孩體驗過跑車從同儕經過的階級感


  體驗過掌握人最黑暗秘密的權力感


  甚至理髮店的夢想近在眼前


  這些都是當時的他最渴望的


  只要他選擇變成老狐狸，就都可以達到



  但他最後選擇了善良、選擇了做回自己



  其實這也是台灣社會的縮影


  大多數台灣人純樸、善良、甚至有些懦弱


  而片中記載當時的台灣社會


  投資公司詐騙、炒房、倒會


  可不比現今社會少


  我相信很多人也曾疑惑


  善良卻過得不如意，是否值得？


  是否應該加入他們的行列？



  然而最終，多數台灣人還是保守了自己的善良


  台灣有全世界前三低的犯罪率


  堅毅負責的工作倫理、敬人的服務態度


  這些都是讓人珍惜的文化


  也讓無數在外的遊人在遊歷世界後


  都發出還是台灣最好的感慨



  然而我相信


  構成台灣社會文化的無數平凡台灣人


  都曾經與自己內心做過一場偉大鬥爭


  我們每個人都曾是小男孩


  或許看似很失敗吧


  但我相信


  真正的自由是安於自己的選擇


  而真正的成功是自由的成為想成為的自己



  長大後的小男孩，或許不如老狐狸有地位


  但卻過的安然


  而老狐狸終其一生，縱使地位很高


  卻一生活在迷惘中


  甚至不惜要用一個小男孩證明自己


  顯示他的不自信


  他本性善良，卻壓抑了自己


  其實 他自己內心很清楚答案


  只是不願意接受罷了



  願台灣人能繼續保有這份台灣人特有的善良


  我以台灣人為榮


  --'
