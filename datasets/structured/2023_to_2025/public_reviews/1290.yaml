  剛看完老狐狸，很喜歡但覺得有一個美中不足的地方，希望結尾的劇情改成這樣：


  在最後劉冠廷去石頭椅子找兒子的時候(這邊他兒子剛被同學媽媽謝過)，劉冠廷用招牌好

