url: https://www.ptt.cc/bbs/movie/M.1701109966.A.B67.html
title: '[好雷] 老狐狸——簡單但精彩的寓言故事 '
content: '先說結論：推薦！配樂導演功力很讚，白潤音、陳慕義大哥的演技非常爐火純青。

  白潤音沒有入圍金馬非常地可惜！









  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  故事雖然簡潔，但在短短一個季節的時間刻度由謝老闆跟廖泰來兩個人去讓小五的

  廖界轉變，進而做出人生以後（我們可能不知道）但讓他成為成功設計師的選擇。

  從一開始會倒數三年1095天，到後來會用手段對付謝老闆跟欺負他的學長，甚至也開始

  無法同情和同理樓下的麵店喪家。



  我非常喜歡結尾，廖界做了跟謝老闆一樣的事情：他們保留了自己的善良同時又賺了錢。

  另外很喜歡的點是不知道來自於廖界的童稚還是有意為之？他沒有跟學長嗆說他媽媽在

  兼職賣淫，也沒有嗆謝老闆間接害死自己的兒子。


  他在達到自己的目的依舊保持著某種程度的善良。他學到了謝老闆不要濫用自己同情心的

  真諦，同時還是兼備爸爸善良的性格（會把刀片包好再丟）。



  私心認為廖界從到老狐狸家交鋒後，認識到斷絕如何同情的方法跑回家嗆爸爸的這一段，

  伴隨著鋼琴聲，值得讓白潤音入圍金馬。


  另外在車上與陳慕義的交鋒戲，鏡頭巧妙的運用了車子鏡子的反射搭配CD帶起的

  記憶回放和廖界叨念「我不是你！」讓人拍案叫絕，陳大哥得獎實至名歸！



  整個故事就繞著簡單的「善惡並非二元，我們隨時有所選擇」的主軸轉，可是蕭導的敘事

  極為俐落暢快，也把演員之間的情緒調配得很好！唯一可惜的大概是有門脇麥這麼難得的

  加入，劇本卻沒有給他太多的發揮空間。（但他光是看廖泰來的眼神戲還是很猛。）



  --'
