url: https://www.ptt.cc/bbs/movie/M.1701116106.A.04B.html
title: '[好雷] 老狐狸之高度'
content: '雷文防雷資訊頁


  剛看完午夜場，超好看！！！！

  各種細膩，滿足～

  這電影大家影評都寫超好，因為有人覺得華嫂片段多餘，就簡單提一下比較少人提到的華

  嫂片段～


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  這部電影一直強調著不公平，除了劇情上，導演也用了視覺上的不公平，爸爸的部分大量

  用在與華嫂的回憶裡，每次出現時初戀情人都坐在比他更高的位置上，桌子上，船樁（？

  ）上，這樣的高度落差讓她成為客廳的音樂，而不是房間床邊的照片。


  這個視覺落差一直不大，只是鋪陳著，直到小男生在回收場找到老狐狸（爆擊）

  他站在垃圾堆疊起的山上，站的很高、很高，如同他與小男孩之間的不平等，小男孩必須

  仰望他。

  而堆疊起他高度的不就是一堆垃圾。


  真的是愛片清單加一的電影，滿意外沒有入圍金馬最佳劇情片，雖然結尾有點溫柔，但是

  這正是社會所需要的吧。


  謝謝老狐狸，真是一部好電影。





  --'
