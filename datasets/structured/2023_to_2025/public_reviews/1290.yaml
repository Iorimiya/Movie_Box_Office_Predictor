url: https://www.ptt.cc/bbs/movie/M.1701189328.A.3E1.html
title: '[無雷] 懷舊感滿滿的老狐狸'
content: '劇情大概在講民國80年左右的事情


  主題圍繞人心部分


  優點：


  場景服裝真的是有夠厲害，年代感超強，好像拉回小時候，非常懷念


  老狐狸人設很有意思，很有角色魅力


  演員除了小朋友外都演得滿好


  缺點：


  雖然知道這部片要講什麼，但是結構鬆散，有一些不知所云的硬要橋段


  為了推動劇情，小朋友做了很多根本不是小朋友會做的事情與反應，超突兀刻意，本片最大敗筆


  如果想體驗民國80年的氛圍，強力推薦，如果是要看一部好看的電影，可以再想想


  評分：6.9/10



  -----

  Sent from JPTT on my Google Pixel 6a.


  --'
