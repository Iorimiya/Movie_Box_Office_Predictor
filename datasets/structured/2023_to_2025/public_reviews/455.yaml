url: https://www.ptt.cc/bbs/movie/M.1688687237.A.C89.html
title: '[  雷] 童年往事'
content: '防雷













































  啊,該怎麼形容侯孝賢的電影呢？

  大概是很難啃又表面剛性裡面陰柔吧

  這次久違看他的另一部作品,只是看了沒很喜歡

  我最喜歡他的地方在於帶有妖嬌的風格

  這個在戀戀風塵最明顯,也因此戀戀風塵是我的最愛

  而這次童年往事的風格則是相當的接地氣

  把青少年的環境都很寫實的拍出來

  各種逞兇鬥狠還有對未來的迷惘隨處可見

  還有跟祖母的互動到最後她的過世的淒涼

  形成了一種後勁十足的悲哀

  雖然這次沒有感受到太多的氣息

  但兩小時的舊台灣之旅還是帶有以往特有的姿色

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  萊斯特在最後敘述中講述了生活中有意義的經驗，他說，儘管他死了，他還是很高興，因

  為這世界上有這麼多的美


  --'
