url: https://www.ptt.cc/bbs/movie/M.1445522480.A.3A9.html
title: '[新聞] 「童年往事」演員田豐辭世 享壽87歲'
content: '「童年往事」演員田豐辭世 享壽87歲


  2015-10-22 20:25:51 聯合報 記者項貽斐／綜合報導


  去年金馬獎終身成就獎得主、「童年往事」資深演員田豐日前於香港去世，享年87歲。由

  於家屬態度低調，並未對外多談，而田豐生前在臉書上的最後一篇發文，則在7月21日。


  田豐本名田毓錕，生於河南鄭州，1949年因加入軍中話劇團，隨軍隊來台，表演版圖橫跨

  港台、時間超過半個世紀，演出作品也達200多部。田豐在1960年赴香港發展，在邵氏電

  影公司演出「楊貴妃」、「獨臂刀」等多部電影，後來又在胡金銓執導電影「山中傳奇」

  、「空山靈雨」出現，是電影裡的最佳配角，形象亦正亦邪、宜古宜今。


  進入1980年代，田豐曾在侯孝賢電影「童年往事」裡飾演男主角體弱多病、由大陸來台工

  作卻無法返鄉的父親。另外他也曾在知名電視劇「星星知我心」中飾演慈祥的收養人、在

  電視劇「孽子」中演王家副官。


  除了演戲之外，田豐也是導演。他曾和李行、張方霞合導「王哥柳哥遊台灣」，他也是李

  翰祥電影「梁山伯與祝英台」的副導，在1970年代執導過王羽、嘉凌主演的電影「大江南

  北」。近年田豐淡出幕前，定居香港，但仍常在臉書「田舍豐園」發表小詩、短文。


  去年田豐來台領取金馬獎終身成就獎，神采奕奕地由孫兒女陪同走上紅毯。登台領獎時，

  田豐中氣十足地對著金馬獎座說：「我等了你半個世紀了」，還當場朗誦一首小詩。如今

  辭世，讓影迷在驚訝之餘，也十分懷念。



  ----------------------------------------

  R.I.P.


  --'
