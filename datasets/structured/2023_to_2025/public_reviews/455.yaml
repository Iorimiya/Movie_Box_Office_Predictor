url: https://www.ptt.cc/bbs/movie/M.1595746841.A.6A1.html
title: '[好雷] 阿瑪珂德：費里尼的童年往事'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  特別喜歡看導演拍小時候的故事，更愛看義大利導演拍自己的童年家鄉。義大利人熱情洋

  溢，說話吵吵鬧鬧，自帶一股強大的感染力。這部電影的背景就是費里尼的故鄉里米尼，

  屬於他的童年往事。


  正如英文片名I remember，電影是由記憶片段構成，沒有明確的起承轉合，既然記憶是建

  構的，當然也有虛假和幻想的成分。而費里尼的拿手好戲，就是在虛實之間來去自如，有

  時候寫實的不得了，卻又在下一秒出現一個魔幻時刻。開頭的學校老師非常好笑，讓我想

  起伍迪艾倫的《安妮霍爾》還有楚浮的《四百擊》，老師總是一板一眼，叛逆的學生不斷

  想辦法跟他們作對。


  最令我驚豔的是對政治的處理，在法西斯政權籠罩下，里米尼也難逃思想審查和偉人崇拜

  。可是費里尼拍得輕描淡寫，連父親被法西斯折磨都處理得舉重若輕，卻真情流露。以前

  看過很多回顧極權統治的電影，很少有人用這樣的角度來呈現。我特別喜歡在法西斯集會

  時，大家高喊義大利萬歲，小胖子卻把他幻想成是自己和夢中情人的婚禮，突然間政治活

  動變得夢幻又詼諧，更不用說國際歌和法西斯軍人的叫板，簡直像個諷刺喜劇。


  在寫實和虛幻之間，有天主教小市民對穆斯林的旖麗奇想；有精神病患叔叔爬上大樹高喊

  我要女人，鬧騰半天乖乖被修女叫下來。最難忘的是電影裡各種魔幻時刻，大霧瀰漫的清

  晨，那頭仿若神靈的白牛；大片白茫茫的雪地上，緩緩展翅的孔雀。覺得費里尼好像真的

  有魔法，能夠召喚出電影的神性。


  《阿瑪珂德》的最後，是母親的葬禮和小鎮女神的婚禮，春天的柳絮又開始飛揚，飄在這

  個濱海小鎮，飄在小鎮的少年身上。之後少年搭著《小牛》那班夜車離家，柳絮隨著時光

  飄揚，終於落在他的每一幀電影畫面裡。


  —


  老派電影之必要：




  --

  沒錯，就是今天早上看的。看起來零散卻很飽滿，充滿感情，真的好喜歡！'
