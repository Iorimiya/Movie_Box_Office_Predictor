  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n《惡夏》無雷觀後感：笑著看悲劇\n\
  （不超過片介跟預告）\n\n領社會補助金的弱勢族群，究竟是好手好腳好吃懶做，還是有不得已的苦衷？《惡夏》踩\n在最絕望的觀點，帶你重新審視眼前的惡人／可憐之人。\n\
  \n全片把觀眾捲入最黑暗的惡之漩渦，同時保有趣味與幽默。最高潮的段落令人屏息，也是\n全場笑最大聲的段落（怎麼做到的！）。\n\n–\n脆：\nIG：Fishpond_like\
  \ \n臉書：魚池 FishPond \n個人網站：\n\n--\n真的很好笑，我後面的人直接大喊：原來他是_____（請到戲院解鎖）"
