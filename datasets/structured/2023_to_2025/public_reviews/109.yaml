title: '[新聞] 有雷！《永遠在一起》中國上映竟AI變性'
content: '有雷！《永遠在一起》中國上映竟AI變性 　把同性情侶變夫妻引爭議


  2025/09/18 16:55 娛樂中心 綜合報導


  由夫妻檔演員戴夫法蘭科與艾莉森布里合演的電影《永遠在一起》 ，是部超自然恐怖片

  ，劇情描述一對夫婦搬到鄉下，卻發現遇到一股神秘力量，導致他們的身體發生可怕變化

  融合在一起，台灣在26日上映，該片也準備在中國上檔，中國片名叫《同甘共苦》，為了

  因應中國的審查，中國片方剪掉了一些過於裸露或恐怖的鏡頭，但最引發爭議的是片中主

  角，看到電視正在播放兩個陌生男性的婚禮影片，隨後畫面轉為2男進行融合儀式的場景

  ，融合成一個人後宣稱更加幸福，但中國片方卻用AI變性，把同性情侶變成一對男女，讓

  看過原片的觀眾儍眼。




  《永遠在一起》在中國上檔出現AI變性爭議。劇照及翻攝海報


  《同甘共苦》原訂在19日在中國上映，在之前的小規模搶先試映後，被觀眾發現了AI變性

  爭議，有網友發動抵制，片方今天突然宣布緊急撤檔，「現因影片發行計畫變化，調整上

  映檔期，具體檔期待確定後另行通知」。



  新聞網址：





  --'
