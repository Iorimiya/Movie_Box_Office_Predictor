url: https://www.ptt.cc/bbs/movie/M.1758541781.A.CD5.html
title: '[新聞] 【永遠在一起】艾莉森布里自願撞到鼻瘀青'
content: '新聞網址：



  勇奪爛番茄100%好評，今年最不可錯過的「驚」世恐怖愛情電影《永遠在一起》（

  Together），即將在本週五（9/26）於台灣驚駭獻映。本片由「好萊塢星光夫妻」戴夫法

  蘭科（Dave Franco）與艾莉森布里（Alison Brie）攜手主演，為了滿足導演麥可山克斯

  （Michael Shanks）編導的各種瘋狂變異場景，兩人受盡「折磨」，像是猛撞玻璃門、摔

  進髒水坑、在碎石地上拖行樣樣來，不過他們不僅沒有抱怨、敬業完成，更為了加強畫面

  真實性，時常婉拒替身演員，自告奮勇親自上陣；即使最終滿身是傷，兩人也依然笑道：

  「我們就是那種自找麻煩的人！」值得一提的是，為了片中的驚駭肉體恐怖場面，兩人不

  僅需要全裸演出，更需要被假體道具相連在一起超過十個小時，就連上廁所都一刻不得分

  離，讓劇組一致認同，若不是真實夫妻檔來演，這部電影絕對無法完成！





  結合愛情危機與肉體恐怖的最新瘋狂懼作《永遠在一起》，由「好萊塢星光夫妻」戴夫法

  蘭科與艾莉森布里攜手主演。為了滿足導演麥可山克斯編導的各式瘋狂變異場面，夫妻兩

  人在片中受盡折磨，像是猛撞玻璃門、摔進髒水坑、在碎石地上拖行樣樣來，麥可對此分

  享：「對他們來說，拍攝這部片的每一天，大概都是一種折磨，但他們從來沒有抱怨。每

  天我們會把他們用鋼絲吊來吊去，或是猛力撞玻璃門，甚至常常是赤裸狀態，但他們完全

  願意配合。」零抱怨又敬業地演出，也讓麥可大讚：「他們是最完美的夥伴！」



  為了加強畫面真實性，戴夫與艾莉森更時常婉拒替身演員，自告奮勇親自上陣，艾莉森布

  里分享：「我有一場撞玻璃的戲，最後把鼻子撞到瘀青。雖然那時有替身在場，但我覺得

  她撞得不夠用力，就說：『我來！』我們想讓一切看起來真實、感覺有衝擊力，這真的非

  常值得。」兩人也因為高強度的拍攝，導致滿身是傷，戴夫法蘭科分享：「幾乎每天都有

  對身體非常吃力的場景。我有一場淋浴戲，全身赤裸、失去意識，裸著身體把濕答答的自

  己撞向瓷磚牆，那真的很痛！而這樣的場景，幾乎天天都有。」但即便全身滿是傷，兩人

  也表示：「這些瘀青就像勳章一樣，我們還會一直要求『再多一點』，我們就是那種自找

  麻煩的人！」





  值得一提的是，為了完成《永遠在一起》的驚駭肉體場面，兩人不僅需要全裸演出，更有

  一場戲必須被假體道具相連在一起超過十小時，就連上廁所都一刻不得分離，艾莉森布里

  分享：「我們那天花了三小時特效化妝，接著在片場被綁在一起整整十小時，手臂連著手

  臂，還要一起上廁所。而且戴夫很可憐，因為我們連在一起，所以我整場都坐在他腿上，

  但好在我們是夫妻，不需要跟其他人禮貌客套，戴夫可以直接反應『親愛的，你快弄死我

  了，我腿要不行了！』」這也讓劇組也一致認同，若不是真實夫妻檔演出，電影絕對無法

  完成！



  這部由「金獎製造機」Neon打造，刺激觀眾感官與情感，轟動國際的恐怖愛情片《永遠在

  一起》，即將在本週五（9/26）於台灣驚駭獻映。本片劇情描述當愛情在時間的拉扯下逐

  漸變質，提姆（戴夫法蘭科飾演）與米莉（艾莉森布里飾演）決定搬離喧囂都市，前往偏

  遠鄉村展開新生活，試圖挽救搖搖欲墜的愛情。某天，突如其來的大雨讓他們受困在森林

  深處，並意外跌入一處神秘洞穴。他們在洞中暫時棲身，準備待雨停後離開。只是隔天醒

  來，一切都變了…。一股無法解釋的詭異力量，悄悄滲入他們的生活之中，也逼迫他們面

  對愛情中最深層的依賴與恐懼。在這段既親密又扭曲的關係裡面，他們逐漸發現：真正的

  恐懼，不是失去彼此，而是再也無法分離…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
