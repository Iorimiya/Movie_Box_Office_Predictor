title: '[好雷] 永遠在一起：stand by me哆啦A夢'
content: '網誌好讀版：


  ==========================================================


  STAND BY ME 哆啦A夢

  導　　演：《麻吉妖怪島》八木龍一、山崎貴

  配　　音：水田山葵、大原惠、嘉數由美、木村昂、關智一、妻夫木聰

  上映日期：12/19現正熱映中



  「哆啦A夢」，或者該說是「小叮噹」，絕對是六、七年級生小時候印象深刻的卡通。

  即使不是忠實粉絲，把單行本漫畫一本本的翻過，

  至少在電視上，每天放學回家後、晚餐前的時光，也必定少不了他的陪伴。

  尤其記得華視同一個時段的哆啦A夢至少播了十幾年，

  後來停掉後，蘋果還因此有些悵然若失。

  倒不是會追著看，只是有種你習慣存在的事情，突然改變了，

  總是會有，原來這世界沒有什麼會是永恆不變的感傷。



  這隻第一眼被大雄認為是「狸貓」的機器貓，

  四次元口袋裡的多少寶物是我們曾經在茶餘飯後討論的話題，

  更多少次在午夜夢迴時，想著，如果這時候有「什麼」就好了。


  於是，任意門、竹蜻蜓、縮小燈、時光布、記憶吐司、如果電話亭…種種都可能成為某種想望，

  甚至貪心一點的，想要整個四次元口袋。(笑)

  記得還因此有人發表了一個心理測驗－－

  以哆啦A夢的經典道具為例，你最想擁有的，也就反映了你內在深處的性格。


  比方：

  喜歡「任意門」的是浪漫、好奇心重；但同時也具備了懶惰、缺乏耐性。

  喜歡「時光機」的是貼心、重感情；但可能也因此容易心軟及猶豫不決。

  喜歡「竹蜻蜓」的是天真樂觀，但要學會更實際的面對現實。

  喜歡「如果電話亭」的是做事具有魄力，但也要注意可能是個控制狂。


  其實每個選擇、期待，不正反應了我們潛意識最不安、最需要補強的部份，

  也許我們都不是大雄，沒像他那麼懦弱（或該說那麼幸運），遇到問題，哭喊著：哆啦Ａ夢就好。

  但，我們也會期待，如果我們能擁有個什麼也好。

  在某些時刻，是不是就能順利一些。


  於是，滿足了小孩們所有莫名其妙想像的各種寶物，及聚集了所有經典玩伴形象的哆啦Ａ夢，

  成為即使已經長成大人的我們，仍然印象深刻的一部卡通。

  即使偶爾看電視重播，似乎還是會為小叮噹無窮的法寶感到驚奇。


  這樣的哆啦A夢，真的會有「結局」嗎？

  蘋果不是資深、也不是忠實粉絲，所以曾經幾年前網路流傳過所謂的哆啦Ａ夢結局時，

  還為此沮喪很久，心想果然這世界都是騙人的，連哆啦Ａ夢也是啊…

  還記得那個結局說：

  其實一切的世界，包含小叮噹、所有的道具，甚至是圍繞在大雄身旁的玩伴們：靜香、技安、小夫都是想像出來的。因為大雄其實是植物人，他臥病在床很久很寂寞，所以用想像力構築了這一切。


  後來，又看到了另一種版本的結局…

  大意是，某天哆啦Ａ夢沒電了，但機器貓的記憶體是在耳朵上，

  耳朵被老鼠咬掉的哆啦Ａ夢如果換了電池，代表和大雄間的記憶也就不見了。

  大雄捨不得和哆啦Ａ夢的一切歸零，所以選擇下定決心、認真讀書，

  決心有一天靠自己的力量找回讓哆啦Ａ夢復原的方式。

  終於，在歷經很久很久的努力後，終於成功「喚醒」哆啦Ａ夢。

  當哆啦Ａ夢重啟恢復的那天，蘋果的眼淚也跟著大雄一起掉下來了。


  甚至，網路上更有第三種機器貓大戰未來的版本，但實在太複雜，所以就請大家自行拜估狗大神。



  但不管是哪種版本，蘋果總是覺得…

  哆啦Ａ夢會這麼無窮盡的畫下去，不會有結局。

  只要四次元口袋裡還有用不盡的想像力，道具就永遠有推陳出新的時候。


  即便理智告訴蘋果，藤子‧Ｆ‧不二雄其實早在幾年前就過世了。

  但後繼總是有人的，不是嗎？


  就在藤子‧Ｆ‧不二雄誕生80周年紀念的這一年，

  日本推出一部3D版的動畫來紀念他，就是最近熱映中的STAND BY ME 哆啦A夢。

  這部動畫的劇情設定和以往改編長篇的電影設定很不一樣。


  反而是改編哆啦A夢單行本的幾個故事：大雄的結婚前夜、再見哆啦A夢、哆啦A夢回來了，重新組合而成。


  所以，對所有認識哆啦A夢的朋友來說，劇情是非常容易熟悉的。

  尤其是電影的日文配音一出現，一定會帶給所有的朋友一陣回到過去的感動。


  只是因為這次是3D繪製的關係，

  雖然很多的細節可以表現。

  但也因為這樣，蘋果大概在電影開演後的20分鐘內，

  在內心不斷吶喊：這不是大雄、這不是技安、這不是小夫、這不是靜香…

  最後，唯一跟之前版本比較接近的，大概就只剩哆啦A夢本人了吧。(哭)

  只能說用3D繪製最沒有違和感的，就是在未來世界的部份了。



  =====以下有雷=====

























  大概是為了讓整部電影的架構具備一定的完整度，

  所以劇情從大雄孫子的孫子：世修帶著哆啦A夢從未來世界來到大雄家。

  看著大雄當時生活的種種不堪，又加上世修對未來現況的慘烈不滿意，

  所以希望在哆啦A夢的照顧下，大雄可以變得不一樣。

  因此哆啦A夢被下了一個只有大雄幸福後，才能回到未來的設定。

  哆啦A夢在不甘願又無法違反程式指令的情況下，

  只好用盡全力施展自己口袋中的各式法寶幫助大雄得到幸福。


  而這個幸福，就是讓大雄可以改變未來娶技安妹的命運，改娶靜香。


  所以前半段的劇情等於是一種各式經驗道具的精彩回顧。

  不停的看到大雄處於一種碰到事情就大哭，哆啦A夢就施展神奇道具的情節。


  唉…果然是世界一直在變，唯一不變的就是大雄的求救啊。

  長大後再回過頭看這樣的橋段，大概是很多成人們心中難免不耐的情節吧(嘆氣)


  但就在這之中，大雄也有點不同了，會試著靠自己小小的努力，改變一些未來。

  甚至在關鍵時刻，去到未來在某次靜香登山遇大雪的時刻，救了她。

  至於小小大雄怎麼救受困在大雪中的靜香，就留待大家進戲院揭曉了。


  至少確認了未來的大雄是如此幸運的得到靜香對求婚的肯定回應。

  雖然靜香是因為放心不下大雄，覺得大雄是沒自己就活不下去才答應的。

  但，小小大雄在此刻終於感受到幸福。


  但也因為這個幸福的感受，呼應了電影一開始世修對小叮噹的設定，

  小叮噹算達成任務，必須回到未來了。

  劇情連接到「再見哆啦A夢」，

  開啟電影中催淚的部份。


  哆啦A夢必須回到未來，他已經對大雄放心不下了，大雄當然也離不開他了。

  在兩人依依難捨的情況下，大雄終於下定決心要好好堅強起來，

  所以再碰到技安的欺負，這次，他可以堅定的起身反擊。

  因為在他想大哭求救的那刻，他想起的是哆啦A夢擔憂的臉孔，

  大雄想證明自己的成長，讓哆啦A夢可以安心的回到未來。


  大雄不一樣了，記掛著大雄的哆啦A夢當然也和一開始不一樣了。


  最後身上掛滿傷痕，但勇氣和堅持卻成功讓技安害怕的大雄，和哆啦A夢渡過最後的一夜。



  我們以為從此，大雄只能好好珍惜記憶中的哆啦A夢。

  當他的失魂落魄，

  當他因為技安的謊言而找出身上所有的零用錢，出發去買銅鑼燒準備迎接哆啦A夢回來的時候，

  我相信所有的大人們一定都紅了眼眶。


  那眼眶中打轉的…

  是對不得不告別的不捨、

  是對我們曾經擁有，現今卻不在的感同身受、

  是對所有人共同感受那一去不復返的童年感懷。


  幸好，幸好…這是電影，幸好，幸好…還有個美麗的結局。


  當大雄哭著說：我真的不開心…真的真的不開心，我們一直…一直都不要在一起時。

  我想，所有的觀影者都笑了。


  此刻，多麼希望，我們也可以是幸運的大雄啊。




  也許，沒有哆啦A夢陪我們長大，沒有人會為我們的小小幸福用盡一切的努力，

  但一路走來，一定也有人曾經和你共同創造很多美好的回憶，

  那些人、那些事、那些自己為自己堅持、努力過的，

  不就是我們生命中最珍貴的嗎！


  願我們都可以像最後的大雄充滿著面對未來的勇氣，

  挺起胸膛面對所有的挑戰、質疑，只要持續堅持，技安也會怕你的（笑）


  獻給所有曾經是小孩的大人，

  即使在哆啦Ａ夢轉身後，我們都會是那個能一個人走的大雄。



  電影官網：


  --'
