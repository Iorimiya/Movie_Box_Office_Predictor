url: https://www.ptt.cc/bbs/movie/M.1757748006.A.8C2.html
title: '[好雷] 永遠在一起'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  演員不需要交往才能飾演銀幕上的情侶，但有些愛情恐怖片太過激烈、極端又親密，大概

  只有現實生活中的夫妻檔戴夫‧法蘭科與愛莉森‧布里心臟大顆到願意且有辦法駕馭。《

  永遠在一起》在2025年日舞影展首映，馬上引起轟動，用肉體恐怖將愛裡的依戀搬上大銀

  幕，既大膽又赤裸。



  當愛情在時間的拉扯下逐漸變質，提姆與米莉決定搬離喧囂都市，前往偏遠鄉村展開新生

  活，試圖挽救搖搖欲墜的愛情。某一天，他們在洞中暫時棲身，待雨停後離開。一股無法

  解釋的詭異力量，悄悄滲入他們的生活之中，也逼迫他們面對愛情中最深層的依賴與恐懼

  。



  雖說電影開宗明義地表明自己是部肉體恐怖片，但嚴格來說，片中的肉體恐怖元素並不如

  今年入圍奧斯卡並抱回最佳化妝與髮型設計的《懼裂》。另一方面，《永遠在一起》反而

  置入不少鬼片元素，像是最常見的突發驚嚇（Jump Scare）、會潛入觀眾夢境的毛骨悚然

  臉孔，以及窗戶與長廊等未知空間的應用等等。即便是對肉體恐怖免疫的觀眾，倘若不敢

  看鬼片，可能要稍微斟酌，或隨時準備好在氛圍不對時閉緊雙眼，以避免恐怖的臉孔烙印

  在潛意識裡。



  雖然大分類上是恐怖片，但本質上仍舊是部愛情電影，深入探討男女主角的愛情長跑關係

  。不是以說教的方式，而是讓觀眾自己從兩人的對話去體會他們的關係出了什麼問題，甚

  至會投射、反思自己的關係。我們常說「穩定交往中」，當一段關係「穩定」，究竟指的

  是兩個人與一開始一樣愛著對方，還是只是習慣彼此的陪伴呢？《永遠在一起》探討的主

  題是「Codependency」，中文並沒有固定的說法，關係成癮、共依存症、互累症都有人說

  。指的是在不健康的依賴情況下覺得不能沒有彼此，以米莉與提姆的情況來說，由於提姆

  是一個30歲還不會開車的美國人，又以玩音樂維生，米莉總覺得對方必須依賴自己，所以

  經常說出貶低提姆的話。



  很多恐怖片都以邪教作為基礎，像前幾年的《仲夏魘》、《咒》與《薩滿》，而《永遠在

  一起》也不例外。雖說沒有成群教徒眼神空洞的集體膜拜場景，但電影透過米莉親切的同

  事傑米述說兩人前幾天誤入的洞穴是倒榻的舊教堂，暗指背後其實有邪教與超自然的力量

  ，而後續發生的事情更將聖經中「因此，人要離開父母，與妻子結合，二人成為一體」的

  比喻具象化。除此之外，還引用柏拉圖在《會飲篇》裡說：每個人原本都有兩顆頭、四隻

  手、四隻腳，因為宙斯不希望人類太過強大，而將人劈成兩半，所以人終其一生，都在尋

  找「另一半的自己」。這或許也是為什麼我們總稱呼自己的重要他人為「另一半」或「靈

  魂伴侶」。



  「分開（split）」一詞在片中提到很多次，當然富有雙關意味。不論是米莉與提姆在談

  論到兩人搬離城市的決定是為了不要與對方分開，還是兩人的軀體開始無法控制地黏在一

  起之後，他們想盡辦法「切開」自己，都是分開的各種面向。關係中的兩人，必定會想花

  時間與對方在一起，但多少算是太多？保有什麼程度的獨立才算正常？當我們承諾對方要

  「永遠在一起」，我們指的絕對不是像電影中一樣字面上的「永遠不分開」。



  米莉與提姆最後互相理解，願意為彼此犧牲，只希望對方能夠好好活著，讓他們得以度過

  「融合」的痛苦。在《永遠在一起》的世界觀裡，米莉與提姆以及傑米與他的愛人都是「

  成功的」愛情，是兩人「成為一體」的最佳解。傑米口中「你不會想要的另一種結果」便

  是洞窟裡那兩位迷路旅人，他們可能就是所謂的「失敗的結合」。現實生活中結婚與愛人

  當然不會遭遇如此可怕的下場，但幸福美滿的關係與失敗的結合又何嘗不是人生百態常見

  的結果呢？



  《永遠在一起》也致敬許多經典的恐怖片，像是米莉與提姆開始無法控制地想要靠近彼此

  時，在走廊上做出《大法師》裡彷彿瑜珈輪式的四肢反轉蜘蛛爬行後彎姿勢，以及各種考

  驗柔軟度的肢體變形與彎折的動作，還有如《驚魂記》中的經典俯視淋浴場景，只是提姆

  並非在此被砍殺，而是受到米莉的牽引而獨自在淋浴間裡撞牆，以及不少驅魔電影都會出

  現的人體漂浮，差別在於米莉並非懸浮於床上，而是全身貼在玻璃門上顫抖，極欲穿透玻

  璃與提姆結合。



  導演以視覺上非常震撼的肉體恐怖呈現出無形的愛，的確是極為有趣的嘗試，雖然對於恐

  怖片愛好者來說，《永遠在一起》或許不夠恐怖，有點搔不到癢處，對膽小的影迷來說，

  可能口味又稍微重一點，但若是以一部反思愛情的電影來看，它還算有料，也值得品味，

  還能讓觀眾在觀影結束檢視自己是否也正在現實世界拍愛情恐怖片。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
