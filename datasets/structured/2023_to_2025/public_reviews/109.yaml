url: https://www.ptt.cc/bbs/movie/M.1757505834.A.492.html
title: '[新聞] 好萊塢夫妻檔演<永遠在一起>自爆離婚準備'
content: '新聞網址：



  由戴夫法蘭科（Dave Franco）與艾莉森布里（Alison Brie）這對「好萊塢星光夫妻」攜

  手主演的年度最佳「驚」世約會電影《永遠在一起》（Together），即將在9月26日於台

  灣驚駭獻映。深獲大眾喜愛的這對夫妻檔，雖然時常收到希望兩人共同演出的邀約，但為

  了不讓觀眾看膩他們，因此對於劇本的選擇相當挑剔。然而，當戴夫接獲本片邀約時，認

  為片中愛情長跑十年的人物設定，與自己跟太太艾莉森的關係不謀而合，讓他不僅願意接

  下邀約，甚至還主動提出要跟太太共同主演。由於全片描繪情侶陷入感情瓶頸的陰暗面，

  極端又激烈的情感演繹，也讓兩人在接演之前，就做好拍完即離婚的「永不在一起」心理

  準備！不論戲裡戲外都是愛情長跑情侶的他們，從片場到收工回家，可說是幾乎每分每秒

  都沒分開，但看似緊繃的相處狀態，卻讓戴夫自豪表示這才是他們的「祕密武器」。





  《永遠在一起》請來「好萊塢星光夫妻」戴夫法蘭科與艾莉森布里共同主演。真實生活中

  ，兩人在2011年相戀、2017年結婚，至今已經愛情長跑14年。深獲大眾喜愛的這對銀色夫

  妻檔，雖然接獲不少邀請兩人共同演出的戲約，但他們卻對劇本相當挑剔，戴夫對此解釋

  ：「我們十分挑剔，因為不想過度以情侶身分曝光，而讓大家看膩我們。」不過當他收到

  本片邀約時，不僅馬上點頭接演，更主動提出要跟太太艾莉森一起演出：「這部作品感覺

  很對！電影中的情侶已經交往超過10年，我們覺得我們的真實關係，很適合這樣的互動呈

  現。」艾莉森也補充：「我們在現實生活中是伴侶這件事，剛好能為這個故事加分，而且

  幸運的是，我們的關係比片中那對情侶健康多了！」



  由於全片描繪情侶陷入感情瓶頸的陰暗面，需要挖掘一段關係裡的未知恐懼，極端又激烈

  的情感演繹，也讓兩人在接演前，就已經做好「拍完即離婚」的心理準備，艾莉森表示：

  「我們探索的是，如果一對情侶陷入瓶頸，甚至到了不知道是否還相愛，或是忘記當初彼

  此相愛理由的階段，那會怎麼樣？接著，故事會轉變成對未知與害怕一段關係結束的恐懼

  ，而我們正是要挖掘這樣的恐懼。因為片中這段關係實在太激烈，所以我們也有心理準備

  ，拍完要嘛走向離婚，要嘛變得比以前更加依賴彼此，幸運的是，我們是後者！」她也坦

  言：「這真的是我們最親密、最強烈的合作！」





  不論在《永遠在一起》戲裡或戲外，都是愛情長跑情侶的戴夫法蘭科與艾莉森布里，在拍

  攝期間，從片場到收工回家，兩人可說是幾乎每分每秒緊跟彼此、沒有分開過！看似緊繃

  的相處狀態，卻是他們自認的「祕密武器」，戴夫自豪透露：「我們的秘密武器就是我們

  住在一起。每天收工一起回家、放鬆、回顧一整天的工作、可以隨時排練，所以我們對劇

  本非常熟悉，每天都能全力以赴。到片場時，我們都能直接進入狀態！」值得一提的是，

  兩人也在片中加入不少屬於彼此的「親密對話」，藉此增加角色的情感真實度，艾莉森分

  享：「我們和導演一起討論劇本時，加入很多我們彼此之間的小情話或親暱用語，那種情

  侶間特有的默契溝通方式。」



  這部由「金獎製造機」NEON打造，刺激觀眾感官與情感，轟動國際的恐怖愛情片《永遠在

  一起》，即將於9月26日於台灣驚駭獻映。本片劇情描述當愛情在時間的拉扯下逐漸變質

  ，提姆（戴夫法蘭科飾演）與米莉（艾莉森布里飾演）決定搬離喧囂都市，前往偏遠鄉村

  展開新生活，試圖挽救搖搖欲墜的愛情。某天，突如其來的大雨讓他們受困在森林深處，

  並意外跌入一處神秘洞穴。他們在洞中暫時棲身，準備待雨停後離開。只是隔天醒來，一

  切都變了…。一股無法解釋的詭異力量，悄悄滲入他們的生活之中，也逼迫他們面對愛情

  中最深層的依賴與恐懼。在這段既親密又扭曲的關係裡面，他們逐漸發現：真正的恐懼，

  不是失去彼此，而是再也無法分離…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
