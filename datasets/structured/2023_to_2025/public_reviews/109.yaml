content: '把導演名字遮起來

  說這是ARI ASTER或亞歷山大嘉蘭的作品 我信

  但其實是某超小牌澳洲導演的處女作


  壓迫感莫名重 不是血腥那種

  不確定接下來會看到什麼的不安

  很多衝擊的畫面 (所以我才說像前兩個導演)

  JUMP SCARED用的不多 但一旦使用 時機也靠杯準


  但是但是


  完全沒有放空文戲

  整個過程也是一種依賴關係的再確認

  終極伴侶的昇華


  真的演到你會覺得他們不能沒對方


  這才是把整部片帶往另一個層次的點

  年度恐怖佳作


  --'
