title: '[新聞] 【永遠在一起】導演看齊破億台片【咒】'
content: '新聞網址：



  勇奪爛番茄100%好評、繼《懼裂》（The Substance）後再掀「肉體恐怖」浪潮的瘋狂懼

  作《永遠在一起》（Together），即將在9月26日於台灣驚駭獻映。首度執導劇情長片的

  「澳洲鬼才導演」麥可山克斯（Michael Shanks），期望以最極端的方式，刻劃兩性依存

  這道主題，而他認為源於人體內且無處可逃的「肉體恐怖」就完全符合本片核心，更自爆

  ：「可以滿足有點變態的自己！」因此他在片中設計出各式扭曲又瘋狂的肉體場面，甚至

  有一幕因為太過噁心，就連男主角戴夫法蘭科（Dave Franco）都忍不住現場乾嘔。身為

  恐怖片狂熱者的麥可，也在製作本片時受到《異形》（Alien）、《變蠅人》（The Fly）

  、《X聖治》（CURE）等經典恐怖片啟發，更在受訪時提及，想要向2022年上映的台灣恐

  怖片《咒》看齊！全片瘋狂的變異情節，以及毫不保留的刺激視覺張力，也讓本片獲得國

  際媒體一致盛讚。





  《永遠在一起》是麥可山克斯的首部自編自導長片，他期望以最極端的方式，描繪兩性依

  存這道主題。熱愛恐怖片的他，認為「肉體恐怖」完全符合本片核心，並表示：「在其他

  類型的恐怖片中，通常你還是有機會逃跑的，但以肉體恐怖類型來說，恐怖的源頭其實就

  在你體內，是無法逃避的。」他更自爆：「而且我還可以拍出各種瘋狂場面，滿足我心中

  熱愛恐怖片、甚至有點變態的自己！」因此他在片中設計出各式扭曲又瘋狂的肉體恐怖場

  面，從頭到腳都不放過，其中一幕甚至因為太過噁心，就連男主角戴夫法蘭科都忍不住現

  場乾嘔，麥可回憶：「有一幕關於頭髮的戲，我一想到這段就覺得『太噁！太扭曲！』我

  一定要放到電影裡面，甚至還要說服製片留下這個鏡頭，我真不敢相信他們最後願意讓我

  這樣做！之後戴夫在拍的時候，還有還有乾嘔。」





  《永遠在一起》導演麥可山克斯，本身就是恐怖片狂熱粉絲，因此在製作時受到大量經典

  恐怖片的啟發，他分享：「說到肉體恐怖，不能不提到《異形》和《變蠅人》！我也超愛

  黑澤清的《X聖治》，那部片一直深深糾纏著我，它有一種很奇異、飄忽的剪輯節奏，我

  在某些場景裡就是想要模仿那種感覺。」值得一提的是，他更提及台灣破億國片《咒》，

  並表示：「某些突發驚嚇和恐怖畫面，我其實很受亞洲恐怖片影響，有一部 2022年的台

  灣電影《咒》，裡面有一張超級嚇人的女人臉。我們這部片也有一幕可怕的女人臉，就是

  想要達到《咒》的境界！」



  電影中瘋狂的變異情節，以及毫不保留的刺激視覺張力，都讓本片獲得國際媒體一致盛讚

  。《帝國雜誌》：「這則扭曲的愛情寓言，滿足恐怖片愛好者的所有期待！」《綜藝》：

  「血肉模糊又令人尖叫！」《衛報》：「既流暢又讓人不適！」《好萊塢報導》：「拍案

  叫絕的收尾！」



  這部由「金獎製造機」Neon打造，刺激觀眾感官與情感，轟動國際的恐怖愛情片《永遠在

  一起》，即將於9月26日於台灣驚駭獻映。本片劇情描述當愛情在時間的拉扯下逐漸變質

  ，提姆（戴夫法蘭科飾演）與米莉（艾莉森布里飾演）決定搬離喧囂都市，前往偏遠鄉村

  展開新生活，試圖挽救搖搖欲墜的愛情。某天，突如其來的大雨讓他們受困在森林深處，

  並意外跌入一處神秘洞穴。他們在洞中暫時棲身，準備待雨停後離開。只是隔天醒來，一

  切都變了…。一股無法解釋的詭異力量，悄悄滲入他們的生活之中，也逼迫他們面對愛情

  中最深層的依賴與恐懼。在這段既親密又扭曲的關係裡面，他們逐漸發現：真正的恐懼，

  不是失去彼此，而是再也無法分離…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



