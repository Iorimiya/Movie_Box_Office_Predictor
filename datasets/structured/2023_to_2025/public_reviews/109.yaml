url: https://www.ptt.cc/bbs/movie/M.1759808067.A.D43.html
title: '[好雷] 《永遠在一起》焦慮型依附的終極解答'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  「鼠王」是大自然中一個神祕的現象：多隻老鼠的尾巴因各種原因纏繞在一起無法解開，

  使他們成為了一個被稱為鼠王的個體，他們會共同成長、覓食、生活、死亡。若其中有老

  鼠想要逃跑、拉扯、廝鬥，那麼只會使得尾巴的纏繞變得更緊、徒增鼠王的痛苦並導致死

  亡。鼠王的出現在古代被視為一種不幸的象徵、是瘟疫的預兆。

  .

  《永遠在一起》(Together)的故事，便從一對搬到偏鄉林中小屋的情侶、在他們新家的天

  花板上發現了鼠王的屍體正式展開，同時也揭示了本片的主題並且預言了這個故事最終的

  可能性：共生才能活命、掙扎與逃避只會加速毀滅的到來(以下有點劇透)。

  .

  在正式開始聊這部電影之前，我想先說，今年真的是恐怖片的大年，許多恐怖片都交出了

  超乎預期的水準，而如果你是肉體恐怖片的影迷，你這一兩年可能過得非常幸福，去年有

  《懼裂》大放異彩，甚至一舉入圍奧斯卡，而今年又有《永遠在一起》可以看。肉體恐怖

  片不再是個躲在陰暗角落的異色生物、連在恐怖片中都被視為旁門左道的存在，它走到了

  鎂光燈下，讓那些曾經被視為逐臭之夫的影迷可以驕傲地大聲說：「我愛肉體恐怖片！」

  .

  但這樣說可能有點浮誇了，《懼裂》的精采有目共睹，那《永遠在一起》是否一樣優秀？

  老實說或許沒有，不過這樣比較也不太公平，會放在一起談純粹只是因為它們都是這一兩

  年很好看、未來也將會在主流影視中很具代表性的肉體恐怖片罷了，兩者在談的主題以及

  電影要達到的效果都不一樣，我想我們明年應該不會在奧斯卡名單上看到《永遠在一起》

  的名字出現(或許幾個技術獎提名吧，機會不大就是了)，但這並不妨礙它成為一部值得一

  看的肉體恐怖電影。

  .

  先講個許多人聽到「肉體恐怖片」時可能最關心的重點：《永遠在一起》會很噁心嗎？這

  樣說好了，如果你就愛重口味，非得看到畫面上一片血肉模糊才會滿意，那這片的尺度可

  能會讓你失望。但相對來講，如果你不敢看到太血腥獵奇的畫面，你或許可以挑戰看看。

  我們舉近年來一些比較知名的例子，它當然比一般主流的靈異恐怖片(像這幾年《厲陰宅

  》宇宙那幾部)再血腥一點，但跟這幾年一些比較重口味的商業大作，例如《星之彩》、

  《鬼玩人：復活》還有剛剛提到的《懼裂》比較的話，我們幾乎可以用「清淡」來形容《

  永遠在一起》，如果你吃得下以上說的任何一部電影，你絕對可以放心觀看這片。

  .

  我先前曾在《無痛先生》的文章中提到「棍棒喜劇」(Slapstick)這個名詞：強調動作場

  面的作用力與反作用力，以大量直接而強烈的暴力鏡頭，配合角色誇張滑稽的表情與動作

  來逗笑觀眾。某種程度上來說，我其實覺得《永遠在一起》有點像是一部「棍棒恐怖片」

  ，這片故事設定有點像是一部帶點克蘇魯風格的鄉野奇談：男女主角在接觸到了一個神祕

  不可知的物質後，兩人之間會像強力吸鐵一般被對方深深吸引(字面上的意思)，直到兩人

  真正的合而為一，而整部電影最大的獵奇畫面與視覺看點，反而不是兩人肉體水乳交融(

  字面上的意思)的模樣，而是「正在被吸引」的那個當下：他們的身體不受控制、但想要

  抵抗時，那個不斷扭曲的肢體跟在接近彼此的過程中撞翻一堆東西的畫面確實頗具驚嚇效

  果─劇組找來戴夫法蘭柯跟艾蜜莉布里這對真實的夫妻檔演出也讓電影中兩人的互動極具

  化學反應與說服力。

  .

  至於兩人肉體相黏的畫面其實倒沒想像中令人不適，我覺得多少可以感受到導演想要在肉

  體恐怖這個範疇內盡量最大化這片的觀眾群，所以其實在整個故事的過程中，並沒有太過

  強調這樣的畫面，甚至用有些黑色幽默的效果來處理：其中一段應該要是全片最血腥的片

  段被直接略過沒有拍出來，但是他們在討論要不要這麼做、以及做完後的情緒呈現都引人

  發噱，而中間一段兩人恩愛過後無法自拔(字面上的意思)的情節，這是全片真正最痛的畫

  面，但那個當下的情節太荒謬了，當時的戲院可以聽到觀眾席同時傳來倒抽一口氣的聲音

  跟大笑聲，很魔幻。

  .

  真正嚇到我的一段劇情，其實不是肉體恐怖的呈現，而是一段比較接近傳統恐怖片嚇人橋

  段的鏡頭設計，這個我先不爆雷是哪一幕，主要是跟主角的童年陰影有關：主角小時候爸

  爸在家過世，瀰漫屋內的屍臭味、以及媽媽與屍共枕多日的畫面成了他記憶中揮之不去、

  不斷糾纏他的一道陰影。而一組與這段回憶有關的鏡頭，成了全片真正最恐怖、壓迫感最

  強的畫面。

  .

  其實我們從旁觀者的視角來看，主角的媽媽這樣的故事有種病態美的浪漫情節在其中，是

  呼應了片名的、另外一種意義上的「永遠在一起」，但親眼目睹這樣扭曲畫面的主角當然

  不可能這樣想，反而成了他從此害怕踏入一段關係的心魔，這也因此形成了他跟女朋友之

  間女強男弱的的關係。這片的主題本質上可以說是透過主角兩人密不可分(字面上的意思)

  的關係，探討兩性交往之間的依附性焦慮，不過它倒不像《懼裂》那般那麼深刻地呈現容

  貌/年紀焦慮以及男性凝視，《永遠在一起》在議題上並沒有挖太深，比較算是點到為止

  。

  .

  它確實是錯過了可以在議題上做更多文章的機會，但這也讓《永遠在一起》成了一部更純

  粹而無負擔的「恐怖電影」，敘事主題明確而且文戲與嚇人的戲兩者相得益彰，有點難想

  像這只是導演麥可山克斯的第一部劇情長片，他的鏡頭語言跟節奏掌控已經透露出了一些

  在恐怖片領域中的大師風範，很希望他不會是那種出道即巔峰一片導演，也期待他在這個

  領域繼續耕耘，我們真的需要更多優秀的肉體恐怖片來為恐怖片的市場注入活血。

  .

  話說回來，演出鄰居/同事的戴蒙賀里曼算是近年來出鏡率挺高的一個人，常常突然看到

  他出現在某部電影當中，但我到現在看到他都還是習慣叫他查爾斯曼森。


  --'
