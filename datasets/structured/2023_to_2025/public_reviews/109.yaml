url: https://www.ptt.cc/bbs/movie/M.1759071379.A.D52.html
title: '[好無雷] 永遠在一起'
content: '看完這部我在想，

  那句you complete me （你完整了我）具現化的型態就是這樣吧？









  雷











  電影裏那宗教成就了基督教對於「婚姻」的定義：神聖、永久、無條件委身互相服事的屬靈


  無法真心認定對方的伴侶，就無法順利結合，甚至會變成怪物


  且沒限制一男一女，但想想，一旦伴侶能以這種方式結合，也許原本的性別限制也不重要了


  說真的，這個宗教才應該是人類信仰的正教啊！


  附加效益是不需要沙諾斯


  靠著愛情，還能達到人口減半的效果

  （那個小鎮的人應該不少是合而為一的個體）


  這部片並不是說真的很恐怖


  對我來說，他其實蠻浪漫的，用另一種方式解釋了you complete me 天長地久的關係


  劇情也不是很難猜，但我覺得它裡面有些值得玩味的地方


  有興趣可以看看

  -----

  Sent from JPTT on my iPhone


  --'
