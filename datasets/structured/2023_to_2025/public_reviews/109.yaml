url: https://www.ptt.cc/bbs/movie/M.1759286695.A.3A2.html
title: '[討論] 《永遠在一起》魔咒解法'
content: '昨天去看《永遠在一起》中間就一直在思索，到底有什麼解法可以阻止悲劇發生，越到後

  面越覺得好像最後只能是爛結局….而且最後女主的父母來了本來超難過，想說拜託不要

  再讓老人家為這件事善後了吧...結果沒想到結局超出乎意料的好

  但是晚上睡覺時碰到另一半的手都心裡毛毛的都把自己用棉被全身包住睡覺…

  突然想到這詛咒的解套方法，依電影中的設定是皮膚貼在一起才會融合，那把自己全身都

  包住不讓皮膚裸露在外就算他們磁力相吸，隔著一件衣服還是融不到一起吧。有效的拖延

  時間再去找其他辦法解開魔咒就可以了


  我是覺得沒有第二集的必要，另一半一直覺得會出第二集….不知道真的有的話會不會試

  試這種方法


  --'
