url: https://www.ptt.cc/bbs/movie/M.1756469454.A.12F.html
title: '[新聞] 【永遠在一起】讓影城突變情侶接吻聖地！'
content: '新聞網址：



  「澳洲鬼才導演」麥可山克斯（Michael Shanks）以自身愛情經歷為靈感，推出自編自導

  的「驚」世恐怖愛情片《永遠在一起》（Together），即將在9月26日於台灣驚駭獻映。

  導演透過極端方式探索兩性依存議題，以沉浸敘事手法讓觀眾體驗到愛情的脆弱與恐懼，

  也讓本片自國外上映以來，持續引發觀眾高度共鳴，美國發行商「NEON」更順勢與情侶諮

  商平台「OurRitual」合作，推出「看電影免費送情侶諮商療程」活動，讓因為觀賞本片

  而受到「創傷」的情侶享有服務優惠。另一方面，為迎接七夕情人節，台灣發行商也祭出

  奇招，昨晚（8/28）舉辦「親嘴免費看」的七夕超狂限定活動。只見活動一開始，整座影

  城頓時陷入粉紅風暴，多組情侶們你儂我儂，毫不害羞地在影廳外親嘴狂撒閃光，頓時閃

  到讓旁人什麼都看不見了。然而本片不只看了讓人臉紅心跳，劇情更是顛覆感官、直擊靈

  魂深處，一幕幕緊張刺激的橋段，讓觀眾全程緊握另一半的手不放並驚呼連連，更有情侶

  在觀賞後激動表示：「這真的是今年最不可錯過的約會電影！」





  《永遠在一起》以真實愛情經歷為靈感，描繪愛情長跑多年的情侶，面對情感關係危機時

  的脆弱與掙扎，導演麥可山克斯分享：「這部電影觸及到非常普遍的主題，大家或多或少

  都曾經身處或目睹過這樣的關係，並且對『在一段關係中失去自我』產生恐懼。」常見的

  兩性議題透過導演的特殊詮釋方式，也讓本片在國外上映後引發觀眾高度共鳴，紛紛表示

  ：「去年我跟我女朋友就是這樣！」「我覺得這部片就是在說我跟我的伴侶！」「我跟另

  一半回去後不斷在討論！」在片中擔綱主演的戴夫法蘭科（Dave Franco）也分享：「我

  有一些單身朋友看完後，很慶幸自己還是單身；但也有一對情侶，本來在看電影前吵了整

  個星期，但看完後竟然幫忙解決了問題！每個人都會從這部電影當中，汲取到不盡相同的

  東西。」



  尤其美國發行商「NEON」更順勢與情侶諮商平台「OurRitual」合作，推出「看電影免費

  送情侶諮商療程」活動，讓觀影後約會氣氛急轉直下，或是因為觀賞後受到「創傷」的情

  侶，免費兌換情侶諮商療程。只見活動參與超踴躍，也讓OurRitual幽默喊話：「雖然這

  是一部恐怖片，但我們的目標就是來確保你的生活不會變成恐怖片喔！」





  《永遠在一起》作為今年必看「約會電影」，適逢七夕情人節到來，台灣發行商也在昨晚

  （8/28）於美麗華大直影城應景舉辦「七夕情人節特映會」，只要在指定背景前拍攝「兩

  人親嘴合照」就能免費入場觀賞本片。現場參與的情侶們各種花式秀恩愛，真實呈現何謂

  你儂我儂、如膠似漆的好感情。而本片融合愛情危機與肉體恐怖，刺激觀眾感官與情感的

  瘋狂畫面，也讓參與活動的觀眾在觀賞時嚇到緊抓住另一半、猛遮眼，甚至驚呼連連，並

  紛紛在觀賞後大讚：「嚇死人得好看！」「絕對是製造心跳的最佳約會電影！」「從頭嚇

  到尾！」也讓本片成為台灣觀眾今年最不可以錯過的驚世愛情片！



  這部由「金獎製造機」NEON打造，刺激觀眾感官與情感，轟動國際的恐怖愛情片《永遠在

  一起》，即將於9月26日於台灣驚駭獻映。本片劇情描述當愛情在時間的拉扯下逐漸變質

  ，提姆（戴夫法蘭科飾演）與米莉（艾莉森布里飾演）決定搬離喧囂都市，前往偏遠鄉村

  展開新生活，試圖挽救搖搖欲墜的愛情。某天，突如其來的大雨讓他們受困在森林深處，

  並意外跌入一處神秘洞穴。他們在洞中暫時棲身，準備待雨停後離開。只是隔天醒來，一

  切都變了…。一股無法解釋的詭異力量，悄悄滲入他們的生活之中，也逼迫他們面對愛情

  中最深層的依賴與恐懼。在這段既親密又扭曲的關係裡面，他們逐漸發現：真正的恐懼，

  不是失去彼此，而是再也無法分離…。



  欲知本片最新消息，

