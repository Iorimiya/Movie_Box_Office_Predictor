title: '[ 有雷] 永遠在一起'
content: '這部有這麼冷門嗎?上映戲院少、時段也少。

  下面先防個雷






  上面迷因是指本片。

  本來預期劇情可能像懼裂那樣噁心人，但表現出令人疼痛的部份不夠多，覺得像用恐怖片

  去包裝的愛情片，體現出兩人要共度一生，在包容和理想間磨耗了感情。

  夠驚悚嚇人，最後兩人在一起，真的只有傻眼。


  但是延伸更多問題....男女組合會變扶他嗎?如果再喜歡上別人....可以無限合體?

  最後力推大家去看這部片，真心的

  --'
