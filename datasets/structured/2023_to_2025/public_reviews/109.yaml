title: '[極好雷] 永遠在一起Together'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n《永遠在一起》極好雷觀後感：相愛後的我們\n\n■ 無雷推薦語\n\n\n\n\n\n\n（以下有雷）\n\n■ 另一半\n\n熱戀的甜蜜，很多愛情電影在寫，但交往後的愛情呢？當好奇消失、回歸平淡，怎麼知道\n\
  彼此相愛？《永遠在一起》用恐怖的畫面做到了。\n.\n有人說，伴侶就像另一個自己。可是長久交往的人，根本連自己是誰都不記得。\n\n電影男女主角，卡在婚姻殿堂的門口，計較彼此的付出。女主角為了支持男主角，做安穩\n\
  的教師工作，放棄冒險的權利；男主角則為了女主角，答應搬家跟同居。\n\n大家都說愛情最好要保有彼此的空間，但這只成立在平常的小事（有聽過很浪漫的柏拉圖\n愛情那可能ok）。相愛的人，恨不得\
  \ 24 小時黏在一起啊，或是至少每天見個面抱一下都\n好。\n\n就算撇開這些親密需求不談，我們來談生活：「要不要一起買房？要生小孩嗎？哪邊房價\n漂亮？孩子的升學要怎麼規劃？去你那邊住還是跟我住？明年去旅遊，怎麼排假？假日怎\n\
  麼都宅在家，陪我出去玩啊！」\n\n經過浪漫吃飯約會的階段，愛情開始走入生活。為了好好相愛，情人不斷妥協和改變生活\n步調，而這些犧牲跟付出，形塑了新的生活方向。\n\
  \n隔壁的鄰居說的很好：「跟他在一起久了，我已經不知道自己一個人怎麼生活了。」\n\n\n.\n所以《永遠在一起》的命題不是你們相不相愛，甚至不是愛情怎麼持續。而是當你們在情\n\
  感、生活、價值觀都綁定在一起的時候，要怎麼看待兩個人的關係？\n\n你說你們是兩個自由靈魂彼此依靠，但明明就常常吵架拌嘴、事事遷就，哪裡自由了；你\n說我們就是一個靈魂一分為二，但又注意到很多個性和習慣上的不同，想追求的人生也不\n\
  同。\n.\n恐怖的不是你們的肉體黏合、變成縫合怪，而是你願意接受「合而為一」的概念嗎？\n\n\n\n\n■ 男主角和死老鼠\n\n吊燈上的死老鼠，明顯在比喻父母帶給孩子感情觀的影響，更甚是過往感情帶給我們的影\n\
  響。\n\n男主角因為小時候看過爸爸處理死老鼠，所以可以更快找到臭味的來源。看過父母怎麼跌\n跤，所以能更好辨識感情裡的問題。\n\n童年母親伴屍的驚悚畫面，則讓男主角潛意識對婚姻害怕（對應現實，可能指涉承諾恐懼\n\
  ）。父母相愛，到死都在一起，死後也不願分開，光想就令人窒息。\n\n感情陰影讓我們能更快嗅到不對勁的地方，同時也是真正擁抱幸福的阻礙。\n\n■ 神秘洞穴的含義\n\
  \n讓男女主角陷入詛咒的洞穴，前身是個教堂，有鐘聲、長椅……這不就是結婚禮堂嗎？\n\n\n\n宙斯將怪物二分之一的傳說，道出人們尋找完美伴侶的渴望。你真的準備好了嗎？還是像\n\
  男女主角兩隻小白兔一樣，意外墜入「愛情的墳墓」？\n\n\n\n\n倘若真的愛上對方，你逃都逃不掉喔（渾身發抖）\n.\n這群人幹話王的經典語錄：你們絕對可以愛到死\n\
  *眾人歡呼*\n\n網頁好讀版>>  \n–\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n--\n要等9／26上映\n\
  前面也許會有搶先場，可再留意\n\n我是看片商的七夕特別活動場～\n要排檔期，需要跟外國版權方喬，還有跟戲院及自己的片協調\n應該都有有自己的考量～\n預告剪得很好"
