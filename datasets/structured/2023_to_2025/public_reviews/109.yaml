title: '[新聞] 16年愛情長跑譜出肉體恐怖片<永遠在一起>'
content: '新聞網址：



  勇奪爛番茄100%好評，瘋狂超越《完美伴侶》（Companion）的年度最佳「驚」世約會電

  影《永遠在一起》（Together），即將在9月26日於台灣驚駭獻映。首度執導長片的「澳

  洲鬼才導演」麥可山克斯（Michael Shanks），從自身愛情長跑16年的經驗汲取靈感，結

  合他最喜愛的恐怖片類型，透過「肉體恐怖」以最極端的方式，進一步探討兩性依存的終

  極邊界。由於本片以他自身經驗為創作藍本，導演也在片中揭開最為隱私與黑暗的一面，

  表示：「我把所有破事都攤出來給大家看了！」為了強化電影的視覺張力，讓恐怖感提升

  至極致，他不僅親自參與特效製作，更請來曾製作《F1電影》（F1）、《捍衛戰士：獨行

  俠》（Top Gun: Maverick）、《地心引力》（Gravity）等好萊塢大片的奧斯卡獲獎特效

  公司「Framestore」打造驚駭肉體變異場面。尤其適逢七夕情人節將至，作為今年必看「

  約會電影」，台灣發行商也特別為本片「驚」心舉辦「七夕情人節特映會」，邀請觀眾們

  現場親嘴，就可以免費搶先體驗這部既浪漫又殘酷的現代愛情寓言！





  《永遠在一起》是「澳洲鬼才導演」麥可山克斯首部自編自導長片，他與另一半從學生時

  期開始交往，愛情長跑超過16年。當他回首從熱戀到如今共築愛巢的歷程，他表示：「我

  和這個人在一起的時間比不在一起還多，我們住在同一個屋簷下，呼吸著同樣的空氣，吃

  著同樣的食物，擁有相同的朋友，我真的有點記不得沒有她的自己是什麼樣子，也許她也

  不知道沒有我的自己是誰。」他認為長期情感關係當中，這種「緊密到快要融為一體」的

  狀態，非常適合探討「共依存」議題。身為恐怖片狂熱愛好者的他，便萌生「肉體恐怖片

  」想法，期望以最極端的方式，探討兩性依存的終極邊界。



  由於本片從他的真實愛情經歷為基礎進行創作，也讓他不得不透過電影，揭開自己最隱私

  與黑暗的一面，讓他忍不住自嘲：「我平常不是個會公開談論私事的人，但當你拍一部電

  影放給幾百萬人看，等於我把所有破事都攤出來給大家看了！」他更坦言自己長期受恐慌

  症發作困擾，但為了能讓飾演男主角「提姆」的戴夫法蘭科（Dave Franco）能夠更深入

  刻劃角色，他將模擬恐慌症發作的模樣錄製成影片提供給戴夫參考，也讓他開玩笑表示：

  「如果影片外流的話，我會很尷尬。」





  《永遠在一起》導演麥可山克斯，認為「視覺張力」是恐怖片的重點要素。為了讓恐怖提

  升極致，並實現他腦中瘋狂又好玩的電影場景，他將累積多年的深厚特效經驗，毫不保留

  地發揮在這部電影當中，親自讓觀眾體驗前所未有的獨特視覺效果。他更請來曾製作《F1

  電影》、《捍衛戰士：獨行俠》、《地心引力》等好萊塢大片的奧斯卡獲獎特效製作公司

  「Framestore」，共同打造片中驚駭的肉體變異場面。網羅豪華團隊加盟，讓導演忍不住

  讚嘆：「能跟他們一起創造那些瘋狂的身體恐怖場景，我整個人迷弟心態爆棚！」值得一

  提的是，適逢七夕情人節將至，作為年度必看的「約會電影」，台灣發行商也將在8月28

  日（週四）晚間7:30於美麗華大直影城，特別舉辦本片的「七夕情人節特映會」。只要在

  活動現場於指定背景拍攝「兩人親嘴合照」上傳至社群，就有機會獲得免費觀賞《永遠在

  一起》的資格，邀請觀眾們搶先體驗這部既浪漫又殘酷的現代愛情寓言，詳情請關注「采

  昌國際多媒體」官方社群公告。



  這部由「金獎製造機」Neon打造，刺激觀眾感官與情感，轟動國際的恐怖愛情片《永遠在

  一起》，即將於9月26日於台灣驚駭獻映。本片劇情描述當愛情在時間的拉扯下逐漸變質

  ，提姆（戴夫法蘭科飾演）與米莉（艾莉森布里飾演）決定搬離喧囂都市，前往偏遠鄉村

  展開新生活，試圖挽救搖搖欲墜的愛情。某天，突如其來的大雨讓他們受困在森林深處，

  並意外跌入一處神秘洞穴。他們在洞中暫時棲身，準備待雨停後離開。只是隔天醒來，一

  切都變了…。一股無法解釋的詭異力量，悄悄滲入他們的生活之中，也逼迫他們面對愛情

  中最深層的依賴與恐懼。在這段既親密又扭曲的關係裡面，他們逐漸發現：真正的恐懼，

  不是失去彼此，而是再也無法分離…。



  欲知本片最新消息，

