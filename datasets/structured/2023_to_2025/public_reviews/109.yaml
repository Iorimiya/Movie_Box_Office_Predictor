url: https://www.ptt.cc/bbs/movie/M.1654077818.A.C3F.html
title: '[好雷］ 櫻桃摩法-要永遠在一起哦。'
content: '入坑入得晚的我意外地很愛這個故事，無論是電視版、還是電影版。


  真的很愛。


  這個故事對感情的醞釀手法溫柔至極，純粹且美好，導演獨特的純愛風格非常打動我，讓

  我忽略掉這是兩個同性者的愛情故事。


  感情的事情沒有是非好壞，更無關性別、年齡、階級，只要當事人接受了，一切就對了。


  不管你是同性戀還是異性戀，不論這段感情來得容易或者困難，都請好好珍惜你的另一半

  。


  電影版裡，乍看以為黑澤強勢主導著兩人的感情，事實上，安達也默默在成長，逐漸變成

  一個能跟黑澤並肩同行的夥伴。


  電影一開始，兩人初詣時互相吐露新年新願望，安達的願望是沒有「永遠」的概念的；安

  達希望可以跟黑澤開心地過日子，但黑澤許的願望卻是希望能跟安達一輩子在一起，兩人

  對這份感情的期盼是有差別的。


  黑澤很專情，也很純情，所以當暗戀七年的黑澤終於順利和安達成為戀人，此後他的種種

  規劃都有安達；跟安達在春天的時候一起去賞櫻、跟安達在夏天的時候一起去參加祭典、

  跟安達在秋天的時候一起去看演唱會、旅遊……黑澤腦海裡滿滿的計畫，都是因為身旁有

  了安達的存在；看他輕聲細數行程時那愉悅到不行的表情，真的好滿足、好幸福。


  安達雖然感情慢開竅，卻也知道樣樣都為自己著想、把自己擺第一位的黑澤有多珍惜自己

  ，所以願意為了黑澤放棄轉調的機會，因為安達知道黑澤「只要是對安達好的事情，我都

  會支持喔。」，他不想再看到黑澤露出失望的表情。


  兩個都替對方著想、都想對對方更好一點，但心裡的話不說出來，對方是永遠不會知道的

  。


  沒有摩擦、沒有爭論，兩人各自揣測對方心意、都以為自己這樣做對對方比較好的結果，

  就是變成了相隔1200公里的遠距離。


  很不好受。


  兩人因分隔兩地而造成的寂寞與不安，在各自的鏡中反射了出來。


  個性單純善良卻缺乏自信的安達在遙遠的長崎認真工作著，也認真想念著、揣測著黑澤內

  心真正的想法；即便相隔兩地、即便魔法消失，安達還是告訴自己要努力成為一個能讓黑

  澤安心倚靠、能跟黑澤互相扶持、共度一生的人。


  雖然黑澤是安達的初戀，但他因為魔法而認識了愛情，了解了愛情，掌握了愛情，進而懂

  得愛情是需要雙方共同經營的。


  知道跟黑澤的關係不能只是單方面的接收與仰望的安達，好棒。


  町田啓太演活了「黑澤」這角色，無論是完美的外表，還是要求自己事事都要盡善盡美的

  內心。


  對黑澤而言，承認自我的軟弱與膽小是多麼難為情的事情,甚至近乎難堪；黑澤口是心非

  ，以為自己夠堅強，能撐得過這1200公里的距離與8個月的時間，一個人在沒有安達的東

  京獨自承受難過與寂寞，殊不知在知道安達出事後這份壓抑完全潰堤。


  那迅速飛奔至長崎的焦急與急迫神情，在一聲「安達」呼喚後整個虛脫完全顯現了黑澤投

  注在安達身上的情感到底濃烈到何種程度。


  黑澤的成長，在於他終於肯卸下武裝、知道要『喜歡每個狀態的自己』，不完美，也沒關

  係。


  謝謝安達在看到黑澤露出脆弱時毫不猶豫的勇敢，牢牢接住那樣的黑澤。


  一直維持狀況高檔的人生很累，這樣的黑澤，真的會讓人忍不住想對他說：「お疲れ」。


  所以當看到黑澤鬆下來後出現賴床的行為，甚至對安達撒嬌、耍起小無賴，覺得他好有人

  味、好可愛。(笑)


  不得不說，兩人面對感情的態度是健康的，勇敢的，正向的；對於自己重視的人，也想讓

  最親近的家人知悉，可能家人一時半刻無法接受，但只要兩人攜手同心面對，一定可以找

  出解決的方法的。


  我知道同性戀人在實際上面對這種事情常常是「夢想很豐滿，現實很骨感」，但導演讓黑

  澤跟安達有一個無論夢想跟現實(?)都很豐滿的Ending，我很開心。


  真實世界中多的是不如己意的失望與打擊，那至少在童話故事中，給個不留遺憾的圓滿吧

  。


  或許，這樣的美好剛好可以鼓勵到誰，有繼續堅持下去的力氣。


  其實，在劇情的鋪陳跟情感的堆積上，電影版真的比不上電視版，讓人詬病的點也不少；

  但是，黑澤跟安達相互扶持，互有成長，並有雙方家人的認可與愛護，對我而言，那就夠

  了。


  電影的最後，讓我想到可苦可樂的「永遠にともに」歌詞：




  無論電影中安排的婚禮畫面是真的還是安達自己的想像，最後兩人牽手走在長長的路上，

  讓我對兩人的未來有信心。(笑)


  我給予那個世界的兩人最誠摯的祝福，祝福黑澤與安達一世安好。


  也將這份祝福獻給現實生活中的每位黑澤與安達。


  --'
