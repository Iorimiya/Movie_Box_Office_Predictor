title: '[好雷] 不輸第一集的《人肉搜索2：失蹤搜救》'
content: "本篇會完全劇透，請斟酌觀看：p\n\n預告：\n\nimdb：\n\n\n《人肉搜索2：失蹤搜救》是一部不斷反轉、只要忽略小瑕疵就會感到驚喜的\n\
  \n心理驚悚片，跟EP1一樣小成本但非常喜歡用亞裔演員，這對亞裔演員在\n\n好萊塢被看見是相當有幫助的，且本片的亞裔也是有好人有壞人，就跟\n\n哥倫比亞治安不好卻出了個好人跑腿兔叔叔一樣，\n\
  \n這些都是我看見編劇有用心、放感情在編的地方。\n\n\n說到「放感情」，情感真摯濃郁或許就是本片的一大亮點，\n\n人肉搜索2開頭就直接讓我們看見另一個家庭問題，\n\
  \n喜歡碎念各種指揮又愛管教的媽媽（Nia Long）與情感疏離的女兒（Storm Reid），\n\n以及因病離世的爸爸。\n\n\n\n從一開始我就被女兒的情緒牽引，\n\
  \n並不是很喜歡這個亞裔新男友，卻也因為媽媽終於出門、可以狂歡飲酒作樂感到\n\n「自由」，可惜這樣的自由，很快就演變成媽媽和男友並未歸國的擔憂。\n\n\n\
  女主角很聰明利用google翻譯問到了飯店的「口供」，還伶俐地趕快請到\n\n願意跑腿幫忙的哥倫比亞跑腿兔大叔哈維，雖然中間到律師被殺害之後劇情\n\n就急轉直下，我一度以為是神隱的惡媽媽和律師聯手殺害爸爸獲得保險金（！），\n\
  \n因為Nia Long給我的演技是滿百變的，到最後我甚至有些生氣為什麼Kevin被\n\n編劇賜死之後，媽媽還決定不露面？\n\n\n最後峰迴路轉，原來是為了逃避家暴又嗑藥的爸爸，想辦法讓他定罪越久越好，\n\
  \n實在太可怕了，種種的隱名埋姓原來都是為了愛女的必要改變，\n\n把這部當親子教育片看會比較適合，畢竟有些線索硬要連起來還是會覺得，\n\n警方怎麼總是慢一步？\n\
  \n\n（同樣是亞裔帥哥演員的Daniel Henney在這部還是一樣帥但又慢半拍，但演技\n\n演得很明確，不至於讓人懷疑他是不是反派XDDD）\n\n\n\
  至於有人質疑小屋那邊母女花費很多時間與爸爸纏鬥很多餘，\n\n我個人認為爸爸應該還有精神方面的問題，他想要的是控制母女和證明自己\n\n才是對的，他希望的是大家站在他這邊，因此把母女殺掉不是他最先的原意。\n\
  \n（有些病態執著的人會認為自己才是對的，只是導演用了一個超級路人臉當uber\n\ndriver也不會有人特別注意的演員吧XDD就很容易忽略他是個心理有問題的人來著，\n\
  \n中間有段跟媽媽的錄音與錄影檔，很明顯就看得出他是想要掌控話語權的，\n\n這種人把母女都活捉、宣洩，當作自己的道具也不足為奇QQ）\n\n\n如果真要雞蛋挑骨頭的話，\n\
  \n最大的瑕疵在於：媽媽居然在交友網站上可以跟Kevin這麼快就有火花\n\n（我覺得是選角的問題耶，兩人感覺互相沒什麼火花）\n\n\n再來，是女閨蜜用男聲問Kevin\
  \ Lin的細節，該公司還不疑有他，\n\n其實網路上已有很多工具可以讓你偽裝聲音了XDDD 根本不需要裝得這麼辛苦啊。\n\n\n再來也是為人詬病編劇先把Kevin賜死的部分，不這樣做的話這部片劇情應該\n\
  \n會被砍一半。\n\n\n再來哥倫比亞給人的印象，說真的，我先前不想進電影院支持就是因為\n\n哥倫比亞治安給我的印象相當差，自大的我想不出來為何還有人願意去這種國家旅行？\n\
  \n感覺就是會出事情的前奏啊Orz\n\n\n但本片其實有帶出哥倫比亞美和善的一面，我看到他們居然也有座情鎖橋\n\n第一時間是還滿震驚的，而哈維最大的亮點就是有求必應、被女主角說氣\n\
  \n話傷害還願意接電話的哈維，一直到最後一幕編劇都沒讓我們知道，報警的究竟\n\n是哈維、還是女主角一直不屑使用的siri？XDD\n\n\n哈維的溫暖與無私、最後與兒子和解、加入女主角媽媽FACEBOOK都讓我覺得編劇\n\
  \n把這個角色寫得真好真可愛，演員Joaquim de Almeida把這個阿伯的及時幫助\n\n做到畫龍點睛，本片在情感刻畫上做足功夫。\n\n--\n\n\
  幻想●---------------☆\n/﹀\n/\\ \n\n按a加入最愛\n\n--\n感謝提供好文，現在願意寫心得還來ptt推廣的人不多了～\n最後從律師被殺開始就有這種感覺，但劇情結尾得很不錯～\n\
  謝謝Yuri大，這比較像是被catfished網路釣魚+爸爸充當戀愛軍師的感覺，\n不過我主要想表達的是這選角沒辦法讓我完全信服媽媽居然跟年紀差很多的人戀愛？\n\
  或許這種詭異感也是編劇想傳達給青少女的吧？\n感謝Z大:)) 確實女主角一開始跟哈維接上線時有一種不對等的感覺，\n哈維稱呼她為Hollywood是很尊重她的雇傭關係，但是她對哈維其實沒有很客氣，\n\
  哈維中間還願意安慰她算是真的很善心了，原來哥倫比亞最美的風景是人:D\n哈維真的很給力，而且騎機車沒戴安全帽這點讓我覺得很妙XDDDD\n人都有偏見，這就是為什麼我們需要多看多聽各種好的內容，不是嗎？\n\
  兩集都有各自的魅力，我個人是覺得片商太聰明了，有抓到亞裔市場\n（亞裔在美國本來就偏弱勢且很多標籤，\n但外銷時又讓這種題材和選角在美國以外的地方也可以大賣）\n\
  用少少的成本大賺錢、又沒賠了故事魅力，實在厲害～"
