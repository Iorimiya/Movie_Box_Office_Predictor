url: https://www.ptt.cc/bbs/movie/M.1677480436.A.3AE.html
title: '[好雷] 《人肉搜索2：失蹤搜救》劇情不斷反轉'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  圖文重點標示好讀版↓




  前幾年在Netflix上看《人肉搜索》，覺得劇情還不錯，所以前陣子得知有續集《人肉搜

  索2：失蹤搜救》，就決定上映後要找時間去電影院看。

  昨天跟朋友去電影院看完《蟻人與黃蜂女3：量子狂熱》，在吃晚餐時討論乾脆吃完回電

  影院繼續看《人肉搜索2：失蹤搜救》，就這樣，展開難得的一日兩部電影行程！

  《人肉搜索2：失蹤搜救》的劇情大致上是講述女主角的媽媽跟新男友去哥倫比亞度假，

  並跟女主角約定回國時請女主角到機場接機，但到了女主角去機場接機的那天卻不見媽媽

  及新男友蹤影，女主角因此開始進行一連串的網路搜索，試圖尋找媽媽的下落。

  本片的劇情可以說無可挑剔，非常精彩，女主角進行搜索的過程充滿謎團，一層層抽絲剝

  繭，讓我直呼過癮！

  雖然大致上猜得到女主角媽媽的失蹤跟其新男友有關，但真相卻遠遠超乎我的想像，劇情

  不斷反轉，甚至中間一些看似不重要的對話，其實都是為之後的劇情所埋下的伏筆。

  而本片的畫面幾乎從頭到尾都是以電子設備（例如MacBook、iPhone、Apple Watch、監視

  器等等）的螢幕或軟體（例如iMessage、Google地圖、Gmail、WhatsApp等等）呈現，這

  算是本片的特色，同時也是雙面刃，因為就我個人而言，是可以接受這種呈現方式，至少

  不像《科洛弗檔案》從頭到尾用攝影機畫面搖搖晃晃的呈現，搞得我看得頭很暈，但我朋

  友就比較不喜歡這種呈現方式，因此就這部分，可以作為是否要觀賞本片的考慮因素。

  《人肉搜索2：失蹤搜救》的時間背景雖然是設定在《人肉搜索》之後，但兩者劇情可以

  說沒有關聯，所以沒看過《人肉搜索》的人，直接看《人肉搜索2：失蹤搜救》也沒有問

  題，但本片疑似有一個小彩蛋，就是本片一開始，女主角在看的犯罪影集好像是由《人肉

  搜索》的劇情改編而成，因此女主角在查該影集劇情對應的真實事件人物時，好像有出現

  《人肉搜索》的凶手照片，不過這段畫面稍縱即逝，所以我也不是很確定，只能等之後

  Netflix或Disney+上架重看才能確定了。

  總之，《人肉搜索2：失蹤搜救》雖然是冷門片，但截至目前為止，我覺得是我在2023年

  看過最好看的一部電影，非常推薦大家觀賞本片！


  --

  我的FB粉專「阿培嘎嘎嘎」，歡迎大家按讚追蹤！



  --'
