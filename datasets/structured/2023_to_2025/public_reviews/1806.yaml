title: '[  雷] 人肉搜索2:失蹤搜救'
content: '防雷

































































































  當年我看第一集時,不看還好,看完腦袋星爆了好久

  科技的力量顯露無遺,更讚的是抽絲剝繭的極致！

  那種抓著繩索一步一步往前爬的過程真的舒服

  第二集大部分也承襲了這個調性

  只是後面加入綁架元素可能會比較有失風格

  這點較為見仁見智,至少還是相當精彩

  這集比起科技也強化了不少特點

  像是親情跟冷漠的科技形成的對比

  還是驚悚元素這次也被大大加深

  有一度我真的以為自己在看恐怖片

  這些嘗試有好有壞,基本上都瑕不掩瑜

  這部電影真的是善用現代科技的進步

  去發展屬於這個時代的經典,而不會被埋沒在片海中

  寫著寫著我都覺得自己是剛接觸科技的老頭

  但這些功能的交叉應用,再搭配優秀的剪輯

  絕對難以取代,每次看都覺得很新鮮

  可能冷門了點,希望難得這麼優秀的現代片能被看到

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  會拿美麗比喻成愛的人，都是不知愛情真相的人

  會把醜陋比喻成愛的人，都是熟知愛的驕傲者


  --'
