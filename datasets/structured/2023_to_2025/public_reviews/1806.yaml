title: '[好雷]《人肉搜索2：失蹤搜救》，眼見不一定為'
content: '部落格版：


  只能說，《人肉搜索2：失蹤搜救》的好看程度絲毫不輸給《人肉搜索》，甚至我個人認

  為是有所超越的。記得當年看完《人肉搜索》後，對於電影的敘事手法與呈現方式相當驚

  艷，用手機、電腦、監視器、攝影機等的畫面來組成，從視覺上就已帶給觀眾不同於過去

  對電影鏡頭畫面認知的新鮮感，而其劇情的推動更藉著各種你我熟悉的程式或網頁，例如

  Google、YouTube、WhatsApp、交友軟體等，不僅是將各種線索與細節藏於其中，步步帶

  領觀眾往真相前進，亦是藉著這樣子雖不算峰迴路轉可卻也有些燒腦的尋女過程，讓觀眾

  看見網路科技力量的一體兩面。


  在讚嘆廣大網友擁有堪比、甚至比有著諸多限制的警方或聯邦調查局探員更廣、更快速、

  更強的資訊情報搜集能力的同時，不免會對任何人在網路上都是無所遁形的這件事感到擔

  憂，那是即便你用無痕、用匿名、用假名都還是會被「肉搜」出來的恐懼。導演阿尼許夏

  干提用各種程式與網頁組成的畫面，直接將整個操作過程攤在觀眾眼前，彷彿是在告訴觀

  眾在這個網路世代，沒有人是藏得住的。



  時隔三年多，續集《人肉搜索2：失蹤搜救》於本週上映，首集導演阿尼許夏甘提改為負

  責編寫劇本，導演工作則交給曾執導過《密弒逃脫》的威爾尼克與尼克強森。過去有許多

  例子是當導演換人時，續集通常不會獲得太好的評價，但《人肉搜索2：失蹤搜救》卻是

  依舊維持精彩表現，卸下導演一職後的阿尼許夏甘提寫出了更為縝密全面的劇本。確實感

  覺上《人肉搜索2：失蹤搜救》就是又一部的《人肉搜索》，不過是將主線從父親救女兒

  換成了女兒救母親而已，但不論是整個敘事手法與呈現方式，或者是其從首集延續到續集

  的「認識不等於了解」的核心概念，以及親情為主的情感渲染力道，都比《人肉搜索》來

  得強上許多，劇情部分亦比首集更加燒腦，徹底的玩轉「眼見不一定為憑」這句話，讓觀

  眾不到最後一刻真的很難猜到結果。


  《人肉搜索2：失蹤搜救》同樣是以犯罪事件為故事基底，看主角如何運用網路科技來尋

  找失蹤的親人。而比起首集中對網路科技並不熟悉的金大衛，身為Z世代、α世代一份子

  的瓊恩，會利用手機定位追蹤、街景服務、地圖時間軸、瀏覽歷史、熱門景點即時影像等

  的來找人並不難，甚至就連他人的信箱與通訊軟體帳號都能被簡單破解，因此在編排上是

  有了更多的反轉來增加懸疑感，先讓觀眾跟著瓊恩將原有的線索推理成「自己所認為的真

  相」後，再又有新的發現來推翻原本假設，但《人肉搜索2：失蹤搜救》厲害的是，新線

  索其實並不是真的新發現，而是早就交給瓊恩與觀眾了，只是在「先入為主」的成見影響

  下導致了忽略，直到開始懷疑自己之後，被忽略的才逐漸能被看見。



  《人肉搜索2：失蹤搜救》節奏相當緊湊，得保持全神貫注才能不漏掉任何線索與細節，

  儘管後來散場後想到許多邏輯漏洞，例如凱文偕同詹姆斯綁架葛莉絲時，葛莉絲怎麼可能

  會認不出來自己的前夫長相？又或者詹姆斯怎能確定受他威脅的律師海瑟不會懷疑到他頭

  上？等諸如此類的疑點，讓人感覺這個計畫或是劇本的成功，是不是有點仰賴運氣與巧合

  ？但瑕不掩瑜，整體來說我還是喜歡《人肉搜索2：失蹤搜救》的，尤其是隨著劇情越到

  後面轉趨炙熱的親情。在理解母親的有所隱瞞是為了保護自己不受傷害後，回頭在看看過

  去是怎麼敷衍與對母親冷淡，那打從心底的懊悔在再次與母親重逢後成了一次又一次的對

  不起，母女相擁令人動容。


  不需要看過《人肉搜索》也沒關係，只有開頭那段新聞片段是有關聯的小彩蛋，後續劇情

  是整個獨立的新故事，若是擔心會不會銜接不上的觀眾可以放心。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
