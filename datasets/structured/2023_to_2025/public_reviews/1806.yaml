title: 'Re: [好雷] 人肉搜索2 ：失蹤搜救'
content: '平衡打擊


  沒看過1 但是看了版上的推薦去看了


  開場就直接睡了半個小時


  我自己認為從手法來說 很新穎 很特別


  但如果是對於人物 表情 畫面有要求的人


  可能會接受不了


  看著一堆電腦畫面跳來跳去 基於我對於電影


  就是對於畫面表現感的迂腐觀眾來說


  我覺得這樣的表現手法很無聊= =



  欣賞我是欣賞的 也沒中間離場什麼的


  就是會看到睡著而已



  電影沒有大咖這就不用多說了 主角群演技ok


  顏值比較沒有吸引人的地方



  比較不喜歡的是 硬要加入恐怖片的元素拉抬驚悚感


  挺問號的 如果少了這種刻意 這部片我覺得表現上會更無聊


  每次一些關鍵情節都要套恐怖片那套 拉非常大聲驚悚的音樂...挺反感的


  ---------------------------防雷一下-------------------------


























  可能我自己對這些3C挺熟的


  他這樣搞我只能覺得浮誇而已


  要是我要幹嘛的話 第一時間我就會把手機丟掉


  或是登出google讓歷程記錄不到



  再來是帳號被登基本上會跳訊息阿= = 還可以給人家開這麼久


  騙密碼也是有點浮誇 前面在那邊阿阿阿就很引人懷疑了


  更何況女生聲音也很容易被質疑是本人的誰吧



  中間的銜接 叫一群少年演戲 扮演搶匪 這個都不覺得有問題嗎...


  更不用說叫一個女的去演替身 正常人真的都不會覺得很奇怪@@



  題材是很特別 但我覺得當作電影看怪怪的 影集可能更適合吧



  還有一個點是


  如果你有3D暈 建議你不要看


  像我這種有3D暈的 畫面一直轉 頭超暈


  --

  笑死 有點道理

  我同意 藝術性角度上如文中所說 我還是很欣賞的 很特別

  只是觀影體驗這種東西 我主觀不喜歡而已'
