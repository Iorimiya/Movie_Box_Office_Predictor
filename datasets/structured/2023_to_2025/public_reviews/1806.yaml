url: https://www.ptt.cc/bbs/movie/M.1678192351.A.E85.html
title: '[好雷] 人肉搜索2 ：失蹤搜救'
content: '先說結論，《人肉搜索2：失蹤搜救》真好看，是今年目前我最驚喜的電影。


  同時，這也是一篇催票文。這麼有創意（以及警世意義）的作品討論度卻不成正比，被淹

  沒在茫茫片海裡太可惜，必須集氣一下，就算你沒看過《人肉搜索》也不用擔心，本片跟

  首集沒有關聯，希望看到文章的你，能走進戲院給他一個機會。


  /


  當你最重視的人無故失蹤，該如何透過3C產品拼湊蛛絲馬跡、找出他的行蹤？首集成本僅

  有100萬美元，一半以上畫面都停留在電腦螢幕，但主創團隊對社群生態的操作顯然比你

  我更熟稔，抽絲剝繭的驚心程度完全不遜於恐怖片，全球甚至賺進7500萬美金票房，投資

  報酬率相當驚人。


  然而，太多續集不如預期的慘痛先例，讓熱愛首集如我也不敢對《人肉搜索2》抱有期待

  —但我錯了，主創團隊完全跟得上時代，加進抖音、跑腿服務、即時影像監視器等新潮AP

  P，讓觀影過程更身歷其境，卻也沒忘記身為懸疑類型的鋪陳與反轉，告訴屏氣凝神的觀

  眾什麼叫做優秀續集。


  /


  從《Searching》到《Missing》，兩集英文片名也頗具巧思：上集是對女兒陌生、對3C產

  品更陌生的單親爸爸，得透過搜尋引擎挖掘失蹤女兒的秘密；這集主角則是思念亡父的女

  兒，儘管與母親心結難解，但當母親與男友出國度假後離奇失聯，她仍得找出母親成謎的

  人際網絡，猜測可能被藏在哪個角落...或者她根本就沒出國。


  比起首集周約翰飾演的父親，笨拙輸入鍵盤、點擊游標，踏進他完全不熟悉的數位國度，

  這集由斯托姆里德飾演的瓊恩明顯是Z世代的一員（1990年代末至2010年前出生），她的

  成長過程與科技密不可分（更精確地說，是iOS系統），用各種通訊軟體喇賽開趴是日常

  、用iMac搞定一切則是基本技能；相較之下，只有facebook、Gmail，平時萬事求Siri的

  母親簡直是老古董，跟不上科技的速度、也就打不進女兒生活，親子鴻溝越拉越大。


  這也是《人肉搜索2》做得最好的地方，雖然系列核心始終是科技冷漠下的親情重建，但

  主人翁從LKK變成青少年，使用者體驗截然不同，因此本片節奏比起前作迅捷許多，轉場

  讓人目不轉睛，忠實呈現瓊恩對3C產品的高度黏著性；但科技始終來自於人性，對母親的

  擔憂仍在猜錯密碼時露了餡、而理智隨著時間流失，也反應在點擊網頁的遲疑，讓人無法

  鬆懈。


  /


  雖然劇情幾乎都發生在電腦螢幕前，卻不代表演員很輕鬆。有關注《最後生還者》的粉絲

  ，必然對第7集的斯托姆里德印象深刻，她在《人肉搜索2》的發揮更讓人讚許，當你以為

  叛逆屁孩是本色演出，她卻在情況從糟糕變成難以理解時展現超齡沈著，片中出現的軟體

  你絕對會操作、卻無法像她一樣冷靜善用，當個名符其實的「鍵盤俠」。


  曾在Google工作的編劇阿尼許夏甘提，這回將導筒交給首集的剪輯師威爾尼克與尼克強森

  。事實上，三人早就以google眼鏡拍攝的短片《Seeds》打響名號，以明快流暢的鏡頭語

  言傳達情感的優點，從首集到續集都被完美保留。


  這回編導還不時丟進NPC般的新角色與瓊恩互動，可能帶來關鍵線索、可能協助解任務、

  也可能誤導觀眾，卻都有其必要性。MVP絕對是外送大叔哈維，他與瓊恩奇妙的友情，讓

  本片的情感厚度多了不只一個檔次。


  /


  看到《人肉搜索》發展成系列電影，當然是樂觀其成的。首集的facebook與google搜尋，

  在這集戲份少得可憐，宛如時代的眼淚；等到數位時代再進化，或許還得再過個好幾年（

  下集應該就會看到ChatGPT了），但人們對網路的依賴只會有增無減。當你花在電腦、手

  機與手錶上的時間比家人還多，3C產品對你的習性瞭若指掌，請小心，下一集《人肉搜索

  》的主角很可能就是你。



  更多影評推薦，歡迎追蹤：



  --'
