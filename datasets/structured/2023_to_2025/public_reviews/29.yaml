title: '[情報] 【未完的情歌】預告 11月7日上映'
content: "《#未完的情歌》正式預告公開\n\n壯太 ｜ 森崎溫\n小海 ｜ 向井康二（SnowMan）\n\n與無法忘懷的初戀，展開命運的重逢\n這段「雙向暗戀」的結局將會如何──？\n\
  \n一首「未完成的歌曲」成為兩人之間的紅線\n讓當年停止的時間再次開始流動\n\n主題曲 \n全新創作歌曲〈Gravity〉\n\n《#未完的情歌》11.7浪漫獻映\n\
  ong #未完的情歌\n\n\n★ 《一級玩家》森崎溫 x 向井康二(Snow Man)攜手主演譜出動人情歌\n★ Snow Man向井康二首次雙主演大銀幕作品\n\
  ★ 突破Youtube 8.5億次觀看！\n   引發全球轟動BL熱潮劇集《只因我們天生一對》導演維拉奇通吉拉 全新力作\n★ 日泰黃金製作團隊聯手打造，今年冬季最浪漫的情歌\n\
  ★ 一首未完成的歌曲，跨越東京與曼谷兩座城市，將這份心意傳達給你\n★ 只要把喜歡說出口，我們的世界將會就此改變\n★ 高雄電影節 耽美主義單元\n\n\n劇情簡介：\n\
  \n《未完的情歌》結合泰日黃金團隊聯手打造，由全球熱門BL影集《只因我們天生一對》\n導演維拉奇通吉拉（Champ）執導，森崎溫、向井康二（Snow Man）主演。\n\
  電影講述了以東京和曼谷為背景的原創純愛故事，一首未完成的戀歌將兩個人的命運\n聯繫在一起。\n\n研究員壯太（森崎溫）因突如其來的調職令，從東京被派往海外工作\n\
  ，並在曼谷與學生時代暗戀過的對象、現為攝影師兼音樂人的小海（向井康二）\n再次相遇。透過音樂等媒介，兩人逐漸加深心靈交流，展開了一段純粹的愛情故事。\n\n\n\
  \n\n\n\n--"
