url: https://www.ptt.cc/bbs/movie/M.1753791309.A.0BD.html
title: '[新聞] 【老爸歌單未完待續】寺尾聰親自獻唱編曲'
content: '新聞網址：



  繼《明日的記憶》、《父親》（The Father）之後，又一深刻描繪阿茲海默症與親情羈絆

  的感人新片《老爸歌單未完待續》，即將在8月8日父親節於全台感動獻映。不同於過往的

  失智症家庭電影，本片更融入音樂元素，啟發自英國「最高齡出道歌手」泰德麥克德莫特

  （Ted McDermott）的真實故事，訴說一位罹患阿茲海默症的父親，在兒子用音樂的陪伴

  下，找回片段記憶、重拾失落情感的動人歷程。電影將故事背景轉至日本，由影歌雙棲的

  傳奇巨星寺尾聰領銜主演。他細膩演繹角色從開朗健談，再到逐漸因為失智症而迷惘的過

  程，真實呈現失智患者內心的掙扎與情感波動。他更親自參與全片歌曲的選曲與編曲，並

  開口獻唱，讓音樂成為貫穿父子情感的靈魂密碼。與他搭檔的，則是日本奧斯卡影帝松坂

  桃李，飾演那位不離不棄、堅定守護父親的兒子。寺尾聰坦言，就因為得知松坂桃李將接

  演自己的兒子，才讓他克服體力上的顧慮，毅然接下這部極具挑戰性的作品。本片深刻描

  繪失智症對家庭的衝擊，也展現親情如何在崩解邊緣被音樂重新串起，絕對是今年父親節

  ，一同見證感人至深父子羈絆的觀影首選。





  《老爸歌單未完待續》取材自英國「最高齡出道歌手」的真實經歷，一段因為「父子車上

  合唱影片」而改變命運的奇蹟故事，就此感動全球網友。真實生活中，這為罹患失智症的

  父親，在兒子的陪伴下重拾笑容，兩人在車上歡唱的身影被上傳到網路後，迅速引爆關注

  ，不僅突破百萬觀看數，更意外讓父親收到唱片公司合約，完成他年輕時未竟的音樂夢。

  來到這部改編電影，巧妙結合失智症、父子親情與音樂三大元素，細膩描繪在記憶逐漸流

  失的生命下半場，愛與旋律如何成為唯一不被遺忘的聯繫。本片由日本傳奇影歌雙棲巨星

  寺尾聰領銜主演，他曾獲日本歌謠三冠王，也是日本史上首位奪得日本唱片大賞與日本奧

  斯卡，兩大演藝最高榮譽的傳奇人物，這回更是睽違16年再接電影主演。



  寺尾聰在片中飾演曾懷抱歌手夢、卻飽受失智症折磨的父親，不僅全力投入角色，更親自

  獻唱多首英文經典名曲，展現歌喉與情感演技的雙重實力。導演小泉德宏表示：「他的演

  員和歌手生涯令人嘆為觀止。沒有人能像他那樣兼顧演戲與歌唱，他是獨一無二的。我之

  所以邀他演出，是因為我認為『只有寺尾先生才能勝任』。如果他不接受，我懷疑這個作

  品是否能夠成功。」導演甚至向寺尾聰提出邀約時，對他當面承諾：「我要讓這部作品成

  為你生涯中的最高傑作！」這番話讓寺尾聰深受感動，坦言是自己拍攝時的動力，更自認

  本片是他在演員與歌手生涯中，首度產生交集的紀念性之作。雖然一開始會擔心演出時，

  體力會因為年紀而無法負荷，但當聽到與他搭檔演出兒子的，是同樣榮獲日本奧斯卡影帝

  的松坂桃李時，他毫不遲疑答應演出，並直言：「說到底，演員最在乎的還是跟誰共演。

  當我聽說兒子是桃李時，我心中傾向『我想要演』。如果不是他，我大概一開始就會直接

  拒絕了吧！」





  譜出記憶溫暖羈絆的《老爸歌單未完待續》，音樂是貫穿本片的重要核心元素，片中收錄

  的多首英文名曲，也都是由劇組跟寺尾聰共同選曲，寺尾聰分享選曲理念：「不論旋律多

  麼明亮，都必須蘊含某種淡淡的哀愁。我最容易被打動的，就是那種『明亮中帶點哀愁』

  的作品。人生就是這樣啊！即使在笑，也藏著一點悲傷；即使在哭，也依然有愛存在。」

  除了親自參與選曲，寺尾聰更攜手多年合作的音樂夥伴，共同為電影重新編曲並演唱，讓

  每首歌都更貼近角色的情感脈動。值得一提的是，他在拍攝現場，更會無預警哼唱起那首

  讓他橫掃日本三大音樂獎項的名曲〈紅寶石戒指〉，讓現場主演群甚至臨演們都激動不已

  。當松坂桃李回憶起當時的情況，仍不由自主讚嘆：「那真的是很奢侈的一種享受啊！」



  這部齊聚日本奧斯卡得主，共同打造年度最暖心、最催淚的感動鉅獻《老爸歌單未完待續

  》，即將在8月8日父親節於全台感動獻映。本片劇情描述年輕時懷抱歌手夢的哲太（寺尾

  聰飾演），為了家庭與兒子雄太（松坂桃李飾演），選擇放下夢想，在橫須賀經營樂器行

  ，並偶爾登台一展歌喉，過過歌癮。他樂觀幽默、熱愛音樂，是街坊鄰里最熟悉也最受喜

  愛的存在。然而某天開始，哲太開始頻頻忘記事情，從小事錯亂到回不了家，最終被診斷

  罹患阿茲海默症。當記憶如潮水般退去，他甚至連摯愛的家人也逐漸陌生。然而不曾褪色

  的，是他對音樂的熱愛。每當唱起最愛的老歌，哲太彷彿又變回那個神采飛揚的父親，短

  暫回到雄太眼前。看著父親與病魔對抗的身影，雄太決定用音樂守護父親的笑容與尊嚴。

  那些一唱再唱的旋律，不僅成為父子倆穿越記憶迷霧的橋樑，也讓哲太年輕時未竟的夢想

  ，在人生暮年悄然綻放…。一段關於親情、記憶與旋律的動人旅程，即將溫暖開唱。



  欲知本片最新消息，

