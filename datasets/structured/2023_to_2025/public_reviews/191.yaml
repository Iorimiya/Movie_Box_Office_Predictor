title: '[好雷] 老爸歌單未完待續'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  就像世界各國的父親節都在暑假，很少獲得公開讚揚，以父子親情為主題的電影相對也比

  較少，而真實故事改編的作品又更容易觸動人心，《老爸歌單未完待續》就是這樣一部難

  能可貴的片。



  年輕時懷抱歌手夢的哲太，為了家庭與兒子雄太，選擇放下夢想，在橫須賀經營樂器行，

  並偶爾登台一展歌喉，過過歌癮。然而某天開始，哲太開始頻頻忘記事情，從小事錯亂到

  回不了家，最終被診斷罹患阿茲海默症。



  當記憶如潮水般退去，他甚至連摯愛的家人也逐漸陌生。每當唱起最愛的老歌，哲太彷彿

  又變回那個神采飛揚的父親，短暫回到雄太眼前。那些一唱再唱的旋律，不但成為父子倆

  穿越記憶迷霧的橋樑，也讓哲太年輕時未竟的夢想，在人生暮年悄然綻放。



  本片的卡司星光熠熠，從飾演主角的老爸與兒子，到客串演出的配角，各個出場時都能讓

  觀眾眼睛一亮。《老爸歌單未完待續》裡的老爸，時常開金口唱出動人的西洋歌曲，演員

  的歌唱實力可不能馬虎，所以選角上找到影歌雙棲的日本影帝寺尾聰。他不僅年紀與角色

  原型爆紅時相仿，也曾經榮獲日本歌謠三冠王與日本唱片大賞，演出方面則以黑澤明的《

  夢》與《亂》聞名，並以《黑之雨》與《半自白》兩度奪得日本奧斯卡最佳男主角，這次

  能夠在大銀幕上看到寺尾聰高歌真的很難得。



  飾演兒子的松坂桃李則是以在《娼年》、《不能犯》、《今日開始談戀愛》與《孤狼之血

  》裡多變的角色形象深植人心，並在2019年，憑藉Netflix的《新聞記者》拿下日本奧斯

  卡最佳男主角獎。這次，他在《老爸歌單未完待續》中飾演的兒子角色，雖說與過去一些

  大膽嘗試的人物不同，但情緒張力與層次不輸，兩大影帝同台飆戲讓電影更值得期待。其

  他角色不論是兒子的戀人、商店街的好友，還是主角一家的媽媽，甚至是唱片公司的人員

  ，都是由大家耳熟能詳的演員擔綱演出。



  雖然沒有資料顯示《老爸歌單未完待續》的原型人物也曾經將發行唱片當作自己的夢想，

  但每個以駐唱為職志的人可能都曾經想像過自己的專輯吧。除了影片上傳爆紅之後，眾人

  一次在酒吧閒聊時無意間提到發片，老爸的好友再次虧起兒子雄太，說當年老爸就是為了

  他的誕生而放棄自己的夢想，電影描繪老爸夢想的方式還有透過他阿茲海默症發作時，脾

  氣暴躁，非常執著地在家裡翻箱倒櫃尋找某樣東西，經過幾天的折騰之後，終於找到當年

  的試錄帶，代表這個夢想從來沒有離開過他。



  音樂的確可以撫慰人心，而在《老爸歌單未完待續》的故事裡更是如此。老爸的病情讓他

  什麼都能忘，連自己最親愛的家人都逐漸從他腦海中消失，但音樂卻能讓他安定，甚至回

  到最原本的自己。電影當中收錄不少50、60年代的經典西洋老歌，它們確實都是從原型人

  物的專輯收錄曲裡選出，包括「Beyond the Sea」、「L.O.V.E」、「Quando Quando

  Quando」、「Volare」、「You Make Me Feel So Young」等等。伴隨著老爸的歌聲，這

  不只是一部劇情片，更是一部音樂電影。



  比較可惜的地方是，電影真正讓人鼻酸、催淚的地方要等到最後面，老爸確實忘記兒子之

  後，雄太才終於鼓起勇氣問自己在爸爸心中是什麼樣子。身為同志的兒子，其實早在老爸

  確診阿茲海默症的10年前就已經向父母出櫃，卻沒想到疾病讓他們必須再次經歷那段過往

  ，而老爸不穩定的情緒反應也讓雄太懷疑，或許自己從來都是爸爸的恥辱。甚至好不容易

  插畫生涯熬到一份大合約，卻由於酸民看完他為老爸拍攝的影片後認定他們採取賣慘行銷

  而化為泡影。就連小時候沒能學好吉他，都在雄太的心裡埋下一點疙瘩，但老爸其實一點

  都不在意，只因他從出生那一天起就一直是老爸的超級巨星，是為了他放棄夢想都不會有

  一點苦楚的寶貝。



  全文多次提到「原型人物」，究竟這位原型人物是誰呢？他是現年89歲，來自英國的泰德

  ‧麥德默（Ted McDermott），在2016年確診阿茲海默症。生病之後，本來極為和善的泰

  德性情大變，開始變得暴躁易怒，為了讓爸爸冷靜下來，兒子賽門就載他出門兜風，兩人

  便沿路一直唱歌，而有了後來的發展。泰德從16歲開始就是一名駐唱歌手，在他罹患阿茲

  海默症之後，於倫敦從事行銷的兒子毅然決然回鄉去陪伴他。雖說電影裡的雄太是插畫家

  ，但大致上還算是忠於原型。



  事實上，影片爆紅後，泰德不只出一張專輯，而是兩張，兒子賽門也在今年6月出版一本

  爸爸的傳記《The Songs That Saved Us：My Dad, Dementia and Me》。賽門5月上BBC晨

  間節目宣傳新書的時候分享，他不希望後人只記得爸爸是「在車上唱歌的失智老人」，因

  此他開始著手寫這本有關爸爸人生故事的書。賽門同時也告訴觀眾，他與家人目前應該正

  在經歷與爸爸的最後篇章，不過，他很高興能夠以這樣的方式陪伴爸爸人生的最後一程。



  如果大家看完《老爸歌單未完待續》，對原型人物泰德有興趣的話，不妨到他們的

  YouTube頻道TheSongaminuteMan去聽聽他美妙的歌聲。即便已經80歲高齡，他的歌聲還是

  渾厚有力、中氣十足，唱片公司找上他真的不是因為影片爆紅而已。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
