title: '[普雷]《老爸歌單未完待續》在一切遺忘之前'
content: '阿茲海默症後，留下的是音樂與羈絆


  人一生逃不過生老病死，有時候並不擔心死去或變老，是在這中間老齡到死亡間帶來的病

  痛襲來，讓家人的不便與無法自理，甚至可能耗費大量金錢。但有些病症可能不是外表可

  見，而是一點一滴的慢慢讓人消逝，甚至忘記周遭樣貌與分不清楚時間與人物。


  如家人之間有緊密連結，有時候被遺忘是一件痛苦之事，但也許還可以因為什麼，找到共

  同的記憶點，算是對於不可逆轉的病症之下，一些點點滴滴的安慰。


  改編真人真事，電影《老爸歌單未完待續》描繪雄太回到老家橫須賀市，發現喜歡唱歌、

  開樂器行的父親，罹患了阿茲海默症，正在一點一滴忘記他周遭的人事物，在思考如何減

  緩父親失憶症狀，雄太發現只要撥放父親喜歡的老歌，就會回到熟悉愛唱歌的父親。雄太

  決定串起父親記憶中的歌單，上傳到網路分享給大家，沒想到卻引來爆紅？







  《老爸歌單未完待續》是什麼電影？


  記不太起來、暫時失意，如果不是什麼喝酒喝到斷片，可能就是初老現象。在醫學上，人

  老了的確會想不起或記不住某些事情，因為身體機制正在老化，認知功能也會下滑，是屬

  正常現象。但如果無法回憶重要事情、甚至長期記憶喪失（忘記回家的路、無法辨認親人

  ）那就可能並不是老了記憶力不好，而是需要請醫生檢查的一種失智病症，早期治療可以

  延緩失智的速度，因為好發在老年，故如果延緩，反而可以讓老人家安穩度過老年，不會

  有太多因失憶的不變狀況。


  探討失憶症的電影有很多，2004年改編日劇的韓國電影《腦海中的橡皮擦》就以女主角逐

  漸喪失對周遭事物與人的記憶的催淚故事。2014年美國電影《依然愛麗絲》則是演出大學

  教授發現自己罹患阿茲海默症初期，在工作失落與家庭之間衝突逐步升溫的過程，電影對

  於患者心理和失憶的醫學描述相當精準。


  而在台灣2023年也有探討失憶的紀錄電影《邀阿公阿嬤拍B級殭屍片》，則一改痛苦與催

  淚，而是更普通的大家庭生活，大家以樂觀和堅強的方式看待阿嬤的失憶症，甚至提議要

  拍一部有趣又惡搞的電影，一改失憶症電影一慣憂傷的步調。







  《老爸歌單未完待續》雖然是以阿茲海默症為主要故事線，但電影主題所呈現的反而是父

  親與兒子之間的和解，和過往美好時刻有音樂的陪伴。回老家的雄太發現父親罹患失憶症

  ，許多時間記憶產生混亂，甚至不斷跟他確認那些他們渡過的重要時刻。


  雄太發現父親只有在唱歌和熟悉樂曲出現的時候，可以暫時陶醉在音樂之中，變回當下他

  認識的父親，父親唱歌的片段意外的在網路爆紅，但隨即而來的網路輿論、和父親失憶的

  雙重打擊，和心裡最想問父親的話語，是否父親還能回答？


  電影的真人真事但並不是日本當地的故事，而是改編英國2018年因爆紅而推出自傳書籍《

  The Songaminute Man》，駐唱歌手西蒙發現自己父親泰德因為罹患阿茲海默症而情緒低

  落，並逐漸忘記人事物，但發現唱喜歡的歌曲可以短暫讓父親快樂並找回自己，變回到老

  家照顧父親，並且父子唱歌的影片因網路瘋傳，還圓了父子的唱片夢。除此之外西蒙也積

  極替阿茲海默症協會募資，並且因為西蒙的影片，讓更多人認識阿茲海默症患者的身心狀

  況。










  《老爸歌單未完待續》分析與延伸：


  飾演罹患阿茲海默症的父親佐藤哲太的演員、歌手－寺尾聰，算是過去就有演過失憶角色

  的經驗。在2006年出演電影《博士熱愛的算式》中，就出現有記憶障礙的只能記憶80分鐘

  的數學家。在《老爸歌單未完待續》則是進一步要演出逐漸失憶失能的患者，會由寺尾聰

  飾演，我覺得導演可能考慮到他過去樂團身分、和演技，畢竟出演過《黑部的太陽》、《

  西部警察》都是日本昭和時代很具代表的電影、電視劇，也出演過名導黑澤明多部電影作

  品。1981年發行的單曲《紅寶石戒指》長年十週的日本公信榜冠軍，所以從綜合來說相當

  適合飾演，有歌手夢的佐藤哲太一角。


  在《老爸歌單未完待續》電影中除了有唱寺尾聰代表作《紅寶石戒指》一曲外，寺尾聰也

  跟製作單位共同尋找適合的英文曲目，雖然可以直接參考《只唱一分鐘的男人》自傳書籍

  裡的歌單，但是為了配合仍讓日本觀眾有印象的英文老歌，和適合寺尾聰演唱的歌曲，所

  以細心的選擇。


  故選擇以「橫須賀市」作為背景也有其原因，二戰結束後，美國海軍在橫須賀設立第七季

  艦隊基地，故這裡因為美軍進駐，而帶來了戰後的美式音樂（搖滾、藍調、爵士等），故

  作為與西洋樂有深厚牽絆的城市，可以讓角色演唱英文歌曲，更具有合理性。






  其中電影主角雄太父親的樂器行所設定的定點，就在美軍基地旁的ドブ板通り商店街，這

  是在橫須賀市很代表性的日式洋樂文化盛行的地點。從過去50年代到70年代，許多美軍酒

  吧、樂廳在這表演，也是早期日本搖滾樂的啟蒙地點之一。故可以說雖然參考的真人故事

  是「英國」，但整體而言《老爸歌單未完待續》呈現的卻是「美式」而非「英式」，並且

  從電影中也不難看出，演唱的裝扮風格到演唱方式，都是日式仿洋風格的美式文化，這是

  有趣的地方，也是對於英國故事的完全改編與原創之處。


  導演－小泉德宏，因為監製渡久地翔帶來《The Songaminute Man》這個故事，閱讀後產

  生感動，萌生想要拍攝這個故事的想法。主要想展現出「夢想、疾病、親情」三個重點要

  素，但因為是英國故事，跟日本的牽絆性有點低。


  故他想要重新發想出一個可以讓日本當地也能體會到這種父子間情感的故事，而下了很多

  功夫去內化從日本在地的故事內容，而如何能保留原作的精華之處、與做出日本在地化，

  考驗導演的功力。而《The Songaminute Man》中，西蒙和父親泰德唱歌的影片，現在還

  是可以在網路搜尋的到，有興趣的人也可以將電影重現和真實影片做一個有趣的對比。









  《老爸歌單未完待續》值得一看嗎？


  電影《老爸歌單未完待續》算是在同樣類型探討中老年失智、阿茲海默症來說，比較輕快

  一點故事。因為裡面有著大量音樂元素，所以讓整體故事連結不會陷入在憂鬱之中，但還

  是能感受到關於記憶與回憶逐漸流失的感覺。整體來說我覺得導演想在電影呈現的感覺並

  不只有悲傷與感動，也想要呈現音樂輕快跟到老都追逐著夢想的權利。也跟加深比較日式

  和亞洲人父子之間，那有點距離，卻又彼此關心的拿捏不了距離感的父子關係。


  小泉德宏導演過去的作品《太陽之歌》其實有與《老爸歌單未完待續》同樣的故事設計元

  素，同樣都是以「音樂」和「疾病」為主軸構成的故事架構，只是這次《老爸歌單未完待

  續》在雄太與父親之間，多了近幾年來日本開始備受討論的關於身分與性向認同問題。


  這是與原作《The Songaminute Man》和《太陽之歌》很不一樣，也是電影裡相對原創的

  父子關係和心裡無法訴說的秘密。《老爸歌單未完待續》中雄太多年袒露秘密、在直到父

  親生病之後，他也才了解父親那一直有著星夢的年少憧憬。









  故我認為《老爸歌單未完待續》電影本質其實不是想呈現失去記憶與回憶的悲傷，而是想

  透過音樂還可以微微的將父子美好的記憶烙印在腦海中，並且努力達成和朝夢想前進的影

  子。


  雖然在情感與音樂呈現上相當出色，但在整體電影對於阿茲海默症、失憶症的表現上，對

  比其他電影，《老爸歌單未完待續》將病症戲劇化，最大的就在於真實的狀況下，音樂其

  實並不能與患者有那麼細緻的情感流動，還有與兒子的情感交流，故在真實病症與父子物

  語，導演選擇能感動人心的後者。


  不過《老爸歌單未完待續》在情感劇本的安排上，是屬於近幾年節奏和故事都推進不太過

  拖延的日本電影，以電影故事的角度，我覺得是很不錯的親情與自我認同電影。但如果要

  以描繪失智症真實又感人的電影，我自己首選還是台灣紀錄片《邀阿公阿嬤拍B級殭屍片

  》，其中我喜歡在即便不刻意渲染情感，還是可以感動人心，在加上電影裡單純的呈現最

  真實失智症患者的狀況，但同時又有著笑中帶淚的元素，也許《邀阿公阿嬤拍B級殭屍片

  》比《老爸歌單未完待續》的差距就差在於，我是台灣人較能喜歡台灣故事給我的真實感

  ，比起英文歌曲還要讓我共鳴吧？




