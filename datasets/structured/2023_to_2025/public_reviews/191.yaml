title: '[新聞] 松坂桃李拍【老爸歌單未完待續】情緒潰堤'
content: '新聞網址：



  取材令人動容的真人真事，透過音樂為橋樑，細膩描繪阿茲海默症與父子親情羈絆的感人

  新片《老爸歌單未完待續》，即將在本週五（8/8）父親節於全台感動獻映。本片請到「

  日本雙影帝」松坂桃李與寺尾聰領銜主演，詮釋在音樂陪伴下，一對逐漸找回記憶與溫暖

  的父子。尤其現實生活中，松坂桃李才在2023年升格為人父，坦言對家庭有了新的體會。

  他希望孩子可以從自己的作品中有所收穫，也認為自己將面臨與片中相同的議題，因此決

  定參與演出，成為本片最早確定演出的演員。而這也是他跟日本傳奇巨星寺尾聰，時隔12

  年後再度共演，彼此對於能再合作都相當興奮，寺尾聰更直言是他的粉絲，甚至每週收看

  他所主演的電視劇。當兩人演出電影尾聲的高潮戲時，動人的劇情與情感湧現，讓松坂桃

  李一度情緒潰堤，並激動表示：「我從事表演工作已經有15、16年左右，但這還是我人生

  中第一次情緒如此洶湧。」兩位實力派演員真摯互動，為電影增添溫度與力量，也讓本片

  在日本上映後，獲得大批觀眾好評淚推，堪稱今年最溫柔卻又最直擊人心的年度親情鉅作

  ！





  《老爸歌單未完待續》由「日本奧斯卡雙影帝」松坂桃李與寺尾聰，共演動人父子情！導

  演小泉德宏希望飾演照顧失智症父親的兒子，能由即使不用言語，也能傳遞情感的演員來

  詮釋，導演表示：「我認為一直以來都非常謙虛、對任何人都非常溫柔的桃李先生，一定

  可以演繹那種『嘴上抱怨，內心卻相當關愛父親』的層次感。」因此向他提出演出邀約。

  尤其在2023年與妻子迎來第一個孩子的松坂桃李，自從成為父親後，在劇本的挑選上也有

  了不同想法：「我愈來愈希望，將來我的孩子看我演出的作品時，能覺得『看這部作品真

  是太好了』。」在讀過本片劇本後，他認為自己在未來，也可能面臨到片中要探討的父子

  情與阿茲海默症等議題，他並表示：「這是每個人都可能經歷的事，也因為這樣，我在讀

  完劇本後強烈感受到『非做不可，我一定要參與！』」



  本片也是他與日本傳奇影歌雙棲巨星寺尾聰，時隔12年再度共演。由於先前的合作非常短

  暫，雙方都期待能有機會再度共演，松坂桃李表示：「我當時就希望有朝一日能和寺尾先

  生再度合作，為此我也努力了很久，這次終於實現願望。」他並補充：「能飾演寺尾先生

  的兒子，對我來說是一種驕傲。如果是其他人演的話，我想我一定會覺得很不甘心。」寺

  尾聰也直言自己是松坂桃李的粉絲：「我每週都追桃李演的電視劇，看他身上逐漸累積愈

  來愈有魅力的感覺，真是讓人開心！接下來，也許我可能沒有機會再和他合作，但我也會

  一直在遠處關注他的。」他甚至直言松坂桃李將會成為能夠繼續保持巔峰狀態的演員。





  在譜出記憶中最溫暖羈絆的《老爸歌單未完待續》當中，接近尾聲的一場高潮戲，也是松

  坂桃李與寺尾聰的最後一場對戲，父子之間的動人劇情，以及到達高峰的豐沛情感，讓松

  坂桃李在拍攝時一度情緒潰堤、哭到停不下來，他回憶：「我從事表演已經有15、16年左

  右了，但這還是我人生中第一次情緒如此洶湧。這種情緒是被寺尾先生引導出來的，當下

  甚至有種超越『演戲』的感覺，那一刻流動的是一段無法言喻的時間。」值得一提的是，

  本片在日本上映後，也感動無數觀眾，讓大家淚灑影廳，並真情推薦：「松坂桃李的眼淚

  也讓我淚流滿面！」「所有演員演技精湛，讓人共鳴！」「完全觸動我的心！」「至今仍

  沉浸在那份餘韻當中！」


  這部齊聚日本奧斯卡得主，共同打造年度最暖心、最催淚的感動鉅獻《老爸歌單未完

  待續》，即將在本週五（8/8）父親節於全台感動獻映。本片劇情描述年輕時懷抱歌手夢的哲

  太（寺尾聰飾演），為了家庭與兒子雄太（松坂桃李飾演），選擇放下夢想，在橫須賀經

  營樂器行，並偶爾登台一展歌喉，過過歌癮。他樂觀幽默、熱愛音樂，是街坊鄰里最熟悉

  也最受喜愛的存在。然而某天開始，哲太開始頻頻忘記事情，從小事錯亂到回不了家，最

  終被診斷罹患阿茲海默症。當記憶如潮水般退去，他甚至連摯愛的家人也逐漸陌生。然而

  不曾褪色的，是他對音樂的熱愛。每當唱起最愛的老歌，哲太彷彿又變回那個神采飛揚的

  父親，短暫回到雄太眼前。看著父親與病魔對抗的身影，雄太決定用音樂守護父親的笑容

  與尊嚴。那些一唱再唱的旋律，不僅成為父子倆穿越記憶迷霧的橋樑，也讓哲太年輕時未

  竟的夢想，在人生暮年悄然綻放…。一段關於親情、記憶與旋律的動人旅程，即將溫暖開

  唱。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
