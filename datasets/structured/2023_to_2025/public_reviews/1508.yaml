url: https://www.ptt.cc/bbs/movie/M.1540393380.A.B28.html
title: '[新聞] 金馬影展致敬高畑勲　李安出席《冰風暴》'
content: '金馬影展致敬高畑勲　李安出席《冰風暴》座談



  2018金馬影展即將在11月8日展開，本屆金馬影展特別規劃專題致敬今年逝世的日本動畫

  大師高畑勲，大銀幕重溫他在吉卜力工作室完成的經典動畫《兒時的點點滴滴》（1991）

  、《平成狸合戰》（1994）、《隔壁的山田君》（1999）、《輝耀姬物語》（2013），以

  及難得一見的紀錄片《柳川堀割物語》（1987），而高畑勲的《螢火蟲之墓》（1988）和

  宮崎駿的《龍貓》（1988）30年前在日本聯袂上映的盛況也將在台北重現。除此之外，更

  邀請到參與吉卜力工作室製作超過20年的野中晉輔，暢談高畑勲的創作生涯與吉卜力的點

  點滴滴。另一位焦點影人奧斯卡最佳配樂麥可唐納單元，則將加映《冰風暴》（The Ice

  Storm, 1997），本屆金馬影展主席李安也會出席映後座談。


  高畑勲是吉卜力工作室的創辦人之一，與宮崎駿亦師亦友。今年適逢兩人的代表作《螢火

  蟲之墓》和《龍貓》上映30周年紀念，金馬影展將在11月10日與Skyline Film合作，在西

  門町電影主題公園舉辦戶外放映，重現當年兩部動畫在日本連映的獨特經驗。而這次金馬

  影展還會選映描述女性上班族因一場農家體驗而憶起童年往事，卻從其間找到未來的《兒

  時的點點滴滴》；結合狸貓傳說及環保議題，贏得安錫動畫影展最佳動畫長片的《平成狸

  合戰》；以淡雅簡潔的速寫美學，勾勒日本家庭溫暖日常的《隔壁的山田君》；取材經典

  文學〈竹取物語〉、久石讓擔任配樂的《輝耀姬物語》，更是高畑勲集大成之作，獲得奧

  斯卡金像獎最佳動畫長片提名。而他唯一執導的紀錄片《柳川堀割物語》，細膩呈現日本

  運河小城的百年經歷，更是難得一見。


  今年的戶外特別放映活動，除了連映《螢火蟲之墓》和《龍貓》，還有李安與本屆焦點影

  人麥可唐納一起獲得奧斯卡的作品《少年PI的奇幻漂流》，也會在11月11日舉行，歡迎大

  小影迷一起來共襄盛舉。李安特別鍾情他與麥可唐納首度合作的《冰風暴》，金馬影展為

  此展開拷貝大搜索，終於從法國調到35mm拷貝，李安也允諾出席11月16日的映後座談，和

  觀眾分享兩人的合作趣事。金馬官網售票系統將於本周日（10/28）開賣。



  （楊絲貽／台北報導）







  --'
