url: https://www.ptt.cc/bbs/movie/M.1518407863.A.03E.html
title: '[好雷] 格雷的五十道陰影:自由-解開陰影束縛的自由'
content: "部落格圖文完整版↓\n\n\n\n---------\n\n身為系列小說與電影的書迷/影迷，看完這部電影後，內心並沒有\n熱血沸騰的感覺；心裡反而有種失落感，有點捨不得與這三部曲電影道別，畢竟從小說的\n\
  出版到全部翻拍成電影上映經過了大約7年的時間(時光荏苒~)\n\n\n(既然我是書迷/影迷，心得難免帶點迷妹濾鏡啦)\n看完《格雷的五十道陰影:自由》電影版後，因為以下幾點原因，我還是會給好雷:\n\
  \n\n\n小說跟電影版第三集的重點就是克里斯欽與安娜婚後的生活以及前上司杰克‧海德的報復\n。\n婚後生活(尤其是蜜月部分)高度還原，一開頭就讓觀眾大飽眼福，一起跟著主角們遊歷巴\n\
  黎、尼斯等地的良辰美景。\n\n我最喜歡的一幕就是主角兩人在巴黎騎腳踏車的這一幕，而這一幕也是整個系列電影的最\n後一顆鏡頭(如下圖)。\n\n(圖片來源: IG-fiftyshadesmovie的限時動態)\n\
  \n話說看一些報導跟綜藝秀才知道拍度蜜月戲份的時候其實並不浪漫。\n在尼斯拍攝時遇到恐攻；\n然後Jamie Dornan在拍攝從海裡走上沙灘戲份時得故作鎮定，因為腳下的沙灘不是細沙，\n\
  是小圓石灘，所以要像詹姆士龐德般性感的走出海水頗辛苦啊~然而下圖這一幕在正片被\n剪了，只有預告才有。\n\n\n與前兩集相比，第三集的正片時長是最短的一集，所以還是會給觀眾換場過快的感覺。但\n\
  小說的重點都有抓到。電影情節大致上都照著小說的內容進行著，有大更動的情節就是安\n娜得知自己懷孕的過程。我覺得兩人爭執懷孕跟伊蓮娜的這一part改編的還不錯，因為兩\n\
  人的應對比較像是了(小說這段安娜更衣時還故意慢條斯理地色誘克里斯欽來反\n擊...其實有點不合理啦，當你氣頭上的時候應該不會想到這一招吧?)\n\n\np.s.\
  \ 正片把預告中金．貝辛格拉開門的一幕，還有男主角在酒吧揍人的一幕都被剪了，\n但並不妨礙劇情的推進。或許之後出未刪減版影碟時會再放進去吧?\n\n另外本片的新登場角色-Sawyer索耶(安娜的保鑣)，由Brant\
  \ Daugherty飾演，不言可喻地\n長得很帥，也是本片的新看點之一↓\n\n(圖片來源:\n\n雖然《格雷》系列電影的評價有褒有貶，但是對於電影原聲帶的評價，各方幾乎都是給予\n\
  正評。一如前兩集電影原聲帶的水準，《自由》的電影原聲帶依舊很幫襯電影劇情。第三\n集的原聲帶收錄了多達22首歌，聽過一輪後，讓我印象深刻的歌曲有以下幾首:\n\n\
  -\"Capital Letters\"\n\n(Hailee在MV中超~美~)\n\n這首歌由Hailee Steinfeld和BloodPop®合作演唱。就像MV劇情一樣，放在主角兩人婚宴\n\
  開舞與度蜜月的片段。\n\n-\"The Wolf\"\n\n這首放在安娜開奧迪R8飆車的地方，很有\"速度與激情\"。\n這首歌也很有趣，歌曲中混一些狼的垂涎與嗥吠聲。\n\
  \n-\"Never Tear Us Apart\"\n\n原曲是INXS演唱的，由Bishop Briggs翻唱的很氣勢磅礡，所以這首放在主角兩人感情/肢\n\
  體強烈到快窒息的情節很搭襯。而且鋼琴和絃有幾分神似碧昂絲的\"Crazy in Love\"\n\n-\"Maybe I’m Amazed\"\n格雷總裁開金口唱的歌，原曲是由保羅．麥卡尼所演唱的。Jamie\
  \ Dornan不愧是以前有在\n玩樂團(Sons Of Jim)的，這首歌唱得還不錯。可惜這首歌並沒有出完整版~\n\n-\n大推這首歌！推薦到甚至可以只為了這首歌就去看《自由》...\
  \ XDD。\n雖然\"LMLYD\"在第一集就公布了，但綿羊姊的這首歌有稍加改編，而且下在很動人的片段\n。聽完+看完電影的這個片段真的很有感觸啊，整個雞皮疙瘩都起來了！也就是因為這首\n\
  歌，所以看完電影才會有股失落感。\n\n第一集版本的\"LMLYD\"↓\n\n\n\n第一集中，Jamie Dornan和Dakota Johnson可能因為還不熟悉彼此，所以演起來會有點放\n\
  不開。但隨著兩人之後的續約合作，以及在《格雷》系列電影外的其他電影作品歷練使兩\n人在戲中的演技更顯自然。也如同兩人在採訪中所說，兩人在這三部曲中有的情誼，所以雖然Jamie有家室了，達妞現在也有男友了，第三集中兩人的交流其實滿\n\
  有火花跟默契的。\n\n在劇中格雷甚至還調侃地說:「妳(安娜)比那些保鑣還可怕」\n\n (圖片來源:\n\n另外，這集的激情場景較前兩集少，不曉得是有拍好，但礙於時長而剪去?還是就沒拍了?\n\
  我是覺得除了那些玩具會嚇壞小孩之外，第三集其實沒必要劃為限制級的。\n而本片本來就不是A片(也或許還是得顧慮到家庭吧?!)，Jamie還是沒有正面全露...\n\
  \n\n\n這集的題名既然叫《自由》，代表格雷充滿陰影的過去徹底揭露，能夠拋開「束縛」，迎\n向「自由」。然而電影版對於“陰影”的交代不如小說充足，所以還是讓沒讀過原著的觀\n\
  眾不明白格雷的陰影何在?可是兩位導演-Sam Taylor-Johnson & James Foley有掌握角色\n性格與心理的轉變。\n\n格雷他不再那麼「拜倫式英雄」了，以前的他性格晦暗，對自己嚴厲，對外人總是疏離。\n\
  對於無力改變的\"過去\"使他用冷峻的言行來隱藏他的內心世界。幸好遇見了安娜，在陰影\n中投入一線曙光，逐漸嶄露自己其實還是有「凡人」的一面，有靈魂/有情愛與嫉妒心。\n\
  \n安娜的心境轉折則是越變越堅強，不再只是臣服者，而是能平等地與之共進退的伴侶。她\n也從怯弱的女大生蛻變為有主見的女人(雖然有控制慾的格雷偶爾會因為那些\"\
  主見\"感到\n挫敗XD)導演最後的recap除了向第一集致敬(?)外，也為整個故事畫下一個完美的句點。\n期待之後出未刪減版，看導演會不會放出什麼福利片段。\n\
  \n\nP.S. 下面這段今年Jamie Dornan上James Corden的《深夜秀》宣傳的綜藝片段超爆笑!\n重點除了惡搞電影\"紅色刑房\"的橋段，還有他們竟然很認真地演完了~\n\
  \n\n\n以上心得完畢，感謝大家閱讀~~~\n\n-------\n\n--"
