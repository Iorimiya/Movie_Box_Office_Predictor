url: https://www.ptt.cc/bbs/movie/M.1663087015.A.629.html
title: '[情報] 2023 奧地利奧斯卡代表：《束縛》'
content: '奧地利甫公布了將提交明年奧斯卡「最佳國際影片」的作品，將以《束縛》（Corsage）作

  為代表。




  《束縛》為《迷走蘿拉》和《我的嬉皮老爸》的奧地利女導演 Marie Kreutzer 的最新作

  品，今年在坎城影展的「一種注目單元」首映後大獲好評，最終讓主演的 Vicky Krieps

  拿下了「最佳演出獎」。


  《束縛》為「茜茜公主」奧地利的伊麗莎白的傳記電影。劇情聚焦在 1877 年度過 40 歲

  生日的伊麗莎白開始反叛過往的公眾形象。對於知識的渴望以及生活的熱情讓他無法繼續

  待在維也納。伊麗莎白前往英格蘭及巴伐利亞，造訪他的舊情人和老友，尋找他年輕時的

  悸動與目標。




  《束縛》甫於多倫多影展中放映，接續會在聖塞巴斯蒂安及倫敦影展中展映。值得一提的

  是，女主角 Vicky Krieps 以該片成為今年坎城影展的話題人物，更被外界看好有望角逐

  明年的奧斯卡影后寶座。該片在美國已經由 IFC Films 買下版權，預計在 12 月底正式上

  映。


  這是導演 Marie Kreutzer 首次代表奧地利征戰奧斯卡。奧地利在這十多年間表現亮眼，

  曾以《偽鈔風暴》和《愛‧慕》抱回兩座小金人，今年初則以《愛你讓我自由》闖進 15

  強短名單中。


  《束縛》台灣已由好威影業代理，預計 2023 年上映。



  --'
