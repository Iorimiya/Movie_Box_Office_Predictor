title: '[影評] 復仇者聯盟2-毫無束縛失控？還是自由？ '
content: '網頁版文章：


  幕迷影評：

  XXY視覺動物的電影觀點：






  復仇者聯盟2：奧創紀元（Avengers: Age of Ultron）


  毫無束縛的失控？還是自由奔放？


  by XXY



  遙想2012年【復仇者聯盟】上映後的心情，可說是看見了充滿野心的漫威公司一步步搭起


  了他電影世界的宇宙觀。在第一階段我們可以看見自【鋼鐵人】開始，清楚交代了每位英


  雄人物的來歷，以及誕生的過程，搭配了現實世界間的穿鑿附會與虛構漫畫事件的故事，


  建構出一個屬於漫威電影的宇宙觀。每部電影以幽默有趣的輕鬆風格為基調，描述了這些


  迷人漫畫人物，透過「電影」這樣的媒介，向原本不是漫畫迷的電影觀眾也能進入漫威的


  漫畫王國；同樣的，原本死忠的漫畫迷，也就更加瘋狂這一系列的故事。




  個人認為，漫威漫畫改編電影的成功關鍵，在於這些人物的塑造、選角以及劇本主題性相


  當穩固，透過與現實世界的結合，並非以往過去漫畫風格強烈或是虛幻的電影作品，反而


  更加平易近人。如【鋼鐵人】中，透過美國與中東的反恐戰爭為出發點，我們看到故事主


  角東尼史塔克如何從軍火販子轉變成為維護正義的鋼鐵人；【無敵浩克】中，我們看到因


  生化實驗失敗的布魯斯班納自我放逐到中南美洲，並在貧民窟中掙扎的過程；【美國隊長


  】中，我們看到在二次世界大戰，渴望為國奉獻的年輕人史蒂夫羅傑，如何成為帶領祖國


  戰勝納粹的美國隊長；到【雷神索爾】，我們可以跳脫地球以外，認識了更不一樣的視野


  。總總一步步架構思維清晰的電影作品，造就了【復仇者聯盟】眾多英雄人物及合成的偉


  大作品。




  然而，進入後【復仇者聯盟】的作品，每部續集電影轉而探討每位超級英雄的內心黑暗面


  ，並揭露了在【復仇者聯盟】系列電影的宇宙觀面臨的危機與總總考驗。逐步加疊的漫畫


  元素，讓電影不再只是單純的「介紹英雄」，轉而開始「運用英雄」。在【復仇者聯盟】


  後的幾部作品，我們不再期待看到每位超級英雄的由來，反而期待看到電影帶給我們什麼


  不一樣的感官享受與娛樂的刺激。在【復仇者聯盟2：奧創紀元】中，雖然娛樂性依舊、


  超級英雄們的丰采依舊、漫威漫畫的基調依舊、故事精采性也依舊，但就是為什麼造成了


  非常兩極化的觀眾評價？我想這是非常值得探討的有趣議題。




  第一，自【雷神索爾】後，觀眾開始被灌輸了【雷神索爾】以前的地球，認為沒有外星人


  的世界已被打破。我們開始知道，在漫威所構築的世界是已經知道有外星人存在的。到【


  復仇者聯盟】中的紐約之戰、【雷神索爾2：黑暗世界】中的格林威治戰役，再到【星際


  異攻隊】中的外星戰場。劇情中我們慢慢發現，電影開始塞入我們認知外的專有名詞。而


  一貫快節奏的電影劇情，每件事情交代的時間有限，一閃而過，成為漫畫迷口中的彩蛋片


  段。而這些稍縱即逝的彩蛋，若非漫畫迷便無法感受到興奮，但不失觀影的整體性，這種


  潛移默化的種種小關鍵，積少成多的結果，導致了【復仇者聯盟2：奧創紀元】需要交代


  的事情猶如爆炸性的強制塞入觀眾腦袋，造成劇情深度不足，在角色間的對話快速且不深


  刻，成為【復仇者聯盟2：奧創紀元】在劇本上的致命傷。




  第二，在【復仇者聯盟2：奧創紀元】中的反派角色，並非以往過去幾部電影作品的反派


  塑造深刻。同樣快節奏的劇情交代，搭配光彩奪目的視覺效果，讓


  「奧創」的誕生成為過於虛幻不切實際，使觀眾感到的威脅性較低，使得正邪雙方的對立


  、差異性不足而失焦。回顧【復仇者聯盟2：奧創紀元】前的漫威電影作品，令人印象最


  深刻的莫過於由湯姆希德勒斯頓所飾演的洛基；另外如雨果威明所飾演的紅骷顱、傑夫布


  里吉所飾演的Iron Monger、米基洛克所飾演的甩鞭、班金斯利所飾演的滿大人等等，相


  信經由這些資深演員的演出，反派角色讓人印象深刻。而在【復仇者聯盟2：奧創紀元】


  中的主要反派奧創，使用動態捕捉的CG呈現，缺乏生動的表情與其為何毀滅人類的理由過


  於生硬且遷強，導致劇情張力不足，實為可惜。




  第三，新角色的琢磨不足，導致角色的平衡失真，如快銀、緋紅女巫與幻視三角色，難以


  利用將近兩小時半的電影時間裡加以琢磨，使得原本可以發揮的劇情空間明顯不足，只能


  說可惜了這些漫畫角色。





  第四，在【復仇者聯盟】後的漫威系列電影，風格轉為較為黑暗的探討英雄人心，在【復


  仇者聯盟2：奧創紀元】中似乎也想延續這樣的風格基調。但在對白的安排，以及每位角


  色的台詞個性上卻一貫保有嘴砲或者輕鬆幽默的調調。使得電影整體性不足，讓人摸不著


  頭緒。幾個刻意營造笑點的橋段，如美國隊長警告不准說髒話，雖然旨在緊張的戰鬥中製


  造輕鬆有趣的氣氛，但無法和快節奏的畫面產生共鳴，而讓劇情繼續快速演進，讓觀眾的


  思緒馬上又中斷。使得電影在畫面營造上相當豐富，劇情對白上也算輕鬆有趣，但觀眾的


  思緒無法連續，導致整體性不足。




  【復仇者聯盟2：奧創紀元】絕對比首集【復仇者聯盟】更加具有野心，但過多的角色、


  對話、宇宙觀、埋梗，想在兩小時半的電影中塞入太多漫威想講的元素。導致主體性不足


  、劇情失焦、劇本深度不足。正如同【復仇者聯盟2：奧創紀元】電影預告片中，不斷強


  調反派奧創猶如迪士尼動畫中的小木偶，沒有牽繩的束縛（No string on me），可以為


  所欲為。【復仇者聯盟2：奧創紀元】宛如脫韁的野馬，在劇本上可以自由發揮卻完全不


  顧及到一般觀眾的心情，塞入太多漫畫梗導致非漫畫迷觀眾在觀賞電影時不知所云，也無


  法體會到興奮又令人驚豔的驚喜感。我想，【復仇者聯盟2：奧創紀元】的創作，可說是


  漫威電影毫無束縛的發展，是自由奔放的作為？還是失控的開端？漫威電影製作團隊，可


  說是需要好好冷靜思考，並安排後續故事的發展才是。





  然而，就個人而言，觀賞【復仇者聯盟2：奧創紀元】的過程以及觀後，事實上是相當興


  奮又感動！原因就在於我就是個死忠的漫畫迷！除了看到原本只在漫畫書中英雄角色，活


  靈活現地在銀幕前呈現；重要的是，【復仇者聯盟2：奧創紀元】這部電影作品，對我而


  言並非只是單獨的電影，而是整個漫威電影的一個環節。個人將【復仇者聯盟2：奧創紀


  元】當作承先啟後的重要關鍵轉折，並與過去【星際異攻隊】、【雷神索爾】、【美國隊


  長2：酷寒戰士】的關鍵彩蛋做成完整連結，當電影結束，反而是更加對漫威所構築的宇


  宙觀著迷，同時也期待著接下來漫威所推出的【蟻人】、【美國隊長3：英雄內戰】、【


  史傳奇博士】以及後續的【復仇者聯盟3：無限戰爭】上下兩集。




  回顧【復仇者聯盟】系列電影，漫威從【鋼鐵人】電影開始，便開始慢慢從非漫畫迷的觀


  眾群，培養了自己屬於漫威的漫畫迷。有人因為電影開始認識漫威漫畫，開始認識這些超


  級英雄；也有人因為漫畫而開始喜歡上看電影。美漫教父史丹李曾說：「電影，絕對是推


  廣漫畫最好的媒體。」正由於電影將這些漫畫角色立體鮮明化，透過演員的詮釋，我們看


  到這些英雄人物形象深植觀眾的心中。正如同現在許多觀眾看到小勞勃道尼，第一印象就


  是扮演鋼鐵人的東尼史塔克。在【復仇者聯盟2：奧創紀元】中，我看到的是這些演員熱


  愛自己所扮演的漫畫人物，並且享受其中，將歡樂帶給喜愛看漫畫、對漫畫充滿熱忱的人


  們。




  整體而言，【復仇者聯盟2：奧創紀元】這部電影是百分之百的商業娛樂片，電影的劇情


  淺而易懂，緊湊且毫無冷場的豐富精采，但卻少了點讓一般非漫畫迷觀眾驚豔的成分。而


  透過【復仇者聯盟2：奧創紀元】，我們看見漫威公司的商業操作，猶如商業財閥般的大


  軍壓境，從電影宣傳、周邊商品、玩具等等，炒熱了這股超級英雄風潮。回過頭來，檢視


  【復仇者聯盟2：奧創紀元】這部電影的本質，導演喬斯溫登完成了漫威公司所交代的階


  段性任務，且成功建構了【復仇者聯盟】系列電影的世界舞台。漫威似乎不再在意那群一


  般電影觀眾，反而將更多驚喜、驚奇與讓人著迷的漫畫元素，投資在死忠漫畫迷身上。我


  想這是漫威公司未來在觀眾群的取捨天平上，需要做好的拿捏，免得兩頭盡失。







  故事劇情：


  【復仇者聯盟2：奧創紀元】的劇情相當直觀且淺而易懂，當中透過緋紅女巫揭露各個英


  雄的黑暗面過程，也看得出電影希望塑造黑暗風格的野心。但過多的漫畫元素與角色故事


  ，造成劇本編排上的失焦，成為【復仇者聯盟2：奧創紀元】的最大致命傷。電影深度不


  足，雜亂又快速的編排、造成整體性不佳的結果，讓【復仇者聯盟2：奧創紀元】僅能算


  是漫威電影世界的其中一小塊拼圖，而非需要大力捧紅的世紀鉅作，讓不少期待看到2012


  年【復仇者聯盟】品質的觀眾失望。個人認為相當可惜。然而【復仇者聯盟2：奧創紀元


  】中的鋪梗相當多，作為死忠的漫威漫畫迷而言，可期待接下來更多英雄個人電影的發展


  。（6.5 / 10）




  影像美學：


  【復仇者聯盟2：奧創紀元】一如後【復仇者聯盟】階段，使用較為偏灰暗的色調。鮮艷


  而華麗的畫面營造，當中許多刻意將每位復仇者成員入鏡的鏡頭，可說是電影製作團隊讓


  觀眾震撼又熱血的地方。在畫面上，【復仇者聯盟2：奧創紀元】絕對是非常精彩，且是


  最大的觀影重點。（7.8 / 10）





  電影配樂：


  擔任【復仇者聯盟2：奧創紀元】配樂的布萊恩泰勒，在後【復仇者聯盟】階段也配樂了


  眾多漫威英雄電影，諸如【鋼鐵人3】、【雷神索爾2：黑暗世界】，在【復仇者聯盟2：


  奧創紀元】中也可以聽見過去作品的熟悉旋律，算是串連了漫威電影世界觀的重要環節。


  而與其合作的丹尼葉夫曼也讓漫威電影配樂提升了另一個層次，兩人多元化的樂曲製作，


  在氣氛營造上加分不少。而在許多動作場景上也有相當出色的表現。在本次【復仇者聯盟


  2：奧創紀元】中，使用大量的低沉氣氛的樂曲，製造迷幻又暈眩感，是個人認為相當精


  彩的地方。（7.9 / 10）





  視覺特效：


  【復仇者聯盟2：奧創紀元】中，大量的視覺特效，以及動態捕捉技術，絕對是電影觀賞


  的一大重點！透過毫無冷場的戰鬥場景，一幕幕精彩的打鬥，電影製作團隊在視覺效果上


  的營造，可說是下了不少功夫。（8.5 / 10）





  觀眾取向：（不計分）


  喜愛漫威系列的死忠漫畫迷、喜愛復仇者聯盟英雄人物的觀眾、喜愛【復仇者聯盟2：奧


  創紀元】中演出演員的觀眾、喜愛特效電影的觀眾





  個人總評：7.7 / 10




  電影預告片：






  內容版權所有，轉載前請先告知作者

