url: https://www.ptt.cc/bbs/movie/M.1537095639.A.EC1.html
title: '[負雷]《藍色項圈》教育體制的束縛'
content: '~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  1.影片名稱 : 藍色項圈


  2.觀影時間 : 4/27


  3.觀影地點 : 信義威秀


  4.觀影方式 : 試映



  痞客邦圖文版：




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  《藍色項圈》是一部台灣校園恐怖電影，由張訓瑋執導，改編自同名短篇小說，講述一位


  剛轉入愛迪生中學的中學生葉群，不僅馬上經歷校園內學生彼此互相競爭的壓力，更無意


  間發覺宿舍某間房間暗藏著詭異氛圍，儘管他不斷努力要改變學生學習現況，但沒想到卻


  因此被關注而惹禍上身。




  電影題材還算是新穎，有別於一般純愛的校園劇，《藍色項圈》結合教育題材與校園鬼怪


  故事，雖然以帶有奇幻驚悚元素的恐怖片來包裝，但內裡仍舊寫實地是呈現出教育體制僵


  化的可怕，其中對於台灣成績至上的教育方式有很深刻的描述，相信經歷過寄宿或晚自習


  學校的觀眾都能有所共鳴。




  然而縱使議題十分強烈，不過《藍色項圈》呈現結果如何又是另一回事，雖然距離觀賞日


  期已經過了將近5個月，關於劇情也已經完全淡忘，但我依然清楚記得當時看完電影所感


  到的無奈。不光是片中有如萬花筒的隧道、神秘房間內藏有攝影機等許多莫名其妙的橋段


  ，鬼片驚悚氣氛的呈現也顯得有些隔靴搔癢，反而因此使高壓寄宿學校的議題有點失焦。


  就我而言，個人非常不喜歡這種在電影前段故布疑陣，但收尾卻無法自圓其說的說故事方


  式，原本有些懸疑的故事最後反而用老妖陰謀論來解決實在讓人難以接受。




  另外，我覺得《藍色項圈》片名中藍色所代表的意義其實也挺有趣的，如果說是要以綁住


  學生未來的項圈，來跟愛迪生中學崇尚「藍色代表自由」做對比反差，是不是也可以用其


  他顏色替換？比方說是我的話，就拍一部「紅色項圈」，把紅色代表熱情作為學校的代表


  色，從中暗指因為繩索纏住脖子而產生的「紅腫」，學生因為錯誤的教育體制使本該代表


  熱情的紅色變為學生脖子上的「束縛」，這樣是不是也能通呢？




  總而言之，《藍色項圈》的鬼怪方面可以說是徹底失敗，打著暗黑版《模範生》的宣傳真


  是不知所以。相比之下，電影呈現的教育議題就精彩許多，而且除了幾位年輕演員的生澀


  演技無處不讓人感到尷尬之外，片中校長、舍監與女老師都相當有特色，尤其是謝欣穎表


  現出內心掙扎更讓人深刻體會不得不順從的無奈。究竟面對困難你會選擇突破，或者為了


  自身利益與體制同流合汙；還有我們值不值得為了提高那點分數，而失去人生的那些快樂


  ，是《藍色項圈》對觀眾丟出的兩個最重要的問題。



  --


  歡迎追蹤我的FB或IG專頁




  --

  想請問是什麼樣的誤會法？'
