title: '[負雷] 格雷的五十道陰影-束縛'
content: '先講對各種族群說的摘要


  給懷著少女情懷的女性們： 建議妳們去看總裁系列，情節差不多的。


  給被強迫去看的男性們： 建議你們可以在sex片段當A片認真看就好，其他地方閉目養神。


  給本來就想當A片看的男性們： 介紹你們個網站，javlibrary不錯，不用謝我。


  給不小心走錯片場的人： 建議你們放寬心，就當作幾百塊掉到水溝裡可能會好過點。










  -----防雷+吐槽分隔線-----


  我們最性感、有錢、專情、浪漫的格雷又回來啦～～


  既上集滿滿的"我有過去我最慘"之後，這集格雷先生洗心革面準備做理想情人


  集性感、帥氣、多金、霸氣、貼心於一身，還要改掉SM的壞習慣，


  立定目標要擄獲少女的心。


  一開始格雷就灑手一揮送女主角24K美金，後來女主角拿去慈善晚會買了渡假券


  格雷：那是我送你的$$  @@


  女：幫你作善事大家都開心阿～  （開心個屁，又不是花妳的錢！）




  再來大手一揮買下了女主角所在的公司


  女：我喜歡我的工作，請你別干涉！


  後來女主角被主管性騷擾...


  女：格雷QQ救人家  T______________T


  格雷：OK，他被炒了，換妳當主管


  女：人家是靠自己三個月就當主管的悠～～（大心）




  參加生日趴梯的時候


  女：人家沒穿過禮服～


  格雷：OK我全包


  女：人家頭髮亂糟糟～


  格雷：OK幫妳請個人設計師


  女：這個設計師好壞壞，是你的前炮友，倫家不要！


  格雷：OK生日趴梯時我釣她來讓妳羞辱，順便賞她兩巴掌




  約會的時候


  女：遊艇好棒棒我想開～


  格雷：好哇讓妳開


  女：YA我有開過遊艇惹～



  過夜的時候


  女：這公寓好高級悠～


  格雷：好哇妳來住


  女： YA我有高級公寓住惹～



  求婚的時候


  女：好浪漫悠～滿滿都是花的大禮堂還有煙火～


  格雷：幹這些都是錢堆出來的阿～～～～




  請問，這跟總裁系列有什麼不一樣？


  如果女孩們想釣到多金性感的富家子弟


  請記得：


  1. 你要夠正，正到有工具人願意自動幫妳拍照，正到拍完的照片可以拿去辦展覽


  2. 身材夠好，而且毛要剃的很乾淨


  3. 要年輕，不然只會像老炮友一樣被甩巴掌+潑水羞辱


  4. 找工作要找年輕有錢單身父母雙亡（或是不在）的老闆


  試問，你醒了嗎？


  --



  --'
