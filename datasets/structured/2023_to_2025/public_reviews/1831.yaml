url: https://www.ptt.cc/bbs/movie/M.1676098520.A.2A6.html
title: '[好雷]《束縛》，壓抑又奔放，叛逆又優雅的伊莉'
content: '部落格版：


  1837年聖誕夜，在後來被世人稱作為「世界上最美麗的皇后」的伊莉莎白亞美莉歐根妮在

  德國慕尼黑出生。她是巴伐利亞的馬克西米利安約瑟夫公爵與瑪麗亞盧多維卡威廉明妮公

  主的次女，不過儘管出身自貴族家庭，然而在她於宮廷中沒有任何職務、喜好自由、不拘

  小節，熱愛旅遊跟寫詩、彈琴，還有馬戲團表演的父親，其推崇自然且無拘無束、自由自

  在的教育理念養育下，同樣享受著這樣自由奔放的生活方式，而父親如詩人般充滿憂鬱、

  多愁善感的性格亦對她造成深遠影響，但在一場連她自己都始料未及的婚禮之後，她的生

  活就此改變。1953年，伊莉莎白母親的姐姐、當時的奧地利大公夫人蘇菲因受到一次暗殺

  皇帝的行動影響，於是辛勤的想替兒子弗蘭茨約瑟夫一世物色妻子，最後她選定讓兒子迎

  娶伊莉莎白的姐姐海倫妮為妻，孰料弗蘭茨約瑟夫一世卻看上當年才15歲的伊莉莎白，更

  向其母蘇菲放話若不是伊莉莎白的話他便終身不婚，迫於無奈之下只得同意這門婚事。


  嫁給弗蘭茨約瑟夫一世是伊莉莎白痛苦的開始，她根本難以忍受宮廷內嚴格的規矩，熱愛

  騎馬、讀書和藝術的她成了宮廷裡的異類，她如同被囚禁、被束縛在陳腐宮廷儀式中痛苦

  的生活著。其婆婆蘇菲又在她辛苦生下兩個女兒和一個兒子後奪走撫養權，甚至在她不曉

  得的情況下為他們洗禮，於是在婚姻初期她們婆媳間相處並不和睦，而在長女索菲因病去

  世後，伊莉莎白不僅身心靈狀況開始出現問題，和丈夫弗蘭茨約瑟夫一世間亦隨之出現裂

  痕，當幾年過去兩人間的婚姻名存實亡時，伊莉莎白更還找了別的女人來當丈夫的情人。

  成為奧地利皇后後，伊莉莎白因美貌受到如偶像般的追捧與崇拜，而在這個讓她什麼也做

  不了的宮廷裡，她似乎也只能被迫接受自己只能是個維持門面的偶像，為此她格外重視外

  貌與體態，尤其在體態維持上她幾乎到了走火入魔的程度，以嚴格的禁食和運動來讓體重

  始終維持在50公斤以下，亦藉由加強版的緊繫帶手段來將腰圍減至16吋。在失去自由之後

  ，靈魂跟著身體被束縛在了緊身馬甲裡，一吸一吐都是難以想像的痛苦與悲傷，或許1898

  年那場奪走她性命的刺殺，對伊莉莎白而言反而是種解脫也說不定。



  由導演瑪利克洛澤所執導的《束縛》正是以這位被認為在自由精神和傳統宮廷規矩徘徊的

  悲劇人物為主角的作品，並請來維琪克雷普飾演並且重新詮釋伊莉莎白。之所以說是「重

  新詮釋」，因爲導演瑪利克洛澤確實的賦予了伊莉莎白新的生命與面貌，她既保留住伊莉

  莎白被人所熟知的那面，卻又在某些時刻顛覆了她的形象，可以說是她對伊莉莎白「如果

  是活在現在會是什麼樣子的？」的想像，即使她依舊還是個「沒有話語權的偶像」，但在

  《束縛》裡頭卻給了她在壓抑、毫無自由可言的的宮廷裡最大限度的叛逆，如同維琪克雷

  普所言，「我試圖透過我的表演，給伊莉莎白一點自由。拍戲的時候我常常在想，或許我

  是在給伊莉莎白一個機會，讓她去做她當時做不到的一切。」，於是，《束縛》成了一部

  最不像茜茜公主可又最像是她的、一部既壓抑又奔放的人物傳記。


  「我的職責是掌控帝國的命運，妳的職責只是當個象徵性人物。」


  導演瑪利克洛澤帶領著觀眾從《束縛》裡來看現在，那件不停拉緊再拉緊的馬甲，就是社

  會所施加在女性身上的價值觀，要美、要白、要瘦、要穠纖合度、要會做家事、要會相夫

  教子、男人說話女人只管安靜就好，彷彿一輩子只能活在他人的注視裡，但是他媽到底誰

  說的？如果伊莉莎白生在現代，或許她會喜歡上阿密特的那首《母系社會》。女人從來就

  不是只能進廚房出廳堂，也不是只能煮好宵夜等著男人兄弟聚會完回來，女人就該那樣、

  女人就該這樣、女人只能怎樣...，世界男人稱王，女人卻得什麼都扛？觀念落伍簡直荒

  唐無聊，伊莉莎白轉身離開後豎起的中指是不爽、更是鄙視，你能高談輪廓，代表我也能

  發表意見，你敢拍桌要我閉嘴，那我就也可以拍桌回敬，不是嗎？《束縛》換了個方式，

  來讓伊莉莎白有了憤怒的資格，也還給了她本來就該擁有的「活成自己想要的樣子」的權

  利。



  《束縛》最讓人難受的是，從許多地方幾乎都能感受到這個世界、這個社會對女人的不友

  善，即使沒有惡意，但就是無法稱之為善的對待與看待。根深蒂固的思想與觀念不僅讓女

  性被束縛住，同時也束縛住所有人，形成一種悲傷的惡性輪迴。而伊莉莎白成了輪迴裡的

  一份子，她被禁錮在宮廷體制裡，她的身體被囚禁在此，卻無法阻止她靈魂對自由奔放的

  渴望與想念，伊莉莎白時常展現著她的叛逆，任憑謠言八卦滿天飛她也無所謂，但她心裡

  還是清楚的知道，這輩子她只能活在別人的注視裡，於是她即使心灰意冷卻也坦然面對，

  不論她怎麼走、怎麼跑、怎麼逃，她最後還是會回到宮廷裡，離開那些她迷戀、嚮往，真

  正愛著的人、事、物。伊莉莎白早於其他人覺醒的女性意識，讓她注定難以被人理解與認

  同，就連女兒皺起眉頭告訴她不喜歡這樣的母親，聽在伊莉莎白耳裡怎能不叫她難受。


  我很喜歡《束縛》裡關於水的意象，那彷彿是自由的象徵，如此的渴望著投入其懷抱。「

  她把我嚇壞了」，看著伊莉莎白泡在浴缸裡捏著鼻子閉氣的女傭們說著，她們無法理解皇

  后的行為，詭異、脫序、跟端莊儒雅扯不上關係，可是只有伊莉莎白清楚，從浴缸到池塘

  再到遼闊大海，每一次的閉氣都是她的奮力呼吸，即便就如前面提到的，她的身體早已被

  那個刺在肩後的錨固定在此無法漂走，可她的靈魂是自由的。在現實生活中，伊莉莎白在

  1898年於日內瓦準備搭船前往蒙特勒時，遭到義大利無政府主義者路易吉盧切尼用銼刀刺

  傷，最終她因失血過多不幸身亡，享壽60歲。而在導演瑪利克洛澤版本的《束縛》裡改動

  了這項歷史，伊莉莎白在她人生最後一趟旅程選擇縱身一跳躍入大海，豪不眷戀這個令她

  厭倦的人生，實現了現實裡的伊莉莎白沒能實現的解放、解脫，叛逆而又華麗的，很有伊

  莉莎白的樣子。


  導演瑪利克洛澤的《束縛》優雅而憂傷，搭上歌手Camille的一曲《She Was》，聽了實在

  酥麻又銷魂，特別是最後結尾的幾分鐘，實在太美。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
