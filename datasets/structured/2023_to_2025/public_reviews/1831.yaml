url: https://www.ptt.cc/bbs/movie/M.1486751865.A.907.html
title: '[好雷]格雷的五十道陰影：束縛'
content: '小妹是達柯塔強森的忠實粉絲


  第一集也是跟今天一樣上映日當天就迫不及待跑去看


  看她脫光光被大帥哥傑米道南打得不要不要的


  興奮得差點彈出來>/////<


  所以這部續集已經期待好久


  廢話不多說，立馬來討論劇情



  劇中的安娜自從上一集被克里斯欽懲罰連打六下嚇到翻臉後


  選擇離開了克里斯欽


  然而克里斯欽卻忘不了安娜


  鬼鬼祟祟地出現在有安娜肖像的畫展


  並且像個痴漢一樣砸錢買下所有安娜的肖像畫


  為的就是想與安娜復合


  並且承諾了放棄第一集訂下的那些變態條件


  安娜看著眼前這位西雅圖年輕多金的肌肉型男


  自然是難抵誘惑


  而且對於克里斯欽也是餘情未了


  正所謂餓鬼假小心


  因此彼此隱忍已久的愛苗就這樣再度燃燒




  本集多出了幾個新角色，挑重要的介紹：


  1.變態出版社編輯杰克


  是安娜公司裡的直屬上司，一開始為了追求安娜假扮斯文


  上班會主動買咖啡給安娜喝


  不過後來知道安娜有男朋友後態度丕變


  最後甚至想要關起門對安娜霸王硬上鉤


  不過慘遭安娜踢蛋蛋解圍


  克里斯欽接著再動用私人關係讓杰克捲鋪蓋走人


  一個名不見經傳的小編輯敢碰多金總裁的女人自然是死路一條


  下場極其落魄


  被開除後也不敢再出現尋求報復，小BK一個



  2.前臣服者蕾拉


  像鬼一樣神出鬼沒，差點嚇死戲院裡所有觀眾


  也讓想看床戲的期待心情瞬間被撲滅一半


  然而她是個值得同情的角色


  被克里斯欽搞得精神分裂


  老公死了以後就常常回克里斯欽住處周圍探頭探腦


  是一個稱職的臣服者


  連最後手上有槍也不敢違抗克里斯欽的命令



  3.伊蓮娜


  心理變態的老女人，曾經教克里斯欽如何做愛


  令人不寒而慄


  對於安娜與克里斯欽的戀情順利相當不滿


  會恐嚇安娜說克里斯欽是個怪人，見一次恐嚇一次


  最後被安娜潑水以及被克里斯欽他養母搧巴掌可以說是自己做來的


  不過從她的言語之中可以發現克里斯欽還有許多不為人知的祕密


  靜待下一集發掘



  而我對於本集的感想有下列幾點：


  1.女人心海底針，搞得我好亂阿


  安娜在上集因為克里斯欽的變態行徑而離開


  這次在克里斯欽的承諾改過下重新出發


  按道理說安娜應該會對之前克里斯欽對她所做的事情感到恐懼


  然而她卻每次一興奮都會要求克里斯欽打她


  要克里斯欽拿新工具弄她


  甚至最後還自動要求進入紅色刑房


  像這種要求我這輩子都沒見過


  明明就是個斗M，為何第一集要假裝矜持呢？


  只能說女人的心思極其複雜


  教人摸不著頭緒



  2.安娜摸克里斯欽胸肌那裡違反了角色的原始設定


  儘管克里斯欽為求復合做了很多妥協


  但是他畢竟是個心理有問題的人


  用口紅畫出的那塊區域就是他的紅線


  不管什麼情形都不得僭越的


  然而最後他卻為了展現深愛安娜的決心而讓安娜摸了這禁忌的區域


  做為這部片的愛好者我認為這是違反常理的


  除非劇組是要屏棄克里斯欽內心有陰影的這個原始設定


  改讓他扮演陽光少年


  不然這個設定就不能被改變


  否則就失去了這部戲的原則


  再者如果這個禁區是只要克里斯欽下定決心就可以任人觸摸的


  只能證明這個陰影其實沒那麼嚴重


  給安娜摸也就不能證明他對於安娜的愛


  因此他想表達自己深愛安娜的話


  就要以其他方式來展現


  譬如為安娜吃鼻屎之類的



  3.誇張到極點的直升機意外


  克里斯欽平時除了健身鍛鍊肌肉線條之外，本身也是超級英雄等級的


  在從波特蘭返回西雅圖的途中，直升級發生故障，消失在雷達上


  而劇中場景也不難看出直升機要撞山了


  這種情形在現實世界中通常不死也半條命


  但是在這千鈞一髮的險境中


  克里斯欽跟他的黑人助理竟然能夠毫髮無傷脫困


  並且連救護車都不用叫，直接走回家接受大家英雄式的歡呼


  實在是太強大了，真的是想不佩服都不行





  以上是我觀看格雷的五十道陰影第二集的心得


  感謝大家的收看










  --'
