url: https://www.ptt.cc/bbs/movie/M.1486913436.A.364.html
title: '[好雷] 【格雷的五十道陰影:束縛】相愛需要信心'
content: "我有看《格雷的五十道陰影》的系列小說(包含克里斯欽篇)，也有看過《格雷》電影的第一集\n\n所以在看完《格雷的五十道陰影:束縛》後，我會給好雷。\n\
  \n\n\n-=以下心得有雷=-\n\n\n\n\n本文的副標之所以會下\"相愛需要信心\"是因為劇情的推進\n\n在中 「臣服者必須信任支配者」才能夠使合約成立...\n\
  \n在,安娜則是面臨了一個考驗自己信心的問題\n\n\n\n\n\n尤其安娜自己被前任臣服者跟\"羅賓森夫人\"的唱衰&親眼目睹克里斯欽\"支配者\"的一面\n\
  \n所以真的需要莫大的信心才能承擔得起格雷先生的晦暗不堪的過去\n\n\n↓我還蠻喜歡下面這一幕的! 象徵克里斯欽和安娜是平等坦誠的。\n\n\n\n在第二集中，男女主角的演技都進步好多。兩人之間的互動像情人間，有火花了!\n\
  \n看新聞說男女主角因為變得更加熟稔彼此，所以在拍攝激情場面時\n\n能有互相配合回應/照顧對方的默契，所以兩人間的情感交流也自然許多\n\n可是我覺得或許跟角色定位也有關係吧?!\n\
  \n在中，男女主角的關係其實是 支配者vs.臣服者\n\n所以雙方之間認真說來是\n\n但到了，男女主角的地位是平等的戀人關係\n\n所以互動起來則應該像是戀人\
  \ 男女主角之間互動的更加熱切\n\n電影有承繼第一集的優點:\n\n另外，傑米的表情豐富多元，尤其是安娜答應跟他吃晚餐的小表情\n\n有把克里斯欽的雀躍詮釋出來。\n\
  \n而達珂塔的柔魅堅強也確實把安娜從女孩蛻變成女人的過程掌握出來。\n\n逐漸在這段關係中握有主導權，懂得\"性愛不能解決問題\"\n\n(偷推一下女主在《束縛》的穿搭還不錯~)\n\
  \n\n\n\n\n讓我覺得《束縛》好看的原因還有絕妙的電影配樂!!\n\n第一集的也蠻不錯聽的，但前後兩張電影原聲帶相比，我比較喜歡《束縛》的\n\n每一首歌(即便只是單純的bgm)也都搭配的很好，同時帶給我視覺/聽覺的享受!\n\
  \n\"I Don't Wanna Live Forever\"這首歌雖然不是搭配在激情場面\n\n但經過稍稍的重新剪輯套用在壯觀的場景下\n\n整首歌變得更輝煌了\n\
  \n\n還有其他好聽的歌，大家感興趣可以去spotify試聽\n\n(可惜ost放的順序不是在電影出現的順序\n\n看電影太認真來不及記住歌名\n\n不曉得有沒有大神能夠列出電影各場景搭配的樂曲啊?!)\n\
  \n\n\n\n\n\n\n這一點有利有弊!\n\n第二集的小說多達500頁，故事情節因為新登場了3位人物，所以劇情絕對比第一集豐富\n\n在這麼多內容的情形下，我覺得編劇有把第二集的精華抓出來\n\
  \n甚至還多充實了一些小說沒描述到的戲份(ex. 男主角傑米道南的鞍馬，好厲害)\n\n令我驚豔的不是那顆球   而是那根伸展桿\n\n看報導說是劇組特別打造的(我看小說時，很難想像該如何操作)\n\
  \n\n\n但也因為內容多，所以有些場景感覺上是匆匆帶過的\n\n如若電影的步調能稍稍放慢一點，不要匆匆過場\n\n讓演員發揮多一點情緒，我覺得會更好。\n\n\
  \n(導演表示是因為時間長度問題只好刪減一些戲份\n\n所以下面預告這一幕會收錄在DVD裡)\n\n\n↑這一場在小說也是重點~\n\n\n\n所以整體來說 \
  \ \n\n畢竟這系列電影也是有部分是為了滿足書迷的想像而製作出來的\n\n小說對於克里斯欽‧格雷的陰影刻劃更令人心疼\n\n也有解釋男主角直升機墜機事件的經過。\n\
  \n\n以上心得完畢，感謝大家閱讀~~~\n\n\n\n\n\n\n--\n\n小說第一本也是有令我想放棄的點(←落落長的合約...)\n如果真的不想看書\n\
  其實也可以單純就看電影  把電影從小說獨立出來\n(第2集看電影時 如果有點看不懂 其實是正常的\n看國外預告可以發現導演在《束縛》中剪了不少戲份...\n等藍光導演版吧~)\n\
  \n\nRita Ora 收錄在豪華盤的kiss me也不錯聽!"
