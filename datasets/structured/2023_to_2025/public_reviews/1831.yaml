title: '[負雷] 格雷的五十道陰影-束縛'
content: '"It''s not SM story, it''s a love story with intense sex"


  這是看完之後的總評

  整體來說看得出來新導演想要淡化SM的痕跡，但問題就是把他拍成愛情故事了...


  前面一小時如其他版友說的，完全是浪費時間

  問題在故事節奏進行得太流暢，沒有半點拉扯


  Christian的本性，過去，回憶一定都會造成其進入一段正常關係的障礙

  但你這未免也屈服得太快了吧！？


  身為有著多年經驗的Dom，怎麼只是碰到一個女孩就一百八十度大轉變了

  這中間一定有著許多拉扯，但很可惜這些高張力與切合核心的橋段只在第一集稍微帶過

  第二集更是只由第三者伊蓮娜描述，我想這力道遠遠不足


  甚至到中段我一度覺得Anna才是真正的Dom吧


  而故事的重頭戲-「性愛場面」更是亂七八糟

  我說那個配樂是怎麼回事！？ 原來這是歡愉的性愛而不是SM啊！？


  不是說SM不能歡愉，而是在權力關係、調教、技巧上都有許多可以著墨的

  但導演選擇簡單演示完一件道具後就進入抽插；

  那這樣去看SOD就好啦.....


  當然，淡化SM情節向大眾靠攏應該是收得到具體票房成效的，

  至少觸碰得到廣大少女粉絲的心

  只是如果要走這樣的拍法，那不如把片名改成「霸道總裁少女心」吧



  --'
