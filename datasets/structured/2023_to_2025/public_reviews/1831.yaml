title: '[普雷] 格雷的五十道陰影：束縛，解開後我要我要'
content: '經過斷捨離之後，格雷發現舊愛才是最美，霸氣宣言「我要你回來我的身邊」，除

  了再次磨合底線，更是在彼此身上找到了「適合」的腳步與「合適」的尺度，最終

  果然只有安娜能夠超越安娜，成就一部可喜可賀的愛情好戲。





  噢，當然我們不是說繩子還是機關什麼之類的束縛。在電影中格雷與安娜間最大的

  問題，就是秘密。安娜希望能夠以自己的方式來拯救格雷，要求在復合的路上能夠

  坦誠，無論是身體上的禁區、施虐時的態度、支配的臣服感，不該只是一昧強求，

  應該考慮雙方的感受。


  同時在劇情上安排了新情敵的挑戰、舊情人的不甘、老情人的自以為是，讓愛情故

  事一波三折，這也成為了修成正果前最大的束縛。





  更顯成熟的安娜，面對強勢的格雷，透過溝通的技巧，了當的告訴對方：只有在兩

  方都清醒的狀態下，才是有效的溝通。不再吃你那一套佔有慾、保護感還是大男人

  主義，但同時改變的也是安娜，面對超尺度的性事主動迎合，更加大膽的嘗試，在

  進退攻守之間轉被動為主動，滿足格雷性慾的出口，讓格雷在發洩之後，對安娜更

  加愛不釋手。


  當然要改變一個人沒那麼的容易，格雷三步五時還是會施展「有錢就是任性」的大

  絕招，買下航空公司、出版社，駕著遊艇開著直升機，變裝舞會和豪宅密室的貴氣

  生活，並在各種場合上極盡挑逗安娜，做出許多奔放又狂野的要求，進行一次又一

  次慾望上的突刺，各種用力的畫面不僅讓人血脈噴張，綑綁手腳、健身秀肌肉與恰

  到好處的床戲，也讓人大呼過癮。看樣子有錢公子哥不只給安娜生活上最無為不止

  的照顧，身體上也是。





  霸道總裁與他的俏夫人，廢棄那只不平等契約，成功的將轉束縛為約定，在心甘情

  願下享受BDSM的刺激，讓性愛與身心結合，王子與公主終於過上了幸福快樂的生活

  ，只是電影埋有著爭風男與吃醋女的伏筆，下一集似乎會有來自外部的考驗，為這

  部愛情動作片添加些名為考驗的情趣。


  當格雷願意放下規則，思考一段正常的感情狀態，安娜也透過循序漸進的交往過程

  ，了解到個性背後的成因，在關懷、包容與愛情的感人表現下，接受格雷的求婚，

  雖然最後還是回歸到真愛無敵的戲碼，但也代表著在愛情中，人其實都有可以被「

  調教」的可能，或許也是電影想要傳達給大家的一個好消息？





  這部電影顯然無法與你的 D槽相比，許多鏡頭也只是點到為止，看完後心中的悵然

  若失一定極欲填滿，也多虧了它在情人節上映，電影結束後，就開始與你的另一半

  來場無禁的愛吧，相信這個晚上絕對特別激烈呢。




  維基百科BDSM解釋：用來描述一些與「虐戀」相關的人類性行為模式。其主要的次

  群體正是BDSM這個縮寫字母本身所指稱的：綁縛與性調教（Bondage & Discipline

  ，即B/D），支配與臣服（Dominance & Submission，即D/S），施虐與受虐

  （Sadism & Masochism，即S/M）。


  ----------------------


  真正激烈不是電影中演的，是回家後做的




  --'
