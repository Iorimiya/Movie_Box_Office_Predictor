url: https://www.ptt.cc/bbs/movie/M.1473780116.A.20B.html
title: 格雷的五十道陰影：束縛首支預告
content: '火辣辣的格雷的五十道陰影第二章束縛首支預告來囉



  卡司：達柯塔強生、傑米道南、休丹西、艾瑞克強森、珍妮佛艾莉、路克葛萊姆斯、瑞塔歐拉、維克托拉蘇克、艾洛斯慕福特、馬克斯馬丁尼、貝拉希斯寇特、金貝辛格和瑪西蓋哈登

  導演：詹姆斯佛利

  劇本：尼爾倫納德

  原著作者：E.L.詹姆絲

  製片：邁克德魯卡、E.L.詹姆絲、唐納布內提、馬克斯維斯迪


  傑米道南和達柯塔強生再度攜手飾演【格雷的五十道陰影】的格雷和安娜，揭開全球暢銷同名小說的第二章。2015年【格雷的五十道陰影】橫掃全球5.6億美元票房，全台票房也有1.25億新台幣，第二集將同樣選在情人節檔期浪漫獻映，帶領觀眾深入更黑暗的陰影。

  克里斯欽格雷內心傷痕累累，他試圖挽回安娜，但安娜要求他接受新的關係模式，否則不給彼此重投開始的機會。兩人逐漸培養信任感，建立穩定的關係，不料克里斯欽過往的陰影再度浮現，即將破滅這對情侶一起走下去的希望。

  奧斯卡得主瑪西蓋哈登、珍妮佛艾莉、路克葛萊姆斯、瑞塔歐拉、維克托拉蘇克、艾洛斯慕福特、馬克斯馬丁尼原班人馬回歸，新面孔則有奧斯卡得主金貝辛格、休丹西、貝拉希斯寇特和艾瑞克強森。

  【格雷的五十道陰影：束縛】由詹姆斯佛利執導(【致命的危機】、影集《紙牌屋》)，幕後製作團隊陣容堅強，有邁克德魯卡和唐納布內提，以及原作者E.L.詹姆絲。劇本則是尼爾倫納德根據同名小說改編。


  環球影業發行 2017年2月10日 無禁的愛


  --'
