url: https://www.ptt.cc/bbs/movie/M.1546371764.A.156.html
title: '[無雷] 《近敵》我們不一樣卻又彼此束縛'
content: '圖文版請參造網址：


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

















  警察與幫派，不同路卻又交會的人生十字路


  有光的地方就有影，世界從不缺幫派和歧路故事，台灣《角頭2》也因為演員飆演技，與

  導演過去浪子回頭的背景被觀眾熱議。就如同過去香港賣座警匪電影《無間道》系列，還

  影經典黑道名作《教父》等，我們對於這些壞角色與黑社會電影通常是又愛又恨。《近敵

  》是2018年法國描述底層人物與黑社會，還有警察故事的劇情電影，說著在巴黎中下階層

  社區從小一起長大的馬紐爾與崔斯，長大後，馬紐爾從事幫派活動，而崔斯則當上緝毒警

  察。在一次運毒的槍擊案中，兩人的社區發生死傷事件，兇手卻逃之夭夭，多年後兩人不

  甘願的再次見到自己從小的玩伴，而隨著調查越深，幫派中的馬紐爾發現自己越不能承受

  這龐大的利益衝擊與事實真相……


  在2018年法國5/1勞動節這天的遊行中，反對政府改革的鐵路工人聚集抗議，卻讓黑幫份

  子們有機可趁的到處破壞商家與掠奪搶劫，奪去工人發聲的新聞焦點目光。而在2018年11

  月起跨至2019年，法國抗議調漲燃油稅的「黃背心運動」也因黑幫暴力集團與政治狂熱份

  子的挑撥，使原本的抗議遊行轉變成激烈的警民衝突，可以看出法國黑幫的勢力與底層階

  級對於政府作為的憤怒，這也使原本對於法國巴黎只有浪漫與愛的印象的眾人，重新在思

  考起那階級與衝突的「法國」。






  法國電影《近敵》算是一部以復仇為主線架構，來帶出如同警方辦案的底線，中低階集的

  社群困境，與法國的種族問題和黑幫架構等。原則上雖然沒有許多大爆破與激烈的槍戰跟

  動作戲，但對於懸疑與主角等人的心理和家庭因素都有很不錯的詮釋，從開始鋪梗到最後

  收尾都算是很扎實的一部懸疑電影，其中以黑道與警方雙主角的形式，還有彼此關係牽連

  的背景雖然是老梗，但《近敵》花費更多時間點在講述一個社區幫派興起和警方辦案的關

  係，並且刻畫出那種「有距離感又得彼此牽絆」的特殊感情，這點讓觀眾印象相當深刻。


  對於一路走來提倡「自由、平等、博愛」的法國，卻在社會上依舊逃不過階級分明的社會

  關係結構。如果美國紐約一樣，法國巴黎你住在什麼區域就顯示你的家庭的階級是好野人

  或窮光蛋；是犯罪者還是富二代。菁英教育制度更是讓這些階級一再而再三的複製，形成

  個特術的社區結構。如同電影《近敵》中警方對於主角社區那些幫派份子的組成說過：「

  他們不是普通的幫派，而是一個牽連利益的結構。」也說明法國的地域性與裙帶關係在社

  會結構上難以抹滅的社會階級。










  《近敵》雖然許多鏡頭是以為幫派做事的馬紐爾的復仇為主，但有許多時候也以當上警察

  崔斯的視角去看整件事情，而有趣的是兩位主角交錯的立場與主觀意識去觀看同一件事物

  的拾後往往產生龐大的分歧，如同在幫派份子的馬紐爾是背叛的事由，在任職警察的崔斯

  則是一件正確的事情。但警方與黑道，這兩個看似對立，有時卻又得相互利用才能得到成

  果的特殊關係，什麼是正義、彼此間的情分在幫派之中又得花多少錢來換、世界上真有無

  價無償的兄弟情嗎？


  可以說《近敵》用兩位主角的心理因素和家庭，還有兄弟與社區間的情感去取代槍戰與動

  作戲，但又因為追緝真兇的過程不斷猜測與找尋真相，讓整體的故事不會因為減少動作戲

  分而乏味。警察與幫派，彼此之間的衝突和矛盾，還有許多的不妥協，就如同法國社會上

  一直不斷紛擾的政府與民眾。浪漫的法國巴黎也許只是種表面式的營照，如同黑道份子與

  主角身上光鮮亮麗的夾克和皮衣。








  --'
