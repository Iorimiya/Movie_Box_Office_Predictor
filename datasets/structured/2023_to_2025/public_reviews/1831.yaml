title: '[好 微雷] 刺青舞者－天賦與束縛'
content: '刺青舞者


  天之驕子的誕生，家庭強行賦予的寄託，天賦也同時是重擔。


  一方面看到家人為供養他跳舞的辛苦，但另一方面又為他的無從選擇而感傷，為什麼一定

  要把自己擅長的東西變成職業?可惜電影沒有繼續深入，畢竟 瑟基普魯尼 才27歲，現實

  也正值巔峰，確實挖不出更為衝突的內心波折，其實也讓我不經想，如果他不是那個天之

  驕子呢?不知道這樣的一廂情願摧毀了多少回不去的童年。


  就算此紀錄片比較流於表面的成長與叛逆，但不可否認的是光從舞蹈、光影、音樂 就足

  以征服我。舞者每吋肌膚併發的力與美是如此的狂暴卻優美，每個騰跳、旋轉、由肢體延

  伸的張力，都將他化作那匹桀驁不馴的「優雅野獸」。 影片尾聲，家人們難言表的付出

  和溫暖，使他逐漸放下敵意，緩和彼此的劍拔弩張，感受到有家人的支持與陪伴是多麼重

  要。


  原聲帶超級超級好聽～

  超愛的瑞典女歌手 Lucky Li 近期怒刷存在感，烈愛天堂的片尾曲I know places 完美的

  砌合全片宗旨，以及本片的dance dance dance，如同歌詞所言，用舞蹈證明了我的思想

  與存在，唯有透過跳舞，才得以與這世界溝通。


  另外本片的高潮片段，便是Take Me To Church 的MV拍攝，當年也是從這紅極一時的舞蹈

  MV認識他與主唱 Hozier，當這段如實重現大銀幕時，真的是起雞皮疙瘩又眼眶泛紅呢QQ

  後頭接續世界各地的小朋友受此MV影響愛上舞蹈，也是看得我熱淚盈眶。

  (歌曲表達了同性戀受到(教會)的壓迫)



  場次所剩不多，如果近期想看感人、優美、音樂好聽的電影，推薦這部～


  觀影於 光點台北電影館

  Dancer

  StevenCantor

  DavidLachapelle

  SergeiPolunin


  ig連結～隨便分享電影的地方～


  --'
