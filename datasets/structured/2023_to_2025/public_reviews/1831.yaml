title: '[好雷] 格雷的五十道陰影2:束縛-不專業觀後感'
content: '圖文網誌版




  純文字：


  去年看完第一集我就很期待第二集的上映


  好不容易周末有空，把小孩丟包給老公一個人跑去看


  第二集好看的程度不輸第一集，從頭到尾讓我完全忘了家裡的小孩XD


  這集男女主角的長相都有變得比較成熟，演技也更純熟一點


  尤其是女主角，每個細微的表情、小動作、呼吸，都表現得非常好


  她把那個外在羞澀、內心火熱、緊張、固執的個性，詮釋得非常完美


  從頭到尾我幾乎都在看女主角，反而男主角比較不吸引我 (除了裸體之外XD)






  一開始Anna就收到一大束Grey送來的白玫瑰花，問他新工作如何，很明顯是想挽回她


  (花束大到連垃圾桶都塞不下XD)


  在朋友的攝影展看到六幅自己的照片，整個嚇到


  結果全部被Grey買下來了，因為他不想讓陌生人盯著Anna


  (這邊可以看得出來Grey有強烈的佔有欲)


  Grey一出現，Anna心跳加速，複雜的心情完全表現在臉上 (所以我說女主角演技真的很好

  )


  Grey說他從來不用、也不曾吃回頭草，挽回對他來說很陌生，他不曉得該怎麼做，所以他

  看到Anna不知道該說啥


  (可見Anna對他來說有多特別)






  去吃飯的時候，Grey直接點兩份牛排，Anna跟服務生說她要沙拉，意指她不要吃牛排


  因為她不再是他的女人，無須聽從他


  從這邊也看得出來，Anna是非常有主見的女人，也很固執、叛逆、不聽話


  雖然她表面看起來是溫馴的小貓，但其實跟所有的貓一樣，是驕傲的，不容易被馴服的


  Grey開始說他小時候的事情，也是第一集沒有提到的


  Grey的生母在他四歲吸毒過量而死，電影開頭有一個男的虐待他，可能是他的生父或養父

  (並沒有提到)


  後來也會出現Grey胸部有許多菸燙疤，應該就是那男人造成，所以他才不讓人碰他胸部


  最後Anna同意重新在一起，新的規則就是：沒有規矩、沒有懲罰、沒有祕密


  但Anna還是擔心Grey總有一天還是會想要SM，但Grey說：我更需要你(我可以不要那些)






  話說，Anna的新老闆也滿帥的，可惜是個變態


  沒意外的話，他應該會是第三集的大魔王


  Anna跟老闆去附近咖啡廳聊天，Grey跟老闆第一次見面，Grey的佔有慾馬上顯現出來把

  Anna帶走


  後來他們去超級市場買菜回Anna家煮飯，Anna一直挑逗Grey，但又說要慢慢來，應該是想

  試探他吧


  Anna想從後面抱Grey，但是他胸部還是不能讓她碰


  結果兩個人還是做了 (真正忍不住的根本就是Anna吧XD)


  Grey把上一集賣掉她的車的錢要給Anna，但Anna把支票撕掉了


  可見他並不是愛Grey的錢，而是他的人


  不想接受他的錢，不想有種被包養的感覺


  但Grey的控制欲與強勢還是請人把錢匯到Anna的戶頭


  這邊可以看出來，兩個人有種互相抗衡，但Grey還是略勝一籌，Anna趨於弱勢







  Anna搶先Grey拿帳單，因為這才是正常男女朋友的互動


  之前都是Grey付錢，感覺就是被他包養，是他的臣服者


  但他不想要那樣的但這次Anna想要的是正常的戀愛關係，所以她把帳單搶走


  Grey帶他去Mrs. Robbinson的髮廊讓Anna非常生氣


  回家吵了一架之後，Grey用口紅在他胸部周圍畫了一圈，就是不可被觸碰的地方


  胸部有很多被菸燙的疤痕，也難怪胸部不准人家碰







  在化裝舞會上，Anna把Grey給他的錢捐出來


  這邊Anna和Grey的角色起了變化，Anna不再趨於弱勢，這場遊戲她贏了


  Grey拿她沒轍這點，讓他更愛Anna，因為Anna可以剋他，不像其他女人只聽從於他毫不反

  抗


  Mrs. Robbinson跑到廁所找Anna談話，說他反而救了Grey，不然他早就墮落了(藉口吧)


  她說：Grey永遠都需要臣服者，他不適合單純的愛，你們兩個在一起不會開心的


  (根本就是那種，我得不到別人也別想得到的心態)







  Anna幫Grey擦掉口紅線，還是不能碰到線內的區塊


  Anna主動要求要用道具，Grey說上次你看到我的另一面，Anna說她不再是以前的她


  這邊可以看得出來，Anna也改變了，不再像之前那樣害怕






  因為Anna不願意跟他老闆去書展，老闆就不爽想強暴她


  (這位帥老闆也太笨了吧，明知道她男朋友是誰還敢碰)


  活該，被fire掉了吧


  後來Grey和Anna就同居了


  這對Grey來說可是很大的一個進步，代表他認真對待這段感情


  在餐廳脫內褲，在電梯裡摸摸，這段預告裡就有，真的讓人血脈噴張呢


  這跟第一集Grey在電梯裡親Anna有呼應






  跟蹤Anna的女生突然出現，想要殺了Anna


  後來Grey上來，叫Lela做什麼他都聽從，好像一條狗似的


  這舉動讓Anna大吃一驚


  Anna回來後兩個又大吵一架，Anna認為Grey需要一個聽話的女人


  雖然他說他不需要臣服者，但Anna擔心他遲早還是會需要那些 (應該有被Mrs. Robbinson

  影響)


  她永遠無法做到那樣順服，她需要獨自一個人想清楚。Grey就跪下來求她不要離開


  Grey真的改變了，他這樣自大高傲的控制狂，居然會跪在一個女人面前


  Grey承諾說他永遠不會需要臣服者，但Anna不相信，他甚至不了解為何Grey想要控制一切

  的心態是什麼


  他懲罰長得像她媽媽的女人(臣服者)，他也知道這樣有多不正常


  如果Anna肯回來，他絕對不會再這樣做，但Anna還是不相信


  所以他就把Anna的手放在他胸口，讓他觸碰他那不可被觸摸的胸部


  然後Anna就回到他身邊了(早知道就不用跪了XD)






  Grey飛機失事後，兩人決定要結婚了，當然要做一下慶祝囉XD


  Anna第一次主動提出要去紅色房間


  這邊也代表了Anna跟第一集的Anna不同，她喜歡上被虐的快感


  後來被他媽意外聽到Mrs. Robbinson教他兒子上床，被他媽把了一巴掌趕出去(大快人心)


  他們兩個終於不再聯絡，讓Anna鬆了一口氣


  最後，Grey在很美的花園求婚，外面放煙火就結束了


  最後出現一個人的面孔看著Grey一家人的照片，應該是Anna的前老闆吧?








  後記：


  從以前我就一直認為，一方太聽從另一方的話，感情絕對不會長久


  我聽過太多例子，最後都是以分手收場


  我認為，感情要長久，就是雙方要互剋，可以互相制衡


  雙方都願意為另一方改變、退讓，而不是一味的聽話服從


  Grey之所以這麼愛Anna就是因為Anna可以剋他吧



  --

  對啊

  我也覺得有點太順暢 以為他出差會遇到什麼意外


  沒錯 我老公看了第一集說不想看第二集 所以我一個人跑去看'
