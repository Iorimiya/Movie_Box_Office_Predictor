title: '[好雷] 束縛 Corsage (2022 奧地利)'
content: '茜茜皇后電影《束縛》Corsage 上映第二週全台竟只剩七廳七場？百忙之中趕快去看！話說去年 Netflix才上過壁花少女版《茜茜皇后》Die
  Kaiserin、奧地利 RTL+ 也有華麗冒險版《茜茜》Sisi出到第二季，不過看來這場巴伐利亞野女孩與奧地利皇帝的夢幻婚姻、演到中年危機還要前輩 Vicky
  Krieps 出馬！猶記幾年前在《霓裳魅影》看她還是個小腹妹、如今竟已馬甲縮腰瘦身無極限？一個皇后日常除宮廷儀節外就是諸般健身保養、怎麼覺得好像每次小學家長會遇到的主婦家長們
  XD 本片這位 Sisi 穿著 Corsage演繹「束縛」人生，和我們四十左右這代也許沒那麼遙遠。




  歷史記載中的 Sisi 是什麼樣子？本片又選擇了哪些來呈現？首先 Sisi 是個大美人且身材高挑又「束腹」，這個 Vicky Krieps 演來絕無問題還敬業縮腰
  XD 然後 Sisi 是體育高手在每個行宮都有健身房，本片馬術健身體操擊劍也一樣不少；當然 Sisi 嫁來哈布斯堡帝國本就是來當「皇后」行皇室任務，本片也拍很多儀節皇帝也挑明了說，卻見
  Sisi 已笑而不語；史載 Sisi 對家庭愛情曾有期待但屢遭挫折漸趨疏離，本片就拍這疏離階段僅剩一絲企盼已在「不要拉倒」的邊緣；史實皇帝正面說來也是放她吃草給她空間，本片她也真不停旅行遍訪英國拜揚匈牙利與義大利！


  那史實 Sisi 最令人津津樂道的外遇八卦，英國有共享大地熱情的馬術教練 Bay、匈牙利有獨立情懷一見如故的國父級知交 Andrássy、老家拜揚則有妹妹頭表弟
  Ludwig II當心靈伴侶... 在本片不論真有登場還是僅獲提及都和 Sisi 踩在情慾紅線上！只是又令觀眾大失所望地啥也沒當真發生 XD 好吧那看親情罷，史載
  Sisi 前三個孩子的教養都被阿姨兼婆婆「蘇菲皇太后」掌控，長女 Sophie 早夭次女 Gisela 現在也嫁了，本片有登場的太子 Rudolf 被訓練得規規矩矩成了小男子，唯一自己帶大的小女兒
  Marie Valerie卻不愛自己的自由野性還更愛爸爸的宮廷...


  這裡面唯一還算能了解她的，大概就是小時沒給她帶但長大慢慢感同身受的「束縛」太子 Rudolf 了吧，只是自己那流亡妹妹 Marie Sophie 不知是否嫉妒她仍榮華富貴兀自不知足？竟在外甥
  Rudolf 耳邊八卦耳語挖 Sisi 牆角！哎哎還真的，除了已長大成人不久就要去當體制嘴上肉的兒子 Rudolf 外，整個皇家宮廷沒一人能傾聽她遑論了解與認同！嗯，要說是皇帝與宮廷虧待了她禁錮了她嗎？那也說不上來，畢竟她儘管象徵包袱很重、但實質自由度也很廣，與其說她的「束縛」是有無良體制強行傷害她身體、不如說是放不下象徵包袱跨不過心理難關的「作繭自縛」。




  說回本片片名《束縛》的具體意象 Corsage「束腹」，小腹妹 Vicky如今上緊鞋帶綁成柳腰令觀眾看了就隱隱作痛！看了整片還在好奇 Sisi 皇后怎麼撐成這樣還母儀天下美美笑容舉重若輕地，片末換個宮女當回替身立馬上吐下瀉！只聽皇后若無其事「他們一定覺得我今天胖了」好像也不錯？看
  Vicky詮釋的 Sisi 即使面對各種王室貴族不分男女的父權凝視，也許心下不忿但頑皮一笑促狹一倒也自得其樂 XD 這般叛逆有遭受王室任何鐵腕禁制甚至懲戒嗎？那可沒有！她那紙婚約中該盡的義務也都做到了，她跟人家多少曖昧皇帝也沒管，反而皇帝放她自由也放自己自由。


  也許我們應該重新理解本片世界觀下的 Sisi 處境，技術上來說並不真是籠中鳥，但她所處的位置仍有無以名狀的「束縛」，而在她邁向四十歲大關的這 1877 年終於忍不住了要來場衝撞與試探：(1)
  她開始各種路倒離席抽菸中指等離經叛道，既像是在對這年復一年的僵固體制作無聲控訴，又像是在探測這象徵的僵固到底有多少實質禁錮；(2) 面對對她也沒什麼不公的皇帝丈夫，她也許隱忍多年至今仍抱持希望，但本片幾次人性解放與情感交心的試探終歸失望；(3)
  重新拜訪能與她交心的幾位曖昧男子，既然我另有自由空間能否另類求愛？可惜亦沒人跨雷池一步。


  (4) 回視自己曾經渴望在體制之外投注人性傳承的兒女，小女兒彷彿被磁鐵吸走般自己越教越遙遠、兒子不是自己教的但越長大越是苦澀地了解自己；(5) 自己當皇后唯一具體改變的「雙元帝國」匈牙利獨立善果，如今皇夫不但抱怨後悔嗤之以鼻，甚至在這
  1878 年《柏林會議》皇夫又回歸帝國主義只想掌控波士尼亞新領土（未來就成一戰導火線塞拉耶佛）！唉，史載我們知道孤寂苦悶的 Sisi 正是在孤寂苦悶的匈牙利找到了認同，如今皇夫雖給自己實質自由卻要否認那象徵認同？那看看本片
  Sisi 還能找到的認同，都是慈善訪視遇見的斷腿傷兵與五花大綁女精神病患。




  倒是這傷兵心有靈犀毫無拘束、能與皇后同躺一床分享一支煙、已是宮廷上流與帝國萬民中的獨一無二！可惜 Sisi 上流圈裡沒人能如此待她，只能把握片刻享點小確幸。盤點一下本片
  Sisi 僅剩的三個出口：(1) 慈善訪視遇見的民間鰥寡孤獨老弱傷殘們，雖能同享片刻但頂多也只能互舔傷口；(2) 與自己宮女 Marie, Ida & Finni
  等雖可放下身段放鬆相處，但她們忠誠陪伴之餘終究只當個工作，即使親如 Marie仍渴望開展自己人生，這階級壁壘對 Sisi 來說仍是挑戰；(3) 倒是史實應無見過但編導強勢約見的「電影之父」Louis
  Le Prince 給她「看與被看」的全新視野：


  傳統貴族仕女形象都是「肖像畫」，是個穿戴整齊擺好 pose 搭配神話背景的浪漫化形象、正如世人不分階級看待 Sisi 也都用這美麗優雅母儀天下的浪漫化期待。而這單向被看被畫的期待框架反過來約束了
  Sisi 的自我認同、沒人強迫她仍不由自主束縛縮腰套上身體心理的 Corsage！正如片初 Sisi 感嘆「我們只是在愛任何可以愛著我們想要樣子的人」，白話一點就是「並非愛人」而是「愛上被愛感」，可惜被愛感就如肖像畫般操之於他人；但電影，你初次成為再浪漫化都框限不了的寫實動態、初次可以隨心所欲地說話笑鬧、更初次可以直視鏡頭留下點屬於自己的真實。




  電影有多真實或多浪漫化？又是未來一個半世紀的影界與媒體功課。總之從與 Louis Le Prince的虛構相會開始，我們看見 Sisi 人生重要時刻與重要人物不時出現的電影膠卷默片呈現，那在片中真的都是曾由
  Louis Le Prince幫忙拍出來的嗎？我寧可視之為本片 Sisi 自己面對現實禁錮時在腦中醞釀的替代自由，這自由有時屬於她有時屬於兒子Rudolf。總之全片放長看我們也漸漸觀察到
  Sisi 關於「自我束縛」的姿態變化：過去在意自己外貌與他人眼中的形象、過去在意自己不再年輕比不過情婦、過去只敢面帶微笑搞點小叛逆、過去在外受到壓抑回來對宮女行使權力...


  但接近片末一切漸變中：皇帝丈夫還需要年輕情人、自己卻已超脫年輕還能惠賜祝福指引；女兒兀自興沖沖參與儀式崇拜她風範、她卻已學會安排替身自己廢在家；那一頭給人凝視的頭髮可以剪下了、宮女兀自哭喊「那是一生工作成果」但她知只是身外之物；漸漸深居簡出面紗示人和宮女們越來越沒啥不同，甚至肩膀還刺上同樣的刺青？嗯，看到這片末處理，驚悚片觀眾一定想起片中她曾對表弟提過的「準備好要自殺了」難道這是臨門一腳嗎？但看史實我們知道
  Sisi 並沒有自殺、只是退隱公眾不再露面自遊歷天下，是否這是開啟後半生「隱形人生」的小試牛刀？


  這小試牛刀的片尾還真是舒爽，大船巨輪不停向前我仍能在它前端縱身一躍！然後 Vicky Krieps 那超脫芭蕾進入現代的獨舞更是無拘無束流動變化的逍遙... 史實晚年
  Sisi 不再露面是種憂鬱徵象嗎？她不再被畫是種自卑徵象嗎？甚至她不再示人難道是其實自殺了卻被皇室 cover下來嗎？這些悲觀受害的論調也許在後世都常出現，但拍電影掌握詮釋權的
  Marie Kreutzer 看來另有觀點，自己不能穿越時空給 Sisi 奧援、就化身 Louis Le Prince給她電影靈感脫胎換骨：脫離公眾與繪畫，未必是憂鬱痛苦無法示人，也可能是早超脫了「愛上被看」的自縛窠臼而得到自由。




  和 Sisi 一樣身處四十大關焦慮著青春，我們男生焦慮車子房子等「身外之物」時還有很多女性更要焦慮「身上之物」，尤其家長社群許多全職相夫教子的中年正媽打扮美美健身保養每天超精實！人都活到
  40 與青春奮戰至少 25 年了，真還要如此在意旁人與社會眼光嗎？如此的「愛」到底是在愛一種「被看」與「被愛」還是心底自發主動去愛人？當然本片《束縛》Corsage
  拍這四十世代更年故事是皇家規格，但褪去皇家繁華看進內裡焦慮和我們城市打拼撐持光鮮的小資產階級也異曲同工... 推薦青壯年觀眾把握機會院線欣賞，如想輕鬆浪漫點也可看看其他
  Sisi 影劇。




  --

  經典茜茜三部曲 Sissi Trilogy (1956-1958)



  奧地利 RTL+ 前年底開播的 Sisi S01 (2021)



  奧地利 RTL+ 去年底續播的 Sisi S02 (2022)



  Netflix 去年底推出的德劇 Die Kaiserin (2022)



  德國新片 Sisi & Ich (2023) 下個月在德上映



  --

  大概是傳統中文世界取女生名字一定要花花草草的執著吧，當初取這名的人還活著嗎？

  當然啦，照這片的茜茜體悟來說，這種貴族婚嫁恐怕最終都只會是束縛牢籠，不嫁也罷就跟皇后我一起去旅遊 XD 只是宮廷婚姻必然悲慘苦悶嗎？她的意識與女侍們有達成共識嗎？這方面本片都含糊帶過了，觀眾看到
  Marie這般待遇都會皺眉頭。

  所以我想這最後一鏡未必要解讀為「自殺」，會有更多想像空間

  還好，我通常還是看具體的妝髮服儀器物陳設來想像年代氛圍

  還好我看 Romy 已是小學時代了，長大看其他 Sisi 影劇時都努力忍住別去先複習，不然這世上還有哪個下代女星還能演 Sisi？

  這片真的下得超快，難道 Sisi 在台已快被忘光了嗎？

  歡迎給點具體意見～'
