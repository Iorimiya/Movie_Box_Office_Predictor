title: '[新聞] 《格雷：束縛》破星戰七預告首日觀看紀錄'
content: '新聞網址：




  文/Jean


  由 J.J. 亞柏拉漢（J.J. Abrams）執導的《Star Wars：原力覺醒》（Star Wars: The

  Force Awakens）在 2015 年 12 月上映，夾帶著全球影迷對暌違多年全新續作的熱烈

  期盼，同年 10 月釋出最後一支終極版預告，在 YouTube、Facebook 等各種網路平台

  ，不過現在這項紀錄已經被另一部系列

  電影給打破了。


  《格雷的五十道陰影》（Fifty Shades of Grey）將在明年推出續集《格雷的五十道陰

  影：束縛》（Fifty Shades Darker），於，根據環球

  影業表示，該預告於官方 Facebook 專頁上線不到一個小時就累積了 250 萬觀看數，

  並在 的驚人數字。其中北美地區占了 3490 萬，絕大

  多數則來自其他國際地區的當地版預告，包含英國 1980 萬、巴西 1240 萬、法國 980

  萬等。


  此系列電影是改編自 E. L. 詹姆絲（E. L. James）所著的同名暢銷系列小說，《格雷

  的五十道陰影：束縛》則由《桃色吸引力》（After Dark, My Sweet）導演詹姆斯佛利

  （James Foley）接手執導，E. L. 詹姆絲的先生奈爾李奧納德（Niall Leonard）執筆

  劇本，主演卡司包括傑米道南（Jamie Dornan）、達柯塔強森（Dakota Johnson）、

  瑞塔歐拉（Rita Ora）、路克葛林姆斯（Luke Grimes）都將回歸，預計 2017 年 2 月

  10 日台灣上映。


  ------------------------------------------------------------------------------


  參考外電:Deadline

  ‘Fifty Shades Darker’ Trailer Breaks ‘Force Awakens’ Record For Most

  Views In First Day



  心得:格雷看過的罵歸罵，但顯然續集票房還是不會差，

  因為從預告來看，還是有不少人期待拍出來的成果


  --'
