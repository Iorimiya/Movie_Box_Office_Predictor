url: https://www.ptt.cc/bbs/movie/M.1554948911.A.E0C.html
title: '[普雷] 《地獄怪客》掙脫舊版束縛的爽快血宴'
content: '1.影片名稱 :《地獄怪客：血后的崛起》


  2.觀影時間 : 04/10 21:00


  3.觀影地點 : 台中新光影城


  4.觀影方式 : 特映



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  《地獄怪客》掙脫舊版束縛的爽快血宴

  　　

  簡單無雷心得

  ———————————————

  　　

  距Guillermo del Toro所拍攝的兩部地獄怪客也已經過了10年，

  但那特殊的奇幻風格與龍貓的執導功力，仍讓影迷難以忘懷。

  　　

  而這大概是新版地獄怪客的最大挑戰。

  　　

  在釋出海報與預告時就已經哀鴻遍野，

  風格太過迥異的新版在大眾接受度上可能不是那麼討喜，

  而事實上也的確如此，這絕對是一部需要電波符合才能享受的電影。

  　　

  我對龍貓的舊版並無特別迷戀，我也非原作漫畫讀者，

  但我喜歡看到同一位角色在不同創作者筆下呈現的樣貌，

  於是當新版預告釋出時，我是非常期待的，

  期待看到完全別於龍貓版的地獄怪客。


  新版地獄怪客絕對不是一部好電影，

  劇情、設定、場景過多，全片流於趕進度的走馬看花

  ，但導演功力又不足以將走馬看花轉化成緊湊的節奏，

  導致途中會讓人有一種「演完了沒？」的想法，

  尤其片中有許多口頭交代劇情的橋段，

  但明顯沒有想讓觀眾消化的意思，偏向服務原作粉絲的交差了事

  （『反正你們看過漫畫都知道了，我就簡單講講吧』的感覺）

  　　

  片長兩個小時中，導演呈現了許多場景，

  但我沒辦法對任何一個地方有特別深刻的印象，

  也許是地獄怪客本人過於鮮明，注意力都集中在他身上，

  但這樣也確實浪費了只有奇幻電影可以呈現的特色，

  而導致如此的原因，也有可能是全片本身並無「過於奇幻」的場景，

  幾乎都是在現實世界中的追趕跑跳，

  但個人仍希望能看到更多現實與奇幻相結合的特殊景點。

  　　

  承上，節奏過快、連結又鬆散的的情況下，

  導致配角群完全邊緣化，雖然給了主要配角們不少的戲分，

  但像是每個人都演好自己的部分而已，

  不管是演技或劇情，都不足以讓人感受到地獄怪客與配角們的化學效應。

  　　

  動作戲大概是全片最不需要擔心的部分，

  有許多電玩才看得到的帥氣招式，

  搭配上一堆英國出品的搖滾曲，

  完全只有爽快兩個字可以形容，

  血漿、斷肢大放送，直接血淋淋呈現在眼前，

  不會顯得噁心，較多的是詼諧的黑色幽默感，

  但如果你是完全不敢看斷肢畫面的，這部片可能不太適合你就是了。

  　　

  雖然場景設計不足，但怪物設計完全是賞心悅目，

  但動畫呈現仍然有很嚴重的B級片感，

  而且有許多場景是在光天化日之下，

  動畫的粗糙感又更原形畢露，

  但這不影響怪物設計的獵奇程度，

  而且設計團隊明顯想與龍貓版做分別，

  而是採用較近漫畫版本的設計，這方面絕對是本片優點。

  　　

  原創配樂部分使用非常大量的重金屬音樂，

  導致全片的氣氛沒有那麼「磅礡」，

  但音樂的選用也確實能吸引喜歡搖滾、金屬樂的粉絲，

  我會說是部比較風格化的電影，而非傳統好萊塢大片的走向。

  （甚至覺得放Netflix可能還比較好）


  最後，我想說，要不和龍貓舊版做比較是不可能的，

  但我仍然希望大家可以拋去對地獄怪客的舊有印象來看待新版，

  也許比較能找到箇中趣味。


  這部電影是基於漫畫劇情改編的，參考的原作為：

  《Darkness Calls》、

  《The Wild Hunt》、

  與《The Storm and the Fury》。


  也許你看完新版會覺得「不像地獄怪客」，

  但事實上龍貓版可能才是最不像地獄怪客的地獄怪客XD

  　　

  但像原作不代表就是一部好電影，

  龍貓舊版絕對是值得流傳下去的經典作品，

  而新版更像是「隨便，豁出去啦！」的粉絲服務向電影。

  　　

  在電影的呈現上，新版絕對不及格，

  但我仍認為這是一部非常享受的爽快血宴，

  推薦給能接受不同樣貌的地獄怪客、想放鬆放空看部無腦爽片的觀眾。

  　　

  況且，在復仇者4上映前，

  也許最不需要的，

  就是另一部角色們內心糾結、極度憂鬱的灰暗電影了。

  ———————————————　




  最後，蜜拉姊真的正爆！！！！！！！！！！！！！！！



  --

  我改用詞了，謝謝提出'
