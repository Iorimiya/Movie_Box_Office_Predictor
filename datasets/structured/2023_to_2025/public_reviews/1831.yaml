title: '[新聞] 演員遭控持兒色物 奧片束縛逐奧前景不明'
content: '新聞網址：




  有望代表奧地利角逐2023奧斯卡最佳國際影片的「束縛」（Corsage）主要演員之一

  佛洛里安特辛梅斯特被控持有兒童色情物後，電影主要支持者之一今天與他割席。


  法新社報導，奧地利廣播集團（ORF）表示，既不會製作也不會播放佛洛里安特辛梅

  斯特（Florian Teichtmeister）的電影。佛洛里安特辛梅斯特在「束縛」中扮演

  法蘭茲．約瑟夫一世（Emperor Franz-Joseph）。



  (註︰上圖的確為特辛梅斯特在「束縛」中飾演約瑟夫一世的劇照)


  「束縛」講述19世紀奧匈帝國的伊麗莎白王后（Empress Elisabeth，註︰俗稱茜茜

  皇后）和法蘭茲．約瑟夫一世動盪的婚姻關係，已在國際電影節上獲得多座獎項肯定

  ，也有亮眼的票房表現。


  然而，43歲的佛洛里安特辛梅斯特辯護律師13日宣布他已遭受指控，還說他的委託人

  將在2月的審判中認罪。


  提名「束縛」角逐奧斯卡最佳國際影片的奧地利電影協會表示將支持這項決定，認為

  人們必須將電影和演員區分開來。


  這部電影的導演兼編劇瑪利克洛澤（Marie Kreutzer）表示，她「感到悲傷和憤怒，

  因為一部女權主義電影…竟然被一個人的可怕行為玷污和破壞了」。



  奧斯卡評審團將在3月12日頒獎典禮前，將15部初選名單影片縮減至5部。


  奧地利國家劇院城堡劇院（Burgtheater）已宣布立即解雇佛洛里安特辛梅斯特。


  （譯者：陳昱婷/核稿：劉文瑜）


  -----------------------------------------------------------------------------


  參考外電︰Variety

  ‘Corsage’ to Remain as Austria’s Official Oscar Entry Despite Charges

  Against Actor Florian Teichtmeister for Possession of Child Pornography



  順帶補充︰「束縛」已經由好威影業(世界上最爛的人、正發生)購得在台代理權，

  並安排2/10戲院上映





  龍魚大(qpr322)對於本片也有詳細的導覽文



  心得︰近期最夯的德語片固然是Netflix投資的新版「西線無戰事」，不過奧地利與

  另外三國合拍(也包括德國)的這部茜茜皇后電影版本，似乎也有吃到同題材影集

  在網路上人氣竄起的紅利，加上主旨本身也跟女生意識以及對抗男性壓迫相關，

  所以也不難推測為何能打進奧斯卡國際電影的初選十五強


  只是很可惜男主角會做出這麼不自愛到傷害影迷的心，甚至傷害劇組的行為就是了，

  尤其歐美本身對於兒童色情本身就相當敏感，在MeToo之後更是大禁忌


  --'
