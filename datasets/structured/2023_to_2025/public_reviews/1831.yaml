url: https://www.ptt.cc/bbs/movie/M.1481158677.A.6B2.html
title: '[討論+新聞]格雷的50道陰影2:束縛 第2支預告釋出'
content: '新聞網址:


  改編自同名暢銷小說，（Fifty Shades Darker）全新預告

  報到！有別於第一支預告有點「驚悚」的風格，這次算是非常有誠意的加入了令人血脈噴

  張的性感橋段，增加了格雷與安娜兩人欲擒故縱的曖昧！


  本片主要演員包括達柯塔強森（Dakota Johnson）、傑米道南（Jamie Dornan）、瑞塔歐

  拉（Rita Ora）、路克葛林姆斯（Luke Grimes）都將再次回歸演出，導演則由詹姆斯佛

  利（James Foley）擔任，並由 E. L. 詹姆絲的先生奈爾李奧納德（Niall Leonard）出

  任編劇，他過去也曾為迷你影集《搶救空軍一號》（Air Force One Is Down）等多部電

  視作品編寫劇本，預計於。


  (英文版)

  預告片網址:


  (中文版)

  預告片網址:



  ------------

  我覺得第2集拍得更吸引人了~


  而且小說中有些橋段 在電影版更刺激


  所以續集應該可以擺脫第一集負評的"陰影"吧


  大家覺得呢~~


  --


  第2部有換導演  編劇還是原著作者的老公(本身是電視劇編劇)

  所以其實還是可以給續集一次機會啦~


  《束縛》在原著中比第一部有很多可看點  登場人物也增多了

  因此也不用擔心劇情不夠


  很多人說男主不夠帥或不夠讓人入戲

  我個人是覺得他可以把格雷霸道的那一面 再發揮多一點吧?!

  這樣或許會比較好???


  至於身材...見仁見智   我覺得這樣剛剛好，太壯的接受不了~~~'
