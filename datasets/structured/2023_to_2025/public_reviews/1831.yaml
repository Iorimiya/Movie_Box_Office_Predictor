url: https://www.ptt.cc/bbs/movie/M.1424012040.A.24C.html
title: '[好雷] 格雷的五十道陰影-救贖-治療;束縛-解脫 '
content: '格雷的五十道陰影

  與其說是情色片、虐待片不如說更像是心理治療，一場自我救贖的愛恨絲路。


  對於期待看到血辣、腥羶、驚駭、奇異、刺激種類的觀眾來說當然會大失所望，自不在話

  下。偏偏導演甘冒眾怒地不將它演示為成人片的再複製，如此一來何必在電影院觀賞？

  既尬尷又喪失了電影的藝術。倒不是說要故作清高或故弄玄虛、吊人胃口、賣弄噱頭，

  是導演拍得唯美之餘又不失情慾，有束縛卻也有解脫，那怕可預見地會拖為二三集。可是

  片尾那被罵翻的電梯畫面，在我看來是無限想像的驚鴻一瞥。



  男女主角互喊雙方的名字，就在那門開門閉的一剎那，必然緊閉的是電動門或是心房？

  未說完的故事、待續的「性」遊記，暗喻蓬門今始為君開，也打開了觀眾的眼界卻也

  開啟真正的黑暗之門，然後又即將關上。那最後一道防線從非是合約化的一紙守則，

  是「妳不可以碰觸我的身體」的欲言又止，那最深層的渴望，最不被了解的過往，傷痛

  的課題埋藏在「我被怎麼對待，我就怎對待別人」的往返循復模式裡。


  隱約的怒氣、自暴自棄般的狂吼:「因為我就是這樣的人！」


  在女主角攻克高富帥的過程，時常可見抿嘴，表面上是性挑逗不也暗示了說與不說、不能

  說或不敢說、不願說與不可以說的掙扎？無所不答的樣子，是男主角的大方，偏偏你我局

  外人都瞧得出來真正說不出來的還在後面。這也是會有網友說「男主角教女主角『性』，

  女主角教男主角『愛」的一面」的原因。




  誰綁了誰？形而上的、具體上的。

  誰甘願為奴？誰才是誰的主人？臣服於權威者、控制者或是全然地臣服於過往？是臣服還

  是投降？是自認為不得不的遊戲模式還是無形的枷鎖約束著？檯面上男主角要女主角簽下

  合同，像是具體化與保障化兩者的底限並且互相同意這性遊戲(如果在有安全機制與保安

  底限的情況下)，卻也是替自已設下一次又一次的故步自封。以為安全的卻是重蹈覆轍，

  以為保障的竟是躲開傷痛的手法、逃避了最深層的恐懼。


  很明顯的是那十五歲(對照十五個女孩、五十道陰影)的轉折，那六年的「經驗」(母之友

  VS生母的身份VS養母的不知情)帶來的是往後「以為這就是最好的模式、以為這就是我的

  本來面目、以為這一輩子我就只能這樣對人與被對待」的鎖鍊，層層疊疊、一圈又一圈

  地無法自拔，逃不開也躲不了的如影隨形。



  所以，妳必須遵守規定，不能碰我。



  明明是最坦誠相見的身體，心裡的傷痕遠比肉體上的痕跡來得深不見底。總是聽來如此

  悲傷的鋼琴聲，做愛之餘不願多談內心的世界，到底是那五十道陰影？為何是陰影？

  女主角的離去，帶來的是男主角的改變契機或是再尋找下一個也罷？既有三部曲，顯而

  易見絕不會嘎然而止，故事必然延續著。分分合合，既緊密結合卻又離彼此遙遠不已。

  當必需透過「處罰」的模式來接近男主角時，那含著淚的數次數是令我眼淚決堤的界線

  ，為何不喊停？這會不會是重演了男主角童年的影像？


  你不可以碰我！(六下之後，換女主角會男主角這麼說)


  誰都不能碰誰，如此接近又如此抗拒，慾望體的結合卻怎樣也進入不了那真正的「禁地」

  ，這裡說的不是絕對領域或密房。是綁著、鎖著、困著的心房，接下來勢必有陣痛期卻也

  是男主角重生的契機，分道揚鏢絕無法如此灑脫，一個不一樣，一個轉變的來臨，一個真

  正痛徹心扉的時刻。


  總是會有那樣一個片刻，想要放棄自已，卻也總是有那樣的一個契機，一雙手、一道眼神

  、深情一吻，註定被救贖。兩人以各自的方式拯救了自已和對方。外在的道具、束縛的工

  具、鞭打的器具，種種停留在只是情趣用品或情人性趣的層面都比不上嗜血嗜肉的觀眾真

  正想看的定型化情色片。可是導演帶出了更深一層的涵義，更將畫面拍得如此唯美，那並

  非預期影評者哄堂大笑也非早就料想到「看不到或看不夠想看到的」人的怒火。是以陰影

  折射出希望的光芒，我無意導向所有地獄都必得有人陪同入獄才能一起解脫的公式，也非

  賦與「與虐待一線之隔」的合理化，是在那破題的「陰影」之下，看見有待縫合的傷口，

  那等待被正視的傷痛，那最深、最黑、最不能直視的片段。



  沒有人生來如此

  沒有人註定如此

  更沒有人永遠不得不如此


  那如果可以，男主角帶領女主角前所未見的黑暗世界，女主角深入黑暗又何嚐不是某種

  獻身、化身、祭身的赴道之路？修行與療癒正悄悄發生，以又痛又喜的版本展演，伴隨

  不可思議的高潮之顛，痛到深處的極悲極怒，又哭又笑正如光影相隨，鏡子反射的世界

  永遠不可能真正躲得了。遲早會有那柳暗花明的一天，隨著男女雙方的起起伏伏，進入

  一場情與慾、愛與恨、悲與喜、淚與笑的密戲世界，見不得光的陰影終將露臉，不能碰

  觸的傷口總會有治癒的一天，如果這一次再像一個手足無措的小男孩，用盡所有方法與

  的力氣之後，還能不能與敢不敢再相信一次被救贖的可能性？那曾經的欲顛欲狂、那曾

  有的叫天不應、那曾逝的美好純真，最後一次再掏出真心，最後一次再真正的坦然以對

  ，是否能再最後一次的「相信」？


  還是會不小心，一不小心又陷入更深的絕望裡？


  總是會有奇蹟

  總是會有轉機

  浴火重生總是有可能性


  據說，將會是個皆大歡喜的美麗結局


  我總認為所有的故事，結果從來不重要，重點是那過程。


  妳/你 終會被治癒、終將回家


  既是如此，結果已確定，那了不起的驚險與高潮跌起、人生起落的過程，才是重點！

  才是令人眼睛為之一亮之處。


  陰影，五十道。


  是昇華和蛻變的轉化劑與憑藉。


  --'
