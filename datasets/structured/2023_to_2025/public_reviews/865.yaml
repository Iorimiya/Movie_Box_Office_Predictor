url: https://www.ptt.cc/bbs/movie/M.1722826990.A.2C0.html
title: '[新聞] 《鬼才之道》包場燒電影票給好兄弟看'
content: '《鬼才之道》包場燒電影票給好兄弟看！道長「進場維持秩序」曝廳內氣氛



  適逢7月鬼門開起第1天，即將上映的恐怖喜劇片《鬼才之道》特地包下西門町台北in89豪

  華影城的最大廳，邀請超過500位的好兄弟們午夜12點準時入場觀影，讓他們在難得的放

  假月能有個屬於自己的「專場」。活動現場不只找來道長舉辦法會、進行普渡儀式，更用

  心將電影票燒給好兄弟，讓他們能憑票入場，好好坐下來看場電影。也盼有了好兄弟的支

  持，能讓票房上映開紅盤。


  《鬼才之道》由陳柏霖、張榕榕、王淨、姚以緹、百白、瘦瘦主演，描述陰間厲鬼們為了

  滯留人間，力爭上游創造都市傳說的勵志喜劇，監製陳怡樺分享：「《鬼才之道》是部描

  述陰間故事的喜劇，很早就計畫在鬼門開這天，放映給好兄弟們看，讓他們能開心度過這

  個屬於他們的假期，也為上映順利祈福、也求得票房佳績。」儀式過程不只大家拿香祈福

  ，更將電影票一張一張連同紙錢燒給好兄弟，邀請他們入場觀影。


  現場更請來傳承六代的百年道長李戊己道長為好兄弟們祈福，不只設下結界，也在廳外盛

  大舉辦了普渡儀式，李戊己道長表示「我們做法會，邀請了附近的孤魂野鬼們一起來享受

  美食、觀賞電影」，相信鬼們對陽間電影也會是充滿好奇，電影放映時他也特別進場維持

  空間秩序，笑說「廳內氣氛算是蠻平和的」。


  「給鬼看場」結束的隔天，同一地點也將舉辦給一般民眾參加的「鬼門開場」特映會，參

  與影迷都將能拿到一份由道士淨化過的「平安大禮包」包含平安鹽米、電影角色香片，以

  及象徵片中旺來大飯店都市傳說起點的「414號房鑰匙圈」。 《鬼才之道》將於8月7日上

  映。




  --'
