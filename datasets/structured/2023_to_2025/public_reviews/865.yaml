title: '[普雷]鬼才之道-莞爾一笑的黑色幽默 '
content: "1. 輕鬆喜劇，有娛樂到我，不到爆笑，偶爾令人莞爾一笑\n\n   適合周末無腦放空\n\n2. 節奏前段輕快，當中幾段文戲只點到一些，很可惜\n\
  \n\n\n\n\n\n\n雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n3. 本來以為王淨飾演的同學是主角，看後覺的凱薩琳更有故事性\n\
  \n   可惜去看了\"前男友\"的前因後果或心路轉變沒有演出\n\n   要代替同學且關掉414號房的轉變是什麼也沒有\n\n   但張榕容好美\n\n4.\
  \ 3位主要角色背後都有故事，但都讓我覺得\"啥?就這樣\" ，沒有特別的爆點\n\n   同學的故事連結到最後看姪子的那一句話\"沒有關係\"，雖然略懂他想表達的意思\n\
  \n   但也覺得\"就這樣?\"鋪陳的不夠\n\n   Makoto故事更讓我覺得，不知道也沒影響劇情，知道了對整體劇情也沒加分\n\n   反而還拖累了節奏，說不定就口述帶過就好\n\
  \n5. 喜歡陽間YT V.S 都市傳說的播報方式 ，兩組鬼互扯後腿的橋段\n\n   尤其把潔西卡的電視片段換成Makoto的歌舞片段，兩人用著最無辜的聲音\n\
  \n   做著狠毒的事情，好喜歡他們互嘴的片段\n\n   不過最後YT撞車又是為了什麼?\n\n   可惜沒有YT的影片，不然可能又是另一個故事了\n\n6.\
  \ 總結：有娛樂性，但文戲的地方不痛不癢\n\n--"
