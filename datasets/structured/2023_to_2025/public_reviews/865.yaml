title: '[ 好雷] 鬼才之道 我愛薩琳'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  8月初家人抽到本版的特映去看的

  原本沒看預告，只知道是王淨+鬼的票房保證

  後來才發現，原來是有我愛的張榕容




  蠻久沒看電影&國片，但一直有個會很尬的印象，雖然不是全部

  但每一部多少都會有一段會很想快轉

  而搞笑題材的國片尷尬感又經常更勝其他




  但鬼才意外的沒有給我尷尬感

  不知道是笑點的密集程度，還是節奏安排

  雖然剛看完會覺得角色跟劇情都蠻表面

  但或許就是不刻意抒情，或是刻意感動

  或是只點到為止就又馬上回去搞笑？


  至少讓我沒有被尷尬到，忙著笑了


  (但個人覺得片尾彩蛋有點毀掉前面的不尬......)




  笑點大部分也蠻打中我

  劇情設定增加了很多可發揮的笑點

  沒有讓人看的不適的低級梗或人身攻擊

  演員們也是不少都有不計形象的搞笑演出

  真的好幾個肢體搞笑的點我笑到爛

  很簡單很幼稚，但真的有戳到笑點



  覺得有點可惜的應該是，主角線真的有點無聊

  雖然鋪陳了，但最後沒有什麼反轉或是豁達的感覺




  然後最後私心推一下張榕容


  雖然王淨是主角，但可說是從她的角度敘事

  而故事裡戲份最重的就是張榕容演的凱薩琳

  真的沒想到她可以這麼好笑，很放的開

  我愛傲嬌薩琳(比心)



  另外真的覺得很多故事設定都妙

  很多細節跟梗都會覺得怎麼那麼有才

  推薦給壓力大的朋友，去看看這些做鬼的社畜






  --'
