url: https://www.ptt.cc/bbs/movie/M.1724088873.A.604.html
title: 'Re: [討論] 鬼才之道票房慘輸角頭的原因探討'
content: '會不會是台灣喜劇並沒有基本盤？但是八加九片有？


  印象中，以前真的大賣的喜劇片，都是靠有號召力的演員，像是豬哥亮，豬哥亮去世後，台

  灣沒有什麼特別能扛喜劇片的演員，觀眾有沒有特別期待這個。


  但是黑道片有一個特定族群會看、愛看、還會到戲院支持，而且這個基數還不小，角頭我現

  在只有看到一個也還好的預告片，但是票房就夠破五千萬了。


  其次，我覺得鬼才之道已經把行銷做到底了，以國片標準應該無可挑剔了，那就真的是劇情

  與口碑，還有，會不會是設定的太老，導致年輕人沒有共鳴呢？畢竟什麼玫瑰之夜都三十多

  年前的了，近十年好像沒印象有什麼靈異節目，就連Jump scare網路影片都是很久以前的玩

  意兒了，如果觀影主力是年輕人，會不會這些他們都毫無感覺呢？


  然後劇情問題，雖然說王淨是主角，但老實說劇情推動與情緒轉折反而多在凱薩琳這邊，王

  淨感覺不是很重要，makoto甚至可以直接砍掉，或許可以多一些篇幅營造有點高潮，不然一

  直塑造鬼委會，感覺沒去弄蠻可惜的。


