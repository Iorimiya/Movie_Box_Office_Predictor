title: '[討論] 原來鬼才之道香港上映了 票房也不佳'
content: '上週四上映

  截止至周日的首周末票房為811725港幣

  換算台幣332萬

  難怪官方社群靜悄悄


  香港人的觀影口味跟台灣很接近

  近年來也算是很捧台灣電影了

  很多台灣電影都會去香港上映

  結果香港也只賣成這樣

  可見是台港觀眾口味一致的不太感興趣


  主創團隊真的該好好檢討

  為什麼一個三年前轟動網路的前導片

  獲得索尼注資、發行的資源

  最終拍成長片是這種成績?

  真的太令人失望了


  --'
