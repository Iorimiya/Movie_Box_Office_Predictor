url: https://www.ptt.cc/bbs/movie/M.1743235624.A.43A.html
title: '[普雷] 《鬼才之道》 '
content: "Netflix最近上映了\n很多朋友應該都看過\n雖說果然不是很喜歡\n\n但說一下個人看法\n\n\n\n\n雷文防雷資訊頁\n\n\n\n\
  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n  (刊登於網誌的原文)\n\n\n\n看了《鬼才之道》大概能理解為何票房不好，電影以台灣式鬼片結合綜藝節目、網紅爆紅\n\
  等傳統電視過渡到現今網路影音的拼貼形式，劇中像是一種鬼片迷的解構，許多幽默展示\n著鬼如何嚇人的幕後過程。但會令人想到之前去復興商工兼課，往往發現原本想要藉由讓\n\
  他們欣賞超級白癡的影片去激發同學要發揮白癡的創意用在自己製作影片上面，卻發現自\n己正在面對的世界，就是白癡的影片本身，後面根本沒有任何東西了。\n\n\n只是複製活人世界「冠之以名」的死人世界，電影的設定可以置之不理實際上佛教或道教\n\
  的生死觀；或是此「無害烏托邦」 正好無法述說著，正是「死亡是活著的意義」，意思\n是在死亡之前的意義，其實都是沒有意義的悖論。無法述說著，如此欠缺在電影中只是被\n\
  定義成消失，或魂飛魄散等「活人鬼片」定義的失敗，正是這種失敗對應著電影中平凡之\n人即將消失的倒數期限中，誤打誤撞的爆紅，悖論或精神分析式的：如何成為不恐怖的厲\n\
  鬼，卻依舊對於眾人簇擁的嚮往，同時符合電影中建立一套「不紅可能會消失」的制度，\n藉以「反」映（諷）演藝圈、媒體生態的冷血。\n\n\n根本的原因並非是「正或反」，而是藉以否定他者的自我肯定，是俗世表面的功成名就，\n\
  乃至於女主角王淨自認庸才且胸無大志的平常人本身，其實「他/她們」才是必須被肯定\n的他者。自我死去，他者會繼續存活，如同沒人會知道真正的死後世界，但「電影」卻自\n\
  作聰明得很，把平凡者「再現」成一位努力追求功成名就的活人自我，同時發生在電影中\n宣稱的「死後世界」中。（精神分析式悖論）。\n\n\n失敗並非失敗，消失並非消失，如此無法被述說，印證著人生悖論；對應著電影中的悖論\n\
  ，沒有「真正死亡」的世界（注意，不是人不會死），一切都有意義（明顯電影比較把心\n力放在對於鬼片解構與綜藝挪用的幽默感，而非編劇上的巧思），但也都沒有任何的意義\n\
  （後面根本沒有任何東西了）。\n\n\n如同清明節掃墓聽到親戚在討論分完家產，哥哥怎麼不一起把房子拿去都更這樣，死者早\n已安息，活人繼續在現世糾纏。\n\n\n\
  --\n\n拉特飯 - 以商業力量進入獨立市場\n\n--"
