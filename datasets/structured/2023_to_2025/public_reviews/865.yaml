url: https://www.ptt.cc/bbs/movie/M.1723557594.A.1E7.html
title: '[ 普雷]  鬼才之道 有點好笑不到癢處'
content: '當初剛看到鬼才之道預告片時

  覺得整個劇本蠻有創意的



  但上映後好像票房不如預期有點意外

  看了網路評價也是相當兩極

  於是今天抽空去電影院一探究竟


  下午ㄧ點半場次影廳裡只有六個人

  想當初「鬼家人」我也是這時間來看但人多很多


  隨著電影開始播放 劇情有吸引住我的專注力

  可是笑點的部分...我ㄧ直到王淨第一次演出那段才開始笑出來，眾人邊各種出包邊要完

  成

  任務的這種架構雖然也是老套，但各種笑點確實安排得不錯，但這已經是電影的一半了。


  最後結尾的大亂鬥也蠻有趣的

  或者說後半段比前半段有趣


  最後的淚點其實沒打中我

  我比較感動的反而是中段在描述王淨生前故事的時候，那種尋求人生唯一認同感的無助我

  竟然相當有同感...


  整部戲看完，總覺得我有笑但又好像沒有喜歡這部的粉絲講的那麼好笑。我覺得有趣，但

  又好像沒搔到癢處，畢竟鬼家人我是真的從頭笑到尾


  而讓我感覺這兩部最大的差距應該是

  整個角色對白的表現「鬼才之道」口語很不自然，很像在演出舞台劇，搞笑也不是不經意

  那種而是很刻意。直到後半段才感覺整個都放開來...當然這只是我的個人感受。但我想

  這

  些缺點也許才是評價兩極的原因吧。


  真的覺得很可惜

  劇本真的是相當特別


  --

  其他四個都坐我旁邊是你會沒感覺嗎'
