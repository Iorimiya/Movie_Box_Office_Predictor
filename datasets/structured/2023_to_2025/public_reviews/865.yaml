title: '[好雷] 以商業片標準合格的鬼才之道'
content: '雷文防雷資訊頁

  國賓













  這部片 其實看起來蠻順的 笑點自然 我有笑出來 講話也很自然 像是正常人在講話 沒有我

  之前看國片的某些棒讀感 不像正常人講話的感覺 全程很順的看完 大體沒有不耐煩的感覺

  有時光飛逝感 體感上覺得片子不長 有幾個感動點 也蠻能感同身受的


  主要角色其實演的都不錯 潔西卡跟凱瑟琳有飆戲的感覺 王淨就還行 比較是偏內心戲

  mokoto最後在片尾一直出現 不知道這是真的陳柏霖年輕有拍過還是假的


  但我其實比較有興趣鬼委會的收費 甚至我還以為最後是會對決鬼委會 結果收尾有點普通

  就太溫情了 皆大歡喜不是不好 但我覺得需要先有一個比較強的高潮 我是覺得網紅祭改偏

  弱啦


  但是這片在我看過的國片 已經算是蠻不錯的 電影院連我只有五個人 有點可惜


  ----

  Sent from  on my Google Pixel 4a


  --'
