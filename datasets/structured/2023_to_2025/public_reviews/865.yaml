url: https://www.ptt.cc/bbs/movie/M.1719618567.A.987.html
title: '[微微雷] 鬼才之道，鬼才知道'
content: '就是愛在電影院──在中山堂


  <鬼才之道>  9.5/10.0


  "鬼才之道，鬼才知道" 這是雙關語。


  用一句台灣人的口語對白，透過大家最喜歡的雙關，而發展一段看似荒謬，卻看盡人生的

  一齣爆笑喜劇。


  這部片看似恐怖片，但卻處處溫馨爆笑。恐怖片只是包裝的糖衣，但電影說的是(演員)人

  生就是起起落落，想盡辦法被人看見，被人評比，但最後還是要走出自己的路。


  電影很多很多有趣的橋段，而且一點都不恐怖，所以不要被海報或是宣傳給騙了，而不敢

  走進戲院看。


  裡面有很多大家的共同回憶。


  雙關梗真的超級超級多，台灣人真的非常愛這些東西


  有我目前最討厭的<藍色恐懼>致敬，每次看到這套衣服，我就會想起那張噁心的臉

  (導演也說就是為了致敬他最喜歡的今敏導演)


  電影上映時，大家可以走進戲院看這部有趣的電影。

  大仁哥非常非常的有趣，大家要坐到最後的最後。

  (片尾看到認識的人的照片，真的是好意外啊~~)







  --

  好恨啊?（稱讚意味'
