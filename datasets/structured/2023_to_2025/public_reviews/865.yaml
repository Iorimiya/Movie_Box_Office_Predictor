url: https://www.ptt.cc/bbs/movie/M.1724054077.A.5CA.html
title: '[好雷] 大推徐漢強的鬼才之道'
content: '昨天跟朋友看了現正熱映中的《鬼才之道》（Dead Talents Society）


  徐漢強真的是從片名開始就展現了才華，鬼才知道、鬼才之道^ - ^


  昨天聽朋友說徐上了台通宣傳，講到拍這部片的原委，原來徐在拍完《返校》之後就憂鬱

  症纏身，甚至到了看鬼片都覺得女鬼其實已經非常努力在嚇人了。


  所以這部《鬼才之道》開頭就是跟大家說，即便當了鬼也要努力被看見，被看見才能繼續

  存在，真的是當鬼也TM累阿!!!!!!



  我就不爆太多梗了，只能說這一部非常有可能就是今年最佳兼具商業性質又闔家歡樂的國

  片。


  非常值得看!!!!大推啊!!!!（拇指）

  請大家不要錯過!!!


  不論在劇情、鋪陳、鏡頭畫面、演員演技都是上乘！




  然後必須誇獎一下演員，天選演員群啊!!!!!


  完全沒有大家對於國片喜劇的尷尬刻板印象，完!全!沒!有!!!!


  王淨、張榕容、陳柏霖、姚以緹、百白.......全員演技在線中～～～


  張榕容跟陳柏霖兩個真的也很有CP感，旺來小隊的化學反應很好。


  姚以緹什麼都不用做，真的是化好妝在那邊笑就很有恐怖感了。



  這些選角真的是PERFECT！！！

  100分啊！！！給卡司團隊加雞腿！！！



  大推~~~請大家千萬不要錯過。




  最後講一下英語片名（Dead Talents Society），Robin Williams的經典電影《春風化雨

  》英文原名就是（Dead Poets Society），羅比威廉斯也是深受憂鬱症所苦，不知道徐漢

  強是否在取名的時候也有在致敬春風化雨呢?


  真的是從片名到電影都讓我驚艷不已的一部電影阿~~~~



  --'
