title: '[好雷] 鬼才之道 能理解的虎頭蛇尾 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~













  整部片我都很喜歡

  最讓我錯愕的就是結尾

  雖然我能理解

  導演想表達的是告訴大家，不一定要多特別或優秀

  所以這樣收

  但真的會一種"蛤!?"

  可能片長不夠或是想不到怎樣能不特別的結束


  美中不足的是消失的觸發太隨便

  同學她爸放滿那麼多照片，還會消失實在是

  寧願設定每個鬼本來就都會消失



  不過整部片我很喜歡

  笑點自然

  很多國片的笑點都很尷尬

  本部的笑點很自然

  在刻意的厲鬼圈中，笑點都很順暢


  不亂罵髒話是我覺得超棒的地方

  海角七號後，很多國片好像都要髒話連珠炮才叫真誠

  好像笑點就是罵髒話

  本部片沒這東西



  整部片也不賣慘賣苦

  誰說要感動人就一定要各種機率超低的事件呢



  我滿喜歡這部片的

  還好有進場

  不過看票房好像不妙(?)

  我覺得是預告剪得沒有很好


  我個人近年來進場看最生氣討厭的國片就是鬼家人

  同樣是王淨，但就內容差很多






  --'
