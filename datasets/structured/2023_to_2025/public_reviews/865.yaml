url: https://www.ptt.cc/bbs/movie/M.1746629469.A.B93.html
title: '[好雷] 鬼才之道：真的能躺平嗎？ '
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n最近版上都是雷霆特攻隊，還沒時間去看，很快又要去看阿湯哥，先把4月這篇補上來。\n\
  \n我的每月一片計劃：\n2月 懼裂 \n3月 美國隊長4 \n4月 鬼才之道 \n\n「鬼才之道」想傳遞的訊息，不比導演前作「返校」所負擔的歷史重量來得輕，甚至也\n\
  被多數人認為是個長久以來的「亞洲」議題。\n\n說真的剛開始還覺得「子不語怪力亂神」，充其量就是包裝成鬼界的綜藝圈吧，結果出\n乎意料的，是講人的電影。\n\n\
  關於展示人性那一面，我們很快就在第一場戲看到，潔西卡在電視節目上逮到機會上位\n，把握住機會一炮而紅，這的確也是隨著手機世代的來臨後行銷思維的大轉變，目前電\n\
  視圈和YT圈的生態在在說明了一切，當自媒體崛起，你可以選擇心儀的節目，不是在固\n定幾個頻道間按遙控器，被電視台強迫推銷，在這部電影裡，潔西卡讓你甚至可以選擇\n\
  自己撞見鬼。\n\n鏡頭拉到攝影棚外，公園裡的鬼們努力嚇人，竟是為了「證件」和「業績」，看來過世\n後的日子也是做一天和尚撞一天鐘，有一個書呆子形象的孤魂野鬼，叫做「同學」，有\n\
  天他發現自己雙手漸漸模糊，上網一查知道如果被活人遺棄代表存在價值的物品，便會\n在30天內魂飛魄散，為此他去報名選秀，因緣際會被經紀人Makoto看中，將奄奄一息的\n\
  經紀公司飯碗寄望在她的身上 — 真正鬼生才開始這句話，未免也太殘忍，都瞑目了還\n不讓我休息啊！\n\n過程當然是有笑料、有挫敗，無巧不成書，凱薩琳腳一踢，同學的慘狀嚇死一對情侶，\n\
  結果一炮而紅，再次應證手機錄影和網路的力量是本世紀推動時代的巨輪，「同學」的\n厲鬼證也終於入手。\n\n說來人類真是矛盾的動物，直到往生後也相同，原先只是為了「不消失」，跟他在世的\n\
  時候為了一張假的獎狀努力著一般，上節目被取笑卻有如氣球被戳破，腦中冒出「我不\n配享有這些榮耀，我是魯蛇」的否定心態，至此她已無法再堅持下去了。\n\n在此我們看到凱薩琳做出人生選擇，以同學的替身亮相（你各位啊！職場中流砥柱就是\n\
  要有這種魄力啊！），這場由鬼委會主導和網紅團體在旺來大飯店的拼搏，不僅僅是人\n類與鬼界的較勁，也是凱薩琳跟潔西卡的互別苗頭。\n\n嚇著嚇著兩個人終究還是自己打起來，眼看鬼嚇人的目標即將失敗，即將失去證件灰飛\n\
  煙滅，同學的奮力一跳，不僅挽回了頹勢，也是他自己的自我突破，克服恐懼的一瞬，\n可謂職涯的關鍵時刻。\n\n我最喜歡的一段就是所有旺來大飯店的團隊成員奮力跑在馬路上，都穿著制服胡亂地大\n\
  吼大叫，是那麼地純真且無慮，我想這也是在為電影人集體發聲吧，藉由共同完成一部\n作品，人生在努力的過程中獲得意義，他們可能不是功課頂呱呱、成績優異的一群，但\n\
  是拍攝的過程和票房的成就映照著他們走過的路，似乎有看到採訪說，這是徐的人生經\n歷改寫？\n\n拉到社會層面，我隱約覺得這是一部拍給「躺平族」的電影，上一代常常說「要休息，\n\
  等到死了在休息」，但人生的意義真的在於汲汲營營、給有錢人打工嗎？我想大家都同\n意不是，只是我們在付出勞動取得相對應報酬時，發現財富都累積在上一個世代上，對\n\
  「努力」的精神反動以及對上個世代的抗議下，躺平、擺爛，再努力也沒用的氛圍充斥\n整個社會，可是擺脫「當責」、「解決問題」、「團隊分工合作」，煩惱便能就消弭嗎\n\
  ？自掃門前雪真的就善其身嗎？考了好大學，真的就可以由你玩四年了嗎？我想已經踏\n入職場的我們都有感而發，不是的，挑戰一直在，你就算不婚不生幸福一生，不代表煩\n\
  惱就真的根絕了。\n\n東亞家庭普遍有種「萬般皆下品，唯有讀書高」的偏激想法，事實上只是因為許多知識\n日新月異，需要更精細的操作，醫療產業如此、半導體產業如此、汽車工業如此，但建\n\
  造房子的工班不重要嗎？清掃公共區域的職員不重要嗎？我記得國中小篇課文叫做「那\n默默的一群」，也是在提醒人生路不是僅有一條，如果社會一直這樣看待下一代，躺平\n\
  在所難免。\n\n死掉之後還是「累」啊，你看看凱撒琳和傑西卡，是不是我們職場中常看到的前後輩劇\n碼，你看看卓曉雷和卡蜜拉，是不是我們人生中和家裡內難解的題，你看Makoto長那麼\n\
  帥卻依然紅不了，鬼委會就跟每個組織一樣金玉其外，人生那麼多maybe，活在當下、\n聚在一起時笑得面對，只有這樣，你才不枉活過一回，這個東西，連鬼都知道，希望生\n\
  而為人的你與我，都能銘記於心，正向迎接每一個新的一天。\n\n\n--\n--\n\n\n\n\n∕〈 \n\n--"
