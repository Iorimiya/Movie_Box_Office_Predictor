url: https://www.ptt.cc/bbs/movie/M.1724541153.A.2BF.html
title: 'Re: [討論] 關於《鬼才之道》本身的行銷與票房力'
content: "這一點在看的時候就有一點同感\n  劇情有點想賣懷舊情感卻又不夠深\n  笑點想借鏡現在的笑點卻又太過淺\n\n  90年代的恐怖不是只有玫瑰之夜跟紅衣小女孩\n\
  \  幽靈船跟鏡子前削頻果之類的鄉野傳奇都是很好運用的素材\n\n  不少笑點的梗都有點借用網路梗或笑話有點過於淺碟\n  很少讓人印像深刻或笑的很大力的點\n\
  \  也或許這些演員們在演喜劇上的喜感不夠\n  （腦海裡第一個浮現的是林美秀）\n\n  賣舊情懷之餘還兼搞笑，這一點死侍與之金鋼狼就做的很到位\n\n\n\
  \  總之在看完的時候感想是整體還不差，但好像都少了一點味道\n  看前導預告時預期會是一部80分以上的恐怖喜劇片\n  但看完後感覺像部70分左右的搞笑溫馨片\n\
  \n--"
