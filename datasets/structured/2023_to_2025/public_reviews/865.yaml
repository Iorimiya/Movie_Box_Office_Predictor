title: 'Re: [普雷] 鬼才之道'
content: '這兩位的表現真的是非常的搶眼

  不過蠻有趣的是戲裡面張榕容演的是熟女大姐形象而姚以緹是後進年輕網紅造型

  兩人都把這身分設定的味道演出來但真實年齡其實張榕容還比較小

  王淨也沒有演的不好甚至還是很可愛，但上面兩位太強了氣勢上被壓倒



  看完覺得喜歡這部片，但整個劇情就很傳統學院派的起承轉合展開

  劇情上沒存在任何爆點，譬如"同學"的死因用的隱喻其實明顯到不行，並不存在轉折點

  以電影來說缺乏了戲劇性的效果，且很多劇情也是埋的粗淺收的潦草

  譬如前面提的"同學"的死因、Jessica跟凱薩琳的關係、凱薩琳和前男友的關係

  Makoto的死因等等

  如果組織一下改成8-10集的連續劇好好處理說不定還比較好一點

  還是一部可以看的電影，只是看完覺得很多可惜的地方


  至於makoto那些尷尬的橋段(包含片尾)

  其實反而比較像是電影會有的呈現方式(無論喜不喜歡) 所以個人覺得還OK


  --'
