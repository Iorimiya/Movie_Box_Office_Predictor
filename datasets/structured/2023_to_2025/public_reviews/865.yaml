url: https://www.ptt.cc/bbs/movie/M.1642575696.A.FF5.html
title: '[新聞] 索尼影業將投資徐漢強新作《鬼才之道》'
content: '(Deadline原文新聞)


  (以下轉發台灣索尼影業官方新聞稿)


  《鬼才之道》由徐漢

  強編導，是其6分鐘前導影片的延伸，由陳柏霖 (《我可能不會愛你》金鐘影帝) 與張榕

  容 (《陽陽》亞太影展影后) 擔綱主演，並由台灣金獎製片人李烈、李耀華，以及陳怡樺

  共同監製。




  《鬼才之道》監製之一陳怡樺說：「與索尼影業討論合作細節的時候，感受到他們都是給

  予樂觀支持，這點是最難能可貴。在今年台灣疫情下，原本2021拍攝時程延到2022年，一

  度擔心會受影響，沒想到索尼影業完全尊重我們並給予最大的鼓勵和耐心，順利促成此次

  投資合作。」


  本片出品人身兼監製的李烈有感而發：「過去也有國際資金投資台灣本土內容，而索尼影

  業國際製片願意大手筆投資《鬼才之道》，是台灣電影產業往前進繼續拍下去的一大步。

  」


  李耀華也是《鬼才之道》監製之一，她對此次合作表示：「我們與索尼影業國際製片共同

  的目標就是把片子拍好，讓觀眾看到不同面貌卻又能打動人心的喜劇片。」


  索尼影業台灣分公司總經理余卜康樂觀表示：「索尼影業國際製片持續與亞洲本土優秀電

  影人才合作，並一直在尋找具有國際格局的項目投資。對於這次的合作我們深具信心，也

  希望讓全世界看見台灣電影的無限潛能。」


  《鬼才之道》前導短片：


  ------


  恭喜徐漢強


  《鬼才之道》也是索尼影業自從《臥虎藏龍》《雙瞳》後睽違近20年再度投資的台灣電影


  而且索尼也直接把翻拍版權買下來 越來越期待成品了 期待


  --'
