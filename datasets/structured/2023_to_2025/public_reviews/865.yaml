title: '[新聞] 王淨《鬼才之道》把路人變影迷'
content: "王淨《鬼才之道》把路人變影迷\n\n徐漢強喊累放棄《還願》導演筒\n\n04:10 2024/08/07 中國時報 李承陽\n\n\n陳柏霖6日出席電影首映，分享拍攝幕後心得。（牽猴子提供）\n\
  \n陰間題材喜劇電影《鬼才之道》6日舉辦首映會，導演徐漢強率領主演陳柏霖、張榕容、\n王淨、百白、瘦瘦、姚以緹、黃迪揚等人出席。電影近日舉辦多場特映，演員們收到不少\n\
  反饋，其中王淨分享，某場映後自己收到1張觀眾送的卡片，內文開頭竟是對方直說自己\n沒有特別喜歡她。\n\n王淨分享卡片內容：「那個影迷說他沒有很喜歡我，但他後來因緣際會看到《鬼才之道》\n\
  的發酵口碑，就有搶到票。然後他說看完很想帶他父母一起進電影院看。」一番路人轉成\n影迷的心底話，讓她看完信後印象深刻。\n\n陳柏霖說，跑了多場映後座談，已搞不清自己是陳柏霖還是片中角色MAKOTO，「我有時不\n\
  知道自己是在哪個時代，有時把自己放在剛出道的時候，沒想到角色會帶我到這個地方、\n把我帶到以前，對我而言還是很不真實。」\n\n張榕容發現有很多女兒帶爸媽去看，讓她十分感動，片中她飾演鬼界天后，「凱瑟琳（角\n\
  色名）讓我預習了30年後的樣子，希望我以後是1個受人尊敬的前輩，要是善良並且提攜\n後輩的，會想要分享很多經驗。」\n\n另徐漢強說拍完《鬼才之道》後打算休息一下，更親曝已主動放下億萬票房恐怖片《返校\n\
  》同製作公司的續作《還願》導演筒，「我已跟烈姐（監製李烈）請辭了！不會再拍《還\n願》，因為連續拍兩部長片，身心需要休息，再拍下去可能會瘋掉。」現階段對他算是1\n\
  個休止符，至於《鬼才之道》是否是最後1部作品？他笑回：「要這樣講也可以。」\n\n#陳柏霖 #分享 #導演 #王淨 #多場\n\n--\n\n 是菩薩成佛之道\n\
  \        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
