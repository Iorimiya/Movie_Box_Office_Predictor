title: 'Re: [討論] 關於《鬼才之道》本身的行銷與票房力'
content: '我覺得就很簡單


  如果你是一位一個月只看一場電影的人


  八月你進電影院要看電影


  這部不會排到前三


  死特、異形跟角頭都比較適合


  這幾部就很適合配著爆米花在電影院看大螢幕


  畢竟有大腸面


  鬼才只有開頭凱薩琳嚇人那段


  有那種吃爆米花配大螢幕會很爽的感覺


  不然等串流再看也沒差


  尤其國片通常很快就上了


  至於為何同是國片的角頭可以有好成績


  因為他個死特還有異形一樣


  已經是第三集以上


  前面幾部有打出好口碑


  自然把受眾比較少的國片市場幾乎全吃光


  不過這部行銷一開始真的搞錯方向


  比起一開始去主打愛的視線


  不如拿夜市緣去吸引暴雪玩家或前暴雪玩家


