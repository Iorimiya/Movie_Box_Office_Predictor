url: https://www.ptt.cc/bbs/movie/M.1724082411.A.1FB.html
title: 'Re: [討論] 鬼才之道票房慘輸角頭的原因探討'
content: '我是覺得你列出的三點只有第1點比較實在


  我之前也在板上發過心得文算有點出這個尬點



  就是很像看了綜藝娛樂片，你說好笑、但真的也找不太到好笑點在哪裡


  大部分評論就是「很好笑」「很商業」「不看可惜」之類但都太過瑣碎


  這或許大大影響口碑傳播，因為你總是得有想像空間才會有期待才會想進電影院


  如果透過別人口耳相傳你還是沒有個畫面想像，那是挺難勸進戲院的


  然後我個人是覺得預告也佔部分問題，如同我之前心得文寫到光看預告剪法就俗到讓我興致缺缺


  反倒事後回去找前導片才有眼神一亮的感覺...


  以我一個對鬼才認識完全是0的觀眾而言


  鬼才前導片會讓我期待甚至傳給同道中人，有意願進戲院

  鬼才正片預告會讓我想說喔又一個豬哥亮賀歲片，把錢省下來


  就是這樣的差距


  然後我自己是對角頭完全沒興趣的


  但不得不說它預告都拍得比鬼才之道預告吸引人囧...



  這到不是問題，多的是心魔當反派的好劇本，鬼才比較大的問題是三女角的心魔

  關係太瑣碎凌亂，尤其同學這個被從凱薩琳、潔西卡、MAKOTO中各抽出一些元素來組成的角色，其實很薄弱，還加上一個根本可以砍掉的卡蜜拉


  劇本缺乏的是將這些角色好好琢磨與精煉，不然連陰間主委、紅衣小女孩、黃色小飛俠、林守娘都能夠好好發揮讓觀眾有驚喜/嚇的彩蛋



  這點是真的隨便到不行，我知道可能想省飛天遁地的特效經費啦...但你讓幾個鬼吃個零食唱著歌，不知不覺在床上睡著然後再大白天撒落的陽光下從床上彈起來


  這給人體感根本大學生文藝片吧


  想到哪打到哪，唉，只能說，加油啦


  鬼片不一定要恐怖


  鬼片不是不能搞笑


  但氣氛有沒有做足是真的很重要


  看看人家整鬼專家怎麼弄得又好笑又驚悚又不會讓人出戲...


  --

  個人覺得改過前的劇本，應該是追逐光環的凱薩琳=潔西卡與makoto理念不合分道揚鑣，makoto則跟無敵破壞王的達叔一般，決定力捧一個拙拙新人同學去參加鬼燈獎，最終成功化解凱薩琳心魔的搞笑喜劇為主軸


  但最終這條主線就拆成凱薩琳、潔西卡、makoto、同學的四主角戲碼'
