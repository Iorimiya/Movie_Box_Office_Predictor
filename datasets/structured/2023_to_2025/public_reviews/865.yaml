url: https://www.ptt.cc/bbs/movie/M.1723180938.A.D4F.html
title: '[好無雷] 做人好累，做鬼好難！'
content: '第一次來發文推薦電影

  看完的第二天來發文推薦這部電影

  從之前看到前導預告片

  我就一直很期待這部電影的上映

  只是沒想到拖好久

  拖到我都忘記這部電影

  直到看到全聯的廣告我才又想起來

  於是馬上在上映的第一天就跑去看

  我原本想說應該很多人

  結果沒想到人有點少...大概二十多位

  不過看完這部電影

  我可以說是

  我今年看過最好笑最喜歡的國片電影

  整場全部的人大家都一直笑出聲

  而且都笑的還蠻大聲

  以至於這氛圍讓我也敢放聲大笑

  我原本對陳柏霖張榕榕很無感

  但在這部片喜歡上他們

  尤其是張榕榕！！

  怎麼可以這樣漂亮！！

  她真的有把凱薩琳這腳色給演活起來

  我其實以往對於國片台劇

  都很擔心演員這一塊

  因為怕演技很尬...但這部我真的要說

  每位演員都把自己的腳色給演活起來

  到現在我都還能記得很多片中的鬼

  雖然劇情還是有些Bug讓我歪頭思考了一下

  但整部我真的很喜歡

  到後面王淨演的同學有讓我哭出來

  我想應該很多女生會在這邊會有所感觸

  我很喜歡這部電影有一小段的暗諷

  在那邊講男鬼在另一個世界的生存難處

  在這世界好處都被女鬼全拿走

  也很喜歡飯店老闆娘那個樣子

  有夠好笑

  看完這部電影是有讓我把這段期間累積的壓力

  給完全大笑釋放出來

  以前有時候都會在想

  永遠想不明白的問題

  會不會在另外一個世界就有所答案

  走的每一步都感受到累時

  會不會在另外一個世界就有所輕鬆

  這部片剛好也告訴你

  沒有

  就是一樣想不明白

  一樣還是得要為了生存而努力

  不管做人還做鬼

  好好活在當下有所感受才是重點


  Ps:看完電影之後，很想跟工作人員換凱薩琳的特典扇子..因為潔西卡好卑鄙，偷放積木。


  ----

  Sent from  on my Samsung SM-F7110


  --'
