url: https://www.ptt.cc/bbs/movie/M.1743509316.A.F5F.html
title: '[普雷] 鬼才之道'
content: '開頭蠻新穎的，


  但沒有認真架構鬼的世界讓人沒辦法認真看下去，


  我覺得最疑惑的地方就是，


  1.鬼有痛覺?  都已經不會死了結果還有痛覺?


  2.鬼到底有沒有實體?  照理來說應該沒有，


  不然那麼多鬼，每個看起來都跟人類一樣智商不高，


  早就一天到晚發生靈騷現象了，


  所以我覺得要讓鬼有實體或顯像應該給個條件。



  撇除掉鬼的這個概念，


  其他的都已經是以前電影拍過的概念了，


  因為很大程度是把人類的世界搬過來照拍而已，


  披上鬼的外衣，但其實做的也是人的行為。


  --'
