url: https://www.ptt.cc/bbs/movie/M.1744853701.A.B00.html
title: '[普雷] 鬼才之道'
content: '對把台灣的都市傳說拍成喜劇這件事就滿有興趣的

  結果看完覺得題材真的滿新、滿有創意的，但整體好像少了點爆發力


  電影把台灣都市傳說當背景，把鬼嚇人這件事變成一種「職場KPI」

  像什麼陰間記者會、鬼界演藝圈、紅不起來就要消失那種設定，真的很有梗也很有想像力

  尤其看到鬼們為了嚇出業績還要搞宣傳、蹭熱度，超級貼近現實娛樂圈


  但就不知道為什麼，看完後心情是平的

  不是不好看，但就是覺得故事到某個地方後，好像少了那種一拳打進心裡的爆點

  不管是感情線、主角成長、或是結局安排，都有點可惜一點點的感覺


  --'
