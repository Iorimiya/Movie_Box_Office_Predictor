url: https://www.ptt.cc/bbs/movie/M.1722963238.A.CDB.html
title: '[好無雷] 鬼才之道  '
content: '三年前看過此片的前導預告就非常喜歡


  逗趣的世界觀與台詞讓我深刻


  直到看到正式預告反而沒有那麼的驚豔


  衝著這幾年的期待，買了今晚的松仁威秀特別場


  還好有來看


  真的很有趣!! 帶點微黑色幽默的風格，步調還算順暢，有幾幕很好笑


  偶爾出現尷尬的台詞與狀況


  但瑕不掩瑜


  是一部成功的國片


  難得國片不是黑道也沒有太重的青春愛情


  個人沒有很喜歡鬼家人


  但這部我可以，很可以


  張榕容超美~!!!


  如果最近生活有點不順，或是想放空看個熱鬧電影


  非常推薦(部分劇情還有點感人)


  --'
