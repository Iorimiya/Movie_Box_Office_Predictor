url: https://www.ptt.cc/bbs/movie/M.1672028152.A.E90.html
title: '[新聞] 《鬼才之道》開拍，陳柏霖 張榕容 王淨'
content: '新聞網址：



  觀眾期待已久，，過程艱辛。

  《鬼才之道》劇本由徐漢強與蔡坤霖一同完成，蔡坤霖曾以電影《下半場》入圍2020年台

  北電影獎最佳編劇。兩人從前導概念影片開始合作，徐漢強原本想拍一部比較輕鬆的喜劇

  片，沒想到《鬼才之道》從劇本開始一點也不輕鬆，修本次數超過20次，中間經歷無數次

  撞牆期，他也坦言前導太成功也是壓力超大。徐漢強表示，當初前導只是一個概念，當故

  事繼續發展必須要讓觀眾能夠迅速進入陰間世界觀，並且在掌握喜劇節奏下要讓每句對白

  都不令人尷尬。尤其這次加入許多意想不到的新角色，



  ，兩人對於電影都抱持最高期待

  。陳柏霖一收到完稿劇本當天，一早馬上打給徐漢強說：「這劇本也太棒了！」陳柏霖從

  讀本、排戲、到開拍，都活力十足，完全就是Makoto本人。陳柏霖說：「Makoto這角色將

  會打破觀眾對我的想像，光是造型上就有很大的不同，鬍子簡直神來一筆，而且還有許多

  超乎大家預期的劇情，絕對會在大銀幕前笑翻。」



  ，她從開拍前三個月就開始動作訓練，調整柔軟度。這之間張榕容也深受過敏所苦，為

  了完美，週週得到醫院治療，克服萬難呈現出霸氣鬼后凱薩琳的風範。張榕容說：「等了

  兩年終於開拍了，不但在造型上與時並進，許多鬼技也會跟上時代的腳步，到時候大銀幕

  看到鬼后出場絕對會嚇一大跳！」


  ，她飾演

  一個生前從未有任何成就，死後也不知該如何努力的菜鳥鬼「同學」，王淨特地在造型上

  掩蓋原有的陽光氣息，「全」素顏上陣，展現極度毫無自信的憔悴感，還有邊緣人樣貌。

  王淨說：「看到同學這個角色，自己有很強烈的投射感，而且可以再跟徐漢強導演合作也

  很有安全感，會全力以赴讓觀眾看到做鬼也好難的。」


  電影《鬼才之道》全新概念的陰間喜劇，由

  。故事劇情從一間沒落的都市傳說「旺來大飯店」414號房開始，過氣女鬼天后凱

  薩琳與鬼經紀人Makoto為了在鬼界不被時代淘汰，得找尋出路，力爭上游的厲鬼們，要如

  何繼續成名陽間，創造新的都市傳說呢？「一個人的才華，有時候要變成鬼才知道。」打

  破想像、超乎預期，史上第一部



  --'
