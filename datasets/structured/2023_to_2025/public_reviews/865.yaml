url: https://www.ptt.cc/bbs/movie/M.1723352873.A.ACF.html
title: '[普雷] 鬼才之道'
content: '今天衝早場看完

  整體看完感覺是優缺參半


  (簡單來說大概65-70分吧)



  電影本身

  演員也發揮得很好

  特別是跟

  她們的幾段互嗆戲碼是我全片最愛的部分



  笑點可能有點見仁見智

  整片我有想大笑的應該只有

  （這種讓人很難猜，突如其來的笑點真的很讚）

  工程師跟情侶的部分有會心一笑

  其他就還好，但至少不會覺得是爛梗



  這部最大的問題我覺得是在節奏跟劇情安排上

  有些地方真的拖太久了，有些地方又很趕

  導致

  例如凱薩琳退房的那一幕，雖然氛圍有出來

  但

  我以為同學被Makoto開導後應該要回來的

  結果節目開始後她還窩在家裡

  也不太懂為什麼凱薩琳當個替身，就要把414號房收掉？

  其他部分也有類似的問題（最後五個人學生服追人那段也很明顯）

  導致我在看時，情緒有點難一直投入在故事裡面



  Makoto的部分有點不上不下

  描寫不是很夠，很難讓人對他的境遇有感動或同情

  但又占了一定量的篇幅，讓人覺得怎麼還有他的戲

  我是覺得可以說少一點

  把同學跟凱薩琳的部分多做一些描寫




  這也不是什麼沒人玩過的梗，還硬要做這麼長

  也沒有什麼爆點，我覺得你片尾名單跑完直接ENDING都比這段好

  導致我離開影廳時，對劇中情節的感動都被這段片尾壓掉了



  總結來說是有一些看點

  但執行上還是稍微可惜，要是把一些情節做適當的調整

  就會是非常好看的喜劇電影了



  --'
