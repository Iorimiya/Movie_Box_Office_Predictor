url: https://www.ptt.cc/bbs/movie/M.1723681217.A.DAA.html
title: '[好雷] 《鬼才之道》——與過去的自己和解'
content: '原本是因為朋友有參演《鬼才之道》，所以才來看這部片。

  看完後遠超過我的期待，真的是一部很有趣的片。


  先說結論，非常推薦！我自己都想去看第二次。

  建議不帶成見來看這部電影，就當作去放空兩個小時。


  今年全聯中元普渡的廣告也有跟這部電影合作的樣子。

  我覺得廣告也蠻成功的，可以先去找找廣告來看XD











  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  以下在不透漏重要劇情的情況下講講我的心得。


  我個人對恐怖片的抗性非常低，看完《星期三》第一集後遲遲不敢點開第二集。

  不過這部《鬼才之道》只有一開始有一些驚悚要素，後面就轉為搞笑、溫馨的風格。

  人死後會變成鬼，然而鬼要嚇到人才能一直是鬼，否則就會消失。

  類似怪獸電力公司的設定。


  「我們這些鬼都一樣，把自己搞得面目全非，就怕被其他的鬼瞧不起」

  看到這句台詞，大概就能猜想到這部電影表面上在講鬼，

  實際上想描述的就是活著的人們。




  許多創作作品常用來到一個新的環境、新的職場作為開頭，

  讓主角能夠拋下過去、重新開始。


  近年來，不論中、日、韓的創作，都很常用轉生到另一個世界作為開頭，

  用另一個身分重啟人生，過去的事則當成黑歷史封印。


  但儘管不願去回憶，發生過的事就是發生過了，會跟著人生一輩子。

  只有與過去的自己和解，才能真正拋下過去。


  人是這樣，鬼也一樣。

  其他作品是轉生，到本片就是變成厲鬼。


  本質相同，只是本片多了一些驚悚、喜劇元素。

  另外加上了一些台灣人才懂，特別是30~50歲左右的台灣人才懂的梗。


  如果你也是這群人之一，進戲院時一定也能和這群鬼產生一些共鳴吧！


  --'
