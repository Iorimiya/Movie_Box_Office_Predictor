title: '[討論] 鬼才之道票房崩盤？'
content: '我以為今天才上映

  沒想到週三就上映了

  首日票房310萬

  恩～因為是平日也還算可以

  昨天週四直接崩到剩162萬

  這根本不可能破億了吧

  是因為奧運嗎？

  還是死侍太強勢？

  接下來週末三天票房是關鍵

  如果沒有廣泛好評在社群上擴散出去

  王淨+鬼的破億票房神話就終結了


  今年國片慘到不行

  藝術片入圍不了三大影展主競賽

  商業片票房全面崩坍

  假若連鬼才之道都救不了市

  國片已經到了半隻腳踏入棺材的程度

  該怎麼救？



  --'
