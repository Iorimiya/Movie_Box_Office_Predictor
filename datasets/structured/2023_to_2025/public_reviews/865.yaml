url: https://www.ptt.cc/bbs/movie/M.1724118815.A.21A.html
title: 'Re: [討論] 鬼才之道票房慘輸角頭的原因探討'
content: '我喜歡「鬼才之道」


  想了幾天才發現票房衝不高的主因是沒設定好目標族群吧


  我覺得本片很好笑，但從討論來看發現評價分兩極

  就是目標族群混亂

  從預告風格到演員選角

  看起來應該是鎖定年輕人

  但裡面許多笑點是30甚至35以上才懂

  玫瑰之夜/玉山小飛俠/還有惡毒成語反著說

  主打喜劇，但怕鬼的不敢看


  比起角頭鎖定TA明確，就是吸引89

  或鬼家人就是吸引同志

  同導演之前返校鎖定政治光譜鮮明

  鬼才很難定義他的主要受眾



  --'
