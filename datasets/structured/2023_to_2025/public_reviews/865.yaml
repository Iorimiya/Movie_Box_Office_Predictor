url: https://www.ptt.cc/bbs/movie/M.1719655016.A.5ED.html
title: '[新聞] 又是王淨？鬼才之道導演徐漢強掛保證：'
content: '又是王淨？《鬼才之道》導演徐漢強掛保證：她是首選




  導演徐漢強率領《鬼才之道》演員陳柏霖、張榕容、王淨、百白、瘦瘦出席北影首映，他

  們還一起穿上「要確欸」的電影T恤現身。（記者胡舜翔攝）


  〔記者廖俐惠／台北報導〕


  陳柏霖、張榕容及王淨主演的電影《鬼才之道》今天（28日）在台北電影節神秘場首映，

  由於近期脆（Threads）許多人討論「」，認為她出鏡率很高，不過導演徐

  漢強掛保證，。


  《鬼才之道》導演徐漢強率領陳柏霖、張榕容、王淨、百白及瘦瘦出席首映，他們在片中

  化身厲鬼，劇組天天拜拜、發紅包當護身符，王淨每天花2、3小時「化鬼妝」，她佩服張

  榕容「超屌」，卸妝速度比陳柏霖還要快，張榕容笑說自己收工速度超快，是因為不想給

  導演任何補拍的機會。




  張榕容（右）吐槽陳柏霖若貼假鬍子出門，實在很糗。（記者胡舜翔攝）


  陳柏霖飾演「鬼」的經紀人，造型充滿90年代的復古味，不但特別貼上假鬍子，還另外接

  髮，他透露因為角色怕被認出來，所以很低調。


  問及現實中出門是否會特別變裝，陳柏霖表示自己不擔心被認出來，張榕容則吐槽：「要

  是你貼假鬍子被認出，會很糗欸！」


  王淨與徐漢強合作《返校》票房破億，叫好又叫座，接下來她的《月老》、《關於我和鬼

  變成家人的那件事》成績同樣亮眼，外界評價「王淨」加「鬼」是破億票房保證。


  王淨謙虛地說：「這都是大家一起的，無論是誰來演都會很好啦！」





  前作叫好又叫座，徐漢強暌違5年推出的《鬼》更受矚目，他坦言一直都很焦慮，但不會

  與《返校》比較，「《鬼》是我從0開始，原創的故事，對我來說就是盡力完成。」


  百白將《鬼》比喻為炸雞，「這是最好吃的東西，我保證超好看！」




  王淨被大讚是票房保證，謙虛將功勞歸功給大家。（記者胡舜翔攝）


  王淨是殺青哭最慘的演員，她有感而發，表示《鬼》使她得到非常多的家人，在劇組獲得

  很多的愛，瘦瘦則稱與大家建立起革命情感，請大家敬請期待。


  不過王淨的男友曹佑寧主演的愛情電影《夏日的檸檬草》也在8月上映，兩部作品屆時將

  打對台，王淨害羞表示：「互相支持、互相包場，大家都可以很好！」


  電影《鬼才之道》將於8月7日在台上映。


  新聞網址：




  不愧是台灣新生代第一女星王淨～


  --'
