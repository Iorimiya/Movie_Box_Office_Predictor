url: https://www.ptt.cc/bbs/movie/M.1725277389.A.7EA.html
title: '[好雷] 鬼才之道'
content: '雷文防雷資訊頁



  鬼才之道

  dead talents society

  2024台灣電影


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  中文片名及英文片名，對我而言，挺有意思的，全片的故事角色設定是我没有看過的，很

  驚喜！雖然一些角色及橋段，會聯想到美國經典電影動畫〔怪獸電力公司〕及〔可可夜總

  會〕，但仍然有台灣恐怖片的接地氣特色，用心設計的劇情畫面，看地很歡喜及嘴角上揚

  ！片中二位鬼后的扮演者張榕容及姚以緹的演出優秀出彩！看了開心！王淨扮演的鬼菜鳥

  同學，平凡碰壁沒有自信的角色設定，效果比較不突出，中規中矩。

  本片結合了傳統電視及網路媒體的社會娛樂現象的過去及現在，呈現出諷刺及懷舊元素等

  氛圍，有點悲涼有點時代的眼淚，幸好不令人停留在此，而有更往前進的正面向性。

  台灣農曆七月鬼月的應景片佳作？


  一些搞鬼嚇人的橋段，有些看地很開心，哈哈哈，當鬼比當人更難熬更辛苦啊。為了爭取

  存在感，需要渾身解數，否則就魂飛魄散，消失不見了？（如此一來，不是早死早超生，

  解脱？不是好一些嗎？）


  電影院看完，大部份人在故事結尾，就陸續離開放映廳了，只剩我一人看到最後，看到一

  些主要演員及幕後工作人員的年輕年幼時的相片，及幕後花絮相片，最後最後的陳柏霖演

  出的〔愛的視線〕音樂MV，全片要結束不結束的設定，很尷尬很玩弄人，我竟然耐心看完

  了。

  個人滿意度85分



  --'
