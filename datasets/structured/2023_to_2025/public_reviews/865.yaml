title: '[新聞] 《鬼才之道》多倫多放映秒殺 王淨喊緊張'
content: "《鬼才之道》多倫多放映秒殺 王淨喊緊張\n\n04:10 2024/08/28 中國時報 李承陽\n\n\n導演徐漢強（右）將攜女主角王淨前往多倫多影展。（牽猴子提供）\n\
  \n喜劇電影《鬼才之道》入選今年多倫多國際影展午夜單元，影展方舉辦了3場放映，第1場\n選在皇家亞歷珊卓劇院，可容納上千人，26日一開賣，3場放映全數銷售一空，總計超過\n\
  1500個位子秒殺，對此導演徐漢強表示：「非常期待與國外觀眾一起觀賞，不論是喜劇脈\n絡或是角色設定，都想知道他們看完後的反應。」\n\n王淨過去也有作品登上國際影展，曾跟曾敬驊以《返校》參與釜山影展放映，《瀑布》也\n\
  入選當年多倫多國際影展，只因疫情而無法前往。這次以《鬼才之道》來到多倫多影展，\n王淨感到相當緊張，第1場放映將與徐漢強跟上千名觀眾一起觀賞，王淨說：「到現在還\n\
  無法想像會是什麼樣的情況，我可能整場都手心冒汗，這應該會是永生難忘的回憶吧！」\n\n另1位主演陳柏霖，先前於簽名會慶生時許下希望《鬼才之道》能讓全世界看見的願望，\n\
  也在生日當天成真，徐漢強表示：「大家可以抱著有點輕鬆好玩的心情，進來這個故事，\n故事後面有感情重量很飽滿的訊息，希望可以讓觀眾在出來之後可以得到一點慰藉。」\n\
  \n#故事 #放映 #王淨 #觀眾 #秒殺\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n\
  --"
