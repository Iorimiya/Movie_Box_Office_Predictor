title: '[好雷] 鬼才之道 - 片尾有彩'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~












  個人覺得很重要所以來發文


  片尾記得要看完

  什麼叫看完？

  就是你一定要成為走出影廳的最後一個人

  否則…


  鬼才知道（笑）



  為什麼一定要看這部片！！

  因為！！



  ★王淨 - 我們同學真的很努力了（痛哭）


  王同學從影多年

  看了她這麼多作品

  我真的覺得這部片是她最大犧牲啊（哭爆）

  這個犧牲包括物理的，也包括精神的…


  她會中，真的。


  我心被曉雷同學痛死！！

  拜託！！來看看她！！！

  不要讓她消失！！！！！



  ☆張榕容 - 一把年紀 也不放棄！


  張影后息影多年之復出作

  喜歡傲嬌姐接的請看她！會被萌死！


  傲嬌姐接還是總攻屬性！

  一起加入旺來天后宮，無論幾把年紀、有沒有帶把，都可以成為永恆的JK哦！<3



  ☆姚以緹 - ^_^


  俗話說：伸手不打笑臉人

  那笑臉鬼總可以打吧！打得好，打死她！


  身為社畜，真的好想打死潔西卡笑咪咪的漂亮臉蛋！！……阿不對，她已經死了。


  但是，無論她表現得多想讓人巴死她，

  我也從來不希望她消失。


  薩琳 x 西卡

  宿敵CP，真的令人愛死。


  恨之令其生，愛之令其死。

  她們一直、一直都看著彼此呢。（抹淚惡寒）



  ★陽世之情絆，身後猶探看


  劇本細緻的很像黑暗中的蜘蛛絲

  一絲一絲勾連出每個角色的故事


  一旦鎂光燈打上

  空氣中的微塵，便會受到光的牽引


  本片調性滿接近《我的麻吉四個鬼》

  在毫無人性的世界裡

  仍有一絲溫暖微光，讓你在死蔭之地，感受到活著的美好。


  說來吊鬼

  人居然要靠著鬼的悲喜劇

  才能感受活著的美好



  我覺得片裡最恐怖的

  其實是「人間鬼片」


  1. 連鬼都不怕的社畜，人不像人

  2. 連鬼都怕的鬼委會，鬼倒像人


  除了感動，更是警世。



  最後，有一個微彩蛋應該是：

  「翠華科技大學」


  呃… 原來我看的電影是……



  --


  痾，你有看到愛的視線？



  真的，我就超煩躁


  但我最不滿的是：居然沒有在這一趴排Jump Scare！？


  這裡多好用，誒，還是經費用完，鬼才下班！？


  真的是其次於噤界前傳拍成那樣的賭爛


  這個年頭鬼和異種都這麼廢，不超時嚇人的嗎？！



  看來你真的沒看到…（拍拍）


  反正最近在跑影人

  找一場有映後的，大家肯定會看到最後的XD



  鬼才知道(的梗) <3'
