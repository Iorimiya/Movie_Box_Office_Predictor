title: '[新聞] 《鬼才之道》導演爆太累 請辭《還願》'
content: '新聞網址：



  %94%E7%88%86%E5%A4%AA%E7%B4%AF%E6%83%B3%E4%BC%91%E6%81%AF-%E8%AB%8B%E8%BE%AD-%

  E9%82%84%E9%A1%98-%E5%86%8D%E6%8B%8D%E8%A6%81%E7%98%8B%E6%8E%89-145423424.html


  [周刊王CTWANT] 台片《鬼才之道》6日舉辦首映會，重現電影中的「金鬼獎頒獎典禮」，

  導演徐漢強率領主演陳柏霖、張榕容、王淨、姚以緹、百白、瘦瘦出席。導演徐漢強表示

  拍完《鬼才之道》之後，打算先休息一陣子，原訂拍攝的《還願》也已請辭，「我已經跟

  烈姐請辭了！不會再拍還願了！連拍兩部長片，身心需要很強烈的休息，我再拍下去可能

  會瘋掉。」至於《鬼才之道》是否是他最後一部作品？徐漢強笑說：「你要這樣講也可以

  。」


  談及現實中是否有遇過靈異事件，王淨稱自己是「麻瓜」，即使有遇到也沒有感覺。張榕

  容則表示，「偶爾會感應到，但最嚇人的是我們的化妝間，每次進去都放七八頂人頭和假

  髮，走進廁所還會看到一頂濕的，因為造型組每天都要拿去洗然後曬乾。」陳柏霖補充道

  ：「然後其中一個人頭還有貼Makoto的鬍子，因為鬍子也要洗曬，我看到也會被嚇到。」


  大鶴、龍龍、昶瑋在電影裡中飾演不信邪的網紅組合「超鐵齒」，為拍攝知名雙女鬼而深

  入「旺來大飯店」一探究竟，三人坦言現實生活根本超怕鬼。導演徐漢強首次和龍龍、董

  仔、眼肉芽等網紅合作，他表示：「我發現他們平常可能因為非常大量在拍攝影片，所以

  一來是他們對鏡頭完全不怯場，二來是他們其實每天都是在一點一點地累積表演經驗，所

  以他們的表現其實並不輸專業演員，這是我覺得蠻驚訝的事情。」《鬼才之道》將於8月7

  日全台上映。


  —————————————————————

  意外發現這消息，而且網傳導演未來不會參與電影製作？這樣蠻可惜的，新生代商業電影

  導演的砥柱之一。

  而且前幾年現象級獨立電玩《還願》不是他翻拍有點可惜，雖然限制他的拍片風格，但目

  前感覺最適合的還是他，能替他上陣的感覺除了咒的導演柯孟融之外沒有別人，要拍出溫

  馨又恐怖的台灣導演還有誰？感覺會找新導演



  --'
