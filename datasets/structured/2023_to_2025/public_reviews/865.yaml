title: 'Re: [新聞] 《鬼才之道》開拍，陳柏霖 張榕容 王淨'
content: '看到鬼片都會想到一些事 跟片子內建不合

  所有片都一樣 即使拍最恐怖都會笑 世上沒有鬼

  那些鬼會穿透牆壁 怎不會穿透地球？

  只會2D不會3D？ 掉入地球會到哪裡？太空？

  還有鬼總是穿衣服 這是因為電剪關係

  沒辦法看到裸體的鬼 演員也不演

  人是有機物 長存也就算了 衣服無機物也留著

  鬼穿同樣衣服 真的好笑

  看鬼片不經意描一下 都拍到鬼的影子

  這些東西都讓我覺得鬼都不鬼了

  這樣看鬼片時就像看喜劇片


  --'
