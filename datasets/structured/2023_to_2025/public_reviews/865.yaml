title: '[討論] 鬼才之道排暑假檔是不是很猛呢?'
content: '一般來說

  暑假是好萊塢強片如雲的檔期

  國片排這邊比較不吃香

  國片通常喜歡排冬天跟春天

  一來是金馬獎剛頒完，二來可以吃農曆春節長假



  印象中暑假檔國片票房紀錄應該是

  我的少女時代           4.1億  8月13日上映

  那些年我們一起追的女孩 4.25億 8月19日上映

  海角七號               5.3億  8月22日上映



  看來也不乏超高票房的紀錄

  大家覺得鬼才之道(8月7日)可以摸到3億嗎



  --'
