url: https://www.ptt.cc/bbs/movie/M.1722013301.A.3C4.html
title: '[新聞] 《鬼才之道》入選多倫多國際影展午夜瘋狂'
content: '《鬼才之道》入選多倫多國際影展午夜瘋狂單元



  徐漢強執導的陰間喜劇電影，將於影展期間於北美首映，屆時王淨所飾演的「同學」招牌台詞

  「好恨啊！」、張榕容的霸氣折腰即將擄獲外國影迷的心，同時《鬼才之道》



  　多倫多影展對於《鬼才之道》給予高度評價：「憑藉精心的劇情巧思和極具魅力的演員

  陣容，徐漢強導演巧妙地結合恐怖元素，幽默與富有情感共鳴的故事。會深深愛上這些角

  色，並且為他們的夢想加油。相信 TIFF 午夜瘋狂觀眾也會有同樣的感受！」


  　導演徐漢強對於入選表示：「《鬼才之道》引用了不少臺灣的鬼故事和都市傳說，而且

  對白節奏很快也很臺灣，但我們不僅請了很厲害的譯者綠火，在英文翻譯花了很大的功夫

  ，也在故事核心和敘事手法上盡可能照顧國際觀眾。所以可以入選多倫多影展非常開心，

  希望這個故事也可以給臺灣以外的觀眾1個大大的擁抱。」


  　陳柏霖飾演厲鬼經紀人Makoto，得知入選他說：「太棒啦！一定中真的不是說假的。好

  期待看到國外影迷的反應，相信感動的共鳴度不分語言。」飾演厲鬼天后的張榕容也開心

  表示：「迫不及待想看到薩琳的魅力征服海外了，《鬼才之道》的劇情是能打動人心的，

  我們是最棒的喜劇片。」飾演同學的王淨說：「不知道他們看到『好恨啊！』會不會笑出

  來，希望在多倫多電影節的每一場放映都可以被秒殺。」


  　此外，由陳柏霖領軍的「旺來五人幫」張榕容、王淨、百白、瘦瘦連同國際小巨星潔西

  卡姚以緹，將於下週六（8月3日）前往高雄環球影城、臺南西門新光影城與臺中站前秀泰

  舉辦「鬼才搶先想死你」映後見面會活動，每組套票價錢新臺幣340元，不只6人將出席20

  分鐘的映後活動，參與者還將獲得片中象徵旺來大飯店都市傳說起點的「414號房」房卡

  鑰匙圈，更有機會抽中和影人們合照，活動詳情請上官方臉書。




  --'
