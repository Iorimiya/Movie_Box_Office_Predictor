url: https://www.ptt.cc/bbs/movie/M.1725419992.A.34F.html
title: 'Re: [討論] 鬼才之道票房慘輸角頭的原因探討'
content: '我住台中，在親親戲院看過大橋頭

  有個朋友是鬼才粉，看了12次鬼才

  他住花蓮，前天來台北看媽媽咪亞

  聽說裕隆城有鬼才的特典(紀念品)

  就在粹上到處找朋友瘋狂刷票房

  最後找到了我，說要請我看鬼才

  裕隆城一張票340，超級貴到爆

  我在親親看買團體票也才190

  就從台中搭統聯上台北接受款待

  看完後還請我在裕隆城吃馬辣880


  這位朋友是很常狂刷票房的狂粉

  哪天有部片能讓他100刷都有可能

  就像以前梁山伯祝英台就有人100刷

  但以前的票價跟今天差了一百多倍

  所以還能這樣幾十刷得看電影

  真是個真正支持國片的愛國青年


  但他就沒法看大橋頭，認為那是臭直男片

  我的確是個剛鐵直男，所以角頭系列全看

  我看完鬼才之後發誓只要是徐漢強導的片

  就絕對不買票進戲院看，就算請我也不看

  看得讓我從頭尷尬捱到尾，完全不合胃口

  但我朋友就超愛，我再問他同類型的片

  例如我覺得很爛的詭扯、還錢、江湖無難事

  他都覺得超好看，但對我來說都是惡搞片

  就是瞎胡鬧的無腦惡搞鬧劇，各有所好

  可能有些人工作壓力大需要這種片鬆一下

  看看這種像動漫一樣無俚頭的鬧劇

  有易身心健康，適合很多Z世代的人

  但非常不適合我，像我也很少看動漫

  鬼滅、排球少年、銀魂也是看不懂


  但角頭到真是從第一集看到今天

  算是角頭鐵粉，我沒混黑道也不是流氓89

  但就喜歡這種黑幫題材，可能港片看多了

  以前從英雄本色、槍神、槍火到無間道

  還有教父、疤面煞星、四海好傢伙等等等

  還有極惡非道、奏鳴曲、那個凶暴的男人

  等北野武的片，還有以前的極道之妻系列

  以及以前高倉健的黑幫片等都從小看到大

  韓片也是，朋友、新世界、不汗黨、優雅的世界

  等等等，都是很棒的黑幫片


  所以我應該是高捷粉才會想去看角頭

  但看完角頭1拍的跟鬼才一樣爛

  就不會想再買票看角頭2

  但沒想到他換了顏正國當導演

  又找好萊塢港星皺兆龍來加盟

  就勉為其難的再給他一次機會

  結果一試成主顧，之後就都買票進場

  而且角頭系列每部都不同導演主導

  第一部電哪吒導演實在不合我胃口

  第二部顏正國導演很合我胃口

  第三部文青副導姜睿智轉正也拍的不錯

  第四部大橋頭攝影小姚轉導演差強人意

  第五部不知道又會找誰來當導演?

  但姜睿智是從頭跟到尾的執行導演


  總之徐漢強他的聖筊拍的還不錯

  非常好笑的公視幽默愛情單元劇

  所以程度只限於公視水準而已

  他的電影從返校到鬼才我只能說

  他美工出生的，畫面的確很美

  就像小姚攝影出生的也一樣

  把大橋頭拍的畫質色彩很棒

  但這兩個導演在編導上都很雜亂


  想當導演最好在大導演旁多跟幾年再來導

  小姚拍大橋頭跟他以前導的藝術片完全不同

  就像張藝謀被抓去導英雄跟十面埋伏、長城

  也被說爛得要命，農村導演去拍武俠片

  被一堆武俠片迷笑掉大牙

  還是要拍自己拿手的類型片才比較好看

  返校要不是題材的關係也不會破億

  但題材好被騙進去看，才知道受騙了

  再看了原創性中元節鬼片更是下定決心

  絕不看徐導的片，除非看免費的場

  像串流、圖書館公播、電影台等等等


  鬼才大概已經讓我徐大導演的導戲功力死心了

  就像第一次看角頭1一樣，對電哪吒的導演死心

  角1跟電哪吒的導演李運傑還是去美國學的電影

  跟阿KEN一樣，果然不是留美學電影都能變李安

  顏正國是文盲都導的比這些電影留美生還好看

  主要是他跟豆導鈕承澤一樣從小在電影圈長大

  所以知道台灣最好的電影人才是誰才能知人善用


  其他留美的導演，大概只能用美國的人才才好看

  像李安的三部曲我想幕後應該多半都是美國人

  所以李運傑跟阿KEN加油，再回去找同學拍片吧

  徐導跟小姚也編導多加油

  像姜睿智導演的功力比小姚高

  顏正國又更高一點，但都差不了多少

  不管怎麼樣怎麼樣都比李運傑高很多


  想拍出超越洋片破海角賽德克跟臥虎藏龍紀錄的神片

  還得多多修練才行，例如去跟盧貝松或卡麥隆拜師

  陳柏霖跟林依晨最近都在拍電影，但還是都拍爛片

  希望我可能不會愛你不會是這票人的顛峰之作

  像瞿導也是這戲紅了後，後來搞電影賠的超級慘

  拍個同志片雖然票房高但把李烈的電影公司都賠掉了

  再投資鍾孟宏拍瀑布也是賠到死

  又拍馬克喜劇一樣賠到變小魏澎恰恰

  難怪人家甄環傳後就息影部拍電影了

  因為人生已經到頂，再走就是下坡了



  --

  不管詭扯鬼才江湖切小金，我是連串流都不想看

  這些片的票房都半斤八兩，我覺得都跟鬼滅一樣惡搞

  但鬼滅卻賣到翻，應該是因為影集先大紅電影才大賣

  就像日片影史冠軍也是織田裕二的偵探影集的劇場版

  各有所好，或許徐導能像鬼滅一樣從影集開始拍

  無腦影集紅了再來導電影上映才能大賣特賣

  看完正港分局，感覺跟鬼才還真有得比

  我懷疑正港分局不是殷正豪本人導的

  因為跟當男人比起來真的差很大

  也不像是程偉豪導的，跟我和鬼也差很大

  感覺就像是木耀人隨便亂導的網路鬧劇

  或許有可能是監製金百倫導的還差不多

  期待有部片能破臥虎藏龍跟海角賽德克的票房紀錄

  也能他的紀錄，給他100刷下去大家都不心痛的片

  他說他不看連續劇，只愛看國片

  不然他應該也會喜歡看正港分局'
