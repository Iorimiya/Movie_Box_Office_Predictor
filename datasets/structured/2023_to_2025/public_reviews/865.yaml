url: https://www.ptt.cc/bbs/movie/M.1723517384.A.4DE.html
title: '[好雷] 鬼才之道'
content: "雷文防雷資訊頁\n\n劇情歡樂，節奏明快，\n畫面好看，表演精湛。\n\n該溫馨時溫馨，該搞笑時搞笑\n不會有拖沓感\n音樂歌曲好好聽\n\n\n\
  \n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n這個世界觀的鬼 真的都超廢\n\n不會飛、不會穿牆、不會隔空取物，\n\
  跑步還會喘\n\n人看不到、吃祭品、噴血免費，還要定時申請工作簽證\n\n遺物被丟棄、即將被遺忘的孤魂野鬼，\n還想要留在人間，就要會嚇人，拿到厲鬼證，創造都市傳說\n\
  \n劇中最淒慘的鬼，就是玉山小飛俠，魂飛魄散，\n那麼多人爬玉山，怎麼會呢？\n\n在世的時候，希望有人愛\n做鬼的時候，希望被鬼肯定\n\n故事雖然有點俗套，但是演員一點都不差\n\
  \n王淨一整個廢樣，真可愛，回家看家人那些劇情\n不用太多話，用演就演出內心惆悵\n\n張榕容氣質出眾，演得面目掙扎，反差感真強\n\n姚以緹在劇中看起來也太年輕了吧，鬼妝很漂亮\n\
  \n凱薩琳和潔西卡互相惡整打架，真的笑死\n\n踩到樂高梗也拿來用，\ntiming很重要，這段很鬧 XD\n\n Makoto真的爛爆 XD，還有90年代MV\n\
  愛的視線又近又遠\n\n有些影評說這是職場劇，\n也有人說這是抒發表演工作者的處境，\n\n總之這是精彩的鬧劇，\n生活中就是會充滿很瞎的同事，\n人生裡一定會有覺得自己很廢的時刻，\n\
  生命中總是會有眷戀的人事物，讓你捨不得\n\n\n\n\n\n\n\n\n\n\n--\n\nSent from \n\n--"
