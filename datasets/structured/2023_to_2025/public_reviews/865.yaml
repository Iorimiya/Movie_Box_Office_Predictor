url: https://www.ptt.cc/bbs/movie/M.1723391544.A.7C1.html
title: '[新聞] 王淨拍《鬼才之道》開心收穫一群好夥伴'
content: "王淨拍《鬼才之道》開心收穫一群好夥伴\n\n04:10 2024/08/11 中國時報 孫伊萱\n\n\n王淨（前排左起）、百白、瘦瘦與陳柏霖（後排）10日出席映後講到眼淚潰堤。\n\
  （牽猴子提供）\n\n電影《鬼才之道》上映首周，陳柏霖率張榕榕、王淨、百白及瘦瘦組成的「旺來5人幫」\n勤跑戲院活動，甚至在北中南分別舉辦拍照會和簽名會，更有韓國粉絲搭機來台，陳柏霖\n\
  不忘大秀韓文問影迷：「電影好看嗎？」張榕榕立刻驚訝讚：「Makoto（陳柏霖角色名）\n不只會唱會跳還會講韓文，不愧是全能偶像。」\n\n電影笑淚交織，感動許多觀眾，5人幫也多次在映後講到眼淚潰堤，王淨很開心因《鬼才\n\
  之道》收穫一群好夥伴，「進劇組前，是我在演藝生涯中很徬徨的時刻，覺得有點被掏空\n，也不喜歡這樣的自己，但是遇見身旁的這群人，覺得即使沒有人理解我，但有他們在就\n\
  足夠了。」\n\n百白則說「我會不斷地對角色提出想法，但每次都被導演打槍，我還是告訴自己要努力爬\n起來，雖然心裡仍充斥著不安，擔心導演是不是後悔找我演戲。」直到殺青宴，導演徐漢\n\
  強拍拍她的肩膀說：「還好卡蜜拉是交給妳。」才讓百白所有的委屈和難受瞬間瓦解。10\n日也正好是百白的生日，大家努力宣傳之餘也為她慶生，百白開心許下生日願望：「希望\n\
