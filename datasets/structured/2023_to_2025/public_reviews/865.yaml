url: https://www.ptt.cc/bbs/movie/M.1724525350.A.327.html
title: 'Re: [討論] 關於《鬼才之道》本身的行銷與票房力'
content: '說真的我是因為一堆人一堆影評一堆網紅說很好看我才去看的

  真的是一堆人

  前陣子去看了死侍跟驀然回首時都有播預告片

  預告片看起來超尬超不妙

  所以我真的懷疑那些人



  講到結尾真的要說一下

  去看外甥的這幕真的爛到不行

  「你不需要是特別的」

  在王淨與那維勳的演出中就能明顯感覺的出來這個主旨

  王淨最後趕回飯店一起嚇人然後最後抱在一起不就是體悟到這道理後的行動嗎？

  那演了一大段之後

  反而又再去跟外甥講這句

  前面是有演出說外甥受到什麼期待之類的嗎？！

  最後一幕超級多此一舉

  完全不懂留白的必要性




  整部電影就是劇本的概念與創意很不錯

  但執行起來明明超級糟糕的

  整部電影嘴角沒上揚過

  要致敬90年代並不需要把笑點也變成90年代吧？

  導致整部都在用超無聊的笑點做推進

  到了真的要感人的地方只會讓人覺得感情毫無堆疊

  舉個印象最深的例子

  王淨首次跳樓那段

  明明是個重要的劇情轉折

  結果跳下來插到飯店扛棒被電

  這種橋段現代人真的笑的出來？？

  況且導演好像覺得真的很好笑一樣整段時長又很長最後還一堆白癡煙火特效

  講句難聽的

  瘋神無雙都比這部好笑有趣



  徐漢強上一部返校也是一樣的問題啊

  優秀的文本和核心價值

  實際執行起來就是無聊

  真的覺得很浪費劇本

  -----

  Sent from JPTT on my iPhone


  --'
