content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n昨天才看鬼才之道\n雖然評價似乎滿兩極\
  \ 但個人覺得滿喜歡\n以鬼的世界來當主軸像可可夜總會\n結合很多台灣人才懂得鬼梗滿有趣\n燒冥紙 紅衣小女孩 爬玉山 雪山隧道 … 等等的很有感\n有一種台式黑色幽默大集合的感覺\n\
  整部在節奏 笑點 美術 劇情上都覺得恰到好處\n除了有趣的世界觀以外\n也讓人反思 關於到底需不需要有”才華“的課題\n並帶出台灣家長的習性 教育觀\n看女演員們的扮醜和耍白痴也算好笑\n\
  \n先前有在串流上看詭扯\n這兩部都滿喜歡的\n不過個人是覺得陳柏霖在詭扯上演更好\n這部就是ＭV最印象深刻\n\n\n前幾週也看了正港分局 沒到喜歡\n 木曜比重真的太重了拉\n\
  \n或是純好奇是不是以喜劇來說\n電影還是比影集好發揮啊\n\n--"
