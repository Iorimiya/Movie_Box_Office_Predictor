  像是主角群的背景、人物設定、掙扎、心境轉變的原因...


  如果改成影集的方式來寫劇本

  是不是就有足夠的片長，可以慢慢鋪陳「鬼」世界

  可以在把角色的背景和動機刻畫的更立體

  會不會就更能夠引起觀眾共鳴？


