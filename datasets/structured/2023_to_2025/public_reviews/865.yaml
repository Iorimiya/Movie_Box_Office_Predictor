url: https://www.ptt.cc/bbs/movie/M.1725547701.A.E84.html
title: '[好無雷] 鬼才之道是頂級的喜劇'
content: '我認為各種類型的劇情片，在節奏和調性上最難掌握的是喜劇


  徐漢強導演之前在電視電影《聖筊》當中的喜劇調度讓我非常驚艷，能讓我會心一笑的溫馨喜劇，而且還是國片，我幾乎已經想不起來上一部是哪部了


  趁著應該算是尾盤，隻身到電影院看了鬼才


  這次的《鬼才之道》我認為是更上一層樓，揉合了奇幻、黑色幽默、後設、社會諷刺甚至時事或諧音的笑點，試圖吃到不同受眾群的電波可謂野心勃勃。而其節奏的平衡、punch
  line尺度的拿捏，全片幾乎沒有讓我感到出戲的時候，雖然是荒誕的設定但又能給我代入感與沉浸感，以國片喜劇來說肯定是超過一百分了！


  而更有甚者的是，它竟然能讓我笑中帶淚......。即使年紀漸長哭點持續下降，我仍覺得這是不可思議的事


  有感於它可能快下檔了，看完回家立刻先PO文推薦，希望對國片缺乏信心的板友們試試看這部


  《鬼才之道》，真的是我願稱你為喜劇國片中最強！


  --

  我甚至想到愛情靈藥去了

  你兩位說部更強的來讓大家笑笑啊。

  我覺得還好

  我原本指涉對象不是你，不過感謝分享～我有空會找來看

  其實我有感覺應該是耐看的片，雖然我看電影一周目通常只放鬆（放空）享受氛圍，但有隱約感覺到有很多細節

  美術組的用心！

  我只是搜索枯腸曾讓我笑的國片...真心難想

  撰文太倉促了竟然打錯別字沒發現，感謝指正

  能做到不太會出戲這點就不只是演員厲害喔！導演的導戲和剪接功力都有很大功勞，更別說攝影燈光美術造型等各組營造出的、沒有明顯瑕疵的成果！

  上啊！

  其實我覺得我們在作品中看到的演技也是經過導演的調整，不然即使是一群戲精，也有可能出現風格不統一或不協調的問題

  我感覺是很貼近現實吧，就很爛的人生（鬼生）但還是得繼續下去

  我也大概是這感覺沒錯，明明是很悲的故事但還是能逗笑我

  哭點都在背景設定中吧～

  大佛普拉斯在我印象中很沉重餒，唯一想得起來的笑點是Seven......？'
