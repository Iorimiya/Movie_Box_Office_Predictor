title: '[普雷] 百合很香的鬼才之道'
content: '以搞笑片來看這部片真的蠻普的，讓我爆笑出來的笑點不多，大多是莞爾一笑。


  但這部電影的百合味真香！


  同學偷幫凱薩琳影片留言衝人氣，香！

  傲嬌凱薩琳早早幫同學申請了猛鬼證，香！

  獻祭Makoto 影片讓同學開心的凱薩琳，香！

  凱薩琳放棄自己的414房甘願變成同學替身，香！

  潔西卡對凱薩琳說「妳只是不把人放在眼裡」時的哀怨感，香！

  抱著哭哭的同學，安慰她說「妳是世界第二可怕女鬼」的凱薩琳，香！


  導演想傳達的訊息是什麼我不知道，走出電影院我腦子裡只有


  百合，真香啊！


  -----

  Sent from JPTT on my iPhone


  --'
