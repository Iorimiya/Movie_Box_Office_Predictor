url: https://www.ptt.cc/bbs/movie/M.1724155520.A.062.html
title: 'Re: [討論] 鬼才之道票房慘輸角頭的原因探討'
content: '這20年國片少見的奇蹟

  記得應該只有海角七號是第一週平淡

  第二週開始口碑逆轉場場爆滿的現象

  其他還有嗎？至少我在電影院多年記憶以來是好像沒遇過第二部

  多數第一週就開始很多人了 甚至連平日也會有不少人看 更何況現在還是暑假

  卻看到不少鬼才場次包含我去看那場觀影人次都很零星

  通常到了第二週還是那樣 那就只會是那樣了

  何況海角七號還是在社群媒體只有臉書剛興起的年代


  現在有臉書有IG有脆有抖音小紅書YT各種通路

  但有看到哪個年輕人或自媒體拍出鬼才之道任何ㄧ個搞笑金句或模仿短片在上面發酵嗎？

  完全沒有（也可能只是我沒有滑到）


  這點可以看看「一屍到底」

  當初很多人跟朋友推薦也都是說「這部很好笑」這樣而已

  ㄧ樣可能會被誤會成恐怖片的類型

  ㄧ屍到底卻真正笑出圈賣出爆量票房

  而鬼才之道卻只能在同溫層中推薦惋惜


  以一部喜劇片來說 如果真的有那麼好笑

  那票房早就賣出去了...哪會有什麼奧運死特異形的問題。


  --

  票房5300萬算小群同溫？'
