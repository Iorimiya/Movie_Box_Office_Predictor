title: '[好雷] 鬼才之道'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《鬼才之道》有雷影評：精神勝利法，死人也適用！\n\
  \n笑點過關的舊酒新瓶，很適合在串流平台觀賞。用鬼故事包裝演藝明星、網紅的起落浮沉\n，再透過王淨同學的角色，影射到每個平凡人。\n\n□ 活著的價值等於「被看到」嗎？\n\
  \n我看到一半就在想，人死後真的會記得親友的成就嗎？可能還有累積的人品跟價值觀吧。\n\n\n《鬼才之道》在人間和陰間都先設立了前提：只有出人頭地才是值得的人生，被看見的鬼\n\
  才有價值存在。\n\n電影用凱瑟琳與潔西卡的角色，描寫成名背後的佈局和努力，以及隨之而來的恐懼：被取\n代、被遺忘、不再被愛。這裡特別強調：所有你看到的一夕爆紅、好運成名，後面下了多\n\
  少功夫。\n\n□  你不是天選之鬼：眾人視線外的角落\n\n《鬼才之道》分兩次闡述沒被看見的結果與感受。第一層是同學的人生回顧，與成功的姐\n姐對比，細數到死前仍毫無建樹的一切徒勞（聯想到進擊巨人旁觀者那一集的寓意）。第\n\
  二層則是網紅與雙女鬼的大PK，在攝影機粉碎後，一切競爭拉扯，全部化為烏有。生前身\n後的無情遭遇，讓觀眾不禁自問：\n\n\n這場至死方休的老鼠賽跑，終於在瘋狂嚇人慶典得到了喘息。電影試圖透過凱瑟琳的溫情\n\
  喊話告訴你：你已經做的夠好了，所有努力都看在眼裡。\n\n這話語乍看還有些道理，騙了幾滴眼淚，\n\n\n\n\n-\nIG：Fishpond_like \n\
  臉書：魚池 FishPond \n個人網站：\n\n--\n一開頭就是這樣的感覺@@\n但有些還是有好笑到\n我早就躺好了\n偶爾會起來走動而已wwwwww\n\
  這世界觀死人很慘的，到死都還在繼續比\n我也會想被看見哈哈哈\n（不然幹嘛到處貼影評\n但也能接受躺平在家廢的美好"
