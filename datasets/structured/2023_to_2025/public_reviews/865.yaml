url: https://www.ptt.cc/bbs/movie/M.1732463695.A.FC3.html
title: '[新聞] 《鬼才之道》摘5金 陳柏霖王淨互虧沒得獎'
content: "《鬼才之道》摘5金 陳柏霖王淨互虧沒得獎\n\n04:10 2024/11/24 中國時報 謝采恩\n\n\n陳柏霖（左）、王淨23日一同擔任金馬獎頒獎人。（金馬執委會提供）\n\
  \n由徐漢強執導的恐怖喜劇片《鬼才之道》昨一連奪下「最佳造型設計」、「最佳美術設計\n獎」、「最佳動作設計獎」、「最佳視覺效果獎」，王若琳也以電影主題曲〈鬼才出道〉\n\
  獲「最佳原創電影歌曲獎」。\n\n特別的是，前兩個獎項由該片主演陳柏霖、王淨擔任頒獎人，2人默契穿著深色禮服登台\n，男帥女美合體畫面養眼，當他們連續把手上獎座都頒給同劇夥伴時，互相對看許久，興\n\
  奮到說不出話。雖說他們與今年的金馬獎無緣，不過2人在台上互虧沒入圍的畫面，逗樂\n台下觀眾。\n\n最佳造型設計獎由《鬼才之道》施筱柔拿下，過去她2度拿下台北電影節最佳造型設計殊\n\
  榮，這次是她4度入圍金馬獎，終於如願添金；最佳動作設計獎由年僅29歲的黃泰維拿下\n，也是該獎最年輕的得獎者；郭憲聰、邱俊毅則擒下最佳視覺效果獎。\n\n最佳美術設計獎則由王誌成、梁碩麟獲得，王誌成感性說：「非常感謝這片土地，給我們\n\
  一個自由創作的空間，很大很大的空間跟土壤。我會繼續再努力，我也愛這片土地，我愛\n台灣。」真摯的感言引爆全場掌聲。\n\n#誌成 #陳柏霖 #王淨 #最佳造型設計\
  \ #空間\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
