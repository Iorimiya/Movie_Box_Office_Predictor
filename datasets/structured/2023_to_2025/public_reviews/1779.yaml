title: '[好雷] 轉移注意力的魔術：《無人相信的真相》 '
content: "本文涉及劇情，並有可能令人不適的描述，\n\n　　　　建議觀影後，或有心理準備再讀。\n\n　　　　本片已上映一週，有意者請把握本週時間。\n\n\
  \n　　　　圖文網頁版：\n\n　　　　\n\n\n　　　　預告片：\n\n　　　　\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n轉移注意力的魔術：《無人相信的真相》\n\n\n\n\n\n　　這部電影的筆記應該欠缺嚴謹，因為當我跟著清潔員的視線看到主角莫\n\n琳嘉內（伊莎貝雨蓓飾）遭到襲擊後的模樣，筆就停了；我的筆記倒數第二\n\
  \n句是「與中國合作，將取代法國的核電」（然後在結尾和現實印證），最後\n\n一句話是「無法閱讀」。\n\n\n\n　　《無人相信的真相》由法國導演尚保羅沙洛梅執導，改編自調查記者凱\n\
  \n洛琳米歇爾撰寫的同名書籍，敘述法國一家跨國核電廠阿瓦集團的新任總裁\n\n為挽救瀕臨倒閉的公司，決定和中國簽訂合約興建核電廠，不僅賤賣技術，\n\n還殃及員工去留。工會代表莫琳嘉內便獨自一人為五萬多名工會成員捍衛工\n\
  \n作權益，為此被多次恐嚇。2012年，莫琳於自宅遭到殘暴襲擊，然因調查遲\n\n滯不前，反被警方懷疑、威脅承認這一切都是自導自演，時至六年後持續法\n\n律鬥爭，才爭回自己的清白。\n\
  \n\n\n　　莫琳會被警長、法官質疑，乃因她自事發六小時後至清潔員發現的過程，\n\n始終靜靜坐在被綁縛手腳的椅子上，沒有試圖掙脫、呼救，身體沒有排除異\n\n\
  物都「不合常理」，最後一項還請醫生「實驗」。他們判斷莫琳能用膠帶反\n\n綁自己，且連小孩都可自行掙脫，卻沒有讓右肩受傷的她示範如何做到；加\n\n上她能理性地述說事發經過，沒有哭泣與崩潰等受害人「應有」的反應。她\n\
  \n的證言矛盾之處難以解釋，但動機充份：畢竟她為了捍衛工會成員的權益四\n\n處尋找議員支持，試圖阻止公司與中國合作，必得引起更多人注意，且會破\n\n壞現任男性總裁想保住公司的「成就」；她和前任女性總裁讓許多男性公司\n\
  \n高層不快，不僅因為他們無法維持以往可以表現「女人就是這樣」的優勢，\n\n還得承受她們指出「男人總是這樣（無視女性權益）」的事實。莫琳過去強\n\n勢的形象，使她沒有「足夠抵抗」的表現，在視她為眼中釘，及因無法破案\n\
  \n而感到棘手焦慮的警方眼裡，成了她的「犯罪」裡最大的破綻──\n\n\n\n　　畢竟只要是她說謊，罪案與傷害就不成立，而她當然要負起責任。\n\n\n\n　　莫琳甚至不用證明她做得到，只須口頭承認自導自演，否則，身為受害\n\
  \n者為生活與家人帶來的麻煩與困擾，反覆述說過程無法好好處理傷害的困境，\n\n將會使她動彈不得。\n\n\n\n　　加害者們逍遙法外，身為受害者的她，則身心皆陷囹圄。\n\
  \n\n\n　　除了必須「足夠抵抗」才能成為「被害人」，電影裡另一個將她定罪的\n\n「證據」，則是「自由心證」：她為什麼沒有反抗？從過去曾被性侵、卻因\n\n\
  事後反應不夠典型而未能起訴的「前科」，都證明了她會再犯；曾經酗酒的\n\n過去證明她有幻想、誇大的心理問題；她愛看犯罪小說，還會為犯罪細節畫\n\n線，則證明了她有設計犯罪的可能與能力。\n\
  \n\n\n　　她整個人被任意挖掘、剖析，好導往他們想要證明她「誣告」的目的。\n\n\n\n　　隨著劇情進展，我幾乎跟著莫琳囿在原地，莫琳說她「無法閱讀」，我\n\
  \n則「無法寫字」，而隨著警方言之鑿鑿愈顯木然而機械化的莫琳，終於在認\n\n罪之後，用抽一口菸止住冷和顫抖──一直對這個進展感到荒謬混亂的我，\n\n在這一刻僵住了。\n\
  \n\n\n　　怎麼可能……這真的能自導自演嗎？\n\n\n\n　　「我是唯一一個有名字、有臉孔的人，我沒有說謊，我沒有捏造事實。」\n\n\n\n　　在莫琳承認說謊，遭到判刑，事隔六年後，才逐漸恢復原本的自己：換\n\
  \n了律師，也從當初警局裡支持她的女性警員得到類似刑案為線索，尋找當時\n\n也被迫認罪的被害人後，才以此宣言自證清白。但事件並未重啟調查，當初\n\n她為「沒有名字的勞工」抗爭早成泡影，只留下她這個受害者的名字；至於\n\
  \n法國的核能技術終究落入了中國的手裡，也遭到中國控制。\n\n\n\n　　觀影的同時，伊莎貝雨蓓精湛的表現讓我同樣陷入木然，直到六年後才\n\n驀然驚覺：啊，案發後的她是「非常」狀態。觀影結束，我有好長一段時間\n\
  \n思緒空白，也無法回顧劇情與整理感受。讀著別人的影評時想：寫得好好，\n\n那我就不用去整理了。但腦子裡揮之不去的，是莫琳被清潔員發現時的模樣。\n\n\n\n\
  　　犯罪者是訓練有素的，不只是沒有留下指紋與ＤＮＡ，以及作案工具全\n\n取材屋裡而已。他們用膠帶反綁莫琳的手腳，在雙手可及的位置用刀留下記\n\n號，蒙住她的眼和嘴，然後把刀柄插進她的身體裡，刀刃向外。\n\
  \n\n\n　　妳最好看不見也聽不到，就算看見聽到，也最好閉嘴。我可以擺弄妳的\n\n身體，但刀刃向外的妳，就是兇器本身。\n\n\n\n　　這樣妳只要開口，就會有人注意到兇器，進而指認妳是謊言。\n\
  \n\n\n　　那就像一種魔術，讓我們注意被害者沒有足夠抵抗，卻忽視她遭受暴力\n\n威脅；注意她沒有掙扎「不合常理」，卻忽視在目不視物的極度恐懼裡，必\n\n\
  須解離才能阻止心靈崩潰；注意向外的刀刃，卻忽視加諸在她身上的傷害。\n\n\n\n　　因為她是女人，而且一直試圖揭開女性在生活中的存在、傷害、應有的\n\n權益，無論何項都容易被忽視的魔術。\n\
  \n\n\n　　這也是為什麼「無毒不丈夫」鼓勵甚至讚揚男性為了維護權力冷血無情，\n\n卻用「最毒婦人心」為困境裡試圖維護權益的女性貼上標籤，在現實的區隔\n\n\
  能同時存在。\n\n\n\n　　想起觀影時思考停滯，甚至差點跟著懷疑莫琳的念頭，那真的，非常訓\n\n練有素。\n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n\
  我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\n                                  陳斐雯  貓蚤札（其三）\n\
  \n--"
