title: '[討論]《無人相信的真相》雨蓓台中見面首映會'
content: '法國影后伊莎貝雨蓓主演的《無人相信的真相》台中見面首映會，在二月下旬開放搶票之

  後秒殺，原本以為沒有機會參加了，沒想到十幾分鐘後，閃光居然說他買到了一張票，真

  的不敢相信！


  真的是超感謝閃光的快手搶票！！


  期待了兩個禮拜，今天的首映會終於到來。


  當雨蓓優雅現身時，全場頓時歡聲雷動。


  雨蓓白天在國家歌劇院舞台劇《櫻桃園》的演出之後，晚上還來到台中大遠百威秀出席見

  面會，讓人很感動。

  她在映前受訪了約十分鐘，本來以為在致詞後就要回飯店休息，沒想到接著走入觀眾席..

  ....


  大家這才回過神驚喜尖叫——雨蓓要陪全場觀眾看電影！！


  到現在還是彷彿做夢一樣，誰能想到一位國際級影后竟然在百忙之中抽空陪了大家看了整

  部電影！！


  影后真的是誠意滿滿，尤其明天還要繼續在國家歌劇院演出～～


  電影結束時，全場立刻報以熱烈掌聲，感謝雨蓓帶給我們這部精彩的電影，以及這個美好

  的夜晚。










  雨蓓在片中飾演真實人物莫琳嘉內，

  身為工會代表的莫琳為了捍衛基層工作權，在資方的決策過程中，與高層及其他政商勢力

  不停周旋。但一個人再怎麼強悍，都不免有脆弱的一面，

  特別是又陷於警方與檢調預設立場的羅生門之中。


  雖然莫琳一度為了無法舉證而退縮，

  幸而最後還是堅持戰鬥，才喚回了自己的清白。而對於資方決策對勞工的影響，事後也證

  明了莫琳的判斷。


  雖然面對資方及政商勢力必然受到排山倒海的壓力，還因為可能擋人財路而受到恐嚇跟蹤

  ，但整部電影的節奏明快，甚至還有幽默的地方，頗能呈現一位工會幹部面對壓力的日常

  本能與態度。


  主角的人格特質跟經歷使其具備了強大的抗壓性，然而家人親友與工會的支持也不可或缺

  。雨蓓在映前就說這不是個讓人開心的故事，現實生活中的莫琳能這樣走過來真的不簡單

  ！


  感謝雨蓓的精彩演出，將這樣的一位人物帶到我們眼前！



  電影介紹——


  本片改編自莫琳嘉內 (伊莎貝雨蓓 飾) 的真實故事，她是法國一家跨國核電廠的工會代

  表。因揭發法國核工業的極密交易案而成為了吹哨者。


  她隻身與世界、政府及業界高官奮戰，竭盡全力揭露醜聞並捍衛五萬多名工會成員的飯碗

  。


  然而某日，當她在家中遭到暴力襲擊後，生活開始天翻地覆。案件調查因為敏感議題而不

  斷遭到施壓，更讓原本的受害者莫琳嘉內頓時之間成為了自導自演的嫌疑犯！


  電影在 3/17 正式上映。


  國際中文版預告：



  --'
