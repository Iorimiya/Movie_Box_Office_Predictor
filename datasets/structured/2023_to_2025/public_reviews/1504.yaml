url: https://www.ptt.cc/bbs/movie/M.1691806619.A.3E5.html
title: '[負雷] 忌怪島'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  第一次發文，諸多不通順及敘述跳躍請見諒

  帶有強烈個人主觀意見及解讀


  我的感覺就是

  動物森友會+貞子+神隱少女

  因為創了個虛擬小島結果連結到陰間

  喚醒今女而引來殺機

  今女甚至可以跑進現實世界抓人回VR

  鳥居也可以突然從螢幕跑出來在現實出現

  神隱少女部分是指海中鳥居的神秘感


  要把今女封印在陰間要滿足兩個條件

  1.把陽間的門關上（把現實鳥居鋸掉）

  2.今女要回到陰間（回到VR世界）


  所以當鳥居被鋸掉時

  茂伯把虛擬小島資料毀掉

  今女回不去虛擬小島

  認為這樣就解放今女了

  自己也不愧對非自願殺母一事

  就自殺了


  看到茂伯的密室

  原本以為今女沒被封住是因為茂伯把鳥居藏在房間

  所以他們鋸錯了

  結果茂伯好像就只是很推他媽

  密室鳥居純粹是個祭壇


  結果男主要拉今女回陰間

  就跟今女在VR裡同歸於盡

  女主一起進去陪葬

  還塞了一條完全沒必要的吊橋效應感情線

  本以為陽間的事應該就結束了

  但看到最後凜唱完歌投海自盡

  恐怕也是沒成功封印

  結局應該是如靈媒所說

  島上只剩下死人和瘋子了


  茂伯媽為什麼會發瘋開始喜歡勾引男人也沒有交代

  感覺就只是想要給茂伯安一個可憐人設

  也沒有解釋祭祀石敢當是為了保佑什麼


  女主爸

  就是有錢沒命花最佳代表

  女主來到島上的理由就是他

  然後人家來了又叫人家快滾


  凜（女學生）在這部片用意有點看不懂

  頻繁出現，但感覺可有可無

  可能只是用來表達茂伯也有善良的一面

  但把她跟屍體關在一起也沒比較好


  個人覺得完全沒必要進影院看

  感覺只是因為「在海中的鳥居很有神秘感」而發想的一部片


  這部片唯二好看的就是男主的臉跟最後一幕的海中鳥居景色



  --'
