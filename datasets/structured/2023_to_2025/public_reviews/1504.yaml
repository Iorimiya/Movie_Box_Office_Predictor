url: https://www.ptt.cc/bbs/movie/M.1692359385.A.B14.html
title: '[大負雷] 忌怪島 元素混和錯誤的一部片'
content: '因為被電影海報吸引加上又有特惠票所就去看了


  只能說這部不要去電影院看


  很適合在家用串流跟大家一起吐槽


  要不然會腦中風


  要不是有特惠票我可能更生氣





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這部一開始就帶出用VR創造出一個島


  他們叫他新世界


  其實這個設定非常的多餘


  要用沒關係但他到後來的劇情讓這個設定變得非常可笑


  一開始一個金髮男人在海邊看風景看一看就被發現腦波出問題


  另一邊的女社長就戴上頭盔跟金髮男一起畫面同步


  到後來畫面就出現一個紅衣女鬼


  開始亂飄然後兩人就陸續死亡


  畫面轉跳到男主角這


  男主角正在跟剛剛的女社長vr視訊後來發現是影像畫面


  男主角被帶出是超級腦天才設計師


  但整個社交零分演技也不大行


  他到了新公司結果新公司總共加女社長5個人


  這4個一臉看起來就是隨時會跑去夜店開趴的樣子


  兩男兩女不包含女社長


  嚴重懷疑兩個女職員事被派來養眼的 整個就是狀況外


  後來劇情帶到前面死掉金髮男的女兒來領她爸骨灰


  女主角為了見到他爸所以拜託男主角繼續開發那個新世界


  但這裡編排很奇怪 好像男主角是為了女兒才繼續開發新世界


  因為演員演技太彆腳所以把不喜歡社交


  演成那種處男看到美女不敢直視的樣子


  前面劇情三分之一都會一直帶到女社長跟金髮男


  陰魂不散在整男主角周圍


  以為女社長在後面會幹什麼大事


  沒有就是單純的裝神弄鬼


  後來經女兒的拜託男主把金髮男生前的影像具現化


  中間的看到一個紅衣女但不清楚餘事在各種方法之下


  用了巫女的腦波去看到了女鬼


  前面這裡都還可以忍受畢竟鬼片需要一點鋪成才能有一點爆點


  但從這裡就開始變成傳送門遊戲了


  影片裡的女鬼再用巫女的腦波算圖完就不見了


  才發現女鬼從影片跑到真實世界


  劇情設定是新世界是陰間 主角們的世界是陽間


  不知道怎麼回是它們不小心弄出了陰間


  兩邊的出口是一個鳥居


  這鳥居帶出紅衣女鬼的的故事


  女鬼的名字是今女


  反正就是很雖小的女生被強迫變成妾室


  被正室忌度忌妒弄到死的可憐故事


  紅衣是因為鮮血染紅了白衣


  還被綁到鳥居叉在海岸邊


  在大潮當天就被活活淹死了


  以上這段今女的故事非常的優秀


  很傳統日式編劇真的應該用這段好好發展就好


  多了vr這個設定真的很多餘


  想要創新但融合不佳


  好紅衣女鬼金女現身後開始亂殺人鬧鬼


  因為經費不夠整個特效都很低廉


  表現方式也很低能


  比如說人就2d平移地被抓上去下一秒屍體畫面


  整個恐怖感全失


  或是女鬼會瞬間移動從地板跳出來把人抓走


  要救人回來竟然是男主角要用vr進去新世界


  為什麼是男主角?


  因為只有男主角可以登入


  把女鬼趕走被抓的那個人就會從現實世界直接從一攤水出???


  男主角就繼續在水中掙扎


  要救男主角其他人想進去結果只有男主角會設定


  超哭


  所以用另一種方法到現實世界鳥居的地方把鳥居弄倒


  這樣就可以救男主


  結果另一個男社員拚死名騎腳踏車過去


  還帶一個小短梯??


  我不懂帶那個東西要幹麻


  到後來他只拿一個大鋸子在水裡鋸鳥居


  重點是兩居兩邊一個快斷的柱子不鋸


  他選擇鋸完好的???


  我真的不懂


  所以他壯烈犧牲


  蠢死的


  本來以為演完了



  沒有



  還有其他支線



  前面其實有帶到一個被村子排擠的阿伯


  到這裡帶他的故事


  原來他媽媽中邪-劇裡叫今女附身


  到處勾引男人


  兒子就連帶一起被排擠


  所以阿伯要報復村子


  解放今女


  幹以為要幹大事


  結果劇情不夠演


  阿伯解放完就自殺


  解放就是把電腦砸了


  今女就從鳥居爬出來要幹掉眾人


  男主角不知怎麼地又快速的連到新世界把今女拖著


  讓眾人可以燒掉鳥居


  幹掉今女的男主角開始他其實不喜歡一個人


  想要跟大家一起巴拉巴拉


  妙的是女兒不用vr就能用精神呼喚把男主角拉回來


  劇情這裡就演得差不多了


  我也快腦充血了


  後來男主就跟女兒一起離開


  但離開時看到原本被燒掉的鳥居劇然還在


  空無一人的船跟今女的腳練聲


  還有兩位的手臂都有新世界獨有的編號


  所以可能暗喻他們其實沒有逃出來


  我真的不在意了


  片尾彩蛋是前面跟阿伯很好的女學生不知到為什麼


  三味線彈一彈就走到鳥居又聲來的海裡自殺了


  這段是長鏡頭很美但很白癡



  以上是劇情大概


  兩個小時我看到一半就想走了


  其實電影裡的懷舊片段都拍得很有味道


  很有日式恐怖片的感覺


  這部如果專注於今女的傳說不要再多加什麼新世界


  一定會好看很多


  加了新世界這創意不錯但劇情太拖沓


  但表現手法太弱智


  整部壓縮到90分鐘應該可以更緊湊


  莫名丟一堆若有似無的東西能理解但太多了


  有點可惜


  已經很久沒看到很恐怖的日式恐怖片了


  但推薦大家可以上串流時一起看一起吐槽




  --

  我是長頸鹿，我驕傲!




  --'
