url: https://www.ptt.cc/bbs/movie/M.1691892551.A.3E7.html
title: '[生駒雷] 忌怪島'
content: '雷文防雷資訊頁



  上個月就在網頁上看到這部鬼片要上映~竟然看到我大生駒的名字!!~好久沒看到萌萌搭的

  生駒了~ 馬上記下上映時間~一切文字介紹訊息都不去看~直接電影院見~!! 原本以為晚上

  9點場又是日本鬼片~應該是接近我包場來看的~結果竟然來一堆人來看~坐了3排多人~也是

  比較離譜! 看來大家都喜歡被爛片來折磨~

  以下為全劇情詳細炸裂生駒雷~



















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~










  一開始就是一個白髮男在海邊的房子帶著腦波頭盔不知道在幹嘛~後來發現好像有點不對

  勁~有個紅衣女鬼出來了~白髮男被嚇到往海攤跑~另一場景有個像資訊主管樣子的女人在

  一堆電腦螢幕的房間發現連線中斷了~原來那海邊是虛擬實境元宇宙~白髮男是裡面的工作

  人員還是實驗對象的樣子~ 女主管發現白髮男出狀況斷線了~女主管也傻傻的戴上宏達電

  做的VR頭盔進去元宇宙海邊想進去看看怎麼回事~結果就是兩人雙雙把頭送~ 在元宇宙的

  分身死了~物理世界人也跟著死了~ 重點這兩個倒楣鬼後來還變成幽靈時不時突然跑出來

  嚇人~ 也是又夠煩的~ 不重要~這故事的敵人主要就是紅衣女鬼~


  後來故事開始~男主自閉宅在剛剛的元宇宙小島海邊跟前面那個女主管用元宇宙虛擬分身

  見面，女主管邀請他來真實世界小島加入宏達電元宇宙小組進行程式開發~還說之後要單

  獨跟他當面說重要的事...是什麼事? 要把男主吃了嗎 = = 不重要~反正這時候女主管早

  已經死了~


  後來男主隻身前往小島~ 到了後與當地的元宇宙小組會合，在島上有個叫做茂爺的老頭負

  責接待他，這個茂爺也是滿重要的~後面再說他。

  元宇宙小組大概有5個人的樣子，3男兩女沒記錯的話，不重要，我大生駒就是裡面的一員

  ~不過老實說這個小隊除了男主有用之外其他所有人包含生駒全是廢物~ 應該說這電影除

  了男主還有後面的一個女靈媒2個人有用以外~全小島的人都是廢物~也是比較離譜~

  這時才發現原來我大生駒不是女主角~他只是一個賞心悅目的腳色~~真是有夠可愛的~ 這

  電影出現的腳色也滿多的~片長也超過100分鐘，品質還可以~ 清水崇導演的~當作一部小

  島觀光風土歷史文化傳統音樂演唱會生駒美女宣傳片來看就好，也是非常得不錯~


  男主上島後就帶元宇宙小隊進入元宇宙海邊小島觀光~原來這個元宇宙小島是先前男主掃

  描物理世界的小島真實原比例還原出來的~然後元宇宙小隊這幫廢物在那邊一個勁的誇男

  主的時候~突然訊號炸裂女鬼進入~要把男主幹了的時候~好像是我大生駒把男主的宏達電

  VR頭盔拿下來了~有驚無險中斷連線~男主撿回一條狗命~


  中間穿插茂爺這個糟老頭竟然還有一個粉絲小迷妹~還是小學生等級的 = = 就有夠離譜~

  一個小幼女整天去找茂爺~還帶食物給他吃~ 看起來然後這個茂爺也是個怪人~動不動就去

  拜路邊的石頭~也不曉得在拜什麼~ 還會被當地的人欺負 連小學生都欺負他~然後她的這

  個小迷妹因為常去找茂爺~也同樣被同學欺負~反正就是物以類聚拉~這兩個就是被欺負報

  團取暖小隊。


  後來女主臉臭女也上島了~他是來島上拿回她爸的骨灰的~他爸就是前面死掉的白髮男~ 後

  來跟男主搭上~ 一起迷路後去到女靈媒家~ 女靈媒一口斷定男主會跟白髮男一樣的死法~

  被淹死~真的是有夠不會說話的~當人面這麼說~有夠穢氣的~如果在台灣早就被人揍了~重

  點這女靈媒竟然狗到了故事最後都沒有死!~~尤其靈媒中間幫女主做法落觀音的時候有引

  來女鬼~這都沒被女鬼幹死~也是非常的離譜~換其他100個鬼片中的靈媒，有99個一開始就

  被鬼魂殺掉立威了~ 所以我說這靈媒是真的有實力~


  後來為了調查白髮男跟女主管的死因~男主就去跟元宇宙進行資料還有腦波同步~發現了白

  髮男死前在元宇宙有遇到紅衣女鬼~ 為了詳細調查再等電腦跑一整晚資料同步的時候~小

  隊成員之一的嘴臭輕浮男因為前面被生駒罵了之後跑去喝個爛醉~ 凌晨時候跑去電腦哪邊

  剛好資料同步完成，他就帶上頭盔去元宇宙~直接被女鬼拖去水裡淹死~


  隔天小隊發現人死後，還發現女鬼好像從元宇宙穿越到現實世界了~ 後來女鬼就在真實世

  界小島上時不時出來調皮一下~像是在樹林偷看男生尿尿阿 ~ 偷偷跑去浴室跟女生泡澡阿

  什麼~


  最後女靈媒跟元宇宙小隊說~這是島上久遠的詛咒~紅衣女鬼是過去是島上的一個奴隸~被

  島上的暴民欺負並釘在鳥居上丟海裡淹死~後來咒力爆發殺了島上一堆人~ 變成當地的詛

  咒~ 並說男主創造的元宇宙小島也被女鬼當成陰間住了下來~


  小隊認為是鳥居連通元宇宙跟真實世界~男主決定再帶上宏達電頭盔前往元宇宙把女鬼引

  進去後毀掉鳥居~永遠把他困在裡面~同時小隊中的隊長老實男也同步趕去真實島上的鳥居

  ~在海邊~也要同步把鳥居給鋸斷~毀掉兩個世界的連接~然後男主在元宇宙跟女鬼纏在一起

  的時候~~茂爺這個死老頭突然闖進來把全套元宇宙AI伺服器給砸掉了，說要解放女鬼~ 然

  後就烙跑了~ 男主傳送回真實世界醒來，不曉得為什麼沒有死掉~~ 同時在海邊的老實男

  最後是把鳥居給砍掉了~但他也被女鬼淹死了~而且砍掉鳥居好像沒甚麼鳥用~


  後來男主用電腦殘骸中找到有一卷茂爺的實驗腦波資料~原來茂爺之前也是這項元宇宙計

  畫的實驗對象的樣子~透過腦波同步男主知道了茂爺的過去~ 原來茂爺的媽媽以前疑似受

  到女鬼詛咒~變得瘋瘋癲癲並瘋狂勾引島上男人~也是被全島給追打~後來小時候的茂爺好

  像就用刀把媽媽給了結，後來還把屍體藏在自己家裡~真的是有病~ 男主也遭受精神打擊

  導致腳麻了~坐在電腦桌前一動不動想要裝死~


  之後茂爺破罐子破摔~不演了~  說我就是要報復社會~ 叫你們欺負我~跑去跟女靈媒道別

  後就跑到山上去跳山自殺~也是比較的帥~人家都投海你是跳山~



  然後剩餘的小隊成員3個女生~我大生駒、女主臉臭女~還有一個沒提到的影薄女生一起去

  海邊要把鳥居殘骸撈起來，這時女鬼大白天從海邊現身上去就要把他們3人幹了~ 關鍵時

  刻男主從元宇宙穿越過來真實世界把女鬼拖進海里~想要跟女鬼同歸於盡~ 海上3人趁機趕

  快把鳥居殘骸拖上來~這時不得不說我大生駒在這部片真的是個老六~全片都在滑水~什麼

  事都沒幹~而且還躲得很好~好像全片中小隊成員就他一個沒有被鬼騷擾過~也沒單獨碰到

  什麼怪事~跟開了掛一樣~重點把鳥居拖上來後他還搶第一個用火柴把鳥居給燒了~整場神

  隱最後跑出來把女鬼人頭給K了~真的是個絕世老六~

  女鬼後來疑似就被燒死了~男主也在水中被女主給撈上來~


  結局男女主一起坐船離開島上~在海上的時候發現島上海邊怎麼又出現一個鳥居?~不是已

  經燒掉了嗎?

  然後船艙後面這時傳來女鬼的腳鍊聲~男主女也不回頭看直接放推~ 不過這時男女主的手

  上都有浮現元宇宙分身的虛擬帳號~代表最後一幕應該是在元宇宙中不是真實世界~ 有可

  能最後男女主就在元宇宙住下來了~反正這兩個怪胎都有點自閉症~ 也跟女鬼一起在元宇

  宙世界~


  還有一幕結局是先前跟在茂爺旁邊的小迷妹粉絲也一個人獨自走向海邊的鳥居投海自殺~

  大概也是受不了被欺負了~也也許是茂爺死了她也不想活了~ 有可能變成下一任的女鬼~


  結局最後的人聲歌曲變成一個很恐怖的老人聲音在唱歌~也有可能是茂爺也變成男鬼了~不

  一定~


  全劇終~



  --'
