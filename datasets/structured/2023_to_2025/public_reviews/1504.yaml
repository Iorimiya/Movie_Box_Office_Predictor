url: https://www.ptt.cc/bbs/movie/M.1692199367.A.83E.html
title: '[普雷] 忌怪島 '
content: '我是2023/8/16

  中午12:30分台中文心秀泰

  現場七個人觀看


  在電影院看，我覺得感想是普通。

  但如果到時候上串流平台，

  在電腦上看，我覺得大家看完會覺得難看。

  但可以確定的是完全不恐怖。


  唯一的恐怖點是，

  整場觀影時，左邊的樓梯一直感覺有人要走上來，

  但大家轉過去都沒人。




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  我覺得清水崇很想拍出有劇情的電影

  所以近期每一部都必須拍個有典故，

  否則好像會淪為B級片。


  問題是，鬼片就是要恐怖，

  這部片真的做得很失敗。



  其實我本身有GP+，所以兩三個月後平台就可以看這部電影了，

  我不會去電影院看車庫娛樂的電影。因為忍一下串流就有了。

  但因為我支持清水崇，加上我想去奄美大島，

  因此特地去看奄美大島美不美XDDD



  1. 男主角討人厭

  2. 女鬼不恐怖

  3. 女鬼的兒子要來個精彩大報復結果完全沒有

  4. 太過超現實，沒有帶入感。不像咒怨生活化。

  5. 許多不必要的角色，特別是某一個喪父的女主角，

  根本是被硬插進來的腳色，還可以大搖大擺進入人家工作地方，

  表現得還比員工還專業，超級違和。

  6. 小女生超超超超超超級可愛又漂亮，

  但為何如此善良，對女鬼兒子這麼友善沒提到。



  老實說，我覺得凶宅怪談比這部電影好看。

  因為至少夠生活化。



  我在看鬼玩人的時候，

  或者是以前的恐怖片突然想不起來，

  現場嚇到後會有笑聲傳出來。


  但是這部片是螢幕亮起來後，大家噗哧笑了出來。



  其實我知道鬼片越來越難拍，

  因為已經不是90年代那個人人怕鬼人人把很多事情都解讀為靈異事件，

  但我想再怎樣，把鬼片做的很科幻絕對是錯誤的。


  --'
