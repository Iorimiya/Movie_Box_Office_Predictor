url: https://www.ptt.cc/bbs/movie/M.1760286400.A.C13.html
title: '[好雷] 河鰻'
content: '主角張佑亮住在被河包圍的社子島上

  在焚化廠工作的他，看似單純開朗善良

  但實則是個被困住、迷失方向的行屍走肉


  走不出父親失蹤的陰影的他

  照顧著父親遺留下來、僅存的鴿舍

  像是在守著一段早已腐朽卻捨不得放手的過去

  而為了避免夢遊，張佑亮會在夜晚時用繩子綁住自己的腳

  也因如此，腳上總是有著半夜掙扎而產生的勒痕


  一日張佑亮在河邊洗澡

  遇見了穿著連身花裙的林亞曼

  她靜靜漂浮在河面上，像是一場夢，也像是一個預兆

  讓原本死寂的生活泛起了漣漪

  她說話的語氣有種奇異的距離感

  像真實存在的人，又像張佑亮心裡的幻影


  林亞曼不是一個單純的過客，也不是甚麼救贖女神

  她帶著某種逃離的氣息

  河的對岸彷彿有著她不願提起的過去

  她對自己保持沉默，也對世界保持警戒


  張佑亮試著打開自己封閉的世界

  他帶林亞曼看鴿舍、修繕老屋、帶她走進不願面對的記憶

  但偶爾會在夜裡消失，第二天又若無其事地出現

  那段相處，像是一場彼此靠著取暖的夢

  既像救贖，又像兩個溺水的人抓著對方的手

  在水面上勉強漂浮


  河鰻不是一部可以明確解讀的電影

  但它是一部感受性強的電影

  它沒有明確的結局，諸多橋段也沒有收斂答案

  如果習慣看商業片的話可能會覺得有點悶，

  但只要願意靜下來，它會慢慢滲進心裡

  不急、不吵，卻在不知不覺中帶走了什麼


  --'
