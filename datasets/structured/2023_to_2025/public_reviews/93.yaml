url: https://www.ptt.cc/bbs/movie/M.1750504947.A.A39.html
title: '[好雷] 河鰻EEL #台北電影節'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n#台北電影節\n《河鰻》：河水帶來又帶走\n\
  \n1. 美景x男體影像集\n\n攝影和調色非常迷人，色彩有點過飽和（應該是？），可能是想呈現非現實的時空感。很\n想停下來看每個細節跟物件，也期待男主角 潘綱大\
  \ 之後的演出。\n\n2. 謎樣的氣氛、謎樣的電影\n\n氣氛營造滿分。緩慢而神秘，過程不會無聊，一段神秘難忘的觀影體驗。\n\n3.  沒慧根看懂所有比喻，但可以抓到大概的意象。\n\
  \n這部片是關於逝去的悲傷。男主角被對父親的思念困在河邊，不斷加固強化河邊的房子、\n餵養留下的鴿子。他沒有任何人生方向，用打手槍、做夢、疼痛等種種方式逃離現實。\n\
  \n他在河裡埋下了對父親的執念（河鰻），後來亞曼的到來帶給他希望，他終於放棄尋找父\n親（殺死河鰻），擁抱新的方向和希望（亞曼產卵），即便他沒有設定與亞曼的目的地和\n\
  方向。\n\n要說男主角的放下，其實沒有一個明顯的轉捩點。《河鰻》裡只是提到生命必然發生的死\n亡和離別，比如胖豬之死、阿嬤離世，但生命的轉念，本來就可能是瞬間的、突然的。\n\
  \n河水帶來的，河水都會帶走。生命其實就是一場漂流，我們停泊在岸邊，或偶然河堤相會\n，都會留下美麗的漣漪與迴響。\n\n擁抱所有的聚散跟執念，一起迷離在成河的生命與思念。\n\
  –\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n--"
