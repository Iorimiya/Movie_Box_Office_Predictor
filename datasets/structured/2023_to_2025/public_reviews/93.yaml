url: https://www.ptt.cc/bbs/movie/M.1737464194.A.F18.html
title: '[新聞] 柏林影展台灣「河鰻」強勢入圍：暌違20年'
content: '第75屆柏林影展於台灣時間21日傍晚公布入圍名單，台灣視覺藝術家朱駿騰跨界執導的首

  部劇情長片「河鰻」（Eel），入圍柏林影展「視角」（Perspectives）競賽單元，導演朱駿騰聽聞入選消息後直言：

  「在20年後再次回歸拍攝電影，既熟悉又陌生，很多時候會感到不安，聽到入選時候真的

  會有種苦盡甘來的感覺，但能夠在這麼大的電影殿堂讓電影和大家見面，也非常興奮，希

  望能夠聽到大家對電影的反饋。」


  「視角」（Perspectives）競賽單元是柏林影展今年新增的單元，主要入選來自世界各地

  新銳導演的首部長片，今年入圍該單元的電影共14部，「河鰻」將代表台灣與來自世界各

  地的電影角逐最佳首部長片獎，朱駿騰導演也將率領本片主演及主創團隊前往柏林出席世

  界首映，台灣將於今年秋天正式上映。


  「河鰻」由曾入圍金馬獎新演員提名的潘綱大，與初次出演電影的歌手柯泯薰主演，故事

  以台北市兩條河交匯處的社子島為背景，藉由靈動的攝影調度，風格獨具的影音佈署，構

  建一如夢似幻、充滿屬於台灣鄉野靈氣的世界，反映出生命中的不確定性與人們對歸屬的

  渴望，是一部關於慾望與歸屬的奇幻愛情故事。導演朱駿騰提到：「『河鰻』是我對生命

  與慾望，以及歸屬感的探索。整部片我想讓觀眾體驗，隨著電影漂浮在水中的狀態，而能

  夠將對我來說非常有魅力的社子島呈現在大銀幕，讓世界各地的人看見，也是讓我非常開

  心的一件事。」


  而去年因演出「蟲」參加坎城影展的潘綱大，本次新作又入選柏林影展，他聽聞後也開心

  表示：「聽到這部被颱風、海浪和日曬攻擊過的長片「河鰻」要在柏林影展首映非常開心

  ，社子島是台北的一隅，卻常常被台北人忘記，很慶幸朱駿騰導演還記得，而且將它帶給

  世界。我已經在存錢，希望能順利把「河鰻」帶去柏林，也從柏林載回滿滿的東西。」而

  歌手柯泯薰首度挑戰大銀幕便入圍國際影展，聽聞入圍的消息柯泯薰也表示：「知道這一

  切過程真的不容易，所以真的非常恭喜導演和劇組，但反應過來後發現自己也是身在其中

  的一員，突然覺得很酷很好玩。」


  多年跨足於視覺藝術領域的導演朱駿騰，擅長探討當代社會下的人性情感與生存困境，其

  2006年世新大學畢業作，改編川端康成小說的短片作品「睡美人」（The House of Sleep

  ing Beauty）初試啼聲即入選克萊蒙費宏影展，而後，其影像創作多所挑戰當代藝術與電

  影的邊界。在「河鰻」這部電影中，他將視覺藝術的精髓帶入電影語境，創造出充滿情感

  重量的畫面，深刻地勾勒出人與萬物之間深沉的連結。電影的影像語言極具實驗性，不僅

  在視覺上帶來衝擊，也在感官層面挑起觀眾對於記憶、欲望與個體之存在的探尋。


  「河鰻」以濃烈的視覺符號和隱喻，獨特的影音風格和大膽的創作選擇，成功突破類型電

  影與藝術電影的界限，成為柏林影展在新任藝術總監翠西亞・塔特爾（Tricia Tuttle）

  所開創的全新競賽單元「視角」（Perspectives）14部入圍影片之一，共同角逐最佳首部

  長片獎。




  --

  是專門給新導演參加的官方競賽唷~~'
