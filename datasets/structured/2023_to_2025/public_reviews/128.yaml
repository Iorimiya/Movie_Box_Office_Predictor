title: '[新聞] 印尼超模<鬼祭>禁地解放情慾，台全見上映'
content: '新聞網址：



  印尼年度最賣座真人電影《鬼祭》（Sugar Mill），改編自爆紅真實恐怖故事，並在鬧鬼

  糖廠真實取景，一舉吸引近500萬印尼觀眾搶看，本片也即將在本週五（9/19）於台灣驚

  駭獻映。為了讓演員更加融入角色，劇組特地安排演員實地考察，與糖廠工人交流糖廠中

  的超自然事件，就當聽聞斷指、跳樓等各式慘案發生，也讓演員們紛紛毛骨悚然到說不出

  話來。身為「完美主義者」的導演艾文蘇亞迪（Awi Suryadi），不僅讓演員親自上陣，

  挑戰高空摔落戲，更為了讓一鏡到底的場面達到理想效果，連續拍攝12小時，讓女星艾瑞

  卡卡爾利納（Erika Carlina）忍不住感嘆：「真的非常辛苦！」值得一提的是，在社群

  平台上擁有超過400萬粉絲的印尼超模艾瑞卡，更在片中大膽解放、挑戰激烈情慾戲。這

  在民風相對保守的印尼，可以說是驚人之舉，為了符合當地影視規範，還得大刀修剪部分

  片段，並在最終於上映時，推出兩種不同尺度的版本。即使這樣，台灣也將上映畫面尺度

  、心理壓迫、恐怖張力全面升級的一刀不剪「重口味」版本，值得觀眾進戲院一探究竟！





  印尼年度恐怖懼作《鬼祭》，取材自印尼民間傳說，結合荒廢糖廠神秘軼事，更在真實鬧

  鬼糖廠取景拍攝。為了讓演員自然融入角色，劇組特地安排演員們與當地糖廠工人交流，

  從外在手勢、表情與口音下手，演員瓦維吉漢（Wavi Zihan）表示：「角色的深度非常重

  要，尤其是在這部電影當中，我們需要扮演工人，手勢和表情都必須貼近真實。對我們這

  些平時生活在都市的人來說，也得要學習當地的東爪哇口音。」此外，工人們更分享多件

  曾經發生過的糖廠超自然慘案，飾演男主角的演員阿爾巴尼亞西茲（Arbani Yasiz）回憶

  ：「電影裡看到的儀式，其實都是真實存在的，那些工人們說這些儀式真有其事，而且一

  旦儀式被中斷，便會開始出現一些靈異事件，像是手或手指斷掉，甚至有人還因此喪命。

  」在片中飾演女主角的艾爾夏奧蕾莉婭（Ersya Aurelia）也補充：「我們真的看到那些

  季節性勞工遭遇悲劇的照片紀錄，甚至有人從建築物跳下去。」各式驚悚經歷，也讓演員

  們聽完後，都紛紛毛骨悚然到說不出話來。





  《鬼祭》由《鬼舞村》（KKN di Desa Penari）導演艾文蘇亞迪最新執導，身為「完美主

  義者」的他，為了講究真實，不僅讓演員們挑戰親自上陣的高空摔落或跳躍戲碼，更為了

  讓一鏡到底的場面能夠達到理想效果，連續拍攝12小時，不斷重拍到滿意為止，演員艾瑞

  卡卡爾利納回憶起拍攝當下：「那是一場總長三分鐘的戲，採用一鏡到底方式，情緒從零

  開始，逐漸一層層疊加，最後爆發到極致，很考驗情緒銜接，我們最後拍了29次！從早上

  七點半開始，一直到晚上七點半才收工，真的非常辛苦！我尖叫到最後已經都沒有聲音了

  ！」



  值得一提的是，在社群平台擁有400萬粉絲的艾瑞卡，本身也是擁有火辣身材的印尼超模

  ，導演也讓她在片中大膽解放，與男演員在禁忌之地挑戰重口味情慾戲，進而誘發一連串

  驚悚慘案。由於印尼民風相對保守，這場情慾戲在當地可說是大爆尺度，為了符合當地影

  視規範，本片在印尼上映時，也依據畫面尺度分為「黃色時段」與「紅色時段」兩種級別

  版本，「紅色時段」更必須在夜間才能播映。而台灣則將上映收錄大尺度，而且心理壓迫

  、恐怖張力全面升級的一刀不剪重口味「紅色時段」版本，絕對是台灣觀眾不容錯過的年

  度靈異代表懼作！



  這部由「印尼溫子仁」艾文蘇亞迪執導，直擊人性最深恐懼的的靈異新作《鬼祭》，即將

  在本週五（9/19）於台灣驚駭獻映。本片劇情描述每年甘蔗產季，爪哇的老舊糖廠都會向

  村莊招募臨時工；大批年輕人湧入，只為賺取微薄工資。恩達（艾爾夏奧蕾莉婭飾演）、

  法迪爾（阿爾巴尼亞西茲飾演）與朋友們也加入其中，在這座與世隔絕的糖廠展開勞動。

  白天，一切看似正常；但每當夜幕低垂、工廠哨聲響起，所有人都被命令嚴禁離開宿舍—

  這段時間，被稱作「紅色時段」，他們被警告：「無論發生任何事情，都不可以離開宿舍

  。」不過某個夜晚，恩達從夢中驚醒，彷彿某種詭異力量牽引著她，讓她違反禁忌，踏進

  無盡黑暗，跟隨一道模糊黑影消失在廠區深處…。此後，工人們接連慘死，死亡像瘟疫般

  蔓延整座糖廠。他們請來靈媒做法，試圖平息惡靈的怒火，卻意外揭露更駭人的真相——

  這些惡靈所渴求的祭品，是活生生的人命…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
date: 2025-09-16
sentiment_score: 1.0
