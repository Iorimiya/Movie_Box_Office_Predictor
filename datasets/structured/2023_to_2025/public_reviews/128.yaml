url: https://www.ptt.cc/bbs/movie/M.1757432550.A.B16.html
title: '[新聞] 鬧鬼糖廠取景，<鬼祭>吸近500萬觀眾搶看!'
content: '新聞網址：



  由印尼影史最賣座真人電影《鬼舞村》（KKN di Desa Penari）製作團隊打造，取材印尼

  民間傳說、改編爆紅真實故事的靈異新片《鬼祭》（Sugar Mill），即將在9月19日於台

  灣驚駭獻映。全片以荒郊野外的糖廠作為故事舞台，為了在視覺與情感上呈現最真實的恐

  怖氛圍，劇組選擇在真實糖廠中實景拍攝，其中一座更是以鬧鬼聞名。膽大包天的本片劇

  組，甚至還打破廠內禁忌、徹夜拍攝，就連當地人都不可置信地喊道：「根本是瘋子！」

  由於該真實糖廠過去曾發生過諸多慘案，現場陰森能量爆棚、靈異事件頻傳，也因此驚傳

  工作人員與演員接連被附身的驚悚現象。此外，本片也在甘蔗田中實景拍攝，因此時常因

  為不可控的大雨導致延誤行程。為了能讓拍攝進度順利推進，劇組甚至請來「線上驅雨師

  」施法，沒想到這招竟然出乎意料地有用。值得一提的是，本片在印尼上映後，也吸引近

  500萬觀眾進場搶看，驚悚故事嚇翻全場，獲得好評盛讚，更榮登印尼年度最賣座真人電

  影寶座！





  印尼年度恐怖懼作《鬼祭》，改編自百萬追蹤恐怖作家SimpleMan，他所紀錄下居住在糖

  廠旁邊聽聞的駭人軼事。為了在視覺與情感上呈現最真實的恐怖氛圍，劇組期望能在真實

  糖廠拍攝。在勘景多達九個地點之後，他們選擇兩間具有歷史意義與神祕色彩的糖廠作為

  拍攝場景，其中一間還特別以鬧鬼出名，廠內甚至有著一間連當地人都不敢踏入的上鎖廠

  房，讓導演艾文蘇亞迪（Awi Suryadi）分享：「聽說在我們拍攝前，就有很多YouTuber

  不敢再去那裡拍攝，當我們去勘景時，我想親眼見證那個當地人都不敢進去的廠房，可是

  連保全都有點猶豫要不要開門，最後他得先入內禱告完才讓我們進去。」拍攝期間，劇組

  甚至還打破「不可在夜間拍攝」的禁忌，從傍晚徹夜拍戲至凌晨，就連當地人看了都不可

  置信地喊道：「這個團隊根本是瘋子！」



  由於該糖廠過去曾發生諸多慘案，讓現場陰森能量爆棚、靈異事件頻傳。不僅道具以不自

  然的形狀倒塌，劇組人員還時常看見不明身影，演員阿澤拉普特里（Azela Putri）進一

  步分享：「有一次我正在錄影片，結果鏡頭裡的角落，突然出現一個和我長得一模一樣的

  人，但那天現場根本沒有臨演，只有我在那裡！」現場甚至還發生多位工作人員與演員接

  連被附身的驚悚現象，演員艾瑞卡卡爾利納（Erika Carlina）也分享自己的親身經歷：

  「第一次走進那間工廠時，我整個背跟頭都很沉重，好像被各種力量從四面八方壓住。某

  次拍攝時，我的身體完全不能自主，手往後翻、整個人趴著、身體很僵硬，可是我還能哭

  ，也還能說話，我沒想到會嚴重到身體完全不受控制。」





  值得一提的是，在拍攝《鬼祭》時，除了在實體糖廠拍戲之外，劇組也在甘蔗田中實景拍

  攝，因此常會有不可控的大雨導致拍攝延誤，演員貝尼迪克圖斯西雷加爾（Benidictus

  Siregar）表示：「我第一次拍戲遇到這樣的大雨，不是先下毛毛雨，而是直接傾盆大雨

  ，我們真的什麼都做不了！」為了能讓進度順利推進，劇組甚至請到「線上驅雨師」施法

  ，結果竟然出乎意料有用，女主角艾爾夏奧蕾莉婭（Ersya Aurelia）對此驚呼：「我們

  有請線上驅雨師，真的是線上！直接打電話過去拜託他們，結果大概半小時後，雨就停了

  ！」值得一提的是，本片在印尼上映後，也吸引近500萬觀眾入場搶看。神祕駭人故事、

  毛骨悚然氛圍與沉浸式驚悚體驗，嚇翻全場觀眾並獲得好評盛讚，紛紛讚揚：「喚醒了內

  心深處我以為已經擺脫的恐懼！」「驚嚇的呈現方式太震撼了！」「詭異又嚇人！」也讓

  本片因此榮登印尼年度最賣座真人電影寶座！



  這部由「印尼溫子仁」艾文蘇亞迪執導，直擊人性最深恐懼的的靈異新作《鬼祭》，即將

  在9月19日於台灣驚駭獻映。本片劇情描述每年甘蔗產季，爪哇的老舊糖廠都會向村莊招

  募臨時工；大批年輕人湧入，只為賺取微薄工資。恩達（艾爾夏奧蕾莉婭飾演）、法迪爾

  （阿爾巴尼亞西茲飾演）與朋友們也加入其中，在這座與世隔絕的糖廠展開勞動。白天，

  一切看似正常；但每當夜幕低垂、工廠哨聲響起，所有人都被命令嚴禁離開宿舍—這段時

  間，被稱作「紅色時段」，他們被警告：「無論發生任何事情，都不可以離開宿舍。」不

  過某個夜晚，恩達從夢中驚醒，彷彿某種詭異力量牽引著她，讓她違反禁忌，踏進無盡黑

  暗，跟隨一道模糊黑影消失在廠區深處…。此後，工人們接連慘死，死亡像瘟疫般蔓延整

  座糖廠。他們請來靈媒做法，試圖平息惡靈的怒火，卻意外揭露更駭人的真相——這些惡

  靈所渴求的祭品，是活生生的人命…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
