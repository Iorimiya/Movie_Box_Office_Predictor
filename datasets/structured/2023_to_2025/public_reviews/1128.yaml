url: https://www.ptt.cc/bbs/movie/M.1742520883.A.AD1.html
title: '[好雷] 夢想集中營The Zone of Interest'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  拖了一年終於將《夢想集中營》看完。

  雖然聽說去大銀幕看會差很多，但場次太少，一直與自己時間合不來，也就錯過。後來一

  直沒看的原因是覺得題材太沉重，總覺得要某種可以承受的狀態，才能好好坐下來看這部

  片。最近忽然覺得是時候了。


  點開來看，就算已經知道大致上是怎樣的電影，依然看得入神。當然不是什麼純粹美學或

  思想上的那種入神，《夢想集中營》大部分的時候是把一個你不敢相信存在的空間展示在

  你眼前。光是這一點就足以給你十足的震撼。


  它還是有故事，還是有穿插一些對比的畫面與劇情發展，可相對於這彷彿樂園的空間給出

  的衝擊，其他的東西都只是附加說明。


  看完也終於明白為何女主角（同時也是《墜惡真相》的女主角），去年為何令許多人難忘

  。如果先看了這片，再接看《墜惡真相》，對於她的演出會非常非常佩服（即使我是倒過

  來的順序，並且是隔了如此久，仍印象深刻）。


  即便導演在奧斯卡的演說中引起許多非議，我想這部電影呈現的一切仍是值得一看，值得

  深思。



  ***


  這裡是我的樂園:




  --'
