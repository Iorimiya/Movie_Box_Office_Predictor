url: https://www.ptt.cc/bbs/movie/M.1709481078.A.8CD.html
title: '[好雷] 夢想集中營｜觀後感'
content: "電影中的背景聲音並非只是背景噪音，而是反映了生活的真實環境：孩童的哭泣聲、粗暴\n的吆喝聲、驚恐的慘叫聲，以及遠處的槍響聲。他們生活的平靜和和諧背後，是冷酷的現\n\
  實和無情的壓迫。\n\n\n\n《夢想集中營》的劇本細節繁多，它通篇不見血，只有背景不斷傳來的異樣聲響：孩童的\n哭泣聲、粗暴的吆喝聲、驚恐的慘叫聲，以及此起彼落的槍響聲。\n\
  \n\n電影最讓我感到可怕的一幕，是原本被調離奧斯威辛集中營的魯道夫，終於獲准返「家」\n，他打電話跟妻子報「喜訊」，並以冷靜且不帶情緒的口吻說著自己回到集中營後要做的\n\
  事情，例如：如何正確地使用毒氣，才能毒死一整個房間的人。\n\n真的非常殘暴\n\n\n魯道夫打完妻子報來的電話，準備離開大樓，卻在樓梯間突然感到一股反胃，他忍不住嘔\n\
  吐出來。\n\n接著，鏡頭突然切到現代時空，奧斯威辛集中營變為紀念館，裡面擺滿了被丟棄\n的皮箱和無數的囚鞋，每一雙鞋都在述說著這棟建築物見證過的苦難。\n\n\
  環境簡陋的集中營內，魯道夫置身在一個歷史的背景下，這個他曾經親眼目睹人們在極度\n困境下為生存而戰斗的地方，此刻變成了為罹難者們守護遺憾的地方。\n\n然而，鏡頭又切回到過去的時空，魯道夫站在走廊上，凝視著走廊盡頭，彷彿窺見未來\n\
  \n\n————\n最後附上觀影送的海報 那天有點下雨所以被我弄得有點皺皺的\n\n\n\n  _\n--"
