url: https://www.ptt.cc/bbs/movie/M.1745973971.A.7EB.html
title: '[極好雷] 沈睡的水下巨人 島民的海 不看嗎'
content: '這是台灣第一部，應該也是全球第一部，

  紀錄台灣海域沈船海底影像的電影，

  既然是紀錄片，沒有劇情，

  我也不知道還有沒有需要防雷？

  不過有幾段影像，旁白讓我瞬間掉淚，

  所以…. 準備好了就來看吧！

  進戲院自己享受這一趟影音震撼饗宴更好！





  ~~~~~~~~~~ 雷文 主文分隔線~~~~~~~~~


  ~~~~~~~~~~ 雷文 主文分隔線~~~~~~~~~


  ~~~~~~~~~~ 雷文 主文分隔線~~~~~~~~~


  ~~~~~~~~~~ 雷文 主文分隔線~~~~~~~~~


  ~~~~~~~~~~ 雷文 主文分隔線~~~~~~~~~


  ~~~~~~~~~~ 雷文 主文分隔線~~~~~~~~~




  人類是陸地上的生物，

  即使我們再熱愛衝浪、潛水、戲水游泳…

  我們終究會回到陸地上生活，

  但海與我們息息相關，

  有句流傳已久的話這麼說：

  台灣四面環海，

  但我們只有海鮮文化，沒有海洋文化。


  在《沈睡的水下巨人》這部紀錄片裡，

  導演白叔想告訴我們的，

  是製作團隊用了四年的時間，

  潛入大部分島民可能一輩子都沒有機會

  親身經歷的水下30米、50米…

  去看看，「魚群消失的海，安靜地可怕」。

  沒有赤裸的教條式內容，

  只是用盡全身的力氣、踢動雙腿，

  拍攝這些沈船裡，正在上演的台灣海洋生態的故事。


  紀錄片旁白，是我很喜歡的演員，陳竹昇，

  他低沉且親切感十足的嗓音提醒著我們

  「四十年來，台灣從匱乏走向富裕，水底下，卻從富裕走向匱乏。」

  人類真的可以毫無節制地奪取嗎？


  台灣四面環海，是一座海島國家，

  與海洋共生的智慧與敬畏，

  是蘭嶼達悟族祖先告誡的黑翅膀傳說，

  「飛魚們的頭目，黑翅膀飛魚，特地前來告訴我們不可將飛魚和其它的魚、蟹、貝類一起

  煮食，這樣做會生惡瘡」


  在飛魚季，讓其他礁岸魚類得以休養生息，達成生態永續的目的，「只要人類不要毫無節

  制地奪取，大海，自己會找到出路」

  是祖先的智慧。


  而如今在台灣，想潛入海中，親眼看看大型的水生生物、多樣而繽紛的海底生態，卻常常

  要出國才能實現。喔，或者是水族館。


  我們知道嗎？

  「海洋是台灣的母親，默默接納我們所不要的」

  我們知道嗎？

  台灣的海，以前「是像這樣的」

  陳竹昇旁白語畢，出現了如煙火派對般熱鬧非凡的海底畫面，我忍不住掉淚，

  因為很美、真的很美，

  是我們讓這些魚群消失的嗎？

  我們知道嗎？


  真心希望大家進戲院去看看這部紀錄片，

  也和我分享你們的感想。



  --


