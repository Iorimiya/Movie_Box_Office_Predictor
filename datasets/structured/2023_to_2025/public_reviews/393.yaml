title: '[普雷]《沈睡的水下巨人》首部台灣沉船生態紀錄'
content: '當人工製造墮入海，是共生存還是汙染源？


  四面環海的台灣，在過去拚經濟的年代，比較少講到關於海洋保育這一塊。2020年時台灣

  政府成立海洋委員會後，對於海洋的法規才逐漸整合成形，雖然目的較多偏向於國土安全

  這一塊，還是逐步完善一些保育措施。


  例如：設例如綠島、墾丁、小琉球等地方海洋保護區，但非法捕獵、非法養殖與汙染、對

  於海洋認知教育的不足，仍被國際認為是「剛起步」的階段。這也讓近年許多民間團體、

  海洋運動相關團體開始推廣台灣人民對於海的認識。


  紀錄片《沈睡的水下巨人》，是台灣首支以島外海底沉船生態為拍攝主題的電影。由本身

  為生化碩士、和台灣行腳節目《水下三十米》的導演－李景白主導。花了四年時間到台灣

  八艘沈船海域，拍攝水下周邊的海洋生態，紀錄關於台灣海底世界的美景與憂心，有些船

  生態圈豐富多樣，有些沈船則無聲無息，反思人工之物與海洋的關係。






  《沈睡的水下巨人》是什麼電影？


  每到夏日將近，不知道大家喜不喜歡從與海洋有關的活動，例如海上衝浪、浮潛、海灘游

  泳或踏青之類的。基本上我是很少去做這樣的活動，頂多就是藝術節或音樂祭如果在海灘

  時，會用腳踏個水花過過涼快之癮。台灣從事水上活動的人其實不多，更不說有危險性的

  水下運動，幾乎是很稀有的小眾群體。根據近幾年，中華民國潛水協會的統計，台灣的潛

  水人口約只有四萬人，潛水俱樂部約百家。不過近年受到國外自由潛水運動的影響，許多

  人開始從岸上浮潛，嘗試更有挑戰性的海下潛水運動。


  潛水運動人口的增加，絕大多數要多虧，一些潛水教練和海洋愛好者的努力推廣，如台灣

  自由潛水紀錄保持者－楊世豪、代表台灣參與自由潛水世界錦標賽的運動員－張書豪，都

  因為參與國際賽事而讓台灣人知道潛水運動，和台灣多種的潛水海域。


  由於台灣對於潛水運動發展較晚，故在近幾年才開始蓬勃的發展休閒浮潛、潛水證照，潛

  水運動等，讓人更近海的水中運動。但拍攝紀錄片《沈睡的水下巨人》導演李景白卻擔心

  ，雖然人們開始對海洋感興趣，但在某方面海域的打擾加上過往漁業過度補撈的狀況，是

  否會再次對台灣的海洋生態發生衝擊？







  《沈睡的水下巨人》是耗費上百次下潛深入50公尺深的海域所拍攝記錄的台灣各地海域沉

  船，現今與海中周邊生態融合的狀況，拍攝出台灣的水中世界，也是首次公開在院線，讓

  許多觀眾可以看到在台灣表面所沒有中裏下水中風景，拍攝多艘已知被潛放水中的退役和

  因戰事意外而沉下的船隻潛艦。這樣的拍攝相當不容易，一來是為了要拍攝水中生態需要

  控制水下的光源、還有海域的混濁濃度變化，此外潛水夫和拍攝者的人身安全也是考量，

  在拍攝時也曾遇到過差點因設備問題缺氧窒息的狀況。


  因為潛水愛好，所以讓導演李景白想將水中世界呈現給大眾，而潛水所見的海底景觀，生

  態豐富度與水中生物的活躍，往往都跟該地的海洋保育脫離不了關係。在電影裡有讓人熟

  知的海龜、魚群，也有我們少見看過的海馬、水草等，構成台灣海洋獨一無二的生態圈。


  《沈睡的水下巨人》電影是一度以柔性和美好的方式，呼籲大眾對海洋保育的重視，也讓

  政府完善海洋相關政策的腳步。而也因如此，導演李景白影視作品的積累，都是靠著自我

  摸索的方式慢慢前進。










  《沈睡的水下巨人》分析與延伸：


  雖然聽起來不像，但將潛艇或其他軍艦、廢棄船隻，刻意有意的沉入海中，其實有易於水

  中生態保育，當然並不是隨便弄沉了事，在沉船前需要排除船支上面各種可能危害海域的

  裝備與有毒設計。例如去除油污、清理船艙、武裝設備拆除，這樣才可以確保沉船沉入海

  中成為「人工海礁」。因為這種艦艇的人工海礁，往往具有歷史意義與故事性，故除了增

  加當地海洋生物多樣性外，也吸引想了解或喜歡海域的觀光客，如果保持良好的平衡，將

  有利於海域復甦。


  這種下沉物品製作成人工魚礁的概念，其實已經有了幾百年的歷史。以日本為例：十七世

  紀的江戶時代漁民，就有所謂的「沈め物漁法（沈物養魚法）」。沈物養魚法是一種古老

  的捕魚技術，在水中製作人工製物，變成魚群棲息與聚集處，在適當的時間點捕撈，來獲

  取穩定的漁獲。


  故過去人工海礁的概念其實是為了漁獲，而非現在的環保意識。以更近代50年的美國為例

  ：投放人工海礁是因為無地方存放大量報廢的車輛和機械製品，近而解體後丟入海中，意

  外的發現魚群和水中生物成長的狀況，而開始投入關於人工海礁的研究。







  根據美國國家海洋氣候總署，對此的研究發現人工魚礁至所以可以讓海洋生物棲地活化可

  能有以下幾點：一、因為人類的機械廢棄物多為多孔結構，可以增加小魚跟小生物躲避獵

  食者。二、藻類的附著面積增加，等同於製作了多樣化的空間，讓藻類與微生物更能存活

  。三、聚集了小魚和海藻後，就會吸引更多水中食物鏈生物，故成為了一個生態循環。這

  之中唯一會打破這種生態圈的，其實只有不屬於水域中的人類，但同樣會造成這種生態鏈

  的也是人類，可以說人類在這裏扮演著很矛盾的角色。


  台灣的人工海礁的發展是從1970年代開始，當初也不是以海域環保帷幕定，主要是為了沿

  海漁業資源和捕撈發展事業。而台灣也開始將廢棄的軍艦用於人工海礁的需求內，但早期

  因為胡亂投放，反而造成棲息地的破壞。


  在《沈睡的水下巨人》電影裡，就有拍攝台灣最大的沉船軍艦「鎮海艦」如今的生態，而

  有趣的是因為台灣水域的複雜性，其實有著多時代性的沉船，而發展出很多變、多規模、

  多元的海中生態結構，故這也是電影希望可以表達，關注這些水下世界保育，不希望消逝

  不見的呼籲。









  《沈睡的水下巨人》值得一看嗎？


  我認為這部台灣紀錄片有它的價值與意義，光是水下世界這個主題，那怕不是在台灣，甚

  至在世界上都是相當冷門的電影主題，而且更多與水下有關的多為潛水運動、或是古代遺

  跡和知名郵輪沉沒的探討（例如：鐵達尼號）。


  紀錄片《沈睡的水下巨人》則是以台灣海洋內部的生態與沈船做結合，無疑是很可貴的讓

  觀眾看到台灣海底世界的樣貌與風采，但這部電影也因為這個主題爆露出很嚴重的問題，

  讓我沒有很推薦大家去看這部電影。


  如果還是有人對海洋與台灣海域生態有興趣，想看或需要看這部電影的觀眾，首先你需要

  知道，這部片長一個半小時只有約十分鐘的時間，開頭拍攝達悟族的飛魚祭典、和中間過

  場的潛水員準備從船上跳入海底執行工作外，所有的場景都是海中拍攝的畫面，全部都是

  水裡沈船、魚群、海中生物的畫面，加上旁白，並且環繞全片的交響樂，這就是這部電影

  九成的內容，直到電影結束。我認為這可以說大膽，但也可以說是非常不安全的拍攝和呈

  現電影的方法。








  一來我認為不是所有人都懂得每片海域的差異，即便有旁白提醒和敘述，電影觀眾，甚至

  可能有潛水經驗的人，都很難馬上了解台灣每個海域的區別，故對於這些人包含我自己，

  都會覺得「就是海」。導演努力的想透過生態、沈船艦艇構造、可視度光線等，來說明各

  種差異，但結果並不顯著。


  想要拍攝出台灣水中的美是很好的一點，電影也的確做到這點，但是一部曝光了一個小時

  半的海底美景，是會讓觀眾審美疲勞，倒置後半部幾乎不會有人在乎水裡面發生什麼事，

  或是對於畫面後面的爆點（大批魚群附著艦艇）感到驚艷，反而更加無感。


  《沈睡的水下巨人》紀錄片的節奏與敘事都出了很大的問題，也許導演覺得只要美景就夠

  其他並不是重點，但恰巧一些細節與額外的敘事點綴，才更能襯托出導演要的讓觀眾驚訝

  與堆疊層次的美感。訪談專家、甚至與淺水員對話、加入多一些艦艇故事與歷史文件、甚

  至拍攝幕後花絮的剪進等等，有很多方式可以增加這部《沈睡的水下巨人》的親和力與賣

  點，但這部紀錄片卻選擇更硬的方式只講海洋，也只有海洋。最終讓整部紀錄片，變成了

  在水族館裡會反覆撥放，自由觀看，卻乏人問津的擺設背景影片。




  --

