title: '[好雷] 沈睡的水下巨人'
content: '前天在電影院看了一人的《沈睡的水下巨人》，實在覺得可惜，這部紀錄片從內容到製作

  非常精良，不僅極有教育意義，娛樂效果也不輸給劇情片。


  勸君切莫過台灣，台灣海峽黑水溝之難渡史有明載，但如果不是看到澎湖四島海域的神秘

  華麗十九世紀沉船，恐怕還不易想像這事。除了澎湖和小琉球，黑潮流經的綠島和蘭嶼，

  周圍海域也有多艘沉船。


  海底尋奇和水中巨物是我很著迷的題材，這部片完全滿足這方面的需求。台灣海洋生態之

  繽紛與死寂，巨大沉船之雄偉和詭異，首部海中深潛紀錄片，帶回許多我們沒看過的奇觀

  ，用大銀幕欣賞更有感。


  海中廢墟很能激起想像力，像澎湖外海那艘疑似船難沉沒的十九世紀貨輪，上頭搭載的貨

  物會是什麼金銀珠寶嗎？是不是有船員因此漂流到台灣或菲律賓？船上是不是有一封永遠

  送不出的情書？當初《鐵達尼號》不也是從紀錄片切入劇情片，營造電影的時空間隔和真

  實感。


  《沈睡的水下巨人》音樂由灣生樂團操刀，極具震撼力和戲劇張力，本身也是值得一看（

  一聽）的部分。



  --'
