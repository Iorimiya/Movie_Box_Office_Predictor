title: 'Re: [新聞] 夏文汐露毛戲經典重現 殺夫月底登台大銀幕'
content: '太經典了

  夏文汐夜夜與丈夫的性虐聲遭到鄰居阿罔官（陳淑芳 飾）羨慕


  楊麗音的陳淑芳媳婦也被性虐讓阿罔官（陳淑芳 飾）羨慕


  但大都沒還原原著小說




  寬背薄口的豬刀竟異常沉重，林市以兩手握住，再一刀刺下。黑暗中恍然閃過林市眼前是

  那軍服男子的臉，一道疤痕從眉眼處直劃到下頦，再一閃是一頭嚎叫掙扎的豬仔，喉口處

  斜插著一把豬刀，大股的濃紅鮮血不斷的由缺口處噴湧出，渾身痙攣的顫動著。

  怎麼竟有這許多血，而且總噴不完。林市奇怪的想，於是依豬灶所見，將喉口側擺向一旁

  ，但發現血並不流向一旁，仍大股的四散噴出來，噴得整個臉面都是溫熱咸濕的濃血，還

  飛灑得四處都是。

  而那股上揚噴洒的血逐漸在凝聚、轉換，有霎時看似一截血紅的柱子，直插入一片墨色的

  漆黑中。大概是做夢了，林市揉揉眼睛。而後，突然間，伴隨一陣陣猛烈的抽|動，那柱

  子轉為焦黑倒落，紛紛又化為濃紅色的血四處飛灑。

  一定是又做夢了，林市想。看豬灶殺豬並沒這麼多血，那麼，再開膛看看吧！仍然是血，

  黏黏膩膩，內臟也不似曾看到的那般乾淨完整、全然沒有一滴血水，反倒腸肚都泡在血里

  ，血色淋漓。

  林市伸出手去掏那腸肚，溫熱的腸肚綿長無盡、糾結不清，林市掏著掏著，竟掏出一團團

  糾纏在一起的麵線，長長的麵線端頭綁著無數鮮紅的舌頭，嘰嘰軋軋吵叫著。林市揮起刀

  ，一陣切斬，那舌頭才紛紛隱去。

  一定是做夢了，林市想，再來應該輪到把頭割下來。林市一面揮刀切斬，一面心裏想，一

  定是做夢了，否則不會有這許多血。林市繼續揮刀切斬，到腳處，那靠身體的部分有大塊

  肉塊堆累，而且豬腳一定還沒有熟，才會中心處一片赤紅，血水還猩紅猩紅的涎滲出來，

  多切幾下，即成一團沉甸甸血肉模糊的肉堆。不過，不用去管它，林市想，揮刀斬向別處

  。

  最後看切斬成一塊塊差不多好了，林市坐下來，那白慘慘的月光已退移向門口，很快就完

  了，然後就沒事了，林市想。這才肚腹內猛地傳來一陣強烈的飢餓，口中還不斷湧出大量

  酸水。


  --

  那是她把丈夫當豬'
