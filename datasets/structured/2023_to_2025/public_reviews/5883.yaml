  \n〔記者鍾志均／台北報導〕性感女神夏文汐在經典電影《殺夫》突破尺度，一場手刃親夫\n戲，意外露出腋下「風景」，畫面十分搶鏡。\n\n《殺夫》為李昂原著改編，取材自轟動上海的社會事件「醬園弄殺夫案」，由國家影視聽\n\
