url: https://www.ptt.cc/bbs/movie/M.1739893902.A.952.html
title: '[新聞] 夏文汐《殺夫》成經典 領先章子怡40年'
content: "夏文汐《殺夫》成經典 領先章子怡40年\n\n2025/02/18 05:30\n\n\n夏文汐在《殺夫》片中弒夫戲至今仍被奉為經典。（海鵬提供）\n\
  \n〔記者鍾志均／台北報導〕夏文汐主演經典電影《殺夫》由國家影視聽中心完成數位修復\n，本月將在台上映，她在片中突破尺度，一場手刃親夫的戲，連腋毛都跑出來演戲，震撼\n\
  演出讓人嘆為觀止。\n\n《殺夫》原著小說取材自轟動上海的社會事件「醬園弄殺夫案」，片中夏文汐的殺夫畫面\n被奉為經典，吸引西班牙、法國等國際影展爭相邀展。\n\
  \n有趣的是，夏文汐和台灣淵源頗深，像是藝名中的「汐」出自台灣地名「汐止」，1996年\n息影的她，除了破例來台拍攝《新龍門客棧》及《神鵰俠侶》等電視劇，並在去年抵台出\n\
  席《殺夫》修復版首映，女神氣場征服觀眾。\n\n時隔40年，中國女星章子怡在新片《醬園弄》演出同一角色「詹周氏」，該角色先後由夏\n文汐、范瑞君等女星演出，至今仍以夏文汐的版本最讓人印象深刻。《殺夫》數位修復版\n\
  於2月27日全台上映。\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
