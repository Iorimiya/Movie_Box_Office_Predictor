  服觀眾，平時注重養顏美容的她，看來非常凍齡。\n\n當年台灣新浪潮導演曾壯祥首開先河，將《殺夫》搬上大銀幕，夏文汐在片中被迫嫁給屠\n夫後受盡折磨，不堪受辱的她，決定親手拾起屠刀「殺夫」，被奉為「經典中的經典」。\n\
  《殺夫》數位修復版於2月27日全台上映。\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n\
