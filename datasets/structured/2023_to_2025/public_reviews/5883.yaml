title: '[新聞] LadyGaga自爆拒見買凶殺夫黑寡婦原因!'
content: 'Lady Gaga女神卡卡拍《Gucci：豪門謀殺案》太入戲，自爆拒見買凶殺夫「黑寡婦」原因

  ！




  《Gucci豪門謀殺案》劇照


  【文/戴西福福】


  Lady Gaga女神卡卡主演的電影《Gucci：豪門謀殺案》將於11月24日上映，這部電影集結

  頂尖卡司，由大導演雷利史考特執導，演員包括亞當崔佛、傑瑞德雷托、艾爾帕西諾等好

  萊塢A咖，女神卡卡飾演Gucci家族中，為錢買兇殺夫的黑寡婦派翠西亞雷吉亞尼（Patriz

  ia Reggiani），這是她繼《一個巨星的誕生》(A Star Is Born)後最受到期待的電影，

  影壇與影迷都等著看她是否能與《Gucci：豪門謀殺案》重回奧斯卡。


  而近日，女神卡卡接受了英國版《Vogue》的採訪，她透露了自己演出派翠西亞雷吉亞尼

  的方法。




  《Gucci豪門謀殺案》劇照


  Lady Gaga透露，她三年前就開始準備這個角色，甚至花了9個月的時間去學習口音，「我

  做為她生活著，在那9個月裡，我一直帶著口音說話，我一直陪著這個角色」，為了更入

  戲，她也堅持染黑髮。


  她先練習一種特定的義大利方言，「然後我用更高級的口音說話，這在米蘭和佛羅倫斯更

  適合，在電影中，你會發現我的口音，會根據不同的對話人物而改變」。




  《Gucci豪門謀殺案》劇照


  本身有義大利血統的Lady Gaga，在拍攝該片時，也不斷想起自己的祖先，「他們為了讓

  後代過上更好的生活，做了很多不得不的事，我希望他們能夠以我為榮」，但她也透露拍

  攝《Gucci：豪門謀殺案》，讓她經歷精神困難。


  為了投入角色，她活得就像派翠西亞雷吉亞尼，除了口音外型的維持，她上都待在片場或

  酒店房間，維持著「派翠西亞雷吉亞尼」的人設，但某一天，她突然發現自己已經兩個月

  沒有散步，與角色實在難以切割。




  《Gucci豪門謀殺案》劇照


  派翠西亞雷吉亞尼曾抱怨Lady Gaga從未與她本人會面，對此，Lady Gaga表示：「我希望

  能以以個好奇的觀點去看待這個故事，我才可以做到公正與平衡的精神，這意味著沒有人

  可以告訴我，派翠西亞雷吉亞尼是誰，甚至是她本人也不行。」


  新聞網址：



  --'
