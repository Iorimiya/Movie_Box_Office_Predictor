url: https://www.ptt.cc/bbs/movie/M.1717768941.A.C04.html
title: '[新聞] 夏文汐《殺夫》修復 裸露刪減戲將出土'
content: "夏文汐《殺夫》修復 裸露刪減戲將出土\n\n曝將重返台灣演藝圈 預約李昂作品演貴婦\n\n04:10 2024/06/07 中國時報 李承陽\n\
  \n\n電影《殺夫》演員李淑楨（左起）、夏文汐、楊麗音6日出席首映會，暌違40年難得齊聚\n一堂。（國家影視聽中心提供）\n\n\n夏文汐在《殺夫》片中飾演村婦林市，有大尺度的演出。（國家影視聽中心提供）\n\
  \n58歲港星夏文汐相隔10年來台，6日與電影《殺夫》原著小說作者李昂、演員楊麗音、李\n淑楨出席數位修復版亞洲首映，夏文汐當年在《殺夫》演出遭受家暴、性虐待的村婦，與\n\
  資深演員白鷹有不少對手戲，她回憶當時拍大尺度戲有清場，劇組只留4人在片場，但上\n映時很多裸露戲都被剪光，直到修復版才又把那些畫面放回來。\n\n片中夏文汐要演出遭白鷹家暴的情節，她原本想跟白鷹請教該如何拍，沒想到白鷹無奈告\n\
  訴她：「我沒有打過我老婆！」夏文汐提到好險自己演的角色很壓抑被動，壓力就交給要\n主動動手的白鷹，笑說：「我就隨便他囉。」\n\n私底下沒明星架子\n\n夏文汐昨表示，自己決定要回來台灣演藝圈，已跟李昂預定下1部小說改編的連續劇《鴛\n\
  鴦春膳》，李昂邀她演出其中1位名門貴婦。李昂則爆料，夏文汐雖是家喻戶曉的大明星\n，但私底下完全沒有明星架子，劇組到澎湖拍《殺夫》時，夏文汐在球場打球，其他男生\n\
  想跟她打又不敢問，會怕撞傷她。另夏文汐前陣子拍完了香港大片《寒戰》續作，跟吳慷\n仁和劉俊謙合作，稱兩位男演員表現優秀。\n\n夏文汐現定居深圳，她5日中午抵台，已吃了不少台灣美食，與朋友共4人到餐廳用餐，一\n\
  口氣點了10道菜，她特別偏愛涼筍，吃完一盤又一盤，居然吃了4盤涼筍，昨晚則跟製作\n人楊佩佩聚餐。\n\n首映會現場，為讓觀眾感受《殺夫》故事的氛圍情境，特別邀請唸歌表演工作者以唱唸民\n\
  間故事的方式為電影放映揭開序幕，跨性別工作者酸六也上台重演電影經典的「殺夫」驚\n悚片段，炒熱氣氛。\n\n#想跟 #貴婦 #殺夫 #架子 #演出\n\n--\n\
  \n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
