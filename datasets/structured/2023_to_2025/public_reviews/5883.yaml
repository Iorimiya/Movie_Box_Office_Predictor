title: '[新聞] 章子怡離婚下月復出拍「殺夫片」！網虧'
content: '新聞網址：



  章子怡離婚下月復出拍「殺夫片」！網虧太巧…演員名單驚見收視女王


  記者陳芊秀／綜合報導



  該片改編自真實事件「醬園弄殺夫案」，網傳演員陣

  容還包括楊冪。




  《醬園弄》改編發生在1944年的真實事件，妻子詹周氏飽受丈夫詹雲影長年虐待，

  電影將登場多名嫌犯以及證人，逐一揭開妻子苦難的人生。陳

  可辛近日接受《中國電影報導》訪問，透露下月（11）將要在上海開拍，



  陳可辛新作《醬園弄》原名《醬園弄殺夫案》，2022年在釜山電影節發表製作消息，當時


  早前曾有傳聞稱該片已經刪掉分屍情節。






  此外，陳可辛表示《醬園弄》將會是10幾個演員的群像戲。該劇演員陣容尚未發表，陸網

  盛傳除了第一女主角章子怡，緊接著有雷佳音、楊冪、王寶強、鄔君梅、佟大為、袁詠儀

  。格外受到好奇。而章

  子怡剛官宣離婚就演殺夫妻子，







  -----

  Sent from MeowPtt on my iPhone



  --'
