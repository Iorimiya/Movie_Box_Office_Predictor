url: https://www.ptt.cc/bbs/movie/M.1724673568.A.F1B.html
title: '[好雷] 車頂上的玄天上帝'
content: '我本來很不想看這片的

  要不是中山73有免費場

  我幾乎都只看免費場

  票太貴很少花錢看電影


  沒想到出乎我意料的好看

  因為片名太俗才不想看

  因為林依晨當主角更不想看

  因為他拍電影好像都是票房毒藥

  我可能不會愛妳應該是她人生的巔峰

  大仁哥也是一樣，演電影都不好看


  仔仔更不用說，跟金城武一樣超帥

  但痞子英雄應該也是他人生的巔峰

  之後的作品都是票房毒藥都不好看


  這片有我最愛的蕭雅全當演員有加分

  在裡面演他自己當個導演，權勢很大

  可惜不是他導的，但還好是侯導監製

  所以果然不會太差到哪裡去


  這片嘉義人看了應該會很有感覺

  從日據時代的嘉義一直講到今天

  我覺得這片負評那麼多

  我想應該是當人家小三的三角關係

  難道是導演的人生經歷?


  碰到跟老婆分居愛搞小三的東海名建築師

  跟離很多次婚的國際大地產商

  拍電影真的能認識很多超級大富豪

  最後還是選擇跟嘉義青梅竹馬的小同鄉

  未婚小康比較可靠一點，才不容易離婚


  如果女人有被劈腿過的經驗

  或是老公有外遇的經驗

  或是有當過小三的經驗

  那看這片一定會說是大爛片的

  就像這些人看鐵達尼號也觸景傷情

  但鐵達尼號還是賣得比這片好幾百萬倍


  這片很像蕭雅全拍范保德的感覺

  同樣也是嘉義的故事，都是侯導的傳人

  所以范保德跟老狐狸票房都跟這片一樣爛

  不叫好也不叫座，反觀大橋頭是賣座不叫好


  期待林依晨跟仔仔能多演這種文藝片

  雖然可能會做白工沒法賺錢

  但真的把你們拍得很帥很美

  看到仔仔真的帥到

  可以當金城武接班人了


  --

  五月雪是指五月飄的白色油桐花，片名應該是五月之戀才對

  對，我太太娘家全都正港的是嘉義人，多少有點阿公的情感'
