url: https://www.ptt.cc/bbs/movie/M.1660807730.A.BE0.html
title: '[新聞] 林依晨《車頂上的玄天上帝》爆欠薪　監製'
content: '新聞網址：



  由侯孝賢監製、黃文英執導的首部電影長片作品《車頂上的玄天上帝》（暫名），集結林

  依晨、周渝民、阮經天與張孝全，卡司相當華麗，日前還風光入選威尼斯市場展，不料卻

  驚傳欠薪，知名微縮模型藝術家鄭鴻展在臉書發文「台灣史上第一樁微縮模型製作欠債事

  件的電影官司即將上演！」表示為了該電影組了8人團隊來製作，花了3個月每天工作12個

  小時，但製作方至今不願意給付尾款，更標註監製侯孝賢，以及點名導演黃文英法院見。


  鄭鴻展也在發文留言處回應細節，透露製片公司「三視多影視」的老闆就是黃文英導演本

  人的樣子，5月初劇組本該要付全額費用，但對方用了「模型有問題」等各種理由，就是

  不付剩下的金額，「用各種理由不付我款項後，最後確實說預算超支沒錢給我了，正在找

  金主。我能理解電影界的這種狀況，也好意的說那給我1張新的合約吧，我也不用一直問

  ，但打死不簽」。並透露昨日，草草結束對談

  ，態度讓鄭鴻展相當不滿。


  鄭鴻展表示，劇組一開始找他他是拒絕不接的，因為一旦投入就要花3個月每天工作12個

  小時，後來在對方3次的懇求後，耳根子軟就答應製作，如今讓他怒言「結果累死2次」，

  另外他表示主要是對黃文英導演提出質疑，依舊很尊敬侯孝賢導演。他的妻子則在臉書提

  到《車頂上的玄天上帝》，導演黃文英神隱不

  接電話3個多月，還委託監製許家豪聯繫他們表示「關於欠款她現在還是沒心情處理」。


  對此鄭鴻展回應《蘋果》，表示細算後劇組還有35％的款項沒付給他，至於金額則不便透

  露，6月初時鄭鴻展有用電話與黃文英溝通，後來都是與製片聯繫，昨天卻只留了1句「反

  正」，在昨天他PO文1小時後，製片有致電給他表示願意溝通，鄭鴻展說

  希望請黃文英導演親自來，另也表示之前就有向對方說，希望大家能坐下來好好談，再簽

  訂另一份合約，但都沒得到回應。若依照一開始的合約，鄭鴻展4月底作品交出後就要拿

  到款項，但從5月初到現在仍還有35％沒收到，讓他最終只得採取法律行動。


  而發行該片的片商甲上對此回應：「甲上娛樂負責電影發行的部分，這部電影的製作是三

  視多媒體，」（鍾

  雨璉／台北報導）


  --'
