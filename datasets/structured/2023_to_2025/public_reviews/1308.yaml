content: '雷文防雷資訊頁













  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~








  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  真的滿難看的

  可惜了

  整體製作水準是很高的

  美術讚，不愧是美術大師

  畫面也漂亮

  演員也看得出很努力


  可惜導演功力還是太青澀了

  當然可以知道導演要說的是現代女性漂泊的愛情與她對回憶的追尋

  但兩個主題沒有抓好

  彼此沒有呼應

  也沒有很好的連結


  加上那個尷尬到炸掉的文青台詞

  真的是會笑出來耶

  這種台詞叫梁朝偉、張曼玉來講都講不好啊

  這是電影這不是小說阿


  不過我還是看得滿開心的拉

  因為這是一個屬於台灣人的電影

  雖然拍得很爛

  但是最少有的東西拍得不錯，那就是有體現出台灣人的文化

  那種敦厚、打拼、勤奮、體貼、戀家的精神

  還是滿動人的


  老話一句

  導演不是這麼容易的

  剪接也真的很重要

  誰先愛上他的就是被剪接救了


  但徐譽庭第二部還是炸了西西


  --'
