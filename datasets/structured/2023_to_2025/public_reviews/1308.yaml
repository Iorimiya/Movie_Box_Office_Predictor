  ~~~~~~~~~~~~~ 雷文 主文分隔線~~~~~~~~~~~~~~~~~~~~~~~~~

  整部片看完只覺得「我看了三小」

  看不懂主線是什麼

  時間線跳來跳去

  女主一下要一下又不要

  爛到上來發文



  只看電影簡介還以為是女主角返鄉照顧爸爸

  順便帶出嘉義風土民情的故事

  結果只是個 喜歡阿公的女主角的文藝愛情片？


  感覺電影很多東西想傳達給觀眾

  但每個都沒說完整，給人強烈斷尾感


  像是拍電影拍到一半不拍了？

  中間缺桌子那段還以為大老闆會出來救援

  還是拍電影的重點是女主說的「我們拍的電影你們都看不懂」？

  真的看不懂啊


  老爸戲份超少，只是個讓女主回來嘉義的任務NPC


  大老闆是出來跟女主練蕭威的嗎？

  藉由大老闆，塑造出女主不喜歡錢，只喜歡對的人？


  我也不懂設計師男跟女主講白話，女主就一付我好委屈，都是你的錯

  不是耶，明明剛剛才打炮過，真愛哪會在意那些事情？


  看到最後頭腦超亂，最後女主有把阿公1941年的旅館蓋回來？


