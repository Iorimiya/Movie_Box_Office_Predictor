url: https://www.ptt.cc/bbs/movie/M.1700997233.A.532.html
title: ［閒聊］車頂上的玄天上帝
content: '前文刪除部分雷

  中間還有一篇的推文超好笑，阿杜跟車底XD


  故事主題我覺得見仁見智，我自己喜歡，

  可以更瞭解臺灣（嘉義）的歷史跟風土，祖孫、父女的互動也很可愛；但是說故事的方式就沒那麼討喜。


  裡面的演員都很棒，最喜歡林鉅，眼神跟表情都好有強；仔仔就帥，沒有以前那麼面癱，仔仔夠帥難怪可以渣！

  有些演員會讓人會心一笑，飾演導演的蕭導、飾演歌手的歌手千娜、從天橋上過來的莊凱勛。


  算是從小看林依晨演戲到大的，蠻喜歡他在這部的表情還有肢體動作，不過台詞跟腔調真的不行，真的不行！有一種過分刻意跟生疏感，仔仔講出尷尬的台詞，沒有那麼令人尷尬，但相對就讓人出戲，尤其是某些語法，很不像日常生活中會用的。


  這一篇提到電影工作的劇情，我也蠻喜歡的。很開心看到國片有不同類型的題材，很謝謝這些電影工作者的付出。






  -----

  Sent from JPTT on my iPhone


  --'
