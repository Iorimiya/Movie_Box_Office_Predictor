url: https://www.ptt.cc/bbs/movie/M.1703476831.A.23E.html
title: '[ 雷] 車頂上的玄天上帝'
content: '身為一個家裡有供奉帝爺公的嘉義人，當初看到這個部片多半皆在嘉義取景以及片名時就

  非常有興趣，還特地安排在回嘉義時進電影院觀賞。

  這邊先上人權！



  但沒想到期待越高，失望越大。

  一開始進場的時候旁邊坐了一位陪媽媽來看電影的二十幾歲女生，從還沒撥預告片就在睡

  覺，一開始還很看不起對方想說有夠沒水準。

  但看完電影之後我也很後悔不應該花這個錢進場看電影，應該在家睡覺比較實在。


  親情:

  片頭一開場是林依晨開車趕往醫院探視爸爸，然後後面就是爸爸生病的情況，還有阿公跟

  爸爸以及林依晨相處狀況，但這部分的刻畫手法非常不知所云…

  而且真的也不知道為何要仔仔同時扮演阿公跟林依晨的情人…


  愛情:

  女主角林依晨是負責電影拍攝的美術，對於一些細節部分有自己的堅持，在愛情部分也是

  如此。

  無視阮經天這個超級有錢人的追求也要跟一個還沒離婚的仔仔在一起，最後還被狠甩。（

  一樣是仔仔跟林依晨演的電影，追婚日記就好看一點，雖然整體來說還是爛）

  片尾出現的張孝全更是毫無意義可言。


  信仰:

  一開始一直很好奇為何片名要叫車頂上的玄天上帝，一直以為是把玄天上帝綁在車頂然後

  去進香嗎?

  這個問題一直到看完電影都沒有答案，一直到看完電影後看到某篇新聞中提到，女主角將

  家人求來的玄天上帝平安符貼在車子內部的頂端，類似天窗那邊的位置

  所以其實是(貼在)車頂上的玄天上帝(的平安符)。


  針對玄天上帝的信仰也完全都沒講到點上，只點出了玄天上帝是阿公從日治時代就開始拜

  ，爸爸就算重病也要去進香，還有爸爸過世要上香跟祖先還有阿公說接著遮神，還有最後

  去松柏嶺進香這樣而已…


  另外既然片名有玄天上帝，應該在信仰上的著墨在多一點，例如特別提到阿公拜帝爺公是

  從嘉義哪個玄天上帝廟分靈之類的也好，

  例如其中有一段是提供阿公帶著一家老小去阿嬤梅山的娘家避難，這邊順便帶出家禮拜的

  玄天上帝是梅山玉虛宮分靈或者是有去那邊進過香，結果那段只講了阿公買了超多香蕉乾

  給小孩吃，問號？


  最後，好不容易女主角的男友跑來嘉義找女主角，女主角居然是帶去城隍廟拜拜欸？

  雖然嘉義有名的玄天上帝廟好像真的不多，但我記得嘉義市有個玄天上帝廟會在帝爺公生

  日的時候舉辦盪鞦韆活動，還因此有了嘉義市鞦韆節耶，這個完全可以把嘉義特色行銷進

  去的東西居然不拍? 然後玄天上帝萬壽的繞境活動也都沒有拍?


  嘉義人文:

  片中出現的嘉義場景我覺得都沒有體現出嘉義的美，蘭潭，仁義潭，阿里山，奮起湖，森

  林小火車，太平天梯這些沒拍我都覺得超可惜

  最重要是，嘉義的美食著墨超少，只有男友來嘉義找女主角，然後看起來臉超臭去菜市場

  吃了一些東西，全程沒說話臉超臭，問號?


  結論: 這是是一部不知所云到極點的片，劇情零散破碎，愛情，親情，信仰這三個面向完

  全沒一個講到點上，幾乎都在隔靴搔癢，也完全沒把嘉義的美拍出來。


  --'
