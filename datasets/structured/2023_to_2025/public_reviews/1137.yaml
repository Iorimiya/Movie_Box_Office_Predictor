title: '[情報] 【鬼燭靈】全台上映戲院列表公開'
content: "日本真實恐怖遊戲改編【鬼燭靈】\n\n全台上映戲院列表公開 2/16 (五) 全台上映\n\n\n當第一百根蠟燭熄滅，\n地獄的大門就會開啟…\n\
  \n\n《#鬼燭靈 》2/16 (五) 嚇破膽\n\n電影預告：\n\n\n\n上映戲院：\n\n\n\n\n      話題恐怖鉅片《弒膽遊戲》原班人馬打造正宗續集\n\
  \n      IG粉絲逾146萬「尖叫女王」瑪格布哈維領銜主演\n\n      日本真實恐怖遊戲「#怪談百物語」改編\n\n      人愛聽鬼故事，鬼也愛聽鬼故事…\n\
  \n\n一群網紅在有鬧鬼傳聞的「石牆豪宅」現場直播進行一場超自然遊戲。\n\n他們點燃100根蠟燭，輪流講鬼故事，每講完一個故事，就到鏡子前吹熄一根蠟燭。\n\n\
  傳說當蠟燭全部熄滅時，就會開啟連結另一個世界的大門……\n\n\n #車庫娛樂\n\n--\n有新圖（驚"
