title: '[好雷] 樂活俱樂部 海鷗食堂'
content: '《樂活俱樂部》（めがね） 把故事拉到日本南方的一個離島，描述五個性格相異

  的人在小島上展開樂活時的心境。


  《海鷗食堂》（かもめ食堂） 則以一個在芬蘭赫爾辛基經營日本食堂的女老闆，

  在遇見兩名來自故鄉的女子後，原本門可羅雀的小餐廳生意逐漸上軌道的經過。


  這兩部電影都是由 1972 年出生的荻上直子所導演，演員也有些許的重疊，像是小

  林聰美、もたいまさこ（Always  三丁目的老闆娘）；其他的演員如：加瀨亮、

  市川實日子、光石研、片桐はいり 等也都是日本影劇圈的熟面孔。兩齣電影都沒

  有過於複雜的故事軸線，隨著劇情開始進展，故事開始有趣起來。


  在《樂活俱樂部》裡，小林聰美飾演的粉領族遠赴南方離島享受所謂的樂活，卻仍

  然下意識地受到都會生活的牽絆，無法全心投入，當其他人鼓勵她放下雜念之後，

  她也跳起屁屁體操，融入其中。


  在《海鷗食堂》裡，小林聰美搖身一變老闆娘，成天為空蕩蕩的食堂傷透腦筋，

  直到遇見兩個日本同鄉，食堂的經營才漸有起色。


  對於長期居住在都市的人來說，買張機票前往異國遠方，也許是逃離煩悶生活的最

  佳對策之ㄧ。但在那個陌生之地，初來乍到多半都會有點不習慣，無論是《樂活俱

  樂部》中的南方小島或是《海鷗食堂》裡的赫爾辛基，看似夢幻，旅行者心中其實

  多少都會充斥著矛盾與不安。


  以我自己的經驗為例，不管是去澳洲、日本，還是曼谷自助旅行，面對語言不通、

  生活習慣大相逕庭，多數人會心生恐懼，裹足不前，然而仍有旅人背著背包、

  拿著地圖勇往直前。


  印象中最深刻的是第一次自助旅行時，在雪梨機場搭內陸線航班前往墨爾本時，

  遇見欲前往澳洲中部，以地球的肚臍聞名—艾爾斯岩的幾位日本女性旅客，她們的

  臉上興高采烈，毫無懼色。


  套句國片《練習曲》裡的經典台詞「有些事現在不做，以後也不會做」，離開習以

  為常的生活不難，困難的是你有沒有那個決心，放膽嘗試！


  --'
