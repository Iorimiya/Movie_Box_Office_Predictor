title: '[新聞]凱特溫絲蕾為"他"花9年拍【她眼中的世界】'
content: '新聞網址：



  由「奧斯卡影后」凱特溫絲蕾（Kate Winslet）耗時九年打造的真人真事改編電影《她眼

  中的世界》（Lee），即將在5月29日（週四）於台灣隆重獻映。本片聚焦傳奇攝影師「黎

  米勒」（Lee Miller）在二戰期間，親赴戰場的經歷與蛻變。在電影籌備期間，她獲得黎

  米勒的兒子安東尼彭羅斯（Antony Penrose）大力支持，不僅能待在她生前生活過的莊園

  ，更獲得檔案館完全的使用權，深入研究六萬張底片、服裝、日記等物件，以完美再現黎

  米勒的一切；極度沉浸的鑽研，讓凱特溫絲蕾直呼自己像是被「附身」。準備過程當中，

  她也多次因為質疑自己是否有能力詮釋而落淚，但她認為要讓安東尼在有生之年看見電影

  問世，堅持一定要將本片給完成。值得一提的是，安東尼在當年《鐵達尼號》（Titanic

  ）上映時，便十分希望有朝一日能由凱特溫絲蕾飾演自己的母親，而凱特這回的精準演繹

  ，也讓他在觀賞後一度認知錯亂，直喊：「我好像真的看到黎回來了！」





  《她眼中的世界》是凱特溫絲蕾首度身兼主演與監製的新作，耗時九年將傳奇攝影師「黎

  米勒」的故事搬上大銀幕。電影籌備期間，她獲得黎米勒兒子「安東尼彭羅斯」的大力支

  持與協助，不僅能待在黎米勒生活過的莊園，更獲得檔案館的完全使用權，有機會深入研

  究黎米勒的一切，她對此分享：「我很幸運得到信任與檔案館的完全使用權，這不僅意味

  著我可以看到她在戰時的六萬張底片、印刷品、攝影包等，還有她的衣服、個人照片、信

  件與日記。」極度沉浸地鑽研，也讓她直呼自己像被「附身」：「感覺就像黎某種程度上

  進入了我的身體，那真是個相當奇妙的經驗。這是我為角色所做過最重要的準備，遠遠超

  過以往。」



  準備過程中，她也數度因為質疑自己是否有能力詮釋黎米勒而崩潰落淚，時常認為自己做

  不到，但同時她認為必須要為安東尼堅持下去，讓他有生之年能夠看見本片問世，她進一

  步對此表示：「我清楚地知道，如果我不拍這部電影，她的真實故事可能永遠不會被講述

  。我想為安東尼完成這件事，這比任何事情都更重要，他比我等待這部電影的時間要長很

  多。對他來說，這幾乎是40年的等待，尤其他已經78歲了。」她接著說道：「我最終做到

  了，我為他感到非常高興，也非常為自己感到驕傲！」





  值得一提的是，黎米勒已經78歲的兒子安東尼彭羅斯，長達數十年的心願就是要將母親的

  故事搬上大銀幕，而在1997年《鐵達尼號》上映時，便十分希望有朝一日能由凱特溫絲蕾

  詮釋自己的母親，安東尼分享：「當年在《鐵達尼號》看到凱特時，我喜歡她不怕弄濕、

  弄髒，敢於跌入水中、接受摔倒。她在很多方面都跟黎很像，我一直希望如果有一部關於

  母親的電影，能由她來飾演黎。」而凱特精準地詮釋，也讓安東尼一度認知錯亂，喊道：

  「我心想：『這也太真實了，到底是怎麼辦到的？』我真的覺得黎好像回來了！她的手勢

  、語調，甚至聲音中那種沙啞的質地，一切都如此真實。」他更大讚：「我認為凱特所呈

  現的黎米勒形象，準確得令人難以置信！」



  這部由凱特溫絲蕾耗時九年打造，轟動入圍金球獎、英國奧斯卡、英國獨立電影獎等重要

  獎項的電影《她眼中的世界》，即將在5月29日（週四）於台灣隆重獻映。本片劇情描述

  1930年代末期，隨著希特勒勢力崛起，二戰陰影籠罩歐洲之際，曾是時尚圈寵兒的黎米勒

  （凱特溫絲蕾飾演），與愛人若蘭（亞歷山大史柯斯嘉飾演）來到倫敦，並受聘成為英國

  《Vogue時尚》雜誌攝影師。然而，她不願只是為時尚按下快門，她對女性攝影師所受到

  的種種限制感到不滿，更看到納粹踐踏人道的卑劣行為，讓她毅然放下華服與聚光燈，在

  雜誌編輯兼好友奧黛麗（安德麗亞瑞斯波羅格飾演）的支持下，扛起相機，走進戰場最前

  線。她透過相機記錄下戰爭的殘酷，冒生命危險捕捉到歷史真相，從滿目瘡痍的戰場，到

  希特勒寓所中的震撼一幕，她用影像為無聲者發聲，讓世界無法再轉身不看…。



