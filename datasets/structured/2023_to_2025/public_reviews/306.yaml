title: '[新聞] 【她眼中的世界】震撼重現希特勒寓所浴照'
content: '新聞網址：



  改編自傳奇女性攝影師「黎米勒」（Lee Miller）真人真事的電影《她眼中的世界》（

  Lee），即將在5月29日（週四）於台灣隆重獻映。本片刻畫曾擔任《Vogue時尚》雜誌模

  特兒的黎米勒，在二戰期間成為雜誌官方戰爭攝影師，並親赴戰場紀錄戰時女性肖像的經

  歷。「奧斯卡影后」凱特溫絲蕾（Kate Winslet）不僅擔綱主演，更扛下製片重責大任。

  據悉，她在2015年時，恰巧買下一張黎米勒曾經使用過的桌子，讓她不經思考為何不曾有

  人替黎米勒留下任何一部電影，最終決定開啟這趟電影旅程，並耗時九年將電影搬上大銀

  幕！她運用長期累積的人脈，集結金獎幕後團隊，還邀來實力派演員同台飆戲，包括安迪

  山伯格（Andy Samberg）、亞歷山大史柯斯嘉（Alexander Skarsgard）、安德麗亞瑞斯

  波羅格（Andrea Riseborough）、瑪莉詠柯蒂亞（Marion Cotillard）等人，共同打造這

  部震撼人心的鉅作。值得一提的是，本片還將還原黎米勒最具代表性的攝影作品「在希特

  勒的浴缸裡」，這個場景也成為全片情感與歷史張力的巔峰。談起這個重點場面，凱特溫

  絲蕾也不經讚嘆：「那場戲極其震撼，令人難以置信！」





  描繪黎米勒如何在二戰期間蛻變成戰地攝影師的《她眼中的世界》，由「奧斯卡影后」凱

  特溫絲蕾首度身兼主演與製片。本片製作契機源於2015年時，在一場拍賣中，凱特溫絲蕾

  恰巧買下一張黎米勒曾使用過的桌子，是當年黎與丈夫相識時，與朋友們一同共度時光、

  享用豐盛大餐時圍坐的地方，這讓凱特思考：「如果桌子會說話，它一定能述說無數精彩

  故事。曾經有多少人圍坐在這張桌子旁，交流思想、分享經歷、創作作品、討論世界？」

  而黎米勒便是其中一員，可惜未曾有人為她留下任何一部電影，凱特進一步表示：「我知

  道，如果我不講述她的故事，那麼這個故事可能永遠不會被講述，而這讓我無法接受。」

  最終決定開啟這趟電影之旅，耗時九年將電影搬上大銀幕。



  確立電影內容之後，她也運用在演藝圈長期累積的人脈，請到曾於《王牌冤家》（

  Eternal Sunshine of the Spotless Mind）合作過的艾倫庫羅絲（Ellen Kuras）擔綱導

  演，也集結堅強又優秀的金獎幕後陣容，包含曾以《戰地琴人》（The Pianist）榮獲法

  國凱薩獎的攝影師帕維爾愛德曼（Pawel Edelman）；兩度榮獲奧斯卡肯定的音樂家亞歷

  山卓戴斯培（Alexandre Desplat）；奧斯卡金獎服裝設計師麥可歐康諾（Michael

  O''Connor）；《冰與火之歌：權力遊戲》（Game of Thrones）藝術指導傑瑪傑克森（

  Gemma Jackson）等人，共同打造黎米勒當年那段驚心動魄的二戰歲月。尤其本片更集結

  堅強演員陣容，包括《荒唐分局》（Brooklyn Nine-Nine）安迪山伯格、《北方人》（

  The Northman）亞歷山大史柯斯嘉、《致蕾絲莉》（To Leslie）安德麗亞瑞斯波羅格、

  《玫瑰人生》（La Vie En Rose）瑪莉詠柯蒂亞等獎項經歷豐厚的實力派演員共同演出。





  值得一提的是，《她眼中的世界》更震撼重現黎米勒諷刺歷史瞬間的最具代表性攝影作「

  在希特勒的浴缸裡」。凱特溫絲蕾認為本片有責任且必須非常細緻還原該場景，確保敘事

  內容盡可能貼近真實，她表示：「因為那是黎米勒最具代表性的影像之一，我們必須非常

  細緻地還原她當時為何會出現在那個場景當中。這是我們在整部作品中最感責任重大的部

  分之一，確保敘事內容盡可能貼近真實，反映她當時可能的情感與思緒。」拍攝該場景時

  ，她更在《Vogue時尚》雜誌總編安娜溫圖（Anna Wintour）的引薦下，請到當代傳奇攝

  影師「安妮萊柏維茲」（Annie Leibovitz）還原這張照片，憶起這場重點場面的拍攝過

  程，凱特溫絲蕾也不經讚嘆：「那場戲極其震撼，令人難以置信！」



  這部由凱特溫絲蕾耗時九年打造，轟動入圍金球獎、英國奧斯卡、英國獨立電影獎等重要

  獎項的電影《她眼中的世界》，即將在5月29日（週四）於台灣隆重獻映。本片劇情描述

  1930年代末期，隨著希特勒勢力崛起，二戰陰影籠罩歐洲之際，曾是時尚圈寵兒的黎米勒

  （凱特溫絲蕾飾演），與愛人若蘭（亞歷山大史柯斯嘉飾演）來到倫敦，並受聘成為英國

  《Vogue時尚》雜誌攝影師。然而，她不願只是為時尚按下快門，她對女性攝影師所受到

  的種種限制感到不滿，更看到納粹踐踏人道的卑劣行為，讓她毅然放下華服與聚光燈，在

  雜誌編輯兼好友奧黛麗（安德麗亞瑞斯波羅格飾演）的支持下，扛起相機，走進戰場最前

  線。她透過相機記錄下戰爭的殘酷，冒生命危險捕捉到歷史真相，從滿目瘡痍的戰場，到

  希特勒寓所中的震撼一幕，她用影像為無聲者發聲，讓世界無法再轉身不看…。



