title: '[好雷] 不止一場戰爭：《她眼中的世界（LEE）》'
content: "內文有雷且具個人觀點，推薦觀影後再讀。\n\n　　　　本片場次有限，有意還請把握。\n\n\n\n　　　　圖文網頁版：\n\n　　　　\n\n\n\
  　　　　預告片：\n\n　　　　\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\
  \n\n\n不止一場戰爭：《她眼中的世界（LEE）》\n\n\n\n\n\n　　在男性主導的戰爭敘事裡，女性的故事被刻意遺忘，女性的影像則被壓\n\n抑抹去。在台灣充滿焦慮的此刻，《她眼中的世界（Lee）\
  \ 》是一部必看的\n\n電影。\n\n\n\n\n\n我寧願拍攝照片，而不是成為一張照片\n\n\n\n　　由真人真事改編、艾倫‧庫羅絲（Ellen Kuras）執導的電影《她眼中的\n\
  \n世界（Lee） 》著重於黎．米勒（Lee Miller, 1907-1977，凱特．溫絲蕾\n\nKate Winslet飾並身兼製片）捨棄了模特兒的身份，作為記者前往二戰前線，\n\
  \n用鏡頭記錄戰地的經歷。印象深刻的，包括黎與法國友人觀看德國人選出希\n\n特勒的荒謬感，他們批評無法理解支持者的思維，令人聯想到南韓的總統選\n\n舉和台灣的國會亂象，民眾對未來走向的困惑迷茫。後來這群好友各自離散，\n\
  \n有人遭遇不幸，有人失去性命，這是戰後黎依舊持續來到前線的原因，為此\n\n她拒絕始終在後方支援的丈夫希望能接她回家的要求，堅持戰爭並未結束，\n\n「一切還在繼續」。\n\
  \n\n\n\n\n人的眼裡充滿生命力，直到殞落的那一刻\n\n\n\n　　黎所處的環境時時可見對女性的限制，固然她能用美國人的身份迴避英\n\n國的規矩，「女性只能進入非軍事區域」仍然讓她被排拒在外。即使如此，\n\
  \n黎還是拍下女性護理師、女性機師在後方工作的身影，和躺在床上意識清醒、\n\n等待回家與女友團聚的傷患。她的鏡頭攝下女性在戰爭裡的工作者，也攝下\n\n看不見的受害者：與德國男子相戀的法國女子在避難所被指責通敵，遭到羞\n\
  \n辱嘲諷，當眾被剃光頭髮作為懲罰。黎還跟著排隊領得食物的女性，拍到許\n\n多藏匿一處的小女孩，當時黎為了方便工作，穿著軍裝，藏了頭髮，乍看之\n\n下就像男子，其中一位小女孩發現她／他的身影時，那瞬間驚懼的神情，不\n\
  \n是單純的警戒，不是旁觀、而是親身經歷過暴力創傷者的本能反應。戰爭時\n\n女性的付出與苦難往往被忽視，黎的勇氣、堅持、女性視角的誠實開放，和\n\n超現實主義攝影下的獨特感知，探照出那些陽剛敘事下「正史」裡隱而不宣\n\
  \n的傷害。\n\n\n\n\n\n創傷有很多種，不只那些肉眼可見的\n\n\n\n　　電影裡也呈現黎記錄的戰後畫面：前往集中營的火車上一排又一排的屍\n\n\
  體，屋子打開全家吞氰化物自殺的死寂，還有她和大衛．雪曼（安迪．山伯\n\n格Andy Samberg飾）來到慕尼黑，在希特勒宅邸的浴室脫光衣服入浴，以挑\n\n\
  釁權威的舉動，攝下最有名的作品〈在希特勒的浴缸裡〉，事後身為猶太人\n\n後裔的大衛與她抱頭痛哭：「他們都是我的同胞。」──捕捉歷史真相的勇\n\n氣，包括了承擔直視苦難的創傷與壓力。因此當她發現她所拍下的、證明屠\n\
  \n殺為真的照片，在戰爭結束後以「安定民心」為由無法刊登時，上司兼好友\n\n奧黛麗（安德麗亞．瑞斯波羅格Andrea Riseborough飾）拚命阻止她銷毀底\n\
  \n片，解釋「我真的努力了，真的試過了。」她則回以奧黛麗非常嚴厲的批評：\n\n\n\n　　「你還不夠努力。」\n\n\n\n　　這句最重的話，實則是她的無力與自責，無論是來到前線卻對傷害無能\n\
  \n為力，也因自身年幼在父母友人照顧時遭到性侵的傷痛，與那些戰爭裡受害\n\n的女子、包括年幼女孩的遭遇，女性的存在、付出與傷害總是率先被隱藏、\n\n被消失、被視為「不重要」且一再持續，如同黎所憤怒的：\n\
  \n\n\n　　「這種事一直在發生，而他們（加害者）總能全身而退。」\n\n\n\n　　「不夠努力」也包括了之後她對「母職」的自責，儘管帶回珍貴的歷史\n\n\
  記憶，為她不凡的一生留下不凡的紀錄，原就自覺「不適合當母親」的她，\n\n始終自認「還不夠努力」。最後記者揭露身份，也揭露了黎璀璨生命被藏在\n\n閣樓的軌跡。我很喜歡母子「對話」的設計，由原本含怨的兒子安東尼，揭\n\
  \n露黎波瀾壯闊的人生，和母親的身份，給予孩子的不該只有無盡的、苛求完\n\n美的母職。\n\n\n\n\n\n創造命運的女人\n\n\n\n　　即使男性主導的媒體與歷史往往傾向掩蓋她們的名字、影像與傷痕，她\n\
  \n仍用自己的足跡與作品，證明了她的努力與貢獻，一如凱特所言：「很多故\n\n事都是關於女人如何面對命運；黎米勒卻是創造命運的女人。」她是創造命\n\n運的女人，她的生命屬於她自己。\n\
  \n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\n              \
  \                    陳斐雯  貓蚤札（其三）\n\n--"
