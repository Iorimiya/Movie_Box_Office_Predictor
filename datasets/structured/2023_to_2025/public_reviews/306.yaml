url: https://www.ptt.cc/bbs/movie/M.1748434955.A.67B.html
title: '[新聞]李奧納多感動支持凱特溫絲蕾<她眼中的世界'
content: '新聞網址：



  改編自真人真事、呈現驚心動魄二戰歲月的電影新片《她眼中的世界》（Lee），即將在

  明日（5/29）於台灣隆重獻映。本片不僅由凱特溫絲蕾（Kate Winslet）擔綱主演與監製

  ，演員陣容更是豪華。以喜劇影集《荒唐分局》（Brooklyn Nine-Nine）聞名國際的安迪

  山伯格（Andy Samberg），由於跟黎米勒（Lee Miller）一同奔赴戰場的攝影師大衛薛曼

  （David Scherman）長相神似，並具有演技實力，因此受到凱特溫絲蕾邀約，首度挑戰非

  喜劇類劇情片，以自然動人的演技大獲好評，甚至一度讓觀眾認不出是他！由凱特主動力

  邀的，還有英國實力派演員安德莉亞瑞絲柏（Andrea Riseborough），由於兩人從未有過

  交集，凱特還設法取得聯繫方式，只為能讓她演出，而安德莉亞也在接演後力挺到底，為

  凱特推掉其他演出機會！值得一提的是，凱特的「人生摯友」李奧納多狄卡皮歐（

  Leonardo DiCaprio）也在本片的試映會上為她站台，並感動喊話：「妳在這部作品中的

  表現堪稱蛻變！」尤其本片在國外上映後，更是獲得國際媒體的好評盛讚！





  聚焦傳奇攝影師「黎米勒」過往人生的《她眼中的世界》，當劇組討論該由誰來飾演黎米

  勒的攝影夥伴「大衛薛曼」時，發現喜劇演員安迪山伯格與他長相神似，更與大衛有些調

  皮的性格相符，同時具有演技實力，因此讓凱特溫絲蕾主動提出邀約，安迪回憶：「剛開

  始有點忐忑不安，我可不想毀了這部電影。不過當一起合作之後，凱特說：『你一定會很

  棒的！我希望由你來演，他們也希望你來演。』於是我便答應了。我想，還有什麼機會能

  和她一起合作？還是這樣子的作品？而且我覺得自己適合這個角色，也非常敬佩這號人物

  。」他也一展幽默性格開玩笑補充：「我長得跟他太像了，簡直不可思議，所以我一定要

  演，不然他們可能沒辦法拍成這部電影。」



  首度挑戰非喜劇類劇情片的他，做足功課並盡可能投入角色，自然地傳遞情感，他分享：

  「這無疑是我演過最沉重的題材。當你來自喜劇圈時，本能會讓你想用幽默來化解沉重情

  緒。但在這部片裡，你必須完全敞開心扉，脆弱地投入，全然地沉浸其中，奮力詮釋。」

  他的精湛演出也讓許多觀眾一度沒有認出是他，對此他也開心回應：「凱特告訴我，有些

  人在看完這部電影後，根本沒意識到是我演的，我覺得這可能是對我嘗試這個角色，所能

  獲得的最大稱讚！」





  英國實力派女演員安德莉亞瑞絲柏，這回也在《她眼中的世界》飾演《Vogue時尚》雜誌

  主編。十分欣賞安德莉亞的凱特，一心希望能邀她來演出，但由於兩人從未有過交集，因

  此凱特想盡辦法取得聯繫方式，並在通話中立即獲得她的同意。安德莉亞對此表示：「從

  我們初次交談的那刻起，她就非常親切，讓我很安心，是一種很平凡的感覺，沒有壓力。

  她告訴我這個項目的時候，老實說不管她叫我演什麼，我想我都會答應。」而安德莉亞也

  在接演後力挺凱特到底，在等待開拍的日子裡，推掉了其他的演出機會。



  值得一提的是，凱特的「人生摯友」李奧納多狄卡皮歐（Leonardo DiCaprio）也在試映

  會上為她站台，並大讚：「這部作品不只刻劃出黎的人生複雜性，更讓我們感受到分享真

  相，即便痛苦也要堅持說出口的情感重量！」他也向凱特感動喊話：「妳在這部作品中的

  表現堪稱蛻變！我依然為妳的力量、正直、才華與每個創作裡的熱情深深敬佩。」本片在

  國外上映後，也獲得國際媒體好評盛讚，《衛報》：「強而有力地詮釋出黎米勒剛毅又具

  魅力的性格魅力！」《紐約時報》：「要全面呈現這位拍下二戰最難忘影像的攝影師的多

  重面貌，是一項艱鉅挑戰，而凱特溫絲蕾成功體現了這些層次！」《綜藝》：「凱特溫絲

  蕾展現令人驚豔的演技幅度！」



  這部由凱特溫絲蕾耗時九年打造，轟動入圍金球獎、英國奧斯卡、英國獨立電影獎等重要

  獎項的電影《她眼中的世界》，即將在明日（5/29）於台灣隆重獻映。本片劇情描述1930

  年代末期，隨著希特勒勢力崛起，二戰陰影籠罩歐洲之際，曾是時尚圈寵兒的黎米勒（凱

  特溫絲蕾飾演），與愛人若蘭（亞歷山大史柯斯嘉飾演）來到倫敦，並受聘成為英國《

  Vogue時尚》雜誌攝影師。然而，她不願只是為時尚按下快門，她對女性攝影師所受到的

  種種限制感到不滿，更看到納粹踐踏人道的卑劣行為，讓她毅然放下華服與聚光燈，在雜

  誌編輯兼好友奧黛麗（安德麗亞瑞斯波羅格飾演）的支持下，扛起相機，走進戰場最前線

  。她透過相機記錄下戰爭的殘酷，冒生命危險捕捉到歷史真相，從滿目瘡痍的戰場，到希

  特勒寓所中的震撼一幕，她用影像為無聲者發聲，讓世界無法再轉身不看…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
