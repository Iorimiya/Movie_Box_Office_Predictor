title: '[ 好雷] 她眼中的世界 電影荒可看'
content: '因為電影票快過期，最近也沒什麼想看的電影，隨便選了一部，沒想到還不錯的。


  節奏蠻快，片長不算長，真人真事改寫，看完也是蠻感動的。唯一需要避雷的就是有一點

  血腥場面。


  黎米勒原本是模特兒，比起做模特兒她後來更喜歡當攝影師，後來加入了Vogue 雜誌。


  二戰開始後，她就一直申請想去前線拍照，但由於女性的身分，時常受阻。


  後來她在前線、集中營拍照、希特勒宅邸洗澡、她持續的前進為生命沒有辦法繼續的人發

  聲。







  --'
