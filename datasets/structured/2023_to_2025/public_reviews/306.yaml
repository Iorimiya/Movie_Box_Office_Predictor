url: https://www.ptt.cc/bbs/movie/M.1747743283.A.1A2.html
title: '[新聞] 凱特溫絲蕾拍【她眼中的世界】受傷不喊卡'
content: '新聞網址：



  由「奧斯卡影后」凱特溫絲蕾（Kate Winslet）耗時9年打造的真人真事改編電影《她眼

  中的世界》（Lee），即將在5月29日（週四）於台灣隆重獻映。本次她不僅是主演，更首

  度挑戰身兼製片。由於本片是獨立電影，資金籌備成為一大挑戰，讓劇組在過程中也曾一

  度出現資金危機。不過堅決不拖欠工作人員薪水的凱特，竟自掏腰包支付團隊人員兩週的

  薪水，並表示：「該拿的薪水就必須拿到，這點我不會讓步！」而她所面臨的困難可不只

  一件，開拍前夕，她還因為一場奔跑場面的排練滑倒，導致椎間盤受傷，甚至一度無法站

  立。即使傷勢嚴重，但她仍決定為了讓電影進度在軌道上，忍痛按照原訂計畫開拍！值得

  一提的是，為了盡力詮釋傳奇攝影師「黎米勒」（Lee Miller），她認為相機在片中不該

  只是道具，因此不僅請來祿萊相機技師打造黎米勒同款相機的複製品，更在拍攝時按照黎

  米勒的方式真實使用，重現許多經典畫面，讓她感到相當自豪！





  《她眼中的世界》是凱特溫絲蕾首度身兼主演與製片的全新作品，由於本片是獨立電影，

  資金籌備成為一大挑戰，凱特解釋：「現在正是獨立電影製作最艱難的時期，投資人想要

  確保回本，他們希望能夠介入，而我不會拿那些根本不完全支持我目標的人的資金，所以

  這真的很難，遇到了很多阻力。」製作過程中，劇組也遭遇資金危機，凱特得知這情況後

  認為：「當薪資需要發放，供應商需要結算時，這是絕對不能妥協的事情。人們該拿到的

  薪水就必須要拿到，這點我不會讓步，這就是底線！」她甚至因此自掏腰包支付團隊成員

  兩週的薪水，得以讓電影拍攝可以順利推進！



  不過她與劇組所面臨的困難接踵而至，甚至在開拍前夕，她在一場奔跑戲的排練中不慎滑

  倒，導致背部瘀青、椎間盤破裂、四處血腫，甚至一度無法站立。憶起當下，凱特苦喊：

  「那一刻我無法呼吸！」但考量到預算有限、時程無法推遲，她決定忍痛按照原計畫開拍

  ，她進一步表示：「他們把我固定好，我吃了很多止痛藥，當天結束時，我已經無法把一

  隻腳放到另一隻腳前面，但我來自一個不抱怨的學派，所以想說『好吧，別他X的拖延了

  ，凱特！』」





  此外，在《她眼中的世界》詮釋傳奇攝影師「黎米勒」的凱特溫絲蕾表示：「經過這麼長

  的時間發展這部電影，我使盡全力要成為她，如果我沒真正了解她在做什麼，那幾乎就像

  背叛她一樣。」她認為片中的相機不應該只是道具，因此特別請到世界上最後幾位祿萊相

  機技師之一，打造與黎米勒同款的相機複製品，並花時間學習如何使用，凱特對此分享：

  「在拍攝過程中，我真的重現了許多黎米勒的經典畫面。當一卷膠卷用完時，膠卷輪軸會

  自動空轉，這是無法造假的，所以我必須在鏡頭前實際更換膠卷。」她更自豪地接續說道

  ：「在最終剪輯中，有幾個鏡頭真的捕捉到了這個過程，而我是按照黎米勒的方式完成的

  ！」



  這部由凱特溫絲蕾耗時九年打造，轟動入圍金球獎、英國奧斯卡、英國獨立電影獎等重要

  獎項的電影《她眼中的世界》，即將在5月29日（週四）於台灣隆重獻映。本片劇情描述

  1930年代末期，隨著希特勒勢力崛起，二戰陰影籠罩歐洲之際，曾是時尚圈寵兒的黎米勒

  （凱特溫絲蕾飾演），與愛人若蘭（亞歷山大史柯斯嘉飾演）來到倫敦，並受聘成為英國

  《Vogue時尚》雜誌攝影師。然而，她不願只是為時尚按下快門，她對女性攝影師所受到

  的種種限制感到不滿，更看到納粹踐踏人道的卑劣行為，讓她毅然放下華服與聚光燈，在

  雜誌編輯兼好友奧黛麗（安德麗亞瑞斯波羅格飾演）的支持下，扛起相機，走進戰場最前

  線。她透過相機記錄下戰爭的殘酷，冒生命危險捕捉到歷史真相，從滿目瘡痍的戰場，到

  希特勒寓所中的震撼一幕，她用影像為無聲者發聲，讓世界無法再轉身不看…。



