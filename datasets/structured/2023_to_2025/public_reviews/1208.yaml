url: https://www.ptt.cc/bbs/movie/M.1703083880.A.2ED.html
title: '[新聞] 宮﨑駿《魔法公主》海報 電燈關掉竟藏彩蛋'
content: "宮﨑駿《魔法公主》海報 電燈關掉竟藏彩蛋\n\n2023/12/20 13:03\n\n〔記者廖俐惠／綜合報導〕宮﨑駿動畫鉅作《魔法公主》闊別27年重返台灣大銀幕，片商\n\
  邀請三金設計師方序中與插畫家董十行繼《神隱少女》21周年經典重映之後，再度聯手打\n造《魔法公主》台灣限定海報，分別為「阿席達卡版」與「小桑版」兩款，海報當中還藏\n\
  有彩蛋。\n\n\n《魔法公主》台灣限定海報由方序中、董十行攜手打造，當阿席達卡版（左圖）與小桑版\n（右圖）兩款海報合體後傳遞出完整意象。（甲上娛樂提供）\n\
  \n談及創作理念，方序中表示即便在20多年後的今日，《魔法公主》作品中探討的種種衝突\n議題仍持續地發生著；在這個時代裡，人們經歷過無數次的衝突與挑戰，人類文明與自然\n\
  環境、種族與權力等，一次一次的挫敗，卻也一次又一次的爬起，就像「阿席達卡版」海\n報中，乙事主、拿各神等巨山豬群及阿席達卡、坐騎亞克路走過生命之池，從暗處中獲得\n\
  治癒重生，並跟著發出微光的小精靈，開啟充滿未知的旅程，而另一頭走在前方向陽處的\n小桑、山犬神族莫娜一族與山獸神，則朝著希望前進，終有一天會走出這座迷宮般的森林\n\
  。\n\n\n《魔法公主》台灣限定海報的夜光效果超炫，兩款海報合體後螢光巨人、小精靈將夢幻浮\n現。（甲上娛樂提供）\n\n特別的是，此次實體海報設計透過夜光油墨的巧思，完整傳遞溝通意象，當阿席達卡版、\n\
  小桑版海報合體變成一張A1尺寸海報時，關上燈讓黑夜降臨，山獸神瞬間化身為「螢光巨\n人」穿梭在樹林間，其壯麗姿態躍然紙上展露無遺，發出的夢幻光影繼續為大家照亮前行\n\
  的道路。方序中想藉由創作傳達：「我們還在勇敢地前進。期待這條探尋的路上不只有阿\n席達卡與小桑，而是你我一起結伴同行。」\n\n\n《魔法公主》女主角「小桑」是由山犬神族扶養長大的人類。（甲上娛樂提供）\n\
  \n海報中，森林的茂盛跟壯闊感，對比出人類在大自然面前的渺小，負責帶路的小精靈雖然\n體型更為迷你，但漫山遍野都是，象徵著「希望」永存。在實體海報設計上，除了螢光巨\n\
  人以外，特地將小精靈們做成夜光，方序中說：「我們希望每個人將海報收藏回家，把燈\n關掉的時候，它也都陪伴著你們，找尋方向與希望。」\n\n\n《魔法公主》森林中住著一群會在夜裡發光的小精靈。（甲上娛樂提供）\n\
  \n《魔法公主》台灣限定海報分為「阿席達卡版」與「小桑版」兩款A2尺寸限量海報，凡於\n電影上映首周（1/5至1/11）至全台戲院購買兩張《魔法公主》電影票，即贈「阿席達卡\n\
  版」海報乙張，上映第二周（1/12至1/18）購買兩張電影票，就能擁有「小桑版」海報乙\n張，只送不賣，數量有限。\n\n--\n佛法的\n 是菩薩成佛之道\n\
  \        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
