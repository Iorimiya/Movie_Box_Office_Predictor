url: https://www.ptt.cc/bbs/movie/M.1704764739.A.D19.html
title: '[討論] 《魔法公主》自製停格動畫'
content: '影片連結：



  先祝宮崎駿大師生日快樂！


  不知道大大們都是幾歲看的魔法公主呢？


  民國86年8月10日下午1點全球影城的翡翠廳，是我和魔法公主的第一次相遇，原聲帶上的

  Mononoke Hime，是當年和九十歲經過日本時代的阿公除了桃太郎以外學到的第二個日本

  名字。


  如今睽違將近三十年再次在大螢幕上相遇，自己也用一些停格動畫的表現方式做了一支復

  刻短片和大大們分享，也一起重溫當年的回憶和感動~




  --'
