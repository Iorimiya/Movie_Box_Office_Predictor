content: "6歲我勸你真的不要帶進場\n \n以我的例子講給你看就知道了\n幼稚園的時候老師在電視放魔法公主\n裡面血腥、斷頭、密集恐懼\n當時看了直接嚇尿了\n\
  心靈創傷了好久\n以前看早期柯南也有幾集比較可怕\n但是魔法公主更恐怖\n \n \n \n儘管現在因為工作關係看了許多人體解剖噴血畫面\n但對於魔法公主重映，心中還是怕怕的不敢進戲院\n\
  \ \n \n拜託真的不要因為「宮崎駿」三個字就覺得一定適合小朋友\n就如同有次宮崎駿音樂會遇到小小孩來鬧場那樣\n \n我真的覺得魔法公主應該列為限制級才對\n\
  或者至少也要輔15\n \n \n \n \n\n如果是這理由我接受\n以後60週年重映，阿公帶孫子去看"
