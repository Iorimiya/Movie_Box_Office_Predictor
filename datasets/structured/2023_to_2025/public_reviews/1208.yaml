url: https://www.ptt.cc/bbs/movie/M.1480679233.A.404.html
title: 'Re: [討論]《你的名字》賣破194億日幣破魔法公主'
content: '今天在中國首映，觀眾突破兩百萬，票房突破五千萬人民幣，

  日本人的感想如下:




  "是枝みてるか？ "


  "おい是枝 なんか言えよ "


  "是枝は中国やアジアの動向を見ずにガラパゴス云々口走ったのは失敗だったなぁ

  たぶんアイツは賞をくれる欧米の文化人しか眼中になかったんだろうな "


  "雑魚監督の是枝もあれだけデカいことを言ったんだから

  一度くらいは海外でヒットする映画を作ってみろよ "


  "シンゴジラも君の名は。も内容的にもガラパゴスだとは全く思わないけどね

  是枝の例のコメントはマジで言ってることがおかしいよ "


  "是枝さん、ガラパゴス避けるならわかりやすいストーリーと派手な絵だよ "


  "是枝作品好きだったけど一気に嫌いになったわ

  クリエイターがあんな発言したらダメだよ "


  "君の名はは売れる要素詰め込んだだけのクソ映画

  それが馬鹿な日本のガキとアジアの土民に受けてるだけ


  くらい思ってそうな奴いそうだよな "


  "横からだけど是枝の発言叩かれたのはプロの監督なのに素人と

  同じ目線でしか分析出来てなかったからかと

  「売れてる要素てんこ盛り」の作品なんか邦画洋画いくらでもあったけど

  200億なんて行かずに消えたのが殆ど

  では何故君の名ははその他の売れる要素満載映画より爆発的に売れたのか？

  違いは何か？

  ここが知りたかったのに「売れてる要素あったから」って

  その中身を説明しなかったのは色眼鏡でしか見てないのかなと思った "


  "是枝叩きつれぇわ "


  "実写邦画の「是枝裕和」大監督　「この映画（君の名は。）に限らず、

  女子高生とタイムスリップという題材からはそろそろ離れないといけないのではないか

  、と思います」


  ↓


  「君の名は。」アジア5カ国で1位達成！中国の初日興行収入も1位の好発進 "



  "自分より実績を残している人間に対して上から目線で無礼な発言をしている

  是枝裕和が「人生に寄り添う映画」とか自己陶酔の局地な台詞を述べてるのに

  は笑わせて貰ったわ "


  "是枝裕和、逃げ回ってないで表に出てこいや"


  "人生に寄り添う映画を撮る人間が平気で他者を見下し侮蔑するんですね

  大した大監督さまですねぇ～是枝裕和はｗ

  で、この大監督さまは幾ら売れたんです？ｗ "


  "新海誠　２００億超+中国その他で１００億超

  庵野秀明　８０億超+５０億超+４０億超


  で、実写邦画の大監督である是枝裕和の成績は？ "


  "是枝なんて負け犬マイノリティ実写邦画厨しか知らんだろｗ

  俺もラブライブに惨敗した蛆TV全面バックアップのカンヌ出展作で初めて知ったし"


  ...這是短短兩個小時內湧進的留言，大家超狠的，

  我想就不用我一一翻譯出來了吧?(那位w君如果有興趣，倒是歡迎他翻譯)



  --


  沒什麼啊，大家自己有眼睛，自己看啊。


  我只是忠實轉錄一下日本人的評論，在公堂之上轉載一下他國輿論，該當何罪啊~^^


  我翻譯又有人要說我"超譯"了，那就乾脆讓有眼睛的人自己看好了。


  看樣子傷到某些人的玻璃心了。


  看了這些言論還能硬凹，臉皮大概也比防彈鋼板厚了。



  來源: 2ch 8mm板。


  ok，附好了，自己看。


  所以我不只摘一篇，而是全摘，這樣才公平。


  居然有人把那個嚷嚷著要放火燒屋的人的話當真，太酷了。



  一句話: 我不覺得八卦板就沒有參考價值，這樣說話的人基本上是抱持著一種優越感，

  但這種優越感是不是正確，我想我也不做評論。


  又，"雜魚監督"那句的全意是說，

  "


  ...說真的，如果單比在海外的票房的話，不要說宮崎駿了，

  是枝連哆啦的車尾燈都看不到吧?


  現在的問題已經變成票房與影評之爭，



  抱歉我是個俗物，所以我個人是站在票房一方。


  另外其他幾篇跟我之前的看法類似，也就是在質疑說

  "放了賣座的要素就會賣座嗎? 這種說法根本是無視現實"。


  總之，大家還是集中在質疑海外票房這點上，

  他們批評得是


  大概是這樣的意思吧?


  (這次我可沒有超譯)


  我個人認為以動畫來說的話，應該不是特例。

  換言之，是枝所講的東西是不是只適用於真人電影呢?

  我想這個是很值得觀察的。'
