url: https://www.ptt.cc/bbs/movie/M.1705826360.A.295.html
title: '[  雷] 魔法公主的一句台詞'
content: '我第一次看魔法公主是我童年在電視看的，多年後裡面劇情我幾乎忘差不多，但最有印象

  的是受槍傷的男主角當要被女主角殺死時，居然說：


  「妳好漂亮。」


  讓我覺得這種遺言帥呆了。長大後，我成了一名與男主角相反的肥宅，癡想萬一有正妹要

  宰我，我也這樣說。



  今天在中壢補票時



  我是留在最後聽完久石讓的片尾曲，聽完時我轉頭拿背包，看見院裡只剩一名女生與我互

  望，隨即我們都微笑起來。她介紹自己是宮崎駿迷，每場都刷三次，也覺得為何他人不留

  下來聽完音樂等。


  我突然很心動，想說這台詞，但還是說不出口。聊一些後，最後我跟她揮手告別，只說了

  再見。


  想起電影女主角最後說的話，在故事後，他們應會在一起吧？而我不是阿席達卡。





