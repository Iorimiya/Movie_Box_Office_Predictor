title: 'Re: [好雷] 魔法公主 (配音和字幕問題)'
content: '今天下午在京站威秀看完國語版的魔法公主.....


  字幕跟我印象不一樣外，也跟預告不一樣


  中文配音就跟字幕走，但有個配音還唸錯

  “祟靈” 唸 “崇靈”


  魔法公主這次宣傳預告有一段阿席達卡跟黑帽大人對話是用舊版的字幕：

  “我想用澄淨的眼光看清真相再做考慮”

  一直很喜歡這句！



  結果中文版記得這句改的很平很短,不知道日文版是否一樣？



  預告片中有句 “命運要被改變”

  翻譯問阿席達卡要不要犧牲


  如果有版友有記得，可以再指點



  最後..中文版 配音加上台詞的變動讓人很出戲，尤其阿席達卡的聲線跟回憶中有差，很

  跳比較大人音，一直有違和感


  看完中文版覺得很疲勞 有點痛苦...還在記憶短缺..不知道有人也一樣嗎？









