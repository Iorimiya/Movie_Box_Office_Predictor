title: '[討論]《你的名字》賣破194億日幣破魔法公主紀錄'
content: '據東寶電影公司公布數據，《你的名字》從8月26日上映至今，截至本月27日為止，已創

  下日幣194.9億票房，外界大多看好票房極有可能突破200億日幣，打敗目前亞軍、2004年

  宮崎駿《霍爾的移動城堡》196億紀錄。至於日本國產片的冠軍則是2001年的《神隱少女

  》308億，至今仍無片能打破紀錄。


  此外，「安妮獎」向來被國際視為是動畫界最高榮譽，有「動畫界奧斯卡獎」的稱號，日

  前公布第44屆入圍名單，《你的名字》也確定入圍「最佳獨立動畫獎」、「最佳動畫導演

  獎」2大獎項肯定，其中導演獎項部分，《你的名字》將和今年入圍11項最大贏家《動物

  方城市》的導演拜倫霍華、瑞奇摩爾等人一同角逐。頒獎典禮將於明年2月4日在美國洛杉

  磯舉行



  --'
