title: 'Re: [好雷] 魔法公主'
content: '借引用一下推文




  本來星期五下午要去看

  所以星期四晚上我先用Netflix的回憶

  看看是日文版還是國語版比較有小時候的記憶


  我發現Netflix上的字幕跟台詞很多相異處

  除了用詞不同，有些地方是有字幕沒配音，有些地方是有配音沒字幕

  個人推測是國語版是當年台灣院線的配音

  字幕則是Netflix自己從日文翻譯的

  (常聽人批評Netflix的翻譯，怎麼不直接用國語版打逐字稿就好?)


  那看推文說這次重映的有些翻譯不同，可能是參考Netflix

  是有新的中配嗎?

  還是舊的國語配音+新的字幕?那會不會又有兩邊對不上的問題?


  希望有去看過國語版的人幫忙回答~

  感謝!



  --'
