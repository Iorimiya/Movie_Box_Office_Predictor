url: https://www.ptt.cc/bbs/movie/M.1705752821.A.4A5.html
title: '[好雷] 魔法公主-怎麼角色和我同事們那麼像'
content: "被邪靈附身的野豬、笑得超詭異的山獸神、只剩頭還可以咬人的莫娜、一堆發出怪聲音超\n像咒怨的小精靈、沒事就斷手斷頭的畫面，現在想起小時候看《魔法公主》，留下的震撼\n\
  只有陰影。趁著重新上映的今年再刷一次，雖然陰影還是無法抹去，但看懂背後的涵義之\n後，覺得這是宮崎駿 作品中黑暗到相當具有突破性的異色童話。反戰、環保、女權、種\n\
  族，《魔法公主》多面向的探討足以讓它站穩經典地位，就算到了28年後的今天還是一樣\n毫不過時。\n\n「自私」一詞是我給這部電影的註解，我想到經濟學中最經典的賽局理論－囚徒困境。「\n\
  囚徒困境」的結論是在理想的情況下，各退一步才會是最好的結果，但偏偏在現實生活中\n都會是堅持己見或溝通不良的狀況，所以最後大家都會選擇自私的作法而兩敗俱傷。\n\
  \n自私雖然詞性偏負面，但其實是沒有對錯的，只能說是比較為了自己著想而已。但可以確\n定的是自私絕對不會是最佳解，我想這也是宮崎駿想透過《魔法公主》對觀眾的喊話：我\n\
  們可以選擇堅持自己的立場，但還是可以透過溝通和同理，做出讓步和妥協，一起更好的\n活下去。\n\n《魔法公主》的角色設定也相當具有深度，動畫的角色很容易善惡分明，或是為了闔家觀\n\
  賞而洗白反派，但宮崎駿選擇另一個走向的善惡二元：同時放大角色的優缺點，討喜的角\n色有明顯的缺陷，看似反派的角色也令人欣賞。\n\n然而我在看的時候，一直忍不住帶入職場的狀況，我覺得每個角色都代表職場中某類性格\n\
  的人，以下絕對不是電影原意，但我還是想偏題說說我為這些角色定義的腦補人設。\n\n-\n\n#基層員工們\n＊阿席達卡：正向創業型人格，擁有絕對樂觀的心態，不放棄透過溝通，去協調好各部門\n\
  不同的意見，期待創造出不同的可能性，雖然過程讓他遍體鱗傷，但還是不會動搖他的理\n想。\n\n＊小桑：容易情緒化的感情用事腦衝派，對於敵意相當敏感，因此容易與人產生對立。在\n\
  職場政治中派系立場明顯，對於派系外的人一概抗拒，但如果和他們有私交的話，會發現\n他們其實很適合當朋友，未來合作上也會順利許多。\n\n＊疙瘩和尚：惟恐天下不亂的人，在各個派系間遊走，帶著各種八卦去交換更多的八卦。\n\
  工作能力雖強但只願意當個狗腿的人，為有權勢的人赴湯蹈火，以換得靠山的信任，其他\n人都只是他達成目的的墊腳石。\n\n＊猩猩：成天只會抱怨、每天負能量爆棚的人，抱怨工作是家常便飯，推託責任是慣用手\n\
  段，工作能力不突出擔任不了公司要角，只能朝著比自己弱小的菜鳥丟石頭，透過刁難別\n人來換取微薄的成就感。\n\n#中高階主管們\n＊莫娜：年事已高處於待退狀態，因年資高所以在公司講話很有份量，也很常擺老看不起\n\
  年輕人。雖然已經沒心思在工作上，但還是會擺出高姿態，讓人不敢和他作對，因為要是\n真的惹到他，他還是有能力咬你一口。\n\n＊乙事主：為公司盡心盡力，對於公司有著非常強烈的信仰，全然相信公司的判斷，但最\n\
  後卻被公司背叛，所以信仰崩壞，魔化成為怨念極強的員工。因為只是依附在公司，沒有\n看懂大局的判斷力，所以很常帶著下屬往錯誤的方向衝。\n\n＊黑帽大人：不管別人死活，一切以KPI最大化為考量，任何與此無關的事物都可以犧牲\n\
  ，未達目的不擇手段。但也因此績效極高，亮眼成績讓所有人都不得不認同他的能力，而\n他責任感也很高，很願意照顧下屬們，相當具有領導魅力。\n\n＊山獸神：平常不會看到他，但只要他出現就代表有大事要發生了。不會知道他在想什麼\n\
  ，思考層次不是一般員工可以理解，永遠看不懂他那一抹微笑是什麼意思。他的一舉一動\n不只影響公司存亡，也掌握員工生死，因為沒有和任何員工有情感連結，所以任何決策都\n\
  是全然的公正。\n\n-\n\n就如同電影中各個角色的決定，職場中也常常是資訊不對稱的狀態，所以大多數人都會選\n擇自私的做法，這就是有著形形色色的人的大公司，之所以無法效率最佳化的原因吧（胡\n\
  扯完畢）。\n\n追蹤欸冷 \n\n--"
