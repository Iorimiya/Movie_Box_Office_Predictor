url: https://www.ptt.cc/bbs/movie/M.1480567247.A.CA8.html
title: 'Re: [討論]《你的名字》賣破194億日幣破魔法公主紀錄'
content: '其實重點在於，這部片確實有打動到人心。


  如果沒有打動人心的話，就算是灌了再多賣座要素下去，

  也不可能達到現在這樣的成就。


  (話說，中國的預售票房已經超過之前的哆啦了)


  我覺得先不要在意新海下一部片怎樣，重點是這部片帶給人的感動，

  然而我想，這是某一些人所不能理解的...


  --


  重點是"打動人心所以賣座"，而不是"賣座等於打動人心"，

  連基本的因果關係都弄不懂嗎?



  我可沒有說誰，請不要對號入座好嗎?'
