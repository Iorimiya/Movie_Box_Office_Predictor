title: 'Re: [討論]《你的名字》賣破194億日幣破魔法公主'
content: '其實正如我所言，"賣座片一定有打動人心之處，但是打動人心的片不一定賣座"。


  不管是聲光效果或是什麼有的沒有的，能賣座一定是和觀眾產生了某種共鳴，

  但但有共鳴的電影不一定就會賣座，這也是天經地義的道理。


  我批判的是某些可笑的人，以為把賣座元素放進去就會大賣，

  殊不知重點不在元素，而在片子和人心的共振共鳴上...


  這也不用特別指誰，對岸一堆，最近有個O蛋拍的"長城"正準備上映呢!


  ===========================================================


  我說張藝謀，某人不要再忙著對號入座了喔~^^


  --'
