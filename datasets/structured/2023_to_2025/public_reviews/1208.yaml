title: '[討論] 《金剛：骷髏島》致敬《魔法公主》'
content: '導演：怪獸設計受到宮崎駿動畫的影響



  金剛：骷髏島上的怪獸設計太有來頭，導演說受到宮崎駿經典作品《魔法公主》的影響。



  《金剛：骷髏島》導演喬丹·沃格-羅伯茨近日接受外媒採訪時透露，影片中怪獸形

  象設計受到宮崎駿《魔法公主》的影響，他說：“就像《魔法公主》中的動物充滿著靈性

  ，有各自統治的領域。


  早前發布的預告片中，除了金剛外，長得像恐龍、蜘蛛、水牛等動物的史前怪獸統統出現

  ，人們有的錯愕奔跑尋求生機，有的則拿出炸彈欲同敵人同歸於盡。賴利扮演的角色在預

  告中里說道，金剛保護骷髏島免於地下怪獸的蹂躪，影片中也必然會。


  　　按照導演的解讀，骷髏島上的怪獸都是被輻射污染過的，但又形成了獨特的生態系統

  ，就像《魔法公主》裡有犬神、豬神和麒麟獸各自掌管不同的領域，骷髏島上的蜘蛛怪、

  水牛怪也有類似功能，設計上兼具美感和恐怖感。



  --'
