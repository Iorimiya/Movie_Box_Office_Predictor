title: '[情報] 【魔法公主 IMAX、4K修復版】預告'
content: '電影介紹

  ★ 宮崎駿經典不敗動畫IMAX®、4K修復

  ★ 日本票房202億締造吉卜力新里程碑，勇奪日本影史票房冠軍

  ★ 首部與美國華特迪士尼合作進軍國際市場的吉卜力電影

  ★ 耗資25億日圓製作費，耗時3年手繪14萬多幀畫稿

  ★ 電影配樂大師久石讓傾力打造，感受身臨其境的沉浸式聽覺享受


  劇情簡介

  唯有和解才能共存，我們一起活下去

  中了致命詛咒的王子「阿席達卡」離開家鄉尋找解方，卻被捲入森林神獸與礦城人民之間

  的生存搏鬥，旅途中邂逅由山犬神族扶養成人的魔法公主「小桑」，小桑決心守護森林與

  人類對抗到底，戰役一觸即發，而阿席達卡則試著找出能夠化解大自然與人類紛爭、和平

  共處的方法。







  --'
