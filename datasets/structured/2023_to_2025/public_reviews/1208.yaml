title: '[好雷] 魔法公主'
content: '今天看完魔法公主


  又得到滿滿的能量啦！


  當然也得到一張阿席達卡海報，讚！











  賊某古老的電影應該是不用防雷拉後？

  （吶格布魯斯威力是鬼！）








  ———以下有雷心得———




  魔法公主世界觀分成各種不同的勢力，而主人公阿席達卡雖然遊走在各種勢力的其中，但

  沒有隨波逐流，以堅定的心、澄淨的眼神，不忘初心的精神貫穿了整部電影。



  咱們人類方：未發明槍砲火藥之前，山裡的神靈宰著他們的生活，當火藥槍砲出現去神格

  化後，走向對抗、侵略這一步也是必然會發生的事情。


  森林神靈：當人類由崇拜轉為入侵，憤怒可想而知，而他們也崇拜著山獸神。


  山獸神：我覺得祂是整部最Chill的動物XD或許祂的存在是作者想要說，生命會一直持續

  循環但恨及怨念也會循環，而這個不是獸神可以處理的，不同的勢力必須互相諒解，仇恨

  才能停止。


  儘管在各種平台已經看了這部電影N次了，但每當我覺得自己，已經被社會化到一定程度

  了，都會找時間再看一次，不管是阿席達卡的直爽率真、小桑的偏見、獵人大叔的真小人

  、學背人的精靈、猩猩群碎嘴要被咬的時的快陶XD、當然還有整部的配樂，看完都能讓我

  恢復不少能量，可以繼續面對生活，下週再帶家人去二刷，拿第二版小桑海報，然後各別

  框起來！！






  再次提醒一下要帶小朋友去看的家長，這部血腥畫面偏多，可能會不太適合學齡兒童。


  另外畫質感覺沒有在家裡平台看清楚哦！


  --

  XD 可能是我看得那廳的問題

  音響讚！！

  我覺得大部分時間有1080P!

  我直接忽略黑歷史，當她成是妹妹XDD'
