url: https://www.ptt.cc/bbs/movie/M.1705242182.A.81E.html
title: '[好雷]《魔法公主》先看清原委，再斷定是非'
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  1.影片名稱：魔法公主


  2.觀影時間：2024/01/14


  3.觀影地點：京站威秀（沒想到上映第二週還是開最大的第六廳）


  4.觀影方式：自行購票


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  部落格圖文版：


  趁著這次重映，終於好好地看了一次《魔法公主》。


  一直以來，我對於這部電影的印象都是片段的。具體而言，就是能連結到男、女主，電影

  中的神獸如山犬、山獸神（鹿身形態），以及小時候還難以定義，不確定是什麼的邪靈與

  螢光巨人等形象。


  而那時的我，自然是無法理解《魔法公主》想傳遞的訊息。


  從拿各神、乙事主兩個山豬神相繼成為邪魔，到失去頭顱後的山獸神（螢光巨人形態）讓

  所接觸到的一切失去生機，一次又一次大自然的反撲，再加上男主阿席達卡旅途上所見，

  不同勢力間的爭鬥。人要如何與自然共存，彼此之間又要如何共榮，要試著去理解、和解

  才能「一起活下去」是電影最重要的概念。


  另一個則是「選擇」。


  「到了西方，要用澄淨的眼光，看清楚事實真相再做決定。」


  在斷定是非之前，必須先確定自己是否已透徹地看清原委。


  「你那時是否覺悟到，自己的命運可能就此改變？」


  這使我想到了昨天的選舉，所有的決定都不該只是以簡單的仇恨做出，仇恨只會滋長仇恨

  ，無助於解決問題。


  「大家看清楚，這就是一個人內心充滿仇恨的樣子。」


  阿席達卡身上的咒痕正是一種具象化的仇恨，詛咒使他的力量得到提升，同時也隨著人與

  人、與自然之間的仇恨加深而蔓延。直到黑帽大人在山獸神的失控後意識到戰爭不是唯一

  的解決之道，拿各神所留下的詛咒才終於消退。（值得注意的是，咒痕並未完全消失）


  而由於我之前對《魔法公主》最深刻的印象，是阿席達卡在對抗手上扭動的邪魔，但相較

  於自己身上不斷變深的咒痕，他次次都選擇了幫助他人。這並不代表阿席達卡不在乎詛咒

  （每次清醒時，他都會察看自己手上的咒痕），而是一種優先程度，因此電影的調性，意

  外地比我記憶中的溫暖的多。


  我很喜歡電影以溫情作結，隨著山獸神的頭顱被歸還，大地恢復生機，最後一幕象徵森林

  生機的小精靈再次出現完全是畫龍點睛。然而在現實生活中，這種「再一次機會」肯定是

  可遇不可求，更凸顯了和解、選擇的重要性。


  然後《魔法公主》裡角色的死法和傷勢真的是太慘烈了吧！一言不合就斷頭斷手>”< 黑

  帽與和尚的手下扮成死傷慘重的山豬迷惑失明又受重傷的乙事主，藉此跟著它回到山獸神

  聖池的劇情也有點曲折，難怪小時候完全沒有印象XD 另外，看到阿席達卡脫掉外衣、大

  露身材的去幫忙踩風鼓時，對這個造型的印象直接湧現。看來除了邪靈，阿席達卡只包住

  肩膀和手臂的造型，也是令我印象深刻（Ｘ


  --


