  而且照你這樣說的話，


  一些被罵得臭頭卻大賣的大片也可算是"感動人心"了，不是嗎？


  我自己進電影院看了君名三次(信義威秀11廳、in89豪華PC廳、林口威秀8廳)，


  越看越能沈浸在劇情和演出裡，心裡也越是感動。


  但恕我直言，像jeanvanjohn你這樣子"護衛"君名的言論，


  只會讓對君名沒有共鳴的人對君名(或是你)更加反感。




  --

