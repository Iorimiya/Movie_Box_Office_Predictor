url: https://www.ptt.cc/bbs/movie/M.1716886109.A.052.html
title: '[  雷] 魔法公主'
content: '防雷













































































  難怪之前重新上映又造成了旋風

  在我目前看過的宮崎駿可以排上前幾名

  尺度也是目前看過最大的,我看到時有嚇到

  一發弓箭就把手和頭射下來也太唬爛

  真正的重點在於所有角色沒有絕對的善惡

  有的只是自己的立場,和絕對的執行力

  最有代表性的是黑帽大人吧,她不算是個壞蛋

  但她的立場跟正派角色們完全背道而馳

  她的存在也帶出了這部電影女性主義的部分

  講難聽一點是有點戰男女啦,看過其他設定是覺得合理

  而魔法公主的身份矛盾和認同也都包含在這些立場

  其實很多的探討都意外的很單純

  因為都可以概括在立場和沒有對錯裡面

  最後對於人類貪婪的描寫也是

  就算在我心中最好的還是神隱少女

  魔法公主也絕對是無庸置疑的傑作

  畢竟他把戰亂、自然、生死都結合的很平均

  每個主題都有自己表演的空間

  反而男主角有時候有些被淹沒在這些東西裡頭

  不過也不是壞事啦,我就滿喜歡的

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  會拿美麗比喻成愛的人，都是不知愛情真相的人

  會把醜陋比喻成愛的人，都是熟知愛的驕傲者


  --'
