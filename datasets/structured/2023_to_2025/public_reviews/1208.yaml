url: https://www.ptt.cc/bbs/movie/M.1480554943.A.EA9.html
title: 'Re: [討論]《你的名字》賣破194億日幣破魔法公主紀錄'
content: '我有時候會覺得有些人很好笑，他們有一種邏輯，新海誠不如宮崎駿所以爛，然後擺出神隱少女票房多少屌打你的名字，這是不是一種因為呂布很強所以關羽很爛的概念？那你叫動畫界那些黃巾渠帥情何以堪？


  還有一種你跟他們講票房他們跟你講寓意，你跟他們講寓意他又跟你講票房的跳針黨可以請他們先把標準說清楚再來比嗎？


  真的要比新海誠跟宮崎駿，現在的比法真的沒什麼好比的，宮崎駿是日本動畫界現今當之無愧的王者，但王者也不是生來就是神，魔法公主與神隱少女一個是他57歲一個是他60歲的作品，確實是他集大成的巔峰之作，你的名字確實比不上，但說難聽點他這輩子也就這樣了，我不覺得他之後的作品比如移動城堡有這種水平


  而且別忘了新海誠才43歲，作為一個動畫導演還在上昇期呢！看看宮崎駿43歲也才剛創作出風之谷而已距離他的巔峰還早的很，我不覺得你的名字會輸風之谷阿!


  前輩是拿來當標竿而不是拿來拜的，一昧的貴古賤今沒什麼好處，如果要公平評價兩人我想等到2033年也不遲吧？


  --'
