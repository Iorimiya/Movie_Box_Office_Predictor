url: https://www.ptt.cc/bbs/movie/M.1477620684.A.99F.html
title: 'Re: [好雷] 魔法公主 - 黑帽大人'
content: '宮崎駿電影裡面的"反派" 通常都是政府單位


  天空之城裡面 抓悉達要去天空之城的 是政府派的


  紅豬裡面要抓紅豬的 是義大利情報單位


  魔法公主裡面要去殺山神的 是政府


  霍爾的移動城堡 男主角整天對抗的 是政府




  相反的 宮崎駿電影裡面的"壞腳色" 通常都是正派或至少中立感覺


  天空之城裡面 空賊一家人照顧男女主角


  紅豬裡面 可愛的空賊最後還辦比賽賺錢跟大家打成一片


  魔法公主 你所說的黑帽大人 說穿了就是個山賊山大王 但你並不覺得她壞




  所以宮崎駿長期以來就被認為是個共產黨+反政府思想XD

  是說他的電影這麼多日本人愛 還被認為富有"教育意義" 讓我覺得蠻搞笑的

  靠悲根本是教育大家要反政府吧


  --'
