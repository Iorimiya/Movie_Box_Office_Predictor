url: https://www.ptt.cc/bbs/movie/M.1762432405.A.A8D.html
title: '[討論](有雷)終極戰士：殺戮星球 片尾劇情 '
content: "有雷\n\n  沒看不要往下看\n\n  .\n  .\n  .\n  .\n  .\n  .\n  .\n  .\n  .\n  .\n  .\n\
  \  .\n  .\n  .\n  .\n  .\n  防雷保護\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n  1.劇情上兩個生化人\
  \ 對話中有提到 被賦予了情感系統 目標是引誘當地物種協助\n    不確定大衛是不是也這樣設計\n    雖然劇情看起來女主角，表現很有人性，反派就典型的陰狠不顧他人性格\n\
  \    但後來仔細想一想，這兩臺生化人好像都只是做出符合自己設定目標的形象\n    不太確定是不是真的有人性\n\n    a.泰莎，系統問主角下落時，做出了偽報上級，可能是因為之前重啟時被警告，\n\
  任務失敗會被除役，想到之前AI實驗時，AI會為了避免自己被關機導致任務取消而說謊，\n代表泰莎的動作還是屬於普通AI會進行的動作，蒂亞導致主角脫困，也沒表現生氣\n\
  \n    b.蒂亞，她講一堆故事給主角聽，但好像有些地方哪裡怪怪的，人類剛到就全滅，\n但看起來營地就只有生化人，另外她的戰鬥能力怎比普通的保安兵強?還說是實驗室人員\n\
  ，而且兩臺長相一樣，性能理論上會一樣，該不會她其實也是戰鬥型號，一開始半身也能\n輕鬆打倒會飛的獵食生物，\n\n 疑點一，有看過主角的狩獵目標，然後小巴加入後，一直說服主角要帶著，隔天\n\
