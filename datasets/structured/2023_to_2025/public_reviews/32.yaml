url: https://www.ptt.cc/bbs/movie/M.1763205819.A.98C.html
title: '[超好雷] 終極戰士：殺戮星球'
content: '雷文防雷資訊頁


  從頭爽到尾 特效用好用滿


  其中某些片段看得出詹姆斯卡麥隆有參與製作


  劇情不只有殺戮還有一些可愛的搞笑片段


  算是近期爆米花爽片代表













  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這部看得當下就好想來版上發文 真的太好看了


  不只熱血震撼的戰鬥畫面 還有正妹艾爾芬妮 半身人、艾爾芬妮 獨眼龍


  主角揹著半身的艾爾芬妮 然後還在耳邊一直講話  感覺之後會出本本


  然後還有那隻大眼猴 超萌的阿 牠在這部完全是笑果擔當


  真的快被他笑死


  然後戰鬥場面有夠多 主角要在異星球生存 對抗各種巨獸之外


  還要對付企業級的生化人 後面還要跟自己老爸PK


  然後艾爾芬妮也有出一分力 第一次看到半身人的戰鬥合體技


  看到生化人被艾爾芬妮的腿夾住那一刻 阿嘶~~~~~~~ 也太爽了


  總之這部導演給你的不只滿滿的戰鬥場面 還塞了很多引人遐想的畫面


  --'
