title: '[普雷] 終極戰士 殺戮星球'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n趁著昨天颱風假早上還沒有風雨，威秀也宣布正常營業的時候順手刷。\n\
  因為版上諸多好雷是讓我滿好奇的。就結論來說，對我而言就是可以一看。\n\n畢竟我對於這個角色在異形系列裡面已經有過出場的印象了，所以原本就不覺得會有什麼劇情，單純就是武鬥派的走向才對。\n\
  的確整體來說就是這個種族的展開，也著重在打鬥與歷練的過程，然後加入了一點點的情感因子。\n歷練的過程也算是有用心設定，至少感受的到主角從小屁孩變得比較能利用環境開外掛了。\n\
  原本打不過的大魔王也巧妙的透過劇情安排，除了收編大魔王的小孩之外連帶還幫忙報仇了。\n\n最後對決親爹的部分是有點覺得親爹好像變太弱了，佔的篇幅好像有點少，象徵性的表達主角已經超越內心的心魔，也超越了他的親哥。\n\
  出乎意料之外的是還埋了一個伏筆，打完親爹如果票房好，下次可能要打親娘了。\n\n整體都還算流暢，感覺有很多設定都還可以有延伸電影或影集的可能。\n中規中矩，可以一看。\n\
  \n--\n\n    給我跪到天亮!!!\\_/\n  ●/\n <▊     ●\n  ||     ▊=\n         >>  女友大人永遠是對的..b\n\
  \n--"
