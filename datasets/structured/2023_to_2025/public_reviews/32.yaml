url: https://www.ptt.cc/bbs/movie/M.1763022312.A.36A.html
title: '[好雷] 終極戰士：殺戮星球   美食界具象化'
content: '好雷給推，滿舒壓的爽片。


  只看過普羅米修斯和聖約，以前沒看過終極戰士，基本上是帶著空白的背景知識去觀影。


  劇情本身滿平鋪直敘，沒什麼特別處，算是有好好講完一段故事。



  會給好雷主要是戴克墜落干納星之後，那種身旁環境都虎視眈眈要你命的壓迫感很重，


  不只是動物，連花、草、樹都可能隨時殺了你，骨野牛、月蟲、雨蛇、會爆炸的毛毛蟲，


  一整片的剃刀草也很有趣，這種奇特的生態系和生物設定真的很吸引人。



  不要說打不打得倒卡里斯克了，能不能在這種生態系活超過一個禮拜都是個問題。


  完全讓我想到美食獵人的美食界，Toriko第一次闖入美食界也是被各種生物逼入死境，


  都在腦補如果是後來變強的Toriko，會怎麼料理和吃這些生物了。



  不知道板友還有沒有推薦其他像這種充滿危險特殊生態系的電影~~~


  --'
