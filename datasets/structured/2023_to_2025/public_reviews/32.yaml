url: https://www.ptt.cc/bbs/movie/M.1762785045.A.B4D.html
title: '[ 迪士尼終於用心雷]  終極戰士：殺戮星球'
content: '有雷

  值得一看！




  終極戰士也算是老IP了，只是以往的印象就是打打殺殺，跟異形比起來少了那麼些經典的

  味道，但最新的殺戮星球讓這系列多了能深掘發展的好開頭。


  拜現在的特效發達所致，本片一大堆異星風景看的目不暇給，配合許多充滿特色的外星生

  物，顯得宇宙觀龐大了起來，跟異形系列的連動也有搭上最新的「異形.地球」，生化人

  、合成人、仿生人，都有非常強大的能力，的確也很適合作為終極戰士的對手，而且克服

  了人類在外星球活動的限制，以後可以更方便的探索宇宙。


  最後說下終極戰士的表現，本片動作戲跟武器的使用拍的很好，最喜歡的就是最後用當地

  的生物做出原有科技裝備的雛型，非常有創意！


  可以看出來這片的設定、細節，都比漫威系列用心多了....算是迪士尼暨搞砸了星戰、復

  聯4後，比較用心的電影了，細節很精緻！整體效果可以說是很接近曼達洛人的質感。


  很期待後續的作品！但新的大猴王獸幼崽希望眼睛不要那麼動畫....有點假。

  生化人應該也是星戰裡的西斯武士，很颯很美。






  --'
