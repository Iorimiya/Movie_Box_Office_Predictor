url: https://www.ptt.cc/bbs/movie/M.1762597046.A.73E.html
title: '[好雷] 終極戰士：殺戮星球  陽剛美學爽度滿分'
content: '好久沒看到這麼滿意的爽片了，不跟你說教、也沒有DEI臭味，就是一個年輕的阿終

  成長為戰士的故事。雖然譯名「殺戮星球」取得很驚悚，但是內容沒有什麼抽筋扒皮

  過於賣弄血腥的畫面，可安心觀看。


  這次由阿終擔任主角，沒有礙事的人類，所以對這個戰鬥民族的刻劃更加飽滿。開頭

  就以殘酷的家族相殘，展現這個戰鬥民族的觀念：弱者沒有資格存活，只會讓家族蒙

  羞。主角戴克原本應該死在哥哥酷威手下，但是哥哥由於親情放了戴克一條生路，也

  因抗命反而被父親殺死。戴克在復仇的旅程中，原本也堅持戰士要獨力戰鬥的觀念，

  在遇到合成人希亞和萌寵小巴後，逐漸放開心胸，接納了「夥伴」，建立屬於自己的

  家族。


  主角戴克雖然沒有傳統阿終那麼人高馬大，但是戰鬥依然勇猛，不管對手是巨獸還是

  巨大機器人都敢撲上去肉搏，而且戰鬥智商在線，懂得利用環境創造戰鬥優勢，根本

  是傳統少年漫畫的主角格。不過全片最佳的動作設計我投給希亞，上下半身合作無間

  ，你身體接起來反而沒那麼強吧！


  不止主角性格和動作設計，整體的美術風格和配樂，都給我一種久違了的陽剛粗獷的

  純粹感。如果你喜歡傳統的英雄成長類型故事、傳統的男性向動作片，那麼這部非常

  值得你進場舒壓！




  --'
