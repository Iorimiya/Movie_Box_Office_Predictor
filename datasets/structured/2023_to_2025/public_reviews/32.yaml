url: https://www.ptt.cc/bbs/movie/M.1763064497.A.A94.html
title: '[普雷] 終極戰士:殺戮星球 - 不帶腦看就是佳作'
content: '//無雷區



  就如標題提到的


  這部以動作片而言 確實做得蠻到位的


  各種動作場面都很有張力 畫面感也很好


  節奏安排上也很不錯


  加上算是有特色的角色設定


  單就今年來說 可能已經是數一數二的動作爽片


  但 劇情邏輯上真的就完全凸顯出


  近年好萊塢編劇的重大弊病


  各種不合理跟禁不起推敲


  後面的部分就是會提到劇情 有雷的部分



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  首先就是開頭的家族內鬥


  故事上並沒有給出一個真正能夠說服人


  為什麼戴克的父親如此堅決要殺掉他的原因


  只是不斷強調他是"弱者"


  雖然後面有大概提到 可能是因為他的身形比較矮小


  但這其實也不大合理


  Yautja並不是一個強調用蠻力來狩獵跟戰鬥的種族


  從他們精良的裝備和那個隱身功能就知道


  在他們的戰鬥當中 謀略和戰術也是非常重要的一環


  而且他們強調透過狩獵來證明自己的實力


  結果現在卻連給證明實力的機會都不給


  就要把自己親生兒子殺掉?這怎麼想怎麼不合理


  如果真的容不下這個兒子


  直接逐出家族 否定身分


  再不然就像戴克他哥說的 就讓他去狩獵一次


  如果他真的是弱者 大概也就回不來了


  到底有什麼必要 要自己把兒子給做掉?


  在我看來 就是編劇偷懶


  懶得去想一個更有力的家族內鬥理由


  只想快速的樹立父子仇恨的基礎去發展劇情


  但開頭這段就真的讓人有點莫名




  再來就是那個冰凍手榴彈


  設定上會不會有點太逆天


  泰莎只是靠著幾顆從戴克船上撿來的冰凍手榴彈


  就輕鬆制服卡里斯克 甚至最後還來一波爆體反殺


  而且最不合理的就是


  明明終極戰士船上一堆冰凍手榴彈


  為什麼會說幾乎沒有Yautja人成功狩獵過卡里斯克?


  泰莎直接冰凍手榴彈丟過去就直接把它凍起來了


  然後你跟我說更擅長戰鬥的Yautja明明就有這樣的武器卻打不贏?


  這設定上也是擺明太過於草率



  最後就是戴克潛入威蘭河谷仿生人本營的橋段


  前面就已經有展示過


  仿生人經歷過的資料都會做類似上傳雲端同步的行為


  所以希亞的一切才會都被泰莎掌握


  結果你跟我說 他這樣一路潛行進去搞暗殺


  結果仿生人都完全沒發現 有同伴訊號丟失


  還一副什麼都不知道 傻傻在那被做掉?


  完全不合理


  而且仿生人的戰鬥方式應該會去偵測對手和環境狀況


  戴克設的那些陷阱在我看來不應該對仿生人有作用


  但看起來到這邊 編劇導演應該都已經懶得多想


  感覺就是在用一般人類的行為模式在寫這段


  並沒有真正好好思考和設計仿生人的戰鬥型態




  總之就真的不能去計較這部劇情的一些細節


  不然真的會很想吐槽


  但電影本身娛樂性是很高的


  尤其如果看4DX的話 效果非常好


  適合只想輕鬆看爽片的朋友


  --'
