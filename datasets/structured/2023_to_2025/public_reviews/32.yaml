content: '被板上前幾天的好雷文騙去看

  很失望

  好看的點是一開始兄弟在星球上對上老爸那段很有氣氛

  老爸朔造的很強 哥哥也是

  那段結束後就很期待弟弟的自我成長


  登入其他星球，一開始的怪物對戰很刺激（各種武器）

  結果從合成人加入之後整部就沒看點了

  打鬥有夠普

  怪物boss被劇情殺

  最終戰只能用0分形容


  有意願要看的建議等Netflex

  至少你可以中間暫停去看A片




  --'
