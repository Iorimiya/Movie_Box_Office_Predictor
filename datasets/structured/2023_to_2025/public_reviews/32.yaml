url: https://www.ptt.cc/bbs/movie/M.1762868748.A.9A4.html
title: '[好雷] 今年神片 終極戰士 殺戮星球'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  第一次體驗Ultra 4DX就獻給終極戰士：殺戮星球，

  效果真的太可怕，比我前女友的巨乳還要晃，真的晃到外太空。

  我還是第一次體驗到香味，不會到很強烈，但很有感。

  最後結局雪花紛飛搭配天降紙片的的效果實在太有意境了。

  我是坐第四排，兩旁的延伸銀幕會超出視線範圍，但我覺得還好，

  主要還是集中在中央的畫面。


  這次的終極戰士有別於以往的邪惡反派，塑造成有情有義的熱血男兒，

  彷彿在看日本JUMP漫畫，讓我雞動不已。

  艾兒芬妮的垃圾話時間雖然多但不會讓我煩躁，反而有種喜感。

  整部片的動作戲流暢至極，毫不拖泥帶水，而且沒有虎頭蛇尾，

  最後的父子決戰燃爆了。


  建議大家直衝巨蛋秀泰的Ultra 4DX就對了。



  --'
