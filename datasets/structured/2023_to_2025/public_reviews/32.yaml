  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  簡單來說，畫面好看劇情合理，不拖戲

  可以看到外星人vs怪物，有親情感動轉折搞笑，好電影的元素都具備了。

  爽感很夠，非常精彩。


  畫面偏黑，之後上串流用oled看一定超爽

  這部音樂也很勁爆，低音很足夠

  有機會可以看特殊廳，一定超棒的。


  絕對值回票價。

  當然一定有一些比較不合理的部分，但不誇張，完全是可以接受的，不會出戲


  --'
