url: https://www.ptt.cc/bbs/movie/M.1762596247.A.B01.html
title: '[好雷] 終極戰士：殺戮星球 Ultra 4DX'
content: '先衝IMAX爽一波大銀幕的震撼感

  畫面、動作都設計得很用心，看得心滿意足

  為了感受一下新影廳，直接決定去看Ultra 4DX二刷




  雷雷雷




  這部片真的就是來看爽的哈哈哈

  開頭主角兄弟的互搏、第一人稱搭飛船到殺戮星球

  一開場4DX的代入感直接把體驗拉到極限，會掉進主角的情緒裡

  IMAX確實在表現外星風景、生物的張力上很爽

  但動作戲的部分Ultra 4DX真的加分不只一點

  不是IMAX不行，是4DX更有性價比


  飛船出現時，椅子震動和音效的搭配

  真的會讓你以為自己就坐在那個船體裡，超有感

  印象比較深的有幾個

  風效：搭各種交通工具時會有風吹、砍脖子會有熱氣

  水霧：小巴吐阿終口水的片段（劇情上很重要）、濺血的片段也會噴

  椅子：因為移動的片段不少，臨場感很夠


  這部觀看性真的高又不用補前作

  要爽必選特殊聽，有機會可試試Ultra 4DX

  是有聽到其他人抱怨太晃，但跟畫面很搭算可以接受

  這部分就看自己評估了，要最大化體驗至少要看IMAX


  --'
