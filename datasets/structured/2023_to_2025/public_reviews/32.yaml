url: https://www.ptt.cc/bbs/movie/M.1763349655.A.C63.html
title: '[  雷] 從好雷變負雷的終極戰士：殺戮星球'
content: '不帶腦看完時確實覺得不錯

  受惠新的特效讓整體視聽覺感受大提升

  但想到1代的劇情後才發現好像又沒把終極戰士的精華表現出來


  防雷
















  最主要的點就是撿到哥哥的頭盔時

  我預期是會為了紀念哥哥戴上去殺入基地

  然後像1代一樣

  不斷切換頭盔特效和視角獵殺目標

  你都有靜音的生物肩炮了應該更適合獵殺啊

  所以獵殺交給終極戰士，過招體術給合成人提亞


  這樣既能滿足終極戰士的設定，會體術又會獵殺

  又能豐富感官體驗

  多種願望一次滿足


  結果頭盔特效只出現在開場那幾秒...

  對我承認我就是想看頭盔特效

  那個心跳音效和特效搭起來超帶感的好嗎

  而且那本來就是終極戰士的標誌性工具，是精華！

  是換成其他生物甚至人類都無法匹配的特徵！

  但導演卻選擇讓終極戰士扁平化

  變成新觀眾不知道特色，舊觀眾不買帳的尷尬設計

  所以後半段整體安排，尤其是小巴套路

  仔細思考以後覺得要扣不少分



  最後吐槽兩點

  裝逼打坐團殺合成人實在是很莫名其妙

  和星際寶貝般的小巴，跟窮凶惡極的星球氛圍完全不一樣，

  那個眼睛大到任何小生物都能毒啞他


  怎不乾脆也把叫聲改成“破麻你試試”來給觀眾笑一笑，

  而且長大後居然還是星際寶貝臉...有點出戲


  ----

  Sent from on my Samsung SM-S9110


  --

  我是覺得加新東西可以，但舊的好東西可以保留+融合，像阿終頭盔就很標誌性，而且非常

  好發揮。但我實在感覺不太出這集有什麼“新”東西，阿終跟人類太像，特色粗淺

  破麻你試試

  劇情安排讓阿終一開始就掉光所有的裝備只留一把刀，這種尼哥等級的開局就算了，好不容

  易拿到哥哥的頭盔還不用，真不曉得導演在幹嘛，頭盔特效+肩砲是阿終的標誌性特徵啊。

  現在想想應該改成大負雷了

  可以新加一個感應合成人的特效阿，原理隨便掰都好，這才是新舊融合的典範，早年的電玩

  還有感應異形的設計哦。

  我也覺得生物肩砲很不錯，用頭盔輔助瞄準，像螢幕準心一樣，阿終用食物控制方向，多酷

  ！

  以前沒寫死的東西都很好發揮，說穿了就導演沒創意搞頭盔特效，卻有精力搞星際寶貝臉

  頭盔以外的就地取材強化了終極戰士的狩獵技巧，確實很加分'
