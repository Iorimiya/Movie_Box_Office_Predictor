title: '[搶先雷] 終極戰士:殺戮星球'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  今天趕早場終於去看了終極戰士的最新作品，先歸納幾個重點。


  1.特效很不錯，營造了一個新世界觀，有異形工程師的影子。


  2.不是單純的爽片，劇本很有新意。


  3.其中的生化人應該是從異形地球接收來的。


  4.小怪很可愛。


  5.生化人有點嘮叨。


  6.片尾的伏筆應該有續集。


  7.女主有雙重人格 XD


  8.忘了補一點，一定要看IMAX版才過癮。



  總之就是二個弱雞闖新手村越級打怪，結果還跟怪物結成好友的故事，有飆出新意

  ，值得一看。


  --'
