title: '[ 好無雷] 殺戮星球是終極戰士系列之最！'
content: '剛看完，真的超讚，好看，至少95分！！


  這部應該是我看過終極戰士系列電影裡最精彩的一集了。全片全無冷場。看了這部就知道

  宇宙中比異形還恐怖的生物太多了。另外終極戰士對自己的兒子都那麼嚴格，難怪對人類

  更不可能會手軟。


  不過其實到了這部電影的時間點（電影中沒有說明確切的時間），人類終究才是最強大的

