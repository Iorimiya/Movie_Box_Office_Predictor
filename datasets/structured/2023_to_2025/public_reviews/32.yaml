url: https://www.ptt.cc/bbs/movie/M.1763119329.A.2AC.html
title: '[好雷] 終極戰士：殺戮星球二刷感想'
content: '一開始看IMAX，二刷選擇了4DX，真的很讚

  如果不是易暈體質，蠻建議可直衝4DX動作場面超加分

  還能跟小巴成為一家人XD（吐口水！）


  看完兩次，有幾個我覺得劇情設計不錯的地方

  一開始感覺戴克很努力要爭取到隱形斗篷

  也就是合格獵人的象徵

  但透過艾兒芬妮和小巴意識到不同概念的強大

  斗篷成爲這部電影裡實質的戰利品


  另一個就是半合成人艾兒芬妮

  除了打鬥戲外，其他段落也設計得很好

  像是兩手撐地來移動、被空拋上高處

  肢體動作的設計看兩次還是覺得很新鮮


  當然還是有一些美中不足的地方

  像是最後戴克與狩獵爸爸那裡

  如果場面更大更血腥一定更爽XD


  --'
