url: https://www.ptt.cc/bbs/movie/M.1763134846.A.574.html
title: '[負雷] 亂糟糟的終極戰士:殺戮星球'
content: "坦白說沉澱了滿久我才決定給負雷\n\n\n原因在於我看完預告算滿期待，但看完體感卻讓我十分困惑，然後回來發現滿滿好雷、2025最精彩、動作爽片\n\
  \n爆米花文\n\n\n但我卻看到瞇眼好幾次\n\n\n我十分確定那天是有充足睡眠沒加班狀況下去看的\n\n但好些時候我得強忍著不睡著\n\n這種讓我自身都困惑的感覺，讓我晚了幾天才打算來寫心得\n\
  \n最先有的體感，大概是：真的太暗了\n\n大部分打鬥幾乎都是在低明度下進行，實話來說看得挺吃力，我第一時間將看到瞇眼歸咎在這邊，裡面唯一讓我滿意\n\n的打鬥可能是開頭兄弟對打\n\
  \n再來到星球那邊感受就是一團亂了\n\n仿生人的女主，除了話很多外，坦白說感受不到跟主角真的有什麼相互成長的互動\n\n但這段過程卻又太像「人」的標準雙人、三人組合探險打怪的步調\n\
  \n至此已經讓我覺得「終極戰士」過去的神秘感已經完全可有可無，可以帶入任何外星人，譬如試驗室的太空浣熊\n\n雖然多少清楚這可能算是種轉型，但看到這邊我內心反而一直冒出想回去看初代終極戰士、異形戰場、甚至終極戰士團的念頭\n\
  \n其實到這邊都還能說是我對終極戰士風格轉變的排斥\n\n\n但以下就是真的覺得劇情真的處理的爛的部分了，我都懷疑我是不是不小心睡過去\n\n仿生人的姊妹情誼轉折的有點微妙，前面鋪陳仿生人橋段，卻很突然的姐姐就變成\n\
  \nBOSS的樣態，妹妹就跟終極戰士開始大殺仿生人。我不是說一定要到跟雷利史考特的大衛那麼哲學性思考啦\n\n但這邊仿生人劇情就看的覺得有點...嗯不知道在幹嘛\n\
  \n再來大概就是感覺得到板上也有不少人覺得困惑的最終父子戰，嗯到底在幹嘛？\n\n星球回來實際上也沒真幹什麼就突然能開無雙輾壓老爸了？弄掉兩個獵人了還被當廢物要\n\
  \n幹掉？\n\n以前那個連殺一隻異形，都會尊重你在你臉上畫疤、反殺終極戰士會送你槍的神秘、暴力、又帶著野性與驕傲\n\n的獵人種族呢...？\n\n\n總之大概就是這樣，如果要套用一句簡單心得，那大概就是鏈鋸人中淀治跟真紀真看的第一部電影吧\n\
  \n\n\n\n\n喔差點忘了，讓我確認犯睏不是自己錯覺，決定發心得文的其中一個原因，是當時後面一群男生離場時\n訕笑「...差點睡著...」\n--\n你說的是「劇情設定」，我說的是整體呈現調性。\n\
  打個比方，今天只看終極戰士1、2、地球戰場的人，和只看這部最新作的觀眾\n對終極戰士這種族的想像，很可能完全不同\n 這也是第一次拿阿終第一人稱視角吧？雖然知道是套公式，但就這樣直接套公式，看下來也真的\n\
  \ 是覺得沒什麼發揮感。就像前面說的：不如放隻實驗外星浣熊，最後讓它殺回實驗都比那阿終父子對戰來得有趣\n 就是一般的大場影廳，畢竟一般人看電影也不會刻意挑什麼廳\n\
  \ 就是這邊只用幾句帶過覺得滿可惜，那種差異怎麼出來、仿生人的變化，覺得沒做出來。會拿大衛比喻\n也是因為它腦袋趴帶趴帶這些變化是觀眾可以察覺出來，但姊妹的描寫感覺可以做更好的描寫\n\
  ㄏ 這年頭回文水準差的屁孩怎麼急著秀下限了\n 唉呀我聞到一股屁孩臭了，我記得批踢踢要成年人才能註冊呀\n 還是會覺得這邊的鋪陳可以更順暢點，話很多的妹妹給人很多仿生人可能性的遐想，但姐姐的表現\n\
  \ 卻變得很單純惡役樣\n 最暗果然還是AVP2\n 後來發現這代連獵人伏擊的那種緊張感都沒有\n 本來姊姊騙母親那邊還想說會不會有些些轉機，結果就是一路黑到底\n\
  \ 因為我比較喜歡恐龍(?)\n侏儸紀哥吉拉一類我都有粉絲濾鏡同情分(?)\n不過也像我開頭說的，我猶豫很久才給副分，對我來說花電影票錢進場看到想瞇眼是不被允許的，上一次有這樣觀影體感可是惡靈古堡拉昆市啊\n\
  \ 來來來 哩來，來討論劇情內容呀別噴一句就跑\n 上串流才會試試了吧，其實就像這整篇負雷文「暗」只是理由之一，但整體來說沒讓我有花錢二刷的動力\n 這種英雄旅程公式但也不是不行，但就是明顯到讓人馬上認出來套公式就實在...再加上原本許多阿終元素的消失，就會像你說的對老粉來說還真是怎麼看都不是滋味"
