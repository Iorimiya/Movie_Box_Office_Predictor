url: https://www.ptt.cc/bbs/movie/M.1762417370.A.EE1.html
title: '[普好雷] 終極戰士：殺戮星球 靈魂割捨與必要變'
content: '雷

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .


  從丹崔克坦伯格主導的前兩作終極戰士看來，在IP交至新東家後 這系列一直在摸索新方向


  更早之前終極戰士系列的影視作並不能說發展地很健康，很大一部分就是就是被既有的無情外星獵頭怪形象和狩獵遊戲被人類反殺的故事公式給綁住，但這同時也是粉絲最注重與愛好的「偶像」特色

  過去的《異形戰場》或是《掠奪者》都有試圖踏出這個塑像 但都因為戲裡外的各種因素導致嘗試失敗


  本次是第一部直接將尤特加人（Yautja這名字終於有正式譯名了）設定為主角並展開冒險的電影 ，在觀影前個人甚至很期待能看見過去未曾在螢幕上探討過的Yautja文化，可惜本片格局意外地小，這部分著墨幾乎跟過去的電影沒兩樣，甚至可以說只是在解決主角Dek的家庭情結


  這種好處是能將簡單的故事處理得細膩也觀眾能更容易共情，但同時也讓老粉就會覺得這要發展扼殺了終極戰士的特色，把整個系列導向了通俗化的道路 ，感覺就只是一年到頭數不盡的商業片中的分母之一


  Dek被迅速感化和被家庭雞湯說服或許還能用他自幼就是族中弱者和受到哥哥保護的人設來表現出他在真的是個比較特別的尤特加人

  但電影後段像是超聽話和默契超群的溶解液蛇（我忘了希亞取什麼名了）和輕易擊敗父親等過於御都合的發展都讓這片的庸俗感更強烈，現在回頭看《時空獵襲者》的二戰主角都體現了同樣的問題


  題外話丹導真的超愛手足糾葛，從《獸獵者》的Naru兄妹、《時空獵襲者》的武士兄弟，本片還直接出了兩對


  從過去導演和福斯總裁的訪談來看大概是想多在新作產出能讓觀眾在意其後續發展的角色，甚至還包括了過去的電影中只被當成樣板怪物威脅的非人

  在異形這塊從《羅穆路斯》的安迪、《地球》的混合人到本片中的希亞，都是比起過去電影更加有人性和主角格的人造人角色，本片結成的Dek族也是進一步證明，希望能讓A與P這兩個IP不在只是陷入蕾普莉、達奇上校和B級怪物的窠臼，再去發展新一代的《異形戰場》


  不過真要說這片要是撇開情懷依然是個各方面都表現穩健的科幻爽片佳作，有各式各樣的充滿記憶點的外星怪獸（玩具商樂歪了），又幾乎從頭打到尾沒冷場

  雖然貴古情緒那麼多 但平心而論這也是一個時代轉變 只要後續能繼續交出品質穩又有趣的作品倒也不是壞事 ，而且幾乎可以篤定能在未來看到女性的尤特加人在螢幕上登場了


  最後吐槽一下終極戰士現在最強的作戰武器應該是那顆冷凍球了，冰凍技術真不是蓋的

  -----

  Sent from JPTT on my iPhone


  --'
