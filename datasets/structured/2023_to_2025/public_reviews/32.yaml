url: https://www.ptt.cc/bbs/movie/M.1762423530.A.72F.html
title: 'Re: [普好雷] 終極戰士：殺戮星球 靈魂割捨與必要變革'
content: '其實我覺得這個劇本不錯啊，典型的雙重弒父（母）情結，無論對於希亞或德克都是。


  雖然德克到死亡星球殺怪是為了要向父親證明他不是弱雞，是個戰士，但後來他發覺自己

  真正的敵人不是怪物，而是那個嚴厲的父親，他一直活在父親的陰影下走不出來，甚至連

  累哥哥替他送死，但他後來覺悟，要成為一個真正的戰士就要戰勝自己的心魔，所以最後

  才會殺死父親並且成為一個真正的戰士。


  希亞也有同樣的問題，離不開自己的雙胞胎姐姐，其實就是母親的代表，最後因為德克啟

  發而掙脫束縛，甚至背叛母親和原本應該獵殺的對象成為好友，這些都是自主性的突破，

  讓自己成為一個完整的主體，而不是單純命令接受者，就一個商業IP來說已經有很大的突

  破了，不是沒有理由的亂殺，至於父親物理上強不強根本不是重點，因為那只是一個心魔

  而已，一旦跨越了就不是問題，他之前只是卡在自己的心魔而已，不是真的弱。


  方?

  無

  素?

  險

  這

  設?

  親

  ，

  色

  電

  的

  趣


  --'
