url: https://www.ptt.cc/bbs/movie/M.1763189471.A.7CA.html
title: '[雷] 終極戰士-殺戮星球 阿終vs荒野 '
content: "這次劇情大膽使用了終極戰士方作為主角視點，觀影上非常特別。\n\n主角是還沒有資格使用隱形裝置的young blood，作為Yautja一族也比一般成員瘦小。\n\
  不過從對話得知，他曾經在關鍵時刻救了比他強大的哥哥，兩人之間亦有深厚兄弟情。\n\n兄弟倆談笑間，青年Yautja透露出他想要將連父親都不敢挑戰的不死兇獸作為狩獵成年禮的\n\
  目標。\n\n可惜事與願違，奉行強者主義的父親認定Yautja青年已經沒有生存的權利，下令哥哥將其處\n死。\n下不了手的哥哥，只能啟動飛船將其救走，自己則命喪於父親的刀下。死前的最後一句話是\n\
  「將不死兇獸帶回來，證明你自己！」\n\n到達目的星球後，Yautja青年-戴克，才發現沒有人成功狩獵過是有原因的。\n這星球光是本身的存在都是極度的危險。\n\
  盤據在山頭的，是高聳入雲的巨蟲。\n樹林之間的藤蔓，每條都有的意識，會張開巨口捕食生物。\n甚至連路邊的草，都擁有利如尖刀的銳利葉片。\n在這個星球，他才是獵物。\n\
  \n\n在意外被路邊植物麻痺時（這星球連花開的果實都會射出捕食用的毒針….）\n遇上了威蘭集團的人造人提亞，她因為戰鬥只剩下上半身。\n提亞想要回到營地修復自己，而戴克能利用她對星球的知識存活下來並找到不死兇獸。\n\
  這奇妙的組合就此展開\n\n接著就展開了一大段貝爾vs荒野一般的野外生存戰，看的非常過癮。\n\n如峽谷中間有探出了一些蛇一般的生物，會追蹤路過的敵人射出砲彈攻擊，但只要給出果實\n\
  他們就會溫馴無攻擊性\n\n或為了進食，把目標轉向了一頭犀牛一般的生物，本以為很好解決，誰知道這生物只要把面\n部超厚重的盔甲一闔上，就成了無法攔阻的戰車。\n\
  \n甚至連樹上攀爬的，被提亞稱呼為「蟲」的生物，都是至少10尺以上的巨獸，好在最後與一\n頭小怪物共同合作，擊殺了這頭怪物。\n\n—\n\n最後，戴克終於遇上了不死兇獸。\n\
  一番死鬥後，他成功砍下了它的頭顱。\n但失去頭顱的身軀沒有倒下，不僅如此，還從斷面快速的再生，將頭顱接回。\n名副其實的，「不死」兇獸。\n\n正準備再次血戰時，威蘭公司的合成人殺到，將不死兇獸凍住，連同戴克一同，抓了回去。\n\
  \n原來提亞一直跟威蘭企業的網路連線，本以為在使用工具的戴克，實際上才是被利用的一方\n。\n\n泰莎，提亞的姊姊，與觀察型的提亞不同，是戰鬥特化的存在。\n\
  在檢視戴克只是有缺陷的Yautja族人後，無情的下達了處分的命令，而提亞則因為展現了不\n該有多同情，也同樣將遭到廢棄。\n\n好在戴克與提亞在誘使看守合成人將Yautja族的玩具開啟後，成功的讓戴克逃脫。\n\
  （這玩意竟然會把盯著看的人爆頭，Yautja族小孩平常到底都在玩什麼….）\n\n\n逃脫後的戴克，雖然身上沒有任何高科技武器。\n但憑藉著之前對環境的認識，成功的就地取材。\n\
  打造出了了一套充滿野性的生化鎧甲\n包含：\n盔甲犀牛製的面甲\n馴服後盤踞在肩膀上代替肩炮的追蹤小蛇（超讚超可愛）\n巨獸尖牙做的臂刃（單刃版）\n敵人靠近就會誘爆的詭雷植物\n\
  \n靠著前述裝備，打出了一場比前作獸獵者更狂野的酣快戰鬥，成功把泰莎擊敗。\n\n帶著勝利之姿，回到了父親的氏族，像他發起挑戰。\n戰技經過磨練的他，成功擊敗並斬殺了父親，為哥哥復了仇。\n\
  \n最後就是母親氏族的出現，為續集埋下伏筆。\n\n\n整體就像看了一集野外求生，不過是外星特別篇，非常爽快。\n\n\n--\nSent from my iPhone\
  \ 12\n\nPiTT \n\n--\n亞凱之神說:再買更多亞凱~!\n\n\n\n\n～(￣▽￣)～(＿△＿)～(￣▽￣)～\n\n--"
