title: '[負雷] 神秘感消失的終極戰士:殺戮星球 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  如果從來沒看過終極戰士系列的話可能是普雷~微雷


  原本想說當爽片看應該還行，但打鬥也很普，裡面也沒有創新的武器和生物


  一整個很失望，但女主角艾兒演得很不錯，只能靠她可愛和演技撐全場，正反都演得很讚


  原本是硬漢的神秘感外星種族終極戰士在這部變成一般的外星原住民


  故事就整個模板化的角色成長的故事，演出進程很有電玩感的安排


  最後在外星球上演終極戰士馴服了獵物的戲，真不虧是迪士尼.....


  從頭到尾完全破壞了我認知的終極戰士.....


  電影開頭沒多久一開口講話的終極戰士讓過去那種外星戰士的神祕感蕩然無存


  後面需要援助的時候只能傲驕的說我只是把你當工具，才沒有要跟你當夥伴哩


  這部的終極戰士特殊化妝塑膠感有點重，髒辮太乾淨，總之跟我印象中的終極戰士


  相去甚遠了，不過看之前我也沒多期待，沒受傷害。


  版上大多好雷讓我非常驚訝，目前IMDB也有7.5


  但如果你從來沒看過這系列的話應該還是能接受吧?


  看來我的觀感也逐漸跟大眾離去成為少數了~



  --'
