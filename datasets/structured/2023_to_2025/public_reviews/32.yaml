url: https://www.ptt.cc/bbs/movie/M.1763261802.A.49D.html
title: '[好雷] 終極戰士殺戮星球'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~










  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  防雷






  終極戰士電影終於有一集是用阿終當主角


  AVP雖然阿終也算友方


  但敘事的主角還是擺在沒甚麼戰力的人類


  故事一開始就演主角兄弟在做訓練的打鬥


  哥哥酷威已經是老獵人


  弟弟戴克則是還沒考過試的菜比八


  從對話可以得知哥哥有在隱瞞一些事


  老爸登場後揭曉


  就是家族要哥哥處決廢物弟弟但哥哥不想的老梗套路


  不得不說老爸氣場表現很好


  老爸的面具跟家族特有的電熱刀真的很帥氣很加分



  接著就是攻略高難度星球的部分


  戴克真的很菜


  在一開始清點裝備的時候就被雜魚藤蔓搞到裝備幾乎丟光


  還好在爆炸仙人掌的區域遇上了女主角合成人希亞


  知識型合成人真的是彌補多數死腦筋尤特加人的缺點


  沒有希亞的知識幫忙


  戴克在星球上不知道可以死多少次


  半身的希亞真的很可愛


  一路上很碎嘴卻不會讓觀眾感到煩躁


  而且也讓戴克開了不少金口


  以往終極戰士多是戴面具的無口反派


  就算有台詞也沒多少句外星語


  這集一堆尤特加語的對話感受是挺星新鮮的(動畫跟獸獵者沒看不知道有沒有說錯)



  劍刃草原的狩獵


  大概這是電影中戴克最帥的橋段


  尤其是對希亞說兩次你放棄的太快了


  那時的戴克真的會有醜臉外星人變成帥氣外表的大叔的幻覺


  這場狩獵還認識了第三位夥伴小巴


  不過他的戲份大多是賣萌跟搞笑


  小巴也在狩獵鐵甲獸跟吐口水在戴克身上時


  多少就能猜到他的身分


  畢竟也算是有點老梗的設定




  電影大約演到中段時


  希亞認定的姊妹泰莎登場


  泰莎跟酷威一樣救了自己姊妹嚴重破損


  連剛甦醒時也是在關心希亞的下落跟安危


  但在被告知再失敗就會被報廢就變了


  這邊大概想演出戴克兄弟跟希亞姊妹的反差


  但泰莎有點變太快


  只能理解說因為是合成人


  前面會捨身救人是認為自己不管怎樣都會被修好


  但聽到會被報廢掉就改變想法


  甚至認為逐漸衍生出的姊妹情感很危險




  在劇情中最慢登場的就是不死兇獸


  雖然再生能力誇張到破格


  但以星球主宰的魄力來說感覺有點不夠


  有一種叫巨石強森來也能跟他五五開的錯覺




  整部電影至少80分


  雖然都是老梗很好猜的橋段


  但熱血、搞笑、打鬥都有滿足到觀眾


  劇情的編排上


  即使一集前作都沒看過也能看得很流暢


  也不會因為要吸引新粉


  讓老粉覺得品牌的味道全變調


  而且因為沒有人類


  所以再血腥都不算R級


  希樣下一集也這樣


  這種電影常常被所謂的人類方劇情扣分


  希亞跟戴克講到狼這個族群的時候


  不免想到AVP的終級戰士孤狼


  以孤狼可以輕鬆手撕異形的實力


  這顆星球他也能獨自攻略吧


  而且孤狼看起來是會先做功課


  並非那種死腦筋一下就老馬死掉的終極戰士



  說一下個人覺得的缺點或不合理處


  戴克跟希亞一起上路後


  不是先去找到酷威的飛船補給裝備


  合成人被降智跟降等不少


  而BOSS不管是不死獸、工程機器人


  展現的魄力都有點不夠


  老爸雖然夠帥


  但最後決鬥太短了


  而且老爸還是跟開頭一樣只會開隱斗


  沒有把阿終的武器都秀出來


  真的是對不起他那帥氣的面具




  最後看起來應該是會有劇情連貫的續集


  除了AVP那兩集外


  終極戰士每集都只是同世界觀


  劇情幾乎沒有關聯


  這次用終極戰士、合成人跟小怪獸組成的星際異攻隊(?)真的挺不錯的


  差點忘了說


  運用從希亞那聽來的知識就地取材做裝備也是很讚


  有其那個偽刺蛇的感應炮


  可惜蛇蛇幫戴克擋下真感應炮時捐軀了


  這段感傷程度堪比開頭哥哥犧牲斷後那邊


  --'
