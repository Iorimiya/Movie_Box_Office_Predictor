content: '這系列的電影都有看過，就趕著第一天去看啦！


  以下簡單條列式感想


  優點


  一、劇情簡單好懂，平鋪直敘、沒有深奧的大道理，爽就完事了。


  二、菜鳥掠食者跟話嘮女主的部分還算有趣，不會給人尷尬的感覺，跟小巴的互動也不錯

  。


  三、掠食者一樣濃濃的野蠻殺戮感！


  四、星球的設定相當不錯，充滿血腥與科技感，感覺還算用心。


  五、前半段的戰鬥相當不錯，光是在白天廝殺就可以大加分。


  六、蛇蛇好收買又忠心，幫QQ


  缺點


  一、後段的幾機械人大戰有點黑漆漆，有點可惜。（致敬異形2）？


  二、這次的掠食者感覺沒前幾部的這麼帥。


  整體而言可以給80分的爽片！


  --'
