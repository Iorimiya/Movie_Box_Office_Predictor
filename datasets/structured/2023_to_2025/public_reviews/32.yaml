title: '[新聞] 《終極戰士6殺戮星球》首波評價出爐：'
content: '《終極戰士6：殺戮星球》首波評價出爐：血腥銳減，意外搞笑！動作戲更多更狂、但劇

  情恐惹毛粉絲




  （圖片來源：二十世紀影業）


  《》（Predator）獨立系列的第六部真人電影作品《》（Pr

  edator：Badlands）即將從下週三開始，陸續登陸各國院線，近日已搶先看完正片的媒體

  和影迷們，則率先在社群平台分享了自己的第一手觀後感，而截至目前為止，《

  》大致上仍保持著丹崔克坦柏格（Dan Trachtenberg）導演操刀的上一部《

  》（Prey）奠定的好評勢頭，儘管不乏少量的輕微批評，但整體而言是正面迴響居多

  。




  「《終極戰士：殺戮星球》實實在在證明了丹崔克坦柏格是《終極戰士》系列的遠見先鋒

  ，他每拍一集，就會突破一次本系列的極限，在動作、恐怖、科幻 / 奇幻冒險的類型轉

  換之間游刃有餘。

  崔克坦柏格在這部電影裡大膽嘗試新事物，雖然有時過於迎合家庭觀眾的口味，但總體而

  言，他交出了一部不僅拓展《終極戰士》的神話，且兼具炫目動作設計的電影，艾兒芬妮

  和迪米崔斯舒斯特柯洛艾馬泰米（飾演主角終極戰士德克）的表演也超棒，兩人都傾力奉

  獻出頂級水準的雙人搭檔表演。」


  「《終極戰士：殺戮星球》是一趟讓你時時刻刻保持警覺的驚險動作之旅，也是一部包裹

  著本系列一貫殘酷血腥的「非血緣家庭」式動作冒險。崔克坦柏格自信地繼續將《終極戰

  士》世界觀打造得引人入勝，而艾兒芬妮則是魅力四射（也恐怖得叫人發毛！）」




  「很高興看到我的一些《異形戰場》粉絲朋友、以及其他影迷，終於有機會觀看《終極戰

  士：殺戮星球》。我真的覺得這部電影很棒，和這系列的其它電影截然不同（而且是很精

  彩的不同）。迫不及待想看到它幾週後大規模上映了。」


  「《終極戰士：殺戮星球》是一部發生在宇宙的夥伴公路電影，分秒都是精華，毫無贅戲

  。丹崔克坦柏格巧妙將這系列的規模推向更宏大的境界，而不僅僅是一部生存恐怖片。它

  或許不像之前那麼血腥，但我還是很享受。」


  「丹崔克坦柏格執導的《終極戰士：殺戮星球》是一場帶領我們深入認識終極戰士神話的

  史詩奇觀。 這集比傳統的《終極戰士》電影更具科幻史詩感，它採取了某些大膽嘗試，

  但並非總是能奏效。而儘管它採取了大膽嘗試，但《終極戰士》系列的新世代粉絲們最終

  可能會感到失望。」


  「《終極戰士：殺戮星球》真是太讚了！動作戲創意十足，喜劇橋段很自然，故事情節也

  讓我完全沉浸其中。丹崔克坦柏格繼續精準命中本系列的各種要點，令人深感欽服。」


  「《終極戰士：殺戮星球》是《終極戰士》系列中非常瘋狂的新章，丹崔克坦柏格為這宇

  宙帶來了更多驚險動作場面，即便這部可能也是他迄今在這系列中水準最弱的作品。這是

  迄今為止動作場面最豐富的《終極戰士》電影，其中一些場面就如你所料的那般殘酷，而

  其它某些戲碼則更依賴片中融入的喜劇元素。


  《殺戮星球》對《終極戰士》系列進行了很有趣的新詮釋，但並非每種詮釋都有發揮出應

  有效果。這部電影時而感覺有點像《曼達洛人》，不過當它表現精彩的時候，就真的是非

  常精彩。」


  「初步的《終極戰士：殺戮星球》感想：完完全全的黑馬漫畫風格，擴展宇宙的粉絲們會

  非常享受這部。它更著重冒險 / 奇幻的路線，也充分體現了終極戰士這角色在故事類型

  上靈活多變的可能性。


  配樂中的合唱 / 吟唱環節堪稱一流。我喜歡德克和席亞之間的互動，也超級喜歡艾兒芬

  妮。迪米崔斯的表演非常精彩，德克一路帥到尾。不過，我覺得《終極戰士》一、二集的

  鐵粉可能不會認可這部。不是想吹毛求疵，但毫無疑問，片中也有一些缺點，我會在 11

  月 04 日之後寫出更深入的文章研究這些問題。不過整體來說，《終極戰士：殺戮星球》

  我看得非常開心！」


  （圖片來源：二十世紀影業）


  《》依舊由崔克坦伯格與《》的共同編劇 派屈克艾森（Patrick Aison）

  合寫劇本，時空設定在近未來，（Elle Fanning）則飾演來自《》（Alien

  ）系列的新「」角色，一台出自「」公司生產的型號。


  這是繼《》（Alien vs. Predator）系列之後，兩大外星怪物 IP 睽違已久的再

  度連動。


  本片的主角阿終「德克」則由迪米崔斯舒斯特柯洛艾馬泰米（Dimitrius Schuster-Koloa

  matangi）扮演。


  芬妮雖是其一主角，但全片敘事的主觀視角，會首次挑戰改從德克的立場出發。


  《》北美排定 11 月 07 日上映，台灣則於 11 月 06 日搶先登場。



  文：Joker



  新聞網址：





