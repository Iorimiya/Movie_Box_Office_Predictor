url: https://www.ptt.cc/bbs/movie/M.1762458293.A.74E.html
title: '[好雷] 終極戰士：殺戮星球'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  先說結論，比《獸獵者》好看。


  算第一次深入阿終的文化來講一個年輕戰士在家族糾結中求生的故事。


  但也不得不要吐槽一下阿終這種文化要怎麼生孩子？家庭問題特別的多……

  也證明不管哪種文化都有老人和年輕人對立問題。

  開場對尤特加星球世界描寫不看標題會以為是星際大戰，但其實也還可以。


  艾爾芬妮一人演兩角（YT上的預告應該不難看出來）

  提亞是和主角合作夥伴，但有90%時間都是上下半身分離狀態。

  泰莎是忠實執行母親指令的同型姐妹，擔任反派。

  兩角表現都令人激賞，也不會因為其中一角反派就失去詮釋的深度。


  而殺戮星球的部分，在電影半前段觀影時有一點覺得營造太過，但全片看下來

  因此是沒什麼冷場的，而星球各種掠食動植物的設定在後半近決戰時也有產生

  類似伏筆回收的效果。


  後半場提亞的遠隔兵器打架非常有趣甚至有很邪典的效果。


  幾個缺點：

  配樂沒什麼存在感，隨著動作和劇情的低音音響效果很好但沒有主要旋律，散

  場後沒有相應的場面記憶點。

  設定上由於不知道和異形相對的年代，但無論如何威蘭公司在本集的科技力對

  比異形系列真的有點過度超前，光比美第五元素的多用途步槍就覺得異形系列

  的海軍陸戰隊變得弱化不少，另外例如透明螢幕和未來極簡界面字體，和

  MOTHER說話的畫面，也和異形系列的美術對不上去。

  （科技力有點強到我覺得威蘭不用拿阿終的科技也弱不少多少吧）


  雖然是看動作片，但隱約也覺得，即使作為異形系列的補充或對接，也少了很

  多東西。

  尤其阿終的文化設定上，開頭說都是單獨狩獵，多少有點排除幾年前異形戰場

  系列的味道。

  在終戰演完前的「頭靠頭大和解」有一點著力過深。

  最後阿終仰賴紅外線視覺和聲波再靠裝備補正的的特色只有開頭帶到，後面就

  全沒有，雖然終戰的整備有點致敬阿諾第一集（就地取材），但這個特色就拿掉太多

  還是有點可惜。

  個人以為終戰前段這個靠紅外線「獵+殲」的傳統特色如果有呈現會更出色。


  幾個小心得：

  有異形2巨大彩蛋，而且大到有點變巨蛋的程度。

  從結尾看如果有續集應該是，這個阿終家裡還有媽媽以及兩個妹妹要相殺（喂

  （從結構上來說片尾帶出的伏筆反而有點多餘）

  劇情蠻有趣的，要簡化就是被認為是家族弱者的年輕人出去闖蕩帶回一個機娘

  老婆和異世界魔獸。

  當威蘭公司生化人真可憐，不是超時工作被搞壞就是要退役，難怪普羅米修斯

  的大衛要叛變。


  --'
