url: https://www.ptt.cc/bbs/movie/M.1762572570.A.2D3.html
title: '[好雷] 終極戰士：殺戮星球'
content: '各位異形宇宙粉絲們大家好


  昨天我去看了這部殺戮星球


  好看是好看的，但是我是來吐槽的


  德克酷威兄弟才是長久以來影迷心中對終極戰士

  的形象

  他們的爸爸根本是家暴犯，不是大家認識的阿終


  合成人小嘍嘍也太弱了，一開始出場很強，各種開掛自瞄，怎麼面對主角群又變白痴一樣？

  一個被打正常邏輯是所有合成人都知道了，哪可能像人一樣被各個擊破。


  然後我發現


  阿終是邊緣人


  泰莎也是邊緣人


  小巴也是邊緣人


  整部片就是邊緣人的故事


  全劇終







  補一個


  到現場才知道有三張海報，我原本只有IMAX電影票，所以只能拿一張，後來又多買兩張票，拿了另外兩張當收藏。其實看完電影蠻開心的。





