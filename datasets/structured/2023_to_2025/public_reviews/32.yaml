url: https://www.ptt.cc/bbs/movie/M.1762448087.A.B19.html
title: '[好雷] 一點都不終極戰士的終極戰士:殺戮星球 '
content: '雷文防雷資訊頁
















  ~


  *-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  個人擔心的事情真的發生了，那就是這部片成為一點點都感受不到傳統終極戰士感的終極

  戰士電影。


  如果各位有玩過緋夜傳奇(TOB)的話，基本上就是我對這部片的看法了。緋夜傳奇是一部

  不太典型但又跳不出框架的王道RPG，大多數網路評論都認為"主角不是傳統代表正義的一

  方，反派才是比較代表正義的一方"。但至少我很不認同這樣的評論，因為到頭來，主角

  終究是相對正義的一方，即使他們身分特殊，但是他們一不燒殺擄掠二不偷搶拐騙，最重

  要的是他們跟人類比較類似井水不犯河水的關係；反派也始終是比較邪惡的一方，因為他

  們畢竟比較專制且想要讓關係近的裙帶關係壟斷權力。


  這部片大多數預告我都沒有仔細看過，這是我對一定會進戲院看的電影保持的個人習慣，

  但還是看到一段人造人有跟終極戰士有溝通的橋段。如果當終極戰士是以頻繁溝通來推進

  劇情的話，那勢必不可能是前面終極戰士作品中，營造出神秘與強大，讓觀賞體驗代入主

  角，相對弱小而感到壓力。


  我不否認"老終極戰士"絕對不是每一部都是大眾會喜歡的，但我就是喜歡，老終極戰士沒

  有任何一部有辦法跟常常被湊作伙的異形來比，無論是藝術性、敘事性，異形很像是以前

  藤子F不二雄的大長篇，縱使現在看來有點過時，但當代人類不斷追求科技下，這些藝術

  性與商業性兼具的作品確實能帶來一些反思。


  "老終極戰士"給我的感受就是像一張遊樂園門票，你在期間拋開各種求真並且拒絕對細節

  吹毛求疵，那就能充分享受一段"歡愉"的時光，就這點而言，就是我一直比較喜歡終極戰

  士團、掠奪者更勝過阿諾終極戰士的原因，當然阿諾終極戰士也很棒，但就一個遊樂園而

  言，當然會更沉浸在特效與科技更新潮的樂園中。


  終於可以回到正題了，發牢騷這麼久，這部總結就是，主角團並非絕對的善類，一開始也

  都是為了個人利益而前進，結果跑到一半開始竟然變成了王道劇情，你以為的BOSS不是真

  正的BOSS，然後真正的BOSS(至少這部片前期出現的)也在一部電影內清楚交代並結局掉。

  最後留下一個愛怎麼展開就能怎麼展開的伏筆的，可以看市場反響隨時決定下個作品要怎

  麼安排。


  我個人認為王道劇情很像是滷肉飯或爌肉飯，你很難吃到難以下嚥的王道劇情，但談起第

  一名、非吃不可也很難輪到他。即使這個王道劇情不是太典型，還是如同前面說的，相對

  正義的一方有美好結局。


  雖然整體而言，這部片真的是我今年最喜歡的電影，但就像是我期待的暴力驚悚主題樂園

  突然變成了溫馨親子風格，雖然好玩，但個人私心還是希望－這部好片可以有單獨路線發

  展後續，而類似掠奪者、終極戰士團的屠殺片也可以成為平行作品同時發展。


  --

  這塊地本來是風水先生的，後來用很多錢將它買下來了。

  只是利誘？有沒有威逼？

  我看一定是威逼，不然絕不會這麼害你們，還讓你們將水泥蓋在整個蜻蜓點水穴的上面。

  應該雪花蓋頂，棺材頭碰不到水又怎麼能叫蜻蜓點水呢？他還算有良心讓你二十年後起棺

  遷葬，害你半輩子不害你一輩子，還你一代不害你十八代。

  蜻蜓點水一點再點，肯定不會點在同一個位置上，這個穴不能再用了。


  --'
