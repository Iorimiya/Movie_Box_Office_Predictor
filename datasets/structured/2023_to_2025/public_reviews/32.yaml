url: https://www.ptt.cc/bbs/movie/M.1764313682.A.09C.html
title: '[討論] 殺戮星球一些地方很好奇'
content: '最近新片不少，終極戰士的場次已經不多了

  感覺最近大家都是去看動物方城市

  趁還有場就趕緊先補完終極戰士

  動作跟特效都很不錯，劇情有閉環很讚

  幸好有進場，這種爽片就是要在大銀幕看

  --------------防雷-----------------





  有幾個地方有小疑問

  1.戴克爸爸為什麼一定要殺他哥

  那段張力滿強的，但原本以為只會砍手而已

  沒想到直接斬首，終極戰士的家教一直都是這麼硬核嗎？


  2.小巴的真身

  大家都是從吐口水的橋段看懂小巴的身世之謎

  但小巴打獵的獵物就是卡里斯克的食物

  其實堤亞更早就有認出來吧


  這部的角色曲線真的不錯

  主角團的設定都滿圈粉的

  堤亞出模型會想買那種

  (前提是可以上下分離）


  --'
