content: '雷文防雷資訊頁









  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~









  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  不得不說 本來以為可能跟前幾作一樣 沒想到好看到出乎預料


  其實片名應該叫 終極阿弟:異星認親 (誤!


  看的出來本片跟異形是同一個宇宙

  女主角是合成人 也隸屬威蘭湯谷公司 會流白色的血

  為了尋找外星球強大異形 然後帶回地球研發成生化武器


  男主是個阿弟 但是太弱要被父親除掉 阿哥為了救他被老爸幹掉

  從此阿弟踏上證明自己之路 要去幹掉連父親都贏不了的 kahlisk

  來證明自己最強


  這片我覺得好看的點就是這個異星球的特色拍得非常好

  什麼月蟲 口水蛇 剃刀草 毒針花 飛龍丟石(?


  口水蛇最後為了阿弟而送死 我都快噴淚 (???

  口水蛇真是義氣!!!


  然後女主上半身跟下半身可以分開打鬥 非常有趣


  一開始遇到的光頭猩猩 (?

  本來以為是個來搶食物 跟來亂的廢柴

  沒想到是 kahlisk 的兒子


  後面打 kahlisk

  kahlisk 連頭斷了都能再生回去 實屬作弊!

  沒想到最後還是有辦法冰住帶回去


  主角阿弟最後還跟女主還有阿猴 組了個三人團隊


  雖然整片沒有人類, 但劇情發展意外的有趣


  我很期待這三人組出續集!!! XD



  --'
