title: '[新聞] 終極戰士殺戮星球全球首週破8000萬美'
content: '《終極戰士6：殺戮星球》好評熱烈、票房也亮眼！全球首週破8000萬美元、創全系列

  最高紀錄




  圖片來源：二十世紀影業）


  《終極戰士》（Predator）獨立系列第六部真人電影《殺戮星球》（Badlands）上週末登

  陸各國院線，不僅收穫了熱烈的正面口碑，也開出不俗的票房紅盤，光在北美地區，首週

  末就累積約 4000 萬美元，既榮登當週的票房冠軍，也超越《異形戰場（Alien vs. Pred

  ator）當年的 3890 萬美元紀錄，成為所有《終極戰士》相關電影中的北美最高開片紀錄

  保持者。




  （圖片來源：二十世紀影業）


  海外方面，《殺戮星球》同進帳 4000 萬美元，加總起來後，全球首週共計 8000 萬美元

  ，這也超越 2018 年《終極戰士：掠奪者》（The Predator）原本創下的 7350 萬美元紀

  錄，成為全系列最佳的全球開片成績。


  由於近期的前兩部《終極戰士》電影《終極戰士：獸獵者》（Prey）和《終極戰士：時空

  獵襲者》（Predator：Killer of Killers）都是直接串流發行，因此有些人擔心，這會

  減損《殺戮星球》在院線的吸引力，但《殺戮星球》用實力證明，觀眾仍然願意進戲院捧

  場。


  文：Joker


  新聞網址：








  --'
