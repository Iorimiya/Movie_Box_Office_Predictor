url: https://www.ptt.cc/bbs/movie/M.1764508939.A.9BF.html
title: '[好雷] 終極戰士：殺戮星球'
content: '防雷





























  不管是異形還是阿終我都很愛,只是愛的點不太一樣

  異形最讓我振奮的是其神秘感和恐怖感

  阿終則是滿足我內心的嗜血慾望

  能夠殺的夠爽對我來說就是ok的了

  就連2018的掠奪者我也看的很喜歡

  只是他真的邏輯太太太瞎了

  我當年就覺得這麼危險的外星生物

  你他媽就只把他簡單綁住,醒了還去徒手想壓制他？

  其他集我也都喜歡,評價偏低的終極戰士團也是

  那個狂戰士我覺得很帥,鷹面也很酷

  而這次的殺戮星球如何呢？


  我覺得還不錯啦,但這個還不錯裡面我有一些話要說

  從過往系列看到這集會發現這次轉型的很明顯

  光是讓終極戰士講很多話就是個很新的嘗試

  還有導入公路電影風格的劇情

  這些是這個系列正在經歷變化的節點

  有些人可能看了會覺得不習慣甚至不接受

  我個人也比較喜歡以前那種風格

  但我更認同需要轉型,因此這樣是合理可接受的

  他就是呈現了新的面貌給我們看


  然後艾兒芬妮是一定要提的吧！

  當她宰掉外星生物再淘氣般出現在眼前

  幹你娘真的是婆到一個不行,根本戀愛了

  況且她也真的是這部電影最大的支柱

  生化人姐妹之間的衝突丟出了忠誠與否的問題

  冷豔的她我也很可以啦,幹拜託來抓我

  後面她操作機甲也超帥,比異形2更有氣勢


  整體而言是好看的,我也支持這樣發展

  只是還是喜歡以前血脈賁張的風格

  這次我認為沒有像以前這麼爽

  而且我很想吐槽那個冰凍球也太強了吧！

  我還是喜歡以前的武器,腕刀和飛鏢缺一不可啊！

  期待續集啦,這個導演我覺得不錯

  獸獵者我也很喜歡,找時間該來補動畫了


  ----

  Sent from  on my Samsung SM-S9280


  --

  要是人生有五次就好了。

  這樣的話我五次都要住在不同的地方

  五次都要吃不同的東西吃的飽飽的

  五次都要做不同的工作

  然後五次都要，喜歡上同一個人


  --'
