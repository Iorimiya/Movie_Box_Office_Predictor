url: https://www.ptt.cc/bbs/movie/M.1762713368.A.0DB.html
title: '[無雷]秀泰4DX終極戰士:殺戮星球心得 '
content: '無雷如題


  終極戰士:殺戮星球這部劇情並不複雜


  老嫗都能解


  所以不講劇情


  否則去電影院看都沒亮點


  來說說武戲給我的感覺


  不同於港片如舞蹈般的動作設計


  這部的打戲更強調硬幹 沒有什麼花拳繡腿的動作設技


  一切的戰鬥技巧都來自你本身的力量、速度所發動


  每一幕都是拳拳到肉 處處充滿著血腥暴力


  很有戰神奎爺的戰鬥風格


  再來說說秀泰4DX的心得


  首先它的螢幕並不大


  但分左中右三個有點像ㄇ字型呈現


  導致你視覺上包覆感很重


  很像身在其中


  再來是風效


  個人覺得風力OK但很涼 夏天吹會很爽


  另外還有彩花砲的效果由上往下射


  搭配著電影角色被炸成灰時用XD


  然後大火燃燒時


  你座位後頸部區會吹熱風(威秀沒遇過?)


  味道方面我除了聞到萬金油的味道外


  好像真得有聞到其他香味


  椅子的震晃度也不錯


  噴水噴氣的效果也是應有盡有


  只是不知道有沒有像威秀一樣有些電影有附眼鏡觀看3D的效果?


  總之是一個很棒的體驗


  只是票價有點貴


  以上心得分享給版友


  謝謝



  --'
