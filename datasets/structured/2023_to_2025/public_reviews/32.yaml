url: https://www.ptt.cc/bbs/movie/M.1762407078.A.88D.html
title: '[普好雷]  終極戰士  殺戮星球'
content: "雷文防雷資訊頁\n\n\n\n\n\n\n\n\n過了這麼多年，我們終於能聽懂終極戰士語言（基本上當一般外語聽就好\n\n\n劇情簡單明暸：\n\
  主角戴克是他們家族中最弱的，爸爸要把他剷除掉，哥哥酷威為了戴克犧牲自己被殺掉，隨\n後被飛船強制載走直奔干納星（電影裡主要場景的星球名\n\n雖然劇情設定是終極戰士沒朋友沒感情，但還是能從表情上看出哥哥擔心弟弟，在他們父親\n\
  到來前哥哥要弟弟選擇要去的狩獵星球，弟弟直接選了個最難的被否定\n\n也因為兄弟情，主角戴克的目標就變成活著從狩獵場回來並向他的父親復仇\n\n\n動作場面體感約6-7成，片長107分鐘算緊湊，干納星的生態是真的危險，威蘭湯谷公司也因\n\
  為如此而只派合成人到這顆星球（題外話這應該代表他跟異形同宇宙），星球上的生態也是\n充滿危險，前半段幾乎遇到的6、7種動植物都想殺死主角們\n\n合成人劇情的部分比較少，主要合成人希亞為了找到她的姊妹泰莎（一樣是合成人，雙方因\n\
  為任務失敗分散）而跟戴克合作\n\n\n劇情因人而異，整體對我而言算是及格的爆米花電影\n\n分級是輔導級，沒有人類被殺害，合成人都是流白湯，少了點刺激感\n\n\
  \n----\nSent from \n\n--"
