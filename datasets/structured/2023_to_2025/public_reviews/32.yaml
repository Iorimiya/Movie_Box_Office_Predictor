url: https://www.ptt.cc/bbs/movie/M.1762758117.A.E0B.html
title: '[普雷] 終極戰士:殺戮星球  不失為爆米花爽片'
content: '可是評價那麼好 甚至有些YTer影評也大好評 有些不解XD||


  個人對終極戰士電影系列"幾乎"都看過


  大致上評價為:1>獵獸者>動畫殺啦殺>本片>AVP1 >> 其他,有些甚至記不起劇情


  會讓阿終影迷驚喜的大概是本片給出惹不少設定


  有些好像是連動漫畫就有暗示的


  ..但好像也是這些突破,讓窩感到些失望..


  (防雷頁)


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  主要是戴克(什麼瓦人的設定,看完也忘惹)性格實在跟過往好幾部阿終電影差異甚大,

  甚至可以說是個異類;


  人類方的合成人 希亞&泰莎 也是,合成人居然產生擔憂自身死活跟對他人的憐憫,

  窩看這科技線應該遠超於異形前傳,除非韋蘭湯谷沒從大衛事件吸取教訓,就是劇情有問題


  又或者合成部隊可以秒燒讓戴克吃足苦頭的森林,後期卻被戴克一人+一蟲大批秒殺


  帶惹一堆裝備,包含那把屌爆的光線弓,卻在新手森林幾乎全數丟光xd


  上頭講惹一堆好像都是吐槽,可是本片還是值得進場一看,..雖然近年看這些片時,

  不免邊看邊腦內坐想這些都是綠幕動畫...有點煞風景


  個人還是希望異形那端的世界觀能夠更加完善的設定,再跟這裡搭上線比較好..



  然後最後再吐槽一大點,  本片非R級,好像是沒人受傷或死亡,也就是沒噴血啦


  可是ma 紅血跟合成人組織液跟阿終綠血,終歸都是特效顏色


  這樣能過關,窩覺得是片組對分級審核的一大諷刺做法XDD  這招厲害www

  --'
