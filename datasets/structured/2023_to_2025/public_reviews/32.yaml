title: '[好微雷] 殺戮星球 保護比狩獵更強大'
content: '衝了第一場的IMAX，特效跟動作戲拳拳到肉

  有大銀幕加持觀看的爽度拉高不少，真的要多爽有多爽

  劇情的部分簡單好懂，主要勝在故事流暢+不拖戲

  這群外星怪獸新設計也很有巧思


  以下有微微雷




  以阿終為主角的成長曲線處理得蠻好的

  聽他哥哥對他說的Not yet (你還不是戰士)

  後來自己說Not yet，最後默認希亞稱他為戰士


  從自稱戰士想獲得認同到受挫承認自己還不夠格

  漸漸到能保護隊友，明白自己是優秀的戰士

  丹導處理到位，角色刻畫外，所有戰鬥場面給滿給爽，看得很入迷哈哈


  完全不需要了解這系列就能觀看的大爽片

  艾兒芬妮一人分飾兩角的部分也是大亮點

  不愧是童星出身，老會演了

  要高冷有高冷、要可愛有可愛，兩個願望一次滿足

  真的超讚...


  阿終先不說，艾兒芬妮上下分離的打戲現場有人看到驚呼

  以爽片標準來看娛樂性高，有不少畫面看特殊廳一定爽

  但如果要看IMAX誠心建議挑一下影院XDDD


  --'
