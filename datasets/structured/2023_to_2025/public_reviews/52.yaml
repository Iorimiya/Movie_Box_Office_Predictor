title: '[請益] 提姆波頓之地獄新娘'
content: '非常喜歡的一部動畫片，一如提姆波頓其他作品，陰暗、驚悚式的哥德風，片中許多巨大

  的反差；生與死、光與影，製造出獵奇、恢諧的段落，舞台劇式的演出穿插，強大的動畫

  表現出提姆大師的一貫風格。


  想請教的是，女主角艾蜜莉的人設是否以法國女星艾曼紐琵雅（不可能的任務1女主角）

  為藍本？畫面表情很像她耶！請問有人知道嗎？


  --'
