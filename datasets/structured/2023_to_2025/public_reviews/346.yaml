url: https://www.ptt.cc/bbs/movie/M.1755677635.A.03B.html
title: '[普好雷] 不可能的任務：最終清算'
content: '雖然這部最終章在網路上評價不好

  但自己實際上看了好像覺得沒那麼糟糕

  只是比起「致命清算」來說真的顯露不少缺點

  故事不夠俐落緊湊 回顧橋段也實在太多又重複

  但該有的動作戲大場面還是沒有少

  爽度還是有 刺激還是有 但精彩度就見仁見智


  而且上一集才讓伊森團隊吃盡苦頭的反派

  這集整個智商瞬間變得跟弱智ㄧ樣

  最後死法更是...WTF？？？

  讓我看了有點問號？


  然後全能的智體這集卻只有專心在入侵核子設施，對於伊森小隊的行動完全沒有任何阻止

  措施（潛艇裡以外）


  整體來說，精彩度不如過往任何一集（除了第二集），但該有的不可能任務元素都有給到

  ，但很想問伊森從潛艇逃脫那段，正常裸裝從深海這樣上來不是肺早爆了嗎？


  --'
