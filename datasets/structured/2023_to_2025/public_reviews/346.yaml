url: https://www.ptt.cc/bbs/movie/M.1748252331.A.E76.html
title: '[普好雷] 不可能的任務：最終清算'
content: '防雷


























  毫無疑問我很愛湯姆克魯斯

  從早期就有一卡車值得一提的作品

  他的豐功偉業不用多說,還有誰不知道嗎？

  如今代表他人生的系列可能要暫時畫上句點

  我當時是怎麼愛上不可能的任務呢？

  我兩天內在宿舍用netflix直接肝完前面六集

  尤其是六,真的他媽的有夠好看,我愛亨利

  七上映當然很期待,即使跟前面比會沒這麼好

  看到後面還是有回甘的fu,那這次的最終章呢？


  我就直接說了,我沒有很喜歡,不少缺點可以說

  最直截了當的問題就是悶到不行

  就連特技場面也淪為各種過長的片段

  我自己是不喜歡潛艇那段超級長

  有做出點恐怖風是還不錯,但這不是重點

  最後的飛機場面……可能是以前就看過類似的

  也沒有說很打動我,而且反派死的讓我傻爆眼

  他是配角就算了,但他是有頭有臉的反派欸


  劇情和角色也沒有很ok,上集就存在的問題

  我是蠻喜歡第一集的角色回來,的確效果不菲

  但其他配角我就很看不懂他們的戲份

  班吉路德這些老班底可能還好

  新角色們我一概不知道他們的定位

  扒手在上集飽受批評,這集我倒覺得還好

  其他人就真的尷尬,他們實現了真正的跑龍套

  雖然我還是超愛龐克萊門捷夫的角色

  超帥狠勁十足,真想被她踩,我是說她說狠話也好

  只是再怎樣缺點還是遮蓋不住

  以前就算被譏為湯姆歷險記,也不像現在這麼影薄吧


  我想是愛之深責之切才會指出不少缺點吧

  再怎麼說這是現階段的最後一集了

  還是感謝湯姆克魯斯這30年的種種

  那些鬼扯至極的動作鉅現絕對是前無古人後無來者

  我還是很愛他的電影,我什麼時候才能看保送入學？

  以不可能的任務系列來說還是456最讚

  尤其是6,娛樂性最佳,劇情也盡量有兼顧到

  最後兩集對比前面真的是失敗了不少

  我不知道以後這個ip會何去何從

  無論如何現在該是他休息的時候了

  只是湯姆克魯斯可不會,他會繼續奔跑

  拍到他再起不行的那天！


  ----

  Sent from  on my Samsung SM-S9280


  --

  會拿美麗比喻成愛的人，都是不知愛情真相的人

  會把醜陋比喻成愛的人，都是熟知愛的驕傲者


  --'
