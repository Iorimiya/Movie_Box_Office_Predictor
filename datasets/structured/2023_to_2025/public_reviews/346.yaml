url: https://www.ptt.cc/bbs/movie/M.1747587761.A.20B.html
title: '[普負雷] 不可能的任務8：最終清算'
content: '上映前已經期待很久

  這次剛好人在國外

  為了早點看到電影

  所以是直接在馬來西亞的戲院看的

  順便提一下

  馬來西亞的電影有簡中和馬來文字幕

  雖然有些翻譯很糟

  例如secret service 他翻譯成秘密服務

  因為是先看到字幕才聽到聲音

  印象中這句台詞大概是

  這裡有很多的秘密服務

  （應該是特勤密勤特工人員之類的才對）

  一開始還害我想歪了一下

  不過大致上觀看倒是沒什麼影響


  以下有雷


  ============================


  首先我覺得一定要給導演負雷

  因為整部電影的節奏都很難把人抓住

  不管是剪接的節奏，橋段變換

  甚至到配樂都感覺節奏很糟

  整部配樂感覺超沉悶

  不管是在文戲還是動作戲

  在該緊張的橋段時配樂一樣很悶


  再來

  劇情我也無力吐槽

  感覺像是上個世代的老人對AI的刻板印象

  把AI想像成一個在網路世界裡的獨立生命體

  以此為基礎所編排出來的對抗戲碼


  首先不管外面炸不炸核彈

  AI自保的手段絕對不是自己躲進去末日地窖

  而是留一個備份進去

  等於你利用病毒讓ai存進特製硬碟之後

  外面沒核彈爆炸的世界中仍有ai繼續存活

  只要AI看過ISO規範就不會蠢到不留備份

  而路德沒接觸過原始碼

  卻能寫出病毒這神力就不提了

  還有那個焊點，看了真的很想把它熔掉重做


  再來想懷舊放彩蛋沒有問題

  但劇本怎麼把經典的諜報和鬥智橋段拿掉了？

  變臉頭套用在這麼不重要的地方

  整部電影完全沒有劇情反轉

  就這樣平鋪直述的演下去

  但就是這樣平鋪直述的劇情

  在交代劇情時卻讓人覺得混亂

  不知道是因為一人一句就剪太短了還怎樣

  連人物環境都還沒印入腦中就跳剪到另一景

  感覺有些混亂


  整部戲感覺有種滿滿的作業感

  像是要交個影視作業出來

  完全沒有任何的surprise

  這更導致動作戲的緊張感完全消失

  潛艇中和最終飛機追逐戰完全不緊張

  除了節奏很沉悶之外

  你也知道在那幾個動作橋段阿湯哥不會死

  兩次拆彈的場景也完全沒有緊張感

  亮點反而是班吉同時教學氣胸手術和系統操作

  至少還蠻好笑的


  至於普雷就給電影名字和阿湯哥吧

  畢竟是一個世代的系列電影

  最後最終章不如人意

  但中間的確有幾部令人印象深刻

  最後也沒有爛尾直接消失

  總算是有一個結尾


  --'
