url: https://www.ptt.cc/bbs/movie/M.1748186749.A.2CF.html
title: '[討論] 致命清算與最終清算關於「生存體」的問題'
content: '第一頁防雷














  關於生存體的描述，先引用維基上的劇情：


  一艘具備隱形技術的俄羅斯次世代核潛艇「塞凡堡號」在白令海進行航行測試期間，靠一

  把能分成兩截的十字形鑰匙啟用先進人工智慧作為防禦核心。然而該人工智慧、稱之為「

  生存體」（Entity）突然產生自主意識，乃至失控而一步一步誘使塞凡堡號自我毀滅，使

  潛艇被自己的魚雷擊沉在北極冰川下而無一倖免。





  後來在火車上美國的情報局總監承認生存體是他們植入俄國潛艇的，一樣引述維基劇情：


  與此同時，蓋布瑞伴隨派瑞絲秘密會見打算跟生存體一方聯手的丹林格，其計劃能透過生

  存體強化美國軍事工業複合體再排除政敵。丹林格揭示生存體本是美國以人工智慧為基礎

  所開發的網路武器，透過衛星傳送至塞凡堡號藉以破壞潛艇的隱形技術，卻隨著失控從才

  變得一發不可收拾。唯一能控制或摧毀生存體的方法，是靠完整的鑰匙開啟潛艇內的核心

  儲存器，獲取存於其中的生存體源代碼。




  我的問題是：

  到底生存體是蘇聯開發的先進人工智慧用來作為防禦核心，還是美國植入的?

  如果是美國植入的，蘇聯就不會有所謂"啟用先進人工智慧作為防禦核心"的說法


  以及貫穿這兩集的一件事情就是要取得「塞凡堡號」上的生存體原始碼，並進行改寫後才

  能破壞它或是控制它，而如果生存體是美國開發植入的，那美國就有原始碼了，還大費周

  章跑去「塞凡堡號」挖出硬碟，太辛苦了吧!



  唯一合理的解釋是，「塞凡堡號」本身有自己的AI防護機制，生存體是美國植入的，植入

  後與原本的防禦核心AI演算法融合，才變成後來接管全世界軍用網路版本的生存體?


  關於生存體的來龍去脈，實在搞得霧煞煞，有人可以解說一下嗎?

  謝謝


  --'
