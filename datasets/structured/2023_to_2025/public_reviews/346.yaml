url: https://www.ptt.cc/bbs/movie/M.1737369971.A.9FE.html
title: '[新聞] 《不可能的任務：最終清算》導演對試映'
content: "《不可能的任務：最終清算》導演對試映效果很滿意！觀眾向他表示「看動作場面時差點心\n臟病發」\n\n\n\n湯姆克魯斯主演的《不可能的任務》系列一直都以各種瞠目結舌的動作場面著稱，而規模\n\
  也會隨著續集的推出而不斷更上層樓，像是在《鬼影行動》中攀爬哈里發塔，《失控國度》\n中掛在一台軍機外頭，一直到上一部續集《致命清算》中的騎車飛越峽谷然後跳傘。\n\
  \n系列將於今年推出的《不可能的任務：最終清算》很有可能將會再次超越前作，而導演克\n里斯多夫麥奎里也對於本片初步試片的觀眾反應感到非常滿意。\n\n雖然《不可能的任務：最終清算》目前排定\
  \ 5 月 23 日才會上映，但導演在最近接受\n《帝國雜誌》的訪談時透露，《不可能的任務：最終清算》已經在日前舉行了一場小規模\n的測試放映，而其中一位觀眾向他表示片中的動作場面差點「讓他心臟病發」。\n\
  \n「我們舉行了一場小規模試映，某位觀眾說：『我在某個片段中全程都感到一種窒息感。\n我差點就要心臟病發了！』而我想：『這代表我們做對了。』」\n\n喜愛《不可能的任務》系列的觀眾早就預期預算高達\
  \ 4 億美元、同時也有可能成為系列\n完結篇的《最終清算》，將會帶來更加精彩刺激的動作場面，而湯姆克魯斯也將再次呈現\n出各種令人屏息的特技演出。\n\n在最初的計劃中，這部續集的標題原本打算採用《致命清算\
  \ Part 2》，電影團隊之後將\n其則改成了現在的新標題，但就從目前公開的預告來看，《最終清算》的故事依然會延續\n《致命清算》的結局，講述伊森韓特繼續試圖阻止失控的\
  \ AI 演算法「生存體」，至於那\n段令試片觀眾感到「窒息到差點心臟病發」的場面，或許與預告中展示的潛水艇片段有關。\n\n去年，系列班底之一的賽門佩吉分享了他對於《不可能的任務：最終清算》的讚賞，將其\n\
  稱為「系列史上最佳」，表示這都要歸功於湯姆克魯斯在續集中一些「令人難以想像」的\n演出。\n\n「我剛剛完成了拍攝，還要花一天進行小規模補拍。我看了其中幾個片段。這真是太瘋狂\n\
  了。他在這部續集中做到的事，徹底令我大開眼界。我想這可能是系列最棒的一部。而我\n這樣說的原因可不是因為『喔，你必須這樣說。』」\n\n即使《致命清算》的票房有點不如預期，但如果《不可能的任務：最終清算》能夠在今年\n\
  \ 5 月上映後取得亮眼的票房成績，那整個系列就有機會進入下一個新的階段，探索全新\n的時間軸。\n\n去年年底，相關傳聞暗示了湯姆克魯斯正在為系列尋找年輕版伊森韓特的演員，並讓他在\n\
  《最終清算》的回憶片段中登場，同時為主演系列第九部電影做準備。但以目前來說，這\n一切就只是傳聞而已，而派拉蒙影業也上未公開任何與第九部《不可能的任務》電影有關\n\
  的消息。\n\n\n--"
