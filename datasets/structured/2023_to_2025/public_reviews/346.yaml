title: '[好雷] Re: [普負雷]《不可能的任務：最終清算》遺憾的終章'
content: '當時忘記選IMAX來增加觀影體驗了...不過原本"誰誰誰的兒子"那邊我認為很必要，原因

  跟原影集(虎膽妙算系列)及阿湯哥這系列電影第一集有關：當初第一集把這麼長久以來虎

  膽妙算觀眾熟知的男主角"龍頭" (角色原名 Jim Phelps，飾演者是 Peter Graves) 變成反派然後又被幹掉的處理手法真得太過粗魯，網路資料也有寫說不少原影集演員不開心及拒絕第一集演出。而既然最新這集都是打著"清算"了，當初這點被算帳及彌補我覺得是合理的
  (雖然這個彌補法對原影集仍不太夠，且這點本身也是偏跳出電影劇情本身的外部後設，但一部電影背後總是有很多方方面面需要被考量到)。


  (這篇文章編輯很多次的原因除了是為了讓文辭表達更達意或清楚，此外我自己不熟悉PTT

  的快捷鍵，大概是因為太少發文或有些功能沒用過，所以仍在學習中...)






  --


  --'
