title: 'Re: [普負雷]不可能的任務 最終清算 講武德的AI'
content: '但我覺得這句話很帥 也只有8才能這樣拍

  因為確實他一直都這麼屌

  如果是某個電影 為了塑造主角很猛 這樣講就會很低能



  因為AI的目標是全世界核武齊發(含美國)

  而且AI 完全接受美國自己開火

  在他們的討論中就有提到

  要嘛AI掌控所有核武轟爆全人類 要嘛美國先一步轟爆全世界

  對於AI來說 他都算贏




  我覺得這個立基點是可以接受的

  因為AI預設 除了美國(全世界最大核武庫)之外

  其他國家的轟下去 效果不夠


  簡單來說 AI無法達成目的 他幹嘛這樣做

  要嘛AI全掌控 要嘛美國轟 除此之外「人類無法毀滅」


  毒藥這東西我倒覺得沒啥好糾結 但理論上來說本來就做的到

  這邊討論程式設計沒意義

  就說人好了

  我今天拿砒霜給任何一個人吃 都可以預設他死的機率高達90%

  我需要檢測過這個人會不會免疫砒霜嗎?


  人是碳基有機體

  AI也是code出來的

  假設技術實力高到某個等級 能開萬解 不奇怪

  但肯定是劇情設定 就也別這麼糾結



  那不是計算的問題 問題是AI終究 只是一台機器 他又沒實體

  而且吃毒的效果就說了 會讓AI覺得他已經安全了

  如果毒不能讓AI意識到他尚未安全 就不是毒了



  可以歸咎於病毒效果

  從另個角度來說 若人類社會毀滅

  備份自己也根本沒意義

  不然去末日庫幹嘛



  毒之所以是毒 就是你掌控不了

  你可以知道自己快要中毒了

  這算什麼毒= =

  物理上來說 他根本不可能知道 主角什麼時候插他



  我倒覺得我很喜歡7 8的轉折和設計

  蠻符合實事的


  最喜歡的一點

  好像也蠻少看到文章說


  「人類根本不可能發射核彈，為什麼不放棄？」


  我蠻喜歡電影裡面的美國總統最後選擇放棄使用核彈

  現實世界中 應該全世界都要放棄使用大規模毀滅性武器


  戰爭的目的是為了贏 不是為了毀滅世界 也不是為了殺平民


  當代戰爭也完全有辦法利用更尖端的武器 去展開現代戰爭

  應該是要更精進 「精準性」、「遠程戰力」、「甚至智能化AI鑑識避免殺戮平民」


  這樣也可以實踐國防武器戰力


  研發核彈根本低能

  放在那邊好看

  不小心又要拉全世界陪葬

  研發這種鬼東西是神經病嗎


  --

  病毒的針對性 是針對於「漏洞」

  在駭客的領域內 最高管理權限的獲取 是非常常見的攻擊手段

  那可能砒霜的舉例不是很好


  從行內話來說

  一個零日漏洞獲取系統的最高權限

  對他為所欲為從理論上來說 是做得到的

  真的 只要不是突然變設定出來就好

  明明說1+1=3 我接受了 一下又說其實1+1=5 因為2+2=6 幹這我就不行了

  1+1=3 就必須1+1等於3 我可以接受人家笑我不知道1+1=2

  想法要改變 就像現階段人體試驗不能做 複製人不能做 一樣意思

  不是技術沒有 是倫理上禁止 一樣概念'
