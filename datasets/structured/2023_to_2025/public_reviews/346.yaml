url: https://www.ptt.cc/bbs/movie/M.1747537053.A.B8F.html
title: '[負雷] 不可能的任務最終輕鬆-玩命光頭阿湯哥'
content: '7、8集這兩部水準跟456差太多

  諜對諜精密陰謀風格減弱

  高科技團隊感覺也沒了

  根本是阿湯哥極限體能王

  動作戲越來越扯淡

  以前還可說是靠高科技和團隊完成任務

  現在根本就阿湯哥開外掛

  硬塞便當、反派降智、邏輯下線

  為了懷舊亂湊前面角色猶如八點檔

  根本變玩命光頭化


  前面的不可能任務系列

  雖然知道阿湯哥最後一定成功

  但還是會有很強的緊張感

  這集的動作戲，拆彈

  只是讓阿湯哥秀特技的

  潛水艇拿個硬碟翻呀翻

  飛機戰爬呀爬的

  看似轟轟烈烈實質乏味平淡

  這系列其實最緊張的時刻都是諜對諜文戲

  但這兩集都沒這味道了

  解釋性台詞一大堆

  每個人輪流唸一句給觀眾聽…

  反派也很抽象

  ai也看不出厲害之處

  換成隨便一個恐怖組織都可以


  片長那麼長但感覺都在瞎忙…



  --'
