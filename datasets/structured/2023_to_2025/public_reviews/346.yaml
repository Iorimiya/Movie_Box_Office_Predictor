title: '[請益] 不可能的任務：最終清算  一個問題(有雷)'
content: '(問題有雷)





  請問 : 不可能的任務：最終清算  最後面

  阿湯哥在飛機上幹掉蓋布瑞，手上同時有「馬蹄鐵」和「毒藥丸」，

  鏡頭也拍到他在駕駛艙裡準備要把「毒藥丸」插進去，

  但不知道為什麼停了幾秒後就停止動作了，然後決定跳傘逃生。


  這裡有點看不懂，為什麼阿湯哥不先插了再跳傘，

  還要拍一段主傘被燒掉，讓觀眾以為他GG的畫面?

  求解，謝謝。






  --


  結論就是其實在飛機上是可以插的

  但為了製造緊張感+劇情需要( 一定要搞到最後幾秒 )所以這樣安排

  了解了 XD'
