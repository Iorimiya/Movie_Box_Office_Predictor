url: https://www.ptt.cc/bbs/movie/M.1748107188.A.3C0.html
title: '[普負雷]《不可能的任務：最終清算》遺憾的終章'
content: '雷文防雷資訊頁



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  如果要我為《不可能的任務》系列做個排名的話，我個人的喜愛程度是會是這樣：6>4>=1

  >3

  .

  阿湯哥在戲外付出的努力當然值得珍惜，但只論電影本身，說句有點遺憾的，我還真不太

  喜歡《不可能的任務：最終清算》(Mission: Impossible – The Final Reckoning)，它

  承襲了上集的缺點，但卻沒有延續上一集的優點：它太龐大、太複雜、太臃腫到一種完全

  沒必要的程度，劇情真的太冗長又太沉悶了。

  .

  《致命清算》縱使同樣冗長，但至少動作場面滿檔，而且最後的火車戰還真的不錯，但《

  最終清算》讓我們看到的卻是克里斯多福麥奎里對於動作場面的想像力、還有阿湯哥強調

  親自上陣玩最真實的特技，這兩件事情為電影帶來的精采度已經開始出現了嚴重的邊際遞

  減效應，甚至可以說讓人感受到了一點他們創作上的疲態。

  .

  先講劇情，它好像有種「因為是完結篇，所以必須拍到三個小時的」迷思，但這片的內容

  跟人物豐富度實則並沒有辦法支撐到三個小時的片長，不僅為了把所有前面的系列串接起

  來做個總結，而加入了大量的閃回畫面，還有許多硬要跟沒必要的─例如「你其實是誰誰

  誰的兒子」，根本沒人在乎，這類的硬湊還不只一個─它甚至破壞了第三集最有趣的部分

  ，我是真的覺得完全不告訴兔腳是什麼東西是個超級高明的劇情安排、也是非常精彩的麥

  高芬應用。

  .

  它大量引用前面系列的故事，卻唯獨將評價最差的第二集視為黑歷史般有意無意地忽略，

  不過觀眾沒想到的是，它原來是在敘事節奏上致敬了第二集：文戲緩慢而缺乏張力，主角

  面對的是世界末日等級的事件，但卻一點緊張感跟危機感都沒有，只是敷衍的把大量資訊

  「講給觀眾聽」，甚至出現好幾次一件事情卻莫名分給好幾個角色接力完成的情況，彷彿

  這些角色怕觀眾忘了他們的存在。

  .

  而讓人感到奇怪的是，如果這兩集《清算》被視為系列完結篇，那他們理應開始收束整個

  故事，但他們不僅沒有這麼做，還想在有限的時間內加進更多人物、繼續擴充背景、然後

  讓支線莫名展開或是無疾而終，例如為什麼這集路瑟突然病重？我還以為自己少看了一集

  。又像是上集突然追加了伊森跟蓋布瑞的恩怨，告訴你原來伊森他們兩人早有交集、有個

  對伊森似乎很重要的女人被蓋布瑞害死，伊森則被冤枉成兇手，只好被迫加入IMF。那個

  女人到底是誰？這段過去對於伊森的人格塑造又有什麼關鍵性？希望你不要提出這些疑問

  ，因為麥奎里根本無心解答。

  .

  我甚至懷疑這段過去是原本不存在電影當中、事後硬加進去的。因為《致命清算》的反派

  最一開始規劃是由尼可拉斯霍特演出，他跟阿湯哥將近一倍的年紀差距，讓他根本不可能

  出現在伊森尚未加入IMF的回憶當中。

  .

  而這片又給人一種好像因為上集的評價又粗暴地修改了蓋布瑞戲份的感覺，幾乎是把他的

  戲份刪減跟壓縮到最低，就好像麥奎里根本不想要這個角色了，但沒辦法，上集沒收掉，

  只好硬著頭皮把他留下了。蓋布瑞在這集甚至給我一種他在前半段剛登場時就好像隨時會

  提領便當的感覺。

  .

  但上集至少還有蓋布瑞這個生存體的代理人貫穿全場，這集幾乎是完全以生存體做為主要

  反派，但它是一個沒有固定形體的AI，而且它因為篤定勝利，甚至可以說是躺平一整集。

  這樣的劇情設定則注定了反派與伊森不會有什麼直接的面對面碰撞，這代表很難有什麼激

  烈的動作戲，雖然加入了一群AI的邪教信徒，但他們的格局小到根本沒辦法對主角群真的

  造成什麼威脅，他們的幾次出現並對主角群的行動造成干擾，其實很像是麥奎里怕觀眾快

  睡著了，趕快找些人來攪局一下。

  .

  再講回阿湯哥，這幾年他沉迷於不使用CGI、親身上陣表演各種特技，這是他個人的興趣

  、同時也是電影最大的賣點。這最後這兩集《不可能的任務》卻出現了種走火入魔的趨勢

  ，上集飛車跳崖幕後比正片還好看，這集則像是整部電影的劇情像是要為了服務那兩段特

  技場面而存在似的：猶如他們先決定了這集要玩什麼特技、拍完後才開始想要怎麼把這兩

  段放進劇本當中。而且他們拍完之後還覺得阿湯哥都親自上天下海了(字面上的意思)，捨

  不得剪掉任何一段，導致這片武戲出現了跟文戲一樣過長的問題。

  .

  另外我們先撇開兩人在動作場面上的自我重複不談─潛水跟爬飛機我們在《失控國度》看

  過、飛機追逐則在《全面瓦解》看過，而且都拍得更精彩更好看─過度強調特技的真實性

  ，其實也是變相降低了動作場面的娛樂性，因為這等於是對想像力的自我設限，動作戲不

  可能拍得太過誇張花俏。

  .

  例如最後飛機那段，縱使那將阿湯哥的帥臉吹得亂七八糟的強大的風力，讓我們理解到了

  這段場面的絕對真實，但整段戲拍的這麼長，卻看不到什麼空中纏鬥，只看到阿湯哥在飛

  機上爬來爬去，還爬了兩次，在知道主角不可能死的情況下，這其實一點都不刺激。最後

  我們原本期待伊森會跳下飛機、伴隨著《不可能的任務》主題曲響起，在空中和蓋布瑞一

  面搶

  降落傘、一面進行最後一場死鬥。但對於強調真實的這片來說，這樣的場面太過不切實際

  ，所以伊森就這樣默默地爬回飛機上找到第二個降落傘，然後結束這段劇情。

  .

  我自己覺得比較好看的，其實是中間的潛艇那段，但某種程度上來講，這段的精采是靠

  IMAX的全版畫面加上電影院環境的沉浸感撐起來的，如果是在家用小螢幕看，那可能會蠻

  無聊的。不過這段倒是讓人見識到了用IMAX攝影機拍一部深海驚悚片的可能性，真希望未

  來有人拍一部這樣的電影。

  .

  雖然有點不忍心這樣說，但《不可能的任務：最終清算》其實整體給我的觀感是有點失望

  的，若這只是整個系列中相對比較普通的一集，那倒也就罷了，但如果它真的是這系列的

  最後完結，那就真的讓人感到遺憾了。

  .

  說穿了，或許他們早就錯過了完結這系列的最好時機，《全面瓦解》的結尾真的就是最好

  的結局了。


  --'
