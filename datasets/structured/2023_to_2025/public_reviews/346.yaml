  幸好飛車追族少了非常非常多，如果還像7一樣瘋狂飛車

  不說還真以為我在看玩命光頭


  心目中的評價還是4 5 6比較好看，尤其4是顛峰

  7、8像是一群不知道什麼是AI的老頭，自己腦內小劇場掰出來的劇本

  才搞出這個奇奇怪怪的AI BOSS



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~









  從7開始，AI就塑造一種無敵的感覺

  他可以計算出任何變數，所有狀況他都考慮進去了

  結果AI千算萬算，算不到伊森一句相信我之術

  相信我之術在8真的是發揮的淋漓盡致

  只要別人的意見跟自己相左，或者對方猶豫、遲疑、不相信

  那就是來一句相信我之術。

  如果喊了這句對方還是不相信

  那再加碼送一句："AI知道你不會相信我，所以你要相信我"



  而且8一直給觀眾一種走錯一步就會引發世界大戰，

  但美國總統+幕僚不知道在想啥

  美國面對AI射核彈的解決辦法居然是自己先主動對全世界包含自己射核彈

  有夠問號的，AI射核彈會引發世界末日、世界大戰

  但是我們美國自己主動把全世界炸一輪，就不會有世界大戰了?

  這到底怎麼推測的實在看不太懂



  另外8的開頭伊森就在聽美國總統的錄音，

  裡面提到："因為你(伊森)不想讓AI給任何人掌控，因此搞失蹤，所以我只好親自聯絡你"

  不是阿，不是說伊森搞失蹤，大家都找不到?

  阿怎麼你美國總統就找的到?



  然後開頭也表現出因為AI的關係，所以世界局勢混亂，人民恐慌等等之類的

  結果就僅此而已，之後的片子再也不會有人民恐慌相關的畫面跟提及了

  花了一個篇幅描述AI造成的負面影響，但是就這樣而已

  之後的片子完全感受不到世界混亂



  接著是AI非常講武德

  劇情說AI想利用核彈把全世界炸一輪，讓人類文明毀滅

  且AI已經掌握了全世界除美國以外的核彈，但就是不發射

  劇情的解釋是AI要等自己到安全的地方才會射核彈


  所以儘管AI有辦法計算所有變數

  所以儘管AI算到自己最後會失敗

  但我們家的AI就是非常乖，一顆都不射


  我突然覺得要世界和平，應該要靠AI實現

  人類互相打仗會怕有人手滑突然射核彈

  (例如美國總統差點手滑)


  但只要核彈給AI管

  並把AI放在不安全的地方，那麼核彈永遠不會發射

  世界和平果真要靠AI實現吧



  然後那個毒藥丸更是扯，沒看過原始碼，還有辦法寫出針對AI的病毒?

  AI還真的吃到病毒的攻擊，然後自己跑進去籠子裡面被關起來

  阿你AI不是有辦法計算所有狀況?

  你不就早該知道有人寫病毒嗎?

  你怎麼就乖乖的躺在那邊吃毒


  人類的小腦袋可以憑空寫出針對AI的病毒

  結果可以破解核彈的AI不知道怎麼隔空抓藥寫防毒

  人類都還知道防毒軟體要一直更新病毒庫了

  你一個神級AI的操作真的頗雷

  尤其是不知道要備份自己這最誇張


  就算真的無可避免地中毒，那麼在中毒前幾刻

  把掌握的核彈射一射不行嗎? 至少表現出同歸於盡更有緊張感吧

  人家美國總統+一群幕僚都打算自己主動開射了

  這AI真的有想摧毀人類嗎?



  最後的爬飛機那段就有點多餘，爬一架已經爬夠久，且也夠了

  結果還跑去爬第二架

  然後反派一直笑得像個孩子一樣地看伊森爬飛機

  降落傘那邊更是傻眼

  反派爽到不行的說只有我有降落傘，然後就領便當(也許沒死?)

  結果伊森直接在座位上穿上降落傘?



  整體來說7、8個人認為真的是系列敗筆

  不要導入AI真的都比較好，當你的作品導入一個AI

  且把AI描述得天衣無縫，決不犯錯，但結局又是AI落敗的話

  那整個過程就無可避免的會一堆漏洞


  以前的反派都是人類

  反派降智導致主角群獲勝，那可以說敵人犯傻

  畢竟人類的思考能力就是這樣，難免會出錯

  但是AI就是AI，你一直描述他的強大，他的計算能力

  結果整部作品一直看AI降智，整個就變得很奇怪


  身邊看過7的人幾乎都把7忘得差不多了，沒啥記憶點

  但是看過4 5 6的人基本上都不會忘記一些名場面

  尤其是4的爬塔、鑽石女、追蹤眼球等等

  但7跟8真的不知道該說啥了

  如果真的是系列最終作，卻繳出這劇情

  個人認為是挺遺憾的



  應該就這樣吧，趁現在還有印象上來打的流水帳

  有想到什麼再上來補充



  --'
