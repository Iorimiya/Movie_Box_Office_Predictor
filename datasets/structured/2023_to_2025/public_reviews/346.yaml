url: https://www.ptt.cc/bbs/movie/M.1747489587.A.CC7.html
title: '[好雷] 不可能的任務 最終清算'
content: '第7集實在太糟糕，第8集相對進步很多

  就憑那場潛水艇的戲，這部我決定給好雷


  號稱是收官之作的最終清算，給了觀眾或老粉們很多意外的設定跟情懷

  有些可謂畫龍點睛，例如第一集

  有些就讓人覺得...「有這必要嗎？」例如誰是誰的爹、總統的小孩


  整個劇情其實非常緊湊，但文戲的部分卻又略顯拖沓複雜

  尤其是搞政治的在那邊討論犧牲城市、一起看著末日鐘

  等到電影結束後稍微細想，就會發現這部作品的邏輯超級有問題


  但特技動作、致敬前作、情懷角色的便當與加入

  某些演員額外亮眼(我好愛潛水艇的黑人艦長)

  以及嚴肅的劇情中還是有插入笑料舒緩氣氛

  讓這部作品整體來說還是滿不錯的


  先來談談潛艇戲

  這個任務堪稱前所未有的困難，雖然沒有守衛、但主角沒有潛艇設計圖

  任務前只有幾小時加緊訓練

  還有水溫跟潛水夫病的問題，此外過程中伊森真的是超級孤獨的

  獨自在海底棺材找一個自己處理第三集中犯下的"錯誤"

  我看的是國賓鉅院廳，在水底那種低沉的音效還有已逝船員臉

  都讓我覺得這場戲值得列為不可能系列中最具特色的一段


  其他幾段(拷問)、甚至最後的飛機戲都有點既視感了 很類似前作

  差別只在於Boss的死法，這部的死法真的超級好笑

  比第三集還瞎


  第一集的工程師出現時，真的很感動，有一種首尾呼應的感覺

  而且他也太有sense，私藏機密這麼久，還願意跟主角團和解並抵達最後的關卡

  這人簡直是本作的英雄啊...


  幾個比較扣分的點，例如團隊情感很薄弱

  女主角綁馬尾是稍微好看了一點，但她跟伊森的CP感...我吃不太下

  然後幾個部長的戲分好多=  =此外我本來以為這部會有白寡婦


  最後也沒有交代他們要拿那個東西做什麼

  而且為什麼反派會有個可以跟AI溝通的鐵處女(X)？


  還有一件事情讓我不太適應

  這部續集是不是有一些DEI的部分，整體看下來很多人種

  女性角色也出乎意料的多，和前作是有比較大的差別

  到底為什麼俄羅斯部隊會有個這麼像日本人的？


  喔對了，電影前半段畫面一直狂閃很不舒服

  這種程度難道不會讓癲癇患者發作嗎？


  --

  直接潛上來沒有任何後遺症太誇張...減壓艙哪有這麼神'
