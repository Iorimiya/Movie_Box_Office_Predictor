url: https://www.ptt.cc/bbs/movie/M.1749628137.A.71B.html
title: '[前半無雷+後半好雷] 不可能的任務：最終清算'
content: "如果今年只能挑一部電影去電影院看的話，我的答案一定是不可能的任務\n\n沒什麼原因，就因為我是這個\"品牌\"的粉絲\n\n這一系列除了2，從第一集開始我就是去院線收看，也跟著阿湯哥漸漸變老\n\
  \n對我來說，它已經是我一部份的回憶，所以不管評價如何、不管再怎麼忙\n\n一定都要抽出時間去電影院貢獻票房\n\n(過去三年幾乎沒去電影院，我上一部看的電影就是MI7)\n\
  \n當然不是每次看完都讓我覺得意猶未盡，但也幾乎是全部了\n\n我也必須老實講，最讓我失望的是7，但我覺得8比7好很多\n\n若單就商業動作片來看，我會給它85，劇情緊湊，該有的大場面都有\n\
  \n\n\n\n\n\n\n\n\n\n=== 以下開始有雷 ===\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n若以MI系列作的角度來看則是70，招牌的偽裝、計謀、秘密行動幾乎沒有\n\
  \n跟對手鬥智、雙方你來我往是MI電影的特色，在7和8都很薄弱\n\n這兩集都是單方面被壓著打，一路苦苦追趕，最後才反敗為勝，這點稍微可惜\n\n但若以老粉的角度來看，我會給它95分，滿滿的情懷\n\
  \n如果最後的結局改成這樣，我會給100分：\n\n伊森的降落傘被燒掉\n\n在快速墜落的過程中，伊森終於把毒藥丸插上馬蹄鐵，然後消失在茫茫雲霧\n\n在地堡內，綠燈亮起，葛雷斯剪斷紅線，隨身碟發光，拔掉，一眨眼的時間\n\
  \n大家鬆一口氣，知道伊森又再一次做到了，成功拯救世界\n\n不一樣的是這次他沒有回來，就這樣人間蒸發了\n\n搜索從數天變成數月，大家從原本的期盼、擔心，然後接受，繼續往前\n\
  \n就像這篇新聞說的\n\n沒有盛大的道別，沒有擁抱灑淚，最後的鏡頭只有班吉獨自坐在車內\n\n就跟東尼史塔克一樣，唯有這樣伊森才能休息\n\n或許若干年後，電影公司會重啟這個系列\n\
  \n甚至把伊森變成反派，就跟第一集的龍頭一樣\n\n到時我們這一代的粉絲可能會難以接受，就像當時的影集影迷一樣抵制新電影\n\n但或許也會有新的粉絲出現，會有一個新的傳奇出現\n\
  \n\n\n\n\n\n分享一些比較少人提到&我自己的心得：\n\n1.伊森的代號是BE11(Bravo Echo 11)，在第一和第四集任務失敗要求撤退時都有講到\n\
  \n2.第一集帶伊森找Max的人跟第四集帶伊森找巴格丹表哥的人是同一位演員，算是一個\n  小彩蛋，可以假設Max失勢後這個角色轉投入巴格丹表哥旗下，從一個軍火商到另一\n\
  \  個軍火商，看來對方對這行業很熟。兩次都用Dunhill當暗號，就連給伊森戴的面罩\n  都如出一轍\n\n3.兔腳這個梗用的不錯，雖然第三集時演得很像病毒，但其實也只有說\"\
  無法打開容器\"\n  而伊森把兔腳從中國偷出來最後輾轉流入美國手中，也符合蓋布瑞說的\"中國做得出\n  來但無法讓它起作用、美國做不出來但讓它變得更強\"\n\
  \n4.路瑟領便當前最後一句台詞，我在戲院看到的翻譯版本是網路騎兵，翻回英文的話是\n  Net Ranger，而原文其實是Phineas Freak，兩者都是第一集伊森招募他時提到的外號\n\
  \n5.有人說這集幾乎沒有撕面具感覺少了一味，其實在第四集也只撕過一次，而且還是反\n  派，主角方一次都沒撕過，不過劇情巧妙的安排讓人沒有注意到這點。事實上第四集\n\
  \  從聽取任務開始就一直出包，班吉這個角色從後勤被拉到前線也意味這個組織已經開\n  始走下坡。雖然沒撕面具，離開克里姆林宮時伊森的三秒變裝還是讓人印象深刻。\n\
  \n6.第五集反派領導的Syndicate在原始影集(1966)就有出現過，不過應該只是同名。我只\n  看過1988版的影集新虎膽妙算，已經沒印象是否看過Syndicate\n\
  \n7.第二集的反派演員Dougray Scott原本被相中要演當時一個新電影的角色，他也很有興\n  趣，檔期也沒問題，但第二集製作過程比預期還久，阿湯哥和吳宇森也不願意讓他離\n\
  \  開片場，所以他與那個角色擦身而過。後來新電影那邊找了一個叫休傑克曼的新人來\n  演那個叫金鋼狼的角色。\n\n8.原影集龍頭演員拒演電影版的原因其實不只一個，不過最讓人津津樂道的應該還是電\n\
  \  影把龍頭這個角色寫成壞人。我那時看也是有點無法理解，不過好險跟影集不是同一\n  個演員把他當不同人看就還好。\n\n9.阿湯哥親自上陣挑戰高難度特技已經變成MI系列甚至是他自己的招牌，但其實MI系列\n\
  \  一直到第四集才開始炒作這個話題。雖然第二集騎重機那一段也有被當作幕後花絮，\n  但沒有現在那麼誇張。應該是爬哈里發塔造成轟動，製作團隊覺得可以用這點來宣傳。\n\
  \  不過個人覺得後來有點炒作過頭，因為當你在進戲院前就已經在新聞或宣傳影片上看\n  過這場景無數次，看正片看到同一個片段時其實早就麻痺無感了。用得最好的是第五\n\
  \  集，開頭就把這個場景用掉了。之後就每下愈況，尤其7的騎機車衝懸崖和8的飛機纏\n  鬥，都是正緊張的時候插進來，觀眾原本懸著一顆心突然被丟一段已經看到沒感覺的\n\
  \  畫面時，就好像正在享用一道調味豐富、多層次風味的佳餚時突然吃到一盤沒味道的\n  水煮青菜。\n\n10.阿湯哥畢竟是人，在怎麼樣都看得出他老了。MI系列的確可以見好就收，趁現在還\n\
  \   有一點名聲時。1-5都是不同導演其實各有特色，之後都是同一個導演反而節節下滑。\n   如果將來還有要繼續拍，我也希望是新人來接手。若像我上面講的，新系列把伊森\n\
  \   變反派，那也未嚐不可。就像第六集的沃克/拉克所講的\"伊森被他的政府背叛了多\n   少次？被丟棄多少次？要到什麼時候這種人才會覺得受夠了？\"若新系列伊森終於忍\n\
  \   不住抓狂起來大殺四方，那應該也會很精彩。\n\n\n\n\n\n--\n其實1-3集也都是阿湯哥一人扛全場，到第四集團隊戲份才開始多一點\n所以之前還被戲稱為湯姆歷險記\n\
  這一集的團隊戲份我覺得跟前面幾集並沒有差太多"
