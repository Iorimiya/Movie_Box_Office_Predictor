title: '[普雷] 不可能的任務 最終清算 沒有比較沒有傷害'
content: '先說劇情


  其實蠻制式的 沒想到這系列的最後是ai想要毀滅世界 美國總統當聖人這種好萊塢劇情


  不過居然還能有這系列第一個受害者過著幸福的結局 還有終於說出兔腳到底是什麼了


  整部電影最刺激的不是結尾 而是在進入潛艇這段最窒息也感覺最無助


  結尾其實也蠻爛尾的 上一集把反派塑造的這麼神秘又厲害 結果死的超級無敵蠢！


  別人第四集俄羅斯佬用命保護包包 亨利扛這半邊毀容跟阿湯哥互毆 最後被鈎子收走都還比

  較正常 結果這咖自己裝逼撞機翼死掉？


  結尾反而最不刺激 第四集最後一秒關閉導彈 第六集最後一秒懸崖邊拔鑰匙 這集有降落傘

  我都覺得穩了 100毫秒毫無緊張感


  三十年的系列就這樣完結了 也算有交代啦











  媽的還是覺得伊爾莎刀的好爛 操


  --'
