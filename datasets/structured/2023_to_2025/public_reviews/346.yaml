url: https://www.ptt.cc/bbs/movie/M.1750032981.A.573.html
title: '[普-負雷] 不可能的任務 最終清算 2D atmos'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  人權，衝的午夜場。



  緊接著在Netflix上看完致命清算以後，衝電影院看完最終清算。


  （不至於需要包尿布或自帶尿袋）


  以下皆個人很主觀心得，我不是系列粉。


  我下面先留空白，不想看的可以先退出，想噓文的可以先噓了。






  正文開始：


  坦白說，TOP GUN2樂勝這部！！（超大聲）


  其實，最終清算，還是比致命清算好看。


  但我覺得跟阿凡達水之道有類似的問題，就是後面一直永無止境地打架。

  打到讓我很審美疲勞。


  不過最終清算的總體劇情，還是比阿凡達好很多。

  （因嚴格說來，阿凡達水之道沒劇情）



  這部我還是很推薦這一季進影院看。

  （而且可以的話盡量愈高配的票愈好，我這裡的電影院，最高配就2D-atmos。）


  影片本身沒啥尿點。


  只是看伊森各種一直跑，爬飛機，看到審美疲勞。

  影院裡又鼾聲如雷，不知是否因為我看的午夜場，還是說同劇院觀眾也沒到很享受。



  個人覺得這部沒有爬杜拜帆船酒店那部（鬼影行動）好看


  劇情設定方面，明明就敘事得宏大，劇情的骨肉填充本身，卻給我一種無聊的感覺。


  最多就進潛艇那段有股克味，感覺不錯。


  最拖台錢的部分，則當屬兩台飛機那段，有夠長zzZ



  ＊＊＊



  同季度影片相比，純論爽感，絕命終結站：血緣　樂勝。


  最終清算雖然是動作片，且有許多大場面，卻不能說特別爽。


  我純粹是想知道後續劇情，才在網飛重看完致命清算之後，才去看最終清算。

  （畢竟致命清算的上映，也已經是很多年以前的事了，劇情銜接方面依然需要複習。）


  結論是：我覺得好像有點劇情，又不是太多（？）


  尤其是在白令海附近脫潛水服，從水下300呎處開始，在冰水裡任人體自行上漂。

  還能活著，那段太扯了。

  （天哪他簡直是盎格魯薩克遜超人)


  降落傘明明就燒掉了，哪裡突然變出來第二個，也是很扯。

  （全程無懸念，反正伊森杭特有外掛。）


  P.S: 我沒跳過傘，我不知道降落傘有副傘這件事，所以就這樣吧。

  （知之為知之，不知為不知，我就真的不知道。）



  有一種與其說熱核戰爭使世界完蛋，倒不如說美國電影工業正在完蛋的感覺。


  作為一個大系列的收尾，格局是最大的，劇情卻是系列以來最無聊的，沒有之一。

  （同樣是特工片，傑森包恩系列的結局我就覺得不錯。）



  感覺網路上給的評價普遍過高，至少超過我在觀影後的評價。


  （觀影前我並沒有特別上網仔細看心得，主要是怕被劇透，但還是有瞄兩眼。）



  我並不會覺得，這假日票的票價白花錢。

  （畢竟夜貓場還是有便宜到。）


  可是這麼大製作的片，給我的觀感，竟不如絕命終結站6（這部更有創意）？


  可能是我主觀審美有問題。


  與其看伊森爬飛機，我還更喜歡CT機把人的Ｘ頭釘、乳釘全都吸進去的橋段。


  當然，絕命終結站6，依然有其令人詬病之處，主要是最後兩名主角死得太過潦草，

  驚喜幾乎在前面全用光了。



  ＊＊＊



  不可能的任務：最終清算，是一部值得進電影院，看完不算浪費時間，

  但是出電影院之後，並不會感動，也不讓我感到喜悅，反而覺得無聊的一集。

  （看完絕命終結站血脈的時候，出電影院，我感覺就很爽，有舒壓到。）


  幸好這是最後一集了，以後不要再出了。


  編劇沒有能力，就別寫這種熱核戰爭的劇情，鋼鐵雄心四的MOD，TNO的劇情都比這好。

  （這裡沒瞎雞Ｘ比較，TNO就是有全球核戰）


  劇情並沒有出人意料，全程情理之中。


  智體（生存體）最後變成類似核動力LED燈的東西了。

  放在房間裡當小夜燈，應該很可愛Orz（看起來像是會發光的印章。）



  人人都會拆核彈的劇情也很狗屎。

  （尤其是末日庫那段，我怎不知道工程師還要會拆核彈？

  　這是後端工程師的職能之一嗎？？）


  加百列整天在那到處放核彈（坦白說對伊森的干擾手段實在是沒什麼變化）

  炸藥的當量各種數值膨脹，堪比七龍珠的戰鬥力=_=



  那十字型鑰匙，鋪陳了整個上集。


  結果伊森拿到馬蹄鐵之後，鑰匙就不要了，使得那鑰匙的咖數驟降。

  （整部最酷炫的，坦白說也就那鑰匙而已。）



  大boss加百列死得很潦草，臉被飛機翼划到，然後就摔死了= =。


  本片我認為最無聊的一段，就是飛機纏鬥。


  加百列一直在那晃伊森。靠北，你不是想要他身上的馬蹄鐵？


  萬一伊森被摔到不知道哪裡去，死掉了。加百列要去哪裡找馬蹄鐵？

  他脖子上掛的那根路德的毒藥，直接就沒用了。

  該段我認為邏輯上不可不謂全然無問題。



  國際關係：

  延續上集，一樣對著俄羅斯虛空索敵，儘管美國現實中的敵人是中國，

  可能製片方怕在中國禁映，不想跟錢過不去，所以2025年依舊在作冷戰敘事。


  俄羅斯儼然成為好萊塢所有英雄主義、民族主義電影的假想敵。

  就算冷戰已經結束這麼久了。



  ＊＊＊



  關於本片（致命清算＋最終清算），如果不看2只看1的話，致命清算是有懸念的。


  但看完2以後，再回想1，就會覺得1的劇情其實很小丑。

  （您的系列終極BOSS不滅小夜燈，以及被伊森始亂終棄在深海裡的，

  　被全球爭奪，誰碰誰死，

  　但只是用來拿馬蹄鐵的酷炫狂霸跩小鑰匙已上線。）



  看得出來，作為系列終曲，編劇有努力想把過去的系列故事，

  都以串珠的方式串成線。（包括兔腳，還有被貶官到北極圈的美軍軟體工程師。）


  單論劇情，就是一直打，沒有給我新鮮感。

  （且上還有白寡婦的加持，下我是靠對螳螂女的愛在撐~_~）



  若要推薦電影，我寧願推薦別人岡恩版的自殺小隊，或者直接Top Gun2。


  我也絕對不會推薦別人看這部。


  其實我很不喜歡這種我花錢進電影院看完，還要讓我再花時間抱怨的作品。


  這並不解壓，反而使我感到很增壓，有種煩躁感。


  但我覺得，如果是跟有整個系列都有看完的家人一起進電影院看的話，

  可以當成一種目送自己的青春離開的儀式啦，紀念意義居多。

  （我凌晨一點衝的夜貓場，當然是自己去。）



  ＊＊＊



  小亮點：Mind Hunter的Bill tench探員，赫特麥卡蘭，

  在這部有演應該是某位部長級人物，主張要對世界各國射核彈的鷹派。


  （說到熱核戰爭這大背景設定，影片一開始就撲天蓋地而來，一堆末日論、末日邪教，

  　弄得事態很嚴重似的，如今回憶起來，除了想笑以外，沒別的想法orz）


  謝謝最終清算，這一季已經沒有再進電影院看電影的熱情了。



  這種龐大敘事的設定，可能並不是好萊塢的編劇（或者不可能的任務的編劇）

  所擅長的好球帶。（奧本海默一樣龐大敘事，我看完之後就沒這種空虛感。）


  也許諾蘭導演的作品是個例外。


  --'
