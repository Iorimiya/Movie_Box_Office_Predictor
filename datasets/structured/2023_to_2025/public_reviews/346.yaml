url: https://www.ptt.cc/bbs/movie/M.1747418318.A.D83.html
title: '[負雷] 不可能的任務最終清算'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  前面先說明一下，我覺得喜歡這個系列的人一定還是會去看，也應該去看，但是我不知道

  有多少人會有跟我一樣失望的感覺。


  15號晚上去看了首映，

  電影片長將近三小時，但坦白說我看完非常錯愕，

  我覺得跟這部比起來，「死亡清算」可以說是劇情非常豐富。

  我相信有可能是因為上一集對失利，他們大幅改寫並且補拍了某些東西，要讓這一集有那

  種總結三十年的感覺。

  但我覺得好難看….

  「最終清算」基本上沒有推進任何事情，前一集鋪陳很久而且演給你看它有多強大的「生

  存體」，在這一集只變成了一個前提，

  在伊森帶著團隊努力的過程之中完全沒有任何跟他們對抗的情節，只是不斷當作背景故事

  在試圖掌控各國的核武器庫，

  伊森的目的只有「拿到硬碟，植入毒藥丸、阻止生存體」。

  於是我們看到非常多人皺著眉頭、認為末日將近

  （這部分絕望沈重的感覺我覺得是有營造出來，但我甚至已經不確定那個絕望感是因為電

  影處理得很好，還是我在過程中感到情節完全沒推進的不耐煩），

  然後幾乎每一段戲都是一堆人站著或坐著開會、交代情節，

  重點的兩場超大型動作戲，是很厲害、非常豪華沒錯，

  但是也演太久了吧？？

  我們看到伊森一層一層深入潛艇、克服困難，拿到硬碟，

  並且幾乎身亡的瞬間被葛莉絲所救，

  （他看待減壓病的幾乎無視的感覺，比巨齒鯊2裡面傑森史塔森在超深海下面游泳還隨便

  ）

  然後末段戲雙線進行的拆彈/剪線和伊森與飛機搏鬥的戲幾乎進行了半個小時，那個長度

  跟節奏冗長得讓你真的可以說是完全把緊張感消磨殆盡變得很不耐煩，

  我覺得這兩集阿湯哥為了挑戰特技做的努力讓他忽略了「大多數的一般人不在乎你特技有

  多難」，

  我知道這些特技親身上陣、實景拍攝非常非常困難而且偉大，

  但這不能讓你忽略電影真的很無聊的事實。

  這一集試圖總結過去全系列的重大事件然後收攏在一起，

  但我真的覺得很可惜，

  我在乎伊森這個角色情緒跟遭遇，似乎停留在第六集的結尾戲之前，每次講到他的感情、

  他的奉獻精神都很感動，但只停留在他與前妻重逢後，

  在那之後所有的故事走向和發展好像都只是為了讓他挑戰大型特技，

  第七集法鼓山掛掉之後你這一集馬上就跟葛莉絲打得火熱？！

  這樣你跟前妻跟法鼓山都不是用情很深嘛。


  本文帶著很多個人情緒，因為我實在是覺得很可惜，

  當然這部電影絕對在大型動作上面表現得很出色，

  可是就像是所有情節、所有配角都只是讓伊森成就他一個人挑戰體能王、美國成龍的祭品

  。




  --'
