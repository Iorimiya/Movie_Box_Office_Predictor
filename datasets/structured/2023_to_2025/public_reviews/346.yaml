content: "先講優點\n\n1.  動作特效橋段 誠意做足 給你滿滿的阿湯哥\n\n    建議一定要看imax 或 screen X\n\n\n再來講我覺得不足的部份\n\
  \n\n1.  有一些以前的老角色回歸賣情懷 像是第一集的衰尾探員\n\n      但我覺得還不夠多 像鷹眼和前妻茱莉亞可以請一下\n\n      尤其是這一集多次提到用兔腳去救茱莉亞\n\
  \n      結果茱莉亞沒回歸 有點失望\n\n\n2.   有些地方劇情縫合的非常明顯  很突兀\n\n      有點在看獵人克萊文那感覺\n\n   \
  \   像是搭魚鷹機 遇到俄羅斯航母 阿湯選擇跳海\n\n       馬上遇到俄亥俄級的diving crew\n\n      二話不說就直接電擊阿湯哥帶走\
  \ ？？？\n\n      還有第七集追擊阿湯的探員\n\n      突然說自己是第一集組長Phelps的兒子\n\n      電影最後還槍口對準阿湯哥\
  \  想說內鬼出來了\n\n       結果只是把槍遞給他 然後握手？？？？\n\n        布希號航母的女艦長 一直提到1996的事\n\n    \
  \    結果我去查第一集名單 根本沒有這個人\n\n        那提1996的原因是？？？\n\n        還有共存在反派和阿湯哥記憶中的女人\n\n\
  \       電影三番兩次出現 到最後也沒解釋女人是誰\n\n\n3.   這次電影宣傳說是阿湯最後一集\n\n      但是結尾只是阿湯哥跟新招來的組員\n\
  \n      在街頭相視而笑  這結局根本和前幾集差不多\n\n     沒有什麽太明確ending point\n\n      所謂最後一集 是宣傳花招吧\n\
  \n\n\n\n\n\n\n\n\n\n--"
