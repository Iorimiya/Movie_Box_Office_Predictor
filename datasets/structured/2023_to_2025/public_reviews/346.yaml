title: '[負雷] 不可能的任務：最終清算 錢都花在特技上'
content: '雷文防雷資訊頁


  做為2-8集都在電影院支持阿湯哥的人(1 年紀太小沒進影院看)


  這集看得很失望


  編劇對於AI的想像還留在80年代吧...


  2008年的 eagle eye 對於AI叛變這件事描繪得比這部好100倍


  再近一點的 復仇者聯盟:奧創紀元 也比這部好太多太多


  整片預算高達4億美元 隨便拿個1萬美元找個資訊顧問


  就不會寫出如此爛的劇本好嗎?


  1萬美元還不夠阿湯哥跳一次飛機呢...


  這是科技動作片 不是老人科技幻想動作片好嗎?


  老實說 第7集我看的是還滿過癮的


  可能最終BOSS沒出來 還是抱有幻想的...


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  片頭一開始 接任務 找螳螂女 很IMF 沒啥好吐槽的


  然後被老蓋抓走 假裝吞毒藥丸 這邊也很猛


  但是 老蓋看到伊森開始反抗 第一反應不是上去扁他


  而是轉身逃走?????


  放任一群手下雜魚被伊森痛扁 自己明哲保身???


  說好的用葛雷斯威脅伊森呢???


  然後什麼爛AI 能夠入侵任何系統的AI


  要跟人溝通居然是躺進一個休眠倉???


  看看2008年的eagle eye 電話直接打給你


  不聽就打給你旁邊的人 這才屌好嗎??


  然後大蠢蛋伊森就躺進這個休眠倉


  莫名其妙感覺很痛得讓AI展示未來畫面給你看


  這時候伊森才知道AI要去末日庫


  但AI憑什麼威脅 伊森幫他去末日庫我實在不知道


  全人類安全? AI進去了 全世界才不安全吧


  它進去就要射核彈耶???


  路瑟拆彈那邊很感動沒錯


  但是 對於毒藥丸 的運作完全錯誤


  應該把馬蹄鐵形容成 具有關閉AI的安全金鑰才合理


  不過這個金鑰在敵對國家的潛艇內就很不合理了


  所以才說是原始碼 但是AI才不靠原始碼運作好嗎?


  而且寫一個針對這個AI的病毒沒問題


  但是憑空想像它的原始碼內容然後寫一個對應的病毒就很有問題了


  好 就當取得原始碼是必要的好了 毒藥丸就是病毒好了 我們繼續看下去


  然後進入指揮中心使用相信我之術 很多人吐槽過 就不吐槽了


  重點是這邊能看到各國核武庫的情況 先留伏筆 不吐槽


  然後中間一堆可能的問題 真的是讓人覺得 伊森的賭運太好了(?)


  小島上的劇情很IMF 不用吐槽


  但是潛艇上 不知哪來的雜魚 深陷邪教 所以決定幹掉伊森


  這邊又扯出 AI邪教 但是整部電影都沒說邪教怎麼來 怎麼產生 目的是什麼


  全靠觀眾腦補


  然後潛體裡面真的滿刺激的 可以加分


  最後從冰面下救出伊森大大的時候


  我知道導演是想給觀眾福利


  但你是剛剛從冰底下被救出來的死人


  可以不要拍得好像救完順便打了一ㄆ嗎?


  最後才解釋 到底要怎樣幹掉AI 結論是要把它困在一個最高科技的隨身碟內


  哈囉 路瑟在山洞內手搓出世界最高科技隨身碟 我就不跟你計較了


  我就當作他叫 路瑟史塔克


  但是把AI困在隨身碟內的點子是哪個天才想到的???


  隨身碟能運作嗎?


  美國隊長2好歹給了左拉博士一整個山洞的主機


  說他的意識都在這些主機裡面


  你不說整個末日庫的主機要放AI 反而說把AI放入一個隨身碟???


  你在搞笑嗎??


  然後困住AI的關鍵是拔除隨身碟???


  跟AI拚手速???


  你是喝了多少才能寫出這樣的劇本???


  然後 到末日庫 大家詢問為什麼沒人


  伊森居然說因為大家知道末日了 都回家去了


  請問有人鋪天蓋地的宣傳末日要來了嗎? 電影沒交代阿


  老蓋跟伊森在飛機上的打鬥 太冗長


  爬一台飛機就夠了你還爬二台


  最後老蓋劇情殺 還在飛機上的伊森不趕快把毒藥丸插進去


  還有空跳傘然後再插隨身碟 你是覺得自己不夠忙是不是?


  然後隨身碟插進去就能馬上發揮效用 瞬間完成整個網路的殺毒


  這劇本也是頂天了 沒有一個資訊人員敢這樣寫


  奧創好歹被星期五在網路上亂殺 很久之後才完全消滅阿


  然後最重要的是 一群人在伺服器那邊亂接線 這樣就能入侵伺服器?


  然後 綠燈之後的100毫秒 就能把AI全部傳輸進去那顆發光的隨身碟??


  請問隨身碟介面是用多粗的光纖? 讓現在動輒幾TB的AI瞬間傳輸完成??


  然後 指揮部那邊在說要先下手為強 轟爛別國的核武庫


  我才知道 核武都被搶了 這幾個國家沒開過高峰會???


  還是被搶的不知不覺 所以不用開?


  那美國怎麼知道其他國家核武被搶了?


  還是其他國家核武其實都在美國的控制之下


  所以他們自己不知道被搶 但我美國知道


  另外就是 另外一個AI邪教特勤雜魚開槍 居然沒打到


  槍法這麼爛做什麼特勤 難怪該死


  美國總統又是什麼爛玩意 打到你 指令不繼續講就算了


  沒打到你 到底為什麼不先把放棄發射的指令講完????


  不過反正沒射就算了...


  最後莫名其妙的 在大街上交接發光隨身碟


  ㄟ 不是 這危險的東西為什麼不馬上銷毀


  在大街上交接 然後準備讓人家搶 好拍第9集是不是???


  這部片如果能花一點錢 找個資訊顧問 安排一點合理的劇情


  我相信不會這麼的不堪...


  最後 讓伊爾莎領便當真的沒啥必要


  就算她不拍 不出場就好了 幹嘛發便當呢?


  總之...我個人心目中的不可能任務排名


  3 > 4 > 5=6=7 > 1=2 > 8


  這樣吧


  最為一直以來不可能的任務的忠實觀眾


  我希望某個平行世界會有 eagle eye的編劇


  來幫助阿湯哥拍好不可能的任務7&8


  --



