url: https://www.ptt.cc/bbs/movie/M.1747876183.A.D2D.html
title: '[負雷]  不可能的任務:最終清算 這系列該結束了'
content: '不可能的任務:最終清算看完了，全系列都看過，但劇情沒在記，最好看是第四集，鬼影

  行動。

  覺得這系列還是到此為止就好。


  以下是給負雷的主因




  雷文防雷資訊頁













  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  整集台詞一本正經的講幹話，台詞又太多解釋性對話，煞有其事講個AI滅世。

  上一集和這集是連貫的，劇本用AI會毁滅世界，從上集就是走歪，這集用實體硬體運作處

  理的解決方式，真的很瞎。

  其實就看阿湯哥表演打戲和特技而已。

  票房看來還不錯，但劇情太瞎，主角威能太明顯。



  我對上一集評價較好 (致命清算) 雖然有點寬鬆

  如果連同這集(最終清算) 做比較


  致命清算還是贏最終清算


  超粒方覺得最終清算好一點

  但我聽他在屁 這集比上集更差

  沒有什麼團隊感 也沒面具變臉


  雖然最終清算塞了一些系列的彩蛋

  還有解釋兔腳是什麼

  但整片看就特技，而解釋性台詞佔比例過多，打戲就顯得太少



  都有看系列的情況下，覺得是該結束了。

  個人喜好

  第一集 第四集


  覺得還行 雖然有人不喜歡

  第二集 第七集


  有看但已忘了差不多

  其他集數


  但我不喜歡追車 看到睡著

  應該是第六集


  第八集是最爛的 沒有睡著

  但哪一堆台詞 覺得啥小

  毒藥丸 馬蹄鐵 XXX啥小的濳水裝置

  正常人講不出的 不可能的台詞




  --'
