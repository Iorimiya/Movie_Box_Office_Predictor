url: https://www.ptt.cc/bbs/movie/M.1747466875.A.47F.html
title: '[好雷]不可能的任務:最終清算'
content: "先上人權圖\n\n\n先說結論：還算好看！\n劇情算緊湊，也是將這個系列作品做個收尾。如果不太熟這部系列作的人，來看也不太違和\n。\n\n劇情任務簡易說明：\n\
  一開場就經典橋段“任務說明”但此次是總統的訊息。後續即與伊森小隊展開任務！！ \n為避免「生存體」因駭進各核武國的核彈系統中，發生核武大戰導致人類毀滅。\n手握關鍵鑰匙的伊森，必須找到俄羅斯的潛艇並且把「生存體」的原始碼取出，結合路德做\n\
  的病毒，散播到世界各地。再搭配散播的時間差，再將諾亞方舟機房電源關閉，同時再將巨\n大容量的隨身碟拔出，將「生存體」關在巨型隨身碟中。 (實際執行內容看電影比較刺激)\n\
  \n感覺清算系列要告訴大家人性的貪婪，大家都想掌握「生存體」進而得到世界至高的權力。\n就因為「生存體」知道人性如此，便讓人類互相殘殺，自取滅亡。但伊森知道此點便將「生\n\
  存體」收好，沒落入任何人手中。(應該啦！不知道會不會有下一集)\n\n本集一開場就將任務內容交代清楚，感覺到上一集的內容除人物介紹、精彩特技外，其餘如\n雞肋。\n\
  因為本集各段落都會帶到一些上一集或系列作的因果關係。\n\n劇情記憶點/看點:\n1.女刺客沒死並加入伊森小隊，因為他要殺了蓋布瑞(是有多恨啊！)\n2.葛瑞絲：不再中二，反倒成為好幫手，還救了伊森一命(拍攝角度五告讚！！)\n\
  3.蓋布瑞：因為任務失敗，所以被「生存體」蛋雕。本集變成要取得「生存體」進而掌握世\n界的貪婪人物。\n4.布里格斯：一直要抓伊森的幹員，原來他爸是伊森的師傅，這集要和伊森清算他爸死掉的\n\
  恩怨！\n5.班吉：不再搞笑，可以自己帶隊順利執行任務，可喜可賀！！\n6.驚喜出現的“威廉唐納”，被發配邊疆30年終於出現！！ 沒想到他早就知道「生存體」\n\
  並發出預警，但沒人理他@@ 這集成為關鍵Keyman，並在後段也是得力幫手！！\n最終與伊森見到面時，沒有怪他反倒覺得這一切都是好的結果啊！\n7.路德：依舊沉穩可靠，並在劇情的最後，將伊森的存在做出最佳的詮釋(有點小洋蔥啊！)\n\
  8.主角伊森：除了主角威能、體能勁爆外，依舊帥氣！！劇情中登航空母艦有要開F16 的錯\n覺、片尾的飛機狗鬥根本是捍衛戰士，只差沒緊急煞車讓後機衝出去。\n最後在英國的運鏡與畫面，讓人有換了些人，繼續下一季的感覺。\n\
  \n--"
