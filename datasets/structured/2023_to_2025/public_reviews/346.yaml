title: '[討論] 不可能的任務：最終清算一個小問題'
content: '反派蓋布歐跟咱們飛官阿湯哥尬飛機


  想當然爾    論飛航技術絕對輸慘被屌打


  但在空中追逐時


  我在想蓋布歐知道阿湯哥有馬蹄鐵


  自己身上有毒藥丸


  所以一開始就知道阿湯哥會一直追著他


  所以蓋布歐只要等馬蹄鐵自動上門就好


  然後就可以完成控制生存體的計畫


  不過在尬飛機時 蓋布歐拼命想甩掉阿湯哥


  可是阿湯哥身上有馬蹄鐵…中途人掉下去 馬蹄鐵也跟著下去


  那最後贏家不就又回到生存體了嗎


  蓋布歐那時候是怎麼想的？先殺後再找失落的馬蹄鐵？


  --

  Sent from nPTT on my iPhone 15


