url: https://www.ptt.cc/bbs/movie/M.1747568940.A.E22.html
title: '[普負雷] 不可能的任務-最終清算'
content: '不可能的任務阿湯哥版最後一集了，發篇感想

  以下無劇透


  本部是完全的動作片，沒有任何諜報要素，一樣有團隊合作的劇情


  有動作片的所有缺點，反派降智，解任務簡單，配角群無理由的礙事，最重要的是不刺激且拖戲


  配樂無任何亮點，攝影沒有大景，打鬥一般，科技要素一般，有點類似GI-Joe續集


  為過去曾經美好的不可能的任務進電影院

  帶點遺憾的感覺出電影院


  希望這個系列以後還能重啟囉


  --'
