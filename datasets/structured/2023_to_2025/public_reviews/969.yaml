url: https://www.ptt.cc/bbs/movie/M.1718433661.A.9DD.html
title: 'Re: [討論] 《八戒》國、台、客語版，大家怎麼選？'
content: '前天剛看完台語版

  還是提醒一下大家是台文

  我自己本身有學一些台文漢字  常見的都懂

  看字幕還是會有點跟不上

  不過我對第一次看到台灣電影有全台語字幕非常肯定



  但會台語的真的200%推薦台語版

  真的配得超級好

  王識賢真的不用說超級讚

  我也覺得40把八戒的各種情緒配得超級到位

  所有卡司都配得很好語氣發音都很不錯

  不用擔心不習慣台語動畫或配得很尬

  完全不用



  也應該有不少人會擔心台語會跟不上的

  我的經驗是電影一開始資訊量很多

  也很多不常用的詞(像是跟科技相關, 但是台語老師都把詞選得非常到位, 很順)

  再加上一開始配樂特效偏多  聽不清時就會比較依賴字幕

  (但字幕又是台文又比較辛苦)


  但是大概15分鐘過後劇情也入戲了

  就可以完全不用看字幕了  好好享受台語配音

  他真的是全台語  除了一首歌是華語外你聽不到任何一個華語詞


  只要平常聽得懂家裡的人講台語的  就算自己不會講也能去看了

  後面句字都是用生活用法  又可以順便學一些新台語字彙

  拿捏的很好  看到後面很入戲後回過神來才發現你是在看一部台語動畫

  但竟然自然到一點也沒感覺特別


  因為覺得語言部分水準很高  動畫劇情也都很有水準

  當然要挑問題還是有  但看完真的會對台灣動畫很有信心的程度

  所以特地上來推薦


  不過看場次覺得應該台語版很快就會下檔

  連南部的場次都很少

  有看到好幾組人是帶長輩去看的

  不知道長輩反應是如何

  但有興趣的還是可以去支持一下




  --


  附註一下電影基本上使用的是台語漢字不是羅馬字

  但台語漢字的寫法跟華語寫法也都會不同

  所以也有一點門檻


  舉例像是 "真美" 會寫成 "誠媠"

  當然如果不懂台語漢字但原本就聽得懂台語的

  這部戲是沒問題的



  我自己是肯定用全台語字幕這件事

  台語漢字現在有在推廣  未來如果會的人多了這部動畫就有了跨時代的意義了

  (我認為未來這部應該也有機會成為學校教材之一)

  其實台語漢字會"講"的人應該是無痛學習啦

  但這篇是在講電影不是在聊學台文字  就不離題了



  在這裡討論的人都是以台語文字(無論漢羅)為正常文字在討論

  並且台語識聽程度我認為對本部電影的理解及感受也有相當的差異

  我想導演分成不同語言不同字幕也是有用意的'
