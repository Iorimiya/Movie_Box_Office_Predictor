title: '[  雷] 大天蓬'
content: '《大天蓬》是由代藝霖執導，應昊茗、王藝哲、連凱、徐鼕鼕、徐少華、張玉軒、戴安娜

  、岳冬峰等主演的魔幻西游題材電影。

  該片在西游原著的基礎上顛覆並創新「天蓬元帥」的人設與愛恨情仇，講述了天蓬元帥跌

  宕起伏的人生經歷與奇幻的愛情故事。




  劇情簡介：孫悟空（張玉軒飾）大鬧天宮，天蓬（應昊茗飾）與之交戰打成平手，孫悟空

  被壓五指山後，天蓬元帥領命下界擊殺孫悟空以絕後患。在人間的天蓬巧遇捉妖師寶兒（

  王藝哲飾）與她的捉妖團，幾人一行上路尋找五指山，過程一波三折，天蓬大起大落，歷

  盡劫難後悟得大愛，終成長為大天蓬。


  心得：原本只是想找歌來源聽

  結果原來是電影的主題曲（怕什麼天道輪回

  什麼魄散魂飛）意外的發現了這部電影

  版上也沒人討論

  整體來說算有點俗套好猜的劇情吧

  但不可否認是我看過的史上最帥的豬八戒了

  男主發誓寧願變豬也不會喜歡女主那邊

  看了既心酸又覺得好笑

  最後天篷元帥守護女主故鄉500年

  直到三藏師徒出現  八戒臨走前

  抱了長得跟女主一模一樣的高翠蓮

  也算是一個完美的結局

  有大話西遊的即視感

  如果喜歡西遊的改編作

  這部真的還可以

  但我整體只會給50-60分






  --'
