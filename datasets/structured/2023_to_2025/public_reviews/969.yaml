url: https://www.ptt.cc/bbs/movie/M.1698508020.A.68C.html
title: '[新聞] 許光漢聲援台灣動畫化身豬八戒'
content: "許光漢聲援台灣動畫化身豬八戒\n\n04:10 2023/10/28 中國時報 孫伊萱 、 翁紫曦\n\n\n金馬60表演論壇邀請到入圍本屆最佳男主角的許光漢，分享表演甘苦談。\n\
  （金馬執委會提供）\n\n金牌監製湯昇榮聯手導演邱立偉打造台灣原創動畫電影《八戒》，靈感取樣自古典奇幻小\n說《西遊記》，配音陣容相當吸睛，許光漢聲演「賽博胖客八戒」，劉冠廷化聲「理工男\n\
  三藏」，庾澄慶獻聲演出「火爆護衛悟空」，邵雨薇甜美嗓音聲演「女機器人小淨」，庹\n宗華、許展榮、許展瑞、鍾欣凌、魏如萱也加盟演出。\n\n許光漢近期行程滿檔，仍撥空為動畫配音，笑說從來沒想過會配音「八戒」這個角色，印\n\
  象中的豬八戒是聰明、有點好色，但劇本卻讓他大改觀，「跟我想像的截然不同，非常有\n趣！我和這個八戒性格純真、擁有赤子之心的部分很像。」成果也讓湯昇榮大讚：「許光\n\
  漢親民又靈動，為八戒創造了一個鮮活又迷人的靈魂！」\n\n此外，「金馬60電影論壇」將於11月23日舉辦「表演論壇」與「新導演論壇」，邀請本屆\n金馬獎最佳男主角與新導演入圍者齊聚一堂，暢談表演與創作的甘苦與心得。5位準影帝\n\
  《關於我和鬼變成家人的那件事》的許光漢及林柏宏、2度挑戰金馬影帝的阮經天、首度\n提名金馬的吳慷仁、本屆台北電影節影帝王柏傑，將面對面交流表演心法，分享詮釋角色\n\
  過程中遇上的種種挑戰與突破。\n\n#論壇 #表演 #配音 #許光漢 #金馬\n\n--\n佛教經典的\n是 是菩薩成佛之道\n        是 佛經\n \
  \ 是 佛        是 菩薩\n\n\n\n--"
