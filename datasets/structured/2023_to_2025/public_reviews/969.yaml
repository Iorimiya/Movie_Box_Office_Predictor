url: https://www.ptt.cc/bbs/movie/M.1712323065.A.3AB.html
title: '[新聞] 許光漢新身份曝光！帥哥變豬頭最帥八戒'
content: '動畫電影《八戒》破天荒集結史上最華麗全明星配音陣容，許光漢化「聲」主角「最帥

  八戒」，搭檔「理工男三藏」劉冠廷，並與庾澄慶、邵雨薇、庹宗華、魏如萱獻聲飆戲。



  在第60屆金馬影展舉辦世界首映後，口碑相當強勁，被讚為近10年最強台灣動畫電影，

  更榮獲第60屆金馬獎最佳動畫長片肯定。



  亞洲男神許光漢近期新片《青春18x2 通往有你的旅程》票房亮眼，不止跨齡演技受到

  肯定，許光漢也曾於奧斯卡金像獎最佳動畫長片《蒼鷺與少年》為靈魂人物「蒼鷺」

  一角配音，富有磁性的魔力聲線瞬間引人進入魔法世界氛圍，獲日本吉卜力工作室認

  可。其實早在《蒼鷺與少年》之前，許光漢就已先為《八戒》獻出動畫配音處男秀。


  許光漢為了聲演八戒煞費苦心，並與導演邱立偉討論，特別為角色設計專屬聲線，

  許光漢說：「要關在錄音室專注，花好幾天的時間完全沉浸、投入配音角色裡面，必須

  花費很多肺活量和心力。我覺得八戒這角色很有趣，個性調皮，行為想法很跳tone，

  所以跟導演、聲音老師一起設計了一些豬叫聲、呼吸聲、喘息聲，現場大家也覺得蠻

  好玩的。」經歷過一輪聲音表演技巧訓練，許光漢展現過人天賦，精湛表現被導演邱立偉

  大讚：「許光漢專業又敬業，逗趣的表演更是超乎想像！」


  《八戒》：決戰未來劇情描寫科技與數據主宰一切的未來世界，舊城區人人嚮往移居

  以最新科技打造的「新世界」，然而唯有貢獻值最高的菁英，才有資格入住。八戒（許光漢

  配音）是一個擁有街頭智慧卻常搞砸事情

  的魯蛇，為了讓奶奶到新世界過上好日子，違背良心與建商總裁牛魔王（庹宗華 配音）私

  下進行交易。



  電影《八戒》將在5月31日全台上映。


  ———————————————————————


  補充《八戒》的預告片與片中角色分配



  三藏—劉冠廷

  小淨—邵雨薇

  悟空—庾澄慶

  豬奶奶—鍾欣凌

  蜘蛛精—魏如萱

  金/銀角—許展榮、許展瑞


  心得：去年金馬獎的得獎動畫，總算敲定院線檔期了，恭喜！也感謝甲上娛樂


  --'
