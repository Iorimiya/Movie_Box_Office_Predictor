title: '[新聞] 八戒票房爽開紅盤 灌籃高手搶進平台'
content: "八戒票房爽開紅盤 灌籃高手搶進平台\n\n2024/06/04 05:30\n\n\n庾澄慶聽到「《八戒》決戰未來」票房開出佳績，笑喊功勞歸給「悟空」。\n\
  （甲上娛樂提供）\n\n〔記者廖俐惠／綜合報導〕金馬最佳動畫「《八戒》決戰未來」國語版上週五（31日）在\n台上映，衝上新片票房冠軍，全台票房累積破410萬元，刷新近年台灣動畫電影票房佳績\n\
  。至於台語、多元語版將於6月7日接力推出。\n\n\n《灌籃高手THE FIRST SLAM DUNK》將在下週登上Disney+。（Disney+提供）\n\n\
  「《八戒》決戰未來」集結許光漢、劉冠廷等19位明星卡司配音，上映前就備受矚目。對\n於電影開片成績亮眼，為悟空配音的「哈林」庾澄慶聞喜訊笑說：「應該都是老孫的功勞\n\
  吧？還是我誤會了。」導演邱立偉則開心直呼：「像是美夢成真，心情很激動！謝謝大家\n，希望有更多人看到我們的努力。」\n\n另一人氣動畫劇場版《灌籃高手THE FIRST\
  \ SLAM DUNK》，以4.58億成為2023年全台年度\n票房冠軍，日韓搶先宣布將於串流平台上架，讓台灣影迷相當著急，一直到昨天Disney+\n才正式發布新聞稿，宣布電影將在6月10日於台灣Disney+上架，透過小螢幕也能看到湘北\n\
  隊、山王隊的精彩戰役。\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--\n\n\n\n\
  \n\n\n佛教的。\n\n\n佛法的。\n佛法是假裝佛法。\n\n馬哈希尊者《毗婆舍那講記(含法的醫療)》說明如何修增加智慧斷除所有煩惱。"
