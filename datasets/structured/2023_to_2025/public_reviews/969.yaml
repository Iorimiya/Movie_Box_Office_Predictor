url: https://www.ptt.cc/bbs/movie/M.1717168943.A.75E.html
title: '[新聞] 許光漢為八戒配音 試103種豬叫聲'
content: "許光漢為八戒配音 試103種豬叫聲\n\n2024/05/31 05:30\n\n\n許光漢在外地工作無法親自為「《八戒》決戰未來」宣傳，但仍心繫票房。（甲上提供）\n\
  \n〔記者許世穎／台北－首爾連線報導〕工作滿檔的許光漢透過視訊連線，為獻聲的動畫電\n影「《八戒》決戰未來」接受台媒訪問，除了笑撇「亞洲公共財」封號，不忘關心這兩天\n\
  地震頻傳的台灣是否還有餘震，暖心問候：「狀況都還好嗎？」片中會對奶奶撒嬌的他笑\n說戀愛時也會和另一半撒嬌，被追問細節時難以招架，當場害羞。\n\n提到這次為「豬」配音，許光漢直說和奶奶撒嬌的戲比較難，「因為撒嬌的聲線要比較可\n\
  愛一點，我要到達那個聲線要花很多力氣。」更笑言片中大概嘗試了103種豬叫聲，講完\n立刻調皮道：「開玩笑的啦！」\n\n\n許光漢為八戒（左）獻聲配音，片中與奶奶相依為命，常對著奶奶撒嬌。（甲上提供）\n\
  \n片中八戒和奶奶的戲也讓許光漢想到與家人的互動，更透露外婆已經105歲了，每次見面\n都覺得她好像又老了一點點，「會很感嘆，因為工作很忙，每次回去就會看到她白髮、細\n\
  紋更多了，很心疼。」至於本身是個會撒嬌的人嗎？他害羞表示偶爾會，甚至有另一半時\n也會跟對方撒嬌，講話還會疊字。\n\n近期許光漢因工作持續當「飛人」赴日本、南韓等地，他形容兩國除了文化不同，粉絲個\n\
  性也差很多，像是日本粉絲比較內斂，南韓粉絲相對熱情，「他們每次都會舉一些不同創\n意的牌子，我還看到有人寫說要把我的護照撕掉，讓我留下來！」說完更忍不住笑說：「\n\
  我有好好保管（護照）。」\n\n最後除了關心台灣地震情況，許光漢也表示希望電影上映時票房都一切順利，「我會叫公\n司的人都去看，還有他們的家人們，我沒辦法強迫兄弟們都去看，但是會口頭建議他們，\n\
  看他們誠意囉！」更說非常期待趕快與大家見面。「《八戒》決戰未來」今天在台上映。\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛 \
  \       是 菩薩\n\n\n\n--"
