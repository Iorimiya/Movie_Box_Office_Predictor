url: https://www.ptt.cc/bbs/movie/M.1717653566.A.DFD.html
title: '[極好雷] 《八戒》決戰未來:我一直覺得XXXX是個X'
content: "【《八戒》決戰未來】 電影主題曲: 《借》魏如萱\n\n\n八戒 PIGSY Facebook粉絲專頁 \n\n非工讀生 認證 \n\n雷文防雷資訊頁\n\
  \n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\n看完電影後，我一直在想 2+1 個問題：\n\n\
  (1) 如果八戒奶奶沒有也在消失的人裡面的話，那八戒的想法還會改觀嗎？\n\n(2) 就像牛魔王自己自白的：\"只不過是想要多一點點時間而已\"，\n    就我看起來，整個故事裡面沒有很顯性的將人物分成好人跟壞人，\n\
  \    既然故事想要傳達的一個論點是：\"大家都是一起的\"，\n    那這樣子如果是我的話，我會是讓牛魔王有被特地拉起來，而不是就直接沒有戲份。\n  \
  \   — 牛魔王同樣都是會\"消失\"，那用哪種方式消失，會比較圓融一點？\n\n(3) 同性族群，不是只有男男而已，也是會有女女，\n    不過我只有注意到\
  \ 男男族群而已。\n    除非是我搞錯了，團隊並沒有把男同元素給一併放進來。\n\n\n\n\n『我一直覺得情緒管理是個屁』 by 悟空 / 庾澄慶\n\n\
  看完電影後，我認為台灣的動畫是有未來的，\n而且整部電影呈現出來的品質很細膩，找不到什麼破綻，\n而且我有注意到其中一幕，在跑步的過程中，揚起的風沙那種\"誇飾\"\
  ，也有呈現出來。\n故事碰觸到很多的議題，但有用完整不亂的方式敘述。\n除了畫面呈現之外，聲音也搭配得很好，沒有\"自己做自己的\"的方式呈現。\n雖然我看完之後一直在想上面的兩個問題，但我完全尊重團隊這樣子的呈現方式。\n\
  \n網路上有很多對於電影的介紹，\n而我不會排斥再繼續跟不同的人一起看這部電影/\n我會願意用我自己一個拉一個的方式去支持團隊，\n下個禮拜，我也會特地再進戲院聽台語\
  \ = 我的母語 版本的電影。\n\n我只有從前面的[好雷]文知道大概的劇情，\n但我沒有想到從中間就開始會邊看邊哭 —_—\"，\n雖然我是沒差，但應該會需要特地帶衛生紙進去擦\
  \ 才是的。\n\n--\n# 感謝軍警消醫護，辛苦了\n# 歲月靜好，是因為有防疫隊負重前行\n\n--"
