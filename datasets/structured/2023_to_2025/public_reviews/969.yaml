title: '[討論] 豬八戒傳說這部的主軸是什麼'
content: '昨天因緣際會看到豬八戒傳說的影評


  可說是負評連連


  但影評人是香港人可能會偏頗


  結果查了一下豆瓣只有2.3


  可見連中國人都不買單


