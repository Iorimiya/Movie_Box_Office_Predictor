title: '[情報] 《親愛的家人》上映戲院列表'
content: "來了\n\n日本感人賣座14.7億！\n\n改編自真實故事《》\n\n9月5日(五) 全台上映\n\n\n\n女兒餘命10年，一定要為了她打造出人工心臟！\n\
  \n  網友4.2星好評推薦，動人賣座14.7億日幣！\n\n改編真實故事，刻劃拯救17萬人的醫療器材誕生之血淚紀錄！\n\n《我想吃掉你的胰臟》導演月川翔ｘ《線：愛在相逢時》編劇林民夫攜手打造動人鉅獻！\n\
  \n《新解釋 三國志》ｘ《惡女花魁》ｘ《即使，這份戀情今晚會從世上消\n失》精彩共演！\n\n\n1970年代，經營著小型工廠的坪井宣政（ 飾）和妻子陽子（ 飾），他們\n\
  的女兒佳美（ 飾）罹患先天性心臟病，從小就被宣告只剩下10年的生命。\n\n所有醫療機構都表示佳美的病無法醫治，宣政為了女兒佳美，下定決心要自行製造人工心\n\
  臟。在無任何知識與經驗的情況下，幾乎不可能開發出醫療器具，因此宣政與陽子為了救\n女兒一命而努力鑽研學習，他們還求助於專業人士、籌措資金，為開發醫療器材奔走多年\n\
  。\n\n然而，佳美的時間似乎所剩無幾…….\n\n--"
