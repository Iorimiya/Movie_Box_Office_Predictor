url: https://www.ptt.cc/bbs/movie/M.1674419460.A.54B.html
title: '[新聞] 仇恨謎林17分鐘群戲一鏡到底 坎城獲好評'
content: '新聞網址：







  曾以電影「4月3週又2天」斬獲坎城影展金棕櫚獎的羅馬尼亞導演克里斯汀穆基，新作

  「仇恨謎林」以17分鐘、26名演員群戲的長鏡頭，再次驚豔坎城影展，更暗喻國家潛

  藏風暴。


  54歲的克里斯汀穆基（Cristian Mungiu）擅長以寫實風格描繪社會現況、針砭制度與

  人性冷酷，是羅馬尼亞電影新浪潮的領軍人物。除了經典代表作「4月3週又2天」外，

  近年他執導的「靈慾告白」、「山之外」、「畢業風暴」等也多次入選坎城影展，並

  獲得最佳導演、劇本、影后等多項榮譽。


  「仇恨謎林」（R.M.N.）是穆基繼「畢業風暴」後，睽違6年再次挺進坎城影展主競賽

  。原文片名R.M.N.為羅馬尼亞語的醫療檢查核磁共振縮寫，作為這個國家現狀所面對

  的潛藏風暴。


  全片故事以歐盟邊陲蕭條、勞動力流失的小鎮為背景，描述原本離開羅馬尼亞遠赴德

  國打工的男主角，因兒子發生意外與充滿歧視的職場環境雙重壓力下，決定返鄉照顧

  兒子。但他以為的純樸故鄉，也早因多民族聚集而暗潮洶湧。


  小鎮裡逐漸累積的仇外與種族主義，終於在耶誕前夕，當地工廠引進薪資低廉的外籍

  移工後浮上檯面，而主角兒子意外的真相，也在這些事件的連鎖反應下撥雲見日。


  片中一場居民在城鎮大會堂展開激辯的長鏡頭，更是在坎城影展引發討論。長達17分

  鐘的群戲一鏡到底，26名演員在鏡頭下，不時的發言、插嘴並互相指責，將當地小鎮

  之間外地及勞資雙方等平時壓抑的矛盾一次引爆。


  精采絕倫的鏡頭調度，也讓全球知名影評indieWire、Time Out都在首映後大為讚賞，

  稱讚「仇恨謎林」是今年度最重要電影之一。


  「仇恨謎林」將於2月3日在台上映。


  （編輯：張雅淨）


  ------------------------------------------------------------------------------


  補充一下「仇恨謎林」台灣的相關宣傳素材(此片代理商為中央社曾經專訪負責人的

  光年映畫，近期發行代表作包括坎城金棕櫚得獎片鈦、奇士勞斯基舊作機遇之歌)


  ．海報︰

