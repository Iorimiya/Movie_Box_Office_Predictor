title: '[好雷] 仇恨謎林（R.M.N.）'
content: '之前上個月有上映但已下檔

  好像比較少人討論

  分享給有看過的人





  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  幾乎就是如同羅馬尼亞新浪潮導演哈督裘德(Radu Jude)在《羅馬尼亞野蠻史》(註）等一

  系列作品探討羅馬尼亞民族性的闡述，以刻意強調自身的「野蠻」映照出歐陸人文主義傳

  統以西歐為中心的「高級」作為嘲諷對象，也順便與近期上映的《桃子樹的最後豐收》同

  樣對歐盟「進步」政策的「偽善」補刀，前者是以推廣綠色太陽能源，卻扼殺了地方農業

  （台灣也同時遭遇類似狀況），與《仇恨謎林》中讓大家思考在當前新自由主義，人成為

  商品的交易市場在全球化的流動下，並基於歐陸的複雜歷史性，與當前以法國、德國等大

  國主導的歐盟政策中，所謂民主與「進步」到底是什麼？



  不看到電影中前段，其實還找不到這樣有些便宜行事、政治正確的看似只是在談「種族歧

  視」的論述施力點。也許《仇恨謎林》更大的野心是在於利用片中常見的畜牧場與屠宰場

  ，與電影片頭主角的兒子在上學途中受到驚嚇，導致而後回鄉父親教導「如何存活下去」

  的技能，帶到電影中多樣化的自然景觀，同時是人類對環境破壞，與居民不小心可能會被

  野生動物的襲擊的矛盾中，又再加上歷史背景：匈牙利與羅馬尼亞的民族糾纏，展開對於

  ，自然/人為的對立中，到底誰才是外來者？與關於「異族」政治性的思考。



  電影片名直譯「核磁共振」其技術原理，利用電磁波撞擊人體細胞氫原子排列，並發出訊

  號用電腦加以接收顯影，在電影劇情中用來診斷主角父親突然昏倒腦中的未知狀況，以及

  電影後段無緣無故在神秘的樹林中上吊自殺。



  片名隱喻過於牽強，似乎也透露導演在創作上概念明確，卻無法在劇本中給出一氣呵成的

  完整性。與至於在探討人與動物、人跟人，這兩組對立的政治關係中，有蠻大的斷裂之感

  。如同中文：「仇恨」與「謎林」兩者並沒有太過明顯的橋接，只能靠觀者腦補聯想；與

  電影從頭到尾保持一致的寫實感，結尾利用突如其來的夢境來作為填補。



  (註）

  關於《羅馬尼亞野蠻史》，有興趣請參考筆者另一篇文章





  --


  拉特飯 - 以商業力量進入獨立市場


  --'
