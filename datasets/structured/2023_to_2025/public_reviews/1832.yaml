title: '[好雷] 仇恨謎林 R.M.N.'
content: "雷文防雷資訊頁\n\n仇恨謎林\nR.M.N.\n2022羅馬尼亞電影\n\n\n\n馬提亞離開故鄉羅馬尼亞遠赴德國打工，兒子突如其來的意外，充滿歧視的職場環境，雙\n\
  重壓力下他決定返鄉照顧兒子。而迎接他的卻是冷漠的妻子及兒子對意外的沉默。他心中\n虔誠純樸的小鎮，竟因三位南亞移工的到來，遭到居民們排斥驅逐。此時兒子意外的真相\n\
  ，也在這些事件連鎖反應下，逐漸撥雲見日……\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\n\
  這部片涉及的議題，令人心有戚戚焉，尤其是對於因為賺錢需要出國工作，卻同時又看到\n故鄉的工作職缺，被一些外國勞工所填補的異鄉遊子工作人而言，更有感吧？本片對羅馬\n\
  尼亞仇外心理問題的精彩洞察，可以當做全球有類似處境的國家的一種借鏡，發人深省。\n本片的結局，相當奇妙及奇特，虛實難分？我又重看了一次，才勉強看懂，自我解讀，可\n\
  能觀眾有各自的見解？\n\n    看完本片的人，可以分享對本片結局的解讀是？\n\n個人滿意度80分（滿分100），對於一些劇情畫面的巧思及呼應，甚至觀眾如我的自我腦\n\
  補的聯結，覺得很有意思。\n\n以下有劇透。\n\n\n\n1.Cristian Mungiu克里斯蒂安蒙吉烏，是當今優秀的羅馬尼亞導演。  2007年，他以代\n\
  表作《4個月3週2天》獲得坎城影展金棕櫚獎而聲名大噪，此後持續製作精彩的電影。本\n片  “R.M.N.”  （羅馬尼亞語：核磁共振nuclear magnetic\
  \ resonance, as the film\nis \"an investigation of the brain, a brain scan trying\
  \ to detect things below\nthe surface\"）同樣是精彩的電影 - 這是一部扣人心弦的\n社會政治議題類型的驚悚片，探討了社會經濟力量和人類情感的爆發點。\n\
  \n2.據網路報導內容而言，本片導演故意不按照美國電影的拍攝方式來拍攝，他本人解釋了\n這部電影的很多內容，雖然影片劇情節奏緩慢，而且一開始很難看懂，但值得看完，因為\n\
  導演在本片結局前，運用了17 分鐘的單鏡頭，一群民眾互相辯論的形式，為觀眾帶來了\n一場非比尋常的對決之劇情畫面，這是電影橋段最偉大的場景之一。 本片描述的事件情\n\
  節，是改編自幾年前在羅馬尼亞社會留下深刻痕跡的仇外心理和仇恨的真實事件。\n\n3.影片首先出現了男主Matthias馬蒂亞斯，他在暴力襲擊了他工作的德國屠宰場的經理後\n\
  回到了故鄉的家，回到羅馬尼亞村莊後，更多的衝突等待著他：長期和他感情疏離的妻子\n，情感上受到傷害的孩子，和一個與他性格背景等迥然不同的情人 Csilla西拉（來自匈\n\
  牙利的知識份子及商業女士）。 導演選擇塑造一個沒有同情心且殘酷的男主角色，他解\n釋說他不想選擇常見的美國式的主角人設，觀眾總是必須理解、喜歡或認同主角。 倒退\n\
  封閉的男主馬蒂亞斯與自由主義的女主西拉之間的對比，主旨在描繪每個人和他人的內心\n鬥爭，理性選擇與動物本能之間的鬥爭。\n\n4.當村子裡發生仇外事件時，這種衝突，每個人的內心都有，但對於村裡的居民，以及兩\n\
  個截然不同的戀人來說，也是如此，且變得嚴重。 導演沒有指責整個群體，而是展示了\n當全球化過程中，被忽視的社區群眾，所面臨無國界市場，就業等方面的對抗性影響時，\n\
  每個人都應承擔單獨的責任，以及意識形態如何發生衝突。雖然本片不是一部面向大眾通\n俗化的電影，但再次成為羅馬尼亞導演的一項非常有價值的成就。\n\n5.主角的家鄉坐落在山脈和森林之間，因多民族而引人注目——主要是匈牙利人和羅馬尼\n\
  亞人，也有一些德國人，本片角色之間的互動，令人著迷，因為他們言語之間無縫轉換，\n描繪了一個組織良好、蓬勃發展的社區。 直到幾名斯里蘭卡工人到達當地麵包店工作後\n\
  ，排外者的巢穴，才開始騷動。本片的劇情鋪墊很強，把所有的片段都安排到位，同時營\n造出緊張的氣氛。 當事情發生轉變時，迅速而強烈地轉變，但幾乎是以一種未表達出來\n\
  的怨恨感為主，這種感覺是由我們主導的情感素養引發的。\n\n6.對於不熟悉“Miorita”民謠或“熊之舞”的外國觀眾來說，對傳統傳說的訴求，可能\n會在翻譯中迷失。\
  \ 男主馬蒂亞斯和女主西拉，性情和觀念等方面如此迥異大不同的男人\n和女人之間的聯繫，缺乏足夠的情感理由，然而導演以一些微妙而富有表現力的電影方法\n呈現而令人接受。\
  \ 影片使用羅馬尼亞語、匈牙利語、德語、法語和英語，每個場景都使\n用單鏡頭技術，給觀眾一種身歷其境的感覺，直接見證影片中發生的事情。 演員都是精\n心挑選的。\
  \ 其中一些是專業人士（男主Marin Grigore、女主Judith State、Andrei Fin\nti），另一些是業餘愛好者，所有人都完美地融合在一起。\
  \ 由Tudor Vladimir Panduru\n創作的電影攝影，不僅將角色和他們的動作，從銀幕轉移到大廳\n，還轉移了故事發展地點的冰凍空氣和稜角分明的形狀。\
  \ 有兩個場景吸引了注意：其中\n一個是最後的關鍵場景，被書寫了很多，也被談論了很多，這是本片導演的經典場景，村\n莊會議討論主題：是否驅逐外國人？這橋段似乎是對假新聞和網路操縱時代中，沒有根源\n\
  的民主後果的諷刺或絕望的評論。 影片早些時候的另一個場景，學校學生在假期期間，\n在舞台上用匈牙利語表演羅馬尼亞民謠“Miorita”，以微妙的幽默方式，講述了今天許\n\
  多特蘭西瓦尼亞村莊所發生的事情，而不是數百本書或報紙文章。\n\n7.本片寓言式的、故意神秘的結局，讓許多觀眾和評論家感到困惑。     我不會添加我\n的評論和解釋。\
  \ 我認為導演故意設計這樣的結局，是為了讓觀眾思考和討論這部電影。\n他讓每位觀眾得出自己與這部電影相關的結論，這部電影講述了一系列對羅馬尼亞人和歐\n洲人，當今生活產生深遠影響的複雜現象：經濟移民、全球化、生態危機、仇外心理、偏\n\
  見、種族和宗教試圖跨越傳統與現代主義之間的障礙、但不總是成功的個人之間的緊張關\n係。對於一部電影來說，涉及議題似乎太多太繁重了。\n\n#仇恨謎林\n#RMN\n\
  #2022羅馬尼亞電影\n\nPS.\n以下摘錄網路上，對本片有趣的短評：\n\n1.這部電影告訴我們，右翼保守主義、極端民族主義、排外本土主義、有毒的大男子主義\n\
  ，本質上都是一回事。\n\n 結尾相當屌。 男主角駕著摩托車、提著槍在小鎮遊蕩，像個孤膽英雄一樣，尋找著「外\n來闖入者」——熊的蹤跡。 但諷刺的是，妻子和兒子卻將他拒於門外，被嚇哭的情人也\n\
  向他苦苦哀求。\n\n正是那些成天拿著槍聲稱受到威脅要守衛家園的人，製造了真正的恐慌。 恐怖主義總是\n在對莫須有的「恐怖主義」的喊打聲中醞釀成型。\n\n2.男主角真的太典型了，不合時宜的耀武揚威，又色又蠢又自大，好笑得很。\n\
  \n3.最後的熊是什麼？ 是躲在女人背後的原住民？ 他們像血管淤積一般的堵著村中的血管\n，讓人上吊自殺？\n對於進入歐盟的一種迷惘和恐慌，片子講的太棒了。 廢棄的礦林，充滿迷霧的森林，逼\n\
  仄的小鎮，無聊的流水線，不敢說愛的情人，男子漢般的懦夫，一切都是對於未來沒有希\n望的寫照。\n對於這些無力，只能發動一場排外的暴動，讓這個語言混雜地迴光返照，但只不過，只能\n\
  事與願違，孩子會學好德語，他們也終將是別人土地上的吉普賽人。 最喜歡的是孩子在\n森林裡見到了有人吊死，彷彿冥冥之中註定好了核磁掃描下的絕症，羊丟了，老爹也自殺\n\
  了，不好的預兆還在蔓延，該會怎樣？\n 很牛逼！\n\n--\n\n這橋段很經典，身歷其境之感。\n\n\n謝謝樓上P大留言，你本片的心得文已拜讀完成，很棒。\n\
  這片結局的解讀，你的看法是？"
