title: '[討論] 鬼天廈4月19日到4月21報名特映'
content: "全台第一凶宅\n地獄景觀第一排\n\n《#鬼天廈》\n4月19日 (五) 能活多久\n    小薰-黃瀞怡、白癡公主扮私娼命運多舛\n    全台第一凶宅、真實社會事件改編\n\
  \    百萬人氣恐怖作家【鬼話連篇路邊攤】全新打造\n\n1984年5月28日晚上...\n進鑫大樓4樓，疑似因電線走火 引發熊熊大火，濃煙直竄天花板，但消房通道堆滿了雜物\n\
  ， 住戶逃生無門，共19人慘死火場之中，震驚社會進鑫大樓內的恐怖傳言不斷，成了知\n名的兇宅，但因租金遠較周圍房市低廉，總是住滿了住客。驅魔師佩芝（陳妤 飾）、來\n\
  尋找鬼故事靈感的 Youtuber 劭軍（潘君侖 飾）、北上工作的怡婷（鄭茵聲 飾）等人都\n陸續入住。一次，佩芝與劭軍共同經歷了靈異事件，決定聯手調查這些無法解釋的恐怖現\n\
  象，並想找出當年火災的真相。\n    /        報名表單     \n    /        報名表單     \n    /        報名表單\
