title: '[負雷] 還好沒去看鬼天廈，白癡公主演技不行'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  當初鬼天廈預告出來時，我就有猜想劇情了


  沒想到劇情和我想得一模一樣有夠老梗，


  整部劇情薄弱鬆散不堪 毫無張力 殺人的動機也很無言


  然後陳妤驅鬼的手勢與聲音很尬 軟弱無力的，這樣真的驅得了?


  而，只有犧牲扮相和被打和求救時的演技還可以


  和小薰對戲的那演技和口條真心不行，令人超出戲的 我只差沒笑出來


  ，可能跟她聲音太有特色也有關?



  繼杏林醫院、頭七、民雄鬼屋、鬼天廈、嘎拉(應觀眾要求)


  可以挑戰到底哪部最難看?




  --'
