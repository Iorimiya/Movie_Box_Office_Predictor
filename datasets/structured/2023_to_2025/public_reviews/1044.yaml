  預告片-此版本為前導版



  心得：小薰和白癡公主辛苦了！


  另外留一個小抱怨：ETToday最近的電影新聞都不順便留檔期，害我為了這件事，

  還要再花1-2分鐘再搜尋一遍（雖然這些資料也不難找到就是）


