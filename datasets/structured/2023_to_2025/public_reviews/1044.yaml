title: '[討論] 關於鬼天廈中劇情的疑問'
content: '你好我好大家好

  鬼天廈其中有段劇情我有點不太理解


  防雷一下


























  結局，最後麗美還有小薰(媽媽)的設定


  我很好奇這兩隻鬼都在同一棟樓裡面，甚至一樣樓層

  怎麼感覺他們兩個好像沒有互動的樣子

  有提到因為關在冰箱裡面，所以麗美被冰了20年出不來？

  還是因為本身恐怖片電影就會設定，鬼魂之間沒有交流？

  可以兩個鬼對話到一半心結就緩解，怎麼不早點橋一橋就好

  還是這段真的算是邏輯上的BUG？


  --

  我也覺得網紅演的意外的好，白癡公主讓我刮目相看！'
