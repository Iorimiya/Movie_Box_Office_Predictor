url: https://www.ptt.cc/bbs/movie/M.1713445570.A.653.html
title: '[新聞] 鬼天廈首映會演員齊聚 小薰被問這一題'
content: '《鬼天廈》首映會演員齊聚 小薰被問「這一題」真實心聲曝光


  蕭芳淇

  2024年4月17日 週三 上午11:06


  導演謝志文、編劇路邊攤、演員黃瀞怡（小薰）、陳妤、潘君侖、戴平雅（白癡公主）、

  鄭茵聲、高慧君、游書庭，昨晚（16日）出席改編自真實凶宅事件《鬼天廈》首映會，拍

  攝結束已經兩年陳妤笑稱其實拍攝過程的事情都忘了差不多了，小薰談及第一次拍攝電影

  的白痴公主，覺得看到她就像看見以往對電影充滿熱忱的自己，立刻被主持人黃豪平噹說

  ：「你講的好像你現在已經磨掉這些熱忱」小薰立刻笑回：「有時候會累啊！」藏不住的

  心聲讓現場笑翻。


  取材自「台北第一凶宅」真實事件的《鬼天廈》，雖然是恐怖片但拍攝過程卻趣事不斷，

  陳妤在片中飾演通靈少女有多場迎戰鬼魅的戲，她透露片中念的咒語台詞是自己用粵語台

  語客語設計編出來的自有一套邏輯，但沒想到在拍攝時自己竟然還是忘詞，雖然講錯也沒

  有人會發現，敬業的她還是會要求重來。


  在片中表現獲得同劇演員大量讚賞的戴平雅，為了該片特別安排表演課，而在上課前更一

  口氣拍攝兩個月份的頻道內容，好讓自己可以專心的準備，提到劇中飾演好姊妹的小薰，

  她則透露：「她笑點很低，也很開得起玩笑，我隨便講個垃圾話，她就笑得很開心，當下

  感覺是很容易變朋友的人，所以是自然而然演成姊妹，沒有刻意SET喔。」


  高慧君拍攝期間受眼睛斜視所苦，坦言當初是在導演說服之下，再加上心想如果未來眼睛

  不能好那作品也恰巧成為生涯上的記錄才接下這個角色，透露拍攝時得克服「視覺複視」

  狀況，所以必須事先了解拍攝場域的所有動線，才能在出現複視的情況下，找到最精準的

  表演空間，所幸在拍攝結束後至今已經恢復約九成。



  新聞網址：



  --

  其實前天就首映會了，明天鬼天廈是正式上映。



  原本還想說，小薰還這麼年輕，居然已經有職業倦怠

  黑澀會妹妹不是才剛播不久嗎？




  隨便搜了一下才發現

  今年2024應該是出道19年了…


  我的天，我的青春><


  另外高慧君好像是身體有狀況以來，近期唯一的作品

  不知道她身體怎麼樣了，甲狀腺問題好像滿嚴重的


  --

  好吧 我只好承認我是被廣告打到癡癡的SM劇照才......'
