url: https://www.ptt.cc/bbs/movie/M.1717203301.A.CA1.html
title: '[普雷]  鬼天廈-拍成影集比較適合'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  沒有看過任何預告直接觀影


  開頭恐怖感有足

  但太快就把整個大樓發生的事講完缺少懸疑感

  女主角處理小男孩那段有感動

  過去妓女戶發生的事情的故事線也不錯

  整體演技還行，但鬼魂狀態時講話的音效讓人莫名出戲


  但整個看下來覺得都有種故事講一半的感覺

  電影開發很多條線但都點個水就過了

  女鬼麗美為什麼在男主角電腦打字

  以及打字內容跟整體故事的串連也不明顯

  最後結尾女主媽跟麗美的和解也莫名其妙

  而且女主角感覺只是個靈魂容器作用也不大


  感覺就是電影時間太短沒辦法把想講的是好好講完

  如果拍成影集，可以敘述女主角如何超度每個亡靈

  慢慢發覺大廈鬧鬼的幕後人物幾集尋找母親死亡真相等

  會比較好看一些


  另外想問問麗美遇到那個凌虐她的客人

  是上一幕女主媽說要讓給她的有錢客人嗎?





  --'
