url: https://www.ptt.cc/bbs/movie/M.1713505403.A.533.html
title: '[ 大負雷] 鬼天廈大爛片一部'
content: '鬼天廈真的是一部很爛的鬼片只有83分鐘片長

  這部是在講錦新大樓發生的事情，看完覺得覺得真的是很爛的鬼片劇情鬆散演員演技又很

  尬完全都沒有表現出來，彩蛋王狗很平淡的念完台詞，王狗不是有直播過靈異探險演技不

  行看預告就差不多了


  以下有雷


















  開頭是在講說恐怖網路作家潘君侖飾演的保全為了寫錦新大樓的恐怖故事，才去當大樓保

  全，外送小哥被跳樓的女子壓死草草帶過，保全的筆電鬼敲鍵盤寫出大樓發生的故事，又

  遇到通靈少女陳妤為了要找出媽媽為什麼會火死在錦新大樓裡面，保全為了寫小說的錢跟

  通靈少女分帳一起去找尋4樓當年發生火災的原因跟找不到遺體的一位女性

  途中遇到高慧君跟他的兒子發生親情完全都是一頭霧水到底是發生什麼事情都沒交代清楚

  ，澎恰恰的角色可有可無

  鄭茵聲演租客被房東性騷擾被女鬼上身把房東殺死

  故事後面才發現到原來是好姐妹小薰看到白痴公主沒有賺到錢就把她的客人轉給白痴公主

  讓他有客人可以賺錢機會，白痴公主不願意配合惹怒sm有勢力的男子跟被管理娼妓的男子

  一起被打，白痴公主跑出房間妓女大家都冷眼旁觀看著白痴公主，白痴公主去好姐妹尋求

  幫助，好姐妹也不願意幫助結果被管理娼妓男子活活掐死放進冰箱，變成冤魂要幫助女生

  被欺負，讓男生去死的冤魂，結果火災原因是小薰覺得過意不去一直喝酒踢到蠟燭所以發

  生火災。


  --

  白痴公主我是到後面才認出來

  不會有好雷劇情很鬆散，編劇想把全部的過程拿出來講，但電影時間只有83分鐘變成都帶

