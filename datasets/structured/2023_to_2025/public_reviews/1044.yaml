url: https://www.ptt.cc/bbs/movie/M.1713663895.A.1BC.html
title: '[大負雷]鬼天廈 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  在這量產鬼片恐怖片的時代,已經是2024年了 不是1924年 到現在還端出這樣的內容跟套

  路,真的看了很心痛也很難過,可以理解為什麼一直拍鬼片,因為台灣鬼片就算很難看

  票房也不會太差,像是比較不好看的頭七,杏林醫院,民雄鬼屋票房約介於2700萬到2900萬

  也就是說如果鬼天廈最終票房沒超過2700就是目前台灣鬼片墊底冠軍!


  劇情: 劇情結構鬆散,既然標題是主打鬼片那應該主要是內容很恐怖嚇人為主,裡面

  嚇人的橋段大概只有幾秒鐘,可能就是原本一個路邊走路的人忽然變成鬼頭撲來,就這樣

  後面就真的沒有了,插了幾段支線像是回收阿姨等鬼小孩回來,房租交不出來的女房客,

  這樣對主線的連結真的很薄弱,也沒有什麼共鳴,電梯怪客跟為了錢來當保全的男作家

  也是可有可無,就是一個遊戲的RPG,彭演的師傅把最重要的珠子給女徒弟,也沒起什麼作用

  還以為關鍵時刻佛珠或是師傅會挺身而出,沒有,就是被鬼直接打趴在牆上,然後躲很久的

  鬼媽媽一直說很恐怖趕快回家吧大家都會死你趕快逃,態度忽然轉變現身跟女鬼溝通拿出

  往日姊妹情沒幾句話就化解女鬼的恨,二個人抱著痛哭和解愛與和平一起升天投胎去了~

  真的很扯～一點劇情轉折感都沒有＠＠？



  --'
