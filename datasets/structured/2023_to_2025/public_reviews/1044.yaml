title: '[新聞] 小薰、白癡公主春光外洩！鬼天廈劇照性'
content: '新聞網址：




  取材「台北第一凶宅」錦新大樓真實社會案件的電影《鬼天廈》，公開黃瀞怡（小薰）

  春光四射的劇照，片中她飾演娼妓女子，戲服全是性感曝露風格，上露胸又下秀腿，

  她坦言定裝到最後內心真的驚訝，因為布料愈來愈少；且她說現實生活中自己完全

  沒有這類打扮，「會一直想遮！」



  《鬼天廈》描述位於市中心的大樓發生大火奪走19條人命，其後靈異傳言不斷。

  小薰透露自己雖不是第一次演娼妓，但這回的人物背景和慘烈遭遇很不一樣，她解釋

  說，以前演過幾次類似角色，但這次必須把娼妓的心態更收斂一些，因為她既是一位

  母親，在妓女戶裡又是大姊姊，不是那種大剌剌的紅牌，反而多了一股照顧妹妹們的

  溫暖。


  小薰首先要挑戰的就是妖豔清涼的服裝，她回憶：「在定裝的時候，定到最後一套衣

  服，我確實有一點驚訝，因為布料愈來愈少，內心是不會抗拒，但是對自己的身材

  沒有自信，會一直想遮掩。」



  所幸拍攝過程中，劇組人員給予的安全措施做得很完善，她因而放心放膽地去做表演

  。問她現實生活中，何時會有這樣狂野豔麗的打扮？她說：「現實當中，我絕對沒有

  這種打扮哈哈哈哈，我真的沒辦法。」


  同樣飾演妓女的白癡公主，多半也是短裙配上單薄裝扮，小薰對她的第一印象就從

  身形而來：「我對她的第一印象是好瘦，瘦到風一吹就會飄走那種。有場戲在基隆山上

  拍攝，她穿細肩帶和短裙，她冷到嘴唇發白狂發抖，我蠻慶幸自己脂肪蠻多的，就會

  抱她幫忙取暖。」



  白癡公主分享首次主演電影所做的準備：「這次的演員訓練，讓我以麗美的名義，寫了

  好幾次的自傳，關於個人介紹和童年經歷，還設想為何想做特種行業的心態，從想像

  中體驗了不同的心境和人生，雖然身為YouTuber也常常有機會去體驗各種生活，

  但完全變成另一個人的感覺還是頭一次。」


  《鬼天廈》由百萬人氣恐怖作家路邊攤（徐毅涵）和導演謝志文共同編劇，描述位於

  市中心的大樓發生大火奪走19條人命，其後靈異傳言不斷。20年後，擁有乩身體質的

  陳妤決定入住這棟凶樓，找出火災真相；調查過程遇上潘君侖飾演的恐怖小說家，

  兩人攜手調查大廈內不為人知的恐怖過往。


  ———————————————————————


  補充資料：

  台灣預定檔期：24/4/19

