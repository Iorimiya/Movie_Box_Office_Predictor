url: https://www.ptt.cc/bbs/movie/M.1713781467.A.57F.html
title: '[微雷] 鬼天廈'
content: "其實從這部電影的劇情的編排來看\n能夠看出導演跟編劇的野心挺大的......\n也有續作的可能性\n畢竟是路邊攤的作品，有原本的文本在\n\n\n\
  \n\n\n\n----------------------------------以下防雷----------------------------------\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n----------------------------------以上防雷----------------------------------\n\
  \n\n\n主要的劇情可以分成兩個部分\n一、鬼天廈中的小人物的故事\n二、小薰飾演的以及白癡公主飾演的麗美之間的故事\n\n電影裡面想要講的劇情很多\n前半有群像劇設計，後半則在跑主線，但主線很明確，就是小薰和白癡公主的姊妹情，也\n\
  是整棟大樓為什麼會被火焚的秘密\n\n隨著故事的揭露，我印象最深刻的部分大概是\n小薰跟白癡公主之間的對手戲\n她們在生前是朋友，\n甚至還有信物象徵她們之間的關係\n\
  \n\n\n\n\n但之後麗美在電影裡面是最後卻在接客後被凌虐致死\n\n致使她化成冤魂在大樓裡面遊蕩\n她的恨，她對世界的不諒解，直到她的放下\n才是整部片真正的主題\n\
  \n當麗美想要對小芝出手傷害的時候\n小芝媽媽跳出來保護女兒，\n\n兩人，啊不，是兩鬼大打出手後\n最終和解，\n\n麗美醒悟了，但仍被冥火焚燒的那幕，\n\n\
  曉晴緊緊地抱住麗美\n告訴她\n「我救不了你，但我會一直陪著你」\n隨即一同承受冥火焚燒之苦\n\n\n......雖然冥火燒了三分鐘都沒魂飛魄散這件事情讓我小吐槽w\n\
  但這幕是很有張力的。\n\n\n在解開火災謎團，\n在麗美與曉晴回到該去的地方後，故事也隨之畫下句點\n\n\n\n由於我看的這場有小小的映後時間\n男主角有來分享一些拍攝的小故事\n\
  \n\n\n他提到，他認為拍攝的時候最困難的地方是\n他怎麼被白癡公主以及小薰兩鬼附身的部分\n\n他需要去觀察癡癡和小薰的神態\n再進行詮釋然後再去出演怎麼被附身的過程\n\
  \n而他也分享說電影拍攝地點不是在錦新拍攝\n而是在基隆搭的景XD\n劇組也很怕在原地拍（廢話誰不怕）\n\n但他們還是有到大樓附近頂樓取景拍攝\n映後有發問的觀眾可以得到大甲鎮瀾宮的護身符一枚，不知道後面的場次有沒有\n\
  \n不過最令我驚訝的是\n白癡公主踢飛凌虐的戲碼居然沒有用替身\n全程實拍，\n\n\n\n這真的挺敬業的.......\n\n--\n當然不可能啦，是的話心也太大\n\
  也可以前傳吧\n同意你的看法，陳妤本身設定適合做成串連單元劇的主角\n 兩次附身超挑戰演技\n畢竟主角就是路邊攤投影阿 我覺得還可以"
