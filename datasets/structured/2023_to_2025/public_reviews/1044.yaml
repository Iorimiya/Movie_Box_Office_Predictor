url: https://www.ptt.cc/bbs/movie/M.1713964591.A.9E4.html
title: '[尬雷] 上週超夯的《鬼天廈》尬到令人發毛'
content: '應該算一點點小雷

  防一下...












  《鬼天廈》票房已破700萬，光周末就600

  《噬血芭蕾》票房才一半左右...

  很驚人



  上週去看，覺得水平如同民雄鬼屋、杏林醫院之流

  坐立難安，是因為對白尷尬到驚人

  瞪大雙眼，是看到女主角作法手勢


  還在想：怎麼會有鬼，這  麼  多  台  詞？

  整部電影少了鋪陳懸疑，過早開始告訴你這是恐怖片


  是否發現~

  -2020 杏林醫院（台南

  -2022 民雄鬼屋（嘉義

  -2024 鬼天廈（台北


  台灣「每兩年」就會有都市傳說搬到大銀幕

  2026不知會換哪個縣市？




  但不得不說鬼天廈的行銷策略遠勝另兩部

  採用「網紅」+「特映QA場」+「網路作家」

  搭配社群行銷順利攻佔上週各大影版

  網紅和作家，相對資深演員少了距離和成本

  錦新大樓的知名度又自帶媒體流量



  可惜依然有過往鬼片的問題

  從「地點去發想劇本、再擴張成電影」並非好公式

  有核心概念的劇本、再往外加上設定和亮點

  以結果論來說比較能讓電影有生命




  受限在一個鬧鬼的地方

  硬塞一下過去可憐可恨的人

  搭配沒存在感的稀薄主角進去踩

  為了能讓觀眾看懂還有不少解釋對白


  馬伕下殺手那段太硬要，又拖又詭異無張力

  最後手環動畫仙氣滿滿，以為在看戲說台灣

  過多雜亂角色

  喔還有~~~最後還又塞一個網紅...


  這就是成果



  .

  若拍攝電影是以炒網路為目標

  那麼先天就少了適切性和意義

  唯一的亮點

  大概只有白癡公主的扮相和犧牲

  （給癡癡一個掌聲）




  我都是買票進戲院用大銀幕感受/支持

  咒 > 紅衣 > 女鬼橋 > 粽邪 > 頭七 > 民杏廈






  --

  不能拿其他強檔恐怖片來比啊~

  以國片+製作來看，算超出預期許多了

  沒錯！感覺是拿現有IP硬拍上大銀幕

  如果吃飯看電視看比較不違和

  柯孟融、程偉豪兩位導演感覺都很ok

  哈我有看  印象深刻~

  不少橋段一直聯想到薩滿'
