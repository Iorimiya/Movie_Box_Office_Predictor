title: '[新聞] 鬼天廈票房開紅盤 釋出小薰白癡公主豔照'
content: "鬼天廈票房開紅盤 釋出小薰白癡公主豔照\n\n2024/04/23 05:30\n\n\n小薰（左）和白癡公主在《鬼天廈》飾演好姊妹。（華映娛樂提供）\n\
  \n〔記者鍾志均／台北報導〕恐怖片《鬼天廈》首週賣出550萬，是上週真人版電影的新片\n冠軍，電影公司昨釋出主演「小薰」黃瀞怡、「白癡公主」戴平雅的「機車擋泥板」豔照\n\
  回饋影迷，兩人擺出妖嬈姿勢，架勢十足。\n\n\n小薰（圖）、白癡公主公開「機車擋泥板」豔照回饋影迷。（華映提供）\n\n小薰和白癡公主在《鬼天廈》飾演性工作者，在工作場所擺設不少復古豔照，像是小薰大\n\
  方秀香肩，白癡公主則性感開腿，身體前傾小露內衣，胸前春光乍現。\n\n\n白癡公主「機車擋泥板」豔照回饋影迷。（華映提供）\n\n因該片觸及靈異事件，包括電影進行音效後製期間，工作人員透露混音設備操作到一半突\n\
  然沒反應，沒多久又正常操作，嚇壞眾人，另外電影上映前的試片會也曾發生機器故障，\n導致緊急取消放映的詭異插曲。\n\n為因應電影怪事頻傳，日前劇組演員前往大甲鎮瀾宮參加祈福儀式，向神明祈求平安順利\n\
  ；電影上映當天，霞海城隍廟廟方也在影廳包場，邀請城隍爺進戲院陪大家看電影。\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛   \
  \     是 菩薩\n\n\n\n--"
