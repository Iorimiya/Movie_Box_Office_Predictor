url: https://www.ptt.cc/bbs/movie/M.1713625946.A.085.html
title: '[好雷] 鬼天廈'
content: '.

  ..

  …

  ….

  …..

  以下有雷，請注意！

  …..

  ….

  …

  ..

  .


  錦新大樓

  我個人每次經過附近都覺得毛毛的

  雖然這邊緊鄰鬧區


  鬼天廈是主軸線是個親情劇，年輕的單親媽媽為了年幼女兒下海，意外過世的故事。


  我覺得白癡公主演的麗美真的很有渲染力，可以感受到她被欺負的痛苦（癡癡這麼可愛，

  真的有人打的下去嗎？我就問）


  印象中有一幕男主角被媽媽附身後叫女兒快逃的一幕，讓我對這個男演員刮目相看，不常

  看國片，但可以把媽媽擔心女兒的感覺演出來，覺得演技還不錯；這個橋段讓我聯想到星

  際效應，男主角在書櫃後推書崩潰的情緒，愛都很偉大，無論母愛父愛，都能跨越生死，

  跨越時間。


  不得不同情這兩位甘苦小人物的角色，但也覺得真實的娼寮有這麼可怕嗎？


  我的理解裡面，娼寮不是都像萬華那種一個區域的自營戶，如果說有什麼勢力進駐，也是

  收收保護費而已？再如果今天真的是黑道經營好了，他也沒有必要對小姊下重手吧，如果

  真的有受傷怎樣之類的，也只是影響他們賺錢？


  還是我太天真了？


  說回電影，片名叫做鬼天廈，大樓的陰森恐怖感塑造的還是挺不錯，不管是大樓內的牌位

  還是各式各樣陰陰暗暗的大樓角落，一而再再而三能感受到電影營造的氛圍，尤其這種陰

  暗的垂直空間，確實會因為一種聚集感，有更可怕的電影感受，可能是因為我也比較喜歡

  這種恐怖題材。


  大樓內總給我一種’你跑不掉’的感覺，對比很多能一直移動的鬼片，前者給我的感覺比

  較強烈。


  然後我覺得最後鬼屋探險有一種晚安小雞的既似感(大笑～



  我很想問敢買的都是哪些大神，還是其實當地根本沒怎樣？



  --

  說的也是 畢竟不是屬於很偏僻的地方 感覺大樓內學小雞開直播應該很有搞頭'
