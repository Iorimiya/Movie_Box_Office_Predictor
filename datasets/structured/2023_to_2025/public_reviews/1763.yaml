title: '[普好雷] 販愛天堂 (前段防雷 後段心得雷)'
content: '可能是非英語系電影的關係(這部是法文片)，這部票房應該很差，3/24才上映這週看起來


  是快撤了，看在有坎城的logo份上今天趕快衝去看了，前面這裡防雷，給還在猶豫要不要


  去看的人小小建議




  總體如標題我給普好雷，原因大致是覺得導演功力不夠




  如果你是跟我一樣的輕度電影宅，扣掉大型商業爽片一年除了戲院包括串流或其他管道


  看20-30部以上(我2023光進電影院的就超過10部了)，對iMDB高分或影展得獎片有關注的

  。


  那這部對你來講可能口味不夠重，導演功力也會失望。有別的口袋名單的話就跳過這部吧




  如果你不是上面這種，偶爾看看電影，那這部還OK不難看，故事還算精彩可以考慮。




  如果還在猶豫的，由於票房很差，還有上的原文戲院海報應該還沒送完XD，這部海報很漂


  亮，可以去看。


  海報本人，相機不好，其實色調比較偏藍很漂亮沒那麼黃




  無雷的打到這邊


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~










  要雷了喔 想進戲院看的趕快左轉














  開雷




  這部主要故事是小白臉男主角Adrien因為意外受傷舞者職業生涯毀掉，靠老女人Martha包


  養過活。有一天遇到真愛Margot，兩人為了解決金錢問題決定讓Margot去色騙另一個房地


  產富翁，後來展開計中計的故事。法文片名Mascarade英文是masquerade就是假面舞會的

  意


  思，劇中律師也有說出這個字眼，形容故事裡每個角色騙來騙去的狀況。



  1. 我覺得導演的功力不足是最可惜的地方。節奏上沒有掌握很好，中間有點拖。大量使


  用的穿插剪輯效果也不好、不夠流暢。前面在角色還沒完全導入好就穿插好幾幕不完整的


  法庭片段，搭上開場的宴會一堆人物，讓人有點搞不清楚誰是誰。我是在後來因為節奏變


  太慢的時候有機會回想、整理才抓回前面的故事不至於霧煞煞。如果穿插剪輯每一幕能夠


  更俐落，加上一些運鏡手法，應該可以表現得更好。


  2. 這種計中計黑吃黑的故事在2023算是老套了，這個劇本不錯但可惜了年代不對。也是

  這


  個原因我會認為平常沒大量看電影的觀眾還是可以選這部看看。


  3. 中間有段瑪格狂發訊息給Adrien但Adrien被Martha纏住沒回的戲，結局來說Adrien應

  該


  只是Margot的棋子，不確定這段是不是Margot故意這樣做讓男的暈船暈更深 (剛好這部有


  Adrien坐船暈到吐的戲，該不會暗示他的暈船體質XDDDDDD)


  4. 中間Adrien去勾搭房地產富翁老婆Carole那段滿好笑的


  5. 飾演包養Adrien的過氣演員Martha的演員Isabelle Adjani居然67歲了...保養得真好X

  D


  6. 被Margot毀掉車子的那個電影導演後來的報復也太弱了，如果多點戲應該劇本更豐富

  。


  7. 一開始的取景有點白蓮花大飯店的影子





  --'
