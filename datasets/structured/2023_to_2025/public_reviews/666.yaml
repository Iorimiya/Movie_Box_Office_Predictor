url: https://www.ptt.cc/bbs/movie/M.1748461513.A.2B0.html
title: '[好雷] 隔壁的房間 The Room Next Door'
content: '網誌版



  這是一部不管布景、色彩、敘事都很動人的電影，描述的是兩個年輕時的朋友在多年後重

  新連絡上，面對的卻是生死難關。Martha患上了絕症，化療的過程讓她備受折磨，也因此

  萌生了自我了結的念頭。然而，她的身邊沒有什麼可以與她商量的親人，電影流暢的切換

  時空，透過她與好友Ingrid的對話，娓娓道來她這些年在職場的風風雨雨、多年前的一段

  情，以及為何她與女兒疏遠。Martha一直都是個戰士，她不希望自己走的沒有尊嚴，也希

  望自己走的時候能有朋友及時發現，因此大膽的向Ingrid提出一個要求──她希望自己走

  的那天，Ingrid能在隔壁的房間，作為一種臨終的陪伴。


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  這是個艱難的請求，對於Ingrid來說更是個讓她身心煎熬的決定。電影花了非常多的時間

  慢慢鋪陳整個過程，讓大家了解到即使許多人支持安樂死的概念，面對真正的死亡，絕大

  多數人都是措手不及的。就像是Ingrid答應了請求，但是當她需要直面好友離世而自己束

  手無策、甚至幫了一把時，她其實是非常無助也無措的。成全好友的心願、尊重她的意願

  好像是對的，可是幫助好友自殺難道是對的？


  電影就在這樣的兩難、掙扎中漸漸到達尾聲，在一個Ingrid沒有預料到的時刻，Martha平

  靜的走了，走的時刻她穿著華服，優雅而美麗。Ingrid依然痛心，但似乎也為好友感到欣

  慰。關於生死、臨終關懷、與病人尊嚴，關於友情、關於親情，電影沒有給我們答案，在

  現實世界中也不會有固定的答案，但這卻是我們每個人需要思考的。


  --'
