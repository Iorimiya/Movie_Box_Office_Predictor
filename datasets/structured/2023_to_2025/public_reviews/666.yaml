url: https://www.ptt.cc/bbs/movie/M.1733476433.A.D6F.html
title: '[普雷] 隔壁的房間'
content: '反正怎麼打都大概會像負雷

  但我是想給普雷的

  本來的標題叫做

  隔壁的反戰安樂死全球暖化LGBTQ豪宅

  算了


  簡單來說是部幾乎零起伏的電影

  沒有你想像的戲劇性

  主線很簡單 我很喜歡

  兩個女主角演的很好 沒話說

  我還記得幾部wes Anderson的作品裡面的Tilda Swinton


  最後那幕同時將在生者和死者的大雪很美

  女兒同時也是母親 生者也是死者


  但


  我真的覺得到底幹嘛加這麼多元素

  反戰是我最討厭的

  你要扯什麼戰地記者 那就多講一點啊

  幹嘛扯什麼PTSD老公跑去著火房子耍白痴

  這段跟整部的調性差了十萬八千里

  蠢到不行

  還有什麼氣候變遷激進份子

  大概想要用世界沒有希望對比兩位女主角的處境


  講真的這些東西不是不好

  就我實在覺得很偏題

  你明明有一堆東西關於兩個女主角

  死都不講 帶過帶過


  最喜歡的戰爭 兩句話 再也不提

  女兒說自己在那著火的房子 一句話 當沒發生過

  那個往自己胃射一槍的情侶 不重要

  一大堆 多到很奇妙的同性戀比例

  沒 red herring 友情以上 炮友未滿

  百合度倒是可以 但這東西沒啥普世標準

  跟你講你也不會懂


  女主角寫的怕死的書的內容 這麼重要的東西

  nope 簽書的時候的一句 not nature

  沒了


  總之我覺得女主角很薄就是了



  打多了

  總之是個普雷


  有幾個很美的畫面

  演員演技很好

  不是有趣的無聊片

  是無聊要咬有點用力才有味道的無聊片

  只會讓人想去訂森林渡假豪宅


  --'
