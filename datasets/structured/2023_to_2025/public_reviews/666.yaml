  \n★ 電影預告：\n\n★【隔壁的房間】[保護級] 11月29日 (週五) 陪你走到最後\n\n\n\n故事講述失聯多年的好友在某種極端且動人的情況下重逢，不僅重拾過去友誼，瑪莎更請\n\
  求英格麗陪她前往鄉間渡假小屋，共度一段時光並回憶過往\n\n\n本片注入強烈情感，將自己對生與死的省思揮灑得淋漓盡致。\n\n\n蒂妲史雲頓、茱莉安摩爾兩大女神聯袂主演，精湛表現帶有缺陷卻又迷人無限的女性複雜\n\
  面貌，充滿機鋒與張力的細膩對白，既脆弱又深具力量，不僅凝視生死難題，更是揉雜別\n離、友誼及人生意義的溫柔對唱\n\n\n\n《抽獎方式》\n11月24日 23:59前，推文留言言分享想看的原因，就有機會獲得電影特映券\n\
