url: https://www.ptt.cc/bbs/movie/M.1725176564.A.4EC.html
title: '[雷] 詭異之家心得有雷及一些問題'
content: '這部片氣氛營造的很好，恐怖中帶著幽默，全片幾乎都在亮的地方下拍攝，但是恐怖氣氛還

  是有，不過後面變成獻祭殺人還變成大逃殺實在有點無語


  想問一下一開始主角跟經紀人被打，那個面具人到底是誰


  然後妹妹不是應該不知道姐姐住東京嗎，應該沒去拜訪過吧，怎麼鄰居知道那是片淵一家的

  妹妹


  第二隻手又是誰送的


  最後為啥家主要殺了那個執行者，不是殺主角一行人


  後面媽媽跟姐姐還要繼續執行左手祭祀？妹妹到底知不知道左手祭祀？


  話說結局經紀人又在說風涼話，明明一開始自己都被嚇死了


  最後主角家那個格局又發現小房間讓我笑了一下


  還有主角住那邊那麼久都沒發現臭味嗎？那麼多蟲子應該是裡面有屍體吧


  --




  原來

  我覺得這部片還算明亮吧，除了最後大逃殺

  真的，前面推理很有趣，還有後面結局那段搞笑畫面XD'
