title: '[新聞] 張洪量要拍「廣島之戀」 主角條件要求很'
content: '張洪量要拍「廣島之戀」 主角條件要求很大咖



  2016-02-19 17:56 聯合報 記者袁世珮／台北報導


  一個懷抱25年、其間還被壓抑在牙鑽下14年的夢想，張洪量終於募得5億資金，下半年導

  演電影處女作「廣島之戀」，鎖定華人版的李奧納多與娜塔莉波曼。


  張洪量下半年將開拍電影處女導。圖為他1992年在西安演出「在那遙遠的地方」。圖／洪

  量文化提供


  張洪量與莫文蔚合唱的「廣島之戀」，至今仍在對唱情歌K歌榜上，雖然一度回歸牙醫工

  作，終於在2015年復出歌壇，今年動作頻頻，除了6月11日的台北小巨蛋演唱會外，年底

  要執導演筒圓夢了。


  張洪量下半年將開拍電影處女導。1994年首度為自己的MV掌鏡。圖／洪量文化提供


  張洪量1990年因原定要為電影「霸王別姬」製作原聲帶，到北京電影製片廠看該電影拍攝

  ，短短不到2個月，開啟了他的導演夢；1992年，他演出「在那遙遠的地方」，半年內隨

  著西安電影製片廠邊演邊學；1994年張洪量嘗試拍自己的MV，實際動手就發現不足，於是

  赴美進修。


  2000年自紐約大學碩士畢業的張洪量，下半年將開拍電影處女導。圖／洪量文化提供


  張洪量1995年進紐約大學念電影製作，成為導演李安的學弟，還受邀到李安的工作室，參

  觀「冰風暴」剪輯跟後期製作。學成後的他，到了香港當徐克的副導半年，又在柴智屏邀

  約下回台拍片，沒想到繞了一大圈，回頭當牙醫。


  如今，經紀公司已為他籌得資金，只等「張導」實踐，他不打算自演自導，希望能找到有

  像李奧納多年輕又有個性的男演員，女演員則希望娜塔莉波特曼的外型，但因上半年都要

  忙演唱會，電影應是下半年的大事。



  --








  --'
