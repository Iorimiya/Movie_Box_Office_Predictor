url: https://www.ptt.cc/bbs/movie/M.1680362486.A.1ED.html
title: 'Re: [好雷] 巴比倫'
content: '有推文問墨西哥製片的意涵 其實我也不知道 所以今天特別再次進場欣賞一遍


  以下是我的看法 純粹分享 整部電影是好萊塢的發展史 也是美國夢的縮影


  老布代表的美國社會中的暴發戶但卻無法真正融入美國上流社會


  菁英不看電影看百老匯


  瑪格代表的是美國社會的中下平民階層與女權主義的代表


  茱菲夫人是整體亞裔美國人


  黑人爵士樂手是非裔美國人


  墨西哥男主角是拉丁裔美國人 他既是拉丁移民 也是基層出生


  而且他的腳色有點類似旁白 也代表著導演的角度


  好萊塢甚至美國的發展 其實以上五位主角都有貢獻


  當然這樣的設計與安排也暗藏了一點政治正確 不過不讓人討厭 不像黑豹小鬼人魚XDDDDDDD



  電影本身是很精彩的


  但是導演企圖心太大了 想要講的東西太多


  如果拍成240分鐘 分上下兩集播出 節奏上會更好


  我看完覺得音樂真的非常非常棒 我想時間會還這部片公道的


  當然沒辦法達到美國往事或刺激一九九五那樣的高度


  但給我那樣的感覺


  但導演想講的東西太多 在189分鐘裡 很難表現的流暢且完整


  一開頭一個胖子把一個年輕的小花旦玩殘了 這是在影射諧星阿巴克爾Arbuckle開派對，


  被控將女星拉佩Rappe性侵到重傷、去世。


  在默片時代阿巴克爾全盛期 甚至卓別林要幫他配戲 但因此事件 他名聲大壞且訴訟纏身


  報業大亨William Randolph Hearst(赫茲集團的創辦人) 利用此事件 大肆炒作消費死者


  為了延續報導的話題 還利用各種管道壓制Arbuckle派對上的友人 不准他們幫Arbuckle


  發聲 同時片商也大量的發送拉佩身前的戲照 並稱此為她遺作 最後再收割一波票房


  而Arbuckle也非常慘 前兩次審判都被判強姦重傷 到了第三次審判調查 確認拉佩生前


  因長期嗑藥喝劣質酒 身體已經很糟 且也沒有任何證據證明Arbuckle強姦


  這才還Arbuckle清白 但時不我予 他之後泯然於眾 46歲就心臟病發而死


  審判期間只有好友卓別林始終相信他清白 且願意為他發聲



  男主角老布 他飾演的是影射默片時代的男神約翰吉爾伯特（John Gilbert）


  他濃眉大眼 配上招牌小鬍子和經典大鼻子(片中有一段小布裝假鼻)


  John在默片時代跟葛麗泰嘉寶（Greta Garbo）是經典couple 曾經瘋迷萬千少男少女


  整整5年是好萊塢最高薪的男星 且被稱為米高梅最寶貴的資產 進入有聲電影時代


  其實吉爾伯特並非因為聲音被人詬病 而是無法適應新的表演方式 以及遇上不適應新時代


  拍攝模式的濫編導 電影中有他在與女主角演對手戲的片段 因為台詞必須充斥整段戲劇


  所以整整1分多鐘 他不斷的大喊I love you結果變成了觀眾眼中的小丑 從此一蹶不振



  後來昔日的情人嘉寶 在飛黃騰達以後 籌資拍攝瑞典女王 把吉爾伯特這個老搭檔找來


  對戲 吉爾伯特表現的非常平庸 同時嘉寶表現極為出色 最後這成了吉爾伯特有意義的


  的最後一部電影 雖沒有如電影中舉槍自盡 但憂愁酗酒懷才不遇是事實 1936年就英年


  早逝了



  瑪格羅比的角色本尊則是首屆奧斯卡最佳影片（Wings）的女主角嘉麗拉寶（Clara Bow）


  嘉麗拉是1920年代中後期最潮的女星 在默片時代他那充滿活力且誇張的舞蹈動作


  一出道就擄獲了觀眾的心 簡直就是1920年代的瑪麗蓮夢露 名作《攀上枝頭》的英文原


  片名為《It》使她成為史上第一位被稱為「It girl」的當紅潮女 1920年代被稱為美國的


  咆嘯時代 一戰後經濟蓬勃發展 平民娛樂大幅發展 貝比魯斯跟嘉麗拉寶被譽為這個十年


  的代表性人物 在最當紅時 他曾經是好萊塢片商的心頭好 曾創下連續25部電影


  都讓片商至少淨賺回一倍的紀錄



  她並沒有在有聲電影時代就消失無蹤 可是拍片的壓力 以及各種輿論批評他低俗


  不優雅的壓力 讓他越來越討厭社交 最終換上了嚴重的精神疾病 就跟戲中她到紐約


  探望療養院中的母親一樣 被丈夫和親人疏離 1965年病逝 瑪格演得非常好



  茱菲夫人影射的應該是好萊塢的第一位華裔女星 黃柳霜 因她時常扮演蝴蝶夫人角色


  也常有男裝儷人的扮相而聞名(相傳川島芳子的男女裝扮相都是模仿黃柳霜)


  黃柳霜是廣州台山人 1905年生於洛杉磯 是極少數在1920年代就能在好萊塢


  佔有一席之地的華人 最著名的電影作品是1932年的上海快車 她與瑪琳娜德麗


  大演對手戲 本片全球票房150萬美元 並獲得1932年奧斯卡最佳攝影獎


  但華人及亞裔身分 終究讓黃柳霜的演藝生涯飽受歧視與不公待遇 1935年米高梅


  翻拍賽珍珠的小說大地 大地是一部以中國農民與地主鬥爭的作品 米高梅拒絕黃柳霜


  飾演女主角 整部電影都用白人演員化妝演戲 讓黃柳霜感到非常屈辱


  憤而如電影中離開美國前往歐洲 彼時希特勒的陰影已經開始壟罩全歐洲



  黃柳霜又注意到日本加速進攻中國 開始奔走為中國抗戰募資與宣傳 1937演出上海女兒


  1942年演出重慶英烈(Lady from Chungking) 1961年在準備電影花鼓歌時病逝


  2022年成為了美國25美分錢幣的人物之一


  黃柳霜氣質極佳 同時具有古典與現代之美





  吹奏爵士樂的黑人樂手 則是影射1920年代的整個黑人命運 一方面因為美國經濟加速發展


  平民娛樂興起 黑人爵士樂獲得大眾青睞 迅速成為流行音樂文化之一 所以黑人歌手


  不再僅是電影伴奏的一部份 也可以進入好萊塢電影中擔任主角 但另一方面 1920年代


  也是部份白人社會加速打壓黑人的集結與開始 因為他們開始發現黑人逐漸地融入並參與


  美國社會 很多的文化作品反映這種思維 著名的爭議電影一個國家的誕生


  就大量美化3K黨等種族隔離主義的支持者 亂世佳人也有部份歧視黑人的隱喻


  就如同電影中的黑人樂手一樣 因為出眾的音樂才華而進入了主流電影娛樂工業


  但依然無法得到公平與客觀的對待 因為不夠黑 所以要加上碳粉 把自己塗黑


  以符合主流觀眾心中黑人的樣子



  總得來說瑕不掩瑜 真是一部好電影 但這麼多的故事與人物脈絡要放在一起


  確實需要極為強大的編導功力 只能說導演的企圖心真的太大了


  很期待有沒有人要拍個邵氏王朝啊


  --

  感謝指正

  我又看了一遍 所以補充了我的看法 也歡迎您給予回饋

  感謝欣賞'
