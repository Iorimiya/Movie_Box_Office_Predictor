url: https://www.ptt.cc/bbs/movie/M.1676438590.A.D1A.html
title: '[好雷] 巴比倫'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~
















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  《巴比倫》有個盛大華麗的酒池肉林開場秀，但隨著劇情推進也越來越多似曾相識的橋段

  ，直到我聽到了《Singing in the Rain》，才發現這原來是改編後的限制級版《萬花嬉

  春》啊。


  其實這是很偷懶的說法，畢竟相較於《萬花嬉春》的溫馨浪漫以及歡樂的氣氛，《巴比倫

  》明顯地展現了好萊塢比較黑暗、充滿慾望甚至邪惡的一面。只是充斥全片的《萬花嬉春

  》彩蛋，讓人好奇編導有多愛《萬花嬉春》，抑或者是以類似《萬花嬉春》的背景來延伸

  揭露電影圈交錯複雜的另一面。


  《巴比倫》背景是從無聲電影到有聲電影的過渡時期，主要角色包含了一個大明星、一個

  夢想成為明星的年輕女孩、一個想闖出一片天，留下一些事蹟的年輕男孩。之所以會給我

  這部片是以《萬花嬉春》為底做延伸的感覺，是因為每個彷彿致敬《萬花嬉春》的彩蛋，

  背後都有較為陰暗的另一面。


  例如拍攝古裝英雄片的大明星，在螢幕上看來是如此不可一世，而對外的人物設定也是積

  極地認為電影需要改革，應該要更加進化。但誰知道這樣一個看起來正氣凜然的巨星，在

  女侍者試圖刻意接近他時義正嚴詞的對女侍者說了一番道理，卻是以退為進的一邊樹立自

  己清高的形象，一邊仍是覬覦女侍者年輕的肉體。銀幕上威風凜凜的形象，誰知道開拍前

  他才因為前一晚狂歡的結果而宿醉不醒，甚至待機時也是酒不離手，連走都走不穩的被攙

  扶到定位開拍呢？


  可是這段我卻覺得非常有意思，一方面是這樣一個醉漢，當攝影機一架起來卻又馬上恢復

  正常的對戲，深情款款地演出，甚至留下堪稱經典的一幕；另一方面是這段除了男主角狀

  態不好，整個片場也是雞飛狗跳，臨演不配合，嚴重拖延導致拍攝時間不夠了，又發生攝

  影機損壞，急忙到鎮上去租新的時間越拖越久，但最後當終於租到攝影機，演員定位，趁

  著太陽下山前的最後一次拍攝，卻拍出最精采的一幕。讓人覺得有時候很多事情即使經過

  再多縝密規畫，卻不一定能照預期的發生，而有時在最混亂或最意想不到的時刻，卻誕生

  了最好的結果，世事就是如此無常。這段我覺得也呼應了後面電影巨星與舞台劇演員有關

  演電影的是不是真正演員的爭論（而這又是一個與《萬花嬉春》相似的片段）：呈現在大

  銀幕上的片段，都是精挑細選後提取出來的精華，但舞台劇每次可能都有細微的差異。而

  且所謂長青的舞台劇，其中的角色經常會換過很多代演員，但電影除非翻拍，不然一部電

  影問世，它就會永遠留存在世上。


  而想成為明星的年輕女孩，她把握了難得的臨演機會，展現了眼淚能收放自如，甚至能配

  合導演所需要的情境做微調的天賦演技，一舉成名。這邊與男巨星一開拍就馬上入戲的片

  段一樣，我看這段莫名覺得很感動。這就是「專業」，不論你頭腦多昏沉，意識多不清楚

  ，一聽到 Action 就馬上進入狀況；不管你心情多雀躍或多緊張，一打板馬上就能調整到

  哀傷或羞愧的情緒。「專業」或許表示你有著深入的相關知識與技術，或許表示你在這個

  領域出類拔萃，但更多時候，它代表的是能夠長久穩定維持水準的產出。


  只是當她成名後，隨著社會風氣變化，原本喜愛她的群眾開始批評她放蕩不羈的態度，再

  加上電影進入有聲時代後，因為她的嗓音不夠甜美而飽受譏諷。這些也是電影或演藝圈的

  人經常遇到的狀況，群眾時常一廂情願的將某個角色的形象投射在演員身上，而忘了角色

  與演員的差別，又或是因為演員出名了而開始被徵收名人稅，群眾開始有諸多指點，認為

  演員就是該背負一些道德責任在身上，無視他們自身的意願。但最諷刺的是明明最善變的

  就是群眾自己，上一刻或許還將這個人捧成神，下一刻就覺得這個人的作品一文不值。


  貫串全電影的是巨星的凋零、年輕女孩的崛起與衰落、年輕男孩的奮鬥與被逼退出這個圈

  子，觀影時我腦海中不斷浮現「美國夢」這個詞，以及電影隨之而來對這個詞彙的嘲諷。

  也許在這片希望之地有著無窮的機會，而電影中的角色也抓住了這些機會崛起。但大環境

  可能改變，而轉變的力道可能超乎想像，即使你是大明星，也可能完全無法抵擋這股趨勢

  ，淪落到只能當個在背景合唱團中唱歌的一員，失去以往總是站在舞台中央的聚光燈；又

  或者這裡太複雜，有太多的誘惑，你可能染上毒癮、賭癮，進而讓你身敗名裂；或是有著

  許許多多外人看不見的陰暗面，你也許不想接觸他們，但他們卻可能自己纏上你，導致你

  萬劫不復，只能隱姓埋名的逃亡。


  三小時的電影幾乎濃縮了電影圈的各個面向與各種要素，看到了電影業的黃金時代與重大

  轉變，看到了影星的崛起與沒落，更看到為了拍電影而要去與上流社會或資本家們打交道

  ，忍受他們自以為高高在上的優越感，或是陰暗之處也想伸手進來分杯羹的黑道勢力，以

  及隨之而來的黃賭毒，這一切都與利益，都與金錢有關。也許你以為這是世界上最魔幻的

  地方，但它同時也是最現實的金錢世界。


  只是當《Singing in the Rain》在1929年的背景傳唱，當遠走他鄉的男孩在幾十年後再

  度回到這片夢想之地時，看著剛好在1952年上映的《萬花嬉春》，看著片中種種似曾相識

  的片段、勾起的回憶，觀眾們還記得男孩的夢想是甚麼嗎？是創造永恆的事物，留下不朽

  的功績，而電影正是這樣的產物。


  --'
