content: '【2024/02/20 Apple TV 特價報】

  汪汪隊立大功電影版／穆荷蘭大道(4K數位修復版)／深夜加油站遇見蘇格拉底／查令十字

  街84號／鳥人(1984)／巴比倫／失落謎城

  －

  今天的特價首先把上周剩下的派拉蒙特價片做個補遺，首先家裡有小朋友又沒跟到套裝特

  價的話，可以考慮這次《汪汪隊立大功電影版》的單部$90特價。雖然是以小朋友為客群

  的電影，但大人也可以看得很開心，IP也算是這個世代的經典，我覺得是收藏和娛樂價值

  都很滿的一部。另外還有這兩年的《巴比倫》和《失落謎城》也在特價之列，以主打派拉

  蒙近期作品而言，算是蠻有誠意的一波。

  －

  緊接著是4K版本的《穆荷蘭大道》直接特價到$80的歷史新低，這部4K數位修復版和之前

  的HD版本在商店裡是不同產品，雖然要重新購買，但這個價格我覺得對收藏家來說也不吃

  虧了。另一部$80的則是心靈成長經典《深夜加油站遇見蘇格拉底》，相信不少人小時候

  都有看過，雖然主角是青少年，但在各個人生階段看都會有不同的想法，很適合用來反思

  自己現況的一部好片。

  －

  最後推薦1987年安妮班克羅夫特和安東尼霍普金斯主演的《查令十字街84號》；以及凱吉

  哥主演，1984年的《鳥人》兩部極少特價的老片，大家可以把握機會收藏，一睹這些老牌

  巨星在四十年前的光彩。

