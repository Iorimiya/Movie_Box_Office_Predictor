url: https://www.ptt.cc/bbs/movie/M.1676381306.A.5C6.html
title: '[好雷] 巴比倫'
content: '巴比倫講述1920年代的好萊塢，


  有聲電影的崛起使得原本無聲電影的演員們被迫面臨轉變。

  -


  前半段笑點很多，派對和拍電影的過程都很瘋狂，


  雖然不確定有沒有誇大，但戲劇效果十足。


  很喜歡導演凸顯拍無聲、有聲電影的差異，


  前者是一堆電影共用同個片場，氣氛鬧哄哄的，


  後者全程緊繃，大家被鎖在室內，而且保持絕對的安靜。


  電影越到後面越沈重，大家慢慢被時代淘汰，


  甚至淪為觀眾與業界的笑柄，最後一個自殺、一個吸毒、一個跑路，真的很感慨。


  （雖然男主角有一半是被女主角害的啦XD


  結局男主角在多年後回到好萊塢，


  回顧他這段時期曾有的青春歲月與年少輕狂。


  就在這時，電影開放播放自古今來一些達成重要里程碑電影剪成的蒙太奇，


  有早期的火車進站、月球歷險記、安達魯之犬等等，


  近期的有電子世界爭霸戰、魔鬼終結者2、駭客任務、還有阿凡達XD


  自己看到這段是目瞪口呆了，有個莫名的爽快感，


  這樣的濃縮凸顯電影的迅速發展，而它也會繼續發展下去。


  導演將電影比喻成文明史，而主角們經歷了一個朝代的興衰。

  -


  缺點的話，我覺得一些橋段有點比重失衡。


  所謂比重失衡，是我覺得有些片段演得太長，但和故事進展沒有太大關聯，


  像最前面的派對，和女主角第一次拍有聲電影那邊，單獨看很精彩，


  但佔了電影太大的比例，看完回想起來覺得稍微冗長。

  -


  其實很訝異這部在評價票房上都失利，


  雖然長達三小時可能讓人卻步，


  但很多橋段的節奏、戲劇張力掌握得很好，


  導演更是拍過Lala land的男人，再怎麼說應該也有不少觀眾捧場，


  結果全球只賣了4200萬美金…


  前一部登月先鋒都破億了，這部沒理由更低啊……


  我想宣傳可能也有點問題（？


  這部分還請有關注這部的板友補充說明。

  -


  最後補上電影中我很喜歡的一段獨白，


  是布萊德彼特的角色在過氣後，最後一次和雜誌總編談話。


  總編的獨白：


  「沒有為什麼，事實就是你曾有一段風光，現在過氣了。我知道這很痛苦，沒有人想要被

  這樣丟下。但過了一百年你我都不在世上後，每當任何人觀賞你主演的電影時，你就會再

  活過來。


  一個五十年後出生的小孩會看著你在大螢幕上活躍的影像，然後覺得他好像認識你，就像

  是他的朋友一樣，即使你嚥下的最後一口氣遠早於他的第一口呼吸。你被賦予了這樣的天

  份，就知足感激吧。」


  最後一句我認為很難用白話翻出原意，她說：


  “You’ll spend eternity with angels and ghosts.”


  「你將與天使和幽靈共享永恆。」


  -


  希望這部在多年後，評價能受到平反。


  --

  謝謝小羊大XD

  但從前有個好萊塢的題材也挺類似，就差個李奧納多（？

  謝謝，我覺得可以，來補上去。

  確實也有朋友說沒接觸電影史的話沒什麼共鳴。但真的很推薦給喜歡電影的人看。

  對耶，這樣一想，我也是受到首波評價的影響。

  從前有個好萊塢很著重在角色，巴比倫只著重時代氛圍，角色設計傾向服務劇情。我認為

  這是戴米恩輸昆丁的地方。

  我覺得單獨看很好看，但以電影調性來說這段確實突兀。從前有個好萊塢在調性切換上也

  贏很多。'
