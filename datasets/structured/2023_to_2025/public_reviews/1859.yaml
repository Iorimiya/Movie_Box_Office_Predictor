title: '[普無雷] 巴比倫 - 關於電影的電影...'
content: '巴比倫 7/10分


  關於電影的電影

  先說優點

  製作精良 場面宏大


  缺點

  重點不清

  支線太多

  不重要的橋段頗多

  片長超過三小時


  而且滿看觀眾對電影的涉略

  如果平常是片場人員

  許多橋段會心有戚戚焉

  但沒接觸的人可能就不能體會那種氛圍


  好看跟無聊的份量大概一半一半吧

  不過後面有一段地窖的

  雖然對劇情推動沒什麼幫助

  但在戲院看

  那個聲光效果跟畫面衝擊性我覺得很讚

  甚至為了那段去戲院看都覺得值得


  結論

  對電影產業有興趣的可以去看

  只想看精彩劇情片可能就一般般吧



  --


  無雷 電影/影集短評IG：




  --'
