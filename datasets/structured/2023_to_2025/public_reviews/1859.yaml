url: https://www.ptt.cc/bbs/movie/M.1676857743.A.566.html
title: '[心情複雜雷] 巴比倫Babylon'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  本來覺得應該不會去看的《巴比倫》，因為週六的風和日麗而接受室友的邀請，衝了國賓

  長春。


  看完三小時的長片，我問室友：覺得如何？


  他說：很好？


  我尷尬地說：我覺得很不喜歡，但幾乎只有一段很喜歡。


  後來聊了一個晚上，最終心得是：即使為了那一段喜歡的地方，進大銀幕看這部片都是值

  得的。


  為什麼呢？因為如果不進大銀幕看，我可能根本看不到喜歡的那段出現。


  究竟是哪一段呢？


  （以下爆雷，未看勿入）


  其實就是從黑白默片時代轉向黑白有聲時代的錄影現場。瑪格羅比反覆演出同一場戲，那

  一場戲對於瑪格羅比第一次演出黑白默片的那場戲，展現出電影史上一個重大轉折：聲音

  時代的來臨。


  當時我腦中想起了此前看的一部好萊塢女性從業人員的紀錄片，印象中片中提到默片時代

  女導演其實不少，但聲音時代的來臨，使得拍電影需要更集中資本，需要更嚴格的統籌，

  大電影公司變得更為重要，而女性導演的機會自此以後便越來越少。


  得知這項知識與在電影中實際看到兩種拍片方式的對比，心情完全不同。知識使人理解電

  影史的變化對產業中的資本與性別結構產生影響，在電影中則可以清楚地看到默片和聲音

  時代延續的技藝與遭遇的困境（無論是現場拍攝、演員表演方式、幕後人員的狀態）。


  因此，我覺得光是可以看到電影史的這一段，就值得去電影看這部片。


  與此同時，我感受到，這是部影迷取向的電影。就像室友後來說起蒙太奇的起源、最後快

  閃的電影片段那樣，大概是越了解電影或電影史，越能夠欣賞的一部電影。


  此外就是，室友後來查到，原本導演似乎是希望由他合作過的艾瑪史東來演出女主角，但

  最後由瑪格羅比演出。其中原因是檔期或什麼不曉得，但以結果來說，我們都覺得很好。

  室友甚至表示：這是瑪格羅比的代表作。


  ***


  這裡是我的樂園:




