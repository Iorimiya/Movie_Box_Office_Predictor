url: https://www.ptt.cc/bbs/movie/M.1733281766.A.C9A.html
title: '[新聞] 瑪格羅比不懂為何《巴比倫》飽受觀眾批評'
content: "新聞網址：\n\nJoker 2024-12-03 23:59:40\n\n\n金獎導演-戴米恩查澤爾（Damien Chazelle）耗資近八千萬美元製作的野心時代劇《巴比\n\
  倫》（Babylon）兩年前在院線慘賠，\n。身為該片女主角的瑪格\n羅比（Margot Robbie），近日登上華納兄弟影業自家的播客節目《Talking Pictures》\n\
  受訪時也對此事表達了遺憾。\n\n\n\n我很好奇 20 年後，\n人們是否會疑惑：『等等，《巴比倫》上映當時的市場反響並不好？太不可思議了吧。』\n\n\n\n\
  （圖片來源：好萊塢記者報 Instagram）\n\n\n羅比這番言論被《好萊塢記者報》（The Hollywood Reporter）轉載到他們的官方\n Instagram\
  \ 後，隨即也引發了不少喜歡《巴比倫》的同行深深的共鳴，例如與羅比合作\n過《自殺突擊隊：集結》（The Suicide Squad）的詹姆士岡恩（James\
  \ Gunn）導演，就\n在留言區（上圖）回覆：「我也有相同的困惑。」\n\n\n影集《玩酷世代》（The O.C.）班底的梅琳達克拉克（Melinda Clarke）也在留言表示：\n\
  「我也超愛《巴比倫》，尤其是裡面的音樂！」知名吉他手-傑西戴頓（Jesse Dayton）\n則回應：「對啊，我也沒頭緒。任何對好萊塢的歷史 — 當然啦，這是比較屬於早期好萊\n\
  塢的巴比倫時代 — 有點興趣的人都會喜歡這部片吧。再加上兩位超級巨星在銀幕上發光\n發熱，我覺得超讚的好嗎！」\n\n--\n\n大家覺得呢???\n\n--"
