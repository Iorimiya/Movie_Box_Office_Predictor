title: '[好雷] 巴比倫 2022'
content: '好看

  太好看了

  這部片的門檻就只有那個三小時

  讓我放了兩年

  直到現在網飛上


  我很喜歡 真的

  就算撇除對電影的熱愛

  我也覺得他有完美的展現他三小時的優勢

  展現一個時代 一群人 各個角度的興衰

  雖然後面的展開有點過頭吧

  最後半小時

  但每個笑點我都笑得很開心

  開頭跳舞我愛的要死

  那首 那個旋律 肯定會停在我腦海很多天




  雖然我很討厭這種形容

  但給電影的情書是真的很適合

  最後過了幾十年

  坐回電影院

  真的參與了某個重要的東西

  的那份實感

  荒淫混亂 大象跟氣球的那個狂歡

  那份美好 一切開始的時刻


  很美

  真的好看


  --'
