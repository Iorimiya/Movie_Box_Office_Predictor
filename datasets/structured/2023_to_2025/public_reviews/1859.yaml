url: https://www.ptt.cc/bbs/movie/M.1675238695.A.A23.html
title: '[超好雷]巴比倫 歷史會還這部片公道 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  可能三十年、五十年、一百年 ?


  歷史會修正對巴比倫 還有Damien Chazelle的評價

  然後有在戲院看的那一小撮人 會覺得慶幸


  現在就是最谷底了


  這部對於美國2.30年代紙醉金迷的呈現 大開眼界


  最好的兩場戲


  瑪格羅比第一次拍有聲電影 整個劇組拍到快瘋掉

  光用剪接、演員、空間 就營造出超級緊繃感

  就是這麼簡單的幾十秒 感覺像在看TGM最後任務一樣

  Damien Chazelle真的才子


  陶比麥奎爾帶主角到黑暗地窖

  這場戲沒有在預告裡特別出現 是無預期的

  完全跳脫前面兩小時疲勞轟炸式的華服派對

  真正把所謂紙醉金迷 帶到另一個更黑暗的層次


  當然這部片不是什麼零缺點

  那個亞裔東方夫人角色很冗 中間那場響尾蛇派對太冗部分也和她有關

  結尾很棒 但可以更俐落


  但瑕不掩瑜吧 這部真的讚透了

  而且絕對就是為大螢幕而生的電影沒有疑問

  最豪華布景 最屌爵士配樂 Damien Chazelle真正火力全開

  就算玩過頭也是讚到爆的那種



  --'
