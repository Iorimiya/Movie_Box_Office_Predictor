title: '[普雷]眾星雲集巴比倫 '
content: '雷文防雷資訊頁




  前陣子在電影院看電影時，『巴比倫』這部預告直接吸引了我，但錯過就沒去看，後來

  CP+上新片推薦裡有這部當天熬夜就把她看完了。




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  一直以來就很喜歡布萊德彼特演的電影，女主角由瑪格羅比擔任，而且這部電影的演員陣

  容堅強，更大幅提升觀看慾望。

  講述1920年代創立初期的好萊塢聚集著各式各樣的人們，在榮耀與黑暗交織的電影產業中

  試圖寫下屬於自己的傳奇。

  看完後覺得在好萊塢那樣紙醉金迷的生活，選擇隨波逐流或出淤泥而不染，考驗著人性的

  貪婪和慾望，與現在社會又有何不同?看完的後勁真的好強。


  --'
