title: '[請益] 問一個巴比倫的劇情問題'
content: '以下有劇情雷























  主角的假鈔被識破，準備跟女主角逃亡，

  主角跑到同事家中，

  黑道進門來把同事跟倒楣的室友斃了，

  主角滿臉血跪地求饒，

  然後黑道就放他走了。



  蛤？？為什麼？？



  黑道不就主要來殺主角跟他同事的嗎？

  為什麼突然發慈悲心？

  是我哪裡漏看了嗎，還是這種發展是某種隱喻？

  還是......就是一個偶然？



  還請有大智慧的版友賜教






  -----

  Sent from JPTT on my Google Pixel 7.


  --'
