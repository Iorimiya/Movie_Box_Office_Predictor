title: '[好無雷] 巴比倫很好看'
content: '1、2年前有看過一次 剛剛又複習了一下 (用Netflix看) 片長將近200分鐘

  可以了解到早期拍電影的文化和技術 背景等等 除了了解到拍電影的手法

  也可以很清楚當時的演員為了拍一部好電影所要付出的辛勞和代價

  (原來早期拍電影是會死人的)


  這裡不得不提一下布萊德彼特 演技真的超棒 演什麼像什麼

  我看過的有 木馬屠城 魔球 史密斯任務 火線交錯 惡棍特工 第六感生死緣 子彈列車

  鬥陣俱樂部 班傑明的奇幻旅程 特攻聯盟 從前有個好萊塢


  我是他的粉絲


  這片和香水 辛德勒的名單一樣 有大量露第三點的片 (不喜者勿看)

  因為上次看 部分劇情忘了 所以我想說再看一次 看完神清氣爽 3個多小時一氣呵成看完

  目前我今年最期待的片就是7月份布萊德彼特的F1還有絕命終結站 侏儸紀世界 魷魚遊戲3

  名偵探柯南：獨眼的殘像和年底的阿凡達3


  容我分享一下我的偶像(可略過)


  電影:布萊德彼特

  運動:LeBron James

  歌唱:邰正宵


  都是我的精神糧食 這片其實看完不太舒服 因為參雜了很多噁心的畫面

  像是嘔吐 被響尾蛇咬 但不影響這部片的精彩和好看度 推薦給大家


  有興趣的版友可以趁假日觀賞一下 我之前第一次看的時候在板上有發問問題

  這次特別仔細的重看一次 讚!


  --


  那個....那個.....實現我的夢想(小聲)  摸你的頭  欺負你到哭


  --'
