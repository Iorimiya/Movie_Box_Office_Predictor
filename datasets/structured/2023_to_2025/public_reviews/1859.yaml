url: https://www.ptt.cc/bbs/movie/M.1709386436.A.047.html
title: '[新聞] 《巴比倫》導演坦承票房慘賠 '
content: '《巴比倫》導演坦承票房慘賠：我短期內沒機會拍大製作了，下一部能否開拍也不知道




  《樂來越愛你》（La La Land）導演-戴米恩查澤爾（Damien Chazelle）號召瑪格羅比（

  Margot Robbie）、布萊德彼特（Brad Pitt）、陶比麥奎爾（Tobey Maguire）等巨星主

  演的時代劇《巴比倫》（Babylon）前年底上映後慘淪票房毒藥，耗資近 8000 萬美元製

  作的本片，最終全球票房連 7000 萬美元都不到，各界的口碑亦頗兩極，讓原本寄予厚望

  的派拉蒙影業吃下一大敗仗。




  最近登上播客節目《Talking Pictures》受訪的查澤爾，終於首度公開談論了《巴比倫》

  的失敗對他未來事業的潛在影響。查澤爾坦言，他就快完成新電影的劇本，準備要向各大

  片廠提案，而他很快就會知道，《巴比倫》是否會影響那些片廠看待他的態度：「我最近

  一直忙著寫作，一旦我完成這劇本、並開始嘗試推動製作計劃，我就會嚐到我的事業有沒

  有（因《巴比倫》而）改變。我現在心情有點忐忑，但我不抱任何樂觀的幻想，我知道我

  短期內是不可能再拿到《巴比倫》那種規模的預算，或者至少不會在下部片拿到那種預算

  。」


  查澤爾繼續說道：「當然，從財務角度來看，《巴比倫》根本不成功。你會試著不讓自己

  正在做的創作受這件事影響，但在某種程度上，它就是多少會影響到。但或許這也不是什

  麼壞事吧？我對此的看法還滿複雜的。或許我還沒辦法促成現在手上這個劇本開拍呢，總

  之我們就等靜觀其變吧。」





  奧斯卡最佳導演的頭銜，應該不至於一部票房失利，就要不到新片預算了吧



  --'
