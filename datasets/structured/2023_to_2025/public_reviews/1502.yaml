url: https://www.ptt.cc/bbs/movie/M.1690598621.A.888.html
title: '[普微雷]《鬼手鬼手 請開口》'
content: "昨天早上看到高雄放第二天颱風假本來以為晚上的特映會大概要取消了，幸好到下午可能評估風雨減弱還是照常舉辦。\n《鬼手鬼手 請開口Talk to me》基本上就是一群年輕人不知死活玩類似碟仙、筆仙的遊\n\
  戲玩到出大事。\n傳言中有個靈媒，只要握住他的手就可以跟亡靈對話，也因此手被人砍下來作為通靈道具，遊戲的方式是點燃蠟燭，體驗者被皮帶固定住後，握住那隻左手，並說出「Talk\
  \ to me」，就會看到亡靈在你面前，再說「I let you in」就可以體驗被亡靈附身，但是一定要在90秒內鬆開手讓亡靈離開，不然他們就會不想離去，而如果附身狀態下死去，身體將永遠被亡靈佔有。\n\
  幾個主要演員雖然年輕不過把被附身的樣子演的很出色，第一次出現亡靈附體的場景有點可怕，但後面變得像是派對遊戲讓大家都玩得很high有點好笑，直到有人被附身後嘗試自殘的部份才讓人覺得事情不妙。\n\
  本來以為這類電影會將場景侷限在房間內大開殺戒，但實際上場景還會到戶外跟醫院，而且只有幾個人受傷，血腥程度一般般，但是自殘撞擊桌面後造成的臉部瘀青腫脹還滿寫實，整體而言是劇情還算不錯的A24小品恐怖電影，喜歡看恐怖片的人可以試試。這部是澳洲的電影，我喜歡劇中用受傷的袋鼠來比喻女主不敢親自給仁慈的最後一擊。\n\
  \n題外話不知道為什麼最近在高雄看特映都有遇到一些狀況，以前在台北好像比較少遇到：\n排隊劃位時排隊伍第3、4個位置本來明明只有2個人，結果開始要劃位的時候就變成7個人，當後面乖乖排隊的人是笨蛋嗎？真的是滿沒品的；開演中坐在前前面第五排大概10或11號位的男子，整部片一直隨著劇情在說「三小啦」「袋鼠」「中邪」「亡靈」，旁邊同行的人也沒理他也沒提醒他不要吵鬧，雖然這表示他看的很投入，但真的影響到其它人了，要不是座位離太遠真的想過去請他安靜一點。\n\
  --\n\nSent from \n\n--"
