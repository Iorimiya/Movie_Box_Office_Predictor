url: https://www.ptt.cc/bbs/movie/M.1691725507.A.C85.html
title: '[好雷]《鬼手鬼手 請開口》，不該拿命來玩。'
content: '部落格版：


  先打個預防針是，《鬼手鬼手 請開口》不會是多數人所想的那種傳統恐怖片，但我也不

  會覺得劇情本身具有創新性，而是會用「現代」來形容之。誠如電影題材取樣過去大眾熟

  悉的碟仙、筆仙等，將之翻玩成新的「鬼手」一樣，兩位澳洲新銳導演丹尼菲利浦與麥可

  菲利浦無疑拍出了一部更加貼近現代人生活的碟仙，不走全然恐怖嚇人路線，偶爾還有些

  好笑、荒謬，曾幾何時碟仙給人的恐懼感與壓迫感早已蕩然無存，取而代之的是隻莫名好

  笑的蠟化左手，但或許這隻據聞是靈媒身上砍下的左手，就是屬於Z世代、α世代眼中的

  碟仙也說不定。之所以會想用「現代」來形容，除了是降靈附身媒介順應時代變化，也因

  為剛好前幾天看到了一篇喜劇演員亞當迪凡受訪的文章，讓我決定把《鬼手鬼手 請開口

  》歸類在他提到的現況。


  亞當迪凡受訪內容有部分是在說他認為近年喜劇電影逐漸沒落，即便有喜劇電影可多半也

  都過於追求議題性，他並不認為電影不能有議題性、不能呼應時事，而是有的時候他就只

  是單純想看部好笑的喜劇電影，但現在單純的喜劇電影越來越少已是事實。這個論點我自

  己覺得某方面來看也能套用在恐怖電影上頭，就如同前面提到的，《鬼手鬼手 請開口》

  並不是傳統恐怖片，更能說的是我認為電影恐怖與血腥程度並沒有很高，所以倘若抱持想

  來享受被嚇的觀眾可能會失望。兩位導演追求的顯然並非是單純的嚇人，而是藉由這個故

  事來諷刺現代年輕人為追求刺激、點閱率、博關注而不顧危險的行為，同時亦是對年輕人

  對於人際關係、也就是所謂的「朋友」定義進行反思。


  順著劇情我們可以知道，那隻能與靈界連結的鬼手是這夥人中的其中一個人去向朋友借來

  的，而這個朋友正是電影開場遭到弟弟道奇刺傷的寇爾，當眾人玩遊戲玩到潔德的弟弟萊

  利出事後，他們決定去尋求寇爾的協助，不過想當然的他也沒有辦法，他只是責備當初借

  走鬼手的喬斯不該繼續玩下去，同時也表達了自己對於他們這些自稱是他弟弟朋友的人卻

  沒有在他不對勁的時候阻止他因而讓憾事發生的不滿。而接著再往前一點，潔德帶著仍在

  喪母之痛尚未走出的米亞與萊利去參加派對，海勒見到米亞一臉嫌惡、認為她會壞了氣氛

  ，直到米亞自願體驗附身後才改觀，然後在第二次眾人來到潔德家、萊利想要體驗卻遭到

  姊姊反對，海勒也認為潔德是個無趣的人。



  這樣幾處看似不經意被寫進電影裡的橋段，都在寇爾對著喬斯等人說他們對道奇的行為「

  根本不是真正的朋友」後變得被放大檢視。寇爾這個角色是整部電影裡最清醒的角色，當

  然也可以假設會不會今天不是他的弟弟玩到失去性命，他也可能會是在旁鼓譟吆喝，拿出

  手機錄影、拍照上傳社群網站的人群之一？但總之寇爾的相對清醒確實給了觀眾反思的空

  間，反思是否現代年輕人對於朋友的定義多半是建立在有趣、敢玩、夠瘋之上？只想一起

  玩樂而不想去分擔煩惱？一旦發生事情很快就一哄而散，如此這樣事情發生前不去阻止、

  事情發生後不去關心，然後靜待風頭過了再繼續開下一場派對、進行下一場挑戰，繼續找

  「玩得來」的朋友一起，就像喬斯與道奇又或是其他人的關係那樣無限輪迴。說到底這樣

  的關係還可以用「朋友」二字來稱之嗎？相信兩位導演並不認為。


  過去許多恐怖電影基本有著相似公式，不論是主配角隨著劇情推進堆疊起來的情感，或者

  是為了重要的人選擇犧牲自己性命來換取對方活下去的機會而做出的行動，還有結尾總會

  用親情、愛情甚至友情來戰勝邪靈的收法等等，都是想讓觀眾去看見人性光輝、去感受其

  中溫暖，不過也許是懂得《鬼手鬼手 請開口》裡的諷刺與反思，因此再回來看主要劇情

  便感受不到任何一絲溫馨。屬於典型主角類型的女主角米亞，經歷母親自殺離世後有了心

  理創傷，幾乎可以預想到陷入危險其中的她會在這段過程（劇情）之後走出陰霾、生活回

  到常軌，而觀眾也會在這過程中與她產生某種情感上的連結，但兩位導演丹尼菲利浦與麥

  可菲利浦並沒有朝這方向發展，相反的他們藉著各種編排橋段來讓觀眾逐漸擺脫被情感的

  掌控，能夠更冷靜的從旁去對劇情發展進行解讀與消化。


  在萊利受傷之後，米亞有著主角擁有的彌補、拯救以及摧毀遊戲，阻止鬼手繼續流傳下去

  的機會，她後續的行動、包含著她不顧在出事後潔德與萊利母親蘇對她的反感來到醫院，

  提出幾項可行建議就是想要救萊利。只是隨著劇情，觀眾能清楚知道米亞早已分不清現實

  與虛幻，分辨不出跟在她身邊的是否真是她過世的母親還是其他亡靈假扮的，無從分辨眼

  前所見是真是假的觀眾與米亞，會忍不主的去想米亞所付出的行動，究竟是為了萊利還是

  為了自己？抑或是受到亡靈誘惑驅使？直至最後米亞的「母親」要她去幫助萊利，可米亞

  卻無法像給受傷的袋鼠最後一擊那樣結束萊利生命，只好企圖推著輪椅來到車來車往的道

  路上奮力一推，結果看到最後遭到撞死的是米亞自己時我都在想，或許打從最開始亡靈的

  目標就是最為脆弱的米亞也說不定，就像《微笑》裡那靈體糾纏有著心理創傷之人、讓他

  們看見幻覺後承受不住崩潰自殺的設定那樣。



  至於米亞的結局我的看法是，兩位導演丹尼菲利浦與麥可菲利浦想要試著警惕每個遭到流

  量、點閱綁架而去嘗試危險不顧後果的新世代年輕人，不管你的本性再怎麼善良、不管事

  後多麼後悔做了哪些事，有的時候去刻意觸碰的危險就是不會放過你，如同在我眼裡後續

  任何行動都像遭到亡靈利用的米亞，觀眾懂得她的善良與對奪去生命的不忍，無奈她不懂

  得愛惜自己的生命。儘管會認為這是因為米亞走不出喪母之痛，但就是這樣才越容易輕信

  、求助於超自然的力量，偏偏未知往往伴隨著高程度的危險不該任意嘗試，畢竟危險是不

  會在意你本性是好還是壞的，我想這部《鬼手鬼手 請開口》就是兩位導演的勸世警告吧

  。正因爲有這種感受，才會覺得這部電影好像就是亞當迪凡口中那種沒那麼單純就是要搞

  笑或者嚇人，而是將某種論點與談論議題巧妙塞入劇情讓觀眾後知後覺其中話外音的這種

  類型吧。


  《鬼手鬼手 請開口》恐怖與血腥程度因人而異，我自己是有在開頭被嚇了一次，後面開

  始和鬼手對話後只有米亞首次見到亡靈時被嚇第二次，之後習慣附身狀態後就不覺得可怕

  了，甚至後來幾次其他人握著鬼手時也沒讓觀眾看到他或是她看到了「什麼」，變成得仰

  賴眾人的反應去感受他們的恐懼。整部電影亮點其實都在幾位年輕演員遭到附身後的演技

  ，從米亞初次遭附身後歪頭邪笑不停說著「Run、Run、Run」到丹尼爾被女鬼上身後愛撫

  著自己發出淫蕩的聲音等的都令人驚豔，不同於這個角色本來帶給觀眾印象與形象的表演

  相當到位，而後來整個劇情轉折點的那場戲，萊利遭附身後的模樣與後續意外讓我想到我

  心目中A24神作《宿怨》裡的一場戲，無疑是《鬼手鬼手 請開口》中最精彩的部分。此外

  電影的結局手法也相當特別，沒想到過會用儀式中點蠟燭打開鬼門的方式，來明示觀眾米

  亞已成為亡靈的一份子，而伴隨著熟悉卻不同語言的「Talk to me」則暗示著新的輪迴又

  開始了，亦是替續集預留伏筆。


  《鬼手鬼手 請開口》好看與否見仁見智，我認為即便不去細嚼兩位導演想藉由電影傳達

  的，也能夠從劇情中收穫不少娛樂，偶爾的Jump Scare都有達到其效果，整體氛圍營造的

  很好，演員表現亦是加分項，劇情走向對我來說像是相對恐懼感與壓迫感沒那麼重的《微

  笑》，都是在類型電影中嘗試玩出新東西的作品，至少沒有硬要走主角光環威能的這條老

  路。近幾年只要看到是A24發行的電影基本上都是品質保證，鮮少有看到落漆的，至少我

  目前看過的幾部A24作品、除了在金馬奇幻影展看到的《寶可噩夢》有點吃不太下之外，

  《媽的多重宇宙》、《們》、《血色珍珠》、《日麗》、《我的鯨魚老爸》、《等你當完

  救世主》，還有上週才剛上映的《之前的我們》等的我都很喜歡，《鬼手鬼手 請開口》

  雖沒超越《宿怨》，不過已是近期最佳的恐怖電影。初執導筒能有這樣驚豔的表現，讓人

  相當期待兩位導演之後的《快打旋風》真人版。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
