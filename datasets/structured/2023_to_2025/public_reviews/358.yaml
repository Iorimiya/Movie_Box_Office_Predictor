url: https://www.ptt.cc/bbs/movie/M.1748172401.A.4D4.html
title: '[好雷] 絕命終結站 血脈'
content: '雷文防雷資訊頁


  先說無雷的點


  絕命終結站系列貫穿整個電影的主題，每一集都不太一樣，

  這一次的主題是血脈


  至於什麼原因我就留個懸念


  然後還是提醒一下這個電影是限制級的，看要有心裡準備（不是格雷的五十道的那種限制級

  ，是奪魂鋸的那種）

  想看澀澀的人請左轉，這部完全沒有







  以下有雷

  。

  。

  。

  。

  。

  。

  。

  。

  。

  。

  。

  身為看過死亡客機、死亡公路（木頭那個真經典）、死亡遊樂園（烤皮膚經典）這幾部的我

  ，

  這次理所當然的看了這部血脈啦啦啦




  9G正中間的正中間，直接體驗聲光震撼真爽





  喔好多廢話

  正便開始

  。

  。

  。

  。

  。

  。

  。

  。

  以下真雷請迴避：


  與死亡客機（火燒座位的順序）、死亡公路（校車中的死亡的順序？）、死亡遊樂園（雲霄

  飛車座位掉下來跟其它原因死亡的順序）類似，

  這次聚焦於電影名字中的「血脈」，


  這次的死神布局時間以年為單位去處理，至於原因請看電影（留點懸念嘛）


  開頭熟悉的預告，

  包括但不限於收音機的音樂、餐廳跳舞用的音樂以及歌手唱的歌

  聽到幾個關鍵點我就嗜血的笑了出來（忍不住阿~）


  中間有一部分跟死亡客機一樣，會有順序問題（請期待一下，相信我，這裡是電影高潮）


  不得不說幾十年前的那個場景復原的真美麗，滿滿的懷舊感，那個汽車真漂亮


  然後貫穿整部劇的停屍間歐郎這次依然有出現，

  但是跟大家講的一樣真的變好多好多，


  片尾紀念的名字就是他，我好想哭



  這次有說為什麼他這麼了解死神，想看的人可以看一下喔

  還有結尾的報紙很經典，看過系列作的人記得看完，滿滿的回憶



  最後

  死神不喜歡被欺騙


  ----

  Sent from on my Xiaomi 2407FRK8EC


  --'
