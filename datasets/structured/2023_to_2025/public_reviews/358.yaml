title: '[好雷] 《絕命終結站 血脈》'
content: '《絕命終結站 血脈》（Final Destination: Bloodlines，2025）真的是很厲害的電影。


  那些血腥的畫面，不是吸引我想看的原因。厲害之處不在於劇本有多翻轉，而是世界觀、

  「初始設定」是傑出的。


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  東尼陶德（Tony Todd）在演出這部的當下，已經病重，導演、所有演職員都清楚知道是

  最後的一次合作。


  「要享受生命每一刻，因為你永遠猜不到死期。」才是這部電影有說服力、動人的地方。



  --

  就這樣，很久沒寫電影相關了

  是的，我是看到最後致敬去查新聞才知道

  現在都在寫書的推薦，電影久沒寫了，下次寫豐富一點

  謝謝

  對，看完才知道，回想時覺得很感動'
