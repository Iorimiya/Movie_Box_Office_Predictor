url: https://www.ptt.cc/bbs/movie/M.1746799853.A.3CC.html
title: '[好無雷] 絕命終結站 血脈  停止觀看所有預告'
content: '之前看會計師2的時候不小心看到絕命終結站 血脈的預告，就不小心被小小爆雷了。


  勸各位如果想進場觀看，最好的體驗方式就是不要看任何預告。

  唯一需要知道的就是這系列都是創意死法就夠了



  既然都說賣點是創意死法了，造成的原因就不是單一物件造成，而是各種巧合組合在一起

  ，因此，在觀看的時候發現鏡頭不斷在cue的物件，就會先猜測到底等一下是怎麼死～

  當然其中也有不少假暗示，故意讓你猜錯，這也是樂趣之一



  個人主觀評分：8.5/10



  --'
