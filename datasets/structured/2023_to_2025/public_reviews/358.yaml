title: '[新聞] 《絕命終結站 血脈》大開殺戒 創系列北美'
content: '《絕命終結站 血脈》大開殺戒創系列北美最佳開片！全球嚇破1億美金


  在《MINECRAFT麥塊電影》與《罪人》創造票房佳績後，華納兄弟影業上週末（5月16至18

  日）再度靠著旗下新線影業出品的恐怖片續作《絕命終結站 血脈》延續亮眼成績，在北

  美以驚人的5100萬美金（約台幣15.4億元）創下系列最佳開片成績，並拿下首週票房冠軍

  。


  國際票房方面，《絕命終結站 血脈》同樣大開殺戒，在74個市場一樣斬獲5100萬美金，

  全球首週票房高達1.02億美金（約台幣30.81億元），不僅寫下系列歷來最佳開片成績，

  。


  該片和前作《絕命終結站5》相隔14年終於推出，光是北美首週票房就已超越前作總票房

  4258萬美金，目前看來也。電影能創下佳績，一大

  關鍵是來自


  《絕命終結站 血脈》不僅在爛番茄影評網獲得93%影評人與89%觀眾好評，CinemaScore觀

  眾評價也有B+，對於此類血腥驚悚類型而言已是高度讚賞。電影顧問公司 Franchise

  Entertainment Research 分析師大衛·A·格羅斯表示：「對於恐怖系列來說，這是一個

  驚人的開局。影評極佳，觀眾評分也非常亮眼。」



  此外，上週末華納兄弟共有3部電影擠進票房前5名，除了《絕命終結站 血脈》，還包括

  上映第5週的《罪人》以1540萬美金（約台幣4.65億元）位居第3，目前北美累積2.41億美

  金（約台幣72.8億元），全球票房達3.16億美金（約台幣95.46億元）。


  第3部則是上映第7週的《MINECRAFT麥塊電影》，再以590萬美金（約台幣1.78億元）排名

  第4，北美累積4.16億美金（約台幣125.67億元），全球票房已高達9.28億美金（約台幣

  280.34億元），仍是今年全球最賣座的好萊塢電影。





  --'
