title: '[好雷] 絕命終結站 血脈 全家被死神帶走'
content: '雷文防雷資訊頁


  小弟第一次看到絕命終結站是當年去駕訓班學開車

  駕訓班教練叫我們看影片

  看到的內容是一連串在高速公路上的災難

  嚇到我都覺得學開車是不是一個錯的選擇

  過一陣子才發現原來是絕命終結站

  從此愛上這系列


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  小弟發現了巧合 不知道前面有人提過了嗎


  如果有 還請見諒


  就是阿嬤的預言是她最後死在從大樓掉落下來後被一個尖銳的東西爆頭而死


  似乎他們血脈的人的致命傷都是同樣的部位


  阿嬤被滅火器噴射出來的風向儀 爆頭

  舅舅被割草機 爆頭

  表姐被垃圾車夾著頭 爆頭

  表弟被販賣機的彈簧 爆頭

  媽媽被電線桿 爆頭

  女主 跟 弟弟都被火頭上的木頭 好像也是先爆頭才整個身體壓爛


  只有不是血脈的表哥 是被核磁共振機跟輪椅給夾死


  死神真的很惡趣味欸

  連致命部位也一脈傳承

  -----

  Sent from JPTT on my iPhone


  --'
