url: https://www.ptt.cc/bbs/movie/M.1750519900.A.45B.html
title: '[好雷]《絕命終結站 血脈》傳承經典神髓，並打造全新公式'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  部落格圖文版：


  《絕命終結站 血脈》是我第一次在電影院看這個系列的電影，自己覺得正是這種「既熟

  悉又陌生」的狀態，讓《血脈》之於我變得更好看，更能 100% 發揮它的魅力。


  從收音機裡「燃燒」、「墜落」等等意有所指，同時畫面感滿滿的歌詞，到「天景」餐廳

  上對於災難的明示與隨之而來的預演，當我以為開場過後，死神即將照著剛才模模糊糊記

  下的死亡順序索命，此時女主角史黛大叫著自惡夢中驚醒。正因為有所期待，因此更會被

  電影打造的新公式驚喜到。


  「要進去的人是我。」


  這個藉由家人間血脈產生死神名單的新公式，除了讓主角們相信詛咒為真、推測死亡順序

  的過程多了新鮮感（包含家庭倫理劇的部分 XD），同時家人間的舐犢、手足情深，也創

  造了不管是媽媽挺身而出的高光時刻（雖然似乎沒帥到幾秒 QQ），還是查理拼命救回姊

  姊史黛，艾瑞克試圖幫弟弟巴比騙過死神，這樣或極具張力，或情感滿滿的橋段。


  「其實應該不能算是起死回生…。」


  而對於初次在大銀幕上看到《絕命終結站》系列的我，《血脈》對系列經典公式的復刻同

  樣充滿娛樂性。包括但不限於留意危險元素，想像這些元素如何排列組合成殺機，當然還

  有主角們究竟騙不騙得過死神的一個個瞬間。Btw，真的愛死奶奶說一定要帶走的那本寶

  典，記好記滿的危險徵兆超級嘲諷 XD


  「我們永遠不會知道死期何時到來。」


  在一直飾演驗屍官的東尼陶德，說完要好好過剩下的人生接著便退場的時候，我是覺得有

  點突然。看到片尾打出「獻給東尼．陶德」，才發現他去年底已經因為癌症過世。回想起

  來沉重一定會有，然而也完全接收到那一幕打破第四面牆的灑脫與真誠。


  整體而言《血脈》承襲了系列腦洞大開的死法，以及不確定死神會在何時、對誰出手的緊

  張感，而本集家人間的羈絆，讓無論是有趣、溫暖，還是著集的情緒都更為放大。雖然後

  來劇情急轉直下，有些虎頭蛇尾，可仍然不減電影的魅力。


  最後，開頭跟結尾從汽車突然駛過鐵軌的畫面，到爺爺、奶奶跟查理、珍妮（查理的舞伴

  ）的穿搭都一比一的似曾相識，發現不太對勁的那刻真的超爽 >"<


  --


  部落格：

  FB：

  IG：


  --'
