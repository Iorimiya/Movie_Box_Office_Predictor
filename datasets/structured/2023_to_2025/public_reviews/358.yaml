url: https://www.ptt.cc/bbs/movie/M.1738603237.A.239.html
title: '[討論] 【絕命終結站 血脈】前導預告'
content: '影片連結：



  新線影業的賣座血腥恐怖片系列即將推出全新篇章，帶領觀眾回到死神扭曲正義感的起點

  －【絕命終結站 血脈】。


  故事描述大學生史黛芬妮飽受反覆出現的暴力惡夢所困擾，於是決定回到家鄉，尋找唯一

  可能打破這個循環的人，並拯救家人免於無法避免的可怕厄運。


  電影由華納兄弟發行，於2025年5月15日上映。

  -


  經典恐怖片系列出續作啦！原本以為背景會設得早一點，但看來是跟現實世界同步，好期

  待啊啊啊！


  --

  真的每集最期待的就是開頭的大場面XD'
