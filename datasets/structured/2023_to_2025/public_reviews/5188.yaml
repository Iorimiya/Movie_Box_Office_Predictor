url: https://www.ptt.cc/bbs/movie/M.1482923578.A.F3B.html
title: '[負雷] 樂來越愛你-別拿夢想污辱愛情'
content: '也許妳高估了男主角對女主角的喜歡了

  事實上，從開頭男主角拒絕認識其他異性，就知道他是一個習慣獨自生活，多於嚮往愛情

  的人，當他第一次在碼頭旁獨唱city of star時，也透露出他對愛情有所憂慮，有所不安


  他們的相愛，只是剛好在那個時間，遇見了能夠分享彼此夢想、支持彼此夢想的人，對於

  追求夢想，有著相同頻率的人

  只是愛情不是生活的全部...


  如果再想想，能夠陪伴彼此成就夢想，在那最困苦的日子裡，雖然短暫，然而要比起庸碌

  一生而長廂廝守，也許來得更美好些不是？


  ''''我會永遠愛你''''的這份心意也未必不再，只是以另一種方式存在男女主角的心中


  --'
