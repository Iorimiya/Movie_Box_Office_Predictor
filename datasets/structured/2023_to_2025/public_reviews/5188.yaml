title: '[新聞] 《樂來越愛你》女主角本來是她！傳難搞'
content: '新聞網址：

  《樂來越愛你》女主角本來是她！　傳難搞無緣影后


  加拿大男神萊恩葛斯林（Ryan Gosling）與新生代美國甜心艾瑪史東主演的《樂來越愛你

  》（La La Land）勢如破竹，連拿下金球獎音樂喜劇類最佳影片、影帝后，也在具指標性

  的製片工會獎獲獎成為奧斯卡最佳影片大熱門，艾瑪更在美國演員工會獎榮獲最佳女主角

  肯定，金獎影后幾乎到手。


  隨著電影大熱，該片的幕後故事也紛紛出籠，原來葛斯林與艾瑪竟然不是第一人選，本來

  鎖定的男主角其實是《進擊的鼓手》男星邁爾斯泰勒，女主角則是另一個「艾瑪」──《

  哈利波特》系列的「妙麗」艾瑪華森。《紐約郵報》報導，皆隸屬CAA旗下的艾瑪華森與

  邁爾斯泰勒，因為「太難搞」才與好評不斷的《樂》片失之交臂。


  一名業界人士向該刊透露：「電影公司出價400萬美元（約1.2億元台幣）邀泰勒主演《樂

  來越愛你》，但他開價600萬美元（約1.9億元台幣）。」華森則是一開始興趣缺缺，「後

  來開始丟出瘋狂的要求，例如劇組要配合她在倫敦彩排，但這部電影明明就是《La（美國

  洛杉磯Los Angeles簡稱） La Land》！」消息來源繼續補充：「他們努力試著迎合她的

  要求，但她後來還是覺得電影不適合她。」先前有別的報導指出，華森無法演出該片，是

  因為她選擇拍攝《美女與野獸》。


  現在《樂》片大出風頭，華森與泰勒據說看了很不是滋味，不滿經紀公司沒幫他們談好條

  件、爭取到可能得獎的演出機會，因此對經紀公司發飆。（李子凡／綜合報導）


  --


  我是男生，只能愛男人。我是0號，喜愛專情、體長粗壯的1號男人。


  單身時，喜歡和不同類型的男人上床做愛，也喜歡同時被多個男人輪流上。


  --'
