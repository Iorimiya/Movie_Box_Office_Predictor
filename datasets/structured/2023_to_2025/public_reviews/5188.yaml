url: https://www.ptt.cc/bbs/movie/M.1482856261.A.F9A.html
title: 'Re: [負雷] 樂來越愛你-別拿夢想污辱愛情'
content: '我看到這邊

  覺得由於妳前面難以扭轉的偏見

  導致後面劇情的解讀也走向極端


  蜜亞並非無理取鬧

  她被塞巴斯汀在訴說爵士酒吧夢的神情打動

  也開始勇敢地寫屬於自己的劇本


  他鼓勵她寫自己的劇本，她為他設計酒吧logo

  他們連睡前都還在口沫橫飛地談論爵士酒吧

  他們被彼此打動，也最了解彼此的夢


  所以蜜亞看到台上的表演

  同大多數的流行音樂一樣的制式化

  她雖然對爵士音樂不是那麼熟悉

  但聽起來絕對不是演奏的同時也在創作的那種爵士


  所以她在晚餐時想問雞肉串酒吧

  前面先側面問巡演要多久

  （她覺得巡演完賽巴斯汀就能開他夢想中的酒吧）

  但得到的答案是沒有一定期限

  巡演完，錄專輯，再巡演，無限循環

  所以她接著問說好的酒吧呢？他一直以來的夢想呢？


  我同意你說的，沒有錢萬萬不能。

  可是在這裡的賽巴斯汀很明顯的迷失了。

  他對於自己要賺多少錢，賺多久，沒有設一個停損點。

  甚至在蜜亞問他，「你自己喜歡嗎？」 的時候

  他直接回一句「大家都喜歡我的音樂」

  迴避蜜亞的問題，因為他自己也迷失在那些掌聲中


  或許對於大多數人來說

  賽巴斯汀有錢了，有穩定工作，也有名氣了，這有什麼不好？

  但對於蜜亞來說，對於了解賽巴斯汀夢想的人來說，這樣的他令人感到陌生。


  一切終結在賽巴斯汀的一句「妳只是希望我繼續潦倒好讓妳有優越感」。





  還是前面那句

  妳先帶入自己的主觀意識

  變成難以扭轉的偏見以後

  後面劇情的解讀也就越來越扭曲了



  另外想補充

  滿多音樂劇在表達的形式上

  時空是被壓縮或是放大的

  傳統的一些劇，男女主可以在一首歌就墜入愛河，這也是一般寫實主義的作品不容許的


  所以如果有預設立場去觀賞那些浪漫主義的作品的話

  可能就會像妳一樣

  會錯過很多好文本


  --'
