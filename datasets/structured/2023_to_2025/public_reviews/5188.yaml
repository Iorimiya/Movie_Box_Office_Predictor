title: '[普雷] La La Land 樂來越愛你，小失望。'
content: "說到這個拉拉鍊，男女主角我都超喜歡的，\n\n   本片演技強，場景美，音樂好聽。\n\n\n\n   but，那個劇情軸線的線性真的太單調，真的完全讓人受不了。\n\
  \n   竟然給我春夏秋冬，相識、相戀、磨合、分離、重逢 按表操課!!\n\n   換景頻繁到我情緒完全無法連貫，高中生話劇都排得你拉拉鍊有創意。\n\n  \
  \ 本片亮點真的很多，Emma演技就是屌，很多場景都是亮點。\n\n   可惜就是串不起來，哀，不知道導演和編劇在想甚麼。\n\n\n   期待越大，失望越大。QQ\n\
  \n\n\n\n   【幾幕覺得亮】\n\n   葛斯林帶Emma去爵士餐廳，葛斯林在台上彈琴，\n\n   Emma在台下獨自跳舞的那個剪影，真的美到爆。\n\
  \n\n\n   Emma等待複試結果，和葛斯林坐在白天的山道漫談，\n\n   關於我們現在甚麼關係，還有未來可能漸行漸遠的事實。\n\n   Emma的眼神，真的好強。一部分感動、一部分又要同時閒話家常，超會演。\n\
  \n\n\n   最後Emma和老公意外走到葛斯林的爵士酒吧，\n\n   目光之複雜，還有最後相視一笑，好看。\n\n\n\n\n\n\n\n--\n\n2小時的篇幅，前面累積那麼多，即使難看，\n\
  \n最後投射或張力或事過境遷感一定還是拉得出來。\n\n畢竟真的舖很久，真心覺得敘事編排非常非常非常不怎麼樣。\n\n沒看過~ 近期覺得神片是鋼鐵英雄"
