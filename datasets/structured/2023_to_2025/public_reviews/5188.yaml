title: '[影評] 《樂來越愛你》 你討厭爵士樂？！ '
content: '網頁文章版：



  幕迷影評：


  痞客邦：




  《樂來越愛你》（La La Land）


  你討厭爵士樂？！


  by XXY



  在《樂來越愛你》中，從艾瑪史東所飾演的女主角蜜雅口中說出：「我討厭爵士樂。」開


  始，我就知道這會是一部非常有趣的電影作品。《樂來越愛你》的故事劇情從懷抱夢想的


  兩人出發，並以音樂、歌舞元素作為基底，探討夢想、希望、愛情以及人生哲學等嚴肅議


  題。故事線明確聚焦在女主角蜜雅，以及由雷恩葛斯林所飾演的男主角賽巴斯汀兩人身上


  ，整體節奏輕快，又不失穩重，敘事技巧掌握十分出色。縱使故事中的兩人生活背景存在


  著差異，但努力朝夢想目標前進的心境是相同的—都希望能在洛杉磯這座大都會中嶄露頭


  角。而透過一連串有趣的機緣，兩人因緣際會從相遇到相戀，在面對現實與夢想的衝突時


  ，考驗兩人的感情。雖然電影整體基調看似一個普通的愛情故事，但透過悅耳動聽的音樂


  ，以及賽巴斯汀這位熱愛爵士音樂的鋼琴樂手，如行雲流水般的鋼琴旋律，串起觸動人心


  的故事線。




  電影中的音樂元素，相信是過去不少電影作品著力的重點，特別是音樂主題電影，舉凡歌


  舞片、歌劇、音樂劇或是音樂人的傳記式電影，演員除了在銀幕上賣力詮釋角色的個性與


  動作外，也考驗著歌喉、演奏與肢體演出。在《樂來越愛你》中，我們可以看到艾瑪史東


  與雷恩葛斯林兩人在音樂元素下產生的微妙化學反應，銀幕裡的兩人非常容易讓觀眾們投


  入這帶有一絲奇幻又浪漫色彩的影像空間。有趣的是，《樂來越愛你》故事設定在充滿明


  星夢的洛杉磯好萊塢，也是為什麼原文片明La La Land中的LA，暗示著這是座由夢想與希


  望組成的樂園城市，等著你我帶著夢想闖蕩。




  而艾瑪史東以及雷恩葛斯林，在《樂來越愛你》中飾演情侶的選角策略，對本片著實加分


  不少，也是本片強而有力的一大賣點。在過去多次合作銀幕情侶的兩人，產生的愛戀氣氛


  與默契，非常具有感染力。我們能夠在電影中觀察到一開始兩人的青澀，熱戀中的甜蜜，


  再到遭遇挫折的低氣壓，每一幕捕捉兩人互動的鏡頭都讓人目不轉睛。特別是最終兩人對


  望的神情，一抹微笑，帶著無限惆悵的眼神，無須多語便能將劇情推向最高潮，這絕對是


  艾瑪史東以及雷恩葛斯林兩人非常適合的角色定位。或許兩人的情感從熱戀昇華為生命中


  重要的貴人，戀情如何結束也不再重要，在這短短的冬春夏秋之際，蜜雅與賽巴斯汀兩人


  體驗了無與倫比的精采樂章，戀曲也最終在漸行漸遠的兩個道路上畫下休止符，或許最後


  兩人相望的那抹微笑與充滿無限祝福的眼神，就是詮釋了兩人都是彼此在「人海之中的那


  個貴人」（Someone in the Crowd）。




  不可否認的是，導演達米恩查澤雷對於音樂的熱情，特別是爵士樂的精神、爵士樂手對於


  音樂的態度，對照到夢想家對於追求理想的人生經歷，透過電影語言描述得絲絲入扣、撼


  動人心。這種美好中帶有一絲苦澀的淒美感，或許都是你我的共同記憶，曾經懷抱夢想的


  我們，是否也隨著歲月的演進，慢慢失去了什麼了呢？巧妙的是，《樂來越愛你》透過男


  女主角的生活瑣碎事務，以隨興的爵士音樂作為詮釋的手法，呼應了劇中賽巴斯汀對於爵


  士音樂的介紹。爵士樂就像是一連串看似隨興的旋律，但每個演奏樂器的個體都在進行創


  作，並互相爭奪焦點，互相產生衝突或是妥協。彷彿人生中遭遇的各種不同挑戰，有衝突


  ，也有妥協，但最後我們終究能夠找到一條屬於自己最適合的道路。




  而對白中提到「爵士樂正在消亡」，彷彿導演對現今電影製片環境，以及娛樂產業的無奈


  告白，同時也透過本片回顧那過去好萊塢輝煌的爵士風潮，以及歌舞電影的黃金年代。而


  從達米恩查澤雷上一部作品《進擊的鼓手》中，我們也可以透過一位醉心於精進爵士鼓技


  的樂手，如何慢慢的從一位單純熱愛音樂的年輕人，逐步陷入追求極限的餓狼。我們也可


  以看到達米恩擅長營造緊繃或輕鬆的電影氣氛，逐步堆疊情緒，觀眾們的觀影體驗完全被


  導演所主導，彷彿一場抓住你我心情的爵士演奏：有時輕鬆活潑，有時令人神經緊繃，讓


  人完全享受其中，感受導演對於音樂的熱情。




  另一個讓我覺得有趣的地方，則是貫穿全劇的主題曲「繁星之城」（City of Stars）。


  呼應電影開頭的塞車畫面，每位懷抱著夢想的年輕人接二連三甚至爭先恐後地排隊進入這


  座充滿希望的城市，希望能夠在這個機會大舞台上找到那屬於自己的成名15分鐘。也或許


  我們每一個人都有自己的夢想和那屬於自己未來的想像，你我都是繁星之中的一顆閃耀的


  星星，期待在繁星點點的夜空中被看到。在電影中，「繁星之城」也多次出現在劇情之中


  ，也有不同配合故事情緒的版本，有輕快、有憂鬱、有幽默、有冷靜、有浪漫，同時也在


  夢想與現實不斷衝撞之下擦出不一樣的火花。也正因為這樣緊湊又具衝擊性的氣氛營造，


  能夠不斷挑動你我內心那份失去已久的熱情，我想就是《樂來越愛你》最讓人感動的地方


  。




  整體而言，《樂來越愛你》是一部極具感染力的音樂主題電影。特別是喜愛爵士樂，對於


  想要重溫好萊塢經典歌舞片輝煌時期的朋友們來說，是絕對不可錯過的選擇。故事劇情雖


  然簡單，但卻是講述你我生命中可能遭遇的處境，或是在追求夢想路上跌跌撞撞的人們，


  非常有共鳴的電影作品。電影當中卓越的剪輯功力，敘事技巧，音樂融合劇情氣氛的掌握


  性極高，讓這位年輕導演完全展現了他對音樂的熱情，以及其對電影創作的無限潛力。雖


  然電影劇情焦點集中與男女主角的愛情故事，從有趣的機遇下相遇相識，再到相戀，一同


  面對未來以及現實的挑戰，彷彿一場爵士樂演奏，衝突中又妥協。一來一往之間，劇中的


  兩人像是在「愛情」、「現實」與「夢想」這三個拍子間舞出一曲動人的華爾滋，值得你


  我細細品味。




  一起敬那些追逐夢想的人們！










  【視覺動物的電影觀點】個人評分：


  故事劇情：


  簡單的愛情故事，配合動人又悅耳的音樂，以爵士樂曲隨興又帶著高雅的氣氛，串起整部


  電影。卓越的剪輯技巧加上節奏掌握得宜的敘事方式，足以呈現導演對音樂的熱愛，並讓


  人感受到充滿無限可能的魅力。或許追求夢想這種主題電影已是老生常談，但在《樂來越


  愛你》中，我們還是能被這種人們共通的普世價值所感染，充滿共鳴。


  （9.0 / 10）




  影像美學：


  《樂來越愛你》充滿九零年代的復古風味，加讓色彩鮮明的影像風格，足以呈現爵士文化


  的熱情以及重現好萊塢音樂歌舞片的黃金年代。而電影中角色們充滿活力的演出，也讓整


  體電影氣氛呈現繽紛，熱情奔放，讓觀眾們享受其中。


  （8.0 / 10）




  電影配樂：


  由過去與導演合作《進擊的鼓手》配樂的賈斯汀赫維玆（Justin Hurwitz）操刀，當中充


  滿活力又令人印象深刻，獨具特色且鑑別度高的爵士風格配樂，絕對是喜愛爵士音樂的朋


  友不可錯過的好作品。


  （8.0 / 10）




  視覺特效：


  配合充滿復古風味的影像美學，風格強烈的視覺特效也將電影故事流暢串起的重要關鍵。


  令人目不轉睛又牢牢抓住觀眾情緒的場景變換，瀰漫著奇幻又浪漫的氣氛，令人陶醉。


  （8.5 / 10）




  觀眾取向：（不計分）


  喜愛爵士音樂的觀眾、喜愛艾瑪史東的觀眾、喜愛雷恩葛斯林的觀眾、喜愛達米恩查澤雷


  導演風格的觀眾、喜愛音樂主題電影的觀眾、喜愛歌舞片的觀眾、喜愛九零年代復古風格


  的觀眾、正在追逐夢想的築夢者




  個人總評：8.4 / 10




