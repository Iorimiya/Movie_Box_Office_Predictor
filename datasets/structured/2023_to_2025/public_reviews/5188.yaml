url: https://www.ptt.cc/bbs/movie/M.1486476689.A.D33.html
title: '[新聞] 超酷！《樂來越愛你》推出邊看邊唱版本'
content: "超酷！《樂來越愛你》推出邊看邊唱版本\n\n2017/02/07 21:57\n\n\n金馬奇幻影展推出《樂來越愛你》邊看邊唱版本。（金馬影展提供）\n\
  \n〔記者吳琬婷／台北報導〕4月登場的金馬奇幻影展規劃「La La Wonderland」單元，夯\n片《樂來越愛你》將在期間上映特別版，電影除了中文字幕外，片中歌曲將同步列出英文\n\
  字幕，觀眾可以跟著雷恩葛斯林、艾瑪史東一起嗨唱，沈浸在片中的音樂世界。\n\n\n《樂來越愛你》片尾，透過想像讓無法一起走到最後的男女主角雙宿雙飛，\n靈感來自《花都舞影》。（金馬影展提供）\n\
  \n\n雷恩葛斯林在街頭與燈柱共舞片段是致敬《萬花嬉春》。（金馬影展提供）\n\n《樂來越愛你》叫好又叫座，電影內容致敬了不少經典名片，像是雷恩葛斯林在街頭與燈\n\
  柱共舞、展臂揮帽等舞姿，就是《萬花嬉春》裡舞王金凱利的招牌舞姿；《樂來越愛你》\n片尾，透過想像讓無法一起走到最後的男女主角雙宿雙飛，則是致敬曾囊括六項奧斯卡大\n\
  獎的《花都舞影》。\n\n啟蒙《樂來越愛你》的經典歌舞片《萬花嬉春》、《花都舞影》、《柳媚花嬌》、《紐約\n紐約》等，也將在金馬奇幻影展上映。金馬奇幻影展將於4月7日至16日於台北新光影城、\n\
  iin89豪華數位影城舉辦，更多精彩片單將陸續公佈，獨家「選片指南」將在3月25日舉辦\n，並於3月26日正式開賣。\n\n\n\n--\n\n       \
  \                                                      \n\n--"
