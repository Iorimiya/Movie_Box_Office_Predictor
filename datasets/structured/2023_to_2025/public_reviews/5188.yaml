url: https://www.ptt.cc/bbs/movie/M.1482867048.A.C11.html
title: 'Re: [負雷] 樂來越愛你-別拿夢想污辱愛情'
content: '小弟前天看完


  一點淺見


  ===


  雖然Seb是因為工作需要團拍所以無法到來（而且還是搞錯時間不是臨時的事件），我能

  理解Mia的不諒解。（小弟女友音樂系，第一次獨奏會一個人hold住全場真的很需要勇氣

  ）這是Mia辭掉咖啡店工作後全職寫的劇本吧！男朋友對他來說不就是精神支柱了嗎？他

  們也同居一段時間了吧！所以拉一開始的室友姐妹當第一個投射情緒的對象似乎有點牽強

  。Seb因為工作因素，在結束後Mia走出後台差不多的時間才趕到。Mia大喊一切都結束時

  已經有了伏筆。

  而在等面試結果前兩天，他們在第一次因為牽車而深聊的公園，那「永遠愛你」語意已深

  長。一方面他們的關係已沒有那麼完整，Mia也可能即將遠走他國。回到一開始的地方，

  祝福意味也比較濃厚。

  五年後Mia已為人妻人母，的確節奏感覺的確比較快，個人覺得那是因為貫穿全片的春夏

  秋冬，換成一幕五年後的過場真的讓觀眾措手不及了。五年的青春不短不長，各忙各的人

  生旅途的風景早已不同。

  我也喜歡灑狗血的大大擁抱跟親吻，但是也許是這種無常，這部影片才讓觀眾反覆思量其

  餘韻。我的情緒沒有大起大落，帶著些許的惆悵，看見雙方都有各自的事業，成為彼此的

  貴人也是成熟的愛情。不只Mia因為Seb敢再去面試並向巴黎邁進，Seb的jazz bar也以Mia

  設計的元素為logo。這段回應了一開始四姊妹去的尋找貴人的舞會。

  （這種不是完美大結局的，我都不知道要不要牽著女友的手看了XD）


  ===


  至於一開始Mia試著交往看看的對象，我想是想表達Mia不是一個看重物質而更看重夢想的

  人吧！跟Seb巡演回家被問他的夢想在哪裡還滿吻合的。那個對象的家族聚餐我只記得好

  像是在聊生意。這段對故事線回想起來有點多餘，也讓Mia加了條罪名XD


  補充：

  看了版友的分享，若這段是呼應Mia回到Seb的bar時的回憶，就合理了。當時Seb被fired

  之後撞了Mia的肩膀頭也不回的走了。Mia當時應該已經被他著迷，可惜人生總是在錯過。

  聖誕節的時間點早於Mia的前交往對象。幫臨時浮木QQ


  --

  這樣Mia會被罵更兇？XD 不完美的結局讓我對這部片多了些觀察與思考'
