url: https://www.ptt.cc/bbs/movie/M.1481550791.A.F09.html
title: '[好雷]樂來越愛你的一些心得'
content: '當初看完預告片後立刻愛上了，內容完全超出我的期待 XD

  個人覺得這是一部描寫相當濃厚的感情片，不是那種小情小愛的愛情


  （以下防雷）

























  La la land片中不難發現導演用了不少方式來暗喻男女主角的狀態

  不過個人目前僅記的一些印象比較深刻的，雖然部分可能是自己解讀就是


  在劇初Mia面試失意走在回家路上時，背面的牆壁有一幅很大的觀眾壁畫

  我想那是在暗喻Mia的夢想，台下座無虛席看著自己的表演，後來鏡頭帶到Mia房間，裡面有著巨大壁畫等配置，都描述著她有多夢想成為一位一流的大演員，也正因為如此才能忍受失意了6年的生活。


  而後與Seb的第二次相遇的回家路上，兩人經過了一片樹林後突然出現了城市的夜景，有如柳暗花明一樣，剛好雙方都是處在最人生低潮的時期，互相遇到能瞭解彼此想法的人，關係便如火如荼般得展開了起來，過程穿插了不少經典愛情橋段，一直到天文館達到浪漫的最高點。在天文館最後接吻那一刻導演用了一個宛如劇終的示意方式，塑造一個Happy
  ending的情境。但，只要男女主角在一起了就幸福美滿嗎？可惜的是浪漫之後依舊得面對現實。


  Seb原本可以無憂無慮的活在夢中，但與Mia在一起後開始體認到只做夢是無法讓兩人生活的，因此在朋友的說服下與現實妥協參加了朋友的樂團，而後Mia去了Seb的樂團演唱會開始埋下了矛盾的種子，可以看到Mia隨著歌曲的進行由笑容逐漸轉變成疑惑，因為她真正明白這不是Seb所追求的音樂，在演唱到最後時Mia被湧入的人群擠到後方，這裡多少暗示了Seb與Mia的距離開始變遠，也代表著Seb的夢想正在離他遠去。在團拍時Seb所彈的那首旋律也值得玩味，因為那正代表他當下的選擇，也讓他如此猶豫，只可惜我已經忘記這邊是用甚麼旋律了……。


  有版友有提到Fall同時有秋天也有跌落的含義，個人真的沒有想到，而且非常贊同這個說法，兩人經歷了挫折後放棄了自己的夢想，但卻又被彼此鼓勵重新拾起自己的夢想。如果沒有Seb的堅持，Mia是不會願意再去試鏡一次；如果沒有Mia對Seb的質疑，如果Mia選擇不再逐夢，我想Seb大概也不會選擇繼續完成自己的夢想。正因為同是追夢人，正因為是同類，所以走在夢想的路上才不孤單，彼此的不放棄也同時給予了對方繼續走下去的勇氣，即便已經滿身瘡痍了還是會再去挑戰一次。


  在面試結束後，回到當初天文台的兩人的對話很有意思


  Mia：這裡白天看起來怎麼那麼醜啊！

  Seb：對啊。


  當初兩人相識最浪漫的夜晚是在天文台，如今夢醒時分，最浪漫的回憶反而成了彼此的疙瘩，畢竟關係已不復從前，但大方的調侃也表示內心已經放下了，而後……


  Mia：我們現在在哪？

  Seb：現在我們無法再一起。 （台詞有點不確定）

  Mia：我永遠愛你。

  Seb：我也永遠愛你。


  我覺得Mia的where問得相當有深度，包含了愛情、夢想、生活等全濃縮在一個字裡，而Seb也表示現在並不是時候。至於他們所說的愛絕對不只是男女之情這麼單純，更類似你是我一輩子不會忘記的人的含義。


  至於最後面的幻想導演給了一個開放式的說法，一直到最後都沒說那是誰的想像畫面，這裡就給大家自行評論了。


  --'
