url: https://www.ptt.cc/bbs/movie/M.1483273107.A.C83.html
title: 'Re: [負雷] 樂來越愛你-別拿夢想污辱愛情'
content: '第一次在電影版回文，想回一下這部我覺得拍攝手法、劇情跟男女主角都詮釋得很好的片

  。


  原先想回應一下關於燭光晚餐那段的解讀，

  不過前面有一篇版友的回文已經說明了，

  Mia擔心在意的是Sebastian的夢想還存在與否，

  而Sebastian顯然已經迷失了，

  而兩個人的對話終結在Sebastian的情緒化字眼

  「你喜歡的只是潦倒的我那樣讓妳比較有優越感」這讓人感到陌生。

  因此回文來回應這段兩個人的告別。



  我想也可以理解，

  你前面2/3的電影已經對女主角充滿偏見，

  其實很難再去理解當時兩個人的情緒。


  先說我對這段戲的理解是：

  兩個人已經知道彼此未來要走向不同的路，

  而選擇放手讓彼此在完成夢想的路上更全心投入。


  正因為Sebastian全心相信Mia的天賦跟努力終於被肯定

  她拍完這部戲7個月後一定會走向不同的人生

  而要她在這個難得的機會裡全心投入

  因此Sebastian說「妳必須為了實現妳的夢想全心投入、放棄一切」

  而Mia也終於明白Sebastian指的放棄包含他們（的感情）

  Sebastian明白兩個人都是肯為夢想付出一切的人，他寧願放手也要Mia成就自己的夢想。



  你可能覺得這只是暫時的告別

  但我想Mia及Sebastian說出「我會永遠愛你」

  便很明白這是兩個人最終的告別了

  有時候即使很愛彼此，但若是兩個人終將走上不同的路

  這條路當下的兩個人無法一起走，

  也許放手才是對彼此最好最好的祝福。


  我相信這五年間兩個人絕對都有想過若是當時做了不同的選擇，

  結局會不會不同？

  這段便用兩個人五年後的巧遇演出來了，

  巧遇之前Sebastian去看了Mia主演的電影，

  以及Mia看到Seb''s招牌的驚訝就點出兩個人對於這段感情在心裡的地位不容小覷。

  Sebastian彈琴之後的畫面我不會認為是Mia的精神出軌，

  而是兩個人對於這段感情的遺憾。


  若是當時Sebastian和Mia一起去了巴黎，是不是Sebastian可能會在巴黎的爵士餐廳工作

  ，一邊一起生活？

  若是當時Sebastian和Mia一起去了巴黎，和她共組家庭的是不是就是Sebastian了？

  若是當時Sebastian和Mia一起去了巴黎，最後此時坐在Mia身邊的是不是就是Sebastian了

  ？


  用一首代表他們兩個人的曲子詮釋了也許兩個人都已經想過千百回的遺憾。


  其實我覺得這段告別戲演得很好，

  兩人原先處在分手的狀態了，但顯見兩個人對彼此都還有情感，

  所以Mia才問 ''Where are we?'' （我們現在是什麼狀態？）


  但正因為深愛Mia，Sebastian知道只有放手讓Mia去對夢想全力以赴，Mia實現夢想才會真

  正快樂

  而Sebastian也讓Mia明白了他已經不再迷失，他也會留在這個他熱愛的城市，把他的夢想

  一步一步實現。



  我明白你想說的為了夢想侮辱愛情

  但難道兩個人在一起就是最值得歌頌的愛嗎

  難道繼續在一起真的就如想像那樣能夠順利的成為最後的那個人嗎

  更多時候，也許選擇放手祝福才是對彼此最好的愛



  最後真心推薦這部片，

  二刷之後還是最喜歡Mia最終的audition，

  不用過分的妝容服裝僅僅一首歌就呈現了所有為了夢想堅持到底卻受盡挫折而還不想放棄

  的心情。


  _

  To the fools who dream, to the hearts that break.


  --'
