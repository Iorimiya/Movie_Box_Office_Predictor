url: https://www.ptt.cc/bbs/movie/M.1485296557.A.6BB.html
title: '[新聞] 《樂來越愛你》平紀錄　14項大贏家'
content: '新聞網址：


  《樂來越愛你》平紀錄　14項大贏家


  第89屆奧斯卡金像獎今晚揭曉入圍名單，艾瑪史東（Emma Stone）與萊恩葛斯林這對銀幕

  情侶檔主演的音樂愛情片《樂來越愛你》，入圍最佳影片、導演、影帝后等14項、搶13獎

  ，是本屆大贏家，平奧斯卡紀錄，獲獎呼聲高。「小班」班艾佛列克的弟弟凱西一如預期

  問鼎奧斯卡影帝，勝券在握。

  奧斯卡主辦單位美國影藝學院今邀上屆影后布麗拉森、日本男星渡邊謙與金獎攝影師艾曼

  紐爾盧貝茲基宣布提名。艾瑪與葛斯林主演的《樂來越愛你》入圍最佳影片、導演、影帝

  后等大獎，他倆在片中載歌載舞、相戀追夢，電影去年底上映叫好叫座，更在金球獎破紀

  錄大滿貫7獎，問鼎奧斯卡後勢看漲。

  凱西艾佛列克在《海邊的曼徹斯特》飾演因意外導致家庭破碎的水電工，細膩演技廣獲好

  評，以該片一舉連拿近40座影帝獎，被看好在奧斯卡稱帝，將與奧斯卡影帝丹佐華盛頓、

  前「蜘蛛人」安德魯加菲德等人廝殺。奧斯卡頒獎典禮下月27日於洛杉磯杜比戲院登場。

  （謝宛儒／綜合報導）


  --


  我是男生，只能愛男人。我是0號，喜愛專情、體長粗壯的1號男人。


  很愛被不同的男人上，也喜歡被多個男人當作發洩工具輪流上。


  但是絕對不碰毒，也一定得全程戴套。


  --'
