url: https://www.ptt.cc/bbs/movie/M.1481992277.A.E19.html
title: '[好雷] 樂來越愛你 心得'
content: '小雷























  因為媽媽生日被拉去看，完全沒看過遇告或任何簡介，結果影片一開始就載歌載舞，


  才驚覺竟然是齣歌舞劇(?)  天阿 我還比較想看長城。。。



  但沒想到影片結束時  卻是滿滿感觸



  有時候人生到了一個階段回頭看 每個人都是經歷了一翻波折和經歷才到了現在的地方


  有時候不禁會想 如果過去的人生一切順遂 那現在會有多美好


  又如果當初選了另一條路 現在結局會不會不一樣


  如果男主角放棄了開爵士樂餐廳的夢想 也許可以和女主角快樂的走到最後


  如果女主角放棄最後試鏡的機會回到校園也能有另一種人生


  可是人生沒有如果


  所以人生在世最珍貴的 不是"得不到" 或者是 "已失去"


  而是眼前能把握的幸福


  --'
