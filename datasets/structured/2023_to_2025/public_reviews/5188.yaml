url: https://www.ptt.cc/bbs/movie/M.1481730992.A.65E.html
title: '[新聞] 艾瑪史東︰為何世界需要《樂來越愛你》'
content: '新聞網址：



  文/ Sebox


  艾瑪史東（Emma Stone）以新片《樂來越愛你》（La La Land）一舉拿下威尼斯影展

  最佳女主角，這部由《進擊的鼓手》（Whiplash）導演達米恩查澤雷（Damien

  Chazelle）執導的作品，已經在各大獎項拿下了相當優秀的成績，導演被認為是「

  美國電影的未來」，更有許多影評人認為這部電影將會是奧斯卡獎的大熱門。


  日前女主角艾瑪史東接受了時代雜誌(Time)的訪問，提到了這一路走來拍攝的心路

  歷程，以及他認為這部電影想要傳達給觀眾的訊息，更表示希望透過這樣的作品，

  看到更多人創作出原創且獨特的事物。




  我認為是這個計畫的野心，導演達米恩想要追求的東西非常令人興奮也非常誘人，

  因為我也很喜歡這個故事的原創性，以及它在裡面所設計的致敬橋段，所以能夠

  演出對我來說是非常酷、非常有趣，同時也相當嚇人的。如果每一個小片段的

  調性沒有辦法串連起來變成一部有電影感的歌舞片，我實在不知道它會變成什麼，

  但這也是讓我最期待、最興奮的部份，就是「誰知道呢？」「做就對了！」的

  感覺。




  其實沒有，我更年輕的時候曾經跟自己說服過自己沒有能力可以演出歌舞片，雖然我

  自己真的很想要演出。我長大的過程中參與過很多音樂劇演出，也上過許多聲音練習

  和跳舞的課程，但我就不是…我並不是一個很棒很棒的歌手，也不是一個很棒很棒的

  舞者，所以儘管我曾經夢想在百老匯演出歌舞劇，但當時我認為自己是沒有辦法這麼

  做的。


  拍攝《樂來越愛你》最棒的一個點是，導演達米恩是一個知道自己要什麼的人，他

  希望每個演員都有唱歌跳舞的能力，但不需要在技巧上達到完美，所以我不需要

  像是薩頓福斯特（Sutton Foster，徹底現代的米莉）或是伊迪娜曼佐（Idina

  Menzel，冰雪奇緣）那樣的女伶，儘管他們是我的一輩子都沒有辦法比擬的我的

  女神。




  在拍攝唱歌之前我必須要安靜個幾天，所以我必須要很專心的保持幾天低調，這也是

  拍攝中非常有趣的挑戰。在舞台劇《酒店》（Cabaret）裡面我最喜歡的部份，就是

  莎莉(Sally Bowles，麗莎明尼利在酒店中的角色)站上舞台把自己用力展現出來的

  段落，而在電影裡面唱盜〈Audition（The Fools Who Dream）〉這首歌，那個當下

  讓我想到這個片段，那是我的角色蜜雅(Mia Dolan)豁出去的那一刻，像是「去他的

  ！我就是那個作夢的傻瓜！這就是我，而這就是我被拒絕那麼多次之後所獲得的成長

  。」




  當然有，尤其是隨時隨地要去去試鏡，那種感覺就是你把你的全部都丟進去了，但

  最後什麼也沒有成功，而且還會有一些時候你覺得自己精神混亂，而且應該要放棄

  了。





  我想最主要是能夠看到如此原創又令人開心的故事，像是兩個小時的逃避現實，同時

  又提醒著你，即便你覺得希望已經渺茫，還是要繼續追夢，以及希望與創意的重要性

  。我想在這個年代非常適合講述這樣的故事，我更希望這個故事能夠帶大家離開現實

  ，同時能夠提醒人們找出自己內心深處那些心碎、那些愛，那些跟自己的生活共同

  存在的事物。說一個包含了記憶中復古且甜蜜的部分的故事對我來說很棒，不管世界

  處在什麼樣的狀態，還有很多原創且獨特的東西是我們可以創造的。我希望人們可以

  繼續創造出像是達米恩跟他的團隊們所做的，新穎且讓人鼓舞的作品。


  《樂來越愛你》已於台灣上映，


  ------------------------------------------------------------------------------


  參考外電:時代雜誌

  Emma Stone on Why the World Needs a Movie Like La La Land Right Now



  雖然此片在板上的心得文，疑問文與新聞轉貼文算夠多了，

  但這算是少數劇組重要成員的詳細訪問，所以還是決定分享於此


  --'
