url: https://www.ptt.cc/bbs/movie/M.1484816132.A.2A4.html
title: '[好雷] 樂來樂愛你-謝謝你陪著我追夢'
content: '樂來越愛你 La La Land【謝謝你陪我追夢】



  先說有雷。

  防雷。

  防雷。



  看完之後真的覺得這才是真實人生啊…







  此文非本人同意，請勿用任何形式轉載 、 翻攝、引用、 擷取 、 採用 、 轉貼。


  洽談影評心得請站內信









  若說追愛追夢系列電影的結局都千篇一律，或許這部電影的確結局不像當初看預告片一樣

  ，很少看完電影隔天回想起來還會惆悵，上次給我這種感覺的是「寂寞拍賣師」，總之在

  愛與不愛之間，或許都不像外界想的這麼簡單，而偏向真實人生的結局，也因無法透過電

  影完成內心的夢，就像艾瑪史東（Emma Stone）接受訪問時後說的，有的看完覺得被療癒

  、但有些人卻覺得很受傷很難過。


  拉回電影主軸來看，男女主角Sebastian和Mia的相遇，說是在雙方窮極潦倒之際也不為過

  ，Mia因為要準備電影試鏡，所以在練習台詞，而塞在後面的Sebastian絲毫不客氣的叭了

  一長聲，順便超車到她面前示意了一下，感情路線從這展開，不是冤家不聚頭大概就是這

  意思。


  而Mia正準備下班去試鏡時，白襯衫被咖啡潑的一身髒，不知道是第幾次的試鏡失敗，失

  落且哀怨的Mia無力回到家，緊接著跟室友一起要去參加聚會配的那首歌Someone in the

  Crowd，完全就是證明了Mia早就認為自己是有條件、有實力的千里馬，但她需要機運，她

  欠缺的只是茫茫人海當中賞識他的那個伯樂。


  「Someone in the crowd could be the one you need to know

  The one to finally lift you off the ground」


  作夢築夢或許就是這麼一回事，想著自己可以到那裡，但現實狀況是自己卻只能停滯在這

  裡，兩個地方看似如此接近，但卻無法接近心中夢想的那種心態，掙扎著到底自己哪裡出

  了錯、為何所有不順的事情都會發生在自身上、而且倒楣的事情一件接著一件發生，在夢

  與不夢之間、在生活與理想之間，無止盡的掙扎跟徘徊。


  Sebastian在餐廳裡面被炒魷魚心情不爽，Mia不知道這一切，只是路過覺得音樂好聽就被

  吸引，本來想上前致意，但卻被心情不佳的Sebastian狠狠撞了肩膀，兩個看似被生活整

  到幾乎要放棄夢想的人，是多麼相似，編劇手法用這樣子方式讓他倆再度重逢，就不難看

  出雙方之後會有的火花。


  後來他們之間的戀愛火花我就不詳述，但我覺得彼此最真誠的，是他們始終相信對方的夢

  想會實現，而且用盡所有力氣的鼓舞對方，也願意為了對方付出跟改變。


  Mia原本不喜歡爵士，但因為Seb帶領她的關係，所以她喜歡了。Sebastian幾乎是用一種

  完全溺愛的態度在支持Mia的夢想，每當她恐懼跟失落時，Sebastian就會用堅定的眼神跟

  口氣說，誰管他們、x的，我只相信妳會做得很好！


  男生刻可以學一下，當女生在跟你抱怨她工作的事情，請不用幫忙分析理解

  還是幹嘛的，真的只要學Sebastian就好，當女生在詳述工作上的低潮，我們第一時間想

  聽到的是你們站在我們這邊，跟著一起罵也好，等女生的情緒稍微平緩了，再開始幫忙給

  建議都不遲。


  而影響Sebastian最重要的那瞬間，我一直覺得是Mia跟家人的那通電話，Sebastian聽到

  了，聽到女朋友家人對他能不能存錢、能不能照顧自己有質疑，所以他選擇了去跟昔日友

  人合作，即使他心裡或許也沒那麼喜歡，但為了快速圓開店的夢，他必須要有錢，他或許

  必須先跟現實低頭，取得一定資本後，才有說夢的資格，那些看似瘋狂的夢，我們仍可以

  一起去做，但在做之前，我必須要先取得妳家人的認同。


  但Mia一路看著Sebastian ，她內心知道他可能不喜歡這種嘩眾取寵的音樂，即使那站上

  一個萬人簇擁的舞台，接受外人的掌聲跟歡呼，但mia知道這不是Sebastian要的，她心疼

  他的夢想竟變成這樣的下場。


  但日漸繁忙的兩個人因為忘記溝通，雙方之間開始有距離跟鴻溝，在餐桌吵架的那劇情，

  字字句句的話都是那麼重，但Sebastian也始終沒說出口，我是因為要讓妳家人安心，所

  以才選擇先瘋狂工作存錢，夢想這件事情等我有資本後再去實現，他也沒有說出口，我拚

  了命工作是因為想要有錢，因為有錢我才能保護妳，才能站在妳身邊不覺得不夠資格。


  若從劇情觀點來看，我覺得Sebastian比較適合當伴侶，而Mia的個性有點太過患得患失，

  她需要有個人毫無二心的支持她，可以共患難、但看起來不太適合共享樂。


  尤其在她自編自導自演的舞台劇受挫時，她在後台聽到觀眾的批評，把所有的憤怒一股腦

  的發洩在Sebastian身上，就可見到這股驕氣。或許我們也能明白跟體諒，我花了大半時

  間好不容易成就了一件大事，但我伴侶卻沒在身邊陪著我，他卻在遠方處理他的公事，而

  在我受傷最需要他之際，他卻不在，所以Mia覺得受夠了，她受夠了每一次搞砸試鏡又重

  新振奮又失望的心情，她也受夠作夢夢到最後像個笨蛋一樣，她受夠這城市的一切（La

  La Land是洛杉磯的別名），所以她想回家了。


  這部片架構在遠離家鄉到外地築夢的主軸上，Mia努力了整整六年，被打倒又站起來、站

  起來又被打倒，就在這樣的自我拔河當中，她歷經煎熬熬了一輪，到底要多堅強、堅強要

  到甚麼程度才夠，這看似追夢過程，卻被觀眾的評語狠狠澆熄了烈火，就像是一個外人告

  訴你，妳到底要多蠢，因為妳根本不做這塊的料，何不趁早快點和生活妥協，快點整頓好

  選其他路走吧，都幾歲了還在想夢想，都不用吃飯了嗎。


  通常正常人的人生到現在就會是結局，電影到這裡就會畫下句點，開始上字幕了。


  但這不是正常人的人生，畢竟這是好萊塢、是電影，所以編劇終究幫Mia圓夢了，

  Sebastian憑著過往的談話記憶，圖書館的關鍵字跟Mia轉達有試鏡的機會，而在試鏡過程

  中所唱的那首歌，我們終於知道她為何這麼想當個演員，Mia回想著姑姑的故事，唱了一

  首獻給有夢想，也因夢想而受傷的人。


  Here''s to the ones who dream

  這首歌獻給懷抱夢想的人

  Foolish as they may seem

  也許他們看來有些愚蠢

  Here''s to the hearts that ache

  這首歌獻給那些疼痛的心

  Here''s to the mess we make

  這首歌獻給我們闖下的禍


  Sebastian最後的一次和Mia相聚，是在他們第一次對彼此動情唱A Lovely Night 的那地

  方，那時兩個距離實現自己夢想都那麼遙遠，而再次相聚彼此的夢想都幾乎快要實現，一

  路走來陪著彼此做夢的情侶，過去的一切已經塵埃落定，我們也終須一別。



  「I will always love you.」


  說的不是我會愛你，而是不管未來事情如何轉變，我心中永遠有個位置是保留給你的，因

  為是你陪我完成了這段夢想之旅，而且終點站已經要如我所願成功了。


  五年後，


  Sebastian終於開了爵士吧，用了昔日愛人Mia想的店家名字，而Mia也成了當紅的演員，

  回到那家咖啡廳，堅持不要招待要付錢，那幕的前後相對應，還是挺老派的告訴你，只要

  你願意作夢去勇敢追尋，都會實現。


  那一個偶然的重逢，Mia腦子架構的那一切，我們不難看出，走到歧異點的關鍵，還是

  Sebastian沒有在Mia舞台劇失敗時候第一時間出現，如果那時的他有出現，如果那時的他

  坐在底下跟著一起觀看，或許他們不會吵架、不會漸行漸遠，或許結婚生子的對象就會是

  Sebastian，但真可惜，人生沒有或許。


  爵士酒吧這一幕真的很真實人生，真實到讓人想哭，我們年少時候或許真的有人陪在身邊

  ，義無反顧的支持著自己，不管他們怎麼看，從那人眼神中看見的自己，永遠是在發著光

  、永遠有無限可能，但最後我們因為現實，因為生活，終究無法一起到白頭，但曾經有過

  的那段旅程，是誰都無法取代的，悲劇才能雋永，遺憾才能永恆。


  並非精神出軌還是什麼的，Mia演得是那種「他才知道我一路走過來，經歷了什麼」的心

  境，我不用再這個人面前多說，他就明白我曾經被現實折磨到不成人形、我曾經到放棄自

  我夢想的邊緣，只是他最終還是拉著我，因為他相信我會成功；即使連我自己都懷疑我自

  己，連我自己都瞧不起自己時，但他對我的實力深信不疑。


  曾經有個人比我還捍衛我自己的夢想。


  Mia最後那回眸一笑，Sebastian也點頭笑了笑，他們終於明白，在人生最寂寞最孤獨時候

  遇見的彼此，都成長也成功了，那些過往的遺憾，終於化成了成功，彼此都替對方感到驕

  傲。


  春夏秋冬的堆疊，人生起落的安排，都謝謝曾經有個人陪在我身邊。


  --'
