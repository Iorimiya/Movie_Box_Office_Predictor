url: https://www.ptt.cc/bbs/movie/M.1481482106.A.18D.html
title: '[微好雷] 樂來越愛你'
content: '很久沒有自創型的歌舞劇了，以自創的角度來說是值得鼓勵的嘗試，不過要先提醒一下，

  這部是歌舞劇的型式，所以要買票入場之前，先問自己喜不喜歡這類型的電影，例如你是

  否看過「媽媽咪呀」，覺得還ok嗎? 不然就會像坐我旁邊的觀眾，從電影開始就睡到結尾

  ，不時的還發出呼聲…


  接著進入正題，相較於媽媽咪呀、真善美、西城故事、屋頂上的提琴手、紅磨坊…等，這

  部片的編劇算是很小品，簡而言之就是普通的戀人故事。這部電影的歌舞內容佔1/3、純

  演戲的部分1/3以及純音樂或純音樂加上歌舞約1/3。似乎由於本部片的主體是關於爵士，

  所以音樂相關的地方除了歌舞部分也還有純音樂的部分。相較於前述列舉的歌舞劇來說，

  他的純演戲部分太多。一般而言，只要進入主題或次主題就該進入歌舞會比較有充足感。

  然而，這部片似乎只有部分獨白或對話才進入歌舞或音樂，甚至在劇情的「夏後」到

  「秋前」有很長一大段完全只是普通劇情演出，這部片出現歌舞的頻率有點過少了，

  我個人覺得無論歌舞或小品劇情上似乎有點空虛。



  以自創的角度來說，我覺得這部片有點現代感又有點80年代的感覺，把他當作新型態的歌

  舞劇，可能會覺得還ok。這部片的優點在於劇情跟音樂有很搭的感覺。主要劇情分為春夏

  秋冬。男女主角在人生道路上受打擊的難熬"冬天"邂逅；在"春天"巧遇曖昧；在"夏天"

  熱戀；在"秋天"感情出現危機但事業出現轉機。之後，為了完成各自的夢想而各奔前程。

  這部片有一個主旋律，但在不同心情、不同季節、不同狀態下透過音符間的節奏快慢，

  使得同一個主旋律創造出不同的變化，進而符合春夏秋冬男女主角各種不同的經歷。



  最後，五年後女主角成為國際巨星並且幸福地成家，男主角開了一間夢想中的爵士樂店但

  還是單身音樂宅。此時，女主角偶然地進入男主角的爵士樂店，男主角在台上表演時見到

  了女主角，男主角回憶起相遇的過程引發了內心藝術家的浪漫，把他們相遇的所有故事

  改編成如同童話故事般美好的結局，譜進了他所演奏的音樂。然而，童話故事畢竟是編的

  ，現實中的男女主角留下的卻是遺憾，當然男主角的音樂是呈現給女主角的，女主角走時

  回望了男主角表示她收到男主角的心意，最後進入現實的結局。


  在效果方面，這部片除了歌曲編的不錯以外，他在運鏡方面也很讓人喜歡，尤其在歌舞的

  橋段帶的景很有fu，我蠻喜歡的。


  就劇情部分，我看完的第一個感想時，他的劇情編排有點像「新天堂樂園」

  (看完內心的感覺也很像)，最後男主角演奏給女主角的樂章就像新天堂樂園中最後導演的

  回顧。就音樂方面來說，我認為如果你想要對這部片有感覺，你就必需將音樂融入劇情，

  才會跟著男女主角的情緒走。建議對音樂有愛的人看這部片，才不會覺得無聊。




  --'
