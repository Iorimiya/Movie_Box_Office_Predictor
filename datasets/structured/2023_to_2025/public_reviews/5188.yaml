url: https://www.ptt.cc/bbs/movie/M.1483946517.A.264.html
title: '[新聞] 金球獎《樂來越愛你》提7中7大滿貫創紀錄'
content: '新聞網址：


  今年金球獎儼然為《樂來越愛你》而設，從主持人吉米法隆開場和賈斯汀的惡搞影片到上

  台領獎，通通由《樂來越愛你》狂掃，甚至創下金球最高得獎紀錄：7項入圍全得！《樂》

  片入圍包括音樂及喜劇類影帝后、導演、劇本、歌曲、配樂、最佳影片，賽前已是大熱門

  ，沒想到如願全收，稱霸本屆金球獎。


  金球獎原紀錄保持是1975年《飛越杜鵑窩》、1978年的《午夜快車》的6項，今被《樂》片

  一舉打破。《樂》今依序先拿2項音樂、劇本、導演和影帝，讓艾瑪史東壓力頗大，不過最

  後仍不負眾望拿下影后，擠下《走音天后》梅莉史翠普。


  影后宣布之後，艾瑪史東含淚走上台，沿路接受眾人祝福及擁抱，她回憶10多年來的付出

  ，若沒有家人在後面支持，她自認撐不下去，更感謝劇組。


  艾瑪史東說，《樂》是一部獻給夢想家的電影，她引用電影情節，勉勵眾人不要輕易放棄

  夢想，就算有人拒你於門外，只要堅持向前目標終會達成。


  --'
