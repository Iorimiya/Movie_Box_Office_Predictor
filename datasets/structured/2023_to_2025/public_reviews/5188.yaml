title: '[討論] iTunes特價 熊蓋毒/不!/樂來越愛你'
content: '【2023/10/06 iTunes特價報】

  重慶森林／樂來越愛你／穆荷蘭大道／不！／熊蓋毒／罪犯艾蜜莉／迷你網紅實貝秀

  －

  這次的片單有不少一定要收的4K電影，大家要把握一下囉！首先推薦4K版本的經典港片，

  由梁朝偉和王菲等巨星主演的《重慶森林》，除了卡司強大之外，對當時香港都會男女孤

  寂心境的刻畫也讓人回味無窮。另一部則是在升級4K後首次特價的《穆荷蘭大道》，建議

  可以把握機會入手。HD的部分也有幾部好片，尤其好評如潮的音樂愛情電影《樂來越愛你

  》是一年可能遇不到一次的難得特價，絕對是不容錯過的入手機會。

  －

  緊接著是這次超精彩的環球特價片單，這次的$90片單看的出來翻新了一波，喬登皮爾去

  年的新作《不！》，以及真實事件改編，話題性十足的《熊蓋毒》都在特價之列。這次也

  有多包含前述兩部，多達6部的4K片，是一口氣收藏的好時機。另外我也想私心推薦以貝

  殼為主角，可愛溫暖的安妮獎得獎動畫作品《迷你網紅實貝秀》，希望大家喜歡。

  －

  以上，祝大家看片愉快。

  －

