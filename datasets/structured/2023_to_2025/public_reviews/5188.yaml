url: https://www.ptt.cc/bbs/movie/M.1481516730.A.564.html
title: '[ 好雷]  LALALAND 樂來越愛你'
content: '受到進擊鼓手導演影響就想去看此片

  但腦中一直浮現的是預告片

  以為只是普通愛情片

  總之就是一個沒做功課的狀態








  --------------雷----------------







  剛開始10分鐘

  男女主角初見的歌舞

  就像那高速公路的大塞車

  實在讓人頗為煩悶（最討厭無腦歌舞片了

  但是但是僅僅前面了


  一定一定要忍住

  之後情緒越疊越高（好險

  而且雙人歌舞融合爵士踢踏舞元素好很多XD



  接下來一幕幕

  男女主角從一開始互看不順眼

  莫名常遇到

  女主角說出「我不喜歡爵士樂」

  劇情開始大爆發


  真的就是

  越來越喜歡眼前這個人

  在敘述他熱愛一樣東西的那種感覺


  然後你本來不喜歡爵士樂

  越聽越享受

  越來越有生命力

  我也才知道原來爵士樂是各樂器拼鬥的產物

  每次都會有不同火花


  你清楚瞭解

  男主角從夢想為了愛情變踏實

  女主角受愛情鼓舞，更勇敢追求夢想


  人生就是不斷地在方案中做選擇

  一如之前台劇的荼蘼

  雙劇情式的運鏡

  各有無奈，卻不由得你停滯不前


  也許是類似劇情

  但節奏掌握卻是好太多

  因此我給好雷


  尤其那復古愛情片的拍攝手法

  頗適合兩位主角念舊的個性

  也許不似他片

  充滿激情的演出

  但還是非常深刻感受

  惺惺相惜（說著說著又想哭了QQ

  不能在對的時間相愛

  雖然很難過

  可是很喜歡這個結局


  嗯嗯好喜歡好喜歡

  當然節奏是偏慢啦

  可是整間電影院都在啜泣耶

  看此片不哭者，謂之______。（好啦 我亂說的


  --'
