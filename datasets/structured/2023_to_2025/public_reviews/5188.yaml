title: '[普好雷] 樂來越愛你 有些地方失望'
content: '只有一個想法


  如果沒有強大的歌曲作後盾  其實可以不用歌+舞


  主觀來說是不習慣歌舞敘事


  客觀來說 用歌舞勢必會削弱某些用演才能呈現的細節和互動 包含對白


  今天這部片做了大膽選擇  很多關鍵時刻不用音樂代入 而是開口唱歌


  很創新有趣 但歌沒很好聽 演員沒到極致 就不一定是最感動


  講白點就是 我覺得關鍵時刻讓兩位好演員去唱歌  有點浪費


  最後神結尾


  就是憑悠揚配樂.強大美術.絕世調度.去烘托到最高點


  如果FOCUS這三本柱 其餘塞更多劇情  我會跪著看這部片


  蠻多人覺得後面比前面好看 是有其道理的



  所以


  這部片的主角只有一個:Damien Chazell  美國影壇的未來


  支持他跟技術人員橫掃一切獎項


  但最佳影片沒有必拿


  --


  那就用配樂就好啦 盡量用 我又沒說禁止音樂Zzzzz 致敬我知啦 只是覺得純演更好'
