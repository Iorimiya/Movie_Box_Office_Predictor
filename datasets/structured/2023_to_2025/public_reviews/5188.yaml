url: https://www.ptt.cc/bbs/movie/M.1482522320.A.A7E.html
title: '[超好雷] 樂來越愛你之 年度最佳電影'
content: '說來慚愧，看電影前對於這部片的了解完全是零，甚至連是歌舞片都不知道，最後看完卻

  因為哭到不能自己而無法離場。

  電影一開始，我都覺得很像一般愛情片般的步調，對於歌曲、佈景、妝容、服裝等，我都

  覺得中規中矩，動畫、合成、拍攝效果及演員的互動，看起來就是「恩，好萊塢的質感」

  。稍微將電影化分成兩部分：

  1. 描述男主對於爵士的熱情，對於傳統的堅持，但卻過著不被別人看好甚至連自己都不

  屑的日子。

  2. 描述女主在夢想追逐的路上，一團亂的生活，慣性的遲到，時常挨罵等。

  3. 兩人不起眼的相遇之下，爾後發覺對方與自己的相似處漸漸產生情愫，隨著音樂播放

  帶出甜蜜蜜的愛情，彼此鼓勵對方一步一步追求理想。

  中間的轉捩點由女主和媽媽的電話開始，男主為了想要做點改變(找到穩定收入)而妥協和

  故友組團演出，而女主也開始籌備獨角戲。雙方忙碌了起來，但也不忘為彼此打氣，直到

  某天的晚餐，女主在聽了男主一場巡迴表演後，明白這跟男主一開始說好的爵士不一樣，

  想要點醒他的初衷，而男主卻回「這難道不是你想要我做的嗎？」此時熱度探測器刺耳的

  鳴聲大響，彷彿道出男女主腦中的混沌。

  後半部：

  1. 男主在一次雜誌的拍攝中，彈起以前最常彈的旋律，漸漸想起曾經的自己。

  2. 女主第一次的演出大失敗，決意放棄演員之路，回到老家看見曾經自己為此多麽悉心

  盼望且努力過。

  3. 被點醒的男主告訴女主她的好消息，女主最後的放手一博讓她找到了伯樂。

  最後女主成了有名氣的明星，偶然之下她走到了男主經營的爵士樂館。當男主演奏起他們

  共同的一首曲，所有的往事歷歷在目卻又有著不同的走向。編劇在此的手法讓我很敬佩，

  將一幕幕串起，編織著如夢般美好的故事，最後一幕，男女主角相視而笑。


  在看吵架那幕時，男主的「這不是你想要我做的嗎？」及女主一臉難以置信的表情，讓我

  開始有了感觸。最近我對人生的方向有些迷惘，我想很多人都是，不知道喜歡什麼，沒有

  特別想追求的事物；好多時候因為別人的期望而做了選擇，但其實從來就沒有「一定」的

  事。當自己犯了錯而感覺無法挽回時，人總習慣懦弱地將推卸責任，我佩服男主最後能將

  自己拉回來，也慶幸他有這樣一個蜜亞可以狠狠打他一巴掌。總感覺夢想離自己好遠好遠

  ，付出了努力而得不到回報；或是人生找不到一個目標，像是漂流木一樣，順著水波看能

  被帶到哪裡。女主在最後的試鏡中，高歌敬追夢之人，即使生活變得一團亂，但那就是人

  生啊，在體會遍體鱗傷後才知道成功並非輕鬆；當得到了回饋時只要一得意忘形便容易在

  花花世界中迷失自我。即便跳進塞納河那寒氣入骨，甚至疼痛地令人難受，再來一次機會

  時，還是會義無反顧地跳入，人生就是要這股熱情，這般狠勁，而世界會因你而轉動。


  片中第二令我感動的是在女主最後的試鏡後，男女主在公園的對話，「Where are we?」

  一句，不單單問了他們現在感情的定位，還有在追夢的路途上，我們前進了多少？「我會

  永遠愛著你」讓我淚腺潰堤，愛的形式有很多種，從雙方的眼神中，我感受到朋友之愛，

  一種淡如水卻會刻骨銘心的感情。曾經我追求過轟轟烈烈的愛，相信狠狠愛一場才值得，

  但有個朋友跟我說，愛是無形的，就好比他的盆栽，他愛他的盆栽，但他不會想要擁有它

  ，他愛它不是佔有而是守護，不必時時刻刻的呵護，卻是全心全意地愛著。讓我想起小王

  子與他的玫瑰，在看那部片時也是心痛了好久，所有的感情建立上少不了愛情，不論友情

  還是親情，全是因為愛著的關係。因為相信對方能夠做得到而放心地讓對方去闖，即使受

  到了委屈，受到了嘲笑，他知道還有對方在為自己聲援。


  電影中男主的故友奇斯，他知道爵士正漸漸式微，而對於傳統及新世代的結合他也只能屈

  服於大眾的喜愛下。這就像李安導演父親三部曲中的飲食男女一樣，一個對於傳統的守護

  還有在現在的衝擊之下必當有著多方的衝突，然而這個爆發會帶來一片混亂，但巧妙的事

  ，在所有的震撼以後，大家又會找到新的平衡點，而後無限循環。男主一開始對於店名「

  雞肉串」相當堅持，他想喚起爵士的風光，後來映入眼簾的SEB♪S表示男主已經得到答案

  ，他也為自己找到了出路。


  在男主最後彈奏的鋼琴曲下，把所有在一起發生過的事改了發展的方向，男女主角用愛克

  服一切，相扶相持的陪伴彼此互相成長，完成所有的夢想。看似完美的一切，卻讓我覺得

  脆弱得像在走鋼索，要是有一點點的瑕疵，彷彿所有事情都會陷入黑暗。我很感謝劇本沒

  有變成那樣的走向，現實是無奈的，但並不是不好，男女主有著彼此的人生，從原本的交

  叉線變成平行線才合理，而最後對方的相視而笑真的很令人感動，在經歷了所有，看著彼

  此從幼稚到成熟，從模糊到清晰，從情人到朋友，從恐懼到自信，那微微一笑，甚至不牽

  動嘴角，也能從眼神中感受到他們之間的愛，那種深刻的鍵結，因為有著那麼多的試煉，

  從中學習而穫得了經驗，在看到彼此的成功之後，終於能放心的給予最深層的敬意及安慰

  。


  在人生的十字路口，我們總徬徨過，但回頭看看自己，不是好好地往前走了嗎？這部片真

  的帶給我很大的力量及鼓勵。 推推推之大推。


  --'
