url: https://www.ptt.cc/bbs/movie/M.1757586564.A.801.html
title: '[極好雷] 樂來越愛你LALALAND IMAX'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《樂來越愛你》極好雷：我愛夢想也愛你\n\
  \n\n■ 評語\n\n首推艾瑪史東和下足功夫的配樂和歌曲，值得 Dolby 廳/ IMAX 觀賞。在愛情事業的命題\n中，取了討喜的切點，給足觀眾追夢、追愛的勇氣，也不忘代價和遺憾，是富有誠意的經\n\
  典大作。\n\n■ 追夢路線討論\n\n《樂來越愛你》主要探討兩大主題：夢想與愛情，這次先從夢想談起。蜜亞 想成為知名\n女演員，爵士狂人 賽巴斯汀 則希望為純爵士保留一片淨土。\n\
  \n兩個追夢人，夢想遠大、困難重重，路線因兩人的個性和經歷有所不同。\n\n首先，蜜亞完全是一顆等待發光的珍珠。她的個性鮮明、積極主動（太會把握機會做球啦\n\
  ，泳池 party 的戲太強了），演技在短短的幾場試鏡展露無遺。\n\n蜜亞 適合的路線是持續做自己，只差伯樂拉她一把。（看完當場再頒一座奧斯卡給艾瑪\n史東）\n\
  .\n鏡頭轉到男主角，賽巴斯汀 想要復甦爵士樂，而且是最純的、最原始的版本。\n\n後來老友跑來找他組樂團，用另一種方式，推廣改編後的爵士樂。看到這我心想：就去吧\n\
  ！\n\n音樂人（或者說演藝人員、創作者）常選擇走一種折衷路線，用熱門、主流的作品，去養\n自己喜歡但市場性不高的作品。\n\n即便得付出一些犧牲藝術、個性的代價，也是可選實際的方案B。\n\
  .\n後來，賽巴斯汀半被說服半相通，放棄了巡演機會。\n\n樂團是離夢想最快的捷徑，卻是離本心最遠的路線。在不解賽巴斯汀的選擇時，腦中突然\n想起：啊對，他可是個難搞的固執渾蛋啊。\n\
  \n蜜亞跟觀眾都看過他談論爵士樂時，神采飛揚的姿態。那是他的生命。\n\n賽巴斯汀 的夢想，本該是更需要調整策略的文藝復興，卻做出最任性的選擇，可以說是\n樂來越愛你\
  \ 最浪漫（失敗率也最高）的一段。\n\n■ 愛上你，以及你的光芒\n\n蜜亞和賽巴斯汀相愛，除了男帥女美，更重要是看到彼此對夢想的堅持，感到靠近和觸動\n，也是\
  \ 樂來越愛你 感動人心的理由。\n\n放棄愛人、追求夢想不是必然，卻是最適合彼此的人生道路。他們始終心懷夢想，也因此\n在人群裡閃閃發光。\n.\n《樂來越愛你》看似給了夢幻大結局，事業、愛情的抉擇清楚，犧牲也換來成功。最後電\n\
  影用回憶畫面，悄悄給觀眾補刀。\n\n電影播映兩人共組家庭的浪漫想像，看似為了催人眼淚，其實在暗示追夢四處奔走，和安\n穩的家庭生活，兩者可不相容。他們必須做出抉擇，每段錯過的甜蜜，都劃出了見骨的力\n\
  道。\n\n在追夢的人生階段，遇見此生最愛。舞出一段難忘的愛情篇章，永存心中，續寫下一首生\n命樂曲。\n.\n憑著一份古怪熱血，願意為了夢想，一次又一次，縱身跳入塞納河。愛情何嘗不是如此？\n\
  \n\n.\n小murmur：\n1 許願再開狂歡場，請舞者來邊看邊跳\n2 看到一半：兩個人之間有沒有什麼，大家都看得出來（蜜亞就比較尬意賽巴斯汀呀\n3 看到後面：愛情／\
  \ 夢想走味，也騙不了任何人\n\n完整文章＞＞ \n\n–\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n\
  --\n倒不是蜜亞選擇了哪一段情感，而是有些緣分錯過就是錯過了\n錢多錢少的選擇，更像其他愛情電影的命題"
