title: 'Re: [新聞] 「樂來越愛你」好威 再奪導演工會獎'
content: '我真的覺得這部有點言過其實了


  當時看評分高達8.9


  可能太期待了


  音樂是好聽


  但劇情實在是太單薄了


  比起紅磨坊、芝加哥這些經典


  故事性顯得不足


  是不是因為這幾年都沒人拍歌舞片了


  所以又被大獎重視


  一個好看的歌舞片劇情一定要強而有力


  不然我看迪士尼就好啦(打錯，Disney故事好看到不行)


  更正:不然我看普通有音樂的卡通就好啦@@


  這部片對我來說就是太平了


  而且男主角明明本身超有魅力


  可是在這部片就是沒有手札情緣的那種張力和妳很想要衝上去抱他的衝動


  所以回到根本還是編劇的問題


  就是一般般男女生有緣無分的情節


  綜觀真實人生十個有八個無法跟當時最相愛的人走到最後


  就是普通劇情啦


  雖然真是但撐不起歌舞所需要的結構與張力


  以上淺見啦


  雖然被說導演手法有多強


  但觀影者不是只看運鏡難度有多高而已


  重點是能不能看完之後覺得心裡滿滿的感覺


  就是看完除了情緒很滿


  且不是只有單一情緒


  還需要坐在那裏消化一下


  但不是指消化純粹的遺憾或難過而已


  相較之下我甚麼也搞不清楚就看的鋼鐵英雄故事性就強多啦


  知道兩部類型不同


  但因為差一周看還是有點想比較整體評分


  個人觀感


  供參



  --'
