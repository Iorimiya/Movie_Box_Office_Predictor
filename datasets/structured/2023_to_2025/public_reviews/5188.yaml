title: 'Re: [負雷] 樂來越愛你-別拿夢想污辱愛情'
content: '全部吃光光


  ================================









  還是防個雷好了( ￣ c￣)y▂ξ











  ===================================


  個人覺得這部電影應該是普雷"吧" 不至於到負雷，只是看了部音樂電影這樣


  整部電影就是"現實人生的映照"，只是用比較夢幻的手法拍攝出來而已。



  若你(妳)的人生過得比電影來得更豐富(兵變N次、追夢搞到女友離開等)


  自然而然不會覺得電影感人到哪裡去@.@" 在此片之前，個人看過覺得OK的音樂電影


  是《曼哈頓戀習曲》(馬克魯法洛、綺拉奈特莉等)然後電影原聲帶聽了又聽這樣XDDD


  (更別提老梗音樂劇歌喉讚2了。。。我純粹要看安娜。坎卓克的XDDD)



  是可以理解這系列討論串中某篇提到的"蜜亞覺得賽巴斯汀迷失了他的夢想，身陷在走


  紅的虛幻中，便用激進的手段將他罵醒，希望他能夠面對現實，追逐夢想。"




  目前的結局怪怪的地方在於女主角的幻想(或者是電影導演想要訴說的"面對人生的選擇


  選得好是應該，選不好也應該豁然接受)；如果一開始他們倆不是錯身碰撞，而是擁吻~~


  那麼在舞台獨角戲就會座無虛席????然後男主角選擇和女主角一起到巴黎開店、共組家庭


  ，然後一起進入酒吧聽著台上爵士演奏????這好沒邏輯阿XDDDDD



  但如果結局改成「五年後，女主角在街上走，突然聽到一間不起眼酒吧中傳來的爵士樂聲


  ，進而好奇走進去，發現演奏的是個鬍鬚並茂的陌生男子。等聽到他彈相遇第一首歌才


  知道是男主角，兩人感動相擁，並說出我一直愛著妳，一直在等妳，妳終於出現了」


  (然後片頭音樂下，銀幕出現The End字樣) 這才是能夠真正激勵追夢人的結局吧????



  為了追夢，愛情曾經離我而去，但現在夢想成真，愛情也跟著回到當初，Happy Ending.


  --'
