url: https://www.ptt.cc/bbs/movie/M.1481477283.A.887.html
title: '[好無雷]【樂來越愛你】既浪漫又惆悵'
content: '這片光是陣容和題材擺出來就讓人超期待，超正艾瑪史東、超帥雷恩葛斯林，而且

  還是由【進擊的鼓手】導演達米恩查澤雷執導，俊男美女搭上精彩的歌舞和配樂，再以

  絕美的畫面、運鏡和色調去襯托，譜出一部非常浪漫又富有餘韻的愛情電影。看完結果

  也確實沒有失望，非常棒非常喜歡！


  　　故事描述兩名不得志的都會男女，落魄的鋼琴手與等待伯樂賞識的女演員，兩人相

  識相愛並且一同追逐夢想的故事。劇情其實就很簡單，但結尾的處理我覺得很棒，很有

  餘韻很有後座力會讓人繼續的思考下去，也比較符合現實生活中的樣子，如果你有相同

  的追夢經歷會看得更有感。但是呢，因為牽扯到現實面，所以這並不是一部看了會令人

  開心的電影，但也就是帶著一點的不完美，才更讓人覺得刻骨銘心。


  　　導演的第一部作品【進擊的鼓手】是我超級愛的一部片，即使我沒在聽爵士樂，那

  部片也非常吸引我；導演的大銀幕第二部作品【樂來越愛你】，怎麼那麼厲害的新導演

  達米恩查澤雷(年僅31歲)，連續兩部作品都表現這麼棒，承襲上部電影的優點，導演很

  有美感，這部片的畫面和運鏡依然非常地出色！各個場景的色調配和、演員的服裝、以

  及大量聚光燈明暗的使用，幾乎是每個畫面都處理的很美，再配上許多一鏡到底的鏡頭

  ，一氣呵成的歌舞表演看了實在賞心悅目，山坡上雙人踢踏舞那段尤其出色，特別喜歡

  ！劇中各方面也不乏致敬了許多經典作品，但即使沒看過那些作品，也會被那濃濃懷舊

  的復古風格所吸引，令人討喜。美中不足的是，覺得電影中後段有點拖戲，節奏掌握的

  表現不如上一部作品，不然這部片可以更好的。


  　　而且透過這兩部電影，我覺得完全可以感受到導演對於爵士樂的熱愛，這次甚至在

  片中還講解給觀眾聽，也是希望能藉此多拉一些年輕人來欣賞爵士樂吧！而且他還找來

  了【進擊的鼓手】的魔鬼教師JK西蒙斯來客串演出，可是卻沒有把學生麥爾斯泰勒給一

  起找來，在看電影的同時，我心裡就想如果換作我是導演，我一定會把麥爾斯泰勒安排

  在電影中的爵士樂團裡打鼓，就超想看到這樣子的彩蛋啊！


  　　總之呢，這部片非常出色，有美麗的畫面、悅耳的配樂和歌曲、浪漫的愛情故事，

  以及面對現實的惆悵，更有男女主角精湛的演出，特別是艾瑪史東這次真的好棒！並且

  是散場後一定會去找原聲帶來聽的一部片，非常推薦！




  --'
