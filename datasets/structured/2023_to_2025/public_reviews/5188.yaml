url: https://www.ptt.cc/bbs/movie/M.1481262649.A.35D.html
title: '[選片] 最美的安排、樂來越愛你、歡樂好聲音'
content: '如題

  年末有好多電影都好想看

  不知道各位會比較想看哪部


  最美的安排看了預告覺得有滿滿的洋蔥，也很勵志，重點有好多大咖，光史密斯跟凱特溫

  斯雷就好想衝進去看



  樂來越愛你～～～艾瑪史東好正！然後整部片有種很夢幻、很美的感覺，尤其他們兩人一

  起跳舞的那海報真的超吸引人的，而且追夢的題材也很引人入勝啊


  歡樂好聲音是看了預告之後覺得很好笑，本身也很喜歡跟音樂有關的電影，但畢竟是卡通

  ，而且也找不到有什麼非要進電影院看的理由QQ



  求各位大大給本魯一點建議吧


  --

  如果可以也想都看～～但想先挑一部

  我也衝著女主角看的xD最美的安排不考慮嗎？

  知道這部很厲害，柯震東也很帥，但覺得題材太blue了QQ

  求解，為什麼別看？'
