url: https://www.ptt.cc/bbs/movie/M.1483371540.A.044.html
title: '[好雷] 樂來越愛你 – 致曾經的最愛  '
content: "本文同步獨家刊登於ViewMovie : \n\n如欲轉載請先詢問確認\n\n------------------------------------------------------------------------------\n\
  \n                              \"I’ll always love you”\n\n                    \
  \    “You know I’ll always love you too”\n\n\n從幾年前看<Drive>這部片開始\n\nRyan Gosling這位演員就讓我印象十分深刻\n\
  \n剛好日後接觸的他的幾部作品，他都飾演著一種悲劇英雄般的腳色\n\n我每次在劇中，都被他那帶點滄桑與落寞的神情\n\n還有不用台詞，只要盯著就會讓人心碎的雙眸給深深吸引\n\
  \nRyan Gosling於是就漸漸成為了我最愛的西方男演員(沒有之一)。\n\n\n而導演Damien Chazelle在上一部片<Whiplash>給我的印象又十分的深刻\n\
  \n所以在觀影前，我就對這部片的期待很高\n\n而觀完影後，我甚至認為這部片子超乎我的預期\n\n說是傑作也不為過了。\n\n\n1.寫給往日情懷的一首情歌\n\
  \n雖然這部電影是在2016年上映\n\n但卻帶給觀眾一種懷舊的氛圍\n\n不論是旭日東昇的橘黃色天空，或是夕陽將盡的昏黃色調\n\n還有電影中一再出現的老電影，和那些幾十年前成名的爵士樂手\n\
  \n都讓觀眾有一種回到往日美好時光的感覺\n\n這部電影給我的感覺，很像是Lawrence Block寫的<When the Sacred Ginmill Closes>\n\
  \n那種即使城市依舊存在，但是街道上熟悉的店鋪卻一間一間的消失\n\n往日老友和當初思念的伊人卻已不在\n\n而現今的自己卻也不是當初的自己\n\n\n\n而導演Damien\
  \ Chazelle對於爵士樂的愛好更是在他所導演的片子裡一覽無遺\n\n如果< Whiplash >是講他對爵士樂有多喜愛\n\n<LA LA Land>這部電影則是講他對老爵士的一種緬懷\n\
  \n這種緬懷則是讓這部電影的男主角Sebastian(以下簡稱為Seb)繼承\n\n而這部片子也環繞著這個主題，直到電影結束\n\n\n2.誰才是真正的逐夢人?\n\
  \nSeb一開始給我們的形象是一個不顧一切堅持夢想的人\n\n他可以因為自己對爵士樂的堅持不想彈聖誕歌曲而被餐廳老闆解僱\n\n也可以為了自己喜歡的愛店被關掉而一直耿耿於懷\n\
  \n甚至即使入不敷出還是懷抱著要開一間真正屬於老爵士人的店\n\n但這一切的堅持卻在遇見了Mia而有所動搖。\n\n\nMia也是一位為了當演員拋棄了許多事物的人\n\
  \n她原本可以選擇當一個律師平穩的過一生\n\n但因為對電影的喜愛，跑去製片廠裡面的咖啡廳打工，並積極地爭取試鏡的機會\n\n希望有一天賞識她的伯樂出現\n\n\
  但是伯樂還沒出現，三次的巧遇\n\n卻讓Seb先出現在她的生命裡面。\n\n\n兩個截然不同喜好的人的相遇\n\n一開始的戀情是十分的甜蜜與熱情\n\n但是這畢竟是一部包著糖衣的現實愛情劇\n\
  \n劇中的兩位主角雖然都是擁有夢想和行動力的人\n\n但是在現實生活中他們卻是徹頭徹尾的失敗者\n\nMia跟他家人的電話深深傷了Seb的心\n\n畢竟在傳統的觀念上，男方是要負擔比較重的社會責任的\n\
  \n如果沒有跟Mia交往，我相信Seb是不會答應Keith的邀約\n\n去參加流行樂團頂替鍵盤手的位置\n\n但是一份穩定的薪水和額外的票房收入\n\n卻可以帶給他跟Mia更好的生活，還有滿足他開店所需要的金錢\n\
  \n從Seb的眼中來看，這是男孩轉變成男人的過程\n\n畢竟一直活在夢想中而不顧現實生活，是不切實際的\n\n但這卻不是Mia當初喜歡上的Seb。\n\n\n\
  Mia愛上的Seb，是為了夢想不顧一切，即使跌得傷痕累累\n\n卻還是朝著自己目標邁進的男人\n\n是在餐廳巧遇，彈著他所熱愛的爵士樂的男孩。\n\n但是難道參與流行樂團演出的Seb就不是當初的Seb嗎?\n\
  \n\n不，即使樂團再成功，連音樂訪談節目在youtube上點閱數都有89萬人次\n\n甚至Seb成為了樂團的焦點，台下一堆觀眾為他喝采，他最愛的還是老爵士\n\
  \n最愛的女人也還是Mia。只是他知道要成就夢想還是要跟現實妥協\n\n如果自己沒有金錢和名氣，那要如何開店?\n\n開店了會有觀眾嗎?如果沒有觀眾\n\n在沒有成就感的狀況下，他還能繼續堅持玩爵士樂嗎?\n\
  \n\n我們可以發現，Mia的自信很大部分是來自於他人\n\n所以她明明可以寫劇本，但是要Seb給她鼓勵，她才認真的去寫劇本並且自己表演\n\n她也很在意別人的眼光，所以在觀眾稀落，甚至還有人批評她演的很難看的狀況下\n\
  \n舞台劇表現上的失敗成為了壓垮Mia的最後一根稻草\n\n而且最難過的是她人生最挫敗最需要鼓勵時\n\n她最愛的男友Seb卻不在台下\n\n於是Mia從最愛的演員生活中逃開，並且回老家準備放棄一切重新開始。\n\
  \n\n很有趣的是，其實在追尋夢想的過程\n\nSeb一直告訴Mia不用管觀眾，Mia也跟Seb講過，去做自己想要做的事情\n\n但事實上兩個人都會在意觀眾的目光\n\
  \n其實只要有一台鋼琴，Seb就可以玩他的爵士樂\n\nMia也只需要一個舞台或房間，就可以演他想要的舞台劇或跟他姑姑一起演戲\n\n但是沒有觀眾，那Seb還可以說他自己是很棒的樂手嗎?\n\
  \nMia還可以說她自己是個很棒的演員嗎?\n\n同樣的，Mia是Seb最看重的觀眾，所以Mia講的話會特別的傷到Seb\n\n但當Seb放下他僅存的堅持，卻被Mia給否定\n\
  \nSeb也是Mia最好的觀眾，是在他的鼓勵下，Mia才開始寫劇本\n\n但當Mia最無助需要人陪伴的時候，Seb卻在忙巡迴忙專輯\n\n甚至連她的初次也是最重要的演出也缺席\n\
  \n這無疑是對Mia最大的打擊\n\n兩個人在最需要彼此鼓勵的時候，卻傷害了對方\n\n這個傷痕一直到兩人分手都無法撫平。\n\n\n如果不是Seb跑過去通知Mia試鏡的消息，也許Mia的人生就從此歸於平穩\n\
  \n也不會在結局成為明星並擁有一個好的家庭\n\n我們回想起電影的一開始\n\n原來Mia當初所唱的<Someone in the crowd>的someone是Seb\n\
  \n是Seb最後帶著她逃離了平凡，成就了她的夢想\n\n只是夢想成真後，過往的情誼卻已經不再了。\n\n\n3.致曾經的最愛\n\n我很喜歡電影的後面，兩個人在天文台前面的公園\n\
  \n他們第一次在這個公園曖昧是在夜晚，當時的兩人還沒有實現夢想\n\n但是現在是白天，兩個人都快要接近當初的夢想了\n\n但是往日的愛戀卻已經無法再追回，只能互相說著我會永遠愛著你。\n\
  \n\n我相信這句話是絕對的真心\n\n曾經真心相愛過兩個人，雖然因為誤會、爭吵、而分手\n\n卻還是會為對方留下一個角落\n\n時不時的就會想起過往的一切，像永不褪色的老相片。\n\
  \n\n五年過後，雖然過去的美好已不在，但還是有些事物留了下來\n\nSeb的餐廳不叫雞肉串，而是用他曾經的最愛幫他取的名字:Seb’s\n\n當Seb看到Mia時，又彈起以往熟悉的旋律，像一首無言的情歌\n\
  \n五年前，Mia腦海中響起這首旋律時，是從餐桌上離開，面帶微笑衝往里亞托戲院\n\n但五年後，旁邊一樣是她的伴侶，此情此景是如此的相似\n\n但結局卻不同了。\n\
  \n\n曾經相愛的兩人即使此生已無緣分，但聽著往日情歌\n\n還是在腦海中勾畫著曾經的夢想：\n\n如果當初做了那個決定，我們仍舊會在一起\n\n實現著共同的夢想和只屬於我們的未來，也許在台下聽著演奏的會是我們…\n\
  \n\n音樂戛然而止，已經是平行線的兩人終究要別離\n\n但是我們看到Ryan Gosling那帶著千言萬語的雙眼，彷彿訴說著\n\n謝謝你當時的陪伴，讓我們實現了自己的夢想，即使情誼不再\n\
  \n即使此生沒有機會再次相見\n\n但你永遠是我生命中曾經最愛的人。\n\n------------------------------------------------------------------------------\n\
  \n謝謝一路看到這裡還沒end的ptt版友，最後這段是我自己想打的一些話\n\n這是我2017年發的第一篇文章，也是我第十二篇電影心得文章\n\n因為新的合約的關係，所以我會在Movie版消失一陣子\n\
  \n因為自己的第一篇電影文章就是在這裡打的，對於這裡還是許多感情在的\n\n總之，謝謝版友們的支持，我才會一直持續寫著電影文章\n\n我相信不久後的未來，我還是會再回來這裡發表文章的\n\
  \n--\n                                歲月不留下痕跡\n                                時間沖淡了回憶\n\
  \                                只剩文字紀錄下\n                                屬於當時的記憶\n\
  \n--"
