url: https://www.ptt.cc/bbs/movie/M.1483884596.A.3FA.html
title: '[新聞] 金球獎頒獎在即 樂來越愛你呼聲高'
content: '（中央社洛杉磯7日綜合外電報導）好萊塢眾多巨星即將盛裝打扮，步上金球獎紅毯，參

  與明天這場充滿香檳、杯觥交錯的娛樂圈年度頒獎盛宴，其中歌舞片「樂來越愛你」今年

  囊括7項提名，有望成為大贏家。


  法新社報導，由好萊塢外籍記者協會（HollywoodForeign Press Association）主辦的金

  球獎年度頒獎典禮，向來是娛樂圈行事曆上最熱鬧滾滾的1天，電影製片和演員們無不希

  望在奧斯卡金像獎2月登場前，先獲金球獎的肯定，拉抬聲勢。


  權威大獎預測網站Gold Derby管理總監畢朱（Chris Beachum）說：「金球獎分量不如奧

  斯卡獎。這仍是個大盛宴，他們的任務，對我來說，是預測奧斯卡獎，並表彰所有片商，

  人人有獎。」


  充滿懷舊風、向好萊塢歌舞片黃金年代致敬的「樂來越愛你」（La La Land）今年一舉入

  圍7大獎，包含音樂或喜劇類最佳影片獎，本片的男女主角雷恩葛斯林（Ryan Gosling）

  與艾瑪史東（Emma Stone）也分別入圍音樂喜劇類最佳男女主角獎。


  巴瑞賈金斯（Barry Jenkins）的「月光下的藍色男孩」（Moonlight）也有6項入圍，是

  戲劇類別得獎大熱門。


  不過，今年戲劇類最佳女主角獎，以在「第一夫人的秘密」（Jackie）中飾演賈桂琳甘迺

  迪（JacquelineKennedy）的娜塔莉波曼（Natalie Portman）最具奪冠相。


  德奧合資的劇情喜劇「顛父人生」（Toni Erdmann）最有望勇奪最佳外語片大獎，呼聲領

  先另外兩部法國電影「神聖」（Divines）、「她的危險遊戲」（Elle），與法國和伊朗

  聯合製作的「新居風暴」（TheSalesman），以及智利的「追緝聶魯達」（Neruda）。（

  譯者：中央社許湘欣）


  新聞網址：


  --'
