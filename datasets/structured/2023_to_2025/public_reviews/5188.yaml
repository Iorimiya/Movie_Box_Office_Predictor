url: https://www.ptt.cc/bbs/movie/M.1482420310.A.E0A.html
title: '[討論] 為何樂來越愛你可以，你的名字不行？'
content: '有標題兩部電影雷

















  對 我就是在說一首歌唱完產生感情的處理


  當初你的名字肉體交換了一個月超過 用前前前世帶過感情升溫


  被大家幹得要死 說小孩子才能接受的幼稚感情


  樂來越愛你更猛 看夜景拌嘴 說浪費這良夜


  唱完女主角帥氣甩開男友飯局


  去電影院跟男主角親親


  後來就是男女主角的瘋狂放閃


  看完這段 回來爬文


  大家如痴如醉地樣子


  跟把你的名字放歌那段嫌得像肥宅高潮動畫才可能出現的嘴臉


  完全不一樣啊！


  為何樂來越愛你可以，你的名字不行？


  歡迎討論


  --

  說那段很瞎的人 很多唷

  我第一次看你的名字跟你同感 歌怪怪的 結果現在很喜歡 可能插入地可以再加強

  是。

  有看到幾個熟悉面孔欸 可以算確定吧？'
