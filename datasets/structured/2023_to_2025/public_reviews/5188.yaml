url: https://www.ptt.cc/bbs/movie/M.1500209897.A.FE9.html
title: '[新聞] 《樂來越愛你》音樂會登台 幕後鋼琴家原'
content: '將音樂歌舞劇再度推上高峰的《樂來越愛你》（La La Land），這部勇奪奧斯卡六項大獎

  的動人追夢電影，這回將以Live in concert的方式強勢回歸，繼在美國好萊塢碗型露天

  劇場全球首演交響音樂會後，8月則將來台演出，屆時將由電影音樂會新生代指揮艾瑞克

  奧斯納Erik Ochsner帶領長榮交響樂團、實驗合唱團與Jazz Band，陪觀眾重溫經典畫面

  ，跟著男女主角雷恩葛斯林與艾瑪史東追尋愛情與夢想。另外，在電影音樂中扮演關鍵角

  色的鋼琴家藍迪寇伯Randy Kerber，到時也將親赴現場演奏原音重現，帶給樂迷今夏最熱

  情浪漫的電影音樂饗宴！


  《樂來越愛你》電影交響音樂會以原版完整電影35000流明高畫質HD投影機於500吋大銀幕

  播映，在首席巡迴指揮艾瑞克奧斯納帶領下，觀眾將沉浸在長榮交響樂團與國立實驗合唱

  團搭配現場鋼琴獨奏、Jazz Band的悠揚樂聲中，而影迷們熟悉的劇中對白，艾瑪史東與

  雷恩葛斯林兩人的獨唱都將保留，與參與現場的120位音樂家與表演者混合後，形成一場

  華麗又獨特的音樂會經驗。對於電影以音樂交響會呈現，出任舞台音樂總監Richard

  Kraft興奮說道：「透過將艾瑪、雷恩和約翰傳奇的獨特嗓音保存在電影原聲帶中，和現

  場音樂家的表演混合後，我們能夠建立一個獨一無二的音樂會經驗，將它成為電影、前置

  錄音和精彩的現場音樂演出的複合體。」。



  導演達米安查澤雷Damien Chazelle開心表示：「對我而言，最令人興奮的是從電影拍攝

  轉變成一百多位當地音樂家樂團的Live演出和大螢幕的呈現，讓賈斯汀的作品更生動。」

  ；為電影貢獻多首經典歌曲的作曲家賈斯汀赫維茲則說：「管弦樂器的編排是這過程中我

  最喜愛的部分。以管弦樂呈現各種繽紛色彩，無論是憂鬱悲傷或是愉快的。」。



  今年夏天最頂級視覺與聽覺享受的電影音樂會，《樂來越愛你》於8月18日、19日在臺北

  國家音樂廳首演，8月20日則移師臺中國家歌劇院，讓你在美妙樂聲中，一同與兩位主角

  相擁、旋轉、共舞、落淚與微笑！



  --'
