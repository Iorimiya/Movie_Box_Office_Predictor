url: https://www.ptt.cc/bbs/movie/M.1488325061.A.6F6.html
title: 'Re: [討論]樂來越愛你最佳男主角沒得獎?'
content: 'La La Land本身就是一部過譽的電影


  沒錯 這是一部好電影


  但沒有那麼好


  刻意的復古以及我個人覺得略嫌零碎的節奏


  大大限制了演員的發揮


  Ryan Gosling的巔峰就是Drive


  那才是他該得獎的角色


  至於最佳女主角看到Amy Adams沒有入圍就真的隨便了


  一部屬於Hollywood的member berry能在自嗨獎上拿下這些獎項真的就夠了



  --

  是啊 創作沒有標準 評審也有自己的理由 我也不是沒說理由


  是沒全說啦 有點懶


  所以大家來討論啊 崩潰什麼?

  要玩復古 Girl Asleep是我看過近五年最強的


  不服來辯

  得不得獎只是種指標 每部電影本來就是有些人喜歡有些人不喜歡


  我也不是不認同 就只是覺得不對我胃口


  "如果"我是評審我不會覺得這部電影該得某些獎項而已

  討論有論點我都覺得很好 就算是相反意見我也不會認為是負面

  開心看電影最重要

  整部片的重點就在最後的15分鐘 前面就是好萊塢的電影公式 meh...

  啊啊啊 我還沒看啊 這樣算被微爆雷嗎? 最不喜歡結局不夠力的電影惹

  不然你來說說好在哪啊?

  我第一個想到的字是Overrated 有其他更好的翻法嗎?(認真問)

  拿了六個獎項 不算神片? 發大檢視一下很過分嗎?

  哪裡跟風了?

  電影版你開的?

  那就用名不符實吧

  好啦 好啦 名不符實啦

  扣帽子很方便吼~'
