title: '[好雷] 劇憐餘韻在的樂來越愛你'
content: '對我來說，一部好的電影，就是看完心理會有一種被洗滌的感覺。

  腦子會不斷複習劇情，會思考劇裡腳色的行為。

  而樂來越愛你在我心中就是這麼一部電影

  其實一開始看預告，以為是一部女主角是致力成為演員、男主角是音樂劇創作者

  兩個人合力做電影的故事XD  不過.....以下開始有雷。

  防雷防雷防雷防雷防雷防雷防雷防雷



















  防雷防雷防雷防雷防雷防雷防雷防雷






















  防雷防雷防雷防雷防雷防雷防雷防雷(夠了)

  =========================================



  承接上一段，實際上看電影才知道並不是這樣的電影，竟然是一部兩人成功追夢但留有遺

  憾的電影。(我也是有被朋友雷到這一點才去看，就是想去看到底有多遺憾XDDD)


  從我的角度來看，蜜亞跟賽巴不單只是有熱忱的人而已，他們的自尊心也比一般同行的

  人高。兩個人的發展蠻有趣的，一開始跟現實妥協較多的人是蜜亞；蜜亞並不是一個外

  向的人，他並不是那麼喜歡好萊烏的社交場合，但他也還是為了可能的機會，不斷的參

  與爭取可能機會，還有他其實大部分時間還是在咖啡廳打工，一邊博取可能的曝光機會

  ，一邊維生。反倒是賽巴，時間大部分分配給夢想，少部分的時間僅是為了應付帳單，

  藝(中)術(二)家性格很強烈。



  兩個人在一起後，賽巴看到了蜜亞的妥協，也認為有跟現實妥協的必要性，

  剛好出現了那個伯樂可能也暗示伯樂會以一個很討厭的形象出現，

  而且伯樂跟千里馬的想法未必一致，但是他懂如何發揮千里馬的才能，

  而且了解很了解賽巴的個性跟才能並點明他的個性對事業發展上有負面影響

  賽巴這時候的轉變，不僅是為了蜜亞，從他的眼神，

  看出他在原本的夢想道路上受到挫折，因此想要嘗試不同的可能，

  同時也部分認同他朋友對爵士樂的新理念：

  喜歡傳統爵士樂的人就是那麼的少，你認為的經典也不是當代的經典，

  何不試著做些改變呢？



  賽巴事業開始成功的同時，蜜亞正歷經最痛苦的事業轉折點，

  蜜亞當下對賽巴的質疑，不只是對他事業上的質疑，

  更重要的是兩個人已經不再同步調了

  ，以前兩人的時間分配一半給夢想、另一半是愛情，

  兩個人是同步的，但劇情發展至此，賽巴百分之八十的時間都在打拼，

  只剩下百分之二十的時間可以陪伴蜜亞，蜜亞又是如何獨撐過這段時光呢?

  此時的賽巴自己應該還在質疑自己的轉變是正面還是負面的，

  透過蜜亞的質問，更顯示了跟現實做部分妥協的好處，

  賽巴禁不起蜜亞的質疑，蜜亞受不了昔日夥伴的變化，

  同時蜜亞的壓力一下拉到最高點：

  因為跟現實妥協的優點就在眼前，

  一起打拼的夥伴突然在前頭時，一定會產生更多的焦慮，對自己能力的肯定的焦慮。



  壓垮蜜亞的稻草是觀眾直接的評語，也許也是蜜亞的一直以來的心聲，

  失敗，挫折久了真的容易產升自我否定的情緒，

  自尊心越高的人，否定自己的情緒會越強烈，

  可能自己真的就是不夠好、自己就是太高估自己只是不敢承認，

  那夠了，我承認我不好，我放棄，我不要再受傷了。

  那場戲不管賽巴有來、還是沒來結果都一樣，蜜亞還是會選擇認賠殺出，

  太痛了，尤其身旁的人已經取得成功，

  而自己卻還沒有，那不更是自己能力不足的最佳證明嗎？


  好，放棄，end結束這回合。


  不過人生真的很難說，有的時候就是差一個豁出去的勇氣，

  而且蜜亞如果沒有經歷那樣的失敗，難道在最後一次機會時，

  他能有豁出去的勇氣嗎?　

  賽巴比蜜亞更早有豁出去的體悟，所以在表演上他是毫無保留的。

  而蜜亞沒有經歷重大失敗前，總是瞻前顧後的，例如某次進入複試時，

  因為過度興奮，討好考官的成分遠大於表現出自己是演員的成分。




  但是當道路漸漸清晰，不再模糊時，兩個人都了解這段感情也到了終點，

  愛情跟事業在兩人心中的順位都非常明確，

  可是那種心靈相同的默契、類似的經驗...很難再找這樣的人了，


  "我會永遠愛你"


  因為，沒有人能夠了解我是個會說故事的演員，只有你看到了。

  因為，沒有人能夠因為我而愛上爵士樂，但是你因為我而喜歡上了。

  兩人是彼此的頭號粉絲，兩人都一致的做出支持對方在事業的決定。




  最後一段的部分蜜亞終於也完成了自己的夢想，

  但是兩個人的遺憾應該都在於，可以共苦，卻不能同甘的遺憾。

  我認為蜜亞也不太可能跟男主角在一起，因為對方是事業上可以一起衝衝衝的人，

  但是，不是能放下身段支持與陪伴自己夢想的人，這也是他們在一起卻又分開的主因。

  每個成功的男人，背後都有一個偉大的女人，這段話放在他們身上可以重新詮釋為

  "每個成功的人，背後都有一個偉大的支持者。"

  支持者之所以偉大，是因為能理解伴侶的夢想，放棄自身夢想以伴侶的事業為重。



  這風景很美(現實)，但我看過更好的(<==是真的有更好的? 還是"認為"有更好的?)


  最後一段也是在呼應這句

  我想過更好的人生風景，但我也很喜歡現在的生活。




  ===其他雜感分享，看不下去的可以end惹XD


  另外想分享幾個覺得比較特別的呈現手法:


  1. 以電影來說，印象中很少看到用季節來分段的電影，

  大部分都用一段很長的時間來區分。而且看他快速的變換季節我真的很害怕XD

  替主角們擔心，時間過的好快阿，他們這樣一直揮灑青春享受愛情沒問題嗎?

  年紀越大，追夢的成本就越大呀!!!


  2. 不太能理解的的歌舞劇安排

  選擇歌舞劇呈現的方式，我想除了致敬外，

  另一部分是為了讓這電影更有"追夢"的成分吧!

  歌舞劇的部分很華美，

  但是跟過去的歌舞劇不太一樣，一開頭的高速公路橋段，

  沒有我認知應該要有的整齊畫一感，然後蜜亞跟室友們一起跳的那一段，

  也沒有很到位的感覺，整體來說，會知道他們在跳舞

  、服裝、道具也對了，可是大家跳起來就是有那麼點...

  不在節拍上不到位的感覺，可能也跟現代舞為主流有點關係吧?!

  後來有看艾瑪史東的訪談，他說導演刻意找他時，

  有看重他的舞蹈技巧沒有到純熟的特點，

  因此不太確定導演在幾段跳舞的人選是不是也都刻意找非專業的人們來詮釋。


  3. 有好幾個鏡頭轉好快、糊糊的

  一直在想是不是眼睛花了，因為今天很早起床累得要死XD

  不過後來想說大部分都還是很清楚阿~應該就是導演刻意的手法吧。

  人生中，也是有些人在自己生命中的份量特別重，有些人就只是過客，

  可能是想特別呈現那些追夢的過程，一直前行的人們，

  是不會看到身旁的人們，他們只是過客XD


  4. 另外值得一題的是配樂真的非常的棒!!!!

  不旦完美的串接劇情，也很能反應追夢的那種諸多無奈卻還是得樂觀堅強面對的感覺。






  其實還有很多可以討論的部分XD

  有人提到壁畫，而我覺得劇中星星在不同橋段的隱喻也很棒，

  還有很多感想大概還需要一段時間的沉澱或二刷才會浮現，

  不過這部電影真的好多豪多可以討論的點阿~

  期待後續會有更多的討論，

  打的有點長，謝謝看到這裡的你 : )


  --


  謝謝支持囉~XD 重新看一次後，覺得自己寫的很說教XDDD'
