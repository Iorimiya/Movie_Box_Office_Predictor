url: https://www.ptt.cc/bbs/movie/M.1481912459.A.CA8.html
title: '[好雷] 樂來樂愛你 - 我看過更好的'
content: '自從《假會徵信社》後就變成萊恩葛斯林的小迷妹，當然不能錯過話題十足口碑爆棚的《

  樂來樂愛你》。可沒想到這部裡面的艾瑪史東更迷人呀!!!!!!!!!!!!!


  _______________________________


  『我看過更好的。』


  這是主角們感情升溫的那晚，女主蜜亞看著炫麗的夜景蹦出的一句台詞 ( 印象沒錯的話

  還說了2次 )。當下覺得好突兀阿且太煞風景了吧，觀賞完電影又沉澱了好幾天，卻發現

  這是最能總結我對這部電影感想的一段話了。其實，是不是最美的景色或是不是最完美的

  電影，那一刻起已不重要，這段相遇有留下些甚麼那就夠了。


  故事描述男女主角因夢想而相遇， 因相戀成就夢想的故事， 看起來很老套，確實也就這

  樣沒更多，但簡單的劇情更顯得情感的樸實純粹，加上萊恩葛斯林艾瑪史東的完美詮釋，

  竟變得那麼雋永且迷人。


  大概音痴兼肢障的關係，我看不出這部編舞及音樂哪裡不足(在我眼裡耳裡每一段都很棒

  的意思XD)，所以更單純享受劇情及畫面，然後在音樂出現時熱淚盈眶。片頭那段在死氣

  沉沉的車陣中跳出的群體歌舞，對未知的環境充滿熱情、對未知的未來懷抱希望，一下就

  把我給吸引住，而和室友們的那一段歌舞，不斷讓我聯想到迪士尼公主系列忍不住就被逗

  笑了(感覺會有老鼠出來幫忙準備禮服XD)，可是當賽巴斯汀出場，在彈奏指定聖誕歌曲時

  偷偷插入自己的city of stars時，我竟一邊笑一邊就開始泛淚(是有多感性)。有多少時

  候我們不得不對現實低頭，卻兀自倔強的說著『是我允許、我同意的』，就像在催眠自己

  一樣，好像這樣會好過一點，好像就還能為了夢想再撐一下下。


  有夢想的人是發著光的，所以他們被彼此吸引，其實都不太懂對方的領域，只是笨拙的鼓

  勵對方追求夢想 (也許也是在鼓勵自己)，『沒有人看怎麼辦？』『管他的！』，有時候

  我們就只是要這種單純的支持，不需要再多一個人來告訴你甚麼是現實。當賽巴斯汀為了

  蜜亞還是加入朋友的樂團巡迴時，不再『催眠』自己了，也許是真的妥協了吧。蜜亞去看

  樂團表演時，一下就看出塞巴斯汀的妥協，強撐起了一抹微笑( 艾瑪史東那個表情真太棒

  了，隱藏好多情緒)，她是真的很愛他才能一下讀進他的心裡吧。塞巴斯汀的經濟改善了

  ，是個可以拿的出手的男友了，但卻不是當初吸引蜜亞的那個賽巴斯汀了，她知道，他自

  己也知道，可『妥協』就像紙牌搭成的塔，是不能戳的，明明該是個久違浪漫的晚餐，卻

  迎來令人心碎的衝突，如同骨牌效應，在蜜亞最需要支持時，賽巴斯汀也陰錯陽差地錯過

  了，幫QQ。 她愛他，他也是真的愛著她的，所以當蜜亞夢寐以求的機會來臨時，即使當

  時他倆關係極為尷尬，塞巴斯汀不計前嫌、更不在乎路途辛勞千里迢迢來告知蜜亞，並在

  蜜亞想要放棄時用力推他一把，跳吧，即使塞納河水冰冷刺骨，敬做夢的人，即使像個傻

  瓜。轉眼來到五年後，那段美好的想像隨著賽巴斯汀的琴聲流瀉出來，我的淚水就再也忍

  不住了，畫面越美就越令人感到惆悵。最後最後的相識一笑，謝謝你曾經出現在我的生命

  裡。


  我看過更好的電影，但這會是我最喜歡的電影之一。


  --'
