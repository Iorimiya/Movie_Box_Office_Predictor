url: https://www.ptt.cc/bbs/movie/M.1485591314.A.3E3.html
title: '[好雷] 樂來越愛你：敬用盡全力做夢的傻瓜！'
content: '完整圖文：










  防雷頁











  在宣告LALALAND成為金球大贏家之後，才終於找到時間進戲院看了這部片，入場前


  甚至連預告都沒有細看，但這樣也不錯，在不被劇情牽著走了情況下看完，整體來


  說，以歌舞片加上兩位大牌演員，這部戲在根本上就有機會獲得好評，但特別的是


  ，LALALAND講得不是一般追夢的故事，也講得不是一般的羅曼史，一方面他帶出追


  夢者的孤獨與掙扎，另一方面他描述了愛情在真實世界裡的樣子，這部片很迷人，


  因為講得很深、後勁很強，每一首歌、每一段台詞都有所用心。



  堅持不走尋常路，當個做夢的傻瓜


  女主角是不得志的演員，一次一次的試鏡，一次一次的落敗，這個故事講得不是她


  多努力站起來成為名演員，講得是在追夢的過程中，她從一開始的逞強，到後來放


  棄，她說：「我覺得很受傷。」在到最後豁出去放手一搏。這部片的真實在於，女


  主角認真的覺得再也不要努力了，因為覺得自己沒有才華，覺得努力了那麼久還是


  只能仰望，覺得也許自己就是那些永遠達成不了夢想的人們的其中一個，男主角也


  是，在傳統與創新的音樂中掙扎，加入了賺錢也受歡迎的團體，卻從中迷失了自我


  ，忙到沒有時間留給愛情，忙到忘了自己正在忙著什麼。你看得到他們在夢想的路


  上努力、掙扎、失望、思考、撞牆。



  為了愛情，你願意放棄什麼


  男主角和女主角的相遇，就像是怪咖遇上了怪咖，在兩人最落魄的時候遇到，卻被


  彼此最獨特的一面吸引，開始打開心房，彼此堅持著夢想，其實兩個人對於夢想都


  有一定程度的執著，我想這也是兩人最後會分開的原因，因為夢想超越了愛情，兩


  個人都放不下追求的那條道路。其實有的時候，愛情需要一些犧牲，有的時候，就


  是沒有兩全其美的辦法，有人說，要是男主角跟著女主角一起去巴黎，故事結局可


  能會不一樣，但就像最後美好結局的那段，那間夢寐以求的餐廳就不復存在了！男


  主角為了夢想留下，女主角為了夢想離開，沒有兩全其美的辦法的時候，你願意犧


  牲什麼。




  人生總有遺憾，特別是當你用盡全力愛過


  有些人說，這部片最後以悲劇結尾，但女主角最後想像的美好結局，對我而言不是


  遺憾，而是紀念，她也曾想過故事的結局可能因為一個結局而不同，她也依舊會為


  了同一個人而悸動，但最後，她離開了，離開了偶然進入的Bar，離開了那段轟轟


  烈烈的愛情，離開了那個可能是她最愛的男人，兩人相視而笑，那個笑，不是遺憾


  ，而是祝福，也是釋然，兩個人，都過著不錯的日子，兩個人，都圓了自己的夢，


  人生總有遺憾，但他們不會忘記，在最黑暗的時刻，有著彼此相伴，講著只有兩人


  的語言，彼此鼓勵著別人認為不可能達成的夢，因為用盡全力愛過，才有遺憾，就


  和許多的愛情一樣，每一段，都造就了某方面的自己。



  這部片講得很深，還來不及講完所有，真心推薦可以觀看，特別是在追夢迷惘的路


  上，可以獲得一些啟發和想法。


  --

  我是桑妮，這裡書寫著我的一百種生活




  --'
