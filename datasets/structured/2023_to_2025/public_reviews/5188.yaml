title: 'Re: [負雷] 樂來越愛你'
content: "在那深情凝望、泛淚個三小啦！\n我只看到旁邊的。\n請問在場的各位，\n你們有誰，有了新的、穩定的另一半時，\n看到前男女友，會這樣子想的？？？\n\
  看了一些板上、身邊朋友發的心得，\n最多人提的就是「最愛的人不一定能走到最後」，\n我勒XXX的，有種就跟現任男女友，跟老公老婆提這句話啊。\n看了真的很惱火耶。\n\
  電影中的部分情節，跟現實中的風向完全相反，\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n發表文章於【】 看板\n\
  原標題: Re: [負雷] 樂來越愛你\n新標題：\n                       ※\n   引述《ArtofLife (神曲哥)》之銘言：\n\
  第一次在電影板發文就留給你了\n我想說的是\n你發這篇是不是發錯版了\n你這麼在意男女關係，請去男女版或女版發文\n電影的好壞跟愛情忠不忠貞有何關係\n你是在看電影。又不是在相親\n\
  這本來就是用愛情包裝的追夢劇\n愛情只是配菜，勇敢築夢才是他的中心\n這樣才不會失焦。\n既然來到電影版，我想根據原po的情況推薦：如果想要重新相信愛情，建議看深情日片「\
  \ 生命最後一個月的花嫁 」，如果ㄧ定要守護男女關係，建議看老片「麥迪遜之橋」，愛的要死也不願私奔。\n--\n如果「樂來樂愛你」改成「越來越愛你」，這樣被騙是純愛電影還說的過去。我覺得原po是被朋友誤導了，才會有如此反應吧！\n\
  \n電影本身就是滿足人們在日常生活中的幻想，如果電影本身的愛情觀及婚姻觀要被強烈檢視，這樣不僅會失去電影想傳達的本意，也會讓整個劇情支離破碎。試想女主角爲了要避免劈腿嫌疑，還要跟配角來個十八相送，那整部電影到底是演那齣？如果是純愛情片當然有需要，但這部片就不是，好嗎。\n\
  \n我覺得這部片的音樂及歌舞方面跟我期待有落差，有時會出戲。劇情大抵流暢，city of stars相當悅耳動聽，但說是爵士音樂太牽強。不是不能給負評，但用男女關係來評論，我真的…"
