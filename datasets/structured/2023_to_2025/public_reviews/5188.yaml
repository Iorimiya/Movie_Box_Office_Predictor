url: https://www.ptt.cc/bbs/movie/M.1482333453.A.EAF.html
title: 'Re: [肚爛雷]樂來越愛你證明了甚麼?'
content: '原文有點過激隱藏


  以下有雷





















  個人看這部從中場開始的感想就是


  女主就是一個婊子


  當年跟男主在一起的時候


  男主聽到她媽在質問男方工作性質等問題之後


  不只是放棄夢想，還出賣自己的靈(爵)魂(士)


  向現實妥協


  為的就是可以跟女主繼續在一起


  但，當男主百忙中好不容易抽空跑回同居的家做菜


  (感謝kodo板友的訂正)


  給女主一個驚喜


  得到的卻是否定，否定他的努力


  否定男主放棄夢想出賣靈魂，批評他向現實下跪


  覺得應該要為了她繼續當一個逐夢者


  但是卻不想想男主是為了誰，為了甚麼才這樣彎腰


  只會用上帝視角批判他變成不是自己理想的人(逐夢者)




  那女主自己的夢想呢? 獨劇失敗一次就放棄


  向現實妥協


  最後靠男主拉了一把之後開始平步青雲




  結果男主得到啥?


  做了那麼多，傷了那麼深


  還是只能跟自己的雙手在一起





  你說到重點了~




  為何男主要放棄夢想去參加樂團?


  因為女主媽的一通電話，他了解到如果自己沒有一份正經工作


  別說開店了，要給女主一個穩定的未來都有問題


  所以他『有部分的理由是為了背負起為了跟女主在一起會遇到的某些現實』


  (例如車子、房子、結婚、生子)


  才放棄夢想的，而且我相信女主對他來說，重要性更甚開店與爵士


  "他是為了女主試著去背負起一些東西，才放棄自己的夢想"


  當然如果女主沒出現，他應該也是繼續當一個思想怪異難相處的怪咖


  最後八成窮困潦倒領給付，在家做爵士自嗨








  接著再來討論，那為何女主要放棄夢想呢?


  她的確付出了很多，工作之餘的奔波試鏡


  甚至為了全心全力準備獨劇，連(靠)工(男)作(主)都(角)辭(養)了(?)


  那最後她是為了男主才放棄夢想嗎，否


  『因為我努力了好久結果大家都說我根本不會演，所以我決定放棄惹哭哭』


  為了自己的夢想而努力，最後因為自己達不到而放棄


  從頭到尾女主的行動綱領都是為了自己


  但是卻義正嚴詞的批判男主不該放棄夢想




  所以整理思緒之後才發現


  女主令人氣憤的點是她的自私與不諒解


  並不是最後沒跟男主再一起


  再一起頂多把她加分到及格而已



  --


  推前中段真的快睡著，但右手盯著我不敢睡


  到了中場我整個氣到醒了


  女主獨劇結束在哭窮那邊真的很想嗆她


  "你現在終於知道他媽的現實是甚麼了嗎？"


  上面有一篇比我寫的好太多


  推文數也很多的影評



  我個人覺得啦


  這就是男性看法跟女性看法的差別


  這真的不是戰文起手式，我真的不是要戰男女


  只是想表達，男女看法真的有差



  最後我成功並不代表你曾經否定我的犧牲這件事可以一筆勾銷


  已造成的傷害不會消失，更甭提是傷完就跑



  試問兩人最後都成功了，但是誰被傷的比較多呢?


  你說的很有道理


  的確男主角所做的一切都不是女主角逼他做的


  他的所作所為都是自願自發


  所以做錯被罵只能自已摸摸鼻子



  seriously?'
