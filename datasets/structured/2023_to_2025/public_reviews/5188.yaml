url: https://www.ptt.cc/bbs/movie/M.1481461256.A.AA8.html
title: '[好雷] 致敬黃金時代歌舞片-樂來越愛你'
content: '個人非常喜歡好萊塢黃金時代的歌舞片

  所以"樂來越愛你"說要做復古歌舞類型時相當期待

  看完覺得滿值得聊的，把幾點感受打出來，有些鬆散，請多包涵



  嚴格來說這其實不能說是真的歌舞片

  說是有歌舞元素的劇情片更適合

  我對電影是好評的


  但先要說缺點。舞蹈


  歌舞方面，音樂是Damien Chazelle強項毫無疑問。

  他的強烈爵士情結從第一部延續，也很懂使用音樂表達情緒

  每每都能用音樂寫情，寫人，渲染出情感高潮


  但編舞並不出色，群舞甚至有點難看.......

  後來查了這部的編舞，是跟大衛歐羅素電影的(...)，平常做真人秀...

  ....那不如找Glee的編舞吧。這影集的編舞更優秀


  開場他想用公路實景+大型群舞，就造成略尷尬的結果

  並不好看，排很亂，龍套歌聲還悲劇

  我還以為這場戲新聞宣傳這麼多是很厲害的意思啊? 囧

  不久又接女主在家和室友們混亂的一場

  開頭這樣，心都沉了，萬幸之後就沒什麼群舞了(合掌)

  舞蹈也只做點綴致敬之用


  之後"舞"多是男女主角雙人對跳，編得中規中矩

  對不是職業的明星來說表現也不錯了

  而且氣氛營造很成功，對跳除了舞藝，也很吃雙方火花

  加上Emma Stone和Ryan Gosling化學反應極好，有強力帶動

  天文台那場就浪漫到飛天了(真-飛天了XD)




  話說，我本來以為這是雙主角。但其實是女主戲

  Emma Stone的演技在這部有很大突破

  詮釋情感令人動容，試鏡獨唱那首格外優秀

  Ryan Gosling相較下空間略少，可惜了點


  值得一提的是，他們漫步在月光下的雙人對跳

  場景氛圍明顯致敬(The Band Wagon)的公園一場，抒情浪漫

  而反話調情同時也有(Top Hat)的俏皮氣息，男女對調版

  我想Chazelle可能是個舞王粉絲吧










  Fred Astaire長得並不帥，可是跳舞超迷人

  一派優雅閒適的紳士範，做高難度的舞步也不改其風度

  和充滿活力的二代舞王金凱利(Gene Kelly)是兩種魅力


  他的最佳拍檔無疑是金姐羅傑斯(Ginger Rogers)

  不過金姐長於演技和火花，賽德查里斯則是正牌舞林高手

  和他搭，有如高手對招的張力


  btw龍鳳花車除了公園那場，這段也是超級棒

  幾十年後麥可傑克遜的MV也致敬過









  龍鳳花車雖然沒有萬花嬉春的影史地位。但也是非常經典的歌舞片

  灑花推薦


  這個是禮帽(Top Hat)那段，










  當然，他也像傑克德米(秋水伊人，柳媚花嬌)

  但大家致敬的根源都是好萊塢黃金時代的歌舞片嘛


  話說尾聲一場他非常聰明

  多年後兩人對視，時光重跑一回，這次以"電影"彌補兩人現實遺憾

  捨棄能力無法負擔的複雜歌舞，只是加入元素烘托

  就能有華麗效果，同時昇華情感

  對觀影者的觸動作用可以說達到極大值













  我看了前面一些討論，有些許對女主角質疑的點，我感到疑惑?


  從兩部作品可以很明確看見

  Damien Chazelle的價值觀就是自己最優先

  沒有任何東西比自己重要

  不過兩部表達方式不同，入口度差很多


  鼓手主角直接讓女朋友滾，我要做音樂事業了，沒空理妳


  但La La Land的情境是

  當心力僅僅能專注一樣以取得成功時，他們選擇實踐自己夢想

  都是一路披荊斬棘的追夢人，都懂這之於對方意義

  所以這是男主角主動提出來的


  而這段愛情定格於這個時刻，別具意義

  不是被時間距離磨損到不堪，然後在爭吵的醜惡中分開

  他們彼此理解，也影響了對方往夢想道路前進

  我成功了，你的幫助鼓勵，永遠雋刻其中

  旁邊的人不是他/她，挺遺憾




  而這兩人本來就是以"我"優先的逐夢者

  你讓他放棄夢想選擇感情? 能想像日後會有多懊悔?

  (可以欣賞下藍色情人節...)



  --

  確實是惆悵的，但兩人都踏上自己的道路，也永遠不會忘記美好，足矣

  阿忘記說紐約紐約，兩人的關係，還有更傷感的結局...

  馬丁史柯西斯的歌舞場面真的做得很讚，有當年MGM的氣勢

  還擁有Liza Minnelli，歌舞一流的好演員! (不過可惜她和狄尼洛沒那麼來電..)

  其實紐約紐約的問題是滿明顯，例如男女主沒那麼來電，片子太冗長...

  可是優點也很迷人，甚有文森明尼利風範的歌舞調度，還用他女兒來演XD

  大片廠肯定爭相招攬了。因為他做類型片也會很強

  下一部預算可以很充裕了吧

  想到戲裡那浮誇到令人失笑的"爵士POP"

  不只Ryan Gosling臉垮，John Legend也好犧牲喔www

  選角電話算有解釋，說她不接手機，才打去男主那裡問看看

  不過電影遲到那個就是戲劇效果了。整體可能是故意少放，來維持復古調性?'
