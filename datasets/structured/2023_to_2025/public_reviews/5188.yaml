title: '[好雷]《樂來越愛你》—莫忘初衷 '
content: "Mia: Maybe I'm not good enough!\nSebastian: Yes, you are.\nMia: Maybe I'm\
  \ not! It's like a pipe dream.\nSebastian: This is the dream! It's conflict and\
  \ it's compromise,\n and it's very, very exciting!\n\n\n《樂來越愛你》上映以來，票房與評價俱佳，在年底的得獎季中獲得許多讚賞。\n\
  朋友昨天聊到，好看是好看，但真的有這麼好嗎？不過就是一部唱歌跳舞的愛\n情電影，好像也沒有什麼特別深度的議題或是複雜辯證，怎麼會受到這麼多影\n評人的愛，橫掃各項年度十大。\n\
  \n的確，《樂來越愛你》很簡單，就是一部唱歌跳舞的愛情電影，然而，我們不\n能忽略的是它在當今時代上與好萊塢類型電影演進中歷史的角色。略懂電影史\n的朋友，都應該知道歌舞片類型電影盛行與蓬勃的年代是在有聲電影來臨的20\n\
  年代末期。歌舞片是好萊塢發展最完整的一種類型之一，一邊唱歌跳舞並不僅\n僅是這類電影的重點，重要的是這些簡單美好的歌舞穿插在電影之中的整合作\n用，寄託了情節與角色的發展。說得簡單一點，這些歌曲和舞蹈不是只為了好\n\
  聽的旋律與美妙的姿態，賦予的是在角色遇到各種需要突破困難時，順理成章\n的唱一首歌、跳一曲舞就能解決問題，推動情節與衝突的和解，因此，歌舞片\n這樣的類型大多是浪漫、優雅、正向、樂觀、進取並充滿熱情洋溢。\n\
  \n或許我們會想，到底是多麽簡單，一切的煩惱與困境竟然能在唱唱歌跳跳舞就\n解決？20年代末，美國正逢經濟大恐慌，人們的現實生活已經如此複雜與難解，\n下了班進了戲院，當然想逃避這一切現實的世界。因此，也造就了這樣歡樂的\n\
  電影，歌舞片的世界中，大多擁有的問題就是「愛情」與「夢想」。帥哥美女\n談談戀愛，追求生命的理想，遇到多少來不及說盡煩惱就高歌一曲吧！近期最\n好的例子就是《冰雪奇緣》裡的Elsa在暴風雪中踽踽獨行，心中三千煩惱絲道\n\
  不盡時，那就用一首〈let it go〉把一切都幻化，大聲喧洩出一切。\n\n回頭省思《樂來越愛你》不正是一部這樣簡單又純粹的歌舞片嗎？Mia來到了好\n萊塢重鎮LA追尋演員夢想、Sebastian一邊屈就於音樂的商業性一邊追求自己理\n\
  想的爵士，兩人正好正就是標準美國夢的代表，在這座城市的中，兩人的世界，\n相輔相成，掃除一切障礙以擁抱與愛情為歸依，成就自己初衷的美好。\n\n在現在越來越複雜與歌舞片沒落的時代，這樣一部歌頌美好與單純的電影不正是\n\
  它為什麼好看之處嗎？然而，時代在進步，電影中的朋友和Sebastian說爵士樂需\n要進化，《樂來越愛你》也加入了他的巧思。當結尾Mia終於達成某個夢想的開展，\n\
  成功徵選到了角色，兩人在初次約會的山坡說道：「我想我會永遠愛你。」；\n「我也是。」Mia去了巴黎，傳統類型電影中封閉的場域空間被打破了，角色有了更\n現實與開展的視角，同時也暗示了這不是一部完全按照規則走的歌舞電影。\n\
  \n五年過去，原來早已兩人分手。Mia成為了成功的女演員回到LA，早已有了屬於自\n己的生活。意外地碰見了同樣成功地有了屬於自己音樂表演酒館的Sebastian，中\n\
  間發生了多少事情觀眾不得而知，兩人驀然回首，相望凝視，時空竟然從頭來過創\n造了一個要是兩人在一起，那樣地古典、那樣地典型、那樣地幻夢，那樣的就是傳\n統歌舞類型電影應當擁有的結尾。觀眾不禁想了，世界上最令人神傷過往的，難道\n\
  是情人未必終成眷屬，抑或是遺憾總是充滿未填滿的美好，黯然想起初衷與過往的\n一切，露出一抹微笑，繼續前進。\n\n莫忘初衷，《樂來越愛你》簡單卻又不可思議的詮釋了這一句話。像是Mia當年失敗\n\
  面試踏出片場的那一句「也許是我不夠好。」時間一直走，遇上了越來越多人與事，\n無論在愛情中、在夢想中，懷疑著自己是否能像想像一樣的美好；詢問著自己面對現\n實衝突下，要怎麼留下初衷？人生一定得有夢想，即便他未必會成功未必會圓滿，如\n\
  何能在困頓中依然哼上一曲，依然興奮地面對生命，應當也是《樂來越愛你》給人最\n大的哉問！\n\n\n--\n\n\n\n\n--"
