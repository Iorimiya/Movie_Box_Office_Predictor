url: https://www.ptt.cc/bbs/movie/M.1484056978.A.B63.html
title: '[新聞] 樂來越愛你導演音樂路受挫 改追電影夢'
content: '（中央社洛杉磯9日綜合外電報導）「樂來越愛你」導演達米恩查澤雷的電影激勵人心、

  充滿自信，很難想像他私底下是個超級害羞的人，但隨著獎座一座接一座拿，他也越來越

  受到媒體關注。


  法新社報導，31歲導演達米恩查澤雷（DamienChazelle）新作「樂來越愛你」（La La

  Land），歌舞排場復古華麗，讓人回想起昔日好萊塢的美好時光。「樂來越愛你」昨天在

  金球獎頒獎典禮大豐收，7項提名全部得獎，彈無虛發，打破金球獎得獎紀錄。


  有了金球獎加持，達米恩查澤雷2月26日奪奧斯卡最佳導演獎的呼聲也水漲船高，因為除

  了班艾佛列克（Ben Affleck）2013年未獲奧斯卡提名外，過去10年來金球獎最佳導演得

  獎人都順利贏得奧斯卡獎殊榮。


  達米恩查澤雷出生於羅德島州，母親西莉亞馬丁（Celia Martin）是1名作家，法裔美籍

  父親柏納查澤雷（Bernard Chazelle）是1名具先驅地位的電腦科學家，也是爵士和藍調

  音樂的忠實樂迷。


  達米恩查澤雷年幼時深受導演愛德華茲維克（Edward Zwick）講述美國南北戰爭的史詩電

  影「光榮戰役」（Glory）啟發，立志踏入電影圈，但高中時迷上爵士鼓，1天最多可以練

  8小時。


  直到他上哈佛大學攻讀視覺研究，才發現他真正的志向在電影。


  達米恩查澤雷還是大學生時，就自編、自製、共同拍攝並執導他的首部爵士樂作品「公園

  長凳上的蓋伊和艾德琳」（Guy and Madeline on a Park Bench，暫譯）。


  他在哈佛念書時仍持續練鼓，並在校園與賈斯汀赫維茲（Justin Hurwitz）共組樂團。賈

  斯汀赫維茲後來加入「樂來越愛你」團隊，並以「星光之城」（Cityof Stars）一曲榮獲

  金球獎最佳原創歌曲獎。


  但達米恩查澤雷面對舞台有嚴重怯場的問題，也接受了緊張一直都會是阻礙他音樂生涯的

  事實。


  他最近在「好萊塢報導」（Hollywood Reporter）舉行的導演圓桌對談時坦承：「我無法

  應付在台上表演，或是在一群人面前表演，或是表演本身伴隨而來的特殊恐懼感。」


  他表示，執導筒仍會緊張，有時連看試映也會，因此「很敬佩比我因應更得宜的演員」。


  電影網站IndieWire資深影評湯普森（AnneThompson）表示，這位有史以來最年輕的金球

  獎最佳導演獎得主不只獲影評人尊敬，同樣也得到電影圈同業敬重。


  湯普森告訴法新社：「達米恩查澤雷是年輕版的昆汀塔倫提諾（Quentin Tarantino）和

  馬丁史柯西斯（Martin Scorsese），是個有天份的電影人，超級聰明，對經典熟稔到將

  它們解構後，再利用全新的方式重新組合在一起。」


  達米恩查澤雷下部作品「前無古人」（First Man，暫譯），是關於首位登上月球的美國

  太空人阿姆斯壯（Neil Armstrong）自傳電影，預期今年初就會開拍，「樂來越愛你」男

  主角雷恩葛斯林（Ryan Gosling）將演出這位知名太空人。（譯者：中央社陳昱婷）


  新聞網址：


  --'
