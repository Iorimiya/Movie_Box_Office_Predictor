content: "La La Land 《樂來越愛你》\n在未看這部片時我向我老公說解釋\n大致說有點像\n2014Begin Again《曼哈頓戀習曲》\n2008的Once《曾經愛是唯一》\n\
  都是以音樂貫穿整部影片\n\n----------以下心得----------\n 尋夢的二人在冬天相遇\n 歷經冬春夏秋的一年\n 如果漫天星斗代表各自的希冀\n\
  \ 他們也共同攜手飛上天空摘星\n 茫茫的未來令人心生恐懼\n 各自以「妥協」當做籌碼\n 五年後 物換星移 但都如願圓夢\n 最後 女主角挽著先生的手走進男主角開的爵士樂酒吧\n\
  \ 第一眼看到當初為了男主設計的招牌logo\n 猶豫地猜測是他嗎?\n 他們在台上下眼神相對\n 男主唱著city of stars\n 女主想著五年前倆人的追夢起點\n\
  \ 想像著那些「無濟於事」的早知道\n 歌曲的結束也劃下了腦中羅織的美好\n 她離去前對台上的他給予一抹微笑\n 他也上揚了嘴角瀟灑回應\n one two three\
  \ four...\n-劇終-\n 後勁強烈又讓我淚流滿面\n 開心的是 他們之間遺憾的祝福不是在轉身之後\n 我馬上想到這首趙傳的《我終於失去了你》\n 低於三十歲的人應該沒聽過\n\
  \ 但誰管你們\n\n--"
