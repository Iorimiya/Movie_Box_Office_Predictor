url: https://www.ptt.cc/bbs/movie/M.1488184748.A.D39.html
title: '[好雷]La La Land'
content: '看了差點拿到最佳影片的拉拉鍊(這烏龍實在太可怕)

  我想看過這部片的人應該都同意

  導演調度、音樂以及男女主角的演出撐起全場












  小小雷 慎入

  -------------------------------------------













  套在兩位主角的四季設定其實很常見


  其中被批評最嚴重的莫過於劈腿

  但不妨看成女主角缺乏為夢想再往前踏出一步的勇氣

  直到遇見Ryan 她有了這樣的勇氣

  彼此為了夢想而相互支持 也因為這樣而分開


  雙方都成熟、長大了 直到最後

  但也少了年輕時相遇時的火花與熱情

  我想這就是人生吧...


  很多人可能不喜歡歌舞片 截至目前歌舞片的經典

  對我來說還是萬花嬉春 有深厚底子的男女主角

  演來駕輕就熟 絲毫不費力 但為了讓死掉的爵士(歌舞片)

  再次活起來 適度的調整與改變 我想是必要的


  總而言之 這部片雖沒辦法做到十分完美 但絕對是好片

  光就場面調度以及音樂就足以吸引人進場

  至於劇本你喜不喜歡那就見仁見智囉!!!



  --'
