url: https://www.ptt.cc/bbs/movie/M.1482139282.A.E3B.html
title: '[好雷] 樂來樂愛你'
content: '在看這部之前, 老闆跟我說很好看(但他的好看難看常常跟我相反XD)


  同事跟我說她看了無感, 大概是年紀還不到


  有點害怕會跟"我就要你好好的"一樣, 進場發現讓人無法入戲


  結果看完覺得值回票價, 絕對有今年看的電影中的前三名!!




  版上很多心得文我就不再敘述一次故事了


  首先男主角登場時開的是一部非常老舊、音響一直搞不定的老車


  而女主角開的是油電車, 因為我也是開油電車所以我看到車尾就注意到了


  我想車子同時也表達了兩個人的性格: 男主角懷舊，而女主角往前看




  中間兩個人爭吵時，我想因為我是男生所以對男主角的話特別有感


  這社會總是要男人承擔責任，追逐夢想跟現實生活


  往往最後只能妥協於現實生活


  沒有存款、沒有穩定工作，跟人家談什麼夢想?


  而女主角卻是堅持自己要做的, 才是往夢想的路上前進


  這段很清楚的表達出男女觀點的差異, 也造成兩個人分開的結果





  最後  男女主角在酒吧相遇那段...


  明明就知道男主角要彈哪一段音樂了


  可是音樂一下我的眼淚就跟著止不住的下了...


  如果現實跟男主角所彈奏出來的想像一樣就好了...


  (不過這樣這片大概就不會那麼多好評了)


  你們一起編織著未來、渡過了最艱難的時刻


  可是最後陪在你/妳身邊的卻不是她/他


  有類似經驗的人肯定感觸很深，也難怪有的人會無感


  (我的經驗寫在marriage版，想看的可以去搜尋一下XD)


  每個人對於夢想跟愛情的取捨本來就不同


  在我看來，男主角願意為了愛情犧牲夢想


  而女主角則是把夢想看得比較重


  沒有誰對誰錯, 只有能不能接受..


  (一起去看的人說女主角是個bitch...是無情了點不過應該還不到這麼嚴重吧?)


  最後  我覺得這部片似乎不適合熱戀中的情侶去看


  可能老夫老妻去看比較適合一點~一個人去看也很OK喔!!




  忘了問一件事


  一開始男主角的姐姐? 給了男主角一個電話


  我以為會剛好就是女主角


  後來這個伏筆有用到嗎?  因為中間有一小段我有點恍神XD


