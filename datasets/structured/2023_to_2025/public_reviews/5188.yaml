url: https://www.ptt.cc/bbs/movie/M.1481558582.A.C59.html
title: '[好雷]《樂來越愛你》吃著麵包，想著愛情'
content: '圖文網誌版：


  對多數人而言，在難分難解的感情世界裡，一句耳熟能詳的話：「你要愛情，還是麵包？

  」常是二擇一的殘酷單選題，亦是勢不兩立的仇敵拉鋸戰，必須從中做出抉擇，考驗的是

  理智的衡量，以及感性的賭注；癡心妄想能全數擁抱，殊不知魚與熊掌不可兼得，現實與

  理想如影隨形，印證了愛情與麵包此一假想複選題的無解，懂了事實，也悟了天真，開始

  步入所謂長大的真諦，「該放棄了」、「該成熟點了」等苦口婆心地你一言我一語，讓生

  活和生計有了平衡。


  然看似為愛做了妥協，形同角力過程的愛情本質，卻也終究浮現如「真心付出以換取快樂

  」或「亟欲討好對方」等虛假面貌，對自己夢想愧疚，對彼此情感嘆息，那時愛得驚天動

  地，此刻分得搶地呼天，何來遺憾不同調？《樂來越愛你》正滋潤了這股想像，無非要敬

  那些做夢的人，也獻給那些造愛的靈魂。


  《樂來越愛你》做夢也造愛的，是小演員和鋼琴手。無限美好的，正是落魄的爵士鋼琴家

  賽巴斯汀，和懷抱明星夢的小演員蜜亞相遇相知、相愛相惜，一起在充滿可能的洛杉磯，

  互相扶持、追逐夢想；尤其心碎的，是墜入愛河之際，逐漸邁向成功的現實壓力，無情磨

  損了原先浪漫的愛情，兩人關係面臨巨大挑戰，夢想與愛情孰重孰輕，也是相愛阻力或助

  力的唯一憂解。


  英文片名「La La Land」，除作為美國加州南部洛杉磯的暱稱，亦象徵這座如同幻境、不

  切實際的大城市，仍存在人有恆、事可成的潛能，可惜大多無法順利圓夢，於夢想與現實

  間載浮載沉；甚或無奈的，莫過於吃的是麵包，想的是愛情，《樂》片也就恰似一封滿懷

  詩意的情書，只是情書裡鉅細靡遺的，是人們躑躅不前的築夢和追愛，雖僅以賽巴斯汀和

  蜜亞兩小開展故事，但何嘗不是你我再熟悉不過的風景？


  《樂》片納入諸多城市觀察，從片場咖啡店、到爵士表演酒吧（森巴小吃店）、再到播放

  老電影的戲院等，像是為人熟知的復古巡禮，也同間接感嘆美好年代的逝去，更別說賽巴

  斯汀和蜜亞兩人，初在夜光下踢踏共舞一幕，彷彿向影史歌舞經典《萬花嬉春》致敬，又

  如片中直接指名《養子不教誰之過》、《北非諜影》等老片，令人緬懷不已的老派氣息，

  想不嗅出也難；但到頭來，鑿開那讚許已久的足跡之餘，做（造）夢的遍體鱗傷，對比戀

  人間「我愛你」的口服麻藥，才是《樂》片著力書寫的核心主軸。


  形式精湛的，是在俗不可耐的愛情故事中，譜上萬分愜意的歌舞音符；架構完整的，是透

  過五個季節時序：冬、春、夏、秋、冬，點明懷有夢想卻鬱鬱不得志的小人物，於不同篇

  章時的心境轉折，有星途飛黃騰達，更有情路坎坷，最終愛情和麵包的對決，再回歸至靜

  謐的冬季，惆悵失落下，實則蘊含匠心獨運的巧思，兩人輕輕的一抹微笑，無疑也是互道

  珍重的福祉。


  式微的老氣、式微的浪漫，全來自於《樂》片那股慨歎爵士樂行將滅亡的氣，如控訴著名

  的范畢克爵士酒吧，怎驟變成森巴小吃店；亦如爵士樂早已沒人聽，是要怎麼救爵士等有

  病呻吟；但激情未退卻，野心未磨滅，在信仰早被外人拋到九霄雲外，兼任《樂》片編導

  的達米恩查澤雷（Damien Chazelle），倒也憑藉激勵的印記，適時振作奮起，以公路一

  鏡到底、熱情洋溢的狂歡熱舞為開場，堆疊到蜜亞和塞巴斯汀的揪心話語：「無需過度在

  意觀眾喜好，人們總會追隨熱情的人。」再到片尾鑲著「Made in Hollywood」（好萊塢

  出品）的字樣作結，無一不堅定宣告深愛的爵士樂和浪漫不朽的愛情電影，不再在當代死

  去。


  同聲一氣地，《樂來越愛你》也能照映達米恩前作《進擊的鼓手》（Whiplash），同樣揮

  灑人物的成長歷程，如青澀內斂到狂亂如魔的爵士鼓手安德魯（Andrew），換成驕傲自矜

  到捨棄包袱的爵士鋼琴家塞巴斯汀，人物鮮明的記憶點，深深印著；再如《進》片運鏡上

  所賦予的空間感，流動至《樂》片依舊敏銳，前為狹小封閉的室內一景，隨者鼓聲和人物

  面部表情，緩緩推進不安與躁動；後為周遭人物靜止、聚光燈一打，視角優柔前進，男女

  主角公開獨角戲，於焉成形；新舊作雙雙讓人眼睛為之一亮，終歸無獨有偶，新時代老靈

  魂的羅曼史，你我他誓將永流傳。


  --'
