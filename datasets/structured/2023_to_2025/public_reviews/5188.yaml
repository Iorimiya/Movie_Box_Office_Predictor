url: https://www.ptt.cc/bbs/movie/M.1482866756.A.498.html
title: 'Re: [負雷] 樂來越愛你-別拿夢想污辱愛情'
content: '你沒有經歷過深刻地被現實生活磨損的愛情吧，所以難有共鳴。


  事實上，真愛無敵能超越時間空間的幻想才是神話，現實中的愛情很容易因為彼此未來的

  發展方向不同、發展的國家不同、甚至倆人需要投入全部心力追求各自的目標，而造成人

  生的步調無法同步，只好含淚分開。


  也別說什麼要誰等誰，無法預知自己何時成功，卻要求對方無限期等待，只是自私而已。


  劇中那句彼此傾訴“我永遠愛你”的告別，蘊含了所有的相愛與理解，因為能在彼此陷入

  谷底時互相鼓勵一起成長，才更能支持對方追逐夢想，理解只有達成夢想對方才能獲得真

  正的快樂，而不是一生質疑自己不夠優秀消極度日。


  時間快轉到五年後，順其自然的結果倆人都追夢成功，然而彼此已錯過相守的時機，除了

  微笑祝福彼此，也只能將遺憾收藏在心中的角落，輕聲呢喃“我永遠愛你”。那是一起走

  過人生的谷底，而永存在心底旁人無法取代的位置。當時那份真摯的愛情，以密封的型態

  永存在彼此的回憶裡。




  另外，回應原po執著的先後順序觀點，

  若你還記得劇情，那也會記得女主角在認識那位已約會一個月的對象之前，早就先認識男

  主角，並受到男主角的吸引，只可惜相戀的機會到後來男主角約她看電影才發生。


  這也是結局前的回想之一，倘若在她第一次看到男主角彈鋼琴時就能擁吻相戀，而不是被

  無視撞開，拖到下個季節才又遇見，是否未來就會有所不同。



  --'
