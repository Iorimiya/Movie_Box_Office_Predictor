url: https://www.ptt.cc/bbs/movie/M.1563206935.A.E27.html
title: '[情報] 艾瑪史東洽談演出《樂來越愛你》導演新片《Babylon》'
content: "根據外媒的指出，Emma Stone 正在洽談演出《樂來越愛你》和《登月先鋒》奧斯卡金獎導\n演 Damien Chazelle 的最新作品《Babylon》。\n\
  \n\n\n《Babylon》還處於相當前期的籌備階段，據消息人士指出，這將會是導演目前最大製作的\n電影作品，而派拉蒙和獅門影業正在爭奪此項目，雖然之前《樂來越愛你》幕後功臣即為\n\
  獅門影業，但考慮到這次的大預算，派拉蒙似乎會是更適合的人選。\n\n演員的方面，Emma Stone 也還正處於非常前期的洽談階段，而導演也希望可以找來 A-lis\n\
  t 等級的演員群來主演《Babylon》這部電影。\n\n電影劇情目前並不明瞭，但消息人士也透露這是一部設定在 1920 年代好萊塢時期的電影\n，當時的電影正處於無聲和有聲電影的交替年代，而將會混和真實與虛構的人物來建構這\n\
  部電影，類似於  Quentin Tarantino 的最新作品《從前，有個好萊塢》。\n\n《Babylon》幕後製作人包括：\n\nOlivia Hamilton（導演的妻子）\n\
  《第5毀滅》製片 Matt Plouffe\n《樂來越愛你》製片 Marc Platt\n\n導演目前正在拍攝 Netflix 的劇集《The Eddy》，是一部歌舞類型的影集，由《月光下的\n\
  藍色男孩》André Holland、《大獄言家》Leïla Bekhti 和 Tahar Rahim 等人主演。劇\n情描述一個位於巴黎市中心的俱樂部每日處理音樂表演的混亂日常。\n\
  \n\n\n消息公開不久後，根據 Deadline 的最新消息指出，剛演出《從前，有個好萊塢》的 Brad\n Pitt 也正在洽談加盟這部作品。\n\n此外，據悉\
  \ Emma Stone 如果順利加盟的話，可能會飾演的角色為 20 年代的標誌女演員\nClara Bow，他曾演出過《鐵翼雄風》等經典作品，是那個年代被稱為性感象徵的女演員。\n\
  \n目前傳出這部電影很穩固的會確立為 R 級的作品。\n\n\n\n--"
