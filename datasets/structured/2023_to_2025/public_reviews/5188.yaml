url: https://www.ptt.cc/bbs/movie/M.1483314522.A.57B.html
title: 'Re: [負雷] 樂來越愛你-別拿夢想污辱愛情'
content: "看到女主角不諒解男主角與現實磨合妥協的氣憤\n             與對男主角遲到跑回老家的決絕\n             男主角用盡一切力氣找到女主角在他去面試\n\
  \             最後相許永遠愛彼此的心願\n\n             結果鏡頭一轉五年後\n             達成理想女主角已經嫁給富豪是多麼自然而然\n\
  \             看看小孩也有三歲以上了加上懷孕一年\n             根本剛嶄露頭角時就把男主角甩到一旁\n             本部電影所有的鋪陳描述的一切真情\
  \ 相聚 追求 分享\n             永遠愛你的誓言\n             在財富和社會條件下瞬間變得軟弱無力\n             女主角看到男主角時竟然還很尷尬想烙跑的表情\n\
  \             根本讓魯蛇肥宅看得悲憤莫名\n\n             女主角條件更好更有優勢不是更能把握真情真愛嗎?\n          \
  \   為何在財富地位之前電影鋪陳的一切珍貴都變成軟弱無力\n             了呢?\n             只證明有些人只能共患難相濡以沫\n\
  \             女人心中那條永遠廝守真正的底線你我都清楚\n             實際上這樣的人現實生活中這樣的女人的確佔了九成以上\n   \
  \          只是許多人講出現時與電影中描寫夢幻的真實反差時\n             這些人就開始暴跳如雷\n\n\n\n\n\n\n\n--"
