url: https://www.ptt.cc/bbs/movie/M.1482000741.A.BE2.html
title: '[極好雷] 樂來越愛你'
content: '說實在我是個很少看愛情片的人,


  我完完全全是衝著Ryan Gosling去的,真心覺得他帥慘


  因為很久以前看了他演的Notebook覺得演技各種爆發(沒看過可以去看 超  好  看)



  在開頭鋪陳對我這種很少看歌舞劇的人  其實有點睡意XDDD


  但是在中後段漸漸帶入更多的劇情,


  在理想與現實中面對的抉擇,其實在很多人的人生中都碰到過 也帶出了我的共鳴


  在很多人的愛情中我想也是碰到這種問題 面對各種抉擇 你不知道怎樣做才對


  也許一步錯 步步錯


  最讓人動容的我想就是最後一段 五年後的男女主角


  看到女主角熬出頭 男主角住在一間小小的房子 產生了強烈的對比


  看到這我就已經有點心酸了....................


  踏入SEB''s那瞬間  女主角也是嚇了一跳


  當演奏那首鋪陳很久的歌曲時 男主角的心理絕對是悲喜交錯


  他幻想著過往所造成兩個人矛盾的事件 並且一一改寫



  我想這也是所有愛情片最愛的Happy Ending


  但現實就是非常殘酷 最後一幕男主角的笑容其實真的讓我思索了很久


  那種笑容 好心酸 也好痛苦 帶著許多的遺憾


  但是這個笑的意思 我想每個人的解讀都會不同


  愛情  就是一把雙面刃


  --'
