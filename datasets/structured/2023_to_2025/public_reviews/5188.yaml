title: '[新聞]《樂來越愛你》滿貫金球7大獎 葛斯林艾瑪'
content: '新聞網址：


  《樂來越愛你》滿貫金球7大獎 葛斯林艾瑪封帝后


  喜劇大贏家

  【李子凡╱綜合報導】第74屆金球獎台灣時間昨早在洛杉磯比佛利山希爾頓飯店揭曉，前

  「蜘蛛女」艾瑪史東與萊恩葛斯林主演的歌舞片《樂來越愛你》入圍音樂喜劇類最佳影片

  、導演、影帝、影后等7獎，大獲全勝，刷新金球單片得獎紀錄。戲劇類影帝頒給「小班

  弟」凱西艾佛列克，法國實力派女星伊莎貝雨蓓抱走戲劇類影后，戲劇類最佳影片得主則

  是《月光下的藍色男孩》。



  《樂來越愛你》描述小咖演員與不得志樂手追逐夢想與愛情的故事，創單片最多獎紀錄。

  艾瑪與葛斯林曾合作2011年的喜劇《熟男型不型》和2013年《風雲男人幫》，銀幕化學反

  應極佳。艾瑪在《樂》片飾演四處碰壁的小咖演員，葛斯林則是不得志的爵士樂手，在絢

  爛但殘酷的好萊塢逐夢，譜出浪漫卻苦澀收場的戀曲。全片洋溢著向早期好萊塢歌舞片致

  敬的迷人氣息，燈光、美術散發夢幻氛圍，2人唱作俱佳，功不可沒。



  法國影后伊莎貝雨蓓以《她的危險遊戲》贏得金球獎影后殊榮。法新社

  公開示愛孩子的媽

  艾瑪首度在金球封后，她剛出道時也像片中角色屢屢受挫，她昨捧著金球獎表示：「我對

  每一個被拒於門外或動念放棄的人都感同身受，我要和你們共享這座獎。」

  第5度入圍金球獎的葛斯林也是首獲金球獎肯定，他領獎時對同樣來自加拿大且和他爭影

  帝的「死侍」萊恩雷諾斯開玩笑說：「顯然出了什麼錯，是我站在這裡。你別介意啊！」

  接著他難得公開放閃地向未到場的女友伊娃曼德斯示愛：「在我又唱又跳、彈琴享受最棒

  的拍片經驗時，我的女友大人卻懷著第2胎在家帶小孩，還要陪哥哥抗癌。謝謝妳，我的

  甜心。」


  雨蓓《危險》16后

  法國影后伊莎貝雨蓓在《她的危險遊戲》詮釋孤獨的中產知識份子，絲絲入扣。63歲的雨

  蓓是法國凱撒獎入圍紀錄保持者，共15次，並曾在坎城影展、威尼斯影展各奪2次影后，

  首獲金球提名就得獎，合計以該片擁16座影后。奧斯卡入圍名單將於24日公布，她可望再

  度角逐影后。

  戲劇類影片得主《月光下的藍色男孩》透過單親非裔男孩夏隆的成長篇章，鋪陳被視為異

  類的孩子如何生存、發掘自我的故事，入圍奧斯卡最佳影片機率極高。《樂來越愛你》已

  在台推出，目前票房6800萬元台幣，其餘得獎片月底起陸續在台上映。


