title: '[好無雷]《樂來越愛你》我選擇成全你的溫柔'
content: '女孩懷抱著演員夢，經歷了無數次試鏡場上的慘敗；男孩為了自己對音樂的堅持，尋求機

  會處處碰壁。


  兩個遭到生活無情踐踏的人，在彼此生命的低谷相逢，日子裡的挫折與潰堤，逐漸變得不

  讓人那麼難以忍受，因為所有不曾被他人懂過的執著，現在都可以安然無恙的躺在另一個

  人的懷中，好好的被呵護，然後成長茁壯。


  「我一定會永遠愛你。」


  女孩口中信誓旦旦的話語，隨著時光的流轉，成為了最刺耳的情話，即便相知相惜，終究

  底不過分離的結尾，沒有所謂的對不起，能對彼此說的剩下謝謝你出現在我的過去，可是

  從現在開始我們都必須讓對方自由。


  後來，酒館的相遇，兩人的回憶如海浪般湧上來，關於手掌的溫度、關於彼此的夢、關於

  破裂前最後一次爭吵，那些所有曾經天馬行空和彼此聊的，如今都成為了現實，不過陪伴

  你的人，不再是我。


  但沒關係，我知道沒有人需要為誰停留，也沒有人必須陪伴誰直到盡頭，我們都在努力讓

  自己成為更好的人，那些一起度過的寒冷，我依然謹記在心。


  我確信自己會永遠愛你，只是千百種相愛的姿態裡，我不選擇和你攜手到老，而選擇成全

  你的展翅翱翔。


  部落格原文：


  --'
