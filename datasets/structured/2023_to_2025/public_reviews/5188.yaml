url: https://www.ptt.cc/bbs/movie/M.1481651459.A.D30.html
title: '[好雷] 《樂來越愛你》 — 說個故事'
content: '今天去看了《樂來越愛你》，

  比起中文，我更喜歡英文片名《La La Land》。


  總是塞車的Los Angeles，

  因為永遠都有那麼多懷抱夢想的人，

  前仆後繼的來到這個「仙境」。


  英文片名就像在這部電影裡的一些地方，

  也藏著中文沒能翻出的小趣味。

  包括「秋天」，

  包括我最喜歡的場景裡那句：

  「Where?」和「I will always love you.」


  我太喜歡這一幕了。


  包括從外頭看他們第一次接吻的天文台。

  曾經，他們相愛，

  而現在的他們已經不在那裡面了。


  包括Mia的那一句「I will always love you.」

  是「我會永遠愛你」 、 是「我將永遠愛你」，

  一個用中文翻譯很難精確表達的意思，

  他們彼此之間的愛情，既存在也將不存在，

  但是依然會永遠的愛著對方。



  這部片有許多有趣的小細節。

  這是一部很簡單的故事：

  他們因為夢想而相愛，他們因為夢想而分開。


  這樣一個簡單的故事，

  導演用剪接、用運鏡，用設計過的畫面，

  結合成一部讓人回味的電影。



  從Mia去面試的那一段，我就開始哭到不行。

  她說了一個故事，臨時的一個故事。

  她的故事，不是關於Seb和Mia的愛情故事。

  她說的是關於夢想，義無反顧的傻瓜。


  「如果要說一段故事，Mia說的是夢想。」


  喜歡那段關於沒有發生過的故事，

  最後，伴隨Seb琴聲的故事。

  他們沒有成為星星，

  他們是仰望星星的兩個相愛的人。



  在通往夢想的路上，

  Mia放棄了和Seb相愛的機會。

  最美好的結局，不是選擇美好的愛情，

  如果夢想是第一位，那就選擇夢想。

  「誰在乎別人？」



  這是一部，

  男女主角沒有從此過著幸福美滿生活的電影。

  這是一部，

  「誰在乎別人？」的擁有完美結局的電影。



  最後要說，

  Well done Emma Stone.

  我喜歡是這個Emma，在這部電影裡。


  --'
