content: '。




  完完全全看錯重點


  一開始就指出女主角在好萊塢追夢


  Someone in the crowd


  很清楚的指出某種程度上要大紅大紫


  需要有個貴人



  要勾搭上貴人金主


  不就是上上床 美其名潛規則


  更好聽的就是交往啊



  當然也不是白白交往啊


  當然是吃飯時帶花瓶出去show off啊



  而當時Mia吃那頓飯有多格格不入


  你說劈腿我倒是覺得過了



  兩方都是目的交往


  那男的才不差Mia這一個


  而且也鋪墊了後來Seb願意與現實妥協的理由


  我覺得劈腿不重要


  重要的是


  現實和夢想如何改變男女主角


  才是本片最精彩的地方



  如果說有劈腿情節就放棄一部佳作


  殺人強姦放火的是不是不該拍啊




