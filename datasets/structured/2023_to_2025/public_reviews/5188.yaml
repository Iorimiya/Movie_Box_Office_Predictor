url: https://www.ptt.cc/bbs/movie/M.1501565302.A.17D.html
title: '[負無雷] 樂來越愛你'
content: '純屬個人喜好心得，

  沒有雅量接受他人喜好的人，

  最好左轉別破壞自己心情


  這部電影在各大電影院熱映，

  當初找不到人陪看，

  只能在家裡看DVD

  以下是我個人的無雷觀影心得，



  不喜歡的地方:


  歌舞呈現方式讓我出戲+尷尬


  歌曲無共鳴


  劇情單調無重點難以入戲



  喜歡的地方:


  取景很棒




  我也不是沒有看過這類型的片，

  但是讓我這麼出戲且尷尬的歌舞片段我還是第一次見，

  我想多少跟在家觀影有關係，

  但是我想最主要的是歌舞呈現方式與選曲頻率不對，


  我個人覺得這片滿吃頻率的，

  要在家觀影的朋友最好有點心理準備，

  這不是一部大家都愛的大眾型熱門片


  --


  說到片名，

  中文譯名也是我不喜歡的點'
