title: '[好雷] 《樂來越愛你》如果你還有有夢想'
content: '人的一生之所以美，是一場又一場的意外和數不盡的遺憾所串起，就像缺角的拼圖組合起

  來才能完成一幅畫，或是五彩斑斕的小石頭擠成了繽紛的馬賽克磚。


  ---以下有雷---


  二刷《樂來越愛你》，最後一幕那段蒙太奇式畫面，始於男女主角聖誕夜在酒吧深情相擁

  ，直至最後台上台下意味深長的互望，電影在最後10分鐘，就用那一首歌的時間，演完每

  個人一生中的喜怒哀樂。如果當時做了這些選擇、避掉那些錯誤，我們的愛情會不會柳暗

  花明？


  片中觸動我的地方依舊是「夢想」，一場Mia用心籌辦獨角戲卻引來他人訕笑，她衝出劇

  場淚崩說：「我再也不要丟臉了，都結束了！」到這邊我就控制不住眼淚。


  人的一生中，多能盼望遇見真正懂自己的伯樂，然而Mia不知道的是，那日夏夜當她在床

  頭排戲給Seb看，演完後擔心觀眾不喜歡，而Seb回「管他們去死」時，她已有了人生第一

  個伯樂；如同那晚聖誕夜，Seb彈了不是歌單上的曲目，餐廳眾人談笑風生、無人聆聽，

  卻深深吸引著佇立在門口的Mia一樣。


  他們是彼此的伯樂、是茫茫人海裡萬中選一的貴人（就像歌曲Someone in the Crowd），

  之後更守護著彼此的夢想。


  Seb發現Mia的編劇才華，鼓勵她寫劇自導自演，Mia人生中最重要的一次試鏡，也是Seb在

  門外默默陪伴，最終一躍枝頭 ; 至於Mia 則是讓傲骨的Seb加入流行樂團的主因，儘管演

  奏他陌生、不喜愛的樂風，卻因而賺到開爵士酒吧的資金，與此同時，Mia也將Seb導向最

  初的人生目標，並未讓Seb被錢途所困。


  另外，讓我有所感觸的還有當Seb被大學同學Keith（John Legend飾演）找來當樂團鍵盤

  手時，在第一次練團後，Keith深知Seb滿腹才華卻孤高自許，便誠懇地對Seb說：「曲高

  和寡才會讓爵士死掉，不該執拗過去，而是要放眼未來，爵士樂就是被你這樣的人害死。

  」


  也許導演達米恩查澤雷正透過Keith這句話道出他的觀察，無論你待在哪個行業，都不該

  獨守一腔才華，而是得學習與社會融合，共同成長。


  就像《樂來越愛你》當中，雖看見各種和老電影致敬的橋段，例如我最愛的《養子不教誰

  之過》，還有《野百合》、《花都艷舞》等等，但看似懷舊的外衣下，卻裹覆著年輕靈魂

  ，無論是前衛的劇場式唱法、融合現代舞元素的踢踏舞，開頭高速公路的長鏡頭還有動感

  單車跟街舞等等，老樹結果開花，又是欣欣向榮。


  --'
