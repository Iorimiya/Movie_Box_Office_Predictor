url: https://www.ptt.cc/bbs/movie/M.1487395937.A.40F.html
title: '[新聞] 樂來越愛你可能落馬？解析奧斯卡的投票制'
content: '新聞網址：



  文/ Sebox


  這個月底一年一度的好萊塢電影盛會奧斯卡金像獎即將要舉行頒獎典禮，今年最大

  熱門的最佳電影作品莫過於橫掃金球獎 7 項全拿的《樂來越愛你》（La La Land）

  ，在今年第 89 屆奧斯卡獎中，此部電影入圍了 14 個大獎，擁有優秀拍攝技巧且

  主題圍繞在娛樂產業的《樂來越愛你》，絕對會是奧斯卡評審團的心頭肉。不過

  《樂來越愛你》真的能夠穩拿最佳影片獎項嗎？國外娛樂媒體 Vox 製作了一支短

  片，簡單解釋了奧斯卡獎的投票機制，更透露《月光下的藍色男孩》（Moonlight）

  或許會成為今年的黑馬得獎者。


  從歷史的角度看來非常有可能，因為奧斯卡的評審機制傾向「平庸制」（Mediocr-

  ity），從 2009 年開始，美國電影與科學學會改變了投票機制，把原本第一高票的

  影片獲勝的規則，改變成「排序複選制」（Instant-Runoff Voting），因為學院

  希望奧斯卡得主是最多人喜歡的作品，而非某些人最喜歡的作品。所以每位評審會

  將所有的入圍者排序，學院將大家對於最佳影片的偏好排序相加後，最後一名的影

  片就會被刷掉，而本來選擇最後一名影片為自己清單第一名的評審們，他們的票就

  會變成代表他們清單中的第二名。整個計算過程以此類推，一直到有某一部作品（

  入圍者）獲得超過半數加 1 票的票數，就是奧斯卡獎得主。


  我們回到 2011 年的奧斯卡獎最佳影片入圍清單，該年度的最佳影片是《王者之聲：

  宣戰時刻》（King’s Speech），打敗了《全面啟動》（Inception）、《127小時》

  （127 Hours）、《黑天鵝》（Black Swan）、《社群網戰》（The Social Network

  ）、《玩具總動員3》（Toy Story 3）等優秀作品。我們從這樣的結果往回推算，很

  有可能每一部電影都有他們專屬的特別愛好者，而《王者之聲：宣戰時刻》就成為了

  多數人的第二、甚至第三名，所以最後獲得奧斯卡最佳影片殊榮的，反而不是評審

  心中的第一名，而是他們的第二或第三選擇，也就是最多評審普遍來說覺得還不錯、

  但不是最好的作品。


  不過另一方面來看，奧斯卡最佳影片得主通常都會是關於電影製作、娛樂產業或是相

  關的電影作品，不論是《鳥人》（Birdman）、《亞果出任務》（Argo）、《大藝術

  家》（The Artist），甚至是《王者之聲：宣戰時刻》都是一個人被訓練最後上台發

  表的過程。因為去年「奧斯卡過白事件」造成相當大的反應，今年電影學院特別增加

  了 683 位新的評審委員，目前總共有 6687 位評審，這些評審也都是娛樂產業中相

  當專業的工作者，或許他們很喜歡關於自己工作的故事，但不一定會把關於「娛樂產

  業」的作品放在第一位，據 Vox 的說法通常第一名會是跟某個時代有關的作品，如

  此一來就非常有可能讓《樂來越愛你》成為今年的最佳影片得主。


  這樣的投票方式是不是讓你覺得有點弔詭呢？沒錯，奧斯卡的目的就是希望能夠選出

  一部大家都覺得還不錯的作品獲得最佳影片，而不是一部可能極端被喜歡或極端被討

  厭的作品，在廣度與深度的選擇題中奧斯卡走向廣度，也為一年一度的電影盛事增添

  了一絲刺激、緊張的期待與不安。不過今年增加的 683 位評審中，有 46% 是女性、

  41% 是有色人種，其中有 283 個評審來自 59 個國家，相信今年的投票結果會更加

  不同。快在留言回應告訴我們你心目中的最佳影片是哪一部吧！


  ------------------------------------------------------------------------------


  參考外電:Vox在Youtube頻道的影片

  The Oscars'' voting process awards safe movies



  心得︰我以為奧斯卡投票就像投票職業運動MVP、教練、新人獎那樣，

  選最受投票者喜愛的，但看了影片與翻譯才知道

  奧斯卡複雜了點，似乎更朝向超過6千位投票者「最不討厭的」方向邁進


  但今年的奧斯卡似乎也不容易找出能與《樂來越愛你》抗衡的對手，

  一方面它的題材還算健康，即使技術上有突破

  但也不大會有保守與激進人士反感的場面，

  二來它本身就是最多的14項提名數，也擴大了它與其他片的競爭差距


  --'
