url: https://www.ptt.cc/bbs/movie/M.1482217993.A.780.html
title: '[好雷] 樂來越愛你 (LA LA LAND)'
content: '夢想，是小時候陪伴在我們身邊的精靈，

  陪著我們天馬行空的想像著未來的模樣，

  直到某天，才理解原來這世界的遊戲規則不是由我們制定。



  雖然我們不一定會成為世界最亮眼的那顆星星，

  但，卻會成為世界上某個人心中永遠閃耀的光。


  ------


  開場的歌舞，從洛杉磯的的擁擠車潮開始說起。

  在這座大城市裡，每台車裡的人來自不同地方擁有不同的成長背景，

  卻都懷抱著同一個「可能」而來到這裡。



  可能我有天會遇見那個「Someone」，讓我不再是昨天的我；

  可能我有天會在打工的咖啡廳遇見某個崇拜的演員，讓我離演員的夢更近了一點；

  可能我有天能夠在廣播裡聽到自己的歌播放著，

  可能我明天醒來就有不同的未來在等待我...。



  而Mia和Sebastian，也是這樣的普通人。


  他們在彼此最需要有人支持時，出現在對方生命裡，

  不願意被現實同化的Sebastian，展現了對爵士音樂的熱愛，

  在和Mia 講解爵士樂時眼中的光芒，

  讓當時已經漸漸對試鏡疲憊的Mia也被挑起了心中的熱情。



  從冬天的偶然相識、春天的感情萌芽，夏天的愛情滋長，

  到秋天，Mia和Sebastian 合唱City of Stars的片段，像是整片的轉捩點。



  歌曲中加入一段很巧妙的畫面安排：

  簽約的他、步入劇場的她，

  穿上宣傳服的他、解下圍裙的她，

  隻身睡去的她、單獨醒來的他。



  似乎意味著，彼此的生活已漸漸不朝同一個方向走去。

  就算心中的夢想還沒有消逝，但是畢竟是走上了不同的路去完成。



  然而在愛情中，我們總是覺得沒有人比自己更了解對方的想法，

  總是預設了許多立場，還告訴自己這是貼心、是替他著想，


  如同Seb聽到了電話內容後，決定暫時將開店夢想延後，

  先擁有一份安定的收入、穩定的工作，未來再慢慢構築自己的藍圖。


  但Mia覺得這不是Seb想要的。


  她不願意他為了自己、或是為了他們可能的未來，而捨棄了自己原本的初衷，

  畢竟在他們相遇之前，Seb 是全心全意為了他的理想在做準備的。



  如果現在就應該去做、也可以拼命去做的事情，

  為什麼要為了眼前的苟且，而失去你身上最美好的那部分？



  循著鋼琴聲打開門的那一刻，Mia愛上的就是那時的他，這是永遠不會變的。


  所以，





  相較於能夠為了現實去妥協一次的Seb，

  Mia心中有更為強韌的意志，去支撐她走了六年沒有盡頭的日子。

  卻也是因為這樣，越是在乎、跌落得就越重，

  當Mia在後台聽到那樣的評論、然後哭著說我再也不要這樣了，已經夠了。



  是讓我忍不住落淚的橋段之一。



  是啊，

  變成大人後沒有什麼事情變得更好，只是變得更「認清現實」了。

  更清楚自己離那片天空有多遠，

  更認清自己也許真的只是「癡心妄想」的那種人。



  夢想說起來這麼容易，看起來就在那裡，

  但腳下要走的卻是一條遙遙無期的道路。

  又是從什麼時候起，它就變成我們掛在嘴邊，

  卻從來不敢去想、不願再去做的事情了呢？



  而導火線總是這樣子的：「你在我最需要你的時候，缺席了。」

  所以那些夏日共築的美好回憶，從此就真的只是回憶。



  兩個對彼此說著「會永遠愛你」的人，從此卻不再同路，

  當時因為對夢想的熱情而愛上彼此，最終，也因為夢想而分離。


  妳有妳的巴黎夢要去追，而我也有我的音樂理想要堅持，

  所以，Are you just shining for me？這也許就是給彼此的最終答案。



  事隔五年，Mia成功地成為了自己一心一意想要成為的人，

  Seb也留在洛杉磯開了一間自己的餐廳。



  某個塞車的夜晚，Mia走進了SEB''s，突然鋒利的回憶湧了上來，

  那熟悉的招牌樣式，還有那台上熟悉的身影...。



  ----



  五年不見，他還是一眼就穿透人群看見妳，

  沒錯，他肯定知道你已經成為一個知名演員，

  絕對也進電影院看過妳的作品，就像那年春天說的「See you in the movie.」


  剛剛那轉角的牆上電影畫報，今日報紙上的新聞和照片他是否也注意到了？

  妳好想知道，他還會不會關心妳過得好不好？



  可是，他肯定也看到了，

  坐在妳旁邊的是別人，

  那個本可能是他位子的地方，現在是另一個人。


  鋼琴聲依舊動人，

  但曾經吸引妳進入他生命的旋律，如今卻徒留傷感以及揪心的痛。



  「如果...」這種話，說了只是弄傷自己。

  每個人心中都有一朵白玫瑰、一顆硃砂痣，

  一個怎麼樣也挽回不了的遺憾。



  如果，時間倒流回相遇的那一晚，一切是否能夠重來？

  如果，沒有妥協就沒有爭吵，沒有缺席就沒有分離；

  如果，一切都還能回到當初最美好的模樣，最好的我們…。



  隨著音樂旋律畫下休止符，那些回憶也就繼續塵封在過去吧，

  最後相視的一抹微笑，是我們之間最後留下的交集。


  ----


  雖然很悲，卻也覺得或許這樣才是最完美的結局。

  兩個最深愛對方的人，卻不會是可以牽手走一輩子的那個人，

  也許就是因為太愛了，所以每個對話、每段相處的時間，都過於用力了。


  而太過感情用事，日子是會過得很痛苦的。


  所以不如就這樣吧。

  讓彼此停留在最美好的樣貌，也是一種深切的愛。


  A look in somebody''s eyes

  To light up the skies

  To open the world and send it reeling

  A voice that says, I''ll be here

  And you''ll be alright


  Think I want it to stay...




  --



  世間所有的相遇，都是久別重逢。


  --'
