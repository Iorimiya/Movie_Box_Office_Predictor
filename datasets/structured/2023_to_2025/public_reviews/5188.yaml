url: https://www.ptt.cc/bbs/movie/M.1481433995.A.26C.html
title: '[好無雷] 樂來越愛你 La La Land'
content: '【相遇，夢想，與無盡繁星】


  昨晚臨時在京站威秀看了音樂劇電影 La La Land / 樂來越愛你，略記一點感想，有興趣的朋友有空也進戲院共襄盛舉吧 :)


  (1) 整部片色澤很飽滿很鮮活很復古，劇情處處向經典橋段致敬，老派電影符碼安排的細膩曼妙。故事大抵講相遇，講夢想和奮鬥，講繁華與名利（好萊塢的陽光燦爛與泳池派對），與下手不算致命但仍帶後座力的惆悵，現實，和滄桑。整體走向雖不難推測
  （步調偶而有點拖沓），但還是很有啟發，很有抱負，充滿生命力的。


  (2) 原聲帶已入手，真心好聽豐富。有爵士，有標準音樂劇令人振奮的歌舞，也有淺唱低吟，小清新滿載的作品 （不得不想到2013年的 Begin Again / 曼哈頓戀習曲）


  (3) 若還是拿不定主意，這部片爛番茄新鮮度高達 96％，Metacritic 89分，IMDB 8.7/10.0 分， Emma Stone 以此片抱走威尼斯影展最佳女主角。以一齣音樂愛情喜劇而言，以上各個都是蠻難得的成績
  :D


  預告片



  --'
