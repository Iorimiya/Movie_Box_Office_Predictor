url: https://www.ptt.cc/bbs/movie/M.1484663294.A.F39.html
title: '[新聞] JK西蒙斯原可能於樂來越愛你出演另一角色'
content: '新聞網址：


  J.K.西蒙斯(J.K. Simmons)曾於導演戴米恩崔澤爾(Damien Chazelle)的前作《進擊的鼓

  手》( Whiplash)中演出嚴格苛刻的樂團指揮人員，並以該角色贏得奧斯卡金像獎最佳男

  配角。


  J.K.西蒙斯近日透露早在拍攝《進擊的鼓手》時，戴米恩崔澤爾就已把《樂來越愛你》

  (La La Land)的劇本寄給他看，並對J.K.西蒙斯說：「(這部電影)沒有戲份較多且適合你

  的角色，我希望你能擇一演出其中的兩個小角色，讓我知道你想演哪一個。」


  戴米恩崔澤爾所指的兩個小角色分別是討厭爵士樂的餐廳主管，以及女主角蜜雅(Mia)的

  父親，有看過電影的觀眾應該不難猜到，J.K.西蒙斯後來選擇出演的是餐廳主管一角。


  雖然J.K.西蒙斯在《樂來越愛你》只有出現幾分鐘，但之後發行的DVD中，預計將會有更

  多他在院線版本中被剪掉的片段。


  J.K.西蒙斯也提到：「(拍片時)戴米恩崔澤爾放手讓我們自由發揮，萊恩葛斯林(Ryan

  Gosling)和我兩人也因此作了大量的即興演出，其中有很多令人捧腹的笑料。」


  新聞網址：


  --'
