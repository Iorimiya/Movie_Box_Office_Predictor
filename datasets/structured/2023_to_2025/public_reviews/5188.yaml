title: '[好雷] 樂來樂愛你'
content: "圖文網誌：\n\n\n\n當最後一次音樂響起時，坐在賽巴音樂酒吧的蜜雅，\n聽著賽巴彈奏起串起他們相遇最初的音樂時，那露出的震驚、遺憾、懷念\n\
  複雜多變的樣貌，看的我跟著心揪起來。\n\n怎麼那麼會演，明明結局是兩個人都追到自己想要的夢想，\n可是卻不是我期盼的皆大歡喜老掉牙版本。\n可卻也因為不是我期待的那個版本，\n\
  電影結束後，兩個人在一起的回憶片段反而讓人反覆回味。\n\n他留下一絲絲的遺憾，這個遺憾讓電影更動人。\n\n----------------------------------------------------------------\n\
  下雨天的休假日，最愛坐在客廳選電影，\nmod這陣子來了這部La La Land 樂來樂愛你\n關鍵少數,這題材我也很喜歡，星際過客看起來也不錯，\n這些源源不絕的影片，讓我不知道選誰才好。\n\
  \n我問先生的意思，他對神偷任務比較有興趣，但最後我還是點選了這部追夢片。\n\n影片剛開頭，一陣歡樂的歌舞結束後，先生便離座了，他直白的說他看不下去。\n嗯，這是不合他胃口的歌舞片。\n\
  \n歌舞片還真是挑人看，我當年很愛的三個傻瓜，也是很多朋友受不了跳舞的片段。\n\n\n我繼續看下去，從標幟冬天的最初開啟了這部片，懷抱明星夢的蜜雅，\n在一次次的試鏡\
  \ 反覆重覆著試鏡失敗，屢敗屢試，屢試屢敗的過程。\n而希望推廣爵士音樂的賽巴，則困在生活的窮困療倒中。\n\n最初的相遇並不友好，一個在車上背劇本，一個在後頭猛按喇叭。\n\
  \n下個相遇的鏡頭帶到蜜雅面試失利，\n參與朋友邀約的派對\n(結果參加完心情更差，沒有遇到茫茫人海中的貴人，然後車子被拖吊了，)\n\n在步行回家的路上，被酒吧內的音樂吸引，忍不住推開門，\n\
  那個早上讓他不爽的男人，指尖彈奏的音樂，卻震攝住蜜雅，\n音樂一下，現場只看到彈琴的賽巴，旁人都消失在視線裡。\n\n不過導演的安排很有意思，這次並沒有邂逅成功，\n\
  蜜雅要上去讚美什麼，賽巴卻沉浸在聖誕節被fire的衰尾道人情緒。\n推開蜜雅離開。\n\n在接著時間標示來到春天，第三次見面是個派對中，\n這時後賽巴找到了一個打音樂零工的機會，在伴奏的情況下，\n\
  與蜜雅有了第三次巧遇，蜜雅俏皮地點了我逃跑，賽巴意會到她指的是上次失禮的離開，\n劇情來到了這邊兩個人總算有比較好的互動。\n\n接著讓我最愛的片段是兩個人一起在夜景前共舞，跳的真是好，\n\
  我對這部片有幾個佩服點，女主角從配角「女郎我最兔」到「姐妹」再到這部，\n讓我看到演技很多變的面貌，而男主角在落日車神我印象尚不深刻，\n\n這次他彈琴的片段，讓我很意外，真的是男主角自己彈的嗎，也太強了。\n\
  \n故事繼續下去，男女主角在一起後，就面臨了很柴米油鹽的瑣事,\n因為真實的愛情還是逃離不了麵包的試煉，\n\n這一試煉就挑戰了彼此的夢想，男人的現狀顯然不符合世俗的期待，\n\
  當男人聽到女主角跟家人電話的聊天內容後，\n\n{加上一開始女主角感覺是希望賽巴去試看看的。}\n他決定參加好久不見的朋友，提出的樂團邀約，\n\n弔詭的事，賽巴的生活現況越來越好，\n\
  他的樂團顯然有不少粉絲追逐，\n經濟狀況也變好了，\n可是卻背離他最初的夢想，\n然後也跟蜜雅離的越來越遠。\n{這時候蜜雅反而責怪起賽巴忘記自己的初衷，彈不是自己想要的音樂}\n\
  {不過夢想這條路也真弔詭，一定要窄化為爵士樂一條路才行。}\n\n而蜜雅選擇了辭掉工作，專心選擇寫獨幕劇，演自己想演的對白，在這一連串的選擇中，\n命運又給了他們一次考驗，在蜜雅獨幕劇的上演日，賽巴沒法出現，\n\
  (他正參與樂團封面照的拍攝)\n而蜜雅的獨幕劇，入場的觀眾少到無法支出租劇場的費用，\n還要忍受路人觀眾的批評耳語，自此，兩個人的愛已經毀了，\n更重要的事，蜜亞已經撤底死心自己有演戲的才能。\n\
  \n故事最好看的地方在於，一通電話又改變了接下來的人生軌道，在寥寥二十個觀眾，\n有一個卻是蜜雅的伯樂，\n\n不過已經陷入習得的無助的蜜雅，已經不相信自己可以了，早就包袱款款回老家療傷\n\
  這時後反而是賽巴接到電話，從女主角過去給的微小提示，找到住在圖書館對面的蜜雅\n\n他帶她去面試，這個面試，又將兩人推向新的人生道路。\n在去巴黎的最後一次見面，蜜雅問賽巴現在兩個人是怎樣的狀況，\n\
  賽巴說蜜雅必須去完成她的夢想，而他也要繼續作他想要的事情。\n到這邊，兩個人似沒分手卻也沒交集。\n{有人說不是有手機嗎，不過人生各自有事要忙，一年多的感情 過去就過去了}\n\
  \n所以，五年後，時序又來到冬天，(可現實生活是兩個人都追到自己的夢)\n在一個又是大塞車的分叉路，再一個女主角不經意的提議，又走入一間酒吧，\n然後蜜雅又跟賽巴重逢了。\n\
  \n這次一樣的音樂，聽起來酸酸的，\n音樂一下，場景接著演出賽巴與蜜雅另個版本的遇見與人生。\n\n那個音樂下的人生，是我期待的歡樂大結局，可音樂結束，回憶只待追憶。\n\
  我想起了蝴蝶效應，這一連串的選擇中，中間任何一個變數就會讓人生的劇本\n完全改寫。\n\n一直反覆播送的音樂，從一開始的潦倒，到後，兩個人各自追夢成功後，\n\
  那音樂我聽起來很有情緒。\n但讓我覺得有意思的地方是，在追求夢想與與現實妥協的過程中，\n賽巴因為有了女友，開始會考慮到柴米油鹽重要性，\n選擇屈就一個他原本不是那麼喜歡的工作{當樂團鍵盤手}\n\
  對賽巴來說，其實是一種成長懂得對現實妥協，{至少可以為自己的人生負責}\n\n可是這樣的成長，在女主角看來反而是對自己夢想的背叛。\n當女主角因為獨幕劇票房失利後，選擇放棄自己的夢想，卻是讓男主角賽巴又拉她回來。\n\
  \n\n看完這部片後，在去找其他影評人寫的影評，才知道原來這部電影背後，\n還有那麼多的隱喻跟細節，還蠻喜歡讀不同的心得文的。\n\n不過電影就是這樣，有人喜歡就有人不喜歡。先生開頭的歌舞片就整個受不了了。\n\
  我倒是好幾幕都特別重播倒帶來看呢。\n\n\n--\n\n--\n 05/19 16:16"
