title: '[好雷]電影【樂來越愛你】最愛看你閃耀的時候~'
content: "【樂來樂愛你】La La Land │128分鐘│普遍級｜英文發音\n上映日期：2016-12-09\n\n★第89屆奧斯卡金像獎14項提名，平《鐵達尼號》影史入圍記錄\n\
  \n★拿下第89屆奧斯卡最佳導演、最佳女主角、最佳攝影、最佳製作設計、\n最佳原創配樂、最佳原創歌曲〈City of Stars〉共6項大獎。\n其他曾入圍奧斯卡14項獎項的包括1950年《彗星美人》與1997年《鐵達尼號》\n\
  \n★《進擊的鼓手》達米恩查澤雷執導，雷恩葛斯林、艾瑪史東大銀幕三續情緣，\n再度攜手追求夢想，舞出浪漫樂章。\n《進擊的鼓手》魔鬼教練J.K.西蒙斯、節奏藍調小天王約翰傳奇聯手加持。\n\
  \n★對查澤雷來說，這部電影是一封獻給洛杉磯的情書，\n「洛杉磯有種不可思議的魅力，這是當你塞在路上時不會發現的事情。\n我想獻給這座城市一封情書，著墨那些在夢想與現實之間浮沉與拉扯的年輕藝術家。\n\
  這座城市充滿想實現夢想的人，但大多數的人最終都無法圓夢，我覺得這點頗具詩意。」\n\n\n本文:\n\n\n這部片，讓我很哭！\n\n覺得是用歡樂的歌舞，所包裝的悲傷愛情劇。\n\
  \n從片中，男女主角夢幻地在天空中跳舞，我就開始哭，\n我也不知道我在到底在哭甚麼QQ (!???)～\n\n總之，就是一部很哭的片！但我很愛這片！\n\n也許就是因為愛情跟夢想是如此的美麗，相對在現實中拉扯，\n\
  所帶來的失落才會備感哀戚吧～\n\n\n\n- - - - 以下內容含有劇情 慎入有雷區 - - - -\n\n- - - - 以下內容含有劇情 慎入有雷區 -\
  \ - - -\n\n- - - - 以下內容含有劇情 慎入有雷區 - - - -\n\n\n\n《La（美國洛杉磯Los Angeles簡稱） La Land》，\n\
  \n從本片所出現的電影【莎翁情史】、【北非諜影】、【美人計】、【育嬰奇譚】、\n【養子不教誰之過】等 ，可知道時間落在1998年左右。\n\n\n\n我一直在思考【樂來越愛你】，為什麼會這麼讓我痛哭流涕？\n\
  \n為了現實跟夢想掙扎所放棄的、害怕自己所愛及努力，不能符合大眾，\n而漸漸喪失自我、最終沒有圓滿的遺憾愛情．．．！？\n\n我大概從女主角從跟有錢朋友的飯局，聊著毫無興趣的話題，\n\
  以及音響似乎放著男主角的音樂，\n\n女主角最終順應己心，離開餐廳奔向電影院，而開始哭...，\n\n看到兩人夢幻的在天空上跳舞，不知道為什麼這樣的愛情畫面，\n\
  也讓我感到美麗地而落淚，更別說最後那段假想的完美過程結局。\n\n\n\n 「春、夏、秋、冬」，來表現兩人愛情階段的「萌芽、成長、凋零」\n\n 這部片特別用「春、夏、秋、冬」來做四個分段，\n\
  象徵兩人愛情階段的「萌芽、成長、凋零」。\n\n每個人都有曾經有嚮往的單純美好愛情，每個人都有曾想在一起一輩子的人，\n\n一開始都很天真的想要跟對方在一起，\
  \ 我們也一直希望，能夠跟對方在一起越來越好，\n\n兩個人在一起的時候，會一起互相調整彼此的腳步，\n\n希望能夠讓自己，還有對方越來越好，\n\n但是為什麼當時間一久的時候，卻越走越遠，\n\
  \n我們不是沒有在一起的心，可是為什麼在生活當中拉鋸的時候會留下遺憾？\n\n【樂來越愛你】其實就是用美妙的歌舞，來表現一個殘缺而遺憾的愛情，\n\n像一曲哀悼愛情的輓歌，就算看完電影仍不自覺的沉溺在旋律中，\n\
  看似用歡樂歌舞來包裝愛情的悲傷 。\n\n繁星之城所有的人，都只有一個願望，我們追尋的，不過是另一個人的愛！\n\n\n\n期待在這LA能遇上伯樂，但除了伯樂，最該稱讚不該是努力不懈的自己嗎？\n\
  \n在高速公路上等待的汽車，一剛開始所呈現的歌，其實就像是一種在等待人生，\n像每個人都一樣在路上徘迴等待，\n\n在這路程的一個旅行，以及尚未到來的機會，\n\
  希望暫時的塞車（前滯不前）的人生最後能豁然開朗。\n\n本片中的男女主角，都到了LA尋找他們的夢想，\n也希望在這邊找到能夠遇上他們的伯樂，\n\n從與朋友的歌舞及眾人狂歡舞會，莫不看到一個個在找機會的人，\n\
  \n男女主角彼此都有一個愛對方的心，尚未發達前都認為對方就是能了解自己的伯樂，\n\n在他們追求著自己的夢想，卻不停地在現實中面對挫折，而對自己感到懷疑，\n\n\
  甚至希望能符合對方的期望，原本一開始的好意也在不知不覺中而扭曲了初衷，\n\n「你愛你演奏的音樂嗎？」\n\n「那很重要嗎？」\n\n「如果你要跟這樣的音樂巡迴好幾年，那就很重要！」\n\
  \n女主角理解對方的夢想，而希望能做自己所愛，\n\n男主角為了有更好的生活，去做符合潮流而非自己所愛的音樂，\n\n甚至在百忙中，抽空為女友下廚要給對方驚喜，兩個好人卻在無心中傷了對方，\n\
  \n【樂來越愛你】讓人難過的是，原本都想要走到最後，\n可是卻在過程中無心錯過了甚麼？犯了甚麼大意？\n\n彼此走著走著，在現實中而慢慢地走散了，忘記了當初一開始的單純美好，\n\
  \n女主角讓我感動，是在她喪失鬥志後，最終給了自己一個機會而翻轉，\n\n誰又知道那一次的機會，不就是那無數失敗所累積下來的成功！？\n\n男主角最後走了他想要走的路，完成了夢想，\n\
  \n兩個人都完成了當初自己的夢想，可是兩個人最後卻沒有辦法一起走到最後而相愛，\n\n兩人彼此說道：「我會永遠愛你」「我也會永遠愛你」\n\n最終，因為工作忙碌而無法見面的兩人，這樣美麗的語言就在回憶裡不停地閃耀著。\n\
  \n如果所有的遺憾都能夠填補的話，那結局是不是會不一樣呢？\n\n 【樂來越愛你】營造了各種愛情的浪漫元素，卻又一邊用各種現實來擊碎，\n\n在生活的現實中，看似不堪的「浪漫」，其實卻在回憶中存活地最久。\n\
  \n\n- - - -\n\n電影【樂來越愛你】喜愛的佳句 :\n\n1. 茫茫人海中的貴人，如果你一直在等待，你要一直努力直到自己被看見。\n\n2.每個人都在等待一個被看見的機會。\n\
  \n3.你眼中只有茫茫人海中的貴人，這世界依然在運轉，總有個地方，\n\n適合我發展，仍然在等待伯樂的到來，茫茫人海中總有人能讓你心想事成，\n\n能讓你的事業起飛。\n\
  \n4.你為什麼把「浪漫」這兩個字說得如此不堪？\n\n5.因為這世界需要更多的律師，但不需要更多的女演員。\n\n6.我覺得一般人說不喜歡爵士，是因為他們不了解爵士，也不知道爵士的起源，\n\
  爵士覺就是每次都是一個新的開始，每晚都是一個新的起源，所以所有都是衝突與妥協。\n\n7.你覺得觀眾會喜歡嗎？管他的。\n\n8.「你說你要拯救爵士，但沒有人聽，你要怎麼拯救？\n\
  你在燈塔裡彈給 90歲的老人聽？那小孩、年輕人呢？」\n\n 9. 以前的鍵盤手沒有你強，但你真的很難搞 。\n\n10. 繁星之城所有的人，都只有一個願望，我們追尋的，不過是另一個人的愛。\n\
  \n11.「你愛你演奏的音樂嗎？」\n\n「那很重要嗎？」\n\n「如果你要跟這樣的音樂巡迴好幾年，那就很重要！」\n\n12. 你為什麼那麼在乎別人喜歡什麼？\n\
  \n也許我就是那個一直做自己想做的事，又癡心妄想的人，\n我試鏡了上百萬次，結果都是一樣。\n\n13.敬那些痛著的心，敬那些製造的混亂。\n\n14.我的初衷全來自於她的笑容。\n\
  \n\n\n--"
