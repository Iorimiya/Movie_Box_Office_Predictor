url: https://www.ptt.cc/bbs/movie/M.1483164587.A.09B.html
title: '[ 好雷] 樂來越愛你 夢裡相識，夢中驚醒'
content: "圖文網誌版：\n\n有雷心得\n◎從追夢開始\n夢，是所有年輕生命的起點，\n夢想成為演員的打工妹Mia，\n經歷一次次失敗的試鏡後，拖著疲憊身軀，\n\
  撞見了音樂，遇見了他。\n主題曲下。\n音樂身後是削瘦的孤獨音樂家：Sebastian。\n美酒難得，不是沒人品嘗，而是無人懂得欣賞。\n生不逢時的Sebastia，在餐館裡彈著俗氣的聖誕歌。\n\
  在失魂落魄的身軀裡，住著有夢的靈魂─想開爵士樂酒吧的夢\n兩個天真有夢的靈魂相遇了，\n從互看不順眼到相戀，只在短短一首〈A Lovely Night〉，\n\
  故事開始~ 浪漫戀曲開始譜寫\n\n◎追夢進行曲ꀠ〈City Of Stars〉\n從開場的眾人歡唱〈Another Day of Sun〉，到兩人相識的主題曲等，\n\
  一首首動聽樂曲，串起了這段浪漫情緣，\n但最為想念的，還是這首吧：\n〈City Of Stars〉\n歌曲貫穿了整部作品，\n從對未來的徬徨躊躇、到為愛瘋狂不顧一切的狂奔，\n\
  最後眾星燦爛的耀眼回首。\n像是把故事濃縮在一段口哨、清唱、低吟的悠悠節奏裡，\n既精巧亦深刻，成為看完電影之後，最難忘的回憶餘韻。\n\n◎為了夢想，我願意妥協\n\
  縱使生在現代，Sebastian仍不相信爵士已死\n隨興和聲的多重變化、彈錯一個音就要死的技術要求，\n每次都是撞擊靈魂的音樂饗宴，怎能不愛？\n所以即使遍體鱗傷，他仍要追夢，\n\
  即使必須放下一身傲骨，他也願意妥協\n卑躬屈膝，是為了夢想做出的犧牲\n那蒼涼的姿態讓人想起《曼哈頓戀習曲》\n最後Adam 那流行唱腔的高聲嘶吼，\n和Sebastian玩電子樂的強顏歡笑有異曲同工之妙。\n\
  \n◎為了夢想，要堅持到底\n同樣是追夢，Mia則不枉尺直尋\n因此她不理解Sebastian的妥協\nMia在自導自演的獨角戲門可羅雀後，曾一度完全放棄。\n\
  後來幸運中選後，亦全心投入隻身赴法。\n對她來說不是成就是敗，沒有繞路的空間。\n兩個天真浪漫的靈魂，一個愛著電影，一個愛著音樂\n在夢裡相識，最後從夢中驚醒。\n\
  \n\n◎驀然回首\n最後的相逢 無語，唯有淚千行。\n夢想都在，但人不同了\n「如果當時...」所有的可能都成為平行時空的想望。\n浪漫故事最美的時候，不是Happy\
  \ ending\n而是停下來回首的瞬間，\n那一刻，時空凝結，所有的美好都封存成畫像\n成為我們能一再回憶的永恆愛情。\n\n用一首《日光夜景》的詩作為註腳\n\
  \n「那天晚上我們冒雨過街\n 去看最後一場電影\n 淋到濕透\n 才發現牽著是別人的手\n 燈光突然就突然熄了 」\n\n\n《樂來越愛你》有《大藝術家》唏噓的老電影式微，\n\
  有《曼哈頓戀習曲》中對流行音樂的搖頭嘆息，\n當然，還有愛情的最美與最傷\n導演達米恩似乎想問：\n老電影該淘汰了嗎？老音樂不合時宜了？浪漫愛情早已過時?\n\
  《樂來越愛你》就是一個回答，你愛它嗎？\n如果喜歡，那證明導演成功了\nOld fashion ，一樣能讓你拍手叫好。\n\n\n\n\n\n\n\n\n\n\
  --\nSent from my Windows\n\n--"
