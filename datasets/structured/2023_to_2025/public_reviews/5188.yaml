title: '[好雷]《樂來越愛你》重回歌舞年代...'
content: "我只能給你們帶來各位，滿滿的 大-雷-台！！\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n　有時候我在想，過去的那些難忘的相識、不忍割捨只能深埋在心裡某個角落\n\
  的甜美與刻骨銘心的回憶，是不是就是為了未來重逢的某一刻，當我們遠遠望\n見彼此時，那淡得只有你我知道的含首招呼的淺笑。也許那時你拉著你的孩子\n，也許我身旁有人，也許就像現在我在台上而你在台下，在一首再熟悉不過曲\n\
  子的裡面，時光逆轉讓我們改變所有的錯重頭愛過，設想這些年我錯過而別人\n陪你度過人生酸甜，如果是我在你身邊的話會是怎樣的日子…。\n\n\n\n　所謂「遺憾」，不單是午夜夢迴想及過去的心情，也是有朝一日我們意外再\n\
  次相見的片刻，繁華絢爛霎那都黯淡沉靜下來，我才突然意識到這些年感情一\n個換過一個、被無止盡工作應酬和熱鬧的社群交友動態填滿的「充實」生活之\n下，自己是多麼的，寂寞。那，聽著歌的妳呢？\n\
  \n\n　隨著男女主角歷經冬春夏秋用四季來分幕愛情章節，在電影《樂來樂愛你》\n裡不斷錚錚哼彈時而唱和時而低吟的那首【City of Stars】，就跟男女主角\n\
  打從冬季裡不打不相識的巧遇、春天裡愛情試探與萌芽、夏季的癡纏熱戀，來\n到秋天裡生活的齟齬和理想的掙扎，最終漸行漸遠的故事一樣，想撥弄的也就\n是「朱弦一拂遺音在，卻是當時寂寞心」那樣，在重逢一刻千絲萬縷湧上心頭的\n\
  如果…當初…要不是……。\n\n\n　但命運最終還是讓我們什麼話都沒說上，能為過往劃上句點的，也只有消失\n在人群裡淡淡的那抹歲月教懂我們的微笑，也許帶著心疼與欣慰，也許帶著一\n\
  點自嘲酸楚與日子還是得過的釋然，讓我們在大銀幕之外回味再三。\n\n\n　《進擊的鼓手》導演戴米恩查雷澤，乍聽La La Land的片名腦海裡響起的是\n日劇\
  \ 【Love Love Song】 的歌聲呢，看了導演的訪談才知道原來是台灣觀眾\n戲稱「拉拉鍊」的片名其實是洛杉磯的暱稱，電影很自然拍得就像寫給洛杉磯\n\
  的一封情信，把洛杉磯的夜景拍得很美，格里菲斯公園、天文台、聖莫妮卡海\n灣、爵士酒吧、好萊塢片場奇幻瑰麗的佈景和歌舞片黃金時代的情懷，都在霧\n靄溫暖的濾鏡下給拍得夢幻。導演曾說，早在《進擊的鼓手》前，他心底就想\n\
  拍一部關於這座城市的音樂電影了。\n\n\n　這部《樂來越愛你》找來從《熟男型不型》《風雲男人幫》開啟合作機緣的\n銀幕情侶艾瑪史東和雷恩葛斯林，差不多就是票房保證了。艾瑪史東在《破處\n\
  女王》就已經開過金嗓，雷恩葛斯林更是迪士尼兒童歌唱節目走紅的男星。片\n商才釋出男女主角在暮色中翩翩共舞的海報，立馬就讓人聯想起了好萊塢歌舞\n片。\n\n\n\
  \n　如果說當年橫掃奧斯卡的《大藝術家》是對黑白默片的致敬，那麼這部獲選\n成為威尼斯影展開幕片，還讓女主角封后的「拉拉鍊」，無疑是對美國歌舞片\n黃金時代的無限眷戀。況且，要說年輕藝術家都曾有過在夢想與現實中拉扯、\n\
  載浮載沉的經歷和心聲，還有什麼形式會比老式的好萊塢歌舞片更適合呈現這\n樣的題材呢！\n\n\n\n　在夜景山丘上翩翩起舞的雙人踢躂，讓人想起舞王金凱利的《花都舞影》；\n\
  一對戀人蝸居的小屋子裡那架鋼琴和追逐星夢的場景，則讓人想到馬丁柯史西\n斯執導、勞勃狄尼諾跟麗莎明妮利1977年的音樂劇《紐約紐約》裡的那對音樂\n戀人；天文台裡飛進\
  \ 360度投影星空布幕的無重力夢幻雙人舞，簡直就是伍迪\n艾倫《大家都說我愛你》裡他和歌蒂韓在夜晚的塞納河畔輕歌妙舞的復刻。\n\n===\n>再回味一次天文台星空布幕葛帥跟石姐的雙人舞\n\
  \ 也再比對一下當年無敵艾倫跟歌蒂韓塞納河畔的漫舞\n \n===\n\n\n　我們知道導演對爵士樂私心偏愛，但卻不明白為什麼從《進擊的鼓手》到《\n樂來越愛你》，導演都讓主角們追夢過程中的洋溢才情成為了愛情的詛咒？上\n\
  一部是為了成活兒不得不斷去七情六慾的瘋魔。這部是一對先後在追逐夢想的\n路上互相推了彼此一把，卻沒想到把彼此也從身邊推遠了的戀人。\n\n\n　我喜歡兩個人各自分開冷靜之後，雷恩格斯林因為一通選角試鏡的通知，連\n\
  夜開去艾瑪史東故鄉催促著已經放棄夢想的女孩再試一次…在那之後，女孩意\n有所指地問著「我們在哪？」，他說「格里斐斯公園啊。」「不，我是說我們\n現在的關係算走到什麼地方？」「……」我們也都曾經像他們一樣承諾過不論\n\
  如何我都會永遠愛著你，但卻不知道等待在未來的會是什麼？就如我們也永遠\n弄不明白在那些年歲裡面，怎麼我們愛著愛著，就分開了？\n\n\n\n\n--"
