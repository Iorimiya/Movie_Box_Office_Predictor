url: https://www.ptt.cc/bbs/movie/M.1488292041.A.3F5.html
title: '[討論]樂來越愛你最佳男主角沒得獎?'
content: '其實看完奧斯卡的幾天後


  還是忿忿不平


  沒最佳影片不意外


  男主角明明演技超讚的


  竟然落馬


  影片中光是用A HA-TAKE ON ME


  給男主角表演就值得一個金像獎了


  試問男演員可以詮釋這腳色的是有幾位


  倒是女主角叫誰來演都會拿到這個獎吧


  艾瑪 華森當初沒演應該氣到跳腳


  整部靈魂就是在男角身上


  六個獎沒最佳男主真的是很無言


  --'
