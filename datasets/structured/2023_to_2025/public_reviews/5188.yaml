url: https://www.ptt.cc/bbs/movie/M.1474239150.A.A5F.html
title: '[情報]多倫多影展 "樂來越愛你"獲觀眾票選獎 '
content: '多倫多影展的獎出來了

  多倫多大獎由觀眾票選，得主通常會在接下來的北美獎季頗有收穫

  去年得主是"不存在的房間"(Room)

  今年則由威尼斯一路旺到多倫多的樂來越愛你(La La Land)登頂




  第二名:雄獅(Lion)

  第三名:西洋棋后(The Queen of Katwe)








  (去年起設的競賽單元，以藝術電影為目標)







  ------------------------------------------------


  樂來越愛你(La La Land)已經成為北美獎季大熱。感覺票房也頗為看好


  二三名是比較溫馨勵志的電影。都改編自真人故事

  分別是韋恩斯坦和迪士尼用來衝奧的"雄獅"與"西洋棋后"

  雄獅是戴夫帕托，妮可基嫚，魯妮瑪拉主演。

  因走失而送到孤兒院的印度男孩，被領養到澳洲。

  25年後展開尋親之旅，用Google Earth達成了渺茫的目標


  "西洋棋后"講述出身貧民窟的烏干達少女Phiona Mutesi

  如何成為著名西洋棋手的故事，由露琵塔尼詠歐主演


  不過其實兩者影評方面開盤中等而已，可能衝獎方面有限，還是拚票房吧


  另外必須特別關注的是午夜驚狂單元，得獎的都頗有可看性(或者說很特別)

  去年得主是"超狂亨利"

  今年是班偉特利的新作"Free Fire"

  布麗拉爾森，席利安墨菲，艾米漢默主演

  據說和上部摩天樓風格迥異，槍戰玩得十分開心



  --'
