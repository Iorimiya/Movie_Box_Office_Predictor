url: https://www.ptt.cc/bbs/movie/M.1486539227.A.D83.html
title: '[好雷]樂來越愛你－Dance with Dream in La La  '
content: "圖文網誌版  \n\n\n\n\n樂來越愛你－Dance with Dream in La La Land\n\n\n________________________________________\n\
  \n\n　　請原諒我不是畫 Mia & Sebastian在洛杉磯格里斐斯公園（LA\nGriffith Park） 踢踏舞Battle的經典海報，因為個人覺得Rialto\n\
  Theatre 才是 Mia & Sebastian兩人的人生轉捩點，也是兩個人更勇\n敢追夢的開始。而另一個場景，格里斐斯天文台（Griffith Observatory\n\
  ），則意味著他們將一起翩然起舞在夢想的銀河裡，未知、神秘卻又\n星光熠熠，呼應《City of Stars》 ，令人嚮往。\n\n\n　　「就算夢想再遠，有個人一起追夢，就好像多了兩倍力量在前進\n\
  ，不再孤軍奮戰。」\n\n　　樂來越愛你（La La Land）叫好又賣座，奪得第74屆金球獎七項\n大獎，包括最佳影片、最佳劇本、最佳導演、最佳原創配樂、最佳原\n\
  創歌曲，而Ryan Gosling與Emma Stone也以精彩演出分別拿下了最佳\n男女主角。整部電影充滿對LA（洛杉磯）的致敬，這也是英文片名的\n由來。好萊塢式的歌舞劇、朝聖景點等，或許我對時空背景模模糊糊\n\
  ，也不太清楚是曾經出現哪部經典電影的著名場景，但光聽爵士樂就\n已經很過癮了！\n\n《Another Day of Sun》\n\n　　我非常喜歡在 105-110州際公路的開場《Another\
  \ Day of Sun》\n，感受歌舞劇的熱血青春，另外《Someone in the Crowd》轉場雖然\n突兀，但四個女孩個性凸顯鮮明，想到自己那群可愛瘋女人朋友，實\n\
  在貼近人心，一開始就被這兩首歌給逗樂了。\n\n《Someone in the Crowd》\n\n　　導演 Damien Chazelle以很有趣的春夏秋冬方式詮釋Mia\
  \ & Sebastian\n之間的感情與生活變化，雖然過場短暫又快速，畢竟電影的重點不只\n是小情小愛，隨著《A Lovely Night》、《Planetarium》、《City\n\
  of Stars》、《Start a Fire》、《Mia & Sebastian’s Theme》，\n卻也讓人深刻感受到情人之間從陌生到相戀，又成為最熟悉的陌生人\n\
  的過程。\n\n　　除了對 Mia看著 Sebastian在舞台上發光，卻驚覺自己離Sebastian\n跟夢想越來越遠的那幕心有戚戚焉，最有共鳴的另一幕就是\
  \ Mia在面\n試唱出《The Fools Who Dream》 的時候。就算追夢過程如塞納河的\n冰冷刺骨，跳進冰冷的河水中在旁人看來就像傻子，但我仍會選擇奮\n\
  不顧身縱身躍入……這不正是你我等追夢人的最佳寫照嗎？只有我們\n自己才真正懂得追夢的箇中滋味。\n\n《The Fools Who Dream》\n\n　　來到電影最後的蒙太奇，虛實穿插的每一幕，讓我想到五月天的\n\
  歌《後來的我們》：『後來的我們，依然走著，只是不再並肩了，朝\n各自的人生追尋了……』原來，Mia & Sebastian 最後並沒有如願的\n有情人終成眷屬。\n\
  \n　　當 Mia面試完後與 Sebastian在白天格里斐斯天文台的對話很有\n意思。 Mia：「這裡白天怎麼那麼醜！」好像訴說著兩人曾經在這裡\n翩然起舞的浪漫美麗，與今日心境對比早不能同日而語。當\
  \ Mia再次\n想確認彼此的關係時， Sebastian回道：「我也永遠愛你，但現在的\n我們無法在一起。」兩人眼神透出的難過與無奈，你我是否也似曾相\n識呢？\n\
  \n　　或許，男女主角兩人分開的結局令人感到完美中的不完美，但最\n終 Mia & Sebastian都實現了當年的夢想也無不是件好事，不是嗎？\n電影其實還有很多值得著墨的地方，而也因每個人的際遇、經歷、想\n\
  法等，會有不同的獲得與解讀，這就是一部好電影可以衝撞出很多火\n花的可貴之處！以上是不專業影評人報導，最後送上《The Fools Who\nDream》 歌詞給所有的追夢人。\n\
  \n\n《The Fools Who Dream》－Lyrics\n\n\n\n\n\n--"
