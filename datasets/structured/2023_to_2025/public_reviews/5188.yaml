title: '[好雷] 樂來越愛你'
content: '遇到一個欣賞自己的人不容易。


  劇中，兩個有才華、有抱負卻苦無人欣賞、難以施展的男女主角，

  在各自潦倒的時間點相遇。(Mia屢屢面試不上、Seb剛被音樂餐廳炒魷魚)


  在聖誕夜，Mia的車子被拖吊，便隨意走在街上，經過Seb正在演奏的音樂餐廳，

  Mia受Seb即興的音樂彈奏吸引，而且是深深吸引。就在Seb演奏完，卻被炒魷魚後，

  Mia想跟走出來的Seb表達欣賞之意，但Seb卻因失望傷心而疾步走過她身旁，

  並很沒有禮貌地撞過她的肩膀，留下一臉詫異茫然的Mia。


  但有緣的兩人還是於派對相會，Seb仍是鍵盤手，而Mia一聽仍是深受吸引而主動前來

  點歌搭訕，而開始了兩個人的情緣。


  兩人的性格相似處，就是敏感於藝術，並且願意為之獻身，不容改變。

  Mia是擅於即興表演的演員，而Seb深愛即興自由的藍調音樂，兩人因著有著相類似的

  才華天賦而互相欣賞且互相吸引，彼此就如彼此的星星，在滿天的星斗下共舞、擁吻，

  彼此的情感調性、浪漫相通，無須言語即有相互契合的默契，簡直就是天造地設的一對，

  如此對象，世間難遇，走在一起是理所當然、無庸置疑的，看上去就是一對，適合永恆。


  然而，因為太年輕、又太在意彼此，而產生了誤會。

  兩人在一起，一定要想到未來，才能繼續往前走下去。

  Seb聽到Mia與母親講電話，說Seb正在存錢，觸動了Seb的敏感神經，因為他正苦於對自己

  喜歡的藝術的堅持性格，而無法為五斗米折腰，且才華又苦無人欣賞任用，正缺工作又缺

  錢，聽到Mia於電話中向母親報平安時如此說，因為他太愛她，所以在意，便因而願意回

  頭去找那有錢但他卻非常不喜歡的音樂工作邀約，他願意為她犧牲，因為他愛她，也在意

  她所回覆她母親所掛慮的另一半要有可以照顧她、不讓女兒吃苦的穩定的經濟能力。


  但Mia看見Seb對他向現實妥協而接下的音樂工作的嫌惡，Mia不喜歡看見他因為錢而做他

  不喜歡的工作。兩人都是藝術人，而向現實妥協而犧牲自己所愛的藝術理念於藝術人來

  說就如自殺行為。Mia是受Seb對自己所深愛的藝術的熱情而吸引，因為她在他的音樂裡

  聽到熱情，而產生了感情、愛情。Seb此舉無異於埋葬他們的愛情，但Seb忍耐，是因為

  對Mia的愛，對未來能實現夢想。但他因此錯過了Mia的獨角戲，在Mia聽到人的閒言閒語

  時因工作而無法陪伴她身旁給她支持的力量，戀情因而告吹。


  人很難不在意他人的評價與言語，因而棄守所堅持的價值。

  Seb因愛Mia而在意她母親的價值而棄守原本強硬堅持的藝術理念，向現實妥協；

  Mia也因Seb向現實妥協，棄守他對所愛藝術的熱情，因討厭的工作而錯過她最重要的

  演出，聽人閒言閒語遭受重大打擊，而放棄了堅持了6年的演員尋夢之路。


  但在此，劇情產生重大轉折。使Mia大受打擊的那場獨角戲迎來了她生命中的貴人，

  她受到賞識，演員之路從此大開。而，是Seb接到這通電話，並強烈鼓勵已經放棄的她

  去。他連夜趕至她家，狂按喇叭，還遭鄰戶扔東西，勸她全力以赴，載她去，全程陪伴。


  5年後，Mia成了名，Seb也有了自己熱門的音樂餐廳，各自實現了5年前看來恍如遙不可及

  的星辰夢想。現在看來，是5年前的那段純情之愛，幫助了彼此實現夢想。Mia使Seb開始

  存錢，Seb幫助Mia重拾夢想。然而，感情已然回不去了，因Mia有了自己的小家庭。


  人生若只如初見。

  一樣的塞車如同初見的時刻，在初心動的音樂裡，在夢想裡，修成正果。

  Mia被先生載往表演的途中遇塞車，臨時提議去餐廳，是她先生反受Seb的餐廳音樂吸引，

  她反而沒有感覺，因為她已經有了先生小孩。餐廳入口標誌燈為弓箭形狀，令人聯想

  邱比特的箭，若射中便一見傾心，是種暗示。招牌居然是她當初設計給他的一模一樣的

  圖案。想他當初因為偶像是想取名雞肉串的，但這招牌分明是因為她，她是他的夢想，

  他愛她更勝於愛他原來瘋狂崇拜的爵士樂偶像，他沒有忘記她，也將永遠愛她。


  他見了許久未見、朝夕夢想的她，便只能彈起初見時那牽起他們之間聯繫的音符。

  太想她了。

  而她聽了，所有的不好的回憶更一一湧現，且一一改寫，變成修成正果的結局。

  或許這是Seb想讓她聽見的，也是她所想要的，畢竟他們彼此互為知音。

  只恨當時太年輕，又太在意彼此了，太像了。

  美好竟只能存於想像裡。


  Seb彈起初音，純為他純粹的情感使然，這是他的餐廳，他可以隨他心情彈他想彈的，

  也可盡情揮灑。或許有摻雜著想要喚回她的心情，但他沒有惡意，是太愛她了，所以彈。


  荒謬地始於此音，亦完美地結束於此音，以此音將此彼此成全之愛深藏心底，永誌不渝。

  我會永遠愛你。


  永遠地祝福與成全，亦不失為一件美事，而且是更為昇華之愛。

  有犧牲，有距離，沒有現實考量來打擾之愛，最美。


  不能再聽下去，該走了。沒有繼續的可能，就讓美好停佇於初音，最美。

  末了相視微笑，永遠祝福彼此，了然於心。


  我本來有想，Mia如果等Seb，便可修成正果了。

  但卻沒想到，末了Mia所想像的過程，才是她想要的劇情。她是會編劇的演員。

  正如同Seb那無法向現實妥協的藝術性格，她對自己所重視的愛情歷程也是無法妥協的。

  然而Seb沒有如她的意，沒有先跟她談，便自己做了決定，導致不合分手。


  如果，他們有人可以談，協助他們解決困境，或許真有可能可以如末了劇本所演

  美好結局，不用腦補。

  溝通了解真的很重要，遇重大決定不能自己來，要尋求溝通、協助，以免遺憾終生。


  劇情人設太天造地設，所以結局因為中途遇現實挫折而沒能在一起讓人扼腕非常。

  造化弄人，就是這樣，而且常常是這樣，所以不用太過感傷。

  若要問為什麼，其實沒有為什麼，就是這樣。若要探究，無解只是徒增傷感、傷情。

  要像片中末了Mia、Seb相視祝福而笑，從哪裡開始，在那裡結束，便開始新的人生。

  帶著微笑的深切祝福，在祝福中結束過往，也在祝福中開始新的人生，便是最美的結局。


  --'
