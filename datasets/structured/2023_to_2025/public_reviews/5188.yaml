title: '[新聞] 《樂來越愛你》團隊製作！休傑克曼主演音'
content: '新聞網址：


  [新聞] 《樂來越愛你》團隊製作！休傑克曼主演音樂電影《大娛樂家》全新預告上線


  文/ Sebox


  就像陳奕迅歌詞裡面所唱「怎麼有話題讓我誇做大娛樂家」，休傑克曼（Hugh Jackman）

  主演的新片《大娛樂家》（The Greatest Showman）也將在不久後上映（根本沒關係）。

  這是他結束 17  年的「金鋼狼」之後，最新主演的電影作品，以美國知名馬戲團表演者

  P.T. 巴納姆（P.T. Barnum）為主軸的傳記音樂劇電影，日前釋出了全新的預告，讓人相

  當感動啊！


  電影由《樂來越愛你》（La La Land）的原創歌曲作者帕塞克與保羅製作，大概可以想像

  看完《大娛樂家》後，肯定會再度被這次的原聲帶洗腦，而且休傑克曼剛出道就是以音樂

  劇《奧克拉荷馬》（Oklahoma）走紅，在《悲慘世界》（Les Miserables）之後再度飾演

  歌舞劇電影，希望能看見他精采的歌舞表演。此外，從預告我們可以感受到休傑克曼飾演

  的角色令人敬佩的勇氣，不僅找來各式各樣被認為是怪咖的人上台表演，接受觀眾的喝采

  ，更給予他們一個安全的歸屬，看起來將會賺得不少熱淚。


  官方簡介：《大娛樂家》是一部大膽的原創歌舞劇，讚頌著演藝娛樂產業的誕生，以及實

  現夢想時我們所感受到的美好。改編自 P.T. 巴納姆的野心與想像力，《大娛樂家》講述

  一個有遠見的人，如何無中生有創造出目眩神迷的驚人奇景，而後更成為世界聞名的表演

  。


  此片是廣告導演麥可格雷希（Michael Gracey）的首部長片電影，編劇團隊包括《美女與

  野獸》（Beauty and the Beast）導演比爾康頓（Bill Condon），演出卡司還包括蜜雪

  兒威廉斯（Michelle Williams）、柴克艾弗隆（Zac Efron）、辛蒂亞（Zendaya）等，

  並找來《樂來越愛你》（La La Land）奧斯卡最佳原創歌曲獎得主賈斯汀保羅（Justin

  Paul）、班吉帕賽克（Benj Pasek）製作歌曲，預計 12 月 20 日台灣同步上映。（

  Playlist）





  --'
