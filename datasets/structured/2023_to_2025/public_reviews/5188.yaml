title: '[請益] 樂來越愛你 La La Land 的幾個部分'
content: "前天看完覺得結尾加分太多，回家狂聽KKBOX的原聲帶 XD\n\n因為英文不太好，有些地方看過就一閃而逝了，有幾個地方想請問一下。\n\n\n\n\
  \n\n\n1.女主角第三次見到男主角，在一個派對，女主角點了一首歌。\n\n　忘記是哪一首歌了，想問問是哪一首呢？\n\n　然後為何男主角事後跑去跟他說：「你怎麼會跟一個專業樂團點這首歌呢？」\n\
  \n　這首歌還是這個樂團有甚麼故事嗎 @@ ？\n\n （標題1.總共有兩個問題。）\n\n\n2.女主角一開始說不喜歡爵士樂，然後跟男主角說「爵士樂不就是OOXX那樣嗎？」\n\
  \n　他到底是說哪樣 Orzz\n\n　印象中好像是說一個英文，看完記不太起來 Q _ Q\n\n\n3.片中的主旋律是原創曲還是改編的音樂呢（Mia & Sebastian’s\
  \ Theme）？\n\n　因為非常喜歡這一首，回家狂聽 XD\n\n　另一部分就是，因為女主角在跟前男友（前約會對象？）吃飯的場合聽到收音機的這\n\n　個旋律就選擇提前離席，因此讓我有些不確定是否為原創曲目。\n\
  \n\n\n我覺得我的問題應該都來自英文不好、記憶不好跟音樂不好（默）。\n\n希望能幫我解答，謝謝。\n\n\n\np.s.在看《進擊的鼓手》和這部之前，對爵士樂的認識也不是太好，這兩部片完全顛覆了\n\
  \n　　我對爵士樂的認識，天啊超級好聽的，這兩張原聲帶我一定會購買啊！\n\n　　有種國小跟國中的音樂課到底都上了些甚麼啊，在看《鼓手》之前，我會把Whiplash\n\
  \n　　總括通通都定義成交響樂吧，我對於音樂的知識好像越來越模糊了。\n\n　　好想重新學習音樂啊（哭）。\n\n\n--\n\n　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　\n\
  \n--\n\n是因為Kenny G的屬於抒情版本的爵士樂（輕爵士），跟男主角認為的「爵士樂」有所\n不同所以才酸嗎嗚嗚。\n\n對這一塊文化不太了解就不明白男主角吐槽的點跟鄉民覺得酸的點（淚）。\n\
  \n\n感恩。\n\n\n跟上面my大回的一樣，是否代表女主角認為的爵士樂都是類似Kenny G的「輕爵士」？\n\n比較抒情的感覺那種(?)。"
