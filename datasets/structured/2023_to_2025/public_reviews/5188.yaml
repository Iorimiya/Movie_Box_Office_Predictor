content: '新聞網址：


  樂來越愛你》導演獎+1 抱緊奧斯卡風向球


  【謝宛儒╱綜合報導】31歲的美國導演達米恩查澤雷（Damien Chazelle）上月以歌舞片

  《樂來越愛你》（La La Land）抱回生涯首座金球獎最佳導演，昨天再獲美國導演工會獎

  頒發最佳導演獎，問鼎奧斯卡來勢洶洶。


  擒美國導演工會獎

  查澤雷2014 年執導《進擊的鼓手》展露頭角，去年自編自導《樂來越愛你》不僅在金球

  獎入圍7獎全拿，更獲奧斯卡14項提名，聲勢超旺。由於導演工會獎被視為奧斯卡重要風

  向指標，也讓他抱回小金人的機會攀升。


  --


  我是男生，只能愛男人。我是0號，喜愛專情、體長粗壯的1號男人。


  單身時，喜歡和不同類型的男人上床做愛，也喜歡同時被多個男人輪流上。


