url: https://www.ptt.cc/bbs/movie/M.1481890644.A.3E0.html
title: '[好雷] 樂來越愛你-愛情轉彎之處'
content: '如果愛情可以重來的話，將會是什麼樣的光景？可惜重置鍵目前只存活在自己想像中，編

  織得再美好，僅憑添感傷，更何況，縱使時光倒流，相信你應該仍然會做同樣的決定--為

  了她（他），即使縱身跳入塞納河，也在所不惜。愛情與麵包，外加夢想的人生常考題，

  雖通俗，卻藉著背景裡，時代藝術潮流的沒落互通聲氣，譜出令人心碎的歌舞電影。這是

  樂來越愛你。











  (底下有雷)








  故事無特出之處。從極有緣份的相遇，到因為彼此的氣息相通，境遇類似而靠近，兩人度

  過了燦爛的熱戀時光，只是隨著時間的遞嬗，不知從何時開始，對彼此的支持變質而漸行

  漸遠，再回首，人事皆非。如此通俗的愛情故事，交到《Whiplash（進擊的鼓手）》的導

  演手中，不單只是以歌舞劇包裝而已，更用多種拍攝手法，將故事處理的清新脫俗，並彷

  彿回到舊日的單純時光。




  它可說是幾種敘事技法的雜燴，或該說你總會想起過去的幾部電影。第一幕的相遇從不同

  的觀點分段進行，讓人想起《桐島、部活やめるってよ（聽說桐島退社了）》的同樣事

  情，不同視角的方式，回應主角Seb和Mia兩人在此時仍為八竿子打不著的平行線。平行線

  如果有所交集，那不就是所謂的緣分，上天所創造的奇蹟嗎？同時在此交代了兩人的狀

  態，為接下來兩人的相互吸引，提供了背景。




  熱戀期的第二幕則讓人聯想起以《Singin'' in the Rain（萬花嬉春）》為首的幾部經典

  歌舞電影，不單單只是形式相似，更往前回溯至黑白默劇時期的電影語言，無論是在畫面

  的處理，肢體動作的編排，尚植入老電影的片段，對應現代的場景，並搭配影片裡的另一

  個藝術，爵士樂的運用，瀰漫著懷舊情懷，這也是電影的另一個核心，Mia和Seb的夢想。

  編導擺明地向過去的藝術致敬，之餘，也藉著主角追求夢想的腳步，擁抱它們。




  Mia和Seb的關係則帶點《Blue Valentine（藍色情人節）》的味道。經由縝密的鋪陳，兩

  人因著對夢想堅持所散發熠熠生輝的神采而相互吸引為濫觴，原本承接的應是手牽手各自

  在自己的目標披荊斬棘，怎料浮出了麵包的抉擇，讓穩定的關係產生波紋，追夢的途中受

  挫則是最後一根稻草。雖然導演在此中規中矩的娓娓道來，使觀者察覺到感情的細微裂

  痕，由點連線擴張成面，但不甘寂寞地也透過前後對照來表現關係的轉變，如Seb約看電

  影在前，Mia的首演之約在後；如第一次約會地點於後來結束營業。更甚，爵士音樂的

  舊瓶加入新酒，暗度陳倉於這部電影裡，緊密貼合著兩人的關係轉變。




  首尾對比有時候也代表著兩人狀態的改變，如在片場咖啡廳買東西被請課的客人從Mia憧

  憬的大明星變成自己本人；Seb從匆忙地趕赴工作約，且接受老闆的安排到從容地獨坐在

  店內試音，接受店員的祝福。欣喜的是兩人雙雙實現自己的夢想，帶點感傷的則為此時又

  轉變成兩人各自的生活平行串連。儘管同樣地被樂音吸引而有了交集，但過往與現在已如

  天壤，意義天差地遠地讓人揪心。




  最精采的莫過於最後Seb對過往的描繪加入自己想像的色彩，以舞台劇的表現手法，從一

  無所有的白皙到豐富燦爛的多彩，在眼前閃逝而過。但在場景與場景的接縫中，迸裂出

  Seb內心無盡的遺憾，僅能由許多個如果填滿間隙，防止惆悵氾濫。觀者如我的情緒在此

  累積至最高，倒也理性思考著若真有時光機器回到過去，作法會有所不同嗎？對Mia是轉

  捩點的那場面試表演，其實給了我們答案，為了所愛而奮不顧身，無論如何。劇終前的兩

  相凝望，雖未言語，雖有哀傷，但彼此瞭解的眼神，謹願來世有緣再續。



  歡迎光臨:



  --'
