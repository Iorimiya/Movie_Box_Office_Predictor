  奧斯卡獎頒獎典禮將於台北時間2月27日公布，入圍多項大獎的「樂來越愛你」無論是評價及票房都創下驚人佳績，而這還僅是達米恩查澤雷的第三部電影而已。電影原定女主角是「妙麗」艾瑪華森，但她因為要演出「美女與野獸」而婉拒，如今卻可能與影后擦肩而過，想必她也應當直呼可惜。


