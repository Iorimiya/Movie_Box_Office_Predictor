url: https://www.ptt.cc/bbs/movie/M.1481962577.A.A7E.html
title: '[好雷] 樂來越愛你-那夢想之境'
content: "昨晚深夜看完這部片，內心澎湃，在此想和大家分享一些心得，以下從音樂、電影、劇情切入。\n        我是一名爵士樂迷，幾年前看完了 進擊的鼓手後，便十分期待達米恩·查澤雷未來的作品，導演和我一樣是重度樂迷呀～不論是進擊的鼓手還是la\
  \ la land處處可見導演對於Jazz的痴與迷，導演引用了許多爵士典故。  例如：電影在環視男主的房間擺設時映入眼簾的兩張照片是Miles Davis與Bill\
  \ Evans，可以見得男主對於大師與經典的推祟。 不過，有趣的是這兩位大師在他們的年代是開創者、革新者，前者開創了cool\njazz時代後者則是打破了傳統三重奏的模式，恰巧與男主的堅持完全相反，是的，聽眾是挑剔的、無情的，當大眾都不賞臉了，更晃論復興爵士樂呢？\n\
  \       電影本身色彩鮮豔、繽紛，許多的橋段，可見好萊塢經典電影的手法，在電影中段男女主角相擁跳舞，飛躍至仙境，這讓我想起了在窈窕淑女中，奧黛麗·赫本和男主角那優雅的擁舞，許多片段是那麼的似曾相似，卻不落俗套，令人十分難以忘懷。\
  \ 這部電影的主題的構成要素十分簡單，「夢想」、「愛情」，男女主角互相為彼此夢想、才華而吸引，為了現實與理想而衝突丶妥協，互相扶持對方，雙方的情意綿綿，但是，卻扺擋不了時間與距離的考驗，Emma\n\
  Stone在最後的試鏡告訴男主角，「我永遠愛你，不論何方」，然而，五年後，女主成名，有了小孩，然而，枕邊人卻換人了，那句我永遠愛你聽來格外刺耳。 是的，現實是無情的丶人生是殘酷的，但人生也總是充滿巧合。\
  \ 下一個街口，或許就遇見往日情人。  在片尾，男女雙方再次相遇，男主彈起city of star片中的主題曲，這首曲子促使男女相愛同時也是道別曲。 琴聲如此地優傷、如此的觸人心弦，台下座客孰知愁、唯有蜜亞才知道男主心中那無窮無盡的如果啊、如果啊，但，往事已矣，人生不能重來，唯一能做的是向您問聲「你過得好嗎？」\n\
  至此，謝謝大家的閲讀，誠心推薦這部好片，希望可以拿下最佳影片。\n\n-----\nSent from JPTT on my iPhone\n\n--"
