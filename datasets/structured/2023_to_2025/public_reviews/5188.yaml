url: https://www.ptt.cc/bbs/movie/M.1484631380.A.B81.html
title: '[討論] 《樂來越愛你》女主角原是艾瑪華森！'
content: '電影《樂來越愛你》讓男女主角艾瑪史東（Emma Stone）、雷恩葛斯林（Ryan Gosling）

  再度攀上演藝事業巔峰，更奪下金球獎音樂及喜劇類影帝后，其實，導演達米恩查澤雷（

  Damien Chazelle）剛開始屬意的男女主角可是另有其人，艾瑪華森（Emma Watson）便是

  第一人選。


  達米恩查澤雷先前以《進擊的鼓手》一鳴驚人，男主角邁爾斯泰勒（Miles Teller）也被

  逼出精湛演技，他原本因此邀請對方出演《樂來越愛你》，結果後來因為接拍《Bleed

  for This》而辭演；艾瑪華森則是因為選擇演出真人版《美女與野獸》而退出，巧合的是

  ，她在《美》片中也有跳舞、開金嗓，甜美的歌聲在預告中相當吸引人，展現和艾瑪史東

  完全不同的風格。

  艾瑪史東和艾瑪華森皆是近10年來備受看好的女星，但是兩人戲路完全不同，艾瑪史東大

  多都是演喜劇，像是在《女郎我最兔》中完全沒有偶像包袱盡情搞怪，也能夠在《姐妹》

  裡飾演沉穩、仗義執言的角色，更曾以《破處女王》嶄露頭角，首度提名金球獎音樂及喜

  劇類電影最佳女主角，以《鳥人》入圍奧斯卡女配角，年僅28歲的她如今憑著《樂來越愛

  你》摘下多項女主角大獎，未來無可限量。

  艾瑪華森則是以《哈利波特》系列中的妙麗一角走紅全球，之後極力想甩開角色包袱，大

  多接演反差較大的角色，像是《壁花男孩》、《星光大盜》、《窒命地》等片，並經常為

  女權發聲，形象十分正面，粉絲雖然無緣在《樂來越愛你》中看到她展現歌舞，也能夠在

  3月16日上映的《美女與野獸》一探究竟。



  --'
