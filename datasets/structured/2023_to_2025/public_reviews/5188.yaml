title: '[普雷]樂來越愛你 '
content: '這邊對於整部電影有些個人小小的淺見和解讀


  電影前半段有些爵士音樂部分會有點睏

  但也許是我不夠有藝術氣息

  整體內容還算寫實

  個人認為它屬於後座力強的片子

  有拍出夢想跟愛情的難以抉擇感

  但片中最後似乎又告訴我們

  其實很多選擇不一定是二選一而已

  別被框架設限

  或許會有其他的可能性


  有個地方是我認為關鍵性反轉

  電影中前面描述追尋夢想的過程中

  有多辛苦、多難過，你可能要放棄很多東西


  但片中最後

  兩人相遇時(彈琴那邊)

  過往回憶浮現，但內容卻跟當初抉擇的不同

  1.第一次相遇，男主角不是撞開他，反而是親了她

  2.組團黑人找他時，馬上拒絕

  3.女主角的獨角戲滿堂采，男主角也在現場

  4.女主角獲得試鏡後，男女主角一同飛往巴黎

  其他遺漏之處請多包涵


  那邊我略微落下男兒淚

  有時候，我們以為的平行線或是二選一時

  是否其實有更多選擇可以做

  就像獵人試驗時，打破牆壁的小傑


  不知道各位是否有跟我類似的感覺


  --'
