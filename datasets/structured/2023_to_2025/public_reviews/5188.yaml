content: "最近租了這三片,  看完後有些問題, 所以想請教大家,\n擔心會爆雷, 所以再請按個空白鍵:\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n    **黑金企業**\n    (1) Paul和Eli都是同一人, 在Eli被男主角揍過,\
  \ 然後晚餐時揪著父親罵說都是\n        你兒子Paul引狼入室.... => 請問Paul是有精神方面的問題嗎?\n    (2) 在假弟弟來跟男主角相認的那晚,\
  \ 為何H.W.要放火燒房子 ?\n\n\n    **樂來樂愛你**\n    (1) 一場在Mia(女主角)工作的咖啡廳, 一位穿白色上衣和裙子的金髮女生\n\
  \        問Mia, 麵包是否含麩質,並想退貨=> 請問這女生是花邊教主的女主角\n        客串的嗎 ?\n\n    **林肯**\n   \
  \ (1) 在開演20分鐘左右, 有對夫妻來請林肯幫忙的場景,\n        這對夫妻回答內閣詢問說若戰爭結束, 他們就不贊成修改地13條法案,\n   \
  \     原文:\n\n        Mr.Jolly: Niggers (黑鬼)\n\n        Mrs. Jolly: If he don't have\
  \ to let some Alabama coon come to\n                    Missouri...steal his chickens\
  \ and his jobs, we'd\n                    much prefer that.\n                  \
  \  (要是無須讓阿拉巴馬州黑鬼來密蘇里偷他的雞和搶飯碗,\n                     我們寧願那樣)\n\n       => 抱歉....我真的資質駑鈍,\
