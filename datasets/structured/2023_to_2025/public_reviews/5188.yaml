title: '[好雷] 樂來越愛你-  Mia的內心獨白'
content: "有雷分享與討論------------\n\n\n\n\n\n\n\n------------\n\n\n台灣的普遍的休學制度只能維持兩年，\n\
  第三年即退學處分。\n（雖然不知道美國大學的學制如何）\n\n\nMia曾說她離開大學六年了，似乎也代表著無法再以大學生的身份重返母校。\n\n開頭在塞車車陣中歡唱，似乎象徵著一群人懷抱著美國夢，奢望夢想能在異地建樹。\n\
  \n而男女主角亦是其一\n\n\n\n看完電影後回頭思考，\nMia不應該大聲斥喝著Seb放棄初衷簽了兩年契約\n\nMia跟Seb一樣，度過了長期的停滯階段。\n\
  \nSeb至少還在餐廳演奏鋼琴，\n然而Mia也不過是從事著與演員毫不相干的「服務生」罷了\n即便她仍積極的參加試鏡。\n在某種程度看來，兩人往夢想邁進的方式是一致的\n\
  \n\n如果要深入的分析Mia的思緒，\n大概是她的理智始終勝過了Seb的一廂情願吧！\n\n\n六年？為了成為演員放棄學業苦撐了六年。\n登場的獨秀人數依然是寥寥無幾，\n\
  這對她而言是多麼令人心碎！\n\n眼看著Seb分明可以毫不猶豫達成自己的目標，卻因為Mia電話裡的一句牽扯退縮。\n\n她當然有理由斥喝Seb的懦弱\n即使Seb愛她，但這樣的選擇她完全不能接受！\n\
  \n對她而言，達成夢想才是一切的本質\n\n\n\n所以分手的預兆早在那一刻浮現。\n\n\n\nMia知道什麼叫做痛，但屢遭挫折的Seb卻鮮少提到他的困境\n\
  （當Mia發現他和老同學的相處不尋常時，Seb只打發了幾句台詞)\n\n\n論追夢，Mia絕對是本片中最值得讚許的英雄，哭著回到老家的她，看似對演員這條路完全死心\n\
  \n但事實上，只要有任何機會，不過是Seb傳訊的一則面試通知，\n她仍然火力全開\n在八點前買好咖啡上前應戰！\n\n\n\n說真的，回到現實中的我們，究竟誰做的到這一點？\n\
  \n休學、挫折、諷刺、嘲笑、放棄學業與愛情\n\n隨著影片的流逝，這樣的日子過了七年\n\n20歲到27歲，青春年華全置入在尋求夢想的波折\n\n\n這樣的毅力絕不輸「進擊的鼓手」\n\
  Mia的成功...\n 絕非偶然\n\n\n\n愛情片？算了吧\n這是我看過最勵志的電影。\n\n-----\nSent from JPTT on my Sony\
  \ E6653.\n\n--\n\"對於服務生常「請假」去試鏡\"是件難事，打過工的我非常認同(笑)\n嗯？... 我寫了「兩人往夢想邁進的路途上是一致的」\n\
  well... 放棄夢想是指他進了他所不喜愛的樂團，事實上在遇見Mia之前，他可以不必這麼做"
