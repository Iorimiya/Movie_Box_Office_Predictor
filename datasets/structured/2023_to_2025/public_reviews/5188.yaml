url: https://www.ptt.cc/bbs/movie/M.1508940623.A.240.html
title: '[好雷] 樂來越愛你-「反童話」的夢想故事'
content: '樂來越愛你 La La Land （2016）


  一齣「反童話」追求夢想的音樂故事



  ＝＝＝＝＝＝＝＝＝＝重雷心得＝＝＝＝＝＝＝＝＝＝



  一直沒去碰這部2017奧斯卡大贏家，所有得獎片都看過一輪就差拉拉鍊。

  好電影如果能在對的時間點遇見或許會更有共鳴，

  就像一本書有時候就在人生中的一個奇特的時刻出現。

  在看到3/4前我都還算喜歡，直到快到結尾時（最後一part「冬」），

  我原來已經想好要怎麼吐嘈、怎麼雞蛋挑骨頭了……

  結果，結局的安排讓我服了。

  我喜歡這個結局，和我預期它本來會的不太一樣

  （好樣的，還把我本來以為會的畫面演出來，簡直打了我一巴掌）。

  我認為不只收的漂亮，也大大的提昇了這部電影在各方面的價值。

  雖然最後沒有擊敗「月光下的藍色男孩」拿到最佳影片，

  但其他的提名和得獎，真是實至名歸。



  Emma Stone拿到最佳女主角也不意外，裡面有太多給她發揮的空間，

  和以「海邊的曼徹斯特」得到最佳男主角的Casey Affleck一樣，

  他們的表演不只細緻，還演到每個人心裡面去。

  那句「maybe I''m not good enough」道出了我們每個人心中的小小自卑，

  即使對方那樣篤定的告訴我們已經夠好了，

  但那曾經一次次的挫折與受傷在Emma Stone演出中我們也能夠感同身受。

  （這一點和Casey Affleck在曼徹斯特中的一場戲一樣，都使人淚崩啊）



  音樂方面真的很好聽，而且除了一開頭莫名的高速公路塞車唱歌，

  沒有過去音樂劇或音樂類型電影（迪士尼動畫我在說你）那種突兀的唱歌舞蹈。

  本片幾乎都用劇情編排或者燈光與攝影動態運鏡讓劇情與音樂的銜接達到最小值的跳躍。

  這對於比較少接觸音樂劇與類型電影的觀眾來說應該習慣了多。

  （我猜印度人一定沒有這個困擾）



  主題方面，全片緊扣著「夢想」的主題，

  雖然中文片名讓人誤會「愛情」也是主旨之一，

  但我認為男女主角之間的關係與整部片的氛圍都離「愛情」很遠，甚至我認為，

  這部片有些在諷刺或嘲笑「童話式愛情」，後面將再提及這部份。

  而「夢想」這主題其實很容易流於窠臼，

  但本片處理的比其他「勵志」電影更細膩的地方在於，它將「現實」與「運氣」

  等元素的比重放入了更多，也因此它更貼近每個人的真實人生。

  它依然傳達著「希望每個人都能朝著自己的夢想勇敢的前進，

  即使中間有很多困難與阻礙，有很多傷心挫折，甚至曾經放棄過。」這樣的信念。

  然而，它也將築夢之旅過程中所要付出的代價（與家人愛人相處的時間變少），

  以及真愛與麵包的抉擇（究竟一份工作是錢重要還是自己喜歡重要）一同提及。



  男主角Sebastian一開始就是一個重自己興趣而不顧他人眼光的藝術家，

  而女主角Mia正好相反，因為是個女演員，透過試鏡來獲得工作，

  他人的眼光對她來說非常重要。

  而這樣堅持自我理想的男主角，

  竟然是為了女主角（愛情）而簽下了搖滾爵士樂團的合約，看起來，

  他，很諷刺地被愛情擺了一道，不只背離自己的爵士，

  而最後也沒有跟女主角在一起。

  我比較腦補的詮釋是，愛情很可能在追逐夢想與理想的路上會是個阻礙，

  或是需要犧牲的成本。

  換句話說，築夢的過程是辛苦的，甚至會是隻身孤獨的。



  他倆的關係，比起用愛情來描繪，更像是惺惺相惜的失意人，

  在一個特別時刻相遇而成為懂得欣賞彼此的伯樂。

  Mia第一次被Sebastian吸引是在他擅自改歌單被開除的餐廳裡，

  那時候的旋律透露出一種懷才不遇的悲傷，

  那晚的歌曲讓她想起了自己的遭遇而被深深感動。

  在相識之後，他倆支持著彼此朝著自己的夢想前進，也成為築夢路上的支持與養分。



  最大的轉折在最後一段「冬」，

  多年後，Mia成了大演員，也成了家，在與老公在晚餐的路上誤闖了Sebastian的餐廳，

  而他的餐廳名字甚至是當年Mia替他取的。

  看見彼此之後，一切盡在不言中，

  他們都知道彼此已經成功（Sebastian餐廳外的轉角就有Mia的表演宣傳看板），

  然而今日的巧遇可說是感慨萬千，而接下來彈琴讓我們進入了一段有趣的片段：

  鏡頭回到從他們相遇那一刻，然後一路從冬春夏秋到現在此時此刻。

  我原來在看到3/4秋的時候我就在想，

  如果接下來最後的結局是公主王子從此過著美好快樂的日子，那我一定要吐嘈它。

  沒想到它竟然來了個回馬槍，然而有趣的是，

  Mia看著Sebastian彈著他們的「定情曲」時，出現了一段「美好想像」，

  而它擺進來的用意為何？



  我認為，除了在劇情上可以因為對比之下而加重最後的惆悵感之外，

  更重要的其實是要大聲的宣示：我不是（你想像中）一部追求夢想的童話故事。

  在「美好想像」中，即使音樂一樣，但畫面變得很「卡通」、「童話」，

  場景都是架出來的，甚至還有一段出現了「後台門（stage door）」，

  似乎在暗示了這些美好的事都是編寫出來的，都是舞台上演出來的，

  並不是真實的人生的面貌。

  其實在這段想像畫面中我有好幾次希望這才是真的，

  最後應該會再來個什麼轉折再轉折，拜託告訴我，他們最後還是在一起了。

  但抱歉沒有，最後畫面停留在Sebastian彈琴的手，

  Mia的老公問她是否要再聽一首，

  Mia淡淡的說「no, we should go.」



  而正當他們要留給彼此（還有我們）無限惆悵時，

  離開前兩人彼此的凝望、微笑與點頭，卻是那樣的感動人。

  這讓我想起了「瘋狂麥斯」中最後女英雄與麥斯的對望與點頭。

  那意味深長的點頭，是替對方高興最終實踐了自己的夢想，英雄惜英雄般的致意，

  而那句「我永遠都愛你」雖然最後沒能兌現，但如果沒有當初的陪伴與支持，

  又怎麼能走到這裡呢，那是惆悵卻也好感謝。



  敬

  那些在我們成長過程中，愛過我們，伴我們成長的人。




  --'
