content: '其實我想過 中間有什方法挽回


  但仔細想  這兩個人注定是悲劇


  男方可以為了與女方在一起  去做自己不喜歡的工作  但女方方愛的是有夢想的男方


  如果男方用自己的方式完成夢想  他的工作就會不穩定 (重點就是他不是富二代)


  但其實問題點在女方  女方如果沒得到演員的角色  女方就要回學校


  如果女方得到演員工作  女方就要長期在外工作拍攝


  各種情形都是聚少離多的情形


  只有萬分之一的機會可以在一起  那就是女方拿到的工作時在當地拍攝節目


  或是女方萬一回學校讀書時在不遠的學校


  但現實就是不可能


