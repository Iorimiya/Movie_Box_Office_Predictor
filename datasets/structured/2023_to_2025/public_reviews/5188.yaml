url: https://www.ptt.cc/bbs/movie/M.1484024436.A.942.html
title: '[新聞] 《樂來越愛你》一路風光 萊恩葛斯林放閃'
content: '潘鈺楨／綜合報導


  本屆金球獎頒獎典禮在開場表演中，巧妙引用電影《樂來越愛你》在公路上「一鏡到底」

  的橋段，主持人吉米法倫（Jimmy Fallon）先在紅毯獨唱，接著妮可基曼（Nicole

  Kidman）、艾美亞當斯（Amy Adams）、基特哈靈頓（Kit Harington）等大咖也從禮車走

  出唱跳，讓本屆最大贏家《樂來越愛你》從開場就風光到落幕。


  該片女主角艾瑪史東（Emma Stone）打敗《走音天后》梅莉史翠普（Meryl Streep）拿下

  音樂及喜劇類女主角，上台時激動感謝陪她闖蕩好萊塢的家人，「這是一部關於希望和創

  意的電影，那些遭受拒絕的創作者、試鏡碰壁的演員，或是差點放棄卻堅持下去的夢想家

  們，這個獎獻給你們！」


  拿下音樂及喜劇類影帝的萊恩葛斯林（Ryan Gosling），則在台上感性向女友伊娃曼德斯

  （Eva Mendes）傳達謝意與愛意：「當我在開心拍戲時，要感謝伊娃懷著第２胎、在家照

  顧孩子，還要面對哥哥癌症病逝，我想把這個獎獻給她的哥哥。」


  至於拿下導演獎的達米恩查澤雷（Damien Chazelle），以31歲成為最年輕的金球導演。

  他在台上感謝家人：「我３歲就說我想拍電影，謝謝你們自此就一直相信著我。」

  。


  【2017年01月10日 04:10 中國時報】


  新聞網址：



  --


