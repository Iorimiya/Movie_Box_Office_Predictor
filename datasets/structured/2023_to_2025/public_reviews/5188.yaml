title: 'Fw: [開箱] 樂來越愛你 日本版雙碟藍光鐵盒'
content: '作者: S890127 (丁讀生) 看板: Video

  標題: [開箱] 樂來越愛你 日本版雙碟藍光鐵盒

  時間: Mon Aug  7 16:05:58 2017


  因為真的很喜歡這部片


  當初院線數位版看了一次，IMAX又去看了一次


  可惜台灣不巧被很爛的代理商發行BD


  就有在考慮改收國外的版本


  美版英版的鐵盒設計都沒有非常喜歡，港版內容用心但沒有鐵盒


  因此當初一看到日本也要出獨家鐵盒的消息


  又看到採用的設計是我喜歡的圖樣，就立馬下訂了



  日本AMAZON發貨，可以送台灣，不需要委託代購


  預購有價格保證(出貨之前有降價或特價的話會跟你收最低價格，漲價的話不會多收)


  台灣購買日本商品免稅：6700日幣 + 運費520日幣


  刷郵局VISA被扣了2012元台幣


  而且運輸非常快，日本8/2上市，我今天就收到了


  比AMAZON網站上顯示的運輸狀況還快(上面寫貨剛到機場而已)



  日本獨家收藏鐵盒版 內容物：


  日本獨家鐵盒(本篇BD+特典BD)













  初回限定小冊(劇照、日英文歌詞)





  因為我是早期購入還有多一個類似預購特典的小票夾(票券大小的長資料夾)





  日本版藍光的音源與字幕收錄狀況：




  <音源>

  英語 Dolby True HD Dolby Atmos

  日語配音 Dolby True HD 5.1

  導演＆作曲者講評音軌 Dolby Digital 2.0ch


  <字幕>

  日語普通字幕





  日語字幕(加大字體)





  日語字幕(手寫風格字體)





  日語字幕(對應日語配音)

  跟普通字幕長一樣，就沒有特地截圖


  導演＆作曲者講評音軌用日語字幕




  日語普通字幕(附英語歌詞)


  平常對話跟普通字幕一樣，歌曲時會變成這樣



  要注意並沒有英文或中文的字幕喔



  日文版特別收錄：




  非常豪華，內容應該是跟港版差不多

  截圖的是本篇BD裡的特別收錄而已，還有另一片特典BD

  特別收錄部分都有日語字幕



  除了一般的根據劇情選取章節，還可以用歌曲來選





  整體來說非常滿意(特別是相較台版的發行狀況來說)

  鐵盒的設計也真的非常喜歡


  用破手機拍照，反光嚴重還請見諒


  --'
