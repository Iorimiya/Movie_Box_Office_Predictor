url: https://www.ptt.cc/bbs/movie/M.1485702414.A.375.html
title: '[新聞] 樂來越愛你 奪美國製片人公會最佳影片'
content: '（中央社洛杉磯28日綜合外電報導）浪漫追夢音樂劇「樂來越愛你」（La La Land）今天

  獲頒美國製片人公會最佳影片獎。本片稍早在美國影藝學院公布的奧斯卡金像獎入圍名單

  ，獲14項提名，備受矚目。


  美國「綜藝」（Variety）週刊報導，美國製片人公會（Producers Guild of America）

  頒發的最佳影片獎，27年間有19次與奧斯卡獎的選擇一致。


  樂來越愛你1月初在金球獎奪下音樂及喜劇類最佳影片、導演、男主角、女主角、劇本、

  原創配樂、原創歌曲等7獎。


  32歲導演達米恩查澤雷（Damien Chazelle）及男、女主角雷恩葛斯林（Ryan Gosling）

  和艾瑪史東（Emma Stone）也都如期獲奧斯卡金像獎提名，奧斯卡獎將於2月26日揭曉。


  樂來越愛你在本屆奧卡獎獲得多達14項提名，追平史上最高紀錄，與1997年的「鐵達尼號

  」（Titanic）和1950年的「彗星美人」（All About Eve）不相上下。（譯者：中央社羅

  苑韶）


  新聞網址：


  --'
