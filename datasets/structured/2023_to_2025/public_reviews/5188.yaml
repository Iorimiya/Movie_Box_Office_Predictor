title: '[大好雷] 樂來越愛你-抱著夢想過活的人'
content: '內文有雷無深度評論

  手機排版請見諒


  整個卡司無法忍耐之後再看

  於是上班偷訂票 第一天上映就下班衝來

  從開頭就被超精緻安排的歌舞場面還有配樂驚艷不已

  節奏很輕快流暢

  看著看著會忍不住微笑

  中間硬是讓男角穿上復古偶像拙造型

  搭配上他尷尬的臉真的有種快感?

  emma跳起舞來放超開的模樣真的好可愛呀

  而且看到進擊鼓手之惡魔指揮出現只感覺他失業來餐廳工作 無法抽離這角色XDD


  許多畫面都美到眼睛好享受

  配樂真的非常好聽啊，很想偷偷搖擺

  或許不愛爵士的人也能被男角所說的說服

  每一次演奏都不同、各樂器衝突又和諧

  「爵士樂其實是非常非常刺激的」

  覺得這段把爵士樂分析的很棒


  沒想到笑著笑著最後紅著鼻子眼睛走出戲院

  在他們身上能看到不少愛情真實的面貌


  或許兩個人所追求的夢想都看似需要伯樂賞識

  但其實最終需要的是相互支持的耐心啊

  又很想支持對方、其實自己忍耐著不少寂寞

  覺得努力擠出時間陪伴對方、為想給彼此好的生活而作了看似踏實的選擇

  卻被提醒著自己是否偏離了夢想

  常常長久的感情就這樣被消磨了啊

  明明初衷就是支持著對方而做了這些選擇

  最後卻變成兩人都感受自己在妥協


  面對兩人的再重逢、最後他們都走上了自己的夢想，在最後一曲中也把遺憾都在想像中彌

  補了

  事實上選擇總不是圓滿的

  （大概硬是要讓我更惆悵一點才能走出戲院）


  抱著夢想努力過活的人大概看了都非常有體會吧。或許在現實生活中常常在天人交戰著、

  想要給愛的人過好生活、究竟該不該相信自己的夢想呢？

  但沒做過大概就只能疑問和遺憾一輩子了



  自己其實說不太出不停掉淚的點在哪，大概從中後就非常想一直哭

  結果戲院燈一亮 哭花的臉差點嚇死男友"尼在哭蛇麼！！"


  整個大推薦，進戲院看很值得啊

  好期待原聲帶噢～～～






  --'
