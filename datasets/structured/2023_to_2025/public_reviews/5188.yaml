url: https://www.ptt.cc/bbs/movie/M.1481294187.A.C5C.html
title: '[新聞] 新片看板 再見瓦城尬樂來越愛你'
content: '（中央社記者王靖怡台北9日電）導演趙德胤執導國片「再見瓦城」今天上映，迎戰歌舞

  片「樂來越愛你」、音樂喜劇動畫「歡樂好聲音」，以及奪今年坎城影展男主角及劇本雙

  獎的伊朗電影「新居風暴」。


  1.再見瓦城（The Road to Mandalay）是導演趙德胤執導，演員柯震東、吳可熙主演，描

  寫一對男女從緬甸偷渡到泰國非法打工，兩人產生情感交往，卻對未來有不同憧憬，刻劃

  男女在社會底層莫可奈何的生活與分歧價值觀，讓愛情漸漸走向難以挽回的悲劇結局。


  2.樂來越愛你（La La Land）由好萊塢影星雷恩葛斯林（Ryan Gosling）與艾瑪史東（

  Emma Stone）主演，描述落魄鋼琴家「賽巴斯汀」與抱有明星夢的小演員「蜜亞」相識相

  戀相惜，在充滿可能的美國洛杉磯互相扶持逐夢，但當兩人逐漸邁向成功，現實壓力卻磨

  損原本美好愛情，面臨巨大考驗。


  3.歡樂好聲音（Sing）描述在全是動物的世界，主角無尾熊「巴斯特」透過舉辦歌唱比賽

  挽救他的劇場，經過競爭激烈的海選、初選、複賽、淘汰賽及導師終極考核賽後，晉級總

  決賽的5位選手出爐，在過程中「巴斯特」發現該拯救的不只是他的事業而已；全片共有

  超過65首暢銷金曲。


  4.新居風暴（The Salesman）是伊朗導演阿斯哈法哈蒂（Asghar Farhadi）執導，獲第69

  屆坎城影展最佳男主角和最佳劇本雙料大獎。描述一對演員夫妻搬離舊居，本以為可展開

  全新生活，未料妻子在新居遭外人襲擊，丈夫一心想為妻復仇，卻在抽絲剝繭時，真相一

  步步逼他陷入始料未及的人生風暴。


  新聞網址：


  --'
