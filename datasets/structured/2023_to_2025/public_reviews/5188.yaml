url: https://www.ptt.cc/bbs/movie/M.1481993899.A.696.html
title: '[請益] 樂來越愛你-背景含義'
content: '今天和閃光看完後，深深被吸引到，很難得會被愛情片感動到，雙方深愛追求夢想的對方

  ，但是最後如果要在一起，有一方必須放棄夢想去追隨對方，但是放棄夢想後，還會是那

  個因夢想而閃亮的他/她嗎？

  且中間男主為了生活，去演奏自己一直排斥的不同曲風的爵士樂，以至於後來和女主在吃

  飯時的爭吵，雙方的想法都有道理，烤焦的料理就像當下他們的狀況一樣，一團糟...有

  太多太多細節可以細細品嚐了！可以把當下的情節，和周邊的景物配角做聯想，會覺得很

  豐富！


  想問一下，影片中有滿多幕，都會出現繪畫的人物，像是女主在一開始要進酒吧，人行道

  旁邊的牆上充滿了繪畫的人，後面女主在編劇時，鏡頭帶過地上的一幅海報（應該）也有

  個繪畫的人臉，中間我印象中也出現滿多次，有人體悟到導演或編劇想靠這些繪畫的人物

  來傳達什麼嗎？因為出現很多次，感覺是想傳達出什麼感覺給觀眾


  --



  原來如此，拉拉練太多細節都要細心品味，比起一些單純的愛情片好看太多了，不過像海報人像這部分，還真的是要看過很多，才知道這些伏筆的人物是誰，對我這種認識比較少的人來說比較可惜，只能看出他畫面中偷偷放這麼多人物是有用意，卻無法去體會用意是什麼'
