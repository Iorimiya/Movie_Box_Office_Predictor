url: https://www.ptt.cc/bbs/movie/M.1482157929.A.6F8.html
title: '[新聞] 《樂來越愛你》原本乏人問津持續難產'
content: '新聞網址：


  《樂來越愛你》(La La Land)現年31歲的導演戴米恩崔澤爾(Damien Chazelle)本身是個

  重度樂迷，尤其是爵士樂(此點也表現在《樂來越愛你》)，音樂在他至今執導的所有長片

  作品中都有著重要的地位。


  僅看劇情簡介，當初很少人能預料到《進擊的鼓手》(Whiplash)這部小成本的獨立製片上

  映後能取得的成績，《進擊的鼓手》不僅入圍了五項奧斯卡金像獎，並贏得最佳男配角、

  最佳剪輯、最佳混音三個獎項，或許更少人預料到的是他的新作《樂來越愛你》備受讚譽

  的評價。


  戴米恩崔澤爾的成功自然不是只靠運氣，然而他在接受《好萊塢報導者》(The

  Hollywood Reporter)訪問時提到運氣這件事還是對其生涯發展有著重要的影響，特別是

  對《樂來越愛你》這部電影來說，因為在《進擊的鼓手》上映並有所成績之前，他在好萊

  塢一直找不到有人願意出資拍攝《樂來越愛你》。


  他說：「我在寫《進擊的鼓手》劇本之前就先寫了《樂來越愛你》的劇本... 那時每個人

  都不願考慮出資拍攝《樂來越愛你》... (我)試了好幾年想讓《樂來越愛你》可以在好萊

  塢開拍，但那時不只是被每個人拒絕，而且還是被說『請離開，我們不想聽到關於原創音

  樂歌舞電影(的案子)』之類的話。」


  「我先拍《進擊的鼓手》有一部份是因為必須這麼做，《進擊的鼓手》是部規模小得多的

  電影(兩部片預算相差近十倍)，其預算是我當時可以籌措到的資金。然而當我在拍《進擊

  的鼓手》時，我期望的是如果《進擊的鼓手》成績不差的話，可以為我拍攝《樂來越愛你

  》的計劃帶來一些轉機。」


  他個人持續遭到拒絕的親身經驗，以及其所提到的運氣是成功所需的一部份，多少也反應

  在《樂來越愛你》的故事中。在這個大片廠系列電影當道的時代，以獨立製片方式開拍一

  部類型傳統或有點過時的音樂歌舞電影，並在票房與評價上都取得優異的成績實屬罕見。


  當然運氣可能在促成《樂來越愛你》開拍的過程中有著相當作用，但電影至今所獲得的讚

  譽及肯定仍應歸功於電影創作者的才華努力及作品本身傑出的品質。


  新聞網址：


  --'
