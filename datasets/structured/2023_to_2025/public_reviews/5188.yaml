title: '[好雷] 樂來越愛你 La La Land'
content: '期待了那麼久

  完全沒有讓我失望啊!

  歌曲和舞蹈都相當的精彩

  觀看的過程我幾乎是忍不住微笑的

  那種輕鬆且帶著活力的氛圍

  心情都跟著隨之飛舞了起來



  當然

  片中也有幾段令我忍不住流了好多淚

  Mia試鏡時講了一段有關於姑姑在冬季時跳入塞納河的故事

  那首Here''s to the fools who dream充滿了追夢人的澎湃

  看似愚蠢卻又讓人羨慕著他們的執著

  有多少人能夠如此滿懷熱情的躍入一池冰冷且看不見底的追夢路中呢？



  She smiled, Leapt, without looking.

  And tumble into the sand.

  The water was freezing she spent a month sneezing but said she would do it, ag

  ai


  And here''s to the fools who dream.



  Sebastian和Mia是如此的般配與相愛

  但到了最後麵包還是戰勝了愛情

  結尾Sebastian再次彈奏了那首將兩人牽引至一起的樂曲

  一段美好的幻想流洩而出

  但縱使畫面繽紛、曲風輕快

  卻依舊讓人心痛不已



  兩人最後的微笑相視帶著一抹感傷

  如果時間真的倒轉一切會不會變得不一樣？

  又或許他們都是為夢想衝破頭傻瓜

  兩人注定無法為了彼此捨棄心裡那對所愛之物的渴望



  --'
