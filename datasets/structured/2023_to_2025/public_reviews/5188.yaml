title: '[新聞] 《樂來越愛你》艾瑪史東英國奧斯卡封后'
content: '被視為今年第89屆奧斯卡奪獎大熱門的音樂愛情電影《樂來越愛你》（La La Land），在

  今日揭曉的第70屆英國奧斯卡BAFTA頒獎典禮上，再奪下最佳影片、最佳導演、最佳女主

  角、最佳配樂和最佳攝影共5項大獎，成為最大贏家。


  從威尼斯影展以來一路拿獎拿不停的女主角艾瑪史東(Emma Stone)，這回首獲英國奧斯卡

  影后頭銜，上台時她感動說：「身處這個意見分歧的時局，感謝BAFTA讓我們難得在今晚

  能齊聚一堂，一起慶祝創作所賦予的正向力量，讓我們沒有隔閡，不再感到那麼孤單。」

  ，先後奪˙下金球獎音樂及喜劇類、美國演員工會和英國奧斯卡等影后獎座的她，隨著爭

  獎氣勢來越強，也被看好有望在第89屆奧斯卡正式登頂封后。


  在得獎後台，掩藏不住獲獎激動心情的她則表示，這回在《樂來越愛你》中扮演蜜亞這個

  追逐星夢的小演員，曾一度讓她非常恐慌，她笑說：「飾演一個在洛杉磯不停試鏡的女演

  員，對我來說還滿驚恐的，因為跟我初來到好萊塢的經驗太相似了。但開拍後一切變得越

  來越有趣，大家交換彼此慘不忍睹的試鏡經歷，再把它改編到電影裡，整個過程意外地療

  癒。」。；而調皮的艾瑪也透露，片中泳池派對上，她對雷恩點歌並手舞足蹈開玩笑那一

  幕，全是她不按牌理出牌的本色演出，她說：「音樂一下，我就忍不住開始跳舞對嘴，沒

  有人知道我會這麼做，不過我很高興導演最後決定把我的即興表演留下來。」。




  --'
