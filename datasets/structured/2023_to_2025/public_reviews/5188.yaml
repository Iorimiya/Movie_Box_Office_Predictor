url: https://www.ptt.cc/bbs/movie/M.1483954064.A.B0C.html
title: '[新聞] 國家評論報阿蒙懷特：《樂來越愛你》是一部鴕鳥心態的愚蠢'
content: "新聞網址：\n\n每年到了一月初，許多觀眾都等著國家評論報的影評人阿蒙懷特（Armond White）發表精\n采的比較大賽，阿蒙習慣用兩部電影做為天秤的兩邊，找出相似之處並評斷兩者的好壞，\n\
  而通常阿蒙的評論都會與其他媒體、影評的大相逕庭，今年當然也不例外。\n\n阿蒙直接將剛剛金球獎七項大獎全拿的《樂來越愛你》（La La Land），與李安導演新片\n\
  《比利林恩的中場戰事》（Billy Lynn’s Long Halftime Walk）做比較，指出達米恩查\n澤雷的《樂來越愛你》是一部鴕鳥心態的愚蠢之作，儘管先前阿蒙已經表示過《樂來越愛\n\
  你》最大的問題就是不夠 GAY，但如此直接指出此部電影是幼稚愚蠢之作實在令人好奇他\n的觀點。除此之外，這裡找出了幾個比較供大家參考，更多完整的評論請看國家評論報，\n\
  那我們明年見囉阿蒙！（nationalreview）\n\n《比利林恩的中場戰事》>《樂來越愛你》\n\n在 911 事件之後，李安透過 3D 觀點展現了美國人民彼此的愛，不論是因為地緣或是靈\n\
  魂契合，不同於達米恩查澤雷在虛榮的娛樂事業裡面寫出的幼稚情詩。李安超越了類型本\n身，讓美國人想起彼此互相連結的原因，查澤雷卻扭曲了類型，將電影變成十分愚蠢的一\n\
  種逃避，鴕鳥心態。\n\n《蝙蝠俠對超人：正義曙光》>《惡棍英雄：死侍》\n\n查克史奈德繼續在流行神話裡面找到深度，讓漫畫原形的文本打開我們的靈魂，但提姆米\n\
  勒的作品像是艾德格萊特那樣，漫畫風格的反諷卻違背且否定了正經的趣味。\n\n《薩利機長：哈德遜奇蹟》>《星際大戰外傳：俠盜一號》\n\n克林伊斯威特讚頌真正的美國英雄主義，同時也對\
  \ 911 事件後憤世嫉俗的不信任為話重\n新評價；葛瑞斯艾德華描述了戰爭的烏煙瘴氣，卻是星戰系列裡面最黯淡的一部，這是一\n部具有教育意涵的成人娛樂作品，對上給全年齡的小孩看的結果代表一切的宣教電影。\n\
  \n《美人魚》>《吹夢巨人》\n\n周星馳的奇幻動作電影在討論被遺忘的勞動階級的道德準則時，更點出了生態環境的問題\n。史蒂芬史匹柏的政治寓言故事，是一個對於歐巴馬這樣統治階級菁英主義的人無形的告\n\
  別。這是一部中國有史以來最有知名度的電影，對上美國大選年的跌跤。\n\n---\n\n 這邊還有其他部的比較，我就不一一翻譯了\n\n--"
