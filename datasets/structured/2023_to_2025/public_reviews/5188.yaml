title: '[好雷] 樂來越愛你 La La Land '
content: "-- 電腦可用PageDown換頁 --\n\n寫在前頭 這是第一部 想讓我動手寫點東西的電影\n\n也是第一部 讓我進電影院二刷的電影\n\n\
  或許跟自己曾經學過幾年的鋼琴有關 一直以來音樂類型的電影都挺吸引我的\n\n畫面、音樂、劇情的結合  三個願望一次滿足(?\n\n這部原本因為片名的關係 一直很有障礙不想自己一個人買票進去看\n\
  \n但是衝著 有鋼琴 跟 雷恩葛斯林還有艾瑪史東\n\n在年底前 硬著頭皮買票進場了 一刷時 左右各一對情侶\n\n(其中一對離場說出了世界上沒有真愛\n\n\
  *寫完感覺有點長 好怕被說是流水帳  文長慎入 現在←還來得及  新手上路請多包涵*\n\n--\n\n--\n\n鏡頭開始於 洛杉磯經典的高速公路塞車場景\n\
  \n導演很巧妙的從旁觀者的角度 慢慢的轉換著視角\n\n從車子間的切換 到高空俯瞰 最後一個轉身\n\n細膩的從每台車不同的音樂、不同的人跟不同的故事\n\n\
  卻因為塞車 帶出了共同點 在高速公路上跳起了舞\n\n隨著鏡頭的移轉 透過舞者的背影 回頭看著整條塞滿車的高速公路\n\n彷彿我們就身歷其中 變成那些隨著音樂起舞的舞者\
  \  成為故事中的一員\n\n故事就在這樣歡樂的氣氛下  帶出了 La La Land\n\n在這裡 不知道有沒有人跟我一樣 跟看音樂劇一樣想要拍手了\n\n\
  --\n\n--\n\n這部電影 我覺得有一部份很成功的地方 是利用鏡頭 或是光影的手法\n\n讓坐在電影院的我們 從聽故事的人 能夠投射進電影中的情境\n\n\
  進而參與主角們的心境轉折及變化 在二刷時尤其有感\n\nMia 跟 Sebs 相遇的片段或場景 就如同電影的幾首主旋律\n\n在導演及工作團隊的剪輯編排下 不停的出現在電影中\n\
  \n卻又給人一次次 不同的感受\n\n季節的更迭 在片中 雖然僅是利用文字呈現 卻也可見到導演的用心\n\n隨著畫面鏡頭移轉而漸漸浮出、緊接著震耳欲聾的警示音\
  \ 忽然驟靜 自一片漆黑中帶出\n\n或是從環境光轉換為特寫光 讓旁白休息 主角自己跳出來說故事\n\n--\n\n--\n\n音樂的編排 不曉得大家的感受如何\n\
  \n但是光是音樂就有太多太多 可以說的了\n\n為什麼大家能在出電影院後 這麼牢牢地記住幾首歌的主旋律\n\n除了深刻的幾個讓人噴淚或印象深刻的鏡頭外 很大的因素是\
  \ 和弦跟音階的編排\n\n大家可以聽聽 Epilogue 找看看有幾首歌的旋律在其中\n\n而在電影中 也是最後 在Seb's酒吧那個令人百感交集的場景的配樂\n\
  \n有些人認為 Sebs 的 City of stars 只是庸俗的流行樂 悖離他所堅持的Pure Jazz\n\n但我認為 這首歌 在片中代表著的 是 兩人之間的關係的\
  \ 誕生、成長、蛻變\n\n從海邊獨唱 房間合唱 到最後一次合唱 用歌詞隨著不停重複著的主旋律 說著兩人的故事\n\n--\n\n--\n\nSebs 是有天分的爵士鋼琴手\
  \ 卻因為自己的堅持 一直被現實環境所困\n\n而能夠讓他有收入的 是派對裡接受點歌  酒吧裡規定的歌單 甚至是聖誕歌\n\n\nMia 從小在 Aunt 的薰陶以及幫助下\
  \ 找到了在片場咖啡廳的工作\n\n也因此 不停的在試鏡 希望有一天能夠完成自己的夢想\n\n\n相遇後 Sebs 一直鼓勵著 Mia 希望她能堅持並完成自己的夢想\n\
  \n而 Mia 也受到 Sebs對爵士音樂的堅持 而認真的寫出了自己的劇本\n\nSebs 卻在互動中 一通Mia與家人的對話 忽然發現了 自己不再是自己一人\n\
  \nCity of stars 不再是只為了我而閃耀  他開始想要認真的維繫這段關係\n\n--\n\n--\n\n現實環境的逼迫下 Sebs 接受了Keith\
  \ 的邀約 成為了樂團的鍵盤手\n\n彈奏著自己曾經叱之以鼻的音樂 開始了巡迴 出唱片 受訪\n\n片中 在Youtube受訪的影片 近百萬的點閱數 是他從未達到的高度\n\
  \n他終於意識到 唯有這樣 才有可能完成自己的夢想 不得不向現實低頭\n\n台下的 Mia 卻迷失了 那個曾經堅持自己理念的 Sebs 去哪了\n\n在那場飯局中\
  \ 兩人的對話之間的衝突 真心讓人糾結\n\nMia 不忍 也不解 為何 Sebs 忽然做出如此大的犧牲或抉擇\n\n而 Sebs 卻把「為了維繫兩人關係的妥協」吞下\
  \ 本來浪漫的晚餐也因爭執而散場\n\n「大家都喜歡、你也喜歡，不是嗎？」 「你什麼時候在乎起觀眾了？」\n\n--\n\n--\n\nMia演出後 從走廊傳來的冷嘲熱諷、零星的觀眾\
  \ 還有那個空著的保留席\n\n打烊後姍姍來遲的 Sebs 成為壓死駱駝的最後一根稻草\n\n\nMia 決定放棄 回到自己真正的家 離開洛杉磯\n\n牆上海報\
  \ 的劇名 卻是 So long Baltimore 此時看起來是多麼的諷刺\n\n而此時劇情卻又讓 Sebs 再度將 Mia 推向夢想 前往試鏡\n\n而且很幸運的是一個敘述自己故事的機會\
  \ 給了她極大的發揮空間\n\n\n在天文台的 那句 Where are we? 點出了兩人的矛盾還有圍繞在現實、夢想與愛情的難題\n\n但此時的兩人卻也只能選擇繼續堅持往夢想前進\n\
  \n--\n\n--\n\n刻意的跳過了五年 讓這一切有些緩衝　故事接著從 當上了演員的　Mia 開始講起\n\n鏡頭選在 Mia的夢想起點 片場咖啡店  接著是\
  \ Mia 的 家庭與小孩\n\n在我們還在錯愕的同時 熟悉的高速公路 塞車 爵士樂  帶我們來到了 Seb's\n\n彈奏著琴的 依舊是那個堅持著爵士樂的 Sebs\n\
  \n台下注視聆聽著的 Mia 卻有著兩個截然不同的表情與心境\n\n從一開始的坐立不安 到兩人的對望 最後的微笑\n\n心碎的劇情安排還有酒吧相遇的爵士片段帶出的許多「如果」\n\
  \n讓前面劇情的堆疊有了意義　兩人目光相接後　低沉的 Welcome to Seb's!\n\nSebs選擇用兩人相遇的歌曲　送給台下的Mia\n\n但最終去仍無法釋懷　沒有把那首歌的最後一個音符彈下\n\
  --\n--\n\n最後要說 這部電影對素材的掌握還有細節真的太厲害了\n\nSebs的喇叭聲  兩人舞蹈的划腳(? Sebs的多次驚嚇動作 高速公路及酒吧的相遇\n\
  \n參觀片場時出現的布景成為片尾(幻想)歌曲的場景  片場咖啡店女星買咖啡的安排\n\nMia老家房間中的巴黎 圖書館前的房子 等等\n\n片中許多場景中「Pure\
  \ Jazz」的歌 很多也是劇中那幾首歌為素材變化\n\n歌曲之間也是 透過相近和弦進行跟音階及主旋律來串接\n\n讓整個音樂行進的步調相當舒服\n\n但是仍然覺得如果片長能再短個10到15分鐘\
  \ 或許會更好\n\n可是同時我又想不出哪裡應該刪減 好矛盾啊！\n\n--\n--\n\n2016/12/30 一刷 回到家的路上 都在想著這部電影的 劇情\
  \ 音樂 場景\n\n一部一部的Youtube影片  PTT上的每一篇的評論  網路上能Google到的影評\n\n甚至讓我又開始彈琴 一遍一遍的聽著原聲帶 抓譜\
  \ 透過彈奏回憶電影\n\n\n2017/01/04 決定二刷 想在下檔前 重新確認幾個忘記的片段\n\n卻又在過程中 發現好多 導演藏在電影中的小細節\n\n\
  這一次也坐到最後 聽完 Humming 版本的 \"City Of Stars\"\n\n\n因為我不久後打算辭去現職 但對於未來的不確定性 還有現實環境的考量\
  \ 多少有些不安\n\n看著La La Land 的同時 跟著兩人追夢 真心希望真的能成功找到自己想要做的事\n\n\n--\n\n--\n\n片尾的 「La\
  \ La Land 拍攝於好萊塢」\n\n導演大聲的告訴大家 好萊塢 還是可以拍出經典的歌舞片的\n\n就像大家所說的 這是一封導演寫給追夢者的情書\n\n就算是不喜歡歌舞片的人\
  \  這部真的值得一看\n\n\n  真心推薦給你\n\n不曉得什麼時候會出DVD讓我收藏...\n\n\n無法寫出像大家這麼厲害的影評\n\n但是還是想記錄一下自己對這部作品的一些想法\
  \  感謝大家的耐心觀看\n\n--\n\n--"
