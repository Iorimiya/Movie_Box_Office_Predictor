url: https://www.ptt.cc/bbs/movie/M.1494468235.A.B4D.html
title: '[普雷] 樂來越愛你 - 佩服導演兩個的地方'
content: '防雷































  這部片讓我剛開始以為


  時間背景是70年代


  直到兩個地方讓我醒來


  一個是女主角iphone響起接電話


  一個是男主角在youtube被採訪


  讓我回到『現實』





  沒錯


  片中只要是談戀愛的部分


  都是夢幻又構圖絢麗的畫面


  這樣的場景必須刻意安排


  根本遙不可及


  而接iphone上youtube如此冰冷


  但這才是真實人生


  電影最後的蝴蝶效應大幻想


  男女主角幸福快樂的完美結局


  畫面更是許多模糊和破碎


  導演沒有交代消失的五年


  男女主角各自的際遇


  但用了許多小細節提醒觀眾回到現實


  這是我第一個佩服的地方





  再來


  兩個人的個性都很自負


  一個覺得自己是爵士奇葩


  一個覺得自己編演俱佳


  兩人都認為自己懷才不遇


  也都鼓勵對方追逐夢想


  而他們也都知道


  想站在夢想頂端


  就必須有所犧牲





  換來的是


  女主角回到昔日打工咖啡店


  被認出來的虛榮


  男主角後來自己開純jazz吧


  高朋滿座


  這就是他們人生一直追逐的『成名』


  如果我是他們


  有機會高飛


  我也不會死守這一段愛情


  兩個人在一起的變數太多


  但追逐夢想的機會錯過可能就沒了


  所以拿掉狗血式為了愛情放棄夢想


  或是兩人成功後在哪相遇舊情復燃


  不拍這種給人美夢的結局


  這是我第二個佩服導演的地方





  為何佩服他我還要給普評


  我雖然覺得導演很棒


  但同樣是歌舞串場現實人生


  電影華麗年代讓我比較入戲



  -----

  Sent from JPTT on my Samsung SM-N9208.


  --'
