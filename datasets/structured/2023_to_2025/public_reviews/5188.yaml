url: https://www.ptt.cc/bbs/movie/M.1483253484.A.EB4.html
title: '[普雷] 樂來越愛你:精彩執行所遮掩不了的膚淺'
content: '這部電影的優點顯而易見，

  燈光、背景等場面調度、歌曲與舞蹈編排到攝影，

  其執行力之強肯定是近年來美國電影中最讓人印象深刻的。

  然而缺點也難以遮掩。


  ◎關於音樂劇


  雖然在進戲院前不知道這是一部音樂劇電影，但其實我對音樂劇沒有偏見。

  但值得注意的是，音樂劇有著相當自成一格的音樂與畫面屬性，

  其辨識度之高給聽眾與觀者的印象都會十分強烈。


  任何號稱搖滾風格或爵士風格的音樂劇，

  聽起來充其量就只是加了點料的、披上其他樂種風格外皮的音樂劇，

  所以當劇本不斷強調男主角是個hardcore爵士樂迷/樂手的時候，

  （事實上，可能還是個風格前衛的free-Jazz樂手）


  反而讓人不禁想問，

  若真的有個像劇中描述的男主角的音樂家來看這部電影的時候，

  聽到劇中男主角唯一自彈自唱超過兩次的那首City of Stars，

  是多麼和爵士樂八竿子打不著關係的時候，

  肯定會感覺到非常出戲吧。


  其實本片導演Damien Chazelle在上一部同樣以爵士樂手為主題的電影，

  進擊的鼓手中也有類似的問題。


  要在電影中顯示一個音樂家很厲害很有水準其實有先天困難，

  除非是拍攝成功音樂家的音樂紀錄片或傳記電影，

  否則要讓人信服劇中人物是個音樂高手，

  總得要透過一些很low的方式來呈現，

  進擊的鼓手的做法就是讓主角鼓打得十分兇狠，

  就跟海上鋼琴師中Tim Roth彈鋼琴彈得很快一樣，

  總讓人感到傻眼。


  也容易讓人覺得：嗯...其實你根本沒多懂音樂吧...。


  ◎關於好萊塢


  2016稍早的另一部電影，Woody Allen的Cafe Society，

  與本片同樣聚焦於身在好萊塢的年輕男女的逐夢與失落、處於現實中的掙扎。

  Cafe Society或許稱不上Woody Allen最好的作品，甚至稱不上是好作品。

  但深諳好萊塢生態和1950s好萊塢黃金年代風格的刻意投射，

  都是Woody Allen能信手捻來的元素，

  即使是掉書袋也能讓同樣喜愛黃金年代風格的觀眾有許多共鳴。


  反觀Damien Chazelle不僅在對爵士符號的運用上相當有限，

  對於好萊塢環境的描寫也顯得左支右絀，既無法讓人體驗懷舊風情，

  也看不到他對21世紀好萊塢年輕表演者的處境有什麼獨到觀察。

  劇情的拖沓跟過長的舞蹈片段（歌曲反而令人驚訝地少），

  就少了空間進行角色深度的建構與環境的刻畫，

  最後又更顯得劇本深度不足。



  雖然看得有點傻眼，不過光從強大的執行力來說，

  樂來越愛你大概還是2016下半年在台灣值得一看的美國電影之一。


  --

  音樂水準的評論是關於導演的上一部電影進擊的鼓手，

  本片主要問題出在風格。

  不用很硬派啊…

  只是讓人覺得很出戲

  這是劇本設定的阿

  不然幹嘛玩funk/soul玩得那麼心不甘情不願'
