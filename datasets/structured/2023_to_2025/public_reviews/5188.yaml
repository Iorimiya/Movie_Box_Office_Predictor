url: https://www.ptt.cc/bbs/movie/M.1476788352.A.96E.html
title: '[新聞] 《樂來越愛你》檔期變更 台美同步上映'
content: '新聞網址：


  在今年各大影展橫掃多獎的音樂愛情電影《樂來越愛你》（La La Land）未演先轟動，吸

  引不少影迷引頸期盼。台灣檔期由原先的12月2日更改為與美國同樣的12月9日，提醒粉絲

  特別留意。


  電影優美旋律及精彩舞蹈令人神怡心醉，俊男美女的高顏值也賞心悅目，男女主角雷恩葛

  斯林和艾瑪史東更異口同聲表示：「這是一部讓你相信夢想、相信愛情的電影。」


  雷恩葛斯林與艾瑪史東從《熟男型不型》中俏皮可愛的小情侶，或是《風雲男人幫》中成

  熟性感的復古情人，都深受影迷喜愛。這一次兩人在《樂來越愛你》中分別飾演在夢想之

  城洛杉磯追尋理想的爵士鋼琴手和無名小演員，從冤家、知己、一路到情人，他們在最失

  意的時候相遇相愛，並在彼此身上找到堅持下去的力量，帶給觀眾既熟悉又新鮮的心動火

  花。


  對此艾瑪特別感謝跟好友雷恩的緣分，她說：「我還記得第一次在《熟男型不型》的試鏡

  與雷恩對戲，馬上就發現我們有很棒的化學作用。我們太了解彼此了，以致於演對手戲時

  最難的就是忍住不笑場。雷恩是個非常貼心的大好人，能跟自己最好的朋友一起唱歌跳舞

  真是有趣極了。」而來自加拿大的雷恩則搞笑表示：「我很喜歡跟艾瑪共事，因為我偷偷

  覺得她也是個加拿大人。」


  電影12月9日在台上映。




  --'
