url: https://www.ptt.cc/bbs/movie/M.1480906751.A.A51.html
title: '[新聞]《樂來越愛你》百人車陣！包下高速公路拍'
content: '新聞網址：


  好萊塢最速配銀幕情侶艾瑪史東（Emma Stone）、雷恩葛斯林（Ryan Gosling）攜手演出

  浪漫愛情歌舞片《樂來越愛你》（La La Land），該片獲選紐約影評人協會最佳影片、橫

  掃廣播影評人協會獎12項提名，也讓艾瑪史東拿下威尼斯影展影后。片中浪漫歌舞精采，

  其中一幕「百人車陣」更讓許多影迷好奇到底是怎麼拍的？


  《樂》片幕幕精采，其中又以電影第一場高速公路百人車陣的歌舞開場最令人歎為觀止。

  一條眺望「塞車之都」洛杉磯天際線的高架公路上，上百名舞者穿梭在五顏六色的車陣中

  唱唱跳跳，近5分鐘毫無中斷宛如翩翩起舞的流暢鏡頭，讓不少人激動表示「第一幕就融化

  了！」、「這到底是怎麼拍的？」


  新銳天才導演達米恩查澤雷（Damien Chazelle）受訪時透露，為了這幕開場舞，劇組破天

  荒包下洛杉磯的高速公路，還封路不只一次！他說：「我們先在攝影棚建造一條假的高速

  公路排練了3個月，接著花了2天時間實地彩排拍攝，當時的氣溫甚至將近40度。而這個關

  鍵的開場也帶出了整部片的精神：在現實生活中，神奇的事情隨時都有可能發生！」《樂

  來越愛你》9日上映。


  --'
