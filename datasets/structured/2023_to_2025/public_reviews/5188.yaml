url: https://www.ptt.cc/bbs/movie/M.1478312292.A.7E5.html
title: '[新聞]【樂來越愛你】飛天談情  艾瑪史東有練過'
content: '新聞網址：



  艾瑪史東（Emma Stone）與演技男神雷恩葛斯林（Ryan Gosling）主演的年度浪漫鉅獻《

  樂來越愛你》（La La Land），即將於12月9日台美同步上映。兩人這次在《進擊的鼓手

  》（Whiplash）導演達米恩查澤雷（Damien Chazelle）別出心裁的音樂愛情電影中，以

  各種想像不到的夢幻方式狂放閃，但這段甜蜜戀曲談起來卻一點也不輕鬆，因為他們除了

  展現歌喉舞技外，竟然還得賣命吊鋼絲！


  原來導演為了呈現男女主角墜入情網的魔幻瞬間，特別設計將這對銀幕情侶送上雲端的橋

  段，艾瑪史東回想起拍攝過程時則幽默表示：「我對吊鋼絲真是又愛又恨，但我拍過兩部

  蜘蛛人所以身手還算不錯，至少比雷恩資深。」


  電影《樂來越愛你》描述兩個懷抱理想的追夢人相遇相愛的故事，野心勃勃的新銳導演達

  米恩查澤雷，則在簡單動人的情節中穿插繽紛優美的歌舞，不僅要求男女主角所有表演親

  自上陣，甚至還挑戰一鏡到底的拍攝手法，挑戰演技同時也考驗才華。當劇本輾轉來到艾

  瑪史東手上的時候，她正好剛經歷過《鳥人》（Birdman）不間斷的瘋狂拍攝，並開始準

  備百老匯音樂劇《歌廳》（Cabaret）的演出，讓心動又害怕的艾瑪最後決定接下這部電

  影，她說：「拍這部電影需要很大的勇氣，但這個故事太美了，我光是讀劇本就掉淚，而

  且它來的時機正好，所以我決定鼓起勇氣試看看。」而她在《樂來越愛你》中全方位的精

  湛演出也獲得威尼斯影后肯定。電影12月9日在台上映。




  --'
