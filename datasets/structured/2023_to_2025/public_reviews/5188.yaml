url: https://www.ptt.cc/bbs/movie/M.1500636782.A.425.html
title: '[新聞] 諾蘭透露自己三刷了《樂來越愛你》'
content: "新聞網址：\n\n文/ Sebox\n\n近期推出新片《敦克爾克大行動》（Dunkirk）的導演克里斯多福諾蘭（Christopher Nolan），再度以驚人優異的電影作品，在爛番茄上拿下了\
  \ 96% 的新鮮度，99% 的期待值，在 IMDB 網站上也拿下了 9.6/10 的高分，加上先前釋出的首波評價幾乎一面倒地大讚，實在是讓台灣的觀眾等不及要進電影院體驗一下\
  \ IMAX 的影音震撼啦！不過諾蘭除了要拍電影以外，年紀漸漸增長又加上要陪伴小孩與家人，讓他上電影院的次數越來越少，不過日前在與EW的訪談中，他提到他自己進電影院看了三次《樂來越愛你》（La\
  \ La Land）。\n\n「我發現從小到大有一件事情改變了，那就是對於一個老人家來說…我快要 47 歲了，很難有機會讓我重新到電影院再看一次同樣的電影，而且只是因為我非常享受在電影院裡面觀賞這部作品，《樂來越愛你》就是一部這樣的電影，讓我重複到電影院看了幾次。」\n\
  \n諾蘭在訪談中提到他非常享受在電影剛上映時，跟著擁擠的觀眾一起到電影院裡面，期待著大銀幕上面會有什麼樣未知的可能性，而這也是他一直非常享受電影的原因，那個體驗對他來說如同魔法一般。諾蘭也提到究竟為什麼他會回到電影院裡面再看幾次《樂來越愛你》，他給出了一個相當有趣的答案。\n\
  \n「為什麼我又回去看？我想最主要是想要知道，這部電影是不是跟我想的一樣棒，結果證明它就是跟我想的一樣棒，希望有回答到你的問題。」\n\n好的，即便《樂來越愛你》沒有拿下奧斯卡最佳影片獎，受到諾蘭的讚賞相信會讓導演達米恩查澤雷（Damien\
  \ Chazelle）相當高興！而《敦克爾克大行動》將於 2017 年 7 月 21 日（本週五）上映，讓我們期待一下電影是不是跟我們想的一樣棒吧！\n\n\n\
  原文：\n\n--\n175.182.90.15\n\n 07/21 19:36"
