title: '[討論] 樂來越愛你 致敬之經典在華人世界上映軼事'
content: "電影時光機／「樂來越愛你」原來向這些經典片致敬....\n\n\n\n--\n\n本屆奧斯卡金像獎壓軸的最佳影片大獎頒發出現大烏龍，\n獲 14\
  \ 項提名的「樂來越愛你」意外痛失最大獎，\n無法成為繼「芝加哥」奪冠 14 年後第一部拿下奧斯卡最佳影片的歌舞電影。\n\n其實，台灣觀眾比較無法投入的歌舞片型，極難獲得奧斯卡的青睞，\n\
  89 屆來只有 10 部曾奪得最佳影片獎，10 部之中又有一半是根據百老匯名歌舞劇改編，\n類似「樂來越愛你」這種原創歌舞電影上一次拿下奧斯卡最大獎，\n已經要回溯至\
  \ 58 年前的「金粉世界」，所以「樂來越愛你」若能抱得大獎，\n將會意義非凡，不過大多數美國影藝學院會員顯然仍無法跨過心中對歌舞片的障礙。\n\n「樂來越愛你」充滿對歐美經典老片的致意與懷念，已經很多文章剖析過，\n\
  在此重點會擺在片中被點名、致敬的老片，到底在華人區曾引起過如何的迴響？\n\n--\n\n除了男女主角在老戲院欣賞的詹姆斯狄恩「養子不教誰之過」外，女主角另外對男主角\n\
  提過曾和阿姨一起看過幾部老片，包括希區考克執導、由卡萊葛倫和英格麗褒曼主演的\n懸疑奇情大片「美人計」，此片在北美上映反應極熱烈，成為當年最賣座的十大影片之一。\n\
  \n以及另外一部同樣由卡萊葛倫主演，女主角是演技派影后凱薩琳赫本的黑白老片，\n這部片把向來走知性、性格路線的凱薩琳改造成任性、衝動的千金，\n看上了看似拘謹又笨拙的古生物學家卡萊，演出一連串荒唐突梯的笑料。\n\
  \n美國上映時，各地反應不一，在舊金山熱賣，洛杉磯、丹佛、辛辛那提、波特蘭、華盛頓\n等地也都賣座不錯，然而在紐約以及美國中西部大都賣垮，因此在一般的評斷中，\n\
  票房算是踢到鐵板，讓本來已經被貼上「票房毒藥」標籤的凱薩琳，行情更是雪上加霜。\n\n這部片的英文原名是「Bringing Up Baby」，\n目前一般華文資料多半採用一個不知從何而來、接近直譯的片名「育嬰奇譚」，\n\
  真是大錯特錯，因為片名中的 baby，並不是嬰兒，而是一隻女主角的哥哥寄回老家的豹，\n所以除了裡面的人類大擺烏龍，連動物都在這一團混亂中插了一腳。\n\n此片其實在華人區的上海與香港都曾上映過，在香港於民國\
  \ 27 年 7 月放映時，\n片名叫「小豹媒人」，把男女主角之間因為動物攪和進來產生的奇妙緣分簡單扼要\n表現出來，遠比狗屁不通的「育嬰奇譚」合理許多。\n\n\
  一般約定俗成，外國影片在華人區上映時使用的第一個片名即為日後正式的中文片名，\n民國時期的上海是絕大多數歐美影片來華人區放映的第一站，\n照理應用上海放映的片名為準。\n\
  \n偏偏這部片在上海上映也是民國 27 年，那時上海最大、最重要的「申報」已經為\n避中日戰火轉到漢口與香港出報，直到 27 年的雙十節才又在上海復刊，\n這段遠離上海的期間曾在上海放映的影片資料幾乎都已難查得，\n\
  然而這段期間仍有一些名片來到上海，其中就涵蓋了迪士尼的「白雪公主」，\n是迪士尼動畫長片首度在上海放映，若非「白雪公主」盛況空前、當年的宣材還有保留\n下來，今天恐怕也很難得知究竟是啥情形。\n\
  \n「Bringing Up Baby」的轟動程度與「白雪公主」天差地遠，本來應該是無跡可尋，\n「申報」卻在民國 27 年 11 月刊出了一篇影評，終於解開謎底。\n\
  \n原來凱薩琳赫本與卡萊葛倫接下來再合作的一部片「多情大姨」來上海上映，影評人提到\n兩人之前曾經合作一部片叫「春閨風韻」，裡面凱薩琳輕佻活潑，卡萊則迂緩呆木，\n\
  角色又是一個動物學教授，很明顯「春閨風韻」就是「Bringing Up Baby」。\n\n雖然「春閨風韻」在美國首度上片賣座失利，重映後影評人對片子的好評增加，\n\
  觀眾亦逐漸回流，開始慢慢回收，到現在已被視為瘋狂喜劇的經典之作，\n再也不是隨隨便便的賠錢貨，也才會在 21 世紀仍然被「樂來越愛你」提及。\n\n很可惜，「春閨風韻」在台灣從來不曾重映，\n\
  無怪乎這個中文片名消失在人們的記憶中，導致錯誤資訊滿天飛。\n\n--\n\n而「樂來越愛你」幻想中的美好結局呈現的巴黎場景與服裝風格，被認為是向曾獲奧斯卡\n\
  最佳影片的「花都舞影」致敬，這部片是舞王金凱利的經典名作之一，片尾長達 17 分鐘\n的幻想之舞尤其令人津津樂道。\n\n「花都舞影」來到華人區時，大陸已因政治情勢不再放映好萊塢的商業片，\n\
  香港這次跑在台灣前面，已經取名為「花都艷舞」，也有不錯的賣座反應。\n\n台灣原本也要沿用，卻不知何故在正式上映時改成了「花都舞影」，\n由於勇奪奧斯卡多項大獎的號召，觀眾相當捧場，賣座頗佳。\n\
  \n片商於是乘勝追擊，火速再引進了同樣由金凱利主演的另一部更好評歌舞片「萬花嬉春」\n，雖然在北美上映時，賣座不如「花都舞影」，奧斯卡更只入圍了最佳女配角與原配樂\n\
  兩項獎，還都摃龜，現在卻已被公認是好萊塢影史上最佳歌舞電影，\n金凱利在雨中歡唱跳舞的場面更成經典。\n\n在台灣上映時，「萬花嬉春」的反應也不及「花都舞影」，未能再創歌舞片的高潮。\n\
  \n--\n\n\n\n翻攝自民國 41 年中央日報\n\n\n翻攝自民國 27 年申報\n\n--\n\n心得：\n\n原來還有這些上映與片名翻譯的軼事。\n\
  今年金馬奇幻影展有放映《萬花嬉春》、《花都舞影》哦～\n\n--\n   \n   ◥\n  \n \n  \n￣￣￣￣\n\n--"
