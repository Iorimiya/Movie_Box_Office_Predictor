url: https://www.ptt.cc/bbs/movie/M.1481262141.A.AA3.html
title: '[好雷] 樂來越愛你'
content: "這是一部音樂劇，但是跟一般的音樂劇不太一樣(如芝加哥.媽媽咪呀之類的)\n\n所以建議不要抱著要看很精彩的歌舞秀心情去看\n\n因為我認為它的劇情元素大於音樂(歌舞)元素\n\
  \n當然音樂幫這部片加了不少分，配樂非常好聽\n\n畫面很美...我非常佩服這部電影的運鏡及美術設計\n\n\n\n\n\n故事線很簡單 就是兩個追求自己夢想卻到處碰壁的人相遇\
  \ 相愛的故事\n\n我很喜歡國外一些人的心得再講這不只是一部愛情故事\n\n而是一個講述熱忱.熱情.夢想的故事\n\n導演自己導這部電影曾說過:\n\n這是一部寫給好萊塢的情書\n\
  \n    一部寫給藝術的情書\n\n    一部寫給(對藝術.夢想)熱情.熱忱的情書\n\n他緬懷那些已經即將被世人遺忘的藝術(爵士樂.好萊塢歌舞)\n\n\
  並將之重現給觀眾\n\n我覺得Sebastian就是導演內心的投射，導演對爵士樂的熱情與喜愛\n\n卻也知道這是一門逐漸被世人淡忘的藝術，所以他拍了這些電影\n\
  \n想呈現給觀眾爵士樂的魅力...就像Sebastian想開一家專門演奏爵士樂的CLUB一樣\n\n同樣的熱情在Mia身上也看的見 他在最後的試鏡講述他對詩歌.戲劇.藝術的熱忱\n\
  \n這正是他在整整六年跌跌撞撞卻一而再再而三的爬起來 參加各種試鏡\n\n許多的藝術家都在這塊夢想之地打拼 然而卻只有極少數人得以展露光芒\n\n導演曾經說過:他認為這是洛杉磯頗具詩意的地方\n\
  \n而讓這群藝術家堅持的原因 無非就是對藝術的熱忱了吧\n\n\n這部我覺得很好看，EMMA STONE演技真的進步非常多.......\n\n而結局所帶出來的\"\
  遺憾\"我想....是導演想為這部電影添加一點詩意\n\n畢竟追求夢想的過程總是甜美又苦澀\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n--"
