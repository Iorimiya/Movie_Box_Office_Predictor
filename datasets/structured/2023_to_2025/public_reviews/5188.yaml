title: '[請益] 樂來越愛你女主角房間海報(無雷)'
content: '剛看完《樂來越愛你》，裡面其實有很多懷舊的彩蛋。


  最明顯的就是男女主角去看電影，播了一小段《養子不教誰之過》的畫面，


  還有雙人舞是致敬《萬花嬉春》，


  男女主角在華納片廠散步，經過的那些電影海報看板都好眼熟，


  不知道有沒有神人逐一整理彩蛋？真的好想知道...



  最想請問的就是，女主角艾瑪史東的房間，有面牆貼了一個女明星海報，


  有人知道這位女明星是誰嗎？


  看了好眼熟，卻想不起來...




  --'
