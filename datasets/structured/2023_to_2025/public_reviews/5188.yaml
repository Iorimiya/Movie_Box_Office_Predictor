url: https://www.ptt.cc/bbs/movie/M.1528306634.A.C6F.html
title: '[情報] 萊恩葛斯林主演《樂來越愛你》導演執導阿姆斯壯傳記電影劇照'
content: '《進擊的鼓手》和《樂來越愛你》導演 Damien Chazelle 新作《First Man》公開首批劇

  照啦！


  熱愛爵士的導演這次跳脫了音樂的主題，挑戰拍攝一部傳記電影，而電影主角則是「登上

  月球的第一人」阿姆斯壯。


  《First Man》由《驚爆焦點》和《郵報：密戰》的編劇 Josh Singer 改編自阿姆斯壯的

  傳記著作《First Man: The Life Of Neil A. Armstrong》。


  這次 Damien Chazelle 再次和《樂來越愛你》的男主角 Ryan Gosling 合作，由他飾演阿

  姆斯壯本人，並由《王冠》的視后 Claire Foy 飾演他的妻子。


  先前在導演受訪的時候就有說到這並不是一部以文戲為主的普通傳記電影，而是一部充滿

  動作戲的「任務電影」，會讓觀眾的情緒非常高昂以及緊張。


  這次在訪談導演也說到他和 Ryan Gosling 在《樂來越愛你》合作前的第一次碰面就是要

  讓他來飾演阿姆斯壯，這對導演來說是夢想的不二人選。


  《First Man》由環球發行，目前台灣暫定 10 月 12 日上映，但這部電影勢必會推去奧斯

  卡，口碑成功的話應該很可能被推到明年上映。而這部電影應該也有相當高的機率在威尼

  斯首映。


  此外這部電影有部分的畫面使用 70mm IMAX 規格拍攝，屆時也會有 IMAX 的放映版本。多

  數鏡頭則是用 35mm 膠卷拍攝。








  --'
