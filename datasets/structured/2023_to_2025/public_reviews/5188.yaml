title: '[新聞] 《樂來越愛你》悠揚音符聽不膩'
content: '新聞網址：


  音樂愛情電影《樂來越愛你》由雷恩葛斯林（Ryan Gosling）和艾瑪史東（Emma Stone）

  主演，雷恩表示為戲籌備的３個月中，歌、舞和鋼琴課表全滿，劇組所有人都竭盡所能挑

  戰極限，只為拍出滿意的作品，成果不負眾望，在美國宣傳放映時，連金獎影帝湯姆漢克

  （Tom Hanks）都用「感謝上帝」一詞讚嘆，休傑克曼（Hugh Jackman）前日看完馬上在臉

  書寫：「從頭到尾都棒透了！艾瑪和雷恩做得好！」


  片中歌曲也令人難忘，配樂由《進擊的鼓手》作曲家賈斯汀赫維茲（Justin Hurwitz）包

  辦、東尼獎提名百老匯作曲雙人組（Pasek and Paul）填詞，即使雷恩連續３個月每天練

  習這些樂曲４小時，「照理上來說應該會膩的，但每次聽到還是會被感動。」艾瑪則說：

  「賈斯汀創作的音樂如此美妙，是人們會永遠記得、琅琅上口的旋律。」12月９日台美同

  步上映、電影原聲帶同日由環球音樂發行。


  --'
