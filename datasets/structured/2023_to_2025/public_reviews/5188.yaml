title: '[好雷]樂來越愛你 為了夢想、得做出犧牲 '
content: "圖文網址:\n\n【La La Land】\n\n上映時間：2016/12/09   導演：Damien Chazelle\n\n觀看時間：2017/01/09\n\
  \n　　【樂來越愛你】，上映前就還算有興趣，但一直找不到人看，看到拿下金球獎七項大\n\n獎後立刻衝戲院看了。看完的感想：獲得最佳影片(音樂及喜劇類)真是實至名歸啊！！\n\
  \n\n\n　寫這篇影評時才知道是【進擊的鼓手】導演的作品，【進擊的鼓手】的劇情非常的真\n\n實，追求卓越時所面臨的現實問題，看完讓有類似經驗的我相當感動。雖然【樂來越愛你\n\
  \n】是一段愛情故事，但上述的優點通通都保留下來，我看完依舊頗感動的。\n\n　　很多人說這部片不論是劇情、舞蹈、歌曲都有濃濃的復古風，我是1993年次的比較沒\n\
  \n這麼有感觸，電影給我的感覺就像小時候的迪士尼電影，只是劇情現實了不少，演一演所\n\n有人會突然開始唱歌，很多劇情都利用歌曲帶過。\n\n 　　聊聊這部電影我最喜歡的劇情吧，男主角Ryan\
  \ Gosling夢想開一間爵士餐廳，女主\n\n角Emma Stone夢想成為女演員，雖然男女主角都擁有天賦與實力，但他們沒有錢，沒有遇\n\n到伯樂。兩人因為愛而在一起，而兩人都在追夢時都遭遇了挫折與迷失；Ryan\
  \ Gosling放\n\n棄了自己對音樂的堅持而迷失，Emma Stone歷經了無數的失敗後也迷茫，但相愛的兩人都\n\n在關鍵時刻幫助對方，不論是藉由吵架還是去別人家門口堵人，兩人都在最後拉了彼此一\n\
  \n把，兩人之間的愛就以這真實的樣子呈現出來。\n\n　　一般的愛情電影在兩人和好後就結束了，「追逐夢想，得做出犧牲」就是這部電影的\n\n核心價值，當夢想與愛情只能擇一時，你會怎麼做？接下來我要討論結局，有大雷，如果\n\
  \n不想被雷的話請跳過接下來這段：\n\n\n(防雷、警告:下一段有結局大雷請注意)\n\n\n\n\n\n\n\n\n　　在最後的幻想中，Ryan Gosling陪著Emma\
  \ Stone去法國，最後兩人結婚生子，所有事\n\n情都很美滿，但真的是這樣嗎？女演員的夢成真了，但爵士餐廳的夢呢？這段幻想看似完\n\n美但在我看來並不完美。在現實中，男女主角都達成了夢想，但犧牲了彼此的愛情。電影\n\
  \n中不論男女主角怎麼做，結局都不會完美，一定有得犧牲，這就是這部電影讓我很愛的地\n\n方，很真實，世界是殘酷的，在追隨夢想的過程中現實會不斷的打擊你，但你就是要在這\n\
  \n樣的打擊下勇往直前，並不斷地做出取捨。我個人真的很喜歡這種「完美中的不完美」的\n\n結局，這段結局真的讓我超級加分。\n\n\n\n\n(防雷結束)\n\n\
  \n　　節奏上，電影前半段就是愛情故事，我平常比較沒看愛情電影，所以電影演到一半時\n\n我覺得節奏有那麼點緩慢，但很棒的音樂跟夢幻的畫面讓我很享受地渡過這一段。而說到\n\
  \n這部片，就不能不提本片的音樂，本片的配樂、歌曲真的很棒，完美地融入劇情，歌詞充\n\n分地展現了角色當下的心境。電影演到試鏡時的那首歌讓我回想起兩人一路上的際遇，完\n\
  \n完全全是整部電影的寫照，我看一看都有點泛淚了。\n\n　　\n　　最後做個總結：很有心的劇情編排、超棒的音樂、有質量的劇情、以及深刻的結局讓\n\n整部片在最後超級加分，真的是2016年最好看的電影\n\
  \n\n\n【樂來越愛你】：非常推薦、BD/DVD必收\n\n\n\n後記：\n\n1.進擊的鼓手JK SIMMONS客串出場時讓我笑了一下\n\n2.一直覺的本片很像加長版的【曼哈頓練習曲】\n\
  \n3.進擊的鼓手影評:\n\n\n\n\n\n\n--\n\n荒野遊俠電影部落格:\n\n--"
