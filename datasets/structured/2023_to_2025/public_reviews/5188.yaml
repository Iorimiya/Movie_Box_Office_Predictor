url: https://www.ptt.cc/bbs/movie/M.1481870724.A.DB1.html
title: '[好雷] 踏上追夢的道路—樂來越愛你La La Land'
content: '本心得文有雷






  未看慎入








  ***




  達米恩查澤雷，前幾年憑《進擊的鼓手》受到極大矚目的年輕導演，這次拍出了風格鮮明

  的《樂來越愛你》。與《進擊的鼓手》一樣，在上映之前就受許多媒體的推崇，可以說是

  頗為強勢的文藝片（在台灣可以說是文青必看的文青片）。


  當年在許多朋友的好評聲影響下看了《進擊的鼓手》，雖然覺得電影節奏掌握得機好，卻

  在最核心的部分，讓我覺得有點隔，終究沒能打動我，因此對口碑極佳的《樂來越愛你》

  還抱持著一點點保留心態。結果這一部復古好萊塢歌舞片的電影，從形式到內容都深得

  我心。


  《樂來越愛你》一面是愛情故事，另一面是追逐夢想的故事。劇情簡單直白，卻將愛情與

  夢想兩個面向都做好做滿；形式十分吸睛，卻沒有喧賓奪主。四季變化配合著主弦律變奏

  ，帶出兩個角色的心境變化；一首首動人歌曲，則塑造出令人嚮往的洛杉磯風情。


  作為一部愛情電影，《樂來越愛你》講的是一對彼此適合且相愛的男女，在生命中的關鍵

  時刻相遇，默默影響對方，又為了各自的夢想往不同的方向前進。他們的愛情，意義不在

  於童話般幸福美滿的結局，而在於成為彼此的動力和幫助，讓他們有勇氣踏上追逐夢想的

  道路。


  作為一部追夢的電影，《樂來越愛你》講的是我們與夢想之間需要的橋樑，也許是原不在

  我們計劃之內的東西，需要有那麼一個了解認同你的伙伴同行，推你一把、讓你看見原來

  沒看見的東西。你不是完美的人，你的伙伴也不是，但同行使你們沾染對方的氣質、戴上

  對方的眼睛，而擁有自己沒有的那份力量。


  多年之後再回頭看，如果當初沒有相遇，你不會是現在的你，我也不會是現在的我。這是

  這分愛情最美的部分，也是這個故事打動我的部分。


  導演查澤雷將這個完全現代的故事，以復古情懷包裝，既如片名是「寫洛杉磯的情書」，

  又如艾瑪史東在最後一場面試獨唱的歌，要獻給「所有追夢的傻瓜」。或許不是每個人

  都有像電影主角那樣的機運，開啟夢想的大門，但透過這樣一部電影，作為觀眾的我們也

  可以享受追夢的那些甜蜜苦澀。



  --


  這裡是我的樂園:







  --'
