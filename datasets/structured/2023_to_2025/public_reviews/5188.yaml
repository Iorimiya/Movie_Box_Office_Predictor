url: https://www.ptt.cc/bbs/movie/M.1483368610.A.444.html
title: '[好雷] 樂來越愛你'
content: "因為擁有許多樂手朋友的緣故，早已期待這部非常久了，當然男主角Ryan Gosling與女主\n角Emma Stone也是將其列入必看片單的原因之一。而導演的上一部作品《Whiplash\n\
  進擊的鼓手》也在我的All time list之列，自然說什麼也得朝聖一下。與樂手同行觀看，\n也讓我對這部作品有更多感觸，甚至可以直言是2016我所看過最好看的電影。\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n開場的第一幕馬上驚豔全場，那樣的排場讓人想到《Grease火爆浪子》等經典歌舞片，而\n\
  偽一鏡到底的運鏡方式則讓人想到《Birdman鳥人》。看似純粹開場的歌舞場面卻同\n時鋪陳了最後一場Mia與先生塞車的戲 (洛杉磯的塞車「盛況」)與介紹男女主角相遇過程\n\
  與正式出場。於此同時，觀眾的思緒也在片名出現在銀幕上之時被帶進電影當中，準備開\n啟這場爵士奇幻之旅。\n\n\n既然是歌舞片，原聲帶中的配樂與歌曲當然是非常好聽的，尤其是令所有看過的人都念念\n\
  不忘、每聽必心碎的「City of Stars」。不過，更令我椎心的卻是Sebastian所彈的聖誕\n歌。其一是「不得不向現實低頭」的事實，因為Sebastian是極有實力卻不得志的爵士鋼\n\
  琴手，雖然夢想開一間爵士酒吧，卻只能在節慶時彈奏節慶歌曲而非名家作品或個人創作\n。身邊樂手朋友正好有遇到低潮者，看完這一幕，當聖誕節他必須演奏聖誕歌時，那種心\n\
  疼完全讓我想二刷去再次體會Sebastian在片中的心境。\n\n\n其二是爵士的「即興」特性。「即興」是爵士一向非常重要的特性，即使同樣的曲子，在\n不同的編制與不同的樂手演奏之下，可能呈現截然不同的面貌，尤其是各樂手的solo部分\n\
  。但「照樂譜彈奏聖誕歌」這件事，本質上扼殺了這項極富創作力的特性。雖然爵士樂手\n大可在彈奏聖誕歌的同時加入自己的改編，但片中的Sebastian擺明被要求不要加入任何\n\
  個人色彩，而最終也在他依然故我彈了一首自創曲之後遭到開除。\n\n\n夢想與現實；麵包與愛情，真的難兩全。Sebastian想開爵士酒吧，同時也想成名、發揚\n\
  爵士，但在過去好友Keith的邀約下，走紅之後，不只他自己，連Mia也看出那樣的生活與\n樂風並不是他過去心所嚮往的。Sebastian一氣之下回Mia「你是演員」，沒錯，Mia的夢\n\
  想是必得走紅，但Sebastian卻不必要，因此還沒獲得伯樂青睞的Mia自然希望他忠於內心\n，但現實的經濟壓得兩人喘不過去，而造成了那樣的選擇。在Mia獲得大好演出機會之後\n\
  ，看似兩人都是事業飛黃騰達，但愛情卻走不下去。五年後，酒吧的相遇，雖然代表著兩\n人都達到當初約定的夢想，但卻無法陪在彼此身邊，剩下的只有那令人心痛的對望。\n\
  \n\n兩人剛認識不久時，Mia曾對Sebastian說：「我不喜歡爵士」當時引得Sebastian勃然大\n怒。其實，當時我是有會心一笑的。邀約朋友去欣賞音樂表演時，流行搖滾總是非常容易\n\
  ，但當說出表演的類型是「爵士」時，經常會獲得這樣的答案。但如同Sebastian所說：\n「Jazz is exciting!」片中他也提到Kenny G，並不是說他的作品不好，而是因為許多人\n\
  對爵士會有這樣的偏見與誤解，Kenny G的風格是屬於「輕爵士」，但並不是所有的爵士\n樂都是那樣子的。作為一個還算常聽爵士的樂迷來說，很開心導演對爵士電影的用心，雖\n\
  然也有樂手朋友認為《樂來越愛你》的音樂性不足，但對於一般大眾來說，這樣已經能夠\n達到很棒的效果了。\n\n\n而與樂手同行，肯定會獲得獨到的見解，並且有與常人不同的眼光是絕對沒錯的。雖然事\n\
  後想想，這其實與一般看完電影後，發現知名演員客串而詢問的閒聊無異，但當對方說出\n「唱John Legend歌的那個是他本人嗎？聲音很像，不知道是不是。」還是只能掉下下巴\n\
  ，佩服不已。不過，術業有專攻 (亂用詞語)，本來就有看完片尾字幕 (credit) 習慣的\n我正巧瞄到此時出現的演員名單，確認的確是John Legend沒錯。這樣的驚喜與看《Billy\n\
  \ Lynn's Long Halftime Walk比利林恩的中場戰事時在片尾字幕發現J.J Watt一樣令人喜\n悅。\n\n\n最後，來談談《樂來越愛你》身為音樂劇的加分之處。兩人合唱City\
  \ of Stars時，飛到\n空中共舞的奇幻橋段與Mia試鏡時全然忘我而帶領觀眾進入想像之中，都為這些段落的聽\n覺饗宴加上很棒的視覺刺激。而讓音樂劇迷們崇拜的自然是片中許多的致敬了。但對經典\n\
  歌舞劇涉獵不夠多的我，其實也只看得出《Singin' in the Rain萬花嬉春》的致敬而已\n，甚至還沒看過該片，真是有點慚愧。如果做好功課再二刷《樂來越愛你》的話，想必會\n\
  有更多的體會的。\n\n\n總而言之，不管是從劇情深度面向或音樂面向來說，《樂來越愛你》都絕對是2016最棒的\n電影之一，而且值得二刷的理由太多了。可惜適逢獎季，顧忌荷包之餘，可能只能聽原聲\n\
  帶回味了。\n\n--\nViola's World：Screen Scream影迷尖叫屋\n\n請大家多多指教~\n\n--"
