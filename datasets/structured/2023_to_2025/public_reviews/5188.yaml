url: https://www.ptt.cc/bbs/movie/M.1481529256.A.DCA.html
title: '[ 好雷] la la land 樂來越愛你，擊中我心！'
content: '樂來越愛你 la la land (2016美國電影)






  當初看到預告片時，並沒吸引到我，且得知是音樂歌舞片類型，不是我中意的菜色，但挺

  欣賞男女主角Ryan Gosling和Emma Stone,  加上本片得了許多影展大獎，好奇心驅使去

  看了這片。


  劇情十分通俗，搭配歌舞場景，穿插魔幻寫實的畫面，音樂旋律和故事相得益彰，

  男女主角的精湛演出，緊緊抓住我的眼球，


  不知是什麼明確理由，片中一些畫面？音樂？情節？深深感染我，令我感到有幸看此佳片

  喜極而泣？或令我觸動内心某區塊而感動落淚？或男女主角遭遇容易代入個人生活經驗而

  被牽引感動？……總之淡淡悲喜感的莫名默默地流淚，是舒爽的感受。


  故事分冬、春、夏、冬、五年後的冬天的片段, 敍說一個男女主角追夢及愛情的動人故事

  ，收尾的想像畫面懷舊唯美，男女主角的兩眼深情對望……故事浪漫又淡淡悲喜交雜的氛

  圍，餘韻繞梁，令我看地十分滿足！


  最後看到戲院只剩我一人，整片黑白字幕完全結束，才離座，只為專注聆聽片尾一曲曲悦

  耳動聽的音樂旋律而駐足，回味無窮……


  這片擊中我的心，深深感到太好聽太好看了，一道不入眼的菜吃下後，出乎意料地對味，

  美味極了！


  我不是爵士樂的樂迷，但和片中女主角類似，看完本片，對片中的一些音樂、爵士樂旋律

  ，沈醉其中了……


  這片的觀影經驗，令我留下美妙的回憶，太久沒看文藝片了，看到這文藝佳片，實在有幸

  福感！^_^


  --'
