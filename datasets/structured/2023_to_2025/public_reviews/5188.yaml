title: '[好雷] 《樂來越愛你》 - 南加州從不下雨'
content: "◎《樂來越愛你》(La La Land) - 南加州從不下雨\n\n圖文完整版： \n\n《樂來越愛你》是個美麗的非童話故事。它有《秋水伊人》與《花都舞影》\n\
  的影子，有《萬花嬉春》裡金凱利拉著路燈跳舞的經典畫面重現，有《北非\n諜影》的窗戶，有許多與《養子不教誰之過》的關連，以及佔了臥室一整面\n牆的英格麗褒曼，但在這些懷舊氣息之外，還有許多新意與現代感。\n\
  \n故事發生在別名為\"La La Land\"的洛杉磯，Mia（艾瑪史東）想成為女演員\n，但目前只能在華納片廠裡的咖啡店當店員。Sebastian（雷恩葛斯林）是\n\
  熱愛爵士的樂手，但為了生活，只能彈奏一些他沒興趣的音樂。在幾次意外\n相遇之後，兩人陷入愛河，但他們對夢想的追尋，卻考驗著感情。\n\n從一開始的精彩歌舞片段之後，本片就以小細節突顯這兩人多在意自己的事\n\
  業與夢想：Mia開車時因為練台詞而沒發現前車已經開走，Seb因為不想只彈\n耶誕歌曲而被酒吧老闆炒魷魚。Mia為了能得到演出機會，願意嘗試各種角\n色與片型的試鏡，也一再忍耐各種羞辱。Sebastian則猶如《醉鄉民謠》的\n\
  主角與本片導演前一部作品《進擊的鼓手》裡的老師，對音樂有很多堅持，\n很難妥協，但這樣的態度，反而讓他被迫接受一些更不符合他喜好的工作內\n容。\n\n什麼情況叫做出賣自己？什麼情形又叫做追求突破？這不是那麼容易分的。\n\
  Seb比較「實際」的朋友Keith（John Legend飾演）或許看起來像出賣了理\n想，但其理由並非全無道理，如果Seb只堅持演奏他心中認可的爵士，恐怕\n\
  連溫飽都有問題，其他夢想又要如何實現呢？Seb在鋼琴酒吧被炒魷魚前的\n那段戲，他彈著鋼琴，倒影映照在小費筒上，這是多麼有趣而諷刺的意境，\n藝術的堅持背後，是無盡的辛酸與掙扎哪。\n\
  \n追尋美麗夢想的過程，充滿了窩囊與醜陋。Mia在一場受盡羞辱的簡短試鏡\n後，出來見到的是一群群作相同打扮的女演員，彷彿製片隨便找一個演都行\n，自己又有何特出之處？Seb在妹妹來訪時，面對她的嘲弄，自嘲地說他不\n\
  是被生活擊倒，而是自願靠著拳擊場邊休息，等生活痛扁他扁到沒力，他才\n要反擊。在電影開頭的加州高速公路上，一群抱著夢想的人塞車塞到煩了，\n穿著短袖衣褲與洋裝的大夥兒，在艷陽天下車唱跳一段精彩歌舞，結束時電\n\
  影才打出大大的「冬天」字樣，阿哈，原來這是洛杉磯這個La La Land的寒\n冬呢。在夢想國度何來冬天？那些寒冷與狼狽，當然是藏在外表之下、舞台\n之下、藝術之下、各種美夢與幻想之下。這讓我想起一首英文歌\"\
  It Never\nRains In Southern California\"，歌詞大意可簡化為：「是呀，人家都說\n南加州從來不下雨，但你猜怎麼著，那些人沒警告我，當南加州一下雨就是\n\
  傾盆。傾！盆！大！雨！呀！」\n\n真正的「為藝術犧牲」可不是指脫衣服露三點，而是在藝術之下，個人的一\n切基本需求都被擠到後頭，像是把自己做成了標本，為了成就讓別人見到的\n\
  美，犧牲了一切。\n\n就連藝術中最常被頌讚的「愛情」，當然也是要被擠到後頭的。想要全心奉\n獻於藝術與夢想之中，就難以兼顧其他世俗之事。兩個很有事業心的人，適\n\
  合共組家庭嗎？有難度。那樣的人，需要伴侶能杵在家裡，等他，配合他，\n否則大概連見面都別想了。我想起《進擊的鼓手》的分手戲裡，男主角對這\n段關係未來發展的精準分析。對野心很強、要求卓越的人，找伴真的很不容\n\
  易，因為那個伴侶必須要像量身打造那般，符合許多條件，才有辦法維持關\n係。\n\n***以下有雷***\n\n也因此，電影最後一段，他倆見的這一面，即使太令人心痛，卻又莫名振奮\n\
  人心。這是他們故事的\"closure\"，是沉痛的告別，也是一種解脫：兩人徹\n底明白此生從來就無法同行，除非生在童話故事裡。回到電影前段呈現的，\n兩人對事業與夢想的熱誠與執著，當他們有機會圓夢時，怎可能做那位配合\n\
  對方、杵著等對方的人？怎能以對方志向為己志？如果其中一方為愛情犧牲\n，五年後會開心嗎？Seb能夠窩在家帶小孩等老婆回來嗎？Mia能跟著丈夫巡\n迴演出、回到家的時候就去顧丈夫開的爵士酒吧嗎？身為觀眾，我們真的希\n\
  望Mia選擇成就她的愛情，然後變成為了家事與孩子而操勞憔悴、為了丈夫\n的長年不在家而孤獨憤怒的典型「音樂家元配」嗎？\n\n如果有個不用考慮現實的歡樂La La\
  \ Land，如果Mia與Seb是一部毫無邏輯的\n浪漫喜劇中的男女主角，靠著幻想與電影魔法，他們可以有個夢幻未來，但\n現實就是，他倆做了不同的夢，有不同的地方要去，其他的只能擺在後面。\n\
  片尾的一小段幻想，就是藝術的魔力之一，它提供逃避現實的小小出口，畢\n竟，唯有藝術，能讓塞車變得好看好聽。\n\n《樂來越愛你》更有趣的點，是我感覺導演Damien\
  \ Chazelle在夢幻又美麗\n的劇情與畫面中，趁機比了很多中指。Chazelle透過男主角，不斷強調爵士\n一點也不輕鬆，它可不是那種在某些咖啡店與餐廳聽到的背景音樂、襯托晚\n\
  餐用的，它是主角，需要聽眾的全心注意，充滿不斷的衝突與妥協，每一回\n表演都需要樂手的掏心掏肺、重新創作。此外，Chazelle順便暗示了電影就\n要在電影院看、森巴與西班牙\"\
  tapas\"這類的「結合」根本不倫不類、還有\n若觀眾不喜歡他的懷舊風......\"Fuck them!\"。我不敢確定這些細節是導演\n趁機吐露心聲，但如果是，我喜歡他的堅持與霸氣。\n\
  \n雷恩葛斯林近年不斷有好作品，面對不同型的角色游刃有餘，在《樂來越愛\n你》裡面，看得出他花了多少心力，讓觀眾相信他演的Seb的確是個超厲害\n的鋼琴家。不過這部片是屬於艾瑪史東的，她的所有特質在片中閃耀無比，\n\
  幾乎集結她過去在各種片型展露的潛力，一次表現出來，唱、跳、喜劇、戲\n劇，沒有一項考得倒她，應該可以放心地說，本片是史東從影以來最佳表現\n。\n\n我很推薦所有曾有過熱情的尋夢人，都去欣賞《樂來越愛你》，不管圓夢了\n\
  沒，相信本片都有讓你盡情宣洩、抒發的效果。「熱情是有感染力的」，導\n演用他的作品證明了這一點，在觀影的兩個多小時裡，我被他對爵士、對藝\n術、對夢想的堅持給深深感動，被片尾的最後一擊給打攤在戲院座位上，既\n\
  痛苦，又滿足，也獲得了一點繼續當怪胎、繼續叛逆的勇氣。\n\n\n--\n\n我的部落格 \nFB粉絲團  \n\n--"
