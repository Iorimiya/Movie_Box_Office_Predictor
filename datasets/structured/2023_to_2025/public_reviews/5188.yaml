url: https://www.ptt.cc/bbs/movie/M.1488368684.A.739.html
title: 'Re: [討論]樂來越愛你最佳男主角沒得獎?'
content: "推 aoka: 關鍵很公式化，還虛構女主被強制分類廁所很噁心              03/01 09:45\n不好意思 這句話我有意見\n\n\
  關鍵就是一部非常公式化的好萊塢電影(這句話我完全同意)\n它架構完整 敘事通暢 慷慨激昂 緊張刺激 該有的部分都有\n\n只是我壓根不認為它會拿下最佳影片\n\
  曾說過有0000.1%的機會 算對它有信心嗎? XDD\n(雖然看它現在賣贏拉拉有點小暗爽XD)\n\n\n然後我有意見的部分是在\n\n你說\"虛構女主被強制分類廁所很噁心\"\
  \n\n第一 這是根據\"真實故事\"改編 不是紀錄片\n     通常劇情片是可以容許少許的編改的\n\n     為什麼 很簡單 因為要真實還原\n\n \
  \    \"有色人種非得跑到幾百公尺外的地方解決生理需求這件事\"\n\n     編劇可能要再加寫一個無關的人物\n     或是再編排新事件\n    \
  \ 讓這件不平等的事凸顯出來\n\n     加寫人物 可是要安插頭尾 或透過加入事件來強調此事\n     整部電影可能最少就要再加個15分鐘吧?(看編劇能力)\n\
  \     編寫不好 更可能會影響整部電影的流暢度\n\n     這三位女主角各自的故事都有資格成為三部完整的獨立電影\n     要將三位女主角的故事合而為一\
  \ 加上完整敘事 已經有難處\n\n     如果為了要凸顯有色人種面臨Separate but Equal的真實處境\n     這樣的改編 我認為是可接受的\n\
  \     (把戲份集中在凱薩琳身上 透過她讓觀眾感受到不平等)\n\n第二 這部戲沒有說謊\n     凱薩琳本人接受訪問時 就親口說 她本人就是跟同部門其他女職員一起上廁所\n\
  \     (實際上 凱薩琳的部門 也只有翏翏數人的女性職員 XD)\n\n     除了她之外的黑人女性 則是被強迫使用有色人種的廁所無誤\n\n     編劇只是透過凱薩琳角色\n\
  \     來呈現除了凱薩琳之外的黑人女性在NASA發生的歧視問題\n     (所以我才覺得凱文科斯納那段有點狗血 XD 因為是編的)\n\n實際上 劇本獎項\
  \ 一向是奧斯卡最機車的部門\n如果不行 關鍵早就被刪除了\n\n--------------------------------------------------------------------------\n\
  \n如果要用說謊這樣的詞彙指控 ARGO 才是大說謊家....\n\n當年逃難時 大家都還在海關的免稅商店血拚呢....\n\n這樣的影片 還是當年度最佳影片\
  \ XDDDD\n\n--\n修改錯字 無修改推噓文\n最佳 XD 感謝幫忙訂正 XD\n補充:還好我只說劇本獎項的審核很機車沒說它公正 XDDD\n(汗)\n\
  \nARGO說謊還能拿獎 人家後臺硬啊\n導演沒入圍\n馬上請蜜雪兒歐巴馬來助陣頒最佳影片\n\n最棒的是這麼平庸又充滿謊言的作品 還得獎了!!\n這真是歷年最佳影片的恥辱\n\
  同樣拿過最佳影片眾多作品的是否也蒙羞了呢? XD\n\n喔 我忘了 還有衝擊效應可以互相安慰 XDDD\n它也拿下最佳劇本喔 wwwwwwwww\n\n關鍵怎麼比\n\
  資源輸慘了~~~~檔期爛沒宣傳 根本跟孤兒沒兩樣\n跟孤兒一樣就算了\n明明是合理的小篇幅的改編還要被說虛構 真是衰透了~~~~~~"
