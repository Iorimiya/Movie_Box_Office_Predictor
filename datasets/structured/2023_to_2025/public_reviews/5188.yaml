url: https://www.ptt.cc/bbs/movie/M.1768361205.A.A82.html
title: '[新聞] 蜜雪兒威廉斯演出《樂來越愛你》名導新 '
content: '蜜雪兒威廉斯加入演出《樂來越愛你》名導「監獄」新片！和席尼墨菲、丹尼爾克雷格同

  台飆戲






  《樂來越愛你》（La La Land）金獎導演-戴米恩查澤爾（Damien Chazelle）籌備好一段

  時間的監獄題材電影，去年五月曾傳出，丹尼爾克雷格（Daniel Craig）、席尼墨菲（

  Cillian Murphy）都正在洽談主演，而事隔多月，外媒《Deadline》今天又獨家披露，五

  度入圍過奧斯卡金像獎的金球影后-蜜雪兒威廉斯（Michelle Williams）也確定參演。






  這部監獄電影至今尚未公佈片名，劇情概要一無所知（據說靈感是來自七零年代的電影）

  ，上映日期還未定，僅確定今年會開拍，故事的主舞台是設置在監獄，而且會是夾帶動作

  元素的劇情片。負責譜寫過查澤爾迄今所有長片作品的作曲家-賈斯汀赫維茲（Justin

  Hurwitz）去年十月時也透露，他早就已經開始替本片譜曲，並大讚這是他讀過最棒的劇

  本。





  --'
