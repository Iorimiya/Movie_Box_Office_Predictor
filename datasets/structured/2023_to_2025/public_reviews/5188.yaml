url: https://www.ptt.cc/bbs/movie/M.1486297170.A.96D.html
title: '[新聞] 美國導演工會獎 樂來越愛你導演再奪獎'
content: '（中央社洛杉磯4日綜合外電報導）執導音樂愛情電影「樂來越愛你」的美國導演達米恩

  查澤雷（DamienChazelle）今天在美國導演工會獎（DGA）獲頒最佳導演獎，為自己在奧

  斯卡金像獎再添奪獎希望。


  法新社報導，美國演員工會獎是奧斯卡風向最重要的指標之一。


  奧斯卡頒獎典禮將於3週後登場，好萊塢頒獎季也隨之進入高潮，達米恩查澤雷今天以向

  好萊塢歌舞片黃金年代致敬的「樂」片獲頒最佳導演獎。


  現年32歲的達米恩查澤雷已憑藉這部音樂愛情片，勇奪金球獎最佳導演和最佳劇本獎。


  今年好萊塢頒獎季寵兒「樂來越愛你」（La LaLand）已抱走金球獎7項大獎，並且榮獲奧

  斯卡14項提名，包括最佳影片和最佳導演，領銜主演的銀幕情侶檔雷恩葛斯林（Ryan

  Gosling）與艾瑪史東（Emma Stone）更雙雙入圍最佳男女主角。


  達米恩查澤雷在比佛利山（Beverly Hills）的比佛利希爾頓飯店（Beverly Hilton）說

  ：「電影的力量很強大，因為它們能把訊息傳達給每一個人、每一個國家和每一種文化。

  」


  達米恩查澤雷擊敗以家庭親情片「海邊的曼徹斯特」（Manchester by the Sea）獲得提

  名的美國導演肯尼斯洛勒根（Kenneth Lonergan）。「海」片同樣被各界視為奧斯卡大熱

  門。


  「海邊的曼徹斯特」1月入圍金球獎5項提名，但最終只有男主角凱西艾佛列克（Casey

  Affleck）一舉登上劇情類影帝。（譯者：中央社劉文瑜）


  新聞網址：


  --'
