url: https://www.ptt.cc/bbs/movie/M.1483535922.A.BF8.html
title: '[新聞] 紐約影評人協會獎 最佳影片樂來越愛你'
content: '（路透紐約3日電）浪漫愛情電影「樂來越愛你」（La La Land）繼續橫掃各電影獎最佳

  影片大獎，今晚在有奧斯卡獎風向球之稱的第82屆紐約影評人協會（NYFCC）再抱最佳影

  片。


  由「進擊的鼓手」導演達米恩查澤雷（DamienChazelle）執導的樂來越愛你描述懷抱夢想

  的女演員遇上爵士鋼琴家的故事，場景位於洛杉磯。這部片被視為今年奧斯卡獎大熱門。


  凱西艾佛列克（Casey Affleck）以「海邊的曼徹斯特」（Manchester by the Sea）中的

  精湛演出，勇奪最佳男主角獎。他在片中飾演因哥哥意外逝世而成為姪子派屈克的法定監

  護人。


  凱西艾佛列克說：「我過去也曾被紐約影評人協會挑出，是比較不令人愉悅的那種，但若

  要享受甜美果實，就必須接受。很高興來到這裡，知道他們至少有過半數人肯定我在這部

  電影中的演出，即使不是所有人。」


  法國影后伊莎貝雨蓓（Isabelle Huppert）以劇情片「她的危險遊戲」（Elle）和「愛情

  未來」（ThingsTo Come）中的演出，拿下最佳女主角。


  由布萊德彼特監製的電影「月光下的藍色男孩」（Moonlight）也奪下數個獎項，內容描

  述一名黑人男孩在邁阿密的艱困環境成長的故事。中央社（翻譯）


  新聞網址：


  --'
