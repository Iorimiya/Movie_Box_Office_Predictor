url: https://www.ptt.cc/bbs/movie/M.1540640683.A.08A.html
title: '[好雷] 樂來越愛你'
content: '有雷


  整體來說我蠻喜歡的一部電影


  劇情其實非常的單純，整體來說我覺得算是四平八穩，沒有很大的缺點，但也沒有什麼特別


  對於男女主角的感情，我自己的想法是，賦予這段感情的意義就在於他們共同扶持而同時又


  電影最後蜜亞對賽巴斯汀的微笑，感覺像是對以前的感情致意，也像是在對曾經共乘一條船


  劇本算普通，不過留給我上面這些藍色窗簾的想像，我蠻喜歡的。


  不過最讓我不滿意的是蜜亞演員夢起死回生的處理。我不反對忽然來個人拯救蜜亞的演員夢


  我自己的想法是蜜亞的獨角戲內容可以是跟蜜亞的人生故事有關，因為這樣可以跟後面甄選


  演員的話選角我很喜歡，兩位演技都沒有說頂尖但也不至於到差勁，Emma Stone表現得不錯


  視覺上很滿足，開頭蜜亞的朋友穿著校園嬌娃配色的洋裝慫恿蜜亞去參加派對的那一段，公寓內部配色大膽但是視覺效果很好讓我印象深刻。音樂更是首首都好聽，連ending
  credit的配樂都好聽，原聲帶整張都能順順聽完。舞蹈編排也很棒，運鏡呈現上也很順，雖然男女主角有時跳得有一～點點尷尬但都還在接受範圍內，還是能好好享受歌舞。


  我覺得這部電影最加分的地方是第一場和最後一場表演不只是精彩，更是符合開始和結束的氛圍。


  《Another Day of Sun》是我的最愛之一，歡快的風格和帶有對築夢未來對想望加上幾乎一鏡到底的動作編排確實給人一種故事開始的感覺。


  結尾《Epilogue》其中「如果當初」的感覺也帶來塵埃落定，即將落幕的氛圍。這種切題的感覺讓整部電影的完整度提升了不少。


  如果問我這部好不好看我會說好看；如果問我這是部好電影嗎我的也會回答是；如果問我推不推薦的話我也會說推薦。


  但我也能理解為什麽有些人不喜歡。如果是注重劇情的人，對他來說這部電影應該是「加分題寫得比主要試題好」的作品吧。


  總之這部電影我給好雷，不過畢竟是主觀的東西，純粹寫寫分享給大家囉～歡迎一起討論！



  --'
