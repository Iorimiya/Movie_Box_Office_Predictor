url: https://www.ptt.cc/bbs/movie/M.1521211608.A.029.html
title: '[微好雷] 樂來越愛你(La La Land)'
content: '板友們晚安，你看無限之戰預告片了嗎?

  我又來寫舊片了，這次是樂來越愛你(La La Land)

  這次是無雷心得文，還請大家多看多指教囉!


  無音樂彩色網誌版>>



  純文字版>>

  樂來越愛你(La La Land)


  簡短總結:

  動聽的音樂與曼妙的舞步，追夢的美好及

  生活的現實，我不認為本片只是部單純的

  愛情歌舞片，而是真實上演的人生劇場，

  無論你有沒有夢，都值得看場La La Land



  電影簡介:

  夢想成為電影明星的女主角Mia和

  想要開間爵士樂酒吧的男主角Sebestian

  在追夢旅途上相遇的他們會有什麼交集，

  當現實與理想交戰時，誰會先妥協?


  蜜雅·多蘭 Mia

  (艾蜜莉·珍·史東Emily Jean Stone飾)


  塞巴斯蒂安·王爾德 Sebestian

  (萊恩·湯瑪士·葛斯林

  Ryan Thomas Gosling飾)



  ＊＊- 無劇透觀影心得‧安心看 -＊＊＊



  「這部片很夢幻，但卻又現實不已」

  這是我給La La Land下的第一個注解；


  個人喜歡看電影也愛聽音樂，但歌舞電影

  看的很少，起初是因為"愛情"這個主題

  吸引我看本片，後來發現其中的歌曲、

  配樂、舞蹈都十分出色也更吸睛；

  浪漫的氛圍和唯美的畫面引人入戲，

  反映人物心情的歌聲和音樂帶入的時機都

  恰到好處，在聽覺享受的同時一併欣賞

  兩位主角自然不矯情的演技，

  懷才不遇的Mia及追求理想的Sebestian，

  兩個在現實環境中常見的小人物卻由兩位

  明星演員來詮釋，非但沒違合感還十分的

  到位...(當然我不會承認外表大加分啦XD


  愛情是一段值得嘗試的旅程，

  無論開始於日久生情或一見傾心，

  這段旅行的路上都會遇到現實的考驗與

  心境上的變化，每個人對未來有不同的

  期待、對生活有不同的理想，

  與身旁的他共同面對柴米油鹽及燈紅酒綠

  的社會時，彼此間的想法能否一致呢?

  把互相體諒及理解掛在嘴邊很容易，

  但時間的考驗往往是強而有力的敵人，

  你願意支持身旁的他，他也支持著你，

  從感情中衍生出力挺對方的那種心情能

  維持多久...一天、半年、一年、兩年?

  當遇到難題使得兩人意見相左時，

  如何處理的圓滿又能滿足雙方的期待，

  這會是一段感情能否長久的大課題；


  本片委婉道出了很多人曾遇到的問題，

  心中有著目標及夢想，然而追求它們的

  過程中不僅得勞心勞力，還往往要考慮到

  自己的另外一半和家人，你可以選擇專注

  在自己的理想上頭必竟人生只有一次，

  你也能選擇先成就另一半或家人後，

  再來談完成自己所想要的事物，

  亦或是能力足夠者可以帶著身邊的人一起

  去達成各自和共同的人生目標...

  試問自己如果是電影中的男or女主角時，

  會做什麼樣的選擇呢?!


  電影完結前給了觀眾一段像夢一般的過程，

  很美、很甜，但最後結尾是現實不是夢，

  而總是偏好電影能有美滿結局的我，

  卻不如以往看其它部片時覺得可惜，

  因為這就是現實，現實才是人生的寫照，

  這是部看了會回味與感同身受的電影，

  即便它現實不已...


  如果你有夢想，你願意為它付出多少?

  現實就在眼前，你會妥協還是堅持?


  「獻給追夢的人，哪怕他們有點傻

  獻給受挫的心，和苦中作樂的我們」

  La La Land, 2016


  ---2018.3.15 by grass


  §本篇所使用的圖片部份取自於網路，

  版權屬電影公司與其原作者所有，

  如有侵權或任何問題，煩請留言給我。


  歡迎轉載和引用本篇心得，但麻煩告知；

  覺得寫的不錯歡迎點個讚或留言、分享，

  謝謝收看\^-^/


  -- 後記 --


  1.看了專訪兩位主角專訪的影片，

  在電影拍攝前他們花了約三個月的時間

  做訓練，艾瑪練唱歌、萊恩練彈琴，

  並且一起反覆學習跳各種舞蹈，所以最後

  呈現在大螢幕上的才會是這麼棒的成果!

  (真的是很用功的兩位明星)


  2.La La Land在第89屆的奧斯卡金像獎的

  最佳影片部份輸給了"月光下的藍色男孩"

  (Moonlight)

  前些日子我終於租了Moonlight來看，

  雖然覺得這兩部都是很不錯的片，

  但仍為La La Land覺得小可惜，

  但這就是現實，無法盡如人意:)


  3.萊恩·葛斯林真的hen帥>///<


  --

  電影心得>> 黑豹


  電影心得>> 雷神索爾3:諸神黃昏


  電影心得>> 我和我的冠軍女兒



  --'
