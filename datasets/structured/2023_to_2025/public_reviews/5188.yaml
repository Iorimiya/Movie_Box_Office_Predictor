url: https://www.ptt.cc/bbs/movie/M.1482581893.A.BEA.html
title: '[ 負雷]  有點失望的樂來越愛你'
content: '防雷防雷




















  ======


  看到版上一片好雷已經做好被噓的準備了。不過還是想討論一下，還是不太能理解大家這

  麼叫好的原因，看起來只是一部堅持夢想的片。


  說說不喜歡的原因，從一開始女主角與男主角在派對後跳舞那段就很不解，為啥本來互看

  不順眼的兩個人跳一支舞就突然可以劈腿變情侶？而且很突然地唱起歌讓人超出戲...


  後來演到在天文館跳舞跳到飛上天，不知道是小妹少女心不夠還是怎樣，還以為在看到迪

  士尼浪漫公主片...


  原來以為是以愛情為題材所以怒吃了一陣爆米花打算給個大負雷，後來進展到追求夢想的

  過程就讓人蠻喜歡的！

  有點類似曼哈頓練習曲的感覺，不過相較起來突然跳起舞唱起歌的部分都讓人覺得超級出

  戲破壞流暢，為什麼不好好演追求夢想的過程就好啊～～～（掩面）


  個人是蠻喜歡結局的，最後和你在一起的人不一定是當初最愛的人，男主角彈起那首歌時

  忍不住流下兩行清淚。最喜歡的部分是女主角唱她姑姑跳到河裡那段，獻給那些追夢的傻

  瓜們。


  追夢的故事百百種，經歷一波三折就會成功的勵志電影好像在告訴我們you reap what yo

  u sow

  但事實上卻是一分耕耘沒有一分收穫。許多現實中努力奮鬥的人們，一生可能就停在故事

  的低潮，就沒有後續了。總以為堅持到底會有更多，但最後我們大都成為茫茫人海中那個

  對生活妥協的人了。




  --

  同意，可能是我期待太高了QQ

  說的也是，印象中的歌舞片只有歌舞青春（掩面）可能是還看不習慣

  我也愛你，下次再一起看電影好嗎

  你很浮誇哈哈哈哈

  謝謝你，不過我並不是排斥唱歌，前面在家跟姐妹一起唱歌就蠻喜歡也不覺得突兀，只是

  不喜歡男女主角熱戀唱跳部分，每個人喜好不同就是想提出我的看法然後聽聽不同意見囉

  ：）'
