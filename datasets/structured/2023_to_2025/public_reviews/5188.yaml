title: '[好雷] 樂來越愛你 屬於男人的愛情片'
content: '繼藍色情人節後 雷恩葛斯林又一部讓男性看了都會心揪揪的電影


  相信每個男性看完應該都會有一些感觸吧


  曾經深愛的人 為了一些原因而分開


  但是心中永遠都還是有屬於她的位置


  看了好幾次 還是覺得雷恩葛斯林真的太帥啦XD








  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  兩位在追夢路上屢屢受挫的男女 在幾次巧合下相遇


  瞭解了彼此所追尋的夢想後 互相鼓勵扶持彼此堅持自己的夢想


  但是Seb聽到Mia與母親的電話後 瞭解了這樣是養不活自己


  於是為了生活而去做不喜歡的音樂 就因為要賺錢生活


  但還是持續鼓勵著Mia去寫屬於自己的獨幕劇劇本 錢的部分不用擔心


  Mia去看了Seb的表演 瞭解到這不是Seb所喜歡的爵士樂


  在晚餐中雙方的爭吵 似乎把Seb打醒了點 想起自己的夢想


  Mia的獨幕劇Seb因為工作無法前來 加上悽慘的人數與表演後被譏笑


  讓Mia心灰意冷決定放棄演員 離開Seb回到老家休息思考未來


  Seb接到一通要Mia試鏡電話 馬上衝去Mia老家告知這消息

  (這點顯示Seb多麼愛Mia 她所說過的事完全在他腦中)


  拿到了去巴黎演出的機會 雙方也不知道這段感情該怎麼辦的情況下


  Seb鼓勵Mia這是她雖追尋的夢想 要拋開一切竭盡所能去掌握


  五年後 Mia已經成為當紅女星 且有家庭了...


  Seb也有足夠的能力 實現他當初所追的夢想 也持續關注著Mia


  當兩人在Seb''s重逢時 看到了Mia與她先生


  Seb彈起兩人的主題曲


  幻想著當初做了不同的決定 是否現在彼此是很幸福的呢

  ----------------------------------------------------


  看完都覺得心酸酸的 Seb這麼深愛的Mia


  無悔的付出與犧牲 只希望Mia能成功達成她的夢


  卻換來這樣的結局...


  沒有誰對誰錯 只是Seb太癡情了 癡癡的等待 XD


  --

  我覺得有在等Mia耶 不然條件那麼好怎麼沒老婆

  而且還持續關注著Mia的新電影

  當初放手是瞭解跟著Mia對她的發展會有影響 因為深愛著Mia 不想拖累她

  覺得Seb是再等有一天 成功的彼此能重逢 繼續五年前的愛'
