title: '[好雷] 樂來越愛你～歡樂歌舞下隱藏著現實'
content: '豐富圖文版:





  滿懷著希望踏入那夢想之城

  即使屢戰屢敗依然不曾熄滅


  一切都是因為他

  自從那一夜的巧遇

  兩人就此產生連結


  懷抱星夢的女孩 落魄的爵士琴手

  在這個城市會擦出什麼樣的火花


  樂來越愛你～



  2014年令人驚艷進擊的鼓手導演最新作，自從去年威尼斯影展釋出預告片後，

  這部片就讓阿一一期待許久，後來也陸續在得獎季網羅了不少大獎，

  更在最近金球獎一舉奪得七座獎盃，雖然後來車禍腳受傷沒辦法搶先欣賞，

  不過等腳好了差不多立馬衝戲院，果然不負眾望，好久沒那麼精彩的原創歌舞片

  (距離之前覺得不錯的髮膠明星夢已好幾年了，不過除紅磨坊之外大多改編自有名音樂劇)


  從一開始片頭的歌舞就非常吸睛，

  洛杉磯的高速公路化為大舞台，大家脫離塞車的煩悶展現內心的夢想

  (聯想到少林足球完整版的醬爆之歌XD)，也適時帶出男女主角雷恩葛斯林與艾瑪史東，

  相對於阿一一愛片紅磨坊的創新酷炫運景，樂來樂愛你是走向傳統歌舞片致敬的復古風，

  如果有看過秋水伊人、萬花嬉春等經典電影，就會在樂來越愛你中看到一些影子。


  傳統歌舞片雖然好看，但長稍嫌冗長(例如：著名的窈窕淑女歌舞部分反而比較悶)，

  樂來樂愛你披著復古的外衣，節奏卻相當輕快，從進擊的鼓手就知道導演對音樂的掌握，

  電影中的每首歌曲、舞步跟都非常的順，讓人可以完全投入那個夢想又殘酷的夢想之城，

  跟著劇中演員一起盡情微笑、煩惱與流淚，而且看完回家立刻上網找片中的歌曲狂聽。


  雖然樂來越愛你基本劇情相當老梗，就是一個力爭上游的勵志愛情故事，

  故事發展不難預料，以四季春夏秋冬分割也稍嫌普通，

  但導演很聰明將全片完全聚焦於男女主角上，看完可能不記得有哪位特別有印象的配角

  (除了客串的葛萊美歌王John Legend唱歌好好聽，

  阿一一還特別上網找，歌名叫Start A Fire)，

  不過一定會將男女主角的表演深深印在腦海中，

  尤其劇情更長聚焦於艾瑪史東的臉部表情上，

  從剛開始試鏡的錯愕到關鍵那首歌都非常細膩，

  也期待她能在奧斯卡奪得后座(她的危險遊戲的伊莎貝雨蓓也是來勢洶洶阿～)。


  延續進擊的鼓手樂來越愛你也是以爵士樂的主題，

  可以看得出導演是一位非常愛爵士樂的人，

  藉由男主角落魄爵士樂手的身分，

  說出爵士樂的精隨也直接點出其遇到的困境，

  但導演真的超厲害，其實我本來也沒多愛爵士樂，

  不過看完電影跟女主角一樣愛上爵士樂了。


  現實中的戀愛不是只有甜美，有時也藏了許多苦澀與惆悵，

  樂來樂愛你片尾兩人的對望，延伸出那宛如神來之筆的幻想結局，

  讓本片帶入更深沉的情緒，現實不能像好萊塢電影那樣皆大歡喜，

  只能留下那一抹百感交織的微笑，你知道我是愛你的～


  --

  歡迎光臨我的部落格

  阿一一之詩意與電影的流動



  --'
