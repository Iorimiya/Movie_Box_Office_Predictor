url: https://www.ptt.cc/bbs/movie/M.1481465487.A.F19.html
title: '[好雷] La La Land 樂來越愛你'
content: '標題雖是好雷，

  但其實也沒寫什麼雷。


  《樂來越愛你》La La Land，我主觀的喜愛這部電影，甚至是我今年最喜歡的作品，一直

  以來我都對於這種拍攝「過程、時刻」的劇本情有獨鍾。


  因為我認為人生就是在由各種 moment memory 編織而成，或許當下無法明白，直到你走到

  下一個時刻你才能領悟，但追憶本身就是人生最富玩味的一件事。


  這部電影除了帥哥美女 Emma Stone & Ryan Gosling 之外，更加主打的是穿梭於電影中

  的歌舞，是走出電影院還是能哼上幾句的好音樂，劇情更探討著夢想與實踐、在人生旅途

  上的妥協與成全，如沐一年四季般的呈現給觀眾。


  除此之外不得不佩服導演 Damien Chazelle，不愧是拍出《進擊的鼓手》的名導，在色彩

  與光線的掌握上簡直是爐火純青，聚光燈的使用更是讓幕後的觀眾、輕易的跳進角色的幕

  前，細膩的窺探其情感變化。


  人生就像一首樂曲，在前奏醞釀、在副歌高唱、在結尾惆悵，我們相識在某個時刻，伴隨

  著彼此走過，然後隨著歌曲終了而留白，但那首樂曲並不會真的消失，它會在你腦內留下

  一個段子，等你領悟時再次哼唱，成為你的力量。


  我真心喜愛這部作品，或許不一定能打到每個人的心，如同 500 Days Of Summer 一樣，

  是較吃觀眾經歷的電影，但因為多了美麗的歌舞，更增添這部電影的夢幻與細膩之處，簡

  言之，我用一個字句來形容 La La Land。



  「浪漫。」


  --'
