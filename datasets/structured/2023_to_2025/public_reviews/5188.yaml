url: https://www.ptt.cc/bbs/movie/M.1481644316.A.A75.html
title: '[好雷] 樂來越愛你-包裝在夢想外衣下的愛情電影'
content: '《樂來越愛你》～La La Land

  這是一部包裝在夢想外衣之下的愛情電影

  也是一部節奏鮮明、畫面美麗、音樂又好聽的音樂舞台劇電影

  我相信也會是一部能引起眾人共鳴卻非老梗的經典電影




  -----有----------慎---------


  ----------雷-----------入---






  是不是我們都得在愛情和夢想的交叉路做出選擇？然後帶著其中一個遺憾往前走。

  愛情和夢想都始於滿滿的熱情、都有其初衷

  兩者可以互相滋養

  卻也可能彼此爭奪

  在這部電影裡

  ㄧ段難能可貴的愛情成全了兩個人各自的夢想

  但是也留下了令人傷感的遺憾



  ----



  電影裡頭有兩幕最讓我難忘

  分別是男女主角在劇中和劇終的微笑


  。Mia的笑。

  在Sebastian陪Mia試鏡結束後

  2人一起看著美景，談著彼此的關係

  「Where are we?」Mia問

  最後這一幕定格在Mia眼眶含著淚水卻微笑著

  這一個笑是滿滿的無奈和悲喜交雜


  。Sebastian的笑。

  5年後兩人在當初共築的夢想酒吧相遇

  Sebastian在台上望著Mia夫婦離去的背影

  Mia止步、回首，兩人四目交接

  Sebastian紳士地微笑、點頭

  這一個笑則是深深的遺憾與淡淡的哀愁

  明明都是微笑，卻讓我心碎一地、淚流不止......



  ----



  昨天和同事看完電影後兩人都淚流滿面

  心裡滿滿的情緒感受不吐不快

  便接著到星巴克聊了聊彼此最有感觸的畫面

  果然我們都被觸碰到過去的生命經驗和現在的處境與心情

  邊聊著也邊流著眼淚、引起彼此共鳴......



  不過說真的

  看完電影能夠這樣有人一起聊聊心情感受什麼的，真是過癮！

  ----


  --'
