url: https://www.ptt.cc/bbs/movie/M.1482423990.A.214.html
title: '[好雷] 後勁強烈的《樂來越愛你》'
content: '其實我個人對歌舞片的興趣不大

  因為劇中角色講話講到一半突然唱起歌來

  尤其是在吵架衝突或是垂死遺言之類的片段

  會讓我整個人出戲

  當然歌舞片是相當值得欣賞的一種藝術

  只是我自己的觀影習慣使然


  但《樂來越愛你》卻完全沒有這種問題

  劇中出現歌舞的段落和長度都恰到好處

  感覺都是加強了劇情當下的氣氛及情緒

  重要的幾場爭執戲還是都寫實到讓我完全融入劇情

  或許就像片中一個角色說出爵士樂正在dying

  要讓年輕人接受就要融合新元素一樣

  導演也把歷史悠久的歌舞片用他自己的方式創新呈現

  如果你也和我對歌舞片有一樣的疑慮

  不妨試試看這部電影

  或許會跟我一樣對歌舞片有新的感覺


  接下來聊聊這部片的劇情

  有雷

  還沒看的人請斟酌觀看


  其實到了某個年紀後

  對「追求夢想」這種主題的劇情已經有點麻痺無感了

  但導演卻用男女主角的際遇拍出了真實人生可能面對的情形

  做著一個看似穩定的工作

  重複著差不多的例行公事

  其實這樣不太厭煩、可以平穩度日的生活好像也不壞

  但卻被看出其實這根本不是你真正想過的人生

  但如果毅然決然辭掉現在的工作去追夢

  下場可能慘到入不敷出

  甚至收拾包袱回老家


  女主角第一次公演後謝幕看到空蕩蕩的觀眾席

  又聽到他人的閒言閒語

  最後連劇院費用都付不出來

  這慘狀實在過於血淋淋

  好像看到放手去追夢後的自己會面臨的窘境

  夢想不僅沒完成

  還被現實面摧毀殆盡


  但還好男女主角遇到了彼此

  一個在對方妥協之後提醒對方莫忘初衷

  一個在對方放棄之後鼓勵對方勇敢再試


  從某種角度來看

  最後男女主角沒有在一起確實是個悲劇

  但他們的相遇卻讓彼此都成功達成夢想

  比起從沒相遇或是其中一方妥協、放棄

  或許這才是真正的Happy Ending


  當然

  片尾安排的久別重逢和想像畫面實在令人揪心

  但看完電影回家的路上聽著City of Stars

  回想男女主角在餐廳相遇

  在紫色晚霞與燈海背景前共舞

  在酒吧談論爵士樂

  在天文台如夢似幻的場景中確認彼此

  在片廠中散步聊天


  或許這些瞬間就是永恆了


  --'
