title: 'Re: [討論]樂來越愛你最佳男主角沒得獎?'
content: '基本上不想引筆戰


  海邊的曼徹斯特看了三次


  三次的原因都是因為看到睡著


  所以不發表這部的想法


  LA LA LAND女主為主視角


  應徵的獨角戲真的可以讓女演員拿小金人


  至於誰來演拿不到小金人 也不討論


  LA這部戲的男主非常難演


  光是前面的爵士獨奏跟中間樂團演奏


  會樂器的朋友應該都知道


  沒充分的演練 只會NG NG 再NG


  有注意到消息都知道


  男主練了三個月


  NG了上百次


  或許被版上的朋友講對了


  RYAN在這部戲的演技無法發揮


  甚至演得不盡理想


  入圍就算不錯了


  但不可否認這部戲男主爵士樂是靈魂所在


  畢竟拿了最佳配樂 最佳歌曲


  而如果把爵士樂拿走


  等於把這部戲靈魂抽走


  畢竟每個人看的角度都不同


  最後只想怒吼


  評審你知道 Take on me有多難練嗎


  啊啊啊啊


  --'
