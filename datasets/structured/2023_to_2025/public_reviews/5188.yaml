url: https://www.ptt.cc/bbs/movie/M.1484325303.A.8BF.html
title: 'Re: [負雷] 樂來越愛你'
content: '「你為什麼這麼喜歡LALALAND？」

  「你不覺得Mia很婊子嗎？」

  「你不覺得Mia後來的老公很綠嗎？」

  「Seb超可憐。」

  「真愛都無法走到最後。」


  最近常看到這樣的問題，我只能說我跟你們看法完全不同，愛情對我來說就是一個人生的

  「過程」，沒有所謂的高低，我們雖然看見Mia跟Seb愛的熱烈，但我們卻不清楚Mia跟後

  來老公的相愛經過，沒有一定Seb就是Mia的真愛這種事。


  我也不相信真愛論，沒有誰沒跟誰在一起就是遺憾，在你嚥下最後一口氣前，愛情都會一

  直出現，你分手了、你依然還是會再談戀愛，Mia或Seb的電影是結束了，但他們會繼續完

  成剩下的人生故事。


  再來就是我認為真正的愛情，是希望對方快樂，即使他不屬於你，所以當兩人終究走上不

  同道路時，剩下的只有祝福，再次相見時，兩人相視的微笑，不是惋惜，是「我很高興你

  過得很好。」、「我很高興你沒有放棄追逐夢想。」


  這是我認為愛情最美好的境界，我們雖然不是對方相守一生的人，但在你的人生中，我成

  為了一部分的故事，讓彼此成為更好的人，Mia跟Seb也分別成為了彼此夢想過程中的伯樂

  。


  那我到底為什麼喜歡這部片，因為這部片演得不只是愛情、也不只是夢想，演得就是很真

  實的人生，我們會遇到很多人、很多事，有些人會很靠近、有些人會離去，有些事會幫助

  你、有些事會傷害你，但最終我們都感謝這些人事，豐富了我們的人生。


  「美麗的不是你，美麗的是當時的我跟你，但即使如此，我們還是要在惆悵後往各自的未

  來去。」


  --'
