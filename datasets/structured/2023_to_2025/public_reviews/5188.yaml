url: https://www.ptt.cc/bbs/movie/M.1486906685.A.152.html
title: '[新聞] 英國奧斯卡即將揭曉 樂來越愛你受矚目'
content: '（中央社倫敦12日綜合外電報導）繼金球獎之後，好萊塢浪漫追夢音樂劇「樂來越愛你」

  （La La Land）今天能否在英國影藝學院電影獎（BAFTA Awards）大放異彩，備受矚目；

  這個獎項被視為重要的奧斯卡風向球。


  有英國奧斯卡之稱的英國影藝學院電影獎，預計台灣時間明天凌晨舉辦頒獎典禮。


  法新社報導，達米恩查澤雷（Damien Chazelle）執導的這部音樂愛情片，共榮獲最佳影

  片等11項提名，人氣銀幕情侶檔雷恩葛斯林（Ryan Gosling）和艾瑪史東（Emma Stone）

  也雙雙入圍最佳男女主角獎。


  3人料將與艾美亞當斯（Amy Adams）、凱西艾佛列克（Casey Affleck）、愛蜜莉布朗（

  Emily Blunt）和妮可基嫚（Nicole Kidman）等眾家明星一同出席頒獎典禮。


  「哈利波特」（Harry Potter）外傳電影「怪獸與牠們的產地」（Fantastic Beasts

  And Where to FindThem）入圍傑出英國電影獎（Outstanding BritishFilm），因此暢銷

  作家JK羅琳（JK Rowling）也將到場。


  由美國女星艾美亞當斯主演的科幻電影「異星入境」（Arrival）和心理驚悚片「夜行動

  物」（NocturnalAnimal），分別以9項入圍排名第2。


  「海邊的曼徹斯特」（Manchester by the Sea）以6項提名位居第4，領銜主演的凱西艾

  佛列克入圍最佳男主角。


  英國著名左翼導演肯洛區（Ken Loach）的「我是布萊克」（I, Daniel Blake）榮獲5項

  提名。「我」片劇情圍繞著1名被社會福利制度阻擋在外的小人物。


  美國女星梅莉史翠普（Meryl Streep）則以最新力作「走音天后」（Florence Foster

  Jenkins）入圍最佳女主角，演活19世紀1名五音不全、一開口就聲驚四座的紐約貴婦。


  在「走」片中飾演梅姨丈夫兼經紀人的英國男星休葛蘭（Hugh Grant），也入圍了最佳男

  配角。


  BAFTA執行長柏利（Amanda Berry）告訴英國廣播公司（BBC）：「這一系列作品都非常傑

  出，使今年的入圍名單令人好奇且充滿興趣。」（譯者：中央社劉文瑜）


  新聞網址：


  --'
