url: https://www.ptt.cc/bbs/movie/M.1483637590.A.C51.html
title: '[選片] 星際過客/長城/樂來越愛你'
content: '下禮拜一想去新北板橋大遠百看個電影


  看了看上映場次 目前考慮的有星際過客 長城 樂來越愛你三部片


  個人比較偏愛科幻冒險動作懸疑之類的


  星片上映前原本就想去看 沒想到評價不佳因此猶豫


  後來看到有一說是因為預告讓人以為是動作大片而有錯誤的期待


  如果我現在知道不是動作片 不會期待它有什麼精彩畫面 是否就會比較好看呢?


  另外我對歌舞片比較沒什麼興趣


  除非它是百老匯改編例如吉屋出租或悲慘世界 這兩個我就覺得很不錯


  否則我實在提不起什麼興趣 更何況樂片還是愛情片


  不過它評價似乎是三片中最好...


  至於長城 老實說看過預告後我把它當搞笑片


  後來發現板上好雷一片 反應竟然比想像中好很多


  讓我有點訝異


  因為我以為這部片會跟英雄 滿城盡帶黃金甲 十月圍城 墨攻等差不多水準


  個人認為上述這幾部片都不怎麼優 純粹個人感觀問題


  另外我對中國片不知道為什麼都看不慣


  就連板上大推的讓子彈飛 寒戰 我都覺得普普


  所以長城我原本也不會選


  完全是因為板上出乎意料多的好評 讓我開始考慮.....


  不知道看過以上幾部片的大大會推薦哪部呢?







  --'
