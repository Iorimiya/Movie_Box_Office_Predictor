title: '[LIVE] 樂來越愛你LALA LAND   HBO首播21:00'
content: "【HBO電影台】\n  樂來越愛你 LA LA LAND\n\n播映時間：      2018/02/10\n21:00 ～ 23:05\n=======================================\n\
  節目介紹\n勇奪2017年第89屆奧斯卡最佳影片、最佳男配角以及最佳改編劇本3項大獎。\n[不來的彼特]監製，[貝瑞傑金斯]執導，[馬赫夏拉阿里]、[賈奈兒夢內]、\n\
  [娜歐蜜哈瑞絲]、[艾力克斯希伯特]、[阿什頓山德斯]、[崔範坦羅德]主演。\n居住在邁阿密的男孩席隆，因個子矮小、平時沈默寡言，在學校時常成為被霸凌的對象，\n\
  痛苦中掙扎求生的他，憑著意志生存下來，但他漸漸發現真正殘酷的不是外面的世界，\n而是他已偷偷愛上自己的好朋友。\n\n第89屆奧斯卡金像獎14項提名，平《鐵達尼號》影史入圍記錄；拿下第89屆奧斯卡最佳導\n\
  演、最佳女主角、最佳攝影、最佳製作設計、最佳原創配樂、最佳原創歌曲〈City of\nStars〉共6項大獎。其他曾入圍奧斯卡14項獎項的包括1950年《彗星美人》與1997年\n\
  《鐵達尼號》。《進擊的鼓手》導演[達米恩查澤雷]執導作品，[雷恩葛斯林]、\n[艾瑪史東]大銀幕三續情緣，再度攜手追求夢想，舞出浪漫樂章。 《進擊的鼓手》\n\
  魔鬼教練[J.K.西蒙斯]、節奏藍調小天王[約翰傳奇]聯手加持。\n\n在當小演員遇上鋼琴手，夢想與愛情要如何抉擇？落魄的爵士鋼琴家賽巴斯汀（[雷恩葛\n斯林]\
  \ 飾）與懷抱明星夢的小演員蜜亞（[艾瑪史東] 飾）相遇相知，相愛相惜，一起在\n充滿可能的洛杉磯互相扶持，追逐夢想。但是，當他們逐漸邁向成功，現實的壓力卻磨損\n\
  了原本美好的愛情，兩人的關係面臨巨大的考驗……。\n\n英文片名「La La Land」即是美國加州南部洛杉磯的暱稱。在洛杉磯這座充滿可能性的大\n城市裡，寂寥的小演員蜜亞懷抱著明星夢，一邊端著茶水，一邊到處試鏡；落魄的爵士鋼\n\
  琴家賽巴斯汀，在昏黃的酒吧靠演奏鋼琴維生，勉強餬口。同樣追求夢想的兩人在這座城\n市裡遇見彼此，陷入情網，相互慰藉扶持，一起追求畢生夢想。但在逐漸達成夢想的同時\n\
  ，兩人的情感也面臨抉擇和考驗，究竟他們努力成就的夢想，會成為相愛的阻力還是助力\n？在夢想與愛情之間，他們該如何選擇？\n\n《樂來越愛你》是《進擊的鼓手》新銳導演[達米恩查澤雷]籌備多年的新編導力作，在拍\n\
  攝生涯第二部長片《進擊的鼓手》前，查澤雷就已完成《樂來越愛你》的劇本。導演對音\n樂題材情有獨鍾，這部由銀幕情侶雷恩葛斯林和艾瑪史東主演的浪漫愛情電影，再度結合\n\
  豐富的音樂元素，穿插向好萊塢電影致敬的嘆為觀止歌舞橋段，讓觀眾既覺得有種熟悉的\n美好，卻又全然獨特，既現代又古典，是未曾看過的新類型電影。\n\n在主題上，查澤雷這次改以復古情懷，細膩描寫一對墜入愛河的年輕男女在追求夢想與維\n\
  持愛情之間遇到的挫折與難關，對查澤雷來說，這部電影是一封獻給洛杉磯的情書，「洛\n杉磯有種不可思議的魅力，這是當你塞在路上時不會發現的事情。我想獻給這座城市一封\n\
  情書，著墨那些在夢想與現實之間浮沉與拉扯的年輕藝術家。這座城市充滿想實現夢想的\n人，但大多數的人最終都無法圓夢，我覺得這點頗具詩意。」\n\n--\n推 hope951:有片無槍\
  \ 片失其用 無片有槍 槍失真我\n→ hope951:有片有槍 登峰造極 無片無槍 天下無敵\n\n--"
