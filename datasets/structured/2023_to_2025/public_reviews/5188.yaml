url: https://www.ptt.cc/bbs/movie/M.1482643560.A.613.html
title: '[新聞] 「樂來越愛你」好動人 艾瑪史東試鏡就落'
content: '「樂來越愛你」好動人 艾瑪史東試鏡就落淚



  2016-12-25 11:45中央社 台北25日電


  電影「樂來越愛你」配樂曲曲動聽，其中最賺人熱淚的就是艾瑪史東參加試鏡將近4分鐘

  的獨唱，該曲作曲家賈斯汀也透露，艾瑪史東演出試鏡戲時，最後唱到哭了，感動在場所

  有人。


  西洋愛情片「樂來越愛你」穿插歌舞劇的演出，豐富情感層次，男女主角雷恩葛斯林（

  Ryan Gosling）和艾瑪史東（Emma Stone）在電影中展現精湛演技、舞功，兩人難得開嗓

  唱歌也讓不少影迷驚喜表示「原來這麼會唱」。


  「樂來越愛你」配樂曲曲動聽，其中最賺人熱淚的就是艾瑪史東參加試鏡將近4分鐘的獨

  唱，真誠的歌聲唱出所有追夢人的心聲，把對夢想的渴望和挫敗表現得淋漓盡致。


  該曲除了與艾瑪自身闖蕩好萊塢的經歷相似之外，導演達米恩查澤雷（Damien Chazelle

  ）表示，這首歌打動人心的另一個關鍵在於拍攝方式，「這一幕完全由艾瑪唱現場，她靠

  自己的感覺，從說故事進入唱歌，而作曲家賈斯汀赫維茲（Justin Hurwitz）則在另一個

  房間配合她的歌聲即興演奏。」


  作曲家賈斯汀說，「這是我為電影寫的最後一首歌，但直到艾瑪演出試鏡戲的這一刻它才

  真正擁有了靈魂，艾瑪唱到最後甚至哭了，而現場所有人都被感動得說不出話來。」


  勇敢接受演出挑戰的艾瑪史東則說，「雖然拍這一幕讓我緊張到快吐，但百老匯的表演經

  驗，讓我深刻體會到現場演出的張力，即便有時會唱到破音或小小走音，現場的魅力仍是

  無可取代的。」


  而許多影評也認為光是艾瑪史東在這一幕的表現，就足以保送奧斯卡入圍名單，對此她也

  表示，「我試著不去想那些，我只想專注於當下，做好該做的事，不必去想它後續帶來的

  結果。」


  「樂來越愛你」描述落魄的爵士鋼琴家賽巴斯汀（雷恩葛斯林飾）與懷抱明星夢的小演員

  蜜亞（艾瑪史東飾）相遇相知、相愛相惜，一起在充滿可能的洛杉磯互相扶持、追逐夢想

  。但是，當他們逐漸邁向成功，現實的壓力卻磨損了原本美好的愛情，兩人的關係面臨巨

  大的考驗。



  --








  --'
