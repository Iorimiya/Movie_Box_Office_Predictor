title: '[無雷] 樂來越愛你，很愛很愛你'
content: '看完了這部片

  突然想起了這首歌

  同樣有著淡淡的哀傷


  很愛很愛你

  所以願意捨得讓你

  往更多幸福的地方飛去........


  看完這部片的後勁很強

  以下是無雷心得


  因為愛，所以跟對方一起作夢，是一件很幸福的事情

  因為愛，所以陪對方追求夢想，是一件很熱血的事情

  因為愛，所以看清追夢的艱辛，是一件很掙扎的事情


  現實的無情壓迫

  愛與夢想的抉擇

  不管如何選，都是為難

  下定決心，無關是非對錯


  別忘了，彼此都希望對方夢想得以實現

  也許最後的結局令人感傷惆悵

  過往的一切努力都是真實而美好


  當你看到未來某處的風景

  突然莫名微笑

  你會告訴自己

  我見過更好的風景………………


  一切的美好，永存心底～～～～～～


  很推薦這部電影




  -----

  Sent from JPTT on my Xiaomi Redmi Note 3.


