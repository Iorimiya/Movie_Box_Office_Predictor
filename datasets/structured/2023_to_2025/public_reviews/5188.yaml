url: https://www.ptt.cc/bbs/movie/M.1473342728.A.C57.html
title: '[新聞] 湯姆漢克斯對《樂來越愛你》讚譽有加'
content: '新聞網址：



  文/Jean


  在多倫多影展正式開幕之前，還有另一個相當具有指標性的影展也在上週末悄悄展開。在

  科羅拉多州舉行的泰路瑞德影展（Telluride Film Festival）雖然只有短短四天，但同

  樣邀來許多年度獎季力作。由克林伊斯威特（Clint Eastwood）執導、湯姆漢克斯（Tom

  Hanks）主演的真人實事改編電影《薩利機長：哈德遜奇蹟》（Sully）則在此世界首映，

  目前也獲得不錯的迴響。


  而湯姆漢克斯在映後座談會上除了談論這次的演出作品外，更對《進擊的鼓手》（

  Whiplash）導演達米恩查澤雷（Damien Chazelle）的最新作品《樂來越愛你》（La La

  Land）表達讚賞之意。該片是今年威尼斯影展的開幕片，由萊恩葛斯林（Ryan Gosling）

  與艾瑪史東（Emma Stone）三度攜手合演，首映過後幾乎可以說是獲得一片正面好評，

  日前也在泰路瑞德影展上放映。


  導演克林伊斯威特在談到希望製作更多原創電影時，湯姆漢克斯很突然地把《樂來越愛

  你》當作例子。他表示就跟一般觀眾一樣，他們也喜歡從電影當中得到許多新鮮的感受

  。「當你看到某個全新且從未想像過的東西時，你會很慶幸有這部電影的面世。因為我

  認為像《樂來越愛你》這樣子的電影或許是電影公司較不敢去觸碰的，要點之一是，這

  是一部音樂劇電影，且其中完全沒有觀眾認識的歌曲。」


  「這並不是一部在某種趨勢下催生出來的電影，我認為這是對於更廣泛的觀眾族群的一

  種挑戰，因為這其中沒有一般主流電影公司想要的元素。讓觀眾在帶有前提意識下去看

  一部電影是他們現在最在意的一件事，這也是為什麼有大量的重拍電影仍持續在進行的

  原因。《樂來越愛你》並不是一部續集電影，沒有觀眾已經認識的人物角色，但假如

  觀眾不去接受一部像這樣美好的電影的話，那我們所做的這一切就是注定失敗的。」


  《薩利機長：哈德遜奇蹟》與《樂來越愛你》目前評價都相當優秀，雖然類型截然不同，

  但預計也會是在接下來的獎季中，會持續交手的作品，前者將在 9 月 9 日本週末台灣上

  映，後者則預計在 12 月 6 日台灣上映。


  ------------------------------------------------------------------------------


  參考外電:Deadline

  Tom Hanks Interrupts His Own ‘Sully’ Q&A To Lavishly Praise ‘La La Land’



  心得:兩屆影帝親口推薦，《樂來越愛你》奧斯卡聲勢越來越穩？


  值得注意的是，已經有至少20名美國電影記者在義大利威尼斯

  看過《樂來越愛你》的世界首映，並且在自己所屬的網站發表影評



  《樂來越愛你》目前算是很奇蹟似地，只有一篇負評文，

  而且絕大多數用字直率的人氣影視網站(無論是紙媒出身的Time、THR、Variety，

  還是本身就是網站起頭的The Wrap、Collider、Indie Wire)都給予好評；

  目前唯一給此片負評的網站是Film Freak Central，

  此網站作家對電影的評價是「Step Up 6: Awards Season」


  《樂來越愛你》將會在下周作北美地區的首映，屆時應該會有更踴躍的網站影評文，

  讓全球關心奧斯卡的影迷們，更能精確地捕捉到明年頒獎季的風向


  --'
