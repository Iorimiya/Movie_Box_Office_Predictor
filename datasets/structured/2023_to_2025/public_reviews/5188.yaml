url: https://www.ptt.cc/bbs/movie/M.1613848432.A.B42.html
title: '[討論] 樂來越愛你評價為何勝大娛樂家?'
content: '今天剛好有空同時看了這兩部

  當然都不是第一次看了

  先說我自己沒特別喜歡音樂劇

  所以劇情本身還是重點


  首先先談談樂來越愛你

  劇情來說其實很簡單

  兩人相愛但事業不順

  互相鼓勵终於事業有成，無奈感情則無法繼續

  音樂部分其實也還好

  頂多稍微著重男主角的爵士音樂

  歌舞部分也很普通吧



  再來談一下大娛樂家

  劇情部分我覺得比較有內容

  一個貧窮小男孩取了一個富家女

  為了生活想出雜耍表演來賺錢

  但畢竟對當時社會只是亂搞的表演，沒任何地位

  於是男主角不滿於此，藉由女歌手的表演讓他名聲變好

  但也迷失了自己

  最後終於找回自己

  所以劇情上大娛樂家應該好一些


  音樂+跳舞的部分

