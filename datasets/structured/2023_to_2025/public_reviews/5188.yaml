title: '[好雷] 樂來越愛你 lala land 爵士情緣'
content: '防雷

  --------------------------------














  這應該是今年喜歡的電影前幾名

  對於音樂劇大多的印象

  是好萊塢早期那種制式的公式套用

  男女主角相識相戀到皆大歡喜

  再用音樂襯托出電影的豐富感

  但這部完全不是這樣

  為什麼要有音樂劇的電影類型

  我認為有時候影像說不出來的措辭

  就要必須靠音樂來呈現

  電影中從傳統爵士樂、搖擺樂到後期結合電子合成器的流行樂

  無疑是場聽覺的饗宴


  追夢

  有時候我們失敗很多次

  但怎麼知道再多試那一次不會成功？

  男主角像個怪咖，生活頹廢的宅男但帥得過分

  夢想是開一間爵士音樂酒吧

  現實中

  只能在餐廳裡彈一些聖誕歌曲 大材小用

  照著雇主的規定演奏


  女主角嚮往當一個演員

  面試卻屢屢碰壁被不屑一顧

  但電影與現實生活不同的是

  生活遇到失敗可能會放棄

  電影角色中卻都有追尋所愛和夢想的勇氣

  最終夢想成真


  眾星之城 你是否僅為我璀璨？

  這首［city of stars］在一開頭的前奏部分

  就透露出小調的哀傷 其實也是劇透的一部分

  眾星之城並不是只為你而閃耀

  沒有人會一直在原地等你

  電影的最後 女主角婚後意外的

  來到了男主角夢想成真開設的爵士酒吧

  可惜一切已經回不到過去

  生活中我們每個小細節 每個決定和動作

  都會影想到未來的發展

  如果當初相遇時男主角改變了對女主角的態度

  也許接下來的發展一切都會不一樣


  --

  我也覺得不一定會不同 但很喜歡最後這段的安排 一首歌就道出男主角所有心境～

  真的～感覺最後那邊是男主角對他們之間的回顧和遺憾

  但這個錯過 也讓電影更貼近真實生活

  你怎麼帥成這樣的宅男悲歌XD

  感覺男主角是一個蠻有自己想法的怪咖宅男

  對呀 這結局好像剛好在電影和現實之間？

  好喔 感謝你～

  對呀 是也沒有這麼慘XD 如果現實中兩人在一起了 也不一定適合 覺得他們個性有差異

  個人覺得如果男女主角最後在一起又雙方都美夢成真 電影的層次可能就變弱了

  就是這種淡淡的哀愁~XD'
