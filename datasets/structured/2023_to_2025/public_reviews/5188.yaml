  （這邊還可以解釋成，因為下班換裝）


  不過，當賽巴斯汀和蜜亞在片場漫步時


  有一幕，有個工人在前景拿著水管噴水


  在後方有兩個較模糊的人影，應該就是他們兩人，


  但兩人都明顯看得出來是穿長褲


  換到下一幕，蜜亞又穿上藍色短裙囉~


  這個小Bug不知道有沒有版友也發現的？


