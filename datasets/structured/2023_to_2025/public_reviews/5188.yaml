url: https://www.ptt.cc/bbs/movie/M.1492714868.A.A23.html
title: 'Re: [負雷] 樂來越愛你-別拿夢想污辱愛情'
content: "這標題滿有意思的XD\n\n  先說結論的話，從親身經歷跟親身聽到見到的許多故事來看，\n  對，沒錯，兩個追逐各自夢想的人其實是最不可能有happy\
  \ ending的一對。\n  越是有所追求、有所堅持的人，通常都越難搞，也越不肯改變自己去配合另一半，\n  然而不只是愛情，所有的夥伴關係能維繫，到最後最重要的通常都是互相包容。\n\
  \   (然後另一個最重要的是，「共同的」夢想。)\n  要兩個有各自夢想，但是各自的夢想裡面都沒有對方的人長久在一起，\n  本來就是不可能的啊。\n\n \
  \ 本片的前面大部分，說真的讓人看得非常難耐。\n\n  除了愛馬史東很漂亮(我不特別喜歡她的外表，但本片很美)、\n  也完全表現出很會演戲以外，本片的前半部情節真的充滿bug，\n\
  \  雖然人物環境大致上很貼近電影圈劇場圈音樂圈的很多氣氛，\n  但尤其是男女主角的種種行為都存在許多不太合邏輯的地方，\n　就連雷恩葛斯林本片都帥不起來了，角色有夠平板，根本是個爵士阿宅！\n\
  　連他開的那骨董車都還比他的角色帥多了(聽起來保養很好啊)！\n  一開始想說這好像是歌舞片？不合理就算了____越看又越不像歌舞片，\n  不但歌舞不好聽，也只有開頭比較多而已。\n\
  \n  看到有影評說這是故意要諷刺這就是個輕浮虛假的老梗假浪漫，好像就說得通了，\n  不然真的是破綻也太多了。\n\n  如果沒有最後結局的話，可能會直接把這部片打負雷吧！\n\
  　很多人不滿的結局正是這部片唯一挽回整部片的畫龍點睛之處啊！\n\n　如果艾瑪就真的只靠那些本事就能一片而紅，這真實嗎？\n  對一個音樂人來講，開一家爵士酒吧真的好過發發唱片巡迴演出？　\n\
  \  只有對一個田僑仔來說才可能更好吧，而且最後酒吧的鋼琴手也不是他自己～\n  那他在懷才不遇什麼？\n\n  其實這部片有些地方讓人想起夜行動物，真正精采的都不在螢幕裡面，\n\
  \  很多都是需要些....也許是歲月或觀影經歷，才更能體會影片沒拍出來的部分..\n\n\n\n\n  不過最後我還是想說，真的是最美演出的愛馬撐起了這部片，\n\
  \  不然不管導演真的有什麼意圖，恐怕有些觀眾(至少我如此)絕對無法看到最後呢。\n\n\n\n--\n  很多小地方喔! 比如說愛馬party出來車被拖吊，上面寫的是深夜到天亮禁止停車XD\n\
  \  很少有這種禁停法吧! 看背景也看不出來有此需要，朋友也都忽然不見(各自釣到魚?)\n  諸如此類，有很多小地方牴觸生活常識，會讓人馬上覺得哪裡怪怪的!\n\
  \  如果出現在歌舞片段中還可以不理會，但是非歌舞片段出現的也不見得少。\n\n  至於最大的bug可能是，本片的代表歌之一Late For The Date，這是jazz嗎？\n\
  \  我想連jazz外行人都聽得出來這絕對不是jazz。(至少不是Seb口中所謂的jazz)\n  要說這只是兩人的代表歌，因為Mia並不愛jazz，但是....注意到，\n\
  \  這首歌不僅僅是兩人的相遇歌，也是Seb認識Mia前在職場抒發懷才不遇時，\n  冒著被fire的風險(也真的因此被fire)也要彈jazz時所彈的夢想代表作！\n\
  \  但是這首歌卻不是Seb所謂的pure jazz，這合理嗎，作為他被fire也要彈的歌？\n\n  就是諸如此類跟常識相悖的小bug太多，人物也充滿行動跟邏輯的不一致，\n\
  \  讓你就算沒意識到也會感覺不自在，\n  如果如某些影評大大所說這就是導演刻意要營造的虛假不真實感，\n   (就像做夢的時候會出現很多反常識，熟面孔變成超人or反派，大家都會飛)\n\
  \  以呼應片名LA LA LAND是個夢幻虛假之地，這種不自在感確實營造得很成功。\n  這其實是任何創作早就討論到爛的問題，就算奇幻世界也是有設定，有自己的邏輯。\n\
  \  像Mia的夢想是劇作家，但她創作劇本的鏡頭幾乎沒有，只有經常去試鏡，\n  也沒讓觀眾一窺獨幕劇的內容，只有從觀眾口中側面得知有人認為她的劇很爛。\n \
  \ 她最後一次試鏡要她即席創作，但她只唱了一首歌，以劇作而言真的及格嗎？\n  五年後她也不是成為劇作家，而是電影紅星，而且很可能是因為有錢老公幫忙。\n  如果這不算夢想跟行動上的邏輯錯亂，那可能本片劇作家的定義跟常識就很大不同。\n\
  \  至於Seb的部分前面其他篇有更懂音樂的大大回應過了，\n  Seb口口聲聲要復興pure jazz，但他彈了那些jazz？他不是超會彈琴嗎？\n  最pure\
  \ jazz的反而是他帶Mia去燈塔聽的那一幕而已，這不是很奇怪嗎？\n  Sorry誤植，應該是Late For The Date！　不過這首更絕對不是pure\
  \ jazz了。"
