title: '[好無雷] 樂來越愛你'
content: '似乎還沒有人發文

  小弟拋磚引玉


  會注意到這部電影的人

  大部分都是被看女主角與音樂吸引

  但其實劇中還有許多歌舞劇


  艾瑪史東很漂亮

  雷恩葛斯林也很帥

  音樂也非常好聽


  但這並不是一部就只有這些的電影

  片中諸多情侶相處細節

  熱戀是片中的一環

  爭執也是真實感情的一塊

  值得情人們借鑑


  我非常喜歡結局

  但這也相當吃重個人的經歷

  青菜蘿蔔各有所好

  不過礙於無雷，所以無法多加詳述


  發文的此時，人正在捷運上

  耳裡是李宗盛的飄洋過海來看你


  「陌生的城市啊，熟悉的角落裡

  也曾彼此安慰，也曾相擁嘆息

  不管將會面對什麼樣的結局


  在漫天風沙裡，望著你遠去

  我竟悲傷得不能自己

  多盼能送君千里，直到山窮水盡

  一生和你相依」


  推薦給大家。


  --'
