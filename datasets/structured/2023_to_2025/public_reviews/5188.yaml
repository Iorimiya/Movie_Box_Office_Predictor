url: https://www.ptt.cc/bbs/movie/M.1481544938.A.197.html
title: '[新聞] 樂來越愛你 艾瑪史東看6遍'
content: '網址：



  （中央社台北12日電）電影「樂來越愛你」在廣播影評人協會獲最佳影片等8獎成最大贏

  家，艾瑪史東帶頭一看再看，她說「我自己就看了6遍」。


  「最佳銀幕情侶」艾瑪史東（Emma Stone）與雷恩葛斯林（Ryan Gosling）主演的年度愛

  情電影「樂來越愛你」（La La Land），上週五台美同步開片。


  美國於5家戲院限定上映，截至目前累積了85萬5000美元的票房，並創下單廳17萬1000美

  元的亮眼數字，打破紀錄成為2016年單廳票房冠軍。


  電影公司表示，在台灣首週末平均滿廳率則高達9成，網友紛紛以「準備來二刷」、「今

  年最好看」、「哭了好幾次」、「浪漫到無可救藥」等在臉書及IG給予好評。


  艾瑪史東說，「我自己就看了6遍，我帶媽媽和祖父母去看，結果把我們全家都弄哭了」

  。


  今天第22屆廣播影評人協會獎頒獎典禮上，「樂來越愛你」抱回最佳影片、最佳導演、最

  佳原創劇本、最佳歌曲「City of Stars」、最佳配樂、最佳攝影、最佳剪輯、最佳製作

  設計等8項大獎成為最大贏家。


  「樂來越愛你」劇情描述落魄的爵士鋼琴家賽巴斯汀（雷恩葛斯林 飾）與懷抱明星夢的

  小演員蜜亞（艾瑪史東飾）相遇相知，相愛相惜，一起在充滿可能的洛杉磯互相扶持，追

  逐夢想。但是，當他們逐漸邁向成功，現實的壓力卻磨損了原本美好的愛情，兩人的關係

