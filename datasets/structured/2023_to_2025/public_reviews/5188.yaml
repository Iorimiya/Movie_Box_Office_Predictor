title: '[好雷] 樂來越愛你'
content: '愛，沒有一定的答案，

  就像Sebastian Wilder和Mia Dolan沒有絕對。


  回憶是甜的，走過冬春夏秋的五年後，

  兩人ㄧ抹微笑，但那上揚的幅度，彼此努力追逐的夢想達成實踐，卻始終回不到那季的溫

  度；停下來的刻度，致上最真摯的告別。


  『有種愛，是將彼此陪伴成長解決任何棘手問題，白頭偕老；另種愛，是將你的最愛，成

  就對方勇敢追尋熱忱的夢想，遺憾祝福；緣分就是，對的時間遇到對的人。』



  g



  --'
