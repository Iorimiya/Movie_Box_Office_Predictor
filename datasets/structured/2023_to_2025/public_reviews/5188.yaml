title: '[新聞] 金球獎入圍名單出爐　《樂來越愛你》提名'
content: '新聞網址：


  金球獎入圍名單出爐　《樂來越愛你》提名大贏家



  第74屆金球獎入圍名單揭曉，音樂愛情片《樂來越愛你》入圍音樂喜劇類影片、影帝后等7


  獎，也是電影類入圍最多的片子。劇情類電影入圍最多6項的，則是《月光下的藍色男孩》


  。



  《樂來越愛你》提名的7個獎項，包含音樂喜劇類最佳影片、導演、劇本、男主角、女主角


  、音樂、歌曲等，現正在台灣熱映中，反應相當好；而同樣音樂喜劇類的《走音天后》，


