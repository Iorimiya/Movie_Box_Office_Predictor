url: https://www.ptt.cc/bbs/movie/M.1482858878.A.741.html
title: 'Re: [負雷] 樂來越愛你-別拿夢想污辱愛情'
content: "單純針對第一段回覆。\n\n\n\n先姑且不論妳對於劇情如何解讀，但即便本劇確實訴說著麵包比愛情重要，\n\n我也不認為是真正影響好評或負評的原因，\n\
  \n因為我以為電影本來就不應背負價值觀正確與否的包袱。\n\n\n\n一部非主流 (或大眾觀點認為不正確) 價值觀的電影，不代表就是糞作，\n\n影響電影好看與否的元素我認為是劇本、編劇、運鏡、演技、音樂等諸多因素。\n\
  \n否則照妳的邏輯，一部拍得非常棒、選角超好演技絕佳的變態殺人魔恐怖片，\n\n會因為片中劇情可能可以被解讀為帶有宣揚 (?) 變態殺人的價值觀，\n\n而就是爛片嗎？\n\
  \n\n\n老實說，在看到吵架那幾幕的當下，我就跟坐在一旁的女友說：\n\n   「妳看這女主角只想吵她在意的點，卻忽略了當下的現實，\n\n     以及是否因為愛對方而能夠體諒跟站在對方的角度去想；」\n\
  \n   「她只有把那太用力的愛，一股腦的用自己認為是對的方式宣洩而出。」\n\n\n\n但總結來看，以上完全不影響本劇被我評為好片，\n\n因為這部片從片頭開始就很明顯的以女主角的視角開始拍，\n\
  \n可以理解本來就帶有 Mia 的本位想法和夢幻元素 (看那歌舞阿!)，\n\n以及隱含著...\n\n    真愛在很多時候都無情地得要跟麵包拉鋸；\n\n\
  \    即便是真愛，但在五年間 (我認為很長) 就能全然不同，\n\n    或許 Mia 在出國後又跟 Seb 大吵一架也說不定 (又沒拍出來)；\n\n\
  \    以及，每個人都不斷地在做出各種往後可能會後悔與惆悵的選擇...\n\n等不同元素。\n\n\n\n我完全可以理解許多人可能不認同 Mia 的價值觀，\n\
  \n(我原本以為生氣的會是剛被當作工具人甩了的悲憤宅 XD)，\n\n但把 Mia 在劇中的價值觀套到電影好看與否，我覺得就有點可惜了，\n\n有時候就像看藝術品一樣，往後站一點，看到的才會是全部的風景。\n\
  \n\n\n以上淺見。\n\n--"
