url: https://www.ptt.cc/bbs/movie/M.1485908221.A.3DF.html
title: '[新聞] 樂來越愛你賣破億 限定推IMAX版'
content: '新聞網址：


  樂來越愛你賣破億 限定推IMAX版


  2017-02-01 03:17 中央社 台北31日電


  音樂愛情電影「樂來越愛你」女主角艾瑪史東美國演員工會獎封后。發行商CatchPlay今

  天宣布全台票房破億，將推出IMAX版本，今年2月17日至3月2日限定上映。


  「樂來越愛你（La La Land）」在台掀起一股「拉拉鏈」旋風，熱映至今全台票房正式突

  破新台幣1億元，CatchPlay宣布將推出IMAX版本，全台2月17日至3月2日限定上映，以及

  IMAX特殊限定贈品，將隨場次公布。


  艾瑪史東（Emma Stone）以「樂來越愛你」先後抱走威尼斯和金球影后，昨天又在美國演

  員工會獎封后，身穿一襲蕾絲繡花禮服上台領獎，限時致詞則讓艾瑪史東緊張得語無倫次

  ，逗得全場哈哈大笑。


  致詞時，艾瑪史東感性說道，「在這個混亂的時局，我很感激能成為在座各位的一份子，

  一群願意反映社會現況，並為世界帶來喜悅和希望的人」。


  艾瑪史東感謝男主角雷恩葛斯林（Ryan Gosling）時，直接對台下的雷恩葛斯林喊話「你

  最棒了，無庸置疑」，只見雷恩葛斯林害羞摀嘴偷笑，兩人台上台下互動可愛又吸睛。


  「樂來越愛你」聲勢紅不讓，金球獎抱回7獎打破紀錄；獲奧斯卡金像獎最佳影片、導演

  、男女主角等14項提名，追平「鐵達尼號（Titanic）」與「彗星美人（All About Eve）

  」保持的紀錄，頒獎典禮2月26日登場。




  --'
