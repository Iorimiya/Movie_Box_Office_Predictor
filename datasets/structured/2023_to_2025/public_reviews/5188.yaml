url: https://www.ptt.cc/bbs/movie/M.1482840650.A.A66.html
title: 'Re: [負雷] 樂來越愛你-別拿夢想污辱愛情'
content: '你的怒火跟我看法幾乎一致


  我也很不能認同女主角


  上班遲到、約時間衝突、約會一半跑掉、人家追夢想連賺錢都不行…等


  不過我是覺得很好看


  整部可以說是女主角的第一人稱


  而整部電影的精華就是女主角的遐想


  女主角在很多地方都有毫無邏輯的想像


  講的是一個平凡人的生活穿插做夢


  平時做個小工作 偶爾實踐夢想


  在實踐夢想的時候害怕別人眼光


  遇到朋友邀約難以拒絕、就連類似情侶的關係也沒明確拒絕


  生活處於很將就的模式


  轉折點就是遇上男主角 看著男主角為了自己夢想努力


  而女主角自己也拼搏了一把


  辭職自己花錢演戲


  雖然當下沒得到很好回應 但至少算是個好結尾


  女主角結尾就如同男主角履行夢想的必經之途一樣


  女主角就如同追隨著男主角的腳步似的


  從追求夢想到實踐夢想


  開店要錢 所以暫時不能只做自己喜歡的工作


  女主角演戲本來就會四處跑 也必須捨棄一些東西


  男主角追求夢想硬是要亂彈失去工作


  女主角追求夢想辭去了工作


  但最後兩人都各自完成了自己的夢想


  愛情是主題嗎？我想不是


  愛情只是追求夢想中必須捨棄但難以割捨的


  但不足的地方 都被女主角的幻想給充實了


  夢想跟曾經最愛的人生活很過分嗎？


  我是覺得常常幻想跟女優%%%也不算過分啦


  這是一部鼓勵追求&實踐夢想的電影吧


  --'
