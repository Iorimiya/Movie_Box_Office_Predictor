url: https://www.ptt.cc/bbs/movie/M.1481605322.A.0BF.html
title: '[好雷] 樂來越愛你 '
content: '圖文心得同步刊載於




  身為萬年去死去死團，愛情文藝片素非個人心頭好，例如著濕身襯衫的猛男在海邊抱著女


  主角轉圈圈(為何沒被海嘯捲走)；再如總裁帶女主角坐直升機到豪宅玩打屁屁遊戲(手持


  狙擊槍擊落直升機)；或男主角驚覺女主角才是真愛，好好的車子不坐，偏偏一路狂奔至


  機場訴情衷(祝你腳抽筋)；又可能互相誤會的兩人，隔著門扉緩緩無力滑坐地板，內心泣


  訴：「世界上最遙遠的距離，是我就站在你面前，你卻不知道我愛你。」……乾太矯情了


  ！趕快拿去做雞精！！把他們通通拿去做雞精！！！



  然而，《樂來越愛你》跳脫傳統愛情文藝片窠臼，以繽紛燦爛的美術設計、豐富多元的音


  樂元素，幽默風趣的台詞對白，並融合經典老片復古橋段，交織出一部不落俗套，兼具藝


  術價值與商業娛樂的傑出佳作。



  觀看此片時，伴隨歡暢節奏，我全身心融入角色情感，彷彿跟著他們在洛杉磯著名景點走


  了一回，於其喜怒哀樂的人生軌跡上繞了一圈，全然跳脫個人意識現實層面，電影落幕、


  如夢初醒，嘴角上揚卻帶了淡淡傷悲。



  《樂來越愛你》打著歌舞片名號，但歌曲與舞蹈穿插時機恰到好處，未顯突兀。不似迪士


  尼公主動畫系列，時時刻刻都像嗑了藥般聲嘶力竭唱歌，唱出滿屋子蟲蠅鳥獸。



  無論是男主角雷恩葛斯林(Ryan Gosling)或女主角艾瑪史東(Emma Stone)，其歌舞表現都


  令人驚訝。那段兩人三度相遇，在灑滿銀色月光下的輕快雙人踢踏舞，令人永難忘懷；還


  有艾瑪史東飾演的蜜亞，在關鍵試鏡演出時，以樸實歌聲唱出彷彿結尾預兆之動人樂曲，


  讓人深陷其中，久久無法自拔。



  雷恩葛斯林的長臉搭配過於集中的五官，始終不是我的菜，每每見其現身螢幕，我就會湧


  起賽馬押注的衝動(喂喂喂)。



  可是角色能改變觀眾對演員的印象，當他在電影中任憑髮絲垂落額頭，頹廢而熱情地即興


  彈奏鋼琴時，那落魄吟遊詩人的形象，反而勾起我心中絲絲愛意。之後他事業發達，穿上


  量身訂製的筆挺西裝，更讓人湧起剝下西裝的衝動！！！(被警察拖走)



  而艾瑪史東的每件服裝皆美不勝收，看完電影會想馬上跑去信義新天地採購，然轉念想想


  ，時尚的完成度在於『臉』，還是放棄吧(默默收起信用卡)。



  《樂來越愛你》劇情十分單純，轉折切換卻巧妙無比，失意鋼琴家和咖啡廳女侍應在彼此


  鼓勵支持下，各自追尋人生夢想。隨春、夏、秋、冬季節轉換，相愛的兩人漸行漸遠，終


  究踏上相異的人生道路。



  終幕不經意的巧遇，仍如童話場景，有太多可能、如果、早知道皆隨樂聲散去。不那麼刻


  意悲傷的相遇，卻令我靜靜流下遺憾的眼淚，並思考著人生中那些似曾相識的可能、如果


  ，和早知道。



  然而，思考無意義的可能性只是徒增傷悲，正如男女主角微笑目送彼此離去，與其流淚，


  不如在歸程的路上輕快跳曲踢踏舞吧(不會跳踢踏舞，也可以去大安公園跳土風舞)。


  --


  狡螺三窟






  --'
