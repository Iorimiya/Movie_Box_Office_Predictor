url: https://www.ptt.cc/bbs/movie/M.1481382238.A.7DA.html
title: '[好雷] 樂來越愛你－暖上心頭的繽紛晚宴'
content: "作為艾瑪史東的粉絲，不得不說觀賞這部片有很大部分是衝著她前去。當我得知本片導演\n\n同時也是《進擊的鼓手》導演時，對於本片的期待又更上層樓。對於個人而言，能夠於釋\n\
  \n放壓力的周末時光觀賞此片可說是非常幸運。如果覺得生活缺乏動力，或是想帶給自己歡\n\n快的心情，甚至想一賭威尼斯影后的風采，欣賞《樂來越愛你》將是個相當合適的選擇。\n\
  \n\n-------貼----心----防----雷----線-------------------------------\n\n\n\n\n\n\n\n\n\
  \n\n\n\n身為一部以歌舞劇為主軸的影片，最怕的是為唱而唱，將劇情切得支離破碎，甚至喧賓奪\n\n主奪去了影片本身要傳達的主題。然而，本片將歌舞與劇情的比例拿捏得恰如其分。其中\n\
  \n，色調的部分是個人最為欣賞的部分。《進擊的鼓手》中，導演將昏黃色調使用得極為出\n\n色。於此，導演則是將場景間的色調切換做得如火純青，隨著艾瑪史東身上不斷換著的服\n\
  \n裝，觀眾彷彿置身於一場華麗的服裝秀，被各種繽紛的色調服侍得不亦樂乎。而燈光的聚\n\n焦與收放也是一大看點，隨著幕亮與幕暗之間，觀眾得以將目光注視於演員的表演上，沉\n\
  \n浸於電影的世界中，體驗故事角色的喜怒哀樂。\n\n\n\n說到歌舞劇，不得不提的絕對是歌舞方面的展現。由開頭的公路群舞即可看出本片對於歌\n\n舞方面的重視，無論是運鏡、歌唱、舞步都可說是相當賞心悅目。而男女主角的重點歌舞\n\
  \n更是會讓螢幕前的觀眾跟著節奏律動，無論是初次漫步的夜景之舞 (A Lovely Night)，\n\n或是縈繞於耳際的繁星之城 (City of Stars)，都使人留下深刻印象，甚至終幕時仍黏在\n\
  \n座位上聽著片尾名單的配樂，久久不肯離去。\n\n\n\n\n\n\n片中男主角 Sebastian 與女主角 Mia 都有自己想要完成的夢想，只是尚未遇見賞識自己\n\
  \n的伯樂。對於 Sebastian 而言，爵士樂就是他的一切，而開間爵士餐館則是他畢生想要\n\n完成的終極目標。另一方面， Mia 則是希望成為一位女演員，即便為此必須在片場旁的\n\
  \n咖啡廳工作也在所不惜。然而，兩人卻在遇見彼此之後，各自遭遇到命運的轉折，開始對\n\n於自己長久以來懷抱的夢想做出妥協與轉變。為了讓她放心，他決定加入流行樂團的巡迴\n\
  \n，儘管那意味者必須演奏自己不喜歡的音樂，但卻能讓生活穩定，不再潦倒。\n\n\n這樣的轉變，於 Sebastian 眼中看來是成長的表現，但對於 Mia 來說，這並非讓原先相\n\
  \n當討厭爵士樂的她喜歡上的音樂，而是放棄初衷後妥協下的產物。幼稚與成長，堅持與妥\n\n協，初衷與現實，愛情中彼此最初的模樣已然於人生中改變形貌。變與不變之間，兩人最\n\
  \n終出現感情上的裂痕，在楓葉轉紅的秋季時節結束這段將近一年的關係。與其說他背棄了\n\n夢想的初衷，不如說他在夢想和愛情之間先選擇了後者，並希望憑藉一己之力牢牢抓握手\n\
  \n中的鮮魚與熊掌。\n\n\n\n\n\n本片的劇情可說是相當單純，以冬春夏秋四個時節來表現男女雙方愛戀的過程。由相識、\n\n相戀、爭吵、分裂、重逢的階段中，同時鋪陳他們遭遇到現實中關於夢想的考驗。雖說\n\
  \nSebastian 對自身的夢想做出妥協，但 Mia 隨即耳聞劇評家毒辣的批評而心灰意冷，決\n\n定放棄自己的夢想。過去六年不斷試鏡失敗並得到冷嘲熱諷的日子讓她心中的堤防終至瓦\n\
  \n解，無法得知何時會成功的恐懼壟罩著她的身心。而當她與前來通知試鏡機會的前男友\n\nSebastian 爭吵時，該段演出可說是極為精湛。一句句「No I am\
  \ not!」不只是對自我的\n\n否定，還有對命運不斷的捉弄感到無力與掙扎的痛楚。畢竟，對於未知的恐懼才是最可怕\n\n的，遲遲無法得到的事物總是令人心慌，無論是夢想或是愛情。\n\
  \n\n「Fall」一詞不僅有秋季之意，同時具有跌倒之意。而兩人的關係便是於秋季宣告破裂，\n\n同樣在通往夢想的路途上摔了重重一跤。《蝙蝠俠：開戰時刻》中曾言：「我們跌倒，是\n\
  \n為了學會將自己扶起。」然而，當 Mia 面臨重大的打擊裹足不前，卻是由曾經被她狠狠\n\n傷害過的 Sebastian 將其扶起。或許，正是因為兩人如此相似，才會巧妙地於最糟糕的\n\
  \n時刻邂逅彼此。對於夢想的堅持，缺乏伯樂的賞識，行走在顛簸不堪的路途上，使得雙方\n\n被彼此散發的氣味所深深吸引，那是股喚作「渴望」的氣息，只有頑固懷抱夢想的人身上\n\
  \n才會擁有。\n\n\n\n\n\n五年後，Mia 再度走進她先前工作的咖啡店。這次，她的身分不再是服務客人的店員，而\n\n是接受招待的電影明星。同樣的地點，角色卻有了劇烈的轉換，而這正是她努力得來的成\n\
  \n果。五年前的試鏡，她說了關於姑姑的故事，一位曾經跳入塞納河因此感冒卻不曾後悔的\n\n女子。或許，追逐夢想的路途上就是需要瘋狂的勇氣，即使會將自己弄得渾身是傷，把生\n\
  \n活搞得一團糟，但不去嘗試，我們永遠不會知道前方的路上等待著旅人會是什麼，無論是\n\n滿口尖牙的火龍或是彩虹底下的寶藏。\n\n\n不久的某個夜晚，Mia\
  \ 與她老公碰巧來到了 Sebastian 開立的爵士餐館，上頭的招牌正\n\n是她當時的構想，「Seb's」的標點還是音符的圖案，店內演奏的爵士也是原先令她愛上\n\
  \n的音樂，一如她的了解，這正是 Sebastian 心中夢想最初的模樣。經過五年，兩人終於\n\n抵達夢想的原點，沒有絲毫的妥協，有的只是歲月的增長和無緣的情份。如果，通往夢想\n\
  \n的道路上並非如此崎嶇，也許兩人會過著幸福快樂的生活。可是，命運注定要讓兩人在最\n\n糟糕的時刻相遇，最終才能夠於最完美的時刻重逢，見證彼此成長以及夢想達成的瞬間。\n\
  \n\n所謂幻想式的美好結局終究只會停留在兩人的想像與觀眾的腦海之中。儘管如此，片尾童\n\n話般的橋段卻足以讓觀眾臉上洋溢著幸福的笑容。畢竟，完美無缺的事物就該停留在美好\n\
  \n的幻想中，帶有缺憾的真實才是兩人胼手胝足實現夢想的路徑。如果說，兩人的相遇是緣\n\n分，那麼兩人的分開與重逢肯定也是緣分。因挫折而起的邂逅，最終則是以彼此夢想的完\n\
  \n成畫下暫時的休止符，使觀眾踏著留白的節奏離去。\n\n\n\n\n--\n               萊恩葛斯林真的有種潦倒的帥感!!! 覺得Emma會動心也是滿合理的XDD\n\
  \               個人很愛最後Emma獨唱的 The Fools Who Dream 真心覺得很棒\n               這部真的滿值得收原聲帶的\
  \ 今年很喜歡的一部片\n               也不能全然說女主玻璃心拉 試鏡六年都被打槍自己寫的獨腳戲又被嘴\n               我是她也會崩潰\
  \ 演員這行真的很看天份 不是說努力就有用的...\n               總是會有一方付出比較多吧 畢竟兩個人是獨立不同的個體 相等滿難的..\n \
  \              這其實是給傻傻懷抱夢想的人的故事 但過程中必然會有得到 有失去\n               得到的 是夢想的達成 失去的 卻可能是真心相愛的彼此\n\
  \               只能說片尾幻想式的童話橋段某種程度也是補足男女主角心中的缺憾\n               這個觀察點很棒!!! 應該是特別安排的小巧思\
  \ 的確前段比較繽紛\n               後段偏向黑白色 說不定是老公不允許她穿得花花綠綠的XDD\n               但不論是黑白還是彩色\
  \ Emma 身上服裝真的都滿好看的\n               當他們在 Seb 被開除的那晚接吻我就笑了 導演真的很了觀眾想要什麼\n        \
  \       尤其當我看到 J.K Simmons 露出喜劇般的笑容更是笑得樂不可支\n               A Lovely Night!!! 這邊的演出非常有趣\
  \ 個人很喜歡 明明說對彼此\n               沒興趣 卻無比關注對方 甚至跳起舞來XDD"
