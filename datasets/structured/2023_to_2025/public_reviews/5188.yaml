title: '[ 好雷] 樂來越愛你：盡力讓每個選擇變得更好 '
content: '因為工作太忙了、因為對歌舞劇有點抗拒、因為很多事情，

  所以在熱潮過後才看了la la land，


  看完後有點心得，小妹想跟大家分享，歡迎討論但怕討打

  因為全文有些碎念，在這裏：



  板上文章節錄正相關內容（以下有雷）：






















  我是防雷分隔線（唱）_________________









  之所以喜歡看電影的原因，來自於每部戲對我來說，都是一個提問。

  《La La Land》太紅了，紅到我這個每次看歌舞劇，心裡都會浮出「他們幹嘛不好好說

  話」的庸俗女子，都應著買票進場看戲。


  剛看完拉拉鍊，其實心裡是不喜歡的，完全不懂這種愛情跟夢想之間，非得有所選擇的戲

  碼到底是從何而來，難道我不可以選擇愛情、同時擁有夢想嗎？另外心裡也對女主角的選

  擇有所怨懟，上一秒還說我永遠愛你，下一秒立刻跟別人生了孩子，真心超級不解，「永

  遠」的廉價程度，跟路邊賣的190毛衣差不多價格。


  回來想了一天，真的是一天，對這部片才重拾喜愛（或許也不到喜愛吧，但就覺得沒有剛

  開始看完感覺那麼糟）。


  先說在前頭，我不是電影考古系，對於單一文本（意即本電影）內所包藏的隱喻、借用、

  致敬，我很常是看不出來的，但這並不影響我看戲的價值與判斷。


  對我來說，看戲是這樣的：看完了，心裡有所感、有個角度討論戲的內涵，那很好；有考

  古專家分享我看不出來的知識、細節，我可以理解得更多，那更好。僅此而已。



  ＊有關愛情：人生的真愛到底有幾個？


  結局是Mia結婚了，但新郎不是又帥又真誠又傻又固執又有才氣的Seb，瞬間讓電影院的觀

  眾下巴掉光。


  在每個場次裡估計都有一半的人會在現場，用柯南的方式往前回推發現，Mia極有可能在

  說完“”I will always love you." 之後一年就懷孕（哈哈哈哈）。這設定「異軍突起」

  ，在這部戲的音樂、夢想、現實跟致敬之外，成為一大討論點。


  大家不爽啦，紛紛失控表示「你上一秒說真愛、下一秒跟別人結婚、小孩還這麼大個，你

  的真愛到底算什麼？」（來賓在這裡點播一首愛情的騙子）


  或許在戲外，小女子可以分享一下身為一名女子，認為真愛到底算什麼的千古難題。


  先給個前提，我認為人生的真愛可以有很多個。


  而之所以會有很多個的原因來自於：人生的每個叉路都是單選題。在這條路上我們選了Ａ

  就沒有Ｂ，所以你無法在當下（或未來的某一天）確認「那時的自己，是否真的做了最好

  的選擇。」也因此，人才會後悔、不斷的後悔（進而創造各種雋永的文本）。


  唯一防止自己不要後悔的方法，或許我們可以改寫一下日劇月薪嬌妻裡的這句話：「我們

  都不是誰的命中註定，所以才要努力成為對方的命中註定。」套用它的句型，你可以這樣

  解讀：「我們都不知道這個選擇是不是最好的，所以才要努力讓選擇變成最好。」


  回到戲裡頭，我認為Mia曾經為了讓「當下的選擇成為最好」努力過。她等門到凌晨、她

  找不到男友時留言、她為了他跟母親保證「現在還不是很好，但未來一定不可限量。」


  可惜相遇的時間不對、在一起的時候可能夢想比愛情更偉大，而LA到巴黎的距離絕對會謀

  殺愛情。總總負面因素加總，讓這個選擇即便是真愛，也只能在前頭加個「曾經」。


  因此，如果你願意付出，就算你在25歲、26歲、26歲半都「遇見真愛」也不無可能，只是

  時間跟總總因素，讓彼此錯過。也因此，接續而來的問題是，「我們一定能跟真愛結婚

  嗎？」或是「你怎麼能確定，你結婚的對象就是真愛？」


  我認為結婚跟真不真愛有關，但同時結婚跟天時地利人合或是八字也脫不了干係（在多元

  成家的時代裡，還得再加上法律制度）。


  所以Mia一年後結婚，也極大可能是時間對了、剛好有小孩、新婚對象也喜歡爵士樂，或

  是他是她在巴黎的真愛。不管是什麼鬼鬼怪怪的理由，總之「婚姻是真的，理由是假的。

  」


  既然如此，我們又何必在意是不是跟真愛結婚、又會跟誰走到最後呢？如果你已經努力過

  ，努力讓當下的選擇不後悔，那即便徒勞無功，也無所謂了。


  或許人生擁有的，不管是紅玫瑰還是蚊子血、是白玫瑰還是飯黏子，怎麼樣都會讓人有遺

  憾，畢竟只要你有選擇，那個被你遺落的，就成為心中最長的電影、最美的遺憾與幻想。



  ＊有關夢想：這條路上大塞車，你憑什麼可以先走？


  開頭的一場塞車場景，其實把故事唱完了。女孩唱的是，為了夢想她放棄那個等待她的大

  男孩、她待在每天都是晴朗天氣的LA，就是希望能再靠近夢想一些、總有一天美夢成真。


  她唱著唱著，從車子裡竄出來、跟他有同樣理想的年輕人，少說成千上百。他們都在同一

  條往LA（也是夢想）的路上，乖乖的塞在車陣裡，寄望自己有一天可以搭著直昇機飛走。

  但天下有夢想的人何其多？跟你有同樣夢想的人也是一牛車，你也沒有比別人不努力，究

  竟為什麼，得道升天的人是他不是我？


  我相信你我都曾經有一樣的疑惑，也因此比起Mia 的美夢成真，我似乎更在意那些在試鏡

  時，跟他穿著一樣白襯衫、黑長褲，外在條件看起來比他更好，最後卻沒有成名的那些女

  演員們。或許是現在的心境投射（畢竟我也不是成功者），也可能是「致敬那些勇敢追夢

  的人」這句大部份心得都引用的副標，讓我變得敏感。


  成功者的故事太多了，多到讓自己懷疑自己「怎麼可能不成功？」又或是也有機會欺騙自

  己「再努力一點，也可以跟他一樣」，用這樣的心態，延伸出「敬勇敢追夢」，這種表面

  是滿腔熱血的互相鼓勵，實際上是互舔傷疤的安慰劑。


  回頭看看《進擊的鼓手》裡，Nelman在比賽前因為巴士拋錨而遲到、最後還車禍受傷以致

  表現失常的現實生活，那才是「懷才不遇」「時運不佳」「無人賞識」的我們啊，人要認

  清，很多時候努力都是白費的、枉然的，所以這世界上才有這麼大量、無名的平凡人存在

  嘛。


  正面回答提問，那究竟為什麼Mia可以先走一步、達成夢想？


  除了（大部份在自己夢想路上努力的人都認為自己有的）實力與毅力之外，就只剩運氣。


  試想，你租了一間戲廳、演一齣戲（這裏你可以套用你寫了一個APP、創了一個事業、寫

  了一百篇部落格文章），就那麼剛好有個名編劇混在全部都是你親友的台下，看出你璞玉

  般的光輝，千方百計非找到你不可，打你電話找不到你居然還知道妳男友電話（這執念超

  深），硬要把你帶到花都巴黎一展長才。


  說坦白話，我覺得這個故事設計真的很諷刺也很復古，完全不脫只有「伯樂才識千里馬」

  的俗套。在伯樂還沒琢磨璞玉之前，一般觀眾、像是在Mia背後奚落故事設計陳腐的那兩

  個人是看不出她的天份的。


  假設這個設計是導演匠心獨具，我真心認為他在操作「運氣比天份或勇敢追夢重要」的概

  念上，狠狠地潑了熱血觀眾一桶冷水。



  最後，回應一開頭的問題，或許也是最重要的問題，夢想跟愛情孰輕孰重？


  對我來說，這兩件事依舊不能放在同一個天平上秤重啊。我可以達成夢想的同時，也擁有

  愛情。我可以選擇夢想、也可以選擇愛情。我可以同時放棄愛情跟夢想（這是怎樣？）。

  總之我想要表達的是，這兩個選擇在每個人的人生裡都不必然互斥，若非要有選擇，那就

  不要後悔。


  導演Damien Chazelle最後在Seb的單音鋼琴聲中，安排了一段「幻想」。幻想的內容是他

  們在每個岔路上，有不一樣的結果。MIa的戲好多人看、Seb沒有錯過那齣戲還獻上了花、

  Seb跟去了巴黎、到家小酒館彈鋼琴，最後他們結婚生子、養兒育女等等等等。


  幾齣歌舞過去，單音鋼琴始終彈不成調。Seb清醒過後、Mia也預計轉身離去。他們在分開

  之前，給了彼此一個瞭然的微笑。


  不管微笑真不真切，至少看來他們都努力讓現在的選擇不後悔。


  祝你我都不只是個會做夢的人。







  _____


  有時碎念、有時寫些看電影或韓劇心得的部落格：



  很少更新但很希望很常更新的粉絲頁：












  --'
