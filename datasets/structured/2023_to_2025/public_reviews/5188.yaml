url: https://www.ptt.cc/bbs/movie/M.1484482082.A.087.html
title: '[好雷] 樂來越愛你'
content: '懇請支持圖文完整版






  經過金球獎橫掃四方的加持，本來鐵齒不想，或著說，不敢看這種閃死人不償命的浪漫愛

  情約會電影的我還是按捺不住好奇心進戲院一探究竟，幸好它果然不是單純的只有所謂的

  「浪漫愛情」而已，而且更可怕的是埋藏在賞心悅目俊男美女甜蜜歌跳舞之下的黯然現實

  。


  好啦，若真要貼近現實，最可能的結局也不會是兩人雙雙完成了自己的人生夢想，更悲情

  的下場要有多悽慘就有多悽慘，畢竟是電影，編導Damien Chazelle下手還算頗知輕重，

  也沒有打算毀掉那一點僅存的夢幻，讓這份遺憾多少還是有點美美的。


  先不提男女主角兩人的命運發展，反正編劇三更拆CP，豈能留人到五更，今天他老兄擺明

  就是要拆掉這對CP來虐一下觀眾，你也無可奈何。在前作《進擊的鼓手》就已經充分展現

  了他可以將一個簡單小巧故事用高張高壓的剪輯節奏把兩個充滿魔性藝術家的對峙拍得淋

  漓盡致、過癮無比。本來夢想成為音樂人的 他，拍起音樂歌舞劇更是得心應手，光是開

  頭那段一鏡到底的高速公路歌舞特技就足以令人撟舌不下，俯拾即是的古典歌舞劇致敬，

  精緻又恰到好處的節奏拿捏，流暢的長鏡頭也不只開頭一處。歌曲不算太多，卻每一支都

  富含深意，就算是同樣的主題曲重複，也各有不同的椎心刺骨。所有隱隱暗示結局的細節

  事後回想起來也是令人毛骨悚然，不寒而慄。


  除了愛情之外，其實編導更想向那些為了夢想、維護傳統、永不放棄的人們獻上敬意，也

  想向那些逐漸隨著時間而流逝的經典默哀。他們可能犧牲了很多東西，換來的卻未必是幸

  福美滿的結局。同時他也有點大膽的諷刺了好萊塢的紙醉金迷，多少女孩為了一圓星夢，

  為了擠進那道揚名立萬的窄門，甘願在距離片場幾步之遙的咖啡廳打工，嘗試著一次又一

  次的小角色試鏡，同時晚上還要打扮的花枝招展，前往參加一個又一個並不情願的奢華派

  對，好像在等著哪個有力人士的潛規則垂青。而擁有才華的人也只能在潮流後頭跟隨、迎

  合觀眾的口味、拍出一堆奇怪的照片，無奈的向現實妥協，因為坐著白日夢的小孩終將成

  為低頭的大人，總是要學。


  愛上那個為了夢想義無反顧的男孩，女孩卻又無法眼睜睜的看著他勉強自己上台。這場爭

  執有些突如其來，可是不知為何，男孩卻又無法敞開胸懷，拉不下臉說我一切都是為了你

  ，為了我們的將來。當然觀眾也或許無法去苛責女孩，畢竟她也有她的壓力和失敗。或許

  他們倆真的是彼此這輩子的真愛，即便女孩最後真的名揚四海，但她當初質問男孩的問題

  ，是否也一樣可以套用在五年後的自己。她看似有個美滿的家庭、有可愛的女兒，也完成

  了自己的夢想，但她真的開心嗎？當然，如果真要繼續維繫感情，聚少離多又如何？男方

  巡迴全世界演出又如何？女方在巴黎追尋電影夢又如何？電影雖然故意拍的復古，但也畢

  竟是個人人都有智慧型手機的年代。可是不管這五年中間到底發生什麼，兩人終究還是分

  了開。這對CP拆不拆，真的就只是在編劇的一念之間。或許有點薄弱、有點為拆而拆，但

  想想現實的世界，分開的理由多的是更瞎更爛。至少他們也不算是不歡而散。他們在最低

  潮、最谷底的時候相遇，互相激勵、互相拉抬，最後乘載著彼此的祝福朝著自己的夢想邁

  開。在最後那一段幻想之中，如果一切都這麼順遂、這麼圓滿，沒有挫折的攪局，沒有抉

  擇的兩難，或許今天真的就是他們倆攜手走向紅毯的另一端。但也難保某一方為了另一方

  而妥協，在某一天午夜夢迴，突然又暗自後悔，畢竟人性就是這樣犯賤。


  說起來，或許這對同樣都是藝術家的男女就跟《進擊的鼓手》那對師徒一樣，他們是天作

  之合、注定遇見彼此，互相激盪之下，雙雙入魔，站上人生的高峰之後，卻注定還是水火

  不容、分道揚鑣。又像《戀夏500》，剛好片中也是同樣經歷一場寒暑，冬去春又來，這

  個在人生道路上錯身而過的人，只是另一個幫助自己走向不同結局的課題和成長。


  這麼一想，到底Damien Chazelle的生涯遇過什麼創傷，讓他老是寫出這麼可怕的故事來

  ？




  也歡迎光臨本魯的臉書專頁按一下，大大一生平安





  --

  段譽一見之下，身上冷了半截，眼圈一紅，險些便要流下淚來，心道：「人道習主席是人

  中龍鳳，果然名不虛傳。馬先生對他如此傾慕，也真難怪。唉，我一生一世，命中是注定

  要受苦受難了。」他心下自怨自艾，自歎自傷，不願抬頭去看馬先生的神色，但終於忍不

  住又偷偷瞧了他一眼。只見他容光煥發，似乎全身都要笑了出來，自當選以來，從未見過

  他如此歡喜。兩人已走近身來，但馬先生對段譽視而不見，竟沒向他招呼。段譽又道：「

  馬先生心中從來沒有我這個人在，從前就算騙我投票給他，心中也只有他主子。」


  --'
