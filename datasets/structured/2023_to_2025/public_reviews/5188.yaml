url: https://www.ptt.cc/bbs/movie/M.1483379435.A.971.html
title: '[ 負雷] 樂來越愛你觀後感'
content: '以下有劇情雷













  開頭的塞車我是覺得可以比喻人生需要常常停止在某一個階段

  而載歌載舞是這個社會所有人的夢想和期望

  一個人性本善，雖然過著乏悶（塞車）的生活，也要帶著夢想跟熱情，而在人生的道路上

  （行駛開始）或許遇到一個難忘的人，一段難忘的回憶，就這樣不期而遇


  隨著故事的發展

  一步步你我大概都能瞭解的戀愛鋪陳情節

  兩個人從不相識到相愛，曾經迷失自己又或是為了追求夢想做的種種選擇和調整

  主角心境的轉折在劇情與演技中不難理解


  裡頭男主談的爵士，不同的演奏者各自發光但又能激發形成一種互相配合的音樂


  兩人相識的那個旋律


  先是表現出男主無法被世俗接受的熱情

  再來是女主感應到一樣是有志難伸的另一半


  仔細來看旋律本身，一開始低，中間再帶點希望，但又好像夾雜著憂鬱和熱情


  人生又可以來繼續置入這個貫穿的音樂

  有高有低，有急有慢

  也比擬愛情最終必須做出一些犧牲

  一些現實面，等到你真的知道愛一個人

  不論幸福與否，不論有沒有

  那會化成一份心意，一抹微笑

  笑的深刻卻複雜牽強

  但那都將是只屬於他們兩個人的空間


  說起來好像真的是滿好看的片

  但我個人實在說不出為什麼一直覺得它有夠難看，或許我不懂得更深的細節無法體悟，他

  真的不是爛片，但我個人看完就是有夠不喜歡

  前半段甚至還差點睡著


  我也是很納悶到底是哪裡出了問題

  只能說裡面的音樂，劇情，鋪陳，手法，轉折

  完全沒有給我任何滿足的感覺囧..


  或許未來再看一遍就會有不同的感想囉～


  --'
