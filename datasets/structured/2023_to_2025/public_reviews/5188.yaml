url: https://www.ptt.cc/bbs/movie/M.1482831773.A.CC0.html
title: '[好無雷] 嗑電影:樂來越愛你'
content: '~~樂來越愛你<愛上Emma Stone>~~

  "她、雪和塞納河"

  .

  圖文護眼完整版與其它電影，歡迎上：


  .

  看完本片，

  聯想到的第一部電影居然是2011年的那些年…

  只是兩部片在主角演技、編導敘事的功力上的差距還是有一段…

  之所以會想到它，

  主要就是柯騰在最後所說的那句話…

  也想到了很久之前所聽過的，

  由作家苦苓所出的一套有聲書，

  有聲書談的不是別的，就是談論"愛情"

  愛情，就是四種因子：

  無因、無求、無怨、無悔

  前三個都很好參透，"那些年"也能感受所謂的無怨…

  但是即使年近四十，無悔，仍舊是難以參透的謎…

  但是在這片的最後，

  兩位主角淺淺的微笑，

  我似乎感受到愛情中的那份無悔的成份了…

  能參透到此一精神，

  人生也算無怨無悔了吧~~

  .

  很難想到這片的編導的前作是比較偏人性黑暗面的"進擊的鼓手"

  這片，就明顯的光亮且充滿希望的多了，

  雖然依舊是由好萊塢出產，

  歌頌夢想成真的過於理想化故事，

  但是人們，就是愛看這種故事啊…

  這也是人們進戲院觀賞電影的主因啊~

  所以比較前作，我更喜歡這部，

  再加上充滿想像力的結尾，

  又幫這部片加上不少的分數，

  真的很值很進場觀賞的一部電影~~~！

  .

  我個人很欣賞一個演員在鏡頭前做完整的情緒轉換，

  而這片，主演的艾瑪史東因為要試鏡的關係，

  就有很多場這樣的演出，

  也讓我看到了她出色的演出，

  令人折服，也讓我開始愛上她的演出了~

  她真的把一個懷抱星夢的女孩演的十分立體有型，

  每一個劇情階段的演出都是層次分明，

  櫃台前與櫃台後的兩種神情與眼神就充滿戲味，

  真的會讓人愛上她的表演~~

  也恭喜她憑此片拿下威尼斯影展的最佳女主角，

  也期待在2017的奧斯卡有好的成績囉~~~


  --

  Sent from my Windows


  --'
date: 2016-12-27
sentiment_score: 1.0
