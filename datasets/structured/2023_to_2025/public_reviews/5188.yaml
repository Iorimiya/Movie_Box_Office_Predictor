url: https://www.ptt.cc/bbs/movie/M.1482082876.A.62B.html
title: '[ 好 雷] 樂來越愛你 -不只是歌舞'
content: "在只知道是歌舞片的情況下跟女朋友去看了\n以為已經第二個禮拜了不會那麼多人\n結果人還是坐到第二排哈哈哈\n很喜歡裡面的歌舞\n但更喜歡導演所給我的浪漫\n\
  以下防雷\n\n\n\n\n好喜歡整部電影的色彩搭配\n好像重新復古了七八零時尚\nRyan的側分油頭 Emma的亮麗洋裝\n搭配與不輸進擊的鼓手中的爵士曲\n\
  彷彿回到過去\n讓人邊笑著邊參與他們的故事\n\n相愛很簡單 在一起卻很難\n\n原本自己一人\nSebastian\n想頹廢就頹廢\n就算有個爵士吧夢想也只是夢想\n\
  出去打零工也只是為了付付帳單\n\n原本自己一人\nMia\n參與無窮無盡的試鏡\n記得第一場試鏡\n走出試鏡間後\n鏡頭帶到等候的每個女生都穿一樣白襯衫\n\
  Mia生氣的走進電梯時 另外兩個女生也都跟她一樣是紅髮\n在好萊塢\n就是有這麼多人跟妳一樣在等著出頭\n要怎麼打敗她們？\nMia 不知道\n\n在一起之後\n\
  Sebatisan願意為了Mia的夢想犧牲自己的理想\n做自己不喜歡的音樂\n他覺得沒什麼\nMia也願意守候著Seb\n同時做著Seb鼓勵她做的獨角戲\n但最後\
  \ 他們失敗了\n也許陪伴  才是愛情裡最重要的\n而他們兩個\n最喜歡的\n卻是對方追夢的樣子\n\n在最後 互相理解的情況下\n五年後重逢了\nMia 成了巨星\n\
  不再穿光鮮的洋裝 而是黑白小禮服\nSeb 看著她 彈了最後一次City of stars\n配著虐到不行童話般的平行時空故事\n好像在說\n「嗨，好久不見，守著我們的約定，\n\
  \    妳名徹雲霄，我也開了夢想的爵士酒吧，\n    雖然我很希望我們能跟一般的情侶一樣\n    結婚 自己粉刷家裡 生個小孩\n    然而我更希望我能\
  \ 看見實現夢想的妳\n    因為那是妳最燦爛的樣子\n    雖然我們不能在一起了\n    但\n    I will always love you 。」\n\
  \n最後兩個人都送了對方一個笑容\n（這邊我直接淚崩真的太虐啦嗚嗚嗚）\n是啊 這就是我們當初希望對方成為的樣子\n謝謝你 沒有辜負我們的約定\n我們都會過得很好\n\
  \n對了只有我在Sebastian 頂撞J.K. Simmons 的時候很緊張嗎哈哈哈哈哈哈\n\n\n\n\n\n\n\n--"
