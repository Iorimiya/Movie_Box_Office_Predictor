url: https://www.ptt.cc/bbs/movie/M.1484146101.A.7D3.html
title: '[好雷]其實是部恐怖片——樂來越愛你'
content: '聽說LA LA LAND這部電影在金球獎掃了一堆獎，

  準備接著整組人馬搬到奧斯卡繼續掃。

  本盆栽人心中非常不平，決定寫文告訴大家，


  很多人都對這部電影有所誤會，說這是一部浪漫愛情電影，

  但這根本只是片商的噱頭！


  如果有認真看電影，就會發現導演根本是去死去死團的高階領導人，

  從電影一開場，整個劇組根本沒人想給男女主角好結局.  <只有觀眾好傻好天真.>


  講難聽一點，導演連留幾秒鐘的畫面，

  給女主角的室友表現女性友誼的機會都沒有，

  只用一首超好聽、超洗腦的熱鬧歌舞帶過，你說邪惡不邪惡？


  講到這裡，如果你還是不相信，

  沒關係，我們用證據來說話。請看下文條列式。






  網誌連結


  防雷防雷線



















  證據一：開場群舞


  你以為這只是很歡樂開場？大錯特錯！

  導演就是讓這首歌看起來超熱鬧，好掩蓋他真正的用意。

  第一個唱歌的女生歌詞就說得很直接，她在車站離開前男友，

  因為她知道她有必須做的事，就算感情再真摯也無可奈何。


  乍聽之下只是一個小配角的歡樂牢騷，但是如果再配上室友強迫出席宴會之歌，

  馬上就會發現這兩段緊湊的歌舞用意有多深。


  看似艷陽高照，實際上寒風刺骨的冬季大塞車，

  本片殘酷程度從開場就可見一班。







  證據二：室友強迫出席宴會



  這也是一首乍聽歡樂，實際殘酷的恐怖曲。

  室友帶女主角出去玩嗎？錯了，這是一場大屠殺！

  不管是要釣多金帥哥，還是認識知道門路的製作、導演，

  這些女孩子都把希望寄託在一個臉孔未知的陌生人身上，

  希望人群中的某個人能找到他們獨特的一面，

  發掘他們，讓他們脫胎換骨，成為新的巨星。


  準備好你自己的才華，然後找到那個發現你的人，

  這個人不是童話故事的白馬王子，

  而是把你拉出舊群體，讓你脫離舊世界的推手。

  王者，一條無情的不歸路。     <元凰表示認同.>








  證據三：泡湯約會



  當然，上了兩道大菜，

  開始鋪陳浪漫情節之後，導演也不吝繼續用小點心提醒觀眾殘酷的事實。

  男女主角相遇又錯過，再見面的時候兩人一個試鏡失敗，

  一個憋著才華不能發揮，去當派對串場的鍵盤手。

  女主角說她討厭爵士，可是當初她卻是因為男主角的琴聲，

  才會走進酒吧，記住了彈琴人的長相和琴聲。

  男主角說他才不管聽眾去死，但是遇上了女主角卻費盡苦心說服她爵士的好。

  說是聲音吸引兩人認識，不如說是兩人對夢想的熱情吸引同類。


  所以女主角拋下話不投機的豪華晚餐直奔破舊電影院，

  正是因為她要去找那個懂她夢想的人。



  所謂晚餐誠可貴，帥哥價更高，

  若為夢想故，兩者皆可拋就是這樣。    <不知道哪生的順口溜.>


  當然看過電影都知道，電影裡的電影和電影院最後都砸了，

  晚上看的美美夜景，最後也變成光天化日下的現實人生。








  證據四：蒙太奇片段


  這一段很細，主要是兩人夏日熱戀蒙太奇中的兩句話組成。

  男女主角終於開始熱戀，

  男主角用聲勢浩大的喇叭聲迎接女主角出門約會.   <後面還回收當作笑點.XD! >


  但是很不幸的，當兩人座車衝出馬路，

  馬上有人尖叫：『這是單行道！！！』


  而當男主角鼓勵女主角寫作，

  室友詢問這是怎樣的作品，希望湊上一腳時，

  女主角也很自然地說：『這是獨角戲。』



  我的媽媽咪呀，這兩段加起來，

  乾脆叫元凰陛下直接到好萊塢亮背影，下面打經典台詞這樣。


  單行、獨角，再開無雙就能湊成去死標語大三元了。






  證據五：分手戰犯


  五大證據最後，讓我們來找一下害男女主角分手的戰犯。

  答案一共有兩個，現實與夢想。

  這兩個看似不可能合作的兇手，

  事實上根本是白面和腹黑的絕佳拍檔。      <白臉聖+杓臉黑，今天玩的都是龍城梗XD.>


  有人說女主角根本母豬，就是沒看清楚這兩個幕後黑手的可怕。

  男主角為了養婆開餐廳，手滑簽了長期合約賣手藝，

  和現實妥協的一步，殊不知踏進了夢想與現實的陷阱。


  看看兩人熱戀時有夢想當小天使，就算窮也窮開心，

  聚少離多也有電話傳情，鋼琴對唱頤養身心。

  結果男主角不小心在燭光晚餐脫口說要為現實生活出去開演唱會，

  女主角心中的夢想小天使馬上一哭二鬧三上吊，

  煽動原本神仙眷侶變成陌路怨偶。


  更甚者，男主角為了賺錢拍照，忘了力挺女友。

  現實用滿場的空座位加上冷言冷語，硬是甩了女主角兩巴掌，

  把她傷痕累累的身心靈，一路從大城市打回小城鎮。


  在這場愛情關係裡，只要偏離夢想的路，就沒有你的生存空間。

  所以女主角的情淡了，因為男主角為了現實妥協，

  男主角放手，因為他知道女主角有更長遠的路要走。


  這場長達兩個小時的螢幕大計，終於拼上最後一片拼圖，

  留下不朽的都會恐怖傳說，拉拉鍊之星光烙山雞雞雞……




  喜歡愛情恐怖片的朋友，

  趁電影院還有檔期，千萬不能錯過！
















  嗯哼，

  瘋話喇玩了，可以進入正題了. <？>


  寫這篇心得，主要是想跟被我推坑，

  又滿懷惆悵走出電影院的朋友們做個統一解釋。

  本來浪漫輕快的愛情電影，突然間回馬槍刺在觀眾心頭上，

  難免不能接受，充滿怨懟。


  但其實導演早早就把一切告訴觀眾，只是可惜觀眾不能接受呀.QQ

  知音難尋，就算找到了也未必就是一輩子牽手，

  夢想愈大路程愈遠，能夠比肩走到最後的就更加稀少。

  最後女主角一段童話幻想，還有男主角苦澀的回眸，

  許多情感盡在不言中。


  難得相愛卻不能相守，也許到後來不如只是朋友，說不定能更加長遠。

  只可惜戲劇可以幻想，人生卻沒有如果。

  看完金球獎大片風光落幕，不妨再回頭品味一下電影中的浪漫氛圍，

  用不同的心情去看男女主角的悲歡聚散，

  也許在各位逐夢人的心中，又將別有一番滋味。




  以上，明明說要寒流卻還是大晴天裡的電影心得



  誠心推薦給完成夢想、追逐夢想、準備發夢的各種人們，


  來點暖冬中的苦甜參半


  謝謝指教



  --


  謝謝樓上大大補充，我沒去過LA  <掩面.>


  不過也許這也是個梗說不定。

  故鄉四季分明的人，到了一年到頭都像夏天的南方，

  對這種假冬天的環境應該也很不能適應吧XD!

  好萊塢應該多少也是這樣，看起來風光明媚，但其實暗潮洶湧。


  藍色情人節也好看，對於愛情消逝描繪也很棒，雷恩葛斯林根本專業棄夫.QQ

  不過藍色情人節主題是愛情，LA LA LAND的重點我覺得是放在追夢的路，

  愛情是本片包裝的糖衣，甜頭過了就要換苦味了。


  結論：導演超壞




  我是覺得其實反過來想，也可把歡樂的歌舞對比惆悵的劇情，

  是加分，但絕對不是全片主軸。

  說實話我也不覺得這是很正統的歌舞片，就像先前有板上的高人

  也抓出其實片中的爵士也並非男主角強調的傳統爵士。


  像這樣歌舞、愛情、劇情大鍋炒，沒爆炸也真的是編導厲害.WWW


  因為每個賽巴心中都有一個蜜亞......<大哭QQ.>'
