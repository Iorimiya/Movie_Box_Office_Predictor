title: '[討論]《樂來越愛你》爛番茄評價出爐 '
content: "《樂來越愛你》爛番茄連結：\n\n雷恩葛斯林、艾瑪史東三度合作的《樂來越愛你》目前在爛番茄有11篇影評，全部都給極\n高讚譽的好評。電影於威尼斯影展播映以來好評不斷，也有望讓男女主角再度角逐演技獎\n\
  項。\n\n《樂來越愛你》是《進擊的鼓手》導演Damien Chazelle的新作，曾有新聞指出《樂來越\n愛你》的男女主角原本設定為邁爾斯泰勒、艾瑪華森，結果艾瑪華森因為片約過滿而婉拒\n\
  演出，脾氣古怪的邁爾斯泰勒則在討論劇本時與Damien起了爭執，最後邁爾斯憤而離開劇\n組。結果意外促成銀幕情侶雷恩葛斯林、艾瑪史東的再次合作。\n\n《為妳說的謊》爛番茄連結：\n\
  \n另外一部由現實生活中真正情侶麥可法斯賓達、艾莉西亞薇坎德合作的《為妳說的謊》則\n意外評價不佳，目前爛番茄僅有58分，即便是《藍色情人節》導演，三位主角又是入圍過\n\
  奧斯卡獎的演技派，但本片評價出爐時意外讓人跌破眼鏡，可見大家對此的期待度太高，\n才會有所落差，麥可法斯賓達、艾莉西亞薇坎德以及瑞秋懷茲若想以該片再度角逐奧斯卡\n\
  獎，可能有所困難。\n\n--\n歡迎來到我的新家\n白色豆腐蛋糕 \n也來我的粉絲團聊聊天\n白色豆腐蛋糕 \n\n--"
