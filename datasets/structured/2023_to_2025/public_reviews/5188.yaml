title: '[討論] 版上有人也期待"樂來越愛你"的嗎?'
content: '版上有沒有人也期待這一部呢?


  最初看到預告 只覺得歌好聽 畫面很優美 就這樣~


  但是隨著時間的推進 看到這一部在各大影展.電影節


  大放異彩，開始讓我很好奇


  仔細查了一下，發現是音樂劇...


  突然有點小失望，因為本身不是很愛音樂劇的人


  (想到悲慘世界的羅素克洛 簡直是場惡夢)


  可是也對音樂劇類型的電影可以得到如此高的評價感到好奇


  而且導演居然是編導出"進擊的鼓手"的Damien Chazelle阿!!


  而這一部也同樣是由該導演自編自導的作品


  查了一下爛番茄一共有56篇評價 新鮮度96% 重點是均分"8.8"


  有常看爛番茄的都應該知道這個均分真的很驚人


  metascore也有91分


  台灣檔期變來變去的~真的很想快點看到這部呀!!!!


  補一下LALA LAND的TV SPOT















  --


  我聽說男主角本來Miles Teller演的 但是他們發現Miles跟Emma完全沒有

  化學效應還說Emma不可能會愛上Miles Teller...就另外找男主角'
