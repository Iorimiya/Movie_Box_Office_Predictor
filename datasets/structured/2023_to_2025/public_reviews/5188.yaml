url: https://www.ptt.cc/bbs/movie/M.1488035047.A.ABC.html
title: '[新聞] 樂來越愛你試鏡戲 眾星憶當年變態怪事'
content: '（中央社洛杉磯25日綜合外電報導）有望成為奧斯卡大贏家的電影「樂來越愛你」（La

  La Land）中，女主角試鏡戲讓不少演員心有戚戚焉，憶起昔日難以忍受的試鏡經驗，甚

  至是變態怪事。


  「樂來越愛你」女主角艾瑪史東（Emma Stone）回想自己剛進演藝圈的經歷，與電影中試

  鏡不順的情景相呼應。


  根據法新社，她告訴雜誌「綜藝」（Variety），試鏡主持人「會抬頭看我，接著看回他

  們的紙，之後再也不看我一眼。我記得感覺非常無關緊要。我幾乎寧願大家對我大小聲。

  」


  所有想在好萊塢大放異彩的年輕演員，恐怕必須忍受類似的情況。


  「黑魔女：沉睡魔咒」（Maleficent）中的18歲女星艾兒芬妮（Elle Fanning）1月在日

  舞影展（Sundance Film Festival）上回憶說：「我超討厭試鏡…我會很緊張，我以前還

  吐過。」


  「不過我曾在試鏡中昏倒，應該是累到昏倒。我當時年紀很小，12歲或可能更小，9歲吧

  。」


  參與動畫電影「動物方城市」（Zootopia）配音的珍妮史雷（Jenny Slate）也在日舞影

  展上想起有次試鏡時，她得假裝舔馬桶，同時眼睛要一直看鏡頭。


  HBO影集「西方極樂園 」（Westworld）女星譚蒂紐頓（Thandie Newton）告訴W雜誌，在

  她還是菜鳥演員時，曾有導演「將鏡頭往上拍我裙子，要我自摸（胸部），想像男人在跟

  我做愛」。


  這名44歲女星覺得很「怪」，但也默默照做，因為現場還有1名女性選角導演。數年後，

  她發現導演還留著影片，甚至會放給朋友看。


  26歲紐約演員亞歷山大（Drew Scott Alexander）認為，選角導演時常「10秒後」就會知

  道應試者是否適合參與演出，而這可能與試鏡品質無關。


  他告訴法新社：「太高或太矮，髮色不對…我知道這會影響後，我往往會安慰自己這不是

  針對我個人。」


  協助「樂來越愛你」招募演員的公司Aquila/WoodCasting人員表示，有時一天看40個演員

  ，參與製作的導演確實有些緊急電子郵件要回，應試者可能會以為導演沒興趣，但其實導

  演不是故意沒禮貌。


  他們也表示，公司內部有規定，即使應試者當下的詮釋不是最搶眼，他們也不會馬上刷掉

  人選，如果看到對方有熱情，就會考慮給予機會，但也希望應試者不要都沒準備就上場。

  （譯者：中央社盧映孜）


  新聞網址：


  --'
