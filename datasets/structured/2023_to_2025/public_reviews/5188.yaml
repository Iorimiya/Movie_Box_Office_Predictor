url: https://www.ptt.cc/bbs/movie/M.1492768531.A.083.html
title: 'Re: [負雷] 樂來越愛你-別拿夢想污辱愛情'
content: "她在這片真的特別正 已戀愛\n\n\n還沒看過這些影評 不予置評\n\n\n\n我個人的想法是\n\n我們真實世界中應該看過更多紅的更莫名奇妙的人\n\
  也看過不少真的很有才華實力 卻不紅的人\n這兩樣事實\n我們不需要待在這個五光十色的行業\n只是身為一介草民\n應該就可以觀察的到\n\n至於原PO的論點覺得憑電影中Mia的本事一片就紅\
  \ 真實嗎?\n\n這個問題嘛~\n\n其實我們不知道她是不是憑那片在法國拍的電影 就一片爆紅\n畢竟電影直接跳五年後\n誰知道這五年間還有什麼事\n\n又或者說\n\
  我們也沒人知道這部在法國拍的電影最後內容如何\n一片就紅的例子\n在現實世界中也是有啊\n\n我覺得在Mia最一開始面試的那場戲\n看的出來她是會演的\n當然我也不是說會演就一定會紅\n\
  只是至少覺得她是有東西的不是單憑外貌闖天下\n(當然戲裡的Mia是覺得其他面試的人都比她更好看)\n\n\n\n我覺得這比較像是用我們一般人的想法去付諸在他們身上\n\
  就像在台灣如果和爸媽說要做藝術電影音樂之類的行業\n都會被說那能當飯吃嗎\n會賺錢嗎\n\n也許看起來能發唱片 能巡迴演出 再世人眼光中是比當一間酒吧老闆更好\n\
  我想如果Seb能發唱片能巡迴演出的內容\n是他想要復興的那種Jazz\n那他當然會比較開心\n因為至少他能紅能巡迴\n代表這類音樂還有人聽 還有新人在撐\n想當然爾\
  \ 他要拿資金 把那間有歷史的Jazz酒吧保留下來也不是問題\n\n昨天剛好在廣播hitfm聽到一段訪問\n訪問的也是一位作爵士音樂的老師\n她說她在紐約闖盪的感覺\n\
  其中一段是說\n\n她在紐約碰到太多太多有才華藝術的人了\n在紐約你想靠才華藝術賺錢\n就好像你說要在阿拉斯加賣冰賺錢一樣\n(我想大家懂她說這話的意思)\n\n\
  但還是很多人明明知道可能賺不到什麼錢\n還是會來到這闖\n\n她自己真實碰到的人\n就是一個耳朵要漸漸失聰的人\n\n他想在耳朵徹底聽不見之前\n錄下自己的專輯\n\
  即使這要付出很多 卻得不到什麼回報\n\n舉這個例子\n是想說\n\n也許對世人來說\n一些堅持 很不切實際\n\n但真的有人在乎\n即使那看起來很笨\n(電影裡其實歌詞有提到一點)\n\
  \n而我提到的例子不是電影裡寫出來的\n是真實世界真的有這樣的人\n\n\n\n  很多小地方喔! 比如說愛馬party出來車被拖吊，上面寫的是深夜到天亮禁止停車XD\n\
  \n很少有這種禁停法吧! 看背景也看不出來有此需要，朋友也都忽然不見(各自釣到魚?)\n至於最大的bug可能是，本片的代表歌曲City of Stars，這是jazz嗎？\n\
  \  我想連jazz外行人都聽得出來這絕對不是jazz。(至少不是Seb口中所謂的jazz)\n  要說這只是兩人的代表歌，因為Mia並不愛jazz，但是....注意到，\n\
  \  這首歌不僅僅是兩人的相遇歌，也是Seb認識Mia前在職場抒發懷才不遇時，\n  冒著被fire的風險(也真的因此被fire)也要彈jazz時所彈的夢想代表作！\n\
  \  但是這首歌卻不是Seb所謂的pure jazz，這合理嗎，作為他被fire也要彈的歌？\n\n\n就是諸如此類跟常識相悖的小bug太多，人物也充滿行動跟邏輯的不一致，\n\
  \  讓你就算沒意識到也會感覺不自在，\n  如果如某些影評大大所說這就是導演刻意要營造的虛假不真實感，\n   (就像做夢的時候會出現很多反常識，熟面孔變成超人or反派，大家都會飛)\n\
  \  以呼應片名LA LA LAND是個夢幻虛假之地，這種不自在感確實營造得很成功。\n\n  這其實是任何創作早就討論到爛的問題，就算奇幻世界也是有設定，有自己的邏輯。\n\
  \  像Mia的夢想是劇作家，但她創作劇本的鏡頭幾乎沒有，只有經常去試鏡，\n  也沒讓觀眾一窺獨幕劇的內容，只有從觀眾口中側面得知有人認為她的劇很爛。\n \
  \ 她最後一次試鏡要她即席創作，但她只唱了一首歌，以劇作而言真的及格嗎？\n  五年後她也不是成為劇作家，而是電影紅星，而且很可能是因為有錢老公幫忙\n  如果這不算夢想跟行動上的邏輯錯亂，那可能本片劇作家的定義跟常識就很大不同。\n\
  \  至於Seb的部分前面其他篇有更懂音樂的大大回應過了，\n  Seb口口聲聲要復興pure jazz，但他彈了那些jazz？他不是超會彈琴嗎？\n  最pure\
  \ jazz的反而是他帶Mia去燈塔聽的那一幕而已，這不是很奇怪嗎？\n\n不會啦很正常~~每個人切入點不同嘛\n就看導演提供的資訊有沒有說服到你\n我自己是覺得都還OK\n\
  \n我記的電影的片尾收在\nSeb坐在鋼琴前對其他樂手喊one two three\n準備進行下一階段的演奏\n之後就是 the end\n\n\n我知道電影沒演出來\n\
  但我想他們之後應該就是在演奏你說的jazz了\n當然你要說是我腦補也可以\n因為電影沒拍出來\n我想如果導演有把那段的音樂至少出現個三四秒\n也許你就少了一個困惑seb為什麼不彈jazz的困惑\n\
  \n\n他開club不是只是想開club\n或不看人臉色彈琴而已\n他堅持一定要開在那個地點\n是因為對jazz來說那是很有歷史意義的店\n但卻因為jazz落寞了\
  \ 被人改成tapas samba店\n而他希望延續這間店jazz的歷史\n也給予其他和他一樣喜歡jazz\n但可能和他一樣沒舞台演出的樂手們一個舞台\n\n\
  確實電影演出來的時候\n他的club已經有一個鋼琴手了\n但那不代表Seb就都沒在表演了\n轉到幕後當經營者之類的\n\n就seb和mia解釋的jazz很即興隨性的的\n\
  其實想要的話都可以上去jam吧\n\n總之一點想法供V大參考"
