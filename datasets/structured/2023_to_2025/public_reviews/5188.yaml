title: '[新聞] Selina揭雷恩葛斯林《樂來越愛你》秘辛'
content: '新聞網址：


  風光入圍7項金球獎的年度歌舞愛情電影《樂來越愛你》，日前Selina（任家萱）看完之後

  表示自己非常喜歡男主角萊恩葛斯林（Ryan Gosling）獻唱的〈星光之城〉，赴美與這位

  全才男神相見歡，開心聊起曲中的優美口哨旋律，沒想到萊恩竟當場示範用「牙齒」吹口

  哨，讓Selina又驚又喜，但吹完之後萊恩意外透露這場戲的內幕。


  Selina見到男神本人時不禁問道：「我很喜歡這首歌，尤其口哨的部分，可以教我嗎？」

  萊恩現場大方表演一段，但他表示因為自己是用牙齒吹口哨，畫面上不夠好看，「所以我

  演得像正常吹口哨的樣子。」事後再到錄音室配音。


  萊恩在睽違5年以才華洋溢又深情款款的鋼琴家一角再度電暈觀眾，帥氣又優雅的舞姿更是

  融化不少粉絲的心。日前上脫口秀《吉米金莫現場》時萊恩開玩笑表示，花了3個月苦練的

  舞蹈下戲後全忘光了，唯有華爾滋還算有信心，甚至自告奮勇要教主持人吉米跳舞，並強

  調一切關鍵在於「眼神」，過程中還不斷叮嚀：「看著我！當作這個世界不存在，只有你

  和我！」兩個大男人共舞的模樣讓現場笑聲連連。該片全台放映中。


  --'
