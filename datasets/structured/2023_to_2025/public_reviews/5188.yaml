url: https://www.ptt.cc/bbs/movie/M.1481535462.A.A72.html
title: '[好雷]樂來越愛你之我們都會好好過(偏男主觀後)'
content: '這部我衝著去看Ryon的(Emma也很美但我想看帥哥XDD)

  下了班馬上去買票看，在看之前有來版上看觀後感，

  我習慣會想知道劇情跟結果(簡單來說就是喜歡被劇透)，

  因為我要確保我喜歡的角色不會掛掉(我喜歡的角色80%會掛)，

  雖然這次有男主角外掛大難不死但還是想先知道一下大概，

  以下心得微雷，跟我一樣有劇透症在看哦哦哦哦哦！！




  －防雷線－
















  －防雷線－








  路途的陌生人；有可能會是一生最美的回憶，

  並肩看的風景；有可能是一生最美的風景，如果是跟對的人。



  Sebastian and Mia兩個人交往時都百分百投入一切，

  也完全支持對方的夢想，給予愛、鼓勵、讚美、更多的是時間，

  傾聽一天所受的苦事、努力追尋夢想卻在途中碰壁或跌倒，

  她們就像是對方的心靈雞湯，喝一口就能得到療癒、充實。



  但Sebastian選擇讓Mia更有信心、動力甚至是無後顧之慮，

  選擇了繞遠路，讓他自己離達成夢想的時間更久一點。



  Mia不懂Sebastian他所擇的原因，

  也不懂為何Sebastian為何要一直作自己不喜歡的事而不是去實現自己的夢想，

  也不夠尊重Sebastian選擇後的樂團工作，

  所以導火線慢慢的點燃，聚少離多且也沒時間付出給對方，

  Mia忙著自己的夢想、Sebastian忙著幫助Mia實現夢想所以拼命賺錢，

  好不容易見了一面吃了浪漫的燭光晚餐，卻是這個愛情毀滅的倒數計時，兩個人原本從so

  ulmate轉換成stranger。



  這頓晚餐卻是讓我印象最深刻的地方，Ryan的演技從此刻開始爆發，

  能感受到開心->沮喪->失望->憤怒，

  Sebastian像個國王，只有他能允許自己，別人的要求只能他自己允許自己做他才做，

  但其實他內心卻是有點自卑的，沒有穩定的工作沒有存款、家庭背景、只有一張帥臉跟好

  身材（？）、更重要的是琴技，他卻遇到了Mia，幽默、美麗、聰明、更重要的是跟他一

  樣擁有「夢想」，

  他必須得好好的加快腳步，不然他沒辦法確定還能否跟上Mia，那位讓他傾心的女人。



  這條「生存與實踐夢想」的路途中他發現了一條路，卻離夢想有點距離，

  但可以滿足「穩定的工作且快速的賺錢」，

  只是會失去「時間」，失去陪伴他所愛之人的時間、失去傾聽他所愛之人抱怨的時間、更

  失去擁抱的時間，但他確信自己可以堅持，他受的了這一條路上的試驗與考驗。



  他沒有替Mia想過她是不是也能接受這個轉變，這部戲會讓人感觸深刻正是如此，現實生

  活中的交往也大多都是這樣，「自以為、我覺得」來斷定另一半的想法，缺少了「溝通」

  。



  沒有時間、溝通，漸行漸遠的兩人，

  還是會想念兩人曾經一起去過但已停業的電影院、一起看過的風景、依偎在一起的床。



  不對的時間是愛的人，

  對的時間卻不是最愛的人。



  人的一生那麼長亦短，下一秒都不知道會發生什麼事情，

  兩個人的愛情需要的不只是兩個人，更需要天意，

  Sebastian and Mia在他們各自追逐夢想的旅途中遇到了彼此，

  雙方都知道這條路的辛苦所以更讓人意亂情迷，就算結果不是他們所想的那樣，又怎樣？

  他們在那段「追夢」的途中，給予的一切是任何人都無法代替的。



  故事的最後，Sebastian 幻想的一切，如果真的實現了，

  那這部戲反而不會讓我有那麼多的省思，因為那就跟一般的愛情片沒什麼，這部戲絕對是

  今年我看過的Top 5！


  附上我最喜歡的一幕，眾人皆醒我獨醉的感覺，真的太帥了QwQ




  ～小小心得，有誤請告知謝謝～


  --

  我其實當下看完也不喜歡，所以我冷靜了一天後來寫心得，才發現Mia就像現在談戀愛的

  女生一樣，所以我自己也才釋懷XDD

  其實我也覺得，那段可以拿來開一條Sebastian 的後續生活，因為Mia已夢想成真，但Seb

  astian 卻只是交代開了一間吧而已，覺得桑心

  也是啦，但也想知道Sebastian之後的感情生活，畢竟Mia已家庭事業到手了。'
