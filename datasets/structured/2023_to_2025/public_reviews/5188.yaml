url: https://www.ptt.cc/bbs/movie/M.1481306043.A.260.html
title: '[好雷] 樂來越愛你'
content: '手機排版請見諒QQ


  一開始衝著Emma Stone去看，但是沒想到就這麼迷上Ryan Gosling。

  大推這部電影，很好看！！！


  看過進擊的鼓手之後就滿期待這部作品，覺得故事之於愛情與夢想詮釋都滿好的，片頭那種歌曲舞蹈無國界的感覺好歡樂，還有最後真的很感人，後勁強烈QQ

  然後這部燈光與美術應該玩得很爽，超愛xddd


  ============雷雷============






























  一開頭的冤家就不說了，看得出來兩個人之間很對眼，讓Mia很快就甩掉存在感薄弱的男朋友，跟著Seb來一段足以回憶一生的愛情了。


  喜歡他們互相支持對方的夢想，以及可愛的熱戀時期，看了心情也跟著他們一起在宇宙裡漫舞。

  雖然跑到電影院台上找人那邊實在太好笑了(如果是我應該會白眼那個女生)，可是在那裡滋養的小小情愫超級甜蜜。

  也喜歡兩人坐在琴椅上合唱《City of stars》，想起了《Once》裡純純的感情QQ

  還有為了Mia準備驚喜，卻沒預料她會早早回家，Seb被嚇到的片段，好可愛。


  然而在理想很豐滿現實很骨感的情況下，Seb選擇為了Mia走上了樂團的道路(跟他朋友的說服應該也有關係)，但在那時候台上過於灼眼的紅，與台下那陰鬱的藍色，說明了他們悄悄改變，以及那快將耳膜穿透的烤箱聲，是多麼讓人心碎。

  曾經歡笑並展望著彼此的未來，卻在Mia的獨角戲裡，他缺席了那專屬的預留位，被背後嘲笑聲擊倒的她決定回家，而他們也註定終將離散。


  然而Mia的獨角戲讓她被邀請去巴黎表演，試鏡的時候唱出了勵志又感動的《Audition》。

  雖然在這之後他們的關係依然回不去(魯妹在此已經熱淚盈眶QQ)

  但是Seb的話確實是作為現實考量，必然的結果。

  他們的愛情像是童話，是對的人，可惜就錯在時間點或是某刻的決定。

  聽見我會永遠愛你，仍然揪心(十之八九都不會有好結果)


  時間荏苒，Mia從景仰著那些明星的店員，到自己成為了明星，甚至組了自己的家庭；Seb的夢想也實現了，名字不執著於雞肉串，而是當初Mia所創的logo。


  在他再次彈起屬於兩人之間的歌曲時，出現的幻想片段真的很心酸也很感動，哪些時刻倘若改變了，或許今日的他真能是她的丈夫也說不定。

  然而在最後，也只能夠是微笑點頭的關係，曲終人散。


  感情大概就是這麼一回事吧，孤單的時候彼此扶持，成為互相成長的動力，然而隨著時間與現實的考量，童話永遠只能是童話。

  也許他是對的人，也許就錯在那些時間，回頭想想到底哪一步錯過了，卻再也回不了頭。

  至少他們在夢想的道路上很成功(現實生活裡有多少人能夠如願以償呢？)

  帶有遺憾的感情永遠是最美的。


  大推這部的所有啊，感情部分鋪陳不錯，而且歌曲超級好聽，也鼓勵不要放棄自己的夢想QQ


  -----

  Sent from JPTT on my HTC_B810x.


  --'
