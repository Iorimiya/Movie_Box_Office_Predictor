url: https://www.ptt.cc/bbs/movie/M.1484022411.A.7F6.html
title: '[好雷]樂來越愛你 從諮商心理的角度看劇中人物'
content: "防雷前言：\n\n先恭喜本片在昨日金球獎成為最大贏家。\n\n(外加艾瑪史東的\"That was wierd. I'm sorry\"，只有讓我更愛她的可愛自然，\n\
  沒有別的 XD)\n\n\n既然它都獲得了最佳劇本獎，現在/遲來的稱讚恐怕有些錦上添花，不過還是很\n\n想說說，這部片在我看來，雖然沒有什麼複雜深刻的議題，論故事，它真的是一\n\
  \n個很\"簡單\"、\"單純\"的故事，也覺得以\"成人童話\"描述它頗貼切。\n\n但是跑去戲院看了第二遍後，發現它的對白、用詞、鋪陳，每一個場景與橋段，甚\n\
  \n至是唱歌的內容，原來都是有意義、有連貫、在說故事的。\n\n因此我會說它是一個\"前前後後左左右右都彼此呼應\"的故事。小而美，很精緻。\n\n片中的幾段旋律，帶出電影的情感，配樂相當成功，看完電影都還會忍不住哼起那些\n\
  \n旋律，想起片段中帶給自己的情緒，可謂無愧於電影配樂的偉大使命。(所以它得最\n\n佳電影配樂也覺得它實至名歸。)\n\n\n總之，防雷前言想說的就是，我自己認為好的故事就是角色情感鋪陳得好，情感\n\
  \n鋪陳得好在小說中就是看對白、文字撰寫的功力，在電影，除了對白就還要\n\n看演員的功力、配樂的功力、劇情剪輯、畫面的功力等等。就此來看，我覺得這\n\n部片大多數都掌握得挺適切的了，沒有太多挑剔。於是，給它好雷~\n\
  \n\n以下正文，並附上好讀版。\n\n還是落落長的一篇，就跟每次看電影流不停的眼淚一樣囉嗦。\n\n\n\n\n(這回不假定大家會需要好讀版了，其實是我自己喜歡好讀版:P\n\
  \n感謝版友回饋，讓我謹記教訓：哎呀，老師說當心理師千萬不要以己度人，我收\n\n到了)\n\n\n\n\n《生涯路上，我們都陪彼此走一段》\n\n\n觀影日：\n\
  12.25 (日) 叮叮噹\n12.30 (六) 本文寫到一半，些許處不確定，又跑去戲院看了一次\n\n年輕時候，說「追OO」、「追XX」，總給人一份熱血感。就像影片一開始，大家紛\n\
  紛跳出車外，大唱大跳逐夢之歌。\n但自己到了這個年紀(？)，不再覺得自己是要追什麼了，只是單純回到問自己：\n我這一生決定去做什麼，並去愛誰。\n\n生涯，Career，也許，就我自己簡單的定義，就是你這一生決定去做什麼：成為什\n\
  麼角色、怎麼在生活世界中餵飽自己、同時怎麼在心靈上豐富自己，以及，選擇與\n哪些人一起走一段。\n\n這部片，也就是說了、細膩地刻畫了這件事，並且感動一些投身在其中的人吧。\n\
  \n一、說生涯：選擇/決定做什麼\n\n某種角度上，這部片呈現出了「生涯」的內涵。\n大部分時候我們談生涯探索，包括全台灣國中生每人都有一本的生涯手冊，都不脫\n\
  在問「我的興趣專長是什麼」、「我以後想要、適合讀什麼科系」、「作什麼工作」。\n興趣專長可以是培養出來的，也有天生神力的，俗稱的從小就有那個天分的那種。\n\n\
  可是，到底我怎麼會往這條路去？我為什麼這麼愛爵士樂，或我為什麼想成為一名\n演員，這就跟我的信念(e.g.我認為什麼是重要的)、我的感受(做什麼讓我開心)有\n\
  關。而信念的形成與感受的連結，可能又跟一個人的生長經驗有關。\n\n因此，生涯諮商絕不僅只在於寫寫量表看分數，生涯諮商的面向可以是很豐富的，\n幾乎可以包含去探索你整個的早期經驗與生長史。\n\
  \n(心理諮商這門領域之所以開始跟精神科醫生、精神疾病的治療分流，自成一門，如\n果沒記錯的話，其發展的源頭，就是從生涯/職涯的探索需求開始。)\n\n\n(一)看女主角怎麼選\n\
  \n\n電影裡，女主角Mia跟男主角Sebastian在片場散步聊天的那段，看似普通的約會，\n其實他們聊天的內容，正是女主角在說著，她為什麼會想要走上演戲一途。\n\
  \nMia有一個姑姑，是名演員，小時候姑姑常帶她去住家對面的圖書館，看一整天的\n電影，並且在臥房重建電影場景。她甚至會自己編劇本。\n\n男主角笑說：你不就在說自己是個child\
  \ prodigy？神童、天才編劇家。\nYeah，我想，相較多數人，Mia相對早地就發展出明確興趣並定向。她在大學待了\n兩年就離開學校，置身自己於片場。她說，她真的很愛片場那樣的環境。不難想像\n\
  這份憧憬與嚮往一直牽引著她，小時候看《北非諜影》，心之所向，長大後甚至就\n剛好在《北非諜影》的那扇窗對面工作。\n\n女主角生涯定向地早。她想成為一匹千里馬，或者她相信自己已經是一匹千里馬，\n\
  只是還在等待她的伯樂。\n\n電影開始沒多久，三名好友邀她去一個似乎是叫作「有機會認識圈內人」的場合。\n原文唱著someone in the crowd，中文翻茫茫人海中的貴人。對其她女孩來說，想\n\
  要獲得一個角色、一次機會，說穿了，不是只是憑實力，也要有人脈、有關係。她\n們唱著大意是：這個機會就是一場試鏡，someone in the crowd何其重要。\n\
  \n按生涯諮商的觀點，當事人身邊的「資源」的確是生涯路徑中的一項考量。資源有\n先天的，也有後天的，例如出生於富有的家庭(俗稱含著金湯匙出生)、家族中有相關\n\
  產業的從業者等等，簡稱，可以靠別人比較多；後天的通常是靠自己，俗稱白手起\n家，機會得靠自己開創比較多。\n\n這些夢想躍上大銀幕的女孩兒們，說起來她們也是「靠自己」創造機會。可是，按\n\
  Mia對這類場合的想法，那裡都是一群「趨炎附勢的人」，social climber。\n\n起初她不想去，但是，想要有所得，只是在原地等待而不追，這樣子的走法，真的\n\
  走得通嗎？尤其身邊有同樣夢想的女孩子(我姑且稱之「黃綠紅」三人女子組)，都\n往這條路走去。所以，改變主意，趕緊換上藍色洋裝的她(湊成好一個三原色加一個\n黃+藍的綠色的服裝效果)，還是決定一同前行。\n\
  \n然而，在去了這樣的場合以後，她仍舊發現這種藉由跟別人打交道來得到好處的方\n式，非她擅長，她也不喜歡。\n於是進到盥洗室，她對鏡中的自己唱，難道你眼中只有茫茫人海中的貴人嗎？或許\n\
  她更期待的是；有一天，她能在某處發現她究竟要成為怎樣的人，who I am going\n to be；她更情願自己待在這處，等待著，被找到，waited to\
  \ be found。\n\n追逐夢想的過程其實就已經是一段認識自我的歷程。當我們決定用怎樣的方式去築\n夢時，已經在顯示我們這生要選擇何種價值、決定成為怎樣的人。\n\
  \nMia並沒有完全排斥參加這樣的活動(不然她也不會再度遇到男主角)，但相較去趴踢\n上social，她選擇花大部分的時間努力去試鏡，即使必須一再地面對被忽視、拒絕，\n\
  但她仍然堅信她想要被看到的是自己真正能夠演戲，而不只是圖個快速的機會。\n\n(二)看男主角怎麼選\n\n\n男主角聽了Mia如何決定成為演員的這段故事後，他的反應也很有意思。他表示，你\n\
  根本不應該去試鏡那些東西，你自己可以寫，為什麼不自己創作。\n\n有意思的地方在於，當Sebastian告訴Mia她應該自己編劇時，他根本沒有看過Mia\n演戲，也沒看過她的作品。客觀來說，他根本不知道女主角是不是個能演、能編的\n\
  人。(莫非因為Mia在樂團唱I ran時的肢體與表情實在豐富經典又機車，讓他馬上\n印象深刻？？)但是他馬上就鼓勵Mia作自我創作的嘗試。\n\nSebastian這般的篤定，是否也正闡述著自己在生涯抉擇上的價值？要去開創阿、不\n\
  要被別人給你的框架限縮阿……\n\nSebastian是個怎樣的人？我覺得影片刻畫得蠻細緻的。電影裡，他做的許多事，包\n括他自己的話語之中，或別人對他的評價，都顯示他就是匹難以被指使的「野馬」。\n\
  他不願意被束縛、被指使應該怎麼做，如同他認為，Mia不需要屈就於去試鏡那些市\n場上的角色，她可以自己開創新局。\n\n聖誕節，他一進到餐廳就對老闆說，謝謝你讓我回來，我現在很好配合，巴拉巴拉。\n\
  嗯哼，這些話不就正說明了，他之前很難搞嗎？後來邀他進樂團的友人也強調了這件\n事：老兄，之前的鍵盤手沒你厲害，但你真的是超難搞。\n\n二是，他不僅難搞，其實自尊心也強。\n\
  \n在餐廳他跟老闆討價還價：how about two for you and one for me？兩首照你的\n意思彈，一首就讓我彈爵士吧？到最後還是all\
  \ for you and none for me時，他還\n要強調：好，是照你的意思來彈，但是也是我同意的。\n就像在與Mia再度見面的趴踢上，樂團的人來通知他要上場了，他又強調沒有人可以\n\
  命令他，但Mia馬上一語中的：他剛剛就命令你啦，他也要辯解「是我允許他命令我\n的」。當他的姊姊告訴他要他好好為自己打算、整整箱子、去認識女生，他的回應\n是：等我找到自己的地方我就會整理；認識女生？她不喜歡爵士樂，我也不想認識；\n\
  我現在就是在運用拳擊的戰術，不是我被打趴到站不起來，是我自己想要靠在繩子\n上休息，我正在等著被生活打到趴後，我就會變成浴火鳳凰。\n\n有沒有突然覺得，他其實還蠻中二的。\n\
  \n無論如何，他就是要按自己的方式做，即使他知道事實可能是他必須屈就於現實，\n他仍要宣稱那也是他自己決定後的結果。\n\n不過，話說回來，作為一個中二，這件事在生涯上是一體兩面的。老闆可能不會喜歡\n\
  這樣的員工，可是，在別人底下工作、照別人期待的方式而活，或許就不是他這輩子\n「適才適性」的所在。\n或許，他就是適合作一個自由的創業人，盡情地發展揮灑。至少我們可以確定他琴藝\n\
  極佳，不是空有幻想卻欠缺實力。只差找對一個位置。\n\n一個所謂「自由」的創業人，套用《被討厭的勇氣》的說法，一個能夠自立、自由的\n人，是擺脫以自己為中心的。\n\
  \n「找對位置」的路上，也並非藉由一意孤行或自以為是，就能夠達標。\n\n要從「以自己為中心的中二」過渡到「擺脫以自己為中心」，我感受到的是，這小男\n孩，也很努力在學著長大。\n\
  \n他對爵士樂充滿熱情，他如數家珍地告訴Mia爵士樂是一種怎麼樣的音樂，企圖改變\n他心儀的女生對自己珍愛的事物的看法。\n他說，他很想要開一間自己的店，他的構想清晰，甚至，看起來他曾經離這個夢想\n\
  很近。只怪識人不明成了一場空。生活並不如意，彈奏只為應景而生的聖誕曲調，以\n及80流行金曲的十足愚蠢(還要穿得像消防員)，豈比得上爵士樂的靈魂，可是為了長\n\
  遠的目標，他願意屈身。\n\n「找對位置」的路上，有所妥協並非壞事。即使總要使出「自我語言」一招來告訴自\n己「現在這麼做也是我自己決定的」，可是這樣何嘗不也是一種「對自己負責」。\n\
  \n好吧。看在他也有努力長大的份上，就欣賞一下他這歷程吧。\n(但如果我是餐館老闆，在欣賞他之前，我還是會跟他說：吝杯聖誕節就是要聖誕曲，\n你這麼想free\
  \ jazz，你要不要想想你為什麼不去找間jazz bar好好給它jazz\nsession，而要跑來這裡為難我的聖誕節？是的，今天是聖誕節，你看，你也知道。)\n\
  \n(即便欣賞中二的反骨與不願被框架，我還是忍不住想ㄉㄧㄤ中二)\n\n\n二、說愛情：春夏秋冬\n\n\nSebastian認為Mia不應屈居於現實。在Mia還不相信自己似乎可以成功前，\n\
  Sebastian好像就肯定她一定可以。彷彿全世界，眼前只有他最確定我的價值。\n\n如同那一晚，Mia聽見了琴聲，走進店裡便看到了沉浸在spotlight之中演奏的\n\
  Sebastian，彷彿是那麼樣地不顧一切，彷彿活著只為此刻，專注而動人。\n\n愛情為什麼迷人？或說，在初步被對方的一些條件、特質有些吸引後，為什麼你感\n\
  到更想靠近這個人，想成為彼此的伴侶？也許有一部分，是因為這個人看到了你的\n美好，甚至比你自己更相信你的美好。\n\n(所以也有說，戀愛其實就是藉由另一半重新愛上自己；或者，怎麼知道這個人是不\n\
  是對的人，就是當你跟方在一起時，你更喜歡自己……，諸如此類對愛情的見解，\n大概也有類似的意思。)\n\n這種我眼中只有你，你眼中只有我的積極關注與正向回應，很少人能不心神嚮往的。\n\
  \n男女主角有點冤家路窄的意味，挖苦和互嗆一開始沒有少。\n\n(我超愛Emma Stone對著男主角唱I ran的那個橋段，整部片最愛她那機車的樣子，我\n\
  甚至認為那段比她跳踢踏舞出色一百倍。可能因為我也有80年代金曲魂吧，哈哈。\n拜託讓我也跳一段。)\n\n然後，就說男主角中二。你看他又來了。明明是想靠近，卻孤單的黎明。明明自己\n\
  的車就停在宅邸的門口，跟女主角走那一段路，卻還要故意唱「可惜我對你沒感覺，\nwhat a waste of the night」。女主角也不是省油的燈，被這麼說當然是本能地\n\
  要反擊一下：喔，我也這樣覺得啊，對你沒感覺，what a waste of the night。\n妙哉，當女主角這樣表明時，男主角的反應是急著確認：真的嗎？？\n\
  \n真是所謂挖洞給自己跳；但也真傳神了「打情罵俏」四字。\n靠近一個人的面貌有很多，一直拉同學辮子捉弄對方的，也可能是在說：我喜歡你；\n一直罵你的，也可能是在說：我愛你。\n\
  \n我很喜歡片中導演鋪陳愛情萌芽的方式，有很多細膩之處，那種既期待又怕受傷害的\n不安、想靠近、想到你就開心、但又怕被推開、你才是對的那個人嗎；心中千百回，\n\
  在影片中都呈現出來了。\n\n包括，男主角不經意地問：你跟你的鮑嘉交往多久了？(才一個月，那我應該有機會\n吧。)\n以及，當男主角邀女主角去看養子不教誰之過，男主角說，當作研究，女主角又回應\n\
  強調，對，「只是研究」時，男主角瞬間有些落寞的神情(你赴這個約，究竟是因為\n你也喜歡我，還是真的只為了研究？我獨自走到海岸邊，不禁唱出，City of stars,\n\
  are you shining just for me？)\n\n以及，女主角在節目試鏡被打槍，挫敗又憤怒，開車回家撇見當晚要「約會」的里亞\n托戲院，表情瞬間柔軟下來、微笑灑花；\n\
  當女主角如少女般開心地在鏡子前配搭著裝，想著今晚要赴電影約，發現男友來接她\n赴約，她瞬間露出失望的神情；\n當餐廳擴音機傳來男主角演奏的那首曲子，彷彿天外傳來一記呼喚，她更想要靠近的\n\
  人，是他而不是他，她大膽喜悅地衝出門外，奔離大談開發案的商業餐桌，決心去找\n茫茫觀眾席中的他(觀眾席的人真好，都沒人丟爆米花叫她別擋住螢幕)，摸黑牽起手\n\
  十指緊扣。\n\n好一個春天哪！來來回回，試探探試，甚至連有機接吻處都三番兩次被打斷，但就在\n那一吻中，宣告春天的春心蕩漾，是這樣的happy ending。\n\
  這一整段曖昧萌芽的心情描繪，真的很細膩阿。\n\n\n只是過了曖昧後，愛情的互動是浪漫卻也真實。\n\n與生涯交織，很多條線同時是交會在一起的；每一次的交會點，都有抉擇、有考驗。\n\
  愛情在春天萌芽，在夏天綻放。兩人確實是更靠近了，也互相協助對方築夢。在相處\n之中，會獲得鼓勵與支持，因而有勇氣辭去工作，專心在家寫腳本；但同時也會開始\n看到對方真實的性情，像是「你不是辦不到，你是不願意」。會開始收進對方的期待，\n\
  也會開始直接或隱微地說出對對方的期待；期待彼此能夠有多一些時間相處，卻似乎\n又要「明理」地接受雙方都得為各自的事業打拼。\n\n\n真實的關係或愛情，本來就不是永遠熱戀期的十指緊扣。衝突、爭執，什麼事都有。\n\
  他們的那次吵架，非常經典。根本堪稱「相愛容易相處難」的典型爭執。\n\nSebastian特地在百忙之中，抽空回來準備晚餐驚喜給Mia。當他提出希望Mia能跟著\n\
  他一起去波夕(念法好特別的名字喔，查一查原來是美國愛達荷州的首府)巡演時，\nMia拒絕了。\n女主角難道不想去嗎？她想去，她也思念男主角，但她有自己的劇要演出，她不可能\n\
  去。男主角失望嗎？失望。女主失望嗎？失望。\n所以女主角開始問男主角，你這巡演要多久？我們難道就會這樣一直相處下去嗎？我\n要何時才能再見到你？\n男主角開始說明這個「專輯錄製、發行、巡演」無限循環的迴圈，女主角一聽越覺得\n\
  根本這不是男主角想做的事。\n\n到這裡，其實，這後面到底有什麼情緒呢？我猜，女主角想說的是：\n如果你是在做你喜愛的事，我可以接受這樣長時間地不跟你見面，但是，我犧牲自己\n\
  跟你的相處，換來的卻是你根本在做一件你不喜歡的事，那我的犧牲是什麼？\n\n或許再深一層是，女主角看不到自己與男主角的未來。有時候，我們可以忍受或接受\n當前生活的不滿意，是因為我們有一個未來的藍圖，那個藍圖可以支撐我們度過現在\n\
  的刻苦。但是，此刻女主角的未來，和男主角的，似乎看不到交集於何處。\n\n但是，男主角更是委屈。他說，他以為這是女主角希望他做的。他感受到女主角對自\n己完成夢想的在乎，但開店要有本錢，我這不就在做往夢想邁進的路嗎？為什麼你要\n\
  這麼兇地指責我，好像我是個放棄理想沒有理想的人？\n男主角為女主角做的犧牲是，去做一些自己不甚喜愛的事，出賣一下靈魂，而當被要\n求彈一些身為鍵盤手該彈的東西時，他就要回頭面對真心想彈的還是那些old\
  \ jazz的\n內在糾結。但是遠處的目標是開店完成夢想，他何嘗不希望女主角在和父母講電話介\n紹自己時，不必解釋得那麼含蓄，好像自己還沒有成功，又是個無法養活自己、只活\n\
  在夢想中的人。\n\n男主角感到被指責的受傷，最後成了那句：你就是要我潦倒，你才會覺得自己在關係\n中重要、你就是要當比較厲害的那個。女主角聽到如此，何嘗不受傷？何嘗不覺得自\n\
  己也被誤解？\n\n為了愛來到彼此面前的兩人，明明都是為了彼此，在意彼此，卻在各自的失望與受傷\n中，沒有辦法真正說出背後的愛。\n\n愛情中若有苦，是否很多時候就是苦在這兒？\n\
  \n\n三、受傷的心需要自己的肯定：我是值得被愛與被看重的\n\n就說男主角自尊心強，他們在I ran趴踢上會面那次，當男主角聽到女主角說自己在\n華納片場咖啡廳工作時，他立刻就說喔喔，原來你是barista難怪這麼高高在上取笑\n\
  我是不，女主角當時聽到是一臉莫名其妙。\n\n高自尊，心裡面卻是無法肯定自己時，即使別人根本無貶意，自己常就會聽到貶意；\n故作堅強或不在意的背後，甚至是攻擊，通常都有受傷，感到自己被看輕，只是把它\n\
  武裝起來了。\n\n男主角要女主角不要在意別人的評價，女主角則在吵架中去戳了男主角你為何變得這\n麼在意別人的評價。\n\n或許最初就是，兩個人在生涯路的挫折中，都是非常戰戰兢兢害怕受傷的，害怕自己\n\
  其實並不夠好、並不會如自己預期的「可以成功」。\n\n六年來試鏡的次次失敗，或是身旁的人告訴自己該務實一些時，都像是事實一再地用\n事實殘酷地應證、提醒：「我其實根本就不夠好」、「原來我不值得」。\n\
  \n然而，男女主角出現在彼此生命中時，卻又像是注入一則希望，讓自己重新相信自己\n「我其實夠好」、「我還是值得的」。\n\n\n四、勇氣\n\n雖然這是一種力量，不過終歸還是從別人的批評或肯定中，來決定自己的價值。這也\n\
  是為何《被討厭的勇氣》中提出，不批評，也不讚美。我們從小都已習於由別人的評\n價來決定我們自己的價值了。\n心理諮商最厲害的功能，大概就是讓當事人一路長大到：就算全世界的人都在生你的\n\
  氣、批評你、攻擊你，你還是可以愛自己、接納自己、穩住自己。當事人如果有力量，\n那會是他自己長出來的，既不是父母給的，不是老師給的，也不是親密伴侶給的，甚\n\
  至也不是諮商師給的。\n\n但這條路確實不易，即使自己是學心理諮商的，也要歷經浮沉糾結，而尚不知道彼岸\n達否。不過，一路上有他人的鼓勵與相伴，比起孤單前行是好多的。是鼓勵而不是讚\n\
  美；鼓勵，encourage，其實也就是「引出勇氣」的意思。\n\n女主角的劇場演出票房慘淡，甚至被劇場人員奚落的挫敗，讓她失去了待在築夢之處\n與繼續經營關係的勇氣，一路奔回家鄉。甚至，一個好機會要來臨時，都因為過去太\n\
  多的打擊而不願意再跨出了。\n\n六年累積的受傷，在關鍵時刻能不能跨過，確實就是需要勇氣呀！一個，仍給自己機\n會改變的勇氣，一個，願意回應自己內心恐懼的勇氣，一個，即使有可能會失敗，但\n\
  仍會再度擁抱自己的勇氣。\n\n女主角哭著說出她已經無法再承受另一次的打擊，那真的會殺了她。男主角說，You\nare like a baby. You cried\
  \ like a baby.\n是阿，受傷的人，表面是大人，情緒上都是baby。\n\n看著女主角邊哭邊說，第一次看到這段時，我很心急，馬上在心中附和著男主角，並\n\
  在電影院點頭如搗蒜：對，你真的別這麼幼稚。小妞，別讓過去六年的挫折在這一刻\n阻撓你啊，我知道這很可怕，且你也不想要一再受傷了，可是這一次會否跟之前不同？\n\
  我只差沒搬出國父革命OO次、李安在家窩了XX年才成功來說教。\n\n但第二次看時，似乎比較能同理女主角哭哭啼啼的眼淚了。好吧。孩子，你真的受了\n很多委屈。但你值得呀。\n\
  \n回頭看Mia在片子前段，唱著希望 waited to be \"found”，其實這希望已成真了。\n就在她面試一進門，面都還沒試，結果仍未曉，那名去劇場看她演出的女士，開口第\n\
  一句對她說的便是：we're glad we found you.\n\n(這就是，好的文本。字詞，不是亂選的，是有心思的。)\n\n\n\n五、關於沒有露臉卻似乎重要的Mia’s\
  \ Aunt\n\n\n最後的面試中，Mia說/唱出關於姑姑的故事。\n姑姑，不就是，當初生涯路上，啟蒙她走上演戲之路的人嗎？聽起來，姑姑敢愛敢恨，\n在冬天一躍跳入了巴黎塞納河中，儘管重感冒了一個月，卻表示，如果再來一次，她\n\
  還是會不加思索，縱身躍入。儘管在某一句歌詞中，似乎透露著姑姑是死於酒癮過度。\n\n瘋狂的執著，執著的瘋狂。這是否就是勇氣的其中一個面貌？執著而瘋狂的人，常便\n\
  是不在乎他人怎麼看待自己，於是也成為了不被他人評價來影響自己的人。\n若如此亦能得到勇氣，那麼，仍舊敬瘋狂吧！(如同《霸王別姬》裡說的：不瘋魔，\n不成活)\n\
  \n如果擔心瘋狂而終致喪命，那就，敬瘋狂 ，並p.s. 在某些時刻，即可。\n\n\n六、Where are we? What are we gonna do?\n\
  \nMia與Sebastian最後的一次談話，在同樣公園處的長椅上。\n\nMia問了兩次：Where are we？(第一次男主角還故意裝作聽不懂，回答她，我們在OOO\n\
  公園阿。)\n\n拉著那條生涯與愛情的線，看、問，現在，我們走到哪裡了？我們的關係是什麼？\n我們的未來是什麼？\n\n我覺得這個問題，其實很感人。因為，如果不是在意這段關係，可能只會問，你打算\n\
  怎樣，我打算怎樣，但不會問「我們」該怎麼樣。\n不過，男主角告訴她的是，你就去巴黎吧，而且你必須去。至於我，我想留在這裡弄\n起我的club。\n\n到頭來，在夢想之路漸漸清晰的這刻，他們並沒有為這段關係，許下承諾。\n\
  \n既然沒有承諾，那麼，也就讓關係化作一段各自心中的情感吧。\n\n最後男主角說，I gonna always love you.女主角也說，I gonna always\
  \ love you.\n終於要別離了。以後再也沒有what are we gonna do了，但仍有彼此的I gonna\nalways love you，帶著彼此走向未來。且在過去，你們已經給予了對方許多意想不\n\
  到的美好事物了。你看，你現在會聽爵士樂了，男主角說。\n\n\n七、最後還是大淚崩\n\n\n五年後，女主角成為了大明星，看起來也有婚嫁與孩子了。\n某日，她與現在的伴侶，進到了一間爵士餐館，一眼望去，是她當年幫男主角取的店\n\
  名，還用了與她設計一樣的圖案字型。\n\n\n那段flashback對我來說，實在是太強大了。好像整部片的情感，都在結局的刻畫中\n整個傾瀉帶出。\n\n所有過去的畫面都重現在眼前，所有過往回憶，一起走的那些路，甚至，來不及或\n\
  無法或錯過機會一起建構的未來，都在那段想像的情緒中成真。\n似乎，在聖誕節餐館的那一刻，Mia就已愛上Sebastian，她想像的是，當他走過來時，\n他會一把抓住她給她深情一吻；在劇場的演出，那時她其實多麼期待整場的高朋滿座，\n\
  期待Sebastian在場陪伴、為她叫好；期待Sebastian能同她一起到了巴黎，在巴黎也\n能找到一處Jazz bar演奏他喜愛的音樂。他們一直能夠陪彼此同行，直到結婚、生子，\n\
  直到一起來到他開的club。\n\n有舊情人議題的人、有「曾經有一段真誠的愛情擺在我眼前我卻...」的人、未竟事務\n還沒竟完的人，這下應該都要流淚一段了。我哭到散場都還沒恢復。(完蛋了，個人議\n\
  題太多還有待慢慢處理。)\n\n為什麼這個flashback後座力這麼大？是不是愛情裡，得不到的最美麗，因為只需要活\n在回憶與想像裡？\n可能吧。\n\n愛一個人，有好多種形式與情感。\"\
  I gonna always love you\"可能是最簡單的一種\n了，因為不必面對真實的爭吵、磨合、拉扯，就好像外遇那樣令人驚豔而現實那樣令\n人俗氣。唯一的副作用也許就是，在回溯之中要感到那麼多味的失落與雜陳。\n\
  \n可是，那終究，不都是自己的選擇嗎？\n\n在自己的種種「想要」中，我們不過就是不斷回應生涯，為它作出取捨與決定罷了。\n\n相較至尊寶與紫霞仙子在城牆上的那一吻，或許，這一段flashback，並不是真的該\n\
  令人失落到無法自拔。前者是「我太晚發現，卻已經無法挽回」，在我還沒有發現我\n想要什麼時，我卻已錯過我這輩子最愛的了；而一個卻是「人生或許不能全拿，但自\n始至終，真的沒有什麼需要挽回」，我一直都知道我想要什麼，也沒有真的錯過太多。\n\
  \n(至尊寶跟紫霞仙子阿~想起紫霞倔強的臉龐，淡然憂傷的配樂，在沙漠中，至尊寶藉\n由附身去完成那一吻，這麼多年來，沒有一次我想起這段不哭.....)\n\n\n\
  想想，原來，片頭的歌舞不只是大跳大唱築夢之歌，只是為了熱鬧開場而已，其實那\n名女孩她唱的，就是這整部片的故事翻版啊：\n\n那年他們17歲，她知道他們彼此是真感情，然而她知道\
  \ “what I must do”，所以他\n們在聖塔菲的巴士站分手。而她想像的是，有一天，這個男孩會在電影上看到她的演\n出，而感到這名女孩兒似曾相似，想起了生命中曾有這個她。\n\
  \n\n如同，有一天男主角經過女主角的電影海報，而女主角走進了一間music club，看到\n了似曾相似(一模一樣)的招牌與男主角。即使這麼多年我們並沒有聯繫，但現在我知\n\
  道，你已經達成了當年我們一起追的夢想了。\n\n結尾是，兩人四目相交，然後，給彼此一抹微笑，離去。\n那是真感情，也不演誰拋棄了誰、是你夢想重要還是我重要的爛戲。五年前，為那一\n\
  刻，我想我們都為當下作了最好的決定。\n\n\n好吧，理智上，也許到頭來明白為了那一刻作了最好的決定，不過，也許情緒上，也\n有一個部份的我們，還是很想任性一回地大喊：「跟我一起去巴黎吧，不要離開我！」\n\
  \n嗯，就為了這「不要離開我」，我那時，其實有一度好希望能繼續跟你走下去，還是，\n讓女主角結局處的flashback，也在自己身上淚崩一回吧。\n\n哭完了，想起這些音樂，輕哼，也就覺得，嗯，這部片，可以陪看電影的那個自己，\n\
  走過一段。(這也就是電影的迷人處了，是吧)\n\n\n--"
