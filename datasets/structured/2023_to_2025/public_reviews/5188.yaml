url: https://www.ptt.cc/bbs/movie/M.1488093297.A.1C4.html
title: '[好雷]《樂來越愛你》魚與熊掌不可兼得'
content: '《樂來越愛你》La La Land 魚與熊掌不可兼得


  每個人都有夢想，但又有多少人是失敗後能站起來的？我們害怕失敗、前功盡棄，而選擇

  待在「舒適圈」裡，但那真的是自己想要的嗎？

  《樂來越愛你》給了觀眾有「夢」就去追的想法，每個追夢的人都在等待著屬於自己的伯

  樂出現，就算跌倒了也不要輕易放棄，一覺醒來又是美好的一天。


  追夢的過程如夢一般，但結果又把你拉回現實。

  電影中用燈光的明暗讓觀眾感覺如夢一般，但結果又把觀眾拉回現實，讓我們看到這並不

  是一部一步登天的電影，男女主角想堅持自己的夢，但卻又因現實的種種原因，讓他們一

  度放棄自己的夢想。


  互相扶持互相鼓勵

  電影中我們看見Mia和Seb一開始相遇只是在車陣當中，誰能想到只是一個對你比中指的人

  ，能成為這個世界中唯一能依靠的燈塔，互相扶持互相鼓勵，當Seb為了錢而放棄自己的

  夢時，是Mia點醒了他，當Mia因屢次失敗而放棄自己的夢時，是Seb陪伴著她。


  魚與熊掌不可兼得

  我們想要成名就必須放棄一些事物，可能是愛情、可能是家人、可能是朋友，然而也是因

  為如此讓我們不敢放手去做，會不會因為失敗而跌落谷底？這麼做值得嗎？這是每個追夢

  人都會遇到的課題，這個「夢」值得我放棄我所熟悉的事物嗎？

  電影最後我們看到了兩人的分開，讓人感慨，這就是現實阿！或許這樣才是最好的結局，

  「現實」就是如此。結尾兩人各給了對面一個微笑，像是在肯定對方也感謝對方，感謝你

  出現在人群中，一路指引著我扶持著我，當我跌倒時是你把我扶了起來，當我失落時是你

  一直陪伴在我身邊，謝謝你，I will always love you.


  歌舞部分真的是幫電影大大的加分了，並不會覺得突兀，或許唱出來跳出來更能讓觀眾了

  解到男女主角的感受，歌曲真的非常好聽令人想收藏原聲帶呢！


  個人總分:9.0/10


  And when they let you down.You get up off the ground. ‘Cause morning rolls

  around. And it’s another day of sun.

  當他們讓你失望，你還是要昂首挺胸，因為黎明即將來臨，又會是陽光燦爛的一天。


  --'
