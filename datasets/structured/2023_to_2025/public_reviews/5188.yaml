url: https://www.ptt.cc/bbs/movie/M.1482830059.A.F5E.html
title: '[負雷] 樂來越愛你-別拿夢想污辱愛情'
content: "負雷\n樂來越愛你-別拿夢想污辱愛情\n\n\n看完電影之後，\n只覺得內心有一把怒火在燒，\n再看到電影版滿片的好評更顯得諷刺，\n不可否認音樂、演技、跟男女主角都很用心，\n\
  但架不住劇本架構出現很大的問題，\n整體看完只覺得本部片倡導麵包比愛情重要，\n天涯何處無芳草，何必單戀一枝花，\n真愛兩個字只是好萊塢騙你的謊言，\n\n滿分5分我給3分，\n\
  如果是在意劇情邏輯的人極度不推薦觀看這部電影，\n只想看男主角有多帥的倒是可以ㄧ看\n\n\n\n\n----------防雷-------------\n\n\
  ［音樂還不錯但價值觀扭曲］\n\nㄧ開始進影院時，\n只聽說這是部很感人的電影，\n乍看片名本來以為是像是手札情緣、真愛每一天之類的愛情片，\n片頭曲Another\
  \ Day Of Sun一出現才發現是歌舞劇，\n悲慘世界、歌劇魅影、媽媽咪呀、髮膠明星夢這幾部我也都很喜歡，\n開場的女生聲音很清亮好聽，\n三個室友跟女主角Mia合唱的Someone\
  \ in the Crowd也不賴，\n所以我又以為是友情、愛情交織順便追求夢想的溫馨片，\n\n男女主角Mia與Sebastian相遇的過程也還不錯，\n算逗趣可愛，\n\
  直到他們聊到Mia的現在有男朋友，\n已經約會了一個月？！\n然後雙方開心的約去看電影？！\n等等！\n不覺得這裡很不對勁嗎！\nSebastian明知對方有男友還約去看電影，\n\
  Mia明知自己有男友還開心的打扮想赴約，還順便把已經答應男朋友的聚餐忘光光，\n\nMia跟男友吃飯全程臭臉，\n吃到一半中途還直接上演落跑，\n試圖裝病、裝突發急事也就算了，\n\
  直接拍桌走人感覺還沒付錢的行為，\n超級不尊重當時在場的男友，\n現實中出現這種人不就是個渣女嗎？\n這種價值觀是正確的？\n不需要懺悔可以被歌頌？\n\nOk~我勉強說服自己男女主角一定是真愛，\n\
