title: '[情報] 萊恩葛斯林將主演《樂來越愛你》導演執導'
content: "外電來源： \n\n前年才以《進擊的鼓手》一鳴驚人的新銳導演 Damien Chazelle 今年再度以再好萊塢今年來已近乎絕跡的原創歌舞電影《樂來越愛你》收穫極大的好評，其中對於好萊塢歌舞黃金年代的致敬特別是影評人們所讚許之處，目前也被視為奧斯卡的大熱門電影，包括已在獎季中拿下數座的最佳影片。\n\
  \n身價再度大漲的導演不只被視為美國新銳導演中不可或缺的人才，很快的，片約也隨之而來，由環球影業發行的第一位登上月球的人「尼爾阿姆斯壯」的傳記電影《First\
  \ Man》即確定由 Damien Chazelle 執導，並由《驚爆焦點》金獎編劇 Josh Singer 執筆劇本，更再度找來 Ryan Gosling 飾演阿姆斯壯。\n\
  \n該部電影預計明年上半年正式開拍，而相比這部電影也會被環球作為下一次獎季的重點作品，拭目以待。\n\n\n\n-----\nSent from JPTT on\
  \ my Sony C6502.\n\n--"
