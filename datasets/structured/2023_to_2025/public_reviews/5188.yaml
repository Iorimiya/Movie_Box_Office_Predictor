url: https://www.ptt.cc/bbs/movie/M.1481352856.A.087.html
title: '[新聞] 新片看板／「樂來越愛你」 夢想與愛情的'
content: '新聞網址：


  新片看板／「樂來越愛你」 夢想與愛情的是非題


  2016-12-10 14:07聯合晚報 記者陳建嘉／綜合報導



  當小演員遇上鋼琴手，夢想與愛情要如何抉擇？


  查澤雷這次改以復古情懷，細膩描寫一對墜入愛河的年輕男女，在追求夢想與維持愛情之

  間遇到的挫折與難關，對查澤雷來說，這部電影是封獻給洛杉磯的情書，導演查澤雷也在

  訪談中，不諱言對於洛杉磯的著迷，促使他拍了這部音樂電影，致敬「萬花嬉春」、「西

  城故事」等諸多經典。


  寂寥的小演員蜜亞懷抱著明星夢，一邊端著茶水，一邊到處試鏡；落魄的爵士鋼琴家賽巴

  斯汀，在昏黃的酒吧靠演奏鋼琴維生，勉強餬口。同樣追求夢想的兩人陷入情網，相互慰

  藉扶持。但在逐漸達成夢想的同時，兩人情感也面臨抉擇和考驗。


  「樂來越愛你」是「進擊的鼓手」新銳導演達米恩查澤雷籌備多年的新編導力作，他對音

  樂題材情有獨鍾，穿插許多向好萊塢電影致敬的橋段，絕對是觀眾未曾看過的新類型電影

  。




  --'
