title: '[負雷] 樂來越愛你'
content: '本人才，經過友人推薦，說這部很好看，


  叫我一定要去看一看哭一哭，於是，我這輩子第一次一個人去看電影，


  但看完滿肚子火，很火地走出影廳，


  若是本片忠實粉，或不喜偏激言論，可以跳過或是隨意噓。



















  1. 由於本片為愛情片，所以其中男女主角的相遇、浪漫情節我都可以接受，


  唯獨絕對無法接受的就是，女主角竟然是跟男主角在一起的，


  認識期間男方也知道女方有，卻還是不停邀約。


  女主角更是誇張，完全遺忘跟的約會，還在約會期間直接落跑，


  在影廳就馬上跟男主角牽手。


  我看到這裡心中馬上燃起一把火，






  2. 未發先猜有人會說我看錯重點，呵呵，但是或許經歷過劈腿就能知道我為何在意吧。


  劇情中間男主主角在一起發生的各種衝突、現實與夢想的差別，


  這部分我是給予正面評價的，每個人對於自己的愛情觀以及夢想都有不同的取捨。


  男主角聽到女主角跟母親的對話，終於看清現實，


  為了負起責任、為了給予另一半安心的環境，


  而忍辱負重接受自己不喜歡的工作，我覺得這是沒有什麼好撻伐的。


  女主角一直勇敢試鏡、追夢的過程也很令人敬佩。


  整個過程中，我覺得比較可惜的就是，


  兩人的相處有點短暫，刻劃得也不深。


  有時兩人吵架的畫面，


  只讓我覺得：「這三小啊？這樣就吵架？互相溝通、尊重、同理心勒？」


  他們是在扮家家酒嗎= =？




  3. 我很能理解男主角讓女主角勇敢前往巴黎追夢的態度，


  也很佩服女主角勇往直前，孤身前往巴黎的勇敢。


  五年的時間，說長不長，說短卻也不短，


  計較女主角五年結婚生子是沒有意義的，


  人各有志，有時候也常常發生意想不到的事情。


  我他媽最最在意的，


  還是你他媽的女主角跟著去到男主角(前男友)的店裡，


  在那深情凝望、泛淚個三小啦！


  我只看到旁邊的。




  請問在場的各位，


  你們有誰，有了新的、穩定的另一半時，


  看到前男女友，會這樣子想的？？？




  看了一些板上、身邊朋友發的心得，


  最多人提的就是「最愛的人不一定能走到最後」，


  我勒XXX的，有種就跟現任男女友，跟老公老婆提這句話啊。


  看了真的很惱火耶。


  電影中的部分情節，跟現實中的風向完全相反，


  到了電影裡卻變成人人感動的事情？




  我一直覺得電影板的板風很病態，


  當一部片一面倒受好評的時候，


  有人出來發負雷文，不管他講得多麼仔細，且不是純粹無腦黑，


  卻會被喜歡該片的人無腦噓。


  對於電影的喜好，不是完全都是個人的主觀想法嗎？




  以上是我的想法，


  或許是我最近遇到的事情，讓我無法更客觀地來觀賞這部片子，


  不認同我沒關係，要噓請便^^




  --'
