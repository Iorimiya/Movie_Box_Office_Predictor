title: '[好無雷] 樂來越愛你 極推薦！ La La Land'
content: "這部個人覺得可以以看「百老匯」的心情進場，\n就會比較能輕鬆接受歌舞的部分。\n\n如果你喜歡音樂（尤其是jazz），曾有過夢想，\n還經歷過全心投入的愛情，\n\
  \n那真的誠心建議進場觀看本片。後勁十足。\n\n有些人說劇情通俗，我覺得那可能是因為以上帝視角去檢視劇情脈絡的結果。\n比起YA片的那種起承轉合.這部片所經歷的並非如此的理所當然，\n\
  \n導演的編排與演員的演技，讓這部電影有了你我都能共鳴的靈魂，\n男女主角所經歷的就好似你我周遭的人們，\n非常能夠感同身受到電影中男女主角的想法與掙扎，\n\
  因為他們就如同你我，\n曾經為追夢而感動。\n\n請到電影院一起體會那人生的酸甜苦澀，\n說不定在某一幕，你會看到自己的身影。\n\n\n*下面是劇透心得*\n\
  \n\n\n==============================以下有雷==============================\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n==============================以下有雷==============================\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n老實說這部片看完第一個讓我想到的是「新天堂樂園」\n\n既然「夢想」如此重要，那放棄人生中一段曾經的「真愛」是否值得？\n\
  \n這兩部片主角的共通點都是成就了夢想而放棄了愛情\n\n新天堂樂園的男主角最後功成名就，卻在也尋不著真心所愛\n本片的男女主角也雙雙圓夢，卻難以忘懷那心靈契合的情愫\n\
  \n以一般的思考判斷，答案好像很簡單\n\n夢想如此遠大，而且人生只有一次\n愛情卻可能只是你人生中的一小段過程\n若有機會去追夢，何必死守相對短暫的愛情？\n\
  \n但本片的結尾卻讓你強烈感受到\n有些事情總非如二擇一般的能夠輕鬆決定\n\nSeb跟Mia就是完美的心靈伴侶\n他們都懂得對方的夢，傾盡全力的鼓勵與扶持對方\n\
  一起走過人生中最失意的那段路途\n當然也就更加刻骨銘心\n\n想特別討論的有幾個重要轉折：\n\n1. 在爭吵的燭光晚餐那一夜\n其實Mia不是不懂Seb，只是她不願意看到Seb\n\
  讓自己為了他們的生活而鎖在自己根本不熱愛的音樂中\n所以Mia才想勸Seb跳出來，並不是單純陪伴長短的問題\n\n但你也能夠輕易瞭解Seb為何會發怒\n因為他做出加入流行樂團的決定一定是掙扎許久\n\
  他是這麼的自負\n卻為了Mia而犧牲夢想，每天做自己討厭的事\n而在他放棄了一切走到現在，Mia卻又突然跟他說應該繼續追夢\n（Mia有說她談這件事情很委婉，代表之前可能不太敢問，\n\
  \  導致Seb可能覺得這就是Mia所要的）\n當然無法接受，惱怒自己的犧牲到底算什麼\n\n\n2. Mia面試完，在天文台兩人分別前夕\n當時Mia說，Where\
  \ are we? 包含了很多意思\n除了大家都懂得「我們現在感情狀態到底是怎樣」以外\n還包含著對未來的不安與躊躇\n因為這次錄取的希望真的很大，如果成功，Mia就要去巴黎\n\
  而且一去不知道多久才回來\n雖然依然很想繼續跟對方在一起\n\n但這個時間點談「復合」對Seb真的公平嗎？\n\n若他們這時許下承諾，那未來Mia旅居他國發展事業\n\
  要Seb如此等待不知幾年的時間，對Seb未免太不公平\n一般人讀個大學或是出國留學就常難以維繫一段感情\n何況Mia是去外國追逐夢想發展事業，沒有歸期\n用承諾鎖住兩方對兩人都是不公平的\n\
  \n所以他們只能以「我會永遠愛你」做結\n讓這份情感收進心底的那個角落\n\n\n3. 結局\n很多人對於Mia的新感情好像難以釋懷，但人生就是這樣\n你無法確定何時會碰到另一個「對的人」\n\
  況且Mia是從默默無聞的素人發展到好萊塢明星\n一定不乏追求者，若Mia在人生如此大的變化下還要求她堅守Seb的這段情\n實在過苛，況且人在巴黎的Mia也無法得知Seb是否已經另結新歡\n\
  所以組成一個美好的家庭，Mia並沒有什麼錯，只是剛好Seb沒有找到「對的人」罷了\n\n當然不可否認的，就觀眾而言，Seb與Mia才是真正的靈魂伴侶\n也因此，他們永遠不可能忘懷那段曾經一起走過的路\n\
  也才會有如此多的惆悵\n\n導演最後用那麼多麼「如果」去構築各個平行時空\n呼應了我們的人生也如同「帕那大師」一般有如此多的「選擇」\n而正因為每一個選擇，才造就了你現在的人生\n\
  人必須因自己的決定背負一輩子的債，就像「香草天空」中湯姆克魯斯\n在選擇上車的那一剎那，就跟真愛擦肩而過了一般\n\n人生無法存檔，我們無法去審視究竟要更動哪個環節才能改變這個「現在」\n\
  那完美的「假如」就只能像劇末華麗的平行時空一樣\n永遠封存在Seb跟Mia跟心底深處\n\n\n直到永遠。\n\n\n\n\n--\n真的\n我也想！可是還沒找到時間QQ\n\
  我看完哭了大概3分鐘T^T\nMe too.（泣）\n謝謝你> <\n真的，只能盡量不去想QQ"
