url: https://www.ptt.cc/bbs/movie/M.1485618110.A.404.html
title: '[好雷] 樂來越愛你與52hz我愛你'
content: '先說我是一個很喜歡音樂劇的人

  所以我很喜歡這種歌舞片的電影


  我也非常開心繼天台之後又有一個本土的音樂電影


  而且終於不用在過年的時候 看老梗賀歲片了


  好了 以上都是廢話


  以下正文開始


  先說la la land吧


  本來它一上映的時候就想去看了 只可惜最近的工作太忙


  只好趁昨天除夕跟家人吃完飯後 晚上一個人跑去京華城看


  我很慶幸我是先看了la la land 因為說實話 雖然好看 但是有點太沈重了


  在新年的第一天 看完其實是很悲傷的


  有幾個地方我很喜歡 像是男女主角在山上的踢踏舞


  還有就是他們結局時在男主角開的音樂餐廳相遇


  男主角在彈琴時陷入了或許是另一個時空的他們


  可以好好的在一起 一起到老 而不是這樣的錯過


  不過整部戲我最喜歡的部分是女主角最後在面試角色的時候 唱出的內心故事


  那邊真的嚇到我了 我非常的喜歡


  整部電影最愛的就是那段了


  導演的運鏡手法非常棒


  由於太喜歡了 今天中午還跑去三創買了黑膠回來


  之後假如出藍光的話 我也會收


  再來是52HZ 我愛你


  看完la la land後 我帶著承重的心情 進入了52hz的場


  非常悲哀的是整個廳加上我也才五個人


  或許是時間太晚吧 不過也不錯 可以好好的享受這部電影


  這部電影 我覺得最大的亮點 就是女主角騎機車唱歌那段


  那個部分真的是非常的有創意


  再來我最喜歡的歌是開門關門這首歌 真的會一直在腦海裡重複唱著


  我之前去看完音樂劇後散場的時候 都會跟著哼裡面的歌曲


  不過看電影的時候就很少了 這首歌真的讓我回家的時候


  一邊騎車一邊跟著唱


  結尾范逸臣的大世界小世界也不錯


  看完後也讓我一掃la la land帶來的心情低落


  開心著一邊唱著歌一邊回家


  或許52hz真的沒有la la land這麼的好


  不過我真的很開心 台灣終於有人願意嘗試音樂電影


  而不是一昧的只為了搞笑而搞笑


  畢竟這類型的電影在台灣是非常小眾的


  我認識很多人 看這種唱歌的電影 到最後都會睡著


  所以我也知道它的票房不會這麼好


  不過非常謝謝魏導 願意拍這種小眾的音樂電影


  說實話 我並不是魏導迷 他之前拍過的電影 我只看過海角七號


  而且還是跟大家的風去看的


  之後拍的賽德克巴萊 棒球的 更是在第四台出現我都不會停下來看


  不過假如這部電影有出藍光的話 我也會收


  因為這代表了台灣音樂電影的第二步（第一步我想是周董的天台吧）


  以上廢話很多 沒什麼劇情的心得 謝謝大家


  喔 對了 忘了說52hz有一段劇情是男主角淋著雨 在街上唱歌那段


  那邊應該是有致敬萬花嬉春 金凱利的Singing In The Rain吧


  我個人是覺得滿像的啦


  以下連結是Singing In The Rain的連接













  --


  我並不同意你的觀點，但是我誓死捍衛你說話的權利。


  --

  我有試著找過 不過好像要跟黑膠唱盤綁在一起買 好像沒有看到單賣的

  你真的有看我的文章嗎？ 我開頭跟結尾都有提到天台呢'
