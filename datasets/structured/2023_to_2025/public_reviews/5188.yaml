url: https://www.ptt.cc/bbs/movie/M.1474293915.A.D58.html
title: '[新聞] 樂來越愛你獲多倫多大獎 放眼奧斯卡'
content: '（法新社多倫多18日電） 令人心醉的歌舞片「樂來越愛你」（La La Land）由雷恩葛斯

  林與艾瑪史東領銜主演，今天抱走多倫多國際電影節最高榮譽觀眾票選獎，朝奧斯卡金像

  獎之路邁進一大步。


  本片由31歲的達米恩查澤雷（Damien Chazelle）執導，描述落魄爵士鋼琴家與演員女友

  在洛杉磯奮鬥的故事，藉此向美國歌舞片黃金年代致敬。


  艾瑪史東（Emma Stone）飾演的蜜亞（Mia）是個天真的浪漫主義者，她在大大小小的徵

  選會中追尋夢想，但屢戰屢敗。而雷恩葛斯林（Ryan Gosling）飾演的賽巴斯汀（

  Sebastian）則是名只能勉強餬口度日的爵士鋼琴家，連帳單都是沉重的負擔。


  「樂來越愛你」8月底在威尼斯影展首映時，獲得影評與觀眾的一致好評。而對片商和經

  銷商來說，多倫多更是奧斯卡重要指標。


  過去幾年，在多倫多電影節獲得觀眾票選最佳影片殊榮的電影，之後都得到奧斯卡最高榮

  譽，例如「自由之心」（Twelve Years a Slave）、「王者之聲：宣戰時刻」（The

  King''s Speech）及「貧民百萬富翁」（Slumdog Millionaire）。


  去年的多倫多觀眾票選獎得主「驚爆焦點」（Spotlight），今年稍早也擊敗各路專家預

  測，拿下奧斯卡最佳影片大獎。


  今年角逐多倫多這項大獎的影片包括導演賈斯戴維斯（Garth Davis）電影處女作「獅子

  」（Lion，暫譯），以及奧斯卡得主露琵塔尼詠歐（Lupita Nyong''o）主演，印度導演米

  拉奈兒（Mira Nair）的作品「西洋棋后」（Queen of Katwe）。（譯者：中央社廖禹揚

  ）


  新聞網址：


  --'
