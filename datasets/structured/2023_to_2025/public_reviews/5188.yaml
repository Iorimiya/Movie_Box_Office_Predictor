url: https://www.ptt.cc/bbs/movie/M.1481470534.A.3F4.html
title: '[負雷]樂來越愛你-戲子無情的完美體現'
content: '非常喜歡導演的前兩部電影

  尤其喜歡<<進擊的鼓手>>優秀的情感表達與畫面經營

  我自身也曾經待過樂團

  只要看到指揮棒就想到

  當年因為一個小節不過拍子與音準的問題而不斷重來的情景


  回到本片

  會看這部電影主要是衝著導演與朋友相約去的

  影片結束後朋友哭了好一陣子

  在跟他討論的過程中

  有感而發

  才難得寫了此篇評論。


  ————以下防雷











  我就不細談本片中致敬的部份

  認真來講此片也不到難看

  只能說是無感

  可能這對於好萊屋的從業人員有切身之感吧

  也可以看到劇中一些致敬的小巧思

  關於歌舞片時代的懷舊已有版友書寫

  此部分自認認識不深我就不在贅言

  並且劇中的LA在在讓我想到GTA5

  也算是觀影中的一點小趣味


  畫面部份

  整部戲的光線運用近似於舞台劇

  尤其晚上那幾幕

  無論好壞至少是令人出戲的

  惱人的是好多段男主的鋼琴錄音都不是現場收音

  而是事後錄音

  譬如結婚的場面

  這邊的收音如此處理

  配音完全的跟現場切割

  有時候是一個很大的干擾與抽離


  而歌舞在此片我個人認為沒有到加分的作用

  有些橋段甚至顯得刻意

  曾有專業影評朋友說過

  歌舞片的歌與舞應是劇情不可分割的一部分

  抽掉歌舞此片就不成戲才是好的歌舞片

  而歌與舞的出場是情感的累積到達了極致

  所以為宣洩情感而唱

  至少此片我沒有太大的感覺

  有時候還會覺得單純的劇情片表現的會更好


  進入正題

  不敢說這部電影是純粹的悲劇

  但我覺得至少對男性是

  一部戲子無情的開朗側寫

  細思恐極

  原本還沒有如此感覺

  直到語朋友討論想到畫面中好幾段安排映襯

  不斷加深我的想法


  一開始為了理想、美好的愛戀

  女主在思考到可能會放男主鴿子的情況下

  還是出席了前男友的餐聚

  到了餐敘進行到一半

  才意識到自己不喜歡拘束於事業有成的男性那種空泛的嘴臉

  他們討論的印尼度假村等規劃的商業與浮華

  轉而投奔理想份子男主的懷抱

  我們就不談男主接近女主時

  女主明白告知有男友後雙方的心態轉折

  我就當他是前期情節安排


  後來開心的生活後進入了劇情中期

  兩方的夢想與現實碰撞

  男女主角分別扮演著激勵對方的角色

  但女角激勵男主是靠著跟媽媽的電話

  間接的暗示了男主應看向現實

  而在男主正接受了此現實的時候

  卻反過來置疑男主

  那是你喜歡的嗎？

  顯得幼稚且無禮

  這樣的無理取鬧實在是太過真實

  開餐廳與巡迴並無衝突

  那是為了完成開餐廳的夢想的必經道路

  唯一的顧慮點可能是要巡迴多時

  無法時刻顧慮女友

  而在此女主卻束諸夢想與情感

  當然也有期許男主能一直堅持夢想的成份在

  但無論如何都只看到了空中樓閣的泡沫

  並無提供實際的看法。


  看回女主

  男主在聯絡不到女主的情況下

  回想起許久前對談的某一部份

  找到他家

  竭盡心力的為了女主的夢想

  在最後成名前的部份推了女主一把

  並表明希望女主追尋夢想

  儘管那將讓女主遠離

  兩相對照

  男主無論如何的支持

  與女主失意自我否定的崩潰逃離分手

  很難給予正面的肯定


  最後女主角在試鏡完去巴黎前的公園那場戲

  相互表達了永遠愛著對方的情感

  再後來便跳到五年後

  女主已成為知名演員

  家庭美滿甚至小孩可能都已經兩三歲左右

  代表女主在巴黎可能一年多就另外墜入愛河

  結婚生子

  誓約似乎沒留下太大波瀾。


  此段情節在一開始帶入女主老公並非男主時

  令人一時想像中老套與男主幸福美滿結局被打破

  頗感驚奇

  但細思含意

  也只映襯了承諾的無力。


  而最後情節

  帶出男主依舊一人

  而姊姊結婚後家庭幸福

  反襯男主可能依然掛念女主

  特別在女主已成為知名女演員

  他快步路過女主影片的廣告看板顯示了過去已成回憶的無奈與哀愁

  最後女主偶然路過酒吧

  可想見女主絲毫不知男主近況

  直到被老公帶入酒吧

  才發現那竟是男主經營的夢想餐廳

  而餐廳也使用當年女主的建議與設計

  此邊映對當初男主堅持的畫面

  不免有不勝唏噓之感

  物是人非

  兩邊都達成了當初分離時的夢想

  但身邊已無你我

  過去也只成夢想與追憶


  戲子無情作為本片基調

  或許這也是導演暗暗想訴說的吧

  個人猜想


  --


  是啊

  要不然免強給普吧



  是嗎？

  原來不是主唱結婚？

  這段我看漏了嗎，那結婚的是誰啊

  可以告知一下嗎我再編輯文章

  感謝告知



  我沒說他刻意啊

  我是說造成男主角接受樂團的契機是女主與他爸媽的電話

  電話中提到爸媽問說女主有固定演出嗎

  然後回沒有

  然後就是反正他會想辦法開店的

  店會受歡迎的

  男主看了一下牆壁的漏水

  還是回歸現實

  儘管是不怎麼認同的表演形式

  為了能達成夢想也讓女主能更有信心地相信男主

  第二點

  就算那不是誓約也不是果斷分離的台詞吧

  最少表現的形式是至少對對方還有感情的

  還是你會對沒有想法的人說出永遠愛你？



  對不住了

  那我改一下真心付出最後被遺忘的人好了



  至少是必經的賺錢之路



  當然也有

  但是否要分離許久也是一個重點呢

  當女主聽到一張專輯巡迴兩年時整個爆氣

  對照前面分開一陣子

  就留語音給男友說想你了

  我想還是有相當成分的寂寞吧



  這邊沒講清楚

  我把編劇也算進去了

  科洛弗



  感謝告知

  已修改文章



  這段蠻真實的

  我覺得也是這樣

  沒好好哄女朋友哈哈哈哈哈哈

  但改變不了女主無理取鬧的概念啊

  艾瑪史東哎



  可能

  但我覺得某部分也是導演刻意為之

  還是你跟我說他快步走過看板

  心中雀躍開心的祝福他

  整個太開心了呢？

  常理推論一下看到前女友的近況會有什麼反應好嗎

  不是說他痛恨前女友

  而是至少是哀傷的

  最後一段的鋼琴獨奏

  你看起來像釋懷的祝福嗎？



  抱歉我哪裡打錯了呢？



  這邊我也有點不懂

  其實後面男主也認了吧

  這就是主流跟理想的取捨

  必須先服膺主流

  才有機會推展理想

  John Legend也說了

  現在誰聽爵士

  你只在餐廳彈給90歲的人聽

  讓爵士死掉的是你

  現在有機會讓人聽到

  你才有機會實現理想



  這邊如果男主自己都接受了

  那女主在崩潰跑走什麼

  暫時巡迴是放棄夢想嗎？

  夢想是開店吧

  要有錢才能開店吧

  一時的加入樂團才能讓爵士給更多人聽到啊

  不是這樣嗎？

  這才是真正想做的吧



  謝謝你這麼不遺餘力的噓我

  我的偏見你可以回答一下我上面的問題

  然後最後一段

  一開始Emma很明顯是有點侷促的

  並不是釋懷的表情

  然後最後她老公問他說是否再聽一首

  他明確的表示拒絕

  最後對望

  你可以覺得他們兩個相知相席都很開心

  我的看法至少男主是有點惆悵的

  如果今天的演法是他去找男主敘舊

  結局是敘舊的對談

  我就會全然的同意兩人的釋懷


  然後我懷疑你是不是有類似經驗

  或是至少是女生？

  抱歉我個人臆測，但你2的感覺的到你的怒氣接近偏激了



  當然你可以不認同

  我只是舉出我看到的幾個點

  如果有想要討論的地方我都會回



  情境不一樣

  進擊大部分都是樂團演出或表演空間

  雖然也有問題

  但情節合理

  而且現場錄音

  樂團可能是各個樂器獨自收音

  這是表演錄音很常見的

