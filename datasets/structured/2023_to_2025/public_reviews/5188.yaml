url: https://www.ptt.cc/bbs/movie/M.1516036272.A.4B8.html
title: '[好雷] 樂來越愛你&大娛樂家'
content: '防雷頁

  -小弟第一次發電影文還請大家多多指教。

  -

  -

  -

  -

  -

  -

  -

  -

  -

  -

  -

  -

  -

  -

  -

  -

  -

  -

  -

  -

  -

  -

  -

  _

  上個月才二刷完大娛樂家，然後者幾天把一直都沒看的LALALAND補完，覺得真是太美好了，2017的年頭和年尾帶給我們帶來兩部精采的歌舞片。

  看完也覺得兩部其實不外乎再說同一件事情：莫忘初衷。

  LALALAND著重在追求夢想前的部分，

  而大娛樂家則把達成夢想後的部分補足了。

  在<樂>片中，米亞和賽巴斯坦我想不只是單單的純愛情，他們的情誼中包涵更多的是扶持。電影中段，賽巴斯坦為了達到所謂穩定的工作，他選擇放棄了自己最愛的純爵士樂，參加了好友的樂團巡演，走向流行被眾多年輕人青睞，後來被米雅在晚餐的爭吵中點醒。而後來米雅在自己的獨腳戲中，面臨寥寥無幾的觀眾外還有後台觀眾的數落，甚至等不到自己的愛人出場而負氣回到家鄉放棄一切，也是在賽巴斯坦的試片通知下而抓住機會放手一試。

  從另一個角度中，<大>片中的團員們及巴納姆不也是互相扶持嗎？巴納姆給了團員一個表演的舞台，給了他們一個家的感受，後來巴納姆被利益盲目後重重跌到谷底時，團員們也提醒他應該要回到一開始創辦馬戲團的熱情把那個”家”找回來。

  <樂>片告訴我們現實可能使我們膽小，

  而選擇向他低頭，拋棄初衷的夢想。

  <大>片則告訴我們現實可能使我們狂妄

  ，被利益兩字薰昏頭，背棄夢想的初衷。

  個人覺得賽巴斯坦獨唱的city of stars 也和巴納姆唱的a million dreams 相呼應前者唱出對夢想的茫然，後者確信自己會達成夢想

  “Is this the start of something wonderful and new?

  Or one more dream that I cannot make true?”

  “A million dreams is all it''s gonna take.

  A million dreams for the world we''re gonna make”

  -

  另外兩部片的音樂雖然風格滿截然不同的，但都值得一聽再聽。

  -----

  Sent from JPTT on my iPhone


  --

  我是覺得la中間某些橋段有點悶，不過最後那個佈景與回憶幻想的交錯我好愛，畫龍點睛。


  中間男女主角跳舞飄起來我就飄走了XD

  男女主角互相扶持 會很消極嗎？

  有後勁，畢竟大家追夢的過程也都需要與現實辯論。

  以劇情編排來說拉拉的起承轉合完整，用春夏秋冬搭配男女主角的感情線來說故事，最

  後的回憶再說一次同樣的故事卻有新的風貌真的很強。大娛樂家劇情則是比較薄弱一些，就


  調酒師很可愛XD

  狼叔唱歌跳舞就值得二刷了！

  拉拉的背景音樂就很迷人了

  都很值得看！'
