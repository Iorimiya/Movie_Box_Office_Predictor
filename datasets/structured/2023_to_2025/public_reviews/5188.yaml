url: https://www.ptt.cc/bbs/movie/M.1662603173.A.D61.html
title: '[新聞] 《樂來越愛你》導演新作《巴比倫》首曝劇'
content: '《樂來越愛你》導演新作《巴比倫》首曝劇照！小布、瑪格羅比、陶比麥奎爾共譜星海史

  詩






  《樂來越愛你》（La La Land）導演戴米恩查澤爾（Damien Chazelle）重現好萊塢古早

  盛世的史詩鉅片《巴比倫》（Babylon）今透過《浮華世界》（Vanity Fair）雜誌釋出了

  首波劇照。本片時空設置在正處默片轉型至有聲電影的二零年代好萊塢，劇中混合了多位

  虛構角色與真實人物，並將以 R 級尺度呈現，是一部極富大膽作者風格、成本耗資甚鉅

  的作品，查澤爾表示，他想描繪當時好萊塢的有多麼地奢華、膽大與狂野。










  《巴比倫》尚未透露確切的劇情，但某幾位主要角色的身分已經公開，而且大多數是融合

  多位真實人物去塑造的，例如布萊德彼特（Brad Pitt）扮演的是一位名叫「傑克康拉德

  」的電影明星，此角便融合了約翰吉爾伯特（John Gilbert）、克拉克蓋博（Clark

  Gable）、道格拉斯法爾班克斯（Douglas Fairbanks）等已故演員的特質，小布先前更被

  誤傳是直接扮演吉爾伯特本尊。


  瑪格羅比（Margot Robbie）的角色則被命名為「奈莉拉羅伊」，是一名滿懷抱負的女演

  員，此角融合了克拉拉伯恩（Clara Bow）、瓊克勞馥（Joan Crawford）等早期巨星的形

  象與個性，羅比先前也同樣被誤傳過是直接扮演克拉拉伯恩本人。本片另一位主角則是《

  毒梟：墨西哥》（Narcos：Mexico）男星-狄亞哥卡爾瓦（Diego Calva，下圖右），他飾

  演的是充當觀眾視角的局外人角色「曼尼托雷斯」。












  全片所有要角當中，唯一扮演真實人物的是麥斯明格拉（Max Minghella），他擔綱的角

  色是早逝的名製片人厄文托爾伯格（Irving Thalberg）。兼任本片監製之一的「蜘蛛人

  」陶比麥奎爾（Tobey Maguire，上圖）之前被傳聞是扮演查理卓別林（Charlie Chaplin

  ），但實際上他扮演的是原創角色「詹姆斯麥凱」。


  《巴比倫》其餘卡司還有：珍史瑪特（Jean Smart）、Flea、薩瑪拉威明（Samara

  Weaving）、盧卡斯哈斯（Lukas Haas）、艾瑞克羅勃茲（Eric Roberts）、P.J. 拜恩（

  P.J. Byrne）、約翰艾德坡（Jovan Adepo）、凱薩琳瓦特斯頓（Katherine Waterston）

  、克洛伊菲曼（Chloe Fineman）、《雲端情人》（Her）導演史派克瓊斯（Spike Jonze

  ）、近年憑《A+瞎妹》（Booksmart）轉型導演的奧莉薇亞魏爾德（Olivia Wilde）等人

  。


  該片的監製陣容還包括：由戴米恩查澤爾的妻子奧莉薇雅漢彌爾頓（Olivia Hamilton）

  、《樂來越愛你》的製片人馬克普拉特（Marc Platt）及馬修普勞夫（Matthew Plouffe

  ），和查澤爾合作過《樂來越愛你》的作曲家-賈斯汀赫維茲（Justin Hurwitz）與攝影

  指導-萊納斯桑格倫（Linus Sandgren）亦繼續參與了《巴比倫》的製作。北美預定 12

  月 25 日上映。




  --'
