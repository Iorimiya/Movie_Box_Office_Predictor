title: '[好雷] 樂來越愛你 - 真實的愛情'
content: '網誌圖文版：



  已經好久沒去華山光顧了


  昨天聽到別人很推這部


  趁著今天晚上有空擋就一起去華山光顧了


  不爆雷極短評的話


  這部片過程用充滿憧憬的描述和真實的結尾


  來表現現實生活的愛情也許正是如此吧


  防雷分隔頁


  防雷分隔頁


  防雷分隔頁


  防雷分隔頁


  防雷分隔頁


  防雷分隔頁


  防雷分隔頁


  防雷分隔頁


  防雷分隔頁


  防雷分隔頁


  防雷分隔頁





  也許就像大家認為的愛情一樣


  有個很不一樣的開端


  賽巴斯汀 ( 雷恩 葛林 飾 ) 和 蜜亞 ( 艾瑪 史東 飾 ) 不管是第一次在餐廳有意識的

  相遇


  還是沒有意會到的在塞車時的相遇都是那麼的偶然


  多次巧遇後兩人同時陷入愛河


  兩個人都互相希望對方能勇敢的去追求自己的夢想


  當女主角看到男主角在朋友樂團的表演內容


  不難看出女主角眼神中透漏出來的懷疑


  在餐桌上男主角坦承了自己的選擇是因為他必須長大


  一部份除了面對現實生活的壓力之外


  另一部份是為了能讓女主角能更放心的去追求她的演員夢


  當女主角回到家鄉放棄的時候男主角硬是把她來回來


  抓住了最後的機會走向大舞台


  兩人坐在椅子上聊著彼佌現實狀況時


  都期望對方去追求夢想也都許下會一直愛著對方的承諾


  男主角有了自己真正夢寐以求的爵士酒吧


  女主角成為了知名的演員但身邊也有了另一個人


  最後在酒吧男主角的演奏下


  兩個人一起勾勒了雙方共同期待的故事發展


  隨著最後小節音樂的結束回到了現實


  兩個人一樣的笑容不同的涵意


  一段感情也就這樣結束


  //////////////////////////////////////////////////////////////////////





  其實感情中難免有像男主角一樣的那個人


  可以說是另類的說一套做一套


  不斷的督促自己的愛人去追求夢想


  自己卻可以未了對方而放棄夢想


  到最後等不到自己心愛的那個人


  自己能在最後為愛人


  做的一件事


  就是在臉上加上個祝福的微笑來掩飾心中的那份失落


  ///////////////////////////////////////////////////////////////////////





  也許有人會覺得女主角背叛了男主角


  但是從女主角一開始坦白她不愛爵士


  男主角在餐廳努力的跟他解釋爵士的特別之處


  到後面看到男主角跟著上台彈琴時女主角開心的樣子


  甚至到女主角看著男主角樂團演出


  那份想替男主角開心但是心裡卻發現這不是男主角真心想要的


  那個擔心又困惑的眼神


  不難感受的到女主角也希望男主角選擇的是他真心想要的夢想


  但是夢想常常擋著一個東西在前面


  就是現實


  在這部片看來男主角把現實扛了起來讓女主角走向夢想


  而自己扛著現實也慢慢的走到夢想的同時


  眼前看到的是女主角在她的夢想那組成了自己的家庭


  女主角應該也沒想過會在和男主角遇到而選擇了現實的老公


  所以當她走到了男主角的酒吧


  聽著男主角的表演


  五年前的那句會一直愛著對方


  我想並沒有食言


  只是那份愛在這幾年已經永遠放在心裡了


  ///////////////////////////////////////////////////////////////////////





  當旋律響起時間拉回在餐廳相遇的那天


  後序的想像傻呆哥認為導演想表現的


  就是如果事情這樣發展那會是最如他們期望的結果


  可以看到幾個傻呆哥注意到和現實不同的地方


  餐廳時男主角多停留而接受女主角的示意


  當男主角的朋友找他組團時選擇拒絕而不是為了女主角而簽約


  女主角依然取得了演戲的資格而男主角一同前往巴黎


  接著就是兩個人過著幸福的日子一起前往酒吧


  我覺得這之間最大的感慨


  就是男主角為了女主角而簽約加入樂團應該是最大的分歧點


  不過傻呆哥不覺得這代表人不該為愛人付出


  時間就是不斷的前進


  在愛著對方的當下誰不希望能讓對方更幸福呢


  但是傻呆哥看完還是心情好悶阿！！！！！


  相愛的人有著遺憾最難過了QQ


  最後附上不斷徘徊在腦海的主題曲





  --


  FaceBook 粉絲專頁：


  痞客邦 - 傻呆哥快樂過生活：


  --'
