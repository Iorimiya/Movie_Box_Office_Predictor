url: https://www.ptt.cc/bbs/movie/M.1495624578.A.D82.html
title: '[好雷]lalaland樂來越愛你-華麗包裝的現實愛情'
content: '防雷

  *********************





  少部分的人，將愛情當作是氧氣，沒有愛情的滋潤，就如同枯草

  大部分的人，將愛情當作是調味品，讓人生充滿了快樂。但，不是最重要的。


  這個社會的氛圍，告知年輕男女們，夢想、事業比感情重要。因為，

  「愛情可以當飯吃嗎?』


  為何大家稱這部電影，寫實。明明影像間，是華麗、色彩鮮豔、浮誇。

  其實在糖果般的包裝下，是恐怖的都市男女"愛情"故事。


  Seb與Mia，互相愛上彼此對夢想的熱愛。其實，他們是個性不同的人。唯一相同之處，

  就是對於夢想的執著。外鄉人，一同在這個大都市追夢，期待著有一天，能夠成功。


  這個社會對年輕人下了許多標籤、塑造許多期待。因此，Seb加入樂團，簽了長約。

  他以為，只要他有穩定的收入，賺到足夠的錢，最後開一間爵士店，就可以讓Mia開心，

  即使Mia當一個沒人欣賞的演員，Seb也可以說：管他們去死。

  在Seb心中，即使我是唯一的觀眾，我也要報以最大最熱烈的掌聲，支持Mia演戲。

  沒關係，只有我欣賞妳，那又如何 ?我愛妳啊！


  雖然我的夢想很重要，可是妳是星空中閃耀的星星，如果可以跟妳在一起，

  雖然我會遺憾，可是我感到幸福。沒關係，只要能在一起，我願意對現實妥協。

  這是Seb的想法吧。


  唯一要讓Mia無後顧之憂，就是Seb犧牲自己的夢想，放棄正統爵士，好好賺錢。

  這是社會對男生的期許，而Seb以為Mia會開心。


  結果這是爭吵的開端。


  因為這不是Mia要的Seb。Mia不滿Seb去彈自己不愛的音樂，而且為了這該死的音樂，

  還犧牲兩人相處的時間。兩人沒有對錯，觀點不同而已。

  Mia獨角戲失敗後，傷心的跟Seb說要結束這一切。包含她的演藝事業，她的感情。

  她哭泣的開啟車門，說要回家。

  Seb說：這就是妳家阿！(這是我辛苦努力要造給妳的家，有妳在的地方，就是我們的家。)

  Mia說：我要回真正的家。

  喔，好殘忍的一句話。如果我是Seb，心都碎了。

  Mia第一次提分手。Seb被迫分手。



  這場獨角戲，卻也開啟Mia的演藝事業，Mia拿到了一個女主角腳色，千載難逢的好機會。

  試鏡結束後，Seb與Mia坐在公園長椅，

  Mia問：我們現在是什麼狀態?

  Seb說：不知道

  Mia又問：我們以後要怎麼辦?

  Seb說：我覺得我們什麼也做不了。等妳拿到腳色，妳必須付出一切，全力以赴，

  這是妳的夢想。(其實沒把話說死，等女主角的答覆)

  Mia問：那你要做什麼?

  Seb說：留下來，完成我的計畫。

  總而言之，最後Mia對Seb說：我會永遠愛你。

  這是第二次提分手，永遠都是Mia提分手。Seb又能如何呢??

  他知道Mia要的他給不起，他已經簽了長約，無法違約。不然違約金誰要付??

  他在這個圈子還要混嗎??? 所以只能放她自由。


  理智上，知道和平分開是最好的。喔，這社會大家都是用理智來思考的。

  如果女生選擇跟男生在一起不去歐洲，

  那台灣家長的評語一定是：頭殼壞去惹。你以後一定會後悔。


  我身邊認識的人，就有五對，出國分手案例。

  理由不外乎：對未來沒有共識、距離很遠不在身邊、價值觀不同、追求的東西不同。

  也很抱歉我認識的人不夠多，所以沒有認識，出國遠距後，修成正果的。

  看到這段真想對導演說：導演，你的觀察跟我一樣耶！我身邊也是這樣耶！好有既視感喔！



  最後的收尾，最讓我喜歡。因為音樂好聽、畫面漂亮、場景浪漫，視覺饗宴！

  當Seb開始彈琴，Mia陷入過去的回想。我看文章，有人解讀這是Seb的幻想。


  但我的看法是，這是Mia的幻想，因為整場鏡頭是由Mia的視角出發。


  幻想中：兩人在餐廳熱吻、陷入熱戀、Seb拒絕奇斯加入樂團的邀請、

  Mia獨角戲大成功、Seb來觀看然後歡呼的最大聲最用力、Mia得到女主角演出機會、

  Seb跟著飛往歐洲。Seb在酒吧彈琴，Mia成為女明星，下班後，兩人漫步在巴黎街道，

  在星空下跳舞。兩人有了小家庭，一起有了小女兒，還抽空晚上去約會吃飯！


  喔！好甜的兩人，Mia總是笑得像是甜的可以出水的花，身上的衣服彩度、亮度極高，

  像是一隻孔雀一樣。婚後她也像熱戀中的少女。

  兩人彼此互相凝視，都是充滿深情。互動都充滿著甜蜜。


  當音樂停止，眾人響起如雷掌聲。

  而Mia臉色蒼白，現在換她，心碎了。

  她沒辦法為他鼓掌。她眉頭深鎖，眼眶泛淚。

  導演安排她5年後結婚生子，就是要在這一幕呈現她的"後悔"。

  現實生活中，就是這麼殘酷，充滿後悔！無論怎麼選，都是後悔。


  導演將Mia的丈夫拍得很扁平，甚至看不出，Mia很愛丈夫的感覺。

  好像就是家人一樣。跟這段後悔，很相襯。她為了成就事業、夢想，犧牲的，

  是自己的愛！

  即使五年過去，Mia依然愛他。聽到音樂，熱淚盈眶。


  六年前，Mia在晚餐聽到這段音樂，她可以勇敢地，去找Seb。

  那時候她沒有任何包袱。兩人轟轟烈烈地談戀愛。

  而現在，她已經結婚生子，有家庭，有事業。即使她愛他，又能如何????

  她現在去愛他，更會是身敗名裂，代價比5年前還大！


  所以Mia的丈夫問她要不要，再聽一首。

  Mia虛弱的說：不，我們該走了。

  再聽下去，她恐怕克制不住，自己的眼淚潰堤。


  我喜歡這段的原因，就是因為，很寫實。因為現實生活中，就是這樣的。


  在電影<扭轉奇蹟>裡，

  天使要讓傑克恢復單身大富豪時，傑克不想。雖然他會為了一包便宜的鹽碎碎念很貴，

  他甘之如飴。最後來個好萊塢結局，就是傑克後悔了，而他深愛的女人凱特居然也單身，

  他決定要追求她回來，兩人一起開心共進咖啡。


  喔喔，偏偏導演不成全觀眾呢！現實中，就是分開後，男婚女嫁，各不相干了！

  你知道的，這才是出社會後，男女感情的真相。

  絕對不像是電影、小說那麼浪漫，很殘酷，會讓你心痛、心碎。


  人生區區數十載，夢想、愛情偏偏是在20-30歲這個區間是精華。

  最可恨的是，愛情，是個超級奢侈品，人一生中有一段真愛，已算難得，

  大部分的人是尋尋覓覓而不可得。

  同樣的，夢想與機會也一樣，可能一輩子只有一次。


  如果這兩樣，同時擺在眾人眼前，只能二選一，你要哪樣?????

  這社會的現實是，大部分的人，都會選擇夢想與事業的。


  呼應我的開頭，愛情，能當飯吃嗎??????


  導演的片中， 道出大部分的人的選擇。

  殘酷、現實，配上美麗的畫面，極大的落差，引起我這個觀者的反思。


  我愛這部電影所有的段落、安排、結局，

  我想說，Seb，你值得更好的女孩！XD







