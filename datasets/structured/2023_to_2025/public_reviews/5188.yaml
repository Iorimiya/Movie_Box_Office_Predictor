url: https://www.ptt.cc/bbs/movie/M.1481718357.A.53C.html
title: '[好雷] 樂來越愛你/La La Land'
content: '電影名稱:樂來越愛你/La La Land


  導演:達米恩查澤雷(Damien Chazelle)


  --


  原文網址:


  導演到底有什麼魔力讓我看完他的電影都想去買張原聲帶(事實上也買了)!


  上一次是進擊的鼓手，看完出來一直登!登!登!的哼，這次看完也是腦中不停重複那琅琅

  上口的旋律，但多了一份感傷跟欣慰(上次只覺得根本兩個瘋子遇到知己)。


  而好萊塢果然就是要歌舞片，雖然我不屬於那個歌舞片的黃金時代，但就跟電影中John

  Legend說的一樣，不創新現在的年輕人怎麼接受。有人看到演一演突然唱起歌跳起舞就出

  戲到不要不要的(雖然我就愛看唱唱跳跳)，而導演把歌舞、場景、服裝、燈光、劇情融合

  的恰如其分，分寸抓得剛剛好，復古但不見老態，一次打中守舊創新兩個族群(拜託打中

  奧斯卡評審)!


  平淡而現實的結尾沖淡了夢幻的歌舞，特別是結尾前的那一段平行時空。但又能怎樣呢?

  當初每個決定雙方都再勇敢一點，或是再為對方再多做點改變嗎?那或許失去的就是別的

  東西而有著另外一種帶有遺憾的現實，而這個不圓滿就是大部分我們的現實(所以才顯得

  那麼真)。畢竟他們都是被追逐夢想的對方所吸引，所以才會覺得結尾雖有感傷但卻令人

  欣慰。如果當初Seb跟Mia結婚，Seb會實現他原本的夢想開一間club嗎?(顧小孩都來不及

  了，現任老公也是偷到短暫的空檔才溜出來去爵士酒吧聽聽歌喝喝酒的吧!)


  看完電影，拿出原聲帶慢慢咀嚼劇中每一首歌的歌詞，實在覺得太貼切太真實了，講述對

  於追夢的人，追夢的兩個人。(實在太愛City of stars跟Audition了!)利用冬春夏秋冬的

  季節轉換，慢慢用暗示的方式帶出劇情，但兩人的認識卻不緩慢，充滿著巧合與激情，像

  極了兩顆星星的碰撞，毫不掩飾。雖然中段節奏稍慢，但靜靜地感受兩人的愛跟磨合也是

  十分享受。


  一直很崇拜自編自導的導演(雲端情人的Spike Jonze也是!)，可以把自己想說的，自己最

  深層的想法，不受拘束的表現出來，那是導演最真的東西。看來說Chazelle是美國導演新

  希望也不為過，畢竟他才那麼年輕。最後說一下Emma Stone(好正!)跟Ryan Gosling真的

  好來電啊(雖然我一直想到假會徵信社裡Ryan的表現，太衝擊了!)


  --'
