url: https://www.ptt.cc/bbs/movie/M.1483449876.A.912.html
title: '[普雷]樂來越愛你-滿滿的出戲大平台'
content: "如題\n另外由於隔了一天才打 也不是對劇情細節特別省心的人\n如果有錯誤 再煩請版友指證\n以下有雷\n\n\n\n\n\n\n\n\n先從劇情開始\n\
  導演很明顯是想用一個男女主角事業有成\n(能開家bar 定期演出 應該也有一定資產了啦)\n但愛情卻無以為繼的結局 來向過去歌舞片的繁華多彩\n致敬一小段最後的遺憾\
  \ 但是\n為了這樣的結局 情節卻不可避免的發展向突兀\n\n先以Mia線開始 Mia算是比較能讓人接受的\n反正就是有演技有實力 但是試鏡無法發揮完全\n所以在有充分表現機會的獨角戲後\
  \ 才能就被意外看到的選角發掘\n五年後成為知名女星 算是很好接受的發展\n導演也有讓Mia多了編劇的能力 讓她更符合選角指導的需求\n(也有可能反過來就是了)\n\
  \n但是另外一方的Seb 就讓我完全不能接受\n\n導演 Damien Chazelle 兩年前打響名號的作品 Whiplash\n和樂來越愛你一樣都是有著爵士元素的電影\n\
  但兩年前在敘述爵士時   Whiplash所帶來的突兀感\n到樂來越愛你時不但沒有消失  反而更加嚴重\n兩年前我可以跟自己說我不懂美國音樂學院在爵士相關的教育\n\
  有突兀感是可接受的\n\n但在樂來越愛你中 主角已經是一個在外闖蕩的樂手\n導演 Damien Chazelle對爵士的想像 怎麼還是一樣的窄?\n\n首先 很明顯的\
  \ 導演非常喜歡50,60的老爵士\n這無可厚非 畢竟我相信每個喜歡爵士的人 肯定都相當喜歡那個黃金時期\n但是你不能只讓這樣的爵士出現在片中啊\n譬如Seb\
  \ 他想要走他所謂的pure Jazz 而跟他對比的\n卻是玩著流行味相當濃的R&B的Keith?\n我以為pure Jazz的對比應該是70,80後漸趨流行的fusion才對\n\
  更別說各爵士樂廠牌就算商業成績大不如前 這幾年還是有穩定出片\n如果Seb是很明確的說自己連這些現代爵士樂手的作品都不喜歡 也就算了\n但全片就是一直提Charlie\
  \ Parker,Louis Armstrong,Monk,Coltrane這些人\n搞得好像從他們以後 全世界只剩Kenny G會吹薩克斯風\n表演非爵士在誤導大眾一樣\n\
  (不過誤導是真的)\n其他樂器都不提 提鋼琴就好\nChick Corea,Herbie Hancock,McCoy Tyner這些人咧?\n這些在爵士樂界也是大師等級\
  \ 但年代略晚\n也跟fusion有較多接觸的樂手 Seb你又是怎麼想這些人的?\n導演完全不提 就好像這些人不存在一樣\n就連Keith要罵Seb  提的具開創性的樂手也還是Monk\n\
  Monk很有開創性沒錯 但在21世紀 一個堅持60爵士\n和玩聽起來很白的R&B的兩人的對話 你們也未免漏掉太多東西\n\n劇情雖然沒說清楚 但Seb似乎也是音樂學校出來的\n\
  如果實力真的出眾 那多少應該還是有跟許多爵士樂手合作的機會\n但導演就是甚麼也沒提 反正就是任性放了一個有實力(據Keith所言)\n可惜不得志 只能在酒吧彈琴\
  \ 認為時代不懂爵士\n卻徹底無視明明世界上還有正在活躍的爵士樂手的 呃 有實力的鋼琴家\n必須說這還真的無法說服我\n\n然後是音樂 還有音樂跟電影畫面之間的處理\n\
  我歌舞片,音樂劇看得不多 但在我觀念中 音樂的譜寫上應該會隨角色有所差異才是\n像現在百老匯很紅的Hamilton 甚至進一步用饒舌風格(其實是flow)來區分各角色\n\
  \n但在樂來越愛你中 卻沒怎麼聽到這種區別\n可能跟這部片歌舞段落還是偏少有關 但是最基本的\nSeb至少可以弄得稍微爵士一些吧 至少多加點即興感覺的東西?\n\
  但依然沒有 最末段兩人在酒吧相遇\nSeb開頭的獨奏還是弄成抒情-歌舞風-一點點爵士感覺的風格\n不難聽 但Seb的身分設定 又再一次讓人覺得沒意義\n(還有有段歌舞\
  \ 在燈屋裡Seb和樂隊合奏 琴彈得頗難聽\n 讓我一度以為這是Seb不得志的伏筆 沒想到設定中他是有實力的)\n\n音樂與畫面的處理大概比較主觀 但在宇宙中跳舞這我真的無法\n\
  也許有致敬吧 但在畫質清晰的今天\n這畫面我看得真的好生尷尬\n結尾一個場景接著一個跳 越跳越長 越跳越出戲\n一大堆刻意色彩艷麗的電影場景 頂多也只是讓人錯覺自己在環球影城裡而已\n\
  沒有狂歡沒有懷舊 一切都是那麼的刻意\n就好像看醫美塑膠臉 都曾經那麼真實\n讓人相信它們真正存在過 但現在看來就是尷尬\n讓人想拜託導演 回憶就放在腦海裡\n\
  別再摧殘它們了 有些東西真的不該讓它們暴露在陽光下才是\n--\n不覺得這是嚴謹的那一面 這些都是不需要太多時間就可以解決的小細節 譬如Keith和Seb談\n\
  書可以嗎？推一本But Beautiful 台灣翻譯好像叫然而，很美 書寫的樂手也剛好是Seb會喜歡的那一卦\n有想過這種可能 如果真的是這樣 我覺得加個幾句台詞提一下\
  \ 讓一切不要太突兀 並不是太難\n可能他只喜歡到Cool Jazz時期的Miles 無法接受Bitches Brew…大概吧\n我沒看過啊QAQ 只是狂聽原聲帶而已"
