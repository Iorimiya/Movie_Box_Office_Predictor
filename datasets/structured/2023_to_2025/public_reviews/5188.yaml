url: https://www.ptt.cc/bbs/movie/M.1470068533.A.658.html
title: '[新聞] 威尼斯主席︰樂來越愛你有機會前進奧斯卡'
content: '新聞網址：



  文/Jean


  第 73 屆威尼斯影展在上個禮拜釋出了今年的競賽片名單以及參展作品，包含開幕片《

  樂來越愛你》（La La Land）、《為妳說的謊》（The Light Between Oceans）、《夜

  行動物》（Nocturnal Animals）、《Arrival》等多部好萊塢明星主演的作品除了將在

  威尼斯跨海世界首映外，也都將一同角逐金獅獎。


  當然過去也有不少美國製作的電影及影人在威尼斯影展受到青睞，不過近幾年包括第 70

  、71 屆連續兩年的開幕片《地心引力》（Gravity）與《鳥人》（Birdman），第 72 屆

  的非參賽作品《驚爆焦點》（Spotlight）都一舉將氣勢帶回美國本土，也成為了奧斯卡

  獎的贏家，而影展主席 Alberto Barbera 在接受 Screen Daily 的訪問時則透露，他認

  為《樂來越愛你》是今年最有機會前進奧斯卡的作品。


  從先前宣布《樂來越愛你》將擔任今年開幕片時，Alberto Barbera 就已經說明緣由，

  此片可以說是對美國音樂劇黃金年代的一種致敬。而今他再表示，本片是以最棒的方式

  呈現出一部經典的美國電影；一部由萊恩葛斯林（Ryan Gosling）與艾瑪史東（Emma

  Stone）兩位優秀演員所演出的音樂劇電影，令人讚嘆的表演彷彿重現了已不復見的景

  象。


  另外，Alberto Barbera 也透露，為配合華納兄弟影業的宣傳期，無法邀到克林伊斯威

  特（Clint Eastwood）執導、湯姆漢克斯（Tom Hanks）主演的《薩利機長：哈德遜奇

  蹟》（Sully）則是他今年心中最大的遺珠。


  ------------------------------------------------------------------------------


  參考外電:The Playlist

  Venice Film Festival Director Says ‘La La Land’ Is “Classic American

  Cinema At Its Best”



  心得︰不確定《樂來越愛你》會在未來的年底頒獎季與奧斯卡有多大影響力，

  但可以斷定此片的票房應該會比導演前作《進擊的鼓手》來得好


  另外蠻有趣的現象是，史東與葛斯林，儘管各自主演的電影

  在影壇有一定的地位，但他們兩人都只提名過一次的奧斯卡，

  史東唯一一次提名就是去年奧斯卡的大贏家《鳥人》，

  至於葛斯林，他個人雖然在金球獎有四次提名的紀錄，

  但他唯一一次在奧斯卡留名，其實是在2006年相當小品的劇情片《我的左派老師》，

  此後即使像藍色情人節、選戰風雲等片也有突破的演出，

  也有點可惜地成為初選即被刷下的落榜遺珠


  不曉得《樂來越愛你》這樣積極的造勢與宣傳，能不能幫葛斯林多一次奧斯卡提名？


  --'
