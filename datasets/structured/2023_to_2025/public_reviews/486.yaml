url: https://www.ptt.cc/bbs/movie/M.1740744763.A.162.html
title: '[好無雷] 【邪降女帝】有誠意的血腥特效邪降片'
content: '本文無劇情劇透

  手機使用者建議全版閱讀


  ‧


  如果是想享受被嚇的快感，也許這部電影會讓你失望，但【邪降女帝】是部有好好說故事

  ，以劇情取勝的電影，雖然部分橋段節奏有點拖沓，但不會為了嚇而嚇，算是對於劇情派

  的我，能夠好好享受一部成魔故事。



  ‧


  【邪降女帝】是【邪降3】與【邪降2：惡魔的藝術】的前傳起源作品，講述潘娜成魔之路

  的過程，雖然沒有宣傳所說的兩分鐘嚇一次，但血腥特效與噁心氛圍感算是給足了誠意，

  各種死法也頗有新意，尤其一些血腥橋段，膽小的觀眾也許會有點吃不消，雖然不是奢華

  噴血那樣畫面，但給予了觀眾相當的痛楚共感。


  而劇本給出許多元素，宗教、習俗、霸凌、不倫等，都是【邪降女帝】額外給觀眾的小看

  點，並且從角色群從善墮落到惡，或從惡走向光明，這樣的轉折，讓整體故事的更為高潮

  迭起。



  ‧


  但缺點也是明顯可見，如同前段所說的劇情拖沓外，做為BNK48隊長的女主角，演技發揮

  尚嫌不足，但與曾飾演【鬼聲泣】妹妹角色的拉塔娃蒂婉通，堪稱全片顏質擔當，讓整體

  畫面更加賞心悅目。


  而配樂的單調也是非常可惜的一點，無法為恐怖氛圍更畫龍點睛；部分場景特效CG也是有

  點廉價，像是湖中追逐的綠幕感就相當強烈。


  而劇中多巫鬥法跟後段女主角的宰制力感，都偏薄弱，讓觀眾覺得其成魔威力，可能不足

  以像片名所述的「稱帝」，雖然是前傳作品，角色能力還在萌芽階段，但觀眾想看的應該

  還是更多的邪降大場面或是更具震撼的儀式。



  ‧


  提出的這些缺點，雖然會令人感覺是偏向普或負評，劇本素材的確還有很大的進步空間，

  但算是有好好的說完說好整個故事，也沒有很廉價的嚇人手法，血腥特效都是相當有誠意

  ，對我而言可以是可以給到好評的程度，當然如果是很在乎Jump scare的試膽時刻，我想

  這部也許會期待落空，不過要是看膩了泰式喜劇鬼片後，換點這樣口味的恐怖片，其實也

  是個在週末消磨時光的好選擇。



  有一個片尾片段，本片將於3/7上映


  ‧




  追蹤茶太郎IG




  --'
