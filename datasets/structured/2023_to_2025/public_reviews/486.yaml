title: '[普偏負無雷] 邪降女帝'
content: '這部是原本期待已久的泰國恐怖片


  結果卻蠻失望的


  除了完全不是鬼片之外，也不怎麼恐怖


  覺得太多重複片段了看到膩（例如念咒）


  如果喜歡看鬼片或被Jump Scare的不怎麼推


  而且女帝潘娜演技還蠻令人出戲的


  我覺得有毀前作的形象


  整場在那邊雞雞叫 真的有點吵


  滿分100 我給60


  給及格是因為(Mim)拉塔娃蒂婉通有演出！







  另外也很期待《The woman in the yard》


  真希望有片商能引進啊




  --'
