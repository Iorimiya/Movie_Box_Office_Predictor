url: https://www.ptt.cc/bbs/movie/M.1737464042.A.13D.html
title: '[新聞] 泰國《邪降》原班團隊新作《邪降女帝》'
content: '新聞網址：



  20年前，恐怖片《邪降：惡魔的藝術》、《邪降3：鬼影隨行》將泰國鄉野傳說及神秘南

  洋降頭術帶到觀眾眼前，備受全球觀眾青睞，成為無數人午夜夢迴的惡夢來源，至今仍被

  不少影迷視為「恐怖片教科書」！《邪降》系列當年不僅締造票房佳績，更是首部進軍全

  球市場的黑巫術電影，在40個國家上映，開啟往後東南亞降頭電影的熱潮，被視為泰國降

  頭片之始祖！如今，正宗《邪降》團隊重磅回歸，恐懼新作《邪降女帝》將延續其獨特的

  敘事風格，將最惡毒的南洋降頭術大銀幕驚慄上演！



  值得一提的是，在泰國《邪降》系列裡美豔狠毒的「潘老師」多年來深植人心，每到教師

  節都是話題焦點，也使得《邪降女帝》自開拍就備受期待，最終泰國乾脆定檔教師節上映

  ，帶領觀眾一探她的神祕起源。在影迷的殷殷期盼下，本片更是未演先轟動，全泰排片占

  比高達41％！上周四正式上映後，首周末4天便突破3000萬泰銖，不僅勇奪票房冠軍，更

  是繼去年現象級電影《鬼聲泣2》後，開片最佳的泰國電影！亮眼的開片成績，還勝過近

  期上映的《神鬼戰士2》、《魔法壞女巫》、《海洋奇緣2》及《獅子王：木法沙》等好萊

  塢大片。



  《邪降女帝》描述出生在偏僻村莊的「潘娜」，從小被視為不祥之女而備受欺凌。長大後

  意外得知自己身世的潘娜，決心踏上血腥暴虐的復仇之路！本片出自泰國名導普提彭賽斯

  瑞考（Puttipong Saisrikaew）之手，擁有超過20年恐怖片製作經歷的他，同時也是兩部

  《邪降》系列前作的導演班底。提及重執經典神作的導筒，賽斯瑞考坦言壓力可不小，「

  這部電影不旦出名，在世界各地也都突破紀錄。但我認為這更是挑戰，透過這部片你會發

  現，各種形式的巫術都建立在相似的信仰之上，無論經過多少年，它都不會消失。如果你

  問我《邪降女帝》會有多可怕？我保證絕對不遜於前作，但最重要的是，你必須到電影院

  親自體驗！」




  《邪降女帝》前導預告片




  《邪降女帝》前導海報曝光。（圖／威視電影提供）



  《鬼聲泣》系列女主角拉塔娃蒂婉通也加入演出。



