url: https://www.ptt.cc/bbs/movie/M.1739547842.A.22A.html
title: '[討論] 邪降女帝是惡魔的藝術前傳'
content: '（邪降女帝）3/7上映


  下個月要上映的猛鬼電影《邪降女帝》


  原本以為只是長得很像潘老師


  然後剛好也只不過是姓潘的女主角的一個獨立故事


  結果還真的是當年2005上映的《邪降：惡魔的藝術》的前傳！！！


  能找到這麼像當年潘老師的演員也不簡單


  看了很久一直想說現在泰國醫美也太強了 過20年的潘老師也太凍齡


  結果是一個女團裡的成員演的XD


  還記得當時我朋友去看了那部之後就說以後不敢去泰國玩了


  希望這部可以從頭讓我頭皮發麻到尾


  感受一下泰國久違經典曠世巨作的震撼


  在這邊給當年覺得很經典的人推薦一下這部確定是邪降2的前傳


  然後這部泰國方面也已經在籌備續集了《邪降女帝2》



  （邪降女帝）



  （邪降女帝）



  （2005邪降：惡魔的藝術）










  --

  邪降1是獨立故事，2.3才是有關聯，但123都是同個導演，好像是當時第1集太紅的關係所

  以2.3也用邪降取名。'
