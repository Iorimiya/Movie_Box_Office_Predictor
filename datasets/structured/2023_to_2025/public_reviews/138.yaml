  2.：毒販頭頭，意外的遇上了夏隆後，就很照顧夏隆　　　　

  3.：阿里的女朋友，對夏隆這陌生的小孩非常友善


  4.：夏隆的媽媽，染上毒癮，為了毒品開始賣身賣家具，

  　　　　常常用血緣去綁住夏隆要他別離開自己，卻對夏隆很差。


  5.：夏隆的同學，從幼稚園就認識。大家都欺負夏隆時，他鼓勵夏隆

  6.：就那個看起來最壞的，我不在乎他叫啥，他從幼稚園開始霸凌夏隆



  --------------------------------------------------




  簡單來說分三段




  夏隆從幼稚園就被霸凌，誤闖毒窟遇到阿里，

  因為夏隆都不講話，阿里只好先把他帶回家，並跟泰瑞莎照顧夏隆

  夏隆後來又去找阿里，阿里帶他出去玩去游泳，

  夏隆就愛上海了，同時也因為媽媽對他很差，就對阿里跟泰瑞莎有很多好感。

  阿里跟夏隆說，黑人在月光下看起來就是藍色的。


  凱文是唯一一個會對夏隆好的小朋友。

  而夏隆後來知道媽媽吸毒，也知道自己是GAY，也知道阿里是毒販會賣毒給媽媽。




  阿里已經死掉了，但泰瑞莎還是跟夏隆有聯絡，兩人感情很好，

  媽媽卻毒癮越來越重並且要夏隆記得他們是母子，血緣大於一切

  而凱文已經在跟女同學打炮還跟夏隆炫耀，夏隆還是被霸凌。


  夏隆跟凱文在海邊晚上相遇，兩人情愫上升，就親親抱抱打手槍了。

  隔天凱文被壞同學的逼迫下要揍夏隆(不忍)，夏隆就被凱文揍到留一堆血

  夏隆被揍完決定硬起來，隔天用椅子爆打壞同學的頭，就進監獄了。

  凱文目送夏隆被警察抓走。




  夏隆已經變成超級天菜了，又壯又大肌肉，而且承接毒品生意有聲有色。

  媽媽勒戒成功，對夏隆很抱歉，希望夏隆不要重蹈覆轍，夏隆的心是善良的。


  夏隆意外接到凱文的電話，多年不見這通電話就讓夏隆夢遺了。

  夏隆決定去見凱文，就跑出了這首主題曲

  ------





  ------

  凱文變成廚師，看見夏隆大改變又驚又喜，

  凱文結婚又離婚，且育有一女兒，

  兩人從餐廳就開始調情一直到回家，前後約莫30分鐘的調情。

  終於夏隆不要傲驕的告白，

  最後兩人在床上，夏隆把頭倚靠在凱文肩膀上，凱文輕拍他的頭、抱抱

  畫面是月光下的年幼夏隆。


  ------------------------------------------------------





  故事主旨在夏隆小時候不喜歡他的媽媽，也不喜歡吸毒導致的結果

  同時他又是一個比較示弱的同性戀，常常被欺負，

  夏隆的家庭環境很差，更成為另一個被霸凌的理由，



  阿里跟泰瑞莎則提供了另一個家庭的可能，

  凱文則是夏隆從小開始的夢想，

  卻因為被壞同學霸凌，夏隆決定要硬起來不讓別人欺負自己。



  他的媽媽終於醒悟，很抱歉自己讓夏隆走了這條路，但媽媽認為夏隆是善良的小孩，

  但是現實不得以，夏隆只能堅強。






  你知道看兩個三十歲的大男人調情三十分鐘，

  最後就只有拍拍摸摸到底有多煩躁嗎?





  （‵□′）╯┴─┴

  （‵□′）╯︵┴─┴

  （‵□′）╯︵︵┴─┴



  來描述一下他們調情多久跟內容好了

  首先呢，

  ，一接到凱文電話就夢遺。


  一開始重逢夏隆就開始用萌萌的大眼睛一臉無辜看著凱文

  夏隆下車時還很小心的打理儀容



  天啊!




  而且從媽媽跟他道歉之後，後面就是愛情故事了也不知道能期待甚麼。





  我覺得劇情不錯，演員表現也很好，音樂、氛圍都行，

  或許類似的題材我已經看過了，所以沒有很震撼，



  而且引導期待的部分這部電影並不優秀，最後真的不知道要期待什麼。

  內心目前依然受創中。


  -------------------------------------------

  不是第一篇也不會是最後一篇

  有興趣看其他文章 搜尋作者ZAZS




  --

  不一定啊A_A

  說不定我想看到的是夏隆想要吻凱文，碰到嘴唇時凱文輕輕的推開夏隆，

  夏隆才驚覺他想要的救贖永遠都到不了，他只能繼續裝硬，這樣的殘暴結局啊。


  或是這「30分鐘」內有「任一個」，「任一個」轉折都好


  我不知道~照片上的小孩我分不出是男是女，如果他有說是兒子就兒子


  我不是說他承接阿璜的生意，他是從別人的下屬一直往上爬啊，

  雖然不確定是和平轉移還是武力爭奪了。

  另外是想要用來說他最後走上了一樣的道路。


  喜歡就好

  就

  71分 去見凱文，調情

  104分  拍拍摸摸 END

  我以為我講的很明確了ˊ_>ˋ

  除了記錄他們怎麼調情的，真的是沒有其他劇情了'
