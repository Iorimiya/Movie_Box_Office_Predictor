title: '[好雷] 月光下的藍色男孩～在你眼裡，最真實的我'
content: '豐富圖文版:




  曾經消瘦矮小的身軀

  僅有一個不像家的家

  一位不能依靠的母親


  為了逃離 不斷奔跑著

  直到長大仍到處躲避

  不知未來的路在何方


  惟一的光明就是 他


  即使早已斷了訊息

  心的悸動  敲擊著



  今年一推出就廣受好評的黑人電影，

  雖然主題完全聚焦於黑人的世界，卻沒有一般類型片的悲情或憤恨，

  以詩意的筆觸描述小男孩的成長，雖因奧斯卡最佳影片頒獎烏龍被消減關注，

  但成功擊敗之前倍受看好的樂來越愛你，月光下的藍色男孩，連名字都如此有詩意～


  首先它在海報設計就非常有巧思，

  用三色分割而成的主角臉孔，看似很融合，其實是由小到大臉孔所組成，

  也點出月光下的藍色男孩的呈現手法，從兒時、青少年、成年分成三段式影片。


  因為片長有限不可能容納一生的記錄，所以以每個階段最重要的幾天為主，

  細膩呈現這些時光中他心境的波動，兒時總是被同學欺負的小不點，

  到長大變成一身健壯肌肉的硬漢，這段過程中到底發生了什麼事？


  電影劇情結合了黑人與LGBT，

  都是可以用很爆炸的故事呈現的主題，月光下的藍色男孩卻非常節制，

  很多激烈的場景還故意濾掉環境音，只留下無聲或配樂表達那心中的吶喊。


  也許片中有碰觸到黑人的毒品問題，

  男主角與最愛也曾發生肢體接觸，不過毒品僅止於母親吸毒後的頹圮，

  對自己成長最重要的人，彷彿父親一般，他的死也只是簡單幾句話帶過，

  而且同性接觸更限縮於解褲帶的手，但你卻能慢慢感受角色間的情感流動～


  欣賞月光下的藍色男孩的時候，

  不時會不自主的跟樂來越愛你相連結，兩部片的主題都特色縮得很小，

  月光下的藍色男孩聚焦於男孩的成長(成長過程的描述也會想到去年的年少時代)，

  周圍所接觸的親人、朋友、惡人，都是塑造他成為長大模樣的推手。


  相比看得出有許多導演手法的樂來越愛你，

  本片第一個感覺是質樸、真實又細膩，讓你會不自覺得漸漸進入男孩的人生，

  最後為他的結局產生感動，自從悲情城市後好久沒這麼有力的結局，

  即使已經上了黑色字幕，在配樂下螢幕外的心依然難以平息～

  (雖然很多影評有提到本片有王家衛春光乍現的影子，

  但因為還沒看過春光乍現就不多作評論)


  即使穿上一身龐大外衣


  在你眼中

  我依然是那位脆弱敏感的男孩


  --

  歡迎光臨我的部落格

  阿一一之詩意與電影的流動



  --'
