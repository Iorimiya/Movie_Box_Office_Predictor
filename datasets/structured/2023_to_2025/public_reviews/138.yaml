url: https://www.ptt.cc/bbs/movie/M.1489158603.A.45F.html
title: '[好雷] 月光下的藍色男孩－包裹悲傷的柔軟海水'
content: "網誌圖文好讀版：\n\n\n身為本屆奧斯卡「真正」的最佳影片，本作將焦點聚焦於黑人男孩的成長歷程，並以三幕\n\n劇的形式加以呈現，而片中對於色彩的運用以及鏡頭的掌握形成相當完美的畫面構成，絕\n\
  \n對可以說是今年最為漂亮的作品之一。其中，有關留白的部分更是呈現的恰到好處，於台\n\n詞之外留給觀眾許多想像空間，相當耐人尋味。\n\n\n--------------------貼----心----防----雷----線------------------\n\
  \n\n\n\n\n\n\n\n\n本片開場出現的男子即是璜，一名身型壯碩的成年男子。某日，他發現被同學追打躲在毒\n\n窟的夏隆，決定先將其帶離該處，從此進入夏隆的生命之中。由於男孩沒有父親，又無法\n\
  \n受到母親好好照顧，於是璜開始擔負起形同父親的責任。其中，璜第一次帶著夏隆前往海\n\n邊的場景可說是相當動人的。他溫柔地扶著男孩的頭，使其體驗海水的觸感，而帶著男孩\n\
  \n揮舞雙臂拍打水面的神情，彷彿他就是貨真價實的父親一般。或許，膝下無子的他也有著\n\n照顧兒女的想望，夏隆的出現則適時填補其內心的空缺。\n\n\n儘管，璜努力扮演好代理父親的角色，但他從事的職業卻是充滿罪惡的販毒商人。雖說其\n\
  \n為人相當具有原則，但仍然無法抹滅他身為毒販的事實。不幸的是，夏隆母親所食用的毒\n\n品正是源自於璜，這讓夏隆感到相當不能諒解。畢竟，他缺乏關愛的可悲童年正是由於母\n\
  \n親長期服用毒品所致。 因此，兩人一觸即發的攤牌時刻終究到來。\n\n\n\n\n\n\n親口聽到璜的自白之後，男孩心碎地轉身離去。璜隨之而來的顫抖，是自責，是慚愧，是\n\
  \n難過，更是全然地憤怒，原來自己從事的工作竟讓男孩的生命滿是傷痕，甚至破碎不堪。\n\n自此，夏隆再也沒有看過他的身影。\n\n\n\n\n\n\n曾經對於自身性向滿是疑惑的男孩，如今來到青春期的階段。小時候於草地上扭打翻滾的\n\
  \n好友凱文成長為樓梯間隨心做愛的青少年，而夏隆隱約發現自己內心浮現的感覺。夢中，\n\n他目光的焦點並非被強力抽插的女孩，而是奮戰不懈的童年好友。或許，由於凱文是校園\n\
  \n中少數對他友善的同儕，使得夏隆將自身的情感全數寄託於其身上，但無論如何，他體內\n\n蘊藏的情慾正劇烈地翻攪，時時渴盼著宣洩的出口。現在，他明確知道心中的想望，幼時\n\
  \n於腦中打轉的無數問號皆已消散，化為肯定的結尾。\n\n\n\n\n\n然而，美好的時光總是短暫。隨著校園惡霸的臨時起意，無法抗拒起鬨的凱文只好向夏隆\n\n\
  出拳擊倒。這一拳意味者夏隆勉強維繫的青春就此破碎，看似隨處可見的校園霸凌如今卻\n\n帶著滿滿惡意，瓦解夏隆對凱文的無限信任。那是他唯一的友人與愛人，如今卻因為他人\n\
  \n的慫恿對自己拳腳相向，可說是令人心碎。此幕的刻畫可說是相當出色，更使得觀眾感到\n\n糾結不已。凱文的掙扎與服從，夏隆的悲傷與反抗，交織於畫面之中，透過拳拳到肉的聲\n\
  \n響擴散至銀幕之外，而男孩們青澀的年少時光就此畫上充滿缺憾的句點。\n\n\n\n\n\n縱觀主角的成長歷程，可以發現眾多容易被社會歧視的特質：毒癮纏身的母親，黝黑的膚\n\
  \n色，同性的傾向。這樣的他幸運得到璜的啟發，相信自己不應照著別人的期望成長，只有\n\n自己才能決定自身未來的面貌。因此，當凱文向其揮出重拳之後，他一再起身不肯就此屈\n\
  \n服，並決心向指使凱文的惡霸展開反擊 。此舉冥冥之中卻使得夏隆來到從事毒販的未來\n\n。幼時憤怒離去的他，肯定沒料到日後的自己將跟隨璜的足跡成為毒販，儘管那是依照自\n\
  \n身意志走上的道路，卻顯得諷刺不已。\n\n\n來到夏隆與凱文再度重逢的時刻，兩人早已踏上完全不同的道路。先前凱文為夏隆取的暱\n\n稱「Black」，如今成為其闖蕩江湖的名號。眼前身型壯碩、口戴銀牙的男子可說是大大\n\
  \n震撼了凱文，這並非他記憶所及的好友。印象中，夏隆應是柔軟、纖細的男孩，現在卻成\n\n為強悍無比的毒販。可是，這就是夏隆自己為自身決定的模樣，不願順從於任何人的期待\n\
  \n，即使是曾經的愛人也無法動搖他的決定。另一方面，凱文則一路順應著他人期待成長，\n\n成為廚師，結婚生子，過著平順的人生，卻非自身所期望的樣態。或許，當凱文決定向夏\n\
  \n隆彷徨的面孔飽以重拳時，便為兩人自此分歧的命運刻下極為明確的標誌。\n\n\n\n\n\n海洋於本作中有著相當重要的意象，那是讓主角最初感到優游自在的場域。置身海水之中\n\
  \n，夏隆不須受制於他人的眼光，得以隨意放鬆自己，恣意拍打著海水。於璜的陪伴下，他\n\n順利學會游泳，開始遨遊專屬自身的國度，不再擱淺於滿是鄙夷眼神的乾燥陸地。進入青\n\
  \n少年階段，夏隆首次於海邊放縱自己真實的情慾，與初戀情人享受自己的美好初夜，沉浸\n\n於潮水般湧出的慾望，不像他人前往海邊只為淹沒自身漫出的悲傷。此一伴隨好友吞雲吐\n\
  \n霧，望向月光灑落大海的幸福時刻，彷彿日常煩惱皆已拋諸腦後。當下的空間只有自己、\n\n愛人與起伏不定的海潮，沒有歧視，更沒有行屍走肉般的母親。\n\n\n\
  最後一幕，個人想要聚焦於夏隆與凱文重逢並坦白的時刻。除了兩人對於自我人生的反思\n\n，更多的是夏隆心靈中始終存有的空缺。自從那段不願回想的過去之後，再也沒有人愛撫\n\
  \n過夏隆的身體，而凱文至今仍是他唯一愛過的男人。那晚，凱文將滿是淚水的夏隆擁在懷\n\n中，如同青少年時期獻出初夜的晚上，一切彷彿未曾變過，但兩人早已踏上屬於各自的道\n\
  \n路，成為自身決定成為的樣貌，不再回頭。\n\n\n最終，畫面回到夏隆最初的童年時光。那時，他站立於起伏的浪潮之中，而月光靜靜的映\n\n照著水面。漸漸地，染上湛藍夜色的男孩回首凝視鏡頭，彷彿無聲詢問著觀眾：「你是否\n\
  \n為自己當初所期望成長的模樣？」\n\n\n\n\n\n\n\n\n--\n\n喜愛電影的粉絲，相信事物總有另一面，並努力呈現自己對電影的感覺。\n始終認為自己不夠完整，所以取名為「半個比爾」。\n\
  \n個人網站：\n臉書專頁：\n\n--\n           最後一幕真的很厲害 回到男孩置身於大海的時刻 彷彿和夜色融為一體\n           非常的美\
  \ 卻又有點淡淡的哀愁 為全片畫下意猶未盡的結尾"
