url: https://www.ptt.cc/bbs/movie/M.1487694791.A.5A0.html
title: '[好雷] 月光下的藍色男孩 - 命運的輪迴'
content: '圖文網誌版：



  今年奧斯卡最佳男配角毫無疑問是《月光下的藍色男孩》（Moonlight）的Mahershala

  Ali。


  其實他的戲份只有全片三分之一，但他的溫柔與堅毅是整部片最閃亮的那道月光。


  這是他的得獎戲。




  微微的抽動，藏的是不知該如何言說的情緒。他的自責、他的悔恨、他的不知所措，像是

  在說著「我到底有什麼資格擔任別人的人生導師呢？」


  短短幾秒鐘完全把這個角色該說的話都說了。


  這真的不好演，他不像同劇飾演主角母親的Naomie Harris有這麼多場情緒爆發戲碼，可

  以讓觀眾直接感受角色情緒。


  阿璜Juan這個角色，是體悟過人生風雨的人。開場可以看到，他開著好車，車裡播著「

  Every Nigger is a Star」，接著停下車來關心他的下線毒販販賣情況，跟一般的藥頭沒

  什麼兩樣。


  直到他和小男孩相遇以後觀眾才了解，這個角色和一般想像中的藥頭有所不同，他既內斂

  又沉穩，而且有顆溫柔和善良的心。當夏隆Chiron缺乏愛和關注時，他和女友泰瑞莎

  Teresa跳了出來，給了他一個「家」；當夏隆對於自我認同有所疑惑時，Juan給予他信念

  。


  簡而言之，Juan就是夏隆的「重要他人」（significant other）。


  不過，Juan是個道德高尚、毫無缺點的完人嗎？沒有。他和夏隆媽媽在大街上那場對手戲

  我們才了解，夏隆的痛苦來源，也是Juan間接給的。


  最後，我們看到這一場戲，也是Juan這個角色最終的身影。


  Juan的死亡，劇中毫無交代原因，他怎麼死的？其實一點也不重要，因為他的一切都烙印

  在夏隆身上了。


  在亞特蘭大重新開始的夏隆，開著名車，大聲播著音樂，在車前放著Juan習慣擺飾的皇冠

  ，戴著銀牙，開始健身，為了生活，武裝自己。


  重點是，他也開始販毒了。


  這不就是Juan的樣子嗎？


  《異星入境》（Arrival）裡，不管是否能提前感知未來，都無法改變人生的走向。而《

  月光下的藍色男孩》談的不僅是非主流性傾向的社會壓迫，更是透過Juan和夏隆兩個角色

  來暗示一件事：


  「命運的輪迴」


  你可以活的好好的，但你不再是你自己了。或許這就是他們╱我們╱你們的宿命吧。


  --

