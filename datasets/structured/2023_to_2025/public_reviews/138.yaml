title: '[好雷] 《月光下的藍色男孩》：人生中遇到的那 '
content: '圖文網誌好讀版：



  本屆奧斯卡最佳影片獎搞出大烏龍，真正該得獎的《月光下的藍色男孩》（Moonlight）

  被誤報成《樂來越愛你》（La La Land），不但台上冏爆，台下及全世界觀眾也都不知如

  何是好，但這戲劇性的轉折卻意外地讓這部偏小眾的最佳影片獲得了更多的關注。


  本片由Barry Jenkins執導，改編自Tarell Alvin McCraney未發表的半自傳性劇作《In

  Moonlight Black Boys Look Blue》。如同侯孝賢《最好的時光》將故事分為三個不同年

  代，《月光下的藍色男孩》主角夏隆（Chiron）的故事也被分成童年、少年與青年三個時

  期，分別由Alex Hibbert、Ashton Sanders及Trevante Rhodes飾演。海報上將三人的臉

  合而為一，巧妙展現了這是一個男孩成長過程中的三段故事。


  三段章節名稱「Little」、「Chiron」及「Black」分別取自主角的小名、本名及好友凱

  文替主角取的暱稱，使用名字來當做章節的名稱相當合適，因為人生不同階段的稱呼常常

  都是那段歲月自我認同的代名詞，例如提起小時候的綽號就會令人勾起當時的回憶。


  胡安（Mahershala Ali飾演）是本片第一個出現的角色，他對夏隆的人生有舉足輕重的影

  響。夏隆童年時在學校飽受霸凌，被同學嘲笑「娘娘腔」，而同住在一起的媽媽寶拉（

  Naomie Harris飾演）又是個不折不扣的毒蟲，情緒喜怒無常，胡安的出現對夏隆來說就

  像是一道曙光，教導他應該以自己為傲，「你得自己決定想成為怎樣的人，你不能讓別人

  決定」，而胡安的女友泰瑞莎（Janelle Monáe飾演）雖然一開始表現得不情願與夏隆互

  動，但其實也非常關心這個話不多的孩子，後來更將其視為己出。電影中一段胡安教夏隆

  游泳的場景便呼應著胡安的出現有如解救生活中快溺水的夏隆，教他如何倚靠自己活下去

  。然而胡安的毒販身分卻也成為這段關係中極為尷尬的一點，自從認識夏隆之後，他才意

  識到自己所販賣的毒品可以對一個家庭造成多大的傷害，在他所不知道的社會角落，是否

  又有更多像夏隆這樣的孩子？他唯一能做的便是擔任夏隆亦師亦友的父親角色替自己贖罪

  。縱然胡安只出現在第一章，卻改變了夏隆的一生，夏隆在第三章中甚至步上胡安的後塵

  ，成為一名毒販，並繼承胡安以往堅強的形象。




  夏隆與好友凱文之間的關係可以說是這部電影的主軸，童年時期凱文是夏隆唯一的朋友，

  總是默默的關心他，並曾在一次踢球遊戲中鼓勵夏隆被欺負時應該要反擊。少年時期時，

  凱文青少年式的幽默感與夏隆壓抑的個性是極大的反差，而夏隆則不自禁被凱文吸引，一

  次凱文對夏隆吹噓他的性經驗後，夏隆甚至被噩夢襲擊。一個夜晚的海邊，夏隆與凱文在

  海灘上抽大麻閒聊，在藍色的月光下，兩人忍不住接吻並發生了超友誼的關係，對夏隆來

  說，凱文的肩膀是一個安全的依靠。然而接下來的霸凌事件卻讓兩人分隔兩地，關係也日

  漸疏遠。




  成年後的夏隆毒品事業看似成功，身材壯碩、開好車、戴牙飾，但心中卻仍是寂寞，在接

  到許久未見的凱文的電話後，話筒另一端傳來熟悉的聲音令夏隆激動不已。在餐廳與凱文

  重聚時，凱文的出現卸下了夏隆剛強的外表，但並非一切都有如夏隆心中的期待－－凱文

  已有了老婆與孩子，他見到夏隆的情緒也比較像是見到老友的開心，遠不如夏隆激動。這

  段兩人之間的對手戲非常精彩，即使對話不多，但兩人間微妙的氣氛令觀眾深深感受到夏

  隆的情緒起伏。最後在凱文家時夏隆的告白釋放了前面凝聚已久的張力，片尾兩人依偎在

  一起的畫面令人回想少年時期時在海灘上的一夜，不同的是兩人都在人生歷程中受過了傷

  ，此時的擁抱更有原諒彼此及互相扶持的意義。




  夏隆的媽媽寶拉在夏隆年少時沉迷於毒品，不但沒有盡到照顧與教育他的義務，甚至向夏

  隆要泰瑞莎給他的零用錢去購買更多的毒品，直到老年到了勒戒機構才充滿了悔恨向夏隆

  道歉。寶拉是唯一三個章節都是同一個演員演出的角色，飾演該角色的演員Naomie

  Harris的表現是本片的一大亮點，誰想得到一位在龐德電影中飾演美艷Moneypenny的英國

  演員，演起操著美國黑人口音、有毒癮的媽媽居然能那麼有說服力，可以說是從影以來的

  最佳演出，Naomie Harris也靠著這個角色獲得了奧斯卡最佳女配角的提名。




  Nicholas Britell的配樂也替本片增添了獨樹一格的魅力，《Little’s Theme》以鋼琴

  為主體定調了這部電影鬱悶壓抑的氣氛，而《The Middle of the World》中的提琴聲則

  非常狂躁、令人窒息。片中有三個夢境片段（寶拉對夏隆吼叫、凱文與女伴親密、凱文吞

  雲吐霧）展現夏隆心中的陰影及慾望，更令本片多了許多迷幻色彩。


  雖然《月光下的藍色男孩》在劇情上算是個小品，涉及的社會議題卻相當廣，包含了單親

  家庭、校園霸凌、種族、性向、毒品…等，但導演並沒有用說教式的敘述去主觀評斷，而

  是著墨於身邊的角色對於夏隆的影響，訴說他這二十年來的故事。如同夏隆，每個人的成

  長過程中，都有形形色色的人帶給我們快樂、悲傷、遺憾，有些人如同過眼雲煙，但有些

  人卻對我們產生不可抹滅的影響，這也是讓每個人人生像故事般精采的地方。


  --'
