url: https://www.ptt.cc/bbs/movie/M.1489456752.A.643.html
title: '[特好雷]月光下的藍色男孩：令人屏息的典範 '
content: '《月光下的藍色男孩》實在拍得太細緻太精采

  以生僻的題材扣合著感情與現實

  開展出普遍意義的和解

  讓人晚上回到家睡不著覺，翻來覆去都是在想其中的細節。

  .

  防雷頁

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  個人最欣賞的情節是


  當夏隆接到凱文的電話

  凱文問夏隆，最近忙些什麼？

  夏隆含糊其詞說一樣在惹麻煩，並反問：「那你呢？」

  凱文說自己出獄之後在當「Cook」

  此時電影畫面拍攝凱文的手在鐵製平台上封裝東西的畫面

  然後電話另一端的夏隆則露出會心的表情

  可是當凱文繼續補充說

  他在店裡煮飯招待客人、放音樂一類的職業細節

  夏隆才知道自己會錯意了：凱文和自己終究是兩個世界的人

  (就像青少年時候凱文選擇了傷害他)

  夏隆感到失落

  可是他又怎麼會為對方循規蹈矩地過生活而感到失落呢？


  這裡舉重若輕地

  透過對白與影像鏡頭的歧義性

  刻意混淆Cook(製毒者/廚師)真正的意指

  表現同一字彙對夏隆與凱文此刻的歧義

  完美呈現夏隆心中關於善惡、今昔的矛盾


  觀眾(因為畫面的誘導)與夏隆同樣為凱文的發展感到驚訝

  完全地被代入夏隆這個角色，體受其心裡的糾結



  ===



  餐館裡，凱文對夏隆所說的「主廚特餐」

  不再是年少時代的大麻(也不是性愛)

  而是中規中矩的一道餐點了

  夏隆說自己在販毒

  凱文則說自己已婚而育有一子

  兩人的隔閡感達到最大

  彼此微弱的聯繫幾乎要崩潰(感覺他隨時會走人)


  夏隆強忍著不安追問凱文為何想到要聯繫自己

  凱文播放了思念示愛的歌曲

  兩人之間的聯結由將斷未斷漸漸才有了對話的基礎



  ===



  在凱文家尋常幾分鐘的對話

  夏隆的眼神戲張力大爆發(這裡實在太強)

  (忍不住想起貧弱的某國片)


  夏隆說凱文是唯一觸摸過自己的男人

  他武裝之心猶有最柔軟的保留

  (就像他仍有善惡、仍然會為自己誤解cook的意涵感到苦惱)

  而「月光下的黑人男孩看起來是藍色的」

  即使是人間的定見自有不同的觀點可以來欣賞；

  過去凱文是第一個接受自己的人，

  此刻凱文就偎靠在自己身邊，一切就要如實地回到純真的過去。



  ===


  淋漓盡致的衝突，淋漓盡致的和解與救贖


  本片除了充滿暗示、歧義性之外


  結局實在拍得太精采，全片就停止在救贖意義的最高峰

  完全毋須交代後續情節

  明明是線性敘事，結構竟不落俗套

  內在情蘊卻處處皆是由現實困境所生根滋長蔓生而來

  超越性與感情緊緊密合

  令人震懾驚訝，幾乎要忘了呼吸





  --'
