url: https://www.ptt.cc/bbs/movie/M.1601397017.A.F7B.html
title: '[情報] 真獅版《獅子王》續集將由《月光下的藍色男孩》導演執導'
content: '來自 Deadline 的獨家最新消息。


  迪士尼在 19 年推出的實鏡電影（姑且這麼稱為，實際還是 3D 動畫）《獅子王》將推出

  續集作品，且將由曾以《月光下的藍色男孩》獲得奧斯卡最佳影片的 Barry Jenkins 執導

  。


  《獅子王》去年上映後獲得巨大的成功，全球橫掃 16 億美金的超高票房，也是迪士尼開

  始拍攝自家經典動畫實鏡版本以來最為成功的一部。也因此讓迪士尼打算再推出續集作品

  。




  目前確定《月光下的藍色男孩》的導演 Barry Jenkins 將會執導該片，而第一集的幕後功

  臣編劇 Jeff Nathanson 則會回歸執筆新劇本，目前已經完成了初稿。該片將會繼續第一

  集 3D 擬真的動畫風格。


  續集的劇情內容目前保密當中，但據知情人士表示會繼續探索角色們的神話故事，這之中

  包括「木法沙」的起源，這部續集被比擬於《教父2》的形式。故事會繼續以非洲作為背景

  ，也依然會有重要的音樂元素。




  目前這部《獅子王2》還沒有訂下檔期，一部份是因為導演 Barry Jenkins 手上還有多部

  作品正在籌備進行當中，包括一部電影長片、兩部電視劇和一部紀錄片。


  目前配音卡司尚未有相關消息，沒有表示第一集的演員們是否會回歸繼續配音。




  --'
