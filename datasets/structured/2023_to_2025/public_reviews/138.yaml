url: https://www.ptt.cc/bbs/movie/M.1490177305.A.7D5.html
title: '[討論] 《月光下的藍色男孩》原作者專訪'
content: '前幾天去看了《月光下的藍色男孩》

  覺得故事雖平靜但處處充滿張力

  構圖、剪接和音樂的運用更是撼動人心。


  今天在衛報看到先前對對原始劇本劇作家塔賴爾・艾文・麥可尼的訪問

  十分深入而且覺得很真誠，

  因此藉著一己之力稍微翻譯一下，分享給大家，

  如果有誤讀也請不吝賜教:)


  當然也希望能鼓勵大家多多進戲院支持好電影！



  ===================================================================

  （以下內文可能提及部分劇情）


  原文來自：


  塔賴爾・艾文・麥可尼（《月光下的藍色男孩》原著戲劇劇本作者）告訴我，在他的生命中有一些時刻，讓他感覺到他似乎按下了棋局中的計時器，使得整個世界都停下來了。


  第一個時刻出現在他六或七歲，在一個週末結束後返家時。那時候他和母親住在邁阿密北部自由城的低矮公宅內，母親的男朋友「小藍」也住在一起。麥可尼的個子比同年齡的孩子矮小，在學校也因為與眾不同、安靜、不喜歡運動而被霸凌。他會被毆打，被罵「娘炮」（在他知道這個字眼的含義之前）。在父親角色缺席的心靈空缺裡，小藍是第一個真的照顧他的人，也是第一個他可以看齊的男人。小藍帶他去騎腳踏車，帶他到海邊，在他學游泳時捧著他，讓他感覺到也許最終這個世界仍有一個留給他的位置。小藍也販毒，但在1987年的自由城，這並不少見。


  然而當他在那個週末回家時，他知道有什麼改變了。他母親獨自在家，而她當時已經身陷古柯鹼毒癮的漩渦中。


  「小藍呢？」他記得那時這麼問，彷彿是昨天發生的事一般。「消失了。」她母親說。


  「消失了？」


  「小藍被槍殺了。」


  麥可尼在當時問了一些關於怎麼發生、哪裡發生，還有發生原因等問題，但他記得當他在問問題時，他腦袋裡都在想別的事。他想著：「這是你必須要記住的事。這是你沈痛的一課。生命中美好的事情不能永久，如果你離開了一個週末，如果你不好好注意，你會回來然後發現他們不在了。」當他說到這時，他輕輕地拍著我們之間的桌子，停下了那個幻想中的棋賽計時器。


  沐浴在邁阿密陽光下，我們坐在一個校園長椅中。這裡離那個童年記憶只隔幾條街、30年這麼遠。我們坐的地方位在自由城的「非洲傳統文化藝術中心」，這是一個附近著名的地標，於1975年，在一片公民前景的樂觀中興建。還是小孩時，麥可尼暑假每一天都會來到這裡，偶爾是在平時的放學以後，以避開他途經自由廣場回家的老路上可能遇上的種種騷擾或毆打。他在這裡上跳舞、視覺藝術、音樂、表演和寫作的課程。「你不能只選填一個課程，你必須上所有的課。」他輕鬆地笑說。現在他也會回來指導一些課程（在更公眾的生活中，他也剛剛成為耶魯大學寫作學程的主席

  ）。在這裡，他開始寫作自己生命中的混亂，以爲它賦予戲劇的質地。也就是在這裡，在這個過程中，他開始了走向《月光下的藍色男孩》的旅程。這部傑出的自傳式電影，在我們見面的前幾天剛剛眾望所歸地得到了包含最佳影片在內的八項奧斯卡提名。


  2003年，在修習畢業後的戲劇學程時，麥可尼在耶魯寫了一個劇本，成為日後《月光..》的前身。在那之後，他便在肉體和心靈上都將自己和自由城的距離拉遠了。他先前在非洲中心的戲劇課程所展現的天賦，讓他被收進黑人劇作家奧古斯特・威爾森（《心靈藩籬》原作者）的羽翼之下。接著他到帝博大學學習，接下來則遠赴法國，在那裡他進入了彼得・布魯克的「北方劇場」。然而，在2003年的夏天，母親因愛滋病併發症，伴隨著兩年的失智去世，這個消息將麥可尼猛然地拉回了他的舊有生活。


  他不是帶著憤怒寫下劇本，他如此說，或是純粹的悲傷或罪惡感，即使他兩者都能感受。他帶者驚慌寫作。「那個驚惶來自於，有那一整塊的我自己，是我當時的工作中完全沒有觸及的。」他說：「在耶魯時，我身邊總是圍繞著白人，他們幾乎都來自充滿支持的家庭中，而不是和毒癮者一起長大。這些事情仍在每晚讓我無法安睡，這些感覺彷彿我仍是那個八年級的孩子，在那另一個地方，那麼一大部分的我已經死去。」


  他也想起那些模範人物。人們告訴他，他很幸運能被奧古斯特・威爾森教導，能被彼得布魯克選進劇團，他知道這些都是真的。但他也知道他的典範不只來自於劇場。其中之一就是小藍，他是販毒者，但也是個好人。「這些問題不斷困惑著我：為何我沒有成為一個毒販？在那個地方成長，很多方面這都會是顯而易見的選擇。」


  他寫的劇本將那些表達了出來。他振筆疾書，寫出了60幾頁的劇本，面對母親的墮落，兒時霸凌的殘酷經歷（他曾被磚塊撃中，掉了數顆牙齒），以及他和小藍共有的美麗時刻、他和兒時唯一朋友之間僅有一次的性體驗......他為它命名：「在月光下，黑人男孩是藍色的」。這個標題捕捉了劇本裡探索的痛楚與對痛苦的逃離。


  當他完成了《在月光下...》，他不太知道該拿它怎麼辦。他感覺起來這比劇場更像是電影，但是他不知道該怎麼拍電影，所以他將劇本放在最下面的抽屜中，然後繼續做其他事。他寫了備受讚譽的三部曲劇作，成功將奈及利亞約魯巴族的神話故事移植到現代的路易斯安那州；他寫了一齣關於紐約變裝皇后表演，和另一齣關於菁英黑人學校福音合唱團的作品。後來他搬到英國，為皇家劇院和皇家莎士比亞劇團寫作品。他劇場作品的寬度與深度讓他贏得了麥克阿瑟「天才」獎。在這段時間，那部劇本都躺在那裡，但彷彿它不斷堅持想找到光似的，在近十年後的一連串巧合之中

  ，它又重見天日。


  麥可尼先前和邁阿密一個稱作「羅宋湯」的小製片組織共事過，而「羅宋湯」恰巧也和一位叫做「巴瑞．詹金斯」的導演合作，這位導演和麥可尼有異常相似的背景。在麥可尼的許可下，「羅宋湯」將這個十歲的劇作寄給詹金斯。詹金斯也在自由城長大，在國小比麥可尼大一屆，但兩人從未見過。


  詹金斯的單親母親也是藥癮者，但他的逃避方式不是藉由戲劇，而是運動。他在佛羅里達州立大學打美式足球，然後在那裡他上了電影學程。詹金斯讀了劇本，在裡面看見自己的生命，然後問麥可尼他是否能改寫並塑造成一部電影。將某些決定權交給一位完全瞭解他自己的世界樣貌的人手中，麥可尼很喜歡這個主意，這也給雙方一個藉由自傳體裁抒發自我的空間。


  在電影中，《月光下的藍色男孩》無比地貼近他們的家。這是一個殘酷的愛情故事，藉由三幕劇了形式表達，而每一幕都沉痛地催淚。即使已經在倫敦看過試映，我在前晚又在邁阿密看了一遍。在自由城幾個街區外，一間老貨倉中的電影院裡，我和觀眾驚異地看著他們的街坊被詩意地搬上螢幕。在第一幕，麥可尼某種程度上的前身——「夏隆」，由10歲的艾力克斯・海博特飾演，用眼神取代了他所有想說的話。在第二幕時，另一位演員艾希頓・桑德斯，探索著夏隆青少年時光所經歷的種種。在大部分由詹金斯編寫的第三幕之中，夏隆則將自己改變成一位幫派份子和販毒者，

  叫做小黑，跟他生命中的第一位導師「小藍」相似。在外表上，三位演員都很不同，但詹金斯對他們內心生命的專注讓你沒有片刻感到脫節。


  即使在最後一幕，小黑壯碩如牛，戴著幫派份子的金牙，污辱那些幫他販毒的街角男孩，在私下他仍蜷縮成胚胎一般，試著提起勇氣透過話筒跟母親，或者10年前的那個男孩說話。這幕明顯地相異於麥可尼的真實生命，但看著電影，他說，他感覺它似乎回答了他在那10年的劇本中提出的許多問題。


  「看著飾演小黑的崔凡特令我訝異的地方是，」他說：「當他每次張開口，他就跟我感覺如此相似。」


  麥可尼本人是個高大、能言善道、優雅的男士，且似乎非常安於自己的樣貌。但他說明，在大部分時間裡，那仍然像是他在演出的角色。「崔凡特的表演來自於一個雄性氣概，那是他覺得他必須營造出來的，就像我在真實生活中的表演就是個偽聰明人，走來走去說著假裝聰明的話。」他堅持道：「然而在內在，我總是處於恐懼之中，而且因為心中試著想出自己在哪裡？自己是誰？而感覺到非常疲倦。」


  這部電影面對了深植於美國黑人文化的不安事實——恐同。對我來說，電影聰明地將這個事實去連接到揭示各種脆弱時所造成的更大威脅。


  「這是真的，」麥可尼說：「我甚至不必要說出（夏隆）是同志。我只說他愛上了另一個男人，而他正想辦法想出這是怎麼一回事...」


  在他性格仍在形成的時光裡，麥可尼對於自己的性向就是這個感覺。「當我是男孩時，就像在電影中一般，我被叫這些綽號、被給予這些特質時，我無論對男性或女性，都還沒有性的感受。」他說道：「然後我便開始感到非常困惑，因為當我開始感受到性吸引力時，我覺得每個人都吸引著我。我覺得每個人都很誘人！現在仍然如此。」


  他笑了。「但在那時，我曾嘗試經營感情，如果我想像自己結婚或是身處在長期的關係之中，我很少這麼想，不過我會想像自己和男人在一起。但那跟性無關，在我心中，這完全是親密感的關係。」


  這樣細微的差異被吸納、頌揚於在詹金斯執導的《月光下的藍色男孩》中。即使，在對這部電影較粗魯的回應裡，可能難以看出。


  「我在個人社交媒體上放了電影的宣傳片，」麥可尼說：「我往下滑，瀏覽人們的回覆。一開始都還不錯，接著就會出現『但他們是gay！』在接下來就是：別又來了......我們身處的社會和文化整體而言無法給予我們足夠的高度。自然是多元的。雖然藍鳥是藍色的，但有些幾乎是黑色。但它們還是藍鳥。」


  電影裡和現實生活一樣，麥可尼被第一個愛上的男孩狠狠背叛，他站到霸凌者那邊。但在現實生活中，並沒有第三幕的劇情；他是否曾經試著創造一個呢？去和他重新聯絡？


  「不，我覺得這對我來說太痛苦。」他說道：「夏隆和（朋友）凱文在電影中只有過這麼一次親密接觸，對我亦同。這之後發生的事情影響了我對朋友的態度。即使到現在，每當我和一位朋友走近時，我就會想：他什麼時候會轉身，然後對我的臉吐痰呢？現在我已經感到比較好的是，我現在可以大聲把我的焦慮跟他們說。然後人們就會說：噢，你就是在害怕這個嗎？」


  即使麥可尼從未解決那段關係，他還是很感激，這部電影捕捉了他對小藍的愛的精髓。如果奧斯卡有年度最美電影畫面獎，夏隆在海上學游泳的段落無疑可以拿獎。如同飾演小藍的馬赫夏拉．阿里，當之無愧地得到了男配角題名。


  他如此契合麥可尼對小藍的記憶，以致於在腦海中兩者的形象已經開始融合在一起。「這很有趣，」他說：「馬赫夏拉某次在多倫多（一個頒獎典禮）的後台幫我調整領結，然後突然間我就開始在他的懷裡哭了起來。他一定覺得我瘋了，我那時候可能真的暫時瘋了。我彷彿又變回那個六歲的男孩：我覺得他找到了一個方式，帶出了我好久沒有看見的什麼。」


  小藍是不是第一個告訴他他是特別的人呢？


  「他是第一個表現出來的，」他說：「你可以跟我說一堆東西，但我不會相信你。但當人們行動時，我就會相信他。我記得他的擁抱。我想我一生中大概也只抱過我親生父親三次。」


  麥可尼13歲時，母親被送去勒戒所，在他上大學前，在校園中被霸凌那些最慘澹的歲月，他便不適地和父親同居。


  老爸有沒有看過電影了呢？


  「有。」


  所以之後的對話如何？


  「沒有對話。他說還不錯，大概就這樣。」


  父親題材與他們的缺席，總是飄蕩在麥可尼大部分的戲劇作品之中。2010年，他來到倫敦，為莎士比亞劇團創作了一個《哈姆雷特》製作，並在接下來半年在首都的學校裡巡迴演出。


  我問他第一次遇見莎士比亞的情景。


  「嗯，我想在小藍被殺害的時候，是莎士比亞遇見了我。」他說：「我當時不知道，但我的確感覺像哈姆雷特一般。我會四處遊走，想著：是誰做的？然後不停和他對話。但我直到19還是20歲才第一次看到莎士比亞戲劇。那是彼得布魯克的《哈姆雷特》，由亞卓安．萊斯特飾演。」


  他很感激母親的是，即使家裡的一切都分崩離析，她仍然不停鼓勵他閱讀。


  「即使在我母親最沈淪藥物的時刻，她還是對教育有某種堅持。」他說：「她會說：『認真念書，去我沒去過的地方。』這總是在我腦海中響起。」他的中間名「艾文」，是母親的親家姓；他堅持這個中間名不能被漏掉。


  他會成為劇作家，還有其他的影響，不是來自於毒販。他的祖父是教會的牧師。當馬可尼還小的時候，他們一起讀完整部聖經。再之後，他會問他「一大堆神學上的問題，尤其是當我正試著搞清楚同性戀這回事」。他的祖母是學校老師。「她今年90歲了，」他說：「但當我去拜訪的時候，她還能背出惠特曼的詩句。我記得高中時，有一次我正在練習馬克．安東尼的演講，她在另一個房間裡聽。當我忘記什麼的時候，她便全憑記憶把整個段落大吼出來......」


  基於此，藉由拍攝《月光》來記錄某個特定的歷史時刻，這個概念十分吸引人。和影集《火線重案組》一樣，它聚焦於這個經濟蕭條和古柯鹼來到了貧民區，從而毀壞了美國城市黑人社區的家庭文化與經濟成長的時代。然而在自由城，它不僅只是一個歷史事實，它更呼應著當今的現況。當巴瑞．詹金斯被問到他如何重塑當時社區的簡陋質地，他說明這並不難——因為這地方現在仍然如此。


  「在這裡我們承受著很多事情帶來的結果，」他說：「古柯鹼瘟疫衰退後，海洛英來了。次貸危機實際上也是從這裡開始的。我們才剛要從那裡走出來，然後現在又有這個新的政治情況......」


  他喜愛這部片的原因之一，是因為自由城因而被放到地圖上。「你知道，人們會說：『我去過邁阿密啊，這才不是邁阿密。』有人千真萬確跟我說過『但邁阿密沒有很多黑人啊』。」他笑說：「佛羅里達州是美國黑人人口數量第三大的州，當然你光看奧蘭多的照片是看不出來的。」


  我們見面的這天，英國首相梅伊剛來到華盛頓，也是川普行政命令風暴過後七天。麥可尼對執政作為感到震驚卻又不怎麼訝異。當人們之前告訴他這不可能發生時，他會叫他們去讀讀他社交媒體上的留言。


  「壓迫這個系統性的問題已經存在很久了。他針對有色人種和女性而來。在邁阿密一切還ok，但你如果往北或往西開個十哩路，那裡的人會讓我們知道我們不受歡迎。十條路外還有1970年代留下來的圍牆殘餘，它從來沒被完全清除過。


  「你知道，有些人說《月光》這麼棒，它會改變很多事。我覺得它或許能幫助一些人找到某種答案。但是當中描繪的態度和問題不是什麼歷史故事，它在現在，在這裡仍然繼續發生。」


  在這個概念上，看來這部預算僅五百萬美元的電影，與絕妙而且讓人能稍避開現實的《樂來越愛你》會在奧斯卡上首當其衝，也顯得合情合理。正反陣營丟出許多有趣的問題，問道那部電影代表了真正的美式愛情，哪部又販賣著「另類真相（alternative
  facts）」？在我離開前，我疑惑著麥可尼是否會由於他如此坦白自己故事的方式，而對這部電影受到的盛讚感到不安。


  「不，它必須要被說出來。」他說。


  在另一方面，這也是好事。他現在感覺，他能夠直接寫一些這方面的題材，憑藉著一些他以前從沒辦法找到的方式。「我之前不知道，但是當我真的看了《月光下的藍色男孩》，我感覺到好像大壩潰堤一般，現在在此之後，我有十足的精力。」


  他從前從未在作品中寫邁阿密，沒辦法直接描繪他的世界。現在，他說他有兩到三個他想要完成的計畫，且都是奠基於我們坐著的三四條街以內。


  「一個群體只會在述說自己的故事中變得更堅強。」他說。基於此，對於自由城來說，他相信《月光》只是開始而已。



  --'
