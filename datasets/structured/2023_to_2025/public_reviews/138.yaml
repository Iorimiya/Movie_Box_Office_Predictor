url: https://www.ptt.cc/bbs/movie/M.1488689938.A.3CD.html
title: '[算好雷] 月光下的藍色男孩：找回自己的碎片'
content: '文章來源：



  本來沒有特別想看這部片的，即使在得了最佳影片後也是一樣。但這篇

  文章反而讓我提起了興趣。


  從《Moonlight》開始，非裔美國人的故事換了一種講法



  正是因為去年在看完【盧克凱吉】的以下感想，與這篇文章有些不謀而

  合：「在美國非白人社群為主的戲劇裡，題材似乎都不出這幾種組合，

  雖然也是反應現實，但某種層面上算不算一種言靈？越是強調也越跳脫

  不出那個生命暗示。就如同反派一號的悲慘童年，被教育成「身為黑人

  家庭中的男孩子，就應該堅強地繼承家業，不做它想。」於是他放棄了

  他的專長與所愛，強迫自己成為長輩要他成為的樣子，最終證明了是條

  枉費生命的不歸路。」


  雖然這是一齣看起來像是「黑人」、「同志」電影，但卻既不「黑人」

  也不「同志」，沒有刻板公式化題材中，黑人訴說自己被打壓的宣洩，

  也沒有為了凸顯同志戀情的刻意壓抑與悲情。整部片就淡淡的，然後最

  後一句台詞說出來後，讓人有被箭刺穿胸口的感覺。




  《Little/小個，破繭而出的純淨》


  這時候的小個因為身材矮小，以及「氣質」，成為校園中被霸凌的對象

  。在毒窩躲藏時，意外認識了藥頭阿璜。劇情慢慢揭露小個的性格封閉

  的原因，終究還是家庭失能，母親只顧著吸毒，對孩子的成長可說是不

  聞不問。阿璜或許是在小個身上看到了自己的影子，個頭小、又固執倔

  強，阿璜與女友泰瑞莎也就自然而然的成了小個在外面的爸媽。


  有幾幕戲對照下來十分有意思。小個的媽在街上買了毒品就當街吸了起

  來，阿璜本著規矩要阻止她，最後兩人卻變成為了小個而爭吵。小個的

  媽氣勢凌人，即便她是毒蟲，她都還是嗆著阿璜說：「難道你寧願我去

  跟別人買貨嗎？」而在小個議題上，親生母親自然更是有恃無恐，甚至

  還威脅起阿璜：「你要是擔心我沒法照顧他，那就由你來顧啊，誰叫你

  要賣我毒品，都是你的錯！」阿璜當下語塞，無法為自己的立場做任何

  的辯駁。


  直到某次，小個又再度帶著心事來到阿璜家時，小個不帶批判地問了他

  ：「我媽是不是在吸毒？」「你是不是在販毒？」讓阿璜無地自容。回

  到當晚，小個的媽跟阿璜吵完架後回到家，對著小個怒吼。這時我們無

  法聽見她吼了什麼。電影後段揭曉，她對夏隆吼說：「不要看我！」


  不管是小個的媽或是阿璜，面對彼此的質問時都是理直氣壯，或是對於

  看熱鬧的路人也是滿腹牢騷。但是他們卻都承受不起小個的一個眼神，

  或是一個問題。小個無意批評他們，而是在他們面對小個這樣一個如同

  黑夜中的月亮一樣皎潔的存在時，他們克制不住心中對自我的批判。於

  是小個的媽用怒罵推開了自己的孩子，而阿璜則是持續照顧著小個，做

  為最基本的補償或是贖罪。


  而不管是被母親飆罵，還是在阿璜家，小個最後都離開了現場，小小的

  他瞬間明白了些什麼，接著他長大了。




  《Chiron/夏隆，驚鴻一瞥的瑰麗羽翼》


  即使到了高中，被霸凌的現象還是未見改善，時而肢體時而言語羞辱。

  縱使被罵是「死玻璃」，也鮮少在夏隆平靜的心上激起一點漣漪。唯有

  當母親或是泰瑞莎被羞辱時，他才感受到一點需要反擊的情緒，但又在

  考量過後放棄，默默地離開。唯有長年的好友凱文，會在校園中找他聊

  天，也唯有凱文可以讓夏隆感到開心。


  在夏隆又無法回家的晚上，他來到了小時後阿璜教他游泳的海灘邊。卻

  也這麼湊巧的，凱文出現在他身邊陪伴著他。夏隆難得說出一點內心的

  情緒，而平時看似沒什麼水準的凱文竟然意外可以解讀夏隆的心思。於

  是，他們兩人在月光的照耀下接吻，凱文幫夏隆打了手槍。兩人回家的

  路上就跟平常沒什麼兩樣，不一樣的是，夏隆臉上多了微笑。


  就在夏隆從窒息的校園與家庭生活中，找到了一絲微風，很快的卻又被

  霸凌者奪走。他們自然不知道夏隆與凱文前一晚的小祕密，他們單純因

  為凱文好使喚，而他又是夏隆的朋友。他們威脅凱文往夏隆臉上揍拳，

  夏隆雖然心痛但沒有被擊倒，反倒是凱文不忍心，當夏隆被其他人毆倒

  在地，保全上前才一哄而散。


  夏隆不願對霸凌者提告，或許是他早已下定決心，要親自教訓這幫奪去

  他難得美好記憶的人。畢竟在這樣的校園霸凌中，尋求法律的保護只會

  讓自己更顯脆弱。那是不成文的青少年生存法則，所以當年的小凱文才

  會不斷鼓勵他要「反抗、硬起來」。於是，夏隆操起椅子往對方身上猛

  打。最後，夏隆被帶上警車，在凱文的目送下消失了。




  《Black/黑仔，被預期成為的人》


  夏隆長成了一個強壯的男人，他的形象是阿璜的翻版，他的江湖名號來

  自凱文對他的暱稱。他也不在是那個文弱的少年，他走上阿璜的路，成

  了一名藥頭。雖然在外呼風喚雨、逞凶鬥狠，但是只要是接到母親留言

  的夜裡，他都還是做著被母親怒吼的噩夢而驚醒；又或是多年之後，聽

  到凱文來電的聲音，隔天睡醒則發現自己夢遺了。


  阿璜曾經對小個說：「到了某個時候，你要決定自己要變成什麼樣的人

  。別讓別人幫你決定。」或許這是阿璜對當年老太太稱他「小藍」的反

  擊。然而，阿璜又真的知道自己是誰嗎？他是否落入了黑人文化的迷思

  之中？但至少我們可以推斷出阿璜的結局。他死了，而且可能就是因為

  他的職業選擇而死的。


  要成為藥頭，黑仔唯一認識的印象就只有阿璜。雖說也是「事業有成」

  ，母親與凱文的來電則困擾著他。母親打過無數次電話要他來看看她，

  卻在凱文邀請他來吃飯時，才真正成行。或許有些殘忍，但與母親的和

  解，或許更像是順便為之。雖然母親在戒毒所表達悔意，雖然母親的心

  情已不再像是兒時那般充滿威嚇，或是青少年時期的誘騙，但那一次又

  一次的「我要你知道我真的很愛你。」似乎還是殘存著讓人記憶猶新的

  情感勒索。


  最後來到凱文工作的餐廳，黑仔故作的姿態近乎鬆懈，彷彿又回到當年

  在海灘上的羞怯。這一整段餐廳戲鋪陳許久，不管是黑仔或是凱文，還

  是觀眾都在盼望著有人可以先打破沉默，談談當年的那件事。當凱文說

  出他與一名女子結婚並有了小孩時，黑仔與觀眾的心都沉了。原來凱文

  還是凱文，還是當年那個人家說應該怎麼做，就怎麼做的人嗎？


  雙方揭露心意的試探十分曲折，而且從未直說。凱文點了一首歌訴說他

  的想法。當黑仔反過來將凱文送回家後，依舊閒話家常了一番，然後夏

  隆說：


  「你是唯一一個碰過我的男人。我之後再也沒有碰過其他人。」


  凱文微笑了，夏隆再次將頭靠在凱文的肩上。於是小個在解除對家庭的

  盼望後變成了夏隆，夏隆失去了同儕的支持後變成了黑仔。最後黑仔在

  與母親和解、與凱文重逢定且確認彼此的心意後，他又是夏隆也是小個

  了。至少在這一刻，他不再隱藏自己的需求，至少在這一刻，他不這樣

  批判自己。




  故事讓主角夏隆在三個時期有不同的名字。「小個」是他人的指摘；「

  夏隆」便是首次認識並且接納了的自己；「黑仔」則是順應刻板形象的

  偽裝。黑仔縱使將完成夏隆的拼圖碎片遺忘在老家了，而他又回到了被

  繭束縛的靜止狀態。而或許，他也打算就這樣下去，雖然他的成就與過

  去判若兩人，卻加深了他的靈魂上的枷鎖。


  雖然旁人總是咒罵夏隆是死玻璃，或者阿璜也曾試著對小個解釋不用這

  麼早煩惱同性戀的問題。但在夏隆與凱文之間，卻從未出現過任何相關

  的辨識或是確認性的辭彙。


  縱使現在我們有白人、黑人、亞洲人、拉丁人、男、女或是LGBTQ等字

  詞，來定義各種不同的族群認知。但這究竟算是必要性的區別，還是某

  種程度上我們也在各式各樣的定義上迷失了？如果一個男孩可以有三種

  不同的稱謂代表不同時期的自己，那麼我們又將如何歸納一個人或是一

  個族群的特質？那麼我們究竟是要將自己塞進定義的框架裡？還是或許

  乾脆放棄定義？


  同時也有一個感觸是，有時後看著自己過去寫的文字會突然覺得陌生。

  也就不禁讓人想了，在這段時間裡，我獲得又失去了什麼，才變成現在

  的樣貌？人每一分每一秒都在改變，多數改變是不可逆，有些則可能有

  幸，或是不幸，可以找回，又或是反覆糾纏。然後每一個片段組合成現

  在的我，又或者更動了組成往明天的我邁進。這樣的我們怎麼可能可以

  劃分與歸類。


  本片各方面都很小品，雖然留下許多空白，但以劇情的鋪陳倒都可以讓

  觀眾自行補足。平心而論確實是蠻平淡的電影，或許沒有衝突的劇情或

  是緊繃的情緒，但那最後一句台詞對我仍舊餘韻繞梁。我們無法得知黑

  仔之後是否會就此「金盆洗手」，又或是兩人是否此後過著幸福快樂的

  生活，在那個當下或許這些都不重要，這個當下我們擁有彼此，我也終

  於是我。



  --'
