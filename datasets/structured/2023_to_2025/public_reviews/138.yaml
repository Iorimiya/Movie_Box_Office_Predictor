title: '[ 好雷] 月光下的藍色男孩－微風'
content: "完全不煽情，也不具娛樂性的作品，卻以最戲劇性的方式在奧斯卡金像獎頒獎典禮奪走最大獎大紅了一把。\n\n  十多年前2個白人令人心碎的斷背山，始終攻不下的山頭，被兩個同樣找不到自己定位的黑人男孩抱走了。\n\
  \n  在我看來，這部片，真的很藝術，不波瀾壯闊，也不是討喜的題材：集結黑人、毒品、同儕霸凌、破碎家庭、LGBT……其實就像最後Kevin說的it's just\
  \ real life shxt\n\n  戲如人生，導演只是平靜真實的呈現出邁阿密三不管地帶那種連黑人自己都欺負黑人的混亂社會。\n\n  整體表現傑出，走出以往典型壓抑、哀傷\n\
  的黑人/同志電影，反而是以溫暖的色調，多樣性的音樂元素呈現出這一群人情感流動與成長的故事。配樂真的很好聽，讓人進入電影的時空，也在最後傳達了情意。\n\n  以三階段表現出主角Chiron的變化。\n\
  \  「永遠不能讓別人決定你要成為怎樣的人。」\n教游泳的片段彷彿父子間的交流，海浪溫柔的起伏如同父親的愛靜靜守護。\n\n  「有時，一陣微風掃過，一切都停止了，彷彿大家都停下來感受那陣微風。」\n\
  很喜歡第二段海邊的談心跟親密關係的呈現，也許不論是給與者或接受者都分不清是誰主動，也許只是buddy間下意識的互相撫慰，但已經是另一人的一輩子。\n\n  「有首歌讓我想到你了。」\n\
  有時人長大了，很多事情都變了，但人還是不願意改變，也許是開著一台復古車，也許是學某人的生活方式活下去，也或許在長大的路途中沒有自己的方向，就按照看似最安全的模式過下去，驀然回首已經在海中央，進退失據。\n\
  \n半夜響起的電話，兩頭都不禁露出的一點笑意，光是這樣就能讓離鄉背井多年的Chiron奔回故鄉，多年的思念得到了出口，那流瀉的音樂在微醺的血液中舞動著，卻在發現對方與自己的生活已是雲泥之別時愣是平靜下來，載著老友回家，下次見面也許不知是何日了，兩人看著彼此，終於還是說出：你是唯一。最後兩人倚靠著彼此的擁抱究竟代表什麼不得而知，但是已令人感到些許溫暖的喜悅。\n\
  \n--"
