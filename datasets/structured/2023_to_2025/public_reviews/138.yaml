url: https://www.ptt.cc/bbs/movie/M.1602424548.A.EFD.html
title: '[極好雷] 月光下的藍色男孩'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~









  我有看過刻你

  然後現在重看(第二次)月光下的藍色男孩


  靠杯 兩片的深度根本不在同一層次上面


  Juan幫助little很多忙 大家都知道

  但是Juan應該潛在也是個不能出櫃的gay


  當然這點沒講到


  從little小到大

  帶到能夠理解自我認同的時期


  這是很讓觀眾能理解的階段

  所以分了三個階段

  little - chiron - black







  一個是探索自我

  一個是了解自己

  一個則是其他人對於自己的看法


  我不知道同性戀電影要怎麼樣演才能好看

  但是月光下男孩就是好看的一種形式


  你不用多說

  很多事情就是心知肚明

  很多事情就是心照不宣

  很多事情就是放在心裡就好了


  所以你不用表演得很露骨

  你不用把那些事情都攤開在檯面上來逼人家攤牌









  不然你以為kev跟人家一起生小孩是幹嘛


  我覺得光是這點

  還有後來他打電話給little


  就知道他們兩個對彼此的愛有多深刻

  這不是什麼需要幾刷才能了解的事情


  正常異男都知道這在衝三小


  我買了三罐金牌500ml

  加上一點零食

  想說這樣可以讓我度過第三段black的片段


  幹 不行啊








  總之這是部好片

  談戀愛也好

  了解自己也好


  也談到了原生家庭對於自己的影響

  這都比....還深刻了多了


  非常推薦大家看這部戲


  我suntory金麥還沒喝完

  不過我知道我在說什麼











  --





  --


  不要跟我吵這個 我現在狀況沒辦法跟你討論 QQ'
