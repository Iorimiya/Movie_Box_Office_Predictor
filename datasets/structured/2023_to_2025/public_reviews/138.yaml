url: https://www.ptt.cc/bbs/movie/M.1487337053.A.C69.html
title: '[好雷] 月光下的藍色男孩 Moonlight'
content: '１．劇本走的是平穩的路子，使用字幕卡明確分為幼年、少年、成年三段故事（據導演說

  法是受《最好的時光》影響），而亮點在於議題性，我喜歡它所展示的LGBT在黑人社群中

  的處境（當然，難堪處境絕對不僅在黑人社群中而已），其他還有毒品、霸凌、親子關係

  、自我認同......等等，層層建構出電影的豐厚度。



  ２．算是一個簡潔的故事，因此容許導演在影像中鎔鑄自我風格。對我來說，這部片的鏡

  頭語言有不足的部分（例如第一段太多shaky cams），但充滿詩意、很有個性。



  ３．Mahershala Ali as Juan展現了不同於Hidden Figures裡的帥氣。戲份非常少，但對

  於故事發展有著重要的推動作用；尤其第一段最後跟Chiron一起在餐桌上的這場戲，對白

  和表演都非常精采。



  ４．我喜歡Trevante Rhodes as Chiron在第三段的表現。人前他已不復當年，是硬起來

  的毒販，然而當他與Kevin重遇，他的眼神、談吐和姿態卻與中學時的那個瘦弱的少年

  Chiron無異。這樣的內在性格與此時剛強的外在形象，產生很大的對比，效果非常驚人。



  ５．配樂很不錯，但主觀認為份量上可以再豐沛一點點。



  ６．目前追了四部獎季熱片，整體而言，我的第一名還是海邊的曼徹斯特，接著是樂來樂

  愛你跟關鍵少數打平，再來才是這部月光下的藍色男孩。當然，這完全只是個人意見。



  P.S. 2/17-19在部分戲院有本片的口碑場，請把握，不然就只能等到3/3囉。



  --'
