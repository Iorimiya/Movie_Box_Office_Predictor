title: '[新聞] 《月光下的藍色男孩》徹底打臉川普！'
content: '網址：


  《月光下的藍色男孩》奪最佳影片 打臉川普成年度電影


  文 |高睿希 圖｜傳影互動提供、東方IC


  第89屆奧斯卡頒獎典禮在一片錯愕注視下，最佳影片頒給了由巴里傑金斯編導的電影《月

  光下的藍色男孩》。然而這樣的結果並不意外，《月》片所探討的議題很廣，不只是同志

  、黑人、橫跨三代的心境轉變，導演更在其中傳達愛與寬恕的信念，從劇情到概念都恰好

  打臉美國總統川普。


  川普入主白宮後發表不少爭議言論，除了公開歧視穆斯林、同性戀、毒癮者，也直言要在

  美墨邊境築高牆，且要墨西哥政府付錢，皆引起軒然大波。當時已有不少好萊塢影星被惹

  毛，於是金獎影后梅莉史翠普便在金球獎頒獎典禮上開第一槍。她嗆川普煽動暴力、霸凌

  弱勢族群，事後川普不甘示弱還擊，取笑梅姨為「過譽」的演員。眼見川普與好萊塢眾星

  之戰已達水火不容的階段，外界也認為戰火將延燒到奧斯卡頒獎典禮上。


  果不其然，主持人吉米金莫一開場便向眾人開玩笑說：「感謝川普讓我們團結起來，今年

  典禮上不會再發生種族歧視的問題。」由於去年奧斯卡演員入圍名單均為白人，導致當時

  網路上出現各種「奧斯卡太白」輿論。只是眼看今年狂人川普屢屢暴走，今年眾人箭靶倒

  變得相當一致，典禮上出現各種嗆聲川普的橋段，像是吉米金莫在典禮期間忍不住發推特

  ，tag川普並寫上：「你睡了嗎？」試圖釣他出來發文，挑釁之姿惹得明星們哈哈大笑。


  另外，吉米金莫故意說資深影后梅莉史翠普很平庸，以此回應川普曾批評梅莉史翠普是個

  「過譽」演員，梅莉史翠普聞言起立鞠躬，嘲諷意味濃厚，而他也笑言：「（感謝川普）

  現在有225個國家及數以百萬的人恨我們。」


  不止整場典禮都在走一種嗆川普的節奏，就連象徵年度電影的「最佳影片」獎項也頒給《

  月光下的藍色男孩》，這無疑也是奧斯卡評審委員對川普的另類挑戰，理由是《月》集結

  了各種川普討厭的元素(吸毒、種族、同志)，但當中卻又傳達出包容、認同自我的信念，

  劇情動容之餘，對照當今政治現況更有其教育、省思的意義，可說是2017年代表美國社會

  的電影也不為過。


  我是菜鳥電影記者希希，來我的部落格吧：




  --'
