title: '[微好雷] 月光下的藍色男孩 (Moonlight)'
content: '板友們晚安，你今天好嗎?

  在大家都在看環太平洋2時，我又來寫非院線片了XD

  今天要分享的是"月光下的藍色男孩Moonlight"

  歡迎大家來看看，留言或點個讚~

  無音樂彩色網誌版>



  純文字版>>

  月光下的藍色男孩 (Moonlight)


  簡短總結：

  人物的情感表現真摯且細膩，

  也許對主角的境遇很難感同身受，

  不過他的故事要是拆開成幾個部份，

  就會像曾發生在你我的週遭一樣貼切，

  我很佩服主角能撐住不倒下去，

  最後誠實的面對自己。


  電影簡介：

  住在美國邁阿密黑人區的小男孩Chiron，

  他不僅身處在一個周遭極度不友善的環境

  ，還缺乏親情的陪伴與物質上的享受，

  本片是他的成長故事。



  ＊＊- 無劇透心得‧安心看 -＊＊＊


  近幾年對於拿到奧斯卡金像獎的影片

  我都會抱著好奇的態度去找來看，

  而這部月光下的藍色男孩在2017年

  第89屆的奧斯卡最佳影片獎項擊敗了

  外界普遍看好的越來越愛你(La La Land)

  我很愛這種小蝦米擊敗大鯨魚的橋段，

  當然不能錯過要看一下囉!


  從電影開始到結束，我的心情沒有太多起伏

  也許是無法體會主角的處境與情感，

  而劇情上也十分的平鋪直述，人物在

  各方面的表現也都很是內斂，無論是

  肢體接觸或內心揪結的展現都很"收"

  (是有多想看激情戲碼啦XD

  個人覺得內斂的戲不好演也不好拍，

  因為必須用其它方式去感染觀眾的情緒，

  視覺和聽覺上都得更下功夫，當然本片

  所用的音樂與背景歌曲是蠻到位的，

  有讓我覺得好聽而且和畫面有合拍，

  但或許就是太內斂了一點所以我沒有

  很入戲與被打動到，不過整體來說本片

  的劇情、拍攝手法、演員表現我覺得都

  不錯，雖然並不是我的菜，

  但電影各方面都還蠻不錯的；


  「你總有一天得自己決定要成為什麼樣的人，

  ，而不是讓別人為你決定」

  Moonlight,2016

  Juan對Chiron說的話



  ＊＊- 以下劇透心得‧未看請避 -＊＊＊




  觀影的過程中發現導演對於畫面的處理

  十分用心，片中時常出現藍色的元素，

  如藍色的衣服、背包、海洋、校舍..等等，

  如果說藍色Blue代表情緒，那或許在訴說

  著主角Chiron的內心既憂鬱又纖細，

  憂鬱的是這令他難受的環境和人事物，

  他渴望被人理解、他想要有人為他解答

  疑惑和聽他講話，而不是一味的霸凌他，

  卻連唯一的親人都對他情緒勒索，

  這該有多難過又無助呢?


  Chiron的母親Paula對他說:

  「你是我的全部，而我是你的唯一」


  這句話我不置可否，但從一位有毒癮又沒

  好好照顧小孩的母親口中說出，那這不是

  情緒勒索的話什麼才是呢?!


  愛不是只為自己想，也該為所愛的人想想


  而亦父亦友的Juan與好友Kevin則扮演了

  Chiron的導師跟心靈寄託的所在，他們

  給了Chiron愛與傾聽，不僅不會和其它人

  一樣歧視他的性向及家庭環境，更教導他

  正確的觀念並聆聽他心裡的聲音，

  也許少了這兩人中其中一位，Chiron可能

  會撐不下去，或是活得更辛苦吧...


  片中Chiron被欺負的橋段令我不捨與不解，

  明明是自己的同學又是相同的膚色，為何要

  這樣的霸凌和歧視呢?有優越感?單純爽?

  另外在他小時候與青年時期，電影中

  我感受不太到他哪裡表現的像同志了，

  就因為走路的姿勢和散發出來的氣質?

  (還是我悟性不夠)


  電影後半段Chiron回到故鄉，與母親見面

  時的橋段讓我感覺到即便再憤怒與無奈，

  彼此間的拉扯終究很難抹煞掉親情，

  後來兩個人都流下了眼淚，也許在這一刻

  Chiron對母親的心結才稍稍鬆開了點吧~


  而最後面與Kevin的互動和調情(誤)

  Chiron卸下了外表的武裝及內在的心防，

  用真正的自己去面對那個唯一碰過他的愛人、

  那個能讓他展現自己的Kevin~

  Chiron倚靠在Kevin肩上做為故事的結尾，

  看到這裡我覺得心情舒緩了一些，畢竟前面

  太多部份讓人覺得沉重，而這樣的開放式

  結局仍舊很內斂，除了留下想像空間，

  也告訴觀眾在這一刻Chiron活得是他自己了:)


  ---

  你為自己活過嗎?現在活得像自己嗎?

  (我沒有答案，你呢)



  §本篇所使用的圖片部份取自於網路，

  版權屬電影公司與其原作者所有，

  如有侵權或任何問題，煩請留言給我。


  歡迎轉載和引用本篇文章，但麻煩告知；

  如果覺得寫的不錯可以點個讚或留言分享，

  謝謝\^-^/



  -- 後記 --


  1.主要人物演員(童年>青年>成人)


  ◎Chiron夏隆

  (Alex Hibbert >Ashton Durrand Sanders>

  >Trevante Rhodes，飾男主角)


  ●Kevin凱文

  (Jaden Piner >Jharrel Jerome >

  >Andre Holland，飾Chiron的好友)


  ◎Juan

  (Mahershala Ali飾毒販)


  ●Paula

  (Naomie Melanie Harris飾Chiron母親)


  ◎Teresa

  (Janelle Monae飾Juan的女友)


  個人認為在電影中演員這塊真的很重要，

  所以我會在每篇心得把主要演員寫出來

  讓大家知道。


  2.很想寫出沒有劇透並且能吸引讀文章

  的人去看電影的心得來，但實在很難XD

  希望自己能越寫越上手，歡迎留言給建議喔!


  3.片中有幾個關鍵字是值得被關注的:

  黑人 / 霸凌 / 毒品 / 同性戀

  其中我想講一下霸凌這件事情；


  過去念國中時，導師是剛來的女老師

  沒記錯的話她是初出社會的新老師，

  而且身材很小隻，所以班上那些8+9和

  幾個皮皮的小混混根本沒把她放在眼裡，

  除了在班上欺負同學外也會跟老師頂嘴，

  還曾看過他們曾把立可白倒在別人的

  飲料裡面，還有把風紀股長的椅子藏起來

  和叫人在廁所堵她－　－"

  我也沒能幸免於難，雖然被欺負的不多但

  去學校也是有些膽戰心驚的...


  時至今日霸凌無所不在，不單是在學校裡，

  社會上、網路上、國際社會上，拳頭大的

  人講話都比較大聲、有錢人地位就高，

  乃至膚色仍舊有歧視問題存在著；

  我真心覺得人並沒有優劣之分，

  無論財富多寡或地位高低都不該去欺負

  那些較為弱勢的人，因為霸凌並不會顯得

  自己高人一等，講的機車一點如果對那些

  弱於自己的人伸出援手或視對方與自身

  平起平坐，那不是更突顯自己是個

  宅心仁厚又有愛心的大好人嗎?

  (有點假掰又博虛名的感覺XD)


  我覺得該歧視、該被攻擊的是那些做壞事

  的惡人，還有自以為高級而欺侮弱者的

  族群才對，因為他們讓社會變得不好；


  另外是同性戀的部份，那是場支持與

  反對方吵不完的戰爭，我個人的想法是

  只要不影響到外人，無論是異性或同性戀

  都該被允許與尊重，全世界有75億人口，

  沒有誰和誰是完全一樣的人，

  那當然也包括所謂的愛情不是嗎?

  每個人都被教導成是男生或是女生，

  但卻不允許認定自己的性別和性向，

  這就有點奇怪了，不礙著別人就好了呀~


  只要不礙著別人，沒有誰就該愛誰的道理。


  --

  電影心得>> 樂來越愛你


  電影心得>> 我和我的冠軍女兒


  電影心得>>重點是，我愛你



  --'
