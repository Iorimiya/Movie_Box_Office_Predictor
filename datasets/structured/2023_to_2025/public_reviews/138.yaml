url: https://www.ptt.cc/bbs/movie/M.1489304829.A.32F.html
title: '[好雷] 月光下的藍色男孩-平實且真摯的生命故事'
content: "(幕迷影評圖文並茂版：\n\n如果說童年是為了認識外在的世界，那青春期就是認識內在的自我。\n\n內外經驗的交互作用，形塑了我們日後與這個世界互動的模式。\n\
  \n成長的本質是改變、改變的感受是不安，\n\n生命的殘酷就在於我們無法拒絕這些改變與不安。\n\nMoonlight訴說的就是一個人的成長過程中，認識世界與自我的歷程。\n\
  \n雖然是全黑人卡司、且部分劇情與同性戀相關，\n\n但本片無意著力於種族與性向的議題探討，\n\n而是使其自然而然成為腳色的一部分，讓觀眾更能貼近片中人物的心境。\n\
  \n平實的調性也讓觀眾更能體會這些事情可能就發生在周遭、甚至是自己身上，\n\n以直白的方式透過第四面牆告訴大家：歡迎光臨真實世界。\n\n-\n\n本文將著重在劇情的剖析與情感描寫，幾乎是鉅細靡遺的劇透。\n\
  \n因此尚未看過電影的人建議先不要看文章，以免產生自己想法的機會被剝奪。\n\n另外，預計下篇還會再談Moonlight，分析一些影像與聲音的意象運用。\n\n\
  -\n\ni. Little\n\n\"At some point, you gotta decide for yourself who you wanna be.\n\
  \n Can't let nobody make that decision for you.\"\n\n「在某個時刻，你必須決定自己要成為怎樣的人。不要讓別人替你做決定。」\n\
  \n對於童年的Chiron，這段話出自他視如己父的Juan之口，同時也為本片主旨破題。\n\n母親吸毒、缺乏父愛的Chiron，瘦小又寡言，被暱稱為Little。\n\
  \nJuan和其女友Teresa，給了他從前沒有的家庭溫暖，更教他待人處世的態度。\n\nJuan帶他去海邊，海邊成了他最愛的地方。對此時的Chiron而言，Juan就是他的避風港。\n\
  \n而Chiron時常被同儕欺負，唯一和他當朋友的只有Kevin。\n\n「要讓他們知道你很強，才不會被欺負。」\n\n誰料Kevin日後竟成Chiron生命中難以承受之重。\n\
  \n另外，Chiron一開始並不知道Juan其實是毒販，\n\n甚至他母親所吸食的毒品源頭也來自於Juan。\n\n但即便Chiron得知此事後難掩失望，Juan早已成為他生命中支撐他前進的力量。\n\
  \n-\n\n飾演童年Chiron的Alex Hibbert表現不俗，\n\n台詞極少，但透過表情與肢體就能傳達腳色情緒。\n\n低頭與下三白視線是兩個招牌動作，演技自然而不矯揉，令人讚賞。\n\
  \n而飾演Juan的Mahershala Ali雖然只出現在第一段，\n\n但其演繹使腳色形象鮮明，最佳男配實至名歸。\n\n-\n\nii. Chrion\n\
  \n青少年時期，首重「自我認同」的建立。而此時的Chiron仍受同儕霸凌所苦。\n\n但是Juan已離世，雖然還有Teresa關照他，他依舊封閉起自己的內心。\n\
  \n一句「我很好」是將痛苦深深埋藏。為了在變本加厲的惡意之下生存，他只能偽裝堅強。\n\n另外，他發現自己漸漸愛上從小和他一起長大的好朋友Kevin，\n\n\
  同儕中唯一真心對待他的人。\n\n但Kevin的言行就像一般的異性戀男生，這份愛可能終究是沒有結果的。\n\n在午夜夢迴裡撞見他和心儀的女生在打炮，\n\n或許只有經歷過類似的情感掙扎才能體會箇中酸楚。\n\
  \n我自己就曾愛上好友，也曾看著他和女友親密互動，那是一種難以言喻的痛。\n\n在某個夜裡，Chiron來到最喜歡的海邊散心，Kevin也碰巧出現。\n\n一看到Kevin出現，Chiron那微微上揚的嘴角已說明一切。\n\
  \n滿月之下，他倆互訴心事；或許是氣氛引發的情慾流動，他們有了第一次的親密接觸。\n\n我非常喜歡這段的處理，青澀的情感呈現的很唯美，卻又不過度遮掩。\n\n\
  -\n\n誰料接下來命運給了Chiron狠狠一記「重擊」：\n\nKevin在同儕的慫恿與威脅下，揍了Chrion。\n\nKevin的行為或許可惡；但對比於Chiron渴望做自己，Kevin始終活在別人的期待之下。\n\
  \n哪怕他真的對Chiron也有超越友誼的情感，\n\n卻違背這世界所告訴他「正常男生」該有的樣子。\n\n而Chiron即便被自己愛的人傷害，仍沒有提告，\n\
  \n或許是在悲痛之餘還能為他設想，實在令人揪心。\n\n他最終選擇以暴制暴，向真正的兇手報仇，但也因此被警方逮捕；\n\n可能在他心中也有意遠離這充滿惡意的環境、離開那個讓他愛到深處卻也痛到深處的人。\n\
  \nAshton Sanders把Chiron的壓抑詮釋得很棒，不禁讓觀眾與他同喜同悲。\n\n-\n\niii. Black\n\n「Black」是Kevin以前為Chiron取的綽號。\n\
  \n在當年的事件後，他就搬到外地，用這稱號在道上走跳。戴起銀牙、練得渾身肌肉，\n\n他果真如Kevin所說，讓別人知道他很強，沒人會再欺負他了。\n\n當他戴起頭巾、販賣毒品時，活脫脫就是Juan再世；\n\
  \n他的車上還放著跟Juan車上一樣的小皇冠。\n\n既然顯露本性會弄得遍體鱗傷，那就只好武裝自己，向這個世界展現他們所期待的樣子。\n\n然而這個世界似乎不打算放過他；\n\
  \n兩通電話，將那些不堪回首的過去，硬生生從記憶深處給挖了出來。\n\n母親打來，希望Chiron能去探望她。更令他意外的是，久未謀面的Kevin竟也打來問候。\n\
  \n夜裡Chiron再次夢到Kevin，還起生理反應，間接說明了他心裡依舊藏著對Kevin的感情。\n\n-\n\nChiron去療養院探望母親。\n\n她在那裡當志工，認為自己在贖罪，並為過去的錯誤向Chiron懺悔。\n\
  \n她始終是愛他的，只是年少時誤入歧途，更不懂得怎麼當個稱職的母親。\n\n兩人相擁而泣；Chiron放下了對母親的怨懟，也象徵著敞開心房，與過去和解。\n\n\
  此段一定要大讚Naomie Harris的演技，把失職母親多年來的悔恨展現地淋漓盡致。\n\nTrevante Rhodes的成年Chiron也不惶多讓，那滴眼淚畫龍點睛，把情緒堆疊到最高點。\n\
  \n-\n\n或許是因為解開與母親的心結，Chiron決定到Kevin擔任廚師的餐廳找他。\n\n他一路開車回到家鄉，如同小時候一路從家裡走到Juan的家，\n\
  \n跟著感覺，去喜歡的地方、見喜歡的人。\n\n要進餐廳前還打理自己一番，這小地方讓人會心一笑，\n\n我們要跟喜歡的人見面不也會如此嗎？\n\n而Kevin打那通電話是因為聽到客人點的歌，想起了Chiron。歌詞中有這麼一段：\n\
  \n  Hello stranger 哈囉 陌生的人啊\n\n  It seems so good to see you back again 見到你回來 感覺真好\n\
  \n  How long has it been? 多久沒見了呢？\n\n  It seems like a mighty long time 好像已經過了很久很久\n\
  \n當Kevin在餐廳播放這首歌時，無疑是最真摯且動人的告白。\n\n雖然他已有家室，但與妻子也只是為了小孩而維持關係。\n\n或許他對Chiron也有著不一般的感情吧？\n\
  \n片中並沒有給出明確答案，而這樣的留白也是本片最美最令人欣賞的地方。\n\n-\n\n到達Kevin的住處時，Chiron發現這裡離海邊很近，還可以聽到潮水聲。\n\
  \n那片海，承載著他小時候與Juan的回憶，也是他與Kevin有過親密接觸之地。\n\n回到家之後，Kevin終究說出了內心困惑，因為Chiron和他記憶中的樣子實在大不相同。\n\
  \nK: Who is you, Chiron?\n\nC: I'm me, man. Ain't trying to be nothing else.\n\n\
  其實Chiron一直都是Chiron，他外表的強，只是武裝自己的保護色，也隱藏了所有傷痛。\n\n在療養院時，母親說「你的心沒那麼黑暗」；Kevin說「你和我期待的不太一樣」。\n\
  \n兩個他愛的人都認為這不是他，而這兩人都曾深深傷害過他。\n\n但別人的看法終究只是他們的看法；又有誰能瞭解，他承受過什麼才成為現在的模樣？\n\n這一切從來就不是他想要的，是這個世界的惡意將他逼入這個境地。\n\
  \n而此時面對Kevin，他無意再偽裝；\n\n安然卸下所有防衛，作回最初或許脆弱、但也最真的自己。\n\n\"You're the only man who\
  \ ever touched me. The only one.\"\n\n字面意思是，Kevin是唯一碰觸過Chiron的(男)人，所指的無非是海邊的事；\n\
  \n但touch也可作「觸動、感動」解，而Kevin也的確是多年來真正打動Chiron的唯一那人。\n\n作為本片最後一句對白，除了揭示Chiron的心意，也讓人再次回想最初的命題：\n\
  \n\"At some point, you gotta decide for yourself who you wanna be.\"\n\nChiron放下過去，成為了他最想成為的人；而我們呢？\n\
  \n要繼續活在別人的期待之下，還是要追尋最真實的自我、成為自己心中最想成為的人？\n\n最後Chiron靠在Kevin肩上，予人無限想像，同時也美得令人屏息。\n\
  \n-\n\n某些期待後續激情戲碼的人，想必大失所望，但這也是本片最有力度的地方。\n\n導演Barry Jenkins選擇將許多地方留白，\n\n他大可用功能性的台詞與橋段取而代之。但他沒這麼做。\n\
  \n而這樣的安排也造就一部大師級的經典，\n\n純粹用影像與聲音去敘事，將思考的權利交還給觀眾。\n\nMoonlight可以說是由劇組與觀眾協力完成的作品，或許每個人的體悟都不盡相同，\n\
  \n但這也就是真實人生的寫照，\n\n每個人在世界上都是獨一的存有，我們每天都在寫下自己的故事。\n\n而獲得奧斯卡最佳影片只是錦上添花，\n\nMoonlight在誕生的那一刻，就已注定成為影史經典。\n\
  \n-\n\n歡迎追蹤我的FB粉專：老大的影劇世界\n\n\n\n--"
