url: https://www.ptt.cc/bbs/movie/M.1488098461.A.CE5.html
title: '[好無雷] 月光下的藍色男孩：世代的輓歌'
content: '前幾天終於看了大受好評的Moonlight，我個人也非常喜歡這部電影！三段故事構築了一

  個（黑人）世代的人生 劇情起伏不大 甚至可以說是有點流水帳的表現方式 但越看卻覺

  得越有意思！ 剛開始不大懂第一段（主角孩提時代）的敘述 覺得有些冗長，但演到主角

  青少年，甚至成年，才瞭解Ali所扮演啟蒙者的角色對這個故事的重要性；也難怪Ali在

  獎季頻頻橫掃男配角獎 。 這部電影其實是象徵一個黑人時代的共同悲歌，在導演拋出一

  個又一個關於性向、家庭、種族等等的議題時 卻又不直接給你解答 ，你必須跟著主角去

  「思考」。這也是為何本片在各個安排很多角色在走路的橋段（有點像索爾之子的攝影方

  法，從後腦勺拍攝主角）場景跟場景間的行走，其實也給了角色時間思考自己的人生。本

  片既沒有交響樂般的震撼配樂，也沒有過多臺詞的潤飾 ，所看到的就是黑人們真實的生

  活樣貌，卻也更為動人。把一個黑人世代的輓歌演的可歌可泣，卻又收斂不奔放，實屬佳

  作。


  如果說La La Land是一場逐夢的旅途 ，那麼Moonlight就是關於生存的思辨，有著更神層

  的意義 。夢想是黑人孩子們的眼光所永遠無法觸及之處，在霓虹絢爛的晚霞中，他們只

  看得到藍色的月亮，思考著自己在月光下的顏色，以及自己在如潮水般湧溺的世代交融下

  ，所擁有的最終價值。


  很希望明天的奧斯卡，在典禮結束前最後站上頒獎臺的，是月光下的藍色男孩的劇組。


  --'
