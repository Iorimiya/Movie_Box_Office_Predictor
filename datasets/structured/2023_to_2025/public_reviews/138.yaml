title: '[好雷] 月光下的藍色男孩(moonlight)'
content: '圖文好讀版：




  然後這是防雷頁 ( ￣ c￣)y▂ξ










  《月光下的藍色男孩》這一部作品，我看完時當下的感想是相當平淡的。但是這個平淡的

  故事好像一直無法讓我忘記，生活中的好幾個時刻都讓我想起了男主角的眼神，他那看來

  應該是脆弱的雙眼一直在我的腦海裡揮之不去。


  這一個金獎故事敘述的是一個黑人同性戀男孩的成長故事，片中以他在成長階段中的名字

  Little、Chiron與Black作為電影中的三個片段。


  Little是一個家中的愛有所缺乏，面對同學也遭受霸凌的小男孩。但是兒時的他遇到了人

  生中最溫暖的貴人Juan，給予他了堅定的力量與成長的養份，也與Kevin培養出了似乎不

  只友誼的情誼。


  Chiron則是敘述了他的青少年期，失去了Juan的他依然在校園遭受霸凌，母親依然忽略著

  他而Kevin卻也一直是他能量的來源。這樣慘澹的青少年期在一場校園意外中結束，Chiron

  住進了牢裡，在這之後一直沒有會到這個他成長的城鎮。


  第三個片段Black，則是講述長大成人的Chiron回到了當年成長的城鎮，遇見老友Kevin的

  故事。


  很多人都是使用了愛情來解讀這一個故事，把眼光聚焦在Chiron與Kevin之間的曖昧情愫

  ，但我的解讀卻是這是一部關於「成長」的電影。這個成長我想要訴說的不是如何堅強或

  是如何成為想要成為的人，而是人在成長過後所住在內心深處的那最是脆弱抑或是內心依

  然真誠的那一塊，依然會是當年也許不起眼，也許是會被欺負的那一個男孩。


  Little在成長成為Black過後，他練就一身強壯的肌肉，成為一個毒梟社區裡的硬漢。雖

  然這不是一個社會上所推崇的，道德上完美的「好人」，但是他依循著他的父親角色的腳

  步去成長，成為了他心中所可以達到的形象的人，而他在面對所有人時也如同Juan一般的

  良善。


  但這種可以被解讀為「事業有成」的男子，在回到了成長的所在地，遇見他的母親，又或

  是曖昧對象Kevin面前時，他的眼神卻又回到了當年的那個Little。他在這個社會裡所成

  功成為又或是成功扮演的角色一瞬之間瓦解。他所有的武裝，所有戴上的面具，也許是為

  了在獄中生存而練就的社交技巧也都在這一瞬間完全失去。他又成為了那個內心缺乏著些

  什麼的Little。


  在Chiron進入了快餐店遇見Kevin後，那段不在故鄉的時間發生了什麼事已經完全不重要

  ，現在的Chiron是什麼身分或者是一個怎樣的人也不在是該被在乎的事情。現在的Black

  已然回到了當年那個Little，他與Kevin之間那些曖昧的話語與情感也或許不全然只是愛

  情，而是Chiron對當年那個願意拉他一把的Kevin的依戀。只有當年願意對他伸出援手，

  在慘澹的童年與青春期看見一絲希望的Kevin面前，Chiron可以卸下所有一切的武裝。兩

  人之間看見的彼此不是兩人現在生活裡的虛華、金錢或是身份，而是兩人彼此脆弱的靈魂

  。


  當年的那個Chiron問Juan，他的性向到底是怎麼回事。Juan回答，到時候就會自然知道了

  。我不知道兩人在這樣的情愛下Chiron是否能夠真的確定自己是個怎樣的人了，但是我想

  他應該能夠確定，不管是Chiron或是Black，他們的靈魂都永遠會那一個不知道如何面對

  這個世界，卻又情感豐沛的那一個Little。而他那雙訴說了這一切故事的雙眼，就算是

  Chiron又換了名子也會一直持續訴說著他的靈魂。



  --

  法拉搜的電影筆記




  --'
