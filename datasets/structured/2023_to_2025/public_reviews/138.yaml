url: https://www.ptt.cc/bbs/movie/M.1489426710.A.D28.html
title: '[普雷]  了無新意的 月光下的藍色男孩'
content: '的確，月光下的藍色男孩拍攝手法非常的奧斯卡，完全符合奧斯卡評審的口味。


  這部片沒有過多的濫情，平淡的劇情帶點雋永，演員內斂的演技，一切都很奧斯卡。


  真的就是一部為了奧斯卡而拍的電影。


  不過，我個人覺得劇情沒有什新意，它其實就是「男朋友、女朋友」的翻版。


  除了黑人的同儕文化背景與台灣早期保守的文化背景很相似之外，就角色而言，


  你只要把夏隆換成張孝全，把凱文換成鳳小岳，這一切都通了。


  差別在於，男朋友女朋友的導演沒有把張孝全與鳳小岳湊成一對，


  兩人沒有互吻、沒有愛撫。為了卡司，把桂倫美的角色放大。


  轉換成月光下的藍色男孩，桂的角色不過是被凱文在學校上的女學生。


  甚至劇情發展到最後，凱文跟鳳小岳都成家了。張孝全跟夏隆木納的感覺也極相似。


  蠻可惜的，台灣導演懂得奧斯卡的操作，也許得獎的是「男朋友、女朋友」


  因為劇情太類似，我大致只能給普雷，LALALAND應該比較優。





  --'
