url: https://www.ptt.cc/bbs/movie/M.1488943645.A.D94.html
title: '[好雷] 月光下的藍色男孩，審視人生'
content: '圖文版請點入，謝謝你喔



  Moonlight電影結束了我沉靜了很久，心揪在一起的感覺遲遲沒有散去，用憂鬱而糾纏的

  心境贏得了最佳影片，心好像被掏空了一樣不是心碎的那一種，這故事真的難以忘懷，電

  影用三個名子分別道出了自我認同，與隨波逐流的社會現實；戲劇化的劇情不過於狗血也

  不過於平淡，我們看到是跌跌撞撞的人生，真實動人的故事。片中鏡頭抓住演員的細微表

  情，也讓我們跟著演員心情一起開心，難過，走路都可以感染你我，一場游泳的鏡頭讓觀

  眾跟小個一樣在水裡載浮載沉。


  沒有海邊的曼徹斯特那樣的心碎無助，沒有樂來樂愛你那樣的精采絕倫，卻充滿了對人生

  的審視。







  【以下有雷請先去觀看電影嘿】









  胡安與Chiron

  當小個說:「我是基佬嗎。」胡安告訴他你還不知道，當到Chiron被趕出家門往Teresa家

  裡住，Teresa與胡安像是Chiron的再生父母，第一眼或許是熟悉而之後的是補償心態，胡

  安從小深深的值在了Chiron的心理，當Chiron成為了黑仔，帶著胡安的頭巾從事著胡安的

  販毒工作，因緣際會下成為了另一個胡安，一直到最後Chiron似乎還在找尋自己，販毒是

  志向嗎?一定不是，或許對他們兩來說只是工作賺錢而已。


  電影讓我思考了一下，是沒人吸毒就不會有毒販，還是沒人販毒而毒蟲們就會不吸毒呢?

  這問題還在腦子裡呢?




  Chiron與媽媽:

  媽媽的第一句話是:「他通常都可以照顧自己的。」讓我驚訝了一陣子，這媽太不負責任

  了，跟Chiron要錢買毒，要求Chiron出門過夜，這對母子的心像畫面裡的房門一樣關了起

  來；電影最後媽媽卻回過頭來關心Chiron，想了解他的兒子，有時候親情就是這樣吧。


  血緣好像真的不只是血緣而已，想割開那牽連卻怎麼都沒辦法，怎麼樣都有那麼一點心酸

  憐憫，媽與Chiron的那一場懺悔對白心痛又人鼻酸滿滿。




  Chiron與凱文:

  對霸凌的Chiron來說凱文的關心就像曙光一樣吧，從小到大的關注發展出的日久生情，我

  想他們是相愛的，Chiron知道自己愛誰喜歡誰，而看見凱文順應著時代成為了廚師成為了

  爸爸也說明中學時敲著Chiron卻要Chiron不要再站起來的緣由了；黑仔說著自己在販毒時

  ，凱文說了不應該這樣，這不是你，但其實凱文並不了解Chiron的。


  自己都不了解自己了，別人怎麼可能了解你。




  Chiron的偽裝:

  小個的心理防衛不敞開心房，黑仔身材超強壯帶金牙，是武裝自我，但心裡卻是由一而終

  不變Chiron，從小個的眼神，在海邊Chiron靠在凱文肩上的小動作，到最後的那一幕靠肩

  Chiron是沒有變的，心裡還是那個小男孩。


  是不是人生就是不能正面視人?


  故事裡的每一段關係都很精彩，每一個角色都很成功，每一段故事都很真摯。


  --'
