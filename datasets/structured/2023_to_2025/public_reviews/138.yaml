title: '[新聞]《月光下的藍色男孩》甩憂鬱 化身性感鮮肉'
content: '2017奧斯卡最佳影片《月光下的藍色男孩》(Moonlight)，以真摯樸實的生命故事打動所

  有奧斯卡評委，隨著獎季落幕，演員們聲勢也跟著電影得獎水漲船高。在《月光下的藍色

  男孩》分別詮釋主角席隆幼年、青年、成年的三位男星艾力克斯希伯特(Alex R.

  Hibbert)、阿什頓山德斯(Ashton Sanders)、崔範坦羅德(Trevante Rhodes)和榮獲本屆

  奧斯卡最佳男配角殊榮的馬赫夏拉阿里(Mahershala Ali)，其「藍色男孩」魅力也被品牌

  Calvin Klein相中，搖身一變成為性感內褲男模，各自呈現不同的男孩魅力！


  對於選擇《月光》四位要角出任新一季代言人，品牌創意總監Raf Simons表示透過這幾位

  非凡的演員來展現當今男性多元的魅力，正是品牌所要傳達的精神。



  跳脫外表的限制，方能看出真性情


  《月光下的藍色男孩》裡頭至關重要的男孩 - 席隆，需要三個不同年紀的演員來詮釋，

  在起始的選角過程中，導演的選角是希望找來三個長的相似的人選，然而始終找不到對的

  人，他退一步地想，注重他們的「眼神」，才能看見真正的樣貌，最後才在茫茫人海中找

  到這三位新秀來飾演席隆。更令人驚訝的是，導演刻意不讓他們彼此碰面排練，希望他們

  自然地去體會席隆的內心，直到電影首映時才真正聚首，但三位如出一轍的氣質和神情，

  令所有觀眾大感佩服。






  好可惜沒有凱文成年版~~






  --'
