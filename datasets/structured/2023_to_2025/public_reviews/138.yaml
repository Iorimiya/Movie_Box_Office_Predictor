url: https://www.ptt.cc/bbs/movie/M.1489163368.A.BFE.html
title: '[微好雷]《月光下的藍色男孩》由你自己說了算'
content: '圖文網誌版：


  「做你自己，這世界崇拜原創性。」（Be yourself. The world worships the

  original.）偉大的瑞典女演員-英格麗·褒曼（Ingrid Bergman）曾這麼說道。漫漫人生

  路，如一張白紙來到人世間，何謂「自己」的大哉問，即刻如影隨形；年幼無知、綺紈之

  歲再到白髮蒼顏，看似紛至沓來，有時卻是倏然斷裂，只因歲月悠悠，一旦恍神，再回神

  發現純然的自己已消逝，此刻印證長大，回頭時卻已不見成長的足跡；然而，試著闔眼，

  屏氣凝神，既熟悉又陌生的成長畫面，彷彿也能像清晨露珠般，滴落在尋常的柏油路面，

  陽光灑落，珠光閃爍燦爛，默默提醒著那些曾走過的路，和原本屬於自己最真實的模樣；

  隨波逐流，太害怕異樣的眼光，也就忘卻「美」是蛻變自歧異，所幸成長詩篇陪伴，像耳

  語般輕柔傾訴，詩詞真摯動人的，如《月光下的藍色男孩》（Moonlight）：「你終究要

  決定自己想當什麼樣的人，別讓任何人替你做決定。」（At some point, you gotta

  decide for yourself who you''re going to be. Can''t let nobody make that

  decision for you.），由你自己說了算。


  風颯颯吹來，一名黑人小孩站在海裡，月光照映，身上皮膚看起來像是藍色，暱稱小藍不

  為過，他回眸一發不語，目光無邪，這是《月光下的藍色男孩》最後一顆鏡頭，也是黑人

  小孩一生時光倒流的開始。《月》片成長橫跨20年，從孩童、青年、成人三階段，奏出非

  裔男孩追尋自我的歷程三樂章，這名非裔男孩名叫夏隆（Chiron），居住在邁阿密，個子

  矮小、平時沈默寡言，在學校常是被霸凌的對象，痛苦中掙扎求生，終憑意志生存下來，

  但真正殘酷的，並非外頭世界，而是自己的愛戀感受。不同年紀，不同心境，伴隨不同遭

  遇，我（夏隆）的三個面向，一如《月》片以三章節名稱「i」、「ii」、「iii」譜寫，

  既為「我」之指稱，亦點明「Little」（小個）、「Chiron」（夏隆）、「Black」（黑

  仔）三大發自內心的生命經驗，成長的陣痛與體悟，莫過於此。


  誠如《月》片精巧設計的電影海報，幼年的小個、青春期的夏隆，及至成年的黑仔，臉孔

  各據三分之一拼湊完整；童年，受欺負誤闖毒窟，因緣際會邂逅毒販阿璜，宛如找到未曾

  擁有的父愛和家的想像，卻也因母親耽溺毒品，小小世界瀕臨瓦解；青春，賀爾蒙驅使性

  探索，情竇初開，肉體心靈相契合，卻遭痛毆打回現實，原來這世界是如此荒唐；成年，

  曾安撫寂寞、也曾拳頭相向的好友，突如其來再聚首，扭捏回憶：「你是唯一碰過我的男

  人。」（You''re the only man who ever touched me.），刻骨銘心的愛情，永遠能卸下

  武裝的自己。直到此刻，夏隆跌跌撞撞走了過來，幾經同儕壓力、性向認同、母子羈絆、

  純真友愛和逞凶鬥狠，才知似曾相識，那些受挫的、渴望的、世俗的，無非都曾駐留在你

  我記憶裡，深刻熟悉，或許《月》片平淡無奇，但曖昧留白，迷亂的成長史，方能不時回

  甘。


  歷經今年奧斯卡頒獎烏龍，《月光下的藍色男孩》如願拿下最佳改編劇本、最佳影片等大

  獎，雖為底層私密描繪，卻能廣泛產生漣漪；背後受盡冷嘲熱諷、想愛卻無法說出的藩籬

  、萬惡染缸形塑性格等，接著捫心自問：「我是誰？為什麼會跟別人格格不入？」這是夏

  隆，也像極了你（我），相去無幾之餘，一段黑人男孩的成長過程，最彌足珍貴的，並非

  非裔族群常見的苦情，也非渲染黑白族裔對立，更非淪為刻劃同志境地，而是純粹人際的

  情慾流動，溫柔帶點剛毅，樸實卻具後勁，無非成就《月》片唯美詩意，以及艾力克斯·

  希伯特（Alex R. Hibbert）、阿什頓·山德斯（Ashton Sanders）、崔範坦·羅德（

  Trevante Rhodes）仨人與夏隆畫上等號的濃烈氣韻。不追逐情感宣洩，意念淺嘗即止，

  幾幕360度環景拍攝，欲求靜謐故事生氣蓬勃，自然如虎添翼，抑鬱憂傷的偏藍色調、悲

  憫氣息的室內弦樂，雙雙讓心跳不小心落拍，無異於吹皺一池春水，《月》片螢幕外的成

  長日常，仍是踉蹌。


  --'
