title: '[新聞] 影帝丹佐華盛頓讚《月光下的藍色男孩》：'
content: '新聞網址：


  【情報】影帝丹佐華盛頓讚《月光下的藍色男孩》：永遠別放棄！


  丹佐華盛頓以自導自演、改編自同名舞台劇的電影《藩籬》，獲影帝美國有色人種協進會

  （National Association for the Advancement of Colored People, NAACP）頒發最佳

  男主角獎項，而在領獎時他也發表了一段動人激昂的演說，內容是關於黑人演員的輝煌歷

  史，並表達對下一代新進演員的鼓勵：「繼續努力！」


  首先，華盛頓傳達了對原劇作家威爾森（August Wilson）的感激之意：「能夠將他的智

  慧結晶搬上大銀幕，我感到格外榮耀、責任、喜悅。」接著他也感謝共同在好萊塢闖盪的

  黑人演員們，包括同片的薇拉戴維絲（Viola Davis）、《關鍵少數》（Hidden Figures

  ）的奧塔薇亞史班森（Octavia Spencer）及塔拉吉P.韓森（Taraji P. Henson）等人，

  並表達對後輩黑人電影工作者、歌手、編劇、製片們的期待，也特別提到《月光下的藍色

  男孩》（Moonlight）年輕導演巴里傑金斯（Barry Jenkins）的優異表現。


  他說：「這位年輕人在獲得拍攝《月光下的藍色男孩》的機會前，做了10部、15部、20部

  的短片，所以永遠不要放棄！」


  Denzel Washington Taiwan



  --'
