title: '[LIVE] 月光下的藍色男孩moonlight HBO 2100首播'
content: "2017奧斯卡最佳影片\n\n沒看過 好看否?\n=============\n 月光下的藍色男孩 MOONLIGHT\n22:00 ～ 23:50\n\
  節目長度：      1小時50分\n\n節目介紹\n勇奪2017年第89屆奧斯卡最佳影片、最佳男配角以及最佳改編劇本3項大獎。\n[不來的彼特]監製，[貝瑞傑金斯]執導，[馬赫夏拉阿里]、[賈奈兒夢內]、\n\
  [娜歐蜜哈瑞絲]、[艾力克斯希伯特]、[阿什頓山德斯]、[崔範坦羅德]主演。\n居住在邁阿密的男孩席隆，因個子矮小、平時沈默寡言，在學校時常成為被霸凌的對象，\n\
  痛苦中掙扎求生的他，憑著意志生存下來，但他漸漸發現真正殘酷的不是外面的世界，而\n是他已偷偷愛上自己的好朋友。\n\n《月光下的藍色男孩》由[布萊德彼特]監製，描述一個小男孩的成長故事，橫跨20年的成\n\
  長歲月，融合友情、愛情、親情等情感元素，肺腑動人，導演[貝瑞傑金斯]更大膽啟用三\n名演員來飾演主角三個階段的故事，全片以10歲的主角夏隆作為開場，在學校慘遭霸凌的\n\
  夏隆，某天在街上被毒販尤安拯救，沒有父親、母親又沈溺於毒品的他，漸漸把尤安當成\n了自己的父親，而尤安也視夏隆如己出，一路陪伴夏隆成長。\n\n第二樂章則描述青少年時期的夏隆，個性溫柔的他在學校仍時常被霸凌，而從小跟他一起\n\
  長大的同學兼好友凱文總在重要時刻保護著夏隆，夏隆漸漸發現自己愛上了凱文。\n第三樂章裡，夏隆已長大成人約30歲出頭，他已離開從小成長的邁阿密，去了別州工作，\n\
  除了告別童年的慘痛過去，也希望自己有個截然不同的人生。三個階段相互輝映真摯\n感人。\n\n--"
