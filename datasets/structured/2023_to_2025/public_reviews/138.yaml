url: https://www.ptt.cc/bbs/movie/M.1489295974.A.D87.html
title: '[好雷] 月光下的藍色男孩-因為你我才可以做自己'
content: '標題塞不下了，囧，還原原本的標題：


  月光下的藍色男孩《因為你，我才可以作我自己》



  網誌圖文好讀版：



  （以下有雷有雷，防雷慎入）


  -----------------------------------------------------------------------------



  一部步調十分緩慢、情感張力不算強烈的小品電影，為什麼可以獲得奧斯卡最佳影片、金

  球獎最佳劇情片.....橫掃各大影展許多劇情片獎項呢？

  每個人觀影想法固然見仁見智，但就個人觀看過後的感想，這部電影內容含括了許多層面

  的議題，不單單只是LGBT同志議題，更包含長期以來美國境內非裔美國人的生活環境品質

  與社會歧視、毒品氾濫問題、青少年霸凌問題、每個人成長路上自我的認同與摸索、甚至

  於探討原生家庭的功能強度帶給孩子的影響......

  在不到兩個小時的電影裡面，不刻意渲染、誇大的故事情節或場面，可以含括這麼多層次

  的議題，且每個議題只用了很簡短的時間卻能讓你留下深刻的印象，導演用了一種像似與

  你話家常的口吻拍出了一個黑人小男孩的成長過程，觀眾就只是看著、看著、然後跟著生

  氣、跟著悲傷、跟著欣慰.......。這部電影著實不容易，得獎實至名歸。



  電影很清楚明白的用分隔告訴你，一個人生三個階段，都有不同的代號與模樣。

  【Little，小個】、【Chiron，夏隆】、【Black，黑仔】

  是不是覺得有點熟悉？

  我們的人生不也是如此嗎？在求學的每個階段，也許國小一個綽號、國中一個、高中一個

  、大學一個、有加入社團的又一個、到了出社會又可能因為同事之間而有了另一個不同的

  稱謂與身份.......我們的成長過程也經歷這樣的分段，甚至當我們長大成人後，自己會

  從別人稱呼我們的名稱來分辨這是哪個時期認識的朋友，而每一個時期的自己，好像一樣

  、又好像不太一樣，這中間的轉折、經過什麼事情與自己的喜怒哀樂，始終只有自己全部

  都記得，又或者連自己都記不得了？我有沒有變？我還是那個我嗎？



  【Little，小個】


  電影從阿璜開著豪華老爺車開始，觀眾很快速的得知阿璜的職業是販毒（上線），再來帶

  至被一大群黑人小孩追趕的小個，這個小男孩看起來與其他黑人小男孩並沒有什麼不一樣

  ，但為什麼只有他被欺負？他自己不知道，觀眾也一頭霧水。為什麼被霸凌的原因到了「

  夏隆」時得到了解答：因為他有一個吸毒的媽媽、且傳說媽媽為了買毒品做了很多不堪入

  耳的事情。

  這個小男孩有著難以窺探的內心，他不多話、甚至不說話，一般邏輯小孩被拯救時都會想

  趕快被送回家，送回自己最熟悉安全的地方，但小個卻不想回家，跟著阿璜回到了阿璜家

  ，看著他吃東西的模樣，阿璜調侃他個頭小小卻很會吃，不難想像他應該很少能好好飽餐

  一頓......「不想回家、又常餓著肚子」，那他原本的家庭究竟發生了什麼事情？


  隨著阿璜送他回家，更詭異的是母親的反應，一般媽媽在看到陌生人送小孩回家時，第一

  時間驚慌是正常的，但確認孩子安全後，通常會感激好心人護送孩子回家，但媽媽卻是恐

  慌又厭惡的眼神趕緊關上門，大聲斥責小個，並告誡他離那個人遠一點......媽媽詭異的

  反應很快的得到解答，原來她深知道阿璜就是販售毒品給自己的人。對媽媽來說，阿璜就

  是罪惡的源頭，對毒癮者來說、毒販就是害他們墜入深淵的邪惡之人，這點在母親當街吸

  食毒品與阿璜對嗆時也可以看得出來，阿璜對於自己身份的尷尬和困窘。


  對小個來說也是，那是一種非常矛盾的心情；阿璜教會他游泳、視他為己出；小個也當阿

  璜與泰瑞莎是投射的父母親，但這個父親卻是害自己母親吸毒、讓自己從小得不到家庭該

  有的溫暖與飽足的禍首，這當中的矛盾，令人不勝唏噓。

  當問起名字時，小個沒自信的回答大家都叫他小個，但泰瑞莎卻溫暖地說著：「我可以叫

  你夏隆嗎？我要叫你夏隆。」提醒著他不要被別人貼上標籤，他值得被稱呼他的名字。


  而幼時的小個，就像每個孩子一般，期盼著母親的愛與關懷，他只能默默看著母親吸毒、

  不做家務、帶男人回家關上房門、放他一個人在客廳，他是如此期盼著母親的愛卻得不到

  關懷，只有充滿怒氣的眼神，母親關上房門前對他的大吼被消音，那一幕卻在小小心靈上

  留下了童年的陰影，直到長大後都還因這幕而做惡夢。


  被霸凌的小個只有一個朋友：Kevin凱文。

  凱文會在遊戲過後偷偷告訴小個：「其實你並沒有那麼弱，對吧？」「你該硬起來的！」

  只有他會鼓勵著沒朋友的小個、聆聽他的聲音，陪他走一小段路。小時候是、長大後也是

  。他是小個的唯一一個朋友，也是夏隆的唯一。



  【Chiron，夏隆】


  擺脫了帶有歧視的綽號，青少年的夏隆漸漸在泰瑞莎與母親之間，找到自己依靠的平衡，

  霸凌並沒有因為長大而消失，同儕間因為鄙棄而訕笑他母親的作為、動不動罵陰柔氣質的

  夏隆「玻璃」、「死gay」、惡意的捉弄.......但這些夏隆都默默忍受下來。

  凱文依舊陪伴在他的身邊，一次偶然的分享自己的性經驗，導致夏隆夢見凱文的場景，他

  期待的是什麼？對於這個一直以來默默關心自己、陪伴自己的好朋友，夏隆產生了無法控

  制的情愫.......。

  對自己情感的茫然，他走到海邊，海對於他來說，是充滿療癒的地方，那是他第一次感受

  到父愛（阿璜教導他游泳與放鬆）的地方，海的線條、浪的聲音，他靜靜坐在沙灘上，卻

  巧遇凱文，燈光美、氣氛佳加上凱文的理解，擦槍走火的第一次性體驗，夏隆陰鬱的內心

  吹進了春風，他感受到戀愛的喜悅、性的興奮，但好景不常，隔天卻全變了調。


  無法拒絕同儕壓力的凱文成了傷害夏隆的劊子手，凱文是不忍心的，他大聲喊著要夏隆別

  再站起來、為什麼要站起來？！因為他知道只要夏隆站起來，就必須繼續下手.......夏

  隆不怨凱文，他選擇了不提告，卻用自己的方式復仇，狠狠的拿著椅子朝霸凌者猛敲，進

  了感化院。離開了這個充滿悲傷長大的地區。


  這時的夏隆，對於母親已不再依賴，甚至有點角色相反的照顧母親的需求（給錢、幫忙開

  門），他長大了，已不再是當年的孩子。



  【Black，黑仔】


  當你看到成年後的夏隆，你很難跟前兩段的主角聯想在一起，沒有嬌小纖瘦、沒有懦弱、

  取而代之的是一名壯漢，他變了，變得強壯變得看起來生活過的還不錯，戴金條、置銀牙

  、開名車，他成了跟阿璜一樣的毒販（上線），從拿的智慧型手機推斷時間軸應該是現在

  ，卻很突兀得開著一輛應該造價不斐的老爺車，我想那是他對阿璜的思念。

  不管是成為毒販、還是開著類似阿璜當年開著的車型，給自己取了當年凱文給自己的綽號

  ，成年後的夏隆看似不一樣了，生活裡卻充滿了對過去的紀念，或者該說是放不下？他離

  開了那個傷心長大的小區、來到了繁華的城市，卻在生活裡填滿了過去的影子。拒絕去探

  望母親、拒接電話，直到收到凱文的來電，而夢遺......。


  決定來餐廳的黑仔看到凱文的瞬間，他的眼神從黑仔變回了當年的夏隆，還是一樣少話、

  害羞、稚嫩，，兩個人看似輕描淡寫的交代了近況，互相探測彼此的心意，凱文點歌、做

  菜，直到夏隆開車送凱文到家，突然冒出的那句：

  「你是唯一一個碰過我的男人。我之後再也沒有碰過其他人。」

  他終於跟一直以來放在心裡的人告白，直接、簡單、真誠。


  畫面最後停留在夏隆把頭輕輕靠在凱文肩上，留給觀眾無限的想像。

  會成為烈火般的愛情、還是細水長流的堅固友情、兄弟情，沒有人知道，又或者，你希望

  是什麼，就是什麼。

  我們唯一知道的是：凱文一直沒有離開過夏隆的心、他是第一個、也是唯一一個住進夏隆

  心裡的人。


  成年後的夏隆去探望在安養院（或勒戒所）的媽媽，當他留著淚聽著媽媽的告白，他知道

  自己是媽媽唯一的依靠，但媽媽卻沒能成為他心中的依靠。媽媽早在幼年時期就已經拋棄

  過他了。



  ----------------------------------------------------------------------------------------------------------------------------------------------------------------


  整部電影有兩個核心在探討：凱文、以及媽媽。



  【關於媽媽】

  夏隆一直受到媽媽強烈的情感綁架，媽媽告訴他：

  他是媽媽的小孩、不是泰瑞莎的，他應該要關心與在乎媽媽多一些、不應該去愛外面的辦

  家家酒媽媽、甚至是媽媽不斷重複的一句台詞：

  「你是我的全部，而我也是你的唯一」

  媽媽一直用著血緣關係綁架著夏隆，不讓他從別人那裡得到母愛、甚至是向還在當學生的

  他要錢買毒品！

  媽媽用嘴巴告訴夏隆媽媽愛他，卻用行為告訴夏隆媽媽不愛他......這樣極端矛盾的狀態

  填滿了他的童年和青少年。

  夏隆的無助與徬徨，加上同儕間的訕笑、更加深他無法原諒與理解媽媽。導致長大後的他

  只能逃離與拒絕媽媽的見面要求。



  【關於凱文】

  從幼年時期的小個，凱文告訴他：「其實他沒那麼弱，對吧？要硬起來！」

  到青年時期的夏隆，凱文懂得他、並且是唯一會傾聽他也跟他分享心事的人，再到成年時

  期的黑仔，他的生命裡面，凱文是友情、是愛情、是唯一。也只有凱文能讓他感到安心、

  讓他能自在的做自己、讓他能當回那個脆弱膽小害羞的自己。

  直到最後，他放下所有的防備武裝，將自己碩大的身軀靠在凱文肩上時，我們看到的，是

  那個最初的夏隆。



  在看這部電影之前，我一直將焦點定位在一個小男孩成長的故事上，但看完後，覺得這是

  一部很溫柔卻哀傷的愛情故事。

  回歸到一開始提到的：我們都會在不同時期、有不同的稱號、有不同的樣貌去面對不同的

  團體與同儕，但有沒有那麼一個人，他永遠能讓你作回自己、不用武裝、不用偽裝、不用

  假裝，你可以很安心的把自己真正的樣貌呈現在他面前，很自然的。


  夏隆從沒讓凱文離開過他的心，只有在他面前，他可以是夏隆。




  最後想一提的是，片中夏隆把浴缸裝滿水倒進藍色液體、還有青年、成年後都會有用臉盆

  裝滿水和冰塊、把臉泡進去的橋段，雖然一開始覺得他是為了冰敷被打傷的臉，但後來覺

  得那是一種象徵：象徵著海水的冰涼～

  他一直記得泡在海裡的感受、那種美好，但我們並不能時時刻刻泡在海裡，藉由臉盆裡的

  冰塊水來清醒自己、也是讓自己放鬆的管道，冰塊水就如同冰涼的海水一般。




  ---------------------------------後記閒聊----------------------------------


  好像滿多人都覺得成年的夏隆是天菜XD

  man、又有肌肉、又害羞～


  但是我整部看完，覺得最有魅力的是成年的凱文阿！！！！！

  莫名的覺得沉穩、有經歷過事情的滄桑、知道簡單過日子的重要與真實，加上蓄上鬍子

  喔～～～覺得好有男人味！！



  好了，閒聊完畢。真心覺得這是一部愛情片、更勝於成長親情片。


  --'
