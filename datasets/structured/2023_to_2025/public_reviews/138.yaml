url: https://www.ptt.cc/bbs/movie/M.1499666172.A.D2F.html
title: '[普好雷]月光下的藍色男孩 '
content: '圖文網誌版（建議閱讀）

  藍色月光的男孩


  -----

  以下複製網誌：


  這部電影是我在飛往首爾的班機上觀賞的，會選擇這部片，

  除了它強勢問鼎奧斯卡並獲獎的光環加持，

  我也對於這部電影的命名：藍色月光下的男孩，頗有興趣。

  對於藍色，我們會聯想到blue、憂鬱等較晦色的字眼。

  就算色調清新如：《藍色是最溫暖顏色的》其結局，也是瀰漫著悵惘的感傷。

  但這是同一種黯然的情緒由身形勇壯、外型粗獷的黑人男性來演繹，

  會產生什麼樣的火花呢？令人期待。


  ☆


  在實際收看之後，我認為它真的是一部「得獎政治正確」的電影。

  因為裡面主要幾個元素：

  「非裔」、「毒癮」、「同性之愛」、「素人」都可以看做能夠大書特書的題材，

  不過我把電影裡的角色定義成「素人」，似乎是不太恰當，

  因為這些演員可能早已在其他的影集中琢磨演技，並且在大螢幕發光了。

  但我所定義的「素人」，是我覺得角色特質非常貼近是市井，

  可以說是每天在日常生活中錯肩而過的陌生人們。


  ☆


  如果要以整個架構來看，我覺得這齣電影可以看做是男主角的半生自傳

  在一個嚴重缺乏母愛（母親身染毒癮，父親缺席）的單親家庭中長大，

  在成長的過程中又慘遭同學霸凌，甚至連自己在心靈上自認為是「相濡以沫」的對象，

  也為了迎合在班上的既得利益的或者該說主流的團體，

  而在眾目睽睽之下傷害了他。我想在這一拳右一拳的重擊之下，

  碎得不只是臉部的肌理，更多的是主角對於對方的那分細膩隱晦的情感吧。

  但在破碎之後，作者選擇了重生。


  把臉埋在冰塊裡像是一種儀式，讓臉上的火辣感消失，

  讓悲憤的心情消腫，也讓脆弱的自己有了像冰塊一樣，有了冷冰冰的武裝。


  ☆


  以下有幾點是我在觀影的過程中，非常個人的見解。


  一、演員：同質益構

  我個人覺得代表主角三個階段的演員選得很好，

  縱使前者嬌小黝黑，在面對他人問話時因為防衛心很強，

  所以一直是以「低頭不說話」的姿態在抗拒這個世界；

  其後的青少年纖細憂鬱，

  穿著相較於其他同學明顯較為窄身的褲子，

  隱約地透露出他的曖昧性向(這點在電影中也有被同學提出來嘲笑)；

  最後的形象雖然是高大威猛，並且帶了金牙和耳環的模樣，

  但我覺得整體給人的氣質是很特別複雜的，

  感覺雜揉了剛強和柔弱，憤怒和淚水的綜合形象。

  且看他一身勇猛的肌肉像是人體盾牌，連一絲風都吹不進他心底的模樣。

  他的眼神卻出賣了他，洩漏他纖細易感的本質。


  不過這三個人都有共同的特質：

  1.迷濛閃爍的眼神：透露出他纖細敏感，甚至沒有安全感的性格


  2.緊身的衣物：在緊緊服在身上的衣物，算不算得上另類的撫觸和保護？


  3.認同/著迷的月光：月亮是太陽的對立面，而陽光給人一種正向、積極、剛性的象徵，

  所以可以揣測，是不是男主角有著難以啟齒的心事？

  不論是成長的經歷亦或是他的模糊性向？


  ☆


  二、色彩的運用

  1.如果色調是一種情感

  整部電影的色調低彩，但是非常飽和。

  有幾幕我還真的因為螢幕的反光，都快看不清楚主角的形貌。

  但是很清楚地感覺到螢幕中的情感正在慢慢地發酵、靜靜地流動

  還真頗有王家衛的風格。

  而在電影的最後，很高興主角對心儀的對方說出了心底話，

  雖然很露骨，但是真摯地令人心疼。


  2.有意識地在扣題

  因為電影的名稱是《用光下的藍色男孩》，

  所以我在觀看的同時，就有一直留意「藍色」在電影中的運用，

  發現導演是有意識地用顏色在扣題。

  不論是小男孩「藍色的書包」、青少年「藍色的牛仔褲」以及成年時的「藍色轎車」，

  這些細節都很細膩用心。


  ☆


  我想這就是這整部電影之所以動人的原因吧，

  畢竟，真性情就是好文章。把所有華麗的技巧剝落，

  用最真實的情感去感動觀影者，回歸電影的本質，這是很難得的事情。


  最後希望在出國進行義教之前，能夠補完《海邊的曼特斯特》。


  --'
