url: https://www.ptt.cc/bbs/movie/M.1757804871.A.023.html
title: '[極好雷]《月光下的藍色男孩》 ：男孩的私書寫'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《月光下的藍色男孩》極好雷：男孩的私書寫\n\
  \n本片講述男孩夏隆長大成人的故事。全片敘述風格極具私密感，歸功於三位不同時期的男\n主角演員，和大量近距離特寫，成品溫暖且真誠。\n\n男主角夏隆話少，全都默默看在眼裡。阿璜一家在夏隆被欺負時拯救他，卻是讓母親墮落\n\
  的幫兇；母親在兒時展現漠視和控制慾，後來更利用兒子的愛收割金錢；夏隆因為陰柔氣\n質遭到霸凌，與摯友 凱文 相識相知，後來因此與他疏遠。\n\n\n\n\n月光下的男孩，是黑色也是藍色，你必須決定成為什麼樣的人。同時灌溉愛，也施以惡意\n\
  的過去，讓選擇的命題成立。好壞並存，夏隆必須做出抉擇，為自己長成什麼樣的大人負\n責。\n.\n成年後，母親的咆哮化作惡夢，它沒有輕易放過夏隆。一次一次在腦中回憶，構建重組出\n\
  新的意義，在潛意識壓出一道道傷痕。\n\n《月光下的藍色男孩》將主角與摯友和母親的緣分延續到未來，給了寶貴機會回望過往，\n卻換來更殘酷的事實。\n\n「你跟我想像的不一樣。」多年後，凱文說出了對夏隆的心聲，可能也是觀眾的心聲。那\n\
  個善良纖細的夏隆，怎麼變成和阿璜一樣幹販毒生意的混混？是什麼讓他「選擇」了這條\n路？\n.\n看到後面才知道，《月光下的藍色男孩》談人生選擇，更多在談背後的多重因素如何交織\n\
  。\n\n當地的產業結構、歧視陰柔和崇拜陽剛的風氣、未能溫飽的家庭......你的選擇不只關於\n你，出生決定了眼界與手邊的資源。\n.\n陰柔的同志為了保護自己，學會武裝堅強，讓自己\
  \ Man 起來才不會再度受傷。那也許不\n是他、心態也不健全，但在那個時空環境下，成功保全了自己。\n\n母親在勒戒所跟長大的夏隆說：她愛他，只是在他最需要的時候，沒有表現出來而已。夏\n\
  隆很想做到、很想要相信啊，但那些不小心的、笨拙無知下造成的傷害，還是生了根、長\n出了枝椏，變成他的一部份。\n\n夏隆跟母親的相處模式、看待彼此的認知早已定型，傷口化膿又結痂，到底如何和解？不\n\
  禁讓觀眾回想：那些卡在我們回憶的創傷是什麼？如何與它們相處？\n\n《月光下的藍色男孩》透過夏隆的眼睛，讓你看到每個人物的苦衷，以及背負的罪惡感。\n\n\n\n\
  當一切都無計可施的時候，只能選擇「寬恕」。練習去寬恕看似有選擇，卻無能為力的大\n人、朋友，還有自己。原諒沒有長成自己想要的樣子，感恩就算不是什麼大善人，終究還\n\
  是順利活到現在。\n.\n「你是我唯一碰過的男人。」片尾夏隆向凱文坦白，再度雙手捧心，脆弱表露無遺。\n\n月光打在男孩的肌膚上，照出微微光亮。溫柔善良、強壯剛硬，這些都是夏隆。\n\
  \n\n\n\n\n>> 網頁好讀版：\n\n–\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n--"
