title: '[好雷] 月光下的藍色男孩：凝視那個男孩 '
content: '－－－－－－－－－－－－－－－－

  ＊點評電影：月光下的藍色男孩 Moonlight

  ＊推薦&喜愛指數：5（滿分5）

  ＊台灣上映日期：2017/3/3 (口碑場：2/17-19)

  －－－－－－－－－－－－－－－－

  【月光下的藍色男孩 Moonlight】：凝視那個男孩 //爆雷影評 Movie Review


  －－－－－－－－－－－－－－－－

  文本：


  自我同一性的摸索與貫徹，裸抱著疼痛百瘡的身軀哀哭的夜晚仍要學會與浪拼搏存活，月

  光下我從浪裡來或往浪裡走，你見我不是一個顏色，我仍是一個顏色。


  故事從男孩夏隆童齡、青少、成人三段成長經驗構築，夏隆因身型矮小寡言內向在學齡階

  段被喚作Little且飽受霸凌，而他吸毒的母親毒癮發作時更瘋癲無理的不是一個合格的監

  護人，販毒者胡安和女友特蕾莎是他的避風港，同齡人凱文是他的意中人和唯一的朋友，

  只是一次霸凌徹底擊垮了夏隆早已殘破稀微的自尊，最後他遠離家鄉長成了Black，健壯

  硬朗的一個毒販。


  飽含貶意的標籤和暱稱伴隨主人翁成長，是亟欲擺脫的包袱，是他堅固堡壘的碎瓦殘片，

  在終於成為自己不想成為的人和那個真實的自我中間，漫長又一去不復返的時光蹉跎，最

  終想逃避又想歸返的處所欺辱傷痛都已停歇，本來的你本來的我，回眸經典，餘波盪漾。


  慢步調的電影常常會讓觀眾坐立難安深覺冗長無趣而有時間過的慢的錯覺，《月光下的藍

  色男孩》雖行敘緩慢卻實際上引人入勝地讓人感覺不到時間的流逝，兩個小時的片長在結

  尾才如夢初醒，理智才重新運轉，在驚訝一聲：「結束了」？中落幕。回頭去看，三段分

  述主人翁成長片段與轉變的故事以及故事間那些空白的歲月相得益彰，簡潔洗煉的貼切主

  人翁說話以及沉默不語的時刻。


  『留白』是電影技法魅力所在，畫面色調的設計和慢放是鑿刻在觀眾腦海的短片段，再再

  延長出我們對夏隆的想像和疼惜，凝視一個男孩的成長，他的臉龐和月光下的背影，閃耀

  與黯淡的黑曜石，孤寂和時光都在那裡。


  那些夏隆睜著眼睛觀察似若有所思又似徬徨無助的特寫令人印象深刻，成長軌跡刻劃平實

  又留白玩味與猜測的空間，主人翁的人格標誌尤其靦腆寡言，是三個不同年齡段不同臉孔

  演員的演譯足以讓你知道他們是他的辨識原則，辨認人的依據不是臉孔，是靈魂。


  戛然而止的結局，靜謐時分只有你我的相互倚靠，我的模樣我的名字，給注目我、關心我

  、愛我的人呼喚和銘記。


  這部作品和政治正確一點都無關，僅僅致敬感念那些孤單寂寞時分伸出援手的暖源，疼惜

  那些不得不靜默的，不得不隱藏的、不得不偽裝的人們，世界和社會的致歉永遠來得太晚

  ，同為一份子的我只能內愧地對著看不見的臉孔沉重說一聲－對不起。


  有些電影結束了就結束了，有些結束了才感覺開始，《月光下的藍色男孩》應該是後者。


  ＊更多資訊請參考：




  --'
