title: '[新聞] 哥譚獨立電影獎「月光下的藍色男孩」奪下'
content: '哥譚獨立電影獎「月光下的藍色男孩」奪下4項大獎



  2016-11-29 20:23聯合報 記者童一寧╱即時報導


  美國哥譚獨立電影獎於台灣時間29日早上舉行頒獎典禮，今年被看好奧斯卡大熱門、甫入

  圍美國獨立精神獎6項大獎的「月光下的藍色男孩」，一舉奪下最佳影片、最佳整體演出

  、最佳劇本、觀眾票選獎最佳影片等4項大獎，得獎率高達百分之百。影帝、影后則分別

  由「海邊的曼徹斯特」凱西艾佛列克與「她的危險遊戲」伊莎貝雨蓓獲得。


  「月光下的藍色男孩」將於明年二月在台上映，描述居住在邁阿密的男孩席隆，因個子矮

  小、平時沈默寡言，在學校時常成為被霸凌的對象，痛苦中掙扎求生的他，憑著意志生存

  下來，但他漸漸發現真正殘酷的不是外面的世界，而是他已偷偷愛上自己的好朋友。


  「海邊的曼徹斯特」由巨星麥特戴蒙監製，明年一月也將在台上映，描述游手好閒的弟弟

  在哥哥意外身亡之後，必須獨自扶養年紀尚小的侄子，對於親情與自我認知的掙扎刻畫入

  微，剛剛獲獎的男主角凱西艾佛列克也已有問鼎奧斯卡影帝的氣勢。「她的危險遊戲」是

  今年坎城影展競賽片，當時就在坎城引起轟動，奇情怪誕、挑戰極限禁忌的劇情，伊莎貝

  雨蓓在片中也有突破尺度的大膽演出。



