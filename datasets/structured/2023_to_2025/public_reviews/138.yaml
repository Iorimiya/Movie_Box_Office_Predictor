title: '[好雷] 《月光下的藍色男孩》(Moonlight) '
content: "◎《月光下的藍色男孩》(Moonlight) - 你要成為哪一個自己？\n\n圖文完整版： \n\n成長並不容易，從兒時懵懂無知、到青少年期似懂非懂，隨時有第一次遇上、\n\
  不太能理解的事情，處處是考驗。如果當事人是個窮困、單親的同性戀黑人男\n孩，安然度過的難度就更高了。\n\n《月光下的藍色男孩》描述一位黑人男孩三段時期的故事，住在邁阿密的\n\
  Chiron自幼無父，母親吸毒，他的特殊氣質使他在校常被霸凌，只有一位毒販\nJuan給他溫情關懷。青年時期幾段充滿酸甜苦的經歷，帶他走向與幼年的自己\n完全不同的路。成年後Chiron搬去亞特蘭大，直到一通意外來電，讓他回到邁\n\
  阿密面對過去、也再度面對真正的自己。\n\n導演挑了三位演員分飾不同階段的Chiron，他們長得不太像，但卻明顯感覺得\n出演的是同一角色、心底住著同一個人，而且三位的演出都非常精彩，把低調\n\
  、不擅言辭的Chiron種種內心衝突詮釋地深刻動人。\n\n「在月光下，黑人男孩看起來是藍色的」。\n\n人的表象是一回事──黑人的皮膚就是黑色的，但在不同的光線與角度下，花\n\
  時間與心思觀察一個人，他可以與刻板印象完全不同。在《月光下的藍色男孩\n》裡，有個黑人男子說他好愛哭、哭到覺得自己會化成淚珠，有個黑街狠角色\n毒販可以真心關懷一個小男孩、並接受其同性傾向，有個嗑藥不顧家的母親對\n\
  兒子仍舊懷抱不知如何表達的愛，就連本片的音樂都採用許多鋼琴與弦樂的搭\n配，一反此類片型通常全程使用嘻哈與饒舌的習慣。\n\n在真實世界裡，事情就是如此複雜，沒有一個簡單符號與檢表可將人輕易歸類\n\
  ，「好人、壞人」分野更是模糊，例如Chiron的母親Paula（Naomie Harris飾\n演），她人生一團亂，自己無法承受，連帶將孩子拖下水；自己無力付出，但\n\
  孩子有替代的父母之愛時又很嫉妒；她在孩子最需要幫助時丟下他，卻又到老\n都愛著孩子。Paula當然可被說成一個「壞媽媽」，但每個人都只能在他有限\n的能力裡頭盡力，Paula一樣是生活的受害者，與其說她殘害孩子，倒不如說\n\
  她頂不住塌下來的天，自身都難保，更顧不了孩子，若給她另一種環境，或許\n也能是個慈愛的母親。\n\nJuan（Mahershala Ali飾演）的情形亦然，當Chiron搞懂，「母親深受毒品所\n\
  害」與「Juan在販毒」這兩件事的因果關係時，Juan表情複雜、許多想法一言\n難盡，他感到罪惡、痛苦，卻也知道自己不會停止幹這行。Juan的所作所為傷\n害Chiron的母親，但Chiron卻極度需要倚靠Juan與他女友。當Juan帶著Chiron\n\
  去海邊教他游泳，導演安排讓攝影機鏡頭下方的水波上上下下，似乎要讓觀眾\n體會，這孩子在可以吞噬人的茫茫大海裡，只靠著Juan一雙手撐著，不讓他溺\n水，讓他有機會享受生命中難得的美好。傷害他母親的人竟成了世上少數對他\n\
  表達善意的守護者，人生還能有更諷刺、複雜的事嗎。\n\n「你總有一天得自己決定你要成為什麼樣子，別讓其他人替你決定」。Chiron\n的守護者Juan這樣對他說。\n\
  \n漸漸進入青春期的孩子，開始思考自己到底是誰、在社交圈裡以何種姿態立足\n、未來要成為什麼樣的人，這時期是充滿困惑的。Chiron是個格格不入的孩子\n，他的自我探索註定比別人更辛苦。電影呈現的三段時刻，Chiron都在以愛為\n\
  引導或以憤怒為引導的十字路口上，對許多事情感到困惑。從年幼時期，他就\n完全不懂為何自己被稱為\"faggot\"、甚至不知那個詞是什麼意思，更不理解為\n何如此安靜低調卻仍被討厭、被欺負、被打，這樣的經歷使得沉默寡言的他隱\n\
  藏了許多傷痛與憤怒，一路帶到青少年時期。大了一點兒的他，開始理解年幼\n時與現在遇到的霸凌是怎麼一回事──別人對他的特質看不順眼，於是Chiron\n得選擇抗拒本性亦或接受，並且決定用什麼樣的方式面對外界，這些外在壓力\n\
  與內在本質的衝突，使他的心理成為不定時炸彈，端看遇上什麼樣的事情，來\n決定炸彈會被引爆、或是拆彈成功。\n\n***以下有微雷***\n\n而當惡霸再度找上了他，當年輕的Chiron被迫改變自己，當敏感細膩的他開始\n\
  使用武力，觀眾明白他殺死了心裡的某些東西。「成長」最大的悲劇，就在於\n年輕孩子必須殺掉心中美好的東西才能面對這社會與他人的殘酷。Chiron身處\n「男子氣概」的價值凌駕一切的世界，只能武裝自己，成為自己不是的那個人\n\
  。\n\n不過，《月光下的藍色男孩》並不準備用憤世嫉俗的態度來面對這一切，電影\n的第三段，是全片最精采動人的一段，在此不談論細節，留待各位進戲院體會\n。這世界很殘酷，但若在某個角落，能找到一個自在做自己的小天地，我們或\n\
  許終究能得到某些解脫。《月光下的藍色男孩》三段故事的篇章名，都是\nChiron被叫過的名稱，但終究只有他自己能決定他是誰。往後的日子，Chiron\n會決定做什麼樣的人，我不知道，但我知道他發現了一個選擇、一個可能，而\n\
  這麼一點點希望，不就是讓很多人繼續下去的最佳動力嗎？\n\n《月光下的藍色男孩》的編劇兼導演Barry Jenkins，以及故事原作\"In\nMoonlight\
  \ Black Boys Look Blue\"的作者Tarell Alvin McCraney，都是在邁\n阿密長大的黑人，應該可以很放心地說，《月光下的藍色男孩》是他們非常熟\n\
  悉、理解的主題，或許也因為如此，許多對白充滿細膩獨到的洞見，對主要角\n色的觀察盈溢著情感。本片聽來像常見的「青少年轉大人」片，但它用溫柔與\n創意走出了自己的特色，看完它，每個人的心都會軟那麼一些些，這或許是世\n\
  局充滿憤怒的此刻，許多人非常需要的安慰。\n\n\n--\n\n我的部落格 \nFB粉絲團  \n\n--"
