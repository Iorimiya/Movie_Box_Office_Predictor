title: '[  好雷] 月光下的藍色男孩'
content: 'Moonlight (2016)


  故事描述一個住在邁阿密沉默寡言的黑人男孩找尋自我定位、找尋認同的成長故事。影片

  分成三個部分，將其歷程簡單的劃分為Little、Chiron、Black三個部分。


  童年時期的Little，他生長於一個混亂的家庭，媽媽是個毒蟲，而在學校也時常受到同學

  的欺壓。這個時期一如他的小名一般，他是個充滿徬徨，定位不明，懷疑自己存在目的，

  懷疑自己性向的沉默男孩。不過Juan的出現，或多或少填補了他童年時期所缺乏的父親模

  範，而Juan的影子也在接下來的階段可以清楚的看見。


  進入青少年時期之後，一開始我們便得知了Juan的死訊，而年紀稍長Chiron一樣的懵懂不

  安，學校與家庭間的雙重苦悶無從抒發，只能偶爾投靠從小照顧他的Teresa。但Teresa畢

  竟不是自己的親身母親，這也是這個階段重複出現的主題，我該去哪裡，為甚麼媽媽表面

  上說愛我，但我真正需要母愛的時候，卻是一個跟我沒有血緣關係的人對我最好。另一方

  面，性取向的問題依然困擾著他，甚至這一直以來也是他備受欺負的主要原因之一，這世

  界似乎沒有人懂他，跟最好的朋友在海灘上發生「意外」之後的隔天，卻要面對好友的痛

  打。我覺得第二段是三段之中最接近真實自我的一段，在這一連串的痛苦中掙扎的Chiron

  最終終於短暫的找到自我，硬了起來攻擊了欺負他的同學。不過我覺得這道只是為了自我

  保護的短暫武裝，在社會氛圍之下，他遲遲未能獲得社會的認同，又或許可以說，他尚未

  認同自己。


  經過了青少年時期最後的爆發，第三段的Chiron徹底的武裝自己，有樣學樣地開始販毒、

  開名車、欺負新進的後備、戴金牙等。可以看出與其真正的做自己，或許在某種程度上，

  學習做他欣羨的社會典型(如Juan一般)是個更輕鬆的選擇。但一通突然的電話卻打破了這

  樣的武裝，也讓Chiron真正有了機會，面對自己。


  在觀影的當下，時時被影片中充滿不安的攝影機運動搞得焦躁不安，但導演刻意又這樣緩

  慢，徬徨的方式來表現Chiron所身處的困境以及掙扎。而雖然在第三段的一開始，對於劇

  情突如其來的進展感到有些小小的失望(畢竟跟前兩段的調性有些落差)，但最喜歡的卻也

  是第三段。在影片結束之前Chiron突如其來的說:「You''re the only man who ever touc

  hed me.」這是他第一次真正的認同自己，也真正的說出自己的想法，這邊雖然沒有太多

  的對白，但Chiron與Kevin兩人之間若有似無、羞澀的對望，情意綿綿的互動正也說明的

  一切。也見證了這份感情之間的難能可貴。或許在性別平權的今日，大聲說出自己的性向

  已經不是什麼稀奇的事情，也不大會遭受他人異樣的眼光以及強力的抨擊。但很多時候比

  起社會的看法，真正的認識自己，真正的認同自己卻是一件更難的事情。


  「At some point, you gotta decide for yourself who you''re going to be. Can''t l

  et nobody make that decision for you.」


  ps特別喜歡它的結局，乾脆不落俗套


  --'
