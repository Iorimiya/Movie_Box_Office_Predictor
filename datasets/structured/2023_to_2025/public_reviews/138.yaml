title: '[好雷] 月光下的藍色男孩 '
content: '《月光下的藍色男孩》

  Moonlight (2016)



  1.很好看的電影。


  2.電影海報上的「男孩」，其實是男主角三個人生階段頭像

  的拼貼，大概是因為「男孩」的成份比較大（三分之二），

  所以給人的第一印象是「男孩」，而非「男人」。


  3.在美國社會底層，作為一名黑人（Black）男同性戀者（Gay），

  為了避免被歧視霸凌，必須戴上多重的面具。成年後男主角

  變成一個外表強悍世故的黑社會份子，當他回到故鄉，面對

  母親、面對故友，卻仍然是原初那個柔弱寡言的內向男孩。


  4.電影並沒有為他和故友的情感定調，可能是同性情感，也

  可能只是兄弟情誼，留下曖昧的空間，令人玩味。最後在餐

  廳彼此敘舊試探的戲，非常動人。


  5.電影的色調豐富，音樂和配樂也扮演重要角色，這些讓我

  想起王家衛的《春光乍洩》（1997）。




  --'
