url: https://www.ptt.cc/bbs/movie/M.1487422230.A.58A.html
title: '[好雷]《月光下的藍色男孩》（Moonlight）'
content: '圖文好讀版：


  不，這並不是你想像中的那種黑人電影。


  雖然與《關鍵少數》（Hidden Figures）、《藩籬》（Fences）一同入圍奧斯卡最佳影片

  ，但《月光下的藍色男孩》的故事主軸卻和這兩部完全不同，它不談種族與歧視，無關性

  向與膚色，也沒有黑人電影以往對平權的訴求。它描述的只是一個男孩的成長故事，橫跨

  了二十年的歲月，他對愛的渴求和自我的追尋，就這麼簡單。


  本片由布萊德彼特（Brad Pitt）監製，是導演貝瑞傑金斯（Barry Jenkins）睽違八年拍

  攝的第二部劇情長片，他將死黨泰瑞艾爾文麥卡瑞尼（Tarell Alvin McCraney）撰寫卻

  未上演過的舞台劇，重新改編成電影劇本。這部電影從獎季至今一路勇奪許多獎項，不但

  拿下今年金球獎戲劇類的最佳影片，也是時代雜誌選出的2016十大佳片榜首，更入圍本屆

  奧斯卡包括最佳影片、導演和男女配等八項大獎。


  整部電影以三段式的敘事結構，啟用了三位不同的演員，詮釋男孩夏隆在童年、少年及成

  年後，三個不同階段的自我成長故事。這個內向而沉默的小男孩，從小在同學間飽受霸凌

  ，跌跌撞撞的走在人生這條道路上，渴望著親情、友情與愛情，最後他如願模仿成了自己

  嚮往的強者，卻仍在初戀的眼神中卸下武裝。


  他還是當初那個寡言而壓抑的小男孩。



  導演選擇以克制的手法詮釋這個故事，將想像空間全然留給觀眾，刻意不交代夏隆在這三

  段時期外，在它們空白的區間中發生過什麼，又是什麼導致他的改變。乍看之下會覺得故

  事顯得有些流於表面，除了夏隆之外的配角們戲份都受到了壓縮，沒有足夠篇幅來描寫得

  更加深刻，但我看完後卻越細想越覺得回味無窮。


  三段故事就像是回憶，那些我們腦海中偶然浮現出的過去片段。劇情的大量留白，畫面色

  調的運用，還有配樂的襯托，堆疊出電影中的詩意與憂鬱氛圍，對於情緒刻畫得節制卻又

  細膩，溫柔且小心翼翼的觸碰著靈魂深處，也像是在回憶上套了一層濾鏡。於是有沒有前

  因後果、是不是過於文藝清新好像都不再重要了，當下那種內心被打動了的感受才是最真

  實的。


  在三段故事中詮釋夏隆的三位演員，將這不同階段的同一個角色表現得很到位。他們三位

  在拍攝前並沒有見過對方，但不管是氣質或表情，還有凝望著這世界的眼神，都出乎意料

  的相似。透過導演對角色設定的細微動作與習慣，更讓觀眾毫不猶豫的就接受了他們是同

  一個人。尤其是最後一段中飾演成年夏隆的崔凡特羅茲（Trevante Rhodes），見到童年

  初戀時那瞬間轉變的膽怯拿捏得太精準了。



  第一段故事中，10歲的夏隆因緣際會認識了毒販尤安，矛盾的是，尤安銷售的毒品摧毀了

  夏隆的母親，可他和女友對夏隆的關心照顧，卻又恰好的滿足了夏隆對父愛與家庭的渴望

  ，教了他一堂關於自我認同的課，讓夏隆對未來開始產生了思索。


  第二段故事中的少年夏隆，仍然在同儕的霸凌中艱難掙扎，沉溺於毒癮中的母親越來越失

  控，對夏隆來說，他人生中唯一的光亮就是對他友好的同學凱文。他的視線隨著凱文流轉

  ，因為凱文而從夢中驚醒，當情愫悄悄滋長，隨之而來的卻是加倍的傷痛與絕望。夏隆告

  別了這個城市，告別了那段才剛萌芽就死去的愛戀，也在凱文歉疚的眼神中告別了他的青

  春。


  第三段故事中的夏隆已經是個成年人，不管是事業還是身形，儼然都成為了他在孩童時嚮

  往的強者模樣。但其實這一切不過是種拙劣的模仿，他學著尤安成了毒販，可母親和凱文

  深夜接連打來的電話，卻再次動搖了他的心。


  夏隆在這二十年的漫長歲月中，持續追尋探索著自我，渴望獲得認同。第一段中的他因為

  尤安，初次意識到「要成為什麼樣的人」是自己的選擇；第二段中的他剛接觸了自己性向

  ，還來不及接受就立刻被摧毀殆盡；於是第三段的他選擇成為別人眼中的強者，用假金牙

  套和名車來裝點自己，即使那並不是真正的他。


  真正的他是那個流著眼淚，痛苦的說著自己對愛的渴望、對母親的恨的孩子。是那個在成

  為餐館廚師的凱文面前，想展現自己成功強悍的一面，卻仍然彆扭得不知所措，最後因為

  對方一句「這不是真正的你」，就忍不住丟盔棄甲承認了自己情感的少年。他已經長成了

  一個男人，但他仍然是那個膽怯羞澀的男孩。


  最後他倚靠著凱文的這一刻，或許就是尤安曾經告訴過他的，得決定自己要成為什麼樣的

  人的那一刻，不是被別人所決定，也不是憑模仿得來的虛有其表，而是由你決定自己是誰

  。



  海洋是貫串三段故事的重要意象，夏隆人生中的重要轉折，他對於自我和性別認同的三個

  階段也都發生在海邊。童年的他在海中和尤安學習游泳，載浮載沉中懵懂埋下了種子；少

  年的他在海灘邊初嘗情慾，月光下他意識到了自己的性向；而在最後一段中，夏隆走進凱

  文家前也看了一眼大海。


  大海是藍色的，月光下的黑人看起來也是藍色的，尤安拒絕成為老奶奶口中的「Bloom」

  ，而夏隆繞了這一大圈，最終也找到了自己是誰的答案，他不是藍色的（Blue），不是同

  學們給瘦弱矮小的他起的綽號「Little」，不是母親和特蕾莎稱呼他的本名「Chiron」，

  而是黑仔（Black）。最後一顆鏡頭中，站在大海前的小男孩，終於回過頭來坦然的接納

  了自己的性取向，擁抱了最真實的自己。


  《月光下的藍色男孩》並沒有什麼了不起的命題，即使膚色和性傾向讓它顯得很政治正確

  ，但看完之後你就會明白，這不過就是一個平凡男孩的成長史，是一個愛情故事。簡單、

  溫柔、動人，如此而已。


  （最後一定要說這部電影的海報做得太美啦，三個時期的夏隆完全無縫接軌（？）


  --


  影生夢死，在電影裡活著，在夢醒時死去。





  --'
