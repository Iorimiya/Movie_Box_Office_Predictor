url: https://www.ptt.cc/bbs/movie/M.1487560227.A.8B1.html
title: '[有雷] 男孩成長史《月光下的藍色男孩》'
content: '圖文版請於連結：


  藍色是最溫暖的顏色，男孩成長史

  不知道有多少人還記得自己小時候的事？看著現在的自己，跟自己兒時的模樣有什麼不同

  。這些只有自己知道，還是其實最了解你的，是你的家人、隔壁看著妳長大的大嬸、還是

  一位久未碰面的青梅竹馬？也許到頭來其實有些事情小時候的你比長大的自己看的更清晰

  。《月光下的藍色男孩》是在二零一七年在台灣上映，在二零一六年大放異彩，勇奪多項

  大獎的黑人電影。故事敘述男孩夏隆的成長歷程，以夏隆少年、青年、成年的三個章節來

  呈現男孩經歷的一切和變化。有些事情長大看清楚了，但最真實的記憶卻還深埋內心之處

  ，等待某天可以正視自己之時。










  也許是因為較少有關於探討黑人同志內心的電影作品，所以《月光下的藍色男孩》一出來

  ，驚艷許多觀眾，也獲得眾多評審芳心，成為二零一六年獲獎最大贏家。雖然這部電影台

  灣宣傳是以「布萊德彼特監製」和「黑人同志電影」為主打，但我認為這部影片並不止於

  同志電影或名人監製這點，而是探討一位黑人男孩橫跨二十年來不斷找尋自己情感、自我

  定位與內心等多方面的摸索，這點比起一般同志電影下只有同志族群的情愛糾葛，要來的

  更多元。


  電影呈現的是一位黑人單親家庭的小男孩夏隆，他從少年到成年的成長過程。兒時的夏隆

  因為身材矮小常被同儕欺負，誤闖販毒區，認識了毒販尤安，漸漸把尤安當成自己的父親

  ，而尤安與他女友也陪伴沉默的夏隆。而來到青少年時期時，夏隆一樣還是成為被霸凌的

  對象，但好友凱文的陪伴，讓他還算好過，但隨著時間，夏隆發現自己愛上了凱文。但隨

  著時間長大成年，夏隆在外地工作，過著與童年不大一樣的人生，而這時一通電話讓人決

  定回顧這童年故鄉……










  《月光下的藍色男孩》改編《月暮下，男孩好似藍》舞台劇作品。除了戲劇如朗誦新詩般

  ，電影畫面也在現實和如詩如畫般的場景中相互交合。電影不避諱使用了諸多夜幕昏暗的

  鏡頭，雖然演員是黑人，但卻在打光和色澤上，電影美術呈現出一種低調風雅的美感，就

  如同他原先的舞台劇一樣，讓人倍感詩意，在劇情上頭也無浮誇，在整體的步調相當平穩

  ，電影一開始就能讓人投入角色，如此渲染於人又真摯動人。


  主角夏隆投射的並非只限於同性戀者，而是每一個少年必經之路，家庭問題，自我認同與

  自卑，同儕之間並不全然美好的校園生活，以及第一次愛上的人，和生命中傷害自己，卻

  又有愛著自己的人們。諸多情感流動，讓夏隆一步步摸索自己，而又想著自己是個怎樣的

  人，而讓他在長大三十多歲時回到故鄉，能坦然去面對兒時自己的一切，雖然人生有時逃

  避可恥卻有用，但有些東西牽絆著你一輩子，想逃也逃不了，終得面對一切情感與問題的

  源頭。











  電影中並未明顯的表示夏隆與好友兩人之間的性傾向，也未將歧視和毒品等元素誇張化，

  《月光下的藍色男孩》並非單是以同性戀電影或黑人電影單一主題區別，而是一個男孩如

  何在破碎的人生中尋求完整自己和最初原點的過程。電影中聚焦於非裔男孩成長，讓觀眾

  拋開以往在電影對黑人的刻板印象，以美國貧民區、黑人族群、同性戀、販毒等元素切入

  電影，卻跳脫出情色暴力，讓人倍感清新的情感探索之作，實為讓人著迷。


  而出生於邁阿密的非裔導演這部《月光下的藍色男孩》在許多地方都有受到王家衛的電影

  作品《重慶森林》啟發，從一位連電影都不知道要打光的素人，到掃蕩電影大獎的熱門導

  演。《月光下的藍色男孩》的步調的確有著中式同志和藝術電影的步調，但卻又倍感異國

  情懷，彷彿一場美國黑人的《春光乍泄》。但《月光下的藍色男孩》將感情與成長兩者的

  拿捏，收放得當，雖說一些關於親情的敘述電影中未做琢磨，但儼然這藍色男孩的臉龐，

  已讓人久久難以忘懷。


  --'
