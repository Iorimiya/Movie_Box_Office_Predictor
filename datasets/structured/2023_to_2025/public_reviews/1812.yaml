url: https://www.ptt.cc/bbs/movie/M.1678705668.A.E8A.html
title: '[雷] 好雷｜所有的美麗與血淚'
content: "雖然奧斯卡最佳紀錄片沒選《所有的美麗與血淚》，但我真的超想跟大家推薦這部片！\n　\n得知台灣會上《所有的美麗與血淚》時很興奮，一部分是這部片拿了威尼斯影展金獅獎，庸\n\
  俗的我肯定想看一下為什麼會得獎：一部分則是對藝術從業人員來說，Nan Goldin和Sackle\nr家族的奮戰，以及其領導的團體P.A.I.N 一系列在羅浮宮、大都會美術館、古根漢美術館\n\
  等大型博物館，以肉身之軀力抗巨人的故事，本來在那幾年就是蠻讓人震撼。\n\n只是沒想到實際看到這些影像呈現在大螢幕時，我會第一瞬間淚流不止。\n　\n——————\n\
  　\n電影分成好幾個篇章，但近乎每個篇章都採雙主線敘事，一條是Nan Goldin個人的生命故事\n與創作，一條則是P.A.I.N 對於Sackler家族與旗下類鴉片藥物如何造成美國大量人口藥物\n\
  成癮的抗爭運動。\n　\n兩條主線拍攝方式刻意區隔，當是Nan Goldin個人生命史時，畫面大多使用過去的相片或是\n錄像，包含著大量她的作品，這些影像緩面變化，宛如幻燈片般，配上她娓娓道來的獨白回\n\
  憶，頂多點綴部分歌曲，但每首歌曲的歌詞又都回應著當時訴說的故事。觀眾彷彿就在Nan\nGoldin 的身邊，聽著她敘述這些憂傷的回憶。\n　\n但到了抗爭則非常不同，環境音都進到畫面，鏡頭被拉遠，觀眾被置放在抗議團體之中，聽\n\
  著成員討論如何選擇場所，鋪排抗爭表演形式，以及法律策略等。\n　\n這兩個敘事線各自主導出不同的故事，但是當談到1980年代愛滋在其朋友圈蔓延開來時，兩\n個敘事線在核心突然串起來。\n\
  　\n作為觀眾，我在那刻意識到那個躁動又憂鬱的女孩，至今仍是個倖存者。\n　\n她從姊姊的自殺倖存、從家暴倖存、從愛滋倖存、從藥物成癮倖存、從用藥過量倖存，而每\n\
  一次的活過來，都讓她備足勇氣，起身與那些不公不義奮戰。\n　\n——————\n　\n我想回頭談一下抗爭這部分，這樣說可能有點失禮，但是P.A.I.N 的抗爭非常精彩，其實光\n\
  是策略選擇就很精準，他們的目標瞄準都是有Sackler家族贊助，同時也有收藏Nan Goldin\n作品的館所。\n　\n而抗議現場的錄像也具備豐富的表演性，包含從底下往上拍古根漢美術館從空灑落的處方簽\n\
  和信件、the Met 倒地死亡的靜寂，還有裡面一個紐約在地組織的非裔倡議者，他的演說唸\n起來像是在Rap一樣帥氣。\n　\n而當這些抗爭回望到1980年代David\
  \ Wojnarowicz對於愛滋的倡議活動時，那段追悼會的演\n說尤其精彩（註），也能可以理解到這些活動的相承，而或許也是為何愛滋那個片段也是少\n數在回憶Nan\
  \ Goldin的生命史時，岔開來由他人主導的部分。\n　\n這樣一想，又覺得這部電影的敘事更好看了。\n 　\n\n　\n註，節錄David Wojnarowicz的宣言至此，電影裡面的翻譯我很喜歡，可惜我只能渣翻至此\n\
  ：\n　\n「我擔心朋友們會慢慢變成專業的抬棺人，等待愛人、朋友、鄰居逐一死去，並潤飾他們追\n悼演說，完善他們死亡儀式——而非相對簡單的生活儀式，如在街頭尖叫。\n\
  　\n  我想像，如果每次情人、朋友或陌生人死於愛滋時，都有一場示威遊行，那是什麼樣子\n。我想像，如果每當一位情人、朋友或陌生人死於愛滋時，他們的情人、朋友或鄰居都會把\n\
  死者的身體抬在汽車上，以100英里／小時的速度開到華盛頓DC，衝破白宮大門，在門口嘎\n茲嘎茲地停下，把毫無生氣的身體放置在台階上。\n　\n看到情人、朋友或陌生人，以這種公開的方式標誌著時間、地點和歷史，令人欣慰。」\n\
  \n\n--"
