url: https://www.ptt.cc/bbs/movie/M.1685331795.A.F2B.html
title: '[好雷] 所有的美麗與血淚-私攝影的「以身作則」 '
content: '榮獲威尼斯影展金獅獎

  今年三月曾經有院線上映









  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  (部落格原文)



  以當代攝影藝術家Nan Goldin做為紀錄片軸心帶出兩種面向，一是藉由她過去的攝影作品

  ，在紀錄片中像是播放幻燈片的方式，並以藝術家作為旁白者，娓娓道來作品與其背後的

  回憶。二是藝術家現在的抗爭進行式，因為用藥問題，發現一款類鴉片止痛劑上市藥品，

  已經危及許多使用者健康，並開始與藥廠抗爭，並將行動的火力放在藥廠背後財團對於美

  術館博物館的贊助，試圖在公眾形象上，逆轉其看似慈善正面的假面具。並也包含探討歐

  美國家對於藥物濫用、吸毒汙名化，並非完全戒斷才是健康，與適當的處理方式（註1）

  。



  這裡要說的並非資訊性討論，而是自己在看時的感受，第一次知道Nan Goldin在大學時期

  女同志友人收藏的她著名的作品集：《The Ballad of Sexual Dependency》，於是因此

  略有耳聞但沒深入探究，直到看了這部紀錄片，對於前段的描述Nan Goldin叛逆歲月與離

  家之後藏身於充滿酷兒的地下世界好像沒有太多感覺，當然如果是電影就不過是一種客觀

  欣賞，但是做為一種藝術比較會是如同Nan Goldin作為一種私影像的紀錄，像是用身體（

  與鏡頭）在迎接她存在的世界。



  欣賞是一回事，與藝術的關係會談的是如何「以身作則」，若是對應比較是在台灣既傳統

  又直男父權的社會環境，如何要避免完全去脈絡化的去看待那些帶有浪漫意味，同時又與

  Nan Goldin的「身在其中」背道而馳（註2）。一直到片中她說去從事性工作者，拍了一

  些房間和床的照片，心想這不就是自己因為要省錢找一些邊陲地帶當工作室去看房子的樣

  子嗎？



  我們周遭的不堪往往被視而不見，如路邊被亂丟的垃圾，骯髒臭臭的流浪漢等等，於是有

  這樣「共感」之後繼續順著Nan Goldin的攝影作品與生命旅程，藝術家在經歷過後藉由一

  張張靜照的記憶回溯反而更有力量，也是前所未見的紀錄片敘事方式，並加上與當今的抗

  爭前後呼應的剪輯，並且保持著一個整體：從姐姐的死去，像是一種覺醒與啟蒙開始對抗

  外在壓迫的生命過程。



  不過在結尾抗爭成功令人喝采之餘，也想起台灣藝術家以展覽做為威脅的社會抗爭，當然

  藝術家的誠懇無庸置疑，只是是否因為一時熱血，底線終究維持在藝術家的光環（註3）

  ，當然這也是本片沒說的，也已經不關《所有的美麗與血淚 》這部電影的事情。





  （註1）

  詳細資訊可以參考以下連結





  （註2）

  這種斷裂令人想到，藝術家何孟娟2022於北美館的個展，紀錄紐約的藝術家魏斯貝絲公寓

  （見網頁資訊連結）




  （註3）

  令人想到藝術家陳界仁也以不再北美館展覽伸援被壓迫美術館勞工，不過我之後在北美館

  某年雙年展還是有看到陳界仁的作品（好啦，他說的可能是不再北美館辦個展）

  新聞資訊：


  --


  拉特飯 - 以商業力量進入獨立市場

  (剛搬家內裝待修)


  --'
