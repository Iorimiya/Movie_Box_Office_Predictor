url: https://www.ptt.cc/bbs/movie/M.1729656165.A.A9B.html
title: '[好無雷] 《猛毒最終章：最後一舞》'
content: '今天快瘋了

  趕緊看個電影紓壓紓壓一下


  比第二集好看太多了

  很純粹的爆米花電影

  整體節奏有些些奇怪

  或許是摻雜了公路旅行的部分

  但不影響觀影的樂趣


  有非常棒的打鬥場面

  動作也都很俐落

  不會像第二集那樣有著不乾脆的感覺

  快刀斬亂麻的方式反而讓人感到十分有娛樂性

  雖然說是亂鬥

  但不會像蜘蛛人3那樣分不清戰鬥畫面

  戰鬥畫面很清晰易懂


  如果沒意外的話

  爆米花桶應該會很滿


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
