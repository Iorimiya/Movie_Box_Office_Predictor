content: "東森洋片\n猛毒最終章-最後一舞\n8/02(六) 21:00\n\n導演 凱莉·馬修\n主演 湯姆·哈迪\n     奇維托·艾吉佛\n  \
  \   茱諾·坦普\n     萊斯·伊凡\n     佩姬·陸\n     阿萊娜·尤波奇\n     史蒂芬·葛拉翰\n\n《猛毒最終章：最後一舞》（英語：Venom:\
  \ The Last Dance，新加坡譯《猛毒：最終章\n》，中國大陸譯《毒液：最後一舞》，香港譯《毒魔：終極一舞》）是一部2024年美國超\n級英雄電影，改編自漫威漫畫旗下的反英雄角色猛毒的故事，由哥倫比亞影業和漫威娛樂\n\
  共同製作，索尼影視娛樂負責發行。本片為索尼影業蜘蛛人宇宙的第五部電影，亦是2021\n年電影《猛毒2：血蜘蛛》的續集，同時也是猛毒三部曲的最後一部。由凱莉·馬修執導\n\
  （導演首部執導）和撰寫劇本，湯姆·哈迪和馬修共同撰寫劇本，其主演包括哈迪、奇維\n托·艾吉佛、茱諾·坦普、萊斯·伊凡、佩姬·陸、阿萊娜·尤波奇以及史蒂芬·葛拉翰\n\
  。\n\n《猛毒最終章：最後一舞》2024年10月25日於美國上映，在影評界獲得混合評價，正面的\n評論讚揚動作場面和視覺效果，負面的評論則批評編劇和湯姆·哈迪的演出表現。本作也\n\
  成為猛毒三部曲中票房收入最低的電影。\n----------------------------------------------------------------------\n\
  東森電影\n臨時劫案\n8/02(六) 21:00\n\nAmc\n好萊塢電影\n8/02(六) 21:00\n\nHBO\n完美伴侶\n8/02(六) 22:00\n\
