url: https://www.ptt.cc/bbs/movie/M.1731059354.A.65A.html
title: '[好無雷] 《幸福國度》李善均的最後一舞'
content: "11/5（二）晚間到美麗華看《幸福國度》的特映\n本片的時間線在《南山的部長們》跟《首爾之春》之間\n講述1979年總統暗殺事件後\n當中唯一一位現役軍人需要接受一審定讞無法上訴的軍事審判\n\
  所展開的法庭攻防\n全片的安排妥當而且剪輯流暢\n雖說是2小時的劇情片但一點也不會無聊\n深深體會到大時代下小人物的身不由己\n是部好看但惆悵的電影\n片名真的是很諷刺\n\
  主題曲在片尾播放時更是有味道\n\n\n曹政奭飾演的律師跟李善均飾演的軍官\n一動一靜的對比很有趣\n最喜歡後來兩人比較熟後\n在監獄聊天剝橘子的那一幕\n\n\
  這應該是李善均最後一部電影了\n這部片中木訥壓抑的演出很深刻\n他在《王者製造》也有很出色的表現\n真的是很可惜\n\n韓國歷史電影多到可以自成系列\n之前有一張韓國歷史電影表fb有粉專幫忙做成中文版\n\
  \n\n\n感覺這張圖還會再繼續變長\n想看諜報動作片的可以看看《獵首密令》\n--\n\nSent from \n\n--"
