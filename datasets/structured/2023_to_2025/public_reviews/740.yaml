url: https://www.ptt.cc/bbs/movie/M.1729599907.A.7D5.html
title: '[雷] ［無雷］猛毒3:最後一舞'
content: '有幸看了美麗華今日舉辦的猛毒3試映會

  恰好今天有新的杜比影廳開幕

  標榜台北首坐杜比劇院果然不是蓋的，雖然銀幕偏小，要坐前面一點才有包覆感，但亮度表

  現和音響設備真的沒話說（猛毒3有些很暗的場景也能看清楚）

  不得不說影廳很新，觀影體驗不錯

  椅子都是皮的還有新車開箱的味道XD

  隔音很好，不會聽到隔壁轟轟的聲音和震動

  值得去體驗看看





  回到正題

  介紹完杜比影廳後就直接播放猛毒3

  依然是猛毒和艾迪的搞笑互嘴風格

  是部輕鬆幽默的公路電影

  但作為最終章覺得有點不夠力

  有時候會覺得轉場有點生硬

  然後反派 嗯

  當成爆米花電影OK但要用腦深入看的話

  我自己沒有很喜歡XD

  最後片尾彩蛋有兩個

  基本上要待到最後啦


  --'
