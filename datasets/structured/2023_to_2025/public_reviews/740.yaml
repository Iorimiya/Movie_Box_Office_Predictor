url: https://www.ptt.cc/bbs/movie/M.1730017799.A.9B3.html
title: '[普雷]猛毒3-最後一舞'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  先說結論

  整體還算可以，本來對猛毒有興趣的可以看看


  猛毒跟艾迪的互動還是蠻有趣的

  還有各種寄生變形的地方

  最想看到的這兩個地方算都有看到


  另外就是

  那群去51區觀光的家庭感覺有點多餘

  我表情大概跟艾迪在車上時差不多

  不太懂硬要插這個旅行團用意是啥

  但猛毒感覺很開心就讓他過


  跟太太的最後一舞也看不是很明白

  但猛毒感覺很開心就讓他過


  還有就是最後收得有點太急、偏草率

  可以理解當初本來就是這部要收

  但感覺還有不少地方能發揮有點可惜


  然後回憶跑馬燈配BGM知道想賣什麼

  也看得出來艾迪像喪偶一樣感傷

  不知道是不是第二集的緣故，沒有想像中感動


  最後就是很多人提到的片尾彩蛋

  我也不太喜歡把彩蛋2插在名單後


  跟太太的部分有情懷就算了

  不過如果旅行團拿掉把篇幅拿來描述後面收的很急的其他東西的話，可能會給好雷


  PS : 追擊共生體的絞肉機超像打不死的小強，尤其是跟著爬進51區的基地那邊產生了既視

  感......


  --

  比起旅行團我也更不喜歡他，他的內容都讓我感覺很煩躁

  不過旅行團真的讓我覺得可以拿掉

  但猛毒感覺很開心就算了'
