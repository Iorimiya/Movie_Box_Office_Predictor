title: '[好無雷] 猛毒最終章：最後一舞'
content: '看過第一集，沒看過第二集


  這次第三集來美麗華杜比廳看

  音響有明顯的升級，螢幕品質清晰銳利且明亮

  不過在看的時候會有標準廳的既視感（因為就是從標準廳升級的）


  杜比廳整體體驗蠻好的


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*

  第三集比第一集明亮許多，看的很舒服


  動作細節清楚，部分動作場景節奏稍快，讓人有點意猶未盡


  節奏不會讓人想睡覺


  是部不錯的爆米花電影


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*

  喔對 還有拿到海報和十二生肖卡





  拿到兩張蛇…

  -----

  Sent from JPTT on my iPhone


  --'
