url: https://www.ptt.cc/bbs/movie/M.1498053789.A.AFD.html
title: 'Re: [負雷]超越聶隱娘的爛悶片--潛行者(Stalker)'
content: '去年租了伊凡的少年時代

  開場一個匪夷所思的旋轉鏡頭就震懾住了我

  裡面有好多用氛圍跟詩意在敘事的鏡頭

  飛天鏡頭、坑裡接吻、馬跟蘋果、伊凡跟妹妹賽跑

  我就下定決心塔可夫斯基的電影我都要在電影院看修復版

  也剛好誠品電影院上半年有他的電影

  看了飛向太空、鏡子、潛行者

  可能我在看這些作品前就有預設期待

  想看到塔導怎麼用獨有的詩意敘事去幫助故事

  但沒有的情況下我看得很煩躁


  這三部都有很多藉由對白的辯證

  想請喜歡這幾部的版友分享下

  你們是從什麼角度去欣賞呢


  不過我喜歡飛向太空、鏡子兩部的結尾

  能感受到很迷人的氛圍

  自己私心希望整部都能有這樣的風格啦


  --

  who the fuck is da kai

  好打動靈魂的回顧預告!飛向太空我最愛他往屋裡看跟向父親跪的鏡頭

  雕刻時光我有看,應該再版的,封面綠得很恐怖...

  印象書中他沒有非常攤開私人的情感,痛苦、恐懼、渴望 等等 沒有挖得太深

  潛行者哪部分最打動你?

  你說Criterion嗎 他封面都好美

  推你分享!

  對我來說電影分三類 一是轉到已經看過很多次的電影，但還是會不由自主的看完 裡面有

  經典的場面調度、電影感的台詞、讓人醉心的原創配樂、印象深刻的角色

  二是多次重看後,或在電影老師(聞天祥、田開良)的講解下會更喜歡

  如李安、楊德昌、小津安二郎、奇士勞斯基

  三則是我一直想更理解的。可稱作美學突破或辯證的藝術電影吧，塔可夫斯基的作品我看

  的時候常想，這樣的美感、訊息需要藉由兩個多小時的藝術形式嗎?如果作品本身沒辦法

  直覺地打開我眼界，同樣的時間或許好好生活，去歡笑去愛去體驗更值得些

  但我還在一個想被這樣的作品打動的階段哈哈


  海尼根尖叫!'
