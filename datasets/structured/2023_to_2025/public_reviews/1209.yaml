url: https://www.ptt.cc/bbs/movie/M.1708154269.A.EFF.html
title: '[負雷] 潛行，想學無間道跟門徒的失敗之作'
content: '防雷



  劉德華在2023~2024年一堆片子啊



  莫斯科行動、金手指、潛行、紅毯先生


  但都無法發揮或是看到劉德華的演技就是了








  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  潛行很明顯的就是想致敬當年的無間道，裡面有幾句台詞


  根本就是無間道搬過來的，或是說改寫一下而已



  一進正片，一看就知道毒梟就是個替死鬼，假冒老闆的


  背後的老闆就是從容不迫，陪太太產檢的劉德華


  是說，完全不弄點懸疑嗎？一下就讓觀眾知道老闆就是劉德華



  再來就是正派與反派的Boss，還有臥底


  彭于晏在本片就是一臉又帥又痞的網路毒品調查科警官


  要帥要痞也可以，但彭在本片就是耍帥，沒有演技


  連任達華沒幾句台詞的，都比不過


  更別提門徒又帥又痞的吳彥祖了，吳彥祖在門徒的演技十分自然


  這樣比，又似乎有點不公平，因為角色的刻畫沒辦法，發揮彭的演技



  林家棟一如繼往的好演技，但跟門徒的吳彥祖相比


  沒辦法跟吳彥祖在門徒最後所說的，到底是毒品恐怖還是空虛更恐怖


  那種正邪混淆的灰色地帶，質問自己


  反而有種在「風暴」那種角色一樣，我就是臥底，我想做好人，這樣才對得起妻兒



  劉德華在本片實在很奇怪


  感覺就是為了要當壞人而壞人的感覺


  你們殺了我妻女，你們能奈我何？我就是要報復！！！


  如果跟門徒對比，尤其是廁所割腕自殺那段對白的演技


  這片的劉德華根本沒有門徒的1/3



  也許，潛行的劇本張力，完全比不上無間道跟門徒了












  --'
