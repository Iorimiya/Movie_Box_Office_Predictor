  看到劉德華演反派就可以先猜到一定是邪不勝正的結局了。再來華仔的反派律師，只有著

  重在壞和冷血的朔造，少了一股奸詐感，除了很愛老婆很愛家之外，其它就是很平凡的反

  派，甚至連律師身份的這個設定好像拿掉對劇情也沒啥影響。


  劇本可能一開始想寫的支線格局太大，導致收線不好，草草帶過收場。


