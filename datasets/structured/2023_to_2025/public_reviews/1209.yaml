url: https://www.ptt.cc/bbs/movie/M.1705753359.A.E14.html
title: '[討論] 中等、潛行、小吐嘈，含雷'
content: '劉德華真是被好人耽誤


  其實他太適合演壞人了


  而且他演壞人，大家也習慣，就是拍戲


  不會造成負面形象



  這部戲呢，就是看演員的演技帥


  本質上就是無腦片


  完全沒有什麼深度劇情


  我旁邊的阿姨，看到最後還哭了，


  實在是偶像之作


  不得不說看華叔還是很帥


  最可惜的是彭于晏了，


  那個髮型沒有加分，由於他粵語爛，


  聽的出是配音，


  阿我就很熟悉香港演員的聲音


  忽然彭于晏一開口，我就知道是配音，


  有點出戲



  就是爽，就是無腦，帶雌性去看就好了



  以下防雷

  ...

  ，

  ，

  ，

  ，

  ，

  ，

  ，

  ，

  ，

  肥雪預告花片比正戲還多戲份


  胖就胖坐電梯嘛，自己幾斤重，跑步能比較快嗎




  不知道3小，劇情轉的很硬

  硬要一個轉折點


  貨又莫名奇妙不給人家


  阿一堆香港警察,跑去馬來西亞開槍是怎麼回事



  而且人家毒販槍戰，你等補尾刀就好了啊

  叫兄弟摻和什麼


  說開就開，完全不給馬來西亞面子



  警察的臥底檔案，就不能放在一個不聯網的系統嗎，老是要搞得這麼廉價



  尾局開戰了，就已經綁架帶槍了


  還堅持要什麼證據，

  他帶槍綁架，罪就輕嗎？


  最後車子遇到地刺，還能開，我認了，

  人家什麼豪車，爆個胎還可以開，可以



  但是豪車一拐，臥底就飛出去了，是哪招？門那個爛？


  還有臥底不是飛出去了嗎？


  怎麼好像說他死了，是怎麼回事？？


  反正，就是演技佔80，槍戰10劇情10










  --'
