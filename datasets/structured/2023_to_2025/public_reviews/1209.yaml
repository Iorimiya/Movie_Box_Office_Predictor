url: https://www.ptt.cc/bbs/movie/M.1705674843.A.DE5.html
title: '[好雷] 《潛行》三大男主的對戲，好看'
content: '看到預告片就一直很想看的一部

  給這篇一個好雷 簡單分享我的看法 以下有雷慎入


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  其實整部電影的看點有很多

  包括飛車追逐、雨林槍戰、近身肉搏

  算是一部新年商業大片，卡司也很強

  應該不少人是衝著演員去看的

  當爽片看也是不錯的選擇


  但如果要細看的話

  最觸動我心的絕對是劉、彭、林的對手戲


  彭于晏比較可惜一點，能表現的地方沒有很多

  但有一幕很精采的打戲，我覺得非常讚，打起來很有肌肉炸裂的紮實感


  林家棟的亮點就很多了

  尤其是被抓進監獄中，他老婆的那一下乾淨爽脆的巴掌

  打出了我對老演員的敬佩

  其實我原本對林家棟不算太熟悉

  但他這部的演技又讓我更喜歡了


  劉林之間，兩個人亦敵亦友的關係真的很刺激

  最後林在車上坦白一切的這幕戲，應該是電影最有看頭的部份

  華仔崩潰的這一段，我記得FB上有花絮，我就看了好幾次，真的讚

  華仔能演到連嘴唇都在顫抖，不得不說，影帝


  這部片除了彭以外，劉、林都各有家人愛人

  但我覺得感情戲之外，兄弟感情的刻畫更細膩，更有看頭


  再提一個

  華仔在監獄被抓，彭勸服他的時候

  那一個眼神轉換：「有證據就抓我啊」也真的超帥


  總之雖然不到神作，但我覺得還不錯

  就算沒有很喜歡劇情，對警匪片興致不高

  單欣賞演員們的演技也算是值回票價了



  --'
