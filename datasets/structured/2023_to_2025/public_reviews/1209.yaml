title: 負雷 潛行 有夠難看
content: '盡量無雷分享


  有 夠 難 看

  難看等級第四台上都不要花時間看的等級


  劇本不知道在寫什麼鳥 野心很大最後淪為貪心 什麼都想講 什麼都很爛

  主要角色關鍵心裡轉折琢磨過少 看到只覺得WTF

  不知道是致敬還是怎樣 幾度想到無間道

  但是這部跟無間道相比實在太羞辱無間道


  剪輯突兀不順暢 到底是回憶還是幻想

  攝影常常有莫名其妙以為留梗的鏡頭 完全故弄玄虛

  特效 跟我想像中的一樣爛 不對再更爛一點 好萊塢電影台等級


  演員演技落差過大 對戲火花出不來

  劉德華、林家棟演技在線 諷刺的是他們演越好就越襯托這部電影的難看 我希望他們只用40%演技就夠這部電影


  觀影途中去了趟廁所 第一次不急不徐不想趕回影廳 想說大概快演完了還是進去 淦 怎麼還那麼長 後面完全狗尾續貂 根本凌遲


  有 夠 難 看


  本來不想發文的 但是竟然看到有好雷

  覺得自己不分享這部負雷 根本道德罪人

  能救一個人就多救一個人


  最後劉德華要負很大責任 這部是他監製的

  靠劉德華名聲衝票房  整部電影根本浪費世界資源 消耗粉絲對劉德華的熱情 甚怒


  -----

  Sent from JPTT on my Sony XQ-DQ72.


  --'
