title: '[好雷] 鋼鐵雨：深潛行動'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n鋼鐵雨：深潛行動\n\n以下閒聊：\n\
  \n昨天就在搜尋了台中某影城的上映片單後，\n該影城很多人都往ATOMS那廳去看南韓另一部強片的同時，\n我選擇一條人少的路，同樣是南韓的電影，\n果然，人很少，又是平日晚上更少，\n\
  看完後，聽到走出來的人都說，很好看耶，\n爽，選片的眼光還是準 XD\n\n\n\n以下正文：\n\n片中人物刻劃：\n\n美國總統，囂張跋扈無理，簡單說就是行為很沒水準，\n\
  指涉何人就很清楚了，而且是那位要讓美國再偉大的誇張版。\n但是，看完再仔細去想，這美國總統其實不笨喔！\n\n南韓總統，政治菁英，應對品穩得體，雖已中年的帥大叔，\n\
  美國曾經有柯林頓，我們有馬英九，這樣的風格，\n畢竟是南韓拍的，總統找這樣的，很合理吧！\n\n北韓委員長：\n天啊！花美男，帥氣中帶點邪氣，受過西方教育，英文流利，\n\
  點起菸來，真的有帥，跟南韓總統可以是CP(誤)。\n一直想抽菸，被美國總統阻擋，那不爽的表情真的好笑。\n\n\n\n我是從故事進入青瓦台時，當國安局長跟總統在報告近日\n\
  有關釣魚台列嶼演習等事項時，開始追台灣翻譯的中文字幕，\n信息量真的有點多，但是大概在五分鐘後，就進入狀況了，\n\n\n片中利用這三位人物的行為，也恰巧隱喻了美朝韓三國的互動方式，\n\
  \n美國總統可以邊上廁所跟南韓總統談話，南韓總統一直跟在旁邊，\n中間還夾了一位有點神經質的女翻譯官，有點顆顆XD\n\n為了美朝達成會談，南韓總統從中安撫兩方領導的情緒，\n\
  希望兩國和平統一，南韓可以說是做到卑躬屈膝程度了！\n\n北韓委員長，表面有權，其實有很多事情是他無法做成的，\n如何平衡國內鷹派與鴿派的矛盾，會談時一直向美國總統表達他對於\n\
  解除核武可以在檢查前，先完成合約協約簽署再運送，美國總統不聽，\n希望馬上運送到美國，之後就會跟北韓正式交往，協助北韓發展經濟，\n美國總統在會談中還一直對北韓領導咒罵，極端無禮，\n\
  這行為不就是現時兩國互相的態度投射嗎？\n\n至於南韓總統，為了達成在元山的會談，可以說是忍讓與協調，\n最後連被綁架後，潛艦逃生艙還讓給這兩位會談主角，\n\
  只希望和平協議完成，夠偉大了吧！大韓民國\n\n劇情到了三位領到被綁架到潛艦後，就是另一部電影了！\n觀看的同時，腦中一直浮現\"獵殺紅色十月\"這六個字，\n\
  \n不論是潛艦開到海溝，投放魚雷誘餌，魚雷在水中爆炸的景象，\n以及申正根扮演的副艦長，非常的精采，看他下口令的方式，\n\n都讓我想到 馬克‧雷明斯 這位紅色十月號的艦長角色，\n\
  \n海底的潛艇追逐場景，我腦帶都一直回想獵殺紅色十月，\n包含最後到了南韓海域後，潛艦浮上來，鄭雨盛與申正根兩人在潛艇上\n看著海岸的場景，都有像這部片致敬的意思，\n\
  \n其他像是潛艦內的槍戰，廚房起火，導彈室內的槍戰，都很有熟悉的感覺。\n\n不是說這部片抄襲，反而是有這些方面的元素，透過不同導演的詮釋，\n有了新的感覺，看了很令人興奮，好久沒有那麼棒的潛艦電影了！\n\
  \n當然，導演可能有參考各種潛艦資料，我猜想應該有獵殺紅色十月，\n融合吸收成為拍片的材料，拍出這部新的潛艦獵殺電影，\n\n真的是很令人覺得羨慕，南韓能有這樣的影片拍成，真的很不容易。\n\
  還有南韓海軍的協助，才能由如此完整的真實呈現。\n\n由於這片子是去年在疫情爆發前拍完的，全世界可能也沒想到，\n在這數個月中，國際情勢又大大不同了，電影結尾預測一個美好的未來，\n\
  就像片中總統問大家的，大家有想要OO嗎？\n\n\n總之，這片完全是給大眾看的，沒有很深奧，\n真的不需要特別了解國際情勢，看了就懂了！\n\n如果有常在看國際新聞的朋友，會有更深層的享受與回響。\n\
  \n值得投資兩小時看看這部片。\n\n--\n \"Grandpa,were you a hero in the war?\"\n\n \"Grandpa said,\"\
  No...\n\n \"but i severd in the company of heroes.\"\n                         \
  \                   Dick  Winters\n\n--\n已修正，北韓希望先與美國建交比較穩，再運送。\n已修正"
