title: '[好雷] 鋼鐵雨2 深潛行動'
content: '防雷









  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~







  如果不是看到很多人大推這部片

  這個片名完全不會吸引我進場

  雖然片名是鋼鐵雨2

  不過除了導演及男主角是一樣的人主演之外

  與第一集沒有任何連貫

  不用擔心連接不上的問題

  就是兩部不相干的電影


  前2～30分鐘我覺得有點難熬

  講述了不少政治的話題

  因為本來就不了解東亞政治

  加上台詞又很多很快

  有種一團混亂又不知道到底實際上發生了什麼事的茫然感


  不過後面就漸入佳境

  不管是緊張感的營造和場景的打造

  完全和好萊塢可以平起平坐 (除了海底特效比較不真實)

  很多亞洲片每次一到大場景都會有破綻百出的廉價感讓人很出戲

  但這部沒有這種問題

  演員的表現也很棒

  很明顯地 美國總統和北韓領導人是在暗喻川普和金正恩

  台詞或人設應該都有參考本人

  比對現實世界緊張又正經八百的政治中帶來一點黑色幽默

  導演也算很敢觸碰政治議題

  不過找了一個這麼帥的鮮肉演金正恩合理嗎


  最後跑字幕時南韓總統演說的眼神很有力道又誠懇

  就算不是南韓人 也能感受到演說的震撼

  台灣人完全能體會統獨問題的複雜和矛盾


  不得不佩服韓國電影

  扣除偶爾有些莫名其妙的片

  這幾年看了好幾部韓國片都完全不輸好萊塢

  反觀國片真的加油好嗎


  --'
