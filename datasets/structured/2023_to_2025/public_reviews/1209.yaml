url: https://www.ptt.cc/bbs/movie/M.1706362923.A.A07.html
title: '[好雷]《潛行》最大感想-帥'
content: '雷文防雷資訊頁


  我膚淺，看《潛行》完全是因為彭于晏加上華仔

  其實家棟哥眼神也很有魅力，只是不是我的菜(抱歉了><)

  先來個彭的帥照防雷一下！












  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  聊聊本片我自己的幾個點：


  1.彭于晏就算對罪犯也不忘做人根本的善念


  即使面對毒販，他還是不忘保持基本的善良

  特別是華仔孩子早產那段，彭于晏幫他申請視訊探望，超級暖心的

  雖然不確定這是不是警方常規手段

  華仔後來的翻臉，我也是笑了，真是霸氣十足：“有證據就來抓我啊！”


  2.劉德華，那個狠心角色，為了目的不擇手段，雖然壞還是帥

  雖然華仔看的出來有點偶包，沒有撩下去完全扮壞，沒有太多喪心病狂的病態表現

  不過好幾個壞壞的眼神和表情，我依然有GET到


  3.林家棟演技超神

  第一次看他演戲，覺得演技太神了

  後來好多朋友說我才知道，原來他演過這麼多電影!!

  在正邪之間游走，既是華仔的朋友又有著警匪的糾葛

  把兩身份間內心掙扎的心境呈現的很傳神


  『辭職幹嘛要理由！？』 ←– 這句一定要學起來，回公司跟老闆說(X)


  4.打鬥、爆破和飛車場面 帥

  打鬥：尤其是彭于晏對上反派傭兵的那段，拳拳到肉，帥氣爆表！

  唯一遺憾=彭怎麼沒有打到衣服爆開秀出大肌肌


  飛車場面雖然輪胎被打爆還能飛車有點誇張（勞斯萊斯的威力？哈哈）



  劇情真的有點快，但氣氛營造很OK，結合了親情、友情和警匪的多重元素

  彭于晏、劉德華、林家棟的表現我都覺得有超過預期

  畢竟華仔已經滿多部其實只是串串場，沒有太多發揮的機會


  還有任達華完美詮釋了那種上層人物把事情都交給阿弟仔去做的態度，哈哈！


  總之，我自己是覺得還不錯


  --

  你能奈我何！！！！！'
