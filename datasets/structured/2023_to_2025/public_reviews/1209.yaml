url: https://www.ptt.cc/bbs/movie/M.1597138687.A.922.html
title: '[好雷] 鋼鐵雨2 深潛行動'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  老實說一開始看到這片名

  較難引起人家注意和興趣

  看過預告後也覺得還好

  後來是聽朋友推薦去看

  還好沒錯過


  雖然前半段對話場景轉換很快

  但短時間內能讓觀眾對於整部戲的時代背景和人物架構有基本的認知

  美國、日本、北韓、南韓、中國各國都有各自的謀算和利益考量

  其實連台灣國內都有不同政黨派系勾心鬥角

  何況放大到國與國之間

  敵人的敵人就是朋友


  1.北韓總統想放棄核武和談卻引起黷武派將軍的政變

  2.美國總統想留名青史一樣得顧慮民眾和反對派的意見

  3.最為弱勢的南韓像是大國間角力的籌碼沒有太多講話餘地


  前面主要圍繞在三個領導人的爭論演出

  後半段的魚雷攻防戰為劇情掀起高潮


  看完比較讓人疑問的是由北韓護衛總局局長帶領的軍事叛變

  看起來已取得多數軍隊聽令其指揮

  但在最關鍵的核子淺艦上卻無法完全掌握

  為何沒有一上船就先行勸降納編潛艦上的所有人

  僅靠少數人持槍脅迫不明就裡的船員

  當然這樣也給了潛艦裡其他人伺機反撲的機會

  導致在危急時不得不聽令原先的船員而失敗


  --

  有人覺得郭度沅很像呂捷嗎XDD


  --

  我看完這集才知道有第一集，應該沒太大關聯，可以當作獨立電影看了'
