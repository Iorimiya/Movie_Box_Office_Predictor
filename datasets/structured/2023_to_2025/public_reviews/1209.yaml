url: https://www.ptt.cc/bbs/movie/M.1497970941.A.2EC.html
title: '[負雷]超越聶隱娘的爛悶片--潛行者(Stalker)'
content: '因為意外看到網路上的推薦，


  就去看了一部曾獲譽為經典的俄國老片:潛行者(Stalker)




  他X的浪費了我2小時40分鐘的時間


  本來以為很難再遇到超越刺客聶隱娘的悶片了


  結果這部超越了聶隱娘


  因為聶隱娘只有2小時


  但是這部2小40分鐘，害我浪費更多時間，


  而且還更悶



  劇情懶得多談了


  一般認為是哲學性


  但是實質哲學性內容可能1000字以內的文章就說完了


  電影中剩下的是毫無意義、冗長、沒有執行剪接程序的又長又臭又慢鏡頭。


  當然裡面似乎有不少象徵元素，


  但我幾乎都看不懂，


  狗、白骨、打雷下雨、結局的念力、坦克...


  很多，


  但是我看不懂，


  對我來說跟擺一堆拉基真的沒啥差別





  如果有像我一樣不小心物色到此片的人


  奉勸三思  不要浪費寶貴兩個多小時






  --

  我已經說對我來說拉 不過如果大大知道那些符號象徵甚麼的話，我是洗耳恭聽'
