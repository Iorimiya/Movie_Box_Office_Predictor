url: https://www.ptt.cc/bbs/movie/M.1596391801.A.4DB.html
title: '[好雷] 鋼鐵雨：深潛行動'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n   看完這部片\
  \ 果然是好雷  因為看到好多的魚雷\n\n\n   言歸正傳  這部片是一部政治狂想曲 plus  潛艦攻防的片\n\n\n   其實劇本也很單純  前半段說政治\
  \  後半段就是滿滿的潛艦攻防\n\n   雖然說  政治方面是編出來的事件  但背景的歷史卻是真實的\n\n   然而每個政治人物的個性表現  都對應到真實的人物\n\
  \n   這樣的戲謔手法  對有在長期關心國際政局的人來說  會令人會心一笑\n\n   這部片由於是南韓拍的  所以他把南韓的立場弄的很清楚\n\n\n  \
  \ 1. 南韓在中美之間 是中立的  但由於美國的關係  必需被動參加美國的國際軍演\n\n   2. 南北韓目標大致是統一  只是近期無法達成  要長期磨合\n\
  \n   3. 南韓與日本之間其實沒什太多利益衝突 唯一就是獨島爭議\n\n      而這爭議是美國以前的一個備忘錄造成的\n\n   4. 美國與北韓的談判\
  \  南韓的參與只是兩國之間的勸架者的角色\n\n      但兩國談判  南韓也無法迴避\n\n\n  前半段大致上劇情就是圍繞這幾點打轉\n\n\n  到後半段\
  \  劇情就驟變   變成潛艦攻防   這部片最大的成本就是在後半段\n\n  這部片的潛艦攻防  我敢說 完全就是好萊屋的水準  完全沒破碇\n\n  他很多戰略的東西\
  \  常用第三人視角  很清楚可以理解戰略\n\n  後製特效  又逼真又好看  再加上電影院中暗黑的場景  緊張時刻會令人窒息\n\n  相較於近期看的潛艦獵殺令\
  \  遠期的獵殺紅色十月  K19\n\n   我認為這部片有過之而不無及\n\n  當然  以純軍事迷角度來看  這部片需要撐過前半段無聊期  可能覺得劇情不太滿\n\
  \n  但後半段的潛艦攻防  真的值回票價  尤其跟近期的屍速2比 他的特效又更進一階\n\n\n   看完後  覺得幹  南韓電影工業實在太強大了   嘆為觀止\
  \   軍事迷絕對不要錯過\n\n\n\n\n\n\n--"
