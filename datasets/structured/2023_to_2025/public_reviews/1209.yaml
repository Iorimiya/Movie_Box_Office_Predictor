title: '[負雷] 潛行'
content: '華仔目前有兩部片在線上

  金手指跟潛行

  潛行真的爛，相比起來金手指好太多

  這部片剪接很有問題

  一堆快速換場

  想用畫面當敘事帶過

  但也切的有夠快還搞不清楚就又切回演員本身

  講沒幾句話又斷了換場景

  好好講個故事很難嗎

  彭于晏幾乎一號表情，粵語配音很令人出戲

  林家棟也差不多都是一副衰臉

  華仔有表現出陰險感

  後面還有崩潰演出

  難得看他演自私純惡角色（這是最大亮點）

  很多片段會想到華仔以前電影

  像臥底說我是警察、結婚槍戰但換成新娘躺新郎懷裡（天若有情！？）

  後面還有動畫嬰兒

  這做的挺像的

  像到只要出現就有人在問是真是假

  但整部真的很難入戲

  觀眾都覺得無聊

  像是今天在台北京站威秀下午1:05場坐最後一排5、6號位置的男女

  開場就在吃便當吃完還記得把湯喝完

  飽了後女方就開始滑手機

  一下停一下滑後半段大概看不懂華仔要不要變好人，幹脆就認真滑手機好了

  就已經夠出戲了！整排人還要一直被你放閃

  而且害我開場聞到便當味就一直餓到結束…


  -----

  Sent from JPTT on my iPhone


  --'
