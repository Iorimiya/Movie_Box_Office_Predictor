url: https://www.ptt.cc/bbs/movie/M.1705319446.A.80C.html
title: '[新聞] 劉德華《潛行》婚禮變戰場！狂風暴雨拍'
content: '劉德華（右）和劉雅瑟在《潛行》結婚變大戰。（華映提供）


  〔記者許世穎／綜合報導〕由「華仔」劉德華監製主演的電影《潛行》上演不少火爆動作場

  面，一場重頭槍戰就發生在劉德華扮演的反派和太太在小島舉辦的浪漫婚禮上。這場動作戲

  一共花了12天晚上拍攝，製作嚴謹，場面浩大，當中更要面對惡劣天氣的挑戰，幸好團隊發

  揮強大的合作力量，終於順利完成拍攝。


  片中華仔扮演的反派律師非常疼愛妻子，兩人在馬來西亞的刀曼島舉行盛大婚宴，但因為律

  師不擇手段的販毒手法，得罪國際級仇家，惹來一場僱傭兵團的追殺，在婚禮上瘋狂掃攝開

  槍追殺他，警方也到場圍補他，引發了一場混亂刺激的槍戰。為了呈現這場浪漫婚禮，劇組

  花了不少人力物力搭建場面，但一轉眼，宴會便成了戰場，所有婚宴的擺設都被個稀爛。



  林家棟（左起）、劉德華和劉雅瑟在《潛行》陷入緊張的槍戰戲。（華映提供）


  身兼監製的華仔非常看重這場動作戲，不時跟動作指導錢嘉樂細心研究每個鏡頭，每個演員

  走位到每個動作如何配合對白，他都有給予想法，而每次拍完華仔都會跟著導演看回放研究

  。團隊對製作相當嚴謹認真，單是一個現場爆炸鏡頭，就拍足三至四小時。


  有次華仔滿意OK後，林家棟就搞笑著說：「這回我有好好保護你喔！」而林家棟每次拍完槍

  戰後都不禁鬆一口氣，看到畫面滿意，都會開心手舞足蹈一番，「拍槍戰要配合好多事，配

  合鋼絲、爆破，還要安排武術演員的演出，演員要如何去配合，很不容易，但看到成果就知

  道都是值得的」。林家棟更慶幸這次是在海邊拍攝，相對空曠和涼爽，不然在市區街頭的巷

  戰，肯定更加辛苦。《潛行》將於19日在台上映。


  --‐------------‐----------------------‐-----------------‐---------


  好久沒看華仔的電影了，一直被廣告打到，預告片剪得還不錯

  希望不要精彩都在預告片裡了><


  尤其有看到幾個滿大的爆破場景，感覺有些場面戲

  我個人是很怕對話太多太燒腦的那種電影


  主要是比較少看到他演反派，尤其這部還有林家棟!!!

  預告片裡面的壞笑好邪，但我挺喜歡的


  是說華仔除了門徒之外 是不是真的滿少演反派？


  --'
