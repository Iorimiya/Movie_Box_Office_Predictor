title: '[新聞] 張家輝《贖夢》嚇人 香港開紅盤'
content: "張家輝《贖夢》嚇人 香港開紅盤\n\n11日將攜劉俊謙訪台催票\n\n04:10 2025/04/08 中國時報 杜欣穎\n\n\n張家輝（左）和劉俊謙日前以片中角色造型出席映後活動。（甲上娛樂提供）\n\
  \n金獎影帝張家輝最新自導自演年度恐怖片《贖夢》11日將在台上映，張家輝、劉俊謙也將\n於當天出席台北首映會造勢，並舉辦多場影人見面會。《贖夢》在香港上映以來票房持續\n\
  奪冠，累積票房直衝3500萬元台幣，後勢持續看漲，日前張家輝、劉俊謙勤跑戲院映後座\n談，陳慧琳驚喜現身力挺多年好友，瞬間逗得張家輝興奮大笑。\n\n張家輝在香港影人見面會一登場便秒入戲，化身片中被惡夢纏身的計程車司機「蔡辛強」\n\
  ，上演張家輝與蔡辛強的對話，精湛演技讓在場所有觀眾直呼賺到了。樂壇天后陳慧琳出\n席其中一場映後，呼應劇情自稱「精神病院捕快」，一身黑衣、黑帽與墨鏡登場，現場清\n\
  唱自己的經典歌曲〈失憶周末〉，讓張家輝、劉俊謙也跟著一起跳舞，全場氣氛超嗨。\n\n本片眾星雲集，袁富華這次飾演劉俊謙的爸爸，他提到，在正式拍戲前，事先與張家輝討\n\
  論劇本與角色，就連自身造型也費心打點，才能與劉俊謙撞擊出最完美的火花。被譽為香\n港「國民初戀」的許恩怡，也在片中與劉俊謙首度同台飆戲；許恩怡在片中的惡夢是看見\n\
  「滿臉是血的巨頭怪嬰」，並陷在血池裡與怪嬰對峙，許恩怡原本聽說是在血池上盪鞦韆\n的戲，以為很輕鬆，沒想到要表現出聲嘶力竭、痛苦的絕望感，「就像來一場決鬥，不停\n\
  來來回回拍了6、7個小時，起初覺得（巨嬰）很可愛，到最後很恨，過程感受很壓迫、逼\n真！」\n\n#出席 #香港 #血池 #片中 #陳慧琳\n\n--\n\n\
  \ 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
