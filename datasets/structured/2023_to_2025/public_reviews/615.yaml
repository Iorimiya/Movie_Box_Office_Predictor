title: '[情報] 《一部未完成的電影》台灣由好威映象代理'
content: '方才第61屆金馬獎公布提名


  金馬獎得主中國導演婁燁最新作品《一部未完成的電影》

  獲得三項提名 最佳影片、最佳導演、最佳剪輯


  而台灣片商 好威映象 也隨即公布了本片將由他們代理發行




  特別的是《一部未完成的電影》雖是中國片

  但出品方以及背後資金為新加坡及德國 所以不需要抽籤即能代理上映

  跟去年金馬獎最佳劇情片《石門》一樣


  --'
