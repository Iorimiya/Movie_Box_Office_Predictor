url: https://www.ptt.cc/bbs/movie/M.1735134541.A.F51.html
title: '[好雷] 《一部未完成的電影》 '
content: '本屆金馬影展最佳影片 導演 等 最大贏家

  據說在中國被禁播

  平日沒啥人的真善美，人還蠻多的


  看完做電梯還聽到有人說北京腔說疫情時怎樣怎樣







  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  之前在說一兩年前作品中看到在談「新冠疫情」已經沒人在意。是在講短暫的議題消費性

  會被反消費（時間久了就乏人問津）。



  自己對於電影的再現性（道德上）有所保留的，沒想到看著電影一下就進入了時光隧道。

  回顧2020過年前武漢肺炎在武漢爆發，在中國各地蔓延，各種記憶迎面而來，因為全家當

  時在青島過年，wifey當時還微燒，回台灣前，遭遇未來的不確定。（註）



  人人成了預言者，在電影中以為只是意外事件，還不知道新冠肺炎後來席捲全球持續兩年

  ，許多人往生，一些產業因此倒閉。但改變了人類社會嗎？外送產業發達，連自己確診不

  得不叫外送，回不去了。



  電影開頭的後設性，媒體考古敏感如我，時間膠囊不是埋在土裡那種old school ，而是

  十年前的電腦打開之後的軟體與介面，熟悉又陌生的「近過去」。始於禁忌的《春風沈醉

  夜晚》與疫情關聯是有些微弱，恐怕是指作者婁燁生命史創作史，維繫在善於掌握中國社

  會新脈動（而非本質性探索），時間脈動體現在劇本、鏡頭與場面調度的機動性。



  電影最終座落在民族性的雙面刃（如同嘲諷後來成為政協的賈樟柯遠離初衷，他說他始終

  關心中國人民，而非中國政權）：世俗面與民粹面，創作者「與民同在」的精彩：說對於

  世界失望的人同時看到街邊八卦故事的活力。



  說批判太沈重，民主化、庶民變動性，是不是沒有答案？有人說中國民主化會大亂之類。

  只有現實的一個中國，而非歐美民主體制下的中國，於是現況永遠都是唯一的答案。（如

  此唯物主義式的…）



  至於中國愛用臉的程度，愛開視訊，極度依賴手機（應該是說跟我有點相反，台灣路上看

  到移工也愛開視訊），一如在青島經商的父親的微信狂熱者，想到林冠名作品談的的影像

  氾濫，無關痛癢，何以留存在個人心中，抑或一點都不重要？見當代館「熱影像」展覽。

  （還剩最後四天！）



  （註）詳見筆者舊文《寫於十四天之前｜2020青島》




  --


  拉特飯 - 以商業力量進入獨立市場


  --'
