url: https://www.ptt.cc/bbs/movie/M.1736676532.A.E93.html
title: '[好無雷] 一部未完成的電影-最有感的疫情電影'
content: "那麼多以疫情為主題的電影裡，就這部拍得最好。\n\n電影用偽紀錄片的方式呈現，片中的導演打開塵封10年的主機，發現裡面有一部10年前還\n沒拍完的電影，導演懷著想完成它的執念，重新召集當年的拍攝團隊，然而十年後的大家\n\
  已經走向不同的人生軌道，要把他們拉回來已經不容易，接著又突如其來爆發了疫情，讓\n計劃再次陷入停滯，這部未完成的電影，是否能順利完成？\n\n原以為會圍繞著「如何完成拍攝」展開故事，但真正把情緒拉到電影中的，是後段的疫情\n\
  爆發，彷彿被拉回4年前人人自危的情境中。\n\n「沒想到一輩子會遇上這麼多事。」這句台詞道盡經歷過疫情的心情。\n\n被關在家裡好多天，生活的邊界感完全消失，工作和生活混在一起，每天的行程就是從床\n\
  走到書桌；從沒想過要被關在家裡好幾天，還看到有人用升降機在拿外送餐點；時刻追蹤\n確診者的移動路徑，開著口罩地圖到處搜刮口罩，那些記憶到現在想起來依然覺得不可思\n\
  議。\n\n在經歷過疫情的今天，世界已經變了好多，除了病毒本身在進化，對人類的影響也不斷在\n變種，不僅是生理上，更影響到我們的心理狀態，甚至是我們看待人生的態度也不同了。\n\
  今天的世界看似恢復正常，但我們真的好起來了嗎？這些後遺症大概是刻在我們這一代的\n基因裡了吧。\n\n另外很喜歡電影一開始導演和演員的討論：完成這部電影圖的是什麼？如果只是想完成給\n\
  自己的一個交代，那有需要拖其他人下水嗎？就算拍完也可能無法上映，那投入這麼多心\n力能獲得什麼？\n\n\n原文 \n\n--"
