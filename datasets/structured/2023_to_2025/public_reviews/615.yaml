url: https://www.ptt.cc/bbs/movie/M.1735134690.A.C4F.html
title: '[好雷]《一部未完成的電影》對「長大」的回首'
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  1.影片名稱：一部未完成的電影


  2.觀影時間：2024/12/22


  3.觀影地點：長春國賓


  4.觀影方式：自行購票


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  部落格圖文版：


  拿下最佳影片、導演的《一部未完成的電影》，很有可能也是一部大多數的台灣人，終其

  一生都無法真正看懂的電影。


  對我們而言，儘管同樣經歷過疫情隔離的孤寂、無助，這些狀態，總是看得到盡頭。而或

  許是透過手機，或許是隔著一道門，用不同的字句表達「願你安好，願我也安好」的期盼

  的我們，也始終不曾懷疑再見有時。


  婁燁將疫情年代，收斂進一部未完成電影的劇組。幸福的我們其實不容易真正共感那些看

  不見希望，內在不斷被消磨的日子，以及在集體創傷下，仍然試圖治癒彼此的可貴。


  但看著劇組中的每一個人，以至於真實的短影音裡，方艙醫院的群眾跟醫師用大概會被我

  們歸類為「抖音廢片」的方式互相表達安好。短暫的莞爾過後，隨之而來的是一股暖流自

  心頭流過。


  同時，電影並沒有刻意隱藏偽紀錄片的虛構性。然而劇組中對於要不要拍下去的不同考量

  ，封控後和家人再聚變得越來越像是奢望，那些害怕與脆弱的情緒，都是最真實的。


  比起以逃犯條例為背景的偽紀錄片《少年》，《一部未完成的電影》有著更多充滿生活感

  ，即便我們不能完全理解，仍能感受到其中力量的片段。


  面對這場打亂、甚至剝奪了許多人一生的大疫，電影不以挑釁自我定調。看到一段段解封

  、又封，直到徹底解封的疫情碎片，相信我們都會以自己的方法記住，或再次記住。


  「拍了也沒有人能看到。」


  從片中那部未完成的同志電影，到因為疫情而加上的大量素材，婁燁沒有選擇告訴我們應

  該如何，而是以這部就這麼不一樣了的電影輕輕提醒。


  「沒想到一輩子會經歷這麼多事情。」


  「未完成」的電影記錄著社會的高低跌宕，只要我們還在，電影便會一直都在。


  --


  部落格：

  FB：

  IG：


  --'
