url: https://www.ptt.cc/bbs/movie/M.1760516308.A.EA0.html
title: '[極好雷]一戰再戰  想幫導演平反一下 '
content: '第一次po電影心得，主要是因為這麼屌的電影在板上被砲那麼嚴重，還有人覺得是DEI政

  確片，替導演平反一下。

  以下一點心得，細節太多只能講記得的，只講劇情不講那些影評那些有講跟沒講一樣的專

  業詞藻和文縐縐的形容詞。


















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  個人覺得這部電影的主旨其實很直觀，導演想要給出的社會衝突解法和進步的方向不是極

  端左派聲稱的高尚理想，當然也不是片中右派菁英主義，而是最根本的人與人的信任和連

  結。


  黑極端左派的安排很明顯，黑人媽媽的口號喊得震天響，一副為自由拋頭顱灑熱血的樣子

  ，被抓了也是馬上變廖北仔，躺在病床上跟西恩潘求救的孬樣明顯就是要黑這些所謂的革

  命份子，她媽媽還自豪跟小李子說他不適合她，因為他們家是革命世家，流著高尚追求自

  由的血，劇情後面安排就是要打臉這些。片中也直接講了「到最後大家總是互相殘殺之類

  的」。


  黑極端右派的就不用講了，西恩潘代表的想往上爬到高階的樣子，為了擠進上層連逆向強

  姦精子強盜這種話都可以面不改色的講出來，還有既有上層的白人純血主義，劇情裡提到

  家族有一點混血就不能相信，幹過黑人屌就被染黑的這些對白安排等，這些都黑得很明顯

  不贅述。


  皮卡丘和師傅這兩個腳色個人覺得是導演用來提出他覺得真正解法的表達。


  先講皮卡丘，從最一開始的行動就安排得很好，一開始黑人媽媽跟他的對話就知道他並不

  了解整個活動細節，一般你要參加恐怖活動有被抓或掛掉的風險你會不要求知道所有計畫

  流程細節嗎? 但他就一個「我現在在哪裡，我是誰，我要做什麼」的樣子，透過這樣的劇

  情安排讓大家知道他不是所謂的死硬派理想革命分子，他只是追求刺激也好，追求潮流也

  好，追求有黑妹砲打也好，重點是他是一個「open-minded」的普通人，一個非扁平的角

  色，後面隱居十幾年後沒有從事革命活動以及忘記一堆暗語也是在補強這一點，這樣的人

  才是能造成改變的人。


  在劇情和對白安排上也有很多地方去強調這一點，比起挺著大肚子開槍依舊追求自由和理

  想的黑人老婆，皮卡丘有小孩後就自然產生當爸爸的責任感，意識到自己不能再冒險了，

  表現出自然的人性。


  在第一次和女兒的家裡相處對白寫的超屌，皮卡丘大概就是出去喝酒Happy了，但講了一

  個跟樂團朋友去搞器材的謊，為啥要撒謊還撒的這麼不自然? 因為他知道會被念，在這裡

  就表現他和女兒的關係不是傳統的威權，後來果然被念了，他忍不住回「靠邀你可以這樣

  跟你老杯說話嗎」又馬上改口道歉，說她甚麼都可以跟他說。這邊就是顯示他最重要的特

  質，也就是可以接受改變的「彈性」。


  因為他受左派自由思想影響，一定反對傳統父權威權，但事情發生了心裡又不爽覺得哪裡

  怪怪的，還是忍不住發自內心靠邀兩句。還有接下來女兒的朋友拜訪，雖然秉持著每個人

  都有個人選擇自由的左派信念，還是忍不住拉她朋友到一旁小聲威脅 (父親會擔心女兒的

  自然傳統反應)，看到變性的朋友也是逼著自己接受 (顯然在虛構時間架構中他的成長年

  代還沒有性別議題，跨種族已經是最大禁忌)，他也是關上門後念了一聲「怪胎」，以及

  片尾最後跟女兒學怎麼用手機。這些劇情都在表現導演想透過皮卡丘表達，真正的答案不

  是非黑和白的信條，而是需要成長、學習、理解、內心掙扎的過程。


  接下來講師傅。軍隊突襲師傅家過來那一段劇情寫的無懈可擊。


  這一段劇情用明顯的對比帶出導演想給的答案。怎麼說呢?

  先看看皮卡丘，敵人打過來火燒屁股了，第一件事情是給手機充電，然後被組織流於形式

  、沒有人性空間的暗語密碼卡到爆氣，還很幽默的安排說要跟「天鷹九號」(上級)通話，

  然後在那邊聽轉接音樂。


  這些都是故意安排荒謬感，為了要跟旁邊的師傅做對比的。比起這個惡名昭彰的老牌法國

  75號革命組織，有一堆密碼、規範、口號，然後真正有難的時候一點屁用都沒有，觀眾看

  到的是師傅從一進店了以後簡單的吩咐一個一個要做什麼，然後還有時間跟皮卡丘介紹住

  戶，還有時間簡單盥洗一下，十分鐘後房門一打開外面就排隊排的井然有序(我記得導演

  故意讓房門外排隊排的整整齊齊，為了表現出高度秩序)，讓大家都可以順利撤離。


  這個墨西哥老百姓社群的表現出的效率簡直比MI6還高，靠的是什麼? 「完全的信任」。

  試想如果你聽到現在有人跟你講阿共要打過來，叫你現在馬上走，你第一件事會做甚麼?

  一定是上網核實真假，問東問西，浪費一堆時間，最後死在原地，根本原因就是你不信任

  那個人。但在電影裡面，有看到任何一個人跟師傅含扣嗎? 如果有任何一個人問東問西，

  整體的撤離有辦法順利嗎? 師傅跟皮卡丘介紹住戶的導演的用意就是要讓觀眾知道，他們

  是很緊密的群體，誰的三叔公四姨婆大家都彼此認識，也彼此了解，沒有人會懷疑彼此，

  也沒有人講利益，大家都是無償幫助，所以當危機來臨的時候，一句指令大家就動起來，

  沒有電話或是高科技的輔助，直接最原始的一個人傳一個人，而在劇中這樣的連結讓他們

  順利渡過難關(順利撤離)。


  這樣的對比是很刻意的，真正表現一邊是從從容容游刃有餘，另一個是匆匆忙忙連滾帶爬

  。包含後面在醫院幫皮卡丘逃跑的櫃檯和護士也表現出他們社群的網路是很縝密的，看起

  來沒有組織沒有動員，靠的不是片中印地安傭兵的利益交換，而是人與人的互助和信任。


  另一個印象深刻的是當皮卡丘一直在電話中被問現在幾點的時候，師傅刷牙歪頭過來說8

  點15之類的，這邊也是很屌的巧思，因為革命組織的答案是「Time does not exist,

  yet it controls us」，比起這個虛無飄渺的高大上哲學口號，師傅的答案表示他們才是

  真正活在現實世界並解決問題的人，現在就是8點15，不需要那些狗屁理想思辨，他們才

  是實實在在的互助並活在現在的時間裡。個人覺得這才是導演想給大家的答案。


  最後一個想到的重點我覺得是那個會互相感應的呼叫器。


  這個呼叫器在片中的象徵很重要。可能代表的是科技(雖然不是高科技)。在女兒遇到香檳

  夫人以後，雖然因為老爸跟他講可以把性命交付給有呼叫器的人，但從她撒謊自己沒有手

  機這件事，就知道她並沒有完全信任香檳夫人，還是留了一個退路，也暗喻了真正能讓你

  信任，辨識的同伴的東西，既不是科技(劇中皮卡丘直接明說這鬼東西有時有用有時沒用)

  ，也不是暗語(代表共同的理想、目標、組織)，而是劇中最後女兒在眼睛看不清楚的時候

  皮卡丘走過來相認代表的東西。

  我忘了最後皮卡丘有沒有拿著呼叫器了，就算有也正代表這東西沒用，最後相認靠的不是

  這個，也不是暗語，反而我覺得如果皮卡丘正確講出暗語她女兒有可能會開槍，因為她一

  定知道她認識的老爸腦袋不可能那麼清楚，反而是沒有答出正確暗語，滿滿人性缺陷廢柴

  的樣子才是她全心相信的父親，真正能讓你信任的是這些共同的記憶和人性連結，是知道

  你最愛的是無毛墨西哥妹的革命情感。


  還有很多細節一時沒想到，但這部片個人覺得絕對不是宣揚什麼合理化暴力，左膠思想的

  片，實際上恰恰相反，是很有人性且正面的屌片。



  --'
