url: https://www.ptt.cc/bbs/movie/M.1759288848.A.7FD.html
title: '[好雷] 一戰再戰！超爽的原創片'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  衝著西恩潘和李奧納多去看了


  原本沒想到時間這麼長


  工作人員告知要加收20元


  才知道片長這麼長


  一開場劇情就很炸裂


  講到邊境講到移民講到槍彈講到軍人


  西恩潘的表演真的是變態到好看又好笑


  真的演的超「屌」


  完全沒看過劇情介紹


  就順著劇情發展，然後急轉直下


  沒想到李奧納多可以演窩囊廢演的這麽好


  喜歡潘尼西歐的，看完這齣也會愛上它


  劇情很有趣而且很瘋狂啊


  左派有夠討人厭


  右派的老白男也爛得好笑


  然後西恩潘在辦公室最後的表演


  真的經典的好笑，全場都笑翻


  看膩英雄片跟爽片的和恐怖片的


  這部超好看超推


  劇情浮誇緊湊，你完全猜不到下一步


  更不用提可以看到李奧納多這麼廢


  又有夠胖的，然後整集都很廢xdddd


  很久沒看到這麼有趣又猜不到劇情的片了


  完全不拖泥帶水又講到很多議題


  除了小朋友那段略顯無趣以外


  整場電影都很勁爆好看啊


  希望西恩潘可以拿一座最佳男配角



  -----

  Sent from JPTT on my iPhone


  --'
