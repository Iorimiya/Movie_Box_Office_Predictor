title: '[請益] 一戰再戰 幾個問題'
content: '終於去看了，看皮卡丘演技，

  還有滿多黑色幽默滿好笑適合連假看。

  如題：


  1.白色轎車賞金獵人把Bob女兒抓去給人肉集團，

  為何最後突然要救女兒拿槍去跟對方對幹?

  畢竟要救幹嘛不一開始載到女兒就把她救走，

  反而好像是最後突然想到什麼才回心轉意。

  這題其實我最疑惑，

  還懷疑是不是自己漏看什麼，

  賞金獵人這段前面劇情好像就有出現過但整個忘記哪個橋段，

  跟最後這段是不是有連結？

  完了，看來我也嗑多了...


  2.為何Bob老婆革命女當時會當抓耙子，

  我自己想到兩個原因但不確定是哪個，

  之一是她後來選擇保護自己的小孩展現母愛的一面，

  畢竟如果不跟上校利益交換她家就全毀了。

  之二是諷刺左派領袖嘴巴革命，

  但到關鍵關乎自身存亡時只顧自己...


  3.女兒最後到底有沒有跟Bob承認自己不是“親生”女兒？

  最後飛車重逢時女兒對著皮卡丘大喊“你到底是誰？”

  感覺就是直問你不是我父親那你到底是誰。

  但對Bob來說可能以為女兒只是遭遇一連串事故太驚慌？

  不確定是不是我漏看，鏡頭後面也沒帶到所以不知道到底有沒有說...

  承2題，這裡是不是也有點反諷左派女兒為了自己求生所以不跟Bob坦承親生問題？


  4.修女那段故意帶到女兒練習開槍跟格鬥訓練，

  以為修女們會跟特種軍拼個你死我回，

  結果是直接被抓，

  加上特種軍路上報資訊的肥宅說修女‘’吃素‘’，

  所以女兒練槍那段只是心中幻想麼？

  根本沒有那件事，

  只是譬喻她內心的成長？



  然後這部真得蠻好笑的，

  很謝謝同場後方幾個女生每次笑點都笑超大聲讓我可以放心跟著笑

  （我是沒有被打擾的感覺反而覺得這樣觀影氣氛滿歡愉的xdd），

  然後最後聖誕白人俱樂部那最後會長對上校說恭喜你入會時（在上校一陣奇葩理由後）我竟然笑了，

  不過其他人卻沒人笑，

  然後過幾秒到獨立辦公室我就猜上校準備領便當了很想笑，

  忍到吸毒氣葛屁我才笑，

  這時也只有聽到隔壁少數笑聲，

  我還一度懷疑自己是不是笑點有問題...


  最後得說，無毛墨西哥妞萬歲～～～



  -----

  Sent from JPTT on my Samsung SM-A5460.


  --'
