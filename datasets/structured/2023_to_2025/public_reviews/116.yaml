url: https://www.ptt.cc/bbs/movie/M.1758640605.A.A55.html
title: '[好雷] 一戰再戰觀後感 畫面緊張感十足'
content: '首先，本次觀影為特映會場次


  以下分享微微雷，請斟酌閱讀


  這部片我看完之後查了一下


  是改編自1990年代的外國小說


  確實整部電影很有那種味道


  畫面跟背景音樂給足緊張、壓迫的感覺


  就是“不出意外的話馬上就要出意外了”


  劇情也很緊湊，節奏掌控的不錯


  人物描寫的很豐滿


  你很清楚的知道他們的動機、關係


  劇情很難描述，我覺得只能說


  你如果讀過1990年代的外國小說


  基本上就是那種感覺了


  主觀評分：8/10


  鏡頭畫面真的一流，我現在還有點high


  那個緊張的情緒，給的太多太多


  如果是喜歡緊張刺激類的，極度推薦


  二刷指數：7.5/10


  上串流我會再看一次


  進電影院算是值得一看的


  尤其是後面的追逐戲


  大螢幕看的壓迫感，心臟快跳出來


  --'
