url: https://www.ptt.cc/bbs/movie/M.1758205706.A.32F.html
title: '[好雷] 一戰再戰'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  李奧納多在以《神鬼獵人》終於奪得奧斯卡最佳男主角後，只拍過四部長片：《從前，有

  個好萊塢》、Netflix的《千萬別抬頭》、《花月殺手》與《一戰再戰》。與《神鬼獵人

  》類似，李奧納多的角色在本片一樣是要拯救自己跨種族婚姻的孩子，不同的是，他不再

  一如既往扮演英雄，反而是受人幫助多過自己輸出的魯蛇，這也是這部黑色喜劇幽默的地

  方。



  作為一部黑色喜劇，李奧納多飾演的主角巴柏佛格森不是那種典型的英雄，什麼都會，人

  擋殺人，佛擋殺佛。早在革命時期，觀眾就能看到「街頭派特」雖說是彈藥高手，但並不

  像其他人一樣不怕死，擁有衝到前線的勇氣，更不用說在妻子成為抓耙子之後，他只想低

  調地好好把女兒養大。片中不少黑色幽默的笑料都來自巴柏的「廢」，像是他忘記「老地

  方」在哪，甚至連關鍵的通關密語都忘記，導致自己無法從組織成員口中得知地點，還有

  可能是16年後體力早已大不如前，跟著武術師傅的徒弟在屋頂上跑酷時，直接從12公尺高

  跌下，讓警察逮個正著。



  不過，巴柏沒有主角威能卻還執著地要找回女兒的心，反而更貼近觀影的一般人。披頭散

  髮又穿著邋遢的他，說是前反叛份子真的沒人信，但這樣的角色塑造卻能贏得觀眾的心。

  即便巴柏這麼廢，觀眾還是會打從心底為他加油打氣，希望巴柏最後真的能夠把女兒安全

  帶回家。這或許是李奧納多特有的銀幕魅力，但一路上都有貴人相助，且就像師傅所說，

  一天救出法國75成員兩次還真不是常有的事，再加上最後的山路飛車追逐，他連撿尾刀都

  稱不上，是女兒自己拯救自己，巴柏的幸運程度好比《花木蘭》裡的蟋蟀。



  片中的反叛組織叫做「法國75」，不論是直接以法國發明的一戰「M1897式75mm野戰炮」

  命名，還是其衍生出來的同名軍火系調酒，隱含的意義肯定都與這兩者一模一樣，都以快

  速且精準命中聞名，如同「法國75」的行動總是快速撂倒敵人一樣。電影前半段，大量送

  上「法國75」的行動過程，不但馬上滿足期待動作片的影迷，也為整部片設下基調：沒錯

  ，我們就是要這樣從頭瘋到尾！



  但是，隱藏在這樣相對暴力的情節底下的是「職業使命」、「愛」與「責任」。在電影大

  部分的時間裡，巴柏似乎都很廢，但在他仍是革命份子的時候，巴柏也是百分百為使命賭

  上一切，而成為單親父親之後，同樣全心全意為女兒付出。即使不是大家熟悉的銀幕上「

  地表最強老爸」，只要可以救女兒，他什麼都願意做。曾經同進退，共生死的夥伴，就算

  佩菲蒂亞出賣大家，當巴柏與女兒有難，大家還是義氣相挺。



  至於愛與責任，雖然很隱諱，但在佛格森一家表露無遺。16年來，巴柏的過去都沒有回來

  找他，讓女兒薇拉覺得爸爸總是疑神疑鬼，但相依為命的兩人感情還是很好，薇拉也很聽

  話，把相認的密語牢記在心，也乖乖把通訊器帶在身上，才得以為自己買到多一點時間，

  至少了解究竟發生什麼事。雖說在這場追逐戰中，她意外得知上校可能是自己的親生父親

  ，薇拉還是自信地大聲說「我已經有一個爸爸了，而且不是你。」即便佩菲蒂亞不光采地

  消失在親友身邊，巴柏始終相信，終有一天她會來敲自己的家門，與他們團聚。而佩菲蒂

  亞寫給夏琳的信，不僅說明她還是很愛女兒，片尾薇拉繼承母志也象徵為了理想必須「一

  戰再戰」。



  除了巴柏的佛系救女兒任務之外，《一戰再戰》也涵蓋不少社會議題，尤其是種族歧視。

  拉克爵上校窮盡一生都要想方設法加入的團體「聖誕節冒險者」，是個奉行白人至上主義

  ，甚至主張種族清洗的極右派組織。不管上校說真心愛過佩菲蒂亞是真是假，他最後死在

  自己朝思暮想的新辦公室變成的毒氣室，便是其崇尚納粹主義的反諷、反噬或像他所說的

  「反強暴」。這個團體的核心成員，即使聘僱具有印地安血統的線人為自己做事，都帶有

  懷疑，就連上校手下的兵也不例外，最後死在自己口中的「紅番佬」、「印地安佬」手中

  。



  相反地，巴柏與「法國75」代表的是極左派，他們從當年還積極行動時就主張自由邊界、

  自由移民，到薇拉這一輩則有非二元代名詞與跨性別意識，勇敢海狸教會更是一群種植大

  麻的修女，讓上校都訕笑此為對基督教的嘲諷。薇拉的師傅象徵的是拉丁族裔，他同時也

  是如同《偷書賊》裡的養父收留猶太遺孤一般照料大批非法拉丁移民的人物。就算不曾與

  「法國75」合作過，但這個組織的貢獻與知名度足以讓師傅願意為巴柏赴湯蹈火。



  雖然這些對抗、互助與戰爭都建立在各自的理想與相信上，但觀影後不禁讓人思考，現今

  的美國甚至是全球的政治局勢下，真的需要《一戰再戰》這樣一部電影嗎？尤其在右翼保

  守派的查理‧柯克不久前才因日趨嚴重的政治極化而遭槍擊身亡。



  沒有革命不流血，而「法國75」的成員也都做好最壞的準備，就連核心成員不得不隱姓埋

  名之後，組織還是默默地繼續開枝散葉，在巴柏被捕之後，也能受到來自同路人與師傅的

  協助。「法國75」的革命稱不上「和平」，他們開槍、轟炸政府機構、搶錢，他們只是不

  殺人且不傷及無辜，但這一切都在某次銀行搶案的過程中，由於一名不肯屈服的警衛而變

  調。當佩菲蒂亞鋌而走險，為了自保供出夥伴，加入證人保護計畫，而後逃離上校，兩面

  不是人的她注定走上不歸路，而且是身為反叛份子所能面臨的最慘景況。



  總的來說，《一戰再戰》絕對是2025年至今最好看的電影，長達161分鐘的片長，絲毫不

  冗長，全片不間斷的緊張刺激，以及各種唯有靠Vistavision才拍得出來的復古感與用攝

  影機實拍才得以呈現的效果，尤其最後的山路飛車追逐，巧妙地利用地形營造出懸疑感，

  甚至讓薇拉能夠製造出急煞陷阱，都讓本片足以稱得上是一部娛樂鉅作。可是，唯一在觀

  眾離開電影院後縈繞在腦海裡最貼近現實的嚴肅問題是：這部改編自1990年的後現代小說

  《葡萄園》的虛構電影，是否早已成為現代美國人的日常現實？


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
