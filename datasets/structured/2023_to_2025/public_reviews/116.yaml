title: 'Re: [超負雷] 一戰再戰 真的爛死'
content: '你說到重點了


  不論是支持 還是反對


  只要情節好起碼達到了宣揚的作用




  但這部電影恰恰反應出DEI最大的問題


  因為連這樣一部自己人拍來宣揚DEI意識形態的左派電影


  都可以讓DEI自我審查到情節詭異


  你要宣揚一種意識形態 好歹劇情 台詞也弄順暢一點


  讓觀眾覺得有帶入感才有用阿


  而不是弄成這樣七拼八湊 邏輯不通


  這是要怎麼宣揚意識形態阿~


  --'
