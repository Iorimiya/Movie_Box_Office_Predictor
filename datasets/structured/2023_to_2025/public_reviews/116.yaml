url: https://www.ptt.cc/bbs/movie/M.1758600930.A.53F.html
title: '[超好無雷] 一戰再戰 - 黑色幽默的政治寓言'
content: '昨天有幸參加在松仁威秀titan廳的「一戰再戰」特映場，看完真的太震撼激動了，到現

  在還是久久不能平復XD，絕對是明年奧斯卡的超大熱門～以下完全無雷，請放心服用。


  推薦原因與觀影建議：


  1. 本片不用看預告：

  因為看了預告你一定是整個黑人問號，但相信我，看完正片你一定超級驚喜


  2. 不要被片長嚇到：

  本片片長162分鐘，加上李奧納多主演，突然想起「花月殺手」的既視感，但是本片的劇

  情超級緊湊，步調也完全不沉悶，我自己觀影的時候居然連手錶都沒看一眼，真的是高潮

  迭起


  3. 動作攝影配樂超讚：

  本片的槍戰跟好幾場飛車追逐真的很刺激，你就聽到引擎的怒吼聲跟演員的喘氣聲，真的

  很過癮。另外搭配攝影因為是用VistaVision規格，所以畫面很讚，而且導演在拍追逐戲

  的運鏡，也常用空拍鏡頭跟不同角度，很有臨場的帶入感。音樂也是好好聽，完美製造緊

  張氣氛還有各種氛圍。


  4. 本片的笑點真的很多：

  雖然題材是屬於政治驚悚片，描寫左派與右派衝突，但是導演用了很多荒誕的諷刺手法，

  讓觀眾體驗高水準的黑色幽默，現場的觀眾笑聲真的蠻多～


  5.鈦合金級的卡司 ：

  （1）導演：PTA，看完真的佩服PTA，也只有他能駕馭這種非典型與反英雄的風格，明年

  該衝擊奧斯卡最佳導演了吧


  （2）李奧納多：很喜歡他在這部片的風格，完全放開自己，真的把角色詮釋的很完美，

  畢竟他一直說當初因為拍鐵達尼號，而錯過PTA很可惜，這次終於圓夢，感覺也會預訂是

  明年奧斯卡男主


  （3）西恩潘：薑還是老的熱，角色意外的充滿喜感，而且65歲還把身材練的很讚XD


  （4）班尼西歐岱托羅：看他演戲很舒服，本片展現的很從容不迫，一定都在他的運籌帷

  幄之中


  6.本片無彩蛋：

  有待到片尾確認沒有彩蛋，但有致敬已過世的工作人員還有拍攝現場聲音


  7.總結心得：

  絕對會想二刷，本片是上乘之作，而且也會是獎項大熱門，導演用黑色幽默卻能呈現最血

  淋淋的政治現實。上映的當下，美國正好也面臨更激化對立的兩極社會，像是剛發生的查

  理柯克槍擊案，保守與進步的衝突終究是無解，現實就跟電影一樣，真的是「一戰再戰」

  ～


  --

  有的話，當然看爆～攝影是VistaVision規格'
