url: https://www.ptt.cc/bbs/movie/M.1766209941.A.670.html
title: 【超負雷】大爛片 一戰再戰 已在 HBO 上架
content: '當初沒在電影院看因為預告片看起來就是大雷片


  最近看到 一戰再戰 被提名這麽多也獲獎

  開始有點興趣

  昨天晚上打開 HBO MAX看到居然上架了

  就開起來看看


  結果就是超級大爛片

  這種片也可以得獎和提名證明好萊塢沒救了


  ---


  我以為是什麼很好看的劇情片，結果是導演在自嗨的革命派對。


  本來抱期待李奧納多·狄卡皮歐穿著浴袍追車、西恩·潘軍服帥炸。


  結果呢？兩小時四十一分鐘下來，

  我只覺得自己像被綁在革命講座的椅子上，

  強迫聽一群老嬉皮在那邊「一戰再戰」地碎念政治寓言，

  偶爾夾雜幾場車禍級的動作場面當作喘息。


  首先，李奧納多這次演的鮑勃，

  簡直是「大Lebowski」遇上偏執狂大叔：

  整天抽大麻、綁男人頭髮、穿格子浴袍到處跑，

  邊跑邊忘記革命密語，電話那頭急得像便秘一樣吼叫。


  你都退隱16年了，還在那邊裝草木皆兵

  女兒薇拉（雀絲·茵菲妮蒂，新人演得倒是不錯）都比你堅韌獨立，你這爸當得也太廢了吧？


  父女情深？拜託，這根本是「老爸又在拖後腿」的家庭片啊！


  本片的笑點都很難笑

  就是李奧納多一貫的用力演技


  導演這次野心很大，想把小說塞進動作片，

  結果塞得太滿，政治諷刺、種族議題、移民邊境、意識形態衝突全丟進來，

  像一鍋大雜燴。


  動作場面也超爛，尤其是最後那段起伏公路追車，超平靜


  我家旁邊公園老人吵架都還比較精采


  中間那些「革命萬歲」的對白和荒謬喜劇，真的讓人想快轉。


  導演拍得這麼開心，這到底是驚悚片、喜劇片，還是政治宣傳片？


  爛番茄98%？我懷疑那些影評人是革命同路人，不然怎麼會覺得這「深度」到爆？


  總之，這片適合喜歡PTA自嗨風格的粉絲慢慢品味，


  邊看邊點頭「嗯，美國社會撕裂好嚴重」。


  -----

  Sent from JPTT on my Samsung SM-S9210.


  --'
