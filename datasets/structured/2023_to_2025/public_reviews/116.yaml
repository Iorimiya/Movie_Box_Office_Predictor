url: https://www.ptt.cc/bbs/movie/M.1758969588.A.BF1.html
title: '[負雷] 一戰再戰 合理化暴力抗議'
content: '如果對黑命貴群體還是少數群體反感

  這部可以不用看


  罪人還有點娛樂性

  俊男美女

  這部擺一堆沒用的少數群體在眼前

  完全不重要 對劇情完全沒幫助

  看了就噁心


  劇情超混沌

  笑點用一堆低俗色情笑話

  而且也不怎麼好笑


  娛樂度超低


  沒大場面沒什麼暴力血腥

  完全就是美國民主黨一小時半競選廣告好嗎？


  浪費李奧納多跟西恩賓

  噁噁噁


  比一屍到底還沒重點

  國片鬼才之道還比較有趣


  想看色色跟音樂去看鏈鋸人啦


  完全不用去大螢幕看

  等串流吧


  4/10


  老媽那個臉能吸引李奧納多跟西恩賓

  超沒說服力的


  -----

  Sent from  on my iPhone


  --

  我覺得比一屍到底前段無聊'
