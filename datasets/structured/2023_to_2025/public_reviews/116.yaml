url: https://www.ptt.cc/bbs/movie/M.1766851000.A.080.html
title: '[好雷] 一戰再戰最讓人敬佩的英雄'
content: '雷文防雷資訊頁









  逼雷~






  逼雷壓~









  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  個人覺得這是一部有政治社會意涵、腦洞有點開的片，


  前面黑人騷貨拿槍叫西恩潘硬起來那段，


  就開始掩不住笑意，


  這種情況還硬得起來，西恩潘不愧是真男人。


  搞半天原來西恩潘就是最愛這味。





  整體還算不錯看啦，不到極佳，但也不會太差。 個人給8分


  黑人騷貨身材是真的蠻好的，還算別有韻味。




  反正不管哪個膚色、種族，都有好人跟王八蛋啦，


  革命黨也有母狗和廖北仔啦，革命黨也有毒蟲酒鬼啦，


  3K黨更是一群失智變態老人啦。


  還是回歸到善良正直面啦，


  希望3K白人和騷貨黑女的後代，


  也能孕育出光明的下一代，


  明天會更好啦!


  本片宗旨大概這樣吧。




  但是話說回來，這片的角色裡，


  最讓人敬佩的應該是專門[處理人]的印地安大叔吧，


  我還是沒看很懂他為何突然決定奮不顧身救女兒，


  跟1776黨同歸於盡，太仗義了吧!


  因為是小女生，就覺得怎麼樣都不能視若無睹嗎?



  第二敬佩的則是跆拳道師傅，


  救了一狗票人，最後只是假裝成一個酒鬼就瀟灑脫身了。




  所以這部片的英雄排名是：



  1. 印地安大叔 (美國最早的主人)


  2. 墨西哥師父


  3. 善良白人但嗑藥喝酒


  4. 不出賣朋友的多元族群


  5. 出賣朋友兼淫蕩黑騷貨


  6. 3K渾蛋白人但還有一絲絲良知不敢親手殺女兒


  7. 3K低能渾蛋白人


  -----


  8. 未來的希望：渾蛋白人和騷貨女人後代，希望能出淤泥而不染。





  印地安大叔還是最帥的，不廢話，直接捨命救人。



  另外西恩潘這部真的練得蠻壯的，一方面神經機掰人，


  另一方面看到騷貨和3K老大那副口水都要滴下來的模樣，


  這部演最好的我覺得是他。





  --

  奧茲：你可以吃一堆香蕉！

  芬利：哦，我懂了，就因為我是一隻猴子，所以我一定要喜歡香蕉！

  奧茲：你不喜歡香蕉嗎？

  芬利：別傻了！ 我當然喜歡香蕉，我可是一隻猴子！我只是不喜歡你的推論方式。




  --'
