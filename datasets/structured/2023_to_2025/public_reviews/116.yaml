url: https://www.ptt.cc/bbs/movie/M.1759222573.A.E39.html
title: '[新聞] 瘋電影／一戰再戰　李奧納多重返革命為女'
content: '瘋電影／一戰再戰　李奧納多重返革命為女兒而戰



  文／賴賴


  為了李奧納多一定要來看看這是一部怎樣的電影，上了年紀的李奧納多，演技在線，不再

  是男一號的英雄男主，而是有了一個女兒的爸爸，慈愛的父親情感表達還是沒話說，真的

  以為他已經當爸爸了，劇情環繞在地下組織和政治黑暗面，說穿了，沒有一個是乾淨的，

  理想會變質，擁有權力者的大腦都長一樣，人不為己天誅地滅。


  整體感是好看的，兩個半小時沒冷場，很厲害的導演作品，不論是攝影、鏡位、劇情節奏

  搭配，特別是場景挑選，在大銀幕看得很過癮，這是李奧納多希望把觀眾找回影院的期待

  所拍的作品，細節上講究，談不上是驚喜劇本，不過視覺非常到位，很推薦的導演型作品

  。


  片　　名：一戰再戰

  英文名稱：One Battle After Another

  上映日期：2025/09/25

  類　　型：劇情

  片　　長：161分鐘

  國　　家：美國

  語　　言：英語

  導　　演：保羅湯瑪斯安德森

  演　　員：李奧納多狄卡皮歐.班尼西歐岱托羅.西恩潘

  發行公司：華納兄弟


  劇情大綱


  故事背景設定在一個虛構的美國，移民被迫進入集中營，社會極端主義抬頭。李奧納多飾

  演的主角鮑勃·費格森（Bob Ferguson）曾是激進左派組織「法國75」（French 75）的

  成員，該組織以解救被囚禁的移民和炸毀支持反墮胎政治人物的辦公室為目標。在一次人

  道任務中，鮑勃的妻子佩爾菲迪亞（Perfidia）神秘失踪，鮑勃為了撫養女兒威拉（

  Willa）而隱姓埋名。16年後，他的舊敵人、白人至上主義軍官（由西恩·潘飾演）重新

  出現，綁架了威拉，鮑勃被迫重返過去的革命生活，與昔日夥伴班尼西奧·岱托羅（

  Benicio del Toro 飾）共同展開拯救女兒的行動。




  --








  --'
