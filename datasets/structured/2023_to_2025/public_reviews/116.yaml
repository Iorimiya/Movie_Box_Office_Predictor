url: https://www.ptt.cc/bbs/movie/M.1755791901.A.BC1.html
title: '[新聞] 李奧納多《一戰再戰》搶當最強老爸'
content: "李奧納多《一戰再戰》搶當最強老爸\n\n04:10 2025/08/21 中國時報 杜欣穎\n\n\n李奧納多狄卡皮歐化身反抗軍角色，挑戰公權力。（摘自華納兄弟YT）\n\
  \n年度動作鉅作《一戰再戰》20日發布正式海報，由奧斯卡影帝李奧納多狄卡皮歐領軍，與\n集結奧斯卡影帝西恩潘、班尼西歐岱托羅同台飆戲，掀起一場橫跨數十年、腥風血雨的追\n\
  殺風暴。李奧納多近期受訪表示，「我為了這部片等20年！」終於能與美國傳奇名導保羅\n湯瑪斯安德森合作。\n\n本片由美國名導保羅湯瑪斯安德森執導，他過去執導作品入圍多項奧斯卡獎提名，更是影\n\
  史首位獲得三大影展導演獎「大滿貫」榮譽的導演。李奧納多狄卡皮歐近期在受訪時透露\n，他從影以來最希望達成的夢想，其實是跟保羅湯瑪斯安德森合作，他回憶以前看完導演\n\
  舊作《不羈夜》就感到相當震撼，從那之後便一直希望能夠與導演合作，沒想到這一等就\n是20年，才讓他主演《一戰再戰》一圓夢想。\n\n李奧納多表示，「我很喜歡角色背景是個前異議分子，後來為了照顧女兒，努力過上正常\n\
  的生活，直到危機再度浮現」。他也分享電影不僅有精采刺激的動作場面，也有關乎父女\n之間的情感交流，「更重要的是，這部片故事與當今社會息息相關」，並表示這些理由才\n\
  是他接演本片的關鍵原因。\n\n#名導 #合作 #導演 #保羅 #一戰\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛     \
  \   是 菩薩\n\n\n\n--"
