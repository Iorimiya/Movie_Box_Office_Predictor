url: https://www.ptt.cc/bbs/movie/M.1758803859.A.FCE.html
title: '[好雷] 一戰再戰 One Battle After Another'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  不知道是因為平日還是片商宣傳不夠

  還是被動畫片夾攻之下

  今天看一戰再戰人特別少


  看完幾個想法：

  1.今年獎季不論哪片得獎，華納都是大贏家

  2.預告是故意剪成那樣的，故事不複雜，感謝預告沒透露太多

  3.有槍戰、追車、陣營、諜報，大片該有的元素都有了

  4.配樂如同預告的那個鋼琴，單樂器單音，聽久了還挺有感覺的

  5.宣傳有提到「最強老爸」但是跟連恩尼遜即刻救援的那種風格完全不一樣，李奧納多

  戰力弱太多了，只有救高中女兒這點是相同的

  6.要發明暗號識別敵我之前，一定要記熟不然會被搞死

  7.略有些美國文化。又是種族、膚色這個題目了，不過比《罪人》好懂太多

  8.性明示橋段真的很多



  整體來說娛樂感足夠，也有很多笑點觀眾可以一起笑


  --'
