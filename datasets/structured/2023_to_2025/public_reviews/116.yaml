content: '我不管你想要塞什麼議題進去

  首先你得先拍的好看才行吧


  但這片偏偏在敘事上亂七八糟

  沒有一個合理的主軸

  或是是想探討美國的階級和種族歧視問題

  但我沒那麼在乎那些

  雖然台灣也有這樣的社會問題存在

  可是說真的

  我也沒那麼在乎

  畢竟我不是什麼政治狂熱者或是極端分子

  走在中庸的路上來看這片

  就是一種浪費時間的感覺

  很平庸

  沒有什麼大破大立

  甚至連起承轉合都很難說是好


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
