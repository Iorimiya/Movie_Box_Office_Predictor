url: https://www.ptt.cc/bbs/movie/M.1759460717.A.A1B.html
title: '[好雷] 一戰再戰One Battle After Another'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  1.終於！與長年一起看《瀕臨崩潰邊緣的女人》與《麻將》的友人一起看《一戰再戰》真

  的是讚上加讚。京站威秀午間場次觀影體驗，直接成為本年度最佳（與《青春末世物語》

  華山場並列）。


  2.怎麼可以這麼歡樂？皮卡丘那個廢，從靈魂深處滲出來的吧？師父很棒～當然也懂了大

  家對西恩潘與最後車車追逐的讚美。把導演名字蓋了，我猜不到是誰。


  3.還是比較喜歡《黑金企業》。B U T現在看那個太累了，舒壓多了。


  4.當代美國極左極右應該都會恨這部電影，但猜他們都很忙沒有時間去看電影。不左不右

  或小左小右（？？）應該會剛剛好舒服地看這片中的幽默與荒謬。


  5. 一刷享受的是電影主軸，未來想要二刷，更仔細地去看它的細節與呈現美國的方式。

  私以為那才是這片吸引人的地方（也是我近期想多了解的世界）。


  6. 看完忽有動力回追或重看PTA的片，那些虐心到底的狠片。心中充滿著重新年輕的感覺

  （實際上就是有手機的中年廢宅？）～大概就是一種好電影特有的魔力。


  7.一般廳的音樂好像沒有到很影響，個人是滿喜歡那種吵的（或者I M A X比較大聲？）

  ，鋼琴很棒、幾幕重頭戲的歌曲也很棒。



  ***


  這裡是我的樂園:




  --'
