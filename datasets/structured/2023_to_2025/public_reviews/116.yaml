url: https://www.ptt.cc/bbs/movie/M.1765326895.A.66F.html
title: '[新聞] 李奧納多《一戰再戰》金球領跑'
content: '新聞網址：


  李奧納多《一戰再戰》金球領跑


  李炳憲搶影帝 巨石強森首度角逐


  04:102025/12/10 中國時報 杜欣穎



  李奧納多狄卡皮歐以《一戰再戰》問鼎金球獎音樂及喜劇類最佳男主角。（華納兄弟提供

  ）



  李炳憲以《徵人啟弒》入圍最佳男主角，對上李奧納多、喬治克隆尼等強勁對手，堪稱死

  亡之組。（美聯社）



  提摩西夏勒梅以《橫衝直闖》角逐音樂及喜劇類最佳男主角。（龍祥電影提供）



  巨石強森（左）與艾蜜莉布朗雙雙問鼎戲劇類最佳男主角與最佳女配角。（采昌提供）



  第83屆金球獎公布提名，由李奧納多狄卡皮歐主演的《一戰再戰》以9項入圍成為電影類

  大贏家，挪威電影《情感的價值》與萊恩庫格勒執導的《罪人》分別以8項以及7項提名緊

  追；南韓演員李炳憲以朴贊郁執導的《徵人啟弒》首度入圍音樂及喜劇類最佳男主角，平

  時被視為娛樂動作巨星的巨石強森，更是以《重擊人生》首度獲金球獎戲劇類最佳男主角

  提名。


  李炳憲將與《一戰再戰》李奧納多狄卡皮歐、《橫衝直闖》提摩西夏勒梅以及《影星傑凱

  利》喬治克隆尼、《藍月終曲》伊森霍克競爭音樂及喜劇類最佳男主角。戲劇類最佳男主

  角方面，巨石強森將與《罪人》麥可B喬丹、《這不只是個間諜故事》華格納穆拉等人共

  同角逐。其中，巨石強森的表現就連名導克里斯多福諾蘭都盛讚，演出令人心碎，近年來

  都很難再看到的極致表現。


  《徵人啟弒》同時入圍音樂及喜劇類最佳影片和最佳外語片，與《一戰再戰》、《暴蜂尼

  亞》等片角逐音樂及喜劇類最佳影片。而2度在金球獎上封后的艾瑪史東，這次憑藉《暴

  蜂尼亞》獲音樂及喜劇類最佳女主角入圍，與氣勢正旺的《媽的踹爆你》蘿絲拜恩、《魔

  法壞女巫：第二部》辛西婭艾利沃、《一戰再戰》雀絲茵菲妮蒂等人角逐寶座。


  《情感的價值》8項提名


  《情感的價值》導演尤沃金提爾接獲8項提名喜訊時，正和史柯斯嘉在巴黎特映會。他笑

  說，在飯店盯著金球獎入圍直播，看著名單一個接一個，完全驚喜到不行。出身電影世家

  的他始終堅持以35mm底片拍攝，坦言本片是「一封獻給電影的情書」，更感動說「所有人

  都被看見，真是太棒了」。


  值得一提的是，傑瑞米艾倫懷特、阿曼達塞佛瑞以及雅各艾洛迪3位演員在電影與影集類

  都獲得提名。而近期票房橫掃全球的《動物方城市2》則將與《鬼滅之刃劇場版 無限城篇

  》、《Kpop獵魔女團》爭最佳動畫片。金球獎明年1月11日舉行頒獎典禮。




  --'
