url: https://www.ptt.cc/bbs/movie/M.1759050589.A.B0E.html
title: '[超負雷] 一戰再戰 真的爛死'
content: '前面有警示文了，但有皮卡丘，西恩潘，班尼席歐，而且imdb 快30000樣本還有8.4分，

  就算校正回歸應該也是7+吧。於是就被狠狠教訓了155分鐘（片尾字幕直接奪門而出了 爛

  死有彩蛋我也沒興趣了）


  1.女主任務就是狂放好萊屋黑人tough，一直裝逼然後屌跟屄一直掛嘴邊，效果真的不好

  有夠尷尬也不好笑不酷。不是每個黑人MDFK都有效果好嗎


  2.整部沒有精彩橋段，武戲文戲都不行，導演功力又弱已經很無聊的劇本看起來支離破碎

  不順暢。最後追車那邊大概是好萊塢導演都基本功了，結果拍得超脫想快轉


  3.唯一娛樂的大概就皮卡丘打電話吵暗語那邊吧


  4.這部沒有皮卡丘，西恩潘，班尼席歐的話，對我來講應該不會扣分，因為換誰演都一樣

  無聊，他們根本沒地方發揮


  5.兩派人馬的動機都沒說服力，個人一向不喜歡日片之類正反派都有正當背景鼻屎大的理

  念。但這部還真的希望能加一些些這種元素


  6.這應該不是AI編劇啦，因為以前很少看到這麼爛的素材


  大概這樣，其他心得跟前面的負雷文87趴像，有些人說有隱喻/暗酸一些極左極右派，我

  還真的看不出來，不妨提點一下

  -----

  Sent from  on my iPhone


  --'
