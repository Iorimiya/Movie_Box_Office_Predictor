url: https://www.ptt.cc/bbs/movie/M.1758803488.A.71B.html
title: '[負雷] 一戰再戰'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  直接說結論，不好看。


  以下IMAX海報防雷，本來打算平整地帶回家，電影結束後就捲一捲收起來了：







  本片開頭先花了一點時間鋪陳，主要是革命同志們過去的豐功偉業、老婆和反派之間的愛

  恨糾葛、反派被某團體招募等等，確實都是鋪墊角色的重要劇情；導演似乎是捨不得自己

  拍了一堆珍貴素材，一點都不打算去蕪存菁，全部塞好塞滿，這個「一點」時間就直接花

  掉了整整一個小時，而且後面還有更多。


  但是！這些全部都不需要演出來啊！完全可以穿插在對話裡就足夠了，甚至導演確實也有

  這麼做，例如李奧納多打電話的自白、女兒躲在修道院時的質問；用這種方式不只能讓劇

  情節奏更加流暢，也能讓後面的反轉更有力。沒錯！原本修道院那段應該要是一個大反轉

  的，但是他前面都演得一清二楚，後面就只是平鋪直敘把大家都猜得到的劇情毫無懸念演

  出來，彷彿在交作業一樣，硬生生就把一個星際大戰等級的高潮戲給浪費了，超失望。


  政確與否、左右派之類的議題就不多說了，不管這些元素如何增減，都不足以影響本片糟

  糕的敘事。感覺導演就什麼都想演一點、什麼都想酸一下，再塞一些黑色幽默（但完全不

  好笑），一些支線也顯得莫名其妙（例如那個殺手突然良心發現回來放了女兒，一點鋪陳

  都沒有；移民的議題也點到為止根本沒打算深入），最終決戰的處理方式讓人十分錯愕，

  父女情的部分更被稀釋到顯得有點草率了事，最後再強行來個皆大歡喜的結局。雨露均霑

  的結果就是完全看不出這部電影的核心主題想表達什麼，任何一個部分都顯得索然無味。


  唯一可以稱讚的就是幾個主要演員的表現都很優秀，尤其是李奧納多，有他登場的部分都

  很棒，可惜他大概只佔了全片一半的戲份而已。還有中間逃亡那段是真的緊張刺激，我一

  度以為後面能倒吃甘蔗了，但沒有，就只有那段精彩而已。


  建議大家等串流就好，不看也行，三個小時可以做很多事情。真的想進電影院的話，或許

  可以帶一枚抱枕，進去先睡滿一個小時，醒來剛好是最精彩的部分，看到班尼西歐的戲份

  結束就可以離場了。



  --'
