title: '[好無雷] “一戰再戰”無雷心得'
content: "大約一個月前在電影院看到預告，那通在公共電話對暗號的電話片段時，就覺得一定\n要去看，但當時的設想是覺得應該是以惡搞為主軸的動作片，後來才發現這部電影其實出\n\
  乎意料的著墨在人文的部分。\n\n    片中許多瑣碎的劇情一看就知道是小說改編，第一次看節奏又偏快，真的很容易覺得\n錯過什麼內容，劇情其實討論很多的面向，小到親情大到種族、移民政策，細節過多而顯\n\
  得有些零碎的劇情，卻是我最喜歡的部分，能把這種部分演的很好，也真的是李奧納多的\n強項，在認真劇情之餘，又參雜了許多幽默，一直都覺得李奧納多很會挑劇本，這次“一\n\
  戰再戰”讓我覺得依然有中，有很多可以引發討論的議題，是一個很完整的故事，雖然細\n節很多的缺點就是，片長整個被拉很長整整2小時又50分，但我還挺喜歡的。\n\n\
  \    片中的演員也都很有實力也很有特色，除了李奧之外我也很喜歡裡面“師父”的角色\n，看完還特地去查是哪個演員，真的很帥氣，反派也氣場超強，不知道是不是導演故意，\n\
  電影的主軸議題跟現今全球重大的政策息息相關，雖然在電影中嘲諷式的誇大了所有現象\n，但現在世界其實也差不多要瘋成電影裡的樣子，讓人在戲裡戲外都有感的哭笑不得，總\n\
  而言之，這不是一部好萊塢刺激動作片，但大力推薦給喜歡劇情長片的你。\n\n\n--"
