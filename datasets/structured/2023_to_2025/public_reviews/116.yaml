url: https://www.ptt.cc/bbs/movie/M.1761325800.A.291.html
title: '[新聞] 電影賠錢他還是賺 李奧納多《一戰再戰》'
content: '電影賠錢他還是賺！李奧納多《一戰再戰》傳巨虧1億美元 享特殊合約照分潤


  潘鈺楨


  2025年10月24日 週五 下午9:24




  電影《一戰再戰》由李奧納多狄卡皮歐主演。（圖／華納）


  由保羅湯瑪斯安德森（Paul Thomas Anderson）執導、（Leonardo DiC

  aprio）主演的《》是今年備受好評的電影之一，被視為奧斯卡熱門片，不過近

  日有外媒指出，電影票房慘澹，預估出品方華納兄弟將至少虧損1億美元。




  根據《綜藝報》報導，近期許多備受期待的電影票房「集體失靈」，像A24出品的體育傳

  記片《重擊人生》（The Smashing Machine），由（Dwayne Johnson）飾演MMA

  拳手馬克克爾，以及由（Channing Tatum）主演的劇情喜劇《》（Roofma

  n），可說是全數陣亡。


  《屋頂人》首週末只賺進了800萬美元，而《重擊人生》在第二週的票房暴跌70%，目前總

  收入僅為1010萬美元。至於其他瞄準成年觀眾的電影，像是（Jennifer Lop

  ez）主演、預算3400萬美元的音樂劇改編電影《》（Kiss of the Spider Wom

  an），僅獲得85萬美元。




  即使是保羅湯瑪斯安德森執導、李奧納多狄卡皮歐主演的《》，也難有突破性成

  績。雖然該片全球票房達到1.4億美元，對於一部原創、R級、片長近三小時的電影來說表

  現不俗，但據知情人士透露，這部電影製作成本超過1.3億美元，宣傳費用約7000萬美元

  。


  雖然電影有1.4億美元票房，由於影院和製片廠通常對半分成，所以這部電影需要大約3億

  美元才能達到收支平衡，出品方預計將虧損1億美元。


  不過華納兄弟發言人駁斥這個說法，並強調公司在2025年憑藉《》和《

  》等熱門片取得了成功的票房表現，「華納兄弟駁斥《綜藝報》匿名消息來源及其

  毫無根據的估計。


  包括《》在內的許多電影，在2025年都實現了財務回報，迄今為止已賺取超過40

  億美元」。不過40億美元應是指票房收入，並非利潤。




  即使如此，李奧納多的收入並不會受到影響。因為他在其電影通常享有「first-dollar g

  ross」（首日毛利分潤）合約，意味他在製片廠收回任何成本之前，就能從票房中先獲得

  一定比例的收入。


  「First-Dollar Gross」是好萊塢電影產業中一種非常罕見且極具優勢的薪酬合約條款，

  通常只有像李奧納多這類頂級巨星才能談判獲得。


  「First-Dollar Gross」指的是演員或製片人可以從電影票房收入的第一塊錢開始就獲得

  一定比例的分潤，不需要管票房收入是否要先扣製作成本、宣傳行銷費用、發行費用或任

  何其他的支出。


  在此合約下，該巨星的收入優先級是最高的，甚至高於製片廠收回成本的權利。


  即使電影最終虧損，巨星依然可以根據合約條款分得他們應得的百分比。




  對於這些備受期待的電影票房失靈現象，「Fandango」票房分析師肖恩羅賓斯（Shawn Ro

  bbins）表示：


  「這些享有盛譽的電影未能讓觀眾產生錯失恐懼症（FOMO），它們沒有被充分地『事件化

  』。」


  羅賓斯推測，觀眾已經習慣等待串流媒體發行，特別是對於那些沒有超級英雄、恐龍或克

  里斯多福諾蘭式視覺效果的電影。


  自疫情以來，製片廠將電影在影院的專屬窗口期從90天縮短到甚至只有幾週。


  「德州資本證券」分析師艾瑞克沃爾德（Eric Wold）表示：「消費者一年最多只去幾次

  電影院。他們傾向於他們熟悉的類型；續集、前傳和衍生作品，因為他們不太可能失望。

  」


  他認為就現在而言：「。」


  Yahoo奇摩新聞娛樂記者 潘鈺楨／報導


  新聞網址：




  --'
