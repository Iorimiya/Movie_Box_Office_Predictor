title: '[新聞] 李奧納多《一戰再戰》將虧超過1億美元！'
content: "李奧納多《一戰再戰》將虧損超過1億美元！\n\n\n\n李奧納多狄卡皮歐主演《一戰再戰》雖好評如潮、但票房不如預期！預計將虧損超過 1 億\n\
  美元！\n\n《黑金企業》（There Will Be Blood）名導-保羅湯瑪斯安德森（\n\nPaul Thomas Anderson）編導的《一戰再戰》（One\
  \ Battle After\n\nAnother）堪稱華納兄弟影業今年財務風險最高的電影，該片雖\n\n有李奧納多狄卡皮歐（Leonardo DiCaprio）掛帥主演，但由於題材\n\
  \n和劇情本身不易宣傳，加上總成本又高達 2 億美元（製作費 1.3 億美元左右，\n\n行銷費則約 7000 萬美元），因此早在上映之前，就普遍被認為根本不可能獲利。\n\
  \n\n《一戰再戰》上映後，雖然一如預期大獲好評，更被看好是明年奧斯卡\n\n的熱門季競爭者，但票房收益也是一如預期難以實現盈利。\n\n目前《一戰再戰》的全球總票房是累積到\
  \ 1.41 億美元，雖然以一部劇情片來說，\n\n已屬佳績，但無奈電影造價不斐，這成績仍使《一戰再戰》是處於虧損狀態。\n\n\n外媒《綜藝》（Variety）估計，《一戰再戰》至少得賣到\
  \ 3 億美元才能\n\n至少先實現收支平衡，但它迄今已經上映近一個月，後續連要賣破 2 億美\n\n元都有困難，他們預估，若不計未來的實體影碟銷售收入、授權給其它電視\n\
  \n台和串流平台播放的授權金，《一戰再戰》目前在院線會先賠掉 1 億美元。\n\n但無論如何，狄卡皮歐都還是會從現有票房分到利潤，因為他簽的\n\n First-dollar\
  \ gross 合約，意指他不必等到電影賣到多少門檻、或是等片廠\n\n回收成本才可抽成票房，只要從戲院賣出第一張票的那刻起，他就能抽成。\n\n\n\n--"
