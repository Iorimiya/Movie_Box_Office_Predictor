url: https://www.ptt.cc/bbs/movie/M.1753545388.A.927.html
title: '[新聞] 李奧納多《一戰再戰》引爆3影帝對決'
content: "李奧納多《一戰再戰》引爆3影帝對決\n\n04:10 2025/07/26 中國時報 杜欣穎\n\n\n李奧納多狄卡皮歐主演全新動作片《一戰再戰》化身『革命男神」。\n\
  （摘自華納兄弟頻道）\n\n由奧斯卡影帝李奧納多狄卡皮歐主演的全新動作片《一戰再戰》，9月將在台上映，片中\n找來2位奧斯卡獎男星西恩潘、班尼西歐岱托羅助陣，打造今年陣容最豪華、劇情最刺激\n\
  的大銀幕必看之作。\n\n該片釋出最新預告，曝光3位影帝在片中正面衝突的精采場面，李奧納多狄卡皮歐從影以\n來首次化身象徵反叛精神的「革命男神」，四處放炸彈製造混亂，更激情地握拳高喊「革\n\
  命萬歲」，渾身散發豪放不羈的叛逆魅力。\n\n從預告中可見，李奧納多曾參與多次反抗軍運動，原本為女兒淡出前線，但如今反派事蹟\n捲土重來，遇上「硬派軍人」西恩潘在16年後的某天突然登門搜捕他的女兒，讓他不得不\n\
  與女兒的老師班尼西歐岱托羅一同展開拯救女兒的計畫。\n\n2位影帝就此展開正面衝突，驚險場面一觸即發，預告一釋出就讓影迷興奮不已，紛紛敲\n碗期待能在大銀幕欣賞這場好萊塢最強演技對決。\n\
  \n#釋出 #班尼西歐岱托羅 #一戰 #女兒 #再戰\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\
  \n\n--"
