url: https://www.ptt.cc/bbs/movie/M.1759194041.A.AA7.html
title: '[負雷]一戰再戰，我到底看了什麼？'
content: "衝著皮卡丘去看 IMAX，推一下高雄大遠百的 IMAX，雖然螢幕小，但畫面跟音效都夠，包覆\n感有出來，體驗不會打折。IMAX公路那張海報也算好看的。\n\
  不過這部片大概IMAX和皮卡丘也救不了就是了：\n1、反抗軍到底在反抗什麼？\n一開始看得出來好像是要扯遊民議題，但為啥要搶銀行？搶就算了還要殺人？整個就是「為\n\
  反抗而反抗」，超出戲。\n2、劇情拖、配樂差\n公路那段配樂超不搭，而且追逐戲拉太長（特寫開車的畫面很久很久），吵密語那段也是（\n為了爭最後的時間密語吵了很久很久），看得超不耐煩。公路畫面晃到快暈船，看來攝影設\n\
  備沒有防手震。\n3、政治諷刺片？\n進場前就大概知道是政治諷刺，但看完只覺得劇情走鐘。長達 2.5 小時，緊張感幾乎零\n。場\n內甚至有中途滑手機或直接離席的，導演要傳達的東西根本沒傳到，怎能算好片？\n\
  4.印地安仔把女兒抓走後，又回頭把合作夥伴都殺了，看了簡直黑人問號，這只是刻意在推\n進劇情而已吧。\n \n如果想看緊湊、刺激的劇情，這部真的母湯。因為幾乎沒有娛樂性，甚至會完全不知導演要\n\
  表達啥。也或許我沒有慧根吧，建議串流上了看看就好，看煩了還能中途按暫停做其他事。\n \n--\n\n\n我知道是諷刺片呀，但就很無聊的諷刺片。諷刺片也可以做到抓住觀眾注意力的吧\n\
  這部片沒辦法這樣拍吧\n我看很多人覺得密語那段很好笑\nㄜ沒什麼動作場景，就當劇情片比較好\n謝謝你。我會參考看看\n緊身衣是真的代表他是甲嗎\n真是可惜了\n\
  謝謝樓上的解釋。的確是文化隔閡吧，看的當下只覺得劇情很讓人無語而已\n這種ban掉就好了\n你是反串…吧，應該是吧\n你很氣耶，曲高和寡本來就難尋知音嘛\n青菜蘿蔔囉\n\
  我也這麼覺得，高端文青片看了浪費時間也浪費錢（對我而言啦"
