url: https://www.ptt.cc/bbs/movie/M.1753373317.A.C82.html
title: '[討論] PTA嘲笑DEI啦!「一戰再戰」最新預告'
content: '李奧納多問They是誰?結果小黑女回答就她們，李奧追問是他，她還是他們/她們

  沒那麼複雜啦!她們就她們!

  真的是很好笑的諧音雙關，中文翻譯不太出來，真的是太好笑了哈哈哈!!

  放上中文預告


  --

  水桶王去水桶啦

  貼預告叫做廢文喔?你的邏輯?

  你是有多喜歡DEI?我很好奇

  我才不要咧~這篇沒有XX算你輸喔!

  你各位是不是不懂什麼叫做人稱代名詞雙關笑話啊?去問聊天機器人好嗎?至少有智慧

  我笑的很開心啊，哈哈哈!就像白雪公主那樣，硬要講DEI就是我這輩子最大的敵人

  就好像某些人最大的敵人在對岸，沒問題吧?

  反串看不懂喔?今天發的三支預告，有印度裔有亞裔，到底誰在歧視?

  我的人生確實被DEI毀了阿，誰跟你傳統價值，酸酸預測成功你怎麼不講？還有你那個漂

  亮女生朋友追到沒有？滿口DEI結果正妹不願意接受你，好可憐喔！不爆你料真的不會痛

  耶！再來阿！

  確實啊，謝謝你

  去找我粉絲啦，辦事不牢靠的一群

  好啦不攻擊了，美國頂校都DEI對吧?實際上哈佛大學為例子，亞裔學生認真向上，然而

  哈佛說要維持錄取少數族裔比例，亞裔並沒有提升，博班來說，雖然是100取1人，但是

  99%碩士生根本沒論文，而我有，當我到處求助獎學金困難，這些偽善教授甚至先答應

  我的要求，然後再要求我花30萬申請學校，嚇傻我學長姊，對於這些覺醒廢物來說

  30萬跟他們的可口可樂一樣便宜，橘子這次除了美國東西岸，就是最有錢的地方，其他

  搖擺地區全數拿下，現在你懂了嗎?你要支持DEI，有錢是不夠的，你必須超級有錢

  懂嗎?你去看單口喜劇，那些DEI被電爛的地方，就是錢，去看克里斯洛克的

  Selective Outrage好嗎?

  當然是開心的阿，這篇本質就是分享預告一個好笑的點啊??不夠DEI的論述，哲學雞蛋

  糕已經講過了，標題是刺客教條搞了黑人武士被罵，你知道遊戲產業

  早就超越電影工業了嗎?英雄聯盟這個老遊戲，人氣比電影版還高，當初刺客教條把

  黑人武士砍到戲份剩下20%，才免強沒暴死，什麼叫做虛假的DEI?我還虛假的法西斯呢!

  真正的法西斯是白人工作，少數族裔享樂，歡迎照樣造句

  身為DEI支持者嘲笑先天性神經性疾患，挖賽看到沒這種惡毒的嘴臉!考一次托福外加

  GRE大約1萬4台幣，所有補習班都會告訴你不只考一次，這樣就2萬8了，外加申請

  費5萬跑不掉，看到沒這就是所謂DEI太有錢，5萬跟5塊錢差不多，才會覺得這叫

  英文不好，我發過心理測量學期刊，我學妹英文底子比我好超多，考了5次作文都比我差

  ，先別說托福考試是一個信度超強，效度就是在騙你錢的鬼

  ETS之前補習班老師有說，公然說謊，學妹考5次就要3萬5，這還不算GRE喔!托福考試

  的本質就是重複考試，也就是多繳錢給大考中心，成績自然往上，我一個學弟口說

  爛到靠北，重考照樣飛天，美國大學部的申請資料一堆人跑去非洲的，台灣也不遑

  多讓，小學生研究癌細胞，重點是那個精美的排版比我的國際期刊還漂亮，你這群

  DEI有錢尊爵不凡阿~念什麼台大?大學部直接出國囉~所以我說那個諾貝爾獎呢?DEI?

  你也是，分篇連噓水桶去

  連噓會水桶喔!乖，李安怎麼去好萊塢不在台灣拍片了呢?據說李安給老婆養了5年，我

  可沒有失業那麼久，恥笑李安人人有責!

  沒錯!

