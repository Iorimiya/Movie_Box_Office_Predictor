url: https://www.ptt.cc/bbs/movie/M.1759075483.A.E0E.html
title: '[算好雷] 《一戰再戰》1 battle after another '
content: '(p.s ) 英文片名寫不下 one 以 1  代替





  雷文防雷資訊頁






  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  (刊登於方格子的原文，含插圖說明)



  Paul Thomas Anderson（PTA）新作《一戰再戰》one battle after another，過往導演

  擅長描寫美國文化性與時代性，探究美國人性的道德形成與文明歷程。這次以當前美國川

  普當選，保守派、民族主義浪潮再起的現實為鏡，以一種「寫實虛構」的微反烏托邦正反

  對立陣營相互拉鋸對抗。



  白人至上，軍權勢力，代表當今美國保守主義川普高壓治國；另一邊則是左派 激進的革

  命份子，為少數民族奮鬥，並以法蘭西作為團體代號，指向法國大革命的歷史淵源，而一

  場戲李奧納多正在看《阿爾及爾之戰》正印證此革命典範的複習，同時部分成員還潛藏在

  社會之中偽裝，假冒，趁機反動，內應。



  電影英文片名，主要的戰爭與過去母親的戰爭，隔代之間的革命傳承之意，電影在前四分

  一左右的時間交代了「前歷史」。撇除正方偏向自由派的政治正確不談，電影最終錨定親

  情與過於正向的歷史傳承主題稍嫌保守，沒有太多新意的的結論；看到女兒經由生死關頭

  成長為一個合格的革命鬥士作為結尾，淪為一種「青春成長」電影謂之可惜。



  但過程中PTA緊密的形式，以Greenwood 有些實驗性配樂與剪接快速流暢交代時間的進程

  ，並安插看似混亂，但細究頗為可以觀摩學習的形式實驗，也感嘆台灣電影沒有此電影工

  業，難以望其項背，心理冒出：美國人的拍法只屬於美國，不如好好拍攝屬於台灣人的故

  事之餘，到了後段故事漸漸明朗，開始思考此片的核心，撇除風格的變奏，實驗的嘗試之

  外，《一戰再戰》到底想要說些什麼？（意思是，花招頗多，但以電影競賽來說，最後還

  是以勝負（好不好看、喜不喜歡）作為判準）



  後段一度有拖沓之嫌，劇本與動作場面搭配顯得有力未逮，可能需要檢討一下李奧納多這

  個過於喜劇搞笑的角色性質，並懷念起柯恩兄弟：俐落的動作畫面，懸念情節的設計。相

  對期待著革命一端的英雄，卻變成了哈草吸到神智不清的甘草人物，不得不說作為反派西

  恩潘的表演、軍人法西斯形象，除了嘲諷：白人種族優越，暗地下體黑汙須加以洗淨，與

  加入白人領袖級神秘組織段落，最後劫難倖存，顏面嚴重受損，面容修復之後再度登場，

  帶有一種詭異的好笑並其實蠻有意思。想到《夢想集中營》展示著某種法西斯技術（在此

  電影為表演的技術），髮型也有點類似。



  好像釐清之後就沒什麼好說的文章…


  --


  拉特飯 - 以商業力量進入獨立市場


  --'
