title: '[幕後] 一戰再戰Ｑ＆Ａ'
content: "． One Battle After Another→片名原句出自於革命組織《地下氣象》Weather Undergr\nound於1969年發表的宣告，發表於左翼期刊《新左派筆記》上，該宣言「從這裡開始，一\n\
  場又一場的戰鬥—白人青年加入戰鬥並承擔必要的風險。美洲豬當心！」\n\n\"From here on out, it's with white youth joining\
  \ in t\nhe fight and taking the necessary risks. Pig Amerika beware\"\n\n\n\n． 法國七五French\
  \ 75，來自法國75釐米口徑野戰炮French 75mm field gun，或是一款\n雞尾酒75 cocktail。\n\n． 法國七五成員招聘演員為了突顯不羈放縱愛自由：Teyana\
  \ Taylor、Shayna McHayle、\nAlana Haim、Paul Grimstad、Dijon；現實生活當中全部都是音樂人。\n\n． Ｑ：What\
  \ Time Is It?\n此題密語正解帶有哲學命定勝天論\nＡ：Time does not exist, yet it controls us.\n時間不存在的，仍舊掌控我們。\n\
  \n\n\n． Ｑ：主角在組合屋內電視裡播映的黑白片？Ａ：《阿爾及爾之戰》 The Battle of Al\ngiers (1966)，內容是左翼民族解放陣線反抗政府軍；導演Christopher\
  \ Nolan給予高度\n評價是能喚起他拍電影初衷的經典佳作。\n\n\n\n．Perfidia在外語(Spanish)的意思是：背信棄義；在片中她行事乖張，不檢點放蕩淫亂\n\
  、不負責拋夫棄女，乃至背叛出賣戰友，從安全屋越境潛逃流亡。\n\n\n\n． 母親Perfidia Beverly Hills的飾演者Teyana Taylor，挺著孕肚掃射機槍，興奮地喊\n\
  出：\"Bitch, I felt like Tony Montana!\"；這是一句即興發揮台詞。\n\n註：來自經典名片《疤面煞星 》Scarface（1983），飾演者為Al\
  \ Pacino。\n\n\n\n． Lockjaw是破傷風的俗稱，症狀是肌肉僵硬不自主產生痙攣，特別是下巴和頸部，導致\n難以張開嘴巴 ；上校Col. Lockjaw的飾演者Sean\
  \ Penn演繹人如其名，很好地解釋了片中\n怪異舉動，甚至巧妙呼應片尾外觀形象。\n\n\n\n． 女兒Willa Ferguson的飾演者Chase Infiniti，這是她的大螢幕處女秀！\n\
  \n\n\n． 師父Sensei Sergio的飾演者Benicio del Toro在下車別離時寄予慧語：\"You know wh\nat freedom\
  \ is? No fear.\"，\"Just like Tom Fuxking Cruise.\"；就像他媽的阿湯哥，\n這也是一句脫稿演出。\n\n\n\n\
  ． 師父帶領主角藏匿時，提及他家裡面有拉丁裔Harriet Tubman情況Latino Harriet Tu\nbman situation；此乃美國歷史名人，其事蹟為反奴隸制地下鐵路與援救行動，日後詞彙\n\
  Tubman成為社會運動象徵。\n\n\n\n． 叢林破麻Junglepussy，飾演者Shayna McHayle，此乃她的rapper藝名；有趣的是，片\n\
  中台詞\"This pussy don't pop for you!\"是來自她的單曲Pop for You；一個量身打造的\n革命家。\n\n\n\n． Avanti在外語(Italian)的意思是：明日未來，演員選用少數族裔原住民因紐特人Eric\n\
  \ Schweig ，Avanti也是左翼刊物名稱；左派支持平等原則，在片中賞金獵人見狀觸及自\n身底線，憤而深入據點慷慨赴義。\n\n． 本片拍攝耗時長達七個月。\n\
  \n． 本片特色完全沒有特效，非常古典地從頭到尾均採實拍，包含鋪設大量推軌車於實際\n勘景場地自然採光；唯一的後製CGI為電子菸。\n\n．片末高潮飛車戲碼，令人聯想到《警網鐵金剛》\
  \ Bullitt（1968），主角為Steve McQu\neen，身為業餘車手的他親自駕駛Ford Mustang上路追擊Dodge Charger，在本片則為藍色\n\
  Ford Mustang追殺白色Dodge Charger；過山車追逐戰使用VistaVision拍攝，底片風格致\n敬名片橋段。\n\n\n\n．主角路邊偷車是一輛改裝的Sentra\
  \ SE-R。\n\n． Ｑ：聖誕冒險家俱樂部Christmas Adventurers Club？\nＡ：此乃一個相當精妙的虛構組織名稱，依理解水平能有數種解釋：\n\
  \n→在外語(Hungarian)的寫法→ Karacsonyi Kalandorok Klubja；縮寫即為KKK。\n\n→3K黨當年是在平安夜Christmas\
  \ Eve成立\n(Ku Klux Klan創建日期：1865年12月24日)\n\n→White Christmas\n出自二戰時期名曲《白色聖誕節》\n歌詞：I'm\
  \ dreaming of a White Christmas\n\n→Santa = Satan；諧音，聖誕即撒旦。\n\n→現實中，的確存在隱世罕有人及之高階紳士私人俱樂部\
  \ ：「波希米亞樹林木屋」，詳\n見維基百科詞條：The Bohemian Grove，至尊成員不乏重量級人物，舉凡歷屆美國總統：\nHerbert Hoover、George\
  \ H. W. Bush...\n\n\n\n． 詮釋白人至上團體主席的Tony Goldwyn，現實生活中他是根正苗紅的好萊塢世家後代\n，他的祖父Samuel\
  \ Goldwyn被譽為製片人帝王，知名的米高梅公司Metro-Goldwyn-Mayer\nStudios之中間名就是來自他；值得一提，Goldwyn家族有著猶太人血統。\n\
  \n\n\n． 片中首席審訊官Col. Danvers，話術精湛驚人逼真...實因身份並非演員；James Rate\nrman，是一位安保顧問與前國土安全局特工。\n\
  \n\n\n． 片尾曲：American Girl，詞曲創作者為Tom Petty and the Heartbreakers，歌詞首\n段為\"Well, She\
  \ was an American girl\nRaised on promises\"，完美映射全片主旋律作結：那是一個被承諾長大的美國女孩。\n\n\n\n\
  —\n\n相關評價：本片自試映後即引發眾多業內人士驚嘆，如此傑作好評不及備載，或進電影院\n親臨鑒賞，以下僅列舉里程碑式重量級名導：\n\n：\n\"Extraordinary\
  \ performances everywhere.\"\n\n\n\nLeonardo DiCaprio、Sean Penn、Benicio del Toro、Teyana\
  \ Taylor、Chase Infiniti\n...本作可見之所有主要角色，在其所屬戲份彷彿渾身解數，各司其職以臻極致，然而全\n片適如其分地安插無數令人印象深刻角色，舉凡審訊官、賞金獵人、畢業舞會跨性別者、\n\
  甚至是某位革命成員，爆頭離世方式亦令人過目難忘；一部優質隔代小說電影，群戲安排\n戲份不易，難怪乎黑幫大導演首肯盛讚。\n\n：\n\"It’s a film\
  \ I want to see a second time.\"\n\n教父大導演特地進羅馬劇院欣賞，他喜歡PTA作品的其中一點是，允許你對故事構築出自\n己的觀點，但同時又不會侷限於導演的觀點；有趣的是，基於重聽，他迫不及待地想重看\n\
  。\n\n：\n\"What an insane movie! Oh my God!\"\n\n史匹柏身為好萊塢有史以來最成功的導演之一，年僅25歲即拍出首部長篇出道作Duel，你\n\
  可以想像他完全著迷於沙漠公路追車戲碼；基於原著改編作品：劇本、選角、勘景、攝影\n、剪輯、音效、配樂...這是製片人夢寐以求的成品。\n\n\n\n答卷能夠征服以上一票超級名導，要知道：可都是群年近八旬老人，可以想見假以時日，\n\
  質量足以晉升當代經典，Twenty-Twenty世代最好的動作片之一，屬於保羅湯瑪斯安德森\n的險路勿近，美墨邊境線性敘事，更大的場面、更廣的主題、更多的親情\n\
  \n\n\n你無須事前知悉那些話外之音，亦能隨著絡繹不絕鋼琴鍵欣賞一部流暢的Action movie\n\n你不需要是大導演，也可以在離場的時刻由衷感到喜悅，伴隨著影壇引用最切題的片尾曲\n\
  之一：American Girl\n\n收聽感慨：真是好看。\n\n一部優良劇本向來留給觀眾自由發揮見解空間，還請集思廣益補充；最喜歡的另類解釋：\n育兒也是一場又一場的奮鬥。\n\
  \n\n\n全球上映十天突破一億美金\n今年好萊塢最棒的底片電影\n\n\"Viva la Revolution!\"\n\n—\n\n☆預測入圍獎項：Academy\
  \ Award\n\n☆最佳音效剪輯\n\n\n\n☆最佳女配角\n\n☆最佳男配角\n\n\n\n--\n\nPTA幾乎同情他電影作品中的每個角色，\n這就是為什麼他成為終極人文主義導演。\n\
  \n即便是Lockjaw，一個顯而易見的反派角色，\n早期他前往安全屋如同約會般帶上鮮花，\n是片中最人性化的時刻之一。\n\n\n原著作者衍申Pynchonesque品欽學中，人並沒有絕對的善惡，PTA在片末特地留出膠卷，\n\
  在這裡導入編劇想說的話，給予Perfidia以一個母親的身份告解，側面體現Bob的養育之\n恩大於天；影迷間流傳一個說法是：那封信恐怕是Bob捏造的...\n\n\
  均為素人\n\nAdam Somner是製片，在本作上映前逝世；\n本片OBAA是獻給他的遺作。\n\n值得一提：生涯履歷首席助理導演相當輝煌，\n幾乎每部都是名導；大導御用專業電影人。\n\
  \n\n個人認為不成。最重要的原因就是：Willa閱讀信件時旁白附帶Perfidia語音，強而有力\n說明此乃生母親筆：「代我給你爹一個吻，我的貧民窟小子」Give\
  \ your dad a kiss for\n me, my Ghetto Pat；這句細思極恐，這些年來根本沒人知悉真正的生父。\n\n最後，電影中甚至從未明確表示Bob識字。\n\
  \n\n不同於原著，PTA將所有女性要角，均改為有色人種(黑人)，相較於所有男性要角(白人、\n西裔、原住民裔)，這部顯然帶有探討種族議題甚至於男女話題，當中特地置入符合當代\n\
  跨性別角色\n\n\nNo Country for Old Men\n當屆入圍有部PTA作品\nThere Will Be Blood\n\n\n片中這些舉動隱含著Bob有相當程度閱讀障礙，包含很吃力記不住密語橋段\n\
  \n\n以及Bob並不會使用智慧型手機，有著反跟監之外難以啟齒的理由。\n\n口吃是此類人士一大外顯跡象：和女兒無謂爭論使用的動詞、懂事的女兒質疑酒駕，主角\n\
  還要回嗆妳是誰當我褓姆？What are you, my babysitter?；Bob是一個生活自理有缺陷\n的人。\n\n從善如流\n\n\n\nAvanti在交易俘虜時，底線是他不幹殺少女這檔事，Lockjaw加錢也沒用，親骨肉又不忍\n\
  下手，說了句只可惜妳不懂禮貌的話；後來改變條件，只要把她帶往某處，才達成deal交\n付\n\n\n白人槍手Tim Smith言談透露原住民血統是曾經透過交易而認識這號人物，這可以解釋片\n\
  尾追上那輛白色Dodge Charger\n\n在國外，水電工不等同受過高教\n原著中，主角出身是中輟生嘻皮\n全美有13%成年人是功能性文盲Functional\
  \ illiteracy。\n\n定義：是指具備基本閱讀書寫計算能力\n但是卻無法有效運用來處理日常生活事務\n請見原片中對於Bob Ferguson之描述\n\
  \n知之為知之\n不知為不知\n\n\n\n聖誕即撒旦\n諧音早存在"
