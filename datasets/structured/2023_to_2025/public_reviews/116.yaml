title: '[好雷] 一戰再戰-戰到反戰'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n1.比想像中好笑\n\
  2.預告片根本是故意剪得像疾速救援(第一次看預告的我@#$%...)\n  \n  (就算你完全不想被劇透也不妨看看這個預告 會對觀影體驗更有幫助)\n3.李奧納多帥扮的時候還是很帥\n\
  4.李奧納多醜扮的時候就是傑克尼克遜 SHINING~~~\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  雖然片長很長\n但是娛樂性很強\n整部片環繞【秩序】與【混亂】兩個陣營\n然而以哪個陣營為主述的時候 都會讓你覺得那個陣營討厭得要死...\n\n【秩序】陣營主角西恩潘\n\
  本身跟黑人有一腿 卻投身超級種族主義陣營\n\n【混亂】陣營主角李奧納多\n本身是白人 好像也是混亂陣營中唯一的純血白人 而且超級懶\n\n前三分之一是【混亂】大於【秩序】\n\
  李奧納多天下無敵\n到處零元購 炸飛一切\n想幹什麼就幹什麼\n所以就像我們現在看零元購一樣\n觀影體驗是:我看你們能囂張到什麼時候\n然後李奧納多的老婆就被抓了\
  \ 【混亂】陣營緊急撤離\n\n中間三分之一是【秩序】大於【混亂】\n這裡故意讓西恩潘額外加入【秩序】組織\n讓【秩序】不等於美國官方(重點)\n【秩序】跟3K黨差不多\n\
  審問西恩潘跟黑人有沒有性關係時 西恩潘面無表情地說沒有\n觀影體驗是:媽的，誰要跟你老實說幹話啊..\n接著西恩潘就開始搜索李奧納多跟他女兒\n因為這個女兒 可能就是證明他跟黑人有一腿的唯一證據\n\
  開始瘋狂對混亂陣營大逮捕\n\n西恩潘跟女兒認親後進入第三幕\n此時【秩序】陣營發覺西恩潘的謊言\n要直接幹掉西恩潘\n西恩潘完全不知情\n還在想怎麼把女兒滅口(又不想自己動手)\n\
  李奧納多則是又狼狽又沒戰鬥力的遠遠追著\n結果就是\n還蠻出乎意料的不出意料\n\n兩個陣營都亂七八糟\n然後最後誰也沒能消滅掉誰(甚至誰也沒有真正想消滅掉對方)\n\
  那前面那些戰來戰去到底在戰什麼?\n甚至最後剩下女兒還在一直戰來戰去 是在戰什麼呢?\n恩..\n我猜這應該是部反戰片吧\n\n--\n要我說 我覺得會喜歡這部片的關鍵不是\"\
  美國\"\n而是你是不是正義魔人/政治狂熱者\n越有上述傾向的的 會越討厭這部QQ\n這部片最好的切入方式\n就是當作去看一部李奧納多救女兒的疾速救援3.0動作片"
