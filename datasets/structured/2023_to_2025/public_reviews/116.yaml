content: '我覺得你這篇文恰恰凸顯共和黨的虛偽之處


  合理化政府的暴力行為，但同時批評受害者的暴力反擊


  拜託用大腦思考一下，當政府宣稱要展開美國近代史上最大規模的武力驅逐行動時，你以

  為大家會和平安份的任人宰割嗎？


  社會不是這樣運作的


  最好笑的一點是，共和黨人宣稱，擁槍是為了對抗政府暴力（當然實情另當別論）


  但當電影中不同立場的人拿起槍對抗政府時，共和黨人又批評電影不該鼓吹暴力抗爭


  實在虛偽


