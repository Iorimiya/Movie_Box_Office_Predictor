content: '雷文防雷資訊頁





  個人覺得不太好看，想不出喜歡的點，就只列我不喜歡之處。


  1.片長很長但有些劇情出現點有點怪又短，有一種你曾參與他們，但實際又沒，所以比較難

  進入。


  2.有些緊張或追趕橋段，配樂好像想營造緊張，但覺得很煩，反而出戲。


  3.很多鏡頭一直晃加上碎片切換，要加配樂，整個有點暈車想吐。最暈還是神鬼認證。若您

  也有相同體質這部可放棄。


  4.故事主角應該是那個軍人，只是李奧那多有名拿他宣傳。但主角著墨有沒比配角多太多，

  所以劇情也發揮得不好。


  5.結局若停在辦公室那段會好點。



  --'
