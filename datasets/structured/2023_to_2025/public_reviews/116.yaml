url: https://www.ptt.cc/bbs/movie/M.1758948948.A.28D.html
title: '[好雷] 一戰再戰 有時芝麻小事會比正事有記憶點'
content: "其實窩對評斷好雷的標準還蠻低的,版上有很多負雷的片,窩還是能給普雷\n\n但是這片..讓窩猶豫惹一會兒\n\n一般來說,能順順講完一個故事,加上配樂又這麼切適拉動劇情,再加上幽默台詞\n\
  \n跟劇情片很重要的 \n\n這片無疑算是優秀才對\n\n..可塑,對這三位主要男角來說,表現出這等演技應該是手到擒來 喝水一樣\n\n再加上PTA的大名,《一戰再戰》好像應該要很神,\n\
  \n觀影前期待拉太高惹,反而變普 這是,窩的錯嗎xd?\n\n(防雷頁)\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  李奧皮卡也不是第一次演跨種族戀情的電影惹,他在《神鬼獵人》(蔗部到底神鬼在哪?..)\n只是過程稍有不同..這次用力演戲也讓他拿下小金人\n\n然後劉皮卡也不是第一次嗑藥嗑開惹,他在《華爾街之狼》也是嗑很high,差別在華狼一片\n\
  是越high越聰明,這片卻抽到癱在沙發上,漸漸失憶(通關密語)\n..共通點是喝完或嗑完後駕車讓人不放心XD\n\n所以片單拉完一看,廖皮卡基本把以前的腳色要素拉出來view一遍麻~導演真好心\n\
  \n至於西恩潘 可能是名字有西恩兩個字,難逃一死的命運,彈起來還是要你再躺下去\n\n至於標題的話,75部隊的客服(?)公布密語的解答:時間並不是最重的,而是balabala&(G)..\n\
  尼看窩現在也記得不住,只記得巴柏的死黨,偏好無毛的墨女\n要是問這葛,窩也能過關, 電影劇情也只剩一半惹.\n\n--\n\n\n\n..10多年後,孩子成了40多歲的大叔,開始稱\n\
  養大他的Pr馬還在島上呢。\n\n--"
