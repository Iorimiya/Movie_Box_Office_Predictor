title: '[ 普好雷] 一戰再戰 imax'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  這是我人生中第一次看 IMAX 播放、而且是用 IMAX 規格去拍攝的，滿版就是爽。聽說 I

  MAX 規格的音效也是有優化過的嗎？聽起來是滿震撼的沒錯~


  劇情比較多著墨在討論種族歧視、非法移民，跟一些革命的事件上，我對此並不反感，但

  是任何東西只要過頭了，會影響觀看體驗這倒是真的。像是吸毒那一段就恰到好處的好笑

  ，如果不斷的吸食下去反而容易膩。最後一段的公路畫面就有點膩了，不太懂想表達的是

  什麼，但地點確實挑得不錯，高高低低的視覺感是不錯的。


  老實說刺激的點是在中間那一段，女主角出賣了所有人的時候，還有山羊被抓到的時候，

  出賣同伴準備要溜的時候都滿刺激的。但後面的槍戰老實說真的滿普通，跟預告差很多 X

  D，基本上你能看見的槍戰，預告應該都展現給你看了!!!~

  整體來說我認為中規中矩，是一部可以思考的片。


  但是對於非法移民很少的台灣，我也不知道該提出什麼樣的看法。劇中確實很多針對黑人

  、印第安人的部分，人類天生有明顯的排外性，這一點也是無可避免的，不過這當然是可

  以討論的~


  劇情跟一些另類感想晚點補上:


  --'
