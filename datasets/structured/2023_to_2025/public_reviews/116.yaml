url: https://www.ptt.cc/bbs/movie/M.1768376248.A.7D8.html
title: '[SD雷]  師父！《一戰再戰》one battle after an'
content: '多說一個字都會走在爆雷風險，好像文本厲害的作品大多有著這樣的特性，至於導演、演

  員、剪片的功力如何，或是走什麼風格，這個就....


  但是文本真的


  每個演員都在自己的角色裡面，就像地球上活躍的行人一般


  文本真的令人驚喜也難過，連顏色都不能說


  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  藝術就是有這樣的特性，當你試圖定義他，他也就死了


  人好像

  也是


  敬不羈的青春。


  薇拉最後停車在視覺盲點，這段差點沒暈車，但是很厲害耶。掌鏡的是不是也是戰士？！

  賞金獵人死一片太奇妙了，臉被轟爛的上校都可以為了他想要的目標再爬起來，但他們沒

  有。


  日本漫畫還是影響太多了，大家都像漫畫那樣瘋癲的內心世界；建築才剛倡議完國際化v.

  s在地性，電影圈也扛不住了嗎～～不曉得迪士尼怎麼扛～恐龍扛狼扛～


  皮卡丘是不是愛上在電影裡狼狽，好感受現實中奢華的真實？！忍不住將心思飄向花月殺

  手的心境，多年以後，這段對話來對話去的電影史不曉得會被如何介紹。


  夫妻為了孩子對話那段感覺是不是皮卡丘內心戲，佩拉是皮卡丘的內心想法，火箭人是一

  般生母的想法........演員果然是裸體在表演呢。


  --'
