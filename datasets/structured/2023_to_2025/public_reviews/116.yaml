url: https://www.ptt.cc/bbs/movie/M.1759116867.A.426.html
title: '[好雷] 一戰再戰'
content: '無雷心得：


  這絕對不是PTA最好的作品

  遠遠算不上

  但這應該是PTA自己最想拍、最放飛自我的作品

  至少我自己是這麼認為的


  大師如PTA

  絕對不可能不知道這種編導手法和這種劇情安排

  觀眾的評價絕對會很兩極

  但他還是這麼幹了

  我覺得導演很有種

  也很欣賞


  回到電影

  貫串整部就兩個字


  「荒謬」


  荒謬的角色

  荒謬的劇情

  荒謬的導演手法

  刻意的反高潮、製造反差、氣氛緊張但又莫名其妙的令人發噱

  看似根本胡鬧

  但拍起來卻很有樣子

  雖然在意圖上這部應該就是一齣徹頭徹尾的政治諷刺片

  表現方式卻不是像大獨裁者落難記那樣

  用極盡戲謔的手法挑明了要逗觀眾發笑

  而是藉由一場又一場混亂、失敗、可悲又可笑的演出來呈現


  所以為什麼會評價兩極？很挑觀眾？

  因為要能享受這部電影的門檻有點太高

  首先你要對美國極左極右的政治現狀有一定程度的了解

  再來你要帶有一種「人生近看是悲劇、遠看是喜劇」的預期心理

  這樣你才有辦法接受這樣的劇情


  如果是用嚴肅的心態

  或就想看一部尋常的商業劇情片

  很抱歉你只會敗興而歸


  無雷心得就到這邊





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  其實導演想傳達的東西很簡單

  就是諷刺極端主義

  所以不管是極左還是極右

  基本上你在電影裡都會覺德他們腦子是不是燒壞了

  不是瘋言瘋語就是行為偏差


  如果你看著覺得莫名其妙

  覺得這些角色怎麼一個比一個廢、一個比一個可悲

  覺得劇情有夠煩燥

  覺得怎麼好像沒幾個正常人

  尤其是兩個主角李奧跟西恩潘

  根本就是魯蛇和瘋子

  而那個黑人媽媽也是個人渣敗類

  正常人哪可能做這些事？

  挺著七八個月孕肚拿機槍在那邊瘋狂掃射？

  腦子有洞喔？

  到底在演三洨？


  恭喜你

  這代表你是個正常人

  看到這些腦子有問題的極左極右會眉頭大皺

  對其行為模式百思不得其解

  而這其實也正是導演想傳達的東西


  其實去看訪談

  團隊也很清楚說明法國75小隊基本上就是「太過頭」了

  好萊屋是比較偏左一點

  但縱使如此大家也認為左到搞恐怖組織殺人搶劫真的是走偏了

  所以片中不斷的醜化這些極左

  像是食古不化超級龜毛

  都已經出大事了還在那邊堅持要呼暗號問幾點鐘

  只要被抓，稍微威脅兩句就背叛同伙

  表面上大家都是革命同志

  實際上每個人都只顧自己

  越左的越自私

  看看那個黑人媽媽

  滿嘴大道理：自由、人權、身體自主權、袒護移民之類

  實際上是個只管自己連小孩都可以不要的母親

  最後被抓還樂得跟極右交換條件

  不但上了床還咬出所有同夥

  然後再一個人遠走他鄉什麼都不管

  真是個很負責任的左派

  讚喔！


  那李奧呢？

  就是一個不曉得自己在幹什麼、迷失方向的可憐工具人

  跟著極左團體胡作非為

  弄得自己身敗名裂還要隱姓埋名藏在鄉下地區

  老婆要跑了本來氣個半死

  卻因為想到政治理念

  只能自我說服去接受

  還要對女兒說謊媽媽是個聖人為理念而死

  不斷的自我欺騙

  現實生活也是一團亂

  吸毒酗酒一事無成

  出大事了只會慌慌張張拼命找sensai問怎麼辦

  像不像現在典型的左膠？呵呵


  那極右那邊更不用說了

  都是一群瘋子

  還故意取名叫聖誕冒險家這種富有宗教意義的名字來臭那些保守派

  像是西恩潘演的拉爵

  種族主義到極點

  卻又整天意淫自己最痛恨的種族

  需要處理掉女兒自己卻又下不了手

  如此表裡不一、極進虛偽之能事

  都已經被刺殺了還沒警覺到這個極右團體是有什麼問題

  以為那個被逆奸這種荒謬的藉口能瞞天過海

  通過加入光明會般種族主義秘密團體的面試

  看不出來這群就是納粹法西斯

  一個不爽就會把自己人幹了的那種瘋狂

  右到腦筋不正常就是會變這樣


  全片最衰毛的

  基本上就是女兒了

  被左膠老爸洗到大

  但看起來是沒長太歪

  還算是個正常高中生

  只是她的家世拖累了她

  把她捲進這一連串的荒謬之中

  也難怪最後因為精神壓力過大而崩潰

  連養自己長大的（非親生）老爸都信不過

  也象徵著極端主義是會禍害後世的


  但最後女兒還是跑去參加活動了

  只能說狗改不了吃屎嗎？

  接下來會發生什麼事又要再輪迴一次

  李奧老爹很想阻止

  但又因為政治理念的關係

  只好放手

  就跟老婆跑了那次一模一樣


  簡單說

  角色毫無成長

  劇情也完全沒進展

  也難怪很多人看了頭痛

  這不是那種尋常的劇情片

  但說諷刺也沒明著搞笑

  都是把荒謬的那一面用比較認真的手法扔出來

  觀眾會覺得「這到底三洨劇情？」

  然後一邊會覺得超好笑

  一邊會覺得根本亂演一通

  要當超好笑那邊是有些門檻的

  這也不是觀眾的問題

  是導演自己選擇要玩這種把戲的

  所以我才覺得他很屌

  不愧是PTA


  還好我是覺得好笑的那邊就是了



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  --


  看訪談他說醞釀20年耶

  當然也可能是宣傳官話囉'
