url: https://www.ptt.cc/bbs/movie/M.1758917903.A.B0A.html
title: '[好雷] 一戰再戰 雖然看不太懂但就是覺得有趣'
content: '先說我沒看過預告也沒了解過這導演，就是衝著李奧納多去看的



  恩~因為就過去經驗來看只要有李奧納多的片大多不會難看(對比方就是尼可拉斯凱吉)



  不過真的啃起來發現這部意外的難啃



  李奧納多自然是不會讓人失望



  不過從開頭移民、恐攻、種族歧視、革命等元素的疊加，就感覺得出這會是部喜惡極端的作品


  對純粹想看爽片的人恐怕比較受不了，而對喜歡劇情片的人來說，可能也對某些難懂的演繹，或想倡導的議題感覺混亂


  感覺是部需要對美國現狀做許多功課才能更好享受的電影

  不過總之看李奧納多在那發癲還是很好笑就是了

  依然會推薦進場觀看


  裡面的善惡秩序、陣營混亂也是有趣的點，你有時會搞不太懂它到底想捧哪邊立場或酸哪邊立場


  她？他？還是他們？ 喔是無二元性別



  以下有雷










  個人覺得最有意思的是最後的追逐戰

  雖然理論上來說是個完美的擊敗BOSS親子團聚的完美結局

  但從另一個角度來看

  那個BOSS的目標是要殺那軍人，空蕩的馬路上，前後車上是誰很可能根本不知道，他搞不好只是急著回去交差在飆車而已


  那這個角度來看，女兒可能根本就是故意害人車禍、盤問對不出口號，就把路人蹦蹦了...活脫脫的恐怖分子耶


  諷刺的對照就是前面李奧納多同樣各種狀況外對不上口號，和女兒即便看到老爸還是要對口號的行為


  這種認真到近乎可笑的對口號動作，某種層面來說還滿細思即恐的...


  --'
