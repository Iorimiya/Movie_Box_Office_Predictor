url: https://www.ptt.cc/bbs/movie/M.1758811695.A.915.html
title: '[雷] 一戰再戰 PTA最普作品吧'
content: '我沒有說是爛片喔～

  但如果他的電影有比較級 這部倒數第一第二吧


  首先李奧納多根本跟這導演沒任何火花啊


  我的媽啊 他到班尼西歐家裡避難那個長鏡頭戲 尷尬到一個爆炸


  堂堂一個電影大師 把鏡頭給一個明星在那邊大吼罵髒話扭動博君一笑？


  我是一點也笑不出來


  這跟心靈角落湯姆克魯斯那種用力效果是完全不同


  想看性本惡那種嘻皮感的應該從預告就知道已經改成不是了


  這部份好壞就不評論

  畢竟這樣比較容易拿獎


  這部片一定會在明年大獎有所斬獲！ 編導 男配角必入圍 ！ 恭喜


  但就只能說是時候輪到他了 要說什麼爽感不好意思沒有


  搞不好影片我還會支持哈姆奈特


  結論： 除了後面公路追殺戲 西恩潘 女兒選角 其餘無感


  比甘草披薩

  比hard eight

  比性本惡

  都差

  請自行填空___


  Master我在飛機上看過  他最巔峰時期 不可能是倒數檔次

  -----

  Sent from JPTT on my iPhone


  --'
