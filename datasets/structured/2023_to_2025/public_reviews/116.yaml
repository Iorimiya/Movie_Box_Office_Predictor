url: https://www.ptt.cc/bbs/movie/M.1758785862.A.800.html
title: '[微好雷] 一戰再戰  觀後感'
content: '雷文防雷資訊頁



  衝著李奧納多 事前沒做甚麼功課  就決定要看這部電影


  早上在板橋威秀看了IMAX  影廳空蕩蕩的沒甚麼人


  但不減這部片的精采


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~










  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  故事的真正核心  不是三位大咖男星


  而是李奧劇中的女兒  充滿著衝突的角色


  母親是地下組織一份子 黑人 打著革命的旗幟為非作歹

  但後來成為抓耙子 把自己同夥抖出


  名義上的父親也曾是其中一份子 白人 和女兒的媽一起幹了不少破事

  但女兒出生後就只想安穩生活


  真正的生父 白人 也就是本片的反派  是一個軍官  年輕時搞了女兒的母親

  為了加入一個白人主義的組織  因此想抹消過去


  然後在女兒16/7歲參加舞會的那晚  發生了一連串精彩無冷場  既現實又荒謬的故事



  我自己是從小看李奧電影長大的大叔  可能多少帶點粉絲濾鏡


  這部片他雖然很多橋段像小丑  但也真實呈現了一個普通人 在遇到危機時該有的樣子


  比較可惜之處就是沒有太多和西恩潘對壘的橋段  稍微有點不過癮


  但喜歡看李奧演技的  真心覺得不要錯過這部片



  另外本片非常有自己的風格  我沒看過這位導演的其他電影


  但看過之後印象很深刻  之後會去找他的作品來觀賞



  至於本片可能想要探討的各種議題  基本上不是我關心的範圍


  所以我純粹把這部片當成爽片來看  其實還不錯


  尤其是飾演李奧女兒的演員  總算是找一個夠美的女黑人來飾演了


  --'
