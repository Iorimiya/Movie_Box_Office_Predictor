title: 'Re: [超負雷] 一戰再戰 真的爛死'
content: '我最近去電影院看了


  1.角頭 鬥陣耶


  2.一戰再戰


  角頭看完，是在演什麼？好像有點印象我剛剛有看過電影，但真的全系列看過了，還是只

  有第二集才對胃口。


  一戰再戰我還去威秀GC看，花了2000多，想說160多分鐘應該還不錯？然後邊用餐邊看電

  影，電影就結束了。我這個160分鐘，我根本不知道在演什麼？唯一最有印象的，大概是

  威秀的德國豬腳很難吃。其餘的沒印象


  可能太木頭了，這兩部我連討論的感想都沒有。各位可以噓我了



  --

  角頭我個人還有印象，一戰再戰就只有豬腳很難吃的印象。但我女友說還可以，可能不是

  我愛的那種電影…'
