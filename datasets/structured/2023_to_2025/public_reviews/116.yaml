url: https://www.ptt.cc/bbs/movie/M.1764776990.A.583.html
title: '[新聞]李奧納多狄卡皮《一戰再戰》連'
content: '李奧納多狄卡皮歐好尷尬？《一戰再戰》連奪兩獎　自己卻沒拿影帝


  進入年底也宣告奧斯卡造勢熱季來臨，李奧納多狄卡皮歐《一戰再戰》


  連續拿下高譚獎與紐約影評人協會的最佳影片，他卻都沒獲獎，


  甚至紐約影評人協會還選出戲分不到他1/3的班尼西歐戴托羅為


  最佳男配角，有如重演前年李奧納多《花月殺手》像是替戲分都比


  他少的勞勃狄尼洛、莉莉葛萊史東抬轎，再次陷入有點尷尬的局面。


  李奧納多近年來賣座落漆　挑戰演技常被配角搶戲


  李奧納多狄卡皮歐被稱為「好萊塢最後一個真正的巨星」，但他的


  票房號召與演技吸睛度，近年來似乎都陷入瓶頸。《花月殺手》和


  《一戰再戰》都不是容易在商業上獲得成功的題材，因此票房先


  後失利，外界還不會直接為李奧納多貼上「毒藥」標籤，


  倒是他希望戲路有所突破，得到的迴響都不如預期，


  《一戰再戰》整體評價高，片中的配角卻比他更搶戲。


  為了拚角逐奧斯卡的機會，眾家大牌在年底會頻頻於各大娛樂界活動上現身，


  李奧納多狄卡皮歐也不能例外。他在上個月湯姆克魯斯獲頒奧斯卡


  榮譽獎時就到場，就是希望爭取業界人士對他的支持，哪知道在前哨戰目前表


  現不算特別突出，只有《一戰再戰》片子本身實力頻受肯定，奧斯卡呼聲持續走旺。


  紐約影評人喜愛巴西男星　影片聲勢大漲


  紐約影評人協會象徵美國東岸精英的口味，與奧斯卡的方向不盡然都相符，


  卻還是有為戰況指出方向的作用，李奧納多狄卡皮歐在最佳男主角


  不敵《這不只是個間諜故事》巴西男星華格納莫拉，《這》


  片也另外拿下最佳國際影片。最佳女主角是《If I Had Legs I’d Kick You》蘿絲拜恩

  ，


  最佳女配角則是《凶器》中表現讓人印象深刻的資深女星艾美麥迪根。


  班尼西歐戴托羅其實已經是第2次受到紐約影評人協會肯定，25年前


  他憑《天人交戰》獲得最佳男配角，之後就抱走一座奧斯卡小金人，


  《一戰再戰》也有機會讓他爭取第2座，聲勢比李奧納多以該片問鼎


  第2座奧斯卡影帝強一些。最佳導演則頒給了遭伊朗政府判一年監禁、


  緩刑兩年的《只是一場意外》賈法潘納希，最佳動畫電影由現象級夯片《Kpop 獵魔女團

  》勝出。






