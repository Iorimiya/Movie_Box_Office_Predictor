url: https://www.ptt.cc/bbs/movie/M.1759117991.A.943.html
title: '[] （微雷）對「一戰再戰」沒感情很正常'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  一戰再戰這部電影，述說著不同族裔心中的「自由」，一邊是「人生而自由平等，想在美國大陸自由生活的墨西哥非法移民」，另一邊是「移民必須合法，捍衛國家主權的邊境警察與軍隊」。


  李奧納多飾演的傻傻革命衛隊（墨西哥非法移民），與其老婆經歷一連串的事件後，老了、年紀大了，想開始享受生活的時候，女兒的生父是誰變成本戲的焦點。


  台灣因爲是海島，所以比較沒像美國長邊境防堵移民的問題。但是「革命衛隊」可以看做獨派或統派想要實踐某些理想但終究是夢一場的假想。這樣電影看起來或許有一點聯想。


  美國人因為可以合法擁有槍枝，所以他們逛槍店像是我們逛體育用品店一樣，各式各樣的槍枝與子彈任君挑選，他們有些運動用品店還附有槍枝的專門櫃位，槍枝這個東西，在美國見到的機率高過羽毛球拍。各地都有靶場，室內的室外的，想真槍實彈的練習，隨時可以實現。


  美國是種族大熔爐，路上隨時可見黑人、白人、黃種人、墨西哥裔。尤其是加州，路上遇到台灣裔、中國裔、韓國裔、日本裔、墨西哥裔的機率，比我們在台灣見到外勞的機會還高。


  美國人講英文的語速，是快到靠杯的，他們根本不管你聽得懂還聽不懂，他們認為英語就是天朝上國的語言，不會配合聽不懂的人的語速的。聽不懂？那就乖乖閃一邊去吧。


  本片最後的荒漠公路鏡頭，很有加州州際公路的感覺，一望無際、渺無人煙。可能有開過那樣公路的人才能體會戲中人的感受。


  前些時候我在美國加州旅遊的人，完全感受到遠在一萬公里外的台灣小島與北美大陸是多麼的不同。說是一個地球、不同世界，並不為過。




  --

  Sent from nPTT on my iPad Pro 11-inch (3rd generation)


  --'
