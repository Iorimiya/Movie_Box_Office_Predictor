title: '[好雷] 一戰再戰，PTA將拿下奧斯卡桂冠 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~
















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  小品的甘草比薩只能算PTA的開胃菜

  大導演過了3年，千呼萬喚端出野心之作一戰再戰

  預算1.3億，片長160分鐘都創下生涯之作


  光是開頭那場奇襲戲就讓人坐不住拉

  太帥氣拉

  PTA的鏡頭真的是用得太炫了，一開始就把觀眾挑逗到高潮


  之後節奏也停不下來

  全片非常緊湊，突發事件一件接著一件，不給觀眾喘氣

  兩條線(Chase Infiniti與皮卡丘)進行交錯呈現

  並且由大反派Sean Penn貫穿這兩線


  劇情腦洞大開，千萬不要去探究細節

  角色都有一種荒誕的喜感，給人動漫式的感覺，讓觀眾哭笑不得

  讓觀眾理解這是一個架空的隱喻政治喜劇


  當然這片的政治隱喻不難懂

  不過也不要太敏感，這片開拍於2024年1月，那時候沒人知道同年11月的選舉結果的

  當作是PTA這幾年的有感而發就好


  PTA的奧斯卡最佳導演影該是囊中之物了拉

  他的鏡頭語言跟調度真的太神了

  Chase Infiniti演技還是稍弱一點，不看好入圍奧斯卡女主

  應該可以入圍BP、最佳導演、最佳男配角、最佳改編劇本、最佳配樂、最佳剪接s


  --'
