  「越南百萬DJ天后」首度演出恐怖片


  阿南（吳光俊 飾）的家族世世代代從事 #狗肉屠宰業，因為不想跟隨父親的腳步，他離

  開老家到遙遠的城市工作。


  某天，阿南得知父親過世的消息，決定帶著女友回老家幫忙處理後事。


  沒想到，阿南回家之後竟然開始撞見各種靈異現象，他的家族恐怕沒有想像中的單純…


