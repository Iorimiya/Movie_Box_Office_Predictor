title: '[有雷]《鬼厄犬》越南民間傳說電影'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  改編自越南家喻戶曉恐怖傳說「戴帽子的鬼狗」

  有興趣的可以先看一下預告




  傳說當母狗生出一窩小狗

  如果母狗與其他小狗接連死亡

  最後一隻留下的紅鼻子白狗，也就是惡魔轉生

  也會帶給飼主家破人亡



  白天惡魔會以白狗的形式出現

  有時候還會趁著一家之主不注意的時候

  對著主人笑

  到了晚上以後就會轉化成惡魔型態

  然後戴著帽子著柺杖爬上屋頂監視大家


  那時候看介紹的形容覺得好可怕

  以為會有很可怕的劇情

  結果劇情怎麼有點像民視《夜市人生》那樣


  無非就是哥哥偷吃弟弟的妖豔老婆

  弟弟發現以後，又不能拿哥哥怎樣

  就想要扳倒哥哥把狗肉店生意自己做

  總體來說劇情我可以猜得到

  （這邊不爆雷太多，有興趣的可以自己去看




  值得誇獎的地方就特效跟拍攝手法

  讓人很沈浸式那樣吧

  狗頭人身、人頭狗身那樣

  因為圖片太噁心了我就擋起來了



  尤其是狗肉攤用噴槍烤整條狗

  然後瘋狂剁肉

  或是菜市場魚肉活宰、砍掉牛蛙的頭

  結果還在扭動那樣子，有點重口味


  因為劇情都是在家裡發生

  然後我看完真的昨晚都不太敢睡覺

  很怕床底會跑出什麼...  _



  以上分享到這邊

  謝謝大家的收看

  喜歡看越南電影or民間傳說的可以去看看


  --'
