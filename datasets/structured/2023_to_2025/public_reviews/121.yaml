title: '[好雷] 《醜得要命》Ugly - 代替執行眾人的罪'
content: "屍速列車 地獄公使 導演 延尚昊 最新力作\n\n\n今年九月底曾經上映過\n\n\n\n\n\n\n雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n (刊登於網誌的原文，含圖片)\n\
  \n\n\n第一次會知道延尚昊這部片是因為在網路上看到他已女兒在看YT為靈感想出一個低成本的\n拍片方式（有興趣請自行搜尋），而後票房的確不錯。\n\n\n《醜得要命》有賴於情節相當引人入勝的劇本，韓式懸疑再次展現不落俗套的結構和故事\n\
  推進，比較令人詬病的應該是過於激化的善惡對立，如在《地獄公使》自己認為劇本上短\n板。\n\n\n不得不說《醜得要命》在概念上獨到之處，以艱苦生活的弱勢盲人使用觸摸方式刻出美麗\n\
  印章，表達一種看不見的「內在美」同時享有名聲的外在「世俗美」和在世功名之間游移\n。\n\n\n故事回望四十年前的死亡事件，說出了對於看不見之人掙扎的「美的標準」，不得不聯想\n\
  ，在《地獄公使》談的宗教層次，關於個體與群體之間信仰與認同的價值標準是如何被產\n生的？\n\n\n盲人篆刻師從苦中作樂與女主角相遇，看似並非用外表，而是「交心」的完善之美，後來\n\
  卻遭到世俗誘惑，被言語影響「動了凡心」的外在美。\n\n\n同時回顧以往從《釜山行》漫畫後來的《屍速列車》電影，延尚昊就關注底層與資本社會\n罪惡的「下游」，似乎有跡可尋，探討在階級差距懸殊與受基督教影響的南韓社會，窮人\n\
  （或遊民）看似再也不努力般消極，或本片以儒家傳統，貧賤出身不斷努力向上進而「成\n功」的「以善為優先」的信仰價值表面，隱藏著是一種更幽微，進化提煉而成一種南韓當\n\
  代社會更媚俗，更加卑劣式信仰價值（註1）。\n\n\n電影中的盲人篆刻師一開始被眾人愚弄哄騙，說女主角很美，大家暗地都在笑他，後來意\n外知道被說很醜的妻子，得知到頭來還是那位被大家取笑的對象，於是狠下心殺人將自己\n\
  的「汙點」去除，作為背負罪責同時邁向成功的手段。也就是指出，那些從貧窮，苦難中\n的昇華並非「告解」（如此上到了天堂），而是要讓自己更加地庸俗地（更下地獄般地）\n\
  ，既然大家認為很醜、很該死（而事實上也並非醜，而是因為個性被大家欺負），那就由\n我來代替「眾人」執行，如上帝般承受著大家的罪（註2）。\n\n\n\n（註1）\n\
  聯想到一部日本電影《空白》（Intolerance）\n\n電影劇情主要是一個離婚的家庭，爸爸脾氣不太好，不關心女兒，一天女兒在超市偷東西\n被店長抓到，但女兒烙跑出去店長追出去，女兒越跑越快，結果就被車撞，撞完爬起來，\n\
  後面一台卡車直接輾過…。\n\n這部片有點像是「與惡的距離」在討論關於死亡的「究責」這個很具日本性的問題。而事\n後，店長追出去被檢討，爸爸個性太差還去找店長搞事被媒體拍到也被檢討，店長被檢討\n\
  的比較兇，關於大眾跟爸爸都有壓力，搞得要自殺，最後跑去當臨時工人，並且十分卑微\n地跟爸爸道歉。\n\n印象深刻電影中超商店長最後那種「卑微到底」的姿態。一種日本式的發神經、崩潰暴走\n\
  之後，那種卑微到底的姿態。\n\n\n\n（註2）\n連結到《燃燒烈愛》Burning的末段場景，女主角失蹤的歸咎，鍾秀殺了Ben，好像比較無\n關窮人殺死富人的政治隱喻，而是利用Ben縱火的快感引火自焚並昇華了對鍾秀空蕩的愛\n\
  情，這個場景影像的鏡頭相當成功：透過髒髒的貨車玻璃，看到車後那團火焰，十足階級\n感又抽象又宗教殉道意味。\n\n（看完《醜得要命》發現，導演李滄東以鍾秀的殺人與最後的燃燒來承擔這世界所有的罪）\n\
  \n--\n\n拉特飯 - 以商業力量進入獨立市場\n\n--"
