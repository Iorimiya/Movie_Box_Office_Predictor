url: https://www.ptt.cc/bbs/movie/M.1613406446.A.8E7.html
title: '[新聞] 遭「曼達洛人」開除！吉娜宣佈籌拍新電影'
content: '遭「曼達洛人」開除！吉娜卡拉諾宣佈籌拍新片





  自從「曼達洛人」日前宣佈開除吉娜卡拉諾（Gina Carano）之後，她終於打破沉默，宣

  佈自己將籌拍新片。



  吉娜卡拉諾原本是綜合格鬥技選手出身，並在2006年至2009年之間交出了七勝一敗的出色

  戰績，之後才選擇轉戰電影圈，並在2011年主演了由史帝芬索德柏執導的動作片，在片中大秀靈活身手。



  自此以來，吉娜卡拉諾接連演出了等片，並在



  可惜吉娜卡拉諾始終管不住自己的嘴巴，不僅嘲笑戴口罩和肺炎疫苗，甚至對郵寄投票和

  總統大選結果也是砲聲連連。她在經過一再告誡之後卻依然故我，日前更將自己這些保守

  派人士比喻為慘遭納粹屠殺的猶太人，盧卡斯影業在忍無可忍之下終於揮淚斬馬稷，宣佈

  開除吉娜卡拉諾。



  盧卡斯影業日前發表聲明指出：「吉娜卡拉諾目前並不受雇於盧卡斯影業，未來也沒有相

  關計劃。無論如何，她在社群網站上四處詆毀人們的文化信仰認同，仍然是無法接受的行

  為。」




  根據好萊塢記者報指出，盧卡斯影業早在兩個月前就一直想找理由來炒她魷魚，而她這番

  自比猶太人的言論，正是壓垮駱駝的最後一根稻草。報導中更爆料，星戰外傳影集「新共

  和國遊騎兵」（Rangers of the New Republic）原本曾計劃邀請吉娜卡拉諾主演，但她

  去年11月在社群網站上不斷失言，才讓盧卡斯影業暫時壓下這個決定。



  如今吉娜卡拉諾不僅慘遭「曼達洛人」掃地出門，更賠上了主演外傳影集的大好機會，可

  謂是得不償失。但



  吉娜卡拉諾解釋道：「每日連線將助我美夢成真，籌拍製作我自己的電影。我大聲呼喊，

  而我的禱告也獲得了回應。對於活在恐懼裡、害怕自己被極權暴徒所消聲的每個人，我將

  送出一個充滿希望的訊息。」



  吉娜卡拉諾宣稱：「我才剛要開始發出屬於自己的聲音，而我現在也變得比以往來得都更

  加自由，我希望這能啟發他人加以傚仿。只要我們起身反抗，他們就無法消滅我們的聲音

  。」




  每日連線是由右派政治評論家班夏皮羅（Ben Shapiro）所成立的保守派新聞網站，雖然

  跟好萊塢素無瓜葛，但每日連線上個月才發行了旗下第一部電影，描述校園槍擊案的《校

  園大逃殺》（Run Hide Fight）。如今每日連線更跟吉娜卡拉諾攜手合作，顯然極有野心

  想跨足電影圈。







  --'
