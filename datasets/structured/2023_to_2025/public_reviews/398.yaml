title: '[情報] 2022 奧斯卡主持人：艾咪舒默、蕾吉娜霍爾、汪妲賽克絲'
content: "自 2019 年以來，奧斯卡已經舉辦了三年沒有主持人的典禮，不過在今年的奧斯卡上，終\n於確定會有主持人與大家見面了，在 Variety 的獨家報導也首度曝光了人選！\n\
  \n今年的奧斯卡將會由三位女演員共同主持：\n\n\n\n《喜新不厭舊》Wanda Sykes\n《姐姐愛最大》Amy Schumer\n《閨蜜假期》Regina\
  \ Hall\n\n今年的典禮節目製作人也將由《閨蜜假期》的製片 Will Packer 擔當，目前尚無法得知三\n位主持人將會以甚麼形式來主持典禮。\n\n\
  本屆奧斯卡已早早確定會有主持人，外界也一直在猜測睽違多年的主持人將會找來誰，先\n前包括在近年的典禮上獲得好評的頒獎人《週六夜現場》班底 Amy Poehler、Tina\
  \ Fey 與\n Maya Rudolph，以及去年以《破案三人行》廣受好評的三位主演 Steve Martin、Martin\nShort 和 Selena\
  \ Gomez 皆為熱門人選。據傳《廣告狂人》男星 Jon Hamm 也曾與製作人\n會面過。\n\n去年的典禮因為疫情改在洛杉磯聯合車站舉辦，今年則確定正式回歸固定的場地杜比劇院\n\
  。典禮將於 3 月 27 日正式舉行。\n\n目前負責轉播節目的 ABC 拒絕為此消息做出評論，正式將於週二早上的節目《早安美國》\n中公布。\n\n\n--"
