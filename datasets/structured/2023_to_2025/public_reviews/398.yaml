url: https://www.ptt.cc/bbs/movie/M.1621018492.A.30A.html
title: 'Fw: [新聞] 慘遭開除！《曼達洛人》仍推吉娜角逐艾美'
content: '作者: kimisawa (楊回血了。) 看板: EAseries

  標題: Re: [新聞] 慘遭開除！《曼達洛人》仍推吉娜角逐艾美

  時間: Sat May 15 02:46:36 2021



  最近老鼠跟盧卡斯很多發展

  先說結論: KK無限期休假中直到合約結束 強法洛上台


  流程大概是這樣的


  曼達洛人第二季路克回歸 --> KK陣營不知情 --> KK不爽就故意找理由開除開除Gina

  來蓄意搞強法洛 --> 強法洛不爽開始聯合Chapek反撲 --> KK 被冷凍直到合約結束


  1. 強法洛的曼達洛人成功打臉 KK的星戰 KK忌妒

  2. 曼達洛人的主角Pedro Pascal推特之前推過更糟的都沒事, 所以一個推特就開除不合理

  3. 消息是KK就藉機要搞強法洛開除Gina

  4. 強法洛本來要第三季給Gina更大的戲份 被KK一搞要重寫劇本

  5. 然後她的獨立劇 Rangers of the New Republic 被KK一搞要暫停

  5. 強法洛不爽鬧到 Bob Chapek那

  6. D+開除Gina掉了很多訂閱 Q2沒有達標 比預期少了300萬

  7. Chapek Q1投資人大會上被股東洗臉

  8. 富比世出了一篇文章洗臉迪士尼, Chapek很難堪


  KK的陣營

  1. 星戰三部曲的人氣糟

  2. 星戰樂園新三部曲為主題評價爆炸

  3. 玩具賣的爛到 玩具商不願意出新三部曲的東西

  4. 舊系列與曼達洛人的玩具賣翻

  5. 主打的High Republic漫畫小說評價爆炸 被粉絲跟社群嚴重洗臉


  最近的小說事件

  1. 亞馬遜上架了一本粉絲出版小說 Heart of the Jedi(已下架, ebay炒作中)

  2. 賣贏所有High Republic的書  KK陣營極度難看

  3. 這本書是15年前賣給老鼠前本來要當正史的 老鼠買盧卡斯後就取消了

  4. 目前乳摸是強法洛陣營的人刻意推出要給迪士尼的投資者看, 老星戰才是王道

  5. 這本書的製作太精美不是普通的同人做


  其他

  1. 敵視尼/國家地理有一集 Running Wild with Bear Grylls 有Gina

  2. 這集本來被取消，但是前幾天又公布會如期上映

  3. 上映的觀看數非常高 非常多人挺Gina

  4. 原本艾美獎沒有Gina的名字 這兩天又放出來

  5. 消息說敵視尼正在跟Gina重新談回曼達洛人

  6. The Book of Boba Fett 片場有人看到Gina 不知道是探班還是有其他原因

  7. 被取消且下架的 Gina 玩具 最近又被重新上架了



  基本上

  之前Bob Iger找KK進來 現在Iger跑掉, 如果星戰繼續虧錢, 帳會算在Chapek頭上

  所以Bob Chapek要拱強法洛上台 = $$$ 背後做了不少事 昨天Q2投資者會議就已經刻意

  淡化KK 之後會讓KK掛名做完印第安那瓊斯後給她一些成就獎之類給她台階下


  乳摸大家看看吧



  --



  --


  盧卡斯的頭Kathleen Kennedy

  有提到印第安那瓊斯 那是電影喔'
