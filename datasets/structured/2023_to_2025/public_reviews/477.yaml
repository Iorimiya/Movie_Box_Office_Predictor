url: https://www.ptt.cc/bbs/movie/M.1745127427.A.FD4.html
title: 'Re: [負雷] 器子 和 命中註定那頭鵝 '
content: '導演想講太多，又沒時間鋪陳細節，只好濫用剪接交錯。全片真的靠張孝全一個人撐起整

  部片。


  親情太刻意，虐殺又不夠狠，幾場打鬥連血都沒噴，我實在感受不出來打得有多狠。周處

  的動作戲打得還比較狠。


  整部片我真的希望導演不如一本道拍好專心復仇（韓片大叔、好萊塢傑森史塔森給你抄還

  不會）、虐殺場景多幾個夠狠，好好把父親為了報仇女兒的恨全部拍出來，都比你拍反轉

  來反轉去好多了。台灣真的很缺這種一本道夠狠的復仇商業片。




  --'
