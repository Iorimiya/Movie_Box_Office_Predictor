url: https://www.ptt.cc/bbs/movie/M.1742131893.A.77F.html
title: '[大負雷]命中註定那頭鵝  近年最難看國片 '
content: '我國片不是看特別多 但也看過一些

  命中註定那頭鵝 可能是最爛的幾部 或就是那一部

  我不懂為何這樣的成品可以端出來

  嫌台灣的國片市場環境不夠差 ?

  來破壞一下詹懷雲粉絲的信心 來破壞一下國片觀眾的信心 ?


  這是一部拍給幼兒看的片子

  完全沒有邏輯 充滿自以為是的裝可愛

  探討的議題超級幼稚 或是根本沒有議題 ?

  節奏緩慢 是那種很老很老的國片的緩慢

  都是一堆尷尬的拍子 讓人臉會僵掉那種

  角色動機和情感 全部都是架空的 假假的

  說是純愛 老實講 沒有說服力的情感 我管她純愛不純愛

  就是假的


  很失望啦 國片會越來越慘 觀眾對國片越來越沒信心

  就是這種片子害的

  聽說是製作公司要挺朋友而製作的電影

  但友情是你們的事吧 有必要牽連到台灣電影的品質 與觀眾信心嗎 ?


  看完覺得浪費時間 特地發一篇雷 讓大家不要踩雷



  --'
