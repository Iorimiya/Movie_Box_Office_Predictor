url: https://www.ptt.cc/bbs/movie/M.1744803357.A.D2B.html
title: '[負雷] 器子 和 命中註定那頭鵝 '
content: '我去看了器子 剛好有票

  看完後 加上前陣子看了鵝

  心中真的一團疑惑


  我就問 有器子和命中註定那頭鵝這樣的電影

  國片怎麼能不垮？

  到底大家在努力什麼 政府預算在編什麼？

  拍了器子 連故事都講不清楚

  拍了那頭鵝 票房爛死又難看 是因為老闆想要挺朋友？


  為何我們還需要進場支持國片？

  命中註定那頭鵝還是拿補助的

  請問這樣子該跟納稅人道歉嗎

  器子 你們對得起電影產業

  對得起我們還傻傻支持國片的觀眾嗎


  我得說 如果連我都有天不願意進場了

  國片就真的沒有人看了

  請有才氣和認真的人 快快拍一部片子來滋養

  讓國片還有一口氣 留一個出路吧



  --'
