url: https://www.ptt.cc/bbs/movie/M.1697625051.A.79B.html
title: '[好雷]  《坎達哈行動》微量劇透'
content: "其實不是很訝異，同年度有蓋瑞奇的絕地營救這樣的電影，\n\n大家會把「坦達哈行動」和前者相提並論也是理所當然。\n\n（雖然「絕」片在美國意外地沒上太多戲院，但至少贏得了人心，口碑都是算好的。）\n\
  \n\n「坎達哈行動」相對來說，有種大拼盤的感覺，可以看得出想盡量照顧到\n\n各種立場，角色設定其實都是滿吸睛的，照理來說故事線應該比「絕地營救」\n\n豐富許多，但很可惜後面劇情太多支線沒辦法一一收完，不夠盡善盡美，\n\
  \n就真的把它當作公路電影看會比較好。（如果要改編，影集或許有更多時間鋪陳\n\n這麼多有意義的角色。）\n\n\n但如果純粹是想看戰爭軍武題材的，可以看這部的各種有趣角色，例如：\n\
  \n願意留在受苦受難的阿富汗隱名埋姓當線人的溫柔女子，只需你一個擁抱\n\n替她充電>/////<\n\n\n在意「是否支持小女生受教育」的有趣塔利班高階士兵（他算高階吧？至少大家願意\n\
  \n聽他講話），面對一堆先知走了也不知道怎麼辦的人，他可以無懼地滔滔不絕要\n\n大家質疑這種決定是否政確，一面在交友軟體對西方女子的配對感到「性」奮，\n\n\
  單槍匹馬騎著帥氣的機車詢問「應該是敵方立場的」小朋友為了抵抗塔利班\n\n「是否真的讀過可蘭經？」（曾受西方教育的人都知道，最棒的老師往往不會全盤\n\n告訴你答案，只會要求你別什麼都是「老師說得對」和「謝謝老師」。）\n\
  \n\n說真的，對西方女子性奮不好嗎？如果女子能帶給你進步價值，\n\n經濟獨立不靠你吃穿不用你養、有自由思想督促你前進、穿得也特別養眼讓你看飽飽，\n\n如百花齊放供你選擇，不知道是下半身管腦、還是腦管下半身，\n\
  \n未嘗不知這是一種福氣呢？\n\n\n\n再來，主角其實是個進退兩難、有中年危機的男子，對妻子有愛但長期缺席，\n\n看到妻子只是跟閨蜜出去玩就疑神疑鬼，在乎妻子是否已經「有人」了？\n\
  \n\n被問趕快簽離婚協議也是看得出Gerard Butler真的是硬底子好演員，\n\n不想讓「愛」變成「礙」，卻還是自認自己雖有高學歷、不適合「老婆覺得好\n\
  \n就是為你好」的職場要求，他的那句「我還能做什麼工作？」實在道盡許多退役士兵\n\n（不能用「老兵」這詞，年輕士兵受到衝擊而退役的大有人在）的滄桑。\n\n\n\
  許多退役士兵是真的離職之後，發現自己很難適應「平凡人」的工作，\n\n但說真的，Gerard Butler的主角有這麼自我侷限嗎？\n\n他在臥底時做的電信行生意也是有模有樣啊。\n\
  \n\n接下來就不爆雷了，我自己是滿喜歡Gerard Butler的「天劫倒數」和「愛在回家時」，\n\n這部是帶著粉絲濾鏡在看他飆演技，不覺得浪費時間就是了。\n\
  \n\n至於換輪胎也能吵架那幕，我是覺得滿寫實的，有時戰到最後都忘了\n\n「自己先活下來，才能救更多人」的道理。\n\n--\n\n幻想●---------------☆\n\
  /﹀\n/\\ \n\n按a加入最愛\n\n--"
