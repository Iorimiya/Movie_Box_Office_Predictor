url: https://www.ptt.cc/bbs/movie/M.1695047510.A.09E.html
title: '[好雷] 限時追捕 Misanthrope'
content: "雷文防雷資訊頁\n\n限時追捕\nMisanthrope\n2023美國電影\n\n\n\n『★犯罪懸疑鉅獻 ★惡魔誕生都有理由 跨年夜人們遭到死傷慘重的無差別狙擊，探員決\n\
  定與心理創傷的年輕女警合作。』跨年夜，在煙火的掩護下，巴爾的摩市中心一棟高樓裡\n的人們遭到無差別狙擊，不久，鄰近大樓射出子彈的房間又發生爆炸。這起案件死傷慘重\n\
  ，兇手卻沒有留下太多線索，讓警方陷入困境。參與此案調查的年輕女警伊蓮娜（雪琳伍\n德利 飾）正飽受心理創傷折磨，卻讓她意外能夠理解兇手的想法。為了解決這起案件，F\n\
  BI資深探員傑佛瑞（班曼德森 飾）決定與伊蓮娜合作……。\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\n\
  個人滿意度80分（滿分100），驚悚，血腥，暴力，懸疑，槍戰，刑事探案等元素融合的\n娛樂佳作。編導演表現均佳。警世感濃厚。\n\n以下有劇透，暴雷。\n\n\n\
  \n1.血腥暴力槍戰不少，一開始的劇情畫面之驚心動魄，非常精彩緊張，查案過程也相當懸\n疑驚悚，但收尾有點弱掉？凶手降智及疲累之自我放棄...\n女主Eleanor的男夥伴傑佛瑞實在太賣命了，慧眼識英雄之看到女主的探案天份，若不是\n\
  自己如此認定探案天職，鍥而不捨地追凶，好好退休和伴侶一起生活，不是也很好？幸好\n女主最後為這位可敬的夥伴，爭取到了一些尊嚴及福利。\n\n2.紮實的復古驚悚片：有影評人將本片與經典名片《沉默的羔羊》進行比較。\
  \ 這片是對\n90 年代更多懸疑、驚悚片的回歸，但它不是《沉默的羔羊》。 這片的兇手槍法神準及凶\n狠，而且死亡人數眾多。 劇情節奏相當不錯，首先，開場鏡頭會吸引你的注意力，\
  \ 後來\n每場表演都進行地令人屏氣凝神的欣賞，最後凶手身份的揭露及探詢，都令人揪心，全片\n是劇情紮實的驚悚片。\n\n3.女主Shailene Woodley對我來說，從來沒有以任何特別值得注意的方式脫穎而出，她總\n\
  是很好地扮演自己的角色，但在我看來，還不足以算令我刻意期待在電影中看到的演員，\n直到現在這部片。她在本片表現非常亮眼，作為一名性格不穩定的巡警Eleanor，表現得\n\
  如此有力和可信，幾乎搶盡了風頭。 女主的搭檔Lammark，Ben Mendelsohn成功地對一位\n年邁、衰弱的聯邦調查局高級偵探進行了豐富、引人注目和有力的演繹，很難判斷誰在各\n\
  自角色的功效方面勝過對方。 對我來說，他們就像是一個場景一個場景地把卓越的接力\n棒傳遞給彼此。\n儘管一些象徵性的反派角色和場景有點誇張，但大多數其他人的表演，也高於平均水平。\n\
  \ 對於Ralph Ineson來說尤其如此，他是一位低調的好演員。\n\n本片收尾前，故事有點改變了方向，這讓結局感覺不平衡，有點不令人滿意。 然而，回\n\
  顧過去，我認為採取某種轉變的方式，可能是他們能做的最好的事情。 如果他們朝任何\n其他方向發展，就很容易將其視為一部以可預測或“之前完成”的方式結束的電影。\n\
  \n事實上，本片的結局，和它開始呈現的方式一樣：作為一部堅實的、獨立的故事片，自始\n至終都是身臨其境、緊張且發人深省的。\n\n限時追捕\nMisanthrope\n\
  2023美國電影\n\n--"
