url: https://www.ptt.cc/bbs/movie/M.1693472486.A.C4E.html
title: 'Re: [好雷] 限時追捕 (惡世之子)'
content: "（感謝原PO拋磚引玉，我這篇偏30%劇透而已，適合還沒看片的觀眾參考）\n\n預告\n\n\n\n\n\n本片的英文名字應該有兩個，「To Catch\
  \ a Killer」和「Misanthrope」，\n\n後者應該比較貼近劇中反派的詮釋吧？\n\n\n這部我是在MOD上看的，\n\nShailene Woodley演這麼沉重的戲份實在讓人心疼，又忍不住想看看她\n\
  \n面對各種情境是如何處理的，身為一個照顧過身心症的人非常能感受\n\n她在扮演女警時的各種厭世情緒，但導演與剪接都非常加分，\n\n讓這部片顯得相當緊湊，至於本片有同志情節，又有些汙名化想參軍者的嫌疑，\n\
  \n許多右派應該看不太下去XDDD\n\n\n（但是很感謝編劇給予這種反社會人格更多的哲學性思辨，兇手提出的許多\n\n問題，還真的會讓人跟著陷阱一步步走到無路可退。）\n\
  \n\n以下本段取自第二段預告的網友發言：\n\n「就劇情上有很多地方借鏡美國真實案例（2017年拉斯維加斯槍擊案），\n\n例如兇手在高樓上朝下掃射、一樣有大量的被害者、現場在戶外週遭很吵雜」，\n\
  \n這些我還真不知道QQ\n\n\n上次看到Shailene Woodley是在神鬼駭客史諾登了，\n\n雖然她曾因為過於個人主義的發言在國外有些黑粉，但實力一直都在，\n\
  \n這次可以看她不需要靠姿色扮演別人的女友，而是真正成為一個強大又擁抱\n\n人生各種轉折的女性，身為影迷我是相當推薦的。\n\n\n--\n\n幻想●---------------☆\n\
  /﹀\n/\\ \n\n按a加入最愛\n\n--"
