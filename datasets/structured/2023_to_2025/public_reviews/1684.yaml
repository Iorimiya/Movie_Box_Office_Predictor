url: https://www.ptt.cc/bbs/movie/M.1693458574.A.25C.html
title: '[好雷] 限時追捕 (惡世之子)'
content: '一個女警推薦給我看的片

  他以一個女警的角度說拍的很殘酷

  但我以一個看戲觀眾的角度就還好

  警消都不喜歡吃鳳梨等加工食品

  怕會業務太旺忙到死或英年早逝

  只想平平安安早點退休吃終身俸


  這片開始在1月1日元旦跨年狂歡夜

  大家都在開新年派對狂歡吃年夜飯

  女主角是個女警接到110報案去處理

  是一個餐廳一位阿嬤坐3小時不肯走

  現在餐廳都拚翻桌率時間一到就趕人

  像壽司郎就只能吃一小時


  女警一到老闆就要求她強制趕人

  但旁邊都還有很多空桌，旁人也幫阿嬤說話

  阿嬤新年一個人吃年夜飯獨自喝酒消愁

  女警對阿嬤說不能帶酒進餐廳

  又對老闆說阿嬤顯然有心事

  你讓他把飯吃完她就會走了

  但老闆看阿嬤不爽堅持趕人


  女警在無奈之下突然對講機通報有大案

  還是用緊急代號，老闆還問代號是蝦米?

  女警就馬上脫困，趕忙快閃跑去處理驚天大案


  有狙擊高手在高樓處隨機射殺對面大樓的人

  一共射死了29人，每個都是一槍斃命

  中頭、頸、胸，是狙擊界高手中的高手


  所有警察趕往現場，研判槍手在對面大樓

  結果對面大樓出現狙擊槍的雷射光

  自己故意曝光自己行蹤，隨後爆炸

  嫌犯炸毀第一現場，消防隊前去滅火

  把所有指紋鞋印跟證據都沖掉了


  警察本想封鎖大樓

  但保全怕整棟大樓被炸掉

  就立即疏散大樓群眾，就讓槍手跑掉了

  女警用手機拍每個跑出來的人蒐證

  然後帶回派出所做人臉辨識比對


  FBI派調查局的幹員來支援地方管區

  連反恐部門也想來插手的這個大案

  到處抓可疑激進的回教徒想破案

  但反而逼死無辜的中東年輕人跳樓


  幹員看上了女警一起合作抓人

  女警以為幹員想跟他上床才用她

  但幹員是同志，同婚一合法就馬上結婚

  還邀請女警去家裡吃飯，才解開心結


  查了半天找不到人

  結果還是等槍手再度犯案才有線索

  在一個大商場裡面槍手在廁所洗澡

  原來槍手是個街友，洗完澡去美食街

  拿客人沒吃完的剩菜來吃，他還吃素


  被人舉報在商場偷人家的衣服

  就被兩個很壯的保全圍起來要看他的包包

  他不得已只能從包包拿出槍來大開殺戒

  連指責他無恥不要臉吃別人剩菜的婦人也被殺

  沒想到他包包裡有機關槍跟十幾顆手榴彈


  隨機掃射殺了十幾個人後

  還很淡定的在商場逛街等特警來抓他

  他依樣很淡定的找位子坐下解下鞋帶

  把鞋帶串在他包包裡面的手榴彈插銷拉環上

  一連串了八顆手榴彈然後起身丟進垃圾桶

  鞋帶一拉插銷全部拔起，然後慢慢走開

  後面一堆特警向前逼近靠近垃圾桶全被炸飛


  最後還是沒抓到人給他跑了

  這個人的技術比軍人或奧運選手還強

  女警跟幹員鎖定一些激進的團體

  但也不是那些人，反而誤殺了不少警民


  後來透過商場監視器跟目擊者指控

  劃出槍手的樣貌，是個大鬍子街友

  一看就像恐怖份子一樣的造型

  因為反社會跟厭世才隨機殺人


  跟女警有個共同點就是都不得志

  女警以前考FBI沒上只能當女警

  槍手想當軍人當不成只能當街友

  等於是一個超級軍事迷變鄭捷


  最後循線找到槍手以前工作的屠宰場

  知道他以前在屠宰場誤殺了人被關2年

  放出來後就失蹤了，然後找去他老家

  看到他媽媽，想要問也問不到線索


  問了半天幹員一樣突然被一槍斃命

  但可能是槍手跟女警的緣分所以沒殺他

  女警跟槍手聊了一下，發現兩人差不多

  槍手說他大概要殺200多人才有人願意聽他訴苦

  不然完全沒人會想理會他這個失業的更生人街友


  他媽媽希望他不要再殺人了

  不愧是他媽就在他面前舉槍自盡

  他沒了媽媽就對女警說他想自殺

  請女警在他死後把他跟他媽火化

  他不希望他跟他媽的屍體被記者

  拿去電視上公審，會影響到其他親朋好友

  就拿汽油澆在他們屍體上燒到面目全非就好


  女警答應了

  但事與願違，大批警察因有人聽到槍聲報警趕到

  槍手馬上又軍魂上身大開殺戒，女警也攔不住他

  最後在大批警力圍剿之下，槍手被打成蜂窩

  理論上這些砲灰警察應該也不是他的對手

  但可能因為他媽媽掛了所以才厭世想自殺


  女警被調查局協商可以破例進入調查局

  條件是不能把這個案件的來龍去脈說出去

  也不能說FBI因為辦案害死那麼多無辜的人

  女警還希望調查局把幹員退休金都給幹員的伴侶

  還要追加幹員的勳章，讓他當英雄

  調查局全都同意，女警因此就升格當FBI了


  是個完美的結局

  很棒的警匪片，槍戰也都很棒

  找阿根廷導演來拍果然不太一樣

  比吳宇森去好萊塢拍得槍戰片更好看

  這導演是拍蠻荒故事紅的，但我實在看不懂

  反而這部片我比較喜歡，比較看得下去


  吳宇森則是香港警匪片比較看得下去

  去美國拍的動作片沒一部好看的


  --

  但願吳宇森有生之年還能再跟周潤發和

  英雄本色系列的攝影黃永恆再合作一部警匪片

  黃永恆最新的攝影作品是超級大爛片長津湖'
