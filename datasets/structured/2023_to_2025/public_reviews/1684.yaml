title: '[好雷]限時追捕-比想像中深度 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  比想像中深度的 本格犯罪電影


  開頭就先殺二十幾個人不手軟


  製作等級再高一點  演員再找知名一點


  會像你想要看到 大衛芬奇、丹尼·維勒納夫導的那種犯罪劇本


  但現在這個成品也不是什麼低配版本


  Damian Szifron早就是拿過英奧、哥雅獎 去過坎城的名導


  的確是用更為深層的視角 拍出美國藏汙納垢之處 深深的無力感


  這樣一個才子 九年才這麼一部作品


  整體來說電影也是被當棄子經營


  背後和好萊塢發生什麼事 還真的有點好奇


  但我不喜歡兇手的結局


  就....死得很一般


  尤其是他在跟女主角那一長串窒息的對話後


  我還以為他會死得很戲劇


  如果真的要說 這部的敗筆在結局



  --'
