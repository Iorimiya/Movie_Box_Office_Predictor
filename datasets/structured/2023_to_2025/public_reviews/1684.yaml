url: https://www.ptt.cc/bbs/movie/M.1682788941.A.85F.html
title: '[好雷]《限時追捕》是什麼讓你一晚狙殺29人 '
content: '你可曾經厭世到想過自殺或殺光旁人嗎？



  本片其實並不是動作片，著重在刑事推理偵查，更甚之，對組織與社會結構的批判。


  或許看完，可以理解為何導演最後想用《Misanthrope》當片名（中譯：厭世、憎恨社會


  ），而不是最早宣傳時的《To Catch a Killer》。




  跨年夜，一名殺手無差別狙殺29人，爾後消失無蹤，不留任何痕跡。FBI臨危授命展開調


  查，在面對地方警局與內部派系的鬥爭下，一名飽受創傷、曾被FBI拒絕的年輕女警，憑藉


  異常心理與觀察力，成了警局與FBI的中間人，然而，參與FBI團隊，與時間賽跑，追緝犯


  人的同時，卻也逐漸體會到體制帶來的無力與厭世。




  本片是《生命中最抓狂的小事》阿根廷導演達米恩斯弗隆，進軍好萊塢的第一部電影，劇


  本也是出自他與人合寫。因此不免猜想，是否能為緝兇類型帶來新的體驗。其結果是，部


  分的表現上確實令人驚喜，但整體卻沒有太多的突出之處，故事甚至略為虎頭蛇尾，不


  過作為類型娛樂與議題批判，仍可圈可點，導演的美學風格與黑色幽默更是值得一看。



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~











  開場直接來的無差別八方屠殺，飛雪、煙火、爆頭與大量警車奔馳，展現了氣勢與獨特的


  光影美學，搭配著音樂，很快將觀眾帶進緊急情勢，跟著主角展開偵查行動。然而，當


  我們看著主角回到家。看著她跟著FBI參與偵查，故事真正側重的部分才終於顯現：這


  其實是關於FBI，以及社會問題的電影。




  看似帥氣的FBI，一開始以支配者的角色主導偵查。我們可以在情節設計與對白上，看


  到他們擁有的資源與偵查技巧，甚至可以從細節的部分看見FBI的辦案思維，鑑識、訊


  問、觀察、側寫、佈局，接著有趣的來了，這些風光底下的黑暗慢慢隨著案情膠著出現。


  選民福祉大於追兇，大眾形象大於行動邏輯，利益交換遠大於正義真相，不同團隊的見縫


  插針、扯後腿、搶時間搶行動搶功勞，政府官員、上級、媒體各種凌駕專業的挖坑指示，


  逼著人們在各種壓迫下做出明知會出事的行動，出錯再找基層扛，兔死狗烹，到頭來，


  FBI也不過是名字響亮的官僚之犬，讓主角幻滅，也應證片名對社會結構的不信任與憤怒。




  而這點正是本片另一個更深層的意涵。本片更是一部關於「標籤」、「偏見」、「階級


  剝削」的電影，其實打從主角登場的第一場戲：「明明餐廳空位還很多，店家卻要警方趕


  走獨自在跨年雪夜用餐三小時的老婦人」就可以看出，而這更可以對照最後主角與兇手的


  餐桌對話、與FBI高層的密談，映襯出強烈的對比與批判。




  事實上，整部片在角色設計上乍看還挺討好SJW，主角方的團隊就是以女性、男同志、


  黑人、拉丁裔所組成，不過這幾個標籤真正用到的並不多，反而更聚焦在主角與兇手的背


  景上。儘管個人對最後第三幕實在覺得又臭又長，格局謎底讓人失望、乏力，雪琳伍德利


  自己當主角又當監製實在太過於自肥，讓角色與邏輯崩壞，但在文本的設計對照上，仍


  具有趣之處。




  主角因童年創傷，產生反社會傾向，自殘自殺，甚至有藥物與精神問題，成了當初申請


  FBI被拒絕的原因，亦是之後被其他人拿來當作攻擊的「標籤」，唯有持槍擔任人民保母才


  能保護她厭世的靈魂，努力活下去。而兇手亦是因童年受到槍擊，身心劇變，受到社會排


  擠，即使想專注在獨自的自然世界，仍受到他者的歧視與霸凌，被同學、同事、整個社會


  貼上了「標籤」，最後只能持槍換取寧靜，努力活下去。儘管一人是英雄，一人是屠夫，


  兩人都是社會結構與階級剝削下的受害者，如同兇手打工時看到的那些一頭頭被屠宰的牛


  隻，一面希冀著純真的天空，一面又困於絕望、無力的命運。





  當然，本片並沒有洗白兇手，沒有給他一個悲慘的設定就指出「暴行是可以原諒的」那


  般左膠，而是從中去談整個環境在此結構下的問題，或許，這在此類型中早已老生常談，


  但諷刺的是，這些問題從未真正地被解決，慘案仍舊不斷發生，就像片中油漆工人所說的


  ，即使人們對有色人種的歧視減少了，但弱勢和底層還是在那兒，那些以光鮮亮麗的姿態


  歧視他人的人們也還是在那兒，甚至還包裝成「新的正義」，讓社會走向更極端的一面，


  譬如第二場屠殺的賣場民眾，或是極端份子槍戰的部分，甚至也讓警方、媒體、政府成為


  共犯之一。




  整部片就是不斷圍繞在此命題，以主線偵查時呈現的社會亂象，副線內鬥爭權時帶出的階


  級暗喻，互相回文，批判當前的美國。而女警主角愛蓮娜從頭到尾沒開一槍，最後仍舊妥


  協體制，繼續掙扎，FBI探員傑佛瑞卻在中間失了心，「我們都得聽命行事」最後命喪「


  想奪回權力」的失心，至於，底層的兇手，則亡在那充滿警燈的冰天雪地，死在那紅藍白


  的國色。




  是的，收尾真的是太失衡，少了開場的那般氣勢，但或許這也是從故事結構上的暗喻，那


  不是煙火和磅礡追捕的氣勢，而是真相之後，冷冽無力無奈又疲憊的死寂與控訴，讓人憎


  恨體制，讓人「厭世」。





  （末尾防雷）





  可以說，本片並不是什麼超級娛樂的刺激爆米花大作，也不是一個批判反思夠深的影展作


  品，更無法成為一部類型經典。然而，以達米恩斯弗隆的第一部好萊塢電影，已是很棒的


  成績單，僅管故事頭重腳輕，少許片段有點流水帳，情感薄弱，謎底與結局牽強，但瑕不


  掩瑜，故事與角色的設計上仍有其用心之處，不論是議題勾串娛樂主線，或是FBI偵查與


  內鬥的部分，都已令人滿足。此外，動作場面小而精巧，聲光場面調度好看，文戲上的安


  排也充滿趣味，黑色幽默雖偶爾莫名其妙，但有時反而令人玩味，一會兒增添壓迫下的苦


  澀與煩躁，一會兒增加風雨欲來的驚悚張力。




  演員的表現上也是精彩，可說是以精湛的對戲，來豐富可能會無趣的寫實風格偵查，不


  過，誠如先前所說，雪琳伍德利在第三幕的部分還是有點累贅。




  最後，必須稱讚本片的攝影，那些雪景、大樓與警方的陣仗光影，讓整個緝兇氛圍充滿氣


  勢，又兼具詩意美學。可惜，戲院畫面糊了些，尤其暗部有點慘


  可能本片的主發行商Vertical就是以北美限定上映、走串流為規劃吧。


  這倒是也挺令人「Misanthrope」的。







  --'
