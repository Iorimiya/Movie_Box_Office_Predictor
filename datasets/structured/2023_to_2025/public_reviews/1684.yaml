title: '[好雷] 限時追捕 節奏不錯'
content: '這部大概在講有一個狙擊手殺了一堆人


  FBI要找出兇手和一個艾利諾小女警合作


  節奏不錯滿喜歡FBI蘭瑪旁白


  但是中間大家好像都有降一下智商


  最後竟然想要自己急著破案選擇


  不通知麥肯齊結果一開始有講


  快破案他是最有用的 表示他槍法和戰力


  應該很強結果沒秀到


  有點像阿湯哥的神隱任務


  --

  對啊這部轉場都有像是在看風景

  賣場那個鬍子警探很帥好險沒死

  只能說他急了

  可能要改成想食人魔達默那種比較聳動的'
