title: '[新聞]《玩命關頭 X》：欠缺品管的無止盡「膨脹'
content: '【影評專欄】《玩命關頭 X》：欠缺品管的無止盡「膨脹」，使這個系列愈加「兵荒馬亂

  」


  以下有劇透


  （內文涉及劇透，請慎讀）


  克里斯多夫諾蘭曾經自承，他是《玩命關頭》系列的忠實影迷，雖然他跟多數觀眾一樣偏

  愛最初的一到三集，但他同時也持開放心態去接受後面集數「愈玩愈誇張」的樣貌，因為

  他明白，這是一套系列電影必然的演進歷程，系列電影往往只會膨脹，不會縮小。我對《

  玩命關頭》的感受跟諾蘭差不多，我並不排斥它後期的浮誇風格，我或許會不滿意它的笑

  點愈來愈無聊、動作戲愈拖愈長、角色動機鋪陳得不夠完整，但我不會排斥它浮誇風格的

  「本身」。


  然而話雖如此，《玩命關頭》系列目前的「一成不變」，也正在大量消耗我對它浮誇風格

  的容忍度和新鮮感。自從《玩命關頭 6》奠定某種諜報片套路後，唐老大一家人就是不斷

  反覆代替政府去和恐怖份子搶奪黑科技武器，然後中間必定會穿插針對唐老大而來的仇人

  尋求報復，環球影業看準這個公式是黃金賣座公式，於是便緊抓不放直至現今。環球終於

  在《玩命關頭 X》有稍微試圖調整這套已經讓不少觀眾生厭的公式，但遺憾的是，就真的

  是「很稍微」，稍微到我很懷疑未來是否還會有更進一步的調整。



  《玩命關頭 X》和 6、7、8、9 集比較不一樣的地方是，他們想拍成《復仇者聯盟：無限

  之戰》，但丁是玩命家族要面對的薩諾斯，他不斷拋出「該救誰為優先？」這種經典取捨

  題考驗唐老大，就相當於是薩諾斯在考驗復仇者聯盟「是否該犧牲同伴來換取寶石安全？

  」。摩莫亞別於前幾集的反派，他沒有想藉高科技統治世界這種遠大謀略，他純粹就是個

  仇家，純粹是來挑戰唐老大一夥人。


  但丁的起源顯然是編劇硬擠出來的設定，但他的角色定位本身沒啥大毛病，只要好好拍出

  雙方對峙的張力應該還是不錯看，然而問題偏偏就出在《玩命關頭 X》沒辦法專心做好這

  件事，整部電影終究頻繁被困在此系列既有的框架裡一直「瞎忙」，忙得「沒效率」；例

  如，唐老大的隊友常會被派去某個地方查線索或請求高人協助，這種支線通常是幫羅曼和

  泰吉這對活寶加戲搞笑的，可是編劇寫給他們的段子實在是愈來愈沒梗、愈來愈尷尬，很

  想拜託劇組直接剪掉算了；還有雅各叔叔與侄子布萊恩的「郊遊記」，看起來就像《玩命

  關頭 8》戴克蕭援救嬰兒時期布萊恩的加長版，而且加得過於冗長，我明白這條支線是為

  了讓雅各最後的犧牲顯得有份量，但總覺得還可再縮減一些。


  另一拖累此系列的致命傷，當然還包含動作戲。作為一套動作片 IP，讓觀眾看得最膩的

  居然就是動作戲，這無疑是重大警訊。環球已對《玩命關頭》系列陷入一種迷思，那就是

  ：「我什麼都要大！愈大愈好！拍得愈長愈好！因為拍得長，電影才氣派！觀眾才會覺得

  這是史詩大片！」若他們真希望《玩命關頭》延綿益壽，反而應該要縮短刺激觀眾感官的

  時間，因為劇組顯然短期內已經無法再設計出更具突破性的場面吸引眼球，那倒不如先縮

  短長度、減緩觀眾的視覺麻痺。這是他們早從《玩命關頭 7》就該做的事情，然而他們非

  但無危機意識，反倒變本加厲，加速了觀眾的疲乏。


  愈塞愈多的角色也是《玩命關頭》的一大警訊，這讓《玩命關頭 X》有些兵荒馬亂，人多

  看似熱鬧，但都像走馬看花，放眼望去，一大票比主角群還紅的明星配角，可是他們的戲

  份各個雞肋，很難讓我想多花心思關注他們的動向；趙喜娜、莎莉賽隆、傑森史塔森自從

  相繼退下主要反派的位置之後，編劇就把他們當作廉價的二三線劇情工具在使喚，真替他

  們感到不值；新加入的兩位 family ─ 無名氏先生的女兒、唐老大前女友的妹妹，或許

  後續還有更多發揮，但這集編劇對她們的鋪陳，並不足以激起我對後續的期待。


  《玩命關頭 X》甚至連收尾方式都像《無限之戰》，薩諾斯彈掉一半宇宙人口，但丁也除

  掉唐老大的大半 family（或者至少表面上看起來是這樣），但依照《玩命關頭》的吐便

  當傳統，他們多數人八成都會在下一集復活，畢竟這集連看似不可能再請回來的吉賽兒與

  哈伯斯都毫無懸念地現蹤了。不過根據片尾的伏筆，《玩命關頭 11》接下來的發展似乎

  會更像是《捍衛任務 3：全面開戰》和《捍衛任務 4》，而非《復仇者聯盟：終局之戰》

  ，但丁會像高桌會一樣繼續清除所有幫助過唐老大的盟友。


  然而在林詣彬持續缺席的前提之下，我懷疑《玩命關頭》第 11 和第 12 集能收尾收得像

  《捍衛任務 4》或《終局之戰》如此優雅就是了。《玩命關頭 9》雖被大家吐槽個半死，

  但林詣彬在效仿《教父 2》交錯描寫兩條時間線這方面其實處理得不差，剪接剪得漂亮，

  年輕版泰瑞托兄弟的對手戲也拍得頗有溫度，反觀《玩命關頭 X》，光是開場但丁與父親

  的關係建立就失敗了，完全無法稍微共情一下但丁想要復仇的憤怒，更別提那一整段第五

  集的 recap 最後的斷點是剪得多麼粗糙，林詣彬的水準再怎麼下滑也不可能下滑到這種

  地步。



  全片唯獨值得稱讚的一點，就是看傑森摩莫亞使壞、確實比看飆車場面還更叫人過癮，他

  的表演說穿了其實就是集所有刻板到不行的惡棍特徵於一身，當代演員多半會迴避如此卡

  通且樣板化的演法，但摩莫亞反其道而行，將惡棍常見的耍嘴皮、講排場、自信爆棚、喜

  歡搭配古典樂襯托自己的反骨等各式各樣的習性融為一體，並使勁浮誇化，而這樣的演法

  不僅適合他自己，與《玩命關頭》系列的調性更是無庸置疑的絕配。



  新聞網址：





  --'
