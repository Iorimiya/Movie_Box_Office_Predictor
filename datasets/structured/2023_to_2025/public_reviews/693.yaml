url: https://www.ptt.cc/bbs/movie/M.1725424564.A.389.html
title: '[情報] 2024金馬影展開幕片：《默視錄》'
content: "2024金馬影展開幕片揭曉！楊修華《默視錄》揭開監控日常的人性真相\n金馬影展和威秀影城攜手合作聯名影廳 方序中操刀設計打造全新風貌\n\n\n\
  \n2024金馬影展將於11月7日至24日盛大展開！\n，他也表示，繼前作於金馬獎得獎後，《默\n視錄》參加金馬創投，建立了合製夥伴們的信任與合作，讓台灣與新加坡有機會攜手並肩\n\
  合作這部作品。楊修華也希望觀眾會喜歡本片，享受他們對電影熱愛的努力成果。\n\n《默視錄》邀集金馬影帝李康生、巫建和、陳雪甄和林幻夢露等台灣實力派演員主演，講\n\
  述一對年輕夫婦在女兒失蹤後，陸續收到神祕偷窺者拍攝他們的日常和親密時刻的影像；\n隨著偷窺者的身分和影像背後的真相逐一揭開，彼此的家庭也開始崩塌。影片透過兩個家\n\
  庭的故事，探討現代都市生活中「看」和「被看」的連結，揭開監控日常的人性真相之餘\n，人又該如何檢視自己。\n\n\n\n\n\n，邀請曾設計第54屆、55屆金馬主視覺海報以及「金馬60互動展」的知名設計師方序\n\
  中與究方社團隊，，屆時將以煥然一新的樣\n貌迎接影迷。\n\n\n\n此外，為響應環保永續的減紙趨勢，\n\n2024金馬影展將於11月7日至24日展開，10月25日周五晚間舉辦選片指南，10月27日下午\n\
