url: https://www.ptt.cc/bbs/movie/M.1690120784.A.2D2.html
title: '[好雷] 友情萬歲！大雄與天空的理想鄉'
content: '其實很久沒進戲院看哆啦A夢電影版了

  畢竟小叮噹時代的人了 對於近年劇場版的大長篇

  總有種重編 重複主題 反正不是出自不二雄大師的仿作 興趣不高


  直到Stand by me兩集重燃信心 這次就跑去戲院看


  好! 好! 看!


  劇情本身就蠻有趣 首先是笑點很多

  從賣二手貨的吐槽 到完美貓型機器人 一直讓我重新想起原來A夢有多可愛多好笑

  然後這集的道具也都蠻有新意的 整艘船 可以變身飛機的著裝

  再到整個主題 穿越時空跟地域 烏托邦 無人機 洗腦的大反派

  都看的很開心 儘管仔細想一定都有BUG 但真的很能滿足童年的單純快樂


  當然 最推的還是關於友情的部分

  大雄之於胖虎 小夫 乃至靜香那種明明有時候不爽其實又是好友的微妙關係之外

  最感動的真的還是大雄這一集跟哆啦A夢之間的信任


  不管是兩人幼稚的拌嘴~ 到最後對彼此的信任跟犧牲

  大雄如何努力的想要救回哆啦A夢 儘管是人生看了四十載的老故事

  但或許正是如此 更感動他們四十年如一日 透過故事中累積的真摯情誼


  想看有趣創意的故事

  想看單純真摯的友情

  想看好笑逗趣的劇情


  這部值得更多一點的喜愛 尤其推薦帶小朋友去看 告訴他們友情的美好呀!


  --

  NiziU也算是有模有樣 在電影用好音響聽她們唱的主題曲

  搭配之後的插畫 也不用急著離開戲院呀~


  --'
