content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n微雷\n\n\n\n\n這次帶三個小朋友同時看(7y\
  \ 4y 2y)\n過程中還滿順利的 兩個大的都說看得懂 也說很好看\n最小的過程除了一直喊 貓 貓外,整部電影也坐得住 應該是真的好看\n中文配音很棒\n\n\
  個人小心得:\n劇情對成年人來說可能就很老梗 壞蛋收尾也是很草率\n最後救回帥貓那段也是很突兀\n不過....就是給小孩子看的 小朋友開心就好 皆大歡喜\n反而我覺得上次恐龍那部比較好看\n\
  這次看到剛進入理想國介紹生活那段我就睡著了 那段真的有點悶\n\n再補點無關的\n預告片有汪汪隊電影板 是汪汪隊得到超能力\n喜歡的別錯過囉\n\n\n\n\n\
