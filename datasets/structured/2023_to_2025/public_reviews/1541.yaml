url: https://www.ptt.cc/bbs/movie/M.1689939407.A.7D4.html
title: '[好雷] 哆啦A夢：大雄與天空的理想鄉'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  我看的是日語版

  看預告片的時候以爲是飛行系電影

  其實探討的是比較哲學的問題

  看到三賢人出現的時候 大概就知道了

  把所有人都改造得一樣完美認真 社會和諧 是所謂的理想國嗎？

  但是大雄與哆啦A夢在奔逃的時候 脫口大叫：哪有人是不會犯錯的？

  説明了帕樂達邦只是陰謀者利用控制人心的手段營造出來的偽樂園



  除此之外 笑點也不少 主要的當然是大雄跟哆啦A夢的拌嘴

  有一個來自未來的賞金女獵人瑪琳芭 在中段登場

  被哆啦舊型號的復原光綫照到變成小妖精

  那段也超級好笑



  最後還是免不了被騙了一下眼淚

  哆啦A夢又不幸的又被當成攻擊的目標 被大雄在草叢中找回來

  那一段讓我回憶起“南極冰天雪地大冒險” 正派的哆啦被仿冒品陷害無法説話

  但是大雄還是辨認了出來 這就是所謂默契吧！！！

  被感動之餘 也十分羡慕他們的好感情



  總之 這次的動畫版 還不錯~適合想要放輕鬆的觀衆


  --'
