url: https://www.ptt.cc/bbs/movie/M.1686362400.A.BF6.html
title: '[情報] 哆啦A夢:大雄與天空的理想鄉 7月21台上映'
content: '《電影哆啦A夢：大雄與天空的理想鄉》7 月 21 日中日文版同步在台上映


  動畫（GNN 記者 阿Lu 報導） 2023-06-09 14:44:20


  《哆啦A夢》劇場版系列最新作品《電影哆啦A夢：大雄與天空的理想鄉》將於今年 7 月

  21 日在台同步上映日語原音版與國語配音版本。




  《電影哆啦A夢：大雄與天空的理想鄉》由《王牌大律師》《怎麼辦家康》編劇古澤良太

  執筆劇本，描寫哆啦A夢一行人在天空夢幻樂園「帕樂達邦」的冒險，是一部探討「烏托

  邦」是否真的存在的作品。作品也找來日本索尼音樂與韓國 JYP 娛樂聯手打造的日本女

  子偶像團體「NiziU」獻唱主題曲「Paradise」，這也是 NiziU 首度為電影獻唱主題曲。




  動畫劇情描述大雄在天空發現了一座神祕的新月型島嶼，並堅持表示「那就是我一直在尋

  找的烏托邦！」。於是哆啦A夢一行人便搭乘祕密道具「時間齊柏林」飛船，出發去尋找

  這座島嶼！在探索了各個時代和地點後，終於發現了這座島嶼的真面目，一座可以讓任何

  人變得完美的夢幻樂園「帕樂達邦」！在那裡，哆啦A夢和大雄與完美的貓型機器人索尼

  亞成為好朋友，然而，他們卻發現這座夢幻樂園的背後隱藏著不可告人的天大祕密，究竟

  大雄他們是否能解開這座樂園的謎團呢？




  除了固定的音班底水田山葵、大原惠、嘉數由美、木村昴、關智一之外，還找來井上麻里

  奈、水瀨祈等聲優同台聲演，搞笑藝人「南海甜心」山里亮太和「早安少女組」前隊長藤

  本美貴也特別獻聲演出。此外，製作團隊也邀請到傑尼斯男子偶像組合「King & Prince

  」成員永瀨廉參與配音，聲演「帕樂達邦」的完美貓型機器人「索尼亞」，這也是永瀨廉

  首度挑戰動畫配音。




  談到這次配音的角色，永瀨廉表示：「因為索尼亞有著過去曾是個廢物機器人的自卑感，

  才讓他擁有一顆溫柔的心吧，而在與哆啦A夢和大雄一行人相遇後，讓他找回原本的心，

  我覺得他是本作中轉變最大的一個角色。」永瀨廉也補充道：「我想每個人都有過失敗的

  過去，但我認為克服過去並努力活在當下這件事，給了我很大的勇氣，我在演繹索尼亞的

  同時，也見證了他的成長。」




  導演堂山卓見也表示：「儘管只參與過一部作品的配音工作，卻已經成為一名出色的聲優

  了。不僅僅是我這樣認為，音響導演也如是說。永瀨先生的領悟力非常好，對於工作的熱

  情也很不得了。有時重要的臺詞我認為沒問題，他卻說『請再讓我錄一次』，再錄一次後

  的成果也變得更好，永瀨先生真的是一位非常優秀的人。」




  談到本片，導演堂山卓見表示：「《電影哆啦A夢：大雄與天空的理想鄉》和過去的作品

  一樣，故事從日常生活開始，然後前往沒見過的地方大冒險，希望觀眾可以一邊在這部電

  影中享受那種興奮感，但我同時也很重視觀眾看完後的感受，希望觀眾在離開戲院後能更

  加珍惜日常生活的一切。如果是和家人、朋友一起觀賞本片的話，我認為《電影哆啦A夢

  ：大雄與天空的理想鄉》或許是一部能夠討論很多事物的電影，而孩子看到的烏托邦和大

  人看到的烏托邦可能不盡相同。我覺得《哆啦A夢》的優點是在電影結束後日常生活依舊

  持續進行，如果觀眾看完後有許多話想傳達的話，我會很高興的。」


  --'
