url: https://www.ptt.cc/bbs/movie/M.1690250621.A.956.html
title: '[討論] 哆啦A夢：大雄與天空的理想鄉心得'
content: "【動畫心得】哆啦A夢：大雄與天空的理想鄉 - 看完對古澤良太恢復一點信心了\n\n\n自從\"怎麼辦家康\"撥出之後，其實我對古澤良太的劇本有點失望\n\
  \n整部\"怎麼辦家康\"戲劇的方向讓我這個戰國迷有點食不下嚥...\n\n還好 哆啦A夢：大雄與天空的理想鄉這部表現不錯\n\n讓我又恢復一點信心..\n\n\
  *****************\n以下有雷\n*****************\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n******************************\n\n 以下有雷\n\n*******************************\n\
  \n\n\n\n\n\n\n身為一個Doraemon資深老飯\n- Blog第1000篇紀念文 Doraemon哆啦a夢- 2022.12.01\n\n老實說，劇場版在中間一段時期，感覺摸索不到一個好的方向\n\
  \n推出的作品少了當年藤子F不二雄老師的詼諧與靈感\n\n多了許多意味不明的邏輯片段\n\n(人魚大海戰、綠之巨人、奇蹟之島，我看完之後一堆問號)\n\n而工作室在推出這些比較不叫好的作品之後\n\
  \n又轉頭回去重置許多舊版的電影\n\n\n說真的，有好有壞，有些改編的地方有點太浮誇了\n\n但畢竟原本舊版的架構就不錯了，所以還看得下去\n\n\n在2017年開始，從南極冰天雪地大冒險，到今年的大雄與天空的理想鄉，\n\
  \n電影的品質有顯著的提升\n\n【動畫心得】電影哆啦A夢：大雄的宇宙小戰爭 2021 - 重複太多次的\"為她人難過\"\n\n\n2017： 南極冰天雪地大冒險\n\
  \n2018： 金銀島\n\n2019： 月球探測記\n\n2020： 大雄的新恐龍  (舊版改編)\n\n2021： 大雄的宇宙小戰爭2021 (舊版改編)\n\
  \n2022： 大雄與天空的理想鄉\n\n\n\n除了2020與2021是改編舊版電影之外\n\n其他的品質都還不錯  個人看金銀島，每看必哭阿\n\n月球探測記也是很棒的一個原創作品\n\
  【日本文學】辻村深月 - 沒有鑰匙的夢 (小品卻讓我看得很累)\n\n\n*********\n\n大雄與天空的理想鄉\n\n探討著\"烏托邦\"，在烏托邦裡沒有爭吵，每個人都是完美的\n\
  \n大雄拿到了0分考卷，又怕被媽媽責罵\n\n躺在後山，看到新月般的天空烏托邦出現時\n\n就一心想要到烏托邦去\n\n\n凹不過他的Doraemon，就買了一台二手的時空跳躍的飛船\n\
  \n一群人跑到各個時空去尋找天空的理想鄉~~\n\n\n\n然後...還真的找到了~~\n\n\n\n*******\n\n烏托邦裡面受三賢人的管理，\n\n\
  每個人都會越來越完美，除去暴戾之氣等等\n\n(很像重裝任務欸...)\n【電影影評】重裝任務Equilibrium - 票房慘澹、劇情無新意，但卻帥爆的克里斯汀貝爾\n\
  \n\n他們也碰到一隻\"完美貓型機器人\"索尼亞，並跟他成為朋友\n\n\n\n但危機卻藏在烏托邦裡面...\n\n一個鬼鬼祟祟，想要破壞烏托邦的人\n\n\
  原來是要來營救班長的獎金獵人！\n\n獎金獵人講，其實時空特警一直在找這個烏托邦，這個烏托邦其實是想要控制全世界的人\n類的心智！\n\n\n\n烏托邦在各個時空找到不同的人，用光線讓他們失去自我，就一輩子無法離開烏托邦，\n\
  \n而這是因為\"三賢人\"背後的主謀\"雷博士\"\n\n他小時候跟大雄一樣，被霸凌排擠，\n\n只好發明了控制人心的光，要讓全世界都消去暴力\n\n大家失去想法，就能平安度日，但這個思維，反而讓人不安\n\
  \n畢竟每個人都應該要有自己的思想，而不是被別人給控制\n\n\n\n在這個烏托邦中，沒有淚水，沒有歡笑，沒有暴力，\n\n甚麼都沒有\n\n胖虎  小夫  靜香\
  \  也變成沒有自主意識\n\n大雄反而強烈的想要回去原本的世界！\n\n\n\n他發現不是每個人都是\"完美\"就是好事\n\n而索尼亞在與大雄跟哆啦a夢相處的時候\n\
  \n也漸漸的找到自己的笑聲，更擺脫了三賢人的控制...\n\n到底大雄要怎麼脫離這個烏托邦呢...??\n\n而他們跟索尼亞的結局是怎麼樣？\n\n\n\n********\n\
  \n當然後面大家找回意識的片段真的是讓人爆哭阿...\n\n電影後半段也很巧妙的連接到，\n\n為什麼大雄在那個時間點看到天空的烏托邦，\n\n是個很棒的前後呼應片段\n\
  \n\n\n我認為是近來很棒的一部哆啦a夢電影\n\n至少跳脫了\"為他人難過的心\"這個主題...\n\n\n\n裡面有一個BUG\n\n一開始獎金獵人要救援班長的時候\n\
  \n她說了要順便把烏托邦的能量給炸掉....\n\n但是以後面的情況來看\n\n炸掉能量之後，其實烏托邦就掉下來了欸\n\n那不就還好她那個時間點沒有炸\n\n\
  炸了之後上面的400個人不就死翹翹了...\n\n\n\n在劇情的銜接上\n\n雷博士出來之後，感覺有點卡卡的\n\n突然這邊多一段要解決的，那邊多一段要看的\n\
  \n連最後索尼亞帶著垃圾袋上去\n\n我也覺得有點卡...\n\n而且結尾說有彩蛋，也沒看到甚麼彩蛋，有點失望\n\n\n\n\n\n不過聽完片尾曲，看索尼亞開心的畫面\n\
  \n一樣很感動阿...\n\n這部片我哭的時間比金銀島少了一點\n\n兩個孩子倒是後半段在狂哭\n\n老婆反而感覺這部片還好而已...\n\n\n\n但我還是強烈推薦喜歡哆啦a夢的人去看\n\
  \n小朋友跟大人都會看得很開心的！\n\n--\n親子桌遊心得與介紹! \n\n--"
