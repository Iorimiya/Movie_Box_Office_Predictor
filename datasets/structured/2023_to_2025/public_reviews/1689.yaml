url: https://www.ptt.cc/bbs/movie/M.1574663489.A.751.html
title: '[好雷]這就是我要的神轉折《弒婚遊戲》'
content: "不負責任影評－這就是我要的神轉折《弒婚遊戲》\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n大家好，我是老王。\n\n人家常說「婚姻是愛情的墳墓」、「結婚要挑好日子，因為結了婚就沒有好日子過了」如\n果那天婚姻這件事情真的變成墳墓，那，你要試試看嗎？\n\
  \n這幾年出現了很多有趣的作品，而《弒婚遊戲》的片尾神轉折更是令我愛上這部片的關鍵\n。\n\n你準備好嫁入豪門了嗎？\n\n怎麼樣，都願意嗎？\n\n那麼，我們開始吧。\n\
  \n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n由薩瑪拉·威明飾演的新娘葛蕾絲終於有機會嫁入豪門，這令葛雷絲一度認為美夢成真，\n\
  不過這個古老而又富有的遊戲家族自古就有墨守陳規的傳統，在新婚夜參與了家族遊戲的\n葛雷絲從牌庫中抽中了「捉迷藏」，這看似簡單尋常的遊戲，卻令他的丈夫露出從未見過\n\
  的驚恐與不安。\n\n\n\n【流暢明快的節奏】\n\n若要我提出對《弒婚遊戲》喜愛的部分，流暢而簡單明瞭的劇情絕對是其中之一。\n\n「有錢人都很古怪」這個社會刻板印象，在拉多馬斯家族身上得到最好的體會，這個家族\n\
  有奇怪的管家，異常親切的父親，看似紈褲子弟的大伯，還有各種弔詭的人物形象全都出\n現在《弒婚遊戲》，而它們的目的更加簡單，殺了新娘，維護傳統。\n\n比這看似荒謬的設定更加荒謬的，就是有一群對荒謬傳統堅定不移的人。\n\
  \n而整部作品用諷刺的口吻，黑色幽默的方式，詼諧地呈現了「有錢人真的跟你想的不一樣\n」，這裡有吸毒亢奮可是永遠殺錯人的妹子，躲在黑暗中偷看行房的阿姨，蹲在馬桶上研\n\
  究十字弓的魯蛇，還有一群完全拿來當笑點看的女僕，我一定要說一句，女僕掛掉的環節\n真的很好笑，基本上，這部片只要死人都好笑到不行，我一直以為我今年看不到喜劇片了\n\
  ，不過《弒婚遊戲》完全滿足我走偏的笑點。\n\n\n\n【女主角跟你想的完全不一樣】\n\n那張海報，對，就是葛蕾絲拿著槍的那張海報，這根本是導演的詐騙遊戲，我在還沒看到\n\
  正片時一直以為葛蕾絲會以一種「獵物變成獵人」的方式呈現反抗，結果完全沒有！好啦\n，她還是有反抗一下，不過絕對不是拿著槍大開殺戒。\n\n但被戲耍的我卻一點也不生氣，因為薩瑪拉威明的演技實在太真實了，她完全表現出了在\n\
  壓力下會出現的惶恐，癲狂，還有夢想幻滅的委屈跟錯愕，更別提在片尾部分所展現出來\n，反客為主氣場。\n\n一個從幸福迅速跌入令人同情遭遇的旅程，這一夜宛如葛蕾絲的過山車，以為跑得掉，結\n\
  果沒跑掉；以為得救了，結果被放鳥；以為要反抗，結果拿錯槍；真的要等死，結果就天\n亮。\n\n劇情中實在有太多好笑到讓人不知道該從哪裡吐槽的部分，光是那個「沒在天亮前殺死新\n\
