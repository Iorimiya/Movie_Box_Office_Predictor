title: '[好雷] 瘋狂麥斯!太好看了 這就是我要看的爽片!!'
content: '瘋狂麥斯剛上映時 板上曾有一股討論熱潮

  當時沒有太注意


  看過瘋狂麥斯後


  要大聲的說


  瘋狂麥斯!太好看了 這就是我要看的爽片!!


  看之前沒預期到會這麼好看 整部片沒冷場


  看完後熱血沸騰


  且瘋狂麥斯不只是爽片

  劇情片還很有深度


  男主角湯姆哈迪外


  莎莉賽隆更是演的棒極了 大亮點


  收尾也是很漂亮


  不能想像整部片竟然是由70歲的導演喬治米勒拍出來的 新意十足


  好看程度超越言語能形容


  沒有看過的人一定要看過 太好看了


  --'
