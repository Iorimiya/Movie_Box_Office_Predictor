url: https://www.ptt.cc/bbs/movie/M.1446092735.A.338.html
title: '[好雷]《衝出康普頓》─ 這就是我們的「態度」！'
content: '《衝出康普頓》Straight Outta Compton

  ★★★☆

  ----------------------------------------------------

  Director: F. Gary Gray

  Writers: Jonathan Herman, Andrea Berloff

  Stars: O''Shea Jackson Jr., Corey Hawkins, Jason Mitchell

  ----------------------------------------------------

  《衝出康普頓》─ 這就是我們的「態度」！


  康普頓Compton，位於洛杉磯下城區，多數居住著黑人朋友們，在1988年時代背景下，當

  時社會環境充斥著毒品、幫派、槍械，無數的暴力打壓，不只白對黑，甚至黑對黑，為了

  自己的勢力、名聲，一再地逞惡欺負弱勢，而同樣居住在康普頓的一群人，卻不甘於臣服

  在此種打壓下，他們用他們當時獨特的音樂證明，我們也能衝出康普頓。

  ----------------------------------------------------

  說到RAP嘻哈文化，就絕對不得不提到康普頓傳奇N.W.A，由Eazy-E, Dr. Dre, Ice

  Cube, MC Ren, DJ Yella五人所組成的超級天團，他們將結合了DJ和說唱，唱出反社會風

  骨之詞，機關槍式的音符噴射，更是打破當時美國白人高傲種族對音樂的框架和印象，敢

  言敢唱，不怕當時的政府法律、種族歧視，縱使暴力一再地向他們迎面而來，但他們總能

  將悲憤化為力量，將一首首帶有社會諷刺之意的歌詞傳達給觀眾，帶動他們的情緒，電影

  中許許多多N.W.A的經典名曲皆再次的被歌頌，「Fuck the police」、「Straight

  Outta Compton」、「Gangsta Gangsta」、「The Boyz-N-The-Hood」等等歌曲，總有一

  首能帶起的時代記憶和神經，觀影期間，甚至像親臨現場一般，不停地被那股力量感染隨

  之舞動，而正也是音樂的魅力所在！


  「Fuck the police」：

  「Straight Outta Compton」：

  ----------------------------------------------------

  「N.W.A = Negroes With Attitude」


  《衝出康普頓》除了音樂之外，另一吸引人的特點就在於當時的社會氛圍，白人對黑人的

  仇視感非常之濃，他們就猶如過街老鼠，只有被玩弄於股掌之間，而當年轟動一時的警察

  暴力案，最終卻都無罪釋放，政府已失去功能，活在這個不平等的年代，更加深N.W.A.甚

  至多數人堅強的意志，再多壓制怒罵，再多忍氣吞聲，都將此怨氣轉化為元素，將音樂成

  為一種武器，將不滿宣洩而出，狠狠爽快地唱出每個人的心聲，更透過群眾效應將此等音

  樂發揚光大！ 另一方面你更能看到他們對於自己的自信和毅力，音樂就是信仰，不以暴

  制暴，而是想如何用音樂讓你臣服他們之下，N.W.A 絕非白人口中的No Whites Allow，

  而是一種精神，一種對音樂的氣魄，這就是我們的態度！

  ----------------------------------------------------

  電影除了著墨於黑白之間的衝突外，主軸還是在於N.W.A從初組、爆紅、單飛分家、再次

  重建的始末，尤其較多對於Eazy-E這位已過世的傳奇致敬，從一個賣毒品致富的小鬼，出

  錢投資無意參與卻變成自己演唱，Ruthless一出瞬間爆紅，席捲眾人的魅力永不停止，但

  卻因為猶太經紀人的貪錢和自己的一己私利，導致黑人兄弟和朋友的分裂，從對外到內鬥

  ，當音樂變成了商業行為，一切早不再這麼純粹，他們各自走上不同的道路，卻一路跌跌

  撞撞，也找不回過去的快樂，甚至回到當年只能以暴力解決事情的生活，而就在他們知道

  當初一起的美好時，卻早已為時已晚，多年的墮落生活，一蹶不振的載浮載沉，為錢、為

  毒品、為性愛，卻也斷送了一位傳奇巨星的生命，1995年3月，Eazy-E因為愛滋而去世，

  N.W.A至此也少了一塊重要的拼圖，相當惋惜，而「Aftermath」也成為重組後新的經紀代

  表公司。

  ----------------------------------------------------

  《衝出康普頓》是曾經執導過《王牌對王牌》的導演F. Gary Gray，雖貴為一部音樂電影

  ，確實把氣氛堆疊得不錯，前期非常有力且震懾人心，後期較稍微流水帳一些，許多可以

  深入的議題不多，其實電影切入點可以多著重於黑白種族，甚至可以用說唱更加深反擊，

  可惜卻悄悄帶過，進而轉向團體間的內鬥，起伏些許沉悶，最後也成為Eazy-E的個人傳記

  ，不過從中卻是帶我們乘坐時光機回到當時，可以看見他們如何從小小康普頓走進每個城

  市，還有許許多多後起新秀也藉此被拉拔崛起，Snoopy Dogg正是之一，結尾採用多數名

  人給予Eazy的懷念和祝福，Eminem、Snoopy許多近代知名嘻哈領潮人物皆獻聲支持，值得

  一提Ice Cube的飾演者O''Shea Jackson Jr.正是其兒子，經過二十年，O''Shea Jackson

  Jr.不論在外表、他的陽剛甚至聲線都跟父親非常相似，對於此人物的刻畫更為生動！有

  趣的是片尾的音樂名單真是長長大串，不只N.W.A，還更有2Pac、 Run-D.M.C. 、Zapp等

  熱血歌曲，不只看得精彩，聽得也十分過癮，頭尾呼應的Beats節奏，高音低音齊聚營造

  出的氛圍，利用黑膠刮碟混音到進錄音室混音master mix，更是一窺音樂工業的製造過程

  ，當然除了rap以外，其實我個人最崇拜後期製作以及混好音軌的編曲，Dr.Dre真是音樂

  鬼才阿，滿滿的感動，音樂確實才是最可凝聚人心的工具！


  完整soundtrack列表：…

  ----------------------------------------------------

  《衝出康普頓》雖然還是一部正規的傳記音樂電影，但我們看到的是一個傳奇的誕生，聽

  到的是最經典的RAP，態度決定一切，他們唱的不再只是歌，而是我們的生活，就在此刻

  ，他們帶著他們音樂，稱霸了全世界！不知不覺他們年齡也都邁向5字頭，感慨時光飛逝

  。

  ----------------------------------------------------

  就在2015年八月，Dr.Dre睽違16年發表最新專輯《Compton: A Soundtrack By Dr. Dre》

  ，結合Eminem、Kendrick Lamar、Ice Cube、Xzibit、Snoop Dogg等重量級卡司，他說這

  不是一張電影原聲，而靈感是來自電影，也宣告此張可能是他告別之作，或許經過這麼多

  年，Compton在Dr. Dre依舊是最美好的回憶！懷念當年的N.W.A，也懷念Eazy-E這位重要

  的戰友！


