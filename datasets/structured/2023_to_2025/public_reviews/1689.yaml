url: https://www.ptt.cc/bbs/movie/M.1682859431.A.70D.html
title: '[討論] 日片<這就是我>是不是近年的清新小片？'
content: '看到這部電影的議題覺得眼睛為之一亮，

  在各種探討男女關係和情慾縱橫的電影裏，

  這種議題的電影反而讓人感覺清新。


  從女性的觀點出發，探討單身也是一種存世的方式，

  沒有什麼說教的感覺，整部電影的調性讓人感覺很清新

  特別是三浦透子的演技也真的是不錯

  只是不太懂電影裡面為什麼女主角會反覆提起湯姆克魯斯在<世界大戰>裏跑步的姿勢？

  不知道這到底是代表什麼意思？？


  另外就是電影的最後，鏡頭刻意地晃動，

  是說也晃的太厲害了，看到我頭都暈了。


  總之我實在是非常喜歡這部電影，

  不知道大家會不會也覺得這部電影很不錯




  --'
