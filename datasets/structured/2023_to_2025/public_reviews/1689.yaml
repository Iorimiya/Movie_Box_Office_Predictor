url: https://www.ptt.cc/bbs/movie/M.1619715171.A.04A.html
title: '[好雷] 玩命鈔劫-這就是我要的爽片'
content: '超級喜歡


  紳士追殺令就很令我驚艷，玩命鈔劫更是非常喜歡

  看來蓋瑞奇真的回來了


  除了那些精心設計層層鋪疊的緊繃情緒張力和危險氣氛

  以及最後令人喘不過氣又酣暢淋漓的大戰之外

  最令我激賞的就是蓋瑞奇對於收尾的安排


  玩命鈔劫乍看是部典型的好萊塢動作爽片

  但蓋瑞奇對於結局的選擇卻讓它不只是部爽片



  以下可能有雷



  玩命鈔劫的主題是復仇

  這是個老套的主題，但它卻不複製老套復仇片的簡單公式

  在片中不管哪一方都是帶著復仇的憤怒在行動


  不管是懷著不平怒火對社會復仇的退伍軍人

  還是深切自責的父親彷彿想要屠盡一切的憤怒火焰

  甚至是保全公司每天彷彿獵物般開著運鈔車的保全們，其實也都是憤怒的


  在蓋瑞奇的鏡頭下，傑森史塔森是個充滿魅力的反英雄

  這位反英雄在失去了一切，全身傷痕累累的討回他的公道後

  頭也不回地帶著悲傷和平靜沒入暮色中

  什麼也不留下，什麼也不帶走

  彷彿看到當年瘋狂麥斯系列的麥斯

  但又多了一點蓋式的黑色幽默



  「我要你的肝、你的脾、你的肺、和你的心」




  (不確定有沒有記錯 XD)





  --'
