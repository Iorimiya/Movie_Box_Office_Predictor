url: https://www.ptt.cc/bbs/movie/M.1749285081.A.663.html
title: '[ 好小雷] 捍衛任務復仇芭蕾 這就是我想看的電影'
content: '近期看過不可能、雷霆特工、復仇芭蕾


  其中最推復仇芭蕾


  推到上來發文


  不可能，就像坐雲霄飛車第一排

  畫面刺激，過程緊湊，但流程普通記憶點少



  雷霆，就像看著別人站著坐雲霄飛車

  畫面滑順，過程有趣，有種深深的無力感，但可以猜到結局


  復仇芭蕾，就像站著坐雲霄飛車

  畫面衝擊，還沒飛出去...


  就能想像之後的血腥撞擊，

  明知道會摔的炸出血花，


  但當血花真的炸出來～


  畫面真的～很血腥～很棒～



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  雷


  小雷



  儘管黑管家2023過世了，但他真的把那位置詮釋的很好，雖然只出現了幾個鏡頭。


  芭芭耶卡鏡頭比黑管家多很多，雖然大約只有10分鐘，但還是能感受其魅力。


  女主角很有魅力，又殘忍又帥


  不得不說


  第一次看到「火焰武器」在殺手電影中瘋狂使用，爽爆！


  之前只在戰爭片/異形片看過，



  最後：


  殺手的世界，美女的故事，戰爭片的暴力


  這，就是我想看的電影！！



  --

  對，我也覺得跟捍衛1、救援1一樣好看

  電視真的沒看多少宣傳，網路滑到才知道捍衛系列上映了

  那邊搞笑，想到香吉士，但惡魔風腳武打畫面很華麗

  是不是，諾曼第登陸出現10幾秒的畫面，這邊看起來完全是不同武器，超猛，根本遊戲畫

  面的爆炸火焰槍！

  我也是（超屁）

  真的是第一次在電影中看到可以這樣玩

  芭芭耶卡還是一樣迷人

  我看中午場數位，也好看

  真的好看，難得出來貼文，除非超級難看或很推，這部龍套死法各種有誠意XD'
