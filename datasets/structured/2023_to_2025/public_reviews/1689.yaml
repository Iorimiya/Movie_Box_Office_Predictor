url: https://www.ptt.cc/bbs/movie/M.1680434545.A.5DB.html
title: 為什麼一定要結婚？電影《這就是我》狂被催婚的三浦透子和勇於衝撞
content: '為什麼一定要結婚？電影《這就是我》狂被催婚的三浦透子和勇於衝撞傳統的前田敦子，

  迸出人生新方向


  2023-04-02｜電影神搜




  日本電影《這就是我》預計將於 4 月 28 日在臺上映，此片由《在車上》三浦透子，以

  及《愛的成人式》前田敦子主演，是導演玉田真也的第三部長片作品，描述不戀愛、不結

  婚的新人類，如何追尋自我的另類童話故事。同時也是三浦透子自《天氣之子》以來，再

  度演唱電影主題曲的作品。




  單身不結婚又如何！《這就是我》故事介紹


  佳純（三浦透子）原先懷抱著成為大提琴手的夢想，但現實中，她和許多人一樣，也想轉

  換目前的工作跑道。


  單身日子過得很愜意的她已到了適婚年齡，母親開始不停地催婚，幫她安排相親；身邊的

  人，總是都在說女人結婚是天經地義的事情，尤其是到了三十歲這個年齡關卡。但佳純從

  來沒和人談過戀愛，她也沒有對任何人有愛的慾望，以至於因此被家人懷疑是個女同志。




  她巧遇了以前的同學世永真帆（前田敦子），一個當過 AV 女優、總是勇敢表達自己想法

  的女孩。真帆不苟同社會給予女性的傳統價值觀，她鼓勵家純要跳脫典型童話故事的思維

  ，創造屬於自己的童話版本。


  在兩人的友誼迅速加深的時候，世永卻做了一個意外的決定，同時讓佳純重新思考，擁抱

  自由自在的自己，為未來做個新起點。




  《這就是我》電影預告




  《這就是我》預計將於 4 月 28 日在臺上映。


  資料來源：本萃電影


  TAGS 三浦透子 前田敦子 這就是我 玉田真也


  電影神搜



  --'
