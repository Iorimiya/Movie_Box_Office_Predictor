url: https://www.ptt.cc/bbs/movie/M.1559539283.A.00C.html
title: '[爽雷] 哥吉拉怪獸之王 這就是我想看的基多拉'
content: '對比東寶動畫那種金色垃圾曼達 傳奇真的有誠意多了 打好打滿除了爽還是爽


  雖然票房看起來不理想 但我禮拜六晚場 禮拜天早場都是滿廳

  再加上粉絲的口碑不錯 希望至少國外票房能衝起來

  北美我就不期待了 看看環太平洋的票房 真的無法期待北美對怪獸片的票房


















  以下有雷

  身為一個平成入坑的哥粉 這次的打鬥無疑有致敬平成系列


  而我不太清楚 大家看這種怪獸電影的想法 其實仔細看歷代哥吉拉

  會發現很多橋段是人類解讀這些怪獸的情緒



  我會覺得2014版的這部份比較少



  平成那時候還直接加個超能力少女三枝 當哥吉拉的最佳代言人

  而這版 則是由馬克和芹澤 陳博士 擔當這樣的角色



  想辦法解讀咱們的老大哥 再想什麼




  有他們解讀哥老 或是基多拉或是摩姐 你會發現這些怪獸人性化了許多


  看看基多拉耍笨 中間的頭會教訓旁邊的頭 也是讓人不禁莞爾




  而人性化最明顯的 莫過於風向鳥拉頓

  看到很多心得說 拉頓一舉一動 甚至表情都很有戲

  我真的深表認同



  一出場搭配火山岩漿 翅膀尾羽還帶著燃燒的灰燼

  而且活用爪子和翅膀來攻擊人類的空戰部隊 帥到我拼命尖叫驚呼

  雖然一下子就對基多拉俯首稱臣 但不得不說 一隻怪獸臣服的模樣

  能人性化成這樣 也只有咱們的尚書大人 我是說拉頓大人能做到了



  很明顯 一開始飛行的時候 地上城市的影子是以前日版特攝 拉頓剛出場的時候

  的精采畫面


  不過很可惜 在平成vs機械歌吉拉裡面 拉頓是會噴雷射的 橘色的雷射

  所以後來變粉加持哥老的時候 哥老就可以吐出橘色的原子吐息



  在美版這個武器就被拔掉了 有弱化的感覺



  當然啦打摩斯拉也是很帥 還壁咚摩姐要強吻 雖然被摩姐刺了一刀

  但那個被刺中的傻眼表情 絕對是最佳演技!!!!!!!

  演的比所有人類演員還出色!!



  不過這邊實在讓人覺得拉頓柿子挑軟的吃

  老大基多拉 在打哥老的時候 他老拉頓就躲著不出來

  如果不是基多拉吃了變電所吸收裡面的電 哥老早就把基多拉海虐

  反而等到摩姐出來 他老拉頓才覺得有機可趁 才出來性騷擾摩姐



  這樣對嗎



  難怪會被說是色魔拉頓




  然後這邊還要說 這版的哥吉拉 根本最悲情男主角


  首先被多事的人類軍隊用氧氣破壞者炸到重傷

  後來又被芹澤拿核彈炸他家




  如果不是後來摩姐變粉幫哥老療傷 哥吉拉是差點被體內輻射給搞爆的




  整部從頭到尾打好打爽 沒什麼遮遮掩掩 雖然人類方的設定

  尤其那一家人 給人一種專門搞事的感覺 但只要忽略掉

  專注在怪獸的戲 還是不錯傑出的怪獸電影




  至少對特攝粉來說 能在有生之年看到好萊屋版的哥吉拉vs王者基多拉 真的無憾


  --'
