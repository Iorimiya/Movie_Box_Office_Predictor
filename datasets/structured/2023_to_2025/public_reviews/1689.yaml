title: '[ 好雷] 蜘蛛人 新宇宙 -這就是我要的蜘蛛人'
content: '心目中經典蜘蛛人一直是陶比版蜘蛛人2>蜘蛛人1>其他


  這部動畫片（或者應該講動畫電影）真的讓我驚豔到了


  劇情非常有新意，而且前面開頭不久就有個震撼點，我是真的有點被震撼到了


  畫面、音樂、流暢度、類漫畫效果都非常棒


  雖然後面幾個平行宇宙的蜘蛛人戲份出來有點紛亂而且有點鬧


  但是整體絕對是瑕不掩瑜


  而且這部片滿滿的致敬啊，還暗婊了第三集XDXD


  原本也很擔心會有什麼政治正確問題幸好也沒發生


  總體而言如果喜歡蜘蛛人的朋友絕對不會失望

  因為我從頭到尾就是蜘蛛人迷，所以如果不喜歡或不了解蜘蛛人的朋友的感受我可能無法

  體會


  這部在我心中應該地位可以跟第二集比擬了


  --'
