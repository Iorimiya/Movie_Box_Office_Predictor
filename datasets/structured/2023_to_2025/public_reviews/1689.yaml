url: https://www.ptt.cc/bbs/movie/M.1509890346.A.43D.html
title: '[好雷] 雷神索爾3 這就是我要看的！大爽片！！！'
content: '一開始索爾被綁 以為是海拉綁他 結果不是


  原來是索爾自願被綁 為了要抓火焰巨人


  然後一直在那轉圈圈打斷蘇爾特爾的話 超好笑~


  索爾和奇異博士那段也是一直被整XD


  最棒的就是索爾到薩卡星遇到浩克那段

  還有想要革命的角鬥士們 昆蟲那隻很萌


  寇格還是導演演的XD




  讓索爾很有絕望感




  整部片就是爽爽爽








  雷神索爾3真的看得非常爽



  是今年到目前覺得看得最爽最愛的電影前三名



  若你覺得雷神1&2好看







  笑點超多


  真得很好看!!!



  到現在還是很開心



  太開心了 那就來發錢吧 每5推50P發到100推



  看過雷神索爾3也覺得很爽很好看的人都進來吧



  討論你最愛的笑點也可~ 一起來討論吧


  --'
