url: https://www.ptt.cc/bbs/movie/M.1514643453.A.6BF.html
title: '[好雷] 大娛樂家～這就是我'
content: "昨天去看了，人還蠻多的耶\n  很久沒看電影的我，帶著滿滿的能量離開電影院\n  覺得很不錯\n\n  整部片除了正向勵志的部分，很多人都說要表達的點太多了\n\
  \  我自己覺得，整部片圍繞的主題就只有一個『This is me』\n\n  rewrite the stars......認清個人存在的價值, 每個人的存在都有道理\n\
  \  而如何認識自己並勇敢活出自己的世界，那才是重要啊\n\n  各種階級的歧視、人種的歧視、天生特質的歧視...\n  這部片不過提醒自己，是不是認識了自己人生的價值，\n\
  \  This is me\n\n  包含主角在飛黃騰達之後開始偏離自己原先的軌道\n  never enough......但什麼才叫enough呢？\n \
  \ 還是回歸自己的本心，最初的自己是想要什麼啊\n\n  其實看起來很多向，但人生的走向本來就多變，\n  重點是是否認清自己的價值，並且不忘記自己追尋的目標.\
  \ 如此而已\n\n  上次完整看歌舞劇是紅磨坊...\n  後來陸陸續續在第四臺看過，但都很難看完(容易出戲)\n  覺得這部很棒的是歌好聽而且不會刻意\n\
  \  很能融入劇情，讓我不會有看歌舞劇的感覺\n\n  另外歌都很好聽, 進電影院就值得啦!  音效效果絕對不是在家裡看可以比擬的\n\n\n--"
