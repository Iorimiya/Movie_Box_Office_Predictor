title: '[好雷] 惡靈魔洛剋 Moloch (2022 荷蘭片)'
content: '我心目中荷蘭商業片三十世代第一玉女 Sallie Harmsen，上週 Netflix 才上了一部她主演的媽媽寶寶喜劇片《天賜奇蹟》Oei, ik
  groei! (2023)、這週院線又上了一部她主演的民俗恐怖片《惡靈魔洛剋》Moloch (2022)，看來能演恐怖片當尖叫女王真認證她是美女明星呀 XD 此片車庫宣傳是「溫子仁欽點恐怖新銳執導」，這新銳是在荷蘭第一次拍劇情長片的Nico
  van den Brink，他滿懷鄉土之愛宣稱「荷蘭也有很多鬼故事」也能拍民俗恐怖片、還真的影音整合節奏徐緩氣氛獨具地把這鬱金香國度拍成個森林沼澤鬼影幢幢的恐怖大地！片名
  "Moloch" 這鬼神是荷蘭傳統嗎？




  查一查看來也不是 XD 不過也沒人規定鬼神要固著在一個文化或一個地方，畢竟如果真有這鬼神祂也可以搬家旅行或擴張領域、如果這鬼神只是故事當然也可以任人口耳相傳、如果這鬼神故事只是在投射人間之惡那惡當然也沒有國界
  (!)。總之鬼故事若「忠於原著」就太好猜了，編導還是試著綜合了幾個當地傳說搭配上 "Moloch" 之名組成了個旁人無法預測的全新故事。看看爛番茄影評給此片 88%
  均分 7.2/10，不過影評們大多也都說「故事老套」已「不新鮮了」、但也稱讚「氣氛不錯」有「拍得到位」？以我這恐怖片麻瓜看來還頗有新鮮感！有塑造刻板印象亦有其翻轉。


  故事背景：「三十年前」1991年，還是八歲小女孩的女主角 Betriek被媽媽關在樓下儲藏室，但聽得樓上大人吵鬧聲越來越恐怖、恐怖到淒厲尖叫血流成河還透過樓板滴到她臉上！到底樓上大人們發生什麼事了呢？看著他們這間荷蘭內陸杳無人煙的森林木屋老宅內部，開鏡就是一個樓梯間好多先祖先賢全家福照片，這照片清一色是「三代女人」一代傳一代還常常穿民族服飾...
  到底這「女人家族」與看似民族風的「地方文化」或「小鎮鄉里」有什麼牽繫？為什麼這一堆照片中都看不見半個男人？在這開場樓上雖看不見但呼之欲出的「家暴」陰影下有何不為人道的兩性秘密？




  故事開始：「三十年後」2021年，Betriek 已長大成人當了現代作曲家，也生了女兒差不多也已八歲，只是不知為何一位作曲家不去文化都會工作、卻回到這窮鄉僻壤服務地方與學校？只是隨著童年那彷彿塵封記憶的恐怖陰影三不五時如惡夢襲來，今日這家鄉小鎮也正有怪事悄悄發生中：(1)
  有個自小神經兮兮的當地流浪漢每天遊手好閒煞有其事到處挖洞中、(2) 大家雖嘲笑他但他也真挖出些東西引起地方文史工作者關注、(3) 文史工作者找來丹麥考古學家與其國際團隊操著英語空降小鎮產生諸多摩擦、(4)
  怎知考古男主 Jonas要來問這流浪漢時才知「他昨晚離奇死亡」？


  隨著他們考古開挖一具具「古代女性獻祭」遺體宛如木乃伊般出土、每具都在喉嚨上有個「直向割喉」致命傷口，整個小鎮開始鬼影幢幢發生好多怪事！Betriek 自己開始時不時看到窗外有人遊蕩、考古團隊外來男人也時不時看到白衣女鬼、問起小鎮男人總言不及義轉移話題、問起小鎮女人則都津津樂道一些民俗傳說卻不當回事...
  只是當考古團隊一位男子深夜欺近 Betriek一家時這緊張衝突終於浮出水面！他竟宛如「被附身」般前來刺殺 Betriek的民俗風老媽！嗯，一個外來男子攻擊當地女性、當地男子口風很緊當地女子也心照不宣、到底這攻擊有何意義甚至有無傳統？




  電影當然會讓在地女主 Betriek 與外來男主 Jonas 談點小浪漫，不過浪漫時光總好事多磨都拿來考古查案，這查案指向的果然是個膾炙人口的當地民俗傳說 "Feike"，世世代代口耳相傳加油添醋如今已成小鎮傳統甚至文化節慶，雖然聽人講其故事內容其實世界各地都大同小異一點不新鮮：古代有個花心國王找了個小三、搞大小三肚子造成了醜聞、冷血王后
  Helen幫國王甩鍋「都是她的錯」要逼小三到絕路、小三走投無路悍然自殺從此成了女鬼 "Feike"！從此傳說 Feike冤魂不散肆虐人間至今、而王后鬼魂也留在人間以「Helen
  的呢喃」聲聲低語提醒人們防範 Feike攻擊。


  而這傳說中賜予小三邪能的就是片名惡靈"Moloch"！只是這種傳說的源頭故事有多少可信度？不論真假又投射多少數百年來的兩性處境？故事被加油添醋後的「奇幻」成分又有多少？這奇幻成分落實到我們當代社會又會以什麼型態呈現？抑或這一切根本都只是小鄉小民說故事本毋須庸人自擾？無論如何這麼一個王室版的「正宮護短逼死小三」之警世故事，背後的父權宰制與性別壓迫人人不意外，就算這是荷蘭但在小鄉小鎮仍充滿凝視，何況
  Betriek的老媽又被男性持刀攻擊？令 Betriek想到八歲女兒都都越來越憂心忡忡，這「女人世家」歷代所受的性別暴力宛如詛咒呀...




  的確，當我們身在當代社會尤其跟著女主 Betriek視角看，當看到男性鬼鬼祟祟、男性精神恍惚、男性神秘接近、男性身旁有刀、或是男性集體笑語神秘兮兮不知在說著什麼...
  怎麼看都令人覺得「性別壓迫」從中世紀一路至今仍陰魂不散！甚至隨著片中一具具「古代女性獻祭」遺體的出土、男人們一個個宛如被她們附身般前來殺女人、這難道除了實質的「男性傷害女性」外還有背後的「女人為難女人」？一路順著這套思路走下去只會覺得「又是一部女權電影」在搞
  SJW？的確看看爛番茄上也有影評就順著這個方向洋洋灑灑寫了篇歷史性別與民族學的批判考察呢（呵呵）。


  然而這套當代流行的女權思路，終究只是編導有意誘導出來的，電影看到最後危機解除還沒完、要到最後一刻拍拍抱抱才將若有似無「真相大白」！這真相我就不爆雷，甚至不同觀眾自己看看拼湊線索也許也會有不同解讀...
  我個人看完這真相大吃一驚後，倒不是對真相背後或人為或鬼神的世界觀感到驚懼，反而暗暗佩服古人世世代代植入人們心中的「神話創造」：古代犯事的事主當然要給自己擦脂抹粉、於是創造神話令人們根深蒂固相信某些事、轉移人們焦點他們就可千秋萬世複製惡行呢！本片刺激恐怖不多，幾乎全片都在建構這民俗神話，僅推薦民俗恐怖愛好者欣賞。



  --'
