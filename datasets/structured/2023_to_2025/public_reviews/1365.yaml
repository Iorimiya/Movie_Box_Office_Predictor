title: '[片尾雷] 飢餓遊戲：自由幻夢I'
content: '先來個防雷頁


  雖然我覺得這個雷真的沒有很雷（繞口令？）






















  片長兩小時


  如果不急著去洗手間的話


  片尾字幕跑完之後會有一個很漂亮的學舌鳥圖騰


  就是預告的那個動畫


  再附上口哨聲


  前後不到十秒  就這樣


  不過在大螢幕看起來非常美


  建議留到最後囉


  字幕時間不算長（跟MARVEL比的話大概不到一半時間XD）



  然後來個無雷心得


  這部片我是會給好雷的


  老實說第一集拍成那樣


  真的很讓人懷疑後面的革命起因到底要怎麼讓觀眾理解


  幸好第三集有慢慢圓回來了


  有人嫌內心戲太多


  說真的  小說裡面女主角內心戲根本超過2/3


  小珍妮佛好多段可以用短短幾秒的演技


  表現出原著裡面落落長的文字敘述


  超強！


  雖然角色本身個性我很討厭


  但光是去看小珍妮佛的詮釋就感覺值回票價了


  期待下集的完結篇囉


  明年四月還好久啊~"~






  --

  Sent from my Android


  --'
