title: '[好雷]飢餓遊戲-自由幻夢'
content: '剛剛忘了打防雷頁了QQ




























  終於等到這部片上映了

  整個就是等超級久的!!


  其實第一次看這ㄧ系列的片的時候

  我第一部看的是第二集星火燎原

  那實沒看一就直接看二

  然後又抱著是去看動作片的心情去看

  結果當下的感覺就是

  『阿....好悶的一部片』


  後來看完之後

  再回去找了第一集來看

  當下覺得『還蠻好看的耶』

  所以就把第二集再重看了一次


  然後才發現

  『靠.....這ㄧ系列的電影根本就是神作』

  劇情整個非常的讚

  我沒看過小說原作

  但是因為前兩部作品的關係而決定要來追這ㄧ系列的片



  回到這部片自由幻夢

  原本是打算衝首日的

  後來因為行程卡到所以一直到今天才去看


  剛開始的半小時有點出戲

  小小的恍神了一下XD

  不過還好很快就進入狀況了


  而且這部片有好多點都讓我好有共鳴的感覺

  在第八區的醫院那邊

  一個小男孩問凱妮絲院不願意和他們一起並肩作戰那一幕

  當下看得我也好想跟他們一起舉手吹口哨

  之後過不久都城開飛機來轟炸

  把整個醫院都炸了的那一段

  凱尼斯整個大爆走

  然後就出現了我覺得是整部片最經典的台詞




  對了這個GIF是我從這部預告片中截取出來的





  另外一個比較有印象的就是這首歌




  我不太清楚台灣把這首歌翻成什麼

  我自己是把他翻作吊刑樹

  而且那一段整個看真的越看越覺得難過

  有種莫名的感傷

  搭配著劇情

  有一種很深很深的無奈的感覺



  再來還有一個比較有印象的就是

  片尾他們去營救供品的那一段

  炸掉水庫後讓停電

  比提入侵都城的系統來掩飾他們的偷襲

  後來被史諾發現

  凱妮絲抱著黑密契(還是菲尼克有點忘了)那段邊哭邊喊著

  『我今晚會同時失去他們兩個』

  『我今晚會同時失去他們兩個』

  『我今晚會同時失去他們兩個』

  那一段整個雞皮疙瘩也都起來了


  不過最後還是成功的把貢品們給救回來

  可是

  比德的那一段戲我整個被嚇到了

  整個超出我的意料!



  最後看完別急著走阿

  片尾有一個的學舌鳥動畫

  整個做的超級漂亮又超帥的

  搭配著口哨真的好到沒話說!!


  話說...

  不知道為什麼

  我在這部戲裡面

  一直把菲尼克和蓋爾搞混

  一直把蓋爾誤認成菲尼克

  不然就是把菲尼克誤認成蓋爾

  囧rz



  最後還是要推一下這部片阿

  真的超好看的!!!

  心中三部片排名3>2>1



  題外話

  沒是別去看維基百科阿

  整個超級大雷！！


  --


  快去看！！

  自由幻夢真的超好看的！！




  也沒有吧

  變型金剛這麼無腦的片

  也是一堆負雷lol



  那些分數我都覺得看看就好

  自己看的高興開心就好啦XD


  很高興能幫到你XD



  你說得是醫院那段嗎?

  我也非常喜歡那一段劇情

  我自己覺得那是整部片的精華XD



  唉都..

  其實我沒有注意到他們的頭髮顏色不一樣耶哈哈

  再這部片裡面如果沒要叫名子的話

  我真的認不出誰是誰QQ




  真的阿

  劇情真的超級好讚

  音樂也很好聽!!




  感謝你!



  其實在看的前一天

  我有來這邊看了一下大家的感想

  本來還以為會被這部片洗版的

  結果一查發現這部片的心得文比我想像中的還要少很多

  而且還有不少的負雷

  讓我一度有點猶豫要不要去看


  後來還是堅持去衝了

  最後證明我的堅持是對的XD

  劇情真的好到沒話說!

  自由幻夢下已經列入我明年的片單了!!



  每個人都有每個人喜歡的電影

  或許你覺得不好看

  但我自己反倒是非常的喜歡這部片

  你有你的觀點

  我有我的感動

  只要你不酸我是工讀生之類的話

  我都覺得沒關係的



  剛剛發文的實後本來想說再YouTune搜尋看看有沒有影片檔的

  不過都沒有找到

  只有找到一半的




  這之影片只有前三分之二的部分

  後面還有一小段沒有出現的說

  等等看或許過幾天就會出現完整版的了XD


  我自己是很幸運的在進場的時候電影院撿了上一場的尾刀

  所以剛好看到了片尾的動畫

  真的說做得非常的漂亮XD


  同感

  動作的戲分大多都已經出現在預告片中了

  不過我是抱持著看劇情的心態來看這部片的

  所以對我來說影響不大XD



  片尾比德出現的時候

  我原本期望說他會擁抱凱妮絲之類的劇情文藝劇情

  結果鏡頭一帶到比德的臉我整個被嚇到

  之後甚至還對凱妮絲出手

  完全出乎我的意料之外!



  可以參考看看我上面貼的影片XD



  真的

  我現在野是超期待下集的!



  如果我用這招來分的話

  可能會把黑密契認成蓋爾lol'
