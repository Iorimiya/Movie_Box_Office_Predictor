url: https://www.ptt.cc/bbs/movie/M.1448326673.A.0C4.html
title: '[好雷] 飢餓遊戲：自由幻夢終結戰'
content: '系列終於完結了，一直為了避雷不看小說的我，終於可以看書了阿。比起沒有說到重點，

  隔靴搔癢的第三集前半，最後一部雖然沒有第二集來的刺激，但不至於讓人失望囉。






















  雖然給的是好雷，但一開始先來說說令人失望的地方。以一部動作片來說，可以說從頭到

  尾都緊張刺激，不過看完之後總覺得似乎少了什麼，因為電影沒有高潮。接續前半，又做

  為系列最終章，叛軍行動的鋪陳不斷堆積觀眾的情緒，到了即將大戰之時，居然天上飛來

  一些炸彈，Katniss不省人事，就結束了。醒來之後，得知已經推翻政府，妹妹不幸戰死

  。為何要讓好不容易堆積起來的情緒，沒有達到最高點就墜落了呢？



  除了這一點有點可惜之外，電影的其他部分倒沒什麼好挑剔的，只是不管是令人難過或是

  黑暗的元素都讓人無法招架就是了。如果大家還記得，出現在前年奧斯卡殞落影人回顧的

  最後一位，就是Philip Seymour Hoffman，而【飢餓遊戲：自由幻夢終結戰】正是他的最

  後一部作品。雖然吸毒身亡不算是「意外」身亡，但同樣令人震驚。Hoffman大學畢業後

  進入勒戒所，也順利恢復健康，可惜在飛黃騰達的20年後再度為毒品所害，而斷送了一個

  傑出演員的生命。



  我最喜歡的地方是，Katniss所率領的叛軍小隊在往都城推進的過程中，所遇到的「機關

  」就如同飢餓遊戲當中由遊戲設計師們所設計的難題一般。像是誤觸機關導致廣場出入口

  封閉，柏油湧入的場景就非常有遊戲的味道。而碰到柏油就被捲入並以鋼索懸吊空中則讓

  我想到【The Lord of the Rings魔戒三部曲】裡，Frodo因為碰到水而觸動湖裡的水怪的

  場景。如同前兩集飢餓遊戲進行時，觀眾與貢品們一樣不知道遊戲設計師們會祭出什麼樣

  的機關，緊張的氛圍串聯全場，毫不中斷。



  因為有如同飢餓遊戲一般的設計，電影的氣氛是凝重的，對觀眾來說最輕鬆也最賞心悅目

  的莫過於，最後一集如同大團圓一樣，所以過去還活著的人都出現了。不管是在第二集出

  現後擄獲許多女影迷的Finnick、青梅竹馬Gale，甚至在家鄉的媽媽、妹妹都在這一集當

  中露面。比較椎心的地方是，Finnick居然陣亡了。雖然是系列最終回，於電影於小說賜

  死角色都不會造成太大的傷害，但這也顯示出戰爭的可怕，如果沒有Finnick與小櫻的犧

  牲，這部反烏托邦作品就不夠到位了。



  另一方面，既然已經是最後一集了，「纏鬥」許久的愛情三角難題總要做出選擇。還記得

  Gale說過不只一次的「She''ll pick the one she can''t live without.」，我自己是覺

  得這句話就顯示出Katniss會選擇Peeta了。雖然當初Katniss自願參賽是為了妹妹，但這

  也表示她可以沒有Gale而活著，但不管是過去Peeta丟的一條麵包，或是進入飢餓遊戲之

  後同甘共苦、惺惺相惜的情感，都是Katniss沒有Peeta活不下去的證明。即使電影最後也

  明確呈現出Katniss選擇Peeta的事實，但我還是默默希望她是選擇Gale的，只是看到最後

  一幕時，再度讓我想到【魔戒】的設定。Frodo必須前往海外境地，因為有些痛苦與創傷

  是他留在中土世界永遠都醫治不好的，就像Katniss最後對孩子說她仍然會做惡夢一樣，

  飢餓遊戲的創傷應該也屬於無法抹滅的類型，而與擁有相同經驗的Peeta一起生活才是對

  他們彼此心靈最好的療育方式吧。



  最後，來談點輕鬆的吧(明明也不輕鬆)。我是非常膽小的人，上個月與一起來美國交換的

  朋友在萬聖節去遊樂園時，對鬼屋們是敬而遠之。即使知道是假的，也不願花錢嚇自己，

  而且重點是不想在腦海中留下那些猙獰的樣貌。但愛鬼屋成痴的大膽朋友們，居然都說這

  一集簡直比鬼屋還可怕，因為不知道該預期什麼。真要說的話，最可怕的大概就是從水裡

  冒出的變種怪獸了吧，讓我想到【Harry Potter and the Half-Blood Prince哈利波特與

  混血王子】當中，Harry與Dumbledore尋找分靈體途中，從湖裡跳出的死屍，可以說是全

  片我認真考慮要不要把眼睛閉上的片段了。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
