title: '[好雷] 飢餓遊戲:自由幻夢II'
content: '等了一年終於等到今天


  看完的心情很五味雜陳，有一點開心、一點生氣、還有很多傷感，

  但直衝我心中第一名愛片。


  上集的鋪陳在這集完全爆發了，劇情很緊湊，

  述說情感的部分和第一線戰爭的動作場面交錯，

  幾乎沒有什麼地方讓我可以喘息，也讓我流了好多眼淚Q_Q


  Peeta延續上集變得仇視著Everdeen並對她說了那些話、

  在首都被指甲油海襲擊時想殺了她、對她的眼神和話語感到懷疑，

  同時他也懷疑自己，拚了命的想搞清楚狀況，

  從一開始他表面上一直就是一個拖油瓶，

  但他卻是Everdeen最大的心靈支柱，

  儘管Peeta做了那些事，Everdeen仍然看著他、保護著他，

  每次看到Peeta拼命想控制住快發作的自己我也好心疼啊...

  Everdeen看著他心碎的樣子我就眼淚直流 T_T


  整部戲下來，我真的太為Everdeen傷感...

  最初她為了保護妹妹，直到電影最後最信任的ex男友(不願提起他的名字)

  害她妹妹死了，整個回到起始點零...


  雖然一路上有許多戰友相助，甚至為她犧牲(Finnick Q_Q)

  我想這些人一方面是為了民主、一方面是認同她的信念吧

  她莫名的被視為眼中釘，又莫名的必須成為他們的Mockingjay，

  自始至終她的努力，都只為了換得平靜的生活，最後卻失去更多，


  很多場景都有很多人，不過她還是「一個人」朝著她的信念前進，

  無畏捲入政治鬥爭之中、無懼犧牲生命，

  最後的結局我不覺得爛，

  雖然不像其他英雄電影有大勝邪惡外星人拯救地球爽度，

  但我覺得就是還給Everdeen一個平靜的餘生..

  只是背負著痛苦的過往，需要很努力、很努力才能讓自己平靜吧 T_T











  --

  會嗎~~~雖然好像糾結在兩個男人之中

  但我覺得他不是在"愛情"上的糾結耶

  大部分感情線我也覺得是以Everdeen個人思想和情緒轉折為主

  雖然愛情還是有不過我覺得只佔一小部分吧 XD

  這樣講好像有一點耶

  尤其野餐墊那邊 不過這麼省成本的場景應該不至於用貼的啦哈哈

  我倒覺得家鄉雪地那邊是不是跟第二集一起拍好的

  算間接嗎？我覺得他根本是Coin派來的間諜

  根本從頭就想進行她的計畫沒真心要幫Everdeen的意思-_-#

  畢竟Gale也是從小長大的ex男友

  還是有些以前的回憶跟不捨吧我自己覺得啦XD

  不過這種人想到就氣啊啊啊！

  m大說的我很認同耶！

  之前我沒想這麼深'
