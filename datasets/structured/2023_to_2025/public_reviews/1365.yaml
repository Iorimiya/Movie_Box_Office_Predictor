url: https://www.ptt.cc/bbs/movie/M.1416977275.A.BB4.html
title: '[好雷] 飢餓遊戲:自由幻夢I'
content: '在看這部電影之前，我知道版上一片大負雷

  我朋友也一直跟我打預防針說真的很無聊，

  所以我是抱持著"這集就是在鋪陳"的想法去的。


  但這部片完全沒有讓我失望！


  我想雖然取名為飢餓遊戲，不過重點並不是遊戲本身，

  而是整個世界正醞釀著革命，

  兩位總統的鬥智、正義與邪惡的交鋒這個"遊戲"，

  還有Everdeen從代妹參加遊戲到加入13區，

  她心境上的轉折和承受的壓力。


  旁人不顧她的感受硬是要她當Mockingjay，

  最後她是自願的嗎？我不覺得，

  Everdeen實在太好了解、太容易摸透、也就太簡單被操控了。


  我很喜歡的Haymitch和帥哥Finnick在這集戲份不多，

  但我覺得他們依然佔著很重要的地位，

  他們倆和小櫻是Everdeen在沒有Peeta時最大的心靈支柱，

  若是沒有他們，再堅強的Everdeen也早已沒辦法撐下去。


  很多人覺得整部片太拖戲，

  一直在拍奇怪的宣傳片，

  我想也許那個世界就是這樣吧，

  每一區都是孤立並窮困的，

  唯有全國放送宣傳片才有辦法一次讓全區人民集結起來，

  第一部是增加人民的悲痛(醫院無人倖存)，

  第二部是增加人民的憤怒(12區滿地屍體)，並且轉播讓Peeta看到，

  我覺得怎樣都無法刪減。


  我有點討厭Coin總統，

  他主導的革命，在我看來就像她在為自己的登基鋪路，

  她要Everdeen當反抗的象徵，

  卻不讓她調適頻臨崩潰的心情，

  演講照背好的稿念、固定的手勢與微笑、加上演講完違和的歡呼，


  最後一幕，在熱烈歡呼的背後，Everdeen的悲傷、Peeta的痛苦，

  強烈的對比著兩方心理上的不同，

  這讓我有一種毛到骨子裡的感覺，

  一種和Snow總統沒什麼不同的感覺。


  從一開始的Mockingjay標誌、口號到主題曲，

  看似各種宣傳項目，卻全出自真誠的Everdeen，

  革命團隊只是加以渲染罷了。


  我最感動的部分就是她每次和Peeta隔空對話，

  宅女我最嚮往美麗夢幻的愛情，

  看到他們悲劇般的感情我總是淚流不止嗚嗚嗚嗚嗚嗚.....



  在我看來好像一切都是假的，只有Everdeen是真的。





  --


  不行啦兩位

  放在現實世界太恐怖了 還是不要啦XD



  感謝推薦耶！不過我實在是太討厭看書了哈哈哈

  所以只能一起期待下集了~



  不會吧...我竟然爆自己雷了嗎@_@



  可能是我太容易被感動了，

  開演幾分鐘我就流淚了~也可能是太想念小珍了~



  我前天看完電影 昨天也是聽一整天~只是youtube一直被鎖T_T



  不...我相信他會回來的 用愛感化他Q_Q'
