url: https://www.ptt.cc/bbs/movie/M.1416580729.A.E4A.html
title: '[負雷] 飢餓遊戲，自由幻夢，簡單觀後感 '
content: '飢餓遊戲，自由幻夢，簡單觀後感：



  這部相對平凡，劇情沒有特別的張力。


  而且拍這部應該很省經費，毫無大場面，視角也不斷重複、少了新意。


  連敵人的空襲，都看不到攻擊的畫面，只看到主角們躲在地下室閒聊，天花板晃啊晃。


  不算難看，但以飢餓遊戲的名氣來說，太平凡了些，在拍革命宣傳片的地方，情感捕捉也

  有些粗糙，多了幾分匠氣。




  雖說是在鋪陳下一部，對於他的沉悶可以理解些許，但很難不讓人懷疑，多拍這部，只是

  為了多騙一部電影的票房。



  因為感覺不到足夠的用心跟細膩。


  --'
