title: '[極道落雷] Moneky jay'
content: '萬代福的票價真是超便宜啊


  想不透為何這個價位

  這麼新的二輪片


  還有更新後的設備


  好像人潮也是沒有我想像，應有的多地感覺~

  關懷本土..


  外國文化的底運很強哪


  光一個monkey jay 這單字

  感覺就孕育了很多人文在裡面



  難怪jay 要取 jay 這響亮的名



  老實說這第三集

  真的沒什麼爆點



  編劇也編得二二六六

  平淡無奇



  讓整個法西斯世界下的和詣社會

  還有那種被壓迫者的無力和恐懼


  這個反差完全沒有出來



  我想是不是美國太強大還是太勇敢團結了?

  總是扮演壓迫者的角色，所以他們無法體會被壓迫的感覺..



  這點要跟台灣學習，

  來台灣被山頭林立的慣老闆壓窄一次就會很成功的拍出了



  再者說小珍妮的表現也沒前兩集亮眼

  是否心情有受到慾照影響??\


  拍宣傳片弱是很正常


  可是實際那段在峰火前的喊話

  也是外強中乾


  0..


  應該是年紀太輕就少年得片

  無法體會那種人性黑暗面的威脅



  這點我相信她以後會更好..



  其實怎麼會到第三集大家表現都讓我感覺不對勁

  感覺像一堆菜鳥在演戲!



  除了老gy總統好一點

  薑是老的辣






  --'
