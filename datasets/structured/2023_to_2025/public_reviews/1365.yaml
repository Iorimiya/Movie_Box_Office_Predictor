url: https://www.ptt.cc/bbs/movie/M.1449471654.A.BC0.html
title: '[好雷] 飢餓遊戲自由幻夢2-這場遊戲沒有贏家'
content: '>>網誌圖文好讀版：


  “Katniss, I’ll say this to you: You don’t disappoint.” -- Haymitch Abernathy (Woody
  Haralson)


  當Katniss Everdeen (Jennifer Lawrence)最終射出粉碎威權的一箭，Haymitch不改他諷刺本性地下了句註解，語卻道出驚呼中的觀眾們心裡話。


  不可預知性一直是Katniss的特質，她為了頂替妹妹Prim (Willow Shields)而自願參賽，在比賽的最後關頭威脅自殺，甚至炸翻競技場，再到《自由幻夢：上》各種無預警的鏡頭前演出，Katniss從不照著劇本走，因為若非如此，她不過是另一個當權者的一枚棋子。如此看來，Katniss將箭射向反叛軍首領Alama
  Coin (Julianne Moore)而非總統Snow (Donald Sutherland)，毫不意外。


  然而，Katniss從沒想成為一名女英雄，或是反叛軍的精神領袖，動機總是單純的：因為她愛她的家人，她願意犧牲自己；因為與Peeta Mellark (Josh
  Hutcherson)醞釀著愛情，她願意吃下毒果；因為看到Peeta被洗腦而憤怒，他決心刺殺總統Snow。Katniss從不想領導，甚至不認為自己能獲得勝利，我想Katniss之所以吸引人，不是她的堅強，而是她的脆弱與柔情。


  舉例來說：當Katniss在第二區火車軌道上，難民拿槍指著她的頭，問說："Give me one good reason why I shouldn''t shoot
  you?"，她的回答很簡單，"I can’t."，此刻，Katniss赤裸裸地、毫無抵抗能力地，呈現在我們面前。Katniss道出殺戮可以很簡單，不需要任何理由，但她深知嗜血正是這75年來都城透過飢餓遊戲，灌輸給施惠國人們的意識形態，因此她能冷靜、不帶表情的說服所有人應該團結一致對抗暴君，因為團結，也可以很簡單！


  Katniss有過不少振奮人心的演說，她曾說："If we burn, you burn with us."，但她人性光輝的一面，讓她更貼近體制中反抗的人們。火車軌道這幕的情緒張力其實令人聯想到《飢餓遊戲：首部曲中》，Katniss幫小芸鋪上花圈的情景，都是透過直白的表現凝聚不同區的人們。


  我認為《自由幻夢：終結戰》是成功的收尾，因為他呈現了歷經戰爭，身體上的傷可以復原，但心靈上的傷永遠無法撫平，這是近年其他奇幻大作可能忽略的。


  談到戰爭，Gale (Liam Hemsworth)告訴Katniss："Sometimes killings isn’t personal."Katniss慍怒回道："It’s
  always personal."，她知道Gale已不再是他當年一同打獵、養家的夥伴，復仇成為他唯一目標。最後Prim死於Gale策劃的大爆炸，可說是對Gale殺戮決定的一大諷刺。


  至於Peeta，「Real or not real」是他本集的核心議題，被都城洗腦後，事實與謊言融為一個不可區分的概念，Peeta問Katniss："You love
  me. Real or not real?"當相愛的兩人睡在一起，卻還得時時做這樣的fact check，不正是情侶間最大的悲哀嗎？


  最後，經歷兩次的飢餓遊戲以及這場大戰的創傷，比起電影結尾中，Katniss似乎找到內心真正的平靜，與Peeta生兒育女的場景，小說的鋪陳似乎更具說服力。


  畢竟Katniss曾說因為飢餓遊戲的存在，她永遠不會考慮生小孩，Suzanne Collins在小說中這麼寫到：「彼得想要孩子想得要命，但過了五年、十年，乃至於十五年，我才答應，當我第一次感覺到她在我肚子裡動，恐懼吞沒了我。那恐懼，感覺像是遠古之初就已存在。」而這樣的陰影不會因為飢餓遊戲的取消而消失，遺留的震撼恐懼，才偏向小說原旨希望讀者反思的脈絡。


  >>網誌圖文好讀版：


