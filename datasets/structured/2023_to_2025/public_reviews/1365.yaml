url: https://www.ptt.cc/bbs/movie/M.1417109436.A.710.html
title: '[好雷] 飢餓遊戲-自由幻夢I'
content: '============================防        雷         頁===========================











  我覺得整部電影有許多引人入勝的片段，


  可惜因為劇情必須在女主角細膩的心境和革命磅礡的格局之間轉換，


  使得流暢度稍嫌不足，


  但整體來說，還是一部好看的電影。




  我覺得電影太刻意想帶出凱妮絲對革命的重要，而讓某些片段有點奇妙。


  電影預告中"if we burn, you burn with us!!!"這句話很有力量，


  但正片裡這段我卻沒有那麼有感覺。


  因為它給我一種刻意感。


  我覺得鋪陳到凱妮絲探視醫院為止，情緒已經被逐步拉升，


  但凱妮絲在攝影棚裡明明這麼尷尬僵硬，


  雖然因為醫院被轟炸了而激動，然而馬上就因此而對著攝影機講話，


  甚至知道講話講一講要轉身去看另一台攝影機繼續講?


  總覺得看起來有種不連貫的感覺。


  另外，由這段拍攝所剪接的宣傳片也處理的有點粗糙，


  可以把只有凱妮絲的攝影棚變成華麗背景和戰士們的團隊，


  應該能夠把宣傳片做地更震懾人心啊!





  相較於"you burn with us"的段落，我覺得"The hanging tree"的片段


  就把凱妮絲這隻小小學舌鳥如何激起全體人民革命表現地順暢而淋漓盡致。


  這個段落從一位去聲人-波呂克斯以手勢請凱妮絲唱歌開始。


  凱妮絲是個倔強又有點彆扭的女主角，


  如果是指揮中心要求她"欸  給我們唱首革命主題曲吧"


  結果想必就像要她拿著竿子在攝影棚裡大喊口號一樣尷尬。


  然而她拒絕不了一位去聲人用那樣靦腆的笑容問她要不要唱歌─於是她唱。


  不是為了革命，不是為了拍片，所以這首歌才動人。


  歌聲持續，而畫面帶到奎希妲拍下了唱歌的凱妮絲、


  普魯塔克將這些畫面剪成了宣傳片。


  接著，越來越多人聲加入這首歌曲，就像越來越多施惠國的人們加入了革命一般。


  人們用肉身抵擋維安人員的子彈，直到將炸藥送進水壩區為止。


  凱妮絲唱這首歌的時候，也許從沒想過她所帶來的力量。




  我覺得凱妮絲對革命既排斥又無法置身其外的心情是很有趣的。


  從第一部以來就不難發現，凱妮絲對於該不該革命這件事相當舉棋不定，


  甚至可以說她幾乎比較偏好自己逃走，而非帶頭反抗。


  但是她的叛逆和自我保護，讓她一次又一次挑戰都城的底線，


  她所燃起的小小火花，意外點燃了施惠國人們抑鬱已久的怒火。


  即便離開了遊戲到了第十三區，


  自由對凱妮絲而言，仍然只是幻夢一場。


  過去，她在飢餓遊戲種扮演都城的棋子；


  而今，她則扮作柯茵總統和反抗軍的學舌鳥。


  之所以說"扮"，是因為成為學舌鳥並非凱妮絲的本意，


  看了十二區被都城變得多殘破、而彼得又是怎麼樣被都城囚禁和利用，


  她才願意去做那隻學舌鳥。


  結尾前柯茵的演說對照比德病房前的凱妮絲就是最好的說明，


  當柯茵宣揚著第十三區的勝利以及勝利者們被「成功救援」；


  凱妮絲帶著護頸，用悲傷和驚懼望著在病榻上發狂的比德......




  我本來就喜歡珍妮佛勞倫斯，而連恩漢斯沃則短暫的被扶正，


  終於有大把時間嶄露他的帥臉~


  不過最讓我印象深刻的是喬許哈契遜。


  在看第一部時我老是希望凱妮絲跟蓋爾在一塊，因為蓋爾比較帥(默)


  到了第二部大概是因為也看習慣了(?)


  加上喬許把比德那種溫暖穩重又深情的模樣表現得很棒，所以也漸漸覺得他越看越順眼。


  到了這一部，我雖然已經看過小說，知道比德說多慘有多慘，


  但當比德真的出現在螢幕上，還是令我揪了一下，


  他看起來比我原先的幻想還要更憔悴。


  喬許把比德眼神和聲音的轉變都表現地很傳神，


  他不是立刻就把比德演成憎恨凱妮絲的怪物，而是由理性、疑慮、恐懼、逐步轉為恨。


  雖然出現的時間不長，但完全把比德被都城改造的過程展現了出來。


  而且下一部他應該又會打敗小索爾變回男一吧XD





  我覺得這一部的調性和前兩部不太相同，


  前兩部的色彩很豐富：


  施惠國的片段總是灰撲撲的，而競技場則是華麗而致命。


  角色的個性也都非常鮮明，


  除了主角群之外，戲份比較多的貢品們的特色也都很明顯。


  而這一部...


  因為進入嚴謹的十三區，所以畫面色調也跟著規律起來，


  而角色們之間的歧異度我個人覺得有些下降


  前兩部的主角群們幾乎都因為受傷(心靈和身體)而變得悲傷或瘋狂


  在十三區結識的盟友們因為大致上是受軍事化管理，


  所以也不可能出現芬尼克或是喬安娜這類有突出性格的人。


  雖然它大部分還是用女主角的角度在說這個故事，


  但也有許多時候，它必須拉大視野來講述整場革命。










  ============================ 以下有小說雷，請慎入 ============================








  在電影裡，凱妮絲是用手電筒逗貓，結果發現都城就像用比德在耍她一樣，


  才意識到都城可能會因為她是學舌鳥而如何傷害比德。


  不過我覺得在小說裡對凱妮絲的心境有更明確地描述，


  凱妮絲在用光逗貓的時候發現：


  當光出現在貓咪碰得到的地方，貓會精力旺盛的四處撲，


  一如凱妮絲剛發現比德還活著的時候；


  當光完全熄滅，貓咪會一時焦躁接著就回復過來，


  而凱妮絲相信如果比德死了她會有相同的反應；


  但可怕的在於，


  當燈光開在貓咪觸不到的地方四處晃動......


  就像史諾讓狀況越來越糟的比德不斷出現在螢幕上一樣，


  這讓凱妮絲恐慌、崩潰、無法再做學舌鳥了。




  有一些書裡我很喜歡或覺得重要的小片段並沒有在電影中出現，


  不過電影中的凱妮絲沒有將「要殺史諾總統」列在作為學舌鳥的條件裡，


  還滿讓我驚訝的。


  書中凱妮絲是將這點列在所有條件的最後，而且是在近乎恍惚的情況下把這點寫下來，


  在我看來，凱妮絲這樣的信念對於整個故事走向相當關鍵。


  另外，


  小說裡，轟炸第八區只是例行攻擊，而非針對凱妮絲；


  此外凱妮絲也沒有在營救比德行動中和史諾對話。


  看起來電影在凱妮絲跟史諾的關係上做了一些調整，


  所以令人挺好奇電影到底想走向什麼地方？




  我是看過小說才去看電影的，


  我自己覺得這一部是跟小說差異最多的一部，


  如果喜歡這部電影的話，我覺得可以翻翻小說，


  會對劇情有更深刻的感受，


  因為小說是以凱妮絲為視角所寫，所以內容有她大量的小劇場XD


  而這些要完整用電影呈現也許比較困難吧？


  所以有些在書中用動作或OS表達的東西，被改成能夠實際呈現的方式來表現。




  舉例來說，黑米契去跟凱妮絲談比德救援計畫的片段。


  在小說裡黑米契其實是努力地要隱藏蓋爾自願去的這件事而表現地過度歡欣鼓舞，


  以至於凱妮絲起疑而問了"還有誰自願?"


  黑米契回答有七個人自願來避重就輕，最後在凱妮絲的追問下，


  他不得不說說"妳知道還有誰，妳知道誰第一個站出來。"


  而凱妮絲的心中浮出了─蓋爾。


  雖然觀眾們一樣都知道了蓋爾自願要去，但我覺得氛圍跟電影不盡相同。


  我想，


  原著說的是屬於凱妮絲的故事，而電影則是更宏觀地來講這個故事，


  不論如何，它是個好故事:)







  不小心就打了落落長...謝謝大家聽我mur mur XD


  --'
