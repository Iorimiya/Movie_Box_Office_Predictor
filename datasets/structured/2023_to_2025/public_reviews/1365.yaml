title: '[討論] 飢餓遊戲之自由幻夢的三個無雷錦囊'
content: '鬼島也有大逃殺？《飢餓遊戲之自由幻夢》的三個錦囊帶你看電影救台灣！






  選前看到這個影片覺得真的超級酸


  把連D和KMT全部酸一輪


  雖然實際上台灣的環境其實沒有那麼簡單


  政治因素比都城和13區的關係要來的複雜多了




  但錦囊三講到的飢餓遊戲和台灣的相似之處


  真的是蠻無奈的很像


  畢竟飢餓遊戲的原著小說強調的就是對政治和社會的諷刺


  電影版為了票房，這個部分還是不能講太多


  只好期待1984的電影版趕快誕生了！




  --'
