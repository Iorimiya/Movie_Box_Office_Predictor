url: https://www.ptt.cc/bbs/movie/M.1417013155.A.DB6.html
title: '[普雷]飢餓遊戲：自由幻夢I'
content: "為了要回家帶妹妹一起去，拖到禮拜天才看，看完之後吃喜酒、回台北之後的課程，一直\n沒空把心得打出來。Delay這麼多天之後還是寫完分享給大家囉。說實話，是有些失望，\n\
  不過不會到負雷的程度，但是在這篇心得裡比較著重在說明為何不喜歡以及感到失望，但\n還是有褒揚的部分，還希望不要被鞭。\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n    看到這個標題可能會覺得莫名其妙，但其實我是要表達其中一慕給我的感覺。這一集\n最大的亮點在於Peeta，一次是Peeta第一次透過媒體發言，一次是救援行動之後Peeta的\n\
  改變。我還記得一個禮拜前看【Fury怒火特攻隊】時，有【飢餓遊戲】的預告。透過剪接\n，把電視畫面和「Peeta是他們的武器，就像妳是我們的武器。」放在一起，很容易就會\n\
  讓觀眾相信Peetta是幫都城的。就像District 13的人聽到Peeta的話便認定他是traitor\n一樣，只有Katniss看出他是被逼的。而在Peeta洩漏攻擊，讓District\
  \ 13人民平安躲過\n之後，受到更嚴重的虐待。(雖然後來有說明hijack藥要吃一段時間才會這麼強效，但\nPeeta歸來時的臉應是新傷，而且是外傷，跟藥應該無關。)救援行動成功後，Katniss前\n\
  往探視Peeta時，他是背對的，我就覺得有什麼事要發生，當Peeta攻擊的瞬間，我雖然有\n驚嚇，但卻止不住笑，因為我想到【28周毀滅倒數】。同樣是從敵營歸來的受害者，因為\n\
  親密的人在尚未弄清危險性之前就進行近距離探視，而造成傷害。活屍片的橋段出現在這\n是有點讓我出戲。\n\n\n\n   一個學長看完之後說，這一集就一直在看螢幕跟演戲。一開始要拍Mockingjay代言人\n\
  廣告時真的蠻有笑點的，而且後來其實都不是「演戲」，因為Katniss演不出來，但很大\n的一部份都在「拍戲」。姑且不論援助的處理方式，而是決定將第三集拆成上、下，但上\n\
  卻都在拍戲，總覺得有點不知所以。\n\n\n\n    我不知道這會不會成為bookend，但在Snow總統宣布所有關於Mockingjay符號都受到\n禁止時，他的孫女巧巧把髮飾摘下，不知道下集是否會出現來自都城內部的叛變者，覺得\n\
  有趣。\n\n\n\n    延續前一個項目，不管是Mockingjay的符號、手勢或是代表Katniss的曲調，都被禁\n止了。在Foucoult語言言談運作裡，屬於排外律的「禁言」，而這也說明了為何在一些反\n\
  政府的行動哩，會使用遭禁止的「符號」來代表「行動」，一方面因為無人使用不會產生\n「誤認」，一方面因為只有相同理想的這群人才無畏「禁言」使用這些符號。例：【\n\
  Harry Potter哈利波特】裡的Voldemort和You-Know-Who。\n\n\n\n   看完這集之後，最大的感覺就是這只是下一集的預告片。就像【Twilight：Breaking\n\
  Dawn暮光之城：破曉I】整集都在講Bella變成吸血鬼之後的改變，故事幾乎沒有推展。【\n自由幻夢I】除了告訴大家他們如何激起各區人民的鬥志，沒有佔很多篇幅的救援行動以\n\
  及Peeta下一集會如何的伏筆之外，故事也是沒有推進。\n\n\n\n    我以為我看的是冒險科幻片，但就像拍廣告時說的「妳剛打完仗。」爆破、灰燼、醫\n院的場景，卻讓我感覺在看戰爭片。他們的確是和都城在「打仗」，但貌似真正的戰爭下\n\
  一集才會開始阿。明明故事沒有推進，呈現出來卻是這樣。雖然劇情現在就是走到這了，\n但第一、二集那種帶有冒險和科幻的色彩，才是這個系列吸引這麼多人的原因吧！(應該\n\
  也會有人覺得跳脫前兩集的模式很棒，見仁見智沒有要戰^^)真的要說，爆破場景其實也\n就一個，不過在醫院比出Mockingjay手是讓我哽咽這種事，好像是戰爭片效果了，【飢餓\n\
  遊戲】的風格應該是像為小芸哀悼讓我掉淚阿。\n\n\n\n--\nViola's World：Screen Scream影迷尖叫屋\n\n請大家多多指教~\n\n\
  --"
