url: https://www.ptt.cc/bbs/movie/M.1447944720.A.726.html
title: '[無雷] 自由幻夢簡短觀影心得'
content: '其實我是書迷 但我會試著從非書迷的角度說


  電影的場地、美術、特效都做得很宏大

  對比之前十二區貧民的生活環境或是遊戲場地裡的荒山野嶺 都城還是比較接近我們日常

  的城市 所以今次有一半在都城的戰鬥看得很有代入感XD

  其實我一直覺得飢餓遊戲電影外的海報、宣傳才是最讚的 上次的純白雪諾總統雕像和今

  次被打碎的 感覺比一般電影隨便用電腦拼一拼圖用心很多


  想看爽片的還是不要看了

  雖然動作戲多了 但還是偏少

  男一男二戲份也挺薄弱的

  不過小珍好幾幕都讓我熱淚盈眶


  最不滿的是

  Francis Lawrence導演的力度感覺還是差一點

  (雖然比第一集好）或者該說剪接得不太好

  應該是需要渲染情緒的劇情 他總是跳得很快 有時觀眾也不知道甚麼事就到下一段 他是

  直接把所有人當書迷 理解這段發生甚麼事。

  好幾個本來該是感動/震驚/悲痛的情節 如果上點配樂、角色特寫幾秒 我應該會哭出來

  基本上從第二集他已經是這樣


  不過這部總算是落幕了

  雖然我一直覺得戲外的小珍比Katniss更有戲劇性更可愛


  --

  印象中沒改主要情節 但感動/傷心遠不及小說...


  我看的是2


  導演/編劇就是預設會看的都是書迷 感覺甚麼都沒很清楚 不過畫面算很還原'
