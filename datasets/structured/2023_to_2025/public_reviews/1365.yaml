title: '[好雷] 嗑電影：飢餓遊戲：自由幻夢2'
content: '"真的或是假的？"


  .

  圖文網誌版，歡迎上：


  .

  上一集，


  可以算是這一集的一個前導預告片，


  擺明著是搶錢用的，


  但是，


  以一部完結篇的電影來看，


  這一部，


  算是拍的不算差的一部作品了，


  中段的第76屆飢餓遊戲，


  一反之前的叢林戰，


  這一次的場景來到了都城與其地下，


  頗令人耳目一新的~~


  整體下來，


  節奏十分的流暢、明快，


  以娛樂性而言，


  算是比上一集好的多了~


  結局的部份，


  我還蠻喜歡的，


  激情過後，


  就是該歸於平淡，


  平淡，就是一種幸福吧~~~！


  .


  在角色與演員的演出部份…


  底下有雷，請自行斟酌…

  .


  .


  .

  這片在我看來，


  主要是聚焦於凱妮絲的選擇上…


  選擇蓋爾還是比德…


  還蠻喜歡那場兩個男主角(情敵)在對話的那場戲…


  那時的凱妮絲應該還沒做好決定吧…


  心底應還是在糾結著…


  直到妹妹的死亡，


  才讓她做了選擇…


  再見！蓋爾…


  .


  從片頭一直到片尾，


  都看到珍妮佛滿滿的演技，


  雖然乍看像面無表情，


  但是其眼神卻透露出凱妮絲心中的吶喊~


  她，不想再當棋子了！！！


  也不想再有那麼多的政治算計與犧牲…


  所以才會選擇了比德吧！


  因為他的心比較善良…


  .


  回到家之後，


  對著貓發飆的那場戲，


  算是抒發她心中對小櫻的不捨嗎？


  畢竟，當初是為了她才自願當貢品的，


  但是最後卻還是失去了她…


  那場戲，看得我好心疼，


  也佩服珍妮佛的演技，


  是如此的打動我…










  --'
