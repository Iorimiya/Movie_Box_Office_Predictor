title: '[大好雷]飢餓遊戲3:自由幻夢part2'
content: "小弟今天去台南大遠白威秀影城看了飢餓遊戲3，果然沒讓我失望雖然小弟已經看完小說\n，知道哪些人會死那些人會活，不過音效跟視覺效果仍十分震撼。自己看小說時腦海\n\
  中的想像場面竟然跟電影沒差多少，連人物也是，看來大家對小說中的描述頗有共識~~\n不過還是得來噓噓最後一幕女主角的裝扮，媽的那結實的手臂是怎樣啦XDD，穿著的也超\n\
  級土，造型也太失敗了，別跟我說是幸福肥啊。還有再殺無眼變種的時候怎麼一滴血都沒\n噴啊，應該是礙於電影分級制度跟票房所以才沒噴的(這聽起來好句怪)，個人覺得來個\n\
  幾滴血漿會更有感覺~\n劇情當然主要是悲傷走向，不過小弟一直被惡搞版雞餓遊戲影響，看到凱妮絲媽媽出現的\n時候含愣了一下想說她不是發瘋了只會滴口水嗎XDD，腦海中也一直浮現洞窟的騎馬馬畫\n\
  面\n，搞得我一直在偷笑，我朋友還問我是不是有病啊看他們殺來殺去還笑得那麼開心，不太\n好意思跟他解釋笑點在哪，因為旁邊的人聽我跟我朋友的對話也在竊笑，一整個難以啟齒\n\
  。喔當然了最讚的還是看到凱妮絲拿箭射死xx的瞬間，雖然早被小說劇透光了還是很有\n魄力也很震撼。\n這部真的好看，內心戲雖然比小說少，但畫面特效跟音效可不是蓋的，不管看過小說還是\n\
  沒看的人都可以試試，絕無冷場。\n小弟的MOVIE板首PO，不太懂得抓重點還請見諒XDD\n謝謝各位大大的閱讀~\n\n\n--\n 12/06 21:55每個人的感覺不一樣啊~\n\
  \ 12/06 22:12是可以滿足我\n 12/06 22:23真的沒差多少\n 12/06 22:25感謝支持XDD\n 12/06 22:27是阿~音效可是一大賣點\n\
  \ 12/06 23:25可惜小說劇透光啦~不然一定更感動\n 12/07 01:10是阿~很好看\n 12/07 02:30我不太尬藝\n12/07 09:13小說內心戲更多喔~\n\
  \ 12/07 09:31電影票很貴ㄟ還看到睡著(嘖嘖\n 12/07 10:19主要是演技啦~外貌其次，再說演員全部瘦巴巴的也不好看\n小說中在飢餓遊戲時，女主角吃了甚麼東西都寫得很清楚，表達出他\n\
  們餓了很久的感覺，不知道這是不是你要的答覆XDD\n 12/07 12:28每個人的看法不同啊~\n 12/07 17:53哈哈~我們要尊重不同意見\n哈哈~有3D小弟也沒錢看啊XDDD"
