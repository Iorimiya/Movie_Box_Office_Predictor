url: https://www.ptt.cc/bbs/movie/M.1416800564.A.D22.html
title: '[普雷]讓高牆倒下-飢餓遊戲：自由幻夢Part1 '
content: "「怒火已經燎原，如果我們毀滅，你們也會跟我們同歸於盡。」\n\nFire is catching, and if we burn you burn\
  \ with us.\n\n相對於許多朋友對於這部電影所感受到的沉悶，其實【飢餓遊戲：自由幻夢Part 1】的取\n衡有些特別，不是像【哈利波特：死神的聖物】將劇情內容完全側重於上集，或像【暮光\n\
  之城：破曉】那樣將故事完全擺在下集，這上半部的【飢餓遊戲】就是這樣穩穩詮釋完革\n命前夕，革命為何而來，我們面對必要的犧牲怎麼面對。\n\n成功讓【飢餓遊戲：星火燎原】在評價票房都名利雙收的導演法蘭西斯勞倫斯，這回的【\n\
  飢餓遊戲：自由幻夢Part1】確實是莫大挑戰，小說確實沒有前兩集來得好看，故事更從\n創意十足的飢餓遊戲縮化成烏托邦小說必然有的革命戰役，小說又寫得不出色，讓【飢餓\n\
  遊戲：自由幻夢Part1】有了先天體質不佳的原因。\n\n不過在有限的篇幅下，我其實覺得這次的【飢餓遊戲】所做的努力還是必須給予肯定的，\n電影這回更進入凱妮絲、蓋爾及彼得的三角關係之間，讓我們對於這個角色更為清晰，不\n\
  過也許是因為個人私情太過明顯，反而讓電影的格局變小，前兩集像是假性烏托邦的時代\n悲歌，這集就像是在大時代悲劇下依舊守護愛情的女人，也許是因為重點必須擺在下集的\n\
  原因。\n\n凱妮絲的聰慧靈敏，到了這集顯得情緒化，光電影一開頭便有失眠的崩潰戲碼，全片只有\n在片尾接近尾聲時主動表示要聯繫史諾總統有些魄力，其他皆被故事主體牽動著，沒有前\n\
  兩集的魅力。\n\n由連恩漢斯沃飾演的蓋爾總算在這部電影列為正宮，不再是前兩集的苦情男配角，他的角\n色一樣苦情，但這回被扶正為男主角，雖然我們都知道僅限於這集，結束之後，下集我們\n\
  又將迎回彼德。\n\n最終忍不住提到片尾大大的字幕In the Loving Memory of Philip Seymour Hoffman，突\n然想起來他已經於年初逝世，此後再也無法看到他有如變色龍的精彩演出，驟然被點醒而\n\
  感到悲傷，這應該是觀看【飢餓遊戲：自由幻夢Part1】的意外感受\n\n--\n歡迎來到我的新家\n白色豆腐蛋糕 \n也來我的粉絲團聊聊天\n白色豆腐蛋糕 \n\
  \n--"
