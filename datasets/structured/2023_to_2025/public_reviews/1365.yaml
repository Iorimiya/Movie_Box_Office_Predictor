url: https://www.ptt.cc/bbs/movie/M.1448124870.A.9A8.html
title: '[普雷] 現實社會粗略縮影《飢餓遊戲：自由幻夢'
content: '繼《自由幻夢》令人昏昏欲睡、如坐針氈的鋪陳下，終於迎來了狠狠剖成兩半的下半部。

  平心而論，這集是好看及格的。

  .

  要形容本片的表現力道，那大概就如同陀螺一般，轉得正猛之時反而似靜不動。當你認為

  當下那個時間點，正需要些火藥轟炸加持、需要點腎上腺燃燒、需要個大場面壯壯聲勢時

  ，導演就是不給你。但這並非說影片就沒有任何激動人心的時刻，反而那些激情總是刻劃

  在角色的臉龐上，及那些深刻的政治陰謀論述與人物間的情感糾葛之中。

  .

  這種慢步調的況味，或許是出自於吃相難看地將完結篇一拆為二下的不幸結果。但既然分

  割的事實已定，那就帶著與當年看《哈比人三部曲》一樣的心態去觀影吧：從不完美找亮

  點，從沉悶中挖感動。正是在這種還算健康的心理調整下（以及沒有讀過原著的前提），

  這個章節，多次令我哀痛欲絕，多場劇情轉折讓人不可置信到甚至啞口無言。這絕對是整

  個系列裡最灰暗、無生氣的一部，期望從中吸收幽默、享受傻大姊珍妮佛勞倫絲的逗趣，

  或是一點點快感，你絕對會大失所望。本片有的只是不間斷的傷感與壓抑，這部分讓我頗

  感意外。

  .

  這個系列自《飢餓遊戲：星火燎原》震撼尾聲後，就正式脫離了純粹的動作娛樂，走向了

  個凡常觀眾較難適應的政治棋局。但比較特別的是對於「媒體煽動」的書寫，卻是整個系

  列一貫的主題。打從首集就點出了廣告公關、高收視節目之間的那一灘媒體操縱人心的髒

  水。但脫離遊戲後、加入反抗軍的凱妮絲，同樣也受控於造假的公關宣傳片，這跟她在遊

  戲中謊言宣傳的模式有何不同，而這個立場轉換卻本質不變的命題，非常值得觀眾研究與

  省思。

  .

  所以我們看到了影片將「媒體暴力」嘲諷到了極致，片中明星小隊攝影組、或說那背後的

  高層在面對房屋倒塌、群眾傷亡下，仍面不改色的思考如何才能將英雄主義宣揚到最大化

  的醜陋。甚至變本加厲地，這群急欲推翻極權的一方卻演變成製造暴力的那一方。尤其最

  後獨裁者的終結，卻迎來了另一個暴政時的政治諷刺，更是深刻傳達出經過暴力得來的自

  由民主，不會是純正的自由民主，唯有民主選舉才是出路與歸宿。

  .

  《飢餓遊戲》這個系列的成功，在於框住了屬於這個時代特有的精神狀態和社會思維，透

  過凱妮絲對抗暴政、忠於自我的面孔，折射出這個時代下特有的人類樣貌。正如同《一九

  八四》、《華氏451度》、《美麗新世界》這些經典文學一樣，為觀眾設計了一個虛實難

  辯的反烏托邦世界觀，然而與其說是虛構捏造了未來烏托邦，不如說它們都是一個現實社

  會的粗略縮影及預言。《飢餓遊戲》體現了人民自由意志永遠高於國家機器，這是老生常

  談沒錯，但它卻以最貼近人心、易於咀嚼的方式，傳達出這個永恆存在的現象，光這一點

  就值得了。


  --'
