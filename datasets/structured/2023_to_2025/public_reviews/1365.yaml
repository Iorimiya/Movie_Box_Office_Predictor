url: https://www.ptt.cc/bbs/movie/M.1416124895.A.C8C.html
title: '[外電] 年終強片分析：飢餓遊戲－自由幻夢(上)'
content: "by Ray Subers\n\n前言：知名票房分析網站BoxOfficeMojo，近年都會針對兩個重要檔期的強片做票房預測\n專題，一個是暑假檔，另一個就是年終橫跨感恩、耶誕與元旦三個重要假日的年終假期\n\
  檔(美國稱為Holliday Season)。\n\nBOM今年預測暑假電影票房的成績其實並不理想，這也讓網站寫手Ray Subers在撰寫今年\n年終檔的態度更加謹慎，他除了照慣例以潛在賣座程度排名有可能在北美票房破億的\n\
  電影外，還特地對這其中的12部電影另外開闢專文討論，並且增加文章中對同類型經典\n電影過往賣座記錄做對照，以增加參考價值。\n\n在這一系列的專題中，就先從Ray\
  \ Subers最看好的電影－最新一集的「飢餓遊戲」作為\n起頭。\n\n\nRelease Date: November 21\nStudio: Lionsgate\n\
  Genre: Action/Adventure\nDirector: Francis Lawrence\n\n\n\nWriters: Danny Strong,\
  \ Peter Craig\n\n\n\nCast: Jennifer Lawrence, Josh Hutcherson, Liam Hemsworth, Woody\
  \ Harrelson,\nElizabeth Banks, Julianne Moore, Philip Seymour Hoffman, Jeffrey Wright,\n\
  Stanley Tucci, Donald Sutherland, Toby Jones, Willow Shields, Sam Claflin,\nJenna\
  \ Malone\n\n\n Katniss Everdeen is in District 13 after she shatters the\ngames\
  \ forever. Under the leadership of President Coin and the advice of her\ntrusted\
  \ friends, Katniss spreads her wings as she fights to save Peeta and a\nnation moved\
  \ by her courage.\n\n\n\n Let's get this out of the way up front: barring an Avatar-like\n\
  performance from Interstellar, The Hunger Games: Mockingjay Part 1 will be\nthe\
  \ highest-grossing movie of the year at the domestic box office.\n\n\n\n\nThe first\
  \ two installments in the franchise earned $408 million and $424.7\nmillion, respectively,\
  \ and both were well-received by critics and audiences\nalike. The second entry,\
  \ Catching Fire, ended with the kind of game-changing\ncliffhanger that has fans\
  \ eagerly waiting to see where the story goes from\nhere.\n\n\n\nStill, there's\
  \ reason to believe that Mockingjay Part 1 will earn a bit less\nthan its predecessors.\
  \ The Twilight and Harry Potter franchises also split\ntheir final book in to two\
  \ parts: in both cases, the penultimate chapter\nexperienced a slight decrease in\
  \ domestic box office.\n\n\n\nAlso, the first two installments in the Hunger Games\
  \ franchise got a boost\nfrom IMAX pricing, which Mockingjay won't have (those screens\
  \ are booked for\nInterstellar).\n\n\n\nUltimately, look for The Hunger Games: Mockingjay\
  \ Part 1 to earn anywhere\nfrom $350 to $400 million—perhaps a bit more, if it turns\
  \ out to be as\nstrong as the previous entries.\n\n\n\n\n------------------------------------------------------------------------------\n\
  \n以下順便補充Ray Subers今年年終檔票房看好度的排名：\n\n\n1. The Hunger Games: Mockingjay Part 1   \
  \         - $385 million\n2. Interstellar                                   - $265\
  \ million\n3. The Hobbit: The Battle of the Five Armies      - $235 million\n4.\
  \ Big Hero 6 (迪士尼動畫大英雄天團)              - $215 million\n5. Into the Woods (芝加哥導演新作拜訪黑森林)\
  \      - $140 million\n6. Penguins of Madagascar (馬達加斯加企鵝外傳)    - $135 million\n\
  7. Exodus: Gods and Kings (貝爾新片出埃及記)      - $130 million\n8. Night at the Museum:\
  \ Secret of the Tomb        - $120 million\n9. Unbroken (裘莉第二部導演作品)            \
  \      - $105 million\n10. Horrible Bosses 2                             - $100\
  \ million\n11. Annie (Jamie Foxx與Cameron Diaz主演歌舞喜劇)  - $95 million\n12. The Interview\
  \ (Seth Rogen到北韓出任務惡搞喜劇)- $90 million\n\n心得：1.「星際效應」本週五在美國票房的跌幅有點高，北美兩億無望？\n\n2.回到飢餓遊戲，飢餓3-1幾乎是會成為北美三億俱樂部的會員之一了\n\
  (今年另外有此成就的電影只有漫威投資的科幻喜劇星際差攻隊)，\n台灣沒有意外的話，應該也可以擠下星際效應，成為下週的票房冠軍，\n只不過自由幻夢上篇在台灣上映時，連續兩週都有重要活動的轉播，\n\
  這幾乎將會變成影響電影賣座程度的一個小隱憂\n(註：星火燎原的台北票房為8409萬台幣)\n\n以上是BOM年終專題的第一篇翻譯文，未來時間有空，\n我也會盡可能把以上的分析文翻譯成中文並PO在版上\n\
  \n--"
