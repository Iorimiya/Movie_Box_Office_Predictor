url: https://www.ptt.cc/bbs/movie/M.1416622776.A.A0D.html
title: '[好雷] 飢餓遊戲-自由幻夢'
content: '雖然剛開始追這系列時也有錯誤期待

  但慢慢看下來已經接受了這種設定

  1.女主角不會開無雙 不會殺人殺得麻木 對殺人會有愧疚

  2.飢餓遊戲是YA小說改編 人死的方法都不會很慘很噁心


  自由幻夢一開始就看到心靈受創的Katniss

  她和Finnick被救出來後一直內疚救不出其他人


  然後十三區就開始說服Katniss當代言人

  Julianne Moore演的總統看起來好善良

  但實際上是個強硬冷酷的人

  也許是為了十三區的人表現成這樣吧

  P.s 比提造的弓箭超像鷹眼的


  另一方面都城也讓Peeta拍影片動搖其他人

  Josh Hutcherson演技不錯 特別是眼睛含淚/最後被虐待後


  Gale這集終於不只是可憐的看著自己愛的人和別人(假裝)談情 他在十三區很快就適應得

  很好 一直四處跑 也加入攻進都城的搜救隊 還有默默地守護Katniss和Prim


  中間印象最深刻是第八區醫院、人民在樹林攻擊還有攻進水壩 還有Jlaw唱的Hanging Tre

  e ( P.S Hanging Tree很洗腦 ) 看到這些場面都忍不住想哭 特別是鏡頭轉向『維穩』士

  兵時 反光的頭盔遮掩他們的樣貌 不知道他們頭盔下在想甚麼 革命就是有一群人在拼命/

  送死 都城一直在叫他們停止 但大家都知道沒有退路 以後都城的控制只會更殘酷


  比較可惜的是Haymitch這集大半都在戒酒




  --

  Sent from my Android


  --'
