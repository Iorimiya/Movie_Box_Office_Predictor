title: '[好雷] 飢餓遊戲:自由幻夢(上)｜你必知的3個秘密'
content: '圖多並茂更生動且更多圖的 網誌版：














  小心有雷





















  ====================分隔線====================


  每次看完電影之後，除了劇情之外，你知道還有什麼是你在電影裡看不出來的秘密嗎？先前在飢餓遊戲2：星火燎原。你必須知道的5個秘密 (雷)就有跟大家分享過雷神索爾的弟弟也有出現在電影裡、蜘蛛人裡的秘書也有演、服裝師竟是葛萊美獎的歌手等有趣的秘密，而這次將跟大家分享《飢餓遊戲：自由幻夢(上)》的秘密，其中包含遊戲設計師已死的謎團、叛軍攝影小組的正妹介紹等，讓已經看完電影的你可以從更多不同的角度來認識《飢餓遊戲：自由幻夢(上)》這部電影哦！


  飢餓遊戲2：星火燎原。你必須知道的5個秘密 (雷)：


  ==============================================================


  一、首席遊戲設計師已死


  在《飢餓遊戲2：星火燎原》的首席遊戲設計師的普魯塔克，原以為他是都城的走狗，沒想到他是策劃叛變的幕後人物，讓人大吃一驚！而在《飢餓遊戲：自由幻夢(上)》裡，他以全新的面貌-新施惠國總統的軍師來登場，雖然戲份比不上三角戀的凱妮絲、彼得、蓋爾，但也是有畫龍點睛的效果！不過這位飾演普魯塔克的這位演員菲利浦西摩霍夫曼(Philip
  Seymour

  Hoffman)，本人在今年2月就已經過世了！原因初步判定是藥物濫用，他其實也因毒品進過幾次勒戒所。當初看到新聞的時候我也相當地震驚！想說《饑餓遊戲2》才剛上映沒幾個月，還有9個月才要上續集，而且他的戲份會變得更重要的說！不過似乎不影響《飢餓遊戲：自由幻夢(上)》，而且《飢餓遊戲：自由幻夢(下)》在美國電影網站IMBD上的演員列表也有他的名字，想必他的戲份應該早已拍完，如果沒拍完，也許製作團隊會透過劇情調整的方式讓電影看起來順利，如果是後者的話，希望不是死掉或失蹤XD就讓我們拭目以待吧！2015年11月就會上映了！


  <補充>

  菲利浦西摩霍夫曼在2005年以《柯波帝：冷血告白》獲得奧斯卡影帝，這部電影同時也為他拿下20幾個國際影展、影評人的最佳男主角，後來出演了多部電也都入圍過奧斯卡的最佳男配角，精湛的演技絕對是不在話下！另外出演過比較知名的作品有《天才雷普利》、《紅龍》、《金錢遊戲》、《不可能的任務3》、《蓋世奇才》、《選戰風雲》、《世紀教主》。


  ===============================================================


  二、叛軍攝影小組的正妹究竟是誰？


  本集《饑餓遊戲》的重點除了加深三角戀的拉扯之外，更主要的部分就在於都城的施惠國政府與十三區的新施惠國政府相互較勁，而拍攝學舌鳥的宣傳影片則成為劇情的主軸。在這當中，從都城逃出來加盟叛軍的攝影小組有一位超有個性的導演兼製片，別看她是個酷妹，其實她還跟美國隊長與雷神索爾激情過哦！她本名叫娜塔莉多莫(Natalie

  Dormer)，為了配合《饑餓遊戲》的角色造型而剃了半邊光頭，但在其他電影裡可是相當撫媚迷人。在《美國隊長》裡，她飾演一位金髮女軍官，片中還勾引史提芬，深深地給了他一吻！另外在《決戰終點線》裡，她則是飾演一名純情小護士，只不過依然被邪惡的詹姆士亨特(與飾演雷神索爾的克里斯漢斯沃同人)給吃下去了…。雖然上述兩部都只算是跑龍套的，不過至少都有跟目前Marvel當紅的英雄沾上邊！而他本人較有名的作品則是影集《都鐸王朝》，相較於現代服飾，她穿起古裝更有韻味，眼神感覺都要把人給吸進去似的！



  ▲娜塔莉多莫與美國隊長史蒂芬激吻。



  ▲在《決戰終點線》與雷神索爾葛格激戰，床戲影片請自行網上搜尋XD



  ▲《都鐸王朝》裡的樣子美翻了！



  ▲有一種做壞事被抓到的小性感XD


  ===============================================================


  三、遊戲主持人是美國隊長的恩人


  前一段提到《美國隊長》，那就不得介紹一下在饑餓遊戲系列電影飾演遊戲的主持人凱薩富萊克曼的史丹利圖奇(Stanley

  Tucci)，雖然戲份不算太多，但在《饑餓遊戲》裡總是有畫龍點睛的效果，例如他與貢品的訪談讓人更激起對都城的痛恨之類的XD。而在《美國隊長》裡，他可是飾演改造美國隊長的亞拉伯罕博士，鼓勵史提芬從軍的幕後推手，如果沒有他，就沒有今天的美國隊長！只不過重生計畫成功後，就被九頭蛇殺死了！今年在《變形金剛4：絕跡重生》也扮演被追殺時，卻能沈穩地狂喝舒化奶的商人，滑稽逗趣的表現也是令人印象深刻XD。在更早之前，他本人還曾經以《蘇西的世界》入圍奧斯卡最佳男配角。



  ▲在《美國隊長》裡飾演鼓勵史蒂芬從軍並成功改造他的亞拉伯罕博士。



  ▲舒化奶的最佳代言人！


  ===============================================================


  麻煩大家多給點支持！給個推！

