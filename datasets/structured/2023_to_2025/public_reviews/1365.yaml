title: '[Live] 飢餓遊戲：自由幻夢I  @星星臺首播21"00'
content: "【STAR MOVIES】\n  飢餓遊戲：自由幻夢I\n\n\n播映時間： 2015/11/22\n21:00 ～ 23:30\n節目長度：\
  \ 2小時30分\n--------------------------------------------------------------------------------\n\
  節目介紹\n本片為《飢餓遊戲》大結局的上集，由《飢餓遊戲2：星火燎原》導演執導，主要演員包\n含珍妮佛羅倫斯、連恩漢斯沃斯、喬許哈契森等人，以及最新加入的茱莉安摩爾飾演第13\n\
  區總統「柯茵」、以《冰與火之歌：權力遊戲》走紅的娜塔莉多莫飾演「奎希妲」。\n\n「燃燒的女孩」凱妮絲艾佛丁（珍妮佛勞倫斯 飾）在大旬祭上被反抗軍救走，比德（喬\n\
  許哈契遜 飾）卻不幸落入都城手裡。\n\n凱妮絲被帶到傳說中已成廢墟的第13區，在反抗軍領袖柯茵（茱莉安摩爾 飾）和戰友支\n持下，銜命成為革命的象徵，領導施惠國各區叛變，對抗專制又腐敗的都城，同時也心繫\n\
  比德安危，傾力籌劃營救行動。\n\n隨著這場決定施惠國命運的戰爭愈演愈烈，凱妮絲也漸漸察覺，遊戲根本從未結束，她必\n須先確定該信任誰，以免危及所愛的一切！\n\
  \n《飢餓遊戲：自由幻夢I》首度揭開全施惠國最隱蔽之處，即祕密的第13區，除了在亞特\n蘭大的攝影棚拍攝，製作團隊也遠赴巴黎郊區的豪華城堡和公寓社區取景。\n\n\
  \n--\n推 hope951:有片無槍 片失其用 無片有槍 槍失真我\n→ hope951:有片有槍 登峰造極 無片無槍 天下無敵\n\n--"
