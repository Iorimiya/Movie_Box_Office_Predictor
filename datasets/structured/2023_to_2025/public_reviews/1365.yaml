url: https://www.ptt.cc/bbs/movie/M.1416581899.A.D36.html
title: '[好雷]飢餓遊戲：自由幻夢I'
content: "====================防雷頁============================\n\n\n\n\n\n\n\n\n\n\n\
  \n\n我先承認，沒有看過小說，所以以下內容只針對電影的部分\n          (我愛Jennifer Lawrence!!!!!!!!!!!!!!!!!!!)\n\
  \n\n補充：有些人可能覺得這集太過平淡，建議先複習前兩集(尤其是二)，才能了解主角內心的掙扎與崩潰的點。\n\n\n======================劇情========================\n\
  \n片頭開始，銜接第二集Katniss就活在現實的惡夢中\n\n12區已經被夷為平地，Peeta被首都抓走\n\nPlutarch(遊戲設計者)和Coin(13區總統)希望Katniss能成為革命的學舌鳥讓革命烈火能持續延燒下去\n\
  \n\n所以採用宣導短片的方式與各區傳遞革命的精神\n(其中有一些小笑點，待各位去電影院中發掘)\n\n而Peeta也被都城利用成反戰宣導\n\n所以就形成兩支宣導短片不斷穿插的過程\n\
  \nKatniss無法在背稿的情況下拍廣告\n\n只好將她帶到真正的戰區\n\n\n\n第一站：第12區的殘骸(決定廣告前醞釀情緒)\n\n其實就是預告片其中一個片段\n\
  \n看到殘破不堪家園，片地的焦屍\n\n讓Katniss燃起一絲怒火\n\n在妹妹(腿超美)的提醒之後，Katniss在交換條件下答應成為代言人\n\n\n\n\
  第二站：第8區的傷者醫院(廣告TAKE ONE)\n\n傷者醫院的人看到Katniss的造訪感到驚訝\n\n並詢問關於她肚子寶寶的事(囧...無知是福阿...)\n\
  \n知道Katniss是同一陣線後，令人熱沸騰的手勢又出現了!!!\n\nPresident Snow得知Katniss造訪第8區，決定派轟炸機去炸醫院\n\n\
  如同預告片中，Katniss和Gale帥氣射下兩台轟炸機\n\n並說出第一個革命slogan：「If we burn, you burn with us!!」\n\
  \n\n第三站：重回12區(廣告TAKE TWO)\n\n這邊比較像是Katniss和Gale的內心戲時間\n\nGale描述當時被轟炸的情形(好抑鬱的帥)\n\
  \nGale發現當自己在極度悲傷時，Katniss才會注意到他\n\n並淡淡丟下一句：「悲傷會過去的...」(嗚嗚嗚，可憐的青梅竹馬)\n\n接著攝影團隊在一個峽谷休息\n\
  \nKatniss在這邊唱出了本片洗腦歌─The Hanging Tree\n\n這首歌想當然耳，變成革命主題曲\n\n\n以上是廣告的內容，其實邊看邊覺得有點唏噓\n\
  \n大眾是無知而且盲從的\n\n一直是權力者的一步棋\n\n因為一部宣導片有了希望\n\n因為一句話有了革命的勇氣\n\n因為一首歌貢獻了自己的生命\n\n看到人民推著炸藥箱往前衝，為了炸掉都城的水壩\n\
  \n即使被子彈掃射也覺不退縮\n\n這段革命是我覺得唯一滿難過的地方\n\n\n回到電影劇情...\n\n主角2：Peeta\n\nPeeta這次跟Katniss幾乎沒有接觸\n\
  \n都是靠著電視得知對方狀況(Peeta只有看到一次Katniss)\n\nPeeta在都城被虐待，當都城的傀儡(不知道他這麼瘦是真的還是CGI)\n\n在最後一部宣導片中，因為看到Katniss的殘影(這段覺得Peeta演的超棒)\n\
  \n趕緊警告Katniss，13區即將被空襲\n\n最後因為被都城注入一種改造後的殺人蜂毒液\n\n對Katniss有強烈的憎恨\n\n\n\n主角3：Gale\n\
  \nGale已經發現Katniss對Peeta真實又複雜的情感\n\n而又試著包容Katniss的感受\n\n有一段我覺得最感人的是，Prim在空襲前回房間救貓\n\
  \nGale其實就默默在身後保護她(沒台詞，但讓我覺得很溫暖可靠)\n\n因為家園被摧毀，Gale這集有些憤慨\n\n最後都城的救援行動，Gale也自願參予救回情敵(誤)\n\
  \n\n主角4、5：Haymitch 和 Effie\n\n其實這兩人的作用就是為電影增加一些詼諧\n\n也是Katniss在13區比較信任的人\n\n\n主角6、7：President\
  \ Snow 和 President Coin\n\n這兩個人會分在一起是因為我都不喜歡他們!!!\n\n好啦，其實這兩位的演技真的很棒，戲份也滿多的\n\n\
  雖然奸詐狡猾，卻又讓人覺得成穩與足智多謀(簡意：心機重)\n\n\n其他角色：\n\n1.上集個性鮮明的Johanna在這一集只有短短的出現一幕，同樣被凌虐還剃成光頭。\n\
  \n2.Prim越來越美了!!(覺得她跟President Snow的孫女好像)\n\n3.Finnick這集比較像花瓶，因為愛人被綁架也魂不守舍。(同時爆料被當成應召弟)\n\
  \n4.Cinna這集已經升天了，只有留下為Katniss設計的戰袍與圖樣。\n\n\n\n文戲多於武戲：\n\n先前有報導的關係，已經有心理準備。\n\n我真的算過，主角武戲如果不含爆破場景\n\
  \n武戲時間加起不超過5分鐘...\n\n武戲1：Gale射標靶(預告有)\n\n武戲2：Katniss射飛機(預告有)\n\n武戲3：Peeta怒掐Katniss脖子(最長的武戲)←原因上面已經提到\n\
  \n不過Jennifer Lawrence的演技真的不是蓋的，內心戲都演得好棒。\n\n當然其他劇組演員也有大放異彩的時刻，真心覺得不會有浪費錢的感覺。\n\n\
  \n其他沒有寫到的內容，就麻煩大家去電影院觀賞囉!\n\n好期待下一集阿阿阿啊阿~~~~~!!!!!\n\n--\n應該是同一部吧XD ? 本來看電影期待都不一樣呀!\
  \ 我個人是覺得還不錯耶\n醫院應該也被炸得差不多了吧XD 不過指揮官真的好囧\n真的...革命感情還是比較強烈的!\n 11/22 01:15 11/22 01:17\n\
  建議先看完前兩集，才能了解主角這集內心的掙扎\n大概是Jennifer lawrence太完美了，他們配在一起真的滿怪的..."
