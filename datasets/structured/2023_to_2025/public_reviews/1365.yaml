title: '[好雷] 《飢餓遊戲3：自由幻夢 II》'
content: "網誌圖文：\n\n\n\n    不知不覺，《飢餓遊戲》這一系列來到終點了。\n\n    以書迷的角度，我是覺得3-2改編得還不錯，算是忠實呈現書中的劇情與場景。\n\
  \n\n\n\n\n    記得之前看小說第3集時，印象深刻的三個部份。\n\n    第一是芬尼克的死。原本還蠻期待電影會把芬尼克的死改掉，畢竟芬尼克的死\n\
  \n不像小櫻的死會這麼影響後續凱妮絲的決定。可惜願望沒實現，電影依然讓芬尼克\n\n在與變種的戰鬥中戰死。\n\n\n\n    不過在下水道遇到變種，與變種打鬥，邊逃跑邊躲天花板陷阱，這幾幕一氣喝\n\
  \n成的動作場景很精采。也算是加深了芬尼克英勇戰死的形象，小說中他的死其實有\n\n點輕描淡寫，當時看的時候有點不太滿意，電影算有彌補了這部份。\n\n\n\n\
  \    第二則是凱妮絲最後射殺柯茵這個決定。\n\n    看到後來會發現第2集登場，看似正義一方的柯茵。換個角度來看，與史諾似乎\n\n也沒什麼分別，因此故事增添了深度與寓意。\n\
  \n\n\n    回頭看兩位總統做的事情都蠻像。史諾要求凱妮絲和比德拍恩愛的影片，柯茵\n\n要凱妮絲拍宣傳片。兩位總統都想去掌控凱妮絲……但或許史諾可以控制飢餓遊戲\n\
  \n，叫遊戲設計師操控一切；柯茵則塑造聖人的形象，讓13區的人心甘情願為她奮戰\n\n……他們即便可以掌握很多事情，把凱妮絲當成棋子玩著這所謂的政治遊戲，但卻\n\
  \n掌握不住凱妮絲的心。因為人心往往才是最複雜。\n\n\n\n    第三就是結尾。因為並不是所謂的完美結局，而是「世界並不是你期盼的那樣\n\n」的收尾。但讓整個故事雖然有點苦澀，卻又帶著一種平淡的幸福。也更加貼近現\n\
  \n實充滿寓意。\n\n\n\n    不過我覺得電影第3集或許不應該分成上下兩集。（雖然片商是為了多賺一次電\n\n影票）\n\n    畢竟第3集的劇情轉變為政治間的權力遊戲。3-1有很振奮人心的吊人樹歌、芬\n\
  \n尼克的自白、營救比德的行動……最後史諾也回敬丟了比德回來，雙方都你來我往\n\n。結果遊戲玩到一半突然要等上一年再繼續，似乎有種情緒沒有延續，被打斷的感\n\
  \n覺。這是我個人覺得有點可惜的地方。\n\n\n\n    還蠻喜歡第三集很多近距離特寫凱妮絲的鏡頭（一開始跟2區接觸，後續拍宣傳\n\n片……），會覺得就像在呼應凱妮絲那種有點坎坷不安的心境。\n\
  \n\n\n    凱妮絲邊哭邊罵金鳳花那幕很感人。還有與陪伴到最後的艾菲分別也很感動。\n\n    最喜歡則是比德回去陪伴凱妮絲後，有一幕是內心都有傷痕的兩人坐在門旁，\n\
  \n夕陽西垂，無聲溫暖的陪伴，那幕畫面真的很美。\n\n\n\n    《飢餓遊戲》在近年算是開啟一股反烏托邦青少年系列小說的風潮。\n\n    電影比較熟悉的應該就屬緊跟在後的《分歧者》和《移動迷宮》，還有《記憶\n\
  \n傳承人》（不過小說是1993年發行，遠早於《飢餓遊戲》）。\n\n\n\n    不過比起《分歧者》、《移動迷宮》的續集，反而更期待2016年的《第五毀滅》。\n\
  \n    雖然嚴格來說，《第五毀滅》似乎比較偏末日題材，而不是反烏托邦。不過都\n\n還是屬於青少年系列小說，加上女主角是超殺女克蘿伊，還蠻期待的說。\n\n\
  \n--\n：\n \n \n\n\n\n--"
