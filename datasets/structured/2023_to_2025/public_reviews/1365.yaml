title: '[普雷] 飢餓遊戲:自由幻夢下 不選小索爾你開玩笑喔'
content: '我寧可看芬尼克　比德　蓋爾三個搞ＢＬ

  我也不要看到凱妮絲最後選比德啊啊啊啊

  電影選角這麼完美還選比德吃屎喔～～～


  OK，接下來會有很多個人的偏見。

  可能會有髒話還有大量暴雷以及用外表評斷一個人=_=

  小說黨、原作黨、分析黨慎入。


  雖然本片的戰爭承襲上一集，都在用嘴打，還有拍MV，說戰爭好像有戰爭，

  可是又好像不是戰爭，但是單就劇情來說，無限黑暗政治迴圈還有殺新總統真的不錯。


  我知道原作黨一定會叫我滾去看小說，這就是小說改編電影的宿命，

  但原作小說第一人稱真的太瑪莉蘇了，我有趁七折的時候買一本星火燎原，

  不管翻譯的人文筆再好，至今每次看到凱妮絲在心裡掙扎要選比德還是蓋爾，

  我都會看不下去－－我絕對會選芬尼克的啊！絕對會！（走開）


  不管原作寫的心境多深入，世界觀多了不起，我只知道

  電影裡頭蓋爾完全是工具人，比德就是精分懦夫啊啊啊，有眼睛的人都知道該怎麼選吧～


  我不知道我對芬尼克的感情什麼時候開始變得這麼深，

  應該是上一集比德又在靠凱妮絲救，然後芬尼克幫他擋電網還有揹他，

  還有餵他吃東西的時候吧（謎）

  所以看到芬尼克死會的時候我就已經很想棄坑了，看到芬尼克一死我又更想棄了。


  秦納！！！死得真冤啊！！（上一集的事情）

  結果這一集便當發到我已經神無感，他們死到底都是為了什麼啊XD

  某人（畫面太暗看不出是誰）：為了創造歷史，史諾死了以後，他們的死也會有點價值。

  有嗎？看到結局我依然不覺得啊XD

  結婚果然是FLAG有沒有！把芬尼克還來啊啊啊（尖叫）



  凱妮絲詛咒強大到她整個13中隊的人，疑似只有蓋爾、後加入的比德，

  還有女攝影師＋兩助手活著，其他全死光XDDD


  當集出現的新角色立刻死掉原來是這部片的慣例嗎XDDD（打麥、職業貢品夫妻等）

  想想第一二集那些新加入的祭品啊XDDD　這部片死亡率太高啦～

  一集不死的後面也會死啊，看看我可憐的芬尼克ＱＱ都活幾集了還不是得死ＱＱ

  大家為了凱妮絲都得去死ＱＱ　與其說是職業貢品不如說職業陪跑算了。

  只有凱妮絲還有她欽點的比德能活ＱＱ

  蓋爾臉皮太薄乾脆留在都城，想到就覺得ＱＱＱＱ


  對凱妮絲好的男人，跟凱妮絲抱過的男人幾乎全都會死吧！

  君不見原本拿HOLO的那個隊長！

  凱妮絲被槍射、被炸彈炸、被火燒都不會死，那個隊長往前走三步就掛掉了。

  跟小強凱妮絲一比，周遭的人根本都螻蟻。


  還有凱妮絲的那個女宿敵，我記得也是上一集還上上集登場的。

  （對三年前的電影真的記憶薄弱）

  如果凱妮絲是跟黑密契或是安娜（應該是叫這名字）在一起，我都能饒過她的啊！

  比德從第一集看到現在，除了感覺她是真女主角，負責被救、被照顧、被找以外，

  其他真的什麼優點都沒有？


  凱妮絲好歹還會射箭、即興小演講，雖然長得沒有安娜漂亮，但也不算完全沒優點，

  但，比德長得不帥、沒有戰鬥力、只會扯後腿；

  ＶＳ蓋爾　長得帥、戰鬥力高、顧家、不變心　WHY　選了比德？？？？

  （撞牆）


  更扯的是打假仗就算了，打到一半還去跟比德接吻，你隊友都在後面等你，

  後面有變種在追，他們都想逃跑，不會覺得很怒嗎？


  我還是第一次那麼同意誠實預告，我看完片子才看的，

  沒有先入為主，可是基本上真的都跟誠實預告說的沒兩樣，

  除了凱妮絲還是跟以前一樣死人臉以外，整部片就是在為了不明的理由深入地雷區，

  然後拍片（整個不明，全國都已經反叛了，拍片給誰看XDDD都城的人又沒攻擊他們）

  還有對貓吼跟唸信（囧）


  劇情不是說不神，射柯茵、空投炸彈（雖然我一看就有想到是炸彈）、

  提議再舉辦一次飢餓遊戲，真的都很不錯，渾然虛淵流的政治模式。

  可是整部片應該少說有十幾分鐘以上的時間畫面都超級黑，不知道在幹嘛，

  只聽到一堆有的沒的聲音。


  更別提少說有二三十分鐘以上的時間，都是凱妮絲、蓋爾、比德三個人互相糾纏，

  比德讓凱妮絲痛心、凱妮絲讓蓋爾痛心，蓋爾告訴比德他有多痛心（？

  然後凱妮絲最後還不是選了比德，小孩生兩個= =

  那當初比德跟蓋爾到底在互相謙虛個什麼啊？你們是不會一三五二四六嗎？

  你們不是未來人嗎？科技先進道德退步？（？？？）


  本片戰爭三大賣點：地雷、維安人員、變種人

  地雷：火、槍、油，那個油泡到會怎樣嗎ＸＤＤ

  維安人員：廢到被蓋爾踢一下槍就被搶走ＸＤＤ

  變種人：與其說很厲害，倒不如貼上去的材質效果，像199X年做出來的鬼片ＸＤＤＤ

  除了會追主角之外還有幹嘛嗎?喔，他們喜歡食用芬尼克（默）

  三個都出來了可是還是沒什麼戰爭的感覺XDDD


  一如既往的很瑪莉蘇是真的，不過這一集我覺得有比上一集的劇情好，

  可是槽點比上一集多很多？

  最好看果然還是一二集？


  總而言之很高興脫離這個坑了，反烏托邦青少年小說電影系列，

  分岐者我是打死不看的，那個劇情基本上跟飢餓遊戲超像是怎樣？

  這年頭賣座片都一個樣？

  移動迷宮等明年STAR買了我再考慮看一下= =

  聽說變成末日殭屍片XDDD

  我去打瘟疫公司全世界都是我的殭屍了我還看電影幹嘛XDD

  為了可愛的英國小金毛嗎？


  --







  --'
