url: https://www.ptt.cc/bbs/movie/M.1451142895.A.995.html
title: '[負雷] 飢餓遊戲：自由幻夢 最終章'
content: '還記得飢餓遊戲當年出了第一部的電影

  身為小說腦粉的我還去當年還存在的新店國賓戲院看了兩次

  第一次看時我其實有點失望，第一集礙於片長的原因閹割掉很多劇情

  所以我才回去二輪戲院在看第二次第三次，我覺得我應該是沒有專心看，才會覺得電影好

  像少了什麼，但看完幾次之後的我便完全對飢餓遊戲的系列電影失去信心


  第二集時我抱著不期不待不受傷害的心情走進了電影院，而第二集也不復觀眾期望，拍出

  了一部像我這樣的原作派都會拍手叫好的佳作


  但到了第三部，越多的期望只會帶來更大的失望，永遠不會穩住的奔跑鏡頭，永遠亂七八

  糟的節奏等等


  這已經不是改編的好不好的問題了

  今天如果這部電影不叫飢餓遊戲，那他就只是一部高成本毫無特色的科幻片


  同樣的問題到了最終章還是很嚴重

  無止境的特寫

  整部片就在特寫及景深的畫面中跳過來又跳過去


  毫無條理的劇情節奏，毫無根據的場景轉換，整部片讓人昏昏欲睡，只有在嚇人的音效出

  現時大家才會驚醒，我不知道這到底算編劇還是導演的問題，今天這一部電影就算是忠實

  的改編自小說，也不會把文字場景的轉換忠實的拷貝過來，整部片就像在讀一本沒有潤飾

  過的劇本，這張讀完了，就直接翻到下一頁，各個鏡頭跳來跳去，根本不在意沒有看過小

  說的觀眾，好像就是在表明，我就是一部賣小說人氣的電影


  但是凱妮絲最後結尾那一段對自己孩子的對白很感人


  但依舊沒辦法拯救這部片


  --'
