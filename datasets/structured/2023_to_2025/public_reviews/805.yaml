title: '[LIVE] HBO 21:00 超完美家政婦(Subservience)'
content: "HBO\n超完美家政婦(Subservience)\n2024-12-28(六) 21:00\n\n導演： 斯科特戴爾\n演員： 梅根福克斯\n\
  米歇爾莫羅尼\n瑪蒂爾達佛斯\n\n《至死不渝》斯科特戴爾執導，《浴血任務4》梅根福克斯、《重磅腥聞》瑪德琳茲馬主\n演。\n\n在女兒的懇求下，尼克購買了最新的精密人工智慧機器人——愛麗絲（梅根福克斯\
  \ 飾）\n協助家務，沒想到「她」逐漸失控，並威脅到尼克與家人的性命……。\n\n梅根福克斯曾於2009年的邪典恐怖喜劇《辣的要命》中展現她作為尖叫女王的潛力，《超\n\
  完美家政婦》的出現可能為梅根福克斯刷新大銀幕恐懼指數，預告中梅根福克斯所飾演的\nAI機器人「愛麗絲」頂著完美平滑的面孔，微笑打理家務，當眾人以為一切順利時，「愛\n\
  麗絲」卻漸漸顯露反常的嫉妒心和掌控慾，並出現逾矩行為與攻擊性，前後的反差讓人不\n寒而慄。\n\n相較孩童玩伴《窒友梅根》，《超完美家政婦》面向的似乎是更成熟的觀眾，這點由選角\n\
  可見一斑。《超完美家政婦》男主角找來了「行走的費洛蒙」——義大利男星米歇爾莫羅\n尼飾演，他以在《禁錮之慾》中演出霸道黑手黨老大一炮而紅、圈粉無數。被問到作為現\n\
  今性感化身有何感想時莫羅尼回答：「如果你認識私下的我，絕對不會認為我是性感象徵\n，我至今還是不理解為什麼，這可能要歸功於我在《禁錮之慾》裡飾演一個英俊的黑道老\n\
  大，但那個角色跟我本人差異很大。」\n\n--------------------------------------------------------------------------\n\
  CATCHPLAY電影台\n鬼同你住\n2024-12-28(六) 21:00\n\n--\n   \n\n--"
