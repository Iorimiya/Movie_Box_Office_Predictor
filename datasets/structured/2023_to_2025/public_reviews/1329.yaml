title: '[情報] 《樹懶殺三小》電影預告'
content: '11.3《》




  #史上最懶的見血眼開殺手

  #牠的利爪這次真的殺很大


  好萊塢票房演員陣容：


  《死侍》《惡棍英雄：死侍》史提芬 卡皮契

  《美國恐怖故事》奧莉薇雅 魯伊爾

  《謎情夏令營》麗莎椰w巴拉瓦納

  《毛骨悚然：惡魔重生》西德尼 克拉文


  【動物恐怖＋校園殺人】混種新高峰


  艾蜜莉為了競選姐妹會會長，

  養了一隻可愛（）當作寵物，

  瞬間成為全校話題焦點，

  樹懶也成了姐妹會的吉祥物。


  怎知自此校內開始發生一連串血腥殺人事件，

  而所有的證據都直指兇手是......那隻嗯......感覺很奇葩的一部片......





  --'
