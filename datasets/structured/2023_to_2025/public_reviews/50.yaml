title: '[新聞] 暌違30年！魯邦三世 不死身的血族  10月'
content: "暌違30年！魯邦三世 不死身的血族  10月登台 B’z操刀主題曲\n\n\n〔記者廖俐惠／綜合報導〕《魯邦三世》系列電影再度在台上映，今年的《魯邦三世\
  \ 不死\n身的血族》是相隔30年之後全新的2D動畫電影，除了有熟悉的聲優班底之外，還請來片岡愛\n之助、森川葵、空氣階段助陣，令人期待。\n\n從1967年日本開始漫畫連載、1971年播出電視動畫以來，Monkey・Punch所創造的魯邦三世\n\
  以及其他角色，深受全球各世代粉絲的喜愛。系列劇場版作品從1978年《魯邦三世 魯邦VS\n複製人》開始，直到1996年《魯邦三世 DEAD OR ALIVE》為止，共計上映了5部電影，2025\n\
  年的《魯邦三世 不死身的血族》是睽違30年之後全新的2D動畫電影。\n\n曾經執導過《REDLINE》、《Animatrix World Record》等作品的導演小池健，以獨創時尚\n\
  風格所執導的「魯邦三世」系列作品《LUPIN THE IIIRD》享有極高評價，這次電影更是將\n所有「魯邦三世」相連起來，創造出可說是魯邦三世原點的精彩故事。\n\
  \n聲優的部分，由大家所熟悉的栗田貫一、大塚明夫、浪川大輔、澤城美雪、山寺宏一等固定\n班底齊力演出，特別來賓則是邀請了片岡愛之助、森川葵、空氣階段協同助陣。電影的主題\n\
  曲是由超人氣樂團B'z特別製作的樂曲《The IIIRD Eye》，集結了超豪華的演出陣容，「不\n為人知的魯邦三世」即將登上大銀幕。\n\n電影講述，為了前往那座地圖上沒有記載的「神祕島嶼」，魯邦三世一行人正往百慕達海域\n\
  前進。此行的目標，是為了揪出不斷派刺客過來搗亂的幕後黑主，並找出藏在該處的巨大財\n寶。然而，想不到在島上等候他們一行人到來的，竟是被拋棄的「垃圾人」們以及不死身神\n\
  秘男子的猛烈攻擊，並且島上還籠罩著要命的毒氣。究竟魯邦能否成功揪出幕後黑主，取走\n所有財寶，並活著逃出那座島嶼呢？距離死亡倒數只剩24小時。\n\n《魯邦三世\
  \ 不死身的血族》將於10月24日起，在全台各大影城上映，凡購買電影票一張，\n即可獲贈「 A3厚磅特典海報 」一張，各戲院分配數量有限，送完為止。\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n--\n\"平安幸福的定義為何? 一切不為外力所影響,凡是退一步海闊天空.\n 人要懂得惜緣,該追求的就要追求,不要錯失良機,但心要平靜安閒.\n\
  \ 自己要力行,凡事勿強求,有緣分,就要珍惜.\"\n\n--"
