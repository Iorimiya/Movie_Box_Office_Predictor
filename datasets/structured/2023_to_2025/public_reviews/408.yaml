title: '[好雷]《帶針的女孩》：非死即傷且無聲'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《#帶針的女孩》好雷影評：非死即傷且無聲\n\
  \n\n■ 微雷推薦語\n\n\n\n\n■ 妻子 對比 丈夫\n\n卡羅琳為何一直遷徙？因為時勢所逼，也因她仍充滿期盼。\n\n失去了工作和丈夫，她逃向階級懸殊的紡織廠廠長；被廠長拋棄，再奔向心死的丈夫；後\n\
  來為了改變自己和女兒的將來，所以聽信了達格瑪。\n\n她知道為了奔向希望，必須狠心捨棄過\n去。\n\n\n\n相比妻子，丈夫的傷口更外顯明擺。戰爭讓他失去了完整的家庭、增添心理創傷，並永久\n\
  損害面孔與身體。為了保護國家所受的傷，不是英勇的勳章，而是被拿來嘲笑、鄙視的異\n物，說來十分諷刺。\n\n丈夫相較卡羅琳更接受現實，他認份的接受卡羅琳的來去（因為他相信沒有其他人會接納\n\
  他），也待在怪奇馬戲團以求溫飽（因為沒有其他人會接納他）。\n\n■ 卡羅琳 對比 達格瑪\n\n「她跟你不一樣。」這是斯文森給她們下的註解，意指卡羅琳保有善心，達格瑪則利用他\n\
  人的絕望謀利、泯滅人性。\n\n然而她們的性格絕對不是極端的對立。從拋棄丈夫到差點自行取下孩子，\n\n\n只是卡羅琳作為曾經生育的母親，和經歷五次死胎的達格瑪相比，還保有一絲母愛和對孩\n\
  子的憐惜。然而，卡羅琳的心態沒有扭曲，不等於她是博愛濫情之人。\n\n■ 結語： 什麼是你的止痛劑？\n\n\n\n\n《帶針的女孩》的故事關於創傷和希望。勇敢爭取的卡羅琳、絕望的達格瑪、面對現實的\n\
  彼得。一片驚叫聲中，每個面對傷痕的態度和臉孔疊加在一起，糊成同一副面容。\n\n全片十分擅於捕捉生理的疼痛（母親生產和墮胎、藥物戒斷等），並與心理之傷做連結（\n\
  達格瑪的罪惡感、彼得的戰後創傷、卡羅琳的掙扎等等），是《帶針的女孩》最精彩之處\n。\n\n當彼得和卡羅琳一起向鏡子伸手、卡羅琳決定接手撫養埃琳娜，他們的傷口交疊在一起，\n\
  所有傷痛都被互相理解。\n\n為了活下去，看清每個背叛與謊言，也要記得：他們的心曾靠在一起。\n\n-\n網頁好讀版>> \n=\n\n脆：\nIG：Fishpond_like\
  \ \n臉書：魚池 FishPond \n個人網站：\n\n--\n真的好看，目前有年度前十"
