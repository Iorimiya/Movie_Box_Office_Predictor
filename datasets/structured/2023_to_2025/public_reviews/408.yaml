title: '[好雷] 帶針的女孩Pigen med nålen'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  預告看起來就有一種令人窒息的沉重，正片把那感覺開到底，在精準細緻的黑白影像中，

  整理出最深最痛最無法直視的歷史事件。比所謂恐怖片更恐怖，但若想看恐怖片的人必定

  撐不到最後。接在漢德克《夢外之悲》後看，更強烈感受到二十世紀前期歐洲地區整體性

  的創傷。


  跟在院線看過的家人討論了一下，更多梳理了這部片的明顯優點：首先無論預告或宣傳都

  把主線故事會如何發展隱藏得很好，讓觀看的時候心理有諸多不確定。雖然角色才那幾個

  ，但基本猜不出下面會怎樣發展，直到最後都意想不到。其二是那歷史場景，透過黑白鏡

  頭與慢速度的推移，極近距離地去呈現嬰兒的臉、戰後傷者的臉、生產的畫面、餵奶的畫

  面，可以說是對歷史場景的一次不可致信的再現。其三是關於女主角線作為一個二十世紀

  初可能識點字，但仍屬中下層的女性，人生的侷限，強大的無力就像是她喝乙醚以為可以

  止痛的那種不知如何才是好。


  整片看完，以為殺嬰案可以說是這故事的核，但在核之外的果肉是一個困苦甚至畸形的時

  代。人們去馬戲團看表演，看那戰爭造成的臉與身體；我們看電影，則是看那戰爭造成的

  時代塌陷。



  ***


  這裡是我的樂園:




  --'
