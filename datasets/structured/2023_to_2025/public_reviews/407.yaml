url: https://www.ptt.cc/bbs/movie/M.1716885049.A.0CB.html
title: '[情報] 曹佑寧主演《刺心切骨》入選卡羅維瓦利影展主競賽單元！'
content: '捷克最大的 A 類影展「卡羅維瓦利影展」稍早公布今年的主競賽片單，由台灣、新加坡

  和波蘭三國合製的新片《刺心切骨》入選其中！




  《刺心切骨》為新加坡女導演劉慧伶的首部長片，並由劉修甫、丁寧、曹佑寧三人主演。

  劇情描述曹佑寧飾演的擊劍選手，某次比賽因失控行為入獄，使扮演他弟弟的劉修甫受到

  隊友排擠冷落，與丁寧飾演的母親相依為命。期間丁寧有了新男友，決心隱瞞大兒子入獄

  的事實，直到曹佑寧假釋出獄，也讓這家人的關係產生變化，醞釀出另外一場更黑暗的災

  難。


  《刺心切骨》將與其他 10 部電影共逐最高榮譽水晶球獎。


  2024 卡羅維瓦利影展將於 6 月 28 日至 7 月  6 日間舉行。




  --'
