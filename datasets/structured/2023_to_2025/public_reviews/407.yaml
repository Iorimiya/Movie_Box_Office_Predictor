url: https://www.ptt.cc/bbs/movie/M.1745596416.A.F69.html
title: '[好雷] 《刺心切骨》什麼是真愛'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  圖文重點標示好讀版↓




  這部片是住在捷克的朋友大力推薦，我才知道的，她甚至不只看了一次，還參加了電影團

  隊的QA場。查了才發現這部是2024年金馬影展的電影，最近才剛在臺灣上映。坦白說，如

  果不是朋友的推薦，我應該不會去看影展的電影，因為我都會懷疑自己看得懂嗎？我之前

  看過最文藝的電影應該是《斷背山》了吧！當時覺得蠻感動的，但同行的家人都不喜歡。


  這部片我剛看完時覺得還好，結局跟我猜得不太一樣，也不太喜歡它的開放式結局（我一

  向不喜歡），但我覺得這是有後勁的電影，看完後回憶電影的片段，慢慢反芻，反而會越

  來越喜歡這部片。推薦大家可以去看看！


  這部還有另一個亮點是整個背景環繞著西洋劍這個運動，這運動對臺灣人來說應該大多是

  很陌生的，看完這部片後，也成功燃起了我對這項運動的好奇。


  ----------雷多防雷線----------


  簡單用一句話來描述，這部片就是一部「被人深愛著的反社會人格者的故事」。


  我認為整部電影其實都是環繞著「愛」這件事，劇中每個人對於愛的理解、表達及深度都

  不同。男主角溫子滐（劉修甫飾）對哥哥子涵（曹佑寧飾）壓抑又盲目的愛、子滐對媽媽

  唐艾玲（丁寧飾）尊敬但又想自由的愛、莊叔叔（林子恆飾）對艾玲及子滐無條件以及尊

  重的愛，還有敬輝和子滐之間很青澀但溫柔的愛。


  這部片也很巧妙的用西洋劍這個運動，來描寫哥哥子涵和弟弟子滐不同的性格。子涵是連

  續三年的全國西洋劍冠軍，而弟弟則是一開始連代表學校參加全國賽都有問題的選手，這

  正是因為子涵非常懂人心，所以能掌握這項運動的精髓，甚至他一開始出場在監獄時的片

  段，導演就已經很清晰地描繪他反社會人格的特徵；而弟弟子滐則是完全相反，內向又單

  純，被哥哥操弄於股掌之間，他相信媽媽也相信哥哥，但當兩人對「真相」的敘述矛盾時

  ，到底要選擇相信誰？


  子涵在幾年前的西洋劍比賽中，因為把劍弄斷殺了人而坐牢，他雖然一直宣稱一切都是意

  外，但是媽媽很了解他的性格，所以非常堅信他是故意的，而子滐則因為相信小時候溺水

  是被哥哥所救，十分相信哥哥是好人，即使媽媽、一個小小孩都在提示他哥哥不是他想的

  那麼美好，他仍然選擇相信他想相信的。甚至到了最後，親眼所見哥哥無差別的殺人，他

  仍然義無反顧地為哥哥頂罪：「不管小時候你是要救我，或是看我溺死，我都不在乎了。

  」我覺得這句話非常令人動容，他不再糾結哥哥是什麼樣的人、愛不愛他，他堅定地選擇

  了愛哥哥，我覺得這種不求回報、沒有目的的愛，是需要很強大的勇氣及內心，有多少人

  願意不計較結果、不在乎回報，很單純地願意愛著一個人呢？


  但這樣的愛也未必是「真正的愛」，在這裡反而凸顯了這樣的愛，也是有可能摻雜了「盲

  目」。在臺灣社會，這種盲目的溺愛，最典型的應該是傳統上媽媽對兒子的愛，反而不是

  手足之情，所以在片中媽媽能大義滅親也是蠻不容易的，雖然我覺得她是出於感到無奈又

  丟臉，同時又怕子涵再次傷害子滐。


  或許是因為媽媽的關係，子滐對哥哥的愛一直都是想愛又不敢愛的壓抑，我覺得這是導致

  他最後對哥哥的愛如此扭曲、盲目的原因。當一個人長期被壓抑，沒辦法做自己想做的事

  ，性格上一定會有所扭曲。


  而我覺得真正的愛，是像莊叔叔對艾玲及子滐那樣，是帶著智慧的包容，而非盲目的；是

  願意讓對方學習承擔自己的錯誤，陪伴著對方一起成長，且一如當初的愛對方。他知道了

  艾玲的欺騙、家裡這麼複雜的問題，也知道了子滐偷他東西，但他選擇原諒，他曾經對艾

  玲說：「不管發生什麼，都不會改變我對妳的愛。」雖然當時艾玲不相信而選擇離開，但

  影片的最後，莊叔叔很溫柔地證明了他的愛並沒有改變，他給予他們滿滿的信任和愛，卻

  又不是像子滐對子涵的溺愛。我覺得這樣的愛，非常的美。


  這部片讓我有點出戲的地方，是子滐和敬輝（牧森飾）在公車站確定關係那段，就是……

  感覺挺突然的，雖然很甜很可愛，但有種畫風從懸疑片突然轉成BL的感覺？我覺得這一段

  其實不是很必要，很像只是為了要讓子滐再去參加全國賽，幫哥哥頂包而安排的橋段。而

  且其實我原本一直在猜最後是子滐或是敬輝會被子涵殺掉，因為弟弟整個就是盲目的智商

  不在線感，結果跟我想的完全不同。


  看完電影後，一查才知道導演的靈感是來自鄭捷案，難怪看到最後的確有讓我聯想到這個

  案子，也才發現鄭捷案居然10年了啊！時間過得好快，希望受害者家屬都能回到平凡的、

  好好的生活。


  這次是我第一次看電影包場，或許是現在很多影音串流平台，電影院人真的好少啊！雖然

  華語片在臺灣的電影市場，本來就更冷清了，不過真的沒有想到居然只有我一個人，包場

  的心得是一開始真的有點毛毛的，尤其是一堆驚悚片和鬼片的預告……但是開始專心看電

  影後，只能用超爽來形容，也是一次很難得的體驗。


  --

  我的FB專頁「阿培嘎嘎嘎」，歡迎大家按讚追蹤！



  更多電影分享文章歡迎來我的部落格逛逛↓



  --'
