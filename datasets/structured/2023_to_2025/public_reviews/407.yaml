title: '[新聞] 台灣新加坡波蘭合作「刺心切骨」 製片：'
content: '台灣新加坡波蘭合作「刺心切骨」 製片：有合適夥伴比找資金更關鍵【專訪】



  2024/7/3 19:11（7/3 20:26 更新）


  （中央社記者劉郁葶卡羅維瓦利3日專電）由台灣、新加坡、波蘭三國合製的華語電影「

  刺心切骨」，入圍捷克卡羅維瓦利國際影展競賽單元。台灣製片人黃茂昌昨天表示，跨國

  合作下，找資金固然重要，但找到合適夥伴更關鍵。


  以擊劍運動為主題的華語電影「刺心切骨」入選捷克卡羅維瓦利國際影展（Karlovy

  Vary International Film Festival）官方競賽單元，將與其他11部電影角逐水晶球獎（

  Crystal Globe）。台灣製片人黃茂昌與新加坡製片人蔡瑋詩2日接受中央社專訪，分享跨

  國製片的優勢與挑戰。


  前景娛樂創辦人、台灣製片人黃茂昌表示，卡羅維瓦利國際影展歷史悠久，在國際上享有

  A-list級別地位；加上刺心切骨有波蘭的參與，因此很榮幸能在中東歐盛譽極高的電影節

  首映這部電影。此外，影展時間安排也恰到好處，有助於團隊安排接下來的電影節活動，

  包括台灣金馬獎等重要場合。


  刺心切骨團隊成員相當多元，導演是新加坡人，攝影師是波蘭人，主要演員是台灣人。新

  加坡製片人蔡瑋詩表示，製作過程中，最具挑戰性與滿足感的是「人與人之間的溝通與交

  流」。她說，電影是「由一群人組成的產業」，而每個人都帶著不同期待而來，且都有不

  同的工作方式，因此要達到這些期待並不容易。


  談到跨國合作的優勢，黃茂昌說，團隊得以籌措多國的資金，像是刺心切骨同時獲得台灣

  、波蘭、新加坡的補助。「優勢就等於你有很多的朋友了」，每個製作人都有各自負責的

  領域，同時間運用自己的人脈、資源，把市場的布局做得更好。「刺心切骨在首映前，捷

  克的發行已經賣掉了，一切都是很國際化的來做。」


  刺心切骨拍攝於2022年1月至3月之間，主要取景地在台灣。黃茂昌表示，這部片在台北、

  桃園和台中三地拍攝，原因是地方政府的資金補助，與導演劉慧伶的經歷與人脈。


  劉慧伶曾是新加坡的擊劍國手，過去常來台灣比賽，因此結識許多台灣選手。這些選手現

  已成為教練，其中一位教練在台中教擊劍。劇中有許多場景攝於台中，然而因為疫情，最

  終無法在當地學校拍攝全國擊劍比賽。刺心切骨團隊因此改到台北的攝影棚拍攝，與桃園

  的體育場拍攝走廊與外部場景。


  蔡瑋詩補充，疫情使得拍攝遇到許多挑戰，包括場地限制，有些原定拍攝的地點無法使用

  ，使得製作團隊不得不投入更多資金來解決問題。


  黃茂昌表示，資金固然重要，但找到合適的夥伴更為關鍵。「我們花了很長時間選角，見

  了非常多演員，最後定下了曹佑寧和劉修甫，並且花9個月的時間來訓練他們擊劍技巧。

  」


  黃茂昌說，在劇中飾演母親的演員丁寧，沒有經過太多考慮就被選定。因丁寧過去在電影

  「孤味」表演出色，而刺心切骨同樣講述家庭故事，因此導演認為丁寧相當適合。


  飾演弟弟的劉修甫，則是在電視劇「你的孩子不是你的孩子」中的表現而被注意到。黃茂

  昌說，儘管劉修甫的實際年齡比角色大，但他的外型符合高中生的年紀，適合飾演這個角

  色。


  相比之下，尋找飾演哥哥的演員花費更多時間。在3個主要角色中，此角色的人格最為複

  雜，最終曹佑寧從眾多演員中脫穎而出。黃茂昌表示，曹佑寧身上有一種不可捉摸、神秘

  的氣息，彷彿內心藏著秘密，但同時帶有強悍氣場。


  黃茂昌說，這種氣場不僅展現他作為極限高手的氣勢上，也體現在他與母親、弟弟間難以

  捉摸的個性。儘管曹佑寧以往的形象較為「溫柔」、「偶像派」，但這次他在刺心切骨展

  現複雜的一面。（編輯：田瑞華）1130703



