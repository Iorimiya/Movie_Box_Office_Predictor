url: https://www.ptt.cc/bbs/movie/M.1745167148.A.F77.html
title: 'Re: [無雷] 風之谷 數位版'
content: '今天才又跑了特別場


  意猶未盡


  搜尋心得剛好看到這篇討論


  分享回覆一下自己現有的已知資訊


  ~香氛海報圖先鎮樓~





  風之谷在2010年時就已經有進行數位修復


  當初日本迪士尼找上吉卜力工作室


  想將過去的作品整理成藍光光碟系列發售




  這裡有段小故事：


  因為宮崎駿以前看了修復過的迪士尼經典動畫


  非常不喜歡那種過度調整色彩


  什麼都強調清晰銳利的畫面


  所以當時特別找來吉卜力自家的攝影監督奧井敦


  使用當初風之谷保留下來的膠捲


  一格一格掃描下來


  並在宮崎駿的監督下做了部分色彩調整


  最後完成了這個修復版


  宮崎駿大師看到成果還忍不住感動落淚


  據說原始素材的解析度高達6K




  而後推出的藍光BD可以分為幾個版本：




  這是風之谷第一張也是第一版藍光BD


  顏色整體偏向亮橘色調


  可以透過娜烏西卡的髮色清楚辨別




  這個版本修正了大量顏色，特別是紅藍更加深邃鮮豔


  聲音更清晰，畫面碼率提高，畫質表現更好


  同樣可以從髮色辨識




  基於第二版內容發行的全新精裝版


  基本上畫質與色彩跟前一版一樣


  強調更加貼近原始的手繪賽璐璐片色調



  由 Gkids 發行


  這家公司也是三月底在北美推出


  《魔法公主》4K IMAX版本的代理商


  期待未來台灣也有機會上映！


  (上面截圖取自blu-ray.com)






  而這次戲院上映的版本也是顏色修正後的版本


  放映格式為DCP


  畫面品質比藍光又好上一截




  那如果好奇


  目前串流平台上的片源大多就是這個版本


  有訂閱 Netflix 的話，打開就是了～




  另外有鄉民提到場外螢幕預告畫質比較好


  這其中可能有很多綜合因素


  顯示畫面的大小、亮度、片源都有可能影響



  有點像用手機看動畫瘋720P覺得畫質剛好


  換到大電視就會覺得畫面不夠清晰


  戲院銀幕比家用螢幕大很多


  台灣戲院普遍很少更新投影設備


  常常會有亮度與對比度不夠的問題


  螢幕亮度本來就勝過大部分投影機


  如果戲院設備調整不佳


  那觀影的視覺體驗真的會大打折扣



  再來是可以直接比對畫面看看


  上方預告片截圖  下方Netflix截圖




  可以發現預告版的噪點幾乎被抹除


  線條與色塊有白邊銳化痕跡


  可能是剪輯軟體自帶的降噪與銳利化效果


  左邊預告 右邊Netflix




  而電影院或藍光、串流上的正式版本


  基本保留完整膠卷呈現的噪點


  某些片段甚至能看到賽璐璐片疊加的陰影


  以及攝影機拍攝時


  偶爾焦距沒對準產生的模糊感


  而這些噪點和失焦模糊就容易讓人覺得畫質不佳








  當然，如果要追求更好體驗


  還是得看片商或吉卜力之後會不會推出4K修復版到戲院放映


  （魔法公主的4K重製版之後


  吉卜力已有內部討論


  但下一部是什麼目前尚未確定）



  不然現階段極限就是這樣啦


  只能說目前的2K DCP不能讓所有人都滿意




  另外有關DVD的部分


  剛好有外國網友做了DVD與BD畫質比較


  左邊DVD 右邊BD，畫質差異相當明顯



  早期DVD的整體色調又偏蠟黃了一些


  原址如下


  tml




  印象這幾年重映真的只有DVD等級畫質的


  是去年的《星之聲》


  在戲院觀賞真的解析度超低、畫質相當模糊


  但這也不能怪它


  畢竟原始檔案素材本身解析度就不高




  甲上這幾波吉卜力重映都蠻用心的啦


  畢竟這些經典以前沒在台灣大銀幕上映過


  這次能看到算是補足童年的美好回憶~


  接下來就期待《紅豬》和《心之谷》吧！



  --




  對的，感謝你的補充，我來調整一下文字說明避免誤會


  後二三版本基本上是一樣的內容~


  一般比較時多以2010日版、2014日版 兩者來做對照


  附上一張reddit撈到的對照圖


  上：2010日版　下：2014日版'
