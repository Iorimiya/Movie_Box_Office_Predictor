url: https://www.ptt.cc/bbs/movie/M.1741244063.A.1B5.html
title: '[分享] 風之谷首周特典海報'
content: "如題 甲上這次印製6萬張\n昨天搶威秀的特別場 12點開賣就無限轉圈圈\n然後沒意外地賣完了 囧\n之後聯絡in89跟威秀\n發放條件如下\n\n\
  1. in89 入場時發放海報\n2. 威秀 買票後可馬上兌換海報\n\n早上快11點去統領威秀買票\n樓下電梯就一堆拿著海報筒的粉絲\n不用想就知道是為了風之谷而來\n\
  今天有下雨\n統領蠻貼心的 有給你塑膠海報套防止淋濕\n目測櫃子上有兩百多張\n海報很有質感 王蟲的眼睛有亮面處理\n\n如果真的如甲上所說\n限量6萬張 每兩張票兌換一張海報\n\
  至少要賣出12萬張票才會換完\n就算扣除首映 特別場\n應該是足夠用\n只是怕市區的電影院很快就換完\n要到其他偏遠的電影院看\n才能拿到海報\n\n總之 不要給垃圾黃牛賺\n\
  就算單身 自己連刷兩場也比黃牛的便宜\n提供給各位參考～\n\n\n-----\nSent from JPTT on my Google Pixel 6a.\n\
  \n--\n\n   \n  \n  \n  \n \n\n--"
