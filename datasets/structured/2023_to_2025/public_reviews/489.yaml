title: 'Re: [無雷] 風之谷 數位版'
content: '前面恕刪XDD



  這個日版色調基本上應該就跟台版得利一樣

  沒記錯的話在發售當時就有被說偏紅(沒記錯的話XDD)



  這版的話應該就是2014年宮崎駿監督作品集裡面的版本



  記得後來也沒單售，這版當時的賣點在於有使用MGVC技術

  標榜如果是用有這技術的播放機播放的話色彩會再好看一些

  所以基本上這類型用電腦截圖就弱一點XDD

  不過我手邊也沒那種播放機就是了，當年貴死了


  畫質好歸好，犧牲掉所有的特別收錄把整片容量都拿來放本片了

  所以如果會特別收錄有怨念的，收了這盒後台版還是加減收一下吧XDD





  美版我就沒收了，只收了日版跟台版

  一樣坐等《魔法公主》4K版ing

  最近倒是收了同一間公司的4K夏日大作戰鐵盒版


  老實說夏日大作戰顏色上修得有點微妙

  再找時間用其他設備看看好了


  --








  --'
