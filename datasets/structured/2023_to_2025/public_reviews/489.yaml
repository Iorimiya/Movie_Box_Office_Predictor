url: https://www.ptt.cc/bbs/movie/M.1746036254.A.93E.html
title: '[好無雷] 雷霆特攻隊 、 罪人、風之谷'
content: '我最近都是依靠我屁股疼痛程度來評斷電影是否有趣、精彩、吸引目光


  如果很疼就代表爛片一部，沒耐心坐下去了

  滿分5分 越高屁股越痛


  雷霆：2.5分 會喬位子了

  罪人：0分 兩個小時一下就過了

  風之谷：1分

  （補充：蟻人3：5分 坐立難安）


  雷霆：

  算是一部尚可的片子，

  如果是漫威的粉絲我認為算是可以上劇院一看，

  不是粉絲但很好奇的話可能要想一下，

  對角色沒興趣的可以直接跳過。

  葉蓮娜戲份很多，但我蠻中的，

  不知道為什麼；

  其他角色雖有些龍套但其實都蠻有意思的，

  可惜沒有深入著墨。


  罪人：

  非常值得去電影院享受的一部片，

  好好看他們訴說的故事，享受看電影的當下，

  只要在娛樂的過程中有那麼一絲反省就夠了。

  因為是劇情片，

  我認為不要抱持任何想法進去看，

  才是最好的選擇。

  yt聽說有人前半段看到睡著但一樣覺得有趣，

  所以這部下班後也能看，不用想太多。


  風之谷：

  不愧是經典，可以從很純粹的bgm跟畫面

  就了解他們的世界，劇情也是非常值得省思。


  花錢上電影院推薦程度：

  罪人》雷霆

  風之谷介在中間



  --





  --



  05/01 16:33'
