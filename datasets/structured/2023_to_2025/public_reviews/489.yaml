url: https://www.ptt.cc/bbs/movie/M.1741047604.A.860.html
title: '[新聞] 劉品言掰咖站台《風之谷》 自比娜烏西卡'
content: '新聞網址：


  劉品言掰咖站台《風之谷》 自比娜烏西卡勇敢面對


  2025/03/04 05:30



  劉品言帶來自己的「王蟲迴力車」收藏。（記者王文麟攝）


  〔記者廖俐惠／台北報導〕劉品言昨受邀為電影《風之谷》王蟲大軍來襲特映會站台，原

  來她是吉卜力的死忠粉絲，還特別帶來3隻「王蟲迴力車」與大家分享。最近她腳受傷不

  適，自嘲是全台最美的「掰咖」，「就像娜烏西卡在片中也有腳受傷，就算受傷也要勇敢

  面對！」


  劉品言透露，心情沮喪就會透過宮﨑駿的電影調整心情，自己起碼50刷《風之谷》，如同

  大家一樣會將自己投射在女主角娜烏西卡上，認為電影可以藉由輕鬆的方式告訴大家，女

  生也可以做獨立又勇敢的選擇。


  她最近左腳踝受傷骨碎，一度無法踩地板，簡單的事情都變得困難，她坦言心情很矛盾，

  需要身邊朋友幫忙，但又不希望是被幫助的對象。被問到好友孫協志宣布與夏宇童結婚一

  事，劉品言非常恭喜，聽說他們很穩定，笑說自己受傷也需要人照顧。





  --'
