url: https://www.ptt.cc/bbs/movie/M.1741941758.A.FB6.html
title: '[好雷] 風之谷 - 沒有人是無辜'
content: '我得承認我是為那張海報才去看。


  風之谷的數位重製沒什麼問題，只可惜音效沒有隨科技進步，本來期待王蟲衝出森林時的

  震撼音響，但實際感覺像是2D，但依舊完全不損風之谷神作地位。











  防雷－－－













  1. 電影版僅是漫畫的前頭，電影有很多細節要看漫畫才能清楚各國關係和人物糾葛，還

  好電影改編成即便沒看過漫畫也能好好看完電影裡呈現的故事。


  2. 我以前第一次看風之谷就覺得電影裡的大氣層絕對不是現在世界，可能因為污染什麼

  的，大氣變得比較凝重，所以才能讓巨大飛機在小小的動力下飛行。


  3. 巨神兵是在培吉特地底挖到的，那他們深挖時沒發現地下巨大空洞？我想是因為腐海

  還沒吞噬培吉特，因此還沒淨化到。


  4. 娜烏西卡是穿米色緊身褲，這點我在家一格一格的確認過。


  5. 目測娜烏西卡胸部是33E，不然迪多早死了……


  6. 解開拉絲黛兒胸口的扣子又再扣回去的討論很多，我是個俗人，我覺是胸部小沒看頭

  。


  8. 培吉特究竟有多少人口？就算被殺很多人只一台飛機就沒啦。


  9. 小王蟲被大人抓離小娜烏還牽絲……


  10. 電影結尾看到風之谷訓練滑翔翼，但整個電影過程只有娜烏，有點說不過去。


  11. 庫夏娜展示她的義肢後，怎麼看守的人沒想到要再多加幾條繩子。


  12. 人類滅絕不會是因為腐海或蟲子，是人類自找的。


  --'
