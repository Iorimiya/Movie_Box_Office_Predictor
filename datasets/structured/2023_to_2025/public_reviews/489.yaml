url: https://www.ptt.cc/bbs/movie/M.1755624782.A.9C8.html
title: '[好雷]風之谷 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  暑假下午外面又下雨，沒事可做，我抱著筆電打算在房間寫東西，小兒子突然來找我，說

  不知道要幹什麼呢？


  我說那我們來看電影吧！


  於是我們窩在一起看「風之谷」，1984年的宮崎駿老片，我一直很想看。


  其實故事劇情很簡單，就是幾個國家為了生存而打戰，女主角娜烏西卡是風之谷的公主，

  她選擇保護自然而呼籲停止戰火。


  喔我太太太太喜歡娜烏西卡了，很帥氣很勇敢又很溫柔的女孩，努力保護子民，為了理想

  不顧一切，就算犧牲生命也要往前衝，無私又熱血的她，簡直是我的偶像！


  雖然是簡單的故事，但還是有些地方讓人動容而泛淚。


  娜烏西卡這樣的女孩，只能存在於電影裡，因為真實的世界，她會受盡嘲諷（而裹足不前

  ），如此不易，所以才叫我心疼和佩服吧。


  就像，我曾經跟別人訴說過於單純的理想，卻被罵笨蛋，被別人嘲笑天真的經驗，我真的

  好多噢，但看到娜烏西卡能夠完成「世界和平」的目標，感覺世界上果然還是需要我們這

  種笨蛋才好呢，真開心XDDDD


  我笨我驕傲！！！


  --'
