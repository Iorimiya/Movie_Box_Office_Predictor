url: https://www.ptt.cc/bbs/movie/M.1727867730.A.6DD.html
title: '[ 好雷] 風之谷 不可多得的好片'
content: '防雷












































  大學時老師有播過一點片段

  那時就覺得王蟲難得不噁而且酷斃了

  這幾天完整把它看完了,整個過程讓人享受

  關於他是不是在說環保正反交鋒蠻激烈的

  我是覺得都很有道理,基本上只有涵蓋環保的話

  那這部電影的深度真是被大大低估了

  我從他身上看到不少議題,可以統整成一個大方向

  就是人類如何不可一世的主宰一切

  很輕易就能看到軍國主義和對大自然的剝削

  這些無不讓人咋舌卻又毫不意外


  最後巨神兵對轟王蟲也是人定是否勝天的過程

  我覺得會享受這些是因為我找到了一種心情

  我當年被進擊的巨人震撼的時候也有

  他們都講了好多東西,卻不會腦袋爆炸

  而是井然有序的在我們心中建構想法

  交由觀眾去思考這些現象會帶人類走到哪

  所以我才說風之谷是不可多得的好片

  世界觀要不是片長不然一定也超有意思

  女主角也是目前宮崎駿作品裡顏質最高的吧

  （可惜男主角沒什麼存在感,王蟲還比較有戲）

  跟女王相比兩個人站在天秤的彼端

  為什麼都是公主,思想卻相差甚遠呢？

  如果想通了,對風之谷的存在就有意義了


  ----

  Sent from  on my Samsung SM-S9280


  --

  會拿美麗比喻成愛的人，都是不知愛情真相的人

  會把醜陋比喻成愛的人，都是熟知愛的驕傲者


  --'
