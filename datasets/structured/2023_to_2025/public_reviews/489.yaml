url: https://www.ptt.cc/bbs/movie/M.1741959934.A.900.html
title: '[無雷] 風之谷 數位版'
content: '感謝版上有人贈票，我也去看了風之谷



  這次放映的不是修復版，也不是膠卷，而是數位版

  講白一點就是在大螢幕播影片檔


  聲音應該是沒有混音過的 ，可能只有原始的製作2.0或是1.0聲道，

  我坐在中間偏後面1/3位置，完全沒有感覺到立體聲

  放映的是小廰 畫面填不滿，

  建議如果要選位置，可能選前面1/3位置比較好


  整體就影音體驗，可能沒有比在家裡看DVD好上多少


  選用的字體偏細小而且有點不美觀的

  很像是用電腦外掛字幕的那種感覺，是我覺得是最扣分的地方，

  製作的人一點SENCE都沒有，好像盜版檔案的感覺


  翻譯有一些錯誤蠻明顯的，

  錯的地方雖然不影響劇情也不太重要，但就是很明顯


  另外也有一些不只是翻譯的問題，可能是簡體轉繁體造成的

  像セラミツク，陶瓷，風之谷居民主要的武器及工藝材料，

  字幕上翻成 磁片，




  風之谷雖然1984年上映，但除去早期某些可能比較有辦法的動漫宅以外，

  在台灣大部份影迷接觸到的時間，應該大約是在1990年以後

  第一批主要的影迷應該是以錄影帶的方式接觸到的，

  之後、VCD、DVD ，經過了快30年，放映的是數位影片，

  體驗上卻沒有明顯的提昇，也沒有膠卷影片的懷舊感

  家裡有DVD的影迷，可能一年就播了好幾欠


  經過30年，以前一起迷動漫的朋友可能都失聯了


  廠商還更嘲諷的推出兩張票送特典的活動，鼓厲結伴觀影，二刷

  可以把售票量放大 2~4倍

  但對於老影迷來說，其實那張特典海報，可能還沒有自家的收藏有價值


  去電影院觀影也許只是一種更感到孤獨，空虛的紀念性的儀式



  附上一小部份收藏，

  其實還有很多，收在別的地方，懶得把他們挖出來了







  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  --

  重映不一定要高畫質修復，也可以播有雜訊的膠卷，我想應該比看修復版更感動，

  不過播膠券的難度應該比修復版還要高上許多

  那張海報，據說限量6萬多張，以限量來說不知道算多還是少

  也許對我來說是沒有感情的一個商業宣傳物

  不過我覺得東西的價值很難說，可能對某些人很重要而且是紀念性的一刻

  而這一刻是否能長久或是隨時間退去 ，

  可能要要問問30年後，還能保存好那張海報的人了

  我覺的海報最少要A2貼起來才有感覺，A3有印表機的自己印就好了

  反正就磁片吧，可能是要讓有用過5.25吋磁片的老影迷有親切感，故意這樣翻的

  你那是2片裝的嗎，beat只有60分鐘，雖然後面有開放n倍錄影模式

  沒有踩也沒有捧，

  就單純描述觀影的感受，為何會讓你有這種感覺?

  我對影音的要求是很低的，家中的電視是10年前45吋的中階機種，

  不可能比任何一家電影院設備好

  而且大部份的次數還是用電腦看的


  我也是第一次在電影院看風之谷，

  但我在電影院看時．是真的即沒有發現新天地，也沒有懷舊感


  反而讓那個字幕，讓我真得覺的有點像在電腦看影片


  那個聲音，應該只有mono連左右聲道都沒有，

  我怕是我的位置不好誤判，所以說的比較保守


  1.0制作成2.0， 5.1有何困難，花時間花錢就可以了

  如果40週年是一個有意義的歷史，難道不值得為他做一點事嗎


  至於收藏，何來優越

  大部份都是超過20年的東西，慢慢確認，一點一點獲得

  不是一時興起，

  也不是被廠商廣告影響

  那是我獲得想要的東西的方式



  可以重新制作，至於要不要這麼做，見人見智

  我的想法

  要就花時間，花錢下去重新修復制作，要就保留

  即然都要復古了，那為何不播膠卷

  撥個不上不下，只比dvd畫質好一點的影片檔，何必呢


  窮，買不起bd，大部的收藏還是dvd，很少重買bd的

  你知道最早的字幕是用燒的嗎，刻在底片上的


  播膠卷很困難，但不是不可能，正因為很困難還是達成了，

  努力讓奇跡發生，不是很感人嗎


  1.0混成 2.0自己一個人在電腦用軟體硬幹當然難

  但是專業的團隊，以現在的技術真的沒什麼困難的

  不然那來一堆老片修復

  再說真的要1個人也可以做，看到到什麼程度

  就不上不下，要復古沒復古，要翻新沒翻新

  那個字幕真得就醜，上一次看正版的看到比他醜的字幕是台版的 戰地琴人dvd


  如果那麼喜歡，那不如說說你覺得行的地方吧


  連感恩戴德 都出來了，你們各位即然這麼這麼喜歡

  要不要自己也發一篇觀影心得啊

  都像你這麼想，不可能， Nausica就不會去阻止王蟲了


  我還真的分太不出來啊，但這個音場是連我這種分不出來的都覺得爛的

  少在那張冠李戴亂扣帽子了，有沒有資格重映不是我說的

  可能是你還沒有看過漫畫版，

  電影只有漫畫第1集再多一點的內容，也因為改編電影做了一些簡化和改編

  以前小時侯看也沒有很喜歡風之谷，覺得結局有點莫明奇妙

  後來看過漫畫版之後,大大改觀

  漫畫版有比較完整的描寫，不只劇情，連人物背景都豐富起來了


  扣除去以前幫別人打工的幾部，風之谷應該是宮騎駿第一部自己的作品

  也是第一次和久石讓合作



  作畫上, 我覺得現在看都還是很精緻，因為都是人畫出來的

  現在的動畫大部份都是用電腦畫的，很多畫面還不是畫的，是電腦算出來的


  MIDI感可能是樂器是用電子樂，不像現在大作品喜歡請交響樂團


  那個年代用電子樂合成樂 算是很潮的東西

  可以找找一些比較著名的作曲家 像  hans zimmer ，Vangelis

  80~90年代初的配樂，也很多是用MIDI作的

  ex 南極物語  、黑雨...


  我查資料 DOLBY SURROUND 就是可以用2聲道模擬出4聲道的環繞效果

  1982年就有了，那時侯2.0聲道也很普及了，

  我猜可能是資源有限，都用到作畫去了

  錄音比較不重視，

  其實看很多8.90年代得獎的經典電影，開DVD看原始聲道還是用1.0錄的

  附加的 2.1， 5.1也是重新混的





  你這個要分三個層次


  1.那時代有沒有雙聲道錄音技術，

  有，而且很普及了


  2.那個時代的電影有沒有可能只用單聲道

  肯定有，我看過一些80年代的電影收錄音軌就mono的

  可能為了預算和制作方便的考量，這麼做不是不可能的

  就像現在都5g訊號了，用4g的還是很多

  更不要說如果3g不是今年關台，一樣還有很多人是用3g手機，我就是其中一個


  3.風之谷是用單聲道嗎

  我不確定，我也說了


  我開dvd標示是2聲道，但我接上耳機聽仍無法很明顯的分判出2邊聲音不一樣

  可能當初有用二聲道錄，但並沒有特別設計音場，所以聽起來不明顯

  也可能當初制作就是單聲道，後來的二聲道只是把 聲音x2


  顯然你把第一個問題的答案，當成三個在處理，所以才會得出這個結論



  Midi感(不是MIDI)，也不是一個有定義的專有名詞，


  看你的推文，你好像是拿現在的電子合成音，來打以前的電子合成音

  你把以前的，或設備比較差的電子合成音，歸類成MIDI感的聲音

  但其實兩者都是電子合成音


  除了現在大作都習慣用交響樂，

  而且電子合成樂的技術比40年前又更進步很多，很多還聽不太出來是合成的

  聽習慣現在電影的配樂和音效

  再聽以前的電子合成樂，確實會聽起來有點貧弱

  但其實當時用電子樂作業是很先進的象徵，

  只是當時的合成技術比現在差，或作曲者刻意使用不同於真實樂器的聲音，來營造科技感'
