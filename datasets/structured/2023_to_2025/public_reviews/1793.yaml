  第九位的《星球大戰前傳一：幽靈的威脅》（4.75億）和第八位的《海底總動員2》（

  4.86億）。

  　

  　　另外，該片首周末2天票房狂收10億6536萬2800日元、動員72萬9114人次登頂周末票

  房榜！首周末3天累計票房達13億7876萬5600日元，累計動員95萬1214人次！而且馬上迎

  來日本公眾假期，票房前景一片利好。



