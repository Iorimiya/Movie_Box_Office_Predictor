url: https://www.ptt.cc/bbs/movie/M.1644664040.A.B71.html
title: '[好雷] 千萬別錯過音樂劇《漢密爾頓》Hamilton'
content: 'Disney+ 上線之前，我最期待的就是音樂劇《漢密爾頓》！

  可惜至今臺灣仍沒有官方中文字幕（到底什麼時候要上啦 QQ），

  讓許多觀眾錯過這部風靡英美、引起社會現象級「漢密爾頓熱」的美好作品。


  希望這次有機會能推坑大家！




  方格子好讀版：




  雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  一部沒有電影巨星與特效的表演，也並非改編自大眾熟悉的故事，居然打破百老匯的單週

  票房紀錄。表演一票難求，在 2015 年 8 月百老匯首演之前，就已經賣出超過 20 萬張

  票，在二手市場上要買到一張漢密爾頓的票，平均要花近臺幣一萬元！它摘下的獎項也非

  常驚人，除了在劇場界的東尼獎拿下包括最佳音樂劇的十一個獎項外，還得到葛萊美獎的

  最佳音樂劇專輯和普利茲戲劇獎。





  這部音樂劇改編自同名傳記，主角是著作等身的美國開國元勛——亞歷山大．漢密爾頓，

  他也許不像他的同事喬治．華盛頓或起草《獨立宣言》的湯瑪斯．傑弗遜那麼知名，但他

  對現代美國的影響是有過之而無不及。


  編劇、編曲與主演的林-曼努爾帶我們走過風雲變幻的 18 世紀，演出漢密爾頓波濤洶湧

  的一生：從社會底層崛起的貧苦移民，美國獨立戰爭爆發時投筆從戎，又在數年後的制憲

  會議中發光發熱，卻因性醜聞而錯過總統之路，最後，在與政敵阿龍．伯爾的決鬥中被子

  彈擊中腹部、身受重傷，次日逝世。


  在看《漢密爾頓》之前，我看過的音樂劇並不多，卻深深沉浸在這部歷史主題的嘻哈音樂

  劇裡，林-曼努爾的作曲與歌詞有太多有趣的歷史故事、伏筆與雙關，到現在仍然是慢跑

  時的首選歌單。


  歌詞裡整齊劃一的押韻與節奏，每次聽都佩服不已：



  而它的故事回應了這個時代亟欲被解答的問題：



  即使在 1776 年，這依舊是個當代問題，美洲大陸上的反抗者，其實是歐裔海外移民先驅

  者的後代，他們的祖先可能是躲避宗教迫害的清教徒、胡格諾教徒，或是追尋商業利益的

  實業家、探險家。由於殖民地行政單元的封閉而凝聚成的民族想像，駁斥了現代種族主義

  的說詞，或是說，摘掉被種族主義者拿來轉移焦點的、被稱為民族主義的擋箭牌。


  《想像的共同體》用這一段文字來為兩者做出區別：

  事實上，民族主義乃是從歷史宿命的角度思考的，而種族主義所夢想的卻是從時間之始經

  由一系列永無止境而令人作噁的交配傳遞下來的永恆的污染——這是發生在歷史之外的。

  拜那隱形的黑色焦油刷所賜，黑鬼永遠就是黑鬼；拜亞伯拉罕的精液所賜，猶太人永遠就

  是猶太人，不管他們攜帶什麼護照，或者讀、講什麼語言。


  與漢密爾頓一起捍衛《獨立宣言》的，有來自法國的拉法葉將軍、來自愛爾蘭的穆里根，

  到約翰．羅倫斯招募的三千名非裔美國人士兵，他們是那個時代的外國人、移民與奴隸，

  與歐裔移民的後代站在同一戰線，為什麼到了承平時期，就出現了壁壘分明的界線呢？


  -


  2015 年 6 月，川普在宣布參選演說提到墨西哥移民時曾說：「美國已經成為其他國家扔

  問題的垃圾場。」反移民與種族主義的言論透過不同形式的媒體散播各處。


  在川普確認當選的十天後，副總統麥克．彭斯到百老匯觀賞《漢密爾頓》，在演出結束時

  ，得知副總統就在台下的演員布蘭登．維克多．迪克森（他飾演的角色是同樣擔任過副總

  統的阿龍．伯爾）對他發表一段聲明：


  「先生，我們——美國多元社會的一份子，擔心你的新政府不會保護我們、我們的星球、

  我們的孩子、我們的父母，或捍衛我們不可被剝奪的諸多權利。我們真的希望這個表演能

  激勵你堅信我們的美國價值觀，並代表我們所有人行使權力。」


  藉由重述這個國家誕生的歷史，以及這些人物為殖民地、為理想的奮鬥與犧牲，《漢密爾

  頓》以鏗鏘有力的聲音回答了這個問題：




  這段對答是整齣戲的靈魂、是給種族主義者的提醒，也是對受歧視者的一份激勵。


  --


  喬治三世的歌詞也很有趣，我超喜歡這雙關 XDD

  Don''t change the subject, ''cause you''re my favorite subject!


  確實，畫面皆是以同一場表演剪輯而成，因為想要討論的是音樂劇本身，

  我將電影版三個字拿掉以免誤會，感謝。


  YES! 各種與歷史的連結也非常有趣！

  看完之後我完全變成 Lin-Manuel 的粉絲，馬上去看 tick tick boom 和魔法滿屋 XD



  電影版三個字怕會產生誤會，以為是音樂劇的另一個版本。



  先加入片單！之後會有的！



  我最喜歡 Daveed Diggs XD，他把 Thomas Jefferson 演得又賤又可愛，

  內閣 rap battle 那一段超棒！！

  同意資訊量很大 ... 喜歡歷史主題的話真的會很滿足'
