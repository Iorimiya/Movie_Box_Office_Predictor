title: '[新聞] 皮克斯正在籌備首部「音樂劇」動畫！美'
content: '皮克斯正在籌備首部「音樂劇」動畫！《美國隊長4：美麗新世界》將把「這些角色」刪

  除




  （圖片來源：漫威影業）


  去年傳出計劃進行大規模補拍 + 重拍的《美國隊長 4：美麗新世界》（Captain America

  ：Brave New World）最近又有關於劇情更動的消息浮上檯面，權威媒體人 丹尼爾瑞奇曼

  （Daniel Richtman）日前在他的《Patreon》頁面爆料，漫威影業打算刪掉原本會出場的

  反派組織 Serpent Society（下圖），並尋找新一批的角色取代他們的戲份，而片尾的決

  戰劇情也會重新編排。





  （圖片來源：Pixar、Marvel Comics）


  Serpent Society 最初是一群為《美國隊長》漫畫連載設計的角色，該組織的成員均以「

  蛇類名稱」為代號，超能力也都與蛇的特性相關。


  除了《美麗新世界》之外，瑞奇曼也透露先前已殺青的《死侍》（Deadpool）第三集《死

  侍與金鋼狼》（Deadpool & Wolverine）將於五月進行補拍作業。


  關於同屬迪士尼體系的皮克斯動畫工作室，瑞奇曼也一併帶來了新情報。


  他透露，皮克斯正在開發一部以鴨子為主角的音樂劇電影，目前的片名也直接就命名為《

  DUCKS》，但瑞奇曼不確定這片名會否就是最終定案的版本。


  文：Joker


  新聞來源： Daniel Richtman Daniel Richtman Daniel Richtman


  新聞網址：




