content: '新聞網址：



  迪士尼真人動畫改編電影《美女與野獸》在全球繼續吸金中，在英國和北美票房表現十分

  搶眼。截至周末，《美女與野獸》全球累計票房大破11億美元大關！值得一提的是，該片

  在英國票房已經達到了6880萬英鎊（8820萬美元），從而超過2008年《媽媽咪呀！》6860

  萬英鎊，創造英國影史最高音樂劇電影票房！

  並升至英國影史總票房第8！該片也輕松超過中國8580萬美元成為該片海外最大票倉。目

  前該片還在英國上映當中，有望繼續創造新的記錄。此外，影片在北美已經上映６個星期

