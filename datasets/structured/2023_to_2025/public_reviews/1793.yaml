url: https://www.ptt.cc/bbs/movie/M.1574401210.A.E73.html
title: '[普雷] 冰雪奇緣2-音樂劇無誤'
content: '雷文防雷資訊頁











  防雷











  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~










  上映第一天就和女友殺去看


  心裡期待的也是希望能重溫六年前看第一集的感動


  雖然在看得當下笑得相當開心


  但散場後不禁開始回想


  這部續集諸多不合理的地方




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  從一開始Family game的橋段帶出Elsa被奇怪聲音不斷的呼喚


  半夜被吵醒 一開始雖然很不想搭理這個聲音


  但歌唱一唱卻突然態度180度大轉變


  自己跑出去追逐這些spirit?


  我只能解釋成經過了第一集


  Elsa更能接受那股尋求自我心中渴望的衝動?



  然後就在這個moment


  spirit就被激怒了???


  透過一些超自然現象要懲罰Arendelle


  這邊又是怎樣 簡直翻臉比翻書更快啊


  如果是氣以前Elsa祖父犯下的錯


  那為什麼是過了這麼久啊?



  Anyway 一行人最後是踏上了前往enchanted forest的旅程


  很快地就到了 也很快地就遇見了困在迷霧裡的軍人和原住民


  這邊我深深的覺得迪士尼動畫要放進這種黑暗的政治陰謀和血腥種族屠殺


  實在是吃力不討好的一件事


  完全展現不出兩邊那種血海深仇的對峙


  雙方這麼多年應該多有死傷


  每個人個性卻依然開朗


  而且一下子就接受了Elsa和Anna是國王的孫女


  目的是要來解救大家脫離迷霧


  在火蜥蜴出來賣萌之後


  兩邊真的就和好如初了......



  接著初次見面的原住民和Elsa說出有第五靈的存在之後


  就決定要出發繼續尋找第五靈


  然後就發現爸媽失事的船


  看到他們生前最後的一刻


  接著找到地圖 很清楚的畫著Ahtohallan的位置


  不是傳說中的河流嗎 = =



  然後Elsa就用很危險的方式把Anna送走了


  基本上是差點害死她妹妹沒錯


  在海邊馴服了水馬 迅速地到了北方的傳說之地


  唱唱跳跳跟著呼喚來到了大廳


  出現了母親的畫面  有點忘記台詞


  好像是說我的女兒妳終於來了


  所以那聲聲呼喚都是媽媽的聲音嗎?


  可是不是已經掛惹嗎QQ


  這邊我還是覺得媽媽應該要用某種方式登場


  好歹解釋一下 女兒 你就是第五靈


  這樣的動機才夠份量讓Elsa真正覺醒吧



  最後水壩崩塌的時候 洪水朝Arendelle湧去


  在同時間 spirit氣消解除Elsa的冰凍


  接著Elsa不知道怎麼得知這件事的直接騎著千里馬跑回去


  擋住洪水 再跑回enchanted forest


  My name is Elsa, and I''m the fastest woman alive......



  好了 吐槽結束XD


  撇除這些 不要太認真地看 會是很好聽的音樂劇


  後來去spotify聽原聲帶


  發現還有好幾首是電影沒有收錄的


  其中一首是Kristoff跟Anna求婚的歌


  真的很想在電影裡看到啊


  還有笑點是我最喜歡的部分


  Samantha真的笑死



  --'
