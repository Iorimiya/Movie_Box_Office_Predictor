url: https://www.ptt.cc/bbs/movie/M.1705461261.A.C94.html
title: 'Re: [新聞] 新版《辣妹過招》為何不強調是音樂劇？'
content: '國外其實也有在討論這個議題




  光是之前看到旺卡影評 就有人說  沒想到音樂劇的部分占比如此之大


  這已經是一個趨勢了  但這樣子的好與壞是很明顯的


  我想大家親自看過也會有一些心得



  以我來說  跟國外分析得差不多  就是首先劇情深度會減低


  以及會有超現實的感受  讓你很難進入  畢竟動不動突然唱歌  有點過於戲劇化


  年紀過了可能甚至會感到無聊或尷尬


  而這些歌舞的片段  當然就會縮減到電影敘事的節奏


  人物角色自然很難去細節刻出深度




  對於這樣子的趨勢  我自己在觀看旺卡的時候  覺得還可以接受


  因為它本身就是個很奇幻的故事  旺卡本來就是超能力者  一開始就超屌


  根本不需要努力


  好處就是時間其實過得很快  滿水的看一看就過了


  但是的確也讓我看完覺得  沒那麼動人



  我自己是覺得歌舞並沒有多討人喜歡  還是喜歡劇本好好用對話 場景去演繹


  寫歌寫曲跳舞  其實沒辦法讓人記憶深刻  走出電影院還帶走什麼


  只能當下嘻嘻哈哈  笑過去 甚至忍過去而已


  因此這的確是電影界的一大問題之一


  --

  說明啥？？'
