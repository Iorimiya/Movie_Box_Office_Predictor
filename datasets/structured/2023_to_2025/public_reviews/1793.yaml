url: https://www.ptt.cc/bbs/movie/M.1489574865.A.361.html
title: '[情報] 蕾哈娜取代魯妮瑪拉主演《新橋戀人》導演執導音樂劇新作《An'
content: '曾創作過《男孩遇見女孩》、《壞痞子》、《新橋戀人》與《花都魅影》等經典名作的

  Leos Carax 無疑是法國影壇中的一塊瑰寶，承襲法國新浪潮卻又獨樹一幟的電影風格讓

  他在影壇中樹立了相當特別的地位。而他在 2012 年中睽違 12 年帶來的新作《花都魅影

  》再次受到高度評價，也再次的證明了這位鬼才導演的功力依然寶刀未老。而如今繼《花

  都魅影》四年後，導演似乎又將再度動身帶來他的下一部電影作品《Annette》，並且在

  今日有了進一步的消息。


  早在去年底時就已經傳出《Annette》的相關消息，在當時釋出了包括片名、電影類型、

  劇情以及主演演員的初步資訊，不過在這將近五個月的時間中似乎也產生了些許變化，不

  過還是先讓我們來了解這部電影的內容再來看看是哪方面有更動呢。


  一直以來皆自編自導的 Leos Carax 這次將不會由自己編寫劇本，則將此重責大任交給了

  知名搖滾樂團「Sparks」的兩位成員 Ron Mael 與 Russell Mael 執筆，而兩位音樂人也

  將會同時負責創作電影當中所將使用的原創歌曲。而為什麼會有需要使用「原創歌曲」呢

  ？是的，繼導演在《花都魅影》大開玩心後這次則將挑戰製作一部音樂劇（Musical）電

  影，並且將成為他首部執導的英語電影。《Annette》的劇情描述一位才華出眾的喜劇演

  員在面對他的歌劇歌手妻子的去世後，將面對必須照顧他兩歲女兒的現實。然而，他卻很

  快的意識到他的女兒有著相當獨特的天生才能。


  在演員的方面，在去年底時曾傳出將由《派特森》威尼斯影帝 Adam Driver 與《最愛你

  的人是我》坎城影后 Rooney Mara 共同主演，然而，在今日有了些許的變化，原本預定

  主演的 Rooney Mara 確定退出此電影計畫，而將由知名歌手 Rihanna 取代，也就在此文

  章開頭中所提到的異動。


  在最新的消息中指出，今年才剛以《海邊的曼徹斯特》成為第一個以串流媒體之姿入圍奧

  斯卡最佳影片的 Amazon Studios 買下美國與加拿大地區的發行權，並且於今春正式進入

  電影製作期，預計於春季陸續在美國洛杉磯等多國開拍。


  Leos Carax 在 2012 年接受 IndireWire 的訪問時便說過希望有一天能夠拍攝一部音樂

  電影，他希望生活能成為音樂。而再回首 Leos Carax 過往的訪談中其實也曾經說過比起

  拍電影他一直更希望能夠組樂團，成為作曲人或是搖滾樂手之類的，然而如今的《

  Annette》也將是他另一種方式的圓夢了。


  《Annette》目前上映時間未定，而出身法國的 Leos Carax 將有極大的機率帶著此作於

  明年重返坎城影展。


  Amazon Studios 今年不只將《海邊的曼徹斯特》推入最佳影片候選之中，更成功的以《

  新居風暴》擊敗《顛父人生》等他國強片拿下最佳外語片。而近年崛起的 Amazon

  Studios 在今年中然仍有多部電影將陸續推出，其中即包括目前已經被各大媒體看好可以

  問鼎明年奧斯卡的《Wonderstruck》，由《Carol》大導演 Todd Haynes 執導，並且由《

  我想念我自己》奧斯卡影后 Julianne Moore 與《海邊的曼徹斯特》Michelle Williams

  共同主演。


  --'
