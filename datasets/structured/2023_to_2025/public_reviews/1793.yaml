url: https://www.ptt.cc/bbs/movie/M.1485836697.A.404.html
title: '[普雷] 從《52赫茲我愛你》看音樂劇電影'
content: '首先，能不斷挑戰新的類型當然值得鼓勵，在全然無相關經驗下，電影有瑕疵也是無可厚

  非，但若要越做越好，除了讚美甚至護航，總要有人說些沒那麼悅耳的意見才行。


  即使是讓人放鬆用的娛樂片，不代表必須把所有比較寫實的衝突刪掉，俗話說唯苦過方知

  甜，動作片要先讓觀眾看到主角受傷挫折，後面他奮起逆轉時我們才會覺得熱血爽快。好

  歹《樂來越愛你》還有完整帶出男女主角的困境和衝突，此片就沒什麼衝突，即使有，我

  們看的時候都已經知道「安啦，主角一定沒事的啦，等等一定會解決的啦。」這樣當最後

  出現圓滿結局時，我們又怎麼會感受到那甜蜜。


  可能會有人大喊「蕾蕾和大河就有提到愛情與麵包的煩惱阿，給我回去重看。」但這些困

  境都只是在沒啥關聯的場景邊走邊唱而已。導演魏德聖在訪談中提到音樂劇能為簡單的角

  色增加厚度，問題是也要有對的場景和音樂才能做出效果阿。《悲慘世界》即使全片都在

  唱歌，但至少有先呈現他們受苦受難的段落，這樣安海瑟威在唱《I Dreamed a Dream》

  時才有力道。比起乾乾淨淨，毫髮無傷的人，看踩到樂高的人吶喊自己很痛苦都還有點說

  服力。


  註：魏德聖訪談


  除了避重就輕的敘事策略，多支線也讓每個人物都很平板(怎麼一堆國片都有這毛病...)

  ，這讓每個人都沒有獨特的一面，這不是靠年紀、職業或性向的設定就夠了，這也導致每

  個人唱的歌都差不多風格。這就像是要做蛋糕，但裡面沒有巧克力或海綿體，全都是奶油

  ，當然不是說喜歡只吃奶油的都是_ _，但有多少人能吃完整鍋奶油還津津有味的?


  以舒米恩飾演的大河為例，要塑造樂觀到天然呆的主角不是不行，但至少也要讓我們看到

  他有基本的擔當和合邏輯的言行，明知道女友是務實的個性，阻止她分手的方式卻只是說

  些愛情夢想等漏洞百出的花言巧語(看到這段我附近一堆觀眾出現嘖嘖聲)，然後叫她留下

  來聽她唱歌(然後女主角為劇情所迫，決定放下十年的教訓，和絲毫未改進的大河和好

  ...)，都開樂器行了還以為3萬美金就能買房養家，就算是刻意為之的笑點，我們也不會

  是邊笑邊支持主角(像馬男波傑克那樣)，而是出現錯愕的傻笑，這種笑聲對編導來說可不

  是好消息。


  如果故事本身是沒那麼苦情的爆米花片，要怎麼用歌舞戲讓人物鮮明呢?來看看好萊塢是

  怎麼做的。


  「等等，拿那麼多預算和製作經驗的好萊塢比根本不準阿。」美國電影之所以天下通吃不

  完全是因為華麗的場面或大美帝國的政經施壓，而是它能說出大家都理解的故事，準確運

  用電影語言勾起我們的情緒，如果連基本功都不去試著理解的話，我們要怎麼不斷拍出更

  好的商業片來競爭，叫政府和觀眾不要吃牛肉麵然後無條件支持護航超小碗陽春麵嗎?



  金牌製作人


  就像動作片要邊打鬥邊推動故事，歌舞片在唱歌跳舞的同時也要順便說故事、建立人物。

  《金牌製作人》的烏瑪舒曼透過美色說服製片人錄取的選角戲就利用很簡單的結構呈現此

  人物性感的形象，就是劇情衝突和差異。


  商業片要建立人物，就要讓人物面對不得不解決的衝突，解決衝突時採取的行動才能顯現

  人物的特質。烏瑪舒曼在此段就要用能展現自己自信和身材的方式解決衝突，此行動本身

  就能以有力的方式凸顯人物。此歌舞戲分為三段，每一段的歌詞都是大同小異，但烏瑪舒

  曼的唱腔和肢體動作進入下段後更加妖豔，背景音樂的力道也逐步增強，音樂的起伏也會

  配合演員的肢體動作。因此有扎實的劇本基礎，和為之服務的表演及配樂，讓此戲不會顯

  得突兀。


  相較之下，《52赫茲我愛你》(歌曲出現的時間點可以看ZAZS的影評)的大部分歌舞戲的情

  境都很平淡，從被玫瑰刺之後唱《誰種了有刺的玫瑰》安慰、被嗆聲後唱《真愛履歷》安

  慰，到下雨時唱的《太陽雨》等都是如此，促成這些歌舞戲的衝突本身就不夠有力，所以

  人物解決此衝突的方式本身也無法呈現自己真正的特質，也給觀眾為了唱而唱的冗長感。


  註：ZAZS的影評



  痞客二人組


  那如果劇情本身就是關於很平淡的生活呢?裡面沒有跳舞元素或大排場的配樂團隊呢?電視

  劇《痞客二人組》用豐富的曲風和影像做出自己的風格。他們利用當下的情境(如傷害情感

  或遇上新歡)述說自己的感受時，常拿自己的往事說嘴，並透過歌詞的自我矛盾揭露主角們

  的天然呆，從音樂風格到各自唱歌時的肢體動作，都能有效建立人物的厚度和不同，並呈

  現歡笑中帶點酸澀的氛圍。


  註：痞客二人組其它歌舞戲


  同樣的，《52赫茲我愛你》引導出歌舞戲的情境還是很淺薄，以致引導出的歌詞都很空泛

  ，就像是臉書常看到的金言佳句，大家都說的出來(或po的出來)，比起這些話語，自己的

  往事更能有效建立人物。另外唱歌時的肢體動作也沒有加分，讓每人物都淪為沒血沒肉，

  任編導擺佈的傳聲筒。



  痞客二人組


  即使想辦法用運鏡和美術彌補歌舞場面，但上樑不正下樑歪，只求漂亮就好(而不是為故

  事打造獨有的世界觀)的打光和場景設計並沒有打造出獨特的歌舞世界，看到的只有如偶

  像劇一樣老梗的精緻佈景和想漂亮不成，反而虛假的特效(都快成魏德聖的標誌了)。《痞

  客二人組》美人魚歌舞戲的場景設計和特效或許廉價，但這樣正好和主角們白目的個性契

  合，不會讓人出戲，反而對此劇看似多變惡搞但其實很一致的風格印象深刻。比起《52赫

  茲我愛你》粗糙地包裝漂亮的人物，想讓觀眾喜歡結果招來白眼，《痞客二人組》編導對

  自己和人物都誠實的態度反而讓這此劇引人入勝，也凸顯兩主角的魅力。


  說了那麼多難聽的意見，為什麼是給普通的評價而不是負雷呢?因為張榕容還是一樣漂亮又

  會演戲XD這些批判的點至少還能讓人邊吐槽邊看下去，而且基於"國片"的標準，就給個普

  雷以示"鼓勵"。


  --



  除了影評，也收集各種影視製作的資訊，像玩樂高一樣回收重組，以找到新的角度來看電

  影製作和電影本身，若能幫助別人拍出更好的電影當然更好


  --


  另外補充一下，之所以給普雷也是因為此片針對的客群明確，知道觀眾想要的看點是什麼

  ，只是執行上出了差錯。相關的劇本設計可以看此文'
