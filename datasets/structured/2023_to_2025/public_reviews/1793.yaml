title: '[普雷]52赫茲，我愛你。看場音樂劇吧'
content: '電影版首po


  其實感覺不算是看電影，而是聽音樂、看音樂舞台劇，整部片劇情都用音樂交代完，


  對戲其實真的很少，整齣電影就只有一天的時間流逝，所以看完會有點覺得


  才過一天就結束了，但步調還好不會有很拖戲的感覺。



  一開始其實沒有那種一定要去看這部的感覺，因為聽到主題曲時覺得歌還好，


  但真的進到電影院看，配上劇情後，音樂就有了情感，整齣戲歡樂的氣氛，


  皆大歡喜的結局，加上音樂和角色個性的搭配真的很不錯，導致看完電影後，


  現在覺得音樂很好聽，腦海中也會自己浮出角色，蠻神奇的。



  以下講的內容比較偏音樂的部分。



  小球在這些歌曲中非常發揮自己的歌聲，情感的渲染力，可愛的角色，渾厚的高音，


  喜歡小球的人一定不會失望。



  小玉反而在這裡的歌聲有點被吃掉，可能大部分是和小球對唱，所以有一點被吃掉，


  或是剛好這些歌的曲調或音域沒有辦法展現出他的魅力。回頭聽宇宙人的歌會發現，


  其實早期的歌多是用音樂風格和曲調來展現特色，[往前]這張開始，


  則是能感受到小玉歌聲的溫暖，但是音色方面和小球相比之下，就顯得並沒有那麼有特色



  劇中若少了舒米恩這個角色，肯定會失色很多，天生的幽默感，


  加上舒米恩大概是這四位主唱中演戲經驗最豐富的一位(第45屆金馬獎最佳新演員獎)，


  完全詮釋好劇中大河樂天幽默像孩子一般的個性，歌聲也極具辨識度和開心的感染力。



  背景走動的人，也並沒有達到視覺引導讓目光焦點回到主角身上的用意。



  米非是我最不熟的一位，平常並沒有在聽小男孩的歌，她的歌聲也像小球是偏渾厚，


  並帶有些微沙啞感，但在某些幾近清唱的片段會覺得有一點點飄掉，不過還是很棒的演唱，


  比較在意的是某些字發言不標準，人變成ㄌㄣˊ，會讓我剎那出戲。



  當成一場音樂饗宴是很棒的享受，若不是在電影院看，租回家用電腦看，


  那效果絕對差很多。


  _


  講講缺點


  因為最近看電影很注意




  還有劇情裡面完全沒有解釋片名的意思，但是不管什麼都是以鯨魚和赫茲來宣傳，


  這樣有點沒頭沒尾的感覺，若沒事先看電影文宣介紹，完全不會知道背後的寓意。




  --

  02/06 21:2502/06 21:28

  除了四主唱，其他人的聲音都覺得不ok...

  趙詠華的聲音太扁了我不行


  這首我有默默泛淚


  所以沒看電影前不喜歡這首


  02/07 01:0702/07 01:45

  文中我是指米非的發音，舒米恩這樣才自然哈哈'
