url: https://www.ptt.cc/bbs/movie/M.1547977715.A.D9F.html
title: '[新聞] 迪士尼《鐘樓怪人》將推出音樂劇電影 傳'
content: '迪士尼《鐘樓怪人》將推出音樂劇電影 傳將由《冰雪奇緣》雪寶配音演員喬許蓋德主演


  （GNN 記者 阿Lu 報導） 2019-01-17 15:13:18

  　　

  外媒報導，迪士尼將把旗下動畫《鐘樓怪人》改編為真人電影，並傳將由 喬許蓋德（

  Josh Gad ）擔綱主演，過去他曾為《冰雪奇緣》中的雪寶配音、也在迪士尼《美女與野

  獸》真人版電影中飾演過來富。




  原著小說由法國文學家 維克多·雨果所著的《鐘樓怪人》曾多次被改編為電影、電視劇

  及音樂劇，迪士尼也於 1996 年推出了動畫電影。故事敘述一位從小被養在巴黎聖母院鐘

  樓的敲鐘人「加西莫多」的故事，他天生身形與長相都異於常人，只能獨自在鍾樓上與世

  隔絕，直到他在一場嘉年華會上遇到了吉卜賽女郎「愛絲梅拉達」，他的世界才逐漸開始

  不同……


  據外電報導，本次的電影也將以音樂劇的形式呈現，找來了劇作家 David Henry Hwang

  負責劇本創作，作中的音樂部分將交由著名的鋼琴家、百老匯及電影配樂作曲家，並多次

  獲得奧斯卡獎項的 Alan Menken 與 Stephen Schwartz 負責。




  --'
