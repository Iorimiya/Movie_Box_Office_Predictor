title: '[情報]電影《一個巨星的誕生》音樂劇將登百老匯'
content: "獨家：\n\n\nExclusive: “A Star is Born” Musical Coming to Broadway with the\
  \ Lady Gaga Hi\nts\n\n\n\n來源 showbiz411 ：\n\n\nRoger Friedman 報導：\n\n在 2017 年曾經宣布，\n\
  美國百老匯將上演一部名為\n《A STAR IS BORN》的音樂劇，\n當時還在撰寫劇本，並且由\n「比爾坎登 Bill Condon」擔任導演。\n\n隨後在\
  \ 2018 年，\n布萊德利庫柏 (Bradley Cooper)\n與 女神卡卡 (Lady Gaga)\n\n一起推出了由他們一同主演的電影\n《一個巨星的誕生》(A\
  \ STAR IS BORN)\n\n並且創作出許多熱門的電影原創歌曲，\n例如〈Shallow〉等。\n\n這部電影的全球票房收入\n高達 4.63 億美元，令人震驚。\n\
  \n在那之後，\n原版電影的百老匯版本\n產生了動搖與不確定性。\n\nP.S. 在 Bradley Cooper & Lady Gaga\n的電影之前已經有三部翻拍。\n\
  \n獨家消息《一個巨星的誕生》又回來了！\n導演比爾坎登離開這個計畫了。\n\n\n\n這聽起來很聰明，\n因為歌曲已經有了，\n劇本大致上也已經完成了，\n\
  觀眾現在也認可這就是真正的\n「一個巨星的誕生」，毋庸置疑。\n\n目前還沒有這齣電影改編成音樂劇的其他細節。\n演員陣容、導演或編劇都還未透露。\n但他們很快就會這麼做。\n\
  \n等不及想像開幕之夜會多隆重！\n\n\n但無論由誰萊出演，都會一夜成名。\n\n/\n\nFor a while there, Broadway was getting\
  \ a musical called “A Star is Born.” A\n script was being worked on, and Bill Condon\
  \ was going to direct.\n\nThis was announced in 2017.\nThen in 2018 Bradley Cooper\
  \ unleashed his “Star is Born” with Lady Gaga and\nall those songs that became hits\
  \ including “Shallow.”\n\nThe movie made an astounding $463 million worldwide.\n\
  After that, the Broadway version of the original movies (there were three befo\n\
  re the Cooper-Lady Gaga movie) just kind of drifted.\n\nNow I’m told by sources\
  \ that “A Star is Born” is back. Condon is gone. And\nnow the musical will be adapted\
  \ from Cooper’s version, complete with Lady Gag\na and Cooper songs.\n\nThis sounds\
  \ smart since the songs are already there, so is the plot, and the a\nudience now\
  \ thinks this is the real “Star is Born.” Well, it is, right?\n\nNo other details\
  \ yet. No cast, director, or writer have been revealed. But the\ny will be soon.\n\
  \nAnd imagine that opening night!\nWe probably won’t see this until 2026. But whoever\
  \ is cast will become stars\nover night.\n\n\n--\n\n\n.\nPAWS UP\nLittle Monsters\n\
  .\nPTT 看板LadyGaga（女神卡卡板）\n\n.\nPTT 看板WesternMusic（西音板）\n\n.\n\n\n--"
