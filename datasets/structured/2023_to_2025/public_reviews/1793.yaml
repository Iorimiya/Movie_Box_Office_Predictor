title: '[新聞] 迪士尼將拍真人版《白雪公主》音樂劇呈現'
content: "繼《灰姑娘》《美女與野獸》《花木蘭》後，迪士尼又要將另一部經典動畫《白雪公主》\n翻拍成真人電影了！原版動畫電影《白雪公主與七個小矮人》1937年問世，是迪士尼第一\n\
  部動畫長片。影片在第11屆奧斯卡斬獲榮譽獎，也被認為是歷史上最成功的動畫作品之一\n。\n\n　　本次《白雪公主》的改編與《美女與野獸》類似，新版本將以真人版音樂電影的形式\n\
  呈現。《列車上的女孩》編劇艾琳·克雷斯達·威爾森有望執筆本片劇本，百老彙著名作\n曲家Benj Pasek和《樂來樂愛你》音樂的詞作人Justin Paul將為影片創作新歌曲。《新\n\
  歡樂滿人間》制作人馬克·普拉特也將加盟本片制作。\n\n　　《白雪公主》動畫片問世以來已經被多次改編成電影，最近兩次分別是2012年由茱莉\n亞羅勃茲和莉莉柯林斯主演的《魔鏡，魔鏡》和同年上映、由莎莉塞隆和克莉絲汀史都華\n\
  主演的《公主與狩獵者》。\n\n　　迪士尼近幾年加快了真人電影的翻拍步伐。在《黑魔女：沉睡魔咒》《仙履奇緣》成\n功後，比爾·康頓版的《美女與野獸》正在制作當中，將於2017年上映。真人版《花木蘭\n\
  》正在選角，真人版《獅子王》將由喬恩·費儒執導，而真人版《阿拉丁》有望邀請蓋·\n瑞奇掌鏡。\n\n\n原文 \n\n\n--"
