title: '[新聞]《怪胎》從電影變身音樂劇！三金才子王希文'
content: '《怪胎》從電影變身音樂劇！

  三金才子王希文與大象體操聯手創作，

  以音樂譜出戀愛關係中的化學效應


  王牌音樂製作人與人氣樂團的組合，

  將為台灣音樂劇激盪出什麼樣的創作火花呢？



  BY ANGELINE HSIAO 與 YUNA CHEN 2023/06/11



  ＠瘋戲樂工作室 STUDIO MFACEBOOK


  2020年由謝欣穎、林柏宏主演的台灣電影《怪胎》，由「三金常客」王希文所領軍的「瘋

  戲樂工作室」攜手「數字搖滾天團」大象體操，於今年改編為可看性十足的音樂劇，將分

  別於6月10日、7月7日登上台北水源劇場、台中歌劇院的舞台，帶觀眾一次體驗愛情國片

  的細膩情感與音樂劇的視聽饗宴！



  怪胎 I WEIR DOFACEBOOK


  電影《怪胎》在第57屆金馬獎一舉入圍六項大獎，是備受肯定的熱門國片，刻畫一對患有

  強迫症的男女從相識、相戀到壓抑、欺瞞的心路歷程，雖然故事乍看之下是用「怪胎戀曲

  」包裝，但實際上卻點出了許多時下男女感情世界的觀點與問題，像是不安全感、缺乏理

  解、逃避溝通等。音樂劇《怪胎》的亮點除了有黃金編曲製作、樂團現場演出，相信演員

  們的演技與歌聲也絕不會讓我們失望！


  《怪胎》相愛是一種治療？


  ＠瘋戲樂工作室 STUDIO MFACEBOOK


  音樂劇《怪胎》請來康雅婷、那祈、周家寬及蔡邵桓等歌喉演技兼具的實力派演員領銜主

  演，一同以輕鬆詼諧的劇情、可愛亮麗的造型與帶入感強烈的音樂探討愛情世界中的關係

  變化。



  ＠瘋戲樂工作室 STUDIO MFACEBOOK


  陳柏青和陳靜都是強迫症患者，他們需要不斷強迫自己重複做某些事情，以讓結果達到心

  中的預期，否則內心會產生強烈的焦慮感。陳柏青有很嚴重的潔癖，對細菌非常敏感，只

  有每個月的15號會為了採買生活用品、看醫生而出門，只要踏出家以外的世界，他就一定

  全副武裝：穿防塵衣、戴手套、戴口罩，還會不停地洗手，所以他幾乎沒有正常的社交生

  活，大家都把他當作怪胎。



  ＠瘋戲樂工作室 STUDIO MFACEBOOK


  而就在某個命運的15號，陳柏青在外面的世界遇到了另一個怪胎——陳靜，陳靜除了有很

  嚴重的潔癖，她也無法停止關窗關門，只要在家以外的地方待上超過四小時，陳靜就會嚴

  重過敏、全身長出紅斑。就這樣，相知相惜的兩個「怪胎」從原本快痊癒的狀態，為彼此

  掉回自己的強迫症漩渦，一同構築天不怕地不怕的兩人世界。


  《怪胎》相愛是一種症狀？


  瘋戲樂工作室 STUDIO MFACEBOOK


  故事轉折從陳柏青的強迫症消失開始，在他學會接觸外面的世界後，壓抑與欺瞞開始出現

  在這段「一塵不染」的幸福戀情中，原本看似命中注定的戀情也隨之變調。陳靜像是永遠

  守在家裏的壁虎，爬不出自己的世界；陳柏青則像是渴望自由的鴿子，急著飛離原本的生

  活，兩人起初為了遷就彼此而面臨「要不要接受自己已經痊癒」的選擇，最後他們有了不

  同的答案，並漸行漸遠、走向不同的結局。



  ＠瘋戲樂工作室 STUDIO MFACEBOOK


  陳靜為了與陳柏青相守在一起，選擇住進他的家中，戰勝以往「無法踏出家門」的恐懼，

  可說是現代每個戀愛中的女子為愛勇敢的寫照。在一段關係中，格格不入的互補可以拉近

  也可以疏遠兩人的距離，如果你們已經習慣善用互補，創造出兩人的固定模式，那當這慣

  有的模式突然被打破時，你們還會是最適合的彼此嗎？


  音樂劇《怪胎》幕後音樂團隊太華麗！


  瘋戲樂工作室


  而音樂劇《怪胎》的幕後靈魂人物——王希文與大象體操，竟同時出現在今年金曲獎「最

  佳編曲人」的入圍名單中，讓雙方的關係除了音樂劇編曲的合作夥伴，又多了一層角逐金

  曲獎勁敵的連結，十分有趣！對此，王希文表示：「與正在密切工作的夥伴一起入圍特別

  開心，六、七月大家記得要來看我們的怪胎！」；大象體操鼓手涂嘉欽則逗趣笑回：「如

  果是我們樂團得獎，相信希文老師也會替我們感到開心吧，因為我們都是《怪胎》團隊！

  」



  王希文提供


  王希文也曾在宣傳《怪胎》的社群貼文中，表示自己身為大象體操的粉絲已久，很開心能

  與他們一起帶著原創性十足的生猛音樂進入台灣音樂劇，並寫下：「他們的音樂早已征服

  無限海外樂迷，而這一次，他們的魅力將與瘋戲樂怪胎劇組一起激盪出絢麗的火花，用浪

  漫奇幻的數字搖滾聲響，在台灣音樂劇寫下新的樂章。」自信向粉絲們保證音樂劇的品質

  與巧思！


  《怪胎》是大象體操首次挑戰音樂劇創作


  ＠大象體操 ELEPHANT GYMFACEBOOK


  這次合作是大象體操首度接觸音樂劇的編曲設計，團員們紛紛透露自己為了《怪胎》花了

  很多時間琢磨與創作，吉他手張凱翔分享自己從一開始投入創作時就感到非常興奮，看過

  正式彩排後更對演員們精湛的演技與動人的歌聲感到驚艷，令他加倍期待舞台呈現。



  瘋戲樂工作室


  貝斯手張凱婷則分享在收到王希文製作的demo後，花了很長的時間消化，並每天與自己對

  話、拉扯：「有將近半年我都聽著王希文的歌聲入睡。」她只希望能以大象體操慣有的風

  格去呈現音樂劇需要的效果，讓觀眾在以聽覺享受故事之餘，也能找到熟悉的大象體操風

  味。王希文也分享《怪胎》絕對是貝斯最多、最豐富、最潮也最大聲的中文音樂劇，讓人

  格外期待現場聽團時，貝斯的沉穩音色將如何優雅地帶領全劇的音樂語言！



  ＠大象體操 ELEPHANT GYMFACEBOOK


  《怪胎》為了讓表演有最好的呈現，選擇在24場的演出中以現場演奏的形式呈現，讓觀眾

  們無需隔著音響與預錄檔案，零距離接收編曲震撼，十分爽快！


  《怪胎》展現王希文對音樂劇的執著


  瘋戲樂工作室


  身為三金（金曲、金馬、金鐘）名單的常客與「瘋戲樂工作室」的創意總監，王希文是許

  多台灣音樂劇背後的熱情推手，他和瘋戲樂對音樂劇有著說不盡的創作熱情與實踐理想，

  從改編百老匯經典的《LPC》到回顧台灣影壇的《台灣有個好萊塢》，即使踢到鐵板或是

  面臨經濟困境，他們仍用一種偏執自信的姿態走在這條路上，今年除了操刀《怪胎》更推

  出《搖滾芭比》中文版，轉譯韓國經典音樂神劇，豐富台灣音樂劇文化。



  瘋戲樂工作室


  王希文對於《怪胎》音樂劇能順利呈現給觀眾感到非常欣慰，他也同時感嘆台灣的音樂劇

  環境非常辛苦，即使投注許多心力與時間，致力於製作一部成功的音樂劇，最後能呈現的

  機會往往只有短短的時間，期盼未來能有更多定目劇形式的演出，讓每一部努力誕生的作

  品能有足夠的空間呈現，甚至能吸引海外的遊客來台灣觀賞音樂劇。




  【台北場演出資訊】


  時間：6月10日（六）～ 6月24日（六）午場14:30、晚場19:30


  地點：臺北水源劇場


  【台中場演出資訊】


  時間：7月7日（五）～ 7月16日（日）午場14:30、晚場19:30


  地點：臺中國家歌劇院 中劇院



  瘋戲樂工作室


  Harper''s BAZAAR TW 哈潑時尚



