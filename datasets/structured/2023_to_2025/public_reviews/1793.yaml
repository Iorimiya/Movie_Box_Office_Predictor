url: https://www.ptt.cc/bbs/movie/M.1535971515.A.917.html
title: '[新聞] 泰勒絲、伊恩麥克連主演音樂劇《貓》電影'
content: "泰勒絲、伊恩麥克連主演音樂劇《貓》電影版將在明年聖誕節檔上映！\n\n繼2012年帶來全球收穫超過四億美金賣座票房的《悲慘世界》改編電影後，金獎導演湯姆\n\
  霍伯的新作將再度鎖定將另一部經典音樂劇真人化。由作曲家安德魯洛伊偉伯重新改編打\n造的《貓》，早在2016年便傳出正在籌備電影版的計劃，直到前陣子才總算敲定了泰勒絲\n\
  、珍妮佛哈德森、詹姆斯柯登、伊恩麥克連這四位主要卡司的加入，而現在環球影業終於\n則確認了本片的上映檔期。\n\n環球影業稍早宣佈，《貓》電影版已排定2019年12月20日聖誕節跨年檔上映，該檔期原本\n\
  預計上映的是另一部同樣改編自音樂劇、由《時時刻刻》導演史蒂芬戴爾卓執導的《綠野\n仙蹤女巫前傳》，但為了配合製作時程安排的調整，檔期因此推延，未來並將公佈新的上\n\
  映時間。\n\n明年的12月20日這週檔期堪稱大片雲集，《貓》屆時得和迪士尼影業的《星際大戰第九部\n曲》、20世紀福斯的肯尼斯布萊納版《東方快車謀殺案》續集《尼羅河謀殺案》、索尼影\n\
  業的重啟版《太空超人》改編電影展開正面交鋒，勢必將是一場激烈的票房廝殺。\n\n文：Joker\n\n\n\n--\n\n那個男人，臉上永遠有著捉摸不透的悲傷微笑。竹鼠們不知道他為什麼會那樣的殘忍，總\n\
  是莫須有的給自己扣上「中暑、內外傷、長太肥、長太瘦、憂鬱症」反正那個男人一開口\n，所有鼠的數量就會少一隻。\n竹鼠們都很慌張，大家都在討論要不要集體出逃，離開這個鬼地方。\
  \ \n \n\n--\n                                    09/04 20:15"
