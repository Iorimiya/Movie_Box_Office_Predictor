title: '[新聞] 「獅子王」全球熱賣 音樂劇演員也朝聖'
content: "新聞網址：\n\n2019-07-22 20:46 聯合報 記者陳建嘉╱即時報導\n\n電影「獅子王」全球票房熱賣，台灣開片至今5天累計1億1209萬，全球票房也已有5.3億\n\
  美金(約新台幣164億)，電影話題持續延燒，就連正在台灣表演音樂劇「獅子王」的演員\n包括喬丹蕭、阿曼達庫尼尼以及安東尼勞倫斯等人到戲院看電影版「獅子王」，開場音樂\n\
  響起時不但歡欣鼓掌，飾演小辛巴、小娜娜的演員們更是開心跟著大聲合唱。\n\n「獅子王」時隔25年上映，動畫特效再升級，有著栩栩如生的動物特效，讓人彷彿身歷其\n\
  境，一探非洲大草原，而當年進戲院的觀眾都已為人父母，適逢暑假期間也讓各地戲院都\n掀起親子觀影潮，除了勾起大人們童年回憶之外，更多了代代傳承的深厚意義，電影至今\n\
  也已刷新不少紀錄，包括北美迪士尼動畫改編電影、普遍級電影、七月電影開片票房。\n\n除此之外，同屬迪士尼出品的「復仇者聯盟：終局之戰」也以全球27.9億美金(約新台幣\n\
  866.3億)的票房，打敗「阿凡達」的27.89億美金(約新台幣865.9億)，正式登頂為影史票\n房冠軍，漫威影業總裁凱文費吉已在聖地牙哥動漫展上證實此事，導演羅素兄弟也在自己\n\
  的Instagram轉貼該新聞，並對影迷喊話「你們是全世界最棒的影迷」，包括「美國隊長\n」克里斯伊凡、「雷神索爾」克里斯漢斯沃也都在IG上發文，謝謝影迷多年的支持。\n\
  --\n    \n\n ; \n\n\n\n\n--"
