content: '剛剛五點多獨自開車從台北回台中

  大概兩小時多車程

  因為CODA得獎

  突然福至心靈打開Disney+

  選了巨ㄩq再唱沿路邊聽邊開 片長跟路程差不多

  劇情單純 對白明確

  第二幕之後天籟美聲 一路唱到家

  推薦給各位單獨開車的朋友們


  順便也想請問大家Disney+跟Netflix上面

  還有哪些類似單純 悅耳的音樂電影

  回程再聽一部 開車不無聊

  希望以中文粵語為主 英語為輔

  其他語言對白聽不懂怕會不由自主偷瞄畫面


  祝大家行車平安 一路暢通


