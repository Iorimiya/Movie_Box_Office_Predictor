title: '[新聞] 談拍音樂劇 魏德聖：要證明我懂愛情'
content: '（中央社記者黃名璽東京18日專電）台灣電影導演魏德聖今天率新片「52Hz, I love You

  」演員，一起到日本東京宣傳。談到自己為何拍這部音樂片，他說：「大家都說我不懂愛

  情，我要證明我懂愛情。」


  魏德聖18日到日本東京參加TAIWANDERFUL活動及「台灣之夜」，並宣傳新片。這部電影是

  魏德聖第一次嘗試拍音樂片，主要演員小玉、小球、舒米恩、米非都是歌手，也跟魏德聖

  一起出席。


  他談到這次為何拍音樂劇時說，這部電影老實說「來得有點意外」，本來不在計畫之中。


  魏德聖說，有一天看到一個很漂亮的景像，就覺得好像應該要寫一些快樂的東西。


  這個景像是他之前在德國時，剛好是春天，當時時差還沒調過來，一大早就起床坐在鄉下

  民宿內靠院子的廚房內吃早餐。


  天愈來愈亮，他看到院子裡開滿了花，景像非常美麗，就覺得好像該做些什麼讓自己也愉

  快的事情。


  魏德聖於是到房間把電腦拿出來，就想起了20多年前放在心裡的種子，一個女生不小心愛

  上了一個男生，「就把它一個字一個字這樣寫出來」。


  「再加上以前拍的電影，大家都說我不懂愛情，我要證明我懂愛情，所以就拍了這部快樂

  的電影。」魏德聖補充說。


  小玉現場拱魏德聖跟台下觀眾說「我愛你」，魏德聖稍微吸了一口氣先用日語說「我愛你

  」，贏得滿場掌聲；後來又用中文補了兩次「我愛你」。


  新聞網址：


  --'
