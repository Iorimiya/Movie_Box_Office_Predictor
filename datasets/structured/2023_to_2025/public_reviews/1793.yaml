title: '[新聞] Netflix 音樂劇《Matilda》電影版停拍'
content: "由於英國 Covid-19 疫情延燒，Netflix 宣布音樂劇《Matilda》電影版拍攝計畫停擺。\n\n本片將由美國東尼戲劇獎與英國奧利佛獎得主馬修.沃楚斯執導，丹尼斯.凱利根據\n\
