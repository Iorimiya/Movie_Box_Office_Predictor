title: '[新聞] 國片《海角七號》 日導改拍音樂劇'
content: "新聞網址：\n\n    國片《海角七號》 日導改拍音樂劇\n\n    【台灣醒報記者林亭妤台北報導】曾創下台灣5.3億票房的國片奇蹟《海角\n\
  \    七號》，即將由知名紐約百老匯導演宮本亞門改編成音樂劇！宮本亞門29日\n    在記者會上表示，他第一次看《海角七號》時竟大哭，隨後便決定要將其改\n\
  \    拍成音樂劇，沒想到初訪導演魏德聖時，魏想都沒想就答應了，速度快到讓\n    他「傻眼、不知所措」。\n\n    魏德聖29日則在「海角七號中文音樂劇」記者會上笑著透露，其實一開始耳\n\
  \    聞宮本亞門有意將《海角七號》改編成音樂劇時，他已經先探聽到宮本亞門\n    在日本劇場界的知名度，後來又近一步知道宮本亞門不只立威日本，還是曾\n\
  \    拿過美國劇場界最高榮譽「東尼獎」的百老匯導演時，心下立刻一咯噔想，\n    「完了，這下我不只是要答應，還要盡力從旁協助。」\n\n    「我太愛台灣了，但是朋友對我說，沒看過台灣國片《海角七號》，不能說\n\
  \    你愛台。」宮本亞門表示，感受到電影中阿嘉想成為歌手的人生、自身難以\n    言喻的鄉愁、跨越時空與地域的愛情，這些剛好都是作為音樂劇故事的最佳\n\
  \    素材，加上電影中的音樂使用地非常好，讓他哭完立刻決定佐以幾首歌配\n    合，將其改編成音樂劇。\n\n    對於兩個國家、不同的民族將合力籌拍音樂劇，宮本亞門表示，雖然台灣、\n\
  \    日本有著語言的隔閡，但文化連結程度相當緊密，未來更希望這部音樂劇可\n    以帶進日本市場，因此希望兩方的工作人員可以有良好的溝通，「像電影中\n\
  \    女主角的態度當然不要在現實出現啦！」\n\n    此次更邀請到資深藝人「澎恰恰」前來替任已故的「茂伯」角色，魏德聖俏\n    皮地說，澎恰恰前輩特別適合老頑固這個性，當他在尋思該找誰來接演茂伯\n\
  \    時，便想到了澎恰恰，隨後使出撒嬌十八班武藝，終於得到了對方首肯。\n\n    《海角七號》中文音樂劇，將於明年（2017年）5月4～7日，在高雄至德堂\n\
  \    首演5場。\n\n\n---------\n舞台劇名導宮本亞門！！！\n\n剛剛看了一下 目前是計畫舞台劇也由電影原班人馬演出，\n\n包括主角范逸臣、田中千繪、應蔚民、馬念先等人\n\
  \n但之前演女孩「大大」的楊蕎安已經20歲了，所以改找演出此角 (呃...\n\n硬要說是因為台灣沒童星的話 楊蕎安在海角七號前也沒演過戲不是嗎...why歐陽!?\n\
  \n--"
