url: https://www.ptt.cc/bbs/movie/M.1576738597.A.87E.html
title: '[討論] 音樂劇《貓》的電影改編美媒惡評如潮'
content: '「《貓》是自狗以來對貓的最大災難。」


  「當Tom Hooper 110分鐘的《貓》結束時，電影院死了，而我們這些不幸的人卻得悲慘地繼

  續活著。」


  「有沒有可能做出一部爛片，爛到影藝學院把你的奧斯卡最佳導演回收?我是在幫Tom Hoope

  r問的。」


  「參與這部安德魯洛伊韋博爛改的影星們要用九條命來讓人們忘記他們拍過它只怕還不太夠

  。」


  ......我一直覺得Tom Hooper是個超級沒料的最佳導演得主，但這可能是我最想看他到底拍

  了什麼鬼的一次!




  --'
