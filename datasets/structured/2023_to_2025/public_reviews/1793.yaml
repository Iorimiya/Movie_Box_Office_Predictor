url: https://www.ptt.cc/bbs/movie/M.1613181783.A.6B7.html
title: '[新聞] 派拉蒙將重啟音樂劇電影《國王與我》'
content: '派拉蒙影業日前宣布將由 Temple Hill製作公司重啟經典音樂劇《國王與我》，

  至於主創團隊與卡司則尚未公布。


  理查.羅傑斯、奧斯卡.漢默斯坦根據安娜.里歐諾文斯自傳與瑪格麗特.

  藍敦於 1944 年出版的小說《安娜與暹羅國王》創作的音樂劇《國王與我》

  在1956 年登上大銀幕，男女主角分別由尤.勃連納與黛博拉.寇兒飾演。




  在搬上大銀幕之前五年，《國王與我》就已經在百老匯演出，尤.勃連納

  與葛楚德.勞倫斯擔綱的這個製作曾獲得包括最佳男女主角要在內的五項東尼

  戲劇獎。


  2015 年，在 Vivian Beaumont Theater 登台的版本則獲得當年東尼獎最佳重

  演音樂劇獎與最佳服裝設計，女主角凱莉.歐哈拉與露絲.安.邁爾斯則摘下最佳

  音樂劇女主角與最佳音樂劇女配角，渡邊謙獲得最佳音樂劇男主角提名。




  題外話


  在看過渡邊謙跟凱莉.歐哈拉演出片段，我認為兩人還是電影重製版的最佳組合，

  但如果有更適合的亞洲或東南亞演員能飾演暹羅國王這個角色，也是可以的。


  --



  這裡說的是音樂劇電影，茱蒂福斯特跟周潤發的《安娜與國王》不是。


  《窈窕淑女》有傳出重拍消息，女主角屬意綺拉.奈特利。

  亨利高汀外型很好，可是太年輕了，適合演跟嬪妃私通的那個小伙子。'
