url: https://www.ptt.cc/bbs/movie/M.1647921511.A.3F4.html
title: '[新聞] 西城故事出師不利 史匹柏:再也不拍音樂劇'
content: '新聞網址：


  Yahoo奇摩電影編輯部

  2022年03月22日



  【文／血紅蘭姆】看來《西城故事》的票房慘敗經驗，確實讓大導史蒂芬史匹柏留下了相

  當苦澀的記憶。



  靈感取自莎士比亞劇「羅密歐與茱麗葉」、翻拍自1957年同名舞台劇，也是自1961年同名

  電影以來第二次被搬上大銀幕，《西城故事》由商業大導史蒂芬史匹柏執掌帥印，安索艾

  格特和瑞秋曾格勒聯手主演，電影描述了兩支街頭幫派的對立，以及身處這場角力之中的

  一對年輕戀人。








  更何況，因此在《蜘蛛人：

  無家日》狂風掃落葉的票房吸金魅力之下被一路壓著打。歷經這場票房滑鐵盧之後，





  儘管宣告從此不再執導音樂電影，但史蒂芬史匹柏仍然不排除以製片身份來參與音樂電影

  的製作，畢竟他目前正在操刀製作音樂劇版的《紫色姐妹花》，其1985年原版電影便是由

  史匹柏親自執導。



  史蒂芬史匹柏也透露，為了順利取得《西城故事》的版權，自己當時還特地前往作詞家史

  蒂芬桑坦的家中拜訪。「他的狗一直在聞我的胯下，而我不敢把牠們推開，因為我不想激

  怒他。」



  史蒂芬史匹柏表示，本片達成了自己的目標，因為他希望「羅密歐與茱麗葉」的故事能夠

  繼續流傳三十年。「透納經典電影頻道和標準頻道是我最愛的電視頻道，但它們的收視率

  不怎麼高。」



  而當他被問到，身為一名製片的成功之道究竟為何時，史匹柏則分享道：「我做過最聰明

  的事，就是雇用女性員工。我一直都有這麼做，也會繼續這樣下去。我相信身為製片的力

  量。你們不只是領袖，更是心理治療師。我總是仰賴比自己更堅強的人來擔任製片。」



  --'
