url: https://www.ptt.cc/bbs/movie/M.1673191342.A.4FE.html
title: '[  雷] 瑪蒂達 音樂劇'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  舊版瑪蒂達在1996上映，現在想起來彷彿昨天看過一樣，新版及舊版都有在網飛，有興趣

  的朋友可以去看一下


  標題為雷，但好壞參半，新版內容換湯不換藥，大致脈絡是一樣，不得不說改成音樂劇形

  式更吸引人眼球，值得一提的是網飛出版的小女角居然是白人演出，其餘同學多啟用有色

  人種，女老師由黑人演出，但這邊有個很有意思的世界觀，那就是白人在這部是壞人役，

  真的非常政確


  先講好雷部分，音樂劇形式真的看出來導演下了很多功夫，一開始介紹監獄學園那邊非常

  精彩，以英文字母串場為一首歌，我覺得是最好聽的一首。


  這版的瑪蒂達比較不重視魔法修煉，但可以感覺魔力較強大，除了一般的物理移動，還多

  了講歷史回顧


  感應到女老師的父親是魔術逃脫大師，而母親是空中飛人，兩人長年膝下無子，悲傷之餘

  ，決定表演危險的藝術來成就人生，不料表演當天發現懷孕了，打算下場時，被繼姐要求

  履行合約，不出意料的話，馬上就出事了，當然是由媽媽高空摔落並免強產子，讓老師活

  了下來


  後面我們當然知道繼姐就是校長，最後一幕由瑪蒂達操控鐵鍊幻化成魔術逃脫大師來攻擊

  校長，這一幕應該是特效最重本的地方，場面很大，比舊版攻擊火力高了不少


  接下來是稍微負雷方面，可能是對舊版回憶太美，舊版老師真的超美，非常溫柔婉約，也

  很努力在對抗校長、不會教養的父母，也救了關在禁閉室的瑪蒂達，比較有跟小女主相互

  救贖的感覺


  新版老師氣勢稍弱，很多時候都是茫然無助表情，少掉去家裡偷娃娃的劇情，讓這角色對

  家裡的連結更弱


  大至感想就這樣 喜歡音樂劇可以來看看





  --'
