url: https://www.ptt.cc/bbs/movie/M.1459428594.A.BCE.html
title: '[好雷] BVM蝙蝠俠VS超人的多角度感想(音樂劇情) '
content: "大家晚安，我是POPO\n\n其實看這部片是因為我女友(不知道算不算)他跟他朋友跑去看。\n\n而且沒跟我說是跟誰看\n\n所以我找不到伴一氣之下就自己一個人衝進電影院了QQ\n\
  \n\n\n\n\n先從劇情跟畫面上講一些自己覺得的優缺點\n\n\n優點:\n\n1.真的完整地呈現了蝙蝠俠跟超人打鬥的情形跟狀況。\n\n還有雙方打架所帶出來的人格特質\n\
  \n像是蝙蝠俠的狡猾奸詐跟超人的直來直往，這些都不斷在電影片段出現\n\n\n2.許多畫面拍得真的很唯美，如詩如畫\n\n像是開頭蝙蝠俠的夢境、超人降臨\n\n\
  \n3.非常的熱血，最後那段三巨頭(神力女超人、蝙蝠俠、超人)並肩合作真讓人有一種魔獸\n\n打副本的感覺XD，至少並不是從頭都是非常順利，比起傳統的英雄電影。\n\
  \n這一部對我來說，反派把主角虐的蠻爽快的。\n\n\n4.對於人性的描寫其實十分寫實...其實沒有所謂的正義，因為角度不同就算有，也只是因\n\n為有共同的目標及敵人而已。\n\
  \n這社會何嘗不是如此。沒有一個正確答案，如同政治色彩及社會狀況(多元成家等等)\n\n我看到這邊我覺得真的很有感受。\n\n\n\n缺點\n\n1.前半段的故事真的非常沉悶，我不是DC迷，但因為這幾天放假把超人歸來K完\n\
  \n加上自己看想要看的電影會先做一下功課(不是看影評，而是看維基百科來了解故事腳色)\n\n\n2.我自己認為編劇太貪心了，把一堆劇情塞進去，變成故事其實對於沒有做過功課的人，\n\
  \n看得會有點痛苦，我有聽過我女朋友說這部片子基本上要做功課，看看前面的蝙蝠俠三部\n\n曲才能夠去連接一下故事內容。\n\n但是其實說真的，沒有一定要看過超人還是蝙蝠俠系列才能去看這部電影。\n\
  \n因為像我我也是看得很開心XD，可能是前面因為好奇就一直去看維基百科等介紹吧。\n\n所以算是無痛接軌拉...\n\n\n\n\n配樂方面\n\n雖然這部片是Hans\
  \ Zimmer大師所製作..\n\n\n但是配樂真的太多太雜了...變成其實感覺整片都在聽配樂，不太能完全融入電影之中\n\n而且場景之間的切換，似乎完全安靜的場景不多，讓我不禁有種吵的感覺\n\
  \n\n\n\n補上一些有看到部分版友在提到的一些劇情疑問(當然這是我自己猜想，畢竟我不是DC迷)\n\n以下不按照劇情順序\n\n\n1.為什麼超人他女朋友要把那把那把可以殺外星人的武器丟到水裡?\n\
  \nA:因為超人會因為這把武器非常痛苦，並且失去神力。所以在女主角眼裡，也許把它丟掉\n\n可能是最好的解決方式吧?\n\n2.為什麼蝙蝠俠因為聽到超人他媽的名字就心軟不殺他了?\n\
  \nA:在我的猜想是因為不僅是聽到自己媽媽的名字而產生疑惑，並且也驚覺到其實超人他雖\n\n然是外星人，但是他還是有養父母(這跟人類的生活形態一樣)，代表超人他也是有人性化\n\
  \n的一面。並不是完全冷酷無情。\n\n3.為何蝙蝠俠救超人他媽的時候，說我是你兒子的朋友?\n\nA:因為蝙蝠俠她媽跟超人他媽名字一樣，可能讓蝙蝠俠也覺得超人他媽也是自己親生父母\n\
  \n的感覺。有一種心結打開的感覺(這邊指的是童年失去父母)\n\n4.為什麼今天超人要去送死，拿武器捅外星人?\n\nA:蝙蝠俠他的管家阿福，前面有提到就算拿到武器也不見得能殺掉他，要將武器捅到她皮\n\
  \n膚底下去才有效果\n\n\n如果是這樣，神力女超人要拿繩子捆外星人-->無法\n\n            蝙蝠俠--->雖然他是人類的佼佼者，但是他畢竟是人，如果你有仔細看打鬥\n\
  \n                      畫面，基本上他根本沒辦法跟外星人硬碰硬。-->無法\n\n            超人--->就決定是你了，因為總不能叫雜魚或超人女朋友去桶吧。\n\
  \n                    符合力氣大、能靠近外星人、防禦力高的角色就只有超人了...\n\n\n剩下的慢慢再補...\n\n--\n內建九二共識!HTC好神\n\
  \n--"
