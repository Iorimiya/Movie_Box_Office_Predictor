url: https://www.ptt.cc/bbs/movie/M.1462608970.A.9C3.html
title: '[新聞]音樂劇《貓》將改編成電影《悲慘世界》導'
content: '據美國《娛樂周刊》報道，導演湯姆霍伯Tom Hooper繼《悲慘世界》後，又將目光鎖定了

  另一部音樂劇改編的電影——《貓》，環球影業與Working Title影業則負責影片的制作

  發行工作。


  2012年的《悲慘世界》口碑極佳，獲得了第85屆奧斯卡包括最佳女配角（安海瑟薇）、最

  佳音響效果和最佳化妝與發型三項大獎。而湯·霍伯的履歷表也很出色，在2011年就憑借

  《王者之聲》摘得奧斯卡最佳導演，今年更憑借《丹麥女孩》為艾麗西亞維坎德奪得最佳

  女配角殊榮。


  《貓》是英國著名作曲家安德魯·洛伊德·韋伯根據艾略特詩歌改編的音樂劇，1981年5

  月11日首次出演並一舉獲得世界觀眾，尤其是兒童觀眾的喜愛。《貓》曾獲得七項舞台劇

  奧斯卡——托尼獎，其中由芭芭拉史翠珊演唱的主題曲“回憶”成為傳世經典。


  據悉，湯姆霍伯除導演外，還將與《丹麥女孩》的制作人團隊蒂姆貝萬、艾裡克費爾納共

  同擔任制作人。



  恩........又會有一堆大頭Close-up 跟平淡情感了嗎








  --'
