url: https://www.ptt.cc/bbs/movie/M.1532264434.A.028.html
title: '[情報] 林曼努爾米蘭達將執導音樂劇《倒數時刻》改編電影'
content: '美國演員 Lin-Manuel Miranda 近年來因為其創作的音樂劇《漢密爾頓》（Hamilton）讓

  他紅遍整個美國。這齣以美國建國時期為基礎，並以開元元勳 Alexander Hamilton 為主

  角的《漢密爾頓》卻大膽的以「饒舌（Rap）」的形式表現整齣音樂劇的基調，經由

  Lin-Manuel Miranda 一人編寫的音樂、歌詞與劇本讓這個作品受到了空前的好評，人氣

  更一路從外百老匯延燒至百老匯之中，在 2016 年的東尼獎上橫掃包括最佳音樂劇等 11

  項大獎成為最大贏家。


  《漢密爾頓》的大獲成功讓 Lin-Manuel Miranda 也逐漸的受到了劇場界以外的矚目，其

  中和迪士尼及展開長期的合作，包括替《STAR WARS：原力覺醒》與《海洋奇緣》等電影

  譜曲，更因為後者而入圍了奧斯卡的最佳原創歌曲。Lin-Manuel Miranda 在走紅的短短

  幾年內成為了入圍美國演藝界最高成就四大獎「EGOT」的演藝人員，更分別以《漢密爾頓

  》及替東尼獎創作的開場曲獲得葛萊美獎、東尼獎與艾美獎，目前只差一座奧斯卡就可以

  成為史上少數拿下 EGOT 大滿貫的演藝人員。


  而在 Lin-Manuel Miranda 逐漸的開始發展於電視及電影上的事業後，如今他也將執起導

  演筒帶來他生涯以來的第一部大螢幕導演處女作。


  Lin-Manuel Miranda 初次執導的電影理所當然為其所擅長的「音樂／歌舞」類型之作品

  ，而這次他即將挑戰改編外百老匯的音樂劇名作《倒數時刻》（Tick, Tick… Boom!），

  並由電視劇《性愛大師》編劇 Steven Levenson 執筆電影的改編劇本。


  《倒數時刻》為曾經創作過另一齣百老匯音樂劇名作《吉屋出租》東尼獎得主 Jonathan

  Larson 的代表作之一，由他一人同時編寫音樂、歌詞以及劇本。《倒數時刻》在 2001

  年於外百老匯首演，這齣音樂劇為 Jonathan Larson 的自傳性作品，內容描述一位住在

  紐約且懷有遠大抱負的音樂家 Jon 擔心著他是否會做出職涯的錯誤決擇。正在創作音樂

  劇《Superbia》的 Jon 希望這能夠成為美國下一齣偉大的音樂劇，並讓他帶來巨大的突

  破。然而 Jon 卻同時得面對來自女友 Susan 的壓力，Susan 已經厭倦為了他遠大的抱負

  而停滯不前。同時間，他最要好兼室友的 Michael 將為了另一個高薪的工作而必須搬離

  現在共租的房子。在 Jon 即將滿 30 歲的前夕，他為他的人生焦慮不安，思考著是否該

  為他夢想付出如此的代價。


  事實上，Lin-Manuel Miranda 在 2014 年曾經演出過《倒數時刻》的男主角 Jon。而這

  次他將同時擔任導演與製作人將這齣音樂劇搬上大螢幕，並且有強而有力的製作團隊為他

  撐腰。包括《美麗境界》的奧斯卡得主導演 Ron Howard 與他的老搭檔 Brian Grazer 以

  及另一位女製片 Julie Oh 都將擔任電影版《倒數時刻》的製作人。


  《倒數時刻》目前沒有任何演員人選，也不知 Lin-Manuel Miranda 是否有可能會自導自

  演的再次演出這個他曾經演出過的男主角 Jon。不過以年齡來說，即將年屆 40 歲的

  Lin-Manuel Miranda 對於演出此角是已經有些不適任。


  這次將以《倒數時刻》作為電影導演出道作的 Lin-Manuel Miranda 在新聞中表示：「強

  納生拉森透過《吉屋出租》迷人的敘事第一次的教會我音樂劇原來可以很現代、真實以及

  描繪自己的經歷。但是《倒數時刻》則是鞏固我身為劇作家並使用自己的聲音的動力。」

  從此可見 Jonathan Larson 對於 Lin-Manuel Miranda 的影響之深。


  《倒數時刻》目前檔期未定。


  Lin-Manuel Miranda 近來除了為《海洋奇緣》等電影創作音樂之外，他也參與了迪士尼

  經典真人電影名作《歡樂滿人間》續集《愛‧滿人間》的演出，在劇中他將飾演「點燈人

  」Jack，似乎是一個類似於第一集當中由 Dick Van Dyke 飾演之 Bert 的角色。而在年

  初於奧斯卡典禮同日公開的首支預告中已經可以看見由  Lin-Manuel Miranda 飾演之

  Jack 的角色造型，《愛‧滿人間》則將於年底 12 月 28 日於台灣上映。


  此外，Lin-Manuel Miranda 早期創作的另一齣曾經獲得過東尼獎的音樂劇《In the

  Heights》也已經確定將改編為電影，原本由溫斯坦影業製作發行的此作在因為醜聞公司

  破產後由華納兄弟以 5000 萬美元買下權利接手。《In the Heights》的改編電影將由《

  出神入化》的華裔導演朱浩偉執導，並由《魔鏡，魔鏡》的編劇 Marc Klein 執筆劇本，

  目前已經定檔 2020 年 6 月 26 日於美國上映。


  --'
