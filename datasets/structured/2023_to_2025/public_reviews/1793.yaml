url: https://www.ptt.cc/bbs/movie/M.1580803614.A.509.html
title: '[新聞] 迪士尼將把百老匯賣座音樂劇《漢彌爾頓》'
content: '迪士尼將把百老匯賣座音樂劇《漢彌爾頓》帶到大銀幕




  由林曼努爾米藍達（Lin-Manuel Miranda）創作及主演的音樂劇《漢彌爾頓》（Hamilton

  ）以結合 Hip-Hop、饒舌的表演方式將美國第一任財政部長亞歷山大漢彌爾頓（Alexande

  r Hamilton）的生平故事搬上舞台，不僅每一次演出都是座無虛席，更獲得了東尼獎、葛

  萊美獎、普立茲獎等許多獎項的肯定，而無緣親臨現場的觀眾朋友未來也將有機會可以在

  大銀幕上看到這部廣獲好評的作品。




  迪士尼影業在日前宣布，。



  對此，曾跟迪士尼有過幾次合作的林曼努爾米藍達表示，「我是看著《小美人魚》（Litt

  le Mermaid）、《美女與野獸》（Beauty and the Beast）、《阿拉丁》（Aladdin）等

  由霍華艾許曼（Howard Ashman）與艾倫曼肯（Alan Menken）這兩位傳奇人物合作的迪士

  尼作品長大的，我也因此愛上了用音樂來說故事的方式。我非常榮幸可以請到湯瑪斯凱爾

  來著手《漢彌爾頓》的錄製版本，。非常高興能與迪士尼合作，將《漢彌爾頓》的原始百老匯劇團盡可能呈現給更多的觀

  眾。」





  --'
