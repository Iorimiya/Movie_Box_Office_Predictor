url: https://www.ptt.cc/bbs/movie/M.1495106581.A.8B5.html
title: '[新聞] 《金剛》改編音樂劇　2018年秋百老匯上演'
content: '新聞網址：



  圖:


  澳洲製作公司「Global Creatures」在本週三宣布，他們將製作，預計2018年秋天在百老匯演出。


  據《好萊塢報導者》（The Hollywood Reporter）報導，劇中的「金剛」將由生物設計師

  桑尼蒂爾德斯（Sonny Tilders）打造，會結合機械動畫人偶（animatronic）與傳統戲偶

  的技術，就如同他在舞台劇版《馴龍高手》和《與恐龍冒險》中所做的一樣。


  馴龍高手人偶圖:


  劇本則會由傑克索恩（Jack Thorne）執筆，他曾以在倫敦西區劇院上演的《哈利波特：

  被詛咒的孩子》獲得2017年奧立佛獎最佳新戲獎，此外，他也寫過小說《血色童話》的改

  編話劇。


  配樂將由馬里烏斯德弗里斯（Marius de Vries）擔綱，他曾參與過電影《樂來越愛你》

  、《紅磨坊》與1996年版《羅密歐與茱麗葉》的製作。歌曲由艾迪伯費克特（Eddie

  Perfect）執筆，他曾為音樂劇版《陰間大法師》譜曲與填詞。導演則是奧利佛獎得獎者

  德魯麥克尼（Drew McOnie）。


  《金剛》在2013年就曾被改編成音樂劇，並於澳洲墨爾本麗晶劇院（Regent Theatre）首

  演。這次百老匯版本的演員卡司與售票細節在日後將陸續公布。


  --'
