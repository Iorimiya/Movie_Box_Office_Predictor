url: https://www.ptt.cc/bbs/movie/M.1472624572.A.022.html
title: '[新聞] 歐陽娣娣篡位《海角》音樂劇 范逸臣不認'
content: '歐陽娣娣篡位《海角》音樂劇 范逸臣不認愛田中千繪


  魏德聖執導的電影《海角七号》全台賣座5.3億元台幣，突破國片影史紀錄，該片將改編

  成音樂劇，明年首演。范逸臣8年前和女主角田中千繪傳假戲真做，日前他被爆在墾丁騎

  摩托車載妹，女生疑是田中千繪，2人昨異口同聲說：「私事不多談。」今年12歲的歐陽

  娣娣則將首度挑戰音樂劇，扮演「大大」。

  歐陽娣娣將演出《海角七号》音樂劇。

  小應哽咽吐低潮


  田中千繪非歌手出身，昨坦言「擔心歌聲會毀了這部音樂劇」，最近練歌練到崩潰做噩夢

  ，音樂劇日籍導演宮本亞門安慰她：「多練習應該沒問題。」讓她稍減壓力。

  應蔚民（小應）在《海》片飾演車行黑手「水蛙」打開知名度，卻染上酗酒惡習，還和老

  婆離婚。他昨哽咽透露，他的戶頭一度只剩3萬元，要付贍養費，卻沒新工作，坐吃山空

  ，前妻不讓他見兒女，與女兒1年多沒見面，低潮時每天狂抽1包菸，導致記憶力衰退，後

  來他為兒女戒菸戒酒，重回正軌。

  《海角七号》片中的老郵差茂伯5年前猝逝，同角色由出道前當過4年郵差的澎恰恰飾演，

  當年在片中飾演「大大」成名的童星麥子已是20歲女大生，改由歐陽娣娣詮釋，電影中的

  「大大媽」林曉培被換角，魏德聖昨解釋，因林曉培演出撞期才換人。





