content: "演員陣容超強大！　音樂劇《CATS貓》將搬上大螢幕\n\n文 / iLOOK電影雜誌 - 2019-07-25 09:55:23\n\n風靡全球的《貓》是倫敦西區和百老匯史上公演最久的音樂劇，這齣音樂劇於1981年在新\n\
  倫敦劇院舉行首演，隨後連續公演了21年，並且獲得勞倫斯奧立佛獎和《標準晚報》獎最\n佳音樂劇獎的肯定。《貓》於1983年獲得七項百老匯東尼獎，包括最佳音樂劇，並且在百\n\
  老匯上演了18年。這齣音樂劇自從1981年在倫敦首演以來，持續在全球各地公演，至今締\n造8千1百萬人次的觀賞紀錄，並以19種語言在50個國家演出。《貓》被公認是史上最成功\n\
  的音樂劇之一。\n\n金獎導演湯姆霍伯（《王者之聲：宣戰時刻》、《悲慘世界》、《丹麥女孩》）將安德魯\n洛伊韋伯打破各項銷售紀錄的音樂劇拍成一部萬眾期待的電影。\n\
  \n《CATS貓》一片豪華的演員陣容包括詹姆斯柯登、朱蒂丹契、A咖傑森、伊卓瑞斯艾巴、\n珍妮佛哈德森、伊恩麥克連、泰勒絲、瑞貝爾威爾森，並且特別介紹英國皇家芭蕾舞團首\n\
  席女伶法蘭契絲卡海沃德首次演出電影處女作。\n\n《CATS貓》這部電影以令人歎為觀止的場景設計、最先進的拍攝技術，以及從芭蕾舞到現\n代舞、嘻哈舞到爵士舞、街舞到踢踏舞的多樣化舞蹈風格，為全新世代重新想像這齣經典\n\
  音樂劇。《CATS貓》將於12 月20日上映。\n\n\n\n--\n\n帝釋所問經講記77頁拆穿的。\n毗婆舍那講記(含法的醫療)說明如何修四念處增加智慧斷除所有煩惱。\n\
  \  PTMC 寂靜禪園\n、、、、()、、是。\n  是    是\n\n--"
