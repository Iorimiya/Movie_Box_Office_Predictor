url: https://www.ptt.cc/bbs/movie/M.1487776215.A.40B.html
title: '[請益] 音樂電影和歌舞片'
content: '音樂電影和歌舞片


  一般來說音樂電影就是歌舞片


  像是火爆浪子是有史以來票房最高的歌舞片(音樂電影)


  媽媽咪啊也是歌舞片(音樂電影)


  可是像悲慘世界為什麼不能算是歌舞片(音樂電影)


  只能算是音樂劇電影


  再酒店那一段 他們也算有跳舞啊


  芝加哥 紅磨坊又是歌舞片又是音樂劇電影！


  到底音樂劇電影和歌舞片(音樂電影)的差別是在哪裡


  我一直以為在電影裡面唱很多歌的就是音樂劇電影就是歌舞片


  原來完全不一樣XD


  請問差別在哪裡XD


