url: https://www.ptt.cc/bbs/movie/M.1489752835.A.3C6.html
title: '[情報] 歌手尚恩曼德斯將主演《魔鬼剋星1984》導演執導音樂劇電影新'
content: '在好萊塢當中，我們看過能歌善舞的演員，也看過演技絕佳的歌手，在過往我們看到如

  Barbra Streisand、Cher 和 Bette Midler 等這些游刃有餘的遊走在影壇與樂壇的演員

  兼歌手，且都能夠在兩個領域中拿下極大的獎項殊榮與肯定。而在近年來，也有不少中、

  新生代的歌手跨足影壇，好比近期在《樂來越愛你》中我們看到了 John Legend、嘻哈天

  后 Rihanna 也入主女性版本《瞞天過海》的《Ocean''s Eight》女俠盜陣容中等。而如今

  也再有一位新生代歌也將轉戰影壇，也就是近兩年快速竄紅，且以＜Treat You Better＞

  等歌曲而廣為人知的 18 歲加拿大小鮮肉歌手 Shawn Mendes。


  而這次 Shawn Mendes 在影壇中初試啼聲的電影又會是哪一部呢？答案是由曾在 1984 年

  為觀眾帶來轟動影壇的《魔鬼剋星》之導演 Ivan Reitman 所執導的新作電影《Summer

  of Love》。在 Ivan Reitman 的電影生涯當中最為成功莫過於其執導的《魔鬼剋星》系

  列兩部電影，而在進入千禧年之後，Ivan Reitman 所執導的電影也隨之銳減，反而專注

  於製作人一職，其中包括成功推入奧斯卡最佳影片入圍名單的《型男飛行日誌》即出自其

  手。而在近期中 Ivan Reitman 所執導的電影則包括《我的超人女友》、《飯飯之交》與

  《超級選秀日》，在《超級選秀日》相隔四年之後，這一回導演也將重執導演筒帶來他的

  電影新作，並且將首次挑戰「音樂（Musical）」類型電影。


  《Summer of Love》的故事原案出自於導演 Ivan Reitman，而將劇本交給了《末日倒數

  怎麼伴？》編劇 Lorene Scafaria、《粉紅豹》編劇 Len Blum 與新人編劇 Shawn

  Wines 共同執筆。目前關於詳細的故事內容仍屬於保密階段，但根據 The Hollywood

  Reporter 的報導指出，劇情將會依據 1987 年夏天發生於舊金山海特－艾許伯里地區的

  反越戰的音樂活動作為故事背景。在當時這場活動多達十萬人參與，且多數皆為年輕的嬉

  皮人士，被視為當年北加州的標誌性音樂活動，其中包括 The Who、The Grateful Dead

  、The Animals、Jefferson Airplane、Jimi Hendrix、Janis Joplin 與 The Byrds 多

  組知名樂團與歌手皆參與其中。而目前《Summer of Love》則被設定成一部公路音樂電影

  。


  《Summer of Love》將由 Ivan Reitman 親任製作人，其創辦的製作公司 The

  Montecito Picture Company 也將會擔任此部電影的製作方。


  而目前在演員方面只公開 Shawn Mendes 將會擔任主演，且將會成為他的大螢幕出道作，

  在此之前他只在 2013 年時曾為動畫電影《足球小小將》配過音，並無其他電影演出經驗

  。這次轉戰大螢幕即挑戰其擅長的音樂類型電影，我們也期待他能夠交出一個表現傑出的

  電影處女秀。


  區隔。


  --'
