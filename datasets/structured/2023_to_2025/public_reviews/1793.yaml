url: https://www.ptt.cc/bbs/movie/M.1485101161.A.566.html
title: '[好雷] 52Hz我愛你,看了會開心的小品音樂劇'
content: "網頁圖文版 \n\n一開始不知道52HZ、鯨魚與貓在故事中的意義，還以為是名字是很老梗的520之類..(對\n不起書讀太少）。看完之後再查資料，原來背後有著浪漫元素（註一），解開了看片當\n\
  時的部分遲疑，又剛好\"赫茲\"是音頻單位，於是讓本片以音樂劇的型式呈現，片名也變\n得加分。\n\n很多人拿近期金球獎大贏家《樂來樂愛你》來比較，使得本片似乎拿了相對負評，但我還\n\
  沒看《樂》，無從比起，也不想比，就以國片的角度來評吧：\n\n音樂劇本來就很難把唱、不唱的分際算到精準，故事又連貫，原本應該至少會拿4分，後\n來決定扣下的0.5分在於音樂本身....，有些轉折處聽起來略似硬凹，反而讓人無法入戲\n\
  。（但個人很喜歡\"開門關門\"的副歌）\n\n \n\n１小安的房子。\n在外面租房子的朋友，大概能理解這樣\"美\"的頂加有多難找，當然我們會說這是電影特\n\
  別搭出來的場景，怎麼可能差？但是我認為頂加有它象徵的城市意義（尤其是在台北討\n生活的冰友，你懂），劇組應該是故意去找這間能拍到\"側面\"的房子，讓小安邊唱邊下\n\
  樓時，照美不誤。\n\n２小心花店。\n最美的畫面是在：小心開車轉進花店那條街道時，貓的存在，以及像童話一\n般的背景。（不是這張圖，得進戲院看）雖然看得出特效穿梭其間，但卻很成功地延續了\n\
  自片頭而起的\"故事性\"。\n\n想起片頭的佈局，淡水河邊、橋、色彩繽紛的花、人們的穿著、情人節，很明顯是把舞台\n劇搬至電影，告訴觀眾：嘿，準備好了嗎，我將要說一段關於愛的故事囉，是一段演員等\n\
  於旁白的開場；整個畫面的用色和層次感，就像是你正在翻開故事書，彩色繪本的那一種\n。\n\n３大河的樂器行。\n很喜歡半地下室+街景的設計，鏡頭由側面進入到大河的生活，可惜我只找到雨天版的畫\n\
  面，在電影裡有晴天的角度，文青的令人印象深刻，個人私以為這種建築也是劇組想加\n入台灣特色而挑過的。\n\n\n\n既然是音樂劇，用樂器來串場是非常合理的，不僅是劇中主角都會彈吉他，是音樂人，魏\n\
  導也把自己過去作品《海角七號》的梗拿出來戲謔一番，埋了很多自然的笑點在戲裡，使\n人會心一笑。（最愛橋段：Ｘ你媽的台北....為....甚....麼....我....不....敢....摔\n\
  ....吉....他）\n\n以及用「少一條弦」的吉他來象徵「愛情並不完美，但你跟你的另一半就是彼此的獨一無\n二」，激賞這個比喻。\n\n\n\n在片頭，老人與小心說：「小姐，別太天真了，愛情是需要麵包來養的。」還沒有經歷愛\n\
  情的小心不亦為然的回嘴，但我們從蕾蕾的故事看到了糾結，現實的壓力有時就像歌詞「\n不是愛不到，而是愛不起。」\n\n在這part，魏導找來一大批騎著機車追蕾蕾的各種過來人們，是我大大大大大加分的一段\n\
  ，手法是舞台劇，但畫面得在電影才辦的到，同時，龐大機車族也是台灣特色之一，台灣\n人應該很容易理解他們為甚麼和\"麵包\"有關。\n\n\n\n張榕容出場真的讓我驚艷，超級無敵帥翻！本片最佳男主角我頒給她！雖然官方主海報選\n\
  定的是四人主角版，但我！即\n使戲份占得不多，但每個有她們的畫面，可以感受到倆人愛得有多開心、多堅定，也是片\n中少數需要雙人舞的默契，表現相當亮眼。\n\n\n\
  \n如前面提到，自嘲有時不失為梗，但too much，反而很難笑....，片尾的餐廳戲碼，到蕾\n蕾離場後，感覺就像是硬湊的，目的是為了要讓\"大家\"都能入鏡而設定的場景...，直到\n\
  跑字幕演唱的「大世界小世界」都只是在湊秒數。\n\n\n撇開順不順的問題，還有兩個vocal一直讓人出戲...。（大家自由心證，不做人身攻擊）\n希望在音樂的部分多參考一下\
  \ High School Musical 跟 Pitch Perfect 怎麼佈。\n\n\n恩....看片前總覺得看完預告，接收到兩個無形的指令：１故事好像也看完了，２提不起\n\
  勁去戲院。因此有點擔心這部片最後敗在預告，希望這篇文章能為你平反。（有嗎？希望\n有啦）\n\n其它：做電影很不容易，在台灣做電影更是；做電影的人不容易，在台灣做電影的人更是\n\
  。\n\n橫批：予以支持，還是說一聲加油。\n\n（註一）根據維基百科，52赫茲鯨魚（52-hertz whale）活動於太平洋，其叫聲頻率比起\n任何已知品種的鯨魚都高很多，因此科學家認為其它鯨魚無法接收得到，亦稱牠為「世界\n\
  上最寂寞的鯨魚」（The world's loneliest whale）\n\n--\n用心體察生活‧訓練獨立思考\n\n\n--"
