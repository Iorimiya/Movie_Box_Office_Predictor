title: '[微好雷]52Hz 我期待著更多的音樂劇 '
content: "沒看過lalaland~ 但是一直深愛著「如果.愛」的我\n\n一直都對這個類型的電影非常注意\n\n下面直接條列式心得：\n\n----------------------------------\n\
  1.劇情：\n        想要交代太多東西..\n        本身就是個簡單的劇情，可是因為想要增加厚實度，加上太多「豐盛」\n\n        我是覺得可以少點支線（包含兩位老人），把重點放在四位主角身上\n\
  \        這樣有更多的運作空間，也可以更仔細的交待劇情..\n\n\n2.音樂：\n        觀看時，會有一種音樂跟嘴型、表情有些微不同步（我想是因為預錄吧！？）\n\
  \        （於是就變成有人說的，演技問題，這點在張蓉蓉身上沒出現）\n\n        不過我倒是覺得音樂都很棒！配合的情境、畫面，能知道導演想放入很多東西\n\
  \n        一開場就讓我驚訝！（挖！這畫面、這歌曲、這動作...)\n\n        最印象深刻的除了幾首主打外..\n        倒覺得最勇敢、厲害的嘗試是蕾蕾的摩拖車之歌「愛情卡債」\n\
  \        摩托車都變美了XDDD\n\n        太陽雨的畫面對「Singing In The Rain」致敬致很大\n        我倒是覺得，都已經號稱台灣首部，還這樣致敬有點太「厚」\n\
  \n3.演員：\n        其實我非常認同「找會唱歌的來演」（就像找會打棒球的來演一樣）\n        張力不同（當然演技也頂多算及格）\n    \
  \    沒看「如果愛」張學友也是壓著周迅、金城武阿\n\n        看完電影後我開始google 米菲、小球、小玉\n\n        米菲一出場，我女友就說：這聲音好棒喔\n\
  \n\n4.現場好超級多：\n        剛剛提到，畫面跟表情不同步的問題...youtube上有四位歌手現場版\n        我覺得歌手果然就是要現場..比起電影的表現（歌曲感情、唱歌表情）好太多\n\
  \n5.期待出音樂舞台劇：\n        看完後我認真的覺得，也許以「一部電影」來說，我甚至更愛KANO / 賽德克\n\n        不過場景、歌手、音樂（帶歌詞）..\n\
  \        超級適合轉換成音樂劇阿...以音樂劇的規模，劇情就可以精簡\n        背景做成舞台也沒太多難度..\n\n        重點是歌曲好聽、又有「沈浸」感，還可以交待劇情\n\
  \n6.看完後\n        跑馬燈上後，我女友對我說「蛤？沒了？」\n\n        我想原因有兩點：\n        1.劇情總有感覺「沒交代完」：為什麼大河的部份就這樣了？\n\
  \        2.沈浸感非常高：110分鐘，在每一首不間斷的歌曲中，開心、舒適的過去了\n          觀看者不會意識到原來時間已經飛快流走\n\n\
  7.關於愛情：\n        跟朋友聊到，處在不同的愛情過程中，看電影時「注意到的歌曲」完全不同\n        有人會注意到「開門關門」的自我審視\n\
  \        像我就注意到「愛情卡債」（笑\n        也有人不同意「十年」的青春\n\n        嚴格說起來是「你會有些橋段心有戚戚，但是也覺得有些橋段多餘」\n\
  \        可是那些多餘的部份，剛好就是別人的愛情\n\n8.要不要去看：\n        如果你對於劇情小品可接受，那就開心的去享受兩小時的音樂饗宴吧\n\
  \        基本上要我二刷是ok的！\n\n        可是我更想要看音樂舞台劇阿！（認真無誤\n\n--"
