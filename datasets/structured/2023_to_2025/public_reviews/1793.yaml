url: https://www.ptt.cc/bbs/movie/M.1425140963.A.D6C.html
title: '[普雷] 拜訪森林 電影(雷) VS 音樂劇(雷)'
content: "先聲明，個人不算是音樂劇的專家，\n\n評論只能算是參考\n\n-------------------------------沒看過音樂劇的請慎入....\n\
  \n\n\n\n\n\n\n\n\n1.個人還是喜歡音樂劇1991年的的版本，記得高中時音樂老師播的時候，\n\n  許多同學都在討論女巫(Bernadette\
  \ Peters飾)的胸部...\n\n2.刪掉有一個真的旁白在旁邊講可以理解，\n\n  但是又覺得少了旁白真的差很多\n\n3.王子也少了一段有點不爽...這音樂劇後半段就是要看兩個王子都不可靠\n\
  \n4.長髮公主沒死掉(音樂劇是死掉的)比較難進入女巫的悲傷心靈，\n\n  女巫唱 last midnight的情緒會有更感嘆更嘲諷的感覺\n\n5.爸爸跟麵包師傅唱No\
  \ More也被刪掉...好慘，\n\n  這邊我看音樂劇看好幾次都好想哭...結果刪了\n\n6.爸爸其實前面也有幫忙...被刪其實還好(但是真的要刪成這樣...)\n\
  \n7.大合唱為什麼不學悲慘世界大家一起出來唱(還可以跳舞)...又刪了\n\n8.It Takes Two這邊混音真的被混糟了...\n\n9.麵包娘聲音可以再厚一點\n\
  \n  （不知道麵包夫婦的歌是不是都被混音混爛了...）\n\n10.強尼戴普依舊頗具特色\n\n11.不得不說小紅帽跟跟傑克選得真好\n\n12.梅姨的演技依舊厲害，\n\
  \n  (其實我覺得可以找原唱Bernadette Peters來演...她也才比梅姨大一歲而已)\n\n\n\n\n\n\n\n\n\n\n--"
