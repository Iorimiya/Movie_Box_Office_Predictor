title: '[討論] 休傑克曼的金鋼狼跟音樂劇哪個有名?'
content: '如提


  從X-men看休傑克曼的金鋼狼  一直看到羅根


  基本上金鋼狼=休傑克曼幾乎快畫上等號了



  但休傑克曼本身也有不少音樂劇電影


  例如  悲慘世界  大娛樂家


  我覺得也不錯



  但平心而論  兩者風格差異滿大的


  至少你不會在音樂劇裡面看到金鋼狼的身影xd


  大家覺得  一想到休傑克曼


  大家會想到他的音樂劇  還是  金鋼狼


  --'
