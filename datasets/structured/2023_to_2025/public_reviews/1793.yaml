title: '[好雷] 瘋狂理髮師-它是音樂劇!!'
content: '希望有人注意到我的標題


  因為今天我散場時


  果然看到了一張張疑惑的臉 臉上就寫著


  "怎麼會是一直唱歌的電影???"


  當時我看預告時就有點擔心 因為歌唱的部份不多


  在國外理髮師陶德算是家喻戶曉 所以不用特別註明


  總之希望大家看之前注意這是音樂劇就對了~



  ====================下面有雷=======================================




  劇情我就不多囉唆 反正上網都搜尋得到 因為我是看過音樂劇版本才去看的


  看到螢幕上帥了一百倍的Todd真是超HIGH


  字幕翻譯比起我家裡那張演唱會DVD實在是好一萬倍


  但是因為礙於電影的表現方式 有不少歌被刪掉了 有點可惜


  因為我非常喜歡他們開頭的那首驚悚合唱 同時也是劇情過場的歌


  還有法官自覺愛上喬安娜的自白 自責的鞭打自己同時又無法忍受對喬安娜的愛


  讓法官變得比較像....無道德的老頭...


  不過同時也刪掉一些平常我聽的時候常常會跳過的歌


  (喬安娜水手的合唱等)



  以劇情來講 之前我看音樂劇版時就覺得


  Sweeney這傢伙真是有史以來最不解風情的角色阿!!


  而電影更是完全凸顯這點 不管Mrs.lovett怎麼對他示好 對他多溫柔


  Sweeney還是一臉大便(電影真的是這樣...)


  不過也可以說是Sweeney一心只愛Lucy 對其他女人沒興趣吧!



  跟音樂劇比對我來說最大的差別 就是Mrs.Lovett跟Tobias的關係


  音樂劇裡面是真正的母子 電影把他改成只是收留他


  會這樣改也是可以理解 想當初我看到Mrs.Lovett要殺了Tobias那裡


  心中超震驚的!!誰說虎毒不食子!!



  開頭刪了合唱 結尾當然也一起刪 所以結局是結束在Sweeney被Tobias殺掉那裏


  這樣的結局讓人看的真的超心酸的 而且電影很明顯的演出


  Sweeney是自願被Tobias殺掉的 最後鮮血像是瀑布般流洩在Lucy臉上


  真的讓人心跟著沉到谷底



  接著說一下演員 Johnny Depp你真是太帥了...


  原諒我發個花痴 因為真的從頭帥到尾


  我這個人有個怪癖 特別愛看帥哥臉上沾血的樣子XD


  這部電影真是滿足我的慾望阿!


  好啦!回歸正題 其實他的聲音真的不差 當然跟真正靠唱歌吃飯的不一樣


  但是非常適合Sweeney這個腳色 不過電影的Sweeney跟音樂劇的個性有小小差別


  音樂劇的給我感覺看起來比較瘋狂 比較奸詐


  Johnny的則是一直都沉浸在痛苦中 連快樂的時候感覺都很痛苦



  不過老實說 Sweeney這個腳色講英國腔又有黑眼圈


  常常會讓我有種Jack Sparrow沒退駕的感覺


  當然跟三三八八又娘的船長比 Sweeney要深沉多了 也不像船長那樣忠實於及時行樂


  但是實在是讓人很難不去聯想


  當然他靠著演技 他還是會演出差異性


  把時而瘋狂 時而鬱悶 時而憤怒的Sweeney演的非常出色





  再來當然得說說Mrs.Lovett  Helena Bonham Carter


  她也是非常適合這個腳色 尤其是那種陰沉的氣質非常適合整部電影


  但是歌聲就沒有那麼滿意了 如果說沒聽過音樂劇的情形


  可能我會覺得她唱的非常好 可惜我聽過了Patti LuPone那種嘹亮又富含趣味的歌聲


  就顯得有點柔弱 但是並不會減少這部電影的可聽性


  整體來說她唱的還是蠻出色的



  至於我們的Judge Turpin....Alan Rickman


  因為他的聲音實在是太好聽了 想當初我還曾經為了想聽他講話重租很難死


  但是期望過高 就有點失望 其實唱的不過不失啦! 畢竟是科班出身的


  這部戲的法官雖然比較好色老頭的樣子


  但是Alan Rickman當然會賜與這個腳色該有的深度 尤其是那些跟水手"聊天"的戲


  真是張力十足 看了實在是蠻過癮的!!



  至於水手本人 歌聲...老實說我沒啥印象...我只覺得他長的好像蜜拉喬娃維奇


  每次他一出現我就忍不住做詭異的聯想


  然後女兒長得像泣八點檔的我一定要成功裡面的張美金


  原諒我的胡思亂想 原始版本我就不太喜歡這兩個腳色 (因為我是反派控啊( ′-`)y-～)



  Tobias音樂劇裡感覺是個弱智 但是電影版改成真的只是個孩子


  最後面殺了Sweeney的戲表現的很好 但是前面只要一開始唱歌


  臉上就會浮現一點無所適從的感覺 有點可惜 然而歌聲蠻自然的 多少有點加分



  我不得不提一下戲份很少的Signor Pirelli--Sacha Baron Cohen


  雖然很快就領便當了 但是他演得還蠻好的


  那口奇怪的義大利口音也算是劇情需要 所以演得恰到好處


  而踹Tobias那裡 也真的讓我有一把火上來的感覺


  最讓我詫異的 大概就是他講英國腔


  我知道這個聽起來很蠢 因為他本來就是英國人


  但是我只看過他的芭樂特阿!!!聽到如此漂亮的英國腔從他嘴裡流出


  超不習慣的!!!!




  最後我想提醒大家 這部電影灑血灑的非常有誠意


  直逼Kill Bill那種不用錢般的灑


  所以要是跟包龍星一樣看到血會頭昏 那最好多多考慮


  還有要是連看髮膠明星夢都會覺得無聊的人


  那我想你大概不適合看音樂劇 我今天就發現不少人看到一半就坐不太住了


  所以這種人也不推薦 你看完只會覺得浪費兩百六



  要是你跟我一樣 喜歡Tim Burton  Johnny Depp  Alan Rickman


  又喜歡Stephen Sondheim的音樂 又愛看音樂劇的話 那快點掏錢去電影院吧!!


  國賓現在在大廳上喔!!





  喔~順帶一提 雖然我批了一堆人唱歌 但是我還是敗了OST....

  --


  WHY SO SERIOUS??


  Let''s put a smile on that face!


  Ha~ha~hA~aA~Hh~Ha~ah~hAAAAHAHHhahahh......


