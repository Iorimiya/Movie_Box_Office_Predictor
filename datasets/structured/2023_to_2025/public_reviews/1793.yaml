url: https://www.ptt.cc/bbs/movie/M.1498658365.A.789.html
title: '[討論] 休傑克曼主演音樂劇電影《大娛樂家》預告'
content: '「每一分鐘都有一個傻瓜誕生，然而每一個傻瓜都是世界上最獨一無二的稀世珍寶！」


  「金鋼狼」休傑克曼(Hugh Jackman) 這回在全新電影《大娛樂家》 (The Greatest

  Showman)不當超級英雄，而是重拾唱跳好本領再戰歌舞片，詮釋美國馬戲團始祖P.T. 巴納

  姆 (P.T. Barnum)的生涯傳奇故事！


  暌違五年再次出演音樂劇電影的休傑克曼，在年初時因皮膚癌復發不得以向劇組告假進行

  了手術。不過這位百老匯之王，在手術結束後沒多久便迫不及待的重新回歸《大娛樂家》

  劇組，而當他在彩排時聽見琪雅拉賽特爾開口演唱電影新曲，因為這個極具穿透力與感染

  力的歌曲及歌聲，讓他在現場直接將醫生千交代萬交代必須要休養的叮嚀與囑咐拋諸腦外

  ，情緒激動的直接起身加入演唱，甚至一度唱到眼眶溢滿了淚水。可以感受到即便是這位

  縱身戲劇超越20年的超級男神，也抵擋不了對於這部電影的熱愛與超強魅力！


  《大娛樂家》為導演麥可格雷希(Michael Gracey)指導的首部長片電影，故事以19世紀馬

  戲團創始人P.T. 巴納姆的傳奇一生為背景。巴納姆在一次意外之中他失去了他的工作，

  為了自己心愛的女人與家庭，他決心建立一個全世界最快樂的地方。這個原先窮困潦倒的

  無名小卒，集結了在當時被視為「異類」的人類，例如只有60公分高的侏儒，以及暹羅連

  體嬰雙胞胎，這些人的不一樣在別人眼中為「不完美」與「瑕疵」的化身，但在巴納姆眼

  裡，卻是難能可貴的禮物！集結了來自世界各地不一樣的驚喜，這位馬戲湍之父最終打造

  了這個「有史以來最棒的表演」。


  除了由休傑克曼領銜主演外，卡司陣容包括能跳能唱的柴克艾弗隆(Zac Efron)、 蜜雪兒

  威廉絲(Michelle Williams)、蕾貝卡弗格森(Rebecca Ferguson)以及百老匯出身的硬底

  子女歌手琪雅拉賽特爾(Keala Settle)。值得一提的是，今年在奧斯卡獲獎無數的《樂來

  越愛你》，其幕後音樂團隊更是罕見以原班人馬出動為這部超世紀大秀量身打造了超過10

  首原創歌曲，期盼再帶來歌舞劇旋風！電影12月22日上映







  --'
