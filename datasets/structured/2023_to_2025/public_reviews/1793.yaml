url: https://www.ptt.cc/bbs/movie/M.1549078332.A.BF4.html
title: '[片單] 求音樂劇推薦'
content: '1. 請簡述自身需求片單理由 或 欲尋找電影的類型或特徵（請盡量描述清楚）



  各位好電影板前輩們好，年假有空想補看幾部舊電影，

  本身最愛的是近期的音樂劇（或是中間穿插大量歌曲的電影），

  要片中歌曲有歌詞可以跟著唱的，不是純音樂而已。


  盡量希望是Happy Ending的片，沉悶的我啃不下去，

  但劇情、拍攝手法如果不錯也能接受，

  如La La Land、A Star Is Born 我第一次看都打瞌睡，

  但歌曲、演員表現、美術風格和拍攝手法的部分都喜歡所以會回頭看二次。


  通常PTT板友的口味都跟自己滿合的，

  希望各位能幫我推薦一下片單，



  2. 已知符合需求的電影或偏好的電影類型（為避免重複推文，請至少列舉一部）


  1.《真善美》The Sound of Music (1965)：觀看次數5以上


  2.《紅磨坊》Moulin Rouge (2001)：觀看次數3


  3.《歌劇魅影 》The Phantom of the Opera (2004)：觀看次數1


  4.《髮膠明星夢》Hairspray (2007)： 觀看次數1


  5.《媽媽咪呀！》Mamma Mia! (2008)：觀看次數：10以上，難以計算


  6.《悲慘世界》Les Misérables (2012)：觀看次數5以上


  7.《曼哈頓戀習曲》Begin Again (2013)：觀看次數3以上


  8.《樂來越愛你》La La Land (2016)：觀看次數3以上


  9.《大娛樂家》 The Greatest Showman (2017)：觀看次數5以上


  10.《媽媽咪呀！2》Mamma Mia! Here We Go Again (2018)：觀看次數：3以上


  11.《一個巨星的誕生 》A Star Is Born (2018)：觀看次數2




  3. 不喜歡的電影類型            （不需要板友推薦的電影片名）



  《歌喉讚》：這種就是即使歌好聽我也無法看的類型，劇情真的太陽春…




  先在這邊感謝各位。


  --

  慢一點，讓童年的勇氣追上你。




  --


  補充一下好了，我是迪士尼/皮克斯鐵桿粉，

  像可可夜總會看了超過5次，當初冰雪奇緣也是，

  所以迪士尼/皮克斯系列的我都沒有列，曼哈頓奇緣我看了5次以上！ XD'
