url: https://www.ptt.cc/bbs/movie/M.1705433077.A.9F8.html
title: '[新聞] 新版《辣妹過招》為何不強調是音樂劇？'
content: '新版《辣妹過招》為何不強調是音樂劇？派拉蒙：觀眾可能會失去興趣


  Yahoo奇摩電影戲劇編輯部


  2024年1月17日 週三 上午2:29




  《辣妹過招》（圖：Paramount）


  1. 新版《辣妹過招》既非續集，也不是重拍。


  2. 電影其實改編自2017年同名百老匯歌舞劇。


  3. 片商宣傳時卻避而不談，讓觀眾大感錯愕。


  【文／血紅蘭姆】


  觀眾往往在買票進場之後，這才赫然發現新版《》原來竟是一齣音樂劇，而派拉

  蒙解釋道，這麼做其實是別有用心。


  在2004年原版《》問世二十年之後，片商又請回原版編劇蒂娜費再次執筆，她和

  提姆麥道斯等原始卡司也回鍋亮相，由漫威《蜘蛛人》系列女星安格利萊斯領銜主演，再

  次勾勒出新世代少女的青春校園成長故事。


  不過這部新片既非續集、嚴格說起來也不算重拍，而是改編自2017年同名百老匯音樂劇，

  音樂劇本身則是改編自2004年原版電影，因此新片也大量用上了音樂劇歌曲，電影宣傳卻

  幾乎對此隻字不提，讓觀眾在買票進場之後才錯愕不已。




  《辣妹過招》（圖：Paramount）


  派拉蒙全球行銷總裁馬克溫斯塔克（Marc Weinstock）向綜藝報解釋道，他們是刻意沒有

  在宣傳上主打片中的歌舞元素：


  「如果一開始就大提音樂劇一事，可能就會讓觀眾失去興趣。我希望每個人都能同樣對本

  片感到興奮。」


  「我們不想公開提起這是一部音樂劇，因為人們通常都用不同的方式來對待音樂劇。本片

  是一部含有音樂的廣泛喜劇。沒錯，它可以被視為一部音樂劇，但它也吸引到更廣大的觀

  眾族群。」


  他指出，這種作法在好萊塢其實很常見：


  「你在《》或《》的預告中也可以看到，它們同樣對音樂劇避而不談。我

  們在片名中有放上一個音符記號，所以有對此略微暗示，但避免太過突顯。」


  提到本片標語「這不是你母親的《辣妹過招》」，他則坦承：「人們對此有所誤會而深受

  冒犯。我們其實想說本片會是全新詮釋，人們卻只看到字面涵義：『這是什麼意思？我可

  不是個母親。』我們捨棄了這個標語，改用：『由蒂娜費交出的全新詮釋。』那便是她的

  視野，實在棒透了。」


  「本片主攻兩大觀眾族群：一者是從小看原版《辣妹過招》長大的觀眾，另一者則非。在

  10月3號《辣妹過招》日，我們在TikTok放上了整部原版電影，分成二十三支短片。不是

  粉絲的人們開始觀賞本片，然後說：『等一等，這是部很棒的電影。』他們立刻就熟悉起

  這個世界。」


  至於本片的行銷策略又有沒有參考《》呢？


  「那是年度最佳行銷，宣傳起來鋪天蓋地，而我們也試著如法炮製，要讓它無所不在。當

  人們跑來跟我說：『它每兩秒鐘便出現在我的社群動態上。』這就讓我感到很興奮。」


  《》現正在美國熱映中。




  新聞網址：











  --'
