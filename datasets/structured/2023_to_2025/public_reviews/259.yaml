title: '[情報] 席維斯史特龍《終極警報》電影預告'
content: '傳奇動作巨星 主演


  《》團隊火爆動作鉅獻


  《》6月27日(五) 全台上映




  當他們從特務變成獵物——



  上映戲院：




  電影預告：





  《》製片團隊打造火爆動作鉅片


  《》動作團隊再創熱血動作場面


  《》傳奇動作巨星領銜主演


  兩名間諜背叛各自的組織、結了婚、退隱江湖，卻在偏僻的藏身處遭到攻擊，各地的情報

  機構都在尋找一個隨身碟，這個隨身碟屬於一個名為「警鐘」的組織，傳說裡頭的資料能

  摧毀全球情報單位…。


  --


  還真的欸 好屌'
