title: '[好雷] 愛愛愛上你  看了心情好'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  《愛愛愛上你》的故事發想於

  莎劇的Much Ado About Nothing

  是個想當然爾的王道劇情路線，

  但是誠意十足毫不敷衍！


  男女主角火花強電力十足，

  男帥女美身材養眼，服裝也好看

  配角們各有可愛的小個性，

  劇情也有很多小笑點

  還有澳洲美麗的風光


  音樂與歌曲很配合劇情，

  歌都很好聽


  整部電影看完，

  真的會讓人嘴角上揚的走出影廳

  （IG上有好些看完跟朋友跳著舞出來的）

  可以了解這部電影在北美的票房表現，

  一開始還一般，

  等口碑出來後，

  好幾天都拿到北美票房冠軍呢！


  不管是一個人去看，

  或者是跟親友一起，

  或者是情侶約會，

  都非常推薦


  在威秀看還有送特製春聯XDD





  -----

  Sent from JPTT on my Samsung SM-S9160.


  --


  席德妮史威尼又辣又可愛



  沒錯沒錯，

  輕鬆愉快又小溫馨，

  也很適合過年時跟親友一起看



  音樂好聽，

  而且都很恰如其分地烘托劇情，

  有的電影插入歌曲太多太吵會喧賓奪主呢



  席德妮史威尼和格倫鮑威爾帥美而且健美又sweet，

  而且不是那種aggressive的，

  是男女都會喜歡的類型喔



  從中文片名到宣傳口號，

  其實都讓人有點尷尬，搞不好還嚇退一些觀眾XDD

  在北美宣傳沒這麼誇張露骨啊



  嗨嗨，djmay大 (招手

  沒錯沒錯，這部並沒有只服務男性觀眾或是女性觀眾，

  而是男女都有照顧到，

  男女都會看得開心的輕鬆愉快的愛情喜劇 ^^



  推薦推薦



  春聯上的字一個是 發 ，一個是 春 XDD



  DareJ大是指在電影中嗎？

  電影中的露點(?)都是一閃而過而已，

  跟朋友看也不會尷尬 (應該啦



  熱唱unwriten超嗨，都忍不住一起唱了


  啊，如果是在威秀看的，

  拿票根應該還可以跟櫃台補領春聯，

  可以問問看喔'
