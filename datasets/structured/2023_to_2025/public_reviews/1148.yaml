title: '[普雷] 愛愛愛上你'
content: '雷文防雷資訊頁








  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  整體而言是一部非常chill的愛情喜劇

  劇情演技都普通

  對角色沒特別詳細交代

  就是淺淺的看過去的感覺~

  主要看點就是男女角的好身材而已


  如果帶腦看就會跟我一樣陷入很多問號裡

  像是我就不是很懂女主角爸媽為什麼沒經女主角同意就帶她前男友參加活動

  她前男友還真的來了

  這邊真的看得超莫名其妙，感想就是有夠硬要的


  然後男主角最後故意跳海，找直升機救援

  哈囉，這是公然示範如何濫用社會資源嗎？

  也太教壞小朋友了吧哈哈


  總而言之強烈建議不要帶腦看

  就讓它船過水無痕，美好的記憶就留在那段逝去的時光就好


  --

  笑死對 不能帶腦看

  再檢查看看吧?感覺不太合理'
