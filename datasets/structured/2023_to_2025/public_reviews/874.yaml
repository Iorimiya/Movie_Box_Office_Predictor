url: https://www.ptt.cc/bbs/movie/M.1721314915.A.164.html
title: '[情報] 何超儀 恐怖鬼片《怨泊》 電影預告'
content: "恐怖鬼片《》今夏迎接鬼門開！\n\n綑綁、虐待、亂倫 尺度太大\n\n海報太恐怖在港被禁！\n\n\n\n適逢農曆鬼門開，由 領銜主演的全新恐怖鬼片《》即將挑戰台灣觀眾的恐懼\n\
  極限！\n\n《》特別邀請日本恐怖片名導，將經典 J-Horror 結合港片風味，創造前所\n未有、讓人毛骨悚然的闇黑邪典！\n\n 恐怖片《》不僅充斥駭人的恐怖情節，更有謀殺、綑綁、虐待、亂倫等重口味劇情\n\
  ，其尺度由海報可見一斑，在香港釋出的海報中可見何超儀身著血紅和服、被綑綁倒吊，\n在當地以「過度恐怖」的理由 被禁止於戲院和戶外張貼宣傳，讓何超儀不禁喊冤「拍恐\n\
  怖片不能太恐怖」，解釋團隊在海報上下了很多功夫，拍攝當天威牙組和武術指導都在一\n旁待命，並表示這是自己生涯中拍過最精緻、恐怖的電影海報。\n\n\n\n《》8月2日全台上映\n\
  \n香港電影金像獎最佳女配角領銜主演\n\n「日活女王」共同演出\n\n遠赴東京拍攝，重現J-Horror最深恐懼\n\n莎拉（飾）與男友分手後，來到東京散心，兼欲收購房地產，卻碰到美國總統突\n\
  然到訪東京，導致原訂的旅館爆滿。\n\n房地產中介尚恩（ 飾）建議她暫居於一位老婦人（ 飾）經營的一間十分\n破舊的民宿。\n\n莎拉在那裡的第一個晚上便感到非常不安、焦慮和害怕，到第二天更生起了病來，無奈之\n\
  餘只能留下，沒想到因此讓她發現了一具正在被寄生蟲吞噬的完整人體骸骨。\n\n警察小山田於是接手調查，竟發現這家民宿牽涉\n多宗連環離奇房客失踪案件…\n\n#車庫娛樂\
  \ \n\n資料來源：\n\n--"
