title: '[情報] 何超儀《怨泊》 上映戲院列表公開！ '
content: "鬼門開首選！\n\n農曆七月，最恐怖民宿迎鬼門開！\n\n《》 ！\n\n8月2日 ( 週五 ) 歡迎入住\n\n\n\n這間民宿，不只有我們…\n\
  \n\n\n\n《》8/2 (五) 全台上映\n\n電影預告：\n\n\n\n上映戲院：\n\n\n\n香港電影金像獎最佳女配角  領銜主演\n\n 「日活女王」共同演出\n\
  \n遠赴東京拍攝，重現 J-Horror最深恐懼\n\n\n\n莎拉（ 飾）與男友分手後，來到東京散心，兼欲收購房地產，卻碰到美國總統突\n然到訪東京，導致原訂的旅館爆滿。\n\
  \n房地產中介尚恩（ 飾）建議她暫居於一位老婦人（ 飾）經營的一間十分\n破舊的民宿。\n\n莎拉在那裡的第一個晚上便感到非常不安、焦慮和害怕，到第二天更生起了病來，無奈之\n\
  餘只能留下，沒想到因此讓她發現了一具正在被寄生蟲吞噬的完整人體骸骨。\n\n警察小山田於是接手調查，竟發現這家民宿牽涉多宗連環離奇房客失踪案件…。\n\n\n\
  \ #車庫娛樂\n\n資料來源：\n\n--"
