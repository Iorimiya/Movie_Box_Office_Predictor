url: https://www.ptt.cc/bbs/movie/M.1722740708.A.477.html
title: '[ 好雷] 絕命逃生'
content: '這部單純就是為了模範計程車男主去看的OAO

  整部片前面有三分之二段，壓迫和窒息感非常重

  只能說導演拍的手法相當厲害，但我又說不上來哈哈
















  絕地逃生 劇情我覺得四平八穩

  裡面沒有什麼特別的南北韓政治因素

  用很平穩方式去闡述

  一個年輕人在已經沒有了家庭的包伏後

  一心嚮往著前去勇闖自己心中的天堂

  縱使是失敗，那我還可以再繼續接受失敗

  因為當失敗累積的多了

  我相信一定會洗滯出，並走向那條通往成功的道路


  看完後沒什麼大在乎的感覺~

  很小眾小品等級的電影，評分我給：60

  若是也喜愛模範計程車的男主-李帝勳

  可以去戲院支持一下票房



  我對於片中的疑問：

  反派李少校回北韓會不會被槍決(?

  畢竟讓一個逃兵成功脫逃至南韓

  但他岳父又是圈內一線高官，不知能不能保住他


  --'
