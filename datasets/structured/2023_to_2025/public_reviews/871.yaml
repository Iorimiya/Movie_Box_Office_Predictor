url: https://www.ptt.cc/bbs/movie/M.1723020718.A.235.html
title: '[ 普雷]  絕地逃生'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  影帝的演技也撐不起這普通的劇本

  這部能吐槽的點真的太多了

  隨便舉幾個


  劇情中最雷的就是男主小跟班

  一開始男主會被抓也是他在雷

  跟他說叫他等明天再跑

  他不管，就在那挖地洞

  挖到被抓差點被槍斃，蠢爆


  這段完全靠反派 boss 放水

  不然男主直接被槍斃了


  後期也是，跟班把一條項鍊看的比命重要，一直要撿那條項鍊，完全不分主次，最後被打成馬蜂窩，真的是蠢死的



  這部反派角色幾乎都是肥頭大耳的諧咖，除了大boos 李現尚，其他反派基本都沒有腦


  唯一有腦的就那個玄風警備肥肥隊長

  還被李現尚弄死了…


  保衛部有個超帥平頭哥

  就他沒戴帽子那個，本來以為他也是個角色，結果流民放幾槍他就帶隊烙跑，最後還踩到地雷被炸掉一條腿，也是個諧咖…


  然後反派方都是描邊戰士

  一堆人都在放空槍

  主角站著跑都能射不到

  主角光環就是牛逼


  整部就主角跟反派 boss 有射擊能力

  指哪打哪…


  這部反派 boss 李現尚真的帥到最後

  男主能脫北完全是靠他放水

  不然男主早被打死N次

  有好多次機會他能直接弄死男主…


  流民線有點莫名其妙

  不知道是不是被剪掉了

  牢中裡那個流民小哥到最後也不知道是幹嘛的…



  優點：音樂ok，演技ok，懸疑感有（但不多）


  我自己評分65+1


  多一分是女性友人喜歡影帝，影帝加成…












  --




  --'
