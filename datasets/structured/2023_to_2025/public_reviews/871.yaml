url: https://www.ptt.cc/bbs/movie/M.1722787005.A.238.html
title: '[討論] 宋江客串 ｜逃出北韓系列電影《絕地逃生'
content: "今天來分享逃出北韓系列電影《絕地逃生》\n有興趣的看一下預告片呦\n\n\n\n片尾曲\n\n\n\n        故事的開始，即將退役的軍人\n\
  在最接近休戰線的北韓最前線軍隊\n中士逵南（李帝勳 飾）在服役滿10年將退伍之際，嚮往看得見未來的人生而準備逃到南\n韓。\n\n然而，發現了逵南的計畫的士兵東赫（洪士彬\
  \ 飾），試圖先逃到南韓，沒想到打算阻止\n東赫的逵南也一起以脫北的罪名被逮捕。\n\n為了調查脫北士兵，保衛部軍官賢相（具教煥 飾）來到逵南所屬的部隊，為了從小就認\n\
  識的逵南，賢相想將逵南脫罪，變身為勞動英雄，並準備擢升他的位階，想盡辦法阻止逵\n南脫北。\n\n\n\n不過，當逵南正式實行脫北行動後，賢相別無他法只能開始追殺他...\n\
  \n劇情基本上就是一直帶著看起來聰明又感覺笨笨的小弟在逃亡\n小弟還有一項特殊技能是：預測天氣\n據說是下雨的話地雷會改變位置\n所以他們必須在下雨前找出機會逃亡\n\
  不然就沒有時間了\n\n\n個人覺得劇情還蠻緊張刺激（？\n不會有那種讓人想睡覺覺得無聊的橋段\n各種逃亡、穿河、槍戰，探地雷位置\n個人覺得很好看，這邊不爆雷太多\n\
  \n\n看完之後真的覺得具教煥很有一種陰柔的美\n（聲音也是\n\n而且他在劇裡面居然還跟宋江有過一段情\n沒錯！就是你想的那樣\n宋江雖然是客串有錢人家公子的角色\n\
  真的很有那種fu\n不過還是有點被帥到，可惡...\n\n\n\n以上分享到這邊(  ￣        ￣    )\n感謝大家的收看～\n喜歡看逃出北韓系列的可以去看看\n\
  \n--"
