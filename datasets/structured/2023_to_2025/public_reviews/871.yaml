url: https://www.ptt.cc/bbs/movie/M.1722930780.A.245.html
title: 'Re: [ 好雷] 絕地逃生'
content: '小弟說不上來，但毫無壓迫跟窒息感，但小弟不是在噓，只是單就劇情方面應該算很休閒

  (Leisurely)。


  小弟特地查了一下「投誠」意思，也許這就是一部分被迫生活在哪裡的小人物心境吧。


  確實、他們沒有第二次重生的機會按電影描寫94這樣惹，失敗就是死亡。



  以下小弟心得；

  建議觀影者：喜愛兩大男主的Fans


  小弟純粹看了電影海報與預告前半分鐘預先想大概是緊張逃亡動作電影(但完全沒有)XD


  電影前期有幾段先相(具教煥飾) 對逵[音同：魁]南(李帝勳飾) 幾次互動還有宴會上跟一

  個西裝粉味男還以為看到BL劇，中期先相前男友撥打電話給他，手機螢幕顯示愛過的小混

  蛋確實大概軍團長有男性傾向，可能反映部分現實或者電影的一個小樂趣；


  劇情[簡述]如下

  逵南利用夜間探索投誠路線，同袍弟兄察覺也想一起，在失敗的逃亡下兩人分開，身為暖

  心隊長要再回去找弟兄一起逃亡，中間遇到娘子軍團(無額外介紹由來僅提到遷村，但感

  覺可能都有家人在北韓）互助合作後也分開，最後弟兄在一次逃亡領便當，逵南還是小按

  照自己方式來過未來並且帶著弟兄遺物協助完成心願，最後逃到邊界先相可能也愛著逵男

  讓他超過分界點活著，小遺憾是逵南最後沒有誠實的告訴他的家人已不在世界上，我想這

  也是留給一個美好想像吧。青年貸款核發，逵南後續在自由國度應該能有不錯的發展(以

  下腦補)，遇到了一位樂器哥哥，也許就結了婚。XD


  然後帥哥真的很難醜，即便血淋滿面，泥巴水全身怎麼都還是那麼帥、人帥～真好！




  如原發表介紹劇情平穩，就是看兩帥在耍帥，Fans可以，一般不耐性子觀影者可能會睡著

  。然後、鋼琴音樂好聽還有史坦威鋼琴！


  曲目：Valse, Op. 69 No. 2


  --'
