title: 'Re: [好雷] 本日公休'
content: '身為台中人，對於劇中場景真的有莫名親切感

  很喜歡整部的平淡卻傳達溫暖的感覺

  阿蕊終於見到許醫師幫他剪頭髮這段很感動

  _

  但是總覺得她的公路旅行太倉促

  雖然我知道台中到彰化不過半小時車程

  但既然都刻意讓她忘記帶手機了

  也讓她有點迷路了。感覺劇情似乎可以多著墨在她的公路旅行上有更多遭遇會有趣

  _

  三個兒女與無緣女婿線也虎頭蛇尾

  整部看完有種突然就「啊？就這樣？」


  好像吃了場期待已久的傳統辦桌

  然後菜才剛上紅蟳米糕就突然說結束了的感覺有點錯愕...可惜了陸小芬的好演技。


  --'
