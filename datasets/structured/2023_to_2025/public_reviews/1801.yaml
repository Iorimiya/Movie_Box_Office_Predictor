url: https://www.ptt.cc/bbs/movie/M.1678368891.A.81D.html
title: '[好雷] 離合聚散，人情猶在：《本日公休》'
content: "本文涉及劇情，且具個人觀點，推薦觀影後再讀。\n\n\n　　　　圖文網頁版：\n\n　　　　\n\n\n　　　　預告片：\n\n　　　　\n\n\
  \n　　　　主題曲：洪佩瑜演唱的〈同款〉\n\n　　　　\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n離合聚散，人情猶在：《本日公休》\n\n\n\n　　台灣電影《本日公休》以理髮師阿蕊（陸小芬飾，原型是台中市東區77\n\n歲的家庭理髮廳頭家娘蕭蕊，是導演傅天余的媽媽）為主角，描繪台灣年長\n\
  \n女性的生命樣態：歷經歲月的成熟、適應變遷的韌性、熟稔人情的體貼，和\n\n理解世情的達觀。在這部電影裡，「媽媽」不再僅是悲情、含辛茹苦的角色，\n\n「歐巴桑」既是蘊含智慧的長者，亦是持續學習的少女，是台灣社會活力的\n\
  \n來源。\n\n\n\n　　電影一開始便讓阿蕊預備剪髮工具、倒車出門，而從車子反覆進退，呈\n\n現出阿蕊堅執的個性，和村里間擁擠的人情。長女阿欣（陳庭妮飾）牽著狗\n\
  \n回來見母親閉門不在，聯絡弟弟阿男（施名帥飾）和妹妹阿玲（方志友飾）\n\n確認母親的下落：總是待在家中、膝蓋磨損退化仍不願退休的她，沒說一聲\n\n去了哪裡？從這個懸念，再慢慢鋪陳她的理髮店，她的生活，她的人際關係：\n\
  \n除了兒女，「無緣的女婿」阿川（傅孟柏飾）、還有村里間剪了四十年的熟\n\n客，有的甚至一家三代都由她剪……角色各自的個性、磨擦與選擇推衍出她\n\n生活的日常，描繪出人情苦暖和價值取捨，如慢火熬燉，提煉出人情的醍醐\n\
  \n味。\n\n\n\n\n\n同款與變化\n\n\n\n　　之所以「本日公休」，是為了搬到彰化、已然病到無法行動的老客人許\n\n醫師理髮。女兒說「至少要收２０００」、乍看之下不合算的決定，對阿蕊\n\
  \n來說卻是理所當然的選擇，一如林桑因為夢到亡妻唸他「你怎麼變那麼老」，\n\n輾轉整夜後一大早就來拍門請阿蕊修染髮傾吐心情，以及不同於現在剪髮由\n\n客人預約，而是阿蕊看時間一個一個打電話招呼提醒安排，都能看到這份人\n\
  \n情網路的細密，對她而言，這是她價值的首位抉擇，「同款」是習慣的迤邐\n\n延續、安定熟悉。相較之下，阿玲因為客人被「會用ＬＩＮＥ聊天」的同事\n\nAndy（林柏宏飾）搶走，向另一位同事抱怨「男人是習慣的動物」，卻向客\n\
  \n人推薦改變──改變是揮別過去、更新氣象、鼓起勇氣推開生活的限制，而\n\n這正是她與前夫離緣的原因：修車師傅阿川在乎人情，總是被借錢、賒帳不\n\n還，安於修車店的環境，阿玲則想要存錢換房子，想要改變生活品質，過去\n\
  \n的「互補」變成了沒有共識、無法磨合的銳角，價值觀的差異使他們無法再\n\n攜手人生，只能離婚。這對阿蕊來說是難以理解的，畢竟比起一心求速求變\n\n的女兒，阿川與她更相似：重視人情、細心體貼，加上還有安安這個孩子，\n\
  \n在她的心裡，一直暗自希望阿玲能與阿川破鏡重圓。\n\n\n\n　　也難怪阿蕊覺得阿川更親近，除了日常彼此照顧外（剪髮與保養車子），\n\n阿蕊的三個兒女都在積極適應「求新求變」的生活：阿玲投資百元剪髮，想\n\
  \n善用科技自動提醒客人，阿蕊卻覺得「一通電話能解決的事」、「剪髮要慢\n\n慢來」；阿欣為藝人做造型，忙碌到與男友聚少離多，遑論跟母親好好說話，\n\n讓阿蕊的包包裡放著女兒男友的出軌證據卻難以開口，只能以東泉辣椒醬和\n\
  \n檸檬乾傳遞關心；長期失業的兒子阿男則數次「創業」：古早味雞蛋糕、手\n\n機殼、夾娃娃機、太陽能板、虛擬貨幣……和他的投資一樣，始終在尋找\n\n「成功」的價值好安身甚至翻身。親子對話與互動中能看見世代因快速變遷\n\
  \n而隔閡，阿蕊擔心的婚姻、孩子、房子，熟悉得可以從每個人的記憶裡直接\n\n滴出平常的反應，觀看的同時既和阿蕊一起為兒女煩惱得進退兩難，也跟兒\n\n女一起思考怎麼讓「不懂」的媽媽少一點嘮叨、多一點認同。這樣盡力維持\n\
  \n距離的關懷，稍近一步就是衝突，後退就變成疏忽，不免讓人感到心焦。\n\n\n\n　　所幸獨立豁達的阿蕊有自己的事業，也確實努力去懂兒女的狀況，在與\n\n\
  人互動的過程中調整自己，「你覺得喜歡的，別人未必喜歡」，孩子的回應\n\n她聽進去了，在年輕的客人（胡智強飾）要求剪不適合的髮型好讓女友開心\n\n時，她也在極度委婉尊重的勸說後順應要求，即使不久就被母親揪回來重剪，\n\
  \n怪責還是高中生的他不該把心思放在髮型上，這是阿蕊環境裡的「客群」，\n\n她原可以站在媽媽那邊訓誡高中生「聽話」，但她選擇盡力安撫、體貼孩子\n\n不被認同的傷心，以及想要嘗試改變塑造自我的動機。有趣的是，電影裡母\n\
  \n女一直是對照：阿玲遇到客人不滿意剪出來的髮型，竟直接回應「因為臉不\n\n一樣」而差點引發衝突。阿欣笑媽媽老遠坐高鐵來看她只為了送家鄉味，嬉\n\n鬧間卻未及察覺能親密剪髮的男友早已變心；反觀阿蕊為許醫師剪髮，數十\n\
  \n年來從青絲茂密到白髮稀疏，儘管許醫師話少，一生互動開口不到百句，卻\n\n向阿蕊傾訴在兒女面前說不出口的驕傲，這份信任與理解的距離使她最後一\n\n次為其修整門面時，能說「嘸要緊，你不用跟我說，我就知道你要剪同款。」\n\
  \n讓客人體體面面的在親人的環繞不捨裡走完最後一段路。阿蕊對客人熟習的\n\n智慧，卻因太過關心反而拉開了與子女之間的距離，這趟剪髮之旅不僅是慣\n\n習的發揮專業與圓滿人情，更是日常給予的無常；阿蕊在那段在路間行走的\n\
  \n踉蹌，既是旁觀生死人情的悲憫，也是省及自身的衝擊。\n\n\n\n\n\n前程財富與人情財富\n\n\n\n　　整部電影就這樣隨時間輕輕流動，情感更是溫柔真摯。我特別喜歡阿蕊\n\
  \n年輕時學藝成為職人的回憶，每一段走過的路都珍貴，即使改變也不等於否\n\n決；也喜歡家人間的對話：阿欣回家正因察覺男友劈腿，在老家桌面看到罰\n\n單，阿男在旁原本嘲笑她傻，察覺她在哭又改口說要為她出氣，未料話鋒一\n\
  \n轉，阿欣竟先怪罪母親不該公然放在店裡，是不是全里都知道了──接著老\n\n客人進來打招呼，輕輕一句就證實了她所猜想──這裡除了情感的處理實在\n\n太真實，令人莞爾，更顯現「關心沒有距離」的尷尬：那句「人與人之間，\n\
  \n難道一定要有什麼關係，才能關心嗎？」在過去是理所當然的人情，卻也容\n\n易失去尊重的距離；無論有沒有關係，如果關心背後的期待過重，違背了當\n\n事人的抉擇，終究帶來困擾，反成負擔。我也特別喜歡阿玲到修車廠，看著\n\
  \n白板上欠帳記錄憶起過去的夫妻爭執：那段回憶雖是過去，問題卻沒有過去。\n\n即使心疼與感激的心情猶在，卻使阿玲意識到：這段關係終究要成為過去。\n\n所以她打電話給阿川，告訴他不想停在這裡，「換一個髮型師更適合自己。」\n\
  \n\n\n　　如果阿蕊和阿川是重視人情的「惜情組」，阿玲、阿欣與阿男或許是利\n\n益為先的「前程組」：阿蕊為客人的付出除了堅持職人精神，更為她的晚年\n\n\
  生活增添了樂趣與意義；阿川為「小學同學」、「國中同學」付出的人情，\n\n除了「好人一生平安」外，也在意外的地方成了阿蕊的福神，自己也有了第\n\n二春。這樣看來，人情財富就比較珍貴嗎？未必，習慣或許是滿足於現狀，\n\
  \n亦可能是固守原地無視時移事往；求新求變、無暇四顧獲得的高效率，亦可\n\n能遺失人情裡那一點點珍貴的體貼與親密。無論是何選擇，都是個人利益與\n\n價值當中輕重緩急的取捨不同，既非極端，亦非一成不變。當阿蕊擔心兒女\n\
  \n的生活叨念，一旦立場轉換，阿蕊為客人遠道開車去彰化到府剪髮，沒帶手\n\n機又未事先通知，事後回來也被兒女輪流叨念：「花那些時間，能賺什麼？」\n\n正印證了阿玲那句：「我喜歡的你不一定喜歡。」\n\
  \n\n\n　　所以這趟公路旅程的「意外」，不僅讓兒女體會到平日要再多關心母親，\n\n阿蕊也從中體會到價值觀的差異是各自人生的功課，帶有批評的關心與否決\n\n\
  無論是誰都不易承受，只想「占理」無法取得平衡就只會把感情推得更遠。\n\n就連與年輕農夫（陳柏霖飾）的對話，也有「易子而教」的趣味和體會，畢\n\n竟每個人需要的距離不同，無論是科技新貴決定回到鄉間和稻子說話，抑或\n\
  \n是阿蕊在田間開車迷途，只能循著路往前，有時會開進田裡；或如阿欣與男\n\n友分手後學習開車三次沒過，教練告訴她「直直開，像人生一樣，直直開就\n\n順了。」可能繞點遠路，但只要能到達令人心安的目的地，便會停下，然後\n\
  \n再次擇路前進，無論如何都是好的路程。\n\n\n\n　　正因如此，過去從不休息的阿蕊，開始「公休」和朋友去玩，拋開傳統\n\n給予母職的過重負擔，重新享受人生。雖然還是對媽祖祝禱希望孩子能「聽\n\
  \n祢的話」，但也明白孩子自有人生與主張，哪一條路都只能自己去走，「能\n\n平安過日子就好」；求效率的阿玲也在被同事Andy安撫差點炸毛的客人後，\n\n轉而能欣賞那些「甜言蜜語」裡對人心愛美、希望能得到肯定的體貼；甚至\n\
  \n最不愛改變的阿川在故事最末，也決定要再婚，去適應另一段改變的人生，\n\n阿蕊雖然不捨，卻仍衷心祝福對方幸福。很喜歡那樣輕輕的理解與道別，有\n\n時候太過親近，反而會為彼此增加不必要的壓力與負擔；有時生命無常，留\n\
  \n在心裡的只能是回憶與思念，這時候，沒有期待的關心、真誠的祝福就是最\n\n好的付出：畢竟儘管離合聚散，人情猶在。\n\n\n---\n\n\n　　有意者可考慮週末影人場：\n\
  \n\n　　學生優惠影城場次：\n\n　　\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\
  \n                                  陳斐雯  貓蚤札（其三）\n\n--"
