url: https://www.ptt.cc/bbs/movie/M.1677861523.A.923.html
title: 'Re: [好雷] 本日公休'
content: '-

  有雷










  我覺得推文說有點說教我是不覺得啦


  與其說是說教


  不如說是每個人對於自己在意的點的執著


  這部片幾乎每個主要角色都有這樣的展現


  所以才會時常出現衝突


  沒有對錯


  只有適不適合


  就好像媽媽和三個孩子間的互相關心


  可能不適合彼此


  但是他們就是這樣過著生活的


  媽媽對孩子碎念應該這樣過生活


  是因為那樣的人生比較安穩


  孩子碎唸媽媽為什麼不帶手機


  也是對媽媽的關心


  -


  住家裡的孩子可能會覺得媽媽碎念是說教


  住外面久了回家的孩子聽到媽媽碎念


  會覺得那是關心


  -


  這部片很平實，很日常（你也可以說很無聊）


  但是很好哭倒是真的


  -


  建議不要看預告片


  因為太多雷了。


  --'
