title: '[請問] 本日公休'
content: '有雷






  請問陳庭妮那條線是怎樣 ?

  她在理髮院看到甚麼哭了 ?

  她在台北當富二代的情婦小三 ?

  我在台中大地球全球影城地球廳看的

  因為對台語不太熟，所以看字幕會漏掉

  以為聽得懂一點就不太想看字幕

  但聽不懂的往下看字幕已經看漏了

  還有她幫男友剪頭髮我還以為剪到手大叫

  原來是因為東泉台中醬大叫

  我知道陳庭妮也是台中人


  這戲真的很台中

  拍的綠川橋跟片尾中友B1的理髮院

  就是方志友跟林柏宏後來開的新店

  都是我在台中很常去的點

  台中的確家家戶戶都有東泉

  但好像只限於台中市

  出了台中市就是別的醬了

  羅氏秋水茶也一樣

  所以我把東泉跟秋水茶

  稱為台中醬跟台中茶


  這戲真的讓我哭了很多次

  尤其是幫死人理髮那段真催淚

  還有陸小芬年輕時學理髮的回憶

  想到現在台大毀容院(理髮院)

  還是用這種像醫生的白袍的制服

  可能日據時代延續至今的傳統


  陸小芬年輕也是像舒淇一樣的巨乳豔星

  一路演到金馬影后息影後嫁人變胖阿嬤

  藝人一離開演藝圈就很難維持完美形象

  不過真正厲害的演員就算身材跟舒淇一樣好

  為了這個好角色一樣可以把自己吃成胖阿嬤

  然後頒獎典禮再拼命瘦回來上台拿影后

  像趙薇跟安藤櫻以前拍戲都幹過這種事


  這片還看到阿翰跟千千

  他們真的演的蠻好的，應該是導演導的好

  千千演賣馬桶的業務員，跟傅孟柏湊一對

  傅孟柏開汽車維修行當黑手，跟方智友是夫妻

  後來因個性不合離婚，方志友跟同事林柏宏開理髮院

  傅孟柏跟朋友介紹的千千再婚，傅孟柏是陸小芬的女婿

  施明帥好像演大哥不知道他是幹嘛的 ?

  大女兒陳庭妮跟二女兒方志友好像都是理髮師 ?


  地球廳的螢幕太大坐太近看字幕實在不方便

  而且一張票110，一定要看兩部片或兩人看一部片

  很特別的規定，沒法看一部片只要60就好

  所以只好再選一部塔爾來看

  不然應該再找一個人來跟我一起看這部好國片

  有吳念真監製的片就是熊讚A台語片

  看了這片才知道台語左轉右轉怎麼念

  多謝大仁哥的台語教學，但他好像也講錯 ?


  大仁哥演竹科工程師跑去當佃農種田

  不問江湖、卸甲歸田、遠離塵囂、怡然自得


  --

  千千、Janet、袁子芸這三個都是同一型的女演員'
