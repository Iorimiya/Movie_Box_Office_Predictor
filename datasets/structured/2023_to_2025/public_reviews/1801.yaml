url: https://www.ptt.cc/bbs/movie/M.1685509978.A.76F.html
title: '[好雷] 本日公休'
content: '大家安安


  乳題


  好久沒看到這麼好看的國片了


  看完心情蠻激動的







  ==================================


  主角陸小芬飾演的男士家庭理髮師


  親切又熱心的服務客人關心客人


  從黑髮剪到白髮


  從這一代剪到下一代


  老顧客的頭都歸她管



  而她的子女則都有各自的人生問題


  她雖然關心但也有一顆開放的心


  某次因為要到外縣市服務老客人


  卻因為忘了帶手機出門又出車禍


  引起了一場小風波......


  ================================




  陸小芬真的是厲害


  活脫就是真的理髮師


  而這部幾乎全程台語


  聽到了不少道地的用法


  年輕演員的台語也說得很好


  陸跟子女還有子女間的互動也很日常


  整部節奏明快又流暢


  導演真的說了一個好故事


  好久不見的好國片


  讚！



  --'
