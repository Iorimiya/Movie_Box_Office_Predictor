url: https://www.ptt.cc/bbs/movie/M.1718262005.A.08A.html
title: '[討論] 本日公休觀後感'
content: '前要:因為看到有人把這部片跟《運轉手之戀》放到了一個高度，所以決定去看。

  感想:看完之後，發現有一句話很適合這部電影，那就是，很想去苛責，但不忍心。

  怎麼說呢，這部劇的內核是很好的，用一個兢兢業業四十年的理髮從業人員，順帶著表現

  出古早台灣的人情往來，內核精神真的是很好，但問題在於導演把這個內核表現得太過自

  我感動，講實在的講精神這種東西，就是要適可而止，這個度很難掌控，如果要用很大的

  力度去講，人物的經歷至少也要講出史詩級的感覺，大概就是阿甘正傳那樣的才配得上。

  這部劇因為主體在於理髮，可惜理髮要撐住這種精神，就導演拍出來的東西，是較難說服

  觀衆的，特別是這種精緻功利主義的社會，畢竟怎麼看理髮就是一門非常小的生意，這部

  劇的高潮放在千里迢迢跑去彰化給人理髮問題倒也不大，但問題在於那一段表現的力度又

  非常急促，而且結束之後居然又扯東扯西了三十幾分鐘，就這一點我就認為導演掌握劇情

  的節奏很有問題，而且很詭異的一點在於，女主居然是用走的從牙醫那邊出來的，看得我

  目瞪口呆，一個膝蓋有問題的人，把車都撞了用走的過去對方不清楚也就算了，清楚了之

  後居然牙醫家人沒有願意開車送她回台中？那這部電影要表現的人情價值跑哪裡去了？？

  ？？

  本身這部電影的劇情就已經是非常平淡了，導演還無法把劇情的節奏把握好，這部電影很

  想讓你去為了某一些事感動，可惜我很想為其感動，也能理解他想表達的感動是什麼，但

  導演沒有把他拍到位，這是很可惜的，然後，這部電影真的不能跟《運轉手之戀》放在一

  起，《運轉手之戀》的劇本，節奏，內核都遠遠不是這部電影能比得上的。


  --'
