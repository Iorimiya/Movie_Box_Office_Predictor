url: https://www.ptt.cc/bbs/movie/M.1755961586.A.892.html
title: '[  好雷] 本日公休'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這是一部很日常的電影，整部的重點圍繞在電影名上。故事的主軸是一個理髮阿姨服務著

  多年來的客人。有一個醫生客人很久沒來了，打電話過去才知道身體不好，已經搬去其他

  地方休養，所以沒辦法再過來剪頭髮了。於是乎，阿姨開啟了旅途，開著車去幫老醫生理

  髮。故事中還圍繞著一些關於理髮阿姨子女的小故事，就這樣緩緩開啟、緩緩落幕。沒有

  太多勁爆點，就是很平靜地帶過，我很喜歡。


  我會喜歡這部電影，不只是因為它的鏡頭敘述方式，也是因為我從小就給對面的理髮阿嬤

  剃頭了近乎十年的時間。裡面的布置就跟電影中出現的一模一樣，只是洗頭的位置改變了

  ，也是同樣坐過那個木板。到了現在，依舊有很多阿公會過去找阿嬤剪頭髮。跟電影中的

  阿姨不同，我家對面的阿嬤只幫男生剪。阿嬤說她從16歲就開始剪頭髮，從路邊剪到買房

  子、開了自己的店面繼續剪。

  她也講過，一堆阿公說這輩子只給她剪，不管住多遠都要過來，甚至還有一些住在榮民之

  家，也經常過來理髮聊天。聽著他們的故事，本來就不會多清晰，像是這部電影，很多地

  方看起來沒有展現得很細節，但現實不就是這樣嗎？人生的看見的故事本來就零零碎碎，

  記憶也不總是可靠的，我想這才是真實的人生吧。



  電影中有很多令人感動的小細節，像是片尾對前女婿塞紅包、祝福他幸福；又或者在子女

  觀念上的前衛表達。很多鄉下或小時候常出現的互動，都令人感覺熟悉又感動。許多片段

  裡，我覺得阿姨的情緒都很穩定，直到幫醫生剪完頭髮，那份真實感才湧現。大腦一時接

  受不了突如其來的資訊，就像當機一樣；之後確定事實並接受了它，在田野旁奔跑的那一

  幕，很有真實感、很有觸動，我覺得那是一種情緒爆發後的釋放，跟前面長時間的平淡形

  成對比，讓觀眾跟著感受到那份「接受與放下」。


  我喜歡這部電影，還有一部分原因是它把台灣拍得很好看，拍得就像我們生活中的畫面。

  或許因為太常見，平時容易忽略，但對我來說卻很感動。電影中每一個畫面拉出來，都能

  立刻認出是台灣。這一直都是我想看到的電影。片尾曲也很好聽。整體連貫性雖然不強，

  有些故事交代得不太清楚，但我想這才是真實。真實的世界沒有必要每件事情都解釋得很

  細。理髮阿姨和每個人的互動都拍得很好，像是跟小朋友、跟小朋友的媽媽、跟那些老客

  人聊天的場景，還有和姊妹們一起出去遊玩的畫面，每一幕都能走進人心。這是一部表現

  得很棒的電影，但確實跟親子之間的互動確實著墨偏少，有些草草結束的感覺，多少還是

  會覺得有些可惜，不過單就理髮阿姨的故事，我覺得很完整了，畢竟我生活在類似的環境

  中體驗著。


  --'
