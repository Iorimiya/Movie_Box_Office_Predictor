title: '[ 好雷 ] 小聊<<本日公休>>的拍攝手法'
content: '雷文防雷資訊頁



  有劇情雷



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  本日公休最高潮的部分-阿蕊幫許醫師理髮那段



  理完頭髮 阿蕊原先是用走的  後來邊哭邊小跑步


  伴隨著電影主題曲的響起




  這段讓我想到喬伊斯(Joyce)在都柏林人有篇短篇小說-阿拉比


  這篇選文很多外文系的文學課都會選XDDD




  阿拉比是個市集 故事重點在講青少年的成長


  但最經典的地方在於用光影描述心情



  ---男孩最後因為叔叔遲遲沒回家  沒有趕上阿拉比的營業時間


  無法幫心儀的女孩買禮物  大廳暗下的燈光如同他羞愧憤怒的心情--




  本日公休的導演則是選在傍晚~ 魔幻時刻的尾聲


  逐漸暗去的天光 代表阿蕊的難過和對老朋友的不捨



  雖然有版友說這段拍得很矯情  但我覺得拍得很棒~


  拍出新的高度~





  期待這部電影能入圍金馬 重新上映。






  --

  已更正 謝謝~'
