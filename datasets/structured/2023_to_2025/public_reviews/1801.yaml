url: https://www.ptt.cc/bbs/movie/M.1677936039.A.EB4.html
title: '[好雷]《本日公休》家庭生活經驗的台味詮釋'
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  1.影片名稱：本日公休


  2.觀影時間：2023/03/04


  3.觀影地點：信義威秀（14廳外有理髮店燈牌！）


  4.觀影方式：自行購票


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  部落格圖文版：


  「我這輩子，就只會做這件事。」

  「以前我師父有說，每個人，都有一顆頭。」

  「做這行，不怕沒有飯吃。」


  記得第一次在銀幕上看到《本日公休》的預告時，雖然短短40秒左右的影片內容並沒有提

  到任何劇情主軸，八年級生的我對於飾演理髮阿姨「阿蕊」的陸小芬也沒有太多概念，但

  當那些我們都再熟悉不過的理髮手法，配上陸小芬充滿情感的獨白，這位職人阿姨的形象

  ，便漸漸在我腦海中鮮活了起來。


  「同款喔？」


  接著預告以阿蕊與熟客間的日常問候，伴隨著一陣剪刀刀片摩擦聲作結。儘管當時仍然猜

  不太到電影究竟想說什麼，然而其中所流露的人情味與日常感，已經深深使我觸動。


  衝著這段預告的餘韻無窮，《本日公休》的正片卻沒有我所想像的那麼「理髮師」，而是

  藉由阿蕊「理髮師」的這個職業身分，帶出電影真正想探討的家庭關係。阿蕊的三個小孩

  和她都有著某種程度的對立：投機的阿男對應著她的腳踏實地，北漂的阿欣、在新穎髮廊

  工作的阿玲，則對比著她的「過時」。


  「那個商業周刊說，」

  「……得綠能，得天下！」


  阿蕊與三個小孩之間的對手戲，總是看似齟齬爭執不斷，但當撇開「親子」的身分，世代

  之間的隔閡似乎就不再那麼根深蒂固。她理解情竇初開的鄰家男孩；當聽到熱心的「好青

  年」陳柏霖向她介紹起太陽能板，更是硬從陽台上與兒子的鬥嘴印象中擠出一句「得綠能

  ，得天下！」


  那為何這道隔閡，總在親子之間顯得特別明顯？在阿蕊姨前往幫老客人理髮的路上，她以

  自己作為母親的角度，勸棄科學園區轉而投身田園的年輕農夫，「有空多回去家裡走走，

  別讓父母太操心。」；在全劇情緒最滿的到府理髮戲，更是在邊悉心理髮，邊細數牙醫往

  日理髮習慣與之告別的同時，替他說出了他一輩子都未能親口向兒子訴說的：他為兒子的

  才華感到驕傲。


  「人與人之間，難道一定要有什麼關係才能關心嗎？」


  「父母總有著自己的期待。」不管是一中男孩的母親，阿蕊，還是老牙醫，「望子、望女

  」的期待或許都有些一廂情願；兒女又未嘗有著自己的想望？媽媽在家，總是比獨自出遠

  門令人放心；而不只親子，「重情」的阿川與「重理」的阿玲夫妻之間亦然。從這些「有

  關係的人」回望阿蕊和女婿阿川，當彼此沒有試圖將對方放入某種價值框架，關愛才不會

  在送達前便已消磨殆盡。


  藉由阿蕊的這趟到府服務，《本日公休》以深具人情味與日常感的台味視角，詮釋了家庭

  關係中難免的誤解與爭執，然而相當可惜的是，在阿蕊返家後，電影並沒有隨之收斂出主

  軸，反而發散地交代起阿蕊作為理髮學徒時的回憶，以及家庭成員們後續的轉變。但當知

  道電影的原型是導演的母親後便不太意外，很多片段或許都有其個人意義，卻難在要如何

  在有限的電影時間中將其組合。


  而在看電影之前，我對於這群演員陣容其實相當陌生，因而反倒格外驚喜。陸小芬的演出

  實力無庸置疑，對我而言她就是阿蕊，不只理髮手法專業十足，與家人、客人間對戲的神

  情都充滿說服力。最有渲染力的當然是與老客人，同時也是老朋友告別那場情感澎湃又需

  強忍，在離開後終於得以釋放的到府服務。若說到最「歐巴桑」的，則肯定是開車前擦後

  撞，瘋狂殺價這些細節。


  除此之外，每位主演的形象也都相當立體。「男孩」胡智強從情竇初開的天堂跌落到被媽

  媽抓回來剪短的凡間，「二手的也沒關係，只要喜歡就好。」以及千千曖昧到爆的土味情

  話，實在讓人眼睛為之一亮；「阿玲」方志友與「阿川」傅孟柏之間既惱怒對方又在乎彼

  此的互動，則是情感張力滿滿。


  扣除收尾上的不夠聚焦，我很喜歡《本日公休》中的那份溫度，不管是老闆娘與客人朋友

  般的互動關心，路途上的人情味，還是主題曲中洪珮瑜溫暖的唱腔；也很享受電影的畫面

  ，從理髮、修容這一個個步驟的細節，店中的光感色調，到中台灣的城鎮風光，再到老客

  人不同人生階段的「後腦勺」。最後最後，真的很開心能看到陸小芬不僅毫不斧鑿，情感

  傳達力也超強的詮釋！


  --


  部落格：

  FB粉專：


  --

  真的暖！

  我在選擇這個詞的時候有查詢一下，看到蠻多台灣網站在使用讓我以為是中性詞彙。

  經過你提醒後我有發現這在wiki上被認為是對岸的慣用語，這邊我就改成八年級生惹～

  或許是期待不同吧！我能理解導演想拍的是媽媽的故事，但同時我也希望在這樣的故事中找到更多共鳴。

  真的是少了些將自己投射進去的空間QQ

  人物的部分個性是有展現出來，但主要是憑演員傳達給觀眾的印象～

  我覺得演員是有展現出角色的性格，但也如你所說在劇本上是模糊的，而這也讓我對最後的轉變比較無感

  至於「投射」，我想表達的是一種自己找尋共鳴的空間，跟你應該是類似的概念～

  在現實生活中，我也絕對受不了阿川那樣的人XD

  所以我會比較用「溝通」來看待這些角色的關係～

  拉生意應該也是某種示好（？

  這部份我也覺得有點突兀0.0'
