url: https://www.ptt.cc/bbs/movie/M.1697118765.A.580.html
title: '[好雷]本日公休(從頭哭到尾) '
content: '前幾天在電視上看到這部電影，


  我真的是從頭哭到尾，


  第一個原因，我是台中人，看到許多熟悉的場景，剛好我也在彰化上班，


  看到了許多熟悉的稻田路，彷彿是我每天路過的地方。


  第二個原因，是因為陸小芬演的阿蕊，跟我那時候的理髮阿姨有夠像，


  很溫柔，堅強，我講個每句話阿姨都記得，


  而且理髮時候都會跟客人聊八卦，完全一模一樣。


  裡面讓我最難過的一段是最後那一幕，他聽到前女婿說要結婚了，


  以後不能常來了，那個失落的表情，還有後面塞紅包，我整個痛哭到不行，


  整部戲當然有些缺點，比如說沒必要的網紅戲碼，我倒覺得那些網紅的戲，


  如果可以給林柏宏多一點發揮不知道有多好?


  我個人是非常喜歡這種電影，很舒服平淡，沒有誇張浮華的橋段，


  就是很平平淡淡的，呈現出一個理髮阿姨的日常生活故事，


  大家覺得這次陸小芬的影后機會大嗎????


  好希望她得獎~~


  --'
