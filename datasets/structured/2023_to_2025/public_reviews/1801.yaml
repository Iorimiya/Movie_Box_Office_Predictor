url: https://www.ptt.cc/bbs/movie/M.1678710940.A.545.html
title: '[算好無雷] 本日公休 '
content: '陪我家老媽去看的片，大概簡單寫下心得：



  基本上來說還算不錯，整體步調、口語、互動都算自然，笑點也不會太過刻意，整部片


  其實流暢著年輕人也能體會的自在感。


  尤其對打小常上社區家庭髮廊的人應該滿有體感，那熟悉的剪髮聲、八卦抬槓和氛圍(我就是


  那種進去就幾乎不講話享受閉目養神的類型)，應該能讓不少人勾起回憶會心一笑



  然後要講些稍微可惜的──有些情節步調安排的不太好



  許醫師那段基本上就是主題「今日公休」的主線了，看完這段基本上情緒被醞釀到最高點



  我都已經有要跑字幕的心理準備了，如果在這邊結束我給的評價應該會更好。


  但主線已經結束了，後面卻又出現一堆穿插的各種戲碼。年輕的回憶也就算了，但後頭的


  劇情給人的情緒又完全高不過許醫師橋段。



  不免讓人有種情緒被醞釀到最高點後，就慢慢冷掉開始覺得反而有點拖時間的感覺。






  --'
