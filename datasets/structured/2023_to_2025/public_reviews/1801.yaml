url: https://www.ptt.cc/bbs/movie/M.1678073791.A.758.html
title: '[普雷] 《本日公休》，人情味固然重要，但多了就'
content: '部落格版：


  導演傅天余睽違六年推出新作品《本日公休》，請來息影多年的影后陸小芬回歸飾演家庭

  理髮師阿蕊，本以為這會是部台灣電影少見的職人電影，但結果並不是。當然電影中多少

  有提到家庭理髮師的精神與技藝，不過這並非《本日公休》的重點，之所以會選擇這個家

  庭理髮來做為主角職業，除了這是導演傅天余母親過去從事的工作外，我想更多的是因為

  傳統家庭理髮即使近年逐漸式微、不斷的承受著連鎖髮廊與百元快剪的興起衝擊卻依然沒

  被完全取代掉，甚至還繼續存在於許多巷弄裡和年輕一輩繼續抗衡，這個為什麼不只令人

  好奇，其中原因更是導演傅天余試著來去探討的。而就如同電影宣傳語所講的，「剪的是

  人情，留的是思念」，導演傅天余將根本原因歸功於傳統家庭理髮所擁有著的、連鎖髮廊

  或者百元快剪所缺少的「人情味」上。


  小時候常常到傳統家庭理髮剪頭髮，加上母親就和電影中的阿蕊一樣，曾經經營過傳統家

  庭理髮，所以在看《本日公休》時其實格外有感，對於導演傅天余想傳遞的亦能感同身受

  ，尤其她所塑造出來的阿蕊這個角色，很確實的就是我印象中那個喜歡把客人叫來家裡剪

  頭髮，然後邊和他們閒話家常的母親的樣子，她就和阿蕊一樣會拿出電話簿，閒來無事就

  打電話出去問人要不要來剪頭髮，就算不剪也會聊個天搏感情，而在她為了專心照顧家庭

  而把理髮廳收起來之後，還是會有人打電話來請她幫忙剪頭髮，就連父親直到現在也都還

  是只給母親剪頭髮，不是因為母親特別厲害或是手藝高超，而是因為他們「習慣了」。當

  然母親沒有過像阿蕊那樣開車從台中到彰化就為了替老客人剪頭髮的經驗，但從很多地方

  來看《本日公休》，我都能從裡頭感受到親切的熟悉感。



  題材的選擇與角色的塑造讓我對《本日公休》有很多個可以去喜歡它的理由，可惜最後還

  是差了一點。這個「一點」問題出在人情味給的「太多」，多到讓人難以負荷，甚至是難

  以忍受的地步。你可以很清楚的知道導演傅天余的目的是什麼，也很明白她想藉著這樣的

  劇情與阿蕊這個角色的搭配來達成她的目的，而事實上這組合公式成功率幾乎是百分百，

  然而導演傅天余卻讓重要的一關鍵、也就是阿蕊淪為頌揚人情味多美好的工具人角色。和

  來店裡的老客人說沒幾句話就會提到對於人情味的感觸與體悟，連歐巴桑會有的不自覺把

  腦中想的、要做的事說出來的慣性都能很刻意的放入相關台詞，對兒女間的教誨也多以「

  做人應該如何如何」來當基底去說，加上陸小芬聽起來總覺得不是很輪轉的台語腔調，都

  實實在在的把本來該很重的親切感給稀釋掉，讓我對電影反而多了份疏離。


  「人與人之間，難道一定要有什麼關係才能關心嗎？」


  不夠自然的刻意壞了《本日公休》的本意，過多的阿蕊人情味語錄聽久使人麻木，前往彰

  化路上的各種善意迴向於她也讓電影失去真實感，導演傅天余不是讓觀眾順著劇情來去體

  悟阿蕊口中人情味的重要性，而是單純的一直讓阿蕊去灌輸人情味很重要的觀念，整部電

  影也多在營造這樣的氛圍感，但實際成效我認為是有限的，至少對我來說是如此。不過幸

  好的是，導演傅天余多安排了阿川與阿玲這對夫妻，同樣都是在工作上可是卻以另種角度

  來去切入、探討人情味這件事，是有稍稍止住不停流失的耐心。阿川和阿玲之所以離婚是

  因為兩人價值觀不同，他們一個感性一個理性，阿川認為做生意不能只為了錢，而是那些

  在不自覺間累積下來的無形資產，但阿玲卻無法苟同，畢竟他們也要生活，如果不讓那些

  總被阿川以各種理由接受賒帳的客人付錢，他們怎麼有辦法養活自己？先姑且不論阿川太

  過好人，也不管阿玲後來想法上怎麼改變，在此前兩人的觀念碰撞都比阿蕊單方面一直說

  來得更有機會讓觀眾去思考、去接受「人情味重於一切」的可能性。



  而或許是為了想增加情感上的厚度，導演傅天余從人情味中來延伸親子議題，用與陌生卻

  熟悉的客人的親近來對比熟悉卻陌生的子女的疏離，來讓人看見為人父母的寂寞與落寞。

  阿蕊總能和來店裡找她服務的客人相談甚歡，也能用電話聊上幾句關心，但面對子女她卻

  沒有辦法，阿蕊就像許多父母一樣，遇到問題寧可找認識的鄰居、朋友或是沒有血緣關係

  的前女婿幫忙，也不想麻煩到子女、不想讓他們已經有很多事情要忙了還要多她一個煩惱

  ，可是這樣看似貼心的動作背後卻能感受到她的不滿，那種為家、為子女貢獻她的青春、

  她的一生，可是好像沒什麼回報的稍微抱怨。只是說歸說，在許多小地方仍可以見著阿蕊

  對於子女的關心與擔心，還有驕傲。阿蕊時常有意無意的在勸阿川和阿玲復合；知道阿欣

  若知道男友劈腿會難過選擇隱瞞打算默默解決；苦勸兒子阿男不要再搞不切實際的投資，

  但當聽到有人再說兒子正在投資的太陽能板事業，那句好不容易想到的「得綠能，得天下

  」六字裡盡是驕傲。


  導演傅天余讓阿蕊的戰場從理髮廳到家庭，讓她服務的精神與情感從客人延續到家人，真

  的可以說她鏡頭底下的阿蕊，就是很多人眼中的母親、傳統婦女或者你說歐巴桑的印象，

  如此鮮明的存在在電影裡頭，試著以最親近也最親密的距離讓觀眾認識。誠如前面說到的

  ，觀眾其實可以很清楚知道導演傅天余想透過《本日公休》、想透過阿蕊這個角色傳達的

  想法，但可惜的是，她在重點的人情味給的力道過猛，多到讓本意油掉；而在處理家庭問

  題的部分反而太輕，輕到你幾乎看不出來問題在哪。電影讓三個子女各自遇到受挫，不論

  是工作還是感情，而從他們面對的態度與阿蕊的反應，都要以爲會不會有什麼實際上的衝

  突，結果沒有，一切就是很輕描淡寫的，沒有什麼阿蕊和子女正面來把話說開接著上演雙

  方互相懂得的戲碼，就只是兄弟姐妹久違重逢聊個幾句就突然轉念然後改變的那樣簡單，

  甚至三兄妹還算孝順聽話，還會自己回老家拜訪母親，也沒有用言語或行動來傷害阿蕊，

  所以坦白來說，就算看得出來這些編排的用意是想呈現出與人交流的對比，但說服力不是

  很足夠。。


  《本日公休》是部很有誠意與真心的電影，但在敘事上稍嫌零散，很多東西難以被整合，

  加上前面提到的幾點問題，讓電影從各方面來看都很可惜，明明幾位演員、包含許久未見

  的陸小芬都是演技派，但不曉得為什麼放在這裡面滿滿尷尬，最自然的反而是來客串的林

  柏宏。當然無可否認的是《本日公休》也有它感人的地方，例如阿蕊在替老客人最後一次

  服務時的告白，儘管都是同套的人情味台詞，但當時間點對了就是對了，如果整部電影就

  是在適當時機給一點、給一點，不要刻意的將台詞塞這麼滿。那麼我想觀影起來會像電影

  畫面、節奏還有洪佩瑜的歌聲一樣舒服，總歸來說就是可惜了。


  --

  就給我的感覺很像硬講的啦

  我媽以前真的會欸（怕沒生意吧哈哈哈

  同意兩位！真的是這種感覺誒'
