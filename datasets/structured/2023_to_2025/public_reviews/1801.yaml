url: https://www.ptt.cc/bbs/movie/M.1685715744.A.B0B.html
title: '[影評] 記得每一個需要──思想電影《本日公休》'
content: '2023-06-02 專欄 / 天路客


  記得每一個需要──思想電影《本日公休》



  家庭理髮廳是許多台灣人的共同記憶。（劇照提供：威視電影）


  ◎徐硯美


  近來討論熱度一直不退的莫過於是「人工智能」（AI），而人工智能的運作，必然的要素

  就是「大數據」（big data）。「Data」是一種以數據方式儲存的資料，對應在人的身上

  ，就叫做「記憶」（memory）。


  當我們不斷憂心AI會如何取代人類現有的工作，自身的競爭力衰退、會被社會淘汰，有一

  件事情或許我們真的發現的「太晚」，就是大概近二十年來，我們的「記憶」逐漸被轉為

  「數據」，也就是我們不再是儲存記憶的「主體」，我們的電腦、手機等設備才是，近幾

  年，雲端的儲存空間才是。


  再加上「演算法」的出現，每一個我們消費的經驗、在搜尋引擎輸入的關鍵字、瀏覽過的

  網站，都成為數據被傳送到各個常用的平台上，再按照我們的「喜好」無窮無盡地向我們

  推送內容。


  我們不是現在才要被人工智能取代，而是當我們不再是自己經驗與記憶的主人，那麼記得

  比我們更多的，更懂我們的，是否才是最能夠掌控我們的呢？



  （劇照提供：威視電影）


  造物者對你我全然了解


  現代人難以離開科技設備、網路，可是，早在大衛的詩中，就已經提到造物者的無處不在

  ，並且寫到祂對我們的全然了解。整個詩篇一三九篇，大衛提到我們的任何行為（坐下、

  起來、行路、躺臥）、任何意念、任何一句話上帝都完全掌握；我們無論去到何處，哪怕

  我們深深躲藏，在躲藏的深處，上帝也在那裡。


  祂是我們早在母胎之中，形體尚未成形，在地的深處被聯絡時，所定的日子「尚未」度一

  日，祂就已經看見我們將會長成什麼樣子，有什麼樣的人生，祂早將我們的名字，寫在祂

  的冊上。


  整個詩篇一三九篇，不僅是在說上帝對我們的了解，更重要的是，它不斷在告訴我們，是

  祂「主動」與我們建立關係，因為他說：「神啊，你的意念『向我』何等寶貴！其數何等

  眾多！」（17節）也就是祂不僅具有這樣的「全知全能」，祂也是有意願去全然理解祂所

  創造的我們。


  祂與我們不像我們與人工智能，上帝與我們沒有相互取代的關係，沒有生存利益的衝突，

  而祂對我們的全然了解，也只有一個原因，讓祂的愛更無阻地流動在我們的生命之中。



  阿蕊開店40年，用心守著專業技術和溫暖人情。（劇照提供：威視電影）


  一生守著理髮店的職人媽媽


  《本日公休》是今年上映的一部雋永小品，由傅天余執導，吳念真與電影《孤味》的監製

  吳明憲二人聯合監製，並找來金馬影后陸小芬，在睽違大銀幕20年之後，飾演女主角阿蕊

  這個角色。


  故事敘述阿蕊開設男士家庭理髮已經四十年，隨著社會的演進，這樣的店家在城市中越來

  越少，即使在小市鎮也越來越少見。顧客大多是上了年紀的人，在時間的推進下，有的搬

  離舊居去與兒女同住，有的患病不能再像從前定期來剪髮，有的就在某刻，生命戛然而止

  ，在人生的列車上落站。


  但是阿蕊始終日復一日，開店、打掃，一如既往地將店面掃得一塵不染，將客人要用的毛

  巾洗好、晾好，再放進加熱的蒸氣箱內備妥。


  縱使店裡客人不多，阿蕊總是備著一個筆記本，記錄著每個老顧客的電話，白板也記錄著

  每個客人上次剪髮的時間，以便提醒對方該來剪頭髮了。


  一個人，一間店，一台電話，一本記事本，一塊白板，就成為了阿蕊經營這間理髮店的全

  部。她不僅獨自用這間店，養大了三個兒女，更照顧了許多客人，甚至四十年間，從第一

  代剪到了第三代。


  不同於城市裡那些大的髮廊、理容院有先進的設備、知名品牌的美髮產品、多樣化的剪染

  燙護技術，也沒有行銷、廣告、集點送、生日禮等會員服務，她有的，就是一顆「服務的

  心」，用她所能，做到最好，也用她所關心的，給予最溫暖的。



  油腔滑調的髮型師Andy，與同髮廊的阿玲搶客人。（劇照提供：威視電影）


  記得每個客人的需要


  阿蕊的細心與用心，再加上她累積的經驗，她看人一眼後腦勺，就能知道這個人的頭是圓

  的還是扁的，頭髮是細軟的還是粗硬的，這人的性格也都寫在他的頭型與髮質之中。刀刃

  的接觸是親密的，也是危險的，這讓下刀之人的每個動作、每個細節不能馬虎，阿蕊自己

  都說，被她剪過頭髮的客人，都會上癮。


  然而，真正讓顧客信服的，不只是阿蕊的技術，而是她慷慨付出的那顆心，電影就是從阿

  蕊的一次「遠行」作為故事主軸，而這次遠行，就是要為著她一直以來的客人，一位老牙

  醫剪髮。



  阿蕊開著老車要為老顧客剪髮，途中迷了路。（劇照提供：威視電影）


  她並不是第一次做這樣的事，以致三個兒女都輪流勸她，這種又花時間又不賺錢的事情就

  別再做了。兒子要她把店給收了，在頂樓裝設太陽能板，收租金過日子；同樣當髮型師的

  女兒阿玲，建議她外出一次就要收個兩、三千塊，這樣才划算。


  但是，阿蕊只是將店門口的鐵門拉下，掛上「本日公休」的牌子，店裡是公休的，但是人

  卻無休，她一個人開著一台老車，顫顫巍巍地去到老牙醫的家中，途中經歷了幾次迷路，

  還把車子開到了田裡。



  兒子勸阿蕊把店收起來，收租金過日子。（劇照提供：威視電影）


  平凡是生命偉大的品質


  看著《本日公休》中的阿蕊，我想起了也是開理髮店的外公與外婆，外公三年前逝世，外

  婆今年已經91歲，兩個人都是瘖啞人士。他們很年輕就去瘖啞學校學習剪髮理容，在台北

  松山五分埔開設一間名為「如光」的理髮廳，也是一開就是四十年，在兩千年初歇業。我

  自小到高中前的頭髮，全是外婆打理。如今91歲的她，仍會幫我們這些孫子的小孩、她的

  重孫剪頭髮。


  平凡，聽起來是不特別、不突出，沒有什麼特別了不起的，可是，對我而言，一位理髮師

  ，記得「每一位客人」，不只是他們的頭髮，而是他們的生活：生小孩、娶媳婦，家裡人

  的生老病死，誰考上了高中、大學，誰又出國深造回來。這種「記得」，是人與人、生命

  與生命之間最寶貴的聯結。



  阿蕊幫孫子理髮，仍把前女婿當子女般互相惦記。（劇照提供：威視電影）


  它不是教會裡回報小組人數「表單」上面的「Data」數據，不是節慶裡才在手機通訊錄想

  起來的「某位朋友」，它或許就是沒有辦法記得很多；就像阿蕊的那間店，在她的兒女看

  來，規模永遠都是那樣，可是，它卻有永遠無法取代的，就是有個人，永遠把你放在心上

  ，即使你都忘記了，她卻記得。


  這種平凡的惦記，這種把日常當作無比重要的記憶，是平凡的，卻也是偉大的，因為它就

  是一種慷慨、一種付出、一種犧牲，卻也是一個人一生的志願，她的心之所嚮。



  （劇照提供：威視電影）


  基督教論壇報



  --'
