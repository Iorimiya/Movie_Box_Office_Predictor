url: https://www.ptt.cc/bbs/movie/M.1679360750.A.68F.html
title: '[新聞] 《本日公休》陸小芬大阪電影節獲獎哽咽 柯震東首拿導演獎肯'
content: '《本日公休》陸小芬大阪電影節獲獎哽咽 柯震東首拿導演獎肯定


  新聞網址：



  023年3月21日 週二 上午7:29


  [周刊王CTWANT] 第18屆大阪亞洲電影節19日舉行頒獎典禮，陸小芬主演台片《本日公休

  》以及柯震東執導電影《黑的教育》雙雙獲獎，陸小芬獲頒「最佳演員獎」，同時《本日

  公休》也拿下「觀眾票選獎」。柯震東也拿下「最具潛力創作者」獎（Most Promising

  Talent Award），這也是他首度以導演身分獲獎，並由代表劇組赴日參展的蔡凡熙替他上

  台領獎。


  柯震東因工作無法參加大阪亞洲電影節，他得知獲獎當下非常驚喜，除了希望《黑的教育

  》前往更多地方放映，也感謝所有劇組幕前幕後的工作人員，他說：「宣傳期跑了很多映

  後，也獲得了很多肯定，謝謝我的演員們，你們真的很棒！希望能有更多觀眾、更多地區

  可以看到這部作品，下一站！走起！」蔡凡熙代表上台拿獎，一度緊張到語無倫次，他回

  憶當下忽然聽到台上喊「KAI KO」，一時沒反應過來，被經紀人提醒才趕快上台，笑說：

  「真的是驚訝又開心，完全腦袋空白，不知道自己在講什麼，終於明白得獎者不知所措的

  感受了！」


  息影多年的陸小芬，這次復出演戲主演《本日公休》飾演溫暖的理髮廳阿姨，對於暌違多

  年再度獲獎，她一度熱淚哽咽：「二十年沒有白等，等了二十年才等這麼好的劇本，非常

  感謝傅天余導演，感謝觀眾朋友的喜歡與支持。」觀眾票選獎則是由導演傅天余代表上台

  領獎，表示十分謝謝大阪的觀眾：「我太訝異太開心了！我們昨天去梅田逛街的時候，遇

  到一位日本小姐有來看《本日公休》，她說非常非常的感動。我覺得很開心剪頭髮跟電影

  一樣，可以讓陌生人之間建立起很溫暖、很深刻的連結，這是為什麼我們永遠需要電影。

  」


  《本日公休》入選大阪亞洲電影節競賽單元，首次海外映演大受歡迎，兩場放映全數完售

  ，四百多位日本觀眾搶先觀看，陸小芬時隔二十多年再次參與國際影展，映後分享揣摩角

  色的心情，說道：「剪頭髮的戲很辛苦，但辛苦很值得，有師傅每天陪練才得到熟練的手

  藝，現在根本可以開理髮院了！」導演傅天余則是暢談電影背景，提起青春叛逆期不肯讓

  媽媽剪頭髮，觀眾都露出會心一笑。


  --'
