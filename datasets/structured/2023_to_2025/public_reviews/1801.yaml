url: https://www.ptt.cc/bbs/movie/M.1727153335.A.995.html
title: '[新聞] 《本日公休》導演傅天余 獲頒東京影展黑'
content: "《本日公休》導演傅天余　獲頒東京影展黑澤明獎\n  壹蘋新聞\n\n。傅天余執導\n的《本日公休》剛在日本上映，93歲名導山田洋次盛讚：「演員和工作人員充滿愛地描繪\n\
  了傳統理髮師的世界，日本為什麼拍不出這樣的電影呢。」他也是黑澤明獎評選委員之一\n。\n\n黑澤明獎表彰對電影界有卓越貢獻以及背負電影界未來的影人，睽違14年於2022年復辦，\n\
  。\n\n51歲的傅天余就讀政大日本語文學系，取得紐約大學媒體生態與電影研究所碩士，以小說\n家開始創作生涯，後來轉向電影製作，在吳念真指導下開始寫電影劇本，2009年拍攝第一\n\
  部電影長片《帶我去遠方》，2016年執導《我的蛋男情人》，之後改編自己媽媽的真實故\n事，吸引息影24年的影后陸小芬復出主演《本日公休》，在國內外斬獲不少獎項。\n\
  \n黑澤明獎評選委員指出，傅天余在現代社會延續1980年代台灣新電影的傳統，其執導的《\n本日公休》由吳念真擔任監製，以溫馨角度描繪老百姓生活的手法獲得高度評價，因此決\n\
  定頒予此獎。傅天余表示：「由衷感謝第37屆東京國際影展給予這份榮譽。我從尊敬的黑\n澤明導演和評選委員山田洋次導演的作品中，學到電影具有描寫人性本質的力量，也相信\n\
  電影能夠超越語言和時間，讓人們獲得理解和治癒。黑澤明獎對我是一個肯定，也相當榮\n幸能與這個名字一同置身電影製作的世界。」\n\n第37屆東京國際影展由香港影帝梁朝偉擔任評審團主席，香港名導杜琪峯、法國女星齊雅\n\
  拉馬斯楚安尼（Chiara Mastroianni）、匈牙利導演與編劇伊爾蒂寇恩伊達（Ildiko\nEnyedi ）與日本女星橋本愛，會一同出任評審團。影展的完整競賽片名單將於9月底公布\n\
  ，活動將於10月28日到11月6日登場。\n\n\n\n\n--"
