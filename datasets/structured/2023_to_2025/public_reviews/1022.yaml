url: https://www.ptt.cc/bbs/movie/M.1698938051.A.87B.html
title: '[討論] 【猩球崛起】系列最新作的預告釋出'
content: '原文影片連結：



  補上中文官方預告：



  導演是【移動迷宮】系列的Wes Ball。從預告還看不太清楚主線劇情，不過確定是來到更

  後面的時間線。不意外的話這全新系列應該會回收太空人失蹤的伏筆。


  CG感…有點重？沒有以前那種很重的寫實感。



  --

  族群衝突算是這系列的宗旨之一沒錯。

  算是值得開發的老IP

  我覺得舊版太空人的劇情還有很多能發揮的地方，提姆波頓那版就相對可惜了點。

  可理解啦，畢竟電影有時候講求的就是文字上無法表達的氛圍。

  動物園的劇情2011年演過了（？

  對，我也覺得不會第一部就放出這個大伏筆。我對這導演莫名有信心XD覺得三部曲應該拍

  得成。'
