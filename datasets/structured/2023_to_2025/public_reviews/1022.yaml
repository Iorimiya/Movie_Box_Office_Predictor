url: https://www.ptt.cc/bbs/movie/M.1716125808.A.0F0.html
title: '[  雷] 猩球崛起：王國誕生'
content: '防雷





































































  原本完全不打算去看的,但被請客就不去白不去了

  當年凱撒為主角的三部曲我幾乎都有在電影院看

  也很喜歡這三集和凱撒的領導故事

  對我來說不會有誰比凱撒更英明神武

  這次的新篇章可以說是有承先啟後的壓力

  而他的優缺點很是明顯,整體感覺普通偏好

  先講他最大的缺點：前面過於拖沓過長

  我猜是想開創新篇章的格局吧

  反而落入了這類型的窠臼了,造成了反效果

  到了凱撒二世之後才漸入佳境

  並展現自己應有的樣子,所以後面是很不錯的

  結局也稱職的以序章幫續集鋪路,帶出了格局

  我覺得會不會喜歡就看有沒有看過前三集

  如果沒看過前三集且能接受前面的鋪陳還是好看

  反之前中段就會想一直看時間

  我還是喜歡凱撒時代的時候,新篇章比較像決戰猩球

  總之這些版本都說著如出一徹的概念：

  無論是猩猩人類,骨子裡的掠奪慾都是強烈的

  差別在於人類披著猩猩的皮,猩猩披著人類的皮

  就看看下集會長怎樣囉,出了再說

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  一旦踏出去，就無法再回頭，朝三千世界的血海而去


  --'
