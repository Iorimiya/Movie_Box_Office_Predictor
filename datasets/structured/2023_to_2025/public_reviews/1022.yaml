url: https://www.ptt.cc/bbs/movie/M.1715589434.A.13A.html
title: '[普好雷] 猩球崛起：王國誕生'
content: '今天衝了一波猩球崛起:王國誕生

  自己是這系列的忠實粉絲，睽違那麼久還能看到新的系列很興奮XD

  以下有雷













  這集的時間設定是凱撒死後的幾百年

  受到病毒的影響人類基本上已經瀕臨滅絕

  猩猩主宰了地球

  基本上第一個系列人類跟猩猩的定位對調了

  以前是人類獵捕猩猩、現在是猩猩獵捕人類

  但不變的是兩者間互相衝突的心理

  雖然諾亞跟諾娃不像之前凱撒跟威爾之間有濃厚的情感

  但諾亞經歷過被種族洗禮，所以有著跟凱撒一樣的憐憫之心

  對於人類還保留了探索跟互相了解的空間

  我覺得他們兩個之間的關係比較像第二集凱撒跟馬康姆

  從互相的猜疑到後來的彼此信任

  但由於諾亞知道他對人類的了解還太少，還有很多觀察的空間


  基本上這集就是做為猩球崛起新世界的前菜

  一樣拉高了人類跟猩猩之間的衝突

  第四集的反派凱撒一直在強調猩猩不繼續進化跟擴張總有一天被人類關回籠子

  諾亞也知道他說的有幾分道理，加上進了發射井之後看到了以前的書籍

  他知道人類的貪婪跟威脅，所以他還是保持警戒

  片中一樣不斷拋出「人類是否能跟猩猩和平共存」這樣的思維

  結尾收得蠻不錯


  整部戲的核心重點主要有3個

  1.人類會說謊，不能完全相信

  2.猩猩在一起就會強大

  3.人類跟猩猩能夠和平共處嗎？


  --'
