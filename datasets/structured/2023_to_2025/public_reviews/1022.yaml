url: https://www.ptt.cc/bbs/movie/M.1715505175.A.C09.html
title: '[好雷] 猩球崛起：王國誕生 猩猩和人類'
content: '前幾天陪朋友一起看

  因為沒有看前面系列，所以無法和前面系列做比較

  個人覺得還不錯看，也不會有看不懂的問題

  有雷















  片長雖然偏長，但劇情節奏還可以

  視覺效果和特效也做得蠻好

  猩猩情感刻劃細膩，某幾幕的畫面看了很感動

  最後面的收尾也還不錯，感覺還會繼續出續集


  看到梅伊為了獲取裡面的寶物不擇手段

  還有最後結尾見諾亞最後一面背後藏了一把槍

  這兩段劇情凸顯出人類自私且善變的特性

  但同時也能理解她行動的初衷

  就算面對不同物種大屠殺、爭權奪利，也會保護自己的種族為優先

  人類用自己的手段保護同類，諾亞也同樣用畢生所學的知識保護族人

  最後一幕諾亞詢問梅伊：「猩猩和人類真的可以生活在一塊嗎？」

  梅伊則表示不確定，顯然可見的是兩族有了明顯的裂痕和不信任

  只要有一天兩方決定開戰，一定會毫無猶豫選擇保護自己的同類

  但我認為只要有效溝通，達成和平協議，就有機會實現和平共處


  儘管不是猩猩換作是其他的物種擁有智慧

  並且得到了技術與兵器，大概也是一樣的結果

  還是智慧其實是罪惡的開端？


  --'
