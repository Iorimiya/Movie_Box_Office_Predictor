title: '[新聞] 猩球崛起4：王國誕生 首支前導預告'
content: '新聞網址：



  官方劇情簡介：本片背景設定在《猩球崛起：終極決戰》落幕的多年以後。自從凱撒將他的

  人民帶往綠洲至今，許多猿猴社會已經發展蓬勃，而人類則退化成了野蠻生物。但由於年代

  相隔久遠，有些猿猴甚至已經從沒聽過凱薩的事蹟，而有些派系則扭曲了凱薩的教義來建立

  新的帝國。


  在這樣的世局下，有隻猿猴首領開始奴役其他同類以尋找人類失落的科技，而另外一隻親眼

  看見自己的氏族被擄走的猿猴，則踏上一趟尋找自由的冒險。過程中，一名年輕人類女性成

  了這趟自由征途的關鍵人物，但她也另有自己的盤算。


  --------------

  雖然很多人說第三集崩，但我倒是覺得不差

  尤其我很喜歡驢子那個角色


  年輕女性應該就是第3集的小蘿莉吧

  看完3留下的疑問就是她如何以人類身份在猩猩族群中生存

  終究是非我族類 其心必異QQ


  ----

  Sent from on my HUAWEI NXT-L09


  --

  是哦 我翻翻舊文。倒是覺得這系列第一集糟點就很多了

  防衛線吧。這個倒是真的蠢，但好像也可以解釋成是資源拮据下的產物

  雙方都有低能將領'
