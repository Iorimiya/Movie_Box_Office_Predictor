title: '[  普雷] 猩球崛起，王國誕生，普普的猴子片'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~







  片長蠻長的，二小時多，前面鋪陳平平，


  看到有點睏，整體來說就是食之無味，棄之可惜的感覺。


  特效場景還行，但是劇情就普通，整齣戲的重點就是不能相信人類。


  不過最後收尾我覺得收的不錯，男主猩一路上都幫助女主角，相信女主角，女主角最後要

  走時，還屁股藏手槍去找男主猩，想要把潛藏的威脅解決。


  結論，人類就是白眼狼，非我族類 其心必異。


  如果有第四部，應該就是 猩猩 一起 強大 ，對抗白眼狼人類。


  題外話，最近在追Netflix 的無恥之徒，看到法蘭克加拉格在片中就非常出戲了。


  --'
