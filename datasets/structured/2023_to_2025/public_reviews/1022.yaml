url: https://www.ptt.cc/bbs/movie/M.1715165111.A.E83.html
title: '[微好雷] 猩球崛起：王國誕生'
content: '三部曲粉絲 個人覺得好看


  電影前面有提供不少資訊，不需要了解太多前三部曲也可看


  劇情上有點像第三集跟美國內戰，類似公路電影的設計







  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~












  - 開場從凱薩的葬禮開始，能再見到莫里斯跟火箭是意外的驚喜


  但意識到想找小女孩Nova的時候已經錯過了，有人有注意到嗎？



  - 從主角諾亞跟兩個夥伴尋找老鷹蛋開始


  逐步的跟著主角三人組的腳步


  認識劇裡相差近300年、現實也相隔7年多的世界


  節奏雖然不快，但說不上冗長


  3人之間的關係、家庭關係、部落間的衝突，到這個世代人類的樣貌


  很順暢的建立起整個世界觀，感受上有點像尼爾：自動人形的末世感



  - 令人意外人類的戲份算是被壓到最低


  除了反派陣營中的一位跟結尾帶出的伏筆之外


  其他人類幾乎都在預告就已經出現


  讓這部片更多的是以兩派猩猩間的衝突為主


  但結尾又留下了人類回歸的伏筆



  - 拉卡作為紅毛猩猩果然承襲了莫里斯的定位


  智慧與文明的象徵，還有可愛的一面：




  續集應該還有他的戲份吧….對吧？



  - 反派凱撒給人一種颯爽感


  面對自己的慾望與目的毫不掩飾


  又在有計謀的情況嘗試籠絡人類、諾亞等不同角色


  並且清楚知道要達到目的，需要什麼步驟


  這系列裡的反派過去都是讓人反感的編排


  但我反而覺得這次的凱薩是有魅力的角色


  並且會期待續集可以再次出現



  - 最後結尾主角群門回到了家園開始重建


  但在交錯剪輯間才揭露出人類方的勢力與目的


  作為續集的伏筆，有種山雨欲來的感覺


  但我是希望如果要出，可以不要再像先前一樣


  每部之間都拉到3年的時間


  這個系列感覺需要更緊湊的推出讓人有記憶阿！




  --'
