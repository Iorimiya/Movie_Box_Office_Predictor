url: https://www.ptt.cc/bbs/movie/M.1715778663.A.0B7.html
title: '[普好雷] 猩球崛起：王國誕生 喜歡Raka'
content: '開場畫面挺震撼的，雖然鋪陳有點長但猩猩的表情很真實

  動態捕捉真的強

  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~









  電影中反派Proximus Caesar連同族都不放過，埋下導火線

  除了主角Noa因為家園被毀同族被擄的成長外

  不得不說Raka這角色真的很討喜也充滿智慧與信念

  落水那一剎那因為髮型太真讓我不小心笑出來

  還有偽裝成失去說話能力的女主角Nova

  有著要幫助人類復興的決心

  讓Noa從排斥、猜疑、接受到最後的對立

  最後畫面留在人類和猩猩可以共存這件事打上問號？

  埋下續集的伏筆


  雖然在Caesar死後三百年，猩猩的智慧沒有更進化所以有點小失望

  但不影響電影的精采度，尤其是Nova真的加分

  個性滿冷血的，目標性也很明確，敢愛敢恨的感覺

  我自己是覺得她應該是訓練有素的特務

  才會有肉搏技能、槍法還很準，希望針對她的身份背景能有更多描述


  最後真心覺得Raka不會就這麼死掉吧QQ


  --'
