title: '[普雷] 猩球崛起:王國誕生'
content: "防雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n先說優點:\n1. 劇情故事可以順順看\n\n2. 畫面拍得還不錯\n\
  \n缺點:\n1. 反派刻劃不夠立體 感覺就無腦暴君 登場時間也少 看預告片時還很期待 看完後失望\n\n2. 感覺這部想把新的主角諾亞對比當年的凱薩 善良、頭腦聰明\n\
  \   但領導風範差很多 有點像弱化的凱薩 只有最後指揮老鷹還可以\n   很多有機會表現的地方都點到為止 而且一直被人類女主欺騙\n\n3. 配角打醬油 就諾亞和他的快樂夥伴們\n\
  \   唉 好懷念當年這張和凱薩一起並肩作戰的畫面 霸氣十足\n   \n   紅毛猩猩感覺可以再多一點故事 怎麼就領便當了QQ\n\n4. 故事格局偏小 人類想恢復語言\
  \ v.s. 猩猩想取得人類科技\n   最後結局落在人類是否能和猩猩共處\n\n\n原本以為這部會接回決戰猩球的劇情，但看起來是拍了一個全新的走向\n也沒什麼致敬的畫面\n\
  紅毛猩猩把窗戶圖案的項鍊傳給諾亞時還有點感動\n沒想到最後諾亞把他給人類了...\n結局看起來是還有續集\n整體來說這部還算給過 但格局小、角色刻劃不夠\n\n\
  --\n謝謝提醒 已更正"
