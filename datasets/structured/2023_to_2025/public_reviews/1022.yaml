url: https://www.ptt.cc/bbs/movie/M.1715665841.A.E7D.html
title: '[討論] 猩球崛起：王國誕生 猩猩騎馬'
content: '先說我沒有看猩球崛起前三部

  看到猩猩騎馬覺得超新奇的，看完後一直跟朋友討論


  不知道大家會不會有一樣的想法，覺得猩猩騎馬很不科學

  所以想科普一下


  首先是馬大概可以負重多少？

  第二是馬有跑得比猩猩快嗎？


  針對第一題：我查馬一般可負重的範圍大概落在80-100公斤

  而一隻猩猩一般重量是在100公斤以下的

  但我也有查到比較大的猩猩會超過100公斤

  像是凱薩二世跟拉卡我覺得肯定有超過！真是辛苦他們的馬了



  第二題的話：猩猩的時速大約落在40

  馬認真跑起來可以到70

  人類才13難怪會輕鬆就被猩猩抓到了

  但看來猩猩完全有騎馬的理由XD


  偏題了，回到電影本身

  我覺得劇情蠻有意思的，把人類和其他物種共存的議題描述得很仔細

  不論在實際或感性層面都探討了不少

  尤其是結局女主的行為，讓我感受到人性的自私與不信任感真的根深蒂固

  會有些不同的反思

  此外場景也很美，電影偏長但帶我們探索一個個場景也挺有趣

  像是在玩單機遊戲一樣

  如果是喜歡畫面視覺好看、劇情派的網友可以去看！


  --'
