title: '[超級大負雷]猩球崛起：王國誕生--沒落與無知 '
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\n觀影時間:5/9\n\
  \n1.畫質太差了(也許是為了呈現出原始感)\n\n2.看10分鐘就知道完蛋了，整體電影色彩定調偏暗黑色與紅色(當恐怖片也不夠驚悚)\n\n3.猩猩手腳並用程度極低，尾巴也沒戲份(演的跟人沒差異)\n\
  \n4.手語成分剩4個動作(大扣分)\n\n5.片頭火化了凱撒看到很感動。後來才發現，原來開頭是告別式(Bye Bye Caesar)\n\n劇情透過未成年的猩猩諾亞的無知來呈現幾百年後世界的變化\n\
  \n凱撒對人類的感情沒有傳承後代\nApes Together Strong淪為政治口號\n有部分猩猩具備自我學習能力(二世)\n猩猩沒有教學系統\n拉卡則是作為凱撒教派的傳人傳達的訊息顯得薄弱與滑稽\n\
  人類還沒死完\n\n\n槽點1.整族養老鷹跟凱撒完全沒關係\n    2.猩猩帶金項鍊\n    3.猩猩住在破船上面\n    4.幾百年了，望遠鏡沒壞也卡灰了吧?是能看到什麼?\n\
  \    5.海邊帳篷搭(阿凡達:水之道即似感)\n    6.猩猩諾亞與太陽鷹(阿凡達即似感)\n    7.(Mae / Nova)的子彈比刺客聯盟還厲害\n\
  \     (只開一槍穿過猩群，不傷人質，不傷閃電手臂，直穿閃電心臟)\n    8.諾亞VS二世(黑豹即似感)\n    9.沒有血流成河\n   10.在沒有英雄氣質的猩猩身上強套英雄光環\n\
  \n 結論:(Mae / Nova):這個世界本來就是我們的，我們只是要把它拿回來\n\n      電影票的錢本來就是你們的，我只是希望能幫你們省下來\n\n\
  --"
