url: https://www.ptt.cc/bbs/movie/M.1715252699.A.DAB.html
title: '[討論] 猩球崛起:王國誕生 女主身世問題 雷'
content: '剛看完猩球崛起：王國誕生

  想請教一下女主角的身世問題

  --有雷--




















  1.電影一開始凱薩二世就想抓捕梅伊

  一開始看不出梅伊的特別之處

  最後知道凱薩二世是要梅伊幫他開碉堡的門

  但凱薩二世是怎麼知道梅伊很聰明？

  又或是怎麼知道梅伊去過碉堡懂怎麼開門？

  （尤其是梅伊裝笨騙諾亞他們）


  2.另外電影結尾梅伊把東西給碉堡夥伴時

  碉堡的人出到地表是要穿防護裝的

  這點有呼應到電影開頭說的降智病毒

  也間接說明人類尚未製作出解藥

  但她可以不穿防護服就代表她有抗體？

  想知道她的身世到底是什麼？

  看有些推測是說可能跟前傳決戰猩球有關

  片中有段諾亞跟梅伊沉迷於太空望遠鏡

  再加上那段還有一個穿太空裝的猩猩壁畫

  因此猜測女主有可能是太空穿越回到地球的？


  看完這篇文章真的覺得他可能是太空人，好奇大家的想法



  --'
