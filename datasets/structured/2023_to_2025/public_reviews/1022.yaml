title: '[情報] 《猩球崛起：王國誕生》正式預告'
content: '自從300年前凱薩將他的人民帶往綠洲，猿猴社會已然發展蓬勃，人類則退化成了野蠻生

  物。但由於年代相隔久遠，有些猿猴甚至從沒聽過凱薩的事蹟，有些派系甚至扭曲了凱薩

  的教義來建立新的帝國。


  在這世局下，普西姆斯開始奴役其他同類尋找人類失落的科技，而親眼看見自己的氏族被

  擄走的諾亞，則踏上一趟追尋自由的冒險。過程中，一名年輕人類女性成了這趟自由征途

  的關鍵人物，但她也有自己的盤算。


  《猩球崛起：王國誕生》定於2024年5月10日美國上映。






  --


  感謝A大！


  感謝f大，提前上映了沒錯！'
