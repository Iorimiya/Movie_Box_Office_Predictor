url: https://www.ptt.cc/bbs/movie/M.1699024274.A.634.html
title: '[新聞] 《猩球崛起》磅礡終章！首支預告見證王國誕生'
content: "《猩球崛起》磅礡終章！首支預告見證王國誕生\n\n2023/11/03 14:09\n\n\n《猩球崛起：王國誕生》前導海報。（二十世紀影業提供）\n\
  \n〔記者許世穎／綜合報導〕賣座史詩系列《猩球崛起》繼2017年《猩球崛起：終極決戰》\n後，相隔7年推出新作《猩球崛起：王國誕生》，並於昨晚曝光首支預告和前導海報。電\n\
  影改由《移動迷宮》三部曲導演威斯柏執導，將為造成全球轟動的史詩鉅作《猩球崛起》\n系列注入新生命。\n\n該系列重啟自1963年科幻經典《浩劫餘生》系列，也曾於2001年拍攝新版《決戰猩球》，\n\
  直到2011年以《猩球崛起》重啟獲得巨大成功，陸續於2014年拍攝續集《猩球崛起：黎明\n的進擊》、2017年推出第三集《猩球崛起：終極決戰》。\n\n《猩球崛起：王國誕生》背景設定在凱撒統治的後幾代，猩猩成為主導種族，人類被迫生\n\
  活在陰影中。隨著新的暴君建立起他的帝國，一隻年輕猩猩將踏上艱險旅程，迫使他質疑\n過去相信的一切，做出將影響猩猩和人類未來的選擇。電影將於2024年5月大銀幕登場。\n\
  \n《猩球崛起：王國誕生》預告：\n\n\n\n--\n佛教經典的\n是 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\
  \n\n--"
