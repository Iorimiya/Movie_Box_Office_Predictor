content: '我搞不懂為什麼會有人看這部？


  這系列剛出的時候題材還滿新的，


  畢竟那時候科幻題材偏少，


  嘗試一下不同的世界觀也不錯，


  但放到現在都2024年了！


  還要再拍到第四集？


  有一堆科幻片像是《沙丘》、《阿凡達》，


  例子多到我懶得想…


  誰還想看猴子或猩猩打架？


  超級浪費電影資源去拍這部電影的，


  我寧願看糯米腸都比看猩猩還好…


  所以誰會去看啊？可以噓我一下



