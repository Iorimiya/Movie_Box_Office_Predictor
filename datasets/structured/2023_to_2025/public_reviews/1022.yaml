content: "因為那跟本不是猩猩阿\n\n將近十年前本吉看黎明的進擊的時候\n有在本版po過一篇文\n就說了會講人話的不是猩猩\n只是長得像猩猩的人類\n\n\
  整個故事就是末日後兩個人類部落的競爭而已\n\n\n\n那時候一直被嗆說甚麼那是基因改造的猩猩\n還連變形金剛都拿出來舉例了\n說甚麼是本吉搞錯\n\n只能說先知真的就是寂寞的\n\
  在民智未開的時期，真的不能顯示自己的真知灼見\n哀\n\n--\n預計退文將由 1 篇變成 0 篇，確定嗎[y/N]? \n我願意遵守站方規定,組規,以及板規[y/N]?\
  \ \n我願意尊重與不歧視族群,不鬧板,尊重各版主權力[y/N]? \n我願意謹慎發表有意義言論,不謾罵攻擊,不跨板廣告[y/N]? \n\n--"
