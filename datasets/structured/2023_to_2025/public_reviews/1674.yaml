url: https://www.ptt.cc/bbs/movie/M.1683030512.A.BD5.html
title: '[新聞] <追殺代理人>劉思慕默契搭檔<阿凡達>的他'
content: '新聞網址：



  懸疑動作強檔新片《追殺代理人》（Simulant），即將在本週五（5/5）於全台震撼獻映

  。本片卡司眾星雲集，不僅有山姆沃辛頓（Sam Worthington）領銜主演，讓導演艾波穆

  倫（April Mullen）都超驚喜可以邀請到他加入劇組；還找來以《尚氣與十環傳奇》（

  Shang-Chi and the Legend of the Ten Rings）晉身好萊塢巨星的劉思慕（Simu Liu）

  擔任關鍵角色，兩人將在片中上演鬥智鬥力的精彩對決！此外，劉思慕與飾演機器代理人

  的羅比艾梅爾（Robbie Amell），不僅在戲內成為重要夥伴，連戲外都展現絕佳默契，讓

  導演大讚：「火花十足！」





  卡司一字排開，只能說豪華無比的《追殺代理人》，邀請到演出《阿凡達》系列（Avatar

  ）的山姆沃辛頓，以及《尚氣與十環傳奇》劉思慕，兩大炙手可熱的好萊塢巨星在片中精

  采對決！不僅腦力爆發與對方進行攻防戰，更有俐落暢快的對峙場面，鬥智也鬥力的對手

  戲，非常值得進戲院透過大銀幕好好欣賞。



  能夠集結如此強大的主演群，就連導演艾波穆倫都直呼幸運，尤其山姆沃辛頓點頭接演，

  成為本片談成的第一個主演，更讓導演對他願意接演感到又驚又喜，談及雙方合作的情況

  時，導演也分享道：「他答應要和我一起合作時，徹徹底底地震驚到我，他會在清晨五點

  寫信給我，詢問角色的深度、科技智能的意義等，在片場他也是最為謙虛又親切大方的演

  員。」對此，山姆沃辛頓回應：「剛認識她時，我就覺得她很酷，有一些很酷的想法。我

  很喜歡參與獨立電影製作，那也算是我的背景之一，不論電影規模的大小、形式，或是電

  影將會在哪上映，都不會影響我的選擇。」言談中可以感受出他謙遜又隨和的性格。





  值得一提的是，劉思慕在《追殺代理人》中，不只一反過去大眾所熟悉的黑髮形象，改以

  全新金髮造型示人，更在片中扮演關鍵角色，為劇情掀起一波高潮。片中，他以工程師身

  份出現在男主角艾文（羅比艾梅爾飾演）身邊，協助他贏回另一半的芳心，兩人更因此成

  為相互照應的重要夥伴。除了戲內流暢配合，戲外的劉思慕與羅比艾梅爾，更是從開拍前

  就展現絕佳默契。根據導演透露，雙方十分碰巧地在同一時間答應本片邀約，更稱讚他們

  合作起來「火花十足」！



  當聊到與劉思慕的合作過程時，羅比艾梅爾也大讚他：「劉思慕超棒的！我是他的粉絲，

  有看過一些他的電視節目，我也愛《尚氣與十環傳奇》這部電影，所以合作時，向他請教

  片中『公車』的那場戲，也問了好多關於漫威的事情。」他更透露兩人擁有不少共通點：

  「和他相處起來很愉快，我們有共同朋友，還剛好都有玩同一款線上遊戲，所以相處起來

  就像是回到青少年時期！」



  這部以未來世界為背景的動作驚悚強片《追殺代理人》，即將在本週五（5/5）於全台震

  撼獻映。本片劇情描述在不久後的未來，機器代理人盛行在人類的生活當中。菲（喬丹娜

  布魯斯特飾演）在丈夫艾文（羅比艾梅爾飾演）車禍逝世後，試圖運用代理人來取代他。

  儘管這個代理人各方面都跟艾文相似，但她卻沒辦法像愛丈夫一樣愛他；而代理人為了贏

  取菲的芳心，轉而向突然出現在身邊的工程師凱西（劉思慕飾演）尋求幫助。同時，政府

  發現這群機器代理人逐漸違背初始設定原則，開始擁有自我意識，對人類可能存在潛在威

  脅，因此在特務凱斯勒（山姆沃辛頓飾演）的帶領下，開始全面追擊這群機器代理人…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
