title: '[普雷] 《追殺代理人》街上有多少似人非人'
content: '一模一樣的你是否一模一樣？


  2023年因為人工智慧可以模擬人對談、諮詢、繪圖等功能釋出於大眾後，造成各方討論，

  例如繪師是否會被AI繪圖給取代，還有AI聊天機器接收資訊的錯誤別，此外還有關於這些

  AI的出現是否會有人類工作被替代而造成就業問題。


  過去這類型的討論就層出不窮，而直到真的出現人類才開始意識到過去的科幻想象可能成

  真。


  電影《追殺代理人》是一部探討人的本質，與機器人隨著時代演進到最後可以到怎麼樣的

  地步？或是機器人脫離限制是否為人？故事以艾文總是做一個自己車禍的惡夢，但藝術家

  老婆菲總是不告知事情的答案，另一邊政府正在追查一位逃離主人的機器代理人，追查到

  神秘工程師凱西，而這時艾文發現菲好似與凱西達成了某項協議？







  《追殺代理人》是什麼電影？


  說起機器人是否有人心，且還有害怕越來越像人的相關制約想像，在很早的時候就出現在

  科幻創作之中。美國科幻小說家－薩艾西莫夫在50年代創作的小說《我，機器人》中所訂

  立的「機器人三定律」一直到現在影響了一代人的機器人科幻的創作守則，分別為：機器

  人不傷害人類，保護人類；不違背傷害情況下，機器人必須服從人類；不違背前兩項法則

  前提下，機器人必須保護自己。


  這樣的定律影響很多後面的機器人相關創作，而也間接讓機器人這概念在現實中留下很多

  想像，例如從真實世界和創作都備受影響的日本。


  以日本漫畫之神－手塚治虫1949年經典漫畫作品《大都會》為例，就以人類與機器人的大

  城市為背景，帶出人類責怪機器人奪走他們的工作，人類與機器人之間的對立話題，與機

  器人是否與人一樣擁有感情和心，或數據演算？即便到現在還是許多科幻創作的熱門題材

  。








  《追殺代理人》的故事也脫離不了這樣的探討，代理人是一種現代技術最接近人類的機械

  人，但在他們身上還是有古老的機器人三原則的限制性。


  每天都會做車禍的艾文，想不起來很多事，也覺得為何自己不能離開老婆菲的身邊，和菲

  看自己時總是露出露出微妙的神情，另一方面機器人與政府單位正在追查最近許多最新一

  代機器人逃過限制，脫逃人類掌握的情況。


  發現這一切的失控可能與一位神秘的工程師凱西有關係，這時艾文的老婆菲卻跟凱西搭上

  線，似乎正做出某種抉擇。艾文不知道為什麼菲做出總總怪異行徑，而出現的凱西願意幫

  他搞清楚狀況，但隨著時間推進，艾文覺得事情是否不如自己想像中單純，而他與老婆菲

  的關係也越來越微妙。












  《追殺代理人》分析與延伸：


  這部作品的發想其實是在2015年前，以人心與人工智慧作為發想還思考，其中包含著人類

  對未來與機器人一起群體生活的想像，從根本上討論人創造出了類似人的物體，但卻不相

  信自己有創造人心的本質，這樣一個矛盾的情感。


  經過數據演算與模仿的非生物是否有感情與自我性，是這部電影想要探討的地方，也是電

  影中很大方向的主題。


  編劇萊恩克里斯多福邱吉爾表示，他參考很多科幻元素的創作，其中新、舊版的《大都會

  》都對於他有很深的影響。其中日本的動畫片也幫助他思考關於一個有心的機器人到底是

  模仿人類還是發自內心，其中也特別提到《夏娃的時間》。也針對這些故事的背景創作一

  個更貼近機器人與人共生的社會。










  而不管是《追殺代理人》或其他關於機器人是否有人心的探討，都逃離不了關於族群對立

  的議題，例如機器人是否跟人一樣擁有人權？或是是否能稱之為生物？並且當機器人有獨

  立思考後是否真的會取代掉人類，為人類帶來滅亡的恐懼。當然探討機器人的除了硬核的

  科幻創作外，也有很多想法是更細膩且有柔軟性的。


  例如：創作過《庫洛魔法使》、《聖傳》等經典作品的漫畫團體CLAMP就曾創作出男子與

  廢棄物人型少女之間的愛戀故事《Chobits》，可以說是在探討機器人是否為人之前，先

  探討人類自己的戀物情結。


  並且過去動畫作品如《攻殼機動隊》、《原子小金剛》等都有探討關於人工智能的相關議

  題，而如今隨著人工智能釋出和進化程度超越科學家的想像，也有是否要繼續研究機器人

  的擬人性的正反聲音。











  《追殺代理人》值得一看嗎？


  這部電影可以看出導演和編劇想要努力營造出一個機器人與人類矛盾感，也想展現出機器

  人與人類共存下所發生的矛盾性，和機器人解除限制的時候發現的不真實感，越來越接近

  人那般所產生的變化。


  但整體下來故事劇情非常地緩慢，且可以明顯看出資金的不充裕，還有三個交織的故事性

  卻略感薄弱，讓整部電影不溫不火，很難吸引人與讓人有帶入感。


  對比一些以動作戲、或情感堆加的機器人與人矛盾感的科幻故事來說，《追殺代理人》並

  不算是難看或難懂的電影，但面對許多同樣類型的主題，就沒有太多的特殊性，探討的議

  題也是千篇一率的機器人是否為人、機器人的壓迫、人類是否被機器人取代等，少了有趣

  的新探討點，可以說是老調重彈、了無新意。










  雖然有著一些知名的演員出演，且動畫也有一定的水準之上，但我認為編劇在考慮主題線

  時，太多地方在強調艾文與老婆之間的感情，和之間那曖昧不明的認同感，太多鋪成卻沒

  有在最後有很好的反轉，也無法跟另外兩條支線有好好的呼應與對應感，讓三條明明在同

  個故事裡，卻如同陌生人，讓整體故事變得又臭又長，卻沒有什麼驚喜。


  我認為即便是過去的想法頗為新鮮的人工智慧與人心，但到現在看過很多創作與正在現在

  進行式接觸人工智能的觀眾，這樣半吊子的機器人電影，是很難有吸引力的。


  並且沒有張力這點可說是整部電影的死穴。我認為如果要拍攝這類的電影要與時俱進的探

  討出新東西，而不是將前人經典拿來東拼西湊，而沒有半點自己的觀點，這會讓故事導向

  無趣，還不如回顧老電影要來得實在。


  --

  個人Blog：

  小說連載頁：


  --'
