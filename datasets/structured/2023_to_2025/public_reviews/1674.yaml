title: '[新聞] 【追殺代理人】男主角海報撞臉「阿湯哥」'
content: '新聞網址：



  年度懸疑動作強片《追殺代理人》（Simulant），即將在5月5日於全台震撼獻映。本片驚

  悚程度直逼《銀翼殺手》（Blade Runner），由演員出身的加拿大美女導演艾波穆倫（

  April Mullen）執導，集結《阿凡達》（Avatar）山姆沃辛頓（Sam Wothington）、《尚

  氣與十環傳奇》（Shang-Chi and the Legend of the Ten Rings）劉思慕（Simu Liu）

  、《惡靈古堡首部曲：拉昆市》（Resident Evil: Welcome to Raccoon City）羅比艾梅

  爾（Robbie Amell），以及《玩命關頭》（Fast & Furious）喬丹娜布魯斯特（Jordana

  Brewster）領銜主演！為了讓觀眾體驗片中未來世界的虛無冰冷感，本片特別選在寒冬拍

  攝，竟讓「關鍵場面」變成一場災難。值得一提的是，台灣片商近日釋出中文海報，也引

  發網友熱議。不僅討論中文片名，提問這是不是「老布」布魯斯威利（Bruce Willis）的

  《獵殺代理人》（Surrogate）續集，就連海報上的羅比艾梅爾，也讓大家直呼神撞臉「

  阿湯哥」湯姆克魯斯（Tom Cruise）！





  《追殺代理人》以機器代理人盛行的未來世界為故事背景，為了呈現冰冷又虛無的高科技

  環境，導演艾波穆倫特別選在寒冬進行拍攝：「這樣子可以讓天空有一種廣闊又虛無的感

  覺，沒有任何綠色，沒有一點生機，全片都呈現出單調的灰暗與空洞。」只不過這樣的精

  心規劃，卻讓拍攝關鍵場面時，讓劇組反而面對如災難般的拍攝現場。導演對此嘆氣透露

  ：「當時下了傾盆大雨，遍地又都是冰雪。片中可以看見我們有很多特技動作，現場也需

  要電線工程，卻因為天氣、路面結冰這些問題，讓原本放置器材的地方都不能放了，還因

  為下雨導致地面踩起來軟爛，讓我們不得不重新調整拍攝場地。」回憶拍攝當天的情景，

  她仍是不停搖頭表示：「那是我們最痛苦的一天！」



  同樣因為寒冬而大呼困難的，還有以《玩命關頭》系列出名的喬丹娜布魯斯特。不同於《

  玩》片可以大肆狂飆、盡情甩尾，為了避免打滑意外發生，她必須非常小心地在結冰路面

  駕駛，這也讓她笑稱：「我得學著如何控制不去踩油門！」開車是一大困難外，擁有非常

  多游泳戲分，卻又不黯水性的她，也是極具挑戰的拍攝。雖然劇組特別為她準備替身演員

  在旁待命，但她仍堅持由自己完成所有游泳畫面，不僅讓導演印象深刻，連她本人都十分

  驚喜。此外，為了詮釋片中試圖運用代理人來取代已故丈夫，卻又無法接受、甚至抗拒對

  方的妻子角色，當談及跟男主角羅比艾梅爾的合作時，她也直喊尷尬：「羅比真的很棒！

  那個尷尬與處不來是從劇本而來的，我一直抗拒一個在那裡為我敞開心房的人，這很心碎

  ，有一部分的我在吶喊：『她幹嘛不試試呢？是妳做的！妳創造他就要承擔這些後果！』

  演起來很有趣，但那種尷尬感確實讓我感到非常不舒服。」





  值得一提的是，台灣片商近日也釋出《追殺代理人》中文海報，一曝光就讓網友熱議這是

  否為2009年由布魯斯威利演出的《獵殺代理人》續集，不知道是隔十幾年後的最新續作？

  還是重新翻拍？但事實上兩部電影並未有所關連。至於引發網友熱議的，還有位在海報正

  中間的羅比艾梅爾，他俐落的短髮、身穿黑色大衣，以及右手持槍的模樣，乍看之下竟神

  似好萊塢巨星湯姆克魯斯，也讓網友們留言狂刷：「我還以為是阿湯哥演的」「主角遠看

  好像阿湯哥」「阿湯哥+1」「沒放大圖片看，還真以為是阿湯哥要出新片了」等趣味回覆

  ，成為在片商意料之外的討論話題！



  這部以未來世界為背景的動作驚悚強片《追殺代理人》，即將於5月5日於全台震撼獻映。

  本片劇情描述在不久後的未來，機器代理人盛行在人類的生活當中。菲（喬丹娜布魯斯特

  飾演）在丈夫艾文（羅比艾梅爾飾演）車禍逝世後，試圖運用代理人來取代他。儘管這個

  代理人各方面都跟艾文相似，但她卻沒辦法像愛丈夫一樣愛他；而代理人為了贏取菲的芳

  心，轉而向突然出現在身邊的工程師凱西（劉思慕飾演）尋求幫助。同時，政府發現這群

  機器代理人逐漸違背初始設定原則，開始擁有自我意識，對人類可能存在潛在威脅，因此

  在特務凱斯勒（山姆沃辛頓飾演）的帶領下，開始全面追擊這群機器代理人…。



