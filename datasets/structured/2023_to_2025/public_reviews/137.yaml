content: '【】名導最新懼作！




  百年怨念 恐懼襲來《》


  9月12日(五) 全台上映





  千萬不要喚醒她…


  《》名導恰克羅素最新力作


  《《》女星麥蒂遜艾斯曼共同演出


  爛番茄影評100％滿分超好評盛讚


  艾蜜莉（麥蒂遜艾斯曼 飾）和克里斯汀（亞倫多明格斯 飾）打算翻修一間老房子，打造

  他們夢想中的餐館。


  然而，這樣美好的願景，卻在艾蜜莉撿到一塊古老的通靈板後有了轉變。


  自從艾蜜莉使用過這塊通靈板後，她的周遭開始出現各種靈異現象，令她身心飽受折磨。


  為了讓兩人的生活重回正軌，克里斯汀安決定向神祕學專家亞歷山大（傑米坎貝爾鮑爾

  飾）求助。


  原來，這一切跟一名17世紀遭到迫害的女巫有關……


  --

  又在造謠了喔？直接檢舉'
