title: '[新聞] 「小海女」再次徜徉大海【天間莊三姊妹】'
content: "新聞網址：\n\n電影【天間莊三姊妹】改編自人氣漫畫家高橋努的漫畫《Skyhigh》（中譯《心魔大審判\n》）之同名外傳。由曾經獲得無數國際電影節最佳導演的北村龍平執導，找來人氣女星\n\
  Non飾演迷失在天界與人間的老么，與前AKB48王牌大島優子、演技派女星門脇麥飾演三姊\n妹，另外還有柏林影后寺島忍、三棲女星柴崎幸、金獎影帝永瀨正敏、高良健吾，以及近\n\
  期以BL劇【美麗的他】大受歡迎的人氣男星萩原利久參與演出，演員陣容堅強。Non此次\n也繼前作【魚之子】後再次徜徉大海，親自下海與海豚共舞。Non表示，這次為了能成功\n\
  演出海豚訓練師的角色，開拍前和海豚一起受訓了兩個星期，「因為海豚的注意力只有大\n約15分鐘，老實說要快速掌握訣竅非常困難。這次我們要拍一個海豚跳躍的畫面，而我也\n\
  有著絕對要拍出最好的鏡頭的使命感，拍這場戲時我的心臟一直怦怦跳，真的非常緊張！\n」所幸「小海女」Non再次成功在大海中，沒有仰賴任何特效，親自完美演出，令導演及\n\
  製片大為讚賞。\n\n事實上，導演北村龍平起初向【謝謝你，在世界的角落找到我】製片真木太郎提案時，便\n率先指定希望由女星Non演出主角玉江，因為高橋努十年前在創作這部漫畫時，便是以Non\n\
  作為這個角色的雛形。對此，後來才知道真相的真木太郎表示，「一切就像是命中注定！\n這是一部以溫柔卻強韌的力度描寫『活著』這件事，能讓很多人獲得勇氣的電影，Non纖\n\
  細的演技也使讓我深受感動。」本片的片尾曲則請來經典歌手玉置浩二以及絢香共同演唱\n，動人的歌聲讓Non感動表示，「結尾玉置浩二和絢香的歌聲美好而深植人心，讓我在看\n\
  電影當下所隱忍的淚水終於得以溢出眼眶。」【天間莊三姊妹】將於2月3日在台上映。\n\n老字號旅館「天間莊」位於天界與人間的交界，有著依山傍海的美景。當肉身處於瀕死狀\n\
  態，死神會引導迷惘的靈魂來到天間莊稍事休息，再決定是要心無罣礙地離開或是重返人\n間了卻心願。天間莊的老闆娘惠子（寺島忍 飾）還無法忘記拋家棄子的前夫，因此每天\n\
  都過著醉生夢死的生活，她和大女兒望美（大島優子 飾）及二女兒香苗（門脇麥 飾）一\n起打理旅館，提供遊蕩的靈魂們一個暫時的棲身之處。某天，一名少女因為在人間遭遇交\n\
  通事故而陷入了昏迷，她在死神的引導之下入住天間莊，沒想到這位女子居然是她們同父\n異母的小妹玉江，且提出了希望在天間莊工作的要求…超值預售套票即將於博客來售票網\n\
  開賣，購買單人套票即可獲得「中文全開海報」壹張，贈品數量有限，送完為止。憑本片\n電影票根，還有機會獲得 大芳白粉廠 提供之「北投白磺溫泉粉入浴劑・100%純天然【熟\n\
  客指定・10次泡澡用】」壹份，更多活動及電影詳情請洽天馬行空粉絲團。\n\n--\n                                 01/06\
  \ 20:56"
