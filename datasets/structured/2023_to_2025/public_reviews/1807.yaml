title: '[超負雷] 殺手迴戰-不要去看'
content: "雷文防雷資訊頁\n\n\n\n忙了三天本想趁連假最後一天去看蟻人，\n但是人潮實在太多，沒有喜歡的座位，只好隨意挑一片。\n以下多劇情雷，慎入。\n\
  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文\
  \ 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n先貼人權\n\n\n\n主題很簡單:挑了6+1個\"菁英殺手\"互相接對方的單，看誰存活到最後的煉蠱戰。\n\
  \n看了一下預告片以及簡介，本以為可以輕鬆看個爽片，殊不知看完只有滿臉問號。\n\n簡介一下7位殺手:原則上按照出場/死亡序\nNo.1 主角倒楣哥\nNo.2\
  \ 公園流浪漢\nNo.3 監獄便當仔\nNo.4 伐伐伐木工\nNo.5 武術大師\nNo.6 SM大師\nNo.7 九命女特工\n\n劇情就如第一行簡單，因為相當簡單但是嘈點相當多:\n\
  一、No.2:在開頭搶了No.1的單，以為很強，結果在公園被反殺的片段卻那麼的讓人白眼。\n    只想問常見的老問題:你的目標都背對你了，為何還要拿槍靠那麼近然後被反殺?\n\
  \n二、No.3:被No.7只花了一捲鈔票就搞定，標準的便當仔。\n\n三、No.4:犧牲一隻手指換取餘生，賺爛了賺爛了。\n\n四、No.5:在奇妙的武術大師人設下，不免俗的嶄露一下手腳(約20秒?)後被爆頭。\n\
  \    又一個老問題來了:就算你得到的情報是對方\"輕裝\"，可以胸口一槍搞定，\n    但是你不朝腦袋先補一槍再靠近確認生死嗎?\n\n五、No.6:全片因為你留手指的喜好，讓片名翻譯成殺手迴戰...你還是安心地去吧。\n\
  \n六、No.7:保安可以讓人死了又死，死了再死嗎?\n    第一次裝死，以她自身的職位跟權力來說算輕輕鬆鬆的騙過，這點給過。\n    第二次又沒死，只能說回到第四嘈點的同一問題:腦袋補一槍不是很好嗎?\n\
  \    如果說是為了刻意安排讓人以為有第二集續集，我只能說不可能!\n\n總結:千千萬萬不要去看這片浪費時間跟金錢，也勸阻一下周邊朋友，當作功德(白眼\n\n\
  \n--"
