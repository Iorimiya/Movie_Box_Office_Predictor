title: '[雷] 名偵探柯南 黑鐵的魚影 日本轟音廳 '
content: '雷文防雷資訊頁


  防雷


  先上人權圖



  為什麼跟之前某篇在台灣看的板友一樣，變成了啊，影去哪了...


  好啦那個。


  這次去的是東京池袋TOHO Cinema的轟音廳，也是電影板板友在推文介紹的。


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  以下開始，有雷。






  我滿足了。




  心得寫這樣一定被噴爆，所以多寫一點。


  這次劇場版把事情弄得很「簡單」，沒有太多的謎團也沒有太多的內心戲。


  就是很快的給出答案，然後把問題解決。


  然後角色也沒有太大的破格，基爾(水無怜奈)的戲還蠻不錯的，

  透過直美那段對父親的不捨，連結到基爾在原作中失去父親的情緒，有顧到原作黨的心情。


  雖然我一直在等琴酒發現基爾身上被灰原安裝的竊聽器，但琴酒到最後也沒有發現...



  是說琴酒真的是白跑一趟，他來的時候剛好小哀跟直美逃走，他沒見到任何人。


  場刊裡面這張看起來很帥



  其實(笑)



  場刊有導演，劇本，聲優的訪談，還不錯。



  雖然整部片讓我感覺彷彿是。



  看了這部片，



  －


  然後如果有來日本的話，可以考慮收一下TOHO cinema的會員卡。


  現在有三個版面可以選，原本TOHO的，美少女戰士的，還有MI-7的。


  我當然是選了：



  辦會員500JPY(約110台幣)，週二會員日看片直接折700JPY，超划算。

  之後用會員購票，看六次送一次免費看片(會員日也算一次)。


  所以也買了MI-7的場刊



  阿湯哥帥到翻



  一定有人問我為什麼沒去看MI-7，因為那是明天，了。


  －


  轟音廳的重低音很過癮，而且平衡不會像川崎的Cinecitta或是爆音映画祭那樣跑掉，

  不過畫面還好，習慣了杜比廳的黑，會覺得這種一般廳的黑都不夠「沉」了。

  不過TOHO也有IMAX跟Dolby Atmos等特殊廳可以選擇就是了。


  --'
