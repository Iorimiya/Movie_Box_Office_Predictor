url: https://www.ptt.cc/bbs/movie/M.1681570955.A.F2E.html
title: '[ 負雷] 名偵探柯南 黑鐵的魚影'
content: '以下無劇情雷

  今年又按照慣例進電影院支持長不大的小孩，

  出門前還看了黑色組織有出現的電影版系列，

  天國炸大樓、漆黑掃射東京鐵塔、純黑炸摩天輪、

  至於這次炸什麼就不劇透了。

  其實光看今年的預告片就知道今年一定不妙了，

  想不到比實際預想的還慘，個人評價跟絕海的偵探差不多慘，故事很零散也完全沒有推理

  ，而且動作場面也沒有前幾部熱血，唯一好看的只有灰原跟柯南這對的互動吧。

