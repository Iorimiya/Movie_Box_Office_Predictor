url: https://www.ptt.cc/bbs/movie/M.1688654697.A.935.html
title: '[好雷] 名偵探柯南 黑鐵的魚影'
content: '先題外話防雷


  其實原本每年劇場版我是都沒有去電影院看的


  但是高中的生物女老師講了一句


  暑假拿來幹嘛？除了教你們就是我要到電影院去看柯南劇場版啊！！！


  從此每年暑假我都會到電影院報到了


  雖然在經歷向日葵後有點抱怨老師，但今年真的感謝老師讓我養成這個習慣





  主題曲防雷










  其實在蠻前面的部分，邏輯就沒有上線了


  大概從搭船抵達八丈島後開始，就可以放鬆腦袋


  因為接下來全都是為了劇情需要推進各種強制執行




  流程大概就是先介紹本次新毀壞公物太平洋浮標


  展示全年齡比對系統、開發者被抓、小哀被抓


  動作場面、柯南發誓、到浮標推進劇情、夏亞阿姆羅出場講電話


  柯南救人、動作場面、科哀大發糖！！！！！！



  啊嘶～～～等了這麼久的時間就是為了這個大場面！！


  聽說這次科哀發糖的畫面還是青山老師來畫的


  這官方發糖真的是太讚了，老師筆下的小哀的回憶濾鏡的柯南真的美化太多


  這不是愛上了是什麼



  光是科哀的畫面真的是值回票價


  雖然劇情中規中矩不怎樣，但我買單！！！




  話說感覺今後好像會有哀蘭黨出現，小蘭的反應有料

  -----

  Sent from JPTT on my iPhone


  --





  因為這週六不可能的任務就上了，大部份都會讓給阿湯哥


  太平洋浮標連線那邊我也出戲到EVA去，那段的配樂跟EVA的太像了




  去看吧，還算不錯啦。就劇本對我來說中規中矩。新蘭黨的你去看，有幾幕大概會蠻開心的

  喔！'
