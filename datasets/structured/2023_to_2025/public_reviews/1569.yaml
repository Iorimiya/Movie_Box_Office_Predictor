title: '[雷] 名偵探柯南 黑鐵的魚影 心得'
content: '~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  身為一個從純黑的惡夢還是唐紅的戀歌開始就每年到電影院報導年輕粉絲

  什麼推理要素我其實不是很在乎，畢竟那個時候早就變成年度柯學動作大片了

  不過我每年都還是看的很開心，我的心態一直都是進去看飛車追逐和爆炸

  今年老樣子該有的都有，只是沒那麼過癮，算是個中規中矩的劇場版

  但一些媒體評論把這部吹的太誇張了，建議期望值不要拉到那麼高比較好

  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  今年靠著柯哀把所有缺點蓋下去了

  怎麼說，推理要素本來在劇場版裡就快不見了所以還好

  而且這次的動作戲碼相較之前幾部也遜色不少

  完全靠著雪莉對組織的恐懼以及對新一的感情支撐著整部電影


  比起柯哀，今年最讓我感動的地方是庫拉索還有一張畫面

  想到就難過，純黑的惡夢對他塑造真的很不錯


  再來是琴酒和他的快樂伙伴

  先恭喜伏特加這次終於像個黑幫成員不是駕車小弟

  琴酒還是很潮，但一想到身邊全是背骨仔就很好笑

  整部片除了伏特加所有人都在搞他，笑死

  這次組織戰績如下

  殺了一個臥底和知道一堆秘密的篡位仔

  以上都是琴酒戰績


  直升機二人組真的只有殺自己人有效率

  雖然看似有殺掉議員，但被救活了

  另外雖然炸了一個大型設施，但歐洲決定在蓋一個

  而且核心成員都安全下庄，再蓋一個一樣的毫無壓力

  反觀自家潛水艇被赤井低成本轟掉，虧爛


  少年偵探團被趕回家，沒什麼戲份

  小蘭從四層樓跳下來扁人毫髮無傷，正常

  小五郎為代理推理人，其他時間在喝酒和被女兒扁

  博士這次沒做出什麼超越美軍的發明，但這次柯哀配多虧有他才能成


  今年製作團隊就是把所有重心放在小哀上了，就結果來看也很成功

  完全可以感受到他對組織還是很恐懼，琴酒真的害人不淺

  和柯南的相處也讓我全程姨母笑，真的好甜

  到底要多深的羈絆才能靠眼神交流溝通

  以人工呼吸之名行接吻場之實的場面也有了

  柯南也是個罪孽深重的男人，一部片吻兩個

  雖然小蘭是間接還回去的

  身為柯哀粉今年滿足了


  總之今年就是如果滿分十分的話

  邏輯0分

  動作場面5分

  片尾曲8分 好聽

  小哀100分


  -----

  Sent from MeowPtt on my XQ-BQ72



  --'
