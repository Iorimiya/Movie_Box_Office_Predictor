url: https://www.ptt.cc/bbs/movie/M.1627140153.A.E3F.html
title: '[負雷] 嫌疑犯X的獻身中影版'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  雷雷雷


  包含日影版觀看心得


  負評主要針對中影版


  沒有比較沒有傷害


  內有崩潰、主觀、且暴雷心得，雷者慎入


  好讀網頁版：








  東野圭吾的小說我最愛的就是《嫌疑犯X的現身》


  所以從小說開始，電影版每部都補了一遍


  2008年日本版


  2012年韓國版


  2017年中國大陸版


  基於經典的推理的故事了，先聊一下對日版的感受，日版是我最愛的版本，石神的演員堤

  真一也是我（以前）蠻喜歡的實力派男優，美麗的夫人也夠漂亮，還有帥氣的福山雅治演

  的湯川……


  印象最深的是石神自殺前，脖子都套進繩圈了，突如其來的電鈴聲讓他楞了愣，微微駝背

  的站在椅子上，回頭望著萬年不響的門鈴，彷彿能看見石神的腦子裡轉著：唔，要不要去

  開門啊？


  那瞬間不得不說有點尷尬ＸＤ


  但是打開門的瞬間，陽光迎面而來，適應了光芒之後，是一對母女站在門口，親切的，友

  好的對他打招呼。她們是剛搬來的鄰居，基於禮貌來打個招呼，送個小禮品，到底是媽媽

  甜蜜的微笑，女兒活潑的招呼，還是母女和諧的樣貌刻進了石神的眼中？那個瞬間的反差

  讓人想起前一刻石神屋內的昏暗，那個瞬間，我理解了石神的一見鍾情。


  就算平日沒甚麼交集，石神依舊默默關注著隔壁的母女們，默默去媽媽店裡買便當，感覺

  如果沒有發生案件，石神大概就會一直這樣關注著她們直到媽媽被別人追走XD然後他會在

  心中祝福媽媽得到幸福。啊～這傢伙到底有多笨拙啊XD


  除了數學之外，戀愛真的不行啊～～


  看日版就是享受，可以感受到石神面對女神的自卑、暗戀、面對自己的孤獨，對數學的狂

  熱還有天才，還有最後劇情爆發的瞬間，他對夫人的愛的確是純粹的、把自已都獻上去純

  美。


  對比下來，韓版在這個段落的處理就很普通，普通到我現在完全不記得結果怎樣，印象中

  就是中規中矩按照劇情發展下來，這樣……啊，還有就是韓版的石神比較帥，感覺沒那麼

  普通啊XDDD


  然後就是今天補完的中文版


  唉，說起來我是為了看王凱演的湯川，可是，可是我還是忘記了，這是中改版，中國啊~

  對岸啊~到底是甚麼魔性的改編啊~~嗚嗚嗚，我為什麼要看這部!!!!!


  其實說起來也不是說真的拍得很糟，照劇本發展下來看點還是有的，中版看起來著重在湯

  川跟石神的愛(x)……友情，日版的湯川石神雖然也是老友感，但是中版特別強調了石神

  邊緣人的部分，他從小到大的朋友就只有湯川，而且兩人還有互相比賽的約定，她們約定

  了要輪流各自出題讓對方解，解不出來的就輸了，贏的那個就是最聰明的~(中二~~~)


  小湯川還有小石神都很萌~


  連長大的版本都有互相試探的閃光點，不知道是女神演得太差還是這兩個傢伙太腐，都默

  默腦補了沒有女神的同人啊~(x)


  但是故事如果能完結在石神被捕的部分就好了~


  熟知劇情的話就知道最後解謎的部分是這部片的精華所在，可偏偏這是中改啊~中改啊~~


  怎麼可以沒有爛尾，沒有偉光正、沒有備胎~沒有渣男渣女~~當然一定都要有啊~~~嗚嗚嗚

  嗚嗚為什麼要拍成這樣，為什麼~~~(擦淚)


  其實在女神看央視新聞講到「兇手已經被待補，等待他的將是最嚴厲的制裁」已經讓我有

  點生理不適。


  之後，湯川惋惜了一句：「這麼聰明的腦袋，居然用在這裡。」


  不是……你不是早知道人家暗戀中嗎～他不是你好朋友嗎～現在講這些幹嘛～你想要石神

  回答你甚麼～到底～而且不講還好，湯川拍案問起石神究竟為什麼要為女神犧牲至此的部

  分才是全篇最讓人齣戲不爽到極點的部分。


  一樣的自殺、一樣的門鈴聲、一樣的自我介紹～


  女神開口打招呼，喔～不是～是妹妹開口：「叔叔，你家有多的書嗎？（靦腆）」


  我：……


  彷彿還嫌不夠似的女神補了一句：「不好意思，小孩的家庭作業沒有也沒關係～（倩笑）

  」


  看著石神默默進屋掏出一本舊書，我覺得好像聽到甚麼斷掉的聲音，啊～可能是我斷掉的

  神經線～


  這時女神依舊是如此美麗，如此客氣在說，如果她們家吵到他的話就告訴她云云。


  不重要，都不重要了～我就想問一句，這甚麼，這是甚麼？！


  為什麼要魔改！日版的石神體會到女神的美好是來自於一個友善的動作，女神初來乍到就

  提了小禮物到隔壁的大叔家打招呼，溫柔的，就算不認識也帶著善意。


  可是中版在幹嘛？


  做作業？做作業就算了，還討人家家裡的東西？excuse me?????


  到底在幹嘛!!!!!


  這樣說來說去就是女神夠漂亮嘛~不就是這樣嘛~


  靠~還說甚麼報恩~請問一下你是被虐狂嗎?!!!!


  喔~還沒完，最讓我崩潰的部分是石神在準備回牢籠的時，日版拍得很美，他是滿足的，

  是想到心愛的人能安心幸福的活下去所以他看著牢籠外的陽光也能露出微笑。所以他看到

  女神是崩潰的~他為了女神破碎的幸福而哭泣~


  可是中版呢，中版在想：湯川，我贏了~~(邪魅一笑)


  啊啊啊啊啊啊~~~~

  我的天~~~

  我的天~

  我的臉整個裂開了好嗎~


  後來女神冒出來大哭說：「我這樣的女人不值得~~~」


  啊，我想石神崩潰的眼淚，應該是為了輸給湯川所以哭哭的吧~~(眼神死)


  總之，總之~中版不要看，要看看到石神被抓就好了~這結尾不如沒有QQQQ


  最後來補充一下沒有講的女神好了~


  本來女神在小說裡就是個美麗的單親媽媽，印象中好像(40多歲)風韻猶存，小說很久以前

  看的印象不深，可是還有最後女神自首告白時崩潰哭哭的印象。


  日版女神的美麗是洗盡鉛華回歸質樸的美感，可以從她的眉眼間去想像妝點起來會有的性

  感或艷麗。不過素素的樣子也很好看~就感覺她是個努力生活的單親媽媽，便當店的工作

  也不敷衍，跟女兒的感情也很好，兩人一起相依為命很幸福這樣。


  韓版……韓版我真的不記得，應、應該是個好人吧（說起來不記得對這部片來說也不是甚

  麼壞事。印象深刻不是神片就是垃圾…)


  那個，林心如很漂亮，但如果她不要把盲人演技用在這部片裡……嗯？她有演技？不是、

  也許、可能她應該有演技？只是她的臉太漂亮，蓋過了她的，嗯，試圖扮演的質樸。


  嘛～算了～反正林心如版本的女神我不知道她是來幹嘛的。


  第一幕有印象是便當店裡面的段落，石神來買便當，跟女神的對話只有


  石神　一個招牌便當

  女神　一個招牌便當（眼神死）


  喔，我不知道，劇本裡一定沒有那個括號裡的東西吧～


  就算客人不是石神，女神不看石神，附讀機似的面無表情，不說我都以為她眼睛是不是有

  甚麼問題（？）如果只是復讀機那用電子點單就好了要你幹嘛？還是你對每個客人都是這樣？我覺得你一定不是很喜歡便當店工作，啊，你是想表達你們不熟嗎？可她不是你鄰居嗎？你搬來的時候還去跟人家要了……啊，算了

  ，女神本就不食人間煙火，下凡來討生活已經太辛苦了，不要苛責人家。


  然後後面是女神跟前夫的重頭戲，其實我覺得她應該有想要努力保護女兒啦，只是礙

  於形象……不想像瘋婆一樣，啊，不是，她也很努力了，反正最後也像蟑螂一樣殺掉了。


  女神啊～整體來說女神給人的感覺就是，很空靈，隨時都要飄出凡間，讓她下凡來真的委

  屈了。


  她跟女兒的感覺就很普通，不熟這樣。整部片裡就不知道她在幹嘛，整個人跟片子格格不

  入的感覺，然後，嗯……其實我蠻同意她最後一句台詞的。


  石神就是腦子浸水，可憐啊。



  --'
