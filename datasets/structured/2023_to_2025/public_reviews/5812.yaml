url: https://www.ptt.cc/bbs/movie/M.1449286716.A.3F8.html
title: 'Re: [好無雷] 嫌疑犯X的獻身 完美的電影'
content: '防雷






















  小說中有寫明


  石神要確保母女100%平安 天曉得屍體以後會不會被人發現


  所以他才殺另一個流浪漢偽裝成富樫


  故意讓屍體被警方發現>將屍體偽裝成富樫>確保母女的不在場證明


  就算萬一以後富樫屍體被發現也不會有人懷疑死者真實身分


  因為一個人不會死兩次 這樣才可以確保母女平安


  石神是要徹底解救母女人生 如果只是單純將屍體藏起來母女往後人生勢必活在恐懼當中


  還有一點就是可以讓石神頂罪的決心無法動搖


  如果只是單純頂罪有可能會受不了警方拷問而動搖吐露真相


  但是他可是真的殺了人 無論被如何追問他的決心都不會動搖 他是殺人犯坐牢是理所當然


  石神可以完美的堅守到底 保住他心愛的人



  --'
