url: https://www.ptt.cc/bbs/movie/M.1466243484.A.7EC.html
title: '[片單] 推薦像"嫌疑犯X的獻身"的堤真一'
content: '1. 請描述欲尋找電影的類型或特徵（請盡量描述清楚）


  請推薦片單:

  (1) 重要角色偏向可憐的大叔or宅宅

  (2) 比較悲傷沉痛的劇情 (單戀 被當工具人 失去重要親友)

  (3) 不是大叔很熱血地達成某成就 (ex: 組團 事業有成)


  像是"嫌疑犯X的獻身"的堤真一

  他那種苦 那種悲

  電影看完許久 光想到畫面還是很有感覺QQ




  2. 已知符合需求的電影或偏好的電影類型（為避免重複推文，請至少列舉一部）


  "嫌疑犯X的獻身"的堤真一

  "黎明破曉的街道" 也是東野圭吾的作品

  寂寞拍賣師

  單身動物園也算



  3. 不符合的電影類型            （不需要板友推薦的電影，可填刺陵）


  實習大叔 (大叔有魅力又有正妹同事 條件太好 不實際)

  即刻救援的老爸 (太強了)


  --

  謝謝推薦 設定挺有趣的


  什麼! 我老婆竟然在裡面 這一定要看的!

  這讓我想到東野圭吾的"黎明破曉的街道"也很類似'
