url: https://www.ptt.cc/bbs/movie/M.1672840357.A.AE5.html
title: '[負雷] 嫌疑犯X的獻身'
content: '看板上很推這部所以來看看


  開頭就說教了一番


  前半段花岡的前夫被殺

  石神幫忙串證

  後半段湯川推理出石神創造另一具屍體

  石神最後的崩潰


  就這幾個重點還不錯


  只能說拖戲的地方太多了


  從警方找湯川協助調查

  湯川重新開始聯絡石神

  到花岡和另外一位男士互相交往，石神跟蹤狂

  在到爬山(這裡超無聊，根本完全沒意義)


  這些地方都讓我感到出戲，


  感覺劇情根本就沒有前進


  真的覺得沒有必要拍到兩個小時，


  石神跟蹤狂那裡

  本來我以為石神是變態跟蹤狂

  後來怎麼變成:你是個好人，花岡和你在一起夠得到幸福，你能守護花岡

  從忌妒的心轉把石神洗白成大聖人也轉太硬了吧


  石神不自殺的理由也很牽強

  就因為被美女鄰居問候一下就決定不死了?

  你要自殺的決心也太脆弱了吧!


  然後石神要去看守所之前花岡還跑來表示:

  你不應該自己承受這些，我也是罪人

  讓石神整個崩潰，石神整部片的努力都白搭了

  到底?


  感覺這部片舖陳太長了

  而只是把爆點放在，石神有創造了另一具屍體

  讓真相就算被曝光了石神也能夠主張自己有罪的這個結局

  就想說服我他不是爛片看來是還不夠的


  --

  我少寫了，堤真一演技是不錯啦，有把天才宅宅的樣子演出來'
