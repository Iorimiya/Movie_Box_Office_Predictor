url: https://www.ptt.cc/bbs/movie/M.1449676012.A.18C.html
title: 'Re: [好無雷] 嫌疑犯X的獻身 完美的電影'
content: '這部號稱是讓東野圭吾功成名就的大作，橫掃當年各大獎項

  ，尤其在【白夜行】後，東野圭吾再次寫出工具人霸主的巨作

  ，甚麼叫做霸主，就是甘願為心愛的人殺人、扛罪。


  白夜行原著其實也是滿好看的，日劇雖有更動但也是值得一看的經典

  ，被日劇板號稱史上最歡樂戲劇。


  東野圭吾的伽利略系列，我當年因為戲劇的緣故而去買小說來看，就跟

  電視劇一樣是單元性的，嫌疑犯X是第一個湯川學辦案的大長篇著作。


  當年宣布電影化的時候，戲迷跟書迷都很興奮，然後劇中的石神宣布由

  堤真一出演的時候讓很多人驚訝，因為他太帥了，說實話不符合原著的

  設定，記得原著裡的石神是矮胖身材，當年這裡跟日本都有最適合演出石神

  的演員口袋名單，不過支持者認為以堤真一的演技絕對能把他酷帥的外型

  掩蓋過去。


  實際演出結果也如預期，堤真一演得很棒，但還是太帥了。


  可能是我先看過原著，總覺得電影沒原著好看，一些情節太過省略，然後

  多了內海薰也是怪怪的，畢竟她跟石神也不是同學。


  不過電影還是值得一看，學習當工具人的更應該看。


  朝聖一下甚麼叫做工具人的霸主，然後別忘了補完【白夜行】



  主題曲


  東野圭吾這人也滿有趣的，電視劇多了誰就把誰寫進書裡....



  --'
