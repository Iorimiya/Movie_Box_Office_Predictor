url: https://www.ptt.cc/bbs/movie/M.1298275291.A.655.html
title: '[好雷] 嫌疑犯X的獻身絕妙的角色平衡'
content: "附圖片網誌版本 請多多指教~\n\n\n\n\n\n-------------------------------------------------------------------------\n\
  \n\n\n\n\n\n<嫌疑犯X的獻身>日文名<容疑者Ｘ??身>\n\n是由懸疑作家東野圭吾的同名作品所改編\n\n電影主題曲“最愛”是由福山雅治和柴崎幸組合成的KOH+所作\n\
  \n由福山寫曲寫詞監製 小柴所唱的\n\n配合著結局尾聲真的是超級有feel的 聽著聽著都覺得痛心\n\n據說電視劇版走輕鬆幽默的風格\n\n小說和電視劇我一概都沒有跟\n\
  \n因此只以電影版本作為著手\n\n會看這部電影最初完全是衝著提真一而來的\n\n\n\n\n角色決定：完整的平衡取得的戲劇張力\n\n\n(在此請參考角色關聯圖方便做對照)\n\
  \n\n\n\n  除了電視劇的固定班底角色(福山雅治和柴崎幸)，這次的主軸由松雪泰子\n\n(飾演便當店女老闆花崗靖子)和提真一(飾演嫌疑犯石神哲哉)擔綱演出。\n\
  \n當初電視劇版本據說是因應平衡原則因此加入了內海薰(柴崎幸飾演的女\n\n警)這個角色，而男警草薙(北村一輝飾演)的戲份則大為減少(提外話，看\n\n到草薙我超驚訝，這不是夜王裡面性感的羅密歐紅牌嗎?~羞)，我想這種拿\n\
  \n捏平衡是有必要的，畢竟一來湯川(福山雅治飾演)是個聰明絕頂的天才，觀\n\n眾難以直接親近他的內在，而由女性較為陰柔的角色切入使得視角自然延伸\n\n，從而延伸出和湯川之間的曖昧情感線也是有趣的(否則就變成類似恐怖寵物\n\
  \n店那種男男的愛戀了XD)，雖然有人說電影版的內海實在很無用，但是我看了\n\n一段有關柴崎幸的訪問，我相信她是很聰明的知道內海薰的角色定位在哪裡\n\n，不去喧賓奪主搶了石神哲哉的主線，又站在湯川身邊當著綠葉扮演著告知\n\
  \n線索和舒緩結局凝重氣氛的賢內助(!?)。\n\n\n    此外，看過原著小說的人很不能理解提真一和那邋遢的石神哲哉差距太\n\n大，我是沒看過原著，但是提真一的演技完整得令人動容，他完美詮釋出一\n\
  \n個孤獨天才的微暖愛戀。除了他刻意變老、滄桑的外在造型，最為成功的部\n\n分莫過於他完整的表達出了石神的內在價值觀，從每一個慣性的小動作：手\n\n插口袋、走路也在想事情，把臉埋進圍巾中，觀眾跟隨著他的期許和計畫一步\n\
  \n步穿越劇情變化，跟著他心碎跟著他嘶吼崩潰。\n\n\n    我非常喜歡劇中各個角色的完整平衡狀態，像一張緊鑼密佈的蜘蛛網，不\n\n容許什麼差錯遺漏。\n\
  \n\n    湯川VS石神，物理天才對上數理天才，這是兩大天才的推算之爭又同是彼\n\n此的惺惺相惜，英俊瀟灑的湯川碰上了難得會被他稱上天才的大學時代同學石\n\
  \n神，卻是在抽絲剝繭釐清真相的時刻。劇中他們兩人經過鏡子前，石神突然說\n\n出自己很羨慕湯川看起來還是那麼地年輕，湯川突然明白了，那個以前從不在\n\n意外表的石神戀愛了，省視著自己能拿什麼給所愛幸福呢!電影劇情不著重在緊\n\
  \n湊的推理懸疑，而是在情感的交錯鋪陳，增添了可看性和豐富性。\n\n\n    花崗靖子和女兒花崗美里VS石神，溫暖的母女和孤僻的單身漢為鄰，一開\n\n始石神幫忙花崗母女掩飾殺人，緊接著一步步幫著她們脫離警察的懷疑，原來\n\
  \n是最初花崗母女搬來的時候拯救了計畫要自殺的石神，帶給了他新的重生，因\n\n此雖說帶有著純純的愛情，我卻反倒是覺得有更深厚的家庭溫暖感情，在石神\n\n心中扮演著最重要的生命意義。\n\
  \n\n    內海薰在湯川的破案主線扮演著陪襯以及重要傳遞訊息的角色，溫柔的內\n\n海在警部被當成小妹使喚，即便是表面上案子已經完結她仍和湯川追查真相直\n\
  \n到最後，結局雖然令人動容痛心，卻在她和湯川坐在湯川以前和石神在大學時\n\n代相遇的椅子上飄起了雪中漸漸舒緩，整部片調性比較黑暗沉重，內海這個角\n\n色的適時出現的確能給與恰當的暖度。\n\
  \n\n此外，工藤邦明VS石神，工藤是石神羨慕的對象，也是石神對花崗靖子愛的寄\n\n託，盼望自己在被捕之後能繼續守護著她們母女兩的希望，石神絕對不會再讓\n\n\
  第二個富堅慎二破壞花崗母女的幸福，所以會讓他認可的絕對是親眼挑過放心\n\n的傢伙。而內海薰VS花崗靖子，一比之下相對出了後者的複雜，是個有母愛夢\n\n想和希望的媽媽，卻在感情中遇人不淑隨波逐流，也牽扯著許多糾葛，這個角\n\
  \n色和以往好萊物黑色電影中的女性角色不謀而合，在美式黑色電影中，女性象\n\n徵著不祥和禍害，也因此殺了以前的情人、遇到肯替她頂罪幫她脫罪的男人，\n\n而內海則是不放棄希望和真理的象徵，努力不懈，這兩大女角在本片中也產生\n\
  \n了絕妙的平衡。\n\n\n\n\n很喜歡提真一在這部片中的演出\n\n只能說太深刻也精湛得直逼人心\n\n不論是滄桑的遲鈍或是細膩心思 都詮釋得淋漓盡致\n\
  \n讓人看了直呼過癮!\n\n\n\n\n\n一部完全用感情交織而成的懸疑推理\n\n\n\n\n                     看完後格外惆悵冬天的漫長.....\n\
  \n\n\n\n--\n\n我並不是那麼快樂　\n我只是堅持　\n不肯讓痛苦掠奪了我的快樂\n---張曼娟\n\n--\n◆ From: 60.250.122.1\n\
  \                                02/21 16:13\n                               02/21\
  \ 16:13\n\n個人認為 此片本來的主軸就著重在兩大天才的鬥智過程\n\n若是警方當中也出現了一個強大天才 (或是一群天才)\n\n那給他們玩三角關係就好了\
  \ 內海薰也不用去找湯川\n\n不對 應該說根本也沒有內海薰這個角色出場的必要\n\n\n換言之 日本警方按部就班 卻仍舊找不到真正犯人(甚至幫兇)\n\n相較之下才突顯出了湯川最後與石神腦力激盪的抽絲剝繭過程\n\
  \n怎能說這不是另一種張力?\n\n\n唯獨令我感到困惑的是\n\n日本警視廳真的會動員那麼多的警備去查詢一個被害者嗎?\n\n或許不是 但是也無非是想用此手法對比出石神一人的高超推理和掩飾手法\n\
  \n而湯川也靠自己的方式反向找到了真正答案\n\n\n若不是石神早已準備自投羅網\n\n這場決鬥其實根本是難分軒輊\n\n\n\n\n\n\n我相信所有觀眾都和你一樣\
  \ 希望石神能如願\n\n但是湯川的心目中最後糾結的結果 應該是更相信真理吧!"
