content: '石神雖然是數學天才但好像也沒多聰明吧

  晴子和美里聯手殺了慎二

  如果當初勸她們自首

  美里無罪

  晴子頂多過失致死上訴還可能再減刑

  也不用自己去多殺一個人幫忙製造不在場證明

  事情幹嘛搞得這麼複雜

  或許石神是被愛情沖昏頭才做出傻事

  滿腦子只想讓晴子得到幸福

  卻忘了事情整體的利弊

  不知道各位怎麼看



  --'
