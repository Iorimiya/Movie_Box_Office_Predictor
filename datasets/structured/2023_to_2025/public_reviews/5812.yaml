url: https://www.ptt.cc/bbs/movie/M.1449242820.A.BB6.html
title: '[好無雷] 嫌疑犯X的獻身 完美的電影'
content: '大家好...


  我想推薦大家這部真的很棒的片...>_<


  (以下無雷)





  其實我覺得用完美來形容一部電影真的非常不容易，


  但是「嫌疑犯X的獻身」這部片對我來說真的是完美...(個人感覺啦...)


  他打破我對日片的既定印象：


  舉個例子，像我近期看過的日本片...


  不論是永遠的零、墊底辣妹、以及神劍闖江湖2...


  雖然這三部都是很棒、滿好看、感人的片子...(神劍應該算比較熱血啦...)


  但都會給我演員演得太用力、愛說大道理、情緒太滿...這樣的感覺...


  但是「嫌疑犯X的獻身」真的打我臉(腫)，


  讓我知道原來這世界上有這麼一部完美的日本電影...Q口Q...


  就連我自己最喜歡的電影黑暗騎士三部曲都可以挑出一大堆缺點了...Orz...


  「嫌疑犯X的獻身」不論劇情、演員演技、配樂、緊湊程度、感動程度...


  真的沒有什麼好挑剔的啦Q口Q...


  我也是看完這片之後，上網搜尋評論才發現他竟然是小說改編...


  (已經立刻訂購東野圭吾包含嫌疑犯X的獻身在內的4本網路上比較推薦的小說了...)


  (所謂愛屋及烏就是這樣...)


  害我現在有點後悔沒先查清楚...


  應該要要先認真決定要先看電影還是小說T__T...


  畢竟不論哪個先看，另外一個後看的就會少了一點驚喜...嗚嗚...Q_Q





  總之呢...這部片的好看程度讓我根本不想跟大家劇透...


  大力推薦大家都去看~~哈哈~~~~~




  --'
