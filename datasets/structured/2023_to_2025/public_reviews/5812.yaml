url: https://www.ptt.cc/bbs/movie/M.1707196417.A.A63.html
title: '[好雷] 嫌疑犯X的獻身 印度版'
content: '之前有看過它的小說，很多國家都有翻拍這個故事

  這次看到印度版的，滿好奇會怎麼詮釋就點進去看看

  以下有雷























  整體表現還算不錯

  有些劇情的更動我覺得很值得拿出來討論

  像是因為有角色上的刪減和融合，導致警察必須透過餐館店員來得知老師喜歡那位媽媽

  這點證據跟原版的比起來就比較薄弱，但印度版的劇情有努力塑造店員的大嘴巴人設

  還算有用心，只是店員很煩

  還有數學老師成為媽媽的跟蹤狂那段橋段

  因為已經知道老師是用演的了，所以衝擊感沒有一開始看小說時來的大

  原版一開始不知道老師是在演跟蹤狂

  所以會覺得女主角超慘，先遇到爛人前夫，後面馬上遇到跟蹤狂

  另外，最後數學老師被抓去關，實際上也有殺人的媽媽沒事

  也跟原版的結劇情的部分因為劇本原先就很厲害，沒有太多的更動其實不會太局不一樣

  除了顯現出數學老師的完美犯罪計畫，也完好的詮釋出老師的天才人設

  而且出於對母女的同情，其實也很不希望媽媽被抓去關

  另外，結局也帶出了印度版本的主旨

  就是人們總是輕易地接受他人給的答案

  去比對劇中辦案的警察，接受了老師給的答案所以把他視為犯人

  結局跟主旨有了很好的呼應


  做個總結，印度版的結局我還算喜歡，而且編排上也有新意

  在各國版本中，算是一部不錯的翻拍，值得一看

  比對各國翻拍的嫌疑犯X的獻身，大家覺得翻拍的最爛和最好的版本分別是哪版呢？


  --'
