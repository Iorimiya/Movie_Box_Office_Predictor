title: '[討論] 嫌疑犯x的獻身(劇情)'
content: '看到有一些說法是去懷疑再殺一個人的合理性 突然也感到疑惑


  如果能分屍丟到河裡(屍體處理的完美) 那就算發現前夫失蹤 最多也只是查到前妻這邊 但沒有決定性證據殺了人吧？


  看起來母女兩人也沒認罪的心裡準備(女兒覺得對方才是壞人 媽媽覺得不想讓女兒承擔) 也不至於警方來查失蹤人口時就認罪了吧？


  請問大家是怎麼想的呢？


  -----

  Sent from JPTT on my Samsung SM-J710GN.


  --'
