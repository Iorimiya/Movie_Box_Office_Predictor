url: https://www.ptt.cc/bbs/movie/M.1521358289.A.3A7.html
title: '[好雷]  嫌疑犯X的獻身'
content: '我一直說解憂的小說不好看


  因為一切都太刻意、不自然


  只有父母跟小孩那段有驚豔到我


  朋友就推我這部


  嫌疑犯X的獻身






  雷線



  看完我只問他


  小說裡是怎麼描述


  在還沒揭開謎底時，關於那位流浪漢失蹤的事


  因為電影是用不同天，石神上班經過的路線帶過


  沒明說的呈現出來，我朋友好像是說小說裡沒這段吧




  在看的時候


  我知道石神替靖子頂罪，肯定做了某種犧牲


  而這犧牲具體是什麼行為，我覺得一點都不重要


  在本作中用殺人來作為石神犧牲奉獻的行為


  那如果石神是虔誠的佛教徒呢


  不能殺生，更不要說殺人了


  他如果為了靖子殺了僅僅是一隻螞蟻


  殺生帶來的業障不但毀了今生，更賠上了來世


  這樣不是更犧牲奉獻嗎?


  又假設石神本來就是個殺人狂


  他為了靖子殺人


  這樣也算犧牲奉獻嗎?


  在看完之後，我朋友一直說


  石神為了靖子殺人耶，為了她殺人耶，不單純只是頂罪而已


  我就覺得  嗯...對




  在雪山的時候


  我知道石神一定會回來救湯川


  因為這是電影


  可是如果這是人生呢?


  我不知道我會不會拋下湯川


  又或者我能堅信石神會回來救我嗎?


  從石神回頭救人


  就能看出石神是什麼樣的人


  而後跟蹤的那件事


  石神如果真的那麼天才，不會不知道


  跟蹤偷拍事多麼讓人畏懼的事





  在接近尾聲


  靖子得知一切，出現在石神面前


  石神崩潰大哭，並哽咽不斷地喊著


  為什麼為什麼為什麼為什麼......


  妳為什麼出現了，在這個時候


  明明不出現妳們可以幸福的



  而妳的出現，會讓我意識到


  意識到我也有一絲幸福的可能


  應該說不是沒想過別的方法


  既能脫罪又能三個人一起生活


  但是我知道，我們在一起是不會幸福的...


  一個曾經自殺的人


  又怎麼能讓別人幸福呢




  我覺得故事到這邊已經很完整了


  後面就是把故事說死，交代一些細節，不演也罷


  整部看下來，很順暢，沒什麼懸念，也有可能是我整部看完了才沒懸念



  看的當下還是會很緊張的


  唯一沒看出來的可能就頂罪手法了


  殺人頂罪的手法真的會讓人眼睛一亮，喔原來是這樣啊


  不過沒看出來並不影響觀影體驗，就只是個手法


  精彩的故事，值得一看




  為了，救贖我的神，去死我都願意了


  為了救贖，我的神，殺個人又算什麼


  --

