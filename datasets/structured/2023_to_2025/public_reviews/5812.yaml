url: https://www.ptt.cc/bbs/movie/M.1441919354.A.D52.html
title: '[純心得無雷]嫌疑犯X的獻身'
content: '大家好

  我是專看恐怖片的LittleDiDi

  但我這次不來跟大家介紹恐怖片

  聊的是一部個人非常喜歡的推理劇




  Blog圖文版會更精彩





  年份：2008


  國別：日本


  類型：懸疑、劇情


  導演：西谷弘


  [劇情簡介]


  刑警內海薰（柴崎幸飾）接獲一件謀殺案，卻查不出死者身份，只好請帝都大學的天才物

  理學教授湯川學（福山雅治飾）幫忙，湯川在查案期間，發現死者的前妻花岡靖子（松雪

  泰子飾）有一位鄰居石神哲哉（堤真一飾）。


  大學時代被譽為百年難得一見的數學天才石神（堤真一飾），長大後只是一個不起眼的高

  中數學老師，他每天唯一的樂趣就是去固定的便當店買午餐，只為了看一眼在便當店工作

  的鄰居靖子的身影。


  靖子帶著女兒花岡美里（金澤美穗飾）逃離粗暴的前夫，母女兩人相依為命，某天靖子的

  前夫找上門來，兩人爭執不下之際，靖子失手殺了對方。此時，石神出現在茫然失措的母

  女面前，自告奮勇表示願意幫她們收拾善後。


  湯川和石神這兩位大學時代的舊友，又再度相逢，兩人該如何接下彼此的挑戰書？






  最近蠻多朋友點播的，我這才驚覺，挖!!原來我欠各位的片單已經可以用「罄竹難書」來

  形容(亂用成語我知道)，不過有部片子我覺得無論如何都要在這邊介紹給大家認識，儘管

  他不是大家的點播之一，更不能算是一部恐怖片，甚至還是我們身為恐怖片迷最反感的愛

  情片，純粹只是我個人的一個致敬，容我向各位鄭重介紹，推理界的神作 - "嫌疑犯X的

  獻身"。


  如果經常有在在看我喇迪賽的朋友，應該都不難發現，每當我談懸疑或推理的主題時，三

  不五時都會提到這部作品，講得它有多神詭計有多屌之類的話，知者恆知，不知者看我在

  那邊講得天花亂墬，應該很不是滋味，沒關係，不管各位是什麼立場，我都希望這次可以

  經由我的介紹，讓大家認識這部作品。


  不過在開始介紹之前，可能需要先給大家打個預防針，為了詳細解說這部電影精采之處，

  會有些微程度的劇情透露，最大的謎底我不會去報料，怕被雷的還是自己注意，總之結論

  就是滿分，全部都是滿分，去看就對了不用懷疑。


  雖然說上一篇我對貴志祐介捧到有點引起爭議，但這次我這樣講應該就沒有什麼爭議了，

  東野圭吾無疑是目前台灣在大眾文學中，最著名的日本作家，甚至我說在日本他也是top1

  ，應該也不會有太大的爭議，若說島田大師是讓我陷入日式推理的罪魁禍首，那東野圭吾

  這位新大師則是令我領悟到推理文學的出神入化，而"嫌疑犯X的獻身"更是將他推向高峰

  之作，其偉大不由分說。


  不懂的人還真的以為，推理永遠都是搞像金田一跟柯南那套千篇一律，把眾人聚集在一起

  ，耐心聽偵探講故事，兇手還傻傻的在那邊暗自得意，結果怎麼死都不知道，超現實的情

  節。


  東野大師著作八十餘本，可以說是量多質精，小弟才疏學淺，當然不可能每本都看過，不

  過若真要我推薦，我倒是可以信手拈來幾本，若想看刻苦銘心、無私奉獻卻又痛徹心扉的

  愛情，除了"嫌疑犯X的獻身"之外，"白夜行"也挺令人印象深刻的，幽默的更不少，"超殺

  人事件:推理作家的苦惱"玩的是該領域作家的文化，要純本格的也不是沒有，早期的"白

  馬山莊殺人事件"應該是他比較難得那種會把所有人叫出來推理的純本格推理，"名偵探的

  守則"是一定提一下，能夠在純本格的範疇下玩幽默更是一絕。


  看過的都要講一下可能講不完了，而且可能有人會覺得我很無聊，有空再發一篇紀錄一下

  自己看過的所有推理書的小評好了。


  回到正題，為什麼我不直接介紹小說而選擇介紹電影，"嫌疑犯X的獻身"是少數改編很成

  功的電影之一，比起小說我更喜歡電影，但是我不會說那種電影拍得比書好的那種屁話，

  有時候看人的翻唱視頻，底下都會出現那種得「挖~~比原唱唱得還好」的回應，講這種話

  真的是對原唱的一種不尊重，尤其是對創作歌手更是，若沒原創哪來的發揚光大，唱歌如

  是電影亦此。


  很多人不知道，電影與小說其實是各有優勢，電影提供影像化的直接視覺，但小說可以使

  用細膩的文字描述，去刺激讀者的想像力，描繪出更多深層的內涵，但是只有一種情況電

  影可以完敗小說，就是既完整拍出小說的劇情內容，又拍出深層的內涵精髓，更恐怖的是

  當你所有能壓榨出想像空間，電影已經完美詮釋滿足，這個時候，我就會直接說，乾脆就

  直接看電影吧，書不妨買來收藏就好。


  簡單介紹東野大師的魅力，我還是得再次強調，沒有好的原始劇本哪來成功的電影，原創

  是成就偉大的拓荒者，改編充其量就只是發揚光大。


  "嫌疑犯X的獻身"講的是一個無賴前夫騷擾一對滿足於現況的母女，她們在莫可奈何的情

  況下失手殺了無賴前夫之後，洞悉一切的鄰居負責幫忙棄屍的故事，本作設定的最大謎團

  在於，這個鄰居強調母女倆，在面對警方的問話情況下，除了殺人一事外，在行蹤上的交

  代無論如何都據實以報，究竟是什麼樣的魔法，令警方得到了事實又有足夠的殺人動機的

  情況下，卻完全無法找到與被害者相關的直接證據，在無計可施的情況下，他們再次尋求

  天才教授的幫忙。


  就原創故事而言，這部作品之所以令太多人深陷於其中而無法自拔，詭計固然鬼神，但我

  認為真正的強大之處在於，東野塑造出石神哲哉這號人物太過折磨人心，同為不世出的天

  才，湯川學是集智慧與帥氣於一身的帝都大學教授，石神哲哉則是既不帥又不修邊幅，孓

  然一身的高中數學老師，卻平白無故、毫無所求替那對母女倆獨攬棄屍計畫，甚至早已做

  好失風承擔風險的準備，想來就令我雞皮疙瘩，他就不過是個鄰居而已阿。


  (這邊順帶一提，實際上根本沒有什麼帝都大學，但日本有個京都大學，而湯川學則是東

  野圭吾對日本第一位獲得諾貝爾講的物理學家-湯川秀樹的致敬。)


  先看過小說的人，基本上對於電影都會有種會被改爛的刻板印象，沒錯，我也有，尤其是

  小日本的日劇看多了，你真的會覺得他們的表演方式實在很傲驕，叫人家小日本很沒禮貌

  對不對，你去看他們講「紅豆泥」外加尾音，你真的會懷疑為啥要這樣好像小朋友講話的

  方式，直到看完這部片，我簡直要跪地磕頭，尊稱人家叫大日本帝國，這次我真的心服口

  服。


  接著我將說說，這部電影幾個太過強大的特點，第一就是選角，福山雅治將湯川學演得活

  靈活現，演到了簡直把湯川學與福山雅治畫上等號，導致東野圭吾後來也開始將福山雅治

  納入描寫湯川學的形象，除此之外，北村一輝飾演的草薙俊平好像比小說帥了一點，另外

  值得多提一點的是內海薰的誕生，這名腳色在小說中是沒有出現的，但是為了因應觀眾喜

  歡來點男女關係曖昧的元素，在劇中強烈透露出女性弱勢遭人使喚的日本文化，柴崎幸也

  演得不錯，光看他與"大逃殺"對比，演啥都有模有樣就覺得挺強的。


  唯一令我比較不滿意的，就是劇中一直強調花崗靖子非常漂亮，就連湯川學都到了想一親

  芳澤的程度，就讓我覺得這設定也太.......，好吧，松雪泰子可能是我不喜歡的型+熟女

  吧，但沒發現真正的美女居然就眼在天邊近在眼前，這也有點扯(柴崎幸阿還有誰)。


  終於要講石神哲哉的部份了，看到由堤真一飾演的石神，一定會覺得，哇靠!這傢伙簡直

  比石神還石神，其貌不揚又陰陽怪氣的，導演真會選角，直到我後來無聊去翻堤真一的來

  歷，我又再次跪地了，拜託，人家本人超級帥的阿(日本的賴神阿)，那種改造後逆天的程

  度，比劉德華在"瘦身男女"還強大太多太多了，外加那人神共憤的演技(誤)，OP。


  人家東野也算是有為了福山雅治在描繪湯川學的形象，但可沒有為了堤真一才去弄一個石

  神出來，這邊的對決堤真一算是小勝。


  其二就是詭計，對我而言有兩種情形是我認為只有推理小說能夠帶來的滿足感，一種是像

  "占星術殺人魔法"那種華麗的分屍詭計，看完會有一種「太強了，這種東西我怎麼可能想

  得到」，另外一種反而有點背其道而行，如本作堅不可摧的不在場証明詭計，看完則是一

  種「原來這麼簡單，我怎麼都沒想到」，而後者漸漸也變成推理界比較推崇的主流。


  這道理其實也不難理解，華麗的詭計就算是一套魔術，但真實世界通常是不太可能出現，

  你只能讚嘆其設計精巧而望其項背，而東野式的詭計似乎顯得寫實許多，我認為這也是他

  受歡迎的原因之一。


  第三就是糾結的情節，這點又得回到石神的身上作為觀點去談，之前所言，劇情設定了石

  神讓他只是個鄰居卻做連為人父母都不一定敢擔的罪，又原本應該是個能在學術界大放異

  彩的天才數學家，卻只能屈就在一間非升學為主的高中，無視於學生在課堂上打飛機，仍

  然忘我地解說自己最喜歡的數學，再用湯川學當做極端的對比，甚至最後屈居於監獄那段

  ，還開心的在想四色定理，搭配湯川學落寞的神情，看得連以理性自居的我都激動的眼框

  濕了起來，就知道這段營造的有多厲害。


  堤真一演的石神過分強大，基於這個理由，是我認為可以直接看電影的主因，因為小說的

  描寫還沒厲害到讓我心中有所漣漪，但是堤真一做到了，至於提真一與石神，在劇中還有

  很多豐富的傳奇色彩，我認為各位如果能夠自己去體會，或許感受會更多也說不定。


  你以為就這麼簡單了嗎?在這樣的氣氛之下，居然來了這麼一首，由福山雅治作詞作曲，

  柴崎幸演唱的"最愛"，這種搭配實在是太犯規了，本來還能夠禁的住淚水居然決堤了，我

  這個以男子氣概自豪的人，居然逼的我留下男兒淚，馬的，東野圭吾、堤真一、福山雅治

  ，你們可真好樣的。


  完美的搭配，有生以來終於有電影讓我領悟到感動的真諦，這是連"魯冰花"都辦不到的事

  。


  這樣講或許還是有人不懂本片的好，有時候東西的好是需要比較的，剛好泡菜也有拍，韓

  版的改叫"嫌疑犯X"，基本上的詭計與故事主軸沒有太大的差別，不過在人物上有點小小

  的變動，只是沒想到這輕微的變動對我而言非常致命，如果日版是100分，韓版大概只剩

  20分吧。


  我想再次強調，日版"嫌疑犯X的獻身"的偉大不是只因為他的詭計，人物與演技之間的搭

  配更是牽一髮而動全身，泡菜執意要演也不是不行，但他們顯然對自己太過自信，以為只

  要保留詭計與一些人物設定依舊是好漢一條，我也不想賣關子了，韓版的湯川學變成了一

  個胖大叔就算了，但設定也太令人吐血了，這胖大叔頂多就只是個見微知著的老練刑警，

  但是你以為石神的詭計是見微知著就能夠破解的嗎?這也太侮辱石神了吧，若非湯川學也

  是天才，這詭計誰想得到阿，這是原創的重點之一，天才間的對決阿。


  我想，他們嚴重忽略了這句話，「自己想出答案，和確認別人說的答案是否正確，何者比

  較簡單?」東野圭吾間接使用這句話，讓讀者們以為看似湯川學獲得勝利，但實際上石神

  技高一籌，而且日版有演出這道理的重要性，然而在韓版，雖然說多了幾分韓版犯罪寫實

  的風格，卻忽略了這個重要因素，只能說有形無神，只是一部利用東野的詭計拍的另外一

  部電影，根本不能稱韓版"嫌疑犯X的獻身"。


  (到底是想出詭計的作者厲害，還是解出詭計的讀者厲害，東野圭吾變相道出推理小說家

  的心聲，很值得大家思考)


  偵探的部份差距甚大高下立判，同樣的石神與金石固，雖然請到"不可饒恕"中飾演冷酷殺

  手的柳承範擔綱演出，或許是韓版導演決意想演出稍微不一樣的孤傲天才，而讓金石固比

  起石神多了些親切感，間接讓結局上的操作比起日版，也是悲劇，但不糾結，至於比較喜

  歡石神還是金石固是見仁見智，而我當然是認為，石神那才叫獨一無二，金石固則只不過

  是個食之無味棄之可惜的悲劇人物罷了。


  看電影的觀感是很奇妙的，如果我先看韓版在看日版，一定會認為韓版還不錯而日版更強

  大，但先看完日版在看韓版，反而會覺得韓版簡直是在侮辱原創小說。


  每次聊推理元素多點的電影，不小心就會多說了一點，但句句是肺腑之言，這部片子真的

  很棒，書也很值得買，推薦給大家。


  即刻短評(滿分5)


  劇情：  5     >>將東野圭吾推向巔峰之作電影玩美改編

  結局：  5     >>雖然我覺得花崗靖子很無腦，但似乎也只能這樣才能糾結觀眾

  氣氛：  5     >>演員、演技、感情等都非常到位

  推理：  5     >>天才的詭計天才解得出來，很棒的設定

  推薦：  5     >>各方面都完美，無從挑剔的神作


  --

