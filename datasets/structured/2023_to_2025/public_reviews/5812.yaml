content: '剛剛在Netflix 首頁看到就點開來看

  我沒有看過東野圭吾的小說

  或是其他作品翻拍的電影

  但這部片真的讓我覺得很好看！

  而且用印度的主角來飾演數學老師真的很適合

  尤其是兇手跟警察鬥智的時候

  這部片也稍微描寫了一下各個角色的人格特質

  感覺可以拍成迷你影集也是還不錯

  推薦大家可以去看！

  有人看過類似的電影也可以一起討論～


  --'
