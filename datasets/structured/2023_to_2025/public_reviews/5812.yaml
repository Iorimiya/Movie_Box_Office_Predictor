title: '[討論] 嫌疑犯X的獻身，三種版本最喜歡哪個？'
content: '今天把嫌疑犯X的獻身中國版本的看完


  整個還是大推日本版本


  不管是演員的演技

  或場面的流暢度還是三版本最頂尖


  日本版硬要說不好的地方就是

  堤真一演技強壓福山雅治

  顯得男主沒有發揮

  尤其最後一幕堤叔絕望的大喊

  震碎多少宅宅的心...淚都潰堤了



  韓國版有點不同的是

  少了物理天才這個角色

  最後的結局也算幸福



  說說中國版...

  就可能拍在日本版之後

  看起來就少了點味道了



  各位覺得呢？



  --'
