url: https://www.ptt.cc/bbs/movie/M.1491106499.A.131.html
title: '[普雷] 嫌疑犯X的獻身(中國版)'
content: "因為在中國工作，3/31上映馬上就去看了\n東野在中國非常紅，原本以為人會很多，但人其實還好，大概坐了5分滿吧\n\n以下可能會有導演表現手法雷\n\
  \n先講優點：\n1.雖然林心如已經是26的形狀了，但本片的演出蠻帶感的，不輸松雪泰子\n2.母親和女兒的戲分有變多，還不錯\n\n缺點：\n1.日版福山雅治的湯川，中國版挑了一個很像明道加麥可法斯賓達的人來演，怪怪的\n\
  \  演技也一直讓我很出戲，雖然本片的主角不是他\n2.配樂極差，無法帶出本片應該要有的氛圍，搞的很像懸疑動作警匪片\n3.中間加了一段飛車追族的戲碼，完全沒有必要，為了讓贊助商賣車而硬加的劇情\n\
  \n4.最大缺點中的缺點就是原著最後一幕石神崩潰發出絕望叫喊的場景\n  中國版蘇有朋把它拍的極糟，張魯一的演技其實是可以做到不輸堤真一的演出\n  但不知為何這邊居然拍的如此潦草....\n\
  \n\n總的來說，如果沒看過日版其實這部算可以了，畢竟劇本就是那麼出色，怎麼拍都\n不會太差。但是，沒有比較就沒有傷害。本片的藝術含量還是跟日版有點差距\n\n\
  以上\n\n--\n他演技其實可以了，拿堤桑跟他比是越級打怪，頂多就只能不輸\n是說如果你看了就知道\n比亞迪滿滿的置入性行銷啊"
