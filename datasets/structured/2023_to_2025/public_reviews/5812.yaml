  大部分都還不錯，雖然有的推理有點少

  這邊大概就聖女的救贖我比較不喜歡吧


  哈哈....我在推理版也有PO

  偶爾也會在那發表推理小說的心得


  問題是

  我沒先看過小說的話

  還真的不知那會有啥含意


  品味不同囉...不過是松雪泰子


  我是說他演得石神其貌不揚


  我覺得也不是說故意讓

  電影的湯川有點神

  而且石神也就在便當店那露出破綻一次

  還是回到那句話

  出詭計的人與解詭計的人

  誰比較厲害的問題


  說得好

  所以東野圭吾後來才又這樣設定真夏方程式的結局吧


  我沒看日劇版

  但電影真得很神


  以他本人的帥度裝成石神

  反差也夠大了吧

  我沒去估狗本人之前還想說哪找來這麼像石神形像的人咧


