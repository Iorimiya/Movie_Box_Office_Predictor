title: '[開箱] 韓版 嫌疑犯X的獻身 藍光BD 開箱'
content: '圖文網誌版：



  日本片名：容疑者Xの献身

  香港譯名：神探伽俐略 - 容疑者X的獻身

  台灣譯名：嫌疑犯X的獻身

  英文譯名：Suspect X


  在此之前，我們先來感嘆一下福山雅治結婚這件事...(被毆

  好啦，過那麼久不提了XDDD


  其實我很訝異韓國竟然發了這片耶

  據我所知這是這部片第一次發行中字BD

  所以當時就算是不知道是繁中還是簡中

  一有消息就給他預訂下去啦!!!!


  底下來開箱


  外紙盒





  內容物





  小冊子與節錄









  關於中文字幕的部分，我還沒完全看過

  不過確定是繁體中文字幕

  而片名翻譯使用的是台灣的嫌疑犯X的獻身

  我想台式翻譯的可能性較高喔~~


  另外，這片也有收錄日文字幕喔~~


  以上!!



  --








  --

  我也是那邊的常客喔~~

  歡迎常到Video版逛逛喔~~'
