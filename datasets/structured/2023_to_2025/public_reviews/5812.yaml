url: https://www.ptt.cc/bbs/movie/M.1449409910.A.EB9.html
title: 'Re: [好無雷] 嫌疑犯X的獻身 完美的電影'
content: '防雷


























































  個人看完原po極力稱讚此片.好奇心驅使也看了本片

  但個人對此片意見

  1.石神有好幾天都在公共電話通話.雖然被竊聽的機會低.但出事後.應該

  會有警察監視著.有可能在電話亭天花板裝竊聽器也不一定.覺得是本劇很大的漏洞



  2有個疑問就是石神叫流浪漢去旅館待一晚.但和她前夫事不同人

  不會被旅館人員指認嗎???




  覺得看完此劇覺得普普而已.不會說難看.但也沒有很欣賞此劇.

  不過堤真一真的演的不錯.個人是被他在阿政與艾利.飾演社長一職

  所吸引來看此劇



































  --'
