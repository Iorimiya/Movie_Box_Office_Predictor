url: https://www.ptt.cc/bbs/movie/M.1674354485.A.F39.html
title: 'Re: [好雷] 心是一家伙仔的所在：《詐團圓》'
content: '新春第一天，決定要來做好事來勸世


  從2023開始的第一天到現在看了7部電影

  ，本來以為「我的婆婆」是最讓我看完生

  氣的電影，但沒想要詐團圓才是最讓我生氣

  ，尊重每個人喜歡電影的見解，但我真的要

  來勸世，不如去看別部片。



  雖然不該用高標準來看待賀歲片，畢竟賀歲

  片不用拍得多有深度，通俗易懂、好笑開心

  就好


  詐團圓真的好笑嗎？


  看看卡司名單，裡面唯一的搞笑擔當就只有

  邰哥，雖然我是木曜粉，但邰照明的笑點就

  是瘋神無雙那套，甚至瘋神無雙短劇都比這

  部電影好笑，充其量就木曜系列的尬笑點。


  陳昊森、屁孩、盧以恩3個都是超級尬的笑點

  ，唯一有讓我笑出來就只有「硬了」橋段。


  詐團圓真的詐嗎？


  有人說詐團圓像或致敬信用詐欺師，我覺得

  這根本侮辱了信用詐欺師，名為詐團圓，但

  完全沒有任何的詐術，完全不符合基本邏輯

  的詐劇情，是把觀眾的智商當會被電話轉帳詐

  騙的人嗎？


  詐團圓真的轉折感人嗎？


  完全不知道哪裡感人，就算感人也是淑芳阿

  姨演技救起來，換人演根本不會有任何感人

  的地方。


  難道要跟我說是最後隋棠不認陳昊森嗎？我

  的天，這是全劇情緒劇情轉折最怪異的地方

  ，別說感人了，劇情不到1、2分鐘，從不認

  就又到團圓，莫名奇妙。


  讓我覺得唯一值得感人的，可能就是莊家三

  兄妹互相的思念之情，但也僅限於幾秒。




  如果你是那種都會挺國片的，歡迎進場支持

  ，我也希望國片好，但希望看完能別生氣


  其他人過年想看片，可能去看個鱷魚歌王還

  什麼的可能比較不會那麼生氣。



  葉天倫：少了綜藝天王豬哥亮，如何拍一部

  成功的賀歲片？



  ans : 葉天倫沒有豬哥亮，還是不行


  -----

  Sent from JPTT on my Xiaomi 21091116UG.


  --'
