title: 'Re: [討論] 詐團圓如果換角換劇情會比較好嗎？'
content: '剛剛二輪看完


  先說優點 主題曲好聽


  食物拍得真好吃


  陳昊森假裝阿星上身那段演的很感人


  毫無疑問 淑芳阿姨跟謝大姐演技真的非常好


  但葉天倫最大的問題就是


  想搞笑中帶文藝 文藝中搞笑


  這兩者需要極好的配合與平衡


  搞得好 就會是神作


  比如人在囧途


  比如我不是藥神


  或者差一些主角光環特色強大


  其他演員繞著主角鋪陳


  比如雞排英雄 大稻埕


  但這次他沒有豬哥亮了


  企圖心過大 結果搞成四不像


  可惜啦 我可以理解 很多時候


  演員要相當影帝影后


  真的要靠導演跟劇本


  而葉天倫反而是需要演員救的那個導演


