url: https://www.ptt.cc/bbs/movie/M.1674266671.A.D70.html
title: '[新聞] 【春節電影看板】《詐團圓》炸出台客新'
content: '新聞網址：




  【春節電影看板】《詐團圓》炸出台客新潮流 《巴比倫》重現好萊塢百年前風華


  2023/01/21 05:30


  記者許世穎／專題報導


  今年賀歲檔按慣例從春節前一週提前開打，包括一上映就拿下全台票房冠軍的《灌籃高手

  The First Slam Dunk》，以魔性舞蹈掀話題的《窒友梅根》，還有台片《我的婆婆怎麼

  把OO搞丟了》和《山中森林》等電影。除夕前則有《巴比倫》、《詐團圓》、《天龍八部

  之喬峰傳》等片接力上映；動畫、喜劇、恐怖、劇情、武俠等類型全到位，題材相當豐富

  。


  ★《灌籃高手》掀回憶殺 找回感動


  上映日期：1月13日


  必看亮點：火紅32年的經典漫畫，激發觀眾「籃球魂」，喚起回憶殺。


  讓粉絲引頸期盼26年的《灌籃高手The First Slam Dunk》在台、日上映都創下佳績，漫

  畫原作井上雄彥親自擔任電影版編導，從「新」的角度切入，把當初作品沒畫到的宮城良

  田故事補上，賦予電影版「新的生命」，井上雄彥更表示希望能讓大家「找回初次的感動

  」。


  ★《窒友梅根》魔舞吸睛 驚駭殺戮


  上映日期：1月13日


  必看亮點：當代恐怖大師溫子仁、傑森布倫聯手打造，人偶「梅根」魔性舞蹈吸睛。


  《窒友梅根》改編自《厲陰宅》鬼才導演溫子仁原創故事，他也親自擔任電影監製，片中

  具備高度人工智慧、栩栩如生的玩具人偶「梅根」，宛如新世代「鬼娃恰吉」，原被設計

  成小孩子最好的玩伴和令家長最安心的盟友，沒想到卻因極端的保護慾，造成無法想像的

  嚴重後果，帶來一連串殺戮。


  ★《山中森林》新世代江湖兄弟情


  上映日期：1月13日


  必看亮點：展現台灣新世代兄弟情義，金馬影帝李康生祭出名場面演出。


  台片《山中森林》集合金馬影帝李康生、李千娜、「王子」邱勝翊、郭雪芙、瓊瑤女神陳

  德容、謝承均、黃遠和吳震亞等人一同演出，描述台灣新一代江湖兄弟的日常與愛恨，在

  高雄電影節世界首映時還曾掀起「兄弟」搶票熱潮，首映票券銷售一空，氣勢驚人。


  ★《我的婆婆怎麼把OO搞丟了》爆笑催淚


  上映日期：1月13日


  必看亮點：《我的婆婆》劇版劇情延伸，鍾欣凌將喜劇片當動作片在演。


  溫馨喜劇《我的婆婆怎麼把OO搞丟了》延續超夯台劇《我的婆婆怎麼那麼可愛》，金鐘戲

  后鍾欣凌攜手黃姵嘉、許傑輝、張書偉、「Darren」邱凱偉、王少偉、楊銘威、蘇晏霈、

  「勇兔」林筳諭等卡司重磅回歸，打造今年最台、最鬧的爆笑喜劇，搞笑之餘更笑中帶淚

  。


  ★《愛‧子》休傑克曼演技爸氣登頂


  上映日期：1月13日


  必看亮點：休傑克曼化身內斂父親，再創演技高峰。


  「金鋼狼」休傑克曼主演的劇情片《愛‧子》，由首次執導《父親》即獲得奧斯卡6項提

  名的法國鬼才導演弗洛里安澤勒編導，並力邀兩屆奧斯卡影帝安東尼霍普金斯回鍋合作，

  還有蘿拉鄧、「白寡婦」凡妮莎寇比等演技派巨星與休傑克曼一同飆戲。


  ★《拼音戀習曲》夢幻忘年師生戀


  上映日期：1月19日


  必看亮點：忘年戀共譜充滿激情的愛情冒險，劇情時而性感、時而荒謬。


  德國女導演妮可葉特克雷畢茲執導的浪漫愛情電影《拼音戀習曲》，也在農曆春節帶來令

  人耳目一新的浪漫感覺，該片描述一段相差41歲的忘年師生戀，自由又夢幻，先前參加柏

  林影展，被譽為歷年來「最輕盈夢幻的愛情電影」，美國《綜藝報》形容該片有「引人入

  勝的化學反應！」《銀幕》雜誌也盛讚它賞心悅目，猶如一道「令人驚豔的美味甜點」。


  ★《巴比倫》窺好萊塢明星起落


  上映日期： 1月20日


  必看亮點： 重現百年前的舊好萊塢昔日風華，小布、小丑女等眾星雲集。


  《巴比倫》為《樂來越愛你》金獎導演達米恩查澤雷最新力作，找來「小布」布萊德彼特

  、「小丑女」瑪格羅比、迪亞哥卡爾瓦、陶比麥奎爾等人演出，刻畫了多個角色在好萊塢

  創立初期的起落，以及野心勃勃、狂野不羈和全面失控的人生故事。


  ★《鱷魚歌王》人與鱷精彩城市冒險


  上映日期：1月20日


  必看亮點：鱷魚用雙腳走路，還能載歌載舞，和小朋友玩耍，展現強烈親和力。


  改編自全球暢銷知名繪本的《鱷魚歌王》，描述男童喬許不情願的與家人一起搬到紐約，

  意外在家中發現了一隻名叫萊歐的鱷魚，有著驚人的歌唱技巧及舞台魅力，從此喬許和萊

  歐便形影不離的共同探索這座城市，並幫助彼此面對家庭與生活問題。


  ★《詐團圓》豪門鬥心機 炸笑炸淚


  上映日期：1月20日


  必看亮點：陳淑芳、隋棠互鬥心機，語言包羅萬象，包括國語、台語、客語、粵語和英語

  。


  由億萬導演葉天倫執導的《詐團圓》，集合影后陳淑芳、隋棠、邰智源、陳昊森、謝瓊煖

  等人攜手賀歲，故事從陳淑芳飾演的豪門掌門人欲交棒開始，龐大家產引發各界人馬大顯

  神通，拍攝場景從美國舊金山到台灣，語言更包羅萬象，不僅國語、台語相尬，更偶見客

  語、粵語和英語齊飆，劇情更是峰迴路轉、炸笑炸淚，炸出全新「台客新潮流」。


  ★《天龍八部之喬峰傳》武林最強出招


  上映日期：1月20日


  必看亮點：甄子丹集合金像獎班底，打造華語武俠巨製。


  賀歲檔港片代表有「宇宙最強」甄子丹親自監製、導演及主演的《天龍八部之喬峰傳》，

  甄子丹的全新喬峰造型，粗獷又不失氣度，更展現出喬峰天下第一的好身手，過去一個打

  十個的他，這次施展「降龍十八掌」以一敵百，動作場面精彩可期。




