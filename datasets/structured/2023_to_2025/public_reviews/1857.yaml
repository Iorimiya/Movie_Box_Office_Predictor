title: '[好雷] 心是一家伙仔的所在：《詐團圓》'
content: "本文涉及劇情，但未揭露關鍵轉折，請斟酌後再讀。\n\n\n\n　　圖文網頁版：\n\n\n　　\n\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n心是一家伙仔的所在：《詐團圓》\n\n\n\n\n　　《詐團圓》這部電影，就像台菜自助的饗食盛宴，鬧熱而奢華：演技精\n\n湛的演員，台灣與美國舊金山都市繁華的參差對照，客閩英華粵語的自然切\n\
  \n換，特屬台灣的客家美食、陶瓷、建築、年節傳說（我喜歡那個不沉之島的\n\n故事，簡直是某個願望的隱喻，大概是我最意料之外的淚點），台灣人最重\n\n視的「情」，可以列為標籤的「詐騙」……甚至背景裡一掠而過的風景，都\n\
  \n呈現這幾年進行的建設與拓展。每當意識至此，都會為身為台灣人感到驕傲。\n\n\n\n　　即使去除「賀歲」的元素，《詐團圓》的劇情，也有意料之外的驚喜。\n\n\
  故事敘述王芸（隋棠飾）與 Jason（陳昊森飾）這對母子連同雜貨店老闆華\n\n仔（邰智源飾）原本在美國唐人街以美貌與魔術四處行騙度日，直到某日發\n\n現陶林企業的董事長Mrs.\
  \ Apple（阿婆）莊黃淑美（陳淑芳飾）來到舊金山\n\n尋找已逝兒子的陶藝作品，便設計讓 Jason假扮阿婆金孫，詐騙金錢甚至繼\n\n承人的身份。而阿婆帶三人回到台灣吃團圓飯的決定，也引起莊家人的注意\n\
  \n──詐騙、遺腹子、金孫、豪門、接班人，這幾個關鍵詞在台灣鄉土劇往往\n\n以男性為中心，但意外的是，這部電影真正的「詐欺師」，都是「母親」。\n\n\n\n\
  　　隨著劇情層層推展，先是在董事會選舉上，莊安慈（謝瓊煖飾）一反約\n\n定提名自己的兒子莊承宗（屁孩／林政融飾）就任，還要兒子投給自己；其\n\n次揭露阿婆邀\
  \ Jason一家來台，表面上是思念兒子與確認身份以認祖歸宗，\n\n再用時而精明、時而「裝」傻測試家人／ Jason的真實反應，正是「『莊』\n\n家」手腕，唯淑芳阿姨堪擔重任。最意外的騙局則是王芸為了\
  \ Jason的未來\n\n選擇放手的那場戲，相對於在舊金山因為經費有限（XD）演得太假而被當場\n\n揭穿，這場用情之真證明了愛毋須檢驗，全心全意的付出與關懷就足以建立\n\
  \n緊密的連繫。\n\n\n\n　　除了母親是最大的詐騙師，莊安慈身兼母親、女兒、與姐妹的三重身份，\n\n對著莊承宗嘮叨孕育艱難、要他承繼家族的深切期望，想要爭取母親認同\n\
  \n（燒掉重作vs瑕疵磨過的各執己見，不只是經營方針的分歧，也是各自認知\n\n「接班」的隱喻）、落淚道歉的情感表現，看似對母親總是懷念哥哥心有不\n\n滿，但與妹妹莊安幼（林子熙飾）回憶過去兄妹三人討論如何一起撐起家族\n\
  \n事業，手足間各司其職的親密無間與無邊思念，實與母親無異；以及最後獲\n\n獎，得到肯定後看著妹妹辭難達意的感言，每一份心／機背後都是對這個家\n\n的愛，包辦了全劇的淚點。三位母親既有無私的愛，也有因愛而生的私慾，\n\
  \n同時也有對「愛」的反省──莊成興（鍾承翰飾）的死，始因母親莊黃淑美\n\n堅持他接班的不肯放手；而 Jason與莊承宗也有自己的興趣與目標，卻因各\n\n\
  自的環境不能得償，反而是想要繼承家業的莊安慈姊妹，不僅不是第一、甚\n\n至是第四第五順位。「外面的想進來，裡面的想出去」說的豈止是美國，亦\n\n是這個豪門家族由於傳統觀念導致難從人願，偏有親戚覬覦錢權，「能撈就\n\
  \n撈能騙就騙」的意圖毫不掩飾──而成為莊家人各自使「詐」、也是最終團\n\n結的動機。在這部電影裡，母愛不再是無私的、一味的奉獻與勒索，而是抱\n\n怨、衝突、掙扎、費盡心機，最終心甘情願還予自由，共同守護那個最在意\n\
  \n的「家」。\n\n\n\n　　誠然母親們是最大的詐欺師，年輕輩的三人組：狡獪好強的 Jason、認\n\n真聰慧的小陶罐（盧以恩飾）和奇想連發的莊承宗亦有精采的火花，呈現了\n\
  \n在相處相助過程中性格各異，卻能逐漸連成一線，為莊家竭盡所能的同心協\n\n力。有趣的是，在初入莊家，誇下海口要將「阿婆變成我的人」、號稱偷心\n\n詐欺師的\
  \ Jason，從母親那裡學來「騙別人之前，要先犧牲」的準則，最後\n\n卻被莊家收得服服貼貼；一開始跟母親爭執吵著要離家的念頭，最後繞了一\n\n大圈，發現自己終究是母親的孩子──比起爭執，一開始與母親行詐的熟稔\n\
  \n與合作無間，在母親挨打後立刻失去從容；以及在莊家表演的那一手，成功\n\n後對母親的指責，種種反應，才是他最真誠無偽的感情。在莊家與母親最終\n\n衝突的那場戲，接續在莊家決定接班人後的成長，此刻卻在母親面前成為被\n\
  \n拋下的小孩，大概是「什麼角色都能演」的 Jason最真情流露的角色，也促\n\n使善詐的王芸在所有角色裡最艱困的發揮──因為孩子和心都拒絕配合。\n\n\n\
  \n　　「家人手牽手，背後留一手」的宣傳詞，我想，那一手既是心機，也是\n\n心願，最後共聚的年夜飯，正證明了愛是實踐，也是自由，那麼，無論身在\n\n何處，即使有時月光、甚或有時星光，不必等到生死臨界，只要心能同在，\n\
  \n那就是團圓，就是家──一家伙仔。\n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\
  \n                                  陳斐雯  貓蚤札（其三）\n\n--\n\n　　去看就知道了。\n\n\n　　推薦，是滿不一樣的賀歲片。\n\
  \n\n　　沒看就說不行，這部電影這麼被特別針對，還滿有趣的。\n\n    所以決定自己去看，看完倒覺得還好沒錯過。大概我見識太淺吧。\n\n\n　　想來我是沒有深度的人了。我還滿喜歡電影裡每組三角關係的設計，\n\
  \n　　還有詐騙緣於情感上的在意。何況孰真孰假，真假難分，正是電影裡有趣的地方。\n\n　　搞笑的部分就見仁見智，在我看來只是點綴，不是主軸，\n\n　　而且有趣的是，你覺得好笑的點反而是讓我最尷尬的地方。\n\
  \n\n　　真的。\n\n\n　　你這麼說我倒是認真重新看了預告……\n\n　　除了我看不出宣傳搞笑的部分（不是衝突與「是誰騙了誰」的懸念嗎？），\n\n　　老實說預告都是詐騙。\n\
  \n　　前半的鋪陳著重在兩個家庭的生活環境和融入的過程，有些轉場確實不太順，\n\n　　（可能我只看一次抓不太到節奏）\n\n　　但後半的情感層面我覺得是足夠的。\n\
  \n　　把重點放在家庭與文化衝突，會比搞笑更符合期待。\n\n　　只是和客家過年習俗結合，還有場景的用心，\n\n　　作為賀歲片我是看得津津有味就是了。"
