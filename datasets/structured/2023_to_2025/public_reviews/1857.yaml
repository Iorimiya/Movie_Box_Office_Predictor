url: https://www.ptt.cc/bbs/movie/M.1684387991.A.EC9.html
title: '[好雷] 詐團圓 & 那個男人'
content: '詐團圓

  好看，超好看，整片哽咽地看完

  可能小銀幕沒買票要求沒那麼高

  但真的覺得比大稻埕跟雞排英雄好看

  都跑去舊金山拍了，拍片開始國際化

  真希望角頭系列也能一路拍到美國去


  之前過年因為大稻埕所以不想買票

  怕踩雷，但看電影台播完後改觀了

  這片應該能成為葉大導最好的作品


  可能文化部長是客家人

  所以最近茶金跟這片都是客家題材

  而且都拍得很好看、很有水準

  比上一個留法的女文化部長好太多了

  因為這個部長感覺是真的懂戲

  雖然他的名子不太好記

  但他真的很懂得用人

  果然學歷不等於能力


  看完這片才知道鶯歌陶瓷那麼賺錢

  就像茶金一樣，等於是陶瓷金

  客家人不愧是黃種猶太人

  超級會做生意，賣陶賣茶

  能然能賣到買飛機住台北賓館

  這片裡面的莊嘉豪宅都在台北賓館拍的


  隋棠真的很美，陳昊森很帥很會演

  這片應該也會是隋棠目前最好的作品

  就像爆走女外科是蔡淑臻的代表作一樣


  整個劇本都很完美，很完美的結局

  後半段都是哭著看完的，超級感人

  最後大家一起在舊金山吃團圓飯很圓滿

  可能陳淑芳跟隋棠在裡面都演外姓媳婦

  所以才大部分都講台語，其他叔輩才講客語


  反正這片很多種語言

  英、粵、客、台、國~~~~

  總之我們雞排英雄的葉天輪國片終於回來了 !





  那個男人


  從小因為盲劍客的關係

  一直很喜歡松竹公司的片

  這片也是松竹出品，而且得了不少大獎

  故事真的跟詐團圓一樣錯綜複雜

  只是一個是賀歲片一個從頭都悲到尾


  因為我是安藤櫻的粉絲

  所以只要有她的片必看

  她有一張標準的日本臉


  裡面她的公公柄本明演老囚犯

  也是看到律師妻夫木聰就說看到臉

  就知道他是日籍韓國人，日本人很排外

  就像台灣人也對東南亞新住民排外一樣

  就算入籍日本有正當工作一樣被歧視


  這片演出很多日本的社會問題

  殺人犯的小孩等等，還有離婚家庭

  小孩不斷跟不同的爸爸姓或從母姓

  在日本只有犯過一次錯

  就會被社會性死亡


  就像鄭捷跟小燈泡兇手的家人

  現在也正承受的男主角的社會壓力

  男主角爸爸是個慘忍的殺人死刑犯

  小孩長大也隱姓埋名改名換姓

  是拳擊天才都不敢成名而退出拳壇

  去當伐木工人，跟安藤櫻相依為命


  裡面最讓我遺憾的就是拳擊教練

  沒有好好開導男主角變拳王真可惜

  如果是我就會跟男主教說

  你爸當年都是沒有練拳擊

  不然可能早就成名發財了

  也不用天天賭博殺人搶劫


  你現在遺傳你爸這種天賦

  應該代替你爸好好活著

  成為世界拳王幫你爸還債

  而不是一直逃避家族的原罪


  看完這片感覺這社會一堆人改名換姓

  都想要洗掉過去不堪的往事

  不想讓人知道，不然沒朋友

  像鄭捷小燈泡兇手的家人一定也很低調

  因為社會歧視永遠都不會放過他們的感覺

  就像日本人歧視韓國跟中國移民一樣


  這片有一點看不懂的是

  裡面真正的湯屋繼承人谷口沒死

  那為什麼能把名子給安藤櫻老公?

  谷口倒底跟殺人犯的兒子是甚麼關係

  最後透過FB找到谷口，谷口又是甚麼故事?

  這片跟小偷家族一樣實在拍得很慢很悶

  完全不會想再看第二次

  麻煩看過的人跟我講解一下

  不然只好去看"越哥說電影專注好電影"

  不過他好像也還沒看過這片，還沒上片。


  --'
