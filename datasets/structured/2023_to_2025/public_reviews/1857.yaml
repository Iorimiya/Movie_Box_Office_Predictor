title: '[新聞] 《詐團圓》拚票房破5億 陳淑芳泳裝照謝票'
content: "《詐團圓》拚票房破5億 陳淑芳泳裝照謝票\n\n04:10 2023/01/19 中國時報 李承陽\n\n\n隋棠（左起）、陳淑芳、陳昊森等演員昨出席首映會並立下票房公約。（李承陽攝）\n\
  \n賀歲片《詐團圓》18日首映會，主演金馬影后陳淑芳撂狠話，高喊：「恁祖媽跟你拚了，\n票房破5億就穿泳裝拍寫真謝票啦。」語驚四座的霸氣宣言，讓導演葉天倫跟演員們被拱\n\
  跟進，看到84歲的陳淑芳這麼有魄力，眾人也加碼福利。\n\n片中飾演高顏值詐欺母子檔的隋棠跟陳昊森，提到催票房的票房公約，演出媽媽的隋棠把\n球丟給鮮肉兒子陳昊森，他也聽「媽媽」的話立下「腹肌公約」，允諾票房破億就露出精\n\
  壯腹肌，同片演員屁孩則選擇露屁股。\n\n該片20日上映，不只電影吸睛，音樂也引起討論，金曲歌后彭佳慧獻唱主題曲〈一家伙仔\n〉，新歌本周上架就登上KKBOX台語新歌榜冠軍，感動力無遠弗屆，受觀眾喜愛，和電影\n\
  相輔相成，讓不少看過電影的觀眾有感而發說，本以為是賀歲喜劇，卻哭得一把鼻涕一把\n眼淚，連觀眾都被「詐」一波。\n\n#謝票 #票房破 #新歌 #隋棠 #公約\n\
  \n--\n佛教經典的\n是 是菩薩成佛之道\n        是 佛經\n  是 佛      是 菩薩\n\n\n\n--"
