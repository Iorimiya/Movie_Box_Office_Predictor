url: https://www.ptt.cc/bbs/movie/M.1678068491.A.453.html
title: '[好雷] 詐團圓＆我的婆婆賀歲片回顧'
content: '今年過年去看了詐團圓跟我的婆婆把00搞丟了兩部電影，之前原本想說過節打心得。不過一方面有些懶惰，再來怕被說是廠商文，宣傳之類，雖然是好雷可以推薦不過就拖到現在了。


  這兩部電影都是春節被妹妹運用過年就一定要看賀歲片的特權，被拖來看，還因為陪家人，親戚看了兩次。不過意外的兩部都是一部看之前覺得浪費錢的爛片，可是看完後覺得感動餘韻十足的優質電影。








  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~







  當初大概大年初二配妹妹們去看我的婆婆把00搞丟了這是＜我的婆婆怎麼這麼可愛＞這部台灣連續劇結尾後的故事。類似日劇ova.電影版概念。


  故事前面1／3在人物介紹，腳色眾多每個腳色粉墨登場得很雜亂無章。婆婆子女間的感情，糕餅點婦間事情 以及把00（圈圈是一個藝人人名。婆婆喜歡得人）搞丟部分寫得很亂。中間也是飯店，蛋捲置入性行銷嚴重，有些過分
  ，然後搞笑梗有些無聊。


  但是中後面婆婆告白說00是她以前子女沒回來年夜飯去外面散步聽到音樂的救贖，是那時候拯救了她。子女都不在，所以她才會投入於偶像的狂熱。最後結局00也給她一個吻，跟以後好像VIP票吧。以及結尾全家在一起吃團圓飯，女兒原本心儀男神要找她也因為疼惜婆婆決定還是陪家人。然後婆婆用VR眼鏡看到過世小兒子。婆婆倒吃甘蔗越嚼越香。



  我的婆婆開頭尷尬但是結尾感人，記得之前我有時沒回家吃飯還被我妹說想想這部片的婆婆，叫我回家吃飯。

  總之，這是部之後電視台播放沒看過電視劇也值得一看的電影。



  ～～～～～～～～～～～～～～～～


  ＜詐團圓＞

  這部是隔天再度被我妹硬拗去看的電影。也是意外的好看。我之前也是常聽到淑芳阿嬤，台劇很有名得人，但是我很少看台劇，但是這次真的領教到她魅力了，真的薑是老的辣。


  詐團圓開始講述男主角，和媽媽（隋棠）和媽媽男朋友（邰智源）在美國開小商店兼騙子過得很不好，之後知道台灣陶瓷陶林企業董事長莊黃淑美阿嬤到美國，就拿出一個假碗說男主角是阿嬤兒子。之後馬上被識破後阿嬤說有緣帶他們回台灣看下。然後阿嬤有失憶問題需要幫忙。



  之後就是客家菜餚的廣告秀，陶瓷介紹，客家大宅的建築。這部分的廣告真的比我的婆婆好，沒有提名字，但是都會讓人垂涎三尺，讓我之後查詢客家菜餚。我後來有去準備訂永和小館了。以及長輩家庭繼承人問題的內鬥，小輩沒有自己夢想，以及女子沒有繼承權問題的苦惱分支。


  中後面，繼承人投票那邊原本以為是好人被姑姑背叛，跟壞人合作想要讓兒子繼承，但是後來反轉，阿嬤投票給姑姑，說要開明讓女子姑姑繼承，相信她們也可以。

  繼承人投票部分反轉蠻感動的。


  最後20分鐘說其實男主角真的是這家的兒子，反轉成功。然後媽媽怕拖累說不想養男主角讓男主角生氣離開。最後也是一番折騰所有人和好，美國小屋子吃客家團圓飯，然後陶瓷陶林企業在姑姑帶領得獎。一切都很美好，但說阿嬤最後開始沒有失憶一切都是假的再次反轉www。


  詐團員這部大概開始中間尷尬部分，中間家庭鬥爭，後面媽媽的爭吵，其實導演什麼都想塞，但是100多分鐘電影塞不下這麼多就有些趕場問題。現在看來有些太多元素繼承，父母，阿嬤失憶混合，但是瑕不掩瑜，賀歲片結尾好一切都好。


  詐團圓有空可以看下，低智商的頂尖對決（稱讚）。然後客家文化推薦電影。之後電視台有播我應該也會再看一次。


  --'
