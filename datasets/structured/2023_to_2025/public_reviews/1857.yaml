title: '[爛雷] 《詐團圓》真的被詐了'
content: '剛看完2分鐘，還在映後，真的受不了來發文


  淑芳阿姨、謝瓊煖不要把演技浪費在這邊啦


  整部劇情風格怪異、笑點很尬、要好笑不

  好笑、要感動也不夠感動


  至於邰哥，身為木曜粉，就該推


  隋棠美就夠了


  陳昊森整場都超級尬



  今年2部國片賀歲，完全OUT！！！


  但彭佳慧唱的歌，是真的很棒！


  陳昊森本人有夠帥




  -----

  Sent from JPTT on my Xiaomi 21091116UG.


