url: https://www.ptt.cc/bbs/movie/M.1684404497.A.3C0.html
title: '[  雷]  詐團圓，有笑有淚的賀歲片'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  這週末在 D+ 上看了詐團圓

  完全就是衝著邰哥來的

  好久沒看到他有電影作品

  果然戲中的他與以往他的風格一樣搞笑功力一流

  幾個笑梗完完全全就是他的路數

  感覺應該很多都是他自己加戲演出

  才會這麼有邰味



  女主角隋棠也是好久不見了

  生了三胎狀態還保持的那麼好

  幾年過去了在螢幕上還是能保持那種仙氣

  氣質大概是從年輕到現在熟齡都不曾改變



  這也是我第一次看到陳昊森演出比較喜劇的角色

  坦白說真的有搞笑的潛力

  拳頭硬了那邊我笑死

  他大概也是能走一本正經講幹話的路線



  看完滿喜歡隋棠演的角色的

  一個為母的無私與偉大

  因為兒子不是他的

  即便是她撫養長大 她知道她沒有權利霸佔

  應該讓他跟真正的親人見面

  再者那裡又是一個有錢的家庭

  如果傑森要完成自己的夢想可以得到較多的資源

  與其很直接了當的告訴傑森他出生的事實 讓人晴天霹靂

  王芸用這樣的方式對一個孩子來說衝擊是最小的

  畢竟藉由這個詐騙的過程也讓傑森跟阿婆家庭的成員相處

  她也知道如果傑森真的接下接班位置

  對他在家中的人際關係會受影響 會變成箭靶遭受很多攻擊

  甚至那也不是傑森想要的

  所以安排了這樣的結局是對大家最好的方式

  如同阿婆所講

  從中可看出一個母親的偉大

  她拋下了占有傑森自私的想法最後又幫兒子做了最好的安排

  也呼籲了律師在裡面所說的

  養育之恩比血緣還偉大 這部真的好笑又感性的QQ


  如果自己是隋棠的角色

  絕對沒辦法那麼爽快地將撫養 20 年的孩子

  歸還給有錢人家啊～



  -----

  Sent from JPTT on my Samsung SM-S9010.


  --'
