url: https://www.ptt.cc/bbs/movie/M.1674117705.A.581.html
title: '[好普無雷] 詐團圓'
content: '昨天抽中特映票~ 其實真的沒有前面那篇說的那麼糟

  我已經算笑點很嚴格的人了 但還是笑了幾回

  全場是真的蠻多笑聲的 而且最後也蠻多人舉手說有落淚


  當然 缺點還是有的...

  1.葉天倫的劇情設計:他的風格跟品味就是那樣

  這次劇情主線都沒什麼問題~ 甚至劇情幾度反轉 設計的比以前劇本都有料

  但是如果拆開來看 一段段的銜接 有些事件的設計就顯得蠻幼稚跟太不現實 影響入戲程度


  2.葉天倫的笑點:這次已經比過去有經過設計了 但還是不免有類似網路笑話的等級或老梗

  當然這個或許就是見仁見智 昨天看很多觀眾笑的我沒笑 或許跟過去他的作品類似

  為了過年檔 為了普羅大眾 為了長輩 笑點比較Low 有時候有點尬

  (畢竟很多人笑不能只用自己標準評論)但即便能稍微理解...我還是覺得有提升空間


  3.有一個不錯的轉折~ 但或許看完後想來會讓人覺得這設定說服力不足


  4.私心不太喜歡有個很短的片段 突然出現一堆太陽能板+風車

  幹.......... 我個人覺得這一定是特別置入的片段


  但整體來說 確實比他過去的作品有值得推薦的地方


  1.年菜 客家語~ 就算是為了應景加料 我覺得這些本土的元素蠻不賴的


  2.整體的攝影 服裝 美術 燈光 音樂 配樂等技術層面其實都還蠻有水準


  3.這部最讓我驚豔的~其實是演員們的表現 他們讓劇本就算不盡理想

  還是很有看頭... 特別是親情戲的部分 無論是兄弟姊妹跟各種母子祖孫都有可看之處

  即便覺得有些情感線其實鋪陳不足 我確實有被很多幕演員的對手戲渲染到


  4.最意外的是隋棠 雖然她名模多年 我從來不認為她是我心目中的美女

  但這部她真的很多裝扮相當迷人漂亮 而且演技發揮可能也是她演過的電影中最好的一部

  (我很少看台劇只看電影) 如果整齣戲的品質再穩定點 甚至有機會入圍金馬吧


  5.另一個意外之處 是年輕演員組的三位陳昊森 盧以恩跟林政融

  這三個人在戲中算是同輩親辜 真的有演出交情不錯的感覺 蠻有火花

  尤其林政融戲裡演的是個呆子 映後才知道他是唱嘻哈的本人還蠻帥有型

  這等反差讓我驚喜~ 原本真的以為他是個諧星 博恩或卡米地出來的(真是對不起呀XD)


  6.其他戲精發揮的也都算稱職了~ 總之整部戲的演員們讓我覺得很有化學效應


  當然 對年輕一點的觀眾來說 可能還是收不到葉天倫喜劇片的電波

  不過如果是喜歡裡面演員 或是大過年的想帶長輩去娛樂笑一下 還是可以進場支持看看囉


  --'
