url: https://www.ptt.cc/bbs/movie/M.1683983147.A.FAC.html
title: '[討論] 衛視電影台21:00詐團圓'
content: '衛視電影台61台

  21:00炸團圓

  劇情簡介

  《雞排英雄》、《大稻埕》葉天倫最新執導作品，陳淑芳、隋棠、陳昊森、邰智源、謝瓊

  煖、林子熙、盧以恩等人主演，台灣版《瘋狂亞洲富豪》遇上《信用詐欺師》與《孤味》

  。


  一場因「詐騙」而起的團圓飯，兩個家族的成員帶著各自心中盤算，彼此爾虞我詐、鬥智

  算計，是一部充滿計中計而且笑中帶淚的賀歲電影。


  影片推出陳淑芳、隋棠、謝瓊煖三位實力派女演員高手過招，上演心機大鬥法，眼神跟肢

  體渾身是戲，笑裡藏刀讓人發毛，各自有算計；前導預告中故事從隋棠與陳昊森兩人令人

  眼花瞭亂的魔術技倆起頭，實際年齡只相差16歲的兩人在片中飾演一對靠著詐術維生的「

  高顏值母子」，兩人寄生在台灣上流大家族裡，在暗處中觀察所有人的一舉一動，跟夥伴

  華仔（邰智源飾演），準備大撈油水，而其真正的目的似乎不僅止於此。


  以家族「接班人」之姿出現的陳昊森，讓處心積慮想奪權的謝瓊煖不禁懷疑為何在母親（

  陳淑芳飾演）退休這一年，冒出一個自稱家族遺腹子的美國金孫，但她與媽媽似乎存有很

  多芥蒂，這時還殺出各方人馬，讓她無法掉以輕心，正準備一場翻天覆地的大陰謀；而身

  為一手掌握公司運作、家族成員、接班人選家族大家長的陳淑芳，她有能力分辨出每個人

  的背後意圖，拚盡全力守護整個家族嗎？象徵團圓的年夜飯，表面歡樂，背地裡暗潮洶湧

  ，豪門家族的茶壺風暴即將引爆；究竟誰真誰假，誰又能真正笑到最後，不看到最後絕對

  不知道誰才是贏家。


  --'
