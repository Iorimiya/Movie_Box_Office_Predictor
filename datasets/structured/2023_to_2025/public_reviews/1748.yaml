title: '[負無雷] 65一點都不恐怖行星'
content: '我認為可以把錢把時間省下來

  整部片就是只有背景設定好像有些有趣

  真的看下去會發現完全沒有新意爆點或是反轉

  只有無止盡的大地遊戲

  除了風景優美畫面佳沒有任何厲害的地方

  自然科學的部分更是叫人俗套到哭

  整體而言不需要特意來看如果上串流可以再考慮

  畢竟線上看電影可以隨時關掉



  --

  要說多也是滿多的

  但就像我點了肉燥飯而端上來的是滷肉飯沒有爌肉一樣

  叫人失望

  你講到重點了

  我一開始也是預期殺戮應該會很讚

  太空人大戰史前蜥蜴想想就興奮

  但它連殺戮都… 唉'
