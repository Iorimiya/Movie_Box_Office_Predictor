url: https://www.ptt.cc/bbs/movie/M.1680755415.A.DD6.html
title: '[好雷] 65：恐怖行星｜亞當崔佛有夠耐摔耐咬耐撞'
content: "◎ 類型：科幻/動作\n◎ 年份：2023\n◎ 片長：1小時33分\n◎ 分級：輔導級12+\n◎ 國別：美國\n◎ 發行：索尼影業\n◎ 簡介：因為一起意外而墜落在一顆未知的星球，看似美麗的世界卻有意想不到的威脅潛\n\
  伏著，米爾斯與另一位倖存者柯雅，必須穿越危機四伏的大地，尋找救援的一線生機。\n-\n◎ Ryan簡言之：《65：恐怖行星》是一部認真說故事、用心呈現畫面的科幻題材作品，在\n\
  劇情含量稍嫌單薄的狀態下，人物的塑造、角色的襯托則相對讓人印象深刻。\n\n-\n◎ 影評：\n首先要說的是本片無論在中文片名的命名或是預告片的剪輯上，真的滿滿B級片的節奏，讓\n\
  人全然以為這會是一部以賣爽度、灑狗血導向的電影類型，所以個人是抱著會看到一堆外星\n恐龍的牙齒還有一堆血肉模糊的肉塊之類的心情進電影院。(有人應該也是吧?)\n\
  -\n然而從電影開始就感受得到本片其實是部蠻認真想描繪一個科幻題材的世界觀、描述一段親\n情故事的作品，就電影的劇情線而言極為單純，一艘太空艦迫降在6500萬年前的地球，艦艇\n\
  的倖存者只剩主角和一位女孩，兩人需要在陌生的星球設法返家。\n-\n電影在情感的鋪陳相當用心著墨，先講述主角的身世、失去女兒的痛，再從跨越語言的隔閡\n、情感的投射到轉移，逐步去鋪陳琢磨兩位角色的互動關係，片中也不難發現一些其他作品\n\
  的影子，如《星際效應》呈現太空旅行中親人在遙遠的另一方的距離感，若有似無的用上了\n大招牌 《侏羅紀公園》恐龍出場相似的畫面、配樂。\n-\n不得不說本片的靈魂便是亞當崔佛飾演的主角米爾斯這號人物，雖然有人會認為整部片角色\n\
  也就那幾位不成為焦點也難，但個人覺得也因為出場人物少反而更是提升演譯上的難度，要\n能在篇幅佔比極大的設定下，貫穿整部片展現出有情感堆疊、有故事、有魅力的人物並不容\n\
  易，而亞當崔佛確實在本片達到了這般水平，可以是兇猛果斷、耐摔又能肉搏的恐龍殺手，\n也可以是柔軟而堅毅、能捨身去守護的父親。\n-\n本片的電影配樂也為本片加了不少分，找來了為《心靈捕手》\
  \ 《大智若魚》 《蜘蛛人》電\n影配樂的Danny Elfman，在恐龍張牙舞爪的場面、寂靜詭譎的環境、溫情滿滿的橋段都能帶\n出當下需要的音樂氣場，來個題外話亂扯一下，電影中有段感情戲會使用的配樂和《魔戒三\n\
  部曲》夏爾會出現的配樂挺相似，聽到當下腦袋會不小心浮出夏爾的風光、甘道夫的煙火，\n不確定有沒有人也這麼覺得就是。\n-\n總體來說《65：恐怖行星》是一部認真說故事、用心呈現畫面的科幻題材作品(感受到已經\n\
  很盡力運用索尼給的有限經費)，在劇情含量稍嫌單薄的狀態下，人物的塑造、角色的襯托\n則相對讓人印象深刻。\n-\n◎ 綠豆糕指數：7塊(滿分10塊)\n\n\n\
  Ryan的電影綠豆糕\n一位很需要電影、小說、遊戲作為生活養分的人，在這裡純粹想把看過的電影都紀錄下來，\n以自己能無壓力的寫、大家也能輕鬆讀的半張稿紙篇幅(有時會不小心超過)，聊聊對於電影\n\
  、影集作品的一些想法、感受。\n\nFB:\n-\nIG:\n\n--\nSent from my Google Pixel 6 Pro\n\nPiTT \n\n\
  --\n\n\n\n沒羽毛 要說是大蜥蜴也沒錯哈哈\n真的感覺元素都有，就是都不夠深比較可惜"
