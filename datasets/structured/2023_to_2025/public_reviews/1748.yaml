url: https://www.ptt.cc/bbs/movie/M.1680282216.A.D78.html
title: '[無聊雷] 65 不恐怖行星'
content: '這部片上串流或是第四台在看就可以了。


  因為免費票不能換地下城的IMAX，就挑這片來看


  劇情就是其他星球主角未來賺女兒醫藥費，擔任為其兩年的長程星艦駕駛，倒楣撞到隕石

  群，然後墜入地球。


  原本以為全部人死光，自己也想自殺，發現小蘿莉沒死救了她之後，因為語言不通，只能

  拐騙蘿莉一起去尋找逃生艙，途中暗示原本的女兒已經死亡。


  然後恐龍一直來攻擊，他們也發現有毀滅性的的隕石危機，小蘿莉除了偶爾搗蛋，也是有

  達到互相幫助，最後發現逃生艙同時小蘿莉也知道主角騙他父母還活著，解開誤會要逃離

  時被隕石碎片砸到，途中遇到的暴龍來報仇，主角危機時讓小蘿莉拯救了，即使發射逃生

  艙離開地球。




  以下是無聊點：


  星艦居然傻傻地去撞隕石群


  主角一號表情


  恐龍全部不怕火光槍擊，一直前後撲上


  原本以為片尾是要讓地球人後代發現，他們留下的壁畫 ，完全沒有。


  可能導演要顯現出原始大自然的可怕 完全沒有






  --'
