title: '[無雷] 恐怖行星65，意外不錯有誠意'
content: '海報上的主角很像貧窮版的基努李維，再加上尷尬的片名


  讓我一度以為是大爛片，沒想到意外不錯



  最大賣點恐龍（或怪物）的種類多，戲份也多


  而且特效做得不錯，看得出來有花錢去砸，不太會有假假的感覺，不輸侏儸紀世界那種


  片長短短的９３分鐘，全程還算刺激與放鬆


  中間偶爾會來點搞笑鬆弛大家緊張的神經，節奏掌握得不錯


  評分：7.2/10


  -----

  Sent from JPTT on my Google Pixel 6a.


  --'
