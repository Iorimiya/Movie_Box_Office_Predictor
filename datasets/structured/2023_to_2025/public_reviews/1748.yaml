title: '[  雷] 65 恐怖行星'
content: '防雷


































































  他的評價不太好早有聽說

  今天看完一直有烏鴉在頭頂盤旋不絕於耳

  先說優點吧,畫面真的蠻漂亮的

  原始景觀搭配4K HDR畫面堪稱養眼

  接下來就是一路吐槽到結束

  亞當崔佛跟小女孩的互動幾乎沒什麼火花

  片中設定又把他們互動的門檻弄的很高

  節奏也非常詭異,體感完全不像低於一個半小時的片

  跟恐龍打的場面也許還行,但超唬爛超沒說服力

  這部電影屬於串流隨意看看的類型

  真的很可惜他的視覺效果

  但連最基本的元素都沒能撐就是這樣下場

  這次只能幫亞當崔佛QQ了,但我期待他的法拉利

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  會拿美麗比喻成愛的人，都是不知愛情真相的人

  會把醜陋比喻成愛的人，都是熟知愛的驕傲者


  --'
