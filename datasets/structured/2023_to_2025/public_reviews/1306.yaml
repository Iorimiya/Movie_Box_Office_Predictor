url: https://www.ptt.cc/bbs/movie/M.1685613492.A.73F.html
title: '[情報] 香港話題強片【命案】，6月30日全台上映 '
content: '資料出處：采昌亞洲電影世界



  一切皆是命，半點不由人


  預告：



  ★ 榮登香港首週末新片票房冠軍，觀眾盛讚「年度必看港片」！

  ★ 香港電影品質保證「銀河映像」攝製，總票房飄破千萬港幣！

  ★ 杜琪峯 × 鄭保瑞 × 游乃海聯手，金牌班底最新驚悚懸疑力作！

  ★ 強勢入選柏林影展特別放映，年度唯一香港電影代表！

  ★ 青睞入選香港電影節、烏迪內遠東影展、新加坡華語電影節！

  ★ 獨樹一幟的敘事風格，毫無冷場刺激腎上腺素！

  ★ 命定論與自由意志的較量，一場喪心病狂與命運的大戰！

  ★ 結合神怪命理、玄學改運、精神疾病、驚悚懸疑多層次劇情！

  ★ 以劫解劫，以毒攻毒，終究人定勝天？還是逆天劫局？

  ★【樹大招風】金像獎影帝林家棟，呈現演藝生涯最高水準演出！

  ★ 超人氣男團「MIRROR」隊長楊樂文破格演出，力抗殺身大劫！




  一場暴雨夜裡，命案悄然發生，妓女慘遭連環殺人魔殘殺。一心想幫妓女化解「死刧」的

  命理大師（林家棟飾演）看著屍體悲痛萬分，不過一旁送錯外賣的茶餐廳少東（楊樂文飾

  演）卻踏著鮮血興奮莫名。二人機緣巧合相遇，大師算出少東將因為殺人而犯牢獄之災，

  少東也怕再陷囹圄，請求大師幫忙改命。另一方面，曾目睹少東殺貓的老警探（吳廷燁飾

  演）堅信少東是天生的心理變態，無法甩掉嗜血本性；大師卻認為既是天生，那錯的就不

  是少東，而是命運！大師使盡風水術數、中西玄學，不過總是人算不如天算，鎩羽而歸…

  。黔驢技窮之際，老警探步步進逼、殺人魔虎視眈眈、還有年輕妓女的致命誘惑，讓少東

  的殺念愈發熾烈，執刀就要踏上殺戮之路！而大師也頻頻面臨精神崩潰，讓眾人開始迎來

  命中注定的大刧…！



  #香港電影 #港片 #驚悚懸疑片 #銀河映像 #鄭保瑞 #杜琪峯 #游乃海 #林家棟 #金像獎

  影帝 #樹大招風 #智齒 #楊樂文 #MIRROR #Lokman

  #命理 #算命 #風水 #消災解厄 #改運


  --'
