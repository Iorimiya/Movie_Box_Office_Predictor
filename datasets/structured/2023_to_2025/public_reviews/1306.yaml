url: https://www.ptt.cc/bbs/movie/M.1701484190.A.B39.html
title: '[好雷]30日-近期約會電影首選'
content: "::以下全有雷::\n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n\n \n因為很喜歡女主角，\n\
  所以很期待的韓國電影《30日》。\n描述互看不順眼，\n已經訴請離婚的一對夫妻，\n礙於規則，提出離婚後需要30天才生效，\n而在這30天裡發生的故事。\n \n\
  心得：超級好笑！男女主角都演得很好\n這種喜劇電影最怕笑點get不到\n但我看的那場大家都有同時發出笑聲\n個人覺得比雞不可失還有趣\n \n雖然是失憶老梗，\n\
  但是在男女主角去實驗如何找回記憶的過程，\n又能發現他們之間還是很有火花\n \n真的是近期約會電影首選，推薦！\n \n想問有看過的你們覺得哪邊最好笑？\n\
  我覺得妹妹一開始甩態不想要跟姊姊姊夫住在一起\n結果媽媽要拿掉手錶她就下跪那邊超好笑\n--\n真的！但快下檔了\n我解讀是媽媽是狠角色 畢竟可以嫁給將軍的女人一定是有兩下子\
  \ XD\n我也超喜歡庭 她在裡面很辣\nG大一定要看～～\n真的好喜歡 還好沒錯過\n真的是發自內心的大笑\n我也覺得！\n我昨天也帶男友去二刷了\n重看才發現好多小細節\n\
  例如：聖誕夜 女主角媽媽居然是坐在主位\n原來男主角再次終於恢復記憶時\n眼神真的完全不一樣\n好笑的點還是又再笑了一次\n我第一次去的時候因為上映第一天所以蠻多人的\n\
