url: https://www.ptt.cc/bbs/movie/M.1702986761.A.A9B.html
title: '[好雷] 30日'
content: '一言以敝之，很歡樂的約會電影


  劇情描述一對因戀愛衝昏頭快速結婚的夫妻

  因受不了彼此生活習慣和價值觀決定離婚

  而在韓國有個叫“離婚熟慮制”的東西

  為了避免夫妻衝動離婚

  在跟法院諮詢後必須有30天的考慮時間

  這段時間結束後要再提離婚訴訟才OK



  而這對夫妻在熟慮期的第一天就發生車禍

  醒來後毫不意外的都失去記憶

  而毫不意外的這兩人在這30天內

  試圖重新認識彼此並設法重拾過往美好回憶


  看起來就是個韓劇經典狗血題材

  而笑點就落在演員編劇如何翻玩狗血老梗

  加上角色性格設定相當浮誇

  庭沼玟的女主是個瘋狂奔放的千金小姐

  生活技能幾乎為零，還會發酒瘋

  姜河那看似憨厚但經常露出低能的“殺人狂笑容”，還有用吹風機吹屁眼的奇怪習慣

  整片就看這兩位各種奇葩行事

  再混搭再逼真不過的情侶吵架日常

  很難沒有get到的笑點

  你以為這段已經夠低能時下一段就可以更低能


  基本上這部電影沒有什麼高深的鏡頭語言

  也沒有浮誇的場景

  但就是看完會非常輕鬆培養氣氛的電影

  加上主角男帥女美

  有另一半的想殺時間的不妨考慮考慮

  （看這場次似乎快下檔了）




  --'
