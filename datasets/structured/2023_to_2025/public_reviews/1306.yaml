title: '[新聞]比悲傷更悲傷的故事 11月30日一起好好愛過'
content: '新聞網址：



  由導演林孝謙所執導的電影《比悲傷更悲傷的故事》是重新拍攝韓國經典虐戀，導演編劇

  找來劉以豪、陳意涵、張書豪、陳庭妮、鬼鬼(吳映潔)、禾浩辰(布魯斯)、特別客串石知

  田、姚愛甯等演員，將這部電影詮釋出台灣自己的風格!



  如果已經有看過韓國經典版本的話，再來看看我們自己所拍攝的，會真實發現是截然的兩

  部電影，林孝謙導演與呂安弦編劇在拍攝前為了確認每個演員適合擔任的演出，還隨機提

  供兩頁劇本讓演員有時間準備，並且能夠與導演有近距離接觸的即興演出，因為導演希望

  從這樣的過程，能更認識每個演員的特質還有建立彼此間的溝通橋樑!一部好電影可以從

  導演與編劇，演出前的準備規格中真實感受出來。



  彼此相愛的前提下，不表達出來的愛也許很偉大，但能夠表達出來的愛有可能扭轉結局



  電影中的K與Cream兩個身世背景都很悲傷的人，相遇然後就像最親密的家人好朋友般一起

  生活著，這兩個角色由劉以豪與陳意涵來演出，反而使用他們溫暖顏值對比了電影劇本，

  悲傷仍然存在卻不至於冰冷到沒有溫度。電影的前半段開始看著K與Cream的互動是如此的

  甜蜜，應該說就像是一對熱戀般的情侶，甚至可以說是夫妻般的相依情感，但他們就僅止

  於同居同住一個屋簷下看似曖昧的關係，這樣的曖昧並不是為了要有更多選擇，K是用自

  己的方式守護唯一的選擇，而Cream也用自己的方式愛著K，電影裡想表達「我們都值得一

  次奮不顧身的愛，那麼這會是一份什麼樣的愛呢?」不拆開來說的愛情，有一點美但也有

  一些危險，因為有一些愛人的方式不一定是對方真正想要的!



  無論怎麼愛都不會有正確解答，重點是去愛的勇氣



  《比悲傷更悲傷的故事》電影最有話題性的地方大概就是，生了重病即將活不久的狀況下

  是要坦白告訴所愛的人，或者就此隱瞞並且為對方安排人生呢?沒有所謂的標準答案，也

  沒有人能知道所有決定之後的結果是不是會令自己後悔萬分，但在愛裡有些表達的確能改

  變某些事件的結果，一直在思考如果K沒有執意地要為所愛的Cream安排所謂的幸福人生，

  那麼他們是否能夠在有限的時間裡彼此坦白，一起度過剩下的時間，而讓Cream獲得真正

  的幸福人生，因為整部電影看來其實K與Cream要的幸福是相同的，他們都希望可以彼此相

  愛，但怎麼看都是他們願意忽略自己真正所要的幸福，成全對方所要的，只要能夠換另一

  種思維，即使K是帶著有限的日子與Cream好好相愛，那麼K所留下的愛也許能昇華成為

  Cream的勇氣。




  生命有期限的事實，最珍貴的地方在於彼此珍惜



  這部電影的確能觸動每個人內心中的掙扎，凡觀看電影的人幾乎都是大包餃子出戲院，日

  常生活裡的任何人事物，都在多了期限後，變得更能看見其價值，所以每個當下都是天長

  地久，那怕是柴米油鹽的日子，我們都要明白生命總有期限的事實，能夠遇見彼此相愛的

  人，就好好去愛，不要吝嗇表達，要夠有勇氣去面對，即使是主動表達歉意，全然的愛就

  是全然的珍惜。



  活著的時候要盡力好好活著，離開的時候留些你的什麼吧


  我們曾經存在這世界的痕跡，在離開的瞬間留下一場展覽的概念，似乎也是值得參考的觀

  點，電影《比悲傷更悲傷的故事》裡飾演攝影師的陳庭妮，主動與K交換了條件，要為K紀

  錄他離開世界前的時間，這不僅也讓人思考如果真的要離開世界離開心愛的人前，為那些

  愛你的人留下一場與自己有關的展覽，那麼大家的悲傷程度會不會稍微降低一點點呢?



  《比悲傷更悲傷的故事》比起韓國經典版本，更喜歡台灣拍攝的版本，因為不論在整體劇

  本或者是演員表現都更有質感，雖然是個悲傷故事，但光是看預告還有電影視覺都更有期

  待的氣氛，正如林孝謙導演所說的他要拍出可以有笑聲的悲傷電影，再加上天后A-LIN也

  親自在電影裡演出幽默的橋段，整部電影似乎有那麼些暖和了!






  --

  為自己的每一天而快樂 ^_^




  --'
