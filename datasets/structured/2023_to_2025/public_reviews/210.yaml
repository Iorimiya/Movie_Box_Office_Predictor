title: '[微好雷] 如果德川家康成為總理大臣'
content: '雷文防雷資訊頁


  小小抱怨一下上星期看F4的時候還有在南紡看到這部有上，結果這星期想找來看居然全臺

  南就沒影廳了，最近的還在岡山秀泰…這部不是才上一個星期嘛


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  放上今天在岡山秀泰的照片：




  P.S.整個影廳只有我跟另外一個人


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  電影一開始大致把COVID-19第一年全世界水深火熱的背景交代一下，可能因為是親身經歷

  過的歷史，所以看起來有種偽紀錄片的感覺，然後前內閣就領便當了；接下來就是偉人內

  閣的來歷：其實就是一串串程式碼全息投影出來的AI，某方面來說也可以規避掉一些批評

  歷史人物性格過於扁平的評論，畢竟本來就是現代人想像歷史人物會有的性格，而不是真

  實人物再次復生。


  第一個讓我覺得有趣的點是閣員們相互認識的橋段：作為官房長官的坂本龍馬，一方面是

  在場「最菜」的閣員，歷史人設又是倒幕派的重要人物，在初次面對5代將軍德川綱吉和8

  代將軍德川吉宗要說有多尷尬就有多尷尬，在旁邊負責介紹的黨幹事長御子柴學還直接把

  這個人設搬出來講，兩位將軍瞬間變臉，雖然因為程（ㄐㄩˋ）式（ㄑㄧㄥˊ）設定下，

  兩位將軍表示：「我們完全不會對坂本先生有什麼負面觀點喔」，但你們的表情跟第一反

  應不是這樣講的喔～


  這段也玩了不少歷史哏，比如紫式部跟聖德太子表示我們在鈔票上面喔，還有足利義滿表

  示椅子不是金子做的我做不舒服，或是兩位德川家將軍對於自己的綽號狗將軍、暴坊將軍

  表示非常不滿（德川吉宗：「我哪有！（雙目圓睜）」）；這段後面總理大臣德川家康出

  場時，除了一旁尷尬的龍馬，兩位將軍還是現場唯一向家康行禮的閣員，其他內閣都一副

  看後輩的學長姐臉色，甚至織田信長還背對XDD


  接下來龍馬的第一次記者會，豐臣秀吉突然自帶b

  BGM跳出來說他要普發現金（後來才發現其實這裡就在埋哏），本來就已經夠莫名其妙的

  記者跟民眾整個嘩然，果然馬上開始攻擊財源的問題；不過信長馬上讓大家知道為什麼他

  是「杜鵑不啼，則殺之」的第六天魔王，威脅商界人士那段的氣場真的很強；財務省這裡

  秀吉提拔積極新人的作法也很像他會幹的事，畢竟他是偉人內閣中，唯一背景比浪人龍馬

  還慘的，相對的用人也比較不問出身。


  很快普發現金就得到民眾超好評，記者和名嘴馬上見風轉舵全力支持偉人內閣，主導發錢

  的秀吉和信長也開始成為日本的政治偶像，甚至集資重建信長居城安土城的募資還瞬間10

  0%達標，內閣中信長和家康之間的對立也開始白熱化，除了龍馬和德川家的後輩以外，多

  數閣員皆持不介入立場，這時家康透過龍馬，向主角透露自己程式內寫入的一張圖片希望

  主角能解碼。


  在因為上司無意間的提示，而得出貘 = ばく（baku） = bug的諧音後，主角經由對撲克

  牌黑桃K = king的解讀，得出信長程式中出了bug的結論，並傳達給家康後，透過身處安

  土城的信長和官邸內的家康動作的交錯剪輯，劇情重現了本能寺之變：信長AI被刪除了。


  就在閣員、民眾和觀眾都覺得家康是兇手的情勢下，秀吉開始逼宮試圖讓家康辭職；另一

  邊主角則感覺自己的解讀有問題（這裡我其實用上面的解讀有在猜黑手會不會是御子，結

  果原來他真的是真人不是AI），在繼續深挖下發現黑桃K代表大衛王，也就是以色列王國

  三任國王中的第二位，並且將信長代入第一位王掃羅、家康代入第三位王所羅門的角色，

  因此真正出bug的是大衛王，也就是秀吉。


  （這邊感覺是在放明治時期日猶同祖論，即：日本人是以色列失蹤的十支派後裔的哏）


  在主角跟龍馬試圖聯繫上家康時，秀吉也帶著手下來官邸政變，在讓新人把家康關機前，

  秀吉也透露了自己才是刪除信長的幕後黑手，趕來的主角兩人剛好目睹了家康被關機的畫

  面，只能分頭逃離追捕；之後雖然龍馬通知了其他閣員，閣員們也都對秀吉表達強烈不滿

  ，卻只有德川家的綱吉和吉宗明顯想拿下秀吉，最後在目睹秀吉動用bug把狗將軍真的變

  成柴犬之後，眾閣員也只能屈服於秀吉的淫威之下。


  而回到辦公室的主角也發現秀吉的人已經來搜查，還是在很像痴漢的前輩幫助下才趕快逃

  離；重新會合的主角和龍馬商量後，決定侵入財務省試圖救出家康，不過他們的行動也很

  快被秀吉的人馬發現，兩組人在門口大打出手，不過龍馬也有援軍：即之前率領警察強力

  封城的新選組，然後一個角色馬上吐出官方吐槽：「這是世紀大和解啊」。可惜最後只有

  主角順利進入大樓，斷後的龍馬則被秀吉提拔的新人強制關機；而主角雖然有成功抵達監

  禁家康投影機的牢房，卻也馬上被新人追上，眼看新人手起刀落…


  如果電影決定把主角的故事線就收在這裡，畫面移到就職典禮，讓秀吉順利上位，接下來

  一半的畫面轉到一個暗室之中，秀吉自己真實的想法分享給新人，同時另一個畫面則是推

  翻天皇、推翻立憲政體、建立新的豐臣政權和向全世界宣戰的一系列作為深受群眾支持，

  而電影也就此結束，我覺得會是繼《希特勒回來了》又一部成功用喜劇包裝的政治驚悚片

  。


  可惜最後收尾還是走向超正能量的日式雞湯，不是說這樣收不好，就是有種其實可以更好

  的感覺。


  BTW家康站在官邸頂樓，凝視消失的江戶城天守閣，畫面一轉變成東京的大樓群那段我覺

  得呈現家康內心感慨蠻成功的，有種滄海桑田的感覺。


  --'
