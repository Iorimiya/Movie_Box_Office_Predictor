title: '[情報] 《如果德川家康成為總理大臣》上映戲院'
content: '日本票房賣破12億！



  ｘ赤楚衛二ｘ野村萬齋


  腦洞大開狂想鉅獻《》


  7月25日(五) 全台上映


  當「戰國三傑」群起復活組成最強內閣？

  史上最瘋狂的首相計畫即將展開！


  「杜鵑不啼，則殺之。」

  　　　　　

  「杜鵑不啼，則待之啼。」

  　　　　　

  「杜鵑不啼，則誘之啼。」


  改編自Amazon 4.2顆星話題小說原作，賣座12億日幣！


  《工作細胞》導演ｘ《飛翔吧！埼玉》編劇


  打造超狂喜劇！


  《》ｘ《》

  ｘ《飛翔吧！埼玉》GACKTｘ「百變狂言師」野村萬齋ｘ《豐臣秀吉》竹中直人精

  彩共演！



  2020年的新冠疫情，首相官邸發生群聚感染，總理大臣突然死亡。面對前所未有的危機，

  政府採取的最後手段是利用AI技術讓歷史上的偉人們復活，組成最強內閣。


  由創立江戶幕府的傳奇人物德川家康（野村萬齋 飾）擔任總理大臣，集結織田信長（GAC

  KT 飾）、豐臣秀吉（竹中直人 飾）等偉人的夢幻內閣終於誕生！


  其極具氣勢的魅力和執行能力讓全日本都為之瘋狂，夢想成為主播的電視臺新職員西村理

  沙（濱邊美波 飾），為了獲得獨家新聞而接近擔任政府發言人坂本龍馬（赤楚衛二 飾）

  ……


