content: "如果德川家康成為總理大臣\n特報影片公開\n\n\n\n徳川家康（#野村萬斎）\n坂本龍馬（#赤楚衛二）\n織田信長（#GACKT）\n豊臣秀吉（#竹中直人）\n\
  紫式部（#観月ありさ）\n聖徳太子（#長井短）\n北条政子（#江口のりこ）\n徳川吉宗（#髙嶋政宏)\n徳川綱吉（#池田鉄洋）\n足利義満（#小手伸也）\n\n\
  電視台的新人記者・西村理沙（#浜辺美波）\n\n本劇為小說改編，可參考:\n\n\n    面對疾病，沒有人能置身事外\n　　借鏡歷史，活用科技，用AI打造最強內閣\n\
  　　歷史人物跨越時空，攜手終結肺炎疫情，找回人民信任！\n\n　　「如果杜鵑不啼，我們要等待牠啼......才怪！」\n　　 現在就是這個國家非改變不可的時候了！\n\
  　　 現代社會X歷史英雄 究竟會擦出什麼樣的火花？\n\n　　 面對來勢洶洶的新冠疫情，束手無策的日本執政黨利用最先進的AI技術復活歷史人\n物，以超越時代的全明星陣容組成最強內閣，由天下布武的織田信長擔任經濟產業大臣；\n\
  從下級武士一路成為天下人的豐臣秀吉擔任財務大臣；終結江戶時代的坂本龍馬擔任官房\n長官；獲選為總理大臣的，則是創立德川幕府的德川家康！\n\n　　 這群曾經叱吒風雲的英雄們以迅雷不及掩耳的速度定好抗疫方針，一一實行大膽的\n\
  政策。\n\n--"
