title: '[問片] 一部抓炸彈客的電影'
content: '大概兩年前看的

  只記得有一幕是公車上被裝了炸彈

  女主角救了車上全部的人下車

  但炸彈客威脅她不能下去

  後來是男主角出現上車救女主角

  用假的監視器畫面騙炸彈客

  最後男主角用了個滑輪板車把自己和女主角送離巴士上，最後巴士自撞自爆


  男女主角最後擁吻 happy ending


  不知道是哪部，突然想起來很想看XD，女主角很正


  有人知道嗎 感謝各位





  -----

  Sent from JPTT on my Samsung SM-A730F.


  --

  沒錯！是這部！我剛剛一直搜捍衛戰士捍衛任務都不是XD原來是捍衛戰警

  太感謝你了！謝謝你

  這部片基努李維超青澀，和現在的長髮差超多我一直想不起來男主角是誰XD'
