url: https://www.ptt.cc/bbs/movie/M.1682473360.A.8B0.html
title: '[荒謬雷]《炸彈客》中二炸裂版台北物語，降臨！'
content: '沒想到我的第一篇心得會是這個...


  先說我不是工讀生，我只是在看完其他影評後忍不住進場一探究竟，發現這部電影從頭到

  尾都在催眠我「不能只有我看到」，於是決定順從一切，寫一篇心得來試著推坑大家，文

  筆欠佳還請各位見諒XD


  先放上經典到不行的預告:





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  打從2017年，國片《台北物語》以爛到毫無下限，卻反而形成一種荒謬到好笑的姿態席捲

  台灣電影界時，觀眾的心底就這麼多出了兩條疑問:「幹你娘這到底是三小?」以及「這種

  廢到笑的電影，以後還會出現嗎?」

  的確台灣爛片年年拍，在台北物語之前也不是沒有出現過這種各方水準低劣，結合在一起

  卻能成為一種惡趣味電影(例如《鐵支路》)，但是要像《台北物語》爛得這麼成功，終究

  還是需要一點天時地利人和。


  在《台北物語》之後，能夠在爛的方面與其匹敵的種子選手也不是沒有，例如由經典國片

  《一一》中，飾演小胖的張育邦主演的《嫐》(發音為ㄋㄠˇ)上映時就曾經被評論為「高

  級版的台北物語」，從製作拍攝到行銷上映時惹出一身腥的《卡卡囌卡卡衝》也時常被拿

  來和台北物語做比較，甚至連《重甲機神：神降臨》也有人說是動畫界的台北物語...雖

  然更接近這個地位的其實是《靠岸》，可惜這部走得太前面了。


  到了2023年，在歷經三部賀歲強片、對話與節奏毫無邏輯的《夢遊樂園》以及近期狂辦免

  費特映，劇情卻極度讓人不知所云的《溟溟》後，終於有一部國片能夠與《台北物語》互

  相匹敵，甚至能稍微威脅到台北物語的邪典霸主地位了，這部就是號稱驚悚懸疑燒腦黑色

  電影的《炸彈客》。



  快速幫大家介紹一下，男主角Tak塔克(由雙導演的其中一位親自下海飾演)原本是一名正

  義感爆棚的法扶律師，有一天在某個政界收賄案出庭後被一個神祕車手開車追撞，雖然最

  後倖存了下來，但是他負責辯護的證人卻當場死亡，無法走出陰影的Tak選擇離開律師界

  ，到處打零工維生。三年後的某天，Tak無意間發現當初撞他的車手竟然提早假釋出獄，

  還順利當上黑幫幫主，感到憤恨不平的他更在幫助同事時無意間得罪老闆而慘遭開除，失

  去所有的Tak決定化身為炸彈客，企圖報復這個不公不義的社會。



  雖然和白米炸彈客一點關係也沒有，但是從故事來看，其實不難感受到導演的企圖心，雙

  導演想藉由男主角之手，去對這個畸形的社會進行激烈的控訴，甚至還連帶批判了網紅亂

  象、職場爭議、以及邪教隱喻等等。但是偏偏與企圖心呈現強烈極端反比的，是這部電影

  低到不能再低的超差執行力。


  首先從攝影開始，官方在電影介紹中是這麼提及的「採用游擊式拍攝法，大量使用手持與

  歪斜鏡頭，讓整部電影調性與運鏡顯得更加生猛有力。」說穿了其實就是拍攝動作戲時讓

  鏡頭快速亂晃，在其他偏安靜的戲碼時就莫名讓鏡頭呈現至少30度起跳的傾斜，緊張的氣

  氛營造不起來就算了，還讓人不知道該先擔心攝影師是不是有嚴重的脊椎側彎?還是明天

  早上起來自己的脖子會落枕?不只是拍出來的畫質參差不齊，整體畫面的構圖連我這個攝

  影門外漢都能感覺到說不出的奇怪，無法確定導演想強調畫面中的哪一個部份，更誇張的

  是拍攝動作戲時，鏡頭髒掉了也不清理，放任污漬成為畫面的一部分，甚至還會和演員相

  撞...對，和演員相撞。這就可以帶到本片的第二個大問題——「剪輯」。


  就算整體節奏上還不至於瘋狂跳躍到難以釐清故事情節的地步，本片的剪輯也可以稱得上

  是無法無天。明明只是一個角色，講了短短的一句話，剪輯卻要硬生生地把這句話切成兩

  、三段來呈現(甚至更多)，而且大多數時候的第二段還只是原本畫面的局部放大，最後第

  三段再切回原本的畫面大小，超級沒必要，只會讓觀眾滿頭問號。


  片中出現了不少的動作場面，不管是多人打架，還是爆裂物炸開的驚險場面。除了前面說

  過的鏡頭亂晃以外，畫面也大量使用了抽格效果，一點一點卡卡的很不流暢，而雙導演在

  調度上更是毫無想法，破碎的快速剪輯充斥著略顯單薄的戲碼，收音品質嚴重不連貫，就

  連爆炸場面因為疑似錢不夠做特效，而改用沖天炮之類的隨便爆爆、再隨便剪剪，說是要

  效法諾蘭的拍攝方式(花惹發)，更別說某些炸彈的倒數畫面其實是用手機設定15秒的倒數

  計時，再請攝影師大致上拍下來後再剪進去...這讓我好無言。


  相較之下，選角與演技就不太會是我首先想提到的缺點了，但是這可不代表一點問題也沒

  有，一樣也是很大的。

  選角方面毫無說服力就算了，感覺就是雙導演到路上隨便抓幾個人就決定好的，演技方面

  更是全部都難能可貴的在標準之下下下下下，不僅毫無情緒可言，角色對戲起來更是毫無

  火花，比博人傳更讓人燃不起來。如果硬要選一個演技最好的話，我寧可選擇女主角(雖

  然她出場的篇幅大概連10%都不到)，至少在詮釋網紅時還有那麼一點點漂亮以及可愛，可

  惜一旦到情緒比較重的情節時就還是會讓人一秒出戲(念出男主角名字時發音還是錯的)，

  儘管她很用力地想表現出有演好的感覺。另外揍人的女警表現也不錯，奈何戲份實在太少

  了。

  前面有提到男主角Tak是由雙導演的其中一位親自出演的，他在電影裡就是非常、非常獨

  樹一格的存在(雖然設定上就是如此)，歲數都已經瀕臨不惑之年了，演起來卻像個中二病

  末期患者，狂妄、浮誇、自溺、毫無節制又有時莫名生硬的演技貫穿了全片，一場拿打火

  機烤手，露出癲狂笑容的戲更是一絕，就算是九把刀也絕對會甘拜下風，乖乖的把台灣最

  中二導演的頭銜讓出來，如果說這部電影「讓人猜不到下一步的發展」，十之八九都要歸

  功於男主角——就算說成這樣，他還不是所有人裡面演技最差的一位，至少他在劇情後段

  與當年開車追撞他的神祕車手對峙時，還是展現出了壓倒性的優勢，戲裡戲外都是。



  終於要講到劇情了。這部電影號稱是「驚悚懸疑燒腦黑色電影」，但是猜怎麼著?這些元

  素你在電影裡都看不到!

  驚悚?本片幾乎一點也不嚇人，我唯一一個有被嚇到的橋段，就只有女主角街訪時被亂入

  的路人突然揍下去而已(對，我對突發驚嚇的耐受度很低)。懸疑?劇情上的謎你可以在剛

  鋪下的時候就猜到正確答案，沒有什麼難度。燒腦?好吧，那些被炸彈襲擊的人，大腦可

  能都被燒掉了。黑色?是在說打光嗎?(大笑)

  雖然主題還算明確，雙導演也很努力的把角色營造成「充滿悲劇色彩的反英雄」，但比起

  好好說服觀眾，導演選擇的是用乍看之下很熱血，實際上中二到不行的旁白和台詞去塞滿

  所有可以詮釋的空間，導致成果就只有滿滿的尷尬，尤其是在男主用力沒有極限的演技加

  持之下，再偉大的理想到最後也只會淪落為觀眾之間的嘈點。

  同時本片的調性也讓人感到疑惑，本來以為是想要嚴肅敘事，其中卻很突兀的穿插了各式

  笑點，有些很明顯是刻意為之(例如預告片中的去spa)，但也有些感覺是演員不小心NG了

  ，最後卻基於不明原因而被放進正片裡，讓我除了大笑以外，更多的是在猶豫「這到底該

  不該笑?」

  到了最後三分之一，男主角發現他的所作所為並沒有讓這個社會往更好的方向前進時，他

  選擇採取更偏激的行動，而劇情也在這裡更加的大暴走，一下是主角在沙漠裡狂奔，一下

  是總統府發言人宣讀主角的陳情信，然後又變成主角站在舞台上瘋狂闡述著自己的理想…

  前面的情況就已經夠複雜了，此時的劇情又變得更加難以理解，最後的群魔亂舞簡直是本

  片之最，彷彿導演和演員們集體嗑藥後陷入了迷幻高潮，可惜全片沒有特效，所以你能看

  到的只有是演員們在鏡頭下瘋狂抽搐，荒謬滿點，宛如中邪大會，十分傻眼。



  其他還有像是後製色調古怪、角色關係混亂、道具太假、鏡頭穿幫、臨演數量貧乏、字卡

  太小又跑太快來不及看、攝影師亂入畫面…等等大小問題，整體來說這部片不管把電影的

  哪一個獨立抽出來檢視，全部都達不到及格的標準，甚至還會從39.4分開始往下扣。好在

  這部片只有短短的79分鐘，不會過度拖沓，在雙導演拚命把各類資訊往裡面硬塞的情況下

  ，至少觀影過程不至於太無聊，而且導演的交際手腕感覺特別好，竟然可以把台北市政府

  抓過來協助拍攝，甚至還可以在北市府前廣場、台北車站、信義商圈、甚至政府機關內部

  …等地方取景，以獨立製作的電影來說實在是有點扯。



  努力寫到這個地步，只差沒有把「慘」字貼上來了，那麼這部《炸彈客》真的可以擠下《

  台北物語》成為台灣邪典靠片的新霸主了嗎？其實也不一定，不然我前面為何還要加「稍

  微」呢。

  以小弟我參加過好幾次《台北物語》狂歡場的經驗，稍微可以歸納出《炸彈客》不太容易

  達到那種人人推崇的境界的理由。

  像Tony般打造出高人氣的角色？女主角或女警說不定有機會。「士農工商，各就其位」等

  級的台詞？也有，只是在這部對話幾乎沒跳針的情況下不好抓而已。對我來說，《炸彈客

  》可能只差臨門一腳的原因，就是「本片擁有過度鮮明的立場」。


  除了劇情原先就想探討的議題以外，電影一開始就讓銅鑼灣書店的老闆林榮基以客串之姿

  出場，甚至還把他在台灣被攻擊的親身經歷寫進了劇本裡，成為男主角邁向偏激之路的其

  中一個因素。除此之外，電影也在其他議題中明確的表示出它往哪一邊靠攏，更別說青天

  白日滿地紅的旗幟也大剌剌的出現在畫面裡，這造成了與相對較通俗輕鬆的《台北物語》

  來說，想找到能對上頻率的粉絲並沒有那麼容易。


  當然，最重要的還是觀眾們願意捧場。根據台北票房觀測站的數據顯示，《炸彈客》的首

  周末票房僅有22萬左右，只有同檔期《寶可噩夢》的三分之一再多一點點而已，顯見《炸

  彈客》的「戲院革命」尚未成功，同志仍須努力。而從製作團隊和發行商近期的臉書貼文

  或訪談來看，他們似乎也不排斥把這部電影當成邪典靠片來行銷...?

  那就只好成全他們了，每個人揪三五好友，進場大笑外加瘋狂吐槽，一旦「壞」口碑能夠

  向外擴散，那麼距離電影橫掃全台灣之日便不遠矣。

  更何況看完《炸彈客》後，再去看春節檔期的賀歲片們，每一步都像是奧斯卡金像獎最佳

  劇情長片的得主般無可挑剔，豈不善哉?




  是說寫到這裡才熊熊想起，電影有超過九成以上都在台北取景，也就是說《炸彈客》某種

  程度上也可以被稱作是名副其實的《台北物語》...哈哈哈


