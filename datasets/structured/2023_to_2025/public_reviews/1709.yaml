title: '[問片] 日本的一個反社會炸彈客'
content: '有點忘記是在哪裡看到的

  應該是距今六七年前的某個電影節


  影片幾乎無對白

  內容是一個青年住在冬日山上的某個小屋

  前半段大致都是拍攝他在那裏的生活

  還有埋首研究（其實就是做炸彈）的日常

  後半段有一個他和家人一起吃飯的劇情

  但最後他還是把包裹（炸彈）寄出去


  劇情大概就是這樣...


  (高概率是日本片，但因為台詞很少所以有點忘記)


  不知道問不問得到QAQ


  希望版上神人解惑


