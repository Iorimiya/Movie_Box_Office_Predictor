url: https://www.ptt.cc/bbs/movie/M.1627316965.A.6A5.html
title: '[新聞] 池昌旭當炸彈客《極速引爆》勒索金秘書'
content: '池昌旭當炸彈客　《極速引爆》勒索金秘書

  更新時間： 2021/07/26 00:00




  池昌旭在《極速引爆》飾演設置炸彈，打電話恐嚇趙宇鎮的神祕人物。車庫娛樂提供

  圖片來源 : 蘋果新聞網


  韓國男星趙宇鎮以《鬼怪》服侍孔劉的「金秘書」走紅，也曾在《陽光先生》擔任李秉憲

  的翻譯官，堪稱「最強綠葉」。


  出道22年的他首度當男主角，在動作電影《極速引爆》飾演銀行經理，男神池昌旭則變成

  綠葉，飾演炸彈客。


  該片節奏飛快，開場5分鐘，趙宇鎮開車載一雙兒女去上學，看見車上多出了一支手機，

  打來的未知來電竟是告知他車子座位下設有炸彈，歹徒還告知他有車輛定位，如果趙宇鎮

  和小孩企圖下車，炸彈就會引爆。




  趙宇鎮在《極速引爆》遭炸彈客威脅。車庫娛樂提供

  圖片來源 : 蘋果新聞網


  故事背景在釜山，片中有許多在市區狂奔的飛車鏡頭，讓人看起來驚險又刺激。


  趙宇鎮隨即目睹接到同樣電話的同事車輛在眼前爆炸，嚇得他更不敢下車。


  但他也因拒絕停車攔檢，遭懷疑是恐怖攻擊事件的嫌犯，在被警方追擊的過程中，還不能

  中斷與池昌旭的通話，過程緊張刺激。


  最讓人揪心的是，他的兒子在車上受傷，有失血過多致死危機，為了救兒子，不得不答應

  歹徒要求匯款大筆金錢，甚至被迫挪用公款，也要救兒子的命。


  男神池昌旭前半段都只有聲音，直到車子停在海邊後，才正式登場，看似壞人的他，其實

  背後有辛酸的故事，表面上是不擇手段要錢，實際上還有讓人傷心的隱情。


  池昌旭一出場時第一時間還讓人難以一眼認出，鬍渣配上黑眼圈，看得出他這角色的內心

  糾結；這角色亦正亦邪，池昌旭也自認是全新嘗試。


  趙宇鎮則提到車子是電影裡的第2個靈魂人物，但長時間待在密閉空間讓他很崩潰，他回

  憶：「我沒有幽閉恐懼症，但這次在沒開窗的車內長時間拍攝，曾暫時下車、喘息，再重

  回車上。」


  趙宇鎮為了升官曾做錯事情，要客戶投資卻血本無歸，影響到很多人的生計，就像很多詐

  欺犯一樣，「是你們自願掏錢出來的」，好在良心在經歷過炸彈事件後才找回來，若沒有

  出現池昌旭，他可能這一輩子都仍吃好穿好，「好人有時候比鬼更可怕」。


  《極速引爆》已在台上映。


  （陳穎／綜合報導）



  新聞網址：


