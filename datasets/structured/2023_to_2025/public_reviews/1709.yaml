title: '[新聞] 英雄還是炸彈客？「李察朱威爾事件」揭曉真相'
content: "新聞網址：\n\n2019-11-14 13:24 聯合報 記者陳建嘉／即時報導\n\n由克林伊斯威特執導，根據真實事件改編，「李察朱威爾事件」一片描述當不實的報導被\n\
  當作事實時，真相會如何被遮掩的故事。\n\n「奧林匹克百年公園有一枚炸彈，你們只有三十分鐘。」世人第一次知道李察朱威爾這號\n人物是在1996年的亞特蘭大爆炸案中，身為第一個發現炸彈並報警的保全，李察朱威爾及\n\
  時報警並協助疏散群眾，拯救無數人命的英勇行為使他成為一名英雄，但是幾天後，這個\n想要當一名執法人員的保全卻成為美國聯邦調查局的頭號嫌犯，受到媒體和大眾的詆毀與\n\
  唾棄，他的人生也瞬間分崩離析。深知自己是無辜的李察朱威爾向反體制的獨立律師華森\n布萊恩求助，希望他能夠證明自己的清白，然而華森布萊恩在奮力為李察朱威爾洗清罪名\n\
  的過程中卻發現，他一個人的力量是如此薄弱，因為這次除了必須對抗聯邦調查局、喬治\n亞州調查局及亞特蘭大市警署的強大勢力，與此同時，他也必須說服李察不能單純地信任\n\
  這些試圖毀了他人生的人們。\n\n「李察朱威爾事件」一片由奧斯卡金像獎得主山姆洛克威爾、凱西貝茲、喬漢姆以及奧莉\n菲亞維特主演，保羅華特豪澤飾演李察朱威爾。\
  \ 本人。\n\n由華納兄弟影業出品、馬爾帕索製作公司、Appian Way/Misher Films/75 Year Plan製作\n公司製作，「李察朱威爾事件」一片將由華納兄弟影業在全球發行，台灣預計上映日為\n\
  2020年2月21日。\n--\n        \n\n\n\n--"
