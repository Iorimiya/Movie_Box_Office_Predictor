url: https://www.ptt.cc/bbs/movie/M.1414328422.A.5B4.html
title: '[LIVE] 白米炸彈客 衛視電影台 21:00 全台首播'
content: '全台首播


  本片根據真實事件改編，由李烈和葉如芬監製，黃健瑋、謝欣穎、張少懷聯合主演 ，講

  述「白米炸彈客」楊儒門的故事。台灣以農立國，短視麻木的政府長期以來卻犧牲農業，

  勾結財團與地方勢力，追求短期經濟利益的發展。為了喚醒官員和人民的冷漠，來自彰化

  二林的農家子弟，秘密製作、放置17枚「炸彈」，地點遍布台北各地，引發各界震驚！媒

  體稱他「白米炸彈客」，他是楊儒門。

  楊儒門從小與阿公阿嬤在彰化務農，農田對他們來說是這一生僅有的財產，也是世代不變

  的信仰。然而，政府為了加入世界貿易組織，哄騙農民休耕，原本賴以為生的農田變成政

  客與財團交易的籌碼，綠油油的良田沃土變工業區。楊儒門看著艱苦一輩子的祖父母，到

  頭來一無所有。他投書各大媒體，希望藉由媒體的力量報導台灣農民的困境，卻屢屢石沉

  大海。他奔走拜訪各級政府，又處處碰壁，被官僚體系相互踢皮球、推卸責任。體制內的

  改變已然無望，楊儒門知道，唯有革命，才能為台灣的農業找到未來。




  開播啦!!!!!!!!!!!!!!!!!


  --'
