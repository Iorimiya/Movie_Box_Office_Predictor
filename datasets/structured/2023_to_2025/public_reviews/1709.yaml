title: '[問片] 發現隔壁鄰居是炸彈客的懸疑劇情片'
content: '十幾年前的片子了


  劇情大約是 主角中年男子 在CIA 或國土安全部之類的地方上班


  主角家隔壁搬來新鄰居 主角意外發現鄰居似乎在策畫要炸毀上班地點的大樓


  以下有雷
























  主角在跟壞人一番鬥智之後 才發現自己完全被設計得團團轉


  搞得身邊的人都以為他有問題


  最後還自以為成功破壞壞人計謀的把載滿炸彈的車開進大樓的地下室


  最後一幕就是遠方爆炸 然後壞人冷笑


  主角反而變成炸彈客 壞人完美結束任務的虐主電影


  當時記得覺得很好看 但發現周遭沒人知道這部片


  想請問各位高手 有人看過嗎 感謝


  --'
