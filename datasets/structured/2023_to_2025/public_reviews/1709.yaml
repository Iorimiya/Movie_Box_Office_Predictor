title: '[問片] 疑似炸彈客的電影'
content: '這大概是十年前看到的片子，印象很模糊了


  故事好像是在講抓炸彈客的故事

  炸彈客很變態，會把活人佈置成裝置藝術

  身上擺上花朵之類的，之後時間到引爆


  畫面深刻的是一個男生被做成裝置藝術

  緩慢旋轉著，並且倒數計時

  身上有一隻花，引爆機關是用鐵球觸發的

  不知道有沒有成功引爆


  不知道有人知道嗎 謝謝


  第一次發文 請多見諒



  -----

  Sent from JPTT on my iPhone


