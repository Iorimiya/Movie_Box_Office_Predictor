url: https://www.ptt.cc/bbs/movie/M.1760413725.A.BC4.html
title: '[普偏好雷] 徵人啟弒'
content: '代表韓國參賽奧斯卡最佳外語片，《下女的誘惑》、《分手的決心》導演新片，


  結果板上竟然一篇心得文都沒有，不知道是不是宣傳做太少(?


  不好看應該也會有負雷文(?




  我只看過下女的誘惑，太讓人驚艷，就帶著滿滿期待來看這部，結果......


  簡單心得是，這部片攝影、運鏡、演員表現都蠻好，最大敗筆就是劇本，


  劇本太爛救不起整部片。




  大致劇情就是主角被工作多年的造紙廠資遣，為了應徵上其他間造紙廠，把同樣被其他公司

  資遣、工作能力比他好的造紙人一一除掉，好讓自己能順利應徵。


  前面鋪陳很久主角被資遣、現實中的碰壁、心理上的壓力，可能想讓觀眾同理後續主角殺人

  的行為，但問題是......現實中多數人壓力再怎麼大，也不會想去殺人啊！？！？




  壓力大 -> 殺人，電影只鋪陳了「壓力大」，但幾乎沒有描述主角為何要殺害競爭對手，從

  求職失敗到著手殺人，中間的轉變快到我以為自己是不是漏看什麼台詞。


  合理性上也很不足，為什麼主角會覺得自己貼假徵才徵人，挑出比自己優秀的人殺掉，就等

  於自己會上？？


  可能有人沒來投他的假徵才，或是主角以為比他差的人，其實公司有可能更喜歡那個人呀。



  殺人的動機、心態轉變和合理性真的都有點不行........




  你可以描述主角求職碰壁是因為有幾個人表現一直都比他好，所以對那些人動殺機，或是以

  前大家都是造紙人朋友，只是一直被他們的光芒掩蓋，造成主角的自卑或陰影之類的，這樣

  就比較能同理主角為何會殺人。


  或甚至你要演主角殺人像理所當然一樣，那也可以鋪陳主角從小就不太在乎別人的生命，有

  一些心理缺陷之類的。


  但現在的鋪陳方式，會讓人對主角的行為完全同理不能，尤其第二個被殺的車勝元，演的完

  全就是愛女兒好爸爸，中年失業還願意到鞋店當銷售員賺錢，被殺掉還是因為主角假裝車子

  壞掉，車勝元好心下車幫忙才遭殃。反觀主角就是拉不下臉做其他工作的爛人。


  第三名死者雖然一開始羞辱他，後面也是打開心房把他當好友，結果主角用最殘忍的半活埋

  +漏斗灌食活活噎死對方，電影演得很歡樂，但其實很殘忍欸。


  殺人動機鋪陳不足，殺害善良老實人、虐殺招待他喝酒而且願意推薦他的人，這些都讓我看

  得很頭痛。




  其他角色是都還不錯，孫藝珍演的太太根本超級神隊友吧，一開始演得像是嬌生貴婦，但知

  道主角被資遣後，馬上把奢侈社交活動停掉、開始管理帳務、拍賣二手商品，為家庭規劃未

  來......講到這邊又要反觀主角了。


  車勝元、廉惠蘭戲份不多，但也都演得蠻好的，廉惠蘭越看越討喜，是位有趣的演員～


  整體來說，是有被娛樂到，只是劇情太讓人問號，還是有點困惑怎麼能參賽最佳外語片....



  --'
