url: https://www.ptt.cc/bbs/movie/M.1760684400.A.1D5.html
title: '[好雷] 徵人啟弒No Other Choice'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  身為朴贊郁的粉絲終究還是必須進場一看。雖然前幾週在電影院看到預告的時候心裡暗覺

  不妙，那個畫面有一種奇怪的感覺，好像是有什麼地方是動畫或者該說角色都像是貼上去

  的樣子，總之將期待降至極低。

  上週上映之後，看到評價兩極，忽然像是吃了定心丸一樣，決定入場，並且沒有任何得失

  心。因為想起上回《分手的決心》在台灣的討論也是十分兩極（甚至印象中看得人不多，

  但負評頗多？），最終卻可以說那幾年在大銀幕的最佳體驗。


  看完，心情複雜。畫面怪怪的感覺如同預告一樣強烈，角色就這樣在一個假假的畫面上演

  出美好家庭，然後破滅。接下來荒謬的故事上演，感受卻越來越真實。朴贊郁果然還是那

  個朴贊郁，節奏的安排、故事的轉折、各種人事物的隱喻、真正的對白與真正的戲都厲害

  ，演員演出令人佩服，那音樂也過來爭鋒。一切引人發笑的同時叫人悲從中來。


  回程路上想，這故事本身是老套，能把它改頭換面接到現在這個時間點，真是朴導的鬼斧

  神工。評價兩極，不意外，我自己都很難說喜歡。然而，對於「處境」的設置，還是滿有

  感（特別是那幾段故事中人對「紙業」的告白與片尾字幕用紙）。




  ***


  這裡是我的樂園:




  --'
