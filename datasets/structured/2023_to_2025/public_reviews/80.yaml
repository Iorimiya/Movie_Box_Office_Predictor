url: https://www.ptt.cc/bbs/movie/M.1760442264.A.EB8.html
title: '[普偏好雷] 徵人啟弒：看朴贊郁炫技太過癮'
content: "今年 8 月，韓國導演朴贊郁遭到美國編劇工會除名。\n.\n他被質疑在 2023 年好萊塢大罷工期間撰寫 HBO 影集《同情者》劇本而違規。儘管朴贊\n\
  郁嚴正否認，最終仍遭工會除名，未來若在美國拍片勢必受限。諷刺的是，他的新作《徵\n人啟弒》正是一部關於勞動、尊嚴與體制的黑色寓言。\n.\n片中李秉憲飾演的資深造紙廠主管萬洙，因公司被美商收購而一夕失業，一句：「你們美\n\
  國的工會，不尊重我們工人組工會的傳統。」意外成為導演現實境遇的互文。\n.\n坦白說，《徵人啟弒》不是我最喜歡的朴贊郁。部分段落節奏鬆散、有些符號大於意義，\n\
  但骨子裡的老派卻莫名吸引我：一個相信「一輩子只要做好一件事」的男人被時代無情碾\n壓，執著於尊嚴與自救的他不得不以極端方式反抗。這件事意外地觸動我，甚至也讓片中\n\
  許多充滿黑色喜劇氣味的惡趣味，反而多了一層「明知不可為而為之」的浪漫與無奈。\n\n/\n\n電影開場幸福得像房屋廣告：萬洙住在寬敞的房子裡，和妻子美莉（孫藝真\
  \ 飾）及一雙\n兒女在後院烤肉，兩隻拉布拉多在一旁奔跑。看似人生勝利組的他，翻烤老闆送的高級鰻\n魚，卻沒想到這竟是裁員的慰問品 — 在造紙廠服務 25 年的他，因為美國公司接管而被\n\
  解僱，家中經濟頓失支柱。為了重返職場，萬洙異想天開地刊登虛構徵才廣告，根據求職\n者資料，逐一剷除造紙市場潛在的競爭者。\n.\n《徵人啟弒》英文片名《No Other\
  \ Choice》貫穿全片。當萬洙質問美國老闆裁員理由時\n，對方無奈地說：「我們別無選擇。」當有人勸萬洙離開造紙業，他也固執回答：「我別\n無選擇。」這句話成為全片的咒語，從資方到勞方都用它自我辯解。當萬洙不擇手段的自\n\
  救變成殺戮，個體的生存焦慮也投影出整個時代的無力。\n.\n乍看劇情，《徵人啟弒》似乎是類似《寄生上流》那般「有錢也會很善良」的階級寓言，\n但兩者本質不同。奉俊昊刻畫的是底層家庭的向上渴望，朴贊郁則聚焦中產階級拒絕墜落\n\
  的掙扎。\n.\n「個體如何被制度吞噬」一向是他擅長的題材：從《共同警戒區 JSA》的歷史創傷、《蝙\n蝠：血色情慾》的宗教枷鎖，到《下女的誘惑》的父權體制，他充滿個性的暴力美學皆是\n\
  反抗體制的出口。\n.\n在《徵人啟弒》中，體制轉化成資本主義的殘酷與東亞男性的社會壓力。萬株參加失業男\n子互助會的橋段既諷刺又悲哀，男人們彼此打氣、在妻子面前逞強、掩飾失去謀生能力後\n\
  被閹割的男子氣概。另條支線也耐人尋味：美莉為了養家重返職場，成為帥哥牙醫尹歐瑜\n（柳演錫 飾）的助理，讓萬洙醋意橫生。想到妻子幫助情敵用工具探進自己嘴裡，他寧\n\
  可忍受心因性牙痛也拒絕就診 – 那份羞赧與扭曲的尊嚴，正是角色崩壞的縮影。\n\n/\n\n本片絕對是李秉憲的個人秀。他把「努力守住現狀」的一家之主演得滑稽又心碎。即使焦\n\
  慮潰堤，也要在孩子面前保持穩定；面對學歷更高的妻子，必須壓抑自卑、武裝成一頭猛\n獸。當他得知房子即將被收回，觀眾才得知這裡是他童年老家，藏著父親身為豬農父親的\n\
  辛酸。當他將某位受害者綁得像頭待宰的豬時，那不只是暴力，而是創傷的重現。李秉憲\n在理智與崩潰間切換自如，讓人難以移開目光。\n.\n萬洙的殺人計畫一場比一場更失控：滑落山坡被蛇咬、泥濘滾成落湯雞、或被妻子突然的\n\
  \ FaceTime 打亂節奏。雖然這些元素削弱懸疑張力，卻凸顯角色不是冷血殺手，而是悲劇\n人物。一場他剛殺完人、趕赴舞會眼睜睜看著妻子與牙醫曖昧，仍強裝鎮定獨舞，甚至讓\n\
  人想到邁茲米克森。\n.\n李秉憲在理智與崩潰間收放自如，讓角色即使雙手沾滿鮮血，仍能保有某種天真，這也是\n朴贊郁的故事總是迷人的原因。\n.\n孫藝真同樣交出從影以來最突破的演出。她拋開玉女形象，將母親的傻氣、精明與強悍揉\n\
  合成一體。李星民與廉惠蘭兩位戲精飾演的夫妻，則以舞台劇式的誇張節奏詮釋中年失業\n的荒謬與哀愁。兩人與李秉憲的大混戰台詞刀光劍影、鏡頭在趙容弼〈Redpepper\
  \ Dragon\nfly〉旋律中瘋狂翻轉，把「別無選擇」的窒息拍得令人拍案叫絕。\n.\n隨著劇情愈來越超展開，朴贊郁的調度卻愈發精準。與攝影師金佑炯（曾合作《女鼓手》\n\
  ）再度攜手，每個鏡頭都像他等待多年的畫布：街角兩面凸面鏡反射的追逐、夜裡赭紅路\n面與墨綠海浪的對比，以及戒酒多年的萬洙開喝，鏡頭對準酒杯底部，看著最後一滴黃湯\n\
  傾倒下肚 — 有人批評朴贊郁的鏡頭炫技，但少有人炫得像他一樣高級又華麗，這是大師\n級的調度，看得讓人身心舒暢。\n\n/\n\n看完《徵人啟弒》，我依然對朴贊郁的才華佩服得五體投地，但心底難掩一絲不適，來自\n\
  我以為不該再出現於銀幕上的臉孔：被多人指控性暴力的吳達秀在片中飾演一個小角色，\n即使他有承認部分行為並道歉，也明白朴贊郁想找回《原罪犯》老朋友客串的巧思，這樣\n\
  的選角仍令人難以忽視。\n.\n希望有一天，（不管哪一國的）影視圈都能不再以「別無選擇」為藉口。當這些加害者不\n再以為藝術可以免責、才華足以赦免一切，真正離開觀眾的視線，受害者的故事才能不再\n\
  發生、也不再被遺忘。\n\n更多影評推薦，歡迎按讚追蹤：\nimg_index=1\n\n--"
