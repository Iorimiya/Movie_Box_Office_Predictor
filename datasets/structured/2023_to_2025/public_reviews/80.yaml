url: https://www.ptt.cc/bbs/movie/M.1760943280.A.6D7.html
title: '[好雷] 徵人啟弒No Other Choice'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  更喜歡《分手的決心》，但這次看完《徵人啟弒》想了滿久也滿多的。



  1.視覺上的拼貼感、不恊調性，似乎是導演特別在後製的時候調整出來的。也就是說，觀

  影時那種不舒服但又漸漸融入故事之中的體驗，似乎正是導演想要引導的結果。一開始那

  成為「藍領中產階級」的生活：足夠的空間、兩個孩子與兩隻大狗狗、向上流動的希望、

  白手起家成為職人的自信感，美得像夢，所以拍得像夢。失業後的幾場團體治癒激厲特會

  和面試時被光刺爆雙眼的場景，看起來荒謬，卻給人一種特別真實的感覺。


  2. 不知道是不是因為自己對韓國所謂「職人職場」的不熟悉，雖然喜歡主角與幾位同為

  天涯淪落人的競爭者對話的內容，卻一直感覺這樣子的思維與模式，更接近我近期關注的

  美國，特別是那些曾經相信美國夢，特別是過去的工業重鎮，在全球化浪潮下被併購而失

  業的地區（參照電影《游牧人生》、紀錄片《美國工廠》、書籍《絕望者之歌》、《不穩

  定性無產階級》）。透過這部片，我反而好奇起日本、韓國與台灣在A I與全面自動化的

  浪潮中，傳統產業和精緻工藝的走向。


  3. 辯證與隱諭一直是朴贊郁電影最令我無法在第一時間分辨自己好惡的原因。通常需要

  時間去想，甚至和人討論。其中一個我從昨天一直想到今天的是，藍領中產階級希望給下

  一代有更好的環境，讓下一代可以能到更好的未來，他們對「所謂未來」認知有限，卻盡

  可能努力做到。但他們忙碌並沉溺於自己「為了家庭」的幻想中，小孩已經在成長，長成

  超乎他們想像的好或壞的樣子。


  4. 故事以男性心理為軸線，不同角色的互文非常迷人，但真的令人難忘的是那些「適應

  」環境與時代的女性，像是媽媽和女兒，甚至是那位出軌的老婆。越想越喜歡她們面對漩

  渦一樣的世界，給出的答案：去做你愛的事，現在還不晚，現代人都可以活到100歲。


  5. 最後，有點難以啟齒的事是電影用手點頭部的舒壓方式，其實長久以來都是我受用的

  方法。在故事中看到，真的不能不用嚇爛形容。好好用的話，真心有用（？？）



  ***


  這裡是我的樂園:





  --'
