title: '[情報] 朴贊郁《徵人啟弒》10/9 全台上映'
content: '《徵人啟弒》(No Other Choice)




  官方正式預告｜10月9日(週四) 全台戲院上映



  擁有25年造紙經驗的資深技師萬洙（李炳憲飾），一直以來對自己的人生感到十分滿意，

  甚至能發自內心地說：「我已經擁有一切了。」他與妻子美莉（孫藝珍飾）、兩個孩子和

  兩隻狗過著平凡幸福的日子。然而某天，公司卻突然通知他被解雇。


  「很抱歉，我們別無選擇。」


  如同被斧頭砍中腦袋般震驚的萬洙，為了心愛的家人，他發誓一定要在三個月內重新找到

  工作。儘管他下定決心要扭轉局面，但現實卻事與願違，他在一年多的時間裡，不斷參加

  面試卻屢屢碰壁，只能暫時在零售店打工度日。最終，他陷入了辛苦買下的房子可能被迫

  出售的危機。走投無路的他，貿然地拜訪了月造紙公司，試圖遞交履歷，卻遭到了部門主

  管崔善哲（朴熹洵飾）當面羞辱。萬洙深信沒有人比他更適合這份工作。


  他於是下定了一個決定：「如果沒有職缺，我就創造一個給自己！」



  －－


  朴贊郁新片《徵人啟弒》已確定代表韓國角逐2026奧斯卡最佳國際影片，北美NEON代理。


  日前於威尼斯影展主競賽單元舉行世界首映，映後獲得普遍好評、爛番茄新鮮度100%。


  本片卡司包含李炳憲、孫藝珍、朴熹洵、李星民、廉惠蘭、車勝元、柳演錫等。


  韓國定於9月24日上映，台灣則安排於國慶連假檔期10月9日上映。


  --'
