url: https://www.ptt.cc/bbs/movie/M.1760890388.A.077.html
title: '[好雷] 《徵人啟弒》 '
content: '上映中


  還沒下檔






  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  徵人啟弒》（韓文片名：別無選擇） 改編The Ax，1997年小說同時參考以拍攝政治電

  影出名的希臘導演Costa-Gavras 的The Axe 《職場殺手》(2005) 同名電影。



  有了同樣文本與劇情的資訊補充，可以讓《徵人啟弒》更聚焦在如何表現（的形式），呈

  現南韓民族2000年來經濟起飛的道德人性。雖說20多年前亞洲金融風暴的題材與背景，對

  於資本主義職場人力的物化描述（或馬克思的異化），與其因為企業縮編用完就丟的嘲諷

  感，看似有些過時的懷舊，同時本片對於AI自動化影響，與數位頻幕之於紙張（主角從事

  被裁員的相對數位科技的黃昏產業），只能以形式作為作者對於新產業與科技沒有太多想

  法的表現。（例如戲中用了不少平板與手機的畫面的影像，卻看不出朴贊郁對於當今科技

  世界有啥態度與想法）



  對照朴贊郁在《分手的決心》的形式實驗（註）。觀影途中讓人感到不耐的是，並非是炫

  技影像或音效與音樂複雜交錯切換的實驗，而是更恣意的戲劇表演與氣氛岔出和刻意的轉

  折，例如殺人戲碼脫手套的多餘與環境音響聲音過吵的溝通方式橋段展開成為荒謬喜劇的

  演出方式。不過當下也就認同導演是藝術家的任性，有他的直覺判斷，只是部分花俏炫技

  有過於空洞的危險。



  自己倒是在《徵人啟弒》幾番折騰的暗殺，在處理或掩埋屍體的場景，喚起過往觀賞南韓

  影視經驗，電影中殺人場面所蘊含的南韓國族寓言。無非是片名：「別無選擇」所揭示的

  ，韓國社會男性高壓競爭氛圍，你死我活的走投無路，同時又是不能說的秘密，在家庭、

  職場、乃至於社會上，男性罪責的哀愁。在此也喚起了《非常母親》的母親殺掉流浪漢道

  德秘密交會著此感。



  於是《徵人啟弒》看似以殺人，而且還是華麗的鏡頭音畫語言的殺人方式，作為一種電影

  的幻見，本質上則是南韓民族的道德罪責的告解。而在想的是，朴贊郁刻意以不斷的繁複

  並帶有龜毛創造故事之外的「新感受」，是不是一種南韓的民族性？而是如此創造性就是

  南韓的民族影像：對於經濟起飛後，富人激增在文化的汲取，如片尾大提琴演奏，同時古

  典音樂延續到劇情結束，描寫機械伐木的AI輓歌，失業的喪鐘，或可能也是人類（藝術）

  的「生之奏」。





  （註）

  又如同，不只一次聽導演講過，不在意電影的藝術性，只想讓更多人感受故事本身。卻很

  奇怪的看到朴贊郁嘗試在這個已經不太新奇的故事類型中，盡可能展示不被框限的影音敘

  事，於是在攝影、剪接、特效與聲音（對白、音效、音樂）的互文中，嘗試以靈活，甚至

  炫目影音（A/V）感，內化成一種新的感受性，而非徒具空泛的「效果」。


  --


  拉特飯 - 以商業力量進入獨立市場


  --'
