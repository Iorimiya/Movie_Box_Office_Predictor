title: '[請益] 有人知道親愛的大衛在演什麼嗎（雷）'
content: '板上幾乎無人討論這部電影


  可見這部票房有多慘 看完真的不懂導演想表達什麼


  據說是真實事件改編的。 那意思是劇中影射的本人


  應該還存活在這世界上吧！


  所以大衛到底是不是瘋子 還是其實他媽媽才是瘋子


  如果他媽媽才是瘋子 為何大衛要害死這麼多人


  還要害死那個救活他的醫生？


  看完之後我個人認為 大衛才是那個王八小孩


  親手殺了自己父親 死了不甘願還要害那麼多人


  他媽媽才是無辜的。結果被當成神經病


  最後一幕 感覺Adams是不是被大衛附身？


  因為最後他的眼神怪怪的？


  還有片中最重要的關鍵 為何不能問超過兩個問題


  導演也完全沒解釋？看完整個霧煞煞


  --'
