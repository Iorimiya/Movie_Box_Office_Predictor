url: https://www.ptt.cc/bbs/movie/M.1687702944.A.292.html
title: '[新聞]《幸運狗狗來造訪》當可愛拉不拉多狗勾走進'
content: '《幸運狗狗來造訪》當可愛拉不拉多狗勾走進你的邊緣人生……暖心印度電影台灣上映！


  2023-06-25 電影神搜




  全球票房高達 1300 萬美元的印度電影《幸運狗狗來造訪》即將在 7 月 21 日在台上映

  。本片為印度導演基蘭拉吉首部劇情長片作品，描述一名孤獨的藍領男子達馬，和一隻從

  非法養殖場逃出來的拉不拉多犬查理，一人一狗從排斥抗拒到不能沒有彼此的歷程。不僅

  在全球創下票房佳績，甚至成為影史上卡納達語電影票房第五名。




  以人狗關係為題，《幸運狗狗來造訪》成功走出國際


  導演基蘭拉吉表示，片中許多橋段，靈感都是自己的真實生活經驗：


  「印度每年都有非常多電影出品，但是真正能走出去，並且被跨語系、跨文化的觀眾接納

  的卻有限，因此我決定以人狗之間的關係為題材，因為這個題材在印度片中比較少有！」


  為了成功拍攝本片，開拍前特地找了馴狗師為在片中飾演查理的四隻拉不拉多犬，進行為

  期三周的特訓，讓狗演員們與主角之間的羈絆更加真實、令人信服。


  整部片前後歷時五年拍攝，途中歷經換角、疫情停拍等困境，好不容易完成並公開。飾演

  主角達馬的男星拉希特榭地表示，自己小時候曾養過兩隻狗，但成年後因為工作和讀書外

  宿而沒有再養狗，這次因為拍攝這部電影，而重新找回對狗的愛和連結，感覺相當幸福！




  影癡導演致敬默片巨星，克服困難征服動物演員


  然而，基蘭也坦言，和狗一起拍片並不是件容易的事情，雖然觀眾看到的畫面相當溫馨可

  愛，但拍攝過程卻困難重重，難度可說是拍一般電影的十倍！電影從幼犬拍到成犬，總共

  找了四隻拉不拉多犬參與拍攝，因為必須呈現出牠們從頑皮到有條有理接受指令的過程，

  拍攝採順拍方式進行。同時，為了能掌握狗演員的狀態，劇組也必須研究各項訓練所需花

  費的時間，才能進行拍攝作業安排，整個拍攝過程也可說是陪伴著狗演員一起成長。


  拍攝期間更必須面臨各項無法掌握的狀況，例如一場狗狗在火車駛過後穿越鐵路的戲，若

  沒拍成功，就必須再等上好幾個小時。因此，團隊每個人無時無刻都在等待、並且抓緊每

  一個拍到好鏡頭的時機。此外，由於基蘭本身是名重度影癡，片中主角狗狗的名字查理便

  是致敬默片巨星查理卓別林，主角家中觀賞的電視內容、牆壁上的照片，也隨處可見這位

  一代巨星的身影，形成有趣的呼應。基蘭表示：


  「我一直深受默片吸引， 因為『沈默』本身就是一種特別的語言，舉世通用。」




  《幸運狗狗來造訪》劇情介紹


  達馬沒有家人、沒有朋友，多年來過著自我封閉的日子，不僅工作上被同事討厭，好勇鬥

  狠的他更被鄰居孩子們稱作「希特勒叔叔」，避之唯恐不及。人生僅有獨居的小窩、卓別

  林的默片、工廠、打架、米漿糕、菸、啤酒的他，總認為自己是世界上最不幸的人，直到

  某天，幸運狗狗降臨在他的生命中。


  面對家裡不請自來的訪客，一隻拉不拉多幼犬，除了吃飯、睡覺，最大的興趣就是進行各

  種「拆家」工程，達馬從最初的厭惡、無奈到接受，他發現孤獨的生命中多了個夥伴，似

  乎也不壞。在正式接納了這名新家人後，達馬賦予了「她」一個新的名字「查理」，並幫

  她辦理身分證，編號「777」。然而，快樂的日子沒有持續多久，年僅一歲半的查理因狗

  舍業者不當近親繁殖，導致先天基因缺陷而併發了身體上的許多病痛…達馬決心替「她」

  實現願望，一人一狗帶著簡單的行囊，騎著專為查理打造的改裝重機出發，踏上一段漫長

  旅程。




  資料來源：天馬行空


  電影神搜



