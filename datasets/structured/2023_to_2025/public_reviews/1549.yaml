title: '[好雷] 幸運狗狗來造訪 Charlie 777'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  星期日晚上家母問要不要去看奧本

  我在搜尋時刻表時

  意外發現附近的in89有這部只有昨晚上映一場的印度電影

  其他天都沒有


  我看原本是7/21上映

  到現在滿兩週了，小片或賣不好確實都會被減場次

  全台灣現在一天也只剩2、3場


  但讓我比較意外的是電影板關於這部的只有一篇新聞

  沒有討論文



  我個人覺得很好看

  內容敘述的是一位年幼失去家人的男主角

  每天生活枯燥不與人親近

  因為這隻流浪狗個性產生巨大變化

  還跟狗約定要去喜馬拉雅附近看雪而展開長途的公路之旅


  片長2小時44分鐘卻不會冗長無聊

  每一段都有好看之處


  個人覺得的小缺點是女主角的定位

  電影中營造出男女主角因為狗意外相識

  還一起旅行了一段

  又再狗大賽意外相遇

  以為會擦出火花卻不了了之


  女主角長得不錯看



  男主角我雖然不認識但看起來也是大咖




  還有最後查理走時

  達馬哭喊著"我看了很多醫生、求神問卜，卻還是救不了妳"

  這對家裡有寵物家人過世過的人來說太寫實了XD


  我自己是有忍住淚水

  但我爸媽跟我隔一個座位

  我就不確定他們有沒有看到哭了

  我們家兩個月前才走了第一隻狗家人



  另外如果對於印度片會突然全體歌舞有期待的人

  這部片完全沒有

  但至少有搭配劇情穿插很多歌曲



  現在推薦就算想看可能也不容易找到有上映的電影院了

  想看的人等看看串流吧~

  因為這部台灣慢印度一年上映

  會上串流的話可能一下檔就會上了


  預告片可以先看看




  票根



  --'
