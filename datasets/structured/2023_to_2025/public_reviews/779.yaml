content: "《在大雪封閉的山莊裡》正式預告\n\n\n\n☆ 密閉山莊殺人事件，兇手究竟是誰?!\n☆ 東野圭吾原著小說改編，作者親自懇求看過的人千萬不要暴雷\n\
  ☆ WEST.重岡大毅、《東京復仇者》 間宮祥太朗 、《百花》 岡山天音、\n  《法庭遊戲》 戸塚純貴\n☆《電影版狂賭之淵》森川葵、《輪到你了劇場版》 西野七瀬、\n\
  \  《電影版TOKYO MER：行動急診室》 中條彩未、《教場0》 堀田真由\n☆ 日本上映首周擠下《在那開滿花的山丘，我想見到妳》、《哥吉拉-1.0》、\n\
  \  《去唱卡拉OK吧！》等強敵勇奪日片冠軍!!!\n\n七位演員應邀參加新劇的最終試鏡，試鏡地點設在一處被大雪封閉的山莊，並安排在\n為期四天的合宿期間進行。劇本是這行人被困在這個山莊，並陷入了一宗連環殺人案\n\
  中。在這個封閉的空間中，演員們卻一一消失。這究竟是虛構的故事，還是現實？一\n個驚心動魄的結局即將揭曉。\n\n導演｜飯塚健\n主演｜WEST.重岡大毅《那不是抄襲嗎？》《不知道也無妨》、\n\
  \      間宮祥太朗《東京復仇者》《詭異之家》\n日本｜2024｜日語發音｜中文字幕｜彩色｜110分鐘\n\n--"
