url: https://www.ptt.cc/bbs/movie/M.1764671594.A.35F.html
title: '[負雷] 在大雪封閉的山莊裡'
content: '在大雪封閉的山莊裡



  志願成為演員的七名男女，被劇作家東郷陣平聚集到名為「四季」的山莊裡。然後他們開

  始一場奇異的舞台劇排練——一齣沒有劇本的推理劇。眾人心裡雖覺奇怪，但依然進行了

  排練。然而由於山莊外的暴風雪導致山莊變成了密室。


  然而如同舞台劇內容中發生在暴風雪山莊中的連續殺人案般，演員們一個接一個消失。他

  們不禁想到，這真的只是排練嗎？




  好像是網飛昨天上片

  設定是很有趣



  但解謎後整片很莫名

  麻倉雅美車禍半身不遂

  也不能直接間接怪其他人

  走在路上不看路被車撞

  還要殺了其他人



  本多雄一

  假裝殺了其他三個人

  給麻倉雅美看

  她看完之後

  此生就解心頭之恨了嘛

  之後還不是一樣活得好好的

  除非刻意消失麻倉雅美生活圈

  被發現是演給她看的

  反而才會崩潰吧

  不如找時間直接真心道歉



  莫名的動機

  莫名的結局

  =負雷


  --'
