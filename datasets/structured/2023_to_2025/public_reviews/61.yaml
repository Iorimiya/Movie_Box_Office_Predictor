url: https://www.ptt.cc/bbs/movie/M.1761912942.A.B53.html
title: '[好雷] 國寶'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  吉田修一的小說《國寶》描寫了主角喜久雄追求歌舞伎藝術的一生。身為黑道之子，卻因天生美貌與天賦，被歌舞伎名門收養，踏上「女形」的藝道。

  故事講述喜久雄對登台演出的執著與師父繼承人俊介之間的宿命糾葛。

  講述了傳統藝能的傳承、藝術家的孤獨，以及在華麗舞台背後，人生的血淚與犧牲。


  1. 舞台美學與觀賞價值

  《國寶》最大的價值在於擷取了歌舞伎表演的精華。對於大多數臺灣觀眾而言，礙於語言和文化的門檻，現場觀賞歌舞伎有一定難度。

  這部作品恰好提供了一個極佳的觀賞機會，讓我們能近距離感受那種極致的日式美學。

  尤其是偶爾穿插的役者從舞台上凝視觀眾席的視角，更為觀影體驗增添了獨特的代入感。


  2. 關於「傳承」的冰冷現實

  原本以為喜久雄憑著努力和天賦獲得師父肯定，在繼承名號後會一帆風順，然而故事卻展現了傳統藝能界血淋淋的現實。

  師父臨終前喊著的是兒子俊介的名字，逝世後，主角因「外來者」身份，被同業視為「竊占名號的卑鄙小人」而遭到封殺。

  這種「血統」與「實力」的強烈衝突，讓人感受到傳統體制內難以撼動的排他性。

  而劇中的國寶師伯落迫凋零，象徵著傳統歌舞伎表演在現代娛樂競爭下的困境。劇情也讓我猜測年輕人才不投入、俊介的病情可能才是喜久雄被找回的原因，但這份無奈與掙扎，已然讓這部作品的基調充滿了現實的悲劇感。


  3. 內斂克制的日本文化

  整部作品在情感表達上，充滿了日式的內斂和克制。角色之間的愛恨情仇往往被層層包裹起來，雖然初看可能會覺得情感戲「味道清淡」，但這正是日本文化和電影的特色。不是直接爆發的戲劇張力，而是將痛苦和犧牲內化為藝者的舉手投足之間，讓人在細細品味後，才能體會到其隱藏在平靜表面下的強烈、深沉的力量。



  電影近三個小時的片長，欣賞起來卻不感乏味，能讓人投入劇情中。


  這類的劇情片與好萊塢片的公式橋段、固定套路截然不同，推薦大家也入場感受一下。



  -----

  Sent from JPTT on my Samsung SM-S9310.


  --'
