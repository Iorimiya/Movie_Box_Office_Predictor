title: '[好雷] 殿堂級鉅作《國寶》登日本影史真人票房第'
content: '代表日本角逐奧斯卡、注定載入史冊的殿堂級鉅作《國寶》在台盛大獻映中！電影帶觀眾

  沉浸於日本國粹——歌舞伎的世界，更憑著優異口碑不斷刷新影史票房紀錄。截至今日

  (10/25)估計總票房約166億日圓，高居日本影史真人電影票房亞軍；而這股現象級觀影熱

  潮依舊，持續朝超越《大搜查線2：封鎖彩虹橋》(173億) 的日本真人票房冠軍目標邁進


  電影改編自吉田修一原著同名小說，由名導李相日執導、金牌編劇奧寺佐渡子操刀劇本，

  黃金製作陣容成為本片最堅實的品質後盾，成功將高雅艱深的歌舞伎藝術，化為一段橫跨

  半世紀、充滿愛恨情仇與戲劇張力的命運史詩。電影不僅深入探討傳統藝術的傳承，更刻

  畫才能與血統的衝突，以及對極致美學的追求等深刻主題。



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  吉澤亮與橫濱流星的精湛演出，無疑是撐起整部作品的靈魂。吉澤亮以天生適合女形的臉

  型與氣質，完美駕馭主角喜久雄從初登台時青澀緊繃，到年邁時風骨猶存的細膩轉變，每

  一處眼神與肢體皆層次分明。當他在漫天飛雪中化身《鷺娘》獨舞時，那已不只是表演，

  更是對角色一生的完整映照——他詮釋的，正是一個為追求至高藝術境界而吞噬人性，名為「

  美麗」的怪物。


  橫濱流星所飾演的歌舞伎世家嫡子俊介，則將舞台視為血統的證明與情感的寄託。即便角

  色身體殘缺，他仍選擇在《曾根崎心中》的舞台上燃盡生命，以殘軀演繹極致的美學與悲

  劇性。本作敘事的高明之處，是巧妙將歌舞伎演出曲目與角色心境交織合一，令觀眾沉浸

  於人生如戲的意境之中。


  《國寶》不僅讓我們欣賞歌舞伎之美，更以角色貫徹「藝術即生命」的信念，帶來觸及靈

  魂的美學震撼。誠心推薦這部殿堂級鉅作給每一位熱愛日本文化、追求極致電影質感的你

  一同感受！



  --'
