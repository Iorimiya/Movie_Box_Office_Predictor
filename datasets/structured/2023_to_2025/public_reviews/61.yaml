title: '[新聞] 國寶級默片囝仔辯士 陳錘鐘致力文化傳承'
content: '新聞網址：


  國寶級默片囝仔辯士　陳錘鐘致力於文化傳承


  【亞太新聞網／記者袁慧心、巫啟榮 ／桃園報導】


  台灣一直都是全球電影市場重鎮之一，在1970年代還是全球影院密度最高的地區，而台灣

  的電影產業自日治時代開始，就有所謂的電影辯士，如今全台灣僅剩下一位高齡80歲的辯

  士陳錘鐘老師，仍然致力於保留這傳統的電影文化。



  ▲電影辯士陳錘鐘老師(中)80歲仍然身體硬朗(國家圖書館提供)


  電影辯士為默片時期的電影說明者，即專門替默片或外語片旁白，為觀眾講解劇情之電影

  工作者，但隨著外片紛紛打上翻譯字幕後，在1960年代就慢慢走向絕跡了。魏德聖所監製

  的電影「KANO」中，就在一幕電影院鬥毆橋段裡，出現這樣的電影辯士，而那正是由陳錘

  鐘老師親自上陣飾演。現年80歲的陳老師是台灣僅存一位電影辯士，年僅17歲即投入辯士

  行業，同行均以「囝仔辯士」稱呼陳錘鐘老師，如今卻已堪稱我國人間國寶。也因為年輕

  即投入此行業，經驗豐富，現在都還能為默片旁白，讓60多年前聽辯士說電影的風貌重現

  。


  日前「時代電影臺北 – 臺北電影的風華年代特展」，於國家圖書館放映一部1931年阮玲

  玉主演的《戀愛與義務》黑白無聲電影，邀請陳錘鐘老師重現默片時代為觀眾旁白、配樂

  、講解劇情，片長2.5小時全程由電影辯士旁白與解說，陳錘鐘老師出身於電影世家，早

  年即擔任過此片之辯士，陳老師經過60多年的歷練後，再次為此部默片旁白過程非常精彩

  ，片中女主角辛酸的情景，辯士彷彿融入劇情當中，頻頻拭淚訴說旁白，令現場觀眾為之

  感動不已。現場觀眾熱情地對辯士行業的提問與掌聲久久不停，非常希望本次的主辦單位

  臺北市立文獻館未來能夠繼續舉辦相關活動，讓更多人有機會欣賞現今已消失的電影辯士

  行業，可謂非常珍貴難得的觀影體驗。


  雖然退休已久，陳錘鐘老師還是熱衷於電影文化的傳承工作，過去6年在桃園社區大學開

  立13個學期的電影班課程，對於電影文化教育的貢獻良多，並榮獲教育局頒發成人教育師

  鐸獎。他也希望未來與地方文化局合作，紀錄保留這項技藝。

  --------------


  註:文中所述活動已經結束,純粹分享其人其事予板友


  --'
