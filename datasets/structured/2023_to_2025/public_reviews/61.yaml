title: '[新聞] 【技術者們】愛台灣，「國寶」珍奶入戲！'
content: '新聞網址：


  《技術者們》搶看會圓滿落幕  「台灣國寶」珍珠奶茶驚喜入戲


  由金宇彬、李玹雨、高昌錫聯合主演的話題韓片《技術者們》，南韓上映至今，

  已吸引超過255萬民眾入場觀賞，累積票房高達198億韓圜（折合新台幣5億7500

  萬元），叫好又叫座！台灣片商為了造福粉絲，特別選在昨日（1/17）下午舉辦

  獨一無二的「偷心搶看會」，讓粉絲能夠在正式上映以前，搶先觀賞這部精采強

  片。活動現場驚喜連連，有看又有拿，讓粉絲大呼值回票價，更放話要在電影於

  1月23日在台正式上映之後，再看好幾次！值得一提的是，現場甚至有眼尖粉絲

  ，發現台灣出產的道地「珍珠奶茶」在片中出現，還被高昌錫拿在手上邊喝邊趴

  趴走，也讓珍珠奶茶成為全片一大亮點，無疑另類「台灣之光」！



  《技術者們》偷心搶看會  「台版池昌旭」鄧育凱站台支持


  南韓年度最強動作娛樂爽片《技術者們》，由於有金宇彬、李玹雨、高昌錫等強

  大主演卡司，讓本片自開拍以來就備受矚目。台灣片商也選在昨日（1/17）下午

  ，於台北今日秀泰影城舉辦粉絲限定的「偷心搶看會」。現場不僅吸引320位忠

  實粉絲共襄盛舉，其中還不乏有從中南部北上的粉絲；就連台灣電影《共犯》男

  主角、被媒體譽為「台版池昌旭」的潛力男星鄧育凱，也抽空到場支持觀賞，為

  活動增添星光。現場不僅送出台版獨家電影周邊，更加贈台灣樂天製?提供的「

  Anytime三層薄荷糖」、「Pepero巧克力棒」，以及台灣菲詩小舖提供的「草本

  宣言櫻桃亮白潔顏乳」；現場更抽出幸運粉絲，致贈片中金宇彬所穿戴的同款「

  3M舒適型止滑耐磨手套」，以及最新一期金宇彬封面的《Trendy偶像誌》，還有

  空運來台的主要演員親筆簽名海報。值得一提的是，CK watches & jewelry更大

  方提供「摯愛光年系列腕錶」，引發在場粉絲驚呼，好希望自己就是幸運得獎者

  。眾多好禮接連放送，讓粉絲們大呼有看又有拿，實在值回票價，也讓本活動成

  為近年來贈品最澎湃、也最高貴的韓片搶先會！



  除此之外，當天也放映由金宇彬、李玹雨、高昌錫特別錄製給台灣粉絲的影像問

  候，讓粉絲大呼三位演員實在貼心又可愛；等進入正式電影放映之後，歡笑聲更

  是不絕於耳，並伴隨此起彼落的驚呼聲。原來每當高昌錫這位「最強綠葉」一現

  身，就是笑料百出；而每當金宇彬在片中有耍帥場面，粉絲們也按耐不住激動情

  緒，頻頻發出讚嘆聲，以實際行動支持自己心儀的偶像。而在電影播放完畢之後

  ，粉絲們都對本片讚不絕口，更被演員們的魅力所擄獲，直呼：「等電影上映之

  後，還要再看好幾次！」



  《技術者們》愛台灣  「國寶茶飲」珍珠奶茶閃耀國際


  不僅如此，《技術者們》也不像其他電影動輒只喝燒酒，這回角色們喝的飲品就

  超有新意！搶看會現場便有眼尖粉絲，發現片中竟出現台灣最具代表性、並被美

  國有線電視「CNN」選出「世界最好喝飲料」第18名的「珍珠奶茶」，讓粉絲們

  超驚喜，並認為這簡直就是為了台灣觀眾而拍的段落。片中高昌錫跟金宇彬、李

  玹雨在街上觀察作戰地區時，就見高昌錫拿著一杯珍珠奶茶趴趴走，非常顯眼；

  而片中還有金宇彬跟女主角趙允熙坐在台灣知名茶飲品牌「貢茶」店中的場景，

  而趙允熙旁邊桌子也放著一杯珍珠奶茶，意外讓台灣出產的珍珠奶茶成為一大亮

  點。其實金宇彬去年3月訪台參加見面會時，就在記者會上品嚐過珍珠奶茶，讓

  他回味再三。這回劇組拍片也準備許多珍珠奶茶，想必也是讓他十分欣喜。足見

  「台灣國寶」在南韓電影中發光發熱，珍珠奶茶也成為另類「台灣之光」！



  這部引起粉絲高度期待的話題強片《技術者們》，即將於1月23日在台震撼上映。

  劇情描述年輕帥氣的志赫（金宇彬飾演），被譽為是竊盜界的最強頭腦，任何金

  庫都難不倒他，還能偽造一切資料，制訂滴水不漏的竊盜計劃。他聯手人力調配

  專家具仁（高昌錫飾演），以及超強駭客鐘裴（李玹雨飾演），向安全防盜措施

  最嚴密的珠寶機構偷取高價鑽石。三人以出眾實力成功完成任務，並在竊盜界一

  夕成名。耳聞三人實力的黑手黨趙社長（金永哲飾演），決定網羅他們，希望他

  們加入最高難度的偷竊任務──在40分鐘內盜取藏於仁川海關的1500億黑錢。究

  竟這三位實力高超的「金庫技術者」、「人脈技術者」和「駭客技術者」，能否

  成功達成任務？還是將失敗落入法網？而志赫和趙社長之間的心機角力，又將會

  是誰勝誰負？



  欲知電影最新消息，歡迎上電影官方部落格

  與臉書粉絲團查詢。



