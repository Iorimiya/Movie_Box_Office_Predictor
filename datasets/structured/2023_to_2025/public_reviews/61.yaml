url: https://www.ptt.cc/bbs/movie/M.1683690727.A.209.html
title: '[新聞] 國寶級帥哥目黑蓮與今田美櫻「先婚後愛」'
content: '新聞網址：


  電影【我的幸福婚約】改編自顎木亞玖彌暢銷輕小說，小說及漫畫累計發行650萬冊，以

  唯美、奇幻的和風灰姑娘故事受到廣大讀者喜愛。真人版電影找來日本國寶級帥哥目黑蓮

  （Snow Man）和福岡美少女今田美櫻攜手演出，首周上映便勇奪日本票房冠軍，創下票房

  佳績，現於日本上映四周，票房已累計突破21億日圓。渾身散發可愛氣場的今田美櫻，此

  次飾演一名宛如灰姑娘般，不被父親疼愛，又飽受繼母、妹妹欺凌的可憐女孩美世。今田

  美櫻表示，自己在閱讀劇本時，因為深深陷入美世的悲傷心情，所以忍不住大哭了一場。

  當提到對首次合作的黑目蓮的第一印象，今田美櫻更驚呼，「他的髮型與渾身散發的氣質

  完全就是清霞本人！」由於兩人在片中設定的關係為「先婚後愛」，今田美櫻表示，目黑

  蓮為了維持兩人之間的「陌生感」，在現場刻意與她減少交談、保持距離感。對此導演也

  大讚兩人的專業表現，「目黑先生與今田小姐兩人針對角色都作了許多思考！美世與清霞

  是在互相察覺對方心意之後，才慢慢靠近彼此的。所以若一開始就靠得太近，那反而會有

  太過了解對方的感覺。」


  此次，目黑蓮和今田美櫻也罕見地在片中以古典造型亮相。兩人的古裝造型讓人驚艷不已

  ，身材高挑的目黑蓮從挺拔的軍裝到儒雅的和服，每個造型都完美駕馭，讓人眼睛為之一

  亮，他自己也開心表示，「我平常沒什麼機會能穿到軍裝與日式傳統服裝，因此也學了許

  多和服穿法，對我而言真的是十分寶貴的一次經驗！」同時，今田美櫻也為本片獻出了和

  服演出處女作，除了努力練習穿和服的站姿及坐姿，揣摩傳統小女人的儀態，每一套精緻

  的和服造型還會隨著角色的心境變化而做出改變，誠意十足。她笑稱自己好幾次都演到全

  身肌肉痠痛，吃足苦頭，「因為是第一次，所以一開始還不習慣蹲下或站立，會在身體一

  些奇怪的地方施力，搞到最後肌肉都痠痛起來！」【我的幸福婚約】將於5月12日在台上

  映。


  時間是「文明開化」的近代日本。出生帝都名門望族的長女齋森美世（今田美櫻 飾）由

  於生母早逝，自小就被繼母與同父異母的妹妹如同僕人般虐待。美世捨棄一切，每天刻苦

  忍耐，雪上加霜的卻是她被下令要與傳聞中冷酷無情的將軍，久堂清霞（目黑蓮 飾）進

  行政治聯姻。許多清霞之前的未婚妻人選都撐不過三天就落荒而逃，而清霞果然就如傳聞

  所言，初次見面就對美世冷言冷語。「在這裡，你要絕對服從我說的話。我叫你滾出去就

  給我滾，我叫你去死就去死」然而，美世連逃跑的地方也沒有，不知所措地開始了在久堂

  家的生活；相處一段時間之後，美世發現清霞實際上並不如外界評價那樣是個惡名昭彰的

  人物。而清霞也感受到，美世與之前那些貪圖他的外貌和家世的未婚妻人選有著不一樣的

  感覺，緊閉的心房因此一點一滴地打開。兩人的心意逐漸相通，但此時帝都周圍卻相繼發

  生神秘的襲擊事件，很快便威脅到了整個帝都，而殘酷的命運也等待著清霞和美世……超

  值預售套票將於本周五4月14日於博客來售票網、金石堂網路書店、安利美特台北店/台中

  店/Online shop、藝豐漫畫便利屋台南店/高雄店、天馬行空線上表單開賣。購買單人套

  票即可獲得「A3原文紀念海報」壹張，贈品數量有限，送完為止。更多電影及活動相關詳

  情請洽天馬行空粉絲團。


  --'
