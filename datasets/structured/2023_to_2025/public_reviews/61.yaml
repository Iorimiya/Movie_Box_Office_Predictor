url: https://www.ptt.cc/bbs/movie/M.1761497069.A.550.html
title: '[好雷] 國寶'
content: '改編自吉田修一的原著小說

  國寶是一部以歌舞伎為背景

  講述主角立花喜久雄如何從長崎黑幫立花組老大立花權五郎的兒子

  輾轉成為歌舞伎世家丹波屋的部屋子(非世襲弟子)

  如何襲名(繼承藝名)丹波屋師傅花井半二郎之名

  又如何在其提攜人相繼凋零後面臨演藝低谷

  和半二郎之子大垣俊介間的愛憎並存

  最後成為歌舞伎界的人間國寶的故事


  兩位主角吉澤亮和橫濱流星

  一個演出了追求極致女形之美的匠人氣息

  一個則詮釋了血脈繼承人的灑脫不羈

  兩位本來外型就是美男子了，加上各有劍道與空手道的底子

  電影中演起女形，一個可愛，一個嬌媚

  在外行人的我的眼中還真覺得有這麼回事


  電影本身參考了原著小說的橋段

  同時考量觀影體驗，做了一定程度的修改


  個人覺得比較可惜的部分

  一個是好兄弟早川德次，在小說中挺有戲的

  但在電影中當鏡頭帶到大阪後就沒有德次的戲份了


  另一個則是立花組被愛甲會吸收後形同解散

  母親阿松雖過著幫傭的苦日子，但還是每個月都寄錢給喜久雄

  這部分在電影裡面則改編成母親很早就過世了


  雖然理解導演要將劇情濃縮成現在人可以接受的長度

  勢必要將鏡頭聚焦在兩個主角的互動上

  但一邊是主角不離不棄的好兄弟，一邊是無私的親情

  個人私心上總還是覺得有點遺珠之憾


  另外小說中曾描寫喜久雄在得罪粗俗的地方名士蜂谷夫婦後

  感嘆地對著德次說自己只是一棵樹，只要有人瞧不起一棵樹就會很懊惱

  而俊介從小就背負著丹波屋的使命，他是一座山

  自然一棵樹被瞧不起也不會放在心上


  個人挺喜歡這段對兩人先天性格上的描述

  電影中將之刪除，讓觀眾對兩人行為的解讀上較為發散

  可能會覺得俊介就愛玩做事不認真阿

  或是喜久雄怎麼在不得志的時候這樣小眼睛小鼻子的


  扣掉上面幾項

  整體來說電影挑選與改編的橋段，可以說是手法相當精巧

  雖說三個小時的電影好像很長

  但不知道是不是因為看過小說的關係

  觀影體驗上其實覺得挺緊湊的，一點都不會有拖泥帶水的感覺


  劇目的安排上

  小說中小野川萬菊初登場是扮演隅田川的班女前，電影中則改為鷺娘

  並且在最後讓同樣被認證為女形國寶的喜久雄演出


  電影中兩人的成名作和復出作都是雙人道成寺

  最後的共同演出則是喜久雄曾代演的曾根崎森道行


  猜想應該是即使專業的電影演員

  與其要在短時間內訓練出如小說這麼多劇目

  還不如集中濃縮訓練成果到幾齣裡

  (何況對外行的觀眾來說，短時間塞入太多資訊腦袋大概也麻痺了)


  用相同的劇目串起主角兩人的情感，以及國寶名號的繼承

  配合上電影獨有剪輯和運鏡優勢，個人是覺得真的挺成功的

  曾根崎森道行最後喜久雄那句玩笑話

  "再不站起來，就只能換人代演囉" 更是當場淚噴


  整體來說

  無論是看過了小說或是電影，都很推薦再去補齊另一個部分

  小說的角色面向更為豐富，也更有時代感

  其中不少專有名詞會讓人忍不住邊讀邊研究這個屬於日本的文化


  電影則是優秀且較為平易近人的改編作品

  有著較為濃郁的情感及令人非常滿足的視聽覺饗宴


  最後還想偷偷說一下

  飾演藝妓藤駒的演員見上愛有著非常美麗的脖子

  穿起和服非常好看

  如果有喜歡好看的脖子的同好

  請千萬別錯過這部日本票房破160億的好片，嘻嘻


  --

  因為我是之前有看過小說的

  所以雖然電影有三個小時，我反而覺得劇情還蠻緊湊的

  但畢竟是歌舞伎為背景的故事

  會建議先去youtube上看一下對歌舞伎的簡單介紹

  不會排斥這個元素再去觀看

  是的

  甚至我有一種如果是去看歌舞伎現場，還不見得有電影拍的這麼美的感覺XD

  小說用了比較多的歌舞伎名詞，記得當年在看的時候剛開始比較辛苦

  後來就覺得其實那些名詞沒記起來好像也不影響閱讀阿


  我看第一次的時候，在場有一個觀眾

  只要歌舞伎露出比較誇張的表情，他就會笑出聲音來

  因為這樣子，所以讓我覺得這部片棒歸棒，但可能也不適合所有的觀眾

  所以覺得想看的人可以先去稍稍的了解一點點歌舞伎，不排斥再去看'
