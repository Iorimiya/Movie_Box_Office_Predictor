title: 'Re: [新聞] 《斷背山》成美國國寶 李安：原本只是想'
content: '斷背山和今年的 波西米亞狂想曲

  是非常好的對比



  1.斷背山裡面相愛的兩位男主角後來都各自和女人結婚

  波西米亞狂想曲裡面

  則是佛萊迪先和女人在一起 在不停的和男人出軌XD


  雖然先後順序不太一樣

  但你會明顯感受到

  那位異性伴侶 在佛萊迪心中的地位極高

  反而斷背山裡面那兩位 "老婆"就真的不是那麼重要.....



  2.對比最明顯的

  莫過於當佛萊迪對老婆坦承他是雙性戀時

  他老婆直接對他說:你是同性戀!

  她其實早就知道了

  但她也只能裝做沒關係 不停容忍

  後來雖然老婆離開了他 但卻還是維持著朋友關係

  佛萊迪也買了個房子給她讓她住隔壁

  甚至真實世界中 佛萊迪過世後 大部分遺產是給了這個老婆


  而斷背山則是完全另一個極端

  當希斯萊傑的老婆發現每次老公跟那位"好朋友"出去釣魚

  卻從來沒打開釣箱 留給老公看的紙條永遠都在裡面

  她就知道老公原來是同性戀

  到最後攤牌的時候是充滿憤怒和鄙視

  怒罵著他:羞恥!



  3.這世界大部分的人只是簡單的把人分類成

  異性戀 同性戀 雙性戀

  但其實我認為這兩部電影很好的表現到

  同性戀/雙性戀的界線 並非那麼清楚的


  就算是斷背山

  希斯萊傑一開始也是愛他老婆的

  不然也不會結婚生子一起生活

  只是當然他更愛傑克葛倫霍


  佛萊迪的例子也很像這樣

  他當然是愛瑪莉 才會一開始在一起

  只是後來他越來越愛跟男人在一起


  所以所謂同性戀/雙性戀

  並非這麼一清二楚的

  大部分其實可以當作一種"光譜"

  有些雙性戀比較偏向異性戀那端

  有些雙性戀比較偏像同性戀那端

  大概是類似這種概念吧...

  尤其佛萊迪更是真實世界案例


  我認為這兩部電影

  是最佳的性別教育題材


  --'
