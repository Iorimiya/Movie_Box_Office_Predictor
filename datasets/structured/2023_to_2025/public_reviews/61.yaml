title: '[選片] 要不要來碗茶泡飯? vs. 國寶'
content: '本周+下周,有兩部專注的日本電影上映 本人喜好 劇情 動作 懸疑 動畫 等等的片型


  《要不要來碗茶泡飯?》


  其實是在《一百公尺》正片上映前才看到這部的預告片,預告片就透漏京都人無敵78做作

  的語態,話中有話 話後有話 老實說,窩怕看惹不舒服


  對惹 茶泡飯很好吃阿,吃完窩一定說:再來一碗

  =====

  《國寶》


  吉田修一的代表作改編,據說作者為惹此小說,去做惹三年的黑子,近距離觀察歌舞伎,

  尤其男扮女裝的部分,讓窩想對比起 《霸王別姬》的張國榮


  電影眾,怎麼選擇呢?


  --'
