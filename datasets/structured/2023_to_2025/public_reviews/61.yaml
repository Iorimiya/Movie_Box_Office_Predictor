content: "10.23《國寶》台灣官方預告｜持續改寫日本影史的年度顛峰之作！超過千萬人次觀影，\n票房已突破150億日圓，挑戰影史紀錄中！\n\n\n\n\
  《國寶》Kokuho\n\n當代日本影壇夢幻豪華陣容\n　　　　#吉澤亮\n 　　　#橫濱流星\n#高畑充希 · #寺島忍 · #森七菜\n#三浦貴大 · #見上愛\
  \ · #黑川想矢\n#越山敬達 · #永瀨正敏 · #嶋田久作\n#宮澤艾瑪 · #中村鴈治郎 · #田中泯\n　　　　 #渡邊謙\n\n　　《#惡人》 《#怒》\n\
  \ 　導演 #李相日 顛峰之作\n\nAbout Story 關於故事\n日本歌舞伎文化傳世美學 橫跨半世紀的壯闊史詩\n\n《國寶》改編自芥川獎作家吉田修一的生涯代表作。故事講述出身黑道家庭的喜久雄\n\
  （吉澤亮 飾），在父親意外身亡後，被歌舞伎名門花井半二郎（渡邊謙 飾）收留，\n自此踏入華麗卻殘酷的歌舞伎殿堂。天賦異稟的喜久雄與花井家繼承人俊介（橫濱\n流星\
  \ 飾）情同手足，卻成為彼此的勁敵。出身截然不同的兩名少年，將青春與熱情\n全然奉獻於舞台。最終，誰能登上人間國寶的王座？\n\n坎城影展「導演雙週」世界首映\
  \ 獲得長達6分鐘熱烈鼓掌\n代表日本角逐第98屆奧斯卡最佳國際影片\n改編自芥川獎作家 #吉田修一 出道20周年生涯代表作\n集結吉澤亮、橫濱流星、渡邊謙、高畑充希等日本影壇頂尖陣容\n\
  在日衝破150億票房、連霸四周票房冠軍\n日本連續5週突破前週票房紀錄 觀眾絕讚淚薦\n直逼日本影史真人電影票房冠軍 創下時隔22年的壯舉\n主題曲「Luminance」由人氣樂團King\
  \ Gnu井口理演唱 坂本龍一女兒坂本美雨作詞\n\n 　　10.23 盛大上映\n官方網站：\n\n--"
