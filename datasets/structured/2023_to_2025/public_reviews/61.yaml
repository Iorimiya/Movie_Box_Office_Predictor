title: '[普偏好雷] 國寶 Kokuho'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  1.平日華山午間場，看的人很多，但沒有遇到太大干擾，三小時品質良好。開心，幸運。


  2. 以電影來說，好像沒有辨法覺得太好，但是又可以在各種細節裏看見唯有通過電影這

  樣高成本的影像才能直接傳送到眼前的東西，甚至想，還是只有日本還能在此時拍出這樣

  子純說一個老派古典故事的作品：用一輩子追求技藝，為看到那個只存在腦中的風景。


  3. 兩位男主角的演出確實令人敬佩，不過全片最令我印象深刻的似乎是演出少年喜久雄

  的年輕演員，那眼神姿態好棒。願他的演員生涯順利，之後會小關注一下。


  4. 演員老妝找了好久資料，只找到一兩句，應該是以化妝為主，後製輔助。似乎沒有太

  多人注意，但我真的好在意（因爲有幾幕看起來好真，有幾幕卻有點假，讓我好混亂）


  5. 看完也查了好多糖尿病的資料。只能說，代謝症候群的研究不可忽視，有家族病史更

  要注意自己的身體狀況，若有疑慮千萬不要拖（重點大誤）！






  ***


  這裡是我的樂園:




  --'
