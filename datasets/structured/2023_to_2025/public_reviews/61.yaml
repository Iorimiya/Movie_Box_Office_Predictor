url: https://www.ptt.cc/bbs/movie/M.1761128794.A.F67.html
title: '[新聞] 日本現象級電影燒到台灣《國寶》 導演'
content: '日本年度現象級話題鉅作《國寶》自上映以來引爆觀影熱潮，票房正式突破160億日圓，

  觀影人次破千萬，氣勢直逼日本真人電影票房冠軍寶座。導演李相日也宣布將首度訪台，

  於23日上映首日親自出席映後活動，與台灣觀眾面對面交流。導演場消息一公布隨即爆發

  話題，開賣後僅1分鐘即全數秒殺，可見台灣影迷對《國寶》的高度期待。


  《國寶》由《惡人》、《怒》導演李相日執導，吉澤亮擔綱主演，集結橫濱流星、渡邊謙

  、高畑充希、寺島忍等日本影壇豪華陣容，攜手《夏日大作戰》編劇奧寺佐渡子及頂尖製

  作團隊，共同打造今年最撼動人心的史詩級鉅作。電影以多重視角捕捉舞台張力，深度刻

  畫人性在榮耀與孤獨之間的掙扎演員吉澤亮與橫濱流星更以細膩又充滿張力的演出驚豔觀

  眾，在日本上映後好評如潮。


  《國寶》在高雄電影節完售後，即榮登長短片排行榜第1名，於台灣舉辦的兩場試片也座

  無虛席，現場反應熱烈、口碑爆棚。為回饋影迷支持，發行商也宣布，《國寶》首周上映

  將限量贈送「正式版原文特典海報」，數量有限、送完為止。




  --'
