title: '[新聞] 曾獲金馬終身成就獎！「國寶級電影海報畫'
content: '曾獲金馬終身成就獎！「國寶級電影海報畫家」陳子福辭世　享耆壽97歲


  ETTODAY


  2022年10月25日 19:26


  記者蕭采薇／台北報導


  曾獲得第43屆金馬獎終身成就特別獎，台灣「國寶級電影海報畫家」陳子福，於25日傳出

  過世消息，壽終正寢享耆壽97歲，令國內影人們感到無限惋惜。




  ▲台灣「國寶級電影海報畫家」陳子福辭世，享耆壽97歲。（圖／國家影視聽中心提供）


  陳子福於1926年在台北最早的「電影街」西門町出生。從學生時代就展露對於繪畫的天份

  與長才，儘管沒有接受正規的繪畫訓練，卻能精準用畫筆捕捉電影劇情氛圍與角色神韻。




  ▲陳子福繪製電影海報《大俠梅花鹿》。（圖／國家影視聽中心提供）


  早期經人介紹到專門畫看板的「白日畫坊」工作，又輾轉進入國泰電影公司服務。陳子福

  先生在職期間，常主動修補來自國外的海報，一直到電影《血濺櫻花》引入，讓他重新繪

  製該片宣傳海報，正式點燃他對手繪海報的狂熱。




  ▲2022年總統府前國慶光雕展演「寶島有光・土地之愛」，重現陳子福手繪海報經典。（

  圖／國家影視聽中心提供）


  「通常我畫海報不看片子，給我片名，用片名來想像。」陳子福先生過去受訪時強調，他

  的創作不從電影本身出發，而是揣摩故事背景，將整體意境用構圖、配色呈現戲劇張力。

  一幅《薛平貴與王寶釧》的海報，讓陳子福先生聲名大噪，委託工作如雪片般飛來，也讓

  他正式進入電影圈工作。其後長達五十多年的職業生涯，創作出囊括台語片、文藝片、武

  俠片等經典，全盛時期更需要每月繪製出40幅作品。




  ▲陳子福繪製電影海報《泰山寶藏》。（圖／國家影視聽中心提供）


  國家電影及視聽文化中心曾多次與陳子福老師合作，出版專書《繪聲繪影一時代：陳子福

  的手繪電影海報》，從電影海報的視角出發，窺見彼時的海報設計美學流變，也透過一幅

  幅斑斕精彩的海報畫面，看見台灣電影發展的軌跡。




  ▲陳子福（左）與國家影視聽中心董事長藍祖蔚（右）。（圖／國家影視聽中心提供）





