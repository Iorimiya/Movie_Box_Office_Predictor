url: https://www.ptt.cc/bbs/movie/M.1762112478.A.1B5.html
title: '[好雷]《國寶》女形之伎花開花謝，花非花飛花'
content: '這邊會以吉田修一的小說（2018）加筆電影（2025）為主。

  會沿用許多小說劇情，最後補上觀影感想。


  俠道與花道，多少歲月戲裡戲外的夢飛花舞


  舞台是一個什麼樣的地方？對於觀眾可能是一次休閒或是良好的觀影體驗，但對於演員也

  許是賭上一切演出；無法選擇一輩子的容身處。而當演出除了讓觀眾驚艷、專家學者叫好

  、演員大尺度的犧牲等，如何才是名留青史萬人之上，一輩子留於戲中之人呢？


  《國寶》講述兩位因不同原因踏上歌舞伎的男孩，想守住家門的歌舞伎名門俊介，與黑道

  之子喜久雄，踏上舞台的兩人是朋友、勁敵、也是愛恨無法割捨的一體。觀眾眼中更是對

  立的光與影存在。喜久雄與俊介兩人的世界如同一場歌舞伎，隨著拍板與三味線一步步跳

  入人生舞臺長廊，那麼各位客官，好戲要上演了還請就坐，布幕就拉起。







  《國寶》是什麼電影？

  還記得吉田修上一部改編熱門，並被眾多人討論的作品是《怒》（2014），但台灣媒體主

  要不是討論小說，更多關於妻夫木聰演出同志角色的大尺度的演出。而上上部則是備受讚

  譽的《惡人》（2010），無精神疾病般的《我們與惡的距離》，探討惡與不惡，在犯罪者

  與受害者之間何為真正的惡人。


  吉田修一的作品一直被備有時事性與人性之間的揣摩，尤其在邊緣人與日本社會體制例外

  之處做出小人物或一般人心中那平凡又不凡的獨白心聲，愛與不愛、恨又不恨，讓吉田修

  一的小說總是備感魅力。


  《國寶》是吉田修一於2018年出版的小說，2025年改編成電影在日本獲得相當不錯的反響

  。故是以名門世家和黑道底層兩位少年在歌舞伎舞臺上風風雨雨，高潮迭起的故事扣人心

  懸，上下冊少年篇與花道篇一出版就備受各方人士的愛戴。


  尤其在裡面配合時代演進的故事情節、人物心境上的轉折、還有採用如說書人的朗讀文風

  又有大量歌舞伎與傳統演藝的專有名詞但又不打斷閱讀，轉折和大時代的戲曲藝術圈，讓

  這部小說可以說一但閱讀就難以停下。在電影裡這些則能用更直接和視覺美感讓觀眾所看

  見，不用靠想像，而是展現女形之美。讓觀眾可以從兩位主角年少到成人的後續，去感受

  他們用生命演出花道上生存方式。





  《國寶》分析與延伸：

  根據2018年出版社的訪談吉田修一的新聞中，透過訪談可以看出吉田修一寫作《國寶》時

  的心情，與十年前寫《惡人》時很像，只是這次不以被害者與加害者兩者的視角，而是以

  舞台上兩位不同緣由走向不同起落人生的歌舞伎演員，他們為了演示美，而不斷的犧牲與

  透支自己的身上的一切，只換得舞台上那一刻高光下讓觀眾進入他們如夢似幻的演出中。


  作為從過去，就讀過多部吉田修一的作品的讀者眼中，《國寶》第一幕就讓人直接聯想到

  同為黑道盛事到殞落主題的作品《長崎亂樂版》，在《國寶》喜久雄年少中，看見《長崎

  亂樂版》年少阿駿的影子。同樣的黑道之子，卻有著不同的人生，吉田修一對於極道俠義

  似乎每每都有所琢磨，男子與男子之間立下一輩子的忠誠的仁義誓言，如同喜久雄他身邊

  永遠有著那位兄弟德次。


  在原作小說中看得見許多吉田修一過往的影子，例如《惡人》和《怒》的寫作手法，雖然

  不如群像劇或是探討人性，但在章節跳躍中，可以看出《國寶》很工整的寫出所有圍繞在

  主角身邊角色的人生故事，在搭配兩位主角中兜起整個歌舞伎傳統演藝圈種種規矩磨合和

  高低，這手法是吉田修一很常使用也讓讀者很快進入小說情節的方式。








  對於人物的描繪中，吉田修一所描寫的我還是依舊認為在男性描繪上多過於女性角色，即

  便這部小說中描寫很多歌舞伎女形與演員背後老婆的故事，但即便如此我認為吉田修一描

  繪作為男性喜久雄各種的脫序只為追求更美和更多，而非成為女性或變成劇中女性角色的

  美艷，是以自己演示，最後達到雪花紛飛般，可以說出好美的絕美一幕。


  在男扮女裝的描繪中，其實也是吉田修一擅長，如第一部得獎短篇《最後的兒子》中的媽

  媽桑，男性與男性之間的曖昧或說女性眼中的男性細節之處，吉田修一的描繪都是讓人驚

  豔的，如同窺看道一名陽剛男士在不知的面向中陰與柔的一面，而這點也套用在女性角色

  上。


  《國寶》中幾乎所有的女性都有著不亞於男性堅毅的一面，甚至可以說靠他們支撐才能送

  這群男人達到他們的舞臺上，柔美的男人與堅強的女子，這是在日式文學有趣的翻轉面。












  《國寶》值得一看嗎？

  《國寶》的故事雖是場海海人生的歌舞伎，喜久雄如何從一個默默無名家道中落的黑道遺

  子，在這圈界一步步邁向巔峰，甚至有個亦敵亦友與自己競爭的歌舞伎名門俊介，但更多

  時候書中則是說起這兩個人為了站在舞台上把靈魂賣給了誰，又把尊嚴落在地上忍受他人

  的踩踏。


  戲子無情是對人，因演藝之人一切的情感都獻給了戲，如要說女人、朋友、觀眾，喜久雄

  最後選擇了一個永遠不會離開他，他可以一直不斷付出情感的舞臺，因為眷戀因為想更接

  近，而有了最終一幕，也許冥冥之中都註定好的。


  走向巔峰是眾人的掌聲，還是孤獨的一人旅程？也許喜久雄和俊介缺一不可，他們彼此拉

  扯和較量讓演出達到盛事，但也因有著他而無法走入最上頭那孤冷之峰。是悲是喜，說穿

  了無非就是一場戲，一場拉扯眾人的條紋幕拉下後依舊演出的戲。


  像是《同棲生活》最後一幕明明可能都知道但還是忽略，也像是《橫道世之介》即便是位

  過客，但卻在他人心中留了位子。國寶所以為國寶，不是踏上巔峰成為戲中角色的演員，

  而是一輩子演出一場不會避幕活在戲中出賣靈魂換取一切的戲子人生。







  《國寶》的電影改編：

  因為幾乎看過吉田修一所有作品，也能說算是長久的小說粉。故對於過去吉田修一的作品

  改編電影，自己幾乎是為了不要讓想像跟現實有所落差，抱持著不去看的心理。這次《國

  寶》主要是為了想看小說中的歌舞伎演藝，加上日本眾多好評，所以第一次看了改編吉田

  修一小說電影。


  結論是比我想像中要好，雖然很多細節部份被刪除（例如兩位主角與女性複雜的愛意與情

  感、被過激的性暗示對待），但加入了很多歌舞伎表演的部分，讓電影很有戲中戲，甚至

  展現出日本傳統技藝，這點比起複雜的情感戲，在映視化後的《國寶》是大大加分的。


  但《國寶》電影改編中讓我最無法接受的一件事，就是喜久雄最要好的兄弟－早川德次，

  在電影中從學習歌舞伎之後德次的描寫全部消失。因為德次跟喜久雄兩人兄弟感情的片段

  ，在前段德次總是會護著他家少爺（喜久雄）不被人欺負，設置再後面即便被騙去到北海

  道，還是千方百計回到大阪，只為了保護他的喜久雄少爺，甚至在喜久雄演藝事業低潮時

  送花輪、掛暖簾，就為了捧他的少爺，展現出吉田修一特有的極道大哥與小弟之間的任俠

  義氣。這也對比如果喜久雄與俊介是勁敵摯友，德次與喜久雄就是不變的兄弟情。








  吉田修一本身是出生於長崎，對長崎有著特殊的情感記憶，在2022年網路版《文藝春秋》

  的訪談中，吉田修一就有提到他過去都未好好直面關於長崎原爆，故電影中提到這點也是

  如此。並且雖然是我個人的猜測，吉田修一在《長崎亂樂版》或《國寶》中，描繪的黑道

  家族悲劇，很大一部分受到影響《無仁義之戰》（1973）等一系列悲劇性寫實黑道電影色

  彩的影響，並且在另一部作品《橫道世之介》之中，就曾表示他想寫出「沒有英雄的時代

  」。也是為何《國寶》喜久雄的黑道身分加劇給他的是更多悲劇，而不是狹義道理。


  《國寶》電影版中，不斷加劇關於主角喜久雄的悲劇成分，而這也是一個矛盾的地方，因

  為喜久雄從過去到成為國寶，一直都是悲劇，而有意思的是歌舞伎中最被人津津樂道的女

  形角色，也清一色是悲劇。也就是過往現代交織的悲劇人生，反到讓喜久雄更能演出這些

  悲歡離合、生死離別。


  所以電影拔掉小說中那永遠的兄弟德次的戲份，等同於將喜久雄直接推像沒有後路的烽火

  浪尖，在改編戲劇效果拉滿，但作為一個私心喜歡德次與喜久雄之間情誼的讀者，很不爽

  這點，因為在原作中喜久雄心目中他的歌舞伎第一位觀眾始終是早川德次。









  不管過去的極道之子的身分、或是歌舞伎花道學徒之姿，喜久雄不管踏上哪一邊都是悲劇

  ，這也符合吉田修一許多作品底層人物往高處爬，即便登高最終能就孤寂，即便殞落仍被

  社會不聞不問，如同短篇《最後的兒子》，就要修成正果之時，對方依舊一句不能讓主角

  成為「最後的兒子」而打回現實。《國寶》的花道依舊如此，在舞台美的背後盡是不美、

  在黑道社會背後盡是無義。社會依舊殘酷，一切都不值得，但是這是喜久雄國寶的花之道

  。




  --

  個人Blog：

  小說連載頁：


  --'
