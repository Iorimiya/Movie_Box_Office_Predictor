title: '[新聞] 72歲國寶級喜劇演員顧寶明驚傳病逝'
content: '新聞網址：



  12:22 2022/03/19 中時 洪秀瑛



  72歲國寶級喜劇演員顧寶明驚傳病逝，他的妻子和小孩都陪伴在旁，家人、親友及戲迷們

  都感到不捨。



  果陀導演梁志民稍早在臉書證實，寫道「我們敬愛的顧寶明寶哥，在今天早上因心肺衰竭

  ，告別了人生舞台。我們慟失了一位在舞台上全力投入、精彩傑出的演員，以及在生活上

  溫暖幽默的長輩、朋友，感謝他帶給我們這麼多精彩生動的角色和生命故事。」


  梁志民分享，「我在大學時代就認識了寶哥，那時候和他、國修，一起在電視台寫綜藝節

  目短劇的腳本，舞台上、或是電視螢幕裡的寶哥，詼諧幽默，輕鬆風趣，但私底下他其實

  是一個非常嚴謹的戲劇工作者，不管對劇本、表演，或是對自己的要求，非常非常嚴格，

  甚至可以說是到『一絲不苟』的程度，和他合作過的演員一定贊成我這樣的說法。」


  梁志民也提到，「寶哥的喜劇表演，其實很嚴肅，他講究所有的台詞、動作的內在動機，

  他認為，沒有寫實基礎的浮誇，都不是好的喜劇。所以，再怎麼荒謬的台詞、情境，到了

  他身上口中，都變得極為真實可信，進而讓人發笑。儘管這個角色的處境，往往都是在

  悲傷的時候。他演《超級奶爸》，因為要接近孩子，不得不裝扮成一個六七十歲的老太太

  ，唯妙唯肖的表演，讓他的好朋友金寶又是讚歎又是打趣說：「扮演女人真是一件光采的

  事，你可不可以穿著這個衣服，到我家幫忙哄小孩呢？」


  顧寶明4年前曾帶著小他20歲的妻子出席朋友聚會，因他左手不時出現抖動、臉僵，加上

  推掉不少戲劇演出，傳出罹患帕金森症，健康亮紅燈。當時接受本報獨家專訪時坦言，確

  實有手抖及臉部肌肉僵硬問題，但強調沒得帕金森氏症也不是小中風，透過規律作息及運

  動已恢復許多。


  顧寶明當時表示，2017年左右發現左手顫抖、臉部肌肉不協調，醫生告訴他是自律神經失

  調，他自己推斷可能是演出舞台劇《接送情》，戲中和郎祖筠各飾演2個角色，身心勞累

  壓力大之外，另一個原因應是被酒精害慘，「以前酒喝太多，現在年紀大才知道年輕時沒

  有好好保養，現在來報仇了」。


  他年輕時跟朋友聚會，喝酒時幾乎都用灌的，十分豪邁，那幾年還曾發生2次酒駕意外，

  上了社會新聞。後來他下決心戒菸戒酒10多年，顧寶明當時說「本以為一戒就沒事，沒想

  到若干年後還是出狀況，可見不要掉以輕心，以前沒好好善待他們（身體），年輕時不在

  意，老了就找你算帳，這次生病就是來警告我」。


  顧寶明當時說，自律神經失調最大困擾是手和臉的問題，除了尋求中醫針灸治療、每天也

  吃高血壓藥，醫生告訴他飲食沒禁忌，只要好好生活就可以。平時都靠太太照顧？他體貼

  說，「她年紀比我小，是我要照顧她才對」。短時間內無法拍戲？他說不影響，仍熱愛演

  戲，有工作，筋骨才能多活動，「年輕的時候不懂生活，現在生活擺第一、工作第二，之

  前還帶老婆去歐洲玩」。


  顧寶明前年曾客串演出電影《消失的情人節》，片中演出亮眼，由於當時已受自律神經失

  調所苦，他仍帶著病體演出，可見對表演的熱愛。導演陳玉勳在電影宣傳時曾表示，顧寶

  明多年前拍《健忘村》後就去大陸工作，從大陸回來就生了一場大病，確切甚麼症狀不清

  楚，再拍《消失的情人節》時已是稍微好一點的狀態，但還是很容易疲累，他跟郎祖筠都

  鼓勵顧寶明要打起精神繼續演戲病才會好得快。


  他一生熱愛表演，曾在表演工作坊演出《暗戀桃花源》再版、《暗戀桃花源》、《圓環物

  語》；屏風表演班《合法犯罪》、《半里長城》；蘭陵劇坊《今生今世》、《荷珠新配》

  。


  他曾說過舞台劇最迷人的地方，就是在台上台下呼吸同一個空氣，同一個感情、感覺，和

  觀眾共同創造一個氣氛。有一種宇宙一家人的感覺，那是得天獨厚，其他行業所享受不到

  的，所以即使兩岸電視演出邀請應接不暇，他仍心繫舞台劇，2003年以果陀《ART》重返

  劇場，讓劇迷們觀賞他難得的演技。


  他也曾獲獎項肯定，《晴空亂流》曾獲金鐘獎單元劇最佳男主角提名、《花橋榮記》獲金

  馬獎最佳男配角提名、《國道封閉》獲金馬獎最佳男配角提名、《暗戀桃花源》獲金馬獎

  最佳男配角獎、《他是我兄弟》獲得金鐘獎最佳男主角獎。


  顧寶明演藝資歷豐富，演技老練，戲路多變，曾和張韶涵合作《公主小妹》、和言承旭合

  作《籃球火》等電視偶像劇，和李連杰、劉德華、金城武合演電影《投名狀》，穿梭於兩

  岸拍戲，電視、電影、舞台劇皆有經典作品。


  電影作品包括《來去少林》、《花橋榮記》、《徵婚啟事》、《國道封閉》、《我的神經

  病》、《麻將》、《五魁》、《黑皮與白牙》、《恐佈份子》。


  電視劇作品包括《如來神掌》、《官場插班生》、《軍官與面具》、《晴空亂流》、《懷

  玉格格》、《俠女闖天關》、《白髮魔女》、《倚天屠龍記》、《俠義見青天》、《英雄

  少年》、《江湖再見》、《京城四少》、《煙雨江南》、《他是我兄弟》、《江南遊》等

  。


  梁志民在哀悼文中表示，「儘管認識多年，但真正和他第一次合作的舞台劇， 是2003年

  的《ART》，劇中他有一段長達十來分鐘，絮絮叨叨、一人分飾多角的大獨白，每場演出

  之前，我總是看著他把這段表演，從頭到尾一字不漏地在舞台上走過所有的地位、反覆熟

  悉，從第一場到76場，從不懈怠。」


  「2020年的3月21日，《接送情》在台中歌劇院演出，因為疫情的關係，不得不採取梅花

  座，整場坐不到一半觀眾，但是當他謝幕的時候，我感受到觀眾激動的掌聲，完全不遜於

  任何一場滿場的演出。也許是天意，讓我錄下了寶哥的人生中，在他最愛的舞台上最後一

  場演出的謝幕時的身影，這應該是上帝給我、和喜愛寶哥的朋友們，最珍貴的恩賜。謝謝

  你，寶哥，再無疾苦、一路好走」。


  果陀劇場剛剛對外表示，「我們敬愛的顧寶明寶哥，在今天清晨6點因腸胃道出血導致心

  肺衰竭，不敵病魔於早上7:30病故，告別了人生的舞台，享壽72歲。我們慟失了一位在舞

  台上全力投入的演員、在生活上溫暖幽默的朋友，感謝他帶給我們這麼多精彩生動的角色

  和生命故事。相關治喪事宜，待家屬與果陀劇場安排妥當後再公布。」


  --'
