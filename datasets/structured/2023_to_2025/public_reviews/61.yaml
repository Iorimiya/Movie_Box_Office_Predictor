title: '[新聞] 《國寶》登頂日本真人電影票房冠軍！導演'
content: '新聞網址：





  由吉澤亮主演、李相日執導的電影《國寶》，自6月6日在日本上映後一路狂飆，累計票房

  突破 173.5 億日圓，正式超越2003年的《大搜查線2：封鎖彩虹大橋！》，成為日本影史

  「真人電影票房冠軍」。這項紀錄睽違22年才被刷新，不僅對電影界投下震撼彈，也讓外

  界重新關注日本劇場文化與工藝精神的能量。


  上映半年掀現象級風潮


  《國寶》上映時間長達 172 天，幾乎橫跨半年，依照當前的熱度推估，撐到 2026 年都

  不是難事。觀影人次早已突破千萬，年度票房僅次於《鬼滅之刃 無限城篇 第一章・猗窩

  座再襲》，並一路超車《灌籃高手》、《名偵探柯南》、《崖上的波妞》等國民級動畫作

  品。能以「真人電影」之姿達到這種票房高度，已是日本影壇睽違多年的盛況；在串流平

  台瓜分市場、戲院普遍衰退的當下，《國寶》逆勢而上的氣勢更顯可貴，幾乎可稱是一場

  時代難得的集體奇蹟。


  三倍成本打造極致美學


  《國寶》製作成本高達12億日圓，約為一般日本真人電影的三倍規模。片中大量重建明治

  至昭和時期的劇院、服飾與化妝系統，從舞台機關、光影調度到演員一身身講究的造型，

  所有細節都以近乎職人精神的方式被重新打造。也正因為這份極致講究，成功吸引大量年

  輕觀眾走進戲院，意外讓歌舞伎文化在現代社會掀起新一波關注。


  不少影迷都說，只要看過《國寶》，都會在那一幕幕從幽暗走向絢爛的舞台轉換中被深深

  觸動、甚至落淚。那是一種只有「投入成本」與「投入靈魂」才能堆疊出的美學震撼。要

  打造一部現象級神作，光有錢是不夠的，從導演、演員到每一位幕後工匠的細密功夫，都

  是讓《國寶》成為年度奇蹟的關鍵。


  從電影紅回小說


  電影的狂熱也迅速延燒至原著市場。《國寶》上映短短四個月內，小說銷售量暴增 160萬

  本，累計突破 200萬本，顯示作品觸動的並不只是票房，而是一場橫跨文化與世代的現象

  級風暴。當年作者吉田修一為了寫《國寶》，曾在歌舞伎座親身擔任幕後工作人員長達三

  年，並對相關人員進行深度訪談。正因為有這些田調與沉浸式的體驗，小說才能以極高的

  密度捕捉歌舞伎世界的種種眉角。這也使他的小說不僅讓大眾能深入淺出了解其中文化，

  更被歌舞伎界專業認可。


  台灣也掀起「國寶熱」


  台灣自 10 月 23 日上映後同樣獲得熱烈迴響，上映約一個月票房便逼近三千萬，影迷二

  刷、三刷幾乎成為常態，社群上更持續出現「國寶病」的瘋狂討論。以日本真人電影在台

  灣「破千萬就算亮眼」的常態而言，《國寶》此番成績已是難得的奇蹟。為回應影迷熱情

  ，台灣片商也預告將推出 威秀限定特典海報，勢必再掀新一波觀影熱潮。


  導演霸氣喊話言猶在耳


  隨著票房正式登頂影史，《國寶》導演李相日那句霸氣宣言也被再次想起──他在來台受

  訪時笑說：「如果《國寶》真的成為真人電影第一，我只希望我離世前不要被超過（笑）

  。」言語雖幽默，卻藏著對作品深刻的信念。比起紀錄本身，他真正看重的是文化價值：

  「如果《國寶》能成為代表日本的電影，那將是最大的榮耀。」如今本片也確定代表日本

  角逐奧斯卡，若以此作獲獎，不僅是日本電影的里程碑，更象徵歌舞伎文化得以跨越語言

  與時代，被全世界再次看見，對日本而言，這將會是一枚極其有紀念價值的文化勳章。


  source：傳影互動




  --'
