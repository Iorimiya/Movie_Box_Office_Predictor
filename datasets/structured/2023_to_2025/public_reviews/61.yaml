title: '[新聞] 金馬好評 國寶音效師的工作紀實《擬音》'
content: "四月中好評上映！國寶音效師的工作紀實《擬音 A Foley Artist》\n\n\n\n--\n\n去年金馬影展有一部首映就大受好評的紀錄片《擬音\
  \ A Foley Artist》，\n片中以台灣資深音效師－胡定一為主要紀錄對象，\n帶領大家認識台灣電影歷史發展中的聲音製作。\n\n紀錄片從胡師傅個人故事出發，拉大至更寬廣的視角，\n\
  深入探討華語電影聲音世界，前往香港、北京、上海，一窺聲音製作歷史及技術發展。\n《擬音 A Foley Artist》試圖在這個時代，為華語電影聲音發展留下重要記錄。\n\
  \n首映後好評如潮，想一窺華語世界第一部關於電影聲音的紀錄片，\n千萬不可錯過 4 月 14 日在國賓長春戲院的獨家上映！\n\n\n--\n\n影像紀錄不為人知的音效幕後工作\n\
  \n1997 年三谷幸喜拍攝了《心情直播，不NG》，故事圍繞著廣播、音效製作，\n以喜劇電影形式成功讓大家對廣播音效師多了新的認知。\n而在真實世界中，電影製作，也有專門負責音效的靈魂人物，\n\
  最常聽到的 Foley，俗稱「擬音」，就是專指對著電影畫面、劇情，打造出相對應的音效。\n\n\n而《擬音》這部紀錄片，就是華語圈第一部描述電影聲音製作的電影，\n\
  由曾參與《他們在島嶼寫作》系列紀錄片拍攝的導演－王婉柔拍攝。\n她六年前在工作上遇見了胡定一師傅，這位將 Foley 當成生活一部份的聲音職人，\n專心投入工作，一做就是\
  \ 40 餘年，不曾轉換跑道。\n\n導演以細膩優雅的敘事手法，帶領觀眾更加熟知擬音師的工作內容，\n她拿起攝影機拍攝台灣資深音效師的創作生涯，追溯台灣電影歷史發展中的聲音製作，\n\
  如何創作出適合的音效，加進電影中聽起來不突兀？\n\n\n影評人－聞天祥就在《2016 金馬影展選片指南筆記》中寫到：\n\n「我們通常把電影當成視覺媒介，忽略聲音在裡面的效果。\n\
  \  無論是現場收音，或者是音效製作，甚至是配音這個行當，他們到底是怎麼工作？\n  這個技藝如何傳承？這應該是第一部關心的紀錄片。」\n\n\n--\n\n\
  揭開台灣國寶級 Foley 大師的職人精神\n\n胡定一，被譽為「國片聲音魔法師」，是台灣資深影視人員，\n擔任到「中央電影公司」聲音部技術指導副理。\n\n\
  台灣早期至今，電影與音效產業都不成熟，音效師的培養極其困難，\n也沒有學校專門傳授音效相關專業，只能靠業界師徒制，讓這門技藝代代相傳。\n他年輕時因緣際會報名了中影招考，在\
  \ 800 人的競爭中脫穎而出、進入中影，\n從此開啟與電影的淵源，參與製作過上百部電視電影作品。\n\n\n縱使科技進步，電影、聲音製作數位化，\n但拍攝現場沒收乾淨的聲音，是無法用罐頭音效輕易了事的，\n\
  必須靠音效師的雙手一格一格的對著畫面環境，將聲音模擬還原成最自然的狀態。\n\n胡師傅擅長用細微的音效輔助觀眾進入電影情境，\n讓生活中不可或缺的娛樂之一：「電影」更貼近真實。\n\
  \n\n製作音效這條路，胡師傅已經走了 40 年，技術也走入新的時代。\n聲音製作是沒有既定方法與規則的，得靠個人平常觀察生活週遭環境，\n再逐步測試，一點一滴累積經驗，摸索出最好的製作方法。\n\
  \n全台灣幾乎只剩他用這種土法煉鋼的方式，做出屬於國片中的好聲音，\n如今換他成為電影中的主角，將自己的職業生涯說給更多人聽。\n\n\n--\n\n預告：\n\
  \n\n\n--\n\n心得：\n\n這部之前看了，覺得很感慨\n因為現在中影裡面都拆掉變成片場，只剩下外面的圍牆\n影片中的辦公室好像都消失了，片中拍到變成廢墟還有流浪狗狗\
  \ QQ\n\n然後片中介紹中國的影視園區，就好比好萊塢片廠，\n根本就是一個小都市，連專屬的飯店都有，\n裡面的製作音效廠更是大得不得了，甚至光配音就好幾間\n\
  台灣的小工作室根本不能比...\n\n\n這部片最大的優點是\n導演刻意讓有些片段的聲音與影像不同步，企圖讓聽覺感官放大\n剛開始看的時候會覺得這樣怪怪的，可是久了之後發現會很專心在聽聲音\n\
  \n好紀錄片請大家支持！\n\n--\n   \n   ◥\n  \n \n  \n￣￣￣￣\n\n--"
