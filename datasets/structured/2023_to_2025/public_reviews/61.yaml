title: '[新聞] 阿湯哥罕見出手！親辦特映會挺日片國寶'
content: '阿湯哥罕見出手！親辦特映會挺日片《國寶》盛讚：要在大銀幕看


  記者陳芊秀／綜合報導


  美國好萊塢巨星湯姆克魯斯（阿湯哥）於美國時間11日罕見現身一場特映會，他本人親自

  主辦一場日片《國寶》特別上映活動，原因是他近期看過並為其深深著迷，大讚「這是一

  定要在大銀幕上觀賞的極其特別的電影」。而奧斯卡最佳國際電影短名單將於本月16日揭

  曉，享譽全球的大明星特地在投票結束前夕辦特映會，格外受到關注。


  綜合日媒報導，湯姆克魯斯與演出《國寶》的渡邊謙曾合作電影《末代武士》，他收到渡

  邊謙一封信推薦，因此看了電影，並且深受感動。《國寶》代表日本報名2026奧斯卡，他

  更罕見地在奧斯卡入圍名單公布前，自願在洛杉磯舉辦特映會為其宣傳，吸引大批媒體前

  來。他在特映會與導演李相日同台，大讚導演「才華洋溢」，同時介紹該片「演員們花了

  數年時間準備這部作品，吸引觀眾進入優雅而強而有力的日本藝術世界」。


  據影評人Pete Hammond在外媒《Deadline》的撰文分析，《國寶》的目標是必須先入選奧

  斯卡最佳國際影片的15部短名單，才有機會進入最後5部提名作品。《國寶》的影像美感

  早在今年5月於坎城影展就展露無遺，預計2026年2月才會在北美正式上映，11月在紐約和

  洛杉磯的為期一週的放映，以符合奧斯卡參賽資格。儘管電影片長3小時令人生畏，導演

  李相日《國寶》將小說長達800頁的內容拍成長篇電影，卻不令人感覺冗長，且讓剛獲得

  終身成就獎、拍片時常挑戰極限的湯姆克魯斯深深感動，更主動為其做宣傳。


  而日媒報導指出，《國寶》雖然在日本國內大受歡迎，但在好萊塢的知名度仍不高。作為

  奧斯卡前哨戰之一的美國金球獎，《國寶》就未能獲得提名，16日發表的奧斯卡短名單勢

  必再度成為外界焦點。



  新聞網址：


  --'
