title: 'Re: [討論]《國寶銀行：小到可以進監獄》'
content: '銀行網站有寫


  9/21/2017

  大家可隨時在PBS網站上觀看《國寶銀行：小可入獄》


  真誠地感謝大家觀看 PBS/Frontline 在9/12播出的紀錄片《國寶銀行：小可入獄》

  (Abacus: Small Enough to Jail)。我們對大家給予的支持與團結一致感到無比的

  榮幸與感激。作爲一個少數族裔銀行，更加堅定了我們的使命，并將繼續致力於我

  們的理念! 現可隨時上網觀看電影。詳情請見



  有選項可開英文字幕


  法庭部分導演有說檢方和法院不給拍 所以只能用事後採訪和播放錄音的方式剪輯

  一些影評也說這部分畫面比較乾

  但是這家人的互動很精彩 除了媽媽和沒出鏡的外每個都律師


  B站中文字幕被刪 感覺可能不是版權問題

  而是青天白日滿地紅出現幾次的關係...


  --


  --'
