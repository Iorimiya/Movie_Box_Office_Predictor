title: '[好無雷] 《國寶》'
content: '好久沒進電影院了

  最近終於有機會可以重新踏進電影院

  第一部就是先補看國寶


  我真的沒想到會這麼好看

  看到我快哭了

  很難得看到日本電影是這麼內斂的情感

  卻又大鳴大放

  演員的表現真令人感到驚艷


  每個情節都環環相扣

  沒有一絲多餘的劇情

  就連隔壁的人在拍照

  我都沒有上前去阻止

  全稱毫無一處尿點

  太舒暢了


  接著準備看下一部


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
