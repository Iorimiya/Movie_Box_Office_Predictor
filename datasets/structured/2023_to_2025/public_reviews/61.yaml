url: https://www.ptt.cc/bbs/movie/M.1564405205.A.03B.html
title: '[新聞] 【王的文字】取景千年遺跡，稀世國寶入鏡'
content: '新聞網址：



  斥資百億韓圜製作預算，由宋康昊、朴海日、全美善等實力派演員領銜主演，並成為今年最具話題與爭議性的南韓新片《王的文字》，即將在本週五（8/2）於台灣震撼上映。本片24日在韓上映，首日不僅打敗好萊塢強片《獅子王》（The
  Lion

  King）空降票房冠軍，更勇奪首週新片票房冠軍！值得一提的是，為了追求畫面的真實性與視覺震撼，製作團隊更實際前往聯合國教科文組織所認定的世界文化遺產進行拍攝。從海印寺藏經板殿、浮石寺無量壽殿，到曲城泰安寺，再到安東鳳停寺，讓許多過去在電影與電視劇中看不到的歷史空間，甚至是記載表音文字秘密與佛祖真理的《八萬大藏經》，都首度透過大銀幕將這些「國寶」呈現觀眾眼前，也讓宋康昊讚嘆：「進入浮石寺時，我感受到了巨大的精神力量。」不僅如此，製作團隊更耗費約莫八個月時間，打造出2000多套服裝；光是宋康昊所穿的龍袍，為了展現其君

  王威嚴，就層層堆疊穿上多達19層。經過徹底考證並融入人物感情，完成專屬於本片角色的典雅造型！





  描述世宗大王創制韓文《訓民正音》的電影《王的文字》，上週三（7/24）在韓正式上映，首日不僅吸引超過15萬人次入場觀賞，並打敗《獅子王》空降票房冠軍，更勇奪首週新片票房冠軍。從24日至28日計算，共吸引超過75.5萬觀影人次，收穫超過63.3億韓圜票房（約新台幣1.66億元）。而根據南韓網路調查公司PMI以5000位20至50歲男女為對象，進行本週最想觀賞的電影調查，本片也以17.6%的支持率排名冠軍。事實上，本片除了吸引觀眾針對韓文起源進行熱烈討論，片中難得一見的王宮與寺廟建築，甚至是別具特色的服裝造型，都成為觀眾討論焦點。尤其本片上週也在

  台灣舉辦多場小型試映會，觀眾更是齊聲力推：「雅俗共賞，充滿戲劇張力的好片！」「想要了解韓國文化、歷史、政治、文字的觀眾必看！」「有在學習韓文，或是對韓文有興趣的人一定要看！」



  值得一提的是，為了追求畫面的真實性與視覺震撼，導演曹?鉉決定在有千年歷史的文化遺產中進行拍攝，也讓製作團隊耗費半年以上的時間，和文物廳打交道，從陝川的海印寺藏經板殿開始，一路拍攝到榮州的浮石寺無量壽殿、安東的鳳停寺，創下首度在聯合國教科文組織所認定世界文化遺產中拍電影的記錄。此外，就連景福宮、昌德宮、谷城泰安寺、順天松廣寺國師殿等歷史悠久且引以為傲的古老建築也躍然影上，為觀眾帶來無與倫比的觀賞體驗。尤其片中的《八萬大藏經》，在世宗大王與信眉和尚合力造字的過程當中，扮演著重要角色。劇組為了在完整保存《八萬大숊繪g》的海印寺藏經板殿進行拍攝，也耗費大量心力進行交涉，甚至到拍攝前一天都還沒能取得拍攝許可，讓心急如焚的製作公司簽了保證書，只讓助理導演、攝影導演、一位攝製組成員、兩位演員進入藏經板殿。拍攝過程更不得攜帶任何照明設備，只能利用太陽光拍攝，可說是歷經千辛萬苦，才讓觀眾得以在片中間接目睹到真正的《八萬大藏經》，以及歷史悠久且引以為傲的千年古蹟。這也讓宋康昊讚嘆：「進入浮石寺時，我感受到了巨大的精神力量。」朴海日也表示：「能進入海印寺拍攝，是人生中難得的經歷，這些文化遺產的空間，無遺是電影的第二個主角。」





  另一方面，《王的文字》導演曹?鉉最重視物品、服飾與人物之間的協調性，服裝造型也務求讓觀眾覺得自然不誇張。這讓服裝導演以傳統花紋與考證為基礎，耗費約莫八個月時間進行設計製作，從最高貴的龍袍，再到最卑賤的僧服，打造出兩千多套服裝。尤其由宋康昊飾演「世宗大王」最常穿的龍袍，更忠實考證過色彩與款式，並為了展現君王威嚴，讓宋康昊層層堆疊穿上多達19層服裝。而由朴海日飾演的「信眉和尚」，其僧服也都經過手染，並以手工縫製打造出不同的質感，就連朴海日與其他和尚演員，每天都幾乎要剃頭一次。而由全美善飾演的「昭憲王后」，不只要뀊t戴首飾，還必須戴上超過4公斤的假髻，展現出專屬於王后的特色。像這樣經過無數過程，兼顧考證與角色特質所完成的人物造型，也成為觀賞本片的另一樂趣。



  這部榮登南韓新片票房冠軍，由宋康昊、朴海日、全美善共同主演的宮廷鉅作《王的文字》，即將在本週五（8/2）於台灣震撼上映。本片劇情描述朝鮮時期，文字與知識遭到壟斷。世宗大王（宋康昊飾演）深感漢字對文化傳播的不便，迫切需要可以完整表達朝鮮語音的文字，所以他不顧所有大臣反對，為百姓創制《訓民正音》。偶然機會之下，位於國家最高尊位的他，因為賢內助昭憲王后（全美善飾演）的介紹，而認識了當時地位最卑賤的信眉和尚（朴海日飾演）。兩人聚精會神，以不屈信念開始創造韓文，揭開一段沒有被歷史記載的造字秘辛…。



  欲知本片最新消息，

  請上電影官方部落格

  與臉書粉絲團查詢。



  --'
