url: https://www.ptt.cc/bbs/movie/M.1761320632.A.BA2.html
title: '[好無雷] 國寶 '
content: '今年日本最具話題的真人電影<國寶>，終於在台灣上映了!!


  個人覺得最大看點就是1.華麗的歌舞伎舞台和表演，真的很美。

  ( 而且 )

  2. 演員(尤其吉澤亮和橫濱流星)的演技


  劇情方面有些地方有點跳or交代不清，但不影響觀影體驗。

  光是前述兩點就非常推薦進電影院專心觀賞，

  我相信串流完全無法帶來這樣的體驗。


  因為在電影院能全心投入欣賞，

  有些情緒比較滿的地方，看的時候甚至會覺得有點壓迫&讓人呼吸困難，

  代入感滿強的。


  啊然後片子很長快三小時，看之前記得上廁所&觀影過程不要攝取太多水分。





  --'
