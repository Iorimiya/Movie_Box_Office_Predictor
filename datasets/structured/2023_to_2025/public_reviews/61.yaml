title: '[新聞] 說唱藝術人間國寶楊秀卿辭世 享壽89歲'
content: '新聞網址：


  說唱藝術人間國寶楊秀卿辭世 享壽89歲

  〔記者凌美雪／台北報導〕


  曾在電影《血觀音》中串場演出說書人的人間國寶楊秀卿，於今（17）日凌晨辭世，享壽

  89歲。文化部表示，楊秀卿是重要傳統表演藝術「說唱」保存者，終身奉獻說唱（又稱唸

  歌仔）藝術的傳承與推廣，作育英才無數。文化部長李永得聞訊後深表哀悼，指示文化資

  產局全力協助家屬治喪事宜，並將呈請總統明令褒揚。


  楊秀卿藝師1934年出生，因戶口晚報兩年，因此實際年齡比法定年齡多出2歲。自幼因眼

  疾之故，為謀生而學習說唱表演，迄今逾70年。13歲時便與師姊蕭腰，展開到處走唱的歌

  仔先生涯；14歲時因右腳長膿瘡，造成殘疾而不良於行；23歲結婚生子之後，因大環境驟

  變影響走唱事業，便與夫婿楊再興改行跑江湖賣膏藥，並藉由改良的口白歌仔演唱方式，

  招徠許多顧客而行遍全台灣。直至1968年才定居，並展開接續20多年的廣播說唱，亦從此

  奠定在民間歌仔界的聲望。


  楊秀卿於1989年獲教育部民族藝術薪傳獎，2003年獲文化總會頒終身成就獎，2007年獲得

  第11屆國家文藝獎，2009年經文建會（今文化部）認定為重要傳統表演藝術「說唱」保存

  者（俗稱人間國寶），2021年獲頒第40屆行政院文化獎。


  ------


  老師 R.I.P.


  --'
