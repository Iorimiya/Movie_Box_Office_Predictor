title: '[好無雷] 國寶 '
content: '近三小時片長，體感卻覺得時間過很快


  沒有任何令人感到多餘的鏡頭


  當然如果本身對日本歌舞伎文化有些研究，應該能更沉浸於情節中


  然後在主角吉澤亮身上彷彿看到一些尊龍的影子


  特別要稱讚一下橫濱流星，後段定睛於他的場景表演非常好


  推薦這部片務必在大銀幕欣賞，裡面的場景和配樂不會讓你失望的


  題外話我這場的觀影品質蠻不錯的，算是很幸運


  如果周遭有干擾的話感覺會蠻容易分心



  --'
