url: https://www.ptt.cc/bbs/movie/M.1761802050.A.1B4.html
title: '[好雷] 日本-國寶'
content: '沒有看過小說，但因為身邊的朋友都大力推薦，


  所以就也來去看一下這部電影。


  看完後的直覺：好日本，好可怕的一部電影。


  以下劇情雷





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  一開始熱鬧的新年會、極道黑幫的火拚、長崎原爆病的設定、


  家族血脈與專業名號的繼承、


  師父對弟子/父親對兒子在專業方面的嚴酷訓練、


  以及最重要的，歌舞伎文化，


  這一切真的就是日本扶桑大和民族的印象。


  我自己特別在意的是兩位主角的出身血脈。


  喜久雄原是極道立花組的少主，


  但在電影一開始，他就等同是被滅門的遺孤了。


  之後他人生全部投入歌舞伎的世界，


  但他背後的刺青仍然彰顯著他來自極道家族。


  諷刺的是，


  他的父親不希望兒子有這刺青，


  母親也希望他金盆洗手遠離這世界，


  但他卻是在父親亡故無法阻止他後刺了上去。


  而這也成了後來讓他從歌舞伎生涯高峰跌落谷底的打擊之一。


  電影劇情一開始花井半二郎是在演出前拜會立花權五郎，


  顯見黑幫極道在地方的重要性，


  但從夫人，到一般社會普羅大眾是不太能接受的。


  另外電影裡雖然沒特別提，


  但是身上有刺青因而被認為是極道成員，泡溫泉大眾池時會有點麻煩，


  這又是讓我聯想到另一個"很日本"的意象。


  而對照的俊介/俊寶，


  名門之後的血統，讓他背負著巨大的期待，


  不只是家族，還有社會。


  讓他內心甚至痛恨但又割捨不了，


  喜久雄的覺悟和實力又讓他感到震撼驚懼，


  因而選擇了逃離，


  結果是連父喪都缺席了。


  而另一個諷刺的是，


  在人體健康中，糖尿病是家族病史中的重要項目，


  父親有這疾病，兒子高機率也會有，


  最後俊介也因為這伴隨血統的現實詛咒而殞命。


  兩人的血統宿命是互相對照，


  也有衝突，


  但也因為兩人本性善良，也真的將對方視為兄弟，


  所以最後仍能和解，並互相托付、搭檔演出。


  只是，俊介/俊寶保留了較多的人性和世間羈絆，


  喜久雄則是幾乎將一切都捨棄了。


  俊寶說想要演出阿初，並不是要和喜久雄較量，


  而是要演出只有他能詮釋的阿初，


  這也是他對自己這位兄弟，還有自己與家族的志業想講出的一切。


  這就牽涉到電影的另一個重要核心：歌舞伎文化。


  一般來說，在製作人偶/模型/公仔時，


  都是力求要能呈現接近真人的神韻；


  但日本歌舞伎演員，那刻意塗白的肌膚，


  長時間無表情，刻意的肢體頓點與不自然的姿勢動作，


  卻像是把人的神韻氣質給完全去除，


  把真人變成無機物人偶，非人的怪物，


  把原本屬於自身的多餘人性和情感都去除掉！


  只剩下角色要呈現的情感，在舞台上爆發！


  當小野川先生在後台仔細端詳喜久雄的臉龐時，


  那宛如無機物人偶的樣子真的讓我覺得好恐怖！


  而當他在台上演出鷺娘時，


  兩位主角都說了，怪物！


  而兩位主角最後的合演，


  俊介說那只有他能詮釋的阿初，


  是因為他選擇呈現在舞台上的情感，


  也是屬於他自身的一部分，而不只是阿初這個角色；


  而拋棄一切的喜久雄，


  當下的一切大概也是他為了兄弟所展現最後的人性。


  但兩個人當下都成了瘋子！


  那演出到最後，


  我還真的會怕那把刀子是真的，


  然後德次郎就要在舞台上真的殺了阿初！


  真實的死亡來成就最完美的演出！


  (這又是一個日本狂熱藝術家好像真的就會這樣幹的印象)


  人間囯宝


  人間在日語的意思是人類，


  但人間囯宝還是人類嗎？


  回頭來說，為了技藝而奉獻一切，除了這項技藝以外什麼都沒有了。


  現實而言也沒有其他能謀生賺錢的能力了。


  落魄到極點，沒能選擇，只要有舞台就上！


  即使台下觀眾根本沒在看、不在乎。


  但這對演出藝術家而言卻是最殘酷的。


  我腦中一直想到Mr. Children的經典歌曲MV，くるみ。




  熱血的大叔們組成Mr. Adult，四處演出，


  即使台下觀眾其實沒認真在聽，他們仍是盡全力的演出！


  就算最後要回歸現實，至少他們熱血努力過了。


  但這群熱血大叔們回歸現實還是能繼續過活，


  而喜久雄什麼都沒有！


  最殘忍的，就是他必須把他熱愛的歌舞伎專業丟進現實世界裡去被糟蹋。


  我自己常對朋友說，對於你真心喜愛的事物，最好不要拿來當成工作事業。


  如果真的要這樣，那就要覺悟，


  你的熱情、熱愛，會被現實折磨撞爛糟蹋到難以想像的程度，


  你必須要能承受！


  而喜久雄堅持過去了，即使又一位女孩子因此離開了他。


  所以小野川先生又給了他一次機會，


  最後他成為另一位人間囯宝，看著只有他能看懂、看到的風景。


  我看完後真的覺得，好日本，好可怕的一部電影。



  另外雜感補充：


  俊介在訪談時說自己也曾經不甘、困惑的問自己為什麼生於歌舞伎之家，


  為什麼要背負這個傳承壓力？


  我腦中就浮現風之谷漫畫中娜烏西卡孤獨的坐著，只有迪多來陪她，


  娜烏西卡難過的想著自己為何生於族長之家。


  當然這個人生困境在其他作品和真實世界也非常多，


  但當下真的就是連想到這個；


  而喜久雄和彰子的床戲，


  則是讓我聯想到烙印勇士當中葛利菲斯與王國公主的段落。


  然後我們台灣的歌仔戲通常由女性扮演小生男主角；


  日本歌舞伎則限定由男性來演出，女形成為特別存在，


  這也是一個有趣的對照吧。




  --







  --

  對他而言恐怕不算拋棄，而是他從來沒有在乎過。


  他只要成為日本第一的歌舞伎，其他的一切都不需要。

  在看到喜久雄那演出時，他們應該都感覺到喜久雄已經和他們是不同世界的存在了；


  俊介當下承受不了這打擊而離開，


  春江應該只是第一時間要去關心他，但應該也隱約感覺自己已經無法待在喜久雄身邊，


  所以就一起離開了。'
