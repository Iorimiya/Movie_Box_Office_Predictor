title: '[好雷] 戲台'
content: "戲台\n\n編導:陳佩斯\n主演:黃渤 姜武\n     尹正 余少群 陈佩斯\n\n大清亡國後，北京被軍閥割據\n各路軍閥背後都有歐美來撐腰\n\
  可能八國聯軍之後食髓知味\n\n姜武演大帥打進北京當皇帝\n黃渤演鄉下進京打工的戲迷\n跟姜武剛好是河北小同鄉\n\n導演陳佩斯演戲斑斑主\n請來大明星演霸王別姬\n\
  戲院老闆等著滿座發財\n\n尹正演霸王 余少群演虞姬\n余少群曾演過陳凱歌的梅蘭芳\n這天戲院準備靠霸王別姬發財\n當地的黑道老大馬上包場\n\n有點像以前的豬哥亮餐廳秀\n\
  下面都是黑道角頭老大土豪\n請來作秀的都是超級大明星\n\n大帥姜武打進北京後\n想去戲院看戲也指名要包場\n戲院老闆就尷尬了都不敢得罪\n結果大帥跟老大兩個一碰面\n\
  老帥就一槍送老大歸西\n\n大帥說以後他作主\n讓百姓能安居樂業\n幫大家除掉這些地痞流氓\n然後戲院就被大帥包下了\n角頭再狠也怕軍閥\n槍桿子出政權\n\n\
  不料尹正演的金老闆受情傷\n又陷入鴉片的毒癮一蹶不振\n跟今天的偶像明星一模一樣\n所以霸王不能唱戲就完蛋了\n\n還好黃渤來救駕\n黃渤是熊貓外賣仔\n送包子去戲院碰到姜武\n\
  兩人是同鄉所以一見如故\n\n黃渤在北京生活多年\n是個戲迷，台詞都熟\n唱起來也是有模有樣\n因為不知道姜武是大帥\n所以把他當同鄉就唱開了\n\n姜武一開心就指名要他演霸王\n\
  戲班主跟戲院老闆就放心了\n沒想到有送外賣的來神救援\n馬上讓他飛上枝頭變鳳凰\n跟黃渤的星路一樣爆紅\n\n黃渤也是從山東青島來北京\n他演的是河北鄉下來北京\n\
  都是靠演到一齣好戲爆紅\n戲裡戲外都一路星運亨通\n\n戲班馬上幫黃渤畫臉演霸王\n但余少群演的虞姬就不爽了\n因為要跟不專業的演員對戲\n就好像找林志玲配黃渤一樣\n\
  余少群一跟黃渤對戲就想吐\n\n但戲班主說你不演大家都死\n他只能肝腸寸斷哭著上去演\n黃渤他的台詞還唱錯更尷尬\n但只有他們內行人才聽得懂\n\n這期間大帥的情婦是個名妓\n\
  也是尹正金老闆的鐵粉\n就偷偷跑去找金老闆\n金老闆看到美女就情傷痊癒\n馬上翻雲覆雨一番忘掉舊愛\n瞬間恢復元氣準備上台演戲\n\n結果看到霸王已經在台上\n\
  才知道現在情況特殊\n\n黃渤下了戲碰到大帥情婦\n看臉譜以為黃渤是金老闆\n就再次上床翻雲覆雨\n\n金老闆這時趁機畫臉上台\n台下還演到把戲班都唬住\n大家都以為他還是黃渤\n\
  還講黃渤的河北鄉音\n\n當黃渤正趕來登台時\n尹正說金老闆來了快攔住他\n大家就把黃渤攔住綁起來\n尹正一上台，黃渤表明身分\n大家才知道台上的是金老闆\n\n\
  果然情婦虞姬跟戲班主一聽\n就知道是真正的霸王上台了\n連大帥要霸王改台詞都不改\n大帥改劇本希望霸王不要死\n因為霸王死了觸他打仗楣頭\n如果敢不改就通通槍斃\n\
  \n結果金老闆寧死不改\n大帥還是聽得出來沒改\n馬上準備大開殺戒\n但兩位明星還是繼續唱\n正要開槍時天花板被開砲\n\n又有其他的軍閥攻進來\n姜武就被藍大帥打跑了\n\
  台下還剩下幾個老戲迷\n在硝煙中把戲給唱完了\n這片將是尹正的代表作\n演的唱的真的是太棒了\n\n戲班主在話台詞中說\n演員就應該唱死在戲台上\n就一起唱完最後一齣好戲\n\
  \n大帥換人後，黃渤繼續送外賣\n跟客人閒話家常說大帥好男色\n沒多就余少群唱完就去跳河了\n跟張國榮在霸王別姬演虞姬\n結果被戲班主葛優強暴一樣\n\n演了虞姬好像都會自殺\n\
  但願余少群能長命百歲\n人生如戲 戲夢人生\n\n\n跟賴聲川王偉忠的\n【寶島一村】一樣\n這真是一齣好戲啊\n這部電影拍得真好\n\n但願我們寶島一村\n\
  未來也能拍成電影\n像暗戀桃花源一樣\n\n\n原版話劇\n\n\n--"
