url: https://www.ptt.cc/bbs/movie/M.1525704369.A.30F.html
title: '[新聞] 曾獲金馬女配大馬國寶女星黎明姨90歲病逝'
content: '新聞網址：



  馬來西亞國寶級女星黎明（黎明姨）今以90歲高齡病逝，她日前因腎功能衰竭導致水腫入

  院治療，最後不敵病魔撒手人寰，原名黎桂潤的她又被稱為黎明姨，演藝生涯遍及廣播、

  電視、電影與廣告。


  黎明姨是繼楊紫瓊之後，第二位獲封為拿督的馬來西亞華裔藝人，曾表示要「活到老，演

  到老」，2008年在電影《錢不夠用2》飾演失智老人，精湛演技獲第45屆金馬獎最佳女配

  角，《錢2》在台中萬代福戲院放映至今超過8年，該片導演梁志強今年也重返台中，拍攝

  安心亞、是元介、納豆等主演的《殺手不笨》，沒想到電影才殺青不久，就接到這個噩耗

  ，他在臉書痛心表示：「非常非常非常的難過。」


  梁志強指出，11年前與黎明姨合作《錢2》對她演技及敬業態度相當激賞與感動。他也說

  雖然本身是新加坡人，但「從小看黎明姨長大」，感念她對星馬戲劇的貢獻，祝她一路好

  走。（郭妤、楊絲貽／綜合報導）


  --------------------------------------------------------------------

  滿難過的，

  希望黎明阿媽一路好走～


  --'
