url: https://www.ptt.cc/bbs/movie/M.1537967979.A.7EA.html
title: '[新聞] 國寶演員【一週斃命】靠電流急急棒治手抖'
content: '新聞網址：



  幽默喜劇電影《一週斃命：不死退費》（Dead in a Week: Or Your Money Back），即將在10月12日於台灣歡樂獻映。劇組找來兩度入圍奧斯卡金像獎「最佳男配角獎」、並榮獲金球獎「最佳男配角獎」的英國國寶級演員湯姆威金森（Tom

  Wilkinson），來飾演年事已高、手又發抖，完全顛覆傳統殺手形象的「老番顛殺手」。威金森在片中大展冷面笑匠實力，不僅使出各式讓人噴飯的殺人技巧，更為了重拾往日「神槍俠」雄風而大出奇招，狂練「電流急急棒」治療手抖問題！幽默劇情與堅強卡司，讓本片陸續在英國愛丁堡影展、愛爾蘭哥爾威影展、德國柏林奇幻影展上大放異彩，就連威金森本人都滿意大讚：「這是一部精緻又有深度的喜劇，因為劇本有趣、驚奇且創新，否則我是不會接演的！」





  《一週斃命：不死退費》劇情描述一位65歲的殺手，雖然年事已高、手又很抖，但非常熱愛自己的工作。無奈殺手公會的新老闆，卻要求旗下殺手必須達到一定工作量，才能保住自己的會員資格。不想被迫退休的他，於是開發全新目標客群──專殺想自殺的人！並且保證一週斃命，不然全額退費…。鬼才導演湯姆艾德蒙斯（Tom

  Edmunds）在訪問中直率表示，他光是邀到湯姆威金森接演殺手一角，這部電影就已經成功了一大半。他欣喜說道：「湯姆威金森是當代影壇的頂尖演員！現在他成為我第一部電影的男主角！我簡直興奮極了！他非常適合這個角色，並透過他出神入化的演技，為這部電影注入深度與廣度！」



  不過拍電影向來看天吃飯，本片拍攝期間，竟然慘遇挾帶每小時94英里的強烈「多麗思暴風」（Storm Doris）。這場風災在英國直接導致三人死亡、一人重傷、一架飛機失事迫降。不過神奇的是，本片劇組竟然奇蹟似地在風災中完成拍攝，過程如有神助。導演也對此回憶：「我們總共在倫敦拍攝五個星期，卻遭遇超強的『多麗思暴風』。附近所有的拍攝劇組都停拍了，但因為我們的行程實在非常緊，只好硬著頭皮在狂風中繼續拍攝，沒想到卻順利拍到許多很棒的畫面！」





  值得一提的是，除了金獎級男主角湯姆威金森，《一週斃命：不死退費》也找來另一位國寶級電影大師助陣，就是英國剪輯大師塔瑞安沃（Tariq Anwar）。他曾以《王者之聲：宣戰時刻》（The
  King''s Speech）、《美國心玫瑰情》（American

  Beauty）兩度入圍奧斯卡金像獎，並以《美國心玫瑰情》勇奪英國奧斯卡最佳剪輯獎。他化腐朽為神奇的剪輯功力，在國際影壇備受尊崇。對此，導演再度狂喜表示：「我真不敢相信，能夠請到塔瑞安沃這樣的大師級人物，我的心情就是中大獎了！」不過他也頑皮地爆了國寶級剪接師的料：「我們合作非常愉快，雖然他有個工作習慣，就是非常不歡迎導演進他的剪接室。」



  這部並非「找死電影」，而是「尋找幸福求生喜劇」的《一週斃命：不死退費》，即將在10月12日於台灣歡樂上映。本片劇情描述27歲青年作家威廉（艾紐林巴納德飾演）實在活得不耐煩，一心一意想要自我了斷，但舉凡上吊、仰藥、電擊…，自殺多次都死不成，讓厭世的他開始懷疑自己難道有「不死之身」？！萬念俱灰之下，他用僅剩的財產，雇用一位65歲、老到手還會發抖的「職業殺手」（湯姆威爾金森飾演）來賞他一個痛快。兩人於是立下契約，如果一週內殺不死他，就必須全額退費。不料此時，威廉竟然交到女朋友（⊙
  .

  ⊙）！讓不再厭世的他，開始對人生有了眷戀，打算跟老殺手毀約，雙方展開一段驚險又兩光的保命攻防戰…。



  欲知本片最新消息，

  請上電影官方部落格

  與臉書粉絲團查詢。


  --'
