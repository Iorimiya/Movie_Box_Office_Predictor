title: '[好雷] 國寶'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  一開始看到電影介紹片的時候 腦中瞬間帶入就是經典的霸王別姬


  但是調性不太一樣  國寶講述的是歌舞的美


  霸王多了點瘋魔的過程


  唯一一點看不懂的是為什麼春江會跟俊寶一對


  明明前面都沒有任何端倪


  只有看到喜久雄求婚的時候她沒有接受


  還有俊寶跑去她家門口她有邀他進去這部分 推敲出來她們有關係


  只是這關係怎麼來的沒有頭緒  難道只是愛慕嫡子虛榮?


  還是只有書才有這部份?








  --'
