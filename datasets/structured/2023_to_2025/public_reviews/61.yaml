url: https://www.ptt.cc/bbs/movie/M.1530213484.A.3E2.html
title: 'Re: [新聞] 史豔文50周年登上大銀幕 國寶黃俊雄父子'
content: "其實金光要做電影 除了幫黃老圓夢 另一部分的根本原因 恐怕還是在試圖拓展\n金光這個品牌\n\n霹靂的名聲太大 即便不看布袋戲 也知道霹靂布袋戲的存在\
  \ 甚至\n一看到布袋戲 就認為是霹靂 這對其它在偶劇圈奮鬥的品牌其實很不利\n\n因為再怎麼努力 似乎圈外的知名度 還是都被霹靂吃掉\n\n不同於霹靂不斷在戲偶上精進\
  \ 金光其實比較強化的是戲偶的操作\n比如\n即便布景並不精緻 但那個仁刀的味道卻不由得令人感動\n\n又或者溫皇對上藏鏡人 \n並不是正面對決 但是刀掌之間變異橫生\
  \ 也不由得令人心跳加速\n\n事實上金光一直在嘗試新的事物\n像是會乳搖的戲偶\n\n\n無聲的意境戲\n\n\n香港武俠片的拍攝手法\n\n\n現在也有突破傳統\
  \ 增加配音員的計畫 但是這些的努力 似乎仍不足以將餅作大\n很多人 依然覺得布袋戲不入流 又或者看到金光的戲 或者其它神魔等劇團的努力\n全都歸為霹靂的功勞\n\
  \n我想 投入大螢幕 真的可能是賭一把 想突破這個現狀了吧\n現在的問題 應該是要以父母親認知的早期史豔文藏鏡人黑白郎君的劇本去做\n還是要以重開機世界觀丕變的新觀眾群為目標\n\
  \n金光的劇本除了幾檔較陳悶外 大部分其實都蠻精彩的 但因為劇本連貫 要從中\n抽取一部分來演 似乎也不那麼容易 但總歸還是希望不看布袋戲的觀眾能嘗試看看\n\
  台灣少數本土IP的傳統文化 因為其實台灣的偶戲 真的可以說是世界第一的\n\n--\n\n\n\n這是上禮拜的 本來是怕爆雷 盡量挑無雷片段的說"
