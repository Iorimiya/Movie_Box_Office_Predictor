url: https://www.ptt.cc/bbs/movie/M.1507644235.A.5A3.html
title: '[新聞] 法國寶級演員尚羅契夫辭世 享壽87歲'
content: '新聞網址：



  （中央社巴黎9日綜合外電報導）


  法國演員尚羅契夫（Jean Rochefort）的女兒今天告訴法新社，父親已與世長辭，享

  壽87歲。尚羅契夫曾在好萊塢史上命運最多舛的電影之一擔綱要角。


  法新社報導，尚羅契夫是法國影壇大咖超過半世紀，參與演出喜劇、賣座強檔和藝術

  電影。


  尚羅契夫曾抱走3座素有法國奧斯卡之稱的凱薩獎（Cesars）；他憑著法國導演貝特

  杭塔維涅（Bertrand Tavernier）1975年的電影Let Joy Reign Supreme捧回第一座

  凱薩獎，3年後又以「蟹鼓」（Le Crabe-Tambour）拿下第2座獎，1999年則獲頒終

  身成就獎。


  以機智和幽默自嘲聞名的尚羅契夫開玩笑說，「我是（法國）國家遺產的一部分。

  法國有拜雍生火腿（Bayonne ham）、菲利普諾雷（Philippe Noiret）、尚皮爾

  馬利耶（Jean Pierre Marielle）和我」；他指的是另外兩位知名老演員。


  尚羅契夫的作品包括「百劫紅顏」（Angelique）、「鐵面人」（Le Masque de Fer）

  和「諜海奇男子」（Le grand blond avec une chaussure noir，The Tall Blond

  Man with One Black Shoe）等。


  鬼才導演泰利吉蘭（Terry Gilliam）夢想把塞萬提斯（Cervantes）知名小說「唐吉

  訶德」（Don Quixote）搬上大銀幕，1998年請來尚羅契夫飾演主角。


  這個電影史上運氣最背的劇組開拍第一天，男主角尚羅契夫就因前列腺感染，一上馬

  就感到疼痛。


  第2天佈景被暴洪淹沒，第4天尚羅契夫必須搭機就醫，為雙側腹股溝疝氣動手術。


  泰利吉蘭在20年間失敗7次後，亞馬遜（Amazon）去年終於同意資助這部電影，「誰

  殺了唐吉訶德」（The Man Who Killed Don Quixote，暫譯）將於明年上映。


  （譯者：中央社劉文瑜）


  ------------------------------------------------------------------------------


  參考外電:Variety

  Jean Rochefort Dies: French Actor Was Famously to Appear in ‘Don Quixote’



  心得︰Rest In Peace，也感謝他對電影的貢獻


  順道一提，取代羅契夫飾演吉蘭版唐吉訶德的演員

  是曾經主演007之明日帝國、阿根廷別為我哭泣，

  近期也因參演熱門影集權力遊戲受到注目的Jonathan Pryce，

  這部電影加入演出的其他重要演員還包括亞當崔佛、歐佳柯瑞蘭蔻

  與瑞典國寶級演員史提蘭史柯斯加


  --'
