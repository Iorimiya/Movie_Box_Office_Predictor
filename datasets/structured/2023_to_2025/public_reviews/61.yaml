title: '[負雷] 國寶'
content: '雷文防雷資訊頁


  這部片在觀看前是讓我相當期待的，我期待能看到日本版的霸王別姬，將歌舞伎的


  美與技藝結合在主角的人生經驗與時代上，將劇情的"國寶"二字發揮至極。


  然而觀影後的感覺十分複雜，我並未看過小說單純以觀看電影的內容來評價，


  如果滿分是十分的話，我只能勉強給6分，因為劇情真的很差勁，這6分還是因為


  攝影真的很完美，將歌舞伎的技藝淋漓盡致的表達出來。


  一句話總結就是支線任務太多但是沒有一條支線解完，主線任務也突然就結束了。



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  整部電影的主軸圍繞主角(喜久雄)對歌舞伎"技藝"的成長與其人生歷練的過程，最終


  踏上人間國寶的崇高境界，作為最頂端的技藝演員，他的人生背負了血緣、友情、親


  情與愛情的人生缺憾，但是這是主角對於這個領域的犧牲，他願意背負一切只為了歌


  舞伎的演出。



  "技藝"的重要性是整部戲一再強調的重點，有好的技藝才能戰勝血脈的缺點、有技藝


  才能讓你在這個歌舞伎存活下去。然而劇中並未體現好的技藝有多重要，因為掌聲是


  廉價的、不好的技藝在電影中也沒有懲罰，反而我們看到的都是"門票售罄"的字樣，


  這點出現在花井半彌重出江湖後的戲段中，甚至好的技藝者(喜久雄)並未從中獲得更


  多機會。



  因此這部電影呈現了一個離奇現象:技藝的好壞在這個業界是沒有影響的。


  作為一個文化技藝我想這樣的觀點是一個很大的冒犯，但是劇中呈現就是如此，如果


  喜久雄演出的[曾根崎心中]是因為其卓越超群的技藝才能獲得的機會，那影片後段


  半彌演出的同樣戲碼也照樣收穫成功並一樣是門票售罄，並未出現所謂技藝門檻與


  批評。反倒是因為技藝登上頂峰的喜久雄，在接掌的八年內只能當龍套演出也沒有


  出演大作的機會，換言之這個歌舞伎業界只是個看血統吃飯的行業，那又遑論技藝的


  優劣能帶來多少讚聲? 甚至喜久雄為了機會不惜與彰子發生關係，都在在證明技藝是


  最不重要的元素，血統與父親的影響力最大。如果是這樣的因果那成為人間國寶的


  說服力就大大降低，更多的是投機與運氣的作用。影片中也是如此，半彌跟父親都得


  糖尿病才讓喜久雄有更多機會登台，但是半彌作為繼承者依然能夠演出任何主角並未


  有任何行業內的限制與批評。



  這是主軸的評論，再來是這部電影想要呈現很多的支線劇情:


  1.花井半二郎說的要為父報仇(第一次報仇不成功，後續殺父仇人也沒交代)


  2.藤駒與綾故事線(女兒開心地追爸爸，再下一個鏡頭就是多年後對爸爸的控訴?)


  3.萬菊的箴言:總有一天，你會被這張漂亮臉蛋害了(沒看到後續有劇情呼應的)


  4.黑道血緣故事線(身為黑道組織的繼承人 曝光後完全沒黑道找上門?)


  5.與彰子的故事線(與大老的女兒私奔 導致業界的封殺 後來也沒交代解決方案)


  6.與竹野的矛盾化解支線(一開始就講血緣至上，突然就化解矛盾了?)


  7.春江與花井半彌的私奔線。(聽版上解析說春江只想找有前途的飯票，但是以私奔時


  間點來說，剛好就是喜久雄的人生巔峰，要說看不到未來說不過去)


  每一個看似都是很有料的內容線但是都沒有足夠的畫面去講述這些故事，


  我看得出編劇想要影射歌舞伎的頂尖演員必需犧牲親情、友情、愛情的羈絆才能成為


  人間國寶，然而劇中技藝的好壞並沒有被凸顯，一個逃離八年的半彌能夠馬上回家接演


  歌舞伎甚至讓萬菊直接指導，讓這個業界顯得膚淺且隨便。



  我認為這些支線都沒有讓主軸的"技藝"被襯托，更多的拖累與中斷情緒，我看到主角


  繼承第三代名聲時我很希望看到主角發揮他的影響力證明自身的"技藝"價值，而後續的


  故事就是重傷與黑函還有半彌回歸的戲碼。


  劇情雜亂、敘事極差、人物關係交代淺薄這些是缺點，演員的演技傳神、攝影到位、服


  裝與場景考究這些是優點，那這部戲做錯了甚麼?



  對比另一部神作"霸王別姬"也許能找到答案，就是故事的主軸必須要合理地跟技藝的載


  體結合而非分離，一個同樣是男生演女形的腳色，內涵可以被時代與人物關係加深進而


  反饋到角色的心境與轉變上，這就是腳色的成長。腳色從技藝進化到心境的成長最後成


  為技藝的頂尖角色，那個不一樣的理由是個人的心智磨練與對"女性"角色的理解。


  反而這部戲中的女性沒有甚麼發揮空間，喜久雄也並未是雙性認同者，如何從男性角度


  增進對女性角色的理解，進而成為女形國寶演員?這些應該由支線交給我們的事完全沒解


  釋。十分可惜的電影，因為這樣的題材與製作規模都應該是時代大作的等級。



  --'
