title: '[有雷] 淺論《芬蘭湯姆》，從罪犯到國寶'
content: '圖文版本請於連結：


  制服癖的情欲？影響美國同志最多的同志插畫家

  最近隨著《芬蘭湯姆》的電影在台上映，讓這位亞洲世界不是很熟悉，但又的的確確影響

  關於同志情色漫畫的大手級歐洲插畫家，芬蘭湯姆，重新再開始掀起一段藝術與情色的討

  論。在這位藝術家的手繪同性愛藝術作品，不只表達情慾，更影響二十世紀晚期同性戀和

  時尚潮流文化，甚至也是對於當時美國年輕世代皮革、制服、現代皮繩性虐慾...等文化

  ，有著不可抹滅的影響的地位。在當時的年代芬蘭同性戀行為是犯法的，而讓這些作品流

  於美國市場和世界其他舞台，近年來除了傳記電影《芬蘭湯姆》外，最接近一次探討這位

  插畫家的應該是芬蘭紀錄片《父親和健壯軍人》回顧與訪談這位已故的一代經典作家。










  當時被鄙視的同性情慾插畫作品，到今芬蘭湯姆以成舉世皆知的芬蘭國寶級插畫家。這中

  間當芬蘭有段長時間，法律不容許同性戀的生存，甚至認為是邪惡與低俗，但如今芬蘭推

  動同性婚姻法於二零一七年三月生效，甚至允許同性伴侶領養小孩，給予實質的特權。時

  代的轉變與了解，也是芬蘭湯姆為何會從階下囚轉的情色小報，成為芬蘭國寶的原因。但

  是如從整體看來卻格外諷刺，享譽的作者「芬蘭湯姆」到去世時，都無法看見芬蘭同志改

  革的一面。


  芬蘭湯姆的作者，本名為托科‧拉克索寧，在年輕的時候就了解自己的同性傾向，在當時

  勞動與蘇聯的冬季戰爭參軍的時期，奠定他日後繪畫人物，都以他年輕時接觸的肌肉強壯

  勞動者、軍人和警察制服形象為整體基調。而在紀錄片《父親和健壯軍人》中，湯姆表態

  過自我對於制服男性崇拜，很大的原因可能在於當時的軍旅生涯，在退伍後的創作，除了

  性慾外，也投入許多關於湯姆對軍中生活的回顧和美好憧憬的一面，甚至可以說他自身應

  該懷念人生那段從軍生涯。










  如果以芬蘭湯姆的創作讓人有著最大印象，除了軍人外，大概就是警察形象和皮革性虐的

  人物描繪，還有他讓龐大性器官描繪。以電影《芬蘭湯姆》中描述，關於芬蘭湯姆對警察

  形象，和略為淫虐的描繪，可能有幾種可能的推斷：一是可能跟軍警文化的服從和階級制

  度有關，在制度下的命令和服從文化中，可以略看到一種虐與施，這有可能是湯姆在軍警

  屁號下的情慾描寫，而另一點則是當時他試圖轉換警察施虐於同志的思維，讓自我的心理

  進行調適。


  原則上雖然軍警文化服從和階級制度的影響，比較有可能影響湯姆作品上的風格，但電影

  《芬蘭湯姆》則採用後者，以一種時代對於同志的迫害，讓這位插畫家必須在退伍軍人症

  和性相認同之間，找到發洩性欲出入。說是不合邏輯但也合情理。軍人與警察，甚至水手

  和牛仔等，可以看出湯姆對於只有男性職業中自我的陽具崇拜，在性器和體格過度誇大的

  漫畫描繪可以看見一二，也是突顯男性象徵的慾望與情慾崇尚之流，這點在今也有許多畫

  家用著類似的手法詮釋作品。










  關於湯姆筆下人物的皮革文化，則是一種軍服癖好的衍生下的產物。其在時尚與插畫中反

  覆出現的黑色皮夾克，出於德國軍服，在當時德軍看中皮革的面料防風強韌、並且能禦寒

  保暖，做成飛行員的皮夾克，成為飛行員標幟。而湯姆為何對這黑皮革夾克情有獨鍾，主

  要因他於芬蘭部隊受任為防空部隊的連長一職，也奠定空軍皮夾克在他心中的地位，並未

  脫離他的軍服愛好，這也使他畫作德國納粹軍人的色欲圖像時，是否「親納粹」有所爭議

  。


  而有皮革憧憬愛好不只有芬蘭湯姆一人，二戰之後美國軍方也感受到關於黑色皮夾克的魅

  力，將它作為美國警察制服使用，強調警察正氣和威嚴，但有趣的是因為當年警察退役之

  後仍然以自身黑夾克為榮，而主成以重機和皮夾客的機車族次文化。但因為酒後鬧事的事

  件頻傳，加上如同當年娛樂電影的《飛車黨》等叛逆青春電影，選用黑皮革為角色增添性

  格，而讓黑皮革夾克在美國留下陽剛男性、叛逆青春的深刻印象，當然陽剛職業與符碼也

  激起美國同志族群的喜愛。










  故，芬蘭湯姆的插畫打進美國市場，能那麼快造成轟動，其一點也是因為美國自我本身對

  於皮革的崇拜和陽剛氣直，剛好與芬蘭湯姆的軍癖好相符合。黑皮革夾克軍服的性慾和帶

  有微微階級性虐服從，軍人、警察男子，碰巧合了美國眾多當代青少年同志的愛好，也觸

  動他們一直以來的皮革與陽剛憧憬。在當時黑皮革夾克與貼身軍警皮褲就是種男性魅力的

  性感象徵，就連當時黑白分道的黑人文化，也受到這點影響，延伸為黑人運動激進力量的

  街頭示威文化。


  電影中《芬蘭湯姆》雖然是以托科‧拉克索寧退役後的創作生涯開始描寫，但很顯然的想

  將他塑造成一位因為當時同性戀困境而被歧視與打壓的藝術者，和性壓抑的困境。甚至較

  多時間描繪關於他與家人之間；和情人間的三角關係，對於在美國一炮而紅和愛滋肆虐被

  打上汙名反而沒有過多的描繪之處，這地方有點可惜。但在與軍中的同性戀長官的分歧，

  倒是可以看出主角對於自身的「性向認同」完全不同意同性戀疾病化，也對於近代同性戀

  除病化有所呼應。










  而有趣的是《芬蘭湯姆》中對於湯姆的作品講解甚少，甚至對於情慾的敘述更是沒有太多

  的描繪之處，會讓原本對插畫家就不太熟悉的人，更不明白關於湯姆在畫作中的情慾投射

  ，或是為合對軍服和皮革的堅持。《芬蘭湯姆》的情慾插畫或多或少影響了同性戀者對於

  自我本身的看法，讓他們從給人陰柔的形象轉化成陽剛男性與熊族、肌肉男。在時尚和次

  文化中搖滾樂壇、服裝設計，也都對於皮革的印象有所改變，它變成一種奔放、叛逆、陽

  剛之下又性感的象徵。


  許多後續的同志插畫家和漫畫家也都受到「芬蘭湯姆」筆下風格和人物的影響。例如：當

  代東方最具代表性的同志情慾性虐的漫畫作家田龜源五郎，筆下性虐的軍警人物，許多都

  可以看見芬蘭湯姆的風格和軌跡。而以寫實和日式男兒為主題的兒雷也筆下的人物造型，

  雖然少了皮革而換上現代服飾和日本民俗服裝，但依舊可以看見芬蘭湯姆過往筆下人物的

  身影。緊身服飾的遐想，雖並非皮革和軍警，但芬蘭湯姆畫作中那種「緊身顯露肌肉的性

  感」可說影響當代部分審美觀感。










  簡而言之，電影《芬蘭湯姆》著重在湯姆的情感方面的成現，和對於過去同性戀的迫害和

  打壓，大社會下的困境。而忽略了關於芬蘭湯姆最核心的重點皮革軍癖的來由。雖然可以

  從電影開場的軍旅生活的場景猜測出一二，但是對於皮革的愛戀顯得相當隱晦。不過諷刺

  當年芬蘭政府倒是不管怎麼拍都成立，誰知當年人人喊打的罪犯，至今建立了芬蘭湯姆公

  司、拿回過往畫作的版權，成為皮革服飾和時尚的一環，現今成為非盈利基金會。


  在二零一四年芬蘭郵政發行了以「芬蘭湯姆」為主題的全球通用郵票，當時預售就有來至

  全球近一百八時個國家下訂購買，成為芬蘭郵政發行最為暢銷的郵票，至今在該國，無人

  超越。紐約現代藝術博物館，也有芬蘭湯姆部分畫作原稿作品，將視為館內永久典藏品。


  --'
