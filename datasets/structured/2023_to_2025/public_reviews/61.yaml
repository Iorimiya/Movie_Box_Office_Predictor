url: https://www.ptt.cc/bbs/movie/M.1712763169.A.FCF.html
title: '[新聞] 國寶畫師顏振發 獲北影貢獻獎'
content: '台北電影節今年將卓越貢獻獎頒給手繪電影看板畫師顏振發，他入行超過50年，

  手繪過數千張電影海報並開課傳承，他表示，未來會持續畫下去，「會畫到眼睛

  看不見為止。」


  顏振發18歲時希望結合電影跟繪畫並師從陳峰永，以「格放法」作畫，將範本以格線

  定位再複製放大至另一張畫紙上，越複雜的細節，就需要越多格線輔助，而五官和眼神

  最難還原。


  顏振發透過台北電影節分享，早期當學徒1個月只有新台幣200元的酬勞，還要磨練

  3年多才能出師，但他靠著天賦和努力在2年就獲得肯定，在電影業全盛時期，每個月

  要畫超過200張海報。


  下個月將滿71歲的顏振發因為長年跪地加上用眼過度，導致右眼視網膜中間損壞，已

  失去視力無法修補；左眼經過雷射搶救仍有部分視力，現在視力全靠左眼支撐。


  顏振發的功力不只獲得電影圈肯定，2018年更受邀為國際精品品牌繪製藝術牆，

  知名樂團Coldplay也找他幫忙打造仿舊風格的專輯封面，並曾為「雙子殺手」、「羅根」

  、「解憂雜貨店」等國際製作電影繪製手繪海報，作為伴手禮送給海內外影人，是台灣

  國寶級職人代表。


  顏振發雖然天天在電影院工作，但名字從未出現在電影片尾，對於此次獲獎，他表示，

  既開心又安慰，終於能被電影圈看見，「我覺得自己也是電影製作的一分子。」


  2024台北電影節將於6月21日至7月6日登場。


  （編輯：張雅淨）


  ———————————————————————


  心得：恭喜老師，也希望他繁忙中也能兼顧健康


  --'
