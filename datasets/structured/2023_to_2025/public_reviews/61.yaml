title: '[新聞] 「國寶級影帝」小戽斗病逝！享壽73歲'
content: "新聞網址：\n\n\n「國寶級影帝」小戽斗病逝！享壽73歲\n\n 台灣演員小戽斗（歐藏喜）驚傳病逝，享壽73歲。他2019年才剛以電影《老大人》奪下\n\
  台北電影獎最佳男主角獎，片中飾演一名脾氣倔將的老父親，劇情加上他細膩的表現、賺\n人熱淚，更與該片中飾演女兒的黃嘉千情同父女。\n\n據ETtoday報導，小戽斗2日晚間在慈濟醫院病逝。小戽斗2019年7月才在奪下台北電影獎\n\
  影帝，得獎時開心地表示：「我18歲拍台語片到現在，小戽斗不是小漏斗，也不是小便斗\n，麻煩大家跟我喊三遍『小戽斗不是小便斗』！」還向台下導演蔡明亮、『永遠的男主角\n\
  』李康生笑嗆：「給我小心一點！」表示20多年前毛遂自薦想要演出蔡明亮導演的電影，\n最終卻沒有被錄用，希望未來有機會演出蔡所執導的電影，發言還歷歷在目，如今卻傳出\n\
  病逝消息，令人震驚與不捨。\n\n--"
