title: '[情報] 李相日翻拍吉田修一《國寶》！吉沢亮將飾演歌舞伎「女方」'
content: '根據日媒的報導指出，《怒》日本名導「李相日」將三度翻拍名作家「吉田修一」的小說

  ，新作《國寶》將由「吉沢亮」主演。




  《國寶》為吉田修一耗時四年親身投入歌舞伎巡迴演出取材，於 2019 年出版篇幅長達

  800 頁的小說大作，這回李相日將繼《惡人》及《怒》後第三度翻拍其作品，並交由曾執

  筆細田守早期作品如《跳躍吧！時空少女》和《夏日大作戰》等名作的編劇「奥寺佐渡子

  」編寫改編劇本。


  《國寶》以日本戰後經濟快速成長的歌舞伎世界作為背景，描寫出身黑道世家的男主角「

  喜久雄」過著被命運捉弄的一生，並被歌舞伎役者給收養。在他動盪的人生中，他隱藏在

  身體裡的才能開花結果，成為了一位出色的歌舞伎役者。




  而曾試鏡《怒》落選感到失落的吉沢亮這回被導演相中，將在《國寶》扛下大任演出男

  主角喜久雄，除了基本的歌舞伎技巧訓練之外，他更將在片中演出「女方（女形）」的角

  色，成為了另外一項巨大的挑戰，吉沢亮也表示他為此每天都努力的在練習當中。


  《國寶》預計在本月正式開拍，並於六月殺青，目前尚未設定上映檔期。




  --'
