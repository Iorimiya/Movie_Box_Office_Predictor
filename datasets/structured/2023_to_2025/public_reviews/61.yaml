title: '[好無雷] 國寶'
content: '因去年進場看了幾部日本片都看到快睡著


  所以今年對日本片興趣缺缺


  但看到板上關於國寶的推文蠻多好評


  就心動進場了



  我沒看過原著、沒看過預告、不了解歌舞伎、板上文章關於劇情的都先快速滑掉、劇中演員

  只知道渡邊謙跟寺島忍、在國賓小廳看的、沒什麼文學造詣、是一個極為普通且粗糙的觀眾



  劇情：


  剛開始看的時候覺得某些片段銜接的很奇異


  直到看到最後一幕就理解了


  至於看不懂的部分


  回板上看有看過原著的板友補充就瞬間秒懂了


  感謝補充劇情的板友們


  三個小時我哭了三次 哭到流鼻涕的那種


  而且當下我也不知道我在哭什麼


  就是畫面出來 我就哭了 沉浸式哭泣



  妝面：


  隨著劇情的推進，妝面的呈現也不同


  例如我看不懂為什麼某角色被強調很美貌


  隨著劇情推進 哇 他是男的但是他好美啊


  又例如眼尾的紅混著淚水 看起來像血



  演員：


  兩個主角演技真好


  對手戲的細膩度極度好評



  建議上廁所的時間：


  我是第一次主角雙人上舞台演出結束後去的


  回來時還是銜接的的上



  推薦：


  不排斥日本文化的都推薦進場


  不了解歌舞伎也不影響觀影體驗


  感性體質記得帶衛生紙



  --'
