url: https://www.ptt.cc/bbs/movie/M.1544956735.A.6FC.html
title: 'Fw: [新聞] 《斷背山》成美國國寶 李安：原本只是想'
content: "作者: Diluvius (沒) 看板: Gossiping\n標題: [新聞] 斷背山》成美國國寶 李安：原本只是想講\n時間: Sun Dec\
  \ 16 18:08:57 2018\n\n1.來源: 中時\n\n2.標題: 《斷背山》成美國國寶 李安：原本只是想講愛情故事\n\n3.內文:\n美國國會圖書館（Library\
  \ of Congress）今年新增25部收藏電影，作為國寶流傳後世。\n台灣名導李安執導的《斷背山》名列其中，李安得知後表示，當初創作《斷背山》最大目\n的不是要用來反映社會現象，只是想講一個愛情故事，「令我驚訝的是，這部電影竟與觀\n\
  眾有這麼深刻的共鳴。」\n\n李安在聲明上表示：「這部電影成為了文化的一部分，反映了暴力、偏見與愛的黑暗和光\n明。」《斷背山》當年獲奧斯卡金像獎8項提名，最後抱回最佳導演、最佳改編劇本及最\n\
  佳電影配樂等3獎。另外史蒂芬史匹柏（Steven Spielberg）執導的《侏羅紀公園》、經\n典恐怖片《鬼店》、希區考克（Alfred Hitchcock）的《蝴蝶夢》以及奧黛麗赫本（\n\
  Audrey Hepburn）主演的經典《窈窕淑女》。迪士尼1950年的《仙履奇緣》是今年唯一一\n部動畫。\n\n美國國會圖書館自1989年起每年都會挑選多部電影收藏，入選影片不限長短、是否曾公映\n\
  ，唯一要求是影片必須完成超過10年，旨在保護美國歷史和文化影像。今年恰逢國會圖書\n館30周年，館長卡拉海登（Carla Hayden）說：「在過去成千上萬部電影中，我們看到了\n\
  自己，我們的多樣性、創造力、習慣和文化，我們的成功或失敗。這是值得保存的遺產。\n」\n\n4.連結: \n\n--"
