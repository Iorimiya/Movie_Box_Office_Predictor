title: '[  好雷] 國寶 歌舞伎藝術片'
content: '這是一部歌舞妓宣傳片。

  劇情上看得出來想塞很多內容，但因為片長的關係，其實會有一些解釋不太清楚的地方。

  不過這些都無傷大雅，演員的演技完全蓋過了這些問題。最後喜多川和俊寶的對手戲真的

  太猛了，不看劇情，光是演技就足以令人動容。重點是，那場戲還能與他們在台上演的劇

  本相互呼應，這部分的詮釋就已經值回票價了。

  完全無法想像身為演員的辛苦，要把歌舞妓詮釋得這麼好該有多難。

  我已經被電影說服了 XD ——被說服歌舞妓真的是一個非常、非常辛苦的工作。

  也因此會下意識覺得，演員本身一定也非常努力、非常辛苦，才能站上這個舞台。

  總而言之，劇情雖有瑕疵，但如果補完小說，整體會更完整許多。

  單純以「歌舞妓宣傳片」的角度來看，這部作品絕對是滿分，是經典之作，完全可以稱得

  上神作。

  吉澤亮的演技真的太猛了，也讓我多認識了一位超棒的演員，大感謝！

  片尾曲很值得留下來好好聽完，非常棒的一首歌。


  --'
