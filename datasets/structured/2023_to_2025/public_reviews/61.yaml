url: https://www.ptt.cc/bbs/movie/M.1762004860.A.5B1.html
title: '[討論] <國寶>裡 印象深刻的片段 (有雷)'
content: "去TITAN廳二刷了<國寶>\n用超大銀幕+好音響看 真的好讚!(滿足)\n\n一刷看故事\n二刷看細節\n兩次觀影都有不同的感受。\n\n以下有雷\n\
  還沒看過電影的，如果不想被爆雷請避開。\n\n========================\n\n吉澤亮(飾演喜久雄)和橫濱流星(飾演俊寶)在本片的表現都極為出色!\n\
  然而雖然吉澤亮演得很好，但我個人情緒衝擊最大的兩幕反而都是橫濱流星演的......\n\n一個是喜久雄代替二代目登台，\n俊寶從觀眾席離開後，一邊流淚一邊對著春江說\"\
  \ 我好想成為真正的歌舞伎演員 \"那段。\n橫濱流星的表情和聲調實在太讓人揪心了QQ\n\n\n\n一個是俊寶最後一次演<曾根崎心中>那段，\n撐著重病的身體、竭盡了全部的一切在舞台上綻放，那力道真的讓人震撼。\n\
  ( 看的時候好怕刀子被換成真刀，俊寶會死在舞台上....好在是我多心了)\n\n這段吉澤亮也是使出了魂之演技，\n兩個人激盪出來的情緒滿溢到觀看的時候胸口都會感到疼痛，忍不住淚流滿面QQ\n\
  \n\" 俊寶，再不起來 就要換人演了喔。 \"\n喜久雄說出這句話時，我眼淚直接用噴的。\n\n\n吉澤亮的部分\n我印象最深的是喜久雄要代替二代目登台，在二代目病房接受訓練，\n\
  一直被罵台詞唸得不到位，他就很用力打自己一巴掌，然後目光微微擒淚唸出台詞那幕。\n\n眼睛水汪汪的，實在好看到不行。\n\n\n\n我看到那幕時，不禁讚嘆吉澤亮真的是長得太太太太太好看了。\n\
  ( 剛好大銀幕上的三友社長也在讚嘆喜久雄很厲害XD )\n\n\n另外一段印象也很深的，是喜久雄代替二代目登台前，緊張到渾身發抖，\n沒辦法好好化上紅色眼妝的時候，俊寶進休息室替他化的那段。(俊寶人真好嗚嗚嗚)\n\
  \n\" 我身上沒流著可以守護我的血脈 \"\n對比兩人第一次在京座劇場登台前，二代目對俊寶說\" 你身上流著的血會守護你 \"時，\n喜久雄聽到後微微低下了頭，讓人覺得很心酸。\n\
  ( 襲名公演時，二代目在台上吐血身亡，最後嘴裡喊的還是俊寶的名字，\n  喜久雄的表情和只能喃喃反覆說著\"對不起\"的反應，也很心酸QQ )\n\n\n雖然吉澤亮飾演的喜久雄才是主角，但整體而言，橫濱流星的演出更讓我印象深刻。\n\
  或許是因為腳色個性的關係，俊寶本來就比較外放，\n因此相對壓抑的喜久雄會比較難發揮吧。\n不過兩個人真的都演得超好，幾乎不分軒輊。\n\n除了上面的橋段之外，每段歌舞伎表演都美到不行，真的值得用大銀幕好好欣賞。\n\
  兩位演員為此訓練超過一年，用心程度不言而喻。\n\n最後就用主題曲MV，重新回味喜久雄和俊寶在京座劇場的初登台吧。\n\n\n\n\n\n--\n我也有同感\n\
  總覺得還是少了點什麼，腳色塑造應該還可以再更深入，也不夠瘋魔。\n然後劇情銜接其實很破碎，尤其後半段。\n所以整部片的完整感不太夠，但瑕不掩瑜!\n因為那段的情感實在太強烈了，\n\
  加上日本人很喜歡那種\"在最燦爛的時候殞落\"的觀念，\n所以忍不住就擔心起來......\n因為太緊張，結果第一次看的時候反而有點分心，很怕下一幕刀子就刺下去了...\n\
  說到這\n我很喜歡俊寶和喜久雄兩次跳道成寺，喜久雄從舞台下升起時，\n第一次兩人是面對同一個方向  ( 俊寶看著喜久雄的背影 )\n第二次  16年(?)後再合作，\
  \ 兩個人是面對面的 ( 就是海報的圖案 )\n這個安排讚讚!!\n看到兩人面對面相視微笑時，超級感動QQ\n感受到要出現吉澤亮的老妝時我超擔心\n因為我覺得日本的戲劇很不會化老妝，擔心會很奇怪XD\n\
  超級好看!\n我對那幕目光含淚的吉澤亮真的是印象超深刻"
