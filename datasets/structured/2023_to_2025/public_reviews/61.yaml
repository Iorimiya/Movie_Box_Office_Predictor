url: https://www.ptt.cc/bbs/movie/M.1761228136.A.5F9.html
title: '[好無雷]國寶-傳統、名聲、人性與藝術 '
content: '可以在大銀幕觀賞這部鉅作真的太好了


  花井東一郎與花井半彌兩人的羈絆貫穿了整部劇，天賦及血脈的衝突問題也瀰漫整部片


  對於歌舞伎這門藝術文化的寫實描寫也十分到位


  劇情雖平淡但演員演技都很棒，角色間的心境轉折也很細膩，不會讓人覺得乏味


  三小時的片長中大約五段以上將近20-30分鐘是看演員在舞台上演出歌舞伎的經典橋段


  光這點就很值得到大銀幕欣賞，如果你是對藝術文化很有興趣的就很值得進場一看


  總之這是一部橫跨半世紀關於人性、文化、藝術、歷史以及美的史詩大戲


  雷文防雷資訊頁



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  以下為有點劇透的心得


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~







  導演在演員在台上表演時常運用全臉特寫鏡頭，毫不留情地展示演員臉部妝容上的瑕疵。

  這種近乎殘酷的真實，打破了傳統舞台表演的距離感，提醒觀眾華美背後是肉體凡胎的勞

  動，而這樣的表現方式也讓演員自身的情感、表情展露無遺，讓電影觀眾一方面在看台上

  的戲，一方面也在看角色人生的戲。一旦演員開始表演，觀眾立即會被唯美的肢體語言與

  華麗服裝所折服，從「不完美」到「完美」的轉化也驗證了演員精湛技藝所達到的藝術昇

  華。


  影片深刻描繪了歌舞伎界對名號傳承與名望的極度看重。這份重視一方面是維護傳統的基

  石，但另一方面卻顯得諷刺。在現代，血脈和名望的價值，顯然已在某種程度上凌駕於技

  藝本身。有名望者在高級劇場受追捧，而東一郎在落魄時，即使身懷絕技，也只能在無人

  認真欣賞的場合表演。這揭示了藝術家作為「人」的世俗弱點與虛榮，以及名聲和場所對

  藝術價值評斷的巨大影響力。


  主角花井東一郎儘管在家庭與情感方面充滿人性缺陷，但隨著生命中重要人物的相繼離去

  ，他對世俗名聲的追求也逐漸看淡。他最終唯一的目標，是追求極致的美。當他被封為「

  人間國寶」時，這榮譽早已超越了血脈和名望，是對他孤獨、犧牲以及對藝術偏執奉獻的

  認可。


  《國寶》不僅讚美了歌舞伎的藝術之美，更叩問了傳統、名聲與人性在藝術洪流中的位置

  與意義。


  今晚看這片-電影心得分享FB粉絲團



  --'
