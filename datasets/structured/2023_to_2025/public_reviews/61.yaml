title: '[新聞] 「國寶」代表日本 角逐2026奧斯卡最佳國'
content: "新聞網址：\n\n\n\n  奧斯卡獎\n「國寶」代表日本 角逐2026奧斯卡最佳國際影片\n2025/8/28 20:20（8/28 20:34\
  \ 更新）\n\n  \n\n  影片來源：東宝MOVIEチャンネル\n（中央社記者戴雅真東京28日專電）日本電影製作者聯盟今天宣布，以歌舞伎為題材的電\n影「國寶」，將代表日本申報角逐2026年奧斯卡金像獎最佳國際影片獎。\n\
  \n日本放送協會（NHK）報導，日本電影製作者聯盟宣布，在9部申請作品中，最終選出「國\n寶」代表日本，角逐明年的奧斯卡最佳國際影片獎。\n\n「國寶」改編自吉田修一的同名小說，由韓裔日籍導演李相日執導，也是兩人繼「惡人」\n\
  、「怒」之後第3次合作。「國寶」描述任俠世家出身的主角喜久雄（吉澤亮飾演），投\n身歌舞伎的世界，將青春奉獻給藝術，最終以女形登上「人間國寶」的故事。\n\n\
  「國寶」雖然片長達2小時55分鐘，但好口碑透過社群媒體傳播，成為超級賣座電影，票\n房紀錄仍在不斷更新。\n\n根據發行公司公布資訊，截至8月21日上映77天，「國寶」的觀影人數已經達到782萬人，\n\
  票房收入突破110.1億日圓（約新台幣22.8億元），在日本真人電影票房中，僅次於2003\n年上映、票房173.5億日圓的「大搜查線THE MOVIE 2：封鎖彩虹大橋」，也是日本真人電\n\
  影時隔22年票房再次突破100億日圓。\n\n訂閱《早安世界》電子報 每天3分鐘掌握10件天下事\n請輸入電子信箱\n訂閱\n日本過去曾在2009年以「送行者：禮儀師的樂章」獲得奧斯卡最佳外語片，此獎項於2019\n\
  年改名為「最佳國際影片」後，2022年由濱口竜介執導、改編自村上春樹短篇小說「在車\n上」的同名電影獲獎。\n\n各國作品接下來將由美國影藝學院進一步篩選，於明年1月公布入圍名單，3月頒獎。（編\n\
  輯：唐聲揚）1140828\n\n\n\n  -------------------------------\n\n\n\n\n\n  能在鬼滅和柯南夾殺下還賣破百億\n\
  \n\n  看來日本真人電影還有救的.....吧?\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n--\n  Q:請問以下的諸位人物 何人是[真實存在]於幕末時期---明治維新之間的歷史人物?\n\
