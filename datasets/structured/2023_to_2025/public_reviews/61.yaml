title: '[討論] 台灣也該拍一部自己的《國寶》'
content: '看完《國寶》之後很感動

  好久沒有在電影院哭了

  劇情、表演、美術都完美

  吉澤亮跟橫濱流星明年要是沒拿日奧影帝、男配

  我會很生氣

  美國奧斯卡最佳國際影片這部也該至少進15強吧


  現在也覺得台灣也該拍一部《國寶》

  看是要用歌仔戲或布袋戲都可以

  男主角要會講台語的新生代男演員

  那曾敬驊是不二人選吧


  --'
