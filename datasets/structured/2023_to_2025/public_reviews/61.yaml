title: 'Re: [新聞] 史豔文50周年登上大銀幕 國寶黃俊雄父子'
content: '不是很深的布袋戲迷，但有瞭解一些相關的歷史，幫忙講一下

  其實黃俊雄是滿有些問題，當年做出史豔文出名，大紅特紅帶著

  兒子-黃文澤兄弟也投入下去做，但兩兄弟父親並不疼，史豔文都

  是父親自己掌控，後來他們自己作自己原創作品，霹靂系列打

  出名聲，黃俊雄不僅不肯幫忙，還要求把一些從他那邊的人氣角色

  收回去不准用，所以黑白郎君本來在早期霹靂是有的，後來版權

  就完全消失，黃文澤兄弟完全靠自己，辛苦地打出新的名聲，

  完全沒有靠史豔文的拉抬幫助，把霹靂系列做出口碑，並且打出

  全新的霹靂角色代表，變成台灣布袋戲的代表，

  父親對兒子如此，這是非常艱辛的一段過程，該是令人相當佩服


  而黃俊雄，取了新的老婆，生的兒子黃立綱，把所有資源都投入

  給他，不僅史豔文跟黑白郎君、秘鵰、哈尾兩齒等都傳給他，

  整個《雲州大儒俠》也交給他，這些年，常常以自己國寶大師跟

  史豔文來曝光做新聞，就是拉抬這個小兒子，這小兒子是運氣多好，

  生下來就有國寶跟強大IP跟公司資源給他做，可是就是本事有限，

  這些年一直打不出名，只以一直消費史豔文跟黑白郎君


  這些年霹靂紅了，反倒有人來說霹靂打壓金光，其實真相完全不是，

  對霹靂來說，根本不公道還更嘔氣，他們是被父親踢開，靠自己雙手

  打天下，而金光，正是佔盡便宜的二世祖

  當然近年來霹靂布袋戲劇情走下坡，黃立綱有做出一些事蹟成果，

  霹靂目前是大咖，金光是小咖，但這真正的過程與事實該要釐清

  別弄成好像大企業打壓創作者


  金光別要說什麼被霹靂押著打，更悲情的是三子黃文耀的「天宇」，

  父親不疼，自己做也一直做不出名，一直燒錢，黃俊雄只顧後妻的

  寶貝小兒，有想過前妻的兒子感受嗎？




  --

  沒有 黑白郎君在雲洲普普 是霹靂把他做紅的 你沒忘記黑白郎君與網中人

  的宿命對決吧，但做紅後聽說黃文擇有跟黃俊雄求，但老爸硬是要回去不爽給

  那是呼應上一篇文章說有這樣的情形，霹靂過大壓到別人



  老爸對黃董兄弟才是真的不公平吧'
