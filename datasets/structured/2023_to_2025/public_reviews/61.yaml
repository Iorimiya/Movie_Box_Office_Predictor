url: https://www.ptt.cc/bbs/movie/M.1508598514.A.3B6.html
title: '[新聞] 手繪電影海報國寶師傅 為解憂細膩作畫'
content: '（中央社記者江佩凌高雄21日電）台灣國寶級老畫師顏振發堅持一生手繪電影海報，已是

  全台僅存的電影看板畫師，他今天受邀為電影「解憂雜貨店」作畫，展現精闢畫工技法，

  一筆筆描繪出電影中的角色神韻和場景。


  現年65歲的顏振發，目前是全美戲院電影看板畫師，早期在戲院全盛時期，他曾創下一個

  月繪製多達200幅大型電影海報的紀錄，至今仍堅持透過畫筆繪出電影宣傳看板，「手」

  護傳統作畫方式。


  根據片商新聞稿指出，由於現今電影海報都採數位輸出，讓他一度難以維持生計，幸好遇

  見全美戲院經理吳俊誠，堅持只擺放顏振發的手繪電影看板，才保留住延續至今的傳統，

  讓顏振發得以持續創作。


  顏振發今天受片商邀請到台北知名影城，替改編自日本推理大師東野圭吾的同名作品「解

  憂雜貨店」繪製電影海報，超真實還原日本影帝西田敏行在片中的角色神韻和造型，並重

  現主場景雜貨店的街景。


  顏振發表示，不管是畫西田敏行或是雜貨店都不會太難，但繪畫過程中必須非常專心。完

  成後他還戴上帽子、手拿報紙與信件，仿照電影裡西田敏行飾演「浪矢爺爺」的裝扮，一

  同和畫作合照。


  看完「解憂雜貨店」的顏振發直說被片中的故事感動，覺得整部片很溫暖，對於不少人說

  他長得很像「浪矢爺爺」，他則用台語開玩笑回說：「我比他帥！」


  「解憂雜貨店」於13日起正式上映，好口碑讓電影開出亮眼成績，至今全台票房已累積新

  台幣1640萬元。


  新聞網址：


  --'
