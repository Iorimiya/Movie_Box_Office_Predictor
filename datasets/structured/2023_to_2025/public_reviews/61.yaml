title: '[心得] 國寶 vs 寫樂'
content: "看完不會感覺很長\n但我看過更好的\n所以相較之下\n覺得還可以更好\n曾看過真田廣之演的寫樂\n\n\n\n劇情國寶勝寫樂\n但歌舞伎拍的美感\n\
  筱田正浩的寫樂還是比較強\n可能拍武生跟拍花旦不同\n但前人的技術可能早已失傳\n這片看得出是靠書才能大賣\n就像哈利波特跟金庸一樣\n所以就算王晶亂拍也大賣\n\
  \n最喜歡一開頭的開場\n永瀨正敏演黑幫老大\n仇家來刺殺拍得很棒\n藝人真的蠻多黑二代\n\n好不容易變大明星\n因為輿論又去跑龍套\n還去旅店跟餐廳表演\n\
  跟寫樂一樣大起大落\n藝人的悲歌很像今天的\n尼可拉斯凱基或李立群\n\n在台灣看的人好像也不多\n日本動漫迷也不太捧場\n就像韓團迷也不看韓片\n\n--\n\
  \                                 11/17 17:18"
