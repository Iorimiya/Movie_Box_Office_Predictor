url: https://www.ptt.cc/bbs/movie/M.1762247943.A.9D6.html
title: '[雷] 《國寶》'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《國寶》劇透劇情梳理（都是雷）\n\
  \n國寶電影透過多段劇情，試圖回答一個核心問題：藝人如何持續擁有舞台？（以歌舞伎來\n講甚至要站上全日第一）\n\n論點先從最簡單的開始：「#技藝」與「#血統」。\n\
  \n沒有血統支持但有天份的喜久雄，天天苦練從不缺席，相信一定能夠靠努力勝出；俊介則\n依靠血緣，一方面有自幼薰陶的底子，一方面也不得不繼續在賽道上競爭。\n\n\
  其實俊介的父親應該也是技藝派，他理性上把名號傳給持續堅持的喜久雄，臨死前惦念的\n是兒子俊介。技藝在前、親情在後。（非常符合人性啊，畢竟是親生兒子）\n\n戰局看似非常直觀好懂，直到另一個角色的加入：金主。（也是我全片最有感的安排）\n\
  \n藝術不能只有風花雪月，要有人給錢才有電影可以看，文青才能繼續在電影院無病呻吟。\n（？？？？）\n.\n生意需要經營、演下去需要錢。\n\n到此討論不再是二元選擇跟辯證，開始擴展。\n\
  \n先是「#社會的認可」，一波帶風向和賣慘記者會，讓本來已棄權出局的俊介重新翻盤。\n因為歌舞伎重血統、要求名正言順、在乎名節私德。\n\n藝術行業看似是純粹比拼技藝，其實真實運作虛偽到不行。你必須獲得大眾的認可（以任\n\
  何的方式），而每個國家民族有自己的判斷準則。不是善惡對錯，只看入不入眼。\n\n後來更甚有「巴結討好」的說法出現，也帶出獲得認可的暗黑手法。\n.\n最後，順風得勢的俊介，卻敵不過「#命運」。遺傳的糖尿病扼止他的女形之路。他流的\n\
  血像是詛咒，即便不喜歡也演下去，即便演下去了，站上家主之位，運氣卻沒站在他這邊\n。\n.\n看《國寶》，不只是「能為技藝能做多少犧牲」、畫面多美多壯觀，也再次體認演藝事業\n\
  的殘酷。\n.\n結尾，劇情選擇回歸純粹。\n\n走過種種犧牲和風波的喜久雄如願成為日本第一、成為國寶。他始終只想看看，那片夢中\n的景色。\n\n–\n脆：\n\
  IG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n\n--\n謝謝！"
