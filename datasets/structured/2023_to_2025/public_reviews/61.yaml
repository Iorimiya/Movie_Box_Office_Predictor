title: '[新聞] 豬哥亮新片票房破千萬 要觀眾抓國寶[影]'
content: '新聞網址：


  （中央社記者鄭景雯台北22日電）藝人豬哥亮主演的新片「大顯神威」上映三天全

  台票房破新台幣1500萬元，南部票房略勝北部，他笑說，「台北人都去北投抓寶了

  」，更自嘲「我也是國寶，大家也來抓一下啊」。


  「大顯神威」今天舉辦感恩記者會，過去豬哥亮的電影都選在春節賀歲檔期上映，

  這次挑戰暑假檔，他坦言，對於票房確實有壓力，但不會認輸。

  「大顯神威」上映三天全台票房破1500萬元，南部票房略勝北部，他笑說，「台北

  人都去北投抓寶了」，更自嘲「我也是國寶，大家也來抓一下啊」。


  提到演唱電影「大顯神威」主題曲「Oh My God」MV內容因涉及「褻瀆膜拜地點及

  蓄意侮辱宗教」，黃明志昨從台灣回到馬來西亞機場時，即遭警方逮捕。


  對於黃明志被抓，豬哥亮表示，有看到新聞，「希望他沒事，可能MV超出一點，宗

  教很厲害」。1050822


