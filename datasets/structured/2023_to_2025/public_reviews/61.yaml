title: 'Re: [討論] <國寶>裡 印象深刻的片段 (有雷)'
content: '昨天也去泰坦廳三刷，發現除了這段之外

  喜久雄在替代花井半二郎演出曾根崎心中

  最後在滿滿掌聲落幕，德兵衛拍拍他的肩膀說演得非常好喔


  為了登峰造極的藝術將自己掏空的喜久雄跪坐在舞台上恍惚

  那一段的寂靜也很催人眼淚


  "你必須活得像阿初，才有辦法死得像阿初"



  說個輕鬆點的

  三刷之後，其實電影裡個人最喜歡的女形

  不是吉澤亮的喜久雄，也不是橫濱的俊介

  而是黑川想矢的少年喜久雄XD


  雖然戲分不多，但從開始的積戀雪關門的墨染

  到後來幸子要俊介先下來坐著休息看少年喜久雄的練習

  這兩段少年喜久雄的形態和肢體

  都讓我覺得如果我是劇中的人，一定也會有

  "阿這是哪裡來的美麗藝妓阿"的感覺


  其實兩位主角演的已經超級美了

  但可能兩位主角都是30歲左右的成年人體態了

  相較15歲還在發育的少年的肉體和臉龐詮釋的女形

  少了那麼一點女性的嬌嫩柔弱感和羞澀吧


  看了一下今年到年底的片單

  暴蜂尼亞很期待，但應該不至於到撼動情感

  阿凡達火與燼就算了，狗尾續貂強弩之末之作

  國寶應該會是個人今年最喜歡的電影了吧

  這種看完心裡會有一個結的電影，真的是好久好久都沒碰到過了


  --'
