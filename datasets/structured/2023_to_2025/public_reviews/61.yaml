url: https://www.ptt.cc/bbs/movie/M.1530164989.A.170.html
title: '[新聞] 史豔文50周年登上大銀幕 國寶黃俊雄父子'
content: "新聞網址：\n\n史豔文50周年登上大銀幕 國寶黃俊雄父子×李崗導演聯手打造巔峰之作\n\n【勁報記者于郁金/臺南報導】史豔文和與之齊名的藏鏡人、黑白郎君、劉三、二齒、怪老子等，為一代臺灣人的共同記\n\
  憶，其著名的台詞至今仍令人琅琅上口！由金光多媒體和新光三越台南新天地聯手打造的\n「史豔文傳奇特展之神龍再現」特展於6月28日盛大開幕；用電影的形式透過史豔文角色\n\
  來傳達華人文化的民間信仰、道德觀、文化價值，以及當代臺灣人的時代精神。\n\n6月28日即將於台南新光三越新天地開始展出的「史豔文傳奇特展之神龍再現」，6月27日\n\
  於臺南新光影城舉辦「史豔文傳奇特展之神龍再現」與《儒俠史豔文》電影啟動聯合記者\n會，\n\n\n隨著時代推演，在金光布袋戲團隊的努力下，史豔文的系列故事也不斷推陳出新；身為史\n\
  豔文第三代傳人的黃立綱決定與父親黃俊雄大師共同聯手打造史豔文紀念電影，並於史豔\n文躍登電視螢幕50週年之際，登上大銀幕，不只是送給史豔文這位叱吒全台的布袋戲經典\n\
  人物的50歲賀禮，也是送給所有曾經於電視機前著迷於史豔文風采的所有臺灣人一份意義\n非凡的紀念禮。\n\n早在民國47年，黃俊雄大師邀中央製片場出資拍了全球第一部布袋戲電影「西遊記」，當\n\
  時此部電影還曾被在台美國新聞處剪接成30分鐘的短片，參加法國坎城影展；民國53年，\n黃俊雄大師再度大膽拍攝第二、第三部布袋戲電影「大飛龍」、「大相殺」；自首部布袋\n\
  戲電影至今經過一甲子的歲月，黃俊雄大師將再次圓夢，由兒子黃立綱領軍，與知名導演\n及製片人李崗攜手，讓史豔文登上更高更大的舞台。\n\n■臺灣獨有特色文化 週週推出精彩活動\n\
  \n布袋戲文化源自中國福建泉州一帶，透過布袋戲通天教主「黃海岱」、布袋戲教父「黃俊\n雄」到第三代黃立綱的金光多媒體，逐步成為臺灣獨有的特色文化；走過半世紀的布袋戲\n\
  ，經由藝師不斷進步改良，從小到單手可操作小型戲偶，至現今需多人同時操作的電視版\n戲偶，過程與製工越來越複雜，本次特展將仔細介紹這臺灣獨有的文化-布袋戲。\n\n\
  除了精心安排展區呈現，金光多媒體更週週推出精彩特別企劃活動；除了金光布袋戲精彩\n獨特的互動式劇場式演出；更首次與阿忠布袋戲合作，不僅合作推出影片，在網路上掀起\n\
  話題與聲量，更邀請到阿忠布袋戲現場演出，不僅可再次重溫「忠」式笑話演出，更可看\n見阿忠布袋戲史無前例地與史豔文、藏鏡人等一眾金光群俠同台競戲！\n\n■史豔文50週年紀念電影「儒俠・史豔文」上映\n\
  \n6月27日金光多媒體於臺南新光影城舉辦「六載韶光-金光布袋戲感恩特映會」，金光多媒\n體負責人，也就是人間國寶黃俊雄大師的么子黃立綱偕同黃俊雄大師、李崗導演，共同宣\n\
  布將於2020年推出「史豔文五十週年紀念電影」。\n\n史豔文和與之齊名的藏鏡人、黑白郎君為一代臺灣人的共同記憶，其著名的台詞至今仍令\n人琅琅上口；而隨著時代推演，在金光布袋戲團隊的努力下，史豔文的系列故事也不斷推\n\
  陳出新身為史豔文第三代傳人的黃立綱，決定與父親黃俊雄大師共同聯手打造史豔文紀念\n電影，並於史豔文躍登電視螢幕50週年之際登上大螢幕；不只是送給史豔文這位叱吒全台\n\
  的布袋戲經典人物的50歲賀禮，也是送給所有曾經於電視機前著迷於史豔文風采的所有臺\n灣人一份意義非凡的紀念禮。\n\n黃立綱表示，金光布袋戲秉持著堅持傳統、勇於創新，在文化產業上持續耕耘不墜，本回\n\
  透過在百貨辦展有更多機會將布袋戲文化傳遞給民眾，展場將展出黃俊雄大師在民國47年\n拍攝全球首部布袋戲電影《西遊記》、民國53年拍攝的布袋戲電影《大飛龍》、《大相殺\n\
  》所使用的「大尊尪仔」，讓民眾可親眼目睹從未公開展示過的「大史豔文」及「大藏鏡\n人」本尊，難得機會。\n\n國寶級黃俊雄大師(1933年1月26日)，出身臺灣雲林縣虎尾鎮，臺灣知名頂尖布袋戲操偶\n\
  、口白和戲劇製作大師，亦為知名布袋戲大師黃海岱的次子，曾連任2屆臺灣省戲劇公會\n理事長；14歲起，隨父學習布袋戲，其作品《雲州大儒俠》是台灣電視布袋戲的知名經典\n\
  作品，自創布袋戲拍攝技術，獨樹一格，並曾獲多樣榮譽和獎項。\n\n維基百科資料就黃俊雄大師生平指出，出身臺灣雲林縣虎尾鎮，是知名布袋戲大師黃海岱\n的次子。14歲起，隨父學習布袋戲，由後場學起至吹(嗩吶)、打(鑼鼓)、拉(二胡)、演(\n\
  操偶)、編(編劇)、講(口白)，堪稱布袋戲全科狀元。19歲組成五洲園第三團，後改為真\n五洲掌中劇團。其作品《雲州大儒俠》是臺灣電視布袋戲的經典作品，膾炙人口，亦自創\n\
  布袋戲拍攝技術，至今已成為獨樹一格的專業節目製作系統。..曾獲全國戲劇比賽冠軍、\n教育部社教獎、薪傳獎、全球華人青商十大傑出人才，亦曾連任2屆臺灣省戲劇公會理事\n\
  長。2002年榮獲第37屆電視金鐘獎終身成就獎；2006年獲雲林縣文化獎並榮獲第10屆國家\n文藝獎；2008年後獲得馬英九總統聘任為總統府國策顧問；2009年受文建會列為無形文化\n\
  資產保存者；2011年授證「人間國寶」頭銜；2015年11月12日，獲頒二等景星勳章。\n\n新光三越表示，除了隆重規劃的12大精彩展區，讓戲迷一賭金光群俠的世界觀之外；更展\n\
  出從未公開展示過由黃俊雄大師拍攝布袋戲電影《大飛龍》、《大相殺》的「「大史艷文\n」、「大藏鏡人」本尊，邀請民眾親臨一睹「大尊尪仔」的魅力！(于郁金攝)\n\n\
  國寶黃俊雄父子聯手打造巔峰之作 史豔文50周年登上大銀幕\n===============\n\n2020年 素還真大戰史艷文\n\n--\n        \
  \                              06/29 09:49"
