title: '[新聞] 《國寶》票房衝上真人版日本電影歷史第三'
content: '《國寶》票房衝上真人版日本電影歷史第三


  日經中文網 2025/08/19




  日本東寶8月18日發佈消息稱，電影《國寶》的日本國內票房收入已達到105億日元。這是

  2003年上映的《跳躍大搜查線2:封鎖彩虹橋》以後22年來真人版日本電影的票房收入首次

  超過100億日元。在該片6月6日上映後的73天內，觀影人數達到747萬人。票房收入在真人

  版日本電影中位列歷史第三。


  《國寶》改編自吉田修一的同名小説。影片描述了一名出生於俠義之家、因父親被殺而被

  歌舞伎名門世家收養的男子，以及該家族繼承人的人生故事。該片以日本古典藝術「歌舞

  伎」為主題，劇情內涵深厚，加上兩位主演的精彩演繹，人氣持續攀升。




  在2025年東寶發行的電影中，動畫《名偵探柯南：獨眼的殘像》、《鬼滅之刃 劇場版 無

  限城篇 第一章 猗窩座再來》以及真人版《國寶》這三部作品，均已超過被視為大熱標準

  的100億日元票房收入。


  --'
