title: '[新聞] 國寶歌王文夏睡夢中辭世 享耆壽94歲'
content: '新聞網址：


  快訊／國寶歌王文夏睡夢中辭世！　享耆壽94歲


  文夏因器官衰竭在睡夢中辭世，享耆壽94歲。台灣優質生命協會對外表示，目前文夏大體

  在一殯，告別式將採取採基督教儀式，沒有特別設置靈堂，日期待訂。


  事實上，文夏2019年經歷遭看護餵毒，當時昏迷長達5天才清醒，甚至瘦到25公斤，讓老

  婆文香難以接受。文香2020年7月時曾向《ETtoday星光雲》透露丈夫身體恢復狀況良好，

  從25公斤增胖至42公斤，食慾也頗佳，在安養院3餐正常、作息規律，精神非常好。


  ，同時也是台灣歌壇有史以來活躍最久的歌手，

  代表歌曲有《媽媽請妳也保重》、《黃昏的故鄉》、《媽媽我也真勇健》、《飄浪之女》

  、《十八姑娘》、《星星知我心》、《再會呀港都》等，2004年獲文化總會國寶級藝人獎

  章，2012年獲第23屆流行音樂金曲獎特別貢獻獎，2020年獲第24屆台北文化獎特別獎。


  -----


  文夏於1962年~1972年 共拍了11部電影 前十部為《文夏流浪記》


  1962《台北之夜》

  1963《高原遊俠》(第一部台語西部片)

  1963《台北之星》

  1964《綠島之夜》

  1964《阿文哥》

  1965《文夏風雲兒》

  1967《流浪天使》

  1967《流浪劍王子》(系列唯一的古裝片)

  1968《一見你就笑》

  1969《再見台北》

  1972《走馬燈》


  文夏老師近期的電影演出應該就是2013年鍾孟宏執導的《失魂》

  於片中最後演唱〈漂浪之女〉 也是其睽違40年出現於大銀幕之作


  --'
