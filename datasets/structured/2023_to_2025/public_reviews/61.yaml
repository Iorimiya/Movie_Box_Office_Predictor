title: '[討論] 國寶台灣賣得還算不錯欸'
content: '對 在我的標準裡三天四百萬就算ok了


  李相日返神之作

  李真的屌

  因為我非常肯定橫濱流星演技大突破 就是在他的「流浪之月」

  你再回頭看妻夫木聰、現在的吉澤亮 也是一樣

  演技登峰造極就是李相日磨的



  說真的這種等級的製作+導演已經不可能難看

  就看接不接受片長 電影捨掉原著的部分而已


  而且我欣賞傳影在金馬前自己上映 (西西里島美麗傳說也是)

  這部如果在影展放一定拍手拍到爆

  希望影展不要吃掉太多後續的票房


  --'
