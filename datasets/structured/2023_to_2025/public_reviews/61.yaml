title: '[好雷] 觀《國寶》電影與小說：迷人日本戲曲世界'
content: '網誌好讀版





  其實本來只是想寫些觀影和讀書心得的雜記

  沒想到寫著寫著就變成一篇長文

  所以算是一篇夾雜著電影和小說的文章

  請各位指教了





  以下有雷



  -------------------


  [觀影] 迷人的日本傳統戲曲世界：觀《國寶》電影與小說



  今年夏天在日本旅行，晚上回到旅館打開電視，幾乎都會看到不同節目在探討現

  象級日本邦畫《國寶》，連吉澤亮在劇場外撞到的那根柱子，都可以被旅館（滋

  賀琵琶湖大津館）拿來當作宣傳，你就知道這部電影不是在開玩笑的。回來台灣

  以後我就引頸期盼這部電影的上映，雖然後來是等到了，可是宜蘭的影院居然沒

  有任何一家引進，寧可播映周杰倫的修復4K版《頭文字D》，所以我也只好跑到

  台北看。


  也好在，我去台北看了《國寶》，不去真的會遺憾。看完當下震撼而衝擊，而且

  情緒的後座力遠比我想像得長久，直到我兩週後開卷閱讀小說，直至掩卷。


  電影與小說，在前半部的差異比較沒有那麼大，可是直至喜久雄代替第二代半二

  郎演出《曾根崎心中》之後，整體出現了相當大的差異，可是無論是電影還是小

  說，都一樣精彩絕倫。要我比喻的話，兩種媒體的表現都令人感到「痛」與「快」，

  可是電影版是重重一下震撼的一槌，槌進心底；原著小說則如一根長針，緩緩的，

  一丁點一丁點的刺進你心中。因為電影已經長達三小時，這大概已經是普羅大眾

  能夠接受的極限了，所以必須在劇情上更具快、狠、準；小說則讓所有的角色，

  更具立體感，故事更加豐滿，所以到了最後的終章，也讓人有更深的迴響。


  不用說，這部電影絕對是放在兩位主要形塑的角色，俊介和喜久雄身上，尤其是

  主角喜久雄。因為我是先看電影的緣故，所以在主角的想像上就受到電影影像的

  制約，俊寶和喜寶兩人的臉，就固定在橫濱流星和吉澤亮的扮相上了，但以小說

  的書寫敘述來說，我非常肯定電影版本的選角，兩位男星確實在外形上非常符合

  小說裡頭這兩位公子的俊俏外貌，而且裝扮成女形，真的也妖冶至極。


  作為花井家的獨子，俊介一直被當成承繼歌舞伎衣缽的傳人對待，也因為要調教

  一個真正的戲子，小說中寫到「窮，可以有格調，但窮酸味毫無格調可言」，那

  絕對是俊介被如何養成的注腳，自幼訓練嚴格，但生活上絕對不會讓這樣的孩子

  被虧待，所以橫濱流星演出的俊介，自然流露出來的那種少爺氣，與書中如出一

  轍。因此在走紅之後，突然在父親受傷時，無法受到父親指名代演這件事時，卻

  也只能軟弱的逃走，我們似乎也可以理解了。


  更甚者，原著裡面還提及逃走這十年其實有個轉折，那就是逃走兩年以後，俊介

  是有偷偷回來找父親半二郎的，而且他在當時認為自己的演技已經能超過喜久雄，

  可是在父親的考驗之下，卻無法獲得認同。接著更遭遇到喪子之痛，人生進入到

  無以復加的墮落，好在透過春江的愛與耐心，他才能從地獄中爬回來。自此，我

  們才可以說，俊介在人生的高貴之外，體驗到了人生的極苦，所以讓他的表演自

  此有了深度。


  這十年的逃離，在電影與小說都有提到，但電影不能像是小說一樣具有細節，因

  此觀眾看到電影中，半二郎離世前哭喊著：「俊寶、俊寶！」只覺人還是有血脈

  上的自私，但透過小說，我們更明白半二郎是獅子推子下山的那種心痛，除了自

  私以外還有更多更深的期許，甚至對於自己冷血的後悔。不過不得不說，渡邊謙

  這位老戲骨，看他那段哭喊，真的喊得觀眾都為之心碎呀！


  後來俊介回歸，這段非常有「王子復仇記」的味道，電影讓喜久雄失去演出機會，

  甚至透過勾引名角女兒作為上台手段，最後被揭穿，讓自己也走上和俊介當年逃

  離歌舞伎界一樣的命運，甚至還不是「逃離」，而是被攆走，宣判戲劇之路的斷

  絕。這段劇情是電影與小說最大的差異，也形塑了後來喜久雄從此為「藝」而活，

  眼中只有追求最高境界的狀態。


  可是小說其實是讓喜久雄在襲名之後，立刻被歌舞伎界冷處理的情況，俊介在外

  十年異常艱辛，但喜久雄在歌舞伎界也飽受催折。俊介補足了生命中幸福與不幸

  兩造的極端，喜久雄則是從極道世界進入藝界頂峰後，再一次的跌落神壇。兩人

  都在這樣的生命歷程中，迎來了「藝」的開花結果。這樣的人生，還真的是「情

  隨事遷，感慨係之」，幸與不幸都是無法一刀兩斷，真只能互為表裏罷了。


  兩人各經冷暖之後，在此相遇，電影再度讓兩人以《雙人道成寺》一劇重聚，丹

  波屋兩人組再度合璧，電影這樣的設計簡直讓人感動到頭皮發麻的地步，不要忘

  記，當初這兩人就是以同一齣戲，開始走紅於歌舞伎界，結果竟又戲劇性的以同

  一齣劇再度合作。可是電影也殘酷的讓俊介在之後的《雙人道成寺》最後的「鐘

  入」見得前病發，使觀眾充滿無盡的遺憾。


  至於小說這段東山再起，鋪陳的就更長了。兩人其實是在俊介復出後，各自歌舞

  伎的傳統流派與新派發展，而且都受到了關鍵人物小野川萬菊的刺激與提拔，開

  始展開了各自獨霸一方的人生。所以並沒有喜久雄還跑去流浪的劇情，因為他已

  經被冷凍太久，早就在各種冷眼下生活。所以後來俊介成功付出，喜久雄也從新

  派另闢蹊徑，重新取得聲勢，卻又因為過去認識的黑道長輩辻村的邀約，在新派

  的路又遭斷絕。可是也是因為這樣重情重義的性格，喜久雄重新被岳父吾妻千五

  郎另眼相看，回到了歌舞伎界，也才因為這樣，再度的和俊介一起在舞台上重逢，

  一起出演《源氏物語》，並且採用立役（男角）與女形（女角）每天互換的方式

  進行巡演。


  這時候或許大家就會有疑問了，那個「吾妻千五郎」，該不會就是喜久雄利用的

  名角女兒，彰子的父親吧？是的，就是彰子的父親。電影中喜久雄是因此離開了

  歌舞伎界，後來受到小野川萬菊的幫助才重回舞台，但小說是一直沒有離開的情

  況，這是電影與小說最大的差別。


  所以我們回頭照看真正的男主角喜久雄，這位出身黑道，如果不是因緣際會進入

  歌舞伎界，大概就會成為不知道在哪個衝突之中慘死的小混混吧。


  電影版的喜久雄，真的就是個為「藝」而活的演員，畢生將一切押注「藝」之上，

  從師父第二代半二郎決定襲名給他開始，就一直過著孤獨的人生，只有俊介復出

  和喜久雄同台的那幾年，也許線條才不過於冷峻外，電影中的喜久雄真的就是給

  人全心實踐師父給他的話：「無論發生什麼事，再怎麼不甘心，都要以『藝』來

  決勝負。」所以電影演到吉澤亮在旅館天台披著紅衣，花著妝容，瘋狂似獨舞的

  段落，真的會讓觀眾感受到前所未有的孤寂與心痛，更別說失去了俊寶以後的喜

  久了！當然會朝著天下第一的演員筆直向前，因為這樣的喜久雄，已經是藝的化

  身，超越了血脈，超越了歌舞伎舞台的侷限。


  然而小說中的喜久雄，還不時被旁人甚至俊介暱稱為「喜寶」的喜久雄，他的線

  條一直以來都是非常有「人味」，不會像電影版本那樣的冷冽，因為原著裡頭，

  有著喜久最忠誠的跟班，或者說最忠誠的朋友、家臣——德次，這個配角大大溫

  暖了小說版本中的喜久雄。電影中的德次只有出現在序幕，後來到了大阪，這個

  角色就消失了，而這也是讓電影中的喜久雄如此孤獨的最大原因。


  所以小說中有德次陪伴的喜久雄，不再是全然拋下藝妓市駒和女兒綾乃的狠心父

  親，反而有了德次，喜久雄和她們母女倆的關係才能一直維繫，甚至在綾乃中學

  犯錯時，德次的不顧一切犧牲，才讓喜久雄慢慢修補了自己與女兒的關係。話說，

  若以原著小說來說的話，其實我覺得最討喜的角色真的非德次莫屬，既忠義又風

  趣，活脫就是從傳統歌舞伎中走出來的忠臣一角啊。正因為有德次，喜多雄撐過

  了自己年輕迷惘的時刻，撐過了被歌舞伎界看不起的落魄，也在人性裡面沒有完

  全喪失自己身為父親的機會，這恐怕也是喜多雄在「藝」上能始終努力的一份堅

  持吧。


  當然德次這個角色後來突然說要去中國，然後就此在小說中消失，這段劇情我覺

  得原著處理的並非理想，若有再版的機會，不知吉田修一會不會重新給讀者們一

  個更合理的解釋。但若要解釋的話，恐怕就是德次不走，就算俊介後來逝世，恐

  怕喜久就難以決定臻至藝道之極了吧。


  電影裡，當俊介的右腳截肢以後，得知可能左腳也會壞死的狀況下，要求喜久雄

  一起最後的同台，他們選的劇正是當年二代半二郎決定讓喜久雄代班的戲碼《曾

  根崎心中》。我必須說這段戲選的真是絕妙，前後呼應，又讓兩人交換角色，既

  有生命上的昇華，亦有心理上的釋懷，編劇奧寺佐渡子真的是神來一筆的處理。

  甚至在《曾根崎心中》最後一幕，讓俊介扮演的游女阿初，因為義肢關係絆了一

  下，意外的產生讓飾演情郎德兵衛的喜久雄以眼神鼓舞俊介，兩人在殘缺之下，

  圓滿了這兩位角色的藝界人生。比起小說中書寫以《隅田川》一劇來搭配，雖然

  作者文字功力了得，一樣書寫的很有影像感，可是電影版的處理更具有劇情上的

  衝擊性，我真的被那幕德兵衛靠在阿初腳背上時，鏡頭特寫告訴你這隻腳之後也

  得截肢的影像，掀起了無盡的感動，兩人自此相持相扶，都是一起在將彼此的「藝」

  推向巔峰，但後來俊介隕落，喜久雄自然而然的孤高也變成理所當然的了。


  這兩個人物就是小說中的兩大主角，電影當然也是，直到俊介過世，喜久雄就是

  過著一個人追求藝道巔峰的生活了。電影讓喜久雄演出《鷺娘》，在舞台上進入

  了他當年看到的極致領域，小說更是讓喜久雄入魔，衝出舞台，衝出劇場，直到

  銀座流貫不息的車陣之中，很可惜電影沒有將這幕戲具象化，因為小說這段文字

  的形容真的極具影像化，作為電影的最後一幕，也應該是相當合適的，不曉得李

  相日導演為何不復刻此幕。


  電影《國寶》作為單一作品來看，真的是近來日本的至高傑作，只是要真的進入

  吉田修一《國寶》的世界，還是得倚仗小說，因為電影時限的問題，有很多的細

  節與人物的立體性，就必須拋開。電影最讓人覺得可惜的，就是女性的刻畫過於

  扁平了，頂多只見第二代半二郎的太太幸子表現較為立體以外，春江、彰子、綾

  乃等等在小說中極其重要的女角，幾乎都被削弱了。不過這的確是小說改編時，

  角色必須要取捨的問題，電影要著重在兩大男主角之間的戲份，所以只能犧牲女

  角的刻畫了。


  不過若要談到女角刻畫，春江和綾乃兩個角色，透過小說彌補了許多電影的遺憾。

  春江這個角色，一直以來就是喜久雄和俊介之間的潤滑，可是當春江和俊介決定

  要廝守時，就立刻有了女性的覺悟，而這種覺悟一直延伸到俊介流浪十年回家，

  幸子問春江和喜久雄是否斷的乾淨時，春江確實的表現出一往無前的決心，於是

  也讓幸子燃起俳優之妻的熱血，決定要讓春江能不遜於俊介，作為一個大俳優的

  真正賢內助。


  綾乃的部分，在電影之中就是襯托喜久雄的無情的小配角，可是小說有了德次在

  中間折衝，喜久雄不是個無情的人，綾乃也不曾完全沒有父愛，起碼德次為喜久

  雄扮演了一個無血緣的父親，甚至為了綾乃年少無知的行動，願意為救他而斬斷

  一根手指。綾乃在成年之後，也不是在電視台當主持人或記者，而在最後和父親

  和解，甚至成為了相撲橫綱之妻，透過這些生命經驗，綾乃也慢慢窺見父親在追

  求什麼，也扎實的面對了自己的人生。


  作為讀者，可以讀到上述的段落，是非常幸福的，你會知道在吉田修一的筆下，

  這些人都是有血有肉，跳脫了電影框架，擁有自己的性格與人生觀。讓我們也做

  一個期待吧，如果有串流公司投資，在擁有足夠的資本下，可以用不遜於電影的

  鏡頭，找合適的人選，做一套不犧牲任何角色的日劇版吧。


  今年度的電影與閱讀，《國寶》真的就可以說是一支獨秀，雖然好電影還有很多，

  好書也挖掘不完，但影像與小說的文字串接，真的是夠享受的。因為對歌舞伎一

  點的沒有概念，雖然讀小說也可以順暢讀完，不過有了電影的影像，那些閲讀小

  說的影像變得具體，小說讀起來，飄在腦海中的文字化成了色彩斑斕的舞台色彩，

  亟顯精彩！


  --'
