title: 'Re: [討論] 國寶 問題?(有雷)'
content: '這段其實是電影濃縮改編的了


  沒記錯的話，小說裡面的講法

  是沒有人知道萬菊到底為什麼會在貧民區的旅館的原因

  那是他自己偷偷跑去的，也和所有人斷聯

  但在那裏他其實過得很愜意，會跟其他貧民區的人喝酒談天

  也會在大家鼓譟之下跳舞

  在旁人眼裡可能覺得他晚景淒涼，但他其實過得很開心

  那句"這裡沒有任何美好的事物，彷彿在告訴我不用再努力了"

  印象也不是對著喜久雄講的


  小說中喜久雄谷地翻身其實是靠吾妻千五郎

  也就是彰子的爸爸提拔掛保證的

  他後來一開始加入了新派，和俊介兩人算都是一方之霸


  至於為什麼會從痛扁喜久雄到掛保證

  這中間又會扯上早期提拔喜久雄兼喜久雄殺父仇人辻村這角色

  但辻村在電影裡面又從頭到尾都沒提到

  (好啦硬要說，大概只有一開始的身影吧)


  個人是覺得導演沒有很想著墨在喜久雄如何谷底翻身

  所以這段就簡單的用萬菊找他請他跳舞

  問他這幾年都跑去哪裡帶過了


  電影畢竟是改編刪減小說後的作品

  看完電影如果覺得有點沒頭沒腦，是蠻推薦去看小說的

  雖然小說有些地方也是講得不清不楚的XD

  像是春江為什麼跟俊介跑了，作者好像也就用沒人知道草草帶過XD


  --'
