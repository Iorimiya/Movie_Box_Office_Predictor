url: https://www.ptt.cc/bbs/movie/M.1579446077.A.EEB.html
title: 'Re: [討論] 年少時代跟醉鄉民謠是不是被低估了?'
content: '2011奧斯卡最佳影片:《王者之聲》


  當年獎季開跑社群網戰是完全領先


  但接近到奧斯卡之後王者之聲整個被拱起來 就逆轉了


  當年個人喜好: 社群網戰>全面啟動>燃燒鬥魂>王者之聲



  2012奧斯卡最佳影片:《大藝術家》


  記得當年好像都是大藝術家領跑


  雨果和繼承人生是最大的對手


  當年個人喜好 雨果的冒險>繼承人生>大藝術家>魔球



  2013奧斯卡最佳影片:《亞果出任務》


  小班執導的代表作 當年完全一路領跑


  那年好像也是影藝學院會員第一次改制


  結果小班沒入圍奧斯卡 但他反倒拿下金球獎和導演工會


  當年奧斯卡最意外的導演提名是《南方野獸樂園》的Benh Zeitlin


  那年李安以《少年Pi的奇幻漂流》拿下第二座最佳導演


  當年個人喜好 少年PI>愛．慕>決殺令>亞果



  2014奧斯卡最佳影片:《自由之心》


  這一年自由之心和地心引力從獎季開始一路廝殺


  兩部同時拿下製片工會 Alfonso Cuarón拿下DGA


  金球獎影片導演分家 自由之心拿影片 Cuarón拿下導演


  最後奧斯卡也是一樣結果


  另外當年男主角是Chiwetel Ejiofor領跑 Matthew McConaughey緊追在後


  金球獎後就整個情勢翻轉


  當年個人喜好 醉鄉民謠>雲端情人>內布拉斯加>地心引力>藥命俱樂部>自由之心



  2015奧斯卡最佳影片:《鳥人》


  那年記得沒錯是年少時代一路領跑 影片和導演都是


  但到了工會獎鳥人衝上來 當年奧斯卡想說會不會連三年導演影片分家


  最後鳥人大贏家


  當年個人喜好 年少時代>布達佩斯大飯店>進擊的鼓手>鳥人



  2016年奧斯卡最佳影片:《驚爆焦點》


  這年就是驚爆焦點和瘋狂麥斯廝殺


  但當年主要風向很詭譎


  金球獎 劇情類是神鬼獵人贏 喜劇類是絕地救援贏


  製片工會是大賣空贏


  當年個人喜好 瘋狂麥斯>驚爆焦點>大賣空



  2017年奧斯卡最佳影片:《月光下的藍色男孩》


  這年月光和La La Land互相廝殺 戰到奧斯卡才分輸贏


  當年個人喜好 曼徹斯特>月光>赴湯蹈火>La La Land



  2018年奧斯卡最佳影片:《水底情深》


  這年我認為是大年 入圍最佳影片的幾乎沒難看的


  當年前哨水底情深 意外 逃出絕命鎮 淑女鳥互別苗頭


  絕命鎮稍微處在領跑階段


  水底情深之後拿下PGA和DGA就大勢底定了


  當年個人喜好 意外>淑女鳥>水底情深>逃出絕命鎮>敦克爾克



  2019年奧斯卡最佳影片:《幸福綠皮書》


  這年...... 實在不想講 我覺得是十年來最差的結果


  當年個人喜好 羅馬>黑色黨徒>真寵>>>綠皮書




  再看十年來的綜合榜單 奪得最佳影片入榜的又有幾部


  講回原PO和推文提到的電影 時間自然會還回公道


  不知道各位的想法如何


  --

  我怎麼一直記成神鬼獵人都是在導演獎領先 感謝感謝

  我完全記錯了...... 感謝 改個內文'
