title: '[討論] 年少時代跟醉鄉民謠是不是被低估了?'
content: '年少時代我當初就覺得比鳥人好

  結果奧斯卡被輾壓


  醉鄉民謠奧斯卡根本沒得獎(也只有兩個提名)



  結果幾年後...

  BBC評21世紀百大

  年少時代第五、醉鄉11 註:鳥人無進百大


  帝國雜誌評21世紀百大

  年少29 醉鄉46 註:鳥人72


  衛報評21世紀百大

  年少第三 註:醉鄉跟鳥人皆無百大



  是不是被低估好片呢?


  --'
