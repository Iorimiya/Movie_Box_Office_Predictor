url: https://www.ptt.cc/bbs/movie/M.1444187184.A.DDE.html
title: '[新聞] 傻瓜龐克的夢想世代，電音版的醉鄉民謠'
content: "新聞媒體: 新浪新聞\n\n新聞標題: 傻瓜龐克的夢想世代，電音版的「醉鄉民謠」：《巴黎電幻世代》\n\n新聞內文:\n90 年代初期，法國電音派對主宰了年輕世代的夜生活，特立獨行的保羅立志成為\
  \ DJ，與\n好友組了 DJ 團體「歡呼」（Cheers），並與當時尚未成名的「」電音雙人（\n）一同闖蕩巴黎派對與夜店，並遠赴紐約、芝加哥等地表演。\n\n\
  十年之間，保羅沈醉在弛放迷幻、舞光四射的派對表演生活，雖有音樂作伴，卻也同時迷\n失了自我，名利與成就不上不下…。保羅眼睜睜看著好友「傻瓜龐克」兩人從默默無名到\n\
  成為國際電音天團，自己生活卻逐漸變調，他開始重新省思自己人生，試圖找回生活的心\n節奏…。\n\n，源自九零年代於法國盛行的同名音樂誌（\nfanzine），當時首波銳舞勢力逐漸興起，《Eden》即成為當時樂迷對於電音的重要指標\n\
  ，。\n\n由《》導演執導最新作品，根據哥哥斯文\nSven 的真實經歷共同改編，描繪背景為法國電音（French Touch）興起的年輕世代，而\n紅透半邊天的葛萊美獎電音雙人組傻瓜龐克（Daft\
  \ Punk）也在故事中扮演極重要的角色\n，電影也收錄歷年他們重要經典「」、「」 與「」等歌曲\n。\n\n導演也藉由本片重現最忠於原貌的巴黎電音派對文化，拋開一切觀眾在其他電影所看到過\n\
  於華麗裝飾與墮落不羈的印象，呈現最自然純粹與即興的派對情景。除此之外，導演撰寫\n本片志不在敘述一個偉大勵志的成功故事，而是以個人化的視角洞察年輕 DJ 在音樂之路\n\
  跌跌撞撞，試圖跟上自己節奏的「魯蛇」人生，著實令觀眾引起共鳴，堪稱是《醉鄉民謠\n》電音版。\n\n《巴黎電幻世代》由東昊影業發行，。\n\n新聞網址: \n\n\
  備註: 感覺不錯\n\n--\n    \n\n\n\n\n\n\n--"
