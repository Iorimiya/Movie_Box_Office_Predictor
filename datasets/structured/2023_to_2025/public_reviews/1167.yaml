url: https://www.ptt.cc/bbs/movie/M.1421072830.A.BA9.html
title: '[大爆炸爛雷] 醉鄉民謠 - 柯恩兄弟根本胡鬧'
content: '昨天晚上HBO有撥這部片子


  這部當初在電影院上映時沒看到


  所以我一直很想看這部片


  只好犧牲星期日晚上兩小時寶貴的時光


  沒想到!!!


  真是一部不知所云的大爛片!!!


  挖哩勒!!!!


  --------------------以下有雷------------------------






















  片頭一開始


  就是一個長得很醜的男生


  在一個很破爛的酒吧唱奇怪的歌


  然後唱一唱還講了一個沒人笑出來的笑話


  (你說你有聽到笑聲? 那是主角自己在笑啦 懂了嗎? 去檢查耳朵再來)


  然後


  唱完有人在外面找他


  三兩下就被打倒在地上


  這是在搞啥 看不懂耶 搞什麼鬼呀


  前因後果也不交代清楚


  而且這一段片尾還在演一次


  只多了 主角看歹徒揚長而去的片段


  完全不知所云的爛片


  然後中間就是一些什麼


  主角讓別人懷孕阿


  讓別人墮胎阿還沒墮成阿 (因為沒錢)


  還有什麼唱歌唱不下去要回去當海賊王阿 (結果還沒錢申請證照)


  還有什麼找一隻貓 結果還找錯貓阿


  這種爛劇情


  完全無言


  柯恩兄弟近期實在不行了


  如果有人想看我分析柯恩兄弟的話


  請把這篇推到爆


  我就會在24小時內出現唷!!!


  --


  大爛片好嗎 你懂什麼



  哈 如果我們都是同一人 BUZZ_SUGGEST早就判罰了 只有你還在自嗨嗎? lol



  sure 支持你的論點



  你說這部片嗎 對阿 我知道沒人想看



  我也滿魯的



  那我會心靈受創



  真的浪費我生命，廢片一部



  Anna Kendrick 我愛你!!!!



  這是我看過最難看的音樂電影


  拜託


  你有沒有看過 為你鍾情阿



  好像有點道理，不錯



  誰跟你鬧版阿 忠實影評



  I would 的縮寫嗎



  可惜還早 你繼續加油



  是阿 哈 我就知道這篇一定不會噓很多 因為我po的過於中肯= =



  我也算同意你說的



  你看錯了  罰你在看三次



  真的阿!!!!!!!!!!!! 哈哈哈哈哈'
