url: https://www.ptt.cc/bbs/movie/M.1627662188.A.227.html
title: '[好雷] 神劍闖江湖The Beginning '
content: '剛開始看 40分鐘就預測神作，果然沒有辜負我的期望。



  神劍闖江湖系列作為漫改電影早就是最成功的作品，合理的人物造型、恰到好處的動畫特

  效，以及綜觀所有動作電影都堪為上乘之作的武打動作，都使該系列作作為漫改電影的典

  範。


  但也不乏任何改編電影皆有的問題：篇幅長度。


  商業電影長度多為兩個小時，要如何要把原作該有的內容放入這兩個小時是一個大學問，

  而決大部分電影也都會選擇適度的改編已達到時間目標，但是無論如何都不可能滿足原著

  粉絲的期望。


  但是系列最終作The Beginning完全沒有因為部分擷取，而導致內容不完整的四不像問題

  ，因為原作內容大約也就只是一本單行本長度，所以幾乎是把追憶篇所有內容都在電影裡

  面做了完整呈現，甚至電影裡面額外加入的橋段，更是補足漫畫內容的完整度。


  加入維新志士長州藩的革命過程，觀眾更加體會時代下的無奈、殘酷，以及主角劍心對於

  新時代的責任與渴望；最終與暗乃武對決時額外加入的戰鬥設定，更是補足原作中巴出來

  幫擋刀的合理性。


  電影中幾乎沒有配樂營造情緒，但是整部電影的調性也就是這樣，平平淡淡的讓觀眾體會

  大時代中的小幸福，在農舍裡的短暫甜蜜時光，也都讓我們渴求能否停留在此就好？


  感謝最終電影版神劍闖江湖能夠用The Beginning給我留下最好的回憶，難過的是兒時回

  憶要在這邊告別我們了。



  題外話：

  1.查資料才發現電影版的劇情幾乎改編自OVA？

  2.沖田總司不是應該要很帥嗎？


  --'
