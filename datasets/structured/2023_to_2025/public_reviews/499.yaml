url: https://www.ptt.cc/bbs/movie/M.1627757585.A.B67.html
title: '[好雷]神劍闖江湖 the beginning    不殺之誓'
content: "雷文防雷資訊頁\n\n\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  在訴說對這部電影的個人好感之前，還是得不免俗的先吐槽幾個尬點\n\n1.清里真的裝死就不會死，如果真是因為苟活就得切腹沒辦法，\n\n  那至少也讓他掙扎的聲音不要那麼有精神一點，\n\
  \n  都被捅那樣多刀了，無力到剩氣音應該也是很正常吧\n\n  一次次用差不多聲量重複一樣台詞，看到都以為是在看舞台搞笑橋段了\n             \
  \                                           （失禮）\n\n2.沖田的髮型...我知道查GOOGLE他真的就是這樣，但額外留兩搓下來真的....\n\
  \n  臉是真的很好看啦...重看多幾次後現在好像也習慣了就是\n\n  然後齋藤以前比現代老\n\n3.闇乃武老大真的想殺劍心嗎，你手上明明有拿刀啊老大\n\n\
  \  一堆應該可以砍他頭或是一次奪命的場合都不下重手\n\n  還慢慢的說讓你選擇死法，只能說反派永遠都會犯這種錯誤。\n\n4.沒有開司，SAD（預算啊...）\n\
  \n\n--------------個人濫情好感部分，文超長慎入-------\n\n\n\n這部分純粹是個人好感，\n\n而這好感來源也許有一部份是來自我以前看這作品時很沒同理心（？）\n\
  \n然後剛好在這部，被戳到了一些點罷了。\n\n\n\n\n看這部電影之前，已經刷了蠻多次預告\n\n漫畫又溫習了一遍\n\n動畫追憶篇也跑去刷了幾遍\n\n\
  那時一直期望的\n\n是在臉頰上畫下傷口的那淒美的一幕，能在大螢幕上有個最美的呈現\n\n腦海裡想著：這一定是全劇的高潮，前面的鋪陳，當下的配樂，節奏\n\n\
  要說哭出來，一定就是在這極品的一幕吧。\n\n\n\n\n結果並沒有\n\n\n\n\nBEGINNING前面並沒有交代太多巴的心境轉換，\n\n刀砍下的速度也非常之快，然後很快的劃下了最後一道傷痕\n\
  \n沒有搭配任何獨白，沒有任何回憶經營氣氛\n\n我期待的高潮就這樣沒了。\n\n看的當下已經開始幫這部片打可惜分，\n\n可惜啊，這邊應該要多鋪陳一點的，怎會在這種地方失誤.....\n\
  \n\n\n不過耐著性子繼續看下去，看到了讀日記的片段\n\n這段獨白一點一點的把巴對劍心的感情說了出來\n\n而前面鋪陳不足的感覺跟疑慮也在這段漸漸消散\n\n\
  \n日記裡面一句句台詞可以看到巴對劍心的愛，\n\n一個明明應該憎恨著他的人，卻真心的為他的轉變感到喜悅\n\n並相信著他（劍心）所立下的對未來的誓言\n\n\n\
  \n「等到新時代來臨，我再也不會殺人，我會用不殺人的方式去拯救更多人，\n\n  走上贖罪之路。」\n\n\n\n\n「日後，他依舊會繼續殺人，\n\n  然而在更遙遠的未來，\
  \ 他一定會保護比他殺過的人更多的人\n\n  我不會讓他死在這裡，我一定會豁出性命保護他。」\n\n\n\n  巴的心聲透過了日記傳達給了劍心，\n\n\n\n\
  \n    「那，我出發了，巴」\n\n\n\n  劍心也對此做出了回應\n\n\n這段編排讓我強烈的感覺到他們作為夫妻的羈絆\n\n以往看這段感受到的是愛情，現在看這段，更多感覺到的是支持與同步\n\
  \n兩個在這時代下被犧牲了幸福的人相遇並相愛\n\n知曉並接納了對方的一切，同時也許下了同樣的心願。\n\n\n\n此時不殺之誓，守護他人的未來再也不僅是劍心自己的想法，\n\
  \n而是承載了夫妻兩人期許的共同願望\n\n同樣的一句「那，我出發了」，這時卻讓我衍生出了這樣的感想。\n\n\n\n如果今天選擇將全片鋪陳帶來的高潮放在這一段而非畫出傷口那幕，\n\
  \n為的是帶出這樣的意境，我覺得這取捨我可以接受，而且有不同的感受。\n\n畢竟這段神劇情在追憶篇動畫也已經有了一個很美的呈現\n\n真人版抓另一個角度來呈現我覺得也很好。\n\
  \n一樣的架構，看過很多次的對話，在角色演技與編排上做了點變動後，\n\n在不同重點給人的感受強度竟會有如此不同。\n\n對我來說是個有點意外的收穫\n\n\n\
  \n然後畫面並不是帶到如同漫畫或動畫一般，回到幕末街道，展開接下來的熱鬥劇情\n\n而是回到了第一部最初的鳥語伏見戰場，\n\n其實期望看到原作的我這時是有點失望的，\n\
  \n但沒想到接下來我自己對這段觀影的心境轉變卻打消了我這念頭\n\n\n\n勝利了！是錦之御旗！\n\n\n來臨了嗎...新時代...\n\n\n\n「終於」\n\
  \n\n\n這個終於，和之前看第一部時看到的心情完全不一樣，\n\n\n「這一切終於可以停了嗎」\n\n我第一次站在為劍心著想的立場有這樣的想法，聽著這句「終於」，\n\
  \n腦海浮現的是他殺了清里後崩潰抖動的情緒表現\n\n是他夜裡洗手對巴說出 「別管我了」的脆弱聲音（很喜歡這邊）\n\n還有當他出發前夜，自己煮著菜用餐，\n\n\
  卻再也無法回到那段平凡且幸福的時光的哀傷感\n\n看著齋藤對他說「別以為這樣就結束了」的時候，\n\n我腦海裡第一個念頭竟然是「真的夠了，你懂他什麼？」\n\n\
  跟第一部一模一樣的橋段，一模一樣的畫面\n\n我的感受卻從當初看第一部希望劍心快點發威的一個旁觀者\n\n變成希望他真的可以結束這個酷刑般的生活的心情\n\n\n\
  \n原來這就是編劇和導演這樣安排的目的嗎，作為這部強調兩人心境的電影\n\n這個悲劇時代的完結，以及兩人願望實踐的開始，\n\n的確是最符合的結局/Beginning\n\
  \n\n\n\n重刷一次第一部，一樣再聽劍心說出「這是不殺之誓」時\n\n腦海裡浮出了他和巴的這段過往，\n\n「對，你不能再殺了。」\n\n我第一次對這句不殺之誓有這樣強烈的共鳴。\n\
  （我以前看這作品的心態是多中二啊）\n\n而看著極力阻止劍心開殺的小薰，心中竟然對她懷有感謝之情\n\n巴不在的現在，謝謝有妳願意如此盡心拉住他\n\n\n...明明我之前看這幕時只想著這小薰好像沒那樣吸引人啊...（再度失禮）\n\
  \n\n真的很有趣，一部BEGINNING的電影\n\n可以讓我用完全不同的心情重看前面的幾部曲\n\n甚至不會再在他身上追求漫畫的形象\n\n我已經近乎完全接受這個佐藤版劍心了。\n\
  \n當然，僅限於劍心\n\n沒救的左之助還是沒救，打到逆風就頭痛的宗次郎也是沒救\n\n牙突打吊燈的江口洋介還是一樣尷尬\n\n但唯獨再次聽到劍心為不殺之誓而猶豫時，變的可以更深的理解他的演繹表現。\n\
  （其實之前我對這演繹表現的同步率是偏低的，心情大概是\n「啊，是啊，劍心是有這樣不殺的設定，然後他正在演出那設定」的感覺。）\n\n\nBEGINNING讓我喜歡上了佐藤健的劍心，也有了再次欣賞享受前面幾部曲的理由。\n\
  \n做為系列最終作，我覺得很滿意。\n\n他們試圖讓你透過巴的視角，一起愛上並憐愛眼前的這個劍心\n\n導演編劇這樣的編排，讓我心甘情願的中了他們的招。\n\n\
  \n（其實同理劍心心情的想法以前看作品時雖然是有，\n\n  但並沒有到這次這樣強烈。\n\n  也許是真人版裡的劍心在許多地方演繹出的表現，\n\n  都在讓你發覺到他是個內心在崩潰邊緣，卻一直扼殺自己硬撐的一個人。\n\
  \n  不管是殺完清里的反應，或是面對新選組時那空洞的眼神。）\n\n\n\n\n順帶一提，雪地之戰裡砍掉第一個刺客手腳那邊讓我驚艷\n\n速度反差營造的效果真不錯\n\
  \n比起一殺多場面，這裡更讓我感受到拔刀齋如同猛獸一般的恐怖感。\n\n\n\n總之，這系列作結束了，可喜可賀。\n\n然後拜託到這就好，不要拍北海道篇，真的，拜託（\n\
  \n\n--"
