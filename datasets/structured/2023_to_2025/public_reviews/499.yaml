title: '[好雷] 神劍闖江湖 The beginning'
content: '目前五刷XD

  每天想到就看一點點(上NF的好處)


  看了好幾篇心得

  發現很多OVA粉不是很滿意


  但我本人OVA粉5X刷倒是很滿意

  但第一次看時確實可以理解大家不滿意的點

  我個人入門是國小看動畫>漫畫>OVA

  真正入坑是OVA(但年紀小沒看懂後來才發現原來動畫跟OVA原來是同一部漫畫系列)



  討厭NTR的

  被戴過綠帽的

  被劈腿過的

  剛剛被分手的


  阿~~以上老實說我是建議就不要點進來或進行推文了

  因為這不是爽片，你們看只會拉低評分

  請去看劍心系列京都大火跟最終戰比較好喔


  這是大河劇類型的武打愛情悲劇片


  但武打風格非常暗黑快速血腥跟前幾部砍人的呈現完全不同

  主角不會老是被人押著劍蹲下了

  基本上都站著砍別人



  首先

  這部電影版

  80%漫畫20%OVA


  所以拿電影版跟OVA神作比我覺得兩者性質就不同

  OVA本身在很多細節方面更像是藝術品

  (隱喻/配樂/分鏡/口白)

  動畫呈現更沒演技見仁見智的問題


  用有最強OVA之稱的追憶篇給差評

  就像有人老是說NBA小皇帝柯瑞每個都輸喬丹   差評

  比較不是這樣比的好嗎?



  要比也是跟前幾部比或是差不多類型的


  而且OVA是魔改漫畫後的神作

  它裡面一堆都是導演加的

  包括劇情都改了(好比說先告知劍心真相)

  十字刀疤的呈現也改了

  所以你可以永遠相信古橋一浩



  平心而論


  這部作品作為浪客劍心系列作結尾我覺得非常完美

  配上上篇心得文

  真的到這就好~~北海道或星霜拜託不要



  它不僅僅是在接續的OVA的神改後

  也加入了不同的視角跟觀點





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  先說女主角選角

  村花很多人不滿意

  但就呈現上我覺得第一名的掘北真希都不一定呈現的比他好

  冷冽感跟會讓人想靠近

  這兩件事本身就是矛盾好嗎?


  村花在小荻屋的裝扮跟攝影抓的角度簡直太好!!!!!!!!!!!!!

  我覺得非常可愛，巴本人雖然漫畫跟動畫跟可愛搭不上邊

  但是村花的氣質很好跟巴本人很搭

  在詢問我手上有刀就是要殺了我嗎

  那邊眼神也很到位

  整底來說我反而覺得這部村花的演技體驗我感受比佐藤強



  兩人互相默默注意的走位跟運鏡

  看得出導演對這部分很用心



  說  要好好吃飯  那邊

  配每次劍心筷子上都沒夾沒甚麼飯

  再到後面的吃得很開心

  你可以感受出巴的轉變與關心




  第一次問名字時

  巴的碗跟OVA老闆娘手上同款(台詞眼神溫和一點那邊)


  從小荻屋部分其實就可以看出

  導演想呈現的是跟OVA的巴兩者完全不同的心境


  OVA英文翻譯為

  trust and betrayal

  而非Recollection or Reminiscence

  我認為呈現的是兩人對於傷害彼此的糾結(前段是巴後段是劍心)

  最後都找出自己的答案是希望保護對方

  但結局卻又互相重傷彼此



  影版沒有最前面失去姊姊的情節

  更像是

  一個失去所愛的人來復仇發現兇手其實也是個被犧牲的可憐人

  一個是心已經受傷卻不自知持續走在黑暗裡的人

  兩個都嘗過失去的悲傷的人互相碰撞靠近而相愛的故事



  雖然我講的好像有點芭樂


  但影版透過花瓶的呈現

  巴更像是劍心在黑暗裡唯一的光

  這種呈現既合理又感人


  影版更強調透過對話

  激起劍心的反思

  在人物的思想矛盾上

  OVA著重巴的呈現

  影版著重劍心對自己信念的動搖

  巴的矛盾則是透過日記的方式呈現


  兩者的差別有興趣的人

  可以去看看OVA跟影版導演以

  對於巴人設的訪問


  漫畫作者的則是只沉迷凌波零外型其他都沒有作功課

  所以他講的話都不用聽


  除了人設部分作出差異感外




  此部的選角




  完敗前面所有系列作


  桂小五郎  高橋一生的體現更像是一個純粹的政治人

  高杉晉作反而看上去比桂乖


  這點算是跟漫畫可能比較像


  但當然也有缺點

  齊藤一前面太老後面太年輕

  沖田還原史實的禿頭但少了美感


  但整體選角真的比有左之助跟蒼紫的前幾部好太多


  追憶從第一部後十年了

  看起來老一點我覺得可以接受

  畢竟真人電影就是這樣

  有人感覺前後不一致，我是覺得除非搭時光機不然無解



  最前面咬刀片段略有狗血

  (咬了你還不砍他)

  但畢竟電影這部分整體看上去蠻吸引人的



  整體電影攝影的風格跟方式都非常美


  真的是很多目都可以截下來當桌布

  觀影體驗非常好



  不知不覺打太長明天繼續補上


  8/5心得接續在下方





  --

  同意到不行xd

  真的蠻推薦真愛粉第一次失望的再看一次

  我自己再看一次感覺不同

  本片被村花圈粉

  整體來說是喜歡原著(ova或漫畫)我是覺得應該不會到失望

  FINAL失敗我覺得本身就是因為核心是追憶

  拆開本身就是失敗

  這見仁見智OVA也是116分鐘喔  但其實這個故事在漫畫裡才一本多一點


  繼續


  追憶對我來說是神劍這部作品能成為經典的原因

  不然某種程度上他除了題材特殊

  並不足以讓他成為經典


  他讓漫畫整部作品提升到對於人性/時代的探討

  殺人與被殺之間的因果


  和月我相信他完美詮釋甚麼叫無心插柳XD


  回歸到影版本身


  如果以池田屋事件為界

  影版可以分為前段小荻屋/霄里山(沿用OVA劇名當地點)


  小荻屋整體我都非常喜歡

  可以說導演把巴喜歡上劍心的過程從霄里山部分

  往前拉到小荻屋表達(後面會再說到)


  拿掉了兩人去喝酒的片段+共同面對新撰組的片段

  改為1對1沖田

  這邊的更改主要為電影版增加打鬥精采度


  這邊改編的兩人躲在橋下的片段

  這是劍心第一次有想要保護的東西


  再來是求婚片段

  OVA用台詞成為經典：一起去吧，大津


  這根本不是求婚好嘛!!!!!!!!!!!

  但OVA硬是靠結局上山那一段，高潮前這句話成為哭點

  請永遠相信古橋一浩不會讓你失望



  影版就是還原漫畫更好的呈現兩人人設

  巴先丟一個直球：反正我也無處可去

  劍心：你能找到其他安身之處吧

  (巴丟來一個神眼)

  抱歉

  都丟給你一個人決定未免太狡猾了

  跟我一起生活吧

  但我希望不只是形式上一起生活


  希望你能陪在我身邊(但這句日文其實只有一起的意思Neflix翻得比較具體)


  我完全同意前一位說他看到這邊再灑花

  我本人也是!!!


  我認為導演透過這段對話

  在這邊確定了兩人對於彼此的心意都是有接收到

  並在這邊跟對方做了確認。


  這也是跟OVA最最最大的不同



  普遍覺得悶或是不滿意的，看下好幾篇心得都落在霄里山這邊

  其實我也蠻同意的


  但是這邊仔細看內容跟劇情

  大體跟OVA是一模一樣

  會感受到這麼大落差我認為是


  因為影版霄里山兩人沒有最重要的雙向感情確認和巴的心境轉變描述

  因為影版霄里山兩人沒有最重要的雙向感情確認和巴的心境轉變描述

  因為影版霄里山兩人沒有最重要的雙向感情確認和巴的心境轉變描述


  前往大津前

  OVA第二幕的結尾是在去的路途上巴在確認刀

  可以說，到這邊第三幕才是兩人感情的發展起點


  影版幾乎少了巴心境轉換的許多描述

  (OVA可參考兩次賣藥/插花/紅蜻蜓/白鶴等畫面)

  只靠演技要撐以上片段在粉絲心中的地位


  我只能說會想快轉不是沒有原因

  台詞的堆疊不足

  配樂的悲傷帶入感比不上OVA


  加上原著這段本身就沒甚麼劇情

  都是導致到這邊會覺得很拖的原因


  但這是一部電影

  我不認為在電影下Sound of Falling Snow的配樂

  會有跟OVA相同的感覺


  認真來說這邊的影版還原度非常高

  (包括場景/台詞/摸蘿蔔/吃飯)

  單就攝影上我可以給演員跟導演將近滿分


  台詞呈現的方式則是還原漫畫

  但攝影部分還原OVA經典橋段

  誠意十足


  上雪山的部分

  問題跟上面相同

  影版沒有辦法呈現劍心心境的轉換以及神級感情帶入配樂

  會導致這段不喜歡的人只剩下打鬥戲跟唯美的雪景


  電影版受限配樂帶入感不夠強是最大的問題


  電影通過畫面跟聲音給人帶來的刺激與反應可能天差地遠。

  也就是說，一個人聽到和另一個人聽到

  會根據個人成長與知識背景的差異而有不同的理解與感受。


  所以我認為導演在這段花了比較多心力在呈現打鬥戲法

  也是非常正確的選擇


  畢竟OVA是一堆人的白月光


  就雪山打鬥場景

  在五感盡失的狀況下

  影版更具體的呈現該如何透過劍術跟地形打倒敵人

  而不是像OVA劍心一直在回憶，回憶完就打倒敵人了


  覺得不喜歡霄里山生活&上山的人不妨從這個角度重新再看一次

  會有發現新大陸的感覺喔XD



  十字傷的部分

  我非常喜歡導演呈現的方式

  不是巴一個人畫上去的，而是兩個人一起完成的


  這個方式更符合影版兩人的設定

  我認為影版的巴上山時，是帶著想要保護對方的心上山的

  (OVA版有自盡橋段)

  相比較來說我比較喜歡這版喜歡劍心更多一點的巴

  在日記中

  巴稱呼清里為清里先生

  日文字幕是用殿


  我想導演可能也是想要這樣表達?


  十字傷的意義已經被探討很多就不多說

  透過兩人一起畫上的動作

  我認為更好的呈現這部片的片名

  The Beginning


  以及之後的系列

  都是他們兩人的起點

  (相遇/相愛/信念/誓言)


  對不起夫君

  是在說劍心影版這更沒甚麼好討論

  (OVA版也是監督也有說)


  這邊就是還原經典橋段

  我個人很滿意的地方


  最後是導演新加的日記回顧片段

  透過日記的方式

  說明巴心境的轉變

  訴說了他愛上劍心的過程

  劍心也透過日記掃除了心中了迷惘


  巴是劍心想要保護的人

  同樣的

  劍心也是巴想要保護的人


  4/14 一直在下雨(畫面接血雨畫面)

  12/26 雨轉變為雪 我感受到冬天的來臨

  這兩段我自己覺得是在說心境的轉變啦


  12/28也是我最喜歡的一段

  這段來自漫畫


  巴：

  他日後還會繼續殺人

  然而在更遙遠的未來

  他肯定會保護更多人

  多過死在他劍下的人


  後面接續OVA經典台詞


  劍心：那麼，我要出發了，巴


  這邊更像是兩人的對話


  巴非常理解劍心的信念雖然不能認同

  但許下了對劍心的願望

  劍心最終則是對此做出了承諾


  片尾最後齊藤一說的

  別以為一切就這麼結束了


  雖然沒有任何台詞

  但劍一插

  是他實現與巴承諾的起點

  也是不殺之誓的起點


  接續第一部不殺之誓的眼神

  老實說我再刷覺得很感動



  這部做為老粉，真的非常可以感受出導演與編劇的用心

  看的出來他們一定研究很多才做了翻拍

  因為疫情非常遺憾最終沒在大劇院播出


  但無論做為第一次入坑這個劇的

  或是做為沒看過漫畫只看過OVA的粉絲

  這部電影真的很值得稱讚


  OVA粉推薦你們再看一次OVA再來看

  其實蠻多細節直得推敲的

  好比說我覺得   日記雨轉變為雪

  對應霄里山開頭的配樂Sound of Falling Snow


  最後感謝導演跟演員做出了這麼好的作品

  覺得非常滿足'
