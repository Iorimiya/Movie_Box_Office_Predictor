title: '[普雷]《數碼寶貝02 THE BEGINNING》，比上不足'
content: '部落格版：


  記得上次進戲院觀賞《數碼寶貝 LAST EVOLUTION 絆》時被感動的亂七八糟，當然不僅是

  這是與童年有關的回憶，而是整部電影在談論的、關於長大、關於羈絆是如此的讓人共鳴

  。害怕長大、不想長大，彷彿成為大人之後就必須得捨棄掉很多東西，隨著年紀漸長逐漸

  忘記了小時候的夢想與敢於冒險的熱血，所以不願去面對、更抗拒著長大。不想讓亞古獸

  牠們再進化，是太一他們知道牠們終將隨著最後一次進化而消逝，只是人怎麼可能永遠留

  在原地？他們終究要去面對明天，去接受亞古獸、也就是他們的童年將被留在昨天的事實

  ，但是最後他們從亞古獸牠們身上得到了迎接明天的勇氣，知道了當年的冒險是他們成長

  的養分，他們與牠們曾經一起走過的沿途足跡是不會隨著長大消失的，而是會留在他們心

  底、成為向前的動力。比起過去電視動畫版，《數碼寶貝 LAST EVOLUTION 絆》更重在情

  感面的描寫與太一等人與亞古獸牠們的羈絆刻畫，不論動畫粉絲的接受度如何，是也成功

  走出了不同的路。


  時隔三年，續作《數碼寶貝02 THE BEGINNING》推出，主角從初代被選召的孩子換到了第

  二代孩子們，看似應該延續《數碼寶貝 LAST EVOLUTION 絆》，但實際看完會發現兩集從

  根本上就是不同的設定，甚至還有邏輯上的相互矛盾，只不過是共享同個數碼寶貝世界而

  已。如果將本集當作是當年《數碼寶貝大冒險02》的直接續集來看，我認為邏輯衝突的部

  分就能不去理會，可惜偏偏有了底還算不錯的首集在前，加上看過本傳的觀眾都知道所有

  系列作當中剛好就是第一部與第二部有直接關係，所以基本上很難讓人去忽視兩部作品設

  定上的不通順。雖然兩部作品同樣都以「羈絆」為題去延伸，可是兩部劇情卻走向截然相

  反的路線，前段提到過在《數碼寶貝 LAST EVOLUTION 絆》裡用數碼寶貝搭檔的消逝來當

  作主角們成為大人後對童年的告別，不過即便如此從亞古獸牠們、還有玄內老人口中得知

  ，彼此之間的搭檔關係或許會結束，可充滿無限可能性的「明天」是有讓羈絆得以延續下

  去的機會的。


  於是就理論上來看，《數碼寶貝 LAST EVOLUTION 絆》的設定像是，搭擋關係的結束是自

  然而然的發展，是沒有人能夠迴避的必然結果，可是在《數碼寶貝02 THE BEGINNING》卻

  無視這項自然理論，而是藉由新的登場角色與新的數碼寶貝，來強硬的塞給觀眾「被選召

  的孩子與牠們的搭擋數碼寶貝的羈絆是被創造出來的」這樣的新論點。我沒有認為本集類

  似創造神般擁有破格能力的烏科獸能夠實現人類願望，因而促成了被選召的孩子誕生這件

  事不好，畢竟感覺上烏科獸與類作為世界首對數碼寶貝與人類搭檔，就好似亞當與夏娃是

  地球上第一個男人與女人那樣，所以這樣的設定其實是有趣的，只可惜這顯然與首集中所

  偏向的自然法則相互衝突，甚至於也和《數碼寶貝大冒險02》的劇情本傳有著矛盾。



  看過本傳的觀眾應該都知道，《數碼寶貝大冒險02》的反派角色及川悠紀夫因為熱愛著數

  碼寶貝世界，為了實現與他最要好的朋友一起到數碼寶貝世界冒險的願望，他將靈魂出賣

  給了吸血魔獸，進而引發後續連串事件，最終大戰結束後他為了修復數碼寶貝世界因他造

  成的損害犧牲了自己，在臨死前他的數碼寶貝搭擋皮皮獸終於出現。及川悠紀夫熱愛數碼

  寶貝的心讓他如願成為了被選召的孩子，因此我們可以知道，或許數碼寶貝能夠被創造出

  來，例如木乃伊獸跟亞基利獸，可是卻無法和這些被創造出來的數碼寶貝締結搭擋關係。

  至少及川悠紀夫的例子能夠證明此事，搭擋關係的出現與結束是無法被創造、被免強的，

  而該是在某個時間點剛好的符合某個條件之下自然而然發生然後發展的。當然若歸咎於及

  川悠紀夫是人類，力量自是無法和自述與神明有關係的烏科獸相比也是解釋得通，但真是

  這樣的話不論是浪漫程度與後續的感動度都會大幅降低。


  基於上述理由，實在無法接受本集用創造論來推翻不論是本傳還是首集的設定，這會讓《

  數碼寶貝大冒險02》世界各地被選召的孩子集結數碼世界與搭擋抵禦貝利亞吸血魔獸的大

  場面顯得可笑，也讓人想把為《數碼寶貝大冒險》最後被選召的孩子與數碼寶貝道別的經

  典場面流的淚收回去。接著回到劇情上來看，先把設定的前後矛盾放在一旁，也不管劇情

  展開的莫名快速與突然，從本傳就有著的對家庭議題的關注同樣出現在了劇場版裡，而《

  數碼寶貝02 THE BEGINNING》正是順著此議題與後來類與烏科獸的往事，來帶出「溝通」

  與「對話」的重要性。作為本集主角的類不論是對母親還是對烏科獸都不能明確的表達自

  己，只是一昧的接受對方給予自己的暴力與關愛，然而這樣的結果導致類的母親無法停止

  對他家暴，也沒辦法讓一心只想對類好的烏科獸知道原來他並不想要牠用錯誤的方法對他

  好，直至類忍受不了後才想單方面的切斷關係，這才造成了後續憾事的發生。


  《數碼寶貝02 THE BEGINNING》想告訴觀眾的，無疑是建立在關係上的感情，親情也好、

  友情也罷，都該是雙向而非單向，不是一直給予也不是一直索取，關係就該是互相的。不

  論是喜歡還是討厭都該清楚表達，要相信彼此不會因為自己或者對方表達出情緒與感受而

  關係破裂，適度的溝通與適時的對話都是讓羈絆變得更鞏固、讓這段關係能走的更遠的必

  要過程。《數碼寶貝02 THE BEGINNING》可以說相當直白的將這件事透過類的故事傳達給

  觀眾知道，而觀眾基本上也能夠很清楚的接下這訊息。



  只是就我自己來看，其實會有點不知道這部電影的目標族群是誰？對於成人觀眾而言，劇

  情過於簡單、戰鬥篇幅偏少不是問題，可問題是整部電影有四分之三的都在對話，片長不

  過短短80幾分鐘卻給人很冗長的感覺，看到最後是會很提不起勁來看電影向觀眾呼籲溝通

  的重要性的這件事。可是對孩童來說，本集的劇情略嫌沈重，孩童不見得能夠理解劇情，

  尤其是前半段劇情根本就是恐怖電影，別說孩童、我想就連讓數碼寶貝陪著自己長大的觀

  眾都未必可以接受看到烏科獸死亡方式是邊哀鳴邊融化成泥、而烏科獸將自己眼珠塞進類

  的眼眶還笑著說「這樣就看得到了」根本也是在毀人童年。


  《數碼寶貝02 THE BEGINNING》雖然還是有帝皇龍甲獸等跟其餘兩隻合體進化的古神獸跟

  人面戰鷹獸、就連天女獸都有出場，但其篇幅也只能算是出場給觀眾懷舊一下的龍套性質

  ，整體基本上是文戲多過於武戲，若是期待會有更多進化場面與戰鬥畫面的粉絲觀眾或許

  會感到失落，與最後烏科獸的戰鬥亦是船過水無痕。不過即便如此，聽到熟悉的旋律響起

  內心確實還是有感到激動，而且對我而言戰鬥場面的多或少並不重要，重要的是電影有沒

  有好好說完一個故事，畢竟就像前作的太一等人一樣，人長大了看事的角度不一樣，心態

  上的轉換同樣也是。20年後的劇場版就像是與過去的童年的道別，例如《數碼寶貝 LAST

  EVOLUTION 絆》或者是另一部動畫劇場版《 尋找小魔女DoReMi》就有好好說再見，相比

  之下《數碼寶貝02 THE BEGINNING》的再見說得太輕也太草率了。


  《數碼寶貝02 THE BEGINNING》依然是在賣童年情懷，許多熟悉又陌生的臉孔都有出現，

  包含那些在《數碼寶貝大冒險02》裡那些世界各地協助大輔等人關上數碼寶貝世界大門的

  孩子們，但就也是僅僅客串露個臉。除此之外，我自己對《數碼寶貝02 THE BEGINNING》

  的評價是比上不足，比下還不知道，因為就連很有愛的第一部與第二部都能這樣了，後面

  《數碼寶貝訓獸師之王》、《數碼寶貝無限地帶》或者是《數碼寶貝拯救隊》等實在不知

  道會不會變得更無感？


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --

  10/28 15:04

  tri.就別提了吧'
