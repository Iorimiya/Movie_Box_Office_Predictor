title: '[新聞]聖鬥士星矢The Beginning美國人也不買單，'
content: '《聖鬥士星矢The Beginning》美國人也不買單，北美上映IGN評4分：Bad






  《聖鬥士星矢The Beginning》真人電影 5月12日在北美上映，外媒IGN對其進行了評測，

  並打出4分。IGN認為該電影平平無奇，視覺效果乏善可陳。


  IGN評分：4分 差勁


  《聖鬥士星矢The Beginning》視覺效果乏善可陳，講述故事相當笨拙，未能激發觀眾的

  興奮點，無法滿足對未來續集的憧憬。


  IGN總評：


  《聖鬥士星矢The Beginning》真人電影視覺的效果乏善可陳，讓觀眾對未來續集失去憧

  憬。該電影想吸引新人進入車田正美幻想世界並不是特別成功，因為其並沒有呼應動漫創

  作者的願景。導演托馬斯·巴金斯成為了動畫作品影視化的受害者，他們更關心未來作品

  而不是一個成功的開端。車田正美的生動素材被濃縮成一份平平無奇且略顯嘈雜的東西。




  先前電影於 4月28日起於日本、羅馬尼亞、墨西哥、哥倫比亞4國率先上映，3日僅錄得

  240萬美元票房，《聖鬥士星矢The Beginning》的根據地日本全國近300多間戲院上映，

  甚至僅得36萬美元收入，入座率不足5％！日本票房甚至還不及墨西哥3日100萬美元的3分

  1。


  本片製作費為81億日元，相當於台幣18億。照這樣的趨勢往下走，電影恐怕很難回本。原

  本期待美國上映看看會不會有反轉的情況出現，不過現在看來《聖鬥士星矢The

  Beginning》的小宇宙要在大螢幕上燃燒恐怕是很難。東映之前靠《航海王劇場版：紅髮

  歌姬》賺來的92億日圓、跟《灌籃高手 THE FIRST SLAM DUNK》賺來的100億日圓也要吐

  出來大半




  新聞網址：





  ==============

  看到那個雅典娜老阿婆,誰還會想進場

  找個AV女優來演都好多


  --'
