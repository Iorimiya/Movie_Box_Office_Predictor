url: https://www.ptt.cc/bbs/movie/M.1698397033.A.E23.html
title: '[普雷] 數碼寶貝02 THE BEGINNING'
content: '不專業心得誤戰


  其實跟上一部真結局沒有太大的關聯

  只看到太一跟光子郎一點點篇幅

  我覺得這部搞不好像片名一樣

  只是續作的「開始」，tri……。


  第一部的代表物是蝴蝶

  第二部我還真的看不出來有什麼代表物


  會這樣說是因為第一部的劇情跟元素

  都有關連性。

  歌名、靈蝶獸、亞古跟加布消失後轉場

  兩隻蝴蝶飛走、光叔。

  看過片段都知道胃有多痛……


  但這部的指標性物品是一顆蛋

  類的故事起源也是從蛋開始

  可是就沒這麼有關聯性

  烏科獸好像有點眼熟啊….(哥瑪獸+海天使獸)


  神聖計畫的消失+片尾我覺得暗示性很強烈

  我看到片尾彩蛋第一個感想是

  難道要出新玩具了嗎？

  因為神聖計畫從卡通看來都是重要性的物品

  象徵被選召的孩子、進化時需要以及

  進入數碼世界的鑰匙。

  可是本篇內容卻完全不是這樣表示……


  看到劇中高潮的時候還會在想這麼多蛋！

  難道亞古獸跟加布獸有機會回來嗎！？

  結果什麼都沒有哈哈哈。


  劇情有回到過去這種安排就不贅述了

  每個人過去都有犯錯，但現實是不可挽回的

  畢竟都是長大後才知道以前有多蠢多想彌補

  這些內容就不多加討論了。


  建議當作

  數碼寶貝02 第一章 THE BEGINNING

  來觀看會比較輕鬆一點。

  如果是以第一部續作跟期待來看

  那我必須說你會失望


  --'
