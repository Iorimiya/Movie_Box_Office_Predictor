title: '[普好雷] 神劍闖江湖 the beginning'
content: '對於原著追憶篇

  我沒看過漫畫版但看過無數次的OVA版

  身為一位40的大叔想寫寫看過OVA及電影版的心得

  然後大叔本人文筆不好及電影手法素養也沒有很高

  請鞭小力一點



  如果沒有看過任何原著來看電影版

  那麼這部電影是好雷



  但對於OVA粉絲的我來說這部電影

  只能給到普雷



  個人觀點


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  這部電影改編的是公認OVA神作

  而且沒有太多誇張的動作場景(白話就是真人也辦的到的動作)

  現成的歷史背景+神級劇本+甚至台詞 電影照著演也不會差到哪去

  但電影跟OVA比較起來還是差了一截



  血雨

  白梅香在這部戲裡是跟雪代巴畫上等號

  但電影裡對白梅香的描述少之又少

  尤其是血雨這段沒有讓劍心聞到白梅香

  巴暈倒方式也挺出戲的



  劍鞘

  小五郎怕劍心只會殺人而走火入魔

  找巴聊聊時要巴當劍心的劍鞘

  電影則是小五郎不希望巴讓劍心的刀鋒頓了?

  或許劍鞘原意也是不要讓刀變頓

  但2句台詞說出來的表達方式不太一樣

  日文台詞不曉得有沒有改?還是台灣翻譯不同?



  兩人互動  (這段我不太會形容)

  電影版在巴問劍心是不是會殺她時及要去大津避風頭

  都有把主動權給了劍心

  OVA版裡劍心要到避風頭後才開始軟化

  雖然電影在巴死後藉由巴的日記讀白 說出巴對劍心的情

  但我更喜歡OVA的方式呈現

  最經典的在雪中跌倒那幕讓巴徹底暈船沒有用上實在有點可惜



  擋刀

  電影版巴擋刀時的表情  真的不行

  雖然OVA沒有帶到巴的表情就是

  而劃刀疤時電影版是:很抱歉  親愛的

  OVA是:對不起 夫君

  一樣日文台詞不曉得有沒有改?還是台灣翻譯不同?

  對不起 夫君 這句話我認為是這部戲最令人揪心的時刻

  有人說是對劍心講的 因為清里只是訂婚

  但我認為一句雙關

  對清里說 對不起 沒幫你報仇 (手持短刀劃劍心)

  對劍心說 對不起 我害了你

  (其實作者也說 這句是對劍心講的)




  最後最後燒房子的BGM..........算了吧


  以上是一個外行人對電影版的小小心得

  要鞭就鞭小力點吧






  --

  我也是看網飛版 印象很深刻 很抱歉 親愛的...

  7/30晚上看的 真的是我記錯嗎? 我看完電影版有在立馬看巴哈OVA版

  巴哈是很抱歉 親愛的(中午確認過)'
