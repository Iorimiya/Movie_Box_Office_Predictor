url: https://www.ptt.cc/bbs/movie/M.1627709095.A.BB9.html
title: '[好雷] 神劍闖江湖 the beginning'
content: '雷文防雷資訊頁


  感謝NETFLIX讓我在疫情期間還能看到神劍的電影


  相較於一個多月前上架的the final


  這次的the beginning因為沒有在電影版演成腦殘的左之助戲份


  個人是相當期待的


  以下和版友分享幾個覺得這次的影片幾個感想


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  首先是角色部份


  佐藤健不知是不是變更瘦了，


  演幕末時期的比較無法呈現十幾歲的少年感


  和其他志士相處時也是冷血劊子手表情


  雖然劇情和漫畫走向一致，但少了和其他志士間的搞笑片段





  有村演的巴因為造型修飾，其實感覺還不錯


  江口洋介覺得新撰組時期的他造型顯的更老有點悲劇


  村上虹郎演的沖田總司，有時會被他奇妙的髮型吸引視線




  再來是打鬥部分


  相較前幾集拿逆刃刀的劍心，


  幕末時期拿真刀砍人的拔刀齋刀刀見血相當有迫力


  中間還增加了漫畫沒實際演出的拔刀齋與沖田總司的對戰


  只是最終與闇乃武的刺客們決戰因為與漫畫劇情的改編有點差異


  電影與原作相同 闇乃武將巴安排在拔刀齋身邊讓她變成拔刀齋的弱點


  但漫畫中是告知巴被抓走，在能喪失直覺的森林中安排陷阱與拔刀齋對決


  拔刀齋就在狂怒模式下前來，戰鬥相當狠





  但電影改成拔刀齋先知道巴是間諜，失魂落魄的去決戰，


  覺得沒有大決戰的衝擊力有點可惜


  最後巴拿著刀劃傷了劍心的臉這段改編不知版友感受為何？


  我是看不太懂就是(原作是手上的刀落下劃傷)


  雖然這部文戲居多，但因為沒有左之助(一定要再鞭一下)所以其實不太會出戲


  希望當年看過神劍的各位有機會的話務必看下


  --'
