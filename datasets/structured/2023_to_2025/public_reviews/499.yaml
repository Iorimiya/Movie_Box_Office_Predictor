url: https://www.ptt.cc/bbs/movie/M.1633528875.A.315.html
title: '[請益] 關於神劍闖江湖 The beginning'
content: '各位大大好

  最近終於看了神劍闖江湖 最後兩章

  The final & The beginning

  對於The beginning 一直有個問題看不明白

  有查過網上好像沒有人問過

  特別問一下還請大家解答

  問題會涉及劇情有雷請小心


  ——-以下有雷———

























  ————防雷線————-


  最後雪代巴死的時候

  用小刀在劍心臉上劃了一刀

  為什麼要這麼做呢？

  好像沒有特別理由

  感覺是編輯為了十字疤痕圓滿特別編的？


  有大大能解答嗎？

  感謝




  --

  10/06 22:05


  原來是這樣感謝大大解答



  嗯嗯 感謝解答 我困惑好久 哈哈哈'
