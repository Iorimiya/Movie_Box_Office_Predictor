  女主穿上戰鬥服奶會變大

  機體很EVA動作很鋼彈

  武器使用會刻畫真實細節（像頭部火神炮）

  有EVA的十字爆炸

  .

  整部有不少鋼彈和EVA要素在裡面

  IF路線很有趣，期待動畫開播時如果薩比家有登場會是怎樣的形象




  -----

  Sent from JPTT on my iPhone


