url: https://www.ptt.cc/bbs/movie/M.1593699991.A.362.html
title: '[好雷] 愛情，是開始還是結束 Endings Beginnings'
content: "Drake Doremus 第六部愛情片《愛情，是開始還是結束》上週末終於上映了！不過我上週末一刷坐前排看得很煩躁、這週二刷坐後排倒舒服許多，誰叫他這次把他描繪戀人耳鬢廝磨的「近距特寫」手法玩到鋪天蓋地、有時令我看到天旋地轉喘不過氣來？且先不提觀影舒適感，就來說說它的故事內容好了：也許正是我對他有「第六部愛情電影」的預期心態，才造成了一刷的落空與茫然、二刷才漸漸搞懂\
  \ Doremus進展到了什麼階段又想談些什麼。這部《愛情，是開始還是結束》真的是一部「愛情片」嗎？其實光看主角格局，我們大概可以發現事有蹊蹺：\n\n 2011《愛瘋了》\
  \        Felicity Jones x Anton Yelchin   遠距戀愛；\n 2013《生活如流水》        Guy Pierce\
  \ x Felicity Jones  禁忌戀愛；\n 2015《禁愛世界》      Nicholas Hoult x Kristen Stewart 冒死戀愛；\n\
  \ 2017《我們的愛情一言難盡》Laia Costa x Nicholas Hoult  開放戀愛；\n 2018《柔伊》             Lea Seydoux\
  \ x Ewan McGregor   跨界戀愛；\n 2019《愛情，是開始還是結束》Shailene Woodley 竟吃兩男大玩三人行？\n\n\n\n\
  看完《愛情，是開始還是結束》兩次後，我很肯定此片不再是雙主角愛情故事、而是單主角成長故事，單主角是海報居中有雙面的 Shailene Woodley 、海報兩角\
  \ Jamie Dornan & Sebastian Stan只是她的小狼而已 XD 細看女主角 Daphne 和兩位小狼 Jack & Frank 的兩對關係，都缺乏\
  \ Doremus此前每部電影中那種真命天子互許終身的契合與堅貞，反而都比較像是萍水相逢玩玩再說一起享受人生的過客。他們這兩段關係在 Doremus前作中最似曾相識的，大概就是《我們的愛情一言難盡》中那種一夜情約炮關係吧，只是比一夜情進步一點的同居與多夜情罷了\
  \ XD\n\n的確，仔細檢視此片 Daphne x Jack與 Daphne x Frank 這兩對，都沒有什麼愛到天荒地老、都沒有什麼非卿不娶或不嫁，甚至他們之間別說大吵大鬧渴望破鏡重圓、就連小吵小鬧彼此磨合認識也沒有\
  \ XD 仔細想想我根本不覺得這兩段中有哪一段真能叫作「愛情」、而覺得充其量只是怕寂寞而「找個伴」的耽溺。說實話，此片開頭的主角旅程也並沒騙觀眾說是愛情片，反而\
  \ Daphne 與她「畫畫聊天俱樂部」的姐妹們都說了：「我這一週分手了、辭職了、搬進姊姊家裡了」，換來俱樂部阿姨 Ingrid 認真告訴她 \"Take a\
  \ break\" ，過一段沒男人沒酒精、專心傾聽自己的日子。\n\n當然一部青年偶像明星 Shailene Woodley 的電影，是絕不能就這樣清心寡慾韜光養晦演完兩個小時的\
  \ XD 電影當然不是讓她清心寡慾作戰成功、而必是要讓她心猿意馬一敗塗地的。只是好像我們觀眾得要在此建立好觀影的心裏準備了：她接下來不論忍不住參加多少派對犯多少酒戒、不論不爭氣地對多少遞酒給她的男人犯下色戒，那都不會是此片真正要追尋的事物、而只會是此片追尋之旅的過眼雲煙。真要追尋的，到電影最後才讓俱樂部阿姨明確告訴她：「妳現在最該愛的不是好男\
  \ Jack 、也不是壞男 Frank」、甚至還不是妳肚裏的小生命、「而是妳自己」。\n\n\n\n原來 Doremus拍了五部男女愛情片後、終於要來拍部女性自己的「自愛」片？的確，談論愛情這題材，回到原點還是先「認識自己」，其實那才是做好準備向外發展關係的健康起點，雖然我們人間發展關係的人總不是這麼健康地啟程的\
  \ XD 不過我很高興 Doremus對愛情片的探索碰觸到了這一塊，回想過去五片中好像只有《生活似流水》與《我們的愛情一言難盡》兩片男主角是帶著過去陰影來戀愛的，甚至他們兩位的「過去陰影」也僅止於上一段關係而沒再多往上爬。而這部新片的女主角\
  \ Daphne 表面談著當下的戀愛、其實心裏想著上一段舊情、甚至還有家庭童年的陰影...\n\n本片 Daphne 剛開始很快速地分了一個舊男友 Adrian\
  \ ，接下來在與兩位男主角調情約會甚至回家上床時，這位舊男友還常常出現在她浮光掠影的回憶戲份裡揮之不去！在她心裏佔的地位很顯然遠高於兩位大明星飾演的男主角。只是\
  \ Doremus對他的刻畫是很隱晦的，沒給過他超過 15 秒的戲份，而只透過各種片段回憶與旁人的隻字片語等觀眾自己去拼湊。我們隱約知道他是個好男人、相較之下\
  \ Daphne 是個壞女人；也隱約知道他對 Daphne 有點理所當然、但 Daphne 對他卻有點卑微迎合；總聽 Daphne 自況「和他在一起什麼都對了」、但「沒和他在一起什麼什麼都不成」。\n\
  \n真的「沒他在一起什麼都不成」嗎？這則要談到她的第二個陰影：是她從不想談更不想面對甚至潛意識裡連回憶戲份都極少的，那一次沒有男人保護的酒吧員工小聚會，她有位「前老闆」Jed\
  \ 趁著酒酣耳熱加上點權力關係做了那件令人不願想起的事情，令 Daphne 彷彿遭受創傷症候群般只要提起這個名字這個晚上這段回憶就「什麼也不記得了，別問我」。於是，她真的能如畫畫俱樂部阿姨\
  \ Ingrid 所說的「沒酒精沒男人專心做自己」嗎？她很想、但不覺得自己做得到，仍然不爭氣地還是要找新男人。而這「唯有找到一個個新男人才有未來」的心結，恐怕更要上溯到童年...\n\
  \n\n\n結果本片連 Daphne 的媽媽姊姊都很有戲！雖然那戲份時間實在不太夠、頂多只是出來兩三場，但她們有限戲份中好像都很努力要丟出最多訊息、讓我們更接近\
  \ Daphne 那並不健康的家庭背景。這位收留 Daphne 的姊姊 Billie 看似一家三口和樂融融、看似與失敗妹妹剛好對比的人生勝利組？結果她還不是一直在開派對刷存在感、但其實和丈夫吵架被看見？媽媽\
  \ Sue看似是個中產貴婦又交了個好男友、能夠像個穩重的媽媽邀請女兒來家裡過聖誕？但其實媽媽ㄧ生不停換男人的忍辱負重女兒也都看在眼裡、還等媽媽哪天終於願意敞開心胸理直氣壯地向女兒坦承箇中甘苦...\n\
  \n說到底，恐怕 Daphne 的這個全女人家庭都有嚴重的「父親情結」（記得《生活如流水》女主角也是一樣），也讓此片前段中段一度煞有其事地拿出個彷彿 Daphne\
  \ 心裏錨定的「媽媽戒指」、到最後才揭露那其實是「爸爸戒指」只不過是個拿來搪塞贖罪的東西... 到底男人可不可靠呢？要找哪個男人才是可靠呢？這個「可靠」問題在\
  \ Doremus前片《我們的愛情一言難盡》中已透過比利時兩性關係大師 Esther Perel 之口開啟了討論、癥結恐怕就在人進入關係時的「安穩 vs 冒險」兩種慾望的相成與相衝，那我們來看看\
  \ Daphne 這趟「單身禁慾時光」遇到的兩位男人吧。\n\n這兩男 Jack & Frank 就是經典的「安穩 vs 冒險」對立之化身，兩人就這樣好死不死在同一場派對分別勾搭上了\
  \ Daphne、Daphne 事後才赫然發現好死不死兩人竟是換帖好友，但分別約會後又覺得對方各自打開自己一部分開關、既投射自己不停被愛的激情幻想也滿足自己渴望依賴的家庭陰影...\
  \ 到最後，寶寶就這麼出乎意料卻也不意外地降臨了，到底是哪一隻小狼該負責任呢？或是說，她自己又希望是哪隻小狼要負責任呢？\n\n\n\n本片竟就這樣保留模糊不說破！孩子是誰的已經不重要、甚至愛情該歸於何方更是不重要，重要的是「孩子是我的」、愛情的歸屬也是「我要愛自己」。說穿了，本片當下線裡佔了\
  \ 95%戲份的這兩男都只是過客，女主角 Daphne 真正的陰影都存在於僅佔了 5% 戲份的過去那兩男。過去那兩男，一個是極端狼性的獵食者 Jed、一個則是極端依賴的父親形象\
  \ Adrian ，談起認真的「健康關係」時真有哪位是獨立平等的戀愛良伴嗎？\n\n那恐怕都是「不」，甚至關鍵也不在他們兩位各自的人格優點與缺點，反而在 Daphne\
  \ 自己看待他們兩人的方式：嚮往一位激情壞男每天有刺激、或嚮往一位愛家好男每天安穩有依靠，真的就是我的人生歸宿嗎？寶寶這個照妖鏡一出來，兩男各有誠心卻仍然幼稚的少年心性馬上就現形：\
  \ Jack 雖然閱讀很多關於「開放關係」的文章看似開明、Frank 平日甜言蜜語一往情深看似為了我倆什麼都可以，但考驗來臨真能面對嗎？\n\n也許許多觀眾很難理解為什麼在這個物理上最需要有男人支撐的「懷孕生女」時刻、本來很花癡地腳踏兩條船的\
  \ Daphne 竟然把兩男通通退了貨？難道是有什麼自虐心態誓言奶瓶尿布柴米油鹽全都自己扛？難道不覺得只管射精後想著擦掉 \"potential babies\"\
  \ 的幼稚男人應該要負什麼責任嗎？結果倒還挺令我欣慰的： Daphne 決定「與其愛人不如愛我自己」、「寶寶就是我人生的新考驗」，此前煞有其事單身禁慾大作戰，儘管很快就棄械投降不爭氣地愛了兩個小男人，但透過這段過程幾經體悟得到的「自愛」結論不正是展開獨立人生的里程碑？\n\
  \n\n\n我個人的人生觀，一直覺得「愛情」並非人生之必要，反而愛情作為一個過程能夠展現更廣的「人情」才是真重要。以這種心態來看《愛情，是開始還是結束》的故事發展，好像應該對女主角\
  \ Daphne 跳出傳統愛情窠臼而返璞歸真反求諸己的結局感到振奮吧？嗯，是挺振奮的，至少在 Doremus「愛情片」的格局上有走出全新的視野。只不過呢，我卻有種感覺，覺得這個女主角\
  \ Daphne 在當下線遇上兩大帥男各自擦出一場愛戀火花的火熱戲碼、與她這遭沈潛省思之旅並沒什麼必要的連結。當然，一個壞壞男與一位愛家男在當下出現是可以引起一些過去回憶，但要是沒出現呢？\n\
  \n這樣看來，不免令我覺得其實真正有意義的故事都在 Daphne 腦內回憶的小劇場、而其實兩位男主角跟她的耳鬢廝磨相濡以沫都只是配菜、而且請到男帥女美的黃金卡司吃定我們觀眾享用完配菜就飽了\
  \ XD 當然這樣說也不甚公允，畢竟此片 Daphne 這角色的美感就在於她的創傷與逃避。電影拍 95%當下的燈紅酒綠夜夜笙歌時、其實重點都是要看 Daphne\
  \ 的心不在焉與神遊物外，那體驗一堆人生就是不願去碰觸創傷記憶的尋尋覓覓鬼打牆、才真讓 Daphne 這小女子吸引我們認同憐愛暗暗祝福她苦盡甘來。結果呢，本片難道那\
  \ 95%都只是在賣好看、純粹烘托那 5% 成長故事嗎？\n\n就我看來好像真的是如此，這兩位美貌男主角真的都只是不痛不癢的過客，只是告訴女主角她其實真正的課題都不在眼前、而是在過去，想通了就回去面對侵犯自己的惡人、想通了就寫封信回去給真正想念的那人。說穿了兩位美貌男子對這一切也並不知悉、就這麼不痛不癢毫無概念地欣見\
  \ Daphne 驀地豁然開朗迎向新人生，兩人當然都是誠懇的男子願意負責養寶寶、但媽媽說「孩子不是你的也不是他的而是我的」輕鬆解了套 XD 傷心女子學習面對自己的獨身之旅，有兩個帥男陪伴從不無聊、還得到了一個孩子鼓勵自己做更好的人，這幸福人生應有盡有豈不快哉？\n\
  \n\n\n回想起來，我漸漸發現為什麼我一刷看得很不耐煩、而二刷很專心看後才漸漸搞懂了故事，因為此片的戀人約會出遊派對絮語等戲份都好行雲流水，一場場戲往往都看不出什麼具體的劇情意義來，甚至事後回想起來也想不太出來。看起來\
  \ Doremus喜歡的即興發揮風格，這次有一點失控而散焦，令我看一場場戲往往看不出所為何來、看兩段愛情走這一遭也如過眼雲煙。另外，Doremus 從《禁愛世界》裡發展出的近鏡頭特寫捕捉臉龐膚髮，在這次用得更近而且份量更重！譬如中間有一大段\
  \ Daphne & Frank 的大臉輪流佔掉半個銀幕，配上背後離焦的點點燈火，我都快看暈了。\n\n不過我感到的煩躁和空虛，視覺效果還是其次，主要還是這個愛情（或成長）故事的核心主題在哪裡，這點在片中很難清楚感受到。譬如《愛瘋了》有國家體制的禁愛考驗、《生活似流水》有郊區中產的禁錮窒息、《禁愛世界》有機械化世界斬斷七情六慾、《我們的愛情一言難盡》則談開放關係一味外求的迷思、《柔伊》則一次次提問我們人機異己愛是否失能...\
  \ 而這次《愛情，是開始還是結束》呢？也許片名 \"Endings, Beginnings\"是在說「兩人愛情的結束」也許正是「自己新生的開始」？\n\n好吧，要說主題還是有的，只是我覺得全片談這主題談得少而隱晦、倒是俊男美女燈紅酒綠拍得又多又美，而且這次\
  \ Doremus終於有了個猶勝老配樂搭檔 Dustin O'Halloran的新配樂家 Philip Ekstrom ，他的情境配樂與流行選曲「法蘭克悲傷歌單」總令悲傷的主角享受人生左右採擷心花朵朵開，尤其\
  \ Daphne 片尾大徹大悟後回頭與人生每一段關係重新修好的暢然，那段鋼琴配樂真是 Doremus歷年電影中第一呀！無獨有偶，攝影機好好跟拍 Shailene\
  \ Woodley 的巧笑倩兮與眉頭深鎖、跟拍年輕人們的杯觥交錯相聚一刻、跟拍華燈初上與陽光花草... 都有美出新高度！\n\n\n\n結論：此片要說故事嘛，故事密度不高節奏也不清楚、角色眾多往事更多但都很浮光掠影，只是俊男美女的情愛綿綿與年輕人的夜生活風情是挺迷人的，也許比起拍一部認真探討議題的劇情片、Doremus\
  \ 這次更想拍一部令人陶醉的 MV 吧？這週我居然把 Doremus愛情片全複習完了！Doremus 電影中，1.《愛瘋了》、2.《生活似流水》、3.《禁愛世界》、4.《我們的愛情一言難盡》、5.《柔伊》、6.《愛情，是開始還是結束》中，我的排名是\
  \ 1>2>5>4>6>3，不知版友們看過幾部又如何排名呢？\n\n\n--\n我覺得很正常，畢竟兩個都是鬍子男，身高比起女主角也看來差不多，而且 Doremus這次的「燈紅酒綠」攝影構圖當中，往往亮的都是背景燈泡、暗的都是主角面孔\
  \ XD 大家都變成剪影了"
