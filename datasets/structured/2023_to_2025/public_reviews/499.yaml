title: '[好雷] 神劍闖江湖 the beginning'
content: '追憶篇今天終於上了，身為一個漫畫粉當然是有時間馬上看完。


  整體來說還原度相當的高，以漫改電影來說在水準之上。


  當然整部影片也不能說沒有缺點，我個人認為最大的問題就是影片的開頭，難以想像劍心

  會用出咬耳朵，嘴咬刀（跑錯棚？）這段我個人私心認為是扣分的。


  而其他增加的劇情則是算是有加分，對決沖田總司算是蠻意外，畢竟原作只有幾格帶過，

  也可以知道日本人真的是很喜歡沖田，連三段刺都有還原。


  上映前很多人對有村架純飾演雪代巴是一片哀嚎，看完影片，我個人認為她演的相當不錯

  ，

  當然臉的大小問題無解，不過有好好用髮型掩飾。


  比較可惜的點是沒有還原志志雄處決飯塚的片段只用對話草草帶過。


  我是看的相當滿足，一個漫畫粉的身分私心給好雷。


  --'
