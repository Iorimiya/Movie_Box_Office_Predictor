url: https://www.ptt.cc/bbs/movie/M.1686128624.A.96F.html
title: '[ 好雷] 變形金剛:萬獸崛起- A New Beginning'
content: '從2007年變形金剛系列第一集迄今，這是該系列第六集，從一開始要帥哥美女-西亞‧李畢

  福與梅根‧福克斯來作顏值擔當，到第四～五集馬克‧華伯格的騎士情懷，現在第六集由波

  多黎各裔安東尼‧拉莫斯和非裔多明妮可‧斐許巴克來當男女主角，取向變成鬥智鬥力，要

  拯救世界也有渺小人類的關鍵貢獻，可以用“哈比人”小兵立大功來比喻。


  在變形金剛系列片尾的傳統，柯博文都要仰視天空宣誓一番大道理，這次仍然原汁原味地保

  留，我覺得這次比較有看到跨物種間的兄弟情誼，至於是不是美國主流的“政治正確”，真

  的不必多做聯想。以不劇透爆雷的角度來說，大戰中不必聚焦在柯博文身上，真的是一大進

  步，才有一家人共同奮鬥的熱血感！











  雷文防雷資訊頁-------------


  變形金剛系列的拍攝風格從前五集都可以看到大場面的爆炸，還有第一集帥氣俐落的機器人

  變身畫面，十足麥可‧貝風格，人類就是配角，要靠變形金剛來拯救，這種套路看到後面完

  全讓人疲乏，尤其第五集模仿英國圓桌武士的設定更是被人罵到爆，還好這一段歷史已經終

  結在2017年。


  這次的男女主角都不是顏值擔當，但是演技其實都不賴，女主角叫艾蓮娜，她年紀雖輕，還

  是紐約大都會博物館實習生而已，但是她靠著自學可以分辨古董贗品，在她的筆記中能夠找

  出關鍵解碼線索，就知道在最後大戰中，她應該可以有所發揮。不過這時劇情故意來個反轉

  ，讓星際之門控制平台被毀，眼看宇宙大帝(大魔頭)就要伸進大氣層來吞噬地球，還是靠柯

  博文決定犧牲自己來毀掉星際之門的鑰匙。


  這次男主角叫諾亞，有個罹患鐮刀形貧血症的弟弟，常常因為鐮刀形貧血危相(sickle cell

  crisis)需要住院，幾乎耗盡家產，要靠男主軍中退伍後來養家。諾亞在軍中資歷雖有擅長

  電子戰專長，可是很沒有團隊精神，所以一些資安公司也不敢要他。諾亞從愛護自己弟弟要

  籌錢為他治病，到後來誤打誤撞認識博派金剛幻影，成為跨物種的生死之交，讓他拯救地球

  的動機，比較有合理化的基礎，中間還有幾段對話是諾亞交代艾蓮娜，如果拿到鑰匙之後，

  要交給他摧毀，不要讓外星魔頭利用來摧毀地球。


  片中強大金剛的頭目金剛王是在第二幕才出現，牠出現時的霸氣和柯博文的領袖風格是不同

  的類型，前者聽過柯的事蹟，和卡通中的故事似乎可以對得上，金剛王願意相信人類，一起

  保護半截鑰匙，和柯博文滯留地球七年不相信人類，形成鮮明的對比。有人說強大金剛裡面

  的犀牛只有在出場時大聲嘶吼一聲，被當作騎獸，沒啥存在感，這也真是如此。


  大黃蜂在第二幕被恐懼金剛的首領瘟疫手刃失去火種源(能量)，後來拜魔頭宇宙大帝接近地

  球，釋放能量激發晶體礦物來讓大黃蜂復活，果然到了最後大戰中段適時投入戰場，讓快要

  被壓制滅頂的博派與強大金剛可以反攻。我個人很喜歡諾亞融入他機器人兄弟幻影的身體中

  ，組合成新鋼鐵人的戰鬥體，有種兩人同心，其利斷金的氣魄，後來果然小兵立大功，還幫

  助柯博文逃離爆炸現場。


  持平而論，萬獸崛起在變形金剛系列不到讓人封為神作的地步，但是至少是一個新的開始，

  這是從2018年大黃蜂電影的溫暖基調繼續延伸，有傳承人類與機器人和解共生的意涵，算是

  一部可以穩住粉絲票房的作品。從五月中旬迄今一直看到PTT電影版在討論小美人魚的選角

  爭議，個人認為女主演技需要磨練，反觀本片女演員多明妮可‧斐許巴克可以撐得起劇情推

  動的任務，最後搭機回美時還靠在諾亞胸前，未來可能還有戲吧？


  總而言之，在接下來大片頻出的暑假，我覺得看完萬獸崛起會有好心情，就請放鬆心情來享

  受這個關於brothers的故事吧！



  --'
