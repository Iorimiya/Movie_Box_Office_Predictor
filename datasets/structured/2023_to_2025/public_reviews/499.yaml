url: https://www.ptt.cc/bbs/movie/M.1602414680.A.1E6.html
title: '[情報] 2021 喬治亞奧斯卡代表：《Beginning》'
content: '喬治亞在昨日也公布了申報明年奧斯卡「最佳國際電影」的作品，沒有意外的是才在聖塞

  巴斯蒂安影展中橫掃多項大獎的《Beginning》。




  《Beginning》是喬治亞女導演 Déa Kulumbegashvili 的首部長片電影作品，今年先是被

  坎城影展選為授予 2020 正式入選的標章，但因為影展取消並沒有在此首映。而後該片被

  聖塞巴斯蒂安影展選入「主競賽單元」當中，最終以新導演之姿橫掃了包括最大獎「金貝

  殼獎」、最佳導演、最佳劇本以及最佳女演員四項大獎，並在早先日子前也在正式舉行世

  界首映的「多倫多影展」中拿下了費比西影評人獎。此外該片也再度被紐約影展選為的正

  式觀摩片。


  好消息是，原本今年取消的坎城影展即將在 10 月底回到棕櫚灘上的「節慶宮」進行三日

  的放映活動，除了將展映原本入選短片競賽與電影基石單元的作品外（也將正式進行評選

  ），還會特別放映四部原本入選坎城影展的長片作品，其中即包括這部《Beginning》，將

  光榮回到坎城中供民眾們觀賞。





  《Beginning》描述在一個寂靜的小鎮上，一個「耶和華見證人會」的社區遭到了極端份子

  的襲擊，他們的「王國聚會所」遭到縱火並且燒毀。女主角 Yana 是該會領導人的妻子，

  目睹這一切的他理解到世界正在逐漸瓦解，對父權制宗教社區內的生活感到失望的 Yana

  內心的不滿與欲望也同時的悄悄在加劇著。


  因為歷史背景的關係，喬治亞在 1996 年才開始報名競逐奧斯卡的外語片／國際電影項目

  ，在這 20 多年間總共入圍過一次五強和進入過一次短名單當中。首次入圍即是他們開始

  報名的當年，以《戀愛中的廚師》獲得提名。而後在 2014 年則睽違將近 20 年以《一座

  島的永恆》入選了短名單之中。



  2019：《Shindisi》

  2018：《Namme》

  2017：《在手臂上寫作的女人》

  2016：《屋中魅影》

  2015：《Moira》

  2014：《一座島的永恆》

  2013：《初綻的青春》

  2012：《攝影中，請微笑》

  2011：《Chantrapas》

  2010：《Street Days》




  --'
