url: https://www.ptt.cc/bbs/movie/M.1698586564.A.0D9.html
title: '[新聞] 《數碼寶貝02 THE BEGINNING》片山福十'
content: "新聞網址：\n\n動畫電影《數碼寶貝02 THE BEGINNING》以第2代超人氣角色為核心，揭開數碼寶貝與「\n被選召的孩子」之間未為人知的秘密，其中，為熱情又堅定的靈魂人物「本宮大輔」擔任\n\
  配音的聲優片山福十郎透露，他是因為《數碼寶貝》更加堅定自己的聲優志向。《數碼寶\n貝02 THE BEGINNING》以數碼世界冒險的10年後為舞台， 20歲的本宮大輔與其他被選中\n\
  的孩子們，從外型到生活都有了顯著的變化，某天，大輔和他的朋友們遇見了神秘青年大\n和田類，他宣稱自己是「世界上第一個與數碼寶貝建立搭檔關係的人類」，原來，所有被\n\
  選召的孩子誕生背後，都隱藏著過往年幼的大和田類不為人知的願望。\n\n《數碼寶貝02》中的靈魂人物本宮大輔個性堅強、從不輕言放棄，與同為被選中的孩子們\n擁有深厚的情誼，從小就立誓將來要開一家全世界最棒的拉麵店。10年後在《數碼寶貝\n\
  02 THE BEGINNING》裡，他已經是料理專門學校的學生，同時也在拉麵店裡精進自己的廚\n藝，每當拉麵店公休時，他就會借用店面小試身手，與搭檔的「V仔獸」一起研究拉麵的\n\
  風味與口感，持續朝著夢想前進。阸n優片山福十郎從2020年的電影《數碼寶貝Last\nEvolution絆》開始，為本宮大輔配音，他的表現受到廣大粉絲們認可，使他備受鼓舞，\n\
  同時擁有演員及邦樂演奏者等身分的他說：「一開始當聲優其實有些誤打誤撞，也有過迷\n惘，是聲演了《數碼寶貝Last Evolution絆》裡的本宮大輔讓我更加確信自己選擇這條路\n\
  是對的。」\n\n酑陘F讓配音效果更貼近角色，片山主動邀請為搭檔V仔獸配音的野田順子一起吃拉麵，\n他說：「因為大輔與V仔獸總是每天形影不離，最大的興趣就是研究拉麵，於是我才提議\n\
  一起去吃拉麵，想不到她爽快答應，以角色設定來說，我們必須有共同的日常習慣，才會\n變得更親近，更容易透過聲音來展現默契，因此我很主動邀約她，野田小姐不僅是個很好\n\
  相處的人，對拉麵也很有研究，最令我驚訝的是，為了演出V仔獸她竟然努力要求自己的\n聲線要與20年前相同，這種敬業精神讓我感到很佩服。」\n\n醻孕迠隊l則是很客氣地表示，「自從2000年第一次為V仔獸配音，我就很喜歡這個角色\n\
  ，這次的作品將描述《數碼寶貝02》的起源，讓我覺得特別有意義，不論新舊粉絲都能一\n探《數碼寶貝02》的秘密，感受他們的友情、合作、智慧與羈絆，劇情在開朗愉快與灰暗\n\
  的場面中交織展開，感覺就像是搭乘雲霄飛車一般，全程緊張、刺激又熱鬧風趣，真心推\n薦給所有的大、小朋友。」她同時表示：「這20幾年過去，我的外表與內在都變得成熟了\n\
  ，但我還記得第一次配音的感覺，無論中間經過多少角色，我還記得V仔獸帶給我的感動\n，我對這部作品的初心也從來沒有改變過。」\n\n電影《數碼寶貝02 THE BEGINNING》台灣將於10月27日與日本同步上映，更多詳細資訊，\n\
  請上羚邦集團台灣官方粉絲專頁。\n\n--\n                                 10/29 21:36"
