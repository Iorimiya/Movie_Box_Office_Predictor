title: '[討論] 神劍闖江湖 beginning'
content: '今天有空終於看完了…






  以下討論有雷






  =========================






  雪代巴，其實就只是 斯德哥爾摩症候群吧？


  自己青梅竹馬的未婚夫被殺害


  帶著復仇的心來到劍心身邊埋伏


  日久生情，愛上劍心


  但也不能說是愛，就只是情感轉移到劍心身上



  而劍心武藝高超，想必雄性賀爾蒙一定爆表


  就這麼剛好來了一個不怕他的妹子每天貼身照顧…


  所以也就淪陷在這扭曲的愛情了




  這樣理解沒錯吧？是不是？




  結論：


  神谷薰才是唯一真愛。



  --





  這篇嗎？


  笑死'
