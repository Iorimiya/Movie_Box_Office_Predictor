title: '[好普雷] 神劍闖江湖從The Beginning到Final'
content: '雷文防雷資訊頁



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~














  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  因為網飛所以把全系列看完

  個人對這五部喜好

  The Beginning = 神劍闖江湖1 > 京都大火篇(以上好雷) > 傳說的最終篇 >> The Final


  五部電影在武打部分

  都有水平之上的表現

  畢竟飛天御劍流 = 跑酷劍術

  至於劇情部分就有明顯落差

  動漫改編無可避免地會遇到劇情濃縮與調整


  The Beginning原著劇情較短

  電影版幾乎把原著重現

  劊子手拔刀齋內心衝突

  緋村與巴的情感

  都交代的夠清楚

  不過因為有用神劍闖江湖1的畫面

  巴未婚夫的部分劇情有點不連貫


  神劍闖江湖1的部分

  大致是漫畫前6集

  左之助篇、刃衛篇、觀柳篇(不含御庭番眾)

  但劇情順序編排的很巧妙

  最後用小薰的對話

  讓緋村的心境

  從單純維持不祥之人的不殺之誓

  重回到開創新時代的最初想法

  在神谷道場中停止了流浪


  京都大火篇跟傳說的最終篇

  改編原著志志雄篇的內容

  京都大火篇

  有將志志雄竊國、復仇

  弱肉強食理念的部分表現出來

  但為了推動劇情

  電影後半綁走小薰就顯得很怪

  因為對志志雄來說與前輩的打鬥只是個娛樂而已

  更不要說海邊撿走緋村這種詭異的內容了

  不過相較於劇情

  最慘的還是角色的部分

  從這集開始角色出現影薄、崩壞情形


  傳說的最終篇

  劇情前半在奧義傳授

  但電影的比古清十郎不夠強

  沒有絕對的死亡感

  又怎麼學得會天翔龍閃

  劇情後半征討志志雄

  結果是十本刀雜魚化

  彌彥路人化

  更慘的是左之助邁向了破格之路

  值得稱讚的大概只有對決志志雄的戰鬥

  除了拍出志志雄的強悍

  也呈現了原著中前後任劊子手的心態對比


  The Final

  人誅篇的Final

  劇情部分有很大的問題

  首先沒辦法拍出雪代緣要否定拔刀齋的一切

  當然也看不出緋村新的一步

  但最慘的是

  為了配合演員牌子大小

  改變了角色的劇情與強度

  整部人設大崩壞

  彌彥就是個吃白食的

  蒼紫也路人化兼破格

  左之助破格到不出現還比較好

  小操強化到齋藤一水準

  日本政府拜託不要在派齋藤一帶隊討伐了(日本警察都快死光了)

  整個改編較好的部分大概只有清朝跟日本的衝突感


  整體來說

  神劍闖江湖系列電影是很有誠意的

  只是全系列拍攝時間前後大約9年

  對於系列作來說算是個蠻大的硬傷

  特別是The Final的部分


  --'
