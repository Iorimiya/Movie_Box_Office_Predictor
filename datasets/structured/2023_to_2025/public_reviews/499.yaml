url: https://www.ptt.cc/bbs/movie/M.1699399243.A.198.html
title: '[極好雷] 數碼寶貝02  The Beginning'
content: '反常的臨櫃購票拿到特典真的很開心，本身不算腦粉，小時候只有片段看過動畫，但是有

  一台WSC，所以情懷加成還是有的



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  數碼IP現在的特色就是人物會長大，對我來說就是一部描述長大的故事套著數碼的皮，所

  以期待打鬥的人失落感會很大，編排跟01一樣，最燃的OP一開始就給你



  因為接下來要告訴你




  故事的大綱其他文章都有描述了，新主角類的父母就是低端著人口，鳥科獸才是他真正的

  父母，







  終於嘗試溝通，像極了亞洲家庭...但是溝通之後呢？




  回家跟你媽說




  你覺得他會開心妥協還是再次決裂？


  也像極了對吧


  打倒鳥科獸，類得到一顆新的數碼蛋，就像長大的我們，有了小孩，這次你有主動權了，

  你願意溝通嗎？你會是個亞洲父母嗎？部分鄉民已經有答案了



  注意到了嗎？我整篇沒有提到其他角色，這就是負評如潮的原因，他們跟我們一樣都是看

  戲的，但是數碼02就像大紅燈籠、霸王別姬



  是一部身處亞洲文化才能享受的電影，我也沒想過數碼會搞成這樣，不過我很喜歡就是了



  --

  也很真心提醒跟數碼寶貝只是皮

  唉真假！現在才知道'
