title: 'Re: [討論] 神劍闖江湖 beginning'
content: '錯很大


  斯德哥爾摩症候群是個專有名詞，先決條件是：

  「被害人被加害人控制並威脅，並且相信不可能逃脫」

  造成的結果是：

  「在被害人脫離控制後，仍持續表現出對加害人的服從或同情」


  先決條件就不對了，巴是自己去找拔刀齋，從頭到尾也沒有被控制過行動

  結果上巴是認可劍心的理想，不是同情，也沒有正當化劍心殺清里這件事

  巴在最後給劍心臉上的那一刀，就是給這段仇怨一個交代

  （另一個解釋是跟無緣的未婚夫透過這兩道交叉的傷痕重新相會）


  巴對劍心的感情極其複雜，這是肯定的

  她對劍心的觀感轉變，是從認識到劊子手拔刀齋這層皮下的十幾歲少年開始

  見證他被理想驅使下日漸破碎的心靈，仍相信這是為了更好的將來

  最後才是被劍心的真情感動，並接受他的感情

  這中間找不到一點點斯德哥爾摩症候群的影子呀！


  總之薰黨洗洗睡吧，我大巴黨二十年前就贏了

  看巴的OVA「Trust & Betrayal」就狂勝那個不知所云的辛酸篇

  -----

  Sent from JPTT on my iPhone


  --


  --'
