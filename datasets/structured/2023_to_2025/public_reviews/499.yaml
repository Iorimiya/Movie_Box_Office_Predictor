  變成巴死前劃上去的\n\n開司砍死叛徒的片段刪掉(大概是沒預算)\n\n總的來說,如果照順序看,劇情還算順暢\n\n對我來說,扣分的點\n一個是節奏太慢\n一個是有村架純應該是藝人習慣\n\
