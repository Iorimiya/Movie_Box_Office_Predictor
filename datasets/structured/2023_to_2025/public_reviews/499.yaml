title: '[好雷] 派對才要開始The Party''s Just Beginning'
content: '《神秘博士》與《星級異攻隊》的蘇格蘭紅髮妹 Karen Gillan ，近年是以嗆辣美女形象在好萊塢大片亮相？不過她也像美國隊長 Chris Evans一樣有個導演夢說自己故事、拍了部夜遊城市的獨立小片初試啼聲。她的
  2018 電影《派對才要開始》由她自編自導自演、拍在她自己的蘇格蘭家鄉小城 Inverness、讓她繼續挺著一張招牌的憤世嫉俗嗆妹臉，只不過這次的憤世嫉俗不是拿來耍性感的、而是拿來面對毫無希望的末日。


  這個 Inverness是許多古老故事場景，譬如 Starz蘇格蘭劇《異鄉人：古戰場傳奇》這類的，因為它正是就是蘇格蘭高地的歷史首府。只是自雅各賓黨起義失敗後
  Inverness就是個英國的邊緣、工業時代更成為二線城市淡出歷史舞台、近年就是個人口五萬不到的郊區化衰敗城市、就業機會也不多年輕人也外流幾乎沒什麼希望、這裡不但生活庸碌文化保守連天氣都是英國最冷...
  難怪年輕人有機會就向外跑、像 Karen Gillan 這種有才的離鄉背井更久也更遠！不過她一直想為家鄉做點事，尤其發現「蘇格蘭高地年輕人自殺率偏高」時，更是要來拍拍家鄉的故事。




  此片原本製片希望拍在蘇格蘭影視後勤最近便的 Glasgow，但她堅持非來 Inverness拍不可，還真的本片有許多 Inverness為人所知與不為人知的風情！首先
  Inverness城堡有漂亮的夜景、River Ness有漂亮的河岸景觀、Inverness 古城也還算有些酒吧派對夜生活，令女主角 Luisaidh （其實發音就是「露西」）每天過完狗屁倒灶的白天後都要來這裡買醉、每天喝茫就隨便找個小伙子打一炮、打完砲清醒點後買盒薯條塞滿嘴巴、走過省道穿過橋下來到不可說的城市邊緣。


  結果，Karen Gillan在 Inverness最豐富的取景，搞不好就是這些「城市邊緣」，是車輛川流不息卻不知開向何方的高架橋、是女主角露西工作的超級市場肉鋪、是只有小混混才要去買的龍蛇混雜薯條店、是超級市場背後骯髒破敗的卸貨區、是河畔廢棄磚造倉庫可以給她抽根菸、是火車出站後開往的省道邊緣鐵路峽谷、是鐵路上方人煙罕至的森林步道與小橋...
  而這小橋，這她每晚把嘴巴塞完薯條之後來到的小橋，每晚她眼前都有一個年輕人跳了下去！


  這年輕人，名叫 Alastaire，是女主角露西的好基友，與露西的另一位女性朋友本是三人組，那位女性朋友結了婚後他倆就成了相濡以沫的閨密。露西自己這個平庸少女問題很多，她每天跟著大家夢想「我們揮別高地去加州、揮別陰雨去曬日光浴」其實沒錢出國也沒心交男友過得好鬱卒，但閨蜜
  Alastaire儘管有男友卻更慘：這裡是保守的 Inverness，連年輕人們都從小跟著爸媽上教會，就算長大了也有點難脫離，而 Alastaire好死不死就交了個在教會工作的男友！為了不敢向教會出櫃的男友，他一直委屈求全地迎合，甚至一度不惜試圖變性當女人只想得回男友的愛。




  結果就是在一個聖誕節，Alastaire 跳火車橋自殺了，而且這是死意甚絕的自殺，因為地方流傳這自殺聖地「就算跳橋沒死、也會被火車補刀壓死」！這自殺發生在電影現在線的前一年，但
  Karen Gillan 對這位 Alastaire的戲份處理簡直完全融入現在線！她不管上班抽煙喝酒打砲乃至行走居家，幾乎時時刻刻都會看見 Alastaire的身影，這身影總是似校非笑帶著又像惋惜又像鼓勵的眼光注視著她，總令她被看得超不安卻又揮之不去。到底這位幽靈是在提醒她保守小鎮的絕望？是在提醒她沒有救回好友的罪咎？還是...
  在暗暗鼓勵著她也到那座橋去跳一跳、一了百了？


  好多個晚上，爛命一條滿嘴薯條的露西都孤身來到了那火車橋、都煞有其事地坐上了橋、臉上也彷彿幾番掙扎下定了某種決心、只要往後一躺就可以一了百了！但她每次還是縮了回去過著下一天，只能翻白眼吐口氣怨嘆自己不爭氣...
  到底這爛命一條還有什麼好珍惜的呢？她的家庭是個父母只會吵架不會說話、只會電話聯絡不會當面聊天、只會叫中國炒麵不會共進晚餐的疏離家庭，她的工作是日復一日苦守櫃檯、其實賣的火腿起司也很有限、總是一堆登徒子來問怪問題的肉鋪，她僅剩還能抽根菸聊兩句的好友則是結了婚後柴米油鹽大呼小叫甚至痛恨小孩的怨婦...


  不知不覺間，就在 Inverness最日常的郊區住宅景觀中，那日復一日百無聊賴了無生趣的「死亡」悄悄地來到，竟然就在露西每天百無聊賴觀看的對街住宅生活血淋淋上演！當有些家庭在共敘天倫、有些家庭在柴米油鹽時、有一扇窗子裡面已是一具屍體吊在天花板！那吊繩拉動樓板的唧唧咳咳木頭聲，從此縈繞她腦海再也揮不去，甚至找人上床打砲的木床聲音都泛著死亡的氣息！死亡，看來已經成為
  Inverness這個高自殺率的絕望城市之日常風景？看到對街有人上吊她會趕緊打電話叫救護車做點什麼嗎？




  並沒有，她驚嚇之餘彷彿心也死了，只是默默地縮了下來當沒發生，直到過了好久對街一聲尖叫傳出來... 難道，去年聖誕季節她沒救回一個閨蜜 Alistaire，今年聖誕節她也沒救回對街的獨居中年人？耳聽得家裏那與「緊急求助專線」只差一碼的電話，又一次令人惱怒地響起原來又是打錯了...
  這一回，她還能對打錯的陌生老人沒好氣地冷嘲熱諷悍然掛斷嗎？


  於是電影進入一場 Inverness陰雨綿綿百無聊賴的城市行腳與對話：在家裏，露西開始與這全片不曾露臉的陌生老人展開雞同鴨講的對話；在城裏，露西邂逅一個流浪 Inverness逃避聖誕的離婚男子，這離婚男子竟是由《星際異攻隊》與涅卜拉有仇的「控訴者羅南」演員
  Lee Pace 友情跨刀演出！這兩線，將引領著露西從 Inverness夜晚狂亂的市中心、Inverness 邊緣的廢棄地景、以及 Inverness百無聊賴的郊區住宅中，走向
  Inverness更多帶人抽離啟人靈感的奇幻角落，當然還是會一次次回到「自殺火車橋」經歷考驗，但也會走到森林中的 Clootie well 許一個未來。


  這兩線會擦出什麼人情的火花、走出什麼人生的啟示呢？我推薦大家直接打開 friDay 或其他串流平台看看這部片，跟著 Karen Gillan 走一遭她精選的城市地景、看一回她關心的家鄉情懷。話說此片森林中的
  Clootie well ，是遠古塞爾特傳統的「療癒之泉」，也許算是一路被歐洲基督教文明現代化的蘇格蘭高地、那保留最後神秘的「森林之心」吧？這寂寥的現代城市 Inverness、不等人的鐵路橋樑車水馬龍、複製貼上的郊區住宅、行屍走肉的工作與派對、無情無眼的保守教會...
  就算一切文明都病了，也許每個人「心之森林」的深處，自有彼此療癒的巨大能量吧？




  推薦所有喜愛 Karen Gillan 的觀眾來看看這部片！也許 Karen的外表仍是過去的憤世嫉俗嗆正妹戲路，但這一次不是賣性感帥氣的商業大片、而是充滿關懷的家鄉故事。Karen
  這次身兼編導演，片頭就以一場蘇格蘭式末日 rap展現即興演技魅力、整個故事多線慢慢匯合則展現編劇厚度、每一場戲讓當下對戲融入精選景觀呼應主題則展現導演的眼界！導演的手法也許尚稱青澀、未能以高超技術駕馭每一刻，但我覺得此片已經完整呈現她心裏的關注、她眼中的世界、與她想說的故事。希望她未來能找更多機會拍她想拍的，必會是個值得期待的新影人！



