url: https://www.ptt.cc/bbs/movie/M.1627642341.A.9D5.html
title: '[普雷]神劍闖江湖-the beginning'
content: '~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  今天7/30終於等到了去年就該上映的神劍闖江湖 the NTR(X) Beginning(O)


  這部片我給普雷，但如果是期待有大動作戲的影迷們


  最後的戰鬥別抱太大期望，整部片文戲居多，剛運動完的我睡著了三遍...


  以原著來看我認為他很忠實地還原漫畫


  甚至把前面電影中劍心為何立下不殺誓言的轉變闡釋得很清楚


  且在這一部劇場版中，最重要的就是雪代巴的戲分


  不得不說有村架純(偽雞排妹)的演技與詮釋還是很不錯的(字寫得很漂亮)


  有好幾幕這個雪代巴跟劍心的CP感超強，兩人截圖可以做海報的那種


  什麼神古薰、高荷惠，閃邊啦。


  雪代巴的妻屬性極高(作飯、務農、蓋被被)，真的很希望她有好結局啊嗚嗚




  稍微簡評一下其他部分，對於日本歷史苦手的我，其實只知道黑船事件


  所以中間xx派別或跳出年分就很無感，也不懂為何這部片裡面完全沒有槍枝的出現？

  (畢竟前三部都有，時代有差這麼多嗎？)


  另外這一部有個驚喜的對戰橋段，就是劍心V.S.沖田總司(宗次郎原設定)


  雖然戰鬥方式完全不同，但他的戲分確實挽救了最後一部劇場版的武打戲


  不過新撰組的髮型設計師是怎麼了嗎，都頂著奇怪的頭在戰鬥


  整部系列有個角色一直讓我很出戲，就是原著漫畫裡面的齋藤一


  在最後一部劇場版，他的造型真是慘不忍睹，有點像是修仙失敗的道士


  而且相比其他角色來說，怎麼他的年齡看起來比前幾部還老？


  難道新時代來了之後他才去染髮的嗎？


  至於那個清里明良，如果當初被砍一刀乖乖躺好你可能還有得救啊


  不要爬起來啊笨蛋......


  可惜這部片最後沒有讓藤原龍也扮一下未毀容的志志雄


  且雪代緣後面的戲分謎一樣的消失了


  但整體來說這部片帶給我的精采程度還是比The Final好很多


  我想大概是因為少了那個存在意義不明的左之助


  觀影體驗大幅上升=    =+++


  --

  不一樣  但漫畫裡面作者在處理這兩個人設的時候

  我記得有說彼此參考？

  原著好像是巴被砍的時候  手上的刀落下來時不小心劃到

  但劇場版不太懂最後巴刻意偷砍一小刀  她應該不知道那個疤痕是髮小留下的'
