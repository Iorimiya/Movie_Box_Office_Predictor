title: 'Re: [討論] 神劍闖江湖 beginning'
content: '看過神劍漫畫跟追憶篇的人十個有九個會同意


  "如果巴沒死 小薰毫無機會的"


  小薰除了年紀小 會一點劍術外 剩下被巴海放


  一起生活時候 劍心15 巴18歲~


  再回到巴的未婚夫 清里 自己跑去京都當護衛


  劍心不殺他 清里也會被逼切腹  或是 處理掉


  差別在於 劍心是不是巴的仇人而已


  劍心來說 巴是他救贖 終於不是過著整天殺人的日子!


  劍心跟別人說 巴是他的妻子 叫做緋村巴


  只差一個明媒正娶的儀式而已~


  巴的老爸 也認同劍心是他的女婿 是他女兒的丈夫!!


  絕對是真愛!!


  真人版刪了不少東西 看漫畫跟OVA 比較有感覺~


  --

  當我用功過度身心俱疲的時候

  是他幫我治療~

  當我得了思鄉病的時候

  是他扮演母親的角色~

  當我身上缺錢的時候~

  他不知從哪裡弄來巨款 偷偷接濟我~


  --'
