url: https://www.ptt.cc/bbs/movie/M.1737118686.A.206.html
title: '[好雷] GUNDAM GQuuuuuuX -Beginning-'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  一句話 喜歡鋼彈的 看就對了 不會後悔

  或是等正式電視版上映

  目前日本上映的是先行上映劇場版 大概是TV版3集左右的份量


  不聶他的感想

  機體造型不一樣這點就當成機設不同

  如同鋼彈W無盡的華爾滋裡面鋼彈造型與TV版不同一樣


  單純一篇看下來的感想只有 "棒 透 了" 滿分10分我給10分



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  因為電視版會上映 所以說個概要就好





























  你以為這是新的鋼彈? 一開始可是從0079鋼彈聳立於大地上開始演啊

  不過從一開始就不同


  本來是夏亞的兩個部下過來偵查 被阿姆羅開的鋼彈打爆

  這次不知道為啥 夏亞突然接收到某個宇宙電波

  一開始夏亞就一起跟過來了

  順利的打爆了鋼坦克(還是鋼加農? 只有一秒看不出來)

  搶了鋼彈 打倒出來迎擊的鋼加農 把白色基地艦橋打爆之後整台搬出去

  遇到追擊艦隊 鋼彈一號機過來之後


  夏亞開著鋼彈 站在彈射器上說出"鋼彈 出擊!" 真的有種說不出的感覺


  總之 光是前面這些IF展開就讓我看得超過癮的


  另外令人意外的是這次前面有個人的戲份超級重

  夏利亞.布魯 不知道對這位腳色有沒有印象

  他在一年戰爭開著有線控炮MA 從木星回來的


  在這個世界線夏亞一開始就跟他搭上 一起合作 而夏亞失蹤以後過了六年

  夏利亞一直在各地尋找夏亞(以及紅色鋼彈)的蹤跡


  本篇劇情的話還沒啥麼好說的 畢竟就TV版前1/4左右而已 後面不知道有啥展開

  但是劇情高潮處搭配上星街以及米津玄師的歌聲真的很棒

  熱血程度我覺得跟鐵血第一集芭芭托斯出場那一幕有得拚(這是稱讚)



  --

  穿越異世界搞不好會成立阿 畢竟夏亞在ゼクノヴァ之後就失蹤了

  就看後面演會不會真的跟你說去了異世界'
