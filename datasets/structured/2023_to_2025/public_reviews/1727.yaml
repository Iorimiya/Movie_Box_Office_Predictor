url: https://www.ptt.cc/bbs/movie/M.1702387076.A.E2A.html
title: '[討論] 香港奧斯卡代表《燈火闌珊》被取消資格'
content: '前幾日美國影藝學院公佈了2024年奧斯卡國際影片的完整參賽名單

  其中香港的代表《燈火闌珊》被發現沒有出現在名單內，也讓許多香港媒體質疑《燈火闌

  珊》是否被取消資格


  昨日「香港電影製片家協會」也發表聲明給《燈火闌珊》片商證實此事




  在經過媒體詢問「香港電影製片家協會」後，主席洪祖星回應是因為影藝學院查到內部投

  票時出現利益衝突，有該片的演員投了自己作品一票，因而違反規則。


  「香港電影製片家協會」主席洪祖星今年8月收到影藝學院修改制度通知，評審若任職「香

  港電影製片家協會」董事局超過6年一律不能參與投票。


  所以今年的遴選委員共13人全部重新委任，而參賽國選出該國代表影片時不能有任何利益

  衝突，即為投票遴選委員不能投票給自己有參與的作品去參賽，結果今年卻出現一位新成

  員投給了《燈火闌珊》，因而被取消資格。



  而洪祖星得知被取消後，有去詢問能否刪去該票數，因為刪除該票後，製片家協會奧斯卡

  投票會議後的第一名仍然是《燈火闌珊》，第二名則是《毒舌大狀》。但影藝學院不允許

  ，而是提議是否要改由得票數第二的作品參賽。


  洪祖星表示刪除利益投票後依然是《燈火闌珊》第一名，因為這樣就改派《毒舌大狀》，

  反倒會失去公道，故決定也不換作品遞補，此舉等於棄賽。



  而今日投下利益衝突票的成員也發聲明道歉，此位成員即是在片中參演的任達華。他也透

  過經紀公司英皇發表道歉聲明：


  「《燈火闌珊》是我自己好喜歡的一部電影，每個地方都有不同的遊戲規則，我願意為《

  燈火闌珊》所有付出的工作人員、同事道歉，辛苦了，是我自己的失誤，投給《燈火闌珊

  》一票，好抱歉好抱歉，也都向香港電影製片家協會講聲抱歉，因為投給自己的電影一票

  ，好抱歉好抱歉。也都向所有喜歡電影的朋友致歉、道歉。」


  --'
