url: https://www.ptt.cc/bbs/movie/M.1679622519.A.910.html
title: '[新聞] 煞到燈火闌珊劇本 張艾嘉不計酬勞演出'
content: '煞到燈火闌珊劇本 張艾嘉不計酬勞演出


  新聞網址：



  2023/03/24 05:30


  〔記者廖俐惠／綜合報導〕張艾嘉憑藉電影《燈火闌珊》3度獲封金馬影后，該片昨天發

  布前導海報和預告，張艾嘉坦言因為太喜歡劇本，導演曾憲寧找上門時便不計酬勞地一口

  答應，她也自認很幸運，「現在還有這麼好的角色可以演！」


  《燈火闌珊》是香港新銳導演曾憲寧首部執導作品，被問及是如何找到張艾嘉主演，曾憲

  寧表示：「我一直很喜歡張姊的電影，我想如果能找到她演出，一定會是很神奇的旅程，

  於是就戰戰兢兢地送上劇本，沒想到張姊真的一口答應！」


  在片中，張艾嘉飾演的「美香」意外得知亡夫重建招牌的遺願後，毅然決然繼承霓虹燈工

  廠。為了演出到位，開拍前張艾嘉還跟真正的霓虹燈管師傅拜師學藝，讓張艾嘉大開眼界

  ，直呼真不簡單，「很難想像以前香港滿街都是五光十色的霓虹招牌，是如何做出來的，

  現在香港也僅存幾位師傅了，應該要辦展覽保存這文化。」《燈火闌珊》4月14日全台正

  式上映。


  預告:



  --'
