url: https://www.ptt.cc/bbs/movie/M.1668077635.A.23B.html
title: '[普好雷]《燈火闌珊》，情深意重，白頭偕老。'
content: '部落格版：


  本屆金馬影展選入了幾部來自香港的電影作品，包含入圍金馬獎的《智齒》、《燈火闌珊

  》、《緣路山旮旯》、《百日青春》、《窄路微塵》、《憂鬱之島》等片外，還另外選入

  了據聞為遺珠的《過時溯L節》。很幸運的是每場都有順利的搶到票，若先從已經觀賞完

  的幾部中選一部最喜歡的，我會選導演曾憲寧的《燈火闌珊》，雖然坦白說這部片並不到

  特別好，但我很喜歡電影檯面上看似說的是關於女主角美香如何在追憶已逝丈夫阿鑣、忙

  碌奔走就為了完成丈夫生前遺願的過程裡，去體悟到「故月依舊，伊人不在」的事實，並

  學會將她的不捨與執著放下、繼續朝著未來前行的故事，可實際上《燈火闌珊》真正想表

  達的，其實是對舊時香港的緬懷，以及對每位使香港夜景絢爛璀璨、驚艷世界的霓虹燈招

  牌師傅之致敬。導演曾憲寧賦予劇中角色存在與其行動的意義，巧妙利用角色彼此間的感

  情與舊時香港的情感進行連結，借人抒情、感慨著對技藝、文化、景緻等的逐漸消逝，只

  得留存於記憶中的萬般無奈與傷感。


  霓虹燈為西方產物，先於歐洲、美國等地普及，直至二次大戰後逐漸傳入東方，包含日本

  、上海與香港都是東方最早接觸到霓虹燈的城市，而在香港尤其被廣泛應用。1960年代隨

  著工業發展蓬勃，在尚未有法規制定規範的彼時，為了爭搶生意各商家無不在霓虹燈招牌

  上費盡心思，越大、越鮮豔、越造型特別越能吸引到人，於是不知不覺間霓虹燈招牌成了

  必要的爭奇鬥豔。另由於香港市區稠密、高密度樓宇與狹窄街道，加上下舖上居的建築結

  構，讓霓虹燈招牌很有層次的從牆身延伸至馬路、錯落分明，不僅形成香港獨特街頭景色

  ，夜晚從天空中向下俯瞰更是如同一顆明珠般，於是被冠以「東方之珠」美譽。



  香港霓虹街景繁榮映襯了香港1960年代至1980年代的發展，到1990年代更是達到高峰，而

  導演王家衛過去多部作品、包含《重慶森林》、《墮落天使》、《花樣年華》等作均將霓

  虹街景放進鏡頭裡，用霓虹光影映照出城市人的孤寂感，隨著王家衛電影在國際上的屢屢

  獲獎，香港霓虹燈招牌遂逐漸成為香港的一種文化象徵。只是時代變遷，便宜又省電的

  LED燈提供商家在招牌製作上的新選擇、新式建築未保留足夠空間、結構安全上的考量、

  加上香港政府於2010年新制實施，許多招牌變成了違建，不得不拆除。種種因素對霓虹燈

  造成了不小衝擊，雖不到迅速沒落卻也日漸式微，寫字師傅、霓虹燈管師傅、招牌安裝師

  傅等都在今日成了夕陽行業。


  《燈火闌珊》說的是妻子對丈夫的感情，嘆的是香港人對舊時香港的情感。導演曾憲寧彷

  彿施展了名為電影的魔法，不只是單純重現了舊時香港的絢爛繁華，而是讓思念與情意等

  擬人化為劇中角色，並順著同樣被賦予意義的劇情走在街頭、爬上高樓、燒熔燈管、抵抗

  政策...，哭著笑著也想留存住並傳承延續那些昔日美好，想在香港失去味道之前再拼一

  回。美香如同見證霓虹燈招牌興衰的老一代香港人，丈夫阿鑣是他那消失的霓虹燈招牌，

  女兒彩虹與阿鑣徒弟Leo則各自代表了離開與留下的香港年輕一代，是有感於美好人事物

  的再也不復返而選擇出走香港；又或是太過眷戀不捨而欲留下盡力傳承，可不論是何者其

  實都道出了香港正面臨著的問題、也就是離開也好、留下也罷，都不能否認香港正在失去

  屬於自己的靈魂，只留下越來越中國化的香港軀殼。


  美香與阿鑣的偶然邂逅與天人永隔，好似香港與霓虹燈的關係，一起牽手走過近半世紀的

  歲月，卻在最後敵不過病魔（命運）而被迫放手，她將女兒丟掉的丈夫遺物通通撿了回來

  ，來到丈夫的工作室卻碰上了正在尋短的阿鑣徒弟Leo，為了取信美香所說的謊、卻意外

  讓美香空洞的雙眼再度有了光，於是兩人開始踏上完成阿鑣遺願之旅，彷彿像是老一代與

  年輕一代香港人攜手重現、保留、延續這個文化象徵。然而無奈的是，他們其實心裡再清

  楚不過，他們現在所努力的，終將會是曇花一現的垂死掙扎，在一夜璀璨過後還是會被現

  實給逼退，Leo中間的轉換跑道與美香最後的放下都似現實下的不得不妥協。導演曾憲寧

  以緬懷為故事基底，浪漫的溫柔重現昔日榮光，然後最終讓這樣的霓虹景緻伴隨著一代香

  港人的記憶，一同搭上那艘珍寶海鮮舫沈入南海。



  《燈火闌珊》好的是劇本，差的也是劇本，感性的人無不被電影對人、對景的情意感動，

  理性的人卻難免會對劇情的略微鬆散頗有意見，當然這樣的問題多少和剪輯有著關係，段

  落與段落銜接不夠流暢，導致偶爾會有時間跳躍或是關係變化、劇情轉折不明確的問題出

  現，而這我想也是《燈火闌珊》除了視覺效果外在其他技術獎項均未獲青睞的原因之一。

  所以《燈火闌珊》絕對是部情感取向的電影，對喜歡香港也有在關注香港的觀眾來說，電

  影豐富的情感會蓋過電影的缺失與填補電影的不足，尤其看到張艾嘉的演出之後更是如此

  。飾演美香的張艾嘉與飾演其過世丈夫的任達華亦成了情感的載體，透過鬆弛有度的表演

  與細膩豐沛的情感，在讓自己成為角色本身之後，用他們的愛情飽滿了對舊時香港的情深

  意重，彩虹那用來幫母親梳頭的父親所送的梳子，是對美香的表白、是諾言也是終難實現

  的美好、「不染頭髮，是想白頭偕老。」。


  張艾嘉早已不是表演的表演完美說服觀眾，成功再憑美香一角角逐金馬影后，面對台北電

  影獎入圍蔡亘晏與香港金像獎影后劉雅瑟，還有或將成為黑馬的洪慧芳與同樣代表香港參

  戰金馬的袁澧林，張艾嘉能否拿下第三座金馬影后讓人期待。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --

  抱歉已更正'
