title: '[新聞] 張艾嘉闊別多年重返港產片演出 《燈火闌珊》拍出細膩香港風'
content: '新聞網址：


  「想不到香港的夜景是這麼美的，這麼美的東西，一下子沒有了」

  　　　　　　　　　　　　　　　　　　－　周潤發《英雄本色》


  這句八十年代經典電影對白，黯然點出香港繁華夜市的日漸寥落。霓虹夜燈是昔日香港欣

  欣向榮的標誌，千家萬戶掛上霓虹燈牌，鱗次櫛比的橫亙馬路上恍如燈海，萬家燈火點亮

  大街上的車水馬龍。相比昔日，街上景物大致依舊，但路上霓虹大燈卻因城市發展而日益

  見少。一幅幅霓虹招牌拆下，是昔日美好的凋零？抑或是城市活力再生？


  《燈火闌珊》講述為圓霓虹燈師傅亡夫遺願，憂鬱中年寡婦跟少年學徒重造神秘霓虹燈牌

  ，再次與亡夫邂逅並和解，在燈火凋零的城巿裏點亮回億與希冀。「已婚女性大半生為了

  家庭勞碌而營營役役，可是踏入晚年喪偶，子女長大後，投入大半生心力的家庭出現翻天

  覆地變化，她如何走餘下的路？」曾憲寧（Ana）表示，電影靈感來自她多次出席男性長

  輩喪禮的觀察。


  「『燈火闌珊』這個詞有人說勾起近年香港的境況，好像從前美好的事物逐漸失去，疫情

  下很多事物在走下坡。」


  Ana以電影業為例，好像整個行業都朝沒落的方向發展，自己也曾自問這次拍首部劇情片

  ，會否也是自己最後一部劇情片？但在電影後期製作階段，當她重看作品時，卻又有莫名

  感動，電影雖然講述喪偶的傷痛，但女主角卻將哀傷和空洞轉化力量來讓自己走人生下半

  場。就如戲中多次出現的霓虹燈一樣，雖然香港愈來愈少這些招牌，但卻仍有很多人以新

  方法延續這工藝，設法為此保育，她希望以這作品鼓勵自己、鼓勵香港人。


  外國人欣賞香港文化


  電影獲商務及經濟發展局轄下的創意香港「首部劇情電影計劃」支持，出資資助新導演及

  其團隊拍攝其首部劇情片，Ana與監製陳心遙在上年計劃啟動伊始，即穿街過巷拍攝各區

  霓虹燈景象。


  「現在香港的霓虹燈夜景遠不如我們記憶中的燈光璀璨，而是拆得遠比想像中快。」陳心

  遙表，他們要與時間競賽，很多街燈拍完不久便再見不到，而且香港霓虹燈師傅和工場亦

  所餘無幾。不過在拍攝過程中，雖然燈牌大量消失，但偶然會發現有一兩個新燈牌重新掛

  上，心情感到十分振奮。


  陳心遙表示，霓虹燈是香港別具特色的標誌，雖然在本地實物愈來愈少，但卻仍然獲年青

  一代，甚至海外人士關注。「現在社交媒體發達，更多年青人關心香港這個城市，更關注

  本地文化傳承，很多新專頁去討論這些傳統技藝，這在以前是見不到的。」籌備前期，他

  們更獲外國紀錄片團隊採訪，隨他們拍攝香港的霓虹燈牌，還拜訪多次拍攝王家衛電影的

  攝影師杜可風。「外國人好關注香港特色，異文化看到我們最有特色的地方，所以《燈火

  闌珊》在題材上預料會有很多外國人想看。」


  多起用新人給予發展機會


  除了在電影中發掘香港特色外，製作團隊亦希望多起用香港新一代演員，拍出香港味的電

  影。陳心遙曾任《狂舞派》（2013）和《哪有一天我們會飛》（2015）監製和編劇，自那

  時起已積極起用新演員。


  「香港新人拍攝電影機會不多，大多數電影公司喜歡用已成名的演員，我盡能力起用更多

  新演員，亦說服投資者用他們，讓他們與前輩合作，形成一種新舊融合的風氣。」


  早前兩代電影人就「港產片已死」在社交平台掀起大戰，陳心遙認為任何文化中，兩代人

  互相不認同並不會有前途發展，他並不認為新不如舊，不同世代間應互相尊重銜接。Ana

  以演員郭爾君和唐浩然為例，二人飾演年青時的張艾嘉和任達華，他們十分用心做功課，

  經常在片場捉導演問清楚對白細節應怎樣講。香港電影業新一代的用心，大家是有目共睹

  。


  所謂萬事俱備，只欠東風，有好的劇本和政府資助，也要有良好的推廣平台讓人認識。《

  燈火闌珊》入圍了第19屆HAF（Hong Kong-Asia Film Financing Forum/香港亞洲電影投

  資會）的WIP（Work-In-Progress）劇情片大獎，投資會將於3月15日至17日與第25屆香港

  國際影視展（FILMART）同期舉行，屆時在這平台協助下，因應疫情而以網上平台形式為

  電影製作團隊尋找後期製作夥伴、發行商和銷售代理，讓港產電影有更多機會在國際平台

  為人所認識，推動作品更快與觀眾見面。


  「眾里尋他千百度。驀然回首，那人卻在，燈火闌珊處。」

  　　　　　　　　　　　　　　　　　　　－ 辛棄疾《青玉案》


  當大家都想留住昔日美好時，有否嘗過回首一盼，尋找燈火闌珊那人？


  電影《燈火闌珊》演員名單：


  張艾嘉、任達華、周漢寧、蔡思韵、麥秋成、袁富華、郭爾君、唐浩然、梁雍婷








  ---


  三月的新聞，剛剛看 FFFI 臉書才注意到這片已經拍攝完畢的樣子！

  這是 FFFI 在 2019 年專業組的得獎作品


  這卡司整個很強啊！今年金馬預備？



  --'
