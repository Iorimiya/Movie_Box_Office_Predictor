title: '[情報] 2024 香港奧斯卡代表：《燈火闌珊》'
content: '，今日獲香港電影製片家協會

  董事局，按照美國電影學院角逐奧斯卡最佳國際影片之選片準則，。團隊收到消息後都十分驚喜，難

  掩興奮之情。




  同樣首度主演電影的主角，對於身為一分子與有榮焉，



  ------


  恭喜《燈火闌珊》代表香港


  香港曾在2020年第93屆，以曾國祥執導的《少年的你》入圍決選五強名單；

  再往前則是2013年第86屆，王家衛執導的《一代宗師》入圍至短名單。


  香港也是繼2017年挑選黃進的首部作品《一念無明》後，再次挑選新導演的作品參賽。


  --'
