title: '[好雷] 重要的是自己：《冰淇淋般的愛戀》'
content: "內文有雷且具個人觀點，推薦觀影後再讀。\n\n　　　　本片場次有限，有意請把握。\n\n\n\n　　　　網頁版：\n\n　　　　\n\n\n　　　　預告片：\n\
  \n　　　　\n\n\n　　　　主題曲〈氷菓子〉與歌詞翻譯：\n\n　　　　\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n重要的是自己：《冰淇淋般的愛戀》\n\n\n\n　　生命裡常會下起像夏日的驟雨，例如爭吵，例如戀愛。\n\n　　在那之前可能是無處可逃的陽光普照，或者連續不散的陰雲。\n\
  \n\n\n　　《冰淇淋般的愛戀》（Ice Cream Fever）由千原徹也執導，改編自芥\n\n川賞作家川上未映子的短篇小說《夢中的愛》中的〈冰淇淋高燒熱〉。電影\n\
  \n用一間租房與冰淇淋店，轉運了數條時間之軌，輸送了幾位女子的交錯與駐\n\n足：因為被傳「不倫戀」從廣告公司辭職，在冰淇淋店打工的菜摘；拿過芥\n\n川賞、因為網路評論四年無法創作的知名小說家佐保；和姊姊愛因為一個男\n\
  \n人而絕交，喜歡大眾澡堂的優，以及想來尋找生父，忽然來訪、成功與阿姨\n\n同居的美和，各自在經過夏日的驟雨後，得到了洗滌。\n\n\n\n　　或許是我的偏私，向來不喜歡在同性電影裡看到太多的異性：往往是女\n\
  \n性被侵擾生活，或失去自主，或貶為工具。這部電影儘管壓縮到極薄，實際\n\n上仍影響著她們：職場騷擾、姊妹反目、離家的父親，和網民「賣長相」、\n\n「找人代筆」的評論，就像佐保養的墨西哥鈍口螈，女性大多被教養要「逆\n\
  \n來順受」，把石頭當作飼料，即使對此有所察覺的佐保和優，也無法馬上離\n\n開那個被迫居住的水族箱；菜摘雖然辭職，卻對現今的工作心有不安；而美\n\n和，則想去尋找那個可能先聯絡就逃掉，只能從社群的線索去解謎、已然拋\n\
  \n棄她們母女的，徒有血緣的人……\n\n\n\n　　逃不開水族箱的不僅因心裡的困囿。即使是給予生命的燃料，無論是美\n\n食、猶如綠洲的澡堂，還是冰淇淋，身為女性的我不用等角色開口，都能自\n\
  \n行數出種種憂慮。可喜的是，這些女子的行動往往出乎意料，例如菜摘明明\n\n「什麼都還沒開始」，心動就立時行動追上佐保；例如佐保只要冰淇淋溶化，\n\n無論是否吃完都隨手一扔；例如優堅持要美和叫她的名字「小優」取代「阿\n\
  \n姨」，認真打起桌球回憶曾經親密的姊姊，和一起戴耳環，憶起初次一起吃\n\n冰，堅持要吃「中規中矩」的香草，「讓」美和品嘗薄荷巧克力……這些就\n\n像經過冰淇淋店起心動念，一口口邊送進嘴裡邊想著「不管了啦」般，都是\n\
  \n極為喜歡的甜美滋味。\n\n\n\n　　但更喜歡的段落，是看似隨心所欲，卻總是選固定的義大利牛奶與清涼\n\n薄荷口味、深信「黑色的字印在白色的紙上，文字創造全世界，寫藍就變藍\n\
  \n色，寫紅就變紅色」的創作魔法，卻被別人的文字傷害，徒留桌上一疊稿紙\n\n的佐保，在等待冰淇淋結凍的時間，踩上滑板讓菜摘在後面追趕，終於停下\n\n來等她趕上牽手，讓長久孤絕的世界有了連繫，卻又選擇如蝴蝶般翩然離去；\n\
  \n是小優與美和在咖啡店享用聖代和冰淇淋蘇打，察覺在找、以為還在意的人\n\n就在身後，以男性慣有的無禮聲量證明已然無足輕重，決心「想怎樣就這樣」，\n\n投入百匯冰淇淋無條件帶來的幸福；是菜摘早上在餘留的香氣醒來，追尋蝴\n\
  \n蝶沾染了玫瑰紅液，在陽台頂端留下如花瓣、愛戀與飛高前暫留的痕跡；是\n\n小優想起美和的耳環是她「一時興起」送給姊姊，才願意承認早已原諒，體\n\n會到和親人一起生活的幸福，喊著「我要你」的真情流露……就算被驟雨淋\n\
  \n得濕透，她們的相遇喚起潛伏於心靈的訊息，無論曾經留下的痕跡美麗與否，\n\n消抹與否，此刻是轉運站或居留的住所，她們都得到，並為接下來相遇的人\n\n添加燃料──就像隨歌起舞、辭職後邁步前進的貴子，在任何時刻，女性都\n\
  \n能在得到能量、「確認到底是不是我自己」後，繼續以美好的步伐前往下一\n\n片竹林或海洋，邂逅未知與幸福。\n\n\n\n　　一輩子只有一次的戀愛，大概是還未察覺就已燃燒，發生了才試圖存留。\n\
  \n但要做冰淇淋，必須先有冰箱；為了送到眼前的美好，需要那麼多的準備和\n\n心意，卻無法面對融解與未凝結的痕跡。看似漫不經心的佐保，一身黑衣為\n\n街道細數色彩，一次入店見不到菜摘，下一次就在眾人面前要求實現諾言──\n\
  \n「你是做冰淇淋給我吃的人，為了我而做的」──你是被我所指名的、獨一\n\n無二的價值。菜摘先說會做冰淇淋後再找書學習；明明看見了她的成名作\n\n《最終愛》，取下卻又放回，彷彿預告那不是最後一次；喜歡你，也不是你\n\
  \n身外的價值，而只是來到我面前的你──然而正是這樣帶著往日、卻無暇思\n\n及未來、只能感受此刻的愛，一次燃燒殆盡；明明是冰，卻能燙傷彼此那樣\n\n的高熱，讓身體記得那燒過的痛與苦，「反正大家很快就會把我忘了，那我\n\
  \n就來當一瞬即逝的雷陣雨，夏日僅僅一次的雷陣雨」的瀟灑，實是被乾冰燙\n\n傷未癒，告訴自己夏日會再來，輪迴會再開始──如此先離開的，恐怕會是\n\n最難離開的人。但就是這樣高溫的思念，讓佐保寫下了《一百萬年都愛你》\n\
  \n的新作──冰冰的、甜甜的，只有那家冰淇淋店才有的、獨一無二的你──\n\n指名而後以文字記述，營造獨有的世界，化為百萬年都愛死的永恆。\n\n\n\n--\n\
  一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\n                          \
  \        陳斐雯  貓蚤札（其三）\n\n--"
