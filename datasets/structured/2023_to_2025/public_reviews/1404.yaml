title: '[好雷] 冰淇淋般的愛戀'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  完全為了追星去看的


  這部電影有日本人氣音樂團體


  星期三的康帕內拉 兩代主唱


  kom_i跟utaha都有參演


  電影內容很平淡 兩個故事線交叉在一起


  有富士山跟日本錢湯的美景


  還有女性相戀因素 雖然是不覺得很突兀


  但也無法有同感


  我追的女主唱utaha很像在演自己


  沒有演成別人的感覺


  意外戲份也蠻多的 電影結束彩蛋還有出現男朋友合影


  另外宣傳一下utaha 11月底要二度來台開演唱會


  有興趣看到本人在面前演出的可以搜尋 星期三的康帕內拉



  -----

  Sent from JPTT on my iPhone


  --'
