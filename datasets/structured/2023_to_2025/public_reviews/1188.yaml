url: https://www.ptt.cc/bbs/movie/M.1696470002.A.010.html
title: '[負雷] 消失的她 '
content: '雷文防雷資訊頁












  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  颱風天看到網路有人推薦這部片子


  想說netflix有上片 就來看一下


  一開始確實很吸引人會想繼續看 (可能現在很多片子都走這種模式)


  用很懸疑的手法來引起觀眾帶入主角的世界觀


  怎麼可能一覺醒來 生活豬羊變色


  元配太太變成超正的文詠珊


  假設AI之後真的很厲害 有可能直接盜用你手機的照片順便換臉


  覺得應該是可以輕易做到沒錯


  (會不會現實很多男的 乾脆將錯就錯XDD)


  先不吐槽男主角可以聯絡越洋電話回國確認自己元配真實資料以及照片


  (要詐騙總不可能可以更動自己中國國內的大數據吧)


  然後假設他真的喝醉或是殺太太後愧疚感或真的被偷換頭痛藥服用後精神狀況有問題


  忘記自己老婆在哪 也應該是要低調行事


  (畢竟電影一堆細節都透露出他很多事忘記了，但沒忘記自己幹掉太太)


  假設以殺人犯來看 故意去報案合理


  但不受理不是應該正和他意 將錯就錯 回國


  再招開個記者會 繼承財富 家財萬貫 招開記者會控訴 該國政府執法單位


  完全可以逆轉加害者身分  搖身一變變成受害者家屬


  反而很堅持一定要把事情鬧大


  假設主角真的想要裝到底


  那也是不應該攻擊 假太太文詠珊


  這時候應該害怕的是假太太  搞不好會賠了夫人又折兵


  因為你假設主角是壞人的狀況下


  你找人直接綁架他不是比較快 反正主角最後透露出被威脅就嚇得半死的個性


  以及真的有錢人 其實是超級珍惜生命


  而一堆有錢人或亡命之徒都很變態


  你跟他玩這個遊戲 他就直接讓妳 無法翻身


  好吧  雖然一堆bug


  但電影就是爽片沒錯


  還是值得推薦去爽一下   但認真思考就不推薦拉


  最後  文詠珊好正  加分很多 !!!














  --'
