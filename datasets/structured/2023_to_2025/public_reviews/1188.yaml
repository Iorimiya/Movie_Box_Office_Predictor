title: '[  雷] 消失的她/佈局'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  最近看了Netfilx上的電影”消失的她”，

  是女主角的閨蜜假扮律師接近渣男，

  以獲取犯罪事實及女主角下落。


  這個假扮律師以騙取犯罪事實的方法，

  讓我想到以前看過的”佈局(看不見的客人）

  被害者父母自行調查兒子的死因，

  最後被害者的媽媽假扮律師，

  提早時間赴約去和男主角談話，

  成功套出犯罪真相。


  因為律師對客戶有保密義務，

  所以容易讓犯罪人卸下心防，

  說出真相。


  請問各位大神，還有類似這種

  透過假扮律師套取犯罪事實的電影，

  可以介紹嗎？


