url: https://www.ptt.cc/bbs/movie/M.1696147781.A.D69.html
title: '[好雷] 消失的她 Lost In The Stars'
content: '雷文防雷資訊頁


  消失的她

  Lost In The Stars

  2022中國電影

  Netflix上架影片




  何非和妻子李木子在一週年結婚紀念日的時候前往東南亞國家巴蘭迪亞（虛構國家）旅行

  ，但是李木子在某天晚上離開度假村後離奇消失，何非向當地警方報案苦尋無果，簽證也

  將到期之時，華裔警官鄭成現身表示可幫助何非，妻子李木子也在某天早上再次現身，但

  何非卻和警官聲稱眼前的陌生女人並非妻子，妻子拿出了護照和兩人合影進行自證，何非

  在多次試圖搜索證據失敗隨後求助於律師陳麥進行調查。隨著調查深入，每個人似乎都有

  許多不可告人的秘密。





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  編導演均佳的影片，看地非常入戲。個人滿意度85分（滿分100）。

  這片在追看之前，已知道此片非常賣座，好奇而看。收看過程中，感覺就是精緻質感好的

  玫瑰瞳鈴眼-藍色蜘蛛網之劇集的奇情驚悚類型的故事情節。包涵了許多戲劇元素，懸疑

  ，精彩，驚悚，轉折，回馬槍，友誼，愛情，東南亞恐怖傳說...等等，融合地非常好，

  劇情沒有冷場，扣人心弦，最後劇情畫面的鋪陳，還令我感動落淚        ，全片看地屏

  氣凝神，最後叫好Bravo。


  以下有劇透，未看完本片，請勿往下看。




  1.本片看Wiki介紹，得知改編自前蘇聯電影〔為單身漢設下的陷阱〕俄羅斯電影，但本片

  看完，我的情緒及感受，和和幾年前看的某西班牙懸疑驚悚類型電影片Contratiempo之類

  似的拍案叫絕Bravo.                        情緒為劇情及角色高低起伏，為片中一

  些橋段，有的破口大駡，有的心驚肉跳，有的雞皮疙瘩，有的義憤填膺，有的淚光閃閃..

  .太入戲了。


  2.全片演員及角色都很棒，故事情節根本就是常見的社會寫實奇情案件，有些現實的社會

  案件，比戲劇更殘酷及奇情，所以這片也可以見怪不怪，但是本片的娛樂及警世效果，真

  的讚。



  --'
