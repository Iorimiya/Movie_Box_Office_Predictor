  \n4. 不要妄想改變一個人的劣根性\n\n5. 倪妮的英文說的很棒，沒有令人出戲的彆腳中國腔調\n\n\n\n提問：\n\n倪妮是為了好友才導了一整齣戲\n\
  那「假李木子」的真實身份是什麼呢？\n在結局她有說她討厭渣男，然後把戒指丟入池子裡\n是指她是男主角的小三嗎？\n\n飾演假李木子的文咏珊\n演肖婆時也滿狠的耶\n\
  讓人毛骨悚然XDD\n\n\n--\n感謝提醒，已修改標題"
