title: '[好無雷] 消失的她'
content: '消失的她


  非常好看


  我原本以為劇情


  會有點像連恩尼遜有一部也是老婆突然換人了


  我忘記片名了


  我還想說會不會是亞洲版的翻拍


  結果劇情完全不一樣


