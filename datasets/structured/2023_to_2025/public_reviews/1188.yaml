  這部在大陸端午節上映的電影，至今票房35億，位列本年度全球票房十大，更晉身中國電影

  史上最高票房第12位及中國影史本土製犯罪電影票房冠軍。


  片尾曲『籠』是張碧晨演唱的，yt兩個月的觀看數是191萬，片尾音樂一響起，加上故事情

  節的片段，太有感覺了。



  推薦大家去看！

  (看的管道除了優酷，網路上很多可以自行尋找)


