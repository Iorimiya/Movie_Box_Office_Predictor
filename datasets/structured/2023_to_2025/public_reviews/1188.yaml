url: https://www.ptt.cc/bbs/movie/M.1695567022.A.28D.html
title: '[普偏好雷] 消失的她'
content: '雷文防雷資訊頁

  （有兇手雷，慎入）




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  今年中國票房爆棚的懸疑片

  平常不太看中國的片子 因為以往都覺得中國片有種卡卡的感覺 除了梗都get不到 加上各

  種限制 所以都覺得有種閹割感


  不過這次這部消失的她因為口碑感覺還不錯

  所以就有興趣看了一下


  整體來說十分我會給到七分左右

  當然不是到神片等級

  不過整體劇情的緊湊度跟懸疑度 我覺得算是蠻完整的


  前半段會覺得有點扯 很多點想吐槽

  黑白兩道勾結？假老婆可以這麼囂張？可以取代真老婆成這樣？一切都覺得太扯了只有電

  影或戲可以這樣演時 差點要給非常低的評價

  後面真相出來反而比較能釋懷

  真兇手就是男主本人 前面這邊確實是一場戲要逼他供出真相

  反而覺得整個劇情可以接的起來，反轉的讓人覺得可以接受


  雖然結局看到女主死在籠裡也是有點惆悵

  但是男主角的反應也是有點太跳

  都想殺妻，真的不覺得會在意那個肚子裡的小孩

  狗血成分居多


  整體來說娛樂成分我覺得還是有啦

  原本中間還猜是《控制》的劇情，以為是老婆自己自導自演，沒想到這部是反過來


  總體來說還是不錯，雖然中間動作戲或是一些情感橋段還是卡卡的，不過覺得還是假日值

  得拿來看的一部片


  --'
