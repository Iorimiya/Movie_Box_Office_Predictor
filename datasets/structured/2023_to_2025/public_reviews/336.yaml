title: '[無雷]《 #他是我的！》觀後感：擁抱她/他的理由'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《 #他是我的！》無雷觀後感：\n\
  擁抱她／他的理由\n（不超過片介和預告）\n\n這部青春戀愛校園喜劇，比想像中有深度也有共鳴。\n\n除了描繪追求愛情和維持友情間的衝突，更在討論：不同個性的人要如何相處。\n\
  \n直率簡單的亞心子、心機滿滿的充希、暗藏心事的學長直已，你一定能在生活中找到分屬\n這些個性的朋友。\n\n不管是不是過了青春的年紀，都能再跟著主角經歷一次，這些無法跳過的人際必考題。\n\
  \n無論愛情或友情，總有太多言不由衷。\n\n–\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n--"
