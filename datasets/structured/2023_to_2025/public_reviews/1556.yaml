title: '[新聞] 【My Precious初戀】42度高溫拍片"泰"HOT'
content: '新聞網址：



  由紅遍全亞洲經典愛情電影改編，備受台灣觀眾期待的清新愛情新片《My Precious初戀

  》，由《只因我們天生一對》製作公司打造，即將在7月14日於台灣甜蜜獻映。本片以高

  中青春初戀為主題，選擇在泰國北部的「素可泰」（Sukhothai）地區拍攝，尤其素可泰

  原意為「幸福的黎明」，跟本片氛圍不謀而合，不過當地高達42度的炎熱氣溫，卻讓演員

  們搖頭直喊難受！不過片中融入滿滿泰國在地元素，勢必將讓觀眾在觀賞後，甘願冒著高

  溫飛去泰國來場「電影聖地巡禮」！此外，本片將背景設定在「千禧世代」，片中還採用

  當年風靡東南亞的流行音樂。電影主題曲更邀請到「泰國青春戀愛歌王」塔農查倫（Nont

  ）暖心獻唱。驚人的是，此曲一出，不僅登上泰國Billboard排行榜冠軍，搭配本片畫面

  的MV，更是大破2000萬觀看次數，展現超高人氣。





  描繪美好初戀的青春電影《My Precious初戀》，以泰北充滿濃厚歷史氣息的「素可泰」

  地區作為背景，全片有超過80%在此取景。談到為何選在該地區進行拍攝，導演之一的納

  帕齊沃拉帕（Naphat Chitweerapat）分享：「素可泰是一座古老但被低估的城市，我們

  用此地作為純純之愛發生地的象徵，之後再移去另一個城市，代表另一階段情感關係。」

  不過當地氣溫非常炎熱，讓男主角格拉帕格潘（Nanon）直喊：「這輩子從沒體驗過這種

  高溫！」而且片中一幕歡慶場面，他更頂著42度高溫，穿起動物造型戲服表演，連其他演

  員都搖頭直喊吃不消，途中甚至還碰上戲服在現場爆開的突發狀況，讓導演卡妮薩坤宇（

  Kanittha Kwunyoo）事後回憶起來，也笑說：「簡直是場災難！」



  不過，本片融入豐富的泰國在地元素，片中還可以看見主角們騎機車上下學，在下課時間

  享用泰式烤吐司和粉紅凍奶，還有當地傳統的服飾與水燈節，將泰式風情完整傳遞。台灣

  觀眾在觀賞後，勢必也會想立刻買機票飛去泰國進行一場「電影聖地巡禮」！





  帶觀眾重回「千禧世代」的《My Precious初戀》，不僅在劇情與美術、道具下足功夫，

  連配樂都採用當年風靡泰國的人氣男團「U.H.T」，以及紅遍東南亞的搖滾流行樂團「

  LOSO」的多首歌曲，細節滿滿，將年代感打造得更加全面！不僅如此，劇組對電影主題曲

  更是用心打造。導演卡妮薩坤宇表示：「我希望這首歌能講述一個初戀難忘，但每當回想

  起來，能夠溫暖你心的故事。」因此激發出電影主題曲〈初戀〉（First Love），更邀請

  到泰國超人氣「青春戀愛歌王」Nont獻唱。Nont也對此分享：「我想大家聽完這首歌後，

  會回到初戀的魔幻時刻，每個人會有不同經歷，而產生完全不同的感覺，但唯一能肯定的

  是，那是一個會想去記住的時刻。」主題曲曝光之後，也在當地獲得超高人氣，不只蟬聯

  泰國Billboard排行榜與當地音樂榜數週冠軍，搭配電影畫面的MV（

  ），更突破2000萬觀看數，讓演出本片的人氣男演員瓦奇

  拉維讓維瓦（Chimon）也特別向觀眾推薦：「請大家務必要聽電影主題曲，這首歌非常甜

  ！」



  這部被泰國觀眾譽為「不可錯過」的清新愛情電影《My Precious初戀》，即將在7月14日

  於台灣甜蜜獻映。「限量珍藏預售票」兩張420元，今天起（6/30）已經在「博客來售票

  網」正式開賣（）。本片劇情

  描述阿東（Nanon飾演）和其他男同學們，過著調皮搗蛋的幼稚高中生活，是學校跟老師

  眼中的麻煩搗蛋王。某天，阿東因為頑劣的惡作劇，讓怒氣沖天的老師一聲令下，要他把

  座位搬到模範生小琳（Film飾演）的前面，打算請小琳來好好「整治」他。起初，阿東跟

  小琳水火不容，不過一次意外插曲，卻悄然拉近兩人的距離，就此展開一段青澀的初戀故

  事。只不過這場女生比男生早熟的愛情，終將還是要面對現實的考驗…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。


  --'
