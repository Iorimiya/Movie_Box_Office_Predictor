title: '[新聞] 【My Precious初戀】譜出酸甜青春戀曲！'
content: '新聞網址：



  由《只因我們天生一對》製作公司催淚打造的愛情新經典《My Precious初戀》，即將在7

  月14日於台灣甜蜜獻映。本片由紅遍全亞洲的經典愛情電影改編，在《2gether電影版：

  只因我們天生一對》導演卡妮薩坤宇（Kanittha Kwunyoo）與《情竇初開15歲》導演納帕

  齊沃拉帕（Naphat Chitweerapat）聯手執導之下，加入迷人的泰國風情與泰式幽默，並

  集結泰國當紅新生代演員群，勢必將讓觀眾感受到讓人難以忘懷的初戀酸甜滋味。男主角

  格拉帕格潘（Nanon）也表示：「我想很多人觀賞後，都會回憶起他們年輕時，那段擁有

  初戀、做著只能在學校做的蠢事時光。」尤其當本片在台灣的上映資訊公開後，更是讓全

  球各地的網友好羨慕，引來日本、香港、澳門、新加坡、菲律賓、印尼、印度等地的網友

  留言，敲碗希望本片趕快在他們的國家上映，足見本片的未演先轟動實力。





  《My Precious初戀》導演卡妮薩坤宇，編導功力兼具，執導過數部人氣話題泰劇，也曾

  擔任超夯BL劇延伸的《2gether電影版：只因我們天生一對》導演。尤其本片是泰國知名

  電視節目暨經紀公司「GMMTV」的首部製作電影，在接下導演大任之後，她也邀請編劇經

  歷豐富的納帕齊沃拉帕加入編導行列。兩人對本片慎重看待，當在思索製作題材時，他們

  也談到：「我們問自己『如果要一起拍一部電影，我們會想拍什麼類型？』而我們都同意

  想拍一部跟一群年輕人的愛情相關的電影。」因此將主題聚焦在高中美好時光的「初戀」

  上面。卡妮薩導演也進一步分享：「我把自己推回最純粹自然的事物，關於一群平凡的人

  們，但將平凡化為『非凡』；而初戀最迷人的地方，就是它通常不完美，但教會了我們往

  後的戀愛該如何變得更好。」



  本片將劇情背景設定在充滿懷舊回憶的1999年至2000年，以一群「千禧世代」的高中生為

  主角，帶領觀眾重回青春時光。不論是和朋友一起討論遊戲王卡與漫畫，上課無聊一定要

  在課本上到處塗鴉，下課相約網咖吃泡麵打遊戲，夏天揪一團熱血衝到海邊玩，抑或開始

  對戀愛有感，使出渾身解數讓心儀的女生開心，體會初戀帶來的酸甜與苦澀。本片對青澀

  歲月的描繪，都將勾起觀眾心中那段就算時光飛逝，卻依舊無比深刻的快樂回憶，也讓本

  片在泰國上映後，一舉獲得泰國本土新片票房冠軍，泰國觀眾看完也紛紛表示：「看完心

  很暖，想起初戀的甜蜜與單純！」「再次感受到學生時代的愛情啊！」「初戀很難忘記，

  許多時刻都和自己完美重疊，讓眼淚不自覺流了下來！」「即使沒有生活過那個年代，也

  很能融入其中啊！」





  為了將《My Precious初戀》的青春感表現到位，本片也集結泰國當紅新生代演員共同演

  繹。男主角「阿東」是班上調皮搗蛋的孩子王，從幼稚無比到追求女主角時的靦腆專情，

  此一角色由主演過多部影視作品的人氣男星格拉帕格潘（Nanon）飾演。而個性認真、氣

  場強大，同時又活潑可愛，廣受班上男同學們喜愛的班長「小琳」，則由首度挑戰電影女

  主角的拉查楠瑪哈菀（Film）演出。此外，本片還集結陳炳林（Ohm）、瓦奇拉維讓維瓦

  （Chimon）、柴尼姆塔瓦特（Neo）、塔納塞蘇里亞蓬柴坤（Euro）、彬雅帕珍帕誦（

  View）等超人氣年輕演員們，透過各個生動又充滿特色的人物，共同演繹這部充滿淚水與

  歡笑的青春故事。



  尤其當台灣片商公佈本片即將上映之後，也引爆全台網友瘋狂留言討論：「太期待了！」

  「該看十遍了吧！」「等了好久終於等到今天！」「準備欣賞滿滿的泰式幽默！」「這可

  能是我人生中第一次看泰國電影！」不僅如此，泰國GMMTV與主要演員們都同步將本片的

  台灣版海報，貼到自己的社群媒體協助宣傳，更引來全球各地如日本、香港、澳門、新加

  坡、菲律賓、印尼、印度等地的網友留言，敲碗希望在自己的國家上映，足見本片的未演

  先轟動實力。



  這部被泰國觀眾譽為「不可錯過」的清新愛情電影《My Precious初戀》，即將在7月14日

  於台灣甜蜜獻映。本片劇情描述阿東（Nanon飾演）和其他男同學們，過著調皮搗蛋的幼

  稚高中生活，是學校跟老師眼中的麻煩搗蛋王。某天，阿東因為頑劣的惡作劇，讓怒氣沖

  天的老師一聲令下，要他把座位搬到模範生小琳（Film飾演）的前面，打算請小琳來好好

  「整治」他。起初，阿東跟小琳水火不容，不過一次意外插曲，卻悄然拉近兩人的距離，

  就此展開一段青澀的初戀故事。只不過這場女生比男生早熟的愛情，終將還是要面對現實

  的考驗…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。


