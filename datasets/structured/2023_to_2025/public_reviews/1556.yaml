title: '[情報] 泰版那些年【My Precious初戀】7/14上映'
content: '情報出處：



  我有一個超能力，超級喜歡妳

  【My Precious初戀】7月14日 我尬意妳




  ○【只因我們天生一對】製作公司，打造催淚愛情新經典！

  ○【初戀那件小事】之後，帶您再度重返難以忘懷的美好愛戀！

  ○ 紅遍全亞洲經典愛情電影改編，展現更多泰式幽默趣味！

  ○ 勇奪泰國本土新片票房冠軍，年度最揪心愛情電影！

  ○ 青澀回憶湧上心頭，呈現屬於Y2K時代的怦然心動！

  ○ 泰國人氣BL劇【Bad Buddy】Nanon與Ohm再度合體演出！

  ○【特長生】男主角Nanon演繹每班必備搗蛋王，為愛魯蛇大翻身！

  ○【只因我們天生一對】Film首度擔綱電影女主角，甜美演出模範班長！

  ○ 豐富泰國在地元素，傳遞泰式風情的迷人魅力！

  ○ 泰國青春戀愛歌王Nont獻唱甜蜜主題曲，MV大破2000萬觀賞人次！





  初戀，讓人心跳加速，也讓人椎心刺骨。

  第一次為愛受傷，也第一次想為一個人全力以赴。

  每個第一次…都令人難以忘懷，

  然而你還記得…初戀當時的感覺嗎？


  阿東（Nanon飾演）和其他男同學們，過著調皮搗蛋的幼稚高中生活，是學校跟老師眼中

  的麻煩搗蛋王。某天，阿東因為頑劣的惡作劇，讓怒氣沖天的老師一聲令下，要他把座位

  搬到模範生小琳（Film飾演）的前面，打算請小琳來好好「整治」他。起初，阿東跟小琳

  水火不容，不過一次意外插曲，卻悄然拉近兩人的距離，就此展開一段青澀的初戀故事。

  只不過這場女生比男生早熟的愛情，終將還是要面對現實的考驗…。






  --'
