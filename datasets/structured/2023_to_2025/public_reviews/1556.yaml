title: '[新聞] 【My Precious初戀】男神們大秀把妹絕技'
content: '新聞網址：



  帶領觀眾重返難忘初戀的清新愛情電影《My Precious初戀》，即將在本週五（7/14）於

  全台甜蜜獻映。本片以美好的高校時代為背景，描繪青春歲月中的初戀記憶，片中各主演

  男星們，為追求由Film飾演的可愛資優生班長，更使出渾身解數，大秀把妹招數，只為討

  她歡心。詮釋這段酸甜回憶的演員們，也大方暢談自己青澀的愛戀故事。陳炳林（Ohm）

  自曝初戀發生在小學，瓦奇拉維讓維瓦（Chimon）表示自己反而是被心儀女生先告白，柴

  尼姆塔瓦特（Neo）透露為了吸引心上人目光而加入學生會，納塞蘇里亞蓬柴坤（Euro）

  也回憶為愛每天鍛鍊自我游泳兩公里。當問及男主角格拉帕格潘（Nanon）的初戀經驗，

  他則感性表示：「我的初戀成就了更好的我。」更直呼：「我是永遠不會忘記她的！」





  描繪高中美好歲月的青春電影《My Precious初戀》，青澀的戀愛記憶可說是不能缺席的

  重要元素。尤其片中長相清秀、笑容甜美的資優生班長「小琳」，在班上相當受到男同學

  們喜愛，是眾人紛紛追求的真命天女，更成為大家「去上學」的動力。片中為了討小琳歡

  心，男生們各個成為情敵、秀出獨家「把妹絕招」！只見他們學魔術表演，只為博得關注

  ；還有自認是酷帥型男的同學獻上一系列土味情話；或是在一票幼稚男生們中大秀知識，

  藉以突顯自己的成熟氣質；更還有費時製作手工小禮物，只為討她歡心。片中一連串的求

  愛小撇步，用心到讓觀眾留下深刻印象。



  他們為愛使出渾身解數的模樣，也讓片中飾演「阿牧」的柴尼姆塔瓦特（Neo）回憶：「

  我在學生時代曾暗戀一個女生，如果單純只是同學，她是不會對我有興趣的，所以我就申

  請參加學生會，這樣在說話時，就能確保她一定會看到我，最後願望成真，她真的知道我

  是誰了！」此外，眾人也爆料塔納塞蘇里亞蓬柴坤（Euro）曾為心儀女生，每天游泳兩公

  里，就是為了讓體態看起來更好，讓他既害羞又尷尬的連忙喊「卡！」





  由泰國超人氣新生代演員們共同演出的《My Precious初戀》，不只帶觀眾再次體會初戀

  的酸甜記憶，也讓演員們都重新回想起那段歲月。當回想起個人的初戀故事時，陳炳林（

  Ohm）率先分享：「我的初戀很甜蜜，會想去學校見她。那是發生在我小學時，但她四年

  級就轉學了，她知道我對她有意思，但我不知道她對我是不是也有同樣感覺。」在片中演

  出自信男同學「阿班」的瓦奇拉維讓維瓦（Chimon）也分享：「我們住同一區，我單戀她

  ，後來她卻先跟我告白。她是我一直記得的初戀，那時會幫她修腳踏車、為她買點心，還

  不吃東西來存錢買禮物給她。」讓其他演員聽完起鬨：「有夠甜！」甚至連格拉帕格潘（

  Nanon）也讚道：「你很不簡單耶！」而Nanon則對初戀記憶感性透露：「我的初戀成就了

  更好的我，她讓我想變得更多才多藝、變得更好，她成為我做許多事情的動力。」更接著

  表示：「我是永遠不會忘記她的！」



  這部被泰國觀眾譽為「不可錯過」的清新愛情電影《My Precious初戀》，即將在本週五

  （7/14）於全台甜蜜獻映。本片劇情描述阿東（Nanon飾演）和其他男同學們，過著調皮

  搗蛋的幼稚高中生活，是學校跟老師眼中的麻煩搗蛋王。某天，阿東因為頑劣的惡作劇，

  讓怒氣沖天的老師一聲令下，要他把座位搬到模範生小琳（Film飾演）的前面，打算請小

  琳來好好「整治」他。起初，阿東跟小琳水火不容，不過一次意外插曲，卻悄然拉近兩人

  的距離，就此展開一段青澀的初戀故事。只不過這場女生比男生早熟的愛情，終將還是要

  面對現實的考驗…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
