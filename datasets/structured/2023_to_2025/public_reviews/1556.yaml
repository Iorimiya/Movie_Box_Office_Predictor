title: '[新聞] 【My Precious初戀】Nanon全裸秀肌耍屁！'
content: '新聞網址：



  集結泰國當紅新生代演員群，由《只因我們天生一對》製作公司催淚打造的清新愛情電影

  《My Precious初戀》，即將在7月14日於台灣甜蜜獻映。曾演出《特長生》、《Bad

  Buddy》、《黑名單》等話題泰劇的格拉帕格潘（Nanon），這回將在片中有大尺度的正面

  上空與背面全裸演出，而跟他搭檔的新生代女星拉查楠瑪哈菀（Film），也更是首度擔任

  電影女主角，兩人皆為本片有不少嘗試與挑戰！此外，演員們不僅在銀幕上呈現青春無敵

  的美好友誼，戲外更是感情超好，時常脫稿演出之外，還彼此立下「開拍後就不能有任何

  仇恨」的協議，也讓導演苦笑說：「他們實在玩得太開心，根本就沒有聽到我喊卡！」





  以青澀戀愛為主題，刻畫出Y2K美好年代的《My Precious初戀》，由泰國當紅男星Nanon

  領銜主演，也是片中「臭男生團」的頭頭「阿東」。他介紹自己的角色：「這個角色根本

  不想長大，認為當小孩很好玩，常和朋友出去玩、惡作劇，想著『我不想長大，不想做大

  人要做的事。』」因此，他在本片上演各種「屁孩」行徑，不僅正面上空，更還一絲不掛

  「背面全裸」演出，展現該角色沒有羞恥感的一面。尤其一場他作勢被神明附身的戲，他

  不僅需要口吐白沫，更要被首度合作的女星Film踢飛。回憶起這場拍攝過程，Film也分享

  ：「這次是我和Nanon初次共演，有一點緊張，但Nanon幫了我很多。那場我必須要踢他的

  戲，因為Nanon說可以真踢，所以我就真的踢下去了。」她也開玩笑補充：「本片可是沒

  用上特技演員呢！」



  值得一提的是，這次不僅是Nanon跟Film的首度合作，也是Film在2019年出道之後，首度

  擔綱電影女主角，她也對此感性分享：「回到四年前，第一次去試鏡『小琳』這個角色，

  那天的感覺很好，很開心也很興奮（雖然我還沒演哈哈），因為是第一個主演角色，能夠

  身在這個故事當中，讓我感到非常興奮，也有不少壓力。雖然我的經驗還不足，但會努力

  成長、做到最好。」





  帶領觀眾重返青春校園時光的《My Precious初戀》，不只表現出高校友誼的歡樂與美好

  ，演員們在戲外更是感情超好，時常自行加戲、脫稿演出。Nanon也對此坦言：「那裡沒

  有任何規則、沒有限制，任何人可做任何事，我對導演們感到有點拍謝。」演員們回憶起

  這段拍戲過程，也都紛紛呼喊：「特別開心！但真的太累了！」由於實在太常鬧成一團，

  飾演「老二」的陳炳林（Ohm）還分享彼此之間的約定：「我們在拍攝時達成一項協議，

  就是當喊了『開拍』之後，我們彼此就不能有任何仇恨了！」對此，導演卡妮薩坤宇（

  Kanittha Kwunyoo）也苦笑說：「他們實在玩得太開心，根本就沒有聽到我喊卡！我只能

  一直喊『卡！卡！已經喊卡了各位！』」不過她更接續分享：「這樣代表他們已經掌握住

  角色了，大家在一起時非常和諧，能夠敞開雙臂相互幫助，是一段美好的情誼。我對這部

  作品很有信心，希望能夠傳遞給觀眾。」同時也請觀眾能夠多多期待這部電影！



  這部被泰國觀眾譽為「不可錯過」的清新愛情電影《My Precious初戀》，即將在7月14日

  於台灣甜蜜獻映。「限量珍藏預售票」兩張420元，正在「博客來售票網」熱賣中（

  ）。本片劇情描述阿東（

  Nanon飾演）和其他男同學們，過著調皮搗蛋的幼稚高中生活，是學校跟老師眼中的麻煩

  搗蛋王。某天，阿東因為頑劣的惡作劇，讓怒氣沖天的老師一聲令下，要他把座位搬到模

  範生小琳（Film飾演）的前面，打算請小琳來好好「整治」他。起初，阿東跟小琳水火不

  容，不過一次意外插曲，卻悄然拉近兩人的距離，就此展開一段青澀的初戀故事。只不過

  這場女生比男生早熟的愛情，終將還是要面對現實的考驗…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
