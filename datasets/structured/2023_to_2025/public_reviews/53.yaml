title: '[好雷] 拿坡里的美麗傳說(Parthenope)'
content: "無雷心得就是:\n\n這部毫無疑問是我今年看過畫面拍得最美的電影XD\n\n\n\n\n\n\n\n\n\n\n\n\n=====以下有雷=====\n\
  \n這部看之前有先去查過imdb,\n所以大致有 劇情艱澀 畫面極美的心理建設\n沒想到比我想的還極端XD\n\n\n劇情的部份實在不能說容易理解,\n女主角Parthenope源自拿坡里舊名,\n\
  片中某種程度也象徵拿坡里女神.\n而導演在某幾段劇情刻意把神性與人類的界線混淆,\n導致你其實不是很能理解她到底在想什麼.\n何時女主角的意象是女神拿坡里,\n\
  何時又是凡人 整體來講難以捉摸.\n台詞又非常哲學,\n我自己的觀影體驗是完全沒辦法融入劇情XD\n\n如果只看劇情我給負雷XD\n\n\n但為什麼能給到好雷?\n\
  \n因為畫面實在 太 漂 亮 了\n\n不論是光影, 構圖, 色調都很完美.\n甚至鏡頭在移動時呈現的構圖全程都是完美的!\n這點沒幾部電影做得到\n\n除了鏡頭下的女主角Parthenope被拍得極美以外,\n\
  有幾幕背光搭配海灘與窗台背景,\n那個構圖與光影簡直是攝影展才會出現的作品.\n而劇中選角顏值超高,\n搭配義語BGM 儼然就是個超大型名牌廣告\n\n個人最被震驚到的是教堂內的那幾幕,\n\
  不論鏡頭如何縮放旋轉,\n光影與構圖始終完美 就算教堂正在整修裡面有鷹架也一樣..\n這樣的畫面非常值得在大螢幕觀賞!\n\nCeleste Dalla Porta劇中被拍得超級漂亮\n\
  之前看她本人照片只覺得是很一般的漂亮義大利女演員,\n但這部拍得充滿女神氣質 距離感與神祕感非常吸晴\n尤其那個眼神真的拍得很有戲\n坎城影展技術大獎(火神獎)攝影真不是蓋的XD\n\
  (有點類似人道主義吸血鬼裡面Sara Montpetit的狀況\n 攝影加分非常多)\n\n\n總之簡評就是:\n\n導演重金拍攝的故鄉拿坡里超大型旅遊MV(喂\n\
  呈獻拿坡里女神的絕代風華 絕對值得大螢幕欣賞!\n\nPS: 但.. 為什麼片中那部重機不是Ducati或Aprilia 而是Honda...XD\n\n--\n\
  美的令人屏息\n那個距離感也真的很有女神的感覺XD\n\n翻譯太像啦XDDDDa\n雖然都是南義大利沒錯\n不過這部義語片名是Parthenope\n\n直接歪樓XDDD\n\
  \n標題加註一下好了XD\n\n原來如此 難怪誠品跟華山光點都沒上..\n本來預期應該會在這兩間看的XD\n(不過最近他們選片也很謎 誠品放F1 光點放鬼滅...是不是有點不務正業XDDDD)\n\
  \n不過就算上串流或藍光還是覺得在大螢幕看非常震憾\n那個運鏡真的美到極致..而且不是日本電影那種濾鏡開到爆的作法XD\n\n我還是標示一下好了 免得誤解XD\n\
  這部中文名字辨識度有點低wwww\n\n所以攝影很猛啊\n把普通美女拍成女神XD\n\n我覺得是有\n但象徵意義是什麼我還沒參透..\n聖血奇蹟那個瓶子就放在拿坡里主教座堂裡面\n\
  \n劇情謎到不行 畫面美到不行\n兩小時超大型拿坡里旅遊MV XD"
