url: https://www.ptt.cc/bbs/movie/M.1760781210.A.59B.html
title: 'Re: [  普雷] 乖狗狗 為什麼我看不懂'
content: '我想我是懂了，《乖狗狗》到底在演什麼了。

  如果單純以狗狗的角度來看，或許主人生病而且是絕症這件事情，從狗狗的視角來說就是

  一種很驚悚的事情。那個泥人就像是病魔或者死神，總是想要把狗狗的主人帶走，所以牠

  總是很擔心，沒辦法睡好，經常作惡夢。


  生病的主人因為病情導致自己的情緒不穩定，甚至把狗狗關在外面，但狗狗終究還是想要

  進去屋子找主人、陪伴主人。到了最後，主人說了一句：「你是乖狗狗，但是你救不了我

  。」我覺得這應該是貫穿整部電影的關鍵對話。


  我一開始還以為主人是患有精神病，或者是憂鬱症之類的，才會有一些幻想。

  後面才想到說，這些應該都是狗狗的幻想，來自於狗狗自己所產生的恐懼。最後主人被拖

  走的畫面，是確定自己死後才出現的，之前也只是有所懷疑而已。


  阿公的詛咒房子，我覺得應該暗示這種病情是遺傳的，主人的家人或許也有多數都死於這

  種病之下(畢竟墳墓超多的)。主人回到阿公的老房子，也滿像是在暗示要在這裡度過安寧

  的日子吧。


  至於其他狗狗的骨頭，比較像是單純主人過世後，狗狗沒人發現，所以餓死了；或者為了

  陪伴主人，在這邊老死或過世了。

  發電機則比較像是主人的病情時好時壞，最後發電機掛掉，也代表主人的氣數已盡。


  總而言之，主人跟狗狗之間的互動是滿生動的，真的有養狗的人看了應該都會懂。

  但真的沒有很有趣啦，是一部比較沉悶的電影，而且畫面很暗，會讓人想睡覺。故事也比

  較乏味一些，畢竟如果用狗狗的視角來看，一切就算沒有邏輯也可以接受。


  --'
