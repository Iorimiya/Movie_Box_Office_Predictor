url: https://www.ptt.cc/bbs/movie/M.1760951767.A.78A.html
title: '[好雷]《乖狗狗》，牠看見的，聽見的，經歷著的'
content: '部落格版：



  在許多恐怖電影中，時常能夠看見寵物、特別是狗會對著空無一人的地方吠叫，或者來到

  新家卻怎麼也不肯進去，聽人總說那是因為狗看得見人類所看不見的鬼魂或者靈體。中國

  傳統文化認為狗是陽氣強盛的動物，具有趨吉避凶的能力，在西方國家亦有黑狗與靈界有

  關的傳聞，而科學角度來看則指出，狗天生具有的超凡感官，能讓牠們察覺到人類察覺不

  到的細微變化，當牠們因此突然有些不同於平常的反應時，才會被人類誤會是否看到了什

  麼或是聽到了什麼。然而時至今日仍然沒有人能夠斬釘截鐵的說，狗究竟能不能看到鬼魂

  或者靈體？過去幾乎所有的恐怖電影，都認定狗是能夠看見的，也多半用牠們的不對勁暗

  示觀眾，主角群即將遇上看不見的不懷好意，但似乎卻從來沒有一部恐怖電影，告訴觀眾

  「狗看見了什麼？」，印象中最接近的大概只有卡通《膽小狗英雄》，不過或許這個月之

  後可以再加一部《乖狗狗》。


  本週上映的美國電影《乖狗狗》絕對是今年最讓人驚喜的恐怖電影，導演班利昂伯格跳脫

  恐怖電影框架，選擇全程用狗主角印第的視角出發，帶領觀眾從不同角度進入未知、滿足

  觀眾對平常看不見的恐懼的想像，也讓觀眾知道在超自然力量找上主角之前，那些對著空

  無一人角落吠叫的狗狗們「正在經歷什麼」。不建議用看傳統恐怖電影的感覺來看《乖狗

  狗》，即便整部電影嚇人的手法、不時晃過的鬼影、閃爍的燈光、擺動的椅子等等，確實

  都是過往常見的嚇人手法，不過最大的差別在於《乖狗狗》從來都沒有想讓觀眾知道「整

  個故事的開始與結束」。看著發生在陶德身上的事，加上前面提到的片段，我會將這一切

  解讀成陶德家代代流傳的詛咒，家族的男性最後都會彷彿被召喚般的回到這棟林間小屋，

  再用同樣的方式死在這裡，而他們的身邊都會有一隻狗，如同輪迴。



  然而真正的答案是什麼？不知道。導演班利昂伯格顯然並沒有打算交代清楚，因為我認為

  他覺得不重要，事實上確實也不重要，畢竟對這部電影的「主角」來說，是詛咒或者其它

  牠根本不用、也可能不懂，牠在意的從來都只有主人的安全。好幾次都能夠感受到牠在害

  怕什麼，那如啜泣般的嗚咽聲讓人心疼，但到最後印第仍會跟著主人陶德，察覺到什麼的

  時候牠會在屋子裡巡視，當牠感應到的「那些」暫無聲息時，牠會在床上或者床邊守護著

  陶德。印第就好像《膽小狗英雄》裡的英雄，不論奧提斯還是後來的陶德怎麼對牠們糟糕

  ，甚至把牠們關在屋外讓牠們更加害怕，可牠們還是選擇用牠們不被人類理解的方式繼續

  保護他們、陪伴他們。


  如同狗看得見鬼魂這件事尚無法得到驗證，狗對人類是忠心耿耿的這件事，也不確定這是

  否是人們最擅長的自我催眠。可《乖狗狗》選擇並且願意去證實這樣的論點是確有其事，

  這不僅是為了讓電影發生的一切成立，更是讓觀眾、特別是有飼養寵物的觀眾能更投入電

  影、對印第產生心疼或是更多其他的情緒與情感。把自己投射進陶德身上，猜想如果是自

  己正處於焦躁的狀態時，平常再怎麼覺得可愛的狗，這時候靠近似乎也會跟陶德有著相同

  的反應，要牠不要來煩自己、不讓牠誰在平常睡習慣的自己身邊，忽略了牠的感受與行為

  背後的原因。



  當陶德冷靜過後心中有了懊悔，後悔自己不該這樣對待印第，可卻都已為時已晚，觀眾就

  跟著印第眼睜睜看著陶德被黑暗侵蝕，就這樣被拖入外公曾經顯然也被帶進的地下室裡。

  電影的最後，陶德的姊姊趕來時，早已不見弟弟身影，只剩印第孤單的坐在地下室裡，在

  姊姊呼喚著牠時，看著牠不斷朝著深處望去，心裡其實很怕牠像外公的狗，餓死在地下室

  化成一堆白骨都要留在陶德身邊，然後步入這個家族的詛咒輪迴裡，等待下一個他與牠的

  到來，那從無人知曉的地方傳來的低鳴，如今聽來像是警告也是求救，充滿著恐懼還有悲

  傷。那幾分鐘的時間裡，時間流動的好緩慢，緩慢到想閉上眼睛不忍直視可能的結局，可

  是幸好印第爬上了樓梯，坐在車子的後座座位上，跟著姊姊離開林間小屋，也告別了曾經

  的主人。你說這代表著詛咒解除了？可能有也可能沒有，像前面說到的這一切怎麼開始與

  結束對印第來說根本不重要，重要的是在陶德離開後牠的任務也就跟著結束了。


  《乖狗狗》不過就是轉換了視角，就成功帶給觀眾新鮮感，替恐怖電影注入新的血液，狗

  主角印度表現極好，極好到幾乎快認為是AI，從一舉一動到每個表情變化、歪頭，完完全

  全牽動著觀眾的情緒與神經，內斂而又沉穩同時鋒芒四射，讓人想起2023年《墜惡真相》

  裡的邊境牧羊犬梅西，甚至我認為印第更強過梅西，畢竟這是一部以牠為主角的電影，73

  分鐘至少出現70分鐘，從頭到尾必須維持保持在一個能量高度，稍有不慎就會破這部電影

  ，雖然可以用後製剪輯，但我認為那種不連貫的異樣感觀眾是感受的出來的。坎城影展都

  有專門的最佳狗演員獎項「狗狗金棕櫚獎」，奧斯卡金像獎不考慮增設獎項嗎？印第都拿

  下美國西南偏南藝術節（SXSW）榮獲最佳犬類表演，相信憑印第的表現，牠肯定是能在獎

  季橫掃的。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
