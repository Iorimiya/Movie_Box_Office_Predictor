url: https://www.ptt.cc/bbs/movie/M.1760853770.A.CC5.html
title: '[好雷] 乖狗狗_主人我會保護你...即使面對死亡'
content: '雷文防雷資訊頁


  以下含有劇透，請酌情觀看


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  電影評分:[9/10]無論多恐怖、乖狗狗都想從死神手中保護主人


  深山密林、獨棟老屋，恐怖片的經典場景，不過這次只有一人一狗


  電影投射出狗狗理解中的世界:陌生的環境、隱約感受到的死亡氣息、


  被病痛折磨的主人...，對狗狗來說一定是相當焦慮的環境。


  整部片有很多狗勾聞聞嗅嗅的鏡頭(還有聲音)，努力讓自己適應環境，可是越


  越努力越焦慮、因為有太多陌生甚至令他不安的味道了。


  以狗狗的視角去體會牠對環境的恐懼非常獨特，很多片段形象化描述狗狗內心


  的小劇場，最後的搶人(?)大戰也是非常精彩的演繹。


  如果是犬派的非常推薦去看，主角[印地]的狗狗演員非常棒、表情跟神態充滿


  戲劇性，有養狗的一定能接收到狗狗的情緒。


  恐怖的部分多是以逐步逼近的緊迫感為主、跳嚇成份不多、沖臉就一兩次。


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  如果把狗狗的鼻子理解為相當於人的眼睛，那可以解釋很多片中的情節


  例如主人阿公的狗班迪為什麼能出現、場景怎麼一直引導至地下室


  為什麼印弟能看見主人阿公的最後時刻等


  假設狗狗透過聞到的、結合看到的跟聽到的，在腦瓜中描繪出了一系列場景


  結果就是我們看到的恐怖片...好在狗狗最後離開了地下室、沒有困死在裡頭


  泥人的形象應該是因為環境裡充滿泥土味、而印第是隻城市狗


  陌生環境的味道自然讓牠把這個味道跟[壞]做了連結


  男主家族的人應該是某種腦部遺傳疾病，情緒會不穩、行為有時候會脫序、


  最後早逝。


  聲音也是讓印地害怕的原因，風聲像是地下室有隻狗在求救、外面的敲擊聲像是


  有東西在走動，一切都很陌生、一切都好恐怖。


  可是主人很痛苦、乖狗狗要幫助主人，於是就有弄得一身泥、後面從二樓跳下、


  扯斷狗鍊等等的情節。


  最後的搶主人大戰應該是狗狗想像的，因為主人的行為抽象到不合裡


  而且結尾本來栓著的鐵鍊也不見了。


  還好狗狗最後應該是放下了、跟著男主姊姊出去繼續生活。


  吐槽一下男主人:身患重病後自顧自搬到深山密林的老屋住、拒絕姐姐的探視


  被叮囑過卻硬要在雨天啟動發電機、把狗狗丟在牠完全陌生的家裡等等


  我知道恐怖片裡的人類都會降智但這也太明顯


  --'
