url: https://www.ptt.cc/bbs/movie/M.1760804485.A.789.html
title: '[好雷] 乖狗狗'
content: '電影開場就是主角Indy趴坐在躺坐著的男主人的腳邊

  伴隨著久震卻無人接聽的手機後

  鏡頭帶到已經休克，口鼻流出大量鮮血的男主人

  接著男主人的姐姐衝進來，慌張地撥打醫院電話


  男主人出院後沒多久

  獨自一人帶著 Indy 開車來到外公臨終前的山間居所

  在白天家族墓園中遇見外公以前的鄰居，閒聊中鄰居說到

  "很遺憾你外公以這種方式被人發現"

  接著就是多數以 Indy 的視角，發生的一連串詭異事件


  整部片沒甚麼 jump scare，主要是用音效製造懸疑感

  整個劇情扣除了男主人用頭撞門是因為重症末期的異常行為外

  其餘的事件應該就都是狗擁有超乎人類的感知能力的呈現

  (劇情中男主角播放外公留下的錄影帶時有提到)


  也因為狗具備超群的感知能力

  因此可以在沙發上感知到過去外公死前的掙扎和他養的黃金獵犬的足跡

  也可以感知到要來帶走男主人的死神氣息


  末段帶到地下室的黃金獵犬乾枯的屍體

  暗喻著當年外公過世時

  死神也是將其靈魂拉入地下室深處的洞穴裡(地獄?)

  而忠誠的黃金獵犬也如 Indy 一樣著急的想把外公拉回未果

  最後傻傻的守著那洞穴直到生命盡頭


  Indy 本來應該也會走向與黃金獵犬的終局

  但擔心弟弟身體的姐姐及時出現，呼喚著 Indy 離開

  才沒有走向過分悲傷的結局


  預告文案的那句 "今年最令人心碎的電影"

  從人的角度來看，阿就是男主角最後死了這樣

  但從本質上忠誠的狗的角度來看，確實是夠令人心碎了


  以實驗性電影來看算是蠻新鮮的，瑕不掩瑜

  導演確實將 Indy 拍成從頭到尾都很精神緊繃的狗

  這點還蠻用心的，因為狗這生物幾乎只要張開嘴就像在笑一樣

  還真從沒看過這麼嚴肅的狗，感覺一定卡了不少鏡頭

  中間可能也是用了大雞腿或是喜歡的玩具來誘導 Indy 的關注


  如果你跟本人一樣是狗派，那就沒甚麼好說的了

  狗派濾鏡戴上去，有狗就激推

  但即使你不是狗派，光是創新的電影敘事手法

  其實就蠻值得進電影院觀賞和支持的了


  --'
