title: '[普雷]《乖狗狗》當狗狗遇上超自然恐怖現象'
content: '是未知還是心魔，揣摩狗視角的實驗性劇情片


  在電影世界中「恐怖電影」是一個有意思的分類，除了如何讓觀眾嚇到直接了當的視覺恐

  懼之外，還有關於細思即恐、需要撥開面紗的深層恐怖。


  有時候這些恐懼是很直接、很文化性的，例如歐美的殺人魔、日式的白衣女鬼或是東南亞

  降頭，以人為本的恐懼，也通常以人類的視角點出發。但恐懼延伸到不只有人，而是其他

  動物眼中的話，那又會是什麼樣貌？這種想法顯得相當有意思。


  《乖狗狗》，是一部以狗為主角，也以狗的視角去詮釋恐怖的超自然恐怖電影。故事敘述

  狗狗印地，跟隨主人陶德般進祖父死後閒置鄉間的老木屋，開始新生活，沒想到狗狗印地

  卻對這棟住宅有所抗拒，牠覺得有奇怪的生物潛伏在屋內，而牠的主人陶德行徑也越發詭

  異，牠想要阻止不好的事情發生。但無卻不知道如何幫助陶德。







  《乖狗狗》是什麼電影？


  還記得十幾年前看了一本《約會不看恐怖電影不酷》（2013），裡面作者自序表示：還好

  我們還有恐怖電影。文章用比較幽默的口吻敘述他的恐怖片初體驗，與恐怖片的選片指南

  、甚至影響他的人生一些想法。


  書中也有提及一些關於非人的恐怖因素，其中作者將「植物」與「動物」表示為一種恐怖

  片恐懼來源的元素，成為一種特別的媒介，並舉例像是《番茄殺手》、《飛機上有蛇》等

  電影。的確在通俗的想像中，恐怖片的來源基本是以人的視角為主題，來營造恐怖感，但

  如以第三方或非人的角度來詮釋的故事就相對的少。


  雖然恐怖片的確有很多非人的元素在裡面，甚至有像《靈異第六感》（1999）這樣子以非

  活人視角的方式，來敘述整部故事。但以非人觀點來詮釋恐怖故事的主題的確不多。恐怖

  片《乖狗狗》嘗試以飼主的狗觀點，來面臨一段超自然的恐怖經歷，描繪狗狗印地隨著主

  人陶德一起住進陶德祖父去世後留下有點詭異的森林木屋，而開始經歷一連串恐怖遭遇。

  電影有許多模擬狗狗的觀看角度，特地壓低視覺角度，讓觀眾有種以動物的視角觀看事件

  發生的感覺。






  《乖狗狗》的導演－班．利昂堡在訪談中表示，會有這部恐怖片的構想是從大家都有疑惑

  的「狗狗為什麼總會對空無一物的地方吠叫？」，那邊是否有什麼人類看不見的東西存在

  ？或是感受到某種氣息？這種想法讓他架構出《乖狗狗》這部以狗為主角的恐怖片的雛型

  。飾演主角印地的狗狗，是導演自己飼養的狗狗，為了更好讓狗聽取動作指揮、和在拍片

  時有熟悉的人物在身邊較為放鬆，故選擇了自己的狗做為主角拍攝，來完成這部恐怖片，

  而這也讓狗可以更自然做出人與寵物犬之間，更為真實的默契。


  導演想突破一些傳統的敘事框架和鏡頭語言，並且以不是人類的角度去權是一樁恐怖事件

  ，但雖然飾演印地的是自己的熟悉的狗狗，但在拍攝動物演員時，還是面臨到許多人類演

  員以外的挑戰。例如：狗狗無法演出假裝看見、或是稍有動靜就會偏移鏡頭。


  最大的挑戰其實來於狗狗能觀看的視線，因為這樣的視覺畫面是觀眾不熟悉的，故其實無

  法使用傳統的構圖模式，這個困境在過去以狗視角描繪一生的《為了與你相遇》（2017）

  也遭遇過由動物視線的視角，必須重購電影畫面的構圖，來兼具效果和畫面美感。









  《乖狗狗》分析與延伸：


  其實《乖狗狗》並不是第一步以狗狗視角，或是想以動物的角度來拍攝的電影，如前面所

  提《為了與你相遇》就是以狗與主人相遇從出生到死亡的一生來敘事故事，拍攝也採用第

  一視角，由狗的觀看角度來拍攝，然後用配音來擬人化狗狗的心境。如果以恐怖片來說，

  動物視角的確是比較少見，但過去也有各種嘗試，像是1983年改編史蒂芬金的恐怖小說《

  狂犬驚魂》或是1982年的電影《白犬》，以狗攻擊人類的故事為主題，雖然主角還是人類

  ，但都有許多狂犬被侵蝕的場面，和攻擊人的動物視角運用在電影之中。


  不過像《乖狗狗》這樣以狗的視角去完全呈現的恐怖電影，可以說去恐怖片比較少有的，

  通常動物在恐怖片的視角，都比較像是加強恐怖要素的「死亡凝視」。例如《寂寞的豢養

  》（2016）、《金鼠王》（1971），都是在穿插動物視角的片段中，加深電影的詭譎感。


  但往往如《約會不看恐怖電影不酷》書中所說，是一種將動物視為「恐懼來源」。而《乖

  狗狗》則是讓狗作為主角去體驗恐怖的出現，這跟以往動物在恐怖片中是恐怖的來源，和

  象徵人類心裡的恐懼等作用是截然不同的概念，這也是《乖狗狗》備受關注的原因。







  但這邊有趣的一點是《乖狗狗》雖然電影標榜是以「從狗的視角體驗恐懼」，但主要是以

  視覺面的狀況為主，還有加上電影或創作常見的「動物擬人」效果。也就是說《乖狗狗》

  中觀眾感覺到狗感知到未知事物的恐懼，實際上只是人類單方面理解和賦予狗的感知，一

  種代演狗讓人覺得狗對未知感到恐懼的翻譯。這點導演在《GQ》雜誌的訪談也提過：「狗

  沒有真的害怕，是觀眾在害怕。」而這也延伸有意思的地方是，在觀眾所謂的生病說、超

  自然說、還有狗的內心世界的幻想，也許都是從人的思考面去理解狗，導演表示：「也許

  狗就只是單純的覺得那是不好的氣味，因為敏感想要吠叫而已。」


  故這也是《乖狗狗》電影不同於一般恐怖片有趣的地方，導演班．利昂堡表示整部片其實

  狗的各種行為與動作，都只是他按照日常反應而拍下來，實際上的恐怖感比較像是觀眾自

  己解讀，這樣的拍攝手法主要是導演遵行「動物倫理」而不刻意為了電影而要狗去做效果

  。


  這表示到兩點是真實拍攝狗的各種動作與吠叫並非是恐懼，而電影劇情的安排卻讓觀眾覺

  得狗像是在恐懼，並起推測導演想表達的故事內容，但如果以《乖狗狗》最初的構想是以

  「狗的視角」為主觀的恐怖片的話，也許狗的智力與年齡並沒有辦法想的太複雜，而牠的

  恐懼也許是來源於更直覺和動物性的解讀。






  《乖狗狗》值得一看嗎？


  因為不是以人為主角去拍，而是以狗的視角和觀感來拍攝，這讓《乖狗狗》這部電影有更

  多有趣的思考空間，而這樣的思考邏輯，我覺得可以用創作中解讀動物的「動物擬人」的

  想法；還有實際上科學般狗狗的思維模式去做思考，得到不同的解讀劇情的方式。


  例如，如果我們單純以一隻狗真實的習性來說，《乖狗狗》中印地的恐懼，可能只是單純

  是居住環境的不熟悉、主人情緒與過去不同，還有居住地鄉下的夜晚與都市截然不同的，

  讓牠對於氣味、聲音等事物的陌生，主人陶德無預警地大吼與處罰。如果以一隻狗的角度

  這可能就是恐怖片了。


  但如果以人去猜解劇情，就會得到更多層面，像是我們知道陶德生病，也可以從祖父留下

  的錄影帶，還有與人的對話來推斷，這間木屋可能發生什麼事情？然後可以用理性和感性

  的想法去推估故事，很可能真的是超自然的恐怖事件，當然也有單純是陶德生病的情緒大

  變。兩方面在去推斷印地，狗的視角。整體來說就會有更多解讀空間，而到底要怎麼解讀

  才是正確？我覺得導演很聰明的讓它成為人狗開放式結局。在訪談中他提到：《乖狗狗》

  的劇情同時能被「人類恐怖語言」與「動物行為語言」去做雙重解讀，這也表示答案可以

  從兩者去推斷。





  故我們可以得到有意思的結論，《乖狗狗》這部恐怖片，主人的恐懼與寵物狗的恐懼其實

  完全不同，但是狗的恐懼會因為主人情緒變化，和周遭的不熟悉而產生，但直到故事結束

  ，印地可能到最後還是完全不懂主人陶德的恐懼，而整個恐懼的背後就算有超自然出現也

  無傷印地作為一隻狗的恐懼，故這部電影不管是病痛、單純狗的視角恐懼和超自然都是合

  理的解讀，也都能同時存在。但在電影一開始雖主打「超自然」恐怖，但是人類的超自然

  還是狗的超自然這點是有意思，因為也許印地真的超越狗狗的認知了解主人的苦痛，才讓

  牠反應如此激烈也說不定？




  --

  個人Blog：

  小說連載頁：


  --'
