url: https://www.ptt.cc/bbs/movie/M.1421686970.A.998.html
title: '[新聞] 珍妮佛羅倫斯有望與星火燎原導演再度合作'
content: '文/Jean


  珍妮佛羅倫斯（Jennifer Lawrence）自《派特的幸福劇本》（Silver Linings Playbook

  ）拿下奧斯卡影后之後，即將三度與導演大衛歐羅素（David O. Russell）第三度合作。

  而在結束暢銷小說改編同名系列電影《飢餓遊戲》（The Hunger Games）之後，珍妮佛也

  有望與《飢餓遊戲：星火燎原》、《飢餓遊戲：自由幻夢》導演法蘭西斯勞倫斯（

  Francis Lawrence）再續前緣，共同合作新片《The Dive》。


  此片由真人實事改編，描述自由潛水員夫妻皮平費雷拉斯（Francisco “Pipin”

  Ferreras）以及奧黛莉麥斯翠（Audrey Mestre）的故事。自由潛水（Free-diving）是

  一種不攜帶呼吸器並以單一次呼吸的潛水活動。奧黛莉在2002年因企圖打破自己的記錄

  ，而潛到557.7英尺的深度不幸身亡。皮平則在隔年成功抵達557.7英尺，創下男子自由

  潛水世界紀錄。


  ------------------------------------------------------------------------------


  參考外電：Collider

  Jennifer Lawrence to Reteam with Francis Lawrence for James Cameron-Produced

  Biopic THE DIVE



  心得：小珍的電影不是必賣冒險片(X戰警與飢餓遊戲)

  就是奧斯卡熱門提名片(派特與蠻天大布局，這兩部片也很賣座)，

  她的際遇應該讓不少人嫉妒吧？


  其實《The Dive》還有一個關鍵人物，那就是票房大導James Cameron

  這是他在籌拍阿凡達時，一度也非常有意願親自下海擔任導演的企劃案，

  後來是因為考量到當時不少水中攝影的限制才擱置的，

  不過詹導仍然會是此片的製片人之一，

  此片的劇本也會由「陌生的孩子」J. Michael Straczynski

  與「隔離島」的Laeta Kalogridis接力合作


  --'
