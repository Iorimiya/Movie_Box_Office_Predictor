url: https://www.ptt.cc/bbs/movie/M.1448167076.A.9A8.html
title: '[專欄] 幕前幕後兩三事：《飢餓遊戲2：星火燎原》'
content: "【幕迷影評】電影知識 專欄分享\n\n\n[知識] 幕前幕後兩三事：《飢餓遊戲2：星火燎原》（2013）\nby 壕G\n\n\n網頁版文章（有圖文解說）：\n\
  \n\n\n\n最近在複習「飢餓遊戲」系列作，赫然發現當初還有看了一部叫做《雞餓遊戲》（The\nStarving Games）的惡搞電影，極具象徵性的仿生鳥圖騰變成烤雞，凱妮絲（Katniss\n\
  Everdeen）變成凱迷失（Kantmiss Evershot），這名字到底是指絕對要射中還是絕對射\n不中我也不太懂了。裡面惡搞的元素盡其所能的狂，有「復仇者聯盟」、「阿凡達」、「\n\
  浴血任務」等，甚至還有江南大叔Psy…！\n\n這部片的試映會剛好在我入伍前一天，於是我即便知道會是大爛片也還是心甘情願的參加\n試映，讓它成為我告別陽間的最後一部電影。也算是意義深遠吧。\n\
  \n\n\n然後按照慣例，先熱身一下，尤其是那個電影版才能展現的口哨聲。\n\n\n\n\n\n\n一、海神之子\n\n此次的飢餓遊戲出現了同盟的概念，當中扮演海神之子形象的山姆克萊佛林作為第四區的\n\
  勝利者重回遊戲之中，其帥氣度瞬間壓制哈契遜與漢斯沃，連男孩子也不禁心癢癢。\n\n然而即便他於片中身手矯健的角色令人印象深刻，卻有大半的NG鏡頭都歸他所賜。根據「\n\
  娛樂週報」的採訪表示，山姆在每一幕的拍攝中必跌跤，他跌跤的畫面如果經過剪輯集合\n成一捲影帶的話，那長度幾乎可以跟整部電影相比擬了，其中最嚴重的一次就是摔斷他的\n\
  手指。\n\n故事是這樣的，在某一場費尼克戰鬥的戲碼中，導演的指示是要他攻擊一名替身演員，當\n然借位假打是一定要的，但他每拍必跌的小腦殘廢症狀在此時發作，一個箭步飛出咕溜地\n\
  讓他一拳重重地打在替身演員臉上，卻沒想到因為他的手掌並沒有做好真正揍人的準備，\n於是敲在臉骨上的手指就這麼骨折了。他當下非常擔心替身演員的狀況而沒發現自己歪七\n\
  扭八的斷指，事後經過治療繼續拍攝，但那根手指再也不會恢復到原本的形狀。\n\n另外聽說他為了在拍攝時含一顆方糖在嘴裡來幫助他進入愛吃糖的費尼克角色，常常一場\n\
  戲拍下來他就吃掉了一整盒的方糖。其實我看他根本是在方糖裡放大麻偷吃，否則怎麼跌\n成這樣，懷疑他是怎麼活到這歲數的。\n\n\n\n\n二、秦納的善意\n\n\
  電影裡做為凱妮絲的服裝設計師，秦那多多少少也獲得了一些觀眾的關注。而在本片剛開\n始的幾幕中，凱妮絲總會穿著一套特別的羊毛製服裝，設定上他的服裝都會是由秦那所設\n\
  計，其實不只如此，在小說中那套羊毛服裝還別有用意。\n\n都城的規定上來說，每一個遊戲獲勝者日後都可以不必工作，但唯一條件是他們需要有個\n可以向世人展現的才藝。英文原名稱為「Talent」可以解釋為才華，但書中想展現的是與\n\
  十二區生活風格截然不同的都城規定，而這項Talent指的則是可以登上螢幕舞台，並讓觀\n眾們消費娛樂的Talent，這對十二區長大的凱妮絲來說非常不利，因為他的才藝就是「打\n\
  獵」。\n\n知道凱妮絲為此煩惱的秦那為他設計了一套極具特色的服裝，也就是代表獵人的羊毛服裝\n，而這套服裝獻給了凱妮絲，讓它能夠向都城自稱自己的「才藝」就是服裝設計，這也是\n\
  為什麼電影中常會有大家關注凱妮絲服裝的情節，雖然劇情沒有說明，但其實來源自小說\n中秦那的善意，為了幫助凱妮絲在大眾的檢視下有個才藝可供仰慕。\n\n\n\n\
  三、大旬祭\n\n大旬祭是第二部電影的重點故事，也是首次牽涉到「飢餓遊戲」的本質以及傳統，甚至放\n大了都城的安排與用意，帶著觀眾從普通的大逃殺踏入革命大火前的規模擴張，我想這也\n\
  是為什麼第二本書被稱為星火燎原（Catching Fire）的原因。\n\n二十五年舉行一次的大旬祭，在目前世界觀總共舉行了三屆，會擴大抽籤規模且增設不同\n\
  賽制，目的在提醒與紀念行政區在黑暗時期所犯下的錯誤與遊戲舉辦的原因。\n\n第二十五屆飢餓遊戲暨第一屆大旬祭，是為了提醒反叛政府的叛徒，孩子們的死因正是因\n\
  為當初他們選擇了暴亂。而此屆的抽籤規則更改為投票制，由行政區內的居民們投票選出\n祭品，也因此被推舉為祭品者幾乎都是與當初暴亂有所關連的後代，更是常被視為導致落\n\
  後行政區生活困苦的罪人。\n\n第五十屆飢餓遊戲暨第二屆大旬祭，除了要再次提醒當初的叛亂導致後代的犧牲，更要紀\n念當初暴亂發生時犧牲的無辜公民，而在每個犧牲的公民都必須有兩民叛徒陪葬的概念下\n\
  ，這次的抽籤額度為兩倍。也就是說，那一年的飢餓遊戲參賽者不只24人，而是48人。但\n歷史上只有凱妮絲與彼得為首次複數優勝者，故第二屆大旬祭共犧牲掉47名祭品。目前為\n\
  止的死亡總數為：1743人。\n\n第七十五屆飢餓遊戲暨第三屆大旬祭，也就是電影第二集、凱妮絲第二次的參賽，此次的\n主題為都城的強大，為了證明即便是各區的勝利者也無法抵抗都城，於是必須從勝利者中\n\
  抽出祭品。但相對的，落後行政區的籤筒裡有別於高等行政區甚至是專業供品區，只有寥\n寥可數的幾支籤而已。然而都城在許多用意極深的安排下卻漏掉了一件事情，他們間接證\n\
  明都城的承諾不可信，讓已經從飢餓遊戲中勝出且贏得自由的勝利者們再次被迫投入遊戲\n，助長了暴亂的火苗，也讓屬於專業供品區的第四區決定幫助革命派的重要關鍵之一。\n\
  \n\n\n\n\n\n四、花\n\n飢餓遊戲系列作是運用相當多花卉名稱寓意的作品，不少角色名稱都是以花或植物來命名\n，例如第一部中犧牲的小女孩小芸，她的名字為Rue「芸香」的意思，這也是為什麼中文\n\
  字幕翻為小芸的原因。相同道理的還有小櫻，全名櫻草花艾佛丁（Primrose Everdeen）\n以及她的貓「金鳳花」（Buttercup），另外男二蓋爾稱呼凱妮絲時其實和其他人的叫法\n\
  都不同，稱她為「Catnip」，沒注意中文字幕翻什麼，但是一種植物「貓薄荷」的由來，\n原著中會有這樣的稱呼是因為凱妮絲與蓋爾初次見面自我介紹時因為太害羞而講話太小聲\n\
  ，蓋爾聽不清楚於是將Katniss聽成Catnip，從此Catnip成了蓋爾的專屬暱稱。喔差點忘\n記說，Katniss本身在印地安語就是慈菇的意思，一種生於水中且根部可食用的植物。\n\
  \n另外於第一集時，小芸的戰死讓凱妮絲傷心欲絕，並將她抱在懷中為她唱了首搖籃曲「\nDeep in Meadow」，當中提及了凱妮絲總會在小櫻生病時唱這首給她聽，讓她想到家門外\n\
  的草坪上盛開的雛菊，而雛菊會保護你遠離任何傷害。\n\n好了講這麼多除了要補充我在上一篇忘記提到的內容以外，重點還是要告訴大家：請注意\n白玫瑰。白玫瑰的出現幾乎可以等同史諾總統，而白玫瑰在任何一幕都代表著導演想要表\n\
  明書中的某項精隨。至於為什麼提白玫瑰呢？其實「飢餓遊戲」是運用不少畫面上以及歌\n曲寓意的電影，但這對期待科幻大作或是期待精彩打殺戲碼的觀眾來說是很不習慣的一件\n\
  事情，很容易陷入劇情的拖冗節奏之中搞的沉悶難耐（尤其第三集整個大爆炸），所以利\n用白玫瑰當作入門的寓意檢視，便可以習慣各種導演安排在分鏡中的小巧思。\n\n\n\
  \n以上，是第二部的幕前幕後相關，一樣地盡量不會碰觸與小說的不同處，但會盡力補上電\n影輕描淡寫帶過的小說內容，讓各位更深一層了解其背後意涵後看起電影來也會有比較飽\n\
  滿的充實感。然後當然是要分享我最愛的一幕啦！第七區的伐木瘋婆在電梯裡的脫衣秀。\n這幕的拍攝場景是在一間飯店裏頭，而這飯店並沒有因為拍攝而停止營業，所以說珍娜馬\n\
  龍從開始脫到走出電梯之間，都有一堆人看著她。但當然，該貼該擋的還是有啦。\n\n\n\n\n\n\n相關圖片與參考資料\n\n一、IMDb\n\nThe Hunger\
  \ Games: Catching Fire (2013) on IMDb 7.6/10\n\n\n\n三、The Hunger Games WIKIA\n\n\
  \n\n四、官方網站\n\n\n\n\n\n\n--\n\n===================== power by =====================\n\
  \           幕迷影評 \n    臉書粉絲頁 \n====================================================\n\
