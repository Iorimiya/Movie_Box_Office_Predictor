content: "《#無名の人生》     #                                             巨幕導演限定場\n\n 佳映娛樂\
  \ 2026 開年重磅發行《無名の人生》\n   鈴木龍也旋風再訪，親自為你揭曉「人生」的秘密\n            每週限定觀影禮  日版獨家特典  三大特別放映\n\
  \n導演訪台首場．豪華旗艦體驗\n                                                      台北松仁    \
  \                  巨幕限定場\n\n這是一次獻給感官的最高儀式。在 TITAN 巨幕的極致呈現下，生命中微小的掙扎將被無限放大。鈴木龍也獨樹一格的動畫筆觸，與直逼幽微人性的生猛敘事，將在此獲得最完美的舒張。當燈光暗下，請準備好讓靈魂被影像吞噬，在黑暗中與過去的自己重逢。\n\
  \                              電影預告：reurl.cc/MMDOMp\n\n除了撼動人心的巨幕體驗\n購票更可收藏旗艦首發豪華特典\n\
  機會絕無僅有，請影迷設好搶票鬧鐘，錯過不再！\n\n    開賣時間：        /                    :         準時起售\n\
  \    售票方式：                                                  台北松仁現場臨櫃 │ 威秀影城官網 │\
  \ 官方\n    線上購票： reurl.cc/2l3Wgm\n    播映時間：        /                          : \
  \       -        :            間開演\n    映後座談：播映完畢後，預計進行          分鐘\n    播映地點：  \
  \                                                台北松仁\n    出席影人：導演 鈴木龍也\n    票　　價：全票\
  \              元 / 愛心票              元\n    觀影特典：特製電影三變閃卡乙張＋          導演特製款台灣海報（一組四款）\n\
