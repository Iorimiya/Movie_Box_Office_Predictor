url: https://www.ptt.cc/bbs/movie/M.1591961682.A.869.html
title: 'Fw: [新聞] 郭富城《斷網》拍攝人人有工開　城城家'
content: '作者: julie1026 (Julie) 看板: AaronKwok

  標題: [新聞] 郭富城《斷網》拍攝人人有工開　城城家

  時間: Fri Jun 12 19:30:44 2020


  郭富城《斷網》拍攝人人有工開　城城家棟相隔近十年後再合作


  香港經濟日報 16:48 2020/06/12

  由鄭保瑞監製，黃慶勳導演，郭富城主演的電影《斷網》於今日（6月12日）於何文田進

  行拍攝。郭富城早前舉行的《郭富城鼓舞‧動起來網上慈善演唱會》，為全港市民在抗

  疫期間獻上勁歌熱舞打氣，並籌得善款支援舞蹈員及捐款予演藝人協會抗疫基金，獲得

  一致好評。


  而在影市幾乎停擺了4個月的今天，郭富城表示很開心可以再次投入電影拍攝工作，而且

  合作演員包括《寒戰》的林家棟、《踏血尋梅》的譚耀文、白只，和新合作的賴雅妍等

  。郭富城表示：「完成了有意義的慈善演唱會，可以同時進入片場，是很開心，而且和

  熟悉的團隊合作，更有意義。至於雅妍，雖然是首次合作，相信也能擦出火花。」


  郭富城表示：「上半年影市受到疫情影響，給全行業造成非常大的打擊，我希望大家不

  要氣餒，在自己的崗位上做好準備，一旦工作可以重啟，大家把握機會就能逐步回復正

  軌。」他希望除了《斷網》，其他電影的拍攝，也盡快啟動，大家努力拍攝好電影，人

  人有工開。


  《斷網》郭富城演電腦天才


  今次郭富城在片中演天才電腦程式設計師，研發出一個能力超級巨大的智能程式，但這

  個AI程式卻不幸令自己與家人身陷險境。


  城城透露，《斷網》劇本充滿創意趣味及鬥智鬥力，亦有涉及大都會過度依賴網絡的探

  討，相信上映時必定引起很多反思及討論。


  台灣氣質女星賴雅妍在片中演城城太太，她表示：「這是第一次與Aaron合作，直接跳過

  情侶飾演夫婦，還有一個女兒，真的非常有挑戰性，面對影帝級對手，我已做好功課，

  好好投入角色。」


  郭富城與好戲之人鬥演技


  今天同場的林家棟表示，相隔近十年和郭富城再合作，也是很期待，因知道他是一個很

  會塑造角色的演員，所以也會好好準備，因為要在戲中狠狼對付他，相信少點心力也不

  不成。


  至於譚耀文和白只和郭富城在《踏血尋梅》內合作，三人已很有默契，戲中是敵是友難

  分，希望今次再「鬥戲」。


  撰文 :TOPick柴犬出動






