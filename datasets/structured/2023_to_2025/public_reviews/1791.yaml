url: https://www.ptt.cc/bbs/movie/M.1678443192.A.403.html
title: '[情報] 黑的 尖叫 塔爾 斷網 比留子 本週13+1新片 '
content: "☆導演：柯震東\n☆主要演員：戴立忍、蔡凡熙、張寗、宋柏緯、朱軒洋、春風\n★入圍第59屆金馬獎四項大獎：最佳新導演、男配角、視覺效果、剪輯\n\
  \n三個剛剛高中畢業的不良少年，大半夜不睡覺，在天台將一箱啤酒喝光。\n天亮前，他們決定分享自己心裡深藏的秘密，只有真正的兄弟，才夠資格知道自己最見不\n得光的惡行。\n\
  \n第一個秘密過去，哇你真夠扯的令人髮指……\n第二個秘密過去，原來你不只壞而且連靈魂都壞光光了吧……\n第三個秘密……等等！\n\n這第三個秘密不及格吧？我們跟你掏心掏廢說了足以毀滅人生等級的祕密，你就跟我說這\n\
  個！不行！NO NO NO！等價交換聽過沒！\n趁我們沒有宰了你之前，你得幹下一件足以跟我們交換的壞秘密！\n\n\n \n☆演員：任達華、郭富城、林家棟、賴雅妍\n\
  \n駭客突然發動襲擊，幸好天才網路保安主任卓家俊（郭富城飾）利用研發的防火牆，化解\n危機。孰不知這波攻擊竟是由其上司陳明志（林家棟飾）操控，他也因此誤入洗黑錢圈套\n\
  ，為證清白，他與陳明志展開網路攻防。\n此時，卓家俊研發的病毒突然失控，瞬間全城斷網，引起莫大恐慌，後果不堪設想…\n\n\n \n☆演員：謝君豪、毛舜筠、袁澧林、呂爵安、談善言、盧瀚霆\n\
  \n一頓混亂難堪的冬至團圓飯，成了一家人分裂的開端，八年後再次團聚，心底的裂痕是否\n還能癒合？\n\n\n \n☆演員：莉安娜莉貝雷托、寇特妮考克斯、梅莉莎巴雷拉、珍娜歐塔嘉、喬許塞嘉拉\n\
  \n繼上一次鬼臉殺手大開殺戒之後，四名逃過毒手的倖存者決定離開伍茲柏勒鎮，\n展開他們人生的全新篇章。\n\n\n \n☆導演：陶德菲爾德\n☆演員：凱特布蘭琪、亞歷鮑德溫、馬克史壯、妮娜霍斯、諾耶米梅蘭特\n\
  \n2023奧斯卡六項大獎提名，包括最佳影片、導演和女主角\n\n德國主要管弦樂團第一位女性首席指揮家莉迪亞塔爾的故事\n\n\n \n2023奧斯卡最佳紀錄片提名、榮獲威尼斯影展金獅獎。\n\
  \n紀錄攝影師南戈丁的生活與事業，以及造成藥物成癮的製藥公司賽克勒家族的垮台。\n\n\n\n☆演員：徐現宇\n\n在韓國檢察官之間將與凶殺案有關，暴力殘酷尺度較大、禁止外流的證據影像稱為「極祕\n\
  檔案」。製作人金秀燦（徐現宇 飾）得知錄影帶都被封印在檢察廳地下保管室的傳聞後\n，意外獲得了相關的錄影帶，並決定以此進行調查製作。錄影帶中所記錄的1992年東城莊\n\
  旅館凶殺案，與1987年峨嵋洞一家凶殺案的真相究竟為何？\n\n\n \n☆演員：羅伯特克耐普、約翰馬克維奇、馬汀勞倫斯、梅麗莎羅森堡\n\n城裡發生一連串針對女性的謀殺案，這些女性死後都被打扮成天使的模樣。因為做案手法\n\
  與五年前遭逮捕的連環殺人魔「藝術家」（約翰馬克維奇 飾）極為相似，為了抓到這名\n模仿犯，警探傑克（馬汀勞倫斯 飾）和瑪麗（梅麗莎羅森堡 飾）決定前往監獄尋求藝術\n\
  家本人的協助。然而，隨著調查的進行，兩人逐漸意識到這不是普通的謀殺案……。\n\n\n \n☆導演：塚本晋也\n☆演員：余貴美子、竹中直人、澤田研二、工藤正貴\n\
  \n日本松竹富士1991年恐怖電影，改編自日本奇幻漫畫家諸星大二郎的原著。\n日本影史傳奇妖怪人頭蜘蛛32週年登場紀念\n考古學家意外釋放了封印的比留子，引來一場腥風血雨。\n\
  \n\n \n☆演員：柳演錫、車太鉉 、金裕貞\n\n民秀（柳演錫飾演）跟女友求婚，對方竟爆出讓他驚呆的真相！原來女友對狗狗的唾液過\n敏，以至於每次跟民秀的黃金獵犬「魯尼」相處時，都必須先吞下抗過敏藥物…。面對愛\n\
  犬與愛人必須二選一，民秀不得已只好幫魯尼尋找一個完美保姆！他找來想開咖啡廳卻落\n空，人生也同樣面臨危機的表哥真國（車太鉉飾演）協助，一起為魯尼尋找合適的新保姆\n\
  。於是，兩個男人一隻狗，踏上從首爾到濟州的「狗保姆面試」之旅。\n\n\n \n☆演員：奧立佛麥蘇希、約翰納斯裁爾、山謬芬奇、馬克斯賽林傑\n\n二戰期間，住在維也納的律師約瑟夫（奧立佛麥蘇希\
  \ 飾）不幸被蓋世太保逮捕。遭到單\n獨囚禁，身心飽受煎熬的約瑟夫，某天偶然得到一本關於西洋棋的舊書，他決定潛心研究\n棋藝，作為心靈的出口……。\n\n\n\
  \ \n☆演員：查農桑提納同庫\n\n泰國現象級神劇《天生一對》電影版續集，男女主角泡泡哥Pope和Bella締造泰國億萬票\n房佳績，蟬聯票房冠軍26天，並一舉打入泰國影史前十名票房。\n\
  \n\n \n☆演員： 桑德琳波奈兒、傑哈德巴狄厄、柄本明、小泉今日子、長塚京三\n\n東方與西方的廚神對決，一場全明星陣容的美食之旅\n\n==\n\n\n\n\
  2023年3月12日（日）於”宮城縣綜合運動公園綜合體育館”舉行的 《羽生結弦 notte\nstellata》滑冰演出，於日本全國、香港及台灣的電影院舉行現場直播！\n\
  \n\n\n\n\n--"
