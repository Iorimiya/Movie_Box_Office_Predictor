url: https://www.ptt.cc/bbs/movie/M.1678892979.A.27B.html
title: '[普雷] 斷網-郭帥開無雙'
content: "雷文防雷資訊頁\n\n\n\n看了預告，想看一下網路戰視覺化開好開滿的感覺。\n以下多劇情雷，慎入。\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n人權:\n\n\
  劇情大綱:網路安全公司監守自盜搞洗錢，郭帥不想為五斗米折腰。\n         一個人開無雙能文又能武搞定整個洗錢後台。\n\n整部戲著重在，將網路攻防從以往單調的電腦文字畫面，轉以視覺化特效呈現。\n\
  視覺享受就值得好雷，但如果只單論劇情就是負雷了。\n\n腳色介紹:\n主角:郭帥\n反派主角:林帥\n無路用警察頭頭:達叔\n\n劇情嘈點:\n一、線索找到第一個替死鬼身上時，都知道這洗黑錢的幕後藏著有力人士了，\n\
  \    達叔脅迫郭帥協助辦案的時候，居然沒有派員警保護他跟他家人?\n\n二、郭帥烙跑的過程是典型的港片一打多橋段，邊打邊利用地形的板模套用，\n    只差沒有甩手就是了(棒讀)。\n\
  \n三、達叔跟林帥怎麼都知道郭帥以前的豐功偉業還坐過牢?\n    不是說郭帥把過往犯罪紀錄都洗掉了，你們兩個開上帝視角喔?\n\n四、媽媽打鬥橋段，你都要偷襲了還喊那麼大聲?是怕別人不知道你在哪啊?\n\
  \    媽媽保護女兒的時候千萬不要惹，拿著槍不用的女殺手便當領好慢走不送阿。\n    註:整片是資訊戰，但是綁架卻不知道要把身上所有電子設備搜出來(白眼\n\
  \n五、第一個替死鬼多洗了三個帳戶時，林帥的小弟A都知道要跟BOSS打小報告了。\n    林帥把整筆錢拿去買加密貨幣呢?小弟A跟B兩個是傻了還是先被林帥處理掉了?\n\
  \    怎麼變啞巴，還是按劇情推測是全港的手機只有主角幾人的有reset過能用?\n\n六、除了從一開始查到郭帥有嫌疑，並脅迫他辦案外，整個網路犯罪搜查小組0作用，\n\
  \    沒保護該保護的，反在關鍵時刻去追捕兩夫婦，過程中所有資訊也都是靠郭帥給的\n    不知道是否編劇想諷刺港警/公務員的無能?\n\n零零總總下來，好好欣賞視覺效果就是開心爆米花片，劇情只能說慘不忍睹。\n\
  \n\n\n--"
