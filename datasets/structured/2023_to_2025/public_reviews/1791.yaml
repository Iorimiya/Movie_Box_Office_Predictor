url: https://www.ptt.cc/bbs/movie/M.1678729025.A.D12.html
title: '[好雷]  斷網 網攻示現化 特效開滿'
content: '雷文防雷資訊頁


  個人覺得郭演技還是不錯


  而且這部看到好久不見的賴雅妍


  電影中還有打戲 不單純是演花瓶的角色


  滿驚訝她能搭到郭的 畢竟郭咖位這麼大



  電影劇情滿簡單的 講一個IT高手 被迫從事非法的行為


  和壞人搏鬥的故事 雖然講的很含糊 但盡量不爆雷



  最大的亮點 就是把網路攻防 用特效概念化


  這點做的非常棒 把這些數據 變成實際的狀況


  讓你感受現在發生什麼事情 這點令人相當驚艷


  所以我認為進電影院看 不虧 不是香港那種單純的劇情片


  流於藝術表現 沒有大場面



  其中我自己覺得的雷點就是 主角光環確實有點強


  我是稍微有點小出戲 但勉強可以接受


  而且劇情邏輯安排的滿精彩的 銜接上有一定程度的反轉


  尤其有設定暗網世界的探索 算很特別



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~























  主角光環大概就是郭真的太強 不是說IT人員一定要很柔弱


  但可以一個打人家三個打手還跑掉


  一個對幹整個警隊還跑掉


  不知道該說香港的黑道太弱了 還是香港警察太弱了= =


  唯一可以解釋的大概就是 他們都是要抓他 不是要殺他



  賴雅妍跟女殺手打架也略顯浮誇


  但看的出來拍的滿認真的 沒有花拳繡腿的感覺


  雖然她把殺手打趴下真的偏扯


  只能用母愛的力量很偉大來解釋這一點了



  整個劇情真的略顯簡單


  就是郭被洗黑錢的上司威逼利誘讓他幫他們做事


  郭不願意 衍生一系列的後續故事


  把壞人幹掉 就結束了


  我只是單純覺得 電影裡面一開始塑造很強大的大魔王


  就帶一個隨扈幾槍被幹掉有點太瞎扯


  此外 郭的上司捲了20E要跑路 大魔王居然還沒反應


  是覺得20E太少所以不用特別盯嗎



  另外就是暗網那邊直接爆發 無所不用其極開外掛幹爆眼前一切事物


  這個超帥的


  有點人肉搜索那部電影的味道


  但因為全部特效化 觀影體驗真的好多了


  另外人工智能的想像也很有趣


  人工智能+病毒那一幕 直接破了17道防火牆的特效好帥阿



  最後就是 任達華的角色很醬油


  一個警官從頭到尾在後面看戲


  算是可惜了 沒有什麼發揮到


  整部戲幾乎可以說是郭一個人的獨秀


  郭的粉絲去看應該是也還不錯


  --'
