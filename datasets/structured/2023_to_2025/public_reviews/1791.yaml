title: '[閒聊] 斷電斷網的電影'
content: '斷電的電影:《生存家族》矢口史靖執導。 2016的日本電影

  豆瓣8.0 ，Imdb7.2 預告



  在一個司空見慣的早晨，正準備要起床上班、上學的鈴木一家，意外發現家裡所有東西都沒電了，原以為只是普通的停電，沒想到是擴及整個國家的大事件，全國的電力都徹底消失了，交通停擺、手機失靈，一切回歸最原始的自然生活，面對突如其來的危難，鈴木一家能不能團結一心，一起度過這個難關


  演員：小日向文世 深津繪里



  斷網斷電的電影

  2023《斷訊》| 正式預告


  一家人到豪華民宿度假，豈料發生網路攻擊，他們的 3C 產品全壞了，此時還有兩個陌生人出現在門口，開心假期瞬間驚悚變調。

  主演： 茱莉亞·羅勃茲、伊森·霍克和凱文貝肯


  電影前中段懸疑氣氛營造不錯，收尾略嫌草率。


  斷網斷電影響飛航管制 船舶導航和汽車導航等


  現實生活萬一遇到長期斷電斷網，有無備用方案？



  -----

  Sent from JPTT on my Samsung SM-A3460.


  --'
