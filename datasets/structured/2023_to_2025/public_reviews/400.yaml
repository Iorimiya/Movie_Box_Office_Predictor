title: '[普雷] 《女警撞到夫》逃走可恥還沒用？'
content: '笑著笑著就哭了，都市浪漫的農村想像


  務農田野、純普人民、好山好水，這可能是許多人對於農村和偏鄉地區的想法，有著綠油

  油的草皮，還有逃離城市的煩擾，人際關係也相對單純。對於現代人來說，都市生活雖有

  便利性和往往會覺得疲憊不堪，甚至太過於喧囂，而對於離開城市的農村有所想像。


  實際上來說想像是美好的，現實卻不是這回事，有時候農村生活的悠閒只是一場旅行所見

  ，暫時逃離忙碌生活的一種調劑，真正生活於農村可能就完全不是這回事。


  奧地利電影《女警撞到夫》是以冷冽幽默為主題的農村諷刺電影。正直的女警安卓雅準備

  從家鄉農村調職，但在一晚她意外撞上了自己要離婚醉酒的丈夫，逃離現場。沒想到安卓

  雅並沒有被逮捕，被逮捕的反倒是一位過去有酗酒問題的男教師？因丈夫去世被眾人同情

  的安卓雅，開始思索自己所做的選擇，而天人交戰。







  《女警撞到夫》是什麼電影？


  你對於鄉下生活有什麼想法，台灣因整體面積不大，有時候鄉村與城市的差異性並不明顯

  ，但實際上許多非六都主要城市，或離島、東部山區等地，還是田舍小鎮長大的人，都還

  是可以了解那種鄉村與城市的不同。對於許多生活在都市的人的鄉下農村生活的嚮往，有

  時候是一種「美化後的理想 + 都市生活勞累」所有的一種逃離感想法。同時對於從鄉下

  到都市工作的人來說，鄉下往往是一種退路，或是對於過去成長的記憶，故鄉下生活的美

  好，有時候是一種情感寄託大過於實際面的狀況。


  而這樣的狀況並不是台灣獨有，例如：日本過去的長青電視節目《來去鄉下住一晚（田舎

  に泊まろう！）》就以不同藝人在日本各地鄉下村落拜訪，跟當地人借宿一晚體驗鄉下人

  生活為主題，展現鄉村的美好。這其實就是抓住了都市人對鄉下想像的一種成功的推廣模

  式。


  在歐美等地，固然也是不少現代人有著農村樂的想法，但有點不同的是，歐美的農村生活

  ，除了單純生活風格的憧憬之外，還有著如對社會體制的不認可和歷史與族群認同等面向

  ，這點讓歐美鄉村有時候有著一個地區群體的複雜性，更加濃烈，這點讓人想到日韓傳統

  農村印象也是如此。






  《女警撞到夫》這部奧地利電影的主題，正是對於奧地利部分都市人盲目對農村生活的嚮

  往性，做出黑色幽默的劇情呈現。故事以女警安卓雅在要離開自己從小到大的鄉村到其他

  地方就職前，意外撞上行走在路上要離婚的酗酒丈夫，並駕車逃逸。結果鄉下沒有任何人

  懷疑安卓雅她是兇手，反倒一位過去有酗酒問題的老師成為了代罪羔羊。面對這種荒謬的

  狀況，女警安卓雅她正直的理念受到天秤搖擺，要繼續隱埋事件真相、或則坦白？但不管

  哪一方都將會是對她的煎熬。


  導演－約瑟夫哈德表示，這部電影是對過往奧地利人堅信的：「奧地利鄉村非常特別。」

  一種反諷性。根據原本的電影劇本，安卓雅原是以跟鄉村男人一樣強悍的女牛仔形象，但

  後職業改變成女警則反是象徵奧地利的制度與道德，讓整部黑色喜劇的形象更強烈。


  故關於，奧地利人堅信奧地利鄉村非常特別，這句話可能從原本的自豪句，轉變成一種自

  嘲性的幽默，對於一些守舊派人士視農村生活為「真正的奧地利精神」的一種調侃。











  《女警撞到夫》分析與延伸：


  實際上對於「農村、鄉下地方的美好想像」，有時候可能是一種人為的方式。例如在中國

  過去20世紀的下鄉運動，便是以體制和共產政府制度下的一種展現，這也表示中國上山下

  鄉運動的推展，並不是人民主要的意願，而是因為強制政策和共產政府營造的意識形態。

  這種方式與其他國家的差異性在於人民的自主性和自主意願，更像是日本過去軍事國殖民

  時期，所一種宣傳的殖民地方耕耘的操作手段，當時日本如滿州國、台灣、韓國都有這樣

  以政策誤導日本國人民前往他地的操作。


  但在現代以世界對於民主的趨勢，已經鮮少有這樣的事情發生。以日本為例在1980年代就

  有為了不要讓城鄉差距拉大，而有著鼓勵都市居民回鄉、移居農村的補助政策。這政策約

  有700萬人民搬遷到鄉村與小城市。


  對比上，奧地利的鄉村與都市差距仍然是一個問題，奧地利的都市化程度持續上升，幾乎

  每年增加約7萬的人口進入大都市，鄉村面臨老齡化的問題也是日漸增加。這其實並不是

  日本或奧地利的獨有問題，而是全世界都面臨鄉村老齡化，在鄉下無法有任何吸引力，來

  讓年輕人或都市工作者返回鄉村。







  翻轉鄉下的印象有時候是一種手段，例如許多國家都推出有著許多復古元素的電視影集、

  電影、甚至連遊戲也是，這對於觀看電視電影娛樂成長的邁入中年的年輕人，有相當吸引

  力與記憶連結。故從中我們可以推測出人們為何會有關於鄉下美好想像？很有可能是一種

  人為的建構，人們對於「鄉下」往往不是體驗得來而是一種透過二次創作、娛樂休閒產業

  打造出來的鄉村風景。這就跟台灣往往對於原住民的部落有著：好客、悠哉、山水寶地的

  印象，是一種將好的一面創造出來，讓人嚮往。但近幾年如《獵人兄弟》、《太陽的女兒

  》、《只有大海知道》都帶給觀眾跟以往不同，血淋淋的部落土地問題與父母離鄉工作孩

  子獨留家鄉的教育、社會問題。


  法國對於符號學、神學有所研究的文學、哲學家－羅蘭巴特，就曾經指出現代社會上媒體

  所謂的神話與造神，會將某些社會現象包裝成「自然常識」，如鄉村生活被創作成「悠閒

  與回歸自然的美好」的神話（美好）象徵。


  英國社會主義學者雷蒙德威廉斯也表示過：田園只是一種文化反動，心理慰安多餘實際。

  電影《女警撞到夫》其實是用一種娛樂與反諷的方式，敘述當代的奧地利農村，在想像中

  美好之外，無知、莽撞、混亂，除了少了燈光，你要面對的只是換了個地方生活的人群。








  《女警撞到夫》值得一看嗎？


  這部作品是一部非常小眾，且故事結構簡單的電影，就算並不是對奧地利鄉村有多了解，

  或是不懂裡面的諷刺性，也是可以感受到那種冷冽的幽默，或是不刻意去說梗、玩笑的諧

  星角色出場要鬥你開心。但也就跟導演想表現的事物一樣，就是如果你看這部電影，覺得

  一整個太過荒謬，那現實的農村鄉下生活，可能要遭遇的遠遠不止這些，甚至文化涵養、

  人際關係等能否遇到對的人，基本與城市生活無異，只是少了建築多了空地。


  約瑟夫哈德導演有意要打破這種鄉村的幻想，如同我們這一代的年輕人總是有種，到城鎮

  小巷弄開一間咖啡廳的文藝想像，還有出一本自我認可的書、拍出屬與自己的電影作品，

  和一種完美無瑕的個人風格相片。


  但實際上現實卻不是那種美好想像，《女警撞到夫》中是一種寫實的現代鄉村的寫照，沒

  有太多消遣只有酗酒跟舞廳、周遭所有人都認識你的壓力、無論好事壞事在一天所有人都

  知道。想像很美好，現實卻殘酷，如同我們看電影的人總做著文藝大夢一樣，但有時候會

  不會是裝睡的人叫不醒的狀況。








  《女警撞到夫》故事非常的直線，也沒有太多迂迴之處，這樣電影的特色在於那種日常的

  諷刺、與笑點。很吃是否喜歡這種一本正經，不刻意搞笑，需要意會笑點的觀眾。如果喜

  歡有場面或是有一些較明確衝突感和誇張風格的觀眾，《女警撞到夫》可能不太適合。


  雖然電影得到滿多影評的喜愛，但奧地利電影很喜歡「用慢表達影像的內斂感」甚至營造

  出反高潮的樸實感，這樣所造成的感覺有時候會讓人覺得很做作、故事平淡無趣。像是韓

  國電影每每高潮大翻轉，奧地利電影比較難有這樣的場面出現。


  可以說這部電影，是藉由反諷鄉村的想像，可以延伸出：我們對於某些事物的美好想法，

  是否是出於一種被人為操作的想像。而實際上並非如此，《女警撞到夫》中的女警安卓雅

  不斷想逃離此地，觀眾藉由她的日常看到許多奧地利鄉下地方的荒唐常態和人際關係。同

  時也看到她活在這鄉下那麼久，對於一些事物的麻痺、無感，到後續發生的意外，更加速

  她對於這種生活多年地方的荒謬感，還有自身是否也要如此荒唐的抉擇。不管怎麼選擇都

  沒有好事，在都市亦然，鄉村亦然。




