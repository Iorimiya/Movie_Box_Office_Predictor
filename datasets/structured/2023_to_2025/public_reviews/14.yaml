title: '[新聞] 【放飛旅行團】擊退【鏈鋸人】韓票房奪冠'
content: '新聞網址：



  超越《特務搞飛機》、《樂透大作戰》的年度最瘋狂爆笑喜劇《放飛旅行團》，昨日（

  10/29）於南韓正式上映，從預售票房、網路評分與觀眾口碑都全面稱霸，更一舉終結《

  劇場版『鏈鋸人蕾潔篇』》連續三週票房冠軍紀錄，強勢登頂南韓首日票房冠軍，光是首

  日就吸引超過8.2萬名觀眾進戲院同樂，氣勢如虹、笑聲炸場，正式宣告今年最HIGH喜劇

  旋風全面來襲！此外，觀眾也對主演之一的車銀優的演技蛻變印象深刻，直呼：「這是他

  出道以來最打動人心的演出！」尤其本片故事將從車銀優角色的旁觀者視角展開，因此他

  將有許多旁白的聲音表演。提到旁白演出時，他笑稱自己已經有段時間沒穿校服了，所以

  努力讓語氣保持純粹且自然的感覺。此外更大力推薦本片：「能讓大家再次感受到學生時

  期或青春時代的回憶、懷念與熱情。希望大家能到戲院透過大銀幕、環繞音效體驗這份情

  感，再次和我們一起感受那時的青春。」《放飛旅行團》台灣也將接力南韓，於11月14日

  歡樂獻映。





  根據南韓電影振興委員會在昨日（10/29）公佈的預售票房數據，《放飛旅行團》以28.3%

  的預售率，以及8.4萬張的預售票量蟬聯兩項榜首，尤其從本片上映前十天到昨日上映當

  天，始終保持著預售領先地位，充分展現觀眾對這部電影的期待。就當日本動畫電影《劇

  場版『鏈鋸人蕾潔篇』》已經連續三週蟬聯票房冠軍的同時，本片也憑藉在預售方面的領

  先優勢，一上映就順利登頂票房冠軍，吸引超過8.2萬名觀眾進戲院同樂，更在主要電影

  網站上獲得觀眾好評佳績：NAVER電影8.5分（滿分10分）、樂天影院8.8分（滿分10分）

  、CGV金雞蛋指數86%（分數越高代表評價越好）。觀眾看完紛紛直呼：「比想像中更有趣

  ！原以為只是輕鬆喜劇，沒想到竟然還有感動，是男女老少都會喜歡的電影！」「好久沒

  看到笑點與感動兼具的電影了！」「中段情節完全抓住我的目光，讓人重新思考『友情』

  這件事。」讓本片可說是笑聲與口碑雙雙豐收！





  值得一提的是，《放飛旅行團》除了是「臉蛋天才」車銀優的第一部大銀幕主演作品，更

  是他在入伍前獻給粉絲們的最後一份驚喜禮物，也讓不少觀眾為了他進戲院，並在觀賞後

  大力稱讚：「車銀優的帥氣臉龐讓人心情大好！」「這是他出道以來最打動人心的演出！

  」車銀優所飾演的「廷民」，是一位性格內向、略帶孤僻氣質，並擁有帥氣外貌的角色，

  但和朋友們在一起時，就會展現出有些古怪、出人意料的一面。他透露自己因為非常喜歡

  喜劇類型，因此想要挑戰看看，加上劇本真的很好看，並覺得跟姜河那、金英光、姜泳錫

  等演員們合作一定會很開心，所以決定加入。尤其全片會從他角色的旁觀視角展開故事，

  幾乎從頭到尾都有他的旁白，這也讓車銀優略帶壓力：「一開始有點壓力，但同時覺得很

  有趣，像是在描繪五位好友的青春，也讓我想起自己年少單純的時光，因此感覺特別溫暖

  。」



  他更大讚同片演員姜河那是他非常喜歡的演員：「我以前還特地去看他的舞台劇，那時候

  只是簡單打招呼，這次終於能在作品中合作。他在片場總是充滿活力，尤其在化妝或準備

  時，總會第一個打招呼，是那種會讓現場氣氛立刻HIGH起來的前輩、朋友和哥哥。他也經

  常主動提出想法，讓許多場景變得更加有趣、生動。」而在《叢林的法則》節目中結緣的

  金英光，由於有過合作經驗，也讓他感到相當自在：「我們平常也常聊天、交流想法，很

  合得來。」他也笑稱姜泳錫在片中的造型超有趣：「他一開始戴假髮，後來又因為角色修

  行而剃光頭。」更進一步指出：「他本人性格開朗幽默，常常開玩笑，讓拍攝現場總是充

  滿笑聲，也因為這樣，我們相處得非常愉快。」這也讓車銀優在拍攝本片的過程中相當開

  心，即使因為服役無法參與後續宣傳，他也依然期盼觀眾們的支持：「本片能讓大家再次

  感受到學生時期或青春時代的回憶、懷念與熱情。希望大家能到戲院透過大銀幕、環繞音

  效體驗這份情感，再次和我們一起感受那時的青春。請大家多多支持，也希望你們能看得

  開心！」



  這部超越《特務搞飛機》、《樂透大作戰》的年度最瘋狂爆笑喜劇《放飛旅行團》，即將

  在11月14日於台灣歡樂獻映。本片劇情描述堅持到底的瘋狂執著者、活力爆棚的樂天派、

  顏值爆表的潮流DJ志願生、腦洞大開的怪咖，還有直率爆笑的傻大姐——這五位從小一起

  長大的死黨，雖然個性南轅北轍，但卻默契滿點。在友情屆滿24週年之際，他們終於迎來

  夢寐以求的「人生首次海外旅行」！只是沒想到，這場說走就走的旅程，卻秒變災難現場

  ：丟包、誤會、鬧劇不斷升級，他們能否克服重重危機，重新找回彼此？而這場瘋狂之旅

  的終點，會是一生中的難忘回憶，還是友情的轉捩點呢？



