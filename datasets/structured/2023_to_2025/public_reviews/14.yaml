title: '[新聞] 【放飛旅行團】笑翻南韓，連7天票房奪冠'
content: '新聞網址：



  超越《特務搞飛機》、《樂透大作戰》的年度最瘋狂爆笑喜劇《放飛旅行團》，即將在11

  月14日於台灣歡樂獻映。本片在南韓上映前，就進行大規模的口碑試映，並獲得炸裂般的

  好評，這也讓本片於上週三（10/29）在韓正式上映之後，不負眾望榮登首週末票房冠軍

  ，更連續六天穩坐票房榜首，截至今日（11/4）已經累積近41.7萬觀賞人次。尤其本片以

  「友誼」為主題，講述一群好友從青少年成長到三十多歲的故事，被譽為老少咸宜，不論

  學生、朋友、情侶或家庭，都能從中獲得樂趣與啟發的作品。值得一提的是，本片主演之

  一的「百想藝術大賞視帝」姜河那，今年就有六部電影與戲劇作品跟大眾見面，展現出比

  誰都更加「拼命工作」的一年。不過他在接受訪問時表示：「其實我現在手上沒有新作品

  了」更還驚爆：「我沒有打算一輩子演戲」，一席話引發各界關注。





  《放飛旅行團》在韓上映後，果然笑聲持續不斷，不僅榮登南韓首週末票房冠軍，更連續

  六天蟬聯票房榜首，截至今日（11/4）已經累積近41.7萬觀賞人次。電影的高票房也進一

  步提升口碑，讓觀眾對這部輕鬆愉快的作品產生更多的好奇並走進戲院。憑藉這股氣勢，

  外界也廣為預測將持續獲得票房冠軍佳績。尤其已經觀賞過的觀眾，都稱讚全片輕鬆幽默

  的風格、演員們的精彩化學反應，以及令人耳目一新的導演手法，都激發他們對旅行的嚮

  往，諸如：「全程都在笑！這是我今年看過的最爆笑的電影！」「演員們演得太棒了，電

  影太精彩了！」「我笑到停不下來，從頭到尾都讓人捧腹大笑！」「導演手法引人入勝，

  節奏也非常緊湊！」尤其本片以「友誼」為主題，講述一群好友從青少年跨越到三十多歲

  人們的故事，因此被譽為是一部老少咸宜的佳作，無論是學生、朋友、情侶或家庭，都能

  從中找到樂趣與啟發。





  《放飛旅行團》透過姜河那、金英光、車銀優、姜泳錫與韓善化（網路又譯韓善伙）等年

  輕演員的加盟，為全片帶來前所未有的新鮮娛樂體驗。此外，崔貴華、尹敬淏、高圭弼和

  姜知英等喜劇演員的加盟，也為導演南大中標誌性的喜劇風格增添光彩。其中主演之一的

  姜河那，今年就以《牆外之音》、《黑白線人》、《魷魚遊戲第三季》等六部電影與戲劇

  作品跟大眾見面，他笑說：「作品什麼時候公開不是演員能決定的，只是今年剛好集中上

  映了很多部作品。大家問我都不休息嗎？但我其實拍得很悠閒。只是在這三、四年間拍的

  作品，全部都擠在今年上映，就覺得我好像一直在拍戲似的，但其實我現在手上沒有新作

  品了。」雖然他是近年來最忙碌的演員之一，但他也驚爆自己「沒有打算一輩子演戲」：

  「我沒有想過要演到什麼時候。當演員這份工作，是需要有人來找你才能做的。如果有一

  天沒人再找我，就表示我的價值結束了。那時候即使想演，也不能演。想到那時候會做什

  麼別的工作，但那不是悲觀的想法，我覺得做別的事情也會覺得有趣。」他並補充：「我

  相信我自己。不管做什麼工作，我都有信心能做得開心。我不會理所當然地認為可以一輩

  子演戲。不過，只要有人願意找我，我就會一直當演員。」



  談到《放飛旅行團》，姜河那也表示：「我很喜歡自己演過的每一部作品，但本片真的像

  是一群朋友一起拍的作品。現場大家真的笑開懷，也打打鬧鬧得很開心。尤其海外拍攝就

  佔了全片超過70%，感覺就像大家一起出國拍綜藝節目一樣。」他並補充：「（金）英光

  哥、（姜）泳錫、（韓）善化都可以很快熟絡起來，因為大家都了解導演的喜劇節奏。即

  使有不同意見，最後也能收斂到導演喜歡的方向，所以我們很容易變親。因為我之前也和

  導演合作過《30日》，所以這次能更自在地提出想法。以前拍別的作品，我得有120%的確

  信才敢說出來，但這次只要有80%的確信就能開口。」至於在片中飾演描繪友情與青春的

  角色時，他也表示：「我到現在還不知道什麼是青春，因此我反而覺得現在仍然是青春。

  每天都活得很開心。當然說完全沒煩惱是騙人的，但我不會被煩惱束縛，不會抱著『一定

  要小心、不能犯錯』的壓力生活，而是努力讓每一天都過得很開心。」



  這部勇奪南韓票房冠軍，超越《特務搞飛機》、《樂透大作戰》的年度最瘋狂爆笑喜劇《

  放飛旅行團》，即將在11月14日於台灣歡樂獻映。台灣片商目前也正舉辦「Threads揪好

  友北中南免費搶先看」活動，只要分享與朋友出遊的照片與小故事，就有機會獲得免費觀

  影資格，活動詳情請見：


  。



  本片劇情描述堅持到底的瘋狂執著者、活力爆棚的樂天派、顏值爆表的潮流DJ志願生、

  腦洞大開的怪咖，還有直率爆笑的傻大姐——這五位從小一起長大的死黨，雖然個性南轅

  北轍，但卻默契滿點。在友情屆滿24週年之際，他們終於迎來夢寐以求的「人生首次海外

  旅行」！只是沒想到，這場說走就走的旅程，卻秒變災難現場：丟包、誤會、鬧劇不斷升

  級，他們能否克服重重危機，重新找回彼此？而這場瘋狂之旅的終點，會是一生中的難忘

  回憶，還是友情的點呢？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁

  及Threads專頁查詢。


  --'
