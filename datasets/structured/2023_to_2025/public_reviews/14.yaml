url: https://www.ptt.cc/bbs/movie/M.1762867360.A.50E.html
title: '[新聞] <放飛旅行團>韓善化爆車銀優暖舉讓她感動'
content: '新聞網址：



  超越《特務搞飛機》、《樂透大作戰》的年度最瘋狂爆笑喜劇《放飛旅行團》，即將在本

  週五（11/14）於台灣歡樂獻映。以《酒鬼都市女人們》系列成功圈粉無數、晉身「新一

  代喜劇女王」的韓善化（網路又譯韓善伙），這次在片中化身從小暗戀姜河那角色的「玉

  心」，一手包辦全片最強笑點與暖心瞬間。尤其這是她跟姜河那繼《變身機長》後再度合

  作，當被問到「拍戲時有沒有對他心動過？」韓善化也大方招認：「一開始真的有點心動

  和期待喔！」她透露姜河那在拍攝過程中對她照顧有加，不僅細心給予建議，還會隨時關

  心她的狀況，讓她感動直言：「現在想起來都還會想哭。」不僅如此，她也透露「臉蛋天

  才」車銀優的加盟演出，讓拍攝現場電力滿滿。雖然兩人首度合作，但韓善化仍對他的超

  高人氣印象深刻，笑稱：「啊～這就是車銀優的力量啊！」首度見面時，車銀優更貼心針

  對他的造型給予建議：「姐姐，這種風格更適合妳喔。」一句體貼關心，更是讓她感動不

  已。





  「新一代喜劇女王」韓善化在《放飛旅行團》當中飾演「玉心」，是一位從小暗戀著姜河

  那角色，並在一群性格衝動、毫無計劃就出國旅行的朋友中，扮演著「穩定核心」的角色

  ，並在關鍵時刻展現出機智與判斷力，配合著無厘頭的傻大姐性格，讓她的角色充滿存在

  感。韓善化表示：「劇本真的太有趣了，我邊笑邊坐著從頭到尾連續讀了三遍。」她還補

  充：「雖然參與過很多不同類型的作品，但因為這次的演員組合太新鮮，才得以成就這麼

  有趣的喜劇。」因此，她和共同演出的姜河那、金英光、車銀優、姜泳錫等人，在拍攝現

  場真的建立如朋友般的關係，並將那份愉快的氣氛也自然融入到電影當中，成功透過大銀

  幕將情緒傳遞給所有觀眾。



  值得一提的是，這是她跟姜河那繼《變身機長》後再度合作，片中她必須長期暗戀對方，

  當被問到「拍戲時有沒有對他心動過？」她大方招認：「一開始真的有點心動和期待喔！

  」她也進一步解釋：「在海外拍攝時，受到很多氣候影響，必須在規定時間內完成拍攝，

  大家都拼盡全力、同心協力地完成每個場景，讓我在那時感受到和哥哥們之間，那份真摯

  的同事情誼。雖然河那哥哥是前輩，但讓我感覺遇到一個很好的同事，我在表演上也非常

  依賴著他。」當談到姜河那時，韓善化更忍不住眼眶泛紅說道：「我其實是一個問題很多

  的人，只要有不懂的地方就會問。那不是為了讓我個人表現更好，而是希望能更好地詮釋

  角色、讓整部電影更完善。前輩不論在片場的態度，還是對角色的理解方式，都讓我感到

  尊敬。明明他自己要顧的事情很多，卻還是非常細心、耐心地為我講解，對我這個後輩來

  說，真的是一次很寶貴的學習經歷。」





  此外，「臉蛋天才」車銀優加盟《放飛旅行團》演出，也成為演員們之間的話題中心。而

  車銀優的高人氣也讓韓善化大感佩服，並回憶劇組最初拍攝海報時的趣事：「我有個高中

  好友看到海報後，全程只問車銀優的事，讓我心想『啊～這就是車銀優的力量啊！』」尤

  其這是韓善化與車銀優的首度合作，她回憶：「和銀優在初次見面會、劇本閱讀，以及正

  式進組拍攝後見過一次，因為拍攝場次不多，沒能經常碰面，也沒機會變熟。當時就覺得

  他比想像中更有男人味，態度也很成熟。能和他一起演出就已經很感謝了，如果在現場能

  多交流、多對戲就更好了。」她甚至也透露一個溫暖的小插曲：「第一次見面時，我和導

  演還有銀優一起討論我角色的髮型，結果銀優對我說：『姐姐，這種風格更適合妳喔。』

  那句話讓我很感動，結果我們三人都一致通過了那款髮型。他當時坐在我旁邊，不僅會烤

  肉，聲音也很好聽；雖然是弟弟，但讓人感覺很可靠，希望以後能更常見到他。」韓善化

  也再度為本片背書：「因為電影裡有很多搞笑場面，所以拍攝的時候經常笑出來。那段時

  光，每個拍戲的瞬間都讓我都很感激，也告訴自己一定不能忘記那些美好的時刻。」



  這部勇奪南韓票房冠軍，超越《特務搞飛機》、《樂透大作戰》的年度最瘋狂爆笑喜劇《

  放飛旅行團》，即將在本週五（11/14）於台灣歡樂獻映。台灣片商也推出「第一週戲院

  特典」，只要購買本片第一週（11/14-11/20）期間場次電影票乙張，即可憑電影票於14

  日起，至原購票影城兌換領取「A3電影海報」乙張，兩款隨機發送，數量有限，送完為止

  。本片劇情描述堅持到底的瘋狂執著者、活力爆棚的樂天派、顏值爆表的潮流DJ志願生、

  腦洞大開的怪咖，還有直率爆笑的傻大姐——這五位從小一起長大的死黨，雖然個性南轅

  北轍，但卻默契滿點。在友情屆滿24週年之際，他們終於迎來夢寐以求的「人生首次海外

  旅行」！只是沒想到，這場說走就走的旅程，卻秒變災難現場：丟包、誤會、鬧劇不斷升

  級，他們能否克服重重危機，重新找回彼此？而這場瘋狂之旅的終點，會是一生中的難忘

  回憶，還是友情的點呢？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁

  及Threads專頁查詢。



  --'
