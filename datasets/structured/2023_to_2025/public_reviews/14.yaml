title: '[新聞] 最強喜劇【放飛旅行團】連霸南韓預售冠軍'
content: '新聞網址：



  超越《特務搞飛機》、《樂透大作戰》的年度最瘋狂爆笑喜劇《放飛旅行團》，即將在11

  月14日於台灣歡樂獻映。適逢本片即將搶先在韓上映，劇組昨日（10/27）在首爾舉辦VIP

  首映會，現場星光熠熠，笑聲與尖叫聲交織不斷。導演南大中率領主演群姜河那、金英光

  、姜泳錫、韓善化（網路又譯韓善伙）、崔貴華、尹敬淏、姜知英等人盛裝出席，氣氛嗨

  到最高點！雖然主演之一的車銀優因為入伍服役未能親臨現場，但他的存在依舊成為全場

  焦點，不僅有同團的ASTRO成員MJ現身力挺，就連已故成員文彬的妹妹文秀雅，以及BTS的

  Jung Kook都特地趕來為車銀優應援。更讓粉絲驚喜的是，Jung Kook還當場抱起車銀優的

  「等身抱枕」合影留念，萌趣畫面瞬間在網路瘋傳。尤其本片未演先轟動，雖然南韓的正

  式上映日要等到本週三（10/29），但早就連續多天蟬聯南韓電影預售率冠軍，媒體與觀

  眾的好評更是全面炸裂，笑聲與口碑雙雙豐收！憑藉無敵卡司與滿滿笑料，本片也廣被看

  好將接棒《我和我的殭屍女兒》，晉身年度票房冠軍寶座！





  已經連續多天穩坐南韓電影預售率冠軍的話題喜劇《放飛旅行團》，不僅超越同樣在韓熱

  賣的《劇場版『鏈鋸人蕾潔篇』》，榮登電影預售率冠軍，甚至超越姜河那前作《黑白線

  人》，以及導演南大中前作《30日》的同期預售成績！透過演員們的絕佳默契引爆全場歡

  笑，同時也將帶來笑中泛淚的感動，這也讓劇組信心十足，光是在上映前就舉辦多場大型

  口碑試映會與媒體試映會，不論觀眾或媒體都是一致好評，紛紛盛讚：「瘋狂滿點的喜劇

  ！」「高完成度的優質喜劇！」「全家人都能一起享受的電影！」「姜河那超有趣，車銀

  優超帥氣！」「五位演員展現出真摯友情的完美化學反應！」「高完成度喜劇劇作的誕生

  ！」特別是導演南大中與演員姜河那繼《30日》後再度攜手，兩人展現絕妙喜劇節奏，完

  美戳中觀眾笑點，再配合姜河那、金英光、車銀優、姜泳錫、韓善化等充滿朝氣與新鮮感

  的演員，同時還有崔貴化、高圭弼、尹敬淏、姜知英等在喜劇領域實力深厚的演員助陣，

  共同展現前所未見的喜劇化學反應，深深吸引觀眾目光，也讓本片成為「無可挑剔、笑料

  滿滿」的高完成度喜劇之作。



  值得一提的是，《放飛旅行團》昨晚（10/27）也在首爾舉辦VIP首映會，除了導演率領演

  員群盛裝出席之外，現場也集結音樂圈、影劇圈巨星共襄盛舉，包括BLACKPINK成員JISOO

  、歌手NS允智、饒舌歌手The Quiett、男團YOUNITE成員恩湖與施穩、女團OH MY GIRL成

  員YooA、女團Billlie成員文秀雅等人。演員部分也吸引崔丹尼爾、李茂生、徐現宇（網

  路又譯徐賢宇）、李聖經等人現身。尤其車銀優因為入伍服役無法出席活動，但同團

  ASTRO成員MJ，以及BTS的Jung Kook都特地現身首映會替他應援；Jung Kook更當場抱起車

  銀優的「等身抱枕」合影留念，畫面相當萌趣。



  這部超越《特務搞飛機》、《樂透大作戰》的年度最瘋狂爆笑喜劇《放飛旅行團》，即將

