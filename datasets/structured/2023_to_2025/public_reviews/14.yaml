title: '[新聞] 《放飛旅行團》在韓奪票房冠軍 打破日片壟'
content: "《放飛旅行團》在韓奪票房冠軍 打破日片壟斷\n\n\n《放飛旅行團》強勢登頂韓國首日票房冠軍，圖片左起為姜泳錫、金英光、姜河那、車銀\n優、韓善化。（采昌國際多媒體提供）\n\
  \n【大紀元2025年11月03日訊】（大紀元記者樂慧萱編譯報導）根據韓國電影振興委員會電\n影票房綜合電算網3日公布的數據，由南大中執導的喜劇電影《放飛旅行團》自10月31日\n\
  至11月2日三天內吸引約230,808名觀眾（票房占有率28.8%），穩居週末票房冠軍，成功\n打破日本電影長期佔據韓國票房榜首的局面。\n\n上週末排名冠軍的日本動畫電影《劇場版『鏈鋸人\
  \ 蕾潔篇』》位居第二名，三日內吸引\n約147,468名觀眾（市占率20.0%）。改編自同名遊戲的日本驚悚片《第八出口》以約\n84,716名觀眾（11.1%）位居第三名；Netflix特別上映的《Kpop\
  \ 獵魔女團》則吸引約\n39,377名觀眾（5.9%），位居第四名。\n\n《放飛旅行團》於10月29日上映首日即吸引逾8.2萬人入場觀影，連續5日蟬聯票房冠軍，\n\
  累計觀影人數突破368,848人。觀眾留言表示：「這是一場有趣又愉快的觀影體驗，讓我\n時而開懷大笑」、「比想像中更精彩！」、「我原本是為了看車銀優而來，結果被『金福\n\
  』（姜泳錫 飾）圈粉」、「結局雖有些悲傷，但出乎意料」。\n\n本片由姜河那、金英光、車銀優、姜英錫與韓善花（韓善伙）主演，電影講述五位從小一\n起長大、相識超過24年的死黨，在人生中首次出國旅行時狀況百出、脫序失控，笑料不斷\n\
  ，最終成為一場名副其實的「災難之旅」。\n\n責任編輯：蘇漾\n\n\n\n--\n\n                  \n\n\n\n--"
