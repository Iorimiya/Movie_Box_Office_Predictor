url: https://www.ptt.cc/bbs/movie/M.1760617626.A.5DC.html
title: '[新聞] 【放飛旅行團】五大夢幻卡司即興笑力全開'
content: '新聞網址：



  超越《特務搞飛機》、《樂透大作戰》的年度最瘋狂爆笑喜劇《放飛旅行團》，即將在11

  月14日於台灣歡樂獻映！本片由在南韓創下217萬觀影人次紀錄、口碑與票房雙贏的《30

  日》導演南大中操刀，再度攜手有「票房保證」之稱的百想藝術大賞視帝姜河那，並集結

  金英光、車銀優、姜泳錫、韓善化（網路又譯韓善伙）等人氣爆棚影星，共同打造這部年

  度最無厘頭、最不按牌理出牌的喜劇新作！故事聚焦五位從小一起長大、認識超過24年的

  死黨，他們人生的第一次出國旅行，卻從一開始就各種脫序失控，笑料百出，變成一場名

  副其實的「災難之旅」。全片顏值、演技、話題全面到位，荒謬橋段接連不斷，超展開劇

  情保證讓影廳笑聲連連、毫無冷場！不只是爆笑，本片也將觸動友情、夢想與成長心弦，

  讓觀眾在笑聲中，也同時感受到滿滿的溫情與感動。此外，這也是車銀優首度挑戰大銀幕

  主演，更是他入伍前獻給粉絲的珍貴大銀幕告別作，絕對不容錯過！





  打從出道以來，就一直專注在喜劇領域的《放飛旅行團》導演南大中表示：「我喜歡明亮

  、有趣、搞笑的電影。從懷抱成為電影導演夢想的那一刻起，我就想為更多人帶來歡笑。

  」他也將自身經驗與情感融入本片當中：「我想描繪的是，那些曾經如同整個世界般重要

  的朋友之間的友情，也喚起了一種在某種意義上類似戀愛的情感。」他也期盼觀眾透過本

  片，可以回想起跟朋友們在一起的那種悸動與美好，打造一部人人都有共鳴、開心大笑的

  作品。



  對於再度跟姜河那合作，導演也直言：「與他一起工作的現場，讓人感覺不像是導演單打

  獨鬥在苦思，而是一起創作的感覺，而這部電影也融合了演員們的許多想法。」姜河那則

  表示：「從《30日》就有這種感覺，我們雙方在喜劇上的默契特別好。這次從第一場戲到

  最後一場戲，我都特別開心地與導演一起討論並完成。雖然劇本已經很棒，但實際拍攝出

  來的成果，絕對比劇本更有趣。」





  《放飛旅行團》當中，五位死黨獨特又鮮明的友誼，也成為全片最大的觀賞亮點。姜河那

  飾演的「泰正」，是一旦迷上某件事就會展現瘋狂執著、甚至因此拿下高考全國榜首的天

  才型角色，他也完美演繹出如同角色那般，兼具智慧與純真的反差魅力。金英光飾演的「

  道振」，個性橫衝直撞、完全沒有剎車概念，憑藉他穩重中帶有少男天真的獨特氣質，完

  美融入角色。車銀優則飾演無法客觀看待自己帥氣外表、夢想成為世界級DJ的宅男「延民

  」，配合他讓男女老少都迷戀的外貌，不僅詮釋角色到位，更成功擄獲導演的心。至於從

  800人試鏡中脫穎而出的姜泳錫，則詮釋因為討厭讀書而練就「睜眼睡覺」技能、腦迴路

  異於常人的怪咖「金福」。這四位如同「四劍客」般的好友，因單純、無知與勇氣，在不

  斷相遇中加深情誼。而四人身邊那位永遠離不開的「鈺心」，則由憑藉《酒鬼都市女人們

  》系列展現非凡喜劇張力的韓善化演出，展現出無論與誰搭檔都笑果十足的超強默契。光

  是看角色介紹就讓人忍不住想笑，這五位「天生自帶笑點」的演員組成了夢幻卡司。據悉

  ，演員們在拍攝現場不僅發揮各自獨特的喜劇本能，更主動貢獻即興台詞等創意點子，全

  力為每場戲注入更多笑聲與驚喜。



  從青春的回憶到瘋狂的現實，本片不只是一場好友們出國旅遊的爆笑冒險，更是一段關於

  友情、夢想與成長的喜劇旅程。看這五位死黨笑中帶淚的互動，加上實力與魅力兼具的演

  員組合，再搭配導演一貫幽默又溫暖的敘事風格，勢必將讓本片成為觀眾心中最不容錯過

  的喜劇首選。



  這部超越《特務搞飛機》、《樂透大作戰》的年度最瘋狂爆笑喜劇《放飛旅行團》，即將

  在11月14日於台灣歡樂獻映。本片劇情描述堅持到底的瘋狂執著者、活力爆棚的樂天派、

  顏值爆表的潮流DJ志願生、腦洞大開的怪咖，還有直率爆笑的傻大姐——這五位從小一起

  長大的死黨，雖然個性南轅北轍，但卻默契滿點。在友情屆滿24週年的同時，他們終於迎

  來夢寐以求的「人生首次海外旅行」！只是沒想到，這場說走就走的旅程，卻秒變災難現

  場：走失、誤會、鬧劇不斷升級，他們能否克服重重危機，重新找回彼此？而這場瘋狂之

  旅的終點，會是一生中的難忘回憶，還是友情的轉捩點呢？



