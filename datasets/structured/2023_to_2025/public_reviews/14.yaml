title: '[新聞] 入伍車銀優另類出席【放飛旅行團】記者會'
content: '新聞網址：



  南韓「臉蛋天才」車銀優不閃兵，在人氣正夯時毅然入伍，於今年7月低調報到，讓全球

  粉絲相當不捨，卻也獲得多數正面支持。不過，就算身披軍裝，他仍貼心為粉絲留下溫暖

  驚喜，讓主演新片《放飛旅行團》成為他入伍前獻給粉絲的「最後禮物」。適逢電影即將

  上映，劇組昨日（10/22）於首爾舉辦媒體試映記者會，雖然車銀優本人無法出席，但劇

  組驚喜搬出他的等身人型抱枕，與導演南大中及四位主演姜河那、金英光、姜泳錫與韓善

  化（又譯韓善伙）同框站台，畫面又萌又搞笑；眾人並隔空喊話，傳遞對他的思念之情。

  讓人會心一笑的是，片中幾位主演集體「降齡」演高中生，儘管除了車銀優外，其他人的

  年紀都早已超過三十歲，卻仍在片中換上制服青春登場。面對媒體提問，他們也不好意思

  地笑稱：「真的很抱歉！」瞬間讓現場變成另類「道歉發表會」，氣氛輕鬆又有愛。《放

  飛旅行團》即將在11月14日於台灣歡樂獻映。





  超越《特務搞飛機》、《樂透大作戰》的年度最瘋狂爆笑喜劇《放飛旅行團》，講述五位

  擁有24年深厚情誼的摯友，首度結伴出國，沒想到這場期待已久的旅行卻一路失控、荒腔

  走板，各種爆笑突發狀況接連上演，荒誕又感人的情節，勢必引爆全場笑聲與共鳴！導演

  南大中率領主要演員姜河那、金英光、姜泳錫與韓善化，於昨日（10/22）一同出席位在

  首爾的媒體試映記者會。導演感觸良多地表示：「本片劇本比我2023年的前作《30日》還

  要早完成，當時卻因為疫情無法出國拍攝而暫時擱置，如今終於能和大家見面，我對此感

  到非常興奮。」他並補充：「故事改編自我的真實經歷，我一直想創作一部充滿和朋友們

  回憶的作品，這也會是一部讓人感受到慰藉、能夠一起開懷大笑的作品。」尤其演員們的

  精彩演出，更是本片成功要素之一，導演回憶：「電影有一半以上的魅力，來自演員們的

  默契與互動，他們在拍攝現場也真如多年摯友般地自然相處。」



  姜河那繼《30日》後再度與導演合作，感受特別深刻：「與導演合作的現場，真的非常有

  趣，從溝通開始就是一種樂趣。我可以準確地表達我的想法，他也能精確地接收，連調整

  意見的過程都很有趣。雖然劇本本身就很夠力，但我覺得良好的溝通才是更大的助力。」

  導演則回應：「姜河那總能把我寫的角色發揮得比我想像中更加精彩，我也再度邀他演出

  ，他也念在舊情而答應接演，真的很感謝他。」金英光則分享自己在片中的角色帶點瘋癲

  ：「我努力讓自己融入這種狀態，才能更貼近角色。我們在片場很快就打成一片，氣氛非

  常開心，這種默契也將呈現在大銀幕上。」而從《酒鬼都市女人們》一舉晉升喜劇新星的

  韓善化，這回在片中飾演對姜河那角色癡心絕對的「直進女」，她也開心分享：「繼《變

  身機長》之後，能再度接到這麼好的劇本，我真的非常感謝。雖然我是中途加入拍攝，心

  想要趕快和哥哥們打成一片，所以主動親近他們，而他們也都對我很親切，讓我投入了很

  多感情。」談到角色的戀愛腦特質，她也笑說：「我本來就屬於那種純情派性格，所以很

  快就理解角色並產生共鳴。」她在片中的火力全開式示愛，也將為全片增添許多溫馨又爆

  笑的場面。





  值得一提的是，除了正在服役無法出席的車銀優外，出席記者會的四位主演姜河那、金英

  光、姜泳錫與韓善化，全都已經超過三十歲，卻仍為角色在片中穿上高中制服。當被問及

  此事，記者會秒變大型「道歉發表會」，笑果十足！姜河那率先自嘲：「如果畫面裡同時

  出現真正的高中生，應該會讓人瞬間出戲吧？但因為只有我們，應該還算勉強過關。」他

  更幽默補充：「真的很抱歉，我知道自己已經過了穿制服的年紀，片中十多歲的部分，會

  靠妝容營造氛圍，三十多歲就用素顏展現滄桑感，希望大家能看出角色在時間的流逝。」

  金英光也認真「懺悔」：「穿制服真的感到很抱歉，以後應該不會再挑戰了。」姜泳錫則

  笑說：「原以為跟哥哥們一起出現的話，我穿制服應該還能像高中生，結果不是這麼回事

  …我也是來道歉的。」唯一的女主角韓善化則笑稱：「導演跟我說有瀏海會更像高中生，

  所以我就貼了瀏海、穿上制服。」



  此外，因為正在服役，男神車銀優無法親臨記者會，但劇組特別準備一個穿著西裝的等身

  人型抱枕「代打上陣」，與眾演員一同站台，成為全場最萌焦點。即使缺席活動，車銀優

  在劇組心中依然「全勤」，眾人也透過記者會隔空喊話，向他傳遞思念與鼓勵。姜河那表

  示：「銀優啊，我知道你現在很辛苦，我們會努力宣傳這部電影。你可能要等放假時才能

  看吧？電影真的拍得很有趣，很值得期待，以後見囉，加油！」金英光也說：「不能一起

  宣傳真的很可惜，我很想你，希望能快點見到你。」姜泳錫則笑說：「等你放百日假時，

  一定要買票進電影院看這部電影，看完記得要聯絡我們，拜託了！」韓善化則溫柔喊話：

  「銀優啊，我剛剛看了電影，真的很好看，你也演得很好，大家一定會很想你。」導演南

  大中也特別提到：「如果能跟銀優一起看電影就太好了，可惜他現在要履行國防義務，希

  望你在放假時，哪怕是自己掏錢，也一定要去看，之後我們再一起聊聊電影吧。」



  這部超越《特務搞飛機》、《樂透大作戰》的年度最瘋狂爆笑喜劇《放飛旅行團》，即將

  在11月14日於台灣歡樂獻映。本片劇情描述堅持到底的瘋狂執著者、活力爆棚的樂天派、

  顏值爆表的潮流DJ志願生、腦洞大開的怪咖，還有直率爆笑的傻大姐——這五位從小一起

  長大的死黨，雖然個性南轅北轍，但卻默契滿點。在友情屆滿24週年之際，他們終於迎來

  夢寐以求的「人生首次海外旅行」！只是沒想到，這場說走就走的旅程，卻秒變災難現場

  ：丟包、誤會、鬧劇不斷升級，他們能否克服重重危機，重新找回彼此？而這場瘋狂之旅

  的終點，會是一生中的難忘回憶，還是友情的轉捩點呢？



