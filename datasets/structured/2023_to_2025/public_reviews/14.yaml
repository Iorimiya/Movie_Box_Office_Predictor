url: https://www.ptt.cc/bbs/movie/M.1763365076.A.EE9.html
title: '[好雷] 放飛旅行團'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  近年來，韓國除了拍出特效媲美好萊塢的動作片之外，也推出不少令人捧腹大笑的優質喜

  劇。舉凡《特務搞飛機》與《樂透大作戰》等日常生活都能入題，這次也不例外，從輕鬆

  的好友出遊開始，帶觀眾一步步看見逐漸失控的旅行背後，還藏著什麼樣的溫馨友情。



  堅持到底的瘋狂執著者、活力爆棚的樂天派、顏值爆表的潮流DJ志願生、腦洞大開的怪咖

  ，還有直率爆笑的傻大姐，這五位從小一起長大的死黨，雖然個性南轅北轍，但卻默契滿

  點。



  看到海報與宣傳都大力推崇「首次大銀幕主演」的「臉蛋天才」車銀優，相信很多人必定

  都會慕名而來。以《犬系戀人》、《Island》與《我的ID是江南美人》等片聞名的他，目

  前仍在服役中，但手上也還有一部Netflix的電視劇《The Wonderfools》尚未播出，讓喜

  歡車銀優的影迷，即便在他當兵期間，也能看到車銀優的英姿。這次他在《放飛旅行團》

  裡，雖說戲份不算太多，但還算是重要且穿針引線的角色。從一開始的旁白，到關鍵的劇

  情反轉，甚至是缺席中間的瘋狂旅行都還以娃娃的身分出現，存在感非常強。說車銀優「

  首次主演」絕對沒問題，也是他入伍前獻給影迷的暫別作。



  作為一部喜劇，《放飛旅行團》可能不是從頭到尾都笑點連發的類型，但卻很接近古典喜

  劇的結構。莎士比亞的許多喜劇都是以死亡或喪禮開場，最後再以婚禮的歡快收尾，而悲

  劇則相反。雖然本片開場並非充滿哀傷的氛圍，但車銀優飾演的廷民開門見山告訴觀眾「

  這是一個悲傷的故事」，還講不少次，也直接告訴觀眾這群好友即將面臨一場生離，而電

  影後段的反轉則揭露實則是一場死別。從喪禮開場，最後以「不給看」的泰正與鈺心修成

  正果的守候作結，絕對能夠說是一部成功的喜劇。



  《放飛旅行團》以友情包裝，也點出求學生涯的朋友最單純且真摯，但「長大」後每個人

  都有各種忙碌、藉口與無奈而無法相聚。「韓國人所說最不真誠的話是什麼？『下次！』

  」聽起來是否似曾相識呢？多少人跟許久未見、偶然聯絡上的朋友說出「下次」時，會馬

  上訂下時間地點，讓這件事情成為「將至」而非「該到卻永遠未至」呢？



  對男主角泰正來說，他大可擺脫這群成績遠不如自己的「魯蛇」，但從小到大，只要四個

  人（或五個人，含鈺心）在一起，就有無比的快樂。所以，大家長大後的成就與身心狀態

  都不會影響到他們之間的關係。不過，倘若每次互相邀約都一味丟給繁忙的工作，隨口

  說出「下次」就想打發過去，總會有等不到下次的那一天。以劇中主角群遭遇的事件來看

  ，有些人或許會怕觸動敏感神經，反而就此老死不相往來，但他們選擇相互扶持、持續守

  護對方，這也是《放飛旅行團》最珍貴的友情。



  其實，《放飛旅行團》只需要講四個大男生的經歷即可，鈺心的加入卻讓故事畫龍點睛。

  除了補上廷民消失後的「達太安與三劍客組合」之設定，也平衡電影中陽勝陰衰的氣氛，

  甚至讓劇本可以加入一點浪漫愛情的元素，她更扮演全片「救世主」的角色。雖說礙於本

  片的「喜劇」特性，鈺心無法成為「帥氣」的英雄，只能邊搞笑邊施展魔法，但還是在以

  綠葉為主角的電影裡，扮演最亮眼的紅花。



  雖然鈺心不像泰正成績好，英文講得呱呱叫，但關鍵時刻還得靠她的破英文拯救大家。明

  明被臭男生們丟包，讓鈺心心灰意冷之下決定直接回韓國，卻由於沒錢支付飯店費用，意

  外幫助泰國警方破獲器官黑市，並救出她最心愛的「泰正歐爸」。最後，因為誤入人蛇集

  團的圈套，導致四人即將錯過班機，甚至斷送泰正整個政治生涯，也是鈺心以最荒誕的方

  式逼迫飛機停飛，挽救對方的事業。只能說，沒有她的話，泰正該如何是好呢？



  《放飛旅行團》最讓人驚喜的莫過於接近尾聲的轉折，雖說除了精神病患道振之外，從來

  沒人想與廷民聯絡，甚至要實踐當年沒能成行的旅遊也不通知他，是有那麼一點奇怪，但

  畢竟那麼多年過去，感情再怎麼好，分隔兩地後避不聯繫也不是不可能。原來，廷民並不

  是去紐西蘭後發生什麼變故，而是根本沒去成。以幾乎沒出現卻又無所不在的車銀優，帶

  觀眾重新走一次這群好友的高中歲月，才發現，他們當年並不是由於沒趕上接駁車才沒去

  成泰國，而是發生車禍，甚至廷民還在此次事故中送命。



  這也解釋為何道振會罹患精神病，其他好友從不提起廷民，並對道振的「瘋」與帶廷民的

  「替身」一同出國如此包容。電影最後以器官黑市工廠起火呼應到當年的車禍，除了給予

  倖存的三人「再一次」與自己和解的機會，也讓他們理解「放下」能夠有很多方式，而這

  場當年無法實行的旅程在各種意義上都成功連結了「四人」，也應證廷民一開始的旁白說

  「這是一個悲傷的故事」。



  雖然悲傷，但時不時出現的無厘頭笑點，也適時平復觀眾被感動爆擊的心，《放飛旅行團

  》畢竟不是一部故意想要惹哭大家的喜劇。大笑兩小時後，也別忘記把與身邊重要之人的

  每次聚會都當成最後一次來看待。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
