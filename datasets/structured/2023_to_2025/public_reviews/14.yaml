title: '[好雷] 放飛旅行團'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  今天去看了放飛旅行團，真的又哭又笑很好看。

  每個角色都很鮮明有自己的個性跟趣味，也都演得很好。


  因為先知道了結局，所以在看他們一些荒謬的行徑的時候，

  一邊笑一邊也夾雜著淡淡的悲傷。


  覺得稍微有點不合理的地方是人蛇集團的部分，

  因為他們在泰國的瘋狂行徑在網路上已經流傳開來了，

  泰正還算是政治人物，這樣還抓他們不是太容易引起關切了嗎？


  因為感覺場次所剩不多，最近又有魔法壞女巫及動物方城市，

  所以有興趣想看的記得把握時間。



  然後，因為銀優上一部電影音爆浩劫也是先離開的角色，

  所以希望下一部電影他的角色可以好好活下來啊...XDDD



  --'
