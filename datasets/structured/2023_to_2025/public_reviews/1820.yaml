url: https://www.ptt.cc/bbs/movie/M.1676813081.A.A39.html
title: '[普好雷]《追海豚的長崎夏日》，鯖魚罐頭壽司的'
content: '部落格版：


  「每當我看見鯖魚罐頭，就會想起某個少年。」


  就如同電影剛開始不久主角久田說的，正在為生活努力的我們，總會在某些時候，在看到

  了某個東西，或是經過某條街、聽到某首歌時，會很突然的想起某個人，那個曾經形影不

  離可如今卻鮮少見面、甚至再也不見的、好過的朋友。專欄作者洪雪珍寫過一篇文章，她

  說「朋友不必交一輩子，曾經好過就值得了。」，她將所有的相遇形容為一條緩緩的小河

  ，而在時間的流動裡，「我是漂流的水草，你是河中的石頭，我遇見你，停留一下，向左

  向右轉了幾個半圈，然後一個水勢，我就漂走，也遠了。」，人與人之間從來都是這樣，

  不需要合則來、不合則去，關係從來就沒有可能一輩子的天長地久，更多的是不到半輩子

  就結束，但重要的是「曾經擁有過，這就很好。」，《追海豚的長崎夏日》給我的感受就

  是這樣，友情關係上的深淺與長短都是緣分，在他或她陪著自己走過一段路後，便會成為

  住在心底的過客，在偶爾想起來的時候，能讓自己有了繼續向前的動力與勇氣，那便足矣

  。


  遭遇到寫作生涯低潮的作家久田，看著桌上打開的筆電裡半字未打的空白草稿，然後抬頭

  瞥見放在櫃子上頭的鯖魚罐頭，想起了兒時的某個暑假，和另位少年竹本充滿回憶的夏天

  ，突然憶起的往事讓人跟著思緒被帶回到過去，緩緩說起那些平淡卻珍貴的點滴…。《追

  海豚的長崎夏日》劇情可以其實相當普通，甚至還可以用平淡無奇來形容，坦白來講在前

  半段幾度讓我哈欠連連，但奇妙的是，到後來竟然有些莫名的被感動到，聽著久田說著那

  個暑假發生的事，那對當時還小的他們而言是刻骨銘心的刺激冒險，其實對早已長大的大

  人們來說，根本是趟隨時可以說走就走的輕旅行，不需用力的去記下。可是我想有趣的地

  方在於，《追海豚的長崎夏日》確實讓觀眾有了逐漸去記起的神奇魔力，看著久田和竹本

  與那台摔到破爛的腳踏車坐在貨車後座，會想著自己是否曾經也有過這麼容易滿足的時候

  ？然後對於早已習慣道別的我們來說，是否也有過為了即將搬家或再也不會見到的朋友的

  離開而偷偷抱著母親哭？



  《追海豚的長崎夏日》裡那些本該早已遺忘、難以理解的感動，卻在跟著同樣面對生活與

  工作倦了的久田一起回到當年那個夏天之後悄然甦醒，更經多年時間成了某種難以言喻的

  悸動。電影中所出現的許許多多、事物也好、行為也好，說過的話與許下的誓言都好，都

  是能夠被你我找到與之相似的來替換代入，永遠轉到同款角色的扭蛋、畫在桌上的魚、地

  上撿到的一百塊銅板、人手一瓶的彈珠汽水，幫父親按摩三十分鐘就能賺十塊、去果園偷

  摘橘子、親吻著貼在牆上的偶像海報，或者是騎腳踏車去追海豚、花光積蓄就為了買整袋

  鯖魚罐頭道別朋友…，連那一句又一句的「下次見」，都熟悉又陌生的一一浮現眼前。「

  追海豚的長崎夏日」的那追海豚，到底久田和竹本最後有沒有找到海豚根本不重要，追海

  豚這件事從來就是個象徵，一個你我皆不同卻同樣美好的時光之象徵，而那被刻畫在牆壁

  上的騎海豚圖像，好似烙印在心底一般，會在需要的時候默默提供你前進的動能，永遠有

  效。


  《追海豚的長崎夏日》真摯誠懇，質樸動人，整體調性就像片名那樣很有童趣感，是部會

  隨著劇情、隨著被逐漸喚醒的美好回憶，而開始感到越來越有意思的作品。不過就像我前

  面提到的，老實說前面是真的讓人昏昏欲睡，太多過分刻意用力的搞笑有點尷尬，尤其是

  久田父母的鬥嘴部分更是，但後面就習慣之後就逐漸變得自然許多。至於對於電影，我個

  人覺得比較可惜的是，電影的最後讓久田再次回到了長崎見到了數十年未見的竹本，其實

  如果最後兩人就這樣真的在當年道別之後就再也不見，多年以後的回想起所帶來的感動與

  感傷會更多、更強烈，因為就我自己看來，《追海豚的長崎夏日》是在追憶往昔美好的，

  那些自然而然跟著時間淡去、而在多年後偶然想起會會心一笑的關係，懷念著當年單純天

  真的自己，如果兩人就這樣活在回憶裡，其實是更加浪漫的。


  然後最後一個問題，小時候的久田和竹本怎麼有辦法從岸邊游到迴力鏢島上？從鏡頭上看

  起來距離很遠，小孩子的體力可以撐到島上，我個人是半信半疑啦...


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
