title: '[普雷] 《追海豚的長崎夏日》朋友，一瞬永遠'
content: '童年的冒險物語，追逐海豚的原因是？


  小時候的成長過程，有時候可能影響我們長大看待事物的方式，甚至有一些記憶即便以過

  去數十年之久，那回憶依舊在心裡面，當時的自己和過去看見事物與他人的臉，可能是一

  個長大成人後覺得無所謂的小事，但卻難以抹滅。不管是好事壞事，小時候總有一些想起

  來不美好但依舊值得的事，而讓我們變成今天這個樣子。


  《追海豚的長崎夏日》是講述九州長崎鄉下兩位少年的友情故事。作家久田孝明面臨靈感

  與生活枯萎的局面，偶然在家看見超市的鯖魚罐頭，想起自己小時候的夏日回憶，那叫竹

  本的少年，在班上常同學排擠嘲笑。


  某次暑假，久田發現竹本來找他，問他想不想去海島上找海豚？在威逼利誘下久田決定偷

  偷跟竹本踏上這次的冒險之旅。







  《追海豚的長崎夏日》是什麼電影？


  現在的小孩的童年只剩下網路與手機，這是老一輩常常在說的事情。隨著時代的轉變，資

  訊發達的現代社會，虛擬社交平台已經儼然成為小孩與大人與他人交流的場所，多過於實

  際面對面。而身為一位看著網路平台發達茁壯成今天面貌的孩子，同時經歷過網路與戶外

  遊玩的魅力，可能在兩方都有點想法。


  對於如今時代趨勢如此，不能用概觀過去孩子的童年去來對比現在小孩童年，例如不能出

  去玩、只有手機很可憐這種話，有時候聽來像是一個世代人的酸葡萄心裡。


  在曾經在老家赤腳土窯烤番薯、灌蟋蟀的我覺得戶外很有趣，但同時當然也能在享受線上

  遊戲與觀看網路影片的樂趣。而每一刻都是回憶，要把青春回憶留在戶外或虛擬網路上，

  這都是一種選擇而已。










  電影《追海豚的長崎夏日》是一部以昭和時期的日本長崎鄉下為背景的故事，作家久田孝

  明因為一個超市的鯖魚罐頭，記起他小學時的竹本同學。


  小時候在老家長崎的日子，擅長寫作的久田在一個雖然不寬裕，但一家人感情和樂的家庭

  ，某天他注意起班上穿著破爛，常被人欺負排擠的竹本，但竹本卻擺出滿不在乎的態度。


  某年暑假，竹本突然出現在久田家門口，他問久田要不要跟他到海邊的島上看海豚。久田

  雖然覺得莫名其妙，又覺得竹本很怪，但他也真的想看看海豚，而且他暑假作業文章如果

  可以寫自己看海豚的回憶就太棒了。在利益誘惑下，久田與竹本打算一早偷偷出發去找海

  豚，也為兩人的友誼和童趣的冒險拉開序幕。













  《追海豚的長崎夏日》分析與延伸：


  這部電影是搞笑藝人、舞台劇演員的金沢知樹，第一次擔任導演拍攝的長篇電影作品，改

  編他童年在長崎生活的親身經歷。早在2014年，他編寫的劇本短片《我的世界只有一半》

  就入圍了美國艾美獎。


  在後也擔任過被大家所知日劇《半澤直樹》的副編劇一職，但目前最多的劇本還是以舞台

  劇編劇為主，劇本也曾在日本獲得多個獎項。


  電影《追海豚的長崎夏日》是金沢知樹首次挑戰擔任導演與編劇，藉由兩位少年的友情，

  他希望呈現出「80年代男孩們的青春期」，不管何時都要活在當下，那一代已經變成中年

  的少年友誼與故事。


  最初的原案其實並不是電影而是廣播劇，沒想到在寫完廣播劇稿試錄後就被擱置了，沒想

  到四年後，這個企劃受到投資便決定拍成一部小成本的長崎電影。








  這部電影的拍攝方式是想以一個少年的暑假日記來呈現，導演金沢知樹表示想將少年的家

  人、冒險、朋友的故事像日記一樣樸實的紀錄內容，小學生的夏日呈現在觀眾面前，並且

  展現自己家鄉長崎美妙的風景和美好的一面。


  過去金沢知樹曾經對朋友說過總有一天要回老家拍攝電影，除了宣傳老家值得的地方，同

  時也思考對於家與人之間，對自己而言代表什麼。


  以小孩的天真、少年的友誼、與老家長崎的海為主題的電影作品，也讓參與演出日本知名

  演員草薙剛表示：「這是一部將日記憶永存在心裡，讓人充滿希望的電影。」感覺會讓一

  代已經從少年變成大叔的觀眾，再次回憶起自己小時候的夏季，過去學校的朋友和有點不

  滿的家庭生活，彷彿時間定格在記憶的某處，是與現代孩子不同，自己心裡獨一無二的那

  個童年。











  《追海豚的長崎夏日》值得一看嗎？


  這是一部樸實且步調非常慢的電影，並且後面有點老套催淚的作品。


  但因為導演本身是長崎人又是改編自身的童年記憶，我覺得取景和細節都呈現的很有昭和

  風情，尤其是老建築與山壁海洋的搭配，有點像是台灣花東地區的公路景色，整個海與天

  拍攝的相當細緻，在掌握時代感也以孩子的童趣想像為主，但又帶了不可抗的現實面，算

  有意思。


  不過裡面少年之間的友誼描述其實要到冒險的後期比較多敘述，初期較多是少年久田孝明

  小學時代的生活，他喜歡什麼、迷戀什麼，家庭生活的樣貌與小孩脾氣。然後在另一名少

  年竹本也有許多琢磨，尤其在個性上可以看出兩個男孩的差異點，和年紀雖小到細膩的心

  思這點，都是電影呈現不錯之處。










  電影雖然只有一小時半，卻讓人覺得步調太過緩慢甚至在鏡頭運鏡安排上不是很好，有一

  些呈現的比較像是動畫風格，或網路素人自拍劇那種低成本的感覺，但有些情感運鏡也還

  不錯，導致觀影的落差感有點大，忽高忽低的很讓人出戲，但少年冒險部分還滿有趣，有

  把現實感拍出來，但又帶點童趣的無奈感，是整部片最有看點的部分。


  在日本網路上給予這部原創電影不錯的評價，雖然許多觀眾表示很感動，但有很多其實都

  是因為看見自己小時候的回憶，而有所共鳴。簡單來說《追海豚的長崎夏日》本質上是打

  懷舊牌，並用少年物語去包裝，而得到同樣一個時代人的共情。


  也有許多人認為這是一部太過鄉愁的電影，且拿掉情懷就什麼都沒有的作品，這點其實反

  映在台灣影廳上，並不是所有的人都會惆悵長崎的海，對我來講想到長崎可能「長崎蛋糕

  」俗氣的想像更多一些，無法共情。


  --

