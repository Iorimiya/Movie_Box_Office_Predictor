url: https://www.ptt.cc/bbs/movie/M.1749485154.A.C5E.html
title: '[負雷] 鯊人魔:幾乎沒有劇情'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  鯊人魔是好萊塢後台最硬的男人傑寇特尼主演，講述一個變態殺人魔騙人出海的

  恐怖經歷


  本片幾乎沒有任何轉折，就是女主被抓，反擊，沒了


  什麼?你說全片90分鐘，剩下的時間幾乎都沒有重要意義，不相干的男女配被抓

  被餵食鯊魚，男主毫無作用，真的是無作用的那種


  不敢想像為何評價會這麼高，除了傑寇特尼的演技真的沒有任何看點


  --'
