content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n《鯊人魔》無雷推薦：心臟鯊鯊給油！(不超過片介和預告)\n\
  \n通常我是不偏好爽片的，但這部真的好看！\n獵物與獵人的緊張追逃，讓人膽戰心驚；鯊魚片該有的血跟尖叫也都給好給滿。\n中間驚悚的點讓我跟同行有人都意想不到，在同類型電影中獨具創意。\n\
  中後段一度是邊掩面邊偷看的觀影型態(?\n/\n選角賞心悅目，女主角人物刻劃立體出色\n/\n怎麼在殺人魔跟鯊魚之間求生存？\n心臟鯊鯊給油！全力活下去吧。\n\
