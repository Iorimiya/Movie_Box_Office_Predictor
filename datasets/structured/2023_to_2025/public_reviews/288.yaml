url: https://www.ptt.cc/bbs/movie/M.1750682987.A.AA1.html
title: '[無雷]鯊人魔反派、男女主角身材也太好 '
content: '如題無雷


  這部電影劇情上算很單純不太複雜


  且每個畫面都有它的伏筆算是劇情緊湊的一部片


  應要挑缺點


  大概是男女主角愛上對方的點有點快


  另外這部不得不說反派、男女主角的身材真的很好


  反派雖然有點肥但很明顯是脂包肌的那種肌肉量很高


  男主角穿衣服很瘦但脫衣服核心肌群蠻強的


  女主角大奶細腰床戲那段好身材一覽無遺


  導演真的蠻會挑人的為這部片加了不少分


  推薦大家去看這部



  --'
