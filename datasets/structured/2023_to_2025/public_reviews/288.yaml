url: https://www.ptt.cc/bbs/movie/M.1749309966.A.A76.html
title: '[討論] 傑寇特尼「危險動物」 爛番茄85%'
content: '番茄王強勢回歸


  好萊塢後台最硬的男人Jai Courtney傑寇特尼的最新動物驚悚片「鯊人魔」在爛番茄

  上拿下85%的新鮮度


  據說傑寇特尼在這部片的演技相當驚人，想當年後台超硬的他，演了魔鬼終結者，自殺

  突擊隊，終極警探都紅不起來，現在可以靠小成本驚悚片東山再起嗎?


  據說裡面有色色的東西，但是會結合血腥畫面，所以不會適用於每個紳士


  --

  來得及三小?

  當初他演一堆大製作都沒紅起來，還可以繼續演大製作，根本超強'
