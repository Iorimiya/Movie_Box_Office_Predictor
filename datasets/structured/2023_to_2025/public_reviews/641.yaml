title: '[好雷]《黑箱日記》：說出難以直視的一切'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《黑箱日記》：說出難以直視的一切\n\
  \n■ 無雷推薦語\n\n多麼寶貴又沉痛的一部片。伊藤詩織選擇用記者專業、承受心理壓力、不斷堅持讓真相見\n光。老實說不\n是很敢再次點開《黑箱日記》。謝謝伊藤詩織讓人再次看見陽光。\n\
  \n■ 雜感隨手記錄\n\n1 當觀眾看到監視器畫面和後續的證詞，可能會覺得其他叫主角放棄的人很殘忍跟鄉愿。\n但是被社會貼上標籤、刑事層級難成案，這些都是真實面臨的處境，而不是恐嚇受害者停\n\
  止求助的唬人之詞。\n\n2 要聽清楚每一個錄音錄影裡，他們的話術跟幹話。就算無法定罪，每句話都得細細聽進\n去。這是決意上訴的受害者得面臨的次次挑戰，也隱含不斷被否定經驗感受的二度傷害。\n\
  \n\n3 很難想像日本的性犯罪法律還走在那麼後面，把「威脅脅迫受害者致不能反抗程度」放\n在要件裡，而不是判斷對方積極同意與否。\n\n4 想到有人在檢討受害者，或質疑是否仙人跳，就想到之前孫生的事件。先開口向對方確\n\
  認，會省掉很多的麻煩跟爭議。在面試名義的會面下發生性接觸，很容易往權勢性侵或酒\n後乘機下手的方向判斷。\n\n5 山口的處理其實非常精準。他利用關係向內部施壓，避開刑事責任，將輿論落點卡在道\n\
  德爭議。「如果我說我後悔，就會讓記者覺得我做了犯法的事。」他在思考的是怎麼減少\n後果，而不是自己做的事到底對不對。\n\n他逃過了刑事追責，在自我的審視與反省上也敷衍了事。\n\
  \n6 門房的那通電話真的讓人淚崩。他不只提供案件上的證據支撐，也正視並理解伊藤詩織\n遭受的所有創痛與掙扎。這是全片裡最直接的看見與擁抱。\n\n■ 結語\n\
  \n《黑箱日記》清晰的記錄了推動#metoo的兩難處境，不再只是文宣上的呼告與警語。它也\n清楚捕捉了，為什麼加害者的腰還能站那麼挺。更重要的是，\n\n\n\n\
  >>網頁好讀版：\n\n–\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n--\n可惜這部日本因故沒有上映"
