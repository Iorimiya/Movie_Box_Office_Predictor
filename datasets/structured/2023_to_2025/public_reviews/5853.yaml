url: https://www.ptt.cc/bbs/movie/M.1464616080.A.9F5.html
title: '[討論] Seven 火線追緝令與文學作品的設定（雷）'
content: '前一陣子，因為又看了一次火線追緝令


  對裡面的一些文學設定，感到好奇。


  因此也寫了篇文章想和大家分享一下，


  如有錯誤，還請大家不吝指教。



  關於莎士比亞的作品The Merchant of Venice 『威尼斯商人』，

  也有許多電影也曾探討過，其中導演大衛·芬奇（David Fincher）

  在1995年拍攝的犯罪電影，『Seven』火線追緝令，裡面也有提到。

  劇情敘述一位即將退休的警探 威廉·沙摩塞William Somerset（摩根·費里曼飾）

  和他的搭擋 大衛·密爾斯 David Mills（布萊德·彼特飾），

  一起調查由天主教儀式裡的「七罪」設局犯下七件連環謀殺案。

  而這七罪包含『傲慢、嫉妒、暴怒、懶惰、貪婪、貪食及色慾』


  而兩位主角在辦案的過程中，他們發現其中的一名的被害者，

  知名富有的辯護律師，地板上用血寫著Greed，旁邊放著天平放著一磅的人肉，


  "One pound of flesh,no more, no less.

  No cartilage,no bone,only flesh."


  割他一磅肉，不多也不少

  不可含軟骨，不可帶硬骨


  凶手給了被害者一把屠刀，要他把自己身上的肉割下來，以換取活命，

  因為貪婪者對他人的剝削，就像是割他人的肉一樣，使被剝削的人痛苦不堪。

  而剝削他人之人，必定會承受同樣的痛苦。


  片中凶手 約翰·杜 John Doe（凱文·史貝西飾），對社會人性的醜陋與不滿，

  卻同時也熟知教義裡七罪，還有相關的文學作品也有一定的了解，

  包括但丁神曲與失樂園等，不過這一文學作品的線索，

  也讓主角循線追查到他的身份，也算是一個片中特殊的設定。

  除了整部片的暗黑色調外，攝影和美術設計風格，

  也都利用寫實的方式呈現整個城市鬱悶的氣氛，

  像是大雨，吵雜聲等。因此在風格與視覺上，

  觀眾更可以感受到那種暴力與骯臟的壓迫感。


  當初被設定為喜劇的『威尼斯商人』被引用至此片，

  想必作者 莎士比亞也不曾想到過吧。


  （文章本貼於 自己與朋友 閑暇時開設的粉絲團，


  平常也會寫一些相關的類似文章，如果大家還喜歡，

  歡迎到粉絲團來逛逛～）



  --'
