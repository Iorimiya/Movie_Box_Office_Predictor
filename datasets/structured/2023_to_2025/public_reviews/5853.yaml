url: https://www.ptt.cc/bbs/movie/M.1201454115.A.B70.html
title: 'Re: [負雷] 火線追緝令 "爛片"應要求發此文'
content: "至少原PO還覺得SAW第一集不錯。\n\n\nSAW和SEVEN的殺人魔都是對於社會的不滿而有所控訴。\n你覺得SAW不錯，那是故事已經很明確對於JIGSAW的犯罪動機做敘述，\n\
  以致於我們容易了解SAW故事的主軸。\n\n如果哪一天，台北是個每天下雨的城市。\n你已經厭倦週遭一切的鬱悶。\n如果你是個年過半百，即將從局裡退休的警長，\n\
  乘著車，看著窗外一群不良少年勒索一個善良的少年。\n外面下的大雨，你多麼希望這些雨可以模糊這些醜陋的畫面，\n這個社會充斥著墮落，你選擇不婚，拒絕感情救贖那失落已久的靈魂。\n\
  你內心有一股聲音對你無盡的控訴，而你卻無能為力。\n看著這已腐朽的城市無情的吞噬你的靈魂。\n\n摩根費里曼就是演這樣的一個角色。\n\n當他看見這個年輕力盛的菜鳥，他也許嘲笑著他，\n\
  笑他如此的天真。天真在這墮落的社會是用不著的。\n所以一開始的殺人事件爆發時，他們倆總是意見不合。\n一直到事件發展的後面，他見了他的家庭。\n他慢慢了解這年經小夥子的執著。\n\
  \n畫面陰沉，色調偏暗，你可以說這是DVD畫質不好，期待HD可以重發。\n但這也是導演亟欲傳達的，這和SAW所直接的陳述有很大的不同。\n令人煩悶的大雨也許熄滅不了小夥子的執著。\n\
  但一連串的殺人事件卻讓他們一再絕望。\n就連最後抓到犯人了，導演不因此而結束這個故事。\n在這充滿罪孽的城市，每個人都有個不可赦免的罪\n殺人魔犯了忌妒，因他受不了幸福的家庭，\n\
  小夥子犯了憤怒，最後將殺人魔處決。\n\n這讓我想起了白色巨塔邱慶成對美茜所說的：\n\n我們每個人都背負著過去的錯誤而活，\n我們都必須和我們最不堪的那一部份相處。\n\
  只因我們是大人。\n\nSEVEN很現實，他絕不像SAW那樣單純用文字以及簡單的畫面敘述背景\n而SEVEN的生活卻很赤裸裸的攤在我們眼前。\n導演用了大部分的片段做社會環境的鋪陳，\n\
  因為這和我們的生活相當的貼近，\n對這社會的冷漠，無能為力。\n對我而言這部片子是相當震撼的。\n\n\n--\ni am... MOVIEGOER.\n  \
  \           ____我們只是放大鏡底下的小孩\n\n\n\n\n\n--\n◆ From: 219.68.42.4"
