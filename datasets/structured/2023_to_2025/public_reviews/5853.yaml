title: '[贈票]【火線追緝令】 IMAX 特映搶先看'
content: "★  30 週年犯罪經典重映\n\n★  4K 數位修復、首次 IMAX 大銀幕鉅獻\n\n★  布萊德彼特、摩根費里曼 強強聯手飆戲\n\n\
  ★  電影預告：\n\n\n\n人有七宗罪，貪食、貪婪、懶惰、憤怒、傲慢、色慾、嫉妒\n罪惡驅使一場最殘酷的審判\n\n劇情描述一位即將退休的資深警探（摩根費里曼\
  \ 飾）與一位剛入行的菜鳥警探（布萊德\n彼特 飾），聯手追捕一名以聖經七宗罪為殺人動機的連環殺手。兩位主角雖性格迥異，\n卻在共同追捕罪犯的過程中建立深厚情誼。\n\
  \n有史以來最黑暗冷酷的電影 - Roger Ebert\n緊張刺激的驚悚片，結局震撼人心 - Peter Travers, Rolling Stone\n一部能深刻銘記於心的罕見佳作\
  \ - IGN\n\n\n《抽獎方式》\n\n2月20日 23:59前，推文留言分享想看的原因，就有機會獲得電影特映券\n\n（如：台北場，我想看火線追緝令，想看布萊德彼特的逆天神顏\
  \ ）\n\n\n《獎項內容》\n\n【火線追緝令】電影特映券（一組2張）\n\n\n《特映會場次》\n\n台北場：2/25（二）19:30 台北大直美麗華影城IMAX廳\
  \ X 20組\n\n\n\n《中獎通知》\n\n2月21日公布中獎者於回文內，並寄站內信通知得獎者得獎事宜。\n\n請於2月24日12:00 前回覆領獎資訊，恕不接受逾期回覆。\n\
  \n\n《注意事項》\n\n1.特映券為非賣品，嚴禁兜售等圖利行為。\n\n2.請準時入場觀賞，電影開演後10分鐘戲院與主辦單位有權謝絕入場。\n\n3.如本活動因不可抗拒之特殊原因無法執行時，主辦單位有權決定取消、終止、修改或暫\n\
  \n停本活動與延遲得獎公告。\n\n更多電影資訊：華納兄弟台灣粉絲團 \n\n--\n\n--"
