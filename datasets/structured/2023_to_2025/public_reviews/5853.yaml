url: https://www.ptt.cc/bbs/movie/M.1532701396.A.574.html
title: '[好雷] 火線追緝令 Seven'
content: "之前在 MOD 617 Star Movies HD 看完\n\n\n看到帥哥主角\n\n布萊德彼特\n\n就看了下去\n\n還有黑人\n\n\
  摩根費里曼\n\n英文片名是\n\nSeven\n\n中國翻譯是\n\n七宗罪\n\n以上只是防雷頁\n------------------------------------------------------------------------\n\
  主角有五年資歷\n\n也不算新警察了\n\n不過剛調來這城市\n\n對黑人老警察來說\n\n還是個孩子\n\n老警察準備要退休了\n\n結果運氣不好\n\n碰到奇怪的案子\n\
  \n有個肥宅死在房子裡\n\n一般人看到這麼噁心的畫面\n\n可能會覺得\n\n貪吃肥宅活該死好\n\n沒什麼好查的\n\n趕快草草結案吧\n\n但有經驗的老警察\n\
  \n內心OS大概像李組長\n\n眉頭一皺，發覺案情並不單純\n\n還是秉持專業\n\n又很有耐心的\n\n仔細調查真相\n\n原來肥宅手腳都被綁住了\n\n法醫也發現\n\
  \n許多重要器官幾乎都被爆開\n\n正常人不太可能會這樣\n\n可能是有人拿槍逼迫的？\n\n老警察覺得這件案子沒有明確犯案動機\n\n不是普通案子\n\n可能會發展成連環殺人案\n\
  \n影響他退休\n\n想退出案子\n\n但長官大概覺得\n\n新警察還需要老警察帶上手\n\n沒有同意\n\n後來又發現新線索\n\n案發現場冰箱後的牆壁上有大字\n\
  \nGluttony（暴食）\n\n還發現紙條\n\nLong is the way and hard,\n\nthat out of hell leads up\
  \ to light\n\n長路漫漫而艱苦，出獄後即見光明\n\n是彌爾頓在失樂園寫的\n\n接下來就是七宗罪的連環殺人案\n\n七宗罪和基督教或但丁的神曲有關\n\
  \n貪婪（Greed）一個律師被殺了 引用了威尼斯商人的故事\n\n怠惰（Sloth）一個人被綁在床上整整一年 雖然沒死 卻很可怕\n\n淫慾（Lust）一名妓女被特殊性虐道具弄死\
  \ 加害人也是被槍逼的\n\n傲慢（Pride）一名模特兒被毀容選擇自殺\n\n嫉妒（Envy）嫌犯忌妒主角有幸福的生活\n\n憤怒（Wrath）主角被嫌犯言語激怒\
  \ 不惜動用私刑\n\n可見嫌犯並不是普通人\n\n而是知識分子\n\n因對社會墮落的不滿\n\n寫筆記本已經不夠宣洩他的憤怒\n\n利用宗教觀念\n\n想辦法合理化自己的犯罪行為\n\
  \n最後雖然嫌犯被私刑槍斃\n\n看似案子終於結束了\n\n但只是證明了\n\n連警察主角自己都不信任社會制度\n\n變得和嫌犯一樣憤世忌俗\n\n所以這部片想要表達的是\n\
  \n這個社會\n\n是靠著人與人之間的互相信任\n\n才建立起來的\n\n但並不代表社會是完美的\n\n有各種各樣的漏洞存在\n\n邪惡就在其中滋養長大\n\n\
  如果坐視不管\n\n姑息養奸\n\n社會可能會慢慢瓦解\n\n如果人民過度依賴政府\n\n如果警察能隨意動用非法正義\n\n就會產生獨裁政府\n\n如果人們對政治漠不關心\n\
  \n沒有主動積極的改變制度\n\n政府官員心態變得膽小怕事\n\n人們不信任政府\n\n就會動用私刑\n\n標榜替天行道的黑道做大\n\n受害的還是人民\n\n\
  所以這個社會到底怎麼了？\n\n這部 1995 年的電影\n\n主角老婆找老警察聊天\n\n透漏了線索\n\n她在這個城市只剩兩位警察能好好說話\n\n為什麼人們變得那麼冷漠？\n\
  \n為什麼人們變得那麼自私自利？\n\n為什麼人們變得那麼膽小怕事？\n\n人們應該要多互相關心\n\n付出愛心關懷社會\n\n不要自掃門前雪\n\n才不容易受騙上當\n\
  \n如果當初能先獲得附近鄰居的意見\n\n說不定主角可以找到更好的房子\n\n如果肥宅有好朋友找出來多運動\n\n也許不會變成肥宅\n\n如果房東有好好關懷房客\n\
  \n就不會一整年被綁在床上沒發現\n\n太多如果怎樣就不會怎樣\n\n這個社會本來可以更好\n\n但為什麼不去做呢？\n\n為什麼充滿知識的圖書館只剩警衛在打牌？\n\
  \n因為人們短視近利阿\n\n沒錢的事情不幹\n\n什麼都只想到自己\n\n但是知道嗎？\n\n錢本身並不值錢\n\n是信用讓錢值錢\n\n如果錢失去信用\n\n\
  可能就變成廢紙\n\n還好現在是 2018 年\n\n科技改變了很多\n\n現在辦案不是只看指紋\n\n還可以找出 DNA\n\nBB Call 已經是老古董\n\
  \n現在已經有 4G 智慧型手機 499 無線網路吃到飽\n\n人們之間交流資訊更方便了\n\n是不是更應該好好團結起來？\n\n社會還有很多需要關懷的弱勢\n\
  \n如果能有機會能讓社會付出愛心\n\n也許就能減少七宗罪的扭曲人性\n\n--\n 安全、無毒的食物\n 有錢結婚生養小孩\n買得起的房子\n被老闆當人看\n\
  下班還來得及和親友吃晚餐\n租得起房子找得到工作\n\n--"
