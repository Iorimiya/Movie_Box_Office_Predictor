url: https://www.ptt.cc/bbs/movie/M.1501861119.A.B32.html
title: 'Re: [討論] 《火線追緝令》差點有了不同的結局'
content: '前幾天終於有機會看到這部經典電影，深感震撼後勁十足，但是本人對這個結局安排不甚

  同意。


  打從一開始小布警探就一直表現出狂躁又對事事看不爽的模樣，我就知道憤怒(Wrath)的目

  標大概就是他，後來劇情線索也不斷給出，如他對假冒記者的真凶明嗆自己的名字、真兇

  拿槍指著他的後腦勺卻又放過他，在警車上的對談更是將這個懸念推到最高點。


  最後可以說是他自身招致的慘劇也就這樣來臨了。


  不過真兇一開始的計畫絕對是要小布警探直接看到包裹的內容物，因為指定收件人就是小

  布警探，但是這裡卻發生了他無法意料的情形，是由摩根警探在遠距離外先把包裹拆開，

  摩根警探立刻意會到真兇的意圖為何，因此立刻跑向兩人嘗試阻止真兇獲得他安排的結局

  。


  然而這邊我卻看傻了眼，摩根警探居然把自己的槍丟掉，然後試圖光用言語說服他應該最

  熟悉對方性格的小布警探，這根本是這個腳色不該犯的天大錯誤。


  如果是本人來寫劇本，我會把結局改成這樣：


  摩根警探發現了真兇的目的，立刻衝向兩人的地方，然後把槍指著真兇，跟他嗆聲：我現

  在就要殺了你，但既不是為了復仇，也不是因為憤怒，我殺你是為了阻止你將一個善良的

  靈魂淪喪為罪惡的化身，你輸了。


  由摩根警探槍殺真兇，小布警探沒機會化為憤怒的象徵，邪不勝正，這樣的結局應該會比

  較符合大眾口味。


  但也許這樣改，這部電影就不會這麼經典就是了。



  --


  這些我倒不知道，改天來看看有沒有相關花絮。



  老警探一開始就對罪惡無處不在感到心灰意冷，想早早退休去享受與世無爭的生活，最後

  犧牲自己去阻止最後一件發生在自己同伴身上的罪惡應該不會太突兀。



  XDDDDDDDDDDD



  就是要讓真兇在最後功虧一簣，湊不滿七宗罪而失敗。



  同意，傲慢我也覺得有點牽強，應該不少人都會選擇用安眠藥自殺吧，誰不愛惜顏面啊。


  就算能接受自己被毀容的醜陋模樣，但一想到未來面對他人異樣眼神跟生活上的痛苦，還

  真不如毫無知覺的死了算了。'
