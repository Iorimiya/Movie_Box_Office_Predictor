url: https://www.ptt.cc/bbs/movie/M.1492192168.A.0C8.html
title: '[ 好雷] 火線追緝令se7en'
content: '我印象很深刻的一句話，摩根跟彼特說

  「如果他是個撒旦，那他就是我們心裡所想的殺人魔樣子，很好。

  但如果他是個普通人呢？跟我們一樣過著平凡生活？」


  我看了這部電影遲遲不能入睡。

  第一個是被劇本設計近乎完美的七大罪安排嚇到，

  第二是不斷的被那個凱文史貝西在結局車內最後的對白衝擊—


  律師為了錢和名利讓那些強姦犯和殺人犯遊走在外，

  一個身體毫無節制任憑自己貪食就像那些我們平常歧視的胖子，

  我殺了他們你們應該感到開心。


  我想起那些我們輿論憎恨的大案件律師們，

  那些我們所見而鄙視的gold digger。


  影片一開始彼特一看見貪食代表，第一個反應就是厭惡又歧視。

  看完電影我特別想起這點，

  對比摩根的沉靜，我覺得他一開始就落入嫌犯的計畫。

  我覺得嫌犯的用意是要所有人正視自己的「罪」，用很偏激的方式。

  像彼特再最後車上聽到那些話腦羞成怒又無話可說，

  最後面臨著自己的憤怒，臣服人性的怒火而揹上一生沉淪的處罰。



  凱文史貝西的作案手法都有象徵性。

  懶惰者釘在床上爬不起來等等，

  人性的黑暗是很多人視而不見的。

  當警探不斷咒罵兇手有多兇殘而可惡，

  我回頭想起彼特在辦公室跟嫌犯律師對戲那種嫌惡的印象和口白，

  在跟嫌犯殺死律師的案件相對照，

  突然覺得警探的正義顯得有些諷刺。



  社會上所有人內心都咒罵著社會的賤人，

  覺得他們很可惡吧？那我殺給你們看。



  七大罪展示著我們的社會價值。

  嫌犯暗喻我們，警探也是我們。

  扮演正義的一方覺得無所畏懼，

  但暗地裡我們殺著人，那些被我們認為犯罪的人們。

  跟凱文史貝西所說的對白一樣。

  看著那些平常討厭的人死應該要是很開心的吧？

  而我們只是在不同的時間扮演作案和破案。

  在大社會所有人內心那股憎恨的聲音不曾消失下，

  作為觀眾的我們真的能說誰是壞人？


  另外這應該是我看過最猛的開箱影片了，

  我想那些youtuber應該可以洗洗睡。

  這部電影真的很沉重又寓意深遠。







  -----

  Sent from JPTT on my Xiaomi Redmi Note 4.


  --'
