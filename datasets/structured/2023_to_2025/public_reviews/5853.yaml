title: '[請益] 有雷—火線追緝令為啥很多人推'
content: '火線追緝令


  我是認真覺得不懂哪裡好看到這麼多人推，想問是哪裡沒看懂




  防雷頁










  變態殺人犯要殺7個人，小布和黑人從fbi那得到有誰借過這些書，找到兇手是誰住哪，還

  有小布很勇敢的追犯人


  除了這些，到底是哪裡好看我不懂，找不到犯人後來去哪，犯人還是自首，最後還被耍的

  團團轉，犯人一樣殺好殺滿7個人，沒救到半個，還賠了自己老婆，犯人雖然死了但這也

  是他想要的，從頭到尾犯人想做的都實現，我真的是滿臉問號，請問我有哪裡看不懂要重

  看的？@@



  話說最後我本來以為小布沒打死犯人，只是打在不會致命的部位，或是打在地上之類的，

  然後發現是假人頭，這樣還有點沒都照犯人的計畫走


  結果看評論都是殺死犯人，真的小布老婆的頭，這樣又更不懂哪裡好看了@@，小布這種情

  況下殺人也不保證會判死刑吧？然後電影就結束了，我很傻眼


  --


  謝謝你，說的也是，或許過一陣子再看會有不同體會



  謝謝，虛心請教我不覺得哪裡丟臉，丟臉的是不懂裝懂，人紜亦紜



  謝謝你的解說，可惜我對宗教無感， 7大罪死法演出是很不錯



  謝謝你的解說，原來是這一點，我有體會到現實的殘酷，這真的是絕望系電影



  謝謝你的解說，可以體會小布的掙扎



  謝謝你的解說，這些我知道，對我來說就是很厲害的變態宗教狂熱殺人犯



  謝謝你，我會不要再放心上了～



  好歐謝謝



  謝謝你，原來是電影教科書常用範例



  好的謝謝你，我不會再執著



  查了一下是被狂噓的電影？

  XD, 你自己看就好了，謝謝歐


  我還可以再看一次其他大家也推薦的電影，這些我也覺得好看，像致命ID、鬥陣俱樂部、

  驚悚、佈局、屍物招領、失控的陪審團、罪人的控訴、李察吉爾的絕命追殺令、西班牙電

  影幻象、等等等，沒控看你推薦的這部～



  你還特地回我不想解釋真是謝謝歐，我沒覺得重要阿，請益而已反應真大



  謝謝你的解說，原來是這一點，可惜我覺得沒有到神的地步，也許過一陣子再看會有不一

  樣的感受



  我也覺得黑人演的很好～



  哈哈我也覺得小布很帥，直接95分起跳～



  我也是衝著神片去看的～



  好的謝謝～



  好的謝謝推薦



  終於有人也一樣了！感動～謝謝你，觀影環境真的很重要



  可憐在哪？不能有不同感想嗎



  我有看出來阿，我在文章裡有寫最後被耍的團團轉還賠了自己老婆，開槍的地方我也有寫

  ，就是不懂這樣哪裡神阿


  不過謝謝你的解說，原來是這點覺得神，我只是頻率不對



  原來雙瞳有參考這部，我也覺得人物都演的很好



  如果單純想噓可以不用花時間寫字歐



  我是電影從頭看到尾，請你說明哪裡鬧版？不然請你道歉



  我最後一個暑假你可能還只是個流口水的屁孩而已～



  謝謝你的解說，原來還有這一段



  我還以為沒把頭照出來是開放結局



  我是衝著經典去看的～



  因為不是從壞人的角度說故事，不知道犯案細節，但是壞人全勝，我是覺得有點失望



  謝謝你的解說，原來也有遊戲致敬這部



  這樣哪裡奇怪？每個想法都不同，你的論點是真理嗎？你才奇怪吧'
