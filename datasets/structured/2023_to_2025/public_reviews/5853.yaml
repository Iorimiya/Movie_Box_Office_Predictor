title: '[討論] 火線追緝令&奪魂鋸'
content: '防








  雷








  呦～









  火線追緝令  1995年

  奪魂鋸         2004年


  我深深覺得這兩部片相似度非常的高


  一樣都是變態殺人魔，有著高尚的理想，並使用極端的手法來傳達訊息，以警示世人。


  而且同樣有切肉肉放秤子的橋段

  不免令人感到奪魂鋸是在致敬（模仿）火線追緝令




  倘若火線追緝令也拍個續集

  讓Wills（布哥）當第二集的大魔王

  來報復司法制度

  故事也可以無限延伸下去呢


  這樣大家會買單嗎



  --

  哈哈是的'
