title: '[好雷]Seven 火線追緝令'
content: '摸一把小布，年輕時候真是超帥，但論氣場絕對是王牌天神技高一籌！




  底特律警官費里曼預備退休前7天，小布前來交接，兩個人共同偵查一個案件，


  犯罪現場相當詭異，一個胖到不行的男人坐在椅子上暴斃，頭整個陷進義大利麵肉醬，


  手腳被捆綁，頭有明顯被槍托抵住而紅腫的痕跡，well，很明顯是謀殺案。





  隔天又發生一起謀殺案，一位專幫有錢壞人打官司聲名狼藉的有錢律師，


  被發現死於律師樓，一樣手腳被捆綁，地上寫了greed--貪婪，自從福爾摩斯血字的研究


  這本小說問世後，後世的犯罪者都超愛用這招跟偵探做心靈溝通，或者說是鬥志或愚弄？




  費里曼藉由經驗，重返胖子的現場搜查，發現冰箱後面，有兇手遺留另一組線索Gluttony


  --貪食，藉由這兩組字，聰明的費里曼聯想到基督教教義中的「七大罪」：貪食（Glutto


  ny）、貪婪（Greed）、怠惰（Sloth）、淫慾（Lust）、傲慢（Pride）、嫉妒（Envy）


  、憤怒（Wrath），棘手的是，他們要怎麼阻止這個聰明又變態的兇手繼續他的犯行呢？




  小布的腳色是衝動、積極，對社會亂象持有撥亂反正的正向態度，堅信自己能有所作為讓


  這個社會變得更美好；費里曼是冷靜自持，對社會亂象已經習以為常，但潔身自愛、想遠


  離所有亂源。他們倆其實都代表社會上的正面力量，只是一個潔身自愛、一個積極想改


  革，看到最後，大概猜到導演是屬於哪一派的人，默默覺得逼哀，因為自己也慢慢變成這


  一派的人了。


  想到一段被瘋狂轉載過的文章，是不是該反省自己？


  「當納粹追殺共產主義者

  我保持沉默

  我不是共產主義者


  當他們追殺社會民主主義者

  我保持沉默

  我不是社會民主主義者


  當他們追殺工會成員

  我沒站出來說話

  我不是工會成員


  當他們追殺猶太人

  我保持沉默

  我不是猶太人


  當他們要追殺我

  再也沒有人為我說話了」





  看完結局，我只能像紫霞仙子一樣感慨：我猜中了前頭，卻猜不出這結局。





  聽一下音樂哀悼這個詭異的社會


  Naughty Boy - La La La ft. Sam Smith




  --




  這版本也太…惡搞了吧

  動機是什麼啊？！！xDD



  可以理解的莽撞，貫徹小布的角色個性。只是很感傷，如果有一片熱忱的人結局是悲傷的

  ，那我寧願一開始就像摩根一樣冷漠，不知道小布那個角色以後會不會像白色騎士一樣？


  因為太憤怒了，所以選擇一槍斃了他，小布的角色就是很衝動，我覺得他不會選擇慢慢折磨兇手致死


  不無道理喔！

  我是你家人應該也會冷眼相待...(￣﹁￣)

  因為他的計畫被打破了，他沒想到摩根跟小布會找到他的住所來，他不是還特地打電話讚

  揚他們，那時候有說他的計畫會做變動。


  凱文一出現那個眼神跟肢體動作有讓我聯想到人魔

  握手...一想到結局就覺得惆悵  凱文你真是壞死了..T_______T~'
