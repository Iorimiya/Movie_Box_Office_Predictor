title: '[新聞] 開頭太老梗了 布萊德彼特初讀火線追緝令'
content: "「開頭太老梗了！」布萊德彼特初讀《火線追緝令》劇本時並不想演，最後本片成為拯救\n他職業倦怠的重要作品\n\n2025-06-25電影神搜\n\n\
  \n\n布萊德彼特最近為宣傳《F1電影》出席《Armchair Expert》Podcast 節目時，他談論到\n了許多過往的演出經歷，包括他最初於 1987\
  \ 年藉由《無主地》以一位「臨演」的身份正\n式踏入影壇。\n\n「那是一段在餐廳裡的戲，主角是查理辛和 DB 史威尼、以及其他我沒有注意到的演員。\n我飾演了一名服務生。我要做的只有拿出香檳來倒。他們向我示範了該怎麼做：你得要倒\n\
  香檳，然後旋轉並擦拭。」\n\n布萊德彼特回憶道，然後他似乎並不想要只倒香檳而已：\n\n「當時的重點就是，我該如何拿到一張演員工會的會員證？因為你沒有演員工會證的話，\n\
  根本就找不到工作，但你得要先有工作才能拿到一張會員證。這根本就像《第22條軍規》\n(catch-22) 一樣。」\n\n\n\n《無主地》（圖片來源／IMDB）\n\
  \n主持人表示，如果想要拿到演員工會證，那得先在電影中獲得「有台詞」的角色。\n\n布萊德彼特當時演出的服務生並沒有台詞，但當時年輕氣盛又充滿野心的他也決定放膽脫\n\
  稿演出。\n\n「像個混蛋一樣，他們當時在拍那場戲，而當我在為最後一位演員倒香檳時，她跟其他演\n員相比似乎比較沒那麼出名？或許吧？而在拍那場戲時，我開始幫她倒香檳，然後說了一\n\
  句：『你還有什麼想要的嗎？』接著換來了一陣：『卡！卡！卡！』\n副導演馬上衝過來說：『你要是再亂搞一次，就請你離開！』接著那天晚上我不斷受到辱\n罵。」\n\n\
  這起事件只是布萊德彼特演藝生涯中的其中一個小挫折，而在多部電視影集中客串演出後\n，他也終於慢慢越爬越高。\n\n他所飾演的配角受到了不少好評，之後他也終於如願以償獲得了帶來突破演出的機會，參\n\
  與演出了《末路狂花》。\n\n\n\n《末路狂花》（圖片來源／IMDB）\n\n然而，正當布萊德彼特漸漸在影壇打出了一片天， 並成為一位家喻戶曉的演員後，他卻\n\
  開始對於這一切產生倦怠感，一直到參與了另一部十分經典的生涯代表作。\n\n大衛芬奇執導的《火線追緝令》將會在今年正式邁向 30 週年，這部經典驚悚懸疑電影講\n\
  述了一對警探搭檔試圖追查一位神秘的連環殺人魔「無名氏」。\n\n而在這次的 Podcast 中，在這部電影中飾演「大衛米爾斯」的布萊德彼特也提到，這部\n電影如何幫助他重新找回演戲的動力。\n\
  \n「那是一段非常不健康的時期。」\n\n\n\n《真愛一世情》（圖片來源／IMDB）\n\n演出《火線追緝令》之前，小布已經參與了多部備受好評的經典電影，除了剛剛提到的《\n\
  末路狂花》之外，其他作品還包含了《大河戀》、《絕命大煞星》、《真愛一世情》以及\n《夜訪吸血鬼》等。\n\n但是，在 1994 年這個歷史性的夏天，同時也經歷了多部作品獲得負面評價，他開始對於\n\
  未來感到迷茫，大多數的時間都懶在家裡。\n\n「我只需要退房，我起床之後，會來一口水煙，接著喝點冰可樂，沒有吃東西。在那個夏\n天，我看了 OJ 辛普森案的世紀大審，而我只是想要釐清『我接下來要做什麼？』」\n\
  \n\n\n《火線追緝令》（圖片來源／IMDB）\n\n就在那段期間，他的經理寄給了他一份《火線追緝令》的劇本。\n\n他起初對於這部電影並不感興趣，因為覺得電影的開場有點太過平凡。\n\
  \n然而，在詳細閱讀之後，他終於明白了編劇安德魯凱文華克對於這部電影的願景其實比表\n面更加深層且黑暗，同時也比其他傳統的犯罪驚悚片還要更加慘忍。\n\n再加上他與導演大衛芬奇之間的對話，這部電影徹底改變了他對於自己對於演藝生涯未來\n\
  發展的看法。\n\n「我讀了劇本。我親愛的朋友兼經理——基本上對我來說已經情同姐妹的辛西亞把這部劇\n本寄給了我，她說：『你一定要讀讀看！』我看了最初的七頁，我打給她說：『你在跟我\n\
  開玩笑嗎？那麼老梗的警察探案，年輕的警察剛剛加入，而且還看著自己高中時期的美式\n足球獎盃？』而她只要我：『讀完就對了。』\n\n接著我與大衛芬奇見了面，而他也以我前所未見的方式談論了這部電影。我的演出慾又回\n\
  來了。這讓我對於這部電影徹底改觀，重新定義了我對於這部電影的期望。 」\n\n\n\n《火線追緝令》（圖片來源／IMDB）\n\n不僅如此，《火線追緝令》也徹底改變了導演大衛芬奇的生涯，擺脫了《異形3》的負評\n\
  。\n\n在那之後，他也持續與布萊德彼特合作，拍攝了《鬥陣俱樂部》、《班傑明的奇幻旅程》\n等經典電影。\n\n然而，《火線追緝令》主角大衛米爾斯那種「天真且傲慢」的性個仍然讓他久久難以忘懷\n\
  。\n\n「那種天真甚至有點傲慢的態度，也就是你覺得自己明白這整個世界。而就是我喜歡米爾\n斯這位角色的原因。你覺得你在一種真空中成長。你將整個世界看成了自己的後院，你並\n\
  不欣賞那些跟自己想法不一樣，或是擁有不同的動機、美感以及信念的人。\n\n這對我來說始終都是一個非常重要的主題，那種聚焦在自己的傲慢上的點子。每一次當我\n被擊倒時，都是因為傲慢。因為我自以為明白發生了什麼事，或是以為自己知道結果。」\n\
  \n接下來，布萊德彼特也將會在《從前有個好萊塢》的續集中與大衛芬奇再次合作，這部由\n Netflix 發行的續集將由大衛芬奇執導，至於劇本則由昆汀塔倫提諾本人撰寫，布萊德\n\
  彼特將回歸演出特技演員克里夫布斯。\n\n新聞網址：\n\n\n\n--"
