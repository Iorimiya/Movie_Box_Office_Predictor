title: '[討論] 火線追緝令的Mills (有雷)'
content: '防雷


































  標題本來想寫

  Somerset就雷啊！


  但算了 標題暴雷不好








  最後沙漠上的Box scene


  就Somerset雷啊 有什麼好護航的或是講一大堆的


  劇情上他就是亂開包裹還這麼誠實，假裝包裹裝拉雞就好啦





  那場就是他在戳啊





  最好笑推文


  叫人去看前半段 瞭解Mills的個性


  然後呢


  瞭解他的個性 瞭解他身世遭遇


  同理他做出那個反應 嗯嗯嗯犯了Wrath罪很有邏輯




  但那場客觀上


  就是Somerset在雷嘛


  說他雷


  但不等於鞭編劇寫的爛啊


  到底為什麼一堆神推文叫人家去理解Mills個性的啊==


  求解




