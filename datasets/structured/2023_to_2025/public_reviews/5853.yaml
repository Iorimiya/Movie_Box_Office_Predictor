title: '[負雷] 火線追緝令（有奪魂鋸關鍵劇情）'
content: '有火線追緝令+奪魂鋸關鍵劇情


  先防雷














  前面都拍得很好 但結局我沒看懂


  殺葛妮絲派特蘿是最大敗筆


  前面都有一些人格上的缺點 也可以說緊密結合原罪的設計


  硬湊一個無罪的受害者


  我的感覺他就像奪魂鋸的亞曼達一樣失格了


  雖然他的解釋是他犯了嫉妒


  但他犯了原罪跟別人老婆長的漂亮有何關係 他也沒進一步解釋


  說小布犯了憤怒是笑點中的笑點


  他沒懲罰小布 是法院要審判小布


  是不是又犯了懶惰？


  凱文史貝西從開頭的智慧犯宗教家


  變成沒梗硬凹的嘴砲家（是不是犯了懶惰罪？）


  他的7原罪只完成5原罪還要倒扣兩個無罪的受害人（小布老婆小孩）


  不及格'
