url: https://www.ptt.cc/bbs/movie/M.1608792980.A.C47.html
title: 'Re: [討論] 火線追緝令結局新解'
content: '現在才發現原來有這篇文



  沒錯


  洋妞本身又沒有犯七宗罪


  光頭沒有殺她的理由與動機



  沒錯


  代表洋妞並沒有死


  可能只是被光頭困在某個建築裡?電影沒演出來


  所以是打電話給彼特求救但彼特沒接電話



  這點我不認同


  狗狗沒有犯七宗罪


  所以光頭也沒有殺狗的理由與動機


  我覺得這邊只是要強調光頭是有原則的人


  沒有犯七宗罪的人甚至狗光頭並不會亂殺



  真的有可能




  有道理


  我覺得這部電影就是要把光頭設定為一個完全沉浸於懲罰七宗罪又有原則的人


  這樣才能跟片名Seven相互應


  最後也要剛好死七人才完美


  所以假設彼特槍殺光頭之後也被判死刑而死


  那就真的是無懈可擊的七宗罪了


  所以光頭如果在這當中殺了不該殺的人或不該殺的狗


  其實就毀掉了這部電影的完美性



  我覺得大衛芬奇當時可能是想拍成上面這樣子的


  也就是網友說的


  最後結局又大反轉


  原來洋妞沒有死


  只是被光頭困在某個建築物裡面


  後來被救出來


  最後一幕是洋妞去監獄看望彼特被執行死刑


  最後再螢幕一片黑


  用光頭對於七宗罪的看法與自白作為結尾


  這樣這部電影就真的是經典了



  但很可惜可能被製片人或片商覺得這樣子的結尾太黑暗


  等於是光頭大獲全勝


  所以改成我們看到的隱諱結局


  也就是讓觀眾誤以為彼特是真的為洋妞報仇才槍殺光頭


  這樣才會讓彼特的開槍舉動更具有正當性


  也才會把光頭打成徹頭徹尾的該死大反派


  彼特最後殺了光頭


  才會讓觀眾看得覺得正氣凜然


  可能這樣子的操作票房與評價會比較好?  所以才被改成現在這個版本?




  大家認同嗎?


  --'
