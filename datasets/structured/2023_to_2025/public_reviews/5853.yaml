url: https://www.ptt.cc/bbs/movie/M.1559409787.A.950.html
title: '[請益] 火線追緝令小問題'
content: '-----------首頁防雷-----------------------------------------------


  週末在NF上看完這部IMDB 8.6分的神作, 十分過癮!

  但有個地方很令人好奇, 爬文也爬不到：















  在Morgan freeman & Brad Pitt要陪同Kevin Spacey去找最後兩具屍體之前

  為了戴上竊聽器,  兩人站在浴室內刮胸毛.


  Pitt: 我如果失手刮掉奶頭, 可以申請職災嗎?

  Freeman: 你敢申請我就請你喝一杯.

  Pitt: 如果我老是太晚回家, 我太太一定會想歪.

  (Pitt撥頭髮)


  Pitt: You Know.... (欲言又止)

  Freeman: yup? what?

  Pitt: (沉默走掉)

  Freeman: (滿臉狐疑)


  有人知道Pitt原本想要說甚麼嗎?


  是不是代表Pitt在這時候已經開始擔心自己老婆遭遇不測了?但又不想烏鴉嘴?


  感謝各位!


  --

  感覺不太像, 在我敘述第二段的時候情緒已經從嬉鬧變成正經臉了.


  感謝Aarmageddonwa & Poopooshaw解釋!

  不過Netflix翻譯就是這樣, 抱歉沒仔細聽原文XD'
