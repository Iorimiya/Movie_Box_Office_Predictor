url: https://www.ptt.cc/bbs/movie/M.1720356340.A.78B.html
title: '[好雷] 火線追緝令 心得&一個問題 '
content: '最近看了火線追緝令，這部用七宗罪來當主題真的很有趣


  以下有雷












  尤其導演把兩位警探的反差呈現得很好

  David年輕熱血，一心想破案

  William則是想退休，對於社會的混亂感到心累

  兩人的辦案方式也很兩極

  David標準的從案件中找線索，循序漸進的辦

  William卻是先到圖書館找相關書籍，試圖理解兇手


  從這兩種差異可以發現映證了兇手John Doe最後所說的

  這個世界的人都已習慣了冷漠

  像被兇手John Doe以七宗罪名義殺死的那些人

  也先不論七宗罪是對是錯，但世人確實無視了這些人的行為或是心理

  甚至有些被殺死或是被抓都好一陣子才被發現

  更加映證了John Doe對於社會的現況理解是正確的

  而我想William肯定也是有相同感受

  才會有一開始心累想退休的橋段

  只是他不像John Doe那樣偏激的去犯案而已


  另外，整部有些地方我覺得算好猜

  像是David老婆一開始的戲份太突兀

  當下就有猜到他最後可能會凶多吉少

  但整體不算不影響觀看體驗

  只是最後會讓我覺得兇手到頭來是個愉快犯而已

  殺了David老婆等於是破壞他只殺七宗罪的原則

  也或許這點是我哪裡沒看懂

