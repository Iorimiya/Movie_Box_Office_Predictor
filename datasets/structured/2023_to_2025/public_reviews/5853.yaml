url: https://www.ptt.cc/bbs/movie/M.1523111763.A.F64.html
title: 'Re: [討論] 火線追緝令結局新解'
content: '剛剛在NETFLIX看完了這部經典，但和文中提到的有點出入，不知道是不是有多種剪輯版

  本？


  我看到的是

  1、箱子完全沒帶到內容物的畫面（完全沒有）

  2、摩根奔跑過去時只有一再的喊

  「不要開槍」

  「不管他說什麼，不要開槍」

  3、小布開槍前沒有看過箱子

  4、小布不斷質問摩根，希望他反駁約翰

  但摩根只有說：「你不能打死他」

  「你打死他，他就贏了。」


  我想從第2、4點可以完全推翻空箱子的可能性

  畢竟摩根一看到箱子就嚇的往回跑，裡頭一定是裝了可怕的東西，幾乎可以推論就是翠西

  的人頭。


  再來就是假人頭的說法。也許約翰真的透過關係得知翠西的長相，但很難相信翠西會向他

  提到懷孕的事。在餐廳裡，翠西向摩根說自己在這座城市沒有可以談話的對象。


  唯一可以想像的是，翠西在逼不得已的情況下，要求對方放過孩子的性命，約翰才得以知

  道這個資訊。


  看完這部心情真的很憂鬱............


  --

  我看上一篇有人說小布有看箱子～

  但又看到有人說那一秒是翠西在盒中的畫面，整個毛骨悚然......不過仔細想想，小布確

  實

  沒有看到箱子的畫面，所以應該只是回憶片段？

  沒有哦～

  天啊啊啊啊啊，今晚要作噩夢了。但我還是偏向那是小布回憶的畫面（這樣自己比較可以

  接受哈哈）


  乾，越看越像箱子裡的畫面了......

  應該是沒錯，但真的有畫面還是覺得很不舒服

  我現在閉起眼睛就會想到那張圖lol

  還我俏麗小辣椒嗚嗚嗚嗚

  我覺得那個畫面有可能是「小布想像箱子裡的情景」～應該多看幾次覺得不太像單純的回

  憶畫面。'
