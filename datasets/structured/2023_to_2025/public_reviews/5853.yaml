title: '[請益] 火線追緝令小問題（微雷）'
content: '各位大家好


  作為一個推理迷


  今天又再複習一次這部九零年代經典好片


  但每次看完都有個點過不去，還請各位指教


  防


  雷


  在故事中，前面兩件案子發生


  兇手明明已經在現場大方留下血字


  為何還要費力將其他小線索放在其它不容易發現的地方？


  例如在冰箱後方或是畫的後方



  尤其是在畫後方用指紋留下訊息


  感覺在現實情況下應該也不容易發現


  明明都留下血字，應該也可以直接留下其它提示


  不知道是否有版友也有過這樣的想法


  若可以希望聽聽大家的看法！


  --'
