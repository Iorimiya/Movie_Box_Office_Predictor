content: '【2023/08/25  iTunes特價報 華納多部$90大片特價】

  火線追緝令／索命黃道帶／2001太空漫遊／明天，我要和昨天的妳約會／亞特蘭翠大逃亡

  ／寒戰／放牛班的春天

  －

  今天片單最大的亮點是多部破天荒的華納電影特價！大衛芬奇的兩部驚悚經典，《火線追

  緝令》和真實事件改編的《索命黃道帶》同時特價，兩部的氣氛營造都非常厲害，出人意

  表的結局至今仍是影迷間的話題。另外史丹利庫柏力克留名影史的兩部作品《2001太空漫

  遊》和《金甲部隊》也在片單之列，尤其《2001太空漫遊》至今仍深刻影響著電影文化，

  是每個人都應該收藏一部的大作。華納的大片算是iTunes的招牌，一般價格都會控制在

  $190，這次的$90一定要好好把握。

  －

  緊接著是喜歡香港警匪電影的朋友一定不能錯過的《寒戰》，直接兩集一起特價，而且卡

  司也算是一時之選，不論是演出或是畫面都讓觀眾相當過癮，強烈建議至少要趁這次特價

  入手第一集。另一部推薦的則是$190《愛國者遊戲》，這部片由哈里遜福特飾演湯姆克蘭

  西筆下的傳奇特務傑克萊恩，角色相較前一個亞歷鮑德溫的版本也更有深度，獲得相當高

  的評價和成功的票房。

  －

  最後是這次八月限期三天的爆米花日，讓人很驚喜的是有《放牛班的春天》。這部應該不

  少人都在課堂上看過吧，劇情感人不在話下，音樂表現超棒，而且非常非常難得特價，一

  定要趁這個周末收藏起來！

  －

  以上，祝大家看片愉快！

