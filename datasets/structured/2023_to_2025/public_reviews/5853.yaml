url: https://www.ptt.cc/bbs/movie/M.1660018354.A.48E.html
title: '[討論] iTunes特價 火線追緝令/荒谷惡龍/快樂腳'
content: '【2022/08/09 iTunes 特價報】

  火線追緝令／班傑明的奇幻旅程／夜訪吸血鬼／哈比人：荒谷惡龍(加長版)／四海好傢伙

  ／快樂腳

  －

  今天的重點情報是iTunes又更新了一波華納特價！裡面也包含不少幾個月前特價的好片回

  鍋，上次沒跟到的這次要把握了。其中首推布萊德彼特主演的《火線追緝令》和《班傑明

  的奇幻旅程》。尤其前者是犯罪電影的代表作之一，大衛芬奇營造的懸疑情節與和令人印

  象深刻的結局至今仍有不少討論度，絕對是這次必收的好片之一。

  －

  其他推薦的還有《夜訪吸血鬼》，這部膾炙人口的吸血鬼電影除了小布之外，還有超年輕

  的湯姆克魯斯和當時還是童星的克絲汀鄧斯特攜手演出。劇情改編自吸血鬼文學巨匠安萊

  絲的同名小說，也可以說是開啟現代吸血鬼電影的先河，使其螢幕形象不再只是設定扁平

  的反派怪物，不論從演出或是劇情角度而言，都是很值得收藏的大作。

  －

  另外這次我們也整理了幾部特價4K大作，《哈比人：荒谷惡龍(加長版)》是這次最大的亮

  點，由BC主演的惡龍史矛革也是這個系列裡的經典反派。如果之前沒有收到套裝，這次的

  單部特價也是很可以入手的價格。另外1989年米高基頓主演，提姆波頓執導的《蝙蝠俠》

  也在這次特價之列，是收藏的好時機。還有經典黑幫電影《四海好傢伙》的4K版本也在特

  價，不過這部的HD版本也是$190，大家要入手之前記得確認一下規格。

  －

  以上，祝大家看片愉快！

  －

  未特別註明 畫質皆為 HD

  4K = 4K 畫質

  HDR = HDR 動態範圍支援

  DV = Dolby Vision 動態範圍格式

  DA = Dolby Atmos 全景聲音效支援

  EX = iTunes Extras 額外內容 （不一定均有中文字幕）

