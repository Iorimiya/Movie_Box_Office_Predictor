url: https://www.ptt.cc/bbs/movie/M.1740623094.A.EDD.html
title: '[新聞] 《火線追緝令》30週年重映 4K修復「小布'
content: '新聞網址：


  《火線追緝令》30週年重映 4K修復「小布」神顏回歸


  2025/02/27 05:30



  布萊德彼特在《火線追緝令》飾演正義感爆棚的火爆警探，帥氣形象深植人心。（華納兄

  弟提供）


  〔記者許世穎／綜合報導〕由金獎名導大衛芬奇執導的犯罪電影經典之作《火線追緝令》

  ，前晚在台舉辦IMAX版試片，這部30週年的驚悚經典完全沒有因為時光流逝而顯過時，依

  舊如此引人入勝、難以超越，4K修復效果相當驚人，採IMAX規格呈現更讓觀眾得以在大銀

  幕體驗有別往昔的震撼張力。


  該片以《聖經》中的「七宗罪」為靈感，描述兩位性格迥異的警探搭檔聯手追查一連串駭

  人聽聞的兇殺案，每起案件現場都留下對應七宗罪的線索，挑戰人性道德底線。


  「小布」布萊德彼特在片中飾演正義感爆棚的火爆警探，帥氣逼人的形象深植人心，與葛

  妮絲派特洛的對手戲更擦出愛火，當年因此展開一段戀情，成為影壇佳話；電影那令人回

  味無窮的震撼結局，留給觀眾無限想像空間與深刻反思，而該片也榮獲各大媒體評選為影

  史百大佳片。《火線追緝令》4K數位修復版今天在台上映、IMAX版同步登場。




  --'
