url: https://www.ptt.cc/bbs/movie/M.1484721830.A.62F.html
title: '[討論] 《火線追緝令》差點有了不同的結局'
content: '大衛芬奇（David Fincher）在《異形3》（Alien3 ）的失利後，緊接著帶來了評價極高

  的懸疑犯罪電影《火線追緝令》（Seven），以七宗罪為主軸串連一起連續殺人案件，結

  局「盒子裡裝了什麼？」所引發的效應也帶給觀者無限的震撼。不過該片編劇安德魯凱文

  沃克（Andrew Kevin Walker）日前接受 THR 訪問時透露，當初差一點就沒有如此經典的

  結局了。


  安德魯凱文沃克在完成了《火線追緝令》的劇本後，最早是要交由《瘋狂聖誕假期》（

  Christmas Vacation）導演耶利米謝奇克（Jeremiah Chechik）執導，而在耶利米謝的要

  求下，。雖然最後耶利

  米謝並沒有執導這部電影，而拍攝計畫仍持續在好萊塢打轉，大衛芬奇卻意外的收到了原

  始版劇本。

  「大衛芬奇當時表達了他對此片的興趣，但他同時也提到盒子裡的東西，而電影公司慌張

  的告訴他，他拿到的是不對的劇本，因此要再將改寫過後的送交給他，但是他說假如是那

  樣的話，他就沒有興趣了。」

  後來安德魯與大衛芬奇出初次碰面時，原本準備好了筆記本要寫下需要修改的地方，但大衛

  卻叫他把筆記本收起來，因為他們是來聊天的，不是來聽他的指示，自此也開啟了兩人的友

  誼以及在專業上的關係。

  ，至今他都仍相當感謝當時大衛的反對。



  --'
