url: https://www.ptt.cc/bbs/movie/M.1681652614.A.404.html
title: '[負無雷] 聖母院大火：世紀浩劫'
content: "今天剛看完來貼一下感想，\n其實在進場前對這部的期待蠻高的，\n畢竟本來就對這種災難類的紀錄片或類紀錄片很感興趣，\n預告也剪得很精采，畫面看起來很不錯。\n\
  \n但離開影廳後細想整片，\n就體感來說，真的是連及格都稱不上的電影，\n但其中又可以感覺得出劇組很認真，\n不是那種交差了事拍攝出來的成果，\n我也不確定這部的中間發生了什麼問題。\n\
  \n\n先來講優點，我覺得真的只有畫面好看而已，\n有幾幕真的很有詩意，\n法國的都市之美也掌握得很好。\n\n接下來是缺點：\n1. 人物情感不足：\n  \
  \ 可以理解導演想以群體為主軸，不想聚焦在幾個角色上，\n   但這也讓整片看完我對裡面的角色幾乎毫無印象，\n   扣出群眾外，整部電影稍有戲份的大概15、16人，\n\
  \   而且每個人戲份都平均，也就是少的誇張，\n   有的角色只出現在開頭和結尾、有的中間出來一段就沒了，\n   基本上完全沒有任何人物有完整的角色敘述，\n\
  \   因此我在觀影過程中嘗試了幾次，但都完全無法帶入角色，\n   只能以冷漠的旁觀者立場看著電影推進。\n\n2. 片段凌亂：\n   這也是我很難帶入情緒的問題，儘管這部電影是線性節奏，\n\
  \   甚至在部分片段還有時間的字卡輔助，\n   但導演不知道是不是為了製造緊張感，\n   幾乎沒有在哪一幕停超過三分鐘，不斷地切換敘事線，\n   有時傳過去劇情也沒推進，就只是單純地跳過去再切回來，\n\
  \   讓人有時會分不清前因後果。\n\n3. 鋪陳不足：\n   除了片段凌亂外，有一些片段也出現地很謎，\n   忽然冒出的人物做了某件事，卻沒在後續收尾時提及，\n\
  \   我甚至在看完電影後回想才會想到「啊那個人後來怎麼了」\n   這些片段再穿插在原本就很破碎的故事主幹中，\n   讓整部片的敘事又更迷茫了\n\n  \
  \ 另外因為前面人物的問題，進而也反映到片中的重要物品上，\n   很多東西我知道很重要、很貴重，很多情況很危急，\n   但在觀賞時卻像隔著一層紗，沒有很直接的體會，\n\
  \   可能導演覺得對法國人來說，那些東西的重要性是必然的，\n   但在這麼零散的鋪陳下，我覺得重要性、危機感沒有很直接。\n\n   講真的，在對重要建物的在乎上，我覺得連白宮末日都比這部深刻。\n\
  \n\n最近才看了NF的波士頓馬拉松爆炸案紀錄片，\n說真的連那部真實採訪的紀錄片，\n戲劇張力都超過這部聖母院大火，\n更別提像薩利機長、聯航93這種優秀的災難劇情片了，\n\
  雖然有些畫面真的很美，但實在無法推薦，\n希望導演下部電影能有更好的發揮。\n\n--"
