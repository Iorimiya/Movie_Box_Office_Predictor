url: https://www.ptt.cc/bbs/movie/M.1666353833.A.B5E.html
title: '[好雷] 燃燒的巴黎聖母院 Notre-Dame brûle (2022 法國片)'
content: '2023/03/28 更新：本片將於4/14院線上映，台譯片名《聖母院大火：世紀浩劫》




  暑假阿姨帶來一堆外片 DVD，裡面有我從三月就很想看的法國新片 Notre-Dame brûle直譯「燃燒的聖母院」，是曾導過《玫瑰的名字》《情人》《火線大逃亡》與《大敵當前》的法國老導演
  Jean-Jacques Arnaud今年最新作品！剛好這週 Netflix上架了新劇《巴黎聖母院大火》令我看了挺五味雜陳，就把這片也翻出來比較看看。話說我看那齣
  Netflix新劇的感想是：東拉西扯說了很多人們的故事、安插了很多角色來聖母院演內心戲、反而打火英雄的消防專業退居次要都在情感掙扎、甚至打火戲份僅 1/3左右一直被生活劇情打斷、最後比較值得欣賞的還是聖母院3D重建...


  但這部 110分鐘的電影《燃燒的巴黎聖母院》取向完全相反：導演在火災過後一開始是想拍「紀錄片」、後來慢慢發展成為按照時序重現火災過程的「紀實電影」，他不採3D模型的電腦技術而到處去找大教堂、用好多間法國歌德式教堂與巴黎聖母院相似之處拍攝近景戲份，而遠景的聖母院大火他廣徵當時的新聞與民間錄影畫面、果然一呼百應得到廣大迴響栩栩如生記載了那多國報導萬民祈禱的焦心夜晚！有不少馬克宏畫面也模仿了個川普畫面、還有伊達戈市長客串演自己。然後「角色塑造」非常次要，因為打火英雄極多都不同面孔，唯一主角還是眾人搶救的聖母院本身！




  片頭第一部分，從大火前的 2019/04/15 下午談起，聖母院的春天白天就是滿坑滿谷國際觀光客！英法德意西中港日等多國語言統統拍一團導覽，馬上告訴我們「巴黎聖母院」絕非僅屬於巴黎或法國而屬於全世界，待會兒燒起來後的各國新聞畫面更展現了全球的關心！不過下午觀光客離去後
  18:00晚間彌撒開始 18:15才悄悄火起，史實火起的官方說法是電線走火，但從這裡開始本片在大致的「紀實」前提下處處描繪一個「得過且過」不上軌道的巴黎：


  (1) 屋頂整修的工人們閒散抽菸，明明到處都寫著「不准抽煙」！這煙蒂被風一吹吹到屋簷吹進窗裡就進了屋架；(2) 堂堂聖母院的打鐘點燈等電線居然還是裸線缺乏保護！而大教堂自古以來就是屋簷閣樓豢養鴿子的最好去處，鴿子會怎麼築巢怎麼啃咬誰都很難說；(3)
  史實第一聲警報，剛上任的值班保安還在隔壁打電話吃東西，他至少有趕快回來戰戰兢兢上報；(4) 但受報去檢查的老警衛隨便看看找錯地方就回報沒事，只說「又是誤報好煩人，系統老舊該換了」卻得過且過未嚴肅面對；(5)
  居然還是有人觀光自拍傳給朋友才發現「聖母院有煙？這裡也選教宗嗎」XD




  居然外面的觀光客拍照直播了、內部工作人員還渾然不覺！(6) 還要小保安再度上報、電話打來打去被踢皮球、直到市長辦公室都遠看到煙才下令消防隊追查！(7) 第二聲警報終於讓老警衛當回事了，但要爬上屋架另作清查還要爬好多樓梯帶好多鑰匙開好多搞不清鑰匙的門；(8)
  進入屋頂屋架發現真的著火了！但兩個警衛連忙逃開要去疏散群眾時、竟沒拿起手邊就有的滅火器嘗試第一時間撲滅；(9) 兩次警報要疏散彌撒群眾時都遭遇白眼，主持的神父與女高音都覺得神聖的彌撒被警報毀了；(10)疏散群眾時還有白目小女孩回去點蠟燭，不過這蠟燭倒有意想不到的導演安排。


  (11)巴黎消防隊兩位將軍終於動員了就近的分隊！只可惜巴黎古巷狹小交通阻塞、汽車與自行車共道趕都趕不走、車輛與行人聽到消防警笛不知讓路還到處鑽洞、甚至有滑板男看到消防車就樂得掛上來、路旁施工更往往縮減路寬消防車都過不去了、消防人員塞在車陣卻見記者騎小速克達早就鑽過去...
  總之十萬火急的消防車可以遇到一百種巴黎式阻撓！(12)率先到達的第一小隊四人上了「北端耳廊」，但重重門鎖毫無準備溝通不良還要他們乾等；(13)等頭四位終於上到耳廊屋頂準備開砲滅火時，黃金時機早過了已一片火海！而且木架倒塌石頭傾頹鉛製屋瓦融化如岩漿！




  電影前段就是各種得過且過果然出包的「巴黎式扼腕」！中段則是各種已過莫悔硬著頭皮彌補過錯的「力挽狂瀾」，在此大火的史實搶救階段與面向也一一鋪出：(1) 陸路集結消防隊來得太慢了、要水路集結水上消防並帶來雲梯對付這極高火災，雖然看那幾乎噴不到的水柱面對大火根本杯水車薪；(2)
  室內重點從交叉甬道「拱心石」開始燒穿了，小隊進入中殿向上噴水總是到不了頂；(3) 還要有一小隊專責救出 1300 件藝術與文物，(4) 中殿拱頂倒塌致氣壓閉門、要破門救人；(5)
  鎮堂至寶「耶穌基督荊棘王冠」有重重保險、要從凡爾賽宮拼命趕來的聖母院總管才能開！


  可以說這場「聖母院保衛戰」上自消防將軍下至消防基層都是一路灰頭土臉步步撤退、能夠「保住人命」「搶救文物」就已讓神職人員淚流滿面感謝上帝了，儘管塞納河與西堤島兩河四岸無數民眾點燈祈福合唱禱告、市長總統親臨打氣各國元首致意集氣，但這高度面積都史無前例的大火已完全超出人功可為、消防將軍也劃下底線「任何教堂都可重建」但弟兄人命都只有一次...
  然而，在火災最後階段的「風向轉北」燒向西端立面兩大鐘樓時，這一路敗退的消防隊史實唯一「扳回一城」的觸底反攻，導演在堅守紀實筆觸整片後、終於在片末最後一戰加入英雄色彩召喚觀眾：




  我們巴黎與法國，真的要退守一切保住人命與文物就好、而放任石頭建築就此崩毀他日重建嗎？儘管消防將軍專業立場是人命最大，但總統蒞臨揭櫫的是象徵性的法國文化使命、背後集體守夜的萬民則唱出了集體記憶與認同，那為了這超出我們自身的神聖使命、有誰願為了消防員的「有共識風險」自願投身「自殺任務」？這電影呈現還真慷慨激昂一呼百應！也還真的有幾位敢死代表的勇闖上爬、要隻身犯險爬到不可能的最高處、才能給聖母院大鐘如「天降甘霖」般呼應萬民的企盼...
  不得不說 Jean-Jacques Arnaud畢竟曾經是商業大導，連紀實電影都能拍到熱血沸騰！


  看看此片的法國票房，在上映首週僅次於《咒術迴戰》位居全法第二算相當有人氣！不過它的法國影評就毀譽參半：讚頌的，認為它紀實報導鉅細靡遺、對打火英雄致敬讚頌、對聖母院意義感人呈現、亦振奮法國人心喚醒使命；但批評的，也正是針對這種法國人心與使命感的「愛國主義」與「英雄主義」而感到憂心，或是對全片沒有具體角色具體人生而只有抽象的集體使命而感到疏離...
  不過我看完全片雖沒看見完整的個人故事、卻更珍惜那一個晚上萍水相逢的片段熱情：大家來自四方初見「聖母院冒煙」也許還只看熱鬧？但人心會慢慢踏上正軌不分你我一起祈福。




  而這宗教概念的「祈福」又有何意義？宗教建築與文物又不能當飯吃、點燈集氣唱詩祈福又能幫得了消防硬功夫？Jean-Jacques Arnaud 在前段諸多得過且過不上軌道的「巴黎式荒唐」中，竟也藏了一個小彩蛋留到最後頭尾呼應流露神性！那單純虔誠的信仰可不是科學技術制度效能所能取代的，也許也在冥冥之中庇佑人們保住了真重要事物？與其扼腕錯過失去的、不如感恩你所擁有的，「巴黎聖母院」既能連結一晚萬眾一心、是否也能繼續引領不同語言的世人求同存異？從導演的影像選擇與眾生呈現中我感到這理想。推薦搭配網飛影集與國家地理紀錄片，比較欣賞。



  --'
