url: https://www.ptt.cc/bbs/movie/M.1683390076.A.CCC.html
title: '[新聞] 女學生被迫植入耶穌DNA！《神鬼聖戰》融'
content: "新聞網址：\n\n2023-05-06 聯合報 張佑生\n\n女學生被迫植入耶穌DNA！ 《神鬼聖戰》融合科技與宗教打造全新奇幻戰役\n\n地獄即將降臨人間！由加拿大鬼才導演奈森法蘭克斯基（Nathan\
  \ Frankowski）執導的新\n片《神鬼聖戰》(The Devil Conspiracy)，不僅在2022布魯塞爾奇幻影展口碑爆棚，撒旦\n路西法與高科技超乎想像的結合，在年初於美國上映時更引起討論，如今這場聖戰也將在\n\
  5月12日全台戲院降臨！\n\n由艾麗絲奧爾尤因(Alice Orr-Ewing)飾演的女學生蘿拉因為目睹邪教組織偷走耶穌的裹\n屍布而被綁架，她的子宮被迫植入DNA孕育撒旦路西法的宿體，大天使米迦勒為了阻止這\n\
  個邪惡的陰謀，不得不附身在神父身上阻止這場邪惡的陰謀！這場天使與魔鬼的交戰前所\n謂未有的瘋狂！\n\n 為了展現出這場超乎常人想像的正邪交戰，導演毫不諱言地表示這部電影的創作充滿著\n\
  風險，但機會十分難得「 不是每天你都有機會製作像惡魔一樣的電影，並與鼓勵你深入\n、發瘋、嘗試極限的編劇與製片合作。挑戰極限是劇本的要求，也是我們在整個製作過程\n\
  中注入的東西。」最終製作團隊融合了現代、宗教和科學的元素，並成功地打造了一部善\n惡之間的終極之戰！\n\n值得一提的是，製作團隊選擇在捷克取景，試圖營造宗教的古典氛圍和地獄般的荒涼景象\n\
  ，也受到了影評人James McDonald的稱讚「導演利用了美麗且令人難以忘懷的捷克鄉村風\n景，讓我們對於地獄的一瞥想起了《魔戒》中的末日火山，那裡充滿了飛行的惡魔、火山\n\
  和巨大的熔岩流」。\n\n電影講述一家強大的生物科技公司擁有突破性的技術，使他們能夠僅用幾個 DNA 片段就\n可以繁殖出歷史上最有影響力的人物。而這家公司的背後是一群信仰撒旦的邪教教徒，他\n\
  們偷走了基督教的裹屍布，成功地從其中竊取了耶穌的DNA。而目睹這一切的馬可尼神父\n被殺、來自美國的藝術系學生蘿拉則被教徒綁架。神父臨終前祈求大天使米迦勒降臨自己\n\
  的體內打敗撒旦，當神父潛入邪教的據點時，竟發現蘿拉體內被放置了一個生命：她即將\n孕育出DNA與耶穌相同的嬰兒，好作為路西法的宿體。\n\n此時，被米迦勒附身的神父，不惜一切都要與時間賽跑，試圖對抗教徒救出蘿拉，並終結\n\
  魔鬼復活的陰謀，於是一場天使與魔鬼的激烈對決就此展開……。《神鬼聖戰》5月12日\n全面開戰。\n\n--"
