url: https://www.ptt.cc/bbs/movie/M.1419069562.A.D08.html
title: '[好雷] STAND BY ME 哆啦A夢'
content: '這是一部最不哆啦A夢的哆啦A夢作品。

  　

  沒有耳熟能詳的主題曲，也沒有深植腦海的日常配樂，

  更聽不見從四次元空間袋裡頭拿出道具時的懷念音效，

  更別說是從2D變成了3D人物這件事了。

  　

  　

  但奇妙的是，縱使一切都與小時候所熟悉的那麼不同，

  卻還能讓人滿溢著童年回憶與再次重逢的感動…

  　

  小叮噹依舊寵溺著大雄、雖然偶爾會落漆但還稱得上可靠。

  　

  大雄一樣的膽小躊躇不果斷、但也仍懷著一顆溫暖善良的心。

  　

  宜靜永遠都是那樣地溫柔婉約，也是萬年不變的洗澡機器。(喂

  　

  技安阿福兩人則是堅守著可愛又迷人的反派角色崗位。

  　

  　

  跟著小叮噹與大雄搭乘時光機穿梭時空到了未來，

  倒也硬生生將自己的思緒拉回到了童年，

  與大雄一起戴上竹蜻蜓在空中恣意馳騁，

  映入眼簾的一切都是那麼令人懷念又顯得新奇有趣，

  究竟有多久未曾感受到如此不顧一切的玩心了？

  　

  對於「有捨才有得」的認知也在我們逐漸大人後才慢慢懂得，

  比較美德，這更像是種妥協、一種不得不的妥協，

  好比大雄無法一輩子擁有小叮噹的陪伴，

  而為了未來的幸福，妳/你又願意拋下哪些理所當然？

  　

  如果這隻圓滾滾的藍色機器貓曾經陪伴過妳/你的兒時歲月，

  那麼相信這次的劇場版《STAND BY ME哆啦A夢》

  絕對能讓妳/你找到那曾經存在卻失落已久的童稚趣味、

  以及只有在長大後的我們才懂得的那份真摯感動…

  　

  就讓我們陪著大雄和小叮噹，再轉一次大人吧！

  　

  ----

  這次劇場版相當推薦看3D版喔，視覺效果滿點！

  光看戴上竹蜻蜓翱翔天際就讓人感覺身歷其境值回票價啦啊啊～

  　

  由於是動畫片所以小朋友會有點多，

  但也有滿多二三十歲的年輕人來觀影(硬要把自己歸類成年輕人XD)，

  看來哆啦A夢果然是跨時代族群的兒時重要印記啊～

  　

  還有、真心建議記得面紙要多帶點，

  光是電影票送的一包面紙可能不夠用，真的。


  --'
