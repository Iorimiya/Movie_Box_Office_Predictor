url: https://www.ptt.cc/bbs/movie/M.1419340061.A.50F.html
title: '[好雷] Stand By Me 哆啦A夢'
content: '我覺得這部電影的定位有點尷尬，因為它沒有任何「原創」劇情，與其說是新作品，不如

  說是3D重製，或者總集篇。


  會採取這個作法，有可能是為了從來沒有接觸過系列作品的新觀眾著想，或者是想要用最

  忠實還原的方式，向藤子老師致敬。


  可是這麼一來，卻有可能面臨兩面不討好的結局——電影最後，哆啦A夢離開的傷感，才

  剛剛認識哆啦A夢和大雄的觀眾，能夠感同身受嗎？


  此外雖然電影選擇的故事都很有代表性，重新剪裁後也銜接地非常流暢，可是這不會改變

  沒有新劇情的事實——看著哆啦A夢長大的觀眾，會不會在走出電影院時，因為「毫無新

  意」覺得失望上當呢？


  不過我想，有一群人，是絕對不會對這部電影失望的，因為他們深愛著哆啦A夢，在他們

  逐漸成為大人，知道重要的童年事物已成往事，不會再回來的時候。


  他們走進電影院尋找的，卻是這個「毫無新意」的哆啦A夢。


  --'
