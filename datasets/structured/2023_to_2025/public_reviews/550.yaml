url: https://www.ptt.cc/bbs/movie/M.1419990205.A.FBE.html
title: '[好雷]stand by me 哆啦A夢'
content: '(防雷)























  老實說這部電影在預告片出現時，本來覺得應該會是相當糟糕的一部，看到3D畫面時不禁

  想說：「怎麼人物長得那麼詭異？」所以本來並沒有要看的打算，直到昨天由於太過無聊

  才踏入電影院看。


  首先先說劇情大綱，故事架構就是哆啦A夢出現→幫助大雄→大雄喜歡靜香而想做出改

  變→大雄開始靠自己的能力→哆啦A夢讓大雄得到幸福後必須回去未來→大雄用道具陰錯

  陽差地讓哆啦A夢又回來~happy ending


  以上故事是由許多短篇故事串成一部九十分鐘的電影，老實說在每一個小段落的開始，我

  就能馬上知道下一步會是甚麼，但眼淚卻還是會不自覺地掉下來，除了雪山那段之外基本

  上與原作並無太大差異，劇情的部分便不再贅述，很多篇文都有詳細的說明了。


  直接說心得

  這部電影所主打的並不是小朋友，一開始有很多場景確實很好笑，但是我笑的時機並不多

  ，因為這些梗我都曾經看過，頂多偶爾來個會心一笑，但在小朋友的笑聲下，讓我漸漸回

  想起以前小時候：

  印象很模糊，但在我很小的時候，似乎哆啦A夢還叫做小叮噹，每周六晚上五點台視會撥

  後來在華視撥放，每周一到五六點半撥放至今

  之後八大也開始撥放，每周一到五的五點到六點都有


  好像不知道從甚麼時候開始，我不再吵著媽媽叫媽媽快點帶我回家我要看哆啦A夢，

  不再回家後從五點看卡通到七點，所以也漸漸遺忘了這童年的好友。


  我想我會那麼喜歡哆啦A夢的原因，是對於我自己的投射：

  我小時候我就像大雄一樣，長得瘦瘦矮矮，打架總是打輸人，跑步總是跑不贏，考試也總

  是考不好，喜歡的女生也總是喜歡別人，導致我小時候很沒有自信，我也想要有個哆啦

  A夢

  如果有電腦筆，那我考試就都可以考一百分

  如果有任意門，跑步時我可以直接到達終點等同學

  如果有竹蜻蜓，我就可以飛上天空

  如果有...


  但事實就是這些東西都沒有，唯一能靠的，就是自己而已，於是像大雄一樣，因為一個喜

  歡的女孩開始運動；因為一個喜歡的女孩開始讀書；因為一個喜歡的女孩催眠自己很優秀

  ，到了在電影院看電影的當下，我發現自己比以前進步了很多，已經超越了那過去懦弱膽

  小的自己，比以前更加了解凡事不該怨天尤人，不該過度奢求別人的援助，或許已經不再

  需要哆啦A夢，因為自己就是自己的哆啦A夢，「哆啦A夢是我童年的好朋友。」最後那原

  先懵懂無知的大雄長大後說出這句話時，漸漸發覺過去的已經過去，長大了之後不再能

  倚靠家人，而是自己要給別人倚靠了...


  Stand by me 這部片的片名取得很棒，哆啦A夢在我們小時候都渴望擁有，長大後，自己

  才能是自己的哆啦A夢。哆啦A夢在我的成長過程中，具有非常大的人生啟發，大雄每次

  濫用道具總會自食惡果，或許這就是藤子‧F‧不二雄想要傳達的意義「凡事都想倚靠外

  力，最後都不會有好下場。」


  我想在以後有了小孩之後，我一定也會推薦我的小孩看哆啦A夢，或許沒有人能夠永遠

  stand by me，但我自己能夠永遠stand by me。過去的時空已經過去，無法再像小朋友

  一樣無憂無慮的大笑，確實我們都長大了。




  最後希望大家還是可以稱哆啦A夢為哆啦A夢，因為那是藤子老師的遺願。


  --'
