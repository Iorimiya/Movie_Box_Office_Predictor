url: https://www.ptt.cc/bbs/movie/M.1419448579.A.C02.html
title: '[問題] 關於stand by me 哆啦A夢雪山部分有點疑問'
content: "其實我對雪山的浪漫史有點疑問，\n\n新番版上演的完全沒有時空誖論問題，\n\n這次的STAND BY ME感覺看這裡有點怪異，\n\n青年大雄那時已經沒有多啦A夢了，\n\
  他何以知道所謂重要日子?\n\n\n由於之前看過銀魂-永遠的萬事屋 有稍微聯想到關於這問題，\n\n\n小大雄變14年後去解救靜香>記下時間衛星定位希望讓未來大雄發覺\n\
  \n(但同時也以凍死 但如果真凍死不管是青年或小時候 都GG了吧？)括號是我猜的\n\n時空循環一次後又以\n\n小大雄變14年後去解救靜香>記下時間以衛星定位>未來大雄得知\
  \ 開車來救援\n\n\n這樣循環回來 但青年大雄沒多啦A夢 小時大雄當時是一股腦就是要過來\n不是前面已經記得時間跟定位那種想法過來14年後\n\n到底是怎麼樣的解釋法???\n\
  \n\n--\n   可是要怎麼知道= =?\n 錯字以修ˊ_>ˋ+\n最近看太多有關於時空的玩意 想一下唄=~=\"\n我想應該是從大雄說完之後手突然就不動了\
  \ 從那才開始迴向 也不可能出現死的畫面..."
