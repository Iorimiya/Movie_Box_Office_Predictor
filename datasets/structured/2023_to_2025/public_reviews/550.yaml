url: https://www.ptt.cc/bbs/movie/M.1676493845.A.C70.html
title: '[  好雷] Stand by me 哆啦A夢'
content: '防雷






































  還記得十年前國小的時候

  每天下午五點的八大綜合台播完忍者哈特利後

  接下來就是播哆啦A夢

  這兩部卡通是我重要的童年回憶

  也是當年每天我最期待的一小時

  如今我的童年隨著現代技術回來了


  跟小時候的卡通最大的差別是

  畫風好看的沒話說（我個人喜歡這類型）

  尤其是靜香超級美

  小時候覺得她只是一個比較有氣質的小女生

  但現在看她大人的模樣真的婆到爆

  我都想跳下去跟大雄一起競爭了

  那張打屁股的照片我只想說...

  大雄你委屈了,讓我替你承受吧！

  而視覺效果也是更上一層樓

  好幾幕場景,尤其是未來的

  很明顯是為了電影院而設計

  如果這種技術重製於各個劇場版感覺很有看頭


  劇情方面的部分

  就是順順把劇情跑完（角色為主故事為輔）

  各個道具的出現也是超回憶殺

  話說長大了覺得很多事情用空氣砲來一發就解決了

  中間有些過渡劇情會有點小無聊不過無傷大雅

  不過有些地方小時候無感,長大看了卻會有點注意

  就是掀靜香裙子那段,我會懷疑這樣到底有無必要

  其實這個就像幾年前偷看洗澡的爭議一樣

  只能說創作時代背景不一樣也沒辦法

  我是沒差,但兒童向作品可能要為了小孩教育三思


  總之這部電影真的喚醒我的童年

  沒有毀掉他,而是用現代化的樣子重現眼前

  愛哭的大雄、愛現的小夫、粗暴的胖虎

  氣質的靜香、優秀的小杉、萬能的A夢

  他們都是我美好童年的一部分

  而我現在就想看第二集.jpg

  話說版友最喜歡哪部劇場版？

  我是最喜歡恐龍那個啦


  ----

  Sent from  on my Samsung SM-M325FV


  --

  萊斯特在最後敘述中講述了生活中有意義的經驗，他說，儘管他死了，他還是很高興，因

  為這世界上有這麼多的美


  --'
