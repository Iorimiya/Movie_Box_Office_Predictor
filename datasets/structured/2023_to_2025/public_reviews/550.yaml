  ★ 獻給《哆啦A夢》原作藤子・F・不二雄誕辰 80 週年的 3D 電影

  ★ 日本暑假四週票房冠軍，力壓《露西》、《變形金剛4》歐美大片

  ★ 日本上映總票房突破 85 億，創下歷年電影版《哆啦A夢》最高票房記錄


  故事描述一位住在日本東京郊外，無論讀書、體育、藝術，各方面都比別人差的少年 -

  野比大雄。有一天，大雄的子孫 世修 和 哆啦A夢 從二十二世紀一同搭乘時光機到來，

  原因是大雄在長大後經商失敗，欠下大筆債務，從而導致子孫們受到牽連，所以世修便派

  來了未來世界的藍色貓型機器人，希望能改變大雄的悲慘命運，從此大雄就和哆啦A夢一

  起生活，共同面對日常發生的大小事…


  本作為 藤子‧F‧不二雄 著作的日本國民動畫哆啦A夢首次以 3D CG 動畫呈現，由《

  Always 幸福的三丁目》導演 山崎貴 和《麻吉妖怪島》的導演 八木龍一 共同執導；這

  次的故事以「大雄的結婚前夜」、「再見哆啦A夢」等等名作品為主軸所展開，首次嘗試

  的 CG 動畫還製作出精緻的袖珍模型作為拍攝背景，經過後製和人物模型結合之後，電影

  成品畫面實在讓人眼睛為之一亮。


  導演：《麻吉妖怪島》八木龍一、山崎貴

  演員：(配音)水田山葵、大原惠、嘉數由美、木村昂、關智一、妻夫木聰


  --'
