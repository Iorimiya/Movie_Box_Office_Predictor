url: https://www.ptt.cc/bbs/movie/M.1423553995.A.B85.html
title: '[好雷] Stand by Me 哆啦A夢'
content: '網誌圖文影音版(無音樂)



  ============


  「此部既出，哆啦A夢已死」是我的評語。


  不論你叫他「小叮噹」或「哆啦A夢」，

  只要你曾經認真嚮往家裡也有一隻藍色機器貓，

  想像著打開書桌抽屜就能看到時光機，

  這部電影就絕對能感動你。


  電影不長，一小時三十分鐘。

  這九十分鐘由數個我們熟悉的短篇故事編織而成，

  且一路從大雄與哆啦A夢的相遇演到離別，

  如果你喜愛哆啦A夢，我相信每一個橋段你都看過。

  你知道蛋中的靜香第一眼看到的是出木杉；

  你知道大雄會用時光布讓自己長大，去拯救在雪山中受困的靜香；

  你知道靜香在結婚前一天曾經不想嫁了；

  你甚至知道哆啦Ａ夢在回去未來之後，最終還是會陪在大雄身邊。

  每個情節我們都如數家珍、倒背如流。


  但你仍會流淚。


  這正是此部電影厲害之處，

  表面上它完整交代了大雄與哆啦Ａ夢的相遇到別離，

  但其實它做的是讓我們再一次完整檢視自己的童年，

  讓我們能夠細細回憶與哆啦Ａ夢每一次的相遇。

  這篇故事你可能在10元乖乖內附贈的小本漫畫看過，或是在電視上看過動畫，

  這都不重要，重要的是你重拾了與哆啦A夢的相遇，你重拾了過去的自己。


  在看片時，每當我拿起衛生紙拭淚，

  我知道眼淚不單純是為了哆啦Ａ夢流，而是過往回憶。

  李安曾說「人生就是不斷地放下；令人遺憾的是，沒能好好告別」。

  過往年華往往從指縫中不知不覺流失。

  而此部電影，正好能讓我們回頭整理自己的童年，做個告別。


  更重要的，因為大雄集所有缺點於一身，

  所以我們或多或少都曾將自己投射到大雄身上。

  當我們看著大雄從懦弱需要幫助，

  到能獨立擊敗胖虎，不需要哆啦Ａ夢的照顧。


  其實看的不是大雄的成長，而是對自己的捫心自問。

  曾經幻想著用記憶吐司來應付考試的我們，

  已經是為了生活而努力打拼的青壯年。

  但，是否也隨著年齡增長，已經夠堅強，

  不會再幻想著抽屜裡會蹦出一隻機器貓拯救自己的未來，

  在面對困難時，是否能夠像大雄一樣抬起胸膛站在胖虎面前?


  片中讓我感觸最深的片段，

  是成年後的大雄看著在遠方睡午覺的哆啦Ａ夢，

  年幼的大雄問出是否需要讓他們見面時，

  成年的大雄婉拒了，並說道

  「哆啦Ａ夢是你，也是我童年時候的朋友，要珍惜和哆啦Ａ夢在一起的時光喔」。


  如果要從整部片中找出一句台詞作為中心思想，我認為就是這一句了。

  過去的事物或許美好但終究屬於過去，成年的大雄無情地告訴我們這一點。


  以上所提，皆是個人感觸。

  若除去這些感性層面，這部電影的表現依然有許多亮眼之處。

  除了劇情上的巧思，將六篇不同的短篇故事串接起來且沒有留下過深的斧鑿痕跡之外，

  畫面的處理也非常亮眼。


  或許有些人跟我一樣，第一次看到3D模組的大雄，忍不住罵了一句WTF，

  但事後證明，這只是我個人一時的不習慣，整部片看下來，

  並不會因為第一次看到3D的哆啦A夢人物而感到彆扭，

  甚至讓我第一次知道靜香也可以這麼萌。


  而畫面背景更是值得一提，此片在細節處理上非常細心，

  我們終於能仔細觀看大雄的房間平常堆了些甚麼東西，空地旁的圍籬長甚麼樣子，

  如果你夠仔細，還能發現大雄的書櫃上擺了奶奶送他的不倒翁，

  胖虎家裡的櫃子上擺了他的個人專輯「乙女の愛の夢」。

  這些在細節處的用心只有熟悉哆啦A夢的我們才看得到，不得不對製作小組再次致上敬意。


  最後，回到我最初的評語，為何我認為「此部既出，哆啦A夢已死」?


  因為這部片給了我們這些看著哆啦A夢長大的成年人一個完整的回顧。

  如果你沒這麼熱愛這隻機器貓，這短短的九十分鐘你會認為太過倉促，

  大雄因離別而所表現的悲傷會顯得有點荒謬，

  你甚至不知道跟你一起看片的人為什麼流淚，但其實很簡單。

  我的眼淚，不是因為九十分鐘的感動，而是因為過去的二十年。


  這二十年包含了我與哆啦A夢的相遇與逐漸淡忘，

  其中，初遇的悸動與驚奇更是彌足珍貴，

  這正是做為國民動畫偶像最有價值之處。


  也因如此，電影中光是哆啦A夢擺出招牌姿勢自我介紹時，我就感動不已。

  對我而言，這部片已經把我們對哆啦A夢最珍貴的回憶挖掘出來了。

  而這份感動，絕對是第一次時最美，

  往後如果再出現類似於此部「統整」手法的哆啦A夢影片，

  也絕對比不上這一次的感動了。


  因此，我才宣稱「哆啦A夢已死」，因為其核心價值已被消費。

  儘管如此，我心中抱著的還是感恩之情，感謝這部片，

  給了我心中輪廓早已模糊且失去定位的哆啦A夢，

  有個清晰的註腳，像是拚上最後一塊拼圖，可以安穩地將他擺在時光抽屜裡。


  最後，不能不提到另一部也曾讓我哭得死去活來的哆啦A夢短片，

  是1998年的「哆啦A夢回來了」，

  Stand by Me中我始終認為大雄與胖虎的對決少了點張力，

  這部98年的「哆啦A夢回來了」在此段的表現較讓我印象深刻，

  且最後的道別時光也讓我哭得一把鼻涕一把淚，在此一併推薦給大家。


  --



  --'
