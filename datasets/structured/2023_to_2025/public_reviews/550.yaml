url: https://www.ptt.cc/bbs/movie/M.1613227211.A.F76.html
title: '[好雷] stand by me 哆啦A夢2-當你成為大人後'
content: '當年第一集在電影院哭到不行，還上來發了電影版首PO

  第二集上映後也很快去看完，回想消化後分享一下心得

  以下有雷








  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~







  有看預告的應該都知道這次是由<奶奶的回憶篇>、<大雄的結婚前夕>組成，

  不過進場後發現還有一個<大雄出生的那天>。


  雖說劇情銜接得還不錯，但看起來就是沒第一集流暢，有些地方也顯的刻意，

  但整體瑕不掩瑜，許多細節也都很用心(小大雄突然被送回來、混亂中出現的

  隱形披風哆啦等。但最後電梯上的路人那個當下比較沒意會到，以為只是突然看

  到小孩變大人驚嚇。

  哆啦的金屬質感、道具的呈現依舊出色，只是現在看到那種什麼意識交換、靈魂

  抽出來跨時空傳送什麼的覺得很可怕XDDDD



  接下來我想說說成年大雄回到童年時代那段。

  就好像第一集最打動我的，是成年大雄說出那句


  「哆啦A夢是我...小時候的好朋友」



  這一次觸動我最深的，是成年大雄in小大雄到處玩，因為棒球依舊打不好被胖虎

  追打，但他十分開心。這個時候小大雄說了一句:


  「那樣到底有什麼好玩的?真搞不懂大人。」



  我想，小朋友們的確可能不懂這種單純的歡樂在成為大人的我們來說，是多麼珍貴。



  後來看到大雄跟胖虎小夫一起衝向國中生幹架不知為何有點感動，雖然內心是成人，

  但他沒依靠道具跟著衝了出去。

  接著回到出生那天，知道了自己名字的意義，最後趕上婚禮。當鏡頭拉遠，我原本

  以為奶奶會透過時光電視看著這場婚禮，沒想到是直接帶來現場，害我又哭一次。



  結尾時我也在想這樣小大雄全都知道了，那以後還逃跑幹嘛。

  結果就被健忘棒敲到了。



  STAND BY ME 第一集的副標是「謹獻給曾經是小孩的大人們。」

  我想仍是這系列的初衷吧，我那場進場的幾乎都是30+的大人



  我們和20年前一樣看著藍色機器貓的道具歡笑、期待未來的光景。

  不過，我們已成為了大人。




  --'
