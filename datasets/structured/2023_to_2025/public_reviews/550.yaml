title: '[贈票] 《STAND BY ME 哆啦A夢》贈票活動'
content: '《STAND BY ME 哆啦A夢》贈票活動：就是要把你送進電影院哭！


  大家好，我是小曦，在電影板的資歷不久，目前發過的心得文分別有：

  〈[超推] 有笑有淚讓人心頭暖暖的《真愛每一天》（超多雷雷雷雷，慎入！建議不怕被雷或是已經看完的朋友再入內回味！XD）〉

  〈[普雷] 《黑魔女：沉睡魔咒》－－最邪惡的，是貪婪的欲望（2014.06.14 二刷更新）〉

  〈[好雷] 淚流滿面的《哆啦Ａ夢：新．大雄的大魔境~扁扁與五人之探險隊~》〉

  〈[好雷] 《雷神索爾２：黑暗世界 THOR: THE DARK WORLD》與信義威秀4DX初體驗！（大雷請慎入！XD）〉等等。


  而這次發文是為了送出好評現正延燒的《STAND BY ME 哆啦A夢》2D電影交換券！總共有7組雙人套票和6張單人票要送出給大家哦！想要進電影院朝聖讓大家哭得亂七八糟的3DCG哆啦A夢，請快點進文章連結了解詳情、參加抽獎吧！^__^


  [活動] 哭到臉都皺在一起了的《STAND BY ME 哆啦A夢》！小曦要來送票啦！！！>////<



  －－－


  我一直都是哆啦A夢劇場版的忠實粉絲，每年三月於日本上映，而台灣通常會排在暑假檔期的哆啦A夢劇場版，是我每年都要follow的行程！


  今年在得知除了《大雄的大魔境》外，還有所謂「3DCG」的作品會上映的時候，第一個動作就是趕快去查台灣片商什麼時候會引進（甚至也擔心不知道會不會引進）、排定在何時上映等等。暑假時，在PTT電影版上看著在日本的網友陸續發文分享《STAND
  BY ME 哆啦A夢》的心得，也得知台灣片商預計引進本片並排在年底上映的消息之後，簡直讓人心癢難耐，恨不得趕快親眼看見這部和劇場版有著明顯區隔的哆啦A夢電影版作品！


  「這是一部哆啦A夢的開始與結束的故事，也是大雄與靜香的愛情故事。」

  不同於以往由原著的大長篇改編或全新創作劇本的動畫電影，《STAND BY ME 哆啦A夢》是唯一一部集結了數個原著的經典短篇所結合而成的電影作品；七個短篇由編導略做改編後，串聯成一個劇情流暢、首尾呼應的完整故事，以哆啦A夢和大雄的相遇、發展出的友誼，以及「讓大雄幸福的重要關鍵：靜香」為主軸，發展出了人物生動、情節豐富、有笑有淚的哆啦A夢電影。


  故事裡，會看到熟悉卻「活跳跳」（笑）的主角們，看到串聯了我們的共同記憶的哆啦A夢經典道具，看到我們熟知的大雄的各種面貌－－最重要的是，也會看到大雄如何透過哆啦A夢的幫助和他自己的善良與執著，改變原本令人憂愁的未來，緊緊抓住屬於自己的幸福。


  然後，我們也會看見，有因緣際會的相遇，也就有令人難過流淚的分離......


  哆啦A夢哭了。


  12月20日星期六，台灣正式上映的第二天，我就訂了2D版本的票，忙不迭的把自己送進電影院裡，跟著那些只要看過原著短篇，就幾乎全部都能預知後續的內容，好好地哭了許多次；讓我哭到臉都緊緊皺在一起了的那些段落，容我近期寫一篇完整的超雷心得文，再把哭泣的原因告訴大家。只能說，哆啦A夢和大雄，這兩個緊密聯繫著我們所有人童年回憶的傢伙，他們的相遇相知，互相關懷、一起成長的珍貴友誼，真的是我們的短暫人生中所能體會到的，最珍貴的事情之一啊。


  而電影3D效果的優秀口碑，從今年暑假在日本一路延燒到台灣的冬天。我就曾看到、聽到好多朋友說，「哆啦A夢看起來觸感好好！好想摸摸他！」畫面的立體生動，已經讓我決心再進戲院看一次3D版本了。我確信自己還是會鼻酸掉眼淚啊！


  台灣片商很貼心地準備了角色面紙送給觀眾，超級貼心！不過我還真的捨不得用哩！XD


  就在我看完電影當天哭慘了回到家後，搜尋許多和電影的相關資料時，很幸運地聯絡上了台灣片商，超級積極主動地向他們提出了「想要幫忙宣傳」的意願和請求，於是，原本奢望「只要爭取到優惠券」就好的小小心願，居然就變成了「20張2D電影交換券」！在此再一次地感謝又水整合！


  所以說，不要只是我哭，小曦老師也要把大家送進電影院哭啦！我會把片商贊助的20張電影票全數送出，分別以7組雙人和6張單人電影交換券的方式，把票送給想要進電影院感受童年回憶和想大哭一場（無誤XD）的朋友們！


  以下為抽獎方式：

  1. 按下在本文標題下方的Facebook「Like/讚」按鈕！

  2. 在本文底下留言（無論以Facebook或其他社群網路身分皆可），寫下「我是第＿個讚！」和「我超想進電影院看《STAND BY ME 哆啦A夢》！」即可，如果沒有使用任何社群網路身分留言，務必記得留下暱稱哦！

  3. 小曦會在截止時間（2014/12/25 12:00）後，以手機app亂數抽選出7組雙人和6張單人電影交換券的得獎序號！屆時會請得獎的朋友透過「小曦老師的生活日記」臉書專頁私訊，或以e-mail方式聯絡我，在告知我寄送地址之後，透過平信寄送的方式，將票券送到得獎的你們手上哦！


  總共7組雙人票和6張單人票等著你！祝大家幸運中獎！


  （小提醒：本次送出的2D電影交換券，無法在影城櫃台升級成3D席次唷！）



  --'
