url: https://www.ptt.cc/bbs/movie/M.1419263353.A.417.html
title: '[好雷]stand by me 哆啦A夢'
content: "=======================================================================================\n\
  \n哆啦A夢被大雄曾曾孫-世修逼著留在大雄所生活的時空，\n被設定為必須要讓大雄感覺幸福，才可以回到未來世界，\n於是很苦惱，不知道要怎麼幫他，因為大雄很懶，又沒自信，也沒有甚麼抱負，\n\
  但是有一天哆啦A夢發現，大雄很喜歡靜香，原來靜香就是大雄幸福的來源，\n也是大雄的目標，大雄可以為了跟靜香結婚而勇往直前，因為不想長大跟技安妹結婚，\n身為一個輔導者，哆啦A夢於是朝著這個方向前進，\n\
  雖然每次拿出道具想要幫忙，但是往往最後都會被大雄搞砸，\n大雄自己想到，可以乘時光機到靜香身處危險的時空去解救她，\n這樣靜香應該就會因為感激他而對他產生好感，\n\
  可是哆啦A夢認為這樣很危險，有可能會破壞時空旅行的律法，\n但是為了幫助大雄，也只有冒險一試，\n於是乘時光機來到了靜香去爬山遇到暴風雪的時空，大雄並用時光布把自己變成大人，\n\
  還自信滿滿地說不用哆啦A夢的幫忙，他可以靠自己的力量完成，\n於是自己走進任意門，踏入刮著暴風雪的山中去找靜香，\n結果是靜香配備齊全，反而幫了大雄很多，\n\
  但是強烈又酷寒的暴風雪，讓他們幾乎看不到路，靜香又感冒，不是很舒服\n\n\n靜香:[當我們還是小孩的時候，哆啦A夢總是會即時出現來相救。\n     我好想知道哆啦A夢現在正在做甚麼。]\n\
  \n大雄:[可能在打瞌睡或是在做啥吧...]\n\n靜香:[哈，你好傻喔，還像小孩子一樣。]\n\n\n靜香的身體已經撐不住了，突然昏了過去，大雄趕緊抱著她，\n\
  大聲呼叫哆啦A夢求救，但是哆啦A夢在任意門另一邊，根本聽不到，\n大雄想找任意門，但是早已被風雪掩埋...\n這時靜香戴的智慧型手錶感應到生命跡象微弱，發出警示，\n\
  這下怎麼辦? 在最危急的時刻，大雄看著智慧手錶，跟衛星定位儀，\n要自己記住這個時間跟位置，希望成人的自己能夠在這個時刻來到山中救他們，\n這時從風雪中突然出現一輛未來的車子，原來是長大的大雄真的出現來相救了，\n\
  就這樣，童年的大雄與成年的大雄一同合作與信賴解救了自己，也改變了命運。\n\n回到哆啦A夢與任意門所在的公園，成年大雄已經將靜香送醫，回來找童年大雄\n成年大雄望向正在打盹的哆啦A夢，若有所思...\n\
  \n童年大雄:[哆啦A夢在那邊，要一起去找他嗎?]\n\n成年大雄:[嗯...不用了。]\n\n童年大雄:[為什麼?]\n\n成年大雄:[哆啦A夢是你的...嗯...我童年的好友，好好珍惜你們相處的時光。]\n\
  \n======================================================================\n\n有甚麼獲得了，就會有甚麼失去\n\
  \n這一段童年與成人的超時空相會，是我覺得最精采最有寓意的一段，\n整部片不單是很有趣，也很感人，也蘊藏很多人生的道理，\n大雄不是甚麼都不會，他的目標就是愛，就是靜香，可以激發他的勇氣與潛能，\n\
  擁有幸福美滿的婚姻，就是大雄的人生目標，他用智慧化解危機，也扭轉了命運，\n純真善良，為對方著想的本質，是努力也得不到的成就。\n\n從成年的大雄與靜香的話裡，大概可以知道哆啦A夢已經是一個童年的回憶，\n\
  就像本片的宣傳標語: 獻給曾經是小孩的大人們\n我們就像是在電影開頭時，跟著哆啦A夢乘著時光機，回到童年，再次跟哆啦A夢相遇\n也跟自己的童年相遇。\n\n\n\
  \n\n\n\n\n--"
