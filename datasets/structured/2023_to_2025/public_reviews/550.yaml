url: https://www.ptt.cc/bbs/movie/M.1419518874.A.D11.html
title: '[好雷]stand by me 哆啦A夢觀後感 '
content: "從小到大一直都很喜愛哆啦A夢(還是喜歡叫他\"小叮噹\")\n 對於漫畫和卡通 無論是短篇或是大長篇到現在的3D動畫\n 每每都有感動和歡笑的點\n\
  \ 所以這次推出的stand by me  看到日本的驚人票房\n 更讓我覺得一定要進電影院看這部片\n 影片上映前幾週  看到預告 就情不自禁的流淚了\n 每看預告都必哭\
  \  尤其配上主題曲(秦基博的音樂和歌詞)\n 也第一天就買3D的票  準備去電影院好好感動一番\n\n\n\n\n\n\n\n 以下有雷\n 針對我個人的印象深刻的點來敘述\n\
  \n 1.最初哆啦A夢從22世紀跟世修來找大雄\n   哆啦A夢不願意留下來 邊在時光機吃著銅鑼燒嘀咕著\n   之後被世修設定了\"要讓大雄幸福才能回22世紀的\"\
  扭轉鼻子程式\n   一開始我對這樣程式設定的劇情很不能認同\n   後來發現原來是要對比和加強 哆啦A夢之後的不捨 讓劇情更有張力\n\n 2.大雄上課遲到\
  \ 運動方面很弱 考試都零分 被小夫和胖夫欺負 常常出糗\n   都被哆啦A夢的道具改變了\n   再次看到了很多經典道具\n   \"任意門\"讓大雄不再遲到\
  \  \"記憶吐司\"讓考試不再零分\n   還有\"時光包巾\"讓打破的花瓶恢復了 \"隱形斗篷\"讓他可以偷偷揍胖虎\n   諸如此類的故事串在一起 既熟悉又有趣\n\
  \n 3.為了靜香而大雄的轉變是整部故事的主軸\n   希望可以讓靜香幸福也是大雄的目標\n   所以他發現要靠自己的力量 先從不要考零分開始 不依靠任何道具\n\
  \   哆啦A夢發現大雄認真準備讀書  充滿感動的眼神和幫大雄披上毯子\n   也讓我有點鼻酸\n   但是 考完試 才發現大雄根本準備錯的科目 所以還是零分\n\
  \   大雄意會到自己真的很沒用 無法給靜香幸福 所以選擇離開 希望靜香討厭他\n   說出:[靜香跟我結婚會貧苦一輩子的] 這裡也是淚點和轉折點\n   因為大雄的為人著想和善良個性\
  \  反而讓靜香離他更近了\n\n 4.哆啦A夢和大雄在屋頂上看著星空\n   哆啦A夢竊喜著看著大雄\n   說給他看一張照片\"成人靜香處罰著和大雄長相相似的小孩\"\
  \n   大雄很感激哆啦A夢 說都是他的功勞\n   哆啦A夢說著:\"不是的 是你改變了未來\n   未來的可能性好比天上的繁星 非常的多\n   是你的為人著想的個性\
  \ 讓未來往好的方向去了\n   是你抓住了往好的未來的那個機會\" (此時我眼角流下淚水)\n\n 5.成人靜香雪山遇難記-大雄迫不及待的去救靜香\n   靜香惆悵問了不知哆啦A夢現在在做什麼?大雄天真的回答:應該在睡午覺吧\n\
  \   還笑說 大雄怎麼和小時候一樣 (代表成年後的他們已經沒有哆啦A夢在身邊了)\n   因為什麼都做不好的大雄  讓靜香覺得更應該好好在身邊照顧他\n  \
  \ 靜香說了之前大雄問他的事情他現在回答\"OK\" 此時小時後大雄還無法理解\n   後來靜香生命微弱 大雄想到呼喚成人大雄來拯救他們 喚醒記憶\n   成人大雄及時來拯救\
  \  對小時候大雄說著:謝謝你願意相信我 (也讓我好感動)\n   平安的回到公園 成人大雄看著午睡打呼的哆啦A夢\n   小時候大雄立刻說要不要一起去找哆啦A夢\n\
  \   成人大雄若有所思的說:不了 哆啦A夢是我小時候的好朋友\n   你要好好珍惜和他相處的時光\"  (也是大哭點-代表哆啦A夢終究要離開)\n   之後哆啦A夢和小時候大雄躺在銀杏的畫面\
  \ 真棒\n\n 6.結婚的前夕-靜香和爸爸的對話\n   靜香不想結婚了 覺得自己很任性又沒能給父母些什麼\n   靜香爸爸說:\"你已經給我們最棒的禮物了\
  \ 回想出生的那時刻\n   小時候到現在 帶給我們很多很棒的回憶\n   雖然會覺得有些寂寞  但是這些寶貴的回憶就是給我們最大的安慰\"\n   覺得父女情也讓我很感動\
  \ 靜香的爸爸講話真的很有深度和智慧\n   靜香爸爸也說:\"靜香能選擇大雄 他覺得很驕傲 因為大雄是會別人幸福而幸福\n   為別人悲傷而感到悲傷的人\"\
  \ (再次強調大雄的善良)\n\n 7.哆啦A夢的離開-在河堤邊 大雄摀著嘴巴 有話對哆啦A夢說:\"現在他覺得好幸福\"\n   就帶著竹蜻蜓飛到天空裡了 此時\
  \ 哆啦A夢鼻子程式設定提醒任務完成要回22世紀\n   哆啦A夢 坐在河堤拿著照片 邊說著:\"大雄多麼令人不放心 又笨運動又差\n   怎麼會覺得好為難阿....\"\
  一直落淚說著 (也讓我大崩淚)\n   大雄從一開始的不能接受到後來和胖虎打架 靠自己的力量打贏胖虎\n   希望哆啦A夢能安心的回去未來 (也代表著大雄的成長)\n\
  \   哆啦A夢知道了  淚奔去抱傷痕累累的大雄 也是大哭點\n   之後回到大雄房間 欣慰的看著大雄入睡\n   天亮了 哆啦A夢也不在了  覺得很惆悵\n\n\
  \ 8.哆啦A夢的歸來-因為謊言800這個道具\n   愚人節那天被胖虎和小夫欺負 開了哆啦A夢回來的玩笑\n   大雄開心的打開存錢筒要去買銅鑼燒\n   之後發現被愚弄\
  \  大雄決定使用哆啦A夢留下的最後道具\n   先報復了小夫和胖虎  大雄失落的回到家\n   媽媽問:\"有看到哆啦A夢嗎?\" 大雄說:\"哆啦A夢再也不會回來了\"\
  \n   沒想到回到房間看到了哆啦A夢 才知道是用了這道具的關係\n   所以兩人開心的擁抱  大雄依舊說著反話\n\n 9.最後的動畫NG片段搭配主題曲  真的是讓人笑中帶淚啊\n\
  \   花絮真的好可愛 很特別^^\n\n此片真的感動我無數次   3D效果也很棒  尤其是竹蜻蜓飛翔時\n\n也喜歡他的標題\"獻給曾經是小孩的大人們\"\n\
  真的是如此  謝謝你\"哆啦A夢 STAND BY ME\"\n\n\n\n\n\n\n\n\n\n\n\n\n--"
