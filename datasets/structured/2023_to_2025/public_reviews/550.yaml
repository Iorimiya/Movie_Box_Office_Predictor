url: https://www.ptt.cc/bbs/movie/M.1425041905.A.959.html
title: '[好雷]stand by me 哆啦A夢'
content: "曾幾何時，哆啦A夢是多少人的童年回憶，而今，看了這劇場版，真是為之鼻酸。\n\n    想當初幼稚園的我，面對著種種挫折，總是哭喊著想要哆啦A夢來找我，或者是上小\n\
  學時，又想要哆啦A夢陪伴我，解決多少難題，直到國高中，才知道一切都是荒謬可笑，\n這些未來的道具，不可能發明，因為根本是神器，不是道具。近年來看了哆啦A夢，才開\n\
  始重拾藝術的觀點，細細品藏，回想為之狂熱執著的哆啦A夢。\n\n    電影雖不長，只有九十分鐘，在這裡看著，雖說是耳熟能詳的劇本，也是我們小時候\n看過無數次的片段拼湊起來的短篇，你知道蛋中的靜香第一眼看到的是出木杉，你知道大\n\
  雄長大後會去拯救在雪山受困的靜香，你知道大雄吃了令人討厭的藥，要擺脫靜香，結果\n靜香來救，你知道靜香在結婚前會突然後悔說出不想嫁了，你甚至知道哆啦A夢離開後會\n\
  回到大雄身邊，當你對每個劇本都瞭若指掌時，但是這部電影總是讓人感動你。\n\n    當大雄的軟弱與無能的時候，是否看到自己的顢頇？當大雄被欺侮的時候，是否看到\n\
  自己的無能？當大雄每當用哆啦A夢解決道具之後，看到的是自己的依賴心很重。回想我\n自己，是個非常缺乏獨立心的人，在大雄的身上，卻是看到我的影子，總是看到想要依賴\n\
  別人幫我解決問題的影子。即便是我文筆不差，我數學很強，那些都是大雄沒有的，但是\n宛如缺點的拼圖，卻是一點一滴的拼湊成我，顯現出我自己的全貌。\n\n    人，總是需要超越現實的東西，填補現實的空缺，哆啦A夢就是這麼棒的拼圖，拼湊\n\
  完成現實所缺乏的東西，幼年的我看的是夢想，成年的我看的是回想。為何鼻酸，如離別\n的故人，永不能相見的感受，而這篇哆啦A夢，則是拼湊起童年的回憶。\n\n  \
  \  人總是要獨當一面，如同我出社會，面對的是工作，接受的就是考驗，不再是學校庇\n護下，面對的是現實。如大雄也脫離哆啦A夢的依賴，開始自我要求，他看到的就是胖虎\n\
  的欺侮，面對的是畏懼，靠的是自我解決的能力。能轉變就是靠的自己的獨立心，擺脫哆\n啦A夢的依賴並自我獨立。\n\n    所以在這篇劇場版，真的勾勒出很多的回憶，令我魂牽夢縈，心有感觸，有所省思，\n\
  真的是一篇很棒的著作，雖然對故事的劇本如數家珍，倒背如流，卻也讓人細細品嘗，用\n心體會，強烈建議推薦給大家。\n\n--\n網誌文章(慎入)：\n學習，就要思考它的價值：\n\
  電競，是必要的嗎：\n鬥棋(小說)：\n殘局PK戰：\n\n--\n                                 02/27 20:59"
