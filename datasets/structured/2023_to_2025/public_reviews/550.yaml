url: https://www.ptt.cc/bbs/movie/M.1419694534.A.E20.html
title: '[好雷]Stand By Me 哆啦A夢'
content: '以下防雷防下以

  　　　　　　　　　　　　　雷

  　　　　　　　　　　　　　雷

  　　　　　　　　　　　　　雷

  　　　　　　　　　　　　　雷

  　　　　　　　　　　　　　雷

  　　　　　　　　　　　　　雷

  　　　　　　　　　　　　　雷

  　　　　　　　　　　　　　雷

  　　　　　　　　　　　　　雷

  　　　　　　　　　　　　　雷

  　　　　　　　　　　　　　雷

  　　　　　　　　　　　　　雷

  　　　　　　　　　　　　　雷

  　　　　　　　　　　　　　雷

  　　　　　　　　　　　　　雷

  　　　　　　　　　　　正文　開始


  　　總是有些東西是歷久彌新的，是每個一段時間聽到、見到、遇到，都會有股打從心裡

  油然而生的感動；遠在懂得李宗盛的滄桑、張雨生的輕狂之前，遙遠的懵懂無知，不知天

  高地厚的時候，屬於我們的，屬於自己的－哆啦A夢。


  　　有時候即使前方的景物、路途，令我們卻步，在可以遙望預知的未來，踏下前行的那

  一步時，總有些進退維谷，而直到我們終於走完這段路程回首時，最自豪的不是成就感、

  不是可以誇耀甚麼讓旁人無話可說，而是慶幸，慶幸自己曾經做下那個決定，而讓自己前

  行。


  　　即使是對於2D轉3D不適感，嘴裡不斷碎碎念著，即使是明知那個從小時後第一次看就

  哭得淚流滿面的劇情，仍然沒有閉上眼，在青年大雄說下，哆啦A夢是我們小時候的回憶，

  大雄你要好好珍惜他開始，眼睛跳過了模糊的階段，開始滴滴爬下臉龐，腦裡印著早已不

  知何處的小時漫畫，眼裡的畫面幕幕映上，與腦海裡的重疊，咬著嘴唇不敢哭出聲；然後

  在明知多拉A夢會回來的同時，笑著跟她們一起掉淚。


  　　那些不會長大的漫畫主角，永遠凝滯在某段時間中，陪伴著我們度過，那段時光裡的

  喜怒哀樂，而我們也總不會忘記，在無形中被影響而長大的我們，就像原著中，大雄的結

  婚前夜在河堤遇上了老師，為老師披上外套一般，變的成熟穩重，懂得體貼；那些我們曾

  經跨過的時光，歷歷反饋給我們的，都化成感動和淚水在我們回頭的時候。


  我不是大雄，這首詩獻給我們的哆啦A夢。




  --

  日子在遲到與忍耐中邁開

  被窩裡的世界我最大

  直到　藍色狸貓打開了抽屜


  還以為　世界從此成了我的被窩

  我用時光巾包圍著自己

  後面還準備了如果電話亭


  只是沒有過期的道具

  仍舊拯救不了　睡午覺的世界第一


  去吧　別跟我來　奮力關上任意門

  卻發現　沒有了狸貓　全世界像是過了保存期限


  我的手穿過了四次元口袋

  拉住　回到未來裡說　碰到就會消失的　自己


  為老師披上外套　我不再遲到

  為小草搭上支架　我拯救世界

  我不是走廊罰站的零分考券

  也不是默默打退外星人的英雄

  搭上時光機　每一個我

  只為了不讓幸福從手中消失


  口袋裡甚麼都有　就是沒有後悔藥

  我會讓你放心　讓你知道

  不用打架拳套　我也能打贏


  櫥櫃裡被單我會一直留著

  踢出每一隻老鼠

  冰箱裡永遠冰著銅鑼燒

  存下零用錢　讓你回來可以吃到飽

  每天的窗前　都有我們曾經的大冒險


  我乖乖的努力　在明知不願承認的未來

  即使是被騙　也甘之如飴

  那個你留下的娃娃　終於還是被我按下

  只是狠狠教訓之後的開心沒有人分享


  我說了幸福　卻在幸福之前迎來了悲傷

  我說了悲傷　卻在悲傷之後找到了幸福

  抽屜裡的無底洞

  哆啦A夢　你是我的哆啦A夢

  --


  歡迎光臨網誌版



  --'
