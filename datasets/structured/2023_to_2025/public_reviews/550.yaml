url: https://www.ptt.cc/bbs/movie/M.1421542289.A.6BB.html
title: '[好雷] 最單純的感動：Stand by Me 哆啦A夢'
content: '第一頁直接防雷


























  印象中不曾到電影院看過任何哆啦A夢的劇場版，


  但這一次，決定一定要去看。




  去年春假時在札幌車站看到十幾隻好可愛的哆啦A夢，


  旁邊有螢幕播放著＂Stand by Me＂的預告片，


  動畫製作的人物有點像又不是太像，


  倒是哆啦A夢變得圓滾滾，真的好可愛！


  海報上強調的真的很吸引人，


  於是就這樣在台灣等了好幾個月，


  直到期末考結束隔天立刻衝去電影院...




  ，


  這句話深深觸動我的心。


  什麼時候我們已經不再為了哆啦A夢守候在電視機前，


  開始懂了太多事、


  體驗了比卡通複雜千百倍的世界；


  以這樣的心態回頭再去看這部電影，


  就像是在跟過去的自己對話，


  感慨萬分。




  劇情從一無是處的大雄、哆啦A夢的初登場開始，


  百般不情願幫助大雄的哆啦A夢說著「絕對不可能不想回去未來」埋下伏筆，


  透過我們再熟悉不過的竹蜻蜓、任意門、記憶吐司等道具，


  鋪陳大雄和哆啦A夢愈來愈深厚的友情；


  後來大雄下定決心改變、


  哆啦A夢努力幫助他卻還是考了零分、


  善良的大雄決定放棄跟靜香結婚，卻意外靜香更喜歡他...


  大雄跟哆啦在屋頂上的對話這一段，


  是我第一次濕了眼眶；


  哆啦A夢為了大雄未來的改變而竊喜的樣子，


  是一種最單純的友誼，


  而大雄對著星空喊著


  則不禁讓人想到哆啦A夢設定的任務終將達成...




  雪山上未來的靜香說，


  「以前遇上這種事的時候，都是哆啦A夢來救我們呢...」


  「大雄在胡說些什麼，像個孩子一樣」


  對應一旁的大雄，還傻傻的以為自己的身分暴露了。


  這樣的情緒延伸到長大的大雄與小孩子大雄的對話，


  讓我第一次流下了眼淚；


  原本看起來幾乎和小大雄同一個德性的未來大雄，


  在小大雄問他要不要見見哆啦A夢的時候，


  遠遠看著在長椅上睡著的哆啦A夢，


  露出了若有所思的表情，


  然後從內心吐出一句異常成熟的話：





  此時的他，眼中泛著淚光，感慨萬千。




  這個和自己對話的橋段，


  更勝玩具總動員3最後安弟望著他的玩具，依依不捨的經典畫面。


  根本聽不懂靜香跟未來的自己在說甚麼的大雄，


  已經把哆啦A夢的存在視為理所當然，以為兩人一定可以一直一起生活下去。


  而在少了哆啦A夢的世界生活了十幾年的大雄，


  看著過去那單純的自己，


  不忍心告訴他，哆啦A夢終究是會離開你的喔...


  他只能對著眼前的孩子，說出自己心中最想說的話，


  更像是對自己心底的喊話；


  而那個離開他十幾年，如今睡在長椅上的哆啦A夢，


  根本是他不敢多看的吧。




  不明就裡的大雄跑去叫醒了哆啦A夢，


  興奮的告訴他發生了甚麼事，


  兩人高興的在公園裡手舞足蹈，


  最後躺倒在好綠好綠的草地上，


  好美的畫面，好單純的友情，


  任何人都想要有一個值得讓你全心全意為他感到快樂的朋友吧！


  劇情愈到後面，就愈讓人想到哆啦A夢即將回到未來，


  我又流下了眼淚。




  說到讓全場大哭的畫面，


  絕對就是兩人在河堤邊的場景吧！


  迫不及待想告訴哆啦A夢他有多幸福，高興的在空中飛翔的大雄，


  啟動了哆啦A夢設定的程式，


  看著大雄悠遊在空中的身影，


  哆啦A夢逞強的說著，


  太好了，終於可以回去了...


  口中還嘴硬的細數著大雄的缺點，


  可是明明來的時候還拚命想要溜回去的，


  怎麼真的到了回去的時候，卻好捨不得...




  說著「這一切沒有哆啦A夢就沒意義了」的大雄，


  在兩人離別的最後一晚，


  拚命要打敗胖虎，


  這時候的他心裡已經成長了，


  以前遇到什麼不如意的事，都可以請哆啦A夢幫忙解決，


  而現在哆啦A夢自己都沒辦法阻止自己離開，


  不能再任性了，既然留不住哆啦A夢，


  那麼說什麼都要讓哆啦A夢放心的走...


  離別之際，兩人情感的真摯，


  完全是抵擋不了的催淚彈啊！




  雖然大概知道結局會拉回happy ending，


  但還是無法控制的哭泣，


  這就是這部電影的魔力吧！


  從很多細節都可以看出這部作品真的是作給大人看的，


  裡頭有回憶、有歡笑、有淚水，


  最後安上了一個引起所有人共鳴的主題：。




  不管你愛不愛哭、有沒有考過零分或是每天被揍，


  我們都曾希望自己是幸運的大雄，


  經過了這許多年回到戲院，


  我們才發現，哆啦A夢永遠陪在我們身邊。




  謝謝你，哆啦A夢。


  --'
