url: https://www.ptt.cc/bbs/movie/M.1419218875.A.0B6.html
title: '[好雷]stand by me 哆啦a夢-我們小時候的好朋友'
content: "看了那麼久電影版，沒想到首po會是因為這部\n想到什麼打什麼，可能有雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n當時看到預告片，就覺得3D的哆啦A夢好可愛，\n雖然其他人物就怪怪的，但看久反而覺得該有的特色跟神韻都有抓到，很生動。\n到了後面幾個預告片出來我就決定要去看了，竟然是把我印象深的那幾個短篇拿出來演\n\
  \n雖然覺得中文配音比較有回憶，可是為了3D以及希望小朋友少一點所以還是看日語\n(高雄3D只有日語版)\n進了電影院整場果然沒幾個小朋友，幾乎都是20~30歲的年輕人。\n\
  大家都是來找小時候夢想中那個藍色機器貓的吧？\n\n從哆啦A夢(雖然我還是喜歡小叮噹，但藤子老師希望大家這麼叫他就這樣叫吧!)登場\n後每個道具一個一個拿出使用，看著每個道具用3D的效果呈現\n\
  有種懷念的新鮮感（原來用竹蜻蜓飛跟坐時光機就是這種感覺啊）\n3D後的哆拉A夢很可愛，而且效果太好很想摸摸看XD\n\n雖然劇情都是看過很多次的，這麼多年後用這種方式呈現，好像跟老朋友又見面了一樣。\n\
  當然還是有改就是了，像雪山後半原作是靜香帶大雄下山，\n還說要嫁給大雄是因為他太無法讓人放心XD\n這裡電影改成讓大雄發揮勇氣的表現，我覺得還不錯。\n改得最好的，也讓我特別感觸的，是成年大雄看著公園打瞌睡的哆啦A夢，\n\
  說出那句\n\n\n\n \"哆啦A夢是我...小時候的好朋友\"\n\n\n\n這句話，是說給自己聽的?\n因為他已經可以靠自己獨立，讓哆啦A夢放心?\n\n\
  是說給小大雄聽的?\n希望他好好珍惜跟哆啦A夢相處的時間?\n\n還是，說給我們聽的?\n滿場的觀眾們想必都走過那段每天看小叮噹拿出一個又一個神奇的道具\n走過一次又一次奇幻的長篇冒險。\n\
  \n\n他是我們小時候的好朋友。\n\n\n看到這裡我已經眼眶泛淚，在已知的劇情中，竟然來這麼一下。\n後半段除了跟胖虎的單挑從半夜變成遇到直接開打外幾乎忠於原作，\n\
  看到哆啦A夢照顧大雄到早上消失時，還是一陣惆悵;\n我知道他會回來，也知道一定這麼演。\n只是打開門看到那圓滾滾的藍色身影，我還是忍不住哭了。\n\n今年看了很多電影。\n\
  感人的、壯闊的、刺激的\n卻是這部讓我最有感受。\n看的是回憶、是曾經，是回不去的童年\n\n\n\n謹獻給曾經是小孩的大人們。\n\n--"
