title: '[好雷] Stand By Me 哆啦A夢'
content: '====防雷頁====


















  ====防雷頁====


  我從比大雄小，看到比大雄大

  哆啦A夢做為我的童年，一直很開心

  他是我的朋友、很多人的朋友


  小時候一下課就坐在電視機前

  跟著唱片頭曲，看著一樣一樣的道具出現

  也不知道幾十年後的現在，已經沒看卡通了

  竟然就忘記自己曾經很喜歡哆啦A夢

  就算是重播再重播也會準時打開電視


  開始經歷了一些孩童時代不會煩惱的事情

  都得學著自己解決

  看見大雄替人著想的樣子

  不帶給人困擾，希望愛的人幸福，所以願意放手


  看見哆啦A夢替大雄著想的樣子

  最好的朋友就是不斷的陪伴在身旁，加油打氣


  眼淚就滴啊滴的，一直滴一直滴


  成年大雄一句：不了，不用叫他過來了

  哆啦A夢是你，也是我童年時候的朋友

  要好好珍惜跟他相處的時光

  「如果你沒有時光機，

  就要好好珍惜與那些

  無法永遠陪伴你的人

  相處的時光，

  好好把握當下。」


  最後看到哆啦A夢要回去了

  大雄明明完全打不贏胖虎，卻為了讓最重視的朋友安心

  不斷的爬起來，即使全身都是傷

  他也要證明自己可以解決困難


  雖然每一幕早就知道了

  但是只有曾經有這段童年的人

  才知道這部電影為什麼會讓人很感動


  好久沒有哭這麼慘了


  致敬 藤子老師

  給我一段很棒的童年回憶


  提醒：

  如果你也從比大雄小看到比大雄大

  甚至已經出社會了

  準備好一大包衛生紙再進去電影院吧


  --'
