title: '[ 負雷]  代Po stand by me 哆啦a夢'
content: '以下是幫我女朋友代po


  （極認真）諸位好

  想與大家分享昨日至電影院觀賞的

  Stand by me哆啦A夢 負雷

  原因：

  整部戲的中間幾乎是在顯現出大雄與靜香之間的感情

  像大雄喝到討人厭水靜香不顧一切的去救她

  這段我相信有持續3分30秒以上

  而電影海報主角呢？已經跑出去了

  後面大雄與a夢到未來去救在暴風雪裡的靜香 劇中這段拍的是多麼刻苦銘心 持續的秒數

  也至少有6分鐘以上

  最後一直大喊記憶那邊也喊了三四次

  秒數更是增加了28秒左右

  而電影海報主角呢？還在椅子上睡覺

  一開始大雄在試飛竹蜻蜓的時候

  花了大概1分30秒左右在炫3D的場景

  那電影海報主角呢？在旁邊看

  大雄到未來世界時 因為驚奇也花了1分多鐘的時間在炫3D場景

  電影海報是哆啦A夢含淚 我完全沒見到大雄與靜香

  雖然我知道一開始的主旨就是要讓大雄與靜香結婚才算完成任務

  但這兩人的情感發展讓我覺得佔戲太多

  既然從最初的地方開始演

  那是否會有大雄與哆啦A夢剛開始認識的一些摩擦與點滴呢？

  看到最後只覺得總覺得大雄與多啦的關係

  就像女人與自慰棒解決需求

  但stand by me的意思比較像朋友之間的陪伴

  因為電影沒有花戲分去描述他們的友情與陪伴

  所以我完全不知道stand by me的用意到底是大雄與a夢還是大雄與靜香

  電影海報讓我以為會有很多a夢的戲分

  結果我看只有在最後幫A夢特寫說:如果我不在您可以一個人面對胖虎這些話

  只有這裡讓我覺得有比較多A夢的戲分而已

  就像泡麵的包裝上與實品不符一樣的心情

  文不對題且圖文不符並炫技到不行的電影

  以上


  --'
