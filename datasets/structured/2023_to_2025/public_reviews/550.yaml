title: '[贈票] STAND BY ME 哆啦A夢 歲末溫暖鉅獻'
content: "聖誕節剛過，想必很多人都有玩交換禮物的遊戲\n在2014年的最後一天，讓我們來玩點不一樣的吧！\n\n在今年的尾聲，有一群特別的小朋友來台舉行一連串的巡演\n\
  在SS小燕之夜中，稱讚他們年紀小小，卻才藝不凡\n在非洲從小學習中文佛經，學習台灣教育\n他們的故事，也在三立 -「消失的國界」中製成專題\n（消失的國界：）\n\
  \n他們，就是來自 非洲「馬拉威、賴索托、史瓦濟蘭」的黑寶貝們。\n\n黑寶貝們每年寒暑假舉行「行願非洲．感恩之旅」，\n到台灣、日本、香港、紐西蘭、澳洲及東南亞各國做慈善巡迴演出，\n\
  讓大家知道非洲還有無數孤兒等待救援。\n\n在黑寶貝們來台期間，又水整合設計很榮幸的可以招待黑寶貝們\n觀賞中文版《STAND BY ME 哆啦A夢》，彼此激盪文化交流\n\
  我們也歡迎網友們共襄盛舉，用一份簡單的小禮物\n溫暖黑寶貝們，也讓哆拉A夢陪伴你們跨過2014，\n我也們也招待著帶著小禮物的朋友們，一同同樂，觀賞電影。\n\n\
  =======================\n\n參與辦法：\n此活動為免費活動，但需攜帶一項代表台灣或與哆啦A夢相關有紀念性的禮物，\n作為黑寶貝們的見面禮。\n\
  我們會將你們的滿滿熱情，轉達給黑寶貝們喔！\n\n活動時間：2014 / 12 / 31 下午 13 : 40\n活動地點：西門町絕色影城 10樓 （台北市萬華區漢中街52號10樓）\n\
