url: https://www.ptt.cc/bbs/movie/M.1420128100.A.D09.html
title: '[好雷] 謝謝你：Stand By Me 哆啦A夢'
content: '===敬不二雄老師===

















  ===敬親愛的童年===




  不二雄老師，請容我此篇心得中繼續稱他，小叮噹。

  沒有什麼特別的原因，只是因為，跟大雄一樣的年紀相遇時，他就是我的小叮噹。


  非常喜歡這部的取名，Stand By Me。



  一開始在家看完預告時，我一直以為我一定會在電影院內哭得很慘很慘，

  進場前還跟朋友打趣地說，

  這部真應該每個人進場時都附贈一包印上小叮噹的面紙，不要為了紀念，而是給來用的。



  最後看完，其實也沒想像中會哭成黃河那麼誇張，雖然我還是有哭。XD




  來說說裡面，我最喜歡的片段吧。



  小叮噹坐在椅子打鼾，大雄問未來的大雄要不要去叫醒小叮噹，未來的大雄沉默了幾後，

  說了不用，大雄一臉不解。


  「他是我小時候最好的朋友」


  不是我最好的朋友，而是我"小時候"最好的朋友。

  這次電影第二次發出的提醒。



  讓我最先開始吸鼻子的片段。


  是小叮噹坐在河堤邊確認大雄已經幸福的時候，

  大雄帶著竹蜻蜓在天空樂得開心亂飛，

  小叮噹坐著一一數落著大雄的缺點，眼淚不受控制的下落。



  再來就是大雄知道小叮噹要回去了，

  小叮噹問他「就算我不在了，你也可以好好地照顧自己嗎？」



  大雄並沒有直接回答小叮噹的問題，而是轉身氣呼呼地走出了家。

  （看到這裡我超想撞破螢幕爆大雄的頭）

  小叮噹在家裡等了很久，最後跑出去尋找大雄的身影，發現大雄跟胖虎扭打成一團。


  「小叮噹，你放心吧。沒有你我也能好好地生活下去。」


  被打得鼻青臉腫的大雄一邊奮力拉扯著胖虎一邊聲嘶力竭地喊著，

  那時候的大雄並沒有看到小叮噹的臉，

  他只是平心地說出最想傳達給小叮噹的話──說出當著小叮噹的面說不出來的話。


  ↑嗯，到這裡就哭到一時停不了



  一直覺得這部如果是第一次看小叮噹的人來看，應該會覺得情感連接地有點快吧。

  不過再想了想，會來看這部的基本上應該都是已經有小叮噹基礎的人，

  所以這問題應該也算是沒問題吧。XD





  そばにいたいよ

  君のために出來ることが　僕にあるかな

  いつも君に　ずっと君に

  笑っていてほしくて


  推一下主題曲《ひまわりの約束》，歌詞超級棒！



  最後的最後，謝謝不二雄老師，謝謝您創造出小叮噹 Stand By Me.





  --'
