url: https://www.ptt.cc/bbs/movie/M.1419070988.A.5DB.html
title: '[好雷] Stand by me 哆啦A夢'
content: '童年時的機器貓小叮噹如今誰也沒想到會變成3D呈現在電影院中


  從小到大陪伴我們最久也印象最深的應該就是哆啦A夢了


  當然還有很多像是蠟筆小新、忍者哈特利這些日系動畫的角色也陪伴我們長大


  只是最喜歡的還是那個胖胖矮矮但卻比任何人都有感情的機器貓哆啦A夢


  Stand By Me這部動畫並非獨立製作的劇情而是從原本的漫畫裡挑選出來的合集


  厲害的是雖說是挑選出來的但卻沒有突兀的片段


  反而整體的劇情非常順暢


  從剛開始本來不願意幫助大雄得到幸福的哆啦A夢


  到最後認識且了解大雄的個性卻開始捨不得離開的哆啦A夢


  從一開始那個懦弱且不努力的大雄


  到最後勇敢把拳頭揮向胖虎的那個大雄


  整部電影把兩個人的友情和羈絆描寫的非常感人


  其實個人認為這部劇情的哭點不多


  除了大雄為了證明自己可以不再依靠哆啦A夢的道具而去找胖虎單挑那段


  這部真正會讓人鼻酸的應該是童年真的已經回不去了


  看著大雄對静香那種單純的感情


  在看看現在自己面對感情的態度


  看著大雄、小夫、胖虎他們三個雖然平常打打鬧鬧的


  可是他們三個的友情確是異常的堅定


  長大了雖然學到了不少東西


  但也丟了不少笑容也多了更多的遺憾


  這部電影真的不排斥跟小鬼頭們一起看


  想想已經多久沒在電影院聽到小鬼頭吵鬧的聲音和笑聲


  或許人終將長大


  但是當同年的回憶再一次出現在眼前時


  當下的自己應該跟那些小鬼頭一樣吧




  --


  人生就像常數的微分一樣 不管成就多大 微分之後都是零


  我對你的感情就像e^x一樣 不管怎麼微怎麼積 始終如一


  --'
