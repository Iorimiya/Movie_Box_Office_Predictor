url: https://www.ptt.cc/bbs/movie/M.1419181594.A.A46.html
title: '[好雷] Stand by me 哆啦A夢回憶在眼前了'
content: "首先感謝之前(好像有點久..)特映抽獎活動讓我有機會看了 Stand by me 哆啦A夢\n (3D 版)，之前一直好忙，抽空今天來分享一下心得~\n\
  \n之前在看預告時就覺得這 3D 的版本作得還蠻好看的，3D 模型及動態個人覺得都有作\n到各個角色的特色，蠻期待!\n\n進場前，才知道是 3D 版 (太開心了!)，一開場沒多久，我左右2邊都有人衝出去，說\n\
  眼鏡壞了，還說換了 15 副....\n\n以下有小小雷:\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n一開始哆啦A夢從抽屜裡跳出來後，並開了燈，這橋段覺得很棒，因為可以從一個暗暗\n\
  不太清楚的畫面然後點亮了我過去看著漫畫中大雄房間的場景，用 3D 立體的角度浮現\n在眼前!\n\n之後帶著竹青蜓穿梭那裡，覺得這段就是利用 3D 的優點啊，所以個人覺得這片可以\n\
  的話一定要看 3D 版!\n\n中間道具當然是最期待的，也鋪了一些好笑的梗，而且這個版本把道具加上了一些\n特效! 比如反轉時光布，上面的時鐘可是會動的，格列佛縮小隧道外觀可是有\n\
  特效光的，原來時光機裡的時光隧道是這樣呈現..等等，這些我覺得都是以往\n漫畫較難作到的。\n\n最後大雄在努力靠自已時，醞釀了許多情緖，在哆啦A夢離開大雄時，我強忍著，確實\n\
  真得蠻感動的~ 完全勾起了小時候看漫畫時的回憶! 大推!\n\n--"
