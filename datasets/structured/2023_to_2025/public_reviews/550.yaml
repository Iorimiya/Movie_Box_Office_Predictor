url: https://www.ptt.cc/bbs/movie/M.1612952702.A.1B6.html
title: '[好雷] STAND BY ME 哆啦A夢2'
content: '雷文防雷資訊頁









  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~









  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~


  本次故事主要是述說 長大後的大雄害怕結婚 與小時候大雄思念奶奶串聯起的故事


  故事開頭同樣以小故事 大雄的奶奶 篇作改編 利用時光機回去看奶奶一眼


  並為了達成奶奶的心願-想看大雄的老婆 所以又搭乘時光機到未來


  卻發現長大後的大雄逃婚了 (此篇改編為大雄結婚的那一夜 篇)


  經過一些時光及道具問題所造成的錯綜複雜事件 讓未來的大雄順利結婚


  而小時候的大雄也順利把奶奶帶到未來親眼看大雄的婚禮


  主要哭點在交換繩道具(這個試用品造成的瑕疵) 表達了哆啦A夢與大雄的友情


  另外大雄結婚時的致詞 講到家庭、親情、家人對他的展望、與靜香的婚禮儀式等


  深深觸動在電影院的所有人


  而整個內容 也有小小的提到STAND BY ME第一集的情形(但我覺得不影響)


  總而言之 這次的2  也算是很成功的一部作品 有笑 有淚 有親情 有友情


  非常適合去看的一部作品喔!


  --'
