url: https://www.ptt.cc/bbs/movie/M.1646448641.A.078.html
title: '[好雷] Stand by Me 哆啦A夢'
content: "Stand by Me 哆啦A夢/Stand by Me 哆啦A夢2\n\nNetflix動畫電影\n\n四十年前的雷\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n不管是叫小叮噹還是哆啦A夢，都是我們這一代人的回憶。\n\
  \n為了紀念『哆啦A夢』作者藤子·F·不二雄誕辰80週年所製作，於2014年上映的系\n列首部3D電影：『Stand by Me 哆啦A夢』，以及於2020年上映的第二部電影『Sta\n\
  nd by Me 哆啦A夢2』,讓我彷彿又回到那個只有盜版漫畫可以看的年代。\n\n第一部的故事融合了原作幾個篇章：『從未來之國千里迢迢而來』、『蛋中的靜香\n\
  』、『靜香！再見！』、『雪山上的浪漫史』、『大雄的結婚前夜』、『再見哆啦\nA夢』和『哆啦A夢回來了』，故事描述了哆啦A夢如何來到大雄家，然後就是利用\n各式各樣的道具來幫助大雄的故事，主要的故事線是聚焦在未來大雄與靜香結婚前\n\
  的事件上，最後哆啦A夢因為達成了任務回到了未來，卻又因為大雄喝下『謊言800\n』藥水，感嘆哆啦A夢不會再回來了，卻在藥水的作用下，哆啦A夢回來了，兩個人\n\
  互相擁抱。\n\n第二部的故事則是融合原作『大雄出生』、『懷念奶奶』以及『大雄的結婚前夜』\n，故事主要還是聚焦在結婚前夕，長大的大雄逃走了，現在的大雄的哆啦A夢要想\n\
  辦法把他找回來的故事。\n\n兩部作品的製作品質都是頂尖，不論是技術或是美術都達到了頂點，日式3D風格，\n雖然是充滿立體感的人物構型，卻是滿滿的日式可愛風格。色彩豐富又明亮的世界\n\
  ，每一個細節都令人讚嘆不已，大雄房間櫥櫃裡擺的箱子、電線杆上貼的廣告、路\n邊商店的招牌，你都可以閱讀上面的文字訊息，令人讚嘆，未來的東京更是乾淨、\n漂亮又高科技。人物演出完全重現出漫畫式誇張的風格，雖然搭配上3D人物有點違\n\
  和感，但是的確會令人感到：『沒錯，漫畫裡就是這樣的演出！』\n\n雖然基本上這兩部使用的篇章，我一看就已經知道劇情，但是第一部的故事真地寫\n得非常好，故事中的大雄在一件件的事情中成長，最後為了不讓哆啦A夢擔心，硬\n\
  是跟胖虎打架，要證明自己的勇敢，讓從沒看過哆啦A夢的小朋友都哭了，哆啦A夢\n離開後，又因為道具的作用而回來，令人用哭又笑的大團圓結局，令人滿意。\n\n但是第二部的劇情則有些令人不耐之處，主要是成年後的大雄完全沒有成長，過度\n\
  軟爛，跟靜香過於無條件的包容跟相信，實在是令人有點不耐，這個地方的劇情編\n排未免太一廂情願，而且劇情又有點拖沓、不合常理。但是『奶奶』線和『出生』\n線的劇情還算不錯，而且在不同時空交錯的劇情中呈現出漫畫中常用的手法，還算\n\
  可以接受。\n\n總體而言，兩部動畫都相當不錯，而且特別推薦第一部。\n\n\n\n\n--\n\n原來有多拉版，可以轉,沒問題\n\n           \
  \                        03/06 21:01"
