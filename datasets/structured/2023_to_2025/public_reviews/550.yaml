title: '[好雷] STAND BY ME 哆啦A夢'
content: "網頁好讀版：\n\n【先說結論】\n　　哆啦A夢史上第一部 3DCG 電影《STAND BY ME 哆啦A夢》，甫獲得「光點日本獎」的\n 3D\
  \ 立體動畫技術表現確實傑出，再加上導演山崎貴與八木龍一流暢地處理電影劇情，使\n得《STAND BY ME 哆啦A夢》流暢而不致突兀，感性而不致矯情，有趣而不致造作，成功\n\
  地成為本年度最讓哆啦A夢迷引頸期盼且值回票價的 3D 大作。\n\n\n　　《STAND BY ME 哆啦A夢》是紀念藤子.F.不二雄老師誕生 80 周年的大作，因此劇情\n\
  是由藤子老師原作的〈從未來之國千里迢迢而來〉、〈蛋中的靜香〉、〈靜香，再見〉、\n〈雪山的羅曼史〉、〈大雄的結婚前夜〉、〈再見，哆啦A夢〉與〈哆啦A夢回來了〉等經\n\
  典作品中節選出來的。乍看之下將這麼多短篇匯集起來會像盤大雜燴，但是《STAND BY\n ME 哆啦A夢》在劇情的精心刻畫下，流暢的以順敘法銜接各部短篇，在忠於原作的同時，\n\
  也基於劇情的順暢性而小幅修改各劇情的背景設定，這使得《STAND BY ME 哆啦A夢》不\n流於單元劇使人脫戲，有跌宕起伏、有情感宣洩、有細節補完，確實是一部集\
  \ 7 部短篇\n為一體、完成度高而自成一格的獨立作品。\n\n　　《STAND BY ME 哆啦A夢》的劇情感染力是多方面的。小朋友可能會對電影中設計的\n\
  有趣片段捧腹不已，就像胖虎竟然被「先入為主蛋」影響而愛上小夫；哆啦A夢不時的吐\n槽與鮮明表情；還有大雄有時過於天真的思考與作為。但這些有趣片段不是為搞笑而搞笑\n\
  ，不浮誇、不賣弄、不刻意做作，只是自然而然地傳達笑點，配合劇情效果點到即止，效\n果出色。藉由 3D 影像表現，讓哆啦A夢他們的表情與動作更動態化，搞笑的片段如果沒有\n\
  如此傑出的動畫功力，就沒辦法達到這麼好的效果。\n\n　　如果你是「曾經是小孩的大人們」，你可能會對劇情中多方面的安排深有體悟。看著\n大雄在哆啦A夢來到現代後的慢慢成長，也許會回憶起小時候的天真時光，也許會回憶起青\n\
  春時恣意追愛的浪漫年華，也許會體悟到「為他人著想、靠自己奮鬥」這番大雄關鍵性的\n成長。不過，或許你還會想起遠方的故人，想見卻難以再見的那個人──當成人後的大雄\n\
  望向在公園睡午覺的哆啦A夢，那多麼懷念的眼神無語凝噎；當未來已成人的大雄與靜香\n談論到哆啦A夢，稱呼他是「我們『小時候』的好朋友」──也許大雄他們與哆啦A夢是終\n\
  究難逃一別的嗎？人生中過客無數，小時候曾經的好朋友、好兄弟、好閨密，感情維繫\n到成年的又有多少呢？難道真的是「得到了甚麼，同時會失去些甚麼」嗎？「多情自古傷\n\
  離別」，我想，我們能做到的大概就是「落花風雨更傷春，不如憐取眼前人」了。\n\n　　《STAND BY ME 哆啦A夢》也很適合小倆口濃情蜜意的來觀賞，它確確實實是一部「\n\
  愛情片」。大雄從剛開始只是自私的想藉由道具的作用讓靜香愛上自己，進而體悟到「為\n他人著想」的愛情真諦，並且讓擔心不已的靜香為大雄而生氣發怒，大喊想著要遠離靜香\n\
  的大雄是「笨蛋、笨蛋、大笨蛋」，這不禁讓人想起《那些年，我們一起追的女孩》裡的\n沈佳宜──為了幼稚的男孩而生氣的女孩，難道不正是情意的自然流露嗎？沈佳宜沒有選\n\
  擇胖胖而成熟的阿和，靜香也沒有選擇成績優秀而運動萬能的出木杉，她們都選了讓人擔\n心不下、讓人牽掛不已的幼稚男孩。如果《那些年，我們一起追的女孩》是愛情片，那\n\
  麼《STAND BY ME 哆啦A夢》「愛情片」之名也當之無愧！\n\n　　由於精細的影像技術，使得大雄他們所居住的小鎮在《STAND BY ME 哆啦A夢》中能更\n\
  生動的表現出來。這次獲得「光點日本獎」的 3D 特效運用，可說已達到爐火純青的地步\n，景深差異十分明顯，像是球飛過來的場面或大雄戴著竹蜻蜓的主觀鏡頭，都讓人覺得好\n\
  像自己跟著大雄一起接球、一起翱翔，有十分出色的演出；而背景則是以迷你攝影方式\n（Miniature effect， 把實體做成等比例的迷你模型，然後利用近距攝影加上特效進行拍\n\
  攝），使電影畫面整體看起來更逼真、更溫暖。\n\n　　在光是角色造型就花費了 1 年以上時間製作的基礎上，角色們雖然從動畫立體成 3D\n 造型，但是並不會覺得不自然，運動流暢而更像真人，特別是哆啦A夢\
  \ 3D 化之後變得更\n為可愛！哆啦A夢的許多秘密道具也在電影中登場，3DCG 化後的秘密道具變得更像實物，\n彷彿我們真的進到了《哆啦A夢》的小鎮，從旁看著他們的生活與成長。另外，\n\
  《STAND BY ME 哆啦A夢》嘗試採用「前期配音」（Pre-scoring，先配音完成後再依照配\n音內容進行作畫）的方法，讓語音跟影像自然的融合，使電影動畫與聲音的配合毫無突兀\n\
  感。\n\n　　《STAND BY ME 哆啦A夢》的魅力，更在於細節的掌握。劇情細節方面，《STAND BY\nME 哆啦A夢》由於將 7 部短篇以順敘方式結合為一部完整的作品，因此劇情前後是有銜\n\
  接性的──作品沒有忘記出木杉的情感，作品沒有忘記要翻月曆紙，作品沒有忘記小珠（\n胖虎妹）改變命運後的未來；另外，《STAND BY ME 哆啦A夢》在捨棄部分原作情節的同\n\
  時，也沒有忘記增添原作缺乏的細部劇情發展，讓劇情更飽實──為什麼靜香被掀了裙子\n還肯去大雄家救大雄？為什麼大雄的未來可以成功被改變？另外，電影中主要角色以外的\n\
  細節也十分值得關注，車牌號碼、海報、書籍、日曆……處處藏著會讓哆啦A夢迷會心一笑\n的驚喜。特別是電影放映結束前的幕後人員名單，電影製作團隊更設計了一番巧思，這番\n\
  細節的講究也讓《STAND BY ME 哆啦A夢》值得一看再看、回味無窮！\n\n\n--"
