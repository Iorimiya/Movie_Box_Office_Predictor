url: https://www.ptt.cc/bbs/movie/M.1420966795.A.49C.html
title: '[大哭雷] Stand by Me 哆啦A夢'
content: "其實一開始就準備進電影院哭了。\n\n以下搭配音樂服用:\n\n本片主題曲-泰基博-向日葵的約定\n\n\n\n\n\n\n(雷雷雷 以下防雷\
  \  說到關鍵字 會被電喔!)\n\n\n\n-從來沒想過 會在電影院大哭。\n-從來沒想過 會進電影院看哆啦A夢。\n-從來沒想過 哆啦A夢有什麼好哭的。\n\
  \n各種從來沒想過 ...\n讓這部電影在2015年開春就讓我評為今年必看。\n(或是去年?!)\n\n其實本來一直很不想去看，\n直到昨天晚上，在電影版爬了幾篇雷，\n\
  又在書架上找到這本:\n\"哆啦A夢-道具大事典\"  \n看著小時後的自己在書裡的塗鴉...\n無知天真的圈選裡面的道具...\n要怎麼使用的小筆記...\n\
  \n才決定在下檔之前要衝一發!\n\n正如同之前去看\"哆啦A夢誕生前100年特展\"時的難以啟齒，\n總算找到了當初陪我去看展的友人陪我。\n\n\n真的，一定，要看3D的。\n\
  \n\n一直很喜歡電影預告片裡面的一句話:\n\n\"一直被視為理所當然存在的，沒想到竟然不能沒有、如此重要。\"\n\n其實今天早上去看電影之前，\n已經先看過\"\
  再會了 哆啦A夢\"動畫版先哭一次了 = =\"\n本來以為打了預防針進電影院會好一點，\n沒想到還是哭到脫水...\n\n\n應該是最後一周上映了吧!\n在台中新時代的場次排在最小間的3D影廳\n\
  全場不到5成的售票...\n認真覺得如果宣傳好一點這片一定可以紅的啊!\n\n\n因為大家都覺得太理所當然，沒必要進電影院看了吧我猜。\n\n\n故事內容可以說是\n\
  從頭到尾的把哆啦A夢的由來以及結束都說一遍，\n本來看預告覺得3DCG畫風有點醜，\n但看了才發現，3D的哆啦A夢好Q彈好可愛 >////<\n3D的靜香也超萌的啊...\n\
  \n裡面很多橋段其實小時候看的卡通都還有印象\n(筆者為80年次)\n\n先入為主蛋\n格列佛隧道\n雪山遇難記\n大雄結婚前夜\n愛咬人的狗\nalways的0分考卷\n\
  惹人厭藥錠等\n\n導演利用這些道具，\n一點一點的幫觀眾回憶童年。\n\n\n\n\n可能因為看日語版的，\n並沒有幾個小孩在場，\n都是女朋友硬拉著男朋友來看的感覺。\n\
  比較特別的是，我有注意到旁邊有對中年夫妻也來看了。\n太太中場後也開始啜泣...\n\n我的話...\n大概從大雄與哆啦A夢到未來世界偷看婚禮那邊就開始哭了吧QQ\n\
  哆啦A夢在公園午睡那邊，\n14年後的大雄跟小大雄說的，\n超級催淚啊...\n靜香跟爸爸的告白，也是本片哭點之一QQ\n這應該是我看過哭點最低又最多的一部片子...\n\
  第一次在電影院有一半的時間在哭 = =\n不得不說 戴著3D眼鏡 擦眼淚好麻煩...\n\n之後全場的啜泣聲此起彼落，\n特別是哆啦A夢要回去以前，\n在河堤前跟得意忘形的大雄的那段告白:\n\
  眼淚完全停不下來啊...\n\n\n\"雖然你總是不可靠\n雖然你總是得意忘形\n雖然你總是...\"\n\n就像是一個認識了好久好久的朋友，\n細數著屬於彼此的共同回憶。\n\
  \n不過其實我覺得，\n哆啦A夢回去的那個早晨，\n應該多一些表現大雄的落寞才對。\n(原著漫畫裡面好像其實有\n大雄一直對著抽屜講話，對著壁櫥發呆等)\n電影裡面直接跳愚人節有點哭得不過癮!!!\n\
  如果片長能在長一點該有多好啊!\n\n日本動畫技術真的很厲害~\n未來世界竹蜻蜓飛翔的畫面令人驚艷\n(22世紀真的會變成這樣嗎?!\npanasonic跟toyota那時候還在嗎?\
  \ XD)\n\n\n整場3D看下來完全不會頭暈或是不舒服，\n畫面的精緻度更是一絕。\n連哆啦A夢鈴鐺上的反射都看得一清二楚!!!\n不愧是日本的作品，連小細節都注意到了。\n\
  \n最後，我想應該是最後一週上映了吧~\n\n如果，你的童年，也有著那圓滾滾的藍色身軀陪伴。\n相信我，你真的應該走一趟電影院...\n\n重新遇見那個...\n\
  每天想著如果有任意門該有多好的自己~\n重新遇見那個...\n天真無邪浪漫稚氣的自己~\n重新找回那個...\n已經快不認識的自己~\n\n\n最後，謝謝你，哆啦A夢。\n\
  一路走來，有你真好。\n\n\n這部電影，如同導演說的:\n\n\n謹獻給曾是小孩的大人們。\n\n\n\n\n敬那個，曾經是小孩的自己。\n\n\n--\n\
  \   ║    01/11 17:09"
