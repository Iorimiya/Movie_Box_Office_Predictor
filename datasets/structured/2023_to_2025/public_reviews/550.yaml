url: https://www.ptt.cc/bbs/movie/M.1628436568.A.CD9.html
title: '[好雷] STAND BY ME 哆啦A夢2,2020,日本'
content: '雷文防雷資訊頁


  收看平台~

  中華電信MOD電影199,

  2021.8.6.上架影片:


  大推！


  STAND BY ME 哆啦A夢2 Stand by Me Doraemon 2(2020日本電影動畫STAND BY ME ドラえ

  もん 2)




  《STAND BY ME 哆啦A夢》續集，也是哆啦A夢50周年紀念作。這次的故事主軸放在大雄回

  到過去和奶奶見面時，奶奶想見到大雄的妻子的願望。一個連接「過去」、「現在」與「

  未來」的故事就此展開……。


  劇情簡介:


  《STAND BY ME 哆啦A夢》續集，也是哆啦A夢50周年紀念作。這次的故事主軸放在大雄回

  到過去和奶奶見面時，奶奶想見到大雄的妻子的願望。


  故事接續前作，某日突然想起幼稚園時過世的奶奶而傷心不已的大雄，在與哆啦A夢達成

  約定後，搭乘時光機回到過去，只為了偷偷再見奶奶一面，沒想到卻意外被奶奶發現了。


  奶奶雖然對於以小學生模樣現身的大雄感到訝異，但依然溫柔地對待他。就在奶奶「希望

  見到大雄老婆」的願望下，一個連接「過去」、「現在」與「未來」的故事就此展開……

  。



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  82%E3%82%93_2

  …………………………………………………………


  非常好看！非常感動！              ☺

  以為已經對這種老梗故事免疫而不會落淚，結果仍然令我淚光閃閃。


  雖然小時候看過漫畫，已經知道這片的大部份故事情節，但是這片仍有一些没看過的橋段

  ，感覺就是舊瓶裝新酒的感覺，有點新鮮。


  看到大雄的奶奶慈祥的模樣、靜香從小到大對大雄的温柔和信任、Doraemon和大雄從小到

  大的累積的點點滴滴的回憶、技安和阿福的友情、大雄爸媽對大雄的期許……已經耳熟能

  詳，這影片怎麼還是那麼令我感動落淚？感覺這片好棒，一些畫面、對白、情節都把我們

  人生嚮往美好的地方，都勾勒出來了。加上這片對於未來世界都市場景的描繪，呈現出美

  妙舒適的感覺，正能量滿滿。大雄最後的婚禮致詞内容，文情並茂，大讚！


  大雄為什麼叫大雄？野比Nobi太為什麼叫Nobi太？在這片得到解答。

  大雄幫助奶奶完成什麼心願？

  這片有哪些橋段令人動容？

  這片亮點多多，我看得感動又開心。


  看到一線演員在本片:

  妻夫木聰變成大雄成年版的代言人了，呵呵，廣告、這部片的配音，很到位。

  奶奶的配音是宮本信子資深演技派女星。片尾曲是菅田將暉唱的，詞曲都饒富興味。


  那麼令我自然落淚又開心的動畫，當然是大推！！！

  若你沒有如此感受，單純看本片的可愛情節及感人台詞，也是很值得的。☺  ☺  ☺


  這片我看到最後，到畫面呈現日文的劇終字樣，最後的畫面之二幅圖案，是本片故事二大

  主軸，我很喜歡！


  STAND BY ME 哆啦A夢2

  Stand by Me Doraemon 2

  STAND BY ME ドラえもん 2


  --


  感謝樓上所有人的留言。對這片的喜歡、無感或討厭，都是自己的心所造！


