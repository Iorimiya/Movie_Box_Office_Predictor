title: '[請益] stand by me 哆啦A夢未來的問題'
content: '(有雷)



  剛剛終於看了一片哭雷的本片，

  真的好感動....


  而在看之前，

  老婆說她不小心被網路上的討論雷過，

  說哭雷的原因是....




  哆啦a夢還是大雄會死掉！！




  在大雄跟哆啦a夢去看結婚典禮時，

  居然是到前一天，而不是當天，

  而且大雄去參加單身派對時，

  小大雄還說了一句：怎麼感覺氣氛乖怪怪的，

  我們一致以為大雄是因為活不到隔天結婚，

  所以才會是只到結婚前一天而已...

  (後來想想，如果是這樣也不可能有靜香打小孩屁屁那張照片了)


  所以想請問的是，為什麼他們是要去結婚典禮那天，怎麼會是跑到前一天了？


  --

  Sent from my Android


  --'
