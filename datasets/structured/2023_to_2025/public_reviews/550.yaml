url: https://www.ptt.cc/bbs/movie/M.1420636778.A.DF5.html
title: '[好雷] Stand By Me 哆啦A夢'
content: '=====================防雷========================











  看著電影，是什麼時候開始想哭的呢?


  大概是成年後的大雄一邊望著遠方在公園的椅子上打盹的哆啦A夢，

  一邊告訴小時候的大雄要他好好珍惜跟哆啦A夢相處的時光那時候開始的吧?


  我總覺得成年後的大雄不單只是在跟小時候的大雄說話，

  同時也是告訴我要珍惜童年的歡樂時光，

  只是我悲哀的發現，驀然回首自己已經離童年好遠了。


  小時候總是吃著晚餐配著那時候還叫小叮噹的卡通下飯，

  昂昂昂~とっても大好き、ドラえもん

  明明一點日語也不會卻總愛跟著旋律哼著。

  那時候如果能夠拿到一點零用錢，

  就會衝到家裡附近的雜貨店買一本當時只要幾十塊錢的小叮噹漫畫，

  讀著那小小一本薄薄的漫畫，讓小時候的我覺得很滿足好快樂，

  而現在的我的快樂卻再也不能用一本漫畫書來填滿了。



  電影裡其實只是集結了幾個熟悉的短篇而成，

  大雄還是一樣上學總是遲到，考試老是考零分，

  常常被胖虎還有小夫欺負，對靜香的愛從來沒有減少，

  遇到困難的時候就只會哭著大喊哆啦A夢跑回家求救。



  小時候對這樣的大雄沒有特別的想法，

  長大之後卻開始覺得這樣子的大雄非常討厭，

  非常受不了一無是處的笨大雄凡事只想依賴哆啦A夢的道具幫忙解決問題的樣子。

  受眾人喜愛的靜香竟然長大之後還要嫁給他，真的是非常莫名其妙。



  但是電影卻彷彿要解了我這樣的疑惑似的，

  安排了一段在結婚前夜靜香跟爸爸的對話。

  靜香的爸爸告訴靜香，選擇大雄是個正確的決定，

  因為大雄是一個能夠為他人的幸福祈禱，也能替他人的悲傷難過的善良的人。



  當單純的大雄告訴哆啦A夢他很幸福的時候，

  也是哆啦A夢必須回去未來的時候，

  哆啦A夢在地面上看著在天空開心的飛來飛去的大雄不知如何是好。

  哆啦A夢最終還是告訴大雄他就要離開了，

  大雄雖然一開始還是很小孩子氣的負氣離開，

  但最後卻是勇敢的跟胖虎決鬥，因為他要讓哆啦A夢安心的離開。

  眼淚就再也停不下來了。


  全世界最愛哆啦A夢的就是大雄了。


  哆啦A夢默默的離開之後，

  大雄沒有像以前一樣大哭大鬧反而是成長了許多，

  在愚人節被騙哆啦A夢回來了，

  還拿出所有零用錢打算買銅鑼燒跟哆啦A夢分享。

  大雄很幸運能夠擁有哆啦A夢這麼照顧他，

  而哆啦A夢也很幸運能夠遇到一個單純只用真心對待他的大雄。

  還好電影最後安排了一個轉折，讓哆啦A夢可以回來繼續陪著大雄長大。


  全世界最幸福的小孩就是大雄了。


  他曾經失去哆啦A夢但最終哆啦A夢還是回來了。

  從某個角度來說我的生活裡也曾經擁有哆啦A夢，

  雖然現實中自己無法擁有任何一個哆啦A夢的道具，

  但哆啦A夢總是在那裡伴著自己長大的。

  可是當年紀漸漸增長後，

  我發現哆啦A夢不知道什麼時候已經離開我身邊，

  我不再是那個若能夠擁有一本小叮噹漫畫就開心不已的小女孩。

  其實哆啦A夢還在一樣的地方幫助大雄度過所有難關，

  只是關注他的換成了另外一群孩子，而不再是幼時的自己了。


  我喜歡這部電影，它提醒了我哆啦A夢曾經在我的生活中劃下的痕跡，

  回憶或許會隨著時光緩緩淡去，

  但只要那個旋律響起，

  我就會記起有這樣一段跟哆啦A夢一起度過的童年時光。


  昂昂昂~とっても大好き、ドラえもん。









  --'
