url: https://www.ptt.cc/bbs/movie/M.1701415378.A.202.html
title: '[普雷] 轉生幻夢'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  你相信人有來生嗎？如果你相信的話，又可曾想過這一生與下一世之間是怎麼流轉的呢？

  西班牙導演拍攝的《轉生幻夢》，帶給觀眾奇異的觀影體驗，奪得柏林影展「邂逅」單元

  的評審團特別獎，也入選台北電影節、桃園電影節的「趣──魔幻嘉年華」單元與世界民

  族電影節，是非常特別的一部作品。



  年輕人阿米德正在照顧一位即將離世的老婦阿夢，他隨身帶著〈西藏度亡經〉，為她朗讀

  典籍中生死奧祕，隨時幫助她順利輪迴轉世。



  年輕的西班牙導演路易斯‧帕提諾也是一位視覺藝術家，所以片中角色入夢的時候，畫面

  便以極為魔幻的方式互相疊加，給予觀眾一種如夢似幻的感覺。不論是小沙彌、阿米德還

  是阿夢熟睡的時候，他們的夢境裡都充滿導演利用不同媒材所創作的畫面。拼貼馬賽克、

  實景影像或彩繪玻璃，帶著夢中人與觀眾的意識一起徜徉在夢境之中。就像是莊周夢蝶，

  究竟他是變成莊子的蝴蝶，還是變成蝴蝶的莊子呢？夢裡什麼都有，但人是否能夠明確區

  分虛幻與真實，好比我們在觀看《轉生幻夢》時，夢境與現實的界線漸漸模糊，誰也分不

  清此刻銀幕上的畫面是人物的夢境還是現實。



  電影與故事本身並不引人入勝，但整體來說卻是相當特別的「體驗」。沒錯，這麼形容《

  轉生幻夢》這部作品十分適切。電影開始之前，我們就知道阿米德與〈西藏度亡經〉的準

  備是為了迎接阿夢的死亡，但當阿夢真的嚥下最後一口氣，畫面卻告訴觀眾「請閉上眼睛

  ，我們即將踏上一段奇異的旅程。」於是，我們就這樣跟著阿夢一起踏上15分鐘的「轉生

  之旅」。閉上眼睛之後，其他的感官自然敏銳起來，耳邊的蟲鳴鳥叫與潺潺水聲讓我們想

  像阿夢正穿越一片原始的叢林，忽而又有火車行進的聲音，可能這是一班前往下一生的列

  車，下一秒又有快速移動的聲響，搭配緊閉的眼皮前閃爍著的亮光，彷彿我們正在一座時

  光隧道內穿梭。



  《轉生幻夢》的步調很慢，但在這關閉視覺的15分鐘裡，時間快速流逝，等到睜眼的那一

  刻到來，才驚覺，原來我們剛剛經歷這麼久的旅途。正如人生一般，一天天漫無目的地過

  ，時間好像過得很慢、很漫長，但當我們專注當下，認真用心地品味每一天，驀然回首，

  一年又過去。



  不是每個宗教都認為人有來生，基督信仰認為人死後或上天堂與耶穌同住，或進入永死；

  佛教、道教與印度教等東方信仰有輪迴的概念；泛神信仰或無神論者或許會認為人將投胎

  為人，但不會轉入他道，成為動物或其他一切眾生。主角阿米德為阿夢閱讀的〈西藏度亡

  經〉明顯是西藏典籍，猜想可能源於藏傳佛教，而故事背景設定在寮國，片中的沙彌自然

  是寮國佛教，屬於萬物有靈信仰。雖說電影沒有解釋阿夢的信仰為何，但從阿米德閱讀西

  藏典籍，以及阿夢與自己的家具一一道別來看，不難想像《轉生幻夢》揉合各種宗教。



  電影也沒有直說最後坦尚尼亞小女孩飼養的小山羊是否就是阿夢的轉生，或許是也可能不

  是。阿夢生前也感嘆，其實成為動物沒有不好，只是人類對待動物太差，而新生的小山羊

  飽受小女孩的疼愛，也是另一種幸福。雖然牠最後與小女孩走散，但電影至少沒有讓牠遭

  遇危險，牠也找到安身立命的山洞，而小女孩也下定決心要找到牠，未完的故事未必不是

  美好的結局。不論兩者之間是否有關係，《轉生幻夢》裡的兩段故事只是要告訴我們，一

  段生命的殞落固然使人悲傷，但在世界的另一個角落，或許有個新生命正要開始。生生不

  息，才是世上最奇妙的體驗。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
