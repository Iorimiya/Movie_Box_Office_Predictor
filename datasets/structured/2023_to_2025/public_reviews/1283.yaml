url: https://www.ptt.cc/bbs/movie/M.1699785749.A.6B0.html
title: '[新聞] 奇片揭密〈西藏度亡經〉《轉生幻夢》引領'
content: '新聞網址：


  奇片揭密<西藏度亡經> 《轉生幻夢》引領觀眾「往生」


  2023-11-12 14:29 中時新聞網 李承陽


  電影《轉生幻夢》描述1名寮國青年，以〈西藏度亡經〉幫助臨終老婦轉世投胎，該片今

  年在柏林影展首映便引發轟動，並勇奪「邂逅」評審團特別獎。電影導演路易斯帕提諾自

  泰國大師阿比查邦作品汲取靈感，發展出令人驚艷的影像敘事風格。


  令人驚奇的是，該片會在觀影中直接引領觀眾「往生」，是一場必須在戲院才有的體驗，

  這部被影媒奉為「今年最令人驚艷著迷的觀影體驗」的電影，藉由1本解開生死之謎的〈

  西藏度亡經〉，闡述人離世後，將處於中陰階段（轉世之間的閾限狀態）49天，等待開始

  下一期生命。


  電影被形容「在觀影中做夢，在觀影中冥想，在觀影中死亡，最後在觀影中轉世」，全片

  對生命有著驚人的探索，並不靠VR就能身歷輪迴，無法藉由閱讀或書寫理解，絕對必須親

  自體驗，並且最好在沒有先驗知識和帶著開放的心態來進行體驗。


  電影放映時，觀眾在觀影中將會被邀請閉上雙眼，讓五感自然開啟，置身於滿溢光影和聲

  音的感官通道中長達15分鐘，成為近年最令人著迷的觀影體驗。並藉由聲光流轉，串接起

  兩大洲－亞洲寮國和非洲坦尚尼亞，兩個族群、兩種信仰和兩種截然不同的生命體驗，彷

  彿能望見森林深處斑駁的陽光，看見天堂般的壯麗景象。電影12月1日在台上映。


  --'
