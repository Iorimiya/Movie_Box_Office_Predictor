title: '[普雷] 四平八穩的邪惡勿語'
content: '想知道X教授創立X學院時籌措資金的方式

  （欸不是…錯棚）




  我是詹姆斯麥艾維的粉絲

  他在分裂給的壓迫感我到現在還有印象

  在邪惡物語裡倒是收斂了不少

  這個角色（小派）算正常，沒有到很phycho


  劇情開頭講述小派一家搜尋獵物的方式

  小派一家透過參加某種旅行團認識富人家庭

  老婆席亞拉跟兒子安特都是受他控制的工具人

  把目標家庭拐到位於鄉下的宅邸後殺人取財

  這次的目標是Ben一家


  前面大概一個小時鋪陳真的很拖、而且沒重點

  然後Ben的女兒很魯洨（最後有洗白


  老婆路易絲算蠻典型討人厭的白人女個性

  可是在雙方對決的時候智商在


  Ben很怯弱（被戴綠帽還要幫對方開脫

  但也有做了一個責任來我就扛的決定


  但由於已經知道是一部驚悚片素材

  就一直在等哪時候才要開始進入重點

  等到有點不耐煩

  直到小派反常行為出現才有：電影終於開始了～的感覺


  兩邊都不演了開始對決之後，劇情就推的很快

  沒有很不必要的反轉，或是低端操作

  雙方亮牌前後劇情的比例應該要稍微調整

  或是把前面鋪陳的段落設計多一些亮點


  整體懸疑氛圍有但不多

  沒有突然嚇人的鏡頭

  重口味的人應該會覺得這部偏普通

  但心臟沒那麼大顆的人應該覺得不錯




  --

  我是覺得還行啦 畢竟剛歷經生死存亡關頭很緊張'
