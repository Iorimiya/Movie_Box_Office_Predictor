title: '[普雷] 邪惡勿語'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  老實說整片沒有什麼嚇人的點 就是


  尷尬 詭異 懸疑 這三種情緒在製造氣氛


  詹姆士麥艾維的演技還是很不錯


  而且這部片裡面也太壯了吧 比在分裂裡面的野獸還壯非常多


  是在那之後就愛上健身了是嗎


  客人媽媽演技有點浮誇 不過劇情內超猛 男的整個很廢




  劇情前半看風景跟寫實的夫妻生活


  後半從小男孩給客人爸爸看舌頭那時候


  就大概猜得到走向


  從最後翻臉之後拍的有點零碎 結局也很普


  也沒有太多巧妙的梗


  整體來說就是平實的一部劇吧



  若真的要我講出其他亮點 我覺得兩個小朋友演技都不錯


  然後我一直期待會有特斯拉沒電的梗 竟然沒有XD


  --'
