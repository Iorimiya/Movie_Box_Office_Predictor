content: '這是一部心理驚悚片


  全程沒有鬼出來嚇人


  就連jump scare也很少


  但讓人家一直覺得很不安跟緊張


  壓迫感非常的強


  有人說前面鋪陳冗長


  我覺得不會而且蠻重要蠻好看的


  即便是交代背景也很好懂，順順就看過去了


  裡面還有一些關於恐慌症之類的小知識


  要怎麼樣在恐慌狀態下拿出勇氣也是一大看點


  是一部非常棒的娛樂片


  看完電影出來還心有餘悸


  評分8.6/10


  -----

  Sent from JPTT on my Google Pixel 6a.


  --'
