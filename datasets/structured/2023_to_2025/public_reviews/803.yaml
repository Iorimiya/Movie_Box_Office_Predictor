url: https://www.ptt.cc/bbs/movie/M.1727028140.A.EAD.html
title: '[好雷] 邪惡勿語-大推丹麥版'
content: '先是看了美版，然後看丹麥原版。


  很喜歡這種電影對於人際關係的描述，人與人的拉扯完全考驗劇本對於生活觀察是否到位

  。


  看完美國版時，其實還不錯，但是也僅限於不錯，很標準化地處理成大眾商業片。


  詹姆斯麥艾維的表演方式讓我聯想到超難搞先生的湯姆漢克斯，嗚，就是演技再好我依然

  知


  美國版的結尾緊湊的部分反而讓我失去耐性，但是在沒有比較之前還算享受這部作品。


  以下有不認真比較雷


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  原版真的神。


  當我看見推文說原版強時，我心想，哼，不過是先入為主吧！隨即知道我錯了，原版真的

  很


  他的好不在於故事結尾，而是描述的方式。


  他不用一直讓父親對女兒失控，去展現對女兒的不耐煩，不用讓女兒一直吵鬧，搞得像重

  度


  不用讓媽媽私下不斷抱怨屋子有多破，不用吃一口還吐掉去告訴你：你看！這媽媽忍受到

  極


  原版描述生活的方式很細膩，人物很真實，恐懼逼近的方式讓你無法拒絕，因為太真實所

  以


  美版描述了一位懦弱父親保護家人的勇氣。


  原版，講述一位厭惡家庭的父親有多絕望。


  我真的是很喜歡，父親一開始提旅遊被拒，卻在友人來訪時故意提及這件事，讓老婆不得

  不


  真的是好愛這部電影。



  -----

  Sent from JPTT on my iPhone


  --


  蛤？

  原版很真實好嗎...

  兇手的憤怒與異常逼近都不至於讓你要立刻逃

  手段也很心機（把汽車油抽掉，而不是直接割破輪胎）

  父親看見屍體立刻帶老婆小孩逃命

  逃難時驚慌 還來不及跟老婆小孩解釋

  老婆只覺得是車子壞了跟兇手求救

  老公回來時 老婆小孩已經在兇手車上


  他反擊直接被爆頭

  女兒被割舌頭綁走當人質

  前面也鋪陳他們停車的地方有多麼一望無際.


  不要用自己的勇氣去揣度他人吧？

  他們唯一的錯是用自己的人性是揣讀他人不會邪惡至此'
