title: '[好雷] 《壞小孩契約》光芒漸逝的黃金少年'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  《壞小孩契約》(ゴールド・ボーイ)是《隱密的角落》精煉過後、更具娛樂性的版本。

  .

  同樣改編自原著小說《壞小孩》，中劇《隱密的角落》有著更長的篇幅可以細膩地描述每

  個人物的心境與轉變，它更像是透過一場曲折的案件，對中國的社會現象做出一個沉痛的

  控訴，比起這群小孩做了什麼壞事，它更關心的是為何他們會成為壞小孩，甚至試著用更

  宏觀的角度去解構《壞小孩》這個書名，它真正想探討的其實是為何這群其實天性善良的

  好孩子，會被這個社會貼上「壞小孩」的標籤。

  .

  相較之下，片長僅有兩個小時的日影版《壞小孩契約》，可以說是精煉再精煉、濃縮再濃

  縮的高娛樂性版本：它捨棄了底層人物的掙扎、人文社會的關懷、以及人物複雜的心靈。

  我們可以說，它與《隱密的角落》有著一樣的故事設定，但卻選擇了一個截然不同的角度

  切入敘事，如果說《隱密的角落》是場漫長而苦澀的長途跋涉，那《壞小孩契約》則彷彿

  是坐上了一輛高速行駛的雲霄飛車，它並沒有要你一路慢慢欣賞美景，而是要你盡情享受

  俯衝時的刺激與快感。

  .

  我是說，影集花了將近一小時、一整集才演到的進度，這部電影的開頭僅用了五分鐘不到

  就演完了，看到這樣的改編，你就知道《壞小孩契約》相較於影集的節奏有多麼快速，而

  兩者之間最明顯的差異，也是如此簡單暴力：比起《隱密的角落》努力想要讓觀眾了解劇

  中的人們為何為惡，《壞小孩契約》則將一切簡化成了這群人是天生邪惡，如此一來你便

  不必對劇中的角色投以太多同情與心酸，你只需要好好欣賞這場邪惡VS邪惡的對決就好。

  .

  這樣的改編，正是導演金子修介的拿手好戲，我對日影研究不深，他是我少數能叫得出名

  字的日本導演，對我這個怪獸迷來說，他光是拍過平成《加美拉》三部曲以及《哥吉拉‧

  摩斯拉‧王者基多拉 大怪獸總攻擊》就足以在我心目中封神。最知名的《死亡筆記本》

  則

  是日漫改編的典範級作品：不只敘事流暢，甚至大膽改編了原著的結局，同時讓故事在不

  偏離原著核心的前提下乾淨俐落地收尾，甚至對許多人來說，電影做出的改編是比原著還

  更好的結局

  .

  那麼交到了金子修介手上的《壞小孩契約》，究竟講了一個什麼樣的故事？有趣的是，《

  壞小孩》這本留著純正中國血脈的小說，改編成了日本在地的故事卻絲毫沒有水土不服。

  有著獨特少年法的日本社會，他們同樣沉迷於創作如《告白》這種關於青少年犯罪議題的

  電影，《壞小孩》反倒成了改編成日本電影的絕佳題材。

  .

  這故事最有意思的部份是，以往許多關於青少年犯罪的故事，那種隱藏在純真之下的邪惡

  會令觀眾感到害怕與不安，當受害者是無辜者時，則更會造成對觀眾心靈上的折磨。但如

  果今天被壞孩子盯上的對象，是個同樣邪惡的大人呢？這種兩個惡人鬥智的劇情設定，可

  以說成功為觀眾建立起了一個安全距離，當這兩個人都不是好東西時，我們就大可安心地

  看他們相互廝殺，不管誰輸誰贏，我們都會鼓掌叫好。《壞小孩契約》最大的娛樂性來源

  ，正是來自這樣有些背德的快感。

  .

  在《隱密的角落》中，這群人其實並沒有長遠的算計與心機，許多時候他們是走一步算一

  步，但整件事卻如滾雪球般往最糟糕的方向不斷失控，但《壞小孩契約》中的壞大人與壞

  小人兩人卻都同樣工於心計。在前者的故事中，他們更像是被命運的巨輪強迫推著前進，

  而後者卻是一場真正的棋盤對弈。

  .

  金子修介選擇將故事的重點聚焦在兩人的鬥智之上，這是一場贏家通吃的零和賽局，只要

  雙方有人成功將軍，另一人幾乎可以說是死路一條。兩人這樣緊咬著對方不放、不斷試圖

  利用對方的佈局去超越對方，這樣層層翻轉、不看到最後難以猜到結局的劇情，對於喜愛

  懸疑驚悚電影的觀眾來說，絕對是過癮極了。

  .

  電影在演技上最大的亮點，當屬岡田將生卯足全力演出一個斯文敗類，那邪魅的眼神與狂

  放的大笑，再搭配他的盛世美顏，倒有幾分漫畫反派的浮誇感。他瘋狂表演不僅極具魅力

  ，甚至還為電影增添了些黑色幽默：他本身就是個毫無良知的邪惡狂人，但面對眼前這幾

  個壞小孩初生之犢不畏虎的行徑，卻數度傻眼。當邪惡的他面對這群壞小孩，只能表現出

  「怎麼回事，你這傢伙」的錯愕時，這樣的反差感造就了全片最爆笑的幾個時刻。

  .

  不過比起最後到底誰輸誰贏的懸念，整部電影最耐人尋味的部份，其實是原文片名的《黃

  金少年》到底是什麼意思─我最一開始看到這個片名時，還以為是類似《七寶奇謀》這樣

  的青少年尋寶冒險故事─這個黃金最顯而易見的答案當然是這群少年想要勒索的鉅額款項

  ，但我更傾向認為，這「黃金」指的是那難以保存、卻無比珍貴的純淨青春，更準確地說

  ，是故事的女主角夏月，比起天生邪惡的安室，她才是這個故事中真正的「黃金少年」。

  .

  或者我們可以說，在所有主要角色中，她是真正地單純可愛而善良、是那個真正被迫簽下

  「壞小孩契約」的孩子。能夠成為出淤泥而不染的蓮花是一種對自我的期許、也是一種高

  貴的偉大情操，但是事實是，環境終究是能對人們造成巨大的影響，尤其對尚未成熟的少

  年更是如此。夏月可以說是整部電影中最值得救贖的人，她象徵著孩子的純潔，但卻不幸

  生在錯誤的環境當中，最終只能跟著走向萬劫不復。

  .

  我想到了佛洛斯特曾寫下的那段詩句：自然初綠是為金，這種色彩最難存。自然新葉像朵

  花，但也只能保剎那。之後葉復褪為葉。同理伊甸淪悲切，同理清晨沉為晝。黃金事物難

  久留。

  .

  在曾引用過這段詩句的《小教父》中，垂死的孩子望著他的朋友，希望他能”Stay gold

  ”，生命的伊始是為純真，這份純真正是真正難得、卻也難久留的「黃金事物」，看著這

  樣的純真逝去是場悲劇。我們或許都曾幻想，如果沒有走錯那一步、如果沒有遇上誰、如

  果能夠生在更好的環境，那黃金的光芒是否能夠依然閃爍著。

  .

  只可惜沒有如果，《壞小孩契約》是這樣殘酷地告訴我們。


  --'
