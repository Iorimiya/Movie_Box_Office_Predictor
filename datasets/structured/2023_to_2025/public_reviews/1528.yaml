url: https://www.ptt.cc/bbs/movie/M.1690623294.A.B8F.html
title: '[好雷] 好看好笑又不失深度的珍愛硬起來'
content: '雷文防雷資訊頁




  預告片裡有了超過半數梗

  如果預告看了舞尬以

  想要輕鬆看電影

  這片很適合喔^_^

  好看好笑無冷場又不失深度


  （還有美美的Jennifer Lawrence ）







  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~






  以下有雷







  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  劇情是一對「特別關愛孩子」的父母，想要找一個女生，幫兒子上大學前「轉大人」，不只是幫破處XD，還希望藉由這樣的短期關係讓兒子波西能獨立自主一點，並提供一台車子作為報酬。Jennifer
  Lawrence飾演的麥蒂，面臨經濟困境，應徵了這份工作……



  這齣戲有不少既幽默又諷刺的對白跟情節

  比如：

  麥蒂見這對恐龍父母之前還得爬上象徵階級的上坡，這點在寄生上流就有看過，而且往上爬好難好累好辛苦，但是，當麥蒂看到作為報酬的車子時，就很順的爬上去了XD

  朋友知道麥蒂接了工作，還吐槽她：「妳沒錢繳稅，不願意出租房子，卻願意出租妳下面？」



  關於教育


  片中的父母很掌控自己孩子，可以從很多細節看到。兒子床單弄亂一小角，媽媽馬上整理，到幫兒子破處的對象，還是父母暗中安排的。

  後來波西終於忍不住說出：「無論我做對做錯，因此快樂、跌倒、受傷，都必須讓我自己親自體驗」（原句忘了大概是這意思）


  如果你的孩子想要在網路上買東西，買一件衣服，要好幾千元，你看了覺得很像假的，應該是詐騙，那這次你會禁止他買嗎？還是就讓去做，讓他被騙這幾千元，免得以後被騙幾千萬？


  再打個比喻：就像遊戲裡的角色，天生職業是法師，可是你聽說現在Meta是鬥士強，所以你給這個角色配了鬥士的裝備，點鬥士的技能。

  強加給他的，他又學不好，而他的長處他的天賦，他也不知道怎麼發揮，最後就變得四不像，他還會回過頭來怨恨。


  有時候父母必須忍住不出手幫忙，讓孩子不斷跌倒、嘗試，他才能逐漸成長並認識自己。



  （劇情我沒有描述很多，這部電影真的很棒，歡迎留言討論）

  -----

