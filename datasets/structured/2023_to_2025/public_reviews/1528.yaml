title: '[好 雷]珍愛硬起來 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這部電影很意外的

  很快就出現在MOD

  可見電影院的收視不理想


  今天有親戚來家裡喝酒

  (都是中老年男人)

  所以開了這部來看

  先說結論，整體而言是輕鬆好看的

  有二個賣點，第一就是珍妮佛勞倫斯

  的全裸入鏡，天呀，根本是夢幻成真

  (對中老年男子而言)

  第二是劇中珍妮佛施展出混身的戲胞

  可以落魄，可以性感，可以知性

  可以強勢，可以在戲中演戲

  可以作出青春期少女的夢幻感

  (正式晚餐中有鋼琴那段)


  雖然故事老梗，結局好來塢

  但整部戲靠著珍妮佛

  美麗夢幻有魅力，我可以給到中上的分數


  假日晚上不知道該看什麼嗎

  一群男人有點酒精時

  我推薦這部。


  --'
