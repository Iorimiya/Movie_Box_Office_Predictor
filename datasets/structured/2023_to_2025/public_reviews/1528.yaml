url: https://www.ptt.cc/bbs/movie/M.1706247810.A.AC8.html
title: '[好雷] 珍愛硬起來 No Hard Feelings'
content: "~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n英文片名\
  \ no hard feelings 意思是 no feeling of being upset\n可以簡單解釋成別生氣或是沒有生氣\n看完電影覺得片名很可愛\n\
  珍妮佛在劇中的角色很不掩飾\n看起來隨心所欲的生活\n就像對大家說「no hard feelinds」\n但是其實心裡面埋藏著長久對父親的憤怒\n而這樣看起來對什麼事情都不在乎的她\n\
  遇到人生最艱難的事情就是無法保住母親的房子\n從前男友對她的態度可以感覺得到她是個不在意他人感受的人\n但是其實對於認定的人事物卻反而過分的認真\n\n波西與麥蒂之間除了顯而易見的社經地位差異\n\
  波西對所有事情都很認真\n也可以說是過於單純未經世事傷害\n但是隨著劇情發展，看似差異的兩人卻有著共同點\n兩人對於人事物其實都抱持著開放的心態\n真心與人相處、不掩飾自我\n\
  只是麥蒂或許因為害怕受傷，所以不敢坦露這樣的自己\n\n劇情有些地方很瘋狂\n但是就抱持著no hard feelings的心情看其實挺療癒的\n如果不是珍妮佛演，這部片應該會變得很不一樣\n\
  因為她的氣質真的就跟女主角很像\n看她發瘋都覺得很可愛XDD\n\n推薦給想放鬆的人～\n\n--\n                            \
  \        01/27 08:31"
