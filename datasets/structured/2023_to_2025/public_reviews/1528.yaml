url: https://www.ptt.cc/bbs/movie/M.1690784837.A.AB5.html
title: '[好雷] 珍愛硬起來 (No Hard Feelings)'
content: "雷文防雷資訊頁\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*\n\n\n\
  發個簡易心得好了，我覺得沒那麼難看啊~很放鬆的享受就好\n\n當然如果你覺得難看，放心，你一定是對的。\n\n\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n其實作為喜劇小品，週末沒事去電影院消磨時光還不錯看，\n\
  \n劇情雖然好猜，但還是有一些巧思，\n\n像是麥蒂和波西前後都有趴在擋風玻璃上的橋段，好好笑，這些橋段也是重要轉折\n\n波西終於擺脫手機、在麥蒂家中談心聊天，麥蒂誠心想和波西道歉等等\n\
  \n我其實不覺得麥蒂有需要道歉，最該道歉的是他爸媽吧，\n\n但人世間的複雜豈是誰對誰錯這樣黑白分明的，波西肯定也知道這不是麥蒂的錯，\n\n可是最無辜的人是他，真的也難為他了。\n\
  \n\n麥蒂因為當地房價高漲付不出的房屋稅，車子被政府扣押也沒辦法開UBER賺錢，\n\n劇情有給出合理的解釋她為何不把房子賣掉就好，\n\n原來她是單親家庭長大，所謂的爸爸就只是來度假的有錢人不負責和她媽媽好上，\n\
  \n可能因為成長過程沒有父親關愛，麥蒂對於「被男性愛」，\n\n被男性表達「我愛你」會感到不知所措，寧願沉浸在性愛的餘歡就好，\n\n我大致粗淺理解為這樣，真正要剖析的話有請心理學專家解釋。\n\
  \n\n總之她媽媽留下的房子(生父給她們母女的補償)，她是直觀地認為是重要到不能賣的，\n\n但波西卻說出(可能是)她內心的潛意識：\n        妳只是想守在原地(以為能)等生父回來道歉(但其實他永遠都不會來)。\n\
  \n最終她終於想清楚把房子賣掉，而且賣給自己的好友讓他們可以繼續在當地生活，\n\n自己則出去闖盪，其實她本來就是想出去闖的，\n\n只是當時因為自身的膽怯以及母親生病又回來而已，正好能再次圓夢。\n\
  \n\nBUT我還是討厭的缺點，麥蒂好友明明就是個大腹便便的孕婦，麥蒂還在她面前抽菸，\n\n我忘記是哪一段了，但就是不應該啦！\n\n穿著直排輪爬樓梯那段也很硬要，我真的沒有感覺好笑在哪，\n\
  \n可能是為了要凸顯麥蒂面對這些外地來的有錢人只能無能為力艱難地往上爬，\n\n但因為直觀就覺得太蠢，幹嘛不脫掉換高跟鞋再走上去，只想翻白眼。\n\n\n喜歡的橋段是領養ＣＯＣＡＩＮＥ狗狗，緝毒犬居然會染上毒癮…嗚嗚嗚，\n\
  \n這段前後呼應很驚喜我好喜歡，比珍妮佛勞倫斯露兩點還喜歡哈哈！\n\n幸福的狗狗太為你開心啦。\n\n不過露點我真的沒想到，忘記她在紅雀有沒有露了，\n\n\
  我想說應該會用角度帶過去，喔喔喔沒想到是來真的，超爆笑，\n\n這段衝突就很真實(和波西在海裡裸泳結果衣服被岸上的有錢屁孩幹走)，\n\n雙方都沒在客氣地狂揍(麥蒂下體也被踢)，拜託，你們怎麼打得過飢餓遊戲的冠軍啦\n\
  \n\n至於波西和麥蒂的感情線，我覺得還好…波西並沒有想像中這麼不善於跟女性互動，\n\n人家只是比較純情害羞而已，爸媽未免太過操心、弄巧成拙\n(但劇末爸媽也很快修正自己的態度，讚，沒有堅持幫忙提行李)，\n\
  \n看吧搞到最後不去念普林斯頓了，嚴不嚴重…\n\n可是真的不覺得他們火花，波西就只是暈船了吧…麥蒂一直給我某大姊的感覺，\n\n感受不到兩個人的粉紅泡泡，但覺得很好的是兩個人互吐心事相互療傷，\n\
  \n幫助對方重新面對審視人生。\n\n\n勉強讓我覺得好像有fu的是波西彈琴獻唱\n\n給麥蒂一個她沒能好好享受的高中舞會的橋段，\n\nOMG珍妮佛的眼神好認真，我都快忘了這是喜劇，\n\
  \n還有麥蒂在派對被羞辱，屁孩沒事就拿手機拍拍拍要上傳爆料公社喔(這段也好寫實)\n\n波西還是忍不住了(明明就還在氣麥蒂 可愛的孩子)揍了對方，很man喔~~\n\
  \n\n我不覺得她跟波西的關係可以繼續朝戀人或砲友發展下去，個性差太多，\n\n但當一輩子的好友是肯定的(有射在對方大腿上的好友這不多見對吧)~~\n\n\n\
  --\n\n\n\n\n--"
