content: '【2024/06/20 Apple TV 特價快報】

  珍愛硬起來／噤界 II／撕裂地平線／尖叫旅社：變形怪獸／惡靈古堡：死亡島／衝浪季

  節／食破天驚

  －

  昨天晚上Apple TV突然把一大堆新片特價到了$90，我們也第一時間幫大家整理出來！其

  中首先推薦一年前的新片，珍妮佛勞倫斯最新的突破之作《珍愛硬起來》，難得特價就直

  接給到$90，演出也很有可看性，值得收藏。另外就是大量的恐怖片，《撕裂地平線》是

  我的童年陰影，每次都會推薦給大家，$90也十分難得，請務必把握。《鱷魔》跟《大君

  主行動》也是觀賞性很不錯的大片，還有《禁入墳場》全系列都在特價之列，熱愛恐怖片

  的朋友千萬別錯過了。

  －

  介紹完兒童不宜的部分，緊接著是老少咸宜的動畫片回合！系列新作《尖叫旅社：變形怪

  獸》首次特價到$90；詢問度很高的《衝浪季節》也是兩部一起特價，相當難得。最後ˇ

  當然也提醒大家，最近的號外特價《Stand By Me 哆啦A夢》絕對是要趕緊入手的一部，

  還沒下手的動作要快囉！

  －

  以上，祝大家看片愉快！

  －

