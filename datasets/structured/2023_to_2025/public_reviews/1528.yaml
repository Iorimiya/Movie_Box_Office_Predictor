title: '[  雷] 珍愛硬起來'
content: '防雷

























































































  看到珍妮佛勞倫斯的第一眼我不敢置信

  她真的有年紀了,而且是有整嗎？臉變好怪

  不過撇除這些她演這種角色還是有說服力的

  就算大部分時候就是老梗的性喜劇

  還是意外帶出不少有趣的議題

  像是直升機父母或是年紀議題等,範圍挺廣

  後面他們和好後的發展倒是讓我有點意外

  我以為會發展成姐弟戀,沒想到是純友誼

  很出乎意料之外,也很稀有

  某方面來說這部電影還蠻”寓教於樂”的

  如果你能看到那些粗鄙笑鬧背後的價值的話

  我是覺得雙方在治癒彼此的時候是很重要的

  也許就是這樣才變成了純友誼吧

  話說他們最後到底有沒有做啊？

  有的話就算是第一次也太快了吧

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  一旦踏出去，就無法再回頭，朝三千世界的血海而去


  --'
