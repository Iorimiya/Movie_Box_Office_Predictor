url: https://www.ptt.cc/bbs/movie/M.1691425607.A.78D.html
title: 《珍愛硬起來》回歸愛情的初心～有雷慎入
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  今天看了這部討論度極低，但其實看完覺得其實比芭比好看的珍愛硬起來，就想說來推薦

  一下給大家～


  長大後的我們，是否我們都忘記了，愛情真正的模樣？


  還記得年少的自己，是怎樣面對愛情的嗎？那時候的我們可能充滿對愛情的憧憬，也對性

  有著各種想像。


  但長大之後的我們，或許談過幾次戀愛、也有比較多經驗之後，可能受過幾次傷之後，漸

  漸失去對愛情的憧憬，習慣偽裝自己，假裝對愛情不在意，久了對愛情也漸漸麻痺，好像

  不認真去愛，反而可以一直享樂。


  沉溺在速食的愛情或者性愛之中，漸漸的迷失自己，忘記了愛情的本質應該是要互相了解

  ，互相坦承，單純而善良的。


  本來應該是要來幫男主角轉大人的女主角，卻反而讓年輕且未經世事的男主角上了寶貴的

  一課。


  電影中透過男主角純樸的愛情觀與世故且試圖把性變成工具的女主角的反襯，讓我們在輕

  鬆的氛圍中，反思並找回青澀的自己，如果你也在速食愛情中迷失了自己，很適合來看看

  這部輕鬆的喜劇電影，重新想想你自己要的愛情是什麼。


  除了愛情之外，也有帶到一些必須要自我內心挖掘才能放下、以及過度溺愛的父母的瘋狂

  模樣，不過我自己感觸最深的還是讓我回去又想想什麼是愛情，其他部分就不多些什麼啦

  ！這部電影推薦給大家啦！讓我們跟著男女主角一起學習成熟、學習初心。




  --'
