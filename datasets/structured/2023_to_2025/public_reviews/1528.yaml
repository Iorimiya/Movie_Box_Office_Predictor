url: https://www.ptt.cc/bbs/movie/M.1705472411.A.415.html
title: '[好雷] 珍愛硬起來-跨階級的友誼'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n等到上了串流才知道有這部\n\
  覺得之前的推文有點誤導了\n因為這不是無腦的YA劇\n很多橋段血淋淋的橋段都值得探討\n有人問為什麼一個奧斯卡影后要三點全露（酸民的角度是犧牲自己賺零用錢）演搞笑片？\n\
  我覺得一個優秀的演員本來就該挑戰多種戲路\n而女主就是那種演什麼像什麼的天才\n演起喜劇非常自然好笑\n難道因為得了奧斯卡以後就只能演伊莉莎白嗎？\n\n本來女主角只是為了打工而認識這個小男生\n\
  最後收穫了人生的課程\n32歲的她終於離開自己給自己的牢籠\n踏出去開展自己的人生\n而情竇初開的小男生 雖然有錢但是也有自己的煩惱\n自己人生的一切都是父母安排好的\n\
  演員把抖音世代的書呆子演得非常好（想看帥哥可以pass)\n(wiki了一下他也算是在演自己吧)\n\n階級是很殘酷的\n對比上富二代青少年父母的溺愛\n這個女孩的出生註定沒有父親這個角色\n\
  獨立的外表 其實內心是很缺愛的\n高中生派對的橋段 女主角被罵old as fuxk\n然後又被一堆不禮貌屁孩拍攝\n明明自己不禮貌在先\n女主角只是回嘴諷刺幾句\n\
  竟然硬拗她歧視黑人然後還跑去找自己爸媽主持公道\n寵壞小孩的父母氣沖沖跑來罵女主髒話：\n妳以為我會讓他們沒有大人在的情況下辦派對嗎？\n令人不禁覺得\n有捨也有得，女主的背景造成獨立個性，讓她可以自己做主張和幫自己出頭\n\
  而這些媽寶小屁孩就算家裡有錢\n要是遇到了生活中的挫折（例如：海邊游泳衣服被偷）大概也無法自己處理\n只會哭爹喊娘吧？\n影片有呈現出這樣有趣的對比\n\n在約會場景\n\
  想要跟給女主一個舞會般感受的暈船小弟\n自彈自唱女主提過的一首歌：Maneater\n聽著歌詞：if you’re in it for love, you ain’t\
  \ gonna get too far\n本來只是演戲應付的女主，彷彿有點感動了\n但是後來出現一個男主角的女同學\n互動過程完全呈現出兩人的階級和社會歷練的差異\n\
  女主於是醒了過來\n在看到小男生認真地想為她放棄普林斯頓之後\n也意識到自己應該要停手了\n\n暈船的少年\n知道真相後跟女主說：我們的差別是過幾年後我可能在巴黎或其他地方\n\
  而你卻會一直在這裡等爸爸來找你\n於是女主回家後把給父親的信燒了\n還把有跟母親回憶的房子賣掉\n決定去其他城市發展\n\n這部片要不是Jennifer Lawrence來演\n\
  應該不會這麼好看\n要是男主弟弟不是富二代可能也沒賣點了\n因為他們巧合遇到了彼此\n在人生道路上他們是上天給彼此的禮物\n若你想要一段邊哭邊笑的時光\n這部片是很好選擇\n\
  \n                                    01/17 16:11"
