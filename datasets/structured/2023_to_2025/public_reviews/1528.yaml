  有講現在部分青少年的現況

  還有情場老手與波西相處下慢慢發覺互相關心的感情

  並非是現下的那種速食感情

  還有珍妮佛的大方演出、都可以去細細品味一下

  其實是挺溫馨的一部片啦！


  --

  沒錯慢慢開始~

  是一部不錯的片'
