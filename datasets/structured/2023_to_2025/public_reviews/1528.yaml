title: '[無雷] 珍愛硬起來-非常失望XD'
content: '昨天看了珍愛硬起來

  先說結論  非常失望XDD


  本來蠻期待的 預告也蠻好笑

  但如果你只是想看笑點 其實預告也差不多演完了XDD


  老實說整體不差 還是有被娛樂到(大概60分)

  但劇本格局實在太小了

  一直主打性喜劇  根本不夠性好嗎 這部的主旨也跟性沒太大關係

  要瘋也不夠瘋 要胡鬧也不夠胡鬧


  甚至Netflix 迪士尼+ 自己拍的一些喜劇都比這有深度


  珍愛硬起來能夠上院線 感覺就是因為是珍妮佛勞倫斯演的關係


  她真的很適合演這種片 也演得很好 有點智障好笑的角色


  問題是整部片格局小  劇情有點無聊  前半段還算有趣

  後半段的轉變就令人厭煩  男主角後面的改變也很突然

  一點也不像魯了18年的男生

  女主的轉變也有點讓人抓不著頭腦


  總而言之就是蠻失望的  FB IG這部影評葉佩真的太多了


  但是


  這部最值回票價的  應該就是看珍妮佛露三點XDDD

  但其實其他部都露過了啦


  以上  分享一下


  --'
