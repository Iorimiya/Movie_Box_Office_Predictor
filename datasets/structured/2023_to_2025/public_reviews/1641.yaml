title: '[普雷] 駭人骨娃娃，電梯遊戲'
content: '萬聖節在十月，才一天，但存在感十足，西洋國曆的十月，和華人世界的農曆七月，都是

  鬼月，應景的恐怖驚悚的影片有時在此時推出放映，我也不免俗的，在此時選看恐怖驚悚

  類型影片，最近在MOD收看的二片，都有點遺憾，請看：


  1.

  駭人骨娃娃

  The Communion Girl

  2022西班牙電影

  La ni鎙 de la comuni鏮




  有些東西，不要撿回家！剛搬來的年輕女孩莎拉在閨密蕾貝邀請下，一起到夜店玩耍，回

  程卻「遇到」一個骨董白紗娃娃，莎拉把娃娃帶回家後，一行人陸續身體莫名長出斑痕、

  出現幻覺、所到之處都如同噩夢接二連三的纏著他們不放...。




  個人滿意度60分（滿分100）。其實拍攝成果不錯，劇情可以預期，恐怖的劇情畫面安排O

  K，但討厭結局的處理，扣除10分。


  故事本身而言是有吸引力的，但仍存在一些問題。經過一夜瘋狂的派對後，女主和她的朋

  友在荒郊野外中遇到了一個奇怪的娃娃，這讓她們陷入了娃娃幽靈主人的一系列噩夢般的

  困擾

  之中，必須揭開它外表背後的險惡起源，才能揭開謎團。


  總之，這是一個足夠不錯的類型嘗試，儘管有些問題。  前半部涉及朋友團體與派對的互

  動以及她的家庭生活，看到娃娃的發現以及它如何影響她，從而為這一切奠定了堅實的基

  礎。 鎮上的迷信將事件納入其中，將其一筆勾銷，對他們的生活造成了干擾，以及明顯

  的問題，給一切帶來了影響，這很有趣。 正如它所做的那樣，下半場帶來的鬧鬼的開始

  ，就像此類型的套路，具有娛樂效果。 由於我們為這個幽靈般的人物，提供了一個適當

  令人毛骨悚然的背景故事，以及它同樣令人毛骨悚然的外表，它出現，並折磨甚至直接殺

  死他人的場景，以精細的順序，讓人感受到它的超自然力量，給了這很多有點懸疑的感覺

  。 即使是如何阻止鬼魂的想法，也很有趣，與有幾個牢固的聯繫，而且相當有趣，這讓

  本片增加趣味。


  本片特點是受冤屈的靈魂，回來，並困擾那些陷入困境的人。 這裡沒有發生太大的偏差

  ，因為它沿著這種類型的故事進行，並且很容易看到節奏的到來，易於預測，從而在一定

  程度上減輕了緊張感。 這裡的另一個缺點是，在較長的運行時間中，沒有太多的動作方

  式，導致某些時刻它緩慢前進。本片的幾個支線故事，朋友們的家庭生活，相當麻煩，而

  且是徹頭徹尾的虐待，這是一個不需要所有時間都花在它身上的角度，調查的幾個部分，

  導致角色多次見面， 類型設定的重複性質，也發揮了作用，使其偏離了應有的位置。


  #駭人骨娃娃

  onGirl

  #2022西班牙電影

  #La_ni鎙_de_la_comuni鏮


  2.

  電梯遊戲

  Elevator Game

  2023美國電影




  『★最新恐怖都市傳說 ★每個禁忌都有理由 萊恩為找失踨的妹妹與朋友們一同進行電梯

  遊戲，卻招來無法挽回的後果』萊恩（吉諾亞拿尼亞 飾）的妹妹在幾個月前失蹤了，他

  認為她失蹤的原因是玩了網路上流傳的「電梯遊戲」，傳說只要照著特定步驟操作電梯，

  就可以前往另一個次元。為了找到妹妹，萊恩說服他的朋友們一同進行電梯遊戲，此舉卻

  為他們招來無法挽回的後果……。




  個人滿意度65分（滿分100）。全片的恐怖劇情畫面有做足，典型的青少年主角恐怖驚悚

  類型片，娛樂效果不錯。但收尾是我討厭的安排，扣除10分。


  本片是來自自我意識的恐怖？正在成為一種趨勢。 本片的電梯遊戲有點有趣，也有點聰

  明，但它沒有達到原創傑作的高度。 我認為這種技術被過度使用了，而且已經不再令人

  印象深刻了。 應該對我們的主要殺手，做一些不同的事情。


  這不是《咒怨》，也不是《魔戒》，反派的銀幕時間很少，無論何時出現，它的存在都不

  會產生任何影響。


  本片的兩位主角的個性都不錯，並且將故事貫穿始終。 我確實認為隨著電影的進展，表

  演總體上有所改善。 這顯然不是一部大預算的電影，所以不要期待大預算的 CGI，但我

  喜歡情節和懸念，效果有一種幾乎八十年代的氛圍。 雖然我知道這並不能滿足所有人的

  口味，但我還挺欣賞本片有暗中諷刺網路自製影片及自媒體的橋段。


  #電梯遊戲

  me

  #2023美國電影


  --


  謝謝小羊大的留言，這二片的缺點，就我而言，只是不喜歡結局。哈哈哈。


  哈哈哈。



  古娃娃？吉娃娃？



  挺好看的。



  樓上說的那橋段，同感，好可愛。可惜二個角色下場都很悽慘。'
