title: '[情報] 亞曼達塞佛瑞《莎樂美》上映戲院列表'
content: "來了\n\n\n\n砍下頭顱之後 ——？\n\n《》8月1日(五) 全台上映\n\n\n\n莎樂美 的故事源自《》，在王爾德筆下，莎樂美愛上了施洗約翰，施洗約翰卻拒絕\n\
  了莎樂美的愛。\n\n於是在希律王的生日宴上，莎樂美跳了七重紗舞取悅國王，獲得希律王賜與任何一樣事物\n做為獎賞。\n\n她便開口要求希律王，將施洗約翰的頭顱放在銀盤上獻給她...\n\
  \n  \n\n多倫多國際影展正式入選\n\n柏林國際影展特別放映\n\n《色 誘》奧斯卡提名導演艾騰伊格言最新力作\n\n《悲慘世界》《媽媽咪呀！》精靈系女神\n\
  \n領銜主演\n\n權威影評網站「」新鮮好評認證！\n\n一位充滿熱忱的戲劇導演（ 飾）\n\n肩負著重新上演她導師最著名的作品——\n\n歌劇《》的任務。\n\
  \n一些令人不安的過去記憶，將讓她壓抑的創傷開始浮現。\n\n--"
