url: https://www.ptt.cc/bbs/movie/M.1754646760.A.B31.html
title: '[討論雷] 莎樂美(2023)'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n這部是2023年的電影,\n\
  \n\n英文片名是Seven Veils(七重紗舞)\n\n\n不過台灣最近剛上,\n\n\n還是防個雷XD\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n首先這部觀影門檻有點高,\n很多隱喻都沒有明示.\n預設觀眾應是相當熟悉史特勞斯版本莎樂美歌劇的觀眾.\n\
  (我只有惡補一下歌劇劇情 所以有點消化不良XD)\n\n有幾點其實不是很確定 想討論一下:\n\n-當年女主角老爸與老師在女主角幼年做了什麼\n\n 雖然劇中沒有直接提到\
  \ 但應該滿確定的:\n 從各種暗示:\n  爸爸那讓人不適的錄影帶,\n  老師查理把她的舞姿放上舞台,\n  七重紗舞女主角閃回與接近崩潰的反應,\n  媽媽的道歉...等等,\n\
  \ 應是假借藝術之名行性侵害之實.\n\n\n-女主角與老師查理的關係?\n\n 女主角自己代入莎樂美的角色,\n 而已故查理則是施洗約翰的角色,\n 表面上是得不到的愛(這點女主角獨白有講過)\n\
  \n 但就劇中隱晦的敘述來看,\n 女主角幼年受到爸爸與老師(還有其他人)假借藝術之名性侵害,\n 如果這樣還是對老師有情愫, 其實有點斯德哥爾摩...\n\n\
  \ 抑或是想要將老師的畢生傑作修改成自己的形狀,\n 藉此在當事人都過世後達成她小小的復仇?\n\n 總覺得這兩者有些矛盾.\n 抑或是女主角對於老師的情愫其實就是很矛盾的?\n\
  \n\n-結局女主角獨白:\"我吻過了施洗約翰\"\n 然後切回全家福畫作老爸塗白的臉,\n 切過去的意義是?\n 我的認知是\n 女主角最終走出了老爸與狼師的陰影,\n\
  \ 以塗白的手法達成對已死爸爸的復仇;\n 以改掉老師作品的方式達成對已故老師的復仇...\n 但總覺得還缺了什麼XD\n\n\n-穿插雕塑師的支線實在意義不明,\n\
  \ 雕塑師的前後任女友(恰好是女主唱與under-study)關係以及與男主唱的性騷擾事件,\n 這些橋段又跟主線沒什麼關係,\n 放進去的原因我實在不理解...\n\
  \n\n個人感想:\n\n-首先亞曼達這部確實演得不錯.\n 不過她接這個角色太年輕,\n 氣場不夠強..有點miscast\n 這個角色感覺比較適合海倫米蘭或是凱特布蘭琪這類型的演員詮釋.\n\
  \n-不過這部海報真的很有氣氛超讚,\n 有種詭異危險又美麗的感覺...\n (敲碗海報XD)\n\n--\n\n正片其實沒演出來.\n除了一直拍片以外只有要女兒丟橘子剝橘子吃橘子而已.\n\
  (我有點懷疑是不是用到toss the tangerine這個隱喻啦..\n 身為一個非native speaker 理解這些有些力有未逮 orz)\n\n但在彩排七重紗舞那段劇情時,\n\
  女主角的獨白與畫面都有暗示父親與友人輪暴莎樂美.\n本以為只是女主角為了代入角色所進行的幻想,\n但後來她要求看護把畫中父親的臉塗掉後,\n女主角母親的反應竟是:\n\
  \"你覺得那樣比較好就那樣吧\n 對不起 當時我沒有保護妳\"\n暗示類似的情境是真實發生過的..\n\n\n跟聖經其實沒關係,\n歷史/聖經/歌劇3個劇情都不一樣\n\
  歷史上的莎樂美應該會很無奈王爾德亂寫劇情害她風評被害...XD\n\n\n我自己的想法是,\n能導一齣這樣的歌劇,\n女主角應已是小有名氣的歌劇導演了,\n應該要有點氣場比較合理.\n\
  不過你這麼說也是滿有道理的..\n\n\n我也這麼覺得\n支線不知道為什麼要放進來..\n我還是無法把他跟主線作連接.\n如果能多聚焦主線應該不至於這麼破碎難懂.\n\
  \n\n海報真的好看..\n現在這麼大膽只放一個超大正臉但氣氛又棒的海報不多了.\n尤其亞曼達的正臉很符合這種氛圍!!!\n下週有給海報的話我應該會去二刷XD\n\
  \n\n也是有道理,\n呼應片中女主角一直重複獨白如果愛太過會怎麼樣..\n只是看完我還是沒有辦法拿捏女主角對他老師還有他爸到底抱持什麼情感.\n究竟是恨是愛還是都有.."
