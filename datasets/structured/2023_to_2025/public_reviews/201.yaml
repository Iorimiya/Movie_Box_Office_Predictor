  莎樂美 的故事源自《聖經》，在王爾德筆下，莎樂美愛上了施洗約翰，施洗約翰卻拒絕

  了莎樂美的愛。


  於是在希律王的生日宴上，莎樂美跳了七重紗舞取悅國王，獲得希律王賜與任何一樣事物

  做為獎賞。


  她便開口要求希律王，將施洗約翰的頭顱放在銀盤上獻給她...



  多倫多國際影展正式入選


  柏林國際影展特別放映


