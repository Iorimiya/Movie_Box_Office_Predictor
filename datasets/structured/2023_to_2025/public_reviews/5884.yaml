title: '[討論] 現代人看得下去《油麻菜籽》嗎'
content: '剛剛在Netflix上看到排行有部修復的老電影《油麻菜籽》


  點開來看了半小時後

  覺得女主角實在太可憐了

  然後剛好有點事情要處理，所以就先沒繼續看


  在相隔40年的現在

  什麼嫁雞隨雞嫁狗隨狗、女人的命運是油麻菜籽

  早已不適用了

  離婚更不是什麼丟臉的事



  雖然說當代的電影紀錄的是當代的社會文化

  但帶著現在性別意識更進步的思維

  會不會看不下去這部電影XD



  --'
