url: https://www.ptt.cc/bbs/movie/M.1683538728.A.916.html
title: '[新聞] 顏正國童年不識字 「油麻菜籽」靠家人背'
content: '新聞網址：


  新聞標題：顏正國童年不識字 「油麻菜籽」靠家人背台詞


  完整新聞內文：


  （中央社記者葉冠吟台北8日電）數位修復版經典國片「油麻菜籽」將於母親節前夕上映

  ，演員顏正國和片中媽媽陳秋燕今天相隔40年再同框，意外被「媽媽」爆料小時候不識字

  ，得靠家人唸劇本給他聽幫忙背台詞。


  童星出身的顏正國6歲就開始演戲，從小到大演過多部電影，今天在媒體茶敘分享「油麻

  菜籽」對他來說是特別的一部片，尤其媽媽還有客串演隔壁家媽媽。當時顏媽媽陪著兒子

  四處拍片，時不時被找去當臨演，還曾演過電影「悲情城市」的媒人婆。


  談起媽媽，顏正國說，光是試片「油麻菜籽」時，看到40年前媽媽年輕的樣子，就忍不住

  淚崩，「銀幕上她才28歲，就為我和哥哥、弟弟們操心，沒想到我長大後不懂事，更讓她

  日夜為我擔憂」，目前68歲的媽媽腸胃不太舒服，也讓他很心疼。


  飾演顏正國媽媽的陳秋燕，回憶當年拍攝模樣，直呼9歲的顏正國很皮但特別孝順，每次

  劇組發便當時，顏正國都會第一個跑去幫媽媽拿。陳秋燕更透露，顏正國很小就出來拍戲

  ，幾乎沒時間上學，不大識字，劇本都靠父母唸給他聽，再死背起來，「他很好面子，不

  敢說不識字」。


  顏正國今天也不諱言自己曾是文盲，當年一部片接一部片演，忙到很難去學校，幾乎在片

  場長大，「好險都是和非常厲害的導演、叔叔阿姨演員合作，用氛圍來引導童星。後來我

  拍侯導（侯孝賢）的戲也沒看過劇本，有就死背，也養成我不敢接八點檔，那台詞都是整

  頁的耶。」


  真正開始識字，顏正國說，是在27歲人生最低潮之際，「我決定要學我最不喜歡的事情，

  就是讀書和寫字」，藉由練書法來識字，從臨摹開始慢慢認識每個字的意涵。顏正國說，

  他不要求小朋友很會讀書，只希望他們懂倫理、道德，發掘各自的興趣，學習一技之長。


  而曾是台語片童星的陳秋燕提到，家中也是重男輕女氛圍，父親把家中事業交給哥哥經營

  ，卻被哥哥搞垮，全家經濟壓力就壓在她身上，原本想唸書的她不得已在北一女初中部畢

  業後，回歸影壇，「家中欠一屁股債，一定得出來賺錢」。


  陳秋燕分享，雖然電影40年了，故事依舊歷久彌新，尤其當了母親、拉拔孩子長大後再看

  ，有很多新感觸，「那時候的母親就是這樣走過來，面臨重男輕女的處境」。顏正國也說

  ，「身在台灣、長在台灣，從電影裡就能看到當年的台灣」，藉由「油麻菜籽」再次看見

  台灣女性。


  數位修復版「油麻菜籽」將於12日全台上映。（編輯：張雅淨）1120508


  --'
