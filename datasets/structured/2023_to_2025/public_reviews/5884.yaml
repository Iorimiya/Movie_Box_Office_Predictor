url: https://www.ptt.cc/bbs/movie/M.1680363820.A.AE9.html
title: '[新聞] 《油麻菜籽》修復 柯一正嘆渣男標籤難撕'
content: "《油麻菜籽》修復 柯一正嘆渣男標籤難撕\n\n04:10 2023/04/01 中國時報 翁紫曦\n\n\n《油麻菜籽》重映找來陳秋燕（左）、柯一正重遊舊地。（海鵬影業提供）\n\
  \n\n《油麻菜籽》陳秋燕（左）、柯一正（右）劇照。（海鵬影業提供）\n\n侯孝賢、廖輝英編劇的《油麻菜籽》3月31日舉辦修復版重映活動，男女主角柯一正、陳\n\
  秋燕昨重返當年拍片現場西本願寺，分享當年拍戲心境，也談各自與兒女相處狀況。\n\n柯一正在片中飾演丈夫一角，拍戲過程屢屢想到自己父親，他提及自己小時候很頑皮，父\n\
  親是家庭威權體制的代表，但自己愛跑出去玩，被爸爸拿登山杖「毒打」，笑稱自己非常\n耐打。\n\n他也趁機抱怨，常被大家認為是「花心渣男」，臉上貼著會「外遇」的標籤，他認為戀愛\n\
  的新鮮感在腦海中想過一輪就沒了，並沒有實踐的必要性。提到跟兒子柯宇綸的關係，柯\n一正則說，每次柯宇綸生氣就會「退群組」，認為兒子是個性派，也感嘆現在年代不同，\n\
  孩子過20歲就是獨立個體，大人不用管太多。\n\n在電影中演出「情緒勒索」媽媽角色的陳秋燕，提及與女兒的關係，笑說現代爸媽都「孝\n順兒女」，如果她管太多還會被女兒唸，打扮穿著還會被女兒嫌棄不好看，但2人關係像\n\
  姊妹一樣好。\n\n陳秋燕回顧《油麻菜籽》，認為這部跨時代的經典過了40年也不退流行，是台灣女性意識\n抬頭的象徵，將該片視為自己的生涯代表作，也大讚萬仁導演了不起，拍戲風格敏銳纖細\n\
  ，能參與這個作品是一大幸事。\n\n#標籤 #柯一正 #渣男 #父親 #女兒\n\n--\n佛教經典的\n是 是菩薩成佛之道\n        是 佛經\n \
  \ 是 佛      是 菩薩\n\n\n\n--"
