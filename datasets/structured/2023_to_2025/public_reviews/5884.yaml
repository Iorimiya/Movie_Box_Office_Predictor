title: '[好雷] 油麻菜籽'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  改編自台灣作家廖輝英1983年的同名小說，《油麻菜籽》透過女主角30年的歲月，闡述台

  灣女性的地位從如同油麻菜籽一般「落到哪，就長到哪」到獨立自主的職業婦女隨處可見

  。當年由於報名金馬獎，另外將台語版配音為華語，將近40週年的現在數位修復之際，特

  別以當年原汁原味的台語版上映，更顯示本片的鄉土風情。



  透過陳秋燕與蘇明明飾演的兩母女，反映三十年來臺灣女性地位的變遷，以及整個臺灣從

  農業社會進入工商業社會的步調。文質彬彬的導演柯一正首次亮相銀幕擔任男主角，演出

  不俗，從他身上可以看到傳統的一家之主因為經濟問題而大權旁落的活生生寫照。



  光看片名的英文譯名，可能無法理解是什麼意思，但當電影開始之後，「阿惠」的台語一

  出現，觀眾便會發現，原來主角並不是陳秋燕飾演的媽媽秀琴，而是出場時與哥哥阿雄一

  起紅著眼眶躲在門後看爸媽打架的阿惠。這個家裡媽媽的辛苦從小就只有阿惠看見，明明

  年紀比較小，卻幫忙分擔大部分的家務事。即便是當時「男主外，女主內」觀念影響，就

  連劈柴、挑水等粗活，都由阿惠負責，身為男孩子的哥哥只須在外快樂地玩耍。



  阿惠辛苦擦好的地板，阿雄從外面跑進來，鞋也不脫就直接踩上去，就像當時在外拈花惹

  草的爸爸李世俊一樣，將媽媽的付出與辛勞踐踏在地。哥哥偷水果被農人抓到，遭到媽媽

  處罰居然還說出「你打我，我叫阿爸打你」這種不孝的話。甚至媽媽流產的晚上，拖著虛

  弱的身體爬到家裡唯一的「男人」身邊，卻怎麼搖都搖不醒。最後，救媽媽一命的仍舊是

  在她重男輕女觀念下認為沒什麼用的阿惠。反而是有讀書的爸爸，知道阿惠考上北一女，

  說什麼也要栽培女兒。



  母親的辛苦本就非言語所能形容，再加上女權高漲，近年國片也對「失能的父親」多所著

  墨。紀錄片《神人之家》裡沉迷賭博的父親，讓從小看在眼裡的導演憤而離家；《孤味》

  的陳伯昌，跟李世俊一樣外遇，消失在家庭裡。在主角舉家搬到台北之前，李世俊同樣在

  家庭缺席，煮好的飯菜等到涼，男主人也沒有要回來吃，只有缺錢的時候才知道跟老婆開

  口要嫁妝，就連妻子流產當晚都不在家，只在隔天女兒照顧媽媽到生病時帶回一個洋娃娃

  作為補償。



  不過，說《油麻菜籽》呈現的是由於經濟問題導致爸爸大權旁落倒也不然。一家人搬到台

  北之前，本也就是他在外工作，而秀琴偶爾會拿嫁妝來貼補家用，上台北之後，也沒特別

  提到秀琴有出外上班，所以家庭的經濟支柱仍然是在爸爸身上。至於世俊為何會從渣男突

  然轉變為處處為家人著想的新好男人，反而是電影沒有明確說明之處。正是這個黃金交叉

  ，讓人覺得秀琴後續似乎對家人「情緒勒索」，但若將其放到整部電影的脈絡來看，便能

  看出她並非情緒勒索，而是過去的經歷讓秀琴不得不將自己形塑成最後的樣貌。



  除了呈現出台灣家庭的性別角色在30年間的轉變之外，從《油麻菜籽》中還可看出語言的

  變遷。光是電影本身當年受限於「國語影片實施要點」而必須配上華語就是其中一個例子

  ，而片中阿惠一家在家裡都是以台語溝通，但隨著他們長大去上學，便開始在對話中出現

  華語，因為戰後民初時，學校都實施「說國語運動」，而等到阿惠上國、高中，甚至有讀

  英文的短暫片段。



  語言的消亡本也就與殖民主義下的政策有關，1930年代的「台灣話文論戰」便是在電影描

  繪的時代背景下逐漸敗退，但是，1970年代再掀起「鄉土文學論戰」，1980年代後甚至有

  「原住民文學重現」。《油麻菜籽》時隔將近40年才能首次以台語上映，其與這些文學主

  體性的脈絡演變有著非常緊密的關係。



  「娘家這麼有錢，嫁到這種丈夫，有跟沒有一樣。」



  回到電影裡的性別角色敘事，秀琴並非單純情緒勒索，而是真心害怕女兒步上自己的後塵

  。雖說觀眾不知道秀琴出嫁前過著什麼樣的生活，但光是這句台詞與她身為醫生的父親就

  足以說明大概是「大小姐」的生活。她過去或許不需操持家務，如今不光是家務，簡直是

  整個家的大小事都是秀琴一個人要負責，而丈夫還在外養女人甚至家暴她，叫秀琴情何以

  堪。她告訴女兒：「妳現在每天打扮得漂漂亮亮去上班，也不用服侍誰，不是很好嗎？」

  的確，接受高等教育且事業有成的阿惠，完全是當時的女強人，但庹宗華飾演的帥帥沈立

  偉是她自由戀愛下的選擇。



  幾番來回爭執之後，秀琴最後摸著女兒的手說：「自己選的也好。」接受這個結果之餘，

  也代表阿惠可能能夠擁有與自己不同的命運，畢竟當初自己是沒得選的。電影既結束在結

  婚前夕，觀眾也無法得知阿惠最後是否獲得幸福，而即使在她的年代，「離婚」或許也還

  不是社會大眾可以廣泛接受的結果，但身為新女性，倘若沈立偉也像爸爸一樣家暴又外遇

  ，相信阿惠懂得再次選擇對自己最好的未來。



  秀琴手上的剪刀貫穿全片，從年輕、中年到老年分別剪斷三種不同的情愫，影視圈也普遍

  認為這三場原著小說中沒有的橋段是讓陳秋燕奪得金馬最佳女配角的關鍵。年輕時由於得

  知丈夫外遇憤而將所費不貲的西裝全都剪破，據說這場戲來自男主角柯一正母親的真實經

  歷，其實這種事情至今還是時有所聞，可見媽媽都愛剪破外遇老公的衣服；中年時因為發

  現女兒的情書而憤而將女兒的西瓜頭剪得更短、像狗啃；老年時則是由於女兒堅決要離家

  、要嫁人而將自己的插花盆景剪壞。



  年輕時希望能夠剪斷丈夫的桃花，或也讓自己對丈夫死心；中年時希冀可以剪斷女兒的桃

  花，為了讓她專心念書，但誰知道總是考第一的阿惠是不是跟《歌舞青春》裡的特洛伊一

  樣「能夠兼顧」呢；老年時則一刀刀剪斷自己的不安與對家人的掌控與依賴，畢竟過去30

  年這個家都扛在她肩上，要她突然放下責任談何容易，彷彿患「空巢症候群」一般，認為

  子女不再需要自己。三種情緒，三種層次，堆疊出《油麻菜籽》看似絕望卻又充滿希望的

  女性光輝。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
