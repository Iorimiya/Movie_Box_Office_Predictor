content: "心疼蘇明明 小綠綠看《油麻菜籽》哭紅眼\n\n04:10 2023/04/27 中國時報 李承陽\n\n\n心疼蘇明明 小綠綠看《油麻菜籽》哭紅眼\n\
  \n04:10 2023/04/27 中國時報 李承陽\n\n資深演員蘇明明40年前以電影《油麻菜籽》大紅大紫，26日重回發跡地西門町，與北一女\n的同學「小綠綠」們，一同欣賞她主演的成名作40周年數位修復版，現場感受到學妹的熱\n\
  烈歡迎。\n\n昨蘇明明在導演老公萬仁陪同下，一起出席《油麻菜籽》「小綠綠」映後座談，她在片中\n飾演的角色在就讀北一女時，曾和師大附中的學生庹宗華談戀愛，被母親陳秋燕發現後，\n\
  撕碎情書、怒剪頭髮作為警告。看到「學姊」遭到母親剪髮、委屈落淚的戲，北一女的同\n學們都瞬間哭紅了眼，結束時更報以熱烈掌聲。\n\n看到滿場青春洋溢的北一女學生，蘇明明憶起當年念高三時被星探發掘的經過，當年她還\n\
  是鄉下小孩，和同學從台中來台北受訓，卻在西門町遇到陌生人搭訕，嚇得她躲在同學後\n面，沒想到該陌生人竟是曾挖掘林青霞的星探楊琦，除幫她報名中影演員訓練班，還和劉\n\
  德凱、崔浩然、胡慧中同期。\n\n#蘇明明 #北一女 #油麻菜籽 #西門町 #陌生人\n\n--\n佛教經典的\n是 是菩薩成佛之道\n        是 佛經\n\
  \  是 佛        是 菩薩\n\n\n\n--"
