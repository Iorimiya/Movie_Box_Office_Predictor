title: 'Re: [新聞] 《油麻菜籽》修復版 曝40年前趕製祕辛'
content: '不要提這部片了，以下是我的親身體驗:


  ***


  這是發生在好幾年前的故事...


  那時候我出版一本講母性的書，因為看了油麻菜籽深受感動，

  所以跑去找廖輝英阿姨寫推薦序，結果廖阿姨大概是很忙吧，

  只見她隨隨便便寫了一篇文章交差，內容差到不行，連書的情節都沒有好好看過；

  我一看這個不行，只好硬著頭皮跟廖阿姨說，"這個真的沒辦法用"，

  結果廖阿姨大怒，把我罵了一整個下午。


  這就是實際見面，讓人大失所望的最好例子嗎?


  為什麼一個寫出這麼棒作品的作家，後來會變成這種敷衍了事又不認真的人呢?


  我搞不懂。


  ***


  如果實際接觸過廖輝英本人，真的會大失所望喔。


  --


  "你要學會忍耐，哪怕周圍所有的人都不在了，只剩下你自己，你也要堅持到最後。"

  --<<祚明>>


  --


  我只能說"真的很差，差到不行，差到真的沒辦法用，會破壞整本書的地步."



  ，

  不是把自己的作品推薦給她喔。


  而且我還親自跑到廖阿姨家拿稿邀稿，誠意十足喔...


  所以應該要我自己寫一篇好的，用她的名義發表嗎?'
