url: https://www.ptt.cc/bbs/movie/M.1617012815.A.F9B.html
title: '[情報] 《少年吔，安啦》《油麻菜籽》修復啟動'
content: '轉自國家電影及視聽文化中心董事長 藍祖蔚老師 臉書




  國家影視聽中心43歲生日之3

  典藏、修復及推廣

  台灣經典電影

  是國家影視聽中心的重要工作之一

  在台灣重要製片張華坤先生辭世百日前

  我們正式展開

  《油麻菜籽》修復計畫

  當年上映是台語版

  參加金馬獎做了國語版

  萬仁導演最愛的是台語版

  一度發行過VCD和VHS

  但是記憶已經斑駁

  多數人只聞其名

  不知其片

  我們會努力修復

  讓經典重見天日





  國家影視聽中心43歲生日之4

  因為坤哥

  因為《少年吔安啦》

  伍佰現身了

  高捷出席了

  阿國亮相了

  還有倪桑及褚明仁

  當年全因有張華坤撐住全局

  讓各方新秀都能全力逐夢

  在坤哥辭世百日前

  影視聽中心生日當天

  我們展開《少年吔安啦》的修復行動

  歡迎有心做商業發行的朋友

  來洽談

  倪桑說要復刻黑膠

  因為《少年吔安啦》是台灣第一張概念原聲帶

  伍佰就把自己的人生寫成了歌

  每一首台語搖滾歌謠

  到今天依舊讓人津津樂道

  我們努力擦亮自灣的昨天

  期許更燦爛的明天

  ------------------------------------------------------------------------------


  前天藍老師就有發文暗示《少年吔安啦》似乎要展開修復工程


  今天正式宣布啦！！！！


  看文章應該是未來要會往商業發行邁進


  是說之前國影的修復片都沒有上戲院放映 好可惜


  --


  --'
