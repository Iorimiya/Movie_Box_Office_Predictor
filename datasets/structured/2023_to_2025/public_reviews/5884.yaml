title: '[新聞] 《油麻菜籽》修復版 曝40年前趕製祕辛'
content: "《油麻菜籽》修復版 曝40年前趕製祕辛\n\n04:10 2023/04/20 中國時報 李承陽\n\n\n蘇明明（左起）、萬仁、李淑楨、張毓芝等人昨因首映會再度團聚。（陳俊吉攝）\n\
  \n經典國片《油麻菜籽》40周年數位修復版19日首映會，導演萬仁、編劇廖輝英、剪輯廖慶\n松，演員蘇明明、柯一正，以及許久未見的李淑楨均出席。萬仁回憶，電影40年前沒有首\n\
  \n萬仁說，當時試片有記者跟影評人反映電影的聲音抖抖的，原來是因為趕著要送拷貝到試\n片室，不小心被淋溼；當年電影上映沒時間製作預告，索性直接把電影的前9分鐘直接剪\n\
  成預告片，更幽默的是，因為來不及做，他只好用最快方式在預告最後加上字幕「欲知本\n片、請看本片」。\n\n製作過程也是一路緊湊，萬仁說，當時請李宗盛製作音樂，但因為電影的長度已來不及更\n\
  動，負責音效的金馬獎音效大師杜篤之，只能去剪李宗盛的音樂；電影當年也是找金馬得\n主廖慶松做剪輯，蘇明明回憶說，廖慶松的太太也就是在那段時間生小孩，「廖慶松跑去\n\
  醫院時，他太太還沒生，又跑回來剪片，剪一剪小孩就生了。」\n\n11歲演出賣座電影《魯冰花》「苦茶妹」的李淑楨，早在5歲時即演出《油麻菜籽》，當\n年是催淚小童星。她昨到首映會現場獻花給萬仁，萬仁回憶當年合作，特別盛讚她的哭戲\n\
  很神，當時一雙水汪汪大眼睛，竟能忍耐19秒不眨眼，讓淚眼一直在眼眶打轉，如此惹人\n愛憐的演出，讓當年台港觀眾哭出千萬票房佳績。\n\n#預告 #萬仁 #回憶\
  \ #廖慶松 #製作\n\n--\n佛教經典的\n是 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
