url: https://www.ptt.cc/bbs/movie/M.1679978037.A.2A3.html
title: '[新聞] 致敬台灣女性 「油麻菜籽」睽違40年台語'
content: '致敬台灣女性 「油麻菜籽」睽違40年台語原音重現


  新聞網址：



  The Central News Agency 中央通訊社

  2023年3月28日 週二 下午12:00


  （中央社記者葉冠吟台北28日電）被譽為台灣新電影時期最賺人熱淚的經典國片「油麻菜

  籽」，將於母親節前夕，睽違40年以嶄新數位修復版與影迷見面，向台灣女性致敬，並以

  原汁原味的台語發音版本呈現。


  「油麻菜籽」是經典國片數位修復重映推手褚明仁繼「少年吔，安啦！」、「悲情城市」

  掀起話題熱議與票房新紀錄後，第3部推出的具時代情懷與土地情感的經典國民電影。


  全片改編自作家廖輝英時報文學獎首獎作品，由導演萬仁執導，蘇明明、陳秋燕、柯一正

  主演，1983年底全台上映，即創下極佳的票房與口碑。


  飾演母親角色的陳秋燕，獲金馬獎最佳女配角獎；編劇廖輝英、侯孝賢則獲金馬獎最佳改

  編劇本獎。隔年進軍香港，成為當時少數在香江賣座能突破百萬港幣的國片，並獲選香港

  電影金像獎「年度十大華語片」。


  值得一提的是，此次「油麻菜籽」數位重映版，是原始台語配音版。原來當年為符合金馬

  獎「獎勵優良國語影片實施要點」報名規定，「油麻菜籽」不得不重新配成國語。如今由

  國家影視聽中心將40年前保存至今的原始台語版，洗清塵埃、恢復原聲後，終於讓新世代

  的影迷得以有機會，欣賞到原汁原味的台語發音。


  「油麻菜籽」透過母女與家庭故事，反映戰後台灣從農業社會進入工商業社會，女性地位

  的變遷。陳秋燕將傳統婦女的「油麻菜籽命，落到那裏，就長到那裏」的認命觀念，刻劃

  得淋漓盡致。對照飾演她女兒的蘇明明代表的戰後嬰兒潮新女性，則是由茫然順服到不甘

  屈從，終因受過完整教育與獨立主自的經濟能力，得以突破命運擺布，找出新的人生出路

  。


  由於當時適逢女性主義正要在台灣萌芽，在新舊社會交替的浪尖上，「油麻菜籽」的原著

  小說、電影，李宗盛詞曲、蔡琴演唱的同名主題曲，都引起廣大共鳴，感動無數女性觀眾

  。


  褚明仁表示，「油麻菜籽」如此豐厚與寫實反映出台灣女性地位變遷，與女性如何面對傳

  統與現代衝突，無論在文學、戲劇和音樂角度，都是屬於台灣這塊土地上，典型的「國民

  集體記憶」，值得現今的新舊影迷們重新感受體會。


  「油麻菜籽」將於5月12日全台上映。（編輯：管中維）1120328


  預告:



  --'
