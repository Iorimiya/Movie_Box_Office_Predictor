title: '[情報] 《千年決鬥》Versus 上映戲院列表'
content: "《》導演震驚全球代表作！\n\n【】12/22(五) 全台上映\n\n\n\n  前所未見的戰鬥即將展開…\n\n\n\n《》Versus\n\n\
  12月22日 (週五） 殺戮輪迴\n\n世上有666道連結另一個世界的大門，其中第444道門就藏在日本的「黃泉森林」裡。\n\n現代日本，囚犯KSC2-303（坂口拓\
  \ 飾）在隸屬於某幫派的獄友的協助下逃獄，卻發現前\n來接應的黑幫份子綁架了一名女子。\n\n為了解救女子，KSC2-303出手殺掉了一名黑幫成員，並帶著女子逃入森林之中，在躲避黑\n\
  幫成員追殺的同時，潛藏在森林裡的殭屍大軍也朝兩人襲來……。\n\n《》日本動作名導 震驚全球代表作\n\n「」日本知名武術指導  領銜主演\n\n《滾石雜誌》譽為「宛如\
  \ 重拍《》」\n\n2000 東京國際奇幻影展 正式入選\n\n2001 多倫多國際影展「午夜瘋狂」單元 正式入選\n\n2002 西班牙錫切斯奇幻影展 正式入選\n\
  \n #車庫娛樂\n\n資料來源：\n--"
