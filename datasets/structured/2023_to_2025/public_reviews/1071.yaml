title: '[請益] 請問有人看了《屍咒》了嗎'
content: '同屬韓國片，但《破墓》也還沒看

  最近又看到（好像？）一直在主打這部很精彩的宣傳詞

  但是這兩年台灣實在是太多一堆韓國電影

  在那邊蝦G8的騙說又超越了誰又多精彩叭啦叭啦的

  結果韓國片都是一模一樣差不多的套路跟調調

  目前不考慮兩部都看

  不是因為怕花錢純粹只是不想浪費時間

  我就是想問說《破墓》跟這部《屍咒》到底是應該選哪部來看？



  --'
