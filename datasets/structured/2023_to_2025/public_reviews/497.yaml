title: '[新聞] 「臨演人生」首映 導演勉人生會跌跌撞撞'
content: '「臨演人生」首映 導演勉人生會跌跌撞撞仍要勇敢



  2025/2/26 18:45（2/26 19:01 更新）


  （中央社記者王心妤台北26日電）紀錄片「臨演人生」聚焦臨時演員的故事，導演伍心瑜

  帶著片中人物張可韓出席首映會。伍心瑜誇獎張可韓拍攝期間成長許多，並勉觀眾人生就

  像電影跌跌撞撞，仍要勇敢感受並經歷。


  伍心瑜昨晚在首映會上表示，張可韓是最早被拍的對象，拍攝期間能看見他的成長，變得

  更有自信，印象深刻是張可韓雖然話不多，卻在表演很執著。


  伍心瑜也說，被拍攝的孟婕、龍哥或是張可韓，他們除了都熱愛表演，卻也面臨現實壓力

  ，希望能在片中呈現真實。


  伍心瑜表示，希望電影能觸動觀眾，演員無法拿到理想的角色難免會失望，「但人生就像

  電影一樣跌跌撞撞，但是要記得爬起來，不要害怕失敗，要勇敢去嘗試、去經歷、去感受

  。」


  伍心瑜也說，紀錄片不只拍下臨時演員的心聲，也有她個人的成長，這是關於臨演們的真

  實人生，也會是曾經或現下，在現實與夢想掙扎中每一個人的故事。


  「臨演人生」將於28日上映。（編輯：龍柏安）1140226



