title: '[影評] 謊島美人魚'
content: '製作花絮


  英皇電影

  彭浩翔 監製

  溫碧霞 出品

  主演:

  溫碧霞、禾浩辰、家寧、董仔

  歸亞蕾、庹宗華、吳大維、李杏

  董志成、黃詩棋、劉國劭、雷艾美

  編導：廖銘賢



  最近該看的片都看光了

  去二輪想隨便挑部片看

  不然免費的票隔天過期


  從古天樂的送院途中

  跟這部之間做選擇

  最後因為溫碧霞彭浩翔

  所以選擇看這片


  想說彭大導監製的片應該不會太差

  只是這片一看就是很快就會下片的

  可能他們只想拍她自己的故事吧

  又是英皇出品，所以很多明星來演


  這片好像是溫碧霞出品的片

  可能是拍她爸媽的故事?

  這戲在講母子戀的故事

  很像最近江祖平的新聞

  不過這齣戲是好的結局


  講溫碧霞59歲

  透過交友軟體跟

  34歲的禾浩辰網戀

  兩人相差25歲


  溫碧霞前夫是58歲的吳大維

  前夫跟41歲的李杏再婚

  兩人好像沒有小孩


  禾浩辰因為要幫外島土豪

  董志成拍電影，被邀請去作客

  剛好溫碧霞在島上開民宿

  又剛好住在她的民宿裡


  這戲跟莎莉和我談的那場戀愛

  都是在講女人用交友軟體的戲

  但上面兩部是講詐騙

  這戲也算是騙，因為溫碧霞不敢露臉

  但禾浩辰有露臉，所以敵暗我明


  禾在島上溫開的民宿裡寫劇本

  溫不斷主動靠近，但因為年齡

  所以一直不敢表態，怕嚇跑禾


  最後兩人當然還是相認在一起

  但禾會願意跟溫在一起是有遺傳的

  原來禾的媽媽81歲的歸亞雷

  跟爸爸62歲的庹宗華

  也是差19歲的老妻少夫

  正應驗現在阿姨不想努力這句話


  當然庹宗華也是

  看歸亞雷老了就劈腿

  跟吳大維一樣看老婆老了

  就離婚再娶嫩妻

  好像是一種生態


  難怪這戲在台草草下檔也沒人討論

  可能主攻中國就沒在台宣傳吧

  現在知道溫碧霞的人應該也不多

  在台灣禾浩辰應該才是這戲主秀


  以前溫碧霞也算蠻紅的

  都是港片常出現的一線女主角

  但最後嫁人也就淡出影壇


  這戲我感覺應該找林青霞來演

  因為林青霞以前也演過類似的

  片名叫【今夜星光燦爛】

  是許鞍華1988年導的港片

  監製是霸王別姬的湯臣老闆徐楓


  劇情是

  二十年前，大學生林青霞

  與她的教授林子祥墜入愛河

  可惜教授已經有老婆小孩。


  二十年後，林當當了社工

  在澳門接觸問題少年吳大維。

  她完全忘記了自己的專業精神

  很快就捲入了與男孩的熱戀關係


  卻在因緣巧合下發現吳

  竟是她舊情人林子祥的兒子......

  林青霞跟吳大維大概差一輪12歲

  想到江祖平跟前男友也差20多歲


  但這戲應該還是請不到林青霞來演

  除非導演是李安，她才能放心來演

  不然演了也會像這戲一樣草草下檔

  這戲結束說要紀念兩個人

  可能是溫碧霞的爸媽?

  所以這是溫碧霞她自己的電影

  找專業的英皇跟彭浩翔操刀

  但應該砸了錢會賠到死吧

  如果她老公很有錢那就算了


  不過這戲雖然普通

  但演員都是我認識的人

  還看到網紅家寧在裡面當臨演

  最近常上社會版才認識她

  她在裡面跟其他網紅演

  年輕的民宿女遊客

  被禾誤認為是網戀的對象

  但被家寧的朋友嫌禾是中年大叔


  禾在戲裡好像在演程偉豪導演

  造型一整個就像是在演程偉豪

  就是個不太得志很窮的電影人

  留個鬍子戴個眼鏡模仿的真像


  庹宗華這戲演的真的有夠老

  從沒看他那麼老過，像刻意扮老

  或著是其他的戲他刻意扮年輕

  這戲不修邊幅就老得很自然


  溫碧霞就感覺妝化得很濃

  很像京劇的臉譜想遮住皺紋

  但兩頰的法令紋還是騙不了人

  配角雷艾美臉就很像整形美女

  但演技是不錯，但臉就很不自然


  三個女網紅也都很嬌氣

  家寧還被千夫所指社會性死亡

  吳大維的新歡李杏也演的很壞

  總之這戲好像只有禾還能看


  董志成臉變型後好久沒看他演

  這次跟溫一樣再次復出演土豪

  演戲功力還是很棒不減當年

  人在逆境時戲都演得特別好

  也算是一種情感宣洩


  總之這戲真的有夠爛

  但那麼多大咖也算有點誠意

  至少比亂拍的台北物語好很多


  不知道林青霞何時會復出

  看葉德賢都拿威尼斯影后

  現在都跟柯林法洛演洋片


  但願林青霞跟張曼玉

  也能像鄭佩佩葉德賢一樣

  接到能拿奧斯卡的好戲

  一片就能入圍奧斯卡影后

  就像功夫的火雲邪神跟包租婆

  一片就能讓當年的巨星起死回生


  還是得靠好萊塢的導演賞光才行

  期待首位奧斯卡黃種影帝會是台灣人



  --

  現在紅不紅都很難講

  因為他都還有在線上

  說不定未來一部國際大片

  就能把他捧成奧斯卡影帝

  但只要一離線就很難再演

  因為顏質可能會變差很多'
