title: '[好雷] 《電影版 神奇柑仔店 錢天堂》，吃下一口'
content: "部落格版：\n\n先說結論，連我自己都很意外我會覺得《電影版 神奇柑仔店 錢天堂》好看，因為我個人\n不是很喜歡電視動畫的風格，總覺得有種說不上來的僵硬感，而且每次看著紅子、澱澱在\n\
  端出錢天堂、倒霉堂的零食時，都會讓我有在看另種版本的《哆啦A夢》的錯覺。當知道\n改編成真人版電影的時候，我跟我平常就會看《神奇柑仔店 錢天堂》的家人就在討論，\n\
  這部電視動畫要怎麼改編，甚至怎麼會找不論怎麼想都想不到會是她的天海祐希來詮釋紅\n子？可以說，我是抱持著各種疑問進場觀賞《電影版 神奇柑仔店 錢天堂》，但真的就是\n\
  沒有想到，天海祐希在特效化妝的幫助下，加上其說話的語調與醇厚的嗓音，還有整個人\n散發出來的氣質，直接讓我的疑慮瞬間消散，完完全全成為了紅子這個角色。不僅如此，\n\
  或許是動畫畫風所致的不自然僵硬感，在真人版電影裡完全不見這個問題，反而更多了我\n從動畫感受不到的魅力。\n\n我認為《電影版 神奇柑仔店 錢天堂》是即使沒看過電視動畫或者廣嶋玲子老師原著小說\n\
  的觀眾也能輕易入口的。因為某方面來說，《神奇柑仔店 錢天堂》確實可以想成是沒有\n野比大雄而只有哆啦A夢的《哆啦A夢》。紅子沒有固定的客人，只有每天挑選中的幸運客\n\
  人，這些人會在黑貓的帶領下來到錢天堂，而她會聽取他們的煩惱然後端出適合他們的零\n食，能夠助他們實現心願、達成目目標。或許最大差別在於，紅子的錢天堂不像哆啦A夢\n\
  的百寶袋相對和善，她的零食都是有必須遵守的食用規則，倘若違反規則或是過度濫用，\n反而會有不好的事情發生。此外，雖然《神奇柑仔店 錢天堂》隨著劇情開始有許多角色\n\
  會固定偶爾出現，除了常駐對手澱澱，還有我忘記名字的男孩跟女孩、試圖調查錢天堂的\n教授等等，因此後面劇情逐漸發展成在主線之下是藏有數條支線並行的走向，不過由於真\n\
  人版電影只有安排澱澱登場，而她與紅子也能想成是簡單的同行競爭關係，所以真人版電\n影可以說沒有觀影門檻。\n\n　\n「以簡單的方式達成願望，一定要付出代價。」\n\
  \n電視動畫的版本裡，紅子就像是個說書人，說著一個又一個與錢天堂產生關係的人們的故\n事，從她的視角來看那些每個走進錢天堂裡的客人，他們收穫了多少又或者付出了多少，\n\
  招財貓與不幸蟲的誕生，是人們心底慾望與渴求的界線兩端，對於人們的選擇她從不插手\n而是指引方向，此後的結果是欣慰亦或惋惜都於一念之間。而這些單篇故事的最後，遭到\n\
  慾望吞噬的人們往往都會對自己無法遵守食用規則感到懊悔，紅子這時便會用著說書人的\n口吻替這些故事留下註解。這樣的收法沒問題，不過這比較像是見過太多相同遺憾上演的\n\
  紅子會有的「感觸」，偏向於要觀眾自己去思考與理解紅子的話中含義。但真人版電影卻\n因為原創角色小太郎的出現，不僅只有聽說與目睹，且更曾經有過親身經歷，反而給同為\n\
  平凡人的觀眾製造了能夠「體悟」的機會。最後讓小太郎與紅子面對面進行對話，直接拉\n近觀眾與故事寓意的距離。\n\n從開頭為求得到好成績的小學生雄太到渴望能力被認可的時尚雜誌編輯相田，是我認為《\n\
  電影版 神奇柑仔店 錢天堂》的前半段，走入錢天堂之前與之後的轉變，等同介紹了紅子\n與錢天堂給初次認識她們的觀眾，中間沒有完整故事僅是略為提到的，想受女生歡迎的男\n\
  學生和想擁有模仿能力的女學生，從他們慾望而生的倒霉蟲與招財貓，順著紅子的話切進\n《神奇柑仔店 錢天堂》的故事核心。然後，觀眾不只知道了錢天堂的零食怎麼製造，也\n\
  知道了與之敵對的澱澱與倒霉堂的存在，而也是從這裡開始，《電影版 神奇柑仔店 錢天\n堂》進入了後半段。紅子與澱澱、小太郎與相田、小圓與百合子、小太郎與紅子...，本\n\
  來多條互不相關的支線，都在後來逐漸匯聚成一條明確的主線，彼此的關係不僅有了解，\n紅子、也就是《神奇柑仔店 錢天堂》想傳達的信息亦成功傳達。\n\n\n「每個人都有要依靠某些事物的時候，但是...，如果你希望的話，就能成為自己想成為\n\
  的人。」\n\n《電影版 神奇柑仔店 錢天堂》用著比電視動畫更為成熟的口吻來表達觀點，可同時依然\n保有著那份童趣，在大人與小孩間找到一個平衡點，讓不同年齡層的觀眾都能有所收穫。\n\
  過去在看電視動畫時，我時常在想紅子與錢天堂其實不就是沒那麼偏激的澱澱與倒霉堂？\n同樣都是替有煩惱的人們實現願望，代價付的多或者付的少有何差別？在我眼裡看來兩家\n\
  店的零食是一樣的，都讓人們嚐到不勞而獲的甜頭、讓他們有了依靠旁門左道就能達成目\n標的錯覺。但真人版電影卻可說是直接用紅子的話說服了我。如同紅子所言，她提供了零\n\
  食也等於提供了選擇給每個客人，也許多數人都在嚐到甜頭後胃口大開索求無度，卻也有\n少數人知足感謝於錢天堂零食的效果，那些原來以爲的不勞而獲，其實是給人們一個開始\n\
  、一個可以在有了勇氣與動力後朝目標努力的開始，如當年的小太郎、現在的女學生與後\n來的雄太。\n\n 《電影版 神奇柑仔店 錢天堂》相當清楚知道劇情想說什麼，簡單而直接、帶點誇張的\n\
  ，俗套卻有效的從台詞、從表演傳達出來。雖然我覺得近尾聲時，小圓與百合子的友情略\n微矯情，而紅子對決澱澱的部分不夠精彩，不過從整體看依然超乎我預期的還要喜歡。就\n\
  選角方面，除了天海祐希飾演的紅子外，我也覺得上白石萌音詮釋的澱澱是整部電影最好\n的選角之一，我特別喜歡她充滿奸巧的狡詰笑容，還有那雙生動的雙眼，是所有角色中靠\n\
  表情就能取勝的一位。此外，飾演相田的伊原六花同樣讓人驚艷，隔著銀幕都能感受到她\n的走火入魔還有那股病態感，在她的支線故事裡成為最亮眼的存在。真的可以說， 《電\n\
  影版 神奇柑仔店 錢天堂》是各方面來看都能說是成功的真人版電影。\n\n--\n\n\n因為很喜歡看電影，\n或許不是寫得很好，\n不是所謂的專業影評，\n只是很單純的想把看完電影後的想法用文字述說出來。\n\
  \n--"
