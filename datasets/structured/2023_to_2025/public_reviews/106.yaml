title: '[情報] 《電影版 神奇柑仔店 錢天堂》電影預告'
content: "歡迎光臨錢天堂！\n\n熱銷千萬冊奇幻作品登上大銀幕\n\n\n\n《》\n\n9月26日(五) 全台上映\n\n  \n\n你所選的點心…會帶來幸福還是招致不幸呢？\n\
  \n\n改編自日本作家廣嶋玲子全球熱銷1000萬冊奇幻原作！\n\n《七夜怪談》《原本以為只是手機掉了》\n\n中田秀夫奇幻鉅獻\n\n《貓的報恩》編劇吉田玲子打造劇本\n\
  \n「天海女王」ｘ「浪花男子」ｘ《你的名字。》 精彩共演\n！\n\n\n新手教師等等力小太郎（大橋和也 飾），從學生那裡聽到關於不可思議的柑仔店「錢天\n堂」的傳聞，據說只要吃了奇怪的店主紅子（天海祐希\
  \ 飾）推薦的點心，就能實現願望\n，但如果搞錯食用方式或使用方法，就會產生可怕的後果。\n\n不久後，疑似買過錢天堂的點心的人們開始出現異狀，小太郎心儀的雜誌編輯相田陽子（\n\
  伊原六花 飾）也逐漸失控。\n\n就在這時，小太郎發現還有另一間柑仔店「倒霉堂」，那家店的店主澱澱（上白石萌音\n飾）會收集人們的惡意，製作成點心後販售。\n\n\
  小太郎為了守護重要的人們，與紅子一同追擊澱澱……\n\n--"
