title: '[負雷] 龍之心-靈界探訪記-'
content: '雷文防雷資訊頁



  剛看完《龍之心-靈界探訪記-》這部電影，來分享一下心得。


  事前沒有看任何宣傳或預告，

  我看完去查才知道，

  原來這部的製作總指揮大川隆法是日本一個新興宗教「幸福科學」的教主，

  本來以為是冒險故事，結果是某宗教的宣傳動畫？


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  故事講述愛爬山的主角龍介，和表妹知美騎著龍開啟前往靈界的旅程。

  兩人穿越各個地獄，面對未竟的課題與內心的懊悔，

  踏上一場尋找自我與意義的修行之路。


  最近才接連看過好幾部動畫電影，

  包含宮崎駿的紅豬那種無比純熟的作品，

  難得看到這部做得這麼爛的，

  號稱「細膩的美術設計和奇幻氛圍」，但實際上作畫實在不怎麼樣，

  本來應該很壯觀的風景或靈界場景都不夠細緻。

  男女主角一直瞪著圓圓的眼睛擺出一副僵硬的微笑表情，

  突然被一條龍給救了卻正眼不瞧一下，

  連那條龍也是一直擺著一張蠢萌正臉，

  畫面還特別久，看了挺好笑。

  然後我才剛看過兩部很好的3DCG電影，

  這部背景路人和爆炸的3D畫面品質也差得太多了吧。


  角色間的對話簡直是教科書等級，

  「你還好嗎？」「我很好。」「你們有什麼感想」

  內容挺正常也不是棒讀，

  但台詞內容就像是在教科書對話一樣照本宣科，不怎麼生動。


  然後中間插入好幾首歌曲，我本來是很喜歡電影插入歌的做法，

  但在這一部裡，也不是說難聽啦，

  不過就一直讓我聯想到小灰鼠冒險途中響起的歌曲。



  以前看不少動畫會覺得主角遭遇心理挫折之後努力振作的劇情老套，

  現在我才知道還真的有必要。

  這部男女主角兩人本來就沒有遭遇什麼人生的迷茫或難題，

  就是普普通通，有各自興趣的國中生，

  讓他們去探訪地獄我實在不懂是要讓他們悟透什麼道理，

  從郊外山中突然進入氛圍差很多的地獄，

  很多混混的街道、拿電鋸截肢的醫院、遭遇恐怖攻擊的列車、困住被害女人的洋樓，

  既沒有探險解謎，也沒有讓主角們得知什麼深刻的意義，

  主要就是強調很多人連自己死了都沒發現，

  「人的本質是靈魂不是肉體」

  搞不懂去地獄這趟是能成長什麼。


  然後在後段，主角們見識過地獄裡的人們很可憐，決定想要幫助更多人，

  於是又搭著龍穿越洞庭湖的桃花源，跑去尼泊爾的香巴拉，見到許多修行者，

  然後根本什麼事也沒做，自己也沒修行，就是去逛了一圈而已？

  洞庭湖娘娘和修行者出場有什麼用？


  最後跑去參觀「地球神」的加冕典禮，

  我還在猜是誰有這麼高的身分讓地球的眾神都來拜，

  結果是位前所未聞，名為「艾爾康大靈」的巨大神。

  女主角做出結論：「原來神一直在關愛我們！」

  男主角：「要傳達給人們知道！」

  你們從前面是怎麼得出這結論的啊？



  這部看下來總覺得各種突兀，

  例如普通的開頭突然冒出風格差很多的大標題（倒是挺有喜感）

  那個「龍之心」還有一開始出現的幽靈和河童根本沒派上用場嘛。

  不過槽點雖多整體倒也不草率，不至於混亂，而且竟然能做到兩小時，有夠長。

  總之挺微妙的作品。


  --



  以前沒聽過這人，現在知道了…

  中間莫名閃過天安門，還有洞庭湖跟桃花源，但就路過而已不知道幹嘛的。

  哈哈我還真的是，原本想像成像地海戰記或追逐繁星的孩子那種故事。'
