url: https://www.ptt.cc/bbs/movie/M.1508608434.A.3B2.html
title: '[問片]超舊美國片，廢男被化學廢料潑到變怪物'
content: "很小的時候看到的(當時應該是大人租的錄影帶)，應該至少距今25年有喔\n\n劇情大概是描述一個廢男(高中生?) 常常被學霸欺負、霸凌、惡整\n\n\
  廢男還暗戀一個正妹，但是正妹好像是個瞎子??(有點忘了\n\n有一天 廢男 莫名其妙被 一車載滿化學核廢料潑到\n\n(這邊我忘了  好像是被惡霸欺負，從樓上窗戶丟下，\n\
  \n結果掉到樓下卡車載滿核廢料桶中)\n\n    從此廢男毀容(連她媽都不認得) 變壯，力大無窮，變成了噁心的怪物\n\n後面大概就是核廢怪開始把瞎正妹，暗中保護瞎妹，同時對以前常常欺負他的惡霸復仇\n\
  \n    還有一幕印象深刻的是，核廢怪夜晚路邊隨地往牆邊尿尿，好像有特寫他的尿，\n\n好像硫酸一樣，會腐蝕地面而且冒出一堆煙(我無法理解當時導演想幹嘛)\n\
  ---------------------------------------------------\n\n\n當時年紀很小，大概只記得這麼多。\n\n如果有大大知道這部片，我會很不可思議XD\n\
  \n以上，感謝閱讀。\n\n----------------------------------------------------\n\n已解決  沒錯!!!!\
  \  阿阿阿阿阿阿阿阿 阿\n\n我好興奮阿!!!!  就是  毒魔復仇(1984)\n\n大大們真是太威能啦!!!!\n\n解決了一個人生疑惑!!\n\n大感謝!!\n\
  \n(標題分類[問片]需要 改嗎? 版規好像沒特別說明)\n\n\n--"
