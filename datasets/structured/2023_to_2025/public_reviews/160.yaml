url: https://www.ptt.cc/bbs/movie/M.1756614088.A.B13.html
title: '[好雷]'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  《毒魔》(The Toxic Avenger)的宣傳標語是這樣子寫的：「我們真正需要的超級英雄」

  。如果這是一部主流大製作的超級英雄電影，這聽起來會像是個偷懶的文案，而因為這部

  電影是重拍一個知名/惡名昭彰的B級邪典英雄電影，那套上這個標語，看起來則既像反諷

  、又像自嘲。

  .

  然而有趣的是，實際看完《毒魔》之後，發現這句話竟有點貼切。我是說，這部電影乍看

  之下還真不是什麼好東西，我是沒看過原版啦，但那片怎麼看都是一部亂七八糟的剝削電

  影，原本以為這片就是那種毫無極限的敗德、無論是視覺還是心理上都幾乎是在挑戰觀眾

  道德底線的電影，就是那種丟出一堆聳動的議題跟畫面，而且目的完全都只是為了觀感上

  的刺激而非拋出省思與討論、然後完全沒有打算為什麼良知負責的純粹B級爽片。

  .

  但這樣講似乎太對不起《毒魔》了，看完電影後，我才發現原來我也不小心落入了以貌取

  人的刻板印象裡面，因為毒魔這個角色還真的是「我們真正需要的超級英雄」。我這樣說

  好了，《毒魔》簡直就是我最近看過的電影中對於「超級英雄的形象與責任」最歌功頌德

  、最真正在宣揚愛與和平還有真善美的電影。

  .

  我是說，電影確實不乏血流成河的動作戲沒錯(而且還有不少內臟特寫跟掏肛戰術)，但如

  果單以「英雄」的描述來看，毒魔這個角色根本可以說是個典範型的人物：他純粹又純真

  到不行，當他獲得超能力之後，他立即開始見義勇為得打擊犯罪，而他不為錢也不為權，

  甚至不是為了達成什麼父母長輩的期許，單純是因為他想要/喜歡這麼做、這是他的責任

  ，事實上，在他獲得超能力前，即便他對於威脅鄰居的惡人無能為力，但也還是捨身拯救

  了被害人丟到馬路上的貓咪，這樣如本能般義無反顧的助人行徑，無論有沒有超能力，毒

  魔無疑是個由內而外的真正英雄。

  .

  而毒魔身為一個身體變異/肉體恐怖派的英雄，這電影主題理應是毒魔對於自身怪異模樣

  的自我質疑與厭惡─就像《驚奇四超人》中的石頭人那樣─然後意外的是我們的毒魔完全

  是個樂天派，外貌的改變對他來說似乎毫無影響，他根本沒花半點時間去糾結這件事情，

  更誇張的是，別說他自己，當他完成一次英雄義舉時，這個城市所有的人竟然馬上接受了

  他，全片沒有任何對他外貌的惡言相向或是冷嘲熱諷，而是為他鼓掌及喝采，這哪是什麼

  敗德邪典？這部電影根本是在描述一個美好烏托邦吧！

  .

  存好心，說好話，做好事，他在成為英雄之前就是個盡忠職守好員工，他不僅敦親睦鄰還

  父慈子孝，甚至在行俠仗義之餘還會好心且熱情的教觀眾如何考出最好吃的吐司，對於美

  味秘訣毫不藏私，但又謙虛地跟觀眾說這只是建議而已，你完全可以根據自己的喜好調整

  各種搭配。看看這個男人是怎麼樣的一個形象：古道熱腸、尊重、友善、包容，看完《毒

  魔》後，它都讓我想成為一個更好的男人了。

  .

  我之前看完《侏羅紀公園：重生》之後，曾跟朋友半開玩笑地說道，好萊塢最愛餵給觀眾

  的一個春藥就是「有錢的資本家都是壞人」，這片也是那種「有錢人壞壞」的電影─由性

  感的凱文貝肯演出一個極為漫畫浮誇的萬惡資本家─而《毒魔》就是一個如此勵志的電影

  ，小蝦米鬥倒大鱷魚的劇情人人愛看，那種明知不可為而為之、雖千萬人吾往矣的決心與

  氣魄都讓我們感到崇敬，不由得感嘆要是世界上真有毒魔這樣如此高尚之人該有多好。

  .

  《毒魔》應該要成為每個小孩的指定教材，你必須讓你的孩子認識毒魔，這樣他才知道什

  麼叫做一個善良的人、什麼叫做一個好人、什麼叫做一個英雄，如此一來，他才能夠見賢

  思齊─凱文貝肯當然也能讓他見不賢而內自省，就算未來沒有想要創業，至少也該知道遇

  到什麼樣的老闆必須快逃─了解自己長大後該成為一個什麼樣的大人。

  .

  當然前提是如果你能接受你的小孩看到血肉橫飛的動作場面、短暫露出的胸部跟生殖器官

  、還有毒魔用他變異的雞雞噴灑腐蝕性尿液這些畫面的話啦。


  --'
