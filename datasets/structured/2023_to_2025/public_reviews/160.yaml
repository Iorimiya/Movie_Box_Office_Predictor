url: https://www.ptt.cc/bbs/movie/M.1750864828.A.869.html
title: '[情報] 《毒魔復仇》重啟版正式預告'
content: '《毒魔復仇》重啟版正式預告




  翻拍自八零年代超級英雄恐怖喜劇系列《毒魔復仇》（The Toxic Avenger）的新版同名

  電影


  準備於 08 月 29 日登陸北美院線。


  本片由《無處為家》（I Don''t Feel at Home in This World Anymore）導演麥肯布萊爾

  （Macon Blair）編劇及執導


  主演卡司則囊括：


  珍李維（Jane Levy）、凱文貝肯（Kevin Bacon）、泰勒佩姬（Taylour Paige）、彼得

  汀克萊傑（Peter Dinklage）、雅各川布雷（Jacob Tremblay）、茱莉亞戴維斯（Julia

  Davis）、伊萊亞伍德（Elijah Wood）、以及同時兼有演員身份的布萊爾自己。


  新版《毒魔復仇》以汀克萊傑飾演的化工廠工友「溫斯頓古茲」為主角，溫斯頓因為遭逢

  可怕的工廠事故而導致身體產生異變，他因此受到社會排擠，卻也因而獲得強大的超凡力

  量，並決定利用這股力量行俠仗義。




  --'
