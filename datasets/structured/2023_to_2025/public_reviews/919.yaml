url: https://www.ptt.cc/bbs/movie/M.1718542323.A.5F7.html
title: '[情報] 泰國破億喜劇【猛鬼聲泣泣】7/5台灣上映 '
content: '地表最狂鬼滅大媽，單挑猛鬼救村莊




  精彩正式預告︱




  ● 泰國年度現象級電影誕生！勇奪泰國首週票房冠軍！

  ● 首日票房衝破2000萬台幣，榮登泰國單日觀影人次NO.1！

  ● 2024泰國年度票房NO.4，票房飆破1.3億台幣！

  ● 今年最驚奇好笑的恐怖喜劇，沒有之一！

  ● 笑鬧更勝【淒厲人妻】，幽默玩轉【鬼聲泣】【送葬人】泰國熱賣鉅作！

  ● 大膽嘲弄泰國政治社會時事，人鬼亂鬥、詼諧玩笑、劇情彩蛋一籮筐！

  ● 泰國恐怖喜劇泰斗普安農執導，笑點、嚇點、淚點一應俱全！

  ●「泰版星爺」賈圖隆彭拉本領銜主演，偕親女兒帕莎功彭拉本共同搞笑演出！

