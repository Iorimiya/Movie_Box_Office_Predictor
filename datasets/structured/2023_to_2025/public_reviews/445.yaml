title: '[爛雷]  古曼童：母愛降靈'
content: '‧


  很少機會能看到菲律賓電影能在台灣上映，雖說是菲律賓電影，但卻是滿滿的泰國元素，

  繼上一部越南電影「開棺」後，想不到還不到一個月的時間，就刷新了2025最難看鬼片的

  寶座。


  「古曼童：母愛降靈」講述一段因意外失去孩子的母親，用異常的執念求助於古曼童，讓

  死去的孩子回到手邊；全片充斥了無新意的劇情、低廉的特效音效，以及全部演員的演技

  不在線，雖然恐怖氛圍與畫面風格勉強還算及格，但論恐怖度來說，對於常看鬼片的觀眾

  ，可以說恐怖度趨近為零。



  ‧


  整部電影吐槽點滿滿


  當女主角因認識第二春，前往泰國要去見未來婆婆，試問...有哪個未來媳婦見未來婆婆

  會抱著骨灰罈去？


  古曼童好歹也是泰國靈界的大咖，片名也掛著人家的名字，整部片搞得跟臨演一樣，導演

  編劇就不怕人家半夜來找你嗎？

  做為選美皇后的女主角，外型亮不亮麗不評論，但表情演技實在有夠僵硬，完全感受不到

  對於母愛的執著。


  在市場追討骨灰罈的橋段，整段用慢動作就算了，女主角整路一直撞到路人，還不斷道歉

  ，妳是真的有心想追回來嗎？


  女兒整部片吵鬧的頻率真的有點煩人，未來阿嬤叫妳放個東西也能搞砸，也是厲害；有些

  影片拍可愛的女孩是騙人生女兒，但本片是勸人別生女兒。


  婆婆因為太愛自己兒子，三番兩次在門口偷聽夫妻對話，真的有變態；捨不得兒子被前後

  兩任妻子佔有，謀殺了前妻，還後化為鬼魅來復仇，所以這是段婆媳關係問題及兩鬼yy組

  隊復仇的故事。


  最後男主角長的滿像小姐不熙娣的派翠克，有夠讓人出戲（笑）



  ‧


  古曼童：母愛降靈是部幾乎全方面都非常不及格的恐怖片，尷尬的演技、低廉的特效、可

  笑的劇情以及完全不恐怖的嚇人手法，加上偏離真實正或陰古曼童儀式，在社群上被不少

  供奉古曼童的觀眾喊被誤解黑化；這週末如果閒閒沒事做，可以進場觀看，看完一起來罵

  。



  ‧




  追蹤茶太郎IG



  --'
