title: '[  雷] 花月殺手'
content: '三個半小時,對一部電影來說有點長到靠北

  更擔心會很難坐得住

  我現在只想跟過去的自己說你完全多慮了

  我甚至會希望他能演個三天半也沒問題

  這就是我此刻被深深撼動的心情寫照


  先聲明一下,這篇我會毫不保留讚美這部電影

  多少會帶有濾鏡去看待,畢竟是大螢幕看

  例如你問我悶不悶？我覺得完全不悶,根本毫無冷場

  但如果今天是小螢幕看呢？精神沒那麼好時看呢？

  （我出門前還睡了一下,可謂準備充足

  所以一些缺失可能會被自動忽略,還請多多包涵



  防雷










































  這部電影很鮮明的切成幾個風格

  簡單來說就是由貪婪、罪行和懸疑所組成

  一開始歐塞奇族的致富用了引人入勝的手法介紹

  連帶帶出1920年代的時空背景

  半小時以內我們就能感受到貪婪的存在無限膨脹

  更不用說剩下的三小時就是貪婪在驅使所有事情

  我在看的時候有好幾度想起逃出絕命鎮

  那種被白人生吞活剝的真實感讓我寒毛直豎

  雖然現在政治正確的矯枉過正會讓人多少忘記

  但手法用對了,百年前的恐懼一樣可以捲土重來

  而勞勃狄尼洛演的老頭更是佼佼者

  一開始的慈眉善目至少掩蓋了一些嘴臉

  但後面直接不演（雖然他是幕後黑手很明顯


  而罪行也是重重的深植人心

  基本上每個人都背負著罪行,就連歐塞奇族也不例外

  我想最適合拿罪行出來講的就是男主角了

  他幫忙做了一堆錯事,所以被判刑很正常

  我完全不覺得他是壞人,一句台詞道出他的性格：

  我愛錢,跟我愛老婆差不多的愛

  他是愛錢的,所以他傻傻的被舅舅利用

  但他同時是真心愛他老婆,所以他後面的掙扎就很精彩

  在他心中最有地位的就是錢和老婆

  這部電影就是他在這兩者間遊走的過程

  沒有要幫他開脫的意思,但我多少有點同情他

  他有罪,不至於到邪惡（有罪也是人並不完美的解釋


  我來說一下為什麼這部電影如此撼動我

  最大的原因在於前中段帶給我無比的沈浸感

  我彷彿實際參與這個故事,對於謀殺也如坐針氈

  這個感覺之深,從三個半小時我還意猶未盡可得知

  從FBI出現開始就進入懸疑的階段了

  即使我最喜歡的元素已經過了

  還是將故事本身的精彩延續到結束

  後段我最期待的就是布蘭登費雪

  可惜他的角色除了霸氣,呈現出的不多

  還是很高興能看到他,希望他接下來一切能順利

  我們也能看到FBI用著還不成熟的刑求在辦案

  不讓人睡覺我是覺得有點可愛


  我對馬丁史柯西斯的電影都有不確定的態度

  我對他各個作品的評價是兩極的

  這次就賭對了,我愛死這部電影了

  最後他本人出現也是對這部電影的特殊意義吧

  代表他特別重視這個作品,我猜

  畢竟他當時好像手刀買下小說改編權

  話說最後舞台劇的呈現方式真是棒極了

  富有創意又為故事劃下姿色的句點


  真的,我現在心情很滿足,這真的是十分傑出的一部

  如果有興趣,我會大力推薦去看

  但還是要提醒這不是所有人都喜歡的類型

  片長真的是一大考驗,雖然這部電影的節奏也很棒

  散場了我後面的人還說片子那麼長但不會無聊

  我好久沒那麼開心了,再次印證我對電影的愛

  希望大家都能好好享受這些電影

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  我見過...你們這些人不會相信的事

  我目賭在獵戶座的邊緣著火的攻擊艦

  我看見C光束在湯豪色星門附近，在黑暗中閃亮著

  所有這些時刻都會消失...於時間中，一如眼淚...消失在雨中

  死期到了


  --'
