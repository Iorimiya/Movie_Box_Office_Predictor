url: https://www.ptt.cc/bbs/movie/M.1697949166.A.349.html
title: '[普好雷] 就這樣?!沒有驚喜的花月殺手'
content: "這部我覺得還可以更好，普好雷的好是給演員還有四平八穩的導演，\n\n普是給令人失望的故事。還在觀望要不要進戲院的人如果考慮的點\n\n是悶不悶、美國印第安相關歷史不熟會不會影響觀影的話，我覺得\n\
  \n完全部用擔心，馬丁史柯西斯這方面的功力比前陣子諾蘭的奧本海\n\n默強太多了。\n\n\n\n防雷\n\n\n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n  這一部我覺得最大的問題是劇情太過平淡，沒有爆點，甚至沒有明顯高潮。\n\
  \n一開始引入角色，舅舅暗示明示得要來投靠的姪子搞聯姻拿財產，然後一步一\n\n步把人頭權全拿。這些陰謀講出來後，應該看過幾部電影或電視劇的都猜得出\n\n來，公式就是茉莉全家必須死然後接下來主線就是一個一個怎麼弄死。往後面\n\
  \n看之後，哇還真的是，而且執行得毫無困難、毫無阻礙、毫無懸念。然後就是\n\n茉莉自救找私家偵探被擺平。直到FBI出現，想說太好了，要開始轉折了，前\n\n\
  面2個多小時的伏筆要一一展開，導演跟劇本開show了! 結果並沒有，辦案的\n\n過程大概是電影史裡面最順利的，馬丁史柯西斯巧妙的展現了前後呼應法，毫\n\n\
  無困難、毫無阻礙、毫無懸念得破案了。整個過程中，一直在想說皮卡丘飾演\n\n的姪子會不會突然因為愛老婆覺醒然後跟舅舅弟弟對抗，有啦，遲到很久而已\n\n，都剩菜尾了...布蘭登費雪是驚喜，可是這個角色好雞肋。\n\
  \n\n  這部我沒有給負雷或純普雷，我認為還是有可看的優點。一堆tier 1的老戲骨\n\n正常發揮以外其他的演員也都可圈可點。勞勃狄尼洛把角色隱藏的城府駕馭的自\n\
  \n然流露；李奧納多狄卡皮歐有把角色的笨詮釋出來，情緒的表現也一如以往的熟\n\n稔。利利葛拉史東把這個角色的智慧內斂處理得也很好。幾幕吃演技的對戲這些\n\n\
  演員都有撐起來把情緒傳達到螢幕外。導演的基本功還是有夠穩，再來偷吐槽一\n\n下前陣子的奧本海默。這部一樣片長是要加錢那種甚至比奧本海默多了快半小時。\n\n\
  奧本海默讓我覺得像坐了5個小時，而且隨時可以小睡片刻都還接得起來，反正\n\n細節都看不懂，人物那麼多只要知道哪個是奧本海默都不影響。而花月殺手體感\n\n大概就2個小時，對於美國印地安人文化歷史一樣沒有背景知識，導演在前半段戲\n\
  \n裡穿插的幾個鏡頭很快得補足了essential。讓後面的戲可以無痛看懂。近三個半\n\n小時的戲裡面要我找尿點睡點還真的不好想出來。最後結尾說書的方式交代也是\n\
  \n有一點耳目一新。\n\n\n\n  整體來說我認為是有點可惜的電影，這麼大陣仗，全明星級的導演跟演員，三個\n\n半小時史詩級的片長，觀眾期待的是masterpiece、iMDB\
  \ top 250等級。出來的結果\n\n是請一個五星說書人念了一本無聊的故事書。\n\n\n--"
