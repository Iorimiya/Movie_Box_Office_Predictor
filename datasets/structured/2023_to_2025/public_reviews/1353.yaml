title: '[普雷] 關於花月殺手的人物內在描繪..'
content: '跟奧本海默類似，都是需要精神和耐性去消化的長電影


  檯面上會想豎起大拇指說好，但內心又覺得沒那麼喜歡


  差別在花月比較好消化吧(?)


  我個人很好奇角色內心狀態




  ------------防雷-----------








  他不全然是個混蛋，他是有愛的、有人性的

  以為劇情末段舅舅要他讓茉莉slow down的時候，他會猶豫

  沒有，他很分裂的全盤接受舅舅的命令... like a soldier

  當茉莉拒絕時，他也真實地用自己的情緒讓對方屈服

  可能導演少了描繪與獨白，加上李奧納多長的太聰明


  我很難說服自己：厄尼其實不知道自己做了什麼

  畢竟這麼多慘例在他面前，擁有人頭權的愛人將會如何?

  他很愛小孩，小孩沒了媽媽會如何？

  我覺得導演僅是用表面的指導讓李奧納多用力地皺眉

  硬性演出了兩種不協調的行為，中間少了衝突掙扎的描繪

  更沒有自我探索的過程




  茉莉很顯然比其他姊妹聰明一些、事故一些

  但給了她形象，卻好像沒一起給了腦

  我僅能勉強合理化：她是選擇愛情、信任


  即使面對牧師說出自己命不久已、最害怕的人是誰

  也絲毫沒有想向她信任的先生說出疑慮，或是檢驗

  躺在床上昏迷、只能依賴他人的狀態可以理解

  但還能跑去找總統的狀態，應該保有一定的行為能力?




  簡單地設定舅舅哈爾根奧賽奇人關係很好

  還能一同參加大會商討連環命案

  連茉莉的媽媽都感受到白化危機

  這些長老感受不出人頭權的轉移狀況？

  如果能有一些不一樣的質疑聲音，即使沒有成功也好

  但奧賽奇人竟然就這樣順應天命，毫無作為

  有點超出了純樸設定的範疇



  另外有個疑問：

  厄尼原先打算不作證了，但是得知小女兒過世

  導致他髮夾彎，又繼續指證舅舅並站在調查局那

  他對茉莉說：不會讓他接觸你們

  是懷疑舅舅那邊家族害死小女兒嗎(本就有百日咳)


  ---


  最後的感想是：





  劇情帶給人的FU，就微上微下的演過去了...




  《花月殺手》無疑擁有好的劇本與卡司

  但演繹上，演皮不演骨、有表沒有裡

  甚至也沒辦法好好發揮勞勃和李奧納多的演技


  個人覺得是部有意義的電影，但沒啥意思

  《奧本海默》雖然不好消化，但還是有視覺衝擊

  花月如同小說改編，維持小說型電影的感覺

  要不要進影廳看見仁見智...頗長

  只要調整自己期待、應該觀後感就不會差吧(?


  --

  只有這樣太少了，我以為會有他們族人自己的應對方式

  類似求助於神、占卜、靈媒...儀式化行為

  或是開始一起群居、呼籲不要烙單、成立守望相助隊之類的

  比較未開化的行為大概就這樣，不包含登報和上網


  她好像是被交代要問，但內心沒有更多想法似的木偶

  試圖掉包、倒掉、或是對丈夫有部分排斥比較合乎常理

  好呦~~謝謝你的回覆

  真的  角色缺乏細緻合理的人性與反應

  你自己腦補..還搞錯重點XD   根本沒講智能

  財產管理問題隨便查都有，不查也顯而易見

  無行為能力指的是面對親友遭害

  自己身體越吃藥還越衰弱的廣泛應對能力

  是覺得電影刻劃的太平面

  九死一生、老公都被偵查，到結尾了才問..'
