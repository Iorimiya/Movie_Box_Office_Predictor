title: '[新聞]《花月殺手》全新預告釋出三大影帝夢幻同框'
content: "《花月殺手》全新預告釋出！李奧納多、布蘭登費雪、勞勃狄尼洛，三大影帝夢幻同框\n\n繼《芭比》、《奧本海默》後，2023年最受矚目的電影！\n\n\
  BY AVRIL CHEN\n\n2023年7月6日\n\n\nCourtesy of IMDb\n\n由奧斯卡金像獎最佳導演馬丁史柯西斯（Martin Scorsese）執導的《花月殺手\
  \ Killers\nof the Flower Moon》即將於 10 月上映，昨日（7/5）再釋出全新預告，奧斯卡三大影\n帝 — 李奧納多（Leonardo\
  \ DiCaprio）、布蘭登費雪（Brendan Fraser）、勞勃狄尼洛\n（Robert De Niro）的同框畫面再度引起話題。《花月殺手》5 月在第\
  \ 76 屆坎城影展舉\n行首映，影片一播放完畢，觀眾立即起身鼓掌長達 9 分鐘，外媒也一致好評，甚至說這\n是李奧納多生涯以來的最佳演出，爛番茄開盤得到 96%\
  \ 新鮮度。\n\n《花月殺手》全新預告\n\n\n《花月殺手》劇情大綱\n\n該部電影改編自記者大衛格雷恩（David Grann）真實犯罪著作《Killers\
  \ of the Flower\n Moon：The Osage Murders and the Birth of the FBI》，小說出版 4 年後，由《阿甘\n\
  正傳》、《星夢情深》、《沙丘》編劇艾瑞克羅斯（Eric Roth）與導演共同編劇、翻拍\n成電影。\n\n故事描述 1920 年代的「歐塞奇印第安人謀殺案」（Osage\
  \ Indian Murders），當年印地\n安歐塞奇族（Osage）因發現油礦而一夜致富，引來白人入侵並慘遭流放後接連被謀殺，\n這是美國史上最殘忍大規模謀殺案，也是為美國歷史最黑暗的「恐怖統治」事件。此本小\n\
  說在 2017 年被《時代週刊》、《華爾街日報》和《赫芬頓郵報》等圖書網評選為年度十\n大好書之一。\n\n\nCourtesy of IMDb\n\n《花月殺手》演員名單\n\
  \n除了李奧納多、布蘭登費雪、勞勃狄尼洛三大影帝同台演出，還有曾二度拿下東尼獎最佳\n音樂劇男演員獎的約翰李斯高（John Arthur Lithgow）、《絕命毒師》傑西普萊蒙（\n\
  Jesse Lon Plemons）、《極地追擊》丹圖·卡蒂娜（Tantoo Cardinal），女主角則由莉\n莉葛萊史東（Lily Gladstone）飾演，於《花月殺手》片中的精彩演技被相當看好能走入\n\
  奧斯卡殿堂。\n\n《花月殺手》上映時間\n\n本片預定 10 月 6 日在北美部分戲院限定上映，隨後再於 10 月 19 日大規模上映（台\n灣亦會跟進上映），最後在\
  \ Apple TV+ 獨家播出。\n\n\nCourtesy of IMDb\n\nVOGUE\n\n\n--"
