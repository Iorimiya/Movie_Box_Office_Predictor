url: https://www.ptt.cc/bbs/movie/M.1706417079.A.081.html
title: '[討論] 花月殺手:美國白人唯利是圖 專長種族滅絕'
content: "看完的感想就是\n        美國人的專長就是立一堆法  掠奪北美印地安原住民的土地和財富\n        先把奧賽奇人從密蘇里州  趕到阿肯色州\n\
  \        最後再把奧賽奇人趕到當時貧脊荒涼的奧克拉荷馬\n\n        沒想到奧克拉荷馬挖出石油  讓奧賽奇人富得流油\n        美國人馬上就開始立法\
  \  規定奧賽奇人沒有行為能力\n        要讓白人來管理奧賽奇人的財產  每動用一筆錢都要跟白人監護人報告\n\n        然後一群好吃懶做的美國白人就蜂擁到奧賽奇人周圍\n\
  \        有的想入贅當金龜婿  有的賣奧賽奇人高價日用品噱凱子  有的負責謀殺\n\n        就像現在有一堆美國參眾議員蜂擁來台灣\n    \
  \    有的是拿了錢來照個相  當党的大內宣  有的是來幫美國軍火商賣軍火\n\n        即使奧賽奇人平均壽命只有50歲\n        不過很多美國白人都等不及了\
  \  直接做掉奧賽奇人賺錢更快\n        所以現在北美印第安人都已經被美國人種族滅絕了  只剩極少數住在\"保留區\"\n        就是美國白人住剩的地方\n\
  \n        花月殺手的故事不是特例\n        有另一部電影\"魂歸傷膝谷\"(bury my heart at wounded knee)\n\
  \        也是講美國白人當年如何威逼利誘  半哄半騙\n        把蘇族所有的土地騙到搶到美國白人手裡  最後蘇族只剩\"保留區\"可以住\n \
  \       更早的還有與狼共舞  也是講美國白人滅絕北美印第安人的故事\n\n        北美印地安人也不是特例\n        夏威夷人本來有自己的文化\
  \  自己的語言\n        現在你除了阿羅哈以外  夏威夷語已經瀕臨滅絕了\n        除了是渡假勝地及軍事基地還有草裙舞以外  夏威夷文化已經消失了\n\
  \n        現在貪得無饜的美國白人\n        已經掠奪完北美印第安人的財富及土地及太平洋各小島之後\n        就開始往亞洲下手了\n\n\
  \        所以這世界上  最擅長種族滅絕的  美國白人說自己第二  沒人敢說自己第一\n        或許只有西班牙人可以跟美國白人有得拚\n\n\n\
  \n--\n有位理髮師傅說過  別人刮你鬍子  是為了讓你更好看\n那時  我以為讓我好看  就是挑釁  以為先把自己武裝好  就是把鬍子刮好\n那樣的壞處是\
  \  我會把批評我的人  一律都看成是敵人  是來找麻煩的敵人\n他們只會挑我毛病  他們對我不公道    \nc\n但後來  我才發現  敵對久了  我真的和這些人對立了\n\
  對立了  冷漠就進來了  本來團結起來的溫暖就不可能了\n\n--\n\n正視？真正的正視不是應該把土地財富還給印第安人嗎？\n要不要每年訂個印第安紀念日向印第安人悔過？\n\
  這不就是最夯的轉型正義嗎？\n\n\n小弟哪有偷渡政治？\n美國白人當年北美13州的時候 有火鷄吃就要過感恩節了\n現在那麼有錢 不就是消滅印第安人 搶奪印第安人土地來的嗎？\n\
  \n\n        小弟哪有偷渡政治?  要是真的要偷渡政治的話  小弟就會說\n        看看賣給奧賽奇人1000多元的棺材  是不是很像賣給台灣的超高價軍火?\n\
  \n\n        我支持啊~應該先把以前台南高雄屏東被漢人佔領的土地還給原住民\n\n\n        這是你的猜測  小弟只想表達對花月殺手還有魂歸傷膝谷的看法\n\
  \n\n        花月殺手在講美國白人屠殺北美印第安人  你講新疆是不是在偷渡政治?"
