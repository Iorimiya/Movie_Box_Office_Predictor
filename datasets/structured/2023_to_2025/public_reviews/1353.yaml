  與李奧納多狄卡皮歐、勞勃狄尼洛兩大愛將再度合作，為了還原當代歷史，也必須製作許\n多特效場景，初估會與「愛爾蘭人」的逆齡特效一樣，成本同樣過億美金。\n\n馬丁史柯西斯也攜手經典電影「阿甘正傳」和「一個巨星的誕生」奧斯卡5度提名編劇艾\n\
  瑞克羅斯一同創作，也找來曾在「王冠」扮演首相邱吉爾，約翰李斯高並正式宣布加入卡\n司群。\n\n電影由美國記者兼暢銷小說作家，大衛格雷恩撰寫的「花月殺手：美國連續謀殺案與FBI\n\
  的崛起」改編，故事講述 1920 年代，印地安歐塞奇族慘遭流放後接連被謀殺的大宗血案\n，只因他們「幸運」身處的貧脊荒地滾出源源黑金...官商勾結的漠視吃案、跨州單位FBI\n\
  \ 的成立介入，看似曙光卻也是藉機壯大的假正義，種族歧視與不平等多年後是否獲得改\n善，還是一如往昔被刻意遺忘？美國歷史最黑暗的一頁。\n\n新聞網址：\n\n\
  --"
