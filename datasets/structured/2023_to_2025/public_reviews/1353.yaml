url: https://www.ptt.cc/bbs/movie/M.1697989461.A.E7E.html
title: '[普雷] 花月殺手  大師筆墨淡如水'
content: '我個人的鑑賞力還沒鍛鍊足夠，馬丁爺的作品，我還是比較偏好隔離島、華爾街之狼、神

  鬼無間這幾部商業味較濃節奏也更快的作品（就連四海好傢伙這種神作我看完都無感），

  不過就連＜沈默＞都能勉強看完，那看完本片還是沒有問題的。


  本片跟＜奧本海默＞相比，剛好是兩個極端，前者節奏緩慢、敘事手法內歛、配樂克制，

  後者節奏飛快、敘事花俏、配樂轟炸，諾黑如我也不得不承認後者娛樂性更高。



  上映前還先去找了原著來看，非常好奇這個複雜、牽涉人物眾多、橫跨時間長達數年的故

  事要如何改編，老實說看到成品是有點失望的，同樣的題材如果給大衛芬奇拍，可以拍成

  精彩的推理緝凶片，最初的劇本確實是朝這個方向，但馬丁爺不願流於俗套，轉而以一個

  偽紀錄片的方式來呈現。


  本片不論是服化道還是畫面運鏡等皆屬上乘水準，但核心的劇本就不是那麼令人滿意。


  原著屬於紀實文學，真正稱得上所謂主角的，大概就是調查局懷特探員跟莫莉兩人，歐內

  斯特這個角色幾乎沒啥刻畫。編劇選擇以此角色作文章，但感覺不是挺成功。李奧那多演

  技一如既往用力過猛，從頭猙獰到底，撇開演技不談，角色本身又十分不討喜，完全被舅

  舅牽著鼻子走沒自己想法，愚蠢到你會懷疑他有智能障礙，可是你說他懦弱嘛，舅舅要他

  去殺人、放炸彈等髒活，他又毫不猶豫內心全無掙扎，跟莫莉這種扭曲、畸形的情感關係

  著墨又不太夠，乃至最後痛失愛女、決定挺身作證對抗舅舅等，情感的衝擊都不是很深刻

  ，在角色的塑造上，似乎欠缺了一點血肉。


  威廉哈爾這個角色就單純多了，動機就是我愛錢我就壞，還會掰出一套歪理合理化他的惡

  行，侄子搞事或不聽話就使出PUA教訓，人前慈眉善目轉頭策劃陰謀殺人如市場買菜般自

  然。比較可惜的一點是，片中有提到，女主的姊姊安娜在死時是懷有身孕的，原著中指出

  哈爾與安娜有染，極有可能是哈爾骨肉，等於是謀財害命同時害死親骨肉。可惜這個線索

  在片中只提了一下就沒了。


  莫莉這個角色雖是配角，但刻畫得比歐內斯特出色，甚至有成為主角的潛力。本文寫到一

  半看到一篇影評跟我也有類似的想法

  （）

  以莫莉為視角出發，可以營造出更多懸疑性及張力，類似＜逃出絕命鎮＞的感覺。成品選

  擇開場就告訴你所有白人都是壞人，就這麼平鋪直敘下去，少了懸疑感。



  至於身為原著主角之一的調查局探員懷特，直接淪為打醬油，聯邦探員查案這部分佔原著

  三分之一篇幅，也是最精彩的部分。電影中拍得好像是懷特來了之後才開始查案，其實在

  這之前印地安事務部就派出數名幹員臥底了兩年之久，初步鎖定了哈爾為首的團伙。懷特

  算是中途接手統籌調查，因為哈爾的權勢乃至背後共謀集團的錯綜複雜（電影中沒表現出

  來有點可惜），下至地方警察上至州郡官員都牽扯其中不能信任，聯邦探員必需小心翼翼

  ，也派出幾名探員臥底（電影中出現的印地安血統幹員、保險員、畜牧商人等偽裝）、教

  唆亡命之徒當線民，中間還發生過洩密疑雲搞得草木皆兵。

  可惜這些精彩的緝凶過程在電影裡一筆帶過，好像探員一行人沒查到啥證據，就直接鎖定

  了恩內斯特一伙人似的。



  本片給我的感覺，就像是五星大廚用上頂級食材，卻少放了調味料，沒啥起伏十分平淡的

  一個故事。


  但結尾的廣播劇安排，我還是被觸動到了，旁白說道「正義的勝利！」多麼諷刺啊，整起

  事件涉及近百名歐塞奇族人的非正常死亡，真正被定罪的只有哈爾數人，其他全成了懸案

  ，還有更多黑手逍遙法外，廣播劇演員的台詞跟最後馬丁爺的獨白，是在為那些無辜的亡

  魂發聲、為正義發聲。


  ----

  Sent from  on my Samsung SM-A528B


  --'
