url: https://www.ptt.cc/bbs/movie/M.1698474593.A.02D.html
title: '[普雷] 花月殺手-印地安版的愛爾蘭人'
content: '無雷文


  先說結論:


  沒看之前很想看，

  看完以後覺得平淡，為何要這麼冗長，

  早知道就耐心等串流上在家看就好


  會去看這部的應該都知道劇情在演什麼才會進去看得吧

  想看帥氣皮卡丘的可以pass了

  李奧納多還是演得太用力 那個眉頭看了觀眾都皺眉了



  劇情毫無曲折離奇，

  就是看奧塞奇族人如何被白人迫害還無處申冤而已


  會拍得這麼冗長純粹只是導演史柯西斯把前段拍成了奧塞奇文化紀錄片

  相比愛爾蘭人還比較好看


  以我看的這場才3個人，應該很多戲院下周就會下檔了....


  要不是很久沒進電影院 沙丘又延到明年，

  也不會挑這部看 @@



  倒是有個疑問就是這麼大的事件，是直到2018年小說出版

  社會大眾才廣泛知道，還是美國人大多都知道百年前這段史實?






  --'
