url: https://www.ptt.cc/bbs/movie/M.1628767037.A.9CC.html
title: '[新聞] 布蘭登費雪加盟史柯西斯《花月殺手》'
content: "新聞網址：\n\n布蘭登費雪加盟馬丁史柯西斯《花月殺手》踏上回歸之路 粉絲的熱烈支持讓他一度哽咽\n\n\n在這個月早前，報導指出布蘭登費雪 (Brendan\
  \ Fraser) 將加入由馬丁史柯西斯 (Martin\n Scorsese) 執導，李奧納多狄卡皮歐、勞勃狄尼洛、傑西普萊蒙主演的最新力作《花月\n殺手》(Killers\
  \ of the Flower Moon)，在這部設定於 1920 年代的西部犯罪電影中，飾\n演律師「WS 漢彌爾頓」，重返觀眾們的視野。\n\n費雪的人生經歷了風風雨雨，在這條回歸影壇中心的路上，不少的粉絲都持續關注著他，\n\
  一個新的詞彙甚至在社群媒體上發酵——「Brenaissance」，這個結合費雪名字與文藝復\n興詞，正象徵著大家為他的加油打氣。而在對於能擁有眾多粉絲們的支持，費雪不僅表示\n\
  感激，他也於近期的一次見面會時一度講到哽咽。\n\n近幾年鮮少推出大銀幕新作的布蘭登費雪，過去曾憑著《森林泰山》(George of the Jun\ngle)、《神鬼傳奇》系列\
  \ (The Mummy)、《衝擊效應》(Crash)、《地心冒險》(Journey\nto the Center of the Earth) 等熱門電影成了好萊塢炙手可熱的巨星；\n\
  \n可惜的是，他後來接連因為離婚、受傷、憂鬱症、破產等問題，幾乎消失在銀幕前。雖然\n他在 2016 年有開始接演一些小螢幕作品，像是美劇《婚外情事》(The\
  \ Affair) 以及《\n禿鷹》(Condor)，但直到他在 2018 年參演了奧斯卡名導丹尼鮑伊執導的影集《信任》(T\nrust)，回歸之路才漸漸透出光亮。\n\
  \n\n\n在本週的一場線上粉絲見面會中，費雪開玩笑地表示，對於能夠在《花月殺手》與李奧納\n多和勞勃狄尼洛一同演出，讓他期待到有點不太舒服。此外，一位粉絲在這場見面會上向\n\
  他保證，他的粉絲們都會繼續在背後支持著他：\n\n「網友們現在都是一面倒地支持著你！我們會繼續支持你的！有很多很多的觀眾都還愛著\n你，並全力地支持著你，我們等不及要看到你接下來的表現了。」\n\
  \n對此，布蘭登費雪感動到有點哽咽，連話都有點說不好了。\n\n\n\n布蘭登費雪的重返影壇之路雖然不容易，但在近年的發展與粉絲們的支持下，似乎也越來\n越順利——他參演的史蒂芬索德柏\
  \ (Steven Soderbergh) 犯罪電影《匪類》(No Sudden\nMove) 已於上月推出，獲得外界一致好評。\n\n此外，他也將主演由《黑天鵝》導演戴倫艾洛諾夫斯基\
  \ (Darren Aronofsky) 執導的新作\n《The Whale》，該片改編自薩繆爾 D 亨特 (Samuel D. Hunter) 備受好評的劇作，並在\n\
  今年稍早正式完成了拍攝。\n\n費雪在《The Whale》飾演一位飽受肥胖之苦的獨居英文老師，他試圖與分離已久的女兒\n重建關係，希望能藉此找到救贖的機會。這不僅是被外界看好得獎潛力相當高的作品，也\n\
  有望成為布蘭登費雪成功翻身之作。\n\n\n（布蘭登費雪出席翠貝卡影展，體態明顯與以往不同。據悉他是為在《The Whale》中飾\n演一名病態肥胖的英語老師而增肥。）\n\
  \n////\n\n希望他可以找到不一樣的戲路，逐漸重返榮耀\n\n\n--"
