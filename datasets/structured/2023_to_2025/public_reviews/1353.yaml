url: https://www.ptt.cc/bbs/movie/M.1698839634.A.9DA.html
title: '[好雷] 花月殺手'
content: '孵了很久才想到要寫什麼

  其實電影上映當週就看了

  很神奇的是這部跟奧本海默給我的感覺相同

  當下看完只覺得是技術頂尖的好片

  反倒是現在偶爾突然閃現片中的橋段

  再回頭補上原著更有韻味


  另一個與奧本海默有趣的比較點是

  片中出現了大量的人名

  對奧本海默那些海量的科學家名字

  我在觀影當下是直接忽略記憶

  看完也證明的確不影響觀影

  本片卻是相反，大量的奧塞奇族與白人角色

  透過一段段事件鋪墊

  我反而能一一記得什麼角色做什麼樣的事


  一個白人透過各種手段強取豪奪奧塞奇家族

  財產的故事

  不論是原著的調查局推理辦案角度

  或是本片自莫莉和厄尼斯特的角度出發

  都很適合做出充滿戲劇張力的電影

  但整部片走出的風格倒像是刻意壓制過

  任何能高度渲染情緒的片段都拍得內斂

  較以往馬丁電影中的槍殺爆破等都更平實

  後段調查局介入後查案也查的順理成章

  看了導演訪談更加確定是有意為之

  將觀眾抽離以更客觀的角度看待整起事件

  這可能也是一般觀眾當下觀影很難融入的原因



  李奧納多一直被形容演的用力

  但這部的各種皺眉更像是刻意為之

  模仿出角色個性的愚蠢、衝動和痞氣

  女主角莉莉的演技就真的相當驚人

  看似不溫不火的表情但用眼神傳達所有情緒

  是全片很難忽視的亮點

  勞勃狄尼諾不用說的穩

  布蘭登費雪的音量倒是.……出乎意料的吵（×


  整體而言，這就是部標準的“沉浸感”電影

  在戲院裡被放大的鏡頭美感，

  和演員細微的表情抽動

  都更容易讓人更沉入電影不及不徐的氛圍中

  但在串流上能否達到本片要的效果

  就看個人的觀影習慣如何

  起碼在莫莉逼問厄尼斯特注射物的場景時

  演員的眼神的悲傷與絕望被大螢幕傳遞的瞬間

  是我充分意識“這是在戲院才能感受到”的時刻




  --'
