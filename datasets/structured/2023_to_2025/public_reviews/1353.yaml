url: https://www.ptt.cc/bbs/movie/M.1698520439.A.2AD.html
title: '[新聞] 花月殺手片長太長！導演不爽戲院增設中'
content: '「花月殺手」片長太長！導演不爽戲院增設中場休息時間 遭觀眾反嗆


  2023-10-28 21:43


  聯合報 記者蘇詠智／即時報導




  馬丁史柯西斯為自己的片子拍太長辯護，反而引來更多的批評。（歐新社資料照片）


  近日已在全球各地上映的「花月殺手」，片長3小時26分又無中場休息，有些觀眾擔憂自

  己無法撐那麼久不跑廁所，乾脆放棄，而在美國與部分地區，有戲院主動在放映此片的過

  程中增設中場休息時間，讓觀眾上洗手間或是舒展身體，不料這違反了片商的規定，因而

  很快就又被制止，觀眾必須一口氣把片子看完，因而又引發了爭議。


  負責該片剪輯的賽瑪史昆梅克表示：「我知道他們有人私自中場休息，但這是不對的，以

  違反規定，所以我要去抓出來。」


  導演馬丁史柯西斯早先就曾對這部片的長度說道：「大家說這部片長3個多小時，拜托，

  你們都可以坐在電視機前看5個小時了。而且很多人在劇場看3個半小時的表演，台上可是

  有演員本人在的，你可不能站起來走來走去，你們都會尊重他們，也給電影一些尊重吧。

  」


  這番話講得讓網友火冒三丈，接連在留言板上嗆道：「不尊重人的膀胱才真的是很糟糕。

  」


  或是「我很想尊重你的電影，但我有年紀了，就是會有上廁所的需求，我想你年紀也大了

  ，不會不知道這個吧？」


  還有人打臉史柯西斯：「拜託你有沒有去看過舞台表演，絕大多數都有中場休息，唯一沒

  有的是兩小時以內的演出。」


  更有人寫得很不客氣：「他真有辦法讓一部已經看不下去的電影變得更看不下去。」


  網友們認為史柯西斯的話相當的超出現實，很少人真的會在電視機前連續坐5個小時，大

  部分中間都會去上個廁所或倒個水，而他舉例的「劇場表演」更是提油救火，因為正如網

  友所說，絕大多數都有中場休息，沒有逼著觀眾硬生生不間斷的看完3小時。只有極少數

  人替他講話，認為他對這部片子裡面沒有設定中場休息的斷點，那觀眾就應該尊重他的創

  作意念，一口氣把電影看完。




  「花月殺手」片子太長又不設中場休息，導演還要求觀眾一口氣看完，網友抱怨不斷。圖

  ／摘自IMDb



  新聞網址：




  --'
