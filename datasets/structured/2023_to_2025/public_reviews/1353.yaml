url: https://www.ptt.cc/bbs/movie/M.1700222364.A.9DB.html
title: '[好雷] 花月殺手 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  導演花了相當長的篇幅描述歐賽奇一族的「人頭權」如何引發人性的弱點


  最終導致許多美國原住民死亡


  讓人不禁反省21世紀的台灣, 是否也足夠重視同樣的問題




  影片以大量白人蜂擁至歐賽奇族人的土地拉開故事序章


  因為在他們的保留地發現石油 歐賽奇族人可以分得開採的權利金


  並將這樣的權利傳承給合法繼承人


  透過畫面我們看到歐賽奇人過著富裕的生活


  開好車、住大房、有白人僕役、多數人都吃得體型加大




  統計資料顯示 歐賽奇族人患上第二型糖尿病的比率高達20.7%


  是美國人的兩倍


  這最終也直接或間接導致女主角Mollie儘管逃過Hale的陰謀


  仍在50歲死亡




  電影中經典的對白


  “白人的食物會害死你”


  預言了Mollie逃得過謀殺卻逃不過糖尿病的命運




  台灣每10人中就有1人患有糖尿病 盛行率為亞洲第一


  花月殺手如今也成為蕃薯殺手


  值得國人省思!!


  --'
