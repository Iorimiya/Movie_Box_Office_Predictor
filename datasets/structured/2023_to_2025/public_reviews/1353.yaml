title: '[新聞]《花月殺手》太長？馬汀史柯西斯:人們都能在電視前坐5小時'
content: '新聞網址：


  原標題:



  Yahoo奇摩電影戲劇編輯部

  更新時間： 2023年10月10日 週二 下午3:17



  【文／血紅蘭姆】大導馬汀史柯西斯直言，比起呆坐在電視機前來說，《花月殺手》的片

  長實在不算什麼。



  自從影史上首部片長突破一小時大關的澳洲電影《凱利幫的故事》於1906年問世以降，影

  壇百年來通常都將片長控制在一個半至兩小時十幾分鐘左右。其中尤屬八零年代中期的電

  影最為輕薄短小，在面對錄影帶問世的挑戰之下，為了吸引觀眾走進戲院、也增加放映場

  次，平均片長不到兩個小時。



  不過近年來的電影往往越拍越長，三小時兩分鐘的《復仇者聯盟：終局之戰》自然不在話

  下，今年的《奧本海默》也正好三小時。





  《花月殺手》是由Apple TV+和派拉蒙聯手發行，等到院線下檔之後，就會登上Apple TV+

  。馬汀史柯西斯向印度斯坦時報解釋道：「就《花月殺手》來說，本片應該在大銀幕上觀

  賞。我們是想打造商業大片嗎？不，我們拍的是一部電影，所以就該在大銀幕上觀賞。」



  「至於我拍過的其他作品呢？可能就未必了。有時候也得視作品本身的強度，如果它在小

  螢幕上播得很不錯，那便很值得玩味。《花月殺手》可以在小螢幕上播放，但你如果想真

  正沉浸其中，就該撥出時間走進戲院。」





  《花月殺手》將於2023年10月20日在台上映。



  --'
