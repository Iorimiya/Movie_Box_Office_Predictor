url: https://www.ptt.cc/bbs/movie/M.1681000910.A.FBB.html
title: '[新聞] 小說改編電影《花月殺手》 3大奧斯卡影'
content: "新聞網址：\n\n\n小說改編電影《花月殺手》 3大奧斯卡影帝夢幻共演\n2023/04/04 聯合報／ 記者陳建嘉／即時報導\n\n李奧納多迪卡皮歐、導演馬丁史柯西斯自從「神鬼無間」、「隔離島」之後，第6度的電\n\
  影長片合作「花月殺手」（Killers of the Flower Moon），決定於10月20日於Apple TV\n+推出，這也是Apple宣佈投資10億美金於電影拍攝後，第1個決定在戲院先行上映的電影\n\
  。\n\n電影改編自美國記者兼暢銷小說作家，大衛格雷恩撰寫的「花月殺手：美國連續謀殺案與\nFBI的崛起」一書問世時，除了被幾近所有外媒，包含「時代週刊」、「華爾街日報」和\n\
  「赫芬頓郵報」等具有公信力的圖書網評選為 2017 年度十大好書之一，也早已預告著搖\n身翻拍為經典大片的可能。\n\n睽違四年，小說終由獲獎無數的「電影大師」馬丁史柯西斯，攜手經典電影「阿甘正傳」\n\
  和「一個巨星的誕生」奧斯卡5次提名編劇艾瑞克羅斯一同創作。不只如此，演員陣容更\n邀來長年合作的好友，同時也是多項大獎影帝寶座擁有者，高年級和中年級代表，勞勃狄\n\
  尼洛和李奧納多迪卡皮歐主演，他們兩人過去曾分別與馬丁合作「愛爾蘭人」和「隔離島\n」等精彩作品，而如今「花月殺手」終於讓三人碰頭同台打造這部歷史犯罪懸疑電影。\n\
  \n故事講述 1920年代，印地安歐塞奇族慘遭流放後接連被謀殺的大宗血案，只因他們「幸\n運」身處的貧脊荒地滾出源源黑金...官商勾結的漠視吃案、跨州單位FBI\
  \ 的成立介入，\n看似曙光卻也是藉機壯大的假正義，種族歧視與不平等多年後是否獲得改善，還是一如往\n昔被刻意遺忘？電影將於10月6日在美國部份電影院上映，10月2\
  \ 日全球戲院上映，Apple\n TV+上線時間未定。\n\n--"
