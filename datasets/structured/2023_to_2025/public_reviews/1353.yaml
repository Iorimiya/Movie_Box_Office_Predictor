url: https://www.ptt.cc/bbs/movie/M.1677006704.A.A0E.html
title: '[討論] 花月殺手 片長'
content: '剛剛看幾個國外電影網站報導，




  花月殺手目前在剪輯師Thelma Schoonmaker與導演Martin Scorsese的合力

  下，最新剪接的版本時長達3小時20分鐘。


  雖然目前在剪接上仍在做調整，不過就以Apple公司要求Martin Scorsese

  把片長縮至3h以內來說，就算刪掉無關推動劇情的旁白、日常瑣事等，以

  我對Martin Scorsese粗略的認識來講，一部分重點除了檢視這段歷史外，

  導演也想讓觀眾們體驗電影場景中所營造當時的文化與價值觀。重點是這

  些所謂體驗，這樣的氣氛大多時候是需要配合許多支線劇情並一個個堆疊

  出來才是有力道的。這也像四海好傢伙或紐約黑幫那樣看似流水帳，但由

  於這些支線任務講的夠精彩，就算是3個半小時的片，

  體感時間一下子就過了。



  各位是怎麼想的勒?





  --'
