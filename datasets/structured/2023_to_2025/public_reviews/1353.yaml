url: https://www.ptt.cc/bbs/movie/M.1697989975.A.0F9.html
title: '[新聞] 泰勒絲演唱會首日票房是花月殺手2倍多'
content: '泰勒絲演唱會電影再映首日票房是《花月殺手》首映的2倍多


  葛大維


  2023年10月21日 週六 上午8:33




  《泰勒絲：時代演唱會》電影的成功，不僅讓年輕觀眾買票進戲院，未來影響可能有更多

  演唱會電影出現（圖片來源：美聯社）


  捲土重來的《泰勒絲：時代演唱會》電影與《花月殺手》正面對決！


  影視媒體「綜藝報」（Variety）報導：代表兩種不同文化的電影，本週四（美國時間19

  日）票房出爐––


  《泰勒絲：時代演唱會》590萬美元，《花月殺手》260萬美元；差距不

  小的票房數字，其實並不太讓人意外。




  李奧納多狄卡皮歐（左起），導演馬丁史柯西斯，勞勃狄尼洛合作的電影《花月殺手》，

  外媒影評非常稱讚（圖片來源：美聯社）


  《泰勒絲：時代演唱會》電影片長約2小時49分，屬PG-13級；《花月殺手》片長約3小時2

  6分，屬15+級；還有兩片觀眾群不同，都會導致放映場次與票房數字的差距。


  比較意外是，之前外媒報導《泰勒絲：時代演唱會》電影的預售票已賣出逾1億美元，但

  據Box Office Mojo網站資料：《泰勒絲：時代演唱會》電影本月13至15日在美國放映4天

  的票房竟是9280萬美元！


  而與美國同步上映的某些地區加起來票房共約1.24億美元；不過這部剪輯演唱會實況精華

  的電影成本最多2000萬美元，還有多地區未上映，穩賺不賠。


  而該片再度安排在美國上映（粉絲反應熱烈＋再消化預售票？），「綜藝報」預估至下週

  一票房可（再添）約3000萬至4000萬美元。


  而成本高達2億美元的《花月殺手》，「綜藝報」預估下週一開片票房約2000萬至3000萬

  美元，可能無法超越成本約1億美元、片長約3小時、級數15+的《奧本海默》目前全球票

  房9.42億美元的數字（某些地區仍在上映中）。


  不過外媒對《花月殺手》的影評都非常好；尚未見《奧本海默》導演克里斯多夫諾蘭對《

  花月殺手》的評論，但諾蘭已盛讚《泰勒絲：時代演唱會》電影的重要影響是––吸引觀

  眾（尤其是年輕人）買票進戲院。（圖／美聯社）


  新聞網址：






  --'
