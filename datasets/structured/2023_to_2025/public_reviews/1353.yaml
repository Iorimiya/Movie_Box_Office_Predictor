title: '[好雷] 映現人性貪惡：《花月殺手》'
content: "內文有雷且具個人觀點，推薦觀影後再讀。\n\n\n　　　　網頁版：\n\n　　　　\n\n\n　　　　預告片：\n\n　　　　\n\n\n\n\
  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\n\n映現人性貪惡：《花月殺手》\n\n\n\
  \n　　電影《花月殺手》改編自大衛格雷恩的紀實小說《花月殺手：美國連續\n\n謀殺案與 FBI的崛起》，呈現美國印第安原住民奧塞奇族的崛起、文化，連\n\n環凶殺案的緣由、發展及落幕，為奧塞奇族沉重的歷史，以及美國這段黑暗\n\
  \n的過去作證。\n\n\n\n　　特別的是，《花月殺手》不塑造英雄，不造作謎團，而是揭露與呈現奧\n\n塞奇族的本來面目，和人性的貪婪醜惡──為了達成目的，什麼理由都可以\n\
  \n自我說服：因為他們不工作，所以可以開「奧塞奇價」；因為他們終歸一死，\n\n所以自行決定他們何時死亡；為了讓她沉默，所以可以在她的胰島素裡下毒；\n\n一面說「我是你們的朋友」、「讓我幫助你們」，一面把他們推上死路。奧\n\
  \n塞奇族四周充滿了蛇、土狼與禿鷹，表面上的友好，心底想的都是：「你們\n\n不該得這麼多」、「憑什麼我們辛辛苦苦工作，你們卻富到流油？」在這部\n\n幾乎安靜的電影裡，這種不滿的聲音時時可聞。相較於奧塞奇族傾聽暴風雨，\n\
  \n威廉哈爾則是為了利益焚燒田野，前者的敬畏闃黑與後者的顛狂焰紅，正好\n\n是劇情的兩個轉折，身處其中的厄尼斯特皆唯噤聲：入境隨俗，為的是隨之\n\n而來的利益；搖擺不定的證言，為的是如何能在罪惡裡脫身，但事實是當他\n\
  \n跟著設計地獄的同時，自己也早已一步步地踏入地獄。\n\n\n\n　　導演馬丁史柯西斯以尊重歷史的態度述說始末，以奧塞奇族的主體性出\n\n發，因而著重在人情互動、貪欲卑劣。我們可以看到這個族群的神話、信仰，\n\
  \n相處的方式，以及如何面對死亡：到訪的貓頭鷹帶來的不僅是死亡預兆，亦\n\n證明了族人與大自然的連繫；莫莉與姊妹、與母親的情深，年少時締結婚姻\n\n也未離婚、各自再婚且相互關懷扶持的親密，均與白人以婚姻為墊腳石、血\n\
  \n親亦相互利用的關係形成對比。即便有莫莉的聰慧，族人之間的團結，在這\n\n群白人豺狼環伺、威廉哈爾試圖一手遮天的小鎮裡想要找出真相，該是何等\n\n艱辛，又得何其勇敢堅毅，才能挑戰司法系統，終為這一連串明明破綻百出\n\
  \n卻無人施力的兇殺案撕出一隅曙光。片末呈現奧塞奇族的儀式與音樂，直到\n\n字幕結束，都能看到導演看重歷史、尊重不同族群的用心。\n\n\n\n　　本片身處風暴中心的女主角莫莉明穎果決，亦不免因情感左右判斷。她\n\
  \n了解厄內斯特的貪婪與愚痴，卻因為他的誠實與真情選擇婚配。婚後她不是\n\n沒有懷疑過丈夫，但在那個爭執的當下，她相信了他的「真誠」──因此在\n\n最後那個關鍵的問題，厄內斯特再也無法誠實回答，他們的婚姻也就走向了\n\
  \n終點。由於一開始就揭示了厄內斯特追求莫莉的動機，後面他們的感情再和\n\n睦，厄內斯特再體貼，甚至莫莉病倒在床、厄內斯特在為她注射時，都不免\n\n有土狼伺屍的悚然感。相較於已然把情感和語言當作欺騙的工具與武器，內\n\
  \n心早已因利成魔的舅舅威廉哈爾，厄尼斯特的戲份更著重在貪婪與情感的掙\n\n扎：因為貪婪，自然對舅舅唯命是從；他對妻子的感情有真，仍是利己而生，\n\n所以儘管有過掙扎，還是選擇殺死莫莉的親人；知道莫莉請人來調查，就在\n\
  \n她必須注射的胰島素下藥。一旦被慾望左右，真情也會輕易變成謊言與劇毒。\n\n\n\n　　「久了就會遺忘，他們不會在乎。這只是一個日常而普通的悲劇。」\n　　\n\
  \n\n　　因貪婪而自取滅亡，原是尋常；但當它成為日常不知何時來襲、連續近\n\n６０名奧塞奇族人被謀財害命的種族凶殺案，就是必須探究的歷史。片末由\n\n導演現身用廣播劇的方式收尾，後設的手法揭露這非所謂的「真相」，而是\n\
  \n經過詮釋的作品，大師的謙慎，正為全片的設計作了最好的註腳：唯有記憶\n\n與在乎，悲劇才能避免日常而普通的掩蓋，真正映現人性之惡，以及避免再\n\n次重演。\n\
  　\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\n               \
  \                   陳斐雯  貓蚤札（其三）\n\n--"
