url: https://www.ptt.cc/bbs/movie/M.1680034260.A.704.html
title: '[新聞] 李奧納多與馬丁史柯西斯6度合作花月殺手'
content: '李奧納多與馬丁史柯西斯6度合作　《花月殺手》預計10月下旬揭開美國黑歷史




  李奧納多迪卡皮歐（右）第6度與導演馬丁史柯西斯合作，演出《花月殺手》。（Apple T

  V+提供）


  （Leonardo DiCaprio）與導演（Martin Scorsese）第6

  度的電影長片合作《》（Killers of the Flower Moon），決定於10月20日於Ap

  ple TV+推出，這也是Apple宣佈投資10億美金於電影拍攝後，第1個決定在戲院先行上映

  的電影。


  改編美國記者兼暢銷小說作家，大衛格雷恩（David Grann）撰寫的《

  》（Killers of the Flower Moon: The Osage Murders and the B

  irth of the FBI），以調查報告的形式，針對1920年代發生在美國奧克拉荷馬州的多起

  原住民謀殺案件重新提出調查，點出這些命案背後所夾帶的龐大利益，直指兇手為FBI。


  在歷經4年的籌備與拍攝後，《》以劇情片的形式，帶領觀眾回到過去、一起辦

  案。


  導演馬丁史柯西斯找來長年合作的好友，同時也是拿過多項大獎的影帝勞勃狄尼洛（Robe

  rt DeNiro），以及李奧納多迪卡皮歐一起主演。


  他們過去曾分別與馬丁合作《》和《》等精彩作品，如今《》終

  於讓3人首度同台，打造這部歷史犯罪懸疑電影。


  由於去年奧斯卡最佳影片是Apple TV+所投資的《》（CODA），讓Apple信心大

  增，今年初宣佈會投資10億美金於電影拍攝計畫，而且這些電影也會在戲院放映，之後於

  自家的Apple TV+串流平台上架，被外界視為Apple有意進軍影視產業的信號。


  《》則是此一投資案宣佈後，第1個確認與派拉蒙影業合作的案子，10月6日起於

  美國戲院上映。


  台灣則預定於10月20日在Apple TV+上架推出。


  更新時間｜2023.03.28 12:08


  新聞網址：




