url: https://www.ptt.cc/bbs/movie/M.1690189023.A.3B9.html
title: '[討論] 霧社事件只是缺個花月殺手等級的劇本吧'
content: '剛剛看

  馬丁史柯西斯執導的花月殺手


  中文預告出來了

  有李奧納多、布蘭登費雪、勞勃狄尼洛、傑西普萊蒙




  超期待的，居然很多火爆的場面


  看裡面應該蠻考究的吧，

  也有該族的音樂和舞蹈跟儀式的片段，

  李奧納多整個腔調都換成超重的口音。



  以下為花月殺手故事簡介：


  《花月殺手》記錄的不只是美國歷史中官民勾結的連續殺人案，更是人類近代惡行的記錄。當石油被發現時，印第安歐塞奇族的災難就開始了，只因他們被趕去的貧脊荒地流出滾滾黑金，從此歐塞奇人一個接一個死亡，卻被漠視吃案。這是美國最黑暗的一頁歷史，但揭露的竟是人性底層最真實的樣貌。
  也促成FBI成立。




  仔細想想


  其實有相當多元素都跟霧社事件有重疊到吧


  因資源而引起的奴役，

  少數種族與殖民者的侵略、血腥殘酷的殺戮、官商勾結


  霧社事件搞不好某些程度更有戲劇張力。



  就不會看到有人說什麼，

  誰會想去看幾十年前美洲鳥不拉屎的地方的土著和白人的殺戮事件啊~


  相反還一堆人期待，

  霧社事件是不是單純只是差一個花月殺手等級的劇本


  跟題材無關，單純拍得爛而已




  -----

  Sent from JPTT on my Samsung SM-A5360.


  --'
