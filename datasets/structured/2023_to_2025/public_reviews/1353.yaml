url: https://www.ptt.cc/bbs/movie/M.1699012506.A.761.html
title: '[好雷] 花月殺手'
content: "花月殺手：諷刺當前社會政治的警世之作\n\n有些圖片可以點選網頁來閱讀\n\n方格子：\n\n\nMedium：\n\n\n\n昨晚看這三個半小時的電影不覺折磨，但對裕隆城保全人員應該挺折磨的因\n\
  為得等這場結束送大家離場，覺得等阿橘等到最後的我很不好意思，感謝這\n位保全人員的耐心。\n\n想請教大家，為什麼最後本片會獻給 John Williams ？當下害我嚇了一大跳\n\
  ，以為這位高齡90歲的大師怎麼了，當下趕緊搜尋發現：還健在，但這部的\n作曲上似乎也不是 John Williams 操刀，畢竟他也退休了，沒有搜尋到相關\n\
  資訊，還請版上各位前輩們分享，也許是這部片和 John Williams 之間有什\n麼緣份？\n\n後面的內容就或多或少有雷了，所以如果介意的朋友就先別看囉，三個半小\n\
  時如果嫌久，很可能是當前潮流短影音趨勢下大家已經習慣了要短時間內很\n多密集的刺激，全片我唯一覺得有點緩慢的只有一開始登場時介紹家人這不\n到一分鐘的橋段，其餘對話細節猶如足球比賽每個動作都環環相扣，好前一\n\
  陣子教父二有在台北重映，如果喜歡教父的觀眾應該也不嫌久，以我個人的\n觀影感受，星際大戰最長的一集「天行者的崛起」我反而覺得還比這部來得\n更久，我想這就是所謂的相對論吧。\n\
  \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  提及組織犯罪的歐美主流電影很多和義大利黑幫、愛爾蘭黑幫等相關背景有\n關，教父、四海好兄弟等等在世代交替之間面臨販毒的龐大利益變遷得捍衛\n存亡，不是這路線的，大概是打擊拉丁販毒遇上各類兇殘的暴力刑求，搶銀\n\
  行當鋪的利益分配衝突和大膽猖狂挑戰警察的睿智，在爭權奪利過程展露江\n湖道義、個性、原則與人性光輝照顧地方鄰里與兄弟情誼，細節的重視和劇\n情運鏡與對話間人性的刻畫過程如何展現「那圈子」的文化和生活，就是這\n\
  些大師的手法差異，這種將人類歷史文化以電影手法紀錄與反應呈現有別於\n漫威這類 Fantasy 想像出來的世界，是很不同的。\n\n真實，是馬丁史柯西斯很看重的環節，細節甚至連菜花耳的小黑去搜尋會發\n\
  現這位演員長相跟真實相貌幾乎一模一樣，畢竟在史柯西斯的世界總是以寫\n實的手法處理人性衝突心理變化的荒謬，多少會認為我和漫威是不同層次的\n作品，沒有好與壞，只是層次不同。\n\
  \n這部花月殺手對我而言是神作，不僅僅是跳脫義大利黑幫背景，也不是紐約\n，取而代之是美國白人如何去巧立名目去奪搶美國原住民的利益，白人來到\n此處的背景各不相同，但卻有著共同的動機，也就是石油帶來的龐大的利益\n\
  ，在這帶有敲詐騙錢的社會進展裡十足顯露人性的灰暗，彼此也會瞧不起彼\n此，認為你帶有目的婚姻沒有我敲詐來的高尚，都掙口飯吃憑什麼批判我外\n，透過狡詐謀求生存哪怕偷拐搶騙殺人放火再隱性埋名一走了之通通都可以\n\
  接受，和奧塞奇族大大不同。\n\n奧塞奇族在這當中則面臨著存亡之際，擁有充分的知識文明與智慧，基於信\n任與人性光輝所建立的家庭社會基礎，試圖與主流文明美國的議會制度銜接\n\
  ，討論著該如何面對白人帶有目的性的通婚好稀釋奧塞奇族的浪潮，在面對\n不同文明在做出妥協與交流的過程如何取得平衡，是這個族裔所面臨的重大\n考驗。\n\n馬丁史柯西斯讓觀眾們透過一個戰後退伍軍人通婚到離婚的整段婚姻去了解\n\
  奧塞奇族生老病死婚姻飲食穿著打扮，和主流電影的刻板印象中原住民就是\n遊牧文化在文明上是有多麼的不同，對話節奏上的空白，對天氣變化的回應\n、對死亡的敬畏，隨通婚過程很自然地灌輸到觀眾腦中，而主角厄尼斯特的\n\
  衣服服裝也看得出他個人對這文明活動當下的心態為何，是穿西裝、還是帶\n有奧塞奇的服飾元素，在追求莫莉時穿著西裝，在和舅舅劍拔弩張時穿有奧\n賽奇色彩的西裝，這些種種讓這部片和過去的組織犯罪很不一樣，又不失去\n\
  馬丁史柯西斯個人的風格—— 暴力，侵奪原住民和黑吃黑所顯露出的狡詐。\n\n片裡除了絕對的正義和邪惡，FBI 還有由勞勃狄尼諾飾演的舅舅威廉哈爾以\n外，每一個人都面臨著人性的矛盾。\n\
  \n要殺一個面臨婚姻背叛只好買酒獲得他的信任，殊不知越喝越親越認識這人\n後反而殺不下去，只好從背後開槍，不敢面對面；不願再做這類勾當但是面\n臨地方勢力的不得不；簽署讓渡繼承之間兄弟也會有意無意暗示不要簽，說\n\
  我老婆沒生病、不要跟我相提並論；女主角莫莉面對白人目的性通婚浪潮的\n席捲卻又對男主角厄尼斯特的愛與追求和細膩照料感到欣慰，而最終莫莉的\n墳墓上沒有厄尼斯特，我想一路以來光明磊落坦蕩的莫莉原因也很簡單：我\n\
  和我家族的生命當中不曾有你，光這就能理解民族文明文化之間的差異。\n\n看到ＰＴＴ前面的心得文討論主角是真無知還是狡詐等等，其實這不就是人\n性嗎。厄尼斯特對於利益和老婆莫莉之間在舅舅眼裡只是要你配合演戲你竟\n\
  然假戲真做，在情感與現實間作證指控與現實社會反反覆覆間的窩囊與生存\n意識，將遲緩藥物倒在威士忌裡喝下，幫老婆打完藥後又倒在床邊有一種要\n死我也和你一起死的畫面，還有心中因為貧窮，覺得從牛胰臟取出這珍貴的\n\
  胰島素是老婆會恢復健康的唯一解藥，連老婆千叮嚀萬囑咐說一定要跳過這\n些醫師取得胰島素他也置之不理，認為這東西很貴從不質疑舅舅，看出他對\n舅舅的信任、對親情健康的擔憂，同時在這當中，從不掩飾自己覬覦利益的\n\
  狡猾—— 認為誰不愛錢外，也正因為對老婆健康的付出，自然最後面對老婆\n的質疑只說胰島素因為自己也吞了那「遲緩藥物」，理當自己也有狀況，這\n些我都覺得在這部電影當中自然又流暢地把每個角色的情緒與細節都吐露出\n\
  來，是很不簡單的。\n\n在電影裡馬克史柯西斯還很厲害地運用很多故事環節，凸顯目前很多政治議\n題，當利益在前不跟你談膚色與種族，還協助少數族裔力抗那些極端種族主\n\
  義者（3K黨）；演繹這作品的故事剛好也和新疆通婚的議題巧妙呼應；官僚\n主義對原住民的不屑一顧，成立 FBI 之後認為這很有政治利益下才積極地去\n偵辦，這不是邪惡的膽大妄為而是厄尼斯特和舅舅也都不清楚這有什麼差別\n\
  ，只說這些偵探警察全都一樣的；用原住民間質樸地分享用同一顆鏡頭對比\n哈爾這種資本家詐騙保險和權謀獲得不義之財後所做出的慈善義舉，自然也\n會聯想到很多具有爭議性的富商家族；以及電影最後，以廣播劇荒謬地呈現\n\
  好跟史柯西斯的作品做對比後（特別史柯西斯自己出來我也挺驚訝），這樣\n的手法有著呼應漫威系列觀眾都會說「彩蛋呢？」而這個彩蛋不僅有趣，更\n由於前面電影環節的真實性與結尾廣播劇在聲音仿效等等似真似假的呈現方\n\
  式，會問自己到底我現在看的這段結局內容是真的假的？覺得這段手法也太\n高明！\n\n去搜尋就會發現舅舅威廉哈爾對於所作所為毫無悔意，以及誠實為上策、窄\n門才是正確的道路，在人生遠比出賣道德自尊走偏門來的更不順遂，是馬丁\n\
  史柯西斯用這連續兇殺案，諷刺社會的一部隱喻作品，即便電影當中殺人手\n法很多前作愛爾蘭人的影子，例如短時間把受害者怎麼死的，讓人很政治不\n正確的詼諧一笑，可我心中卻認為這部比愛爾蘭人甚至近年馬克史柯西斯的\n\
  作品帶有更多省思色彩，也許和李奧納多迪卡皮歐的監製多少有關，是阿橘\n我覺得非常精彩的警世作品。\n\n\n\n\n--\n 「旅程跟終點哪一個比較重要？不是旅程，也不是終點，是最美妙的夥伴。\n\
  \   各位我很感激有你們，你們有很特別的東西，這東西一定要是我們的核心，\n   我不知道要怎麼做，但你們身為一個團體，你們有能力傳遞能量，\n   一上場就鼓舞球迷吧。只要有熱情決心，讓大家看你們有多在乎，\n\
  \   再傳遞、再上前、再進攻，帶著勇氣和信念踢球，然後他媽的贏球。」\n                        \n\n--"
