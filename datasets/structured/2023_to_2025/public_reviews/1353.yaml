url: https://www.ptt.cc/bbs/movie/M.1688564655.A.96C.html
title: '[情報] 花月殺手 中文預告'
content: '【花月殺手】官方中文預告：


  故事描述在20世紀初，奧塞奇族因蘊含豐富石油資源而一夜致富，成為了世界上最富有的

  人，因此立即吸引了白人的入侵，他們在密謀採取謀殺行動前，盡可能地操控、勒索和竊

  取奧塞奇族的錢財。奧塞奇案被喻為美國史上最殘忍的大規模謀殺案，也是為美國歷史最

  黑暗的「恐怖統治」事件。


  《花月殺手》（Killers of the Flower Moon）為真實故事改編，由金獎大導馬丁史柯西

  斯（Martin Scorsese）與《阿甘正傳》《一個巨星的誕生》奧斯卡提名編劇艾瑞克羅斯

  （Eric Roth）共同擔任編劇，改編自大衛格雷恩（David Grann）撰寫的同名暢銷小說《

  花月殺手：美國連續謀殺案與FBI的崛起》。


  演員包含三位奧斯卡影帝李奧納多狄卡皮歐(Leonardo DiCaprio)、勞勃狄尼洛(Robert

  De Niro)、布蘭登費雪(Brendan Fraser)及莉莉格萊斯頓(Lily Gladstone)、傑西普萊蒙

  (Jesse Plemons)、約翰李斯高(John Lithgow)。



  今年10月 全台戲院見


  【花月殺手】官方中文前導預告：


  --'
