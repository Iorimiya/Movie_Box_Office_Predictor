title: '[討論] 老馬丁《花月殺手》大好評'
content: '方才結束了坎城的首映 媒體評價也解禁


  清一色的大好評


  很多影評寫是皮卡丘「從影最佳演出」


  Gladstone，DeNiro的演出也被盛讚 兩者被看好獎季能在配角席有所斬獲（LILLY戲份偏女

  配）


  馬丁的執導功力 當然不必再贅述 看到不少評論覺得他可以靠這部拿第二座導演小金人


  唯一被提到的缺點就是片長（206分鐘）


  距離正式公映還有接近半年 不知道老馬丁會不會再回去修剪 但目前看來會是奧斯卡強而有

  力的競爭者



