url: https://www.ptt.cc/bbs/movie/M.1698219575.A.B9D.html
title: '[好雷]【花月殺手】貪婪與良心的交戰 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  影片影評



  圖文版



  提到馬丁史柯西斯，常看電影的朋友們對他的印象可能不一定一致，如果是最近認識這個

  導演的朋友，對他最深刻的印象，可能是他曾公開批判超級英雄電影，並且說出「漫威電

  影是主題樂園而不是真正的電影」而引起廣泛的討論與爭議。再早一點的觀眾，對他的認

  識應該會是曾經來台灣取景拍過【沈默】的那個導演，而對一些觀影年齡更久的影迷而言

  ，「馬丁史柯西斯」這個名字算是一個活傳奇。他與史蒂芬史匹伯、喬治盧卡斯、法蘭西

  斯柯波拉與布萊恩狄帕瑪等人是所謂「美國新浪潮」的同一代人物。


  簡單的說，「美國新浪潮」指的是1960年代末期，好萊塢影人開始改朝換代時，展露頭角

  的一批年輕電影工作者，當時他們都是有理想有抱負的熱血青年，而且拍出來的電影跟之

  前的好萊塢創作者有很大的差別，可以說，這一代人的崛起形塑了現代的好萊塢，1970年

  代，法蘭西斯柯波拉拍出【教父】、史蒂芬史匹伯拍了【大白鯊】、喬治盧卡斯拍了【星

  際大戰】、布萊恩狄帕瑪則有【魔女嘉莉】，而馬丁史柯西斯在這個時期則有【殘酷大街

  】與【計程車司機】等代表作，我曾讀到過一篇評論，認為馬丁史柯西斯可說是美國新浪

  潮導演當中最具藝術氣質的一位，但同時也是商業價值相對之下較為不起眼的。


  當然這個評論是否中肯，每個人內心都自有依據，不過這位所謂「最具藝術氣質」的名導

  的作品產量豐沛，也經常都在各大獎項上屢屢被提名獲獎，但是他卻遲至2006年才以【神

  鬼無間】獲得奧斯卡最佳導演獎，當時，我想很多人應該跟我的感覺一樣，覺得這個獎不

  是單純給【神鬼無間】，而是影藝學院給予馬丁從1970年代開始就屢屢入圍卻從未得獎的

  補償吧。


  而這位創作力一直頗為豐盛的導演，近六十年的創作經歷，使得他在每一個十年都有代表

  作品，但對我而言，馬丁最能讓我看得津津有味的電影多半都還是1990年代的作品，像是

  1990年的【四海好傢伙】、1995年的【賭國風雲】都是讓我一看再看的作品。

  我覺得馬丁史柯西斯相當擅長描繪角色的日常生活，他總是能讓一群平凡人角色，藉著日

  常的對話慢慢的讓觀眾進入角色的世界對中。


  看他的電影，不會立刻就得到角色的重點提示。而是必須在鏡頭的引導下，觀察每個角色

  的生活，慢慢感受角色的個性，體會整部電影的世界，所以馬丁的電影角色總是非常的鮮

  活，他們往往不怎麼聰明，內心永遠都有很多糾結，會跟真人一樣不斷的碎念、抱怨自己

  的處境，然後卻終究無法脫離自己的軟弱，因此馬丁的電影作品往往都是悲劇，他片中的

  人物就算有勇於改變，脫離自己的舒適圈的決定，但是身處的世界所造成的影響，也不會

  因為角色的改變就翻轉。


  所以【四海好傢伙】的亨利希爾雖然成為污點證人，但是人生並沒有海闊天空，相反的，

  他甚至還很懷念自己當黑道時的精彩人生。【神鬼玩家】的霍華休斯精彩一生之後陷入瘋

  狂當中。而近年來受到馬丁作品影響最大的電影，莫過於【小丑】了，這部片基本上幾乎

  完全是在復刻致敬馬丁的【喜劇之王】，而且【小丑】還找了當年【喜劇之王】裡頭為了

  展現喜劇才華而綁架脫口秀演員的主角勞勃狄尼洛，演出片中與瓦昆費尼克斯針鋒相對的

  節目主持人，瓦昆費尼克斯的社會角落邊緣人詮釋則讓人聯想到【計程車司機】。


  而2023年，馬丁史柯西斯，與李奧納多迪卡皮歐六度合作，與勞勃狄尼洛更是十度合作拍

  出的【花月殺手】，以近三個小時半的片長，描繪了1910~30年代所發生的「奧塞奇印第

  安人謀殺案」事件，卻在一開始就已經用上帝視角，讓觀眾看出整個奧塞奇郡所發生的事

  。


  印地安部族奧塞奇族原本並不住在奧克拉荷馬州，在白人進入美洲之前，奧塞奇族在美洲

  大地上就已是強盛的部族，直到美國建立，奧塞奇族人的生存空間不斷被擠壓，1870年，

  奧塞奇人才遷移到了奧克拉荷馬的奧塞奇郡，對於與游獵維生的奧塞奇人而言，奧塞奇郡

  與之前相較無疑是個相對貧脊的環境，然而人算不如天算，奧塞奇郡發現了石油，這讓原

  本日益貧困的奧塞奇族人一夜暴富，然而財富象徵著災難的來臨，對財務概念不熟悉的奧

  塞奇族，很快就開始遭遇各種詐騙與謀殺。


  電影的開場描繪了蜂擁至奧塞奇郡的白人們無所不用其極地對奧塞奇族人巧取豪奪的事件

  。此時，李奧納多所扮演的厄尼斯特來到奧塞奇郡，投靠他的舅舅：當地的大地主威廉哈

  爾，然後，厄尼斯特在舅舅的安排之下，認識了奧塞奇族的女子莫莉，藉由當茉莉的司機

  ，厄尼斯特與茉莉的關係越來越親密，兩人終於結為夫妻，並且組建家庭。


  乍看之下，這是個美滿的故事，厄尼斯特與他的兄弟、舅舅與奧塞奇人表面上的相處相當

  融洽，威廉哈爾致力於鎮上的現代化與文化建立，參與各種公共事務，捐款興建學校、關

  心鎮上奧塞奇人的生活，還相當關心厄尼斯特的太太茉莉的糖尿病，特地提供當時相當稀

  少的胰島素，然而整個奧塞奇郡卻充滿了一種壓力與悲傷，奧薩奇族的人一個個的過世。

  每隔一段時間，觀眾就會看到一場奧薩奇族的喪禮，每一位奧塞奇人都年紀輕輕就過世，

  而馬丁史柯西斯也毫不埋梗的讓觀眾們看到這些奧薩奇人的死亡，幾乎全都肇因於威廉哈

  爾的陰謀。


  厄尼斯特從一開始到奧塞奇郡，就已經在威廉哈爾的計畫之下慢慢的讓他的白人親戚們與

  奧塞奇人通婚生子，繼而獲得當地的土地人頭權，故事清清楚楚地在描繪著一群當地的白

  人近乎明目張膽的顯露他們的貪婪，甚至連掩飾罪行都做得相當拙劣，而主角厄尼斯特則

  是在這個故事當中最為人格分裂的一位，與妻兒在一起的時候，他顯然是愛著自己的家人

  的，然而當舅舅找上門，要求他執行謀害奧塞奇親戚的計畫時，即使他經常顯現出膽怯、

  推卸責任的情緒，但是卻又總是被金錢與白人同儕的價值觀影響而從未拒絕，但是當他看

  到自己經手的災禍發生時，卻又顯得悲傷異常。


  如果厄尼斯特是個老奸巨猾又精明的智慧型罪犯的話，那還沒什麼好說的，然而厄尼斯特

  從登場時，就已經顯現出他根本是個頭腦簡單又單純，只有相貌英俊的傻瓜，但是也因為

  他是個單純又極好操控的傻瓜，因此電影的懸念，就在讓觀眾去看這個男人如何在他的「

  生意」與「家人」之間做出選擇。


  在三個半小時的片長中，觀眾一路看著厄尼斯特在兩者之間不斷地搖擺，舉棋不定、深受

  良心的折磨，製造出各種荒唐的謀殺案，那些拙劣的謀殺過程，成了一幕幕荒謬的黑色喜

  劇，我在看著那這些荒唐的事件時，總是忍不住失笑，可是笑著笑著卻又感到一陣心寒，

  這些人做這麼荒唐的事，竟然都還能逍遙法外，那個世界實在太可怕了。


  到了片尾，當胡佛所委派的探員前往調查時，厄尼斯特都已經似乎快要決定走出自我傷害

  的迴圈，結果卻又在最後一刻，出庭作證時被布蘭登費雪飾演的律師強勢主導下又改變了

  主意，看到這邊，身為觀眾，我簡直要瘋掉。


  厄尼斯特這個人實在是個非常意志力不堅定的男人，只要身邊有強烈的主導者在，就會容

  易屈從對方的意志，舅舅強勢主導他的人生，他屈服，胡佛派來的探員對他循循善誘，他

  屈服，等到一個高聲吼叫的辯護律師一出現，他又屈服了，這個人完全沒有自信，導致他

  的價值觀永遠都在隨波逐流，即使他有著自己的良知，但卻總是軟弱無力，他永遠都不斷

  的在欺騙自己，即使到最後面對自己的太太，他還是無法坦白。


  李奧納多這一次把厄尼斯特這麼一個笨蛋老粗演得頗具喜感，雖說他詮釋的仍舊有點生硬

  ，老是把下巴倔起又操著南方口音的他，看起來活像是個大力水手，但這個角色的愚蠢與

  膽小支撐了整部電影，我蠻喜歡李奧納多的表現的，看來昆丁塔倫提諾跟他合作之後他變

  得很放得開，演一個長相英俊但是頭腦簡單意志力又薄弱的美國鄉巴佬還頗為可愛。勞勃

  狄尼洛的演出自然是無懈可擊，跟馬丁史柯西斯合作多年的他，演一位貪婪、心機重的反

  派自然毫無障礙，相當的稱職，但是在看過【四海好傢伙】與【賭國風雲】的表演後，這

  一次他的演出，也僅屬於正常能量發揮的程度而已，反倒是片尾忽然登場的布蘭登費雪氣

  勢驚人，叫人印象深刻，而擔綱演出茉莉的莉莉葛萊史東在一眾外放演出的男演員中一支

  獨秀的展現內斂的表演，悲傷深沈的眼神，彷彿在對一切觀眾提出控訴般，不過可惜她所

  飾演的角色是一個從頭到尾的受害者，在整部電影當中，她最大的表演能量，就是在片尾

  對李奧納多提出的詢問，僅此而已，在之後，這個角色就這麼消失了。


  【花月殺手】對我來說，它是一部拍給熱愛1990年代好萊塢電影的觀眾看的電影，馬丁史

  柯西斯展現了他的正常能量發揮，打從一開始就讓觀眾知道，這是一群貪婪的白人企圖要

  搶佔擁有石油產地土地的印地安部族奧塞奇族的故事。而一開始的善惡局勢就已經那麼清

  楚了，因此觀眾在戲院中就是看著主角李奧納多在勞勃狄尼洛的羽翼之下過日子的日常故

  事，但是這三個小時的生活日常真是好看。


  你如果是喜歡【四海好傢伙】、【賭國風雲】、【愛爾蘭人】等片的觀眾，那你應該會很

  習慣這部片的步調並且樂在其中，但如果你是馬丁史柯西斯口中「主題樂園電影」式的觀

  眾的話，那就可能會很容易走神了。


  --'
