title: '[好雷] 花月殺手 '
content: '圖文完整版：






  臉書專頁：









  這是一個悲傷且殘酷的真實故事，但導演Martin Scorsese沒有炫技或刻意強調其中的苦


  痛，《花月殺手》從頭到尾都保持著一個旁觀者的視角，在看待這一段充滿剝削、詐欺、


  謊言、歧視、利用及愚蠢等等負面因子的事件。雖然從中還是有幾段剪接的敘述手法會忽


  然現出幾道較為銳利的鋒芒，彷彿告訴觀眾如果我是誰誰誰，可能就會把這個故事拍成那


  個樣子，比如兩三個讓你感到「喔原來如此」的倒敘畫面；兩三段讓你不禁發笑的黑色荒


  謬。




  但整體而言，Martin Scorsese始終保持著冷靜，將鏡頭對準三位主要人物，穩健的帶領


  我們看著這三人從開頭的狀態，如何走到結束，沒有過多的批判或情緒，就好像最後將整


  個故事作結的一段「廣播劇說書」戲，Martin Scorsese本人親自上場念完平淡又惆悵的


  結語。整部電影，導演就只是個「說書人」，他沒有要以誰的觀點或視角出發，甚至也沒


  有真的要你痛恨或討厭哪一個角色，因為這些主謀或共犯的邪惡或為虎作倀，往往就只是


  最普通最平凡的貪婪、愚蠢與慾望。但也正是這種平庸的人性與邪惡，交織出整起其實相


  當令人髮指的殘酷犯罪事件，甚至可能還遠遠不只有這一宗而已。




  事件核心受害者的Mollie有時會令人想到Ridley Scott《最後的決鬥》中的女主角，身處


  暴風眼和幾名男人的利慾薰心之中，始終以自己的方式，屹立不搖的奮鬥著，無論是自行


  聘請私家偵探也好，隻身抱病前往華盛頓陳情也好，面對這種幾近騙婚、殺光你家人再預


  謀你財產的險惡陰謀，Mollie最後只想要知道自己真心對待過的丈夫是不是真的能夠對自


  己坦承一切罪行，只可惜懦弱的Ernest終究還是做不到百分之百的懺悔。




  說起來這些手法雖然狠毒，但有時候實在是破綻百出，甚至明顯到應該很難不去懷疑


  William Hale一家老小，根本經不起一點點的推敲和調查。但廢到笑的同時卻可以在當時


  成為懸案這麼久，甚至一大堆都是「未經調查」，就只是因為當地執法共犯結構放水縱容


  的結果。也導致聯邦調查局終於千呼萬喚始出來的時候雖然有一絲如釋重負感，但也因為


  查案本身不是重點，實在是沒有正義總算獲得伸張的爽快。




  同時本片其實沒有太過沉悶緩慢，也沒有令人感到壓迫或不舒服。Martin Scorsese不疾


  不徐的花了三個多小時好好的、細膩的講完了這個故事，大部分的心力都放在「敘事」以


  及讓演員盡情發揮的上面。這個故事值不值得花費這麼多篇幅和時間、是不是可以有更具


  張力、驚悚度的方式來說；是不是可以讓這個故事拍起來更有力道、更「好看」、更具娛


  樂性，或許都是可以討論或有待商榷的，個人可能也不具任何資格去評斷這部電影是否是


  大師經典之作，但Martin Scorsese最終還是選擇了目前我們所看到的這個方式，盡量剛


  剛好的，來表達自己對這故事中的受害者、對印地安族群的尊重和致意。這部電影創作時


  ，並不是為了表達自己的想法，而是全心全意的想要呈現這一段故事當中這三名主要人物


  的心路歷程。




  人家可以用一部《花月殺手》讓我們看到美國白人和印地安人之間的愛恨糾葛，台灣自家


  或許也很多諸如此類的事件吧？漢人騙婚、詐欺平埔族原住民只為了取得他們的地產之類


  的？台灣是不是也有屬於自己版本的《花月殺手》呢？未來有機會看得到或者還原這些歷


  史真相給更多的普羅大眾嗎？或許是個很好的題材也不一定？




  --


  陳亭妃見那土壤觸手深陷，就與上次一般無異，更是驚奇，心想：「謝龍介的功夫明明遜

  我一籌，怎地也有這等厲害的指力？」一時滿腹疑團，突然伸手指在土上一刺，說也奇怪

  ，那土壤竟被她刺了一個孔。



  --'
