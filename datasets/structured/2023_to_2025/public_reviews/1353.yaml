url: https://www.ptt.cc/bbs/movie/M.1697898180.A.1B3.html
title: '[好雷] 花月殺手'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  時隔十年，馬丁爺爺與李奧納多終於繼《華爾街之狼》後再次合作長片。這次不但同樣改

  編自真人真事，還選擇美國史上駭人聽聞的奧塞奇印地安人謀殺案。片長長達三個半小時

  ，但緊張的劇情與緊湊的敘事，讓人絲毫感覺不到時間的流逝。



  1894年，奧塞奇人的居住地發現石油，當時該部落仍保有礦產權，便將土地租賃給天然資

  源開發商，因而變得極為富裕，然而，這也吸引如狼似虎的投機者一窩蜂地湧入領地。



  更糟的是，1920 年代「恐怖統治」時期，許多奧塞奇人死於離奇的謀殺，其中包括慢性

  中毒致死，他們賴以取得利潤的「人頭權」(包含石油權利的股份) 就此落入與之聯姻，

  顯然別有用心的白人闖入者手裡。



  故事圍繞在三個主要角色身上，他們之間的關係也勾勒出這起連環謀殺案的輪廓。李奧納

  多飾演的厄尼斯特‧勃克哈特是一位退伍軍人，但據厄尼斯特所說，他並沒有上戰場殺敵

  ，而是負責餵飽兵士將領的廚師，所以這並不能解釋他後來果斷涉入謀殺案件的冷血。反

  而就像聯邦調查局探員湯姆‧懷特所說，厄尼斯特的舅舅利用他的「個性」把厄尼斯特當

  作棋子使喚。厄尼斯特並不聰明，他從來沒有想要反駁舅舅的命令，即便厄尼斯特的確將

  舅舅交代的話轉達給打手，但他仍舊無法確保謀殺按照計畫進行，導致漏洞百出。



  另一方面，女主角兼整起事件的最大受害者莫莉，則是由莉莉‧葛萊史東飾演。他擁有二

  分之一的美國原住民血統，爸爸是聶斯坡斯人與黑腳族出身，媽媽則是白人，11歲以前都

  在黑腳族保護區長大。雖說不同原住民的習俗與傳統不甚相同，但這也讓莉莉更適合演出

  這個角色，尤其他在大學時期主修表演/導演、副修美國原住民學，再加上莉莉曾以《屬

  於她們的片刻》奪得波士頓影評人協會最佳女配角獎，精湛的演技使他成為目前奧斯卡熱

  門人選。



  莫莉從一出場就給人一種充滿智慧又優雅的感覺，也由於堤防不懷好意的騙錢仔，面對厄

  尼斯特一開始獻殷勤她都不予理會，故作冷漠。但隨著兩人一天天的相處，加上身邊好姊

  妹也說厄尼斯特的舅舅很有錢，他肯定是真心愛莫莉，她才讓對方擄獲自己的芳心。姊姊

  被殺害後，是莫莉決定聘請私家偵探，她最後也到教堂去向牧師表達自己的恐懼，認為可

  能有人想毒害自己，也是莫莉說什麼都要到華府去陳情，但如此聰慧的女子仍然敵不過心

  狠手辣的陰謀，讓人觀影時不禁為莫莉感到心疼。



  至於整部電影甚至歷史事件裡的「大反派」威廉‧哈爾，則找來近幾年都出演喜劇片的勞

  勃‧狄尼洛。年輕影迷或許都快忘記他過去可是演出讓人恨得牙癢癢的黑幫角色，這次某

  種程度上也算是重操舊業，不同的是，哈爾很懂得做表面功夫。他與奧塞奇族人的關係打

  得很好，與不少家庭之間都是世交，實際上也的確幫他們處理很多問題，甚至郡裡郡外捐

  獻許多錢進行建設，建立「大善人」的形象，就連比爾與瑞塔的爆炸案當晚他都還有完美

  的不在場證明。



  威廉從頭到尾都沒有露出邪惡的嘴臉，事情即將東窗事發也絲毫沒有恐懼，甚至是自己走

  進警局自首，史實紀錄上也是如此，而郡上的治安官甚至不買單，認為善良如他怎麼可能

  會是謀殺案的主使者。不過，這些表面的善心正是威廉‧哈爾可怕的地方，雖然從電影當

  中看不出他究竟是否曾想要嫁禍給姪兒使自己脫罪，甚至殺害對方，但哈爾肯定是個狠角

  色。片尾也告訴觀眾，雖說他被判無期徒刑，但最後不僅假釋出獄，還在療養院安享天年

  到87歲，真的是禍害遺千年。



  原著《花月殺手：美國連續謀殺案與FBI的崛起》著重在FBI如何調查此樁案件，而《花月

  殺手》的劇本一開始也是走這個路線，但馬丁爺爺後來發現明明是要揭露歷史黑幕，結果

  卻拍成一部以白人為主，甚至是從「白人救世」的角度出發的電影，因此大刀一改，成為

  現在的劇本，而李奧納多的角色也從湯姆‧懷特變為厄尼斯特。這個調整不只縮短觀眾與

  奧塞奇人的距離，讓大家對謀殺案前的人物關係與陰謀執行過程的可怖有更深的了解，也

  是真正從奧塞奇人的角度訴說這個故事。



  厄尼斯特從出場開始就不斷說自己愛錢，其實誰不愛錢呢？只是「君子愛財，取之有道」

  ，但美國印第安部落的人頭權（headright）制度吸引貪婪的惡人興起殺人之心。也因為

  這個案件，為了保護奧塞奇人與防止未來發生更多犯罪行為，1925年美國國會通過法律，

  禁止非奧塞奇人繼承具有二分之一以上奧塞奇血統者的人頭權。除了殺害純血奧塞奇人取

  得人頭權之外，片中也呈現出威廉‧哈爾詐領保險金的手段，不論是先為欠自己錢的亨利

  ‧羅恩保人身保險，再設局殺害，抑或是為自己的牧場保鉅額火災險，再於夜深人靜之時

  自己燒掉，都顯示出哈爾早已完全被貪念所噬。



  雖然厄尼斯特只是聽命於舅舅，但被錢沖昏頭，把道德倫理拋一旁的他做出這麼多傷害老

  婆身心靈的事，厄尼斯特對莫莉是否真的有愛？我相信是有的，如同他在法庭上作證時所

  說，舅舅的陰謀並不包括讓他設局贏得莫莉的心，畢竟他們兩人相識是在舅舅跟厄尼斯特

  提起莫莉這個人之前。也由於他真的不聰明，所以對於舅舅要求添加在莫莉胰島素的液體

  不疑有他，只覺得是要讓莫莉的腳步慢下來。厄尼斯特的內心到底在想什麼沒人知道，但

  從他某次把不明液體加入自己的酒裡，以及一切塵埃落定後知道自己遭毒害的莫莉質問厄

  尼斯特時，他依舊滿臉困惑的說自己注射的是胰島素，或許厄尼斯特真的只是比較笨且容

  易被操控而已。



  其實，除了錢財露白之外，這些可怕的謀殺案會發生也是因為嚴重的種族歧視。電影一開

  始就呈現出奧塞奇人從原生地被趕到奧克拉荷馬州，酋長會議中也正哀悼著未來的子孫將

  會被白人同化、忘記自己的傳統、與白人通婚，下一秒族人就沐浴在黑金之中。突如其來

  的暴富的確大大改善奧塞奇人的生活，但每當他們要提領較高金額的存款，就必須經過「

  監護人」的同意。這是源於1921年美國國會通過的一項法律，認定一夕致富的奧塞奇人沒

  有能力管理自己的金錢，明顯就是種族歧視的法令。



  威廉‧哈爾等人敢如此猖狂就像片中一句台詞所說：「一隻狗被殺可能都比一個奧塞奇人

  被殺更快破案。」即使奧塞奇人成為世上最有錢的一群人，白人的種族歧視還是無所不在

  。不管是看著聯姻生下的孩子指指點點誰比較白，看不出來是「雜種」，還是都已經有幾

  十名奧塞奇人被謀殺，郡上的白人與治安官都還能若無其事地說：「這裡是印第安保留地

  ，中央不會有所干涉。」本是賦予部落主權的行政區劃，頓時變為生死無人聞問的化外之

  地，因此，《花月殺手》是一部為美國原住民而拍的轉型正義電影。



  最後，則是電影的表現方式。男女主角出場時，都以第一人稱的口吻發表一段獨白，而電

  影最後揭露原來我們剛剛看的是一齣富有畫面的大型廣播劇。身為膠捲的擁護者，馬丁爺

  爺絕對是最懷舊的影人之一，說短不短、說長不長的現場廣播劇橋段，除了呈現擬聲音效

  （foley）之外，也將一些角色在事件後多年所講的話納入，例如：「如果那個該死的厄

  尼斯特不要亂講話，我們現在就是有錢人了。（If that damn Ernest had kept his

  mouth shut we''d be rich today.）」以非常懷舊的方式為《花月殺手》畫下完美的句點

  。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
