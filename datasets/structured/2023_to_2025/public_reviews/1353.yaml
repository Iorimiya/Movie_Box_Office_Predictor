url: https://www.ptt.cc/bbs/movie/M.1702305559.A.7DB.html
title: '[好雷] 《花月殺手》- 幫派性格的非關善惡之境'
content: "關於《花月殺手》相關討論已經很多，本文著重導演馬丁史柯西斯（(Martin Scorsese）\n描述的「美國性」（Americaness）提出一點稍微不一樣的想像與詮釋觀點。\n\
  \n\n\n\n\n雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\
  \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n (刊登於方格子的圖文並茂版本)\n\
  \n\n在已知的歷史事件-歐塞奇印第安人謀殺案改編，從維基百科（註）可以得知事件資訊上\n幾乎與電影如出一轍，而所謂的導演馬丁史柯西斯（(Martin Scorsese）的作者電影觀點\n\
  ：保持著對原住民的關懷（在許多鏡位上展示宗教性的莊嚴與後面的credit字卡感謝名單\n等等），與卻也沒有太過著墨原民文化傳統，以如此有點政治性（正確）議題來說已算是\n\
  有些淡化。\n\n\n電影還是著重在熟悉的史柯西斯般，在於普世人性的平衡，強調慾望與罪惡的運作和人與\n人的情感交流：如李奧納多與原住民之妻關係，並不是完全在利用，而是在實際上的愛情\n\
  中達成最後的謀略，同樣的並非用「工具性」可以一言蔽之的曖昧關係與外號「國王的」\n叔叔哈爾（勞勃狄尼洛飾）亦同；並且電影在大局上以一種陰謀悄悄進行的平舖直述，太\n\
  多對話稍嫌沉悶，後來因為人名太多有時候也並沒有仔細搞清楚誰是誰。\n\n\n影片最一開始的宗教儀式，將祖先的信物（？）埋葬並說著年輕人會完全擁抱白人的文化\n\
  ，這個段落是相當重要的。它正述說著，電影不打算去深究太多原民的傳統，例如：從泛\n靈論信仰中心向外延伸出各種原著民如何與外在環境共處的道德準則。\n\n\n於是重點是，那麼原住民還是原住民嗎？雖保留祖先的遺訓，並且維持母系社會，讓各懷\n\
  鬼胎的暴力男人們像是入贅式的暗地偷偷在處理爭權奪利的勾當。 但另一方面，電影描\n述歐塞奇印第安原住民因為石油一夜致富，像是刮中頭獎彩券般盡情揮霍，不斷擴張的慾\n\
  望。\n\n\n相較於傳統原住民沒有私有財富觀念。那些因石油致富的原住民除了在外表上，其實行為\n上的放縱跟白人並沒有太差異的情境，如此恰巧，讓人想到這樣「非關人種」的慾望「設\n\
  定」與馬丁斯柯西斯過往描述紐約幫派電影，關於原生血統與後生的集結交互成為幫派相\n互火拼。以此脈絡來看《花月殺手》參雜了原住民富人成為白人「黑道」覬覦目標，可以\n\
  想像成作者又像是提出一種，就只是人類原始慾望成群結黨的鬥爭，如此非關善惡之境，\n就像是野狗們在爭搶地盤的過程。\n\n\n這也是看待史柯西斯的電影從大量描述黑道利益交換與談判算計過程，或不斷享樂的慾望\n\
  的個體（如《華爾街之狼》）體現所謂「美國性」（Americaness）探究。\n\n\n也就是哥倫布發現美洲大陸之後，讓各國人種移民（或被奴役）「新大陸」的新混合體，\n\
  發生著各種擴張的慾望，各種掠奪土地與資源霸佔，在宣稱自由與不斷殺戮（因為槍枝合\n法化）的歷史中。（所以後面只剩下聖經與法律？）\n\n\n（註）\n\n\n\n\
  --\n\n拉特飯 - 以商業力量進入獨立市場\n\n--"
