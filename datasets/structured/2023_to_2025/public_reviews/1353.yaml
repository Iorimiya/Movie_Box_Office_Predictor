title: '[討論]馬丁史柯西斯 的好兄弟吐槽《花月殺手》！'
content: '＃馬丁史柯西斯 的好兄弟吐槽《花月殺手》！


  《蠻牛》《計程車司機》編劇 ＃保羅許瑞德 認為 ＃李奧納多狄卡皮歐 演錯角色了：

  .

  「馬丁曾將我比喻為是佛蘭德斯風的細密畫家，而他自己則偏好繪製文藝復興時期的濕壁

  畫。

  .

  只要你給馬丁兩億美元的資金，他絕對能交出一部好電影，然而話雖如此，我還是更希望

  李奧納多狄卡皮歐是在《花月殺手》裡面演警察，而不是他現在演的那個白癡，要觀眾和

  一個白癡相處三個半小時，可是一段很漫長的時間欸。」

  .

  註：狄卡皮歐原本確實是打算在《花月殺手》飾演 FBI 探員，但他和史柯西斯後來都覺

  得，若以 FBI 探員為主角，電影只會被拍成枯燥的辦案片，於是他們決定重寫劇本，將

  FBI 探員改成配角，與叔叔一同謀害奧塞奇族的歐內斯特則扶正成主角，他們認為歐內斯

  特內心的天人交戰更具張力、更值得描寫。

  .

  在同一篇《Le Monde》最新專訪中，許瑞德也直言 ＃瓦昆費尼克斯 不適合演《拿破崙》

  ：

  .

  「瓦昆費尼克斯是最沒有魅力的演員了，像他如此平凡又沒個性的人，怎麼可能有辦法立

  下這麼多戰功？我一秒都不相信。」


  =  =

  其實還蠻認同的，皮卡丘這角色實在有夠不討喜，看他緊縮眉頭跟下巴演一個近乎弱智的

  角色長達三個半小時，還蠻痛苦的


  --'
