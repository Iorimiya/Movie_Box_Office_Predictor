url: https://www.ptt.cc/bbs/movie/M.1613663870.A.521.html
title: '[情報] 史柯西斯新片《花月殺手》主要演員公布'
content: '在2019年時，名導Martin Scorsese公布了他的新片計畫《花月殺手》，此部電影將會促成

  他與兩位長期演員班底Robert De Niro和Leonardo DiCaprio的電影首次共同合作。



  而今日也正式公布了主要演員名單



  主角Tom White將由曾在Scorsese前部作品《愛爾蘭人》出演過的Jesse Plemons飾演。



  此角色原先是寫給Leonardo DiCaprio，但DiCaprio最終決定改飾演電影主要反派的姪子。

  Jesse Plemons也在今年的獎季片《Judas and the Black Messiah》擔任主要配角。而他

  原先希望能同時接演此部和《逃出絕命鎮》導演Jordan Peele的新片，但因檔期衝突所致

  ，只能棄演Peele的新片。



  電影的反派William Hale由Robert De Niro飾演，這也是他和Scorsese的第10部長片合作




  Leonardo DiCaprio飾演Hale的姪子Ernest Burkhart，在《屬於她們的片刻》有著亮眼演

  出的Lily Gladstone飾演DiCaprio的妻子Mollie Burkhart。






  《花月殺手》預計在今年五月開拍，改編自David Grann在2017年出版的同名著作


  電影劇本由《阿甘正傳》、《班傑明的奇幻旅程》名編劇Eric Roth撰寫


  而攝影和剪輯也是由Scorsese的長期班底Rodrigo Prieto、Thelma Schoonmaker擔任


  --'
