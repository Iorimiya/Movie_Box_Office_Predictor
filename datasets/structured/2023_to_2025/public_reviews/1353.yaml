url: https://www.ptt.cc/bbs/movie/M.1709317350.A.382.html
title: '[好雷]花月殺手 - 貪婪與愚蠢成就邪惡'
content: "雷文防雷資訊頁\n\n\n離上映過了好一段時間，最近因逢奧斯卡季讓《花月殺手》重新在少數幾間影廳限量\n播映，才讓我有這個機會在大螢幕第一次看到這部史詩級長片。\n\
  （這部不在大螢幕看大概看不完。而且三個半小時真的頗累）\n\n先說結論：個人蠻喜歡的，但覺得片長真的偏長。\n\n看完的當下覺得資訊量好龐大，回去看了一些評論跟講解，發現別人看到好多自己沒看\n\
  到的細節，深感佩服 > <，決定要來梳理一下想法。\n\n第一次發文 排版請見諒(′･ω･`)\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n【電影取材】\n\
  故事取自真實事件，1910s - 1930s 真的有很多白人進入印地安人的領地，以明或暗的\n手段掠奪他們的資產。我在看電影前對這段歷史完全不清楚，所以這部電影對我來說也\n\
  是很有教育意義。\n\n故事當中的 Osage 人在白人進駐後被迫搬遷，來到 Oklahoma，一片原先被認為貧脊的\n土地。沒想到，埋藏在這片土地之下的是豐富的石油，因此\
  \ Osage 成為當時世界上最\n富有的民族。只是石油是財富同時也是詛咒。\n\n當時的印第安人有了很多錢，但卻沒辦法實質支配自己的財產。平常他們的財富由政府\n\
  管理，女人是 \"incompetent\" 需要所謂「監護人」同意才能運用自己的錢財。很多印地\n安人和白人通婚，這些監護人於是經常由白人擔任。謀財害命層出不窮。權貴與地方政\n\
  府、警政系統聯手遮天，一宗又一宗的謀殺案發生，但全都找不到兇手，因為這些有權\n有勢的人都在分贓。\n\nErnest 和 Mollie 在歷史上都是真有其人。Ernest\
  \ 實際上也真的受到舅舅指使要把\nMollie 的家族除掉，把 headrights 留在 Mollie 身上（繼承遺產的權利），最終再\n把 Mollie\
  \ 除掉，讓財富留到 Hale 家。\n\n看了 Lily Gladstone 和 Leo 的訪談，裡面提到他們做了很多的調查，想要了解這對\n夫妻當初是如何認識、如何相戀，在戀愛之前\
  \ Ernest 是不是就已經被舅舅 King 影響，\n已經有了劫財的計畫等等。Leo 說其實現在沒有任何證據可以證明這些事，當時沒有留\n下任何紀錄之類的，所以他們在做角色的功課時都是透過\
  \ Ernest 和 Mollie 的後代對他\n們的印象重建他們相識的場景。\n\n\n【演員】\n這部電影要呈現歷史上的真實事件，一切都以史實為本，因此人物的詮釋也變得極為重\n\
  要。\n\n看完我完全被女主角震懾。之前就有看到某些影評盛讚女主角的演技，看完之後可以理\n解為何。女主角 Lily Gladstone 有渾然天成的氣場，一張睿智、沈穩、充滿靈性的臉。\n\
  她的聲音有種跨越時空的特質，念旁白時，令人肅然起敬。\n\n另一方面，李奧納多的演技好像比較受到批評。我到現在回想還是不太確定要怎麼為他\n的表演定調，可能是角色頭腦也比較簡單的緣故，他的表演比較直接，而且感覺很像以\n\
  前那一套，演到後半的時候甚至有八成的時間呈現一個  ：（  的表情，總覺得有點卡\n通化？調性不太合，有點出戲。\n\n總覺得還應該討論一下 Robert DiNero。他把老奸巨猾的形象做到淋漓盡致，但也比較\n\
  像是黑幫類型電影的常見角色，我覺得沒那麼有趣。\n\n\n【劇情討論】\n看這部才一次，沒有專業背景的我還是把第一次觀影的重點幾乎都放在了劇情上面。\n\n觀影當下最大的問題，就是我一直搞不清楚\
  \ Ernest 為什麼會笨到看不出來他給 Mollie\n的藥是有問題的？而口口聲聲說著愛 Mollie 的他，為什麼會一而再再而三的謀害她的家\n人、讓她心碎？他真的愛她嗎？\n\
  \n如果 Ernest 真的如他所說的一樣愛 Mollie，從最後的結局也可以看出他選擇了自己的\n老婆孩子勝過舅舅，那麼唯一能說明他的行為的就只有愚蠢。Ernest\
  \ 的生活被 King 完\n完全全控制，對他唯命是從，像是一名軍人一樣執行著 King 的口令，沒有質疑，是因為\n他完全沒有獨立思考的能力，完全靠別人幫他決定。\n\
  \nErnest 也貪財，他幹搶劫的勾當、好賭、詐領保險金。在他舅舅的看顧下，再加上他的\n老婆家裡這麼富裕，他根本不缺錢的。他只是習慣這樣追逐錢財的生活模式，超越道德也\n\
  超越法律（反正警察基本上根本是他們家的）。Ernest 心中沒有邪惡的想法，但他的短視\n近利和愚昧單純使他變成了邪惡的實踐者。\n\n另一方面來看，我也不懂\
  \ Mollie 為什麼會被蒙在鼓裡這麼久？這真的顯示了 King 做了\n多麼完備及長遠的佈局，建立堅不可摧的信任，讓她即使聰明、謹慎、又有行動力，無論\n\
  如何也不會懷疑到他頭上。\n\n還有，像她這麼聰慧的人一開始為什麼會愛上 Ernest 呢？Ernest 的藍眼睛真的這麼讓\n人心醉嗎？（愛情果然是盲目的嗎）\n\
  \nMartin Scorcese 在最後用白人廣播劇的形式作結，我看到別人的評論才恍然大悟：原來\n這是一種對電影本身的反諷。一個白人導演嘗試說出印地安人的故事，終究還是外人的角\n\
  度，還是一種搶走詮釋權的舉動。別人實際上發生的苦痛，轉換成了一種娛樂的形式呈現\n在大眾眼前。\n\n這也讓我反省起自己。觀影過程中我的困惑一直在累積：我期待看到\
  \ Ernest 的大徹大悟\n、之後對 Mollie 發自內心的懺悔：他真的應該認知到自己的錯誤、對 Mollie 感到抱歉\n吧？我也期待著 Mollie\
  \ 能夠像偵探小說一樣靠自己找到真相，歷經崩潰之後決意離開\nErnest（她的離開會成為一種報復）。不過電影既沒有呈現 Ernest 對 Mollie 的懺悔\n\
  （他到最後一刻還說了謊，或是，他真的笨到不知道自己過去做了什麼），也沒有\n Mollie 懲罰 Ernest 的劇情，我覺得充滿了不平衡。\n\n原來我是以戲劇的標準在預測（要求）這個故事的走向。當史實就是這樣，有罪之人最後\n\
  還是沒有誠實面對，平凡之人也無法輕易掙脫謊言，我的預期就只是我的一廂情願。\n\n--"
