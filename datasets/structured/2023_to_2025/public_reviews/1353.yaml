title: '[好雷]花月殺手 '
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  \n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\
  對很多人而言，似乎很難去定義《花月殺手》的故事。雖然預告剪得像是印地安人和白人\n的邊境衝突，但實際上有的卻只是不斷的陰謀策畫，以及單方面受害的奧賽奇族人。而它\n\
  也不像是典型的轉型正義片如《竊聽風暴》、《辛德勒的名單》或是《謊言迷宮》，在刻\n劃正派的主角勇於對抗龐大的政治陰謀；其中的主角儘管飽受內心掙扎，實際上仍作惡多\n\
  端，必須為整起陰謀負上不小責任。\n\n    我認為，單純就敘事的角度而言，《花月殺手》還是脫離不了《四海好傢伙》、《賭\n國風雲》這些經典黑幫電影：偏離規範的致富方式、逐漸失控扭曲的心態，以及最後的大\n\
  審判。當然，考量到奧賽奇族和白人的權力關係，以及題材的嚴肅性；在倫理上，不可能\n會採用這些經典所具備的荒誕情節。因此，在本片中，我們看到的是一個相對簡單但有力\n\
  的故事；而儘管觀眾仍跟隨厄尼斯特的視角理解劇情，理解帶來的是惋惜和憤怒，而非獵\n奇刺激。\n\n    進一步，在角色的設定刻畫上，也能夠看到史柯西斯一貫的偏好：疏離、略帶偏執和\n\
  陽剛的男性。藉由劇情我們知道厄尼斯特是一個剛從一戰退伍的廚子，儘管並非前線但也\n受到了現代戰爭洗禮。在這個狀況下，他滿懷性欲和物質欲地來到奧賽奇的領地，藉由開\n\
  計程車維生；配合著電影剛開始，他透過後照鏡看莫莉的那幾個鏡頭，根本是《計程車司\n機》裡面Travis Bickle的翻版。\n\n    不同的是，有別於過往史柯西斯片中這些雖然明顯遊走在道德另一端，卻又個性鮮明\n\
  的主角；厄尼斯特，就只是他的舅舅比爾的傀儡而已。所有的一切，從退伍後的職業、人\n生目標到獲取財富的手段，在電影剛開始不到20分鐘，便直接被比爾清楚的定義，以成為\n\
  這位「奧賽奇丘之王」的踏腳石。甚至連厄尼斯特的歪腦筋詐領保險、出庭作證，都被比\n爾以PUA的方式狠狠教訓；儘管犯罪的手段殘忍，觀眾更會記得的或許是他在面臨愛妻受\n\
  到毒害時的無助和軟弱。\n\n    一開始意識到主角的個性時，我並沒有很喜歡這樣的設定；誰會想看一個在事業上被\n當工具人，更要被迫毒害自己妻子的人做為整部電影的主角？但後來想想，對比於《計程\n\
  車司機》中對於Travis無意的英雄化，讓其成為男性觀眾間的「經典」；史柯西斯或許更\n想要呈現的是這樣的人格，儘管看似具備陽剛氣概和牛仔精神，是如何受到有權力者的操\n\
  控。此外，在片尾厄尼斯特對莫莉的謊言，也讓我聯想到《教父》結尾Michael對於Kay的\n回答；但對於厄尼斯特，他的否定只是更加突顯了自身的怯懦。\n\n \
  \   整體而言，《花月殺手》應該不會是馬丁的電影中，我會特別喜歡的類型(就題材而\n言)；但就觀影體驗而言是很好的。包括場景布置、配樂和鏡頭都十分精確和流暢，不會\n\
  讓人覺得脫離故事，而是很好的沉浸在其中；而儘管講述的是異文化的政治悲劇，如同此\n前的《達賴》和《沉默》，都不會讓人覺得是在觀看一部好萊塢的白人救世主電影，或是\n\
  對於文化有嚴重曲解；更不用提，儘管馬丁多是拍男性題材，此片中莫莉的角色仍有充分\n的發揮。我認為《花月殺手》是近期相當值得一看的電影；當然，對於習慣看「主題樂園\n\
  」的觀眾而言，恐怕還會有更好的選擇。\n\n網頁版\n\n\n--"
