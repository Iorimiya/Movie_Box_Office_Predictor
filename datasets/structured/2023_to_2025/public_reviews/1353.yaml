title: '[好雷]'
content: '《花月殺手》被外媒評為史柯西斯繼《四海好傢伙》以來最好的作品

  所以我是抱持萬分期待觀賞的

  確實劇中李奧納多也演得很好給我很深的印象


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線~~~~~~~~~~~~~~~~~~~~~~


  他飾演的Ernest Burkhart

  應該是李奧從影以來演過最無路用的人設吧

  美其名是退役士兵

  但其實只是個從沒上過戰場還老是鬧腸胃病的伙房

  生平無大志

  只要有錢和女人就行


  平庸不是罪

  但Ernest還偏偏是個懦弱無主見之人

  對叔叔說的話唯命是從

  盲從舅舅所說的我是為你好

  以及一切只是讓必然會發生的事提前發生而已等總總藉口


  甚至到最後

  他明明知道叔叔讓他給妻子施打的藥物有問題

  卻還是自我說服那只是讓妻子變慢而已

  他只是要讓妻子不要再追究案件

  這一切都只是為了所有人好


  他也許不是窮凶極惡之徒

  但是他的默許與參與

  才讓哈爾的惡意得以肆無忌憚的擴散

  侵蝕他最愛的妻子與其族人


  看完之後不禁反思起「邪惡的平庸」這句話

  面對不公不義選擇冷漠以待

  自認不主動攪和就無需承擔責任

  但因漠視而未能阻止惡意蔓延

  實際上會不會其實就是幫兇無異？


  看完之後又回去上cp+複習史柯西斯的舊片，像是《華爾街之狼》、《隔離島》、《沉默

  》，另外很驚喜發現有之前重映的《達賴的一生》可以看到史柯西斯難得的憐憫和溫柔

  真的很推大家去看馬丁史柯西斯的更多片


  --'
