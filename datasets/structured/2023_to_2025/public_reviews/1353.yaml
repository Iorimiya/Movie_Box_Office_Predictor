url: https://www.ptt.cc/bbs/movie/M.1697803666.A.30C.html
title: '[普雷] 花月殺手'
content: '無雷簡短心得：


  首先，建議要精神很好的時候去看，我睡飽去看都覺得有點撐不住。

  應該是馬丁史柯西斯作品中前幾沉悶的，節奏慢得很沒道理。


  片長太長是主要的問題，看的過程一直覺得有需要拍這麼長嗎？

  很多情節看不出有非保留不可的原因，個人認為剪成2~2.5小時會好很多。


  笑點極少，故事也沒什麼爆點，所以看到後段真的很累。

  配樂很棒，皮卡丘的戲份超多也演得不錯。


  大概就這樣。




  --

  我反而喜歡蒼鷺與少年

  沒看IMAX

  我覺得四海好傢伙好看很多

  奧本海默完全不悶

  我是覺得姊妹們的情節都可以快速剪輯帶過就好'
