url: https://www.ptt.cc/bbs/movie/M.1684426956.A.8CF.html
title: '[新聞] 李奧納多狄卡皮歐等不及！《花月殺手》揪'
content: '新聞網址：


  2023-05-18 23:38 中時 翁紫曦


  李奧納多狄卡皮歐等不及! 《花月殺手》揪三大影帝同台飆戲


  今年最受矚目電影《花月殺手》由金獎大導馬丁史柯西斯再執導演筒打造「史詩級西部犯

  罪傳奇」電影，即將於第76屆坎城影展5月20日進行首映，10月20日於全球戲院上映。眾

  所矚目的主角李奧納多狄卡皮歐於今晚搶先於社群發佈前導預告，並提到「這是一部我引

  以為傲的電影，迫不及待地想與大家分享。」


  《花月殺手》為真實故事改編，由金獎大導馬丁史柯西斯與《阿甘正傳》、《一個巨星的

  誕生》奧斯卡提名編劇艾瑞克羅斯共同擔任編劇，改編自大衛格雷恩撰寫的同名暢銷小說

  《花月殺手：美國連續謀殺案與FBI的崛起》。


  將透過《神鬼獵人》金獎影帝李奧納多狄卡皮歐所飾演的歐內斯特勃克哈特（暫譯）和《

  屬於她們的片刻》莉莉格萊斯頓所飾演的莫莉凱爾（暫譯），譜出一段由真愛與背叛交織

  的故事。


  故事描述在20世紀初，奧塞奇族因蘊含豐富石油資源而一夜致富，成為了世界上最富有的

  人，因此立即吸引了白人的入侵，他們在密謀採取謀殺行動前，盡可能地操控、勒索和竊

  取奧塞奇族的錢財。奧塞奇案被喻為美國史上最殘忍的大規模謀殺案，也是為美國歷史最

  黑暗的「恐怖統治」事件。


  眾星雲集卡司群包含金獎影帝勞勃狄尼洛、《犬山記》奧斯卡最佳男配角提名傑西普萊蒙

  以及去年以《我的鯨魚老爸》拿下奧斯卡金獎的布蘭登費雪等實力派演員同台飆戲。


  --'
