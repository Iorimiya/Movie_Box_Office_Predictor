url: https://www.ptt.cc/bbs/movie/M.1680258267.A.82E.html
title: '[情報] 史柯西斯《花月殺手》將於坎城世界首映'
content: '坎城影展官方於方才正式宣布，金獎名導Martin Scorsese最新執導作品

  《花月殺手》(Killers of the Flower Moon) 將於今年坎城影展世界首映。


  《花月殺手》為Scorsese睽違4年的新作，更特別的是本作也為他睽違37年後再度於坎城

  影展映演的作品，前次於影展映演作品已是1986年《下班後》(After Hours)， 入圍競賽

  單元，Scorsese也憑此部獲得最佳導演。


  此作將再次攜手Scorsese長期合作演員Robert De Niro和Leonardo DiCaprio，這部也將會

  是Scorsese/De Niro合作的第10部長片、Scorsese/DiCaprio合作的第六部長片。


  另外參演的演員還有新科奧斯卡影帝Brendan Fraser、Jesse Plemons、Lily Gladstone、

  John Lithgow。


  《花月殺手》已定檔10/6於北美限定放映，

  10/20由派拉蒙排映北美大規模放映，AppleTV+尚無確定上線時間。


  ------


  會於今年坎城影展放映的作品有


  《Asteroid City》│Wes Anderson

  《印第安納瓊斯之命運鐘盤》│James Mangold

  《花月殺手》│Martin Scorsese

  《Strange Way of Life》│Pedro Almodóvar


  --'
