url: https://www.ptt.cc/bbs/movie/M.1697808921.A.00F.html
title: '[好雷] 花月殺手'
content: '今天看了imax版本的花月殺手，先說需不需要看到這版本的完全見仁見智，以特效跟音效

  來說刺激的點比奧本海默還要少，整部都是紮實的文戲跟充滿考究細節的劇情，好處大概

  只有大畫面可以專心沈浸在那股時代感當中。


  片長雖然三小時半，但比較沒什麼無趣的尿點，以故事來說越到後面是越精彩，但馬丁的

  風格和節奏在這種歷史劇情片上對大部分觀眾來說還是偏慢，所以體感時間還是有坐了很

  久的感覺。在故事上跟奧本海默類似的點是人物一樣很多，而且許多配角都有關鍵的戲份

  ，要蠻認真記名字跟長相的。


  在講演員之前想先提另一個深刻的點，關於奧塞奇一族的文化及當時美國西部的時代感，

  覺得馬丁導演很認真的盡量重現了當時的氛圍，至少場景和美術設計沒有讓我出戲。


  演員部分李奧納多跟勞勃狄尼洛兩個都很傑出，除了都有各自發揮的地方，整部超過一半

  都有兩位精彩的對手戲。狄尼洛的角色從開場就能看出是個城府極深的狠角色，雖然總是

  和善待人但能感覺到總在計算下一步，老戲精就是能駕輕就熟的掌握。


  李奧納多的角色雖不能說是純粹的邪惡，但明知自己做的是錯事和壞事，為了「利益」兩

  字還是看著自己無法自拔的深陷在一起起殺人案中，展現強大演技的時刻個人認為是法庭

  的審判戲和最後雖然坦白一切但面對老婆最關鍵問題仍無法誠實回答的那兩段。


  女配角Lily Gladstone在和上面兩位對戲時則同樣繳出了精彩的演出，身為精明的奧賽族

  女性面對白人對石油和土地權的貪婪而設計許多陰謀卻無能為力，尤其是看著身邊親人一

  個個死於非命，其中的痛苦和無人能相信的無力感讓人揪心。


  總體來說這是一個好電影，但不是那種「好看」的片，馬丁用他的方式說了一個他想講而

  且仔細思考背後其實極為黑暗且殘忍的歷史故事，我相信如果讓大衛芬奇來拍的話可能就

  會變得像火線追緝令或索命黃道帶這樣較刺激的懸疑推理犯罪片，但馬丁的風格就是看觀

  眾能不能接受了，或許就像馬丁片尾驚喜的客串提到茉莉的訃文完全沒提到那些謀殺案，

  但馬丁或許希望我們能知道這段歷史。



  --'
