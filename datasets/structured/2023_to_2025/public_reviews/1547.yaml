title: '[好雷]有盡頭的路，無止境的愛：〈長路將盡〉'
content: "電影〈長路將盡〉（IRIS，2001）改編自JOHN BAYLEY的書IRIS: A MEMOIR & ELEGY FOR\nIRIS（中文版《輓歌：寫給我的妻子艾瑞絲》由天下文化出版）。片中的他是英國當代著\n\
  名的文學評論家，也是牛津大學的文學教授；他的妻子寫了二十六本小說，寫過哲學，戲\n劇和詩句；一生獲獎無數，受封為英國女勳爵，被譽為「英國最聰明的女人」。他說自己\n\
  很有福氣能娶到她，不需要再多說，因為好酒不需要推銷，她絕對不會介意被他比喻成酒\n。\n\n然而，一切的美好與幸福都因為她的失智症而煙消雲散。一開始，只是她在一次接受訪問\n\
  中，突然「卡住」：聽不清楚主持人的問題，就算聽清楚，想回答時卻找不要詞彙，說不\n出話語。\n\n「英國首相的名字是什麽？」醫生問。\n\n很難想像一個寫過二十六本書的人會被問這樣的問題，帶著尊嚴的她，當著丈夫的面，有\n\
  點不耐煩，有點不高興回醫生：「我不知道，問他吧，不知道，沒什麽大不了，反正一定\n有人知道。」而且質疑：「我不知道我為什麽要在這裡。」她只想趕緊離開醫院，越快越\n\
  好。\n\n回到家後，她還是卸下在醫院的武裝，在丈夫面前示弱：「我有很多好點子，但我就是不\n能把他們合併起來；我常常都把名字給忘了。」\n\n    她在質疑，也在求救；她在衰退，也在前進。\n\
  \n    再度求醫，醫生說：「基本上，我會安排一下，再做些測驗和掃描，然後確定。」\n\n    雖然這位丈夫是高級知識份子，但是面對這樣一個不能治癒、只能延緩惡化的情形，\n\
  也展現徬徨與無助：「她是一個有頂尖頭腦的女人，但她覺得在寫新書時，特別累而且困\n難。她有很清澈的頭腦，我已經老糊塗了，但她不是。一切都是她打理的，一直都是：食\n\
  物、逛街、買票，我從來不應付這一切。」\n\n她說：「如果我不能再寫，我就會像一頭饑餓的動物，就像一頭饑餓的狗吧。」惆悵不平\n，憂心忡忡。\n\n「不會的，我會給你加油。」他還是耐心撫慰。\n\
  \n這天，門鈴響了，她開門，看了門外的人，向內叫道：「是…送信的人。」\n\n他知道，她連「郵差」都說不出來，柔聲道：「那只是郵差。」接過包裹，是她的書，「\n\
  妳寫的書。」他把書地過去給她。\n\n她瞧都不瞧一眼，又說：「那只是郵差。」有點緊張，知道自己怎麼連收信這麼簡單的事\n都不會，又喃喃自語：「那只是郵差。」\n\
  \n「不是你的錯，不是你的錯。」他趕緊解釋，讓她平靜下來。\n「對不起！對不起！」她忽然用力的道歉，又提醒自己說：「那只是郵差。」\n「是的，好了，沒事的，那只是郵差。」他哄著她，難過到極點。\n\
  「那只是郵差。」她還是一直重複說著，好像是拼命去記住，不能再忘了。\n\n多麼令人心疼！即便她意識清楚，外觀沒什麼變，但她自己知道生病了，即便如此；她還\n是為身邊的人著想，想要儘量不給丈夫添麻煩。\n\
  \n而電影細膩地描繪了與失智者溝通的技巧：多談過去發生的事，一起做過去做過的事。於\n是他對她執行「懷舊治療」：約她出去，那是他們年輕時常一起做的事。他問：「如果明\n\
  天沒下雨，我們就去游泳。」\n\n「不要。」她其實想去。\n「要，妳很喜歡水。」\n「不要。」\n「妳不是很喜歡游泳嗎？ 游泳對你有益。」\n「我們什麽時候走？」\n\
  「不是今天。」\n「我們去倫敦嗎？」\n「不，我們去游泳。」\n「我們什麽時候走？」\n「不是今天。」\n「我們什麽時候走？」\n\n    她一直重複問「什麽時候走？」，他要帶她去年輕時他們共同擁有甜蜜回憶的地方，\n\
  當年的她直截了當，邊游邊說：「我要你！」而如今，他看著她，她穿著襪子就準備下水\n。\n\n    片中也灌輸了照顧者應有的觀念：如何成熟地、有計畫地走過這歷程，不但照顧到病\n\
  人，也讓自己不要沉浸在負面的情緒中。當妻子狀況惡化，晚上睡不著，弄出很大聲音，\n丈夫也無法睡覺。後來更嚴重，她離家出走，他瘋了似的到處找她，還好她被認識的人送\n\
  回。他想：「妳做的每一件事，說的一切，寫的書，妳都做得很好，妳一輩子都做得很好\n。無論妳做什麽，我知道的。我也知道妳的世界已經沒有我了。」\n\n對病人的關懷似乎永遠不夠，對自己的釋懷也永遠不足。她的狀況越來越不好，他的愛和\n\
  耐心被磨光了，發瘋了似的發洩大叫：「我恨妳！妳是隻笨牛，我真的很痛恨妳！痛恨妳\n的每一吋。妳所有的朋友都受夠了，沒有人能再擁有妳，就連妳最好的朋友，失智症。」\n\
  這的確讓人心酸，同時也省思：如何讓患者有好的生活品質，自己也獲得圓滿的經驗，是\n要不斷學習的一門艱深又不易的功課。\n\n    整部片子不斷強調丈夫在辛苦照顧妻子之餘，不斷調整自己心態，自己給自己正向力\n\
  量，走過一切。他想：「她的腦海裡不止有一個世界，一個秘密的世界，我是唯一知道她\n秘密世界的朋友。」又想：「她在她自己的世界裡，或許，她一直都很想這麽做。」還想\n\
  ：「我要是告訴她我所有的愛，我靈魂所愛慕的，我想她會聽到的。」\n\n    最令觀眾動容的是片尾，這一天，他帶著呆滯的她參加她好友的喪禮。結束後，她看\n著好友的棺木，看著看著，她忽然想起好友的名字，追著棺木。他把她拉住，帶她上車。\n\
  途中她情緒失控，自開車門，摔出車外，跌下山坡。他嚇壞了，立刻停車，四處尋找，一\n不小心也滾下山坡，兩個老人撞在一起，這一撞她突然靈台空明，對他說：「我愛你！」\n\
  他也說：「我知道！」他把她緊緊抱住，接著又說：「我以前很怕單獨跟妳在一起，現在\n我絕不離開妳，我們回家吧！我們還有明天、後天、大後天，我們會一直下去。」\n\n\
  她曾說：「教育不會讓你快樂，自由也不會，如果我們現在是自由的，我們不會因為自由\n或受過教育而快樂，教育或許是讓我們發覺快樂的途徑，它拓展我們的視野，讓我們聽得\n\
  更多，告訴我們哪裡可以找到幸福。」是的，對她而言，她得到幸福，她失去幸福；她擁\n有自由，她失去自由，因為失智，她失掉了幸福，失去一切。影片這樣刻畫她發病後的脆\n\
  弱：「我覺得，我好像在黑暗裡划船。我有點怕，但是；有時我又不怕。」她黯然無助，\n害怕，內心好像破了一個洞。\n\n疾病是可怕的，但她在徬徨無助之時，還是有丈夫對她的愛。她深信愛的力量：「人類是\n\
  互愛的，在性，在友情，還有在戀愛時，他們都能珍惜他人，人類，動物，植物，甚至是\n石頭，都在爭取幸福，提升幸福。」就是這股信念，她在發病不久後，對丈夫深情的說：\n\
  「你和我就是完整，如果你或我走了，那我們的完整裡就會有個洞；但一個完整是不會破\n的，它只會再形成另一個完整。」\n\n令人想起元朝趙孟頫之妻的〈我濃詞〉：\n\
  \n你濃我濃，忒煞情多，情多處，熱如火。\n把一塊泥，捏一個你，塑一個我。\n將我兩個，都來打破，用水調和，再捏一個你，再塑一個我。\n你泥中有我，我泥中有你。\n\
  與你生同一個塌，死同一個槨。\n\n「再形成另一個完整」，就是你身上有我也有你，無論實質形體，不管前世今生，魂魄與\n對方合而為一，如膠似漆永不離。\n\n很多失智症患者到最後已認不得家人，不能回饋任何的愛。照護的家人該如何自處？片中\n\
  無怨無悔的丈夫給了答案：他包容、他瞭解，他接受。他說：「就算是不被滿足的愛，也\n是充滿諒解的關懷。」因為對他而言，付出的愛永不足夠；對他而言，無限心疼，充滿諒\n\
  解；對他而言，他不需要天長地久，曾經擁有她，她就是天長地久。\n\n\n\n\n\n\n\n\n\n\n\n--\n張無忌伸臂扶住趙敏肩膀，柔聲道：「我義父做事顛三倒四，你莫跟他一般見識。」\n\
  趙敏臉埋入他懷裡，含含糊糊的道：「你自己才顛三倒四呢，不怕醜，還說人家！」\n\n\n--"
