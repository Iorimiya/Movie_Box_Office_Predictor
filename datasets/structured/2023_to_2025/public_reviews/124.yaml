url: https://www.ptt.cc/bbs/movie/M.1758367335.A.B8A.html
title: '[ 無雷] 出乎意料的 8號出口'
content: '看完的心得是導演選擇了一條相對艱難的路走

  但結果來看是成功的


  我自己是遊戲原作的愛好者，

  Steam、Switch 2、Meta VR 甚至安卓版全都買了

  而且也都達到全成就

  覺得這片要電影化最簡單的方式

  就是把遊戲裡五六十種異變

  全都用頂尖特效演一遍，拍成無腦靈異片

  直接簡單粗暴但有效的服務粉絲，瘋狂嚇人，

  反正日系驚悚片嘛，票房也不會多差


  但導演和編劇沒有這麼做

  而是選擇把遊戲主題當作背景基礎設定

  進行了極大幅度的二創

  讓他直接登上不同高度

  從原本毫無故事的小眾獨立遊戲

  變成意外精緻充滿層次感的劇本


  這種企圖，很容易變得吃力不討好

  就像把一道風格強烈的街邊小吃

  模改成高級料理的手法重新詮釋

  如果沒拿捏好就會兩端客群都服務不到


  以玩家角度

  遊戲裡的經典異變沒有在電影中全數出現

  尤其比較驚悚的那幾種反而沒發生

  第一人稱畫面也只有開場玩一小段時間

  這點我是覺得有點太客氣溫和了


  但意想不到的是，電影視角居然不只主角

  而是透過三個角色的視點堆疊來看這個事件

  時間空間各有微妙差異

  且終場處理還有些  Inception 的開放韻味


  即使沒玩過遊戲，也能輕鬆享受這90分鐘沒問題

  玩過遊戲則會驚艷

