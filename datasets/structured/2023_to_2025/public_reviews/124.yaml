url: https://www.ptt.cc/bbs/movie/M.1758281187.A.EF8.html
title: '[好雷] 「8號出口」猶如「如來佛手掌心」'
content: '~~~防雷線~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  ~~~~~~~~~~~~~~~~~~~







  以前聽過一句話，「孫悟空逃不出如來神掌！」看完這部電影，我就聯想到了這句話。


  「8號出口」猶如「如來佛的手掌心」，人，就如同孫悟空；這裡我所比喻的孫悟空，當

  然不是鳥山明筆下的孫悟空，而是指我們所有的人都是孫悟空，所以才會在同個空間時間

  裡相遇，或者更貼切一點的說，才會一起輪迴在同樣這個地方，不然的話，我們是遇不到

  的！


  「接近」走出「8號出口」的方式，大概就是，命運又把你丟回你原本需要重新學習的地

  方！端看你再次遇到時，會做出怎樣的選擇？抑或是，還是習慣那個當孫悟空的自己？那

  或許也沒有好或不好，只不過就等於繼續待在「如來佛的手掌心」，繼續迴圈、繼續徘徊

  在8號出口的邊緣！


  看似好像出去了，但其實還是出不去！還是等於停留在如來佛的手掌心裡面…


  我覺得這部電影，其實有滿多思考的點，看完之後也會有很多創意和靈感可以激發延伸的

  那一種，它有點像是商業娛樂與劇場藝術合起來的那種電影，個人滿推薦的！


  --'
