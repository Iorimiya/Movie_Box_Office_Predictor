title: 'Re: [ 無雷] 出乎意料的 8號出口 (有雷)'
content: '我覺得說教很成功阿  男主角成功面對她有小孩要當爸爸的事實了

  然後後面時光倒回一開始搭車的時間地點  他一開始說他視而不見

  最後  他行動了


  這不是很成功嗎?  雖然沒有用腳色的嘴說教  但男主角很大的行動不就成功了


  有  有2個地方留白沒有講  要不如說很好懂得  可以開釋我一下嗎?



  一  JK說人都有愧疚 所以被八號出口困住 大叔愣了一下  但沒說什麼事

  大叔最後逃離出口時  說我沒有錯  我沒有錯 我沒有錯


  這邊就留白一大片




  第二  小男孩說他沒見過爸爸  還有洪水來時 那一大段劇情

  我的解釋只是男主角"幻想"如果他有小男來這樣的小孩  他應該會怎麼負責

  見到女主角時  小男孩會叫媽媽  我的解釋是出口讓兩人看到的影像不同



  但大部分解說的都說  這小男孩就是主角未來的小孩  這一點我覺得BUG很大




  那  你們的解釋是如何??

  沒有  最後一次沒有失敗阿  就是8號出口的出口了


  而且八號出口還帶他到9:36之前上車的地點了



  --






  --'
