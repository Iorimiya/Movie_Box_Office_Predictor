url: https://www.ptt.cc/bbs/movie/M.1756894199.A.65B.html
title: '[新聞] 全球知名驚悚遊戲改編！《8號出口》首周'
content: '全球知名驚悚遊戲改編！《8號出口》首周票房近2億台幣


  20:43 2025/09/02


  中時  杜欣穎




  《8號出口》二宮和也飾演主角「迷路的男人」。（壹壹喜喜電影提供）


  改編自全球熱賣超過180萬套的同名恐怖驚悚遊戲，電影《8號出口》由偶像天團「嵐」成

  員二宮和也與「空靈女神」小松菜奈攜手主演。


  該片於8月29日在日本正式上映，首三日票房即累積9.5億日圓（近新台幣2億），不僅拿

  下當周新片票房冠軍，更僅次於《鬼滅之刃》，同時榮登2025年日本真人電影開片票房冠

  軍！


  台灣正式宣布將於9月19日全台上映。


  《8號出口》自8月底在日本上映以來票房亮眼，口碑持續延燒。


  觀眾紛紛在網路上留言盛讚，電影不僅保留了遊戲的原始風格，更賦予全新張力。


  有觀眾直言：「幾乎沒有那種日式電影特有的陳腔濫調，而為了讓作品更具電影感所添加

  的元素，也完全沒有破壞遊戲原本的風味。作為一款遊戲改編電影來說，這是理想的掌握

  與安排。」


  也有人表示是因為熱愛原作而進戲院：「因為喜歡原作那種詭譎又奇妙的世界觀而去看了

  電影。原本想著把『找錯遊戲』加上故事會變成什麼樣子呢？沒想到劇情竟然完成得非常

  非常好。結果居然還讓我哭了。」


  更有觀眾驚嘆這部作品的沉浸感：「完全沉浸其中，那款遊戲能有這樣的故事性真的太厲

  害了！」


  同時對主演的演技給予高度評價：「二宮先生的演技毫無疑問賦予了角色更多的說服力、

  真實感與深度，真的非常厲害。」




  《8號出口》演員河內大和神還原遊戲超詭異微笑大叔。（壹壹喜喜電影提供）


  《8號出口》是由川村元氣執導並編劇的作品，川村元氣是日本近年非常活躍的電影創作

  者，身兼導演、編劇、製作人、作家等多重身分，之前還受邀來台參與金馬大師課程。更

  多次擔任知名導演是枝裕和、新海誠的監製或製作人。


  參與作品包含：《告白》、《惡人》、《你的名字》和《怪物》等多部知名電影。


  川村元氣的導演處女作《百花》也成為首位榮獲第70屆聖塞巴斯蒂安國際電影節最佳導演

  獎的日本導演。


  最新作品《8號出口》還入選今年多個重大展影，包含坎城、多倫多和釜山影展，可說是

  備受矚目的話題之作。




  新聞網址：




  --

  好久喔'
