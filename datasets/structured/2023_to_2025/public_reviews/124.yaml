content: "先說這部電影\n吧有玩原作建議再補一次\n有補充一些原作設定很讚\n至於是那邊我就不劇透\n給這部電影8/10\n\n音樂好聽 \n演員都演得很好\n\
  男主崩潰演得很好\n女生沒什麼戲份\n很想看幕後花絮無限出口怎麼搭景\n\n我是不會日文全程\n大概知道在演什麼\n裡面的無限概念很酷酷到想看花絮怎麼拍\n異常只有一個比較恐怖建議\n\
  \n好看到買設定集\n\n人生第一部在日本看的電影就先給他了\n真的爆幹好看\n\n遊戲改電影我覺得能排\n第二名\n第一名馬力歐再來它其他惡靈古堡麥塊去隊尾\n\
  -----\nSent from  on my iPhone\n\n--\n08/29 15:02\n我是覺得這部在電影院看比較好\n上串流搞不好一直想劃手機\n\
  三樓BAD看了可以不用說哪裡看好嗎′д` ;\n比女主多喔\n而且蠻重要的\n快算第二男主的戲份了\n我在日本看得上傳失敗"
