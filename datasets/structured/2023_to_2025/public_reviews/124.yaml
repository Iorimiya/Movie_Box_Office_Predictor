url: https://www.ptt.cc/bbs/movie/M.1758611987.A.474.html
title: '[好雷]8號出口 跟預期不太一樣的口味'
content: '先講點遊戲的心得來防雷

  一開始看了一些實況精華，大概知道有哪些驚嚇點。後來趁特價買來自己玩還是被婊得嫑

  嫑的XD

  也因為我看實況都是熱鬧歡樂的氣氛，我也預期看到電影是演個像喜劇的氛圍，但居然在

  講嚴肅議題。


  先討論拍攝技巧的部分，一開始用第一人稱視角，主角看著倒映在玻璃上的自己。讓我從

  還在琢磨配樂是不是第八號交響曲的狀況回神過來！轉而好奇到底是怎麼拍，讓玻璃倒映

  上沒有攝影機的？

  當然要後製的話方法很多，再簡單一點也說不定是把攝影機隱藏在主角身上。總之諸如此

  類的拍攝技巧蠻多的。

  後來在遊戲開始（？）的過程中大量使用一鏡到底，主角走了3次才發現不對勁。我則是

  開始好奇攝影棚到底是怎麼搭的？到底是真的搭了好幾個重複的地道，還是用上了剪接手

  法的假一鏡到底？

  隨著劇情推進，各種異常發生，主角要在地道中進進退退，我也忘了要數到底可能搭起的

  地道場景到底有幾個。


  接著說說劇情的部分，主角懦弱的表現看得是挺躁的，而且身體又有毛病，都開始想像起

  他的屍體爛在無限迴圈中的情境了。

  手機拍照這招蠻聰明的，可惜被無情防治XD還有一般來說會想到要拍通風口嗎？我覺得我

  在遊戲中被婊到才會知道有這個可能，沒經歷遊戲的人要這麼細心不容易。

  電影還多了遊戲沒有的異常給主角玩，女朋友打電話來這招超靠北的，誰會把這種看起來

  就是過劇情的事件當異常啦！

  主角被這招搞到崩潰也是挺合理的，但是當下我還沒從遊戲腦轉過來，只覺得主角在新一

  關的送分題鬧這麼久很拖很煩。


  後來懸疑升級，遊戲中孤單一人的無限迴圈，在電影版成了多玩家模式，還加了這迴圈莫

  非是死後世界的設定。不過那時我只覺得大叔超爽的！要是玩家的8號出口迎面走來的是J

  K還不一堆人黏上去非常用力的舔啊舔，舔啊舔的！只是電影的JK臉太熟了，滿溢著成年

  人穿學生服裝可愛的尷尬感XD

  後來大叔被兩個異常combo帶走，也不能怪他，我玩遊戲也被那招婊到，可能他們遊戲自

  己也有統計哪些混蛋異常最多人被婊XD

  兒子跟主角相遇後有一段我上廁所沒看到，後來朋友說是主角以為有異常，但兒子有正確

  辨認。只能說兒子真的很罩XD

  後來原版的血海被鬼轉成海嘯，我才發現到莫非是在特意迴避閃靈（鬼店）的版權？而且

  配合起先前主角身上的社會議題，這波海嘯讓電影的說教味又瀰漫了出來。就是雖然他沒

  明講，但就是把這些事甩到你面前要你關心他。就…不是我來看這部片時會想看到的東西

  。

  而且後期的異常跟主角一開始在車上滑手機的內容呼應，話說那個房子被沖到河流裡那幕

  我有印象是幾年前台灣風災的情況，但是出電影院卻查不到，想請求有沒有還記得的人補

  充一下XD


  總之最後主角離開了8號出口，也告別了懦弱的自己。但朋友跟我說他覺得可能主角又陷

  入了新作《8號車廂》，真的是太苦了XD


  --

  這角度刁鑽啊！我還真沒想過這一層！

  喔喔對！太感謝了！我也記得是飯店還民宿什麼的！結果現在又來一個堰塞湖大暴洪，真

  的是學不到教訓= =

  讚喔，感謝分享。話說他用第一人稱拍到我頭開始暈時就拍回到主角臉上了，感覺也是特

  別設計過的。'
