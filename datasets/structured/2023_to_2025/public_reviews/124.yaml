title: '[請益] 8號出口會很可怕嗎?'
content: '如題

  平常很少看驚悚片，也不喜歡看 :<

  只有幾部因為被推薦說劇情不錯而鼓起勇氣看的

  ex 屍憶、咒(這在Netflix看的，可能沒有在戲院看大銀幕恐怖 )、雙瞳

  這三部我還承受得起。


  最近對日本電影" 8號出口 "有興趣

  但好像是驚悚遊戲改編的。

  想請教這部片會很恐怖嗎?

  是屬於壓迫感重，但沒什麼血腥/噁心畫面的類型嗎?

  還是有很多讓人不舒服的畫面or容易和現實連結，看完容易一直回想的?


  我最怕的是血腥 、 jump scare還有鬼化裝(臉很恐怖那種)

  請問這三個元素本片是否有 & 有的話比例高嗎?


  請看過的人解惑，猶豫要不要看ing

  謝謝!!




  --


  謝謝各位的回答。

  因為看到這片即將要上二輪了，正在猶豫要不要去看所以來問。

  看來應該是沒有問題，所以決定去看了。


  另外，有些推文說我偷渡的，

  老實說在你們提起之前，我真的完全沒想到會讓人聯想到近期的社會事件。

  如果讓人想到案件而因此心情不好的話，我很抱歉，

  我的本意真的只有詢問這片的恐怖程度而已。( 而且偷渡這件事到電影版能幹嘛?? )'
