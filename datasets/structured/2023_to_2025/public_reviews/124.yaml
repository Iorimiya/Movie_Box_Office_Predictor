title: '[微好雷] 8號出口'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


















  你是不是活成了行屍走肉?

  看完這部片的感悟是這樣


  有點Groundhog Day的感覺


  你會選擇導航模式來渡過這一天

  還是要有意識地作為一個人 面對真實的自己?


  不過這部片感覺沒那麼多毛

  我也沒玩過遊戲


  其實走過幾次

  應該就能很快上手了


  但是你願不願意逃離你的舒適圈呢?

  這應該就是這部戲的重點







  裡面的大叔應該就是放棄了人生

  因此成為了NPC的一部分


  整部戲一小時半

  其實步調可以更快一些


  有點像是在看一個人在玩密室遊戲

  然後嘗試闖關的直播


  感覺不是每個人都會喜歡的片

  沉悶感重一點


  小孩跟男主角的關係到底如何

  會不會這一切都是夢呢 不知道


  就降





  --





