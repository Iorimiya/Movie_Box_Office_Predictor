url: https://www.ptt.cc/bbs/movie/M.1756619078.A.4DF.html
title: '[普雷] 8號出口'
content: '雷文防雷資訊頁

  預告




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  當初看到預告是會好奇這部作品到底要怎麼拍成電影


  如今看了成品,我先說評價 滿分10分的話我會給7分

  加分要素:

  他們有努力把這變成一個故事了

  最後結局還算不錯


  扣分要素:

  我討厭嬰兒的哭聲

  我討厭爆氣的社畜被描寫成壞人(他只是講出了一些人心中話 幹的好! 多說一點!)

  微妙的說教要素(大家都只顧著看手機都不去幫忙發聲)


  這片我看的時候的心情起伏

  前期"極度煩躁 主角一開始那個要死要死的氣喘感看了非常煩躁"

  中期"新鮮感 沒想到主角居然暫時換成那個大叔"

  後期"親情戲 老梗 其實還算不錯"


  作為一部粉絲向的作品的話其實算是及格的

  一些粉絲服務,例如原作遊戲有的錯誤有演幾個很明顯的出來

  主角跟大叔中間的行為根本就是玩家在做的事情

  只是多了幾個電影原創的異變,幾乎都是跟嬰兒有關的

  而且是聽了會煩躁的嬰兒哭聲那種

  如果我是在家裡用電視看我會很想快轉的程度


  最後評論:

  如果有玩過這遊戲,或是對預告很感興趣的

  其實可以考慮去看 他的場景還原程度大概是90分等級

  (不知道為啥他在拐角追加遊戲沒有的照相機跟櫃子)

  只是如果單純想嘗鮮 周末想找一部電影消遣

  這部不適合你花兩千日圓(或是四百多塊台幣)去看的電影

  真的要看的話可以等像是電影台或是網飛之類的放上去再看


  --

  主角一開始在電車上遇到哭泣嬰兒事件 但是裝作沒看到

  出站途中聽到女朋友打電話來說她懷孕了 不知道該怎麼辦

  男主角看起來很驚慌 呼吸困難

  走出車站剪票口走一走就突然跑進去了8號出口一直輪迴

  電影原創跟嬰兒有關的異變感覺就跟主角的"心病"有關

  只是到最後還是沒有解釋

  大叔其實很可憐 最後就他沒有救贖

  因為他從假出口的異變走了出去就再也沒回來了

  之後出現的大叔只是個NPC

  因為實際的遊戲真的就是這樣

  開頭完全沒有說明 就是把你丟進去那個八號出口的空間

  所以能把這個變成一個故事其實真的是挺大的噱頭

  知道這遊戲的應該也會好奇會怎麼拍'
