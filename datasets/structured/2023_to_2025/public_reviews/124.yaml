content: "／\n　本編初出しカット満載！\n　最新予告映像、解禁！\n＼\n\n    8月29日(金)公開\n#二宮和也 主演\n映画『#８番出口』\n\
  \n異変を見逃さないこと。\n異変を見つけたら、すぐに引き返すこと。\n異変が見つからなかったら、引き返さないこと。\n８番出口から、外に出ること。\n\nそれは無限にループに迷い込む、\n\
