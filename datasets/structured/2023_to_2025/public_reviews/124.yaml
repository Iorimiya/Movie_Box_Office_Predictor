url: https://www.ptt.cc/bbs/movie/M.1758814878.A.F13.html
title: '[好微雷] 【8號出口】'
content: '我是因為看完才購買遊戲的XD…

  在看過電影以前沒特別查詢爬文，所以是以沒被劇透身份踏進電影院觀看～

  之前對國片【6號出口】還比較有印象（笑）…


  看完後也將手機鈴聲換成《Ravel: Bol廨o, M. 81》，哈哈！


  A了目前板上的相關文章，有些人提到像【1408】，我也覺得某些概念相似～

  但展現出不同韻味，都好看！

  多少也是因為二宮和也，第一次看【殺戮都市真人電影版】知道他。


  不錯且討論度高的電影多多少少也想在貴板不專業精闢發文留念一下～


  以下有雷與個人看法、心得：


  敘事方式有點像近期的【凶器】，我原本以為二宮和也在趴地大叫後就沒戲份了…

  結果遇到小男孩再一段後才接大叔～


  確實從大叔換到JK會有些大膽的想法>///<…





  置物櫃那幕有嚇一跳！

  然後假出口那段外頭還傳來鳥叫聲很哭XD…

  有板友鄉民提到細節（大叔的台詞）但電影中沒特別解釋～


  男主開門看到搭地鐵的自己跟【1408】向對面大樓求助那段異曲同工之妙～


  我並不會覺得結局一直在輪迴，首先男主已經沒有背包了，且最後切畫面以前他的眼神從

  傷心、沮喪、無奈轉變為堅定，準備行動！

  不管後續結果如何至少他願意作出改變，而不再選擇無視…


  丟掉背包遇見男孩開始他不再需要使用擴張劑也很有意思～

  在被洪水沖走後我有在想是不是也變成NPC才接續後段？還是那空間的平行世界或多重宇

  宙？


  當然這種開放式討論沒人說得準～

  男孩的來歷算是好猜，或許跟之前看過【異星入境】、【超時空攔截】，以及喜歡腦洞大

  開科幻片相關，很有意思！


  也有人提到電影宣傳在西門町設置意象拍照打卡點，在那之前某次去臺北出捷運站很幸運

  看到了今際之國宣傳（個人喜愛更勝魷魚）～





  也撈了點6號出口除了街頭藝人以外幾張蠻喜歡的舊照片分享～









  最後男主到底從玩家變成了NPC？

  還是正視面對找到出路回到現實世界？

  實在是耐人尋味～


  好看！推薦給還沒看過的您～

  接著準備【一戰再戰】，年底前升級威秀會員。






  --


  此篇紀錄前幾天下載遊戲且全異象解鎖：


  天花板


  1.鬼臉



  2.燈光閃爍



  3.燈光熄滅




  4.指示牌上下顛倒




  5.指示牌背面提醒



  6.電燈歪斜



  7.監視器



  地面


  8.紅水



  9.人臉



  10.0號假出口



  11.導盲磚



  牆面


  12.敲敲門



  13.消失一扇門



  14.喇叭鎖



  15.禁止吸菸



  16.門縫有人



  17.海報移動



  18.驚悚海報



  19.塗鴉海報



  20.海報偷瞄



  21.海報漸大



  22.門打開了



  23.牆面人




  24.同張海報



  25.黑色液體



  大叔、雙子


  26.加速跟追



  27.詭異笑容




  28.破圖




  29.巨人



  30.眼神交會



  31.瞬移雙男



  如果最後一個遊戲成就有人知道煩請Mo PTT私訊或站內信分享～感謝看完此片的您;)。




  為自己鼓掌～也為人生加油！




  謝謝j大！

  想說應該不會出現留言所以自己補充而已～

  最後一個遊戲成就也拿到了！









  近期iOS從15.0升到26.2以後～

  偶爾開一下手遊發現居然因應電影又多了些異象！

  特別來新增與回覆自己這篇文章～


