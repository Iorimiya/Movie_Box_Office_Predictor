url: https://www.ptt.cc/bbs/movie/M.1758595978.A.7A6.html
title: '[ 好雷] 8號出口'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  我沒有玩過遊戲，但知道這個遊戲

  還有對很久以前釋出的8號出口預告很有印象

  一個第一視角走在地下道，

  結果繞了一圈重複遇到大叔的景象覺得也太有趣

  然後知道是二宮和也擔任主角就更有興趣了

  一直期待這部片的上映

  所以要我說跟遊戲的差異我說不出來

  但整部觀影體驗對我來說是很棒的

  沒有拖泥帶水，有驚嚇的、有催淚的、有說教的，但都給的剛剛好，不會過於冗長或消失

  不見

  就是日本電影該有的節奏

  而且有自己也深陷在其中的感覺

  想要找出變異、想要趕快幫主角找到出口離開

  只是我有個疑問


  為何那個小男孩可以在兩個男子的世界觀影響著，是有什麼設定嗎？


  另外當天是在桃園新光影城看的，排隊拿特典的時候

  有一對女子在討論要看什麼，就順口問了我現在年輕人都看什麼？

  「我不知道耶」「可是你不是在排隊嗎？」

  「我是要看8號出口啦....」然後我就繼續往前排隊


  就聽到他們的對話

  「還是我們就看這個？」

  然後也跟著隊伍排隊買了8號出口的票

  希望有符合你們的口味XD


  我是覺得很好看啦！

  至少我前面幾個也都是排隊拿特典

  應該不是亂推薦



  --'
