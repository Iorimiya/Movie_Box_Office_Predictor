  硬掰展開到這種程度


  導演選擇了一條相對艱難的路

  謹慎且細心的拆解重組

  往主流劇情片的方向靠攏

  卻又感受到他對這遊戲本身滿滿的愛

  把受眾範圍一下子擴展來了


  某方面來說真是神乎其技啊




