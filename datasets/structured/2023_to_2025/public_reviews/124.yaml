url: https://www.ptt.cc/bbs/movie/M.1735255386.A.6E6.html
title: '[新聞] 8號出口 真人電影化'
content: '2023年，獨立遊戲開發者KOTAKE CREATE先生獨自製作的“異常”尋找無限循環遊戲《8號

  出口》在全球累計下載量突破140萬，迅速成為社會現象。該遊戲宣佈將改編為真人電影

  ，預計於明年（2025年）上映（發行：東寶）。同時，面向全球的電影化發佈影像也已公

  開。


  在螢光燈照射下，行走在無機質的白色地下通道中。然而，無論走多久，都無法到達“出

  口”。多次與身穿西裝的男子擦肩而過，感到違和，漸漸意識到自己在同一個地下通道中

  反復行走。隨後，發現了牆上張貼的不可思議的［指引］。


  - “不要忽視任何異常（Do not overlook any anomalies.）”

  - “發現異常時，立即折返（If you find an anomaly, turn back immediately.）”

  - “未發現異常時，不要折返（If you do not find any anomalies, do not turn back

  .）”

  - “從8號出口出去（Go out from Exit 8.）”


  如果通道中存在“異常”，則向相反方向折返；如果沒有異常，則繼續前進。“1號出口

  ”“2號出口”“3號出口”……。如果判斷正確，將接近“8號出口”；若有一處疏漏，

  則會回到“0號出口”（起點）。究竟能否從突然迷失的無限迴廊中逃脫呢？


  以日本常見的地鐵車站為舞台，玩家被困在無限循環的地下通道中，一邊恐懼於各種“異

  常”，一邊以“8號出口”為目標。這種簡單卻獨特而詭異的世界觀引發熱議，作為個人

  製作的短篇遊戲，取得了異常的成功。無論國內外，都有狂熱的粉絲存在，其人氣至今仍

  在加速。


  這款“異常”尋找無限循環遊戲將被改編為真人電影。遊戲開發者KOTAKE CREATE先生表

  示：“我曾想過，如何將沒有故事情節的遊戲拍成電影，但在不破壞《8號出口》世界觀

  和氛圍的前提下，電影變得非常有趣！我還參觀了拍攝現場，看到那個地下通道和那位大

  叔真實地存在眼前，真的非常震撼！希望大家能期待！”


  在公開的影像中，出現了一個似乎隨處可見的地下通道。左側牆上貼有6張海報和“監控

  攝像頭運行中”的標誌。右側牆上有禁煙標誌、3扇門和室內消火栓。通道天花板上，“

  ↑出口8”的標誌發出黃色光芒。緩慢前行的過程中，與一名身穿西裝的男子擦肩而過。

  轉過拐角，眼前又延伸出相同的地下通道，剛剛經過的西裝男子再次朝這邊走來。然後—

  —。這是一段不可思議的無盡循環影像。


  --'
