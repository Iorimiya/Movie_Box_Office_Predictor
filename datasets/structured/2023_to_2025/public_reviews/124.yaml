title: '[好無雷] 8號出口 '
content: '這次有送特典



  但是....這是威秀故意的是吧


  這不是異常  是吧





  我可以安心走進去吧




  先無雷心得


  對於有玩遊戲 很熟悉的人  真的就是真人走到八號出口遊戲會做的事

  若你問這電影有沒有說教  我只能說  有  但是不是腳色用嘴講出接責罵

  而是導演用鏡頭  用敘事  讓你反思 "你會怎麼做選擇"

  導演好好講了2段故事  而且有留白沒有解釋  留給你自己想像

  看過8號出口遊戲的  值得去看



  但  這電影不適合2種人去看

  一種是一直重複事情會感到不耐煩 無聊的人   因為電影就真的

  0~8號沒有跳過一個一個一直重複  不適合看窘長日劇的


  另一種會捏  放防雷第一行

  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~












  會怕無毛老鼠  且身上會長奇怪器官因此惡夢的  不要去看


  --






  --'
