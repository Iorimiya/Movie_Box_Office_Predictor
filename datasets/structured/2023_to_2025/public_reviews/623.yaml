url: https://www.ptt.cc/bbs/movie/M.1630023476.A.2D2.html
title: '[新聞] 《獅子王》擬真版前傳刀疤、木法沙換人配'
content: '迪士尼《獅子王》擬真版前傳全新選角公開！刀疤、木法沙換人配音




  2019年瘋狂大賣的擬真版《獅子王》（The Lion King）在全球橫掃超過，票房

  豐收的迪士尼自然也樂得投入繼續開發衍生作品。但有別於其它推出續集的真人化電影，

  《獅子王》擬真版並不朝續集的方向前進，反倒是轉為發展前傳電影，回朔「刀疤」與「

  木法沙」年輕時期的起源故事。而既然是一部前傳，刀疤與木法沙勢必也將尋找更年輕的

  聲線來搭配。




  《Deadline》今報導， 小凱文哈里森（Kelvin Harrison Jr.，上圖右）、亞倫皮埃爾（

  Aaron Pierre，上圖左）分別將取代奇維托艾吉佛（Chiwetel Ejiofor）、詹姆斯厄爾瓊

  斯（James Earl Jones）擔綱配音刀疤和木法沙。這部前傳改由《月光下的藍色男孩》（

  Moonlight）導演貝瑞詹金斯（Barry Jenkins）接替執導，而皮埃爾此前便和詹金斯合作

  了今年剛上線不久的亞馬遜影集《地下鐵道》（The Underground Railroad）。



  《獅子王》擬真版前傳依舊由前集編劇傑夫奈松森（Jeff Nathanson）執筆劇本，同時






  --'
