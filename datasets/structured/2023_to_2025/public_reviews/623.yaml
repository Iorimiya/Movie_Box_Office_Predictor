url: https://www.ptt.cc/bbs/movie/M.1734944777.A.2E2.html
title: '[好雷] 獅子王 木法沙 4DX'
content: '以下有雷








  因為看到預告有很多自然景觀跟動作的部分，就很好奇他的4DX會怎麼呈現

  果不其然上足了保濕噴霧，因為瀑布很多

  前面大洪水跟最後決鬥的時候，比雲霄飛車還好玩

  近期看了魔法壞女巫跟死侍的4DX版，三個比起來覺得木法沙的最好玩，是滿推薦的版本


  電影剛開始就寫上懷念James Earl Jones一度眼框泛淚

  劇情的部分算滿新鮮的，尤其還記得第一集劇情人應該會有很多點會讓哦～原來的反應

  但看著本來木法沙跟塔卡兩人是感情那麼好的拜把兄弟到後面反目成仇，真的不勝唏噓.

  ..

  畢竟前面塔卡還救了木法沙五次欸，我真的討厭不了這個角色QQ

  第一次是幫他逃離鱷魚，第二次是賽跑故意輸他

  第三次是抱著他跳下懸崖，第四次是為他挨了一爪變成刀疤

  第五次是再次把他從水裡救上岸...我真的覺得木法沙欠他太多太多了


  比擬成古代皇帝的話，皇太子一定會是最被培養成要繼承皇位的人

  沒想到一個甚至不是皇室的人，變成王還搶走他的心上人，我看要不黑化也難XD

  況且不論是他爸爸教他欺瞞是王位最好的手段

  還是木法沙不斷地把一些他根本沒做過的事說是他做的

  都一再的讓他的內心變得越來越扭曲 才做出傷害人的事情

  他原本也是心地善良，只是膽小了一點的孩子啊...


  總之感謝出這集，我覺得更算是塔卡的起源故事哈哈

  我同情他，但也不得不說他最後是罪有應得啊

  最後分享加購的娃娃，現在還有，超可愛的



  --'
