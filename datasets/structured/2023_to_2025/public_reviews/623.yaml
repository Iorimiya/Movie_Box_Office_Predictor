content: '《》新面貌




  預告片明天發布。


  資料來源：X




  《》的首支預告片將於明天發布。




  隨著明天的預告片，迪士尼最終應該會宣布一些有關《》的消息，例如從

  第一部電影中回歸的演員陣容中的新聲音…




  目前，我們已確認小凱文哈里森和亞倫 皮埃爾為塔卡/刀疤和木法沙配音。


  《》（英語：Mufasa: The Lion King）是一部2024年美國歌舞劇情片，

  改編自迪士尼1994年動畫電影《》，也是2019年電影《》的前傳兼續集，由

  貝瑞 傑金斯執導，傑夫 內桑森編劇，亞倫 皮埃爾、小凱文哈里森、塞斯 羅根、比利

  埃西納和約翰 卡尼爾主演。


  資料來源：維基


