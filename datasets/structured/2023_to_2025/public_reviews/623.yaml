url: https://www.ptt.cc/bbs/movie/M.1563544801.A.602.html
title: '[好雷] 獅子王 從辛巴到木法沙'
content: '以前看獅子王


  都會把自己帶入到辛巴上


  和辛巴一起幻想長大後的模樣


  都天真的以為成為大人後就可以毫無顧慮 做想做的事


  二十五年過去了


  「長大」就像是獅子王中描繪的一樣


  在你沒有任何防備下


  回頭一望 才發現自己在不知不覺中已經變成了小時候憧憬的模樣


  心理卻無法調適過來 總以為自己還沒成熟 還沒有準備好面對長大後的世界


  這時候才知道長大不僅僅只是將你的個人狀態上的小孩擦掉


  改寫成大人這麼簡單


  伴隨而來的是沉重的家庭負擔、經濟重擔、工作上的壓力


  再也不是那個可以無憂無慮享受父母庇佑的小獅子了




  雖然已經成為了小時候想要成為的模樣


  但是偶爾聽到舊時光的音樂、看到小時候熟悉長大後卻又變得陌生的人事物


  都會將自己從忙碌的生活中抽離


  想念著往日時光


  一邊低估著：「真想再當一次小孩子啊」


  一邊扛著成長後應擔起的責任繼續過日子


  我想circle of life只有在真正經歷過 才更能明白箇中滋味吧


  --'
