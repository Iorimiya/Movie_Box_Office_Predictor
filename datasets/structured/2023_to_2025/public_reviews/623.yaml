  \ 沙拉碧：我以為嫁給無父無母的孤兒，結果\n   竟然要跟老公的寡母一起住在留奶與蜜之婆家\n- 沙拉碧話術草食動物幫忙戰鬥，我就問白獅會\n   吃肉，難道黃獅就吃素嗎？\n\
