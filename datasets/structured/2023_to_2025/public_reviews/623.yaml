url: https://www.ptt.cc/bbs/movie/M.1734949036.A.3E3.html
title: '[負雷] 木法沙'
content: "雷文防雷資訊頁\n\n下文會提到劇情的雷，先無雷跟大家說明不推的原因。\n1、音樂真的太沒有記憶點，跟第一集差太多。\n2、有那種硬塞、沒必要存在的角色，而且干擾性極強。\n\
  3、兩集間角色的轉折接不太起來。\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\n\n\
  \n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n先說總結心得，當時帶著相當期待的心情踏進電影院，\n\
  希望可以看到木法沙和刀疤之間究竟有何過去，但是看完後真的覺得很失望，\n劇情相當鬆散，故事流程也幾乎是如出一徹，音樂更是大敗筆，刀疤的轉折非常奇怪，\n總之以前傳來說很沒有可看性，要照著這故事線繼續下去也不會讓我想再進場了，\n\
  中間一段我甚至看到睡著了，分述如下：\n\n1、音樂落差：\n   獅子王的音樂真的出色，光片頭的生生不息那段音樂就足以成為經典，後面所有歌曲\n   都令人耳熟能詳，如宮崎駿音樂般的存在，但這集的音樂我毫不誇張的說：\n\
  \   「一點記憶點都沒有」，我試著回想半小時前的音樂到底是什麼，真的完全沒印象。\n\n   但是在影片中某些橋段，BGM一出來，就會讓人想起：「啊！這是第一集的音樂」\n\
  \   就可見這部影片把音樂性處理得多糟，落差不是一個檔次而已。\n\n2、劇情鬆散：\n   這是一部前傳電影，但不知為何要用現代場景插敘過去故事的手法來表現，\n\
  \   讓人有灌籃高手電影版的既視感，但他處理得實在太糟糕了，\n   片頭交代獅子王辛巴出場，交代那隻小幼獅出場，\n   故意埋一個超爛的伏筆，媽媽在另一個神秘場景（但光看運鏡就知道她在待產）。\n\
  \n   辛巴退場，澎澎、丁滿、幼獅和山魈這四隻動物講故事，然後一直穿插，\n   一直講一些沒意義又不好笑的笑話，故事堆疊起來的情感就被這四個角色一直打斷，\n\
  \   原以為故事會和這四個角色於結尾時交接起來，如灌籃高手那樣，結果完全沒有，\n   就真的是硬要串場蹭情懷，但蹭得讓人好厭惡，硬要唱一小段Hakula Matata，\n\
  \   唱Hakula Mufasa，尬的要死，這四個角色抖包袱抖的賣力無比、大粒汗小粒汗，\n   但影片整場無笑聲，迪士尼的編劇只剩這點能耐。\n\n  \
  \ 至於電影最重要的劇情，真的是了無新意，\n\n   獅子王故事線：\n   刀疤窩裡反-->辛巴放逐-->遇到澎澎、丁滿、母獅-->母獅愛上辛巴\n   -->找回自信回來光復故土-->刀疤窩裡反失敗死亡\n\
  \n   木法沙故事線：\n   遇到天災-->木法沙放逐-->遇到山魈、鳥、母獅-->母獅愛上木法沙\n   -->找回自信回來征服領土-->刀疤窩裡反失敗放逐\n\
  \n   總之就是你的腦袋自己會破了片頭伏筆、破了母獅的情感走向、\n   破了木法沙會贏得信任、破了刀疤會窩裡反失敗......等，剩下的就是等散場了，\n\
  \   讓你整場坐如針氈想著到底什麼時候會有個自己想不到的意外，但是完全沒有。\n\n   大結局就是揭曉母獅子到底哪去了，原來是去生小孩了！小幼獅有兄弟了！\n\
  \   但不好意思我片頭就知道母獅子片尾會多生一隻出來，這伏筆真的非常失敗。\n\n   我睡著的那一段在刀疤和木法沙逃出去，遇到母獅結伴，然後我就睡著了，\n\
  \   醒來山魈就跟著了，所以如果有人可以協助補完山魈那段劇情我會很感謝。\n\n3、刀疤轉折很怪：\n   原本就很期待想看到刀疤的黑化過程，就像想看到天行者是要怎麼黑化成黑武士，\n\
  \   結果令人有些失望，影片把前傳的刀疤設定的太單純、善良，\n   讓他黑化的過程顯得很怪，黑的關鍵是為了一頭母獅，就算疊加其他因素也顯牽強，\n   然後片尾又讓他保有良心救了木法沙一命，片尾還良心發現自請處分，\n\
  \   但問題是在本傳中刀疤已經黑化到一個徹頭徹尾的邪惡角色，\n   是想方設法殺木法沙且絕不手軟，整個轉折亂七八糟，\n\n   刀疤黑化歷程以線性來說就是：\n\
  \n         前傳：白的徹底的木法沙好兄弟--> 被搶馬子開始黑化-->\n         白化一些幫木法沙挨一掌--> 又自請處分白了一些回來-->\n\
  \         本傳：徹底黑到沒救\n\n   很亂誒，而且刀疤多次拯救木法沙（以我算法至少五次），劇情這樣搞變成：\n   「你不太會討厭刀疤，但你也喜歡不上木法沙。」\n\
  \n   以主角和配角來說，處理成這樣真的是很差勁。\n\n至於有沒有優點，還是有，但是都完全掩蓋不掉缺點，我可以想到的優點有：\n\n1、畫面逼真：\n  \
  \ 現在的電腦和AI技術已經做到要什麼有什麼，這部片足以證明此點。\n2、家庭教育：\n   這部片有帶到刀疤會有不好的念頭在於「說謊是國王會用的手段」和\n\
  \   「國王的權力就是睡午覺，打獵是母獅子的事情。」可以讓你稍微跟小孩說嘴一下。\n\n沒有了，總之這部片我很不推，就略過吧，不值得一看。\n\n--"
