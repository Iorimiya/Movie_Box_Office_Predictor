url: https://www.ptt.cc/bbs/movie/M.1734658766.A.112.html
title: '[好雷] 獅子王：木法沙 原來刀疤是這樣黑化的'
content: '防雷線






  今天陪我一個獅子王狂粉朋友去看完木法沙

  原本抱著不期不待的心情（？

  看完反倒覺得還不賴，故事敘述還蠻完整的

  從木法沙與塔卡小時候的故事開始

  中間幾次慢慢堆疊的疙瘩還有心結也都有呈現

  看的時候我真的一直在想，如果我是塔卡我肯定搞爆木法沙好嗎！

  一開始就不對勁了欸？媽媽怎麼會對一個外來的小獅子這麼好

  甚至還覺得他可以跟我競爭王位

  塔卡也真的是好人，把木法沙當自己的兄弟

  沒料到最後兄弟還跟自己喜歡的沙拉碧深情對唱

  這個實在不忍了啦，果然終究還是為了女人跟王位



  喜歡獅子王的人可以去看看，整個故事線更完整的被串起

  也會理解刀疤黑化的原因，原來都是有理由的

  不想暴雷但好幾幕呼應了原版獅子王，有起雞皮疙瘩

  看完會很想回去重溫第一集


  --'
