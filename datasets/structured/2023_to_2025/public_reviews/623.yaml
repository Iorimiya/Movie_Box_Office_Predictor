title: 'Re: [討論] 獅子王：木法沙 預告統整'
content: '獅子王2019的成功是因為

  獅子王1994的大成功

  劇情、音樂、甚至分鏡都沒改

  劇情直接立在哈姆雷特經典改編(有沒有抄襲森林大帝先不談)

  配樂，Hans Zimmer就是神

  音樂，Elton John創作的Circle Of Life、Can You Feel the Love Tonight各位就算不會

  唱也一定有聽過




  相比起來面癱真的是小問題



  但是這次木法沙

  前傳劇情、沒有Hans Zimmer

  我是真的很擔心，迪士尼究竟是要把這IP搾乾還是要再創經典，又或者為了之前CG模型回收

  再利用



  尤其音樂我覺得很難再超越了





  --'
