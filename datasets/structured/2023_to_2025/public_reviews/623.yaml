  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


































  整部片非常平淡，沒有笑點

  開場預告的罌粟小子比較吸引人


  音樂大概只記得你有和你媽說你要玩這麼晚嗎

  但我也完全不記得旋律


  然後邏輯死亡了


  木法沙他爸媽不知道水那邊會危險嗎?

  雖然說老梗是警告過，但小孩不聽話

  這部是爸媽直接讓小孩去玩，然後忽然和小孩說夠了

  三小?

  別說小孩不理解，我這大人知道會怎樣也覺得超錯愕



  然後塔卡被橫刀奪愛很生氣，很合理

  忽然醒悟其實木法沙幫他很多，即時悔悟，也很合理



  但木法沙那個我原諒你，但我要一直喊你的恥辱名來羞辱你

  這到底三小


  要就完全既往不咎

  要就直接恩斷義絕


  這樣持續羞辱，難怪刀疤最後會殺你


  莫名其妙














