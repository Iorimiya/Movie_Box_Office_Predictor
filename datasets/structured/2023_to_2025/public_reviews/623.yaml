title: '[討論] 獅子王：木法沙 塔卡才應該當王吧'
content: '---------------------防雷線---------------------





  看完覺得真的不能怪塔卡會對木法沙恨之入骨欸，站在塔卡的角度，我的兄弟是我救的，

  甚至為了他向父親求情故意輸了比賽，成長的過程中也一直是被當成皇室繼承人的身份長

  大，而木法沙則是作為輔佐他的角色


  結果他的家和他的王國在一系之間被白獅奪走，和自己最信任的兄弟在逃亡中遇到喜歡的

  母獅，說要助攻他的兄弟最後卻和自己喜歡的人搞在一起，雖然跑去跟敵人合作是有點衝

  動，但真的情有可原欸


  木法沙的一切行為根本超級綠茶，明明自己也喜歡沙拉碧為何不一開始就講，來個公平競

  爭不好嗎？

  後面才在那邊假裝情不自禁、充滿愧疚感，最後還在那邊說有他在就不會趕他的兄弟走也

  超婊，讓他看著你當王，甚至和他喜歡的女人相親相愛是什麼很值得感動的事嗎？


  反正我私心就是想讓塔卡當王，先不說他本身就皇室繼承人，木法沙自己也答應過塔卡的

  父母要輔佐保護塔卡的，而且塔卡還救了他兩次，結果家破人亡就算了，最信任的兄弟還

  為了一個女的背叛他，塔卡根本超可憐QQ 害我無法直視第一集裡的木法沙了，好氣！


  --'
