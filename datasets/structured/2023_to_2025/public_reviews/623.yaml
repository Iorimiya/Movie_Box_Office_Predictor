url: https://www.ptt.cc/bbs/movie/M.1734155908.A.B38.html
title: '[討論] 獅子王：木法沙 預告統整'
content: '身為獅子王粉絲，真的超期待獅子王木法沙上映

  最近國外迪士尼釋出了一些影片

  統整一下目前的資訊，有少的也歡迎大家一起補充XD


  前導預告


  很磅礡的開場


  正式預告


  揭露滿多劇情，原來刀疤本來才是有皇室血脈的

  撿了一個孤兒回來結果他變成王...

  難怪在動畫版裡面他會不爽


  最終預告


  看起來會用講故事的方式把前傳的劇情娓娓道來

  彭彭丁滿雖然不是主角 但看起來戲份也不會少

  擔任串場的角色


  片段搶先看 - 兄弟


  好喜歡這個片段！歌很俏皮活潑，道出原本情同手足的情誼

  像是刀疤版的 I Just Can''t Wait to Be King


  片段搶先看 - 反派


  反派白毛獅Kiros感覺是個狠角色

  也是導致木法莎和刀疤決裂的關鍵


  片段搶先看 - 講故事時間


  Kiara好可愛


  配音陣容


  不得不說麥茲米克森的聲音超迷人，好適合反派的角色

  非常期待他的部分


  雖然很多人都覺得真獅版很像國家地理頻道

  但我永遠不會忘記2019年進戲院看獅子王的感動

  看著動畫被擬真，栩栩如生搭配耳熟能詳的音樂

  非常感動全身起雞皮疙瘩


  迫不及待想看新的電影

  能更了解這對兄弟的過往，或許我們會對刀疤有不同想法？


  --'
