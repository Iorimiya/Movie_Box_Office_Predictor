url: https://www.ptt.cc/bbs/movie/M.1334495610.A.EDB.html
title: '[好雷] 金馬奇幻影展之《奇愛博士》'
content: "一部就好，每次影展只要看一部庫柏利克就好，這週就將不只是嘗鮮和抽福袋，\n  還有個耗腦用心、撼動價值觀的契機。他的作品往往是在挑戰／挑釁你的道德和理性，\n\
  \  以戲劇的方式呈現出「人間的極值」——又同時，並不會走向虛無。那些暴力、冷血、\n  瘋狂、奇豔，確實讓人看得很不舒服，但這「不舒服」本身正是他對觀眾的信賴，是\n\
  \  他期待你從中延伸出思考和辯證、進而獲得知識的引線。\n\n      而《》不但是庫柏利克評價最好的作品之一，也是\n  史上最被推崇的「喜劇電影」之一。它是諷刺的，而這推崇的名份本身更是諷刺的。\n\
  \  事實上，在我看他作品的經驗中，這的確是最輕鬆的一次，因為它並非像《發條橘子》\n  、《鬼店》或《大開眼戒》那樣挖掘人心的暗裡，而是藉著一場軍事鬧劇演出了美蘇\n\
  \  冷戰時代、核子軍備競賽中心處的那點「荒謬」的可能。不論從政治面\n、價值觀面、科技面或\n  道德面，它都真的說\n  服了你「這末日結局，是有可能發生的」。因而我相信，這部片上映當時一定讓美國\n\
  \  的觀眾看得坐立難安吧？而我們，還好已過了半個世紀，知道世事不再那麼箭在弦上\n  ，才得以享受它的「喜劇」部分。這是我說輕鬆的理由。也正是它被歸類在喜劇這件\n\
  \  事的諷刺。\n\n      但真是這樣嗎？真的就毋須擔心了嗎？透過《奇愛博士》，庫柏利克點出了種種\n  軍事系統、科技思維的邏輯盲點，那些譬如「一進入戰鬥狀態，則切斷一切後續通訊」\n\
  \  的原則，和「敵人可能藉由任何方式偽裝，即使是友軍也不能相信」的自我矛盾，是\n  許多諜報好戲的題材，卻是這片裡更多事實被遮蓋、溝通無效化的禍首。而既然人心\n\
  \  不可靠，就「把決策交給完全客觀的電腦，就可以信賴了！」的科技焦慮，不只是庫\n  柏利克長期的關注，更是至今的我們依然費神在辯證的。它還說了政治，那對抗共產\n\
  \  黨的「聖戰」中多少人的敏感神經被逼瘋的醜態，及政客們處理事務的繁文褥節；它\n  還解釋了法西斯，藉由人在面對「末日」時的決策心理，說明了把人異化成一堆統計\n\
  \  數據將多麼順理成章地打開漏洞，\n  讓幽靈進入。\n\n      當然，回到技術層面來看，在拍《奇愛博士》當時的庫柏利克已經是大師了，全\n  片號稱只有三個場景，又其實是從頭到尾大量的飛行特\n\
  \  效給了它「大」電影的感覺。而演出方面，彼得謝勒的一人分飾三角\n是最被津津樂道的，他得演出三種口音、三\n  個完全不同氣質的人物，其中又以奇愛博士最為有趣——他的戲份\n\
  \  最少，說的話卻是最曖昧、最不顧常理因此最接近「真實」的。片裡也以他的前納粹\n  身分開了大量玩笑，古怪之餘，又讓人不時反思\n。\n\n      儘管這是一部政治／軍事諷刺喜劇，但那背後的警世意圖曾是駭人的，也是現在\n\
  \  的觀眾看來、該多少餘悸猶存的。這當中嚴肅卻荒謬的笑點，在庫柏利克拍來，又畢\n  竟大師手筆，而處處是穩重的痕跡。他沒要讓你多麼「笑得出來」，而是反之，要你\n\
  \  明白所謂的「相互毀滅保證」是人類史上曾\n  發展出來的最恐怖的東西。有段話我已經引用過多次了，還是想在這裡提：在電影《\n  》裡，將去和外星文明作第一次接觸的女科學家艾莉，在被問了「見到他們\n\
  \  後，妳準備說什麼？」這問題時，她回答：「我想問他們怎麼辦到的。我想知道在科\n  技不斷進步的同時，他們是怎麼避免毀滅了自己的文明？」\n\n     \
  \ 如今多少年了，這必定也是庫柏利克生前最想知道的問題，依然沒有答案。\n\n      四顆星。\n\n--\n\n   \n      時光之硯部落格 \n\
  \n\n\n--\n◆ From: 114.44.30.12"
