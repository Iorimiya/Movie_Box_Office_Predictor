title: 〔心得〕奇愛博士
content: "即使這是一部經典喜劇，大部份演員卻是極度冷靜專業地演出，或許，\n是導演的刻意營造，更能說明對冷戰時期的諷刺與荒謬思想。\n\n〔赤色風暴〕不少人看過，面對核彈發射指示前，通訊中斷無法再做出\n\
  確認，執意完成任務或者暫緩執行，引發雙方爭鋒相對，這可是攸關不\n止國對國，而是世界生態與人類存活的大事啊！片中提到的放射衰減期\n要９３年，人類要１００年後才能回到地表生活，我看後代跑出來後，\n\
  已經是一隻隻My Precious的咕嚕了。\n\n萬一片中的瘋狂將軍真有其人哩？直接昇高空軍基地警報層級，無視副\n官對蘇聯入侵之質疑，封鎖對內民用廣播，外來人車一律視為偽裝良好\n\
  的敵人，空中待命的B-52機群奉命執行毀滅蘇聯據點Plan R，通訊加密\n斷絕聯絡管道，發射核彈前無須通過總統批準，連駕駛員都熱血沸騰，\n頭戴牛仔帽，富美國精神般，發表冠冕堂皇演說，認為他正做著晉階，\n\
  國家指望的行動，配上神聖吟唱，雄糾糾英雄進行曲，前一刻大夥還在\n看PLAYBOY，機上野餐，悠閒睡覺享樂哩。\n\n末日的到來，居然只是一個指揮官，對男人射精後的純真，表示空虛無\n\
  力，高強到聯想蘇聯共產主義正無時不刻，入侵可愛的美國，有計劃性\n荼毒人民，污染我們的”體液”，挺玄的說法XD，戰爭不該交給政客，\n他們什麼都不懂，而阻止共產的光榮任務，聖戰就由我發動啦！共產黨\n\
  不喝水，只喝Vodka，根本就是外星人啊～！不能坐視不管。\n\n強大的總統五角大廈顧問團終於啟動，最了解任務的巴克將軍，在核彈\n危機前，居然還在跟總統爭辯意識形態，一點也不著急，甚至將錯就錯\n\
  ，制敵機先，高明吧！邊開會亦能跟火辣秘書打情罵俏；所幸有熱線溝\n通管道，可以聯繫蘇聯總理，什麼！喝醉了，自己打電話去空防中心問\n，電話幾番？如兒戲般的對話，互稱朋友，要保重身體，唉呀呀！看來\n\
  大家都不急，連俄國大使前來，也被教訓一番才能進入分秒必爭的會議\n，只為了蒐集情報？！光看大家在處理危機的荒謬逗趣，就足以對本片\n留下深刻印象，尤以巴克不急不徐吃零嘴開會，捍衛理想痛罵共產，對\n\
  比於總統權威冷靜主持會議，打起熱線卻像哄小孩般不正經情緒，煞是\n有趣。\n\n身為瘋狂將軍的副官，唯一能立即阻止危機，發出任務終止編碼的人，\n無奈造化弄人，解碼時還得跟瘋狂一絲不茍軍官抬槓，居然重要的訊息\n\
  ，傳達出去要靠公用電話，零錢不夠，打爆可口可樂販賣機怕被告，軍\n官不浪費地暢飲可樂，前一秒他的嚴謹形象呢？\n\n當然機場攻防戰，Peace is our professor，解除任務編碼的Peace\
  \ on Earth\n，導演的訊息不言可喻；冷戰雙方靠媒體消息引發各類競賽，包括毀滅\n性報復的世界末日裝置。\n\n片中最為高潮莫過於頭戴牛仔帽機長的坐機，執意完成任務之行。Plan\
  \ R\n進行後，機上生存包有著各樣好康，袖珍聖經，俄語小短文，現金，保\n險套XD，任務完成可以到特約商店享樂嗎？其實本片光看機長修復投彈\n閘門，坐上標有HI!THERE，DEAR\
  \ JOHN!的核彈上，如牛仔風光馴牛地咿\n～哈投彈，響起美妙的音樂，地表昇起一朵朵光世代香菇，宛若美麗夕\n陽無限好，感人熱淚希望無窮的SUNNY DAY之歌曲，化作影史經典畫面\n\
  ，乘風羽翼般飛去．．．．．．就已值回票價。\n\n牛仔騎彈畫面，被引用到〔世界末日〕的白癡舉動諷刺，另外核彈引爆\n畫面，也在〔魔山〕發揚光大，將香菇如藝術般呈現與剪接，配合悠閒\n\
  的鄉村音樂，卻是殘忍的人間地獄兇器，發揮到極致。\n\n最後不得不提奇愛博士，在核爆後企圖掩飾希特勒手勢，不得不狂壓抑\n，墨鏡下的瘋狂因子完全喜感呈現！更提出世界末日後，用電腦完成挑\n\
  選精英，在場男仕大聲叫好的男女１：１０人口計劃，根本是納粹日耳\n曼優越主義的再現啊！及人類過於相信電腦科技的反思。\n\n彼得謝勒一人分飾三角，不仔細看的確看不出來，以後還可搬出來溫習\n\
  ，片頭片尾簡樸的文字編排也很不錯，是部有趣的經典黑色喜劇電影。\n\n\n\n\n\n--\n    TRUE LOVE                   \
  \                   @\\m/\n    NEVER RUNS\n    SMOOTH             連嗯嗯也是！\n     \
