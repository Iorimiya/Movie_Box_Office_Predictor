url: https://www.ptt.cc/bbs/movie/M.1172594458.A.D79.html
title: '[感想] 令人會心一笑的奇愛博士'
content: "這部片的導演是Stanley Kubrick。他是個老牌大導演，導過的電影\n\n都很有名。他雖然享年70，但出產的電影量卻很少，片子往往都相隔個四五\n\
  \n年。他的電影很有個人特色，尤其是影像的呈現方式。其實我對他的發條橘子\n\n印象比較深刻，那部片實在太過暴力了，不是血腥上的視覺暴力，而是完整的\n\n不加掩飾的呈現出邪惡的本質的那種暴力。\n\
  \n\n        不過今天主題不是發條橘子，而是奇愛博士。導演故意用黑白片的方\n\n式呈現這部片，來凸顯他諷刺的味道。這部片的故事大意為在冷戰時期，一個\n\
  \n發瘋的美國將軍發出以核彈攻擊蘇聯的命令，然後將基地封鎖。取消核子攻擊\n\n的密碼只有該將軍知道，在這隨時會爆發核子大戰的危及時刻，美國高官們會\n\n怎麼處理危機呢？這就是這部片的大要。\n\
  \n\n        乍看之下好像是個嚴肅的片子，不過本片的表現手法非常幽默。很多\n\n的鏡頭和對話都會讓人會心一笑，而不會因為主題很嚴肅，就讓人看的很緊張\n\
  \n，讓觀眾可以用很輕鬆愉快的心情看電影，同時又會思考，真的有可能發生這\n\n種平常認為無稽到可笑的事。想來真的滿恐怖的，這世界的平衡就維持在這兩\n\n大強權下，只要有極端分子想要造事，稍有不慎就要托很多其他無辜的人下水，\n\
  \n真的是很恐怖。講到這又讓我想到令一部我覺得不錯的片 \"恐懼的總和\"\n\n不同於奇愛博士，雖然題材類似，可是那部片就是非常嚴肅的處理這題材。\n\n可能是因為奇愛博士走黑色幽默路線吧，所以對於這問題的探討，我覺得沒有\n\
  \n這麼深刻，像我在看時，因為抱持的輕鬆的態度，也懶得太過深入想那些問題，\n\n所以看完時的當下沒有太多想法。這可能算是缺點吧\n\n\n        結局我覺得很讚，以下有雷，我沒想到辛苦這麼久，還是爆了，而且\n\
  \n還是一個很有捨身取義精神的士兵親自犧牲自己完成的。他還坐在飛彈上高興\n\n的揮著帽子(好像吧...)，然後爆炸時還配著很歡樂的古典樂，整個很諷刺，\n\n\
  結局真的很棒，讓人精神一振阿！整部片長度也算剛剛好，不會覺得冗長，\n\n推薦去看。\n\n\n\n--\n \n  \n\n--\n◆ From: 140.113.140.159"
