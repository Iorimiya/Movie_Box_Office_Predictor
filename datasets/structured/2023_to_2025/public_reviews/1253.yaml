url: https://www.ptt.cc/bbs/movie/M.1690168425.A.A3E.html
title: '[討論]歐本海默與奇愛博士電影主題的相似性?'
content: '最近熱議的歐本海默電影票房開出紅盤，讓世人對於歐本海默的複雜人格特質、被麥卡錫

  主義時代下的美國政府封殺，還有深摯片尾與愛因斯坦的談話，都發人深省!


  記得在1960年代由名導史丹利· 庫柏力克所拍攝的電影「奇愛博士(Dr. Strangelove

  or: How I Learned to Stop Worrying and Love the Bomb」傳給世人一個觀念:「若發

  生全面核戰爭將沒有一方可以最後獲勝!」這部片在EMBA課程裡面常被引用，當賽局走向

  零和遊戲就會變成化不開的僵局，只有保證雙方都被毀滅為止，冷戰時代的思維就是其中

  例證。


  想請問大家，看過歐本海默這部傳記電影，能讓人們都於全面核戰的恐懼，和對二戰提早

  結束的兩難，有更深入的反思嗎? 這部電影和奇愛博士的調性相反，對於生活在廿一世紀

  的我們會帶來什麼啟示呢?


  --

  樂活人醫

  ==========================================

  有奮鬥過、有努力過，曾忠於某些理想，

  這就足以讓掙扎變得值得。(威廉· 奧斯勒)

  欲為醫者，必先為人也! (高木友枝/杜聰明)

  ==========================================


  --'
