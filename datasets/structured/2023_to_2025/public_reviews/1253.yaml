url: https://www.ptt.cc/bbs/movie/M.1690169484.A.A18.html
title: '[雷] [好雷]奇愛博士，恰到好處的戲謔'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  StanleyKubrick導演1964年的作品。從片頭一開始，寧靜平和的輕音樂搭配著美國核威攝戰

  略轟炸機空中加油的畫面(非常喜歡這個開頭)，就揭示了這是一部披著嚴肅外皮但內涵荒謬

  的諷刺黑色喜劇。喜歡整部片嚴謹的設定(主要展現在B52轟炸機內的執行程序與軍隊聽令攻

  擊空軍基地的仿紀錄片式畫面，也就是聽令行事的基層軍事體制)，這樣的外皮與整體氛圍

  反倒讓內涵的荒謬(主要表現在政治意識與政治決策部分)顯得更加可笑(而不是淪為純粹的

  搞笑)，因此整部片有了恰到好處的味道，多一分顯得過於嚴肅、少一分顯得過於無腦戲謔

  。StanleyKubrick不愧是StanleyKubrick。


  --

  我的電影心得分享



  --

  真的是經典畫面XD'
