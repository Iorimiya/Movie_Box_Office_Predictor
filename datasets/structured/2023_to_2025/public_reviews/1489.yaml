url: https://www.ptt.cc/bbs/movie/M.1692277012.A.278.html
title: '[新聞]復仇狗聯盟爆咬GG引發熱議！製作人保證：'
content: '《復仇狗聯盟》爆咬GG引發熱議！製作人保證：「這是團隊一致決議、非幹不可！」




  即將上映的R級喜劇電影《復仇狗聯盟》（Strays）預告中，一句「我要咬下他的雞雞」

  引起網友熱議。而根據這部片的製作人雙人組洛德與米勒（Lord and Miller）掛保證，

  本片將毫無顧忌地「踩緊油門」開快車，從來沒有想過要收斂的打算。


  菲爾洛德（Phill Lord）說，「咬雞雞」是編劇團隊全數「舉手贊成」的共識：「這是一

  致決的共識，如果我們要拍這部電影，我們就要往那邊衝。而觀眾的反應是如此強烈，他

  們既興奮又害怕，不敢相信我們會這樣搞。」


  克里斯多夫米勒（Christopher Miller）也強調，《復仇狗聯盟》雖然充斥著低俗的垃圾

  話，但本質上仍是一部溫馨可愛的電影：「這才是我們的目的。既然我們都要拍得這麼低

  級，拍爛的版本是憤世嫉俗的，就只是為了低級而低級。這部作品是對毒品有些反思的，

  同時又有點純真可愛的感覺。這讓它既有趣又吸引人。」





  新聞網址：




  --'
