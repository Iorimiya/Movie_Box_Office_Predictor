url: https://www.ptt.cc/bbs/movie/M.1692248572.A.D95.html
title: '[好微雷] 復仇狗聯盟 葷素不忌的狗狗復仇之旅'
content: '昨晚去看了特映



  以下微雷







  如果有看官方宣傳就知道這部不是溫馨感人的狗狗電影，


  而是充滿髒話、色情等各種葷素不忌笑梗的公路復仇喜劇。



  劇情大致在說主角雷吉被爛主人道格羞辱並惡意棄養，


  但他因為聽不懂人類的語言，因此一直覺得那是主人愛他的表現，並在之後遇到其他狗同

  伴後，才意識到自己被拋棄了，從此在同伴的陪伴下，展開復仇之旅。







  全片一個半小時，充滿各種R級的垃圾話，還有不知道吸了什麼的橋段，


  呈現出狗狗對人類的誤解，以及身處人類社會的差異，以狗的視角看待我們稀鬆平常的事

  物，


  例如園遊會的煙火在他們的感官下卻像是戰爭現場，嚇得以為小命不保



  中後段也來了一段公式化的遭遇困境、同伴爭執、自我懷疑、對拋棄自己的前主人帶著複

  雜的情緒，



  不過也很快的化解，進入重頭戲的爽快復仇。






  作為一部輕薄短小的R級喜劇，這部電影的娛樂性相當足夠，


  影廳內時時刻刻充斥著笑聲，狗狗們的演出也讓人覺得可愛又好笑。


  劇情流程雖有點流水線、容易猜到故事發展，


  但狗狗們帶著各自的課題展開公路之旅、逐漸培養出的友誼，這些過程還是讓人挺喜歡的

  。



  對了，片尾credit結束後還有一段畫面，可以留意一下





  --'
