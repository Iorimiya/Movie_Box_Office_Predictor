url: https://www.ptt.cc/bbs/movie/M.1692548556.A.E7D.html
title: '[普好雷] 復仇狗聯盟 糞作(?)'
content: '防個雷


















  以往的真狗電影不外乎溫馨感人的走向


  但這部就整個很ㄎㄧㄤ


  一開始的目標就設定要咬爆壞主人的蛋蛋


  結果最後還真的....痛啊！




  笑點塞得不少


  有些確實是滿好笑


  我覺得不好笑的同廳也有其他人笑


  應該是不用擔心會不對胃口


  只是滿多都很髒www




  說到髒，一路上跟大便也很有緣


  但覺得有點太多


  在收容所那邊的味道都快從螢幕飄出來了


  糞作無誤=.=




  而最讓我感到疑惑和納悶的一點是狗狗吃到毒菇那邊


  因為幻覺而把活生生的兔子撕咬的七八爛...


  不懂為什麼要有這段（不知道看過的人有沒有什麼想法><?）


  有點噁心


  被嚇到差點以為看錯片Q_Q




  結論：狗狗可愛><


  --'
