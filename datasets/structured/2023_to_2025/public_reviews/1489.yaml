content: "【復仇狗聯盟】8月18日 靈犬來吸 戲院見\n\n爆笑預告: \n\n特映會場次（一人得獎兩人同行）\n中午場：8月15日 12:30 欣欣秀泰影城\n\
  台北場：8月16日 19:30 國賓長春影城\n台中場：8月15日 19:00 文心秀泰影城\n\n參加抽獎方式：推文回答你想要搶先看【復仇狗聯盟】的原因，\n\
  並註明場次就有機會中獎（如：）\n公布得獎日期：\n（將會公布於回文內，得獎者請站內信回覆領票者資料，恕不接受逾期回覆）\n8月9日公布得獎名單，請於8月10日10:00前回覆\n\
  \n\n\n\n最後借插題外話:\n之前有看到得獎名單引發爭議的貼文\n這裡小小澄清一下，特映票若要留給公關或廠商的票會另外處理\n不會需要透過贈票贈獎活動來黑箱操作\n\
  \n但的確不可否認可能會有抽獎大隊大量留言來提高其中獎機率(有辦活動應該能感同身受)\n除了PTT，我們還會在官方粉專FB、IG做贈票活動\n當然很感謝有些版友們會熱情來信告知要我留意抽獎大隊，甚至提供一大串的名單\n\
  有限的時間裡我無法也不可能一個個去查每個id的IP來源或是去每個抽獎者的頁面檢查\n活動也僅能採亂數隨機抽獎方式處理 (抽完獎還要整理名單寫信封趕快跑郵局寄票券...)\n\
  \n另外也會有網友好心來信檢舉有人公開販售票券，若能及時處理我也都會取消其得獎資格\n因此若之後有機會能夠有更有效抵制抽獎大隊的方法，對我們主辦單位絕對是一大福音\n\
  我們也希望贈票是送給真的有想要看電影的版大們共襄盛舉\n我們在電影版辦贈票已經有十年了吧QQ 感謝大家總是願意留言來參加\n但若您真的對我們抽獎活動有疑慮或不認同的話，可以按左鍵離開沒關係的(含淚)\n\
  \n打完才發現不小心又是落落長一大篇，言歸正傳，歡迎大家留言來抽【復仇狗聯盟】\n很適合在暑假壓軸看的腦洞大開又有可愛狗狗們的電影輕鬆一下！\n\n\n\n--"
