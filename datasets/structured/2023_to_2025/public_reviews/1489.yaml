url: https://www.ptt.cc/bbs/movie/M.1692360480.A.A27.html
title: '[普無雷] 復仇狗聯盟'
content: '這部是衝著威爾法洛配音去看

  想看他配動物片能多低級

  結果裡面大部份台詞幾乎都落在傑米福克斯身上

  威爾配的角色還蠻正經的


  這部被歸在輔導級的確沒錯

  整部片低級、露骨以及一堆Fuck的台詞很多

  戲裡除了低級還有噁心跟血腥劇情

  但全都點到為止

  並沒有什麼衝擊畫面出現

  大部份時間都是看狗狗在嘴砲推進劇情

  喜歡看動物電影蠻推的

  可能裡面的梗跟威爾之前的作品比還沒到下流低級的程度，所以我就覺得的還好


  但這部票房應該不會太好

  畢竟我看的時候是一人包場…幸好是喜劇片，之前看瑪莉皇后號剛進場時只有我一位…還好之後有其他人進場，我一個人在電影院看恐怖片真的不行…






  -----

  Sent from JPTT on my iPhone


  --'
