title: '[  雷] ［好雷］我的2年妓女生涯'
content: "（女生觀點評論，微雷）\n \n\n有點羞澀的開口\n\n：請問要看什麼電影？\n：呃 我的、我的2年妓女生涯\n：是20:00場次的））重複片名\n\
  \n這大概是繼\n「我是世界上最爛的人」後\n我覺得這比起飲料rap名稱\n更需要勇氣和部份恥度說出口的片名\n\n在IG偶然看到的預告\n直覺是情慾片\n但真人真事改編的文學作品\n\
  本就偏愛冷門片的我，更吸引我去看\n昨天上映，看了高雄的場次\n少到不到4場/天\n\n看完了影片\n最後結尾來了震撼內心的場面\n這，不是一部單純的情慾片\n\
  這是一部描述\n現實、人性、感性和慾望文藝片\n\n也許一開始會跟著主角\n一起陷入那種困惑\n許是因為沒有主題、動機想寫書\n或者因為對於性的慾望？\n又能藉由性工作者這角度獲得寫作靈感\n\
  的確\n她從每個客人得到不同故事\n當然還是會有愛情的渴望\n但是當她坦白為了寫書下海\n愛人的回應是有些傷人的感覺\n\n「你是真的喜歡和我做愛，還是只是因為妳的工作才跟我做愛？」\n\
  \n最後的最後\n嘴巴上說會努力說去克服\n但最後女主在工作上被性侵\n同一天下班後\n愛人在廚房做菜說了\n法國菜很難做，但我盡力了。\n\n在工作和愛情同時遭受打擊\n\
  她在浴室放著水痛哭的片段\n是讓觀影人有著揪心的感覺\n\n最後，她在同工作室內的同事\n聊起每個人選擇工作的目的\n為了能夠多一點陪伴女兒時間\n為了丈夫醫藥費\n\
  為了賺錢\n\n在一切虛幻化名與真實世界\n平行時空內\n如何在工作/生活劃出不同人生\n\n即使在德國柏林有設置\n合法紅燈區\n但每個尋芳客的目的不同\n\
  代表著性工作者面對的是未知\n\n影中讓我印象深刻的是\n同事：我曾有「正常」工作過\n一週工作六天\n下班回家見不到女兒\n晚上安靜的像墳場一樣\n但我選擇了這個工作後\n\
  能夠陪伴女兒的時間多了很多\n\n也許會想問這部和「格雷」不同？\n\n格雷是純粹小說改編\n而這部片是真人真事親身體驗\n寫出的人性、慾望及現實的影片\n\n\
  我推嗎？\n我推，但我覺得著墨於人性比愛情更多\n跟謎片還是其他情慾片是有差的\n\n這幾年，歐洲及北歐電影\n都是令人驚豔！\n\n--"
