title: '[好雷] 自主選擇與無從選擇：我的2年妓女生涯'
content: "本文涉及劇情，且具個人觀點，推薦觀影後再讀。\n\n　　　　本片已上映第二週，有意者請把握本週時間。\n\n\n\n　　　　圖文網頁版：\n\n\
  　　　　\n\n\n　　　　預告片：\n\n　　　　\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n自主選擇與無從選擇：《我的2年妓女生涯》\n\n\n\n　　電影《我的2年妓女生涯（La Maison）》改編自作家艾瑪・貝克根據親\n\n身經歷撰寫而成的小說，由身兼演員及紀錄片導演的阿妮莎・邦奈馮\n\
  \n（Anissa Bonnefont）執導。觀影時慶幸性愛場面非以男性凝視取鏡令人不\n\n適，我的好奇心更接近女主角艾瑪（安娜‧吉哈杜Ana Girardot飾）「為了\n\
  \n寫作」而去探索的動機：德國在2002年將賣淫合法化至今，成為２年的性工\n\n作者有沒有可能是一種「自覺」與「選擇」？可不可能獲得保護同時保有人\n\n的尊嚴？女性可不可能成為性主體？\n\
  \n\n\n\n\n自主選擇\n\n\n\n　　這應該是我第一次看類似主題的電影，今年看的《聖蛛》顯現的是在伊\n\n朗這個仍舊性別歧視、男尊女卑的國家，女性是雙重被害者：成為性工作者\n\
  \n是墜落父權社會底層的別無選擇，因而成為無用退伍男性以宗教之名屠殺獲\n\n得榮譽感的最佳選擇──性工作者的處境只是開頭引導觀眾的鏡頭而非全片\n\n重心。在《我的２年妓女生涯》故事開始沒多久，我們就先看到艾瑪的生活\n\
  \n狀況：雖然已經出版了兩本書，但第三本遲遲沒有著落；在柏林與妹妹同居\n\n的她，需要穩定的收入按時繳交房租；剛失戀，目前跟一個同是作家的有婦\n\n之夫史帝芬維持性關係，「一個人的時候很無聊，但是有了你以後，我又感\n\
  \n覺很需要空間」，連同之後跟妹妹的對話亦可知有性愛親密與自我實現的需\n\n求，所以化名為「嘉斯汀」，選擇以提供性服務為工作。\n\n\n\n妹：「你知道如果你寫這本書，這個名聲就會永遠跟著你。對別人來說，你\n\
  \n不只是作家，你也會永遠都是妓女。」\n\n\n\n姊：「也許我不想要『只是』作家，就像你說的，我這麼做是為了自己，我\n\n才不在乎別人怎麼看我。」\n\n\
  \n\n　　乍看之下是設想清楚，從經濟到身心都有所需求的自主選擇。儘管對性\n\n抱持著開放的態度，但艾瑪同時面對原本生活與性工作的環境，難免有過掙\n\n扎與矛盾，面對責難必須有所堅持甚至防禦。例如她面對妹妹和史帝芬時極\n\
  \n力維護性工作者和一般工作者並無不同，強調「做這件事是為了自己」；但\n\n當她對其中一位嫖客產生好感，便打破不言及私事的原則，主動告訴他自己\n\n做這份工作是為了寫作，證明「我和其他性工作者不同」──這種意圖可以\n\
  \n看到她認知「作家」的價值優於「性工作者」。當史帝芬說她「你還是相信\n\n真愛」的同時，也傳遞與預示了「性工作」與「真愛」在一般認知裡難以畫\n\n上等號與達成平衡。\n\
  \n\n\n　　誠然，性工作與其他服務業有相同之處：必須在滿足客人需求的同時維\n\n持自己的底線，最好能引導出客人的喜好，善用時間完成工作，達成心靈的\n\n\
  滿足更佳，才可能成為熟客與吸引更多客人──亦即服務不能一味被動，掌\n\n握主導權才能推銷與保護自己。艾瑪不僅年輕貌美，會說法語，與試圖以作\n\n家為觀察主體的迥異態度確實是吸引嫖客的優勢，也使她在第一個工作場所\n\
  \n被同事冷淡，勤寫筆記則被老闆指責不夠積極，直至被嫖客強迫吸食藥物才\n\n不得不離開。但總編不肯預付版稅，她不想再使經濟落入困窘，第二次便選\n\n了「甜心之家」並長期在此工作，乃因裡面的二老闆布莉姬達（蘿西‧德‧\n\
  \n帕瑪Rossy de Palma飾）會保護她們，過濾有問題的客人，使同事在各自維\n\n持隱私的情況下有餘裕對彼此表達友好與關心，還會交流工作技巧──艾瑪\n\
  \n就是在希兒蒂身上學到如何運用ＢＤＳＭ滿足嫖客。從被動的學習、服從，\n\n到主動挑逗成為主導者，我們都能看見艾瑪無論對性工作的流程與服務內容\n\n都愈加熟稔。\n\
  \n\n\n\n\n背負汙名\n\n\n\n　　然而身體的接觸無法排除心靈的感受，加上性是高等級的溝通，身心都\n\n須投入的服務耗費太多能量終會竭盡。當艾瑪經由交友軟體認識伊恩（盧卡\n\
  \n斯‧恩格蘭德飾）陷入戀情後，與工作畫出更為清楚的界線就愈加必要。儘\n\n管熟稔性愛的技巧、開放的態度和彼此欲求的渴望讓艾瑪與伊恩創造了相當\n\n契合歡愉的體驗，但難以隱瞞與維持界線的事實使她選擇了坦白，卻看見伊\n\
  \n恩勉強接受下的抗拒──「性」畢竟必須裸裎，一旦男性嫖客無意遵守規矩\n\n或尊重意願，女性工作者就容易受到傷害，包括艾瑪之前被逼吸食藥物、無\n\n套性侵的同時被要求扮演未成年小女孩來滿足嫖客的性癖──當她被折磨回\n\
  \n家，伊恩正好來訪試圖做出她家鄉的餐點與她建立感情，即使想先「洗澡」\n\n整理狀態並恢復自我，但受傷的身心無法掩藏，在伊恩察覺後實難接受的情\n\n況下更難傾訴，遑論維持關係。所幸分手過程並無傷害與侮辱，而是溫柔而\n\
  \n殘酷的證實了這份工作使戀愛無法持續，艾瑪只能打開蓮蓬頭在水聲的掩護\n\n下痛哭。\n\n\n\n妹：我不覺得賣淫和妓院有什麼好的，這不是什麼好工作。\n\n\
  姊：你不懂我在寫什麼。\n\n妹：你就懂嗎？你知道自己的責任嗎？\n\n　　如果有年輕女孩看了你的書也想幹這行，結果被人殺了，怎麼辦？\n\n姊：這是個故事，是我的見證，我沒有說這是好事。\n\
  \n　　我說的是這個地點、我的經驗，我的感受、我的慾望。\n\n妹：別把我當白痴。\n\n\n\n　　艾瑪一直試圖用「從事性工作沒什麼不好，就像客人出錢幫我寫書」自\n\
  \n我說服，至此也不能不承認妹妹的擔憂確然有據，這也是她從事這份工作以\n\n來第一次打電話向母親坦白。「我們與那些社畜不同之處，就在於我們無法\n\n大聲說出我們在哪上班。」無論如何振振有辭，無法向母親、向外人坦承這\n\
  \n份工作仍是事實，對男友更須時刻防禦，無法表露真心。「甜心之家」的同\n\n事都必須取個假名，提醒自己「不是真實人生」，她們來做這份工作亦各有\n\n因，最大的因素還是金錢，一如其中一位同事朵洛蒂（卡洛爾‧韋耶斯\n\
  \nCarole Weyers 飾）所言：她認真一週工作六天還不能抽空抱抱女兒，但做\n\n這份工作一週只需四天，自能陪伴女兒成長──亦即「性工作」作為一種經\n\
  \n濟行為，可以換得時間與餘裕的高額報酬是選擇的主因，艾瑪亦不能例外；\n\n但與其他服務業的薪資水平不同，乃因出賣身體「不能輕易向外人道」的汙\n\n名仍在：當艾瑪在外偶然遇見同事得裝作不識，或朵洛蒂察覺她不斷寫筆記\n\
  \n別有用心，警告她「不要暴露她的身份（同樣是「身心照護」，這份職業的\n\n曝光將會害她失去護理師的職業）」，都證明了性工作固然可以自主選擇，\n\n卻無法拒絕背負汙名。\n\
  \n\n\n\n\n承擔風險\n\n\n\n　　艾瑪亦云「尋芳客們走進妓院感受到母性與邪惡的力量，並在性工作者\n\n的聖壇卸下負擔」，認知性工作具備類似護理師、心理諮商師等專業。確實，\n\
  \n性交易對於雙方都增加了性探索的可能，藉由不同的體驗來開發自我理解，\n\n除了艾瑪習得更多引誘與主導的技巧之外，嫖客中有妻子生育後得了憂鬱症\n\n無意性愛，前來尋求滿足的丈夫；有要求兩名女性服侍的醫生，在艾瑪生病\n\
  \n時不僅免費為她看診，更貼心地告訴她會忘掉住址，維持隱私的界線；有氣\n\n質極佳的熟女難得來到柏林，把握機會嘗試同性之間的性愛；還包括從未有\n\n過性經驗的年長男性在結交第一個交往對象後，想要先行學習好讓對方得到\n\
  \n滿足，使得艾瑪必須從身體接觸的技巧和感受心靈的觸發一一傳授……無論\n\n性如何開放，終歸屬於隱私難以啟齒，選擇合法的性工作管道加以探索與體\n\n驗，不啻是較為安全的選擇。這讓我想到日本漫畫家永田カビ的自傳作品\n\
  \n《我可以被擁抱嗎？因為太過寂寞而叫了蕾絲邊應召\n\n（さびしすぎてレズ風俗に行きましたレポ）》也是由女性作者自述找尋女\n\n性工作者來自我探索性傾向的經驗，這份經驗使她意識到過去對性的錯誤想\n\
  \n像，也在回顧生命與創作的過程裡尋得肯定，進而找到死亡以外的出路，有\n\n了活下去的動力。\n\n\n\n　　不同的是，性交易對有需求的嫖客而言固然是多了「卸下負擔」的選擇，\n\
  \n但對性工作者來說卻未必提升安全，相反的，以上例子證明了性工作者承擔\n\n了其他女性的風險與負擔，卻未有約束男性性慾、改變性別權力的作用。在\n\n艾瑪與同事的閒聊裡，可知即使賣淫合法化，仍然有戀童案件發生；艾瑪遭\n\
  \n到侵犯，仍得忍辱取悅嫖客的無力和卑微使她不斷下降「我只有╳歲」時，\n\n除了象徵性犯罪對任何年齡的女性皆可能發生，更證實了性犯罪者要的不是\n\n性的滿足，而是對女性（乃至幼兒）的控制欲，強化自身性主體的地位，\n\
  \n「合法」的性工作者自是成為性犯罪嘗試與獲取滿足的首要對象，與《聖蛛》\n\n裡加害者與受害者的關係實無二致。艾瑪轉換到「甜心之家」能「安定」下\n\n來，乃因這裡有布莉姬達給予基本的保護，但仍不能徹底阻擋侵犯，真正的\n\
  \n老闆（男性）則始終隱身其後從未現身。\n\n\n\n　　顧客是男性，出資的老闆是男性，都不會為這些傷害負責，這樣一個隱\n\n藏起來的天羅地網，使得那些隨時可能發生的傷害、羞辱與歧視（包括性工\n\
  \n作場合或生活周遭）更只能由女性工作者自行消化、迴避或彼此維護。艾瑪\n\n愈強調女性具有能動性、自願選擇成為性客體甚至相信自己是性主體，固然\n\n可以吸引嫖客興趣，讓自己有別於其他同事成為更昂貴、更值得獵逐的商品\n\
  \n而短暫獲利，但同時也為嫖客的性慾與犯罪免責，男性甚至可以此為例子與\n\n理由，誤導大眾認為所有從事性工作的女性都不是受害者。\n\n\n\n\n\n承認脆弱，與「女性」和解\n\
  \n\n\n　　「我以為我會寫男人的故事，結果卻只寫了女人的故事：她們用纖纖玉\n\n指，創造與毀滅神聖的虛幻概念。我想談她們的事，因為她們是真實的，她\n\n\
  們在這艘空虛的船上，留下了上千種愛的氣味，以她們獨特的方式，尋找和\n\n發現溫柔。這並不高貴，卻有別處找不到的動人真情。」\n\n\n\n　　電影的最後，艾瑪想像自己作男性裝扮，走進店裡一一評選同事，進入\n\
  \n房間，然後裸身穿過隔開性工作者與嫖客之間的簾子，穿回衣服，和同事融\n\n洽相處，即象徵了艾瑪做這份工作的心路歷程：一開始對妹妹述說創作動機\n\n時，是想以男性視角觀察，然而「只做一段時間」到變成數月，再變成２年，\n\
  \n「寫了滿滿的筆記卻無從下筆」；原本她一直旁觀同事，也以自身涉入性的\n\n職場，始終體察個人的感受與變化，到逐漸融入同事、接近她們生命歷程，\n\n可知她一直極力維持初衷，卻仍不知不覺被這份工作的環境改變，使她明明\n\
  \n生病看診，聽醫生（也是嫖客）說不用付錢時下意識掀起上衣露出乳房；在\n\n她經歷傷害和被伊恩提出分手的心碎之後，才能向母親、也向自己承認：這\n\n份工作若以大多男性立場來看，將是獵奇與獲取滿足的經驗蒐索，每個性工\n\
  \n作者都是一種「選擇」；但對大多女性而言，卻仍是服務男性、難以自主、\n\n隨時可能被打破安全界線的、真實生活的延伸。只有承認同被挑選、背負汙\n\n名、承擔風險、為生活而付出的狀況實則大同小異，她才能承認自己的脆弱\n\
  \n與受傷，以及對同事、對這份工作有真正的尊重。而艾瑪身為作家，如果堅\n\n持自認擁有自主以抗拒（實則）受辱或是成為嫖客的商品，並在作品裡強化\n\n這份認知，就會如妹妹所言，可能使其他尚不了解的女孩涉入危險。\n\
  \n\n\n　　總歸來說，《我的２年妓女生涯》的導演以「打造一個真實的世界」為\n\n目標，引領觀眾看見這件事：無論怎麼開放「性」，開放最多的還是男性的、\n\n\
  嫖客的、有權者的性，包括探索同性經驗的年長女性，或像艾瑪這樣可以離\n\n開、可以用「作家身份」來作盾牌，擁有其他資本的「有權女性」，除此之\n\n外，性工作仍是底層女性惡劣生活的體現與無從選擇。艾瑪最後以這樣角度\n\
  \n來呈現兩年經歷，應是與自己、也是與女性之間的和解吧！\n\n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\
  \n                                  陳斐雯  貓蚤札（其三）\n\n--\n\n　　謝謝。^^"
