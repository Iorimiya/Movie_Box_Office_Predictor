url: https://www.ptt.cc/bbs/movie/M.1684507119.A.21A.html
title: '[好雷] 我的2年妓女生涯 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  改編真人真事


  劇中女主角原本是位作者，為了撰寫自己的下一本新書，

  擬定以性工作者為主題的新書，為了完成這本新書目標，

  女主角就決定去妓院當妓女體驗真實世界的妓女身份。


  不過電影一開場沒多久，有一幕是女主角跟另外一位友人上床，

  畫面停留在女主角跟友人辦完事的地方，女主角突然跟友人說：


  一個人的時候很無聊，但是有了你以後，我又感覺很需要空間


  從這裡就好像有意思想要揭露女主角的另外一個意圖，

  其實不完全都是為了要寫書而去體驗性工作者的生活。


  從女主角開始進到妓院工作以後，電影算是成功拍出電影本身想言說的層次

  一是上面提到女主角真正想要進到妓院工作的意圖，是真的要寫書，

  還是她本身對於慾望以及情感的態度，導演點出來又留了一些空白給觀者。


  二是會來到妓院的對象，來自各式各樣的人，有醫生，有女同志，

  有跟妻子無法辦事的丈夫，也有想要取悅女友的人來妓院學習做愛技巧。

  觀者從這些在妓院來來去去的男人女人，窺探每個人真實慾望的樣貌。


  三是性工作者在工作場域所面臨到的危險以及社會的眼光，

  所以電影裡有兩幕拍出女主角被嫖客強迫吸毒，以及被無套強暴的處遇，

  另外就是社會對待性工作者的態度，電影有一幕是所有性工作者坐在一起的畫面，

  在巧妙的對話中，點出社會對於性工作者還是帶著道德的批判和歧視，

  社會既需要性工作者的存在，又將她們的存在視為不道德的職業。


  突然就想起西蒙波娃在第二性一書裡面寫道有關妓女的篇幅是這樣敘述的


  妓女之於城市，猶如陰溝之於皇宮：沒有陰溝，皇宮就會變成骯髒，惡臭之所。

  為了挽救大部分的女人，而且為了預防更不堪的污穢，顯然有必要犧牲一部分的女人。


  這裡所說的犧牲，某種程度上就是作為所謂良家婦女道德慾望的代罪羔羊。


  這部電影的拍攝相當露骨，覺得女主角真是為了藝術二字鞠躬盡瘁呀。



  --'
