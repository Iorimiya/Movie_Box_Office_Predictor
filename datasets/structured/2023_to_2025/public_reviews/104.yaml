title: '[  雷]  他年她日。台灣首映'
content: '剛看完台灣首映

  先說，

  想知道男神許光漢究竟可以被弄得多~~醜

  一定要去看這部電影XD

  從頭到尾沒有一幕是帥的

  導演也真是厲害！





  電影採用倒敘法

  拄著拐杖的優日區醫生安晴，想過去長年區

  但因腿傷暫時去不了，

  回想起她和男主角是如何相遇的。



  這篇心得好難寫喔！

  光是要把兩區時間差異 用文字表達清楚就遇到困難！


  優日區=長年區

  一天24小時=一年365天


  就是天上三天，人間三年的概念。



  —直接上劇情簡介—


  描述大地震將世界一分為二，矗立於海中央的「重力牆」扭曲了兩邊的時間與重力，在「

  優日區」的一天，等於「長年區」的一年。

  來自優日區的 28 歲實習醫生安晴（袁澧林 飾），在一次醫療任務中邂逅了長年區的13

  歲薯仔（許光漢 飾）。在這場跨越時空的相遇中，薯仔的稚氣逐漸蛻變為堅定，而安晴

  的防備也慢慢融化成牽掛；大自然的巨變和重力與時間失衡下，一場刻骨銘心的奇幻愛戀

  即將啟程......。



  —簡介結束—



  所以安晴雖然每天去

  但對於薯仔來說是一年見一次。

  所以安晴每天過去見到的薯仔都是暴風式長大！


  安晴雖然內斂，但面對熱情直接的薯仔（而且已經成年了）透過一次次相處，理智的她也

  漸漸心動。



  長年區醫療資源不足的問題一直存在

  有陣子重力牆不穩定，船無法往來

  優日區沒有提供醫療服務，安晴也沒辦法來

  薯仔遲遲等不到安晴，加上弟弟氣喘藥匱乏

  命危在旦夕。薯仔決定搏命去優日區！



  在穿越重力牆的時候，薯仔被嚴重灼傷，

  加上優日區的重力太強讓他舉步維艱

  需要服藥才能舒緩。



  等到薯仔昏迷醒來 已經過七天，

  也就是弟弟在家等他的藥等了七年。

  他知道凶多吉少，即使再捨不得安晴，

  還是忍痛回長年區看看弟弟，

  可能也因為自責 選擇永遠待在長年區。


  由於地震頻頻重力牆因熱力發生劇變，

  長達三十天無法通行，

  安晴跟薯仔最後一別就是30年。

  等到安晴再次回到長年區，

  薯仔已成為那記憶中的少年......




  這部是奇幻電影的設定

  有些時間差異 因資質不夠有點不懂，

  但還是可以理解故事的脈絡。


  劇本設定不錯，演員也是頂級。

  但真的要說這部最大的問題

  就是導演要加油欸！


  很多細節堆疊不足，

  而且很多鏡頭都一直拍側臉，眼睛還被頭髮擋住

  演員演技眼神 情緒濃烈都看不到。


  明明病床久違相逢那一趴應該很好哭，

  只能說又被導演搞砸了。

  吻戲的氣氛多醞釀一下、

  熾熱眼神來回幾回合再親就會很感人，

  然後病床戲光漢的台詞很多，

  一直仰拍許光漢的鼻孔是在幹嘛？



  對，導演的鏡頭很單調，是這部的敗筆。



  總之，

  本來看到幾則對這部電影的評論都很不妙，

  抱著應該是負分的心情去看，

  看完覺得其實不差耶，絕對有及格啦！


  --'
