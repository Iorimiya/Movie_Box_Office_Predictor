url: https://www.ptt.cc/bbs/movie/M.1760248430.A.C9B.html
title: '[無雷] 他年她日'
content: '先說結論題材新穎，不說有沒有bug


  整個故事算有流暢但…很無聊很無聊


  就你能猜到的劇情就是那樣


  連認錯生子的橋段也出現了xd


  不管偷藥還是臨檢


  都沒有火花也沒有緊張刺激


  唯一的驚喜大概就是


  武替道的男主角有演！！


  武替道超好看的啊!


  然後看在許光漢的面子我就不負雷了


  講幾個缺點好了（還不夠多嗎？


  劇情非常庸俗，男女主角都救不了


  我看的是國語版


  我沒想到有生之年


  還能聽到如此出戲的配音版


  嘴巴跟配音完全搭不上


  真的超級不能接受


  如果有粵語版我會選粵語版


  反派完全沒有任何威脅性


  應該說有反派嗎？


  愛情方面很單調很薄弱


  劇情也平庸甚至無聊



  最後能看到武替道的男主角


  也算是值回票價了







  -----

  Sent from JPTT on my iPhone


  --'
