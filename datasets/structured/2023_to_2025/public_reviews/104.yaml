url: https://www.ptt.cc/bbs/movie/M.1760356483.A.35C.html
title: '[討論] 如果有談過戀愛，真的會被他年她日戳到'
content: '雖然電影評價兩極，但我覺得如果你有談過戀愛，真的值得去看。


  原本只是想看許光漢帥臉，結果看到中段整個 PTSD 爆發。


  那句台詞「你過一天、我過一年」真的太狠，

  完全是我以前那個值大夜班的前女友——

  每天晚上 11 點上班，早上 8 點下班。


  她在打點滴、照顧病人；

  我在打報告、照顧自己。

  我們見一次面，比打疫苗還難預約。


  偶爾約吃宵夜，她穿著醫院外套，

  頭髮亂得像鳥巢，還能笑著說：

  「你怎麼又胖了？」


  那一幕，我現在都還記得。


  電影裡男主一年等女主一天，

  我心想：他至少還有倒數。


  我連倒數都沒有，

  有時候她連一句「我下班了」都沒空打。

  但最靠北的是——

  她只要一句「我想你」，

  我又能撐一年。


  所以那些說劇情亂的人，我覺得也合理，

  在不同時區裡談戀愛，本來就亂，

  只是有人，亂著亂著就散了。


  --'
