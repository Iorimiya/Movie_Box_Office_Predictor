url: https://www.ptt.cc/bbs/movie/M.1760406362.A.8E5.html
title: '[討論] 他年她日不完美，但很有勇氣'
content: '老實說，

  《他年她日》不是一部容易看的電影，

  節奏亂、剪接急、台詞偶爾硬，

  配音也確實出戲。


  但我回頭想，

  這部片其實做了很多華語片不敢做的事。


  它用科幻包裝愛情，

  拿「時間流速不同」去比喻落差與等待。

  導演沒把故事說得漂亮，

  但他講了一個有勇氣的故事。


  許光漢這次不是完美帥哥，

  反而多了笨拙與疲憊的真實；

  袁澧林的眼神有時間差的重量，

  「光林CP」的互相消耗很動人。


  從產業角度來看，

  它不是最成功的作品，

  但也讓市場看到觀眾願意為概念買單。


  也許它不會成經典，

  但會讓之後的人敢再往前一步。


  大家覺得，

  華語片該不該多一點這種不怕被罵的作品 XD


  --'
