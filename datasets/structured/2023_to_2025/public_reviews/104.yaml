title: '[討論] 許光漢 x 袁澧林  《他年她日》 正式預告'
content: "『雖然我們的時間不一樣，但愛你的瞬間已註定永恆』\n\n大地震將世界一分為二，矗立於海中央的「重力牆」扭曲了兩邊的時間與重力，在「優日區」的一天，是「長年區」的一年。來自優日區的實習醫生安晴（袁澧林飾）在一次醫療任務中邂逅了長年區的薯仔（許光漢飾），當年她28歲，他只是個13歲的孩子。起初安晴當薯仔是個油嘴滑舌的小賊，薯仔卻早傾心於她。\n\
  \n對安晴來說，一天只是日常的延續，對薯仔而言，卻是一年的成長。在這場跨越時空的相遇中，薯仔的稚氣逐漸蛻變為堅定，而安晴的防備也慢慢融化成牽掛，隨著每一次重逢，兩人也成為了彼此最不捨的依戀。然而，大自然的巨變和重力與時間失衡下，他們的愛情真能無所畏懼嗎？一場刻骨銘心的奇幻愛戀即將啟程。\n\
  \n【他年她日】10月3日 中秋浪漫上映\n\n  監製｜張艾嘉\n  導演｜龔兆平\n  主演｜許光漢、袁澧林\n  出品及製作公司｜Red On Red\n\
  \  聯合出品公司｜影一製作所、能率影業、台灣大哥大MyVideo、一起娛樂、緯來電視網、甲上娛樂\n   全球發行宣傳｜甲上娛樂\n\n   【他年她日】由香港電影發展基金資助、文創產業發展處及香港特別行政區政府文化體育及旅遊局全力支持。\n\
  \n台詞怎麼有點棒讀感？\n但畫面看起來是蠻不錯的\n張艾嘉監製應該能期待一下\n-----\nSent from JPTT on my iPhone\n\n\
  --"
