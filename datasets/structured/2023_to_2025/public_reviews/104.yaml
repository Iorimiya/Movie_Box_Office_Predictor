url: https://www.ptt.cc/bbs/movie/M.1760516109.A.0D4.html
title: ' [討論]看不懂他年她日的或許可以看完再來給意見'
content: '我懷疑現在很多人連片尾彩蛋都坐不住，說爛的人，請先解釋一下那個時區設定，看不

  懂不是電影錯，是你太久沒專心愛過人。


  他年她日不算大片，但它的概念夠新，也不是那種吃爆米花笑一笑就算了的片，確實很看

  人，要嘛你感受不到，要嘛你被戳太深。


  不知道是題材對一般觀眾太挑戰還是現在大家真的太習慣快節奏了


  --'
