title: 長春事件 有深度的一部動漫紀錄片
content: '今天去A19喜樂看了這部電影，看比較少人分享心得，所以來分享影評。

  長春事件是一部描述中國大陸真實發生的動畫紀錄片，述說長春地區法輪功學員為突破

  中共抹黑式的一言堂新聞造遙，冒險透過電視插播的方式將真相影帶播放給收看電視的

  家家戶戶，因而被逮捕迫害。

  參與插播者的情操讓我想到黃華岡72烈士裡的林覺民，他們為了成就大我而奮不顧身，

  在受迫害下又能堅持信念的精神，令人感佩，是一部有深度又發人醒思的電影，值得一

  看。



  --'
