url: https://www.ptt.cc/bbs/movie/M.1748269099.A.D50.html
title: '[情報]《地下忍者》正式預告 6/20在台上映'
content: "《地下忍者》 正式預告。6/20 終將一戰\n\n\n\n☆豪華卡司《王者天下》山崎賢人、《哥吉拉-1.0》濱邊美波、《在大雪封閉的山莊裡》\n\
  間宮祥太朗、《原本以為只是手機掉了》白石麻衣、《BLUE GIANT 藍色巨星》岡山天音\n、《今際之國的闖關者》山本千尋、《問題物件》宮世琉彌\n\n☆最強綠葉《河畔小日子》室剛、《淺田家！》平田滿、《尋人啟弒》佐藤二朗、《正直\n\
  不動產》長谷川忍、《重啟人生》木南晴夏、《赤羽骨子的秘密保鑣》坂口涼太郎\n\n☆津田健次郎驚喜現聲\n\n☆上映首周榮登新片票房冠軍\n\n☆日本長據票房前10名達8周之久\n\
  \n☆累積票房突破日幣16億\n\n☆改編自花澤健吾於「Young Magazine」週刊連載之漫畫原著\n\n☆《銀魂》、《我是大哥大！！劇場版》、《聖☆哥傳》、《新解釋・三國志》導演福田\n\
  雄一最新力作\n\n☆主題曲《肌肉魔法使-MASHLE-》、《膽大黨》、《極度不妥》Creepy Nuts\n「doppelgänger」\n\n☆山崎賢人與鬼才導演福田雄一繼《齊木楠雄的災難》、《阿宅的戀愛太難》之後的第三\n\
  度合作\n\n☆濱邊美波首度與漫改小王子山崎賢人合作，也是首度進入福田組\n\n☆福田組雙雄室剛、佐藤二朗絕對要讓你笑到併軌\n\n☆美列布室剛、佛祖佐藤二朗，再加上阿紫木南晴夏，勇者義彥組合再添新火花\n\
  \n☆繼《在大雪封閉的山莊裡》之後，間宮祥太朗與岡山天音再度合作\n\n     第二次世界大戰後，日本因為戰敗而必須將忍者組織廢除，然而仍有為數20萬的忍\n\
  者隱藏在現代日本社會的各個角落，執行各種暗殺或秘密任務。這些忍者使用的忍術並非\n超能力或魔法，而是光學迷彩服和電擊棒等科技製品。\n\n     部分「精銳」忍者，在國家級的對抗中負責執行秘密任務，相當活躍。不過，另一\n\
  方面，下級忍者卻是經常拿不到工作，其中之一的雲隱九郎也一樣，過著宛如尼特族般的\n生活。他在歷經長期失業後，接下滲透進講談高中的任務… ..\n\n導演& 編劇｜福田雄一\n\
  原著｜ 花澤健吾\n主演｜ 山崎賢人《王者天下》&  濱邊美波《哥吉拉-1.0》\n2025｜日語｜中文字幕｜彩色｜123分鐘｜輔12級\n\n--"
