url: https://www.ptt.cc/bbs/movie/M.1750575577.A.00B.html
title: '[好雷] 地下忍者 值得一看～'
content: '剛看完有


  有三個日本人一起來看

  幾乎坐四成滿滿意外


  原作漫畫蠻喜歡他的風格跟調性

  而且動畫op超好聽


  這部開頭

  是打外國人

  九郎真的帥翻

  女主也變超正

  山田有把壓迫感演出來


  日常就是銀魂跟勇者的導演風格

  我是不太喜歡

  有一段蠻實驗性質

  那段有點好笑（但我還是沒笑）


  UN開始搞事節奏就變快

  而且蠻精彩

  打戲略輸浪人劍心

  但還是很精彩

  蠻喜歡忍者打架

  真的要幹到你死

  有少很多角色但劇情蠻順




  總體評價7/10

  值得一看


  後半段我可以給到9/10




  下面有劇透


  校園大屠殺也

  有把那個絕望感拍出來

  但沒有到很血腥


  小11的角色沒了閃電也沒了

  但九郎死法那麼憋屈了


  雖然九郎死之後劇情就普普

  但還是很想看第二集

  -----

  Sent from  on my iPhone


  --



  --

  結局有小改

  比較符合大眾'
