url: https://www.ptt.cc/bbs/movie/M.1711898766.A.49A.html
title: '[情報] 「地下忍者」真人電影化'
content: '＜アンダーニンジャ＞花沢健吾のマンガが実写映画化　公開時期、監督、キャストは“

  最高忍事機密”




  「アイアムアヒーロー」などで知られるマンガ家の花沢健吾さんのマンガ「アンダーニ

  ンジャ」が実写映画化されることが分かった。4月1日発売の連載誌「ヤングマガジン」

  （講談社）第18号で発表された。公開時期、監督、キャストなどは“最高忍事機密”と

  いい、詳細は今後、発表される。


  　同作は、戦後消滅したとされる忍者が現代でも暗躍している世界を舞台に、ニート同

  然の暮らしを送る末端の忍者・雲隠九郎がある重大な“忍務（にんむ）に身を投じてい

  く……というストーリー。


  　「ヤングマガジン」で2018年7月から連載中。全12話のテレビアニメが2023年10～12

  月に放送されたことも話題になった。


  ==========


  花澤健吾的漫畫「地下忍者」真人電影化

  上映時間、導演、CAST等資訊將於日後發表




  　在日本，

  　存在著世界上最龐大的暗殺組織──。


  曾經盛極一時的日本忍者，因為戰後ＧＨＱ強迫解散組織後消失無蹤。然而，事實上，

  忍者至今依舊暗中存在，人數據說多達20萬人。而且，部分「精銳」忍者，在國家級的

  對抗中負責執行秘密任務，相當活躍。不過，另一方面，下級忍者卻是經常拿不到工作，

  其中之一的雲隱九郎也一樣，過著宛如尼特族般的生活……


  --'
