url: https://www.ptt.cc/bbs/movie/M.1472305922.A.42F.html
title: '[好雷] 《真夏方程式》如水晶般閃亮的愛與罪咎'
content: '改編自日本推理教父東野圭吾暢銷著作的《破案天才伽利略：真夏方程式》，迥異於日劇

  中總是命案發生才找上門，這回福山雅治飾演的湯川學教授走出大學校園，來到濱海小鎮

  玻璃浦，協助研究海底礦物開發計畫。


  湯川在下榻的旅社「綠岩莊」，與小學生恭平一同被捲入一起命案──另一名房客，退休

  刑警塚原陳屍於附近的堤防下，由警視廳岸谷美砂奉命調查。以追求真理為興趣的湯川，

  慢慢發現旅社老闆川畑夫婦及致力保護海洋的女兒成實過去都有不為人知的秘密；他尋找

  著真相，卻並不急著以將犯人繩之以法為首要，而更重視謹慎地避免讓一個孩子的人生扭

  曲，這令本片的湯川學教授充滿溫暖的人味，也讓劇情在懸疑氣氛中，層層剝開無奈之舉

  背後深藏的愛。


  飾演恭平的山崎光表現亮眼，成熟又不失童真，似乎察覺了什麼時，那強忍淚水急著找尋

  博士問答案的樣子令人心疼。





  湯川學在日劇中一靠近小孩就會渾身發癢、蕁麻疹發作，但面對恭平卻出乎意料的沒有任

  何症狀。雖然一開始仍下意識討厭孩子，但在談話間發現恭平頗為聰明，再加上聽到他討

  厭理科，忍不住放下手邊無意義的工作來向他展現科學的厲害，並設法啟發他獨立思考。

  湯川這麼鼓勵著：都充滿了正向的教育意義。


  湯川很快便察覺恭平在無意間成了凶殺案的幫兇，卻在一起享用紙火鍋時，快速撥掉恭平

  想試驗的紙杯墊。他清楚這孩子總有一天會察覺自己做了什麼，瞬間溫柔地試圖延後那個

  時刻。因為這一次，摸索的過程將會很漫長，無法像製作水火箭一樣協助繪製明確的地圖

  ，恭平必須帶著這份掙扎成長；湯川慎重地讓他知道自己並不孤獨，也要求成實守護著恭

  平，未來他若問起，必須告訴他真相。





  父母親對子女的愛令人動容，不單是十多年前扛下刑責的生父仙波，數十年一直將成實視

  如己出的川畑重治同樣如此。為了不讓十多年前的真相曝光，影響女兒的自由及幸福，他

  不惜殺人；即使當湯川學將一切始末串起來，川畑重治在訊問室平和地否認了，並告解著

  ：「我從未對妻女有任何隱瞞，無論是痛苦還是難熬。至今仍然如此。」觀看著一切過程

  的成實，忍不住痛哭至涕淚俱下。


  比起兩位父親角色，母親相對較為軟弱，但這並不代表她的自責或關愛較輕微，她致力守

  住了川畑家的完整與幸福，直到紙再也包不住火。「成實，妳要好好吃飯噢！」母親輕笑

  著吐出的最後一句話舉重若輕，阻止了成實自首的意圖。


  愛的極致是什麼呢？或許，就是這樣拚了命、不顧一切為了對方犧牲奉獻的樣子吧！相信

  被三位長輩如此真心關愛著的成實，也將帶著這樣的力量守護恭平。


  看著片中美麗的玻璃浦海洋，即使酷夏觀賞也能獲得消暑的清涼。盛夏湛藍的海洋、斑斕

  的珊瑚與魚群、燦爛閃亮的煙火，畫面令人身歷其境地享受著日本夏季海邊，宛如置身海

  風中，品嘗著帶了淚水的鹹苦。真夏的豔陽下，有濃濃的愛在海面閃閃發亮著。




  --





  --'
