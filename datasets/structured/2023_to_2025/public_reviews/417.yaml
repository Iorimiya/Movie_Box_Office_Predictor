title: '[微負雷]阿部寬主演電影 犯罪直播 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這算下檔一陣子的電影了

  其實本來我看到預告的時候也想去電影院看

  不過有時間時已經下檔了 但是今天剛好有緣看到


  故事就如同預告所說,阿部寬在主持廣播節目的時候

  突然有觀眾CALL IN進來對時事政局發表不滿

  阿部寬以為這是惡作劇所以切掉電話 沒想到電廠居然真的爆炸...


  老實說這樣的展開真的引起我的興趣了

  但是該怎麼說呢...日本片的壞習慣? 或者虎頭蛇尾?

  總之最後的說教臭有夠濃厚的

  不到會想喊退錢的程度 但是會慶幸還好沒有花兩千日圓跑去電影院看的程度


  用我平常打分數的標準來評這部的話 100分我會給60分吧

  不會看第二次 不會特別推薦給人看

  但是如果真的沒東西看了勉強算能打發時間的作品(還算看得下去)


  片尾曲是PERFUME唱的 還挺好聽的


  --'
