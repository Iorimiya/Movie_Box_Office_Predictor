title: '[情報] 4/18【犯罪直播】中文預告'
content: '4/18【犯罪直播】中文預告




  ～改編自韓國賣座電影【恐怖攻擊直播】～


  日本人氣影帝 阿部寬 主演

  【飆速宅男】龍星涼

  【湯道】生見愛瑠

  【東京公園】井川遙


  當新聞變成談判籌碼，當播報變成生死抉擇

  這場獨家直播將震撼全日本！


  折本眞之輔（阿部寬 飾）原本是全國新聞節目《SHOWTIME 7》的人氣主播，卻突然因故

  被迫離開主播台，轉職為廣播電台的主持人。某天晚間七點，他突然接到一通「預告炸毀

  發電廠」的Call in電話，原本以為只是惡作劇，折本不甘示弱地回嗆了一句「要炸就快

  點炸！」沒想到不久後，遠處傳來一聲巨響，發電廠真的爆炸了！隨後，犯人再次Call

  in並指定折本為談判代表。眼看這正是重回主播台的大好機會，折本強行打斷正在播報中

  的新聞，坐上主播台和犯人現場連線對峙。殊不知，攝影棚內早已被安裝炸彈，稍有閃失

  ，所有人的性命都危在旦夕。眼看犯人的要求愈來愈多，隱藏的「陷阱」也一一浮出檯面

  ，他的目的究竟是什麼？這場世紀對峙正同步即時放送至全國！


  本片由獲獎無數、日本最具代表性的演員阿部寬擔任主演。還集結了龍星涼、生見愛瑠、

  井川遙、吉田鋼太郎等實力派的豪華卡司，以及一位重量級藝人擔任神秘的反派角色，一

  起被迫陷入無路可逃的困境！本片改編自韓國賣座電影【恐怖攻擊直播】，並加入了原創

  的情節，由【岸邊露伴一動也不動】系列的渡邊一貴執導及編劇！


  --'
