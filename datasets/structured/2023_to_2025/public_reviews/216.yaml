url: https://www.ptt.cc/bbs/movie/M.1745227810.A.E22.html
title: '[新聞] 【全知讀者視角】台版預告24H破百萬觀看!'
content: '新聞網址：



  轟動全球、網友狂熱！改編自超高人氣網路小說與網漫的電影《全知讀者視角》，正式吹

  響末日降臨的號角！台灣發行商「采昌國際多媒體」日前震撼釋出台灣版前導預告，短短

  24小時內即突破百萬觀看次數，強勢擠進今年台灣上映電影預告當中，最快破百萬觀看的

  行列之一，氣勢驚人！消息一曝光，隨即引爆各界熱烈關注與網路討論熱潮，甚至帶動原

  作WEBTOON網漫的點閱狂飆。網友們反應火熱，紛紛在社群留言、分享與熱烈討論，讓留

  言區瞬間化身成小說迷、漫迷、演員粉絲的大型集會所。前導預告更被狂讚「場景、美術

  、視效全都神還原！」精準重現原著中的末日氛圍，宛如小說世界直接搬上大銀幕！台灣

  片商對此熱烈回響也表達感謝：「這次預告釋出所引發的觀看與討論熱潮，遠遠超出我們

  原先預期，相信正式上映後，一定會掀起更大一波的現象級風暴！」《全知讀者視角》即

  將在7月於台灣盛大上映。





  話題之作《全知讀者視角》，由創下南韓千萬觀影紀錄的《與神同行》製作團隊重磅打造

  ，斥資高達300億韓圜（約新台幣6.2億元）的驚人製作預算，刷新今年韓國影壇最高製作

  成本紀錄，氣勢非凡。在日前釋出的台灣版前導預告當中，觀眾可見由安孝燮飾演的「金

  獨子」，作為唯一讀過網路小說《在滅亡的世界中存活的三種方法》的讀者，竟親眼目睹

  小說情節成真，整個世界陷入毀滅，讓他不得不憑藉自己對劇情走向的深刻理解，與李敏

  鎬飾演的小說主角「劉眾赫」並肩作戰，對抗未知災難，並改寫自己的命運與世界的結局

  。預告搭配磅礡配樂與極具衝擊力的高規格特效，搭配忠實還原的末日場景與震撼畫面，

  加上全球頂尖演員華麗登場，瞬間點燃粉絲熱情。許多網友不僅熱烈討論角色扮相，更忍

  不住展開「劇情猜想大賽」，直呼：「光是預告就讓人起雞皮疙瘩，正片絕對要衝首映！

  」、「角色出場全都氣場爆棚，場景還原度超乎想像！」





  更加讓人驚豔的是，這支台灣版前導預告不只成功重現原著世界觀，更以震撼視覺特效與

  緊湊戲劇張力，在網路上引爆一波瘋傳狂潮。預告上線短短24小時內，便在片商的

  Facebook、Instagram、Threads等社群平台總觀看數突破100萬次，成為近期最受矚目的

  電影預告之一，強勢印證本片的話題性與驚人票房潛力。據悉，已經有熱情觀眾主動號召

  親友與影迷準備包場觀賞，氣勢直逼年度大片等級。對於這波空前反響，台灣發行商「采

  昌國際多媒體」也再度表達感謝與期待：「這部作品自小說時期便累積龐大粉絲基礎，我

  們原本就預期會引發話題，但這次預告在短短24小時內就突破百萬觀看數，已經遠遠超出

  預期。這也充分證明本片的跨世代魅力無遠弗屆。敬請粉絲們密切關注後續更多資訊，我

  們相信正式上映後，絕對會帶來更強烈的現象級震撼！」



  這部即將成為今年暑假最具爆發力與討論度的話題大片《全知讀者視角》，即將在今年7

  月於全台盛大上映。本片劇情描述平凡上班族金獨子（安孝燮飾演），唯一嗜好是閱讀網

  路小說《在滅亡的世界中存活的三種方法》，不過在長達十年的連載期間，他卻是這個小

  說的唯一讀者。當金獨子在地鐵車廂讀完小說最終話時，小說中的場景卻轉瞬成為現實。

  地鐵車廂彷彿成為人間煉獄，巨大怪物正踐踏著這座城市，以及憑空出現在眼前的訊息－

  －「您收到了第一個主線任務。」緊接著，熟悉的小說角色紛紛登場，而那個無比強大、

  牽動著整個世界命運的小說主角劉眾赫（李敏鎬飾演），開始照著劇情一一行動。眼看熟

  悉的世界將不復返，一個嶄新的世界正在誕生，身為唯一知曉這個新世界結局的金獨子，

  將在升級自身能力的同時，打造出與原本小說截然不同的結局…。



