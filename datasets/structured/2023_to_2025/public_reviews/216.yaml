title: '[新聞] 【全知讀者視角】卡司齊聚揭電影神祕面紗'
content: '新聞網址：



  改編超人氣網路小說與網路漫畫，由《與神同行》金牌製作團隊斥資300億韓圜（約新台

  幣6.2億元）天價打造，以今年韓影最大場面、大動作、大特效、大卡司引爆全球觀眾熱

  烈期盼的奇幻動作鉅作《全知讀者視角》，即將在7月23日（週三）晚場起於台灣盛大上

  映。本片昨日（6/17）在首爾舉辦首場製作發表會，導演金秉祐率領主要演員安孝燮、李

  敏鎬、蔡秀彬、申承浩、NANA等眾星齊聚一堂，分享拍攝過程與對本片的熱情投入。即使

  「BLACKPINK」成員JISOO因為世界巡演無法出席，導演也特別點名讚賞：「我對她的表現

  非常滿意」。





  《全知讀者視角》改編自超人氣同名網路小說與網路漫畫。原作被譽為「最想被改編成影

  像作品」卻也「最難被影像化」的奇幻之作，故事講述平凡上班族「金獨子」，突然發現

  自己閱讀十年的小說世界在眼前成真，讓他必須在世界崩壞的浩劫當中，與小說主角「劉

  眾赫」與夥伴們攜手奮戰，努力追尋自己心中的理想結局。本片呈現出壯闊的世界觀與人

  性糾葛，也被視為南韓影史最具野心與挑戰性的改編，如今終於在《與神同行》金牌製作

  團隊與《恐怖攻擊直播》導演金秉祐，以及國際級知名卡司的攜手打造下，讓這場「小說

  成真」的壯闊奇幻正式躍上大銀幕。作為原作忠實讀者的導演金秉祐分享：「我們一邊努

  力維持作者的意圖與樂趣，一邊根據電影的敘事方式，進行必要的修改和重構。」他分享

  改編過程：「如何將現實與奇幻以合適比例混搭，並在每個場景轉換中進行調整，是我和

  全體工作人員感到最艱難與敏感的部分。我們決定更集中在現實層面，讓觀眾意識到『這

  不是遙遠世界的故事，而是發生在我們身邊的事情。』這對維持電影的緊張感至關重要。

  」



  尤其本片集結兩大男神安孝燮與李敏鎬同台飆戲，更是讓粉絲們興奮不已，不過這也讓首

  度擔任電影主演的安孝燮坦言：「說沒有壓力是騙人的，我必須盡可能地全力以赴，演繹

  金獨子這個角色。」他形容金獨子是「任何人身邊都可能會出現的平凡人」，並透露自己

  不斷揣摩角色面對世界崩壞的情緒：「獨子希望改變小說結局，也希望來到一個所有人都

  能共存的世界。但若真的面對這種情況，自己能否真正採取行動，是我一直以來思考的地

  方。我努力揣摩那種情緒，並與導演反覆討論每項細節來打磨角色。」他也笑稱自己有大

  量奔跑戲，因此得來意外收穫：「我跑得更快了。」至於睽違十年再度回歸大銀幕的李敏

  鎬，這回詮釋擁有回歸技能、經歷無數次重啟人生的「劉眾赫」。他感性表示：「我認為

  每個人在人生當中，都背負著屬於自己的價值與重擔，劉眾赫也一樣。」他並透露接演原

  因：「透過人與人之間的聯繫獲得力量，是當代社會最需要的事情。在這個個人化、孤立

  化傾向愈發明顯的現代社會，攜手克服逆境是當代人所需要的正能量，我相信本片一定會

  讓觀眾有所感觸。」





  蔡秀彬則飾演面對小說成真、仍能做出最理性判斷、最貼近現實的「劉尚雅」，將以獨特

  的親和力與活潑魅力強化角色說服力。她表示：「尚雅在原作中比較偏向卡通感人物，而

  電影則是能夠更現實去接受和判斷情況的角色，所以我擔心在角色們都一起往前衝的時候

  ，自己卻一直踩剎車，會不會因此有點掃興，所以針對這點和導演進行許多討論，努力找

  出中間值。」而以《18歲的瞬間》等作品廣為觀眾熟知的申承浩，飾演以強大力量和防禦

  能力，在危急時刻守護夥伴的軍人「李賢成」，尤其他將強大體魄、克制動作等優點昇華

  到角色當中，展現出迷人演技，他表示：「他是如同岩石般堅毅的人物，我努力在外形上

  展現出他的力量，也尋找與我相似的地方，並融合我身為演員的優勢去展現。」



  NANA則在片中化身被獨子搭救，進而為正義而戰的「鄭熙媛」一角，也是她首度接演動作

  戲，她表示：「收到劇本前，我就對導演的作品很有信心，加上還有《與神同行》製作團

  隊，所以對大家可以出色完成作品感到放心。」她並補充：「我一直想拍真正的動作片，

  這次總算如願。或許因為我有偶像出身的經驗，用身體表演讓我特別投入，也讓我更想成

  為動作演員。」至於在片中飾演崇拜劉眾赫，並視他為師父的高中生「李智慧」，則由天

  團「BLACKPINK」成員JISOO演繹，將以生動表現為全片增添活力。雖然她昨日因為世界巡

  演無法出席活動，導演也特別點名讚賞：「我想找一位能吸引觀眾目光的演員，JISOO一

  加入劇組，就展現極高的投入與熱誠，我對她的表現非常滿意。」



  這部改編自轟動全球奇幻IP大作，斥資300億韓圜年度最高預算打造，以別出心裁的劇情

  設定，搭配全球火紅的知名影星，成為觀眾引頸期盼的劃時代「東方奇幻」代表作的《全

  知讀者視角》，即將在7月23日（週三）晚場起於全台盛大獻映。本片劇情描述平凡上班

  族金獨子（安孝燮飾演），唯一嗜好是閱讀網路小說《在滅亡的世界中存活的三種方法》

  ，不過在長達十年的連載期間，他卻是這個小說的唯一讀者。當金獨子在地鐵車廂讀完小

  說最終話時，小說中的場景卻轉瞬成為現實。地鐵車廂彷彿成為人間煉獄，巨大怪物正踐

  踏著這座城市，以及憑空出現在眼前的訊息－－「您收到了第一個主線任務。」緊接著，

  熟悉的小說角色紛紛登場，而那個無比強大、牽動著整個世界命運的小說主角劉眾赫（李

  敏鎬飾演），開始照著劇情一一行動。眼看熟悉的世界將不復返，一個嶄新的世界正在誕

  生，身為唯一知曉這個新世界結局的金獨子，將在升級自身能力的同時，打造出與原本小

  說截然不同的結局…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
