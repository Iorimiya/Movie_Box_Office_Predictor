title: '[新聞] 【全知讀者視角】全台票房12天飆破5500萬'
content: '新聞網址：



  年度韓影霸主《全知讀者視角》，自台灣上映以來，話題不斷、熱度破表，不僅橫掃各大

  社群平台討論，更強勢超車多部好萊塢大片，連續兩週奪下LINE TODAY自7月21日至8月3

  日的「電影聲量榜」冠軍。票房表現同樣驚人，上映短短11天（截至8/2）即突破5000萬

  ，截至昨日（8/3）更已突破5500萬，持續穩坐「年度最賣座韓片」寶座，氣勢如虹！片

  中，安孝燮與李敏鎬精彩絕倫的對峙場面令觀眾目不轉睛，兩位男神的同框火花更成為影

  迷熱議焦點。安孝燮在受訪時，坦言自己就如片中所飾演、崇拜小說主角的「金獨子」一

  般，從小便將飾演「劉眾赫」的李敏鎬視為「如英雄般的偶像」，發自內心地敬佩。更讓

  佩服的是，兩人甚至親自上陣，挑戰片中高難度動作戲，無懼受傷風險，展現專業與敬業

  態度。而這背後，竟埋藏一個讓人哭笑不得的「現實理由」──就因為兩人身高太高，竟

  然找不到合適的替身演員，只能硬著頭皮親自上陣！既無奈又讓人會心一笑。





  年度話題韓片《全知讀者視角》，兩大男神安孝燮與李敏鎬不僅要在片中奔跑、耍劍、

  墜落，還要吊鋼絲，動作場面密集又耗體力，幾乎沒有喘息空間，安孝燮更坦言一度跑到

  腿軟。近日兩人上廣播節目《李恩智的歌謠廣場》宣傳時，李敏鎬透露大概從開拍兩個月

  前，就開始接受動作訓練，並透露自己不得不親自完成所有動作戲，就因為背後有個「非

  常現實的理由」，笑翻全場觀眾。細究原因，原來是當安孝燮被問到除了動作訓練外，還

  投入哪些努力時，安孝燮表示：「由演員親自上場拍攝的話，在畫面上會比較自然，不會

  顯得突兀。所以只要是導演要求的部分，我基本上都會自己完成，加上我自己很有熱情，

  所以拍起來很有趣。」對此，李敏鎬揭露了另類事實：「其實像孝燮這樣身材條件太好（

  太高）的演員，是找不到替身的，只能自己上，因為他真的太高了。」透露了高個子演員

  在拍攝動作戲時的「辛酸事實」。



  李敏鎬也笑說：「其實我也是這種情況。因為個子高的替身演員很少，而且身形、線條一

  看就知道是不是本人。所以只要是有點上進心的演員，大部分都會選擇親自完成。」儘管

  敬業親上火線，傷痛還是在所難免。當被問到拍攝過程是否平安無事時，李敏鎬笑說：「

  大家或多或少都有點小傷啦。」至於傷在哪裡？他幽默回應：「我不想讓我們的辛苦，變

  成大家多買一張票的理由，這些小傷就讓它們默默埋藏吧！」





  除了精采的劇情與動作場面，《全知讀者視角》安孝燮與李敏鎬的互動，更是讓影迷津津

  樂道。有趣的是，他們在片中的角色關係，竟與現實中的兩人，有著令人玩味的巧妙呼應

  。安孝燮透露，兩人早在十年前就曾屬同一間經紀公司，這次再度合作，可說是久別重逢

  。在本片當中，他所飾演的「金獨子」，對李敏鎬飾演的「劉眾赫」懷有深深敬仰之情；

  現實中，他也對李敏鎬有著相似的情感：「敏鎬哥一見到我就很自然地、就像昨天才見過

  面一樣，親切地問我『吃飯了嗎？』那種自在感真的讓我很舒服也很感動。」安孝燮坦言

  ，從小就是看著李敏鎬的作品長大，內心早已將他視為偶像：「對我來說，哥真的是『我

  的明星』。我想對獨子來說，劉眾赫應該也是那樣的存在吧──我的英雄、我想成為的偶

  像。」這份情感，甚至還成為安孝燮演出時的重要靈感來源：「因為感受真的很接近，所

  以當我詮釋金獨子時，也能自然而然地把那種情感帶進角色當中。我常常把這些話直接告

  訴他，真的很感謝能跟他再度合作。」



  這部斥資300億韓圜（約新台幣6.2億元）年度最高預算打造，以別出心裁的劇情設定，搭

  配全球火紅的知名影星，成為觀眾引頸期盼的劃時代「東方奇幻」代表作的《全知讀者視

  角》，2D、4DX、杜比影院多版本，目前持續在台熱映當中。片商今日（8/4）也公佈「第

  三週戲院特典」，只要購買本片第三週（8/8-8/14）期間場次電影票乙張，即可憑電影票

  在8月8日起，至原購票影城兌換領取「原文角色小卡」乙張（隨機），數量有限，送完為

  止。本片劇情描述平凡上班族金獨子（安孝燮飾演），唯一嗜好是閱讀網路小說《在滅亡

  的世界中存活的三種方法》，不過在長達十年的連載期間，他卻成為小說最後的唯一讀者

  。當金獨子在地鐵車廂讀完小說最終話時，小說中的場景卻轉瞬成為現實。地鐵車廂彷彿

  成為人間煉獄，巨大怪物正踐踏著這座城市，以及憑空出現在眼前的訊息－－「您收到了

  第一個主線任務。」緊接著，熟悉的小說角色紛紛登場，而那位無比強大、牽動著整個世

  界命運的小說主角劉眾赫（李敏鎬飾演），開始照著劇情一一行動。眼看熟悉的世界將不

  復返，一個嶄新的世界正在誕生，身為唯一知曉這個新世界結局的金獨子，將在升級自身

  能力的同時，與夥伴們打造出跟原本小說截然不同的結局…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
