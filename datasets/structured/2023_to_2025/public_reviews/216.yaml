title: '[新聞] 【全知讀者視角】4DX+杜比全景聲同步台映'
content: '新聞網址：


  《全知讀者視角》上《驚六》爆笑宣傳  4DX＋杜比雙版本同步台映


  改編全球現象級網路小說，由《與神同行》金牌製作團隊傾力打造，以大場面、大動作、

  大特效、大卡司引爆觀眾熱烈期待的奇幻動作鉅獻《全知讀者視角》，除了2D版本之外，

  台灣也確定在7月23日（週三）晚場起，同步上映4DX與杜比全景聲（Dolby Atmos）兩大

  特殊規格版本，並同步公開氣勢磅礡的4DX海報，直觀展現4DX優勢。另一方面，主要演員

  群近期也展開「全知宣傳視角」，積極參與各大節目與訪問，更作客上週六（7/19）播出

  的人氣綜藝《驚人的星期六》，在節目上大玩「歌詞聽寫」與「零食遊戲」等人氣環節。

  睽違六年再上該節目的安孝燮，壓力大到一直搧風、喝水解除緊張情緒，比任何來賓都認

  真的表情和慌亂的模樣，讓人忍俊不禁。



  水花炸裂、座椅狂震　　《全知讀者視角》4DX＋杜比全景聲同映

  　　

  被譽為「年度韓影霸主」的《全知讀者視角》，講述一部連載多年的小說，故事在完結當

  天竟離奇成真。唯一堅持看到結局的讀者「金獨子」，被迫與小說中的主角「劉眾赫」等

  人聯手，在崩壞的末日世界中絕地求生。在今日（7/21）最新曝光的4DX海報當中，透過

  魚龍掠過坍塌的東湖大橋場面，讓觀眾身臨其境體驗全片的奇幻世界。水花四濺、橋樑斷

  裂、被捲入湖中的巨大碰撞瞬間，濃縮成一個畫面，讓觀眾的緊張情緒達到顛峰。


  4DX版的《全知讀者視角》將在不同場景，透過影廳內的不同效果撼動觀眾所有感官，在

  關鍵場面（例如地鐵翻車場景和怪物出現）當中，整個座椅都會搖晃，並隨著角色的動作

  ，展現出充滿節奏感的震動。配合4DX的逼真效果，營造出彷彿置身電影劇情當中的沉浸

  式劇場體驗。至於同步上映的杜比全景聲（Dolby Atmos）版本，將更真實且準確地呈現

  出各場景聲音，以不同層次的清晰音效，以更具爆發力的力度，展現出電影的動作場面。

  讓觀眾的選擇範圍也獲得極大拓展，得以根據自己的觀影喜好，以各種不同形式欣賞主角

  們的精彩旅程。



  演技太好也困擾？！  《全知》演員群上《驚六》全被懷疑是臥底


  另一方面，《全知讀者視角》主要演員安孝燮、蔡秀彬、申承浩、Nana也積極宣傳打片，

  並作客上週六（7/19）播出的人氣綜藝節目《驚人的星期六》（簡稱《驚六》），展現各

  自的綜藝實力。四人透過「歌詞聽寫」與「零食遊戲」等遊戲環節，為觀眾帶來意想不到

  的反轉與笑料。尤其安孝燮一出場就不斷受到懷疑，成為歌詞聽寫遊戲的臥底關鍵人物，

  讓人感到好奇。尤其這是安孝燮時隔六年再度演出該節目，他表示六年前首次亮相因為壓

  力太大，覺得自己並沒有表現太好。而這次二度登上該節目，依然難掩緊張情緒，不斷用

  筆記本搧風，過程也一直在喝水緩解緊張情緒；也因為他演技精湛，過程數度被固定班底

  們懷疑是臥底，只見他用堅定語氣表示：「我不是臥底！」巧妙避開了嫌移目標，時而比

  任何人都認真的表情，時而裝作不在意，努力保持一張撲克臉的模樣，也讓人忍俊不禁。



  除了安孝燮外，其他三位演員也發揮各自魅力，蔡秀彬在過程中因為太安靜，一度被懷疑

  是臥底，她為自己辯白說：「真的很抱歉，但大家都知道我很不擅長綜藝，應該不會讓我

  當臥底吧？我真的很抱歉。」誠懇的道歉竟讓在場所有人都跟著感到歹勢，固定班底KEY

  （SHINee）甚至一度為她求情：「就算她是臥底也先不要殺她吧！」金東炫則堅稱蔡秀彬

  在說謊：「她可是擅長演戲的人啊！」而一年前曾在同節目被「誤導」為臥底而落下男兒

  淚的申承浩，這次又被列為嫌疑人，讓他流露無奈情緒表示：「看來我這輩子都不能再來

  《驚六》了！」另一方面，NANA則以無法識破的行動擾亂眾人推理，而她無法看透的「撲

  克臉」卻讓現場陷入更混亂局面，讓人更加好奇她最後的身份究竟是什麼。



  這部斥資300億韓圜年度最高預算打造，以別出心裁的劇情設定，搭配全球火紅的知名影

  星，成為觀眾引頸期盼的劃時代「東方奇幻」代表作的《全知讀者視角》，即將在本週三

  （7/23）晚場起於全台盛大獻映。原著漫畫由韓國人氣網路小說改編，至今在台灣累積觀

  看次數高達1.1億，並榮登2024年度十大人氣榜第二名，評分高達9.9分。目前《全知讀者

  視角》漫畫正於LINE WEBTOON平台每週一火熱連載中，漫畫連結：

  。本片劇情描述平凡上班族金獨子（安孝

  燮飾演），唯一嗜好是閱讀網路小說《在滅亡的世界中存活的三種方法》，不過在長達十

  年的連載期間，他卻成為小說最後的唯一讀者。當金獨子在地鐵車廂讀完小說最終話時，

  小說中的場景卻轉瞬成為現實。地鐵車廂彷彿成為人間煉獄，巨大怪物正踐踏著這座城市

  ，以及憑空出現在眼前的訊息－－「您收到了第一個主線任務。」緊接著，熟悉的小說角

  色紛紛登場，而那位無比強大、牽動著整個世界命運的小說主角劉眾赫（李敏鎬飾演），

  開始照著劇情一一行動。眼看熟悉的世界將不復返，一個嶄新的世界正在誕生，身為唯一

  知曉這個新世界結局的金獨子，將在升級自身能力的同時，與夥伴們打造出跟原本小說截

  然不同的結局…。



