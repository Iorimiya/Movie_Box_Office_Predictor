url: https://www.ptt.cc/bbs/movie/M.1744802223.A.80C.html
title: '[新聞] 采昌國際參與【全知讀者視角】投資與製作'
content: '新聞網址：



  轟動全球、萬眾矚目的超大型奇幻動作鉅獻《全知讀者視角》，由創下南韓千萬觀影紀錄

  的《與神同行》製作團隊，斥資300億韓圜（約新台幣6.2億元）天價打造，成為今年至今

  南韓影壇的最高預算之作。本片從開拍以來就話題不斷，深受原著小說與漫畫粉絲高度期

  待，如今正式宣布由「采昌國際多媒體」代理台灣地區發行，預計將在今年7月於全台盛

  大上映。今日（4/16）同步釋出台灣首波概念海報與前導預告，並重磅曝光包括安孝燮、

  李敏鎬、蔡秀彬、申承浩、NANA，以及BLACKPINK成員JISOO等卡司陣容。全片融合神話、

  星座、文學與動作等奇幻元素，配合頂級製作團隊精心打造，有望成為繼《與神同行》之

  後，再度刷新台灣影史票房紀錄的現象級之作，成為新一代「東方奇幻」代表作。值得一

  提的是，擁有豐富國際影視作品發行經驗的采昌國際多媒體，本次更跨足南韓大型製作，

  參與本片投資與製作。憑藉對亞洲市場的敏銳眼光，以及國際級製片資源整合能力，采昌

  不僅見證南韓影壇的大膽創新，更攜手製作團隊共創亞洲電影嶄新里程碑，展現台灣電影

  發行公司躍上世界舞台的實力與企圖心。





  由南韓知名作家sing N song創作、風靡全球的奇幻網路小說《全知讀者視角》，即將躍

  上大銀幕，改編成為史無前例的超大型奇幻動作鉅片！本片故事描述一部連載十年的小說

  ，在完結篇公開當天，小說中的虛構世界竟然在現實生活成真，而唯一通篇閱讀過的忠實

  讀者「金獨子」，將與小說主角「劉眾赫」與夥伴們，在末日般的世界中展開驚心動魄的

  求生冒險。這部被譽為「必看神作」的火紅IP奇幻小說，已經在全球累積超過3.6億閱覽

  數，同名網漫更突破19億閱覽紀錄，並在南韓NAVER WEBTOON上斬獲9.9近滿分超高好評，

  掀起海內外漫迷與書迷熱潮，堪稱奇幻文學界的巔峰之作。本次的改編電影版，更由締造

  千萬觀影傳奇的《與神同行》製作團隊集結，傾全力打造這部斥資高達300億韓圜（約新

  台幣6.2億元）的年度鉅作，甚至超越過往《與神同行》、《屍速列車》、《緊急迫降》

  、《白頭山：半島浩劫》等商業大片的預算規模，成為今年至今南韓影壇的最高製作預算

  電影，也被業界寄予厚望，視為有望振興影壇與票房的救世之作！



  本片劇情結合神話、星座、文學與動作等多重奇幻元素，打造出涵蓋人界、星座界、鬼怪

  界的沉浸式世界觀，風格獨樹一幟、視野宏大。由《恐怖攻擊直播》導演金秉佑掌鏡執導

  ，以高超的敘事手法與視覺語言，成功將原著龐大的世界觀搬上大銀幕，實現眾多粉絲夢

  寐以求的大銀幕視覺奇觀。此外，演員陣容更堪稱夢幻組合，由《社內相親》安孝燮、《

  藍色海洋的傳說》李敏鎬領銜主演，攜手《現在撥打的電話》蔡秀彬、《還魂》申承浩、

  《假面女郎》NANA，以及「BLACKPINK」超人氣成員JISOO華麗共演，讓本片不僅將成為粉

  絲心中的殿堂級神作，也勢必成為全球觀眾引頸期盼的劃時代「東方奇幻」代表作品。本

  片預計今年7月全台震撼上映，勢必引爆觀影熱潮，再創台灣影史票房新巔峰！






  台灣片商今日（4/16）也盛大曝光《全知讀者視角》首波概念海報與前導預告。在概念海

  報當中，已然崩塌的「東湖大橋」橫亙在廢墟與濃煙之中，唯一知曉所有狀況的「金獨子

  」，與小說中英勇登場的「劉眾赫」，兩位主角在猶如末世般的景象下展開命運般對峙，

  強烈的視覺張力瞬間攫住觀眾目光，猶如史詩般的對決序幕由此揭開。而在前導預告當中

  ，只見鏡頭從一輛靜止在東湖大橋中央的地鐵列車拉開序幕，車廂內混亂不安的氣氛迎面

  而來。由安孝燮飾演的金獨子，以驚慌失措的眼神，呈現出對現實崩壞的第一時間反應，

  緊接著「小說世界，成為現實」的驚悚真相逐步浮現，因為他逐漸意識到，自己熟讀十年

  的小說劇情，隨著東湖大橋轟然坍塌、地鐵乘客驚聲尖叫，以及小說中登場的巨大怪物迎

  面襲來，一幕幕現實與虛構交錯的末日世界，就在眼前依序發生。此外，預告中同步曝光

  的豪華卡司也令人血脈賁張，不僅完美還原原著人物氣質，更以強烈的戲劇張力與視覺效

  果為全片注入靈魂，讓原著小說迷與漫迷直呼：「這就是我心中《全知讀者視角》該有的

  樣子！」



  這部改編自轟動全球奇幻IP大作，斥資300億韓圜年度最高預算打造，以別出心裁的劇情

  設定，搭配全球火紅的知名影星，成為觀眾引頸期盼的劃時代「東方奇幻」代表作的《全

  知讀者視角》，即將在今年7月於全台盛大上映。本片劇情描述平凡上班族金獨子（安孝

  燮飾演），唯一嗜好是閱讀網路小說《在滅亡的世界中存活的三種方法》，不過在長達十

  年的連載期間，他卻是這個小說的唯一讀者。當金獨子在地鐵車廂讀完小說最終話時，小

  說中的場景卻轉瞬成為現實。地鐵車廂彷彿成為人間煉獄，巨大怪物正踐踏著這座城市，

  以及憑空出現在眼前的訊息－－「您收到了第一個主線任務。」緊接著，熟悉的小說角色

  紛紛登場，而那個無比強大、牽動著整個世界命運的小說主角劉眾赫（李敏鎬飾演），開

  始照著劇情一一行動。眼看熟悉的世界將不復返，一個嶄新的世界正在誕生，身為唯一知

  曉這個新世界結局的金獨子，將在升級自身能力的同時，打造出與原本小說截然不同的結

  局…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
