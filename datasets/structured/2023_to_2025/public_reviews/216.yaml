title: '[情報] 【全知讀者視角】台灣官方正式預告'
content: '小說世界，成為現實

  【#全知讀者視角】7月23日（三）晚場起，全台戲院見！


  必看理由！

  【與神同行】製作團隊，斥資300億韓圜，打造年度最高製作預算鉅作！

  同名網路小說全球超過3.6億閱覽數！不容錯過的奇幻IP大作！

  同名網漫全球超過19億閱覽數，南韓 NAVER Webtoon達9.9近滿分好評！


  安孝燮x李敏鎬x蔡秀彬x申承浩xNANAxJISOO領銜主演！


  ‧劇情簡介

  平凡上班族金獨子（安孝燮飾演），唯一嗜好是閱讀網路小說《在滅亡的世界中存活的三

  種方法》，不過在長達十年的連載期間，他卻是這個小說的唯一讀者。當金獨子在地鐵車

  廂讀完小說最終話時，小說中的場景卻轉瞬成為現實。地鐵車廂彷彿成為人間煉獄，巨大

  怪物正踐踏著這座城市，以及憑空出現在眼前的訊息一一「您收到了第一個主線任務。」

  緊接著，熟悉的小說角色紛紛登場，而那個無比強大、牽動著整個世界命運的小說主角劉

  眾赫（李敏鎬飾演），開始照著劇情一一行動。眼看熟悉的世界將不復返，一個嶄新的世

  界正在誕生，身為唯一知曉這個新世界結局的金獨子，將在升級自身能力的同時，打造出

  與原本小說截然不同的結局…。


