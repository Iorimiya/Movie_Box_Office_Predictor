url: https://www.ptt.cc/bbs/movie/M.1685362526.A.76F.html
title: '[情報] 蔡秀彬加盟人氣漫改電影《全知讀者視角》'
content: '蔡秀彬加盟人氣漫改電影《全知讀者視角》有望與「雙男神」安孝燮&李敏鎬合作！


  Kpop News By Rita Pak on 26 May 2023 Digital Editor Advertisement




  繼前陣子傳出人氣網路作品《全知讀者視角》將影視化後就備受大家關注，而日前也有消

  息指出安孝燮與李敏鎬收到了該部電影的出演提案。今日(5/26)據韓媒報導，蔡秀彬也收

  到了出演提案有望與兩大長腿男神合作！


  26日，據韓媒報導，蔡秀彬收到電影《全知讀者視角》的邀約，隨後安孝燮與蔡秀彬所屬

  經紀公司也回復說：「收到電影的出演提案後正在協調與討論中」而李敏鎬的經紀公司則

  回覆「是收到提議的作品之一，目前尚未確定」。


  電影《全知讀者視角》改編自網路人氣作品電影



  《全知讀者視角》原先是在2018年時先以小說問世，後來知名度大開於是推出了漫畫版。

  內容是以小說內容為開端，某天世界變成男主角「金獨子」讀過的網絡小說一般，為了拯

  救世界他攜手「劉眾赫」等夥伴，與支配世界的系統及敵人對抗的故事，當中比起愛情線

  ，更多的是作戰隊友之間的情感描寫。


  蔡秀彬有望飾演性格細膩、待人關懷，在同伴中有著冷靜的領導能力的「柳尚雅」，是金

  獨子在Minosoft的同期同事，已經晉升為正式員工。


  蔡秀彬有望飾演「柳尚雅」



  安孝燮有望飾演「金獨子」，是遊戲公司Minosoft測評部門的實習生。業餘愛好是讀小説

  ，某天他喜歡的冷門小説《在滅亡的世界中存活的三種方法》在即將完結時，小説的滅亡

  世界忽然變成了現實，於是他利用對這本小說的了解迅速掌握情況，與小說主人公「劉眾

  赫」等人試圖挽回被改變的世界；李敏鎬則有望飾演《在滅亡的世界中存活的三種方法》

  小說中的主角「劉眾赫」


  《全知讀者視角》有望由李敏鎬、安孝燮出演雙男主



  《全知讀者視角》將由電影《恐怖攻擊直播》的金秉祐導演執導，《與神同行》製作公司

  也將參與其中， 目前正在進行主要選角工作，準備在今年內開拍。


  --'
