url: https://www.ptt.cc/bbs/movie/M.1755431417.A.F72.html
title: '[好雷] 全知讀者視角 看過原作'
content: '雷文防雷資訊頁




  看過原作 1-12集都有買電子書


  但不算是原作粉


  我覺得魔界之春之後就亂七八糟


  後面都在套路 重複同樣的SOP


  完全是用想看結局的方式勉強看完



  以下是電影感想(防雷)


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  這本小說前期我覺得是相當精彩


  因此聽說要改成電影 當初就非常期待


  畢竟前面也是最好表現的 後來電影也讓我滿喜歡的



  裡面有修改許多東西


  1.小正太


  變成一個超不可愛的怪小孩 呃


  是沒有別的昆蟲了嗎 有些更可愛的東西吧 小強這段讓人最倒彈


  帶小朋友去看的 小朋友出來後說覺得他超噁心(倒地)




  2.李智慧


  原作中能力就比較局限 不太有存在感


  可以理解為什麼要改成狙擊手 因為不狙很難插入在第一局的戰鬥中


  拿武士刀什麼的傳統刀劍又會明顯跟雙主角重複


  算是不得不的改吧




  3.劉尚雅


  完全忘了原作中她能做什麼了 變蜘蛛人也不錯


  讓戰鬥畫面更好看俐落很多




  4.金獨子


  我自己沒有太多注意到他個性被改的地方


  因為小說裡面本來就有點跳 但反正跟劉眾赫有演出雙主角的感覺 就覺得可以了


  唯一讓我出戲的是他寫信給作者


  這個真的改有點大 然後作者身份本身又是大伏筆 可以理解原作粉的不爽


  但那一幕以客觀角度來說 "改變結局"還滿燃的~


  我覺得反正電影也不可能拍到那麼後面 這樣改也可以接受


  能自圓其說就好



  5.孔弼斗


  他的能力為什麼變這樣 這個有點傻眼



  6.鄭熙媛


  帥的要命 完全符合原作中給人的想像





  看完覺得是部很棒的商業爽片


  雖然設定上等級和強弱、能力和COIN都比較亂 但這是原作中就有的問題


  我覺得拍得算是讓一般人容易理解和融入(步調還是偏快就是)


  至少畫面賞心悅目


  好人(主角)都很帥很美 壞蛋都很醜 或都是怪物


  我就是要看這樣的爽片!!



  --'
