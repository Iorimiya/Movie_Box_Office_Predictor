url: https://www.ptt.cc/bbs/movie/M.1754755468.A.CAA.html
title: '[好雷]  感動又過癮的全知讀者視角'
content: '雖然聽很多看過原著的人覺得改編得很爛，但是我覺得好好看！


  金獨子的背景，跟夥伴的情誼，還有跟劉眾赫的羈絆(誤)，都呈現得很好！


  鼻荊好可愛～～～


  吉永好可愛～～～～

  (為什麼好多人寫成永吉，害我以為我記錯XD)


  尚雅的人設稍微有更動，但是更接近普通人了，我很喜歡。


  鄭熙媛跟李賢誠，還有李智慧的人設也立得穩穩的，很安心。


  整個調整讓大家在最後的同心協力更令人感動。








  (((((((以下有雷)))))))









  我自己雖然是原著黨，但可能是之前就已經聽了太多負評。


  再加上個人認為原著的故事太細，世界觀太宏大，雖然都很有魅力，但改編成電影版要取

  捨的地方太多了，所以反而覺得電影超乎我的預期，我看得很開心。



  能理解看過原著的人的不滿。


  我也覺得改動很多，不同於原著的私設也很多。


  那個99個任務是電影版的梗嗎？


  開頭獨子說出滅活法太爛了是認真的嗎？


  但我看到整個鋪陳，能接受。


  影版的獨子人設跟原著稍有不同，比較心軟又比較怯懦。


  他其實很希望大家都能活下來，也曾經試圖學習劉眾赫一樣堅強，但現實一直在推翻他的

  努力。


  看到朋友死去那邊我哭爆了，能夠理解為什麼這種結局他不能接受。


  這部對他而言，是像心靈支柱一樣的小說，但最後卻是只有主角一個人活下來.....


  真的會有一種到底是為什麼啊的不甘！


  改編的好多地方滿鼻酸的，我在開頭奶奶沒辦法殺死螞蟻那裏就開始泛淚，看到吉永救獨

  子那裡根本整個大哭，能理解每個人的故事，又能給到大家的高光時刻，我真的很喜歡。


  整個故事看下來，邏輯是ok的，跟我一起的友人都沒看過原著，她們也都很喜歡。


  對原著黨來說，這是一部建議能接受很多地方被更動的人，才適合進電影院看的電影。


  但對我來說，金獨子跟劉眾赫跟各個角色的選角，都像是漫畫裡走出來一樣。


  我真的很滿意^^


  啊！想二刷啊♥



  題外話，李敏鎬真的有夠帥，在聽說電影版有他的時候，我還想說，李敏鎬不太適合金獨

  子啊.....


  結果看到選角.....啊，是演劉眾赫啊，那沒事了XD


  --


  超可愛，我覺得比漫畫可愛，而且比較呆，鬼怪在漫畫裡更為恐怖，電影的邪氣收斂到只

  幹掉了一個人(欸？用「只」這樣好嗎？)，而且還是因為一直被打斷，所以現在這樣我覺

  得剛剛好

  (沒有要洗白鼻荊的意思)(喂)



  沒錯，是會讓看了電影的人想去好好看漫畫的世界觀，

  而且主角的核心很明確，他想要大家一起活下去，我覺得很喜歡♥



  我覺得超好看啊啊啊啊啊啊！


  沒錯，電影裡面，比起李敏鎬之前整個澎起來的時候(喂)，已經好非常多了XD


  而且氣勢很重要，真的是劉眾赫，我真的很開心，哈哈哈。


  沒有覺得奶奶連螞蟻都不忍心殺死啦。


  我是說奶奶因為失去意識，所以沒辦法殺掉螞蟻，那邊覺得很命運弄人，所以哭了這樣，

  雖然知道這位奶奶到後面，大概也活不下來(遠目)'
