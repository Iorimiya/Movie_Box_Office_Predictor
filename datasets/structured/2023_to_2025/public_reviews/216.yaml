url: https://www.ptt.cc/bbs/movie/M.1753765319.A.C6E.html
title: '[普雷] 全知讀者視角'
content: "雷文防雷資訊頁\n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n\
  \ \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n \n \n \n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n \n昨天因為友人請客，所以有幸接觸到這部電影，\n因為平時沒看韓劇的習慣，所以對韓劇情還頗有新鮮感的，\n\
  想想上一次看韓電影好幾年前了，那部作品叫與神同行的樣子\n \n本作的主角是一個很喜歡看小說的男生，\n有一天不知為何闖入了他喜歡看的那部小說的異世界，\n在這異世界中，有個叫Goblin的鬼怪會出任務，\n\
  而這些任務完成的簡單方式，就是讓人們互相殘殺，\n而主角是一個善良的人，覺得Goblin出的任務，\n肯定有甚麼方法能讓參與的所有人全數通過，\n他總是這麼相信著，而人與人之間的互相合作，\n\
  通常都是他想法的根本，但要人互相合作難，\n因為互相合作後，主角也不能保證每個人都能安全通關，\n而人們一想到自己是犧牲的那一個，就會恐慌就會爭奪，\n使得主角所提出的計劃，總是不被眾人採納。\n\
  而其實主角提出的計劃，至少都能將死傷壓制最低。\n就說第一個任務，聽主角的話，至少能保全八成以上的參賽者，\n但人們只想到自己的恐慌，結果卻是死傷慘重。\n \n\
  本作的主角很聰明，因為已經知道了全部劇情，\n所以對比賽的訣竅都能迎刃而解，懂得跟鬼怪談條件，\n用以物易物的方式，來突破接下來面對的每一個困境，\n看到這有點感覺，電影是否把主角設定的太強了?\n\
  但他身上的錢是有限的，他在異世界的能力一開始也沒有很強，\n一次又一次的闖關，全靠他努力來的，所以在角色強度的設定上，\n我覺得是平衡的。\n \n最後觀後感，特效不錯，男的帥女的美，結尾也不會讓人感覺虐心，\n\
  是一個可以輕鬆看的電影！題外話，NaNa好帥!\n \n--\n全部的人全部在搶那個蟻窩，\n誰聽得到他說話…"
