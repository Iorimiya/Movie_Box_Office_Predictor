title: '[新聞] 【全知讀者視角】導演揭電影背後暖心寓意'
content: '新聞網址：



  改編超人氣網路小說與網路漫畫，由《與神同行》金牌製作團隊打造，以大場面、大動作

  、大特效、大卡司引爆全球觀眾熱烈期盼的奇幻動作鉅獻《全知讀者視角》，即將在7月

  23日（週三）晚場起於全台盛大獻映。本片今日（6/27）公開「幕後製作訪談」，透過更

  多的拍攝場面，以及監製、導演現身說法，帶領觀眾更深入了解本片誕生背景、導演意圖

  與改編過程，忠實呈現製作團隊為打造這部「年度最大規模鉅製」所付出的心思與熱情。






  《全知讀者視角》由以《與神同行》系列，締造南韓雙千萬觀影人次，以及台灣影史最賣

  座韓影冠亞軍神話的製作人元東淵一手打造。由於他屢次打造票房鉅作，加上本片具備大

  場面、大動作、大特效與大卡司等強勢元素，各界也寄予厚望，認為本片有望成為「南韓

  票房救世主」，為近年低迷的南韓影壇注入一劑強心針。不過各界的期盼也讓他笑稱：「

  每部電影上映前我都很焦慮，一天內的情緒起伏可以多達五萬次，幾乎快得躁鬱症了。」

  他也對本片寄予厚望：「雖然從事電影製作30多年，但我從未拍過如此一部富有使命感與

  責任感的電影。我只是個商業電影製作者，基本願望就是不要讓投資人賠錢，現在卻變成

  整個南韓影壇都為我們這部電影加油。我非常理解電影工作者們的期望，只有票房好，戲

  院才能復甦，院線電影才能證明其健康發展，這讓我必須堅持到最後，因此感到莫大壓力

  。 」



  對於將這部火紅作品改編成電影，契機來自2019年，元東淵當時還沉浸在《與神同行》票

  房告捷的喜悅當中，那時就有熟人向他推薦這部作品，並表示「這是網路小說界公認的傳

  奇IP。」當他閱讀後，也認為故事相當有趣：「當我第一次接觸到這部小說時，就立刻被

  這個故事深深吸引，覺得一定要將它影像化。這是一部描寫與夥伴共同生存的故事，我認

  為一定要讓大家在同一個空間裡共同觀賞並分享感受，因此決定將它電影化。」導演金秉

  祐也同樣被這個「主動參與型故事」的特性所吸引：「如果觀眾能在與角色們心境一致的

  狀態下觀賞，那就非常適合做成電影。」元東淵也補充：「剛開始接觸小說時，還沒有改

  編成網路漫畫的形式，對於世界觀、角色，還有作者想要傳遞的訊息，我們在沒有貶損原

  著的範圍內，將它改編為電影。我們向原著作者請教哪些角色和世界觀元素必須保留，即

  便需要進行電影化改編，我們仍堅持不改變其核心世界觀、哲學與訊息。原著作者也表示

  同意，並且在編劇階段就已共享劇本內容。」他也表示：「本片蘊含許多寓意，我和導演

  著重想向全世界年輕觀眾傳遞希望：你是一個有意義、有價值的人，像你這樣的人也可以

  拯救世界，所以不要討厭自己，要支持自己，相信自己。我希望觀眾能以『原來韓國也有

  這樣的新嘗試啊』的心情，輕鬆享受兩小時的觀賞時間，在戲院裡開心歡笑，也就發揮出

  我們這部電影的巨大作用。」





  《全知讀者視角》導演金秉祐表示：「雖然這個故事很有趣，但要進行電影化，最讓我感

  到苦惱的是：如何將這些故事整合成一條統一且有連貫性的敘事線。」於是他以「打造具

  有完成度的單部電影」為目標，進而設計劇情。他相信要創造一個兼具普遍性與特殊性的

  角色，才能建構出奇幻世界觀：「如果把角色原有的技能或背景拿掉，那角色會變成怎樣

  的人呢？」他認為如果在危機情境中，賦予角色在沒有背景依靠下所能做出的選擇與劇情

  ，那麼就能堆疊出更強烈的戲劇張力。因此，他讓故事圍繞在角色憑藉自身選擇與意志突

  破危機，同時保留奇幻世界觀的根基，營造出更貼近現實的緊張感。



  對於觀眾熱烈討論的武器設定方面，導演則表示：「原著出現許多類似的武器圖像，因此

  在電影中為每個角色賦予能凸顯個性的武器」，這讓角色特性可以更直觀地呈現給觀眾，

  也讓觀眾在觀賞動作戲時，能感受到更豐富且更多樣化的武器設計。導演並補充：「雖然

  片名是《全知讀者視角》，但這位『讀者』其實從來不是孤單一人。」藉此強調作品核心

  。製作人元東淵則說：「透過電影，我們希望讓觀眾知道，即使處在不安與危機當中，也

  總會有人與你同行——也許他們就在你身邊。只要懷抱這樣的想法，就足以成為安慰。」

  傳遞出本片的真誠意義。



  這部集結無數工作人員深厚之愛，以及激烈思索所打造而成的《全知讀者視角》，即將在

  7月23日（週三）晚場起於全台盛大獻映。本片也將透過前所未見的壯觀場面，以及充滿

  動感的故事敘述，為觀眾帶來全新的觀影體驗。本片劇情描述平凡上班族金獨子（安孝燮

  飾演），唯一嗜好是閱讀網路小說《在滅亡的世界中存活的三種方法》，不過在長達十年

  的連載期間，他卻成為小說最後的唯一讀者。當金獨子在地鐵車廂讀完小說最終話時，小

  說中的場景卻轉瞬成為現實。地鐵車廂彷彿成為人間煉獄，巨大怪物正踐踏著這座城市，

  以及憑空出現在眼前的訊息－－「您收到了第一個主線任務。」緊接著，熟悉的小說角色

  紛紛登場，而那位無比強大、牽動著整個世界命運的小說主角劉眾赫（李敏鎬飾演），開

  始照著劇情一一行動。眼看熟悉的世界將不復返，一個嶄新的世界正在誕生，身為唯一知

  曉這個新世界結局的金獨子，將在升級自身能力的同時，與夥伴們打造出跟原本小說截然

  不同的結局…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
