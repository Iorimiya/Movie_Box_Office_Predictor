title: '[負無雷] 全知讀者視角'
content: '先說這完全是原作黨的意見


  完全不知道原作是在幹什麼的話這篇心得文沒有任何參考價值。


  漫畫大概四五刷


  後來等不了每週一更


  剛好台灣有代理，直接把小說收完。


  對電影的結論就是喜歡原作不要進電影院


  或是進電影院之前把期待壓到最低


  劇情和人設的改動是毀滅性的改法


  核心概念也和原作不同


  即便有續集也一定會是完全不一樣的東西。


  但導演最後還是硬要接一個彷彿可以有續集的鏡頭只能說別鬧了


  難得韓國小說能出比較大的IP結果只能是這種套皮炒短線的拍法


  看看獨自整形紅透半邊天的程哥


  唉


  --'
