url: https://www.ptt.cc/bbs/movie/M.1753617692.A.3CF.html
title: '[好雷] 全知讀者視角 空白觀眾二刷心得'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  \n\n\n先說明一下\n原作小說或漫畫我都沒有看,\n所以原作設定我全都不知道XD\n會進去看就是覺得預告給的世界觀設定有吸引到我,\n而且選角賞心悅目,\n\
  所以就去看了XD\n\n\n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n去刷了兩次,\n因為我想看看杜比跟一般廳差多少,\n結論就是後半段地鐵暗場景還是杜比廳發揮好些,\n暗處細節比較清楚.\n\n世界觀的設定我覺得很不錯,\n\
  \"讀者的觀眾\"這個觀點不常見,\n是有趣的視角.\n\n劇情節奏緊湊不拖沓,\n不會令人很不耐煩的橋段.\n而且有把故事好好說完,\n不至看完不知道故事在說啥.\n\
  \n各角色的設定看過原作的友人抱怨過被魔改,\n我以一個空白觀眾的觀點來看人設算合理,\n(以電影設定來說)角色行為與他的人設不衝突,\n所以這點我倒不覺得有太大問題.\n\
  (原作黨請鞭小力點XD)\n\n電影中的大部份世界觀設定都有說明,\n所以就算沒看過原作大致也知道任務規則與道具的功能,\n不至於有嚴重的觀影障礙.\n\n角色選角、化妝跟打光真的沒話說,\n\
  要帥要美給好給滿,\n連那討人厭科長都找這麼帥的是怎樣XD\n整體而言真人畫面賞心悅目.\n\n動作戲的分鏡不錯,\n個人覺得劉衆赫打火龍強化版那段很流暢,\n\
  大螢幕觀看爽度十足.\n\n安孝燮在這部演技不錯,\n前面一臉衰小樣社畜眼神死的感覺不錯,\n後面站上加碼綠區時,\n與同伴的信念矛盾那段情緒表現也很不錯.\n\
  \n至於CG,\n我覺得可以分成幾個部份看:\n\n-一開始捷運上的CG其實不錯,\n 鼻荊登場雖然模組很超現實,\n 但因為跟背景光影互動有做好\n (通過捷運車廂柱子陰影都有好好做出來)\n\
  \ 所以看起來還算滿ok的\n\n-中段捷運站滿地跑的怪物就挺不ok,\n 主要的問題在於跟現實場景的互動沒做好,\n 像是怪物身上的陰影與捷運隧道中的燈光沒有互動,\n\
  \ 還有跑得時候看起來沒有貼在地上,\n 整體而言表現不佳.\n\n 火龍出場時跟周遭場景也沒啥互動,\n 理論上你應該要壓裂地板,\n 燻黑被燒烤的東西吧?\n\
  \ (不過這個一直都很困難,\n  像是ILM最近那隻暴龍跟環境的互動也沒處理好)\n\n-後段捷運站被拆(?)到宇宙中那段,\n 因為背景非常超現實(CG),\n\
  \ 所以上面的缺點減輕了,\n 這段反而表現不錯,\n 真人角色特效與CG場景/怪物的互動反而變自然了\n (像是金獨子最後插死火龍那段,\n  他臉上的光影特效就滿ok的)\n\
  \n另外就是李敏鎬這部從頭到尾都是面攤,\n可以說0演技,\n不過因為很帥可以忽略\n(反正基哥演技都看這麼多年了,\n 如果有演技問題那就是不夠帥!)\n\n\
  還有最後其實我覺得對於折斷的信念+信念的乙太\n合起來為何可以殺掉火龍,\n交代不算很清楚,\n我以一個空白觀眾腦補就是\n信念可以造就奇蹟(?)\n(但原作是這樣設定的嗎\
  \ 我很好奇XD)\n\n至於中二程度,\n畢竟是沒到Dies Irae那種中二病入膏肓連招式名都硬要德語不可的程度,\n所以我個人還能接受XDD\n\n總之這部設定上很有趣,\n\
  推薦沒看過原作的可以去看XD\n而且我認為導演成功了,\n看完電影我想去找原作小說來看了.\n\n\n題外話:\n\n這部有幾個action cut滿有趣的,\n\
  像是獨子主動吃下結晶(?)進入幻影監獄時,\n進入與離開都是用action cut的方式切幕.\n\n另外我大概能理解原作黨的不滿,\n畢竟這部小說如果只有電影那些設定,\n\
  以現在小說的競爭程度大概是紅不起來的,\n所以小說肯定有更多複雜弘大的設定被電影刪掉了...\n不過與其交代一半但沒說清楚,\n以電影來說也許不要提比較合適.\n\
  \n類似案例讓我想到當時劇場版也被魔改的蒼藍鋼鐵戰艦\n(蒼き鋼のアルペジオ)\n原作權謀戲份不少,\n設定也很複雜,\n劇場版就改成完全的熱血幹架,\n權謀跟設定刪光光XD\n\
  部份角色性格也魔改了,\n但身為原作黨的我還是當作不同作品看得很開心XDDDDDD\n\n--\n真的 而且是背景設定有趣的RPG\n你這麼一說還真的有XD\n\
  本來以為只是主角一行人小打小鬧沒想到居然是星座大戰\n就跟買Tesla股票結果隔天SpaceX發射了一樣(?)\n原來如此 沒特別聯想到\n反正帥就完事了\n\
  完全沒有問題!\n劉眾赫 你個渾蛋~~~\n看看後續會不會交代,\n不過既然都叫作信念了\n大概有什麼了不起(或中二)的設定吧(擅自期待)\n不錯爽+1\n遇到這種狀況就當作不同作品看吧XD\n\
  至少只看電影還算是佳作,\n小說可能是極佳作\n首先要有續集XD\n有的話CG與真實場景整合應該可以再加強\n(要不就是通通CG這樣比較可以掩飾缺點)\n好像也是有道理\n\
  而且乙太是SSS\n應該更強了XD\n也是\n不過第2隻boss就要SSS道具會不會強度通膨太大XD\n沒看過原作真的覺得不錯\n有點驚豔\n跟實景融合處理不加\n\
  這領域終究還是差好萊塢一些\n應該是 而且看起來是一對的\n肯定差很多XD\n所以可以理解原作粉憤怒的原因(汗\n不過洗了我們這些新觀眾入坑\n還是有起到推廣的效果XD\n\
  怪物是最醜的+1\n選角真的顏值有夠高\n就算是反派也必須先是帥哥XD\n其實我認為CG模組本身不差,\n但整合實景就真的很突兀.\n畢竟實景光源很複雜,\n\
  模組如果沒做相對應處置就會不協調;\n而取景的消失線也可能很難分析準確,\n導致把CG模組放進去時常會遠近或角度對不上.\n這點就算好萊塢技術團隊也沒有事事完美XD\n\
  所以看到很自然的CG就真的很佩服..\n\n最終戰上升到宇宙中雖然有點取巧,\n但整體呈現真的就自然很多.\n(不如說拿CG背景配CG怪物就不那麼突兀了\n 再把真人角色臉P一些誇張光影上去\n\
  \ 結果就是一切居然變得這麼協調!XD)\n\n整部節奏真的不錯,\n面攤不重要 帥就完事了XD\n\n\n我想看過原作都會有一些期待的,\n但這些期待沒被電影實踐就會有落差;\n\
  沒看過原作的觀眾沒有期待,\n所以就沒有落差 沒有失望XD\n\n\n其實毛茸茸也很讚耶 想嚕(欸\n\n吉祥物+1 XDDD"
