title: '[好雷] 白紙觀眾看全知讀者視角'
content: '先放一張李敏鎬當防雷，

  為了他而看的











  其實本來沒預定要看這部，

  只是原本要買驚奇四超人的票所以看到這部，

  然後突然發現有李敏鎬才決定要看，

  然後看之前就被打預防針了，

  因為看過原作的幾乎一片說爛，

  我本身有在看一個叫DA的youtuber，

  他出了一片稱讚身為商業片不錯但作為真人化卻是爛作，

  總之經歷過大量漫威電影的洗禮我打預防針能力也是一流的

  -----------------------------------------


  本來就覺得會是穿越之類的劇情，

  但穿越的方式讓我覺得有點意外，

  就是突然間整個現實都變成了跟小說一樣，

  一開始就是要人類廝殺，

  但看到只需要殺生命體就知道那一箱螞蟻死定了，

  接著就看到金獨子用像是遊戲的方式花錢點能力，

  從這開始就有一種現實版的mmorpg


  接著金獨子開始用他看過小說的經驗來渡過危機跟任務，

  原本魚龍那段還以為有什麼帥氣的劈開肚子之類的劇情，

  還真的要土法煉鋼慢慢插針喔w


  最後打火龍覺得還滿好看的，

  本來多金的阿北還在說著只有強者才有資格活下來，

  最後被金獨子說服後最拼的也是他，

  接著成功他也是真心的跟大家分享著喜悅，

  很難想像原本一開始的形象


  原本認為無可奈何必須有所犧牲才能活下去的獨子，

  想起了自己就是想改寫滅活法結局，

  不是獨自一人而是跟夥伴活下去的信念，

  也是靠著相信夥伴跟互相合作才打贏了火龍


  接著就是埋續集的梗，

  雖然不知道還會不會有


  ------------------------------------------------

  再來是吐嘈的部分，

  雖然我是衝著李敏鎬來看的但上面卻沒提到，

  因為對於劉眾赫這角色我覺得很多疑問跟沒交代清楚的地方


  在那之前想先說說守護星的事，

  不知道是真的篇幅太少還是覺得沒必要說，

  至少也簡單的說明一下大家的守護星跟什麼能力吧，

  例如鄭熙媛發動守護星那段就有說明，

  而且演出其實滿帥的，

  剛好也是正在裁決


  但劉尚雅的就是突然間就有能力，

  變成像是只有噴絲能力的蜘蛛人，

  如果能稍微簡單介紹一下也好



  然後劉眾赫這角色全身上下幾乎都是吐槽點，

  首先他一開始就強的離譜而且道具超級多，

  然後對於事情的發生有一種不意外的感覺，

  態度也是人類死光了也沒差我能拯救世界就好，

  雖然那霸道的態度很帥但這是兩回事


  接著金獨子提到眾赫有回歸的能力，

  所以看到這段我就已經在考慮，

  他是不是早就回歸不知道幾百甚至更多次了，

  所以才造就現在我們視點所見的劉眾赫，

  畢竟經歷這麼多次人類自私自利的互相爭奪跟殘殺，

  性格變這樣也很合理，

  但完全沒解釋


  再加上一開始在電車出來那段，

  就直接問獨子怎麼認識兩個本應該是他夥伴的人，

  但實際上事情也才剛發生更覺得早就回歸過，

  不知道是想等續集還是就含糊帶過

  ----------------------------------------------------


  然後我還是很推這部的，

  今天我還看了驚奇四超人，

  不知道是不是我粉絲濾鏡開比較強我是偏向全知讀者視角比較好看的...(其實驚奇四超人也

  是好看但一堆細節欠吐嘈)

  畢竟過程的確是很精采，

  戰鬥跟特效就還行，

  已經完全當成遊戲來看待了


  但這部對於原作粉來說完全就是被改的面目全非，

  光聽到李智慧原本是拿刀劍(甚至討厭槍？)卻拿狙擊槍，

  連武器都能變動就覺得很扯，

  只能說真人化不是為了服務粉絲而是為了吸引新觀眾


  但老實說真要這樣就應該只做一集就結束，

  畢竟如果認為電影好看所以跑去看原作，

  結果才發現被改的很誇張，

  那確定會回來看續集電影嗎...？

  就算電影要走自己的路線，

  但這樣還算是開發這部的新觀眾了嗎？？

  所以雖然有點可惜，

  但我大概是不會補原作了


  然後還是那句話，

  不知道還有沒有續集



  --

  希望啦，但建立在原作黨的痛苦上其實也有點過意不去w...

  沒錯就是他'
