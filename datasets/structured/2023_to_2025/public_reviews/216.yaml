title: '[新聞] 【全知讀者視角】豪華幕後掀奇幻鉅片革命'
content: '新聞網址：



  改編全球現象級網路小說與網路漫畫，由《與神同行》金牌製作團隊傾力打造，以大場面

  、大動作、大特效、大卡司引爆觀眾熱烈期待的奇幻動作鉅獻《全知讀者視角》，即將在

  7月23日（週三）晚場起於全台盛大獻映。本片昨晚（7/2）在首爾舉辦盛大的Showcase活

  動，現場星光熠熠，主演安孝燮、李敏鎬、蔡秀彬、申承浩、NANA盛裝登場，引爆粉絲尖

  叫連連。活動上設計多項趣味「主線任務」，從挑戰團體愛心POSE、猜台詞關鍵字、互動

  回應觀眾紙條，再到疊疊樂問答PK、扭蛋驚喜任務，現場氣氛嗨翻天！最終由申承浩獲得

  最高累積任務幣值，贏得「全知玩家」稱號，為現場與直播觀眾帶來驚喜連連的夜晚。除

  了星光熠熠的演員陣容，本片幕後製作團隊同樣來勢洶洶！從視覺特效、攝影、美術、武

  術到服裝造型，每個環節都力求突破與創新，打造出一部不只值得「看」，更「一定要進

  戲院看」的年度鉅片！





  年度奇幻動作鉅獻《全知讀者視角》，昨日（7/2）在首爾舉辦盛大的Showcase活動，現

  場星光熠熠，氣氛熱烈，五位主演一登場便引爆全場尖叫！安孝燮一身俐落灰色西裝帥氣

  現身，散發自信光芒；李敏鎬則以皮夾克搭配牛仔褲，展現溫暖又有型的熟男魅力；蔡秀

  彬一襲黑色造型，宛如洋娃娃般精緻動人；申承浩的簡約黑白穿搭也襯出結實身形，硬漢

  氣場十足；而NANA則以若隱若現的薄紗褲裝驚艷全場，修長辣腿在燈光下閃耀無遺，時尚

  與性感兼具，讓粉絲直呼「太美了！」而為了呼應片中角色過關斬將、挑戰重重任務的情

  節，Showcase現場也設計一系列趣味十足的「主線任務」。主持人率先請大家挑戰「團體

  愛心POSE」，只見五人為了完美擺拍絞盡腦汁，最終合力比出超可愛的大愛心，讓全場瞬

  間融化。



  接著登場的是一連串互動關卡：猜關鍵台詞、回覆觀眾紙條、驚喜扭蛋任務等，讓粉絲驚

  喜連連。不過真正引爆現場氣氛的，莫過是熱血又歡樂的「疊疊樂問答PK」。以NANA、申

  承浩、蔡秀彬、李敏鎬、安孝燮為反向順序上陣，抽出方塊並回答方塊上的問題，展現真

  實反應與爆笑互動。特別是NANA在挑戰第二輪時，獲得台下粉絲協助順利闖關，讓她當場

  給了對方一個擁抱，還加碼承諾簽名，粉絲福利大放送！不過就當遊戲難度愈來愈高，讓

  接下來上場的申承浩也忍不住對那位粉絲喊話：「來幫幫我吧！」雖然開玩笑求助，但他

  最後仍靠自己驚險過關。不過蔡秀彬則在高難度的闖關中不幸落敗，引來全場一陣惋惜。

  最終，申承浩憑著穩定表現累積最多任務幣值，獲得「全知玩家」稱號，為這場精采的

  Showcase帶來驚喜連連的夜晚。





  除了星光熠熠的演員陣容，《全知讀者視角》也網羅值得信賴的資深幕後團隊齊聚一堂。

  除了以《恐怖攻擊直播》展現卓越沉浸感與獨創風格的導演金秉祐，以及成功打造出《與

  神同行》系列與《雙面君王》等三部千萬觀影人次電影的製作人元東淵，本片更集結《柏

  青哥》攝影指導全慧珍（音譯）、《與神同行》系列與《屍速列車》美術指導李木元（音

  譯）、《與神同行》系列視覺特效總監鄭成鎮（音譯）、《首爾之春》武術指導鄭允憲（

  音譯）、《犯罪都市》服裝指導金京美（音譯）等頂尖製作班底，共同打造本片前所未見

  的龐大世界觀，勢必將為南韓電影開創嶄新局面。



  特效總監鄭成鎮表示：「在南韓電影中嘗試新的視覺效果，是我們的目標。我們渴望向觀

  眾呈現新的東西，這部作品正是我非常渴望參與的。」充分展現本片將以龐大視覺效果震

  撼觀眾。攝影指導全慧珍則表示：「這部作品正是我一直在找尋的電影。」武術指導鄭允

  憲則說：「這是一個不容易接觸的類型，為了替每個角色設計新的動作，讓我費盡心思。

  」美術指導李木元也補充：「在《與神同行》結束後，我就在想，如果有一天再度接到奇

  幻項目，一定要再試試看。某天，金秉祐導演邀我參與這部作品，我就毫不猶豫地答應了

  。」他並補充：「我認為越是發生奇幻或不現實事件的電影，場景就越要真實，才能說服

  觀眾。為了打造真實感，我下了很多功夫。」讓人對融合奇幻與現實的五感滿足視覺饗宴

  產生濃厚好奇。



  這部斥資300億韓圜年度最高預算打造，以別出心裁的劇情設定，搭配全球火紅的知名影

  星，成為觀眾引頸期盼的劃時代「東方奇幻」代表作的《全知讀者視角》，即將在7月23

  日（週三）晚場起於全台盛大獻映。而這部科幻殿堂級神作，原著漫畫由韓國人氣網路小

  說改編，至今在台灣累積觀看次數高達1.1億，並榮登2024年度十大人氣榜第二名，評分

  高達9.9分。除了能透過電影感受震撼視覺與精彩劇情外，更可深入漫畫原作，探索更多

  電影未述及的細節與角色故事。目前《全知讀者視角》漫畫正於LINE WEBTOON平台每週一

  火熱連載中（），立即下載APP，與千萬讀

  者一同展開更深度的冒險之旅！



  《全知讀者視角》電影劇情描述平凡上班族金獨子（安孝燮飾演），唯一嗜好是閱讀網路

  小說《在滅亡的世界中存活的三種方法》，不過在長達十年的連載期間，他卻成為小說最

  後的唯一讀者。當金獨子在地鐵車廂讀完小說最終話時，小說中的場景卻轉瞬成為現實。

  地鐵車廂彷彿成為人間煉獄，巨大怪物正踐踏著這座城市，以及憑空出現在眼前的訊息－

  －「您收到了第一個主線任務。」緊接著，熟悉的小說角色紛紛登場，而那位無比強大、

  牽動著整個世界命運的小說主角劉眾赫（李敏鎬飾演），開始照著劇情一一行動。眼看熟

  悉的世界將不復返，一個嶄新的世界正在誕生，身為唯一知曉這個新世界結局的金獨子，

  將在升級自身能力的同時，與夥伴們打造出跟原本小說截然不同的結局…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
