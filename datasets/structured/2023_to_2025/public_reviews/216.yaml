url: https://www.ptt.cc/bbs/movie/M.1753521712.A.364.html
title: '[負雷] 全知讀者視角 原作粉大負雷QQ'
content: "就算有做好心理準備，我還是好難受 (つд⊂)\n\n而完全沒看過原作（小說或是漫畫）一起去的夥伴心得：\n\n「畫面很帥」\n「男角很帥，女角很美」\n\
  「打鬥效果滿好看的」\n「但是劇情有點太緊湊太快，會有種抽離感」\n「只是相比之下我還是比較喜歡」\n\n供各位參考。\n\n\n而我是。･ﾟ･(つд`ﾟ)･ﾟ･\n\
  \n我是有買實體小說、漫畫webtoon買到最新進度的粉絲，\n\n老實說…\n\n非．常．失．望\n真的是。･ﾟ･(つд`ﾟ)･ﾟ･\n\n我能理解把小說或是漫畫作品改編成電影本來就會有所取捨，\n\
  無論是劇情或是一些能力的改動，畢竟原作有一大部分都是金獨子在自言自語，\n設定也算是有點複雜，的確不太適合都把設定拍在電影之中。\n\n以上的前言應該夠多可以遮住雷的部分了吧？\n\
  \n其實滿多的部分是粉絲向的不滿啦，和伙伴激烈的訴苦他完全感受不到(′・ω・`)\n所以以下的負雷主要是寫給原作粉絲參考的。\n\n\n雷文防雷資訊頁\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n1. 金獨子對＜滅活法＞結局的反應很不合理\n\
  \n劇情的開頭變成小說完結，主角金獨子覺得結局很爛寫信給作者，\n然後作者回信「啊不然換你寫成你想要的結局」\n\n???? 在原作中《滅活法》是陪伴著金獨子長大，算是支持他活下去的一個元素，\n\
  尤其他又是這部作品的「唯一讀者」，這樣的關係之下，\n怎麼可能會寫這麼沒禮貌的信給作者？\n\n2. 劉善雅變成傻白甜，也是一樣派遣結束後直接沒工作的打工仔，\n\
  \   然後莫名其妙得到了星座的支援，就變成蜘蛛人了？\n\n的確不需要在電影中敘述她被公司正式錄取，下班還是認真在精進自己的軟實力，\n那也不用特別提到他想當設計衣服的人，接下來要去打工了啊！\n\
  \n而且之後也沒有特別說明，她就突然把ＯＯ星座給她的技能，用得爐火純青，\n連蜘蛛人都自嘆不如吧！\n而且用了都不會累欸，超快就接受了\n\n3. 被魔改的「鬼怪」外型\n\
  \n這個在預告片出來的時候我就已經有心理準備了，原文的敘述是\n「兩個小小的角，，長著的詭異生物」\n\n我就問那個光滑的外殼還有不知道在幹嘛的裝了彩色珠子的肚肚到底是三小？\n\
  變成只有披著一個奇怪披肩，鬆軟絨毛呢!!\n超喜歡鼻荊的，看了好難受(つд⊂)\n\n而且個性也大魔改，隨隨便便就變成「獨子的夥伴」隨叫隨到，\n和獨子之間的拉扯談判劇情我覺得滿經典的，結果殘忍刪除就算了，\n\
  直接變成獨子的好夥伴是怎樣？？\n\n\n鼻流甚至看起來比鼻荊還大尾…\n雖然我知道這個不是重點，但考慮到後續的劇情，這樣演對嗎？\n\n\n4. 獨子的個性大改動\n\
  \n老實說我覺得電影中的獨子非常不討喜，很懦弱卻又很想當聖母\n\n一臉委屈委屈，到底在委屈什麼！！\n(但選角個人滿喜歡，有獨子的感覺，只是個性完全不對(つд⊂))\n\
  \n金獨子應該是平常看起來吊兒郎當，然後有點小壞，笑得賊兮兮的樣子\n而不是這種「我要來拯救世界！但首先男主角不能死掉」\n甚至有種討好型人格的感覺。\n\n\
  還有超級無敵重要的獨子技能「第四面牆」呢…\n\n5. 金南雲的白髮呢？至少還我中二感吧！\n看起來就只有一種8+9欠扁學生的感覺，原來的瘋癲感都不見了，\n\
  不過以電影的劇情進程來說這個角色不太重要就是了。\n(雖然我也挺喜歡他的，喜歡這種混亂中二)\n\n6. 「星座」的存在感大幅降低\n\n我在想是不是電影想要表達「我們觀眾」就是「星座」的這個概念，\n\
  裡面有些段落好像有點打破「第四面牆」的樣子，但就有點微妙…\n\n原作中的「星座」（以下關燈）\n\n\n\n「深淵的黑焰龍」、「緊箍兒的囚犯」、「惡魔般的火之審判者」\n\
  「隱密的謀略家」等等的星座\n完全0存在感ヾ(;ﾟ;Д;ﾟ;)ﾉﾞ他們很重要吧！！\n\n而且「斗內」這件事變成說說而已，這也超重要吧！\n「ＯＯ星座覺得怎樣怎樣然後給了100\
  \ coin斗內」這樣的劇情會有多難表現？\n\n7. 劉眾赫變成妖精的尾巴的エルザ了\n\n武器那樣露出來很帥，對，但是根本就是艾爾莎·史卡雷特！\n(而且演員帥的確是帥，但就沒有劉眾赫的那種霸氣帥感QQ)\n\
  \n穿著風衣手插著口袋，我看得好尷尬，而且打到這裡突然想到白色風衣呢??\n\n8. 拿槍的女高中生李智慧\n\n這個很多人已經吐槽過了，唉…就算不給他拿武士道，拿個刀劍也好啊…\n\
  拿槍就覺得，好像在電影的進程劇情中，有沒有她好像也沒啥差別\n\n9. 一直出現的高中霸凌回憶片段\n\n我覺得有點太多，是想要表達反對霸凌嗎…？\n還是之後的4集會直接把媽媽這個角色拔掉？\n\
  \n10. 吉永...你怎麼變成這樣了\n\n這個純粹是阿姨的抱怨，我的可愛的小正太...QAQ\n\n一開始抱著的裝著蝗蟲的昆蟲觀察箱改成螞蟻，我覺得算是合理，\n\
  但那個蟲卵玻璃管哪有那麼輕鬆隨便捏一下就能把卵都捏爆= =\n\n11. 這個應該是唯一的正面評價\n\nNaNa有夠正，有把鄭熙媛的帥氣演出來！\n她武器的改動我倒是覺得改得很棒，動作場景也很好看，\n\
  發動星座能力的時候畫面也是好看的。\n(但原作中獨子明明自己還有吐槽過這樣的路人角色怎麼還活著，\n 電影裡面就變成最喜歡的腳色到底...)\n\n--\n最後，其實我覺得畫面上是滿好看的，怪物也還行，\n\
  畢竟是假想怪物不可能太真實，但沒有那麼假的悲劇XD\n\n沒看原作的可以當爽片看一下。\n\n打鬥很有打擊感，運鏡上也是滿厲害的，只是\n唯一建議原作粉絲真的不要去，不要去看…\n\
  ◢▆▅▄▃崩╰(〒皿〒)╯潰▃▄▅▇◣\n\n--"
