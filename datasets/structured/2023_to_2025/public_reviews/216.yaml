url: https://www.ptt.cc/bbs/movie/M.1754196677.A.B5E.html
title: '[負雷] 全知讀者視角'
content: '因為看到網路上好評&親友推薦前往觀看

  完全沒看過原作

  可以理解為什麼原作黨會不喜歡

  個人會想回去補原作，但電影真的拍得不好


  首先內容也省略太多東西了吧

  我明白因為要壓縮劇情，但這樣拍出來真的不好看

  再來我完全不知道這是一部沒有演完的電影

  片尾名單在跑的時候，心中只有：蛤 就這樣？


  再讓我選一次的話，我會想去看哆啦A夢：大雄的繪畫世界物語…


  以下有雷



















  ————以下雷文分隔————


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  一開始還覺得不錯

  設定、世界觀很像是我獨自升級&魷魚遊戲

  但從中間某個時間的點開始突然覺得很尬


  好像每次主角遇到危機時

  就用這個 就用那個

  夥伴突然進化

  你點的以太的信念已送達      通關

  可能是因為壓縮了劇情，漸漸覺得很尷尬


  背後星也是必要的時候才會拉出來提醒你

  *我們還有這個設定喔*的感覺


  獨子在金湖站打BOSS時花了50000 coin買了可以打出致命一擊的道具

  但為什麼打火龍的時候不能再用

  是因為商店只賣一個？

  還是對火龍沒效只要打破核心就好？

  戰鬥爽沒錯但很多東西沒解釋就帶過了



  然後主角身旁的人進到滅活法的世界觀裡好像馬上就能完全適應

  明明幾分鐘前還是一個被上司騷擾的上班族 / 天真的弟弟

  後面被 頭變成甜甜圈的人 / 怪物 追殺也完全沒說什麼

  心態轉變都沒有演出



  最後斷在那邊 如果電影出第二集大概也不會去看

  對我來說特效、戰鬥看起來很爽，就這樣沒了

  節奏很緊湊但沒有細節可以細細品味


  像是從高雄坐高鐵到台北

  一路上車速很快，咻咻咻的看了一堆東西，但窗外的景色卻很模糊

  最後只到了台中：請你下車






  --'
