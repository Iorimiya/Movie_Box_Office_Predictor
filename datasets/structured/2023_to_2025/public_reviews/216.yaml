url: https://www.ptt.cc/bbs/movie/M.1753283168.A.0EB.html
title: '[好無雷] 《全知讀者視角》'
content: '本人非常不會寫心得文


  但避免有人知道了不想知道的劇情


  還是用好雷文來分類吧




  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  電影中的男主角，看完了一部到後期只剩他一個人還在追的小說


  只是結局的價值觀連男主角都無法認同，於是寫信訐譙小說作者


  沒想到作者真的回信了，跟男主角說：不爽結局你來寫


  然後男主角就進到了小說的故事當中，從頭發展整個故事...




  《全知讀者視角》有著滿滿的特效


  從小說裡的末世場景、


  道具的取用、各角色的能力/招式


  以及打小魔王、大魔王...等


  光這點就值回票價


  ----------------------------


  電影劇情：


  小說故事隨著男主角的加入


  當然有了些許改變，


  故事裡人們，


  有人因男主角而獲救，


  有人則是克服了自己的懦弱，


  到最後打Boss，


  跟小說原先設定的價值觀大相逕庭。


  以上雖然老梗，但看了還是很感動


  ----------------------------


  電影演員/演技：


  只能說 李敏鎬 你負責帥就好,男配角真的超帥

  看海報本以為是花美男型的帥,個人不是很喜歡

  但到了電影裡面，才知道他的厲害



  蔡秀彬 很可愛 沒在看韓劇不熟



  NANA 個人對她的印象還停留在《騙徒》裡的春子

  這次演的是有點女打仔的角色,還是好正



  安孝燮 這次的男主角 沒在看韓劇一樣不熟



  演技的話我一直都分不出好壞,就很正常的沒有出戲


  ----------------------------


  結論：滿分5顆星的話


  個人給4.5顆


  果然是《與神同行》製作團隊。


  可惜今天去的影城設備不好，


  有機會會再去好影城二刷!


  推薦給各位。


  --'
