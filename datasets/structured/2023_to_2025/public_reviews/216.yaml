title: '[新聞] 【全知讀者視角】台灣定檔7/23晚場起上映'
content: '新聞網址：



  改編超人氣網路小說與網路漫畫，由《與神同行》金牌製作團隊斥資300億韓圜（約新台

  幣6.2億元）天價打造，成為今年韓影規模最大、話題最熱的奇幻動作鉅作《全知讀者視

  角》，台灣發行商「采昌國際多媒體」在今日（6/16）正式宣布，台灣定檔7月23日（週

  三）晚場起與南韓同步上映。台灣版正式海報與預告也於今日重磅曝光，預示這部作品將

  以獨一無二的世界觀，為觀眾帶來絢爛壯闊的電影體驗！只見安孝燮、李敏鎬、蔡秀彬、

  申承浩、NANA、BLACKPINK成員JISOO，以及童星權恩成等主要演員帥氣現身，以面對末日

  試煉的嚴肅神情，配上宛如煉獄般的崩壞車廂背景，讓人好奇主角們面對小說世界成真後

  ，要如何改寫小說結局，過關斬將完成重重艱鉅任務。





  以大場面、大動作、大特效、大卡司引爆全球觀眾熱烈期盼的《全知讀者視角》，今日（

  6/16）正式宣布台灣定檔7月23日（週三）晚場起與南韓同步上映，成為引領今年暑期爆

  發性票房的超級大片之一。在今日釋出的兩款直式與橫式正式海報當中，只見正面凝視畫

  面的「金獨子」（安孝燮飾演）與「劉眾赫」（李敏鎬飾演）展現非凡氣勢，彷彿要將觀

  眾一秒拉進崩壞的小說世界，引發強烈好奇。而他們背後注視著任務視窗的，則是同樣背

  負任務的戰友「劉尚雅」（蔡秀彬飾演）、「李賢誠」（申承浩飾演）、「鄭熙媛」（

  NANA飾演）、「李智慧」（JISOO飾演）、「李吉永」（權恩成飾演）等人。背景則是東

  湖大橋上一節破碎的地鐵車廂，宛如煉獄般的場景令人不寒而慄，展現出與前導海報截然

  不同的氣氛，讓人更加期待即將展開的龐大故事。配合海報上「小說世界，成為現實」標

  語，讓人對唯一知道小說結局的「獨子」，與小說主角「眾赫」與夥伴們，如何在無人知

  曉的結局中，扭轉一切。






  另一方面，在同步公開的正式預告當中，由金獨子內心獨白揭開序幕：「那個我最喜愛，

  也曾視為全部的故事，變成了現實。」瞬間將觀眾帶入情境。搭配突如其來的地鐵停駛，

  與鬼怪「鼻荊」降臨，首次給予人類的任務隨之登場，讓陷入混亂的人類，在車廂中迅速

  展開亂鬥，高潮迭起，讓人目不轉睛。預告更曝光多項關鍵要素，例如「背後星」的神秘

  選擇、角色們專屬武器如「絲線」、「盾牌」、「劍」等強勢登場，搭配帥度爆表的精采

  打鬥畫面。當金獨子堅定展現要改寫「不是只有主角一人生還，而是所有人一起生還」的

  意志，無疑掀起全片情感最高峰，展現主角的非凡成長與領導氣魄。預告一出，即在各大

  平台引爆討論，網友紛紛留言：「期待爆表！」「特效真的是媲美好萊塢大片等級！」「

  這卡司組合簡直夢幻，我一定要看！」



  這部改編自轟動全球奇幻IP大作，斥資300億韓圜年度最高預算打造，以別出心裁的劇情

  設定，搭配全球火紅的知名影星，成為觀眾引頸期盼的劃時代「東方奇幻」代表作的《全

  知讀者視角》，即將在7月23日（週三）晚場起於全台盛大獻映。本片劇情描述平凡上班

  族金獨子（安孝燮飾演），唯一嗜好是閱讀網路小說《在滅亡的世界中存活的三種方法》

  ，不過在長達十年的連載期間，他卻是這個小說的唯一讀者。當金獨子在地鐵車廂讀完小

  說最終話時，小說中的場景卻轉瞬成為現實。地鐵車廂彷彿成為人間煉獄，巨大怪物正踐

  踏著這座城市，以及憑空出現在眼前的訊息－－「您收到了第一個主線任務。」緊接著，

  熟悉的小說角色紛紛登場，而那個無比強大、牽動著整個世界命運的小說主角劉眾赫（李

  敏鎬飾演），開始照著劇情一一行動。眼看熟悉的世界將不復返，一個嶄新的世界正在誕

  生，身為唯一知曉這個新世界結局的金獨子，將在升級自身能力的同時，打造出與原本小

  說截然不同的結局…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



