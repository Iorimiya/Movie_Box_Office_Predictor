url: https://www.ptt.cc/bbs/movie/M.1753187292.A.0FC.html
title: '[新聞] 【全知讀者視角】台韓群星搶看引爆話題！'
content: '新聞網址：



  改編全球現象級網路小說，由《與神同行》金牌製作團隊傾力打造，以大場面、大動作、

  大特效、大卡司引爆觀眾熱烈期待的奇幻動作鉅獻《全知讀者視角》，即將在本週三（

  7/23）晚場起於全台盛大上映。本片昨晚（7/21）同時在台北、首爾兩地舉行首映會，熱

  度雙城點燃。只見台灣首映氣氛熱烈，近千名觀眾擠爆影城，讓片商緊急加開影廳疏導人

  潮，足見本片魅力難擋。現場更齊聚重量級影視名人與創作者力挺，包括知名製作人邱瓈

  寬（寬姐）、導演林孝謙、編劇呂安弦、演員柯有倫、陳彥嘉，歌手玖壹壹春風、影音創

  作者Alizabeth娘娘、一樹Kazuki、沒有營養的生活智慧王，以及藝人海產、名模劉樸、

  資深媒體人范琪斐等人紛紛到場，化身「首波觀眾應援團」。而在首爾舉行的VIP首映會

  更宛如年度演藝盛典！除了導演率領主要演員群華麗登場之外，朴寶劍、朴成焄、張東健

  、林秀晶、朴星雄、孔敏貞、李有鎮、韓智恩、蔡元彬、申東美、邕聖祐、李鎮赫、男團

  ALL(H)OURS成員Kunho、Minje、Hyunbin，以及女團Lovelyz前成員鄭叡仁與劉智愛更紛紛

  站台共襄盛舉，讓本片宛如「這部電影，非看不可」的高調宣言！





  《全知讀者視角》昨日（7/21）在國賓大戲院舉行盛大不已的台灣首映會，現場湧入近千

  名觀眾，人氣火爆到片商緊急加開場次應對人潮，氣氛彷彿大型演唱會，足見本片超高熱

  度與關注度。首映會現場星光熠熠，眾多台灣影視名人、影音創作者齊聚為本片站台。曾

  扮裝片中可愛鬼怪「鼻荊」的影音創作者「沒有營養的生活智慧王」，一邊秀出過去的裝

  扮照片，一邊興奮直呼：「我就是為牠來的！」更分享：「如果有在玩電動的人，我們常

  常會想可不可以升級、進入不一樣的世界、打怪解任務，我覺得這很迷人，看電影的同時

  可以把自己當成主角，享受其中，所以一定要來看！」演員柯有倫則驚嘆：「我看到預告

  嚇到了，覺得現在很難得看到這麼大製作的電影，因此特別來學習一下！」玖壹壹春風也

  點頭稱讚：「看到預告覺得很厲害。」藝人海產力推：「一定要進戲院支持這部好電影！

  」名模劉樸則表示：「很期待片中的特效與災難等大場面，會怎樣拍出來。」



  尤其本片是近期以《Kpop 獵魔女團》（KPop Demon Hunters）人氣爆棚的安孝燮的電影

  初主演，自稱「安太太」的影音創作者「Alizabeth娘娘」也心花怒放拿出手機，曬出自

  己跟安孝燮的合照，大喊：「我百分之百是為他來看！官方預告片我看了大概十幾萬次，

  一直重複他的部分！」連來自日本的創作者一樹Kazuki也說：「我期待安孝燮的演出，聽

  說這是他的第一部主演電影，我也想接更多演戲的作品，想來看看他的表演做學習。」不

  只演員魅力吸睛，本片更由《與神同行》金牌製作團隊，斥資6.2億台幣重金打造，堪稱

  今年最高預算的奇幻動作強片。導演林孝謙直言：「光看捷運裡天崩地裂，就很期待可以

  進入幻想世界。」編劇呂安弦也說：「韓國拍攝真人電影很厲害，期待會如何改編！」知

  名經紀人與製作人邱瓈寬（寬姐）更表示：「韓國團隊如何將高人氣IP結合在一起，製作

  出這樣的作品，是我們做國片可以參考學習的。」尤其本片充滿神話、奇幻、動作等精彩

  元素，台劇《影后》演員陳彥嘉也點名這類題材完全正中自己喜好：「我對這樣的題材很

  有興趣，像是《與神同行》或《異能》這類作品，我是絕對不會錯過的！」資深媒體人范

  琪斐同樣表示期待，當被問及如果和片中主角一樣擁有知道結局的全知能力，她大方表示

  ：「我一定會跑出來告訴大家，這個世界即將會發生什麼事情，絕不藏私！」





  《全知讀者視角》昨晚也在南韓首爾舉辦盛大的VIP首映會，現場宛如頒獎典禮，星光雲

  集、氣勢非凡，人氣與話題雙雙爆表！導演金秉祐率領主角群安孝燮、李敏鎬、蔡秀彬、

  申承浩、NANA、權恩成、朴號山、崔永葰與鄭星一（又譯鄭成日）等實力與顏值兼具的卡

  司全員到齊，氣場強大，讓紅毯儼然變成粉絲嘉年華。只見主演群誠意滿載，簽名、合照

  來者不拒。其中兩大男神安孝燮與李敏鎬更是全場焦點，不僅熱情揮手與觀眾互動，還聯

  手比愛心賣萌，甜度爆擊，讓全場粉絲瞬間戀愛！尤其這場首映不只是南韓影壇盛事，更

  像演藝圈年度盛典！包括以《苦盡柑來遇見你》穩坐國民男神寶座的朴寶劍、《魷魚遊戲

  》中憑「賢珠」一角爆紅的朴成焄，以及青龍獎影帝張東健、影后林秀晶，都驚喜現身為

  本片站台。此外還有朴星雄、孔敏貞、李有鎮、韓智恩、蔡元彬、申東美等實力派演員到

  場支持，星光璀璨令人目不暇給！同時，音樂圈也沒缺席，歌手邕聖祐、李鎮赫，

  ALL(H)OURS成員Kunho、Minje、Hyunbin，以及女團Lovelyz前成員鄭叡仁、劉智愛都紛紛

  登上紅毯，甜美、帥氣與成熟氣質相互交織，讓整場活動更像一場「這部電影，非看不可

  」的高調宣言！



  本片不只話題火熱，票房表現更是一騎絕塵！根據南韓電影票房綜合統計，截至21日上午

  ，本片已經連續三天穩坐預售榜首，並刷新今年整體預售票房最高紀錄。這項亮眼成績不

  僅展現觀眾對本片的高度期待，更預告一場結合磅礡世界觀與無限想像力的奇幻動作盛宴

  ，即將在大銀幕上引爆視聽震撼，成為今夏最不容錯過的觀影首選，幕幕精彩，刻刻讓人

  屏息以待。



  這部斥資300億韓圜年度最高預算打造，以別出心裁的劇情設定，搭配全球火紅的知名影

  星，成為觀眾引頸期盼的劃時代「東方奇幻」代表作的《全知讀者視角》，即將在本週三

  （7/23）晚場起於全台盛大獻映。原著漫畫由韓國人氣網路小說改編，至今在台灣累積觀

  看次數高達1.1億，並榮登2024年度十大人氣榜第二名，評分高達9.9分。目前《全知讀者

  視角》漫畫正於LINE WEBTOON平台每週一火熱連載中，漫畫連結：

  。本片劇情描述平凡上班族金獨子（安孝

  燮飾演），唯一嗜好是閱讀網路小說《在滅亡的世界中存活的三種方法》，不過在長達十

  年的連載期間，他卻成為小說最後的唯一讀者。當金獨子在地鐵車廂讀完小說最終話時，

  小說中的場景卻轉瞬成為現實。地鐵車廂彷彿成為人間煉獄，巨大怪物正踐踏著這座城市

  ，以及憑空出現在眼前的訊息－－「您收到了第一個主線任務。」緊接著，熟悉的小說角

  色紛紛登場，而那位無比強大、牽動著整個世界命運的小說主角劉眾赫（李敏鎬飾演），

  開始照著劇情一一行動。眼看熟悉的世界將不復返，一個嶄新的世界正在誕生，身為唯一

  知曉這個新世界結局的金獨子，將在升級自身能力的同時，與夥伴們打造出跟原本小說截

  然不同的結局…。



