url: https://www.ptt.cc/bbs/movie/M.1753870204.A.9C7.html
title: '[無雷] 全知讀者視角 非原作黨'
content: "我平常有追蹤一些影視的FB，\n\n看了好幾個電影粉專用「我獨自升級」的角度去推薦「全知讀者視角」\n\n加上一些新聞連結了「與神同行」製作團隊，\n\
  \n而我很喜歡與神同行，所以想說水準就在那裏，\n\n看完就算再不喜歡，應該也不至於雷\n\n所以在不懂「全知讀者視角」這六字是什麼意思的情況下\n\n也完全沒看任何劇情大綱，就買票入場了。\n\
  \n\n\n\n看完後我覺得電影票錢沒白花，我自己是覺得好看啦，是爽片。\n\n\n\n\n劇情緊湊，敘事方式淺顯易懂，沒什麼冷場\n\n白紙如我馬上能進入世界觀了解狀況\n\
  \n陪著主角明白了他過去的經歷，以及他現在遇到的事件\n\n整個價值觀的轉變，中間的邏輯一點都不聖母，我完全可以體會\n\n劇情很中二，但每個抉擇的背後又很現實。\n\
  \n\n\n最令人感動的是沒有一堆說教跟內心戲。\n\n\n\n\n很多運鏡構圖可以看得出是綠幕打到底\n\n我是看得很過癮，也感受得到演員用心（對著空氣硬幹很考驗演技）\n\
  \n我是韓劇迷，以前對安孝燮無感，這次有強烈感受到他的演技功力。\n\n\n\n\n看完後有特別搜尋這部片的背景，\n\n也有去YT看原作與電影版的差異，我能理解原作黨的不爽\n\
  \n大概瞭解一下了原作的細節，我也覺得在電影裡被省略很可惜\n\n但電影篇幅就是那樣，要夠大眾通俗大家都看懂，\n\n整個模型就是不太能塞這麼多資訊\n\n我覺得這應該就是電影編劇斟酌後的結果\n\
  \n\n\n\n但，我真心覺得原作黨不要太生氣\n\n如果不是這部電影，我也不會知道這部優秀的漫畫（很多人都跟我一樣）\n\n這就是這部電影存在的意義啊\n\n\
  像我很愛NANA這部漫畫，我看到改編也翻白眼\n\n可是若電影的改編能讓更多人接觸NANA這本漫畫、更多人接觸矢澤愛的作品\n\n我會很為原作者高興，而不會一直為電影與漫畫的落差憤恨不平\n\
  \n\n\n因為這類漫畫裡有很多細節，真的太沉重了\n\n沉重到沒有經歷過，就算照著漫畫出演，也不見得能看懂，很吃頻率。\n\n像全知讀者視角演到中後段，有一Part我心臟被爆擊，看了好想哭\n\
  \n雖然電影可能省去了很多細節，但是我有get到原作者想表達的意念\n\n因為我也經歷過啊\n\n而跟我一起去看電影的朋友，則不明白這部片哪個地方有哭點\n\n\
  所以即便電影改變不被原作黨認同，\n\n但我真心認為編劇是厲害的。\n\n\n\n\n\n總之，對這部片有興趣的人，就去享受這個世界觀想呈現的精采吧\n\n幾百塊買這樣的視覺特效不無聊，我覺得值啦\n\
  \n\n\n--\n\n    過期雜誌上登著太多早逝青春              \n    路人的嘴裡全是對別人生命的揣測\n             \
  \                 ──來不及。陳珊妮\n\n--\n拍成韓劇的成本一定很可觀，超期待XD\n\n好希望能由膽大黨動畫團隊來呈現（個人喜好）\n\
  \n覺得電影能呈現的範圍有點可惜，而且也吃力不討好\n像「哈利波特」就非常成功（我是哈利波特原作黨）\n如果原作黨跟一般人都願意買票入場的話不是更好嗎> <\n\
  \n真的\n\n不謎啊，各位原作黨還是可以生氣啊\n我都舉例了我也會不爽啊\n只是我後來站在其它角度，我就釋懷\n所以我只是提供一個想法給全知的原作黨而已：「站在推廣的角度可以別生氣」\n\
  生氣還要花力氣> <\n但若要選擇繼續不爽，很OK啊。\n\n哇咧，我完全不知道這小說與漫畫XD\n我對韓劇跟K-POP如數家珍，但小說漫畫完全沒涉獵。\n我非原作黨，是覺得電影改編得不錯，有被吸引XD\n\
  \n首爾之春嗎？感謝，我來找看看～\n我也覺得安的演技是好的！這部有改觀，期待他之後的作品\nJisoo在全球的地位已經不用管演技、也不靠演技了，所以我完全不評論哈哈哈哈\n\
  就當彩蛋看（？）\n\n韓國電影很好啊，也只有韓國電影讓我不怕雷XD\n\n期待動畫版啊啊啊啊>///<\n\n喔喔，不好意思，因為我看到的影評跟文章都是拿漫畫跟電影比\n\
  所以我以為漫畫就是原作，沒注意到小說才是原作，\n感謝資訊糾正。"
