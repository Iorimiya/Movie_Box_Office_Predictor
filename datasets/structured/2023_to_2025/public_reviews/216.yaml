url: https://www.ptt.cc/bbs/movie/M.1754357172.A.9D1.html
title: '[好無雷] 《全知讀者視角》意外好看誠意十足'
content: '這部上映前就有發現討論度非常高，對這部的片名沒什麼記憶點，片名實在讓人沒感覺，和人家介紹，都說片名看不懂什麼意思


  後來才知道原來是小說改編，一看到是小說改編，可想而知想必一定會有原著粉不滿或不爽，看過太多原著改編的，被原著粉攻擊，特別是小說


  果然還沒去看，就發現IMDb竟然只有4.4，太低了吧，點進去看果然是原著粉在刷負評，進來看電影版，也是一直講原著怎樣如何的


  我個人看電影追劇，管他是小說、電玩、漫畫改編，我就當作它是全新的作品來看


  好看就好了嘛，幹嘛一直糾結改的很爛，背離原作太多，現在好像只要有原作的，都要講幾句，表態有看過原著才能嘴幾句


  先說結論，這是部娛樂性很好，看完會覺得很滿意的作品


  就是一部科幻大作，滿滿的特效，幾乎佔了這部片90%以上，主角群們男的帥女的美，劇情以遊戲當主軸，然後開始打怪、升級、破關，節奏明快也無冷場


  聽我這樣的形容，就是部好片不是嗎？看完電影版卻是罵聲一片，不意外就是原著粉在不爽


  試著用完全不同的角度和心態去看，不好嗎？好看就好，想那麼多幹嘛


  真的就是好看的電影，至少是我這幾年看過，很滿意的韓國科幻片


  -----

  Sent from JPTT on my Samsung SM-S9310.


  --'
