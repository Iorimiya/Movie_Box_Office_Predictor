title: '[新聞]<全知讀者視角>版權銷售113國台灣最速上映'
content: '新聞網址：



  改編全球現象級網路小說與網路漫畫，由《與神同行》金牌製作團隊傾力打造，以大場面

  、大動作、大特效、大卡司引爆觀眾熱烈期待的奇幻動作鉅獻《全知讀者視角》，即將在

  7月23日（週三）晚場起於全台盛大獻映。本片未演先轟動，不僅在南韓一度以20.6%的預

  售率登上「票房預售榜」冠軍，海外版權更狂銷113個國家及地區，其中唯有台灣搶得領

  先地位，成為唯一與南韓同步、在海外第一個率先上映的地區。本片日前在韓舉辦媒體試

  映會，原著作者sing N song更現身力挺，並向導演金秉祐傳訊息感動表示：「我非常喜

  歡！」而全片精彩的特效場面更獲廣大韓媒好評盛讚，台灣片商也同步公開「第二波幕後

  製作訪談」花絮，直擊導演金炳祐率領的頂尖視覺特效與美術團隊，耗時打造全片約1500

  個畫面當中，多達約1300個特效畫面，合力將奇幻世界搬上大銀幕，突破視覺想像極限，

  讓觀眾期待值再度飆升！





  根據14日上午的南韓票房預售數據顯示，《全知讀者視角》以20.6%的預售率衝上票房預

  售榜首，不僅強勢超越《侏羅紀世界：重生》（Jurassic World Rebirth）、《超人》（

  Superman）等好萊塢熱門強片，更超越同期上映的《驚奇4超人：第一步》（The

  Fantastic Four: First Steps》、《我和我的殭屍女兒》等熱門影片，證明本片的期待

  熱度與話題實力。此外，斥資300億韓圜（約新台幣6.2億元）天價打造的這部電影，海外

  版權也在南韓上映前，確定狂銷到113個國家及地區，包括台灣、印尼、香港、泰國、新

  加坡、馬來西亞、澳洲、紐西蘭、美國、加拿大、越南等地，就連很少上映南韓電影的德

  國與奧地利等國也確定上映，未演先轟動。值得一提的是，台灣搶得領先地位，成為唯一

  與南韓同步、在海外第一個率先上映的地區，讓全台民眾不用等待，可以跟南韓觀眾同一

  天衝進戲院，體驗全片震撼的奇幻動作世界。





  《全知讀者視角》日前在南韓舉辦媒體試映會，獲得南韓媒體廣大好評。Joynews24盛讚

  ：「CG、動作快感爆破，有史以來最佳奇幻動作電影誕生！」經濟評論認證：「史上最刺

  激的電影體驗！」HERALD POP：「令人欣喜若狂的電影體驗，這就是電影院因此存在的原

  因！」Sports W：「投入感十足的動感動作盛宴！」TOPSTARNEWS：「宏大的世界觀與精

  彩刺激的動作！」EDAILY：「這就是我們今年夏天該去電影院的理由！」東亞體育報：「

  韓國奇幻新紀元，安孝燮再度擊出全壘打！」朝鮮體育報：「多巴胺成功加速狂奔！」文

  化新聞：「憑藉精彩的動作和震撼的視覺效果，讓觀影時間過得真快！」此外，本片原著

  作者sing N song更現身力挺，甚至觀賞後還向導演金秉祐傳訊息感動表示：「我非常喜

  歡！」一系列好評盛讚，讓本片無疑就是今夏衝進電影院的最強理由！





  據悉，《全知讀者視角》全片共計約1500個鏡頭，其中多達約1300個鏡頭使用CG特效，幾

  乎涵蓋全片，展現視覺特效團隊的極致投入與工藝極限，誓言打造一個前所未見的奇幻世

  界。在最新釋出的「第二波幕後製作訪談」花絮影片中，視效團隊揭露幕後秘辛，為追求

  現實與虛構之間的完美平衡，從細緻的設計如鬼怪「鼻荊」、主角金獨子的武器「折斷的

  信念」，到每一場怪物現身的鏡頭，都力求在虛構中保有真實感。即使場景設定在完全架

  空的幻想世界，角色的行動與情感卻絲毫不脫戲，成功突破現實與特效界限，構築出充滿

  沉浸感的視覺宇宙。



  此外，美術團隊與視覺特效團隊密切協作，共同打造全片關鍵場景與特殊空間，展現震撼

  視覺的同時，也讓觀眾自然融入故事。其中最具代表性的莫過於地鐵車廂與月台場景。身

  為全片重點場域，美術團隊力求極致還原，營造既寫實又充滿張力的氛圍。美術指導李穆

  元（音譯）透露，在地鐵車廂180度翻轉的動作場景中，團隊特別設計可以90度旋轉的萬

  向架，並精心考量列車的尺寸比例與材料質感，只為逼真呈現列車脫軌、撞擊與損壞的瞬

  間。而地鐵月台的設計也毫不馬虎，為了讓每一站都有獨特情緒與辨識度，他們巧妙地透

  過色調變化，為不同場景注入情感溫度與氛圍層次。從細節雕琢到整體布局，特效與美術

  的完美結合，讓本片不只是視覺饗宴，更是一場跨越虛實界線的沉浸式冒險！



  這部斥資300億韓圜年度最高預算打造，以別出心裁的劇情設定，搭配全球火紅的知名影

  星，成為觀眾引頸期盼的劃時代「東方奇幻」代表作的《全知讀者視角》，即將在7月23

  日（週三）晚場起於全台盛大獻映，即日起各大影城也已經開始預售。為了歡慶電影版即

  將上線，7/13至7/20期間，至LINE WEBTOON登入帳號觀看《全知讀者視角》漫畫即有機會

  獲得電影交換券、周邊套組及WEBTOON代幣！參加加碼活動，再抽中雙人電影交換券、角

  色收藏票券套組及100枚代幣，敬請把握機會！（活動連結：

  ）



  《全知讀者視角》電影劇情描述平凡上班族金獨子（安孝燮飾演），唯一嗜好是閱讀網路

  小說《在滅亡的世界中存活的三種方法》，不過在長達十年的連載期間，他卻成為小說最

  後的唯一讀者。當金獨子在地鐵車廂讀完小說最終話時，小說中的場景卻轉瞬成為現實。

  地鐵車廂彷彿成為人間煉獄，巨大怪物正踐踏著這座城市，以及憑空出現在眼前的訊息－

  －「您收到了第一個主線任務。」緊接著，熟悉的小說角色紛紛登場，而那位無比強大、

  牽動著整個世界命運的小說主角劉眾赫（李敏鎬飾演），開始照著劇情一一行動。眼看熟

  悉的世界將不復返，一個嶄新的世界正在誕生，身為唯一知曉這個新世界結局的金獨子，

  將在升級自身能力的同時，與夥伴們打造出跟原本小說截然不同的結局…。



