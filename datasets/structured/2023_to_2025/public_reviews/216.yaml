url: https://www.ptt.cc/bbs/movie/M.1749815682.A.AA2.html
title: '[新聞] 【全知讀者視角】七大主演分享演出心聲'
content: '新聞網址：



  改編超人氣網路小說與網路漫畫，由《與神同行》金牌製作團隊斥資300億韓圜（約新台

  幣6.2億元）天價打造，成為今年韓影規模最大、話題最強的電影鉅作《全知讀者視角》

  ，即將在7月磅礡登上全台大銀幕！台灣發行商「采昌國際多媒體」日前釋出台灣版前導

  預告，短短24小時內即突破百萬觀看次數，掀起爆炸性關注與熱烈討論。今日（6/13）更

  進一步公開由安孝燮、李敏鎬、蔡秀彬、申承浩、NANA、BLACKPINK成員JISOO，以及童星

  權恩成等豪華卡司的角色劇照與演出感言，燃起粉絲期待新高！首度擔綱電影主演的安孝

  燮，從外型到細膩情感，用眼神與語調詮釋出極具共鳴的主角魅力，他表示：「我想表現

  出讓所有人都產生共鳴的角色模樣。」而「九頭身男神」李敏鎬，更為本片睽違十年重返

  大銀幕，並全力投入高難度動作戲：「我尤其花費很多心思在動作、眼神、表情的呈現上

  。」在這群黃金卡司的精彩演出下，讓本片除了震撼視覺的高規格製作，更將凝聚命運交

  織的深刻人物情感，成為今年暑假最不容錯過的超級鉅獻！





  被譽為「年度韓影霸主」的《全知讀者視角》，講述一部連載多年的小說，故事在完結當

  天竟離奇成真。唯一堅持看到結局的讀者「金獨子」，被迫與小說中的主角「劉眾赫」等

  人聯手，在崩壞的末日世界中絕地求生。這部備受期待的年度大作，不僅由演出《浪漫醫

  生金師傅》、《社內相親》等人氣劇集的大勢演員安孝燮首度挑戰大銀幕主演，更憑藉他

  細膩的演技與深邃眼神，牢牢抓住觀眾的心。尤其他飾演一個平凡但堅強的角色，讓他坦

  言：「我希望表現出讓所有人都產生共鳴、那平凡的金獨子，以及想和獨子一起呈現大家

  攜手成長的模樣。」他更透露，從角色外型、表情、語調到視線，都經過反覆打磨：「我

  跟導演進行相當多的討論，在角色研究上花費許多時間，也一直針對動作進行訓練。」如

  此用心的準備，讓人對他在銀幕上的表現期待不已。



  而在《江南1970》後，專注於電視劇跟串流平台作品的李敏鎬，也透過本片宣告他睽違十

  年的大銀幕華麗回歸。他在片中飾演小說《在滅亡的世界中存活的三種方法》主角「劉眾

  赫」，擁有死亡後能重啟的回歸能力，是充滿壓倒性實力與堅韌意志的完美男人。李敏鎬

  從一登場便以強烈存在感緊抓目光，帶來複雜情感與震撼動作場面，讓觀眾完全沉浸其中

  。為了完美詮釋，他也進行數個月的高強度動作訓練，並分享：「我思考許多關於一個在

  永生中獨自生存的人類的孤獨感。因為他是一個不斷戰鬥的角色，所以我在動作戲準備上

  投注大量心血。我必須透過劉眾赫來展現這個世界觀，我認為他必須真實，這樣獨子在克

  服這個世界觀危機的過程中，才會讓人信服。我尤其花費很多心思在動作、眼神、表情上

  ，如何讓它們不顯得過度誇張與虛假。」一席話也讓人期待他將如何帶領觀眾，深入這個

  危機四伏的世界觀，感受角色的掙扎與成長。





  除了李敏鎬和安孝燮，《全知讀者視角》更集結蔡秀彬、申承浩、NANA、BLACKPINK成員

  JISOO，以及童星權恩成等超強卡司，打造視覺與演技兼具的盛宴。曾以《現在撥打的電

  話》等作品贏得觀眾喜愛的蔡秀彬，在片中飾演跟金獨子共事的職場同事「劉尚雅」，面

  對小說世界成真所帶來的危機，她表示：「雖然她是眾多角色當中，最能做出現實判斷的

  人，但我努力讓她看起來不讓人討厭。尚雅也是一個能幫助他人成長的角色，這就是她的

  魅力所在。」而以《18歲的瞬間》打開知名度的申承浩，則化身擁有堅韌力量和超強防禦

  力的軍人「李賢誠」，他表示：「這是個充滿腎上腺素的角色，當作品要電影化的時候，

  我就對它抱有很高期待。」他將利用自己的強健體魄與硬派動作戲，為觀眾呈現不容錯過

  的震撼演出。



  曾在《假面女郎》等作品中展現獨特氣質的NANA，飾演因為金獨子幫助而倖存，並為正義

  奮戰的「鄭熙媛」，她分享：「平凡人們攜手拯救世界的模樣，讓我覺得非常有魅力。熙

  媛是個能展現俐落、華麗動作的角色。我挑戰了很多高難度動作，尤其在吊鋼絲時非常驚

  險刺激，我努力把每個動作的線條與力量展現得淋漓盡致。」至於BLACKPINK成員JISOO，

  則飾演將劉眾赫視為師父的高中生「李智慧」，她坦言：「智慧是個能快速掌握現實、靈

  活應對情況的角色，我努力展現她這樣的判斷力。由於角色設定，我獨自拍攝的場景很多

  ，但與其說是遺憾，不如說可以很好地展現出角色個性。」JISOO也將透過這次演出，展

  現前所未見的強烈魅力。而以《山茶花開時》備受矚目的童星權恩成，則飾演能跟昆蟲溝

  通的少年「李吉永」，可說是全片的活力吉祥物。他透露可愛的幕後花絮：「吉永最大的

  魅力是可愛與自信，每當導演指導時，都會先詢問我的想法，這才誕生出我這角色的招牌

  動作。」讓人相當期待他在片中充滿生命力的精彩表現。



  這部改編自轟動全球奇幻IP大作，斥資300億韓圜年度最高預算打造，以別出心裁的劇情

  設定，搭配全球火紅的知名影星，成為觀眾引頸期盼的劃時代「東方奇幻」代表作的《全

  知讀者視角》，即將在今年7月於全台盛大獻映。本片劇情描述平凡上班族金獨子（安孝

  燮飾演），唯一嗜好是閱讀網路小說《在滅亡的世界中存活的三種方法》，不過在長達十

  年的連載期間，他卻是這個小說的唯一讀者。當金獨子在地鐵車廂讀完小說最終話時，小

  說中的場景卻轉瞬成為現實。地鐵車廂彷彿成為人間煉獄，巨大怪物正踐踏著這座城市，

  以及憑空出現在眼前的訊息－－「您收到了第一個主線任務。」緊接著，熟悉的小說角色

  紛紛登場，而那個無比強大、牽動著整個世界命運的小說主角劉眾赫（李敏鎬飾演），開

  始照著劇情一一行動。眼看熟悉的世界將不復返，一個嶄新的世界正在誕生，身為唯一知

  曉這個新世界結局的金獨子，將在升級自身能力的同時，打造出與原本小說截然不同的結

