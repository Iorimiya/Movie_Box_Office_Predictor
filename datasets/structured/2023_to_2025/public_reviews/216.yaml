url: https://www.ptt.cc/bbs/movie/M.1747142772.A.F7E.html
title: '[新聞] 【全知讀者視角】3大角色全新亮相掀話題'
content: '新聞網址：



  改編超人氣網路小說與網漫、斥資高達300億韓圜（約新台幣6.2億元）天價打造，成為今

  年至今韓影最高預算之作的《全知讀者視角》，即將在今年7月席捲全台大銀幕。安孝燮

  、李敏鎬、蔡秀彬、申承浩、NANA，以及BLACKPINK成員JISOO共組頂級夢幻卡司，一字排

  開，話題爆棚。片商也順勢公開角色海報，展現出角色們獨一無二的魅力與壓倒性氣場，

  超高還原度也引發粉絲瘋傳討論。至於同步釋出的「前導預告#2」，更首度曝光由童星權

  恩成飾演的「李吉永」、詭譎神秘的鬼怪「鼻荊」，以及震撼登場的怪物「魚龍」等角色

  造型，完美展現原著世界觀的磅礡與震撼視覺，讓無數讀者與影迷熱血沸騰、期待值爆表

  ，絕對是今夏最不容錯過的奇幻動作鉅獻！






  《全知讀者視角》故事講述一部連載多年的小說，在完結當天，內容竟離奇成真，唯一堅

  持看到結局的讀者「金獨子」，必須與小說中的主角「劉眾赫」等人，一同在崩壞的末日

  世界中絕地求生。在最新曝光的七款角色海報當中，強烈視覺衝擊與角色魅力瞬間掀起網

  路熱議，演員們的神級還原度與壓倒性氣場，更掀起粉絲瘋狂熱議！由安孝燮飾演的主角

  「金獨子」，以犀利眼神與臉上傷痕，配上緊閉的雙脣，搭配「我是唯一知道這個世界結

  局的人」台詞，體現出陷入孤獨和緊張感的人物內心世界。李敏鎬飾演的「劉眾赫」則撐

  著劍、以銳利眼神提問「為什麼世界會變成這樣呢？」引發觀眾對角色命運的無限好奇。



  蔡秀彬則飾演與獨子同為上班族的「劉尚雅」，也掩飾不住驚慌失措的表情大呼：「在這

  裡，每天都要這樣打架嗎？」再到她不得不拿起武器面對未知敵人，完美呈現從普通人成

  為女戰士的蛻變。由申承浩飾演的「李賢誠」，雖然好奇地對獨子說：「你怎麼會知道那

  麼多事情呢？」後來也逐漸對獨子展現信賴，成為獨子一行人的可靠戰力支援。而由NANA

  飾演為正義而戰的「鄭熙媛」，以一句「還剩一隻怪物，那傢伙自己都不想當人了」震撼

  登場，強烈眼神也似乎埋藏不為人知的過去，令人想一探究竟。至於BLACKPINK成員JISOO

  飾演視劉眾赫為師的高中生「李智慧」，一針見血地指出：「這個世界，只有強者才能生

  存。」對情感毫無波動的她，究竟有著怎樣的故事？最後則是首度曝光的新角色形象，由

  童星權恩成飾演的少年「李吉永」，擁有與昆蟲溝通的能力，純真無畏地高喊：「我也想

  跟那些怪物戰鬥！」展現出讓人驚喜的存在感與活躍度，令人眼睛一亮。





  作為南韓今夏最早定檔、話題火力最強的話題大片，《全知讀者視角》宣布製作真人電影

  以來，從選角陣容、開拍現場、上映資訊到角色造型，每波更新都引爆熱議。這部斥資

  300億韓圜打造的奇幻動作鉅獻，即將帶領觀眾踏入一個前所未有的末日世界！在最新公

  開的「前導預告#2」當中，更進一步揭露驚人的世界觀，以及令人屏息的劇情展開，讓人

  完全無法移開視線。預告一開始，原本只是平凡上班族的「金獨子」，在下班途中搭乘地

  鐵，赫然發現自己熟悉的小說世界竟然成真。隨著「現在開始，將開啟收費服務」的冷酷

  宣告響起，他驚覺一切正是那部小說的開場，而現實瞬間崩塌。可怕的鬼怪「鼻荊」現身

  ，向乘客宣告第一項主線任務：「請殺死一個以上的生命體」，讓地鐵車廂頓時陷入瘋狂

  。平凡的生活被撕裂，取而代之是唯有殺戮才能生存的殘酷新世界。



  當獨子與小說主角「劉眾赫」初次相遇，對方卻不屑地說出：「活著撐到忠武路吧。」這

  句挑釁點燃雙方的衝突火花，隨後畫面急轉至獨子被拋下大橋，巨型怪物「魚龍」躍出水

  面、張口撲來，場面張力爆棚、視覺震撼直逼好萊塢超級大片等級。隨著更多角色陸續現

  身，緊湊剪輯與精緻特效讓人目不轉睛，也讓網友熱烈迴響：「安孝燮的氣場直接炸裂銀

  幕！」「李敏鎬的動作戲太帥，根本電影主角天花板！」「那隻怪物也太狂了吧！」「每

  個角色登場都超帥超有戲！」



  這部改編自轟動全球奇幻IP大作，斥資300億韓圜年度最高預算打造，以別出心裁的劇情

  設定，搭配全球火紅的知名影星，成為觀眾引頸期盼的劃時代「東方奇幻」代表作的《全

  知讀者視角》，即將在今年7月於全台盛大獻映。本片劇情描述平凡上班族金獨子（安孝

  燮飾演），唯一嗜好是閱讀網路小說《在滅亡的世界中存活的三種方法》，不過在長達十

  年的連載期間，他卻是這個小說的唯一讀者。當金獨子在地鐵車廂讀完小說最終話時，小

  說中的場景卻轉瞬成為現實。地鐵車廂彷彿成為人間煉獄，巨大怪物正踐踏著這座城市，

  以及憑空出現在眼前的訊息－－「您收到了第一個主線任務。」緊接著，熟悉的小說角色

  紛紛登場，而那個無比強大、牽動著整個世界命運的小說主角劉眾赫（李敏鎬飾演），開

  始照著劇情一一行動。眼看熟悉的世界將不復返，一個嶄新的世界正在誕生，身為唯一知

  曉這個新世界結局的金獨子，將在升級自身能力的同時，打造出與原本小說截然不同的結

  局…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
