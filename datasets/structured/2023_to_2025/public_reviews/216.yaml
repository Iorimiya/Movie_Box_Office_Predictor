title: '[新聞] 北捷營運29年為【全知讀者視角】首開先例'
content: '新聞網址：



  改編全球現象級網路小說與網路漫畫，由《與神同行》金牌製作團隊傾力打造，以大場面

  、大動作、大特效、大卡司引爆觀眾熱烈期待的奇幻動作鉅獻《全知讀者視角》，為了慶

  祝本片即將在7月23日（週三）晚場起於全台盛大獻映，臺北捷運從即日起，在板南線推

  出期間限定的「全知讀者列車」，並持續運行至8月6日為止，讓安孝燮、李敏鎬、蔡秀彬

  、申承浩、NANA、BLACKPINK成員JISOO等主要演員陪伴民眾一起搭捷運。不僅如此，從本

  週五（7/11）起連續四週的星期五、六、日，北捷更將加碼在本列車中，放送電影專屬到

  站廣播與LED跑馬燈，更是北捷營運29年來，前所未有的全新嘗試！此外，除了主要演員

  之外，片商今日（7/10）也公佈追加卡司，透過朴號山（又譯朴呼山）、崔永葰、鄭星一

  （又譯鄭成日）三位展現獨特色彩的演技派男星，為全片增添活力。





  《全知讀者視角》講述一部連載十多年的小說，故事在結局當天突然成為現實，而這一切

  ，都發生在行駛於東湖大橋上的地鐵車廂內，也讓小說的唯一讀者「金獨子」，必須與小

  說主角「劉眾赫」與夥伴們，必須聯手在這個即將毀滅的世界中努力求生。由於全片第一

  個關鍵事件，就發生在地鐵車廂當中，所以本片也與臺北捷運展開超乎想像的跨界合作─

  ─自即日起至8月6日止，於板南線推出限時限定的「全知讀者列車」！本次聯名列車的每

  節車廂，不僅將佈滿電影主視覺海報，手拉環也將變身成各角色專屬視覺設計，讓乘客享

  有跟安孝燮、李敏鎬、蔡秀彬、申承浩、NANA、JISOO等主要演員「共乘捷運」的沉浸式

  體驗。而且不只視覺有感，北捷這回更將加碼驚喜彩蛋，從本週五（7/11）起連續四週的

  星期五、六、日，將在這台「全知讀者列車」的進站廣播，全面變「聲」成電影片呼，搭

  配LED螢幕同步播放電影跑馬燈，打造獨一無二的視聽雙重體驗，歡迎影迷上車朝聖！





  值得一提的是，除了安孝燮、李敏鎬、蔡秀彬、申承浩、NANA、JISOO等主要演員之外，

  《全知讀者視角》更網羅無論遇到什麼樣的角色，都能展現獨特色彩，讓作品更加閃耀的

  朴號山（又譯朴呼山）、崔永葰、鄭星一（又譯鄭成日）三位男星加盟演出。透過《我的

  大叔》、《機智牢房生活》等戲劇證明出色演技實力的朴號山，這回在片中飾演當小說世

  界成為現實之後，擁有比幣值更重要的綠色安全區，並利用手中握有的權力來累積幣值的

  角色「孔弼斗」。當主角金獨子出現在他面前，並向他提出超乎想像的提議後，勢必將大

  幅提升全片的觀賞樂趣。



  曾在《機智醫生生活》、《京城怪物》等眾多作品中展現優秀演技的崔永葰，則在片中飾

  演金獨子跟劉尚雅的公司主管「韓明武」，同時也被捲入小說成真的世界當中。尤其他這

  回將展現角色的嘮叨形象，並為了維護自己的地位，在絕望的情況下採取自私行動，勢必

  將點燃觀眾心中的怒火。此外，以《黑暗榮耀》廣為觀眾熟知的鄭星一，這回也將詮釋議

  員「千仁浩」，並精湛演繹角色在溫柔和堅實領導能力背後，所隱藏的雙面人角色，更將

  與追隨他的民眾，共同把金獨子和夥伴們推向危險情況，增加全片緊張感。透過這三位無

  論什麼角色都能展現獨特色彩的演技派男星，勢必將為全片增添活力，讓人更加期待。



  這部斥資300億韓圜年度最高預算打造，以別出心裁的劇情設定，搭配全球火紅的知名影

  星，成為觀眾引頸期盼的劃時代「東方奇幻」代表作的《全知讀者視角》，即將在7月23

  日（週三）晚場起於全台盛大獻映。而這部科幻殿堂級神作，原著漫畫由韓國人氣網路小

  說改編，至今在台灣累積觀看次數高達1.1億，並榮登2024年度十大人氣榜第二名，評分

  高達9.9分。目前《全知讀者視角》漫畫正於LINE WEBTOON平台每週一火熱連載中（

  ）。



  《全知讀者視角》電影劇情描述平凡上班族金獨子（安孝燮飾演），唯一嗜好是閱讀網路

  小說《在滅亡的世界中存活的三種方法》，不過在長達十年的連載期間，他卻成為小說最

  後的唯一讀者。當金獨子在地鐵車廂讀完小說最終話時，小說中的場景卻轉瞬成為現實。

  地鐵車廂彷彿成為人間煉獄，巨大怪物正踐踏著這座城市，以及憑空出現在眼前的訊息－

  －「您收到了第一個主線任務。」緊接著，熟悉的小說角色紛紛登場，而那位無比強大、

  牽動著整個世界命運的小說主角劉眾赫（李敏鎬飾演），開始照著劇情一一行動。眼看熟

  悉的世界將不復返，一個嶄新的世界正在誕生，身為唯一知曉這個新世界結局的金獨子，

  將在升級自身能力的同時，與夥伴們打造出跟原本小說截然不同的結局…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
