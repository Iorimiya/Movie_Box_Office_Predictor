url: https://www.ptt.cc/bbs/movie/M.1753365081.A.FED.html
title: '[好雷]《全知讀者視角》，一本給新觀眾的新手指'
content: '部落格版：


  先說結論，《全知讀者視角》特效沒話說，劇情相當中二，能滿足並點燃對過去網遊小說

  、漫畫世界有所嚮往的觀眾心裡尚未熄滅的中二魂，例如我。我認為相當有趣的一點是，

  主角金獨子獲得了他所喜愛的小說原作者賦予了能夠「改寫故事」的能力，從而進入了小

  說裡的世界、或者說是小說中的情節於現實真實上演，讓他有了改寫結局的機會。某方面

  來看，這確實也給了曾經幻想過自己是故事主角，幻想過如果是自己在面對任務關卡「自

  己會怎麼做」，幻想過如果是自己在角色接連登場時「會選擇誰當夥伴」，幻想過如果自

  己是作者「會讓故事怎麼發展」，《全知讀者視角》讓許多的幻想有了實現的可能。


  《全知讀者視角》改編自韓國作家夫婦sing N song於2018年至2020年所連載的同名小說

  ，後由UMI與Sleepy-C改編成Webtoon漫畫。我自己事前完全沒看過小說與漫畫，對於電影

  版的《全知讀者視角》是在接受範圍內，有稍微大致上於網路上翻找了些評論與參考維基

  百科，先撇除掉主角群的人物設定與故事背景的改動，《全知讀者視角》顯然還有東西可

  以說，而這些東西我認為是幾部電影時間都說不完的，所以能夠感覺到電影版為了篇幅與

  顧及到沒看過小說與漫畫的新觀眾刪減了不少，畢竟我實在不覺得就算真的如傳言中拍成

  五部曲，這龐大的世界觀與故事能被完整的呈現。當然這樣的電影發展推測，對舊讀者而

  言想必會是失望的一次改編，不過對於我這樣的新觀眾來說，《全知讀者視角》是非常容

  易入口的。



  由《恐怖攻擊直播》導演金秉祐所執導的《全知讀者視角》像是一本帶領新觀眾進入這部

  小說《在滅亡的世界中存活的三種方法》的新手指南。由現實世界裡的主角金獨子，利用

  他早已知道整部《滅活法》的全知視角，替觀眾稍加解釋了這個世界，那些他口中的「鬼

  怪」、「星座」、「技能」、「幣」等等是怎麼回事、怎麼使用，還有最重要的「主線任

  務」、「支線任務」甚至是「隱藏任務」該怎麼破解。而當金獨子開始意識到《滅活法》

  世界開始因受到他影響而改變時，金獨子首要目標便是扭轉原作中僅有「主角」劉眾赫存

  活下來的結局，於是他開始嘗試著要和劉眾赫合作，並且試圖阻止他在一次任務中死去造

  成世界再度回歸起點。在金獨子抵達劉眾赫會死去的關卡前，便是藉由行動來讓觀眾認識

  他身邊的夥伴，不論是現實世界裡的尚雅、賢誠、吉永，或是遊戲裡的角色熙媛、智慧、

  孔弼斗等，提到他們的能力與過去，即使不算特別詳盡，觀眾也能對他們有些初步了解。



  「為了自己活下來，無法避免某人的犧牲。」


  《全知讀者視角》很好的達成首部曲的目的，將《滅活法》的故事從無開始在陌生的觀眾

  眼前重新建構。此外，電影也清楚傳達出了訊息給予觀眾，那同時也是金獨子期待的理想

  。過去經歷過朋友的犧牲才讓自己免於繼續遭到霸凌，如同小說裡的劉眾赫踩著同伴的屍

  體闖到最後，從小說裡他體悟到所謂的活著都是伴隨著有人的犧牲，然而現實生活裡的他

  卻因此承受著孤獨與痛苦，於是他逐漸無法認同小說的發展，不想再讓小說的結局帶給他

  世界就是如此運轉的錯覺。所以當他開始改變《滅活法》劇情走向，他的每一步都是以能

  讓所有人存活為優先考量，即便中間金獨子曾一度瞞著其他人搶佔一格能使他倖存的綠格

  子，可他最後依然選擇與夥伴共赴生死。事實上，從最初的任務一到電影結束前的任務三

  ，每個任務都有漏洞可鑽，而這些漏洞往往都能讓所有人活下來，不難察覺其所藏著的寓

  意。


  雖然難免設定上會讓人想到《關於我轉生變成史萊姆這檔事》主角利姆路坦派斯特那樣擁

  有逆天的能力，幾乎當自己缺少什麼能力或者即將要被打敗，就能獲得獲得與之抗衡的能

  力逆轉局勢，《全知讀者視角》畢竟是建立在「能讓主角自己來寫故事」之上，所以過程

  中多少會給人種「主角光環威能」稍微過強的錯覺，但不至於看不下去。《全知讀者視角

  》節奏緊湊、娛樂性十足，有著充滿電玩感的劇情主線，拿來當作休假消遣的爆米花電影

  已足矣，首集較為缺乏的情感戲份，相信會在之後的續集如《與神同行》系列那樣交代更

  多主角群的故事後補上。最後談到演員表現，除了飾演主角金獨子的宋孝燮有最多的篇幅

  與發揮空間外，基本上其他幾位配角群都很可惜的稍微樣板化，是各司其職但沒什麼太大

  亮點，而飾演劉眾赫的李敏鎬更是一個招式一個表情演到底，完全站在那裡負責帥的花瓶

  角色，感到浪費的同時也期待續集開始與金獨子等人合作後有更多表現。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
