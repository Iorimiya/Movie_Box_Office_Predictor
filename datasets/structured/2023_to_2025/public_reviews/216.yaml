title: '[新聞] 【全知讀者視角】演員訪談親揭角色內心'
content: '新聞網址：



  改編全球火紅網路小說與網路漫畫，由《與神同行》金牌製作團隊打造，以大場面、大動

  作、大特效、大卡司引爆觀眾熱烈期待的奇幻動作鉅獻《全知讀者視角》，台灣片商今日

  （6/30）公佈第二波充滿強烈視覺張力的角色海報，以及精彩演員訪談花絮，透過安孝燮

  、李敏鎬、蔡秀彬、申承浩、NANA、BLACKPINK成員JISOO、權恩成等主要演員現身說法，

  講述各自角色的幕後故事，以及對演出本片的真摯情感，讓人對即將在7月23日（週三）

  晚場起於全台盛大獻映的這部話題鉅片更加充滿期待。






  《全知讀者視角》講述連載超過十年的小說故事，竟在完結當天在現實世界中成為現實，

  讓小說連載到最後的唯一讀者「金獨子」，與小說主角「劉眾赫」跟夥伴們，試圖在這已

  然崩毀的世界中存活下來，並試圖改寫小說原本的結局。在今日（6/30）公開的第二波角

  色海報當中，演員們以完美融入角色的強烈形象，捕捉到人物的精彩動作與神情，增添觀

  賞的期待與樂趣。在最新曝光的「演員訪談花絮」當中，飾演平凡男主角「金獨子」的安

  孝燮表示：「我想詮釋可以引發共鳴的平凡角色。」他透露自己為刻畫角色的成長付出相

  當大心思，尤其角色只是個普通上班族，卻被逼著與夥伴們一起試圖改寫小說結局。導演

  金秉祐也透露安孝燮絕對是角色不二人選：「他兼具平凡和獨特性。」安孝燮也補充：「

  我覺得『獨子』是我至今演過最貼近現實的角色，在獨子不斷做出選擇並成長的過程當中

  ，我希望觀眾也能融入角色，感受到自己成為主角、變得特別的那種體驗。」



  而飾演小說主角「劉眾赫」的李敏鎬，也分享自己緊張的準備過程：「這個角色要很真實

  ，這樣獨子和他的夥伴，在這世界觀中所做的一切才具有說服力，這也是我最費心的部分

  。」他並補充：「因為他是持續戰鬥的角色，所以我對每個打鬥動作、眼神、表情都花了

  很多心思。」尤其他的角色是擁有回歸能力的不死戰士，並在過程中經歷無數次回歸，不

  過長期承受回歸和死亡現實的他，也因此變得憤世嫉俗，李敏鎬對此表示：「對我來說，

  最重要的是我在不同時間點所感受到的情感，以及想要傳達的內容，是否也能體現在作品

  當中。我對這個角色在失去許多人、心靈受傷的同時，仍能在小說世界裡堅強活下去的模

  樣感到非常感動。」而隨著故事中「金獨子」現身，他的心境將會發生什麼樣的轉變，也

  值得觀眾拭目以待。





  在最新曝光的《全知讀者視角》演員訪談花絮當中，飾演「劉尚雅」的蔡秀彬透露角色最

  大魅力：「她是最現實的角色，是足以成為某人墊腳石，協助他人一躍而上的那種角色。

  」蔡秀彬也將以獨特的可愛魅力與扎實演技，強化角色的協同效應。至於飾演軍人「李賢

  誠」的申承浩表示：「他給予獨子很大協助，我試圖透過表情和動作呈現出來，是為了保

  護夥伴，腎上腺素會飆升的人物。」申承浩將以壓倒性的體格和細膩表情，為角色注入生

  命力，並完美平衡強勁的動作場面，以及細膩的情感演繹，勢必將給觀眾留下深刻印象

  。



  另一方面，飾演為正義而戰「鄭熙媛」一角的NANA，這回也將以「動作女王」嶄新形象亮

  相，吸引觀眾視線：「她是和金獨子一行人，為了正義奮不顧身、勇往直前的人物。主要

  武器是短刀，動作非常敏捷，展現出華麗的武打技術，直到最後不只配合武打動作，也加

  入吊鋼絲動作，讓我覺得很有趣也很困難，非常有快感。」而在片中化身追隨劉眾赫、能

  迅速掌握情況的高中生「李智慧」一角的JISOO則說：「我們針對角色成長背景進行很多

  討論，我想呈現她快速掌握和解決眼前問題的模樣。」一席話展現她對演出的熱誠。而飾

  演可以跟昆蟲溝通的少年「李吉永」一角的權恩成則爽朗表示：「吉永多虧獨子哥哥活了

  下來，一起完成任務。」他將以如維他命般的活力，成為全片最療癒的吉祥物角色。



  這部改編自轟動全球奇幻IP大作，斥資300億韓圜年度最高預算打造，以別出心裁的劇情

  設定，搭配全球火紅的知名影星，成為觀眾引頸期盼的劃時代「東方奇幻」代表作的《全

  知讀者視角》，即將在7月23日（週三）晚場起於全台盛大獻映。本片劇情描述平凡上班

  族金獨子（安孝燮飾演），唯一嗜好是閱讀網路小說《在滅亡的世界中存活的三種方法》

  ，不過在長達十年的連載期間，他卻成為小說最後的唯一讀者。當金獨子在地鐵車廂讀完

  小說最終話時，小說中的場景卻轉瞬成為現實。地鐵車廂彷彿成為人間煉獄，巨大怪物正

  踐踏著這座城市，以及憑空出現在眼前的訊息－－「您收到了第一個主線任務。」緊接著

  ，熟悉的小說角色紛紛登場，而那位無比強大、牽動著整個世界命運的小說主角劉眾赫（

  李敏鎬飾演），開始照著劇情一一行動。眼看熟悉的世界將不復返，一個嶄新的世界正在

  誕生，身為唯一知曉這個新世界結局的金獨子，將在升級自身能力的同時，與夥伴們打造

  出跟原本小說截然不同的結局…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
