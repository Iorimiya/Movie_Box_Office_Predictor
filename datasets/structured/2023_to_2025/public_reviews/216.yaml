title: '[情報] 電影《全知讀者視角》傳邀約李敏鎬安孝燮'
content: '電影《全知讀者視角》傳邀約李敏鎬、安孝燮出演雙男主！全網激動：這選角我先贊助百

  萬coin


  By Chloe Chen on 04 May 2023 Senior Digital Editor


  在韓國銷售破百億韓元、僅看一話就被封為「神作」的《全知讀者視角》，自去年傳出將

  翻拍成真人版電影後便引起高度關注，隨著網友的假想名單頻傳，關於該作將何人演出雙

  男主也在近日有了最新消息。據韓國媒體報導，李敏鎬與安孝燮兩大頂流韓星已收到提案

  邀約，有望出演「金獨子」與「劉眾赫」兩大角色！




  人氣小說、網漫《全知讀者視角》


  當小說中的世界成為現實時，會發生什麼事？畢業於三流大學的金獨子，是間大企業的約

  聘員工，平凡的他沒什麼大作為，唯一的興趣就是在通勤時看網路小說。某天獨子在車上

  看著沒什麼人氣，只有自己看到最後一話的《在滅亡的世界中存活的三種方法》（簡稱《

  滅活法》）時，巧遇在公司最受歡迎的同事劉尚雅，兩人閒聊過程中突然發現「世界」變

  了，電車上出現神秘「鬼怪」將車內乘客殺死，而電車外的世界則充斥各種珍奇異獸，這

  一切的一切彷彿......末日來臨！




  在眾人驚慌失措時唯有獨子想的與大家不同，因為他發現現在面臨的狀況，與自己連續讀

  了10年的小說《滅活法》內容一模一樣！彷彿小說中的劇情就這樣出現在現實中，又或者

  說現實就是小說......？而這部連載10年的網路小說，只有自己一個人看到最後，那在這

  樣的「條件」下，自己是不是能憑藉「已知劇情」的優勢存活下來？與此同時，一名男子

  隨著事件的演進與獨子漸漸有了交集，而他正是《滅活法》中的男主角「劉眾赫」！究竟

  這兩人會擦出什麼樣的火花？




  《全知讀者視角》將翻拍成真人版電影


  於2018年連載、由韓國作家sing N song所創作的網路小說《全知讀者視角》在連載期間

  創下百億韓元傲人成績，是非常知名的作品。該作在2020年被改編成同名網漫，不少讀者

  觀看時直接給予「看第一話就知道是神作」的高評論，而《全知讀者視角》自連載後一直

  是LINE WEBTOON上的人氣作品，幾乎可說是無人不知無人不曉般的存在。去年韓國媒體報

  導《全知讀者視角》將翻拍成真人版電影，並投入200億韓元製作費，由《恐怖攻擊直播

  》的金秉祐導演執導與《與神同行》製作公司聯手合作，而眾人最想知道的演員名單也在

  近日有了新情報釋出。




  有望由李敏鎬、安孝燮出演雙男主


  據了解，李敏鎬與安孝燮皆收到《全知讀者視角》出演提案邀約，而兩人的經紀公司也證

  實有收到提案，但還處於討論階段尚未定案。若邀約成功，安孝燮將飾演男主角「金獨子

  」，是將《滅和法》小說閱讀完的人，並利用提前知道劇情安排的優勢，想辦法在末日中

  活下。而李敏鎬則飾演《滅活法》中的男主角「劉眾赫」，是名反覆「回歸」的人物，試

  圖用過往的回歸經驗生存下來。（值得注意的是若確定出演，該作將成為安孝燮首部電影

  作品）


  《全知讀者視角》有望由李敏鎬、安孝燮出演雙男主



  在此邀約消息傳出前，網路上就傳出不少男主角的假想名單，以金獨子為例便有任時完、

  姜河那、朴寶劍、車銀優與崔宇植等人選，而劉眾赫的名單則為李棟旭、姜棟元、李俊赫

  、李洙赫、徐康俊等人。


  --'
