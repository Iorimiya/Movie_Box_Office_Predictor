title: '[好雷] 全知讀者視角.爆炸好看(沒看過原著）'
content: '我不是小說迷，漫畫迷，單純看預告很熱血，完全空白去看。


  首日也在威秀加買餐點，拿到四張海報跟兩張小卡，滿超值的。


  先說結論：本片排在今年我的第一名。

  劇情緊湊，特效，演員都是水準之上。


  如果超人.F4都無法滿足你，也沒看過原著，那這部絕對可以。





  -----------------------------防雷--------------------



  一本人氣開高走低的小說，剩最後一個忠實讀者：金獨子。


  身為社畜的他，唯一的娛樂消遣就是看（滅活法）：


  裡面的主角劉眾赫在一個充滿險惡與怪獸的世界搏鬥，他有一群團結的好夥伴，每個都有

  特別的能力，但面對強悍的敵人，一個一個的都被消滅。


  劉眾赫因著有復活的技能，屢敗屢戰的重開機，最後終於戰勝，成為獨活者，也成了最孤

  獨的勇者。


  金獨子把自己跟劉眾赫做連結，現實中他有一段卑微且黑暗的青少年時期，是校園霸凌的

  受害者，在一次被迫跟同學PK互毆勝利後，同學受不了自殺了。


  所以，小說裡劉眾赫能不斷復活，並保護同伴的力量，給他許多活下去的力量。


  可惜，滅活法的結局，是如此的無力感與孤單，金獨子覺得爛透了，因為自己生活的動力

  沒了，世界再沒有光明。


  就在他失望之際，小說的作者直接私訊他：你要不要自己寫想要的結局啊？


  同時，他搭的列車突然遭攻擊，一個不知名的虛擬角色說：現在你們要限時完成任務，完

  成就能活，失敗就會死。


  哇，這不就是滅活者的劇情嗎？


  金獨子既驚恐又有領悟：世界上只有我知道結局？那劉眾赫在哪裡？我要跟他合作嗎？


  但沒等他細想，過關時間緊迫，眼前已經混亂並充滿廝殺的戾氣.......




  這樣的背景，加上靠著獲勝得到金幣，能換成各種技能，勇闖死亡遊戲，一關接一關，堪

  稱今年最爆炸好看的超級爽片。




  怎麼爽呢？


  1.原本很廢的金獨子，在掌握如何累積金幣後，迅速累積戰鬥力，安孝燮帥氣指數衝破天

  際。


  2.關卡多，難度越來越高：從殺死一個活體到跨過大橋，再到地鐵綠燈區卡位戰，最後跟

  噴火大BOSS對幹，幾乎沒有時間能喘息，戰鬥一場接一場。


  3.團隊合作：主要角色超過五六位，每一個都重要，沒有廢咖，各司其職。


  連小朋友都可以召喚昆蟲，關鍵時刻產生影響力，超可愛。



  真心推薦沒看過原著的，可以放心的去看，看完有興趣再去補小說或漫畫，

  期待下一集。







  --'
