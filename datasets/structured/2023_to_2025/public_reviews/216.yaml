url: https://www.ptt.cc/bbs/movie/M.1753703959.A.618.html
title: '[新聞] 【全知讀者視角】稱霸台灣韓國票房雙冠軍'
content: '新聞網址：



  改編全球現象級網路小說，由《與神同行》金牌製作團隊傾力打造，以大場面、大動作、

  大特效、大卡司引爆觀眾熱烈期待的奇幻動作鉅獻《全知讀者視角》，自上週三（7/23）

  在台灣與南韓同日上映後，氣勢如虹，強勢奪下南韓首週票房冠軍，台灣更截至昨日（

  7/27）為止，在短短五天內狂掃新台幣3100萬元票房，強勢登頂台灣年度最賣座韓片寶座

  ，並以火熱的話題討論，再奪台灣Google娛樂類搜尋趨勢榜冠軍！尤其主演男神安孝燮人

  氣飆升，繼話題動畫《Kpop獵魔女團》（KPop Demon Hunters）聲演表現獲讚後，如今在

  本片挑戰截然不同的角色，更成功引爆討論熱潮。他透露，導演因為他「看起來非常平凡

  」而選他詮釋主角「金獨子」。為了展現出這份「平凡卻不凡」的特質，安孝燮在拍攝期

  間幾乎不照鏡子，故意選用較暗的粉底，服裝也特別挑選寬鬆過時款式，力求貼近角色的

  質感。他更坦言在接演本片前，曾一度考慮放棄演員之路，直到前輩韓石圭的一句話，讓

  他重新找回初心，勇敢迎戰這個角色，最終交出讓人驚艷的成績。





  今年最不容錯過的現象級韓片強勢誕生！《全知讀者視角》自上週三（7/23）在台灣、南

  韓同日上映以來，便以銳不可擋的驚人氣勢，不僅奪下南韓首週票房冠軍，吸引近62.8萬

  民眾搶看，吸金63億韓圜（約新台幣1.4億元）票房。台灣更截至昨日（7/27）為止，在

  短短五天內狂掃新台幣3100萬元票房，強勢登頂台灣年度最賣座韓片寶座！電影一上映，

  即在全台戲院掀起搶票熱潮，不少場次迅速售罄，不只原著小說粉絲衝第一波，就連沒看

  過原著的觀眾也被炸裂口碑吸引走進戲院一探究竟。



  觀眾看完激動分享：「電影真的讓人起雞皮疙瘩，節奏、視覺、情緒全部拉滿！」「場景

  的呈現效果和打鬥超級驚人，實在超出預期，立刻決定二刷！」在社群媒體上，本片也是

  現象級話題，IG限動、Threads、Dcard、PTT全面攻佔，討論熱度爆棚，更因此奪下台灣

  Google娛樂類搜尋趨勢榜冠軍！大量網友不斷轉發推薦，留言區充斥「年度必看神片」、

  「不進戲院看會後悔」等盛讚聲浪，成功激起觀眾的觀影衝動與社交話題。強勢開局也讓

  片商信心喊話：「本片不僅憑藉強大口碑，還以精彩的特效與動作場面打動各年齡層觀眾

  ，市場反應超乎預期，期盼更多觀眾可以進戲院體驗這部現象級作品的魅力。」





  值得一提的是，《全知讀者的視角》是安孝燮出道多年來的電影首演處女作，開啟他的演

  藝生涯新篇章。不過安孝燮自認個性極度內向，本身不喜歡出風頭，雖然是演員，卻非常

  害羞，對陌生人感到不自在。因此在學習演技的過程中，比其他人更常碰壁受挫：「為了

  當演員，我首先要克服自己的個性，那是最痛苦的部分。」因此在接到本片演出邀請之前

  ，他一度考慮是否要放棄當演員。雖然他覺得演戲很有趣，但始終難以適應拍攝現場的環

  境。就在他苦惱之際，前輩韓石圭對他說：「孝燮啊，演戲很好玩吧？但如果演得好，那

  會更好玩哦。」這句話成為他人生的轉捩點：「前輩這句話真的深深打動了我。那一刻，

  重新燃起我對演戲的渴望。」正值那股即將熄滅的火焰再度被點燃之際，他收到了本片提

  案，也因為不想錯過，因此緊緊抓住了這個機會。



  安孝燮表示：「我以前飾演的角色都有很鮮明的個性，但這次的角色卻非常平凡。正因為

  不需要刻意表現什麼，反而讓我莫名地安心。」他更自曝曾詢問導演金秉祐為什麼選他：

  「導演跟我說：『因為你非常平凡。』演戲是一份需要被關注的職業，你必須不斷炫耀自

  己的才能，說自己擅長這個、擅長那個，所以聽別人說我『平凡』的時候，我感覺自己後

  腦勺像被狠狠打了一拳，但這句話也改變了我的視角，讓我能想像有人會用那種眼光看待

  我。正因為如此，我不再需要糾結於自己跟原著角色的契合度，從那一刻起，我就很安心

  把自己沉浸到角色當中。」而為了貼近這種「平凡」，他也在開拍前跟導演進行相當多討

  論：「一開始我會從外貌來思考：是不是太高就不普通？是不是眼神不能太銳利？但我後

  來意識到那些都是偏見。最重要的是：這個人在這個世界裡，是怎麼生活、怎麼存在的。

  所以我開始從角色的童年細節去建構，我相信這些細節才是塑造他平凡氣質的關鍵。」而

  在外型設定上，他也盡量不讓角色太突出。他並自曝在拍攝現場「幾乎不照鏡子」，粉底

  故意用比較暗的色調，衣服則選擇像是從爸爸衣櫃裡翻出來那般，寬鬆又過時的款式，一

  切都為打造「金獨子」這個角色而努力。



  這部斥資300億韓圜年度最高預算打造，以別出心裁的劇情設定，搭配全球火紅的知名影

  星，成為觀眾引頸期盼的劃時代「東方奇幻」代表作的《全知讀者視角》，自電影在台盛

  大上映以來，話題持續火熱不斷，口碑與票房同步飆升。無論你是電影版的影迷，或是原

  著漫畫的忠實讀者，都可以透過LINE WEBTOON平台每週一連載的漫畫原作，深入探索電影

  未及的豐富細節與角色背景。立即前往LINE WEBTOON平台（

  ），和千萬讀者一同揭開更多精彩劇情，

  持續感受《全知讀者視角》的無窮魅力！



  本片劇情描述平凡上班族金獨子（安孝燮飾演），唯一嗜好是閱讀網路小說《在滅亡的世

  界中存活的三種方法》，不過在長達十年的連載期間，他卻成為小說最後的唯一讀者。當

  金獨子在地鐵車廂讀完小說最終話時，小說中的場景卻轉瞬成為現實。地鐵車廂彷彿成為

  人間煉獄，巨大怪物正踐踏著這座城市，以及憑空出現在眼前的訊息－－「您收到了第一

  個主線任務。」緊接著，熟悉的小說角色紛紛登場，而那位無比強大、牽動著整個世界命

  運的小說主角劉眾赫（李敏鎬飾演），開始照著劇情一一行動。眼看熟悉的世界將不復返

  ，一個嶄新的世界正在誕生，身為唯一知曉這個新世界結局的金獨子，將在升級自身能力

  的同時，與夥伴們打造出跟原本小說截然不同的結局…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
