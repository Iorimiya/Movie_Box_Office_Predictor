title: '[負雷] 全知讀者視角'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~









  因為看過原作漫畫，所以看到在打火龍時，不自覺說出了：「這是什麼亂七八糟

  的電影！」


  安孝燮飾演金獨子，但是不喜歡他在這部的演技，覺得有點糟糕。而且他的想法

  太跳躍，這已經不是預知劇情的問題。

  按思考順序1 2 再來是3的話，電影裡的金獨子想法呈現的是1直接跳3，同伴雖

  然不是先知，但也會問你是怎麼知道順序2呢？你現在是順序3，大家連問都不知

  道要怎麼問起呀。



  任務當然可以有急迫性，像是幾分鐘要殺一個生物才能活的任務，很ok呀。這種

  任務通常要有其他人，才能在競爭中形成你死我活的衝突。

  有點任務則要留給參與者喘息的時間，像是地面有毒氣，人們還能在車站下層停

  留。在為了coin、食物煩惱之外，就是同伴與主角了解彼此的時間。



  電影裡金獨子個人任務不算，劇情讓他和同伴之間相處的時間有沒有一天？所以

  每個任務都在趕時間，這樣是不對的。那個打鬥場面也是三兩下就搞定一局，敵

  人有沒有那麼弱？



  劉衆赫也是主角之一，不過只看到他出場就只會揮個劍，敵人就被打倒了。如果

  要這樣，叫金獨子用信仰之刃就可以了。



  最後那個火龍不是這樣子弄的，要有個醞釀期間讓主角群為了不讓它出來而努力

  想解決方法，最後阻止不了...「吼~」一隻火龍孵化了，趕快寫遺書吧！這樣比

  起：啊~主角來了，我要快點出來擋路，不然就結尾了的方式好多了！



  最後想說，如果有續集，我是不會再進場的，哼哼。



  --'
