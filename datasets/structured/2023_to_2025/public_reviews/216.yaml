url: https://www.ptt.cc/bbs/movie/M.1753023338.A.3E6.html
title: '[新聞] 李敏鎬錯過<與神>卻與<全知讀者視角>相遇'
content: '新聞網址：



  根據韓國文化產業振興院（KOFICE）發佈的「2025年韓流白皮書」，李敏鎬已經連續12年

  獲評為「最受喜愛的南韓男演員」冠軍。人氣持續不墜的他，睽違十年以年度奇幻動作鉅

  獻《全知讀者視角》重返大銀幕，不僅分享他多年後再度接演電影的原因，更自曝「非常

  討厭那種『我就是主角』的感覺。」並透露自己每場戲都經過深思熟慮，並特別注重如何

  用演技呈現自己的主角氣場，而非只是憑外貌吸睛。據悉，他過去曾接到《與神同行》演

  出邀約，卻因為種種因素未能接演；這回相同製作公司再以本片提出邀約，導演金秉祐也

  透露選擇他演出的理由：「我們需要一位每次登場，都能搶奪目光、具備份量感的演員。

  」同時，他更談到自己身為韓流巨星，多年來人氣不墜的秘訣，以及對近期許多韓星「私

  生活爭議」的看法，展現自己穩重自持的一面。《全知讀者視角》即將在7月23日（週三

  ）晚場起於全台盛大獻映，即日起各大影城已經開始預售。





  李敏鎬在電影《全知讀者視角》當中，飾演小說世界成為現實之下的小說主角「劉眾赫」

  ，擁有「回歸」能力，為了在即將毀滅的世界中生存，反覆使用能讓自己回歸過去的能力

  ，並經歷一遍又一遍的世界毀滅。雖然他在過程中獲得壓倒性力量，卻因為日益加深的失

  落感，讓他變得冷酷並憤世嫉俗，成為一位擁有強大力量卻又孤獨的「怪物型主角」，堪

  稱奇幻主角的經典範本。同時，這也是他在《江南1970》之後，睽違十年再度重返大銀幕

  ，他對此表示：「老實說，我壓力很大，跟電視劇相比，電影的評價更加明確直接，因此

  現在最強烈的感受，就是在等待大家看完電影後的評價。」他並表示：「之所以花這麼久

  時間才再拍電影，是因為年輕時的我，去電影院是想抒發情感或感受深度層次的表演。比

  起青春題材，我更傾向能讓我感到有深度的作品。當時就想過，電影想從30歲之後再開始

  演。」



  李敏鎬透過《全知讀者視角》重返大銀幕，可說是比誰都更理解本片對他角色的期待。導

  演金秉祐透露選他演出的理由：「我們需要一位每次登場，都能搶奪目光、具備份量感的

  演員。」據悉，李敏鎬過去曾收到《全知讀者視角》相同製作公司的《與神同行》演出邀

  約，卻因為種種考量未能接演。這回演出相同公司打造的這部年度話題之作，也因此備受

  矚目。他表示：「製作公司時隔十年後，再次提出演出邀請，尤其我們是從企劃階段就開

  始進行諸多交流，所以我才決定參與。關於這個IP要如何製作成影視作品，我也和經紀公

  司進行很多討論。」他並補充：「我從某個時候開始，就覺得這個社會愈來愈個人化、孤

  立化，在這樣的背景下，我感受到這部作品的故事，就像是個小型社會；在電影中登場的

  各色人物，也展現當人們聚在一起時所能爆發的巨大能量。我很喜歡作品所傳達的這項訊

  息，因此決定接演。」





  李敏鎬在《全知讀者視角》當中，每次出場都以強烈氣場與存在感主導整個畫面，這也是

  他在每場戲中經過深思熟慮的成果：「我一直追求的是，在被賦予的情況下全力以赴去做

  好每件事，這也是我認為自己和角色『劉眾赫』最相似的價值觀。」然而，他這回在片中

  精彩演繹小說世界中的主角，不過卻語出驚人表示：「我其實非常討厭那種『我就是主角

  』的感覺。」他揭露原因：「雖然這部電影的風格和我過往的作品截然不同，但另一方面

  ，這個角色又可能會讓很多人覺得『李敏鎬又只演主角了』，或是『他只是想讓自己看起

  來帥而已』，所以我對此考量了很多。由於角色的故事背景很少，我特別著重如何用演技

  呈現他的主角氣場。」一席話展現自己成熟穩重的一面。



  尤其近期眾多明星因為私生活爭議，讓演藝生涯面臨危機，多年來鮮少有負面新聞的他，

  也透露自己如何保持清白形象的秘訣：「我一直提醒自己，我也隨時有可能出現問題。」

  他進一步表示：「這類事件，通常出自個人的情緒或慾望，我會在那樣的時刻思考：『現

  在有更重要的事物。』像是家人、正在進行的重要企劃，只要能意識到這些，我就會努力

  控制自己。雖然因為要時時刻刻留意，會覺得自己沒辦法完全『做自己』，但我還是希望

  在能力範圍之內，能過著健康而穩定的生活。」



  這部斥資300億韓圜年度最高預算打造，以別出心裁的劇情設定，搭配全球火紅的知名影

  星，成為觀眾引頸期盼的劃時代「東方奇幻」代表作的《全知讀者視角》，即將在7月23

  日（週三）晚場起於全台盛大獻映，即日起各大影城已經開始預售。本片劇情描述平凡上

  班族金獨子（安孝燮飾演），唯一嗜好是閱讀網路小說《在滅亡的世界中存活的三種方法

  》，不過在長達十年的連載期間，他卻成為小說最後的唯一讀者。當金獨子在地鐵車廂讀

  完小說最終話時，小說中的場景卻轉瞬成為現實。地鐵車廂彷彿成為人間煉獄，巨大怪物

  正踐踏著這座城市，以及憑空出現在眼前的訊息－－「您收到了第一個主線任務。」緊接

  著，熟悉的小說角色紛紛登場，而那位無比強大、牽動著整個世界命運的小說主角劉眾赫

  （李敏鎬飾演），開始照著劇情一一行動。眼看熟悉的世界將不復返，一個嶄新的世界正

  在誕生，身為唯一知曉這個新世界結局的金獨子，將在升級自身能力的同時，與夥伴們打

  造出跟原本小說截然不同的結局…。



