title: '[新聞] 【全知讀者視角】首爾星光試映記者會直擊'
content: '新聞網址：



  改編全球現象級網路小說與網路漫畫，由《與神同行》金牌製作團隊傾力打造，以大場面

  、大動作、大特效、大卡司引爆觀眾熱烈期待的奇幻動作鉅獻《全知讀者視角》，即將在

  7月23日（週三）晚場起於全台盛大獻映。本片昨日（7/15）在首爾舉辦媒體試映記者會

  ，導演金秉祐率領主要演員安孝燮、李敏鎬、蔡秀彬、申承浩、NANA等眾星盛裝齊聚，共

  揭這部年度最大奇幻動作片的拍攝過程與趣事。值得一提的是，台灣片商也驚喜推出「電

  影首日瘋活動」，讓觀眾有機會獲得「LINE WEBTOON回饋型代幣15枚」，以及精美「A3原

  文主視覺海報」的首週戲院入場特典，台灣觀眾們千萬不容錯過！





  年度奇幻動作鉅獻《全知讀者視角》，昨日（7/15）在首爾舉辦盛大的媒體試映記者會，

  由導演金秉祐率領主要演員安孝燮、李敏鎬、蔡秀彬、申承浩、NANA等齊聚一堂。本片改

  編超人氣同名網路小說，為了能兼顧原著讀者與首度接觸本作的觀眾，導演不僅事先進行

  大量問卷調查，更不斷研究各項細節：「我們不停反思該如何製作這部電影，尤其這是一

  部大家期待已久的作品，讓我一直反覆思考在原作基礎上，能再加入什麼內容。能夠滿足

  觀眾的需求，就是我們的目的；打怪的過程與人物不同的感情線，都是我們注重的地方。

  」導演更透露想要帶給觀眾前所未有的觀影體驗：「能讓觀眾有很好的觀影體驗，我們對

  此抱有期待，所以製作過程也一直盡量擺脫過去的習慣，用最新的方式來呈現，希望這樣

  的努力，可以透過大銀幕傳遞給觀眾。」



  最近為Netflix超人氣電影《Kpop 獵魔女團》（KPop Demon Hunters）擔任主角配音、並

  透過本片首度擔綱電影主演的安孝燮，也坦言這次的演出充滿壓力：「首度看劇本時，覺

  得作品非常有魅力，如果能製作成電影，會變成什麼樣子，我也跟很多人一樣抱有期待；

  當然也有不樂觀的看法出現，讓我因此有所負擔，但我想我所能做的就是盡全力去詮釋！

  」他並分享在角色準備上多加著墨：「這個角色在原作上，會有痛快解決問題的時候，但

  我在片中更貼近現實一些；而金獨子是主角，卻沒有主角的魅力，『平凡』就是他最大的

  武器。這是我過去比較沒接觸過的角色，讓我反覆思考該如何用這樣的武器來說服觀眾。

  」





  《全知讀者視角》以大場面、大動作、大特效、大卡司引爆觀眾期待，為創造驚人世界觀

  ，本片運用大量特效製作，也讓演員們必須在拍攝時於綠幕前大展身手。初次演出打鬥戲

  ，女力帥翻全場的NANA大方分享：「我靠想像力來詮釋，這讓我能更好投入角色，再加上

  運用自己練習的動作與表情來呈現，同時導演也幫助我理解內容，因此對我來說其實並不

  太困難。」李敏鎬也同感回應：「綠幕的演出，讓演員需要更多想像力，我平常不是愛胡

  思亂想或有太多想像的人，但這次的作品，讓我的情感更加豐富！」至於已經不是綠幕初

  體驗的申承浩則感激表示：「因為過去有在綠幕前演出的經驗，所以這次不太困難，反而

  更能專心投入角色。」



  即使拍攝充滿挑戰，演員們在戲外仍充滿歡樂並展現好感情，蔡秀彬笑說：「我在拍攝現

  場也會一直玩我的絲線能力，並和導演與演員們合作，共同解決難題，所以拍攝打鬥戲時

  ，大家都會為我加油打氣，有大家的陪伴，讓我沒有那麼辛苦！」而在主演群身為前輩的

  李敏鎬，當被問及是否在現場有引導其他演員時，他也謙虛表示：「我認為付出行動比較

  重要，所以我不太會給建議，而是以身作則、敬業去做，將分內工作做好；看著他們賭命

  在拍、做到極限，雖然沒有太多共演時刻，但大家真的都非常努力！」





  值得一提的是，台灣片商也驚喜推出「電影首日瘋活動」，只要購買本片上映首日（7/23

  ）電影票，並憑當日電影票根在指定時間內至原購票影城兌換，即有機會獲得「LINE

  WEBTOON回饋型代幣15枚」，本活動無預先保留機制，數量有限，送完為止。此外，片上

  更祭出首週戲院特典「A3原文主視覺海報」，凡購買本片第一週（7/23-7/31）期間場次

  電影票乙張，即可憑電影票於7/23（三）起，至原購票影城兌換A3原文主視覺海報乙張。

  多樣精美特典活動，台灣觀眾們千萬不要錯過！活動詳請請見采昌官方社群公告。



  這部斥資300億韓圜年度最高預算打造，以別出心裁的劇情設定，搭配全球火紅的知名影

  星，成為觀眾引頸期盼的劃時代「東方奇幻」代表作的《全知讀者視角》，即將在7月23

  日（週三）晚場起於全台盛大獻映。為了歡慶電影版即將上線，7/13至7/20期間，至

  LINE WEBTOON登入帳號觀看《全知讀者視角》漫畫即有機會獲得電影交換券、周邊套組及

  WEBTOON代幣！參加加碼活動，再抽中雙人電影交換券、角色收藏票券套組及100枚代幣，

  敬請把握機會！（活動連結：）



