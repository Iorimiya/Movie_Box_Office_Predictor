title: '[好雷] 大明星多重宇宙'
content: '很好看，劇情銜接的很緊密，沒有放空的空間。


  有笑點，也有讓人感動的時刻。


  是值得去電影院看的電影。


  我都想再看一遍了。



  有雷






















  劇情是走類似1993年土撥鼠日／今天暫時停止那樣的類型，讓你有機會嘗試當初沒走過的

  人生路線。


  最多就透露這樣啦！

  這部我蠻推薦的。



  話說本週新片有什麼推薦的呢？




  --'
