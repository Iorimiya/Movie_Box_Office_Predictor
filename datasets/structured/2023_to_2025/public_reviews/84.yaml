url: https://www.ptt.cc/bbs/movie/M.1760771186.A.219.html
title: '[負雷] 世界就是這樣結束的'
content: '演員陣容和演技一流

  歌唱表演和情感表達也非常到位

  畫面好多幕都很漂亮有設計感


  可是故事實在扁平到無聊沒有靈魂

  節奏常常在似乎要給觀眾帶來一些體驗的時候就中斷

  整體似乎想在致敬古典元素與融合多元創新之間做點什麼

  成果卻是選擇了模糊焦點加上故作姿態


  角色們雖然因為末日困境都在模仿正常生活過日子

  但他們至少知道自己在做什麼

  電影卻是一昧假裝自己是一部感動的作品

  可是播著空洞的東西



  --

  真的 我要哭了

  對啊 怎麼會這樣

  用上等食材煮出大鍋菜

  別說了我好想回去揍我自己

  是指那部老電影嗎 XD'
