title: '[好捧雷]何處是我朋友的家[天方夜譚之西天取經]'
content: 'Where''s my friend''s home?




  Ahmed 是個人才!

  "所謂天將降大任于斯人也, 必先苦其心志, 勞其筋骨, ...."


  還只是小學二, 三年級的Ahmed和他的同學們在那個年紀就得受高大的

  男老師的嚴格教育, 時時刻刻教他們"如何做個有用的男人",聽起來好

  像沒什麼問題, 但注意是"男人"哦, 這點不得不佩服伊朗的教育真的

  可稱上是"威武不能屈,貧賤不能移", 看到那破爛的教室和永遠要關個

  兩, 三次才關得好的門, 但老師在不厭其煩地因小朋友遲到門沒關好再

  關好門之餘"千叮萬囑地"認真地教導孩子們( 比老師晚到=遲到, 會受到

  老師仔細盤問原因 ) 各位客倌們可能不禁要大讚"伊朗小孩個個都是丁丁啊!"


  Ahmed(以下代號悟空)當天放學時不小心和豬八戒(同學)的作業薄搞錯各自帶回家

  了,在家要作homework才發現, 悟空這一驚非同小可, 想起釋迦牟尼(老師)

  是如何地"This is Spartal!!!", 沒在自己的作業薄上作業可是下地獄的

  重罪, 發呆了一下子後立即向觀音大士(媽媽)稟告說要去同學家換回作業薄,

  誰知觀音大士看也沒看悟空一眼, 只向他下令去照顧紅孩兒(強褓中的弟弟),

  並作完功課才準出去, 悟空發著呆解釋一切,無奈觀音大士忙著洗衣服沒空甩

  他, 生死已于一線, 繼續發呆的悟空喃喃自語, 妨佛末日即將來臨, 突然一瞬間,

  悟空終于下定決心, 不拿回作業薄就成仁, 立刻衝出家門口往西天(朋友家)而

  去.


  當然, 過程就不多敘述, 大家耳熟得很, 不就出現一堆妖魔鬼怪就阻擋悟空取

  經, 包括金角(爺爺)在耍耍悟空的同時向銀角(鄰居)說"男人就是要如此教育"

  的橋段, 也有土地公(一老頭子)想要幫悟空結果走路慢如烏龜還幫倒忙, 當然

  少不了問路時指錯路的路人, 我懷疑是蜘蛛精變的, 就這樣取經取到晚上, 回

  到家玉皇大帝(爸爸)還不解地皺著眉問為什麼晚上才作作業, 但幸好觀音大士

  還是備了飯菜, 不然觀眾可能會引起暴動翻桌子.......


  至于隔天結果如何? 靠腰, 全片的高潮就在最後, 我才不告訴你壘!!你咬我啊XD


  伊朗大師 Abbas Kiarostami,姓還蠻像日文的, 其實本片是伊朗大地震三部曲

  中的首部, 另外兩部是"生生長流(和

  "櫻桃的滋味( 前者是講導演(其實是

  演員)年後開車和兒子去找本片的男主角Ahmed探訪一路上見到大地震後的災情,

  後者是講一個人想尋短見開車找人埋葬自己, 很怪吧, 聽說"The Wind will carry us"

  (也不錯,但還沒看, 但這本片dvd出來

  很久了,真的是非常非常地推薦, 前年的影展上看的, 最後看完大部份觀眾都猛

  拍手喔!


  還有"Ten(也很不錯, 10段年輕貌美的

  辣媽開計乘車戴十位不同的客人的談天記錄, 第一個就是自己的兒子, 小小年紀

  就對媽媽的離婚和"新的爸爸"發諸多"理性"的牢騷, 蠻好笑的.


  --

