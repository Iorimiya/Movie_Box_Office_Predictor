title: '[好雷] 愛在他鄉 - 何處是我家 '
content: '不知該如何起筆，只能說這部電影道盡異鄉遊子的鄉愁。


  台灣片商把這部電影宣傳的好像在講遠距離戀愛，又或者是純愛片


  但真的去看了，就知道這部電影要講的不只是這些小情小愛


  而是被兩個世界拉扯的幸福與悲哀，希望與無奈




  也許我們人人都是女主角Eilis, 生活宛如走到死胡同，看不到未來。


  每天日復一日做著同樣的爛工作，渾渾噩噩地過著每一天


  但Eilis決定拋下故鄉愛爾蘭的一切，毅然決然地隻身前往美國


  雖然很幸運地有工作，但她不快樂。她想念家鄉親人和朋友，也不習慣美國的生活


  她不覺得自己屬於這個地方，直到她遇到一個熱情的義大利裔男孩


  -----------


  電影的確有她跟男孩熱戀的片段


  但我始終覺得這個感情更重大的意義是給了她歸屬感


  她終於快樂了，工作也漸入佳境，晚上還去上會計課（之類的）


  但就在她慢慢喜歡上這裡的生活後


  家鄉傳來不幸的消息讓她必須返鄉


  就在返鄉前，男孩要Eilis嫁給他，Eilis答應了，但卻沒有讓家鄉的人知道


  ------


  這次愛爾蘭彷彿是開著雙臂歡迎她回來


  原本是令她感到窒息的地方


  卻給了她一份可發揮長才的臨時工作


  又出現迷人的愛爾蘭哥（目前我新男神）想好好呵護她


  原本令她想逃離愛爾蘭的原因都消失了


  愛爾蘭有家人，有工作，還有溫柔體貼紅髮哥 -- 一切的一切似乎讓她沒有離開的理由


  她開始動搖，不理會先生（此時已升級為夫妻）的信函


  她也許在美國能和先生共組家庭，但愛爾蘭現在也容得下她


  她看到未來，看到希望


  美國是家，愛爾蘭也是家，而她則是面臨相當痛苦的選擇...




  這是部平淡的電影，但女主角表現得極為細膩。


  她不用大悲大喜（好啦也是有大哭的地方）就能表達內心的喜悅，哀痛與無奈


  自己是留學生，看完電影真的是一把鼻涕一把眼淚


  當初覺得人生一團亂，只想離開這裡，就真的放掉一切出國重新開始


  但卻發現好懷念台灣的一切


  但也知道那裡景物依舊，人事已非


  哪裡才是家呢？


  我依舊羨慕女主角的勇氣，擺脫對家鄉的眷戀，勇敢地重新開始



  結果我扯遠了 總之是一部細膩，沒有太多波動，但卻能打動人心的好電影



  --'
