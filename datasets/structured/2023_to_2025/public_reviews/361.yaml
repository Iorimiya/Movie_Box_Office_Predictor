url: https://www.ptt.cc/bbs/movie/M.1739802238.A.E18.html
title: '[請益] 看電影遇到瘋子大叫該如何處理?'
content: '看電影遇到瘋子大叫該如何處理?


  今天看下午 高雄環球影城 美國隊長4時


  廳內大概只有10個人


  但從預告片時 就聽到中間正後方


  有個歐巴桑在瘋狂大叫


  他叫的聲音 就類似美國A片 女生被幹時 叫的很大聲的那種聲音


  頻率大概5分鐘一次　


  我第一次聽到時　還以為有人在做愛


  由於美國隊長沒啥搞笑橋段　也不是恐怖片


  因此我覺得應該是遇到神經病 是真的有病的那種


  邊看電影邊自慰的女性


  非常吵


  整部電影都有他的叫春聲


  然後電影結束後


  我還特別去找是誰那麼吵


  發現是一個50歲歐巴桑


  自己一個人來看電影


  他走出影廳時 還一邊走一邊叫春


  害得附近的人很尷尬


  我跑去跟工讀生說:"怎麼會放神經病進來?"


  他說:"不好意思, 我會跟主管反映"


  當我在跟工讀生聊天時, 這女的還突然站在我旁邊


  越叫越大聲 好像被強姦一樣


  工讀生可以作證 真的有夠吵


  後來他還跟我進電梯 整個電梯都是叫春聲


  請問


  遇到這種情況 該如何處理?


  --'
