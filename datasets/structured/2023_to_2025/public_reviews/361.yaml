url: https://www.ptt.cc/bbs/movie/M.1530390256.A.3D0.html
title: '[雜談] 天涯何處無芳草裡的小詩'
content: 'Though nothing can bring back the hour


  Of splendour in the grass, of glory in the flower


  We will grieve not, rather find


  Strength in what remains behind


  【試譯】


  雖然無法尋回花草生長綻放時的光輝與燦爛，我們無須傷悲，應該從剩餘之中發

  現殘存的力量！


  英國詩人威廉沃茲華斯寫的這首短詩 Splendour in the grass，被1961年上映

  的《天涯何處無芳草》Splendour in Grass所借用，也出現在電影之中。當時男

  主角華倫比堤年方24，女主角娜坦麗華也只有23。


  為什麼會對《天涯何處無芳草》如此熟悉？這部電影曾經是高中英文老師

  於課間

  播放的補充教材，老師也藉此介紹沃茲華斯的短詩。


  一直到現在，我都很感謝當時的英文老師，她利用教唱英文流行歌曲、欣賞電影

  、撰寫短文的方式增加了我對英文的興趣，也反映在漂亮的考試成績上，要不然

  ，我現在的英文也許只有 ABC 狗咬豬的國中程度。


  附一下當時課堂上所看過的電影跟英文歌曲清單


  熱淚心聲 Miracle Worker 1962

  海倫凱勒與她的手語老師安蘇利文初識的經過


  蝴蝶春夢 The Collector 1965

  一名收集鱗翅目標本成癡的男子連續綁架女子的驚悚片


  Dan Foldberg 歌曲


  Same Auld Lang Syne

  聖誕雪夜在雜貨店遇見前女友，回憶湧上心頭.....


  Longer

  什麼東西比海裡出現魚的歷史還久，比最高的山還高？那就是陷入愛河中的我！



  --'
