title: '[普雷]亡命之途-樂園何處尋 '
content: '日本兩大巨星妻夫木聰和豐川悅司主演的電影《亡命之途》，由於全部都在台


  灣取景，在電影開鏡時就已經十分讓人期待，預告片塑造的懸疑氛圍也讓人好


  奇導演半野喜弘會帶來怎麼樣的故事。


  圖文網誌版：



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  電影講述牧野(妻夫木聰 飾演)因為一樁案件遭到日本黑道追殺，為了保命，他


  找上了曾在某次酒會中見過一面的島先生(豐川悅司 飾演)，島起先對來路不明


  的牧野相當抗拒，但又對牧野涉入的案件感到好奇，於是他們一同來到花蓮躲避


  日本黑道的追殺，兩位不懂中文的日本人，在花蓮遇上會一點日文的台灣女子小


  恩(謝欣穎 飾演)，由於小恩外貌神似島先生在台灣遇害的前女友，三人也因此


  有了一些交集，不知未來「樂園」在何方的牧野、島及小恩，就在小恩花蓮的別


  墅內度過短暫的歡愉時光，直到殺手(莊凱勛 飾演)找上門來...



  電影開場不久其實就會發現，預告中相對快的節奏和本片截然不同，從開場牧野


  找島一起吃麵的那場戲，就可以看出導演半野喜弘為《亡命之途》定調的風格，


  緩慢而沉穩的鏡頭長時間對準兩位主角，對話不多，且對故事推展的成分也不大


  ，更多是在用氣氛來醞釀懸疑的故事張力，導演也用這場戲讓觀眾知道牧野和島


  的人物設定，牧野聒噪，而島相對內斂，這樣的性格在知道後面的故事後，也可


  以明白是來自於他們在該案件中所處的立場，看到這邊還對電影後面的發展愈發


  期待。



  但到了電影中後段，牧野和島遇上小恩後，導演拋出更多關於命案的線索，也把


  三個角色背後複雜的人生經歷一同釋放，不斷出現問題卻沒有明確的解答。我們


  知道牧野是涉案人，遭到追殺，但為什麼他的人生會走到這一步？島的女友死於


  非命，他內心有說不出的痛，但他和女友為何碰上這樣的案件，是因為兩人身分


  特殊，還是純粹是場意外，我們也不得而知。而小恩的父親很早就過世，母親在


  日本生活，他們的關係不睦，但然後呢？電影輕輕帶過這些劇情，留給觀眾許多


  未知的結，但卻沒有嘗試去解開，更多的是讓觀眾自己去處理，好像我們也只能


  跟故事中的人物一樣，活在混沌又迷茫的人生中，只能盡情享受當下，找到屬於


  自己的樂園。



  兩位日本男星不負期待的很出色演好自己的角色。妻夫木聰飾演的牧野看似多話


  ，但更多的是在掩蓋對未來的不安，島的沉靜內斂也許正是對人生際遇不公的無


  聲抗議，兩人很出色的詮釋了電影中的角色，用自然的演技讓觀眾明白人物內心


  的糾結。而本片另一大優點當然還是來自於大師坂本龍一的配樂，非常適宜的襯


  托電影的躁動不安和懸疑性，彷彿閉著眼睛都能體會到電影現在進行到甚麼階段


  一般。



  對比開鏡時的期待，電影本片的故事面確實讓人失望，但我個人不討厭這部電影


  ，至少在演員、電影畫面和配樂上都很出色，只可惜導演似乎不打算涉入太多劇


  情的部分，讓人看完後感到餘韻不足，甚至想要討論劇情都找不太到施力點。



  --'
