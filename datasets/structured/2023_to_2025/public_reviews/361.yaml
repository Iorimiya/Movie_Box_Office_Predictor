title: '[好雷] 何處是我家'
content: '在光南用39元購得的好電影，也是我第一次寫這麼長的心得並po在這裡>///<



  《何處是我家》Nirgendwo in Afrika


  又是一部和納粹有關的電影，然而它不是用槍聲、鮮血、集中營

  而是用一個遠在非洲逃難的猶太人家庭，讓人感受在大時代下的悲哀


  猶太人Walter為了躲避納粹的迫害，將妻子及小女兒帶到肯亞生活

  片頭一開始妻子Jettel在德國的熱鬧宴會，對比出日後在肯亞生活的荒涼孤寂

  而公公在離去前對她說的一番話，更暗示了Jettel日後的外遇


  初到肯亞，Jettel怒極(看到那種生活環境沒有人不怒的= =)

  反倒是女兒Regina很快的適應環境，和家中的黑人廚師Owuor產生深厚的友情

  令人不解但又感動的是黑人們的單純與忠心

  Owuor可以離開自己的妻兒們，整日在"主人"家幫傭

  對待Regina如同珍寶，每次Regina返家總見他熱情擁抱，帶著Regina融入非洲生活

  即使Jettel一開始只願意跟他說德語而不願學習非洲語(那個應該是非洲語吧@@)

  他對女主人也是一樣友善忠心


  Jettel起初無法適應非洲生活，但女人總是堅強

  她開始學著挑水、種植農作物、操持家務

  但是面對貧窮艱辛的生活、不知道家人在德國是否安好的憂心、丈夫與她之間再無話題

  (這裡導演用了Jettel哀悼一個非洲女人的死，表達她對自己家人安危的傷心)

  種種的因素導致了她的外遇

  又或許一切的根本都來自於，愛的比較多的始終是Walter

  然而Jettel的外遇並沒有被說破及清楚述說

  只來自於經由女兒看到的，窗簾後兩個隱約接吻的身影

  而此次外遇的起，卻是Jettel為了救丈夫離開英軍俘虜。

  Walter和Jettel在片中有許多次離別後重逢的畫面，可以看出他們感情的變化

  甚至連片中出現的兩次性行為場景都有特殊意義

  一次是丈夫得知父親在德國受納粹迫害死去的痛苦，兩人是發洩也是分擔

  一次是Jettel決心與丈夫修好，充滿寬恕原諒跟喜悅

  (不要問我怎麼看出來= = 總之導演真的很厲害)


  Jettel的第二次外遇是和丈夫的好友Süßkind，從Walter和Süßkind一起被英軍俘虜

  兩人同在車上然而Jettel拉的卻不是丈夫的手

  搬家後擔心Süßkind無法常常造訪

  在丈夫從軍時，和Süßkind一同出遊而錯過了好不容易從學校返家的女兒

  這些畫面顯現了Jettel的外遇


  女兒Regina，與黑人的友情已經說了

  此外，身為猶太人的她卻輕易的接受了非洲的宗教

  「異教徒的好運」是年紀小小的她就懂得用來說服母親的方式

  而長大的她在學校飽受歧視

  ex:英國人認為他們是德國人，視為敵軍；然而她卻又是不被德國接受的猶太人

  偏見認為猶太人視錢如命，連學校老師也拿此諷刺她總是拿第一名

  然而她卻說：我家每月賺6英鎊，我讀書要5英鎊，因此我懂得絕不浪費。


  戰爭結束，Waler決定回德國

  然而Jettel問他：你怎麼還能再相信德國人？如果重新來過，我們會選擇彼此終生嗎？

  而Süßkind對Jettel說：如果妳和我在一起，我會很快樂

  看到這邊我已經很悲哀的認定這一家從此要分離，又是一個大時代下的悲劇


  但接下來一場蝗蟲災害，成了最後的轉折

  Waler已經開車離開，獨留Jettel與女兒在肯亞家中

  農作物正是豐收期，Jettel的心已經繫在這裡

  此時蝗蟲來襲，在眾人忙碌的用盡一切方法趕走蝗蟲時

  Jettel看到已經遠去丈夫的身影，出現在田中，與眾人一起努力......


  最後，這一家人彼此的感情打敗了種種考驗

  雖然男主角在知道妻子懷孕的時候還要問說：這是我的孩子嗎XDDDD

  但他們選擇原諒彼此，回到德國

  這裡還有一個感動點是黑人Owuor與小女兒間的道別 Q_Q



  本片有太多感情：夫妻間、親子間、黑人與白人間、主僕間、朋友間、人與動物間

  也有太多衝突跟矛盾：黑人vs白人、猶太教vs非洲宗教、猶太人vs德國......

  然而卻能一一用各種手法跟畫面細膩呈現，配上帶著野性又充滿熱帶風情的非洲音樂

  故事不枯燥乏味，平淡中又讓人情緒跟著糾葛

  兩個多小時的故事，令人回味無窮，不愧為德語片中的名作！


  --


