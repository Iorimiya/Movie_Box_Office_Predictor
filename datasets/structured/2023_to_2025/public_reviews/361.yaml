url: https://www.ptt.cc/bbs/movie/M.1499587475.A.82B.html
title: '[好雷] 接線員─你的土地在何處'
content: '土地是什麼


  長久生活的土地便會成為故鄉嗎？


  《接線員》試著用幾個女人的故事


  呈現離開故鄉之人的生活





  女主角Tina在金融風暴後處處面試碰壁


  不得已之下  只好在非法按摩店當接線員


  原本打算找到工作後立刻離開的Tina


  處處試著和店內的小姐有所區別


  卻在一起生活的日子中


  同樣感受身為異鄉人的孤獨和傷感




  Tina是片中唯一一個和故鄉保持聯繫的角色


  無論是時不時和家中奶奶越洋電話


  以及選擇了台語來加深角色對於故鄉的連接度



  相較於Tina


  在按摩院中工作的Sasa、妹和Anna


  就像是被移植過後的花


  放在了陌生的土地上


  極力去爭取陽光


  卻還是一跛一跛地走


  最後蜷居在按摩店中相互扶持




  片中將金錢作為一個很重要的元素


  為了生活而需要金錢


  為了金錢而拋棄在太陽之下的生活


  Sasa對老鴇的小白臉說：「給我錢，我什麼都做。」


  Tina看著自己薪水遠低於其他小姐，身於錢窟而不由自主地偷了Sasa的錢


  層層堆積起金錢的意象後


  再讓地痞流氓一夜搶走按摩院所有的鈔票


  試著發問：


  「金錢真的是我們的第一優先嗎？」





  這是盧謹明導演的第一部劇情長片


  筆者覺得是近年來台灣電影的一顆亮星


  電影風格不流於單向面的批評惡、稱讚善


  而是以細膩的手法處理人最深層的思鄉之情


  選擇了接線員的視角


  既鮮明而刺痛


  卻又回歸於人與愛


  令人驚豔




  雖有評論說導演將片中男人描寫得全然負面


  筆者認為並非如此


  導演對於這些看來是「惡」的行為都有加以解釋


  例如Tina和男友之間的相處


  男友失業後的房租、伙食皆由Tina想方法賺錢支撐


  在經濟方面的分配失調


  觸痛了英國傳統男性的自尊


  進而導致在男友發覺Tina在按摩院工作後


  盛怒下將Tina直接趕出公寓


  （男友認定Tina是擔任性工作者，因此不僅經濟不自主，連感情中的性也被外人剝奪）





  在去年金馬影展時即觀賞此片


  一直念著在劇院的正式上映


  但因為前陣子忙碌


  到了本周才有時間二刷及整理觀影筆記


  不知剪接版本是否與金馬上映的版本有異


  感覺第二次觀影時，前半小時的劇情剪得比較緊，有些許喘不過氣


  後方在交代Anna從天橋跳下時也蠻容易造成觀眾誤解成保全加害


  是本片中的小小敘事缺點




  總而言之


  《接線員》是相當出色而嶄新的台灣電影


  卡在暑假強檔之中，還蠻擔心票房的


  希望這篇影評可以拋磚引玉


  讓更多人看到這片好片。


  --'
