title: '[普雷]《計程人生》嘿嘿TAXI你開往何處？'
content: "在解嚴後狂飆的八九零年代，台灣的計程車司機彷彿每個都是一流的街頭時事\n評論員、駕駛座上轉著方向盤的政論名嘴，即便後來因為靠行車行或車隊有所節\n\
  制了，但在街小巷遊蕩、隨機上下乘客的這個小黃包廂，依然是一個國家、一座\n城市政治經濟社會人生百態的縮影。因為拍攝電影多次揭露了社會問題，而被當\n局以「危害國家安全」罪名禁拍廿年的伊朗導演賈法爾潘納希，他無畏禁拍令，\n\
  把攝影鏡頭放在行車紀錄器的位置，加上一台姪女手持的佳能相機，在小小的車\n廂裡用屈指可數的的取鏡角度，「忠實記錄」了自己下海當司機的一天裡，路上\n遇到各式各樣拼車共乘的「角色」，和他們一個個一路上喋喋不休的話癆，藉此\n\
  縮影了伊朗的社會風貌，順便痛婊了一頓剝奪他創作自由的伊朗電影審查制度。\n\n\n\n　導演當過阿巴斯的副導，形式上《計程人生》有點致敬阿巴斯同樣用小黃說故\n\
  事的《10》。賈法爾潘納希用行車紀錄器近乎紀錄片的形式，模糊的真實與劇情\n的界線，看似散漫瑣碎、互不關聯的一眾乘客，似乎又像是被導演精心編排過，\n帶著不同議題與使命「隨機」上車的「角色」，分別從政治、文化、宗教等等各\n\
  個角度揭批了千瘡百孔的伊朗社會問題。藉著一台乘載著伊朗社會的小黃車廂裡\n既市井尋常又光怪陸離的對話與事件，探問說「嘿嘿TAXI，你開往何處？」\n\n\n\n\
  　隨著導演的小黃啟程，從第一組辯廢死的竊賊和老師開始。到本來默不吭聲後\n來認出導演的盜版片商，他自豪起是自己的「文化事業」讓禁閉的伊朗民眾有機\n會一窺好萊塢大片跟大師經典（連過去導演也跟他買了不少），接著他還拉著導\n\
  演去跟電影系同學面交，導演還幫後座正苦於拍攝題材受限的同學「開釋」。接\n著一名婦女攔路拖著車禍受傷的老公上車就醫，受傷的男人一定要錄下遺囑把財\n產留給身旁哭哭啼啼的老婆，不許自家兄弟佔遺產，這段反映了伊朗女性權益根\n\
  本難有保障，就算事後老公傷勢好轉了，女人還是鍥而不捨奪命連環摳跟導演要\n影像「以備不時之需」。然後是一對迷信要趕在吉時放生金魚求得好運長命的阿\n婆。導演剛放學的姪女。約導演見面訴說煩惱的鄰居，他秀出自己被打劫的錄像\n\
  ，指認就是街角披薩的阿弟仔幹的，難解心頭之恨的同時又不忍告發，怕會讓一\n條年輕的生命被處以死刑。以及最後搭上車帶著花的女律師，她要去監獄探望因\n偽裝成男生去看球賽被逮捕的女孩（這個女孩的故事，詳見導演另一部2006年的\n\
  作品《越位（越位女球迷）》），路上女律師發表了不少「反動」言論，支持與\n被吊銷執照的她同病相憐被當局禁拍的導演，並且把一朵玫瑰放在鏡頭前：「這\n朵花送給熱愛電影的人們。」\n\
  \n\n\n　其中最有意思的是導演接送放學小姪女上車的那段。古靈精怪的小女孩一上車\n就拿著卡片機有模有樣拍起電影作業，途中叔叔離開車子辦事，女孩拿「道德」\n\
  壓著被她拍到意外撿到錢的拾荒男孩把錢還給人家，因為不按女孩的劇本來，她\n的電影作業就不符合老師規定必須是「可以公映」的內容，現實與理想的辯證，\n最後在小女生的鏡頭中留下的只能是令幼小心靈的她不解的遺憾。等到導演叔叔\n\
  上車，她又煞有介事地念了八條老師交代「可以被公映的電影」的注意事項，包\n括：不能表現汙穢的現實、不能拍暴力鏡頭、女性務必配戴面紗、男女不得肢體\n接觸、正派角色不能打西方領帶、盡量用先知名字命名、也禁止使用波斯語姓氏\n\
  、禁止涉及政治經濟話題。小女孩百思不得其解「甚麼叫：汙穢的現實」，但你\n叫她的導演叔叔怎麼回答，叔叔不就是拍了太多「汙穢的現實」所以吃足苦頭嗎\n？叔叔被關被禁拍，不也就是一種汙穢的現實？這一老一少、童言童語VS有苦難\n\
  言的電影討論，有著楊德昌《一一》的神采。\n\n\n\n　電影最後，這對叔姪趕去河邊，把客人落在車上的錢包還給放生金魚的兩位阿\n婆，沒料到才下車幾秒，一堆機車搶犯就闖進車裡搜刮財物，還準備搶走找不到\n\
  記憶卡的攝影機，宛如「國防布」一片黑、完－全－沒－有－畫－面的影像，就\n像控訴伊朗當局禁止他的影像，就像掠劫了他的創作。\n\n\n　偏愛政治題材，還搞過好幾次「硬頒、故意給」的柏林金熊獎，怎麼能不再次\n\
  把金熊獎的榮耀，加冕給敢於「家醜外揚」的伊朗電影良心－賈法爾潘納希呢！\n導演被伊朗政府限制出境，到場代為領獎的是他姪女，也是電影裡那個伶牙俐齒\n的小蘿莉。會後的記者會上，眾多得獎者在鎂光燈下風光捧著獎座留影，唯有金\n\
  熊獎「無人認領」，孤伶拎放在小檯子上供媒體拍照，柏林影展這手……讓伊朗\n當局又一次的被「汙穢的現實」狠狠打臉。\n\n\n---\n圖文網誌 > \n---\n\
  \n--"
