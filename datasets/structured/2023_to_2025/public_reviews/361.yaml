url: https://www.ptt.cc/bbs/movie/M.1528563127.A.FEB.html
title: 'Re: [好雷]侏儸紀世界-殞落國度，恐龍該如何處理?'
content: '這部電影會讓人不爽的原因是

  他從到到尾都沒有反面的辯論

  我從一開始就很不能認同龍保團體的想法


  有些角色一開始也不認同

  但他們都輕易的被說服


  歐文一開始拒絕的時候

  我還想說他們要進行一場價值觀的辯論了


  結果沒有 女主角甩了一句你是好人

  歐文回去看看影片就接受了


  這種情緒勒索的手法,看了噁心


  後面知道壞人的目的了


  我還以為他們要反思了

  怎麼這麼弱智那麼容易被人騙



  Nope

  故事開始進入正邪不兩立的局面


  壞人 傷害恐龍 賣恐龍 有夠壞


  好人 保護恐龍 放恐龍 有夠好


  ???



  在這個經歷過侏儸紀公園 侏儸紀世界 的世界

  到底為甚麼沒有人來跟龍保辯論

  只有伊恩在聽證會那好像很有道理的廢話



  這種不給好人挫折的劇情有夠無聊的

  我還以為只有輕小說可以看到這種瑪麗蘇故事


  以最近很紅的陰屍路遊戲來舉例好了

  主角們為了推翻瓊安的暴政讓許多僵屍進入了城市害死了許多人

  他們受到了指責 他們看到自己正義的行為的後果

  但他們接受了其他人的指責後 仍舊堅持他們的正義

  即使他們知道 他們的正義造成了什麼樣的災難

  正是有此認知 主角群最後才可以彌補

  不然他們就直接開車走掉了


  回到這部電影

  我希望下一集能讓小女孩看到他放出去的恐龍殺害了多少"無辜"生命(車庫死那三個不無

  辜呢,因為是壞人)


  不要再練蕭維說什麼之後讓上帝決定了

  他們當下已經成為上帝決定其他人的生死 只是他們毫無自覺


  --

  榮格 的心理陰影 也是類似意思

  不要滑坡啦   就事論事不困難

  我有提到他啊 但他的作用就像 編劇給反面聲音隨便敷衍一下，有出現給你了滿意嗎這樣

  看到那邊，我一度以為電影有救了

  但小女孩按下去後

  大家就無事一身輕的樣子

  我能認同版上說小女孩放出恐龍以她的立場很合理

  但要真的合理，那群大人在小女孩放出恐龍後應該先把她K一頓吧？

  這樣又有點像合理自助餐了 我的看法啦

  不是啊 你想想看 愛龍人士從頭到尾都沒有直接接觸反面聲音 這本來就很敷衍啊

  比起編劇從開場灌輸到尾的恐龍生命的重要性

  編劇根本沒有拿捏好這個議題啊'
