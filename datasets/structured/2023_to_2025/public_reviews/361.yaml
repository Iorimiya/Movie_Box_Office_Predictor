content: "蔡明亮拍《何處》費神 亞儂弘尚希大開眼界\n\n2023/11/13 05:30\n\n\n蔡明亮（左）、亞儂弘尚希出席《何處》金馬首映。（記者潘少棠攝）\n\
  \n〔記者鍾志均／台北報導〕蔡明亮執導紀錄片《何處》昨在金馬影展首映，該片和龐畢度\n美術館合作，拍攝時受限於館內作品都有版權問題，美術作品無法在電影曝光，否則要支\n\
  付金額可觀的版權費，讓他得小心翼翼，不過他也說：「龐畢度仍有吸引我的地方，建築\n、作品都非常豐富。」\n\n蔡明亮拍《何處》前1個月就多次到法國勘景，透露原本希望一張白紙出現在廣場，沒想\n\
  到一放到現場就被風吹爛，拍攝陷入大挑戰；另外拍李康生時，遇到現場民眾「來亂」，\n不斷在李康生面前揮手測他的反應，讓蔡明亮一度很緊張，所幸李康生淡定完成戲分。\n\
  \n《何處》為「行者」系列第9部，亞儂弘尚希自認是演員新手，表示去到每個地方拍片都\n很新鮮，有大開眼界的感覺，蔡明亮則笑稱：「我若能活到80幾歲，還是想看李康生如何\n\
  在這系列表演。」\n\n蔡明亮執導的《日子》及畫作展覽同步展映中，他分享有觀眾原本坐立難安，看完電影後\n發現等紅綠燈變得更有耐心，讓他超開心。\n\n--\n\
  佛法的\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
