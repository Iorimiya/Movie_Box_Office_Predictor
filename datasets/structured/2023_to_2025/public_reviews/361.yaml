url: https://www.ptt.cc/bbs/movie/M.1488438327.A.E8B.html
title: '[普雷] 《漫漫回家路》，心，該歸向何處。'
content: '部落格版：


  （手機拍版抱歉）


  先前曾看過篇新聞報導，在印度據統計幾乎每八分鐘就有名孩童失蹤，而印度國家人權委

  員會在今年初出面說明，指出每年失蹤兒童人數約略有四萬五千人左右，但這個數字隨即

  遭到非官方組織駁斥，怒稱實際上的失蹤人數至少高於官方數據十倍、甚至高達百萬，真

  可以說印度目前所必須面臨最嚴重的難題，就是如何降低、甚至解決失蹤兒童人口數。該

  篇報導中也稱，失蹤兒童多為遭到他人誘拐或綁架，成為人蛇集團的謀財工具，如強迫截

  肢成街頭乞童，或者直接遭到分屍殺害已取出器官做買賣等，印度治安始終令各界隱憂，

  但在這篇報導裡，最令我震驚的，反倒是受害者家屬的心境轉折與事發後做法，若逮到嫌

  犯動用私刑是時有所聞，可有些家長則在選擇領到政府發放的死亡撫恤金後，『再去買個

  小孩回來』，看到這裡不禁想著，究竟是政府的無能致使家屬能這樣快面對現實，亦或是

  家屬的麻木才讓人蛇集團如此猖獗？


  《漫漫回家路》不過是這百萬家庭中的其中一個不幸案例，卻同時也是這百萬家庭中最幸

  運的故事，即使你知道片中小男孩薩魯並非是遭到綁架，而是單純的走失，只是若你能想

  到在這走失之後會有幾種假設性狀況，就會覺得能在識字不多、連自己名字與居住地都會

  說錯且無法明辨是非的情況下，在走失了二十五年後，還能回到家鄉，與家人重逢，是件

  多麼幸運的事。


  年僅五歲的薩魯，總喜歡跟著哥哥到處跑，偶爾接些小零工，更多時候則是替媽媽搬運石

  頭賺些外快，有次他執意跟著哥哥到外地工作，結果到當地時都已經天黑了，年紀小的他

  無法抵抗睡意，於是半夢半醒間答應了哥哥在車站椅子上等他，未料當他清醒後卻發現四

  周無人，走遍整個車站也找不到哥哥，這時又誤搭上了一班火車，累到再次睡著的薩魯，

  再次醒來時卻已經隨著火車被載到了離家好幾千里遠的加爾各答...



  整個印度約三百三十萬平方公里，是全世界第七大的國家，在這樣大的國家中自然會因為

  不同的種族、民族，而去產生不同的宗教信仰、語言，光是官方承認紀載的便有二十二種

  語言，包含「國語」印地語、英語、孟加拉語、泰盧固語、梵語等，而在這之後的據說還

  有千種未登記的語言。因此就算你是印度人，本身要學會所有的語言根本就是不太可能的

  事，更何況還是位年僅五歲的小男孩。薩魯隨著火車抵達的，是位在印度東部的西孟加拉

  邦中的首府加爾各答，官方語言是孟加拉語與英語，這對不會講這種語言的薩魯而言，宛

  如另一個世界，對家鄉一無所知的他，僅能靠著他腦海中的家鄉名「甘奈斯特里」四處尋

  求幫助，豈料非但得不到解答，還差點遭一對男女誘騙。


  四處流浪好幾個月的薩魯，最終在他人協助下，被一對澳洲夫婦收養，於是他就搭著飛機

  離開了印度，來到了日後他長達二十五年的新家。而當他熟悉環境後，養父養母再收養了

  一位男童成了他弟弟，一切好似都與過去的生活一樣，有愛他的爸爸媽媽、有兄弟、有家

  ，年紀小的薩路就這樣地接受了，可是當他慢慢長大，開始有了思考能力後，是否還能如

  此看待這個「家」？


  「我不是加爾各答人，我是走丟的！」


  本來可以自然的向他人表示自己的出生地的薩魯，當看見當年他總嚷嚷著要哥哥買的糖耳

  朵後，過去對家的想念再度於他的心裡掀起波瀾，現在與過去生活的景象開始重疊，其耳

  邊也不停傳來哥哥大喊著他名字的聲音，以及媽媽在眾多孩子當中尋找他的模樣，薩魯藉

  由高科技找到了回家的一線希望，可同時間，「家在哪裡」也成了他必須去正視的問題。



  《漫漫回家路》可切割為兩部分，一是年幼時的薩魯，二為長大後的薩魯，透過「薩魯」

  這個人的成長，讓觀眾得以觀察，究竟家與家人在一個人的心中是什麼樣子的。年幼時的

  薩魯在心智等方面來說仍未發育完全，於是你可以看見，他雖然對於與哥哥走失有著慌張

  、害怕，甚至在火車上怕到向路人求救，但警覺心不夠的他，一旦遇上了對他好的人，他

  便會跟著他人走，如他第一個遇到的那位看起來好心要幫他的女子，還跟著他去到家裡、

  喝著果汁，露出心滿意足的微笑，「走失」這件事好像瞬間消失了般。直到女子同夥出現

  薩魯才隱約覺得不太對勁趕緊逃跑。後來被收養後，不能說他很快融入，而是極快「適應

  」了新家庭，眼前見面不過幾小時的陌生男女成了他的「爸爸與媽媽」，加上他原本的家

  與新家的居住環境相差太多，致使他來到新家看見許多過去從未見過的事物是如此的好奇

  以及欣喜，好似對這個年紀的薩魯而言，來到這裡是更好的。


  只是畢竟他並不是被拋棄的，所以他心中不會有恨，那既然不會有恨那必然會有思念，長

  大後的薩魯開始想起許多過去對家的記憶，從這時候開始「現在」與「過去」；「收養家

  庭」與「原生家庭」逐漸出現拉扯，兩個家與家人之間漸漸出現了差異，並非是好壞上的

  差異，而是兩者間對他而言的意義上的差異，這是長大後的他才遇到的難關，尤其當他知

  道有機會靠著高科技找到原本的家後，這個難關難度再度提升，此時他必須面對的，其實

  不是他與養母的對辯，而是他自己決定選擇讓誰傷更多心，或者說他比較想回哪裡的家？

  只是無論他做哪個決定，都註定會有另一個家不再完整了。


  《漫漫回家路》整部戲的兩大亮點（嚴格來說是三個），一是飾演薩魯的桑尼帕瓦與戴夫

  帕托，二就是飾演其養母的妮可基嫚，電影本身就是以前者為主軸去做延伸，他自然能有

  許多發揮空間，而他確實也在這個空間裡發揮的淋漓盡致，輪流將薩魯這個角色所該有的

  情緒反應、心境轉折完整呈現，表演層次相當分明；後者戲份雖少，但其作用就如《海邊

  的曼徹斯特》中蜜雪兒威廉絲那樣，成功讓電影增加了不少張力與可看性，如《漫漫回家

  路》最精彩的莫過於妮可基嫚與戴夫帕托那場母子間的對話了。


  此外，《漫漫回家路》擁有好演員，但卻沒有好劇本支撐，或者正確來說電影前後段的表

  現落差太大，前段優於後段，即使戴夫帕托與妮可基嫚再會演，不曉得為什麼我寧願看小

  童星演完整片，後半段的劇情太過冗長，耗費過多時間在鋪陳、甚至很多時候都在重覆著

  一個點，不若前段精簡有力，整體未能達到平衡，這是我覺得本片相當可惜的地方。


  在看電影的時候，雖然早就知道薩魯是靠著Google Earth找到家，但演到一半，一群人很

  認真在介紹Google Earth是什麼，害我忍不住噗哧笑了出來，還以為在看什麼Google Ear

  th產品說明會...



  --'
