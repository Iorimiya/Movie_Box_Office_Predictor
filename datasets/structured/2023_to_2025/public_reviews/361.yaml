url: https://www.ptt.cc/bbs/movie/M.1528538594.A.427.html
title: '[好雷]侏儸紀世界-殞落國度，恐龍該怎麼處理?'
content: "缺點還是先說，這片的劇情的確是缺乏驚喜，算是中規中矩，然後預告又太雷，把前面的\n爆點都先講了，所以對觀眾來說好一段劇情就是在等著看主角群怎麼上當而已。\n\
  不過扣除這些，到莊園以前的部分還是很棒的，開場滄龍逃脫+暴龍突襲弄得很緊湊有氣\n勢，重回已經荒廢的侏儸紀世界的場景，也會讓看過第一集的觀眾頗有感慨，腕龍帯著動\n\
  地的搖晃出場算是同時致敬了侏儸紀公園1的兩大經典場景，也因為有這個特寫，所以最\n後腕龍在碼頭上陷入了火山的烈焰中，帯著哀鳴被吞沒，的確讓人心酸，侏儸紀公園就此\n\
  在烈焰當中退場了。\n\n後半沒前半精彩是真的，帝王暴龍的縮小版在古堡裡追殺小蘿莉，有種哥德風的鬼片感，\n整體來說我是覺得中規中矩，如果喜歡侏儸紀世界1，我是覺得2是值得一看的，至於2是否\n\
  能發揮一個好的中繼者的角色，就要看3能否把故事作個好的收尾了。\n\n版上很多人在吵的重點是\n1.保護基因製造出來的恐龍是不是偽善?\n2.最後把他們放出去是不是智障的行為?\n\
  \n第一點我是不覺得不該救，恐龍是被製造出來的，但那是人類讓他們重現於世界，這世界\n上其實充滿了被人類利用配種等方法製造出來，已經離開人類就無法活下去的家畜與寵物\n\
  (例如說北美的火雞體型被特別培養，已經大到無法進行自然交配，沒有人類進行人工繁殖\n，火雞就會絕種；至於紅貴賓別說野放，放到街上能活幾天都很難說)，侏儸紀公園的恐龍\n\
  是活生生的，有生命與思考能力的動物個體(侏儸紀世界的重心小藍更凸顯這個重點)，人\n類培育出他們，繁殖他們，然後把他們一放了事，自生自滅，今天如果他們不是恐龍，而\n\
  是貓狗，網上應該也會對棄養的飼主幹譙到不行，恐龍也是一樣道理。\n\n但以現實層面來說，我也同意片頭馬康姆博士主張的，起碼政府沒有義務，要為此拿稅金\n擦屁股(雖然馬康姆的理論基礎不是經濟上的)，支持保育他們的像是女主角就得自己想辦\n\
  法去募款，去遊說議員，那跟保育獅子或西伯利亞虎等本質上沒什麼不同。\n\n第二點，我覺得女主角最後沒按下按鈕是正確的，以他的立場，把它們野放到外面是個錯\n誤，但在小蘿莉知道自己的複製人身分後，小蘿莉放掉它們我覺得是可以理解的，因為他\n\
  感同身受自己一樣是侏儸紀公園科技的產品，如果他能正常的思考、正常的感受，而且在\n之前並不覺得自己跟其他的人類不同，那他自然更能認同那些想要逃脫的恐龍是跟他一樣\n\
  的生命，這點讓他想事情的點跟男女主角這種「人類」是不同的。\n至於說讓他們逃出去，那可是美國本土，同樣的追蹤系統在努布拉島上可以用，在美國一\n樣可以用，現在把他們放出去只是避免了他們當下死亡，但事後圍捕並沒有那麼困難(回頭\n\
  說星爵的做法很智障嗎?我覺得他只是搞亂了拍賣會，但他的計畫在混入莊園前就有跟女角\n講了:報警，由官方扣押這些恐龍，所以像帝王迅猛龍這種潛在危險性那麼大的物種，更不\n\
  能讓他被私下運走散布，至於會有智障的恐龍牙齒收集者把他放出來，就沒人預料的到了，\n但不管計畫再好再周密，人會作蠢事導致事情失控，不就是侏儸紀系列一貫的主軸?\n\
  \n我覺得片尾拍了一堆恐龍野放到環境中的片段，其實反而讓人忽視了隱藏的主旨:重點其實\n已經不在恐龍，而是基因改造的技術已經流出了，即使你把恐龍都抓回來，但吳博士這樣\n\
  的人已經在這條路上走到無可挽回的更遠的地方。吳博士跟金主吵的時候，金主說原型賣\n掉沒關係，我們很快就會作出更多，吳博士的回應才是重點:\n\n「很快他們也會作出更多!!」\n\
  \n就像前一陣子的「毀滅大作戰」一樣，基因重組的危險政府不是沒注意到，但潘朵拉盒已\n經被打開，帝王暴龍到帝王迅猛龍證明了侏儸紀世界中的基因工程已經從復原進化到能創\n\
  造更新的物種，為了人類的需求來打造更快，更狠，更聰明的生物兵器，接下來出現的就\n是保護傘公司了，最後面說的我們面對的侏儸紀世界的來臨，不是說恐龍進入我們的生態，\n\
  而是製造恐龍的技術將會徹底改變這個世界。\n\n也就是說，星爵他們其實並沒有阻止到真正的危機，而小蘿莉放不放恐龍，其實根本無關\n緊要了，跑到自然環境中的恐龍在當下的環境裡無法繁殖成群(跟獅子對吼的暴龍有可能不\n\
  被抓嗎?特別聰明的小藍或許逃得過，但光靠她也無法繁衍)，被車子載走的恐龍才危險，\n因為在有心扮演上帝的人類手上，他們會繼續往難以預料的方向演化增值，直到下次的錯\n\
  誤出現以前，我們都不知道這個世界會變成怎樣。\n\n\n\n--\n晚輩是來勸架的 不是來和六大派結仇的         妖尼姑!!妖尼姑!!妖尼姑!!\n \
  \      \\          　　　                       \\      _ _  ∵\n     ( 0w0)　　　(O_O\
  \ )          　===>　  o ( 0w0)＿(ο  )ζ 幹你媽的!!\n      (  )oo　　　( >)          (30秒後)\
  \    ﹀\\  \\   (﹀)u    勸架的人打得最賣力\n       ||          ||                  　     ＜\
  \ ＼ 〈  ﹀\n                                                                ---ucda------\n\
  \n--\n哈哈，大家知道在講誰就好了啦XD\n逃出去的多半都是單一一隻該物種，而且能在外面繁衍出族群需要更多時間，但他們能逃多\n久是很有問題的，如果時間夠久還有可能，但在努布拉島上已經過了好一段時間了，小藍\n\
  的族群一樣沒有復原，她還是獨自一隻，所以被野放的不是真正危害所在，危險的在於馬\n康姆博士說的，基改技術已經流出，在改變發生之前，你不知道倒底危害會多大。"
