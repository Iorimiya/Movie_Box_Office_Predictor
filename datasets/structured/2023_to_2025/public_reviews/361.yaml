title: '[好爽雷] 各位觀看復四在何處時落淚？(雷)'
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  1.影片名稱 : 復仇者聯盟四：終局之戰


  2.觀影時間 : 4/26 9:00


  3.觀影地點 : 大直美麗華iMAX 3D


  4.觀影方式 : 自行購票


  §其他防雷說明(非必要) : n刷等其他說明請於此區說明....可留空




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  此區為發文防雷頁

  可選擇性提供上列 1~4 資訊  或不提供亦可

  觀影心得於分隔線下方發布即可


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  開頭的鷹眼那段我有小哭，眼淚在眼眶裡打轉


  還有黑寡婦在基地落淚之類的


  基本上就是在講述復三後彈指的復癒階段都讓我小泛淚


  還有鋼鐵人在洗碗時對蜘蛛人的愧疚悔恨這邊


  而真正讓我眼淚落下來的


  是在大決戰時，美隊在全員到齊時說的一句話，


  「復仇者，集結！」


  然後配上整個軍團的畫面，一整個讓我爽到落淚


  這邊的情緒類似WW裡的無人之地給我的感覺，


  美隊的一句話，真的讓我爽到眼淚都留下來！


  我還爽到用手肘尻旁邊的朋友


  各位又是在哪一段開始落淚的呢？


  ---------------------順帶提個問題----------------


  在最後美隊要把寶石物歸原處時


  老美隊坐在湖邊，


  為何是安排由酷寒戰士示意獵鷹過去？

  (我比較喜歡冬兵的稱呼，下面用冬兵代替)


  我想以交情來講，冬兵是美隊的青梅竹馬


  也一起經歷過大大小小的抗德戰役，


  而獵鷹雖然在現今也一起跟美隊經歷許多戰役

  (戳爆九頭蛇、內戰、內戰後與黑寡婦+美隊的流亡組合)


  我想這涉及到之後的美隊接替安排


  可是為何是獵鷹而非冬兵


  雖然兩人在漫畫都有當過美隊


  當然誰接美隊我都可以，甚至我還比較喜歡獵鷹多一點


  但對這個安排還是有點疑惑


  各位想法如何？





  --

  對

  就是這邊，接著獵鷹一句"Captain, on your leftr"

  (我好喜歡這次活用以前的梗)

  然後一連串甜甜圈出現

  隊長一句「復仇者，集結」整個爽到翻掉

  一連串的情緒

  黑寡婦犧牲也很感人

  可是我再看到那邊的當下

  心中先想到的是

  不是要犧牲所愛之人才可以

  後來理解他們之間是家人的愛

  但是情緒已經過去了XD

  對，鋼1東尼一回來就說想吃起司漢堡，這次真的把漫威歷史所有梗都用上了

