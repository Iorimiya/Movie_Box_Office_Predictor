title: '[片單] 不到最後不知道主角情定何處的片'
content: '1. 請描述欲尋找電影的類型或特徵（請盡量描述清楚）

  最近想看一些主角在愛情選擇中掙扎的片

  就是不看到最後不知道男女主角會選擇跟誰在一起的片

  不要男二女二一看就遠輸給主角類型的片

  希望最後男女主角是有做出選擇的而不是最終都沒跟人在一起.

  私心希望是輕鬆的片不要太沉重.如果劇情很優的話就都可以接受

  若沒有在人之間/在愛情跟麵包或者有其他抉擇的片也可以

  但希望是要到最後一刻才答案揭曉


  2. 已知符合需求的電影或偏好的電影類型（為避免重複推文，請至少列舉一部）

  特務愛很大(雖然劇情有點鬧不過大致上符合我想看的種類,我覺得不錯)

  愛情三選一(此類型印象最深刻的片)

  看過的片不多,還請大家多多推薦


  3. 不喜歡的電影類型            （不需要板友推薦的電影，可填刺陵）

  不喜歡有暴力/色情/死亡鏡頭的片



  謝謝大家


  --

  哈哈..其實韓劇我也是滿喜歡看的,謝謝你!

  謝謝大家推薦.怎麼這麼多人推薦倚天屠龍記XD

  小說看了非常多遍所以一直沒有動力看電影.有很值得看的改編劇情嗎?!

  似乎都是一些比較特殊劇情的電影

  目前偏向先看美麗翹家人>購物>親愛的初戀

  謝謝大家!'
