  \                 菩提本無樹，\n\n                             明鏡亦非台，\n\n            \
  \                 本來無一物，\n\n                             何處惹塵埃？\n\n\n\n\n要怎麼簡短形容\
  \ < 銀翼殺手2049 > 這部電影的意境？\n\n我想了很久，佛教禪宗的這兩段偈子或許能夠簡短的表達這部電影的些許意境吧。\n\n\n\n-------------------------------------防雷------------------------------------\n\
  \n\n\n\n這部電影承襲了前作的概念，電影的主題圍繞在複製人的議題上。\n\n人類為什麼可以成為人？什麼是人？人存在的意義是什麼？人跟其他生命的差別在哪裡？\n\
  \n在看這部電影時，這些問題不斷地在我腦海中出現。\n\n\n但這些問題的答案，我不知道，導演也沒給個結論，畢竟這種問題永遠都沒有標準答案。\n\n\n可是，我們從一些片段，似乎又看到了一些導演想傳達給我們的蛛絲馬跡。\n\
  \n\n電影裡，當K在片頭去殺同為複製人的眼鏡男時，眼鏡男說了什麼？\n\n\n\"你們不願去相信奇蹟\"  \"殘殺同類 你感覺如何？\"\n\n\n\n在K槍殺眼鏡男後，挖走了他的眼珠後，K在房子外的大樹下，看見一朵黃花。\n\
  \nK將黃花收起後，回到了飛機上。當他看向座艙外的時候，眼神裡多了些許迷惘。\n\n\n枯死的大樹下，一朵稚嫩的黃花，這不就是一個奇蹟嗎？\n\n回程的路上，鏡頭帶到K，此時已是一片靜默，陷入一陣沉思。\n\
  \n\n\n\nK在帶走那朵黃花後，並沒把它交給主管，而那朵黃花，就再也沒有出現了。\n\n\n\n\n電影裡，K的長官告訴K說：\"你沒有靈魂 一樣活得好好的\"\
  \n\n可是，電影裡，K似乎在心裡默默的抵抗這個想法。\n\n他想試圖去證明自己記憶中的那些回憶是真的，\n\n他也期望自己是瑞秋跟狄卡生的小孩，他內心一直期望自己是真正的\"\
  \"人\"\"\n\n所以當他最後知道他不是瑞秋跟狄卡生的小孩時，他的失落是如此的明顯。\n\n他的情緒從電影初期的平淡，到中後期的醞釀、爆發、最後又陷入絕望。\n\
  \n\n這些情感都是真的\n\n\n可是，如果這些情感都是真的，那為何\"\"沒有靈魂\"\"的他，會有\"\"人真實的情感\"\"？\n\n\n為什麼人會是人？什麼是人？人跟其他生命有何不同？\n\
  \n電影裡透過K的一連串探索，慢慢將問題丟給觀眾。\n\n\n\nJoi在電影裡只是一個產品，一個花錢就可以買到的人工智慧。\n\n\n可是，\n\n\n當她從家裡走到戶外時，她伸出了雙手去擁抱周圍的空氣，彷彿看到了全新的世界。\n\
  \n從她的表情跟驚異，你看得出她很震撼於擁有新的生命形式。\n\n\n當她被雨淋時，她張開了雙臂，試著去感受雨滴交落在身上的感覺。\n\n她緩慢地走到K的面前，輕輕地抱著K，給了K一個吻。\n\
  \n\n這些感情都是真的。\n\n\n當K後來需要跟女生有魚水之歡時，Joi讓自己跟另一個女孩同步，讓K跟另一個女孩上床\n\n兩人完事後，Joi面帶哀怨的跟另一個女孩說，我們之間沒關係了，妳走吧。\n\
  \n那悲傷之情、那哀怨的眼神，都是真的。\n\n\n當劇情後段，K決定要逃離身處的一切時，Joi希望K把她的數據刪掉，即使這會讓她消失\n。\n\n\n妳可以看得出Joi眼神裡的悲痛、哀傷。\n\
  \n\n當Luv打倒了K，要傷害K的時候，Joi挺身試圖阻止Luv\n\nLuv在把Joi踩碎之前，她奔跑到K的面前\n\n\n\n\n\n\n\n\n\n\n\
  \n我愛你\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n這是Joi說的最後一句話。\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n我們無法知道Joi是什麼時候開始產生情感的。\n\n也無法知道K是什麼時候開始渴望自己是一個真實的人。\n\n\
  \n\n這些我們都不知道。\n\n但他們的情感、他們的情緒，卻是那樣的真切。\n\n\n\n\n\n隨著時間的推移、歲月的流逝，這些年來，我們開始慢慢懂得自己為什麼而活。\n\
  \n也開始慢慢有想法，知道自己和其他生命有什麼不同。\n\n\n\n\n唯一一件讓我至今都無法明白的是，\n\n為什麼我會在十多年前的某天，愛上了一個女孩，願意為了她付出我生命的所有，\n\
  \n不求任何回報。\n\n我一直都無法明白。\n\n\n\n\n\n\n\n菩提本無樹，明鏡亦非台，本來無一物，何處惹塵埃？\n\n--"
