title: '[好雷]安眠醫生：如何運用天賦決定你身在何處 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  「安眠醫生」改編自史蒂芬金的驚悚小說，為經典著作「鬼店」的續集作品，由伊旺‧麥

  奎格主演，劇情描述部分人類持有「閃靈」的能力，這份力量能為生活帶來助力，但同時

  也會吸引惡靈的注意。


  丹尼‧托倫斯(Dan)幼年時期因為自己的閃靈能力，在全景飯店度過的日子中不斷地遭遇

  靈異現象，在種種事件後與母親搬至佛羅里達州，二十歲時母親過世，他的人生陷入低谷

  ，耽溺於酒精中無法自拔。


  他的閃靈讓他能感知到即將殞落的生命，而在因緣際會中，他接觸了一位擁有極強閃靈能

  力的年幼女孩艾柏拉‧史東，一步步揭開了發生在這世上一直不為人知的孩童失蹤案件的

  真相…。


  我以前並沒有看過史蒂芬金的「鬼店」，但實在太過經典，有不少作品曾致敬其片段，近

  期來說就是「一級玩家」，裡面有一段是眾人挑戰「鬼店」電影的劇情，因此在觀賞安眠

  醫生時也有挖掘到彩蛋的感覺。


  個人覺得這部電影拍得很不錯，首先是架構完整，即使沒有看過「鬼店」，也能當作一部

  超自然現象作品來看，像X檔案一樣；再來是男女主角的演技，相當出色，尤其女主角高

  帽蘿絲(蕾貝卡‧佛格森飾)從一開始便給人一種黑魔女的魅力，明知有危險卻移不開目光

  ，宛若被梅杜莎盯上卻渾然不覺的獵物；最後是電影的意境，不只是驚悚片，其中有著更

  多的人生哲理。


  相當推薦去電影院看，氣氛好，音效佳，Jump Scare的使用次數近乎零，驚悚全用演技營

  造，個人很滿意。


  評分：


  演技：8.5(男女主角都演得很棒，蕾貝卡‧佛格森真的是非常有魅力的反派)

  劇情：9.0(電影有足夠的時長說故事，架構完整，氣氛營造得很好)

  音效：8.0(很喜歡電影中很常使用宛若心臟怦怦跳的音效，雖然偶爾大聲了點，但瑕不掩

  瑜)

  特效：6.5(特效就稍微可惜了一點，某些時候給人廉價感，尤其是宇宙背景的橋段，可能

  經費不太夠)




  ------劇情防雷線---------



  首先，我很喜歡這部電影的敘事方式，一名小女孩Violet的失蹤僅被化作了一張貼在告示

  欄上的尋人啟事，然而勾引這名小女孩的Rose，她的魅力與神祕在片頭就先被點題，扎根

  於觀影者心中。


  Dan的閃靈能力沒有為他帶來太多好事，小時候騎著玩具腳踏車就巧遇237的超醜女鬼，然

  後被纏上，最後靠著自己強大的能力將其封印。然而跟很多作品的設定相似，純真的心靈

  與閃靈強度成正比，長大後的Dan能力衰退，但因為初始強度高，依然能聽到他人內心的

  聲音，察覺即將逝去的生命，在戒掉酗酒的惡習後於臨終安養院工作，幫助患者安詳死去

  。


  位於美國東岸，一名小女孩Abra從小就展現驚人的閃靈能力，能將無數的刀叉懸浮於天花

  板，卻因會被視為異類而隱藏自身的力量。(話說都能做到刀叉懸空了我是她爸媽我一定

  信她那些怪力亂神)


  三個重要角色，Dan、Rose和Abra，分別可被看作中立、邪惡、善良，而當這個平衡被打

  破，便是命運的齒論轉動之時。


  Abra於夢中目睹Rose率領真結族殘殺小男孩Bradley的場景，她感受到絕望與恐懼，雖與

  Dan取得了聯繫並告知真相，Dan第一時間卻明白蹚這件事情的渾水可能會付出的代價而先

  行退卻。


  其實這邊Dan的作法也不是不能理解，真結族的作法固然不對，但這種超自然的力量並沒

  有法律可以制裁，憑藉著一己之力並不能改變什麼，他警告Abra應該收手，否則會陷許多

  人於險境。


  Abra的強硬與聰慧超乎想像，Dan的警告令她的閃靈能力運用更上層樓，對Rose造成了重

  大的傷害，宣告了這場戰爭的開始。Dan在知道這一切已經無可挽回後，決定與Abra攜手

  擊倒真結族。


  過程相當震撼，往往在這些事件中被捲入的都是無辜之人，能切身讓人體會到何謂命運無

  常之感。我很喜歡Dan的好友Billy，他無條件的相信Dan的一切，即使是彷彿怪力亂神的

  言論(換作是我一定會覺得我的朋友怎麼是個神經病)，最後也與Dan一同對抗真結族，卻

  被催眠術者陷害而自殺身亡，另一頭Abra的父親也在這場戰役中殞命，而這就是一開始

  Dan不希望跟真結族扯上關係的下場，正義的決斷，可能會付出慘痛的代價。


  事到如今已經沒有退路，Dan知道唯一可能打倒Rose的方法─全景酒店的惡靈們，這群惡

  靈一直以來都渴望著「精氣」，自己的箱子關押著無數惡靈，現在便是讓他們大快朵頤之

  時。


  最後的大戰不只是大戰，也是Dan面對過去的旅程。他將自己無處宣洩的憤恨吶喊了出來

  ，他重新面對了對他而言，以「酗酒」與「暴力」之詞構成的父親，他終於了解到自己的

  父親，也曾為了家庭在奮鬥著。他紅著眼眶，想到為了逃避現實，沉浸於酒精的自己也曾

  經是那麼不堪。回到此處，與父親對談，似乎有那麼一點點碰觸到了父親的心。


  心靈是塊黑板，酒就是個板擦。


  然而Dan已不再頹喪，這杯酒他絕對不會碰，他現在就處在自己應該在的地方，他找到了

  自己的閃靈能力的用途，幫助了很多人，而現在的他，已經不再需要被酒精束縛。


  與Rose的大戰相當精彩，原本想以箱子束縛卻失敗，最後還是召喚酒店惡靈逆轉勝，算是

  把各種伏筆和可用元素運用得淋漓盡致，酒店也在壓力爐爆炸後化為廢墟，這座鬧鬼的「

  酒店」帶著「安眠醫生」一同葬生火海。


  自己種下的因緣，總有一天會在命運之輪上再次碰頭。曾經被閃靈之友幫助的Dan，這回

  換他來幫助Abra，雖然這場戰役依舊帶走了無辜的性命，但卻也讓更多擁有天賦的孩童免

  於真結族的毒手。


  與Dan說的一樣，這世界上肯定存在著其他真結族，但也一定存在更多像Abra這樣，願意

  將自身的力量用於正途的好人。力量的用法沒有對錯，正義與邪惡的界定只有最後存活下

  來的人可以決定，但這部電影中的人，都面對了自己所做的選擇並為之全力以赴，其實這

  部驚悚片看完後心態是相當正向的。




  最後，來講講全片最有趣的地方─


  彷彿看著神經病患者的Billy，以及手抖拿不住酒杯的Abra老爸，根本就是我們這群觀眾

  的投射阿~！到底誰要凌晨四點跟別人去挖屍體啦~~~~~！


  部落格：


  --'
