url: https://www.ptt.cc/bbs/movie/M.1702282549.A.CB0.html
title: '[普雷] 神鬼海底撈的心得'
content: '最近青龍獎剛結束 看到新聞標題寫著

  神鬼海底撈是這次最大的贏家

  看到這個片名真的有點微妙

  如果單看封面、片名可能會以為是什麼搞笑片

  但看電影介紹竟然是一部動作片

  所以就帶著好奇心用friDay看這部韓影

  但看完覺得這部拍得很認真!





  (以下有雷 慎入)














  雖然知道此海底撈並非火鍋的海底撈

  但也很符合劇中的犯罪行動

  個人覺得這個翻譯別有一番風味

  演員的演技我覺得都有在水準內

  特別喜歡電影裡面的兩場武打戲

  其中一場在水下真的超精彩

  故事的節奏也沒有到很快 中間也有穿插一些笑點

  個人是蠻推這部電影啦 看完也不會覺得很後悔XD


  --'
