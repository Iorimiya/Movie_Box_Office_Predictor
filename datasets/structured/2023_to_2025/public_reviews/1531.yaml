url: https://www.ptt.cc/bbs/movie/M.1696389529.A.FC9.html
title: 'Re: [好雷] 神鬼海底撈'
content: '這片主打金惠秀跟趙寅成當男女主角

  金惠秀是很多屆青龍獎影后跟主持人

  被譽為青龍的女人，多半都演江湖片


  青龍獎感覺就很江湖味的感覺

  應該是韓國大黑道辦的電影獎

  就像義大利黑手黨辦的威尼斯電影獎一樣


  這片韓國原名叫走私

  最終還是警察是最壞的賊頭

  只有黑道電影公司拍片才能把警察拍那麼壞

  除非警察自己出資拍片，成龍才能靠演警察大紅


  這片拍得很有韓味，1970年的復古風

  最近在家轉台有看到海女題材的韓劇

  沒想到海女電影也被拍出來

  可能金惠秀看了海女韓劇就借題發揮了吧


  裡面導演手法看得讓我想睡覺

  因為敘事很慢，整片都在秀復古風

  但一到打鬥場面就醒來了，這片真是超血

  趙寅成被一堆魚販漁夫當魚一樣的被宰


  中國功夫片【師父】最後都是用刀械大對決

  但這片也是用刀械但是真得你死我活

  沒跟你點到為止的，就像原PO說獨眼龍很能打

  我看他應該是這片的武術指導才對


  但就算再能打最後還是寡不敵眾被亂刀捅死

  畢竟不是在演超英片或葉問黃飛鴻的超人功夫片

  趙寅成也是一根冰鑿演的比獨眼龍還厲害

  但一樣被大反派胸口一刀倒地

  但片尾竟然沒死，果然比獨眼龍還厲害，殺不死


  帥哥死了，女人就算發大財錢也很無聊

  金惠秀怎麼可能讓觀眾粉絲看到帥哥偶像死

  這片應算是女性電影，因為最後壞人都死光了

  只剩下地位很低的海女，升格變船長把船開走


  女人應該是無法開船的，只能當海女

  然後當魚販，沒法當水手或船長

  海人都很窮才會開始靠海女搞走私

  海女撈九孔改撈沉在海底的黃金鑽石貨物

  快退休海巡老警官看似剛正不阿

  但碰到黑道公司拍的片當然也要見錢眼開

  這樣青龍獎的江湖戲才演得下去





  --'
