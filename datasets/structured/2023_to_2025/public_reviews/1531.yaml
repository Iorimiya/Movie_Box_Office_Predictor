url: https://www.ptt.cc/bbs/movie/M.1690824667.A.D74.html
title: '[無雷] 神鬼海底撈，片名很爛但不錯'
content: '聽說這部韓國賣得很好


  是他們票房第一名


  優點：


  演員演技都很優秀


  配樂很棒，音樂很好聽


  水中攝影很厲害，陸地上的也不錯，尤其是燈光組，裡面很多打光都很好看


  水中動作戲也很強，尤其在海裡打架片段看得很爽，看海女們如何利用自己的優勢協同作戰



  缺點：


  片名實在是有夠爛，看了很想吐槽，又是自以為幽默只想搏眼球的片商


  故事還蠻平鋪直敘的，算通順，但沒有什麼轉折


  兩小時的片長感覺可以再精煉一些，裡面有些橋段有點多餘


  反派沒有很厲害的感覺，鬥智的部分沒有太多



  整體還算推薦


  評分7.4/10


  -----

  Sent from JPTT on my Google Pixel 6a.


  --'
