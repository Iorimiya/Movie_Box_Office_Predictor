url: https://www.ptt.cc/bbs/movie/M.1690598439.A.496.html
title: '[好雷] 神鬼海底撈'
content: "昨晚剛好在戲院附近打發時間, 想說挑一場馬上能進場的電影看\n雖然不知道這片是什麼, 也沒看過預告片,\n但看在片名這麼北藍的情況, 感覺可以賭賭看\n\
  \n1. 電影設定在70s的韓國, 主角是一群海女\n\n2. 調性輕鬆, 但不是喜劇\n   事實上越後期劇情還蠻黑暗的, 人性黑暗\n   但還好最後結局還不錯,\
  \ 海女全員生還\n\n3. 故事本身不是特別吸引我\n   不過承著2. 的理由, 到最後我還蠻enjoy的\n   尤其是三個反派勢力的消長, 把原本不是很有趣的架構提升\n\
  \n4. 在海底打架, 以及大白鯊出現,\n   還有拿行李箱擋刀的時候\n   突然有種在看成龍警察故事簡單任務的既視感!\n   這點讓我覺得很加分\n\n\
  5. 獨眼龍原本一直以為在耍中二裝酷\n   結果還真的能打, 動作有夠快!\n\n6. 看到結尾一群女的站在船頭瞪著反派\n   我才意思到這也是一部女力電影啊!\n\
  \   而且還是一部及格好看的女力電影,\n   主角們不是花拳繡腿的漂亮寶貝,\n   而是飽歷風霜的職業中年婦女\n   反派們也沒有故意降智, 壞度智商武力都有在線\n\
  \   這群海女靠著團結跟計謀打贏壞人, 不是編劇故意讓她們運賽賽贏的\n\n7. 好看, 給好雷\n\n--\n你說的沒錯 英文片名Smugglers就是走私者\
  \ 簡單明瞭\n海底撈是在拉拉麵嗎\n故事就在講走私 我是認為英文片名沒有問題\n神鬼鬍鬚張"
