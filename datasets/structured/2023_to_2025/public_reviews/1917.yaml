title: '[好雷]瑪琳艾索普：首席女指揮 The Conductor'
content: "雷文防雷資訊頁\n\n瑪琳艾索普：首席女指揮\nThe Conductor\n2021美國電影記錄片\n\n\n\n在源遠流長的古典樂史中，名滿天下的女性演奏家不計可數，女性指揮家卻顯鳳毛麟角，\n\
  能夠登上世界級頂尖樂團指揮台的女性更是少之又少。身兼美國巴爾的摩交響樂團常任指\n揮暨音樂總監、巴西聖保羅州立交響樂團常任指揮與維也納廣播交響樂團首席指揮家，同\n\
  時也是史上首位登上倫敦逍遙音樂節「最後一夜」的女性指揮家瑪琳艾索普 (Marin Also\np) 則是少數能打破長年由男性統治的指揮台，成為古典樂史上成就最高，至今仍在改寫\n\
  紀錄的女性桂冠指揮家。\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n這片追看的動力，來自於我是李英愛的粉絲，她主演的韓劇\
  \ Maestra（12集）將播出，片\n中她扮演指揮家-車世音-的角色，所以想要對這工作內容及這領域少見的女性有更多了解\n，因此看本片是有受用的。這片稱呼主角也是Maestra...\n\
  \n韓劇Maestra\n\n\n本片主角Marin Alsop克服了音樂指揮領域之玻璃天花板的障礙，這中間的過程，花費了\n相當多的心血及精力，也令她有心成為先驅，排除一些障礙，避免後進女性遭遇和她類似\n\
  的困境，令人敬佩。本片對她的生活描寫，就像一首交響樂，影片中的各個部份，逐漸整\n合為一個關於奇異的雄心大略、成就和毅力的敘述。\n\n本片採用了相當標準的方法，最吸引人的部分涉及音樂製作本身。簡言之，本片是一位鼓\n\
  舞人心的女性的肖像，她改變了古典音樂界，並賦予了其他女性音樂家權力。本片對於任\n何欣賞偉大藝術的人來說，是值得一看的記錄片。是對Marin Alsop 旅程的親密、精心製\n\
  作的審視。\n\n本片導演伯納黛特楹陵痟筒ZBernadette Wegenstein在關於本片主角Maestra Marin Also\np大師的傳記片中，看到了指揮界名人大師倫納德概B恩斯坦Leonard\
  \ Bernstein指導Marin\n Alsop的鏡頭，以及Marin Alsop精彩表演的片段。 她的故事確實鼓舞人心，令人振奮，\n主角性格的真誠溫暖，和鼓舞人心的精神，都讓人眼睛一亮及為之感動。\
  \    ☺\n\n個人滿意度80分（滿分100）。\n\n\n--\n\n韓劇Maestra, 目前報導將在今年12月上旬tvN播出，每週二集，共播六週。台灣的上架平\n\
  台，則尚未確定。\n\n關於片名，將播出的韓劇Maestra及Netflix電影Maestro，a及o：\n\nBradley Cooper 自導自演的伯恩斯坦(Leonard\
  \ Bernstein) 電影《MAESTRO》將於2023/1\n2/20起在Netflix播映！\n\n關於片中的音樂片段，本片會重現伯恩斯坦1974年在愛丁堡Ely\
  \ Cathedral指揮馬勒交響\n曲《復活》的片段－其中由次女高音Isabel Leonard「飾演」Janet Baker；另外片尾會\n有伯恩斯坦《坎第德》序曲。"
