url: https://www.ptt.cc/bbs/movie/M.1675604845.A.5B0.html
title: '[好雷]《瑪琳艾索普：首席女指揮》，為性別歧見'
content: '部落格版：


  坦白來說，會知道這部片還是因為前陣子看新聞，看到瑪琳艾索普針對奧斯卡熱門作品《

  TÁR塔爾》中由凱特布蘭琪所飾演的莉蒂亞塔爾這個角色是否是以她為原型提出質疑，她

  並不在意這個角色與她高度吻合，但她卻對角色的某些私生活與在職場上的表現頗有微詞

  ，認為這樣子的設定無疑對她是種冒犯，而凱特布蘭琪事後亦在一次受訪中回應此事，不

  過對於瑪琳艾索普和莉蒂亞塔爾相似程度有多少、又或者是情節上的設定如何，其實都不

  影響觀眾去認識這位打破傳統男性制霸、影響後來指揮界深遠的女指揮家。雖然小小可惜

  的是，據悉原本作品會同時間上映，可後來各自提前與延後，不然想說若是真能將兩者做

  比較與對照，想必會是另種觀影上的樂趣。


  回到正題上來看，《瑪琳艾索普：首席女指揮》是部中規中矩的紀錄片，以過往的照片、

  影像和現在的畫面，穿插進主角與身旁相關人士的訪談裡，領著觀眾深入且全面的去認識

  這位改寫歷史的女性指揮家瑪琳艾索普。關於她的傲人成就其實網路上都查找得到，電影

  本身也有提及到很多，例如她曾指揮過聖保羅交響樂團、茱莉亞交響樂團、維也納廣播交

  響樂團以及讓她聲名大噪的美國巴爾的摩交響樂團等知名管弦樂團。而電影則順著這些經

  歷爬梳瑪琳艾索普的過去，藉著她的口述補充讓觀眾理解到，她因為「生為女人」、「身

  為女性」而遭受到的不平等對待，以及她為了消除歧見、打破藩籬所付出的努力與戰鬥。

  其中，《瑪琳艾索普：首席女指揮》更以巴爾的摩交響樂團與瑪琳艾索普間曾經的紛爭來

  把電影的重點、也就是整個業界內對女性的歧視、歧見給強調至最強點，讓觀眾更能理解

  到做為先驅者的瑪琳艾索普面臨著的，是怎樣一個巨大可又無形的敵人。



  如瑪琳艾索普所言，自小到大她從未少聽到的，就是每個人都在告訴她「妳不可能」、「

  妳辦不到」。在傳統僵化的男性主義至上時代，因為性別的緣故，不僅少了許多機會，也

  少了許多對話空間，不論多麼有才華與才能，終將因為瑪琳艾索普是女人而不可能、辦不

  到。然而一路走來除了她的永不妥協與永不放棄，貴人的相助、恩師的提拔，逐漸的讓整

  個生態環境有了改變跡象，包括著科羅拉多交響樂團、皇家蘇格蘭國家管弦樂團等紛紛聘

  請她擔任首席指揮、音樂總監，但當她受邀擔任美國25大交響樂團之一的巴爾的摩交響樂

  團歷史上首位首席指揮與音樂總監時，還是遭受到了強烈的反對聲浪，許多成員聯合發出

  聲明要求將瑪琳艾索普剔除，認為應有更好的人選來指揮樂團，可是他們卻無法給出明確

  的人選或者標準，這份聲明看在她的眼裡無疑就是份她早已習慣的性別歧見，所謂的適合

  人選實際上誰都可以，「只要不是女性就好」。


  最後，瑪琳艾索普不懼爭議，單槍匹馬的執直搗黃龍，突襲式的迫使巴爾的摩交響樂團展

  開對話，並且成功的讓對方接受且認同了自己。而在瑪琳艾索普的帶領下，巴爾的摩交響

  樂團取得了更多的成功，她用實力證明了自己、用實力令整個指揮界甘心折服。《瑪琳艾

  索普：首席女指揮》將這段里程碑放入電影中是相當正確的選擇，這不光是瑪琳艾索普的

  指揮歷程，更是種明確扭轉性別刻板與掙脫性別壓制的轉折。我很喜歡《瑪琳艾索普：首

  席女指揮》的地方在於，也許是因為這是部講究真實性的紀錄片，因此它並沒有帶給我絲

  毫矯情的感覺，沒有像近年不少關於女性、女權議題的作品偶有刻意、或是反踩男性來提

  高女性地位與價值的橋段，而是藉著從頭開始的認識來讓觀眾去意識然後自主思考關於女

  性的相關議題。



  聽著瑪琳艾索普的受訪內容，還有外界對於她的評價，再搭配著她幾個人生重要片段之畫

  面，讓瑪琳艾索普的故事既勵志又極具說服力。身為女性又是同性戀，卻依然可以佔有一

  席之地，甚至得到認同與認可，讓即使在走進戲院前完全不認識瑪琳艾索普的觀眾，也不

  由自主的相信她有改變世界的力量與影響力。擠身頂尖指揮家之列後，她並沒有因此停下

  腳步，而是繼續為音樂付出，除了投身教育工作、指導與栽培更多對指揮抱有熱忱的學生

  外，她亦創立了交響兒童計畫，旨在培養貧窮家庭的孩子認識音樂、玩音樂，盼能夠藉著

  音樂改變他們的生活。如同她不想再聽到有人告訴她「妳辦不到」，瑪琳艾索普從來不去

  否定任何人的才能與熱情，她用半輩子替後輩闢出條新路，也冀望能用半輩子將路拓得更

  寬，她是先驅，亦是榜樣，似盞明燈指引更多人前行。


  雖然不懂交響樂，但每次聽到電影中有交響樂，還是會被那氣勢磅礡的樂音給震撼到，《

  瑪琳艾索普：首席女指揮》有數首好聽的曲子，搭配上瑪琳艾索普生動的指揮，一人指揮

  與整個樂團的完美協調，讓人無不屏息的沈醉在樂音之中。看著瑪琳艾索普令人想到電影

  中曾有受訪者提到，「每個樂手都能成為指揮家，但只有少數人能成為優秀的指揮。」，

  瑪琳艾索普便是其中一，有能力、有霸氣，能夠統整、融合整個交響樂團，在她的指揮之

  下，她的樂器就是整個樂團，使人著迷與佩服。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
