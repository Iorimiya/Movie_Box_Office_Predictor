url: https://www.ptt.cc/bbs/movie/M.1678162628.A.569.html
title: '[好雷] 瑪琳艾索普：首席女指揮 The Conductor'
content: '記得幾年前看過荷蘭浪漫傳記片《首席指揮家》De Dirigent (2018)談美國戰間期的史實女指揮先驅 Antonia Brico，下週台灣院線也要上凱特布蘭琪演虛構女指揮家的《塔爾》TÁR
  (2022) ，那這週我就把握最後機會快來看看現役女指揮 Marin Alsop的紀錄片《瑪琳艾索普：首席女指揮》The Conductor (2021)，尤其聽說
  Alsop還出言批評《塔爾》那更令人好奇兩片取向有什麼不同！結果呢，看完這部 Alsop紀錄片後走出影院，整個人如沐春風充滿正能量，真對「古典音樂」這西方古代上流玩意兒再次充滿希望。


  話說我也親炙過幾位指揮家的風采與風範，多少建立了我對指揮家這行的正面敬佩與負面質疑，而本片的 Marin Alsop竟投射了我的各種敬佩卻沒我的質疑！當然可以說這部紀錄片就是她的演出甚至宣傳、只節選她好的一面而拍不到壞的一面，不過我也不想去深究她有沒有另一面反正也與我無關、身為聽眾與觀眾我只在意她與此片的「表演」是否饗宴觀眾感動人心。結果很滿意：Alsop
  不但是大師有領導風範、且沒有架子又超接地氣，「女權」奮鬥當然是本片最搶眼議題、但她會擴張關注到各種邊緣與後輩，她的音樂有其卓越、但音樂對她來說更是擁抱人們打開心窗的。




  本片首先本身就是一部古典音樂饗宴！而且幾乎都是膾炙人口的經典曲目、從莫札特貝多芬布拉姆斯到馬勒、偶有幾首 Alsop與在地社區的跨界音樂嘗試，倒是鮮少常令觀眾感到疏離的「現代音樂」；而許多
  Alsop的人生自況起落挫折與樂人樂思、本片都有精選配樂悄悄切入襯托心境，要很懂又很愛古典樂的團隊方能為。本片絕不讓古典音樂高不可攀，儘管最後仍要切入最玄妙的「音樂之意義」，但開場要以最親切的「音樂廳
  open house 」鼓勵孩子聽音樂，祭出 Alsop最敬仰的人生導師 Bernstein歷史錄影，還請一堆當代小朋友穿插黑白小朋友展開超時空傳承！


  孩子，是本片訪談下的 Alsop起點，也成為她音樂人生的初衷。這初衷表面一點是初識伯恩斯坦丰采後心嚮往之暗暗勵志「我長大也要當個指揮家」，但連身為古典樂人的自己爸媽都打退堂鼓「學音樂很好，但指揮女生恐沒門」，還真的從此一路學音樂的歷程就遭到無數「玻璃天花板」，她如今身在樂壇最為大眾津津樂道的也是「女性出頭天」！本片隨後
  1/3都在談女權奮鬥：學院太僵固她們就出來組團、接觸更多樂種帶來新活水，學校與樂團給她碰釘就正面溝通、大門大路憑實力願景消弭性別，有權位後更要成立女性獎學金、男生有數百年互助網絡女生也能有！




  初衷的表面只是「我要成為指揮家」，但當重重天花板給她一路碰釘後，這初衷必須深化更要普世化：「若有人跟你說他將會是你最好的學生」，面對這種決心熱情「你絕不可對他說不」！當然收了進來有啥成就就看他努力與造化，但千萬別說「你不是這塊料」從熱情開始就殘酷澆熄。當然這種「有教無類」精神她一個大指揮家能做到多少也還真難說，但關鍵還在她自己的童年初衷要推己及人：自己和無數女孩都曾被壓抑過，許多人鎩羽而歸她有幸破浪而出，那如今當然要努力拉拔消除壁壘，希望後代孩子們都不用再受那煎熬！這宣言就算只是表演也演得真正向感人。


  還真的，本片用錄影資料與現場跟拍的教學橋段中，Alsop 有許多資質有高有下的大師班學生、有許多重點栽培的獎學金學生、亦有熱情想學者她空閒線上授課、其中少數如今也是二三線樂團指揮與總監、外面更有廣大社區平民孩子也企盼打開音樂之門探索音樂堂奧...
  這些人資質與成就有高有下，但對本片中的 Alsop志業來說都有其重要，全片她只在說服樂團讓她當總監時提過「卓越」與「完美」這般字眼，在其他場合她強調的都是「多元」與「表達」訴求音樂無壁壘！當然她在「巴爾的摩交響樂團」必然持續引領卓越，但本片更關注巴爾的摩廣大社區多元孩子們。




  話說我也好多醫學同學負笈巴爾的摩，真沒想到他們菁英學府所在城市卻千瘡百孔 XD 對我個人來說本片關注古典孩子與指揮女生已是其次了，音樂能夠走出廳堂進入社區、給予孩子們一個年少
  purpose、進而開他心眼激他心志攜手協力讓社區變好，那更是音樂存在於這世上不可獲缺的真重點！相信這部分背後必有更多組織更龐大人力持續投入，Alsop 能引導樂團投入這塊則投射她「普及音樂」的關注。先談了孩子、再談到女性、續談了社區，本片慢慢隨她歐洲客席之旅談進音樂更深處。在此除繼續秉持伯恩斯坦精神外，古典作曲家靈感來源則以
  Gustav Mahler為主。


  「將童年與土地元素融入古典」馬勒就是第一人！以本片訪談節取的 Alsop樂人樂思，音樂絕非殿堂之上高超繁複的藝術建制，而要回歸土地傾聽人們投射經驗，要演馬勒就要走過馬勒的童年青年所見所聞揣摩那經驗，而每個人從童年開始接觸世界都有呼應你的心底之聲，正如伯恩斯坦教導她的：音樂不止競爭卓越、更是多元表達，對每個人來說都有屬於你的觀點你的詮釋；指揮前輩不應以老派教育「擊潰其心志」砍掉重練後「重塑其風格」、而應傾聽觀察每個人特色引導他探索自我建立他風格！對學生如是對孩子亦如是、因為這也是她從孩提起的一生渴望。




  最終「音樂」是什麼？這是每個音樂家與藝術家的大哉問，Alsop 的答案帶點浪漫與神秘我也記不清，我粗淺印象記得的大概是：「每個人人生都有其迷惘焦慮等過不去的坎，但有了對的音樂點通你心頓時突破盲點海闊天空。」這種點通你心的音樂就是一生的追尋？進而點通人們的音樂就是一生的志業？古典音樂這東西，我個人年輕時得窺其美曾喜愛投入、年長後見識樂界黑暗則漸漸世故、儘管仍喜愛聽古典音樂但總保持了一點懷疑的距離...
  還是今天看了《瑪琳艾索普：首席女指揮》又重拾那正向的感動！就等本週末去看《塔爾》再度失落吧 XD 推薦兩片比較欣賞。



  --'
