url: https://www.ptt.cc/bbs/movie/M.1730122504.A.0D8.html
title: '[新聞] 雷夫范恩斯透露自己在【28年毀滅倒數】'
content: '雷夫范恩斯透露自己在【28年毀滅倒數】中的角色和情節！




  作為【28天毀滅倒數】的續集，【28年毀滅倒數】（28 Days Later，暫譯）預計拍攝三

  部曲，並且由原導演丹尼鮑伊、編劇艾力克斯嘉蘭攜手合作，奧斯卡影帝席尼墨菲也將回

  歸，除了再度飾演吉姆以外並擔任製片。


  雷夫范恩斯則在最近接受《Indiewire》訪問時，透露他在當中的角色是一名好醫生，並

  說：「在這三部電影中，有兩部已經拍了，經歷過28年的恐怖瘟疫，大部分人都被感染，

  變得暴力且狂暴化，只有少數幾個沒被感染的社區。故事圍繞在一名年輕的男孩，想要找

  到醫生幫助他垂死的母親，帶著他的媽媽穿越美麗的英國北部地帶，當然，感染者們藏身

  在森林、山丘之中，但他找到了一名看起來既詭異又奇特的醫生，但事實上內心有股向善

  的力量。」


  【28年毀滅倒數】擁有堅強的明星陣容，除了席尼墨菲與雷夫范恩斯之外，還包含了亞倫

  泰勒強森、茱迪康默、傑克歐康納、艾琳凱莉曼和埃德文雷丁，台灣預計於2025年的6月

  18日搶先全美上映。


  --'
