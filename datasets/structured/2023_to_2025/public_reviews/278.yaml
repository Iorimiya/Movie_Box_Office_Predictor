title: '[好雷] 28年毀滅倒數'
content: '給好雷原因很簡單


  就是整部電影從天線寶寶開始到片尾曲前我都沒有想停下來看時間的想法


  跟前兩部作品比較起來，就差在絕望感沒有碩造出來

  取而代之的是，期待導演會給什麼料的探索感


  本片的第一高潮，阿爾法殭屍發現父子倆並大軍進攻

  史派克老爸carry整場


  再來就是父子倆狩獵完畢

  打算回村莊

  在金門大橋上有說有笑，突然一隻阿爾法大進擊

  狂奔他們走過的路

  在手無寸鐵之下他們回到村莊的大門求救援

  最後阿爾法被火箭KO

  父子倆凱旋歸來，接受大家的祝福


  這裡我真的覺得，他們真的有其中一個會被抓到

  看得超刺激


  再來就是醫生說的勿忘死

  那一些頭顱堆成的小山丘就是他所說的勿忘死

  "這裡每一顆頭裡都有他們所想過得，眼窩有他們看過的，下顎有他們嚐過的"

  以上零碎的電影台詞我記得是這樣

  而這些頭顱則是醫生在紀念每一個曾經的"人"

  堆積這些頭顱也呼應他所強調的勿忘死

  也就是每個生而為人，都有曾經活過得意義，活著的證明


  所以醫生才回要史派克將他母親找一個最好的位置放著


  醫生在最後也像史派克強調"勿忘愛"

  不過電影就沒有多做"勿忘愛"的解釋


  最後，吉米一身華麗又戴著倒十字架救援了史派克

  倒十字架在這裡出現得很突兀


  我是基督徒

  我對倒十字架的解讀通常有兩種意思

  一種是敵基督

  一種是聖彼得十字架的意思


  電影沒有把吉米碩造成其中兩種意義

  如果有，至少不是很明顯


  其實，在片中有村莊的人為正在狩獵的父子倆準備宴席的畫面

  配上詩歌，真的讓我想到在以前的教會

  還是青少年時期，敬拜完青年主日大家去慶祝的感覺

  難免覺得有點觸景傷情，滿滿懷舊感


  看完這部，上來板上看蠻多負雷其實蠻意外的

  雖然沒有大場面

  但這部對我來說還算不錯看


  可以保證的是，一定還會有續集


  --

  願你們平安


  --'
