title: '[普雷] 28年毀滅倒數 沒那麼差 但也沒那麼好....'
content: '導演的功力還在

  丹尼鮑伊依舊是那個丹尼鮑伊

  這部是用cult片獨立片那種角度去拍攝

  這種電影和一般商業電影不同

  講白一點就是文藝片 文青片

  通常背景設定、角色、甚至是劇情本身都可以是一種輔助

  片子真正想傳達的是一種氛圍

  一種態度或說是一種時代精神


  許多人都覺得這片設定瞎、角色低能、劇情不通

  但這完全不是重點

  就跟首集28天毀滅倒數一樣

  那些都是配角

  導演只是藉著這個設定或情境去拍出他想拍的氣氛而已

  而我覺得丹尼鮑伊在編導設計與氣氛營造上做得很棒


  比較可惜的是

  28年與28天最大的差異點就是背景設定和劇情不夠純粹、也不夠極簡

  事實上大家回想一下28天毀滅倒數全片

  設定、角色、劇情都可以說是精簡到不行

  就像是幾句話就能說完一樣

  導演把場景快速的架起來

  演員就直接上場表演流水帳公路電影

  而全片的精華也就在這裡

  但也是因為其它要素足夠極簡

  觀眾和導演也能放大要表達的重點

  也就是一群平凡人在僵屍末日下

  有時緊張刺激 有時平凡無趣 有時備感煎熬的流水帳


  28年看得出也想複製28天的套路

  一樣是cult片或獨立片的基調

  要拍一段流水帳公路電影

  運用導演手法或剪輯配樂去營造氛圍

  這方面水準依舊

  只是背景設定、角色設定還有劇情有點太多了

  不夠純粹也就算了

  處理得不好又影響了觀眾的注意力

  讓精心打造的氣氛被低能腦殘的設定與劇情抹滅

  除非觀眾有能力後設式的將兩種元素分開

  不然不容易看到這部電影的精華


  總體來說

  我認為毀譽參半

  有好有壞

  希望如果還有下集

  編導們就別想太多

  那些莫名奇妙的設定與劇情能砍則砍

  回歸到28天那種最純粹的樣貌

  就是專心描寫一幫人涉入僵屍末世的流水帳

  你甚至連什麼只有英國被隔離這種設定都可以省了

  只會讓觀眾分心


  你不是進擊的巨人

  人家有幾十年可以慢慢劇情鋪陳

  你只有2小時

  快速讓電影進入重點

  才是正途


  --'
