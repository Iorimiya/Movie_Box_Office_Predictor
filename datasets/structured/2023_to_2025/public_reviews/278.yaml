url: https://www.ptt.cc/bbs/movie/M.1750273075.A.3C1.html
title: '[[極負雷]] 28年毀滅倒數 還我300塊'
content: '評價: 爛到笑，花300塊不知道看了三小，片名應該改名叫進擊的巨鳥。


  被預告片長得像Cillian Murphy的喪屍騙來看，完全不敢相信這是由「28天」相同的導演及

  編劇生出來的作品，本來期望值也沒有很高，你他媽不要比28週差就好了，結果看完像花快

  兩個小時吃了坨屎一樣難受……


  部分片段剪輯混亂，有種想縮短片長亂剪的感覺；配樂我也欣賞不來，不需要有音樂的段落

  硬要塞進去只變得很吵很躁。


  為了這部我還特地去複習28天+28週，結果前面的設定卻毫無理由的被推翻，本來五週不咬

  人就餓死的感染者改吃動物跟蚯蚓，還莫名其妙進化成三種分支：

  1.速度慢只能爬行蠕動的泡水肥屍

  2.速度快能跑的瘦排骨屍

  3.高大威猛興趣是做椎骨劍+長得像水行俠Jason Momoa+跑起來30公分亂甩的Alpha zom

  bie



  其他部分像一個人在外打野三十年不死的醫生、生出正常嬰兒的女喪屍、結尾出現像B級片

  才有的打鬥場面等等就懶得講了。


  喔對，不知道該算男主角還是男配角的Aaron Taylor Johnson感覺總是接一些爛片，之前的

  獵人克萊文也是爛到不行。


  總而言之沒必要浪費錢去電影院看，完全搞不懂片商是怎麼想的，既無

  深度也無爽度，完全把觀眾當白癡的一部雷片，除了片名、封鎖英國跟轉場畫面硬要放28 y

  ears later, 28 days later這三點之外，跟前作兩集可以說毫無聯繫，把這部當作是一部

  新的喪屍電影來看感受可能會好一些。


  --'
