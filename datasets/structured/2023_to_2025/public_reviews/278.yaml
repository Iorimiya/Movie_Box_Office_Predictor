url: https://www.ptt.cc/bbs/movie/M.1750266331.A.6D2.html
title: '[極負雷] 28年毀滅倒數：毀滅性的觀影體驗'
content: '滿懷期待引頸期盼的衝到電影院看下午場


  發現電影院都沒有相關海報在宣傳之類的


  開演的時候也只有寥寥無幾的觀眾入場


  原來這是一個sign啊......


  以下開始長篇抱怨（氣到回家馬上打一篇）


  —————————


  電影一開始就是災變日時一群小孩在看天線寶寶


  把那種暴風雨前的寧靜氛圍營造得很好


  後來一堆狂屍衝進來了，但感覺沒有第二集那麼狂？


  總之不知道為什麼一個明明跑不快，也沒有任何武器防衛的小孩（Jimmy)


  可以閃現鬼步躲掉一堆狂屍去教堂找他瘋掉的爸爸，第二集的殭屍跑起來的速度有看的人

  應該都知道，那真的是要死命的跑才跑得過


  總之這集的狂屍戰力差很多，沒有那麼有壓迫感


  後來就28年後了。


  一開始成年禮要出去狩獵這段都還正常


  但到了小孩成年禮回來後看到爸爸外遇


  劇情就開始鬼轉了，我從這裡WTF到電影結束


  屁孩為了帶媽媽去給本島上的蒙古大夫看病


  不惜亂縱火把顧門的守衛引走，然後帶著老媽上本島送死？（也的確是送死。）


  不是欸，明明成年禮自認表現很爛箭無實發的屁孩，怎麼突然被灌滿了勇氣可以獨自帶上

  路都走不好的精神不穩定的老媽上本島？


  動機哪裡來？勇氣哪裡來？決心哪裡來？老實說我看不到，而且守哨還可以守到差點被爬

  行屍咬，被媽媽突然一個神力爆發拯救？？？


  以為媽媽有什麼特殊能力，結果也沒…有？喔…可能就是會幫狂屍孕婦順利接生小孩吧？

  ？幹這裡真的我受不了直接在電影院WTF超大聲（反正沒啥人）


  愛滋病都會直染胎兒了，這種病毒靠一滴血滴到眼睛和接吻都能瞬間感染的超強傳染力居

  然沒有感染給嬰兒？？（就也先不論殭屍怎麼懷孕這件事有多荒謬了）


  （中途那群法國士兵也不知道是三小打完才發現漏了但其實也沒啥好說的就是另一個專程

  來領便當的暴躁低情商屁孩）


  然後逃出火車這裡我也覺得很躁，明明阿爾法跑這麼快戰力這麼強又有智慧的傢伙，居然

  追不上一個屁孩和一位帶著嬰兒的婦女？居然會被屁孩射的弱箭給射到僵直不動？


  以為這個阿爾法可能是對嬰兒有感情所以不會濫殺無辜，但後來也沒交代直接給我睡著^_

  ^（還兩次）


  怪醫真的很怪，到底憑什麼可以活著？完全摸不著他有什麼可以讓自己活13年的求生技能

  ？可以像陰屍路那樣靠屍臭味屏蔽自己嗎？那為什麼後來阿爾法可以無視結界直接衝進來

  ？？


  屁孩看著自己老媽沒得救很絕望，後來也沒有溝通什麼的，結果老媽在抱抱的時候一個眼

  神示意怪醫把屁孩迷昏？？奇怪你們是有串通好什麼嗎？我以為屁孩要被殺掉了（可能這

  樣還比較好看）


  後來老媽被怪醫安樂死變成一具頭骨，屁孩也沒有一絲一毫仇恨醫生的情緒，好吧可能也

  神智不清了吧。最後Jimmy跟著一群跑酷重金屬小丑出現揭示有續集也不知道是三小了我

  也根本不想知道了一定難看的要死


  幹總之我吐的血比電影裡面吐的還要多


  電影錢省起來去吃點好料的吧


  以上勸世抱怨文


  --'
