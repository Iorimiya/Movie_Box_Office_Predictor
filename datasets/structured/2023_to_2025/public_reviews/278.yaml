title: '[普雷] 28年毀滅倒數：意義不明不重要'
content: '如果你覺得這部片預告做很好，沒透露什麼，那是因為

  真的沒啥好透露的，整部片不知道是在拍什麼，特地找來

  原初編導雙人組來，結果成品居然是這樣


  劇情簡介大概就是亞倫泰勒強森帶著孩子去殭屍地訓練

  然後媽媽生病了，大致上就是這樣，什麼病不清楚


  接下來要爆雷了


  原來爸爸帶孩子去殭屍地冒險只是為了炫耀自己帶威猛

  順利把妹休感，孩子的爺爺意外提及殭屍地有醫生，孩子決定帶媽媽回去找醫生

  找到醫生發現媽媽得癌症沒救了，孩子決定獨自踏上自己的新旅程


  甚麼？你問殭屍有沒有新品種？有的，但不重要

  中途有帥哥救母子兩人，不重要，瞬間就掛了

  殭屍的小孩是正常的呢！不重要

  醫生有沒有特殊本領？有，不過也不重要

  要不要和孩子回自己的村莊，沒有，也不重要

  海報上那個堆滿骷髏的酷酷石碑是啥？不重要

  整體來說，這部片就是一部什麼都不重要的片

  貌似要推出續集，感覺也不是很重要了


  --'
