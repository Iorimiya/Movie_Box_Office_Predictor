title: 'Re: [討論] 28年毀滅倒數 爛番茄95%'
content: '這個問題當然還是要番茄王來回答

  點進去看影評幾乎都在吹28年的藝術價值

  像是鏡頭運用，小男孩成長等等

  不過爛番茄影評通常是不能暴雷的

  所以猶豫要不要看還不如來ptt看雷文

  另外作為藝術和商業的取捨

  個人覺得28天既然都做成爽片風格了

  28年這樣鬼轉當然很多人不能接受

  比較中肯的可以去看Jeremy Jahns的影評

  像是子彈時間在2002年算是新鮮的玩意兒

  但是今天已經被用很多次不新鮮了


  另外想看小男孩的成長，可以去看馬德發克主演的「總統遊戲」

  看版上風向就知道被罵到翻掉

  不過喜歡的也不少，那個小男孩是真的很帶種阿，居然單挑整個恐怖份子集團，雖然

  是一群弱智


  --

  這篇很用力?哪裡可以說明嗎?

  要不要臉啊?水桶那篇推文就是你寫的，還問'
