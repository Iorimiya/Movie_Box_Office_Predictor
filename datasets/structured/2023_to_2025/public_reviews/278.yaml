url: https://www.ptt.cc/bbs/movie/M.1750520286.A.D53.html
title: '[超負雷] 28年毀滅倒數 好難看啊'
content: '亂七八糟的亂演一通  這劇本到底誰寫的

  前一秒 還是連射箭都射不準 膽小懦弱的小屁孩

  下一秒 竟然拉著病懨懨的母親 深入險地 最後還真的送她進焚化爐

  媽的 這人設直接前後不一啊 靠


  她媽居然還可以單殺喪屍 本來想說是不是隱藏人物 有特殊技能

  後面會揭曉 結果沒有 真的沒有 還得癌症勒


  醫生第一次當場麻醉BOSS 我就問 為什麼不殺了它呢 為什麼 為什麼

  斷它雙腿也好啊 讓它不再是威脅也可以啊


  然後發現母親得癌症 為甚要直接火化呢 讓她留在醫生身邊也好啊

  醫生有嗎啡 麻醉藥 都可以減緩她的症狀 讓她不要那麼痛苦啊

  有些癌症控制得好的話 可以多活好幾年勒 多的是案例

  照顧一段時間後 真的不行 再送她一程也可以啊 太不合理了啦


  這屁孩就是專門害人 年輕帥哥士兵死的好慘 根本就是亂死

  還有那個嬰兒 憑什麼沒被感染 一滴血沾到眼睛就變了 憑什麼它沒變

  屁孩還把他送回營地 是怎樣 下一集準備把整個營地給端掉是吧

  最後那個 跑酷一族 我看下一集也是一定會被這屁孩害到全軍覆沒


  這集好爛啊 那種讓我想 忽視劇情合理性 跳過都跳不過的那種爛 媽的

  好久沒發文了 我看完就只想回家發文幹譙它 我喜歡看 B級片

  越荒謬越好笑 我看的越樂 但是這系列是有名聲的院線片 這麼搞啊

  我全程邊看邊幹譙 這到底在演殺小啦 公司都沒在審劇本的嗎


  --'
