url: https://www.ptt.cc/bbs/movie/M.1750332671.A.A83.html
title: '[好雷] 28年毀滅倒數'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n《28天毀滅倒數》是Danny\
  \ Boyle 2002年的作品，\n《28年毀滅倒數》則是他23年後 2025年的作品。\n\n28天當時描寫的是當社會受到病毒秩序瓦解後，人性將變得如何，殘酷、現實、落肉強食外，此時重視倫理、法律與尊重彼此與家庭價值觀在「當下」如何應對。\n\
  \n28年描寫的卻是社會面對極端壓力下，即便已重新建立秩序，但本質與基礎仍建立在暴力之上，而且相當脆弱，人在此時會如何應對。\n\nBoyle導演的觀點是：英國境內受病毒影響下，透過職業階級、與社會秩序，去規範社會的每一份子該做什麼事，讓整個國家正常運作，像是14歲就需要到本島證明自己將來的身份地位，不過男孩的母親就認為他12歲這年齡該去學校讀書，不該提前面對社會（送死）也不該放棄學業。但在末日下的英國，讀書又有什麼意義？可是英國以外的地方又很正常在運作下，那你為何要放棄學業？\n\
  \n從電影裡都不難看出 Boyle把整個英國社會縮小到這座島嶼內，也看到英國境外的國家如何看待受病毒衝擊後的國際現實有多麽殘酷，隔離政策，去了英國就在英國自我隔離，到何時？沒有答案。\n\
  \n島嶼四面環海且聯通方式只有一條受到潮汐影響的道路，這樣的地理特殊性讓主角所處的聚落能夠封閉起來抵抗喪屍。而封鎖線的船支也表達英國跟歐洲的關聯：說密切很密切說斷馬上可以斷）\n\
  \n28天毀滅倒數從主角剛從醫院醒來那一刻就有很多的英倫文化入侵，包括英國家庭（爸媽怎麼愛Jim)，待客之道(Dad問女兒有沒有酒要敬一下這值得慶祝的一天；其實都有很多的英國文化藏在這喪屍片當中。\n\
  \n28年則是把現代人認為「該有的文明」、「人類應有的良善」藏在這喪屍片當中，也會看到這些英倫文化有的存在、有的已經被崩解，當這些價值崩盤後，社會又逐漸重新建立起來了，你會怎麼做？是要遵循原有的價值觀，還是適者生存，活下去才最重要？Boyle把每個角色甚至小鎮社會，描寫他們有著各自不同的應對之道。\n\
  \n一、Jamie\n男孩的爸爸Jamie就是做到自己傳統英國父親角色。保衛家園、教導孩子，把最好的留給兒子，但酒酣耳熱又歷經瀕死情感澎湃下他一夜情卻被兒子撞見，堅守傳統家庭價值觀的父親卻遭受新一代挑戰。\n\
  \n二、小鎮\n派對牆上還掛著伊麗莎白二世的官方肖像玉照。但這樣的末日下皇室還在嗎？這玉照還有什麼意義？\n難怪小男孩會說：都是假的。\n\n三、Kelson醫師\n\
  維持應有價值觀該怎麼運作就怎麼運作，但卻被小鎮認為行為舉止怪異，可實際上他在整個本島被摧毀下，也就只是做我們這社會該做的事：尊重死者，一一安葬。在價值觀崩裂下就只是認為他行為跟大家「不一樣」而敬而遠之。\n\
  \n究竟他會不會看病？其實跟很多醫生一樣，基本診斷絕對沒問題，但很多疾病都需要儀器來去做更精準的診療，沒有儀器下只能保守地說沒有辦法，對末日下的人來說不能醫治，當然是覺得你是個江湖術士蒙古大夫。而一切未知的情況下，對於保護家庭為己任的Jamie當然很不讓孩子帶媽媽去看診，風險太高，但又要孩子怎麼理解。\n\
  \n四、Isla\n當面對喪屍生孩子時，你會因為他是喪屍就認為他生的孩子該死，還是認為這孩子是無辜的，應該也要受到作為常人的對待？\n\nIsla過程當中甚至也展現出為母則強的本性讓孩子沒被殺死，但也裝傻不去戳破孩子\
  \ 和Jamie一樣都是努力建立孩子的信心\n（所以當版上說怎麼變成百發百中，其實從村內集訓就能看到他們射箭都是從小努力的，而能不能增加命中率，這都是他父母倆努力為孩子建立的信心啊。）\n\
  \n五、瑞典士兵\n瑞典士兵則是我救你當然直覺是出自於人性的善良，如果無法互助 就會覺得我為什麼要讓自己陷入資源不足的困境，可以看到還是基於善良去幫忙背母親去找醫生，但要再帶一個可能有感染的小孩？為什麼要這麼做？你又怎麼看的出來？一直不斷挑戰那些沒有對與錯、純粹價值觀的問題。\n\
  \n六、Jimmy\n「上帝你為什麼要遺棄我。」\n目睹叫他離開的母親被吃、作為牧師的父親卻跟他說這是上帝給的喜悅，在這樣基督教價值崩解下成為影片最後的金剛戰士，也就是亂世當中，我幹嘛要這麼循規蹈矩？活下來就是真本事（坦白說那種運動服其實也很英國人啦，全套運動服就很hooligans）甚至當中也埋下伏筆：他們很可能就是在末日那種沒有政府下還有江湖規矩的黑道，把一些人抓去送給殭屍吃，並且招募那些被這社會、或者想離開這社會框架的人。\n\
  \n\n整部片都是建立社會價值觀受重大事件入侵導致國家社會崩解下，在這若有似無的社會結構下，英國人究竟是要當作沒看到騙自己的去遵從舊有社會價值，還是部分修正去適應，還是全盤重新建立新秩序？\n\
  \n我能理解版上負雷的原因：我來看喪屍片，你卻整部電影想跟我說英國社會、文化、家庭、母愛...對死亡的敬畏尊重與安樂死？但是整部片其實從頭到尾都是很一慣地，挑戰既有價值觀、挑戰英國、挑戰人性的善良抑或偽善，我覺得是一部很好看也沒有冷場的片！\n\
  \n也許一些暗喻隱喻，讓不大熟悉英國文化的朋友感覺這在演什麼，但我自己從開頭在叢林當中訓練兒子怎麼了解叢林逃回村莊這段，我認為都很讓人屏息緊張，當中再穿插一些導演的幽默，我個人是還蠻喜歡這部用殭屍為名包裝現代國際社會價值觀正在崩裂的電影作品。\n\
  \n\n--\n 「旅程跟終點哪一個比較重要？不是旅程，也不是終點，是最美妙的夥伴。\n   各位我很感激有你們，你們有很特別的東西，這東西一定要是我們的核心，\n\
  \   我不知道要怎麼做，但你們身為一個團體，你們有能力傳遞能量，\n   一上場就鼓舞球迷吧。只要有熱情決心，讓大家看你們有多在乎，\n   再傳遞、再上前、再進攻，帶著勇氣和信念踢球，然後他媽的贏球。」\n\
  \                        \n\n--\n修正錯別字"
