url: https://www.ptt.cc/bbs/movie/M.1756957900.A.8A2.html
title: '[普雷] 28年毀滅倒數'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  雖然前幾年室友有帶看看過28天和28週，不過都不太記得了，所以基本上是把《28年毀滅

  倒數》當作一部全新電影看。


  看的過程可以說還是滿享受的，算是有從前看喪屍電影感覺—與現實有點關連又不太關連

  ，偶有特別的幽默在其中。


  看完之後，想了一晚上，對於畫面和劇情似乎不是很能滿足。畫面上不知道是否因為用太

  小的銀幕看，總覺得有點假假的，室友說是只有火假，但看的時候感覺畫面本身就有一種

  動畫感，不確定是否自己的問題。在網上查了之後，似乎都說是因為大量以iphone拍攝，

  銳利的色調與對比、超寬視角呈現，使部分人感覺像是動畫（但以正面評價為主）。


  劇情方面，看完查了才知道是艾力克斯·嘉蘭編劇，其實有點意外。他之前自編自導的《

  人造意識》《滅絕》、《們》、《帝國浩劫：美國內戰》，都滿喜歡。這部竟然讓我感覺

  落差如此大，也是有些意外。不過若是後續兩部（聽說這是三部曲？）也都是他編劇的話

  ，我可能還是會看。只是就是先降低一些期待。


  至於導演丹尼·鮑伊，我覺得聲音方面的運用還是很讚的。




  ***


  這裡是我的樂園:




  --'
