title: '[新聞]《28年毀滅倒數》續作首波評價爆高！近十'
content: '《28年毀滅倒數》續作《人骨聖殿》首波評價爆高！近十年最棒的恐怖片之一


  《28天毀滅倒數》（28 Days Later）系列的第四部曲《28天毀滅


  倒數：人骨聖殿》（28 Years Later：The Bone Temple）將在


  下個月16日台美同步上映，國外則提前超過一個月，於本週二舉


  行了媒體試映會。就目前觀看後的各家媒體和影評人的反應來看，


  第五集獲得的評價極高，不輸第三集，而媒體的熱烈反應，


  也讓索尼影業旋即樂得提早宣布第五集正式投入籌備。


  「《28年毀滅倒數：人骨聖殿》再次證明讓只要妮亞達蔻絲塔（導演）掌舵，


  就能做出傑作。有很多精彩之處，雷夫范恩斯尤其因為一段


  特別瘋狂的表演而榮登本集MVP，博得滿堂喝采。快去戲院支持！」


  「請原諒我粗俗的用語，但我剛看完《28年毀滅倒數：人聖殿》


  的第一場試映，而這部電影簡直太他媽的屌炸天了！


  將一切都推向了極致，而且我警告你，你需要非常強大的胃（或者非常大袋的嘔吐袋）才

  能進場。另外，雷夫范恩斯的表演真是叫人贊骨。




  「《28年毀滅倒數：人骨聖殿》有時無情，有時深刻，有時，也是《28年毀滅倒數》殘酷

  到絕妙至極的續章。傑克歐康諾和雷夫范恩斯的演出完美，還有奇路易斯帕瑞也非常優秀

  。」



  「《28年毀滅倒數：人骨聖殿》採取了大膽的創作試驗，而大多數的試驗都成功了。我估

  計它會引發粉絲的爭議，但它比第一部更辛辣，也不意外地更好笑，傑克歐康諾和雷夫范

  恩斯的表演則讓人著迷。」



  「《人骨聖殿》比《28年毀滅倒數》更勝一籌，這真的不是講講的。全片出乎意料，令人

  不安，理直氣壯地橫衝直闖。我一直覺得大銀幕上的活屍故事已經沒有新意了，但係列卻

  重振了新活力。請繼續拍下這些電影。」



  「《28年毀滅倒數：人聖殿》是《28年毀滅倒數》殘酷到絕膽大的續集，它極大淡化了對

  感染者的，轉而探討邪教、創傷、精神病和同情心。我非常欣賞它描述的毫不悔改、獨樹

  一格的野心。它輕而易舉就拍得比《28毀滅倒數》爭議性。」



  「我敢拍胸保證……《28年毀滅倒數：人骨聖殿》是近十年來最優秀的恐怖片之一，它超

  酷、緊張刺激，且出乎意料地溫情。雷夫范恩斯、傑克歐康諾和奇路易斯帕瑞，請接受我

  們最高的敬意。」



  「如果隔離本身，就像病毒在感染者的血管中流竄傳播一樣，是具有綜述性的呢？達蔻絲

  塔面對這個世界觀的內向銳氣，之前與丹尼·鮑伊（第一、第三集導演）為她鋪墊的基礎

  ，形成瞭如此反差的對比。很難想像還有比這更好的新年新希望開局之作。」」



  「《28年毀滅倒數：人骨聖殿》亂得美麗，令人屏息，完全符合我的預想。妮亞達·蔻絲

  塔以絕妙勾人的手法，將她獨特的風格溶解意這世界觀拍賣，而傑克·歐康諾和雷夫范恩

  斯的表演也讓我看再久都猶未盡作。本系列電影又一傑作。


  本集改換《驚奇隊長2》（The Marvels）導演-妮亞達蔻絲塔（Nia DaCosta）接手執導，

  並仍由一、三集的編劇-艾力克斯嘉蘭（Alex Garland）編寫劇本。 O''Connell）等上集

  的核心要角之外，有在上集片尾前置客串的艾瑪蕾爾德（Emma Laird）、艾琳凱莉曼（

  Erin


  Kellyman）也正式升格重要配角，首集男主角-席墨尼菲（Cillian Murphy）也確定有簡

  短的串場戲份，先來替第五集鋪路。





  --'
