url: https://www.ptt.cc/bbs/movie/M.1765466834.A.C21.html
title: '[新聞] 《28年毀滅倒數》續作爆好評 第三部正式推動'
content: "《28年毀滅倒數》續作爆好評 第三部正式推動\n\n2025/12/11 13:49\n\n〔記者許世穎／綜合報導〕恐怖驚悚神作《28天毀滅倒數》今年剛以《28年毀滅倒數》強\n\
  勢回歸，續集《28年毀滅倒數：人骨聖殿》明年1月接力上映，近日試片後爆出絕佳好評\n，外媒《Deadline》今（11）日也報導，索尼影業已正式推動「《28年毀滅倒數》三部曲\n\
  」的第三部計畫。\n\n\n雷夫范恩斯在《28年毀滅倒數：人骨聖殿》的演出，被形容「宛如惡魔附身」。\n（索尼影業提供）\n\n外界盛傳，主演《28天毀滅倒數》的影帝席尼墨菲將在新片《28年毀滅倒數：人骨聖殿》\n\
  中再度回歸，且正洽談出演全新的第三部；系列御用金獎提名編劇艾力克斯嘉蘭也已投入\n撰寫劇本。而席尼墨菲也同時擔任《28年毀滅倒數》以及《28年毀滅倒數：人骨聖殿》的\n\
  監製。\n\n當初索尼取得《28年毀滅倒數》版權時，雖擁有拍攝第三部的選項，但起初並未立即拍板\n，而是選擇讓開創該系列的金獎導演丹尼鮑伊回歸執導第一部、《糖果人》導演妮亞達科\n\
  斯塔接手第二部，兩部電影並以背靠背方式連拍。鮑伊先前也曾在受訪時表示，他有興趣\n執導第三部電影，外界也樂觀其成。\n\n\n傑克歐康納（前）在《28年毀滅倒數：人骨聖殿》，將展現徹底瘋魔的演出。\n\
  （索尼影業提供）\n\n而即將上映的《28年毀滅倒數：人骨聖殿》最近舉行試映獲得爆棚好評，影評大讚該片以\n複雜的語氣編織，成為描繪失控權力、殘酷又夢魘般世界的完美畫布，在上集結尾現身的\n\
  傑克歐康納展現「徹底瘋魔」的演出，還有雷夫范恩斯飾演的凱森醫生也被大讚：「吞噬\n每一個音樂段落，宛如惡魔附身。」\n\n\n《28天毀滅倒數》男主角席尼莫菲有望回歸演出《28年毀滅倒數》的第三部。\n\
  （翻攝自IMDB）\n\n目前《28年毀滅倒數》第三部尚未定名，索尼影業也未回應相關消息。《28年毀滅倒數：\n人骨聖殿》將於2026年1月16日在台上映。\n\
  \n《28年毀滅倒數：人骨聖殿》最新預告：\n\n\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\
  \n\n--"
