url: https://www.ptt.cc/bbs/movie/M.1753445071.A.0AA.html
title: '[好雷] 28年毀滅倒數(28 Years Later)'
content: "《28年毀滅倒數》是毀滅倒數系列的最新電影，找回了首集《28天毀滅倒數(28 Days\nLater)》的創作團隊，由Alex Garland編劇、Danny\
  \ Boyle執導，也是規劃新三部曲的首\n部作品。這種多年後找回原創團隊製作的續集，通常會嘗試回歸初衷，希望以情懷吸引老\n觀眾進場。然而這一次，導演與編劇明顯有不同的想法。\n\
  \n\n與其說是系列續作，本片更像是借用了前作的世界觀來講述一個完全不同的故事。不管是\n在故事內容還是電影風格方面，《28年毀滅倒數》都和前作大相逕庭，我甚至覺得其實根\n\
  本沒必要套用系列作品的名稱，這麼做反而可能讓抱著想看殭屍末日生存片進場的人因與\n期待不同而感到失望。但話說回來，綜觀Danny Boyle的創作軌跡，他也確實不是喜歡一\n\
  直創作相同類型作品的導演，因此有這樣的選擇或許也不讓人意外。\n\n\n然而撇開與系列前作幾乎完全無關這點，如果只看《28年毀滅倒數》本身，其實是相當不\n錯的劇情片。如果要以幾句話不暴雷推薦的話，《28年毀滅倒數》是個關於自身成長與家\n\
  庭關係的故事。片中也有驚險的殭屍追逐橋段，但電影更專注於刻劃角色的成長弧線與描\n繪人與人之間的感情，導演獨特的配樂選擇與剪輯風格也給了本片不同於一半大眾商業電\n\
  影的質感。\n\n\n以下內容會有大量劇情討論，請自行斟酌閱讀。\n\n\n==============================我是防雷線===============================\n\
  \n\n\n\n\n\n\n\n\n\n==============================我是防雷線===============================\n\
  \n\n電影一開頭就以字幕說明先前的喪屍疫情已被控制在英國本土，英格蘭島成了被禁止前往\n的土地，世界的其他地方則一切正常，本片的故事就發生於英國的一個離島上。這天是男\n\
  孩Spike的成年禮，他將在父親的陪伴下前往英國本土獵殺他的第一個感染者。距離疫情\n爆發已經多年過去，離島上的居民已經發展出了一套自給自足的生活方式。本島上的感染\n\
  者不再是立即的威脅，反而成了成年男孩證明自己的象徵。強大的父親一直是Spike景仰\n的目標，為了和父親一起登上本土的這天，他已期待了許久。\n\n\n然而事情卻不如想像中的順利。雖然登島後，Spike順利以弓箭射死了一個行動緩慢的感\n\
  染者完成任務，回程途中卻遭遇了強大的殭屍Alpha以及大群感染者。慌亂之中，Spike試\n著跟隨父親的指示幫忙以弓箭射擊感染者，但因為緊張與經驗不足，射出的箭無一能有效\n\
  射中敵人。且戰且走一陣後，Spike與父親被困於林中小屋，直到夜幕降臨才乘著夜色驚\n險逃回離島。\n\n\n此時的Spike覺得自己沒用極了，雖說確實完成了出發時的任務，但面臨真正的危機時，\n\
  自己卻一點都派不上用場。然而父親在慶祝晚會上卻大加渲染他們的遭遇，將Spike說成\n了英勇無比的「巨人殺手」。酒酣耳熱之際，Spike更是發現父親拋下了臥病在床的母親\n\
  ，有了出軌的對象。至此，父親的形象在Spike的心中已然幻滅，曾經認為的英雄，如今\n看起來只是個滿口謊言的騙子。\n\n\n失望之餘，Spike聽說了本島上住著一位神秘的隱士，據說在疫情爆發前是個醫生，便決\n\
  心自己帶著重病的母親冒險前去尋訪這位醫生。然而幾經波折找到醫生後，卻得知了母親\n罹患的很可能是癌症，且腫瘤已影響到腦部，在這沒有現代醫療的末世之中，等於是宣判\n\
  了死刑。繼精神上失去了一直當作目標的父親之後，Spike也將很快失去母親，必須靠著\n自己繼續向前。\n\n\n《28年毀滅倒數》刻劃的是家庭關係與成長之間的矛盾。父母總是愛著孩子，孩子也總是\n\
  望向父母。然而，父母終究無法永遠回應孩子的期待，終有一天，孩子必須離開父母的引\n導並走出自己的路。\n\n\n劇情之外，本片也有著細膩的質感。視覺呈現上，Anthony\
  \ Dod Mantle的鏡頭語言加入了\n許多現代的技術，卻又刻意維持略帶粗糙的畫質。導演Danny Boyle的音樂選擇一如繼往\n地有強烈的個人風格，搭配非傳統的剪輯手法，我認為把每一個段落的情緒都傳達得非常\n\
  好。另外值得一提的是，某個在片尾才正式登場的角色，其實整部片都充滿了鋪陳的伏筆\n，也讓他的正式登場充滿了震撼力。\n\n\n如果不介意看一部與系列前作無關的劇情片的話，《28年毀滅倒數》仍是一部值得一看的\n\
  好電影。\n\n\n個人評分: 4/5\n\n\n--\n\n\nFB粉專: Eugene的電影筆記 \n\n\n\n--"
