title: '[負雷] 28年毀滅倒數：我到底看了什麼？'
content: '看完心得跟J大心得一樣

  所以借用他的標題

  "我看了甚麼"



  1

  男主角很可愛<3



  但是個屁孩


  2

  男主角媽媽是癌症患者感染到大腦

  精神有時候會失常


  3

  路上組隊到的軍人

  搞笑擔當

  從他出現到領便當都很好笑


  4

  最後片尾吉米出現

  像日本特攝片

  金剛戰士出來穿著各種不同顏色套服

  拿不同武器打怪獸

  還有合體技


  (沒在唬爛 電影就這樣演)


  只差沒喊

  我們是金剛戰士！



  5

  感染者有30cm晃來晃去

  晃到我都頭暈

  (應該看3D)?!



  6

  阿爾法叫感染者去追主角

  那幕超級有獸之巨人操控純潔巨人既視感

  電影可以直接無痛改成進擊的巨人也沒差



  7

  男主角帶著媽媽到本島過夜

  說要守夜結果一下子就睡著

  差點被感染者咬到

  媽媽爆發母愛擊殺感染者

  事後媽媽也不記得發生甚麼事(她就精神異常)



  8

  媽媽幫孕婦感染者接生

  這邊不知道要怎麼吐嘲

  也是這邊害那搞笑擔當軍人領便當



  9

  有時候拍得很像文藝 文青片

  幻覺與想像現實之間交替

  我要看恐怖片!



  10

  不要把這當成28天毀滅倒數系列來看

  會很後悔

  當成獨立系列CULT來看應該還可以

  看了很躁



  11

  片尾就

  導演：(我就想拍搞笑片)

  看來男主角還可以演下一集




  結論

  我看了甚麼

  負雷不推





  補充：

  那個吉米演員

  居然是傑克歐康納

  演過 罪人 雷米克

  伊甸湖/獵人遊戲 布瑞特






  --

  你形容得很好

  自帶笑點'
