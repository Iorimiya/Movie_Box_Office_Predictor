url: https://www.ptt.cc/bbs/movie/M.1750227861.A.EA7.html
title: '[負雷] 28年毀滅倒數'
content: '先寫個結論

  風格與前兩部都不同

  敘事上不算明快，邏輯也不通順

  故作高深賣弄學識其實空洞無比

  既無深度也無爽度








  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  片頭是一小段沒什麽意義的喪屍爆發片段

  一個小男孩JIM是牧師兒子

  家中還有一群小孩聚集一起看天線寶寶

  然後喪屍爆發全滅只有JIM逃出


  28年後劇情簡介歐洲成功封鎖病毒

  只有將英國隔離(28周的姊弟沒能成功毀滅世界)

  但還有少數倖存者留存在英國

  其中一座離島是男主史派克所在的村莊

  年滿12歲的男主將要被父親帶出離島到英國本島探索

  同時男主的母親臥病在床，偶爾病情發作時會神智不清

  父親表面慈和但男主並不放心讓父親照顧母親


  出島探索應該是類似成人禮的儀式

  男主父子倆人帶著弓箭像是傳統獵人一般

  一一學習各種喪屍、動物種類及追跡、觀察的要點

  除了血腥了一點，其實蠻像在看動物星球或discovery

  有點太過於繁瑣細碎其實對後面劇情沒有太大影響

  總之就是有胖但是緩慢爬行的雜魚喪屍

  像前兩集動作偏快但已經變皮包骨的一般喪屍

  以及進化至領袖地位稍有一點智慧並且特別強壯的阿爾法喪屍


  電影一直到第一次探索結束中

  利用男主父的偶有一兩次的情緒失控反差、男主母的精神不穩

  路上遇到的危機、血腥的慘況以及衝突感較重的配樂

  稍微塑造出一些對觀眾的精神壓迫


  於回歸後父親大肆替男主吹噓不存在的戰績

  男主又意外發現父親出軌

  以及聽聞其實還有醫生存活在島外的事實(島內無醫生)

  決定帶著母親離開島上外出尋醫


  但男主根本靠不住

  靠著母親保護及偶遇的瑞典部隊倖存士兵救場又走了一段

  突然母親聽到喪屍嚎叫尋聲而去

  發現一個懷孕將臨盆的女喪屍，母親為其接生

  瑞典士兵擊斃喪屍後要求拋下生出的女嬰

  母子兩人不同意，認為女嬰沒有被感染的特徵

  爭執間女嬰的阿爾法喪屍爸到場手撕瑞典兵

  母子逃走遇到醫生救場

  使用嗎啡等迷藥製成的吹箭迷暈喪屍爸

  原來醫生13年間不斷火化屍體並堆成骷髏塔作為紀念

  但其他人見狀以為醫生已經瘋了

  無人願意接近詢問


  後醫生診斷母親為癌症

  但其實母親早有預感，只是希望有個人能代為告知兒子

  最後醫生為母親安樂死

  男主舉行過醫生獨創的堆骷髏頭塔的葬禮後

  將女嬰送回村莊並決定獨自遠行探索本島

  寫一封信告訴村民"小女嬰是喪屍生的但沒有感染喔，勿念我"

  留下父親獨自悔恨(???)


  其後不久獨自於英國遠行的男主在遭遇喪屍追殺時

  長大後的片頭男孩JIM出現

  領著一群人穿著英國標誌性小混混愛迪達打扮(每個人還穿不同顏色)

  利用類似跑酷的動作方式殺光喪屍

  電影就在這邊導演自暴自棄的拍攝下結束

  我也沒有等看有沒有片尾彩蛋就先離場了


  ---


  劇情中經常會穿插一些以往戰爭的影像

  以及一些帶有宗教色彩的意象、圖案、畫面

  或者較為抽象的行為狀況

  譬如母親幫喪屍接生

  醫生堅持了13年不斷火化屍體堆成骷髏塔

  教導男主接受死亡等等等等...

  但都是些陳腔濫調照搬而來的俗套道理

  應該連導演、編劇都沒搞懂自己想表達什麽

  更遑論引申詮釋讓觀眾反思

  只讓人覺得無病呻吟故作高深


  然後阿爾法喪屍的GG很大

