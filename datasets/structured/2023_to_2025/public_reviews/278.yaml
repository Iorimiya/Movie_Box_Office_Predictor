title: '[無雷]  28年毀滅倒數'
content: '這電影 比我早Po的雷文都是算中肯的


  剛看完 我寫一下無雷的感想

  我沒看太多預告片 觀影前也不太有期望值

  基於看過前二部而看的


  看完真的是 讓人覺得倒底看了啥小的片


  又覺得不到爛片

  僵屍片看蠻多的

  因為B級僵屍片實在太多

  比他爛的應該一大堆

  (還有這比活屍大軍還ok一點)


  比我自己原先預想得好的部份

  至少沒拍成陰屍路

  哪種一堆部落很多人的片


  至於設定上 如何的 都過了28年

  哪些可以演化成如此的僵屍種類和行為

  我是沒什麼意見


  這片沒僵屍疫情開始蔓延的末日感還是僵屍感染大爆發之類的


  也就這樣 拍起來很普 還弄得有點文藝片


  僵屍片大多數人 想要看的恐怖鏡頭

  算是沒有太多


  整個片呢 沒什麼重點

  這劇本可以讓片商開拍我也不太懂







  --'
