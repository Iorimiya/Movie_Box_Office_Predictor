url: https://www.ptt.cc/bbs/movie/M.1750334556.A.A61.html
title: 'Re: [討論] 28年毀滅倒數 爛番茄95%'
content: '—


  防個好雷




  昨天看了兩集連映場


  目前看下來就像幾個留言講的行銷絕對有問題 去索尼粉專就知道這部是用帶點屁味的調調吸引想看喪屍爽片的人進來

  但丹尼鮑伊以往的作品就不是那樣  只在意大老二和吵殭屍設定的受眾看完28年出來會一直譙也不意外


  就連28天跟其他喪屍片比也是文藝味很重 只是後段軍人那邊殺得很爽外加那首In the House - In a Heartbeat夠猛 所以觀眾對第一集相對寬容很多  不是丹尼親自拍的28週娛樂性才是系列最高的


  兩集連看下來這系列對人類的暴力劣根性有很深沉的批判 不論是天還是年都有拿歷史和老電影畫面來交錯現代畫面的蒙太奇去諷刺這個無法改變的缺點來表達對人類的無奈


  28天的主軸是聚焦在男女主角在路上遇到的大小事來討論是否要對人性保有希望 而昨天放映的版本是HE



  到了28年英倫地區被封鎖 主角出身於一個因此形成自給自足、科技水準相對外頭落後的小島村落 甚至有以殺殭屍為成年禮的文化


  這個小村落看似純樸且自律 但從主角和爸爸從島外回來後的那些撒謊和不忠的放縱行為就能發現 再怎麼樣的文明與規定 人還是會為了私欲在表象下如野獸般打破這些約束


  純真到連聽到老爸罵髒話都會反感的主角因為媽媽的一氣之下帶著媽媽前往本島 並在旅程中認識到其他價值觀的文明便是本片的主軸（不過這段處理確實是不好 主角的決定草率到會讓觀眾覺得他死小孩一個）


  後段遇到醫生後是這部片的重點 醫生也是導演闡述生死觀的重要媒介 他的定位像是28天中的父女檔 但又更加進階


  被村人視為怪胎不願提起的人解開了母親的疾病真相也凸顯了村人的故步自封  醫生的白骨聖殿並非宣傳期給人聳動恐怖印象

  實則為這亂世中對生命的肯定與禮讚 那兩句拉丁文也為主角失去母親的傷痛提供了一個近似宗教的釋懷管道

  他明明有很多機會能解決掉參孫 但遇到了也只是麻痹對方 ㄧ是為了觀察 二是那些感染這對他而言不過是「憤怒上身」的人  一如歷史上任何人類文明

  主角媽媽也是個對映點 媽媽並非精神失常而是癌末 實際上精神狀況有問題的時候媽媽自己都是知道的 但她無法控制


  將小女嬰送回島上也特別附了紙條表面她是感染者所生  主角之於村人一如醫生之於主角帶來了文化衝擊  但父親卻沒辦法像純真的主角接受衝擊 所以才有那聲在港口的怒吼


  最後那些超尬嘻哈戰隊大概又是主角必須面對的另一個價值觀衝擊 領頭人也是開場倖存並對信仰失望的神父小孩   所以我猜下集的百骨聖殿大概會著重在探討信仰問題


  總之個人是喜歡這片的 但它比較像宮老的蒼鷺或喬治米勒的兩部憤怒道 是一個年事已高的老人想表達他對人生和社會的體悟

  劇中有很多Bug和看了不知道在衝三小的地方 想完這些後倒也不是問題  反而很想知道續集又會想表達什麼 而且本片的刺激與殺戮畫面很有水準 個人特愛弓箭穿身的定格特寫


  這部在台灣票房不會高大概是肯定的 但我認為它是很棒的電波哲學片













  -----

  Sent from JPTT on my iPhone


  --'
