url: https://www.ptt.cc/bbs/movie/M.1750519121.A.91E.html
title: '[負雷] 28年 不有趣 不刺激 不感人'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n我的評價:\n\n28天:95分\n\
  \n28周:75分\n\n28年:60分\n\n\n\n先說優點\n\n\n<風景> 真的很壯麗，戲劇性的拍攝角度充分展現自然之美。\n\n<配樂> 那首詩營造的緊張感十分出色，跟前兩部經典配樂\n\
  \n        In the House - In a Heartbeat相比毫不遜色。\n\n\n\n缺點\n\n<冗長又莫名其妙的感染者設定>\n\n\
  1. 28天非常的純粹: 憤怒、攻擊、血液。\n\n   那不是殭屍，只是憤怒的人，\n\n   有用人的原始情感毀滅人的哲學意涵。\n\n   28年......破壞了這種狂怒佔據所有思維的震撼力。\n\
  \n   為了過這麼久還有怪能打，推翻前作感染者會餓死的設定，\n\n   很刻意的加了進食鏡頭、玩水鏡頭。\n\n2. 新增很奇怪的緩慢爬行肥殭屍品種，但他們的由來到底是什麼?\n\
  \n   吃蚯蚓可以肥成這樣活28年?\n\n3. 還有什麼類固醇的，總之病毒就是能變異出有智慧更強壯的阿爾法品種、\n\n   能指揮部下、懂得內射生小孩，加上整群人衣不蔽體，\n\
  \n   搞得像是什麼瘋瘋癲癲的野人群而不是殭屍或感染者。\n\n4. 是說人類真的可以這樣隨隨便便就在野外活20幾年哦?\n\n   每天大吼大叫亂跑消耗能量、全身跌撞的都是傷、吃生肉蚯蚓......\n\
  \n   那怎麼還會有人在森林裡遇難死掉??\n\n   該不會又要全推給病毒的神奇變異吧??\n\n5. 嬰兒出生時全身都是感染者母親的血，\n\n   這樣還不會感染，28天不是一滴進眼就中標了嗎?\n\
  \n   最後雜耍戰隊近戰玩殭屍我看也根本沒防護呀。\n\n\n\n<過多巧合跟牽強的劇情>\n\n1.  感染者忽快忽慢，追主角永遠追不到，追武裝軍人幾秒鐘就撲殺一個。\n\
  \n2.  為啥在森林覓食的肥感染者，\n\n    會有單獨一隻，三更半夜爬到廣大的水泥建築物裡把屁孩的鞋帶當蚯蚓吸?\n\n3.  在餐廳引爆瓦斯，只要原地趴下就能閃爆炸，但站著的感染者都被炸到起大火??\n\
  \n4.  行進時，軍人跟屁孩竟放任神志不清的女人自己脫隊走最前面，\n\n    甚至遠到兩人追一兩分鐘還找不到人???\n\n5.  每次遭遇都一定要說一遍聲音會引來更多，但吹箭迷暈阿爾法後，\n\
  \n    醫生跟屁孩就原地鬆弛的聊起天?? 那可是平常跟著成群部下的阿爾法耶?\n\n6.  醫生後面還大意的被阿爾法用手穿過欄杆抓住，到底怎麼在他手下活三年的?\n\
  \n7.  屁孩怎麼繞過警衛放嬰兒在門口?? 外面只有一個會被潮汐漲幅封鎖的窄道耶。\n\n\n\n\n結論:\n\n  就是一個緊張刺激的橋段，會被不合理之處搞得出戲。\n\
  \n  要撼動人心的情節也沒有，只有不知道想表達什麼的蒙太奇跟哭哭屁孩。\n\n  整部觀影體驗就是無數個 「呃...?」 組合在一起。\n\n  不要跟我一樣頭鐵去看。\n\
  \n\n\n--"
