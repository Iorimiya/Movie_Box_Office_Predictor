title: '[新聞] 《28年毀滅倒數》落腳索尼！席尼墨菲將'
content: "《28年毀滅倒數》落腳索尼！席尼墨菲將監製，尚未確認是否回歸演出\n\n2024-02-01電影神搜\n\n根據《好萊塢報導者》的最新報導，在經歷了一連串的版權競標後，導演丹尼鮑伊以及編\n\
  劇亞力克斯嘉蘭回歸為《28天毀滅倒數》打造的最新續集計畫《28年毀滅倒數》以及後續\n的另一部電影，已經確定將會由索尼影業負責發行。\n\n值得注意的是，丹尼鮑伊只會負責執導其中一部，而續集的導演人選則將會在日後決定。\n\
  此外，主演《28天毀滅倒數》的席尼墨菲也已經證實將會擔任全新續集的執行製作人，不\n過他是否將會參與演出，目前仍然尚未確定。\n\n大約在三週前，代表丹尼鮑伊以及亞力克斯嘉蘭的\
  \ WME 公司帶著《28年毀滅倒數》以及\n續集的發行權與多間好萊塢片商以及串流平台展開了洽談，在經歷了一連串的激烈競標後\n，潛在片商就只剩下華納兄弟和索尼。\n\
  \n這種原幕後團隊在睽違多年後回歸執導續集的情況，令不少觀眾想到了 2015 年由喬治米\n勒回歸執導的《瘋狂麥斯：憤怒道》。\n\n\n\n與《28年毀滅倒數》以及另一部續集有關的合約細節目前無法取得，每部電影的預算約為\n\
  \ 6000 萬美元，但無法確定最終結果與相關補償在談判的過程中是否出現改變，而採用院\n線發行的形式對於這兩位導演來說都非常重要。\n\n此外，丹尼鮑伊以及亞力克斯嘉蘭，再加上原版電影監製安德魯麥克唐納、彼得賴斯，以\n\
  及福斯探照燈影業的前負責人貝爾納貝列夫都將會擔任《28年毀滅倒數》的監製。\n\n\n\n競標的過程中，索尼影業可說是拿出了一個非常特別的殺手鐧，那就是公司負責人湯姆羅\n\
  思曼與丹尼鮑伊之間長達 30 年以上的合作關係。湯姆羅思曼於 1990 年代創辦了福斯探\n照燈，也在 2000 年代初期負責營運福斯的電影部門，過程中與丹尼鮑伊合作過8部電影\n\
  ，從《你行我素》到《海灘》，以及《貧民百萬富翁》和《127小時》等奧斯卡金獎電影\n。\n\n大約在 20 多年前，丹尼鮑伊與亞力克斯嘉蘭合作拍攝了《28天毀滅倒數》，並針對殭屍\n\
  電影題材帶來了許多革新性的創意，為日後的《陰屍路》、《末日Z戰》、《屍樂園》、\n《最後生還者》等殭屍影視娛樂作品帶來了深刻的影響。\n\n\n\n席尼墨菲在《28天毀滅倒數》中飾演一位獨自在醫院從昏迷中醒來的男子，接著卻發現外\n\
  頭的世界已經遭到神秘殭屍佔領了 28 天的時間。\n\n這部於 2002 年上映的經典電影在全球創下了 8270 萬美元的票房，之後也在 2007 年延\n伸出一部續集《28\
  \ 週毀滅倒數》，雖然丹尼鮑伊與亞力克斯嘉蘭僅擔任了後者的執行製\n作人。\n\n這對雙人搭檔多年來都向媒體談論了為《28天毀滅倒數》系列推出另一部續集的可能性，\n\
  當時續集的標題原本訂為《28 月毀滅倒數》，但隨著一年又一年過去，《28 年毀滅倒數\n》則成為了他們的新點子。\n\n《28天毀滅倒數》推出後的多年來，這兩位幕後人員在好萊塢中的身價也不斷提升，丹尼\n\
  鮑伊以《貧民百萬富翁》拿下了奧斯卡最佳影片，而亞力克斯嘉蘭則執導了《人造意識》\n以及 A24 發行的最新作品《帝國浩劫：美國內戰》。\n\n\n新聞網址：\n\
