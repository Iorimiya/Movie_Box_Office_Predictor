title: '[負雷] 28年毀滅倒數 結局爛'
content: '本來想看4DX的F1但都沒買到票 所以去看28年

  原本看預告好像是爽片一部

  一開始也覺得還不錯，但結局真的收很爛

  （前兩部我沒看過）


  以下有雷


  主角光環太重了，一開始跟爸爸往返本土艱困的要死

  阿爾法還跟到閘門那邊，結果自己從超遠的地方帶著嬰兒回去都沒發生什麼事

  而且就這樣把嬰兒丟給他爸，他爸這些日子也都沒去本土找他們，這設定很瞎


  還有每次發生什麼都有人來救，媽媽直接把殭屍打爆也很...？

  帶媽媽去找醫生，結果醫生把媽媽火化，看到有點笑出來


  把嬰兒送回去自己回本土生活，箭也是某一天會用完的吧

  主角超級無腦，很多劇情都看到很出戲，覺得可以不用浪費錢去影院看


  --'
