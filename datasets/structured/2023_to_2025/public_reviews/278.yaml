content: "雷文防雷資訊頁\n \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n \n\
  \ \n \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n \n \n\n\n\
  難得有電影可以讓我全場都不敢上廁所的\n\n深怕不小心錯過了漂亮又暴力的場面\n\n整部片都是精雕細琢的典雅藝術作品\n\n很難得如此血腥暴力的畫面可以拍得這麼美麗高雅\n\
  \n看的非常舒服\n\n感覺我整個人都有氣質了起來\n\n就像看了場高維度的藝術展\n\n讓我回想起我上禮拜去富邦美術館看的路易絲．布爾喬亞的這部展覽\n\n\n\
  \n\n然後劇情真的是\n\n小屁孩要逃離就算了\n\n還燒大家的糧倉\n\n哇靠這什麼低能操作\n\n難怪最後不敢回去哈哈哈\n\n\n\n之後殭屍孕婦臨產時還跟那位媽媽十指緊扣\n\
  \n哈哈哈十指緊扣也太低能了哈哈哈哈\n\n什麼糞片哈哈哈哈\n\n\n\n然後狂戰士殭屍看到自己老婆掛了還會生氣哈哈哈\n\n\n這劇情是什麼鬼啊\n\n我猜應該是為了後面兩部曲埋梗吧\n\
  \n不然殭屍都那副模樣頗無聊的\n\n\n\n續集我還會繼續看的\n\n很好看很浪漫的神作\n----\nSent from  on my iPhone17,5\n\
