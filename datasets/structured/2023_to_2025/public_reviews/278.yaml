url: https://www.ptt.cc/bbs/movie/M.1716345021.A.9B4.html
title: '[新聞] 《28年毀滅倒數》席尼墨菲將以驚喜方式 '
content: '《28年毀滅倒數》席尼墨菲將以驚喜方式登場！亞力克斯嘉蘭分享劇本參考肯洛區《鷹與

  男孩》




  目前距離《28天毀滅倒數》上映已經超過 20 年的時間，就當眾人認為這部電影就止步於

  此的時候，這個經典恐怖系列宣布將推出另一部最新續集《28年毀滅倒數》，電影執行製

  片人湯姆羅思曼證實席尼墨菲將在片中回歸演出，根據他接受《Deadline》網站的訪談所

  說，他暗示席尼墨菲的角色將有出乎意料的發展。



  「是的，他會回歸，但會以一種令人驚喜且成長的方式出現，讓我這樣說吧。」






  《28年毀滅倒數》導演、編劇、演員全回歸


  《28年毀滅倒數》將由系列導演丹尼鮑伊回歸執導，編劇亞力克斯嘉蘭也將再次為這部續

  集撰寫劇本，並將開啟一段新的三部曲故事。除了證實席尼墨菲的回歸外，其他劇情和細

  節目前仍處保密狀態，值得一提的是，參與本片的演員還包含茱蒂康默、亞倫泰勒強森，

  及雷夫范恩斯。


  「這是丹尼全力以赴的作品，結合相當商業化的類型，就像由艾德格萊特執導的《玩命再

  劫》。有時候當你將一位導演的獨特風格注入商業電影時，就能為它帶來昇華。所以我們

  能看到導演戴倫艾洛諾夫斯基和演員奧斯汀巴特勒的新作，那也會是戴倫艾洛諾夫斯基至

  今最商業化的一部作品。他和奧斯汀對此都充滿熱情。那部電影叫做《Caught Stealing

  》，改編自一部很酷的書，一部藉由導演風格帶來獨特性的動作驚悚電影。」


  湯姆羅思曼的言論，透露出《28年毀滅倒數》在延續前作精神的同時，也將帶來新的敘事

  轉折，將為這個經典系列的復甦鋪設道路。《28天毀滅倒數》以重振殭屍類型片而聞名，

  描繪致命病毒外洩後，社會崩潰的景象，電影的影響相當深遠，特別是對於後世的殭屍類

  型娛樂作品。



  《28年毀滅倒數》從《鷹與男孩》獲取靈感


  而《帝國浩劫：美國內戰》導演亞力克斯嘉蘭將為整個新三部曲撰寫劇本，因此，粉絲能

  在這個系列中看到更一致性的敘事風格。在最近受訪時，亞力克斯嘉蘭公開分享 1969 年

  由肯洛區執導的英國電影《鷹與男孩》為《28年毀滅倒數》帶來的啟發，他對《鷹族男孩

  》的推崇，體現了過去的電影傑作如何持續啟發當代電影人。


  「在我為丹尼鮑伊撰寫的電影劇本中，我的做法就是參考一部叫做《鷹與男孩》的電影。

  對一部殭屍電影來說，這絕對是個出乎意料的靈感來源。我想我的這部劇本和《鷹與男孩

  》都聚焦在一位年輕人的經歷身上，並且帶來一種獨特的風格。這是最明顯的做法，但在

  場景的呈現上依然有著更微妙的細節，有點圍繞在人與自然之間。」






  依照他的說法，亞力克斯嘉蘭在《鷹與男孩》中那位年輕男孩所面臨的困境，以及這部他

  所打造的全新殭屍電影故事間看到了一種親密的關係，但他對此加入一些相當獨特的改變

  ，尤其是如何將自然場景融入到這段故事。


  《28天毀滅倒數》的成功在於重塑殭屍災難片的模式，融合社會寓言和人性探索。如今，

  《28年毀滅倒數》的到來，讓影迷們對這一經典系列能否再次刷新類型片的高度充滿期待

  。隨著席尼墨菲的回歸、令人興奮的新卡司陣容，以及幕後主創們的雄心勃勃，這部電影

  勢必會在 2024 年掀起一股殭屍狂潮。儘管劇情細節尚未公開，但從種種跡象來看，《28

  年毀滅倒數》將在延續前作精髓的同時，也為我們帶來耳目一新的驚喜。讓我們拭目以待

  ，看看這部電影將如何重啟這個標誌性的恐怖系列，再次挑戰極限。



  《28年毀滅倒數》預計將於 2025 年 6 月上映。





  --'
