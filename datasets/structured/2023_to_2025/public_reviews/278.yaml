url: https://www.ptt.cc/bbs/movie/M.1758990646.A.DB6.html
title: '[獵奇雷] 28年毀滅倒數之少年登大人奇幻旅程'
content: '雷文防雷資訊頁






  雷阿~~~~~~~~~~~~~










  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  這部片其實還不少負評，但我個人覺得如果撇開對[28]系列的期待和成見的話，


  其實這片還蠻有特色的，也相當的獵奇。


  雖然說看不到系列過往那種跑百米殭屍的壓迫感，


  但是也有不少獨特的獵奇元素，


  適合當作新的篇章來欣賞。




  當然劇情方面，確實是有點瞎，看到一半差點快笑出來，


  尤其是大雕男到處甩屌，


  而且女殭屍居然還能懷孕，很難想像他們感染者做愛是甚麼場景，


  真的是瘋狂做愛無誤。




  小男孩帶媽媽去尋醫也是很瞎，


  怎麼看都覺得這是生存機率極低的做法，


  還不如給媽媽摘草藥亂醫一通，可能都還比較理智一點。




  不過話說回來，其實整部片一開始的調性就是荒謬路線，


  像開頭那個神父就把被感染看成一種救贖，簡直不能再瘋，


  所以我覺得看這部片的時候腦洞要開大一點，不要太計較劇情的合理性。



  比如說[殭屍首殺]作為成年禮，本身就是很白癡的行為，對文明人來說，


  但是我們可以看到這個小島住民已經開始有點返部落社會的跡象了，


  所以我們可以稍微用跳脫現代人的觀點去理解。



  片中似乎想強調暴力是古今不同社會都存在的元素，


  所以小村用殺殭屍作為成年禮，然後回來大肆慶祝一番，


  其實也是野蠻暴力的一種表現，這點跟[感染者]是相似的。


  後面跑酷虐殺殭屍，其實也是凸顯這一點。(這個在28天也表示過)



  主角男孩扮演的似乎有點類似小村的[叛逆者]，


  雖然跑入森林尋醫的策略 表面看真的很蠢，


  但是我們站在男孩角度想，


  他是一個出生就在小島的[原住民]，


  村子裡的教育很顯然是有點愚民的，


  然後村子的人也沒有醫學觀念，


  只有老一代的人曾經知道英國以前是甚麼樣子，


  第二代把上一代的話當無稽之談，


  到了第三代，連手機是甚麼都不曉得。(但吐槽豐唇妹那裏真的挺好笑的)




  所以小男孩扮演的可能是類似柏拉圖穴喻中[走出洞穴的人]，


  也許電影未來劇情會藉著小男孩的視角，去發掘更多真相。



  比如主島的情況到底怎樣? 為何歐洲鄰國28年來就放著英國不管?


  也許小島的處境會類似進擊的巨人裡的劇情一樣，


  長期以來被刻意孤立?


  ------------




  鏡頭方面，其實蠻不錯的，有不少美麗壯觀的場景，


  英國的村莊，奔跑的鹿，還有多角度殭屍擊殺、進擊的巨屌、壯觀靈骨塔等等，


  順帶一題，我覺得雷夫·范恩斯的演技仍相當不錯，


  一出場就演出一種在殭屍荒野獨活30年，既有點詭異又相當精明的古怪醫生。


  有人可能質疑說，為何醫生不把大雕男給殺了，為何醫生立刻就要把媽媽安樂死，


  我想醫生的思想一定是相當前衛、異於常人的，


  否則他也不會一個人在這裡獨活30年還蓋靈骨塔，


  也許他在進行關於[感染者]的研究。




  配樂方面也挺不錯的，


  ------------


  總之，我覺得[28年]這部也是有它獨特的風味，算是有些跳脫前作。


  電影感覺有一些後現代或虛無主義的元素，


  表現了[感染者]和[人類]死後無異的生死觀，


  還有人類一旦失去(表面的)文明，一樣會以虐殺異族為樂的殘暴一面。



  也許後續的續集，會隨著劇情的展開，有更多關於這方面的闡述吧。



  如果不要過度用過往既有的殭屍片風格來作期待，


  嘗試把腦洞開大一點，


  我覺得這部也是還蠻別出心裁的，not bad。








  --

  奧茲：你可以吃一堆香蕉！

  芬利：哦，我懂了，就因為我是一隻猴子，所以我一定要喜歡香蕉！

  奧茲：你不喜歡香蕉嗎？

  芬利：別傻了！ 我當然喜歡香蕉，我可是一隻猴子！我只是不喜歡你的推論方式。




  --'
