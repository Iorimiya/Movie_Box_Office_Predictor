url: https://www.ptt.cc/bbs/movie/M.1750442322.A.5CB.html
title: '[普好雷] 28年毀滅倒數 請注意開啟方式'
content: "先給點無雷感想:\n\n這部畫面構圖還有光影拍得漂亮,\n有幾幕逆光拍攝真的像是攝影作品.\n\n劇情節奏也不錯,\n不會緩慢冗長到讓你不耐煩.\n\
  \n不過如果你只是想看噴血還有jumpscare,\n那這部不是這樣的作品,\n不建議使用這種方式觀影,\n你會非常失望XD\n\n\n*重要*\n雖然這部預告片長那樣但卻不是那樣!\n\
  雖然這部預告片長那樣但卻不是那樣!\n雖然這部預告片長那樣但卻不是那樣!\n*重要*\n\n\n\n以下有雷請自行斟酌\n\n================防雷==================\n\
  \n以下說明一下我自己覺得這部比較適合的開箱方式:\n(當然我講的也有可能是錯的,\n 有問題請以你的感覺為主XD)\n\n首先這部是在講主角的成長,\n感染者什麼的其實是輔助XD\n\
  \nSpike從一開始緊張時刻出包射不中,\n看到老爸出軌魯莽帶老媽上陸,\n到中期遇到大哥哥Erik,\n見證新生命,\n後續Erik的死也讓Spike初次理解到了Memento\
  \ Mori(勿忘終將一死),\n在Kelson醫師與老媽的引導下,\n也領悟到了雖然人終將一死,\n但Memento Amoris(勿忘愛),\n最後Spike把新生命交給村莊後繼續探索陸地,\n\
  而此時他也已經不是一開始的菜鳥了.\n\n\n整體而言其實劇情算很完整,\n邏輯可以說得通.\n\n而畫面確實很漂亮,\n像是28cm站在樹下的背光那幕,\n\
  構圖光影都沒什麼好挑剔的,\n漂亮得像攝影作品.\n\n運鏡除了有幾幕有點太晃以外,\n整體而言都還滿容易理解,\n而且節奏不會拖泥帶水.\n弓箭爆頭的慢動作定格我滿喜歡的,\n\
  有做出奇異的潮感.\n可惜到片尾漸漸消失了 :(\n\n我自己給不到好雷的原因主要出在主角老媽身上,\n她自己其實有癌症病識,\n像是對於自己的不正常行徑有所認知但無法控制,\n\
  以及最後對醫生坦白自己痛很久了都是證據.\n\n但 整體表現還是太健康了,\n不論是妝容或是砸死爬行種的行為都表現得她其實沒病這麼重,\n這導致她一聽到醫生推測癌細胞已經蔓延全身就想安樂死的說服力不夠.\n\
  \n另外就是最後那群吉米跑酷戰隊出來之後,\n把之前的儀式感破壞殆盡,\n可以理解導演想要給點不一樣的刺激在結尾,\n但觀影情緒就被破壞了,\n我是覺得很可惜.\n\
  (當然也有可能我沒有參透XD)\n\n當然序章最後Jimmy拿著十字架哭訴為何神背棄我,\n最後戴著倒十字登場這點象徵性的意義是有頭尾呼應的,\n但跑酷登場實在太跳痛了XD\n\
  \n如果改成Jimmy戰隊屍妝+黑道袍登場,\n背景音樂再上個Dark Funeral之類的黑金屬(或是交響黑),\n(看起來就是會去燒教堂的那種)\n這樣既可以前後呼應又有儀式感我覺得會好很多.\n\
  \n其他像是歐陸它國袖手旁觀,\n既不提供幫助也不給個痛快,\n只封起來也算是諷刺意味十足啦(汗\n(不想要被感染\n 但又不想花太多資源\n 用核彈名聲又不好\n\
  \ 想想還是就這樣封起來就好\n 當看不見大家繼續照過日子)\n\n\n總之 預告片有誤導之嫌XD\n這部不是普通的噴血jumpscare片,\n建議要使用正確的開封方式觀影XD\n\
  \n--\n\n我覺得是預告片吊起來的期待與片子本身不符,\n而且片子本身就有點挑觀眾\n\n\n已修正 感謝提醒 m<_ _>m\n不然有人誤觸就尷尬了(汗\n\
  \n\n沒辦法 這部比較挑觀眾 電波沒對到就沒辦法(攤手\n不過預告片剪那樣也真的是包裝與內容物不符 :(\n\n\n至少故事說完整了就及格啦\n畫面漂亮還有主角成長曲線這些都能再加一些分\n\
  歐陸國家擺爛不作為的反諷也是很不錯\n\n\n但可以搞得有儀式感一點啊...\n前兩個scene還慎重的把媽媽的骨頭放在最好的位置,\n儀式感拉滿,\n結果最後你給我來這個...\n\
  好歹你都倒十字了 給我邪一點的儀式感殺感染者啊XD\n\n\n如果你說片尾彩蛋的話 沒有喔~\n\n\n其實也沒啥驚悚程度,\n真的比較像以這個世界觀拍攝的小男孩成長故事XD\n\
  \n\n這部真的滿吃電波的\n\n\n!!! 你說服我了....\n但為什麼一定要愛迪達啦 七色屍妝道袍戰隊不好嗎XD\n\n\n吉米那段我也認為有必要,\n\
  但至少不應該破壞之前營造好的儀式感,\n我自己觀賞的感想是那段很撕裂觀影情緒 :(\n\n\n看後續怎麼拍\n只要不要像這集後面毀滅前面的情緒堆疊就好.\n至少這集前面滿滿儀式感後面接這個真的太跳啦...\n\
  \n如果一開始就這樣搞到底我倒不會不能接受.\n\n\n畫面真的滿有藝術價值+1\nMemento Amoris儀式感堆疊也很滿 還配個日出XD"
