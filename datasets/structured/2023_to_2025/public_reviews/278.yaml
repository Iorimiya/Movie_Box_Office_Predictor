url: https://www.ptt.cc/bbs/movie/M.1750530005.A.955.html
title: '[好雷]28年毀滅倒數 有成長，有救贖'
content: '雖然對點進來看雷文的人有點奇怪，但是我覺得這是好片，而之前看雷文心得的確有影響

  到我觀影體驗，所以在繼續看心得前建議先看過本片。


  首先我對這部片最大的期待是在末日之後形成的特殊文化有沒有拍好。

  整部片中我一直東想西想，覺得會不會突然蹦出某些很違反現代道德，但是因為在末日，

  而顯得可以接受的習俗。

  比如說主角的母親會不會是父親從外面「狩獵」進來的，在抓來的過程中被敲壞腦袋之類

  的。


  不過故事意外的沒有太糟糕的展開，年輕魯莽的孩子，因著善良和道德而離開安全的村落

  ，帶著病重的母親尋醫。

  一般殭屍片中這種展開就是白目找死，但是與上集那種事情越來越糟的情況不同，這集尋

  找救贖的旅程是相當王道的展開，給我一種星球崛起4的亞瑟的感覺，因為也有一堆「野

  人」XD


  主角在旅程中比較特別的經歷就是看到感染者生子，而且生出來的還不是感染者！但是經

  過第二集大家也知道，不是感染者不代表他不是感染源，所以救下嬰兒未必是好事。

  更讓我不舒服的是去思考其他感染者生下的小孩，究竟遭遇了什麼樣的命運…畢竟也沒看

  到感染者中有養育的嬰兒。


  到達旅途終點的醫生處，由於先看了一些負雷文，讓我以為醫生是什麼神經病。結果只是

  個在末日中謹守道德，尊重死亡的醫生。

  這段我過一半才發現那些柱子是骨頭拼成的，而那個骷髏柱在我看到海報時，還挺期待是

  某種致敬的瘋狂玩意兒，結果意外是很正經的墓葬。

  把屍體煮熟，剔除皮肉，讓我想到原住民獵人頭的做法，沒想到看到這種賽德克巴萊都沒

  拍出來的傳統手藝（？），我其實挺開心的XD


  最後主角遭遇片頭的小孩，經過28年他長成了一方首領，有著自己的勢力。

  那倒掛的十字表示他成了敵基督？雖然他的童兵們身手矯健，那些DIY的創意武器也是我

  很愛在殭屍片中看到的元素。但是他們有幾個太調皮了，讓血亂噴，在這系列不太明智。


  講完大致劇情的感想，接著要細節說說一些心得。


  爸爸的角色有些魯莽，讓主角過早進行試煉、在試煉過程中態度輕浮，直到遇到阿爾法，

  事情大條才正經起來。

  不過之後他的行為讓前面的鋪陳成為端倪，而我對他的感想就是在末日中努力過日子的一

  般人。

  他們已經在感染威脅下生活28年，村中生活不能說是高枕無憂，但起碼用有禮貌的標語就

  能約束眾人不要浪費物資。

  我想說的是爸爸給我的感覺是在生活，而不是僅僅在生存。雖然給我這個印象的原因並不

  是什麼好事XD


  男主的作為大致上就是個認真的小孩，他表現比大多12歲小孩更好但終究是12歲小孩，也

  因此我們必須容忍他的一些行為。

  而帶著重病的母親踏上旅途，讓他短時間有了大幅成長，讓我在這部一般會歸類在邪典的

  殭屍片上看到有如王道電影的展開，其實是有趣的體驗。


  母親和主角的對戲非常精彩，在這部血腥的電影中帶來不少寧靜時刻。

  之前看到板上的負評，在於母親溫馴地走入那良夜，不過在那邊選擇安樂死其實是很好的

  結局了。她的症狀放在文明未崩潰的時候也是絕症啊。

  打爆爬行肥仔那段還以為母親會在後面又爆氣，結果就爆那一次而已XD


  感染者畢竟餓了28年，又老又營養不良的感染者已經不復一、二集那些鮮活感染者的威脅

  性。

  爬行肥仔更是謎般的物種，到底蚯蚓有多營養讓他們能吃那麼肥XD

  突然想到，那個跑掉的小肥仔莫非是感染者生出來的非感染者？

  阿爾法感覺有地域性，拔頭放樹上可能是要別的阿爾法別靠近，遠離自己的群落？

  然後拔頭如果是致敬田中脊髓劍的話，藤本樹應該會超爽XD雖然我覺得比較可能是致敬真

  人快打啦。

  第一集主角是不是客串頭被拔掉的士兵？一開始感覺挺差的，不過瞭解到這可能是一種幽

  默的表現就算了。


  醫生那段老實說我挺失望的，那段拍攝給我的印象不夠深刻，不太能融入其中。只覺得朝

  陽照射在母親頭顱上是什麼俄國文學式的結局XD

  我對國片《查無此心》中，兇手對死者的「保存儀式」印象還蠻深刻的。那段使用大量的

  拍攝手法，就能對少量的「作品」印象深刻。

  但《28年》並沒有要營造驚悚的感覺，只用直白的拍攝方式來展現骷髏柱那壯觀的作品，

  老實說，連電影海報都拍得比正戲有魄力多了。


  主角最後遇上吉米，其實留了一個有趣的對比：一邊對天父拋棄自己而反戴十字，過著墮

  落生活的大人，另一邊則是謹守保守生活的小孩，反過來拋棄自己父親XD

  若是有續集，主軸或許是兩人結伴旅行，一同尋找救贖？


  但是說到續集多少有點氣了，《28週》明明演到感染擴散，《28年》這就看起來沒那回事

  了。

  看來《28年》留的這股懸念，八成也是沒得填的坑了。



  --'
