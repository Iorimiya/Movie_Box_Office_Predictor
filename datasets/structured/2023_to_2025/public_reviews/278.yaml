url: https://www.ptt.cc/bbs/movie/M.1750230471.A.D89.html
title: '[偏負雷] 28年毀滅倒數（後半段越看越躁）'
content: '剛看完出來


  跟其他人說的一樣


  前半段還不錯 配樂真的很讚


  以為要是神片了


  但 就是那個但


  中間開始反轉


  讓人越看越煩躁




  放一個防雷的

  ————————————————————————

  先說優點


  1.前面配樂真的很讚


  尤其是搭配Boots


  這首1915年Rudyard Kipling寫的詩


  一邊出發離開小島 一邊穿插一戰的行軍畫面


  2.這集因為過了28年


  都是冷兵器為主（主要是用弓）


  小島訓練弓的時候 也穿插了一些中世紀的畫面


  這部分前面看的時候真的很有感覺

  ————————————————————————

  再來說缺點好了


  1.我靠 你要跟28週一樣有小屁孩沒問題


  但不要比他還屁啊


  中間轉折有夠奇怪


  明明知道都是你爸在救你


  結果 你還在那邊搞 硬把你媽拖出去死


  然後放火把小島的補給點燒光


  走之前 還先騙走警戒的人= =


  再來真的是一無是處 連警戒都不會


  還被媽媽救 真的吐血吐到不行


  2.守島的人 人人都在打瞌睡


  完全搞不懂怎麼守住28年的


  屁孩居然可以走過去把嬰兒放下


  又走回去沒被發現？？


  晚上也是一直吹哨 才睡起來搖探照燈


  3.後面一堆看不懂意義的劇情


  巡邏隊沈船到陸地 結果在那邊自生自滅？


  搞不懂都過28年了


  都沒去研究或是設置避難點之類的嗎


  讓一小隊在那邊自生自滅….


  4.莫名其妙新增一堆殭屍設定


  女殭屍會懷孕 會生小孩


  生下來的小孩是正常的 讚嘆胎盤（？


  再來就是狂戰士or阿爾法


  特別喜歡把動物的人頭和頸椎抽出來甩


  搞不懂是什麼意思 展現自己很強壯嗎@@？


  5.最後的吉米是想致敬什麼嗎


  看不太懂導演想表達的


  知道是片頭那小孩 跟亂殺人什麼的


  是在暗示對方是jimmy savile？ 還是啥


  開完滿頭問號

  ————————————————————————

  明明是僵屍片


  後半段真的很躁


  不能好好演殭屍片該有的嗎= =


  搞了一堆文藝什麼的


  最後真的越看越氣  28週還比這好看多了


  喔對了 電影最後還在那邊28天後= =


  氣氣氣


  --'
