url: https://www.ptt.cc/bbs/movie/M.1750237672.A.8A8.html
title: '[超負雷] 28年毀滅倒數：我到底看了什麼？'
content: '第一天衝了下午場

  散場的時候三小聲此起彼落


  先不說劇情設定上有些問題

  光是這部電影

  把喪屍設定幾乎推翻

  真的很難讓人接受！！！


  雖然前兩部沒有具體描述喪屍的設定

  但大家熟悉的喪屍

  基本上就是被病毒感染以後

  沒有意識也沒有感覺（包含痛覺）的寄生屍體


  三部曲完全毁掉這個設定

  電影裡的被病毒感染的民眾

  被設定成比較像是狂暴性格極具攻擊力的怪物

  （感謝版友提醒本來設定就是狂暴人）


  最不能接受的地方是

  竟然還有喪屍生寶寶

  然後因為在分娩過程疼痛而失去攻擊能力

  到底是三小？？？

  到底是三小？？？

  到底是三小？？？


  然後還有喪屍可以用麻醉吹箭讓他暫時昏睡

  我到底看了什麼？？？？？

  用麻醉這麼簡單為什麼還會輸成這樣？


  反正這部電影就是一個小孩的媽媽得到絕症

  然後很久以前有一個醫師離開外島村莊前去本土

  小孩就想帶媽媽去本土給醫生看病

  然後帶給醫生看以後醫生說沒救了這是絕症

  然後醫生順便幹掉她媽媽

  把她媽媽的頭骨送給小孩

  讓小孩把媽媽的頭骨擺在小孩覺得完美的位置

  （到底三小？


  就沒了


  前面幾分鐘確實有營造出一點緊張感

  但後面開始扯到宗教的時候

  就知道這部片爛掉了


  比第二部還不如

  真慘

  大家省省錢吧


  --


  很瞎的點是用麻醉就能放倒

  那憑什麼會輸成這樣？'
