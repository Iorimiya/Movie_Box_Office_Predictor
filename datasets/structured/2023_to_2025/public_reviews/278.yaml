url: https://www.ptt.cc/bbs/movie/M.1750604814.A.F91.html
title: '[怒雷] 28年毀滅倒數'
content: '今天看完 與其說負雷~ 我感受到到更多的是憤怒

  查一下是同一個導演?但究竟是甚麼樣的心態 他會把自己的IP搞得這麼自大?


  如果他是一部獨立電影 比如噤界之類 那也許可以給他好評


  但我就問 這個毀滅倒數28天的前兩部曲 到底關係在三小?

  世界觀根本沒有一致呀 他不說是前兩部的續集也沒人知道呀


  好像有要探索一些甚麼東西 但也跟前作沒關係

  就算退一萬步 我不會否認可能有1%機會三部曲出來搞不好有神


  但這不是拍電影續集第三集的方式 你這28年的劇情

  換頭換成任何喪屍片 都可以繼續接 那這哪門子第三集


  而且是 28年後的世界想像本身就很爛很鳥

  這些喪屍是有多強? 隔離這麼多年了 最好島上還有活人可以吸血

  還可以有活人撐到28年後還年輕作愛當孕婦 還是其實他是要設定這群無腦的還是能相幹?

  (雖然的確是有暗示阿爾法跟孕婦的關係) 光28年這種等級的隔離還沒死光

  沒有外溢到全世界卻也還沒有解決 就已經跟當代科技技術無法接軌的落伍

  明明就只是一群看起來視覺上1:1大小無垢巨人的傢伙 最好人類28年無解


  然後重點是 我最肚爛的一種災難片 驚悚片 鬼片的類型

  就是刻意讓小孩超級無腦 讓女角超級聖母


  最後就看一群無腦的把事情弄得更糟 救人的莫名被害死


  這集就是了 被刻意愚蠢的小孩 被刻意不合理聖母化的媽媽

  然後媽媽中一度故弄玄虛狂暴化 轉瞬間就自己跑去被燒了


  就算得癌症快沒救了 正常人誰會放自己媽媽直接去尋死?

  然後那個醫生一樣是個無腦角色 可以射暈阿爾法結果就放著他和平共處


  結果隔天那隻就差點要抄你家了 你是不會直接趁他不能動燒死他嗎

  你這種腦袋到底是怎麼一直生火還可以活幾十年?


  片商到底怎麼開綠燈直接拍三部曲的呀



  --'
