title: '[請益] 《蜘蛛人：穿越新宇宙》日配版畫面有比較'
content: '小弟剛看完日配版，

  在這之前只有看過早鳥包場，

  發現日配版多了不少畫面，

  尤其是蜘蛛人大戰跟地球42的部分，


  因此想請問看過三個版本或

  英配+早鳥、英配+日配的大大們，

  日配是真的有比較多鏡頭？

  還是早鳥包場是閹割版？


  如果早鳥包場是閹割版的話我真的會被索尼氣死

  -----

  Sent from JPTT on my iPhone


