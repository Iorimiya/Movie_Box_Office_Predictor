url: https://www.ptt.cc/bbs/movie/M.1687532113.A.2CD.html
title: '[討論] 《蜘蛛人:穿越新宇宙》的幾個橋段'
content: '有電影劇情雷，強烈建議看完電影再往下看


  以下防雷






















  ——————-防雷結束線——————






  這幾天推特上開始討論一件事，就是在電影中關和米蓋爾對抗中世紀禿鷹時，米蓋爾向萊拉呼叫支援的橋段，有人看到的電影內容是看到萊拉用兔兔濾鏡跟米蓋爾拍了一張自拍，有人則是看到萊拉指著米蓋爾，出現了兩種版本的狀況。







  推主提出關於這段的疑問後，開始有更多人提出在其他橋段自己似乎有看到與其他人不同的版本，例如邁爾斯在追逐戰被鎖喉時的對話，和邁爾斯父親在追逐斑點人時的畫面，還有其他數個段落，都有兩種不同的版本。




  而在今天，電影的剪輯師Andrew Leviton在自己的推特上轉發了大家討論的推文，並推文表示：


  我就在想什麼時候會有人注意到這件事...

  (“ I was wondering when people might start noticing…”)






  這則推文算是證實了目前上映中的電影有數個版本，reddit上有人整理了目前已知有不同版本的橋段，但尚不知道這是不是全部，也不知道電影實際上有幾個版本，以及版本出現的規則為何。






  ——————————————————


  我自己在米蓋爾和萊拉那段是看到萊拉用手指米蓋爾的版本，要不是在刷推特新聞，還真的不知道有這種事情。


  不知道台灣有沒有人看到的是自拍的版本？


  而且這種用心程度，太誇張了吧...




  -----

  Sent from JPTT on my iPhone


  --'
