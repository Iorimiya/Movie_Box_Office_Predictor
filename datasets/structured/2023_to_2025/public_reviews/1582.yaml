url: https://www.ptt.cc/bbs/movie/M.1686980093.A.4F3.html
title: '[大負無雷] 《蜘蛛人穿越新宇宙》為什麼這麼好'
content: '原本說好不上PTT了，結果氣到跑上來發心得文

  是我超級情弱，對不起



  這部無疑是今年最棒的超級英雄電影

  畢竟動畫的表現可以超越很多真人所無法呈現的地方(索尼你乖乖做動畫吧)

  包含各種蜘蛛人會遭遇到的議題(對，就是大家知道的……班叔之類的

  而且這些議題都描述的很不錯，尤其是引發カノン(我不知道中文翻成什麼，總之就是選擇

  救一人或是救全世界)，很多時候都陷

  入極致二選一的狀況，讓觀眾同樣跟著感到緊張刺激


  整場毫無冷點，表現手法超出第一集

  完全沒有續集會出現的那些問題

  (也要感謝奇異博士幫忙打開了多元宇宙)

  讓這次的題材更加多元

  而且故事龐大性超乎想像

  規模之大可以說是超出漫威至今的電影也說不定

  但談論的議題之細緻，也可能超乎許多作品

  IMAX觀影體驗簡直是好到不能再好



  但是看到後面我越來越覺得不對勁

  這是一名死宅長年下來的預感

  越想越不對勁

  「你，該不會，要つづく(下集待續)了吧？」

  沒錯

  這個預感是真的

  沒有白費長年累積的死宅經驗


  ！！！

  ！！！

  可惡！！！

  你這樣吊人胃口好玩嗎！！！

  好像很好玩是吧！！！

  可惡啊！！！

  為什麼要斷在那麼緊張刺激精彩絕倫整場最高潮的地方！！！


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --




  氣死啊氣死

  沒有，我沒有寫出內容，只寫出斷的很可惡

  比無限之戰還好看(

  其實有事先說，只是很少人知道，像我就是

  對啊，嗨呀

  因為他比無限之戰好看，斷的地方更是一絕

  我會一直在意到下週的




  你知道維基早就有下集的頁面了嗎


  2021年12月，洛德和米勒透露由於該片的故事過於龐大了，需要拆分成兩部電影

  啊，我這裡沒有'
