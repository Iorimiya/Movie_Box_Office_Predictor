title: 《蜘蛛人：穿越新宇宙》釋出最新預告影片拯救一人?抑或是拯救全宇宙
content: '《蜘蛛人：穿越新宇宙》釋出最新預告影片 拯救一人？抑或是拯救全宇宙


  （GNN 記者 Akito 報導） 2023-04-04 15:49:32


  《蜘蛛人》系列動畫電影《蜘蛛人：新宇宙》，其續作電影《蜘蛛人：穿越新宇宙

  （SPIDER-MAN: ACROSS THE SPIDER-VERSE）》今（4）日公開了最新預告影片。




  在《蜘蛛人：穿越新宇宙》中，三代蜘蛛人陶比麥奎爾、安德魯加菲爾德與湯姆霍蘭德再

  度登場，而除了他們之外，來自不同多重宇宙的蜘蛛人大軍也同步在本次的電影集合。前

  作中來自 1610 號地球的主角邁爾斯，在這集中發現一樁驚人的秘密，導致他必須在維護

  世界平衡和犧牲自己所愛的人之中做出抉擇，拯救一個人還是拯救每一個宇宙？蜘蛛人世

  界的內戰一觸即發。




  預告裏面邁爾斯首次見識到來自不同宇宙的龐大蜘蛛人團隊，各種蜘蛛人配備著不一樣的

  坐騎或道具，包括懷胎 5 個月卻還騎著重機的女蜘蛛人潔西卡德魯，以及留著龐克頭手

  持電吉他的龐克蜘蛛人。而在前作中來自另一個宇宙的好夥伴彼得帕克，但這次彼得升格

  成為人父，多了一個 8 個月大的小跟班梅黛，可愛的梅黛也將跟著爸爸一起加入拯救世

  界的行動。




  作為這支蜘蛛人特攻隊的領袖，綽號 2099 蜘蛛人的米蓋爾歐哈拉，拒絕邁爾斯加入蜘蛛

  人聯盟，並且讓邁爾斯知道成為蜘蛛人所必須承擔的犧牲。但是出乎他意料之外，邁爾斯

  已經受夠了活在大家為他鋪好的人生道路，決定要創造自己的未來。




  《蜘蛛人：穿越新宇宙》目前預定 6 月 21 日在臺上映。








  #蜘蛛人


  巴哈姆特


  --'
