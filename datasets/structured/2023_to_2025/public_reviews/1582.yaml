title: '[討論] 蜘蛛人-穿越新宇宙（雷）'
content: '多重宇宙的問題，以下有雷




  雷








  雷







  雷













  因為看了上面那篇蜘蛛人跟閃電俠的比較，都是關於紐帶的討論，但就會想到蜘蛛人一個

  問題不知道是不是bug


  Miguel在這邊如此執著說要遵守多重宇宙的秩序是因

  為他試過改變其他宇宙，但那個宇宙後來毀滅了，可是這完全是Miguel個人的問題吧？


  他去找一個自己存在但自己沒變蜘蛛人後來死掉的宇宙，代替死掉的他自己，就是闖入其

  他宇宙想改變其他宇宙的行為啊，然後現在再說不能改變什麼的因為宇宙會毀滅，這從根

  本上就錯了吧？


  邁爾斯只是想改變自己宇宙的事而已啊，真的會毀滅嗎？而且印度蜘蛛人宇宙也是在邁爾

  斯救下來警長的時候橋底下有個大洞，但也不是Miguel 回憶中那種類似薩諾斯彈指消散

  掉的毀滅方式，所以會不會其實根本救人根本沒事？


  還是有什麼我沒看到的內容，還請各位幫我解個惑謝謝




  手機排版有點亂請見諒

  --

  對，目前看起來就是這樣，其實邁爾斯一直很想跟Miguel 解釋斑點的存在或是危險性，

  但對方理都不理他


  說實在，你如果要維護多重宇宙的世界，今天來了一個反派是有能力穿越多重宇宙搗亂多

  重宇宙秩序，把一堆宇宙毀滅的，跟一個正派的蜘蛛人只是想救他老爸但卻可能因此毀滅

  一個宇宙的，這有點腦都知道孰先孰後吧？'
