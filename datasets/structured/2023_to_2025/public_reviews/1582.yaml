url: https://www.ptt.cc/bbs/movie/M.1686322397.A.FFA.html
title: '[好雷] 《蜘蛛人：穿越新宇宙》二次穿越的精彩'
content: '蜘蛛人齊打交，平行宇宙二部曲開戰


  這時代超級英雄電影代表漫威，除了漸漸展開自己下一個故事規模外，也漸漸的將自己其

  下漫畫英雄搬上螢幕，但過去低潮賣出去的人物，如今要收回還是有些困難，尤其當這角

  色又頗有人氣，知名英雄蜘蛛人正是這樣的存在，索尼也在幾次蜘蛛電影的成功，更有想

  法如何打造這位超級英雄的世界觀，而2018年推出的全新動畫《蜘蛛人：新宇宙》獲得高

  達八8、9成的好評。


  延續前作高人氣，續作《蜘蛛人：穿越新宇宙》，繼續深化蜘蛛宇宙的概念，將整體的世

  界觀擴展開來。


  邁爾斯成為他時空的蜘蛛人後，在追捕反派斑點人時，竟看見昔日的戰友女蜘蛛人關來探

  望他，並且知道了蜘蛛人聯盟的存在。進入其中的邁爾斯對各處的蜘蛛人群聚充滿新鮮感

  ，但也意識到自己將經歷不可逆的未來世界線。






  《蜘蛛人：穿越新宇宙》是什麼電影？


  2021年真人版英雄電影《蜘蛛人：無家日》迎來新代蜘蛛人冒險旅途的一個成長的終點，

  除了打造出符合現代世代與新觀點的蜘蛛人英雄，同時也給成長過後經歷了許多抉擇與苦

  難的蜘蛛人，理解自己背負「英雄之名」的沈重感和責任。


  當選擇了不平凡就得承擔這點所帶來的能力與悲痛。「能力越大責任越大。」也成了蜘蛛

  人每一世代的經典語錄，且對應著他的英雄之道。


  對於美式英雄漫畫迷，或從改編電影最開始就看到現今的讀者影迷來說，蜘蛛人的故事是

  再熟悉不過的，尤其當蜘蛛人周遭影響他成長和心裡波動的經典人物和反派出現，也讓我

  們期待導演或漫畫團隊打算怎麼讓他筆下「這個世界」的蜘蛛人說出不同故事，同時對應

  著蜘蛛人本傳所傳達的觀點，而當新生代的蜘蛛人帶著不同觀念加入這個大家庭時，又會

  是什麼樣的超展開？









  《蜘蛛人：穿越新宇宙》是延續前作《蜘蛛人：新宇宙》的二部曲作品，同時也是蜘蛛宇

  宙世界觀的重要作品，除了彙整各種經典的再創蜘蛛人外，也以2011年的《終極蜘蛛人》

  的故事線去做修改，成為2018年所構成的版本。


  二部曲更加深邁爾斯認識自己背負蜘蛛人名號、能力等關係，且也延續如蜘蛛網般蔓延出

  去的各個宇宙蜘蛛人的平行世界觀，並讓新舊人物彼此之間的碰撞又更加深刻，還有更大

  型的世界危機。


  邁爾斯在自己的世界成為蜘蛛人兩年間，一直用自己的方式去守護和平，但同時青少年的

  他也有各種學業、家庭、感情的問題需要解決。在這時過去互有情愫的女蜘蛛人關竟然穿

  越空間到了他的世界線來探望他。但邁爾斯總覺得關好像隱藏了什麼秘密未說出口，就在

  找尋關隱藏的秘密時，邁爾斯竟然誤闖了別的世界線的任務，並且也來到了各處蜘蛛人聚

  集一起的「蜘蛛人聯盟」總部。










  《蜘蛛人：穿越新宇宙》分析與延伸：


  從2018年《蜘蛛人：新宇宙》除了劇情之外，動畫的美術設計就讓許多超級英雄迷印象深

  刻，充滿街頭風格的普普塗鴉，還夾帶著嘻哈風情與黑人藝術運動，尤其主角一身蜘蛛裝

  扮卻搭配街頭服飾風格，在歷代搬上大螢幕的英雄裡也是相當附有創意。


  2023年的續作則是加上了更多國際化的元素，例如女蜘蛛人關的世界線以法國印象派風格

  為主題、帕維特則是印度風情與傳統東方文化呈現、米蓋爾則是未來派，一種十九世紀空

  想未來，影響後續許多設計師風格的經典流派的設計元素，讓人相當驚豔。


  這也是目前最多蜘蛛人同時出場的動畫電影，共有240位蜘蛛英雄，不同風格、不同世界

  的平行時空亂鬥，這也讓人眼花撩亂，讓人有在看日本經典特攝《戰隊系列》、《假面騎

  士系列》一年一度大團結電影版的錯覺。也因為如此裡面的動作戲和每個蜘蛛人的特色都

  動員許多動畫師去微調和描繪，試圖做出差異點，並且延續多元這個概念，將美術設計也

  變成多元的藝術宇宙。








  這次的世界觀雖然擴大，但基本動畫還是沒有脫離蜘蛛人的核心價值。蜘蛛人的賣點一直

  以來都是一個青少年如何兼顧自己英雄與凡人兩邊的身份，在學習打擊犯罪時，也得學會

  如何與周遭人不管是情人」家人」朋友的相處，找到這兩者間的平衡點。


  不過這次《蜘蛛人：穿越新宇宙》似乎想在經典故事之中，挑戰一直以來蜘蛛人不可逆的

  部分，我想這點也會一直延續到動畫第三部曲的核心，並在多元宇宙下，可以預想到故事

  高潮迭起。


  目前根據索尼官方動畫部門公佈的資料，《蜘蛛人：新宇宙》動畫系列，感情重點會放在

  邁爾斯和關之間的曖昧情愫上，並從第一階段就開使鋪成兩人的關係，並且目前根據最新

  網路透露的訊息，後續的第三部曲可能會以邁爾斯線和女蜘蛛人關兩邊雙向發展交會，並

  且可能會有以關的角度為核心的看法，不過目前尚未有直接證實這個說法，如果可行那可

  能是大螢幕上第一次以女性蜘蛛人為核心的延伸動畫電影。

  圖片









  《蜘蛛人：穿越新宇宙》值得一看嗎？


  這次蜘蛛人動畫電影二部曲，原則承襲了上一次緊張刺激的風格，並且這次擴大了事件發

  生所帶來的影響不只有一個宇宙，而是多重宇宙都會遭殃。


  並且可以看到邁爾斯和關兩位蜘蛛人各自的心裡成長，並且從第一部一直延續到現在的兩

  人曖昧，還有在劇本上對於傳統蜘蛛人成長故事做出質疑，這點是動畫裡有趣的地方，並

  且也是後續令人期待的一部分，也同時帶出「是否真能逆轉命運？」


  因為角色眾多，這次《蜘蛛人：穿越新宇宙》值得讚許的是透過藝術風格來分類蜘蛛人的

  平行宇宙這點，如邁爾斯嘻哈街頭普普風、關印象派描繪出光與物的風格、其他還有像是

  反派的世界觀也是有各種不同風格、新藝術、文藝復興、未來派、龐克、美式、日式風格

  等，我覺得這是這次電影最有意思的地方。










  不過這次鋪成一些故事，與反派正派之間有何理念，各種解說的文戲較為沈重，雖然多了

  龐大事件的厚重感，但也沒有第一部故事那種爽快戰鬥的感覺，又因為出場的蜘蛛人實在

  太多，有些畫面會讓人眼花撩亂，在觀看大螢幕一瞬間色彩繽紛的各式英雄爆出，總讓人

  難以聚焦，這時候就還好邁爾斯和關兩人剛好一黑一白，讓眼睛可以迅速補抓到兩人的動

  態。


  雖然有觀眾認為上一部主角看似有所成長，但為何這次還是有點長不大。我則是覺得這種

  半成熟或不想對世界妥協的性格，很符合一個青年所有的樣子。邁爾斯雖然想當一個英雄

  ，但卻無發兼顧好自己的人生和蜘蛛人的身份，在關的到來、其他蜘蛛人的出現，讓他更

  加混亂，但也更加堅信自己的信念。


  我認為打破既定的社會框架是每個年輕人的特質，而蜘蛛人不管哪一代，都努力的拯救他

  人也救贖自己。而或許在這多元世界中，能突破框架的恰巧就是在另個宇宙的他也說不定

  。


  --

  個人Blog：

  小說連載頁：


