content: '結尾

  Miles來到一個不屬於他的宇宙

  遇到那個宇宙的父母

  但那個父母似乎就見過Gwen了

  所以這表示她也見過這個宇宙的Miles了嗎？


  另外在原宇宙 壁畫對映著是死去的叔叔

  而結尾的宇宙壁畫是父親

  但問題是這宇宙父親還沒掛阿

  而且潛行者的Miles開頭問蜘蛛人 你爸還活著？

  先不說這個起手式很怪

  但聽起來很像他爸已經不在了

  還是我有漏掉什麼細節？


  ----

  Sent from  on my Samsung SM-A528B


