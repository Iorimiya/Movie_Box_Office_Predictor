url: https://www.ptt.cc/bbs/movie/M.1685893081.A.3CF.html
title: '[好雷] 蜘蛛人：穿越新宇宙'
content: '今天特地跑去看1+2聯映


  還是要說第一集重回IMAX真的是有夠過癮


  下定決心那邊的what’s up danger 真的是百看不膩


  今天特映有送兩張海報跟一張膠卷





  膠卷我沒拆開，但看樣式應該是這張




  最後再來張蜘蛛關以及兩人背影防雷







  這次第二集開場是以關的旁白開始並相當迅速的走完第一集的大綱


  隨後講了第二集大概會發生什麼事，並且都是自己造成的還傷害了邁爾斯


  講完後直接進場關的世界，關世界的美術風格我還蠻喜歡的（有種粉粉的繪畫風格）


  開頭交代了關因為與父親發生摩擦，因此蜘蛛人2099才讓關加入他的組織



  接著換到邁爾斯這邊，老樣子的蜘蛛人都會出現需要解決的問題


  家人間的溝通、學業以及打擊罪犯上蠟燭三頭燒


  這次的反派緊連著第一集的故事，關會來找邁爾斯也是這個緊連第一集的原因



  接著就是關來到邁爾斯的世界開始一連串的發展



  第二集這次相當好的做到承先啟後

  我覺得就算沒看過第一集也相當好帶入，但對角色情感應該會少很多



  劇情我不想透露太多，感覺講太多會喪失很多氛圍


  美術、音樂這些都跟第一集一樣相當頂，尤其是美術

  每個世界都有認真做出美術區隔


  結局的斷點會留下讓人相當緊張的心情，但也有讓人振奮的畫面


  第二集的劇情我認為相當棒，並且會讓你更喜歡關還有彼得這個角色



  好期待第三集宣佈上映的日期了


  最後關真的好正，已戀愛<3

  -----

  Sent from JPTT on my iPhone


  --




  你沒記錯，美術設定確實有不一樣

  我不像上面看到有看到42發現，但我看到美術風格不同就有發現好像跑錯世界了



  真假！！！想說還沒地方放先不拆開看，看來要來好好想一下要怎麼收藏拆開來了



  西語沒字幕真的蠻可惜的，雖然可以從互動上猜出個大概'
