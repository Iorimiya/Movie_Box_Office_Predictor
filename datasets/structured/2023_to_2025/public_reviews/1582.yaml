title: '[  雷] 蜘蛛人：穿越新宇宙'
content: "第一次體驗南紡威秀的imax\n不過只覺得比一般的大了一些些\n可能是美麗華看太多胃口被養大\n不過還是個不錯的體驗啦\n \n \n \n \n\
  \ \n \n \n \n \n防雷\n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n\
  \ \n \n \n \n \n \n \n \n \n \n \n \n五年前的我當時再幾個月就學測考大學了\n但老子就是不用功翹掉補習班去電影院晃\n然後看到了當時的新宇宙,當時就感到一陣新鮮感\n\
  畢竟真人電影都看過很多,但我從未看過蜘蛛人動畫\n（我漫威dc動畫完全沒看過有誰可以推薦嗎？\n所以就想說雖然是動畫但還是進場看看吧\n \n然後出來之後的想法大家應該也能猜到\n\
  以前也會多少覺得電影院看動畫是浪費錢\n從那以後我就幾乎沒了這種想法\n只能說時光飛逝到不行\n第一集我還是高中生,現在看第二集已經大學畢業了\n哭啊真的拖超久,第三集大概也會延期吧\n\
  但品質都有維持要我等我願意\n \n好了,至於ㄧ和二哪個比較神呢？我會說都很神\n但神的方向是明顯有差的！\n第一集的神是完整講完一個故事\n讓劇情完美的畫了一個完整的圓\n\
  又埋了多重宇宙這個弦外之音\n第二集的神是高度呈現多重宇宙的潛力\n那樣的失控加上瘋狂讓第二集陷入混亂\n但大部分觀眾不但不會感到問號,反而會聞雞起舞\n所以第二集將這個系列的野心引出來了\n\
  而且我覺得這個野心是很狂的（第三集就知道了\n開創一個新又大的格局還讓高評價維持\n你說有什麼這個系列戲內是還能出什麼事？\n \n但第二集真的是無可挑剔的神作嗎？\n\
  神作絕對有,但無可挑剔又言過其實了\n事實上神作還是很容易帶有瑕疵\n最大的問題在於節奏,這也是很多人提過\n我覺得最該精簡的是斑點人的部分\n他出現我都會有點煩躁\n\
  可以再縮短他跟邁爾斯的衝突\n至於部分人不喜歡的親情戲反而很重要\n是除了何謂蜘蛛人之外的一個核心價值\n擁有家庭或是有相關問題的人會看了超有感\n但我覺得每個人背景都不一樣,就見仁見智吧\n\
  \ \n整體上我還是比較喜歡第一集\n畢竟個人偏好輕鬆簡單的看完電影\n第二集的瘋狂旅程如果多來幾次可能也會太多\n但我還是很開心第二集的樣子\n看到幾百個蜘蛛人真心感到興奮\n\
  那個暴龍蜘蛛人希望還能再看到他\n目前第三集最讓我期待的應該是第一集夥伴的回歸吧\n第二集最後他們集結應該是這個意思吧？\n至於故事斷點是還可以但能更好\n以畫面來說能再斷更前面一點也沒關係\n\
  一些畫面當第三集開頭也很不賴\n但這算是瑕不掩瑜啦,我比較驚訝一堆人不知道會斷\n怎麼大家當初都沒注意看完預告XD\n先導預告最後不就寫著大大的part one了嗎？\n\
  \ \n \n雖然大家很慾求不滿的想趕快看第三集\n但我更想看到這個系列維持高水準的隆重結束\n所以要等多久我都願意\n而且真的辛苦動畫師們了,前面才有一篇說到\n\
  能讓這些屌炸天的畫面出世,他們真的很優秀\n真心覺得所有蜘蛛人真人電影加起來也望塵莫及\n這系列就是如此高不可攀的標竿\n希望大家都很喜歡,不喜歡的朋友也沒關係\n\
  不一定適合也可以多看別的東西,自己有開心就好\n那麼就開始瘋狂期待超越新宇宙的出現吧！\n----\nSent from on my iPhone 14 Pro\
  \ Max\n \n--\n萊斯特在最後敘述中講述了生活中有意義的經驗，他說，儘管他死了，他還是很高興，因\n為這世界上有這麼多的美\n \n--"
