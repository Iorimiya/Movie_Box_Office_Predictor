url: https://www.ptt.cc/bbs/movie/M.1685584702.A.716.html
title: '[ 極好雷] 蜘蛛人：穿越新宇宙 超越前作的續作'
content: '雷文防雷資訊頁


  小弟我人在法國，上映第一時間就搶了英語場的票（法國幾乎都是法配場）與同學一起晚

  上


  因為是第一次發文如錯誤或違反版規歡迎指正



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~










  我會就自己的想法來分享電影的優缺點和我個人推薦的原因，可能會有些微的劇透


  缺點：

  1.動作戲很多且讓人產生視覺疲勞

  蜘蛛人的動作往往都十分迅速、華麗

  加上豐富的運鏡與不同視覺風格的切換，以及時不時的Glitch 特效都會造成眼睛容易疲

  勞?


  這個缺點是我自己的想法，當然不是什麼大問題

  我依然很享受很多動作戲帶來的衝擊


  優點

  1.人物豐富的情感表達

  整部著重在家人的情感，從關與父親與邁爾斯與父母的關係因為英雄的身份而產生衝突，

  帶


  2.深得人心的角色設計與多樣性

  這次集結了非常多的蜘蛛人，且每一位的個性鮮明但不搶戲，且每位蜘蛛人的材質風格都

  不


  3.巨量的蜘蛛人相關彩蛋

  不管是遊戲、動畫、真人電影都有許多粉絲會喜愛的彩蛋，許多過往的角色都會以不同的

  形



  最後我想聊聊我推薦這部電影的原因

  首先這部的動作十分精彩，很多意想不到的換裝方式和運鏡都是真人電影看不到的，特效

  方

  粉絲，已經很久沒看到如此精彩的超級英雄電影和完整的核心理念了，除了最近好評的星

  際


  題外話

  小弟我也是動畫領域，我最近來學校教課的老師就是索尼的動畫師，剛完成蜘蛛人從加拿

  大

  這個動畫水準真的沒話說，不管是Timing 還是Pose都是頂尖水準無話可說，我最吃驚的

  還?

  我也就預定了星期五的電影，準備二刷

  也希望各位上映後，可以找個時間進場支持






  -----

  Sent from JPTT on my Samsung SM-S9060.


  --'
