url: https://www.ptt.cc/bbs/movie/M.1687845986.A.89F.html
title: '[普雷] 穿越新宇宙'
content: '如標題普雷原本想給好雷

  但在我沒被雷到2是沒結局要等3的前提下只能給普雷

  因為對我來說

  一部電影就是要有完整性

  而不是觀賞到一半跳出下集待續

  連個結局都沒有 這是電影不是連戲劇影集

  這幾年好多部都走這種風格

  讓我越來越想等串流就好 反正也看不到結局 根本不急


  回歸正題 這部電影只能說真的有“超越“新宇宙

  但是唯一不足的地方應該是音樂的部分

  沒有很記憶點超深刻的歌曲流行樂節奏

  只有某些時刻的bgm蠻不錯的

  這次感覺重點都放在蜘蛛人上

  上千隻蜘蛛人每隻都很有自己的特色

  但看到後面很容易審美疲勞

  有歡樂有很感動激勵人心橋段（我看的那場一堆人在哭

  但是結局斷在很哭爸的地方 感覺明明可以做完一個橋段的

  但是硬要放在下一集


  滿分10分給8.5

  那1.5給結局斷的地方



  -----

  Sent from JPTT on my iPhone


  --'
date: 2023-06-27
