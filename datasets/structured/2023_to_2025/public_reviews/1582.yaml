url: https://www.ptt.cc/bbs/movie/M.1685799458.A.936.html
title: '[好無雷] 蜘蛛人：穿越新宇宙'
content: '我文筆不好,想到什麼就寫什麼:



  有簡單介紹劇情,所以沒看第一集也能看


  整片兩小時多,前段敍事較慢家庭戲多但笑點多彩蛋多沒有冷場


  時間很快就過去了


  後段打好打滿視覺非常滿足.甚至有點疲勞


  主線有起承轉合,除了最大的難題和最後的爆點之外都有跑完



  還有,我在看電影前只有看那個三十秒的預告,


  不知道還有第三集,所以快到結尾的時候還在疑惑怎麼收


  看到待續當下有點傻眼但不是很意外


  我明白很多人不喜歡一套電影分成兩集,


  但看完當下覺得資訊量很足很飽的感覺


  (相比之下像"沙丘"就有一種"這就完了?"的感覺)


  比起不滿,更多是期待下一集


  就是那種一定要在電影院看 看完不會後悔的甚至想多刷的好電影




  喔對了 我超愛這隻蜘蛛人,上面有評論說沒有魅力,我有點黑人問號




  --'
