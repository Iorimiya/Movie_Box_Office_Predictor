title: '[ 好雷] 蜘蛛人穿越新宇宙'
content: '安安，我口國社畜肥宅啦




  之前看新宇宙的時候就深深愛上整部電影的動畫風格，還有音樂也都很好聽，我一直到現

  在還是偶爾會聽一下sunflower，只能說posty太神了…






  最近廣告打超兇，人在對岸，就想說應該也是21號上映吧，結果昨天早上就心血來潮查了

  一下上映日期，結果發現這邊6/2就上映了..立馬附近影城的票，晚上直接衝一波








  影廳蠻小的，有點後悔，這種等級的片至少imax才能爽到，因為畫風真的很漂亮，跟第一

  集比絕對不輸..






  防雷




  防雷




  防雷








  看的當下就感覺畫風好像更細膩一些，而且整部電影都把不同宇宙風格的蜘蛛人做了一個

  很強烈的對比，從一開始關宇宙的水彩刷，調色就很少女，然後用顏色來刻畫關跟警長老

  爸的心境上的差異，後面和好前的陰鬱，和好後的情緒都可以從色彩的轉換看出來。

  看完之後還去查關的配音是誰，結果竟然是鷹眼少女，被圈粉了…


  老Peter Parker 出來狂曬娃也超好笑，讓我想到公司的主管，上次打球也是瘋狂曬他小

  孩，根本一摸一樣笑死


  然後超愛hoby，用雜誌簡報拼貼出來的角色，連後面他留給關的自製的（？手環創造出來

  的傳送門效果也是用一樣的風格，超酷！




  整部電影最浪漫的場景肯定是邁爾斯跟關一起倒坐在那是帝國大廈嗎（？看紐約市景的畫

  面，很可惜的是我的影廳超小，但你各位有機會的話絕對要看大螢幕，絕對不會後悔






  然後令人驚喜的是有感覺蜘蛛人在幹大事了，因為裡面有真人角色，一開始關的劇情也有

  提到奇異博士，而且反派因為有穿越多重宇宙的能力，竟然也有跳到真人世界跟人對話，

  印象中應該是猛毒裡面那個阿姨，阿姨看到這個漫畫角色完全沒嚇到蠻好笑的XD，而且蜘

  蛛人無家日的彩蛋就有放猛毒線索了，如果是想全部串在一起，感覺超有看頭，超期待！

  ！




  有趣小插曲，這次的多重宇宙還有樂高世界，是一個未成年人創作的，好像是因為之前第

  一集新宇宙的時候他在家自己創作一些用樂高重現的場景跟特效被導演二人發現，然後就

  把他找來創作這個景的，一開始還以為只是大反派不小心闖進的場景，結果才發現結果裡

  面還有樂高版的蜘蛛人，好可愛




  我有找到他創作的第二集的預告，有興趣的可以看一下




  未成年做成這樣真的很屌




  昨天看完之後狂看演員的訪談，才發現Oscar issac是飾演大反派，月光騎士第二季快出

  好嗎..

  老Peter是貼背戰裡面其中一個演員飾演的




  總之，這部絕對是神作，喜歡第一集的如果你很期待第二集，看了絕對不會後悔！！




  --

  我感覺明明看過他但沒印象是誰

  幹真的…太神了

  我覺得有點像Childish Gambino

  這真的不是電影了，是藝術，太誇張'
