title: '[極好無雷]蜘蛛人：穿越新宇宙'
content: "電影板心得首Po，若哪裡有誤或觸犯到板規請讓我知道～\n \n我會盡量在不劇透任何東西的狀況下跟大家分享我的心得，當然如果完全不想被爆雷到任何\n\
  資訊的朋友請自己斟酌。\n \n還是以防萬一防個雷\n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n_\n\
  \ \n小弟有幸能在加拿大先看到這部電影。\n \n我看的是一般版所以IMAX的表現如何我不知道。\n \n雖然片長136分鐘但體感完全不這麼覺得，很過癮。\n\
  \ \n我自己認為有超越第一集，視覺效果做的更滿更華麗了，但又不會感覺到太雜亂。\n每個宇宙都有自己的藝術風格，混雜起來就像一幅大型藝術品。\n \n順帶一提我很喜歡這種複合媒材的作品。\n\
  就像歪小子史考特、阿甘妙世界…等等，處理的好的話畫面就不會很衝突又很好看！\n \n人物彼此間的關係處理的很細膩。\n不只是邁爾斯，會感受到每個角色都有自己的難題和情緒，讓我覺得這些角色有活生生的感\n\
  覺。\n再搭配上背景視覺效果的配合，很容易就會被銀幕前的角色感動到。\n \n笑點和細節超多，我看的這場大家都在笑。\n尤其如果是蜘蛛人系列的粉絲一定會被很多小彩蛋和小細節逗樂。\n\
  \ \n配樂、插入曲讚到爆。\n至少是我會想加到歌單重複聽的音樂。\n謝謝Metro Boomin.\n \n關於動作和打戲。\n看到很多蜘蛛人在亂跑亂跳打來打去，就邊想這個要多少動畫師才有辦法處理這種東西，佩\n\
  服。\n打戲則是非常過癮，忘記第一集打戲怎麼樣了，但這部打戲我看得很爽。\n \n最後想說畢竟是part 1，結尾斷在很精彩的地方真的是蠻掃興的。\n不過大家也不用擔心因為他是part\
  \ 1就沒有起承轉合，故事架構還算是蠻完整的。\n \n-結語\n \n關於故事還有好多東西想講，但礙於無雷我就在這打住。\n \n總結來說我會推薦去電影院看，看他的視覺效果、soundtrack、左右聲道細節。\n\
  如果在家看推薦戴耳機或至少有左右聲道喇叭。\n \n有任何勘誤或想補充的歡迎請推文告知我～\n \n--\n \n東映的話沒有印象有看到，不然就是我漏看了。"
