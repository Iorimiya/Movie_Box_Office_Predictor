title: '[無雷] 蜘蛛人：穿越新宇宙'
content: '簡單流水帳心得


  --


  作畫、彩蛋、各種設定、整體規模比起第一集，感覺又高了一個檔次。


  整集被塞的滿滿滿，不斷的被各種絢麗的大場面視覺轟炸，

  但覺得太多東西太多角色，劇情反而顯得太雜太亂...

  不像第一集每個角色都刻劃深刻且極具個人特色。


  但也可能是為了鋪陳必須的犧牲(?)

  又或者是因為連看了一跟二，不知道單獨觀看會不會有其他心得？

  四個多小時看到後面實在有點恍惚了...


  整體老實說還是比較喜歡第一集，但二的水準是頂中之頂無庸置疑。



  (題外話 真的覺得看過真人蜘蛛人系列，會有感很多。

  一些前作提過的東西雖然沒看過也不影響理解，但在這部分感受到滿滿用心，

  那些補充的背景故事和精美到讓人眼睛一亮的細節，就這樣略過實在可惜。


  --'
