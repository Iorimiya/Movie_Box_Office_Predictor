url: https://www.ptt.cc/bbs/movie/M.1688496088.A.AD1.html
title: '[新聞] 《蜘蛛人：穿越新宇宙》票房破新紀錄！'
content: '《蜘蛛人：穿越新宇宙》票房破新紀錄！打破索尼動畫電影歷史上最高紀錄




  索尼影業取得了一個巨大的成功，因為《》剛剛創造了票房新紀錄。


  在6月票房回報中，這部驚人的續集開場週末獲得了1.2億美元的驚人票房，並持續取得成

  功，壓倒了同時期上映的DCEU電影《》。


  這部令人驚嘆的續集已經超越了2018年的《》，該片在評論界取得了巨大

  成功，但全球票房僅為3.755億美元，證明了索尼對如何使這個宇宙取得成功的理解。




  《》全球票房突破6億美元，打破了索尼影業動畫電影歷史上的最高

  票房紀錄。


  截至目前，《》全球總票房達到6.07億美元，超越了索尼影業之前的

  票房紀錄保持者《》，藍色小精靈的票房為5.63億美元。


  索尼動畫片的前20部票房最高作品包括多部《鬼馬小精靈》系列、《食破天驚》、《藍精

  靈》等家庭電影，以下是《The Numbers》列出的數據：


  1.《》- 6.07億美元（仍在影院上映中）


  2.《》- 5.63億美元


  3.《鬼馬小精靈3：相見歡》- 5.27億美元


  4.《鬼馬小精靈2》- 4.69億美元


  5.《鬼馬小精靈》- 3.78億美元


  6.《》- 3.75億美元


  7.《》- 3.48億美元


  8.《比得兔》- 3.46億美元


  9.《食破天驚2》- 2.74億美元


  10.《食破天驚》- 2.36億美元


  11.《表情符號電影》- 2.16億美元


  12.《》- 1.97億美元


  13.《打獵季節》- 1.91億美元


  14.《怪物遊戲》- 1.58億美元


  15.《憤怒鳥玩電影2：冰的啦！》- 1.52億美元


  16.《比得兔兔》- 1.5億美元


  17.《聖誕快遞3D》- 1.47億美元


  18.《海賊天團3D》- 1.36億美元


  19.《怪物遊戲2：妖獸讚》- 9300萬美元


  20.《聖誕星》- 6200萬美元


  進一步說明，雖然《》的票房非常驚人，但它尚未超越任何一部真人

  版《》電影，它的票房還落後於2014年的《》約1億美

  元。


  根據類似（雖然較小規模）的趨勢，與MCU的《蜘蛛人：返校日》三部曲相似，《》有望成為這個系列最成功的作品。


  按照這個邏輯，《返校日》在全球獲得了8.783億美元的票房，接著是《離家日》的11億

  美元，以及史上最佳的的《無家日》。




  在這個動畫《》系列中，最大的突破是在《》和《》之間，這意味著當《》於2024年上映時，觀眾可能不應該期待

  同樣的飛躍。


  然而，公平地預測它將獲得比《》更高的票房，尤其是在影迷們仍在

  討論一個月之後的懸疑結局之後。


  如果《》未能達到7億美元的票房，敬請期待《蜘蛛人：超越新宇宙

  》成為首部在票房上超越索尼影業真人版作品的動畫蜘蛛人電影。


  《》正在全球熱映中。



  新聞網址：





  --'
