content: '防雷



  防雷



  防雷



  防雷



  防雷







  先說缺點：

  畫面閃爍超高XD感官有點太刺激

  尤其是龐克蜘蛛出來 超大色塊變來變去

  眼睛快受不了 嗚嗚

  可能是座太中間排(巨城IMAX3廳G排

  自認H、I、J排可能更適合

  畫面比較能盡收眼底




  劇情方面，前面一個小時大致上就是預告片的內容，主要講關和邁爾斯的前情提要之類的


  然後他每一段開始都放一本美漫的封面

  不知道是不是原作的真實封面就長這樣


  後面我自己是完全沒猜到

  大反派竟是我自己QQ!!

  我一直以為是斑點人操控了邁爾斯的宇宙


  劇情相比之下我覺得比漫威無家日好太多了

  這完全才是我們想像多重宇宙蜘蛛人的樣子


  其中真人客串有Childish Gambino和加菲蜘蛛人(應該沒看錯？


  然後竟然還有下集！！！

  太SHOCK了

  已經下訂二刷要坐後面一點了QQ


  --

  靠我以為是同一人欸 臉盲 嗚嗚嗚'
