url: https://www.ptt.cc/bbs/movie/M.1687672008.A.077.html
title: '[好雷] 蜘蛛人穿越新宇宙-關於成長的故事'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~







  這部戲開頭的視覺表現就十分震撼，光各種蜘蛛人的擺盪戰鬥嘴砲就值回票價了




  最令人驚訝的反而是這部的文戲，這部的文戲是近十年來數一數二好的表演



  這部腳色有著各自的煩惱


  邁爾斯對於蜘蛛人跟兒子身分的分身乏術，

  關史黛西對於害死蜥蜴人彼得的內疚跟被老爸抓捕，對於她的英雄事業的不認可

  導致的孤獨感


  邁爾斯父母對於青春期兒子的教養問題

  喬治史黛西身為鰥夫對於青春期女兒的相處問題



  這麼多線故事能處理的好真的很厲害



  尤其是邁爾斯媽在屋頂上面，從不了解到妥協，再到放手讓兒子去飛的那段

  堪稱近年家庭文戲的經典


  關的成長從不敢面對自己誤殺蜥蜴人彼得，害怕說實話老爸會對他失望，再到

  跟老爸開誠布公和解，這個角色就立體了起來



  這部關史黛西的戲分跟成長明顯比邁爾斯多，原來是女主電影!!



  結論: 戰鬥畫面精彩，文戲更是不分軒輊唯一缺點就是故事沒講完





  　




  --




  --'
