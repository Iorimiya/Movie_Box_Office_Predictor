url: https://www.ptt.cc/bbs/movie/M.1688357326.A.64E.html
title: '[討論] 蜘蛛人:穿越新宇宙 後續發展猜測'
content: '話說第一部新宇宙是在串流平台看了

  看完後發誓如果有續集一定要進電影院看

  這次看完真的覺得不虛此行



  討論後續發展，有蜘蛛人所有電影的雷

  防雷















  從電影中可以了解蜘蛛人正史在不受干擾的情況下

  每位蜘蛛人接觸過犧牲與創傷，讓蜘蛛人知道自己的不足

  而後有所成長



  如果一次不夠就會狠狠給你第二次



  蜘蛛人的劇情普遍都有這樣的狀況


  陶比版:班叔>哈利

  加菲版:班叔>關

  荷蘭版:班叔>梅嬸


  2099也說了大部分蜘蛛人也是經過:班叔>大隊長 才認知成長

  (然後我在電影院偷吐槽班叔的屍體真的爛大街XD)



  現在根據2099的推測

  邁爾斯在正史的循環下除了叔叔之外還需要大隊長爸爸的死

  宇宙才不會崩壞(邁爾斯才會成長)



  現在好奇這部分到底要怎麼收才不會收爛？



  我可以理解邁爾斯現在還只是15歲的小屁孩

  正史的架構是要讓它死了老爸才會有所體悟成長

  但這次這個輪迴勢必要被打破，取而代之要用什麼樣的犧牲才可以度過這一關呢？

  就算救了老爸，會不會還是得要死別人(老媽？)

  這樣不就違反自己想拯救所有人的初衷了嗎？

  但如果這段事件不夠銘心刻骨，那又不足以讓蜘蛛人成長(騙過正史)




  我自己推測

  成長不一定會死人

  像是奶爸彼得除了班叔之死，與MJ的情傷就是他的難關(第一集)

  如果轉這方向會不會下一集用與邁爾斯與女蜘蛛關之間來度這難關？

  像是關自我犧牲在邁爾斯面前死去，但實際上失去記憶回到自己的宇宙

  幾年後與邁爾斯再度重逢記憶恢復

  (我知道這很狗血，也還好我不是編劇只能想到這麼狗血的劇情)




  大家覺得這部分會怎麼收？










  --

  子彈還在飛


  Tony叔'
