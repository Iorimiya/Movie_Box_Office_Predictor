title: 'Re: [選片] 閃電俠VS蜘蛛人穿越新宇宙'
content: '當然是都看呀


  閃電俠先上映

  看評價 似乎是不必特別挑螢幕

  所以上週五就就近隨意買了票看


  閃電俠屬於可以無腦輕鬆進場 開心看完的

  大概80分


  蜘蛛人是因為看過第一集 覺得很好

  知道要挑螢幕看

  剛好週二生日 就挑了週三的松仁titan廳看首映


  蜘蛛人就是要聚精會神看 光是畫面就來不及欣賞了

  而且資訊量龐大

  配樂 音效 漫畫式2D與3D柔和的動態畫風

  加上劇情飽滿 角色刻劃也ok

  整體90分起跳



  畢竟都是平日 我也有儲值會員

  價格倒是還好 兩部不到六百

  也就一般人時薪2～3小時


  真正傷荷包的是接下來的兩部大片都要imax








  -----

  Sent from JPTT on my Samsung SM-G975F.


  --'
