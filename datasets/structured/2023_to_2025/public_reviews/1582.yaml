url: https://www.ptt.cc/bbs/movie/M.1687759461.A.D2C.html
title: '[ 好雷] 穿越新宇宙 當老闆好痛苦'
content: '看完整部印象最深的是米蓋爾那永遠都苦大仇深的表情，背影彷彿一座聖母峰壓在肩上，有一堆鳥事要處理，偏偏部下一堆特立獨行，B帕克女兒在米蓋爾苦瓜臉上爬真的笑死


  前作邁爾斯哭訴叔叔死了時，每個人都說我也是這段笑死，但沒想到續作竟然是以蜘蛛人的傷痛作為主題，看到加菲蛛抱著關真的是WOW 沒想到會看到這個


  不過看劇情多次修改的傳言確實能感受到這次劇情的節奏沒有前部好，許多劇情也有很大疑問，像是板上許多人討論的，邁爾斯被咬時就改變正史了，世界也沒崩壞，而且彼得帕克死關邁爾斯屁事，我可不記得他是因為邁爾斯扯後腿才被金霸王打死，然後不當大隊長不算修改正史？這麼簡單？

  這些只能等3回答了


  如果前部95這部我會給88，依然好看但確實沒前作精彩，可能是作為中段鋪陳的原罪，節奏不說劇情高潮點也沒有前部鮮明，包含音樂與畫面的結合我也覺得略輸前部


  例如前部中潛行者追擊邁爾斯配上那壓抑感極重的音樂，還有邁爾斯決心成為蜘蛛人從大樓躍下的激昂，以及最後跟彼得B帕克告別時感人的首尾呼應，穿越新宇宙我印象較深的反而是前段中關快崩潰時背景的大量塗塊色彩變化，以及關跟父親坦白時，關爸背景彷彿是一道要關上的門，但不得不提的優點是，本次有更多的蜘蛛人組合技，前部只有最後結尾時一點，荷蘭蛛3則是該死的幾乎沒有，相信新宇宙3會有更多多蛛combo


  本次美術依然驚人，謝謝美術組的肝


  最後龐克蛛真的帥，根本神機妙算，一登場馬上就看出邁爾斯喜歡關，還故意說關牙刷放在他家激邁爾斯，提醒邁爾斯逃脫外最後還偷偷留後手給關


  -----

  Sent from JPTT on my Asus ASUS_I01WD.


  --



  --'
