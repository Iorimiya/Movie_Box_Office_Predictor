  了吧？可能還略勝蝙蝠俠一籌（？


  為了某種大義要別人犧牲小我本身就是一種邪惡，管你要達成什麼偉大目的有什麼苦衷，當

  強迫別人犧牲就沒資格稱為正義英雄了，要犧牲怎麼不犧牲自己？


  你沒懂我的明白，人注定要死但到死前人生怎麼活應該是由我們自己決定的，如果連怎麼活

  都被天注定了，出生那天就等於死了，有什麼值得過的？


