url: https://www.ptt.cc/bbs/movie/M.1687345380.A.E3C.html
title: '[宇宙神作] 《蜘蛛人：穿越新宇宙》的絢麗萬花筒'
content: "圖文好讀：\n\n說個笑話，當年漫威快要破產時，把自己的超級英雄IP（的電影改編權）打包起來\n要賣給索尼，結果索尼呵呵兩聲，說他們只要蜘蛛人，不收垃圾。\n\
  \n不要看現在漫威被迪士尼收購後好像如日中天，英雄們各個如雷貫耳，就覺得索尼\n當年好像太高傲了。事實上是，漫威拍了十幾年、幾十部電影和影集，才敢把多元\n宇宙這題材搬出來拍；索尼自己呢？一看多元宇宙好像有搞頭，直接用「蜘蛛人」\n\
  這三個字就給拍了。這還不算他們正在搞的蜘蛛人反派宇宙呢。\n\n你算出幾個蜘蛛人呢？（《蜘蛛人：穿越新宇宙》國際版預告）\n\n光是蜘蛛人這IP，就有無限的故事、無限的可能性，這就是正港漫威一哥的通天威\n\
  能。難怪任憑迪士尼盡展神通，索尼不放手就是不放手，不管你開多少，我都開雙\n倍，看你多有錢。\n\n扯遠了。《蜘蛛人：穿越新宇宙》在前作的基礎上，更是極大的擴充了這個「蜘蛛\n\
  宇宙」的內含量，完全是顛覆了所有人的想像，蜘蛛橘貓？蜘蛛暴龍？蜘蛛車車？\n只有你想不到的，沒有蜘蛛宇宙不敢變出來的。\n\n更別說那更加發揚光大的極度絢麗又炫技的畫面，在這個全世界都要被大眼萌妹子\n\
  佔領的時代，《新宇宙》再一次讓美式畫風揚眉吐氣，那與日式ACG截然不同的鏡\n頭敘事邏輯和工法，絕對震撼眼球，大呼過癮。\n\n想要看蜘蛛人嗎？一次給你塞滿全畫面，看你能數到幾個；想要看更多的作品連動\n\
  嗎？彩蛋也是多多益善，只怕你反應不過來；想要更多的「蜘蛛女」關？她算是第\n二主角喔！還是想要日式大眼萌妹子？還記得前作的潘妮嗎？\n\n如果是對劇情有要求、又或是深愛蜘蛛人那「黑深殘起源故事」的硬核觀眾，那更\n\
  是太適合了：《新宇宙》劇情環環相扣，不僅回收了前作伏筆，還解答了蜘蛛宇宙\n、「為何班叔一定會死」的存在意義；到了劇情後半段，爆點是一個接一個，力道\n是越來越猛，你以為邁爾斯上集死了叔叔算慘了嗎？他還會更慘、慘無人道口牙！\n\
  \n唯一的小遺憾，就是沒看到「地獄的復仇者」吧．．．也許下一集？對了，這部只\n是上集，結局還沒出來呢！我也還是第一次知道，原來一個「未完待續」的電影，\n是可以這麼滿足、卻又這麼讓人無限期待的！\n\
  \n--\n你吐槽熱門漫畫一定會被人批評\n而當你咬牙花了個多小時引經據典旁徵博引\n一定又會飄來一句\n                 　　　　　　　　　\
  \ 　～　歡迎您～\n\n\n--"
