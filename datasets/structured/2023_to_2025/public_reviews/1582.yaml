url: https://www.ptt.cc/bbs/movie/M.1685971177.A.92A.html
title: '[新聞]打敗小美人魚！《蜘蛛人：穿越新宇宙》北美'
content: '打敗小美人魚！《蜘蛛人：穿越新宇宙》北美票房衝破37億　獲讚超越前作


  2023.06.05 19:27 臺北時間


  文｜熊景玉



  《蜘蛛人：穿越新宇宙》上映首週於北美開出1.21億美元票房，成為今年第二高成績。

  （索尼提供）


  「蜘蛛人」對打「小美人魚」，誰贏？動畫《蜘蛛人：穿越新宇宙》挾著上集好口碑加上

  這集影評給出的極高評價，在北美開片首日即以5,185萬美元（約新台幣16億元）創下今

  年以來所有電影票房最高的紀錄，首週末以1.21億美元（約新台幣37億元）輕鬆登上冠軍

  寶座，打敗上週才剛上映的《小美人魚》，同時也成為蜘蛛人系列中開片票房第三高的電

  影。


  《小美人魚》5月26日於北美上映，搭上4天連假首週末衝出1.18億美元（約新台幣36億元

  ），稍晚一週上映的《蜘蛛人：穿越新宇宙》在北美的首週末表現則開出1.21億美元（約

  新台幣37億元）佳績，險勝《小美人魚》，也成為今年第二高的成績，僅次於《超級瑪利

  歐兄弟電影版》，首日票房數字更是第一集的4倍以上。



  9.1分的成績，讓《蜘蛛人：穿越新宇宙》成為電影權威網站IMDb評價最高的超級英雄電

  影。（索尼提供）


  2018年的系列首部曲《蜘蛛人：新宇宙》票房逾3.8億美元（約新台幣117億元），還拿下

  了奧斯卡最佳動畫長片，在如此的高標準下，《穿越新宇宙》以9.1分成為電影權威網站

  IMDb評價最高的超級英雄電影，在爛番茄評價網上也獲得影評95%的新鮮度，以及觀眾96%

  的高評價；國際各媒體的評論分別給出評語：「完全超越看似無敵的前作」「DC和漫威應

  該學學這部電影如何講一個完美的多重宇宙故事」「耀眼的表現提醒我們超級英雄電影所

  能達到的高度」，無不大力稱讚該片。全台各大影城將在週三（7日）開賣預售，電影將

  於6月21日上映。




  更新時間｜2023.06.05 19:27 臺北時間


  鏡新聞



  --'
