url: https://www.ptt.cc/bbs/movie/M.1685964723.A.4A0.html
title: '[新聞] 《蜘蛛人：穿越新宇宙》勇奪全球票房冠軍'
content: '《蜘蛛人：穿越新宇宙》勇奪全球票房冠軍打破多項紀錄 好評如潮席捲全球



  《蜘蛛人：穿越新宇宙》於6月2日在北美正式上映，直接引爆粉絲在社群上的熱烈討論，

  極高的評價也反映在首週末的票房數字，開片首日以5,185萬美金創下今年以來所有電影

  票房最高的紀錄，首週末以1.2億美金輕鬆登上冠軍寶座，打敗上週才剛上映的《小美人

  魚》，同時也成為蜘蛛人系列中開片票房第三高的電影。《蜘蛛人：穿越新宇宙》在北美

  的首週末表現也成為今年第二高的成績，超越《星際異攻隊3》，僅次於《超級瑪利歐兄

  弟電影版》，驚人的首日票房數字更是首集的4倍以上。這部話題之作不僅在北美市場告

  捷，也寫下索尼影業首日開片最高的動畫電影票房紀錄，在全球各地上映的國家都大獲全

  勝，狂掃8,800萬美金的票房成績，在印度更成為有史以來開片成績最好的動畫片，在新

  加坡拿下疫情後票房最高的動畫片殊榮。



  觀賞過電影的影評與觀眾無不盛讚，《蜘蛛人：穿越新宇宙》完全沒有辜負大家對奧斯卡

  金獎動畫續集的巨大期待，視覺風格更加絕美之外，劇情與角色的發展更是充滿爆點與感

  人橋段。在電影權威網站IMDb上，《蜘蛛人：穿越新宇宙》以9.1分成為評價最高的超級

  英雄電影，在爛番茄評價網上也獲得影評95%的新鮮度，以及觀眾96%的高評價。對粉絲來

  說，宛如藝術畫作的每一幅畫面有著滿滿的細節，加上令人興奮的彩蛋驚喜，許多觀眾在

  短短的週末兩天完成三刷的成就，直呼這是今年最讓人享受的超級英雄電影。


  萬眾矚目的《蜘蛛人：穿越新宇宙》在媒體界幾乎完全沒有負評，國際銀幕雜誌的評論談

  到：「這部聰明、扣人心弦、且令人興奮的續集電影，完全超越看似無敵的前作了。」英

  國獨立報則提到：「看完《蜘蛛人：穿越新宇宙》就像上了一堂你人生中最酷的老師所教

  的課，這部革命性的系列電影，不只創造了全新的外貌，更勇敢挑戰不可能的極限，DC和

  漫威應該學學這部電影如何講一個完美的多重宇宙故事。」Indiewire影評盛讚：「這部

  讓人嘴巴合不起來的傑作，從開始到結束就像一場視覺的饗宴，它耀眼的表現提醒我們超

  級英雄電影所能達到的高度！」


  在台灣的電影票預售活動也即將如火如荼的展開，全台各大影城將在週三（7日）開賣預

  售，購票觀眾即可獲得極限量蜘蛛人角色收藏卡牌，購買4張預售票更可完整收集六款全

  角色卡牌。除此之外，威秀影城搶先特別場也即將於本週末登場，參加特別場的觀眾還有

  機會抽中星宇航空的免費機票。以上購票的全部民眾更可以免費參加6月10日於美堤河濱

  公園舉辦的2023年蜘蛛人聯盟路跑，完賽者即可贏得獨家蜘蛛人獎牌，難得的機會千萬不

  要錯過了！




  新聞網址：





  --'
