url: https://www.ptt.cc/bbs/movie/M.1687775734.A.23A.html
title: 'Re: [討論] 蜘蛛人：穿越新宇宙有雷疑問'
content: '我的理解是這樣


  與蜘蛛人關係親密的警長(電影原話)會死，這是正史。不管是哪位蜘蛛人都一樣。


  至於邁爾斯，他是"變異體"，但變異體本身未必會破壞正史，只是有可能而已。


  就比如，The Spot也是變異體，但他的存在反而多次促進正史發生(害死警長)。


  變異體既可能導致正史發生，也可能破壞正史。但因其無論如何都是個變數，所以Miguel

  才會對之進行抓捕。


  補充一點，我認為正史確實是存在的，因為所有的蜘蛛人確實都有經歷某些共同事件，只

  是偏離正史，未必如Miguel所說，會摧毀宇宙而已。




  原則上，所有的蜘蛛人都可以加入聯盟，關不行，是因為他和變異體Miles特別親密。


  如此可能會產生變數，破壞正史。



  因為他是小蜘蛛吧。



  不知道。


  --'
