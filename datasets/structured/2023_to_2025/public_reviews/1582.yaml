title: '[好雷] 蜘蛛人:穿越新宇宙 '
content: '雷文防雷資訊頁

  早場10:40的松仁泰坦廳，進場前看到滿多小孩想說要跟觀影體驗說再見了，結果正片開始到結束都挺安靜的




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這次的主線就跟預告給的資訊差不多，主要在講蜘蛛人的命定論，如果改變會造成自己的世界崩壞，印度那邊我看到邁爾斯要去救大隊長就知道“完了，他要闖禍了”，先表明我自己是比較喜歡命定論，就跟上禮拜看的閃電俠一樣，有些事是改變不了的改了可能會更糟有時要學著放下，不過照目前蜘蛛人的發展感覺下一集是會打破這個命定論的


  反派斑點人跟邁爾斯的關係我還滿喜歡的，因為第一集的事件所以誕生了斑點人，跟阿蝙讓小丑失足掉進化學池有點類似，起初看預告我還以為他就跟邁爾斯說的一樣只是劇情開頭的免洗反派，結果最後變成宇宙危機等級


  這集雖然說是邁爾斯的故事，但我覺得關更像主角，整部看完你印象最深的應該會是關而不是邁爾斯，仔細想想除了近期DC動畫宇宙的超少女外我好像很久沒看到好看的金髮女白人當主角了



  動作的部分因為是動畫所以有滿多誇張，動作，每個蜘蛛人都比驚奇再起的加菲還靈活，動畫的好處就是可以做出很多真人做不到的動作，據說當年BVS的一些很炫砲的動作設計就是因為真人做太危險所以變廢案


  至於有人提的斷尾我倒不覺得是什麼很大的問題，雖然故事沒說完但確實有做到一個合適的斷點


  裡面有個客串蜘蛛人讓我挺意外的，沒記錯應該是這位，想不到時隔多年居然還能看到他











  -----

  Sent from JPTT on my Samsung SM-A528B.


  --'
