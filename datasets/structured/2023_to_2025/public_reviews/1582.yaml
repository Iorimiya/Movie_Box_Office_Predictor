url: https://www.ptt.cc/bbs/movie/M.1686162144.A.901.html
title: '[微好雷] 蜘蛛人：穿越新宇宙'
content: '剛好人在外地出差抽空到當地戲院觀賞穿越新宇宙，


  終於了解預告中蜘蛛人2099/米格爾為何要瘋狂針對邁爾斯XD


  個人小評

  視覺：10/10 (直接滿分，不亞於第一集)

  音樂：8.5/10 (本集有印象的配樂不比第一集的Sunflower跟What''ｓup Danger)

  劇情：8/10 (如果有看過第一集：9/10)







  ~~~~~~~~~~~~~~~~~~~ 以下有雷 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~









  如果第一集是講述邁爾斯如何在彼得B帕克以及眾平行宇宙的蜘蛛人共同引導下


  接棒Earth-1610的蜘蛛人，那麼第二集便是討論邁爾斯為甚麼是蜘蛛人，


  以及成為蜘蛛人到底需要犧牲甚麼。



  每個蜘蛛人都經歷過失去摯愛的Uncle Ben時刻，


  有真人電影版的、動畫版的、遊戲版的，就算是來自未來2099的也是。


  而正是這股創傷帶來的執念，讓米格爾不計任何代價，


  都要招募各個平行時空的蜘蛛人變體來維護平行時空的秩序 (可以當作是洛基影集裡的那位好康?)。



  邁爾斯是蜘蛛人，但也不應該是蜘蛛人，編號42的輻射蜘蛛在不對的時空咬到對的人，


  導致後續一連串的蝴蝶效應，包含反派斑點人的出現，以及那位平行時空的潛行者。



  再來是家庭，穿梭在都市叢林的蜘蛛人，在英雄戰服之下，


  可能只是一介平凡的少年、少女、父親，甚至是身懷六甲的母親。


  正因理解打擊犯罪的高度風險，不同時空的蜘蛛人不約而同地向自己的家人隱瞞身分、


  犧牲跟家人共度的時光，也因此引發了衝突。


  邁爾斯父母對於升學階段的邁爾斯的愛與期待，適得其反造成了邁爾斯的叛逆，


  親子間的誤會與牽絆也讓反派乘隙而入，使米格爾對邁爾斯更加不諒解，


  也才有後面各個平行宇宙的蜘蛛人變體對邁爾斯的大追捕行動。



  比較可惜的是，雖然第二集有上百位蜘蛛人變體登場，但實際推動劇情的角色大概只有


  蜘蛛人關、蜘蛛人2099、龐克蜘蛛(玩團仔)、印度蜘蛛人(扯鈴帥哥)、


  蜘蛛位元(科技宅)，至於心靈導師彼得B帕克本集轉型曬娃魔人 (?


  其他出場的蜘蛛人則多半有彩蛋跟玩梗的成份，像樂高蜘蛛人那段快笑爛XD



  結尾收在一個懸念，但真是令人熱血沸騰，很期待明年上映的Beyond the Spider-Verse


  總之，推薦大家進電影院體驗穿越新宇宙帶來的視覺饗宴！



  --'
