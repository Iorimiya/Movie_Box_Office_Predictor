url: https://www.ptt.cc/bbs/movie/M.1687526449.A.0CF.html
title: 'Re: [選片] 閃電俠VS蜘蛛人穿越新宇宙'
content: '兩部都不錯

  但是你如果沒看過新宇宙第一集

  那就秒選蜘蛛人



  畢竟真人版超英電影你一定看過

  但這種風格的動畫你找不到第二個

  也很難跟你形容


  一般人都會以為是動畫不想花錢進場

  但看了才會知道它的價值在哪裡

  絕非一般的動畫或卡通



  最後一個點就是蜘蛛人確定有續集

  閃電俠之後有沒有續集或是會不會又要重啟很不確定

  很可能看了個寂寞



  純論電影我看完蜘蛛人很想要找人二刷

  閃電俠就中規中矩


  可以的話就兩個都看啦都不錯


  --

  不是你的點是我的點啊

  住海邊？

  我看完第一集覺得幸好我有看...

  如果抱著動畫成見就錯過它了

  它的確有藝術價值但也很通俗

  是雅俗共賞的


  劇情的話有經歷過青少年都完全可以有共鳴

  好了啦你也不是善意的提問少在那邊裝討論真噁心

  你可以跟樓上手牽手挑喜歡的海邊入住

  家人沒看過第一部直接看也是覺得很好看

  當然想要連貫一點還是補一下'
