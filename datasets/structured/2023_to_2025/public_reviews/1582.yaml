title: '[極雷] 蜘蛛人：穿越新宇宙  另一種風貌動畫'
content: '雷文防雷資訊頁





  有雷  警告







  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~






































  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~










  先講結論




  “未完待續”







  看完才知道可以拿海報



  今天在titan廳看的

  螢幕還行

  音效還行


  是真的動畫 可以看到畫面一直動

  無論人物角色 或是背景

  都是呈現動態的畫面


  其實已經忘了第一集是不是也這樣

  不過這部的效果應該是上一集的好幾倍


  基本上就是你追我跑 你一直追我一直跑

  宇宙隨便跳


  一直在等高潮 但一直很精彩

  然後就.....  原來是這樣子





  音樂與音效都很強 人物刻畫也很豐富

  也就適當的笑點

  其實沒什麼好嫌的


  坐等碾壓小鯰魚



  再來就是等不可能的任務了






  -----

  Sent from JPTT on my Samsung SM-G975F.


  --'
