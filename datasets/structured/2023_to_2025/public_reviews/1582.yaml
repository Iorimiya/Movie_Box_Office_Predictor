url: https://www.ptt.cc/bbs/movie/M.1687758107.A.27B.html
title: 'Re: [討論] 蜘蛛人：穿越新宇宙有雷疑問'
content: '新世界電影裡面屢次提及的正史、偏離正史

  指的是在任何平行世界都必定會發生的事件

  類似what if影集裡面提到的絕對時間點(Absolute Point)


  每個世界都會有一個蜘蛛人, 是一個正史事件(canon event)

  而蜘蛛人身邊的警長會死, 也是一個正史事件


  依照新世界電影的設定, 正史事件是多重宇宙的支點

  正史事件若沒有發生, 就會造成量子崩塌

  蜘蛛人聯盟的任務就是避免量子崩塌發生


  但沒有蜘蛛人的42號宇宙為什麼沒造成多重宇宙崩塌, 可能就要看下一集



  --'
