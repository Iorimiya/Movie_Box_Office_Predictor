content: 'mcu蜘蛛人2可以當成魚缸頭在胡說八道 畢竟他是真的在胡說八道

  硬要吃主宇宙豆腐(自稱616)

  但漫威宇宙編號就是19999


  奇異博士2更是直接明示了MCU=616

  直接吃主宇宙豆腐的操作搞到漫畫迷很莫名其妙 倒底是在幹嘛

  搞到不爽的人很多

  美國漫畫展上也有人直接抗議這件事情


  這次蜘蛛宇宙電影版2直接講清楚

  應該會讓不少人瞞開心的XDDDD


  這大概是索尼最近幹的少數好事了


