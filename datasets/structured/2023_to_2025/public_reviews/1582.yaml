url: https://www.ptt.cc/bbs/movie/M.1687756675.A.757.html
title: 'Re: [討論] 蜘蛛人：穿越新宇宙有雷疑問'
content: '照理講邁爾斯不會成為蜘蛛人因為1610宇宙原先就有了

  可是經過斑點的搗亂陰錯陽差使得42的蜘蛛去咬了邁爾斯

  如果能夠確認咬錯人這件事是不是正史事件

  就能知道邁爾斯有沒有被命定束縛

  以現況來看1610和42我想可以預設成三種可能


  1. 對42和1610宇宙的邁爾斯而言咬錯人都是正史事件

  42的邁爾斯應該被咬可是沒有發生

  按照命定他爸依然死了這促使他變成潛行者

  自然1610照樣接下來父親會死


  2. 對42而言咬錯是正史事件但對1610的邁爾斯而言不是

  同樣42的邁爾斯爸爸過世

  而1610因為原先已經有經過正史事件的蜘蛛人了

  所以邁爾斯被咬純粹是意外

  他變不變成蜘蛛人不影響父親的死亡


  3. 對42和1610宇宙的邁爾斯而言咬錯人都不是正史事件

  42的邁爾斯沒有成為蜘蛛人所以不存在正史事件

  爸爸會死是因為沒有蜘蛛人的世界治安實在太差

  1610號宇宙本來就是沒有蜘蛛人的宇宙

  所以也不存在正史事件

  亞倫叔叔會死只是單純因為跟錯老闆



  我想是因為那時關還沒有真正遇到正史事件

  在米蓋爾看來所有蜘蛛人都是經過人生傷痕蛻變的

  不存在沒有傷痕就是蜘蛛人的人

  關當時可能已經很接近正史事件的時間了所以才破例

  就剛好幾週後她爸辭職不幹了運氣好躲過

  也應證頹廢師父帕克說的不見得正史事件都是壞事


  天神神力基因好

  據說有的人小時候不會走路就先會說話

  可能蜘蛛基因會促進幼體很快的發展能力吧


  我覺得讓孕婦上戰場很新奇很酷

  只是安排戰鬥中生小孩的情節不是很適合這部電影

  如果有畫可能也會被刪掉



  --'
