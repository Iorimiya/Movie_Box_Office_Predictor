title: '[討論] 蜘蛛人：穿越新宇宙'
content: '小情侶閃光防雷頁















  有幸昨天參與了聯映場

  幾點提出來跟各位討論看看：



  1.關的宇宙內大部分是水彩色塊為主

  這邊有個想法是說是不是暗喻關跟爸爸的關係後內心混亂

  從side-cut但過長的髮型跟換掉了招牌舞鞋

  自己最直觀的感覺是關現在也是一團糟很迷惘

  她的宇宙內也跟著模糊不清


  髮型跟第一集很俐落的短髮相比

  看了真的很啊雜很想請她修剪一下



  2.未來展望

  不太確定in accosiation with Marvel

  漫威可以參與劇情到多少成份

  目前知道42宇宙沒有蜘蛛人

  而199999宇宙的蜘蛛人也被大家遺忘了

  有沒有一種可能  是湯姆荷蘭的蜘蛛人去42宇宙代替成為那個宇宙的蜘蛛人



  聯映場真的好棒

  很多對白都隔空互相回答了

  最不能忘記的就是美術館路人說是班克西作品

  還有不斷追加的丟漫畫畫面

  再再說明了邁爾斯的故事不斷不斷地在擴張

  可惜東映蜘蛛人沒有出現xD

  邁爾斯的故事該怎麼完結呢  讓我們一起期待明年3/29的 beyond the spiderverse吧！


  --

  也十分有可能  可是一開始亞倫叔說的六點警衛不在要趁那時動手 是不是就說明了邁爾

  斯已經變成一個惡棍了'
