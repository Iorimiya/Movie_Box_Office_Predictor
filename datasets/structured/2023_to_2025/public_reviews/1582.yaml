title: '[失望普雷]便祕般的劇情，蜘蛛人穿越新宇宙'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  蜘蛛人新宇宙是我這輩子看過最屌的蜘蛛人&動畫

  論分鏡、動作、美術、劇情都非常棒

  分鏡跟美術完全是教科書等級

  抱著這樣的心情在期待第二集的我

  看完以後完全失望


  這次美術跟分鏡一樣很厲害一樣精彩

  只是劇情部分太不順暢也一點都不完整

  上一集行雲流水的敘事在這集完全不見

  如果說陶比蜘蛛人3&加菲蜘蛛人2

  都因為反派大亂鬥劇情太過零散而大失分

  為什麼穿越新宇宙就可以輕輕放下?

  三大對立角色-

  斑點、米蓋爾、42地球的潛行者

  故事全部說一半

  還有故事最重要的核心

  邁爾斯到底要怎麼回去救他爸才不會搞到宇宙崩壞

  我還在焦慮跟期待故事要怎麼交代

  故事又丟了一堆問號然後to be continued...


  有下集這件事之前就有聽說

  但還真沒料到可以把故事發散成這樣

  電影看的超不爽快的

  不覺得這是可以拿上下集當藉口的敘事方式


  然後設定孕婦蜘蛛人&帶上嬰兒衝鋒陷陣????

  這些設定我覺得太過硬要

  不是每個人都適合第一線

  覺得可以設定其他支援型角色讓這類角色帥一波

  就看劇情怎麼安排

  難道打LOL每個人都要當輸出嗎



  --

  當然懂斑點、米蓋爾、42潛行者三者的關聯

  但我不覺得這是拿來合理化這一集如此發散的藉口耶

  劇本可以有其他安排讓節奏更順

  我覺得你只是濾鏡太強劇本怎麼安排你都覺得合理

  在替這集過於發散的問題找理由開脫而已'
