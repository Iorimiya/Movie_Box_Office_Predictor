url: https://www.ptt.cc/bbs/movie/M.1687352460.A.27B.html
title: '[好雷] 蜘蛛人 穿越新宇宙'
content: '觀影日期: 6/12 松仁威秀 TITAN見面場


  防雷頁


  開頭附上見面場送的海報




  超開心可以搶先看以及拿到海報!


  現場也有邁蛛跟關蛛可以合照


  以及抽一張跟星宇合作的新加坡來回機票(可惜這個機會不屬於我...)


  作為一個6/8才上D+把第一集看完的人


  穿越新宇宙簡直爽到爆!


  如果你還沒看第一集，趕!快!去!看!


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  以下是正文


  你有沒有看過那種，大腦渴求你的眼睛把畫面上的每一幀數都映入眼簾，


  但其實卻根本無暇顧及畫面上的每一個部分?


  你甚至會懊惱自己能夠關注到的部份太少，因為他每個畫面都在講故事。


  對我來說，蜘蛛人穿越新宇宙就是這樣的電影。


  ●絢麗鮮明的畫面


  這次登場的人物，給我的風格比起第一集更加強烈而且令人印象深刻


  不論是印度蜘蛛人跟所屬的印度宇宙


  關的水彩畫風宇宙，2099宇宙的未來感


  相比於第一集只有邁爾絲自己的宇宙，


  其他宇宙更將其他蜘蛛人刻畫得更立體


  我自己最喜歡的是龐克蜘蛛人


  雖然他的風格是最突兀的，但這也相當符合他那叛逆的個性


  後面退出抓捕的決定，也很代表他不服從的個性


  展現了動畫的優勢以及可能性


  能夠比真人電影帶來更加強烈的風格


  ●命定論?


  這次劇情最重要推力就是正史事件


  對蜘蛛人來說有些關鍵片段是必然會發生的


  如果刻意去避免他發生，將會造成宇宙的崩壞


  劇情對多個平行宇宙的蜘蛛人提出了質疑:


  是不是一定失去些什麼重要的事物才能成就蜘蛛人?


  在續集會給我們一個答案


  但我相信邁爾斯一定會給我們令人滿意的答案


  我自己的想法是既然米蓋爾都說了邁是第一個變異體


  既然是變異體，是不是代表邁不會被這些正史事件所影響?


  其次是42號宇宙的潛行者邁爾斯


  看之前我真的沒想到會遇到他


  會不會在續集有重要的表現


  也相當讓人期待。


  ----------------------------------------


  我非常建議去畫面好的廳去看


  我這次在TITAN廳看畫面是很不錯，不過音效倒是沒什麼記憶點


  現在上映了


  應該還會再去刷一次IMAX，實在太滿足了


  --'
