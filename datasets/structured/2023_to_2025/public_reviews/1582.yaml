title: '[討論] 蜘蛛人:穿越新宇宙重返北美票房冠軍'
content: '狂賀《蜘蛛人：穿越新宇宙》本週在無勁敵下，


  憑藉優異口碑與話題度，


  逆勢擊敗上週冠亞軍閃電俠及元素方城市，


  於上映第四週霸氣重返週末票房冠軍，


  跌幅僅不到30%，


  仍有近2000萬的進帳，


  果然觀眾的眼睛是雪亮的，


  用心拍片不要亂搞無謂元素影迷就會支持。


  各位把握IMAX所剩幾天場次多刷啊！！




  題外話，


  本週最慘的是上週已開畫不如預期的閃電俠，


  次週更慘跌72%，前景堪憂@@


  ----

  Sent from on my Realme RMX2144


