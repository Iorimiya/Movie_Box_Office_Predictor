title: '[普雷] 大失望的蜘蛛人穿越新宇宙'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n雖然說標題寫普雷\n\
  但是我心底以前作帶來的信心是想給負雷的\n\n\n我對幾個地方給很大差評\n\n1.世界線的修正\n\n蜘蛛人作品常被開玩笑一定要死班叔/親友來刺激成長不然世界會毀滅\n\
  \n我覺得啦，這種當成茶餘飯後的粉絲話題也就算了\n\n也可當成是編劇一定要弄這齣戲才能讓蜘蛛人成長的標準流程\n\n可是真的把這件事弄成正式設定整個就WTF\n\
  \n本來是講蜘蛛人難免會遇到無力感/悔恨的橋段改成必須眼巴巴看它發生的命定論整個變得可笑\n\n更好笑的是\n\n本來的該有蜘蛛人的宇宙沒了蜘蛛人沒事\n蜘蛛人沒有死親友的宇宙反而會毀滅\n\
  \n你TMD這什麼奇葩設定\n\n\n2.不必要的橋段太多\n\n像是關的整個故事背景到底為什麼要花這麼多篇幅去講啊…整個很多餘\n\n斑點人作為一個概念型又不是很有趣的反派\n\
  又臭又長\n\n或是家庭戲各種穿插整個破壞節奏\n\n感覺就是創作者前作紅了之後有話語權，什麼都想要放進去一團亂\n\n而且穿插笑點的時機有些尷尬\n\nLess\
  \ is more的最佳反例\n\n\n3.故事描述七零八落\n\n說真的，超越新宇宙的主軸劇情超級單純\n\n甚至遠比新宇宙單純\n\n結果這麼單純的故事因為上面第2點\n\
  \n情感堆砌不能，故事難以沈浸\n\n\n\n其餘部分\n\n動作和美術一樣精彩\n\n感人橋段和音樂大輸前作\n\n\n\n整體來說\n\n想看一堆蜘蛛人和新宇宙特色美術的可以進場\n\
  \n如果是期待一個好故事的要做一下心理準備\n\n\n\n-----\nSent from JPTT on my iPhone\n\n--\n昔日，奧雷利亞星曾是星區的一顆耀眼明珠、億萬生命的歸宿\n\
  \     然而，隨之而來的次元風暴，將奧雷利亞星化成了冰封的星體\n          如今，奧雷利亞星已經歸來，並從星球表面再次傳來了訊號...\n\n \
  \                                            <<戰鎚40000:破曉之戰II 渾沌再起>>\n\n--"
