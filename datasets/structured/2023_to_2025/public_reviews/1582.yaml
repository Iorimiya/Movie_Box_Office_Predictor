url: https://www.ptt.cc/bbs/movie/M.1687841206.A.168.html
title: 蜘蛛人穿越新宇宙vs閃電俠 心得（微雷）
content: '我先講我的結論，我還是覺得閃電俠比較蜘蛛人好看

  雖然說兩個劇情都有一些小漏洞，也可以看到很多平行世界多元宇宙的套路，不過對我來

  說，閃電俠劇情給我的情緒起伏比較大






  這是我個人的觀點，我覺得這次穿越新宇宙畫面真的很厲害，可是它這次好像沒有一個劇

  情足以去刺激觀眾的劇情，變成你很難講穿越新宇宙的劇情怎麼樣怎麼樣，只能說畫面多

  好多好，舉一個很好的例子，同樣畫面很強的第一集，看到後面邁爾斯蛻變時刻，正是靠

  著‘’前面無法展開的鬱悶整個釋放出來‘’配合‘’整個畫面‘’跟‘’配樂‘’讓我

  嗨到爆，不過也有可能是因為這次故事還沒講，加上我其實覺得關跟邁爾斯糾結要不要坦

  白身份的點其實也沒有到那麼糾結就是，要說有稍微引起興趣的劇情可能就是變異點之後

  的最後十分鐘劇情吧

  而閃電俠在伊薩米勒的演技跟彩蛋的展現(超人的大串燒跟基蝙的儀式感真的太喜歡了)時

  所拉拔起來的高潮，讓我難以忘懷這些點點滴滴，而CG上的不足我其實也沒想太多，畢竟

  我已經被爽到了XD


  穿越新宇宙對我來說很像一幕幕滿天耀星的星空圖，真的很炫又超酷的，不過我可能看了

  10分鐘之後會有點視覺疲勞，或許會希望通過劇情讓漂亮的星空圖有些亮度變化，讓劇情

  去帶著畫面～


  ps.我可能真的很習慣看日本動畫，平常可能低張數，關鍵時刻再提高張數的方式，蜘蛛

  人突然一下子整部作畫都火力全開，我反而有點抓不到重點XD


  --'
