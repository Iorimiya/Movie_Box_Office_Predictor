title: '[新聞] '
content: '《蜘蛛人：穿越新宇宙》叫好叫座！全球猛破5億美金登年度第4


  〔記者許世穎／綜合報導〕在全球上映叫好叫座的《蜘蛛人：穿越新宇宙》，截至週二（20

  日）結束全球票房正式突破5億美金（約台幣152.56億元），成為繼《超級瑪利歐兄弟電影

  版》、《星際異攻隊3》、《玩命關頭X》後，今年第4部達此成績（破5億美金）的電影。


  該片也是今年好萊塢大製作截至目前在各大影評網站獲得評價最高的電影，監製兼編劇菲爾

  洛德與克里斯多福米勒，先前已確認，和《蜘蛛人：穿越新宇宙》背靠背拍攝的第三部曲《

  蜘蛛人：超越新宇宙》，將會是「蜘蛛人」邁爾斯冒險之旅的最終章。


  雖然暫未透露具體細節，但洛德和米勒也承諾將會帶領觀眾更進一步探索「42號地球」的邁

  爾斯，還有各個平行宇宙版的「女蜘蛛人」關，以及本集推出後大受歡迎的龐克蜘蛛人所在

  的宇宙。而目前《蜘蛛人：穿越新宇宙》加上2018年《蜘蛛人：新宇宙》，「蜘蛛宇宙」系

  列已進帳8.9億美金（約台幣271.56億元）票房。


  《蜘蛛人：超越新宇宙》目前定於2024年3月29日在全球陸續上映，但兩位監製兼編劇不保

  證團隊不會需要更多的時間來進行後製，至於片長是否會比《蜘蛛人：穿越新宇宙》創下的

  140分鐘更長（已是好萊塢動畫最長片長），他們表示一切都要故事如何達到最佳效果為準

  。《蜘蛛人：穿越新宇宙》已在台上映，《蜘蛛人：超越新宇宙》台灣暫定檔期為2024年4

  月3日。


  ————————————

  北美已經3億了

  這系列比真人版好看多了

  但台灣反應好像普普

  台灣人寧願看真人版爛片也不想看動畫神作



  --'
