url: https://www.ptt.cc/bbs/movie/M.1687539200.A.68B.html
title: '[負雷]蜘蛛人 穿越新宇宙  邏輯在哪?'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\n\n\n\n\
  \   走出電影院  我心裡亂糟糟  美術 分鏡 特效不錯\n\n但是我實在無法理解劇情  尤其是領隊想法\n\n抱歉  我連他名字都沒記住\n\n\n\n\n\
  \n\n  版上很多分析文章了(雖然我還沒看) 但我實在無法理解劇情\n\n我知道動畫不該去探討邏輯  但是\n\n至少編劇要符合你設定的故事  在故事裡面發生的邏輯\
  \  對吧!\n\n\n\n   既然邁爾斯已經是變異體了  你們為什麼一開始不抓他?\n\n就因為他已經是蜘蛛人了?  已經是蜘蛛宇宙的一份子了?\n\n\n\
  \n   既然斑點到處亂竄會造成加爾各答蜘蛛人正史發生  那你們\n\n一開始為什麼要抓他? 就因為量子電腦算不到?\n\n\n\n  既然斑點是造成邁爾斯的父親死亡的主因\
  \ 也是你們計算的正史\n\n那幹嘛抓他? 這不是量子電腦的計算而已嗎?\n\n\n\n   我知道你們沒有時光機  但斑點不就是造成別世界蜘蛛跑去咬\n\n\
  邁爾斯的主因? 就然是錯誤為什麼你們不阻止?\n\n\n\n   關的父親會因為關的離開而無法成為大隊長  所以就不會引發\n\n蜘蛛宇宙崩潰? 這什麼理論?\n\
  \n\n\n   隊長因為自己去取代別的世界的自己所以就只相信量子電腦計算的正史?\n\n你們連試都不試就只相信計算?  關的宇宙不就沒發生崩毀嗎?\n\n\n\
  \n\n\n\n\n\n\n\n\n  另外  片中有提到奇異博士  所以我很難不去聯想到奇異博士\n\n至少WHAT IF 和奇異博士2  那崩毀宇宙的奇異博士常識過才照成宇宙崩毀\n\
  \n這我能理解  但這領隊真的一意孤行\n\n\n\n\n\n\n\n\n\n\n  令我欣慰的是  我還以為總部全部的蜘蛛人除了2個外  全部都和邁爾斯為敵\n\
  \n(一開始關也是為敵)  但是看到後來關組隊  我有點欣慰\n\n至少有7-8位蜘蛛人  不是真的很聽領隊  而是有自己的想法的\n\n所以跟著關一起行動\n\
  \n\n\n\n  恕我真的無法理解  這一群\"自稱維護平行宇宙正常發展\"他們的做法\n\n感覺就是只靠一台量子電腦說\"可行\" \"不可行\" \"該抓\"\
  \  \"不該抓\"\n\n沒世界崩解就讓他加入  也崩解危險就抓他的做法\n\n\n至少這一方面  奇異博士是自己去試過了 也阻止過崩解過\n\n\n\n \
  \ 我更無法理解的是  為什麼蜘蛛人宇宙就一定要死最關懷的人\n\n不能有一個從沒死過親友的蜘蛛人?  阿  日本的那個沒有\n\n所以他無法加入吧......\n\
  \n\n\n--\n\n\n\n\n\n--"
