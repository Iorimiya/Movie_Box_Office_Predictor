  這部是近期看過最喜歡的電影

  我覺得比閃電俠好看多了…

  動畫打鬥非常流暢

  展現出蜘蛛人非常靈活的感覺

  搭上配樂讓人看得非常爽

  後來看到時間快到了想說不會爛尾吧？

  哈哈竟然來個未完待續

  很有漫畫的風格


  缺點就是看到精彩的地方

  轉頭看朋友竟然發現他眼睛閉上

  後面追逐的時候那個光線一直閃

  我眼睛也自己閉上了 眼睛太酸

  結束之後也聽到後面再討論眼睛不舒服


  不知道是影片還是影廳的問題

  以前看沒在威秀電影這麼痛苦

  很想看但眼睛太酸 有大一段都在閉目養神




