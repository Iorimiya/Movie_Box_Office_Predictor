title: '[雷] 蜘蛛人：穿越新宇宙'
content: '今天去看了網路評價不錯的蜘蛛人電影


  其實我不是蜘蛛人的粉絲，對這個系列的印象只有小時候在電視看的真人電影


  不過今天一看直接變粉絲


  雖然明顯跟之前的電影有關聯，但第一次看的我也不會看不懂


  劇情就非常的超級英雄，不過老套的劇情做的好還是能調動觀眾的情緒，這部蜘蛛人就是典

  範


  看電影之前其實就知道有好幾個蜘蛛人的設定，很疑惑同種超級英雄聚在一起不會審美疲勞

  嗎


  事實證明我多慮了，同樣都有吐絲能力，不僅型態不同，甚至不同蜘蛛人還有不同能力


  還有各種蜘蛛人的造型，特別喜歡那個蜘蛛暴龍！！要是戲份再多一點就好了


  之後有時間會補前面的電影，還沒看過的人強力推薦


