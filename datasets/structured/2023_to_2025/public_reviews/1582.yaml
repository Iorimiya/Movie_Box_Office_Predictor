url: https://www.ptt.cc/bbs/movie/M.1685971802.A.5A3.html
title: '[新聞]蜘蛛人：穿越新宇宙全球首週票房賣破 2 '
content: '《蜘蛛人：穿越新宇宙》全球首週票房賣破 2 億美元！北美開片票房相較首集翻漲近三

  倍



  精心策劃五年的超級英雄續集《蜘蛛人：穿越新宇宙》（Spider-Man：Across the

  Spider-Verse）日前已於全球諸多國家正式上映，全球首週票房粗估高達 2.08 億美元，

  是索尼影業至今為止最高的動畫電影開片成績。《蜘蛛人：穿越新宇宙》首週在北美共吸

  金約 1.2 億美元，海外地區則累積了 8810 多萬美元，不僅遠高於預期，更是第一集《

  蜘蛛人：新宇宙》（Spider-Man：Into the Spider-Verse）首週數字的 2.8 倍。




  五年前的《新宇宙》在北美首週僅進帳約 3540萬美元，五年後的《穿越新宇宙》則挾著

  前作的高人氣及如潮好評，旋即在首週創下成長將近三倍的 1.2 億美元票房。《新宇宙

  》當時全球票房最終收官在 3.75 億美元，然而《穿越新宇宙》首週就超越了《新宇宙》

  過半的總票房，接下來要繼續超越 3.75 億美元這個門檻，無疑是輕而易舉的事情。




