title: '[新聞] 《蜘蛛人：穿越新宇宙》首波評價出爐：'
content: '新聞網址：


  《蜘蛛人：穿越新宇宙》的首波評價已經出爐，影評和媒體紛紛表示這部電影是一部「真

  正的藝術品」，同時比預期的「更加黑暗和悲傷」。


  這部觀眾期待已久的續集是 2018 年大獲成功的動畫冒險片《蜘蛛人：新宇宙》的續篇，

  故事發生在第一部電影的一年多之後。邁爾斯／蜘蛛人（由沙梅克摩爾配音）受到關史黛

  西／蜘蛛女（由海莉史坦菲爾德配音）的邀請，要從超級反派「斑點」手上拯救所有宇宙

  。邁爾斯和關一起穿越多元宇宙，還會遇到由蜘蛛人 2099 （奧斯卡伊薩克飾）領導的蜘

  蛛人聯盟。


  《蜘蛛人：穿越新宇宙》首波社群評價如下——


  CinemaBlend 編輯 Sean O’Connell：

  「OK，《蜘蛛人：穿越新宇宙》比傑作還要傑作。這是真正的藝術品，每一幀都值得掛在

  博物館裡。對蜘蛛人故事的笑話和致意非常完美。最棒的《蜘蛛人》電影，也可能是我史

  上最喜歡的電影。太愛了。」


  《好萊塢報導》作者 Brian Davids：

  「《蜘蛛人：穿越新宇宙》是製作人二人組的又一次巨大勝利。海莉史坦菲爾德飾演的關

  史黛西真正展現了自己的魅力，她與史黛西船長的戲份非常特別。《蜘蛛人：穿越新宇宙

  》比我預期的更黑暗、更悲傷，但卻是必要的。」


  《爛番茄》影評 Tessa Smith：

  「《蜘蛛人：新宇宙》以其獨特的動畫風格和講故事的方式將標準拉高了，觀眾完全大受

  震撼，粉絲可能還認為《蜘蛛俠：新宇宙》無法被超越......可以再想一想。 《蜘蛛人：

  穿越新宇宙》甚至超越了自己當初提高的標準。

  電影有令人震驚的曲折、意想不到的驚喜，還有一個真正有意義的故事。新的蜘蛛人都很

  棒！《蜘蛛人：穿越新宇宙》永遠不會讓人覺得冗長。」


  《This Week Media》主編：

  雖然我很想喜歡《蜘蛛人：穿越新宇宙》，但它比起原版無法打動我的地方，主要是因為

  電影優先考慮粉絲服務，而不是一個足夠強大優秀的故事。《蜘蛛人：穿越新宇宙》感覺

  像是一個二部曲故事中的開頭，結局也非常好預測。」


  《蜘蛛人：穿越新宇宙》將於 6 月 21 日在台上映。


  --


  SONY要連續兩次最佳了嗎


