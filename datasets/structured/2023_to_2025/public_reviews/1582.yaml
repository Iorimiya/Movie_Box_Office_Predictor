  邏輯就很有漏洞啊，照他的規則就一堆解釋不了的狀況，哪有規則例外這麼多的？

  從小就一直很討厭命中注定這種事，第三集給我命中註定我也一樣給負雷

  你沒搞懂我說的邏輯，爪男宣稱

  1.放任變異體改變正史會導致宇宙崩潰

  2.邁爾斯是一號變異體

  3.至今到最新變異體斑點人，已經多起崩壞事件

  4.42號宇宙應該的蜘蛛人沒有誕生

  5.邁爾斯導致1610號不該死的金髮帕克死掉

  完全自相矛盾，印度宇宙正史被破壞立刻產生崩潰，邁爾斯真的是變異體1610.42兩個宇宙

  第一集已經正史被破壞的體無完膚，怎麼第一集時沒崩壞？

  在爪男口中正史他可不該是蜘蛛人，既然邁爾斯不是命定的蜘蛛人，哪來的命定死掉叔叔爸

  爸的命運？


  就疑點重重


  光就打戲來講，評個英雄電影史上最佳真的沒壓力XD


  這部真的完美詮釋動畫的精髓，每一幀都像精心設計構圖的漫畫，但動起來更讓畫面張力有

  了飛躍性的增幅，就算沒有劇情都值回票價了


  2099這種充滿悲情色彩的壞人確實是受歡迎的人設，不過我覺得斑點人只是電光人那種氣量

  不夠又憤世嫉俗的偏激仔而已，沒有到真的很壞但抽到強大能力又搞極端起來能造成很大的

  破壞。

  我只能說第三集很重要，不是大好就是完全浪費第二集讓人期待感拉滿的鋪陳

  這也是不錯的解法，就看編劇怎麼演第三集了

  我覺得不是bug，就2099蛛在騙其他蜘蛛人沒講真相而已。


  對吧超討厭的，命定論感覺就是說以前發生的悲劇都是本該發生的，以後的努力也沒有意義

