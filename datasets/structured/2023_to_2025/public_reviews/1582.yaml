title: '[無雷] 蜘蛛人：穿越新宇宙'
content: '昨天去看了avant premiere。


  這集比較像是鋪墊和介紹新角色，劇情有些散但並不會冷場。有很多笑點不知不覺120分

  鐘就過去了。


  美術承襲上一集有許多不同的風格穿插，我自己覺得有些多了，有些視覺疲勞，但為了延

  續設定好像只能如此。


  很值得去IMAX二刷三刷的好片!! 是的會有第三集嘿嘿


  --

  等等miles是西班牙/黑人混血啊嗯？

  我覺得一樣好！

  沒啦比沙丘爽多了

  對不認識其他蜘蛛人的我是，對粉絲我想應該滿滿的彩蛋和高潮

  有啦該有的都有 非媽佛粉還是看得很開心

  這是法文我不知道怎麼翻 就是首映前的那一場，好像全世界只有巴黎這場在5/30

  136 但體感沒有那麼長

  是的！一般是90，比一般多了1/3倍，感覺團隊因此有些吃緊

  恰到好處

  那你不要坐離螢幕太近

  (*≧ω≦)

  其實...主持人有說不能劇透不能hashtag，所以我很小心

  我很喜歡

  有啦去看IMaX

  Sony 4月就宣布由第三集了 哪裡暴雷（怒'
