url: https://www.ptt.cc/bbs/movie/M.1687476905.A.EED.html
title: '[好雷] 蜘蛛人 穿越新宇宙 劇情討論'
content: '雷文防雷資訊頁




  /╲/\( ‧ω ‧)/\╱\~*-*~*-*~*-*~*-*~*-*~*-*~*


  /╲/\( ‧ω ‧)/\╱\~*-*~*-*~*-*~*-*~*-*~*-*~*


  /╲/\( ‧ω ‧)/\╱\~*-*~*-*~*-*~*-*~*-*~*-*~*





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這次第二集非常非常好看


  尤其適合1+2馬拉松以及欣賞先有先複習第一集的觀眾


  因為裡面有非常多呼應第一集的情節及台詞


  例如 in a minute / 美術館路人 .. 都算是驚喜彩蛋


  雖然很多人抱怨說節奏不如第一集


  但就第二集明顯多很多文戲是用來劇情及情感堆疊的


  且他也有達到那個效果 所以我認為是很不錯的編排


  有幾個部分且提供想法跟疑問 看是不是我有漏掉等等的?



  1> 印度蜘蛛人的世界


  雖然邁爾斯破壞了正史 救了印度蜘蛛人那邊的大隊長


  使得米格爾要派團隊來收拾殘局


  帶很多蜘蛛夥伴以及器材等等


  防止該宇宙"可能"崩壞或發生更危險的事件


  但上述的描寫以及結果都算是草草帶過而已


  感覺即便很嚴重但也不是沒有辦法補救?


  這樣米蓋爾為什麼要拚了命阻止邁爾斯救爸爸


  畢竟這如印度蜘蛛人那邊的案例一樣


  不也只是救下大隊長嗎 事後再派員跟器材去補救?



  2> 邁爾斯的強度


  之前討論串有提到邁爾斯強度高的一堆蜘蛛人追都追不到


  如文章討論 應該只是大家都在放水而已


  尤其是米蓋爾放水最嚴重 有仔細看會知道


  只有邁爾斯單方面的一直狂踢米蓋爾 (???


  米蓋爾都只用身體壓制跟嘴砲



  3> 42宇宙


  其實就最後的片段 邁爾斯跟髒辮邁爾斯 對視 那幕


  可能會有一些人在擔心會有衝突之類的


  其實絕大機率一定是兩個宇宙一起合作


  就是 42宇宙雖然是死大隊長 但也是一樣有噴漆紀念


  代表 42宇宙是很注重家人之間的情誼


  只要邁爾斯說「我已經失去亞倫叔叔 我不能再失去我爸爸」


  之類的話


  寵姪子的42亞倫一定會哭一把鼻涕一把眼淚的說要幫忙


  42邁爾斯一定也會聳肩改台詞說


  「Let''s go to the saving your dad , no , It''s our dad !」




  --'
