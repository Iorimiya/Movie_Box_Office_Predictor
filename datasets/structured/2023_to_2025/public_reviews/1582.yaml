title: '[負雷] 蜘蛛人穿越新宇宙-無聊煩躁的家庭戲太多'
content: '這集最後的設定真的很讚

  讓人很想看下一集

  但真的不用拍成140分鐘

  前面的家庭戲太冗長了

  要鋪陳也不是這樣鋪陳

  拍的也不夠深刻

  只覺得很煩人

  尤其是蜘蛛人的媽媽

  簡直就是鄉民常說的三寶家長


  控制狂+佔有慾+瘋狂碎嘴唸+把兒子當小孩子

  還對兒子的女朋友莫名的不友善

  (你是在大聲什麼啦？)

  看了非常煩躁


  還是這是拍給青少年共鳴用的？

  可能我這年紀沒辦法共鳴了？

  要是在現實世界

  這種父母教出來的應該會是媽寶

  陶比的蜘蛛人

  我覺得在感情戲和內心戲還比較有張力


  畫面也炫技過頭了

  畫風太誇張+鏡頭跳太快眼花撩亂

  像第一集那樣適時畫龍點睛反而印象比較深

  碎嘴的畫面也太多了

  蜘蛛人碎嘴就夠了

  連班點人都跟蜘蛛人一樣吵…


  第一集還是比較好看



  --'
