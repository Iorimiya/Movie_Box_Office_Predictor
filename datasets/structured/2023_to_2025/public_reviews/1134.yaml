url: https://www.ptt.cc/bbs/movie/M.1583950289.A.E77.html
title: '[好雷] 鐵道員 能死在所愛之地好幸福'
content: "雷文防雷資訊頁\n\n今天繳電話費的時候想到我有免費的HamiVideo 可以看\n決定晚餐配著電影慢慢吃\n原本打算看部爽片\n卻看到「再不看就拜拜囉」專區有四個字\n\
  我就 點開來看了\n\n結果吃頓晚餐吃得我滿臉淚QQ\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n這部電影描述一輩子都奉獻給工作的鐵道員\n\
  在退休前夕的故事\n電影傳達了日本人的職人精神\n或者說武士的精神\n\n主角乙松在小小的火車站擔任站長的職務\n每天都堅守崗位\n就算女兒、妻子生病了也不曾動搖\n\
  後來幌舞線即將廢線\n乙松也到了準備退休的年紀\n才發現他根本沒思考過退休後的生活\n住哪裡、做什麼工作，甚至連離開火車站這件事都沒想過\n\n他還刻好自己的墓了\n\
  \n\n\n後來 他遇見三個女孩\n\n\n女孩手上的人偶讓乙松想起曾送給已逝女兒雪子的人偶\n\n第三位女孩讓他想起已經不在的妻子\n\n後來才知道 原來這三個女孩是女兒雪子變成的\n\
  她想讓爸爸看看 自己長大的樣子\n乙松也說出了一直以來對雪子的虧欠\n\n\n\n\n這段真的是哭死我了Q_Q\n\n之後\n乙松被發現死在車站的月台上\n\n\
  手上拿著揮舞了大半輩子的紅旗\n\n\n能死在自己愛的地方、事物上 真的好幸福\n我不知道自己在面對熱愛的事物 以及深愛的人\n會如何做抉擇\n但如果能夠死在自己深愛之處\n\
  我的人生也無憾了吧\n好羨慕乙松\n\n很值得看的一部片\n每個鏡頭都很美\n感情細膩 層次豐富\n\n\n這是我第一次看高倉健的影片\n真的 好 厲 害\n\
  在雪子消失後的短短幾秒\n他就可以把豐富的情緒演繹出來\n\n\n\n\n\n\n\n\n廣末涼子好漂亮\n\n\n\n--\n               \
  \                         \n  \n \n\n\n\n\n--"
