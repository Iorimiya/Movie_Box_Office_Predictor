url: https://www.ptt.cc/bbs/movie/M.1758952004.A.174.html
title: 'Fw: [閒聊] 《鐵道員》電影心得'
content: '看NextFlx上的版本

  想說順便練日文聽力，結果好多北海道方言....


  看完後的感想是，乙松真的敬業到不行，這就是昭和時代的精神嗎？

  就算女兒和妻子生病，依然放不下站長的職位

  電影的名言：如果我不在崗位，誰來開通號誌和扳轉轍器，現在看來真的有點傻


  電影中用穿插的方式來講乙松的人生歷程

  從開蒸氣車，到升到站長

  沒想到電影中連國勞抗爭都有，很多人大概都不清楚


  同僚一直邀他，希望能夠一起走

  主角還是堅持要待到廢線的時候

  正月祭拜的時候，清墓碑上的雪，原來這位站長也早就把自己的名字給刻好了


  後面連三天都有三名女孩過來

  第三天才意識到原來這三位是早夭的女兒

  我是覺得那些話可能代表的是主角自己內心的投射吧


  結尾站長就在盡忠職守中與世長辭，鞠躬盡瘁的精神也是令人敬佩


  這電影我從中看到的是站長敬業的精神，甚至敬業到給人感覺有點傻

  雖然很久之前就知道這部片，但直到最近才來看，這部片真的很感動人


  理解敬業精神，以及已經面臨過重要的人離世的人，真的感觸會很深


  --'
