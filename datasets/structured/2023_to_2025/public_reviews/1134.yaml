url: https://www.ptt.cc/bbs/movie/M.1688622850.A.D03.html
title: '[好雷] 鐵道員 1999日本電影'
content: '雷文防雷資訊頁


  鐵道員

  POPPOYA – A RAILROAD MAN

  1999日本電影

  鉄道員ぽっぽや





  獲1999日本奧斯卡獎九項大獎，降旗康男執導，高倉健、廣末涼子主演。幌舞車站的站長

  佐藤乙松，獨自一人在這座即將廢線的不起眼小站堅守崗位，某日，站長意外遇見三位女

  孩，令他不禁想起已逝去的女兒。




  C)



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  個人滿意度90分（滿分100）。                    我看到結局前20分鐘，自然地熱淚

  盈眶，淚流滿面，真的有夠狂，劇情畫面是打中我負責流淚的腦之某部份嗎？



  這部名作片，2023年才看到且看完，現在看1999年的電影，有懷舊感，加上這部1999電影

  又是懷舊類型的，思古情懷加倍。本片劇情温柔感性，角色都是平凡盡職的好人，加上北

  海道荒野冰天雪地的場景，天地蒼茫的感覺，主角一生的命運及性格的劇情，現在和過去

  的橋段相互穿插，交織著濃厚的人情味，加上本片改編原作淺田次郎名作家的奇幻風格，

  令人為之感動。


  看這類數十年前的影片，會去關心主要演員的近況，本片的許多角色都令我心儀，本片演

  出的老牌大咖高倉健（主角佐藤乙松），奈良岡朋子（經營餐館的老奶奶），志村健（從

  外地來的礦工），田中好子（主角好友杉浦仙次的妻子）都已離世，比現在年輕20多歲時

  的廣末涼子，安藤政信，吉岡秀隆在本片的青春洋溢，外型充滿朝氣，女主大竹忍演出依

  然穩定良好，主角好友杉浦仙次（小林稔侍）對主角的友情展現，令人動容，看這片的演

  員陣容，對我而言，很有思古情懷來著。



  --


  我也是。



  是吼，難得的電影演出。



  和劇情搭配，很動人。



  是啊。點頭如搗蒜。



  漫畫版原來有一些硬傷微詞？我沒有看過。



  很感人及出色。




  經典佳作。



  果然值得收藏。



  的確如此，令人讚賞的大腕演員。




  帥又有很棒的氣場。



  迷人的moment.



  的確可以不用此橋段的。



  是的。



  小林稔侍。



  是的。



  目前變化不大。再看數十年後吧。



  嗯嗯，二種版本，的確是相互輝映的經典佳作。




  淚水決堤。



  名作家的名作。



  是的。



  Yes.



  good.



  嗯嗯，引起一點小爭議，不知道導演他的用意。



  原來如此。我不知道。



  好棒，原來有如此典故，好淒美，這歌曲好動聽。



  是的。'
