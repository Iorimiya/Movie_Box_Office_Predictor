title: '[情報] iTunes多部$90起 鐵道員/決勝女王/遊戲夜'
content: "完整片單如下 :\n\n--\n\n\n$90 #漸動人生 : \n\n希拉蕊史旺主演，改編自真人真事的漸凍人故事，故事不流於狗血老套，相當真實的呈現\n\
  漸凍人的心境與感受，讓一些簡單的劇情轉折都讓人揪心情緒波動。\n\n-\n\n$150 #決勝女王 : \n\n爛番茄82%，【賈伯斯】金獎編劇艾倫索金首部執導電影，剪接風格與對話速度是老影迷\n\
  熟悉的樣子，搭配潔西卡雀斯坦氣場強大的演出，觀影情緒在聰明、俐落、爽快中節節高\n升 #私心大推\n\n-\n\n$90 #深夜食堂2 : \n\n「相信總有個地方有道菜，能溫暖你。」\n\
  \n日本療癒系經典漫畫改編續作，看完電影會深深有種感覺，希望自己在開心或疲累挫折時\n，能有一間這樣的店進去坐坐，一切是那麼自在又能飽足，不過沒有這樣的店也沒關係，\n\
  看本片也會被撫慰到的\n\n-\n\n$90 #天空之蜂 : \n\n東野圭吾迷必看，暢銷作品映像化！限時八小時，一場以全國人民為「人質」的空前豪賭\n即將展開。江口洋介\
  \    仲間由紀惠    向井理    綾野剛\n\n-\n\n$90 #辣手警探 : \n\n韓國當年度票房總冠軍，沒看過動作片這樣拍的，想像把一部動作片加入警匪驚悚，再加\n\
  一點成龍搖一搖，端出來的東西卻意外的順口暢快\n\n-\n\n$90 #黃飛鴻之英雄有夢 : \n\n毋須蒙面，黃飛鴻就是華人世界的超級英雄，本片仿照好萊塢近年熱潮，重新啟動這位文\n\
  質彬彬的英雄，加了些黑暗系元素，成功塑造東方味超級英雄。全片武打設計新潮酷炫，\n流暢運鏡大幅增加爽度，曾看電影時痛快到跺腳嗎？這部就是\n\n-\n\n$90\
  \ #惡夜殺機 : \n\n曾經世界眼中最帥的警探 – 基努李維（雖然現在以殺手身份更加知名...）調查夥伴死\n亡原因的過程，將黑白兩道最黑暗的秘密都引了出來\n\
  \n-\n\n$90 #單車天使 : \n\n導演肯定花了不少心思親近這群孩子，才能捕捉這麼多平凡卻動人的時刻。每個環島的人\n都有一個理由，這群孩子 － 失親，有很多原因無法跟家人在一起，他們不為什麼而騎、\n\
  而是為了是證明自己「有價值」跟他的家人一起生活 #推薦了\n\n-\n\n$90 #只有我不存在的城市 : \n\n藤原龍也    有村架純。即使能回到過去，時空也並非站在你這邊，改編話題性暢銷漫畫\n\
  【只有我不存在的街道】。電影相較原著有不少修改，但全片仍保有一定程度的懸念與張\n力，結局的反轉都讓電影瀰漫著宿命論。\n\n-\n\n$90 #生日卡片 :\
  \ \n\n一年打開一張卡片，這是死去的媽媽留給她的，陪伴她生命中各個重要時刻。原以為這樣\n的劇情設定會在預料之內，該有的感動與溫馨不會少，不過片尾還是迎來超乎預期的衝擊\n\
  ，眼淚滑溜溜的直落下 #推薦了\n\n-\n\n$90 #寄生獸1 : \n\n本片絕對是漫改作品中相當成功的例子，探討物種生存，具哲學性的架構。此外裂頭特效\n\
  逼真，戰鬥畫面力道、速度感兼具，血腥毫不保留，呈現原著漫畫風格，最後推一下本片\n橋本愛，敲可愛\n\n-\n\n$90 #海霧 : \n\n人性本惡，用一條人命，換全船自由？『海霧』由國際大導奉俊昊監製，描述伸手不見五\n\
  指、濃霧侵襲的大海，一樁偷渡客死亡的意外事件，勾起船員間最原始殘暴的求生、慾望\n本能 #私心大推\n\n-\n\n$90 #大鏢客 : \n\n電影大師黑澤明首次動作喜劇嘗試，劇情描寫自由主義英雄三十郎在混亂的年代，不顧自\n\
  身安危，用其特有的手段為善良百姓抵抗惡痞的精彩故事。這是黑澤明首次拍攝動作娛樂\n片，也是之後美國西部片《荒野大鏢客》的範本。\n\n-\n\n$150 #逃出亞馬遜\
  \ : \n\n他一個人被激流沖散，沒有地圖，就連把小刀都沒有，獨自遺落在人類生存的極限邊緣-\n亞馬遜叢林，劇毒生物，溼熱狂風暴雨，大自然最險惡的一面即將揭開…只能說丹尼爾卸\n\
  下巫師袍之後戲路很廣\n\n\n\n原文轉自 : \n\n\n額外發現3部特價中的電影，補在這邊 :\n\n\n$90 遊戲夜殺必死 : \n\n\n$150\
  \ 鐵道員 : \n\n\n$150 追憶 : \n\n\n\n\n--"
