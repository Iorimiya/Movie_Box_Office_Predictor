title: '[雷] 白日之下'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~










  影片一開始是一個剛歸國的女生


  到護老院看望自己失智的爺爺


  爺爺認不出她


  大家也不當一回事


  女生見護老院人手看起來很不足


  於是善解人意的說 自己剛回國平常沒事做


  不如就來幫幫忙




  本來是這樣的


  卻沒想到這個女生居然是 接到民眾爆料特意跑來臥底的記者


  劇情節奏蠻快速的


  護老院的照料問題不必細挖也看得出來層出不窮


  因為人手確實相當短缺 2個人要顧6、80個病患


  根本也無暇搭理女主 何況是發現她的端倪


  給病患吃的是過期的燒賣配上白飯


  毆打智力障礙的病患 甚至用訂書機釘在他身上


  有老人過世了 但卻因為有外賓而不處置


  幫無行為能力的老人洗澡 是將他們全部脫光 推到戶外用水管沖 毫無尊嚴



  那為什麼他們要住在這樣惡劣的環境呢


  女主也問過其他老人這個問題


  他們的回答是 去哪裡都是一樣的 而且這裡至少不用餐風露宿


  並不是每個人都是有選擇的 或者說選擇是相當受限的



  可能因為想討論的事情太多


  電影後段的節奏就稍微有點亂


  在風控浪尖上 院方還持續做其他惡質的重大案件


  也有點不合邏輯



  不過整體而言還是很不錯啦


  首先片中的矛盾衝突刻劃很完整


  讓人很清楚很現實的看到這些難處


  還有對於病患們的家人間


  複雜矛盾的情感描寫也很讓人動容




  要改變社會的問題往往不容易


  許多議題可能動輒三五十年才有較為顯著的改變


  但只要發現了 意識到了 這樣微小的改變 也是改善現狀的一小步


  --'
