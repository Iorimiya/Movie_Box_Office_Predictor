title: '[新聞] 「白日之下」踢爆香港黑心療養院 角逐金馬5獎'
content: '「白日之下」踢爆香港黑心療養院 角逐金馬5獎


  2023/11/6 16:48（11/7 10:00 更新）



  香港電影「白日之下」入圍第60屆金馬獎5項提名，角逐金馬影后的余香凝（左）在片中

  假扮姜大衛（右）親人，查訪黑心療養院內幕。（台北双喜電影提供）中央社記者葉冠吟

  傳真 112年11月6日


  （中央社記者葉冠吟台北6日電）以記者踢爆黑心療養院內幕為題材的香港電影「白日之

  下」，今年強勢入圍第60屆金馬獎5項提名，首度入圍電影獎項的林保怡直呼，不敢置信

  贏過前輩姜大衛、對方是提名最大遺珠。


  入圍金馬獎最佳男配角的演員林保怡透過片商分享，「白日之下」是發生在香港2016年前

  後的真實個案，電影原原本本呈現，讓人更加觸目驚心。全片描述報社接獲一宗關於療養

  院「彩橋之家」虐待院友的線報，偵查小組為揭露監管問題，記者潛入院舍試圖尋找日光

  之下的殘酷真相。


  提名金馬影后的女主角余香凝回憶準備電影前期工作時，大家都對這些經歷印象深刻：「

  從每個記者口中聽到的都是不放棄、想報導真相。」這次她主要對手戲演員、飾演療養院

  失智病患的姜大衛，被視為最佳男配角遺珠，不僅余香凝直呼可惜，林保怡也感到意外，

  沒想到他會贏過姜大衛入圍金馬男配。


  姜大衛則分享，首次觀看自己在戲中演出時，深受劇情觸動心情無法平復，看完後一時說

  不出話來，「我沒有演出過這種角色，要扮演一名神智不清、住在療養院的老人，角色年

  紀還比真實年齡還大，真的很有挑戰。」


  姜大衛希望大家看電影時，特別注意片中的臨時演員們，他指出，「雖然他們是臨演，但

  都十分出色，每位院友都有不同的殘疾問題，有說服力之餘卻不過火，演出經驗豐富讓我

  非常讚嘆，他們讓電影生色不少，更具說服力。」


  導演簡君晋希望透過電影表達：「這部電影呈現的畫面可能很絕望，但仍然有人堅持著向

  前走，為大眾發聲，希望可以因為這樣為社會帶來小小的改變。」全片將於17日在台上映

  。（編輯：張雅淨）1121106



  香港電影「白日之下」改編自真實事件，刻畫記者們如何深入黑心療養院、踢爆內幕，強

  勢入圍第60屆金馬獎5項提名。（台北双喜電影提供）中央社記者葉冠吟傳真 112年11月6

  日



  演員林保怡在香港電影「白日之下」飾演黑心療養院院長，獲得第60屆金馬獎最佳男配角

  提名。（台北双喜電影提供）中央社記者葉冠吟傳真 112年11月6日



  --'
