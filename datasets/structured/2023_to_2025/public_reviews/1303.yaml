url: https://www.ptt.cc/bbs/movie/M.1700237155.A.F4C.html
title: '[好雷]《白日之下》，即便徒勞，依然堅持正確ꨠ'
content: '部落格版：


  2016年11月6日，香港私營殘疾人士院舍「康橋之家」前院長兼社工張健華因涉嫌非禮被

  捕引發輿論。事發於2014年8月，事主母親到院探望事主時，意外在另一名院友手機裡看

  到事主與張健華在隔著磨砂玻璃的辦公室裡發生不雅行為的影片，追問之下才得知張健華

  用生殖器觸碰事主下體，讓事主母親氣得報警處理。經過警方調查，在辦公室內不僅發現

  沾有張健華精液與事主DNA的衛生紙，而從事主口供裡亦能得知，張健華曾經將生殖器插

  入她「小便的地方」，不僅事後會請她吃糖果，也曾用獎勵名義要求她脫褲子，最終張健

  華因非法性交罪遭到起訴。然而就在兩年後，雖然案件審訊持續兩年、香港律政司亦四次

  申請押後研訊，但最終還是在2016年5月撤銷指控，原因是遭到侵犯的事主經過多次醫療

  評估，院方評定事主罹患創傷後壓力症，加上本身智能上的缺陷，若是要求其出庭應訊或

  將讓她承受不住巨大壓力，無奈之下只得作出撤銷對張健華的指控的決定。


  好不容易無罪釋放的張健華，卻反過來以各種原因向律政司申請索償訴訟費用，只是讓他

  始料未及的是，最後不但遭到法庭裁決無須賠償任何費用外，還因為他主張自已是無辜的

  說詞與舉動，讓這整件事再度受到各界關注。張健華的辯解惹出爭議，更連帶被翻出過去

  在2002年與2004年曾先後因涉嫌非禮兩位智障院友被起訴，但皆因兩位事主的口供前後矛

  盾，法庭基於寧縱毋枉的原則，裁定他無罪釋放的過去。除此之外，康橋之下也被指出曾

  在短短8個月內有6名院友離奇死亡的事件，其中一名14歲的自閉症少年疑因拆卸窗花時不

  慎墜樓身亡，事後其母表示兒子自從入住康橋之家後，身上總不時出現大大小小傷口，詢

  問兒子後得到遭職員打的回應。連環爆出醜聞的張健華與康橋之家最終遭到社福署吊銷社

  工牌照及豁免證明書，成為自2013年實施殘疾院舍發牌制度後的首例。


  康橋性侵案引發各界關注涉及智障受害人的案件司法程序、相關法律保障等。後時任香港

  勞工及福利局局長張建宗允諾幾年內將會投入更多資源，除了增加康復服務人員名額、加

  強社區支援，此外也會設立更多合法且完善的殘疾人士院舍、日間中心與綜合康復服務大

  樓等。但此番允諾卻引來不少質疑，許多人認為香港智障人口高達10萬，遠遠超過張建宗

  所提出的康復服務名額，其住宿名額自然也不夠滿足需求，顯見「供不應求」才是最為迫

  切需要解決的問題。而早在康橋性侵案的前一年，連鎖養老院「劍橋護老院」就因涉嫌虐

  待院友遭到揭發、最終結束營業，此事同樣引起香港社會對香港安老院問題及長者長期護

  理政策問題的關注。回顧康橋性侵案與劍橋護老院虐待事件，雖然同樣都獲得了高度關注

  ，可幾年過去了、整個環境真有獲得改善嗎？在新聞話題與議題熱度退燒後，世界又有因

  為這些事件改變嗎？



  近幾年從《麥路人》、《濁水漂流》再到《白日青春》，許多香港新導演不約而同的將鏡

  頭對準香港社會議題、揭開香港隱密暗角，而今年則有《白日之下》。導演簡君晉以康橋

  性侵案與劍橋護老院虐待事件為題材，將兩起社會案件的情節搬上大銀幕，讓余香凝所飾

  演的記者曉琪帶領著觀眾，隨著新聞報導逐漸深入其中，去看體制內的無能為力，去感受

  體制外的矛盾拉扯。選擇記者為電影主角，當然多少會有對傳統媒體逐漸式微的感嘆，可

  重要的是跟著記者視角，觀眾反而能看見事件裡的一體多面，政府、機構、警方、家屬還

  有當事者，自然會因各自立場來對所謂的真相報導有著不同解讀，得到的反饋與造成的結

  果當然也就跟著不同。曉琪的報導讓相關議題獲得重視，看似能讓一切往好的發展，可對

  彩橋之家其他院友與家屬來說，這篇報導卻讓他們被迫離開，在院舍與相關機構供不應求

  的情況下，不曉得明天要住哪的無助讓他們對曉琪只有不滿。


  而如同章劍華犯下過不只一起的性侵案，但最後總能獲判無罪一樣，從過去到現在，不可

  能只發生過這麼一次彩橋之家事件，也肯定不只有曉琪一個記者報導過，可結果呢？世界

  還是沒有因此改變。當所追求的正義卻是別人眼中的惡意，當所認為的惡意卻是對許多人

  都好的解決方案，曉琪身為記者的信念怎能不受動搖？無力感於是湧上。可最後當通伯告

  訴曉琪「不要為了做對一件事情而內疚」時，不僅曉琪自己，我想就連觀眾心裡有某個結

  瞬間被解開了，不是因為自己被認同而感動，而是你終於知道或許有很多事情在當下看似

  徒勞，但當自己繼續堅持下去、當有更多人為了相同堅持努力，就有機會改變原本無法改

  變的事情的。從此來看，導演簡君晉也許最想帶給觀眾的，其實是這份信念的力量也說不

  定。


  導演簡君晉將兩起新聞事件巧妙合在一起，沒有去做過多的改編，而是將真實直接搬上大

  銀幕，惡人並沒有如眾人所願的得到報應，善良的人也沒有被溫柔的對待。章劍華就和張

  健華一樣無罪釋放，而遭到侵犯的院友小鈴與母親則承受著無法想像的壓力、選擇搬家。

  建立在真實之上，讓《白日之下》有著更多的寫實感，那些偶有的煽情與矯情本來認為太

  過理想，然而在讀過新聞報導與相關訪談之後，反而覺得這些現實裡所沒有的部分，像似

  導演簡君晉想要驅散黑暗的溫煦微光。讓本該客觀的曉琪走入其中，在私人情感與職業倫

  理之間拉扯，無法再客觀卻又必須保持客觀的為難，陷入了「想為這個世界做些什麼卻又

  害怕傷害到很多人」的兩難，只是在導演簡君晉的引導下，終將矛盾逐漸梳開，更感受到

  其中的暖意。



  「他是包袱、我也是包袱，人老了就是包袱！」


  「殘疾人士在世界上有多麼無助，拋棄他們的是他們的家人和這個社會。」


  《白日之下》在揭露香港社會詬病的同時，也帶著觀眾走入隱密暗角，去認識生活在其中

  的人們，然後看見他們的身不由己。曉琪其實過去不理解母親將父親送進老人院的決定，

  但在認識了通伯等虹橋之家的院友後，她逐漸明白了每個決定後面的苦衷，有太多太多事

  情是外人看不到的，選擇將父親、將小鈴、將明仔等人送進機構交給別人照顧，都好過在

  家裡折磨彼此，再多的愛終有耗盡的一天，不是嗎？虹橋之家院友的遭遇不會是首例，可

  是之所以院舍能夠繼續運作、章劍華還是可以換個地方再當院長，有多少是因爲親友的睜

  隻眼閉隻眼？他們其實都怕若是揭露，照顧的責任就又得回到自己身上，於是他們乾脆閉

  口不提。


  像父親過世後，母親嘮叨著自己終於能搬去想住的地方，說話的樣子是鬆了口氣，對這些

  院友的親友而言，假使他們的親人真的離開人世，何嘗不是種解脫？也許某方面來看，感

  激甚至多過了怪罪與歉疚，所以當時作出宣判的法官才會說張健華的無罪是「幸運」的吧

  。可悲嗎？是可悲，只是好像更多的是無力。《白日之下》是部情感與議題性兼具的電影

  ，是有成功的達到本來的目的，各方各面都有被照顧到，而幾位主演、不僅是入圍金馬獎

  的余香凝、林保怡和梁雍婷表現精彩，被視為遺珠的姜大衛、飾演院舍職員的寶珮如和飾

  演明仔的周漢寧都繳出讓人深刻的表演，只是在所入圍的五項獎項裡，或許最具競爭力的

  會是林保怡與梁雍婷。


  林保怡和梁雍婷在有限的篇幅裡將各自角色塑造完整且立體，在角色受到的身體與精神上

  的殘疾的限制下，依然能將角色情感與情緒完整表達，甚至是相當濃烈的，讓觀眾產生對

  其角色的厭惡與心疼，得獎機會確實不小。只是在同個獎項競逐的，前者碰上來勢洶洶的

  《老狐狸》陳慕義，後者則對上演技同樣層次分明、可戲份更為吃重的《小曉》裡的陳意

  涵，如未得獎是不冤，但就是很可惜。要是讓我選擇兩人中只有一人能得獎，我會選擇梁

  雍婷。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
