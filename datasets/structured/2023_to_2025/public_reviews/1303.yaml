url: https://www.ptt.cc/bbs/movie/M.1700409293.A.DD6.html
title: '[好雷]《白日之下》真實悲劇的克制復現 '
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  1.影片名稱：白日之下


  2.觀影時間：2023/11/19


  3.觀影地點：誠品電影院


  4.觀影方式：自行購票


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  部落格圖文版：


  「你覺得十年之後，還會不會有記者？」


  《白日之下》的劇情設定，讓我不禁連結起過去一年中兩部同樣圍繞著「公義」兩字的香

  港電影。其一，是深入探討陪審團制度的《正義迴廊》；另一部，則是主角群們把握任何

  翻案機會，只盼能彰顯「天有眼」的《毒舌大狀》。


  上次接觸到本片導演簡君晉的作品，是大量翻玩社會怪象的創業喜劇《IT狗》，因此我原

  先期待《白日》在風格上會更靠攏《毒舌》，更跌宕起伏一些。然而隨著情節不斷推進，

  卻遲遲等不到峰迴路轉，反而無力感越來越重－揭露真相又如何，「這些所謂的制度，連

  一個小女孩都保護不了」。


  「十年之後，還會不會有記者？」而回望曉琪對同事亮的提問，又或著說，真相是否仍然

  那麼重要？


  電影以曉琪刊出「彩橋之家」將老人院友推到露臺上「露天淋浴」的報導做為分水嶺，當

  印報機高速運轉，全新聞社都為曉琪的報導感到振奮，《白日之下》卻沒有朝著「惡人終

  有惡報」的方向前進。殘疾院舍仍然如常運行，先前院長一邊扮鬼臉、一邊用雪糕將小鈴

  引進辦公室的隱晦伏筆更得到證實－假「淘耳朵」之名，行「愛護」、性侵弱智院友之實

  。


  而《白日》的反高潮並沒有到此為止，即便有通伯的錄影為證，檢控官與法官交頭接耳後

  ，居然還是因為小鈴無法出庭而決定「撤控」。最終院舍被撤牌，總算是得到了些象徵性

  的懲罰，在大雨中被千夫所指的卻是揭開真相的曉琪，而非始作俑者的院長。我原先還有

  一絲期盼，曉琪或許會因為原生家庭的齟齬，因而和在調查過程中建立起深厚羈絆的通伯

  成為家人，但終究事與願違。


  「不要為做了一件對的事而內疚。」


  在一波又一波的反高潮中，《白日之下》沒有任何一條線以「團圓」做收，反倒是曉琪對

  院友們從反射性地排斥到關愛，對通伯、水哥源自虛假，卻在不知不覺中漸漸真實的「親

  情」，在她和我們的心中都留下了些什麼。


  和曉琪非親非故的通伯，始終是最適合在大雨與指責聲中鼓勵她，替她戴上自己的帽子擋

  雨的人。在姜大衛不同模式的演繹下，通伯的「裝傻」早有端倪。我起初擔心他「清醒」

  時對沒有家人的感慨，會導致曉琪穿幫，然而當曉琪與亮甚至能潛入院舍做飯、埋伏整晚

  ，其實根本沒有足夠的人手去照顧、關懷這些院友。


  通伯與曉琪純然源自認同的羈絆，讓臨別顯得真摯。不管是電影中的調查真相也好，或是

  現實中種種的困難也好，怕失敗難道就不去做，「人生中很多時候都沒得選，會選的人不

  多，選對的人更加少。」難道因為這樣，就連試都不試？


  在看完《白日》之後，我才發現片中的女孩小鈴，居然是由梁雍婷飾演。她和飾演男孩明

  仔的周漢寧對各自角色心智、遭遇的揣摩，真的無從挑剔。另外余香凝從公事公辦到放感

  情的轉變，在外出參加婚宴時與姜大衛、胡楓間展露無遺的友誼，還有林保怡、寶珮如，

  以及龔慈恩三人從偽善、冷酷，到懦弱三種不同層次的惡，都在在構建起了「彩橋之家」

  的不同面向。


  「人老了，就是包袱。」


  「我感覺我好像解脫了。」而無論是明仔媽媽在祭拜墜樓身亡的兒子時「鬆一口氣」的感

  覺，曉琪與母親間為了父親生前照護問題的爭執，還是水哥在孫女婚宴被女兒掃地出門，

  透過角色的言談和神色大概能猜出各自家庭中的難題，可惜的是電影並未在此著墨太多。


  後來查了「大埔劍橋護老院」、「葵涌康橋之家」，以及「國寶之家燒賣飯」等等電影原

  型的關鍵字。雖然將所有的惡一次集結於片中的「彩橋之家」，但從各種惡行到「夢遺」

  等狡辯之詞，《白日之下》幾乎沒有任何「原創」成分。就連曉琪假冒成通伯孫女，都還

  原了當時的記者得以進入院舍，揭露真相的方法。


  戲裡，電影先是用不帶太多情感、寫實的旁觀視角記下看護芳姐虐待院友的罪證，確立敘

  事調性。因此當曉琪與亮衝上制高點，即便令余香凝險些呆立在當地的「露天沖涼」再超

  出我的想像，《白日》抽離的調性讓「真相」的衝擊力得以完全發酵。而當真相在戲外被

  印證成為「真實」，力道與無力感更進一步延展。


  「如果有人記得的話，兩天也好。」


  然而我始終期待著電影能在寫實的主線外，留下一個「魔幻時刻」－或許是曉琪，又或許

  是通哥突破了困境。可惜《白日之下》一冷到底－白日之下，盡是不公不義；只有在大雨

  中，才見真情。


  --


  部落格：

  FB粉專：


  --'
