url: https://www.ptt.cc/bbs/movie/M.1757344479.A.A92.html
title: 'Re: [新聞] 堂姊妹高中生看國片「進行曲」遇襲！遭男'
content: '是在靠杯

  今天是鬥陣欸在旁邊聊天用手機你敢靠北他們嗎

  講白了就是自己情緒控管有問題的怪咖在外面欺負兩個規矩不好的倒霉小孩而已


  看電影用手機還是聊天，甚至踢椅背

  都有更好的處理方式

  再不然至少都可以請影廳工作人員處理

  觀影民眾違反影廳規定本來就有相關法條可以請他們離開

  不要在那邊跟我講什麼打得好打得棒

  欺負弱小我是看不出來棒在哪裡

  小朋友讓社會教育可不是用這種教育方式

  比例原則聽過吧

  你把人家拖出去外面踹，對方是在你看電影的時候吐口水在你爆米花桶還是臉上了是不是

  你忘了捷運上禁止飲食喝了口水，我把你拖出來痛毆

  你臨停紅線去7-11借個廁所，我把你拖出來痛毆

  你在等紅綠燈時用手機滑一下PTT，我把你拖出來痛毆

  你去萬華跟娼妓問能不能不要戴，我把你懶叫痛毆

  什麼事都用暴力解決，看不爽就打，就扁

  這是什麼可悲的社會



  說真的啦，這個社會的仇恨氛圍這幾年明顯升高

  因為一堆二十歲開始活網的年輕人現在也都變成了四十出頭的中老年人了

  沒有成為自己年輕時嚮往的模樣就算了

  高不成低不就的內心還充滿仇恨

  整天在網路上口嗨，帶頭作亂

  把自己的可悲怪罪到整個世界

  每天在那邊這個該打那個該打

  哪天別人真的動手打在你家人身上的時候你也是幫兇你知道嗎

  不管做錯什麼事就要痛毆一頓，那最該被扁的就是口嗨仇恨仔



  講一個跟電影有關的以免被刪文

  當年超人特攻隊2上映時我自己去看

  隔壁坐了一個也是自己來看的年輕女生

  在演到彈力女超人在播音室打鬥的時候她突然轉頭問我能不能幫她打開水的瓶蓋

  實在太浪漫太做球了

  但那個時候的我沈浸在彈力女超人會不會落入壞人的圈套裡，為彈力女超人緊張

  所以我隨手一扭，然後把水還給她

  她用著甜美的聲音跟我說謝謝

  但我僅是點個頭回應，兩眼死盯著螢幕

  一直到電影結束散場時，我回神過來

  才發現我是不是錯過了什麼

  這是我內心深深的遺憾

  而且超人特攻隊2讓我很失望，我竟然為了這部不怎麼樣的續集錯失良緣

  我這輩子都遺憾

  超人特攻隊我真的對你很失望


  那為什麼我會有這麼美好的豔遇你們沒有

  因為我內心充滿良善

  跟2025超人一樣

  希望大家都能跟2025超人一樣

  謝謝大家




  -----

  Sent from JPTT on my iPhone


  --'
