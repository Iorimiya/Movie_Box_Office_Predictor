url: https://www.ptt.cc/bbs/movie/M.1757323192.A.A08.html
title: '[新聞] 堂姊妹高中生看國片「進行曲」遇襲！遭男'
content: '新聞網址：


  堂姊妹高中生看國片「進行曲」遇襲！遭男甩出毆打 演員私訊關心


  記者 李盈萱 洪彩綸 / 攝影 黃國鈞 / 責任編輯 新聞中心 報導

  發佈時間：2025/09/08 13:18

  最後更新時間：2025/09/08 15:46


  兩名女高中生在電影院遭遇毆打事件，引起社會關注。這對堂姊妹原本相約觀看國片「進

  行曲」並期待參加映後的演員見面會，卻在觀影過程中遭到一名陳姓男子無故毆打。事件

  發生後，女孩們因就醫而錯過了與偶像互動的機會，電影演員得知後透過訊息表達關心。

  女孩父親表示，女兒們已產生心理陰影，同時他也願意出資邀請同場觀眾再次觀影，以彌

  補因處理事件而影響其他粉絲的觀影體驗。


  9月7日，國片「進行曲」在台中舉辦映前映後見面會，兩名女高中生堂姊妹前往觀影，期

  待能與偶像近距離互動。然而，在電影播放過程中，一名陳姓男子突然對坐在前排的兩名

  女孩出手毆打。根據女孩父親描述，陳姓男子先將姪女甩出去，當女兒上前阻止時，對方

  又朝女兒左臉打了兩次耳光，整個毆打過程持續了十幾秒。


  事件發生後，女孩父親趕到現場，要求現場人員不要移動，等待警方到場處理。由於影城

  監視器只拍攝到螢幕畫面，未能記錄第一排前方的空間，因此無法確認完整的毆打狀況。

  陳姓男子被帶到派出所後，被質問為何打人時，他辯稱是因為女孩「干擾到他看電影」。


  電影演員得知粉絲受傷後，主動聯繫兩人家屬，透過訊息表達問候與關心，詢問兩位女孩

  的傷勢狀況，並擔心她們會因此留下心理陰影。女孩父親透露，女兒表示以後看電影時需

  要父親陪同，顯示這次事件已對女孩造成心理影響。


  女孩父親感到遺憾的是，因為處理這起事件以及等待警方到場，影響了其他粉絲的觀影體

  驗。他表示願意自掏腰包購票，邀請同場的觀眾再次觀看「進行曲」，希望能彌補因此事

  件而造成的不便。

