url: https://www.ptt.cc/bbs/movie/M.1450377749.A.4A7.html
title: 'Re: [討論] 為何星戰帝國進行曲那麼像斯斯感冒藥'
content: '這個不算抄襲喔，專業上，這叫作相似的旋律「動機」，而且後面發展也不

  一樣。這樣沒辦法說是抄襲，頂多可以說是模仿。


  簡單說一下，啥是動機，最簡單的動機就是特定距離的兩個或三個音符，

  用特定的節奏律動彈出來，讓你有一種「發動」的感覺。


  例如說|1 - 5 -| （do，休息一拍，so，休息一拍），這就是星際大戰主題

  曲的動機，這是很多太空音樂起手式，也是很多古裝片表示隆重感的基本作

  法。例如世紀帝國遊戲裡被敵人攻擊時，聽到的警告聲，就是急促的1515!

  1515!


  借用人家的旋律動機改一改來作自己的音樂不是罪惡，那跟寫文章模仿人家

  修辭的技巧，轉化過來寫自己的文章一樣，就只是「一個招式」，學了，然

  後變招，再自己設計組合技，發展出自己的風格，那就是自己的創作了。


  就連John Williams老阿公，他作星際大戰的配樂，有很多招式其實來自更

  早，古典音樂時代，英國作曲家霍爾斯特《行星組曲》，聽看看

  其中的the Planets, Op. 32  Mars - The Bringer of War


  光聽這一段，你應該會發現也有很多似曾相見的感覺，好幾首星戰戰鬥

  相關的配樂的一些梗好像啊～ XD


  最後，請大家起立來一起唱歌！


  --

  the First Order帝國軍莒光日主題歌：我們敬愛的達斯維達


  班長：每個人都要唱！大聲唱！


  --

  這樣叫抄襲： 那我直接把一首歌從新編曲不就叫模仿 頗ㄏ


  這還是抄襲： 那我直接將一首歌重新編曲不就叫模仿 頗呵


  這也是抄襲： 那麼我直接把一首歌重新編曲不就叫模仿 頗呵


  這叫改編： 那我直接將一首歌重編，這樣還可以說是模仿嗎？


  這叫模仿：那我直接把一篇文章從新編排，不就叫模仿，頗ㄏ


  這叫使用相同「動機」：開車去台北就好了？

  抄襲跟模仿是不同的。


  星際大戰的故事叫做：「很久很久以前，在一個銀河系....」

  這招承襲自傳統童話故事：「很久很久以前，在一個地方.....」

  這不代表星際大戰「抄襲」安徒生童話、格林童話，因為開端類似，但是後面的發展不同

  。


  至於永邦是不是模仿，大家都很清楚。'
