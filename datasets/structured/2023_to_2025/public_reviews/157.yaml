url: https://www.ptt.cc/bbs/movie/M.1450357408.A.A56.html
title: '[討論] 為何星戰帝國進行曲那麼像斯斯感冒藥'
content: '斯斯



  2%E8%A1%8C%E6%9B%B2-%E6%98%9F%E9%9A%9B%E5%A4%A7%E6%88%B0




  帝國進行曲


  不騙你

  如果不是約翰爺爺中間用的間奏很優美

  有一段真的讓我忍不住哼

  痠痛疲勞用斯斯


  台灣廣告商的洗腦真的很可怕


  我覺得這樣侵略性殘忍的帝國

  應該是用很成人的旋律

  就像達斯魔那樣的命運之戰



  或是安納金岩漿英雄之戰



  不然也可以學大白鯊的恐怖路線



  為何當時喬治導演要約翰爺爺把帝國處理的那麼 童趣

  我今天還是不明白


  不過星際大戰真的啟發很多作品

  比如ff12的帝國主題曲

  感覺就是改造星戰帝國的作品






  真不知道喬治怎麼想的


  --


  斯斯的原曲是

  石原裕次郎 嵐を呼ぶ男



  爵士樂

  和約翰威廉斯本名強尼威廉斯一樣

  天啊～英文通常y字都有淘氣的感覺

  都是爵士樂出身


  對了！


  推了！'
