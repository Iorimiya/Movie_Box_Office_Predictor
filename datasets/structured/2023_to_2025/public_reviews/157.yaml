url: https://www.ptt.cc/bbs/movie/M.1758058545.A.2BF.html
title: '[好雷] 進行曲'
content: '我個人高中是旗隊的，大學時也有報考台北樂府錄取。


  但是最後被爸媽以曬太黑對女生不好勸退，心裡一直留有小遺憾，後來看鬼滅也可以理解

  甘露寺的心情（喂）


  所以讀MBA的時候選修創業課程，希望可以在台灣辦一個像寶塚一樣的收費定點表演，內

  容就是行進樂隊。


  2022年建中去荷蘭比賽WMC時我還跑去當觀眾側錄，目前影片放油管超過八千次點閱。以

  上敘述想交代本人的熱誠，導致本片對我來說很好看。我覺得導演與團隊很用心了解行進

  樂隊。


  即使本片都沒什麼交代到我的母校，我依然盲挺。


  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  我本片最喜歡的人物是講話平常比一般人慢速的蘇子。


  這部片讓許多配角也有發揮空間，訓導主任最後為學生挺身而出，就像怪奇物語第一季的

  史蒂夫浪子回頭，喜歡這個安排。


  邱大成的爸媽我也很喜歡，他爸是難得台語流利又正派的人物。（電影美國女孩裡面會講

  台語的角色都不是什麼好咖。）


  流川的設定讓我想到我以前的家教學生，他爸媽事業有成真的很忙，他帶同齡學生回家炒

  飯，（雙方都未成年），還跟我報告爸媽不在家都沒發現。


  江爸李李仁在長官肯定建中西索米吹得出色後，才開始改觀，這告訴我們平常真的要多說

  好話，可以不知不覺挽救破碎的家庭。因為很多人都活在別人的眼光裡。


  少子化加上網上娛樂太豐富的今日，能遇到這樣的清新懷舊小品，稍稍帶有bromance 的

  腐味，希望能上檔久一點。加油！亞洲的第一支行進樂隊電影！


  --'
