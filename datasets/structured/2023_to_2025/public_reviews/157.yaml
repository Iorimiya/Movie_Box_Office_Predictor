url: https://www.ptt.cc/bbs/movie/M.1756466192.A.F45.html
title: '[好雷] 進行曲'
content: '~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  前陣子有些同學朋友跟我推薦說，

  有部熱門的外國賽車電影很好看，

  從頭到尾沒有冷場。


  結果我上網去看，只看到中段沒再看完；

  或許每個人喜愛的口味真的不一樣吧。


  我的感覺是，

  要做到從頭到尾沒有冷場，

  真的相當不容易。


  -

  後來的近期，

  我自己是慢慢感受到一股國片的熱潮，

  又慢慢迎面襲來。


  看過其中幾部近期即將上映的電影預告片之後，

  最期待的就是今天中午剛去戲院看完的《#進行曲》。


  整部片的組成元素從「學生與老師」、「男孩與青春」、「學校與家庭」、「比賽與音樂

  」、「舊傳統與新現代」，

  還有每位很好的資深與新進演員等等；

  或許就是完全迎合了我的個人喜好，

  所以即使感覺像看到《那些年》與《刻在你心底的名字》等片的影子，

  我還是覺得真的，從頭到尾沒有冷場。


  (有雷慎入)


  試想，當我看 牧森 用感性的聲音 與 新人王 流川 帶領主力演員的故事看到懷疑有點無

  力時，

  帥爸爸 李李仁 會站出來。


  然後，最耍酷的主任 馬志翔 會站出來、老師 黃迪揚 也會站出來。


  然後，隔壁棚的大哥大 孫鵬，怎麼也來了？


  甚至，聽得到 徐乃麟、蘇慧倫…。


  重點是，所有的橋段都排得很好，

  不會讓你覺得說大哥大好笑就一直出現大哥大。


  唯一想挑剔的，

  大概是那些為了爭女孩而回頭找新人王 流川 算帳的次數是不是多了點…(故事主軸)

  -

  心得文寫這樣長卻不專業，

  我也滿怕被筆戰，累了休息去啦...orz


  希望下個月之後還有更精彩的國片，感謝您哦


  --'
