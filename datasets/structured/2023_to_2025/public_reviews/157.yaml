title: 'Re: [新聞] 堂姊妹高中生看國片「進行曲」遇襲！遭男'
content: '本來想進場看的  畢竟我很支持國片


  但沒想到是干擾其他觀眾的兩女得到演員的安慰



  打人是不對啦


  但被打的是影響其他喜愛這部片的害群之馬



  反而想好好看這部片的優質觀眾因為被害群之馬干擾  導致觀影體驗毀了


  有可能以後這位先生不再進場支持國片了


  然後沒家教的害群之馬繼續進場


  繼續滑手機 講話聊天干擾其他觀影人


  連鎖反應之下   沒有優質觀眾進場


  進場的都剩這種人


  國片處境越來越糟糕


  所以我這片就不進場囉   劣幣驅逐良幣







  -----

  Sent from JPTT on my Samsung SM-N770F.


