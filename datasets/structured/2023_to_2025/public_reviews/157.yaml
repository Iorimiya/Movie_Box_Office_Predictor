title: '[討論] 國片《進行曲》'
content: '最近滑到《進X曲》的預告片，


  第一眼是注意到演員的氣場，揮汗練習的畫面確實很吸睛，

  但仔細看又覺得不只是帥哥福利


  那些片段好像暗示著隊伍之間除了比賽，還有更深的同儕衝突


  短短幾秒，就能感覺每個角色背後的壓力

  有人咬牙死拚、有人情緒壓抑，甚至那幾個眼神戲，都蠻有戲感


  而且氛圍的處理蠻特別的，雖然有熱血的練習場面，

  但整體調性卻偏沈穩甚至帶點壓迫，感覺不像是單純的「爽片」


  另外有注意到這部國片是由《角頭》系列導演姜瑞智執導，

  編劇是陳慧如（《痞子英雄》編劇之）跟黃致凱，監製則是陳鴻元

  從製作團隊看起來，應該不是只打青春熱血牌，想結合娛樂性和戲劇張力


  我自己是覺得，這部片可能會比一般的校園題材更「深一點」


  有人也被預告片的氛圍勾到嗎？還是單純覺得就是看帥哥肌肉就好XD？

  距離上映只剩一週，蠻期待大螢幕的完整呈現，也好奇導演最後會怎麼收


  --'
