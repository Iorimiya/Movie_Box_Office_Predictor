title: '[  雷] 進行曲'
content: "雷文防雷資訊頁\n \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n \n\
  \ \n \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n \n \n雷文防雷資訊頁\n\
  \ \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n \n \n \n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n \n \n \n坦白說。看完有點失望。\n並不是不好看，而是跟想像中有落差。\n\
  有些電影預告剪的太好了，加上自己腦補在進場前會以為這是95分甚至98分\n當實際看完正片只有85分的時候就會有點失望\n如同片中講的：就是因為你比別人優秀才會背負更多期望\n\
  \ \n先講講優點吧\n這部主題就是樂隊，整片就給你滿滿的樂隊\n比賽場上出現的校名很多都是還在發光發熱的樂儀旗隊\n無關主線的事情幾乎很少，感情線也砍掉\n\
  整部片精煉到只剩樂隊練習過程、校園生活、家庭情感\n另外一個優點，就是年代感，林強的向前走出現了好幾次。開頭也直接採用懷舊片段\n \n缺點發生在結束前的幾分鐘\n\
  最終決賽的時候我正要用電影院的大銀幕享受樂儀隊比賽\n偏偏要插幾個小混混進來鬧事\n雖然樂隊繼續演奏，但是根本沒辦法專心看樂儀隊比賽\n片尾我正要用影院音響好好享受新版的向前走\n\
  然後就硬要在一起播花絮\n真的非常影響觀看心情\n尤其是這部是音樂主題的電影，竟然不讓觀眾好好享受音樂，大扣分！\n\n \n個人主觀評分：8/10\n \n\
  題外話：每年嘉義國際管樂節真的很精彩，喜歡管樂不要錯過\n \n--"
