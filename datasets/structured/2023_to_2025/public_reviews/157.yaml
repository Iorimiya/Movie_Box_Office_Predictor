url: https://www.ptt.cc/bbs/movie/M.1757349856.A.F8B.html
title: 'Re: [新聞] 堂姊妹高中生看國片「進行曲」遇襲！遭男'
content: '跟一下熱度


  最近看電影遇到一種很討厭的類型，每一場都遇到 =  =






  假設是票載15:00的電影


  我們這裡的電影院會先撥放近十分鐘的預告+影廳廣告


  之後會撥放影片開始撥放的提示影片 (緊急出口、禁止錄影、隨身物品帶走)


  這段時間會慢慢熄燈，之後才會撥放正片


  也就是1510甚至1515進場，都還不會錯過正片而且沒有完全熄燈


  但是我們這邊每一場都有大概1520正片開始播了才進場的

  真的有夠靠杯的


  準時進場好像很困難一樣，都給你10分鐘緩衝了


  你們那邊也有這種嗎??





  再來身為柯南愛好者，我絕對不挑週末進場


  避開16歲以下的族群真的很重要


  --'
