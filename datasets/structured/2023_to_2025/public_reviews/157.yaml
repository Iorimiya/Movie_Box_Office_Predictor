url: https://www.ptt.cc/bbs/movie/M.1757774171.A.624.html
title: '[普雷] 進行曲 沒有好劇本 可以不用硬拍...'
content: '最近把所有電影都看了一輪


  看了版上一堆好評，一直猶豫要給普還是負


  單就電影而言算是偏難看


  但又能感受到演員很努力


  導演也很盡力想讓螢幕表現豐富精彩



  打破校園劇必備的愛情元素


  這齣劇沒有，耍了個騙你的小幽默


  劇名也騙你，其實音樂歌舞並不是重點


  就是很簡單的呈現青春校園的社團生活



  難看的部分就是江浩演技有點生硬


  唸台詞讓人一直很尷尬


  反觀流川設定雖然中二，但演出就自然很多


  加上劇情上沒什麼高潮


  最多就是和父母起升學衝突、外校流氓


  所以為了豐富內容，硬是塞了很多巧思


  像拉書本那段就非常尷尬，小學生比較會這樣玩



  最後就像開頭說的，電影從頭到尾


  都能感受到全劇組盡心盡力想讓成果精彩


  可是故事本身並沒什麼看點


  如果下檔後 配飯，順便回味校園生活還行


  但要特地到影院看，我是覺得大可不必



  --'
