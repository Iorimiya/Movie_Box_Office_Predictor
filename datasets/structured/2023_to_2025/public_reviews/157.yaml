url: https://www.ptt.cc/bbs/movie/M.1757738485.A.9C4.html
title: '[普雷] 進行曲'
content: '大部分電影行銷宣傳通常是為了給電影加分，很少看到反倒在扣分的，在戲院牆上看到一

  群裸上身男子在跑步的畫面，我還以為《進行曲》是什麼中二軍教片類似《新兵日記》，

  直到看過板上PO文才知道是青春校園競技片，而且還是真實改編建中樂旗隊的故事。這部

  片海報真的很明顯在扯票房後腿，都可以當作最佳反面教材了。



  在脆上有看到行銷相關人員釋出定版前的八版海報給網友票選哪張好，結果我跟網友跟內

  部人員票選前三名相同，偏偏製片選擇了最後一名當作媒體戲院宣傳海報……既然這麼不

  信任專業人員及觀眾口味，那票房這麼差就該自己檢討。



  校園競技題材在台灣雖然不算大眾，但一定有基本盤在（至少我很喜歡），好好完成片子

  再好好宣傳，就算不能大賣也至少能賣個幾千萬。相關題材我第一個想到就是改編自景美

  女中拔河隊的《志氣》。



  同樣取材真實高中校隊比賽得名的故事、同樣有師生衝突家庭問題課業困擾、同樣只有滿

  身傷痛但缺錢，《志氣》雖然沒什麼突出的設計，但整體架構及劇情起承轉合掌握很好、

  完全沒失焦，行銷宣傳也到位、滿滿都是努力奮鬥熱血的氛圍，我記得當年好像沒有看到

  不好的評價，而《進行曲》給我的卻只有煩躁感及滿腹的疑問。



  對，就是一股同溫層很厚、聽不進人話的中年自大說教男給人的煩躁感。最大的煩躁感當

  然就是海報問題，都什麼年代了為何會覺得賣肉有用？聽說製片是不想大眾把焦點擺在建

  中菁英生身上、也覺得樂隊表演題材小眾，那我就更想問所以你改編這故事要幹嘛？不就

  是因為覺得這題材有趣才會想要拍成電影嗎？真的是賞自己及全劇組巴掌。



  另一股煩躁感就是小混混找碴真的很破壞節奏，找碴兩次剛好，第三次已經夠多了，沒想

  到還有第四次而且還發生在比賽中！如果只是要讓主角受傷，難道不能在比賽前一天、甚

  至當天出發會場前發生嗎？比賽不好好比卻一直在穿插小混混找碴鏡頭打斷觀影情緒，這

  樣有很青春嗎？表演過程有一半隊形都少一個人還可以拿冠軍，我只覺得根本在汙辱其他

  隊伍。



  片中師長只有說教卻沒有多加描寫心境的轉換也令人煩躁，究竟李李仁演的爸爸這麼逼迫

  小孩不准練樂器的原因為何？除非小孩是吊車尾進建中而且幾乎都考不及格，不然通常第

  一志願的家長才不會這樣管教小孩課業咧= =但過程都沒多加描寫，只是父子吵個架又被

  長官摸個頭就萬事太平了也太簡單。馬志翔演的主任態度轉換也是同樣的問題，沒什麼說

  明就突然跟學生變同一戰線實在突兀。



  撇除這些問題，實際上這部片題材很好，新演員雖然演技稚嫩但仍有演到位，懷舊美術造

  型場景也很還原三十幾年前的年代感，徐乃麟的歌名哏我超喜歡XD最大優點就是沒有談戀

  愛的劇情、只當作起爭執的導火線而已，劇情都聚焦在樂隊努力奮鬥得勝上面，這部分才

  叫青春吧，才不是小混混打架的橋段。



  這部片對我來說就像是明明清蒸水煮就很好吃的優秀食材，卻煮成重油重鹹重辣的重口味

  難吃料理，恨鐵不成鋼啊實在可惜。給題材的評價是好雷，但成品及包裝不佳所以變普雷

  。



  --'
