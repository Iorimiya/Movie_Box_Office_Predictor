url: https://www.ptt.cc/bbs/movie/M.1524707705.A.10E.html
title: '[好雷]復仇者聯盟3-等待十年的悲愴英雄進行曲 '
content: "長達十年的等待, 在首映日體驗漫威超級英雄第1階段集大成電影,\n就像是羅貫中三國演義開卷詩所寫的:\n\n滾滾長江東逝水，浪花淘盡英雄，\n\
  是非成敗轉頭空，青山依舊在，幾度夕陽紅；\n\n白髮漁樵江渚上，慣看秋月春風，\n一壼濁酒喜相逢，古今多少事，都付笑談中。\n\n不管是正面英雄還是反派魔王,\
  \ 都有各自的使命感和強大能力, 大家\n都卯足全力來追求理想/目標的實踐, 殺得天昏地暗風雲變色, 熱血\n澎湃盡在其中, 不只帶給觀眾們一場視覺饗宴,也牽動了漫威宇宙未\n\
  來發展的重要里程碑!\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n[有劇情雷請慎入]\n............................................................\n\
  \n這部電影把過去十年復仇者聯盟的主角群聚在一起, 敘事流暢且架構龐\n大, 由於粉絲們已對他們的個性有所了解, 因此雖然電影節奏快速, 不\n影響觀眾將情感投射到角色中,\
  \ 這種奇妙的連結在電影結束後還意猶未\n盡, 恨不得馬上看到復仇者聯盟4知道反派大魔王的下場。\n\n坦白講, 真的要笑談本片的結局, 我想心理素質應該要很強大,\
  \ 因為導\n演把粉絲們的情緒帶到最高點炸開, 不管好的和壞的記憶一時全都湧上\n心頭, 之前打賭猜哪些主角會領便當, 結果也有些出人意料, 只能佩服\n羅素兄弟的導演功力不同凡響!\n\
  \n在結局時刻, 薩諾斯啟動六顆無限寶石彈指秒殺宇宙二分之一人口時,\n我看到兵不血刃, 被領便當者瞬間灰飛煙滅, 類似場景在星際義工瓦雷\n諾的重要配角泡泡死亡時,\
  \ 也是這樣「塵歸塵, 土歸土」般地瀟灑離世\n, 在這個時刻我們知道支撐這個大魔王拚戰到最後的絕望時刻到來, 有\n一種「天地不仁, 萬物如芻狗」的無力感!\n\
  \n活下來的英雄們, 有鋼鐵人東尼．史塔克, 雷神索爾, 美國隊長羅傑斯\n, 綠巨人浩克, 黑寡婦, 火箭浣熊, 涅布拉, 瓦甘達女將軍等人, 看著\n同伴快速死去的感受,\
  \ 想必是非常難受。而劇情中間薩諾斯把養女葛摩\n拉推下祭壇摔死, 看著她滴下的眼淚, 到底是真感情還是「鱷魚的眼淚\n」,實在是相當複雜的情緒! 有人說:「成大事者不拘小節」,\
  \ 他會犧牲\n所愛來奪取靈魂寶石, 果真是豬狗不如的梟雄啊!\n\n誠如在本集也壯烈成仁的奇異博士所說: 這是走向最終戰局的必要(犧牲\n)過程。我想粉絲們看到最後一幕薩諾斯平靜起身看著遠方風景,\
  \ 會氣得\n牙癢癢地, 這個大魔王真是殘忍偏執的怪異組成, 讓宇宙少掉一半的人,\n活下來的就一定會幸福嗎?\n\n走筆自此, 我想起唐朝呂洞賓的一首詩, 描述著高處不勝寒的英雄心境,\n\
  不管是正面英雄, 還是已入魔道的反派霸主, 我覺得在這部電影最後營\n造的氛圍都讓人有深刻的感觸, 在此野人獻曝, 獻給各位粉絲們品味之!\n\n《絕句三十二首，其十四》\n\
  \n◎唐．呂洞賓\n\n獨上高峰望八都，黑雲散後月還孤。\n茫茫宇宙人無數，幾個男兒是丈夫?\n\n--\n                  樂活人醫\n==========================================\n\
  \   有奮鬥過、有努力過，曾忠於某些理想，\n   這就足以讓掙扎變得值得。(威廉·奧斯勒)\n 欲為醫者，必先為人也! (高木友枝/杜聰明)\n==========================================\n\
  \n--"
