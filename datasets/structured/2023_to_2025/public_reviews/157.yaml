title: '[換票] 11/12 明日進行曲特映換任一特映會'
content: '大家好：


  不知道可不可以這樣換，若有違法版龜和我說會自刪


  是這樣的，之前抽到11/12 18:50@in89豪華影城《明日進行曲》金馬影展特映會兩張票


  但臨時那天晚上有事無法QQ但還是很想看特映會，想問看看有沒有人有興趣


