url: https://www.ptt.cc/bbs/movie/M.1755342317.A.1C0.html
title: '[好微雷] 什麼樣的國片會紅? 《進行曲》後感'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  台灣國片很奇妙，某些片票房暴衝，某修片卻幾乎沒人提。看久了會讓人開始想，究竟什麼樣的國片題材比較有競爭力?


  最近幾年比較有聲量的國片：


  *奇幻+喜劇：《鬼家人》票房破譯，靠的是 BL+喜劇+感人親情，題材算新鮮

  *黑幫類：《角頭》系列還是有市場，但年輕觀眾不買單

  *校園愛情：《那些年》《我的少女時代》是經典，但後來很多模仿的青春片兒而表現普通

  *驚悚恐怖：《女鬼橋》這類校園恐怖，意外票房不錯，但很快就被淡忘

  *小眾文青：有些影展掛的電影，評價好但票房慘澹，一般觀眾可能也沒心思在乎那些隱喻


  看下來，好像要嘛就是「娛樂性很強」的爆米花電影，不然就是「能哭能笑、感情共鳴」很重的電影才會紅

  最近剛好看了台北電影節的閉幕片《進行曲》，本來想說就是單純的建中樂隊校園故事，結果大家反應都還不錯，有哭有笑，裡面的新人演員意外演的不錯，特別是那個演學長的余杰恩，明明自己也很菜，卻也很努力的逞強當大人，撐起一整個社團的樣子，真是讓人心疼的孩紙


  只能說，台灣拍校園，拍夢想，真的還是有它的魔力。

  只是每次成功的元素都不一樣，在台灣拍電影不容易啊


  --'
