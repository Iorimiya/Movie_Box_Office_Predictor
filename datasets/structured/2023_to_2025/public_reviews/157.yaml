url: https://www.ptt.cc/bbs/movie/M.1757330085.A.161.html
title: 'Re: [新聞] 堂姊妹高中生看國片「進行曲」遇襲！遭男'
content: '因我的粉專輾轉收到此位男性當事人請求，所以代為發文；該當事人因此新聞中的“無故

  ”字詞，覺得有必要從他的角度來說明此次事由。


  事件說明如下：


  電影是晚上17時許開始播，我買在1排10號，原本鄰座都是空位狀態，直到晚上19時許電

  影快播到最後高潮劇情環節時那2個女生才進場坐在我旁邊的一排9號與8號，她們進場後

  的表現看起來也無意觀影，9號坐下後就彎腰疑似使用手機，以致她的長髮撫過我放在座

  席扶手的右手臂三次。


  讓我初步因為被搔癢而感到煩躁，接著9號席女較不彎腰了，但是她與8號席女就開始持續

  使用各自的手機並互相交談，於是產生了額外的聲音與手機螢幕溢光干擾，這情況重複幾

  次後，我就朝右手邊兩女方向說「要聊天＆用手機出去啦！」兩女就閉嘴了。


  但是兩女仍持續使用手機並發出溢光干擾，又重複幾次後，我覺得兩女的干擾是無法語言

  說服的，於是我就拉起9號席女往影廳出入口方向走，目的是將光線干擾源移出影廳，但

  因為她有些抵抗動作於是她在影廳內跌倒，由於跌倒在地後，比較難以持續做拉她出去的

  動作，於是我踢了她作為移出干擾源失敗的洩憤，8號席女接著靠近過來嘗試維護9號席女

  ，並云「她已經沒有在聊天了 」 ，我覺得持續使用手機溢光的干擾源她也有份，故也踢

  了她，這邊8號席女理解錯誤了，我是因為她們持續使用手機做出散發溢光的干擾行為而

  拉扯9號席女，而不是因為她們剛剛曾經有閒聊干擾行為的部分。


  以上我對她倆動粗的內容因為理智斷線情緒激動以致記不太清楚，與她倆在筆錄描述的動

  粗細節似乎有出入，但總之我承認有動粗，但因為影廳內是暗的我沒看出她們是否因此受

  傷。


  接著我就回原座席繼續看片，直到電影播完，兩女則是收拾物品後逕行換去其他空位，電

  影播完後其中一女的父親就進入影廳大吼大叫，要求影廳大家不要離席，干擾到大家看電

  影的部分他要請客，並告知要讓我走不出秀泰建築物，接著他們事先報的警力就來了，於

  是兩警就把我帶去派出所。


  員警把我置於一個類似會客室的地方後就先去做兩女的筆錄，做完兩女的筆錄後再依據她

  們在筆錄的說詞做我的筆錄，筆錄問答完畢後員警把我銬在他辦公桌旁的長椅上並開始整

  理相關文件資料，此時早前在影廳內吼叫的那位其中一女之父就逕行來坐在長椅上我的鄰

  座，並表示要詢問動粗相關緣由，由於剛剛做筆錄時員警曾問及願不願意跟對方調解與談

  和解情事，我已表示同意，那此時對方家屬來攀談我若不予理會似乎會是很失禮的，於是

  我就開始對他的提問做答覆，包含動粗主因是她們手機發光造成的干擾在我口頭告知後仍

  不能停止等，那個父親就表示我騙他，因為他認為我跟9號席＆8號席女座位在同一排不會

  被他們的手機光線干擾，並表示目前是七月半，我是看到鬼了，我很驚訝表示「鬼在發光

  ？！」他似乎很肯定，然而此時派出所副所長就把他請離了，沒繼續談下去。


  雖然我在對兩女動粗後就繼續安靜觀影，沒再做出任何額外動作，但後來抵達的員警是依

  照現行犯相關法條辦理，於是派出所筆錄員警整理完文件後就有2警把我送去分局過了一

  夜，次日又把我送去地檢署，檢察官又問了一次後才請回，我在分局想了一夜，想來這位

  父親的鬼在發光說法似乎適當解釋了為何兩女的亮手機螢幕發出溢光干擾行為在我口頭制

  止後仍未停止，因為我不曉得我看得到鬼在我的視野範圍內發光，以致誤以為是她們不願

  停止讓手機螢幕發出光亮的干擾行為，完全錯怪她們了，原來雖然她們大遲到以致錯過幾

  乎90%電影劇情，入席後又表現得不太想好好觀影，持續做出會干擾旁人的自私舉動，但

  是口頭勸阻後是會住手的，只是鬼剛好在她們附近發光，讓我誤以為她們是口頭制止無效

  的份子，我對於這樣的誤會以及後續因此誤會採取的舉動感到萬分抱歉。


  ‧


  「本文為單一方面說法，詳細真相還有待雙方釐清」


  --



  以我自己都觀點加上這場是影人映後場


  2位女生應該是已經多刷後想追星，所以會在電影結束前進來，當然買票想什麼時候進場

  沒有明確規定，只要進場動作不要影響太多人就好。


  新聞說隔了同排7、8個座位，應該是事發後，不敢再跟當事男性坐一起， 所以更新換座

  位，台中站前秀泰的8、9、10號，大多都是中間位置，以追星來說，是不太會買離中間太

  遠的位置，所以應該一開始就不會是離了7、8個位置遠。


  哥，是不是我轉發會讓您家祖墳怎麼樣，讓你家後代也是跟你一樣的貨色呢？那還真是對

  不起喔~'
