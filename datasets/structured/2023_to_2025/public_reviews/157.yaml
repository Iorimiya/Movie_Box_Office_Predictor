url: https://www.ptt.cc/bbs/movie/M.1759031110.A.E6B.html
title: '[新聞] 《愛在暹邏》名導親點名！電影「進行曲」'
content: '《愛在暹邏》名導親點名！電影「進行曲」成清邁影展開幕片 泰版海報掀熱議



  2025-09-27 12:24


  聯合報 記者廖福生／即時報導


  電影「進行曲」榮獲「清邁國際奇幻影展」開幕片殊榮！影展策展人、泰國名導楚克·薩

  克瑞科（曾執導《愛在暹邏》）高中時期是行進樂隊成員，對音樂題材格外熱愛，因此親

  自點名電影「進行曲」揭開影展序幕，並於首映當晚與觀眾同場觀賞。



  楚克導演來自清邁，是影展的重要推手，他成功爭取政府 soft power 基金創立影展，用

  電影帶動觀光，也因此成為關鍵選片人。映後 Q&A 上，觀眾來自泰國、美國、歐洲，紛

  紛表示多次落淚，並熱烈討論江浩與流川的情感後續，展現BL大國的特別迴響。



  監製陳慧如也分享：「開幕式我和楚克導演進行1小時論壇，接著欣賞泰文字幕版『進行

  曲』，映後再進行近1小時分享。原本擔心翻譯或文化落差，但許多年輕觀眾都說自己哭

  了好幾次，深受感動，讓我終於放下心來。」



  電影「進行曲」泰國版海報掀起網路熱議。監製陳慧如加碼分享：「這張劇照其實是我在

  拍攝空檔，親自指導劇照師幫三位男主角拍的，沒想到加上泰文字體後，竟然特別有BL感

  ！」



  她並指出，泰國觀眾不只對行進管樂訓練過程感到好奇，更一致關心江浩與流川的後續發

  展，正好反映泰國BL市場獨樹一幟的特色。除了票房與影展佳績，國際發行也全面展開。

  電影「進行曲」泰文片名將定名為 「跳動的心」，將由 THAM Studio19 發行，並於10月

  23日起正式進軍泰國、柬埔寨、寮國三地院線。





  --








  --'
