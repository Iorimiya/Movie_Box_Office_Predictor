title: '[  雷] 進行曲 - 青春的篇章'
content: "雷文防雷資訊頁\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n\n\n\n\n\n\n\n\n故事不外乎 有熱血、有團體、\n有個人轉變、各種阻礙，只差在一句「教練，我想打藍球」\n\n\n\n\n\n因為高中同學的推件薦才知道這部\
  \ 有關 七年級前後回憶的青春電影\n\n我覺得除了體育館的層架坐椅，不是純鐵架鋪地毯略不合理外\n\n\n\n其他的細節，如冰店、訓導處、老師的藤椅、厚螢幕的電腦、用鐵樂士架的樂器室、\n\
  \n復古的家居設計、我愛吃鐵罐的垃圾桶等，都相對符合年代感，會感覺到相當的引發感受，\n\n\n\n劇情老實說很多處不意外\n\n但應該是節奏相對輕快不太拖泥帶水\n\
  \n\n在誘發情感回憶和略落俗套之間達成一定平衡\n\n\n也可能是票房真的有些冷清\n\n下午場次直接一人包場增加觀影舒適度\n\n該哭的還是有哭 尤其是那年代父親那種為子女好只有讀書高的衝突\n\
  \n\n在現在這個世代恐怕都已不再復見\n\n\n(看到馬志翔的時候 我好想唱合唱啊?!?!!)\n\n然後早期建中人的跩臉 WW (高三隊長的 :( 表情)\
  \ 集體翹課好快樂\n\n使用春風化雨的幽默橋段 景美妹子比北一妹子好追的年代記憶\n\n(話說白襯衫是不是再錶師大附中XD)\n\n\n還有在走廊吹奏那一幕\
  \ 個人覺得\n\n可能情緒表現比結尾更讓人高潮 ~~~\n\n就不要說一群人在河邊跑步練體能的養眼畫面了\n\n\n\n青春好棒啊啊啊啊...\n\n\n\n\
  \n要說有什麼缺點的話\n\n1.幾個主角帥得超綱了，氣質更接近大學生而非高中生\n\n2.大家族的聚餐人數不夠、火侯氣場不對，既不外省、也沒早期本省 有些底蘊的家庭表現\n\
  \n3.馬志翔演得訓導主任不足當年的兇狠，變成是一種想要被指揮唱歌又要被罵的突兀感\n\n4.李李仁的憤怒父親戲份複雜情感也不完全，\n\n  好像只演出了憤怒卻沒有同時有憤怒下對自己當年不勇敢的恨憾交錯，實在很可惜\n\
  \n5.年輕男演員的微表情再深刻1-2分更好，\n\n  然後建中校長的氣勢似乎還有點比馬志翔弱，有點怪\n\n6.走隊型其中一人未上場是很有可能影響全部視覺效果的，\n\
  \n  演出一半才進場表演這...不太合邏輯，會出戲\n\n\n7.回到家以後才突然想到，疑?沒有傳統木管(長笛黑管出現)的印象是正常的嗎?\n\n  我非專業\
  \ 看了開心就算了\n\n\n\n\n\n可能就這樣吧\n\n\n在樂曲走場部份，只能說 現在的樂團 演出參賽隊侮\n\n整體水準都比當年那一群傻忽忽沒有3C影響每天都只有練習和樂器相處的隊伍\n\
  \n光是整齊度 就差很多了\n\n\n\n演出的建中決賽隊伍在進場那幕  反而是真得很整齊\n其他很大量都是用剪輯帶過的 也是在為現在又一直在改變的世代\n\n\
  和當年 有許多的感歎吧\n\n\n\n\n不管是音樂、還是舞旗\n走位 都是一群人象徵形成「團體」的成果\n\n\n\n\n光是 「一起」\n\n\n怎麼想就是一個熱血、且幾乎只存留在\
  \ 年輕時候的故事\n\n\n\n\n\n\n\n\n「進行曲」 對有演出 不只升旗降旗而是真的有走位過的我們\n\n不只是音樂 還是回憶的代表\n\n就一人形成不了氣候\n\
  \n\n但用簡單的三個字\n\n就能串聯許多人青春時期的感受\n\n\n\n謝謝這部作品\n\n也請多支持好的國片\n\n\n--"
