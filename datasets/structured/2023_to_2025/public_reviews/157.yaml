url: https://www.ptt.cc/bbs/movie/M.1757171230.A.193.html
title: '[好雷] 進行曲 全程無冷場的好片'
content: '今天是二刷，美麗華影人場次


  簡單講結論：

  如果你是六七年級生 or 建中校友 or 曾是任何學校樂/儀/旗隊一份子

  那這部片會讓你看到滿滿的感動！

  有哭、有笑，全程無冷場

  推薦進戲院看！

  我甚至帶了我的小學階段小孩去看

  他們也非常享受


  老實說很久沒進戲院看國片了

  上一步看的可能是海角七號跟賽德克巴萊

  對國片印象停留在很文藝、很高深、看不懂、尷尬對白/口條

  這部片卻是出乎我意料的好看



  以下是一刷時我寫的心得：


  這部國片《#進行曲》實在是太令人驚豔了！

  大概是我人生中看過最好看的國片，

  劇情流暢、口條自然，沒有晦澀難解的藝術片元素，

  該好笑的、該讓你落淚的，全部都有，讓你一次滿足。


  表面上，

  這是一部致敬青春、熱血沸騰，講述高中時代樂旗隊的電影，

  但在建中、樂旗隊主軸間交錯的，

  是那個聯考年代的高中生活，

  是親子情感的拉扯，

  是那個我們存在過卻再也無法的回頭的時光。


  這部片精準還原了樂旗隊、儀隊的練習與表演細節，

  包含當年對DCI Blue Devils的崇拜，

  除了少部分基於劇情而省略的細節，

  基本上真的就是當年北市高中樂旗隊團練的情形，

  看完全片就像看了一場精彩的行進樂隊與旗隊演出。


  隨著劇情推進，

  我們同時也經歷了高中生對於未來的迷惘、對權威的挑戰：

  該追求自己內心的渴望，還是聽從師長的安排？

  青春時期忸怩不安的心，無處置放，

  只能在不停衝撞、嘗試中，找到答案。


  跟我同年代的人進電影院看絕對不會後悔，

  影片中你會看到我們高中時期的台北街景、

  大然版的灌籃高手、唱片行、辛發亭冰果室、

  爬牆翹課的建中傳統，甚至國立編譯館高中英語課本。

  這部片讓我看到了不只是上述全部，更看到了當年的自己。


  好的國片不應該沉沒，就算想放空進戲院相受純娛樂片，

  這片也都可以滿足你的需求！



  --'
