url: https://www.ptt.cc/bbs/movie/M.1765173648.A.7C8.html
title: '[影評] 進行曲'
content: '雷


  角頭導演的校園片

  果然裡面有很多流氓橋段

  建中跟流氓打群架很熱血

  還好建中校長是盛鑑

  也演過角頭浪流連

  所以對熱血青年教導有方

  訓導處長馬志翔就變反派

  可能流氓黑二代的教育跟

  賽德克軍官還是有差

  導演處理文戲蠻厲害的

  但武戲就沒顏正國好了

  難怪角頭2都只讓常威演文戲

  最後馬志翔打流氓應該是壓軸

  但沒有把他拍得更帥一點

  應該鐵木瓦力斯一個打一群流氓

  最後一個站起來走出門口報警才對

  這樣大家才會對訓導主任刮目相看

  最後那群流氓還能跟警察抱怨

  導演下手實在太輕

  應該讓那群流氓全部趴在地上才對

  我看角頭系列每集都有看

  發現處理武戲都不是很理想

  找韓國人來幫忙武指也一樣

  但文戲真的導的很棒

  但很多反而處理的太過狗血

  不過每個演員都被導演磨的很到位

  裡面演流氓的都可以去演角頭了

  感覺都像是真的有在混兄弟一樣

  連演角頭的孫鵬都來客串一角

  旁邊還帶個光頭保鏢唱綠島小夜曲

  還好黑幫沒有滲透校園

  只是打進校園被訓導主任團滅而已

  還有建中跟景女怎麼會跑去士林吃冰

  士林那家冰店離這兩個學校很遠呢

  那群高職流氓倒是還有可能

  但這兩個名校應該不可能

  應該換家店拍這場戲才對

  總之我對馬志翔最後大決戰很有遺憾

  下次建議姜導可以請校長盛鑑來當武指

  他畢竟是學京劇的對武戲應該比較了解

  雖然他是唱老生的，但功夫應該不差

  唱老生就跑去演校長，他是張娃娃臉

  一查竟然比馬志翔還大六歲

  難怪馬志翔要對他鞠躬哈腰

  但馬志翔長得比盛鑑老就是了

  盛鑑演富二代還不錯，但演校長

  好像還太年輕了，他是唱武生的命

  應該像成龍李小龍一樣去當武生

  以後角頭就請盛鑑來當動作指導

  這樣請韓國武指的錢就省下來了




  -----

  Sent from JPTT on my Samsung SM-X210.


  --'
