title: '[普雷]《近畿．禁忌》從恐怖雜誌編輯失蹤開始'
content: '偽紀錄＋劇情片，抽絲剝繭的雙重恐懼


  都市傳說和地方傳聞，是從過去一直延續到今的有趣恐怖現象，不管是從古老民謠或地方

  森山的鬼怪傳說，到如今生活再都市那些離我們很近，可能會發生在日常的怪談與軼聞，

  都讓這些若有若無的恐怖角色更加難以捉摸，讓人們對這些傳聞更感興趣。


  在如今網路時代，資訊傳播不在只是地方上，而是更具規模性，這也讓這些恐怖、光怪陸

  離的故事，變成現象極的謠傳，而讓人印象深刻。


  改編恐怖小說，《近畿．禁忌》是一部將短篇故事彙集而成，帶著偽紀錄片風格的恐怖電

  影。故事以恐怖雜誌的編輯突然失蹤，接續工作的小澤先生與瀨野小姐負責接手失蹤編輯

  的特刊，兩人從前編輯的特刊資料，一步步發現令人毛骨悚然，導致編輯失蹤的真相，隨

  著駭人的影像與事件接踵而來，一切祕密源頭都指向位於「近畿」的某處。







  《近畿．禁忌》是什麼電影？


  我很喜歡恐怖故事，不管是過去電視節目上《玫瑰之夜》、《鬼話連篇》的講鬼內容，或

  是到如今用Youtbe和podcast來觀看自媒體的鬼故事特輯或簡短的鬼話內容，都讓我覺得

  很有意思。雖然台灣缺少像是日本每期的恐怖雜誌、雙月刊這樣持續的恐怖、怪異的故事

  內容，但仍有不定期出版恐怖故事，不管是台灣本地或是日韓翻譯的都市傳說，其中也發

  展出自己獨特的鬼故事內容，例如軍中恐怖、佛道教並列的驅邪或除靈儀式都有著台灣本

  土獨特的鬼故事氛圍。


  在日本地方，鬼月時候常有舉辦「怪談会」的傳統，並且也有不同職業的人以說鬼故事或

  聽鬼故事為樂，也有人專職以說鬼故事或收集鬼故事為職業，這樣的人在現代的認本稱為

  「怪談師」，有滿多搞笑藝人、網紅、神職人員以這為副業，並且在每地方都有自己的怪

  談会特色，並且收集出書，或繪製成漫畫或影視作品。


  地方傳聞的收集充滿了日本十九世紀過渡到二十世紀，走向人類學發展的一環，而發展至

  今，從過去村莊的怪談到如今都市的傳說，不管是說鬼故事或聽鬼故事的人，都可以從中

  發現這些鬼故事的相似之處或獨創出來的魅力。






  日本恐怖電影《近畿．禁忌》，是改編暢銷短篇鬼故事合籍《發生在近畿某處的那些事》

  ，小說創作者－背筋，以模仿他人投稿各個地方傳聞的方式，寫下各式各樣的短篇恐怖故

  事。這部恐怖小說給予讀者的樂趣是：讓讀者可以自己摸索出每篇短篇故事的關係，有的

  可能無關、但有的可能可以串聯出一系列背後的真相，這樣的安排手法，讓這些零散的短

  篇鬼故事彼此之間充滿的接續性的恐怖。《近畿．禁忌》導演－白石晃士，拍攝過《詛咒

  》、《鬼談百景》等多部恐怖電影，這次也採用多種偽紀錄片的手法，呈現在這次電影中

  。


  《近畿．禁忌》彙整了原作《發生在近畿某處的那些事》的主線內容，以恐怖編輯的失蹤

  ，了無音訊作為事件的開端，年輕編輯小澤要接手失蹤編輯的特刊內容，並且有長年經驗

  的瀨野小姐也從中幫忙。


  兩人從編輯查找的恐怖資料中抽絲剝繭，從小女孩失蹤、學生集體歇斯底里、看了就會死

  的影片、到直播上吊鬼屋等，小澤雖然越發毛，但也越執著找到真相，他發現真相似乎藏

  在近畿某地方，但這些東西卻逐漸找上了小澤。








  《近畿．禁忌》分析與延伸：


  《發生在近畿某處的那些事》是恐怖小說作者：背筋（せすじ）在2023年創作的恐部作品

  。根據作者背筋自己在雜誌訪談和網路口述，他似乎本職就是靈異、怪談類相關的媒體娛

  樂工作，有著約20年的職業經驗。他活用這樣的工作經歷，撰寫一些不同風格的網路鬼故

  事內容，受到網路讀者歡迎。小說整體風格也比較有實驗性，跟跳脫一般恐怖故事的敘事

  框架。


  《發生在近畿某處的那些事》就是以模仿地方傳聞投稿的形式，將主線藏在其中讓讀者自

  己推敲的方式進行，另外幾部作品如《汙穢的聖地巡禮》、《關於「口」的調查》也都以

  田野紀錄、問卷調查的風格撰寫，有著像是現今網路風氣的多人討論與直播的呈現方式。


  電影《近畿．禁忌》的導演是拍攝過經典恐怖偽紀錄片《詛咒》的白石晃士執行。《詛咒

  》是完全以紀錄片的形式去敘述一個女孩被節目拍攝有超能力，並夾雜不同的恐部紀錄、

  家庭紀錄等短片，最後彙集而成的恐怖影像，強調出一種既真實又不真實，半真半假的故

  事結構。台灣2022年暢銷恐怖電影《咒》，有許多拍攝手法與呈現方式，都或多或少致敬

  《詛咒》這部偽紀錄片。這次《近畿．禁忌》的拍攝手法雖然是以傳統恐怖片的敘述為主

  ，但其中夾雜的紀錄影片，巧妙的將白石晃士導演最擅長的虛實交錯的紀錄片模式，運用

  其中。




  在《詛咒》多半是使用關於節目錄像，畫面不清晰的方式，並以一部部實拍電影接力去構

  成，《近畿．禁忌》則多了更多的影像媒介，如近幾年如社群媒體的上傳影片、傳統的錄

  影帶、手機拍攝影片等。


  以「查閱收集資料」名義一件件撥放，這既可以讓《近畿．禁忌》的主線串聯，將原作背

  筋，在《發生在近畿某處的那些事》小說中寫的短篇故事，以不突兀的出現在電影片段之

  中。這比起2005年全紀錄片表面的《詛咒》更有連續性，某方面因為有劇中劇的狀況也讓

  《近畿．禁忌》更有追查事件的真實感。


  這樣以偽紀錄片安插在鬼故事中的方式其實很常見，例如以長江俊和為首所製作的恐怖短

  篇《放送禁止》系列，雖然不一定在說鬼，也是以這樣的性質讓人可以透過偽紀錄片或是

  電影之中的物件與事物去做連結，而發現原本故事背後，更真實的故事。在恐怖電影中白

  石晃士本來就擅長和多次使用這種手法，正好與《發生在近畿某處的那些事》小說想呈現

  的方式契合，這也讓《近畿．禁忌》呈現出一種「劇中劇中劇」的狀況，呈現出如同原作

  所要的真假難辨、恐佈地方傳聞的可能性。








  《近畿．禁忌》值得一看嗎？


  雖然我喜歡白石晃士在《詛咒》或是《近畿．禁忌》裡面呈現出來的偽紀錄片感，不管是

  鮮明畫面或是故意做舊的影像表現形式，但是我不是很喜歡《近畿．禁忌》最後呈現的結

  局和角色關係，感覺像是可以預想到結局和沒有在深刻一點的角色關係，並且解釋與解謎

  的程度，有點不佳，雖然小說中本來就是一件件沒有太多交代的傳聞，但是電影中如果已

  經把它串聯起來，感覺就也應該好好交代這些故事的始末，會讓《近畿．禁忌》的整體更

  有完成度。


  雖然是故事片中呈現偽紀錄片的形式，但這部電影前期的手法讓我想到2015年，改編小野

  不由美小說的恐怖電影《殘穢：被詛咒的房間》，這部電影也是以講述一間東京近郊被詛

  咒纏上公寓開始，層層謎團、最後追查到各種源頭，無止盡的上百年怨念，那這恐怖故事

  沒有盡頭。


  從這點看來小野不由美的手法似乎更加合理且完整，雖然裡面恐怖的元素相對《近畿．禁

  忌》偏少，但我認為《近畿．禁忌》後期確認事件源由後，反而有點拋棄原本白石晃士所

  擅長的紀錄恐怖的感覺，而變成一種在我看來與《近畿．禁忌》格格不入的恐怖表現。






  但整體而言我很喜歡這種劇中劇的表現，只是如果《近畿．禁忌》可以純粹的表達出短篇

  恐怖加上偽紀錄片的形式，對我來說會是更加地鬼故事良作。就像《詛咒》這部電影讓人

  感覺到恐怖，不是鬼有多嚇人，或是突然現身驚嚇的方式。是一種細思極恐、日常的恐怖

  感。


  《近畿．禁忌》的電影最後劇情越來越拋棄這樣的恐怖方式，變成一種有形的恐怖，反而

  讓我覺得沒有那種半真半假的地方恐怖元素，我認為這種地方傳聞、網路鬼故事的樂趣就

  在於想像性，只覺得電影只有把這元素貫徹在前期，留下伏筆後，後續完全毀掉全部的恐

  怖感收尾。


  簡直就像是看《咒》看到最後，突然跟我說是《異形》一樣的無言以對。




  --

  個人Blog：

  小說連載頁：


  --'
