url: https://www.ptt.cc/bbs/movie/M.1755878771.A.763.html
title: '[好雷]白石晃士 近畿．禁忌 適合七月看的片'
content: '這部白石晃士執導的恐怖片，改編自小說，

  而背筋這部小說靈感來自白石的經典作品-詛咒

  所以你可以想像到看完會有種陰濕的不快感，

  那種心理層面被影響到的感覺

  不是屬於驚嚇類的恐怖片


  特別是前半段，導演完全展現了他在偽紀錄片領域的功力。

  由一連串的錄影帶，DVD，youtuber探險實錄，網路論壇討論

  讓人入戲，覺得好像真的有這些事件的存在，有點像"咒"這種詭異感

  不過也不用擔心被下咒，因為後半段會幫你除咒.......

  推薦給喜歡日式恐怖的人去看，記得拿觀影禮



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~









  為了更融入這部片，

  我特地去看了白石的執導的詛咒和歡迎來到超自然森林

  發現近畿-禁忌就像這兩部的精華濃縮，

  前半部是詛咒，後半部是外太空隕石超能力+邪教

  所以好好的進入白石宇宙之後就覺得最後的怪石和長滿手的章魚木靈也沒這麼奇怪

  還發現前編輯搬家住的房子也出現在歡迎來到超自然森林裡面

  邪教似乎也是在同個建築物

  然後我喜歡紀錄片的感覺，最恐怖的是YOUTUBER那段最後吊死畫面嚇死人

  前編輯妻子在爬行也很愛

  在電影院裏面四面八方的爬行聲超毛，最後被尖銳物插死的畫面也很棒!

  脖子軟掉的小男孩和紅衣女就還好，我覺得可以再淒厲一點

  不知道為什麼紅衣女的頭有點大.....

  跳躍感也沒做出來有點失望

  不過整體來說真的有被嚇到的爽感就很值得!


  前面紀錄片的時間有點亂，參考小說後

  應該就是勝的執念和隕石神秘力量結合成為一種咒

  被影響的村民蓋神社祭祀隕石和勝以安撫

  咒在山中蔓延驅使感受到的人去獻祭活人滋養隕石力量

  之後這個勝的故事變成一種遊戲更容易傳播

  在能看那座山的住宅區中影響最盛

  其中AKIRA因為玩遊戲卻沒有替換物來代償詛咒

  就被咒影響而上吊

  他媽媽想要復活AKIRA而找到那塊隕石

  又雙雙成了另一種生靈

  再之後隕石出現在倡導能重生的邪教裡

  讓千尋得知這塊隕石的力量但是不知如何使用?

  千尋在隕石遺失後利用前編輯及小澤整理出前因後果

  找到祭祀這塊隕石的地方，

  再讓小澤成為祭祀品復活她的小孩

  最後的畫面應該有做調整，千尋的臉超詭異!

  日本大部分覺得難看的後半段我是覺得還好，

  反而覺得就是要這麼怪誕到好笑才能消除前半段的陰濕感

  算是一種除咒的效果!

  不然要開始養生物了怎麼辦!!


  --'
