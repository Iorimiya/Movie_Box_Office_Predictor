title: '[好雷] 近畿．禁忌 '
content: '雷文防雷資訊頁











  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~











  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  喜歡白石晃士風格的建議進場，


  前80%不會失望。



  我個人以前是因他的《詛咒》和《異常》成為忠實觀眾，


  這部新作雖然是討厭的車庫引進，


  但遇到喜歡的導演就是身不由己。




  這部不再像是《詛咒》那樣完全使用拾得錄像的方式，


  而是拼貼各種媒介的影像素材，


  並以一般劇情片的鏡頭與故事來貫串。




  如果是經歷過VHS帶子至今的年代的觀眾，


  會覺得很有趣味，


  因為在男女主角解謎的過程中，


  線索影像將按照VHS、光碟、隨身碟、DV(記憶卡)的方式逐步呈現，


  解析度也好、節目標題也好，都符合那年代的模樣，


  除了看出其用心，也很能入戲。




  開場，負責超自然現象刊物專題的佐山先生匪夷所思的失蹤，


  一男一女雙主角逐漸深入、鍥而不捨的追查，


  頗有當年《七夜怪談》的懸疑氣氛。


  我特別喜歡白石晃士所要求的場景美術，


  在《詛咒》中那些尋常又詭異的民宅已讓我百般佩服，


  這次的上吊凶宅、佐山蔽身處的布置、社區空地斷枝樹木的選景等等，


  對靈異、凶險氣氛的錦上添花，都足見功力。




  其中有一段關於「勝大人」傳說的卡通，


  用了很濃重的色調和粗劣的畫質和抽格呈現，


  彷彿日本90年代的卡通《学校のコワイうわさ 花子さんがきた!!》


  那樣的詭異不祥之感。




  聲音是另一個魅力，


  音樂部分經常混入了令人不安的強烈噪訊，


  「看了一定會死的影像」其聲音更是達到刺耳的程度。


  還有劇情中那極其低沉如來自地獄的呼喚聲，


  修學旅行的夜晚，學生們與山林中的怪異聲音對話那段，


  在聲音的加持下，實在太毛骨悚然！




  故事發展到男女主角決定前往富士山腳尋找失蹤的佐山之前，


  我都非常喜歡，


  因為它保持了一種神祕性，一種不可言說亦不可阻擋的力量，


  我認為日式恐怖很大的一個優勢在於——


  像《怪談新耳袋》那樣，不明說一切，不給合理解釋，


  怪事發生了就是發生了，


  沒人知道怎麼來的，也沒人知道祂將如何蔓延。


  過去的《詛咒》在這一點也相當點到為止，


  可惜《近畿．禁忌》並沒有做到。




  也許是屈就於某些因素，最後採取這樣令人失望的呈現吧！


  從抵達佐山於富士山腳的藏身屋，男主角開始最糟糕的「死了都要拍」模式，


  佐山的眼睛黑洞特效與自殺方式，


  或者男女主角不在白天，而是選擇深夜前往深山禁地尋找異象的根源，


  男主角最後目睹荒唐至極的景象卻不動如山、死了都要拍，


  以及刻意反轉、出人意表的真相揭露（其實這種反轉真的沒有效果），


  最後20%的這一切，


  都在一次又一次擊碎這部片前80%好不容易形塑出的恐怖氛圍。


  我的感想至此只有——好片，爛尾。




  但終歸是我深愛的白石晃士，


  粉絲濾鏡下，還是給予好雷。


  --'
