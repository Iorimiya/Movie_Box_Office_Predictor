title: '[好微雷]岸邊露伴在羅浮'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  沒看人討論就自己發篇

  這部應該是JOJO粉比較可能去看

  不過當正常電影看是沒問題的


  如果期待看到替身大戰的，那沒有

  雖然有用天堂之門，但佔的比例很少

  整部比較接近解謎，推理，驚悚 大概吧

  羅浮宮畫面不多，不過不少場景都拍得蠻美的


  我記得岸邊在漫畫中就有看到鬼魂

  所以能看到也不太意外

  不過第一次他還沒天堂之門，不能閱讀

  後面就比較訝異，奈奈瀨叫他刪除記憶後

  在提醒他恢復，表示奈奈瀨知道他的能力

  這比較奇怪，她應該無法知道這點


  然後岸邊好像沒後悔的事，跟泉一樣?

  所以是山村自己跑出來殺他

  奈奈瀨就是只能在畫附近出現，不過一個名不見經傳的畫

  能送進羅浮宮XD


  整體來說我覺得還不錯，可能進去前沒啥期待的關係

  因為漫改常常爆掉，不過這部跟漫畫關係不大

  可以當作小品來看


  --

  我覺得不是，雖然忘了漫畫中的岸邊哪時候覺醒

  但少年岸邊應該是沒天堂之門

  死人都可以天堂之門，但是只能閱讀，不能寫(因為已經死了)

  要能寫才能下指令，只能閱讀就只能知道資訊

  至於被天堂之門呈現昏迷，這不是一定

  感覺是被抽取資訊普通人可能會陷入昏迷

  漫畫中能跟他做戰的也沒有昏迷'
