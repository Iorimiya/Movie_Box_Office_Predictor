title: '[普雷] 就很普的功夫熊貓4'
content: '劇情上來講就是一部小孩觀看的動畫片的劇情編排


  非常簡單的有起承轉合


  阿波不想放棄神龍大俠


  有一個大反派要去打倒，所以我們踏上冒險


  阿波在冒險中心情上發生轉變


  阿波被背叛


  打大反派，然後成功傳承


  最後阿波心情轉變完成，阿波成長了。


  就他不會讓你有種，哇原來這邊會這樣，原來可以這樣反轉，還有這招喔的這種想法。


  滿分10分就給4分，整體偏平淡


  還沒看的我覺得可以等之後上串流看

