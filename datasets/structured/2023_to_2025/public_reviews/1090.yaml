title: '[新聞] 陳美鳳獻聲《功夫熊貓4》 不認撞臉王心凌'
content: "陳美鳳獻聲《功夫熊貓4》 不認撞臉王心凌\n\n2024/04/01 05:30\n\n\n陳美鳳擔任《功夫熊貓4》中文配音，聲演變色龍女王。\n\
  （記者陳逸寬攝）\n\n〔記者廖俐惠／台北報導〕動畫電影《功夫熊貓4》在4日上映，陳美鳳受邀擔任中文配音\n，昨天參加一日店長活動，吸引許多大朋友、小朋友共襄盛舉。\n\
  \n陳美鳳聲演的變色龍女王會突然發飆或狂笑，與性格溫和的她大不同，就連好友藍心湄都\n說「妳可以嗎？」不過陳美鳳感謝導演的指導，讓她漸入佳境，給自己的動畫配音處女秀\n\
  80分。她透露，在配音時有參考「皇太后專業戶」陳莎莉的威嚴強勢感，當變色龍女王酸\n言酸語時，就會讓她想到曹西平的名言「你這個醜八怪」。\n\n陳美鳳此次為好萊塢電影配音，不過對於進軍好萊塢拍片似乎意願不大，表示主要還是在\n\
  台灣活動，「就像我的臉書粉專剛好80萬追蹤，在台灣我沒有買粉絲，能夠經營到這樣，\n很謝謝台灣朋友對我的疼愛。」\n\n近期她被稱撞臉王心凌，陳美鳳大讚對方甜美可愛，且剛好都喜歡拍左臉，「不過我出道\n\
  比較久，應該不是我像她，仔細看還是不一樣。」\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n\
