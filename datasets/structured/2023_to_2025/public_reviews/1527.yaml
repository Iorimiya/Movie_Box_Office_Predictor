url: https://www.ptt.cc/bbs/movie/M.1690266380.A.3E3.html
title: '[影評] 《請問，還有哪裡需要加強》繼續有些事一'
content: "《請問，還有哪裡需要加強》影評：繼續有些事一萬年都不會變\n  雀雀看電影\n\n，兩個都算是台灣\n影壇新面孔，帶給觀眾滿滿的新鮮感與銀幕魅力，能有這樣的演員被看見實屬美事一樁，\n\
  是九把刀電影自《那些年，我們一起追的女孩》的柯震東、《等一個人咖啡》的禾浩辰與\n《報告老師！怪怪怪怪物！》的蔡凡熙之後，再度為台片男演員開發新可能性的又一成功\n\
  案例，幾乎要奠定\n\n電影《請問，還有哪裡需要加強》\n，故事描述洗頭妹阿芬（宋芸樺飾）一次救了被追殺的阿泰（春風飾），讓阿泰對他從此\n暈船，從此「泰哥老大」使出渾身解術、拼命追求這個小女生，兩人漸漸共譜出一黑道大\n\
  哥與家庭理髮小員工之間的高反差純情戀曲。而黑道跟班們與理髮院同事也都成了這齣愛\n情喜劇的得力助攻手。\n\n宋芸樺與柯震東的優穩表演能量則是一如繼往，從影邁入第十年的宋芸樺演起洗頭妹仔可\n\
  愛度罩得住，對於兩性觀眾皆具親和力的演員質地也令人感到安心；而柯震東則是展現出\n前所未見的配角魅力，他在《請問，還有哪裡需要加強》裡的「龍柱」角色常是主角光環\n\
  所無法享受到的、專屬於配角所能得到的「觀眾好感」，是在演員過癮表演與觀眾驚喜觀\n影經驗中所碰撞而出的絕妙滋味。\n\n《請問，還有哪裡需要加強》裡的柯震東像是近年《陽光普照》與《詭扯》的劉冠廷以及\n\
  《黑的教育》的朱軒洋所帶來的新穎震撼力，以及今年《成功補習班》裡的邱以太，都令\n人眼睛一亮。然《請問，還有哪裡需要加強》的柯震東則較似《從前，有個好萊塢》裡的\n\
  布萊德彼特，作為老大旁邊的得力助手，有著黑矸仔裝醬油也惦惦吃三碗公的隱藏版實力\n，是將電影推向小高潮的造浪者功臣之一。\n\n宋芸樺、春風與柯震東之外，《請問，還有哪裡需要加強》的亮點演員不少，蔡昌憲\
  \ 、\n「小應」應朗丰、夏騰宏、郭子乾與苗可麗等人所建構而出的台式古惑小宇宙以極限的微\n型規模有模有樣地做出龍爭虎鬥小劇場，亦與《當男人》互映其趣；至於屈中恆、鍾欣凌\n\
  的家人感情線致敬港式家庭歡樂氣氛胡鬧感強到自我成立，髮廊部分為百白騰出的喜劇表\n演篇幅也是有感發揮，即便過與不及都是如人飲水，口味或許各取所需，然而戲感卻是騙\n\
  不了人的，令人相信劇組拍戲期間大概是整組都玩得很開心吧。\n\n《請問，還有哪裡需要加強》是一部不折不扣的愛情喜劇。比起超級英雄電影或動作鉅片\n類型，上個世紀在全球盛行的愛情喜劇看似不再在世界電影圈裡風行，實則在院線市場上\n\
  的永恆基本盤潛力仍不容小覷，《海角七號》在台賣座5.3億、《那些年，我們一起追的\n女孩》4.25億、《等一個人咖啡》2.6億、《我的少女時代》4.1億《當男人戀愛時》4.05\n\
  億、《月老》2.6億… 6部破億愛情喜劇片中有 3部皆是出自九把刀之手，無怪乎他要死\n守這一極樂淨土。\n\n當代觀眾對於愛情電影的接受度已趨分眾，雖有公式但已不是必勝、也無標準答案。對此\n\
  ，各國影視產業都在苦尋適用於自家地域文化的新世紀葵花寶典。《請問，還有哪裡需要\n加強》延續了台片《當男人戀愛時》以黑道男主角愛上平凡上班女孩、狂追不捨的純情戀\n\
  歌為基底，持續在院線票房市場上試探台灣觀眾究竟是獨厚《當男人》還是「真的愛這味\n」？若《請問，還有哪裡需要加強》大賣不啻也是殺出一條血路的證明，或可在產業上引\n\
  爆一條類型複製連鎖反應，就像十年前台灣觀眾愛《那些年》、愛《等一個人咖啡》也會\n愛《我的少女時代》一樣，只是青春校園愛情片裡的男孩們或恐都要轉型效法 8+9\
  \ 的直\n球賣命追愛路線了。\n\n令人熟悉的元素不只在於家庭理髮店、台灣家庭灶咖一隅、一夥人聚在一起卡唬爛的冰果\n室，還有職棒球員與黑道間的糾葛也被列作戲劇衝突高潮，不論《請問，還有哪裡需要加\n\
  強》的戮力接地是無心插柳還是有意為之，都是呈現台味丰采的一頁風情，這樣展示包括\n夜市與路旁小店等台灣餐飲、家庭文化、運動歪風舊疾，甚至是各式髮廊樣貌差異的台片\n\
  其實多多益善。不只是愛逮丸或自我認同而已，而是在世界影壇上充滿著各種理論與琳瑯\n滿目形式的影音爆炸時代，\n\n事實上，\n\n作為九把刀的第四號執導長片作品，《請問，還有哪裡需要加強》也是作為導演的他在《\n\
  報告老師！怪怪怪怪物！》釋放滿身怒氣、歷經《月老》與世界和解，重新回歸到拍攝《\n那些年，我們一起追的女孩》時代那種只專注在男孩的幼稚與傾力的付出刻畫，繼續有些\n\
  事一萬年都不會變：一個學生時期的柯騰和一個出了社會混黑社會的阿泰，在感情觀與付\n諸實踐的用力上也沒有什麼不同，只是愛情喜劇況味更濃。而比起催淚元素，喜劇元素絕\n\
  對是當代影劇要與觀眾共享故事時的的必加魔法粉，每部中小規模電影若欲戰勝類型票房\n數字瓶頸，此後大抵都是得靠這一味。\n\n\n\n\n\n--"
