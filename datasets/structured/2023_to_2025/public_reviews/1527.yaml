title: '[好雷] 【請問，還有哪裡需要加強】夠精準且沒失'
content: "馬來魔 影評--【請問，還有哪裡需要加強】：夠精準，而且沒有失控\n\n【一言以蔽之】：故事之王再進化，九把刀的中二熱血純情，依然渲染力十足\n\
  \n九把刀的小說裡面，我最推薦的有《那些年，我們一起追的女孩》、《月老》、《樓下的\n房客》、《少林寺第八銅人》、《異夢》、《功夫》以及《精準的失控》，這其中有些已\n\
  經拍成電影，有些還沒，但是在已經拍成電影的小說當中，《精準的失控》是比較特別的\n案例，因為他只有其中一個篇章被拍成電影，而且這部電影的片名乍聽之下超級怪，但又\n\
  超級熟悉，因為全台灣理髮店的洗頭小妹每天幫客人洗頭的時候，都會不斷提到這個片名\n：《請問，還有哪裡需要加強》。\n\n這部讓全台灣洗頭小妹每天都幫忙打廣告的電影，其實就是一個洗頭小妹的愛情故事，飾\n\
  演洗頭小妹的宋芸樺，是九把刀電影的御用演員之一，但比起上次《月老》裡面那個有點\n苦情的角色，這次完全是喜劇演出，所以歡樂程度升級，俏皮程度升級，可愛程度也上升\n\
  了大概一千倍，完全符合戀愛電影應該有的女主角形象，看到她以後就會很想戀愛，所以\n男主角對她一見鍾情的理由也就變得更有說服力，而說到男主角這個黑幫大哥，找來台客\n\
  嘻哈天團「玖壹壹」的靈魂人物「春風」來扮演，那外表兇惡、內心溫柔的形象，幾乎是\n本色演出，即使男女主角看起來像是兩個世界的人，但互動起來卻意外的超有火花。\n\
  \n原著小說《精準的失控》是用五個主題各異，又環環相扣、互為因果的離奇事件，串成一\n個跨越時空、逆轉命運的龐大故事，但不知道為什麼，他並沒有把整本小說都拍成電影，\n\
  而是只擷取其中一個章節，所以原作裡面的因果循環、時空穿越元素通通不見了，只留下\n一個最單純的黑幫愛情故事，而且不同於原作裡面的驚悚奇幻路線，電影版本的風格變成\n\
  無厘頭喜劇，痞子台客追求清純女孩的戲碼，可以看成歡樂版的《當男人戀愛時》，加上\n柯震東、蔡凡熙、蔡昌憲這些熟面孔一起搞笑，或許會有人覺得很「中二」，但那些搞笑\n\
  方式或多或少都是受到周星馳電影、日本漫畫，以及網路迷因的影響，可以說是整個世代\n的娛樂文化縮影。\n\n九把刀號稱「故事之王」，但每次擔任編導之後，又總是不肯好好的把小說內容拍出來，\n\
  反而喜歡「魔改」他自己的作品，但無論他在電影裡面把自己的故事改得多離譜，也從來\n不會有「是否忠於原作」的問題，因為原作就是他自己，所以再怎麼樣都是他自己說了算\n\
  ，這就是小說家斜槓編劇又兼任導演的特權，而這部電影即使跟小說內容已經快要完全不\n一樣，但很多看似胡鬧的橋段，都巧妙的前後呼應，結尾再給你一個回馬槍，先把你逼出\n\
  眼淚，再瞬間讓你破涕為笑，整部電影乍看之下像是放飛自我，但依然「精準」掌握故事\n節奏，即使惡搞也沒有「失控」，加上強大的情緒渲染力，就是九把刀電影的特色。\n\
  \n雖然「用性器官當成告白金句」的橋段，以及主題曲《一生只督妳一人》的性暗示歌詞，\n一定會讓不少「道德魔人」覺得很有意見，但那些把本片情節和近期的「#MeToo」浪潮劃\n\
  上等號，認為男主角的行為根本是性騷擾的那些評論者，你們也許真的沒有看懂這部電影\n，片中的這段關係之所以不能說是性騷擾，關鍵就在於「兩情相悅」，而且這整段關係都\n\
  是女主角主動，連兩人第一次上床都還是女主角約的，故事裡面對於性別刻板印象的翻轉\n，在「#MeToo」浪潮下反而更加合乎時宜，片中對於女主角的性格刻劃，以及強調自主性\n\
  的描述，也比成名作《那些年》更加成熟。\n\n無論是小說或電影，九把刀的作品一向都不會刻意避免粗話、黃腔、惡趣味，以及任何「\n政治不正確」的元素，甚至在他的故事裡面，對於「道貌岸然」這件事情，總是會有些嘲\n\
  諷的意味存在，像是高中被退學、滿口粗話的男主角其實溫柔又專情，反而是看起來很斯\n文的高材生才是說謊和劈腿的慣犯，更別說那些西裝筆挺的傢伙，才是處處算計的陰險小\n\
  人，所以人不能只看表面，電影也不能只看表面，誰說看起來「政治不正確」的電影，就\n不能是一部優秀的電影呢？\n\n\n\n光影隨想  \n\n\n\n\n\n\n\
  --"
