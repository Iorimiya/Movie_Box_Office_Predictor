url: https://www.ptt.cc/bbs/movie/M.1691256366.A.2E6.html
title: '[偏好雷] 《請問，還有哪裡需要加強》 '
content: '《請問，還有哪裡需要加強》7/10分


  沒想到拍完《月老》不到三年

  九把刀又推出了新作

  我個人是很樂見啦

  雖然每次推出的作品不能說是完美

  但都具備娛樂度以及個人風格

  在嚴肅中帶著北爛

  在北爛中又兼顧著情感

  還是很值得一看的

  就條列式的說一下優缺


  優：


  ◎柯震東戲份意外很多 而且有點冷面笑匠的角色蠻有趣

  ◎橋段緊湊無冷場 雖然不一定都有推進主線 但很豐富

  ◎笑點很多 有些打破第四面牆的對話跟 致敬自己寫的歌詞也很好笑

  ◎整部片的剪接節奏與運鏡構圖融洽 懸疑、搞笑、感性的轉換都游刃有餘


  缺：


  ◎有幾段刻意廉價的特效我不喜歡 ex:心跳的畫面震動

  不知道是因為抖音等短影音的影響還是怎樣

  但在電影中看到那種廉價特效還是不太能接受


  ◎另一個不喜歡的點 是在於台詞上的編寫

  即使知道主角是流氓身分

  但戲中的台詞仍然是粗俗到有點看不下去

  也許對現實生活中的流氓兄弟可能很接地氣吧

  但我個人就覺得不太入耳

  如果是傳統長輩看到可能會直搖頭吧

  這就是不適合全家人一起吃飯看的那種電影


  ◎另一個不解的點在於

  很多國片都很喜歡用職棒相關的議題

  來作為劇情重點之一

  我只是很好奇這對大部分的人真的是很重要的大事記嗎

  因為我個人沒在關注職棒

  所以即使知道有發生過什麼事件

  我其實也不太在乎就是（情感波瀾=0）

  但這點就 看人吧


  ◎美化、浪漫化流氓

  一邊看的時候 心裡一邊覺得矛盾

  看著春風、柯震東在戲裡耍浪漫耍幽默耍帥

  是覺得幽默有趣 但一邊同時在想

  「幹 這些人在現實生活中 不就是在抖音跳社會搖的那些8+9猴子嗎？」

  只能說服自己說「戲劇效果 純屬虛構」


  ◎劇情整體偏支線感 原本期待的精采轉折 結果沒有預期中來的印象深刻


  結論


  雖然上述缺點寫了很多

  但其實也只有在某些時刻會浮現而已

  整體看下來還是很有趣 很有誠意的一部片

  尤其在笑點方面 雖然是有點粗俗

  但確實夠北爛 夠好笑

  九把刀式的幽默 是其他導演編劇模仿不來的

  另外在一些劍拔弩張或感性時刻

  氛圍營造也很夠


  總之

  在最近許多大片都稱不上完美的時候

  《請問，還有哪裡需要加強》

  或許是你可以選擇的片單之一


  --


  無雷 電影/影集短評IG：




  --'
