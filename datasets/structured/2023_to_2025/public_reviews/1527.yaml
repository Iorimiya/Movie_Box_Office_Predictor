url: https://www.ptt.cc/bbs/movie/M.1690601810.A.B47.html
title: '[影評] 《請問，還有哪裡需要加強》剪一刀算一刀'
content: '凹特的生活日誌

  《請問，還有哪裡需要加強》剪一刀算一刀的那一種！


  九把刀最新電影《請問，還有哪裡需要加強》上線！趕著上映第一天就特地跑去看，這部

  電影最棒的地方就是它很「九把刀」，作為一個看過他九成小說的人，這部電影完全就是

  將小說具象化之後的一部經典的作品，先說，我非常喜歡這種直白又可愛的故事設定，就

  是剪一刀算一刀那一種啦。


  要聊聊《請問，還有哪裡需要加強》之前，我想先建構一個九把刀的世界，如果你同意這

  個世界裡發生的所有事情，那麼這部電影才適合你看。九把刀是一個擅長「說故事」的人

  ，你必須佩服他在「敘述」上的功力，無論是從文字還是從影像上，你都能看到流暢且不

  拖泥帶水，每一段都能達到劃重點的效果，只要他安排的那一手，勢必就會起了很大的效

  果。


  但同時，這部電影也很糟糕，糟糕的點是除非你喜歡九把刀，否則你很可能會說「三小？

  」但剛好我是前者，所以這部電影很合我的胃，這也可以將他過往寫的小說裡各種奇怪的

  創意主題與各種驚奇轉折，還有他最會的色色情節，在這部電影裡面我想都能看到。



  比較適合男孩看


  從《請問，還有哪裡需要加強》來聊聊，改編自小說《精準的失控》裡面的其中一個小篇

  章，黑道大哥與洗頭小妹的愛情故事？聽起來很無趣，或者說聽起來很像是《當男人戀愛

  時》，不過這可能是搞笑版的，甚至可以說是「當男孩戀愛時」，劇中的大哥阿泰根本就

  不是你想像的那種大哥，小弟也不是你想像的那種小弟，在原設定上就已經與我們的既定

  印象有出入，所以我才會說這部電影很九把刀，因為這裡就是他的世界。


  《請問，還有哪裡需要加強》很幼稚，可以說就是一部給小男孩看的青春愛情電影，每個

  在愛情前面的男孩，無論你的職業是什麼，每個人都會可愛的像傻瓜一樣，卸下社會上走

  跳的枷鎖，我們都只是一個追求幸福，一生只想督妳一人的男孩而已啊！所以即便背景設

  定的是黑道大哥，但很明顯的電影主線完全不是什麼追查出殺大哥的人是誰？反而是在與

  阿芬的相處，畢竟這就是一部「愛情」電影，所以這個走向似乎不太令人意外，令人意外

  的是，九把刀這次很任性。



  不合理與沒邏輯


  如果說電影要在乎「邏輯」與「合理」，那麼《請問，還有哪裡需要加強》完全不合邏輯

  ，打破我們的各種不同面向的想法，無論是對人、職業或者是被砍受傷這件事… 原本九

  把刀過往的電影都還會在乎「合理性」這件事，例如該領便當的就該領便當，不該有快樂

  結局的就留點遺憾，但在這部新電影當中，你能看到劇情裡的各種不合理，都被九把刀用

  故事來講的很合理，甚至在結局還硬要凹一個起死回生，我只能說你厲害，畢竟你是九把

  刀。


  不過，如果硬要說我不喜歡《請問，還有哪裡需要加強》的地方，大概就是角色的每個動

  機都挺薄弱，似乎將所有心力都放在感情線上，其他的部分都變得不是太重要，綠葉通常

  是形容不同角色的功用，但在電影當中，似乎愛情才是主要，其他的人事物都是綠葉，這

  是有點可惜的，但或許這就是這部電影想要強調的，愛情。



  演員選得真好


  春風沒有給我那種新演員的青澀感，有可能跟他自己本來的形象就蠻像（？），所以看起

  來他與阿泰這個角色就是非常合拍，可以說他就是阿泰本人吧。而宋芸樺的小芬，反而有

  點可惜，在《等一個人咖啡》當中她就是有點瘋的女還，在《請問，還有哪裡需要加強》

  只是加強版的「李思螢」，只是這次有比較多色色的台詞從她嘴裡講出來，真的是有點偏

  違和感啊。


  不過有趣的是，在「九把刀宇宙」裡總是能看到幾個熟面孔的演員，無論是主角配角還是

  客串，每一次都能夠有他們的出現，或許某種程度上也證明了導演與演員之間的好關係，

  願意來客串演幾個不重要的角色，而這個九把刀宇宙還在成行當中，未來還能有誰來客串

  ，其實我相當期待啊。




  我會說我很喜歡《請問，還有哪裡需要加強》，除了我是九把刀腦粉以外，看完電影之後

  心情就是很好，加上朗朗上口的主題曲，有點色色的但又大方講出每個男生心裡的壞壞小

  秘密，我想電影就是這樣，有一個想要講的東西，然後發展成一個有趣的故事。


  當愛情從名詞變成動詞，當愛情從現實變成電影，大概就是《請問，還有哪裡需要加強》

  帶給我的感覺吧，這並不是你想像的淒美愛情那種，而是剪一刀算一刀的那一種。







  --'
