title: '[新聞] 【分期付款愛上你】展現泰國觀光軟實力！'
content: '新聞網址：



  翻拍自台韓愛情經典《當男人戀愛時》的泰國年度話題夯片《分期付款愛上你》，即將在

  6月21日於台灣催淚獻映。本片由人氣戲劇《特長生》、《光年之詩》瓦蘇蒂克特皮奇（

  Waa）擔任編導，並由《流星花園泰國版》的「泰版道明寺」瓦奇拉維特奇瓦雷（Bright

  ），以及透過電影《把哥哥退貨可以嗎》晉升「泰國億萬票房女神」的烏拉薩雅斯帕邦德

  （Yaya）攜手主演。導演透露男女主角無疑是全片最吸引人的地方，觀眾將以前所未見的

  方式看到Bright與Yaya脫胎換骨的轉變。尤其本片將故事背景設定在五光十射的觀光之城

  芭達雅，更融入泰國的觀光文化，觀眾得以透過本片一睹當地火辣的阿卡薩人妖秀，或是

  東芭樂園的大象表演，也讓本片得以透過豐富元素，展現泰國的軟實力。





  《分期付款愛上你》由泰國知名編劇及導演瓦蘇蒂克特皮奇（Waa）擔任編導，曾執導過

  人氣戲劇《特長生》與《光年之詩》的他，這回將《當男人戀愛時》這個經典的催淚愛情

  故事進行在地化改編，他透露首要功課就是如何透過泰國的背景來講述這個故事，又得思

  考如何讓觀眾對角色產生信任感與參與感。於是他選擇將故事背景設定在芭達雅，並解釋

  ：「芭達雅是個多元城市，我們可以把它想像成是個觀光城市，但它也可能是座罪惡之城

  。另一方面，我們不能否認，這是一個讓人來這裡謀生的城市。當然，來這裡的遊客，可

  能都是想要放鬆並尋求快樂，但他們真正想要的又是什麼呢？確實，這座城市的形象，大

  概就是一座只有酒吧的城市，但另一方面，它也有截然不同的一面。也因為它的複雜多樣

  性，讓我們選擇這座城市來講述這個故事，而且也有助於清楚體現人物身份。」



  此外，場景與美術設計團隊也精心將片中的多數場景，融入芭達雅的城市特色，其中的成

  員托薩彭（Twosak Pang）也表示：「芭達雅是個光與色的世界，人們也充滿多樣性，所

  以我想將它納入設計當中，將色彩和混亂融入與現實混合的設計作品當中。無論佈景還是

  道具，我們都盡力為每個佈景和場景更添完美。」也因為幕後團隊的努力，觀眾得以在戲

  院透過大銀幕，欣賞到本片眾多美麗的場景。





  不僅如此，《分期付款愛上你》導演也表示本片最吸引人的地方，就在於男女主角：「我

  們將以前所未見的方式讓觀眾看到Bright與Yaya，我們相信觀眾會喜歡他們的角色，會沉

  溺在兩人的每一種感覺，並同情他們的困境。」尤其他更力讚兩人演出「超出我的最先預

  期」：「他們看起來就像來自完全不同的兩個宇宙，因此我要思考如何讓兩人相處融洽，

  結果很有趣，就像我們看到兩個不該在一起的人，但最後他們成為了完美情侶，感謝

  Bright和Yaya在片中的出色表現。」



  這部翻拍自感動全球數百萬觀眾愛情之作，並旁敲泰國人民負債問題的《分期付款愛上你

  》，即將在6月21日於台灣催淚獻映。「限量珍藏預售票」目前正在博客來售票網熱賣當

  中，450元內含兩張可收藏上聯的電影交換券，以及一組兩張包含男女主角Bright與Yaya

  的演員精美閃卡，敬請把握購票良機（

  ）。本片劇情描述在芭達雅這

  個充滿活力的不夜城，阿波（Bright飾演）日復一日帶著夥伴們四處討債。雖然阿波表面

  上態度強硬，但討債手法卻頗為反常，不但不會對債務人訴諸暴力，反而還會拿起手邊的

  東西，把自己敲到頭破血流，讓債務人虧欠地趕快還債。沒有任何抱負的阿波，某天邂逅

  了必須努力工作來償還父親債務的小盈（Yaya飾演）。小盈打從一開始就瞧不起阿波，但

  阿波卻對她一見傾心。出於對小盈的愛與同情，阿波提出一份約會契約──透過跟他約會

  來支付利息。小盈別無選擇，只好無奈地同意這項安排。在兩人波折不斷的約會過程當中

  ，他們也逐漸發現到彼此的真心。不過當討債人愛上債務人時，會發生什麼事情？而這段

  負債累累的愛情之路，最終將引領兩人走向何方呢？



