title: '[新聞] 【分期付款愛上你】示範新型約會還債服務'
content: '新聞網址：



  翻拍台韓愛情經典《當男人戀愛時》的泰國年度話題夯片《分期付款愛上你》，即將在本

  週五（6/21）於台灣催淚獻映。本片邀請到《流星花園泰國版》的「泰版道明寺」瓦奇拉

  維特奇瓦雷（Bright）領銜主演，他不僅在片中示範「新型討債手法」，為女主角烏拉薩

  雅斯帕邦德（Yaya）量身打造「約會還債服務」，甚至在KTV場景中大開金口，深情熱唱

  由人氣歌手喬伊普瓦西（Joey Phuwasit）原唱、平台大破2億觀賞次數的熱門神曲〈金面

  降〉，就為了全面征服Yaya的心。此外，他還有大量的動作與挨打場面，每次拍戲都消耗

  大量體力，讓他直呼辛苦，不過他依舊展現專業演出精神，坦言：「不過我也很喜歡這些

  動作設計，一切都由我親自上陣，每一個場景都由我自己親自排練。」





  《分期付款愛上你》由「泰版道明寺」瓦奇拉維特奇瓦雷（Bright），以及透過電影《把

  哥哥退貨可以嗎》晉升「泰國億萬票房女神」的烏拉薩雅斯帕邦德（Yaya）攜手主演。

  Bright這回飾演年輕的討債小混混「阿波」，每次討債都會抓起附近的任何東西，去敲打

  自己的頭，藉此恐嚇欠債人，直到他們還錢為止。某天，他遇見美麗的債務人Yaya，讓他

  靈光一閃，從最殘酷的討債行為，改成為她量身打造「約會還債服務」，也讓兩人在綁手

  綁腳的約會過程當中，逐漸萌生出愛情，開始看見彼此最真實的自我。



  Bright為了詮釋討債人比欠債人還傷痕累累的形象，每幕戲都耗費大量精神與體力，他對

  此透露：「阿波在灰暗的社會中工作，生活沒有任何目的。直到某天遇到女主角，各式各

  樣的故事因此發生。這也是我以前從未演繹過的角色，除了必須適應成為討債人，還有一

  個困難，就是動作戲相當多，拍攝很辛苦，每天幾乎都要耗盡我所有的精神與體力，不過

  我也很喜歡這些動作設計，一切都由我親自上陣，每一個場景都由我自己親自排練。」此

  外，他也剖析自己的角色：「我還必須挑戰自己，到達另一個層次。扮演阿波，讓我覺得

  我們不能從外表來評判一個人，因為你不是真正了解對方。儘管他有這樣的職業，但這並

  不意味他是個壞人。我希望每個人都來觀賞這部電影，並享受它帶來的樂趣。這是一部具

  備多種色彩和風味的電影，悲傷的、快樂的、動作的、有趣的、熱鬧的通通都有。」





  除了大量的動作與打鬥戲相當耗費體力，本身就有歌手身分的Bright，在《分期付款愛上

  你》也大開金口，在一幕KTV場景當中，對著Yaya深情演唱泰國平台大破2億觀賞次數的人

  氣神曲〈金面降〉。本曲本身就是泰國膾炙人口的人氣歌曲，尤其副歌歌詞：「我吹響魔

  咒迷惑你的心，用我的金面降讓你痴狂，願我的愛遮蔽你雙眼，讓你只看向我一人，可以

  嗎？」對照電影劇情當中，Bright全心全力對Yaya展開熱烈的追求，選曲可說是一時之選

  ，也讓已經觀賞本片的泰國民眾，在片中聽到Bright的演唱相當驚艷，直呼：「因為這首

  歌被Bright迷住了！」「聽了50多遍！」「在電影院聽的話效果更棒！」「聽到Bright演

  唱這首歌，讓我的淚水不爭氣地從臉上滑落，我甚至都還沒準備好要流淚！」值得觀眾進

  戲院，透過大銀幕好好品味Bright的好歌喉。




  這部翻拍自感動全球數百萬觀眾愛情之作《分期付款愛上你》，即將在本週五（6/21）於

  台灣催淚獻映。只要在戲院購買第一週（6/21-6/27）期間場次電影票乙張，即隨機贈送

  「深情相擁A4電影原文海報」，敬請把握購票良機。本片劇情描述在芭達雅這個充滿活力

  的不夜城，阿波（Bright飾演）日復一日帶著夥伴們四處討債。雖然阿波表面上態度強硬

  ，但討債手法卻頗為反常，不但不會對債務人訴諸暴力，反而還會拿起手邊的東西，把自

  己敲到頭破血流，讓債務人虧欠地趕快還債。沒有任何抱負的阿波，某天邂逅了必須努力

  工作來償還父親債務的小盈（Yaya飾演）。小盈打從一開始就瞧不起阿波，但阿波卻對她

  一見傾心。出於對小盈的愛與同情，阿波提出一份約會契約──透過跟他約會來支付利息

  。小盈別無選擇，只好無奈地同意這項安排。在兩人波折不斷的約會過程當中，他們也逐

  漸發現到彼此的真心。不過當討債人愛上債務人時，會發生什麼事情？而這段負債累累的

  愛情之路，最終將引領兩人走向何方呢？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
