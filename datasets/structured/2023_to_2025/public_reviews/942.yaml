title: '[新聞] 【分期付款愛上你】觀眾盛讚「超出預期」'
content: '新聞網址：



  翻拍自台韓愛情經典《當男人戀愛時》的泰國年度話題夯片《分期付款愛上你》，即將在

  6月21日於台灣催淚獻映。本片由人氣戲劇《特長生》瓦蘇蒂克特皮奇（Waa）編導，並由

  《流星花園泰國版》的「泰版道明寺」瓦奇拉維特奇瓦雷（Bright），以及透過電影《把

  哥哥退貨可以嗎》晉升「泰國億萬票房女神」的烏拉薩雅斯帕邦德（Yaya）攜手主演。本

  片在泰國叫好叫座，光是上映首日就在權威電影評分網站「IMDb」獲得9.6分驚人高分，

  不論一般民眾、影評人、媒體都紛紛給予好評，直呼：「超出預期！」「比想像中更有深

  度！」「讓我熱淚盈眶！」更有影評人直呼Yaya在片中的角色與表現，簡直媲美經典港片

  《天若有情》中的吳倩蓮。值得一提的是，台灣片商也將在本週五（5/31）中午12:00開

  賣「限量珍藏預售票」，450元內含兩張可收藏上聯的電影交換券，以及一組兩張的演員

  閃卡，數量有限，敬請把握購票良機（

  ）。





  《分期付款愛上你》從海報到預告，都給人愛情喜劇的浪漫氣氛，不過電影本身的劇情內

  容，更是凌駕在愛情喜劇之上，甚至探討了債務的社會問題，以及芭達雅這個多元化城市

  當中，人們所擁有的掙扎。觀眾得以透過本片看到愛情的瘋狂，以及黑幫裡的純真。這也

  讓泰國觀眾觀賞後紛紛讚嘆：「不僅僅是普通的愛情片，更擁有完整的情感體驗！」「清

  晰展現芭堤雅這個賺錢之都，其體制內外的金錢風格！」「既有趣、幽默、充滿戲劇性，

  還有精心設計的角色！」「充滿生命和夢想的力量！」「原本以為是純粹的浪漫喜劇，但

  當我看完之後，卻超出我的預期！」



  尤其本片不只擄獲觀眾的心，甚至連看片口味刁鑽的影評人也紛紛給予滿意好評。曼谷評

  論家協會便表示：「原版電影是對資本主義世界的探索，講述中年男女在殘酷的首都求生

  存，但泰國選擇講述芭達雅資本主義政權下，敢於夢想的年輕人們的故事，可說是個真正

  勇敢的選擇！」影劇網站「The Showhopper」則指出：「電影意圖向觀眾傳遞一個重要訊

  息：生活有時可能會很困難、很黑暗，找到引導心靈走向希望的光明仍然很重要。」影評

  網站「Hidden Movie」也盛讚：「把討債問題講得有技巧，一波三折，讓觀眾全程看得津

  津有味，在泰國社會的背景下，才算真正過關的趣味性。」娛樂社群「

  Worldwide」除了大讚本片「絕對是今年最好、最值得一看的優質泰國電影。電影永遠沒

  有沉悶的時刻，劇本從開頭、中段到結尾，幾乎沒有任何乏味之處」之外，更還稱讚女主

  角Yaya的角色與表現，簡直媲美經典港片《天若有情》中的吳倩蓮。如雪花般的好評滿載

  ，就連權威電影評分網站「IMDb」，都讓本片在上映首日獲得9.6分驚人高分。





  適逢《分期付款愛上你》即將在台上映，台灣片商也趁勢推出「限量珍藏預售票」，450

  元內含兩張可收藏上聯的電影交換券，以及一組兩張包含男女主角Bright與Yaya的演員精

  美閃卡，即將在本週五（5/31）中午12:00於博客來售票網開賣，數量有限，售完即止，

  敬請把握購票良機（）。



  這部翻拍自感動全球數百萬觀眾愛情之作，並旁敲泰國人民負債問題的《分期付款愛上你

  》，即將在6月21日於台灣催淚獻映。本片劇情描述在芭達雅這個充滿活力的不夜城，阿

  波（Bright飾演）日復一日帶著夥伴們四處討債。雖然阿波表面上態度強硬，但討債手法

  卻頗為反常，不但不會對債務人訴諸暴力，反而還會拿起手邊的東西，把自己敲到頭破血

  流，讓債務人虧欠地趕快還債。沒有任何抱負的阿波，某天邂逅了必須努力工作來償還父

  親債務的小盈（Yaya飾演）。小盈打從一開始就瞧不起阿波，但阿波卻對她一見傾心。出

  於對小盈的愛與同情，阿波提出一份約會契約──透過跟他約會來支付利息。小盈別無選

  擇，只好無奈地同意這項安排。在兩人波折不斷的約會過程當中，他們也逐漸發現到彼此

  的真心。不過當討債人愛上債務人時，會發生什麼事情？而這段負債累累的愛情之路，最

  終將引領兩人走向何方呢？



