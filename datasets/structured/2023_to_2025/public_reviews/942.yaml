title: '[新聞]<分期付款愛上你>衝擊劇本,女主角大開眼界'
content: '新聞網址：



  翻拍台韓愛情經典《當男人戀愛時》的泰國年度話題夯片《分期付款愛上你》，即將在6

  月21日於台灣催淚獻映。本片除了邀請到《流星花園泰國版》的「泰版道明寺」瓦奇拉維

  特奇瓦雷（Bright），更請來以電影《把哥哥退貨可以嗎》晉升「泰國億萬票房女神」的

  烏拉薩雅斯帕邦德（Yaya）攜手主演。俊男美女在片中浪漫談情，也讓影迷們期待不已。

  尤其本片讓Yaya體驗到前所未見的另一個世界，甚至直呼：「這對我來說，是一次大開眼

  界的經驗。」她也大讚Bright是個非常努力的人，尤其佩服他的工作精神：「沒有人比他

  更適合這個角色了！」尤其Yaya的演出驚艷各界，而她交往多年的正牌男友、同時也是電

  影《鬼聲泣》男主角納得克庫吉米亞（Nadech），也在觀賞本片後直呼：「Bright和Yaya

  相愛相殺很可愛，兩人有著良好的化學效應。」





  泰挪混血女星Yaya，曾在2013年以戲劇《愛土之爭》榮獲Mekhala最佳女主角獎肯定，同

  時並斬獲年度最受歡迎女演員。2018年擔綱電影《把哥哥退貨可以嗎》女主角，更在泰國

  獲得破億票房佳績，讓她受封「億萬票房女神」。這回她在《分期付款愛上你》當中，飾

  演美麗的銀行行員「小盈」，因為背上要替父親債務償還債務利息的重擔，讓她結識到討

  債人「阿波」，兩人更發展出一段冤家般的愛情。不過兩人不知道的是，還有更巨大的障

  礙正準備衝擊他們的關係，觀眾也將因為兩人的後續發展而淚灑影廳。Yaya坦言很喜歡這

  個劇本，尤其故事打開了她的世界，讓她看到並體驗到前所未見的世界另一面：「本片有

  個前所未見的故事情節，也有相當多黑暗面。我承認是個生活過得很好的人，所以從來沒

  有接觸過這麼黑暗的東西。當我加入劇組時，我就覺得『哇！他們必須經歷這樣的事情嗎

  ？』這對我來說是一次大開眼界的經驗，感受到他們的生活，並不如我們想像中那樣容易

  。」



  首度跟男神Bright搭擋，也讓Yaya表示：「Bright是個很努力的人，對他的充實感到印象

  深刻，我真的很佩服他的工作精神，可說是沒有人比他更適合這個角色。人們可能都會覺

  得他的角色很壞，但其實卻也相當溫暖，這跟Bright非常匹配，我也希望觀眾可以不斷地

  觀賞本片。」而對於跟Yaya首度合作，Bright也大讚：「她有很好的能量，合作起來非常

  舒服，而且Yaya的演出經驗也相當豐富。」





  Yaya在《分期付款愛上你》演繹出角色的多層次面向，因此獲得各界稱讚。影評人「

  Watchman」直呼：「這是Yaya從影至今最好的表演，從第一場戲到最後一場表演都很自然

  ，我真希望她能獲得泰國電影大獎的提名。Yaya非常擅長透過臉部表情、眼神、聲音和臉

  部動作來傳遞情緒，並讓我們真正相信這是故事中的女主角，而不是Yaya，這也讓她的表

  演跟南韓原版的女主角韓惠軫絲毫不遜色。」泰國新聞網「TNNthailand」也直指：「

  Yaya依然是MVP，扮演著戲劇化的角色，她在片中面對各種壓力可說是表現得游刃有餘。

  」值得一提的是，上週Yaya也在社群上，分享與她愛情長跑多年的「國民CP」男友Nadech

  ，兩人已經求婚滿一年，放閃羨煞眾人。而Nadech日前也早就進場支持女友的電影，並在

  觀賞後肯定：「Bright和Yaya相愛相殺很可愛，兩人有著良好的化學效應。這是一部光看

  預告片還不夠的電影，你一定還得要看正片，這也讓我們想起了香港的浪漫動作片。」



  這部翻拍自感動全球數百萬觀眾愛情之作《分期付款愛上你》，即將在6月21日於台灣催

  淚獻映。「限量珍藏預售票」目前正在博客來售票網熱賣當中，450元內含兩張可收藏上

  聯的電影交換券，以及一組兩張包含男女主角Bright與Yaya的演員精美閃卡，敬請把握購

  票良機（）。本片劇情描述在

  芭達雅這個充滿活力的不夜城，阿波（Bright飾演）日復一日帶著夥伴們四處討債。雖然

  阿波表面上態度強硬，但討債手法卻頗為反常，不但不會對債務人訴諸暴力，反而還會拿

  起手邊的東西，把自己敲到頭破血流，讓債務人虧欠地趕快還債。沒有任何抱負的阿波，

  某天邂逅了必須努力工作來償還父親債務的小盈（Yaya飾演）。小盈打從一開始就瞧不起

  阿波，但阿波卻對她一見傾心。出於對小盈的愛與同情，阿波提出一份約會契約──透過

  跟他約會來支付利息。小盈別無選擇，只好無奈地同意這項安排。在兩人波折不斷的約會

  過程當中，他們也逐漸發現到彼此的真心。不過當討債人愛上債務人時，會發生什麼事情

  ？而這段負債累累的愛情之路，最終將引領兩人走向何方呢？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
