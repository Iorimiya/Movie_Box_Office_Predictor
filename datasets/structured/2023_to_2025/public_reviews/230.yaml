title: '[極好雷]占星轉運站 #台北電影節'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n#台北電影節\n《#占星轉運站》極好雷影評：星座迷請進場\n\
  \n■ 無雷推薦語\n\n人生大事喜歡算命卜卦問別人的觀眾，這部請一定要看！多個好玩故事，帶你重新看待機\n會與命運。略顯語意重複，但用幽默的風格來補足。\n\n\
  \n\n（以下有雷）\n\n占星師擔任客戶的人生導師，告訴你去個風水寶地，就能重新投胎、任何問題迎刃而解（\n而且還真的身體力行，佩服佩服）。\n\n他跟客戶說：「你可以決定自己的命運，沒有什麼是命中注定的。」又說：「但是你必須\n\
  去到XXX的XXX才能改運。」\n\n短短幾句話，就點出了矛盾之處：既然你可以決定自己的命運，為何要把主控權給占星師\n？甚至得去到外國才能行動？\n\n但更好笑的是，這是很多人做的事啊！遇到人生不順就歐美讀書留學，或是至少飛日本幾\n\
  天散散心。旅行，像是一場催眠、一個邀請，\n\n\n除了占卜、旅行的迷信，這部片也講「愛情能治癒一切」的荒謬信念。人生過得不開心，\n就全部導到需要愛情，結果還真的很多人中招。\n\
  \n但後來隨著每個故事的發展，你會發現根本不是這回事：喪母的女人想要的是隨心所欲的\n自由、母胎單身的中年大叔，其實就想討好他母親（他母親根本就不想讓他離開身邊）。\n\
  只是尋找愛情的藉口，至少能讓他們起身行動。隨意指個方向起來走走，都比單純的靜止\n不動好。\n\n電影還談到很多框架跟迷信，例如：冬天沒有人會游泳、女人碰到愛情就變瘋子，女人開\n\
  車和工作能力差等等。這些框架跟信念，其實就是阻擋我們做出自由選擇的真正阻礙。《\n占星轉運站》裡沒有特別出言諷刺，只是正常講述這些話語，就已讓全場哄堂大笑。\n\
  ／\n這部片也很好的展示什麼是「吸引力法則」。人以為自己是理性的依靠資訊做決定，但電\n影中呈現的，其實是決定（或是被引導）了，才開始找論據佐證自己的觀點，最後形成行\n\
  動。\n\n於是，只要你先默默傾向一個方向，越常在生活中找支持的資訊，你就越可能往這條路邁\n進。事後回想起來，你會覺得這些理由一、理由二、理由三讓你做了決定，其實可能是：\n\
  你的信念讓你更傾向看到、相信理由一二三。\n\n\n\n／\n看完這部諷刺和幽默感十足的紀錄片，我本來想俗套的問：「所以你什麼時候才要對人生\n說Yes？」但想了一圈後，我決定說：「想相信什麼就去吧！需要什麼儀式才能下定決心\n\
  ，儘管花錢、花時間。」\n\n看了那麼多客戶故事，可以更輕鬆的看待人的矛盾跟脆弱，也多了份溫柔。面對固執不通\n的人，也可以轉念去想：也許他現在就是不想改變，在原地抱怨其實比較舒服好過。\n\
  \n你不會因一句話像閃電一樣劈下來，就知道正確的人生方向，但這些心理暗示，至少讓你\n獲得行動的允許和認可，或是更跳脫自在的看待（忍受）一樣糟的現狀。\n\n\
  所以，\n\n\n\n\n網頁好讀版>> \n\n–\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n--"
