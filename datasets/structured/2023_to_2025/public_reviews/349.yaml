title: '[好雷]《飛馳人生2》儘管老派，但滿載無敵的熱血'
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  由於在廣州時剛好有一個晚上的空檔，加上今年中國賀歲電影的評價普遍不錯，就想說可

  以把握機會，看一部體驗一下。結果發現春節的中國電影院，原來只有播賀歲電影XD


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  除了比想像中更多的轉折（Aka. 挑戰）外，即便沒看過前作如我，也都完全可以預期這

  部電影的劇情走向。然而《飛馳人生2》對運動題材神髓的高度掌握，讓我在故事到了三

  幕劇中結尾的最後一屆「巴音布魯克拉力賽」時，好幾度都熱血到想要拍手。


  在這場比賽中，年輕、老驥兩代車手各自追求的突破，替彼此的自我實現增添了分量。沈

  騰飾演的主角張馳開的是一台只裝有比賽規定中基本零件的跑車，爭的也不是「最快」，

  但這背後，是他在不斷地說服自己放棄後，因為小海的優異賽果而終於下定決心、不再逃

  避。


  不退賽「面對並戰勝恐懼」的決定，讓無線電另一邊維修員記星所說的「最後一台經過每

  一段賽道的賽車」有了實質意義，在情感塑造上真的非常飽滿、激勵人心。


  Btw，電影中居然拿山寨車開玩笑，還大談了一段「可以沒成績，但不能不公平」XD 還有

  范丞丞竟然在電影裡抽菸，小鮮肉都會在銀幕上抽，不少人在室內抽好像也不奇怪了（Ｘ


  部落格短評原文：


  --


  部落格：

  FB：

  IG：


  --

  對，可能只能看看串流會不會有了>"<'
