url: https://www.ptt.cc/bbs/movie/M.1457950403.A.3F8.html
title: '[普雷] 《絕命救援》回歸老派風格的災難電影'
content: '網頁版文章：


  幕迷影評：


  痞客邦：



  《絕命救援》（The Finest Hours）


  回歸老派風格的災難電影


  by XXY



  《絕命救援》正如其原文The Finest Hours所述，在最佳的時機點上映，可說是近期電影


  檔期卡位時間相當巧妙的電影作品。不僅在眾多文藝電影中以災難加上特效片之姿，在電


  影院線名單中脫穎而出，主打克里斯潘恩、艾瑞克巴納以及曾執導《充氣娃娃之戀》的導


  演—克雷格格里斯佩（Craig Gillespie）等演員、導演排場，這部真實故事改編的救難


  題材電影，確實在商業操作上有不錯的行銷策略。




  故事時間是以1952年所發生的真實海難救援事件為舞台，片中濃濃的復古風格，不論在氣


  氛營造或是劇情編排都產生了正反兩面的影響。喜的是，電影忠實還原了當年海難以及英


  勇的海巡隊員置個人生死於度外的高尚情操，著實令人感動。憂的是，電影描述過於保守


  ，劇情張力無法展開，導致整體情緒平舖直述的說完整起事件。在緊張的高潮橋段，情緒


  無法延續，使得電影整體雖屬佳作，但終究無法成為亮眼的經典海難救援電影。




  就故事的劇情而言，電影針對主角伯尼韋伯（克里斯潘恩飾演）帶領三位海巡隊員，駕駛


  單薄的小船勇闖怒海的過程，考究十分細膩。不但以當年的救援小艇打造了超高還原度的


  道具小船，還找來當年參與救援行動的安迪費斯傑羅（片中由凱爾加納飾演）以及梅爾高


  特洛（片中由畢歐納普飾演）兩位隊員擔任顧問，忠實還原了四位英勇的海巡隊員在怒海


  中與大自然搏鬥的過程。在電影中段的破浪橋段，的確創造了一種人類面對災害的渺小及


  無力感，讓人不禁對大自然產生敬畏。片中所呈現的天候特效十分驚人，一般拍片認為難


  以掌握的流體效果，也將近岸的碎浪、淺灘的波浪淺化效應表現相當寫實。而船體在大海


  波浪中漂流的無助感，不論在片中海巡方的小船，或是受難方的大船，緊張絕望的氣氛營


  造得相當不錯。綜合而言，針對重現當年風暴的大海環境，個人給予高度的肯定。




  值得一提的是，電影中花了大部分的篇幅描述潘德頓號貨輪船員，如何合力將斷裂的船尾


  開往淺灘沙洲，從彼此意見分歧到合作無間的過程，我認為是電影中最精采的部分，甚至


  搶盡了海巡四人組的風采。令我最感動的，莫過於船員們從頂層甲板傳話到最底層的輪機


  室，流暢的一鏡到底鏡頭將每位演員的緊密關係表現相當傑出。而電影中特別帶到了綁住


  克難船舵的鐵鍊畫面，似乎說明了海事文化中強調的錨鍊精神，每一個船上的水手都是團


  隊中不可或缺的一部份，我想是《絕命救援》中令人印象最深刻的片段。




  另一個有趣的地方，就是海巡四人組在茫茫大海中隨口唱起的「船夫號子」（shanty）-


  《Haul Away Joe》一曲，說明了電影團隊試圖營造討海人的樂天精神。這首朗朗上口的


  曲子是古老的水手民謠，源自大航海時代的水手們彼此在甲板上隨口歌唱的流傳歌曲。平


  穩的曲調及節拍，目的在於協調水手們彼此的工作節奏，達到動作的一致性與氣勢，降低


  在大海這個深不可測的環境，所面臨焦慮與不安，也有解悶和社交的重要意義。在劇中的


  海巡隊員們隨口哼唱出的「船夫號子」，或許掌握了迪士尼一如往常加入音樂元素的傳統


  ，其實算是畫龍點睛的神來一筆，相信這些在海上奮鬥的討海人非常有感觸。




  然而，可惜的是電影中穿插主角柏尼韋伯以及女主角蜜莉安的愛情故事，試圖營造角色間


  感情的羈絆，但反而弄巧成拙。不僅使得故事焦點過於分散，無法聚焦於主軸故事，喧賓


  奪主的旁線劇情，反而讓原本緊張的氣氛無法得以延續，實為可惜。由荷莉黛葛蘭格（


  Holliday Grainger）所飾演的女主角在電信公司、海巡哨站以及港口小鎮之間穿梭戲碼


  ，彷彿一位討海人的門外漢，與當地人格格不入，並不顧丈夫身為海巡人員的天職，無理


  要求上司召回四人小組的行為更讓人直翻白眼。再者，荷莉黛與克里斯兩位演員的表演方


  式，始終存在著時代的距離感，無法將當事人的心情詮釋到位，是另一個電影的缺憾。反


  倒是由凱西艾佛列克（Casey Affleck）所飾演的西博，指揮潘德頓號船尾並帶領船員脫


  困的過程表現亮眼；由艾瑞克班納所飾演的海巡哨站站長，面對眾人不信任的質疑仍指派


  主角前往救援的命令，沒有過多的情緒表達卻讓人感受到焦慮下的冷靜執著，其表演方式


  極具的渲染力，令人驚艷，同時也讓人反思對於專業職責的擇善固執，面對批評仍堅持專


  業的敬業態度，相信是劇中這兩位角色內心是天人交戰的焦慮。




  有趣的是，在海難救援的片段，電影製作團隊考究十分忠於史實。包括男主角柏尼確實在


  駕駛小艇時，刻意脫下救生衣以方便操作方向舵，也在丟失羅盤以及船棚的情況下，幸運


  找到斷裂的貨輪。後也確實奇蹟地將32位船員（不包括4位海巡隊員），利用只限載12位


  人員的小船返回港口，成為美國海巡史上的傳奇。但在男女主角間的愛情橋段，為了加深


  戲劇效果改編了不少史實。例如男女主角早在救難事件發生前就已結婚，結婚的日期也不


  是劇中所說的4月16日；且救難事件發生當天，女主角事實上是感冒在家休養。而史實也


  沒有如電影最後所呈現的以車燈照亮港口，反而是柏尼利用岸上的反光，在漆黑的大海中


  摸索回港。回歸電影，或許編劇希望將這段值得歌頌的歷史加以深化戲劇效果，並嘗試透


  過冒險以及愛情兩者元素，成就一個勵志又感動的故事，卻野心太大，無法掌握重點加深


  張力，僅平穩的說完一個不錯的故事，是較為可惜的地方。




  整體而言，《絕命救援》確實掌握了討海人樂天知命的精神，也同時將海上災難的無助與


  緊張的氣氛營造得相當出色。但過於分散的主線及旁支劇情，讓電影焦點失焦，同時無法


  有效建立起戲劇情緒，使得故事張力無法展開，成為一部平穩、精彩，卻毫無起伏或令人


  感嘆的高潮，在氣氛營造上有失水準。但我想，迪士尼這次推出的《絕命救援》，內容掌


  握了該公司一如往常的精神，以懷舊的風格說出一段富有教育意義的故事，同時加入了音


  樂、愛情以及友情等多種溫馨的元素，是一部適合介紹有志從事海事事業的朋友的電影。










  【視覺動物的電影觀點】個人評分：


  故事劇情：


  故事劇情沒有過多花俏或是過於複雜的內容，反而平舖直述的描寫海巡隊員前往救援、受


  難的貨輪船員如何脫困以及在陸地上心急如焚的朋友與親人，三方面的描述不斷切換，有


  失劇情連貫以及戲劇情緒的累積，整體而言十分平淡。（6.5 / 10）




  影像美學：


  片中營造暴風雨的大海環境十分震撼，特別是小船在淺海地區的破浪航行橋段，視覺效果


  非常出色。雖然場景多半設定於夜晚，但有效利用風雨交加以及人工照明的光線，呈現大


  自然詭譎多變的緊張氣氛，在影像美學方面營造相當出色。（7.5 / 10）






  電影配樂：


  由美國電影配樂家卡特部威爾（Carter Burwell）操刀的配樂，在吵雜的大自然環境中很


  難有強烈的記憶點。在對話的戲份橋段中，配樂的氣氛營造則表現平淡。但在片中巧妙插


  入船夫號子民謠，以及片尾由柯達線樂團（Kodaline）所演唱的《Haul Away Joe》一曲


  ，呈現討海人的豪邁氣魄令人印象深刻。（7.0 / 10）




  視覺特效：


  透過大量藍幕呈現的暴風雨海象環境，是本片中最具特色的賣點。大規模的特效場景，將


  人類渺小的無助感表現十分震撼。（7.5 / 10）




  觀眾取向：（不計分）


  喜愛海難救援題材的觀眾、喜愛克里斯潘恩的觀眾、喜愛凱西艾佛列克的觀眾、喜愛艾瑞


  克巴納的觀眾、喜愛災難題材的觀眾




  個人總評：7.1 / 10






