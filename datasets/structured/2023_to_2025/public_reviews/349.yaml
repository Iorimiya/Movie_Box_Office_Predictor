content: '手機排版不順敬請見諒。


  大概是因為滿滿的 GnR，讓我看得很高興，覺得比三好看。


  感覺搞笑的部分比三少。有些過場其實沒在搞笑，但氛圍

  可能讓人誤以為在搞笑。


  同志情節其實只有兩段，一段對話提到，另一段只有一幕，

  加起來不到五分鐘。


  決戰部分，如果喜歡索爾在無限之戰的場面應該會喜歡。

  索爾和珍互動感人的部分不少。


  缺點的話，感覺和三一樣：想用淺嚐即止的方式觸及深刻的主題。


  四首GnR 用的很讚。

  ----

  Sent from  on my iPhone XS


