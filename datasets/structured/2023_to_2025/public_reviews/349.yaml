title: '[好無雷] 充滿昭和老派推理劇氣息的鬼太郎'
content: '老實說它不是一部我在第一時間就注意的片

  因為我根本就沒看過它的漫畫和卡通，唯一看過能沾上邊的是日劇鬼太郎之妻

  而且海報上每個人都沾著血，看起來就像什麼命案現場(結果片裡還真的有命案

  會去看還是因為懂日文的朋友大力推

  他在去年日本上映期間去日本遊玩特別進電影院看

  也因此台灣上映時我也基於好奇進電影院觀看


  一開始沒什麼特別，等到男主角走入村裡時，總覺得這種氣氛似曾相識：

  近乎封閉的村落、村裡神秘的事件、暗潮洶湧的家族

  等到第一個命案出現，家族的頭人說出無法對外連絡時，突然想到：

  啊，這不就是金田一的秘室殺人嗎??(是爺爺不是孫子


  於是接下來我就把它當成推理劇在看

  解謎->找出兇手

  只不過有妖怪這出乎常理的存在，所以我一直猜錯(倒

  但即使如此仍不妨礙我理解這整個故事

  悲哀又可怖的人性，整個村子都是一場噁心的悲劇

  還好最後的最後，終究有留下了希望


  很感謝推薦給我的朋友，也還好自己有聽從他的推薦

  電影好看，配樂好聽

  也因為采昌很認真代理，每週都有新特典

  我想只要還有新特典，我就會進場看吧


  -----------

  ps.後來看完別人的討論，原來這部片真的有參考八墓村

  也才知道我看到的鬼太郎海報中，除了鬼太郎外其他出現的角色都有血的意義

  是指鬼太郎是被保護著的

  看著別人討論得知自己不知道的小細節，讓我更想再進場看了


  --'
