url: https://www.ptt.cc/bbs/movie/M.1485352974.A.0F3.html
title: '[  好雷]  鋼鐵英雄  老派的戰爭片風格'
content: '第一次在電影版發影評文，雖然上映已經很長一段時間，還是請各位大師不吝指教








  自《搶救雷恩大兵》以降，開創了戰爭的新樣貌，寫實的影像風格取代了以往的誇張的動

  作片式風格，快速晃動、轉換的鏡頭營造擬真的臨場感。主角不再是一夫當關萬夫當關萬

  夫莫敵的超人，而是有血有肉、會中彈流血的凡人，敵人也不再只是只會應聲中彈的雜魚

  群，許多戰爭片/影集，如《太平戰爭》、《勇士們》，往往有類似橋段:在屍橫遍野的戰

  場上，美國士兵在搜索敵人士兵遺體時，在身上發現妻子女友留下的書信/照片，美國大

  兵伸手撿起閱讀後，與同袍相視無語。甚至就連素有「大美國主義」惡名的麥可貝，在《

  13小時:班加西的秘密士兵》結尾，也不免俗地安排了恐怖部分子家人出面痛哭認屍的橋

  段，試圖平衡一下敵我雙方的觀點。


  以上這些特點，與本片的調性有有很大的差距。當片中場景來到沖繩戰場時，其戰場氛圍

  的還原堪稱真實，遍地斷肢殘臂的焦土，頗有踏入修羅地獄之感。但戰鬥場面開始時，我

  們看到一名美軍士兵一手用屍體當掩護，一手單持重達9公斤重的自動步槍，彈無虛發的

  連續擊倒了數名日軍士兵，甚至無須裝填彈藥，此時心中浮現的竟是小馬哥以慢動作手持

  雙槍大發神威的畫面(有趣的是，同為吳宇森導演的《獵風行動》，也有類似橋段)，頗有

  90年代動作片的風格。同時在空拍鏡頭下，日軍如同半獸人軍傾巢而出向美軍進攻，即使

  在在美軍的火力下一一倒下，卻仿佛失去理智班繼續往前衝鋒，與《末日之戰》的殭屍海

  嘯又有幾分神似，一方面或許史實的戰鬥就是如此殘酷，與前述電影試圖將敵人描繪的更

  具人性的作法又有所不同。攝影方面，也不像許多戰爭片一樣，鏡頭不斷晃動讓人不適。



  角色部分，安德魯加菲將主角那股憨直帶有傻氣卻又堅定的特質詮釋得恰到好處，編導以

  童年時差點失手將哥哥打死、青年時期父親酒後差點失手開槍將母親打死這兩件事，建構

  主角秉棄暴力、拒絕拿槍的動機，足夠令人信服。


  有趣的是，主角雖然拒絕拿槍，卻並不反戰，他說「我不能留在這裡，眼睜睜看著別人去

  保家衛國」響應國家號召自願從軍，軍中長官說「你可知道我們在對抗的是撒旦」他也表

  示同意，他反對殺戮，但對戰爭本身並不質疑。近來好萊烏出品的戰爭片，不知是出於政

  治正確或其他原因，或多或少都要強調有反戰色彩，如《美國狙擊手》一片，明明故事主

  人公現實生活中就是個標準的愛國者且以打仗為樂，電影中還是特意塑造了他飽受戰爭創

  傷折磨、質疑信念的情節，導演還要特別表示該片具有反戰意識。相比之下，本片誠實的

  舉著愛國大旗，實屬少見。


  山姆沃辛頓、文斯范恩等大牌明星，受限於劇本，發揮的空間並不大，尤其是文斯范恩演

  慣喜劇這回扮演起嚴肅的魔鬼教官角色，似乎頗有違和感，是新兵報到時的訓話這段，力

  道稍嫌不足，相比其他軍事片的同類場景就顯得遜色了(《金甲部隊》的訓話場景筆者目

  前仍無看過比期更出色的)



  女主角外型雖亮麗，但在故事中起到的作用不大，與男主角的相戀戲碼，也處的有些突兀

  ，而在召開軍事法庭的高潮戲碼後，緊接來的是莫名的床戲片段，讓人不禁有點錯愕。


  所幸劇情進入中段之後敘事越發流暢，血脈噴張的戰鬥場面及爆破都讓人大呼過癮，斷手

  斷臂肚破腸流的畫面也毫不遮掩，劇情在主角違抗命令徹夜拯救受傷弟兄時達到最高潮，

  悠揚的配樂搭配主角不斷呼喊著「主阿，讓我再救一個，再救一個就好」令人動容。


  然而最終決戰，導演的處理就顯得有點失控，不合時宜的慢動作畫面加上煽情的配樂讓人

  覺得作秀作過頭，而且搭配的日軍將領切腹的畫面，實在讓人不明白拍攝這段劇情用意何

  在?



  雖有少數瑕疵，但本片故事完整、劇情感人、戰鬥場面精采，仍是不可錯過的一部佳作，

  尤其是戰爭片愛好者更不能錯過，必有耳目一新之感。


  --'
