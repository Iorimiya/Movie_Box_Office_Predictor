title: '[極好雷]超人—正向、陽光、老派'
content: '這部超人帶著一種「漫畫改編」的氣息。

  民眾看著超人打來打去卻站在原地加油吶喊或拿手機拍，這種對英雄、怪物習以為常的態

  度，很快讓我融入了漫畫一般的英雄世界。

  漫威大約是在尚氣看到地下擂台才讓我感受到超人類融入日常，而DC的話則是黑亞當中，

  地域衝突引來各方超人類，以及市民對他們的態度，才算比較有感。


  超人一開始在描述中被打趴，其實我還抱有疑慮，覺得怎麼可能一個地區英雄能打趴他？

  莫非是有什麼大玩意兒亂入？結果打下半局看到光頭，就大概明白這喪盡天良的惡棍又在

  耍陰招了。

  打趴超人的裝甲一開始還猜是完全機器，看到通訊中叫他「魔超人」懷疑了一下。後面揭

  曉是小超廚（入魔小超人殺爆DC漫畫宇宙時，討論者給他的暱稱）才恍然。雖然這版本不

  廚，整個是調教完畢的傀儡XD 揭開面具的一瞬間我還想這是凱羅忍？是黑閃電？是小超

  廚！


  回想起小超廚當年的「豐功偉業」也不得不心驚，在我回憶加成下也算是夠格的對手。只

  是明白對手是誰後，先前超人挨他那麼多下，就反過來覺得超人太結實了XD

  最後收掉他也恰如其分，要不是超人都有收斂力量，他撐死也就凹斷超人一隻手的程度。


  光頭操控小超廚的方式其實挺有疑點的，我相信超人沒什麼在用武打招式，動作很單調，

  很好破解。但是我想到漫畫《狩龍人拉格納》的台詞「在高手的競爭中幾微秒就能判生死

  」，光頭這種肉眼凡胎照理說是跟不上超人打鬥速度的。


  大都會的路人不知道該說是漫畫/搞笑化還是真的在超人庇佑下生活很有安全感。超人打

  起各種反派、怪獸，在大難臨頭之前都沒看到路人在逃命的XD

  就連超人被打趴，還能冷靜吐槽他幹嘛干涉他國事務？我自己是喜歡「超人讓他們很有安

  全感」這個理由，不過超人被打趴也沒看到他們很震驚，這可是他出道第一敗耶？


  克拉克跟露易絲的對談訊息量很大，不過我在意的是兩人之間的關係，或該說是露易絲連

  恩的塑造。露易絲自稱是龐克女孩，質疑任何事，但是克拉克卻相信所有人，並自嘲我才

  龐克。

  我電影當下是把龐克當作是「非主流」的意思，但是Google 一下結果說是「反權威，崇

  尚個人自由」。但是電影中說的龐克也不像是這個意思XD

  跟露易絲相像的角色我第一個想到就荷蘭弟蜘蛛人的MJ，也是一副冷眼看事的態度。這其

  實在現代是越來越廣泛的現象，現代化的程度越高，越質疑政府。


  最後整個辦公室根本都知道超人就是克拉克，正在跟露易絲交往真是情理之中XDD 那段拍

  攝露易絲回身抱超人的運鏡和畫面實在是超美的，有機會的話我真想重播這一段，多回味

  幾次。

  而這段運鏡雖然只是一瞬間，但是也給我一種「這莫非是致敬漫畫構圖」的感覺。我自己

  是不太想找超人漫畫一部部翻過去，就看哪天會不會有說明文/影片。


  接著來講講「正義幫」，這綠燈不是我熟悉的那幾代，或許是「超人問蝙蝠俠揍了那個混

  蛋綠燈的感想如何？」的那位綠燈XD

  在戰場上保護立旗兒童不被殺那時，自殺小隊的印象突然跑出來惡作劇，讓我想像出在戰

  場上沒保護自己的綠燈被亂槍打死的畫面XD


  我朋友問鷹女跟之前黑亞當那個鷹人之間的關係，我也只能說以前看的作品他們常配對出

  現。但是近幾年少看，電影又都讓他們各別出現，所以我也不好說。

  記得鷹人鷹女是有神話基礎的英雄，他們面對惡人是有傳統神明的裁量權。不過這部片真

  要說誰該死，那肯定就是那個邪惡的獨裁政客了，所以沒問題！


  卓越就，我真的第一次知道這個英雄，但是他在這部片的表現根本MVP！邊放音樂邊打架

  ，還要揍在節拍上看起來真的是超爽的！球球被狗狗咬壞時暴怒也很爆笑XD 太習慣看到

  老爺們的高科技裝備被開罐頭還是當煙火放，突然有人對自己昂貴的裝備被打爆而暴怒的

  正常反應反而不習慣了XDD

  比對後來光頭的團隊操控的無人機通通被狗狗咬爛，就覺得卓越能操控無人機撐到被狗狗

  咬爛前救出所有人，又顯得他更加有料。而且團隊遠端操控的機器被一個個點爆還暴怒的

  反應也是令人會心一笑的老梗XD

  片尾彩蛋中被歪頭研究拼合大樓的超人氣走是挺好笑的XD 不過說真的拆掉比較好吧？加

  上光頭失勢而留下的真空，可以想像大都會的房地產市場將迎來一波廝殺(ry


  終於來講到超人本身，在打反派時還能救路人、救狗、救松鼠，完事後抱著一堆小孩的超

  人真的是看了很暖心。

  鋼鐵英雄注重在如何讓人們接受他，因此情節充滿壓力。這部超人就帶我回到當年，超人

  作為真英雄，受人敬仰的時代。而且少掉蝙蝠俠真的是讓調性輕鬆很多XD

  上次看到這種聲望超高的英雄…我只想到蜘蛛人。但還是有悲劇成分，沒那麼陽光正向，

  令人感到安心。

  所以這位沒有一堆苦大仇深的超人真的把我帶回到當年那一看到超人就能安心的年代。而

  且現代習慣了多位英雄，又有華麗特效，相比起漫威時代以前的超人電影，我若是漫畫迷

  ，必會感慨過了20年，總算看到堪比漫畫刺激的超人電影！

  有一點很神奇的是，大部分時間，超人紅內褲都不讓我感到突兀。只有在被抓去走傳送門

  時遊街示眾（？）那一段我才注意到實在有夠醜XD也不知道是不是視線誘導，那段還能很

  明顯地看到小克拉克XD


  光頭在超人來討狗時故意刺激他，但超人又拿他沒皮條的段落根本霸凌現場XD 現代我們

  太習慣遇到霸凌仔就開幹的情節了，超人抑制住自己的段落就使得許多觀眾不能接受。但

  是在我看來這份抑制自己的功夫就顯得格外可貴。

  而後面配上正義幫打異次元惡魔的背景實在是很鬧，這也是岡恩常用的梗了。綠燈每次bo

  nk牠我都笑出來XD


  另一個超人的特質是誠實，我也對此特別檢視。但催眠眼鏡看起來沒啥作用，一開始以為

  是超人在回應其他人擔心他變裝不足時隨意口胡的，但我想到另一個可能性是某個高科技

  英雄口胡超人用那個來遮掩身分XD

  露易絲對超狗的存在被超人隱瞞似乎很不滿，超人在這話題上支吾其詞也似乎有損誠意。

  但最後超少女出現讓他的含糊有了解釋：這壓根不是他的狗XD 說不定對外宣傳是他的狗

  也是為了隱瞞超少女的存在？（露易絲：你有個堂姐！？）

  題外話一下，我朋友對閃電俠中英氣的超少女印象深刻，對這個跑趴的瞎妹超少女就不太

  能接受。不過考慮到這世界的氪星是侵略主義，超少女不瞎，說不定就是下一部的boss了

  XD


  最後提一下個人覺得最詭異的角色，光頭的女友伊芙。我知道過往超人電影的盧瑟身邊都

  有這種瞎妹女友，當時年紀小沒這疑問，現在這個光頭怎麼會把這瞎妹當女友啦！

  自戀到不行，視人命如螻蟻草芥，結果女友交一個正常人都受不了的瞎妹。難道是古代國

  王身邊要有一個弄臣，來顯得自己很聰明的概念嗎XD

  —————————————————————

  加補一段之前忘記寫到的事，有幾個場景我一下子分不太清是誰在說話。比如說馬利被刑

  殺之後哭喊「不…」的原本以為是超人，但是看超人的嘴巴似乎沒有動。後來切幾次畫面

  回來看到元素人在哭才覺得是他？

  而後來有好幾個場景也給我類似的感覺，好像演員嘴型跟台詞對不上。說不定有重新配音

  過？


  再順帶吐個槽，元素人寶寶真的沒碰到反質子川流嗎？當時那混亂狀況，又「水」流湍急

  ，多少有潑到一些吧？感覺日後寶寶會因此覺醒什麼更強的能力也說不定XD


  --

  結果虐狗就造反了。要是光頭覺得沒有道德意識是低智商的特徵的話，這迴力鏢可就打在

  他自己身上了XD

  謝補。以前我會說這是暑假到了，但現在ptt只有老人會用，所以就無視吧XD

  這設定我沒看過，我看過的是他在當克拉克時會一直高速震動自己的臉，讓別人對他的臉

  印象模糊XD

  這段我一直想到以巴，有的文章會說是俄烏，但是俄又不是美國盟友XD

  鷹女側躺沙發時的大屁屁超讚的！

  我對早年的卡通印象也是鷹女超莽，幾乎都第一個衝上去送（X）有時鷹人還得拉住她XD

  15歲喝酒跑趴也太母湯！起碼17、18吧

  我朋友覺得MOS肯特爸很帥，是塑造超人人格的重點。但是這版本的肯特爸沒犧牲，超人

  還是正義正直啊XD

  那一滴淚有讓他整個立體起來耶！在明白自己全面敗北，失去了一切的當下，所有的情緒

  都濃縮到那一滴淚上，真的是電影藝術！

  我當下甚至同情了他一下，連超人都一副想得意的笑又不敢笑得太得意的感覺XD不過我馬

  上又想到本片唯一的犧牲者馬利QQ對光頭的同情立刻又變成憤慨。

  相比之下肯特爸給我要努力一下才能擠出淚的感覺，當時克拉克的表情在我看來還一副擔

  心他擠不出淚，終於擠出來時還鬆口氣的印象XD

  這現實的案例還真是有說服力！

  我有幾個很聰明的朋友真的也不會被聰明這個特質吸引，可能對他們來說看到聰明的人只

  會想證明自己比他更聰明？

  不過他同時也不喜歡不聰明的人，所以在那邊該該叫自己單身，我也只能笑笑的XD

  我朋友則是亨超鐵粉，漫畫粉會暱稱超人「大超」，亨超真的比這版超人更有存在感，很

  符合大超這個暱稱。我們討論到最後都是怨嘆華納罪大惡極！'
