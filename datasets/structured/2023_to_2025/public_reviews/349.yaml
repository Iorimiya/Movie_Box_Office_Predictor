url: https://www.ptt.cc/bbs/movie/M.1520054420.A.58C.html
title: '[好雷]《鎌倉物語》古意老派甜美迷人的奇幻物語'
content: "本文轉錄自：\n\n眼眸自帶兩條上弦月弧度的堺雅人、一笑就讓氣氛明亮起來的高畑充希、加上打造了「幸\n福三丁目」系列的導演山崎貴，有這三位激盪出的作品，未看就知道一定能讓人微笑面對\n\
  。然而電影《鎌倉物語》不只有搞笑而已，這部結合了濃濃古意、淡淡憂傷、滿滿暖意、\n同時又深深讓人感動的奇幻故事，用溫潤又深情的姿態，浪漫輕巧地訴說何謂「DESTINY\n\
  」。\n\n故事是從何開始的呢？從片名就能解答，就發生在古色古香的「鎌倉」。可愛甜美的女孩\n亞紀子（高畑充希 飾）嫁給懸疑小說作家一色正和（堺雅人 飾）後，搬入丈夫位於鎌倉\n\
  的家中，除了彷彿停住時光的街道令人著迷之外，生活周遭亦充滿著許多不可思議的事情\n。比如幫忙家務的阿姨已經 130 歲了；丈夫得去協助警方的古怪搜查課辦案；家裡會有\n\
  河童、窮神出沒；還親眼目睹過死神（安藤櫻 飾）；當地夜市裡販售的全是「異世界」\n蔬果，不小心吃錯「菜」，就有可能靈魂出竅一命歸西！\n\n即使小狀況不斷，但兩人生活依舊溫暖又幸福。然而有一天，生了病的正和醒來時，卻發\n\
  現亞紀子消失了，原來妻子已因為「意外」而逝去。亞紀子為了不讓自己散發出的「靈氣\n」再傷害正和的身體，而選擇離去。在循線發掘出亞紀子死亡的真相後，正和不願如此輕\n\
  易放手，遂決心勇闖黃泉國，誓言把愛妻接回人間，力圖重返過往的溫馨日常。\n\n該劇的日文片名為「DESTINY～鎌倉ものがたり」（DESTINY～鎌倉物語），這份「\n\
  DESTINY」至為關鍵，要說劇情裡不斷以不同的橋段、角度、態度反覆辯證，也不為過。\n俗話說「十年修得同船渡，百年修得共枕眠」，人與人之間的相知、相惜到相愛，得攢積\n\
  太多的福份與運氣，言稱「命運」倒也貼切。不過相愛之後如何相處相守，願意禍福相依\n到什麼程度，又是另一項課題了。\n\n如果說正和與亞紀子的相愛是一種命中注定，那麼是否也應以同樣的姿態，去接受每個人\n\
  都必須承受的宿命——死亡呢？但隨著正和將「意外」抽絲剝繭、發現亞紀子的死並沒有\n想像中單純後，他又該如何去突破這份難以突破的生死疆界？除了靠自己的努力之外，過\n\
  去無意間結下的緣分，在劇情中也發揮出命定般的作用。太刻意的巧合讓人出戲，但恰到\n好處的安排，就讓故事精巧細緻、溫暖人心，《鎌倉物語》無疑是隸屬後者的佳例，就算\n\
  不夠驚喜，也能感動滿懷。命運是一種契機，透過努力與心意編織出物語，才能成就奇蹟\n。\n「死亡」是充滿遺憾的，勢必伴隨著眼淚。《鎌倉物語》出現了無數的死亡意象與人的離\n\
  去，卻又用溫柔而奇幻的口吻來訴說，多少沖淡了這份哀傷；但同時，仍保留著它殘忍的\n一面。劇中的設定是，逝去的人們可以和死神打商量，讓自己的人間時間可以再延長加時\n\
  ，但必須挪用生者的壽命或是付出轉變型態的代價才能達成。\n\n故事裡出現了許多運用「交換規則」的對照組，比如年邁的夫婦會選擇前者，畢竟有其中\n一方離世，另一方就得承受孤獨，因此兩人共有、分享活著的時光，雖感傷卻無悔。但要\n\
  剝奪心愛之人的壽命又是談何容易？另一方面，若是選擇了轉變型態，就等於要抹去原有\n的面貌，哪怕再打上照面也認不出來，只能退一步默默守候，無法再回到過去的相處時光\n\
  。將悲與喜、笑與淚呈現出平衡又飽和的狀態，可說是導演山崎貴的拿手技巧；笑鬧之間\n，亦保留更多思考品味的空間。\n\n《鎌倉物語》集結了許多個性派演員，包括飾演主角一色夫婦的堺雅人與高畑充希，擔任\n\
  死神一角的安藤櫻、飾演編輯本田的堤真一，還有藥師丸博子、三浦友和、國村隼、室剛\n、要潤、市川實日子等演員都加入助陣。陣容之豪華就像開獎一般，每有新人物出來就有\n\
  一份驚奇。在佈景的部分，也迷人又講究，畢竟故事類型帶有奇幻色彩，光是嘴上說說可\n不夠，還得要讓人看見才行。像是魔物夜市的佈景，就參考了台灣夜市、韓國釜山札嘎其\n\
  市場等亞洲各地的市場；黃泉國則是以中國湖南省的武陵源與鳳凰古城為靈感。融合了多\n種異國風情，營造出讓人既陌生又熟悉的距離感。有所本但又添加進幻想虛構的成分，奇\n\
  幻意象自然被細膩地烘托出來，因此在觀看《鎌倉物語》時，著眼點可說是相當多。\n\n把文章寫到這裡的時候，筆者稍微遲疑了三秒，怎麼好像全篇都是好評？不過這樣的掙扎\n\
  沒有太久，坦白說，《鎌倉物語》並非一部完美的作品，說不定有些觀眾會覺得亞紀子的\n個性天真善良，有些人反而認為她的不拘小節其實「煩煩」的。然而正負評往往是一體兩\n\
  面的，《鎌倉物語》成功的地方在於，從角色、劇情到氣氛都取得恰如其分的平衡點；觀\n眾汲取到歡樂、感傷、惆悵與安慰，都是剛剛好的份量。再搭配上片尾曲宇多田光的嗓音\n\
  當收尾，成就出一場 130 分鐘、奇幻圓滿的旅程。\n\n「DESTINY」這個字眼很老派，同時也很浪漫，它可以成為消極的推託之詞，也能是勇敢\n邁進的動力。在《鎌倉物語》中，你又能得到什麼樣的命運感召呢？不用多，就算只是想\n\
  更用力地握緊身邊那個人的手，也行。\n\n--\n                               03/03 13:20"
