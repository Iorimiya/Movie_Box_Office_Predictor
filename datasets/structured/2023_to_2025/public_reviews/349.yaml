url: https://www.ptt.cc/bbs/movie/M.1573788101.A.CE4.html
title: '[偏好雷]有點老派、有點可愛—安眠醫生'
content: '雷文防雷資訊頁







  (心得有雷,但可能影響觀看)







  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  由netflix影集《鬼入侵》導演麥可弗拉納根執導的《鬼店》續作《安眠醫生》，算是我

  列在十一月要看清單中的電影。第一週因為強碰金馬影展，所以拖到這週間才看。


  說實話我並不是史丹利庫柏力克的粉絲，雖然知道他是最威的導演之一，卻遲遲沒有補完

  他的電影。即便是《鬼店》，都是在《安眠醫生》發佈消息之後，再有動力補完。


  可能是早就聽過或看過太多《鬼店》的經典畫面，以致於看的時候，並沒有覺得超驚奇或

  超恐怖（但可以想像多年前在電影院裡看這片的人，被電影畫面嚇傻的感覺啦）。看完只

  覺得拜會過史丹利庫柏力克傳說中的經典名片，除此之外，似乎並沒有特別強烈的感受。


  《安眠醫生》的好奇，一方是覺得《鬼店》本身已是完整的故事，不曉得這麼多年後續集

  要怎麼做，二是netflix的《鬼入侵》影集畢竟是我自己一個人就追完的第一部影集，對

  於導演還是有點信心和興趣（雖然聽室友說導演之前拍的電影好壞差距很大）。


  看完覺得《安眠醫生》在續集構想方面，很讓我滿意。它基本上是一個從《鬼店》長出全

  新的故事，有點像是「同人誌」那樣的作品（不曉得這樣說合不合宜）。同行室友說的《

  安眠醫生》其實有點像變種人（x-man系列）或吸血鬼之類的世界觀，我則覺得像是不夠

  多人的哈利波特宇宙（？），而整個故事似乎在說：特殊的心靈能力者是需要被保護，且

  需要把這個「保護工作」傳承下去。這樣的世界觀和想法，對我來說有點老派、有點可愛

  。


  只是就電影來說，我覺得拍得沒有那麼好。看的時候，一直感覺到「為了推進故事而不能

  不用說明的方式講述世界觀」，而角色感覺挺平面沒有立體感，最後的對決感覺也是一種

  懷舊勝於合理的安排（就像室友說的：女主角那麼強，加上根本沒有變弱的男主角，應該

  可以直接ＫＯ反派，回到鬼店感覺完全是一個「因為這是鬼店續集」的安排）。


  總的來說，《安眠醫生》對我來說已經完全不是恐怖片，而是一個關於人類心靈力量的奇

  幻故事。因此，看完的時候，我實在不敢肯定因著《鬼店》續集而進場的觀眾，會喜歡這

  部電影（後來在網路爬文，喜歡《鬼店》的人好像也喜歡這部片...所以我的感受也許並

  不對XD）。雖然以我個人來說...《安眠醫生》在喜歡與不喜歡之間，還是偏向喜歡一點

  ，但仍然有一種「好像可以更好」的聲音一直在耳邊。


  #華納加加油啊



  ***


  這裡是我的樂園:






  FB:





  --'
