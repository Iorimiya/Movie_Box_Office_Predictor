url: https://www.ptt.cc/bbs/movie/M.1660223163.A.B97.html
title: '[負雷] 《給我1天》，不知所云的老派電影。'
content: '部落格版：


  這幾天因為確診被隔離在家，所以找了幾部電影來看，包含之前有在威秀影城限量上映的

  《兒時的點點滴滴》、《隔壁的山田君》，還有一直找不到時間去看、終於等到上串流的

  《巴斯光年》，以及其他幾部隨便找來看的電影，例如Disney+上的《給我1天》。先說結

  論的話，《給我1天》是部很不像是2022年會出現的電影，簡單來說就是很老氣的作品，

  不論是裡頭的劇情、導演說故事的方式、就連海報設計風格都像極了七、八零年代的港產

  愛情片，原作者兼本片導演李敏很顯然的想藉著本片來致敬、懷念舊時香港，那個天星碼

  頭與鐘樓還在、皇后碼頭也還未被拆除的年代，就像前陣子剛在台灣上映的《七人樂隊》

  那樣。


  《給我1天》試著讓愛情與情懷是有連結的，好讓觀眾能從女主角神仙魚在與前男友和馬

  賽克的分與合、她後來的選擇裡，去捕捉到那滲入其中的懷舊情感。很能夠理解導演李敏

  的用心，也不是說她不該用這樣老派的愛情故事當主劇情，但我實在不認為這樣一個不合

  時宜的愛情故事能替她辦到她那想引起觀眾共鳴的意圖，再加上電影裡頭對於所謂的舊時

  香港、對已逝景物的緬懷之描寫不夠多也不夠深，觀眾既然難以體會舊時香港的好，也就

  無法產生嚮往；既然無法產生嚮往那麼《給我1天》基本就算是半失敗了。同樣構想與動

  機，導演李敏是可以借鑑《七人樂隊》的。



  「要你給我一天，不好意思我很自私。」


  「不對，是我很願意給你一天。」


  《給我1天》很明確的有兩個主要想談的主題，一就是愛情，二就是對舊時香港的懷念，

  而如前面提到的，導演李敏有意想把這兩個主題來做結合，但結果其實不盡人意。那既然

  合在一起看不太行，那麼分開來各別看會比較好嗎？先來談論愛情的部分，或許導演李敏

  也知道一般的通俗愛情電影早已很難打中觀眾的心，於是她還放入了前幾年備受關注的漸

  凍症（肌萎縮性側索硬化症）議題在裡面，想藉著讓男主角馬賽克罹患罕見疾病、或將不

  久於世的這件事來讓後續劇情發展成立，也讓男女主角因此注定無法廝守到老的悲傷結局

  來打動觀眾，無奈的是，對馬賽克來說一天或許已足矣，可對觀眾而言顯然不夠，就算中

  間曾幾次提到兩人的家庭狀況、感情生活，可都依然不足以被說服去相信這段感情的成立

  ，到後來導演李敏甚至竟想要觀眾相信所謂的「奇蹟」，神仙魚要馬賽克深信奇蹟能克服

  一切困難，這樣子把劇情建立在奇蹟之上，也只是再讓《給我1天》變得更為俗氣。


  而回到對舊時香港懷念的部分，導演李敏用了很多努力想讓觀眾去感受到她對過去美好年

  代的想念、以及她想自己能夠為保存舊時香港的美好做些什麼的用心，最明顯的就是讓馬

  賽克當起城市速寫畫家，不僅將從小到大、他眼中的香港、父母親喜歡的年代利用畫筆保

  留在了素描本上、牆上，或者各種可以讓他畫畫的東西上頭，也在後來安排了熱愛微景設

  計的老師登場，最後更將馬賽克的畫製作成微景個展，讓他生前的好友、也帶領觀眾進入

  到那個迷人的舊時香港。不過導演李敏較為可惜的就是，不管是對漸凍症的關注，抑或是

  對舊時香港的保留，都是心有餘而力不足，她沒有花更多心力與時間去好好把這兩個主題

  說好、說滿，而就只是為了增加電影的情感厚度而拿來順手放進劇情裡，但這淺淺帶過的

  結果就是效果有限，同時也讓電影找不到重點，什麼都談、什麼都看，卻又什麼都不深，

  稍微可惜。



  《給我1天》看到最後是越看越茫然，在前面少了本應該會有的鋪陳的情況下，不僅僅是

  對神仙魚和馬賽克間的感情從無到有的過程會有質疑，也對之後兩人在一天約定結束過後

  的發展感到困惑，姑且不論神仙魚對馬賽克的感覺如何，可在那天過後馬賽克就不再來找

  自己、然後自己也開始在意起對方，也曉得對方生病的情況下，怎麼就沒想過直接打電話

  或是直接過去對方家裡呢？而後來當神仙魚總算甘願跑去對方家，她對馬賽克說的那句「

  你知不知道我們浪費了多少時間？」也聽了讓人尷尬，前面她根本不喜歡馬賽克，也在馬

  賽克提出要求後直說對他不是那種喜歡，結果最後卻自打嘴巴的說出這句話？簡而言之，

  《給我1天》就是部很不知所云的作品。


  之前從Twins認識蔡卓妍，後來也開始看她演的電影，一直以來都滿欣賞她的演技，但不

  知道是受限於角色的關係還是其他原因，蔡卓妍在《給我1天》中的表現就跟這部電影一

  樣充滿尷尬，而長年被我誤認是中國人的王祖藍，馬賽克這個角色其實挑戰性比神仙魚大

  上許多，然而問題同樣的是，電影沒有給多些篇幅去描寫漸凍症，自然也就讓馬賽克少了

  很多發揮空間，不過從後面他的表現還是看得出他盡力了。


  總結來說，《給我1天》劇本老氣是個問題，劇情內容鬆散是個問題，沒有辦法明確找到

  一個重點去看電影也是問題，導演李敏就初次執導電影的表現看明顯不及格，不光執導功

  力不足，連本業的編劇都不符期待，最終出來的就是這樣一部不會被人記住的作品。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
