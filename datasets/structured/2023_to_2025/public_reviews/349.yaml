url: https://www.ptt.cc/bbs/movie/M.1458819021.A.C97.html
title: '[普雷]《高年級實習生》那些老派紳士教我的事'
content: "《高年級實習生》拍的是年屆七十的鰥夫 BEN（勞勃狄尼諾）因銀髮實習\n\n計畫重新投入職場的故事。就像電影文宣上說的「Experience Never\
  \ Gets\n\nOld」、「經歷，才是你完勝的履歷」，他靠著人生閱歷，成為只懂低頭打\n\n怪的男同事們的「辦公室輔導長」，更適時地為了事業家庭無法兼得的女老\n\
  \n闆安海瑟薇，端上一碗又一碗的「心靈雞湯」。\n\n\n\n　看看台灣的歐哩桑，或者40up的大叔，就像我們的老建築，不是身上一堆\n\n腦滿腸肥的違建，就是掛滿招牌對人叨唸關於世界的各種老生常談，要嘛就\n\
  \n渾身散發著在應酬場上打滾、菸菸酒酒和藥膏藥丸燻出的老人臭。\n\n\n\n\n　這事兒恐怕需要「外國的月亮比較圓」來給點刺激，像是老帥哥喬治克隆\n\n尼、近年紅翻時尚周的街拍寵兒型男大叔Nick\
  \ Wooster，還有就是這齣《高\n\n年級實習生》裡的勞勃狄尼諾。雖然拍過《戀愛沒有假期》、《愛你在心眼\n\n難開》、《男人百分百》的導演南希麥爾斯，總愛把電影裡失敗的感情，溫\n\
  \n馨的包裹進訴諸家庭價值、男有分女有歸的右派保守主義裡。但有時，我們\n\n需要的就是這種充滿老派情懷的肩膀，讓我們靠一靠，讓這些老派紳士告訴\n\n了我們，那些永遠不會過時的，男人該懂得的事。\n\
  \n\n\n　首先他只穿西裝上班，那怕是工作環境超隨興的網購公司，所有人都勸他\n\n放鬆點不必那麼正式，他說，穿西裝，就是讓他最放鬆的方式。仔細想想，\n\n\
  上頭三個時尚大叔不都是靠西裝勝出的嗎，至少它避免男人無節制的發胖。\n\n想想《繼承人生》的喬治克隆尼為戲換上夏威夷襯衫，沒了西裝框住，整個\n\n人垮得多狼狽呀。而且無論上班還是休閒都穿著鬆成荷葉領的ｔ恤、套著皺\n\
  \n巴巴的法蘭絨襯衫，工作生活沒了區分，off 的時候反而覺得更累。至少女\n\n人希望身邊的男伴穿得精神點，而不是一副剛從沙發起身，還要拍去身上零\n\n食屑的矬樣。就算怕熱穿不住整件西裝，班還是主張：「當你去見在乎的人\n\
  \n時，最好還是穿上有領子的上衣吧。」\n\n\n\n　再來，電影裡很多二十多歲的男孩根本不知班隨身攜帶的手帕為何物。同\n\n學，那就是我們打小念幼稚園老師每天要檢查你有沒有帶的手帕衛生紙啊，\n\
  \n長大之後衛生紙留給你的鼻涕汗水跟嘴角的醬汁，手帕呢，班一本正經地說\n\n「當女人落淚的時候，你就知道它的妙用」不過，ps一下，別跟你西裝上裝\n\n飾意義大於實用意義的袋巾搞混了。\n\
  \n\n\n　接著是心法的修練了，你該是個好聽眾，而不是在女人面前吹噓你事業本\n\n事跟風流史的小公雞。甚至，有時候不必做甚麼回應，不必硬要搞清楚甚麼\n\n\
  ，只要聽對方把話說完，然後借出你的肩膀（或者手帕）。我們能提起的女\n\n人，只能是班他亡妻一般的一生摯愛，告訴別人自己曾經多麼幸福過，而不\n\n是繞著對那些花枝招展的咩仔流口水、討好。最重要的是，如果你有喜歡的\n\
  \n女人，班主張：放下你的手機別再傳簡訊說道歉、傳貼圖示愛了，很多話，\n\n當著面親口說出，更有溫度。特別在這個什麼都像速食麵一樣即時即食的年\n\n代，鄭重其事的約會，細火慢燉的感情，更耐人尋味。\n\
  \n\n\n　在這個男女平權的年代，他依然主張「有事，男人服其勞」我印象中讀過\n\n類似的觀點，女人可以自己開紅酒、結帳、換燈泡…，但把這些是留給男人\n\n\
  來做，不是更有意思？總得讓我們有那一丁點用武之地對吧。但是，連女伴\n\n的包包都搶著幫提，就over了。\n\n\n\n　電影裡老班對一位感覺坐地會吸土的歐巴桑敬而遠之，也不是她不美，而\n\
  \n是她太熱衷八卦，也太害怕孤單了，難怪看到男人就依附餓虎撲羊的樣子；\n\n他的新女友也不年輕，但因為適切的溫柔體貼，讓她即便渴望相愛，卻也不\n\n是只想亂槍打鳥找人打發或者黏功了得的獨立女人，魅力其實也由此而來。\n\
  \n\n\n\n　《高年級實習生》裡新時代的女強人安海瑟威，似乎怎麼也難以繼承梅姨\n\n《穿著  PRADA 的惡魔》裡霸氣測漏的衣缽，只能靠甜死人不償命的笑臉和\n\
  \n淚眼汪汪，討點觀眾緣。至於她最後選擇原諒因為出軌跑來求復合的「家庭\n\n煮夫」，竟然是因為沒有選擇、害怕孤獨終老，這實在令人氣餒。不過看在\n\n孩子的份上，是不是我們也只能攤手？！\n\
  \n\n\n\n\n　但電影看著看著，我突然明白了一個可怕又可悲的事實，原來現在女人之\n\n所以變成電影裡網購公司女老闆安海瑟威那副無所不能的模樣，搞不好就是\n\
  \n因為像電影裡老班這類的紳士快要瀕臨絕種的關係。無怪乎安海瑟威大嘆上\n\n個世紀像勞勃瑞福、哈里遜福特那樣的男人都跑哪去啦？！讓這個時代無可\n\n依靠的女人們，只好開始學著自立自強，學著........「顧全大局」。\n\
  \n\n\n--\n\n圖文網誌 \n--\n\n--"
