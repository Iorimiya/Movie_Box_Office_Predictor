url: https://www.ptt.cc/bbs/movie/M.1427967781.A.3CC.html
title: '[微好雷]《愛愛小確性》老派愛愛不好嗎？'
content: '圖文網誌版：


  兩性關係一直都是令人玩味的部分，其中的床笫之事最為人津津樂道，僅管在宗教或傳統

  觀念上，仍然有人認為性愛的最終目的，不外乎就是要成功傳宗接代，而非為了充分享受

  彼此，有關性的二三事，就在一些社會教條約束下，使我們逼不得已三緘其口，殊不知性

  的觀念，可謂維繫一段愛情關係，相當關鍵的一環，遑論每個人或多或少都有不為人知的

  性想像與性癖好；畢竟，這是人之常情，更是人性底下，自然而然存在的事實。


  討論性愛，無非造就了性題材電影，不論是性成癮、性解放，甚至是性犯罪等，全都源自

  於各種天馬行空性幻想的紅男綠女；可想而知，「性」還真是一門學問，不但讓人類成為

  唯一會為了愉悅而投入性行為的動物，更是唯一會把做愛這檔事，當成人生重大事件來處

  理的動物，於是，《愛愛小確性》扎實導引出「性」福命題：有些時候，老派愛愛不好嗎

  ？


  以英文片名《The Little Death》源自法文俚語「la petite mort」開宗明義，並直譯為

  「小死」（欲仙欲死）與「性高潮」一解的《愛愛小確性》，探討了男女的性愛之事，看

  盡主角們如何想盡辦法，從歡愉的異想世界中，來克服現實世界的疑難雜症。從5對追求

  性福的人物展開，講述5種各異其趣的性愛癖：想要體驗被性侵的心愛女友（被虐控）、

  角色扮演到瘋魔的逗趣伴侶（角色控）、弄哭老公引燃性趣的餓虎妻（眼淚控）、迷昏老

  婆才能上陣的苦命男（沉睡控），以及用手語大聊情色電話的聾啞男（電愛控），性愛花

  招百出的同時，無疑也道出愛情的本質。


  最巧妙的地方，莫過於透過一個有性侵犯背景的新鄰居來訪，巧妙串起原先看似各自發展

  的五個片段，讓僅依靠身體力行與鹹濕言語的5對男女，有了片刻的緊密關聯，輔以幽默

  的口吻，將原本較為單薄的性愛片，躍升為富質感的性喜劇。


  從海報引人遐想的設計，敏感的雙向指標，以及開頭一幕舔吻腳趾，《愛》片很明確陳述

  了性事的豐富性與重要性，藉由五則臨床情境，表現出製造浪漫和弄巧成拙，往往只在一

  線之間，純粹提及性愛一事，非但與低俗無關，更無關汙名與病態，以很健康的本質方式

  呈現，戲而不謔的情況塑造，看似荒謬實則貼切，旨在生活化面對兩性閨房問題。


  每一對讓人看了就發噱的性愛伴侶，皆有著臉紅心跳、妙不可言的迷人魅力，王子與公主

  從此過著幸福快樂日子的夢幻，終究還是徒留在童話故事裡，無法避免的生理欲望，才是

  最迫切棘手之處；就在各種性愛鳥事無盡上演之際，性侵前科者意外到來，手持黑餅乾的

  自我引薦，竟悄悄打破《愛》片予人的既定印象，僅談情論性的設定下，無形中增添一股

  懸疑氣息，既隱含危機來臨前的性刺激，亦象徵兩人間情感的催化劑，單獨成篇的普遍期

  望，更轉化為交錯隱晦的性愛篇章，配合片尾開放式的突發狀況，足見《愛》片敘事的驚

  喜所在。


  即使毫無露骨的性愛場面，《愛》片仍不失情色風采，諸多妙趣橫生的性字眼闡述，在一

  幕幕性愛登場前先行教學，實是帶來性知識解讀的新鮮感受。表面上依賴性幻想的大膽展

  現，以追求極樂性高潮為包裝，骨子裡意在論述情人與情人間、丈夫與妻子間、亦或是身

  心障礙者間，複雜細膩的愛情之道；相異個體結合雖不全是為了性事，但性事的失衡不足

  ，卻會無情為雙方造成影響，進一步刻劃而言，性美滿固然重要，隱身其中的人性渴望，

  該如何經由妥善的溝通與傾聽，使你我需求暢行無阻，以致在身心靈上徹底合而為一，才

  是本片最值得回味的重點。


  精彩表達「性」的種種，皆得歸功於演員出身的導演喬許‧勞森（Josh Lawson），自編

  自導自演的精心策畫（尤以與澳洲家喻戶曉的性感女神－寶珍娜諾娃柯維克（Bojana

  Novakovic）配對，甚有自肥之嫌），將禁忌的性愛情事帶入話題，而譜出始料未及的絕

  佳劇本（但型態上仍稍嫌保守，好比僅著墨於異性戀，一對多甚至同性間的性愛關係等成

  其缺憾），就在觀賞完笑到快岔氣之餘，不妨再試著回頭想想，幹嘛把嘿咻搞這麼複雜？


  --'
