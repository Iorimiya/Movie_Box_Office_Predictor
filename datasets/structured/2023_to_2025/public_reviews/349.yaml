url: https://www.ptt.cc/bbs/movie/M.1748096249.A.66C.html
title: '[好雷]《不可能的任務：最終清算》給予世界所需的老派浪漫'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  部落格圖文版：



  「現在全世界每個人的命運，都成為你的責任。」


  隨著錄影帶中總統的聲音娓娓道來「生存體」的威脅，才知道自己為什麼始終想不起阿湯

  哥這次要對抗的反派是誰——因為所謂的反派根本不是個人，而是從頭到尾都沒有真正登

  場的 AI。


  在上一部《致命清算》中電影「萬事問 AI」，而生存體也一次次地將角色的退場、轉變

  等重要轉折預告在前。比起因此認知到 AI 的強大，對我而言其實更多的是對不論文、武

  戲驚喜感與期待值的減損。


  緊密承接自《致命清算》，這次《最終清算》的開局不算樂觀，然而在伊森韓特面前，又

  有什麼真的是「不可能的任務」呢？透過銜接上下兩部的前情提要，「跟 AI 較勁」被一

  體兩面地化為我們再熟悉不過的阻止末日戰爭、拯救世界。同時生存體相關的設定也大幅

  簡單、任務化，讓電影的主軸聚焦在主角們背負著世界快將滅亡的巨大壓力，拼命完成任

  務的過程。


  在這些爭分奪秒的行動中，不管是為了躲避追蹤，既現代又復古，再加點神秘感的作戰計

  畫，還是緊湊的動作與特技橋段，都不斷地告訴我們老派且浪漫，一人擔起全世界的英雄

  情懷，就是阿湯哥的主場。


  片中主要有飛上天的空中追逐，和潛入水底、取回裝有生存體原始碼的「馬蹄鐵」這兩大

  場面，當然總是無法一次成功，一定要一波三折的設計或多或少令我到後來覺得有些冗長

  ，但極具臨場感，讓人不時屏息的特技演出（特別是伊森在空中跟蓋布瑞纏鬥時，機尾還

  被蓋布瑞的螺旋槳撞得破破爛爛），真的是且看且珍惜。


  「你要把全世界的命運，賭在一眨眼的時間？！」


  而在單純化目標外，《最終清算》在劇情進入後半段後，不斷強調全人類的存亡，只在「

  一眨眼的時間」。近乎洗腦式的強調，使我不禁反覆想像綠燈亮起，困住 AI 的一刻應該

  是怎麼樣的。當葛莉絲拔起變成 USB 小夜燈的生存體，看著想像是否成真，有沒有以預

  期的方式實現的瞬間，認真比什麼動作戲都更令人屏息。


  隨之而來的則是激動（有觀眾直接拍手 XD）。然而任務化同樣有其缺點，當焦點都放在

  阿湯哥的身上，其他角色難免顯得扁平、功能性。無論是班吉從喜劇擔當，到開始領導團

  隊（雖然在觀測站一開口就破功），或是派瑞絲由殺人到救人的對比，電影中配角的成長

  弧線同時也被簡化。但蓋布瑞在這部裡的壞笑實在超級單調，應該算是簡化帶來的少數好

  處（誤


  整體而言很喜歡《最終清算》上至題材，下到執行面都一以貫之的老派浪漫。謝謝有阿湯

  哥，不只拯救了電影裡的世界，也給予了我們這個快速變化的世界，所需要的老派與浪漫

  。


  Btw，總覺得這集蠻認真在營造笑點，最印象深刻的當然是跟伊森充滿淵源的觀測站夫妻

  ，北極那段有兩三次突然就大特寫老婆的笑容，超級迷因。然後阿湯哥的偶包好像也變輕

  了，序幕為了保護葛莉絲打得乒乒乓乓像在做菜一樣，有夠荒謬 XD（打完檯面上東倒西

  歪，還插著幾把刀的蓋布瑞手下們，是非常有砧板的感覺）


  --


  部落格：

  FB：

  IG：


  --

  感謝大家QAQ

  覺得7和8的風格蠻不一樣，對不同類型的觀眾來說一定會有各自喜歡的點～

  然後偶包這題，主要想表達近期阿湯哥的角色都是以正派認真為主（但想了一下，《美國

  製造》好像也是蠻輕鬆的XD）'
