url: https://www.ptt.cc/bbs/movie/M.1730859154.A.F4B.html
title: '[好雷] 老派溫馨卡司精彩-殺手之怒 Killer Heat'
content: "本片在Prime Video上架，其實滿老梗，但節奏和內心旁白豐富，\n\n卡司堅強，包含Joseph Gordon-Levitt, Shailene\
  \ Woodley\n\n和Richard Madden，其中Madden是難得接反派角色，雖然本片有點被其他兩位\n\n演員搶過鋒頭，但Woodley的豪門憂鬱貴婦扮相非常精采吸引人，端莊又帶著\n\
  \n一點小性感，更不用說JGL是出了名的挑戲，劇本太爛是無法說服這整排卡司的，\n\n即便前中段已經有猜到劇情，但後續仍能沉浸在運鏡與旁白節奏中，\n\n屬於殺時間看演員飆演技的電影。\n\
  \n\n之前在《神鬼駭客史諾登》就十分欣賞J&S的組合，\n\n這次這對的火花果真仍像一個COUPLE，眼神之間默契十足又充滿同理，\n\n無論是偵探還是委託人，角色間彼此都有豐富的內心戲和成長，果然是演技派。\n\
  \n\n預告，這點閱率很驚人，\n\n\n\n片名無論是中英翻譯都很像動作諜報片，但其實是偏溫情解謎片，\n\n除了片名《殺手之怒》讓人費解之外，缺點也不是沒有，\n\
  \n本片的節奏非常老派，就是豪門紈褲子弟之死引出的命案調查。\n\n伴隨JGL苦練希臘語，口白敘述頗有八九零年代的既視感，看到網友\n\n不少評價也多半在說這部電影偏老梗老派，但我是滿享受這種解謎配上希臘島嶼風情\n\
  \n的路線，片中主角Nick是名逃家又借酒澆愁的偵探，但遇到了溫柔細膩的委託人Penny\n\n之後，也有不少成長，整體來說很勵志溫馨正向，雖牽扯到命案也沒有太多的血腥罪惡，\n\
  \n動作戲偏少但也拍得刺激，適合親子共賞。\n\n\n\n\n--\n\n幻想●---------------☆\n/﹀\n/\\ \n\n按a加入最愛\n\n\
  --"
