url: https://www.ptt.cc/bbs/movie/M.1485288011.A.1F3.html
title: 'Re: [極好雷] 樂來樂愛你：老派眷戀的兇殘輓歌'
content: "看到有人討論Audition這首歌來回一下。\n\n其實本片的作曲家Justin Hurwitz有在廣播節目上面很仔細的聊過Audition這首歌，\n\
  幾乎像是逐段解說一樣，如果有興趣的人可以自己把這個soundcloud上的音檔聽完：\n\n\n\n以下簡單翻譯一些重點：\n\n1.Audition是最後做的一首歌，原因是Justin和導演Damien覺得這場戲很關鍵，需要的\n\
  \  情緒張力也很巨大，所以最後再來搞定它。然而，Audition同時也是Justin做得最輕\n  鬆的一首歌，他自己覺得是因為他對「懷抱夢想的失意藝術家」這個概念很有感觸。\n\
  \n  (順道一提，City of Stars是他第一首做的歌)\n\n2.在情緒上，Justin認為這是一首既樂觀又悲傷的歌曲，表面上講的是永不放棄和追尋\n\
  \  夢想，但「永不放棄」也代表著「尚未成功」，一個還沒成功的藝術家當下的生活應\n  該是相當困頓的，所以這首歌的調調應該要又甜又苦。\n\n3.這點原本的文章也有提到。Audition這首歌一開始Mia是用說的，音樂從Barefoot.\n\
  \  She smiled.之後才慢慢出來，有一段從用說的變成用唱的漸層。Justin一開始是有上\n  音樂的，直到Damien和Emma排練的時候才決定讓它變成現在這個樣子。\n\
  \n4.作詞的Justin Paul特地講了sneezing這個字，他說他們當時有一首關於一個人在打噴\n  嚏的歌，他覺得sneezing這個字很酷，所以決定要用上它。\n\
  \n5.另外一位作詞人Benj Pasek，提了一個他和Paul在密西根大學音樂劇場學到的東西：\n  流行歌和音樂劇樂曲的差別，流行歌像是形容詞，重點在於讓觀眾去感受，而音樂劇\n\
  \  的歌曲則像是動詞，著重於推動故事和角色的心境變化。他們兩個人特別希望Audition\n  這首歌可以是動詞，畢竟在劇情中，這首歌出來之後，Mia的人生就永遠地改變了。\n\
  \n6.這場戲Emma並不是事後配音的，而是現場演唱、現場收音，當然現場也有鋼琴伴奏。\n\n  Justin表示他當時太害羞了，害怕自己在這樣的長鏡頭裡面出錯，畢竟Emma如此投入\n\
  \  情緒的去演唱，能保持一定狀態和水準的時間並不長，不可能拍太多顆鏡頭。所以最\n  後是由爵士樂手Randy Kerber上陣。\n\n  鋼琴和交響樂團之後分別進了錄音室。就像一般的獨唱表演，鋼琴陪伴著人聲、會根\n\
  \  據人聲做出反應，所以聽起來會比人聲慢一點，雖然拍子沒有對得很好，但會感覺比\n  較真實和真誠。所以他們試圖讓Randy能保持這種尷尬的感覺。\n\n7.Justin說他做了很多設計，因為就像人的情緒充滿變化一樣，一個人可能會同時感受\n\
  \  很多東西，他希望他的歌有複雜的情緒，像是as they may seem之後寫了一個major 7，\n  讓它不要太衝、創造一種停頓，相反的，如果一直用同一個三和弦(triad)，音樂就會\n\
  \  卡住，而聽眾在很長一段時間裡就只會得到一種感受。\n\n(這邊其實還有很多樂理的東西，我就沒有節錄了)\n\n8.Emma有請聲樂老師Eric Vetro訓練她，而Audition這首歌她也練了很久，Justin他們\n\
  \  希望Emma夠熟這首歌，這樣才能邊演邊唱、投入情緒，然後保持在一種快落淚的狀態。\n\n  (呃，聽起來就是眼淚在眼眶裡打轉那種老梗XD)\n\n9.Crazy,\
  \ as they may seem一句之後可以聽見弦樂上揚，這是整首歌最樂觀的一刻。她\n  已經將這首原本在講她阿姨的歌，變成向築夢者的致敬，而這句是情緒的最高點。\n\
  \n10.最後一個字again是清唱，而沒有音樂。Justin說在這首歌結束之後，Emma的生活並沒\n   有立即被解救，所以他們也不希望這首歌的結尾太過於完整。\n\
  \n11.「當初沒有人想讓我們做這部音樂劇。我們滿腔熱忱卻沒辦法實現拉拉鍊這個夢，所以\n     我們和電影的主角感受其實非常接近，空有夢想、卻沒有人願意給你機會。」\n\
  \n   「我仍然覺得我是一個夢想家。我不覺得我已經完成了我的夢想，我不覺得我已經抵達\n     終點了。我常常覺得，如果我不在把自己視為夢想家，我的音樂就不會好。」\n\
  \n\n額，打完才發現樂理那邊其實好像很重要。\n還是推薦大家努力聽一下那個音檔好了。\n\n--"
