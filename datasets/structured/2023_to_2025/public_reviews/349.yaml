url: https://www.ptt.cc/bbs/movie/M.1546705621.A.3CC.html
title: '[新聞] 《初戀手作中》老派青春戀曲'
content: '新聞網址：


  「初戀手作中」老派青春戀曲


  2019-01-05 聯合晚報 記者陳建嘉 報導


  明星獨家花絮搞笑影片隴底加


  最帥的魯蛇少年遇上東京未婚妻「初戀手作中」共譜青春戀習曲。校園喜劇「初戀手作中

  」是以Netflix影集「去X的世界末日」走紅全球的亞歷克斯勞瑟最新作品，與「東京未婚

  妻」的甜美女星寶琳耶媞在片中共譜一段「老派」青春戀曲。


  「初戀手作中」改編自經典電影「大鼻子情聖」，由歐洲電影獎名導托比麥當諾巧手打造

  青春校園版本，並把智勇雙全的劍客換成愛作白日夢的慘綠少年，以法式奇想風格另闢蹊

  徑。


  瘦小宅男安博森打從一入學就在底層求生存，因此變成了擅長「適者生存」法則的箇中高

  手。學校新來的法語老師有個漂亮女兒安妮，安博森對安妮一見鍾情，並對她滿腦子古靈

  精怪的想法有深深的共鳴，但安妮卻煞到了校園天菜溫徹斯特。


  極度缺乏自信，又想得到強力靠山，安博森決定要昧著良心當媒人撮合溫徹斯特和安妮。

  安博森長年累積的宅男內涵，擄獲了安妮的心，但安妮卻不知道那些令自己著迷的文采不

  是來自高帥的溫徹斯特。當真相揭曉，安博森是否還能繼續和安妮共譜怪咖情緣？亞歷克

  斯勞瑟曾為拍攝「X+Y愛的方程式」來台一個多星期，對臭豆腐的美味難以遺忘，「很特

  別，過了五年我還無法忘懷那個味道。」而台灣食物最讓他驚豔的是鍋貼，他還連吃好幾

  餐。電影已於4日上映。


  --'
date: 2019-01-06
sentiment_score: 0.75
