url: https://www.ptt.cc/bbs/movie/M.1282105721.A.4DA.html
title: '[好雷] 浴血任務(The Expendables) 老派萬歲'
content: "話說「浴血任務」的預告片剛出爐時，一開始我還以為是開玩笑，或是老外動作片\n粉絲自製的剪接影片之類的，沒想到竟然真有其事，靠，光是這個卡司，就算他們\n\
  只是打赤搏從頭肉搏到尾我也一定要去看！\n\n沒想到「浴血任務」在各方面都挺上道的，並不是真的只是史特龍打赤搏從頭肉搏\n到尾，全片以一句話來形容，就是「老派真是讚啊！」\n\
  \n「浴血任務」並沒有搞出什麼諜對諜或複雜的機關秘道、龐大的黑手組織，任務的\n場景非常單純，就是一個小島，幾百個士兵，但這也讓故事更能聚焦在純粹的動作\n，以及幾個角色的內心戲上，事實上，史特龍在「浴血任務」中是有想表達的意含\n\
  ，這些意含分散在每個「硬派」角色的個性及對白中。\n\n史特龍與米基洛克在先前分別才剛演過老年洛基，以及「力挽狂瀾」中身心破裂的\n退休摔角明星，建議在看「浴血任務」之前可以先看過這兩部片，會對「浴血任務」\n\
  中幾個人的對話更有感觸，另外也可參考HBO的「Generation Kill」，看看小兵們\n的插科打渾，會更明白「浴血任務」中他們的對白寫得真是逼真，當史特龍這些\n\
  一等明星，飾演著傭兵，就像小兵般的互相取笑，拿彼此的身體特徵嘲弄與自嘲，\n包括李連杰的身材、傑西史塔森的光頭，其實這一段沒有動作的部分，反而是「硬派」\n「老派」的精髓，我覺得相當吸引人。\n\
  \n（說要在史塔森頭上刺青「夏綠蒂的網」真的是有夠爆笑，夏綠蒂是同名電影中的\n  一隻蜘蛛）\n\n這群傭兵都有輝煌的過去，但是為了生活，還是要過著出生入死的生活，米基洛克\n\
  說得貼切，他寧願死在女人旁邊，也不要馬革裹屍，所以他在片中飾演一個退下來\n擔任聯絡人的角色，其實米基洛克之所以接演，是因為在他最走投無路的時候，\n史特龍曾經為了幫助他，給了他一個角色讓他渡過難關，他是為了報恩才參加本片，\n\
  自然也不期待有「力挽狂瀾」中的動作表現。\n\n然而這樣的角色找米基洛克或許是最適合的，在史特龍演老年洛基的表現中，可以\n看到他面對過氣的奮力掙扎，但至少還是過著體面的生活，並沒有什麼不如意，只是\n\
  一股不滿無處發洩，「力挽狂瀾」裡的米基洛克，其生命可說破碎到了極點，被生活\n逼得走投無路，這也是米基洛克當時自己的寫照，現在他靠「力挽狂瀾」、「鋼鐵人2」\n\
  又起死回生，但演起這樣的角色仍然絲絲入扣，當鏡頭特寫米基洛克低著頭，幽幽的\n說著破碎的殘餘靈魂是否可以得到救贖時，我只覺得這真是太有說服力了，怪不得\n史特龍聽了就回去救人。\n\
  \n李連杰的角色也非常有趣，實際上在真實武打中，身材較矮小絕對是佔劣勢的，體重\n方面更是得符合「物理定律」，而肌肉的厚度更直接決定能承受打擊的能力，這點\n\
  本來應該是常識，不過功夫電影一路從李小龍過來，本來李小龍挑高大的老外當對手，\n是因為克服體型劣勢才顯得厲害，結果後來的功夫電影都這樣演，包括李連杰在\n好萊塢片如「致命羅密歐」與「致命武器4」中都能把體型遠勝過他的外國演員隨意\n\
  打趴，或許如此產生了中國功夫可無視體型的錯覺。\n\n在片中李連杰顯然是有意要打破這個錯覺，包括一開始就被體型優勢壓制在船舷，\n以及工廠內的打鬥，李連杰只能盡量以快速取勝，但攻擊很容易遭到對手以物理優勢\n\
  硬生生攔下，一旦失手就會遭受慘痛的反擊，我想針對這幾個段落，不能只是看到華人\n挨打就看不下去，實際上正如李連杰片中所說的，「身材小做任何事都比較辛苦」，\n\
  李連杰想呈現的是一個真實狀況，在對戰中，他受到物理上絕對劣勢，卻仍力求奮戰，\n最後勉強落敗，是雖敗猶榮的表現，因此他後來一直強調「我並沒有輸」，除了角色\n\
  本身的耍嘴皮特性以外，也是在表示劣勢下奮戰的過程值得欣賞，並非只看最後結果，\n相信這也是李連杰以現在挑片之嚴，卻願意接演這樣看似搞笑的角色，所想傳達的深意。\n\
  \n也不得不說劇中許多搞笑的橋段安排的相當好，譬如李連杰不顧形象的抓住自己身材小\n，所以物理上相對來說要走的路比別人遠，受傷的傷口也比較大等數學上合理卻又是\n\
  強辯的說詞來凹說要比較高的待遇，才剛說完槍戰開始，史特龍要他出戰，「因為你\n比較小」，真的是笑翻。\n\n但李連杰明明一直鬼打牆的要凹加薪，表現得把錢看得非常重要，當史特龍沒錢賺也要\n\
  回去救人時，他卻二話不說的跟上，還讓史特龍沒有拒絕的機會，這種當兄弟有難，\n再在意的事也擺一邊，是真正純然硬漢的表現，相對來說，史塔森的角色本來就會去幫\n\
  史特龍，就沒有這種反差下更顯大義凜然的感覺了。\n\n傑西史塔森的硬漢表現則另有安排，當他發現女友因為老是被放置不管另結新歡，他\n雖然不滿也只是直接離開，只說了一句對方並非好對象，然而當他發現女友被打，\n\
  也是不多說，把人扁完以後，也並不痛下殺手，而只是以球代人示威警告對方勿輕舉\n妄動，然後對女友淡淡的說一句：「妳應該等我的，因為我值得。」真是酷到爆錶，\n可惜這樣的「硬派」表現已經不流行，只能在這樣的「老派」電影裡頭見到了。\n\
  \n在格鬥方面，最亮眼的則是前UFC冠軍蘭迪寇楚，看他使用各種不同的體術把對手撂倒\n在地，許多華麗的摔法真是讓人大呼過癮，而拿著重機砲的黑人，那挺機砲威力大到既\n\
  震憾又爆笑，最後製片也豪氣的把整個場景炸翻天，可說十分有誠意，不過摔角手\nSteve Austin飾演的反派就有點表現不足，我唯一有印象的只有他的頭鎚。另一方面，\n\
  打鬥中許多動作都太快，鏡頭晃動程度大，切換也太頻繁，經常會搞不清楚現在是\n誰打誰了，是美中不足的缺點。\n\n全片最讓人感動的部分，莫過於布魯斯威利、阿諾與史特龍齊聚一堂的畫面，這三位\n\
  巨星的成名作，都是年輕時代的回憶，如今三人竟同時出現在同一畫面上，實在是\n百感交集，尤其是阿諾很明顯的比另外兩人老了許多，布魯斯威利還大體像以前的樣子\n，史特龍雖然老了但看起來還動得了，阿諾看來則是垂垂老矣真的只能去當州長了，\n\
  最後史特龍一句「他想當總統」讓全場笑翻，但這也何嘗不是因為這樣悲傷的對比才\n顯得特別好笑呢？\n\n當年輕時的巨星已經老去，屆臨退休，感覺好像失去了追尋的對象，而往後的路是一片\n\
  空白，30世代的人面對著茫然的未來，「老派」已經是過去，「新派」卻尚未建立，\n「硬派」不合時宜了，但我們又不欣賞「軟派」，這或許就是我們會懷念硬派老派電影\n\
  的原因吧。\n\n而這一小段不過幾分鐘的戲，卻也可以展現好萊塢為何能成功的原因，當初史特龍原本\n屬意由阿諾來飾演布魯斯威利的角色，但阿諾以州長公務太忙拒絕，表示只能接演戲份\n\
  更少的角色，我們看電影時可能會覺得阿諾的這個要求莫名其妙，因為阿諾的角色比起\n布魯斯威利也不過少個兩分鐘不到罷了，哪有差別啊？\n\n其實不然，雖然最後只有短短幾分鐘，但是這個片段實際上拍攝了六個小時，而三位\n\
  大牌為了這幾分鐘事前更要準備許久來揣摩，因此阿諾才會連多一分鐘的戲都會\n抽不出時間來接演，從這些小細節，就可以明白好萊塢片的優勢所在，拍電影，真的\n不是那麼簡單的。\n\
  \n--\n作者部落格 \n\n--\n◆ From: 111.240.208.10"
