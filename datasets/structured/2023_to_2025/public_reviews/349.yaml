url: https://www.ptt.cc/bbs/movie/M.1518169542.A.10C.html
title: '[好雷]水底情深－老派浪漫之必要 '
content: "昨天看完水底情深，大概爬了一下水底情深的網評，\n\n負評意見大都持「劇情老派」、「劇本普通可預測」，「人物刻劃單薄」....等等。\n\n\n\
  劇中的反派角色強化白人男性的權力與控制，\n\n尤其在軍中體制的上下絕對服從關係。\n\n戲中大多數上對下的展視權力與傲慢的台詞的確是蠻無聊的，\n\n就是一堆白人男性在那邊耍大牌懲兇鬥狠：\n\
  \n「我有幾顆星你沒有你閉嘴。」\n\n        「妳們這些打掃清屎尿的女人閉嘴」\n\n                        「你辦不到就死翹翹惹。」\n\
  \n與白人男性相對立面的：女主角設定為有殘缺的底層清潔工，\n\n還有其他配角，各自代表女人，黑人、同性戀等社會邊緣族群。\n\n整部片立意明顯，邊緣族群合力對抗美國/白人/男性/霸權，\n\
  \n儘管有些影迷覺得腳色刻意，劇情不夠深刻。\n\n但畫面與音樂鋪陳得相當流暢動人，導演生動安排水的意象融和愛情貫穿全片。\n\n而在劇情主軸之外，仍有一些非劇情主軸的小道具暗喻那個時代的科技發展。\n\
  \n本片發生在美蘇冷戰太空競賽的1960年代\n\n片中出現大量的黑白電視畫面對照冷清的電影院；\n\n攝影技術的普及讓老畫家失業；\n\n軍人對於航太科技的追求，冷血撲殺非人物種。\n\
  \n劇情中不時出現：Green is the Future.\n\n大反派買台藍綠色的凱迪拉克，\n\n嚮往著開著藍綠色飛遜的跑車，擠身成功人士奔向未來。\n\n\
  除了愛情元素文化認同意涵之外，\n\n我認為本片還夾帶著對於追求科技理性的反思。\n\n人類一直企圖用科技控制掌控整個世界，\n\n藐視南美洲原住民部落的原始物種，\n\
  \n用各種機器控制物種、解剖未知生物，實現軍備武裝野心，得不到就毀掉它。\n\n\n另一方面，人類常理所不能理解的女主角與非人物種的關係，被「文明」視為禁忌，\n\
  \n然而所謂「文明」終究也不過是人類社會秩序所建構的人為約束框架。\n\n\n沒有口語能力的人與非人產生了緊密連結、包容、完整了彼此，\n\n消弭各種歧視與權力不對等，那是文明與科學所不能解釋的最原初的本能。\n\
  \n在新舊科技更迭的年代，人性慢慢被科技給取代，\n\n導演試圖以這個童話故事鎖住老派浪漫的永恆瞬間。\n\n\n\n\n--"
