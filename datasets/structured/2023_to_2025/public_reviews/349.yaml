title: 'Re: [好雷] 不 / Nope 給老派膠卷電影的情書'
content: '本來沒有想看這部電影，但是看到是IMAX 1.43:1，似乎是今年唯一，就還是衝了


  這次的議題我想應該想說的是，利用動物去獲利終將被反噬


  黑猩猩的部分就是如此，利用猩猩當明星拍攝賺錢，

  但意外卻吞噬了大部分的角色


  而在現實世界，Glenn又利用牧場，開設樂園，吸引觀眾來看UFO的表演(營利)

  但是實際上UFO本身就是生物，所以大家都被反噬了

  Glenn小時候逃過一劫，長大終究逃不過


  主角群也是，本來只想活命，到最後還是想要找知名攝影師拍攝money shot

  所以也是很驚險


  我是不知道這個議題能引起多少共鳴啦，我能想到的案例還是飼養鯨豚的

  海洋公園，因為精神疾病傷害了訓練員，可以去看黑魚和血色海灣


  反正你只要付錢去這些地方就是造孽，不要把要看小孩的笑容當作藉口!


  這部片節奏有點緩慢，也不太驚悚，如果沒看美麗華版本IMAX的話

  會少掉百分之八十的趣味，我想本片的畫面是唯一讓我覺得值得的地方吧



  --'
