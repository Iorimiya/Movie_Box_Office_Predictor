url: https://www.ptt.cc/bbs/movie/M.1442723366.A.727.html
title: '[好雷] 紳士密令~老派風格的諜報片'
content: '圖文並茂好讀版→

  內無音樂可安心點閱

  正文開始



  看膩了詹姆士‧龐德？換換口味來點老派的間諜片


  這部片一開始並沒有特別注意

  後來聽到一位自己滿喜歡的電台DJ介紹才決定去看這部片

  (對！我就是個還有在聽廣播的老派人)


  看完真的很喜歡這部片

  而且挺後勢看漲

  已經上映一個月仍然維持兩位數的上映廳數

  上星期無聊再去看一次仍然是滿場

  所以來寫篇文推薦給大家



  拿破崙‧蘇洛(亨利‧卡維爾飾)

  因為他的特殊專長而被吸收成特務

  慢慢變成美國C.I.A.的頂尖特務


  伊利亞科‧利亞金(艾米‧漢默飾)

  蘇俄K.G.B.的頂尖特務

  那簡直神人般的體能超猛



  《紳士密令》改編自六零年代的知名電視影集

  故事發生在美俄冷戰時期的柏林

  據情報指出知名的德國核子科學家在東柏林還有位女兒


  這位科學家已經研究出更簡單製造核子彈的方法

  美蘇兩方為了能「找到」這位科學家便派出兩位最頂尖的特務

  要來跟這位女兒「聊聊」


  結果這位科學家被仍然暗中活動的納粹所挾持

  為了守護「世界和平」

  (但應該沒有想要貫徹愛與真實的邪惡XD)

  美蘇兩方決定攜手合作找出這位科學家

  電影的劇情大綱約略就是如此



  相對於007系列電影的高科技

  《紳士密令》因為背景在六零年代

  沒有炫目神迷的武器與道具

  所以敵我雙方的過招

  招招都是鬥智鬥勇

  一整個就是硬來的真功夫


  除了比智慧比功夫的對戰之外

  其中許多讓觀眾發噱大笑的橋段

  更是表現出老派的英式幽默


  說到老派的英國

  休葛蘭也有在電影裏頭嘎上一角

  三位男星都有演出屬於那年代的紳士風格

  又高又帥又勇猛還有紳士風度

  這叫人怎麼受得了



  不光是服裝、態勢等都有五六零年代風格

  連運鏡、影片的剪輯分鏡也都有濃濃的屬於那年代的味道


  喜歡真槍實彈老派諜報片的朋友

  這部《紳士密令》值得你一看


  --

  吃食‧散旅人生，

  更名後的重新開張

  歡迎常來玩

  (謎之聲：那你要常寫文啊！)


  --'
