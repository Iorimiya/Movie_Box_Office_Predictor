url: https://www.ptt.cc/bbs/movie/M.1668393883.A.E21.html
title: '[好無雷] 第一滴血4 - 重回老派動作片的懷抱'
content: '《第一滴血4》7/10分


  -


  14年前的電影

  卻比現在許多動作片更震撼

  或許這就是老派動作片的醍醐味

  之前沒看過此系列的電影

  所以跟其他系列作無從比較


  -


  這部片的劇情其實很普通

  甚至可以說簡單到很有特色

  總之就是以緬甸內戰的角度出發

  白人就覺得自己可以改變這個內戰前往援助結果還是被抓了

  然後藍波就是要救他們出來

  這麼簡單


  -


  但我覺得最震撼的地方在於

  整部片非常的暴力血腥

  而且不管你是什麼老弱婦孺

  全部都有分屍啊 肚破腸流

  爆頭 血肉模糊的場面

  而且這些畫面非常的寫實

  寫實到你會覺得他是真的人或是真的屍體

  在看的過程中就介於一種覺得很殘忍

  但是又有一種莫名暢快的感覺


  -


  我覺得這部片就是要讓觀眾可以感受到戰爭的殘忍

  但其實如果戰爭片看得夠多的話

  就會覺得其實也是有點老生常談了

  差別只是在於第一滴血4

  把這一些場面拍的更寫實震撼吧


  -


  總之

  這算是一部可以無腦看的片

  你只要純粹的感受戰爭的血腥

  以及藍波的大殺四方就夠了

  但請先做好會看到各種血肉模糊的心理準備


  #網飛有片


  --


  無雷 電影/影集短評IG：




  --'
