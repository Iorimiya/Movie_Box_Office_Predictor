url: https://www.ptt.cc/bbs/movie/M.1455475659.A.BAF.html
title: '[好雷] 聞天祥影評 ／《驚爆焦點》 老派的美好 '
content: "文章來源: \n\n影聞其詳／《驚爆焦點》 老派的美好\n\n聯合晚報 聞天祥\n\n湯姆麥卡錫（Tom McCarthy）執導的《驚爆焦點》（Spotlight）\n\
  取材2001年「波士頓環球報」的「焦點小組」揭發多位天主教神\n父犯下性侵兒童罪，卻在體制層層相護下，不但逍遙法外，甚至\n在被派到別的教區後持續犯罪，且數量驚人的事實。\n\
  \n\n但如果你的興趣是在教廷怎麼「善後」，那更該看去年贏得柏林\n影展評審團大獎的智利電影《贖罪俱樂部》（The Club，台灣已\n於2015年底上映）。《驚爆焦點》則是把重心擺在報社這群人身\n\
  上。去年以《鳥人》和奧斯卡影帝失之交臂的米高基頓飾演焦點\n小組的負責人（可惜今年在入圍階段就落空），旗下記者包括與\n信仰虔誠的祖母感情甚篤的瑞秋麥亞當斯、身為人父而憂心不軌\n\
  神父就在身邊的布萊恩達西詹姆士、以及採訪纏功一流但情感關\n係不及格的的馬克魯法洛，周邊的關鍵人物還有李佛薛伯飾演新\n官上任三把火的新總編輯，以及約翰斯萊特里飾演的資深主編。\n\
  他們的深入報導自2002年1月5日開始付梓，舉世震撼，也獲得\n2003年普立茲新聞獎公共服務獎的殊榮。\n\n\n然而這群獲獎者的人生並未在片中被放大、誇示，攝影機彷彿就\n\
  是埋伏在報館的另一組成員，分批跟著這些編輯記者們出擊。除\n此之外，瑞秋麥亞當斯頂多在廚房發發小牢騷、馬克魯法洛孤身\n一人在沒有家具的房子裡獨處，我們甚至沒有見過米高基頓的家\n\
  庭。為什麼不多加些可以更煽情的東西？\n\n\n湯姆麥卡錫的「謹守分際」是有相當立場的。這個故事發生在媒\n體即將被網路大幅改變的千禧年後，我們跟隨攝影機目睹角色們\n\
  在發揮媒體職能時的兢兢業業、孜孜矻矻，那份努力、包容、膽\n識、勇氣，是這麼自然地體現在他們的工作上。即使米高基頓和\n馬克魯法洛在辦公室的勃谿對嗆，都令人心生感動，因為那是「\n\
  深思熟慮」與「義憤填膺」的交鋒，而沒有誰對誰錯。\n\n\n因此，《驚爆焦點》更像是藉由這樁真人真事去強調某種「老派」\n的美好與一去不返。在這個即時新聞甚囂塵上，寧可寫錯也不可\n\
  錯過（甚至錯了也不要認）的媒體新世界裡，多的是炮製新聞而\n非挖掘真相；「焦點小組」的鍥而不捨與細心查證（看他們一頁\n一頁翻閱文件作記號的模樣，突然有種回到上世紀寫論文查資料\n\
  的錯覺），難道也到了需要被「追憶」的地步？\n\n\n《驚爆焦點》當頭棒喝的，不只是事奉天主的機構龐大到無法無\n天的結果，更是媒體人的亟需自省與那稍縱即逝的榮光。否則沒\n\
  必要在最後一刻還要我們恍然大悟，這群英雄當中可能也有多年\n前無意中忽略這條新聞的人（這條懸疑線索鋪得很有技巧，為這\n部刻意在敘事上也傾向古典老派的電影平添不少緊張氣息），這\n\
  個反省再擴大開來，幾乎所有人都在其中。當代表教廷的梵諦岡\n電台對本片都做出「誠實且令人信服」的評價時，不曉得那些習\n慣把他者異教化與妖魔化的人士，如何看待這神人之間的醜惡與\n\
  正義？\n\n\n--"
