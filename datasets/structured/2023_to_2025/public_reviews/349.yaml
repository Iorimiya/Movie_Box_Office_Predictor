url: https://www.ptt.cc/bbs/movie/M.1654377909.A.5E9.html
title: '[好雷] 捍衛戰士-老派電影的厚重'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  99%的人看完這部電影

  應該會覺得很興奮很熱血

  Um..這是一篇屬於少數1%

  不太一樣的心得文

  不喜歡歡迎隨時左轉



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  阿湯哥之所以做為老派演員的代表

  在於他總是用最真實的方式呈現畫面

  飛車追逐、潛水救援、爆炸場面

  再危險的場景幾乎都親自上陣

  經歷過的種種磨練

  全化為阿湯哥的養份

  使他在飾演Maverick時

  讓觀眾很自然而然的融入角色

  彷彿軍袍下就是傷痕累累、身經百戰的戰士


  很多細節都看得出這樣的養份

  把教科書丟進垃圾桶時的自信；

  信守呆頭鵝母親的承諾要保護好公雞；

  跳下潘妮窗外被小女兒抓到並聽到「不要再傷她的心」


  你不需要看過Top Gun 1來知道他有多高竿

  你不需要認識伊森韓特也能知道他多信守承諾

  你不需要透過任何線索來證明他傷過多少女人的心（看臉就知道


  他甚至不是在演Maverick

  他是在告訴你

  “I am Maverick.”



  這是老派演員厚重的地方

  或許阿湯哥的演技不是最好的

  他自己也兩度在電影中自嘲

  “It’s the only face I got.”

  但，真誠

  就是老派演員的王牌

  也是老派電影永遠不滅的原因






  然而這部電影想要表達的

  不是熱血、不是愛國、更不是原諒

  而是在於「傳承」


  “Those kids are not ready.” - Maverick


  “It’s time to let go.” - Ice


  “Sometimes she need chance to make mistakes.” - Penny


  傳承的議題，並不僅限於劇情中

  電影外的現實世界更是如此

  除了Maverick, 誰能接手王牌飛行員的位子？

  新生代誰能接手湯姆克魯斯這樣厚重的演員？

  誰能承擔Hans Zimmer那麼磅礴的交響配樂？

  劇本、化妝、燈光、特效，甚至到各行各業

  都有各自夠份量的大師存在


  把經驗傳承給下一代

  別因新人不如自己就不讓出舞台

  以「傳承」這個古今中外都會遇到的議題貫穿電影

  實在是很優秀的一部作品

  可以見證Tom Cruise 末期再創巔峰真是觀眾的幸福


  註:

  Penny 那麼完美怎麼忍心拋下她！渣男！




  --'
