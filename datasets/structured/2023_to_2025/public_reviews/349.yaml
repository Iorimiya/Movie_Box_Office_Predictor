title: '[好無雷] 老派analog-不老哏的類比純愛故事'
content: '本文分隔線以上無雷，分隔線以下有雷

  本文分隔線以上無雷，分隔線以下有雷

  本文分隔線以上無雷，分隔線以下有雷


  1.本片是有起承轉合的完整故事，不是那種看完讓人摸不著頭緒的電影。


  2.可以先看預告，不會看完預告就把故事都看完了。


  3.適合情侶觀看XD


  4.我也看了好幾部波瑠的日劇，我覺得波瑠在這部真的是美出新高度，氣質出眾，粉絲們

  一定要看啊啊啊啊啊

  不是波瑠粉絲也很推啦，比預告還更好看！













  ——有雷分隔線——

  ——有雷分隔線——

  ——有雷分隔線——















  5.看預告還以為是女主即將不久人世，所以避不見面的那種超級老哏。但還好不是。


  6.悟得知美紀車禍重傷，還有看美紀的日記的時候，我只是覺得難過；

  但真正掉下淚是在悟去拜託姊姊讓他一起照顧美紀、被姊姊婉拒、後來甚至說可不可以每

  天來看看美紀就好，

  姊姊說「你是個外人」……

  這一刻真正感受到悟的那種，拚了命想伸長手卻觸不到美紀的感覺QQ


  7.我電影看得真的沒有很多，難道這樣的故事其實也算老哏？XD

  一開始在鋼琴咖啡，美紀要悟好好愛惜自己身體的時候，我以為她指的是家人。

  直到2個好朋友去大阪跟悟說事實真相的時候，我才知道原來是在說去世的先生。


  8.我是今天在高雄大遠百威秀看的，電影前半段，悟帶美紀去燒烤店，美紀去上廁所，好

  友3人在聊天的時候，有好幾次畫面突兀地被剪斷，斷得很不自然，很像在看youtube講完

  這句話會馬上接到下一句話，把中間的空白剪掉的感覺……

  也不只這邊，但燒烤店有好幾次，最明顯。電影中段之後就沒有了。

  我都懷疑是不是戲院的問題？但應該不會斷得這麼剛好，都沒卡到他們正在講話的時候吧

  。

  如果是導演故意的，那是要表達什麼？以這片的調性不太像是想藏什麼細節還是寓意啊，

  很直白很順暢的故事，還是我太淺了沒看出來QQ


  9.導演高畑秀太的作品好像不多？本片我是覺得還滿順的。最後的海邊，餘韻還不錯～


  10.但其實本片好像沒有對「類比」這個概念著墨太多。

  雖然最後帶出美紀車禍那天買了新手機很不錯，代表她從失去先生的空洞中走出來了，也真

  的愛上悟、準備接受他了（跟聽

  音樂會聽到奪門而出的時候對比）。


  11.對了，悟說要帶美紀去燒烤店，她有點像在勉強自己，還說她從沒去過，這邊是有什麼

  涵意嗎？跟畫面一直被剪斷有關係嗎？


  12.總之我覺得是個滿好看的純愛故事。場次剩不多，想看的人要把握啦～


  --'
