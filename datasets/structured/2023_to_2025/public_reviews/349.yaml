url: https://www.ptt.cc/bbs/movie/M.1518789662.A.BE8.html
title: '[好雷] 老派而內斂的《郵報：密戰》'
content: '「新聞就像歷史的初稿。」


  新聞出版自由槓上國家安全是一個老套到不能再老套的命題。


  《郵報：密戰》就是一部老派到不能再老派的電影，老派而內斂。


  彷彿為了強調這一點似的，導演史蒂芬史匹柏找了梅莉史翠普與湯姆漢克斯等上個世代的

  明星演員，更請來了自己合作多年、高齡八十幾歲的約翰威廉斯爺爺作曲。


  於是，我們有了這樣一部結構工整、劇情轉折毫無意外的電影。從《林肯》、《間諜橋》

  再到《郵報》，史匹伯的時間越來越「現代」，但他的鏡頭語言似乎也越來越緩慢、越來

  越缺乏激情。相較於兩年前那同樣強調新聞自由、節奏如行雲流水般暢快的《驚爆焦點》

  ，本片從選角、音樂、運鏡、用色到欲傳遞的核心精神，都活脫脫是一部屬於九零年代的

  傳記電影。


  然而，老派也有老派的魅力，不是嗎？


  老派並不表示過時，不然早已作古多年的傑佛遜恐怕要從墳墓裡跳起來——何況我們今天

  的世界，仍舊充滿了一模一樣（如果不是更糟）的問題：民主在退潮、報業式微、新聞與

  出版自由（與憲法第一修正案所保障的立國精神）正持續受到威脅、更有越來越多人似乎

  忘了美國當年為何「偉大」：不是透過對外戰爭，而是對內的自由保障。


  因此，本片既是史匹伯對自己（與報業）輝煌年代的懷舊，更是對下個世代所念茲在茲的

  期許與教誨。它所傳遞的新聞與出版自由的價值，是上個時代大師們的老生常談，也是我

  們這個世代所繼承的珍貴遺產，更是一部不容媒體與出版從業人員錯過的好作品。


  最後，本片就和絕大多數今年入圍奧斯卡最佳影片的作品一樣，試圖彰顯了（或許也已經

  算是老梗的）性別意識。梅莉史翠普演活了那個在男人仍主導企業巨頭與領導者的年代，

  身為女性所需要面對到的質疑與挑戰—某些橋段或許演得太刻意了些—但就和新聞自由一

  樣，女權也是個老梗但卻仍每天都會遭遇到的問題。或許這部電影也再次提醒我們，今天

  這些看似理所當然的價值，仍需要下一代持續的守護與推動吧？


  --

  的確是'
