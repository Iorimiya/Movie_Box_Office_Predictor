url: https://www.ptt.cc/bbs/movie/M.1665234753.A.C69.html
title: '[老派特效灑狗血雷] 浴火赤子情'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  Netflix上看的

  浴火赤子情 1991

  30年前的電影了

  小時候沒在電影院看 只看過電視廣告

  無聊又在netflix找來看

  貨真價實的特效

  在現今根本CG大戰的時代

  看起來格外震撼


  真的有火

  真的有人旁邊有火

  真的有人著火!!!!

  真的就在人旁邊爆炸!!!


  實在太震撼了

  看得太爽了

  現在都是電腦特效滿天飛

  沒有這種真槍實彈的特效了o.O


  劇情就是灑狗血^n

  明明大部分情況 著火的建築裡面根本沒有人

  現在大家知道

  消防員乖乖在外面灑水就好了

  建築物就讓它燒沒差

  但電影就是要灑狗血的

  每次消防員就是要衝進去火場

