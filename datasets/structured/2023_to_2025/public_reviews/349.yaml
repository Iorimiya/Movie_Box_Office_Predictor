url: https://www.ptt.cc/bbs/movie/M.1510420654.A.906.html
title: 水底情深 - 跨越一切的老派浪漫
content: '總之有搶到票，就算公關票可能被預先蓋了很多還是搶到了。

  這次沒有確認碼免除了 u 和 v 的字型問題很順利地點什麼有什麼。


  這場因為明天二月才會上映現場實施了安全檢查，

  手機都先被收走，很多人抱怨的光害問題不復存在。


  —以下開始故事情節雷—


















  可能很多人會直接下標「跨種族愛情」

  對沒錯，就是這樣一個故事

  (如果以古阿莫式結語這邊就可以結束了)


  但細節做得真的很好；畫面的營造、情節設定、人物對比……，都會在觀影後細細回想，這一切是怎麼這樣順其自然發生的。



  所以大概要從故事設定開始補回：


  喑啞孤女伊萊莎在秘密實驗室裡做清潔婦。

  每天的行程大約是這樣的，

  起床撕日曆→煮水煮蛋→等待熟的時間泡澡順便自慰→

  看看獨居畫家朋友嘉爾聊聊天→拿著熟蛋放午餐袋排隊打卡上班


  日復一日的規律上下班清潔屎尿撿拾垃圾。

  一天，新來的保安官在廁所清潔時間時硬要上廁所順便講講垃圾話

  「能力很強可以看看但不要摸」之類的話

  在他離去時伊萊莎在洗手臺上看見了血跡

  (現在想起來這些血應該是保安官凌虐生物的血)


  清掃完在走道看見那男的跑離實驗室滿身血在地上哀嚎著

  主管要她與同事瑟達進去實驗室裡清掃血跡


  伊萊莎清掃中找到了保安官的兩隻斷指

  把斷指放在自己的午餐袋交予上級

  也因為這次意外進了實驗室

  觸發了與神秘兩棲生物的第一次見面


  伊萊莎於實驗學者的討論耳語中得知

  神秘生物是被當地土著認為神的存在

  一開始可能因為好奇心，後來一次次的以熟雞蛋、手語、音樂與之交流。


  背景：美國與蘇俄的上外太空競賽

  這裡的實驗其實是在研究他的呼吸系統

  並以此情資希望送上太空艙的生物能夠活久一點

  保安官一路運送他過來巴爾的摩的這個實驗室

  覺得自己從韓戰的功勳標榜的戰士變得很沒有社會地位

  新仇舊恨下說服上級直接解剖他取得情資

  身份是俄方秘密臥底的學者 Demitri (類似這個音) 積極反對，

  覺得還有很多地方可以研究必須讓他活著


  爭論中 Demitri 透過監視器他看見伊萊莎試圖把卸貨地的監視器角度移動，

  於是明白他們有同樣的目標，把他救出實驗室。


  後面講完就沒什麼好看了就雷到這好了




  回頭想想這麼簡單的故事其實前面一句話完畢就沒了

  看完影展節目冊介紹大綱大概可以腦補推論完後面會發生的情節

  為什麼我還好在看完以後想好好記住這些有的沒的


  很多細節都很有趣，例如姓氏對應了聖經裡的名字還有各種不同的人物背景對照他之後的行為模式。


  以身份的認同來討論愛：

  在救援前刻，藉由畫家好友嘉爾的質疑問出最直觀的疑問，

  他甚至都不是人，為什麼伊萊莎可以愛他/想要救他？


  她是這樣回答的，

  他看著她、對待她的方式讓她覺得自己是完整的。

  如果他不算是人，那她自己呢？

  和他一樣，她無法言語

  和他一樣，人們無法理解她所比的手語(如果沒有學手語的話)

  只要背過身，就算她比得再多都沒有聲音傳達出去

  他與她都是如此寂寞、孤身處於這個世界。


  對比嘉爾自己形容自己的窘境：

  「」

  這個世界有了攝影機已經不需要畫家來畫廣告

  餐廳裡心儀的服務生還沒有辦法接受他的喜歡

  嘉爾既先進又太落後，這個世界也不理解他。


  嘉爾只有在看見處於水中互相擁抱的伊萊莎與他，理解了愛與認同的形狀。


  The Shape of Water


  --'
