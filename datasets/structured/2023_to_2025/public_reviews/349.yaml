title: '[新聞] 笑言DC英雄太老派 史派克李不排斥與漫威'
content: "笑言DC英雄太過老派，美國傳奇名導史派克李鬆口「不排斥與漫威合作。」\n\n\n\n\n說到這個世代最受廣大觀眾喜愛的電影公司，非漫威影業莫屬。觀眾對於在漫威影業的超\n\
  級英雄電影之中，看見獲得奧斯卡等各大演技獎項的演員並不陌生。但是，當人們討論漫\n威電影時，卻極少看見真正的「傳奇導演」。然而，傳奇導演是否有機會執導漫威電影？\n\
  或許除了馬丁史柯西斯之外都有點機會，尤其是美國傳奇名導暨紐約尼克死忠球迷──史\n派克李，日前他便透露並不排除執導漫威英雄電影。\n\n\n【 「叫座不叫好」的商業片？屢破紀錄的漫威超級英雄電影\
  \ 】\n\n\n\n先回頭看2008年小勞勃道尼主演的《鋼鐵人》，在口碑和票房大獲成功之後，便開啟所謂\n的「漫威宇宙」，2008年至今，不過十餘年時光，漫威影業旗下大紅大紫的好萊塢明星就\n\
  不勝枚舉，除了小勞勃道尼之外，初代英雄還有「美國隊長」克里斯伊凡、「雷神索爾」\n克里斯漢斯沃、「綠巨人浩克」馬克盧法洛、「鷹眼」傑瑞米雷納和「黑寡婦」史嘉蕾喬\n\
  韓森，在這些頭牌英雄角色的率領下，雙方共同交織出縝密且極具娛樂性的電影世界，最\n終迎來第一階段的重大勝利──《復仇者聯盟4：終局之戰》，此作品在全球狂掃27.97億\n\
  美金，也順利打破詹姆斯卡麥隆《阿凡達》的27.90億美金，獨居影史票房冠軍。\n\n\n若觀眾覺得漫威影業的卡司，只是虛有其表但缺少演技的明星，漫威也有能耐找來奧斯卡\n\
  得主，如「驚奇隊長」布麗拉森、凱特布蘭琪、娜塔莉波曼、葛妮絲派特洛、麥克道格拉\n斯、安東尼霍普金斯等人，從演員來看，含金量也極高，而漫威影業的明星家族成員仍在\n\
  不斷擴充。\n\n\n\n或許觀眾對於漫威宇宙擁有的豪華卡司陣容毫不陌生，但是執導漫威電影的導演們似乎卻\n少了些「傳奇」味道，雖然有羅素兄弟、強法夫洛甚至是甫以《兔嘲男孩》(Jojo\
  \ Rabbit\n) 獲得奧斯卡最佳改編劇本的塔伊加維迪提，但這些導演都離真正的「傳奇」有些距離，\n而在一個由片廠和製片人掌權的影像工業中，「作者導演」的身份將被淡化不少，名導演\n\
  們難以施展拳腳，自然就少了合作機會，也難怪影壇巨擘馬丁史柯西斯會抨擊漫威電影─\n─「不是電影，而是大型主題樂園」。\n\n\n\n「如果有遇到合適的機會，我會考慮的。」不過近日，史派克李接受《娛樂週刊》\
  \ 的視\n訊訪問中，被問到「是否有興趣執導超級英雄電影」時，表達開放的態度，並稱：「我沒\n有反對漫威，我從小就看《蜘蛛人》的漫畫，我不會努力爭取執導漫威電影，但如果有遇\n\
  到合適的機會，我會考慮的。」\n\n\n除此之外，這位美國名導還趁機酸了一下隔壁棚的最大競爭者DC影業，直言DC的漫畫有點\n老套。\n\n\n▲《永恆族》。\n\
  \n其實，史派克李與漫威的派系人馬相當熟悉，他與山繆傑克森的友誼最顯而易見，當然，\n這幾年因執導《黑豹》而大鳴大放的導演萊恩庫格勒也與史派克李是好友，而在紐約大學\n\
  時，史派克李便教過今年獎季以《游牧人生》(Nomadland) 強勢問鼎奧斯卡的導演趙婷，\n趙婷未來也將執導漫威的《永恆族》，對於史派克李這類的名導，人脈自然不是問題。而\n\
  從商業電影的製作面來看，史派克李也相當熟悉，包含2006年的《臥底》和2013年改編南\n韓名導朴贊郁《原罪犯》(Oldboy) 的《復仇》，都是嘗試。\n\n\
  \n▲《復仇》。\n\n而史派克李導演生涯的作品，其藝術性自然不在話下，也備受各界肯定。若從高舉「藝術\n掛帥」的歐洲三大影展的領頭羊坎城影展來數，史派克李生涯前期的作品《美夢成箴》(S\n\
  he’s Gotta Have It) 便入圍坎城導演雙週單元，而後包括《為所應為》(Do the Right\n Thing)，《叢林熱》(Jungle Fever)、《Girl\
  \ 6》、《酷暑殺手》(Summer of Sam)、《\nTen Minutes Older》（聯合執導）以及《黑色黨徒》(BlacKkKlansman) 等片，皆在坎城\n\
  亮相，其中更以《黑色黨徒》在凱特布蘭琪率領的評審團中贏得評審團大獎（金棕櫚為是\n枝裕和的《小偷家族》），也順利將此氣勢延燒到奧斯卡，憑藉《黑色黨徒》拿下生涯首\n\
  座奧斯卡最佳改編劇本。\n\n\n▲《黑色黨徒》。\n\n而且，若是沒有疫情干擾，史派克李在去年將出任坎城影展主競賽評審團主席，這也使得\n史派克李成為第一個擔任此職務的非裔美國人。去年，史派克李也交出了《誓血五人組》\n\
  ，成為衝擊今年奧斯卡的種子選手，從各方面的成就來看，史派克李在影史擁有不動如山\n的地位。\n\n\n▲《誓血五人組》。\n\n雖然漫威電影這類動輒數億美金的製作成本，的確需要在風險評估上做得更為細緻，不容\n\
  許差錯，換句話說，導演的作者風格會被削弱許多，畢竟所謂的「大眾口味」才是真正能\n賺錢的方式，才是漫威真正在乎的。但其實，近年像是《星際異攻隊》系列、《雷神索爾\n\
  3：諸神黃昏》等等，都成功融合導演的自身風格，進而讓觀眾拍手叫好，從這幾部片子\n的例子來看，漫威或許能做到些許讓步，讓導演們更自由的揮灑創作。\n\n\n\n\
  ▲《雷神索爾3：諸神黃昏》。\n\n雖然史派克李跟漫威目前並無正式計畫，但史派克李的態度仍舊讓影迷產生無限遐想，未\n來史派克李若真的接下漫威影業的導演筒，其意義便是漫威真正首度迎來重量級導演，也\n\
  或許，觀眾會看到一部嶄新的超級英雄電影。\n\n\n\n\n\n\n--"
