title: '[問片] 有關於美國棒球卡的穿越電影'
content: '想問一個約十多年前的電影

  故事背景在美國

  大約是有一個小孩他常常去一個老太太家玩

  而老太太已經臥病在床


  小孩在他家翻出一盒棒球卡

  然後這棒球卡就帶小孩穿越時空回到過去

  看到這位傳奇球星


  一個只懂一點點的小孩就跟球星在打棒球

  最後他為了要回到他的現代，聽了壞人的話

  要假扮球星打棒球要求輸


  結果不小心達成一個漂亮雙殺

  也順利地回到過去




  最後才發現原來老太太是那個球星一個很重要的人

  結局就是小孩看著老太太也穿越回去要去跟球星見面

  有點感人，也非常有畫面，但剛剛查了movie跟google找不到

  再拜託大家了~


  --


  謝謝你，就是這部！

  沒想到居然可以找到'
