url: https://www.ptt.cc/bbs/movie/M.1672982049.A.E4E.html
title: '[普雷] 《緣路山旮旯》，愛久見人心？'
content: '部落格版：


  《緣路山旮旯》讓我想起繪本奈央老師的《即使如此我還是喜歡妳》。那時候還不認識原

  作、也就是台灣影視界著名編劇徐譽庭，不知道原來這是改編自她出版的小說《馬子們！

  寫給曾經被我愛過傷害過的你們》，只是單純的很喜歡漫畫畫風，還有看到後來令人很有

  感觸的劇情。《緣路山旮旯》其實就好像是《即使如此我還是喜歡妳》，用男主角的數段

  愛情、不論是單戀也好、真有交往也好，甚至止於曖昧也好，於感情路上的聚散離合串成

  一部故事。只是雖然兩者都讓觀眾、讀者看見男主角在經歷了許多之後，如何從每段感情

  中汲取養分，好讓自己能夠成為、或是朝向更好、更成熟的自己前進，但比起《即使如此

  我還是喜歡妳》多側重於情感上的描寫，將每段男主角芹澤祐輔和女生們的發展過程、從

  淡轉濃、從濃轉淡，為什麼在一起又為什麼分開，那些以「愛」、「喜歡」為主題的各種

  層面探討都清楚詳盡的交代，《緣路山旮旯》反而不怎麼在意這些，導演黃浩然讓愛情成

  為點綴，真正藏於愛情裡頭的主題還是這幾年許多香港電影不約而同談起的，對舊香港的

  緬懷、還有對香港正逐漸失去味道的感慨。


  之所以會說導演黃浩然不怎麼在意愛情這塊，因為確實《緣路山旮旯》看似是相當常見的

  愛情喜劇，看科技宅男主角阿厚和五位他有好感、對他有好感、互有好感的女生們如何發

  展，但實際上愛情喜劇僅是電影外包裝，《緣路山旮旯》就和同樣入圍金馬獎的《燈火闌

  珊》一樣，導演黃浩然亦將他對香港的情感放入電影之中，並成為有血肉與骨架的角色，

  懷抱著某種目的的在香港街頭穿梭，在試圖尋找過往熟悉身影的同時，更是種對已逝或是

  正被消失的香港景緻之追憶。


  於是導演黃浩然儘管讓阿厚嚐遍了愛情酸甜苦辣鹹，讓不同的愛情觀與價值觀去碰撞，既

  是啟發阿厚，也是令他蛻變成長。不過阿厚就像《燈火闌珊》裡的美香，帶著丈夫生前徒

  弟努力的修復、保留然後試著延續霓虹燈招牌的生命，他亦帶著他和團隊所研發的App跟

  著他每個階段所遇到的女生，走向他不曾去過的那些地方，澄碧邨、荔枝窩、大澳、沙頭

  角、下白泥...，似是為他的愛情跋山涉水，更是想讓這些人們口中的山旮旯能被記住、

  不因時代變遷、城市發展而被走入歷史。



  在粵語中屬貶義詞的「山旮旯」、意即交通不方便、經濟發展落後的窮鄉僻壤，而《緣路

  山旮旯》中的五位女生就都剛好的住在這些難以到達的地方。她們每個人其實不只對阿厚

  ，她們對所有可能有更近一步發展的男生們都說出了心中顧慮，「曖昧時期，為了把自己

  追到手，即使自己住在窮鄉僻壤也還是來得勤奮，並且甘之如飴。可是誰又能保證在交往

  之後，能夠繼續這樣有耐心的郊區和城市跑？」，就像咩姐和阿厚說的，當真的交往之後

  ，最先會慢慢減少來自己住的地方次數、被要求增加去對方那裡的時間，接著不久後就會

  開始被問要不要考慮搬到市區，然後兩個人就會針對這個問題爭吵、最後分手，無一例外

  。城市固然有城市的好，可郊區當然也有郊區的好，「為什麼要搬到市區？住在郊區不好

  嗎？」，要是真的相愛，距離不應該是問題不是嗎？只是現實的無奈是，還是有好多人為

  愛妥協、為愛離開，這是咩姐無法去改變的必然結果。


  記得前陣子看到一則新聞，日本長崎縣五島市富江町過去以漁業維生的「黑島」，近年由

  於人口大量外移，從原來約有200島民，到去年只剩下一位，隨著這位島民於7月的離世，

  黑島正式成為無人居住的孤島，這是五島市繼1973年奈留町「葛島」之後半世紀來再一座

  新增無人島，直到現在五島市只剩10座島嶼有人居住，不過其中人口不到百人的就有6座

  ，也許再過幾年這些島就會步上葛島和黑島的後路，成為又一座的無人島。而有曾經居住

  在黑島的島民直言「變成無人島也是沒辦法的事。」，簡單幾字背後盡是說不完的原因，

  說直接點就是城市各種資源都比較好，若要尋求更好的發展也比留在島上好。看著這則關

  於黑島的新聞，難免會想這是否就是導演黃浩然所擔心的事情？不論是澄碧邨、荔枝窩、

  大澳、沙頭角還是下白泥，它們都面臨著人口不停外流的危機，是否有天它們都會成為香

  港的黑島？



  《緣路山旮旯》披著愛情電影的外皮，血液裡流淌著的，仍是滿滿的香港情懷。導演黃浩

  然借情抒情，用著阿厚的愛情來傾訴自己對香港的情感，阿厚邊聽著她們說著家鄉當地的

  過去與現在，然後思考著可能與她的未來，他與她們的對話看似只與愛情有關，然而話中

  有話的是，導演黃浩然對這些山旮旯未來發展的擔憂，一場在茶餐廳裡的戲更是直接丟出

  地方發展的話題讓人思考，而他亦在《緣路山旮旯》中提出對山旮旯的願景與期待。從沙

  頭角走到荔枝窩，最後阿厚戀情綻放在澄碧邨，他不要求也不強迫咩姐搬家，還支持她繼

  續留在澄碧邨，這樣的結果無疑是導演黃浩然所期待的、能有更多人選擇留下或是回來。


  歷史悠久的荔枝窩客家村雖經歷1960年代村民陸續遷離，不過自從成為香港聯合國教科文

  組織世界地質公園的一部分後可以說是重獲新生，不僅是熱門的旅遊景點，建有商店、訪

  客中心、文化館等介紹當地歷史與生態，也有越來越多農夫回來復耕畜牧，更有像電影中

  Lisa這樣的地景藝術家進駐，賦予荔枝窩嶄新的面貌。導演黃浩然雖然沒有給阿厚和他的

  高中女神Lisa有美好結果，但卻也給了觀眾電影最美的幾幕時間，而他之所以選擇分給荔

  枝窩較多的時間來去介紹，因為荔枝窩的重生是香港本地鄉郊活化的成功例子，無疑是他

  對未來能夠看到其他山旮旯都能夠重獲新生的願景。


  《緣路山旮旯》節奏輕鬆、步調輕快，是部就算對香港不熟悉，或者不在意導演黃浩然附

  加在劇情裡頭的議題，也還是可以輕易消化的愛情喜劇。比較可惜的部分是，回到最前面

  我提到的，導演黃浩然旨在談論山旮旯的未來，所以在愛情的描寫上較沒那麼深入，雖然

  電影主打一皇五后，但實際上這五后被分配到的時間各有長短，其中住在下白泥的戴花花

  篇幅少到幾乎淪為「介紹」功能性角色，和阿厚間亦沒有多少愛情火花，最早出場的主管

  A Lee同樣如此。這樣的問題導致觀眾很難去理解存在於阿厚與這些女生間的感情變化，

  即使是戲份最多的Lisa、咩姐還有Mena，都是在很突然的情況下開始阿厚和她們的故事線

  ，就感覺上《緣路山旮旯》比較偏走類似單元短篇，可惜單元與單元之間處理的不夠流暢

  ，容易讓觀眾對愛情的開始與結束感到莫名，也會導致最後很難被阿厚的蛻變成長給說服

  。


  --'
