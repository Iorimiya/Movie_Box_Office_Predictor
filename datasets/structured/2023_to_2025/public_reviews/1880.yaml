title: 'Fw: [好雷] 《緣路山旮旯》邁向心裡的山旮旯'
content: '作者: elvayanzimei (柏C) 看板: HK-movie

  標題: [心得] 《緣路山旮旯》邁向心裡的山旮旯

  時間: Sun Jan  8 21:11:36 2023


  雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  1.影片名稱：緣路山旮旯


  2.觀影時間：2023/01/08


  3.觀影地點：信義威秀（居然開9廳，買票前還再確定了一次>"<）


  4.觀影方式：電影交換券


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  部落格圖文版：


  還記得去年《緣路山旮旯》的口碑在香港開始發酵後，有好一陣子社群上滿滿是有關於電

  影的好評與討論，加上「阿厚」岑珈其近期在戲劇中詮釋不同類型角色，每每令人眼睛一

  亮的演出，都讓我更想趕快親身體驗這股風潮。


  然而直到余香凝入圍金馬女配後，《緣路》的在台上映之路依舊無消無息。在我幾乎已經

  不存期待的某個12月夜晚，就這麼突然地滑到了電影的上映資訊，希望不再只是希望。沒

  想到在香港上映近半年後，終於可以在台灣院線，一睹香港究竟有多漂亮，岑珈其的桃花

  運又到底有多麼「不科學」。


  而這段峰迴路轉的心路歷程，幸也不幸地更提升了我對於電影的期待。先從不幸說起，在

  《緣路山旮旯》席捲全港後，大澳的漁村風光、荔枝窩的客家聚落立刻成了在地創作者的

  熱門取材之處，銀幕上景色明媚依然，我卻不免少了那股「原來香港居然有這種秘境！」

  的關鍵感受。


  但另一方面，《緣路》對於「地理式愛情」的理解其實是更深層的。「距離」被廣泛地用

  於度量阿厚的這五段感情，距離可以是物理的，當維繫關係的成本變高，便得以檢驗雙方

  在彼此心中的份量；也可以是心理的，而這種「心的距離」，甚至可以被抽換成人生中許

  許多多關係是否能存續的最大要件－「價值觀」。因此幸運的是，這種藉由「地理」詮釋

  愛情的獨特角度，徹底超出了我原先的期待。


  「為什麼我要搬到市區？」－Mena


  在看《緣路山旮旯》的時候，我腦中一直閃過最近在網路上看到的一個概念，叫做「交換

  價值觀」。簡單來說，就是要溝通雙方的想法，並從中取得平衡點。而這其實就是整部電

  影不斷在探討的主軸－價值觀究竟該怎麼交換？


  「你可以做回你自己了，我們分手吧。」－Mena


  「什麼時候要搬到市區？」 阿厚的「為你好」，真的是關心嗎？

  「為什麼突然又Gel頭又隱形眼鏡？」徹底地討好對方，改變自己，又是對方真正想要的

  嗎？

  「為什麼要給小費？」「你不是跟一個女生吃飯嗎？」當Mena毫不退讓地咄咄逼人，愛情

  又怎能不消磨殆盡？


  「正眼看著我。」－Lisa


  直到在阿厚與中學女神的對望中，我們終於理解到，價值觀的交換，從來不只在於妥協。

  當怯於溝通、不懂得溝通，就連每個男生都或曾有過的青澀羞赧，都會被懵懂地誤認為討

  厭。


  「每個男人一開始都說來送我，然後一個月之後就開始叫我搬出長洲。」－Melanie/ 咩

  姐


  而在最後一段感情中，《緣路山旮旯》最終將物理、心理兩種距離收束為一。市區的康盛

  花園與離島的澄碧邨一在東一在西，遠距離是愛情的試金石。當阿厚搬至長洲的那刻，他

  縮短距離的方式，意味著他選擇放下的自己的一部份，願意舉步踏向他心裡的「山旮旯」

  ，並不負乘載著一段段感情的來時路，即便面對咩姐裝腔作勢的句句質問，依然誠懇地表

  明自己的心意。


  「樓上是不是…？」

  「真的很土，但我喜歡。」－Melanie/ 咩姐


  儘管讚賞中還是總帶著吐槽，然而咩姐也交換了彼此的價值觀，一起邁向兩人心裡的山旮

  旯。


  「重要的不是在哪裡，而是跟誰一起。」－阿厚


  而這個「心裡的山旮旯」，就是兩人之間最好的平衡點。


  以距離串聯起香港的郊野秘境，並進一步地將地理與愛情這兩個概念結合，一方面加速迭

  代阿厚好到不科學的五段桃花，另一方面也將之引申為兩人是否相愛的終極意象－相愛並

  不是因為相似，而是因為願意將彼此拉近的互補，是願意一同邁向心裡的山旮旯。


  另外，《緣路山旮旯》中隨著阿厚的愛情經驗愈趨豐富，整題由短到長的時間分配，也讓

  電影的層次更為鮮明。而岑珈其真的把「宅男工程師」的形象詮釋地相當立體，每每看到

  他內心慌亂與想法單純的樣子，真的會不禁想起某些時候的自己，最難能可貴的是，這居

  然是出自一個那麼會揣摩油條角色的演員。（Ex. 《IT狗》中的創業導師）


  電影中也充滿令人眼睛一亮的巧思，最搶眼的肯定是除了會導航路線，還總在惆悵或浪漫

  的氣氛中，插上一句的「外賣仔APP」Aka. 氣氛破壞者（咩姐：可以關掉嗎…）；魔術方

  塊、樂高人偶等貼合阿厚個性的定情小物讓人莞爾；台詞中不時隱喻的社會現況則令人嘆

  息。然而在看完《緣路山旮旯》後，雖然少了那份「竟然」的激動，可還是不得不說句：

  「＃香港真係好靚！」好想去走走啊～


  --


  部落格：

  FB粉專：


  --'
date: 2023-01-08
sentiment_score: 1.0
