url: https://www.ptt.cc/bbs/movie/M.1620186206.A.F21.html
title: '[新聞] 彭于晏張艾嘉等主演、寧浩監製《熱帶往事》中國定檔'
content: '新聞網址：


  由寧浩監製，溫仕培執導，彭于晏 、張艾嘉、王硯輝、章宇、姜珮瑤等出演的電影《熱

  帶往事》發布海報，定檔6月18日上映。(中國)


  電影《熱帶往事》講述在一個炎熱夏夜，一起隱藏在黑暗之中的命案，陰差陽錯導致幾人

  命運被永遠改變的故事。





  ---


  這片是今年需要特別關注的中國電影之一。


  《熱帶往事》的國際銷售公司是 Wild Bunch，他們很擅長經營三大影展，這片很有可能會

  在坎城亮相，很期待！


  但現在中國會在坎城前上映，可能被選也頂多是一種注目了？


  同樣的，Wild Bunch 手上還有《暴雪將至》導演董越的新片《假髮》，可能也或許有機會

  出現。






  --'
