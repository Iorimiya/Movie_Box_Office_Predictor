title: '[新聞] 彭于晏主演《熱帶往事》減重40磅'
content: '新聞網址：



  原標：彭于晏新電影《熱帶往事》為詮釋角色減重40磅


  坎城國際版海報




  彭于晏主演電影《熱帶往事》將在明天上映院線。彭于晏為戲減重40磅，瘦到脊椎骨凸起

  ，並且跟著空調修理師傅學技能，做到「像那個人」。為了詮釋好角色，彭于晏為新電影

  《熱帶往事》吃盡了苦頭，這次身材又成為噱頭再次引發網友熱議。






  儘管他此前頻頻在電影中秀出好身材，《熱帶往事》導演溫仕培表示「不想販賣演員的肉

  體魅力」，甚至刻意不去呈現他正面的身材，而是通過脊椎骨和傷疤的細節，呈現人物的

  情緒。導演揭秘讓他減重40磅的幕後——他壯碩的身材出演底層小人物有點出戲，因此得

  減肌。導演也強調雖然有洗澡戲，卻不想販賣演員的肉體魅力。


  《熱帶往事》目前於中國大陸院線熱映中





  圖片：網路



  --'
