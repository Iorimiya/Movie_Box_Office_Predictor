title: '[好雷] 凌晨兩點的惡魔 潤娥妖壽正！'
content: '如標題所述！夭壽正

  這世上真有能強行轉粉的美貌


  最近習慣看標題就買票

  開場就被潤娥美顏爆擊


  發現和噪音殺機一樣，板上沒啥分享文

  本身算是有及格的愛情喜劇，就小推一下



  劇情本身很普通

  男主遇上潤娥，一見鍾情

  發現潤娥身上的秘密

  中間小插曲算是很不緊張

  最後就是有情人終成眷屬


  但必須抱怨..結局很失望

  因為大部分都是惡魔演出

  觀眾其實心裡會慢慢愛上惡魔


  我一直在期待男主求惡魔別走

  結果結尾卻是封印她

  放在角落的罐子，就算裝飾再可愛

  心裡還是有點酸酸的感覺


  愛情果然不能全都要

  希望惡魔也能過得幸福QQ



  最後再強調，潤娥真棒

  兩百塊光是看那張臉值回票價♥



  --'
