title: '[討論] [幻幻之交]-首支預告 2024年 無中生有 '
content: '【幻幻之交】首支預告 - 2024年 無中生有 全台戲院見




  假如...小時候你所相信的一切，其實都是真的！？

  一個相信才能看到的故事


  #約翰卡拉辛斯基 創意構思最新力作

  帶您進入一個全新奇幻成真的世界


  劇情大綱 :

  約翰卡拉辛斯基最新編導作品【幻幻之交】，描述一個女孩發現她可以看見所有人的幻想

  朋友，在一段奇幻的冒險旅程中，她必須運用這樣的超能力，幫助幻幻和忘記他們的小朋

  友重新建立連結。


  超強卡司：萊恩雷諾斯、約翰卡拉辛斯基,、凱莉佛萊明、費歐娜蕭、菲比沃勒布里奇、

  小路易斯葛塞特、艾蜜莉布朗、麥特戴蒙、瑪雅魯道夫、喬恩史都華、鮑比莫尼漢、山姆

  洛克威爾、賽巴斯汀曼尼斯卡爾科、克里斯多弗馬隆尼、李察傑金斯、奧卡菲娜 和 史提

  夫卡爾


  執行製片 : 約翰J凱利、喬治杜威

  製片: 艾莉森西格、安德魯福姆、萊恩雷諾斯、約翰卡拉辛斯基


  派拉蒙影業發行

  Sunday Night / Maximum Effort Production製作


  --------------------------------------------


  感覺又是一部超適合萊恩雷諾斯主演的片

  麥特戴蒙又要被救嗎? 還有艾蜜莉布朗喔~


  --'
