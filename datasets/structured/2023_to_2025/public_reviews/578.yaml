url: https://www.ptt.cc/bbs/movie/M.1736608095.A.0F9.html
title: '[負雷] 【第一聖拳】荒謬廉價喜劇 尬點滿滿'
content: '‧


  【第一聖拳】風格走的是荒謬喜劇，也或許我笑點過高，也可能是韓式幽默不對我口味，

  全片1個半小時，居然劇情已經進行2/3了，還無法讓我覺得這部片的任何劇情及喜劇橋段

  ，會令我感到有趣；全片太過刻意演出，雖然可能導演要的就是這樣極度荒謬的風格，但

  加上提油救火的音效及配樂，更是讓我覺得滿滿尷尬。



  ‧


  打著宗教元素合作，但實際上在各自宗教胡鬧的篇幅卻沒有想像多，到後段也都只是披著

  宗教服裝，執行一些模板劇情，打鬥也一般般，沒有太多精彩場面，巫覡線更是讓人煩躁

  ，搞個莫名其妙的小女鬼附身，又設定的超級廉價，把「牧僧巫」這個具有潛力的素材，

  炒得像是一口難以吞嚥入喉的佛寺豆飯。



  ‧


  而劇情提到復仇動機跟牧師讚美歌的橋段，算是全片唯二比較能夠看下去的橋段，大尾鱸

  鰻的低俗喜劇都能比【第一聖拳】更能歡愉的觀眾，而電影宣傳寫著「史上最強復仇者聯

  盟」，我是不知道強在哪裡，但絕對會先被我列入2025不推薦片單之中，英文片名Holypu

  nch，我真的Holy媽祖覺得不推薦進場觀看。



  ‧


  「觀影的樂趣在於能獨自在那裡冥想一刻鐘」


  追蹤茶太郎IG




  --'
