title: '[情報] 《第一聖拳》前所未見的復仇者聯盟來襲'
content: "前所未見的復仇者聯盟來襲！\n\n準備笑破你肚皮《第一聖拳》\n\n2025年1月10日(五) 全台上映\n\n  \n\n黑道牧師ｘ流氓僧人ｘ刑警巫覡\
  \ 史上最強復仇者聯盟！\n\n  《第一聖拳》2025年1月10日(五) 各顯神通\n\n\n《衣袖紅鑲邊》吳代煥 x《好搭檔》池承炫\n\n精彩共演！\n\n\
  \n兩名黑道成員慶哲（吳代煥 飾）和泰勇在為老大慶生時，死對頭三岔路幫突然闖入並殺\n死了他們的老大，慶哲和泰勇後來便各自隱身在教會和寺廟。\n\n慶哲所待的教會原本因假牧師而差點被毀掉，慶哲竟陰錯陽差地成為新牧師，備受教徒敬\n\
  重；泰勇趕走躲在寺廟中的罪犯後，和住持一起生活。兩人過著隱姓埋名的生活，等待復\n仇之日的到來。\n\n然而，三岔路幫繼續犯下放高利貸、人口買賣等罪行，這讓巫覡刑警道弼（池承炫\
  \ 飾）\n非常憤怒，為了逮捕三岔路幫的老大，道弼找上了慶哲和泰勇，向他們倆提議要合作。牧\n師、僧人、巫覡展開前所未見的復仇行動。\n\n資料來源：車庫娛樂\n\
  \n--\n整天造謠不累喔 可憐哪\n你又在自介喔？造謠仔"
