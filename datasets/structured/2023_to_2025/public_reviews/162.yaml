title: '[極好雷]《失控夜班》有輪班經驗者必看'
content: '前言：

  筆者有觀賞過同一演員演出的《失控教室》

  該作的在臺發行商一樣是光年映畫，喜聞樂見的〇〇系列取名法。

  比起《失控教室》，我更喜歡這部《失控夜班》。

  《教室》裡面重複提及的教育理念和對個人隱私的界線

  對我來說有些太遙遠，裡面的一些小衝突難以共感。


  《夜班》則不然，筆者只有在科技業輪過班－當產線仔，機台不會罵人

  更沒有家屬會暴起打人。同時好幾件事出現，輕重緩急都好分，大不了丟給老闆去吵。

  比起醫療現場，想來應該是簡單難度。


  對醫療第一線的所有醫護人員獻上敬意。


  電影開場，交接的情節就開始有點讓我不舒服了。

  純粹是PTSD冒起來，一件事一件事講，最後再來個回馬槍說還有件事，既視感已經拉滿了


  接下來的電影情節其實都符合正常的值班流程。

  巡房-值班手機響-處理

  正要處理下一件事-值班手機響

  事情處理到一半分不出手-值班手機響

  配藥-值班手機響，然後還是那種雞毛蒜皮的小事


  打給值班通常要緊急狀況或必須協助再說，小事情打來真的會很躁。



  劇中所有人，真的是所有人。

  不管是醫師、護理師、病患和病患家屬的情緒都可以稱作非常穩定。

  醫院是生死交關的地方，對未知的恐懼、家人的擔心而且還有疼痛－負面情緒大魔王。

  但在《夜班》的每個角色，對他人講話都還有基本的禮貌和尊重

  （以值班現場的標準來說啦）

  不禁令我想，歐洲的醫護現場在這方面友善程度有這麼高…?



  不只是值班，有在醫院待比較久，

  是照顧家人或是自己住院，應該都會有感的橋段。

  像是抱怨拿個止痛藥要非常多的時間，雖然我私心認為已經很快了

  基本上所有人都超忙，其實也記得要做，但真的騰不出手。


  還有其他床出事，甚至是其他狀況好一點病患幫忙告知，也是常有的事。



  《夜班》的故事主體算不上失控，應能算是值班日常。

  電影最後的人性光輝太過美好，好到我覺得有點不真實。


  所有的事情都好好地撿起來收好了，甚至大夜班的也十分給力，真的很感動。

  電影最後的鏡頭我非常喜歡，明知道是暖收，但整個畫面的力道是深深打進我心

  片尾忍不住潸然淚下，真的很愛這部的節奏和整體的安排。


  「明天你還會在這嗎？」

  「是的，我會在。」



  --'
