url: https://www.ptt.cc/bbs/movie/M.1756570588.A.A11.html
title: '[好雷] 失控夜班'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  近年來全球醫護人員罷工已成常態，包括馬來西亞、美國、德國、韓國與英國都曾發生醫

  護大罷工。在高齡化社會與疫情衝擊之下，醫護人員長期在高度負荷、薪資不公、人力短

  缺且人員配置不足的環境下工作。這已經不是單一國家的現象，而是全球醫療缺工的問題

  。就連位於中歐的先進國家瑞士，都拍出這部讓醫護人員直呼簡直紀錄片的《失控夜班》

  ，讓人不得不仔細思考「醫療人力不足」的嚴重性。



  在燈火通明卻孤寂無聲的瑞士醫院夜班裡，護理師芙蘿拉挺身走進一場無休止的挑戰。人

  力短缺、病患爆滿、突發狀況接連而來，身心俱疲的她，必須同時照料一位重病失智老婦

  、等待診斷的虛弱老者，以及要求苛刻的私家病人。



  醫護人員本質上只需要提供醫療協助，但在《失控夜班》裡，身為一名細心的護理師，芙

  蘿拉經常為病患提供情感上的支持。護理師交接時，除了患者的客觀狀態之外，同事也特

  別告訴她一位失智老婦人喜歡唱歌。這個看似不重要的小資訊，在老婦人遠在美國的女兒

  來電關心，卻反而引起她不安時，發揮意外的效果。



  去年曾經住院過的病患，不幸癌症復發，芙蘿拉也記得她活潑的孩子，甚至事先準備棒棒

  糖要給她們。八成獨居的盧先生，遲遲等不到自己的檢驗結果，興奮地與芙蘿拉分享自己

  愛犬的照片，以及自己為了未來住院已經做好什麼安排。明明忙得不可開交，芙蘿拉仍不

  忘這些小細節，照顧在疾病面前不知所措的患者的心情。但，護理師體貼病患的同時，又

  有誰來照顧他們的心情呢？



  片中非常真實地呈現出兩個護理師的「錯誤」，無人究責的時候當然沒事，但如果導致更

  嚴重的後果，或者家屬堅持追究，護理師們往往只能成為代罪羔羊。的確，開刀房的同仁

  在芙蘿拉接走宋先生時明確提醒她患者對特定藥物過敏，但在毫無喘息空間的情況下，我

  們看到芙蘿拉其實已經從上班開始就一直馬不停蹄地工作著，手中的醫療器材與藥物都是

  反射性地操作與填裝，一不小心就把大部分病患使用的藥物給宋先生，造成他嚴重過敏。

  幸好鄰床及時發現，芙蘿拉也趕緊處理，才順利解決這場危機。



  另外，來自土耳其的移民老太太，雖說本來應該就不久人世，但沒有立即的危險，生命跡

  象穩定，所以芙蘿拉原定最後一個去看她，沒想到，突如其來的心肺狀況讓老太太就這樣

  回天乏術。家屬本就對護理師遲遲沒有巡房感到憤怒，自然順勢將炮火對準芙蘿拉，但不

  論是過敏的宋先生也好，還是過世的老太太，醫生都叫芙蘿拉冷靜應對，畢竟人非聖賢，

  在人手不足的情況下，難免忙中有錯，不把壓力攬在自己身上，才不會導致崩潰。



  《失控夜班》也將護理師完全是體力活的一面呈現出來，不管是推病床，還是幫患者調整

  姿勢、換尿布都能看到，即便是電影前段交班的男性護理師，尚且需要其他同事的協助，

  更遑論比較嬌小或力氣較小的女性護理師。即使不是上述需要力量的工作，平常光是巡房

  ，護理師們都要手腳並用，同時推工作車與換藥車，有時候推車上或手上還得放置或拿著

  待會病患需要的藥品，極為辛苦。這也是為什麼，芙蘿拉才第一天穿的新鞋，到下班的時

  候，已經磨損不堪。當然，她這一天的工作內容還包括到庭院去找手錶，因此球鞋才會沾

  滿泥土，但整日的奔波一樣是造成新鞋飽經風霜的原因。



  其實，嚴格來說，《失控夜班》並不「失控」，甚至可能是不少醫護人員的「日常」，其

  中很大的一個關鍵是越來越多人把醫護人員的醫療服務當作服務業，電影更透過私家病人

  的難搞來呈現出很多患者不理性與不合理的要求。每個人都希望護理師趕快處理自己的需

  求，但卻看不到醫院裡其他更緊急的事務。以那位私家病人來說，泡茶本不是芙蘿拉的工

  作，但既然對方已提出，她也盡量滿足需求，誰知道剛好遇到土耳其奶奶病危，身心靈經

  歷過急救失敗的震撼之後，還得接受私家病人的冷嘲熱諷，任誰都無法再忍氣吞聲。



  除了憤而將私家病人的手錶扔出窗戶之外，一整天的焦頭爛額也讓芙蘿拉不小心對實習生

  說出重話，讓對方委屈地掉下淚來。護理師也是人，整天承受來自患者的負能量，難免會

  有需要宣洩的時候。無論是自己都還處於驚嚇狀態，卻因同事聽完荒謬事蹟爆出笑聲而回

  過神來，務實地到庭院去尋找根本不知道是否早已摔壞的手錶，還是誠摯地向實習生道歉

  後，對方也能理解且再次重申自己真的沒有摸魚，都是從業人員彼此分享鬼故事與惺惺相

  惜的日常。



  片尾字卡敘述：「2030年，瑞士將面臨3萬名護理人員短缺，36%受過培訓的護理師僅在4

  年內就離職。護理師短缺是一場全球性的健康危機，根據WHO統計，預計2030年全球將出

  現1300萬名護理師短缺。」《失控夜班》固然是特例，但就算芙蘿拉的同事沒有突然掛病

  號，另一名不論是平時的搭檔，還是可支援的人力，也沒有剛好去參加研討會，整個三樓

  頂多也僅由四名護理師負責，更不用說這還只是夜班，而不是若有突發狀況更難處理的大

  夜班。



  從芙蘿拉與同事的對話能夠得知，她在片中負責的病患只是整層樓的一半，而且時間允許

  的話，芙蘿拉應該要巡房兩次，因此即便有四名護理師，大家頂多只是有時間輪流吃飯、

  有時間稍微喘息而已，大致上每個人的工作量也如我們在《失控夜班》中所見。當然，還

  是有碰上護理師疏忽讓自己嚴重過敏，事後還能輕鬆與鄰床下棋的患者，也有體貼鄰床、

  自願為失智奶奶放音樂的病患，甚至不斷違反醫院禁菸規定而與芙蘿拉起衝突的患者，都

  在她下班前送上遍尋不著的手錶。



  這些推開門後能讓護理師感到欣慰的畫面，或許正是支持著他們辛勤工作的動力。對芙蘿

  拉來說，在繁忙的日常工作裡，即使擠不出時間吃飯，也要與女兒講上一通電話，便是她

  努力堅持的支柱，而在這麼疲累又挫折的一天結束後，對細心在土耳其奶奶頸部繫上漂亮

  的絲巾，並溫柔地將她送到太平間的芙蘿拉來說，可以在回家的公車上獲得奶奶的安慰，

  就足以讓她卸下一整天的辛勞，明天一早再次打起精神，充滿朝氣地走進醫院，迎接同樣

  忙碌的失控日常。



  為了詮釋芙蘿拉，德國影后萊奧妮‧貝內施特地到瑞士醫院去實習，最終在《失控夜班》

  裡展現出護理師工作時俐落的流暢感與熟練的動作，觀眾真的能夠直接感受到醫護人員的

  辛苦，以及明明動作已經快到不能再快，卻還是面對著做不完的工作所產生的崩潰與無助

  。透過相當寫實的醫療驚悚現場，讓所有觀眾窺視全球隨時都會崩潰的醫療體系，好好珍

  惜現有資源，並給辛苦的醫護人員理解的眼神與誠摯的感謝。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
