title: '[問片] 用巫術讓媽媽復活 但變成只會吃人的殭屍'
content: '問一部恐怖片


  記得主要劇情是一家人好像是用什麼巫術讓媽媽復活


  但媽媽好像變得只會吃人？


  那家人有爸爸和兩個小孩


  小孩是一男一女



  男主角和朋友意外到了這附近,印象中好像是在湖邊


  中途朋友遇到媽媽被吃掉了


  最後男主被那家人要當作巫術祭品要讓媽媽安息


  但最後被小孩女給救了，反殺了爸爸


  記得小孩女還一直嗆男主角沒用 很廢


  有人知道是哪部恐怖片嗎？


  --'
