url: https://www.ptt.cc/bbs/movie/M.1541685138.A.6E2.html
title: '[請益] 女巫/巫術電影掛在樹上的東西'
content: '很多關於女巫或巫術崇拜的電影常常會看到用樹枝作的, 掛在樹上的東西


  有些作品也會出現在屋子的天花板上


  想請問一下有沒有人知道那個東西的正式名稱叫什麼?


  我印象比較深的是十幾年前某部在講女巫, 用手持攝影機瘋狂晃動的電影

  (名字忘了)


  還有之前忘了在哪裡看到的一群大叔去登山散心碰到邪神的... (也是忘了名字了 orz)


  兩部都有出現這種用樹枝作成的東西, 女巫那個好像是看起來有點像"文"字的


  先感謝各位


  --


  對對!



  那是怪物啊... 我想問的是掛在樹上的魔法物品

  不過謝謝推薦



  那個很正派吧?



  那是... 歌?



  twanas 好像是專指那個 "文" 字造型的? 有沒有總合名稱阿? 林祭跟厄夜的看起來不同

  我一開始以為算 talisman, 但是似乎不是...



  韓國電影? 沒看過...'
