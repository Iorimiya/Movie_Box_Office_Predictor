url: https://www.ptt.cc/bbs/movie/M.1543368209.A.A14.html
title: '[問片] 問韓國跟巫術/魔相關的片'
content: '看牙醫的時候放的電影

  不過只有看到電影剛開始的一小段

  希望神人大大能解答是什麼電影～

  ———————————————————


  開頭是在陰暗的郊外

  有一個小弟弟看到他的媽媽因為被魔附身，跪在土上發作

  媽媽清醒後淚眼汪汪的呼喊小弟弟的名字後，又被魔附身

  牧師感覺到媽媽快死了，將小弟弟的眼睛摀起來，不讓他看到這一切，直到媽媽過世


  畫面轉到醫院

  一名小弟弟受重傷，被送入急診室

  不論怎麼電擊跟人工呼吸都無法恢復呼吸心跳

  一位女醫師(A)決定不經過家人同意就將小弟弟剖腹急救

  正要剖腹前，男孩的媽媽來了，找了急診室外的另一個女醫生(B)詢問病情

  B跑進急診室勸A要經過家長同意才能剖腹

  A堅持來不及了要迅速動刀以免錯過黃金時間


  最後剖完腹還是回天乏術

  A走出急診室，準備向男孩媽媽說這個噩耗的時候

  醫院的電燈突然暗掉，急診室裡有一個奇怪的現象發生在男孩身上，讓男孩復活了

  燈亮了之後，有人進去急診室看到心電圖又開始運作，急忙跑出來告訴大家


  後來發現這個男孩是醫院一個大官的孫子，院長十分感謝A的當機立斷

  雖然救回孩子是好事，不過A心裡隱約還是覺得有點不對勁…


  ——————————————————

  大概看到這邊，我就看完牙醫了

  忘記問護士這部是什麼

  好想繼續看完啊啊啊啊


  --

  11/28 09:38

  m大謝謝你！！！這麼快就有答案了好感動'
