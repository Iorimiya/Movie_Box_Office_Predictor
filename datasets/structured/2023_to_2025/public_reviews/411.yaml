title: '[好雷] 謎宴'
content: '進戲院只有我一個人


  但其實這片拍的不錯，只是不要抱錯誤期待，是個小品


  法國懸疑片只要不是跟警匪相關，那通常謎底不會太驚人，我們都被日片各種變態想像養

  壞了口味（非貶義）


  主要是因為法片的主題常常不是正義，而是愛情與自由


  整部片質感很不錯，除了台灣街道看起來就是很亂，這個怪不得人






  --'
