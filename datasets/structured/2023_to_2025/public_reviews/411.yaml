url: https://www.ptt.cc/bbs/movie/M.1740497632.A.395.html
title: '[新聞] 奧斯卡名導來台拍《謎宴》 阿BEN笑爆像台灣人'
content: "奧斯卡名導來台拍《謎宴》 阿BEN笑爆像台灣人\n\n2025/02/25 05:30\n\n\n《謎宴》由江振誠（左起）擔任料理顧問，女主角茱莉亞德努納斯、導演何吉瓦格內一同\n\
  出席記者會。（文策院提供）\n\n〔記者廖俐惠／台北報導〕台法合製的電影《謎宴》昨在圓山大飯店舉行發布會，法國導\n演何吉瓦格內及神似性感女神「碧姬芭杜」的女主角茱莉亞德努納斯飛來台出席，與藝人\n\
  阿BEN、料理顧問江振誠同台。電影團隊在台灣拍攝長達一個月，足跡遍布全台，台北101\n、松山文創園區及夜市都是取景地。\n\n名導何吉瓦格內曾以《印度支那》拿下奧斯卡最佳外語片，暌違11年的新作選擇落腳台灣\n\
  拍攝，茱莉亞德努納斯在片中與林哲熹飾演的新銳主廚有多場對手戲，被問及來台工作的\n獨特經驗，茱莉亞表示正是因為透過拍片來台，讓她感受到與觀光客截然不同的體驗，也\n\
  因此更深入理解了台灣的文化。\n\n\n阿BEN（左起）開心與《謎宴》導演何吉瓦格內及女主角茱莉亞德努納斯重逢。\n（翻攝自IG）\n\n阿BEN在片中客串警察，開心再次與導演見面，更透露導演在現場非常活潑，穿個短褲、\n\
  拖鞋就來導戲，讓阿BEN笑說：「著實像個台灣人！」他認為與導演的溝通像是打網球，\n有來有往，相信電影一定會非常精彩。電影將在4月18日上映。\n\n--\n\n\
  \ 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
