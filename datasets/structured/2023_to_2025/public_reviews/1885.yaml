title: '[ 好雷] 唱出戀愛的苦惱，被性侵的男人群像罪孽'
content: '這部電影，已經不是討好腐女的bl範疇

  而是有如孽子

  將悲情研成金粉的饒舌歌劇


  故事的關鍵字，是日文私Watashi

  深究字源，


  人們隱瞞彼此的罪孽，假裝生活好好的


  刷了幾次

  讓我感觸最深的，卻是小久保壽人演那個強姦犯


  他是演員中身材練最好的

  在正式場合衣冠楚楚

  但身上有著被性侵的痕跡


  那麼

  他迫害主角們的動機

  也很明顯了


  他不甘心男一

  能夠在相同處境之下走出來

  甚至找到愛


  他強暴男二喜歡的男一

  逼迫男一社死

  甚至不惜激怒男二殺自己

  他已經在自毀的路上回不去了….


  偏偏，這是常人最容易陷入的情緒思路

  人們隱瞞彼此的罪孽，假裝生活好好的


  對比之下

  男一有勇氣報警，驗體液

  甚至帶男二逃出泥潭

  真是大勇潔凈之人




  --'
