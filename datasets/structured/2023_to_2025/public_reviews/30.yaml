title: '[新聞] 吉澤亮全裸亮相【電影版吸吸吸吸吸血鬼】'
content: '新聞網址：



  改編自人氣漫畫的年度瘋狂吸血鬼爆笑喜劇《電影版吸吸吸吸吸血鬼》，由近期在台灣票

  房破千萬的《國寶》男主角「吉澤亮」領銜主演，並將在本週五（11/7）於台灣歡樂獻映

  。他在日本憑藉《國寶》晉身「百億票房男星」之後，繼續在本片展現變色龍演技，於片

  中徹底解放肉體，瘋狂演繹中二吸血鬼「森蘭丸」。為了詮釋日本難得一見的吸血鬼角色

  ，他相當重視外型要貼近原作，並符合自己的身體線條，因此他自主對造型提出細緻要求

  ，從服裝、耳朵大小到頭髮長度都非常講究。由於他所飾演的吸血鬼，在漫畫中擁有結實

  身材，尤其角色在片中有多場澡堂泡澡戲，甚至還有大銀幕全裸演出，為了展現好身材，

  他特別增肌重訓，沒想到卻在片場看見飾演「肌肉腦老大」的關口Mandy後，被他一身健

  壯肌肉嚇到大喊：「簡直絕望！」兩大帥哥在片中狂秀肌肉，勢必讓觀眾眼睛大吃冰淇淋

  。值得一提的是，吉澤亮還在片中開口獻唱角色專屬歌曲，並花費多時練唱，更自爆「瘋

  狂破音」，但最終成品帥氣到讓他特別呼籲觀眾：「希望大家一定要仔細聽，這應該是我

  生涯中第一次唱歌唱得那麼性感！」





  《電影版吸吸吸吸吸血鬼》由憑藉《國寶》在日本晉升「百億票房男星」的吉澤亮領銜主

  演，他在片中脫胎換骨，徹底解放詮釋爆笑中二吸血鬼。為了演出日本難得一見的吸血鬼

  角色，他在角色塑造上分享道：「我一直很重視要盡量貼近原作人物的外觀，並尋找最適

  合自己身體線條的樣子。」因此自主對造型提出細緻要求，從服裝、妝容、耳朵大小到頭

  髮長度都十分講究地來回討論，並表示：「這次連髮型我都提出很細緻的要求，哪裡可以

  留長，哪裡應該再短一點，我都和化妝師一起調整細節才完成，服裝也很講究，光運動服

  大概就試了二十套吧！」



  由於他所飾演的「森蘭丸」，在漫畫中擁有結實好身材，片中他也有多場澡堂泡澡戲，甚

  至還要透過大銀幕全裸演出，為此他特地增肌重訓；沒想到抵達拍攝現場之後，看見飾演

  「肌肉腦老大」的肌肉男明星關口Mandy，立即被他一身健壯肌肉給嚇到，直呼：「蘭丸

  在原作中就已經是身材很好的角色了，我知道我必須保持身材，但當我看到關口的肌肉時

  …我顯得很瘦弱…簡直絕望！」他也開玩笑喊：「看起來有點悲傷呢！」兩人在戲外也時

  常討論健身話題，吉澤亮更喊話：「想成為少數能舉起100公斤的人之一！」





  由於《電影版吸吸吸吸吸血鬼》角色眾多，導演濱崎慎治為了讓他們的出場更加有趣，因

  此採用音樂劇或饒舌等音樂形式，將對該角色的說明融入歌曲當中。吉澤亮也為此開口獻

  唱角色專屬歌曲，更花費多時練唱，他回憶：「這首歌承載森蘭丸過去的人生與對李仁的

  情感，所以我很注意要用『森蘭丸』的聲音詮釋，包括呼喚名字的語氣與情緒。」一提到

  困難之處，他也自爆：「音太高了！我一邊唱，一邊覺得根本唱不上去，結果錄了好多次

  ，聲音破了又破，一直唱到我音上去為止，真的是相當艱難的錄音過程！」而歌曲成品的

  帥氣程度，也讓他特別向觀眾呼籲：「整首歌很帥，我很喜歡，但特別是唱到李仁的部分

  ，我充分表現森蘭丸對李仁血液的渴望。希望大家一定要仔細聽，這應該是我生涯中第一

  次唱歌唱得那麼性感！」



  這部戲劇張力炸裂、笑點無冷場，勇奪日本新片票房冠軍的爆笑喜劇《電影版吸吸吸吸吸

  血鬼》，即將在本週五（11/7）於台灣歡樂獻映。台灣片商也順勢公佈「戲院入場特典」

  ，只要在各影城開放販售日起，購買本片電影票乙張，即可憑電影票於11月7日起至原購

  票影城兌換領取「電影A3原文海報」乙張，數量有限，送完為止。本片劇情描述在澡堂「

  戀之湯」工作的森蘭丸（吉澤亮飾演），其實是一名活了450年的吸血鬼。為了追尋世上

  最稀有、最美味的「18歲處男之血」，他一邊默默守護著澡堂老闆的兒子李仁（板垣李光

  人飾演），一邊悄悄覬覦著他的血液。某天，蘭丸震驚地發現李仁竟對同班同學葵（原菜

  乃華飾演）一見鍾情！眼看李仁的童貞危在旦夕，蘭丸決定展開一場「不讓童貞失守」的

  作戰！沒想到，當蘭丸試圖說服葵時，竟意外被這位熱愛吸血鬼的少女倒追！就在情況急

  轉直下之際，誓言要獵殺吸血鬼的坂本（滿島真之介飾演），以及葵的肌肉猛男老哥弗蘭

  肯（關口Mandy飾演）也陸續登場，讓事態更加混亂。就在誤會接連不斷、戀愛局勢愈加

  失控的時候，蘭丸的宿敵，也是他同為吸血鬼的哥哥森長可（真榮田郷敦飾演），也正悄

  悄地逼近…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁

  及Threads專頁查詢。



  --'
