title: '[新聞] <電影版吸吸吸吸吸血鬼>吉澤亮讚板垣李光'
content: '新聞網址：



  由《靠北少女》導演濱崎慎治執導，改編人氣爆紅漫畫的年度吸血鬼爆笑喜劇《電影版吸

  吸吸吸吸血鬼》，即將在11月7日於台灣歡樂獻映。本片結合吸血鬼與校園純愛，由「美

  男小鮮肉」板垣李光人與「百億票房男星」吉澤亮共同主演，爆笑展開450歲吸血鬼守護

  「最美味童貞之血」的戀愛阻止大作戰。由於原作中的純情少年「李仁」，是原著漫畫家

  奧嶋寬雅以板垣李光人的形象命名，因此劇組一致認同必須請他演出，而得知此事的板垣

  李光人十分震驚，決定接演並直呼：「一生只有一次！」由於他所飾演的李仁，是深受吸

  血鬼「森蘭丸」寵愛的對象，加上演出的高中生角色年僅15歲，因此在演繹時，他不僅讓

  表情變化更豐富，竟還模仿起《哆啦A夢》裡的「大雄」一角。而在片中與擁有「國寶級

  美顏」吉澤亮共演的他，因為高還原李仁本尊，讓吉澤亮被他可愛到大讚；兩人不僅在片

  中膩歪演出，在開拍前也早就時常相約見面，戲裡戲外都展現出好感情。





  年度最瘋狂的真人吸血鬼愛情喜劇《電影版吸吸吸吸吸血鬼》，改編自人氣漫畫家奧嶋寬

  雅創作的同名爆紅漫畫，更還推出了動畫版。由於原作中被覬覦著「童貞之血」的純情少

  年「李仁」，正是奧嶋寬雅以新生代人氣演員板垣李光人為形象命名的角色，因此劇組一

  致認同必須請他來演出，導演濱崎慎治更表示：「這可以說是為他量身打造的角色！」當

  板垣李光人接到邀約、得知此事時，感到十分震驚，表示：「光是知道老師以我為形象來

  設計就已經很開心了，感覺這是一種命運，結果在真人版中還由我來演這個角色，對我來

  說是莫大的榮幸與幸福。」這也讓他決定接演並直呼：「這種事一生只有一次！」



  他所飾演的「李仁」，是深受450歲吸血鬼「森蘭丸」寵愛的15歲高中生，為了讓觀眾感

  受更加深刻，因此他在演繹上也有所不同：「由於他是森蘭丸極度寵愛的角色，我希望能

  讓觀眾也感受到這份心意，再加上角色是15歲高中生，以及考量到這部作品的風格和人物

  都十分鮮明，因此我刻意將表情變化放大了兩、三倍。」此外，他在片中因為要不斷呼喚

  森蘭丸的名字，因此他還特意模仿《哆啦A夢》裡大雄呼喊：「哆啦A夢～」的語氣來演出

  ，展現出角色依賴卻又純真可愛的魅力。





  《電影版吸吸吸吸吸血鬼》由板垣李光人與吉澤亮主演，組成高顏值CP。當回憶起他與擁

  有「國寶級美顏」的吉澤亮初次見面，板垣李光人就被他的高顏值震驚到忍不住猛誇：「

  真的像雕刻家精心雕出的藝術品！」並表示：「森蘭丸在原作中已經被描繪得非常美麗，

  我覺得能在三次元中毫無違和感地再現這份美，只有吉澤亮能辦到。尤其當我在演出李仁

  的過程中，他的存在不可或缺，將對李仁的愛完美傳達，也讓我演戲更加順利。」而當看

  到由板垣李光人詮釋的李仁時，吉澤亮也被他可愛到大讚：「他整個就是李仁本人啊！如

  果是其他人演的話，可能會覺得有點奇怪，但讓他來演卻超可愛！」值得一提的是，兩人

  不僅在片中膩歪演出，甚至早在開拍前就多次相約見面聚餐，拍攝現場也時常玩在一起，

  戲裡戲外都展現出好感情。



  這部戲劇張力炸裂、笑點無冷場，勇奪日本新片票房冠軍的爆笑喜劇《電影版吸吸吸吸吸

  血鬼》，即將在11月7日於台灣歡樂獻映。本片劇情描述在澡堂「戀之湯」工作的森蘭丸

  （吉澤亮飾演），其實是一名活了450年的吸血鬼。為了追尋世上最稀有、最美味的「18

  歲處男之血」，他一邊默默守護著澡堂老闆的兒子李仁（板垣李光人飾演），一邊悄悄覬

  覦著他的血液。某天，蘭丸震驚地發現李仁竟對同班同學葵（原菜乃華飾演）一見鍾情！

  眼看李仁的童貞危在旦夕，蘭丸決定展開一場「不讓童貞失守」的作戰！沒想到，當蘭丸

  試圖說服葵時，竟意外被這位熱愛吸血鬼的少女倒追！就在情況急轉直下之際，誓言要獵

  殺吸血鬼的坂本（滿島真之介飾演），以及葵的肌肉猛男老哥弗蘭肯（關口Mandy飾演）

  也陸續登場，讓事態更加混亂。就在誤會接連不斷、戀愛局勢愈加失控的時候，蘭丸的宿

  敵，也是他同為吸血鬼的哥哥森長可（真榮田郷敦飾演），也正悄悄地逼近…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁

  及Threads專頁查詢。



  --'
