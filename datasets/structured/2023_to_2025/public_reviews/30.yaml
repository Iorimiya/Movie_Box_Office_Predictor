title: '[情報] 電影版吸吸吸吸吸血鬼 11月7日激情四射'
content: '熱湯！熱血！熱戀！前所未見的青春愛情喜劇！


  【】




  11月7日激情四射




  ———   必看理由 ———


  童貞喪失？絕對禁止！


  年度最瘋狂吸血鬼爆笑喜劇火熱登場！


  改編自人氣漫畫家同名爆紅作品，勇奪日本新片票房冠軍！


  【】百億票房男星 全裸上陣，徹底解放，爆笑演繹中二吸血鬼！


  完美詮釋童貞系純情少年，與共組顏值爆表必看CP！


  化身吸血鬼控少女，純真外表 휠妄想腦內，魅力全面大爆發！


  ————— 劇情簡介  —————


  在澡堂「戀之湯」工作的（飾演），其實是一名活了450年的吸血鬼。


  為了追尋世上最稀有、最美味的「18歲處男之血」，他一邊默默守護著澡堂老闆的兒子李

  仁（飾演），一邊悄悄覬覦著他的血液。


  某天，蘭丸震驚地發現李仁竟對同班同學葵（飾演）一見鍾情！


  眼看李仁的童貞危在旦夕，蘭丸決定展開一場「不讓童貞失守」的作戰！


  沒想到，當蘭丸試圖說服葵時，竟意外被這位熱愛吸血鬼的少女倒追！


  就在情況急轉直下之際，誓言要獵殺吸血鬼的坂本（滿島真之介飾演），以及葵的肌肉猛

  男老哥弗蘭肯（關口Mandy飾演）也陸續登場，讓事態更加混亂。


  就在誤會接連不斷、戀愛局勢愈加失控的時候，蘭丸的宿敵，也是他同為吸血鬼的哥哥森

  長可（真榮田郷敦飾演），也悄悄地逼近…


  #漫改電影 #爆笑喜劇


  資料來源：


