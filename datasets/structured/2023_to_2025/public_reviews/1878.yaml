title: '[好雷] 彬與瑛'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  東寶持續力捧橫濱流星


  線，畫出的我 、 彬與瑛 都是不錯的片


  完全沒看過任何原著


  彬與瑛 體感上是比  七個會議、半澤直樹感人的


  還帶有點華麗一族的感覺 ?


  當然池井戶潤的作品 主角威能都開很大 這缺點倒是沒改善


  不過要講友情 銀行員價值觀衝突 這兩大塊就是很完整


  狗血但通俗


  場景精緻 高檔西裝滿場飛就不用說 大片廠的優勢


  基本上如果是有點興趣 猶豫要不要看 那就可以去看了


  應該至少能讓大部分人滿意


  --'
