content: "【重裝制裁】團隊打造動作鉅獻！\n\n泰隆艾格頓《我的殺手爸爸》\n\n\n\n8月8日(五) 全台上映\n\n  \n\n他，教會她如何生存；她，教會他什麼是愛。\n\
  \n\n\n愛倫坡獎得獎作品改編\n\n《重裝制裁》團隊打造動作鉅片\n\n《金牌特務》英國男星泰隆艾格頓自製自演\n\n\n內特（泰隆艾格頓 飾）出獄之後渴望能夠重新做人，但他在獄中招惹到的犯罪集團卻開\n\
  始追殺他的家人作為報復，內特被迫帶著關係疏遠的11歲女兒波莉（安娜蘇菲亞海格 飾\n）展開逃亡之旅，並設法向生性膽小的她傳授生存之道……。\n\n--"
