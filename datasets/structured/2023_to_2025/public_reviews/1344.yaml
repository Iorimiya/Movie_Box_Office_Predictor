url: https://www.ptt.cc/bbs/movie/M.1699006252.A.3D2.html
title: '[微雷] 萬聖劫 '
content: '放個預告片



  實際看完以後，不知道為何總有一種跑團感XD

  但是確實恐怖感十足，

  預告片整體氛圍和電影一致，

  所以如果看完預告片覺得還可以，想看的話，差不多會符合期待


  整體故事結構其實滿簡單的

  但是仍然有表線和裡線，

  表線是恐怖片的各種經典環節，

  裡線則是霸凌復仇線，然後我個人比較喜歡原片名Carousel

  也就是旋轉木馬的意思，

  同時也暗示著傷害他人的人，最終也必將被傷害。


  有一種循環旋轉的感覺

  翻譯成「萬聖劫」的確比較吸引人，

  而且因為限制在遊樂園空間中，

  整個其實反而會讓人想要去一下歌德堡的里瑟本遊樂園一趟XD


  我其實特別喜歡雲霄飛車升到頂點的那幕，

  隨即而來的未知恐怖感也鋪陳的相當到位，

  算是一部可以一看的小成本電影吧XD


  題外話，感覺這種片在台灣根本不可能拍XD

  差不多就是把知名景點＋兇殺兩者結合在一起的玩法ww


  --'
