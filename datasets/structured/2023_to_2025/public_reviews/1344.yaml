url: https://www.ptt.cc/bbs/movie/M.1698233851.A.BC6.html
title: '[好雷] 《萬聖劫》這麼應景的大麥克又回來了'
content: '我真的很喜歡在看完電影偷聽別人討論，就有人看完《萬聖劫》說，哇這也太《月光光心

  慌慌》了吧，姑且就稱這部《萬聖劫》是歐洲版的月光光其實也不為過。而且，這部還搭

  上了近期火熱的像是《怪物》或是《黑暗榮耀》之類的霸凌題材（涎鎮阿涎鎮~），但心

  中有另一個更噗哧的想法是，不會搞成這樣，遊樂場還不收場地清潔費吧？


  整體電影色調挺有復古懷舊感，這讓劇情更添詭異懸疑氣氛，更弔詭的是，遊樂場居然只

  有一個工作人員？劇情走向也挺有驚悚片的方程式，先是大夥玩得粉開心，接著被追得連

  滾帶爬，還有些黑色幽默，逗得全場大笑。最後兇手是誰，其實也蠻意外的。


  其實萬聖節到了，大人根本就快樂不起來，要想幫小孩子化什麼妝都來不及。但是若不想

  要跟別人撞衫，例如，韓劇《異能》的閃電俠或是裝萌的皮卡丘外，也許來點暗黑或hard

  core的調調也許也不賴（頂多就是小孩子不願意），若是抱著這種心態來看《萬聖劫》找

  靈感也是挺不錯？或者，像是《絕命終結站》開始設想劇中的角色會怎麼死的，會死幾個

  ，這種娛樂似乎都是上乘（？！）然後最後會發現，最好的安排就是萬聖節去看完《萬聖

  劫》後直接銜接天母「搞什麼鬼萬聖節嘉年華」再嗑個大麥克才是最應景的選擇。



  -----

  Sent from MeowPtt on my iPhone



  --'
