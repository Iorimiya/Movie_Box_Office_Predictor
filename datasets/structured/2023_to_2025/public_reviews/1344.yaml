url: https://www.ptt.cc/bbs/movie/M.1699436589.A.075.html
title: '[普雷] 應景萬聖劫的角色'
content: '誤交損友的關係，不看恐怖片的我總是定時會被拖出去強迫接受一下新的恐怖片 QQ

  這一次因為剛好遇到萬聖節，我們在完全沒有看過預告也沒查過資料的狀況下看了「萬聖

  劫」

  以下有雷，請斟酌觀看

  以過節氣氛來說確實是有達到效果的～


  故事其實架構很簡單也很好猜

  這邊想要特別提一下角色的設定跟背景故事

  以往對於這類恐怖片的印象都是很著重在營造氣氛跟製造懸疑感，這一步反而在這個部分

  的著墨較少，但對於角色的個性跟彼此之間的關係刻畫比較多


  一開始角色們登場的時候，我真的覺得珍妮是個超級雞掰人 XD

  對菲歐娜的敵意高到莫名其妙，而且就很有那種霸凌者的典型感（看到這邊的時候我還以

  為這些角色就會是如此平面）

  後來看一看才知道原來珍妮的男朋友以前是菲歐娜喜歡的對象，甚至珍妮跟丹特說「菲歐

  娜還喜歡你」的時候，丹特也沒有否認這件事

  突然覺得很理解為什麼會有這麼高的敵意

  看到這邊的時候我也覺得丹特可能有點渣，明明跟女朋友出來玩，還一直花時間跟心力關

  心喜歡自己的女生，真是莫名其妙

  他們在碰碰車外面聊天的時候我還想說最好第一個死的就是丹特 XD

  直到後面大家必須要兵分多路的時候，才終於感受到無論如何丹特都是把珍妮擺在第一位

  的

  結果剛感受不久他就掛了，氣死（？）


  最後想補一個，我覺得讓大家在很多危急時刻必須捨棄朋友的設計很老梗，但後續卻發現

  被自己捨棄的朋友根本沒事，並且在讓你知道這件事的時候才真的讓那位被捨棄過的朋友

  死掉，這部分真的很讚

  讓人無法再逃避的覺得當下的割捨也是沒辦法的，而是踏實的「對，就是你害本來不會死

  的人死的」感覺


  這部場次很少，但很值得看，不過不要看太晚的場，我看完之後去上廁所還是覺得很擔心

  門被砍爆 QQ


  --'
