title: '[普雷]  萬聖劫 遊樂園逃殺'
content: '有雷請小心觀看～


  很少上電影院看驚悚片，但有幸參加了特映會，便一個人前往觀影

  故事大概講述一群年輕人得到了搶先體驗夜間遊樂園的萬聖節活動，偶然遇到了在遊樂園工

  作的女主角費歐娜，而這些人從前是朋友關係，過去發生了一件事情導致他們鬧得不愉快，

  而他們前往的遊樂園也成了他們面對過往過錯的地獄樂園…




  個人覺得電影的步調比較慢，慢慢營造恐怖的氛圍，總覺得這幾個人會聚在一起事情一定不

  單純，而且他們總是避談著一件往事，在去年萬聖節，大家著裝打扮前往參加派對，在一片

  狂歡中，間接害死了一位女孩，而大家都宣稱是個意外！但即便有再多的不愉快，他們還是

  很享受夜間包場遊樂園的感覺，果真後來就出事了！突然出現了拿著斧頭的殺人魔，追著他

  們不放，而殺人魔戴著跟那死去女孩一樣的萬聖節面具…


  這部片子砍人噴血的鏡頭雖然沒到太多，但有幾幕是很血腥，在看電影的時候不時有觀眾會

  發出＂矮額＂聲，還有一些地方滿幽默的，有個女生超討厭的結果居然沒死，最後有點洗白

  的感覺，而犯人不難猜，不過沒猜到的是原來還有幫兇，這是滿意外的一點！



  --'
