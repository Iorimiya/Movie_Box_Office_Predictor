url: https://www.ptt.cc/bbs/movie/M.1699360199.A.6B7.html
title: '[普雷] 萬聖劫-小眾作品推薦'
content: '前情個人意見XD：雖然說台灣對於萬聖節這個節日沒有太大的參與感，大多是店家或者學校才會舉辦這類型的活動，但還是希望未來有一天，也能看到萬聖節當天每個人走上街頭跟街訪鄰居要糖果，順便說一聲Happy
  Halloween，剛好在美國讀書的朋友今年也有參與到這個節日，看著他們的服裝打扮，對他們或我們來說應該也算是另類的舒壓吧！



  過分隔線後開始會透露劇情，請小心服用！

  ------------------------------------------------------------------------------------




  萬聖劫這部片是來自瑞典的驚悚片，雖說是驚悚恐怖片，但是對第一次看瑞典片的我印象是蠻好的，因為裡面的演員也都太好看了吧！另外，雖然我個人沒看過月光光新慌慌，所以不知道大家為甚麼要一直拿這部片來比較，如果說美國走的是瘋狂殺戮的路線，那瑞典這位導演走得真的是小品，唯一的缺點就是片長有點小短，讓人意猶未盡(敲碗！！！)


  大多數人只了解北歐國家的監獄很爽，但其實北歐國家也有蠻多殺人魔的案例，所以看完這部片的時候其實也是有一點五味雜陳，原本想說可以看一個爽片度過假期，沒想到爽是爽到了，還多了一堂心靈課程，這部片是跟朋友一起去看的，朋友覺得可以當作好笑一筆帶過，但我個人又有一種灰濛濛的氣息壓在心頭吐不出來。


  電影中可以感受得到音樂和劇情節奏的變化，這部分必須要給導演一個讚，前面看的時候會覺得為甚麼費歐娜也在殺人魔的口袋名單裡，越到尾聲的時候越能理解劇情為甚麼是這樣鋪陳，不過這些俊男美女領便當的時候我竟然還為他們可惜了一下，看來顏值還是有一定的重要性，對於導演最後留的伏筆真的好期待，希望如我想的一樣會有續集，到時候絕對再去看！


  -----

  Sent from JPTT on my iPhone


  --'
