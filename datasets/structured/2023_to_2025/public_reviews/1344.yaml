url: https://www.ptt.cc/bbs/movie/M.1699460868.A.E57.html
title: '[普好雷] 《萬聖劫》怕什麼？萬聖節不就是大型試膽大會'
content: '來自瑞典的驚悚電影《萬聖劫》



  以萬聖節活動VIP之名，邀請了五個相互熟識的年輕人

  夜間只為他們而開的遊樂園，猶如包場一樣的爽快感

  為他們服務的園區人員，又這麼恰巧是多年前的”友人”

  這麼多的”巧合”，明知有人刻意邀請、請君入甕的洪門宴

  但生活總是任性、凡事肆意而為的他們根本不怕

  況且萬聖節不就是要大玩特玩？


  開心享樂的他們，遇上一個戴著面具、拿著斧頭的萬聖節怪人

  猜猜，最後有誰活下來？還是全部遭遇橫禍？



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  對我而言驚悚度夠，對於有些膽大的人或許是只是小菜

  過程很有意思

  遊樂園很大，遊樂設備多，能發想的駭人追殺手法也就很天馬行空


  驚悚片最重要的音效還不錯

  一進電影的派對音樂，很有萬聖節的歡娛氛圍

  帶著未知、迷離感，甚至有些興奮感

  增添一些驚悚音效在其中，馬上將我帶入看驚悚片的狀態


  劇情發展算是有可看性，有一點點像…推理電影

  一開始看似把謎底都給觀眾了

  反正不就是最熟悉遊樂園的兩人其中一人？

  但真相或許和你想的不一樣...…


  前期怪人根本開掛

  讓那些自以為是的年輕人們為求保命、毫無章法的四處逃竄

  中後期另一個熟悉遊樂場的人

  逐漸讓怪人現出漏洞與破綻，甚至覺得手法愈來愈顯得拙劣

  有時會納悶，憑著”他”就能完成這場復仇計畫？


  結局收的不錯，讓我一些腦中觀影疑問釋懷

  也埋了伏筆，或許賣座有打算做第二季吧？



  --'
