url: https://www.ptt.cc/bbs/movie/M.1698856115.A.942.html
title: '[好雷] 事出必有因、不是不報時候未到《萬聖劫》'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  1.影片名稱 : 萬聖劫

  2.觀影時間 : 10/29

  3.觀影地點 : 喜滿客影城絕色店

  4.觀影方式 : 自行購票


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  此區為發文防雷頁 可選擇性提供上列 1~4 資訊 或不提供亦可 觀影心得於分隔線下方發

  布即可



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  最近萬聖節也快到了，雖然這個國外的鬼節其實傳到台灣後因為文化的差異，


  不一定說很有共鳴，但就是剛好讓大家有個機會可以親友慶祝、開玩笑玩鬧一番～


  而且朋友最近也工作壓力很大，就一群人出來吃個萬聖節大餐順便看個驚悚電影紓壓一下

  ！



  其實我原本對於驚悚片是比較牴觸的……因為我本身共感度比較高，


  像《國定殺戮日》系列、《奪魂鋸》系列這種，起因都是單純享受殺戮快感的劇情，


  這種直接惡意的呈現……看過後我其實都會需要花一陣子才能讓心情比較平復些；


  不過《萬聖劫》這一部就明顯不屬於這種類型的了！


  選片時看了一下網站上的劇情簡介，貌似是因為一些舊怨才有了後續的一連串瘋狂殺戮行

  為。



  所以這次分享心得才會以＂事出必有因＂作為標題，


  雖然一開始更想要直接破題的說是因為＂校園霸凌＂而衍生的後續報復行為，


  但是這樣等同於直接在標題就爆雷了……所以還是放在內容再細細討論～




  在劇情的前因後果上簡單來說，


  之所以這一群年輕人會這麼＂湊巧＂的全都同時集中在這個樂園裡，


  就是因為當年這群人都與一場＂校園意外事故＂有所關聯，


  但與其說是意外，不如說是因為年輕人年輕氣盛，


  沒有思考到事情可能衍生的嚴重後果，自以為開了一些無傷大雅的玩笑、以為有趣，


  然而卻因此釀成了不可挽回的悲劇……



  且這緣由對於如果自己也有在校園中被同儕霸凌經驗的人來說，想必也會覺得相當憤慨！


  特別是其中有些加害者還不覺得這有什麼，認為當初的意外不關自己的事，


  一樣每天高高興興的嘻笑打鬧，甚至覺得之所以會發生這樣的悲劇，都是當事人自己活該

  ……


  這樣想想大概也很能夠理解，為什麼兇手要一步步的把這些年輕人逼到絕境，


  即便他們在臨死前懺悔求饒，也不肯手下留情。




  不過也因為這樣，其實對於主角們的心境也是讓人感到相當的矛盾！


  因為也不全然全部的事故關係人都是活得那麼心安理得的，


  像女主角跟男主角就是當年事件發生後，內心懷著愧疚感的人……


  女主角甚至因此影響了自己的正常生活，中途休學且看起來後續並不是過的很好。



  當然對於出事的當事人與其家屬來說，也不能說因為他們事後有懺悔、有受罪，


  就能夠將當年的惡意與所作所為都一筆勾銷……


  畢竟對於校園霸凌或是諸如這種在團體、社會中利用多數人欺壓事件的發生，


  我的觀點都是抱持著「未經他人苦，莫勸他人善」的立場，


  不是當事人就真的沒有資格決定該怎麼做比較好，


  那些嘴巴上喊著應該要原諒他人、放下一切什麼的……都著實有些偽善。



  但想想人確實也都年少輕狂過，也都多多少少幹過一些白癡事情、或者一些＂壞事＂，


  雖然有些人長大後也會意識到自己當年的錯誤，感到愧疚甚至主動願意向當年的人道歉或

  彌補，


  只是人也終究還是自私的，如果這個彌補需要用自己的人生與性命作為代價的話……


  或許有的人真的會因為被強烈的歉疚感壓到沒有了生存意志、願意以死贖罪，


  不過大多數人應該也不可能真的輕易兩手一攤，甘願讓對方捅死自己洩忿……



  這也可以讓人理解為什麼後來女主角開始選擇反擊，


  即便她清楚知道自己當年事件為什麼會覺得愧疚……也抱持著這個罪惡感確實過的並不好

  ；


  若觀眾是以一個＂私刑正義＂的角度上來看待這場虐殺，想必對後續發展會感到很不痛快

  ，


  甚至會覺得憑什麼女主角與另外一位態度上相當機歪的女生可以逃過一劫、甚至有被洗白

  的感覺？


  但也不難理解為什麼女主角會有這樣的心態轉變，其實都是赤裸裸的人性阿！




  雖然看完電影後感覺這種提醒真的是有些老掉牙……


  但真的很多可能會傷害到人的事情，特別是一些社會道德上已被歸類的壞事情，


  真的不要輕易去嘗試～有些玩笑也不要以為沒事、以為好玩、以為對方好欺負就亂開！


  想必近期大家也看了不少社會新聞都有那種路上一看不順眼就被砍、被毆的，


  因為自己一時興起、不理智的惡劣言行，要是遇到了狠人或是把對方逼急了，


  真的什麼都有可能發生……代價嚴重的就是自己或親友的命啊！


  時機歹歹，這年頭真的切記要謹言慎行～




  --'
