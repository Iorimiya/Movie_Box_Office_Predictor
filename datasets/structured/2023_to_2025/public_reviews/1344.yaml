url: https://www.ptt.cc/bbs/movie/M.1698984779.A.3D8.html
title: '[好雷] 《萬聖劫》：壞孩子只能醜哭討無糖吃'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  看完《萬聖劫》片尾字幕跑馬燈下的時候，

  腦袋只浮現了草東沒有派對的《大風吹》這首歌，請恕我唱一下：

  「哭啊 喊啊 叫你媽媽帶你去買玩具啊

  快 快拿到學校炫耀吧 孩子 交點朋友吧~」


  確實，交朋友是很重要的，而且還要交對朋友。《萬聖劫》是由瑞典導演西蒙桑德奎斯

  特 ( Simon Sandquist )所導，對岸翻成《游乐设尸》，似乎都在比誰比較有創意呵。既

  然是瑞典導演導的片，自然在歐洲拍片也是合情合理，而確實，這部拍攝的主要場景就是

  在歐洲數一數二大的遊樂園 -  瑞典的里瑟本遊樂園所拍攝( 看完應該會很想去玩?)，據

  導演說，他很想讓這部電影感覺像是一場史詩般的冒險！！這聽起來也太誘人。


  主要的演員沒有追歐洲片的應該都會很陌生，像是飾演女主角之一費歐娜(Fiona)的威爾

  瑪李登 ( Wilma Liden ) 或是男主角之一由Omar Rudberg 所飾演的丹堤 ( Dante )，戴

  著閃亮亮珍珠項鍊差點要把女主角比下去。但眼尖的我發現，在前導預告的留言居然有人

  說是為了Omar 而想看這部電影，害我八卦查了這位的來歷，原來Omar Rudberg 歐瑪·約

  書亞·魯德伯格是委內瑞拉的瑞典籍歌手兼演員，曾參加了TV4播出的瑞典達人秀第四季

  ，有人追歌唱節目有follow到他的嗎?


  首先，劇情的部分，倒是從頭到尾都沒有冷場。因為你知道，驚悚片就是慢慢的鋪陳。復

  古懷舊的調調如夢似幻但就很有讓懸疑感加分，開始費歐娜跟那群曾經是死黨的朋友們究

  竟是發生了什麼事？之前的那場萬聖節的party似乎是解開所有關鍵的線索。驚悚片好像

  都是開始十分歡樂，接下來就是噩夢的開始。在費歐娜的惡夢那段，我原本以為會出現像

  是佛萊迪一樣SS級的咒靈 ( 《咒術迴戰》看太多 )，沒有人覺得那惡魔很像曼威的猛毒

  嗎?結果出現的BOSS也沒讓人失望，簡直就是 《咒術迴戰》冥冥的真傳弟子，但為啥凶器

  是斧頭而不是槍搞得這麼累，這或許跟歐洲槍枝不合法有關？


  驚悚片的音效確實佔比十分重要，歐洲片細緻的地方也在此，導演在背景音樂或者是音效

  的部分處理得挺好，這也是覺得沒有冷場的原因之一。在音樂的薰陶之下，再加上棉花糖

  、爆米花、旋轉木馬等美好醉心放鬆的歡樂氛圍堆疊，很容易就讓人陷入劇中甜美愉快的

  陷阱，最後的反差點則在於「鬼屋」讓人又愛又恨的場景，破裂的糖瓷娃娃、醜小丑、棺

  材，以及神似《月光光心慌慌》的麥克邁爾斯登場，搞得觀眾又嚇又笑的，壞孩子真的只

  能醜哭又討無糖吃。只是最後不免要好奇的是，一個遊樂園只讓一個工作人員經營，鬼屋

  原本嚇人的工作人員也沒上工，這體驗也太落漆了，看完這部若覺得也有什麼bug，拜託

  也留言分享讓我知道唷~







  --------------------------------------------

  【當世界都在跟你說教】




  --'
