url: https://www.ptt.cc/bbs/movie/M.1698315701.A.D90.html
title: '[好雷] 《萬聖劫》：做壞事總得付出代價'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  以下有雷



  看了《萬聖劫》的試映片，讓我想起跟最近追的韓劇《7人的逃脫》，部分情節有些類似

  ，復仇的人會想方設法把他們聚集在一起，然後逐一報復。


  我覺得以劇情來說，這部片算是交代清楚，即使是以片段的回憶方式呈現。被害者的家屬

  不甘家人無辜受害，所以提早佈局，且利用自己對遊樂場的熟悉，來精心安排這個計畫。


  或許會有人覺得有些地方不合理，不過結局也做了部分解釋，畢竟這本來就不是一個人可

  以做到的。


  整部片的血腥程度以及緊張感，呈現的算是不錯，而這些被困在遊樂場中的這些「加害者

  」，在慢慢回想自己當初的所作所為後，也沒有一面倒地認輸，掙扎與反抗為這部電影也

  提供一些可看性。


  不然一直尖叫跟逃跑，等著被宰，看久了會覺得煩。


  我覺得這電影算是值得看，雖然不像絕命終結站這麼血腥跟戲劇化死法，不過驚悚效果算

  是還不錯的。




  --'
