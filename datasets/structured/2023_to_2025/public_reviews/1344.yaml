url: https://www.ptt.cc/bbs/movie/M.1699261384.A.174.html
title: '[普雷] 「萬聖劫」電影推薦'
content: '今年真的沒有甚麼片想看，排假也只有這陣子有空，就跟朋友隨機挑了一部電影觀看，雖然一開始看到片名想說又是大同小異的情節要出現了，但是看下去才發現好像真的有些不一樣哦！


  過分隔線後會提及劇情，請自行斟酌觀看

  ---------------------------------------------------


  以往看這類型的恐怖片往往會選擇鬼或者是靈體之類的電影，這樣才會有被嚇到的感覺，好像這樣才沒枉費我花錢去看電影。


  但是隨著年紀增長，覺得這種比較虛幻類的題材反而吸引不了我，可能是被長大後的社會壓迫吧，逼得看清了現實，導致我對於人或真實世界會發生之類的題材比較會有貼切感，也更能帶入自己進而去延伸其他的思想碰撞。


  如果要我定義萬聖劫是一部甚麼片，那我絕對會說他是對自我反省的一個好電影，我覺得大部分人應該都沒料到劇情會有這種反轉出現，有受害者、受害者家人、加害者，又甚至是旁觀者，大家都說時間能沖淡一切。


  但是這部片告訴你「不可能」，做錯事的人就是需要受到處罰，沒有人能僥倖逃過，我覺得在這短短的89分鐘，導演能放入這麼多東西已經很厲害了，就連黑暗榮耀都還需要出兩季才能講完所有內容。


  最後跟大家說片尾沒彩蛋，但是導演感覺想再出續集，希望大家不要錯過這部小品！

  -----

  Sent from JPTT on my iPhone


  --'
