url: https://www.ptt.cc/bbs/movie/M.1699079748.A.A34.html
title: '[  雷] 瑞典遊樂園的萬聖劫驚悚夜！'
content: "先說是看了海報，發現也是遊樂園的恐怖片，才想說那來看看好了，看完才覺得跟絕命終結\n站說像也不是，因為他們沒有像絕命用了那麼多血漿哈哈，而且這部主要是以復仇為主，也\n\
  就是都是人為的，所以說實話挺好猜到大家都是怎麼掛的XD（但是他那把斧頭也太利了吧，\n一砍就斷了欸）\n\n剛開頭的時候，我以為也是美國的電影，看完查了之後才發現是一部瑞典的恐怖電影。\n\
  \n主軸以一個遊樂園為背景，講述一群年輕人在萬聖節夜晚的驚魂體驗，這部的核心主要是一\n場復仇行動，雖然在剛開頭的時候，一起觀看的友人就直接猜到了誰是兇手了（對\
  \ 我一開頭\n就被雷到了哈哈）\n\n前半部分因為用故佈疑陣的方式進行，所以節奏感覺也比較慢，但後面開始喀擦人的時候，\n速度和緊張感就上來了。\n\n導演西蒙桑德奎斯特創造出一位新形態的面具殺手，同時結合了知名的里斯本遊樂園為背景\n\
  ，讓這部劇的整體性也更貼合年輕人的口味和訴求。\n\n這部可以算是一部典型的B級恐怖片吧，以獨特的北歐恐怖風格和萬聖節的主題為主，我這個\n超不愛在電影院看恐怖片的人，都可以全程睜眼看完，應該挺適合喜歡恐怖片和尋求不同於\n\
  美國風格的觀眾~\n \n\n--"
