  文化幣可以買書，看劇場，看電影等等


  但是所謂的電影只限定國片，


  雖然富都青年是吳慷仁主演的沒錯


  但其實是演員李心潔擔任監製的


  「馬來西亞」電影


  所以文化幣APP上面找不到富都青年很正常。


  不要再搞錯囉


