url: https://www.ptt.cc/bbs/movie/M.1701735773.A.4D3.html
title: '[極好雷] 全場爆哭的富都青年'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  先來無雷心得


  吳慷仁得獎真的實至名歸

  也如同前幾篇心得說到

  入圍片段真的只是前戲


  後面才是真正的演技大爆發

  從迷失安狄時就覺得陳澤耀很不錯

  這部也沒有讓我失望

  希望能多看到她的電影


  劇情轉折雖然是很多人詬病的地方

  但我覺得最後的處理已經算很好了

  瑕不掩瑜


  全場後段不論男女哭聲不斷

  也是人生中在電影院哭最慘的一次

  建議攜帶衛生紙


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  「這個世界永遠都在弱勢相殘

  但也只有弱勢能拯救弱勢」



  這是我看完的最大感想

  整部電影圍繞在馬來西亞名叫富都的地方

  在最繁華的城市隔壁就有最貧困的聚落

  不被這個社會承認的人做著這個社會不願做的工作

  聽了百靈果訪問吳跟陳的那集

  就知道吳真的做了很多功課，才能在一開始就讓觀眾相信他真的是「富都青年」

  不管是推車的手勢、殺雞的樣子

  都是一些微小的生活觀察

  也就是這些細節讓觀眾「入戲」


  回到上面那句話

  其實money姊跟青年們都是弱勢

  一個是心理性別不被社會承認、一個更是連身分證都沒有

  但卻還是願意在自己少少的資源裡為對方做許多事

  也是阿邦跟阿迪小時候、最一無所有的時候

  阿邦還是願意照顧他直到長大


  另外不知道是選片邏輯或是湊巧

  我看過的馬來西亞片有上映到台灣戲院的

  都有出現跨性別(且都是年紀稍長的)腳色

  從男兒王迷失安狄到富都青年

  （版友提醒男兒王是新加坡

  在一個思想審查嚴重的伊斯蘭國家

  竟然會容許這樣的元素不斷出現

  還滿令人訝異的



  ==================以下直接有劇情大雷===========再次防雷===========


  或許有人對於阿迪怎麼可能突然失手就殺死社工這個轉折不以為然

  但其實從犯罪學與心理學的角度

  當年輕人腦部尚未發育完全，或過早進入壓力大的職場致使腦部發生變化

  他們控制衝動的腦部區域比較弱

  連帶影響到他們應對憤怒情緒的攻擊力度(白話來說就是「金衝蹦」


  或許有人認為，社工明明就是要幫他，他幹嘛不知感恩攻擊社工?

  在許多情形下，因為過早獨立生活

  而培養出不輕易相信他人、社會連帶薄弱的情形

  是很常見的

  加上他們認為社工的幫助是無用的(只有阿邦相信)

  一但這個憤怒被點燃(導火線是找爸爸)

  就會出現戰鬥或逃避的情形(fight or flight)

  而阿迪選擇戰鬥(也就是攻擊)

  所以他直覺想到的攻擊方式其實是「強暴」


  跳出來一下

  其實有些性暴力的動機並非滿足性慾

  (看阿迪就知道了，沒有人會覺得他真的為了性慾而強暴社工吧?

  而是「暴力」

  只是這個暴力的展現方式是性


  跳回來

  但社工掙脫了、甚至反擊

  所以他只能繼續維持戰鬥狀態，也就更加強力道攻擊社工

  所以就失手殺死對方了(其實沒死但阿迪也不知道


  反映在日常社會中，其實就是為什麼+9多數是年輕人

  他們其實比較難判讀對方的情緒以及產生同理

  而可能產生許多「攻擊型」犯罪的行為

  例如走在路上就被罵「看三小」之類的

  當然不是要替他們的行為開脫

  只是要傳達每件事發生得背後都有原因


  離題了


  後段演技真的無話可說

  (另外其實我也有跟前幾篇心得一樣的困惑

  就是我一直以為導演在拍吃飯的鏡頭顯示少一個當初分給阿邦的咖哩勞工

  是指他被抓走了，沒想到其實不是or被放回來


  尤其是在法師跟阿邦講話的那段

  真的大爆哭

  法師是那麼有餘裕的人

  甚至有個專門的手語老師

  卻告訴好好活著、人都會死

  一個極端諷刺的場景


  法師的死跟阿邦的死是相同的嗎？

  一個代表著國家，一個代表著國家暴力的受害人

  死亡對他們來說是相同的嗎？


  我覺得導演最高明的地方就是其實阿邦真的是殺掉社工的人

  如果單純就是阿迪殺掉、阿邦頂罪，那不過就是膚淺的兄弟相挺片

  但站在觀眾視角

  最矛盾的是阿邦真的殺掉社工了

  那「殺人償命」不就是正確的觀念嗎？


  同時也呼應到法師說的「人都會死」

  社工死了

  阿邦用命償還

  那阿邦死了呢？片頭逃逸的勞工死了呢？

  這群青年的生活有受到改善嗎？政府有關注嗎？

  只不過是一次一次的除去社會上的「亂源」而已

  而永遠都會有更多人因此而死


  或許這是導演想要傳達的吧？或許讓我們好好想想死刑到底對這個社會的意義是甚麼

  (偷偷推八尺門的辯護人


  我覺得典獄長？或獄警?

  對阿邦說的話真的是很觸動人心

  「我知道你不是壞人」(或類似

  但阿邦真的殺掉社工了

  他還不是「壞人」嗎？

  或許觀眾可以好好思考到底「好人」跟壞人的差別是什麼


  阿邦是壞人嗎？還是社會體制是？

  阿迪是壞人嗎？



  另外，以後不敢吃水煮蛋了

  看到一次難過一次


  --

  啊啊謝謝你

  在社工家人眼裡阿邦就是壞人啊？

  感覺身兼多職

  真的.....重點是都是笑笑的....雞皮疙瘩都起來了

  她也有難處吧...她也是找到爸爸了

  盡力了

  我覺得應該是不知道欸

  可能是要讓阿迪心中充滿罪惡感？

  趕快去找爸爸拿身分證？

  嗯

  不是喔！他後面有脫掉假髮的時候

  跳舞那場戲也蠻多跨性別的啦

  （另外演員真的是男的'
