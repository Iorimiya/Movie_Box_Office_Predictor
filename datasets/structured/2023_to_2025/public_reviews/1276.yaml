title: '[新聞] 《富都青年》1天吸300萬 空降冠軍'
content: '新聞網址：

  吳慷仁金馬影帝效應！《富都青年》1天吸300萬「0台詞超狂」空降冠軍


  吳慷仁在電影《富都青年》飾演聾啞黑工，一句台詞都沒有，以精湛的手語拿下本屆金馬

  影帝。該片昨天（1日）在台上映，有金馬影帝加持果真不一樣，不少民眾衝進戲院「評

  價」他的演技，短短一天至今天下午光是台北就累積144萬元台幣，全台預估有300萬元台

  幣，踢走《拿破崙》勇奪票房冠軍。


  《富都青年》日前在沖繩環太平洋國際電影節榮獲最佳主演獎、評審團獎、觀眾票選獎，

  國際影展累計奪得12項大獎，吳慷仁憑藉著《富都青年》晉升金馬影帝，連導演李安都大

  讚吳慷仁：「太棒了，台灣有你這樣的演員。」


  監製李心潔、出品人光良的各界重量級好友亦熱烈支持，美聲天后許茹芸衷心地說：「慷

  仁真的實至名歸，好幾幕都讓我深深感動。」楊謹華大讚：「我知道的慷仁，他就是努力

  ！努力！不夠！再努力到最後一刻！我們才能看見他感人精湛的表演！實至名歸！恭喜！

  」實力派歌后周蕙讚演出精彩。曾和導演王禮霖合作《迷失安狄》的李李仁佩服：「真實

  的馬來西亞，深刻的兄弟情！」賴雅妍則笑說吳慷仁害她掉了一地英雄淚，總以硬漢形象

  登場的張再興落下男兒淚，張鈞甯、坤達、楊千霈、石知田、姚以緹、姚愛寗、歌手魏如

  昀也紛紛給出好評。《富都青年》在台上映中。






  --'
