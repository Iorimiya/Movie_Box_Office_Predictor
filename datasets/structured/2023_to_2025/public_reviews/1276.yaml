url: https://www.ptt.cc/bbs/movie/M.1702355626.A.4D1.html
title: '[討論] 富都青年吳慷仁的演技'
content: '網路上有在傳他在富都青年裡的演戲片段


  大家都在說他神演技什麼的


  但看完整部片後


  發現他的演出沒辦法讓我感動


  儘管他靠這部片拿了影帝，但表演充滿匠氣，斧鑿痕跡太明顯，看了有些尷尬


  用通俗的話講，就是有點類似演戲版的林志炫，


  唱當然很會唱，演當然很會演


  但就是精準的演繹機器，少了感動人心的真誠與煙火氣息


