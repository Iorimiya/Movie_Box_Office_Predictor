url: https://www.ptt.cc/bbs/movie/M.1701530399.A.D49.html
title: '[討論] 富都青年 好雷推薦'
content: "這是一部讓我無法呼吸的電影\n\n我不是馬來西亞人\n但裡面的故事\n著實不需懂任何語言\n就能被拉進去富都的市街裡\n\n當主角推著推車穿梭在\n\
  攤販市集中\n\n推車的叮叮聲\n與耳邊的助聽器\n讓我從此離不開主角的任何表情。\n\n故事是描述沒血緣的兩兄弟\n在社會邊緣的生活\n\n當我看完之後\n\
  更覺得是哥哥阿邦的故事\n\n就如同海報上\n吳慷仁（飾演哥哥）的臉是清晰\n而陳澤耀（飾演弟弟）是模糊的\n\n阿邦一直看著阿迪。\n\n我覺得\n他們像是一面鏡子\n\
  對於阿邦來說\n弟弟的身份認證是有未來的\n而且不像自己是個沒身分的瘖啞人士\n\n羨慕阿迪與寄託阿迪\n這個意象一直在我腦裡不斷的增長\n\n所以阿邦會比任何人都還要\n\
  認真謹慎的過日子\n只希望能在富都裡安分活著\n\n不過\n人生的意外總是有其軌道運行\n\n如果說阿邦的謹慎是想守護\n這個小小生活圈\n\n那阿迪的不安分\n\
  就是阿邦一直不願面對的現實\n\n能說逃避現實嗎？\n阿邦還是面對了自己\n但當由一個根本不認識自己背景的法師\n説「活著的時候 好好活著」\n\n他才會徹底爆發\n\
  \n他能說什麼呢？\n什麼都不能說\n\n只能放下\n\n阿邦面對用盡全力守護的鏡子\n在破碎之後\n還是能閃耀著光芒\n\n最後那道光芒\n讓曾經迷惘的弟弟走向另一個方向\n\
  一個阿邦此生嚮往但到不了的地方\n\n沈重，但非常溫柔。\n\n你會知道\n這世界上有人那麼認真\n卻還是充滿無奈\n連自己是誰都無法確認\n是要他怎麼好好生活\n\
  \n他無法，\n所以用盡全力讓自己活著\n得到的答案卻是從來不存在\n\n如果不存在就是答案本身呢？\n\n最後\n導演給的梳頭髮那場戲\n幫我心中建構出的阿邦\n\
  好好的說聲再見。\n\n後記\n\n1. 金馬入圍的15秒真的只是小菜而已\n2.這部片的攝影厲害，非常美\n3.建議聽完片尾曲 「一路以來」再離場\n   \
  \ 會幫忙緩和很多，踏實暖心\n\n4.其實吳慷仁說了好多話，我都聽到了。\n\n--"
