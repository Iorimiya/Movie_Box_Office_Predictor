title: '[好雷] 富都青年 演技畫面都精彩'
content: '~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~













  第一次看國際移工議題的電影，看得過程和看完後心情都非常沈重...

  在影院裡也聽到很多人在擤鼻涕的聲音

  吳慷仁飾演的聾啞人士讓人印象很深刻，但更喜歡阿迪和Money姊這兩個角色

  除了劇中演員們的精彩演技以外，這部電影畫面和色調也很好看

  很多顆鏡頭底下很有滿滿的人生無奈感，安靜無聲的時刻彷彿整個人生都靜止了

  尤其後面監獄的很多畫面，無助壓迫

  但又覺得疑似有一絲光線

  也因為這些畫面運鏡的關係，很可以跟著劇情和角色心境走

  在拍法上覺得很強

  劇情上對於兄弟情覺得很動人，相信這也是讓大家落淚的重要因素

  要敲最後一顆蛋的時候真的有心痛感

  總結來說，真的值得進電影院看大螢幕



  --'
