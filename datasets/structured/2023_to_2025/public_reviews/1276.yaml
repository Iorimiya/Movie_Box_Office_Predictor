title: '[請益] 富都青年片尾疑問'
content: '可能有雷


  這是防雷頁


  -


  -


  -


  弟弟最後探監的時候


  問哥哥怎麼沒戴助聽器


  哥哥表示壞了，而且這裡用不到


  他們開始比手語


  直到最後敲雞蛋環節


  弟弟實在敲不下去


  對哥哥說 以後換我做哥哥來保護你




  好的就是這個But


  前面都是比手語交談的


  怎麼到後面就可以...讀唇語了


  是因為聾啞人士本來就設定


  近距離的講話效果等同於有戴助聽器


  或其實所有聾啞人士都有讀唇語的能力


  還是說這真的是個BUG？


  --

  感謝解答！

  真沒有

  在工作上遇到聾啞人士

  我們都直接用紙筆交談

  從來沒有用過唇語...

  ：）'
