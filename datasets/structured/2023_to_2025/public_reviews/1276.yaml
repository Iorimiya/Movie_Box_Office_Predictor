url: https://www.ptt.cc/bbs/movie/M.1701572596.A.0D6.html
title: '[請益] 富都青年有雷問題'
content: "防～～～～\n雷～～～～\n-\n-\n-\n \n想問一個小問題\n我記得某次大臨檢結束後\n原本會分給阿邦咖喱的那位印度人(?)就消失了\n\
  導演特地拍了一幕他們原本吃飯的地方\n只是那個位置空了\n我以為是要呈現「即便是（對阿邦）友好善良的人，也會因為身份問題被抓而消失在旁人的\n生活裡」\n我記得時間序應該是這邊先，然後才是阿邦悶死佳恩那幕，因此好奇點就是那時候為什麼那\n\
  位印度人又出現了\n如果按時間序以及導演前段在大臨檢後呈現的畫面，他應該是被抓了才對\n佳恩死後兩個人應該就是不斷的逃跑，再到阿邦去自首，所以應該是沒記錯片段～吧qwq\n\
  -\n求解惑qwwwq\n \n--\n我個人對電影的認知是，每個重複的畫面都一定有它的含義或意義，就像有個說法是，如果\n鏡頭重複帶到一支手槍，那那發子彈就勢必會發射出去，只是不知道會打向誰（或是沒發射\n\
  出去，手槍本身也有它的存在意義）\n扯遠了～～只是覺得吃飯這個畫面有前後可以對比（有印度人跟沒印度人），很難覺得他沒\n有含義在啊><\n但還是沒有身分證不是嗎？！？！\
  \ 所以..抓了又被贖、贖了又被抓？（會被說政府在斂財?\n）\n我就是這樣想，如果說要表現他自己吃飯，一開始其實就有了，中間插入了印度人的友好分\n食（也凸顯阿邦窮困的每餐都吃麵包），後面特地再有這個空景，很難讓人沒有聯想\n\
  也因此更覺得這邊人都不見了，怎麼又會來說要來給香料呢><?\n（不過如果是剪接問題的話，我個人覺得這bug 蠻大的-口-）\n謝樓上兩位大大的認同XD  希望能獲得合理解釋qwq\
  \ 不然會好糾結啊～～\n \n\n我也覺得是bug，但覺得這bug有點大，剪輯後大家應該會一起觀看順一遍（嗎？），有點難\n想像沒有發現就這樣上了><\n原來如此，還有被抓後短期內不會被抓的這個潛規則！\n\
  大家都有一樣的感受XD\n那也代表這畫面很成功:D\n對呀！這個畫面其實隱晦的很棒，但前提要是導演的確想傳達印度人被抓了這件事\n沒錯，我也不愛這個反轉，但我覺得某種層面上可能是需要這樣的「正當性」；如果真的是\n\
  阿邦背，應該會有一派也沒辦法接受：為什麼是殺人兇手去過著「正常有身分證的人」的生\n活？ 為什麼是犧牲阿邦的善良去導正阿迪走回正軌？\n而阿邦還是瘖啞人士，如果真的讓他背，可能會有傳達「因為是瘖啞人士，既然翻不了身，\n\
  那被犧牲也剛好（即便阿邦是自願）」這種感覺，在這個前提下雖然反轉很老派我也不愛，\n但卻認為這個走向有比背黑鍋而死好一點。"
