title: '[新聞] 《富都青年》賣破4000萬凱旋歸國！金馬影'
content: '新聞網址：


  《富都青年》賣破4000萬凱旋歸國！金馬影帝吳慷仁：我從影以來的轉捩點


  2023-12-11 16:59 自由時報電子報 記者廖俐惠


  電影《富都青年》在台僅上映短短10天，全台累計票房飆破4000萬，第二週週末票房相較

  首週末不降反升，多了16%的票房，榮登滿座率最高的電影。


  《富都青年》導演王禮霖上週六帶著監製李心潔、吳慷仁、陳澤耀回到馬來西亞舉辦首映

  ，金馬影帝的吳慷仁吐露心聲：「導演帶著電影繞了世界一週，拿了很多獎。雖然導演還

  是很低調，但即便我不是大馬人，也能感受這次《富都青年》凱旋歸國的氣氛。這也是我

  從影以來的轉捩點，更是馬來西亞值得驕傲的電影，希望大家一定要多多支持。」強調在

  片中可以感受到導演對馬來西亞的愛。


  對於電影在台灣上映獲得好成績，導演王禮霖心情激昂：「那天聽到票房拿到第一時，都

  流了兩滴淚。」對於電影終於回到馬來西亞正式上映，導演王禮霖說：「心情很期待，畢

  竟這部片是在說馬來西亞這個我們生長地方的故事，除了巡禮場和套票銷售成績好，其中

  有一家電影院首次嘗試做國片預售票，沒想到馬上就完售，映前的觀眾反應也非常熱烈，

  希望能擴散到不同族群。」


  監製李心潔也表示：「在外奔波那麼長時間，在外地有獎項肯定，台灣票房很好，現在心

  情特別激動，更希望我們付出的努力可以讓馬來西亞觀眾支持本地電影，這幾天映後有遇

  到觀眾和台灣觀眾一樣深深被觸動、很投入，說會二刷、三刷！」更透露現場還有台灣觀

  眾、各地馬來西亞留學生特別飛到馬來西亞支持，從20多歲到60歲的觀眾都陸續被圈粉，

  影迷不分年齡和種族，在馬來西亞成功掀起轟動。


  片中飾演弟弟阿迪的陳澤耀和吳慷仁對手戲極多，演技卻絲毫不遜色，出色表現讓他在台

  知名度大躍升，其實陳澤耀在馬來西亞早已家喻戶曉，帶著好成績回到馬來西亞，陳澤耀

  感動地說：「阿邦、阿迪終於回到家了，很多觀眾朋友喜歡、踴躍分享觀後心情，有一些

  人看完電影才知道原來馬來西亞有這個外籍移工的身份問題，也有人說《富都青年》是馬

  來西亞最好的驕傲，給我們非常多鼓勵。」電影《富都青年》現正熱映中。


  --'
