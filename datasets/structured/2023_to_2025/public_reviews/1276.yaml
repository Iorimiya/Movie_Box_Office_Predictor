url: https://www.ptt.cc/bbs/movie/M.1706710810.A.816.html
title: '[新聞] 吳慷仁成為億萬影帝了 「富都青年」64天'
content: '新聞網址：


  吳慷仁成為億萬影帝了 「富都青年」64天正式破億


  2024-01-31 聯合新聞網 聯合報記者 陳建嘉 即時報導


  吳慷仁主演馬來西亞電影「富都青年」在台上映64天今（31）日正式宣布票房破億，成為

  首部在台破億的馬來西亞電影，連帶讓吳慷仁成為「億級影帝」，還有首度擔任監製的金

  馬影后李心潔成為億萬監製，導演王禮霖第一次擔任電影長片導演就加入「破億俱樂部」。


  吳慷仁對此開心表示：「謝謝『富都青年』帶我渡過難忘的拍攝，謝謝觀眾給了美好的回

  憶，謝謝給予富都青年鼓勵的台前幕後，期待未來的任何一部電影都能更踏實前進。」李

  心潔也感動地說：「台灣觀眾對『富都青年』的支持和愛戴，讓『富都青年』這部馬來西

  亞電影在台灣創造了一個票房的奇蹟，讓整個幕前幕後團隊的努力都獲得了巨大的鼓勵和

  肯定，也讓我們繼續製作好電影的心更堅定。這份感激銘記在心，謝謝。作為監製，我為

  我的團隊感到驕傲!」


  導演王禮霖過去多以監製身份參與電影製作，第一次擔任電影長片就創佳績也充滿感恩心

  情：「確實不容易，『富都青年』是一部受到祝福與愛的電影，我會銘記這一路以來的每

  一個你～感恩非常！」


  片中飾演弟弟阿迪的陳澤耀因「富都青年」大大打開知名度，坦言仍對因電影跑遍各地宣

  傳、參加影展而備感不可思議，得知台灣票房破億後，直說想念台灣熱情粉絲：「好想立

  刻飛到台灣和大家一起慶祝！因為影迷們的喜歡和支持，帶給了富都團隊最棒的禮物。心

  情真的好激動喔！現在好想衝去富都吃個當地美食來平復一下心情。」更感謝導演兼經紀

  人王禮霖的信任，以及戲裡戲外都宛如哥哥的吳慷仁照顧。


  而為慶祝「富都青年」票房破億，以及回饋所有支持電影的粉絲，今也宣布「富都青年」

  專屬商城即將於2月開站，「富都兄弟」阿邦、阿迪、Money姊的Q版人物設計首度亮相，

  多款周邊商品將限量發售，更多資訊請上甲上娛樂官方臉書粉絲團查詢。


  --'
