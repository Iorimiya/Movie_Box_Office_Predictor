title: '[負雷] 富都青年 這什麼答辯片'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  = =


  劇本編排超爛的八


  故事都說不好 開頭先演弟弟詐騙別人


  然後再演到兩人生活情況


  然後佳恩意外 哥哥自首


  節奏編排很差


  雖然我知道導演想表達的是馬來西亞底層人民的處境


  但就是


  整部片演出來讓我很想睡


  一小段高潮後又平淡下來


  一段插曲後又平淡下來



  吳的演技堪稱你島李奧納多 用力到要從螢幕跑出來惹


  然後為啥他沒跟弟弟講明真相


  靠北


  那他弟不就一輩子帶著愧疚活下去


  ???????????????????????


  看完之後旁邊推薦我寄生上流


  平平都是講底層的故事


  一放在一起 富都直接被公開處刑


  太苦了


  --'
