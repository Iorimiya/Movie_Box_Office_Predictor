content: "防雷 防雷\n\n\n\n\n一對沒有血緣關係的兄弟\n阿邦 阿迪 （在馬來語就是哥哥 弟弟的意思）\n從小因為沒有某些問題拿不到IC（身份證）\n\
  無法在馬來西亞社會上正當的生活著\n\n\n\n劇中最令人不捨的就是吳慷仁飾演的哥哥阿邦\n\n明明就是一個那麼好、善良的人\n就因為沒有國籍，一直生活在社會底層\n\
  也就因為沒有國籍，才意外犯下不能挽回的錯誤\n\n\n獄中三場會客的戲是電影最精華的部分\n不用台詞，光是看阿邦的神情與手語表現\n一定就讓觀眾們淚流不止了\n\
  \n\n吳慷仁這座金馬影帝絕對是實至名歸\n \n\n--"
