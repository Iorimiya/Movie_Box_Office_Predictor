title: '[討論] 富都青年提問'
content: '整部劇的節奏、色調真的很厲害。


  看完有兩個問題

  以下有雷


  1、阿邦既然知道社工活著，為什麼不讓她發出聲音？以他前面對社工的好感，以及他的

  仁慈，應該會想要趕快找咖哩好友救他不是嗎？這樣弟弟就算有罪，也不會真的太嚴重。

  就算他真的想死，也不會犧牲這個社工吧？


  2、到最後阿邦還是沒有揭露真正的兇手，所以打算讓阿迪愧疚一輩子嗎？阿迪後來好像

  也覺得阿邦為他死這一點不是很重要了，還是他就真的怕死？


