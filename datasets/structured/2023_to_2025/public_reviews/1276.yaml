url: https://www.ptt.cc/bbs/movie/M.1706629027.A.E82.html
title: '[新聞] 《富都青年》導演新作《沙央》期待新方案'
content: "《富都青年》導演新作《沙央》期待新方案\n\n舊版方案被拒\n\n04:10 2024/01/30 中國時報 李承陽\n\n\n王禮霖過去是跨國合拍的監製，因為《富都青年》首次擔綱導演。（資料照片）\n\
  \n文策院近日推出「國際合作投資方案2.0」，引起影視產業多方激論，上周文策院舉行多\n場說明會，與業者面對面直球溝通，其中馬來西亞導演王禮霖曾帶著熱賣電影《富都青年\n\
  》投案「國際合作投資方案1.0」未果，人在馬來西亞的他，上周與文策院董事長蔡嘉駿\n、院長盧俊偉舉行視訊會議，表示將會再嘗試投案新版2.0。\n\n雖然過去未獲得文策院青睞投資，但王禮霖認為文策院主動跟大家聯繫是好事，「我們創\n\
  作端不可能單打獨鬥，需要大家幫忙，所以我們很珍惜任何合作機會。」視訊會議上，他\n把投案《富都青年》遇到的行政流程問題跟文策院兩位長官討論，也聽了新版的作法，有\n\
  感文策院確實有心改變、有理想的改進，得知改革勢在必行。\n\n王禮霖也強調：「上周說明會解釋了改版後的作法，可是講再多都是紙上談兵，對我而言\n就是送案，我們一起檢查新版國際合作投資方案能否更快更便捷，已經是過去式的就過了\n\
  ，我們必須要繼續往下走。」過完年後他將投遞自己擔綱監製的新片案《沙央》。\n\n《沙央》和《富都青年》一樣是台馬合製，已獲金馬創投跟優良劇本獎的肯定，除了王禮\n\
  霖還有另1位億萬監製葉如芬把關，劇情講述馬來西亞地方上的故事，電影拍攝主創團有\n台灣工作人員，後期製作也會交給台灣團隊來操刀。\n\n#文策院 #馬來西亞 #說明會\
  \ #富都 #國際合作\n\n--\n佛法的\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
