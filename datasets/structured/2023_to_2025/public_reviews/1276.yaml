url: https://www.ptt.cc/bbs/movie/M.1702431545.A.FE1.html
title: '[雷] 旺卡/富都青年/老狐狸/年少日記'
content: '懶人包：

  《年少日記》>>《老狐狸》≒《富都青年》>《旺卡》


  昨天又看了一天電影馬拉松，私心覺得《年少日記》真的太頂了。


  《旺卡》

  想看甜茶盛世美顏的人或是對美恐有興趣的人可以入場觀看，這也是四部電影中我覺得大

  螢幕跟串流體驗起來必定會有巨大落差的一部電影，所以想輕鬆休閒的爆米花電影建議這

  部吧。因為看過前傳的原作和電影，所以對於原作中某些段落沒交代的事抱有期待，但很

  遺憾還是沒有特別仔細描寫，但總體也不會影響劇情啦。也是一部沒看過本傳電影的也可

  以放心入場的電影。需要特別注意大概只有不喜《悲慘世界》或是寶萊塢式電影的人可能

  斟酌入場，但甜茶盛世美顏真的太香了。


  爽度：●●●◎○

  精彩度：●●◎○○

  背景知識：◎○○○○

  影院觀賞推薦度：●●●●●


  《富都青年》

  吳慷仁演技真頂跟他對戲的馬來西亞演員陳澤耀演技也很棒，起初看標題和封面以為是兩

  個底層韭菜在台北的移工電影。但電影背景是設定在馬來西亞，所以在觀影前建議還是要

  有心理準備這是一部以馬來西亞政治背景下設定的電影。如果喜歡《小偷家族》之類電影

  的可以入場。如果是理想是想看像《八尺門的辯護人》或是《查無此心》影視劇的人可能

  會有點失望。還有不要在搞每周換一款海報的促銷了啦，錢包大受打擊。


  背景知識：馬來西亞移工政策與問題、半山芭、阿瓜（PONDAN)

  如果想要有較好的觀影體驗，可以先把上面幾個關鍵字先簡單看一下，可以更好的進入到

  劇情。


  爽度：●●●○○

  精彩度：●●●○○

  背景知識：●●◎○○

  影院觀賞推薦度：●●◎○○


  《老狐狸》

  80後、90後跟喜歡那個時代的人會有共感的電影，童星表現十分亮眼(個人覺得該部童星

  演技略勝《年少日記》一籌)，是一部以台灣淹腳目後期時代背影描寫的電影，對照到現

  在依然可以看到那個時代遺留下到現在的問題(但非重點)。還有劉冠廷的盛世美顏可以用

  大屏幕看真的太幸福了，基本上冠廷粉可以無腦入場。喜歡思考人性類型電影的人也可以

  入。


  背景知識：1990年台灣股災


  爽度：●●●◎○

  精彩度：●●●◎○

  背景知識：●●○○○

  影院觀賞推薦度：●●●◎○



  《年少日記》

  淚推，有機會一定要去看，感謝光年映畫代理進來，感謝版友熱情發文推薦，感謝花蓮鐵

  道電影院在東部上映。童星很可愛，背景是設定在香港，整部片是以粵語發音。相信華人

  看這部電影都會有共感，如果你是身心科病友那這部片可以說是為我們拍的。很喜歡各種

  細節的處理，不會太多也不會太少，還有令人為之一亮、為之讚嘆的點睛之筆。總之，很

  頂，很推。其中有一個特別被框起來粵語用詞我有問看過的香港朋友，但覺得還是沒討論

  出答案就沒列在背景知識裡了，大致上也不會影響到整體觀影體驗。


  背景知識：香港大學、華沙中學、海盜的英文

  爽度：●●●○○

  精彩度：●●●●●

  背景知識：◎○○○○

  影院觀賞推薦度：●●●●○

  好想入手海報程度：●●●●● （  私訊光年映畫已經售罄了Q▽Q  ）



  以上心得純屬個人感想，如果任何疑義，一切由你個人感想為準。


  --

  是的就是那個詞，我一直記成”整”，原來是”嚇”。感謝解答。


  哈哈 因為家裡離電影院很遠，所以經常一次看很多部。

  那場真的全場都能聽到此起彼落的擤鼻子的聲音，太好哭了。

  年少日記真的是被版上很多文章推去看的，大感謝！（金馬60真D讚，開幕短片也很有創

  意！）

  我和朋友有討論過串流和影廳，他的想法蠻特別他說有些片他想看仔細就會等串流因為可

  以拉回去。我就說你可以陪我多刷。（智商不足刷了4次天能的我的發言。）

  感謝補正，表現真的是穠纖合度。

  淚推！

  確實

  讚

  昨天看沒有場，剛剛看留言有場了，會去補的！

  片商…真的…好讚…

  QQ 準備去二刷

  怎麼是道歉啦，電影版本來就是相互討論補正，我也記不太清楚XD

  沒有電影院QQ

  版上神人多

  有機會來看看啊！電影票是以舊式火車票設計，有厚度值得蒐藏，可以紀念可當書籤，快

  去追他們IG!

  年少好頂QQ

  前天看還沒上，今天竟然上了！安排上！

  謝謝大大熱心協助…但有緣無份QQ


  家裡真的離電影院太遠，覺得一次看多部也有看到很多不同電影表現手法、觀點。像昨天

  完全被四個國家gank ，真的是意料之外的驚喜！當然一次看一部也很享受啦！'
