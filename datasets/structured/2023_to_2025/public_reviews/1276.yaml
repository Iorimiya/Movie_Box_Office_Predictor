  \ Khor) 博朗·帕拉雷\n\n沒有公民身份證的阿邦（吳慷仁飾）和阿迪（陳澤耀飾），在混雜外勞聚居的富都巴剎老\n社區裡勉強維生。他們無法享有一般國民福利，無法申請護照，連銀行戶頭也開不了。哥\n\
  哥阿邦天生聽損，任勞任怨也認命，只求一份安定生活，弟弟阿迪則不甘向命運低頭，從\n而違法販賣假證件，他一心只想賺到錢就帶著哥哥離開這個厭惡的地方。原本就過著不平\n\
  等生活的兩人，因為社工佳恩（林宣妤飾）的熱心，並自願協助追查原生父母和出生證明\n的資料，但她的好意卻導致一場意外發生，同時也讓阿邦跟阿迪再次陷入水深火熱的命途\n\
