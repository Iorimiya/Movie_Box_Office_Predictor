url: https://www.ptt.cc/bbs/movie/M.1702136026.A.542.html
title: '[新聞] 《富都青年》票房旺 陳澤耀羞成同志天菜'
content: "《富都青年》票房旺 陳澤耀羞成同志天菜\n\n04:10 2023/12/09 中國時報 孫伊萱\n\n\n陳澤耀（右）與導演王禮霖8日受訪時重現片中的「額頭敲雞蛋」橋段。\n\
  （甲上娛樂提供）\n\n吳慷仁以主演的《富都青年》獲金馬影帝，新片在台上映1周，票房突破2500萬，刷新星\n馬電影在台上映紀錄，片中也表現亮眼的陳澤耀，8日和導演王禮霖受訪，提及因該片成\n\
  為新一代同志天菜，讓他受寵若驚，害羞說：「確實發現多了很多男粉絲追蹤，原來我也\n可以是同志天菜，不過我的初衷就是把戲演好。」\n\n陳澤耀坦言，此片受關注，多了一些工作邀約，之後演藝重心也會放在台灣，「我在馬來\n\
  西亞出道15年了，想走出舒適圈」，笑說目前尚未接到BL題材，但很樂意嘗試，現場有人\n提曾敬驊當搭檔人選，但導演王禮霖說，「我比較想看你跟傅孟柏」，陳澤耀笑稱：「但\n\
  他太高了，我親不到欸，我會吻到他下巴。」\n\n陳澤耀也感謝老婆雲鎂鑫愛相隨，陪著他兩邊跑，小兩口還抽空去九份玩，對於生小孩一\n事則隨緣，「我太太也是越野馬拉松跑者，如果懷孕就得先暫停訓練，看緣分吧。」王禮\n\
  霖笑虧：「跑步都太累了，怎麼做小朋友？」\n\n至於票房公約，導演王禮霖承諾若衝到5000萬，便邀影迷一起重現片中感人的互敲水煮蛋\n場面，若8000萬，主演群會再度重現片中的舞蹈橋段。\n\
  \n#同志天菜 #富都 #上映 #重現 #片中\n\n--\n佛法的\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\
  \n\n--"
