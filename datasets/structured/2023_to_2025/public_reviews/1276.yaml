title: '[  雷] 富都青年'
content: '防雷










































































  前陣子有造成一些話題,對吳慷仁也有好感

  加上題材還不錯,自然就默默看了一遭

  看完了對他的感覺有點複雜

  一方面覺得情感和各種描寫是真摯的

  一方面覺得有些發展讓人看的不太喜歡

  沒錯,就是被很多人詬病的社工命案

  我自己也不怎麼喜歡這個安排

  這是本片最重大的事件,卻沒有對他合適的歡迎

  所以這樣突然的造訪嚇到了不少觀眾

  也許以在底層掙扎的心境會有這種動機很正常

  這樣做還是損壞了一些情感能更飽滿的時刻

  當然後面的各種場合還是真摯動人

  吳慷仁對於情感的掌握非常出色

  我尤其喜歡兄弟跳舞的那個段落

  配上很棒的音樂,氣氛甚至有幾分曖昧

  也許在這麼多情緒被壓制的兩小時裡

  會出現任何的情感都不意外吧

  畢竟所有人都是這麼求生不得,求死不能

  就算劇情安排的不盡理想,還是個值得細細品味的電影

  看看這些掙扎的人們是怎麼跟殘酷的現實抗爭

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  我們不應該流淚，那對內心來說，等於是身體的敗北。

  那只是證明了我們擁有心這件事根本就是多餘的


  --'
