title: 'Re: [討論] 富都青年吳慷仁的演技'
content: '原PO提到精準的演繹機器 其實我今天看完也有這樣的感覺 但我對於這樣的感覺

  認為是正向的 這部完全可以看出吳慷仁的真本事



  我不太確定是不是很多人都把角色激動的神情都當成是演的用力



  但就我所知道的 看過的 聽障人士 他們的表現其實跟吳慷仁在戲中的角色

  是十分接近的


  吳慷仁真的把細節演繹得很好



  例如 當比到激動的時候 他們的喉嚨會不由自主的發出聲音

  因為聽障人士 只是因為聽不到 所以不太會發音 但他們發聲是正常的


  這也是為什麼 阿邦在獄中和大師見面的時候 還是能發出我想死的近似音

  因為他們能讀唇 能大概捉摸怎麼發音 但就這句我想死 你不能發出正確的音


  就變成似是而非 而這就是難度



  但真正讓我覺得吳是演繹機器的地方是 他在獄中見到年少的自己在幫自己梳頭

  我知道接下來他要掉淚了 而他那掉淚的時間點 正好是我覺得最完美的時候

  當下真的讓我佩服 他就剛好在那個情緒的累積下落淚 太精準了




  我不知道 吳慷仁在這部戲 有哪邊會讓人認為他情感表現得太過

  我自己看完的感覺 是心情雖然糟糕 但整部戲是流暢的毫無冷場的 吳慷仁的表現是傑出




  至少我是很高興我有看完這部電影


  --'
