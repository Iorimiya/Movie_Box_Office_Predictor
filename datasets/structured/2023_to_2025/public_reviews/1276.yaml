title: '[雷] 哭到爆的富都青年'
content: '從沒想過會在電影院泣不成聲


  知道吳慷仁拿今年影帝後就立刻買了第一天的票


  果不其然


  真的實至名歸


  金馬獎後李安對他說他習慣演得太用力


  可是配上瘖啞人士的角色卻又恰到好處


  在看這部片之前


  一直覺得最佳男主是周處除三害的阮經天


  阮在周片的表現真的打破他以往的既定印象


  但是在富片的吳慷仁前


  真的只能讓賢


  我無法想像阿邦這個角色如果讓其他演員來演譯


  會是什麼效果


  這個角色、這個劇本對吳來說


  就像是魚幫水 水幫魚一樣


  不僅如此


  劇中的細節做得非常細膩


  對大馬底層社會的刻畫也非常深入


  完美地把觀眾帶到馬來西亞


  帶到劇中主角們的身邊


  讓觀眾們隨著劇中的喜怒哀樂情緒起伏


  一幕幕不斷堆疊的情緒在最後終於潰堤


  只是在電影院中無法放聲宣洩


  但是整場觀眾也被這悲淒的氛圍擁簇


  壓抑著啜泣的哽咽聲此起彼落


  霧氣也爬滿了我的眼鏡


  雖然是小人物的故事


  但故事卻不小


  感謝富都青年的全體劇組


  讓我有一場非常完美的觀影體驗


  --



  不好意思我把雷的部分砍掉


  **** 12/03 00:37

  抱歉有雷先砍'
