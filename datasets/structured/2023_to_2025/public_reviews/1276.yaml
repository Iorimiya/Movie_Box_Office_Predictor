title: 'Re: [討論] 富都青年吳慷仁的演技'
content: '抱歉我覺得演得非常好


  你想像一下


  你身邊的聾啞人士是怎麼表達情緒和肢體語言的


  過去我根本不認識吳慷仁

  只是聽過這個名字而已


  這次衝著金馬影帝去看

  我佩服至極 他這是200%的表演難度 至少完成了80%的表演分數 不拿影帝 還有誰拿


  而且即便是無法言語 他的表演層次還是非常到位


  進監牢前 阿邦是卑微的

  懦弱的 逆來順受的

  向命運屈服的 所以他的眼神

  無助黯淡 他只是活著而已

  人生的目標只有幫弟弟取得身份證而已 愛情不敢爭取

  諸多不公不敢反抗 人生只有不斷的閃躲


  進監牢後 他無力的坐著

  但感覺卻是心安的

  眼神開始有光

  因為他終於不用躲了

  不用怕了 然後他把人生的諸多不公平 不正義 一口氣爆發在和尚面前 那一刻很有寄生上

  流的fu


  我試過 學阿邦講出那句我想死 但怎麼都學不來那個語調跟感覺


  你說他匠氣十足 確實他是在模仿 但模仿一個聾啞人士到讓你覺得很匠氣


  這不就是最大的成功嗎？


  --

  如果吳的對手是梁朝偉 桃姐的華神他不會贏 但今年對手

  都看不到他的車尾燈

  另外你的言論跟攻擊東興小朋友的人一樣可悲'
