  所以他很怕哥哥組織家庭 又抗拒跟親生父親有關係上的確認


  直到最後他用哥哥和社工的兩條生命 才完成自我的救贖


  飲食男女也一樣 為什麼硬要說郎叔跟女兒是禁忌父女戀呢


  感覺有時候不少影評是為了譁眾取寵而譁眾取寵


