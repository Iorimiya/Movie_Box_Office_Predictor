title: '[好雷] 艾諾拉'
content: '防雷





















  我現在都很懶,拖一個禮拜才寫心得

  但這部電影有些想法我覺得可以趁記得分享一下

  眾所皆知他橫掃好幾個獎,應該要是高水準作品

  我原本也很期待他有什麼深度

  結果看完後實際上整個反過來

  一直以來一部好作品都有些被貼上標籤

  一定要很有深度,峰迴路轉之類的

  這部電影可說是打臉我們的既定印象

  坦白說他沒什麼深度,頂多有些細節

  也沒有多麼出色的手法,很一般的表現一段故事


  聽起來就是很普通甚至有點雷,怎麼會拿一堆獎？

  上面這些形容也是他拿獎的原因

  他把寫實和荒謬呈現到了一個極限

  沒有深度手法,就是一個脫衣舞孃的世界

  她是如何因緣際會紙醉金迷？

  又如何洗三溫暖般醒過來,看清她早該看清的事實

  我只覺得果然自己當個平凡人就很幸福

  不用高高飛起又重重落下,只能粉身碎骨

  這就是艾諾拉人生中標誌性又悲哀的一段

  最後他的嚎嚎大哭,我們也只能靜靜看著

  她窮途末路了嗎？不知道,至少心裡上是吧

  不過片中兩個跟她有關的男人都滿帥的


  這部電影的魅力,或者是價值就在此

  平凡甚至有點稚嫩的呈現一個主題

  我懂他的概念,所以能理解為什麼拿獎

  這樣也不錯,而且特種行業的神秘面紗

  都會想讓人一旦究竟,至少我很好奇

  在這些扭腰擺臀之下,藏了什麼樣的心

  有空的話好好欣賞這部電影的個性吧！


  ----

  Sent from  on my Samsung SM-S9280


  --

  每當處在我人生的十字路口，我總是知道哪條路是正確的

  沒有例外，我總是知道，但我從來沒去做，你知道為什麼嗎？

  因為那實在他媽的是太難走了

  而現在的查理也正處在人生的十字路口，他選擇了正確的路

  一條通往原則、導向人格的道路。讓他繼續走完這旅程

  委員們，你們正掌握著他的未來。這會是個寶貴的未來


  --'
