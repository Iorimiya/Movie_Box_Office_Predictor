url: https://www.ptt.cc/bbs/movie/M.1741919283.A.D95.html
title: '[普雷] Anora (2024) 艾諾拉'
content: '網誌版：


  因為看到這部片得了很多獎，所以期望有點高，不過最後結束是有些失望的。看到有人評

  價說Anora雅俗共賞，我承認比起藝術、設計、配音等，我最在意的還是劇情，或許我就

  是在俗的那一邊吧，可是必須說劇情的走向其實算是意料之中。富家公子與風塵女子的戀

  情能有什麼結局？Ani與男二Igor的糾葛也在許多伏筆與鋪墊中展現，似乎沒有很大的意

  外。


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  當然，我喜歡的部分是Anora對階級刻劃的細膩，富二代的放縱、Ani作為底層女子的掙扎

  、俄羅斯寡頭父母如何高高在上，而為他們工作的神父、保鑣如何唯唯諾諾在整個故事中

  展現的淋漓盡致。此外，這部片喜歡運用多人同時講話、甚至罵髒話吵成一團、乍看混亂

  的場面，實則帶點搞笑也象徵著彼此雞同鴨講、不在同一個階級與頻道上。另外一個我很

  喜歡的點是Ani雖然出身階級卑微，但沒有那種悲情，反而帶有美式自信勇敢，不論是展

  現在與同事老闆的互動，或是與Ivan的關係上。


  片尾的部分是許多人評價最高的部分，Ani從一個習慣肉體與金錢交易的風塵女子在遇到

  Ivan後漸漸打開心房，甚至動了真情，然而卻逃不過最陳腔濫調的負心劇情，麻雀無法變

  鳳凰，卻意外結識了Igor。原本她以為Igor就像其他貪圖她美色的男人那般，但當她發現

  Igor對她真心時徹底破防。這裡有很多詮釋的方式，也可以說成是：最終這世界沒有什麼

  階級跳躍。


  --'
