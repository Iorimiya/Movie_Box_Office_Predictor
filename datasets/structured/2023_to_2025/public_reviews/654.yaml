content: "《艾諾拉》摘金棕櫚不忘本 性工作者搶先看\n\n2024/09/29 05:30\n\n〔記者許世穎／綜合報導〕美國名導西恩貝克編導的新片《艾諾拉》以性工作者為題材，\n\
  在今年坎城影展首映後大放異彩，更拿下金棕櫚大獎。電影日前特地為性工作者和脫衣舞\n孃舉行特別放映，向她們送上關懷與尊重，女主角米琪麥迪遜和另一位演員琳賽諾明頓現\n\
  身主持，受到現場觀眾手腳並用鼓掌熱情歡迎。\n\n導演西恩貝克雖然未到場，但他本人長期給予包括性工作者及中下階層群體很多關注；米\n琪則特別感謝影片的編舞肯娜迪史奈德，在拍攝過程中幫她掌握性感動作，「她教會了我\n\
  一切，這是我永遠感激的一件事。」\n\n米琪大讚肯娜迪是個知識寶庫，「她非常慷慨的花時間與我交談，教會我許多細節，為電\n影和角色增添了不可思議的層次感，並且讓故事更加真實，這對我來說非常重要。」《艾\n\
  諾拉》將於12月6日在台上映。\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
