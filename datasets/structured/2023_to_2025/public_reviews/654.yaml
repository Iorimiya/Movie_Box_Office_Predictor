url: https://www.ptt.cc/bbs/movie/M.1741069228.A.0ED.html
title: '[討論] 奧斯卡大贏家艾諾拉豆瓣評分只有6.7'
content: '這還是得獎之後有拉一點上來

  之前是6.6或更低

  好像也創了2000年以來奧斯卡最佳影片的豆瓣最低紀錄

  其他入圍片反而蠻正常的

  懼裂     7.5

  秘密會議 7.4

  沙丘2    8.1

  我仍在此 7.9

  就是艾諾拉特別低


  看了一下一些低分的評價

  >>Sean Baker格局小了，多看看霸道總裁文

  >>男導演別再拍女權片了，把你們露骨的凝視收收吧

  >>就覺得現在的國際電影節在美學方面已經沒有任何要求了(本片同時是坎城金棕櫚)

  >>公式一般的預設，沒有深度和驚喜，總覺得在哪部韓劇裡看過類似劇情

  >>我們到底能不能把黃片還給黃片、把情色還給情色?

  >>在解構灰姑娘類型片敘事的同時又陷入種種狗血俗套，你幾乎看不到任何人物心理層次

  >>Sean Baker電影的工藝越來越好了，但本片的姿態卻醜陋無比、令人作噁

  >>能不能給負分啊?一個小時porn和一個小時歇斯底里吵架和只有美國人會笑的俄國笑話


  寫得還蠻頭頭是道的

  到底是艾諾拉太超前? 還是中國觀眾的品味太超前了呢?


  --'
