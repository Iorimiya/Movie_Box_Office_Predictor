title: '[ 好 雷] 艾諾拉'
content: '心血來潮想說看部電影，


  沒想到這部竟然這麼好看！


  看完後，


  原本一直支持Demi拿影后的我，


  竟然有些動搖！


  最讓我感動的是Ani最後和光頭男的互動，


  在車裡光頭男拿戒指給Ani後，


  想要報答他，光頭男想要跟他接吻，


  Ani怯步了，在他懷裡痛哭，


  看在這段觸動了我的心，


  我跟Ani很像，


  我一直告訴自己不要對人動感情，


  只要跟別人做愛完後就離開，


  但總是會有一個那個願意跟我接吻的人，


  這段我痛哭了30分鐘，


  這部片真的非常推！



  --'
