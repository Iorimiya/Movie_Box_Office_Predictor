title: '[好雷] 真的還滿好看的《艾諾拉》'
content: '這部片的故事其實很簡單


  就是在歡場討生活的瞎妹


  以為遇上真的愛上她的富貴公子哥


  而兩個乾柴烈火的男女在短暫的朝夕相處之下


  跑去結婚以為之後就可以過著童話般的生活


  結果殊不知女主角只是跟一個靠家裡、


  完全不食人間煙火的媽寶衝動之下做出的一場鬧劇


  電影前半段看似就是一般愛情電影的類型去營造


  但是在這中間又不時的穿插大量的性愛


  和兩者階級展現的炫耀、揮霍、三觀的對比


  我想這是要讓觀眾不時的懷疑他們這真的是真愛嗎


  之後劇情在中間的調性慢慢翻轉成類似喜劇的風格


  媽寶男主角的家裡派人來收拾這些爛攤子的人


  跟女主角的互動顯得在插科打諢、喋喋不休


  但是又覺得他們這幾個人這樣子的公路電影模式


  又好笑的天衣無縫，戲謔挖苦的令人發噱


  結果到最後女主角終於認清到現實原來不過如此


  觀眾到最後也是逐步的感受到女主角的細膩和真實


  而在她的周圍其實還是有那麼一絲溫暖的關心


  整部片下來節奏和劇情發展其實算是緊湊


  是一直會讓人想繼續看下去的


  雖然大概也知道最後會怎麼演


  不過這部片目前在台灣的反應好像沒什麼關注


  我去看的那場連我才三個人而已


  但是如果最近有人要我推薦去看的電影


  這部片我一定會請他們去試試



  --'
