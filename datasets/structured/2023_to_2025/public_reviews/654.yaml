url: https://www.ptt.cc/bbs/movie/M.1741546847.A.E35.html
title: '[普雷] 艾諾拉 '
content: "前陣子首映有趕上尾聲，只是當下看因為同場遇到解說哥搞得一直沒辦法專心觀影，感覺\n也覺得電影普普而已，趁這陣子重映再專心看一次，結果感想似乎還是沒變XD\n\
  \  整體故事走線其實很簡單，就是完全放在Ani身上的一個真實版灰姑娘的故事，\n  只是導演很好的把前半的花天酒地轉變到後半現實的公路電影結合的很好，也讓電影不會\n\
  單調，然後看Mikey 很好的詮釋一個底層的性工作者也真的很值得\n  但除了以上幾點，好像這部電影就這樣了欸 前半段的情慾流動完全感覺不出來有推進劇\n情的成分，如果是每一次都越做越像情侶的話可能還可以理解後半Ani\
  \ 那麼執著要Zak 堅持\n，至少我看不出來版上說的Ani有淪陷的點在哪\n  再來就是最吵的一段也是偏冗，可以理解導演想加入一點笑點，確實全場也是這邊笑的最\n\
  開心，但三個人每個都要來一次要不要放了她的橋段看了有點小不耐煩 最傷的點估計還是\n整體劇情真的太好猜，就是毫不意外的互罵 然後離婚 要不是最後一幕有讓Ani對伊格崩潰\n\
  的話，真的俗套到底了…\n  整體來說因為有Mikey 的演技加上還是好好的說完一個故事，我覺得還是值得一看的電影\n  尤其這部沒有像很多作品試圖把性工作者寫成很有智慧的存在，就是很如實的表現出她們\n\
  的樣子這點真的很加分，但劇情上的單薄加上過多不必要的劇幕真的扣了不少分，可能真的\n跟奧斯卡評審的口味不太一樣吧XD \n\n\n--"
