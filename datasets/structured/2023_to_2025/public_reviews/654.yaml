url: https://www.ptt.cc/bbs/movie/M.1742113441.A.826.html
title: '[好雷] 艾諾拉：畫根取暖小火柴 '
content: '三月連看三部電影「艾諾拉」「喵的奇幻漂流」「夜校女生」

  首發文先獻給艾諾拉



  女主角真的太可愛啦，我覺得是很有人緣的那種長相

  評審會想要把票投給她的那種 (我想!)






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~







  女主角與富二代之間談不上愛情

  富二代是遊戲人間、女主是想抓住機會讓遊戲成真

  真正的愛情悄悄出現在中段用力綁著女主角的保鏢身上



  一開始我看到女主角阿妮被三個壯漢架著時有點緊張

  因為我怕會出現阿妮被強暴等殘忍的戲碼

  但看到鬧了二十分鐘還在大鬧時

  我鬆了一口氣，在這裡感覺到導演的溫暖

  也感受這部戲是在導演開角色們人生的玩笑

  給阿妮畫根賣火柴的小火柴吧



  所以，階級仍無法跨越

  麻雀沒有變鳳凰

  女主角也不願意馬上接受財富身份連降十八級的愛情

  生活一向都是有傷的，只是這一段起伏稍大了點

  但是這一刻，與保鏢相濡以沫，一點小小的互相取暖

  是真實的小確幸

  而明天，明天去酒店上班，阿妮可能還要和死對頭再吵一場呢



  看到艾諾拉以為抓到機會、鬧了一場、白忙一場

  想想，現實人生似乎也是這樣......



  --'
