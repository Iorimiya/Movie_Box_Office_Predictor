url: https://www.ptt.cc/bbs/movie/M.1741091496.A.CBF.html
title: '[好雷] 艾諾拉'
content: '很美的一部片

  尤其最後的一場雪

  很美又很淒涼也很美國

  不知道怎麼會讓美俄題材的片拿獎

  會不會是最近跟美俄重修舊好有關


  這片真是看到人間的貧富差距

  就像小丑第一集一樣

  那個富二代就好像說黃仁勳是他爸一樣

  他在紐約的家真是大到一個誇張

  錢好像永遠都花不完一樣


  連那間妓院開在曼哈頓

  收費應該也是不便宜

  能進去的應該也非富即貴

  有點像麻雀變鳳凰的橋段

  只是結局沒那麼完美收場

  最後女主角還是只能跟流氓湊一對


  感覺金馬跟奧斯卡現在都在捧新人

  大家熟悉的好演員反而容易拿獎

  現在都是院年輕的越爆冷門拿獎

  這片看的感覺像是在看國片的感覺


  吵架的對白很多，感到很拖戲

  但還是很多很有趣的橋段

  例如俄國戰鬥民族的性格

  冬天去海裡游泳，車被吊走

  硬把車從拖吊車上開下來

  財大氣粗凡事都想花錢解決


  這片從頭到尾都看得很順

  幾乎是從頭三級片到尾

  跟可憐的東西有得比

  難怪會找艾瑪史東頒給她

  好像現在不拍三級片沒法拿影后的感覺

  倒是沒帶動到國片的女星也都去拍


  這或許是老演員沒法突破的層面

  尺度大開到讓人看起來很自然的感覺


  這個富二代演得很像孫安佐

  超級屁孩顛覆大眾對屁孩的想像

  可以在游泳池到滿四噸的飲料游泳

  真是超級富二代，中國現在應該很多


  裡面富二代的爸爸反而很低調

  他的媽媽反而很強勢，難道爸爸是入贅?



  --'
