title: '[新聞] 《艾諾拉》獲勝的背後：獨立發行商 NEON'
content: '尚恩貝克（Sean Baker）在本月初以《艾諾拉》拿下奧斯卡最佳導演時，特別感謝

  NEON 持續關注院線放映的作品，而這間成立不到 10 年的發行商，是如何一步一步照著

  自己的步調與選片邏輯，打造出屬於自己的品牌形象，甚至在 5 年之內兩度拿下奧斯卡

  最佳影片？


  時間先回到去年 11 月，正當各個片商將自己獎季的行銷資源放在偌大的廣告看板以及

  各種試片場次時，《艾諾拉》的片商 NEON 在洛杉磯宣告了一場快閃店活動，他們將一台

  載滿《艾諾拉》 T-Shirt、丁字褲...等周邊商品的卡車，停在了洛杉磯街道旁，展開宣傳

  。

  車輛到達之前，大約已經有 300 位粉絲排隊等候，而這些人員的組成全都不是演藝學院

  的選舉人，甚至可能是當地的性工作者，如果你是尚恩貝克過去作品長期的支持者，你會

  知道這一切場景都不會太意外。







  過去 10 年，獨立電影與藝術電影的觀眾往往會把焦點放在 A24 這間製作發行公司上，

  他們確實透過創新與獨樹一格的行銷策略，以《月光下的藍色男孩》（Moonlight）與《媽

  的

  多重宇宙》（Everything Everywhere All at Once）兩度奧斯卡最佳影片；然而 2017 年

  成立的 NEON 過去 5 年同樣打響名號，《寄生上流》與《艾諾拉》都出自他們的操盤。






  今年，NEON 的競爭對手們在獎季中投入大量資金，根據綜藝報的報導，某間娛樂公司

  為了一部電影的宣傳投入了 6000 萬美元，而《艾諾拉》則是投入了 1800 萬美金，是拍攝

  成本的足足三倍之多，聽起來相當驚人，然而對比這場競選比賽所投入的成本，NEON

  顯然獲得了巨大的投資報酬，同時也比 2020 年《寄生上流》的 2000 萬宣傳成本更低。



  截至截稿日，《艾諾拉》在全球獲得 4200 萬美金的票房成績，扣除疫情的兩年，該片是

  本世紀票房最低的奧斯卡最佳影片，不過

  考量其成本與去年在坎城以及今年奧斯卡的

  斬獲，可以說是大豐收，



  《墜惡真相》（Anatomy of a Fall）在去年也在 NEON 的操盤之下，獲得了最佳影片以及

  最佳原著劇本的提名，而將狗狗放在獎季宣傳的中心，也是昆恩的主意，該片的製作人

  大衛席恩（David Thion）受訪中表示，




  2023 年底，NEON 其實差一點就以 1 億美金的價格出售給印地安畫筆公司（Indian

  Paintbrush Productions）創辦人史蒂芬瑞爾

  斯（Steven Rales），不過該筆交易在最後

  一刻失敗，而當協議失效之後，有傳言稱該工作室與後疫情時代的許多其他獨立工作室

  一樣陷入了困境。


  然而截至今年奧斯卡，這情況顯然已經反轉，NEON 憑藉著《艾諾拉》已經連續五屆拿下

  坎城影展金棕櫚獎的發行權，最近的兩部恐怖片《長腿》與《猴子》也創下了優異的票房

  成績，根據 NEON 的說法，2024 年是迄今為止財務上最成功的一年。




  發行公關分析師傑夫巴克

  指出。



  因此，有傳言指出 NEON 與 A24 將會在接下來展開一場殊死戰，爭奪誰是最有品味且

  成功的電影發行商，對此湯姆昆恩表示並非如此，他透露當《艾諾拉》在奧斯卡夜晚擊敗

  《粗獷派建築師》拿下最佳影片時，A24 的團隊。








  當然，NETFLIX 並不是唯一一間他們需要打敗的公司，昆恩透露，他們一度也非常想要

  買下《粗獷派建築師》，稱讚它為「冰冷的傑作」，可惜最終導演布萊迪寇貝特（Brady

  Corbet）因為放映策略的分歧最終選擇了 A24 ，布萊迪希望






  回顧獎季，其實一開始《艾諾拉》的聲勢並不是最強勢的，《粗獷派建築師》、《璀璨女人

  夢》與《秘密會議》都在各個獎項中有所斬獲，甚至是女主角獎黛咪摩爾（Demi Moore

  ）在演員工會依舊領先著麥琪麥迪遜（Mikey Madison），但




  昆恩期待過去兩座最佳影片可以讓他們更有機會接觸他們想要網羅的影人，其中包含了

  尚恩貝克，他非常想要再次與他合作。




  有鑒於之前 NEON 曾經一度出售，昆恩是否還是會考慮新的報價？







  ———————————————————————


  參考外電：Variety原文

  Inside ‘Anora’s’ Oscar Victory: How Scrappy Indie Neon Pulled Off Its Second

  Best

  Picture Win in 5 Years



  心得：霓虹燈影業的經營方向，不但是今年好萊塢越來越積極參考的典範，更是國內

  不少影視創作者應該細讀進而調整的，我在這裡僅以微薄之力，把訪談精華貼在這裡


  --'
