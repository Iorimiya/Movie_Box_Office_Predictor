title: '[好雷] 我們愛過一次'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  巴西是拉丁美洲第三個也是最大的婚姻平權國，其中，最大城聖保羅更是LGBTQ+族群權益

  的擁護城。自1997年開始的聖保羅同志大遊行，是全世界規模最大的同志大遊行。不過，

  也由於巴西是全球僅次於美國的第二大基督教國家，也是世界上最排斥同性戀的國家。《

  我們愛過一次》便是一部講述在這樣既自由又壓抑的背景下，所發展出的一段溫柔戀情。



  年輕男孩衛林頓離開監獄時，無處可去下在同志電影院和資深男妓羅納多巧遇，並試圖在

  他們的「新家」中找到自己。



  「不要像個baby一樣！」



  原文片名「Baby」不但是主角衛林頓擔任男妓的花名，更象徵他在這段時間體會到社會險

  惡，以及失去童貞的「登大人」。服刑近兩年的衛林頓才18歲，也就是說，他入獄時仍未

  成年，同在少年監獄的獄友，不論多麼罪大惡極，他們終究還只是孩子，是在外面的世界

  重逢就會高興地敘舊，絲毫不懂得閱讀空氣，也不在乎他人眼光的年輕人。衛林頓聽到羅

  納多說當男妓很好賺，而且只想滿足偷窺癖的「高檔客戶」不會加入，就欣然答應接下第

  一個案子。沒想到，客人興致來了之後，衛林頓感覺自己身心靈受辱，而讓羅納多覺得他

  是個不諳世事的孩子。事實也是如此，衛林頓的確不懂事，但這次事件過後，他將花名改

  作Baby，認清自己的單純，同時開始成長。



  出獄後的衛林頓，得知父母早已搬離住處，即便遭父母拋棄，他也一直執著於找到他們。

  隨著羅納多與衛林頓相處的時間越來越長，羅納多也帶衛林頓認識自己兒子的母親與她目

  前的同性伴侶。加上羅納多與前妻的兒子，這五個或有血緣、或沒血緣的「多元成家」家

  庭，描繪出「家」真正的模樣。感覺被接納，重視彼此的感受，一起過週末，一起慶生，

  甚至在衛林頓找到姑姑的時候，羅納多與前妻一起為他抱不平。即使衛林頓最後還是堅持

  與媽媽與素未謀面的妹妹見面，但在各種低潮時接住他的還是這個「不完整」的家。



  衛林頓畢竟還處於年輕愛玩的年紀，禁不起跟著羅納多過每天工作的苦日子，在與同齡好

  友見面後，不禁羨慕起對方找到出手闊綽的飯票，所以自己也在夜店結識可能更為年長且

  財力雄厚的亞力。看著年輕的衛林頓，亞力不禁感慨時代不同，身為現在的同志真幸福，

  就不必像他當年還必須勉強自己結婚生子，再於夜深人靜之時到公廁去找對象。雖說衛林

  頓告訴他，每個人都辛苦，但這番無奈的真心話或許也是羅納多的心聲，他與前妻可能也

  是在這樣的社會氛圍與壓力下成婚，但最後兩人還是追求自己真正喜歡的生活。



  「怎樣才算在一起？」



  海報上的宣傳標語如此寫著，在羅納多與衛林頓的關係裡，這的確是大哉問。他們從來沒

  有真正確認彼此的關係，也沒有誰對誰告白，甚至衛林頓中間還有一個禮拜跑去找亞力，

  但從羅納多幾次撞見衛林頓正在接客所產生的嫉妒情愫，雙方在彼此感冒發燒時表達的關

  心與照顧，以及羅納多面對藥頭的挑釁保衛性地說兩人是「一起」的，都能夠看出兩人實

  質上早已進入一段關係。



  但是，這段關係究竟是什麼呢？因為兩人的年齡差距，有些互動感覺上像是父子。羅納多

  聽到衛林頓細數身上各種遭霸凌的疤痕後，開始教他拳擊，就算兩人搭檔在街上販毒也會

  時刻叮嚀對方不要碰糟糕的東西。對於自述從小就不受父親認同的衛林頓來說，羅納多的

  出現就像是彌補這個親情缺口。



  兩人也是戀人，而且羅納多知道衛林頓坐過牢之後還是接納他，不像亞力直接翻臉不認人

  ，可是，不要說沒有非工作所需的性愛場面，嚴格來說，他們連比較親密的互動都沒有。

  不確定是否為導演刻意安排，但電影末段兩人在公車上意外重逢後的回憶，衛林頓開心地

  在屋頂上教羅納多跳舞，不僅呈現給觀眾看的長度比他們認識時長，期間的互動也有愛不

  少。或許導演就是想要營造出，這樣的關係在外人看來一點都不是戀人，但在當事人的回

  憶卻是愛意滿滿。



  當然，更多的時候，兩人只是工作上的夥伴。不管是羅納多一開始招募衛林頓成為男妓，

  擔任類似皮條客或經紀人的角色，還是後來上街販毒的時候，兩人互相接應，並保護衛林

  頓避免再次入獄，因此只讓他當幕後供貨的角色，都看得出羅納多即便作為工作的「上司

  」都非常疼愛衛林頓。



  《我們愛過一次》最溫暖的地方在於，它從巴西最真實的黑暗街景出發，刻畫出同志與酷

  兒的生活與愛情。從沒事姊妹幫合法賣藝討生活、同志三溫暖，到猖獗的毒品問題、色情

  電影院，讓觀眾看到不同於模特兒、嘉年華與足球等光鮮亮麗文化一面，但也尚不到《無

  法無天》裡里約熱內盧貧民窟的暴力與危險，同時忠實呈現在此生存的小人物們是如何好

  好過每一天，敢愛敢恨，並在一段刻骨銘心的戀情結束後，默默放在心裡，期待著有一天

  會偶然重逢。


  --

