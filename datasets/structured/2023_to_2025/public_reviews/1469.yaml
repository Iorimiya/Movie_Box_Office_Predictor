title: '[情報] 雪琳伍德利將主演「海史密斯」傳記電影！'
content: "根據 Deadline 的獨家報導指出，艾美獎提名女演員 Shailene Woodley 將主演美國女作\n家 Patricia Highsmith\
  \ 的傳記電影《The Murderous Miss Highsmith》。\n\n\n\n《The Murderous Miss Highsmith》將由新銳女導演\
  \ Alexandra Pechman 執導，將做為他\n的長片導演首作，他曾為影集《黑暗詩選》和《零異頻道》編寫過劇本。而這回他將執導\n的新片目前則未公布編劇人選。\n\
  \n曾寫出《天才雷普利》、《鹽的代價》和《火車怪客》等名著的 Patricia Highsmith 早\n已有多本小說被改編為影視作品，且其中不少部都成為影史名作。這回則將他的生平搬上\n\
  大銀幕，電影將會聚焦在他寫出《天才雷普利》前的人生階段，並將他的人生轉化為一部\n恐怖電影。其中也將聚焦無法與他攜手走下去的兩名女人的關係。\n\n\n\n曾以《美麗心計》獲得艾美獎提名的\
  \ Shailene Woodley 將在片中飾演女主角 Patricia H\nighsmith，而與他擁有伴侶關係的兩位女子將分別由《燃燒女子的畫像》凱薩獎得主\
  \ Noé\nmie Merlant 和本業為超模的 Cara Delevingne 飾演。\n\n\n\n《The Murderous Miss Highsmith》幕後團隊包括今年甫製作出大獲好評的《Past\
  \ Lives\n》的女製片 Christine Vachon 以及新銳製片 Gabriel Mayers，他們的電影公司 Killer\n Films 即是曾將\
  \ Highsmith 名著《鹽的代價》改編為《Carol》的重要推手。\n\n該片預計今年秋季於義大利開拍，接下來在五月中將會由國際銷售公司 Memento\
  \ 前往坎城\n影展尋找國際買家。\n\n\n\n--"
