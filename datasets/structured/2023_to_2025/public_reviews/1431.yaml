title: '[凱吉雷] 地獄來的乘客-通往地獄之路由凱吉鋪成'
content: '我無法想像愛凱吉的人會不愛這部電影。




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  《地獄來的乘客》(Sympathy for the Devil)：

  .

  我不確定這片還能在院線撐多久，但你們需要知道這部電影。

  .

  常常聽到有人抱怨說，現在好萊塢鬧嚴重的劇本荒，已經沒有原創劇本了、全部都是各種

  IP電影，面對這樣的聲音，我會說，去看部凱吉的電影吧，近年來活躍於低成本獨立製作

  的凱吉，每年都推出好幾部非常有趣、甚至十分精采的原創電影，從電影本身到他演出的

  角色都橫跨多種不同類型，好萊塢只要有凱吉在，就沒有不可能的事。

  .

  好萊塢現在沒有優秀的原創電影了，就跟你說凱吉是爛片王一樣，都是錯誤的想法，要打

  破這樣的刻板印象，只有唯一方法，你需要的是更多的凱吉，他是你的解答、你的救贖、

  你的信仰、你的一切。

  .

  凱吉今年短暫地回到了主流電影當中，年初演出《吸血鬼特助：雷菲爾》，然後他聽到了

  我們焚膏繼晷的祈禱，在《閃電俠》中客串演出了超人，那驚鴻一瞥的平行宇宙，彷彿是

  凱吉教徒的應許之地，他在一年內兩度改寫了影史，讓我們看到史上最棒的德古拉和史上

  最棒的超人。

  .

  但他顯然並不打算在大片商中停留太久，他願意演出這兩部電影是他偶一為之的賞賜，他

  知道他必須做點什麼來提醒我們生命的意義，有凱吉在，我們必定不會迷失。但他才不需

  要DC宇宙或是環球怪獸宇宙，這些電影宇宙才需要凱吉、這個世界才需要凱吉、我們才需

  要凱吉。

  .

  我們也都很清楚，那些獨立製作的怪電影才能讓凱吉火力全開，還好凱吉淡泊名利，他在

  乎的永遠只有表演本身，他並不想給我們那些我們喜歡的東西，這樣太無趣、太簡單了，

  他要帶給這個世界的福音，是那些我們還不知道自己喜歡、不知道自己需要的東西。

  .

  於是，我們有了《地獄來的乘客》。

  .

  乍看之下，或許我們可以說這片是個高概念驚悚片：一個顯然是危險人物的陌生男子搭上

  了你的車，他身份成謎、目的不明，他手上有把槍，他不只掌握了你的生命、他還拿你家

  人的生死做威脅，他說只要你載他到指定地點就沒事了，但隨著你跟他相處，你發現這個

  人的目的似乎沒有這麼單純，他似乎沒有打算放過你......

  .

  光是這樣描述劇情，乍聽之下，還以為是部山寨版的《落日殺神》，但這片可沒有那麼簡

  單，首先，也是最重要的是，它有凱吉，《落日殺神》中的阿湯哥看起來至少風度翩翩、

  頗具紳士風範、也能理性溝通，你至少會覺得主角可能還有脫身的機會，畢竟眼前的這個

  男人看起來是可以收買、可以求饒、或是可以講道理的，但是凱吉是不講道理的，因為他

  就是道理。凱吉這樣的難以捉摸與邪異，讓這個角色比起《落日殺神》中的阿湯哥有著更

  大的壓迫感、也強化了這片的驚悚感。

  .

  然後是，這片並不是那種想便宜行事，隨便拍了一部電影後把凱吉放進去，就以為會有人

  為了凱吉傻傻買票的爛片─你可能想問這種電影到底誰會買票？就我啊─它其實雖然仍是

  一部B級製作，但感受的出來電影本身是有經過認真打磨的，敘事、節奏甚至畫面攝影都

  有一定的水準，它提供了一個會讓你想繼續看下去的驚悚故事。

  .

  而這片的恐怖跟壓力感也的確足夠，這方面或許見仁見智，但這片的情境確實擊中了最讓

  我在觀賞作品時難以忍受的恐懼之一：它延長了對受害者的折磨，當事人可能自己都很清

  楚知道最後難逃一死，但對方卻不給你個痛快，甚至還有點調皮的惡趣味，不時讓你以為

  你或許有機會逃出生天，你可能知道這個希望是虛假的，但你還是忍不住想要抓住這根一

  碰即碎的浮木，我其實不太確定為什麼，但這樣的心理折磨是我最有感、最能感同身受、

  也因此最害怕的恐怖片情節之一，也因此這片對我而言，確實是提供了一定程度的恐怖效

  果，就算拿掉了凱吉，這片娛樂性還是很高的。

  .

  然而誰要拿掉凱吉，我就是來朝聖凱吉的，如果沒了凱吉，這片還能看嗎？或許可以。但

  我會想看嗎？鐵定不會。

  .

  但在我開始不理性開啟凱吉傳教士模式之前，我還是先講一下我覺得這片的小缺點好了，

  我自己不太喜歡這片結局的反轉安排，說句認真的，凱吉在這片演得極好，是真的會讓你

  感到恐怖的演出，但最後賦予了這個角色一個動機，我覺得反而因此有點浪費了凱吉前面

  演得那麼好，當我們知道主角並非全然無辜、而凱吉其實值得同情時，這個角色就變得沒

  有那麼令人害怕了，如果就讓凱吉成為一個如同都市傳說一般、隨機挑選受害者的魔鬼，

  這片是可以更恐怖的，這邊有點小遺憾。

  .

  不過不用擔心，只要有凱吉在，所有的遺憾都不會是遺憾。因為這片完全是靠兩個主角的

  對話跟互動在推動故事前進的，那麼這片的戲劇張力要能夠成立，就非常仰賴主角的表演

  ，也因此這片不只有凱吉，跟他對戲的演員也難得有頭有臉，而不是隨便找一個B級片演

  員來讓他練功(你可以去看一下《弒樂園》裡其他演員演得有多爛)，我必須說喬爾金納曼

  已經盡力了，他有撐起這個角色該有的驚恐與無助。

  .

  但不幸的是跟他對戲的是凱吉，只要凱吉出現在畫面上，他會徹底搶走所有的風采，而他

  們兩個人幾乎從頭到尾沒有分開過，即便現在戲是在喬爾身上，就算現在是喬爾在講話，

  你依然會盯著凱吉、期待凱吉接下來又會說什麼、做什麼。承認吧，你根本不是很在乎喬

  爾的角色，但沒辦法，誰叫喬爾的對手是凱吉，他也只能謙卑的認命了。

  .

  我們不妨可以這樣說，這片簡直就是凱吉全餐、凱吉能量滿載。雖然說凱吉近年來的確大

  量使用了外放浮誇的顏藝表演方式，但凱吉厲害的地方就在這邊：你並不會因為他誇張的

  表演方式而出戲，你可能會笑出來，但你卻依然享受、沉浸在他表演當中，而且他有將每

  個角色都做出區隔，你不會覺得凱吉每部電影都在演自己，這樣對於每個角色之間差異的

  掌控，只會讓我們知道他只有一座奧斯卡獎遠遠不夠肯定他的演技。

  .

  但凱吉才不需要奧斯卡，是凱吉的名字曾經出現在奧斯卡的歷史上，才為這個獎項錦上添

  花，他不缺第二座奧斯卡，奧斯卡才要求凱吉給他面子。如果你喜歡凱吉獨特的表演方式

  (不喜歡的請你自己檢討)，那你會愛死這片：這個反派角色讓凱吉可以肆無忌憚的將他所

  有的演技釋放出來，你可以看到他戲謔嘲諷、看到他瘋狂著魔、看到他瞪大雙眼、看到他

  時而張牙舞爪時而齜牙咧嘴，彷彿邪神附身一般、連真正來自地獄的惡魔都要敬畏他三分

  。

  .

  而當電影後半段進入餐廳時，凱吉直接示範了什麼叫做一個人主宰了一整部電影，過癮極

  了。無論你看這部電影的當下有多麼疲憊，你都必須虔誠且全神貫注看這段戲，當凱吉隨

  著點唱機的音樂開始扭動他的身體、開始引吭高歌時，戲劇與現實的界線也隨之模糊，我

  們會開始懷疑，這到底是在演戲，還是其實只是跟拍凱吉的晚餐日常？我們也無法確定那

  些荒謬詭異的囈語，到底有多少是出自原始劇本，又有多少是出自凱吉本身對生命體悟的

  即興發揮。透過這部電影，你完全可以感受到凱吉的演技在發光，就如同他那頭耀眼紅髮

  一般，炙熱而燦爛。

  .

  我看這部電影的那天，我的脖子嚴重落枕，痛到會影響日常生活的那種，但在我坐在戲院

  的那一個半小時，凱吉讓我忘卻了疼痛，因為我把所有的專注力都擺在對凱吉的景仰與膜

  拜上了，他就是有這種治癒人心的力量。

  .

  如果你覺得這個世界缺乏驚喜、少了活力，去看看凱吉吧。請你不要對這個世界絕望，凱

  吉還在，他一直都在，永遠都會在。

  .

  一個有凱吉的世界，難道會不美麗嗎？

  .

  謝謝你，凱吉。你是我的牧者，我必不致缺乏


  --

  如果以喬爾有沒有死來判斷是不是好結局的話算好結局啦，但後面還有一些小翻轉就是了'
