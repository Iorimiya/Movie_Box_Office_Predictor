url: https://www.ptt.cc/bbs/movie/M.1694998622.A.891.html
title: '[好雷] 地獄來的乘客（凱吉）'
content: '上帝說不再有爛片，於是我們有了凱吉







  雷文防雷資訊頁








  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~








  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  其實本人對於這種類型的片完全沒有興趣，但是身為凱吉粉，因為有凱吉所以就去看了，也因為有凱吉，所以給這部片好雷


  還好導演聰明找了凱吉來拯救了這部老梗到不行的片


  從片名（英文的Devil、中文的地獄）到預告，可能大家都會以為凱吉是惡魔、是撒旦，讓這部片有那麼點懸疑性，好奇為何凱吉撒旦要選擇上這部車，到底劇情為何，又是會如何結尾…….


  以下有雷…..











  但是其實凱吉就只是個人類而已，這部片就只是老梗到不行的復仇片…就像公路版的暴力效應罷了（然後是無聊到不行的版本）


  但是凱吉在片中的演技、顏藝絕對讓你值回票價，凱吉粉不用說應該已經看了，還不是凱吉粉的看完後也絕對會變成凱吉粉


  凱吉從來不演爛片，因為有了凱吉，爛片也變成了好片



  btw…Joel Kinnaman其實演的也OK啦，但是演對手戲的是凱吉，所以你知道的….poor Joel


  -----

  Sent from JPTT on my iPhone


  --'
