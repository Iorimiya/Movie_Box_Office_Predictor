title: '[好無雷] 《默殺：無聲之地》'
content: '本片取景自基隆

  善用了基隆的氣候

  讓整片充斥了與本片基調非常相符的景色


  演員的表現都很不錯

  劇情部分則是每個點都有抓到

  算是面面俱到

  喜歡這懸疑又帶有警世意味類型作品的人

  應該會很喜歡這片


  沒什麼其他無雷的感想

  這片太多地方會有雷了

  晚安


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
