title: '[請益] 默殺：無聲之地 問題（有雷）'
content: '看電影可能有些閃神所以錯過，有些小疑問想請教大家（有雷）



































  防雷頁








































  1.尹馨第一次和警察碰面，又跑去垃圾車上翻垃圾找線索，然後突然有人手機響了，原來

  是來倒垃圾的施名帥的，他趕緊跑走。請問當時是誰打施名帥的手機啊？我有點沒注意到

  ？是學長張世嗎？


  2.劉引商奶奶大難不死，後來坐尹馨的車離開。劉引商一直翻找包包，碎碎念手機不見了

  ，要報警。為什麼這時候尹馨突然搶了劉引商的包包丟出車外？雖然老人家碎碎念的確讓

  人很焦躁，但尹馨反應也太大，難道是路怒症嗎（誤）？XD


  3.啞巴宸頤的下落，感覺是開放式結局沒明確交代？是黃健瑋帶她去坐船然後溺斃嗎？


  4.黃健瑋怎麼知道尹馨當年把吳慷仁的屍體藏在頂樓花圃？好像沒交待？難道是宸頤跟他

  「說」的？


  謝謝！


  --

  尹馨打牧師我的確沒什麼印象。

  原來是「真的」放她自由，而不是指讓她一了百了。

  可能影片裡看不清楚？主要只看到尹馨把女兒拉走？

  感謝你願意一起討論！^^

  原來如此！謝謝！

  但如果尹馨沒把徐媽包包丟出車外，徐媽就不會去拉尹馨的手啊？'
