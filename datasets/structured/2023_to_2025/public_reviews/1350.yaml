url: https://www.ptt.cc/bbs/movie/M.1698441518.A.B2B.html
title: '[微好無雷] 《數碼寶貝02 THE BEGINNING》'
content: '好久沒寫心得了

  希望手感還在


  順便吃了久違的拉麵

  這大概是這趟旅途的主因(×

  整個晚上睡不著覺，不過看的時候也沒打瞌睡，這點先給及格線



  =====以下正文開始=====


  首先是電影版其實算是維持02的調性，如果不喜歡02，那大概也不會喜歡這部劇場版


  如果是從以前看01和02的童年過來的，應該可以分清楚兩邊的差距是在哪邊

  或是如果已經忘了，那可以重溫一次



  01算是很正統的「冒險者打大魔王」套路，一路練等、一路經過波折、一路過關斬將，最後

  打贏大魔王，皆大歡喜


  但02不同，02很著重在個人劇情塑造上，算是把角色的個性發揮到極致，最經典的莫過於阿

  武直接把暴龍改造者(一乘寺賢)壓在地上揍，還有嘉兒進入黑暗之海的部分，這些都是「個

  人特質」，是01所看不見的

  當然也是02最常被人詬病的一部分……


  那麼02這部劇場版的問題來了，就是走02這種調調的故事，而且著重的要角還是一個新角色

  「大和田類」，那勢必引起許多人不滿：「為什麼劇場版要聚焦在一個新角色身上？」

  而02眾的任務就是幫忙解決這種問題，自然就會出現許多負雷的聲音，很正常


  其實拔掉數碼寶貝這個名號，這部劇場版也有一些現代家庭可能出現的問題，尤其是類的母

  親的個性，非常寫實，整個家庭問題也很寫實

  當然這就是排擠到主角群的劇情問題，所以再一個負雷，也是很正常的


  因為會想看這部劇場版的人，勢必都是因為數碼寶貝這個名稱來看的，缺少了「數碼寶貝」

  這個焦點，那引起不滿，自然是理所當然，畢竟這部就不是01那種調性



  =====拉線=====



  個人反而覺得戰鬥有點太過硬要啦

  不過為了展現3D技術和該賣一點「數碼寶貝」，這還是不可避的

  新角色大和田類的角色塑造，在短短的劇場版中就能塑造到這麼完整，其實也得歸功於腳本

  的厲害之處，很難想到這跟LAST EVOLUTION是同一個腳本


  --



  我老婆(2008～)


  我主推(2015～)



  --'
