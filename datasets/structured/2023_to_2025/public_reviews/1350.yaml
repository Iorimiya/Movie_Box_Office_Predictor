url: https://www.ptt.cc/bbs/movie/M.1703646163.A.934.html
title: '[ 雷] 數碼寶貝02 THE BEGINNING'
content: '雖然這部應該已經下檔了，不過還是想來補一下影評。


  身為追數碼寶貝到第四季的八年級生，出社會後也有補追Tri，數碼寶貝2020，Last Evol

  ution等…當初看到數碼寶貝02電影版要上大螢幕的消息以及後續的台灣預告片，非常期

  待！


  預告片如下：



  這邊先補上人權：



  劇情方面：

  主要劇情是在探討受虐兒的故事，所以沒有配上非常精采的打鬥，整部電影來說非子供向

  。不知道製作組可能知道數碼寶貝的受眾可能都是大人了所以才敢用這麼沉重的主題當主

  軸並且讓打鬥畫面變得很少？而且電影最後不管是受虐兒的部分或者是數碼寶貝的部分都

  有種故事沒有講完的感覺，老實說真的是有點可惜。


  新人物與新數碼寶貝：

  本片的主角應該是烏科獸與類，TV 02主角群比較像是配角，烏柯獸作為”類”反派登場

  ，整體的人物設定被弄得很玄又很神，烏科獸自稱是第一個與人類締結搭檔關係的數碼寶

  貝，並且擁有實現心願的能力以及自稱與偉大神靈有連結，看起來背景猛猛的但在整部電

  影中他都沒進化，只有以類似巨大化思念體的姿態登場，然後主角群一起進化但不是為了

  跟烏科獸打，是為了救人，因此主角群三隻數碼寶貝就是一隻放一次大招，打鬥場面就結

  束了，古神獸跟人面戰鷹獸也沒有究極進化，對於我們這種游離路人數碼迷來說，真的是

  一部很無聊的電影，也沒有大場面的打鬥，也沒有突破性的進化，光這點我甚至覺得TV數

  碼寶貝2020重啟中第50集裡神龍獸跟聖龍獸對打千年獸還比較有看頭。


  結論：

  整體來說不是一部很好的動畫電影，但衝著情懷來說可以看一下，特別是聽到02片頭曲跟

  合體進化BGM一下的時候小時候的熱血感都回來了。

  可看性:  ★★☆☆☆

  情懷: ★★★★★


  --'
