title: '[好雷] 數碼寶貝02 THE BEGINNING'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  先說結論

  我覺得比上一集好看


  前陣子跟幾個同事聊到數碼寶貝

  我說前幾年那部電影不好看

  引來一陣撻伐


  後來我說這部我一定要看國語配音

  更是讓同事們驚訝不已


  總之我看了國語版的電影 覺得非常滿意


  劇情簡單

  沒有太複雜的二選一

  上一集整個越看越氣

  為何到底努力了那麼久

  還是得跟數碼寶貝分開呢？

  同期的小魔女Doremi電影版就沒有強迫殺死童年的結局


  同事總說 電影要帶點遺憾才感人才經典

  可是我覺得現實世界都強迫你長大了

  為什麼不能在卡通裡回憶童年的歡樂？

  看到最後哭得一把眼淚一把鼻涕不是我看電影的目的


  這部電影從第二季片頭曲一下就覺得非常興奮

  再到熟悉的進化歌 進化台詞

  當下直接忍不住驚呼好帥！(好險這場只有3個人

  進化台詞就是要聽國語配音才對味啊！！

  比較可惜的是沒有裝甲進化

  同事則說竟然沒有新型態進化！

  然後同事覺得這部很普 上一集比較好看

  儘管我總是跟同事們的意見相左

  但我們一致認為合體進化的古神獸不好看XD(難得達成共識


  雖然這部很大的篇幅在說明新角色的來龍去脈

  但最後還是靠著主角們與數碼寶貝的合作

  成功解決事情

  重點是 最後數碼寶貝沒有跟各個長大的孩子們分開

  反而加深了孩子與數碼寶貝的羈絆

  讓彼此更珍惜這命中注定般的緣分

  第一位被選召的孩子也跟自己的數碼寶貝烏科獸解開心結

  期待著再次相遇的時刻


  這樣的結局不是很好嗎


  啊 還有看完這部電影後

  若被選召的孩子是因為類和烏科獸造成的

  那上一集的結局我也比較釋懷了


  最後除了推薦給想重溫童年回憶的大人

  也非常推薦給正在跟朋友冷戰或跟吵架的青少年

  朋友之間最重要的是 溝通與傾聽喔！


  --'
