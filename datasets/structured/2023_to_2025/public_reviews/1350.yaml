url: https://www.ptt.cc/bbs/movie/M.1698415912.A.BC2.html
title: '[微好雷]數碼寶貝02 the beginning'
content: '先上人權




  剛剛下班去看完了最新的數碼寶貝劇場版。


  整部電影給我的感覺完全不是我預期的模式，這部電影可以說完全就是一部文藝片。


  文戲佔了整部電影大概90%，其中新角色「類」和「烏科獸」又佔據了大概60~70%，整部

  電影可以說就是為了這對新搭檔來運作的。


  數碼寶貝1和2一直都探討很多家庭議題與社會議題

  有收養家庭(光子郎)、離婚家庭(阿武大和兄弟)、父母期望(丈)、大家庭(京)、世界並不

  是非黑即白(伊織和阿武).....等等很多議題，這也是小時候我們看不太懂但長大回去看

  才發現原來數碼寶貝1、2的製作組當年討論了這麼多議題，並且巧妙地融入動畫劇情當中

  。


  而這次的電影討論的議題主要是家暴兒童以及部分長照造成的偽單親家庭會帶來多大的壓力

  ，這種弱勢家庭所帶來的問題。以及「溝通」與「拒絕」的重要性，一味地對人好但完全

  不溝通往往最後都會走向悲劇。



  這部電影看完以後我個人覺得這部電影沒意外會大多負評，因為大家最想看到的戰鬥、新

  進化、新合體進化、TV版合體進化的究極體....等等通通都沒有，戰鬥甚至只有一場半，

  BOSS戰基本不算BOSS戰等等.....會讓人負評。


  不過這部的文戲真的算很精彩，恐怖氛圍也掌握的很棒，每個人的智商都算在線上，重點

  是沒有像TRI那樣角色塑造崩毀，每位角色都還是他們的思考方法。


  其中大輔更是絕對的核心，那種永遠積極向上的個性在長大後更是難能可貴。


  不過如果你對新角色的故事與塑造完全不感興趣的話這部電影完全不適合去觀看。因為這

  是一部「類」與「烏科獸」的電影。


  PS:帝王龍甲獸!!你終於帥了!!!!


  這部電影的缺點與優點很明顯

  缺點:

  1.打鬥畫面過少

  2.沒新進化

  3.02組的戲份完全被新搭檔吃掉


  優點:

  1.文戲與探討的議題挺不錯的

  2.新搭檔描繪得還不錯

  3.恐怖氛圍營造很好


  我個人給這部電影打分7.5/10


  最後我想說小京完全是這部電影中的亮點啊，各種直球狂往小賢那邊砸過去。


  這部電影很明顯算是一個過渡電影，用做承先啟後，並且烏科獸得能力可能會與後續太一

  大和搭檔回歸有關係。


  這部電影重點照顧這對新搭檔很可能是為了後續的劇場版鋪路。


  而且在現在這種環境敢用這種文戲為主的方法來呈現這部劇場版是超級大膽的決定，因為

  很可能因此而獲得的是大量的負評而導致第三部劇場版被砍與預算縮水而無法做出本來預

  計規劃的後續。


  只能期望後續的數碼寶貝劇場版能夠繼續走下去。


  PS2:TRI被開除正史!!!完全是粉絲的勝利啊!!!!!!!!!!!!!!


  --

  HI 你好啊同場的朋友'
