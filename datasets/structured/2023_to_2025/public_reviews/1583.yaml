title: '[無雷] 韓影貴公子'
content: "本片和導演之前的風格迥異\n真真是一部黑色喜劇\n雖然常看此類戲劇的我滿早就知道劇情的可能走向\n觀影過程還是能享受懸疑待解的樂趣\n就算已經忙了一整天，以為自己會在戲院睡著\n\
  居然能從第一個鏡頭開始就專心認真的看到最後一個鏡頭\n全心全意的融入享受這部片，還流下黯然傷魂的眼淚\n\n金宣虎無疑是本片的顏值擔當和喜劇擔當\n雖然我並不覺得只有金宣虎可以演這個角色\n\
  但是他曾說過，角色呈現出來的樣子是導演和演員的雙人舞\n透過彼此的交互作用誕生出獨一無二的樣貌\n金宣虎在這片的的確確創造出一個專屬於他和朴導的迷人角色\n具有未來發展成系列作或貴公子宇宙的無限可能性\n\
  \n本片片名從悲傷熱帶改為貴公子，英文片名則是The Childe，也是很有趣的思考脈絡\n這點就留給大家進場探索囉：)\n\n--\n\n         真心希望，就會實現。\n\
  \n         我問過老人家，那就叫做心誠則靈。\n\n--"
