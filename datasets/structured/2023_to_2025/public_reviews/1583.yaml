url: https://www.ptt.cc/bbs/movie/M.1687780615.A.124.html
title: '[討論] 《貴公子》黑幫動作片魅力滿點'
content: '受友之託轉分享以下無雷觀後文



  《貴公子》6/26 午間進場 首刷


  劇情很緊湊，黑色幽默，但並不黑暗，看得很舒壓！畫面色調不會太暗沈、有壓迫感的音

  效、影片流暢度、還有暴力美學都處理的很好，有飛車也有跑酷，這樣的動作追擊片就是

  要上電影院觀賞才能看得出效果。


  兩個小時不知不覺就過了！

  前面人物介紹步調稍慢，但很有必要，除了各角色背景介紹，還讓觀眾感受一下兩位主要

  角色- 金剛于和金宣虎，有多瘋多狠！雖然我知道金宣虎演技不錯，但沒想到他也能駕馭

  這種角色，一出場真的有驚悚！金剛于我不熟悉，但也帥度爆表。


  有前半的鋪陳就會期待他們兩個惡角碰面，果然一碰面之間的張力和火花，真的沒話說！

  但凝重的氣氛也能製造出笑點，真的很厲害！


  因為有劇情也有反轉，就不多說。推薦大家趕快趁現在快去看，我去的時候只有小廳，售

  票小姐還不知道這部片，可能沒多久就會下片。這樣的好片一定要上電影院看，在家看就

  真的太可惜了！


  之後平台有上，打算再看一次，以慢速看一下壞人到底怎麼被一個一個幹掉的。


  --'
