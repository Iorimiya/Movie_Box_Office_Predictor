url: https://www.ptt.cc/bbs/movie/M.1687451508.A.AA6.html
title: '[好雷] 關於「貴公子」 觀影心得'
content: "此文為代PO，原作者沒有PTT帳號\n但希望更多人能看到這部好戲\n所以請我代為貼觀影心得\n\n以下文長有雷\n請謹慎服用\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n    我不愛看爽片，亦非類型片的常客，雖然總是以看電影作為日常生活娛樂，\n\
  但這篇關於「貴公子」的文章，無法作為無私的影評，仍是私心地從對宣虎演員\n的熱愛出發。\n\n    許多恆常的人生命題，可以用各種不同的媒介、風格來解。人與人之間的各\n\
  種質問，常常被嚴肅認真地討論，但亦無妨嬉笑怒罵地表達。尋常百姓的日子裡，\n有對「什麼是愛？」的疑惑；大富大貴的人家，也很常懷疑「家人、血脈究竟是\n怎麼一回事？」。當人生劇本已經寫定（投胎完成），用一輩子扮演的角色也被登\n\
  錄（黑幫/警察？專業高手/無名混混？凡人/魔女？）之後，我們能怎麼看待自己\n與周遭人的關係？即便再怎麼不堪的人，都需要感覺被愛，被需要、被善待，但\n是，這一切，如何可能？\n\
  \n    在我有限的，對朴勳政導演的認識中，不管撒了多少血漿、射了多少子彈，\n他在這些或漫天血色或闇黑污穢中，想要解開的，亦是這些大哉問。「闇黑新世\n界」中被輕視的黑幫接班人、夾在正邪之間的臥底警察、心裡滿是詭計的在位警\n\
  官，「魔女系列」中的平凡人與超人類們，哪個不是在這些光怪陸離、奇思妙想\n的劇情之間，在充滿利益、背叛、計算中，求一點無私、信任、用盡全力的、不\n為什麼的愛。而，那個並不很多人知曉，不知打哪裡來的貴公子，和那個在一天\n\
  之間拼了全力跑出生路的拳擊少年，以及那個殺人不眨眼、把人當牲畜看的財閥\n二代，心裡又何嘗沒有懷抱這樣的疑問？\n\n    從「貴公子」電影一開始的鋪陳，我們就知道那個從剪影出場、還沒有名字、\n\
  堅持穿著三件式西裝打鬥的人物，是個狠角色。他在殺戮中享受純粹的樂趣，對\n名牌的看中與喜愛，遠超過對人命的看中與珍惜。在「物」與「人」之間，他選\n擇了前者。但我們同時也知道，一個需要花一個月才買得到名牌鞋子的人，不可\n\
  能是百貨專櫃奉為上賓的高客。如果他是貴公子，那麼此時，他的「貴」氣只在\n於金錢堆砌出來的打扮，以及打殺能力高段的珍稀。相較於韓國社會中的財閥、\n大戶，靠包山包海綿延不絕的社會網絡收攏名、利，總是比別人早一步或者更容\n\
  易享盡奢侈的事物，「貴公子」終究是靠一捆捆現金買到一身華美的「冒牌貨」。\n同時，我們也從飛機上的橋段知道，「貴氣/平凡/卑賤」這個標籤人的尺度，\n或許可能有個絕對值來界定，但也常常是透過比較而來。「商務艙很貴」、「美式\n\
  英文高人一等」，如果不是曾經在這些界線中被推擠游移，哪裡知道被看輕的疼\n痛？如何在被社會排除之時，故作優雅地退場面對？而當對手瘋狂散彈槍似地破\n壞了他的「賓士坐騎」，他在乎的是財產的損失、是如何賠償、是保險可不可以\n\
  理賠。又有哪個真正富可敵國的大腕，哪個出生就含著金湯匙的公子小姐，會去\n關心這些馬上就有下人可以代為處理、打點的瑣事俗事？\n\n    「鳥之將死，其鳴也哀；人之將死，其言也善。」這句古老的諺語，在角色\n\
  的塑造上，發揮了作用。如果貴公子要從表象的貴氣，轉化為人格上的、真實的\n高貴，勢必需要一個有力的轉折點。但是，這個轉折點如果太過嚴肅，卻又可能\n讓故事走向過於深沈的黑暗與悲傷。於是，我猜測，金演員的個人特質在此處發\n\
  揮了極大的功效，也給了導演靈感。\n\n    在真實生活裡，粉絲所熟知，有關宣虎純粹的善良與純粹的天真，給了這個\n角色多面向的可能。因為預知生命即將終結，選擇極致地、用盡全力地，為一個\n\
  同類（Kopino）的生活福祉貢獻心力，是再合理不過的事。然而，這個「預知死\n亡紀事」是出於自身對日常生活的無知、謬誤歸因、懶散或者無厘頭，對角色的\n本身，以及扮演這個角色的演員來說，卻又是毫無違和感的人物設定。\n\
  \n    於是，在真實與虛構、日常與敘事之間，我們，這些熟悉演員的觀影者，也\n同時穿梭、交錯在「貴公子」與「金宣虎」之間。看他為小事爆氣、看他耍帥、\n看他鬥嘴、看他愛漂亮、看他好面子怕丟臉、看他在變臉之後可愛。這些部分對\n\
  虎粉來說，是持續綁在電影院座椅上的理由；然而對非虎粉來說，確也可能帶來\n意外的笑點，與對「貴公子」角色更立體、多樣的認識。畢竟，街頭生存，必得\n有些斤斤計較、油嘴滑舌、生張熟魏、否則無以為繼。相較於風度翩翩的「貴氣」，\n\
  宣虎的「貴公子」，不開口時俊美倜黨，開口後，卻滿是尋常日子裡的人間煙火。\n而這些對比與反差，既是角色的層次，亦考驗了宣虎表演的高度。不用說，這張\n考卷，他是得了個好成績！\n\
  \n    從我的觀點，朴勳政導演其實沒有要認真處理戈賓奴（Kopino）的議題，至\n少在這部電影裡面沒有。說穿了，主要是透過這樣的人物背景設定，來塑造角色\n\
  的血肉與紋理。\n\n    二次大戰之後，冷戰陣營對峙，軍事力量的集結與攻防，我們在看似硬核的\n地緣政治中，也看到了許多因為軍隊駐防而產生的社會關係、情感結構與互動。\n\
  1960 年代美軍駐防台灣，華燈初上的中山北路，有多少燈紅酒綠之下的美台混\n血在日後隱身，與我們共同生活在這片土地上？根據美日安保條約駐留日本國內\n的美軍，這幾十年間，又何嘗沒有在日本的土地上，製造出這樣不知鄉關何處的\n\
  美日混血？韓戰以後，美國在韓駐軍，韓國本地又哪會少了這樣被歧視、霸凌的\n美韓混血？諾貝爾文學獎得主賽珍珠自 1964 年創辦的「賽珍珠基金會」，初衷就\n是在幫助這樣的人們，這不是一個新的故事。\n\
  \n    相較於前面因為政治因素而產生的混血子女，朴導演在電影裡點出的，是亞\n洲四小龍興起之後，因為經濟起飛，因為口袋飽滿而到處「播種」的另一種跨境\n情慾流動及其後果。「貴公子」是韓國男性在菲律賓恣意忘情的激情；台商為了\n\
  生意打拼，在中國與東南亞移動過程中，透過「包二奶」展現「跨國商業雄風」\n（transnational business masculinity）之後，亦留下許多非婚生子女的無奈與哀愁。\n\
  在「通婚」與否作為族群融合是否透徹的最後一個檢查點的世界，在「純種」與\n「雜種」殘酷地區別了人的等級的生物性暴力中，那些無法進入法定婚姻的女人\n與孩子，被迫流連在不待見的陰暗處，忍受物質上的貧乏、關係上的拒斥、情感\n\
  上的殘缺。\n\n    像貴公子、馬可這樣的人們，可能一輩子需要處理自我肯定、匱乏的議題，\n也可能永遠沒有辦法為自己打造一個具有安全感、信任感的心理世界。更重要的\n\
  是，社會上有太多或隱或顯的偏見、歧視，黏貼在這些人的身上。要把這些標籤\n撕下來，或者不撕下來與之共存，都不是一件容易的事。我看見有影迷們期待貴\n公子第二集，可以來說說他的身世與養成過程。老實說，我一方面也盼望著，另\n\
  一方面卻又於心不忍。畢竟這樣的人生，過於凶險，很多辛苦。無數為了生存踩\n在道德邊界上的人們，在某個關鍵點，可以決定自己要走向善的一方，或是惡的\n那面。然而，不管是哪一步，在我們看來是故事，在當事人身上是心酸。但如果，\n\
  這些角色演出，是讓宣虎一步步邁向表演巔峰的必要試金石，那麼，我會繼續綁\n在電影院椅子上，享受預期的心痛並快樂著。\n\n    關於動作設計的部分，我是沒有資格發表議論的，除了行雲流水，明快流暢，\n\
  無話可說。雖然還是要重複一次我不是爽片的愛好者，但看宣虎總選擇在制高處\n搶勝，並在片中以一擋十，有槍用槍，無槍自在的身手與表現，內心舒暢無比，\n正義感非常滿足。人們說有種東西叫「暴力美學」，過去我總嗤之以鼻，覺得以\n\
  美學來包裝暴力，十分投機。這一次，我總算可以敬謹地接下這個詞彙，作為分\n析文本與影像的工具。在打人與被打、在殺人與被殺之間，在每個舉手、踢腿、\n轉身、拔槍出招的當下，如果觀影者只剩下屏氣凝神，並且忘記時間的存在，那\n\
  我說，這應該就是暴力美學。\n\n    1953 年詹姆士龐德被創造出來，自 1962 年被拍成電影，全球影迷跟著 007\n一邊完成特工任務一邊獵艷了 60\
  \ 年。其後，我們有「不可能的任務」中運用最\n先進的科技和最帥姿勢的伊森韓特，有「神鬼系列」中忘記自己又找到自己的傑\n森包恩，有「即刻救援」系列號稱地表最強老爸的布萊恩彌爾斯，還有為了愛狗\n\
  重出江糊的殺手約翰維克。這些可說是系列類型片的前輩們，打造了一個有冤報\n冤、有仇報仇；有愛尋愛，無愛解恨；東西方元素俱陳，人性亮暗面都在的「神\n人世界」。而今起，我們有了一個還沒有名字的「貴公子」。多希望不久之後，他\n\
  有機會被起名呼喚，為影迷帶來一部部難以忘懷的電影故事。更希望，當日後人\n們提到「貴公子」，大家都知道，這三個字等同於熱愛演戲、善於演戲，也全心\n投入的金宣虎。\n\
  \n--\n                                  06/23 00:34"
