title: '[無雷] 滿難看的貴公子'
content: '優點：


  金宣虎有演出特色來，那個笑容讓人難忘


  飆車戲好看


  反派演技不差，氣場與派頭很棒



  缺點：


  另一位主角姜泰柱，從頭到尾一副被杰哥強上後的苦瓜臉


  明明劇情很簡單，卻很拖戲，有很多可以直接砍掉的角色


  雖有反轉，但沒有讓人驚艷的感覺，只有「蝦」


  肉搏戲不及格，鏡頭晃來晃去，明顯不太會處理


  評分：


  5.3/10




  -----

  Sent from JPTT on my Google Pixel 6a.


  --'
