url: https://www.ptt.cc/bbs/movie/M.1542870475.A.A3B.html
title: '[新聞] 模犯生團隊新作貴公子阿派單挑陰間使者'
content: '新聞網址：


  泰片《模犯生》中飾演「貴公子阿派」的James演出由同一團隊打造的新作《借來的100天

  》，飾演一位借屍還魂的遊魂，片中「陰間使者」角色的安排與磅礡的視覺特效，被喻為

  泰版《與神同行》。


  《借來的100天》由《模犯生》團隊耗時10年打造，由驚悚電影《鬼影》（Shutter）和《

  連體陰》（Alone）導演帕德潘王般（Parkpoom Wongpoom）執導，《模犯生》中吊兒郎當

  的「阿派」James這次一改形象，展現層次豐富的高難度演技，挑戰自己的極限，他說：

  「我為這部電影下了很多苦心，這雖然只是我的第2部電影，卻可能會改變我的一生。」

  泰國超夯女團BNK48高人氣隊長、被粉絲暱稱為「Cherprang」的雀普蘭阿里卡（

  Cherprang Areekul）獻出大銀幕處女作，飾演James的夢中情人，也是解開高中生死亡之

  謎的關鍵。


  電影描述一個遊蕩人世的靈魂，意外獲得重生的機會，借屍還魂住進已死亡的高中生小旻

  的身體裡，重新展開人生。他試著融入小旻的家庭和學校，也遇見讓人心跳加速的學伴小

  派，然而這一切都是有期限的，他必須在100天內查出小旻的死因，屆時如未完成任務，

  他將魂飛魄散、永不超生，電影明年1月11日在台上映。


  --'
