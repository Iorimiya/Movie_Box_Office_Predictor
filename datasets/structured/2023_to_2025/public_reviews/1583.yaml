title: '[情報] 金宣虎《貴公子》前導預告'
content: '《》團隊動作鉅獻《》

  首部主演電影！6/21(三) 尋血追擊




  唯一的目標！瘋狂的追擊！



  《》6月21日（三）尋血追擊


  《》系列作Ｘ《浴血圍城88天》製作團隊精彩動作鉅獻！


  《海岸村恰恰恰》首部主演電影，扮演神祕人物挑戰高難度動作場面！


  以「戈賓奴 Kopino」為題材，刻劃菲韓混血兒捲入離奇事件的驚心巨作！


  「怪物新人」姜泰柱以1980比1競爭率脫穎而出扮演命途多舛的混血少年！


  拳擊手出身的少年，突然成為神祕人士的目標遭到追殺……



  資料來源：


