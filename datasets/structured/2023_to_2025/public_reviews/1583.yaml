title: '[ 好雷] 貴公子'
content: '平板排版如不易閱讀請見諒。




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~


  因為我不喜歡黑幫、血腥、殺戮的電影，


  所以朴導之前的電影我一部也沒辦法看完。


  即使是當時喜歡的演員主演的作品，也無法忍受。


  髒話部分，好在我已經在《黑暗榮耀》領受很多了。


  在這裡，髒話後來有時也會成為笑點之一。



  這次的《貴公子》多了很多故事脈絡與輕鬆有趣的元素。


  1980個試鏡者中脫穎而出的姜太柱飾演的Kopino


  （韓國爸在菲律賓播種的混血小孩）Marco，


  明明是尋親之旅，不明原因就被三派人馬追殺，


  隨著編導一步步抽絲剝繭，終於知道瘋狂的追逐究竟所因為何。


  追逐戲非常精彩，演員非常累XDD



  姜演員這孩子，明明不是海歸，硬是靠自學練了一口母語就是美語的好口音，


  萬中選一當之無愧。



  其實在一開始的預告，說貴公子是亦正亦邪的謎樣角色，


  我就知道他不是反派了。


  但他總會把目標稱為「朋友」，對Marco也是，


  讓一開始他為何追逐Marco真的很謎。


  到他殺了全車的人獨留Marco，還示意提醒Marco要繫安全帶，


  到開槍一直打不到，開車追只在高架橋上對Marco叭叭…


  （明明只要開車窗伸手舉槍Marco就必死無疑了）


  這時更確定貴公子根本不想殺Marco，但為什麼要追成那樣，除了製造謎團，


  還有朴導擅長的動作戲元素，應該也有製造笑點的作用？


  看過很多韓國電影，但金宣虎那眼神清澈的瘋狂演技我還是第一次看到。


  終於明白朴導這角色不作他人之想的原因了。


  金宣虎演員連青筋、聲音都在演戲，真是太厲害了！


  咳嗽可以演，但沙啞的嗓音到底要如何演出來呢？


  用純真的臉殺人時的那股反差狠勁真是魅力無窮。


  演員除了瘋了般的好演技，武打動作的俐落也下了很多苦心。


  金宣虎賦予了Pro角色血肉、靈魂，與各種魅力。


  金宣虎在此片是喜劇擔當，也是「貴公子」意象擔當。


  因為在最後反轉他也是Kopino，


  觀眾此時可以明白此角色為何總是全身名牌、注重形象。


  想必原生家庭讓他受盡歧視，


  所以必須要成為Pro，用高強的武功、華麗的外表保護自己。


  看到最後貴公子笑著說「因為我也是Kopino 呀」真是令人心疼。



  當然金剛于韓理事的部分也有有趣與魅力之處，


  但財閥看輕他人、草菅人命的種種實在無法苟同。



  電影的故事性也讓我大感意外，不斷的反轉劇情充滿趣味與魅力。


  演員對細節的銓釋更是讓我們朋友間另外開一個聊天群「貴公子研究所」

  不斷的分享與探討。

  如果有沒看清楚的，就再去戲院看、再去看…


  因為電影真的很好看，而且細節好多。


  最後的槍戰也非常精彩，電光火石間，一陣咻咻咻常讓人想拉時間軸看清楚剛剛到底發生

  了什麼？XDD


  Pro手邊可以操到什麼傢伙就可以用那傢伙來解決敵人。


  敏銳的觀察力、高強的武功，


  還有路上撿到長槍的能力讓人嘆為觀止。XDDD


  果然如韓理事說的「Pro…認證！」



  高雅拉在一群男人之間不知道有沒有起到「中和、柔性」的作用？


  因為她也是一個狠。


  除了飛車追逐，故事主線是由高雅拉飾演的角色講出來的。


  其他部分發揮不太大有點可惜。


  把貴公子的車打成峰窩而且無法理賠還要讓他得密集恐懼症的程度，


  應該是笑點作用。



  是有劇情有笑點的動作爽片，大推！！


  至於能不能滿足愛血腥的，我就不清楚了。


  編、導、演全部在線。很多畫面藏著細節，很佩服導演。



  --'
