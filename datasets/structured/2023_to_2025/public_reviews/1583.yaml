url: https://www.ptt.cc/bbs/movie/M.1687768605.A.DE5.html
title: '[好雷］貴公子 '
content: '代同行友人轉發女兒真實觀後感

  文章無加油添醋不帶粉絲濾鏡...

  分享給還在猶豫要不要進場支持的你們


  === === === 以下正文 === === ===


  雖然並非粉絲，也不是暴力美學電影的愛好者，但作為金宣虎粉絲的女兒，早在數個月以

  前便

  開始被貴公子三個字轟炸，有幸作為第一批觀賞的影迷，還是來說說我對貴公子的感想。


  對我來說，一部片的成與敗取決於主角有沒有將角色刻在我心裡，並激起我想跟他一起生

  活在同一個世界的好奇心，很明顯的，有點貴氣、同時自帶搞笑氣息的貴公子有做到這一

  點。


  電影前半部導演花了不少時間在讓觀眾建構「馬克」、「貴公子」這兩個角色的形象，到

  了中段我們不斷看到你追我跑的場面，於是開始困惑，究竟是為了什麼而跑？為什麼大家

  看似不同陣營目標卻一樣？在貴公子一次次失手後也開始懷疑他口中的專家真是如此嗎，

  還是另有意義？在眾多疑問下期待已久的大場面總算開始。


  看似有些兩光的貴公子神不知鬼不覺的深入敵營，乾淨俐落的幹掉敵人，與先前一個連鞋

  子沾到血都要尖叫的人形成極大反差；一個家財萬貫的富二代殺人不眨眼，卻連轉帳都要

  兩次才會成功，他們是貴公子和韓理事，卻不會讓觀眾聯想到金宣虎和金剛予，不只是對

  打精彩，就連兩人面對面站著直勾勾的盯著對方講話都相當有戲，不禁讓人覺得當初導演

  堅持這個角色由金宣虎出演完全正確。


  雖然打鬥戲碼鏡頭有些晃，但瑕不掩瑜，精彩的動作戲和演員的火花足以讓我忘記些微的

  暈眩。在這部電影中我們看到的不止是暴力美學，還有演員本人渾然天成的魅力、對話及

  舉手投足散發的幽默、角色互動產生的溫馨和善良。


  至於結局如何、貴公子究竟是何許人也就交給各位去戲院找答案了。




  --'
