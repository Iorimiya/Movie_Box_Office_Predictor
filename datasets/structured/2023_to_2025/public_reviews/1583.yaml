url: https://www.ptt.cc/bbs/movie/M.1687613995.A.9BF.html
title: ' [好雷] 韓影《貴公子》金宣虎、金剛于主演'
content: "作者: yedda1216 (達達) 看板: KoreaDrama\n標題: [心得] 韓影《貴公子》金宣虎、金剛于主演\n時間: Sat Jun\
  \ 24 16:27:19 2023\n\n因為電影還在上映中，前面先來點無雷介紹\n\n這部電影，是金宣虎第一部大螢幕出道的電影\n導演是《新世界》、《魔女1、2》的朴勳正導演\n\
  導演擅長的暴力美學，在這部作品裡依然可以欣賞到\n但貴公子少了以往的暗黑風格，多了不少的黑色幽默\n\n這部電影原名為「悲傷熱帶」，後期剪輯時改名為「貴公子」\n\
  導演在採訪中說：「因為拍著拍著，就不悲傷了。」\n不知道為什麼，覺得導演應該是被金宣虎跟金剛于帶偏了XD\n電影「貴公子」裡，其實從頭到尾都沒出現這三個字\n\
  與其說是人名，不如說是一種角色形象的呈現\n金宣虎在記者會採訪中說：「金剛于的角色也可以是貴公子、馬可也是貴公子，他\n自己是角色為貴公子。」\n到底貴公子指的是誰，可以由各位自己去戲院裡觀看體會\n\
  \n在四刷之後，我覺得我應該可以盡量不帶粉絲濾鏡來分享心得\n這部戲感覺很像要塑造男版「魔女」的感覺\n但是劇情跟「魔女」相比我覺得差了一點，但是幽默感有加分\n\
  這部的笑點集中在金宣虎跟金剛于兩位演員的戲份上\n看他們兩位飆演技也是看點之一\n尤其是看慣了呆萌的金宣虎，要看他演瘋子般的殺手，還真是滿新鮮的\n而金剛于也演出了那種完全沒有一點人性的富二代\n\
  看兩人對戲也是一種享受\n另一個看點就是一再反轉的劇情\n雖然有些東西好像很好猜到\n但是還是有一些讓人會心一笑的反轉\n\n\n\n拳擊手馬可輾轉於菲律賓各個非法競技場，與生病的母親相依為命。為了籌措\n\
  母親的手術費，馬可決定前往韓國尋找從未見過面的生父，沒想到路途中卻遇\n上神祕男子「貴公子」（金宣虎 飾）的追擊。除了貴公子，還有富二代韓理事\n（金剛于 飾），以及在韓國與馬可重逢的神祕女子允珠（高雅羅\
  \ 飾）。各有\n目的的他們接連現身，在無法預測的混亂與瘋狂中，馬可即將揭開令人衝擊的真相……\n\n\n\n\n\n以下開始有劇情雷~~~\n\n\n\n\n\
  \n\n\n\n~*~*~*~*~*~*~*~*~*~*~*~我是防雷線~*~*~*~*~*~*~*~*~*~*~*~*~\n\n\n這部戲明著在說馬可找尋父親的故事\n\
  暗著在說「專家」貴公子的故事\n\n\n電影的開頭，在一個陰暗的倉庫裡，就先介紹了金宣虎所飾演的這位「專家」有多厲害\n在雙手被綁的情況下，可以輕鬆地掙脫，不疾不徐的解決掉綁匪\n\
  整部片他一直強調自己的專業的、是專家，不帶任何情感，一切都是工作\n他是個全身名牌、愛乾淨、注重形象、舉止優雅的殺手\n但在追擊的過程，時不時地落漆、出點小槌，讓你會心一笑，懷疑他真的是專家嗎？\n\
  是不是只是虛張聲勢而已\n追擊過程，那個笑到讓你不寒而慄的笑容，還有讓你覺得他就是瘋子的行為舉止\n讓你搞不清楚他到底是哪邊派來的\n\n馬可，身為戈賓奴備受歧視\
  \  (戈賓奴：韓國男人與菲律賓女人生的混血兒)\n靠打拳擊賺錢，為了湊到母親的手術費，什麼事情都願意做\n甚至因為這樣而要找尋韓國的親生父親\n但是，那些來這裡遊學、從商的韓國男子，在菲律賓播種後，就始亂終棄\n\
  怎麼可能回來找他們\n但這次不一樣，馬可的生父來找他了\n馬可的父親是韓國大財團的理事長，因為身體不好，所以急著要找這位親生兒子\n而馬可也因此踏上了飛往韓國的尋親之旅....\n\
  \n接著劇情帶到了韓國，韓理事出場，因為一些負面報導，讓他很生氣\n從這裡來帶出韓理事是個有多心狠手辣的人\n殺人不眨眼，拿著長槍，說射殺就射殺\n雖然這裡要鋪陳韓理事有多沒人性，但說實在的，我覺得這段太冗長\n\
  如果可以縮短一點點會更好\n\n回到了韓國，就開始了一系列的追逐戰\n馬可真的很可憐，從菲律賓就在跑，來到韓國繼續跑\n跑一整天下來，馬拉松全馬都不知道跑幾次了\n\
  從1980人中脫穎而出的新人姜泰(貝主)\n一路上搞不清楚狀況在異國被追殺，又無助又疲憊又絕望的表情演得不錯\n\n\n先是被「專家」追，從樹林追到大馬路，跳下高架橋後又追到住家小區\n\
  在公路上那場追逐戲，有些細節真的很有趣\n注重形象的「專家」，明明跑得很累，但只要馬可轉頭看他，他又會裝輕鬆\n在小區裡面的追逐，被馬可打了一拳後，也要左顧右盼看看有沒有人看到\n\
  似乎不容許自己的「專家」形象有一點毀掉\n\n馬可好不容易逃掉後，上了允珠的車\n接著開始三方飆車追逐\n飆車這裡，覺得速度感有出來，滿好看的\n\n雖然高雅羅也是主演之一，但老實說，她的角色我覺得沒什麼太大的表現\n\
  除了飆車追逐，以及負責說明來龍去脈之外，好像就沒了....有點可惜\n\n在明白了一切事情之後，馬可終於見到了父親\n來到了別墅，我覺得最精彩的一段就是從這裡開始了\n\
  馬可的父親，哥哥找她馬可的父親、哥哥找他，原來只是為了需要他的心臟\n移植他的心臟讓爸爸活下來，才能免於財產落入同父異母的妹妹手裡\n\n馬可被送上了手術台，手術室裡，「專家」神不知鬼不覺的混了進來\n\
  弄暈了醫生、趕跑了醫護人員，殺了保鑣〝救了〞馬可\n其實他是要利用馬可跟韓理事勒索一千萬美元\n從這裡開始，就可以看金宣虎跟金剛于兩人一來一往的對戲\n對話中帶點笑點，你一言、我一句的誰也不讓誰\n\
  然後在一連串的對峙後，「專家」拿到了錢把馬可交出去後\n離開前還故意挑釁韓理事，因此韓理事也沒打算放過他了\n前面「專家」強調自己很專業、是專家，雖然中間一直落漆\n\
  但是，最後這一大段的槍戰，就可以看出他到底專業在哪裡\n動作之快、反應之迅速，身邊的任何物品都可以變成他殺人的武器\n只要一拿到手，馬上可以攻擊對方致命的點\n\
  一連串的武打戲，行雲流水般非常的順暢\n這段精彩到我很想一直重播\n但可惜的是，動作太快，一開始看會覺得畫面很晃，看不清楚\n看到了第四次才能仔細地看到，到底槍戰如何開始，中間到底拿了什麼打人\n\
  \n整部片雖然開頭在故事的鋪陳上有點緩慢\n但後半部這些追逐戲、跟槍戰是真的很精采\n\n最後在解決所有敵人後\n反轉的開始，看完我只能說\n馬可真的是有夠倒楣加無辜\n\
  他只是一枚被利用的棋子罷了，卻差點連命都要沒了\n\n有人說「專家」是善良的\n人之將死，其言也善\n但他真的是善良的嗎？\n他們其實都是為了自己的目的在利用別人\n\
  為了錢在做事情\n而且，不要忘了他就是個不帶感情的殺手\n雖然他保護了馬可\n但他也絕非善類\n\n\n導演在記者會說：「這部片如果表現不錯，跟金宣虎沒有鬧翻的話，可能會有第二部。」\n\
  看完以後，就會知道為什麼導演會覺得這角色非金宣虎莫屬\n而且貴公子感覺的確也是可以拉出來獨立寫成故事的人物\n全片四個主角，就「專家」貴公子這個角色最豐富、最立體\n\
  也是為什麼，看完了電影，會覺得金宣虎令人最印象深刻\n雖然他們的戲份都差不多，但真的就是「專家」這個角色最讓人喜歡\n這角色塑造成了一個瘋瘋的，可愛又迷人的反派角色\n\
  優雅、敏感，還很怕痛XDDD\n也就是為什麼會覺得「貴公子」就是他\n\n「貴公子」雖然劇情上感覺沒有那麼的有深度，但是整體來說還是一部值得進戲院看的劇\n\n\
  第一次寫電影心得文，文筆不好請多多諒解\n感覺我已經快把整個故事寫完了，但還是保留了關鍵的結尾跟有趣的反轉\n希望大家可以進戲院支持~~~\n\n--\n1980人中脫穎而出的，真的演得很不錯，從頭到尾無助的眼神\n\
  還有後面的絕望，希望以後能有不錯的發展\n新聞好像有說，有些橋段導演希望宣虎盡量用詼諧的表情表現\n但是表現出來跟他想像的貴公子不同，有了金宣虎特色的貴公子誕生了\n\
  這部跟之前的戲風格真的很不同\n\n                                  06/24 21:42"
