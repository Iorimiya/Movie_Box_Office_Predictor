url: https://www.ptt.cc/bbs/movie/M.1610869509.A.F33.html
title: '[新聞] 超邪門！貴公子男神驚爆病態陰暗面 新片'
content: '新聞網址：

  完整新聞標題: 超邪門! 貴公子男神驚爆病態陰暗面 新片女主角亦出事

  新聞來源: UDN聯合新聞網

  聯合報記者 蘇詠智報導


  新聞內容:

  出身自石油大亨家族的美國男星艾米爾漢莫，因被揭露發布有性虐待與食人傾向的社群網

  站留言，從昔日觀眾眼中的貴公子男神，變成人人害怕的變態，曾與他交往的女性更接連

  跳出來透露過去被他的陰暗面驚嚇，渾然不知他的外表和內在竟有如此大的反差，他喜愛

  在性愛過程中扮演主宰、對伴侶施虐，與他擅長飾演的天菜帥男有極大距離。


  艾米爾漢莫的留言風暴，讓他一度被看好的演藝事業深陷危機，英國「每日郵報」加碼發

  出一支他開車時的自拍影片，畫面中的他不僅疑似吸毒，更邊駕駛邊喝酒，讓他已經敗壞

  的形象更難洗白。他的舊愛們指控他沉迷性虐待與奴隸的幻想中，看到她們不小心受傷，

  甚至會對傷口又吸又舔，好像享受嚼食的快感，十分讓人不舒服。


  對此，艾米爾雖然一度反駁，認為是遭人誣陷，然而他本來談妥的兩部片、其中一部是和

  珍妮佛洛佩茲合作，已經都退出，手上還有一部戲要扮演「教父」的製片，描述這部經典

  在籌拍時的幕後秘辛，原本備受矚目、也有可能瞄準獎項，現在都不知道是否該把他換掉

  ，但觀眾最在意的，是「以你的名字呼喚我」續集。


  同志片「以你的名字呼喚我」讓艾米爾與扮演慘綠少年的提摩西夏勒梅雙雙走紅，續篇若

  不能由原班人馬再攜手，一定大大走味，偏偏艾米爾現在的形象實在很不適宜再回歸演這

  種浪漫氣氛的內容。歐美媒體報導，艾米爾過去在影壇同業之間，就已經頗有惡名，至少

  某位有頭有臉的男星曾在受訪時提到他，要求記者停止錄音、不准透露自己的身分，然後

  講了一堆為何對他很反感的理由，顯然相當不欣賞他，原來事出必有因。


  詭異的是，艾米爾最近推出的影片，是去年10月初在Netflix上架的「蝴蝶夢」，當時是

  女主角莉莉詹姆斯鬧出在羅馬激吻人夫的風波，因而在好幾次宣傳活動缺席，很晚才與艾

  米爾會合、一起造勢，那時外界還同情艾米爾被捅出大婁子的莉莉拖累，殊不知，3個多

  月後換他爆出更大條的醜聞，且情節嚴重性遠遠超過，「蝴蝶夢」主角先後出大事，都危

  及演藝事業，真的是非常邪門。


  --'
