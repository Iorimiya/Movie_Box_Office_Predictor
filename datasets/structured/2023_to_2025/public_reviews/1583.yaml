url: https://www.ptt.cc/bbs/movie/M.1687919222.A.C2B.html
title: '[普無雷] 貴公子'
content: '當金宣虎受到私生活爭議疑雲纏身時，朴勳政仍舊維持金宣虎的選角決定在事件告終後如

  期拍攝這部黑幫電影，並且再拍攝完〈貴公子〉後又馬上與金宣虎再宣布合作下一部電影

  〈暴君〉(暫譯)，只能說朴勳政真是在金宣虎的大銀幕生涯上成為了開門恩人


  相較於朴勳政上一部在網飛上映的〈暗夜天堂〉整部電影的藍色色調與悲愴，〈貴公子〉

  倒是添加了喜劇電影的調性並且塑造了一個亦正亦邪特殊氣質的男主角特務由第一幕至結

  尾穿梭整部電影


  朴勳政這次仍舊把玩他熟悉的黑幫人設塑造，在反派角色身上設計了許多篇幅，但是在整

  部兩小時內的電影在反派身上鋪陳稍嫌過多，雖然營造了反派背景的紮實敘述，但在電影

  中段過於冗長的意外衝突，讓觀眾與另一個新人主角馬可內心一樣充滿了：what the fuc

  k is that？


  舉例來說在商業電影類近期的〈捍衛任務4〉裡頭侯爵靠著刺穿無名氏手掌的一幕戲用行

  動與氣質讓觀眾能夠迅速感受到反派頭目的兇殘與不擇手段，〈貴公子〉在這部分稍嫌拖

  戲，在把電影鏡頭跳脫兩個男主角的規劃不夠精準，導致節奏在中段差了點


  除了中段的劇情節奏較差之外，這次朴勳政在結尾的大戰呈現的也不夠好，這種黑幫肉搏

  槍戰的大戰要是畫面越看不清楚主角的身手線條或是主角使用槍枝的頻率過多都會是遮掩

  打戲安排不足的表現，〈貴公子〉在最後大戰的呈現只能說差強人意，相較於上一部〈暗

  夜天堂〉全汝彬收尾的簡單俐落與狠勁，〈貴公子〉或許是受限於金宣虎不是以動作演員

  背景出身的限制，在呈現這種大規模開無雙的動作戲只能以這種成品呈現只能說非稍嫌可

  惜


  不過對於台灣的偏愛(台灣金宣虎的粉絲名)來說，能夠在大銀幕上面看到金宣虎的迷人酒

  窩與帥氣笑臉基本上一切都很值得，朴勳政跳脫上一部的沉悶風格與折磨，〈貴公子〉裡

  頭逗趣的演員對白，金宣虎如影隨形的瘋狂追擊與邪魅的表情特寫，在看久了乖乖牌洪班

  長或是暖男韓志平，來一個人設完全不同於以往的"Pro親古"，對於偏愛的銀幕體驗還是

  非常過癮的，也寄望下一部金宣虎跟朴勳政的〈暴君〉能夠帶給偏愛們更多不一樣金宣虎

  的面貌


  --

  金剛于的表現還行，但是導演真的幫他加太多戲了


  另外高雅羅的戲份最多餘

  結尾收的太快，在最後回憶的老套路很常見，但是前段電影沒有稍微留一些線索，會覺得

  結局收的沒有太多驚喜感'
