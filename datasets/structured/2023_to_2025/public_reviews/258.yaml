url: https://www.ptt.cc/bbs/movie/M.1751079515.A.013.html
title: '[好微雷] 窒友梅根 轉型很有趣'
content: '先講結論，如果你看過第一集，然後看到第二集預告覺得有趣的人就該去看～




  劇情不囉嗦，很快的介紹新敵人，然後快速的讓梅根回歸，劇中出現的道具伏筆都有回收

  ，梅根滿滿的嘴砲，不過他的主要核心還是專注在保護凱蒂，要看滿滿的機器人打架可能

  會失望，大概就是女性版本的死侍第一集不會有太血腥的畫面，基本上會帶過去。



  基本上這集改動成非驚悚片，我覺得很合理，畢竟第一集全世界都知道梅根會發瘋了，如

  果用同樣的模式拍片，應該也沒有新鮮感，倒不如直接改變風格


  可惜受到暑假檔期大片夾殺，還有柯南出來搶票，可能票房不會這麼好吧@@




  --'
