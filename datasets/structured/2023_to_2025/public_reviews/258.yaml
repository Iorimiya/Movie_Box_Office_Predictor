url: https://www.ptt.cc/bbs/movie/M.1751266492.A.B9F.html
title: '[超好雷] 窒友梅根 2.0'
content: '上個周末看了F1、柯南、窒友梅根


  前面兩部看完出戲院沒任何印象在演什麼


  梅根這部反而讓我2度泛淚


  梅根延續第一部的精神探討AI還有親情的議題


  這次又加入更多笑點還有武打動作


  算是成功的續作轉型


  看到梅根為了保護凱蒂事先幫他們打造了一個地下基地


  還幫凱蒂設計了專屬他的房間


  結果梅根實體亮相是一個殘破不堪的機器人 這邊看了有點感人


  感覺就像凱蒂的母親住在梅根身體裡面 她不計前嫌一心只想保護凱蒂


  中間還有一段 梅根開導潔瑪的片段 說教的口吻真的很像一個母親



  然後這集還加入了一個正妹反派 艾蜜莉亞


  那個臉蛋配上機器裝再加上俐落的武打 根本就是艾利塔2.0


  外型真的太迷人了一點都不讓人討厭她 最後面吸收黑盒子能量變身也很帥


  不過一下就被收掉了 真的有點小可惜


  總之這部續作拍得很有誠意 有正妹 有搞笑 有感人 有武打


  最後的片尾音樂也很動感


  --'
