title: '[新聞] 魔性舞蹈也救不回 窒友梅根2.0票房慘淡'
content: '魔性舞蹈也救不回！《窒友梅根2.0》票房慘淡背後的五大原因分析


  2025-07-02電影神搜




  2023年，《窒友梅根》(M3GAN) 以 1200 萬美元的製作成本締造了 1 億 8000 萬美元的

  全球票房奇蹟。


  這個穿著白色連身裙、留著金色波浪捲髮的 ai 娃娃，憑藉著她的殺人舞步和嗆辣態度迅

  速走紅網路，一時席捲抖音。


  布倫屋製片公司 (Blumhouse Productions) 和環球影業看到這個 IP 的巨大潛力，迅速

  啟動續集計畫。


  然而，時隔兩年後的《窒友梅根2.0》卻遭遇現實打擊。


  儘管製作成本提升至 2 500 萬美元，但首週全球票房僅有 1800 萬美元，北美市場更是

  只有 1100  萬美元，相較於前作超過 3000 萬美元的首週成績，下滑幅度高達 66 %。


  這樣的表現不僅讓製片方大跌眼鏡，也宣告這個曾經炙手可熱的科技恐怖 IP 陷入前所未

  有的困境。


  導演傑拉德約翰史東 (Gerard Johnstone) 重新執導筒，延續前作設定，講述梅根大開殺

  戒兩年後，她的創造者潔瑪被迫重新啟動梅根，來對抗一個名為艾蜜莉亞的軍用級機器人

  。




  《窒友梅根2.0》（來源／IMDb）


  五大致命傷：續集為何失去魅力？


  1.網路爆紅的一瞬火花


  《窒友梅根》的成功，很大程度建立在網路迷因文化上。


  她的魔性舞蹈迅速在社群媒體上爆紅，吸引大量年輕觀眾。


  然而，正如所有網路現象一樣，這種熱度往往來得快、去得也快。


  電影本身沒有問題，可惜的是故事很難展現新意，粉絲們就轉向其他事物了。


  值得一提的是，原本布倫屋趁勝追擊，要在 2026 年推出另一部名為《靈魂伴侶》(Soulm

  8te) 的衍生作品，講述一個男人因妻子死亡而購買機器人伴侶的故事。


  2.上映檔期的戰略失誤


  選擇正確的上映時機對恐怖片來說至關重要。《窒友梅根》在 2023 年 1 月上映。


  當時，除了已經上映四週的《阿凡達：水之道》 外，電影市場幾乎沒有其他強勁對手，

  觀眾如果想要進電影院，選擇相當有限。


  然而，《窒友梅根2.0》在競爭激烈的夏季檔期上映。


  不僅有布萊德彼特主演的賽車電影《F1》，還有環球影業的《馴龍高手》真人版及迪士尼

  的《星際寶貝》等電影。


  在這樣的激烈競爭中，一部中等預算的恐怖片很難脫穎而出。




  《窒友梅根2.0》（來源／IMDb）


  3.從恐怖轉向喜劇的定位迷失


  最關鍵的問題在於，《窒友梅根2.0》在行銷策略上過度強調喜劇性，而淡化恐怖氛圍。


  在續集中，主角從反派轉變為英雄，電影類型也更偏向動作片而非恐怖片。


  梅根真正的從窒友變成摯友。可能會讓某些喜歡恐怖片的影迷失望。


  4.現實中的AI 更讓人恐慌


  而隨著現實世界的 AI 快速發展，也讓梅根的設定相形失色，因為這對大眾來說已經不再

  是什麼令人眼睛為之一亮的事物，取而代之的是稀鬆平常的眼光。


  儘管《窒友梅根2.0》試圖更與現實生活靠攏，但仍挽救不回觀眾的興趣。




  《窒友梅根2.0》（來源／IMDb）


  5.布倫屋製片的困頓期


  最後，回到製片公司的身上，曾以低成本恐怖片大放異彩的布倫屋，在 2025 年的多部作

  品都表現平淡，像是《狼人》、《院中的女人》、《無線殺機》等片，都沒有獲得驚艷的

  成績。


  連續的市場表現不佳，也正反映出布倫屋正經歷觀眾口味的變化、串流媒體的壓力等影響

  。



  新聞網址：




  可是看電影版上這部片好評還蠻多的耶～


  希望布倫屋接手的《奪魂鋸》不要又搞垮了......


  --'
