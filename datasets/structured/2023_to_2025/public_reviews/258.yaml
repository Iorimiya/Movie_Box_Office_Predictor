title: '[討論] 窒友梅根2.0票房來到3000萬美金'
content: '現在新聞沒報了，因為窒友梅根2.0已經跌到票房第六名，不過全球上周僅僅只有1700萬

  美金，然而這周上升到了3000萬美金


  一開始報成本3500萬，然後是2500萬，然後是1500萬，也不知是真是假




  其他票房，侏儸紀世界神秘數字有人報了，報其他的



  遙遙領先第二名的《F1》在第二個週末從 3,732 家影院又增加了 2,610 萬美元的票房，

  比首週末下降了 54%。到目前為止，這部 Apple 電影在北美已經產生了 1.09 億美元的

  收入，全球票房在上映 10 天後達到 2.936 億美元。《F1》的成本非常高昂，製作成本約為 2.5 億美元，因此這部主打電影需要多跑幾圈才

  能證明其高昂的價格是合理的。


  第三名是《馴龍高手》，上映第四個週末在 3,714 塊銀幕上獲得了 970 萬美元的票房。

  這部家庭友善的重啟電影迄今已在北美創造了 2.24 億美元的收入，全球票房達到 5.16

  億美元。


  另一部適合闔家觀賞的迪士尼與皮克斯動畫電影《地球特派員》（Elio）以 490 萬美

  元的票房排名第四，這是它第三次上映，在 3,235 家影院放映。這部星際冒險片在北

  美僅創造了 5,400 萬美元的收入，全球票房為 9,600 萬美元。儘管評價不錯，但這

  部預算 1.5億美元的主打電影正成為皮克斯歷史上票房最低的電影之一。


  《28年毀滅倒數》（28 Years Later）以 460 萬美元的票房進入前五名，比前一個週末下降了 53%。上映三個

  週末後，這部喪屍續集在北美已累積 6,020 萬

  美元的票房，全球票房為 1.258 億美元，而製作預算為 6,000 萬美元。


  另外值得注意的是，迪士尼的《星際寶貝》（Lilo & Stitch）翻拍版全球票房已達到

  9.72 億美元


  --

  不是首周了神秘個頭，被噓爛的還敢出來啊

  這是真的也太扯，上一集根本沒賺啥吧?

  查不到資料，倒是查到成本有人說1500萬，越唬爛越低了'
