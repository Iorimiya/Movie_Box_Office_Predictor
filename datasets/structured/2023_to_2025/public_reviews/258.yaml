  那音效真的實在太耳熟了。




  題外話，我去看YT各大影評時，才發現第一集的預告片中，梅根配合北景音樂

  ，跳著可愛的舞，但最後抄起家伙，追著Ronny Chieng




  可惜正式影片，就沒有這樣表現。


  然後這首歌也沒有正式舞蹈MV，有些可惜。


