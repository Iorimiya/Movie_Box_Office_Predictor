url: https://www.ptt.cc/bbs/movie/M.1751526520.A.AC0.html
title: '[新聞] 窒友梅根2.0票房大縮水 電影公司坦承'
content: '《窒友梅根2.0》票房大縮水！電影公司坦承他們高估「梅根」吸金力：我們以為她和超

  人一樣紅




  （圖片來源：環球影業）


  挾著首集超高人氣和賣座氣勢回歸的續作《窒友梅根2.0》（M3GAN 2.0）上週登陸北美院

  線後慘輸《F1電影》（F1），僅賣出約 1020 萬美元左右的低迷票房，遠低於第一集立下

  的 3000 萬美元首週開盤標準。


  身為《窒友梅根》系列幕後製作方的布倫屋影業創辦人傑森布倫（Jason Blum，下圖）日

  前接受播客節目《The Town》專訪時，也大方談及《窒友梅根2.0》的票房重挫，他表示

  ：


  「我們公司都以為梅根就像超人。我們可以對她做任何事，可以改變她故事的類型。可以

  把她放在暑假檔，可以讓她看起來不一樣，可以把她從壞人變成好人，但我們有點一如往

  常地過度高估了人們對她的著迷程度。」




  （圖片來源：Pinterest）


  布倫也認為，票房縮水的原因可能和市場無法一次容納太多驚悚片類型有關，因為近期含

  驚悚基調的電影還有《28年毀滅倒數》（28 Years Later）和《侏羅紀世界：重生》（Ju

  rassic World：Rebirth）：


  「我覺得我們已習慣市場能一次消化 12 到 15 部恐怖片，無論單數或雙數，但這景況已

  不復見。也許以後會回穩，但誰說得準呢，就目前而言，我認為市場肯定消化不了這麼多

  恐怖片。」




  （圖片來源：環球影業）


  布倫繼續說道：「我們永遠無法真正理解這部片失敗的原因，但即使票房不理想，我們也

  嘗試過，對吧？我們想說：能不能把這部恐怖片改造成瘋狂的科幻動作片呢，或隨便什麼

  都行。我認為原創作品的壓力太大了，且數量卻越來越少，我希望《窒友梅根》能做到的

  是，別讓其他拍續集的人灰心喪氣，別讓他們將續集拍得太接近第一集。我認為有些續集

  很獨特，而且確實是奏效的。這部電影不需要拍得很獨特，但我們硬是冒了創作風險，我

  真心希望大家繼續在各自系列電影的框架內冒這種風險，否則電影只會淪為千篇一律。」


  文：Joker



  新聞網址：





  --'
