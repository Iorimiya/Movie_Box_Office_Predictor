url: https://www.ptt.cc/bbs/movie/M.1751124852.A.403.html
title: '[好雷]窒友梅根2.0-認真探討AI'
content: '之前看第一集，就很驚訝他對AI的用語、態度，其實跟過往許多談論AI影響的作品相比蠻

  正經的。

  梅根在殺來家裡的時候嗆女主把自己都不懂的演算法任意使用，其實就是大多數跑AI模型

  的現況。

  也就是嚴格來說，現在的AI模型其實都是實驗品。但是現實沒有那種強到能為了滿足需求

  而自我突破限制的神棍玩意。電影則是加了工作壓力，讓女主足夠天才（或幸運）能搞出

  超高效率的AI，卻又沒足夠時間去測試它。


  第二集首先接續第一集的議題，女主藉由自己第一集的經歷，呼籲家長不要讓電子裝置接

  手育兒工作，並立法督管AI的發展。

  欣賞女主而成為女主男伴的資安工程師也提出一個有趣的說法：讓AI做迴紋針的話，它最

  終也會消滅全人類。

  因為它終究只是個用數字來滿足函數的機器。最終的走向就像第一集梅根下定決心要防止

  世上任何事物來傷害女孩那樣。


  接著是想和女主合作的資訊大亨，被這集的反派女機器人盯上而慘死。用奪取的資源發動

  打擊社會經濟的攻擊，但是稍後的AI展依然照辦。

  這顯示了業界對政府的影響過大，即使AI發起叛亂，也止不住社會對它的依賴。與女主更

  早之前的抱怨相呼應：那些條約根本沒屁用！全都沒有約束力！


  為了救回在AI展上被抓走的女孩，梅根一行人潛入敵方基地。這段很有終結者的感覺，我

  方敵方都有殺人機器XD

  這段我有個點特別想吐槽：女主獲救之後不管倒在一旁的同伴立刻跑掉，理應辦事行雲流

  水，重視效率的機器人，卻在要摸麥高芬之前慢慢走，真是懷疑誰才是機器做的XD


  我不敢說自己對AI的領域極為關注，能夠了解現在整個學界、業界抱持了什麼樣的態度。

  我就拿某次討論講的：AI是讓你更有效率的處理你會做的工作，沒辦法讓你完成你本來就

  不會的工作。

  有鑑於一二集都拍出女主是個很糟的母親，這句話用在女主身上真是再適合不過了XD


  --

  女同事/下屬開導得很好：你遇到的不是困難，而是生活。

  但是第一集才好像讓女主正視育兒這件事，第二集依然是那個「我很忙，別煩我，乖乖聽

  話！」的態度，讓我看了直搖頭。

  遇到危機才表露出對女孩的關心，讓我覺得這種壓力下才會展露的感情，根本是壓抑的亞

  洲家庭XD

  但是演員老是嘴巴微張露齒的表情我不喜歡，讓她總是一副發呆、搞不清楚狀況的樣子。

  我原本想發表一下自己版本管束AI的原則，但是想想覺得漏洞還是一堆就算了XD

  簡單來說就是人為分類一些行為的優劣，讓AI針對特徵做學習。也就是女孩在程式中寫的

  「人性」。

  但是難點也在於我文章中說的，AI只能幫你做你自己了解的事，如果人自己都無法定義人

  性，又要怎麼期望自己的造物瞭解呢？

  更極端的說法如劇中所說，人跟機械決定性的差別又在哪？誰知道人的自由意識是不是一

  種錯覺？

  意外讓女主沒辦法像一般父母那樣，把女孩當作是生活重心，而是用工程師思維把她當作

  「待解決的工作」。

  結果就是女主跟女孩只有薄弱的情感連結，第一集被扇巴掌，第二集又吃了一次扭關節，

  簡直毫無成長XD'
