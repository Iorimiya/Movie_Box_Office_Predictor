url: https://www.ptt.cc/bbs/movie/M.1751648189.A.4C4.html
title: '[新聞] 窒友梅根2.0未來將發行未分級加長版！'
content: '《窒友梅根2.0》未來將發行「未分級」加長版！導演證實「會新增更多內容」




  （圖片來源：環球影業）


  相隔三年的續作《窒友梅根2.0》（M3GAN 2.0）雖然在院線市場已確定告敗，票房不幸慘

  跌，但它或許仍然能在串流和實體影碟市場吸引到更多觀眾，因為環球影業有計劃要在電

  影下檔之後，加碼發行加長版本，連續執導這兩集的傑拉強史東（Gerard Johnstone）導

  演近日接受外媒《Discussing Film》網站獨家採訪時，便親口宣佈了此事。




  （圖片來源：環球影業）


  強史東在專訪中表示：「之後會出一個未分級版本，裡面有些新加的戲碼，我們塞很多內

  容回去… 我明白在戲院坐很久的感覺，所以我們真的希望院線版片長別超過兩小時。然

  而在未分級版裡，你會看到一些院線版沒有的內容。此外，預告片有很多台詞是有助敘事

  的，但梅根在正片完全沒說到（笑）。片廠需要宣傳素材，所以有時在我們決定『這段的

  節奏能不能放進正片』前，預告片就已製作完成，但某種程度上，那些內容仍形塑著片中

  的宇宙。」


  其實第一集當初也發行過未分級加長版，但加長版並沒有加長太多內容，只是在某些細節

  放回了原本礙於院線 PG-13 級的尺度而無法播放的暴力鏡頭、髒話對白，因此第一集兩

  版的長度近乎相同。但就強史東的說法來看，第二集的加長版似乎是真的會比較豐富，真

  的會有實質的劇情被補回去。


  文：Joker



  新聞網址：




  --'
