  天啊。太好看了吧。如果你是科幻迷，一定要看

  相較第一集科幻小品，這集簡直就是完全升級

  敵人升級、隊友升級、還有智慧外骨骼還有腦機接口晶片

  科幻感、打戲、笑點通通有

  而且強化格局的同時也沒有違和感，真的太好了

  然後梅根夠嘴賤，字幕也翻譯的很好


  缺點就是檔期挑的太爛了吧，不只要跟一堆大片衝突，連環球家還有恐龍要競爭

  大廳都被搶走，場次也少的可憐

  如果你是侏羅紀世界重生、窒友梅根2在選，直接秒選窒友梅根2，比侏羅紀世界重生好看

  100倍


  至於第一集沒看過的人也不用擔心，去找第一集的預告來看2分鐘就知道第一集的內容了





  --'
