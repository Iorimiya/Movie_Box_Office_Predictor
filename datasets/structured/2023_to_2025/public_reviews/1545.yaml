title: '[普好雷]《她和他的女兒》，Les enfants des aut'
content: '部落格版：


  曾於今年台北電影節上映的《她和他的女兒》改編自法國作家羅曼佳里經典小說《Au-del

  à de cette limite votre ticket n''est plus valable》，不過就與近年影視潮流同樣

  的，導演蕾貝卡斯洛托維斯基翻轉了主角性別，原來故事中男主角Jacques Rainier是名

  有著成功事業的商人，然而曾經叱吒商界如他也難以抵擋時間在他身上帶來影響，他可以

  不在乎生意的衰落或者婚姻的失敗，但卻無法接受自己在性事方面的威猛不再，尤其當他

  遇到新對象Laura之後，更是積極尋求各種能夠重振雄風的方法，只是這些依然沒有任何

  幫助，當無助逐漸成為焦慮、煩躁，Jacques Rainier開始萌生自殺念頭...。而在《她和

  他的女兒》中，導演蕾貝卡斯洛托維斯基則轉從女性視角出發，讓觀眾順著女主角瑞秋的

  視線，看向女性在步入中年之後，難免會面臨到的年齡焦慮，簡單結婚生子的問題都因時

  間而在前頭多了「還可以嗎？」的自我懷疑，還能嫁出去嗎？還生的出來嗎？


  原版故事中Jacques Rainier在遇見新對象Laura後，勃起障礙的問題是更被加倍放大，內

  心的焦慮自然也就跟著更為強烈，《她和他的女兒》中的瑞秋與之同樣的，的她本來並不

  覺得年紀會對她造成困擾，可在認識阿里並與他墜入愛河，隨著越來越深的感情而浮現的

  ，是想與阿里共組家庭的渴望，於是當有了這樣的想法以後，瑞秋開始想像著自己成為妻

  子、成為母親，嚮往著人生往前到下一個階段，她樂於見到自己能有身分與角色上的轉變

  ，然而現實問題卻不斷動搖著她、混亂著她。瑞秋將阿里與前妻艾莉絲所生的女兒萊拉視

  如己出，無奈萊拉並無惡意的童言童語卻總是提醒著自己，她始終就是個局外人，即使她

  想成為萊拉的母親，但無血緣關係這件事還是成了芥蒂梗在心裡。說不介意阿里偶爾會帶

  著女兒去找前妻、甚至還在萊拉生日時到岳父母家聚餐慶生是騙人的，瑞秋擔心著自己不

  論多麼努力想要成為這個家的一份子卻還是會被擋在門外，所以她想要為阿里生孩子。



  雖然電影沒有明說，但就我的感覺上確實瑞秋是把為阿里生孩子當作是種能與這個家產生

  關係的方法，就算阿里早已和愛莉絲離婚，瑞秋始終明白自己還是這個家之外的人，她終

  究還是取代不了愛莉絲在萊拉心中的位置。越是愛阿里就越是不甘心於此，她不想要這段

  感情最後輸給關係上的不確定，因此瑞秋所能想到的就是和阿里能有真正血緣上的連結，

  而她也積極的為此目標努力著，可惜每次回診都是失望，聽著醫師說著些要她抱有希望的

  鼓勵，連阿里都安慰著她說他們還有時間慢慢來，不過瑞秋其實很清楚自己這個年紀能懷

  上孩子有多困難。就像《卡在車上》中露薏絲受到自殺母親的影響，害怕自己長大後在同

  個年紀會步上母親後塵，那份恐懼在無意間裡侵蝕著她，更成為讓她人生卡住的主要原因

  ，瑞秋的母親在她九歲那年過世，也許因為這樣才讓瑞秋潛意識的長年避開邁入人生新階

  段的選項，而當她終於想要跨過心裡那道坎時又似乎晚了些。


  瑞秋與妹妹的一席談話間裡能知道，她曉得在當今社會裡結婚生子早已不是女人唯一選項

  ，過去的她也是這麼樣子認為的，直到她遇見了阿里、遇見了萊拉，想要成為妻子與想要

  擁有孩子這兩件事，才突然意識到原來自己是很渴望去實現的。事實上，身為電影的旁觀

  者，觀眾對瑞秋從意識到再到想實踐是有跡可循的，光是她是名高中老師這點就很明顯了

  。如同母親在家裡照顧孩子，老師也在學校照顧學生，我們可將老師與學生的關係視為無

  血緣的母親與孩子，兩種身分都是照顧者的角色，《她和他的女兒》有著不少篇幅在描寫

  瑞秋與名叫狄倫的學生上面，不是為了後來有發展成禁忌戀的可能，而是要讓觀眾早瑞秋

  一步去意識到，她想成為照顧者（母親）的本能或者說是渴望、期待一直都在，只是沒有

  去按下開關罷了，而後來出現的阿里則是按下開關的那個人。


  導演蕾貝卡斯洛托維斯基選擇安排讓瑞秋成為似是母親的繼母，讓她成為這個家裡的第四

  名成員，順著瑞秋對阿里、對萊拉還有對這個家感情越加深厚，就越能感受到她的格格不

  入與說不來的酸楚，而當同時間她的妹妹剛好懷孕、在學校裡又碰上男同事的釋出好感，

  還有花費更多心力在被其他老師認為是問題學生的狄倫身上，其實對瑞秋而言都是種刺激

  、刺激著要她思考多年來終於面臨到的問題－她想要的到底是什麼？她真正想要去追求的

  是什麼樣的生活？每種選擇都會為自己帶來改變、影響，從女兒成長為女人再到妻子、母

  親，或者是繼續保持單身都好，這個晚來卻不算遲來的進程讓她得以去探討自己是誰，對

  於現階段與新階段的身份上的探索與認同。《她和他的女兒》從全新角度去描寫、去看待

  中年女子對從來自於外界、來自於自己所給予自己的壓力，是如何的去吸收與消化，並且

  在最後轉化為「成為自己」的養分。



  我很喜歡導演蕾貝卡斯洛托維斯基對瑞秋這個角色的細膩刻劃，從學校到家庭再到瑞秋自

  己，不同的接觸與認識都是火花，讓觀眾能夠相當全面的去認識瑞秋，進而對她能更加感

  同身受，也喜歡《她和他的女兒》從傳達出來的訊息，不過我個人覺得後面劇情的走向稍

  微可惜，有點壞了電影本意的感覺。《她和他的女兒》既選擇讓瑞秋成為主角，又要她面

  臨這麼多，其實就是要看她會如何選擇、如何成為自己，不管她之後會不會真的邁入人生

  新階段、迎接新身份，都是她的「主動」選擇，可是劇情最後卻讓她「被動」失去選擇權

  。即便你說就算阿里後來為了萊拉選擇轉身與前妻復合而與瑞秋分手，瑞秋也還是在這些

  日子裡有所收穫，可我認為主動的收穫與被動的收穫還是有著差異的，這個部份我是感到

  可惜的，有種虎頭蛇尾的感覺。


  不過整體上《她和他的女兒》還是值得去細細品嚼，飾演瑞秋的薇吉妮愛菲亞演技真的好

  ，完全忘記她就是《聖慾》裡的女主角。導演蕾貝卡斯洛托維斯基從電影中帶領觀眾去探

  討關於女性的諸多面向，那些女性面對新身份、新階段的焦慮、煩躁、喜悅、恐懼等的情

  感變化在空氣裡能被清楚捕捉，人家總說中年危機、中年危機，不論男或女都會遇上這個

  問題，但是《她和他的女兒》卻用這個故事告訴觀眾，安撫著每個與瑞秋同樣、或者曾擔

  心過那刻到來的人們，步入中年非但不會是個危機，還可能是個新的開始，瑞秋用她的轉

  變讓你我明白，人生不同階段都會有不同的定位，也許結果並不一定盡如人意，但終究還

  是會獲得想要的收穫。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
