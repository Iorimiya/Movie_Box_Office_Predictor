content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  媽的 這什麼爛片阿 打著破墓團隊的名義


  有夠難看的 ，全程超無聊 一點恐怖感都沒有


  恐怖畫面超少 有些畫面還很可笑


  都沒想到2025年了，韓國還會拍出這種有夠丟人現眼的鬼片


  連印尼越南鬼片都比他恐怖



  這種爛片送我看我都不要看，


  不信的話 可以挑戰看看有多爛


  絕對是史上最爛鬼片


  --'
