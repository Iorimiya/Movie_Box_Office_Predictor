url: https://www.ptt.cc/bbs/movie/M.1754025871.A.2F5.html
title: '[好雷] 韓國恐怖片地嚇鐵'
content: '剛在台中日日新看完了

  先說結論是還可以,給70分

  片長有點長,看到後面會毛躁...


  女主是個YT創作者,主題是恐怖驚嚇

  她去訪問已死亡6人的地鐵站長

  站名叫光臨站,站長告訴她五六個恐怖的故事


  雷文防雷資訊頁






  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  原來十多年前發生集體自殺事件

  40名教徒為教主延長壽命而自殺

  而光臨站就是蓋在該教堂

  教主至今還活著,就是告訴女主的站長

  他透過引誘人上車,然後在車上將靈魂附體

  目的是一直重生...


  女主因想得到YT關注的慾望

  一直去找站長想聽恐怖故事

  最後在得知集體自殺事件

  站長問要不要去訪問教主

  她同意了,在半夜三點多去車站及上車

  結果被附身...


  劇情還可以,有起伏或轉折

  演員的演技也都不錯

  但最後面站長上車那段實在太長

  另外YT競爭對手死法太特別了

  因她非常自戀,所以給她毀容...


  --'
