title: '[雷] 愛是自私 Egoist, 日本電影'
content: '雷文防雷資訊頁


  愛是自私

  Egoist

  2023日本電影

  エゴイスト




  劇情簡介：


  本片改編自高山真名自傳小說，鈴木亮平與宮澤冰魚兩人大銀幕大尺度的交纏，以及對同

  性愛情的生動詮釋，雙雙入圍亞洲電影大獎最佳男主角及最佳男配角。


  14歲失去母親，在保守的家鄉努力壓抑著自己對同性的慾望，辛苦熬過青春歲月跑到東京

  生活的浩輔，在時尚雜誌擔任編輯，習慣以一身昂貴名牌行頭為盔甲武裝自己，多年來過

  著逍遙、虛榮的日子。直到某天，他在朋友的引薦下邂逅了健身教練龍太。高中就開始賺

  錢養活自己與單親母親的龍太，高挑的身材、純真有如赤子之心，讓浩輔一見傾心，兩人

  共度了一段美好的時光。懷抱著對亡母的思念，浩輔也用心地陪伴著龍太的母親，三人建

  立起親密如一家人般溫暖的關係。


  然而，有一天，浩輔與龍太約好了要一起去兜風，但龍太卻失約沒有出現......




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  鈴木亮平和宮沢冰魚的角色演出及對手戲，非常精彩動人，打動我的心，劇情氛圍令我動

  容，致使中間劇情轉折的橋段，令我潸然淚下。

  劇情後半段，出乎我意料之外，但是可以接受。愛的無限延伸，愛屋及烏...


  個人滿意度75分（滿分100）。


  以下劇透。




  1.本片看到主角浩輔（鈴木亮平）的Egoist利己主義？可以昇華成愛。即使是自私的行為

  ，也可以昇華為愛。一個人並不孤單，他或她可以結交親人，甚至建立家庭。同時，我認

  為這可能是只是經濟上有餘裕上的人？才能夠做到的壯舉。換句話說，我認為如果沒有經

  濟上、精神上和身體上的餘裕，就無法以這部電影主角的行為模式，透過包容他人，來昇

  華自我，更不用說給別人一些東西了。


  每天忙於生活，沒空留出那種餘地，以一些忙碌於求生的人的狀態，大概會留在龍太（宮

  澤冰魚）的位置上吧。也就是人所賜而生，還來不及報答而死。


  儘管如此，取決於你在生活和與人交往過程中的目標是什麼，它會讓你覺得“也許你可以

  ”給別人一些東西，昇華他們的自我，把它變成愛。然而，念頭只是一時的小我，小我的

  正面昇華，只是巧合，我不認為是念頭之外的回報。

  本片是一個令你思考到，在所愛或被愛的人之面前，“改進你表達自我的方式”嗎？


  2.本片片名的意思egoist？

  我對主角鈴木亮平扮演主角浩輔的演技，感到真實自然，雖然和他常見的角色大相逕庭。

  中場的高潮，與龍太母親（阿川佐和子）的互動，讓我有一種人事已非的感覺，非常悲傷

  。後半段到結局，我能用自己的方式理解和解釋標題主題Egoist的。以利己主義者為武裝

  的主人公，終於受到人們的追捧及善待，導致他的心態發生了變化……鈴木亮平的表演非

  常精彩出色。宮沢冰魚扮演龍太角色，其實戲份不多，但人設角色，令人悲痛及同情，演

  出動人，令人動容及印象深刻，所以以本片表現得了獎項（2023年第16屆亞洲電影大獎最

  佳男配角）。龍太角色的遭遇，真的令我感覺悲傷。


  3.浩輔，龍太及其母親，三個角色的表演，給人留下了深刻的印象。電影中，人物的情感

  ，在兩個小時的時限內，得到了很好的表達，但有一些我無法解釋或有疑問的地方，所以

  我透過google及原著解決了這些問題。 特別是在電影中，主角對龍太的母親傾注愛意的

  理由和背景，多少有點需要去想像，但在原著中，主角的想法被仔細地描繪出來了。

  另一方面，我認為以電影的扭曲為中心的拍攝方式，比原著更能勾勒出人物的感情，讓人

  產生共鳴。 此外，比起原著，我更能感受到人與人之間的溫暖，就像在看一部真實的記

  錄片一樣，比如朋友之間生動的對話，以及浩輔和龍太的戀人之間的隨意對話。 基本上

  ，為什麼感覺扭曲？例如浩輔及龍太二人的床戲，只有面部和手臂的特寫，所以很難理解

  是什麼狀態。 龍太第一次造訪主人公的房間時說：“哇，好寬敞啊。‘’

  作為原著中沒有的場景，我重點關注了在電影中多次播放的柴可夫斯基的音樂創作《悲愴

  》， 柴可夫斯基本人似乎也曾作為同性戀作曲家而受苦。



  雖然本片以兩個男人之間的愛情故事開始，但它超越了此類型，深入到讓你思考什麼是愛

  的深刻內容。 看了電影和google及原作的一些內容，寫出如此精彩小說的高山誠，已經

  去世了。


  PS.

  訪談文章---



  愛是自私

  Egoist

  日本電影

  エゴイスト


  --


  謝謝樓上留言，對的，我才想到這橋段，呵呵。為了愛。



  謝謝P大留言，的確這劇組很讚，温暖有愛，看到他們的用心及體貼。




  謝謝樓上的留言啊。



  謝謝P大的温暖的鼓勵啊。這部同志電影有想寫的內容，有些同志電影則沒有什麼可以想

  寫的，呵呵。


  越多腐女支持同志電影，才有此類型電影在電影院上映，否則都直接上串流平台了。而且

  腐女的同志電影的影評文，有些超精彩細膩的。'
