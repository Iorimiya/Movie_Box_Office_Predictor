title: 'Re: [好雷] 過去的缺損，與永遠：《愛是自私》'
content: '補充一下


  1. 宮澤冰魚怎麼會是鈴木亮平的健身教練呢？


  那是性工作者的假身分，你看他有秀出正式執照嗎

  日本法律其實是禁娼

  性交易，大部分是在工作後的 合意性交

  就像按摩店的體內保養


  冰魚原本想純交易的

  但每次高級壽司攻勢下

  還是淪陷了




  宮澤冰魚為什麼要賣身才能賺錢？


  母親癌症阿

  胰臟癌致死率很高的

  所以…他都說之前的日子是地獄了

  只是用錐間骨突出


  冰魚放棄賣身

  鈴木亮平的薪資其實是不夠的

  實際上換鈴木亮平照顧，

  他看存摺也暗示自己也入不敷出了

  冰魚又對感情忠誠

  於是多兼職….終於過勞死了




  很訝異有導演用傳教士做愛，很多電影怕面對面，借位不方便，都背後式...其實傳教士

  能表達的情感更多....




  其實我覺得二片還是太淡

  如果坂本龍一還在

  用  怒 的水平，寫出哀而不傷的樂曲

  該多好



  不過我看到放浪兄弟公司願意探索這塊

  無論是導演

  還是八木勇徵

  甚至特別來台灣的akira和藤岡靛

  真的很好


  --'
