content: "本文涉及劇情，且具個人觀點，推薦觀影後再讀。\n\n　　　　本片已上映第二週，有意者請把握本週時間。\n\n\n\n　　　　圖文網頁版：\n\n\
  　　　　\n\n\n　　　　預告片：\n\n　　　　\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n過去的缺損，與永遠：《愛是自私》\n\n\n\n\n\n　　電影《愛是自私》（エゴイスト／Egoist）改編自高山真的同名半自傳\n\n小說，由曾拍攝\
  \ LGBTQ紀錄片，並以劇情長片《廁所裡的聖殤》揚名國際影\n\n壇的導演松永大司執導，2023年在日本上映。看完電影令我印象最深刻的是：\n\n主角齊藤浩輔（鈴木亮平飾）到最後與龍太（宮澤冰魚飾）的母親妙子（阿\n\
  \n川佐和子飾）的對話：\n\n\n\n「我啊，搞不太清楚到底什麼是愛。」\n\n「我們認為你付出的是愛，那不就夠了嗎？」\n\n\n\n　　當浩輔回老家，與父親義夫（柄本明飾）閒聊時，父親提到曾與重病的\n\
  \n母親靜子（中村優子飾）有這樣的對話：\n\n\n\n「我不想再成為你的負擔了，離開我吧。」\n\n「除非你討厭我了，否則就不要再說這樣的話。我們就是遇到了，那沒有辦\n\
  \n法，只能一直這樣下去。」\n\n\n\n　　這兩段對話詮釋了主題：愛從來不是無私的。我們可能會被一個人的某\n\n些特質吸引、產生好感，幸運的話能進一步發展情誼。情感發自內心且不由\n\
  \n自主，但要不要發展，以及如何發展，則是個人選擇，選擇與否大半來自一\n\n己需求：過去的匱乏，現在的不滿足，未來的願望，以及維持感情時必須付\n\n出、與帶給自己的心力。當對方的存在恰好符合自己的需求，並能維持穩定\n\
  \n的平衡，就會一直持續下去，直至長久建立關係。\n\n\n\n\n　　\n　　齊藤浩輔在１４歲（少年時期為和田庵飾）時母親去世，中學時期因陰\n\n柔特質被同學霸凌，使他決定遠上東京，任職時尚雜誌社的他，學會用衣飾\n\
  \n化妝武裝自己，經由朋友介紹認識了健身教練中村龍太後彼此吸引，尤其當\n\n浩輔知道龍太因父親外遇，只能與母親妙子相依為命，又因母親生病高中輟\n\n學、到處打工負擔家計時，讓他彷彿看到當年的自己，龍太守護母親是他無\n\
  \n法完成的願望，故而他選擇對龍太付出、贈送壽司餐點時說「這是送給你母\n\n親的，你沒有權利拒絕」的半強迫態度，實則是在彌補自己的遺憾；龍太流\n\n露的純真氣質，接受他好意的不安，以及彼此之間無法掩飾的好感，都使情\n\
  \n誼加速上升，同時讓進行性工作的龍太愧疚。所以當浩輔再次送禮半強迫龍\n\n太收下時，龍太揭開這個祕密並要求分手──這個要求就是一種停損，欺瞞\n\n自己與對方都讓龍太感到痛苦，分手是將兩種欺瞞一次解決的手段：當我不\n\
  \n用騙你，也就不用再騙自己，即使結果是別離。\n\n\n\n　　所幸對浩輔來說，龍太的性工作是加重了對他的憐惜，所以他選擇用每\n\n月十萬的價格包養龍太，不足的金額請他打工補足，但性工作不能再繼續。\n\
  \n這個兼顧現實與情感的約定成了持續相愛的連結，關鍵在於浩輔的付出與要\n\n求符合龍太想要被愛、以及停止性工作（不用再欺騙母親）的願望，那麼對\n\n他來說就是拯救而非干涉。而龍太的同意也讓浩輔同時滿足了「補償過去\n\
  \n（受苦）的自己／母親」、「拯救愛人」的多重需求。如果龍太無意放棄性\n\n工作，選擇藉此而讓生活輕鬆一點，或者浩輔更在乎交往對象是否忠誠勝過\n\n補償與被愛的渴望，這段關係就不會持續下去。\n\
  \n\n\n　　浩輔在與好友聊天時，提過與龍太的性愛太拘謹，「希望對方把自己吞\n\n掉」，可見他期望更強烈的情感表現，好讓他覺得自己被愛、被重視，經由\n\n\
  自己付出得到的回饋也能得到這種滿足。直至龍太猝死令浩輔心碎，同時也\n\n自我懷疑當初的約定是害死龍太的原因，讓他開始自問：我真的懂得愛嗎？\n\n我真的是在愛他嗎？這份愧疚以及為了延續原先的付出，使浩輔轉而照顧龍\n\
  \n太生病的母親妙子，堅持請她收下自己給予的生活費，並時時去醫院探望。\n\n\n\n　　這一段「因愧疚照顧交往對象的母親並成為家人」的劇情，很容易聯想\n\n\
  到台灣由鄭有傑執導的電影《親愛的房客》。但《親愛的房客》裡，周秀玉\n\n（陳淑芳飾）穩穩抓住林健一（莫子儀飾）的自責與愧疚，抒發長子王立維\n\n（姚淳耀飾）猝逝的恨，同時也在林健一長時間無怨無悔的照顧裡孳生了憐\n\
  \n惜與愛；《愛是自私》的妙子則從龍太說「我是被浩輔先生拯救」接受兒子\n\n的選擇，認為無論性別，「你要是找到重要的人才是重要的」。所以當浩輔\n\n提出資助的要求時，妙子雖覺不妥，但從反覆拜託裡意識到這對浩輔來說如\n\
  \n同救贖，故而接受了確實需要的付出。最後兩人對外從原本否認，到接受彼\n\n此的母子關係，最終亦以「麻煩你不要回去」的要求裡看見他們之間的牽繫\n\n已如親人：「天堂裡，你媽媽一定會幫忙照顧龍太的」。看完《愛是自私》\n\
  \n覺得結局雖然遺憾，劇情和拍攝力求生活化的方式使節奏也稍顯平淡，不若\n\n《親愛的房客》充滿懸疑、衝突與人性掙扎，但最後妙子與浩輔視彼此為母\n\n子的互動卻令人感到溫暖：生命裡的遺憾與缺損太多了，如果能藉由付出來\n\
  \n彌補一點，而對方也能接受並視之為關愛的話，那就太好了，那正是龍太母\n\n子需要的，即使是出於自私，但情感與付出來自於己，又怎麼可能毫不照顧\n\n自己的需求？只要彼此能從中得到滿足，那就是美好的相遇；儘管終會逝去，\n\
  \n也無法抵擋無常，但付出累積的曾經，將會永遠留在生命的深處。\n\n\n\n　　演員的表現精采，亦是《愛是自私》的可看之處。飾演龍太的宮澤冰魚，\n\n在散發魅力的熟稔裡不自覺流露的滄桑與堅強，對浩輔帶有傾慕的情感也因\n\
  \n深陷其中產生不安，都自然融入於親密互動時逐漸卸下心防但又無法確認幸\n\n福能持續多久的猶疑與珍惜裡。我很喜歡他每次接客進房前嚼吐口香糖的儀\n\n式，對照第二次見面就主動親吻及初次與浩輔發生關係的情不自禁，以及提\n\
  \n出分手後浩輔終於找到他時頓失界線的混亂，以致賭氣說「真希望我沒遇過\n\n你，沒遇過你我就不會這麼痛苦了」口是心非的指責，以及後來交往，每每\n\n在疲困裡睜眼看見浩輔的表情，那樣唯對所愛之人束手無策的模樣都能看見\n\
  \n他的真心。鈴木亮平飾演的浩輔則成功揣摩、塑造出較為年長而獨有的男同\n\n氣質，無論陷入情感的掙扎、猶豫與決心，數次藉由畫眉的武裝對抗過去陰\n\n霾的籠罩與愛人逝去的痛苦突襲以致崩潰的表現，都演繹了同志電影特有的、\n\
  \n情感的複雜與細膩。《愛是自私》能看到日本同志運動的進步，演員對角色\n\n的塑造和理解深刻，情感內在流動與外在互動均真實自然，蘊含了同志為生\n\n存產生的不安、疑懼，和顧慮現實卻也想要打破限制的勇氣，性愛方面更兼\n\
  \n顧角色性格與關係親密變化的真實感，不會操弄刻板印象或流於異性戀單一\n\n想像裡，值得一看。\n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n\
  我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\n                                  陳斐雯  貓蚤札（其三）\n\
  \n--\n\n　　我想是的，浩輔收到飯盒凍起來，可能是捨不得妙子的贈予，想保留在龍太\n\n家感受的溫暖，畢竟身為同志能到伴侶家吃飯要看運氣，龍太去世更不忍回顧；\n\
  \n後來妙子和浩輔的關係改變，吃下飯盒也就是適應和接受現在的狀態：除了自責\n\n與付出外，他也能接受妙子對他的關愛。"
