url: https://www.ptt.cc/bbs/movie/M.1682793610.A.1F4.html
title: '[普雷] 愛是自私'
content: '補一下上週看的《愛是自私》。簡單評論就是稍微芭樂版的《親愛的房客》，不過只是概

  念上有相似之處，想探討的議題當然不同，後者想談的是家人關係，前者則是關於愛人的

  條件。



  電影改編自高山真的同名半自傳小說《Egoist》，也許因為是半「自傳」題材，所以電影

  導演採用紀錄片的拍法，明明是劇情片卻感覺像在看主角齊藤浩輔這個人的紀錄片，這種

  拍攝方式我滿喜歡的。不過人物特寫鏡頭太多是個小問題，就算導演想focus在角色情緒

  上，但太多鏡頭也捅太近了吧XD別逼這麼緊啊攝影師偶爾來點啷景嘛，好啦真的只是小問

  題。



  而且類紀錄片拍法更考驗演員的演技，如果讓觀眾感覺到演員在演戲反而就失敗了，但鈴

  木亮平演技自然到你會相信自己就是在看齊藤浩輔的紀錄片，好可怕(讚嘆)！當然宮澤冰

  魚飾演的龍太也很好，不然不可能得到亞洲電影大獎最佳男配角，只是看完電影更會為了

  亮平抱屈耶！只有入圍男主角卻沒得獎也太可惜了吧(好啦還有很多獎可以去報名)。



  話說冰魚得獎場雖然應該是兩人旅館攤牌橋段，但我其實更喜歡他去跟不同男人做愛之前

  ，邊走在旅館走廊上邊嚼口香糖時空洞的神情、但進到旅館房間後會瞬間轉換表情的眼神

  ，好讚！亮平就不用多說，電影整整兩小時裡他就是浩輔本人，這還需要評論什麼呢～直

  到片尾字幕捲動，才會開始思考鈴木亮平是這種形象的人嗎？




  齊藤浩輔自小個性陰柔導致被欺負過，長大後在外人面前就比較會武裝自己，好喜歡他在

  情緒激動時，會拿眉筆畫眉毛來壓抑情緒這個小習慣；加上母親在國中時因病去世，導致

  他在認識龍太後，開始奉獻自己般的照顧龍太及他媽媽，從而開始探討這樣自私地強迫付

  出，到底是只彌補了自己的缺憾，還是雙方都能得到滿足。



  雖然我稍微了解電影想探討的議題，只是這議題還是不太中我的點就是XD也許是心中還是

  會忍不住拿來跟《親愛的房客》做比較，我還是比較喜歡房客啊～畢竟我喜歡家庭題材，

  所以其實自私這部片我也反而比較喜歡浩輔與龍太媽媽相處的橋段。兩人之間的對話都很

  溫暖，雖然痛苦的場面不少，但這對關係很親近的陌生人的相處，反而療癒了彼此與觀眾

  。聽說有些是排戲時側拍的鏡頭，導演就直接剪進正片裡了，難怪自然過頭了啦XD



  看到有些評論說到這部片有些平淡，啊這就某個人某段人生過程的紀錄片啊XD沒有高潮迭

  起也很正常啦。雖然電影想探討的主題不太中我興趣，但還是推薦大家去看看這部片，為

  了看看演得很棒的亮平與冰魚也好啊。



  --'
