title: '[討論]《愛是自私》導演講座 光點華山場'
content: "應該沒什麼劇情雷，不用防XD\n\n\n週四晚上，與友人看了《愛是自私 エゴイスト》，有幸參加了映後的導演講堂。\n\n電影放映結束後導演出場。導演一坐定就說「打給賀！」，主持人說因為大部分宣傳問候\n\
  都說國語，所以導演希望能特別一點貼近大家。中間是導演松永大司，左邊拿筆的是口譯\n者，右邊則是主持人。\n\n松永導演是拍紀錄片出身，提到會在紀錄片追求戲劇，在虛構的電影追求真實，因此大量\n\
  使用手持攝影機，製造出猶如就在劇中人身邊觀看的氣氛。\n\n為何會選用鈴木亮平主演？因為導演與鈴木是18年以上的朋友，兩人常常講到一定要找機\n會跟對方合作。導演覺得鈴木給人一種陽剛、強悍的螢幕印象，但私底下的鈴木有著柔和\n\
  的一面，所以導演覺得他一定可以勝任齊藤這樣的反差。\n\n雖然是小說改編，但片中許多段落是即興演出，演員到現場才知該場會加戲。導演會告訴\n演員們背景和要講的重點台詞，如何表現出來就由演員即興發揮。像是齊藤遇到心情起伏\n\
  去畫眉毛、打扮的戲，還有齊藤和中村在旅館攤牌的戲等等。\n\n\n最難演的一場戲是上面提到的旅館攤牌戲，兩人從斷斷續續早上演到晚上，中間還先拍了\n其他戲。導演說兩人都很入戲，情緒上很辛苦。宮澤冰魚得獎時，鈴木還在台下哭了，根\n\
  據鈴木事後有跟導演說，就是想起了這場戲。\n\n本片有請親密戲協調員、LGBTQ顧問協助，而LGBTQ顧問其實是本片的化妝師。片中齊藤的\n朋友群其實是非職業演員，也是真正的同志（我覺得他們演得有夠自然）\n\
  \n導演最後希望無論覺得是正評或負評，都麻煩大家在社群媒體寫出來，讓更多人知道這部\n電影。還跟用雙手合十的手勢，跟大家說謝謝XD\n\n糟糕，整場講到很多，怎麼只記得這些。\n\
  \n另外，我跟友人坐在邊邊獨立那四排（有去過華山的應該知道），主持人在QA時完全略過\n那四排，根本被忽視的孤兒QQ\n\n\n圖文版\n\n\n\n--\n\n\
  \     「完全犯罪就像第一次下廚的的老爸，注定會失敗。」\n\n                                             \
  \       －古畑任三郎\n\n--"
