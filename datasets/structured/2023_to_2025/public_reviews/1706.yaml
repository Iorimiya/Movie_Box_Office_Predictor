title: '[新聞] 宮澤冰魚《愛是自私》一場床戲拍二十幾'
content: "新聞網址：\n\n日本男星宮澤冰魚昨日（12日）憑電影《愛是自私》在第16屆亞洲電影大獎獲得男佳配角\n獎。《愛是自私》改編自已故作家高山真同名自傳小說，由曾拍攝LGBTQ紀錄片，並以劇\n\
  情長片《廁所裡的聖殤》揚名國際影壇的導演松永大司執導，找來實力派男星鈴木亮平擔\n綱主演，與宮澤冰魚上演多段激情對手戲。宮澤冰魚在登台領獎時，俏皮地笑稱自己本來\n\
  準備了相當長篇的得獎感言，但站上台後卻什麼也想不起來，也不打算拿出口袋裡的小抄\n，直接以流利的英語感性向每一位工作人員及喜愛這部電影的人們表達感謝。同時鏡頭也\n\
  帶到坐在台下的銀幕戀人鈴木亮平激動落淚，頻頻捲起衣袖拭淚。台上的宮澤冰魚也接著\n點名導演松永大司和鈴木亮平起身接受眾人掌聲，並發表感言：「我相信這部電影開啟了\n\
  一扇門讓人看到一種新的生活型態，以及人與人之間互相支持、理解的可能性，我希望這\n部電影可以去到更多地方，接觸到更多的觀眾！」回到後臺受訪時，宮澤冰魚也表示這次\n\
  和前輩鈴木亮平有許多同志情慾戲，自己在接到劇本時一點抗拒感也沒有，反而投入很多\n心力找資料做研究，但正式開拍後依然面臨許多考驗，一場床戲甚至拍了二十幾次才完成\n\
  ，因此能以這部作品得到肯定感到無比榮幸。《愛是自私》將於4月21日在台上映。\n\n14歲失去母親，在保守的家鄉努力壓抑著自己對同性的慾望，辛苦熬過青春歲月前往東京\n\
  生活的浩輔，在時尚雜誌擔任編輯，習慣以一身昂貴名牌行頭為盔甲武裝自己，多年來過\n著逍遙、虛榮的日子。直到某天，他在朋友的引薦下邂逅了健身教練龍太。單親的龍太高\n\
  中就開始賺錢養活自己與母親，高挑的身材、純真有如赤子之心，讓浩輔一見傾心，兩人\n共度了一段美好的時光。懷抱著對亡母的思念，浩輔也用心地陪伴著龍太的母親，三人建\n\
  立起如一家人般親密溫暖的關係。然而，有一天，浩輔與龍太約好了要一起去兜風，但龍\n太卻失約沒有出現......遌W值預售套票於博客來售票網及金石堂網路書店熱賣中，購買\n\
  單人套票即可獲得「原文海報」壹張（兩款任選），購買雙人套票即可獲得「原文海報」\n兩張（兩款各一張），贈品數量有限，送完為止。憑本片電影票根，還有機會獲得「電影\n\
  原文場刊」壹本，更多活動及電影詳情請洽天馬行空粉絲團。\n\n--\n                                 03/29 20:53"
