title: '[問片] 以幽靈的角度拍的一部驚悚片(有雷)神鬼第六感'
content: '年代很久遠，10年前看的吧


  印象中是一個媽媽(有沒有爸爸就不太記得了)帶著一對姊弟搬到新的住處


  然後就發生很多詭異的事情


  好像剛開始只有弟弟看的見像是只有一雙腳卻沒有身體之類的靈異事件


  然後會聽到一些奇奇怪怪的聲音但是沒有人


  後來最後才知道，其實這一家人已經死了很久


  而他們聽到的聲音 看到的影子 是現在正住在那間房子的活人





  不知有沒有版友知道這部片名，感謝



  --


  喔喔喔喔!!好神喔!太感謝你了'
