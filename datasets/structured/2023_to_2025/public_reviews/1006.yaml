content: "05/17 《》\n\n\n\n\n台版海報大公開！\n\n\n★ 爛番茄爆米花分破 80 超好評\n\n★ 童年崩壞宇宙正宗起源，邪惡維尼的誕生\n\
  \n★ 虐殺好夥伴跳跳虎、貓頭鷹加入砍殺行列\n\n★ 更多血漿、更多恐懼，質感全面升級\n\n\n「 童年的崩壞，始於……崩壞的童年 」\n\n\n在《百畝森林》發生大屠殺後的五個月，克里斯多福投身醫院工作試圖重返平靜生活，然\n\
  而他仍受創傷後壓力症候群的困擾，必須定期接受治療。\n\n於此同時，搜救隊奔赴百畝森林，卻遍尋不著克里斯多福所聲稱逃脫的怪物，社區中大多\n數人對他所述的「怪物」故事嗤之以鼻，更認定他才是大謀殺的幕後真兇。\n\
  \n不過在治療過程中，克里斯多福回憶起童年的痛苦經歷，原來所謂崩壞的童年，早在多年\n前就已埋下種子……\n\n\n#忠誠是永遠的\n#不要拋棄你最好的朋友\n\
  \n\n05/17《》 \n\n\n#小熊維尼 #血與蜜 #恐怖 #砍殺 #驚悚 #電影 #小豬 #跳跳虎 #貓頭鷹 #維尼宇宙\n#永遠的好朋友 #原著改編\
