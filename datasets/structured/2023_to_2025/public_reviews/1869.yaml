title: '[贈票]【愛，子】PTT鄉民限時特映會 (台北場)'
content: '★ 2022 威尼斯影展 正式競賽單元

  ★ 2022 多倫多影展 星光首映單元


  奧斯卡金像獎六項提名的【父親】鬼才導演弗洛里安澤勒，

  睽違三年再度推出親情三部曲中的第二部曲【愛．子】。

  除了奧斯卡影帝安東尼霍普金斯再度回鍋合作外，

  這次更找來休傑克曼、蘿拉鄧恩與凡妮莎寇比等演技派巨星一同飆戲，卡司眾星雲集！

  預告：


  導演：【父親】弗洛里安澤勒

  演員：

  【大娛樂家】休傑克曼

  【她們】蘿拉鄧恩

  【不可能的任務】系列 凡妮莎寇比

  【父親】安東尼霍普金斯


  【愛．子】1月13日 (週五) 電影院大銀幕揪心之作




  特映會時間：1月12日（週四） 12:30

  特映會地點：微風影城 SONY PICTURES 影廳A、B（台北市松山區復興南路一段39號8樓）

  抽獎方式：推文回答你最喜歡導演弗洛里安澤勒前作【父親】的什麼地方


  【愛．子】1/13上映，推文前113名鄉民自動獲獎（一人中獎，兩人同行），

  主辦單位會設中獎推文截止線，不另寄中獎通知


  觀影方式：1月12日12:00於微風影城 SONY PICTURES 影廳報到桌前排隊，

  報上中獎ID，工作人員核對後蓋章入場


  注意事項：

  1. 本場採不劃位入座

  2. 本特映會如遇天災等不可抗力的因素而取消，恕不補辦

  3. 主辦單位保留活動解釋權力，不得異議

  4. 特映會採現場排隊入場制，人數額滿將不再開放入場


  立即訂閱索尼影業YT頻道掌握最新預告首播



  --

