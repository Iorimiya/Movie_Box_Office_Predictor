url: https://www.ptt.cc/bbs/movie/M.1673583251.A.906.html
title: '[普雷] 《愛．子》，困在憂鬱裡的兒子。'
content: '部落格版：


  雖然無法明確將前年整年所看過的電影做個有名次的喜好排名，不過由安東尼霍普金斯與

  奧莉薇雅柯爾曼所主演的《父親》絕對榜上有名。改編自導演弗洛里安澤勒自己在2012年

  所發表的同名舞台劇作品的《Le P鋨e》的好看在於，儘管對看習慣過去常見的線性敘事

  的觀眾來說，《父親》無疑是破碎的、是混亂的，是不容易去咀嚼的，大量場景與台詞或

  者有著不同臉孔的同個角色不斷重複出現，混淆著時間與空間的感受度，意圖使人陷入茫

  然與焦慮的不安錯亂，然而這看似不對勁的異樣感，卻反而在隨著劇情將全貌拼湊完全後

  ，意識到原來這是導演弗洛里安澤勒的別有用意、讓失智症患者眼中世界「成為」電影劇

  情而在銀幕上上演，進而體驗甚至體會失智症患者的情緒與情感。導演弗洛里安澤勒的敘

  事，加上兩位演員精湛、細膩的詮釋，讓《父親》成功帶給觀眾濃而烈的感受，可以說是

  年度最令人驚喜的作品之一。


  不到兩年，導演弗洛里安澤勒將他與《Le P鋨e》同為「心靈三部曲」之一的另一部舞台

  劇、2018年的《Le Fils》再度搬上大銀幕，不僅找來休傑克曼主演、凡妮莎寇比與蘿拉

  鄧恩分別飾演他現任妻子與現任妻子、贊麥格拉斯則是關鍵性的兒子一角，連安東尼霍普

  金斯都回歸詮釋影響休傑克曼至深的父親角色。然而《愛楔l》表現並沒有符合在《父親

  》之後給予觀眾的期待，至少對我而言是失望居多。整體來說，幾位主演很確實的扮演好

  各自角色、賦予了角色該有的任何情緒與情感，以及面對眼前關係的反應與處理方式，不

  過和《父親》的出乎意料相比，《愛楔l》反而就是意料之中，幾乎沒能帶給觀眾更多的

  驚喜，一切的走向完全都是可預期的、甚至是有些談論親子議題時會有的刻意編排，例如

  安東尼霍普金斯的出場，不過是想藉由他與休傑克曼的父子關係間的緊張與疏遠，來強調

  出休傑克曼對兒子是在「不想變成跟父親一樣的父親」的影響下來進行他後續的關心與行

  動，這種「不想卻還是重蹈覆徹了」的結果顯得矯情。



  「當你傷害了自己，也是傷害了我。」


  「當你傷害了媽，也是傷害了我。」


  在許多類似電影幾乎都可以看到相似情節，每位父親都是在父親的影響下去學習如何成為

  一位父親。如同休傑克曼不願自己和兒子間的關係和安東尼霍普金斯一樣，於是在成為的

  父親的過程裡不停的去修正、去改變自己的教育方式，還有努力拉近與兒子間的距離，然

  而到後來終究會在某個點上，意識到其實自己正在和父親做相同的事，《愛楔l》沒有拍

  到的是，也許在觀眾沒有看見的劇情背後，是休傑克曼和安東尼霍普金斯曾經有過一段自

  己與兒子進行過的對話，將重心全部放在事業上的父親忽略了家庭，傷害了自己也讓母親

  傷心，幾十年過去之後，他才發現原來兩對父子身影早已重疊。我想，彼得之所以去探訪

  久未見面的父親，與其說是想要證明自己和父親不一樣，倒不如說他其實是想求救，在他

  對兒子的情況束手無策的時候。而後來彼得在餐敘上對父親說的一番話，更像是他在發現

  自己竟然想找父親尋求解決和兒子尼可拉斯間問題的辦法後的腦羞成怒。


  導演弗洛里安澤勒試著從《愛楔l》來告訴觀眾，任何親子關係多少都存在於世代循環之

  下，哪怕自己不願去承認，但有多少父母都把自己活成了自己父母親的樣子，然後再用相

  同的模式去對待自己的孩子？彼得恨過父親在乎工作比在乎家庭還多，更對他施加給自己

  的「望子成龍」的壓力感到厭惡，可是長大後事業有成的他，不也是這樣期許尼可拉斯的

  嗎？只是他比起當年的父親，他更願意主動的去問兒子「怎麼了？」、去關心他的生活，

  當然這也可能是在「不想變成跟父親一樣的父親」的壓力下所給的關心，然而彼得到底還

  不是因為前妻打給自己說兒子不願上學後才開始對他關心，於是即便他貌似比起父親是給

  了尼可拉斯更多父愛，可是說到底他真的知道從他嘴裡說出口的「關心」的意義對他、對

  尼可拉斯而言是什麼嗎？


  兩人總是不斷問著「為什麼？」、答著「我不知道」、「為什麼？」、「我不知道」，對

  話永遠沒有解答，說穿了，彼得和尼可拉斯始終不在一個頻率上，彼得口中的「為什麼？

  」似是對兒子對生活感到厭煩或者是不想去學校等的原因提問，可真正藏在話裡的應該是

  「為什麼（你不能像我一樣？）」；而尼古拉斯永遠不變的回答「我不知道」，聽起來似

  乎是不曉得自己為何會對一切感到憂鬱，但真正想說的其實是「我不知道（你為什麼不懂

  我？）」。《愛楔l》在劇情設計上意有所指的暗示著這整個家庭、不光是彼得和尼可拉

  斯，就連彼得和兩位前任與現任妻子、還有和父親間都有著缺乏溝通的問題，而當缺乏溝

  通久了、突然間的開始想要進行溝通，似乎難免會造成反效果，太過想要早點得到答案、

  想要解決問題，卻反而帶給了對方壓力，亦給了對方有種「只要順著他的意說出想聽的話

  那就好了」的對卻也不對的想法。這樣子「溝通儼然已有成效」的誤會，最後才導致了無

  法挽回的悲劇發生。



  《愛楔l》其實光看劇情本身並不到無趣，加上休傑克曼、凡妮莎寇比、蘿拉鄧恩三位的

  表演張力十足，安東尼霍普金斯的客串亦具氣場，但誠如我前面提到的，因為已經看過導

  演弗洛里安澤勒上一部作品《父親》而且很喜歡，因此相比之下，《愛楔l》就難說成是

  精彩的一次表現。我可以理解這部作品依舊是有其感人的地方，情感與情緒的給予亦屬飽

  滿，不過還是不夠說服我去喜歡《愛楔l》。另一方面，儘管呈現手法不同卻也有些相似

  之處，《父親》用劇情一再上演可有細節不同的設計來製造出混亂感，讓觀眾陷入失智症

  患者的茫然世界，而《愛楔l》同樣的是藉著彼得和尼可拉斯不斷的進行相似卻有些微差

  異的對話，來反映出兩人當時候的情緒與內心狀態，可相比《父親》帶來的是驚喜與驚訝

  ，《愛楔l》就像鬼打牆般的叫人煩躁。即便最後意圖在幻想可能會有的美好未來與現實

  只剩下來的殘酷真實間對照來給觀眾一次震撼衝擊，卻也是無力的一搏，我倒認為若結束

  在槍聲就好，那種後續尬然而止的靜寂或許能留給觀眾再多的思考與想像空間。


  另外，就是《愛楔l》相當可惜的是，飾演靈魂角色的兒子、尼可拉斯一角的贊麥格拉斯

  表現過於平淡，和其他幾位大人演員基本不在同個層次上，他的演技沒辦法和父親休傑克

  曼相抗衡。像這樣主題相當明確的電影，明顯就是會講重點放在父子關係上，無奈贊麥格

  拉斯和休傑克曼間無法像《父親》中安東尼霍普金斯和奧莉薇雅柯爾曼那樣充滿火花，就

  連在《愛楔l》中不過數分鐘的休傑克曼與安東尼霍普金斯的餐敘時間都才能用「父親」

  或者是「愛子」來稱之。這對重點父子間少了互相而導致缺少可看性，以差不多年紀的演

  員來看其實有更好的人選，例如影集《星期三》中的波西海恩斯懷特，或者是《戀愛修課

  》的基特康納、甚至是戴上棒球帽勉強還可以裝學生樣的泰隆艾格頓，尤其是波西海恩斯

  懷特和尼可拉斯這個角色氣質還滿符合的。


  --'
