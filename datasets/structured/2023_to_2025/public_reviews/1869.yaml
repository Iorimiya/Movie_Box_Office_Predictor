url: https://www.ptt.cc/bbs/movie/M.1711449471.A.A0A.html
title: '[好雷]愛．子(愛子、困在心緒裡的兒子、The son)'
content: '父親導演費洛里安·齊勒續作

  因為父親幫安東尼霍普金斯

  拿下他的第二座奧斯卡影帝

  自己也拿下奧斯卡最佳劇本獎

  也入圍了最佳影片


  趁勝追擊再拍家庭父子的題材

  一樣是大悲劇，因為拿了獎

  就能請到大咖的金鋼狼跟羅拉鄧

  還有剛演完拿破崙裡的約瑟芬也參一咖

  演金鋼狼裡面再婚生子的對象

  安東尼霍普金斯也來客串金鋼狼的老闆一角

  還在電影裡說未來的市場在北京


  故事在講金鋼狼演事業有成的企業菁英

  跟前妻鬧翻再娶小三另組家庭

  跟前妻蘿拉鄧的兒子也跟金鋼狼住

  前妻自己住拿贍養費一個人安度晚年


  但金鋼狼的兒子跟後母住得很痛苦

  因為感覺像是寄宿在別人家一樣

  金鋼狼跟約瑟芬又生了個兒子

  但大兒子跟約瑟芬合不來

  開始出現重度憂鬱症自殘


  後來開始逃學又送去精神病院

  又不想住院接受治療因為像在坐牢

  結果才一回家沒多久就舉槍自盡

  然後就結束了


  這讓我想到陽光普照裡跳樓的許光漢

  最後大兒子一直哀求爸媽不要住院

  但醫生一直以專業的角度說一定要住院

  最後爸媽還是把小孩接回家照顧

  還是以患者放棄治療的意願為主


  但沒想到會在家自盡

  他知道金鋼狼的獵槍藏在哪裡

  他也知道回到家又會再面臨一樣的問題

  還是會跟後媽無限的輪迴冷戰衝突

  或許他應該跟媽媽住就沒事了


  這戲體現到結婚再婚對下一代的影響有多大

  讓我想到史特龍的兒子也是這種情況吸毒吸死的

  就因為史特龍另組家庭拋家棄子

  導致唯一的獨子英年早逝

  沒兒子送鐘絕後


  這齣英國片體現了這不只是史特龍的家事

  而是很多離婚又再婚家庭二代的寫照

  更何況是好萊塢一堆結了七八次婚的大明星

  想到約瑟芬怎麼開始走這種戲路

  這齣戲是嫁給離婚帶個兒子的老公

  拿破崙是老公掛了帶個兒子跟拿破崙再婚


  看完這齣戲發現有了小孩之後

  再婚真的要特別小心才行

  要小孩能跟後媽後爸處的來才不會後患無窮

  可見史特龍的兒子跟後媽處不來才會抑鬱而終

  還好兒子的媽還活著，史特龍在演藝圈

  才能屹立不搖，因為她應該還靠

  史特龍的贍養費維生

  史特龍才像是他第一位前妻的長子


  這戲就像李安的冰風暴一樣寫實

  估計美國人不會愛看也很難得獎

  票房註定賠錢，但會演這戲是希望拿奧斯卡

  果然只有在金雞獎有入圍而已

  中國人愛看老外混亂的自由戀愛跟婚姻


  最近很少看到金鋼狼的片

  感覺到好萊塢的票房急遽下滑

  反而中國票房讓全球演員隨之嚮往

  裡面安東尼霍普金斯也用句台詞鼓勵

  金鋼狼能夠放下身段放膽去北京發展



  --'
