content: "《神鬼第六感》\niTunes NT$150\n>> \n\n《點燃生命之海》名導亞歷山卓亞曼納巴執導懸疑片，勇奪哥雅獎最佳影\n片等多項殊榮！以妮可基嫚為孩子們身心著想搬入孤島療養為契機，原先\n\
  進島內無人豪宅暗處預防小孩病情惡化，倒待愈久愈容易察覺可疑跡象，\n並帶給這一家人無形壓迫感。\n\n《愛的密語》\niTunes NT$150\n>> \n\n\
  響應日活羅曼情慾五十周年、白石晃士首度挑戰大尺度題材！延續用偽紀\n錄片手法拍《詛咒》的精神，跟拍給聲色場所老闆看重的地下偶像，一遇\n到該行前輩當面開導，催生心中沒感受過的喜悅；當中限制級情節邀懂相\n\
  關領域的資深影星高嶋政宏負責企劃協助。\n\n《橡樹之心：生命頌歌》\niTunes NT$150 (4K)\n>> \n\n繼《KISS小親親》、導演羅宏查本尼耶嘗試大自然紀實，再度入圍凱撒獎\n\
  最佳紀錄片！另找《烈日灼身》製片米歇瑟杜聯合持導筒，聚焦吸引諸多\n生物棲息的橡樹，採取旁觀者視角，默默觀察圍繞這類樹木的生態，呈現\n互相扶持和共存的小型社會。\n\
