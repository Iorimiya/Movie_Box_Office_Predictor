title: '[討論] 【蓋比的娃娃屋大電影】官方預告'
content: '【蓋比的娃娃屋大電影】官方預告




  電影版中的蓋比（由卡通影集主角萊拉洛克哈特克雷納再度詮釋）


  跟她的阿嬤姬姬（四度葛萊美獎得主葛洛麗雅伊斯特芬）展開一


  場前往貓咪奇幻都市喵喵舊金山的公路旅行。但是當蓋比最珍愛的


  娃娃屋落入一位古怪的貓女士薇拉（奧斯卡獎提名演員克莉絲汀薇格）


  手中時，蓋比就展開一場在現實世界中的大冒險，召集所有的蓋比貓，


  趕在一切為時已晚之前，同心協力拯救娃娃屋


  --'
