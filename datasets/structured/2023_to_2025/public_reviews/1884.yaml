title: '[新聞] 《玫瑰人生》名導新作《西蒙娜：世紀之聲'
content: '新聞網址：


  《玫瑰人生》名導新作 《西蒙娜：世紀之聲》即將登台


  預告：


  《玫瑰人生》名導奧利維爾達昂將女性三部曲的結尾獻給二十世紀最偉大的女性——西蒙

  娜韋伊 (Simone Veil)，電影回顧了西蒙娜韋伊非凡的職業生涯。由法國知名女星艾莎齊

  柏斯汀擔任主角，以化妝技術呈現巨大年齡跨度的演出，挑戰她精湛的演技。事實上，這

  部電影也是在艾莎齊柏斯汀的全力促成下誕生，2007年艾莎齊柏斯汀作為頒獎人見到了西

  蒙娜韋伊後，深受感動決心製作一部西蒙娜韋伊的傳記電影，並找來奧利維爾達昂執導。


  製作團隊始料未及的是，《西蒙娜：世紀之聲》上映的這一年遇上墮胎合法權前所未有的

  大倒退，作為這場戰役的法國先鋒，電影將揭開西蒙娜韋伊如何在1974年以男性主導的法

  國議會上，謙虛但堅定表達女性墮胎合法化的必要性。即使為此她飽受攻擊，被認為是將

  無數胎兒送往火葬場，造成的死亡數將是廣島原爆的兩倍，甚至被指控為惡劣的納粹種族

  主義。西蒙娜韋伊仍義無反顧，她曾在訪問中表示「每年都有數千名法國女性在惡劣條件

  下進行非法墮胎，數百名女性為此犧牲生命，我沒有理由退卻。」


  西蒙娜韋伊不只關注女性議題，她對愛滋病患者、囚犯權利等弱勢族群的維護，都展現了

  她超脫個人和政治利益的胸懷。事實上，西蒙娜韋伊對人權和社會正義的堅持是來自悲傷

  的過往，作為猶太大屠殺倖存者的經歷。導演表示在閱讀她的自傳 《一生》(Une vie)

  時感受到集中營的如影隨形，幾乎滲透到每一行。特別是她作為倖存者承受的創傷，導演

  進一步表示「當時我們不被允許談論大屠殺，所有倖存者被迫保持沉默，由國家強加的這

  種沉默持續了 20 年。」看過電影後，法國在臺協會學術合作與文化雷詩雅處長如此形容

  「歷經奧斯威辛集中營後，沒有什麼是不可能的。」


  電影將展現二十世紀法國最偉大的女性之一：西蒙娜韋伊的童年時期到她的政治奮鬥，經

  歷數起二十世紀的重大事件。私密而史詩般地呈現一位非凡的女性，如何挑戰並改變她的

  時代。西蒙娜韋伊所捍衛的人文理念，時至今日仍無比重要。《西蒙娜：世紀之聲》將在

  1月6日全台上映。


  --'
