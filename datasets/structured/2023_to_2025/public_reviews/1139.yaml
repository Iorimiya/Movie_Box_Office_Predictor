  《自殺突擊隊：集結》（DC）：4.5/5 星

  《雷神索爾3：諸神黃昏》（漫威MCU宇宙）：4.5/5 星

  《暗夜狼人》（漫威MCU宇宙）：4.5/5 星

  《X戰警2》（漫威）：2.5/5 星

  《X戰警》（漫威）：3.5/5 星

  《X戰警：未來昔日》（漫威）：3.5/5 星

  《X戰警：金鋼狼》（漫威）：2.5/5 星

  《查克極v奈德之正義聯盟》（DC）：4/5 星



  她近期評分的其他賣座大片包括《芙莉歐莎：瘋狂麥斯傳奇篇章》（4.5/5 星）、《沙丘

  ：第二部》（4/5 星）和《捍衛戰士：獨行俠》（4.5/5 星）。


  想查看她回歸Letterboxd前後更多評分的粉絲，可以追蹤維拉尼的帳號@iman_vell。







