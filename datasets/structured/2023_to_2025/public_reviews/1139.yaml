url: https://www.ptt.cc/bbs/movie/M.1707809549.A.2FC.html
title: '[新聞] 亞當史考特《蜘蛛夫人》確認演出彼得帕克'
content: "亞當史考特《蜘蛛夫人》確認演出彼得帕克「那個親戚」！導演解釋：致敬蜘蛛人漫畫\n\n玩具人\n\nJay_FM\n\n2024-02-13 11:22:59\n\
  \n以下含有《蜘蛛夫人》劇情透露，請斟酌閱讀\n\n.\n\n.\n\n.\n\n.\n\n.\n\n即將上映的《蜘蛛夫人》（Madame Web）導演近日確認了本片盛傳許久的一項傳聞和理論\n\
  。\n\n儘管日前有消息表示，本片最終刪去了前兩代《蜘蛛人》電影的相關元素，但近日導演\n SJ 克拉克森（SJ Clarkson）確認，蜘蛛人的兩位關鍵親人將會登場，也就是「班叔叔\n\
  」和「瑪麗帕克」。而根據業內人士 Daniel Richtman 早前情報，亞當史考特（Adam\nScott）與 艾瑪羅伯茲（Emma Roberts） 飾演的神秘角色就是他們。\n\
  \n導演在訪問中解釋，之所以讓這兩位角色登場，是為了致敬《蜘蛛人》漫畫：\n\n「蜘蛛夫人是在《驚奇蜘蛛人》漫畫中登場的，你懂我的意思吧？到現在都還沒有一本《\n\
  蜘蛛夫人》的獨立連載，我認為應該要有的。我認為這兩個角色的出現是對她起源漫畫的\n致敬。」\n\n克拉克森近期在訪問中將《蜘蛛夫人》比喻為她曾經參與的漫威影集《潔西卡瓊斯》（\n\
  Jessica Jones），認為她們都是被社會孤立的邊緣人：\n\n「潔西卡瓊斯是一個PTSD的患者，這樣貼近人心的真實感，讓這部作品得以成功，我覺得\n對蜘蛛夫人而言，也是一樣的道理。」\n\
  \n\n\n--"
