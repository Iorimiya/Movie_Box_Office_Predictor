content: 'Sydney Sweeney 將在即將上映的《蜘蛛夫人》中飾演朱莉婭 卡彭特 (Julia Carpenter)

  （在漫畫中成為蜘蛛女）。










  資料來源：推特




  《》（英語：Madame Web）是一部即將上映的美國超級英雄電影，以漫威漫畫的

  同名角色為主角，由哥倫比亞影業製作，索尼影視娛樂發行。


  影片是索尼影業蜘蛛人宇宙的作品之一。


  電影電影由S J 克拉克森執導，柏克 沙普利斯和麥特 薩扎瑪聯合編劇。


