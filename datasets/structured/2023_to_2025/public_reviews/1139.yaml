title: '[新聞] 蜘蛛夫人導演將本片比喻為潔西卡瓊斯'
content: "《蜘蛛夫人》導演將本片比喻為《潔西卡瓊斯》！透露：兩人都是有 PTSD 的社會邊緣人\n\n玩具人\n\nJay_FM\n\n    2024-01-31\
  \ 14:53:09\n\n即將上映的「索尼漫威宇宙」新作《蜘蛛夫人》（Madame Web）導演最近形容，該片與漫\n威影集《潔西卡瓊斯》（Jessica Jones）有些許相似之處。\n\
  \n曾經擔任過兩集《潔西卡瓊斯》的導演 S·J·克拉克森 （S. J. Clarkson），最近在《\nEW》的訪問中表示，這部全新的「蜘蛛宇宙」電影有更「貼近人心」與「更堅毅」的基調\n\
  。並將主角 「蜘蛛夫人」卡珊卓韋柏與「潔西卡瓊斯」比較，認為這兩個角色都是被社\n會孤立的邊緣人。\n\n「潔西卡瓊斯是一個PTSD的患者，這樣貼近人心的真實感，讓這部作品得以成功，我覺得\n\
  對蜘蛛夫人而言，也是一樣的道理。」\n\n本片主演達柯塔強森（Dakota Johnson）則在專訪中透露，這是她從影以來第一次在「棚\n內藍幕」前拍攝：「我從來沒在藍幕裡拍過電影，周圍都有假的爆炸聲，當有人喊『爆炸\n\
  ！』的時候，你要裝作真的有爆炸，這對我來說超級瘋狂，我當時就想，『這部電影到底\n會不會好看啊！我希望我沒有演得太差！』但是我相信導演。她工作很努力，從我們開拍\n\
  到現在，她一直沒有放棄過這部電影。」\n\n\n\n--\n                                    01/31 18:16"
