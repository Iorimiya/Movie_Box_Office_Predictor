url: https://www.ptt.cc/bbs/movie/M.1717507483.A.E83.html
title: '[新聞] 美國Netflix榜首《蜘蛛夫人》於6/15上架'
content: '新聞網址：




  【大紀元2024年05月28日訊】（大紀元記者葉子杰編譯報導）

  儘管《蜘蛛夫人》受到批評且票房慘淡， 14日在美國Netflix首映後持續一週登上榜首，

  全球超過1,000萬人次觀看，直至24日《異星戰境》上映後退居第二，但人氣依舊未減，

  暗示了超級英雄電影在串流媒體的潛力。


  索尼的《蜘蛛夫人》（Madame Web）製作預算為8,000萬美元，

  全球票房收入僅1億美元，不僅票房失利也受到許多人的批評，

  在影評網「爛番茄」僅獲得了評論家11%的超低支持率，觀眾評分57%的低新鮮度。

  據《CBR》報導，像《蜘蛛夫人》這樣反響不佳的超級英雄電影可能在串流平台上表現得更

  好。


  據報導，《蜘蛛夫人》的觀看流量很大一部分可能是因為觀眾的好奇心，

  想看看這部電影是否真的像媒體報導的那樣糟糕。

  不論有多少原因，它在美國Netflix上獲得成功與在電影院的表現形成了鮮明的對比，

  這也說明了超級英雄電影在流媒體上能有成功的機會。


  據《富比士》報導，

  《蜘蛛夫人》在Netflix 上映的第一週英語版就獲得了全球超過1,000萬次觀看，

  位居世界第二，如果依照正常電影票價約為12至13美元計算，

  一週內將超過該電影的實際票房。與付費電影的觀眾相比之下，

  部分原因在於串流媒體的電影內容多樣化，使得不同年齡及背景的觀眾更多。


  此外，據《ComicBook》報導，

  珍妮弗·羅培茲（Jennifer Lopez）主演的新太空科幻片《異星戰境》（Atlas）

  24日在Netflix首映後立即擠下《蜘蛛夫人》在美國平台排名第一，

  並且截至27日仍在全世界位居第一。不過，該片與《蜘蛛夫人》相似，

  僅獲得影評網「爛番茄」評論家17%的超低支持率，觀眾評分53%的低新鮮度。


  「爛番茄」評論員總評語：珍妮弗·羅培茲在《異星戰境》的震撼性場面中盡心盡力，

  令人欽佩，但這部科幻奇觀在劇本的重壓下顯得力不從心，

  而劇本的智慧也只是矯揉造作而已。


  《IGN》評論：一部珍妮佛·羅培茲的動作片並不能解決人工智慧（AI）的論戰，

  但它能給我們帶來片刻的歡樂。不過我們要明確一點：

  他也沒有消除人們對人工智慧威脅無數行業或其對環境影響的擔憂。


  《Variety》評論：導演布萊德·派頓（Brad Peyton）

  未能將這一人工智慧末日創意的集大成，

  打造成一場值得投資的冒險。

  缺乏原創性的想法削弱了《異星戰境》的吸引力，讓羅培茲不得不努力演出，

  就像她的角色在套話連篇的電影故事中不得不自力更生一樣。


  ——


  沒想到《蜘蛛夫人》要在6/15上架Netflix（台灣地區）耶！


  真的好興奮！順便呼應一下標題，分享了這篇篇報導







  --'
