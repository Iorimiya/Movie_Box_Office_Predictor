title: '[新聞]《蜘蛛夫人》陣容更新 黑人女星Celeste加盟'
content: '新聞網址：


  2022-05-25 11:59:51



  今日(5月25日)索尼宣佈，黑人女星塞萊斯特·奧康納(Celeste O''Connor)(《魔鬼剋星

  未來世》)將加盟漫改超級英雄新片《蜘蛛夫人》。她將扮演哪個角色，目前尚不知曉。




  《蜘蛛夫人》演員陣容更新 黑人女星塞萊斯特加盟



  S·J·克拉克森執導

  ，馬特·薩茲馬(Matt Sazama)&伯克·沙普利斯(Burk Sharpless)編劇，






  《蜘蛛夫人》漫畫裡，蜘蛛夫人本名卡珊多拉·韋伯(Cassandra Webb)，是一位癱瘓盲人

  ，行動不便，呼吸困難，靠一個看似蜘蛛網的系統維生。擁有預知能力及精神感應能力。

  她利用蜘蛛人幫她尋找一件有魔法的法寶治她的病，結果醫好了她的病，而且變回年輕。




  --


  索尼這部穩了嗎???


