url: https://www.ptt.cc/bbs/movie/M.1685549526.A.B16.html
title: '[新聞] 席德妮史威尼加入《蜘蛛夫人》飾演蜘蛛女'
content: '新聞網址：


  席德妮史威尼確認加入漫威 將在《蜘蛛夫人》中飾演「第二代蜘蛛女」茱莉亞卡本特




  席德妮史威尼即將參與演出索尼影業的《蜘蛛夫人》，而她將扮演的超級英雄角色也已經

  正式確認，將如傳聞中演出「第二代蜘蛛女」茱莉亞卡本特 (Julia Carpenter)。


  席德妮史威尼因為 HBO 的《高校十八禁》爆紅，她表示：


  「我超級興奮，迫不及待能夠談論這個角色！」




  但究竟茱莉亞卡本特是誰呢？


  茱莉亞卡本特參與一項號稱是「體能研究」的過程，不知不覺成為了實驗的對象，因此成

  為了蜘蛛女。她被注入了蜘蛛毒液和異國植物萃取的混合物，導致她獲得了與蜘蛛人類似

  的能力。


  她在漫畫中扮演了重要的角色，參與了首次的秘密戰爭事件，甚至有一段時間成為了復仇

  者。茱莉亞卡本特與克拉文家族也有一段歷史，她曾經差點因為復活獵人克拉文的嘗試而

  被犧牲。這次經歷讓她成為了新的蜘蛛夫人，因為原本的蜘蛛夫人終無法承受克拉文家族

  給她的致命傷。




  茱莉亞卡本特接任新的職務之後，她獲得了念力、預知未來和靈魂投射的能力，但同時也

  帶來了失明的副作用。


  席德妮史威尼將成為眾多才華洋溢的女演員名單中的其中一員，其他角色都曾在漫畫中擔

  任過某些時候的蜘蛛女。她將和《蜘蛛夫人》主角一同演出，傳聞也指出

  （《變形金剛5：最終戰士》）會演出蜘蛛女孩安雅克萊森，（《

  魔鬼剋星 未來世》）則會飾演瑪蒂富蘭克林。




  至於這群人將要對抗誰？《蜘蛛夫人》反派似乎是由塔哈拉辛飾演的以西結。這個角色曾

  經透過儀式而擁有類似於蜘蛛人的能力，甚至在另一個宇宙中也承擔過蜘蛛人的職務。


  席德妮史威尼將在索尼影業即將上映的 R 級浪漫喜劇《Anyone But You》中，與格倫鮑

  威爾一起演出，該片將於 12 月 15 日上映，而



  /









  /




  《蜘蛛夫人》主要卡司：



  Dakota Johnson飾演 「蜘蛛夫人」Cassandra Webb



  Sydney Sewwney 飾演「二代蜘蛛女」Julia Carpenter



  Emma Roberts 飾演 Mary Parker



  Adam Scott 飾演 Ben Parker



  Isabela Merced 飾演 Anya Corazon（未確認）



  Celeste O’Connor 飾演 Mattie Franklin（未確認）







  --'
