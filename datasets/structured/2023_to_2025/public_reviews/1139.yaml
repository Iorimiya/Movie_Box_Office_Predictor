title: '[新聞] 《蜘蛛夫人》評價慘烈直逼《魔比斯》！'
content: "《蜘蛛夫人》評價慘烈直逼《魔比斯》！達珂塔強生透露：劇本曾經歷非常劇烈的變動\n\n\n\n索尼蜘蛛人宇宙最新電影《》才上映不久，就遭到觀眾的猛烈抨擊，甚至有人稱\n\
  此片為。\n\n目前《》在爛番茄上評價僅 16%，已經逼近索尼宇宙近年最差作品《》的\n 15%。\n\n《》的主演日前向美國媒體《The Wrap》表示，拍攝時的劇本與她當\n\
  初簽合約時看到的非常不同。\n\n「，」\n\n笑說，但原先是怎樣的故事她已經不記得了，只確定先後的差異非常大。\n\n總之，的揭露顯示出兩種可能：\n\n導演\
  \ SJ 克拉克森，以及編劇凱雷姆桑加、 柏克夏普萊斯、 麥特薩薩瑪所撰寫的《\n》劇本在接近拍攝時，某種原因讓創意團隊重新糾正了原本的劇本；或是製作公司不\n\
  知為何同意了用更糟糕的劇本拍攝。\n\n\n\n\n由於達珂塔強生的角色能看見未來，意味著同樣的場景會需要拍攝好幾種版本，而當中只\n會有一些細微的改變，這也是製作《》必須面對的一大挑戰。\n\
  \n根據達珂塔強生的說法，這點增加了所有人的工作負擔。\n\n「劇本增加了許多不同的攝製機位，簡直是平常工作量的三倍。」\n\n\n\n達珂塔強生表示：\n\n\
  「劇本變得非常複雜，每場戲的不同版本就像拼圖一樣，通常只有非常細微的差異，而我\n們必須非常注意拍攝的時間點、角度，以及連戲等等這類的問題。」\n\n而也坦承自己在拍攝的過程中有好幾次在狀況外。\n\
  \n「是的，我確實在拍攝時非常迷失，但導演 SJ 總是知道我們正在拍什麼，真是不可思議\n。」\n\n\n\n\n除此之外，先前就因為沒有在藍幕前演戲的經驗向《娛樂週刊》就表示過擔憂\n\
  ，\n\n「我從未拍攝過需要在藍幕前演戲的電影。每當有假的爆炸發生時，就會有人喊『爆炸！\n』，而你就必須演出有爆炸發生的樣子。」\n\n表示：\n\n「我簡直就像神經病，根本不知道演得好不好！只希望表現得還算\
  \ OK。但我相信導演克\n拉克森。她真的非常認真，開拍後就一直非常專注在拍攝上。」\n\n\n\n\n不過至少，的表演並不是多數人批評的對象，《蜘蛛夫人》最主要的問題還是\n\
  在於劇本以及特效演出的部分。\n\n2 月 14 日上映後，《》首週票房估計只會落在 2500 萬美元上下，這甚至是兩\n個月前，漫威電影宇宙的票房災難《》首周票房的一半而已，而《》\n\
  的預算據傳為 。\n\n\n新聞網址：\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n--\n只有更爛（？\n根本沒露吧......包緊緊"
