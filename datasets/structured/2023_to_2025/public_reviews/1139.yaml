url: https://www.ptt.cc/bbs/movie/M.1708081596.A.726.html
title: '[新聞] 真的好香！《蜘蛛夫人》全台票房冠軍'
content: '真的好香！《蜘蛛夫人》一上映就空降全台冠軍


  2024/02/16

  自由時報記者許世穎




  今年首部漫威超級英雄電影《蜘蛛夫人》集結包括「格雷女」達珂塔強生、「新生代美乳

  女神」席德妮史威尼、「真人朵拉」伊莎貝拉莫賽德與賽麗絲歐康納一同演出，被譽為「

  最香」超級英雄組合。電影於新年假期最後一天（14日）在台上映，立刻以470萬登上全

  台票房冠軍。




  四位女星日前在洛杉磯首映火辣現身，包括達珂塔和席德妮都以近乎透視的網狀連身裙更

  成為全場的焦點，尤其近期身價水漲船高的席德妮史威尼，接連以性感火辣愛情喜劇《愛

  愛愛上你》，到《蜘蛛夫人》於過年期間頻頻在院線電影中亮相，成為今年情人節討論度

  最高的新生代巨星。




  席德妮提到自己在片中小試身手的超能力直說：「我的超感蜘蛛網其實與蜘蛛人的網不太

  一樣，我能讓它充滿電力並且電暈敵人，不過我覺得我們最強的能力還是我們的頭腦，希

  望觀眾看完電影能意識到，就算你沒有超能力還是能成為一個堅強的個體，只要有心就能

  達成任何目標。」《蜘蛛夫人》全台上映中。




  --'
