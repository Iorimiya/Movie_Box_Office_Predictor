url: https://www.ptt.cc/bbs/movie/M.1749872764.A.CD2.html
title: '[新聞] 「蜘蛛夫人」獲金酸莓獎 珊卓布拉克邀聚餐'
content: "「蜘蛛夫人」獲金酸莓獎 珊卓布拉克邀聚餐\n\n《蜘蛛夫人》（Madame Web）劇照，達珂塔‧強生。（索尼影業提供）\n\n【大紀元2025年06月13日訊】（大紀元記者葉子杰編譯報導）飾演「蜘蛛夫人」的女星達\n\
  珂塔‧強生最近表示，她憑藉此片獲得金酸莓獎最差女主角後，曾獲此獎的好萊塢巨星珊\n卓‧布拉克即邀約她一同吃飯，讓她相當驚喜。對於該片票房失敗，她認為，票房不好又\n\
  怎樣？誰在乎呢？那不是她的錯。\n\n索尼影業的《蜘蛛夫人》（Madame Web）製作預算為8,000萬美元，全球票房收入僅1億美\n元，成為索尼最失敗的電影之一。不僅票房失利本片也受到許多人的批評，在影評網「爛\n\
  番茄」僅獲得了影評員11%的超低支持率，觀眾評分53%的低新鮮度。最近，美國女演員達\n珂塔‧強生（Dakota Johnson）分享了自己被宣布獲得金酸莓獎最差女主角後的軼事，以\n\
  及對於該片失敗後的感受。\n\n60歲的美國女演員珊卓‧布拉克（Sandra Bullock）早在2010年就憑藉浪漫喜劇《求愛女\n王》（All About\
  \ Steve）中的角色獲得了金酸莓獎最差女主角獎，因此也加入了「金酸\n莓俱樂部」。僅獲得「爛番茄」影評員7%的爛評，觀眾評分30%的超低評價。\n\n當地9日，強生在《Good\
  \ Hang with Amy Poehler》節目中（點這）透露她憑藉《蜘蛛夫\n人》獲得金酸莓獎後受到珊卓的邀約，她說：「珊卓‧布拉克給我發了一段語音留言說：\n\
  『我聽說你加入了金酸莓俱樂部，我們應該一起吃早午餐。我們應該每個月都聚一次早午\n餐。』」\n\n強生解釋說：「但收到她的這條訊息時我完全慌了，因為她對我來說是一名電影巨星。我\n\
  當時心想：『喔天啊，這真是太瘋狂了。』」\n\n\n好萊塢巨星珊卓‧布拉克資料照。（Rich Fury/Getty Images for SXSW）\n\n對於《蜘蛛夫人》票房失利，4日，強生新電影《天作之合》（Materialists）時接受了\n\
  《洛杉磯時報》採訪，她說：「這不是我的錯，現在有一種情況，很多創意決策都是由委\n員會做出的，或者是由一點創意細胞都沒有的那些人做出來的。這樣做藝術真的很難，或\n\
  者說很難做出娛樂性的作品。」\n\n強生補充說：「我覺得很不幸的是，《蜘蛛夫人》一開始是朝著這樣發展的，但結果變成\n了那樣了。那時候我只是隨波逐流罷了，但這種事經常發生，大預算電影失敗的情況總會\n\
  發生。」\n\n雖然如此，但這並未讓強生之後再參加大預算的片子有障礙。她說：「我並沒有把這件事\n當作什麼傷口去貼OK繃，我從來沒有想過說：『哦，我再也不會做那種事了。』我甚至拍\n\
  過一些小預算電影，票房不好又怎樣？誰在乎呢？」\n\n或者，就像她在《Good Hang with Amy Poehler》節目中說的那樣：「我又能怎麼辦呢？\n\
  為了《蜘蛛夫人》哭泣嗎哭個死去活來？」\n\n儘管《蜘蛛夫人》受到批評且票房慘淡， 去年5月，該片在美國Netflix首映後持續一週\n登上榜首，全球超過1,000萬人次觀看，雖然第二週退居第二但人氣依舊未減，暗示了超\n\
  級英雄電影在串流媒體的潛力。\n\n責任編輯：蘇漾\n\n\n\n--\n                 \n   \n\n\n\n--"
