url: https://www.ptt.cc/bbs/movie/M.1708515056.A.F45.html
title: '[負雷] 蜘蛛夫人 免費票也不該來看的！(雷)'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  公司發個免費電影票


  想不到看什麼就隨便來看蜘蛛夫人


  想說腦袋放空當個英雄爽片看也好


  最爛也不會比驚奇隊長二爛吧


  結果呢


  完全不爽沒打戲沒文戲沒感情戲


  整部電影根本把觀眾當智障


  開頭就主角媽懷孕中去找蜘蛛


  找到之後反派叛變搶走蜘蛛


  主角媽被蜘蛛咬到生下女主後就掛了


  然後轉到女主長大後


  女主意外覺醒預知能力


  反派這邊就做夢夢到被三個蜘蛛女幹掉


  ps.這是這部劇中唯一的英雄打戲...


  難怪預告都剪進去了


  之後就去找這三個人，剛好查到三人在同一台列車上


  女主也預知到就跑去救人


  在反派動手前就帶著這三人逃走了


  這邊反派就打了幾個站務員跟警衛展示了一下力量


  三人都不太相信女主


  女主要三人先留在原地躲起來不要走，自己先離開一下


  然後三人聽到這FLAG當然是不可能不走


  跑到附近餐廳聚餐嘍～


  女主這邊查到反派身份


  就預知到反派要去幹掉那三人然後自己也被幹掉


  馬上開車跑去撞反派之後大家逃走


  把這三人丟給朋友之後要去當初找到蜘蛛的地方找線索


  不過這段一點都不重要，整個刪掉也沒差


  反正就知道當初主角媽為啥要找蜘蛛這樣


  後來朋友家的孕婦要生了


  三女一起帶著去醫院


  被反派找到，女主這時又預知到了


  帶著三女跑去一個煙火工廠?


  反正就一堆煙火


  在反派追來的時候點燃這些煙火


  把反派炸的乒乒乓乓


  但反派還是沒被炸死


  最後追出來的時候


  被掉下來的百事可樂招牌壓住


  在那叫啊叫的最後還是被壓死了


  (這邊我笑了，根本搞笑劇)


  最後就女主變成蜘蛛夫人


  說以後三個女蜘蛛都會變成蜘蛛女英雄


  啊幹 反派都死了未來才會變成蜘蛛女哦???


  三小


  整部電影不知道在演什麼


  除了預知預告那片段外


  根本沒有蜘蛛女跟反派蜘蛛的打戲


  三個蜘蛛女完全沒用


  硬要蹭彼得帕克現場觀眾也根本無感


  預知這重點也編排的不好


  感情戲也是0，劇情也爛


  完全不知道在幹嘛，廢到笑


  比電視劇還不如


  這跟我說預算要8000萬美???


  真的沒騙錢嗎?


  完全浪費我兩個小時看完還超不爽


  蜘蛛夫人 免費票也不該來看的！(雷)


  --

  就真的不知道在幹什麼

  宣傳全部穿蜘蛛戰衣


  然後只有預知跟結局有出現一下

  實際上根本沒有穿戰衣和反派打

  沒打鬥也沒懸疑

  預知一點緊張感都沒有

  不知道導演編劇到底在想什麼

  根本想詐欺，預告片還在那邊穿戰服說要迎戰

  然後實際上大決戰是煙火、招牌...

  完全沒有英雄打鬥'
