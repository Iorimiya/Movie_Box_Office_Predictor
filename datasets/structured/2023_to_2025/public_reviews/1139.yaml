url: https://www.ptt.cc/bbs/movie/M.1705854022.A.566.html
title: '[新聞] 化身超級英雄！《蜘蛛夫人》達珂塔強生'
content: '化身超級英雄！《蜘蛛夫人》達珂塔強生：第一次演出藍幕攝影


  Yahoo奇摩電影戲劇編輯部


  2024年1月21日 週日 下午10:16




  《蜘蛛夫人》（圖：Sony）


  1. 達珂塔強生將在新片化身超級英雄。


  2. 這還是她第一次挑戰挑出藍幕攝影。


  3. 她更在片中過足了飛車特技的癮頭。


  【文／血紅蘭姆】


  《》女星坦承，這是自己第一次挑戰藍幕攝影，因此她也不知道自己

  究竟演得好不好。


  隨著電腦特效近三十年來大行其是，綠幕、藍幕攝影也越來越盛行，劇組不再需要千里迢

  迢地出外景，光是在攝影棚內架起巨大綠幕、藍幕，演員只要獨自對著攝影機演得活靈活

  現，就能轉瞬間上山下海或飛簷走壁。


  但在少了外景、道具佈景或對手戲演員之下，也有不少人演起戲來總覺得渾身不對勁。


  「甘道夫」便曾因為《》系列電影中用上大量綠幕攝影而一度拍到失控

  流淚，抱怨著：「。」




  《蜘蛛夫人》（圖：Sony）


  索尼蜘蛛人宇宙新作《》的片中舞台設於2003年，將飾演一名曼哈頓

  的急救人員，在因緣際會之下意外獲得了預知能力，得以未卜先知地窺見未來的種種發展

  。


  她將和另外三名女性聯手合作，好在死敵一路追殺之下逃出生天。


  以《》而嶄露頭角的雖然影壇資歷不淺，但她向娛樂周刊透

  露，本片還是自己第一次挑戰藍幕攝影：


  「我先前從來不曾嘗試過藍幕攝影，而當一場假的爆炸戲上演時，有人正在大喊：『爆炸

  ！』而你也得假裝像是真有爆炸一樣。」


  「這對我來說，實在太令人精神錯亂了。我心想：『我不知道自己演得究竟好不好，我希

  望自己的表現還算過得去。』但我十分信任導演SJ克拉克森，她工作起來很拼命，自從本

  片開鏡以來，她從來沒有鬆懈過一分一秒。」


  「對我來說最重要的是，片中女主角是有血有肉的凡人，深深紮根於現實，而她的人生也

  能讓觀眾感同身受。當你雙眼能發出雷射光時，有時候會讓人很難感同身受。」


  她也不忘打趣道：「但我可就不一樣了，我一天到晚都在發出雷射光。」


  除了初次挑戰藍幕攝影之外，也在片中過足了飛車特技的癮頭。


  「我有機會拍上一整天的飛車特技，而看來我對此十分在行。我是說，自己開起車來能完

  成許多狂野特技。」


  還開玩笑地向好萊塢頭號動作巨星下戰帖：「我在片中開了一輛救護車、開了

  一輛計程車，我在片中無所不開，只差沒有飛在半空中、衝出一座大樓。但除此之外，我

  則要說：『。』


  片中有一場戲是由計程車直直衝進餐廳裡，「我沒有實際開車撞進餐廳，這有點令人失望

  。我真的很想這麼做，不過除非你是，否則劇組可不希望讓主角親身冒險。但

  我就快邁向那個境界了，我正在努力當中。」


  《》將於2024年2月14日在台上映。




