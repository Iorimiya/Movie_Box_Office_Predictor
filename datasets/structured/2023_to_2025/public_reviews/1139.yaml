title: '[新聞] 《蜘蛛夫人》首週票房成索尼宇宙新低'
content: '《蜘蛛夫人》首週票房成「索尼宇宙」新低、比《魔比斯》更差！上映後還面臨大量退票

  潮




  （圖片來源：索尼影業）


  早在開拍之前就不被各界看好的索尼漫威宇宙新作《蜘蛛夫人》（Madame Web）上週三起

  陸續於各國上映，果不其然開出慘澹票房，單在北美地區，僅進帳約 2620  萬美元，海

  外則進帳 2570 萬美元，全球首週加總起來則只有五千多萬美元出頭。


  對比其它索尼宇宙電影，《猛毒》（Venom）系列兩集的北美首週都有超過八千萬美元、

  《魔比斯》（Morbius）也至少有 3910 萬美元的開盤，《蜘蛛夫人》這成績無疑是墊底

  墊得紮紮實實。




  （圖片來源：索尼影業）


  《蜘蛛夫人》在北美首週甚至輸給傳記劇情片《雷鬼之父：音樂無國界》（Bob Marley：

  One Love），《雷鬼之父》憑 5200 萬美元遠高於預期的成績穩坐冠軍，《蜘蛛夫人》則

  以近乎少一半的數字名列當週第二名。


  《蜘蛛夫人》和《雷鬼之父》兩片的製作費其實差不了多少，前者維持著索尼宇宙一貫的

  預算標準，和《猛毒》《魔比斯》 同樣都控制在七八千萬美元至一億美元內，而《雷鬼

  之父》的預算也同樣落在七至八千萬美元，但理當佔有超級英雄品牌優勢的《蜘蛛夫人》

  卻因為一系列的操盤失誤而慘敗。




  （圖片來源：索尼影業）


  《好萊塢記者報》（THR）採訪的一位匿名連鎖戲院業者更透露，《蜘蛛夫人》上週三上

  映的當晚，原本已經購買預售票的消費者還突然紛紛退票，導致銷售數字即時下滑


  （註：原因很可能是聽聞負評而打退堂鼓，《蜘蛛夫人》的媒體評價就是壓到上映前夕才

  公佈的）。


  他更吐槽：「當你期望一部電影起碼要有《

  文：Joker


