title: 'Re: [普雷] 蜘蛛夫人（有劇情）'
content: '想說板上都說不好看


  去看完了其實也沒很難看


  小甜甜的歌最棒了，二十年的的音樂放到現在還是經典好聽


  把這當歌喉讚的心態去看就好了


  女主正，放的音樂好聽


  當作是很長的MTV看也還行吧


  反正你不太需要去追究mtv的劇情


  不然你可以去看關鍵下一秒啊


