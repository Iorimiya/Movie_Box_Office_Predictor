url: https://www.ptt.cc/bbs/movie/M.1710176404.A.52F.html
title: '[新聞] 《蜘蛛夫人》製片還想拍續集?'
content: '新聞網址：



  【文／戴西福福】


  《蜘蛛夫人》上映後票房、口碑慘遭滑跌盧，


  但差評似乎無法阻擋電影製片的熱情，


  仍期盼有機會拍攝續集！


  且索尼影業也不打算


  因為這次《蜘蛛夫人》的失敗，


  就放棄蜘蛛人系列作品的偉大藍圖，


  正積極籌備著更多蜘蛛人相關作品。




  《蜘蛛夫人》的製片人洛倫佐·迪·波納文圖拉(Lorenzo di Bonaventura)


  近日向外媒《Discussing Film》


  分享了他對「蜘蛛夫人」後續發展潛力的看法，


  他提到，「蜘蛛夫人」（達珂塔強生 飾）


  還沒有完全掌握她的能力，


  且這部電影是她的起源故事，


  她還可以有許多發展的可能性。


  而他認為，

  席德妮史威尼(Sydney Sweeney)、

  賽麗絲歐康納(Celeste O''Connor)和

  伊莎貝拉莫娜(Isabela Merced)

  飾演的三位蜘蛛女，


  還有許多發展的可能性，


  尤其她們在漫畫中


  也有許多故事可以做為題材發展，


  因此，洛倫佐·迪·波納文圖拉說：




  雖然洛倫佐·迪·波納文圖拉期待《蜘蛛夫人》拍續集，


  不過來自於影評與影迷的口碑或票房，


  都讓這部電影的後續發展不太樂觀。


  目前《蜘蛛夫人》全球票房目前僅7,740 萬美元，


  這樣的成績，很難讓索尼影業對它的續集給出綠燈。





  儘管索尼影業蜘蛛人宇宙陸續推出


  《魔比斯》、《蜘蛛夫人》等差強人意的作品，


  但他們仍企圖打造更多蜘蛛人相關作品。


  根據外媒《The Ankler》，最新消息就是，


  尼可拉斯凱吉（Nicolas Cage）


  正在洽談演出真人版《暗影蜘蛛人》(Spider-man Noir)影集。




  有看過動畫《蜘蛛人：新宇宙》的觀眾，


  可能會對全身黑白的「暗影蜘蛛人」印象深刻，


  而凱吉叔正是這個角色的配音，


  他有可能升格演出真人版電影，


  儘管這個消息並未獲得索尼影業的證實，


  但也足夠讓許多粉絲興奮不已。


  尼可拉斯凱吉近年來挑戰了


  不少風格獨特的作品，


  而暗影蜘蛛人自帶「黑色電影」的危險與神秘感，


  若由凱吉叔來詮釋這個角色，


  想必能帶給粉絲們許多驚喜，


  而這也讓才剛因為《蜘蛛夫人》


  而感到失望的部分影迷，


  又再次對蜘蛛人系列作品燃起期待。



  --'
