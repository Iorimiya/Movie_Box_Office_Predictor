title: '[新聞] 席妮史威妮不在乎《蜘蛛夫人》口碑翻車'
content: '新聞網址：


  原標題:


  2024-03-15 15:03:24



  ，就連本

  片卡司都在宣傳期間「不演了」直接放飛自我，包括主演 達柯塔強森（Dakota Johnson

  ，下圖）就持續在宣傳活動上批評這部電影，甚至還因此傳出惹火索尼高層。






  而近期同時也以《愛愛愛上你》（Anyone but You）成為新生代女神的同片演員 席妮史

  威妮（Sydney Sweeney）則在訪問中坦承，她對於《蜘蛛夫人》的慘烈評價並不擔心：






  事實上，早前席妮史威妮也在《週六夜現場》（Saturday Night Live）節目開場中自嘲

  ：「你可能有在其他作品中看過我，但你絕對沒有看過我在《蜘蛛夫人》的演出。」藉此

  挖苦這部遭受慘烈評價的電影。



  席妮史威妮近期憑愛情喜劇《愛愛愛上你》與「劊子手」葛倫鮑威爾（Glen Powell）之

  間的火花大受歡迎，緊接著還有一部驚悚電影《鬼聖胎》（Immaculate）即將在本月底上

  映，該片講述她所飾演的少女來到修道院後，居然奇蹟似地無性生孕，而其背後似乎還隱

  藏著更多陰謀。



  --'
