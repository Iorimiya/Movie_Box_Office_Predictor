title: '[無負雷] 蜘蛛夫人 建議上串流再看就好'
content: '首先我得說句稱讚的話，它的選角真的不錯女生很漂亮，

  可是也這樣，再無其他優點了。

  美術乏善可陳，劇情、特效更是差勁讓我想逃離電影院。


  最糟糕的是它明明是蜘蛛人漫畫改編的起源電影，

  但角色的鋪陳和超能力表現卻非常牽強，

  這麼說或許會很失禮，我認為把蜘蛛改成別的也沒差。

  我建議把錢留起來等上串流再看就好。



  --

  每個蜘蛛人都有自己特殊的蜘蛛能力，通常和經歷有關，

  可是女主角的經歷和能力的交集是什麼我實在不知道，

  也或許原作就是這樣交代的。

  可能是另一種嘗試嗎？

  所有角色的成長都要靠鋪層，不然怎麼有共鳴？

  連猛毒這種爽片都有戲份去刻畫了，不看這個要看什麼？

  還是你根本聽不懂別人說話。

  怎麼又是陳這個字，我真的有一天會被它害死。'
