url: https://www.ptt.cc/bbs/movie/M.1718473011.A.0CD.html
title: '[意外雷] 《蜘蛛夫人》不要抱著錯誤期待看這部'
content: '雷文防雷資訊頁








  先說結論，在被劇透的情況下看這部真的好看很多，而且比驚奇隊長2值得看！


  這部的雷點已經知道了，


  1.有點沒邏輯的劇本


  2.讓人頭暈的拍攝手法


  3.稍微有點尬的演技和對戲


  4.打鬥場面很少


  那先說第1點，其實漫威一堆劇本都比這部還沒邏輯，


  特別是《蜘蛛人：無家日》，若不是賣情懷的關係，《蜘蛛夫人》的劇本真的好很多！


  微噴一下《無家日》的劇情，


  首先那個失憶咒用在幫朋友大學錄取上？


  而且沒先跟教授求情？咒語亂施法沒先討論好？


  我相信如果你能接受《無家日》的話，肯定能看《蜘蛛夫人》！


  第2點，超暈的拍攝手法，回憶一直閃回，連最感動的母女重逢那場戲，


  都暈到我很出戲…，而且除了一直閃回，鏡頭還很喜歡180°   或360°   一直轉，


  還好我不是去電影院看的，相信看4dx我會當場吐出來！


  第3點，稍微有點尬的對戲，這三個女生我覺得沒什麼火花，四個人一副我不認識你一樣，


  不過真的就像她們說的，「她們就像女童軍」，的確都不認識的聚在一起也是那樣，


  所以演起來很自然；反而最不自然的是那個以西結，完全就不知道在幹嘛？？


  第4點，這就是普遍負評的原因，故意剪一部“動作戲”的預告片出來幹嘛？？


  你預告片所有的畫面，基本上就是電影的大部分動作戲，連超色蜘蛛裝的畫面也超少，


  還好我早就被劇透知道這點，如果當時衝著超色蜘蛛裝來看這部，我肯定給「極負雷」！


  最後，也不想瞎吹這部，我也指出一些明確很瞎的地方！


  這部警察真的很沒用，女主搶了車牌28X5的taxi，然後拔掉車牌卻不把車頂的拿掉？？


  國安局你有幹員被以西結幹掉，系統被駭都完全不知道？超弱智…


