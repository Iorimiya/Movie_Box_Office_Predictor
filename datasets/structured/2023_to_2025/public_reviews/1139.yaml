url: https://www.ptt.cc/bbs/movie/M.1736160571.A.8B4.html
title: '[新聞] 「驚奇少女」演員給《蜘蛛夫人》極差評分'
content: '「驚奇少女」演員在Letterboxd上給《蜘蛛夫人》打了極差的評分！




  就像大多數觀眾和影評人一樣，根據伊曼維拉尼最近在Letterboxd上對這部電影的評分來

  看，她似乎也不喜歡2024年的票房毒藥《蜘蛛夫人》。


  《蜘蛛夫人》於2024年2月上映，收穫了大量的負面評價，它的名氣似乎更多來自於它所

  產生的迷因，而不是電影本身。觀眾批評了從演技到劇本的一切，這一切都是眾多製作問

  題和溝通不良的結果。



  這種（或許是意料之中的）觀眾反應對於索尼蜘蛛人宇宙來說是司空見慣的，之前的《魔

  比斯》和《獵人克萊文》也得到了類似的回應。事實上，前者甚至惡名昭彰地成為了一個

  非常受歡迎的迷因，以至於它重返戲院後又再次慘敗。



  伊曼維拉尼本週回歸Letterboxd，分享了她對超過564部新電影的評分，其中包括她給了0

  .5/5星的《蜘蛛夫人》。


  結合她在2025年回歸Letterboxd之前的評分，維拉尼已經評價了超過1000部電影，而且看

  過的電影更多。這包括幾部漫威和DC電影，以及來自各種其他類型和時代的電影。


  《蜘蛛夫人》是她列出的評分最低的漫畫改編電影之一，另外兩部獲得0.5/5星的超級英

  雄作品是《蜘蛛人驚奇再起2：電光之戰》和2017年的《正義聯盟》。評分稍高一些的1/5

  星作品則有：《蝙蝠俠對超人：正義曙光》、《超人：鋼鐵英雄》和《雷神索爾2：黑暗

  世界》。


  身為著名的漫畫和超級英雄粉絲，維拉尼對許多超級英雄和受漫畫啟發的電影（和影集）

  都給予了很高的評價。她給予5星評價的超級英雄和漫畫相關作品（包括在她最近回歸Let

  terboxd之前和之後的評分）有：


  《復仇者聯盟》

  《復仇者聯盟：終局之戰》

  《蝙蝠俠》

  《大英雄天團》

