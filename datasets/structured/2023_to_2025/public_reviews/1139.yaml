title: '[ 負雷] 蜘蛛夫人'
content: '1.劇情差，裡面太多吐槽-負評

  2.打鬥畫面超少，預告片都已經播完-負評

  3.蜘蛛女孩最後也沒變身成超能力-負評

  4.Dakota後面不知道怎麼突然變盲人以及癱瘓，前面有提到罹患肌無力，雖然漫畫裡面的蜘蛛夫人也是盲人和坐輪椅-沒意見

  5.蜘蛛夫人在漫畫或動畫蜘蛛人裡面是配角，但看完實在不覺得她很適合拍成英雄片，預知能力看到真的很無聊-負評

  6.Sydney在裡面扮蜘蛛女孩其中一個普妹，去看IMDB和預告片才知道是她演的，浪費她好身材，像愛愛愛上你這樣應該會吸引很多人來看，黑人就不講無感，之前演Dora和變形金剛5的Isabela顏值算不錯-但還是給負評

  7.今天去看Imax，有送海報和紅包，但紅包都過年已經過了才送-負評

  8.無彩蛋，不用浪費時間和電影票去看，整部片都是負評，謝謝大家



  -----

  Sent from JPTT on my Samsung SM-S9010.


  --


