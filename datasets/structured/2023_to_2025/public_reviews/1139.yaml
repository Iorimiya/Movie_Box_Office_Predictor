title: '[負雷] 蜘蛛夫人 不知道在演啥'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  劇情簡述：


  凱西原本是一名救護人員

  某天因為要救一名傷患而卡在車裡，從橋上掉入水中

  當她獲救後擁有了預知未來的能力，可以看見即將發生的危險

  後來在被追殺的過程中凱西救了3位女孩，並和他們組成超級女英雄聯盟

  由凱西帶領著女孩們迎戰未知的超級大反派


  心得：

  一開始看蜘蛛夫人，其實覺得還可以

  只是鏡頭畫面一直頻繁切換讓人很煩躁

  也容易抓不到重點

  雖然知道是想表現凱西的預知能力

  但這樣的演出方式對我來說是蠻扣分的



  說是這樣說，但在他跟三個女孩相遇前都還看得下去

  但到後面實在是被切到一個頭暈目眩支離破碎

  注意力被搞到很難集中，雖然勉強看到結束，但感覺就是很差

  另外不知道是我沒注意到還是劇情真的沒做好交代

  到最後我還是不明白三個女孩跟凱西到底是有什麼關係

  總之是完全不推薦的一部片


  --

  原來是我放錯重點嗎哈哈

  還真的沒看

  好喔'
