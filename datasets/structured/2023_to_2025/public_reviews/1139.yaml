url: https://www.ptt.cc/bbs/movie/M.1720348297.A.481.html
title: '[新聞]「蜘蛛人媽媽」艾瑪羅伯茲護航《蜘蛛夫人'
content: "「蜘蛛人媽媽」艾瑪羅伯茲護航《蜘蛛夫人》：網路迷因才是慘敗的元凶、大家都把你當\n笑話看\n\n\n新聞網址：\n\n\n\n\n索尼蜘蛛宇宙電影《蜘蛛夫人》（Madame\
  \ Web）口碑票房雙雙慘敗，不僅影評和觀眾一面\n倒吐槽，就連主演達柯塔強森（Dakota Johson）都加入批評索尼高層的行列，並誓言「\n絕對不再接拍超英類型電影」。不過，並不是每個演員都認為是《蜘蛛夫人》的作品本身\n\
  造成了口碑的翻車。\n\n在片中飾演蜘蛛人生母「瑪莉亞帕克」的女星 艾瑪羅伯茲（Emma Roberts）最近在《\nVariety》專訪中便透露，她認為造就《蜘蛛夫人》慘敗的主因在於好萊塢大環境的不可\n\
  預測性，以及網路惡毒的迷因文化。\n\n「世事總是難料的。現在大家好像都喜歡假裝，自己可以預測事情成敗的走向。但事實是\n你無法預料。有些東西明明很糟，但卻能在\
  \ Tiktok 上爆紅；有些東西成功了，但你看了\n又質疑它過譽。」\n\n艾瑪認為，作為一名演員，她並不害怕失敗、不害怕別人對自己的作品品頭論足：「我個\n\
  人很喜歡《蜘蛛夫人》，非常享受這部電影。我覺得裡面的大家都很棒。我認為導演\n S.J.克拉克森 （S.J. Clarkson） 非常出色，她是我決定參與這部電影的原因。」\n\
  \n她認為，如果不是網路文化將這部電影當成了笑話：「我認為我們得到的反饋會有所不同\n。這也是讓我對很多事感到失望的原因，甚至我做過的事情，現在大家只會把一切當成笑\n\
  話。」\n\n她也補充：「這沒甚麼好秘密的，不外乎就是對的事情遇到對的時機，其他的就是祈禱跟\n許願。」\n\n喇牙媽媽\n\n--"
