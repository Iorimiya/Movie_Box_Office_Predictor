url: https://www.ptt.cc/bbs/movie/M.1712334747.A.278.html
title: '[好雷] 蜘蛛夫人'
content: '防雷






























  原本不抱期待


  結果其實蠻好看的


  本片內容呈現拍得很像美劇的精華剪輯


  特效也很美劇


  原本應該是一整季的內容濃縮到一部電影的長度


  我想這個應該是評價不好的主要原因


  故事主軸與內容說真的很有趣


  但是每一個轉折都有點生硬


  如果哪天高層決定原班人馬重拍成影集


  絕對看爆



  片中達珂塔強生身材真的好


  穿搭也頗有質感


  但是敵不過穿著樸素依舊搶眼的席德妮史威尼


  雖然包緊緊 但是該跳動的時候還是會跳


  幾霸昏


  還有一個讓我驚艷的是另一個蜘蛛女


  第一眼沒什麼感覺


  後來在旅館頭髮半遮臉微微低頭的模樣


  超正


  查了一下才發現是爸爸們最愛的家庭電影朵拉與失落的黃金城主角


  又繼續查發現速成家庭她也有演


  原來我看了她演的好幾部片卻一直記不住



  另一個驚喜則是艾瑪羅勃茲客串


  當初是在全家就是米家認識她


  但是之後好像沒有太多大放異彩的好作品



  可能是因為片長的關係


  所有穿著英雄服的場景都是未來的片段（或預知夢）


  這樣的話當初根本不用宣傳她們的英雄服啊


  加起來上場大概不到20秒



  雖然本片評價普遍很低


  但我觀影後的感受


  其實跟芭比還有奧本海默差不多


  這兩部電影一致好評


  讓我期待有點高


  實際看了之後 好看是好看


  但是期待太高反而有點小失落


  蜘蛛夫人一致負評


  實際看了之後 缺點是很明顯


  但是不期不待反而覺得很開心


  這樣一拉一扯


  在我心目中這三部片的評價反而一樣了



  與其拍驚奇少女跟女浩克


  倒不如一開始就把這部片拍成影集


  濃縮的太精簡


  可惜了黃金陣容


  好想看完整交待劇情的蜘蛛夫人


  --'
