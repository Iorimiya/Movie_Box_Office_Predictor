content: '雷文防雷資訊頁



  有雷，雷很大，真的雷...



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  去之前已經聽很多人說過不好看了，

  但老婆覺得廣告看起來還行，好吧就進戲院去瞧瞧


  一開始的劇情覺得還行，


  但從女主遇到三小少女後就覺得開始瞎七八亂演，編劇腦子有洞到底在編什麼鬼？


  明明是反派出來爆打殺了一狗票警察，

  三個少女也都可以自由行動，沒有被拘束，只是跟著跑來跑去，

  然後新聞通報是女主綁架三名少女，對反派屠殺一點都沒提到？

  正常人邏輯一個女人是有能力一次幹掉那麼多警察？死法？凶器？


  ok好沒問題，你要把女主當成綁架逃犯也行，

  那她開著一台偷來的計程車到處逛大街，是不會想到換車嗎？

  新聞都報過了，

  整個城市的人看到一台拔掉車牌的計程車到處晃來晃去都視而不見？


  更別提她後來直接開計程車直接撞進餐廳救人，

  還可以很優閒地開著這台車頭撞爛、沒掛車牌的計程車，

  用綁匪的身分，安安穩穩的住進汽車旅館？？？


  後來更好笑了，身為一個綁匪的身分，

  還可以繼續開著這台偷來又撞爛、沒車牌的計程車，

  去機場泊車，大搖大擺地買機票平平安安出關去祕魯玩一個禮拜，

  然後回來再繼續開著贓車回家？？？

  這部贓車是會隱形喔？全世界沒人看得到這台車？？？


  身為一個綁匪，連換一台車開的基本常識都沒有？？？


  反派也是莫名的廢到笑，


  只有一開始出場的時候，爆殺一堆警察看起來很威，

  第二次出場....被計程車撞趴倒地....

  第三次出場....被救護車撞趴倒地....

  (九天玄女有跟他說過今年犯太歲有車關嗎...^^")

  再下一次....廢話說半天殺不了四個手無寸鐵的女生...

  然後被廣告看板砸到就領便當了......

  可以算是史上最廢反派嗎...？


  再來，最後蜘蛛夫人再出現，

  眼就瞎了，就坐在輪椅上了...

  好，眼瞎前面看起來是有被炸藥炸到給過，

  那癱瘓呢？是有受傷還是肌無力症導致？好歹也交代一下吧？


  對了最後想到再補一個，

  反派男主前面莫名其妙去歌劇院，跟一個熟女眉來眼去，然後就回家上床了，

  原來認識？不認識？看起來我猜是不認識

  但是有多少人會跟一個看音樂劇坐在你隔壁不認識的人看完就回家打拋？


  最好笑的是這女的還是國安局的人？皮包裡有槍？

  然後這麼隨便沒有警覺性就會跟不認識的人回家？

  到底是乾旱多久有這麼飢渴？？？

  然後被督完以後就被隨便握個手手毒死幹掉了？？？

  男主就拿了她的不知道識別證還是密鑰甚麼鬼的，用來之後駭入國安網路？


  這個角色的出現，就是莫名硬要跟男主來一發領便當，幫他駭入國安網路這樣而已？


  這個編劇真的是好棒棒，我到底看了什麼...


  --'
