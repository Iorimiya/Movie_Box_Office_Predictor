title: '[負雷]蜘蛛夫人'
content: '雷應該不多啦


  這部很瞎 不知道在演什麼


  感覺就只是交代蜘蛛夫人的誕生而已


  可是這不是超級英雄電影嗎


  怎麼搞成文藝片


  唯一亮點 四個妹子都不錯


  女主角很正 三隻小蜘蛛就青春貌美


  連黑人都不錯 但是超級英雄電影就是要大場面超爽的鏡頭啊


  挖咧 這特效一點都不電影


  還好本來沒抱期望的另外幾部片很不錯


  1.強力推薦還錢 蠻好笑的 這部賀歲片竟然沒有大賣可惜了  五個主角都演得不錯


  陳柏霖剃掉鬍子好像年輕的蘇有朋 女主角剛開始我還以為又是王淨 結果不是


  算是很證的徐佳瑩吧  特別推薦  吳慷仁有夠會演 我要封他是新一代的演技之神了


  簡直就是當代梁家輝 梁家輝各式各樣的角色他都可以拿捏  相比之下 梁朝偉是厲害


  但戲路很固定


  2.逆轉廢柴人生 不錯笑 不過結局好像不夠激勵人心


  3.鴨鴨向前衝 鴨鴨可愛 鴨鴨務實


  --

  可這部不虧錢嗎?'
