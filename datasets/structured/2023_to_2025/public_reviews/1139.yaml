title: 'Re: [討論] 蜘蛛夫人 首發預告'
content: "看了預告，感覺拍得動作戲有點生硬，\n\n\n\n\n而且似乎好萊塢拍過很多這類型題材了，\n\n若是中規中矩去拍，應不會失手吧？\n\n\n\n\
  劇情看得出來大概是「我預知你的預知」這種情節。\n\n外文介紹說是懸疑驚悚片，可是預告看不出驚悚在哪？\n\n是預告片剪得很爛，還是他根本就不是什麼驚悚片。\n\
  \n可能外媒說的驚悚是指情節有女性一個一個被殺就算是吧。\n\n\n\n\n\n看不出來電影中有「拍出」他給出很大的威脅性，\n\n不是用台詞講出敵方有威脅性就好了，畫面上也要有啊！\n\
  \n\n\n可能性一，預告片剪得剪得很爛，沒把優秀鏡頭剪進去？\n\n可能性二，這個「敵役角色」根本不算是什麼瘋狂惡劣。\n\n所以電影中其實也沒有「呈現出」他狂殺亂殺的「邪惡貌」。\n\
  \n可能性三，可能宣傳重點不是他所以就沒什麼他的絕技畫面？\n\n\n\n也不能說沒有他的畫面，但看得出來敵方角色，\n\n\n\n\n\n當然敵角不會因為行事風格有一個好理由，故事上就變成非敵角，\n\
  \n很多觀眾能理解他在說啥的敵役角色，或甚至觀眾能認同的，\n\n電影中也不是沒有這種安排，這種寫得很好的敵方人員。\n\n可是《蜘蛛夫人》這部預告片的問題是（或著說不是問題），\n\
  \n\n\n好啦，除了他有跑來殺屬於主角方的正妹，可是這算壞男人是嗎？\n\n可是預告片的「呈現上」看不太出來他是一個殺人魔之類的壞蛋。\n\n「你不知道那些女孩會變成什麼？」\n\
  \n「我覺得他能預知未來。」\n\n這些台詞應該可看出主要敵角是有某種程度的預知能力。\n\n\n\n\n\n\n\n由於先前傳出，由於《蜘蛛夫人》（Madame\
  \ Web）漫畫中是一老夫人，\n\n達珂塔強森的角色應該是「茱莉亞」，即所謂的二代蜘蛛夫人，\n\n不過既然預告片中達珂塔強森（Dakota Johnson）已喊出別的角色名字是「茱莉亞」，\n\
  \n所以也間接證實先前的這個猜測傳聞，明顯是不對的。\n\n\n\n\n\n而很多一閃過過的畫面似乎暗示（甚或明示）這幾個女生，\n\n\n\n\n\n\n\n\
  \n\n不只三部、不只四部、不只五部；妳（女主角）現在還沒有，\n\n但是我（惡角）從我的預知能力，知道妳（女主角）將會成為蜘蛛夫人。\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n結果惡角（？）沒成功，女主角（達珂達強森飾）成功成為蜘蛛夫人。\n\n惡角表示：我告訴你們，不要再拍那麼多漫威英雄電影了，\n\n\
  我差不多要成功殺光那些（未來會變成英雄的人）了，\n\n結果你們派一個有預知能力的蜘蛛夫人來不斷他媽的阻止我……。結果我失敗了。\n\n我成了失敗的人（Spider-Man）。\n\
  \n差不多是這樣……。 XDDDD\n\n\n\n--\n                                    11/18 01:17"
