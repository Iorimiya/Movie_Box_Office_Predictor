url: https://www.ptt.cc/bbs/movie/M.1707983410.A.C7A.html
title: '[ 負雷] 蜘蛛夫人'
content: '對不起，我該相信爛番茄的










  防雷





  這到底甚麼鬼東西，好久沒看到這麼莫名其妙的東西了

  整片唯一優點是達珂塔強生很漂亮，席德妮史威尼前面絕對領域很香

  其他都不知道在幹嘛


  對白莫名其妙，蜘蛛夫人去了一趟秘魯回來就突然整個茅塞頓開，接受自己命運的也太快了

  吧，跟前面也差太多

  黑人妹角色設定有夠煩躁的，很不討喜

  然後反派到底是三小，你穿的跟蜘蛛人一樣啊表現出來的大概是有史以來最爛的反派，整天

  被撞來撞去，然後最後面被煙火射的東倒西歪，到底？？？

  然後原本想說會看到三個年輕妹子穿戰衣一起打一下之類的，完全沒有，就後面蜘蛛夫人未

  來視的時候跑出來一下，超短

  然後超多片段就加個特效改個音樂水時數，莫名其妙

  最後面那個蜘蛛絲分身更是我看了三小反派在你前面阿妳兩眼一閉開始發功，那特效更是廉

  價到無言以對

  反派死的也是超級可悲，到底，你打那個毒液有什麼卵用啊


  總之不要去看，浪費錢==


  ----

  Sent from on my Google Pixel 7 Pro


  --'
