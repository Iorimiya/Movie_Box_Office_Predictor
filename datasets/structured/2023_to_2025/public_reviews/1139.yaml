title: '[新聞] 《蜘蛛夫人》更多未曝光戰袍照釋出引熱議'
content: "《蜘蛛夫人》更多未曝光「蜘蛛戰袍」釋出　三位蜘蛛女戰服造型細節引熱議\n\n\n\n\n在票房慘敗、影評口碑不振的情況下，《蜘蛛夫人》（Madame\
  \ Web）仍因其角色戰服而獲\n得部分讚譽。近日，多張未曾公開的劇照曝光，展現三位蜘蛛女——席妮史威尼（Sydney\n Sweeney）、伊莎貝拉莫娜（Isabela\
  \ Merced）、賽麗絲歐康納（Celeste O'Connor）完\n整的服裝造型，包含戴上與卸下面具的模樣。\n\n\n\n劇照中可以看到精心設計的戰服細節，雖然有粉絲認為席妮所扮演的「茱莉亞」服裝，若\n\
  能加上眼部鏡片會更為完美，但整體完成度仍獲得讚賞。\n\n\n\n不過令人惋惜的是，這些角色在正片中僅短暫登場，造型沒有獲得足夠展現。外界推測，\n原定計畫是讓她們在續集裡全面披掛上陣，但隨著電影的失敗以及索尼暫緩部分漫威計畫\n\
  ，這樣的可能性幾乎不復存在。\n\n\n\n\n導演 S.J.克拉克森（S.J. Clarkson）在接受訪問時，談到如何將這些戰服搬上大銀幕。\n她直言：「很簡單，就是請到Ngila\
  \ Dixon。她是一位極其出色的服裝設計師，總是從角\n色出發，思考他們是誰、他們想成為什麼樣的人，以及希望如何被展現。」\n\n\n\n她補充表示，角色造型需要在自信與不確定之間取得平衡，既反映她們作為普通青少年的\n\
  一面，也象徵未來潛力的自我。\n\n\n\n\n《蜘蛛夫人》不同於傳統超級英雄電影，以懸疑驅動的驚悚風格講述卡珊德拉韋伯（Cass\nandra Webb）的起源故事。該角色由達珂塔強生（Dakota\
  \ Johnson）飾演，是一名或許具\n備預知能力的曼哈頓急救員，與三位年輕女性結下羈絆，並一同面對致命威脅。\n\n\n\n\n\n--"
