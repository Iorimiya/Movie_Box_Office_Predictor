url: https://www.ptt.cc/bbs/movie/M.1748013307.A.34F.html
title: '[新聞]評價炸裂卻不悔！席德妮史威尼演《蜘蛛ꐠ'
content: '評價炸裂卻不悔！席德妮史威尼演《蜘蛛夫人》？她坦白很大原因是為了家人


  評價炸裂卻不後悔！席德妮史威尼為何要接演《蜘蛛夫人》？她坦白很大原因是為了家人


  憑藉《高校十八禁》、《白蓮花大飯店》逐漸嶄露頭角的席德妮史威尼，近年來炙手可熱

  ，並在多部影視作品中有令人印象深刻的表現。不過，由索尼影業發行的《蜘蛛夫人》卻

  成了她演藝事業的「特別作品」，根據她的說法，當初接下這個角色，很大一部分是為了

  討家人歡心。


  在接受《帝國雜誌》專訪時，席德妮史威尼回憶起《蜘蛛夫人》的拍攝經歷，儘管這部電

  影最終遭遇口碑滑鐵盧，她仍對拍攝過程津津樂道，認為這為她帶來寶貴的曝光機會。


  「參與一部比自己更具知名度的作品總是令人興奮。當時我還沒有過大製片廠電影的經驗

  ，而我剛成立了自己的製片公司Fifty-Fifty Films。我手中有一些希望帶進工作室的項

  目，也需要提升自己在好萊塢大片市場中的價值和地位。」


  她透露，參演《蜘蛛夫人》還有另一個溫馨理由——讓年幼的表親們能看到她的表演。


  「另外，我也想拍一些讓表親們能觀賞的電影。他們很多還是青少年，對我的工作內容一

  知半解。我覺得能參與一部讓他們覺得酷炫有趣的電影，是件很棒的事。」



  遺憾的是，《蜘蛛夫人》最終在觀眾和影評人心中都留下慘痛印象，成為她演藝生涯迄今

  評價最低的作品。不過，席德妮史威尼並未因負評而減損對這部電影的熱忱。


  「說實話，我度過了愉快的拍攝時光，這對我而言最為重要。我認為如果你享受工作過程

  ，票房表現就不是那麼關鍵了。當然，你仍希望作品能獲得讚賞和成功，因為這意味著所

  有參與者都獲得了成功。」


  此前，席德妮史威尼曾多次公開闡述參演《蜘蛛夫人》的動機，坦言這是一個「策略性商

  業決策」，有助於與索尼高層建立良好關係。此外，這部電影也為她帶來豐厚報酬，讓她

  在多次訪談中對這部作品表達感謝。


  《蜘蛛夫人》的演員陣容還包括達珂塔強生、賽麗絲歐康納、伊莎貝拉莫塞及亞當史考特

