url: https://www.ptt.cc/bbs/movie/M.1729132355.A.C18.html
title: '[新聞] 2024票房大失敗《蜘蛛夫人》僥倖逃過一劫'
content: '新聞網址：





  記者蘇詠智／綜合報導


  2024-10-16 16:23:07


  好萊塢在2024年又推出了一堆票房不如預期、令電影公司賠得鼻青臉腫的失利之作，其中

  《蜘蛛夫人》、《小丑：雙重瘋狂》，分別由漫威與DC漫畫改編，前者是上半年被修理得

  最慘的大失敗，後者可能成為下半年反應最不理想的大成本影片，形成尷尬的巧合，而《

  小丑：雙重瘋狂》挽救了《蜘蛛夫人》登上年度冠軍的慘劇，網友虧：「把5年前首集多

  賺的賠回來。」


  各大電影公司在通過拍片企劃前，大多抱持著賺錢的希望，無奈期望越高、失望越大的情

  形總是會發生。漫畫改編電影曾經在全球各地所向無敵，近年來卻走下坡，《蜘蛛夫人》

  在這種氣氛下推出，本來就難拉抬氣勢，偏偏片子拍攝過程又有很多的問題，觀眾與影評

  一致抨擊不知道編導在拍什麼，女主角達珂塔強生也無法裝作自己拍了一部曠世佳作，唯

  一勉強幸運的是，今年下半年出現了同樣漫畫改編、下場更慘烈的《小丑：雙重瘋狂》，

  使《蜘蛛夫人》相較之下，不是那麼可怕的敗作。


  根據歐美媒體的報導，《小丑：雙重瘋狂》編導陶德菲利普斯自己選擇要讓片子走現在這

  種風格，而男主角瓦昆菲尼克斯支持這個方向，哪怕大多數觀眾可能並不欣賞。據估計該

  片有可能讓電影公司賠超過1億5000萬美元，甚至到2億美元的程度，美國第2個週末的票

  房數字已經比首週末下滑8成，也是近年來最驚人的紀錄。


  除了《蜘蛛夫人》、《小丑：雙重瘋狂》，今年還有評價還不錯、觀眾卻不感興趣的《特

  技玩家》，預計會虧損5000萬美元。風格溫馨的《幻幻之交》，票房也意外的不理想，固

  然不至於賠到5000萬美元，也還是會有虧損。至於美國票房破億、全球破2億美元的《魔

  鬼剋星：冰天凍地》，不會賠錢卻也沒大賺，不算符合預期。而重啟的《龍族戰神：重生

  》、電玩改編的《邊緣禁地》、好評如潮卻賣座慘淡的《芙莉歐莎：瘋狂麥斯傳奇篇章》

  ，都是今年讓片商笑不出來賠錢影片。



  --'
