url: https://www.ptt.cc/bbs/movie/M.1710929534.A.242.html
title: '[新聞] 席妮史威妮稱《蜘蛛夫人》是她和索尼打好'
content: '席妮史威妮稱《蜘蛛夫人》是她「和索尼打好關係」的基石：拍了才有《愛愛愛上你》可

  以拍




  之前分享過，「蜘蛛女」（Sydney Sweeney）認為自己不在意《》（

  Madame Web）失利的票房與口碑，認為自己「」而已。


  近日，她在《GQ》雜誌的訪談，解釋了這段話的意思：


  「對我來說，這部電影是個基石，讓我能和索尼影業建立良好的關係。如果沒有演出《

  》我就沒辦法和高層的決策者打好關係，我職業生涯的每一步都不只是為了作品而

  已，更是一種商業上的決策，因為拍了《》，我才有《》（Anyone B

  ut You）和《》（Barbarella）可以拍。」


  《》是與下一個合作的項目，改編自 1968 年的同名情色科幻電

  影，據悉將由《》（Last Night in Soho）導演 艾德格萊特（Edgar Wright

  ）洽談執導。


  史威妮解釋：


  「《》是一部大型製作，我只是以演員的身分受雇而來，我很高興能夠將一個漫

  畫角色帶上大銀幕，我的小姪子們對此都很興奮。

  。」


  對於《》的拍攝過程是否有出什麼問題，史威妮只說：「拍這樣的電影會有不同

  的操作模式，這跟我以往習慣的確實不一樣。」


  新聞來源： GQ


  新聞網址：




















  --


  查了一下，原版的上空英雄是由珍芳達飾演女主'
