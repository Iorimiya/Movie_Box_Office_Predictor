title: '[情報] 索尼首位女英雄！達柯塔強生有望主演《蜘蛛夫人》'
content: '根據 Deadline 的最新獨家報導指出，曾以《格雷的五十道陰影》大展知名度的美國女演

  員 Dakota Johnson 將有望主演索尼漫威宇宙中的《蜘蛛夫人》（Madame Web）。




  《蜘蛛夫人》獨立電影將由曾執導過《漫威潔西卡瓊斯》和《漫威捍衛者聯盟》等影集的

  英國女導演 S.J. Clarkson 掌鏡，他至今尚未執導過電影，《蜘蛛夫人》將會成為他的首

  部院線長片作品。而該片編劇則由曾執筆過《德古拉：永咒傳奇》和《荷魯斯之眼：王者

  爭霸》等片的雙搭檔 Matt Sazama 和 Burk Sharpless 共同編寫，他們也是索尼漫威最新

  反派電影《魔比斯》的編劇。


  「蜘蛛夫人」這個角色在漫畫原作當中是一位年邁的女性，因為患有「重症肌無力症」而

  與一個蜘蛛網形狀的生命維持器相連，且因為他的身體狀態並沒有積極的與反派對抗。蜘

  蛛夫人先天失明與癱瘓，但也是擁有心電感應、透視與預知能力的變種人。




  索尼一直在尋找他們的第一位女性超級英雄，目前看來《蜘蛛夫人》極有機會扛下這個重

  責大任，而 Dakota Johnson 也成為了選角的領跑者。不過從年齡設定來看與原作相去甚

  遠，知情人士也強調，基於這些原因，電影的設定很有可能有大幅度更動，且因為蜘蛛夫

  人「第六感」的能力，很可能被設定為索尼漫威宇宙中如同「奇異博士」定位的角色。


  Dakota Johnson 從《格雷的五十道陰影》系列畢業後積極轉型，近來演出了如《窒息》、

  《花生醬獵鷹的願望》和《失去的女兒》等多部受到相當好評的獨立電影。且在剛結束的

  日舞影展上，由他自製自演的兩部電影《Cha Cha Real Smooth》和《Am I OK?》成為今年

  影展中最受好評的電影之二，且已分別被 Apple 和華納兄弟（HBO MAX）以高價買下版權

  ，由此也可見 Dakota Johnson 在電影製作上也獨具慧眼。




  --'
