url: https://www.ptt.cc/bbs/movie/M.1719579498.A.831.html
title: '[負無雷] 影仔看電影 - 蜘蛛夫人'
content: '影仔看電影 － 蜘蛛夫人 / Madame Web　(2024)



  　　這部電影很有名，大家都說不好看。有人戲稱電影讓《魔比斯》看起來像《教父》，

  真是讓人噴飯的比喻～ 基於好奇心還是決定看看，如何才能讓評價如此慘烈。



  　　這部電影做錯不少事，首先是角色的塑造極差。達珂塔強生有些美貌，但是拍這部戲

  她肯定有些狀況外.. 角色心境前後連貫不太起來。女主角沒什麼個性，也沒什麼特色，

  前半段就看她一直懵懵懂懂。三個小女生也是，性格跟設定都很普通，且連樣板化的演出

  都做不太到；她們就像棋子，不停地講著劇本裡的台詞。我個人認為劇本跟導演的問題很

  大，在演員不清楚狀況，導演功力也不夠，劇本也不好等等因素綜合，才成為我們看到的

  《蜘蛛夫人》。



  　　特別還想提的是「台詞」，以往看電影不會去注意台詞好壞，但這次真的差到有感。

  許多的台詞都詞不達意，讓劇情推進有明顯違和、輕飄飄的感覺。我剛好隔天看了《站在

  我這邊》，是史蒂芬金的小說作品改編。這部電影劇情非常順暢，台詞寫得相當到位，每

  一句都再適切不過了。《站在我這邊》有獲得奧斯卡最佳改編劇本獎，跟《蜘蛛夫人》連

  在一起看，台詞好壞有天壤之別。



  　　接著讓我們去逆向推論一下《蜘蛛夫人》的出發點，我想了幾個可能的目標。１介紹

  ”蜘蛛夫人”這個角色，２要建立起一個女性的蜘蛛人小隊，３可以多發展多重宇宙性質

  的劇本。感覺起來挺不錯的吧，可惜，進展的並不理想。



  　　看達珂塔·強生的美貌，看她開著無牌的計程車在紐約市跑來跑去，看反派努力地想

  擺脫命運的枷鎖，看三個小女生還算可愛。看看劇情安排的彩蛋 (居然有班叔跟蜘蛛人生

  母的角色)，還有滿滿的吐槽點。索尼就這樣又完成了一部蜘蛛人宇宙的相關電影，出發

  點不錯，下次別出發了？



  影''s 2024 06 21　給分：6/10 分


  FB粉絲頁 - 影仔製造





  --'
