url: https://www.ptt.cc/bbs/movie/M.1707927000.A.917.html
title: '[普雷] 蜘蛛夫人 女主們好正'
content: '我覺得選角選的不錯 女主們和男反派







  劇情大概是就是女主角的媽媽為了替女主角凱西


  （還在肚子裡面）治病什麼肌肉無力的病


  才去祕魯尋找傳說的蜘蛛 結果找到的時候就被


  反派節奏還被殺死 死前剛好媽媽被蜘蛛族人救走


  咬一口生下凱西 然後凱西就有第六感能力


  反派也有能力超人力量 爬牆 還會用手釋放神經毒素


  但是會夢到被蜘蛛女孩們殺死


  反派要趁著蜘蛛女孩還沒長大殺死他們


  所以預告看到的片段都是蜘蛛夫人和反派的未來


  正片蜘蛛女孩根本沒拿到能力 稍嫌可惜


  結尾就是蜘蛛夫人使用她的預知能力打倒反派蜘蛛人


  但是自己也失明然後也無法動彈 我也不知道為什麼


  我猜是中了反派蜘蛛人的神經毒素


  然後結尾就是蜘蛛夫人 坐在輪椅上和失明


  要帶領蜘蛛女孩打擊犯罪


  這邊很瞎 誰能接受自己突然失明還不能動


  X教授都沒能這樣吧 我看都失落一陣子


  但是這部選角都很年輕 20初頭 大概是要等其他部連動吧


  選角選的不錯 但是劇情太過牽強


  我看別人介紹漫畫有說有蜘蛛圖騰 神力在感覺往這個


  方面還不錯





  --'
