url: https://www.ptt.cc/bbs/movie/M.1708097825.A.9A1.html
title: 'Re: [情報] 《蜘蛛夫人》美國首映票房收入低於魔比斯'
content: "這YTer位講得蠻到位的:\n\n這部電影真的展示了好萊塢的一個差異:\n\n女星為了紅地毯穿成這樣 vs 女星在電影裡被設計穿成那樣\n\n\n\
  \n紅地毯的場合是為了讓她們廣告自己這個品牌\n\n\"你看 這裡有個電影首映會\"\n\n\"挖 我看起來真的很正\"\n\n\"所以雇用我參演下一部電影\"\
  \n\n\n\n這說明了 身為女演員 她們完全知道觀眾想看什麼\n\n她們完全知道要怎麼樣最有效地行銷自己 行銷自己給下一個雇主\n\n所以你必須納悶 好萊塢難道不知道同樣的行銷手段\n\
  \n不只對這些雇主有效 同樣也對觀眾有效嗎??\n\n\n\n把電影裡面這些女星的扮相 直接套用她們走紅地毯的穿著\n\n你就會多賺很多錢 就是這麼簡單 難道好萊塢都不知道嗎??\n\
  \n\n\n讓我想到Bill Burr對電影演員的專業也有過這種看法:\n\n\n\nBill Burr:\n\n我的外表頂多只有五分 我是一個禿頭的紅髮男性\n\
  \n你們難道覺得我在好萊塢能拿到的角色會沒有天花板嗎?\n\n你以為我有可能拿到浪漫喜劇男主角的工作嗎? 不可能發生\n\n\n\n我如果拍電影 我會希望我花的錢能賺回來\
  \ 這就是娛樂產業\n\n我們已經投入幾百萬進去這部電影了 我們當然會想回本賺錢\n\n然後你就要這樣邋遢進入片場 嘴邊還有麵包屑就開鏡上工嗎??\n\n\n\n\
  \n\n\n\n\n老兄 班史提勒在拍\"門當父不對\"的時候有腹肌\n\n他只不過是演一個郵差而已 完全沒有這個必要\n\n但是他就是知道 \"我在電影裡有脫掉上衣的鏡頭\"\
  \n\n               \"我不要事後被別人臭我腰間多贅肉\"\n\n               \"那就健身吧 練出腹肌 在電影裡展現出腹肌\"\
  \  這就叫做專業\n\n\n\n所以我真的不懂現在的好萊塢 是都不想賺錢了嗎??\n\n\n\n總之推薦Bill Burr這整個段子\n\n正好跟本版最近在講的議題有關\n\
  \n尤其這一段也特別有感:\n\n\n\n你知道什麼讓我改變了想法??\n\n我之前去印度幹一件活 那裡的人很棒 但是有些我在那裡看到的事情永遠不會忘記\n\n\
  我永遠不會忘記我看到一個小嬰兒 在兩輛停好的車中間當場大便\n\n然後就這樣離開 沒有尿布 沒有褲子 沒有父母 就這樣緩緩離去\n\n像漢尼拔在\"沉默的羔羊\"\
  的結尾那樣消失在人群裡\n\n\n\n這是我一生中看見最心碎的事情之一\n\n然後我回到我的國家\n\n看到有人在那邊瞎BB\"喔喔喔製片公司要我減50磅才肯讓我演這部電影~~\"\
  \n\n我心裡只想嗆他\"那你怎麼還不跑起來，死肥仔?\"\n\n\n\n比爾博的喜劇真的很讚 話糙理不糙阿XDDDD\n\n--"
