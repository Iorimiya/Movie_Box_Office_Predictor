title: '[負雷] 蜘蛛夫人 我到底看了什麼？'
content: "劇情毫無邏輯 敘事也亂七八糟 莫名其妙\n\n我到底看了什麼？\n\n防雷分隔線============\n\n1973年：\n\n一個懷孕九個月即將臨盆的孕婦\
  \ （女主他媽）\n\n在秘魯叢林裡面找一種蜘蛛 傳說中可以治百病\n\n還可以賦予人類超強體能 有個原住民部落都是這種超人類\n\n因為太危險了所以有個護衛（反派BOSS)保護她跟小隊\n\
  \n有一天 女主他媽真的找到了傳說中的蜘蛛 反派馬上翻臉把人殺光把蜘蛛搶走\n\n彌留之際有個老頭出來把女主他媽撿走 （撿屍？）\n\n泡在山洞的泉水裡給蜘蛛咬了一下…然後女主他媽還是領便當了\n\
  \n但萬幸女主還是出生了 （幹這三小）\n\n然後老頭就把剛出生的女主帶走了\n\n現代：\n\n女主是一個救護車急救人員\n\n有一個工具人男搭檔（後面真的根本以為跟女主有戲\
  \ 結果一路都是工具人）\n\n一次出勤女主不小心掉進河裡\n\n工具人把她救起來之後 突然發現自己有預知未來的能力\n\n視角切到反派這邊 背景完全無交代是幹嘛的\n\
  \n只是在豪宅裡養了那隻當年搶來的蜘蛛 撿了一個CIA臥底大媽上床\n\n內射下毒逼迫大媽交出密碼後大媽就領便當了（這床戲毫無美感 可以跳過）\n\n反派交代了一下每天做惡夢被三個蒙面人殺死\n\
  \n所以要用CIA的系統依照夢裡的面貌找出這三個蒙面人\n\n結果交代一個女手下用系統比對出這三個人剛好在一個火車站上了同一節車廂（幹之前比\n對多久都找不到\
  \ 剛好在同一個地方就被找到）\n\n女主剛好在火車上 預知到反派要來殺這三個妹（反派就是2P色的蜘蛛人 不會發蛛絲只會\n在天花板上攀爬的癡漢）\n\n帶他們搶了一台計程車跑到森林裡（這計程車也很有梗\
  \ 後面交代）\n\n先介紹三個妹子\n\n1號眼鏡妹 之前繼母在醫院被女主救過 有一面之緣\n\n2號黑妹 之前在馬路上擋住女主開的救護車 對她比中指\n\n\
  3號偷渡妹 住女主家樓下 無身分滯留美國\n\n女主要三個妹在森林裡等她三個小時（幹這邊我也看不懂 到底在跑三小 報警不行嗎？）\n\n然後回家翻出老媽的筆記\
  \ 發現反派原來是老媽當年的護衛（幹這怎麼又突然認出來了）\n\n三個妹阿不聽話跑到附近的餐廳跟路過的男大生打情罵俏\n\n女主靠著預知能力追到餐廳剛好在反派追來的的時候救下她們（幹這反派都沒手下可以用\n\
  \ 凡事親力親為有夠血汗）\n\n又開著那台搶來的計程車跑路去汽車旅館 隔天把三個妹阿丟包給工具人男\n\n要他照顧一個禮拜 她要依照筆記去秘魯解開謎團（幹說走就走\
  \ 你之前怎沒走？）\n\n結果找都不用找 直接到電影開頭的同一地點 遇到那個救她老媽的老頭\n\n老頭把她推到泉水裡 突然能看到過去原來老媽是女主還在肚子裡被診斷出重症肌無力症\n\
  \n所以才要在懷孕的時候去秘魯找蜘蛛希望治好女主（幹重症肌無力是無藥可救的病嗎？）\n\n這老頭講了一些幹話叫女主相信自己還啥小的女主就回到紐約了\n\n幹秘魯這段完全意義不明\
  \ 那老頭是誰也根本沒解釋\n\n當初怎麼把女主丟回紐約的也沒說 敘事超亂\n\n工具人男一直帶三個妹阿住大嫂家 這時候剛好工具人男的大嫂要生了（別問我為什麼大\n\
  哥不在是工具人負責顧大嫂）\n\n工具人開車帶大嫂+3妹阿要去醫院\n\n女主開著一個禮拜前搶來的計程車（幹這計程車是什麼神器）來到工具人男的大嫂家撲空\n\n\
  剛好換了救護車依靠預知能力追上工具人男的車\n\n反派Boss又血汗的追來了\n\n女主帶著三個妹阿躲進一個裝滿煙火的危樓（好像是之前救災的地點 有這麼多危險物品\n\
  都沒人管的歐）\n\n點燃煙火 轟轟轟 碰碰碰 砰砰砰\n\n女主這時候終於有發揮一個類似分靈體的三個分身同時要救三妹阿\n\n但詠唱到一半被反派斷法（笑死）\n\
  \n反派一路追殺女主一路衰洨的被煙火炸 扑街到路上 被砸下來的招牌壓死\n\n然後女主又掉進水裡了（？）\n\n三妹阿又好像沒事不需要人救的把女主從水裡撈起來用女主教的CPR救回來\n\
  \n然後電影最後女主就cos一下X教授 坐在輪椅上說一下幹話\n\n大意是啥預知三個妹阿以後都是超能力英雄 可喜可賀\n\n就在賀歲片的氛圍中結束了…\n\n\
  我他媽到底看了什麼？\n\n要打打戲沒打戲 要床戲沒床戲 要劇情沒劇情\n\n當賀歲片看也不好笑\n\n頂多只有那個眼鏡妹還滿可愛\n\n那個工具人男也不知道是戲份被剪光還三小\n\
  \n一路就工具人跟大嫂+3妹阿的淫亂一個禮拜拍出來都比正片好\n\n我操\n\n\n--\n這種廢片我的確沒什麼認真在看\n\n很多不合理的細節我根本懶得寫\n\
  \n不如你回一篇補上 意下如何？"
