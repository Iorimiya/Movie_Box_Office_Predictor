url: https://www.ptt.cc/bbs/movie/M.1707884378.A.E37.html
title: '[普雷] 蜘蛛夫人（有劇情）'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  先來個票根人權圖








  真的是有點......不好看......


  不過女主角們很正 看在夠香份上......


  還是給個普雷好了......


  個人感覺...魔比斯好像比較好看......



  女主角演技有點尬，感覺是撐不太起來


  加上顏值有點略顯老態......


  感覺巔峰期已過，幫QQ



  這部就是30路阿姨拯救三個失學少女的故事


  大概比小美人魚跟驚奇隊長好看一點（個人感受


  然後比魔比斯難看一點


  大概感覺跟猛毒2差不多 真的很尬


  劇情...無言...中間很拖


  反正就是阿姨某天掉到水裡 超能力突然覺醒


  然後在火車上遇到三個貌似失學少女


  然後阿姨善心大發 運用超能力拯救她們的故事


  然後阿姨的同事是班叔 然後瑪麗帕克剛好懷孕


  故事結尾剛好彼得帕克剛好出生了


  阿姨跟三小少女組成貌似打擊犯罪的團體之類的


  然後本片完...傻眼。


  有點無言 感覺票房應該不會太好


  只能看女主角們的顏值了


  只能靠阿姨跟三個妹子撐場面了


  是說反派也很弱 隨便就被廣告招牌砸死


  無言 還好本部沒什麼期待


  想看的人是最好有心理準備 不要期待太高


  會比較好


  感覺百事可樂有置入行銷 整部片出現多次


  片裡沒有女主角有露奶 想看奶子的人可能會失望


  大概是這樣



  水行俠閃電俠 還比較好看 起碼中規中矩



  喔對了 裡面一直出現小甜甜布蘭妮的歌串場


  結尾還有小紅莓樂團的歌 傻眼



  --

  設定年代好像是2003左右

  真的沒什麼動作戲份 不要期待什麼大場面

  猛毒2的最終boss戰好像還比較精彩...

  改了

  真的有點老了

  硬要拍的結果

  也是 只能這樣安慰了

  這次沒有 好難過QQ

  感覺應該會憤怒

  如果是跟這些X片比的話 確實

  米老鼠拍可能會變成三個都是黑人女然後超肥

  索尼很懂

  成本好像是8000萬美金左右'
