url: https://www.ptt.cc/bbs/movie/M.1700123382.A.190.html
title: '[新聞] 蜘蛛夫人首支預告曝光 格雷女聯手美乳'
content: '《蜘蛛夫人》首支預告曝光　格雷女聯手美乳女神對抗神秘反派


  2023/11/16 10:46


  【記者黃閔／綜合報導】


  電影《》網羅人氣女星「」，與《》性感新星

  聯手拯救世界，由《》以及紅遍全世界的英國影集、《醜聞真相

  》的導演S.J.克拉克森執導，賦予這位萬眾矚目的漫威角色全新面貌。


  首支預告片終於在昨（15）日曝光，再度引爆對各個角色特殊能力以及故事時間線的推測

  討論。




  達珂塔強生飾演蜘蛛夫人。索尼提供


  在今天曝光的首支預告中，飾演凱西的偶然發現她有預知未來的能力，能夠看

  到即將到來的致命危機，這也將大大改變她原本擔任救護車急救員的生活。


  不管是在餐廳外還是地鐵站中看到的幻象，都有一位身穿全黑戰服的神秘人物，在追殺她

  與另外三位女孩夥伴，困惑的凱西必須搞清楚她們之間的複雜關係，並且帶領三位女孩對

  抗未知的強大反派。


  《》是睽違多年後再度回歸好萊塢商業大作，她表示超級興奮能夠飾

  演這位話題超級英雄。


  同樣也是首次擔綱超英電影的，更提到當她獲知得到「蜘蛛女」這個角色時

  ，她簡直嚇壞了，並且直接跑到漫畫店裡把所有提到蜘蛛女的漫畫都買回家了。


  對於近期觀眾對的疲乏，她也表示完全不擔心，「《》是一部與眾不同

  的超級英雄電影，絕對超出大家的想像！」


  《











  《》電影預告


  --

  樓上不是貼了

  上面不是有人貼了'
