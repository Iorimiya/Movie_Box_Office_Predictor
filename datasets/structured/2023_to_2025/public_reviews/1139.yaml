url: https://www.ptt.cc/bbs/movie/M.1710074974.A.602.html
title: '[新聞] 達柯塔強森承認《蜘蛛夫人》拍爛、惹火'
content: '達柯塔強森承認《蜘蛛夫人》拍爛、惹火索尼影業！高層被爆氣得大罵她：扯後腿、不負

  責任


  新聞網址：



  演員回頭自認多年前拍過的某部電影很失敗，是再常見不過的事，但在上映和宣傳期間就

  直接承認自己主演的電影很糟糕，這種例子就相對偏少了，而達柯塔強森（Dakota

  Johson）最近就成了少見的其中一例，當她受訪時被問到對《蜘蛛夫人》（Madame Web）

  的如潮負評和票房慘敗有何看法時，她索性就誠實直言，電影的《蜘蛛夫人》 品質不佳

  完全是因為索尼影業的大力干涉。


  然而強森的發言，似乎也惹毛了索尼內部的高層，《Daily Mail》爆料，索尼高層相當不

  滿強森這種行為，毫不客氣地痛罵強森在「扯後腿」、完全「不想負半點責任」。索尼內

  部更有不少人質疑，強森的名氣並不如預期中地那麼有號召力，而她對《蜘蛛夫人》的貶

  低，日後也可能讓她捲入一些麻煩。


  《Daily Mail》的消息來源也指出，索尼其實並不介意同樣身為《蜘蛛夫人》主演之一的

  席妮史威妮（Sydney Sweeney）在綜藝節目《週六夜現場》（Saturday Night Live）的

  開場白吐槽《蜘蛛夫人》的票房不好，他們可以接受這種小小的玩笑，但是像強森這種口

  氣十分認真的嚴厲檢討，而且還將責任全部推給索尼，這就讓他們忍不下去了。


  據悉，有些其它參與《蜘蛛夫人》製作的人員還覺得，假如《蜘蛛夫人》票房大賣、但劇

  情內容完全不變，強森絕對就會改口說很幸運參與其中，並分享各種對續集計劃的期許，

  而不是像現在這樣批評電影公司。


  竟然敢得罪金主,索尼之後直接通通封殺


  --'
