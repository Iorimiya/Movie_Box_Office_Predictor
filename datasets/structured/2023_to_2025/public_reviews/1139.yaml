url: https://www.ptt.cc/bbs/movie/M.1707886942.A.39C.html
title: 負[ 雷] 蜘蛛夫人（有劇情透露）
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這是本人第一次在PTT上發文，

  過年太無聊加上在台中鄉下看電影並不貴，

  打發時間之餘就幫各位版友們衝一波，


  簡單條列說明

  1.並未有精彩打鬥，完全沒有，從頭到尾只有女主角一人有預知能力。

  2.少女三人實際上並未有超能力，預告三人身穿蜘蛛裝皆為女主預見未來之畫面。

  3.女主透過預知未來將反派引到充滿爆裂物的大樓內，東閃西躲加上三位少女的尖叫，最

  後女主誘導反派被鋼構壓死，完全感受不到反派的強大。

  4.其餘部份前篇版友已說明，演技空洞、劇情交代不明。


  其實細節吐槽點過多，

  相信陸續會有版友發文，


  女主救護員同事為蜘蛛人叔叔班帕克，

  影片最後有稍微帶到蜘蛛人彼得帕克為時間背景2003年的紐約出生。


  影片最後完全沒有彩蛋，

  所以不用等待有任何驚喜，


  如果今天帶異性朋友看電影過情人節的千萬別選這片。





  --'
