url: https://www.ptt.cc/bbs/movie/M.1716826710.A.B37.html
title: '[ 負雷 ]  蜘蛛夫人超雷 反派爛到生氣'
content: '雷文防雷資訊頁


  完全沒看評價和預告 就直接去看蜘蛛夫人

  以下有劇情雷


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  蜘蛛夫人爛到無法相信是漫威電影

  尤其是反派爛到令人生氣

  一直被車撞、被日用品重擊

  弱成這樣

  颱風天出門可能都會被路樹壓死

  某智慧過於常人的小學生也一腳就可以踢死了


  整部劇情平淡又不知所云

  前半段花三十分鐘話家常只想表達一件事：

  “我會不會其實有超能力”


  各種橋段也非常出戲

  比如女主一直搶車都沒有人要抓

  車主根本都GTA的NPC

  被搶車過10秒就算了

  女主出國前搶的車 回國後還可以繼續開


  當反派透過全美國監視器網路在追殺三個女生時

  她們躲了幾天 結果竟然只套個帽T就出門了

  美國人就這麼排斥戴口罩嗎？


  整部出現超多次CPR橋段

  中間還花不少篇幅在教學CPR

  甚至讓三個女生輪流壓一陣子

  學校播的衛教片都沒這麼無聊

  而且每次CPR沒有一次有吹氣


  雨林尋藥的橋段讓我想到Green Hell

  但不論敘述還是表現手法 完全不及十分之一

  不如什麼神秘部落、傳說都拿掉

  隨便演去爬山被蜘蛛咬了一口就有超能力

  比較不浪費時間


  整部唯一像英雄片的打戲只有短短不到一分鐘

  而且只在反派的夢裡

  夢中反派是跟取得超能力後的三個女生對打

  但直至片尾

  女主都變X教授了

  三位都還沒獲得超能力


  --

  那段就反派的最強的高光時刻了'
