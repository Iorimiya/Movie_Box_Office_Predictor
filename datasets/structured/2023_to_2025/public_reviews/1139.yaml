url: https://www.ptt.cc/bbs/movie/M.1709622848.A.E5D.html
title: '[新聞] 索尼宇宙中國踢鐵板 蜘蛛夫人票房大慘賠'
content: "索尼宇宙重返中國踢鐵板！《蜘蛛夫人》首周末「票房大慘賠」遭《周處除三害》等片無\n情輾壓\n\n\n\n索尼蜘蛛宇宙電影《》（Madame Web）在全球持續創下令人驚嘆的新低口碑，而\n\
  本片在上周五 （1 日）起於中國院線上映。\n\n然而，這部近期少數得以進攻中國市場的好萊塢大片，首周末票房表現遭到無情輾壓。\n\n根據《THR》報導，《》上周末在中國院線上映，是自《》（Venom）後，\n\
  暌違多年再度進攻中國的第二部，卻僅獲得了 63.8萬美元的開片票房，更\n出現大量退票潮。\n\n報導指出，《》檔期強碰台灣犯罪電影《》上映，該片在同日於 \n\
  \ 同步上線，且中國版遭大量刪減，依然在中國獲得1620萬美元的可觀數字，登頂票\n房冠軍，更打破中國自農曆新年以來的票房紀錄，超越張藝謀的《第二十條》與的《\n\
  》等熱門本土作品。\n\n\n\n另外，隨著《沙丘：第二部》（DUNE: Part 2）也將在 3 月 10 日於中國上映，上週也\n展開了《沙丘》首部曲的重映，並獲得了\
  \ 67.4萬美元 的票房。\n\n對於久違重返中國院線的而言，這無疑是雪上加霜的壞消息。\n\n自2020年疫情爆發後，在中國就遇上了許多難關，直到 2023年《黑豹2：瓦干達\n\
  萬歲》（Black Panther: Wakanda Forever）與《》（Ant-Man\nand the Wasp: Quantumania）才正式重返中國市場。\n\
  \n新聞來源： THR\n\n新聞網址：\n\n\n\n\n\n\n\n\n--"
