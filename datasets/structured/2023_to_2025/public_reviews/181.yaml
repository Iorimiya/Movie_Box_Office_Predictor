title: '[有雷] 驅魔編年史：起源之戰'
content: '海報防雷















  ~~~~~~~~~防雷結束~~~~~~~~~~


  勇猛無雙，重情重義的大個神父

  機緣巧合被傳授多年功力的少年

  複雜親屬關係的密教王子


  恩? 好熟悉的樣子?






  故事改編自韓國奇幻小說《退魔錄》，結合韓國傳統薩滿信仰、東方密教與西方天主教等宗教元素，以截然不同的「驅魔儀式」展開跨宗教的鬥法大戰。


  訝異版上沒有看到任何相關新聞，可能跟撞到鬼滅有關，幫QQ


  初次看韓國動畫電影：美術風格類似奧術那種帶著濃濃油畫風格，每場打戲跟動作可以看得出有精心設計；沒話說，真的強。


  可能是受限於電影長度，也可能是角色太多，很多情緒沒有充分帶到位。各路人馬莫名其妙組團打魔王的那種光速推進的感覺。


  戰術戰略是什麼？莽就對了


  但畫面美術擺在那邊很，不要深入思考劇情的話，做為爽片還是很ok的。



  --'
