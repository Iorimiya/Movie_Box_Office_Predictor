url: https://www.ptt.cc/bbs/movie/M.1758382593.A.6A3.html
title: '[負雷]《詭鄉》，不行的劇本與不行的演員。'
content: '部落格版：


  本週有兩部台灣電影上映，一是由金鐘視后林依晨與曾獲金馬獎提名的吳可熙主演的《失

  明》，二是新生代演員初孟軒與雷嘉汭繼影集《八尺門的辯護人》後再度合作的《詭鄉》

  ，兩部電影類型與風格南轅北轍，大概唯一的共同點就是都滿難看的。先把《失明》放在

  旁邊不談，本來以爲年中看的《山忌 黃衣小飛俠》已經先預訂今年最糟糕的台灣恐怖電

  影，沒想到《詭鄉》半路殺出直接強勢登上寶座，絲毫不輸前幾年的冠軍、如《杏林醫院

  》、《靈語》或者《民雄鬼屋》、《鬼天廈》。《詭鄉》存在非常多的問題，重要的劇本

  與演員基本上只能用尷尬兩個字來形容，不過最大問題還是這部電影「完全不知道想表達

  什麼」，導演馬新語先前受訪時說「《詭鄉》既是一部鬼故事，也講述對於未知故鄉的探

  尋，和家族連繫及歸屬感的渴望。」，但顯然執行力跟不上想法，最終結果就是讓人對電

  影感到不知所云。


  我個人是滿喜歡的《詭鄉》的開頭，不論是那幾句近似催眠指令的「下沉」，或者是主角

  李昂回到故鄉棲海的老家，從鐵捲門洞口與奶奶對視，到他對半年前明明收到病危通知怎

  麼眼前奶奶目視身體健朗感到疑惑，而奶奶僅僅回應「有菩薩保佑」這裡為止。若再加上

  起初不知道是什麼關係的「樓上房客」小文，會讓我對《詭鄉》的走向與發展有所期待，

  會想電影是否會像《逃出絕命鎮》或《毒鑰》那樣藉由催眠、巫術替換靈魂來藉此續命？

  但出乎意料的是，就沒有了。導演馬新語相當刻意的想去營造某種氛圍，深怕觀眾感受不

  到棲海鎮不對勁、感受不到小文不對勁、感受不到奶奶不對勁的那樣用力，《詭鄉》沒有

  恐怖電影常見的醞釀與故佈疑陣，而是選擇直接把「問題」與「答案」貼在觀眾看得到的

  任何地方，從頭到尾都不給觀眾對電影劇情的想像空間，讓《詭鄉》成為一部毫無樂趣可

  言的作品。



  先來談論演員與其角色。直到電影看完，我都在想到底是導演馬新語不會導戲導致浪費好

  演員，還是演員本身就有著演技不好的問題？最後我的結論是兩者都有。兩位主角雷嘉汭

  與初孟軒表現實在讓人失望，尤其是前者我認為可以說是繳出她生涯最差的表演，超越在

  《化劫》中我給她的評價，實在很難想像與《八尺門辯護人》演活印尼籍看護莉娜的演員

  是同一個。從之前到現在毫無進步的口條，有氣無力的說話方式，沒什麼變化的表情，綜

  合起來就是讓人出戲。看著雷嘉汭就讓我想到前面提到的林依晨，兩人剛好是極端的對比

  ，前者總把角色詮釋的氣若游絲，後者習慣用力把每句台詞說的字正腔圓，若說林依晨是

  參加朗讀比賽，那雷嘉汭就是讀稿機器。而詭異的是，她們明明都在電視劇與影集裡很可

  以，可電影裡的她們怎麼看怎麼慘不忍睹。


  至於男主角初孟軒，他其實也就比雷嘉汭好一點而已。除了同樣口條方面很有問題，連能

  夠表現演技的哭戲都像是用眼藥水或是藥用眼淚膏輔助，更別說他根本演不出來被嚇到的

  感覺，那幾場噩夢驚醒硬是被他演成「上班睡過頭，阿怎麼鬧鐘沒響？」，在其他時候也

  給不出角色應該正常給出的情緒反應，十足憋腳的話劇社演戲，和雷嘉汭根本是在比誰能

  讓觀眾出戲最多次或者最久，然後導演馬新語居然對於這樣的演技沒有任何意見？從美國

  歸國的設定也是多餘，實在不知道意義何在？而其他戲份較多的就是王滿嬌與張翰，這兩

  位就屬於比較被浪費的演員。演技派卻沒有得到能夠發揮的角色，王滿嬌飾演的奶奶與張

  翰飾演的父親，從頭到尾都是出來裝神弄鬼，然後說個「爸爸媽媽的事不是你的錯，你一

  直都很努力」、「沒時間了，祂要來了我沒時間救你了」等沒頭沒尾的台詞就沒了。



  《詭鄉》劇本方面我不想多講，就是一團糟。從主線劇情到角色關係都沒有處理好，充滿

  著各種讓人迷惑的發展。即便電影沒有給出很明確的轉折，就只是導演馬新語想幹嘛就幹

  嘛，想要李昂去調查父親23年前回到台灣發生的事，好順理成章的將一切問題根源導向於

  父親、家庭的不圓滿，我也就只能接受，只能告訴自己或許真的其來有自。從中段得知李

  昂正接受焦慮症治療，到曾學過催眠的小文不斷告訴李昂要他追溯問題源頭，就可以預想

  電影似乎想走一個放下自己、原諒自己的路線。但直到近尾聲，聽到父親安慰李昂很努力

  的這段話為止，我都不知道李昂到底努力了什麼？甚至最後當當年被他父親辜負而自殺成

  爲厲鬼的小文要他一命還一命時，他也是與小文隔著一扇門板，講些甜膩的動人告白，用

  愛情的力量來讓事情圓滿，結果前面在瞎忙什麼？原來《歸鄉》不是恐怖電影而是一部關

  於女鬼生前跟父親談戀愛死後跟兒子談戀愛的愛情電影。


  我喜歡電影給出反轉，特別是恐怖電影這種多為同樣套路的電影類型，可《詭鄉》卻是糟

  糕電影會用的最糟糕收法，也就是在電影走投無路的時候，最後告訴觀眾原來主角經歷的

  不過是一場夢境。即使《詭鄉》不是夢境，而是催眠治療也是差不多。觀眾都知道李昂正

  在進行治療，可真是沒料到導演馬新語是要觀眾「看」李昂正在進行治療的「過程」，最

  後當他催眠結束清醒，告訴醫師那句他「看到的事情真的發生過嗎？小文真的存在嗎？」

  ，而醫師回應他曖昧不明的回答，直接等於搧了願意進場觀賞這部電影的觀眾兩個耳光，

  嘲笑他們為什麼要花這幾百塊進來折磨自己？


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --

  不要為難我'
