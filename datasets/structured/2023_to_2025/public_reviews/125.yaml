title: '[負雷] 詭鄉 你做得很好……嗎'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  還沒正式上映前就先看到了幾篇負評，不得了，劣食家的血液已在蠢蠢欲動，

  果然沒讓我失望，是一場心滿意足的劣食體驗，吃得很飽，謝謝導演。





  先講一下前半段的劇情：

  男主角從小在美國生長，

  他的父親從來沒跟男主角講過自己臺灣的事情，還說奶奶早就去世了，

  23年前他最後一次回臺灣後性情大變，

  與男主角父子關係不良︰

  幾個月前男主角的父親過世，

  男主角還收到了來自臺灣的、關於奶奶的病情告知，

  他這才知道原來奶奶還活著，

  趁著自己工作不順利返臺取材之際，他回到了父親的老家，

  遇到了奶奶，以及住家三樓的另外一位租客（即女主角）。




  一開頭光聽到計程車司機跟男主角的對話就覺得生硬的不得了，

  「你的氣質不像棲海人」這類的對白本身已經很脫離臺灣計程車司機普遍的草根形象了，

  我遇到的司機三不五時就在對我做身家調查，

  怎麼你的司機聽到你從美國回來又從事媒體產業可以不對著你追問！！！

  不過對話本身還能說是個人經驗不同（i.e. 純粹我個人毛太多），

  演技則毫無疑問地是男主角和司機二人雙雙被棒讀邪靈附身，

  如果觀眾有一開始就成功地感受到驚悚片的壓抑感，

  那大概是被劇本跟演員給嚇出來的。


  後面男主角見到這輩子從沒相遇的阿媽，相逢的過程也是相當順利絲毫不激動，

  祖孫二人直接一人臺語、一人華語毫無障礙的溝通，

  兩人生疏的對話不僅是感情上的生疏，更像是某種劇情交代式的一問一答，

  全程零客套，一切都是為了劇情推動，不加入一絲絲的感情，

  感受大概是這樣的：


  「阿媽你多重器官衰竭欸。」

  「沒有啦我好好的啦。」

  （對話結束）


  「阿媽，爸爸最後一次回來發生了什麼事？」

  「你問這個要幹嘛？」

  （對話結束）


  （※消毒一下，對話不只這樣，但體感就是……不怎麼真實，沒有能帶入日常的可能性）


  可能因為我前一天看的是影史經典《一一》，裏面是大量生活化的臺詞，整段求個真實，

  連演員唸詞稍微卡住都予以保留，對話也是最貼近生活的體驗，

  所以有比較就有傷害，看《詭鄉》全程都是脫離現實的狀態。



  而主角設定是出生於美國，基本上可以視為在美國生長的臺裔二代，

  導演採訪是說他想要營造一個異鄉人探索的疏離感，

  問題是這個設定沒加到分，

  反而讓我一直很在意所有在美國的男主角相關人士都幾乎全程說華語的事實，

  從小跟爸媽講華語，結果回臺灣還能直接聽懂阿媽的臺語，

  雖然這樣講很像是我在雞蛋裏挑骨頭，但就是不能理解選擇美國出生的必要性，

  基本上改成臺北都市小孩到海線鄉下阿媽家的體感也不會差太多，

  甚至可以說相對合理……


  替自己澄清一下，像是王家衛的電影也是各人說各語，

  說華語的人可以跟說粵語的人無痛溝通，

  但對於藝術片的選擇我比較能寬容（甚至還有人寫過論文討論王家衛電影的失語現象），

  不過《詭鄉》裏面的呈現卻是失去人情，相當僵硬，相當出戲。


  關於劇本、語言的部分先到這邊，因為還有好多東西可寫：)



  其他影評也有提到，女主角出來之後周身散發出一種「我一定有問題」的氛圍，

  我不知道演員本身是怎麼認知並消化這個劇本來演繹的，

  但整個演出的方式就是偏矯情，看起來很表面很粗糙，詮釋上很暴力，

  不過男主角鬼遮眼的接受了……接受了……接受了……


  而面對時不時的噩夢襲來，男主角完全沒有演出害怕的樣子，

  入夢、異常畫面、嚇醒、全部都在可預測的節奏下展開，

  看到這麼多怪事，卻沒有表現出內心恐懼的張力，劇情跟角色都毫無亮點，

  因為我沒有看過男女主角的其他戲，不知道他們平常的演技如何，

  不過如果單看男主角吞焦慮症藥物的畫面，感覺他是可以發揮得更好的，

  要嘛是他不適合恐怖片的調性，

  要嘛是劇本、臺詞讓他們無法入戲發揮。


  少數沒有被棒讀邪靈附體的阿媽，卻完全被剪接阻止了演技輸出，

  像是阿媽得知自己幾十年不見的兒子（即男主角的爸爸）死訊時，

  鏡頭卻很粗魯的跳接到男主角爸爸的遺照，

  再轉回來阿媽的時候，情緒被中斷了，從中間切過來，觀眾無法進入敘事畫面的狀態，

  這種很細碎的切換在這部電影中很頻繁，

  雖然有些時候是有目的性的做 counterpart 的比較和提示、暗示，

  但多數時間卻沒辦法給觀眾一段完整的感受。



  well 有啦，棒讀地獄的部分都很完整，演技跟臺詞都尬出了新高度，

  我倒是希望這部分剪一剪。


  像是男主角問大家是否認識自己的父親，

  所有人的演法都是不約而同的秒回「不知道、不清楚」然後離開，

  真的，就算這個人是什麼 Voldemort 這種不能說的名字，

  難道不能有任何人給個不一樣一點的反應嗎！



  前面說劇情毫無亮點，畫面倒是很亮。


  晚上的怪事發生一下，白天男主角還是繼續做父親家鄉的靈異事件田野調查，

  以及跟女主角談戀愛。


  男主角很輕易地接受房客女主角替自己奶奶催眠的事，

  也很輕易地接受女主角丟掉他的焦慮症藥物叫他換吃軟糖的事。

  前面男主角還因為自己對家庭關係的不安所以不敢面對懷孕流產的美國前女友，

  後面就開始跟女主角談起戀愛，並且談到終身大事要把對方帶到美國，


  嗯你們開心就好：)



  這種感覺就像是……

  或許因為臺灣的鬼片、小品愛情片跟描述家庭關係的親情片都相對吃得開，

  小孩子才做決定，問就是導演全都要，最後縫出了一個多面不討好、定位不明確的作品。



  故事中後段出現了一位法師告知了男主角一切事情的真相（雖然觀眾大概也猜到了），

  反正就是男主角的爸爸劈腿在美國跟臺灣都組了家庭，

  在臺灣的伴侶就是女主角本人，但她不知道其實男主角的爸爸早已結婚生子，

  最後懷孕的她選擇放火自殺，怨念卻持續在人間迴繞，並要抓交替。


  其實故事有些暗示的應用我是喜歡的，

  像是奶奶曾經一氧化碳中毒（因為女主角在那個家自殺）、

  像是女主角表示過自己的海鮮麵是跟前男友學的，而男主角說自己的爸爸很會煮海鮮湯。



  然而我對故事的恐怖元素抱有的最後一點期待在尾聲徹底瓦解。


  當男主角知道真相重返那間房子之後，女主角化成厲鬼狀態登場，

  但最後畫面實在太亮了，畫面就變得一點都不可怕，反而有點滑稽。


  我原本以為我會看到的是男主角發現真相滿懷恐懼往外逃，

  女主角無視空間條件直接往外穿牆緊追在後，

  結果，女主角她，被關在房間裏面了。


  兩個人直接開始房內房外隔著門的告白大戲。


  搞半天是愛情片？？？！！！


  超。解。


  要什麼沒什麼。


  23 年前的女主角：變成厲鬼，害得去辦事的法師師弟發瘋

  23 年後的女主角：被前男友的兒子告白之後就輕易被感化


  來臺灣前的男主角：不要孩子，叫前女友去醫院拿掉

  來臺灣後的男主角：不願意把女主角留在這邊，願意一命換一命讓女主角抓交替



  好啦是真愛啦。



  殊不知以為最後採愛情片結尾已經是本片最下限的我還沒料到後面的展開。


  男主角醒來之後發現自己在醫院，然後又再醒來了一次！

  他是在被催眠啊啊啊啊啊啊，

  在臺灣大道四段的某個七樓診所接受催眠啊！


  我突然完全懂了為什麼十幾年前

  魯蛋玩了沉默的小鎮2結局之後會這麼生氣地大喊看醫生遊戲了！！！！



  RRRRRR 看醫生電影 RRRRRR



  先不說主角經歷種種到底是夢境還是真實經歷，

  （根據導演採訪，男主角最後有展示了女主角的拍立得照片應該是提示）

  他那個醫生給的結論真的好想揍他欸……


  「醫生，我催眠經歷的一切是真的還假的呢？」


  「如果是真的，你覺得小文會希望你怎麼做？」



  我是不知道女主角希望男主角怎麼做，

  但我會希望其他觀眾跟我一樣買票進戲院看這部戲，

  這麼優質的電影真的不能只有我看到。


  --

  曾經發生的事不可能忘記，只是暫時想不起來而已。——《神隱少女》


  --'
