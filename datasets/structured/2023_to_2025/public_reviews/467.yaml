title: '[好無雷] 【不丹是幸福】沒有比較沒有傷害'
content: '‧


  不丹人民真的幸福嗎？也許身處在台灣的我們，對於訪問不丹地區的人民基本生活，常常

  三缺五不全的狀態下，如此貧困的生活，對我們而言可能不叫幸福，而這樣的情況下，為

  何不丹的官方人民幸福指數可以高達90%以上，甚至逐年提高？


  除了依然採取低開發的政策下，不願屈就的「高價低量」的觀光方針，雖為不丹永續發展

  ，讓經濟與環境保護取得了平衡，但隨著疫情結束後，不丹的旅遊業復甦卻相對遲緩，讓

  不丹人民降低了就業機會，增加了更嚴峻的貧困指數，但不丹人民在世界的眼中，依然是

  最幸福的國家之一；這個幸福指數是搭上假面的幻想？抑或是不丹人民對於幸福有不同的

  解釋？



  ‧


  跟著劇中的主角「安柏」訪察許多人民，我們可以看到大部分不丹人民認同幸福的趨勢，

  那便是「不與他人做比較」，習慣性的活在當下，不常為未來產生擔憂；例如劇情中受訪

  者，只因家中生了一條小牛，可以多生產牛乳，她便覺得幸福了，又或者是只要跟著媽媽

  生活在一起，縱使媽媽對於家庭責任感低，但能好好活著也是一種幸福。


  不丹人民對於幸福的定義多為不相同，也可以看到幸福調查員們，對於各項評分標準，多

  如牛毛的選項，但鮮少看到人民抱怨自己不如誰，或是怨天尤人的抒發情緒；只講求業力

  與功德之間的環環相扣，不丹人民認為，只要秉持消除業力、保持良善、累積功德，此生

  或來世，會轉世為更好的人。



  ‧


  不與他人比較、活在當下、不為未來做過度的擔憂，這樣低慾望與重視心靈層面的不丹，

  活出了與世不同的幸福價值，縱使有些地方還是有其現實面，無論富有的建築師與他的三

  位妻子的貌合神離，或是LGBT在不丹社會中所受到的壓力，即便佛教的教義並不會排斥不

  同性向者；如同「佛說如來興顯經」中提到的「一切群萌類，本自然平等」，但LGBT依舊

  在不丹社會上承受了許多壓力，諸如此類，【不丹是幸福】並非只是部調查人民為何而幸

  福的紀錄電影，更多的是提出在90%幸福之下，依然有許多角落必須去被關心；無論是所

  提到的LGBT議題，或是影片後段的失能家庭問題，都是藏在這個幸福國度中，不能忽視幸

  福中的不幸福。



  ‧


  【不丹是幸福】有著非常緩慢的不丹風格，沒有甚麼高潮迭起，只有看到村落與城市的不

  丹人民各自的快樂與不快樂，相當喜歡劇中LGBT的母子及失能家庭的大女兒故事，令人相

  當動容；不丹是不是真實的幸福，也許我們不得而知，甚至無法以我們的角度來評斷，但

  可以確定的是，能常保知足常樂、不去計較得失，也許對於他們的人生便沒有傷害，而更

  能做個善良的人，累積功德，來世還能在轉身降臨在這片雷龍之國。



  還有許多種族淨化、公民權等議題，推薦進場觀看。


  本片已於3/21全台上映



  ‧




  追蹤茶太郎IG



  --'
