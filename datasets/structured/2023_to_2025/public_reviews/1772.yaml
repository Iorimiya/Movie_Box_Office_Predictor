title: '[好雷] 聖蛛 Holy Spider2023'
content: '雷文防雷資訊頁


  聖蛛

  Holy Spider

  2022丹麥電影




  一名女記者介入調查伊朗聖城馬什哈德的連續殺人案，兇手被稱作蜘蛛殺手，專挑遊蕩街

  頭的性工作者下手，並宣稱是在「清洗罪惡」。隨著受害者不斷增加，政府非但沒有作為

  ，整座城市的氣氛還變得愈發詭譎…





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  因為本片女主獲2022年坎城影展最佳女主，好奇而追看本片。本片出乎我意料之外，以為

  是在找凶手是誰的劇情，但本片在前段就讓觀眾知道凶手是誰。出差探查案件的記者女主

  ，和凶手的戲份相當，看他們二人在聖城馬什哈德的工作及生活，各自的遭遇，及二人如

  何產生交會，二人面臨的生死交關的結局是？


  這片是描寫伊朗某地方人事物的劇情，卻是丹麥電影？很奇特，雖然和導演身世有關。看

  新聞報導，本片無法在伊朗拍攝，而是在約旦拍攝，所以也不能夠在伊朗放映？


  個人滿意度80（滿分100）。好看及細思極恐的收尾畫面。這片拍攝及上映後，受到一些

  壓力及威脅，被一些人認為醜化....

  這片看完，可以猜測或理解到伊朗官員或一些人為何抵制此片。


  以下有劇透。




  1.本片看到女主記者出差外地中，受到宗教及社會文化的壓制及她自身小小的反抗，妓女

  吸毒問題及工作的悲涼，危險卻為了糊口的處境，凶手的殺人動機及私生活的狀態，令人

  感覺悲劇人物，竟然可以害人害己那麼深，卻又自認替天行道，還要兒子傳承？


  2.收尾畫面由凶手的兒子解說的殺人過程，令人難受，沒人教育他殺人不對，讓他持續繼

  承父志，持續父親的悲劇？


  3.這部電影製作精良。 演員們的演出之勇氣，令人驚嘆。 在伊朗境外製作一部有關伊朗

  內部的電影並不容易。 我無法想像男女演員，尤其扮演凶手的男演員，為他們的角色做

  好心理準備，並進入角色是多麼困難，還要面對未來上片後的一些人的威脅？


  4.Zar Amir Ebrahimi扮演女主角Rahimi非常出色，她扮演頑固，大膽且敢於挑戰的記者

  ，她頑強地冒著生命危險去追查兇手。這片角色為她贏得2022年坎城影展最佳女主角。扮

  演凶手Saeed Hanaei的男演員Mehdi Bajestani，角色很殘酷，同時也很慘地執迷不悟，

  枉費家人的關心，他演技精湛。


  5.本片Holy Spider 取材於伊朗聖城-馬什哈德的真實案件，在一年的時間裡，有 16 名

  性工作者被謀殺。 這部電影在另一方面是現實的，因為它揭示了在伊朗猖獗的古老厭女

  症。 一名婦女因未正確佩戴頭巾而被“道德”警察逮捕，最終死在牢房中，造成抗議活

  動席捲全國。 許多伊朗人，包括受害者的親屬，認為死去的婦女因為從事妓女的工作，

  因為毫無價值，是罪有應得，因為她們“不道德”。 女主與這種極端偏見，以及大規模

  殺人的犯人犯，站在對立面。


  6.本片導演 Ali Abbasi 出生於伊朗，現居丹麥。本片女主Ebrahimi ，原來不是擔任本

  片主角的首選。但後來她對他很生氣，而且在憤怒中表現得如此有說服力，以至於他把這

  個角色給了她。 最後一切都很順利。


  PS：


  電影《聖蛛》揭伊朗社會厭女文化　主角勇奪坎城影后被當局痛斥「侮辱祖國」



  保守的伊朗當局痛斥《聖蛛》（Holy Spider）不僅「公然侮辱」伊斯蘭宗教信仰，還侮

  蔑伊朗整個國家。伊朗文化和伊斯蘭指導部長伊斯梅利（Mohammad Mehdi Ismaili）2日

  警告稱，這部電影沒有得到政府的任何拍攝與播映許可，「將嚴懲國內與這部電影有任何

  合作的人。」由於伊朗當局不允許該團隊在國內製作這部電影，因此製作班底從頭到尾都

  在約旦取景拍攝。


  聖蛛

  HolySpider

  丹麥電影


  --'
