title: '[情報] 2023 丹麥奧斯卡代表：《聖蛛》'
content: '丹麥在昨日公布了申報明年奧斯卡「最佳國際影片」的作品，將以《聖蛛》（Holy Spider

  ）作為代表。




  《聖蛛》為伊朗裔男導演 Ali Abbasi 的最新作品，他曾以第二部長片作品《邊境奇譚》

  在坎城造成轟動並拿下「一種注目單元」的首獎。《聖蛛》於今年坎城影展的主競賽單元

  首映，頗受好評的該片最終讓主演的 Zar Amir Ebrahimi 拿下影后殊榮。


  這是導演首部以家鄉伊朗作為故事背景的作品，但由於題材敏感等因素，全片於約旦進行

  拍攝。該片在電影之外的話題不斷，除了女主角 Zar Amir Ebrahimi 過往被伊朗政府汙名

  封殺逼得他出走法國之外，電影在坎城影展得獎後更被伊朗政府當局批評，另還有一部 20

  20 推出的同題材伊朗電影指控抄襲一事。


  「故事講述一名女記者介入調查伊朗聖城馬什哈德的連續殺人案，兇手被稱作蜘蛛殺手，

  專挑遊蕩街頭的性工作者下手，並宣稱是在『清洗罪惡』。隨著受害者不斷增加，政府非

  但沒有作為，整座城市的氣氛還變得愈發詭異…」（取自 捷傑電影）




  這是導演 Ali Abbasi 首次代表丹麥征戰奧斯卡，但並非第一部做為國家代表競逐小金人

  的作品，其 2018 年的《邊境奇譚》曾作為「瑞典」當年的選擇，雖沒有入圍最佳外語片

  ，但獲得「最佳妝髮設計」的提名。導演從伊朗離開後曾於瑞典求學，目前則長居丹麥的

  哥本哈根，並仍持有伊朗護照。《聖蛛》實為丹麥、瑞典、德國與法國四國合拍的電影。


  丹麥近十年在奧斯卡的表現極為出眾，以《醉好的時光》拿下一座小金人之外，另入圍五

  次五強以及一次短名單，而這還不包括國際影片／外語片之外的獎項，如《醉好的時光》

  也提名了最佳導演，今年的《漂浪人生》更創歷史的一口氣入圍最佳紀錄長片與最佳動畫

  長片三下大獎。


  《聖蛛》已由捷傑電影代理，上映日期未定。



  --'
