url: https://www.ptt.cc/bbs/movie/M.1683378189.A.35B.html
title: '[好雷] 聖蛛 - 文化作為一種「倒退」的思維 '
content: '坎城競賽片

  獲坎城女主角獎


  今年三月上院線過



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~









  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  (部落格原文)




  幾乎可以不用懷疑，不需要任何辯解，《聖蛛》中那位專殺毒蟲站壁妓女的連續殺手說是

  替社會「清除垃圾」只是替自己罪行找理由，就算是這理由對應著伊朗基於伊斯蘭宗教律

  法的特殊性，意味著伊斯蘭原教旨主義，封閉民情禁慾氛圍，不用該用對立於以美國政治

  為首的自由開放社會，不應該用來抗衡資本主義物慾世界，並作為一種民主與人權倒退的

  「反智」。



  插播一下也可以藉此了解一下伊朗女權的歷史，反而從1925～1941年伊朗老國王雷扎．巴

  勒維（Reza Pahlavi）西化開放，到1979年伊斯蘭革命成功，開始實行嚴厲的伊斯蘭教法

  ，更加封閉的過程（註1）。



  據說是因為當時巴勒維與美國人靠太近，過於洋化導致伊朗民族主義的反彈，不太確定當

  地的民族氛圍。只是在想這樣的歷程跟大多數國家，本來是集權保守，然後革命成功走向

  民主都不太一樣，我也不確定到底所謂的民主也不該是一昧地朝向西方的「典範」，應該

  也能保留民族自身的民族特性吧？



  看了韓國片《窒息暴戾》(Breathless)裡面的主角飾演討債集團流氓，片頭一開始 就收

  了錢去把學生運動抗議校方的攤會砸爛，還把學生暴打一頓。猜想是導演故意安排學生的

  單純與世故的流氓，直接秀給觀眾一個殘酷卑鄙的現實世界（I like it）。相對於近期

  看了《人選之人-造浪者》對台灣民主化，多元族群包容過程的以小清新、小確幸感包裝

  的理想泡泡氛圍（註2）。



  資本主義與自由市場無疑以各種賣場、現代主義式建築抹除了特殊的地區景觀。但在濫殺

  無辜的道德正確上，我們不能同意那樣人權倒退，甚至講嚴重一點，如果在「觀念上」有

  一絲絲允許納粹對猶太人屠殺的行徑，都像是一種冒犯。



  面對民族文化的特殊性，與抱持道德潔癖的觀點，這兩者有甚麼關聯性？該怎麼理解電影

  本身：《聖蛛》呈現了連續殺人的「獨特感」，甚至是伊斯蘭氛圍與 懸疑/驚悚的謀殺電

  影混血特殊風景？



  如果不抱持著對伊朗的伊斯蘭原教旨主義某種對立面（不至於譴責），但至少是負面的態

  度地看。並且只能用如果發生在台灣會很慘，類似白色恐怖，隨便把人抓走那樣的情境去

  想像，絕對不能發生這樣事情的道德標準。



  但作為現實發生的實實在在旁觀者，也無法「真切」感受伊朗的民情。相對於台灣目前的

  人權自由跟喝水一樣自然，對於民主的進步只能做的更多而不是倒退（或同時如《人選之

  人-造浪者》般不斷複誦著），我們無法理解《聖蛛》背後這樣的「文化」，就算被視為

  一種「倒退」思維。



  這另人想到電影《出走巴黎》（Synonymes）：帶著「生來叛逆」的性格去質疑西方世界

  的自由（主義）（註3）；甚至在《聖蛛》更加激烈，以宗教為上，堅守著過去傳統，自

  不自由早已無所謂。




  （註1）資料來源



  （註2）

  本來對《聖蛛》已經沒有太多可以說，但最近看了這兩個作品，又把存放倉庫的文章可以

  延續下去了一番。


  （註3）見小弟舊文末段





  --


  拉特飯 - 以商業力量進入獨立市場

  (剛搬家內裝待修)


  --'
