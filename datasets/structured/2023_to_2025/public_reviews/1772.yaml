title: '[好雷] 蛛網之下，避無可避：《聖蛛》'
content: "本文涉及劇情，且具個人觀點，推薦觀影後再讀。\n\n　　　　本片已上映第二週，有意者請把握本週時間。\n\n\n\n　　　　圖文網頁版：\n\n\
  　　　　\n\n\n　　　　預告片：\n\n　　　　\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n蛛網之下，避無可避：《聖蛛》\n\n\n\n　　電影《聖蛛》是以真人真事改編的伊朗連續殺人犯故事。導演阿里．阿\n\n巴西先展現一名性工作者的生活：換上罩袍與女兒吻別後夜半離家，到店裡\n\
  \n的廁所化妝，再於街上接客。第一位男客喜歡使用言語暴力，並且完事後很\n\n快把她趕出房間；她向販賣大麻的沙里太太賒帳，才能接第二位男客在她口\n\n交時拚命壓她的頭躲避警察查緝，再以此為由少給錢；第三名男客則是這部\n\
  \n電影的男主角，他用機車載她到僻處，用頭巾親手絞殺，棄屍後騎回城市，\n\n以「伊瑪目禮薩聖陵」為中心的聖城馬什哈德，光彩耀目，如同蛛網。\n\n\n\n　　是的，男主角就是連續殺人犯薩伊（邁赫迪巴赫斯塔尼飾），女主角則\n\
  \n是從國外來到馬什哈德的記者拉希米（查赫拉阿米爾易卜拉希米飾），因為\n\n薩伊在半年內用同樣手法殺了九名性工作者，作案時間、對象、棄屍地點均\n\n固定，警方卻仍一無所獲。\n\
  \n\n\n　　電影雙線並行，並不刻意故弄玄虛。拉希米的追查艱辛，光是性別和沒\n\n被罩袍蓋滿的頭髮，住房check in就被為難；來到此處乃因遭總編性騷擾而\n\
  \n失業，查案時也險被侵犯。她夜裡在廣場勘查，四處訪問，不惜以身犯險，\n\n若非兇手在殺害第１６位被害人時右手受傷，她也會成為他的掌下亡魂。兇\n\n手薩伊的生活與動機亦同時呈現：退伍的他無能成為烈士，回到社會不甘只\n\
  \n是一名建築工人，甚至不願常見岳父岳母，戰爭給他的過高自尊與現實的落\n\n差使他稍被挑戰就暴怒失去理性。他無法也不會恨國家帶來的傷害，於是藉\n\n由宗教寄託，虔誠謹守伊斯蘭教義的他，能發動的聖戰就是殺死廣場上拉客\n\
  \n的性工作者，認為這是一種「清掃」。他會在事後打電話給記者明示棄屍地\n\n點並回去查看，會去找報紙有沒有自己作案的新聞，還會在眾人惶惶不安時\n\n透露「他只會加害墮落女人」試圖讓他們安心。\n\
  \n\n\n　　薩伊犯案未必嚴謹，而是得到警方與政府的放任。事實上他所謂的「聖\n\n戰」不過因生活不如意帶來的恐懼，試圖恢復過去在戰爭殺戮的榮光，他害\n\n\
  怕被遺忘、輕視，害怕平凡且被埋沒，連兒子一顆誤投的球都能引他的暴怒\n\n和報復，於是殺害社會上最弱勢、最不被關心的女性，就是他重新獲得「英\n\n雄」勳章的方式。同時，這些性工作者為了工作而展現的媚態，既讓他覺得\n\
  \n玷辱了聖城，無疑也勾引他的性慾，他殺害的第１１位被害者索拉遺留咬過\n\n一口、留下唇印的蘋果、因太太法諦瑪臨時回家只能用地毯捲起卻露出的裸\n\n腳，在太太問他「是不是對我厭倦了」時為夫妻間早已乏味的性生活帶來賣\n\
  \n力和刺激；第１６位被害者的大膽挑逗讓他一度必須去浴室冷靜求神寬恕，\n\n對方的反抗讓他弄傷手臂，也讓下一位喬裝為誘餌的拉希米能趁隙逃脫。薩\n\n伊其實知道殺人有罪，他害怕鄰居的眼光──但當事發之後，極度的恐懼使\n\
  \n他徹底逃進宗教聖戰的藉口，說服自己會得到庇佑，無罪釋放。\n\n\n\n　　劇情來到這裡已經成為荒謬、但薩伊支持者（包括他的家人）堅持的一\n\n場爭戰：那些女人墮落、可恥，這場清除是神的旨意，卻從未理解性工作者\n\
  \n的處境：女性未來的選擇極其有限，加上幾乎出身貧窮，只要一次命運撥弄\n\n或錯誤選擇，例如懷孕或家庭遭遇變故，就沒有翻身餘地。曾與拉希米談過\n\n話的索拉，母親邊咒罵她活該邊哭，父親則慨嘆他從小將她捧在手心，卻死\n\
  \n於非命；拉希米是記者，有學歷與能力，但揭發總編私下邀約與性騷擾，就\n\n失去工作；來到伊朗查案，還要為此遭受性羞辱，僅僅是警長以查案為由進\n\n她房間，和請她抽菸等於性邀約，拒絕是你「不識好歹」，若非拉希米絕不\n\
  \n會忍氣吞聲，警長在乎前途，又豈會在乎她的意願？而那些性工作者能賣身\n\n求生，沒有嫖客如何成立？難道那些買春的男人是無償施捨？與前對照更覺\n\n諷刺，亦可見導演安排的用心：所謂的「聖女」與「蕩婦」與行為無關，只\n\
  \n是依父權標準將女性分化為「生殖」與「性愉悅」的功能，只要男性產生慾\n\n望，或者女性失去了自主權（例如貧窮、暴力、權勢），「聖女」就會被貼\n\n上蕩婦的標籤。拉希米的遭遇，和薩伊對性工作者產生慾望而自覺汙穢都源\n\
  \n自於此。而飾演拉希米的伊朗演員查赫拉阿米爾易卜拉希米亦有類似經歷：\n\n２０歲曾是當紅演員的她，因私密影片外流招致性羞辱，只能被迫流亡到國\n\n外１６年後，才因此片在坎城影展勇奪影后。劇裡劇外的厭女思維都證明了\n\
  \n父權對女性的宰制，將性工作者視為墮落不檢點或出自天性，就能無視她們\n\n遭遇的不公與傷害，甚至不用把她們當成是人。\n\n\n\n　　而薩伊被捕之後，為了逃避恐懼，他徹底躲進聖戰的思維，被掀起的輿\n\
  \n論更讓他有了被釋放的信心，連久旱後終於降下的驟雨都被當作是神的旨意，\n\n相信法官及過去同袍哈吉會讓他逃走的哄騙，還在拉希米要求實施鞭刑後和\n\n警官一起作戲，直到絞繩上頸時才察覺不對勁──這次他再也無法逃避對死\n\
  \n亡與罪刑的恐懼，也終於體會那十六位女性的驚怖──他的死刑同時也成為\n\n政府平息輿論、推動選舉的棋子，至於退伍軍人回歸社會的不適應、心理問\n\n題，也都以死刑「噤聲」。\n\
  \n\n\n　　但社會問題並不會因為殺死性工作者與殺人犯而得到解決，暴力只會孳\n\n生更多暴力。片末最令人驚悚的，莫過於拉希米去薩伊家訪問薩伊兒子，並\n\n\
  且拍下他和妹妹分別示範父親如何殺死性工作者，可能繼承父業的興奮與瘋\n\n狂──男性逃避恐懼與脆弱的方式，社會鼓勵的往往就是殺戮、暴力、威脅\n\n與羞辱，與其面對父親是連環殺人犯的事實，相信他在進行聖戰更能自慰他\n\
  \n們搖搖欲墜的男性自尊。然而在失去了父親這個經濟支柱後，說著支持他的\n\n妻子法諦瑪，更現實的體會到他們的生活將陷入困境──如前所言，所謂的\n\n「聖女」與「蕩婦」與行為無關，只是依父權標準將女性分化為「生殖」與\n\
  \n「性愉悅」的功能，只要男性產生慾望卻不可得，或者女性失去了自主權\n\n（例如貧窮、暴力、權勢），「聖女」轉眼就會變成「蕩婦」──薩伊仍年\n\n輕貌美的妻子，兩位年幼過去「捧在手心」的女兒，及將父罪視為聖戰不肯\n\
  \n面對現實的兒子，在鏡頭下的展演，幾乎就是未來的預示。而這也是導演的\n\n用意：他要展現的不是殺人疑案的驚悚，不是正義的伸張，而是伊朗社會的\n\n真貌，在國家、宗教、父權的共犯結構底下，蜘蛛與獵物實則難分，所謂聖\n\
  \n蛛／誅不過是弱勢殘殺弱勢，再被法律制裁以正視聽──\n\n\n\n　　如同電影開頭浮現的字卡，一旦落入蛛網之上，人之遭遇，避無可避。\n\n\n\n\n--\n\
  一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\n                          \
  \        陳斐雯  貓蚤札（其三）\n\n--\n\n　　導演營造得很成功，但沒有過度渲染，所以到結局的時候毛骨悚然。\n\n\n　　謝謝。:)"
