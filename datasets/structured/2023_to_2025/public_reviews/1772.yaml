url: https://www.ptt.cc/bbs/movie/M.1680407254.A.8C8.html
title: '[好雷] 聖蛛'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  近年來，伊朗電影越來越受到國際矚目，題材不外乎法治尺度與女性地位。由法國、德國

  、丹麥與瑞典四國合拍的《聖蛛》也不例外，不過，特別的是，故事是從連續殺人犯的角

  度切入，從不同於以往影視內容的視角，帶領觀眾看見伊朗的底層社會。



  一名記者深入伊朗聖城馬什哈德的黑暗腹地，調查所謂的「蜘蛛殺手」對性工作者的連環

  殺戮，他認為他正在清理街道上的罪人。



  電影最大的反差在於，運用不少鏡頭描繪連環殺手賽義德身為「好爸爸」的形象。他在家

  庭裡風趣、親切又幽默，完全感覺不出一絲暴戾的氣息，唯有某次全家出外野餐，兒子踢

  球砸到賽義德，他突然發狂把妻子與兒子嚇壞。但是，這些溫馨的片段其實也有透露出一

  些蛛絲馬跡，例如：賽義德過去曾是戰爭英雄，如今只是建築工人的他經常覺得不得志，

  自己無法為社會貢獻；自從他開始執行「上帝的使命」後，便經常藉故不陪妻子回娘家。



  殺害阻街女郎的題材，不禁讓人想到去年金馬獎抱回大獎的香港電影《智齒》。雖說《智

  齒》並非改編自真實故事，而且犯案動機來自殺手病態的戀母情結，但同樣呈現底層社會

  的情節，諷刺地說明有些命案發生後，並不會引起警方積極追查。不同於《智齒》以黑白

  方式處理與呈現畫面，《聖蛛》直接將伊朗殘暴的一面塞到觀眾眼前，片中更呈現出作案

  手法的細節，讓電影分級直上限制級。



  其實，起初的劇本非常接近真實故事，僅以呈現「蜘蛛殺手」的動機與作案為主。可是，

  導演後來加入女記者作為主角，從她深入調查此案件的角度著手，帶觀眾從最驚悚的第一

  手視角觀看整起事件。除了提高情節的緊張程度，也再次加深不論是電影本身還是伊朗國

  內的厭女印象，忠實呈現不是只有性工作者會招致批評，在伊朗，擁抱女性言論自由與西

  方文化的女性，同樣會被貼上放蕩的標籤。



  最令人感到毛骨悚然的，還不是拉希米為了查案將自己置於險境，而是手刃十六名手無縛

  雞之力女性的賽義德，居然能夠獲得伊朗廣大社會大眾的支持。這些女性生活在社會底層

  ，為了糊一口飯吃而從事性工作，她們固然犯罪，但動用私刑擅自奪走他人性命，甚至認

  為自己正奉行上帝的旨意在「淨化街道」，才是《聖蛛》這部電影最值得觀眾深思之處。

  這股支持的輿論大到賽義德深以為自己可以凌駕法律之上，在死刑執行之前還與有力人士

  串通，準備好逃亡計畫。幸好最後他仍伏法，就如真實事件裡的賽義德一般，他為自己殺

  人的行為付出代價。



  除此之外，電影最後從女記者拉希米的視角查看賽義德兒子的訪問影片，他滿臉驕傲，彷

  彿將父親視為英雄一樣，並信誓旦旦地表示自己將會繼續父親的「志業」，持續淨化街道

  。這段影片不但明白指出道德觀的錯亂，也彰顯伊朗厭女情節的根深蒂固。當女性做出淫

  穢之事，天理不容，這時候就算殘害生命，也只是在替天行道，反正「妓女的命不是命」

  。這絕對是看完全片後讓人感到最震驚、最沉重之處。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
