content: '當一群業餘罪犯綁架了一名勢力強大的黑幫老大的12歲芭蕾舞者女兒，

  他們只要在一棟與世隔絕的豪宅裡看守這個小女孩一個晚上，

  就能得到五十萬美元的贖金。但是這些綁匪在這棟豪宅中卻一個接一個地突然消失不見，

  後來他們才驚恐地發現，原來他們和一個不是一般小女孩的肉票困在這棟豪宅裡面．．．



