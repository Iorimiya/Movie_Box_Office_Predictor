title: '[LIVE] HBO 22:00 噬血芭蕾'
content: "HBO\n2025-03-07(五) 22:00-23:50\n噬血芭蕾(Abigail)\n\n導演\n麥特·貝提內里-歐平\n泰勒·吉列特\n\
  主演\n梅莉莎·巴雷拉\n丹·史蒂文斯\n凱瑟琳·紐頓\n威廉·卡特利特（William Catlett）\n凱文·杜蘭\n安格斯·克勞德\n艾莉莎·威爾\n\
  吉安卡洛·伊坡托\n\n一群業餘罪犯綁架了一名勢力強大的黑幫老大的12歲芭蕾舞者女兒艾碧嘉，他們只要在一\n棟與世隔絕的豪宅裡看守這個小女孩一個晚上，就能得到五十萬美元的贖金。但是這些綁\n\
  匪在這棟豪宅中卻一個接一個地突然消失不見，後來他們才驚恐地發現，原來他們和一個\n不是一般小女孩的肉票困在這棟豪宅裡面。\n\n--\n   \n\n--"
