url: https://www.ptt.cc/bbs/movie/M.1713510239.A.5AB.html
title: '[好雷] 噬血芭蕾'
content: '無雷推薦的部分，這部是黑色幽默血腥片，邏輯都有，沒有把觀眾當笨蛋看，這類型的片

  光是這樣就覺得至少有70分了，Abigail也好會演，是個才14歲的童星，未來超級不可限

  量，同時這部也是Angus Cloud的遺作，種種原因加上劇情編排優秀，完全是一部值得推

  薦進電影院看的好電影!


  另外非常同意國外一個影評Chris Stuckmann評這部片說，如果Abigail是吸血鬼這件事完

  全不要在預告透漏的話，讓預告片更懸疑一點，去電影院看發現真相的時候絕對會更好看

  ，這點稍嫌有點可惜








  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  有點不懂團隊中那個前警官，為甚麼被咬了之後，人格完全變成殘暴型了阿，這邊有什麼

  合理的解釋嗎，除了這點覺得電影的其他部份都蠻邏輯合理的


  最喜歡的一個笑點是，前警官咬了人後，也想學Abigail控制人，偏偏技術不精，被嗆了

  一波XDD


  題外話

  覺得如果最後Abigail 爸爸走進來，結果是尼可拉斯凱吉，會更有一種惡趣味XD



  --

  沒有看過噬血航班～'
