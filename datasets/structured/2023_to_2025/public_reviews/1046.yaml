title: '[請益] 噬血芭蕾是有要出續集嗎？'
content: '本來是因為版友說抖奶而去看的

  但實際上看完也還好

  乳溝很深，但也沒到很彈


  看完本片的第一個感想是：


  要是上擂台的是這個伊攏罵

  祖克柏大概第一回合就被ko了吧？



  其次是感覺這部片給我的感覺

  有想擴展世界觀的企圖


  龐大的地下帝國

  後面出現的老爸


  其實對於本片呈現出的故事沒有必要

  感覺撲了梗卻草草結束有點浪費

  所以不禁讓我覺得會不會有續集的可能？


  話說吸血鬼長獠牙就算了

  為什麼牙齒也一定要黑黑髒髒的啊？


  -----

  Sent from JPTT on my Asus ASUS_X00TDB.


  --


  我也覺得很奇怪....

  幾百年的吸血鬼，營不了眷屬的眷屬.......'
