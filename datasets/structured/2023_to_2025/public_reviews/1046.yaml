url: https://www.ptt.cc/bbs/movie/M.1704996469.A.C48.html
title: '[情報] 《噬血芭蕾》首支預告'
content: '《》由《驚聲尖叫 5、6》《弒婚遊戲》導演檔  麥特貝提內利奧爾平、泰勒吉

  列特執導，《驚聲尖叫 5、6》編劇 蓋貝賽克也繼續為本片撰寫劇本，本片最初的構想則

  是來自於《嬰魂不散》編劇 史蒂芬雪德斯。


  本片主演卡司：


  丹史蒂文斯、凱瑟琳紐頓、凱文杜蘭、安格斯克勞德、艾莉莎威爾、詹卡洛埃斯波西托、

  以及《驚聲尖叫 5、6》的女主角 梅莉莎芭蕾拉等人。


  北美預定 04 月 19 日上映。


  官方劇情簡介：


  一群業餘罪犯綁架了一名黑幫老大的 12 歲芭蕾舞者女兒，他們只要在一棟與世隔絕的豪

  宅裡看守這個小女孩一個晚上，就能得到五十萬美元的贖金。但這些綁匪在這棟豪宅中卻

  陸續突然失蹤，後來他們才驚覺，原來他們和一個不是一般小女孩的肉票困在了這棟豪宅

  裡面。


  資料來源：


  --

  許慧欣表示：

  對啊'
