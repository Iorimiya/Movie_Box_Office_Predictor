url: https://www.ptt.cc/bbs/movie/M.1713515526.A.238.html
title: '[好雷] 噬血芭蕾'
content: '噬血芭蕾

  大概是近期看過新版鬼玩人後

  最讓我覺得刺激又娛樂性十足的恐怖片了

  看過預告或者劇情簡介海報的

  基本也都知道  一群人綁架小女孩後

  發生的一連串意外

  觀影前我也是知道劇情大概是怎麼發展了



  只是後面還有多次的反轉

  令人驚喜又意外

  整部片緊張刺激無冷場

  該有的血腥畫面都有

  血漿沒有在客氣的  也有不少動作場面

  白爛垃圾話笑料沒少

  小女孩的演技可說是全片的亮點

  查了一下才14歲 就把角色詮釋的很棒

  女主角和Kathryn Newton也超正

  總之娛樂性十足

  個人看完覺得很過癮












  __________雷__________________________




  前段眾人被困住 互相猜疑

  有類似惡靈電梯的感覺

  氣氛營造的很好


  吸血鬼的花招真的很多

  原本以為小小一隻會不會很單調

  各種操控人心 附身 自導自演都來了

  殺人搭配詭異芭蕾舞姿 真的有酷炫到

  後面殺來殺去挺爽的

  吸血鬼掛點爆漿真的有點嗨

  結局收的很好  看完很舒壓~


  --'
