url: https://www.ptt.cc/bbs/movie/M.1713552966.A.AAA.html
title: '[討論]《噬血芭蕾》的劇情背景（有雷）'
content: '裡面提到吸血鬼的部分好像沒有多加著墨角色背景

  只知道是一個很龐大、深不可測的組織勢力

  我原本以為主角他們在遭遇艾碧嘉現形以後

  會隨著古宅的內容裝設和內部的線索

  逐漸的建構爬梳出他們害怕的組織和幕後人物

  結果並沒有，有點浪費那些復古的美術背景

  一開始自己真的會以為其實艾碧嘉

  才是組織裡最老最強的吸血鬼

  幾百年來幕後的主使都是她

  整部片在後半部就開始慢慢的大灑血漿

  我知道這其實算是這兩位導演標誌性的影像風格

  在他們之前的《弒婚遊戲》就是這樣表現

  而且結尾同樣都是倖存的的女主角坐在位子上

  凝視著這一切事情的發生

  導致我看到後來真的覺得

  到最後結局的部分兩部片實在是太像了！

  總之覺得《噬血芭蕾》對於吸血鬼的背景並沒有帶到很多

  不知道到底是為了續集的鋪成

  還是真的就只是沒想那麼多

  最後個人覺得這部片還是稍嫌和可惜的是

  既然炸雞叔最後被揭露也是吸血鬼的時候

  並沒有大戰一場，浪費！

  然後女主角和小女孩聯手對決雞巴警察的時候

  我一直在想為什麼女孩的老爸還沒來

  最後吸血鬼魔王是馬修古德扮演的老爸終於現身

  著實覺得還蠻有壓迫和氣勢的

  尤其是他那一口英倫腔調的口音

  但最後終於出現的時候卻已經打完了？

  兩個真的不打一下嗎

  我在想這部在世界觀上應該是和弒婚遊戲是同一個時空

  如果票房反應好的應該聯動的機會很大吧我想

  我發現發行商是環球，然後劇情又是在講吸血鬼

  有人知道這會是環球的怪物宇宙系列的範圍嗎？



  --'
