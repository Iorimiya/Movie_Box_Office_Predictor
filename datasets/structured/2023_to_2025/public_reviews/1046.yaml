url: https://www.ptt.cc/bbs/movie/M.1713678964.A.387.html
title: '[雷] 噬血芭蕾的女主奶一直晃欸'
content: '之前看到《噬血芭蕾》的預告，好像感覺是低成本血漿片，便抱著殺時間的心態去看，看完

  後感覺撿到寶了



  首先我必須要說，這部電影的女角色都不錯啊！


  其中顏值最高的是吸血鬼小女孩


  一開始還是脆弱小孩的形象覺得普通，等到本性顯現的時候就很有感


  特別是穿著芭蕾舞服、披頭散髮跟一具無頭屍體跳舞的那一段


  美到我的蘿莉控之魂差點覺醒



  幸好女主的好身材都會把我的目光吸引回去XD


  整部電影看下來，女主只要動作大一點奶就會晃一下，次數很多讓我一直保持高度專注


  有一段她低下身子查看同伴，事業線露出來真的哇幹深


  還有一個金髮駭客，是那種8+9妹形象不太喜歡


  但是女主跟大家談心的時候，金髮妹認真的表情才讓我發現這個演員也很正





  再來談談劇情








  這部的劇情不難猜，但是拍的不錯還有多次轉折


  一行人綁架小女孩，結果發現是吸血鬼，頓時從獵人變成獵物，這在我看預告的時候就知道

  了


  一開始只是猜小女孩什麼時候被打倒，會活下幾個了


  沒想到之後眾人的敵我關係反覆橫跳


  一般來說我不喜歡反派洗白雙方和解


  不過故事裡的角色設定上都是幹過不少壞事的人渣


  所以只覺得很有意思


  甚至以為要結束時還能反轉，讓你到最後都保持緊張感




  總的來說，我覺得這部沒什麼大場面成本應該不高，可是反而比很多大片都更值回票價








  --'
