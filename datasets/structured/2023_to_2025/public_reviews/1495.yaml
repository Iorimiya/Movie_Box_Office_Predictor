url: https://www.ptt.cc/bbs/movie/M.1692857811.A.02C.html
title: '[好雷] 或許會有回答：《呼叫愛美子》'
content: "本文涉及劇情，且具個人觀點，推薦觀影後再讀。\n\n\n　　　　本片上映將屆第二週，有意者請把握時間。\n\n\n　　　　圖文網頁版：\n\n\
  　　　　\n\n\n　　　　預告片：\n\n　　　　\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n或許會有回答：《呼叫愛美子》\n\n\n\n　　加拿大作家艾莉絲．孟若有一篇小說〈童戲〉，以女主角瑪琳的第一人\n\n稱敘述兒時參加夏令營時，與另外兩個女孩的回憶：猶如雙胞胎的夏琳，和\n\
  \n曾經是鄰居的薇娜。不過在瑪琳的回憶裡，薇娜是一張她想棄置的標籤，她\n\n的動作、表情都隨標籤詮釋，此外沒有任何話語，事實上，瑪琳也從未與薇\n\n娜有過交談。\n\
  \n\n\n　　看完《呼叫愛美子》之後，我想到薇娜。但在觀影的過程，看著愛美子\n\n用各種可以說是「怪」、而且不算討喜的種種反應，和各種突兀的、過於響\n\n\
  亮的聲音，用自己的方式去關心、去付出、去探索這個世界，然後隨著劇情，\n\n她和外界的出口逐漸拉長、縮窄，一直前進的她同時也在後退，最終幾乎退\n\n進一個屬於她的世界──\n\
  \n\n\n　　那是我們都經歷過，而且仍然存在的世界。\n\n\n\n　　孟若的作品是細膩堆疊，靜靜劃開人性，讀者是刀，同時是被劃開的血\n\n肉；導演森井勇佑則是撕下標籤，展現與孟若不同的溫柔視界，在〈童戲〉\n\
  \n小說裡必須沒有聲音、只有模糊形象的薇娜，在這部電影裡的愛美子讓我們\n\n真實地看見她大聲的說話，積極地表達自己的意見和想法，當她還小，周遭\n\n的人──包括父親、哥哥、媽媽──還有餘裕的時候，還能慢慢地引導她，\n\
  \n教她這個世界的規則，更重要的是願意陪伴她，或被她陪伴──那是她最幸\n\n福的時光。但隨著母親生下來的孩子夭折後，這個家雖然一度努力打起精神，\n\n但那個細弱的、愛美子來不及看到、也不知道怎麼做能維持的支撐線，終究\n\
  \n在她的善意下繃斷了。當家隨著時光緩緩倒塌，當年和她一起長大的孩子，\n\n都進了中學，和大部分人一樣學習察覺周遭的視線，然後調整自己逐步適應\n\n學校與社會的規則，只有愛美子依然故我，不認得字，不寫功課，光著腳在\n\
  \n走廊踩出響亮的節奏，看著她的家人一點一點的變化：終日躺在床上或背對\n\n著她、不發一語的母親，為照顧母親愈來愈疲憊冷漠的父親，學習抽菸離家\n\n加入幫派的哥哥，以及，再也不肯容忍她的、她最喜歡的小範……\n\
  \n\n\n　　當壓力與不幸來臨，無論大人或小孩，都在學習成長與適應的同時，原\n\n本寬廣細緻、獨一無二的視界，不知不覺隨之緊縮消逝；原本可能坦承的事\n\n\
  實，變成心照不宣才不會讓真相化為傷痛，一旦成形就會無限擴大染汙的祕\n\n密。愛美子沒有祕密，除了沒有人想懂得的，使她成為說不出口的祕密本身；\n\n她周圍的異聲，彷若是她無法讀懂隨著時光愈加密集的線弦，逼近她的世界\n\
  \n經由撥弄變成噪音；她無法用言詞表達出來的感受，化為只有她能看見的幻\n\n影。雖然「知道」窗檯上的聲音可能是夭折的孩子回來，但她還是會怕，然\n\n後用更響亮的歌聲試圖安慰自己，讓聲音與幻影連同恐懼成為最真實的陪伴……\n\
  \n\n\n　　愛美子的孤獨是一種極致的、走不出去、別人也無意進來的孤獨。曾經，\n\n爸媽為她買了好多生日禮物，她先用照相機為家人拍照：保持微笑比ＹＡ的\n\n\
  父親，維持單腳展翼的哥哥，和堅持要整理好頭髮的媽媽，和不及等她「準\n\n備好」、自始至終都沒入鏡的愛美子。和再怎麼表現厭惡，還是只喜歡小範\n\n一樣，愛美子也關注母親的痣，哥哥的禿頭，和父親的近視眼鏡，只是這次\n\
  \n沒有人再耐心地讓她明白：即使有那些「缺陷」，他們還是他們，畢竟愛美\n\n子的「缺陷」太明顯了，而願意看見她的人太少，最後乾脆視而不見，以免\n\n跟著掉進深不見底的孤獨與恐懼。即使她付出的愛成為小範揭曉的祕密後，\n\
  \n變成鮮血淋漓的傷害，或許她仍舊不明白，沒有經由規則呈現、沒有納入對\n\n方足以理解與承受的感情，那無形的傷害不亞於她長久未癒的疼痛──只是\n\n有時，我們要怎麼樣才「足夠」知道？\n\
  \n\n\n　　愛美子不知道的不僅於此。當她即將跟父親搬到奶奶家轉學時，鄰座有\n\n一個同學，總是幫她指出小範寫的字，善意提醒她因為入幫派的哥哥休學，\n\n\
  她要小心接下來會遭受更嚴重的霸凌；這次在愛美子問他：我很噁心嗎？我\n\n想知道我有哪裡噁心。這位同學原本告訴她至少有百個之多，要一個一個寫\n\n下來還是一條一條說給她聽，她說：就用說的吧，他停頓了一會，看著愛美\n\
  \n子，然後道：\n\n\n\n　　「算了，這是我的祕密。」\n\n\n\n　　然後他要愛美子不要忘了他。\n\n\n\n　　或許是我的誤解，但這是我想要記住的、溫柔的、發自內心的告白──\n\
  \n即使一心執著小範的愛美子，可能一生都不會理解。\n\n\n\n　　無論如何孤獨，愛是屬於愛美子自己的，生命也是。當父親告訴愛美子，\n\n她之後要跟奶奶住，而他要離開的第二天凌晨，被所有家人捨棄的愛美子從\n\
  \n奶奶家門口的框來來回回跳，然後慢慢跳離那個框，慢慢地來到海邊。那裡\n\n有好幾艘船，船上有曾經陪伴過她的亡魂，以及死神。\n\n\n\n　　祂們向她招手。\n\
  \n\n\n　　小小的、身體有一半被海浪浸濕的愛美子，舉起了手向祂們揮手。\n\n\n\n　　祂們也揮手，然後船慢慢離開。\n\n\n\n　　有大人來到海邊，看見持續不動的愛美子，告訴她這個季節的海水仍\n\
  \n然很冷，快點離開，她回頭大喊著說：\n\n\n\n　　「我沒事的！」\n\n\n\n　　我沒事的，沒事的。\n\n\n\n　　即使那麼怪，無法進入這個世界的線弦，無法辨識進來的噪音；即使拿\n\
  \n著對講機，不停喊著：「こちらあみ子、応答せよ応答せよ」，就像那顆拋\n\n上去後就沒有再落下的橘子般，只有自己的聲音，\n\n\n\n　　可是會沒事的。\n\
  \n\n\n　　無論沒有，或者有什麼願意、或者以什麼樣的方式回應，愛美子一定都\n\n可以、自己各式各樣的方式繼續前進。\n\n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n\
  我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\n                                  陳斐雯  貓蚤札（其三）\n\
  \n--"
