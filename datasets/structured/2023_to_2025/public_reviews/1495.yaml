url: https://www.ptt.cc/bbs/movie/M.1711100365.A.198.html
title: '[情報] 綾瀨遙主演《呼叫愛美子》導演新片《ルート29》情報公開！'
content: '根據日媒的報導，《左輪百合》日本影后「綾瀬はるか」主演《呼叫愛美子》新銳導演「

  森井勇佑」的新片《ルート29》（國道29號）首度公開了消息！




  森井勇佑在 2022 年推出首部長片《呼叫愛美子》後廣受好評，不只入選「電影旬報」等

  各大獎項的年度十大佳片，更被日本電影製片協會所創設的「新藤兼人獎」選為最想合作

  的新導演第一名，獲得了「金獎」，如今很快的將在兩年後推出新片《ルート29》。


  《ルート29》為導演森井勇佑原創的電影劇本，但受到了日本作家「中尾太一」筆下的詩

  集《ルート29、解放》的影響。是一部以日本中從兵庫姬路連通到鳥取的這條國道 29 號

  為故事背景的公路電影。




  劇情描寫女主角「蜻蜓（本名：のり子）」無法和別人進行必要以外的對話，他和古怪的

  少女「ハル」一起在國道 29 號踏上了旅程，在路上遇見了各式奇妙的人，並且逐漸加深

  了彼此的羈絆。而蜻蜓曾經空蕩的心也因而被喜悅與悲傷的心情充斥著。


  在去年連續演出《左輪百合》和《THE LEGEND & BUTTERFLY》兩部史詩大片的綾瀬はるか

  這次回歸獨立製作，在《ルート29》將飾演女主角「蜻蜓（のり子）」；而片中的怪女孩

  「ハル」導演則再度找來了他在《呼叫愛美子》發掘的天才少女「大沢一菜」演出。


  《ルート29》預計秋季於日本正式上映。



  --'
