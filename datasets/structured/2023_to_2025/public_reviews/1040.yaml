url: https://www.ptt.cc/bbs/movie/M.1744713080.A.A70.html
title: '[好雷] 特技玩家'
content: '最近發現這部上HBO Max

  看完之後有點後悔沒有進電影院看

  如果看IMAX或是4DX版本應該會很刺激


  電影圍繞在特技演員的辛酸血淚上

  男女主角之間的火花也是看的心癢癢

  其中一段戲是女主角以講解劇情為名

  實際上卻是女主角當眾暗諷男主角

  話裡話外都在嘲諷兩人過去的感情糾葛


  甚至多次讓男主角著火的過分要求

  理所當然的公報私仇XD

  特別喜歡導演在切割畫面的設計巧思

  利用一來一回的對白揭露雙方的視角和觀點的對立


  動作片段看也是很過癮

  尤其是在那台大卡車上與反派扭打的片段

  還有最後用最極端的方式逼迫兇手說出實話

  各種爆破場景、飛車特技、甚至從直升機墜落的畫面都看的直流手汗


  總之，劇情蠻精彩、刺激的，是一部看完心情會蠻好的電影


  --'
