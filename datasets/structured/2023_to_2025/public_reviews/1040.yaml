title: '[普好雷] 特技玩家'
content: 'The Fall Guy


  我覺得挺好看的，但缺點也很明顯。聽說導演以前是布萊德彼特的替身，所以也理解他

  為什麼想把特技演員拍得超厲害。


  (有雷)



  優點:

  1.動作戲很棒

  2. Ryan Gosling演過Ken之後，看他演這種很耍帥的角色都很好笑。

  3.從子彈列車就很喜歡導演的趣味，喜歡TS的歌，喜歡用迷幻藥或是加入狗狗把動作戲拍

  得特別，獨角獸超好笑。

  4.偽沙丘也是超好笑。

  5.看之前的預告以為大明星真的死了，所以之後還有戲份很驚喜(P.S 其實我主要是為了

  看ATJ，聲音軟軟的很可愛)

  6.ATJ演的角色死亡再+1

  7.最後換角的客串也很驚喜，原來之前的便條紙是這個意思。



  缺點:

  1.有女主角的部分節奏很拖

  也許不該找大咖的Emily Blunt當主角，劇情上她的角色不重要，大半劇情是被蒙在鼓裡

  。大概是簽了合約要給足夠的露臉時間，她的部分都超級拖，分割屏幕那段一分鐘內很好

  笑，但再慢慢拍就很難笑了。特別是男主在生死搏鬥，來回切去女主角那邊，很煩躁。

  2.劇情和反派都很蠢，大明星找男主當替死鬼的原因莫名其妙，你們有這麼深仇大恨嗎。

  明明有保鏢兼可以隨便在鬧市抓人，直接處理屍體也沒很難吧。



  --'
