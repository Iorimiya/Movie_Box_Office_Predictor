url: https://www.ptt.cc/bbs/movie/M.1699026685.A.364.html
title: '[新聞] 芭比男神轉動作小生？萊恩葛斯林特技玩家'
content: '新聞網址：


  「芭比」男神轉動作小生？ 萊恩葛斯林「特技玩家」搏命


  2023-11-03 21:09 聯合報記者 蘇詠智 即時報導


  今年夏天以賣座大片「Barbie芭比」搞笑演出一新觀眾耳目的文藝男神萊恩葛斯林，其實

  在去年的Netflix自製大片「灰影人」中嘗試過動作打鬥的表演，而他在明春要上映的「

  特技玩家」中再度繼續動作演出，化身為專業的特技演員，被捲入當紅男星失蹤的風波中

  。


  萊恩葛斯林在「特技玩家」飾演的特技演員，平日為了銀幕上的刺激場面而出生入死，發

  現新片導演竟是他想挽回的前女友，拚命在拍攝期間要讓她對自己刮目相看，不料男星的

  失蹤，背後竟牽扯上犯罪事件，他也被迫真的面臨危險。「奧本海默」氣質女神艾蜜莉布

  朗飾演萊恩葛斯林的舊情人，「子彈列車」英俊小生艾倫泰勒強森飾演失蹤的電影紅星，

  3大「神」級演員的對手戲，成為動作場面之外的吸睛焦點。


  「特技玩家」的導演正是「死侍2」與「子彈列車」的大衛雷奇，他將在片中使出什麼新

  招？影迷都拭目以待，而萊恩、艾蜜莉與艾倫這樣的黃金陣容，為片子更增看頭，被預期

  將是明年春天最受矚目的強片之一。


  --'
