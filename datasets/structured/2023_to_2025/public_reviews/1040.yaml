title: '[情報] 《特技玩家》The fall guy 全新預告'
content: '最新預告：




  之前的官方預告：




  《》由《死侍 2》《子彈列車》導演 大衛雷奇執導，並與他的製片妻子凱莉麥

  寇米克共同監製，曾為雷奇執導的《玩命關頭：特別行動》撰寫劇本的德魯皮爾斯，則擔

  綱本片編劇。


  北美預定 05 月 03 日上映，台灣則於 05 月 01 日搶先登場。


  《》主演卡司囊括：


  剛與雷奇拍完《子彈列車》的，以及身兼監製的、、

  許瑋倫、溫斯頓杜克、泰瑞莎帕瑪、漢娜衛丁漢、李梅傑斯等人。


  《》翻拍自八零年代同名影集《The Fall Guy》，敘述葛斯林飾演的特技替身寇

  特，被導演前女友喬蒂求助，協助找回她不見人影的新片主角湯姆萊德。


  湯姆是個被過度縱容、脾氣暴躁的大明星，但某天卻不知為何消失無蹤。寇特擔任過湯姆

  的替身，很了解他的個性，因此被喬蒂的製片人請求幫忙找出湯姆的下落。


  湯姆正在拍攝喬蒂執導的一部大成本科幻外星戰爭電影，製片人很急著找回湯姆，否則這

  部片就等著開天窗。


  此時的寇特正好手頭吃緊，加上也真心想解救喬蒂當前的困境，於是便答應這份差事。


  --'
