  就是傳統暑假第一檔在做


  結果現在票房輸犯罪都市 總票房非常有可能也輸


  那就是爆了吧QQ


  慘度跟阿蓋爾差不多


  接下來就看美國首周開得如何


  這部確定應該是不會有什麼口碑效應存在了


  --'
