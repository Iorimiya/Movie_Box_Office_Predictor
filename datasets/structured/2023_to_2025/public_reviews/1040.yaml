url: https://www.ptt.cc/bbs/movie/M.1714722839.A.F40.html
title: '[好雷] 特技玩家'
content: '原本因為版上評價導致不期不待.

  沒想到意外好看. 稍微列一些個人還記得的一些點.


  1.愛情橋段佔了蠻大比重. 不是單純動作片

  2.男女主角的螢幕火花很足.

  3.前段節奏比較慢. 越到後來越快. 個人覺得飯店找人前可以再設計個小的動作喬段.

  4.有幾段男女主角對話呼應自身心裡的想法. 拍火燒戲跟分割畫面等.

  5.男主開船時的告白. 把先前無法說出口的情緒一次爆發. 也道出特技人員不為人知的辛

  酸. 搭配夜晚的光影與配樂. 整部我最喜歡這段.

  6.屌暴俠演機歪人真的可以很機歪

  7.最後大戰戲中戲跟特技組全上很精彩.

  8.惡搞沙丘笑死. 水行俠整個發福.

  9.片尾的拍攝片段大加分. 比較意外的是最後墜落直升機是真摔. 因為正片那段是遠景.

  人的畫面其實很小一個.


  再來是個人覺得比較失望的地方.

  來恩的純肉搏戲偏少. 只有夜店那場比較完整.

  其他不是都在逃跑就是交給恩巴庫去打.

  他在灰影人裡也是有打阿.  只有設計一場感覺有點可惜.

  不過整體是有超出個人預期. 看完心情很好. 推薦..


  --'
