title: '[討論] 特技玩家問題（有雷'
content: '主角開遊艇被追殺的那一段

  為何要一直講一些不是重點的話

  為什麼不說兇手及製片的事情？

  這邊看了好躁


  以及男主逃出後喬裝上導演房車

  難道不用先鎖門嗎？

  壞人在外面找人了

  裡面還打成一團

  導演根本就不應該要這麼會打架

  在一個需要安靜的時間點安排打戲

  還很長一段

  也感覺很躁


  跩哥在片場找特技指導黑人

  這段後來完全沒下文？

  都找不到人 那當天的拍攝怎麼辦？

  下一幕拍結局的時候 特技導演突然又可以出來趴趴走不怕跩哥追殺？


  以及為何本片會有這麼多的亞裔出現

  背景工作人員感覺很多都是亞裔選角

  是因為澳洲現在中國人很多的關係嗎？


