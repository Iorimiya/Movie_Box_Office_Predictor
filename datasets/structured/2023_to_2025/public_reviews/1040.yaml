title: '[新聞] 特技玩家搶下2850萬美元 躍上北美票房冠軍'
content: "特技玩家搶下2850萬美元 躍上北美票房冠軍\n\n2024/5/6 16:58\n\n（中央社洛杉磯5日綜合外電報導）北美院線聯盟（Exhibitor\
  \ Relations）今天指出，動\n作片「特技玩家」本週估計將收進2850萬美元，一舉躍上北美票房冠軍。\n\n「特技玩家」（The Fall Guy）是由曾任布萊德彼特（Brad\
  \ Pitt）替身的大衛雷奇（\nDavid Leitch）執導，內容改編自1980年代電視劇，有令人讚嘆的動作場面，由獲奧斯卡\n槳（Oscar）提名的雷恩葛斯林（Ryan\
  \ Gosling）、愛蜜莉布朗（Emily Blunt）擔任主角\n，也為該片拉抬了不少聲勢 。\n\n「星際大戰首部曲：威脅潛伏」（Star Wars: The\
  \ Phantom Menace）本週以810萬美元的\n票房排名第2，該片這樣的成績令人感到驚喜，因為它是將25年前的電影重新發行，且該\n片已能在家觀賞得到，也非「星際大戰」系列中最受歡迎的一部。\n\
  \n上週北美票房冠軍，網球愛情片「挑戰者」（Challengers），本週的票房收入為760萬美\n元，排名滑落到第3。\n\n恐怖片新作「絕命塔羅牌」（Tarot）收入650萬美元，在本週的票房排行榜位居第4。\n\
  \n「哥吉拉與金剛：新帝國」（Godzilla x Kong: The New Empire）以450萬美元在本週排\n名第5。此片在北美累積1.88億美元票房，其他地區則是累積了3.37億美元。\n\
  \n排名第6至第10的作品依序為：「帝國浩劫：美國內戰」（Civil War），360萬美元；「\n無名英雄」（Unsung Hero），300萬美元；「功夫熊貓4」（Kung\
  \ Fu Panda 4），240萬\n美元；「噬血芭蕾」（Abigail），230萬美元；「魔鬼剋星：冰天凍地」（\nGhostbusters: Frozen\
  \ Empire），180萬美元。（譯者：李晉緯/核稿：陳政一）1130506\n\n#北美 #布萊德彼特 #北美票房\n\n--\n\n 是菩薩成佛之道\n\
  \        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
