url: https://www.ptt.cc/bbs/movie/M.1720063834.A.4A6.html
title: 'Re: [普雷]《特技玩家》特技演員打出全武行'
content: '這片很可惜，第一版預告出來真的弄的很好

  把那種無名的小人物英雄風格表現出來

  節奏明快又有趣，很佩服這個預告剪輯者


  那時很期待這片，很欣賞萊恩葛斯林，而艾蜜莉·布朗

  也是表現很好的女角

  作品以特技人員的描寫為主，也是很好的主題

  表現這批如何在電影上面真正的出生入死去達成精彩的

  畫面，讓這批人的辛苦傳達給大眾，是一部對特技人的禮讚


  實際在看卻頗有遺憾，每一段其實都挺好看

  但是最大的問題卻是銜接，每一段銜接鋪陳都很突兀

  沒有達到該有的情感，然後劇情有些做的太刻意

  以下有雷...




  好比男主離開一年後回到片場，馬上去進去幫忙，

  就跟女主在那一邊排戲一邊講一大堆，而且用討論片子裡男女

  主角來暗示彼此情感，用的太直白而粗糙，然後也講太久

  讓人覺得整個片場一大堆人就聽他倆在那哈拉一堆

  hold在那裡顯得很讓人出戲

  汽車廂相遇那段也是 突然就碰到 然後就在汽車廂閒聊

  預告這段出來時會以為前面兩人已經有些鋪陳相處的

  情節，但實際沒有，回來後片子拍戲，兩人就直接那次

  遇到，觀眾對兩人的互動情感都還沒有些認識跟鋪陳起來

  就看兩人在車廂扯一些有的沒的

  找人的過程也是如此 都是片段很零散 又有些莫名其妙

  的角色 分割畫面那段也是 劇情或畫面上沒有那樣的需要

  突然來這個設計 然後也拖有些久在那不知所云

  整個劇情鋪陳沒有連慣性 敘事節奏也沒掌握好


  真的很可惜的一部片

  推薦這個版本預告 音樂也配得很好




  --'
