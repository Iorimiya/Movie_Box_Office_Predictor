title: '[新聞] 《特技玩家》票房平淡乏力 《芙莉歐莎》'
content: '《特技玩家》票房平淡乏力 《芙莉歐莎》可望成為今夏戲院救贖？


  Yahoo奇摩電影戲劇編輯部


  2024年5月17日 週五 下午8:02




  《芙莉歐莎：瘋狂麥斯傳奇篇章》劇照


  1.跑酷、唱悲歌都做了！《特技玩家》票房平淡開場不如預期


  2.北美票房亞軍竟然是重映片！《星際大戰首部曲：威脅潛伏》適逢25周年


  3.今夏戲院救贖？《芙莉歐莎：瘋狂麥斯傳奇篇章》影評狂讚


  【文／太空小姐】


  大衛雷奇（David Leitch）執導，萊恩葛斯林（Ryan Gosling）、艾蜜莉布朗（Emily Bl

  unt）主演的動作喜劇片《》雖在北美上映後奪下首周末票房冠軍，但成績卻是

  遠低於預期的2850萬美金（約新台幣9.2億元），平淡的開場表現讓不少媒體猜測，或許

  《》才是今夏影院的救贖。


  儘管這幾周下來，萊恩葛斯林奮力表演跑酷、與艾蜜莉布朗大唱泰勒絲（Taylor Swift）

  的分手國歌，雙主演更賣力炒作「」後續效應，但《》上映後表現卻是

  欲振乏力。


  根據媒體數據分析公司Comscore提供的數字，《》以2850萬美金取得北美首周末

  票房冠軍，在海外則獲2540萬美金票房，全球首周末總額達到6540萬美金。




  《特技玩家》劇照


  根據《Variety》報導，《》製作成本為1.4億美金，所以北美票房至少需要收穫

  3000至4000萬美金才可能於上映期間內獲利，不過《》已經是所有主

  演電影裡首周末票房成績最好的一部作品了。


  尷尬的是，其實《》並沒有太多競爭對手，緊追在後的亞軍竟是適逢25周年重新

  上映的1999年星戰電影《》。


  該片在北美票房收入為810萬美金，全球票房總收入為1440萬美金。


  星戰本就有一票死忠影迷，加上2022年D+ 推出《》影集，並且《

  》選在非官方星戰日5月4日上映，也為票房推波助瀾。




  《星際大戰首部曲：威脅潛伏》劇照


  至於千黛亞（Zendaya）主演的《挑戰者》則在上映第二周從冠軍跌至第三名，北美票房

  收入700萬美金，全球總票房則是5200萬美金。


  第四名是恐怖片《》，北美成績650萬美金，全球1020萬美金，不過因其為低

  成本800萬美金製作，所以表現已夠亮眼。




  《挑戰者》劇照


  第五名是上映第六周仍在榜上的《》，本周在北美進帳450萬美金

  ，累計達1.88億美金，全球票房則達5.46億美金。




  《芙莉歐莎：瘋狂麥斯傳奇篇章》劇照


  接下來會讓票房大洗牌的，除了也相當受到矚目的《》，還有

  （Anya Taylor-Joy）主演的《》。


  會讓《》脫穎而出，不僅是因為它是《》前傳，而是在坎城首

  映後，社群媒體與業界影評人對此片一致讚譽，未上先紅的現象，已經幫電影鋪好爆紅前

  奏，讓許多人相當看好它將霸佔今夏票房榜單。


  新聞網址：
















  --'
