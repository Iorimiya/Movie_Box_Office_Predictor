content: "有點可惜，如果用較嚴苛的角度來說就是結構鬆散，邏輯不通的大場面 B 級片，\n前半段其實還不錯，但是後半段的收尾就很不知所謂。\n\n有句話說“為了這碟醋，所以包了一盤餃子“，本片就是這樣，為了塞入各處種特技場景還有\n\
  致敬、諷刺橋段，所以拍了一部電影出來。\n不過考慮到本片的主旨就是特技演員，所以這些問題還算能夠接受。\n\n對演員跟特技場景有興趣的人像我，就會覺得還不錯看，但是不要有錯誤的期待，這是一部不能\n\
  要求劇情的特技電影。\n\n如果是非常要求劇情發展和人物行為，要有邏輯要有智商的觀眾可能會看的很痛苦。\n\n\n-----\nSent from JPTT on\
