url: https://www.ptt.cc/bbs/movie/M.1714981087.A.43C.html
title: '[討論] 《特技玩家》首映票房不如預期'
content: '《特技玩家》上周末於北美上映，粗估周末票房收入為2850萬美元，


  低於上映前各方預期最少3000萬起跳的數據。


  該作拍攝成本高達1.3億美元，這個開局讓回本之路走得更加艱辛。



  海外目前收入為3690萬美元，乍看之下好像不差，


  但實際上很多市場在4月24日就上映了，這裡包含了2個周末的票房總合。


  目前尚未上映的大市場，僅剩中國跟日本。


  也就是說，海外票房除非中國上映後爆賣，否則增長幅度有限。



  不過因為觀眾口碑良好(出口民調A-)，該作也許能以此維持良好跌幅。


  目前只能持續觀察後續變化。



  --'
