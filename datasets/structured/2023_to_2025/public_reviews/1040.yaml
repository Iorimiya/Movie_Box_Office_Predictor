  The Fall Guy (1981) 2x01 Bail and Bond


  主角Colt Seavers 是一位好萊塢特技演員，兼任賞金獵人。

  《天龍特攻隊》影集好萊塢特技演員版


  (應該是反過來才對, 這部影集比天龍特攻隊還早XD )


