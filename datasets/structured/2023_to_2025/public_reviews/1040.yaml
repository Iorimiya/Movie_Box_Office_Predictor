url: https://www.ptt.cc/bbs/movie/M.1710517068.A.996.html
title: '[新聞] 萊恩葛斯林《特技玩家》破金氏世界紀錄'
content: "萊恩葛斯林《特技玩家》破金氏世界紀錄\n\n特技演員車內翻滾8圈半\n\n04:10 2024/03/15 中國時報 翁紫曦\n\n\n萊恩葛斯林在新作化身真正的「特技玩家」。（UIP提供）\n\
  \n今年以《Barbie芭比》入圍奧斯卡男配的萊恩葛斯林，是好萊塢「有演技及顏值」的代表\n男星之一。他主演的新作《特技玩家》近期將推出，片中與真實世界的特技專家合作，協\n\
  同劇組一同打破金氏世界紀錄。\n\n《特技玩家》綜合飛車、特技、喜劇，有許多驚險及刺激的動作場面，劇組人員從2022年\n開始拍攝，並在澳洲雪梨的海灘進行飛車特技訓練，成功締造了在車裡翻滾8圈半的紀錄\n\
  。\n\n上一次打破這項紀錄的電影是《007首部曲：皇家夜總會》，當時的翻滾次數為7圈。萊恩\n葛斯林日前與導演大衛雷奇一起將金氏世界紀錄的證書獻給特技駕駛羅根霍勒迪，一同慶\n\
  祝這個難能可貴的成就。\n\n特技演員羅根霍勒迪經驗豐富，他在拍片現場展現他的飛車技巧，表演好幾個驚人的飛車\n特技，包括開車衝上60公尺高的坡道。羅根本身就是來自特技世家，「我從小到大就知道\n\
  我爸是一名特技演員，於是電影拍片現場和特技動作的世界對我的影響一直都在。」\n\n導演大衛雷奇也曾是特技演員出身，他坦言拍攝此片的初衷為「向自己作為特技演員的出\n\
  身致敬」，也將該片獻給好萊塢特技界的無名英雄。\n\n#金氏世界紀錄 #羅根 #特技 #玩家 #萊恩葛斯林\n\n--\n\n 是菩薩成佛之道\n      \
  \  是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
