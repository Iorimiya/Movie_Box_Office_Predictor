url: https://www.ptt.cc/bbs/movie/M.1714124565.A.550.html
title: '[普負無雷] 《特技玩家》'
content: '最棒的地方大概是最後cast表有真正特技演員的畫面吧

  奧斯卡應該設一個最佳特技獎的



  優點：

  ……

  我回家路上再想想



  缺點：

  劇情易懂，但是混亂無章

  中間插入的另外兩個故事主題，反而讓這片偏離了特技演員這個主題

  看得出來導演有自己的野心在，拍攝非常的不錯，在鏡頭演出上觀感還算不錯

  但是跟不上脫序的劇本，拖累了整體的演出感覺

  再加上不同主題的搭配，讓這片有些陷入混亂之中，失去一個明確的主體，導致四周充滿了

  問題，而且失控到難以解決的地步

  直到最後終於拉回正軌的時候，已經有些難以承受的問題出現，不得不倚靠一些尷尬的手法

  來解決劇本上的問題


  整體而言可以看串流就好

  要看電影的話，一般廳就好


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
