url: https://www.ptt.cc/bbs/movie/M.1714149360.A.E17.html
title: '[普無雷] 特技玩家 一度差點睡著'
content: '該怎麼評價這部電影呢

  實在不忍心給他負雷 畢竟特技人員都蠻辛苦的

  也知道這部片就是在致敬這些特技團隊 替身演員


  但劇情實在是太~~~~~~~~~無聊了

  對話無聊 愛情戲無聊 為了鋪陳動作戲的情節更是老套

  真的一度快睡著


  很多動作電影好看

  不只是因為動作場面拍的好   更是因為隨著劇情的高潮迭起

  為了主角而緊張 有的沒的情緒

  但在這部  因為劇情實在太無聊

  反而把那些特效場面一起拉下水


  也因為這部電影的動作場面  很多都在致敬一些動作電影

  所以看起來也不會覺得特別新奇 或有什麼非常厲害的地方


  就中規中矩這樣 (愛情戲也沒甚麼火花)


  演員表現都還不錯 但表演出來的東西實在太無趣


  我是覺得  特效跟動作場面好像沒強到一定要進戲院

  劇情實在太無聊

  除非你對男女主角真的有愛 再去看吧


  以上


  --'
