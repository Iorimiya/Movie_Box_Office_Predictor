url: https://www.ptt.cc/bbs/movie/M.1715599301.A.0AF.html
title: '[新聞] 猩球崛起首映票房超越特技玩家 僅次於'
content: '《猩球崛起：王國誕生》首映票房成績超越《特技玩家》、僅次於《猩球崛起：黎明的進

  擊》


  《猩球崛起》（Planet of the Apes）重啟系列電影的第四部作品《猩球崛起：王國誕生

  》（Kingdom of the Planet of the Apes），已經正式在2024年5月8日上映，北美方面

  也在同月的10日於戲院進行首映。而目前在北美的票房首映票房成績確認獲得5,650萬美

  金，超越由雷恩 葛斯林（Ryan Gosling）、艾蜜莉 布朗（ Emily Blunt）主演的《特技

  玩家》（The Fall Guy）2,770萬美金首映票房成績。




  據消息，在海外票房方面，《猩球崛起：王國誕生》目前為止也賺進了7,250萬美金，在

  全球首映票房也累積到1.29億美金。


  雖說這確實超出了原先外媒所預估的成績，不過事實上，同時也低於2014年獲得7,260萬

  美金首映票房的《猩球崛起：黎明的進擊》（Dawn of the Planet of the Apes），使本

  作成為在北美第二高的系列電影。


  目前北美票房排名，除了位居第一的《猩球崛起：王國誕生》之外，北美總票房成績4,97

  0萬美金的《特技玩家》來到了第二，該作在海外票房也賺進5,400萬美金，全球票房收入

  也來到了1.037億美金


  而第三名則是千黛亞（Zendaya）主演的 《挑戰者》（Challengers），截至週末，北美

  國內總票房為3,840萬美金，全球票房收入則有6,870萬美金。


  新聞來源： THR


  新聞網址：





  --'
