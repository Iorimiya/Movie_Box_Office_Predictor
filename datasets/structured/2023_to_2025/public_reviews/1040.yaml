url: https://www.ptt.cc/bbs/movie/M.1714562894.A.B12.html
title: '[雷] 特技玩家，嘴角一直上揚'
content: '當初看哥吉拉時看到預告片，主角想安全下樓卻因為被掃射只能乖乖跳下去，因為這段想觀

  看此電影。






  以下有雷








  從開頭的特技意外到翻車轉八圈都還在鋪陳的範圍，是女主角發現特技演員是男主角時劇情

  開始好笑了起來，一開始拍著火講解電影大綱時我還沒反應過來，後面發現那個大綱根本是

  女主角怨念時開始笑到抽氣。全部劇組人員一起全頻聽八卦超棒。

  我個人是因為這一段就覺得值回票價了。


  優點：打戲其實不錯，被下藥後打人那邊拍的很遊戲。


  男女主角的互動我蠻喜歡的，男主角在懷念往事美好被女主角暴力介入很有趣，泰勒絲的音

  樂真的很適合，尤其是講完放女主角下車後還繼續播。

  分割畫面我也很喜歡，那個互動感很棒。




  缺點：小秘書那邊有點突兀，突然出現有關鍵證據的人。


  認罪錄到音後開始對女主角覺得穩了開始對女主角對講機講話那一段跟後面搶錄音檔有點沒

  必要。



  整體來說我真的很喜歡，裡面每個角色武力值都超高，直升機上面蓋兒那一拳感覺超有力。

  本來以為錄到證據就結束了沒想到後面還有一場大亂鬥XD


  感謝每位特技演員的付出讓我們有這麼多精采動作片能看，真的應該弄一個最佳特技演員獎


  如果有人想單純笑一笑我會很推薦這部電影




  --'
