url: https://www.ptt.cc/bbs/movie/M.1714394337.A.808.html
title: '[討論] 特技玩家vs子彈列車，兩極評價的原因'
content: '小弟看特技玩家、子彈列車這兩部

  是跟同一個朋友看的，但有趣的點是反應超不同


  導演大衛雷奇在打鬥中加上繽紛誇張的視覺

  但不會兒戲，感受上是有力度的

  置入幽默但不會讓角色的危機感消失

  我是蠻喜歡的


  步出影院時，我跟朋友講

  「真的頗好看，近期爽片第一...」

  他說

  「會嗎？我前面快睡著，太冗長了找人找好久..

  後面打鬥才有精神看一下」



  呃...

  我覺得全程無冷場，有笑有新鮮動作佳

  他覺得就一般爽片，劇情很無聊，大家都看演員


  嘿~~~都是同導演同調性的片

  感受差這麼多


  大家會比較喜歡哪部，原因是什麼呢

  看ptt留言普遍好，但偶有極端的

  好奇導致兩極評價的原因

  就算大家有主觀意識

  應該有某些點容易有較大差異吧


  --'
