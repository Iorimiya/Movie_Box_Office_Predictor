title: '[好無雷] 特技玩家The Fall Guy'
content: '《特技玩家》講述由Ryan Gosling飾演的特技演員捲入一連串的意外，在證明自己清白的同

  時還要想辦法挽回與由Emily Blunt飾演導演的感情。題外話，這兩人剛好是「芭比海默」

  的男女主角。兩人各自拋棄原配，在本片的化學效應極佳。


  Ryan Gosling延續上一部《芭比》中肯尼的感覺，本片一樣是油條(但沒那麼輕浮)帥哥，不

  知道是不是演這類型的角色演上癮了。Emily Blunt不像《奧本海默》中那麼嚴肅，本片是

  個「真的」戀愛中的女人，雖說不是動作擔當，但在電影後半段也小秀了身手。


  導演David Leitch自己就是特技演員出身，他曾經擔任過Matt Damon在《神鬼認證3》的替

  身，也是Brad Pitt在《鬥陣俱樂部》和《史密斯任務》的替身。後來也順利轉成導演，執

  導了不少優秀的動作片。


  因為導演的特殊出身，這部也可以視為「獻給特技演員的一封情書」，我甚至覺得範圍可以

  擴大到「所有的電影幕後人員」，在播放片尾名單時還特別展示拍攝的幕後，讓大家看這部

  電影的特技是怎麼拍出來的。


  電影中插入了很多電影梗，如果你看得電影夠多應該會感到驚喜。片尾有幾個驚喜客串，演

  員突然出現的時候讓人噴笑。


  --

  IG搜尋necksnation看更多文章


  --'
