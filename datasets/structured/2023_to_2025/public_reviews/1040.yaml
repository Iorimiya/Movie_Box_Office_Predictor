url: https://www.ptt.cc/bbs/movie/M.1746049813.A.A84.html
title: '[好雷] 特技玩家'
content: '防雷







































  我想會關注這部電影除了演員名氣

  再來就是出自捍衛任務導演之手吧

  我還是比較喜歡兩人還在合作時拍的

  不過這部電影還算不錯,很有自己的個性

  一部分是由萊恩葛斯林和艾蜜莉布朗撐起來的

  他們倆很鬧的互動可說是一大看點

  雖然這也導致了與之需要的文戲有點稚嫩

  你能感覺到這是一個專精動作片的人導的文戲

  不至於很差,只是看得出專屬的味道

  至少音樂挑的不錯,我就是在說泰勒斯的歌

  動作可能少了點,但每次一有就是精品

  除去前面節奏明顯彆扭不快活

  整體還是相當可愛的一部電影


  ----

  Sent from  on my Samsung SM-S9280


  --

  要是人生有五次就好了。

  這樣的話我五次都要住在不同的地方

  五次都要吃不同的東西吃的飽飽的

  五次都要做不同的工作

  然後五次都要，喜歡上同一個人


  --'
