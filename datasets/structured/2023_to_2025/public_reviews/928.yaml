url: https://www.ptt.cc/bbs/movie/M.1720018006.A.32A.html
title: '[ 好雷] 破浪男女-到底是愛還是性'
content: '剛剛看完《破浪男女》，覺得震撼，但也留下一些疑問？


  這部片跟我一開始想像的不一樣，原以為是用比較藝術的方式在講約砲，但劇情不只是這

  樣。

  導演用很特別的方式，去探討現代人對性與愛的看法。


  我很喜歡片中的台詞，都很寫實又很幽默。像是「失戀的時候去約砲，全世界都不會怪你

  ，還會反過來可憐你，同情你。」、「訂房點數要過期了。」「可是我不會過期啊。」、

  「慢慢就不痛了。」


  發問：


  小綠和單親霸到底是愛上對方了嗎？


  另外那是梁靜茹的歌聲對吧？


  第一次看台灣有這麼大尺度的電影，看完之後，

  卻覺得很舒服，沒有那種看完A片後的空虛。



  --'
