title: '[好雷] 破浪男女 - 愛是傷痛還是靈魂的擁抱？'
content: '這是一部麻瓜不會看懂的電影，但片尾曲藥師寺寛邦的「楞嚴咒」響起的時候，

  電影院裡面沒有人站起來，每個人都靜靜地聽著，

  影廳的燈亮起時，我自己淚流滿面。


  這是我看過最好的台灣情慾電影，心中的第一名。


  為了不爆雷，我決定寫點麻瓜也看不懂的東西。


  「痛會慢慢的好起來」

  通常有能力對別人說這句話的人，自己都失能。


  「在你失戀的時候去約炮，全世界的人都不會怪你」

  他們以為自己在憐憫你，其實是你自己在憐憫自己。


  「如果是很快樂的做愛，那麼生出來的小孩子也許比較幸福？」

  有些事永遠不可能發生就是不會發生，例如關係裡的遺憾能否重來一次不再遺憾。


  電影裡面那些激烈、失能、賦能、痛苦到極限，

  而仍然不知道自己身處何處的掙扎和誰能愛我的悲傷都很動人，

  雖然導演對於角色身分的一些隱喻我覺得當下應該看懂的人沒有多少，

  但撇去情節上的這種書袋，

  情節和氛圍都沉浸到讓曾有類似體驗的人都能有強烈的呼應。


  這不是一部每個人都需要的電影，但當你聽到電影最後兩句：

  「上岸啦！什麼時候再見面？」

  你都會開始思索，自己到底要的是什麼樣的愛的電影。


  --'
