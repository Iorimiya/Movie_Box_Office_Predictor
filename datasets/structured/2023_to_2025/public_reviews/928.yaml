title: '[負雷] 破浪男女有色情就好了嗎'
content: '看完這部片突然理解了

  吳慷仁為何會去大陸


  說到底台片的格局太小


  性對於人類來說是很偉大的題材

  不乏幾個以性為主題


  從色戒到斷背山


  性只是一個說故事的媒介


  這部片原本也是意圖想說什麼

  但到最後就只是單純說性


  單純說性也沒有說不可以

  但你必須說的A片不一樣


  不然大家看A片就好

  人家拍的更全面而不會遮遮掩掩


  這部談性但又不太敢拍


  從前面幾幕刻意的避開性器官不論男女


  都後面幾幕甚至避開奶頭


  同一個演員有幾幕可以有奶頭又有幾幕避開這樣的意義與手法完全不懂


  最後就是談性又拍的隱晦


  完全就展現是一部格局很小的台片

  -----

  Sent from JPTT on my iPhone


  --'
