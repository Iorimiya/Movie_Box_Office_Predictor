url: https://www.ptt.cc/bbs/movie/M.1718975348.A.3CC.html
title: '[新聞] 吳慷仁爆楊雅喆心機鬼 被《破浪男女》搞哭'
content: "吳慷仁爆楊雅喆心機鬼 被《破浪男女》搞哭\n\n2024/06/21 05:30\n\n\n吳慷仁（右）和劉主平在《破浪男女》上演多場激情戲，爆料導演楊雅喆心機重。\n\
  （双喜提供）\n\n〔記者許世穎／台北報導〕台片《破浪男女》昨釋出「講破導演（壞話）篇」花絮，影帝\n吳慷仁、劉主平、柯煒林和梁湘華都異口同聲說導演楊雅喆根本是「心機鬼」！吳慷仁舉\n\
  例導演常常話只說一半，「但那一半對演員來說更有方向感。」但也透露這些充滿心機的\n設計，讓自己感動落淚。\n\n吳慷仁在片中上演多場親密性愛戲，更有全裸、吃腳等親暱動作，面對這些激情戲，他形\n\
  容：「看到劇本就是『哇！』這個『哇！』不是好炫、好酷，而是終於有人要這樣拍。」\n\n至於拍攝裸戲，吳慷仁說男演員壓力其實不小於女演員，「因為觸碰、觀看，甚至身體的\n\
  接觸都是滿尷尬的，我們可以當作是演戲，但導演要的不只是演戲，而是真實感。」他說\n比較大的問題是可能是如何去表現出劇本裡面男歡女愛的動作，甚至是動機。\n《破浪男女》將於6月28日在台上映。\n\
  \n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--\n\n你迷信的宗教才是爛教，\n傳承了親口說的正法律沒被佛教經典汙染。\n\
  \n\n上座部佛教馬哈希帝釋所問經講記77頁破大乘妙法蓮華經\n\n\n\n\n你會迷信是你自己的問題，\n真正的佛教上座部佛教沒有迷信的問題。\n\n\n你的噓文才是廢文。\n\
  \n\n\n\n\n\n上座部佛教馬哈希帝釋所問經講記77頁戳破偽經大乘妙法蓮華經\n帝釋所問經講記78頁開示說明假佛教大乘西方極樂世界是外道邪見（常見）假裝佛教"
