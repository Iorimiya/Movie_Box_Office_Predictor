url: https://www.ptt.cc/bbs/movie/M.1719689253.A.F01.html
title: '[普雷]破浪男女'
content: '雷文防雷資訊頁


  電腦打文字不符合手機排版見諒


















  從大學時期看 楊導 冏男孩，受奇幻跳躍帶出情感的影響突然淚崩後

  再過幾年的 女朋友、男朋友，目前的作品既使是血觀音都不能超過這兩部


  當然期待還有其他作品


  但這部目前排名第三





  就話題性來說，將這些類似BDSM 的劇情公佈在台灣的大營幕之上


  當然很刷許多人三觀，但事實是 這些話題對有一定年齡或有理解的人來說


  還真的不算什麼，觀影時反而不特別著墨 那些親密的關係



  而是不斷的在想，這些要怎麼綜合拼裝出 楊導這次可能要表達的主題呢?




  我想 透過 最初的心動 這一媒介



  這既像是一部要探討的 純愛電影，但又追求不到愛的尋愛電影




  「Say you love me」白在夢境當中反覆說著這句話的時候


  是有多渴望愛，同一句台詞，在 歌劇魅影 是出自於 all I ask of you 裡的吟誦



  但在白的夢境裡  不管怎麼要那個男人說出對自己的愛

  都像最後想要拔掉 uberdick的膠衣想要知道渴求對方像自己的樣子愛自己一般


  怎樣都得不到在泥巴裡哭泣、也在巷子裡流下眼淚



  彷彿看到一個想要被救贖的女性突然想擁抱或倡議出自己的權力時

  依然狠狠的被男性打趴在地上，像那像BMW在港邊又進又退


  內在的拉扯，需要透過繩子的束縛，一牽一動才能獲得到看見

  才能被一步步的解放，事實上，白真的作回她自己了嗎?




  一個不自由的靈魂，發現了另一個不自由的靈魂，

  焦慮與焦慮的碰撞，哪有誰救的了誰


  所以在泥巴裡打亂成一團，又是插入，又是逃離，


  一直到uberdick將頭套留在「手術室」，象徵他從膠衣中離開，

  騎著車的他，直接且自在的展露出面容，隨即 白 便笑了，



  我不知道 看到這邊的時候

  有多少人在看著這些愛慾背後所隱藏的痛苦


  在白 的笑容後，有獲得到解放嗎?






  覺得uberdick應該是男二沒錯，吳慷仁才是男一


  否則uberdick的故事好像可以更多

  不會是一個阿嬤出了場，隨便說一句養出來的叉燒都不如


  雖然帶出了辛酸，但同時也太短暫(奇怪片長不應該要超過兩小時比較好嗎?)


  這種硬是要提一下卻又沒有辦法深入再理解

  在 血觀音 的時候就很明顯 有點像是要講 卻又不是那些最會勾勒感受的事件交待


  其實很不喜歡這種安排，感受會被打斷



  uberdick跟 白在一開始披外套的那幕看起來很有愛

  但在後來雨中又發生了一次，原本以為是愛 的互動


  但uberdick卻沒有想要讓自己暴露


  白依然得到的 不是真的愛





  可是暗示是悲傷的故事 加入了和解留下頭套的末尾


  回扣到 這是一部 尋愛電影的想法

  真忍不禁在想，楊導要救贖的 是戲前的觀眾




  兩條主線看似並沒有相交；但因為白和火星女孩在網路社團的關係

  係透過分享社團內他人的資訊，讓觀眾在兩者間有著感受的相連


  如 白和uberdick的關係 隔著一層膠衣


  呼應著吳慷仁和火星女孩的一段對話說 「彼此認識，純愛就不純愛了」

  再後面又改「希望認識彼此不是關係破滅的開始」


  也又呼應 白當時對uberdick的請求





  台詞與潛台詞的改變，象徵關係也不斷在改變







  吳慷仁與火星女孩是愛嗎?



  一個外遇、經營多重關係的人

  一個說要認清自己就是破麻同時也覺得自己性器官長的很奇怪的火星女孩


  他們怎麼看對方感受

  怎麼知道是真的愛



  只要跟平常那些女孩所問的不同問題的(火星)女孩


  那些與眾不同的感覺

  就真的是愛嗎? 還是他們心裡依然有著對一份純愛/而非被現實影響的感情期待




  電影前後用 人魚(公主)的比方來說明純愛


  有相同的感情期待，就能成為彼此好的戀人嗎

  愛是用來宰割對方行為的結果嗎




  雖然影片有大量的裸體，在泡澡、在水池、床第之間，


  但怎麼樣，都回不去最原本嬰孩的最初情況

  這種對於愛情的無奈，從 你那邊幾點 李春生在天橋上敲著敲著



  現實裡就是有這麼多無奈



  而現代人的無奈，變成是 可以最快解決 的上床速食關係

  但真正的愛，則是一起面對這些生活的平淡


  像火星女孩說的


  1.手牽手是第三壘

  2.兩個人一起換床單太超過了唷




  希望有人可以一起平平凡凡，但又許多時候離不開大千世界


  想要被愛，卻又不相信被愛




  所以才會說「像現在這樣半夢半醒的最舒服了，不是嗎?」


  最後才也會對觀眾問「上岸了，什麼時候再見面?」




  整個電影也可以說是 觀眾和楊導的一場夢境

  電影結束了 也該醒了



  這種述說方式，跟以前的冏男孩裡面 騙子一號跟騙子二號

  常說出一些讓人二愣子摸不著腦待的對話風格很接近


  說的從來都不是劇情的串連

  而是變向的對觀眾做出發問




  這部份的隱喻方式總是有意思的


  像 天邊一朵雲 李春生 挖著西瓜時

  有多少觀眾也同時藉由影像感受到身體的渴



  痛象徵著 渴、缺、要

  如果不用著這些方式 都快要忘掉自己還活在這世界差點以為這就都是夢境了


  有一幕是 白在佛前拍照時 眼淚不自主的掉下來



  即使生活這麼須要有人給予"疼痛"

  但夢境依然要假裝(兩家聯姻)的維持下去


  因為太假了，又再需要被捆綁被束縛 好像是被愛





  「你把假的當成真的、真的有一天也會變成假的」



  認真想一想，這部電影裡面並沒有真的拍出 男女性高潮的片段

  真正超過影片審核標準的，都只拍出 過程是愉悅的


  最接近的只有白的 1.固定夢境的火燄 2.像開花一樣的把手打開


  前者說的還是對目標到底有多渴求 才會一直做同一個重覆的夢

  反觀火星女孩和吳慷仁 更像是錯付的關係

  讓火星女孩後面對吳慷人說「如果快樂的過程那生下來的孩子應該也是會快樂的吧」



  很難讓人不解讀 火星女孩本身的矛盾跟隱藏的沒有自信


  所以 白是可能曾被愛過所以相信愛追求愛的女子

  但說自己是破麻的火星女孩 可能連愛是什麼都難以相信了


  就連吳慷仁對女孩說「絕對不會說」這件事都像什麼的預告


  火星女孩自己對 最初的心動 嚮往不已

  但似乎又說著自己對於愛的缺失


  也讓吳慷仁拿花回去前 唸叨著她不懂照顧自己



  其實她就像那一盆花


  水澆的少一點 就會開花了




  她想要追求的愛和自我 少一點對自己的沒有自信

  一定就也會讓自己開花的





  所以說，愛是什麼呢?



  變成到最後，就都只剩下做愛(或傷害)了嗎?







  整部片最喜歡 由人魚故事連結到在泳池底下看到一個像陰唇一樣的孔洞


  女一 瞬間被拉入水底的時候

  就像開啟愛欲的初體驗


  看到自己在水裡跟一堆人雜交的另一張臉



  好像也在說 最初的自己也沒有想過自己會變成那樣子




  回到電影題目 破浪男女 的破浪

  既是乘風前行 卻也可能是逆流而上與他人不同的為難困境


  所以一開始的泳池邊

  拯救溺水者的人魚是男性


  而不是公主


  也可能是楊導這次想將自己也試著再突破出不同作品的投射意涵(猜的)









  甚至 是夢中夢

  最後 咱影帝被突破的畫面


  都可能是火星女孩的夢


  回到一開始 女一躺在床上春夢

  像全面啟動一樣 可能又是一層又一層的循回連結


  想要對愛的測試 卻也是夢境想像和現實的拉扯





  看完這一切 不知道大家有沒有突然想起身邊的誰


  我有。聽片尾的音樂，是不是也是說需要被獲得到救贖呢?




  「你先想好，什麼叫作在一起呢?」







  在海水裡，我們再回到嬰兒被包圍的時候


  起初於愛，之後有愛




  雖然吳慷仁的名單被放在片尾較前面的位置


  但我想楊導的突破 應該是這部有更多的女性視角

  影片中的男性 更多時候為配角



  女性是水、也是愛的開始


  我是這樣想的


  題外話，電影有用 溫柔的慈悲

  回程散步時則自然而然的 想要唱 信樂團的離歌


  有時候 不管愛或不愛

  都會很寂寞 只是主動上了岸

  跟救助上了岸 還是不一樣的




  --

  感謝樓上們的補充 概念更清楚了

  這似乎也可跟 從一開始就夢遺這個說法更接近了


  今天爬山的時候，突然想起一個關聯

  上一部作品是 血觀音


  然而，印象中有個名詞叫做 觀音相

  觀音有多個化身 共有三十三個法身相


  我想這是與火星女孩（小綠）同是單眼皮的神奇關聯


  另外，觀音本身一開始是男性的概念

  但在後期隨慈悲的印象才變為女性


  也可以說 兩者兼具


  換句話說，最後一幕中間舔人和被舔的

  不過是一個形象轉換的中介物


  究竟火星女孩和吳慷仁


  誰是哪一種性別到頭來好像都不重要了


  願所有人在擺脫不了的枷鎖中

  發現自己終有

  悲劇之外的選擇


  以上補充'
