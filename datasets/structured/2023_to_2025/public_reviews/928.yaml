  \n愛的開始，說是初戀的亡靈糾纏，並非初戀對象有什麼魔法，而是因為\n\n「初」，不懂得進的分寸，退的智慧，初次用自己的眼睛確認在另一個人的\n\n眼睛裡看見自己，那樣的著魔與自我附著。\n\
  \n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\n                \
