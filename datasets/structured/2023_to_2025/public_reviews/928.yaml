title: 'Re: [負雷] 破浪男女有色情就好了嗎'
content: '我是覺得本板對破浪男女有很大的誤解


  喆哥拍這片最重要的就是想玩手法阿

  花式體位、花式游泳、SM綑綁、用畫面呈現數位時代的聊天方式


  這本來就是一個導演想要爽玩的片

  目的主要是突破自我、突破國片舊有手法


  當然主旨還是抓得滿好的

  主旨就是真愛與考驗阿

  劉主平用肛來考驗了吳慷仁


  謎底揭曉，劉主平是變性人阿

  一開始那個小男孩就是她

  玩了一個大反轉


  至於梁湘樺與uberdick

  就是純愛插曲

  所以前前篇說為什麼梁後來都不露了


  這對男女配純愛成這樣，露不露根本不重要吧

  把SM拍得比偶像劇還純愛，喆哥真的很有一套

  最後面罩放在梁的旁邊，uberdick離開邊騎邊哭

  真的是有夠浪漫

  我當初在戲院看到直接心碎

  這對我真的好愛


  我在串流又重看了幾次

  還是很好看

  完全屌打中島長雄...


  --'
