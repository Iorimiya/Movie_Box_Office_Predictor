url: https://www.ptt.cc/bbs/movie/M.1720254442.A.0CF.html
title: '[好無雷] 破浪男女 不推薦給「大家」看的片'
content: '本篇無雷（推文有）


  或許有人看到標題以為我分類寫錯

  不過這部真的不像面對「大眾」的作品

  或許更適合當成藝術片/影展片來看

  好幾段可以擺在美術館的那種

  但絲毫不減損對這部片的愛


  如果大家是衝著吳慷仁露屌或女生露胸部的畫面去看

  一定會失望

  不是說情慾戲時間很短

  相反地，我覺得整部1/2都算情慾戲

  但他的情慾戲很常會讓人「軟掉」

  他的用意不在挑起你的性慾、覺得女主真性感

  反而傳達了某種無力、悲傷的感覺

  所以如果只是想看肉體、刺激性慾的話建議去pornhub 就好


  而且我覺得在看這部片之前最好先具備某些性知識比較能夠抓到導演的想法

  例如皮繩捆綁、膠衣、主奴跟跨性別等等

  或許很多人覺得反應兩極是因為裡面有很多的暗喻

  就連一開始的前10分鐘我都以為電影院播錯電影

  但看到後來真的是覺得很精彩


  而其中有許多劇情則是很大的共鳴點

  我看了時候覺得很被打動

  不過不確定如果沒有相同經歷的人是否可以共感

  最後片尾一播藥師寺寬邦的歌真的雞皮疙瘩都起來了


  或許這是一部很吃電波、人生經歷的電影

  但真的認為這部片可以成為一代經典


  有時候真的覺得「半夢半醒」蠻好的


  --


  =====================推文防雷=====


  防雷

  大雷

  今天映後也有人問到

  我自己的解讀啦（其實覺得蠻明顯的，但沒有相關知識很難看出來）

  1.已淨身那邊的英文字幕其實很明白的講出來他做了性別置換手術


  2.不知道大家有沒有印象小綠最後躲在廁所聊天前，吳要求一起洗澡，小綠拒絕然後掉出

  一堆假陽具

  我的推測啦！其實是因為人工陰道需要一直放著固定物不然會自然密合

  所以要一直放著假屌


  所以那段兩個男孩在夜市的對話（如果你是女的...）

  可以解釋是小綠去變性的原因

  也就是小綠「異男忘」了，為了得到異男的愛所以去變性

  那兩個其實是小綠自己的過往經驗的投射'
