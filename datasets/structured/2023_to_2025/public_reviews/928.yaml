url: https://www.ptt.cc/bbs/movie/M.1721398836.A.3C8.html
title: '[好雷] 破浪男女，楊雅喆繳出生涯最佳'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  真的是太棒了，太好看了

  劉主平已經預約今年金馬獎影后了

  梁湘華預約金馬獎最佳女配角


  真的不能小看楊雅喆

  當然我知道天橋上的魔術師，這個花了2億的台劇最後只能算叫好不叫座


  但破浪男女絕對是今年金馬獎最大贏家

  21世紀的愛情萬歲

  完全不輸給當年的蔡明亮


  楊雅喆這次拍攝手法真的太精采了

  用大量的水與游泳的姿態，來比喻人在最初的狀態，那種原始的野性

  還有用各種精彩的鏡頭來呈現現代人網路交談的情況


  最重要的是主線真的太好看了

  吳慷仁跟劉主平兩個高來高去的感情高手，不斷對戰

  從忠孝東路一段殺到七段

  最後才發現自己內心的空洞與哀傷


  副線相對弱一點，因為有點太偶像劇

  千金小姐忘不了初戀，居然愛上幫她SM的窮男生

  兩個產生一段小小的愛情鳩葛

  雖然弱，但相對柔情與感人，可以幫忙潤滑主線，還是不錯


  梁湘華表現突出，值得一座金馬女配

  劉主平穩拿影后，這位臉蛋是金高銀與李沐綜合體的的女生，即將超車王淨

  成為台灣新生代最優秀的女演員


  吳慷仁演出稍嫌匠氣，可惜了...

  不過楊雅喆本來就比較會拍女角，台灣影后製造機


  已經上映三週了，大家一定要把握時間去看，讓票房衝破4000萬


  --'
