url: https://www.ptt.cc/bbs/movie/M.1726500214.A.285.html
title: '[新聞] 《破浪男女》色誘香江 柯煒林教吳慷仁港式約砲'
content: "《破浪男女》色誘香江 柯煒林教吳慷仁港式約砲\n\n2024/09/16 05:30\n\n\n《破浪男女》演員柯煒林（左起）、梁湘華、劉主平、吳慷仁齊聚香港首映，拿起羽毛球\n\
  拍搞笑合影。（台北双喜電影提供）\n\n〔記者廖俐惠／綜合報導〕台灣電影《破浪男女》即將在26日於香港上映，吳慷仁、柯煒\n林、劉主平和梁湘華前天現身香港首映，4位演員分別戴上皮革手銬和雙手綁繩現身，並\n\
  拿起羽毛球拍合照，身為地主的柯煒林教吳慷仁用廣東話說：「我今晚想約你打羽毛球！\n」讓吳慷仁立刻幽默回應：「不好不好！」現場氣氛歡樂。\n\n原來「打羽毛球」在香港是約砲暗號，港媒更好奇地問：「那台灣的約砲暗號是什麼？」\n\
  劉主平笑著回答：「應該是『來我家看貓』或者『來我家看影集』之類的吧？」詼諧的回\n答讓全場哄堂大笑，讓人見識到台港兩地在社交文化上的不同。\n\n由於工作安排，導演楊雅喆無法親自到場，但特別錄製影片向香港觀眾問好，並透露電影\n\
  片名《破浪男女》其實來自台灣流行的喝酒文化，週末要喝到「破破爛爛」，認為這部電\n影只有台灣能拍，正因為台灣對於性與愛的探討更加開放，才有可能呈現出如此深刻且大\n\
  膽的作品。\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
