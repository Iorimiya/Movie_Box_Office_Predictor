url: https://www.ptt.cc/bbs/movie/M.1722439075.A.C4C.html
title: 'Re: [討論] 破浪男女宣傳是不是太少了呢'
content: '簡單說就是宣傳不夠下流

  應該要比照香港當年票房冠軍（純港片）

  《3D肉浦團》的宣傳營銷

  主打台灣史上尺度最大情慾電影

  兩位女主有多大膽犧牲

  吳慷仁全裸演出

  至少把一堆蕭迪勾騙進戲院賺票房


  結果宣傳超隱晦

  上映一週後都還有人在問吳慷仁真的有全裸嗎？

  17公分還是記者幫忙想的點

  宣傳根本沒提

  導演上一堆podcast

  講什麼上岸啊

  大尺度的純愛電影

  一般觀眾哪裡聽得懂這部片是在幹嘛？


  幾個月前的《我在這裡等你》也是宣傳爆死

  導演鄧依涵不知道在ㄍ一ㄥ什麼

  堅決不承認這是部BL電影

  我看過覺得這部絕對是BL電影

  只是拍的比較清水罷了

  宣傳方問要不要以BL來營銷

  導演還不要

  只會說什麼留給觀眾去思考

  媽啦

  拜託台灣導演們放下你們的矜持好嗎？

  也許你創作時真的覺得是不是BL界線很模糊

  但是電影上映了你就要定調好嗎

  不然宣傳怎麼搞？

  結果就是一般觀眾跟腐女族群兩邊不討好被罵慘


  人家謝國豪一個香港人移民台灣投資拍電影

  就為了你導演的藝術堅持

  堅決不承認是BL電影

  害人家賠錢你內心不會過不去嗎？


  當年也是女導演陳映蓉拍一個自溺的罪夢者

  害網飛製作人被開除

  網飛從此不製作台劇

  之後都是買別人製作好的掛原創罷了

  真的不是上帝不給台劇、國片機會

  而是當機會來時

  台灣的影視創作者你們有把握住嗎？






















  --'
