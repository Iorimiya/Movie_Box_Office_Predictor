url: https://www.ptt.cc/bbs/movie/M.1719567985.A.3D5.html
title: '[討論] 破浪男女 - 露第三點的都只有男的'
content: '今天跑去看了今天中午第一場

  有鑑於小時候在第一廣場的二輪電影院看蔡明亮的《天邊一朵雲》的經驗

  那時候一堆奇怪的歐吉桑都集體的散落在最後一排的前後邊邊角角

  各自裝著大開襠的短褲想也知道他們要看著影片幹嘛

  為了避免被當作噁男也同時想近距離欣賞演員之於劇情表最真實的裸露

  跑去坐到了前三拍的大中間，視野也比較可以細探

  我想後排的情侶或是其他的人也是把我當成奇人異士來看吧

  作為少數已經很久沒看到這種還滿赤裸的色情電影

  （不好意思，我不知道該怎麼更加修飾的去描述這片的類型，但是我真的覺得就是色情電影

  ，沒有貶抑的意思）

  簡單來說劇情就是描寫四位男女彼此之間各自的故事

  從“性愛”這個內在的慾望在四位角色的情緒和立場下開始延伸

  我自己看的感覺是比較沒有戲劇性、都是四人之間的獨白

  當初看到了這部片的預告就決定來看

  當然被性愛這個元素是吸引是佔大多的成分

  因為預告和劇情裡面有提到未成年少女的性愛內容

  還以為會穿插一點懸疑或是犯罪方面的劇情

  但是並沒有特別多著墨在這部分

  整部片充斥著大量的意識流

  劇情的推演也就只是在四個人彼此之間來來去去

  資質駑鈍的我，真的不太懂這部片到底想表達什麼

  大概就是我自己預期的跟這部片完全不同，期望上放錯地方了

  我原本以為會像楊雅喆上一部《血觀音》那樣

  看到非常有張力和深沉的劇情

  導演也許可以把他之前《男朋友女朋友》的slogan

  「每個人都該有兩個情人，一個幹我的，一個我幹的」

  拿來改一下再使用

  應該也是滿合適這部片的調調



  --'
