title: '[新聞] 吳慷仁《破浪男女》尺度開 全裸3P樣樣來'
content: "吳慷仁《破浪男女》尺度開 全裸3P樣樣來\n\n04:10 2024/06/23 中國時報 翁紫曦\n\n\n導演楊雅喆（左起）、柯煒林、梁湘華、劉主平、吳慷仁22日出席《破浪男女》星光首映\n\
  。（台北電影節提供）\n\n電影《破浪男女》22日於台北電影節舉辦全台首映暨驚喜場，導演楊雅喆攜演員吳慷仁、\n劉主平、梁湘華、柯煒林共同出席。片中吳慷仁有突破尺度的挑戰，全裸、3P性愛大膽體\n\
  驗，吳慷仁笑道：「沒感覺尷尬，甚至可以感受到汗水鹹鹹的」。\n\n金馬影帝吳慷仁這次在《破浪男女》拿出有別以往的一面，還在電影中嘗試「舔屁股」，\n他更大方透露對手演員的表演很真實，也認為影視作品是很誠實的，不感覺色情、噁心，\n\
  「今天要我全裸走過去都沒問題的」。而柯煒林則趁機補充，導演在這部電影捕捉到非常\n真實的反應，「不是獵奇的觀點。」\n\n楊雅喆指出，自己除了要平復心情，也要檢查演員的情緒、拍攝的狀態。他更坦言：「這\n\
  個角色都是從我身上出去的，也像我創作的性幻想。」他透露拍片之前有特地到推特上加\n入「約炮群組」。他表示，自己身為生理男性，花了不少時間研究不同的對話，才能夠更\n\
  理解女生對於「性」的感覺。\n\n殺青以來至今，演員、導演終於首度一同坐下來在大銀幕觀賞《破浪男女》。楊雅喆笑道\n，在看片過程中，身旁的椅子一直震動，轉頭看才發現演員4人哭到不行，「我想說你們4\n\
  個人不是看過了嗎？」吳慷仁回道，大銀幕跟試片室的體驗很不一樣，「再看一次有很多\n細節，試片小螢幕沒看到的」，讚歎大銀幕的聲音效果更好。\n\n#全裸 #破浪\
  \ #男女 #楊雅 #導演\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
