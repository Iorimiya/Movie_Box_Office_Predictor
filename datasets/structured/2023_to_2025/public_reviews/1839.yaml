url: https://www.ptt.cc/bbs/movie/M.1517909972.A.653.html
title: '[新聞] 金馬奇幻影展焦點導演 歌舞巨匠鮑伯佛西'
content: '新聞網址：




  金馬奇幻影展焦點導演公布 歌舞巨匠鮑伯佛西


  2018-02-06 16:21聯合報 記者陳建嘉╱即時報導


  金馬奇幻影展本屆焦點導演要向一代歌舞巨匠鮑伯佛西致敬，一網打盡他的五部經典，包

  括被歌王天后視為編舞聖經的「生命的旋律」、打敗「教父」柯波拉贏得奧斯卡最佳導演

  的「酒店」、曾被視為傷風敗俗而遭禁演的「連尼」、摘下坎城金棕櫚大獎的「爵士春秋

  」，以及大文豪海明威的孫女瑪麗海明威挑戰性感演出的「兔女郎謀殺案」。此外，招牌

  K歌場更獻上改編鮑伯佛西舞台劇的奧斯卡最佳影片「芝加哥」，邀請影迷一同與李察吉

  爾、凱薩琳麗塔瓊絲與芮妮齊薇格大秀舞技歌藝，秒殺招牌秀「洛基恐怖秀」也將連續第

  九年嗨翻戲院。


  1927年生於芝加哥的鮑伯佛西曾夢想成為舞王佛雷亞斯坦的銀幕接班人，但他過人的編舞

  才華反而先吸引百老匯挖角，在拿下五座東尼獎後，才以改編自身舞台劇的「生命的旋律

  」重返好萊塢，打響電影導演第一炮。他的舞步獨樹一格，幾乎從頭到腳每一處關節都被

  他拆解運用，重新定義身體的美感和律動。他更顛覆歌舞片樂觀光明的刻板印象，賦予開

  放的性別、性向、政治、社會概念，也讓劃時代「酒店」一舉奪下八座奧斯卡獎，帶有自

  傳性質的「爵士春秋」則贏得坎城金棕櫚獎。但鮑伯佛西並不滿足於只當一個傑出的歌舞

  片導演，分別入圍坎城、柏林影展的「連尼」與「兔女郎謀殺案」都改編自真人真事，卻

  在他錯綜複雜的敘事下，展現了深刻的人性與時代觀察。達斯汀霍夫曼主演的「連尼」當

  年被台灣禁演，這也是本片第一次在台放映。「兔女郎謀殺案」則由文豪海明威的孫女瑪

  麗海明威與茱莉亞羅勃茲的哥哥艾力克羅勃茲賣力主演，頗受好評。


  鮑伯佛西對後世的影響持續至今，他在七○年代原創的百老匯代表作「芝加哥」在2002年

  被羅伯馬歇爾搬上大銀幕，獲得奧斯卡最佳影片等六項大獎，又掀起一波歌舞風潮。這次

  金馬奇幻影展不僅將帶領觀眾一次掌握這位歌舞傳奇的銀幕經典，並推出「芝加哥」K歌

  場，將熱血沸騰的歌舞表演從銀幕帶到台下，觀眾不但能一飽眼福，也歡迎和銀幕主角一

  起性感高歌「All That Jazz」、「Cell Block Tango」、「We Both Reached For the G

  un」等經典曲目，將戲院變成超大KTV。金馬奇幻影展的招牌「洛基恐怖秀」也將可望連

  續第九年締造秒殺佳績，要搶要快。


  --------


  鮑伯佛西專題超吸引人！要搶票了！


  --'
