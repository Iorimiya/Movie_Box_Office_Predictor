title: '[極好雷] 我親手殺死的 / 金馬奇幻影展'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《我親手殺死的》極好雷影評：這次別輕輕放過。\n\
  \n\n今年金馬奇幻影展最毫無懸念的五顆星（目前個人年度第二）。\n\n\n\n\n先用自己理解到的程度講解主要劇情。劇情圍繞在父親弒母，以及主角弒父的過程。\n\
  \n父親弒母相對簡單，父親一直有家暴傾向，但同住的家人選擇隱忍，後來透過主角奔走拼\n湊出母親死亡的真相。又從父親手足口中得知，父親自己也是家暴的受害者。\n\n\
  主角弒父我想要分成物理場景和心理場景兩塊。\n\n物理場景是當主角發現母親死於父親之手，在案發當晚綁架、施虐並活埋了父親。就這麼\n簡單。\n\n心理場景則要從園丁講起，我認為這個園丁是主角的心理投射，他希望成為的人，證據就\n\
  是除了主角，沒有人看過他。主角在片尾跟校方談到，他遠赴美國是為了斷根、離開父親\n的陰影，而園丁就是從美國來的，沒有任何背景交代、自由自在毫無包袱的一個人。雇用\n\
  了園丁象徵主角的第二個人格開啟。他們合力殺死了父親，由園丁從美國來的嶄新人格面\n對案發後的一切，卻發現自己依然落入父親的充滿暴力、防禦性投射的自大循環(否認一\n\
  切、大小聲溝通來防衛自己的弱點)。\n\n後來主角殺死了園丁，又以自己真身示人，吐露他的難處與不安。他害怕父親，也害怕自\n己終將成為父親，於是園丁把過去的自己鎖在花園(某種程度園丁沒說謊，他那晚真的在\n\
  花園)。但瞭解父親的過去，以及發現園丁人格也無力改變命運後，主角在心理層面殺死\n園丁回歸真我，在物理層面上決定斷絕過去(賣房子)、洗心革面。\n\n最後，滿身是血的父親在半夜走回家，又現急促敲門聲。我認為物理上父親已經離世，這\n\
  邊要闡述心理上，\n\n\n\n有多少問題，跟家裡的破水管一樣年久失修？除了明顯的家暴世襲問題，電影也尖銳地指\n出，鄉愿地說謊與隱瞞所帶來的惡果。\n\n電影一開頭就披露了主角一家的陳年破事，爛水管、母親殘缺的雙腿，以及後來的家暴、\n\
  不孕、破碎的婚姻......。\n\n\n當他們決定\n跨過陰影、誠實一回，再回過頭質疑對方為什麼都不說。\n\n容忍是對的嗎？該不該追求真相？電影沒有直接回答。除了上述家族傷痛的元素，也\n\
  \n\n\n弱者同時是施害者，施害者也曾是弱者。\n\n\n原生家庭，難以擺脫的噩夢。如同主角開口誠實談論不孕問題，\n儘管如此艱難。\n\n\n>> 網頁好讀版：\n\
  \n–\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n--\n糟糕我失憶了@@鏡子是哪邊可以幫忙講更多嗎？\n\
  河畔小日子（我的年度是觀影時間，所以這部其實是舊片二刷）\n原來～我腦袋全部還回去了qqqqqq\n感謝你！\n我很不會記電影細節\n補：看了Letterboxed評論，一堆人沒發現換人，我中間也有懷疑疑惑，還好後來有看懂\n\
  救回來xddddd\n老實講我覺得還好\n兩者差異主要是國家，其他沒分那麼開（不如說互為表裡\n但這部的張力跟反轉還是很精彩\n這我沒想過耶，這解釋很有趣\n\
  天啊太酷了～\n補充：\n\nkill the light自己的解讀：\n弒父與弒母在電影中完全相對。站在同一個位置，是主角做出不同選擇、停止循環的大好\n機會。\n\
  當房子被賣掉，代表過去全部封存。主角完全重蹈覆轍，所有傷痛跟罪惡又藏於男子氣概\n的遮羞布。\n家裡的希望（光）因此熄滅，下一個孩子即將誕生（敲門，也許是嬰兒也許是父親，嬰兒\n\
  是脆網友@zzz890264提出的）。\n最後一幕激起極大驚悚與懸念。主角親手殺死父親，也扼殺改變的機會，我們還有機會修\n正嗎？結局自行想像。"
