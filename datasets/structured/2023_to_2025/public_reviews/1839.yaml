url: https://www.ptt.cc/bbs/movie/M.1649417130.A.536.html
title: 'Re: [討論] 為什麼金馬奇幻影展這麼夯呀？'
content: '奇幻影展當初是因為一年只辦一次金馬,中間有很多空餘時間,才因緣際會辦的,


  後來才又有七八月的經典影展(當然不辦影展期間還是很多事要做,很忙的)


  所以走向就跟金馬不太一樣,比較有趣&大眾取向,當然之後大眾到有點超過,


  像2017年我印象很深刻,超多片都是未來會上的,完全就變成搶先看模式了,那買票的誘因

  就少了,現在串流也很方便,許多片都能看到甚至搶先看




  後來工作比較忙暫時離開,但還是會看一下片單,這幾年好像又好一些沒那麼大眾了,


  不過跑到信義區的確少了些許魅力,午夜場看完電影,走出獅子林大樓,看到下面排了一堆名車,


  一群人在旁邊抽菸,有比這還奇幻的場景嗎?


  當然信義區很遠不想跑也是一個點,看到同溫層還在搶票賣票還是想回味一下


  --

  很多攤販深夜才跑出來

  我記得之前有看到二樓還三樓水龍頭寫:盜用水者死死死

  有次真善美也是這樣 後來因為危險那安全門不能亂開了 是走外面樓梯

  很多年都沒有了

  西門名車是直接插進來停的

  覺得很像重慶森林(?

  當年發條橘子是超限 後來重新上映就只有限制級而已 時代變了大家口味變大'
