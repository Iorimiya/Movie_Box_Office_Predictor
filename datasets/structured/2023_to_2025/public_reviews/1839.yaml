title: '[好雷]有種錯過叫做愛 / 金馬奇幻影展'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n2025金馬奇幻影展《有種錯過叫做愛》：閨蜜辛辣私聊\n\
  \n◎推薦語\n\n\n\n\n/\n走出失戀最快的方法：比爛。打開Youtube、Podcast聽最慘的情殺案、最狗血的婚外情，\n再回頭看你手邊的爛事，不過芝麻綠豆，心情應該能好一大半(如果心情還是很糟，你應\n\
  該去報警或是趕快投稿上節目)。\n\n拔掉耳機走進戲院，不到十分鐘心裡升起疑問：奇怪，我不是關掉podcast了嗎？怎麼是\n。\n/\n電影開頭就用綿密的日常對話，帶出很多愛情診療室、愛情QA會收到的投稿。真的十分典\n\
  型，例如：當你發現不愛(沒那麼愛)伴侶了，到底要誠實坦白，還是基於承諾持續付出？\n朋友當第三者，閨蜜的老公歸me，該繼續維持恐怖平衡、還是快刀斬亂麻？\n\n\
  背德、羞恥、辛辣。每對伴侶的議題都十分複雜，人物關係圖交雜在一起，又讓情況升級\n。\n他們無比誠實的交代心路歷程與理由、建立包容開放\n的討論框架，讓觀眾無形之間，同理起在追愛路上迷茫掙扎的主角群。\n\
  \n◎愛情沒有理性可言，但你需要。\n\n\n沒錯，一個眼神、來回對望、幾次熱心腸，每個認識的人都是一扇門，每個回頭都有\n可能。\n\n曾經我是真愛至上的信徒。這部電影的人物幾乎都很瀟灑、飛蛾撲火的追愛。因為想對自\n\
  己誠實、對愛情誠實，所以讓大家滿身傷口。\n\n你可\n以從這部電影體會，為何「好兔不吃窩邊草」會是首推的感情守則，以及萬年備胎的等待\n，到底會多漫長。\n\
  /\n「電話號碼換了沒？」電影結尾我一直想到大S和具俊曄，以及謝霆鋒和王菲的曲折故事\n。他們推翻了我覺得「分手就沒什麼可能」的稚嫩想法。《有種錯過叫做愛》更是叫人大\n\
  開眼界。\n\n眼前的人就是一生摯愛嗎？興趣五官不合，加點崇拜會不會燃起愛火？\n\n\n網頁好讀版：\n–\n脆：\nIG：Fishpond_like \n\
  臉書：魚池 FishPond \n個人網站：\n\n\n\n--\n註：片名沒有雙關梗（咳咳\n感謝你的建議，我有再改一下了\n昨天寫得比較隨意"
