content: '前幾天朋友約我去參加這個週末有一場洛基恐怖秀party

  老實說我本身對電影沒有太多的了解

  本來還以為是個什麼秀(原來是電影，汗)

  爬了一下才發現電影版上關於這部的心得文雖然不多

  但評價都滿高的

  只能說ptt上真的神人不少

  各種片都會有人討論有人評價


  我知道這是一部很過癮的片

  但從來沒參加過這種辦在電影院裡的party

  朋友一直慫恿我陪她去

  說可以一邊開pa一邊看經典老片一定會很好玩

  說在國外就看過洛基了 現場氣氛超熱等等(朋友之前在國外打工過)

  但我還是有點怕怕的





  想問大家

  除了這篇的作者很推以外

  大家有沒有參加過類似的活動

  或之前也參加過金馬奇幻影展的版友能給我點建議呀

  怕被雷到…


  先謝謝大家了


  --'
