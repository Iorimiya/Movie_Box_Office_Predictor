title: '[負雷]恐懼幻影(顫慄：五大喪屍)-冷門恐怖短篇集'
content: '大家好

  我是專看恐怖片的LittleDiDi

  我又來跟大家介紹恐怖片了

  今天要介紹的是一部冷門片

  算是一部類似於《鬼四虐》、《鬼亂五》這樣多個導演製作的短篇合集

  看完的感覺就像是在youtube連續看完五個恐怖短篇

  問我有什麼想法嘛

  就是沒有想法


  Blog圖文版會更精彩




  年份：2013


  國別：美國


  類型：懸疑、驚悚


  導演： Eric England(segment "Taste")、Nick Everhart(segment "Smell")、Emily

  Hagins(segment "Touch")、Jesse Holland(segment "Listen")、Miko Hughes(segment

  "See")、Andy Mitton(segment "Listen")


  [劇情簡介]


  以人類五種感官為主題的恐怖短篇合集。



  這部片子在台灣沒有特別的譯名，反倒是對岸另一個別名取得也不錯叫《顫慄：五大喪屍

  》。欸，小弟弟，你是起笑喔，這部片子哪來活屍?沒錯啦，聽我講完，本片的主題是以

  人類的五種感官為主題，「嗅覺」、「視覺」、「觸覺」、「味覺」、「聽覺」，各篇由

  不同的導演與編劇製作，類似與《鬼亂五》那樣的短篇合集。


  忘了說完，所以五大喪屍有「五大喪失」的意思，想當然爾，龍蛇混雜的短篇集，必然有

  佳作也有劣作。


  前些日子在看貴志祐介的《寫出娛樂的力量：貴志祐介教你成為暢銷小說家》的這本書，

  裡頭提到了該如何刺激靈感這件事情，其中他提出了一個很棒的點子，如果你正煩惱著不

  知道該如何下筆，那就天馬行空地想很多的「如果」，那就很豐富了。「如果我今天不吃

  早餐」、「如果我又回到十七歲」、「如果某天一早醒來，我的床上躺著一個無頭屍」、

  「如果我是總統」......諸如此類，運用這些如果直覺地去想後續發展，然後再花點心思

  去篩選一下，這樣就是一篇故事了。


  簡單分享這個心得，就是這部電影也讓我想到，這部電影的五個故事，都好似運用這樣的

  想法，都有個不錯的開頭，只是端看後續發展如何，而我就試著用這樣的方式，去解析各

  篇吧。


  [嗅覺]

  劇情簡介：「如果」某天有一個陌生的大媽衝進你的家裡頭，向你推銷一個銷魂的香水，

  她打包票，你將可以因此而改變人生，但是這個銷魂的香水，切記，後勁可是很強的喔。


  本篇的主角設定是一個魯蛇，除了個人的生活既宅又廢之外，工作也即將不保，想揩妞卻

  又被嫌痴，可憐之人必定有其可恨之處，因為他完全沒有去正視過自己的問題。然而，某

  天，一天清晨衝進一個陌生的大媽向他推銷一個香水，說會有意料想不到的效果，又說沒

  關係，先免費試用，這個時候你該怎麼辦呢?


  站在戲外旁觀者清的角度來說，這個香水並不單純，只是我們的主角設定就是不自覺，噴

  一下路跑經過的小妞就對她拋媚眼，唉唷~不錯喔，再噴第二下，心上人居然接受了他的

  邀約，再噴第三下，不但沒被裁掉還當上主管，這世界怎麼會有這麼好康的事情。食髓知

  味的他當然越噴越兇，生活也越過越愜意，但是很快地他便嚐到了後果。


  這篇的構想還算不錯，也就是說我剛剛提的那個「如果」設想的蠻有意思，只是後期的發

  展比較沒有什麼張力，因為觀眾大概也都知道這個人可能會很慘，比較有趣的點大概就是

  中間有一些惡趣味吧，比如說在裁員面談的途中，長官本來想好好地刮他一頓，結果變成

  說天那，我怎麼居然沒有發現你是個人才，這種跨張的對比。


  至於，大媽的身分與動機，以及主角的下場如何，就留給各位去看吧。


  [視覺]

  劇情簡介：「如果」眼科醫生可以透過高科技儀器竊取你的眼淚，好窺視一個人的隱私，

  那將會發生什麼事情呢?


  我們都知道醫生有保護病人隱私的義務，但是也有不良的醫生私德不好，就像本篇的眼科

  醫生，他能夠透過別人的淚液去了解別人曾經經歷過的事情。每個人的興趣不同，他老兄

  可能覺得這樣很有趣吧，尤其是對於心上人，不過有天他卻發現了心上人遭受到了男朋友

  的欺凌，於是，他故技重施，想好好教訓一下這個無禮的男人。


  這一篇的「如果」也想得不錯，有一些變態獵奇的想法在裡頭，讓觀眾有點覺得眼睛癢癢

  的，對現實生活多少會有一點聯想，只是說這篇題目就比較有點侷限，後期的發展專注在

  醫生會怎麼報復這個暴力男，以及他所遭遇的會是怎樣的視界，只是中間以為斷點的時候

  又來了點突發狀況，稍有點意外性。


  [視覺]

  劇情簡介：一個小孩跟爸媽一起出遊的途中發生嚴重車禍，雖然他並無大礙，但爸媽卻無

  法動彈，他必須要對外求助，這本稀鬆平常，但是「如果」他是眼盲呢?


  個人認為最好看的一篇，也是最有創意的一篇，本篇在一開始就用一個突發狀況讓觀眾陷

  入兩難，發生車禍之後只剩一個兒子能夠走動，若是不對外求救則父母生命垂危，但若讓

  他出外求救，他又是一個瞎子。


  等死嗎?當然不，兒子可不是一個普通的瞎子，當然也不是說他就是李星Q一下就可以飛來

  飛去的，除了視覺，他天生有一種敏銳的感覺，尤其是觸覺，他能夠憑著觸摸立刻感受到

  實際狀況。本篇好看的點就是在這裡，因為觀眾會隨時屏息以待眼盲的兒子出外求援將會

  遇到什麼艱難的地形，更甚者，還安插一個殺人魔，那還能不緊張嗎?


  就是這樣沒有完美的天才，利用機智與優勢巧妙化解危機。


  [味覺]

  劇情簡介：一名駭客受邀到某公司，面試他的美女主管以優渥條件希望能將他納入旗下，

  答應了當然從此平步青雲，但要是「如果」不答應呢?


  大概是本片最無聊的一篇吧，只是對於本片有著象徵性的意義，除了說明第一篇的香水與

  第二篇的淚液萃取機來自於這個公司之外，也表示存在著一間謎一樣的公司。主角基於裡

  頭的人當然是一個突兀的奇點，若真要找緊張的點就是多少會擔心主角會不會被輪姦吧。


  而且，我也看不太出來本篇跟味覺有什麼關係，人肉鹹鹹嗎?


  [聽覺]

  劇情簡介：「如果」這世界存在一首曲子，相傳如神取一般的存在，但是，兩名有心人士

  希望能夠重新取得，他又是為什麼會失傳呢?


  劇情很無聊，就是兩個人紀錄追尋某首俄國人寫個曲子的過程，只是說這個曲子設定有點

  謎，然後又說科學研究聲音會提高人體七十百分比的恐懼感(沒很認真看，意思差不多是

  這樣)。雖然整篇過程看的很無聊，但表現出來的意念卻是本片算最可怕的，因為有很多

  想像空間在裡頭，尤其拍攝手法又是以DV及舊毛片當紀錄片增加寫實感。


  通篇看完，雖然偶有佳作，但還是覺得有些空虛，至於彼此有什麼關聯性的那也都只是刻

  意的操作，並不會有那種很了不起的感覺，好啦，我已經不知道還能多說什麼了，今天就

  這樣，謝謝各位。


  即刻短評(滿分5)


  劇情： 2   >>各篇的發想都小有意思

  結局： 2   >>沒什麼感覺，給個2

  氣氛： 2   >>就是一部小成本製作的短篇

  血腥： 3   >>有些小噁爛的畫面

  推薦： 2   >>就一部很冷門的短篇合集，沒很閒就別刻意找來看了


  --'
