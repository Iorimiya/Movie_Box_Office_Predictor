url: https://www.ptt.cc/bbs/movie/M.1490427379.A.7EF.html
title: '[新聞] 金馬奇幻影展　10大朝聖必看'
content: '新聞網址：



  文 | 項貽斐    部分圖片提供︱金馬執委會


  金馬奇幻影展以創意奇想打出名號，網羅科幻、恐怖、驚悚、歌舞、喜劇、動畫等類

  型影片，成為全台滿座率最高的影展。


  今年影展進入第8屆，從《樂來越愛你》延伸的經典歌舞片、影迷苦等20年的《猜火車

  2》、到日本鬼才宮藤官九郎專題系列，豪華片單齊聚登場。本刊與金馬執委會執行長

  聞天祥聯手劃出10大亮點，讓影迷可以看熱鬧、同時看門道。



  必看理由：攸關台灣政治現狀的情色寓言。


  陳宏一執導的驚悚片《自畫像》是本屆影展開幕片，故事描述2016年台灣總統大選日，

  熱衷社運的女大學生陳屍租屋處，全身赤裸塗滿油彩，她的畫家室友與變性閨密都涉有

  重嫌。但隨案情發展，更引出太陽花學運後台灣社會的困局和年輕人的失落不安。



  必看理由：耿軍簡直就是中國東北的郭利斯馬基（Aki Kaurismaki，以冷幽默見長的芬

  蘭導演）！


  來自黑龍江省的41歲中國導演耿軍，曾在2014年以《錘子鐮刀都休息》獲金馬獎最佳短

  片，《輕鬆+愉快》是他耗時2年多完成的第3部長片，以黑色幽默手法，描述一群人在

  荒廢的東北城鎮裡相愛相害相殘，呈現個人與社會、環境的問題，贏得今年全球最大獨

  立製片日舞影展評審團特別獎。



  必看理由：院線看不到，只好影展求。


  英國導演丹尼鮑伊（Danny Boyle）1996年因將歐文威爾許（Irvine Welsh）小說《猜

  火車》搬上大銀幕成名，描繪年輕人沉迷嗑藥性愛的反社會頹廢生活，並捧紅男星伊

  旺麥奎格（Ewan McGregor）。20年後，丹尼鮑伊再改編威爾許的小說推出《猜火車2》

  ，原班人馬回歸，當年逃往荷蘭的伊旺麥奎格返鄉，希望補償以往的兄弟們，但又掀

  起一場奪命追殺。



  必看理由：可以想像科幻內容發生在國宅和中藥鋪嗎？它做到了！


  日本名導阪本順治的奇幻喜劇《消失的山下先生》，片中一對夫妻因獨子車禍過世，

  決定結束中藥鋪生意，搬到集合住宅。丈夫參選自治會長失敗，遭閒言閒語，乾脆躲

  起來，竟傳出他被太太殺害的謠言，還有媒體來採訪。另外又有神祕男子上門，要求

  在2週內製作5千份中藥，代價是讓夫妻見到死去的兒子。


  笑中帶淚的溫馨奇想之作，飾演太太的藤山直美也以該片獲上海電影節影后。



  必看理由：動作拍得極酷，暴力拍得很孤獨！


  西班牙電影《漫漫憤怒道》是《神秘沼澤》(Marshland)男星勞爾阿雷瓦洛（Raul

  Arvalo）演而優則導的首部電影，故事主角是因犯珠寶搶案服刑8年的男人，出獄後本

  想與所愛的女人展開新生活，卻出現另一個男人，打亂一切。由開始的浪漫，轉入黑

  暗的復仇，懸疑且充滿西班牙式風格的暴力美學。


  影片在西班牙哥雅獎贏得最佳影片、編劇、新導演、男配角4項大獎，女主角露絲狄亞

  茲（Ruth Diaz）也在威尼斯影展地平線單元拿下最佳女演員獎。



  必看理由：氣氛逼人的恐怖片，看完不斷回味腦補。


  挪威新銳導演安德烈奧多（André Øvredal）驚悚新片《驗屍官》，獲多倫多影展「午

  夜瘋狂」單元觀眾票選獎，也在各地奇幻影展頻頻得獎。根據驗屍官老行規，每次驗屍

  會在屍體腳踝綁銅鈴，提防靈異狀況。某次市區發生凶案，屋內人全死光，一對驗屍官

  父子受警方之託調查，解剖其中一具無名女屍，沒想到竟鈴聲大作，一股神祕力量阻止

  他們追查。


  電影靈感來自波蘭斯基（Roman Polanski）《水中之刀》與(Knife in the Water)《反

  撥》(Repulsion)，結合密室逃脫與懸疑推理，還有恐怖古老詛咒傳說。



  必看理由：每部都挑戰瘋狂極限，若只能看1部就挑導演處女作、台灣戲院沒上的《午

  夜駭嗑浪人》(註:此片男主角為長瀨智也)！


  影展「焦點導演」專題將選映日本鬼才宮藤官九郎編導的7部作品，包括他編劇、三池

  崇史執導、生田斗真主演的新作《臥底型警之香港狂騷曲》，還有《GO！大暴走》與

  漫畫改編的《乒乓》，並完整放映他4部導演作品《午夜駭嗑浪人》《少年手指虎》《

  中學生圓山》《地獄哪有那麼HIGH》。




  必看理由：令人讚嘆的英式類型諧仿喜劇！


  連映3場的「血腥冰淇淋三部曲」是英國喜劇鬼才導演艾德格萊特（Edgar Wright）的

  惡搞邪典，分別為《活人甡吃》(Shaun of the Dead)、《終棘警探》(Hot Fuzz)與《

  世芥末日》(The World''s End)，均由近年以《不可能的任務》在好萊塢走紅的英國喜

  劇男星賽門佩格（Simon Pegg）主演，並與尼克佛羅斯特（Nick Frost）搭檔。


  首部曲《活人甡吃》由魯蛇決戰殭屍；二部曲《終棘警探》是中二警察調查小鎮懸疑命

  案；終章《世芥末日》結合英國酒吧文化與外星入侵，《新世紀福爾摩斯》馬丁費里曼

  （Martin Freeman）與「007」皮爾斯布洛斯南（Pierce Brosnan）也來客串。



  必看理由：銀幕情侶糾纏7年，仍讓人關心他們的發展，有夠奇幻！


  從2010年《志明與春嬌》到2012年《春嬌與志明》，香港名導彭浩翔三度攜手楊千嬅、

  余文樂在今年推出《春嬌救志明》，春嬌、志明這對歡喜冤家，由香港赴北京又回到

  香港，兩人兜了一大圈又在一起，但他們的愛情還有新考驗，得面對年齡、結婚、生子

  等問題。


  彭浩翔以他與妻子的相處寫照，剖析現實環境中男女由愛情進入共組家庭的交鋒。此次

  還有秦沛、邵音音等資深實力派演員加入。



  必看理由：今年影片很重口味，一反過去溫馨走向，但通吃藝術影展與奇幻影展。


  驚喜場得賣關子，到場看了才知道。歡迎粉絲來猜一猜，提供「線索」如下：大獎吃到

  飽、血腥又多汁、虐心不虐殺、好膽快進場。



  日期：4月7日至16日

  地點：台北新光影城與in89豪華數位影城

  片數：52部　

  售票：3月26日起開賣


  特別單元：

  1.La La Wonderland：可邊看邊唱《樂來越愛你》，還能在大銀幕朝聖《萬花嬉春》(

  Singin'' in the Rain)、《花都舞影》(An American in Paris)、《柳媚花嬌》(The

  Young Girls of Rochefort)、《紐約紐約》(New York, New York)等影史歌舞經典。


  2.狂歡場：影展成立以來年年秒殺的招牌片《洛基恐怖秀》又來了！現場觀眾可隨劇情

  互動，還有豪華歌舞團熱舞帶動氣氛，想秀、想扮裝的統統可以來。


  3.K歌場：想與《樂來越愛你》萊恩葛斯林、艾瑪史東齊唱〈City of Stars〉？想重溫

  40年前《週末的狂熱》約翰屈伏塔熱舞？影片放映時，歌曲都有英文字


