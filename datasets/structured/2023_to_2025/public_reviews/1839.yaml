url: https://www.ptt.cc/bbs/movie/M.1701453659.A.E32.html
title: '[新聞] 查克史奈德加入漫威MCU?透露想拍幻影殺手'
content: "新聞網址：\n\n原標題:\n\n\nByJONES\n11 月 30, 2023\n\n\n導演查克·史奈德透露了能說服他加入漫威工作室和MCU的一個故事。\n\
  \n\n已知於華納兄弟的DCEU工作以及《正義聯盟》的“史奈德版”而聞名的查克·史奈德透露\n了一個可以說服他成為MCU導演的漫威故事。儘管查克·史奈德的DC電影在很大程度上並\n\
  沒有相同的基調，但顯然有一個來自原始漫威漫畫的故事，查克·史奈德希望將其改編成\n真人現場演出。\n\n\n在執導了《超人：鋼鐵英雄》、《蝙蝠俠對超人：正義曙光》和《正義聯盟》之後，查克\n\
  ·史奈德最初被定位為華納兄弟DCEU的主要創意力量，並計劃了一個涉及DC宇宙英雄對抗\n達克賽德的整個沉穩而激烈的故事。然而，\n史奈德現在正在創建自己的IP，如即將推出的Netflix電\n\
  影《Rebel Moon—第1部：火之女》，但在接受《好萊塢報導》的最近一次採訪中，查克\n·史奈德透露了可能讓他加入MCU的故事：\n\n\n\n\n\n\n\
  考慮到查克·史奈德對法蘭克·米勒的作品的明顯喜愛，例如《蝙蝠俠：黑暗騎士歸來》\n對班·艾佛列克版黑暗騎士的明顯影響，改編米勒與《 夜魔俠》的作品似乎是一個自然\n\
  的選擇。此外，漫威工作室目前正在拍攝《夜魔俠 : 重生》新影集，查理·考克斯將回\n歸麥特·梅鐸的角色，文森·唐諾佛利歐將重返金霸王。\n\n\n在法蘭克·米勒的標誌性《夜魔俠》系列之後，該系列以夜魔俠的愛人艾莉崔的死亡而聞\n\
  名，《 Elektra Lives Again》中馬修·默多克在失去愛人的痛苦中苦苦掙扎，甚至達到\n心理崩潰的地步，質疑他的夢想和現實，關於艾莉崔究竟是活著還是死了。因此，這肯定\n\
  會是一部非常內省且以角色為主的電影，同時也可能相當黑暗，也許可以考慮Netflix的\n《捍衛者聯盟》中艾莉崔的死亡。\n\n\n值得注意的是，據傳二十世紀福斯製作的2000年代初的電影中的珍妮佛·嘉納版艾莉崔可\n\
  能會出現在MCU即將上映的《死侍3》中，這多重宇宙的可能性使得查克·史奈德執導的《\n Elektra Lives Again》電影在《重生》系列和原版艾莉崔可能在不久的將來在MCU中出\n\
  現的情況下有點難以安排。然而，這個想法本身對MCU來說仍然相當引人入勝。\n\n\n--"
