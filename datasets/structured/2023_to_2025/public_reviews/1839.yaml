title: '[情報] 2023 金馬奇幻影展 第三波片單'
content: '金馬奇幻影展嚴選12部佳片 影后潘妮洛普克魯茲、帥氣才子路易卡瑞大展演技

  性別、音樂、浪漫喜劇、懸疑驚悚、B級血腥 各類奇幻元素一次滿足

  可愛狗狗溫暖人心 暴力泰迪熊開戰獨角獸 點讚開啟小鈴鐺看網紅鬼屋直播


  即將於4月7日熱鬧展開的2023金馬奇幻影展，今日（3/8）公布，有可愛狗狗溫暖人心，泰迪熊暴力開戰，屍體

  鬼怪更不缺席，還有影后潘妮洛普克魯茲與文青偶像路易卡瑞加持，絕對能滿足各類影迷

  口味。



  。法國帥氣才子，一邊為母親的第二春傷透腦筋，還與《燃燒女子的畫像》諾耶米梅蘭特陷入

  曖昧關係。


  漫威影集《驚奇少女》。。《左

  派教慾》，除了發洩對討厭鄰

  居的憤怒，也揭發背後的中年焦慮與關係危機。



  本屆金馬奇幻影展掀起一波「毛孩風」，除了先前公布的《貓無赦》讓貓咪變成美艷殺手

  ，，更以泰迪熊與獨角獸的魔法森林戰爭

  ，打造另類「動物恐怖森友會」，揭開駭人異色的童話寓言。



  血漿、屍體與鬼怪通通有的金馬奇幻影展，，在爛番

  茄影評網站更獲得滿分盛讚。





  2023年金馬奇幻影展將於4月7日至16日展開，選片指南將在3月24日於臺北文創大樓14樓

  文創會所舉辦，並於3月26日正式開賣。更多精彩片單與周邊活動訊息將陸續公佈，請鎖

  定金馬官網、臉書粉絲專頁、Instagram，或下載金馬APP，掌握第一手消息。


  －－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－


  ▎《羅馬年少時代》（L''immensità） ▎



  《天堂海灘》義大利名導艾曼紐爾入選威尼斯影展的新作《羅馬年少時代》，講述女兒身

  男兒心的安德莉，在壓抑的青春期只能寄情幻想，才能獲得力量與勇氣，幸好母親溫暖的

  羽翼替他撐起一小片風和日麗，直到突如其來的風暴，打破這個家庭的脆弱平衡。影片邀

  來影后潘妮洛普克魯茲飾演溫柔堅韌的母親，帶著孩子力抗性別及父權桎梏，透過充滿靈

  氣的斑斕攝影捕捉溫潤動人的家庭片羽。



  ▎《愛無罪》（The Innocent） ▎



  法國帥氣才子路易卡瑞自編自導自演的法式浪漫喜劇《愛無罪》，找來《燃燒女子的畫像

  》諾耶米梅蘭特、凱薩獎影帝洛契迪森姆攜手合作。故事講述單純老實的男子還沒走出喪

  妻之痛，六十歲老母就宣布要和剛假釋出獄的大叔再婚，擔心母親被愛情蒙蔽雙眼，他拜

  託亡妻閨密一同調查，沒想到兩人越查越入迷，甚至模糊了彼此的好友關係。



  ▎《雙手的溫柔》（The Blue Caftan） ▎



  摩洛哥導演瑪莉安圖澤尼繼《烘焙幸福路》，新作《雙手的溫柔》讓主角改拿起針線編織

  起動人的生命篇章。一對傳統裁縫店的恩愛夫妻，堅守即將失傳的古老工藝，一名年輕男

  學徒的到來讓他們乍現傳承的曙光，微妙的情思卻也在丈夫心中曖昧滋長。影片以詩意內

  斂的攝影捕捉壓抑愛慾，細膩描繪角色之間超越生死的綿長愛意，多元動人的故事不但擠

  進奧斯卡國際電影短名單，也獲得坎城影展一種注目單元的影評人費比西獎肯定。



  ▎《嘻哈反叛者》（Rebel） ▎



  《布魯塞爾黑街日記》比利時雙導阿迪爾艾爾阿比、畢拉爾法拉，在執導賣座電影《絕地

  戰警FOR LIFE》和漫威影集《驚奇少女》後，《嘻哈反叛者》回歸擅長的移民後裔題材。

  一名富有正義感的饒舌歌手，決定拿起攝影機紀錄戰場，當他意識到自己被錯誤引導，親

  弟卻已被洗腦踏上「聖戰」的征途。影片精彩融合嘻哈、伊斯蘭詩歌及舞蹈，道出敘利亞

  內戰問題，打造氣勢磅礡的混種音樂電影，隨著瘋狂劇情走向令人震驚失聲。



  ▎《卡在車上》（Freestyle） ▎



  濱口龍介有《在車上》，法國導演迪迪埃巴塞羅則讓女主角真的《卡在車上》！工作日以

  繼夜的女子清晨為移車躲警察開單，竟然恐慌發作困在車裡，汽油還耗盡，直到黑夜降臨

  ，一名暴戾青年上車，心有千千結的兩人展開荒謬絕倫的新旅程。影片以公路犯罪混搭心

  靈清創，峰迴路轉的劇情令人眼睛一亮。《巴黎急診中》瑪莉娜佛伊絲與《85年的夏天》

  班傑明瓦贊迸出動人火花，以法式幽默笑罵人生悲涼，既暖心又荒唐。



  ▎《殺鄰居沒事，沒事殺鄰居》（Petite fleur） ▎



  《左派教慾》、《寶琳娜的選擇》阿根廷名導桑迪亞哥米崔，這回黑色喜劇新作《殺鄰居

  沒事，沒事殺鄰居》以惡鄰為題，講述才剛帶妻小搬家就失業的男主角，碰到鄰居頻頻來

  挑釁，一不小心失手砍下去，隔天鄰居竟然再度復活，他開始將花式謀殺當成紓壓解悶的

  私密樂趣。《我想要回家》柏林影帝丹尼爾亨德勒，搭檔《雙面勞倫斯》梅維爾波柏，血

  腥懸疑外衣包裹中年焦慮與關係危機，難以捉摸的敘事節奏與貫徹全片的妖嬈曲調相輔相

  成，令人入迷。



  ▎《幸運狗狗來造訪》（777 Charlie） ▎



  邁向第二人生需要多少勇氣？印度導演基蘭拉吉的首部劇情長片《幸運狗狗來造訪》告訴

  你，一隻狗狗就能搞定！一場意外，讓逃出養殖場的拉布拉多遇見厭世的單身工人，當他

  們逐漸培養出深厚感情，相伴時間卻過得太快，一人一狗決定踏上心靈之旅，壯遊奇景交

  換真心，解放過去奮力前進，成為改變彼此生命的契機。



  ▎《熊霸天下》（Unicorn Wars） ▎



  西班牙動畫名導亞伯托瓦奎茲剛贏得西班牙哥雅獎最佳動畫好評如潮的《熊霸天下》，揭

  開泰迪熊與獨角獸之間的世代戰爭。一群熊熊新兵被派往魔法森林執行危險任務，沒想到

  突來的殺戮讓一切變調。彷彿提姆波頓碰上《現代啟示錄》，以糖果般地色彩繪出駭人異

  色童話，粉紅龐克搖滾出宗教政治瘋魔預言，宛如另類「動物恐怖森友會」，吸睛狂想也

  吸引國際各大影展爭相邀約。



  ▎《衝殺小天使》（Mad Heidi） ▎



  誓言拍出瑞士剝削電影的瑞士導演約翰尼斯哈特曼、桑德羅克洛普斯坦，首部劇情長片《

  衝殺小天使》直接拿經典兒童文學《小天使》開刀。影片描述另個平行時空的世界，人間

  淨土的瑞士在獨裁者統治下成為專制軍國，更以「乳色恐怖」迫害乳糖不耐症患者，少女

  海蒂忍無可忍決定挺身而出，要將人民從乳酪惡夢中解放出來！宛若《真善美》的場景，

  展現《追殺比爾》的鬥狠橋段，地獄哏笑料連綿不絕，《星艦戰將》男星卡斯柏范迪恩出

  演鐵腕元首，更為本片畫龍點睛。



  ▎《SISU：黃金硬漢》（Sisu） ▎



  芬蘭奇幻名導賈馬里赫蘭德繼顛覆聖誕童話《聖誕壞樂》，新作《SISU：黃金硬漢》更把

  芬蘭象徵勇敢堅韌的「Sisu」精神化為真實角色。一名打算隱世淘金以度餘生的男子，卻

  在半路遇上納粹軍團對黃金的覬覦，只見對方槍砲、地雷各種攻擊手段渾身解術，他卻老

  神在在，以令人瞠目結舌的斬殺手法讓敵人粉身碎骨。影片打造出純金般的超級爽片，不

  僅一舉奪得西班牙Sitges奇幻影展最佳影片、演員、攝影、原創音樂等四項大獎，在爛番

  茄影評網站更獲得滿分盛讚。



  ▎《屍發現場》（I Am the Abyss） ▎



  身兼暢銷作家的義大利導演多納托卡瑞西，繼《霧中的女孩》和《謎宮》再度親自改編執

  導驚悚燒腦新作《屍發現場》，一條五指塗滿血紅蔻丹的湖中斷臂，竟串連起屍體、女偵

  探與清潔工，三位謎樣人物背後的不可告人祕密。電影以強烈的影像風格，刻畫暗黑靈魂

  ，彼此牽制交錯，創作出非典型的偵探犯罪電影，一窺邪惡的源頭。



  ▎《嚇死油土伯》（Deadstream） ▎



  美國導演喬瑟夫溫特與妻子凡妮莎，攜手推出讓人「驚聲尖笑」的偽實境恐怖喜劇《嚇死

  油土伯》，以當今網路直播亂象為題，講述專以各種白痴挑戰來衝刺影片觀看數的網紅尚

  恩，決定趁著萬聖節前往美國最可怕的鬼屋，準備徹夜直播衝流量，沒想到一名自稱粉絲

  的神祕女子突然出現，還熱情表示要陪他完成挑戰。影片巧妙融合經典恐怖元素，以直播

  鏡頭架構出驚悚的鬼屋幻境，挑逗觀眾每一吋敏感神經，一舉奪得西班牙Sitges奇幻影展

  觀眾票選獎。


  --'
