title: '[評論] 聞天祥談 / 金馬奇幻影展十週年'
content: "【聞天祥專欄】「K歌場、跨夜場、驚喜場算什麼！連冷場電影都能玩？」\n金馬奇幻影展的 10 年瘋狂創意之路\n\n\n\n--\n\n你今年也參與金馬奇幻影展的搶票大賽嗎？在這裡看過幾次《洛基恐怖秀》？\n\
  每年此刻最讓你期待的又是哪些特別「場次」？\n為什麼大家一想到金馬奇幻影展就會格外興奮呢？\n\n--\n\n「金馬奇幻影展」要滿 10 歲了！\n\n當年原本只想藉此多留一些人才下來，\n\
  然後在歷史悠久的「金馬國際影展」之外多做一個活動，加上要做就做沒嘗試過的，\n而催生出這個沒有任何公部門補助的奇幻影展，靠著創意與觀眾支持，一路茁壯到現在。\n\
  \n它是台灣唯一有「定目片」（編註：在固定地點具歷時性演出的特定電影）的影展。\n籌辦之初，我堅持要有 cult 片之王《洛基恐怖秀》，\n然而是年輕同仁說服我不僅要放片，還要讓觀眾「參與」。\n\
  \n\n\n》玩出新創意\n\n台灣影迷沒見識過沒關係，\n工作人員加親朋好友「下海」帶動，另成一番國外也沒有的風景。\n熱鬧所及，有人在此出櫃，有人在這求婚，外國影展同行也來取經。\n\
  這個獨一無二的「狂歡場」，年年秒殺，盛況不減。\n\n2011 年我去奧斯卡頒獎典禮，順道去了舊金山，\n發現當地戲院定期推出讓觀眾跟電影一塊高聲合唱的影片，\n\
  而有了在奇幻舉辦「K 歌場」的念頭。\n別怕記不住歌詞、趕不上拍子，影展會特製隨節奏變色的歌詞字幕，\n讓戲院化身超大 KTV 包廂。\n\n今年除了觀眾票選回鍋的《樂來樂愛你》、《梁山伯與祝英台》，\n\
  還新加入甫獲奧斯卡四項大獎的《波希米亞狂想曲》，保證讓你看（唱）到聲嘶力竭。\n\n影響所及，現在也有同好與社團自己辦《洛基恐怖秀》，片商也開始嘗試「K歌場」了！\n\
  \n金馬奇幻的「驚喜場」（Surprise Film）也很好玩，\n觀眾買了票卻不知道自己會看到什麼片？\n當然，我們得保證它既是台灣從未放映過的新片，\n也寄望所有觀眾看完後都帶著驚喜與滿足的表情出場。\n\
  \n體力好的可以挑戰「跨夜場」，從午夜看到天亮。入場時先奉上一瓶咖啡幫你「提神」，\n若要自備枕頭、棉被也歡迎。今年不僅有《異形系列》一至四集整夜連映，\n更特別的是\
  \ John Carpenter 的「啟示錄三部曲」：《突變第三型》、《沉睡百萬年》、\n《戰慄黑洞》也可以一口氣看完。\n\n這位從來沒被奧斯卡提名過任何獎項卻深受各大名導推崇的影壇老將，\n\
  連電影配樂都被搖滾天團 U2 拿來致敬。你沒看錯，約翰卡本特雖然跟「木匠兄妹」\n（The Carpenters）無關，但除了編導，他還很有音樂才華，自己電影自己配樂，厲害吧！\n\
  \n\n》越鬧越有趣\n\n金馬奇幻影展點子很多，跟觀眾也互動得很樂。\n有鑑於滿場率高，從第三屆（2012）開始，只要賣完的場次，\n就在開演前和現場觀眾做「滿場慶」活動，好玩兼送禮，感謝支持。\n\
  更妙的是從 2015 年開始，還會找出預售成績最差的場次做「冷場慶」，\n所有看這場的觀眾，通通有獎，勉勵大家「眼光獨到」。\n\n這種幽默，看似自嘲，其實更是自信。因為連最「冷」的場次都很「熱」啊！\n\
  慶祝 10 週年，金馬奇幻要更瘋狂地推出「場場慶」，怎麼慶？敬請期待。\n\n雖然奇幻影展也可以看到像《爛情詩》、《愛在時光倒轉時》這種讓文青趨之若鶩，\n或是《幸福的拉札洛》、《藍色比爾街的沉默》、《爸媽死了，我卻不想哭》等\n\
  拿獎拿到手軟，甚至重新修復的經典《亂世佳人》、《我愛紅娘》，\n但還有更多涵蓋科幻、恐怖、驚悚、歌舞、喜劇、動畫、愛情，\n帶領影迷敞開心房、拓展另類視野、探索想像極限的奇片。\n\
  \n今年的開幕片將會是曾入圍金馬獎最佳新導演的李中\n諷刺靠房地產發財卻攪和進屍體的黑色喜劇《大體臨門》。\n\n突破尺度的驚悚懸疑國片《緝魔》也將舉行世界首映。還有什麼寶好挖？\n\
  不妨親自來探探，也許你會發現原來影展可以這樣辦，電影可以這樣看，好好玩的。\n\n--\n\n原文結束。\n\n--\n\n題外話：\n\nPO 這篇的時候好難過，因為我影展期間不在台灣，沒辦法參與\
  \ QQ\n\n--\n   \n   ◥\n  \n \n  \n￣￣￣￣\n\n--"
