title: '[情報] 2022 金馬奇幻影展 第四、五波片單'
content: '《臥底型警FINAL》（The Mole Song: Undercover Agent Reiji - FINAL）



  三池崇史執導、宮藤官九郎編劇、生田斗真主演的「臥底刑警系列」來到最終章《臥底型

  警FINAL》，生田斗真飾演的臥底刑警這次和黑幫首領來到義大利，本想將他們一網打盡

  ，卻讓對方漸起疑心，另一頭女友因自己衝動好色決定離去，內外夾攻、天人交戰，這回

  他該怎麼辦？原班人馬再度齊聚，老皮嫩肉全都露，荒謬超瞎劇情全上桌，飛天遁地、赴

  湯蹈火不夠看，百獸之王、海中巨怪全登場，完美呈現「不瘋魔，不成活」的金牌臥底下

  流人生。



  《聖地X》（The Cursed Sanctuary X）



  日本奇幻導演入江悠找來岡田將生搭檔人氣女星川口春奈的《聖地X》，以《銀翼殺手》

  原著小說〈機器人會夢見電子羊嗎？〉為靈感，講述一對日本兄妹在韓國遇見理應在日本

  的恍神妹夫，深感案情不單純的哥哥向公司求證，沒想到對方回覆妹夫正乖乖在東京上班

  ，那眼前的這個人究竟是誰？影片大膽挑戰類型的想像力，嘗試滿足各路觀眾的期待，並

  在科幻的設定背後，暗藏人生哲理，亮眼卡司乘以超狂劇情，堪稱日本年度奇幻鉅製。



  《尋人啟弒》（Missing）



  《尋人啟弒》是《海角上的兄妹》日本新銳導演片山慎三再探人性道德爭議之作。一名女

  孩四處找尋離家的父親，竟發現一名模樣神似連環殺手的年輕男子頂替了父親之名，她決

  定從這名男子身上取得父親蹤跡。影片從尋父、尋兇到尋死，既成功捕捉父女間親密的生

  活氣息，也在調性突轉的猛烈暴力中深藏社會批判。實力派演員佐藤二朗一改搞笑形象，

  細膩詮釋複雜糾結的父親心境；新生代演員清水尋也，看似無害卻又冷血殘酷的演出，令

  人不寒而慄。



  《決戰星期天》（The Sunday Runoff）



  《聽說助教崩潰了》日本導演坂下雄一郎耗時五年採集素材，笑鬧嘲諷日本政壇的《決戰

  星期天》，邀來影后宮澤理惠飾演代父出征選舉的議員之女，卻頻頻暴走失言，大小姐脾

  氣令人吃不消，也讓飾演資深幕僚的窪田正孝與助理赤楚衛二傷透腦筋。影片揭開民主殿

  堂莊重外表背後，荒謬又無奈的沉痾困境，不僅是今日政治的照妖鏡，更是當代社會的哈

  哈鏡，既為日本政治喜劇增添逗趣新意，台灣觀眾看了也心有戚戚。



  《海岬的迷途之家》（The House of the Lost on the Cape）



  日本動畫名導川面真也將名作家柏葉幸子奇幻小說搬上大銀幕的《海岬的迷途之家》，故

  事講述無家可歸的少女與失聲女孩，在311東日本大震災後相遇，兩人在一名神祕奶奶的

  邀請下，前往海岬上的古屋生活，古屋老舊卻舒適，卻也暗藏著祕密。宛如日本版《魔法

  阿媽》，神祕奶奶與河童等一票神怪聯手對抗魔神仔。蘆田愛菜、大竹忍獻聲配音，搭配

  人氣樂團「羊文學」陽光溫柔的主題曲與水彩般筆觸影像，暖心又可愛。





  《名偵探柯南：引爆摩天樓》



  《名偵探柯南》首部劇場版動畫《名偵探柯南：引爆摩天樓》（1997），小蘭帶柯南參加

  名建築師邀約的午茶派對，柯南卻接到挑戰電話，炸彈四散在米花市各處，只能靠電話中

  的線索，推理化解危機。看似無關的事件層疊串連，豪華爆破加碼經典炸彈剪線，直到最

  後一刻都扣人心弦。柯南與小蘭在廢墟中相隔一門的真情告白，兩人命懸紅線的究極抉擇

  ，是支持青梅竹馬配對不可錯過的名場面。



  《名偵探柯南：世紀末的魔術師》



  千禧年前最後一部名偵探柯南劇場版《名偵探柯南：世紀末的魔術師》（1999），由怪盜

  基德發出作案預告展開，警視廳特請毛利小五郎一同辦案，跟著柯南探查地下密室，揭開

  俄國王朝歷史秘辛，結合暗語、密碼、解鎖等本格推理元素，複合兇案、探險、飛車甚至

  鴿子魔術，還有灰原、平次、和葉首度參戰大銀幕，小蘭也終於開始懷疑起柯南的真面目

  。



  《名偵探柯南：瞳孔中的暗殺者》



  《名偵探柯南：瞳孔中的暗殺者》（2000）首度以小蘭為中心，舊地開展全新故事線。小

  蘭目睹佐藤警官遇襲，驚嚇昏迷，醒來後卻失去記憶，只對新一的名字感到熟悉，喚醒記

  憶途中，卻也召來殺機。這次毛利一家全員到齊，少年偵探團出師得利，還有柯南神乎其

  技，腳踏滑板飛天遁地，自駕汽艇甩尾破浪，穿梭在回憶的遊樂場，與小蘭攜手共赴最浪

  漫的逃亡。



  《名偵探柯南 EPISODE "ONE" 變小的名偵探》



  紀念電視動畫開播二十週年的《名偵探柯南 EPISODE "ONE" 變小的名偵探》（2016），

  由原作青山剛昌全面監修，帶觀眾重返故事源頭，看智慧過人的高中生偵探工藤新一，如

  何「被」變身成小學生江戶川柯南，以及科學家雪莉、黑暗組織的琴酒與伏特加，多重命

  運即將交會，眾人的未來就此改變。老動漫迷重新回味，新加入更樂趣加倍，補足因果時

  間差，事件細節再擴張，角色動機全解答，真正的第一話就此登場！





  《洛基恐怖秀》（The Rocky Horror Picture Show, 1975）



  創下影史最長上映紀錄的《洛基恐怖秀》（1975），連演47年還不過癮，年年榮登金馬奇

  幻影展秒殺王！今次第十二度上演，不論你是老影迷新觀眾，錯過金害、看到金High！提

  姆柯瑞無人能敵的扮裝皇后法蘭克博士放浪演出、「阿珍」蘇珊莎蘭登風騷登台，放開心

  、敞開胸，跟著銀幕一起扭腰搖擺、解放肢體、釋放靈魂，豪華美豔歌舞團帶你展開一場

  超越禁忌的奇幻之旅。



  《萬花嬉春》（Singin'' in the Rain, 1952）



  美國電影學會百年百大歌舞電影第一名、提及歌舞片絕對是頭號經典的《萬花嬉春》（

  1952），影片由唱作俱佳、演而優則導的金凱利與史丹利杜寧聯手打造，以好萊塢片廠為

  主題，融合歌舞與喜劇元素。與金凱利在鏡頭前分庭抗禮的唐納奧康諾，則以彈簧般的舞

  技和喜感在金球獎封王，女星黛比雷諾當年更以新秀之姿躍為五○年代的美國甜心。除了

  「雨中曲」影史經典歌舞場景大銀幕上重現，優美愉快的旋律搭配熱情洋溢的歌舞畫面，

  不容錯過。



  《真善美》（The Sound of Music, 1965）



  《西城故事》名導勞勃懷斯另一部台灣觀眾耳熟能詳的影史經典《真善美》（1965），茱

  莉安德魯絲黃鶯出谷的歌喉與精湛演技，完全體現劇中實習修女善良活潑的性格，與童星

  們難以挑剔的和諧演出，加上勞勃懷斯壯麗的取景與排場，也讓本片成為影史首部賣座超

  越《亂世佳人》的電影。而多首膾炙人口的名曲，也是《真善美》歷久不衰的主因，原聲

  帶當年雄踞排行榜長達233週，與電影票房相互輝映。今年也歡迎全家大小到金馬奇幻影

  展，一起跟著電影引吭高歌。


  －－－－－－






  《少年吔，安啦！》（Dust of Angels, 1992）



  徐小明執導、侯孝賢監製的台灣黑幫電影經典《少年吔，安啦！》，這回將以4K修復版本

  在金馬奇幻影展世界首映。劇情講述北港囡仔小剛（譚至剛飾）和死黨阿國（顏正國飾）

  ，兩人追隨自台北歸來的捷哥踏上尋仇之路，親身經歷一場江湖血海的震撼教育，卻也將

  他們推向幫派惡鬥的宿命結局。影片一反當時港式黑幫片的英雄色彩，冷眼窺視社會裡盤

  根錯節的城鄉落差、毒品氾濫及黑金政治。彼時尚未成名的伍佰（吳俊霖）與林強、

  BABOO樂團、羅大佑等音樂人攜手製作的電影原聲帶，也成為傳世名盤。



  《永生號》（Transmigration）



  《寒蟬效應》導演王維明的科幻寓言極短篇《永生號》，邀來金馬影帝張震領銜主演，音

  樂創作人羅大佑撥弄琴弦，以耳熟能詳的民謠串連影像，描述一名男子從深幽宇宙的漫長

  漂流中甦醒，重返經歷疫情、汙染、戰爭等肆虐的地球，旋律從一張黑膠唱片傾流而出，

  喚起他年少的回憶。影片將羅大佑經典歌曲重新演繹，放克、流行、浪漫抒情，醇厚嗓音

  暢遊時代記憶。心上人也許會把彼此忘記，但熟悉的旋律依然會在腦海響起，成為生命永

  遠的安可曲。



  《愛的混混：第1-3集》



  《愛的混混：第1-3集》是瞿友寧導演與《搖滾樂殺人事件》導演游智煒，攜手打造全新

  台灣靈異刑偵喜劇影集。一名身兼公廟宮主的熱心里長，黃昏時刻容易撞鬼腳軟，當社區

  出現的失蹤案越來越撲朔迷離，他只好求助陰間好兄弟，問問人到底是去了哪裡？林哲熹

  、嚴正嵐、鄭人碩、王彩樺、許傑輝、林暉閔、邵奕玫、蔡嘉茵、陳大天，一票吸睛卡司

  齊聚。金馬奇幻影展將搶先放映三集，邀請影迷一起來解鎖驚喜，請好兄弟指點迷津。



  《蓋世怪胎》（Freaks Out）



  義大利新銳導演蓋布瑞爾曼尼提，入選威尼斯影展正式競賽的《蓋世怪胎》，故事以馬戲

  團的奇人異事展開，二戰卻讓這些有著超能力的「怪胎」趟上未知旅途，只要內心的信念

  足夠，怪胎也能是英雄。影片揉合歷史奇想及冒險成長，交雜復古情調與現代文明，夢境

  穿越還撿到手機。精采再寫超能電影，讓綠野仙蹤對抗納粹帝國，《水漾的女人》德國男

  星法蘭茲羅戈斯基一改銀幕癡情形象，化身能預知未來的反派角色，展現不同的演技樣貌

  。



  《愛的怪物論》（Monstrous）



  《去死吧！啦啦隊》美國導演克里斯席維森重返金馬奇幻影展的新作《愛的怪物論》，邀

  來《阿達一族》超酷女孩「星期三」克莉絲汀蕾琪領銜主演，當年鬼靈精怪的少女成了飽

  受風霜的單親媽媽，帶著兒子遠赴邊陲小鎮重新開始，原以為新生活就要展開，沒想到這

  次不僅要面對自己的心魔，還要挺身抵抗真正的「怪物」。影片巧妙致敬《迷魂記》與《

  剃刀邊緣》，更被美國影評譽為對怪物類型電影做出全新的演繹。



  《山謬的異色之旅》（Samuel''s Travels）



  國際奇幻影展常客的亞美尼亞導演艾克卡拉佩蒂安，新作《山謬的異色之旅》帶來獨樹一

  格的異色成人童話。高挑俊俏的山謬在東歐鄉間千里尋父，不小心撞上路邊的豬仔，幸好

  神祕女主人不計較，不僅招待熱食，還提供溫暖床鋪，沒想到如此悉心餵養呵護，竟是為

  了將他扣上枷鎖。導演不僅融合犯罪類型與喜劇元素，顛覆權力性別的刻板印象，還請來

  一票充滿靈性的「豬隊友」，與現代落難王子於險境中相濡以沫。



  《急急復雞雞》（POPRAN）



  《一屍到底》導演上田慎一郎的異色新作《急急復雞雞》，將出道前構思的劇本搬上大銀

  幕。故事以都市傳奇為基底，腦洞大開放飛奇想，事業蒸蒸日上的漫畫App老闆，一夜春

  宵醒來後發現下體失蹤，抬頭望上天空，眾人議論的不明飛行物體樣貌竟如此熟悉！影片

  猛打得意忘形的嘴臉，荒謬絕倫笑到臉疼，當青春和小鳥都一去不回來，成功人士的自尊

  又該往哪裡擺？想在迷途中找回自己，初心和雞雞都不可隨便拋棄。



  《我的人生不同步》（Out of Sync）



  西班牙新銳導演胡安侯希梅內茲的《我的人生不同步》，從電影製作中提煉奇想的，把「

  音畫不同步」的影像問題，出現在聲音設計師的現實世界裡，當不可逆的線性時間被聲音

  元素一分為二，究竟是突如其來的大腦異常反應，或是給工作狂正視生活中的哀傷，重啟

  人生的機會？西班牙當紅女星瑪爾塔涅托獨挑大樑，原創十足的設定雜揉奇幻及驚悚元素

  ，席捲各大奇幻影展，也贏得西班牙哥雅獎最佳音效大獎。



  《血色詩篇》（Killing the eunuch KHAN）



  新銳導演阿貝斯特堪稱再創伊朗電影新高度的《血色詩篇》，以不可思議的奇觀鏡頭描繪

  悲劇戰火，當無情炸彈墜落，無辜宅院成了《鬼店》，鮮血拾階而下，彷彿自帶生命。電

  影透過實驗顛覆的驚人技法，一鏡到底從近身跟拍到凌空俯視，血色蔓延牆面、樓梯、門

  階的震撼，宛如庫柏力克電影詭異壓迫，展現戰爭下，屠戮者與受害者同樣陷入的暴力迴

  圈。



  《烈殺令》（Saloum）



  以國際影壇好評如潮的《烈殺令》獲得奧斯汀奇幻影展新浪潮最佳導演的尚盧埃布洛，不

  讓歐美亞洲電影專美於前，矢志拍出非洲最在地的超自然英雄電影。傳奇三人傭兵「鬣狗

  幫」受僱深入西非戰地，不費吹灰之力救出了跨國毒販，回程時意外迫降在孤立小村，卻

  發現這片古老土地上，看似無害的村民並不單純。影片將動作、懸疑、恐怖元素玩轉自如

  ，融合遠古神話、巫術信仰和血腥歷史。澎湃奔放的非洲音樂，將觀眾帶入純粹、迷幻又

  令人亢奮的世界。



  《餘命十年》（The Last Ten Years）



  《新聞記者》日本名導藤井道人改編同名暢銷小說的《餘命十年》，集結小松菜奈搭檔坂

  口健太郎傾情演出，搖滾樂團RADWIMPS深情配樂。只剩十年壽命的絕症女孩，決定冰封情

  感、麻木度日，沒想到一次同學會遇見兒時那位家鄉男孩，兩人的心接泛起漣漪，一場感

  人虐戀就此展開。影片耗時一年拍攝，細膩捕捉輪轉的四季，敘說生命之重，也捕捉永恆

  的一瞬。



  《真愛超能力 》（Superheroes）



  《完美陌生人》義大利導演保羅傑諾維西睽違四年的新作《真愛超能力 》，這回將召喚

  出愛情的魔力。當率性難搞的漫畫家安娜遇上物理學教授馬可，性格迥異的兩人彷彿遊走

  平行時空，愛情卻從一個雨夜邂逅展開。導演以獨特的非線性敘事，對比戀人在不同歲月

  與樣貌裡，面對難解的情感課題。《甜蜜天堂》的潔絲敏婷卡與《切膚之痛》的亞歷山德

  羅伯爾吉，兩大影帝影后夢幻連線，期待一起白頭，愛比歲月長久。



  《不看鐵達尼號的男人》（The Blind Man Who Did Not Want to See Titanic）



  曾以黑色喜劇《我的寵物殺手》代表芬蘭角逐奧斯卡的新銳導演泰穆尼基，新作《不看鐵

  達尼號的男人》描繪一名熱愛電影但拒看《鐵達尼號》的男子，疾病讓他雙目失明、不良

  於行，當他決定隻身探望女性知己，再一般的路程，對他來說卻是千山萬水險路。 融合

  驚悚元素，勾勒多重身障男子為愛出走的「英雄旅程」。透過風格化攝影虛化背景，仿擬

  片中人的主觀視界。視障演員佩特里波科萊寧的感人演繹，讓首度主演電影的他囊括兩座

  影帝獎項。



  《男人與雲》（The Cloud & the Man）



  人有可能愛上雲嗎？印度導演阿比南丹班納吉首部劇情長片《男人與雲》講述的就是這段

  非一般愛情。人生彷彿黑白的男子，竟飄來一朵雲，為他溫柔遮蔭，雲兒不管人間凡俗，

  它緊緊跟隨這個男人，時而像悲憫的天使，時而像鬧脾氣的情人，它是調皮的跟屁蟲，也

  是耐心的傾聽者；而男子他愛上了這片雲。幾米繪本般的童趣想像力，為孤獨靈魂打造詼

  諧浪漫的心靈出口。


  －－－－－－


  今年的手冊電子版也已經可以下載了





  --


  --'
