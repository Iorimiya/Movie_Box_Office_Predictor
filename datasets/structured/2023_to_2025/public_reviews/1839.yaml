title: '[情報] 2024 金馬奇幻影展 第二波片單'
content: "金馬奇幻影展「當代奇幻」與「東瀛狂想」招牌單元網羅11部東西方佳作\n凱特布蘭琪、蒂妲絲雲頓、沙魯克罕、綾瀨遙、永山瑛太 偶像巨星拼演技\n奇幻秒殺片《超越無限兩分鐘》續作《無限泡湯兩分鐘》幽默再升級\n\
  \n即將於4月12日熱鬧展開的2024金馬奇幻影展，，以及影后凱特布蘭琪\n、蒂妲絲雲頓、寶萊塢之王沙魯克罕和綾瀨遙、永山瑛太等偶像巨星加持，吸睛演出更具\n\
  看頭。此外，影展也攜手長榮航空推出「長榮航空日本不限航點經濟艙來回機票」抽獎活\n動，預售票滿額1880元，就可參加抽獎，若滿額中內含「東瀛狂想」單元票券，還可加碼\n\
  多抽一次。\n\n\n。喜劇節目，則邀來英國巨星蒂妲絲雲\n頓成為特立獨行的藝術慣老闆，和天馬行空的移民設計師牽起「怪美」情誼。《幸福的拉\n札洛》\n\n還有兩部以平行宇宙入題，卻各異其趣的燒腦佳作。，當隱居密林的夫妻在詭異樹林間找到失而復得的\n\
  兒子，才驚覺竟有意想不到的人在身邊，心理驚悚指數堪比《彗星來的那一夜》。，物理學家在學術盛會上遇見\n無所不知的神祕女子，展開跨越時空的奇遇，以希區考克與大衛林區的驚悚神韻，搬演一\n\
  齣黑白復古影像的《闇》。\n\n，把平凡的同志戀情化做劇本大綱，讓真實人生踏上英雄旅程，也模糊真實和戲\n劇創作的界線。《三個傻瓜》\n\n\n備受影迷期待的「東瀛狂想」單元，，她誓言不再奪命卻被迫重出江\n\
  湖，一場腥風血雨的戰鬥即將展開。，誇張又生動的\n精彩演技，令人笑到流淚。\n\n，描述小鎮保安與惡魔王子等夥伴，前往尋找傳說的夢幻之泉，帶領觀眾一\n同踏上熱血青春的冒險旅程。，京都百年旅館裡不斷重複的兩分\n\
  鐘，讓住客與員工試圖循線破解逃出生天，憑著精密計算和天衣無縫的默契，也讓本片在\n日本TAMA電影獎贏得頒發給劇組全體工作人員的特別獎。\n\n\n今年金馬奇幻影展再次攜手長榮航空，於影展期間推出「長榮航空日本不限航點經濟艙來\n\
  回機票」抽獎活動。凡購買2024金馬奇幻影展預售票滿額1880元起，就可以參加抽獎活動\n；若滿額中內含「東瀛狂想」單元票券，還可加碼多抽一次！更多獲得機票辦法可參閱官\n\
  網相關活動資訊。\n\n2024年金馬奇幻影展將於4月12日至21日展開，選片指南將在3月26日舉辦，並於3月31日\n正式開賣。更多精彩片單與周邊活動訊息將陸續公佈，請鎖定金馬官網、臉書粉絲專頁、\n\
  Instagram，或下載金馬APP，掌握第一手消息。\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n\n\n\n▎《神的孩子不再跳舞》（The\
  \ New Boy） ▎\n\n\n首部長片便贏得坎城影展金攝影獎的澳洲導演沃里克桑頓，自編自導的《神的孩子不再跳\n舞》邀來奧斯卡影后凱特布蘭琪重返澳洲影壇，飾演1940年代戰時澳洲的修女，收留睡不\n\
  慣床鋪、不說文明語言，卻對萬物充滿靈性的原住民男孩，直到她發現男孩掌心發光的祕\n密。絕美荒蕪影像結合搖滾詩人尼克凱夫與華倫艾利聯手打造的配樂，情緒豐沛且充滿感\n\
  染力，成功將未知與神祕轉換成深刻視覺感受。透過畫面也彷彿向基督教文明提出質疑，\n信仰是否只能有一種途徑？\n\n▎《大麻煩家》（Problemista） ▎\n\
  \n\n美國喜劇節目《週六夜現場》編劇奇才胡利歐托雷斯首部執導作品《大麻煩家》，花俏魔\n改半自傳故事，描述從薩爾瓦多來到紐約打拚的玩具設計師，卻遇到簽證即將到期的遣返\n\
  危機，走投無路下，只好答應古怪藝術圈大媽的展覽聘用，面對老闆的無知發言和無理要\n求，他否能熬出一片天？影片將拉美移民的北漂困境拍成奇幻人生旅程，幽默諷刺美國移\n\
  民機制之餘，真摯誠懇的成長心路與怪美情誼與也令人驚喜動容。蒂妲絲雲頓化身超狂造\n型的藝壇慣老闆，嘻哈天團「武當幫」RZA與《之前的我們》葛莉塔李亦跨刀參演，為影\n\
  片畫龍點睛。\n\n▎《盜墓奇美拉》（La Chimera） ▎\n\n\n《蜂蜜之夏》、《幸福的拉札洛》義大利名導艾莉絲羅爾瓦雀，新作《盜墓奇美拉》集結\n\
  《王冠》英國實力派男星喬許奧康納、親姊艾芭羅爾瓦雀和影后伊莎貝拉羅塞里尼攜手。\n影片描述一名來到義大利鄉村的神祕英國男子，他透過不尋常的能力，幫盜墓小賊找到埋\n\
  藏地下的財富，別人要的是競價變賣，他尋找的卻是死亡之外的東西。全片混合使用十六\n及三十五毫米膠捲拍攝，流暢切換的影像，也巧妙勾勒出主角徘徊於兩個世界之間，宛如\n\
  夢囈的真實，彷彿繼承費里尼電影的詩意氣息。\n\n▎《弒外桃源》（Superposition） ▎\n\n\n丹麥女導演卡洛琳林比驚豔影壇的燒腦首作《弒外桃源》，大展身手巧玩平行宇宙。故事\n\
  講述一對情感不睦的夫妻，決定前往密林隱居，卻在詭異林間找到失而復得的兒子，當日\n常開始失控，重複的郵件、神祕的來電，他們才驚覺以為杳無人跡的地方，還有其他人生\n\
  活在此。全片瀰漫北歐獨具的清冷色調，精心剪裁的對稱構圖、似有若無的真假提問，巧\n佈人物關係暗喻。細節埋設謎團重重，心理驚悚指數堪比《彗星來的那一夜》。\n\n\
  ▎《愛的時空效應》（The Universal Theory） ▎\n\n\n德國導演提姆克格入選威尼斯影展正式競賽的《愛的時空效應》，大玩影像敘事，故事由\n\
  一場在瑞士阿爾卑斯山舉辦的物理學盛會展開，苦心專研曠世學說的博士，邂逅謎一般的\n女子，她竟對他無所不知；詭雲當空、怪事頻傳，平行宇宙奇遇即將一發不可收拾。影片\n\
  從復古黑白攝影、配樂到剪輯，維妙維肖仿擬經典老片。黑色電影風格混搭山林冒險類型\n，再疊加法國新浪潮，重現希區考克與大衛林區的驚悚神韻，搬演一齣阿爾卑斯山腳下的\n\
  《闇》。\n\n▎《夏日，海灘，我的G本》（The Summer With Carmen） ▎\n\n\n希臘導演柴克里亞斯馬伏羅迪伊斯入選威尼斯影展的《夏日，海灘，我的G本》，以電影\n\
  創作為靈感，講述夏日海灘上，一名男子正因電影劇本煩惱不已，同志好友提議以自己的\n新戀情為題，第一幕就此展開，劇本在言談間快速成型；可電影不是紙上談兵，碰上預算\n\
  總得妥協刪戲，再添幾顆養眼的鏡頭，當真實人生走成英雄旅程，故事的終點說服觀眾，\n還是忠於自我渴望？影片以劇中劇形式，將同志們的情感日常玩出後設趣味，模糊真實人\n\
  生和戲劇創作的界線。透過劇本發想、預算限制與投資期待的角度，幽默道盡電影創作的\n限制與框架。\n\n▎《沙魯克罕之勇闖英倫》（Dunki） ▎\n\n\n《三個傻瓜》印度億萬票房名導拉吉庫瑪希拉尼，這回新作《沙魯克罕之勇闖英倫》邀來\n\
  寶萊塢之王沙魯克罕，率領一群對異國懷抱夢想的人們勇闖英倫！有夢最美，夥伴相隨，\n沙帥為了信守承諾，陪伴一群印度追夢人前往倫敦展開新生，他們為理想唸英文，踏上危\n\
  險旅程，展開血與淚的長征。沙魯克罕回春魅力無敵，音樂催下去，一邊砲火攻擊，一邊\n手足舞蹈露胸肌。到底是國外月亮圓，還是故鄉水更甜？沙魯克罕帶你走一圈。\n\n\
  －－－－－－－－－\n\n\n\n▎《左輪百合》（Revolver Lily） ▎\n\n\n日本名導行定勳首度挑戰改編時代小說的新作《左輪百合》，找來綾瀨遙化身明治末年的\n\
  首席特務，在暗殺57位高官要員後一夕消失，多年後隱身東京花街柳巷，誓言不再奪命；\n但命運使她與慘遭滅族的少年相逢，一把左輪手槍招來千軍萬馬，在狂亂年代肆意綻放，\n\
  暗黑女王橫空出世。綾瀨遙和長谷川博拚演技火花，攜手新生代演員羽村仁成、阿部貞夫\n、谷川琴音同台飆戲，還有野村萬齊、豊川悅司跨刀演出，半野喜弘操刀配樂添磅礡色彩\n\
  ，打造一齣華麗淒美的壯闊史詩鉅片，為行定勳前所未見的顛覆之作。\n\n▎《替身忠臣藏》（Don't Lose Your Head!） ▎\n\n\n 《輝夜姬想讓人告白\
  \ ～天才們的戀愛頭腦戰～》真人電影導演河合勇人，《替身忠臣藏\n》再展改編能手，將時代劇《忠臣藏》添加「替身」元素的同名小說搬上銀幕。 影片講\n述高家吉良遭赤穗藩主淺野砍殺重傷，家臣找來吉良的和尚弟弟充當替身，應付幕府召見\n\
  ，另一頭47位武士正準備為被迫切腹自盡的淺野展開復仇，這個替身城主該不該繼續演下\n去？喜劇男星室剛一人分飾兩角，率眾武士復仇的永山瑛太，以及川口春奈、北村一輝、\n\
  柄本明等一票演技派吸睛演出，把時代劇魔改荒謬喜劇，令人捧腹大笑之餘，更好奇劇情\n還能怎麼走下去？\n\n▎《無限泡湯兩分鐘》（River） ▎\n\n\n日本導演山口淳太繼口碑爆棚的《超越無限兩分鐘》，新作《無限泡湯兩分鐘》（River\n\
  ）再度與《春宵苦短，少女前進吧！》編劇上田誠合作，延續無限可能的世界！這回場景\n從咖啡廳來到京都百年旅館，倒完又斟滿的酒瓶、無限增生的雜炊飯、重複下筆又消失的\n\
  小說段落，不斷重複的兩分鐘，不只衝擊住客，也讓員工們手忙腳亂，眾人循線逐題破解\n試圖逃出生天，越破解卻越難以理解。瘋狂奇想與荒誕幽默再升級，毫無懸念入選各大奇\n\
  幻影展，更在日本TAMA電影獎與《蒼鷺與少年》齊名，一同拿下頒發給劇組全體工作人員\n的特別獎。\n\n▎《沙漠大冒險》（Sand Land） ▎\n\n\n\
  日本動畫導演橫嶋俊久改編《七龍珠》知名漫畫家鳥山明短篇作品的《沙漠大冒險》，故\n事來到瀕臨毀滅的沙漠世界，水源不足讓倖存的人民和妖怪都喊渴叫苦，小鎮保安官拉歐\n\
  決定前往妖怪巢穴尋求幫助，用電動玩具收買了惡魔王子貝爾傑布，還帶上了知識淵博的\n老小偷妖怪西夫，一起找尋傳說的夢幻之泉。鳥山明的招牌畫風，鮮明的角色，加上田村\n\
  睦心、山路和弘、大塚明夫、鶴岡聰、飛田展男、杉田智和等豪華聲優參與，帶領觀眾一\n同踏上熱血青春的冒險旅程。\n\n--"
