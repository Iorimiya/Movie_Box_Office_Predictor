title: '[新聞] 金馬奇幻影展閉幕片 政治喜劇「市長夫人'
content: "新聞網址：\n\n    金馬奇幻影展閉幕片 政治喜劇「市長夫人的秘密」獲選\n\n    2018金馬奇幻影展將於4月13日展開，今日公佈連奕琦導演的最新喜劇「市\n\
  \    長夫人的秘密」將是本屆閉幕片，這也是本片世界首映，屆時導演將率眾演\n    員們登台。同樣將在奇幻影展舉行世界首映的還有金鐘獎導演陳慧翎的科幻\n\
  \    新作「必須過動」，荷蘭導演王洪飛（David Verbeek）在台灣拍攝的「小\n    玩意」，以及中國新銳導演張林子邀來香港女星顏卓靈、台灣小生王柏傑、\n\
  \    李程彬主演的「鏡像人．明日青春」，影人也都會出席與觀眾見面。\n\n    閉幕片「市長夫人的秘密」是台灣少有的愛情政治推理喜劇，描述冷面笑匠\n \
  \   張少懷飾演的綜藝名嘴，被市長秘密委託接近偷吃成性的市長夫人，卻身陷\n    意想不到的桃色風波與政治陷阱，以獨特的黑色幽默嘲諷台灣的政治與媒\n  \
  \  體。\n\n    「必須過動」是公共電視教育主題戲劇「你的孩子不是你的孩子」系列單元\n    之一，由兩度囊括金鐘獎最佳導演的陳慧翎執導，講述在人類胚胎被國家掌\n\
  \    控的未來社會，孩子的表現將影響家庭所獲得的資源，一名母親因女兒的成\n    績不佳，決定要向政府證明女兒是瑕疵品，好換取新的優良胚胎，宛如台版\n\
  \    「黑鏡」。\n\n    大陸新銳導演張林子同樣推出科幻題材「鏡像人．明日青春」，將場景移置\n    飽受污染的末日世界，以三個各自獨立又環環相扣的故事，描述僅有編號的\n\
  \    「鏡像人」試圖拿回它們被設定好的生命主權。旅居台灣多年荷蘭導演王洪\n    飛入圍鹿特丹影展「大銀幕獎」的「小玩意」，以獨特的視角捕捉台北巷弄\n\
  \    風景，充滿詩意的故事更吸引金馬獎影后盧燕力挺參與演出。\n\n    2018金馬奇幻影展獨家選片指南將在3月25日舉行，並於4月1日於官網售票\n\
  \    系統開放售票，更多詳情請上金馬影展官方網站、金馬影展臉書粉絲專頁。\n-----\n閉幕片是「甜蜜殺機」導演的新片，有點好奇台灣的政治喜劇會長什麼樣子..？\n\
  但查了一下好像目前只有這支預告？\n\n\n--"
