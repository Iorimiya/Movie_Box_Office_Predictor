title: '[新聞] 跟著電影字幕K歌！金馬奇幻影展4月台中登'
content: '新聞網址：



  跟著電影字幕K歌！金馬奇幻影展4月台中登場


  深受影迷喜愛的金馬奇幻影展今年首度到台中舉行，台北金馬影展執委會執行長聞天祥、台中市政府副秘書長朱康震今上午簽署合作宣言，4月17日至26日50部影片的完整片單將在台中播映。
  金馬奇幻影展成立11年，比起正襟危坐看影展片，奇幻影展被形容為瘋狂、好玩又沒包袱的影展片；聞天祥說，除了欣賞電影藝術，影展規劃了「跟著唱翻天」場次，搭配變色字幕，把電影院變成KTV，影迷可以邊看電影邊跟著大聲唱，例如經典影片「真善美」、熱門動畫「冰雪奇緣」等，都吸引影迷進場。

  台中市新聞局長黃國瑋說，台中有不少專業影迷，也有優質的拍片環境，市府與金馬影展執委會合作辦過「柏格曼百年紀念影展」、「義大利電影課」等，大師經典影片獲得不錯迴響，奇幻影展進駐台中後，影迷不必跑台北，就能感受電影藝術的魔力。


  聞天祥說，今年將放映50部影片，完整片單預計3月確定，今年首度將奇幻影展搬到台中，屆時台中、台北都會放映完長片單，中南部影迷不必再辛苦趕到台北，搶完票可以直接在台中欣賞。

  聞天祥說，奇幻影展鎖定創意、想像力的類型影片，包含科幻、恐怖驚悚、歌舞或喜劇等電影，每年大熱門的狂歡場「洛基恐怖秀」，觀眾會扮裝出席，還能與銀幕人物互動，打破安靜看電影的刻板印象；去年奇幻影展放映56部影片，滿座率高達80%，吸引37800人進場。



  ---


  太好了 金馬奇幻終於到台中


  怎麼我到台北工作才有啦...




  --

  我現在都在台北看啊QQ'
