url: https://www.ptt.cc/bbs/movie/M.1518431704.A.CE4.html
title: '[新聞] 吉田大八、武正晴 日本名導前進奇幻影展'
content: '2018-02-12 18:03

  聯合報 記者陳建嘉╱即時報導

  年年吸引影迷朝聖的金馬奇幻影展，今年邀來兩位日本名導帶著新作來台共襄盛舉。一位

  是曾以「聽說桐島退社了」在金馬奇幻影展造成轟動的導演吉田大八，這次將帶著新作「

  羊之木」來台會影迷。而以「百元之戀」代表日本角逐奧斯卡的武正晴導演，將一次帶來

  兩部作品，包括帥氣男星瑛太打破形象扮魯蛇的「沒關係，是渣男啊」，以及令人笑到流

  淚的鬥智喜劇「噓八百」。兩位導演皆確定出席映後座談，影迷千萬不可錯過面對面的難

  得機會。


  吉田大八2013年橫掃日本影壇贏得多項大獎的「聽說桐島退社了」，當年在金馬奇幻影展

  掀起一股風潮，這次帶來的新作「羊之木」講述六名殺人假釋犯在政府安排下展開新生，

  不該互相接觸的六人卻因籌辦祭典活動而相遇，他們的命運也就此改變。除了吉田大八再

  度展現精采的場面調度功力，錦戶亮、木村文乃、北村一輝、松田龍平等人勾心鬥角互拚

  演技，令人看了大呼過癮。


  武正晴導演新作「沒關係，是渣男啊」變成要飾演魯蛇男的瑛太在擂台上拼輸贏，以搏回

  女友心，無賴到底又癡心絕對的演出，令人又愛又恨。而以日文「謊話連篇」之意為片名

  的「噓八百」，改玩爾虞我詐的鬥智遊戲，邀來日本演技派男星中井貴一、佐佐木藏之介

  ，飾演無良古董商與巧手工匠，兩大型男攜手搞笑，不僅要笑光觀眾的體力，還要燒光觀

  眾的腦力。


  2018金馬奇幻影展於4月13日至22日舉行。



  新聞網址：


  --'
