title: '[情報] 2024 金馬奇幻影展 第三波片單'
content: '金馬奇幻影展網羅13部影壇奇片 丹麥影帝邁茲米克森拓荒改種馬鈴薯

  浪漫奇想、癲狂喜劇、B級血腥、恐怖驚悚 打開觀眾的想像界限


  2024金馬奇幻影展驚喜佳片不斷，今日（3/6）再公布13部橫跨浪漫奇想、癲狂喜劇、B級

  血腥、恐怖驚悚的奇幻新作，打開觀眾的想像界限。



  《皇家風流史》，飾演不畏刁難在貧瘠荒原種出馬鈴薯的退伍軍官，堅毅的心

  靈也隨之開出愛的花朵。新銳導演，讓戀愛腦的女主角不僅大聲說愛，還要把「心」掏出來給人家，浪漫魔

  幻宛如查理考夫曼和尤格藍西莫的完美合體。，描寫一對時空旅人因腹中孩子不曾在未來出現

  ，使他們焦慮地在時間虛海裡探究，展開看似預知又未知的奇異旅程。，刻畫丈夫不顧一切拯救即將轉

  變成樹木的愛妻，迷幻動人，吸引各大影展爭相邀約。


  精彩片單還有三部令人大呼過癮的喜劇，包括，是以復古布偶裝展開的真人動畫，雪地獵

  人對上組織嚴密的河狸大軍，創意十足又逗趣刺激。，諧仿80年代電視情境喜劇，但闔家

  觀賞的罐頭笑聲還沒完，便突變成噴血爆頭樣樣來，笑聲尖叫齊發。，當父親感染變成殭屍，

  想拍電影想瘋的兒子竟突發奇想，決定拍攝第一部由真實殭屍主演的恐怖片，一場「熱血

  」的電影圓夢計劃就此展開。


  越恐怖越要看的影迷，不可錯過，讓觀眾

  拋開超級英雄蜘蛛人的美好想像，在小女孩帶領下，對抗一暝大一呎的嗜血八腳巨怪。曾

  以《該死的上帝》技驚四座的，一張造型走鐘的咖啡桌竟掀起連環意外和無解難題，沒有鬼怪和中邪，

  卻殘酷到駭人聽聞，荒謬到令人發噱。


  ，描述在倫敦打黑工的清潔人員，意外掀開陰森豪宅裡的邪惡真相，難以

  預料角色關係與劇情發展，不到最後不知誰死誰手。，神祕女孩的出現，讓現實人生與動畫作品的界線逐漸模糊，邪魅的停格

  動畫與殘酷的血腥虐殺雙管齊下，一舉贏得西班牙Sitges奇幻影展評審團特別獎、奧斯汀

  奇幻影展最佳導演大獎。


  影展也邀來兩部名導新作，包括《愛的萬物論》導演，以巧妙手法訴說《等待果陀》巨匠貝克特的傳奇人生。《海鷗

  食堂》日本名導一改過往療癒風格，筒井真理子化身「

  絕望主婦」，以驚悚筆觸揭開日本女性壓抑的真實處境，驚人的最後一舞，更跳出自我救

  贖。


  2024年金馬奇幻影展將於4月12日至21日展開，選片指南將在3月26日舉辦，並於3月31日

  正式開賣。更多精彩片單與周邊活動訊息將陸續公佈，請鎖定金馬官網、臉書粉絲專頁、

  Instagram，或下載金馬APP，掌握第一手消息。


  －－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－


  ▎《荒蕪之地．應許之心》（The Promised Land）▎



  《皇家風流史》丹麥導演尼克萊阿瑟改編真實歷史人物故事的《荒蕪之地．應許之心》，

  與丹麥影帝邁茲米克森再度合作，把鏡頭帶回1755年的丹麥，靠自身努力從庶出孽子成為

  軍官的卡倫，為了贏得財富和榮譽，以國王號召之名前往日德蘭荒原，試圖在貧瘠之地種

  植出馬鈴薯。沒想到拓荒之路不僅得看天吃飯、看人臉色，還得奮力抵抗當地貴族統治者

  的各種刁難與陷害，看似翻轉階級的英雄旅程，卻總是事與願違，卡倫是否能「關關難過

  ，關關過」，完成這趟不可能的任務？



  ▎《掏心戀習生》（With Love and a Major Organ）▎



  新銳導演金歐布萊特首執導筒便獲得影壇關注的《掏心戀習生》，描述提倡壓抑情緒、大

  數據掌握生活的近未來，承載情感的心臟是可以被取出的物件。一名熱愛藝術、追隨內心

  的女子經常感到與世界格格不入，當她遇到一見傾心的男子，頓時戀愛腦爆炸，愛與痛交

  織，悲與喜碰撞，甜蜜地負荷著愛情的重量，沒想到對方卻無動於衷，讓她決定要把心掏

  出來送給他。影片以風格化的影像和配樂，幽默機智的對白，更巧妙將「心」具象化，彷

  彿查理考夫曼和尤格藍西莫的完美合體，帶來一齣節奏明快、清新浪漫的魔幻現實主義輕

  喜劇。



  ▎《未來的我們在昨日相愛》（Embryo Larva Butterfly）▎



  賽普勒斯籍導演凱羅斯帕帕瓦西利烏，大膽將線性時間剪碎的《未來的我們在昨日相愛》

  ，故事發生在一個非線性時空隨機暴走的世界，昨天生在未來，今天造訪過去，每天睜眼

  醒來，皆擺渡在時間的虛海裡，一對時空旅人夫妻因腹中的孩子不曾在未來出現，讓他們

  開始焦慮自疑。影片挑戰敘事常規，以詩意柔和的攝影為基調，大膽調度異色剪輯，極具

  視覺衝擊。在風格遊走間，展現科技與自然的矛盾，也思辯生命的因果起滅，邀請觀眾沉

  浸一段預知又未知的奇異旅程。



  ▎《人造天空》（White Plastic Sky）▎



  匈牙利雙導演蒂博爾巴洛茲基、薩羅爾塔薩伯歷時7年創作的首部動畫長片《人造天空》

  ，描述在近未來的世界，倖存的人類僅能居住於溫室穹頂下，年滿50歲就要被改造為樹木

  ，才能讓物種循環延續。一名妻子承受不了喪子之痛，決定瞞著丈夫提早轉化為樹，而深

  愛妻子的丈夫則不顧一切踏上拯救的旅程。影片將環境隱憂化作追尋愛情的悠長詩篇，運

  用真人動態轉描技術，在冷冽科幻的敘事中添入細膩的角色、精彩的動作場面，取材真實

  場景融合未來想像，打造出迷幻又殘酷的反烏托邦世界。不僅獲得安妮獎最佳獨立動畫長

  片提名、薩格勒布動畫影展特別提及、史特拉斯堡奇幻影展銀獎，更吸引各大影展爭相邀

  約放映。



  ▎《狸太怨》（Hundreds of Beavers）▎



  作品橫跨剪接、編劇與視效設計的美國導演邁克切斯利克首部劇情長片《狸太怨》，以極

  低預算的手作精神，展開復古風格的黑白布偶裝真人卡通動畫。故事講述19世紀冰天雪地

  的北方，原本靠賣酒賺錢的男子，意外遇到酒廠失火，貨源付之一炬，他只好投身獵人行

  業，剝取獸皮維生，沒想到卻將面對滿山遍野、數以千計的智慧河狸組織。影片不靠一句

  台詞，就將巧妙調度的動作場面，推進到直逼基頓或卓別林的逗趣刺激，港式功夫的喜劇

  動作設計、經典電玩橋段的逼真重現，創意十足、令人腦洞大開，不僅贏得加拿大奇幻影

  展觀眾票選最佳國際影片銅獎，連怪傑名導蓋馬汀都拍手稱奇。



  ▎《歡肖一籮筐》（Krazy House）▎



  打破荷蘭影史票房紀錄的荷蘭喜劇奇才雙人組史特芬哈爾斯、菲利普凡德庫爾，首部英語

  劇情長片《歡肖一籮筐》諧仿八、九〇年代電視情境喜劇，邀來《活人甡吃》「血腥冰淇

  淋三部曲」英國知名喜劇演員尼克佛羅斯特化身虔誠教徒，卻總是把全家搞得雞飛狗跳，

  從水龍頭故障的小事，竟演變成房子危在旦夕、兒女染上毒癮，連俄羅斯水電工都掏槍露

  出真面目，他向神發出求救訊號卻無果，只好直視內心瘋狂念頭，先宰了耶穌再殺個片甲

  不留。片中種種悖德刻板印象與政治不正確情節，極盡所能諷刺基督教義，大玩影像形式

  和畫面比例之餘，更揮灑血腥驚悚風格，噴血爆頭樣樣來，令人樂得大笑，也嚇到尖叫。



  ▎《拍血少年》（All You Need Is Blood）▎



  美國新銳導演巴奇李畢福、庫柏羅伯特首部劇情作品，把拍片少年變成《拍血少年》。16

  歲瘦皮猴少年與他的聽障好友夢想成為電影導演，當一顆小隕石意外墜入院子，讓父親遭

  感染成了殭屍，他們竟靈機一動，決定要拍攝史上第一部由真實殭屍主演的恐怖電影！但

  拍電影哪有那麼容易？他們得一邊展開選角拍攝，一邊控制殭屍防堵感染擴散，應付當地

  偵探調查的同時，還要克服暈血症的不適。一場熱血又噴血的電影圓夢計劃，就此展開。



  ▎《蜘蛛驚》（Sting）▎



  憑活屍虐殺電影闖蕩各大奇幻影展的澳洲導演齊亞羅區透納，新作《蜘蛛驚》把殭屍換成

  變種蜘蛛，讓觀眾拋開超級英雄蜘蛛人的美好，再掀人類內心對蜘蛛的深刻恐懼。受家中

  大人冷落的小女孩，孤獨的她與意外發現的外星小蜘蛛展開奇異的連結，沒想到看似迷你

  可愛的祕密寵物，卻在嗜血慾望下驚人成長，在公寓鄰居的寵物一一失蹤後，女孩意識到

  只有她能拯救即將被獵殺的親愛家人。



  ▎《該死的咖啡桌》（The Coffee Table）▎



  曾以《該死的上帝》技驚四座的西班牙導演卡耶卡薩斯，新作《該死的咖啡桌》把搞亂人

  生的角色從上帝換成咖啡桌。一對新手爸媽在家具店裡爭執不休，一向唯妻是從的丈夫堅

  持要買下一張造型走鐘、自己卻情有獨鍾的咖啡桌，最終獲得勝利的他喜孜孜地將咖啡桌

  搬回家，沒想到這即將成為他人生中，最最最糟糕的一個決定。影片透過風格強烈的影像

  構圖和聲音設計，將內心的不安和恐懼等情緒極大化，既有對伴侶關係的深刻描繪，更有

  衝擊性十足的連環意外和無解難題。沒有鬼怪登場、沒有中邪橋段，卻殘酷到駭人聽聞，

  荒謬到令人發噱。



  ▎《邪厄恩典》（Raging Grace）▎



  英國菲律賓裔新秀導演派瑞斯札西亞一鳴驚人獲得SXSW影展評審團大獎和代表最佳首作雷

  鳥新星獎的《邪厄恩典》，描述來自菲律賓的女家事清潔工，沒有簽證只能偷帶著女兒在

  倫敦各處打黑工，從新雇主手上獲得郊區陰森豪宅的工作，她將女兒偷渡進屋，調皮的女

  兒卻不理會警告到處溜達，眼看她誤打誤撞，即將掀開潘朵拉的盒子。導演從自身移民族

  群視角出發，將對外籍移工處境的批判，藏在邪惡驚悚的暗黑歌德美學之中，有著童話故

  事《藍鬍子》般的神祕張力，卻難以預料角色關係與劇情發展，不到最後，不知誰死誰手

  。



  ▎《停格魔畫》（Stopmotion）▎



  以恐怖風格聞名的英國動畫導演羅伯特摩根，新作《停格魔畫》找來《夜鶯的哭聲》艾琳

  佛朗西斯飾演一名被控制狂母親指導的停格動畫師，母親因病住院後，她試圖繼續延續母

  親的願望完成作品，卻遭遇瓶頸；直到一名神祕女孩突然出現，講述著令人著迷的驚悚故

  事，她開始以女孩的故事創作，但現實人生與動畫作品的分界似乎逐漸變得模糊。影片綜

  合虛實，混合佛朗西斯培根的噩夢造像、大衛林區的怪誕懸疑，以及斯凡克梅耶、奎式兄

  弟等大師技法與風格，把邪魅的停格動畫與殘酷的血腥虐殺雙管齊下，強勢衝擊觀眾的大

  腦與感官，一舉贏得西班牙Sitges奇幻影展評審團特別獎、奧斯汀奇幻影展最佳導演。



  ▎《作家不跳舞：等待貝克特》（Dance First）▎



  《愛的萬物論》導演詹姆士馬許新作《作家不跳舞：等待貝克特》再以影像立傳，將鏡頭

  轉向《等待果陀》愛爾蘭文學巨匠山繆貝克特的傳奇人生，當掌聲乍響，卻褪盡榮光，諾

  貝爾文學獎獲獎人貝克特的登台彷如一齣荒誕戲碼，展開一場作家與作家的自我對話。愛

  爾蘭資深男演員蓋布瑞拜恩一人分飾兩角，極致演繹貝克特的自我詰問，更聯手《正常人

  》搶眼新星菲恩奧沙，分章節共塑貝克特的多階段人生。從年輕氣盛的孤傲理想，到洗盡

  鉛華的內斂深沉，平穩運鏡典雅別緻，心緒輾轉引人深思。



  ▎《波紋》（Ripples）▎



  《海鷗食堂》日本名導荻上直子擅以影像刻劃出不同女性樣貌，新作《波紋》將鏡頭聚焦

  女性中年危機，描述一名中年婦女在丈夫離家出走後，心靈歸依新興宗教，每日靜心祈禱

  ，只喝教會販售的瓶裝水，把庭院改造成漣漪波紋的枯山水，沒想到丈夫帶著罹癌身體回

  來求照顧，飯來張口茶來伸手的兒子也把殘疾女友帶進家門，將她看似平靜的生活掀起漣

  漪，壓抑的陰暗情緒也即將爆發。荻上直子一改過往療癒影像風格，透過地震輻射、環境

  照護、殘疾弱勢、宗教信仰，以驚悚筆觸犀利揭開日本女性壓抑的真實處境。筒井真理子

  精湛演繹絕望主婦的無力與哀愁，最後的驚人一舞，為自己，也為女性跳出自我救贖。


  --'
