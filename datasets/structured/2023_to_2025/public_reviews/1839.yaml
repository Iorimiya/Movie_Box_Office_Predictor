url: https://www.ptt.cc/bbs/movie/M.1428852151.A.47D.html
title: '[好雷] 奇幻影展的明日拍立得的一些心得 '
content: '這禮拜五看了明日拍立得 結果出乎意料的好看,


  但是在劇情關鍵的轉折時有點看不懂所以回家想了很久


  所以有些心得想要分享,但本身不善於文字只能寫些簡略的心得


  -----防雷線-------




  我當時感到疑問的地方就是在男主角逃出密室準備最後一幅畫的時候

  那段鏡頭有刻意透露出主角感到困惑,後來對女主角起了疑心

  最後發現了她隱瞞的事實

  當時的字幕好像是“難道我要一直畫這幅畫嗎？”（大概的意思）

  之後上網爬文也沒找到解答 但是看到不止一人有跟我一樣的問題

  不過我覺得網路上的回答跟我想得不太一樣


  我的記憶力沒那麼好 所以引用豆瓣的討論裡提到還原電影的台詞

  當時他說的應該是“I was always going to paint this?”

  這句話的意思應該是“我註定要畫這幅畫嗎？” （電影裡的翻譯是錯的）

  他接著說“I haven''t changed anything”

  他講這些話的時候看著自己手上的兩張照片

  一張是她從女博士身上得到的照片

  另一張則是凱莉給他的照片

  而這張照片證明了拍立得上的未來是可以被改變的（事後發現是假的）


  以主角的角度而言

  如果未來真的可以改變

  那他還沒逃出密室再回房間大亂鬥完再畫畫拯救過去的自己，

  怎麼未來就已經被改變了？（照片的內容已經改變了）


  這是我對於主角當時感到困惑的解釋

  不知道我的翻譯對不對,或許大家還可以在討論一下

  希望有幫助到大家


  除此之外我不覺得電影裡有什麼不合邏輯的地方

  剛看完的時候覺得女主角有點腦殘

  因為它殺了男主角也沒沒辦法拯救另一個時間軸的自己

  因為整部電影告訴我們不可能改變已經決定好的未來

  那女主角在看到貼了黃布條的最後一張照片之後怎麼還會試圖改變

  但之後想通了

  正因為女主角深信她可以在晚上八點拍照提醒前一晚的自己

  從而拯救另一個時間軸的自己,更突顯出在這電影中的時間軸裡

  她是無法辦到這件事情的（只要是在已經看到貼了黃布條照片的時間軸上）


  還有一點關於板上提到的另一個疑問

  就是關於結束前女主角被警察抓走以後相機自己又拍了一張這件事

  我認為關於這點的解釋可以比較開放

  簡單的看法可以是電影結尾的戲劇效果

  因為女博士已經說了機器是可以設定時間的

  所以也許那一刻要拍照早已設定在機器的排程內


  如果大家其他問題也可以再討論


  再來分享一下大家都沒討論到的 電影裡面出現的畫


  其中我最喜歡的一幅是組頭第一次到家裡來的那幅

  借用下面這個網誌的圖 給大家看一下


  畫中是從車內往擋風玻璃看出去 前方有許多光點

  而後照鏡中可以看到有一台車

  其實這幅畫就象徵了這部電影的時間觀

  他把時間比喻成只有一個方向的道路

  而每個現在就像處於一台行進的車中

  後照鏡中的車子代表著過去

  前方看到無數光點代表平行時空理論中無限多個未來的可能性


  另外一幅是第一幅畫 也就是無數信件們充斥了整幅畫的那幅

  這也是有關於時空旅行的想像 雖然劇中沒有真的旅行

  但就跟畫中一樣未來與現在與過去可以透過像信件般方式交流

  而幅畫仿佛在述說當你看到照片的那一刻

  就像是在畫中無數信件中挑出其中一封那樣微乎其微的機率


  好像是第一次分享心得,打完感覺電影有更好看了一點

  感謝看完的人








  --'
