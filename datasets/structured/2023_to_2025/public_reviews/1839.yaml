title: '[討論] 2022金馬奇幻影展開幕片《媽的多重宇宙》'
content: '昨天就有人發過消息了，只是標題沒加上金馬奇幻影展

  應該還是有人不知道。

  這裡順便放上預告片:




  電影介紹:

  以狂想喜劇驚艷影壇的美國導演丹尼爾關、丹尼爾舒奈特，新作把腦筋動到身上，她宛如千面女郎，從心力交瘁的主婦不斷變

  身，成為跨越無限宇宙的最強老媽，和、一起突破形象拚演技。華麗出演與母親相愛相殺的逆女，誇張造

  型完勝渡邊直美，目不暇給的百變演出，令人直呼過癮。(以上文字取自金馬奇幻影展官網)



  台灣這裡也確定由双喜娛樂取得代理，之後將會上院線(日期未定)

  順帶一提，這部也是以《魔宮傳奇》走紅的關繼威在蜇伏20年後，首度大銀幕復出的作品(Netflix那一部我沒算進去)



  不知道大家會期待這部電影嗎?只是感覺很燒腦又很ㄎㄧㄤ就是了XD


  --



  --'
