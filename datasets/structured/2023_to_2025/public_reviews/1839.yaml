url: https://www.ptt.cc/bbs/movie/M.1334495511.A.86C.html
title: '[好雷] 金馬奇幻影展之《福馬林之愛》'
content: "終於我的奇幻影展結束了。最後一部《》在看之前，其實沒抱什麼期\n  待，沒想到是個大驚喜！這是一部德國片，但故事時空是整整一百年前世戰前夕的愛\n\
  \  沙尼亞，論質感論題材，論格局論深度，都不輸一部問鼎影獎的\n  大製作。而回家一查，我也才驚覺有眼不識泰山：這是《》導演Chris Kr-\n  aus的新作。難怪了！\n\
  \n      從一個來投靠生父的少女目光出發，《POLL》看的是在一個戰亂時代中、邊遠村\n  落家族的破敗，一條線是男女主人間的關係崩毀，另一條則是少女主角\n\
  \  在無意間救了一個「無政府主義暴亂份子」，進而窩藏、照顧、陪\n  伴彼此，直到事態瀕臨被掀翻的邊緣，宿命的狂風一吹，熊熊大火燃起不可收拾。這\n  是個看史事、看演技、看場景、看空間中的權力關係都是戲的好作品，以其敏感沈望\n\
  \  某個舊時代的華麗崩壞的美。它是哀淒的，又在本質上是浪漫的。\n\n      我想先從技術談起。它的攝影絕對是大手筆，整部片發生在湖畔的家族莊園中，\n\
  \  那一棟兩層樓又荒謬又威嚴又寧靜的宅邸主體，是超精采的搭景，而鏡頭在其中穿梭、\n  在夜色裡屏息，在那長長的木「碼頭」上退退退、退到林邊驟然升起成遠景，其規模\n\
  \  技巧，不可思議。也是這樣的大器讓我在電影開場沒多久就感覺到：這不是泛泛之作，\n  在那些奔馬和夕陽中、烈火與戰事裡，我看到了氣勢。\n\n      而這般視覺搭配更讓人迷醉的音樂，是驚人的藝術魅力。《POLL》的配樂者Anne-\n\
  \  tte Focks 同時也是《情鍵四分鐘》的配樂家，自頭至尾的樂器運用，弦的激烈、鼓\n  的澎湃、人聲的吟遊，再加上吉他的親密感，是我今年至今數一數二的原聲帶印象。\n\
  \  幾場大提琴的獨奏更是以聲代人，那低沈的困鬥透漏著角色藉由音樂、脫離現實的企\n  求，清晰如刃。\n\n      在它的主題處，《POLL》首先是個典型的「窩藏革命家逃犯」的故事，那孩童對\n\
  \  抗／無視大人世界的堅決有點讓我想起《微風輕哨》，但當然沒有後者的輕快；也可\n  以是《千年女優》，雖然著重的點並不同。若從嚴峻的氛圍來看，又更接近《羊男的\n\
  \  迷宮》一點——不只是那「陰暗懸疑」的特質及其時時緊繃，還有世道的無良和絕望、\n  種族政史造就的悲慘，揮之不去。\n\n      它還有個主題是「科學」，而且是陰暗式的，是中文片名裡的「福馬林」三字所\n\
  \  要指涉的。片中同時把這稱作「死亡的藝術」，由此帶出主角父親沈溺在沒有生命的\n  暗室裡，而忘卻人的溫度；但想跟父親學習這一切的女孩，是想當個醫生，這又是從\n\
  \  「死」的技藝中要習得「生」之魔法。再連結到她從年輕革命家身上領悟的「說」的\n  本領，在《POLL》的故事底層有這三道核心意旨，都具體成形，有心有力。\n\
  \n      我也喜歡這故事搬弄了「好人壞人」印象的流動對換，看似苛刻的後母，到後段\n  卻成了受害者，而原先是主角唯一依靠的父親，則變得瘋魔；一出場像壞人的革命者，\n\
  \  他真正的善惡始終未知，但我們清楚明白：是對女主角的關愛和\n  縱容，讓他走到最後的終局的。\n\n      值得一提的還有少女演員Paula Beer的演出，她的眉眼很有蜜拉喬娃維琪的味道，\n\
  \  但更古典一點；她的角色的獨立和果決，有若《真實的勇氣》裡那女孩，但全片的環\n  境壓迫感又更接近《簡愛》一些；而故事最後，將整起事件導成她的永恆初戀了，這\n\
  \  又回到和《千年女優》的對應關係。\n\n      在電影近尾處，有一幕是我非常喜歡的：當女主角在家人出遊的中途告退、快馬\n  奔回要赴她的「逃脫」計畫，她在路上經過母親下葬的墓園，停了下來，踱步猶豫了\n\
  \  一圈，才又決然上路。這意象在片中出現多次，是陪著她這「過客」\n  來此莊園的唯一信物／行李。而她從無法放下、到漸漸找到新的自我，終於完成一個\n  完整的自己了。\n\
  \n      但到了最終，原先對波爾而言是個客人的自己，又因為這場事變，而將\n  終其一生把它視為心靈的原鄉。當故事結束，你我都記住了那村落的暗與深邃，及夕\n\
  \  陽靠在水上的無垠寧靜。這是個深刻的故事，深遠的手筆，也是一段深沈至美的回憶。\n  這是一部真正不該錯過的電影。四顆星。\n\n--\n\n   \n\n\
  \         時光之硯部落格 \n\n\n--\n◆ From: 114.44.30.12"
