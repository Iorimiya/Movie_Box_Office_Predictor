title: '[新聞] 金馬奇幻影展首度台中放映 洛基恐怖秀台'
content: '原新聞網址：




  （中央社記者洪健倫台北13日電）2020金馬奇幻影展將於，這次

  ，



  金馬執委會今天發布新聞稿表示，2020金馬奇幻影展將於4月展開，

  ，宣布本屆金馬奇幻影展的完整節目內容，將在



  「金馬奇幻影展」和關注大師新作、國際影壇創作趨勢的「台北金馬國際影展」不同，奇

  幻影展聚焦於各國具有奇幻、超自然甚至驚悚元素的電影，透過影像不受現實世界限制的

  獨特魔法，拓展觀眾想像力的極限。


  本屆主視覺海報於今天在台中舉行的記者會上公開，插畫家安哲繼去年為金馬奇幻影展設

  計主視覺大獲好評後，再度為今年的奇幻影展操刀，推出2款不同視覺動感的海報，既呼

  應本屆影展在兩地舉辦，也代表趣味多元的精彩節目。


  安哲以經典文學「唐吉訶德」為靈感，設計2款海報，將影迷化身為騎士和一群藏有各種

  怪誕故事的角色，帶著無畏眾人眼光的騎士精神，一同進入天馬行空的奇幻之旅，主視覺

  背景以鮮明的紅、黃、藍「色彩三原色」為色調，象徵著可純粹，也可千變萬化的電影世

  界。


  2020金馬奇幻影展的台北場映期為4月10日至19日，台中場映期則於4月17日至26日舉行。

  ———————————————————-

  台中的影迷終於有福了，原本以為台中是影展沙漠，影展不算多，感恩金馬讚嘆金馬！！

  是說希望未來每年10月的金馬獎影展也可以來台中放映看看嗎？雖然感覺高雄比較有可能

  優先？


  是說大家覺得這次台中放奇幻影展是在哪些影城或場地？


  --'
