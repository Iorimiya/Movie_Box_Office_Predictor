title: '[負雷] 幻影'
content: '《幻影》是改編自麥家小說《風聲》，不過我是拿同樣改編自


  小說的電影《風聲》來與《幻影》相比。



  與電影《風聲》相比，幻影的劇情結構相當薄弱，真的要說只


  有打鬥場面很豐富以及各個場景看起來很精緻這兩個優點。



  電影《風聲》是到結尾才揭露誰是臥底「老鬼」，細節不多說


  ，總之是部氣氛緊張而且需要推理的電影。



  但是這部一開始就讓你知道誰是其中一名幻影，在劇情中間就


  告訴你誰是另一名幻影，然後就變成槍戰片，完全不用再推理


  。



  在電影《風聲》裡，刑求是很重要的情節，但在幻影裡的刑求


  場面只有短短一分鐘多，對於找出誰是幻影完全沒幫助。警衛


  隊長對五名可能的幻影人選，竟然任他們在宅子內外走來走去


  ，也讓幻影能記住油庫、車子及武器的大致位置。




  在兩名幻影逃跑過程，日本軍隊的防備極其薄弱，幻影想燒掉


  電力及通訊系統就燒，想拿武器庫的槍枝就拿，想救誰就救誰


  ，想帶誰上車逃走就逃，就是這麼輕輕鬆鬆。




  每個演員都演得不錯，可是劇情是真的不夠好，所以不推薦大


  家去戲院看。



