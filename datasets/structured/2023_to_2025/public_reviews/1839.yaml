  \n:現場會核對您的個人資訊及ID並劃位,提早抵達觀影座位較佳:)\n:本活動請,\n\n\n震撼坎城影展的奇幻片《天使追殺令》（Jupiter’s Moon），不僅讓觀眾陷入瘋狂，擔\n\
  任評審的好萊塢影星威爾史密斯更公開表達鍾愛，直呼「值得一看再看！」。該片是曾以\n《忠犬追殺令》勇奪坎城大獎的導演柯諾穆恩德秋（Kornél Mundruczó）的新作。全片\n\
  奇幻震撼，尤其一開場驚險刺激的追殺場面，被英國權威媒體【視與聽】拿來與《搶救雷\n恩大兵》相較媲美。片中不僅男主角松波雅格（Zsombor Jeger）騰空漂浮畫面令人驚艷\n\
  ，題材更諷刺了金錢至上、慾望橫行的現今社會，電影充滿末世之美。\n\n《天使追殺令》劇情描述非法入境的青年阿利安，在邊境遭到警方追緝，被子彈射中的他\n竟意外沒死，治療時更被醫生發現他擁有騰空漂浮的超能力…。為避免生命危險，醫生一\n\
  邊帶著阿利安逃跑，卻一邊想利用他的超能力來致富…。導演穆恩德秋再度展現驚人的場\n面調度能力，不但許多長鏡頭跟隨男主角飛天遁地，最後更有一場發生在布達佩斯大飯店\n\
  的精彩動作戲。空前絕妙的劇情，在坎城首映時就引發熱議，隨後還奪下西班牙錫切斯奇\n幻影展最佳影片及最佳視覺效果雙料大獎。不僅網路影評The Wrap呼籲觀眾「跟著創意一\n\
  同遨遊天際！」，權威影評CineVue更讚賞該片「娛樂性極高的的野心之作」。\n\n\n\n:\n\n青年阿利安非法入境歐洲，在邊境遭到警方緝捕，同伴都慘遭射殺，被子彈射中的他，竟\n\
  意外活了下來。當他被送進難民營治療，史登醫生發現他擁有騰空漂浮的超能力，於是一\n邊助他逃離營區，一邊意圖利用他的超能力，大發一筆橫財…。\n\n史登醫生曾因手術失誤，專業與人生陷入重創，遭逢瓶頸的他亟欲逆轉一切，竟發現阿利\n\
  安是他唯一的救贖。阿利安能幫富豪治癒絕症，為他賺進大把鈔票；他能讓天旋地轉，替\n他懲罰勢利的人們；他更出手幫助病重的人，助他們完美離開人世…。\n\n阿利安究竟是天使，還是惡魔？為掩蓋邊境射殺實情，警方對阿利安展開全面追緝，意圖\n\
  追殺滅口。史登醫生帶著阿利安四處逃亡，卻在過程中受到他的啟發，決定迎接生命的奇\n蹟與改變，在險惡世界中展開一場冒險…。\n\n\n\n\n--"
