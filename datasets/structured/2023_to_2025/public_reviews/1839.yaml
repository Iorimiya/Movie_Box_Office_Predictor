content: "新聞網址：\n\n2021-03-12 17:40 聯合報 記者陳建嘉／即時報導\n\n2021金馬奇幻影展即將於4月9日在台北熱鬧展開！今年適逢名導詹姆斯惠爾的經典恐怖片\n\
  「科學怪人」（Frankenstein, 1931）問世90週年，除了重現這部鉅作，也特別規劃專題\n選映「科學怪人的新娘」（Bride of Frankenstein,\
  \ 1935）、「眾神與野獸」（Gods\nand Monsters, 1998）、「蜂巢的幽靈」（The Spirit of the Beehive, 1973）等受其\n\
  啟發的傑作。奇幻影展的固定單元「酷兒理想國」則將推出「我的房東男孩」（Sublet）\n、「美好未來」（The World to Come）、「辣個艾莉絲」（Alice\
  \ Júnior）三部嶄新同\n志佳片。\n\n詹姆斯惠爾改編自「科幻小說之母」瑪麗雪萊同名經典的「科學怪人」，不僅在場景、造\n型、剪接和光影上的表現極為原創，男星波利斯卡洛夫的演出更是無人能出其右。電影中\n\
  濃厚的人文思維及寓言色彩，深刻影響提姆波頓、吉勒摩戴托羅等名導，連電影大師費里\n尼都情有獨鍾將其選入影史十大影片。加倍精緻的「科學怪人的新娘進一步描繪怪物對愛\n\
  情與友誼的渴求，更是影史少數青出於藍的續集電影。\n\n西班牙導演維克多艾里斯一鳴驚人的神作「蜂巢的幽靈」，透過小女孩觀賞「科學怪人」\n後的幻想世界，揭開政治極權的歷史傷痕，魔幻手法也啟發奧斯卡金獎導演吉勒摩戴托羅\n\
  的「羊男的迷宮」。比爾坎登榮獲奧斯卡最佳改編劇本的「眾神與野獸」，則將「科學怪\n人」暗藏的同志情結與詹姆斯惠爾的晚年秘辛精彩結合，由當時尚未以「X戰警」萬磁王\n\
  為影迷所熟知的老牌戲精伊恩麥克連和青春正茂的布蘭登費雪共譜忘年情。\n\n如果說「眾神與野獸」揭開了好萊塢名導藏在恐怖片下的情慾，贏得上屆威尼斯影展最佳\n同志電影酷兒獅獎的「美好未來」（The\
  \ World to Come）有如女女版「斷背山」，深刻\n挖掘舊時代婚姻下的虐心禁戀，威尼斯影后凡妮莎寇比與「怪獸與牠們的產地」凱薩琳華\n特斯頓的演繹十分動人。以「我的軍中情人」、「唱你媽的歌！」聞名的以色列導演伊藤\n\
  福克斯新作「我的房東男孩」（Sublet），讓已婚美國大叔遇到帥氣小鮮肉，把文化衝突\n與世代差異，反轉為真摯的情感對話。在柏林影展大放異彩的「辣個艾莉絲」（Alice\
  \ J\núnior）則跟上網路直播潮流，讓跨性別網紅掀起性平波濤，又笑又淚地對抗不安與歧視\n。這三部新作都將出現在「酷兒理想國」單元。\n\n2021年金馬奇幻影展將於4月9日至18日在台北信義威秀與MUVIE\
  \ CINEMAS展開。\n--\n        \n\n\n\n--"
