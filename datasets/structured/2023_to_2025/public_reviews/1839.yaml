url: https://www.ptt.cc/bbs/movie/M.1744610451.A.CB7.html
title: '[好雷] 金馬奇幻影展：錄影帶謀殺案'
content: '一直很想完整觀賞大衛柯能堡的作品，這次幾乎全選。


  第一次看到本片是在80年代末期，那時第四台供應商攔截（跟本片很像）盜播日本衛星節

  目，其中一個頻道是STAR頻道……不是現在變老鼠旗下那家衛星XX台家族，原本是日本本

  土的衛星台，專門播字幕版洋片和影集，可惜不懂日文字幕只記得一些畫面


  簡而言之，以時代背景來看絕對創新、震撼，邊看邊復古情懷大爆發，80年代是我最愛的

  年代之一，很有創意很有想像力的年代（反觀現在重啟迴圈）。



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  當年看到這部覺得畫面好厲害！多年後看了柯能堡較晚期的《X接觸》，那個劇情震撼和

  新穎完全大減，早期東西還是比較生猛！


  回到劇情，到底本片是怎麼回事呢？以下自我流的理解是……


  拍攝「映像全覽館」的組織想讓北美再次偉大，於是拍了天理不容的殺人性虐片，與《8

  釐米》只是娛樂不同，這個組織想找出真正的變態或是道德淪喪的人，如為了增加觀眾的

  麥克斯。麥克斯同時是他們最終的實驗對象，也是他們取得對公眾播放管道的重要媒介。

  為什麼那個組織不乾脆就放給電視台所有人看，而是單獨影響麥克斯，我覺得就如首腦說

  的，麥克斯是實驗後有幻覺但還能正常運作的（必定是天賦異稟之人），當然要好好利用

  殺死阻礙他們播送計畫的人，像是知道太多的教授女兒。


  人算不如天算的是，教授女兒已經掌握到如何重新設定人腦，這解釋了她在教會大量收容

  遊民(?)給他們看電視，她更勝一籌知道如何讓幻想進入現實。


  組織只能用幻想影響本人（可能讓他們失常自毀），教授女兒則能讓幻想進入現實影響肉

  體，給予被實驗的人真正的新肉身，一個能隨心所欲轉換的致命武器。這也是為何麥克斯

  可以將攔截解碼宅宅的錄影帶轉成炸彈，麥克斯想殺人時手就能變真．手槍，結束行動時

  又恢復原本的模樣。


  對教授女兒或社會來說，這是非常危險的改造人，所以我猜最後一步就是讓麥克斯接受捨

  棄舊肉身，讓他進入他被誘導的狀態。


  看到結局時我有在想他到底變成怎樣的狀態？回家思考後覺得那個狀態並不重要，妮琪只

  是一個工具，女兒曾說過錄影帶內容是因人而異，所以這只是誘發麥克斯往這方面想而已

  。捨棄肉身在這個世界就是死亡。


  以前讀過台灣藝術電影雜誌《影響》對柯能堡的解析，印象是柯能堡的電影有一些常見的

  色情意象，譬如：麥克斯腹部的裂縫就是陰道。回到家再多思考後，麥克斯第一次以手槍

  嘗試，實在很像自慰，同行友人說看他表情不太爽，也許不是在暗示這個。但之後我再想

  想，不對，第一次就插入自慰誰會能馬上就爽？



  所以就如第一次插入自慰一樣，麥克斯不僅不太爽，覺得好像弄傷了自己，然後自慰的東

  西還拿不出來超級恐慌。


  第二次被首腦強姦（？）更是痛苦萬分，被放了奇怪的東西遭到對方控制殺人（整個從中

  年男變成落翅仔），後來連那位宅宅都以為可以自己也可以順勢強姦（？？）


  教授女兒的設定方式則跟那個組織大為不同，她把陰道還轉為產道功能，使得麥克斯即使

  被硬上，也能將髒東西轉換成其他產物，麥克斯的心智能力變得更加強大，也許因為在這

  個階段，他成了意識上的「母親」，他能控制他的火力，讓對方肉體爆炸。


  雖然本片在尺度上頗大，前面讓人想到創意私房、暗網這類東西，散發了部分男性追求極

  致色情的殘忍性格，一直覺得不夠猛不夠刺激。女性角色相較下很多元很有力量，譬如那

  位中年女士影片仲介(?)，還有妮琪，還有教授女兒。


  妮琪一開始是個80年代電影標準的無功能花瓶，喜歡性虐待，很符合部分男性的慾望，但

  她的命運自己決定，她不理會麥克斯男性慣有的保護兼威脅態度，柯能堡對她心態描寫較

  少，但看前面可以猜到妮琪就是想追求特殊的死亡儀式，她的終極目標不是性虐待，而是

  死去。


  妮琪的怪異和刺激對麥克斯影響很大，幻覺初期就佔據麥克斯的心，邀請他進入那個在電

  視裡的另一個世界。


  這邊出現了另一個議題，也就是電視讓觀眾覺得比所在的現實更真實（忘記原句，差不多

  是這個意思），逐漸認同影片呈現的虛構情境，最後被它引導與洗腦，強餵什麼就接受，

  最終走向毀滅。


  解析就到此為止，總之是一部很能促進我胡思亂想的電影！


  這次重看最驚訝的是飾演妮琪的是美國70年代末經典名團金髮美女（Blondie）的女主唱

  黛比哈瑞（片中是用黛博拉這個名字）


  李察吉爾成名作《美國舞男》主題曲




  看見她進軍電影界演出如此異類的電影，還大尺度太驚訝了。


  昨天坐在松仁Titan第三排，我眼睛很爛，所以是絕佳位置之一。特效方面，最重要的腹

  部凹洞非常真實，電視變成生命體也很真實，但手槍在「綁定」(友人的形容）的過程中

  ，皮膚很有黏土感，但綁完又變得很真實！被槍打到爆炸那段，破裂的人體也是很微妙，

  皮膚很像橡皮XD



  --'
