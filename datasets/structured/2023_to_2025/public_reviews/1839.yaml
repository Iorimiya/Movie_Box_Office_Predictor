title: '[情報] 2023 金馬奇幻影展首波片單 (PTA專題)'
content: '金馬奇幻影展推出保羅湯瑪斯安德森導演專題 《甘草披薩》台灣銀幕首映

  影史第一人囊括柏林、坎城、威尼斯三大影展最佳導演


  ，包括《賭國驚爆》（Hard Eight）、《不羈夜》（Boogie Nights）兩

  部早期作品，勇奪柏林影展最佳影片的《心靈角落》（Magnolia），接連贏得坎城、柏林

  影展最佳導演的《戀愛雞尾酒》（Punch-Drunk Love）和《黑金企業》（There Will Be

  Blood），以及備受好評的《性本惡》（Inherent Vice）與《霓裳魅影》（Phantom

  Thread），還有

  充滿挑戰故事也吸引湯姆克魯斯、西

  恩潘、布萊德利庫柏、馬克華伯格、茱莉安摩爾、葛妮絲派特洛、亞當山德勒、艾蜜莉華

  森、菲利普貝克霍爾、約翰萊利、菲力普西摩霍夫曼、丹尼爾戴路易斯、瓦昆菲尼克斯、

  威廉梅西、喬許布洛林、山繆傑克森等演員爭相合作。


  保羅湯瑪斯安德森首部劇情長片《賭國驚爆》（1996）描述職業賭徒與窮困青年宛如父子

  的師徒關係，背後深藏不為人知的祕密。以美國A片產業為題的《不羈夜》（1997），透

  過親密肉體關係，映照出空虛的心靈。《心靈角落》（1999）以龐大複雜的多線敘事，串

  連起不同家庭悲歡離合，以黑馬之姿擊敗米洛斯福曼、奧利佛史東、文溫德斯等大導演，

  勇奪柏林影展最佳影片金熊獎，連電影大師柏格曼都盛讚不已。




  瓦昆菲尼克化身嬉皮私家偵探的《性本惡》（2014），透過一起離奇綁架案，將觀眾帶回

  充滿性、毒品、與美國夢的70年代洛杉磯。遠赴英國拍攝的《霓裳魅影》（2017），丹尼

  爾戴路易斯這回雙手洗去油漬，拾起針線做裁縫，與絲莉蔓薇爾、維琪克雷普在親情與愛

  情間火花四射。而以成長歲月為靈感的《甘草披薩》（2021），跟著菲力普西摩霍夫曼之

  子庫柏霍夫曼和海慕樂團（Haim）艾拉娜海姆，在充滿經濟危機、政治醜聞的70年代，品

  嚐甘苦交織的青春滋味。


  除了引介影壇佳作，金馬特別企劃的「影迷新世代」活動也帶領青少年從校園走進戲院，

  於2月7日展開報名的「影迷新世代－金馬奇幻影展團體場」，不僅安排金馬策展團隊前往

  校園展開影展介紹和基礎電影語言導覽，也將於4月14日（五）、4月15日（六）兩日，舉

  辦兩場奇幻影展專場放映，歡迎有興趣的國、高中老師或相關團體報名參加，活動詳情請

  見官網活動頁面。


  2023年金馬奇幻影展將於4月7日至16日展開，選片指南將在3月24日於臺北文創大樓14樓

  文創會所舉辦，並於3月26日正式開賣。更多精彩片單與周邊活動訊息將陸續公佈，請鎖

  定金馬官網、臉書粉絲專頁、Instagram，或下載金馬APP，掌握第一手消息。


  －－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－


  ▎《賭國驚爆》（Hard Eight, 1996） ▎



  保羅湯瑪斯安德森首部劇情長片《賭國驚爆》（1996），講述一名老賭徒（菲利普貝克霍

  爾飾）將賭術傳授給一位窮困的年輕男子（約翰萊利飾），好讓他藉此翻身，當美麗的酒

  吧女招待（葛妮絲派特洛飾）和不懷好意的新朋友（山繆傑克森飾）出現，也改變了兩人

  的命運。年僅二十多歲的保羅湯瑪斯安德森展露不俗的編導才華，引人入勝的故事、充滿

  特色的人物，不僅在日舞影展首映大獲好評，角逐坎城影展金攝影獎，成為備受矚目新銳

  導演，也開起他與菲利普貝克霍爾、約翰萊利與菲力普西摩霍夫曼的長期合作。



  ▎《不羈夜》（Boogie Nights, 1997） ▎



  保羅湯瑪斯安德森橫掃影壇並角逐奧斯卡的《不羈夜》（1997），以美國70年代末期的情

  色電影產業為題，找來馬克華伯格飾演懷有明星夢的離家小子，在A片名導的慧眼提拔下

  ，憑著俊美臉孔和驚人「尺寸」一戰成名，然而隨著新時代帶來的變化，他們也試圖在洪

  流中找尋新機會。保羅湯瑪斯安德森展現純熟的場面調度功力，藉由性格各異的角色交織

  ，呈現彼時光景的繁華與頹廢，人與人之間的親密與疏離。馬克華伯格放膽表演，約翰萊

  利、菲力普西摩霍夫曼、威廉梅西、茱莉安摩爾、唐奇鐸等一票戲精的精湛演出，老牌演

  員畢雷諾斯更以此片贏得金球獎最佳男配角。



  ▎《心靈角落》（Magnolia, 1999） ▎



  保羅湯瑪斯安德森勇奪柏林影展最佳影片的《心靈角落》（1999），展現比《不羈夜》更

  龐大的複雜多線敘事，透過一檔益智問答節目的垂死製作人、過氣主持人，以及天才神童

  與生命挫敗的參賽者，串起各自家庭中看似疏離卻緊密牽連的關係，愛與恨、背叛、寬恕

  與救贖等悲歡離合，皆在一日之間嚐盡萬種滋味。保羅湯瑪斯安德森將拿手長鏡頭與多線

  故事的交叉剪輯完美結合，帶出複雜人性和純粹情感，連電影大師柏格曼都盛讚不已。



  ▎《戀愛雞尾酒》（Punch-Drunk Love, 2002） ▎



  繼超過三小時的《心靈角落》，保羅湯瑪斯安德贏得坎城影展最佳導演的《戀愛雞尾酒》

  （2002），改以挑戰95分鐘的浪漫喜劇。導演邀來自己的喜劇偶像亞當山德勒飾演一名單

  身創業家，經常被家中七位姊妹揶揄的他壓抑焦躁又渴望愛情，好不容易轉角遇見愛，終

  於要結束單身的命運，沒想到卻跑來勒索集團來攪局，他該如何保衛荷包，也保住真愛？

  保羅湯瑪斯安德不僅拍出屬於自己的愛情喜劇，亞當山德勒可憐又可愛的精彩演出，更被

  許多評論家認為是他最佳表演之一。



  ▎《黑金企業》（There Will Be Blood, 2007） ▎



  保羅湯瑪斯安德最具代表以及廣為人知的作品《黑金企業》（2007），影片改編美國作家

  厄普頓辛克萊作品，描述19世紀末石油能源興起之際，採銀礦工人帶著兒子來到西部墾荒

  小鎮，靠著開採地下蘊藏的石油致富，然而浮出地面上的不只有一桶桶的黑金，還有人性

  的貪婪、猜忌與腐敗。保羅湯瑪斯安德也以本片贏得柏林影展最佳導演，影帝丹尼爾戴路

  易斯歎為觀止的演技，也讓他一連獲得奧斯卡、金球獎、英國金像獎的影帝殊榮。



  ▎《性本惡》（Inherent Vice, 2014） ▎



  改編自美國作家湯瑪斯品瓊同名小說的《性本惡》（2014），保羅湯瑪斯安德森繼《世紀

  教主》再度與奧斯卡影帝瓦昆菲尼克合作，飾演一名嬉皮私家偵探，因前女友現任情人的

  離奇綁架案，一頭捲入牽涉衝浪手、皮條客、毒販、搖滾樂手和高利貸的複雜案情中。瓦

  昆菲尼克不僅展現精湛演技，與飾演機車警探的喬許布洛林精彩對戲，兩人插科打諢、針

  鋒相對，在戲謔與對社會的嘲諷憤慨間，將觀眾帶回70年代的洛杉磯，那個充滿性、毒品

  、與美國夢的年代，在對白間展現人性的真實面。



  ▎《霓裳魅影》（Phantom Thread, 2017） ▎



  保羅湯瑪斯安德森首度在美國海外拍攝的《霓裳魅影》（2017），以1950年代的戰後倫敦

  為背景，邀來影帝丹尼爾戴路易斯再度合作，這回雙手洗去烏黑石油拾起針線，飾演一名

  與姊姊同住的知名裁縫師，抱持獨身主義他穿梭在皇室社交名流圈，直到一名年輕女子闖

  入他的生活，從未有過的愛情關係卻打破他井然有序的工作與世界。影片以細膩流暢的鏡

  頭展現藝術家一絲不苟的創作生活，在理性與瘋狂間展露愛情裡的主導與臣服。丹尼爾戴

  路易斯、絲莉蔓薇爾展現影帝后級的姊弟親情，和歐洲矚目女星維琪克雷普的三人糾纏關

  係激出暗湧火花。



  ▎《甘草披薩》（Licorice Pizza, 2021） ▎



  保羅湯瑪斯安德森以自身成長歲月為靈感的《甘草披薩》（2021），帶領觀眾重返70年代

  的美國南加州，跟著15歲的不羈童星和25歲的攝影助理東奔西闖，品嚐如甘草糖甘苦交織

  的青春初戀滋味。菲力普西摩霍夫曼之子庫柏霍夫曼和海慕樂團（Haim）艾拉娜海姆，兩

  人初登銀幕談起姊弟戀。既有妙趣橫生又諷喻十足的街景人性，也信手拈來石油危機、水

  門政治醜聞等社會政經暗流。影帝西恩潘、布萊德利庫柏、搖滾怪傑湯姆威茲等人輪番驚

  艷亮相，回首時代，訴說瞬間卻永恆的故事。



  --'
