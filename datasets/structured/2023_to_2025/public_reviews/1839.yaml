title: '[情報] 2021 金馬奇幻影展 首波片單'
content: '金馬奇幻影展K歌場《修女也瘋狂》 跨夜場威爾法洛搞笑三連發

  《冰血暴》《七寶奇謀》《神通情人夢》《飼養烏鴉》《佳麗村三姐妹》經典重現



  2021金馬奇幻影展今日（2/18）公布10部精彩片單，


  年年必秒殺的「狂歡K歌場」，除了Cult片之王《洛基恐怖秀》（The Rocky Horror

  Picture Show, 1975）將第十一度狂歡登場，今年更加碼推出奧斯卡得主琥碧戈柏紅遍全

  球的音樂喜劇《修女也瘋狂》（Sister Act, 1992），直接將戲院變成KTV，邀請觀眾和

  銀幕主角一同飆唱〈I Will Follow Him〉、〈My Guy〉、〈Shout〉等膾炙人口的金曲。


  以「週六夜現場」成名的喜劇笑匠威爾法洛，總以正經姿態詮釋令人發噱的角色，葷素不

  忌的演技，成為美國最受歡迎的喜劇演員之一。這回金馬奇幻影展特別規劃「恥度無極限

  」跨夜場，選映他以運動競賽為題的三部喜劇，包括充滿速度與激情的賽車喜劇《王牌飆

  風》（Talladega Nights : The Ballad of Ricky Bobby, 2006）、和《拿破崙炸藥》瓊

  海德攜手秀出必殺技「鐵蓮花」的《冰刀雙人組》（Blades of Glory, 2007），以及笑

  看美國花式籃球黃金年代的《灌籃大帝》（Semi-Pro, 2008）。影迷可以從深夜到清晨，

  一票看滿三部作品，見證獨樹一格的「威式喜劇」，笑翻戲院。


  奇幻首創的「影迷許願池」單元終於邀來影迷敲碗已久的《七寶奇謀》（The Goonies,

  1985）和《神通情人夢》（Electric Dreams, 1984）。前者不僅被美國國家電影保護局

  列為經典，更啟發了電玩與影集《怪奇物語》；後者超前《雲端情人》三十年，讓電腦與

  人類談情說愛。喜歡另類一點的，不可錯過名導柯恩兄弟與奧斯卡影后法蘭西絲麥朵曼充

  滿中西部風情的黑色犯罪喜劇《冰血暴》（Fargo, 1996），以及法國首部入圍奧斯卡的

  動畫作品《佳麗村三姐妹》（Les Triplettes de Belleville, 2003）。西班牙大師卡洛

  斯索拉榮獲坎城影展評審團大獎的《飼養烏鴉》（Raise Ravens, 1976）用小女孩的想像

  力顛覆父權與死亡，更是不可多得的超現實經典。


  ，更多精彩片單與周邊活動訊息將陸續公佈，請鎖定金馬官網、臉書粉絲專頁、

  Instagram，或下載金馬APP，掌握第一手消息。

  -------------------------------------------------------------------------------





  ▍《洛基恐怖秀》 ▍



  Cult片之王《洛基恐怖秀》（1975）創下影史最長上映紀錄，連演45年不輟，更年年榮登

  金馬奇幻影展秒殺王！今年第十一度上演，不論你是老影迷新觀眾，千萬不能錯過提姆柯

  瑞的放浪演出與蘇珊莎蘭登風騷登台，一起戴上手套口罩，在座位上，放開心、敞開胸，

  跟著銀幕搖擺靈魂、在心中解放肢體，展開跨越類型，超越禁忌的奇幻之旅。


  ▍《修女也瘋狂》 ▍



  奧斯卡、艾美獎、東尼獎、葛萊美獎得主琥碧戈柏紅遍全球的音樂喜劇《修女也瘋狂》（

  1992），近30年來依然為影迷津津樂道。琥碧戈柏飾演的駐唱歌手，為了躲避黑道情人追

  殺，誤打誤撞成為修女，卻也為沉悶的修道院生活帶來天翻地覆的改變。除了琥碧戈柏精

  彩的喜劇演出，電影將傳統福音結合流行搖滾樂、藍調、爵士樂的即興帶動唱的功力，更

  讓膾炙人口的〈I Will Follow Him〉、〈My Guy〉、〈Shout〉名曲傳唱至今。金馬奇幻

  影展首次K歌登場，歡迎觀眾和銀幕主角一起搖擺高歌，將戲院變成超大KTV。

  -------------------------------------------------------------------------------





  ▍《王牌飆風》 ▍



  美國喜劇泰斗威爾法洛找來好友金獎導演亞當麥凱執導的《王牌飆風》（2006），威爾法

  洛飾演從俗氣小哥躍升賽車巨星的男主角，快速成名卻讓他變得狂傲自大，不僅輕敵輸了

  比賽，還喪失了駕車的勇氣；在昔日團隊和仰慕者挺身相助下，他試著找回熱情，重返賽

  道。除了有演技女星艾美亞當斯、《芝加哥》約翰萊利、《芭樂特》沙夏拜倫科恩等超強

  喜劇卡司，數不盡的諷刺笑料，媲美《終極殺陣》的群車亂鬥，G情四溢的高潮吻戲，更

  令其他賽車電影都望塵莫及。


  ▍《冰刀雙人組》 ▍



  繼《王牌飆風》大獲成功後，威爾法洛再度挑戰運動喜劇《冰刀雙人組》（2007），與《

  拿破崙炸藥》瓊海德分別飾演風格迥異的花式滑冰選手，水火不容的兩人竟在比賽中大打

  出手，雙雙慘遭終身禁賽，意氣風發的人生瞬間崩毀。在瘋狂粉絲的建議下，兩人發現重

  回冰上舞台的唯一方式，就是組成史上首支花式滑冰雙「男」組。瘋抖性愛笑料、狂鬧同

  志曖昧，「恥」度無極限，卻也成功引爆華麗無比的激情感動。


  ▍《灌籃大帝》 ▍



  威爾法洛「運動三部曲」封關之作《灌籃大帝》（2008），以七○年代美國籃壇為背景，

  當時除了主流的NBA外，尚有一個以花俏球風和開放規則聞名的ABA聯盟。威爾法洛飾兼球

  隊老闆、教練及前鋒，堅持「秀場籃球」之道，以場中時間的笑料橋段博取球迷歡心，當

  聯盟面臨解散危機之際，他決定展開改革，為球隊謀求生路。影片請來《屍樂園》性格男

  星伍迪哈里遜，流浪者合唱團主唱安德烈3000一塊神助攻，在看似笑鬧的氣氛裡，為觀眾

  找回最初的熱情。

  -------------------------------------------------------------------------------





  ▍《七寶奇謀》 ▍



  由名導史蒂芬史匹柏原創並監製，與首部《超人》導演李察唐納合作的《七寶奇謀》（

  1985），講述邪惡建商卻想併吞小鎮，一張十七世紀的海盜藏寶圖，成為小鎮裡七個小屁

  孩捍衛家園的希望。本片被譽為少年版《印第安納瓊斯》，主角兄弟由模樣青澀的西恩艾

  斯汀、喬許布洛林飾演，華裔童星關繼威當年在台造成旋風。影片的文化影響力之大，除

  了拍攝地點年年有紀念活動，國家電影保護局也將它列為經典，更啟發了任天堂遊戲與熱

  門影集《怪奇物語》。


  ▍《神通情人夢》 ▍



  英國名導史提夫巴倫經典的科幻愛情喜劇《神通情人夢》（1984），描述帥氣建築師愛上

  美女大提琴家卻不敢表白，新買的電腦意外覺醒晉升為「智能月老」，幫他打動芳心，當

  男主角以為大功告成，卻發現電腦竟也動了感情。片中經典曲目〈The Duel〉、〈

  Together in Electric Dreams〉，以及喬治男孩領軍文化俱樂部演唱的插曲〈Love Is

  Love〉，當年反而歌比片紅，但在愛屋及烏加上日後錄影帶問世的口耳相傳，也讓本片在

  亞洲影壇掀起旋風熱潮。


  ▍《冰血暴》 ▍



  美國名導柯恩兄弟兩人經典黑色喜劇《冰血暴》（1996），描述一名小鎮汽車業務員為了

  償還巨債，竟動歪腦筋雇用綁匪劫持妻子，向有錢岳父勒索贖金，沒想到兩光綁匪假戲真

  做，事情越搞越大，身懷六甲的女警決心循線揪出犯人與主謀。柯恩兄弟將犯罪驚悚的故

  事加入獨特的血腥暴力與黑色幽默，還精彩融入家鄉明尼蘇達的美國中西部小鎮特色，不

  僅勇奪奧斯卡最佳原創劇本，導演喬柯恩也將演員妻子法蘭西絲麥朵曼推上影后寶座。


  ▍《佳麗村三姐妹》 ▍



  法國動畫名導西拉維休曼入圍奧斯卡的經典作《佳麗村三姐妹》（2003），講述法國小鎮

  裡相依為命的祖孫和忠犬，偕同參加自行車大賽的兩人，竟遇上黑幫擄走孫子，老奶奶帶

  著狗兒踏上拯救愛孫大作戰，還遇到傳說中的「佳麗村三姐妹」一同加入冒險。獨特的畫

  風設計與細膩的情節安排，熱血冒險再加上跨越時空的動人親情，連狗兒都超級亮眼，破

  天荒拿下坎城影展金棕櫚狗狗獎特別提及。


  ▍《飼養烏鴉》 ▍



  西班牙電影大師卡洛斯索拉贏得坎城影展評審團大獎的《飼養烏鴉》（1976），描述在佛

  朗哥獨裁政權時期，小女孩安娜目睹母親重病身亡，認為自私外遇又橫暴的軍官父親是罪

  魁禍首，父親的意外死亡，讓她誤以為是自己的下毒計畫奏效，當姑媽成為新監護人時，

  她決定故技重施。曾在維克多艾里斯《蜂巢幽靈》中表現亮眼的安娜托蘭，精湛詮釋女孩

  的純潔、邪惡與哀傷，一人分飾兩角的卓别林之女裘拉汀卓别林，演繹功力更為銀幕經典

  。


  --'
