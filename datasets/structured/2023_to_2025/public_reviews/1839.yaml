url: https://www.ptt.cc/bbs/movie/M.1686134640.A.DF1.html
title: '[新聞] 韓國富川奇幻影展6月底登場 擴大與台影'
content: '韓國富川奇幻影展6月底登場 擴大與台影界合作


  新聞網址：



  （中央社記者廖禹揚首爾7日專電）韓國富川國際奇幻影展將在6月29日登場，除邀請台灣

  演員柯震東首次執導的「黑的教育」等台灣作品參展，今年也與文策院等台灣文化、電影

  等相關單位合作，推出多種交流與支援計畫。


  以科幻、恐怖等類型電影為主的富川國際奇幻影展將在6月29日至7月9日登場，邀集51國

  共262部作品放映，影展組織委員會執行委員長申哲今天在記者會上表示，電影面臨的環

  境變化速度越來越快，前幾年的疫情也為韓國電影、劇場造成極大危機，今年影展為尋求

  新的改變，化危機為轉機，以「電影＋」的核心概念進行整體策劃。


  申哲說明，「電影＋」代表從電影與K系列影集、K-pop、K-webtoon等大眾文化的結合，

  電影產業與整體文化環境的變化角度來討論韓國電影的當前與未來；繼去年新設系列影集

  獎的嘗試後，今年攜手韓國漫畫振興院，研討韓國漫畫等多種文化形式與電影結合的可能

  性。


  台灣文化內容策進院（TAICCA）今年獲選為富川影展的亞洲類型電影產業平台B.I.G的新

  贊助方，參與亞洲奇幻電影製作網絡、怪談CAMPUS等電影支援企劃；台北市電影委員會總

  監饒紫娟也獲邀參與30日的made in Asia論壇，就活化亞洲電影合作主題進行討論。


  影展首席選片人金英德指出，富川影展與台灣相關單位的合作逐漸擴大，台韓電影人才、

  作品交流都持續進行，「文策院也相當積極，我認為未來與台灣的合作機會將更多，特別

  是共同製作等可能性」。


  金英德說，雖然華語圈電影的幽默與韓國不太一樣，但台灣電影獨有的感性在韓國市場很

  能引起共鳴，並稱讚台灣近年不斷推出很多有特色的類型電影，希望能推動更多台韓的原

  創作品與電影合作。


  今年影展除競賽單元「富川Choice」與「韓國奇幻電影」外，設計多樣主題企劃，除入選

  富川Choice的黑的教育，屍舞、浮游、One Way Ticket、遺留、紅尾巴、無法離開的人等

  台灣作品都將在影展放映。


  其中「遺留」、「紅尾巴」與「無法離開的人」都是結合VR技術的新型態作品，獲富川影

  展選入結合最新技術創作的Beyond Reality單元。富川影展也正與高雄影展商議在沈浸式

  影展單元上的合作。


  富川國際奇幻影展今年開幕作將播放美國導演Ari Aster新作「寶可惡夢」（Beau Is

  Afraid），閉幕將由日本導演恐怖大師清水崇新作「大家的歌謠」畫下完美句點。（編輯

  ：高照芬）1120607


  --'
