url: https://www.ptt.cc/bbs/movie/M.1451525790.A.68D.html
title: '[討論] 史奴比跟紅男爵的幻影'
content: "史奴比這部片子,主角其實有兩個\n一個是人類,一個是狗\n\n劇情大約是兩個主線\n人類的就是一個很魯的小孩要泡妞\n狗的就是一個空戰英犬救美的故事\n\
  \n其中史奴比的對手是紅男爵\n事實上,就一個兒童來看的片子\n紅男爵其實我覺得很詭異\n\n作者沒說紅男爵是誰,不過大家都知道他是誰\n\n\n他的紅色Dr1是他最後一款開的飛機\n\
  他開了大約兩個月就戰死了\n\n在片子裏面他永遠是一個幻影\n史奴比總是永無止盡的追逐這個幻影\n電影裡空戰鏡頭其實極為考究\n福克Dr1爬升故意失速擺脫敵人的技術\n\
  也只有三翼機做的出來,所以這類飛機常常用作特技表演\n也只有到最近Su-27或F22才可以有類似特技表演\n\n我以為最後會有一場正面對決\n不過老實說,紅男爵是光明正大把史奴比打下來\n\
  史奴比弄下紅男爵士是\n圍毆+丟垃圾+鳥飛過去拆螺絲+拆升降翼+破壞尾翼\n最後飛機失速墬下,彷彿看到利多芬死前那一幕,失速落下一樣\n\n利多芬的死亡\n\n\
  \n\"里希特霍芬於1918年4月21日早上11時在索姆河\n（Somme River 49°56′0.60〃N 2°32′43.71〃E）附近的莫蘭角（Morlancourt）飛行\n\
  時被一顆.303口徑子彈擊中後身亡。\n當時里希特霍芬正追逐一架隸屬英國皇家空軍第209中隊由加拿大飛行員威勒弗立·美爾\n（Wilfrid May）駕駛的索普威思駱駝戰鬥機。\n\
  在轉彎時里希特霍芬發現自己被另一架由加拿大飛行員\n阿瑟·布朗（Arthur Brown）駕駛的駱駝戰鬥機跟隨。在紅男爵轉頭確認尾隨的\n駱駝式戰鬥機時，一顆致命的子彈自布朗的方向射出，\n\
  擊中他的右下腹後對角穿透其胸腔並在他的左乳頭下方留下一個狹長的傷口。\n\n里希特霍芬於一處由澳大利亞皇家部隊（Australian Imperial Force）\n\
  控制的地區勉強著陸，著陸後他的福克戰鬥機仍然保持完好。\n目擊者指當他們趕抵戰機旁時，里希特霍芬仍然活著，一會之後才死去。\"\n\n因為他是空戰英雄,也是名氣很大的人物,他的死經過很詳細的調查\n\
  不過誰最後殺死他有好幾個說法,有人說是被飛機打下來的\n有人說是被防空部隊擊中的,也有說是被一個士兵擊中的\n\n死後英國人用軍禮隆重下葬,這是對一個騎士的敬意\n\
  那時開飛機的還有像是中古世紀騎士的觀念\n雖然是戰爭,但是應有的精神還是要有\n\n對照20年後的戰爭,蘇聯士兵強姦至少200萬德國女人\n這種精神已經被殘酷的民族戰爭取代了\n\
  \n不過電影裡紅男爵有沒有死,不知道\n因為他本來就是一個幻影,他穿透兩個主線\n狗的主線他只是被擊墬,人的主線,他是一個只會壞事\n到處攪爛東西的模型飛機\n\
  \n紅男爵就像有些越戰電影的越共\n永遠只是忽然冒出來,看不到臉,忽然攻擊忽然消失,鬼魅一樣\n在我看來作者其實是利多分的粉絲\n我當時奇怪,這東西會不會有政治不正確?\n\
  \n在美國而言,德裔後代大概有5000萬人以上\n\n但是好萊屋永遠都是猶太觀點\n舒茲應該是德國姓,同樣是德國空戰英雄\n如果放上去的是這幾個呢?\n\n哈特曼\n\
  \n擊落351架,在蘇聯擊中營關10年\n沒被蘇聯人弄死很命大\n放回去後\n哈特曼在回到德國後擔任了第七十一里希特霍芬戰鬥機聯隊（JG 71）的首任司令官\n\
  沒錯,就是我們紅爵士的聯隊\n\n漢斯·約阿希姆·馬爾塞\n\n擊落158架,戰死非洲\n被稱為「非洲之星」（Stern von Afrika）\n擊落的151架是英國人\n\
  一般認為擊落西方國家的比較困難\n他是德國擊落西方國家戰機最多的人\n\n阿道夫.格蘭特\n\n30歲昇到中將,擊落104架\n最後賭爛希特勒,被解職後又跑回去開戰鬥機\n\
  戰後跑去阿根廷,阿根廷收留一票德國戰犯\n這些人也幫阿根廷發展軍備\n在1950年代,阿根廷軍事實力因這些人,有世界一流水準\n\n我想電影應該不用演了,爭議會很大\n\
  \n在紅男爵的背後,主角們對天空的憧憬\n一個永遠追逐一個幻影\n一個永遠在放不起風箏\n史奴比狗屋幻化成飛行器跟紅男爵空戰\n或者是說一個是現實,一個是內心的渴望?\n\
  \n--\n\n我很確定作者其實很巧妙的避開政治正不正確的問題\n\n3:32秒跟3:33秒你可以看到紅爵士飛機上\n德國空軍的鐵十字不見了\n只用一條白底黑條紋帶過\n\
  機尾沒漆鐵十字\n\n片段2\n\n\n第20秒時\nDR1返頭俯衝跟狗屋交會時\n機尾跟尾翼有漆白底十字\n利多分的飛機塗裝像這樣\n\n史奴比裏的紅爵士尾翼上的十字其實不完全是德國的鐵十字\n\
  而且那一格瞬間,要放慢到0.25被才看的到\n*補充一下 這片段第9秒時機尾有掃過鏡頭\n此時機尾還是用白底黑色直條代替鐵十字\n我想是因為這時人眼還看的到\n\
  到第20秒時DR1跟狗屋交會時,機尾很奇妙的出現十字標誌了\n而不是原先的白底黑直條\n\n現在問題來了\n\n第一:在肉眼還算可以看的到時\n紅爵士的機翼上看不到鐵十字\n\
  用一條白底黑條紋代替\n而且本來尾翼是紅的沒標誌\n而在俯衝高速瞬間\n十字標出現在尾翼,但是又有點變形\n不是真正的鐵十字,似乎又很技巧的避過的這問題\n\n\
  第二;也許有人會說\n這只是幻想,只是稍微借用現實的東西而已\n但是同盟國部分可是大喇喇秀出英國空軍的標誌\n英國空軍的標誌像個箭靶一樣\n毫不避諱\n主角房間掛一台英國飛機塗裝正常\n\
  \n所以說\n作者不正是偷渡了什麼嗎?\n\n                                   12/31 11:54"
