title: '[情報] 2024 金馬奇幻影展 首波片單'
content: '金馬奇幻影展推出柯恩兄弟導演專題《血迷宮》40週年導演版4K修復重登銀幕

  法蘭西絲麥朵曼、尼可拉斯凱吉、喬治克隆尼、約翰特托羅　影帝后拚演技

  影迷許願《新‧里見八犬傳》、《似曾相識》、《奔向彩虹》經典重現



  適

  逢柯恩兄弟首部劇情長片，另外還有，囊括，以及他們等

  精彩作品。


  柯恩兄弟首度

  出手便玩轉黑色電影的《血迷宮（導演版）》（1984），將偷情的人妻與酒保、買凶殺人

  的人夫和私家偵探，展開出乎預料的結局。喬柯恩也因本片與法蘭西絲麥朵曼結為伴侶，

  後者憑《冰血暴》（1996）中冷靜辦案的懷孕女警一角躍登奧斯卡影后寶座，鶼鰈情深合

  作無間傳為影壇佳話。


  荒誕喜劇《扶養亞歷桑納》（1987）讓搶劫慣犯愛上模範女警，兩人卻為了擁有小孩鋌而

  走險，尼可拉斯凱吉和荷莉杭特把為人父母的渴望詮釋地荒謬又可愛。《黑幫龍虎門》（

  1990）則深入刻劃黑幫權力鬥爭和情愛糾葛下，人性和良知的搖擺。贏得坎城影展金棕櫚

  的《巴頓芬克》（1991），以懸疑驚悚絕妙手法展現創作者靈感枯竭的內心世界，約翰特

  托羅的精湛演出也獲得坎城影帝殊榮。


  柯恩兄弟擅長把對社會人性的諷刺調侃化為笑料，《謀殺綠腳趾》（1998）透過捲入綁架

  奇案的魯蛇男子，犀利嘲諷戰爭、哲學、藝術、性別和成功人士的虛有其表，甚至吸引粉

  絲以主角為名創立教派，號召70萬信眾追崇，前所未見。好看又好聽的音樂喜劇《霹靂高

  手》（2000），喬治克隆尼率領天兵罪犯踏上胡鬧惡搞的尋寶之旅，影片不僅入圍超過40

  個影展及獎項，更打敗巴布狄倫、U2勇奪葛萊美獎年度最佳專輯。




  。，搭配「帽子歌后」鳳飛飛膾炙人口的主題曲，近半世紀依然魅力無窮。俊男美女的

  吸睛演出，膾炙人口的音樂，東西方浪漫愛情經典一次滿足。



  2024年金馬奇幻影展將於4月12日至21日展開，選片指南將在3月26日舉辦，並於3月31日

  正式開賣。更多精彩片單與周邊活動訊息將陸續公佈，請鎖定金馬官網、臉書粉絲專頁、

  Instagram，或下載金馬APP，掌握第一手消息。


  －－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－




  ▎《血迷宮（導演版）》（Blood Simple (Director''s Cut), 1984） ▎



  柯恩兄弟一鳴驚人的首部劇情長片《血迷宮（導演版）》（1984），故事描述苦悶人妻與

  酒保偷情，人夫也是酒吧老闆浮現殺機，私家偵探卻另有算計，酒保也對人妻的目的產生

  懷疑，人心讓這場謀殺不可預期。未滿三十歲的柯恩兄弟首度出手便玩轉新黑色電影，獨

  樹一幟的風格就此轟動影壇。法蘭西絲麥朵曼首登大銀幕毫不遜色，更以此片與喬柯恩結

  緣成為伴侶。今年適逢本片上映40週年，金馬奇幻影展將放映4K數位修復導演版本。


  ▎《扶養亞歷桑納》（Raising Arizona, 1987） ▎



  繼《血迷宮》驚豔影壇，柯恩兄弟的《扶養亞歷桑納》（1987）找來初出茅廬的尼可拉斯

  凱吉化身搶劫慣犯，愛上荷莉杭特飾演的模範女警，兩人從牢房走向禮堂，卻因不孕讓生

  活墜入迷惘，直到富商亞歷桑納喜獲五胞胎，重燃他們為人父母的希望，決定展開奪「寶

  」大作戰。柯恩兄弟恣意玩轉犯罪、家庭、愛情、西部等元素，在沙漠綠洲小鎮上演奶瓶

  與酒瓶齊飛，母愛與火藥連環暴走的荒誕黑色喜劇，並獲選為美國電影協會影史百年百大

  喜劇片。


  ▎《黑幫龍虎門》（Miller''s Crossing, 1990） ▎



  柯恩兄弟的黑色電影《黑幫龍虎門》（1990），把故事移至美國禁酒令時代，兩個敵對幫

  派正暗中較勁奪權掌控，愛爾蘭男星蓋布瑞拜恩飾演的助手，卻與大哥的女人相戀，更奉

  命暗殺女友的兄長，在權力鬥爭和情愛糾葛下，他的人性與良知展開搖擺。柯恩兄弟將他

  們對黑色電影的喜愛融入其中，除了向法國黑色電影大師梅爾維爾和《教父》致敬，獨特

  的類型風格、吸睛的攝影美學，加上鮮明人物和犀利對白，被英國〈衛報〉評為有史以來

  最佳犯罪電影之一。


  ▎《巴頓芬克》（Barton Fink, 1991） ▎



  一舉贏得坎城影展金棕櫚獎、最佳導演、男主角三大獎的《巴頓芬克》（1991），柯恩兄

  弟以自身創作經驗為靈感，講述紐約劇作家巴頓芬克到好萊塢挑戰電影編劇，不僅陷入寫

  作瓶頸，還捲入莫名其妙的謀殺案，生活與創作都落入難以理解的處境。柯恩兄弟將作家

  對於靈感消失、自我掙扎的描繪針針到肉，從寫實的心理驚悚到宛如宗教式寓言，美國男

  星約翰特托羅的精湛演出，讓總是擔綱配角的他登上坎城影帝寶座。


  ▎《冰血暴》（Fargo, 1996） ▎



  柯恩兄弟的經典黑色喜劇《冰血暴》（1996），描述汽車業務員為償還巨債，竟雇用綁匪

  劫持妻子，向有錢岳父勒索贖金，沒想到戲真做，事情越搞越大，身懷六甲的女警決心循

  線揪出犯人與主謀。柯恩兄弟將犯罪驚悚的故事添入獨特的血腥暴力與黑色幽默，精彩融

  入美國中西部小鎮特色，不僅贏得奧斯卡最佳原創劇本，也讓劇中堪稱最強孕婦的法蘭西

  絲麥朵曼勇奪首座奧斯卡。


  ▎《謀殺綠腳趾》（The Big Lebowski, 1998） ▎



  柯恩兄弟被視為Cult片經典的《謀殺綠腳趾》（1998），故事背景來到美國洛杉磯，一名

  與富豪同名的邋遢無業男，興趣是打保齡球再來杯White Russian調酒，處世態度隨性肆

  意，卻意外捲入一起綁架奇案，富豪妻子、德國殺手、女藝術家，連暴躁隊友都來攪局，

  但他只想趕快結束繼續躺平。柯恩兄弟透過看似魯蛇的主角，犀利嘲諷戰爭、哲學、藝術

  、性別和成功人士的虛有其表。迷幻的視覺語言，鮮明的角色形象，不僅被傳奇影評人羅

  傑艾伯特列為「偉大電影」，更有粉絲創立教派吸引70萬信眾追崇，影響力歷久不衰。


  ▎《霹靂高手》（O Brother, Where Art Thou? , 2000） ▎



  柯恩兄弟把帥氣男星喬治克隆尼化身美國南方罪犯的音樂喜劇《霹靂高手》（2000），將

  希臘史詩〈奧德賽〉挪移至美國經濟大蕭條的密西西比，找來喬治克隆尼搭檔約翰特托羅

  、提姆布雷克尼爾森，三個天兵罪犯展開荒謬絕倫又胡鬧惡搞的尋寶之旅。出色的角色演

  繹、悅耳的鄉村藍草福音，加上政治社會的犀利嘲諷，不僅讓本片創下柯恩兄弟當時的票

  房新高，入圍超過40個影展及獎項，更打敗巴布狄倫、U2勇奪葛萊美獎年度最佳專輯，掀

  起一波討論風潮。


  －－－－－－－－－－




  ▎《新‧里見八犬傳》（Legend of the Eight Samurai, 1983） ▎



  日本名導深作欣二的劃世代經典《新‧里見八犬傳》（1983），將作家鎌田敏夫同名神怪

  小說搬上大銀幕，找來甫以《水手服與機關槍》聲名大噪的藥師丸博子，聯手影帝真田廣

  之共譜宿命愛戀，百年世仇、世紀情愛，忠犬降妖伏魔，一場華麗之役即刻開戰。深作欣

  二巧妙結合東方傳奇、西方美學、古裝奇幻，還破天荒邀請美國歌手約翰班諾演唱主題曲

  。金馬奇幻影展特別邀來4K修復版重返大銀幕，前衛風格與華麗視覺震撼絲毫未減。


  ▎《似曾相識》（Somewhere in Time, 1980） ▎



  吉諾史瓦克執導的愛情電影經典《似曾相識》（1980），堪稱穿越電影先驅。以《超人》

  成名影壇的克里斯多夫李維，從1980年穿越時空回到70年前與美麗的珍西摩爾相遇，展開

  一段穿越時空的動人愛戀。唯美的影像、浪漫的劇情，搭襯別緻講究的年代服飾，以及傳

  奇電影配樂家約翰巴瑞打造的古典抒情配樂，讓觀眾徜徉其中，如夢似幻。雖然當年上映

  時票房不如預期，日後卻在電視播出引發熱烈回響，重新上映更是轟動一時，躍為影史經

  典。


  ▎《奔向彩虹》（The Love Affair of Rainbow, 1977）  ▎



  金馬奇幻影展曾重映經典瓊瑤電影《我是一片雲》，高潮迭起的劇情吸引年輕影迷朝聖，

  一票難求。當年同期上映的《奔向彩虹》（1977），一樣是瓊瑤監製，秦祥林飾演以寫作

  為志的富二代，邂逅美麗的山中姑娘林青霞，兩人共結連理，女方卻因身分不被男方長輩

  認可，直到大姑獻策將她大改造，化名成為時尚新星，夫妻間卻開始有了裂痕。純樸山林

  與五光十色的都市對比，映襯主角的自我追尋和虛榮名利的抉擇難題。女神林青霞美不勝

  收的多樣造型，搭配「帽子歌后」鳳飛飛演唱膾炙人口的主題曲，近半世紀重登大銀幕，

  依然魅力無窮。


  --'
