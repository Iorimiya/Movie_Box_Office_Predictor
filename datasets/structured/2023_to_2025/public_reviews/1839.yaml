title: '[好雷] 2015金馬奇幻影展 寶萊塢之大帥出任務'
content: '寶萊塢出品 果然不同凡響


  好雷吧 好想再看第二次!

























  雖然看的這場有些時刻，字幕竟然跟畫面不同步

  有點掃性


  另外查了資料

  看到是翻拍2010年的騎士出任務

  湯姆克魯斯跟卡麥蓉狄亞主演的電影

  騎士出任務還沒看過

  所以沒有共鳴，改天再找來看


  不過整體上還是相當另人感動!

  片名為大帥出任務 果然動作場面整個大帥啊!!!!!

  男主角超帥!在海上追逐靠著某個機器飛起來那一段超好笑XD

  快速道路上的槍戰也很精彩!

  整部片就一直看他在耍帥就夠了!!!!!!!!!

  女主角也超正!

  劇情裡面的跑酷畫面也超帥!!!!雖然不是很多



  另外一片藍海加沙灘的場景整個超美的>////////////<

  女主角跟她奶奶住的的雪家也好美阿!!

  還有巨大雪迷宮還有女主角的連身玫瑰裙

  也立即讓人聯想到鬼店XD!

  掉落海裡被拉起來那邊還不小心笑出聲來

  是在模仿鐵達尼號嗎?



  看完寶萊塢之大帥出任務之後(布拉格好美!)

  應該是繼

  寶萊塢之花天走地

  寶萊塢愛情特快車

  愛的自由公路

  個人再次覺得

  場景畫面讓人狂加分的一部寶萊塢電影!!


  習慣每次去影展看完印度(寶萊塢)片後

  都會去查電影原聲帶

  而這次寶萊塢之大帥出任務的原聲帶有五首歌

  沒有聽到電影裡面的一首純配樂

  有點可惜


  片中最愛的一首歌是這首!



  另人印象深刻的是

  電影裡面提到西姆拉這個地方

  也馬上讓人想到三個傻瓜

  三傻記得放屁王有提到蘭丘躲在西姆拉這個地方

  印象中是這樣

  最後面噴淚式的親情結局

  也是讓人意猶未盡

  很喜歡的一句電影中的一個詞「有朝一日」

  女主角想要一個婚姻，男主角想要一個家庭

  這些看似簡單的事情，其實並沒有，也不會這麼隨手可得

  是阿

  人生中會遇到很多煩惱的事情

  或許就是因為這樣

  所以不要再選擇逃走

  在真正想要的結局出來前

  先認真的瞭解一下自己

  希望總有一天會有美好的日子


  --'
