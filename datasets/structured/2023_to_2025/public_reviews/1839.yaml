url: https://www.ptt.cc/bbs/movie/M.1528963292.A.ACB.html
title: '[問片] 睡到一半公雞跑進來'
content: '忘了在哪看的片子，

  已爬文，

  無奈該片年代久遠還是沒找到，

  希望板友幫幫忙QQ


  只看了1/3但抓不到什麼重點，

  故事是橫向發展的沒什麼主軸，

  也沒有所謂主角，

  每位角色看似有關聯但都是獨立的故事線，

  只能試著回想起幾個印象深刻的點。


  一開頭看起來像是拿破崙時代？

  士兵抓到一批人正在槍決，

  接下來就跳到現代，

  一名婦人坐在長椅上念這個故事。


  一個小女孩與他的玩伴在公園裡遇到一個怪怪的人，

  給了小女孩一疊照片並叮嚀不能拿給大人看，

  回家後小女孩把照片交給媽媽，

  媽媽看了照片後震怒罵了保母一番，

  並和丈夫一同評論那些照片，

  照片內容為一系列的建築物照。


  晚上男主人睡覺時每隔一陣就被驚醒，

  一下是公雞跑進房間，

  一下是女巫(?)近來，

  後又有郵差、鴕鳥。


  其中一位女角因父親生病，

  開車趕回老家，

  晚上在旅館休息並遇到了幾位神父OR牧師，

  其中一位進了女角房間給了她一尊聖壇之類的東西，

  隨後其他幾位牧師也進房為她禱告，

  後來鏡頭再回到女角房間時，

  看到旅館老闆、女角與牧師在聚賭還抽菸喝酒。


  一位男角與一位老婦人下榻於這間旅店，

  從對話得知兩人有親戚關係並且彼此相愛，

  男角要求婦人給他看裸體，

  婦人感到很彆扭用棉被蓋住赤裸的身體，

  男角執意掀開棉被，

  卻看到與婦人年齡不符的年輕肉體，

  (肉體看來像20歲少女緊緻、白皙，

  婦人看起來少說有50歲)


  另一位男角B邀請上段的男角A進來自己房間喝酒，

  房內還有另一位女士，

  聚賭的女角和神父們不知為何後來也加入了，

  似乎是男角B邀請來的，

  後來女士跟男角B先後進浴室換裝，

  男角穿了一條很滑稽的褲子(屁股蛋都露出來)

  在眾人面前被女士鞭打，

  一邊被打還一邊說我是豬之類的話，

  眾人看到這幕很震驚，

  紛紛逃離現場各自回房。


  然後，然後我就忘記了...

  這部片看起來蠻有年紀的而且似乎有點冷門(?


  在這裡先謝過各位了。


  大家最近多吃水果，我先去吃芒果了掰掰


  --'
