url: https://www.ptt.cc/bbs/movie/M.1710308027.A.C05.html
title: '[情報] 2024 金馬奇幻影展 開幕片&特別放映'
content: '2024金馬奇幻影展開幕片《陰陽師0》國際首映 日本名導佐藤嗣麻子來台揭幕

  袁劍偉攜新作《盜月者》重返奇幻影展 MIRROR呂爵安、盧瀚霆、姜濤拼演技


  2024金馬奇幻影展即將於4月12日至21日熱鬧展開！佐藤嗣麻子和袁劍偉兩位導演確認出席映後座談，影展也會在映

  後送上美味手搖飲品和甜點，讓觀眾滿載而歸。





  曾與金城武合作《K-20怪人二十面相》，廣為台灣影迷所知。影片講述學生時期的安倍晴明，一心想揭開父母遇害之謎，在貴族之子源博雅委

  託調查皇族奇異事件的同時，同儕也離奇死亡，各種異象謎團即將解咒，真相讓人不寒而

  慄。影片不僅，加上華麗十足的視覺特效，揭開日本最強咒術師安倍晴明的不同面

  貌。






  2016年曾以《暗色天堂》為金馬奇幻影展開幕，，從一支各方勢力角逐的

  傳奇名錶所展開的跨國任務，一邊破解密碼機關，另一頭還有黑道追殺槍戰，峰迴路轉的

  計中計劇情，絕對令人大呼過癮。



  2024金馬奇幻影展邁入第15屆，不只電影好看，豐富精彩的周邊活動也吸引影迷朝聖，每

  年超過八成滿座率，高達三萬五千次的觀影人次。為了回饋觀眾的熱情支持，本屆影展除

  了贈送「長榮航空」日本不限航點經濟艙來回機票，開幕片《陰陽師0》也獻上美味飲品

  ，每位入場觀眾即可獲得以「小人物大生活」理念聞名的台灣知名古早味手搖「龜記茗品

  Guiji」飲品一杯；特別放映《盜月者》全場也將贈送「全家便利商店minimore甜點」。

  眾多品牌聯名活動即將陸續公開。


  2024年金馬奇幻影展將於4月12日至21日展開，選片指南將在3月26日於臺北文創大樓14樓

  文創會所舉辦、3月18日12:00在官網開放報名，並於3月31日正式開賣。更多精彩片單與

  周邊活動訊息將陸續公佈，請鎖定金馬官網、臉書粉絲專頁、Instagram，或下載金馬APP

  ，掌握第一手消息。


