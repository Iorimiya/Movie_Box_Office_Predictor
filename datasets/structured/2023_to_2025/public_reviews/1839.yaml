title: '[雷] 阿米爾汗動作片-幻影殺陣Dhoom:3'
content: "雷文防雷資訊頁\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n1.影片名稱\
  \ : 幻影殺陣\n\n2.觀影時間 : 2019/06\n\n3.觀影地點 : 自宅\n\n4.觀影方式 : My Video\n\n在國中時看過心中的小星星後，就變成阿米爾汗的迷了，最近閒來無事查了維基百科，發現\n\
  居然有這部，My video又剛好特價，就來看看了，總體來說還不錯，在我心中阿米爾汗的片\n排第四(心中的小星星>三個傻瓜>來自星星的傻瓜>幻影殺陣)\n\n\
  以下有雷\n\n  綜觀來說，這部片有出神入化的魔術和劫富濟貧，飆風特攻的特技，大娛樂家的背景和歌\n舞，再加一點玩命關頭的飛車追逐，以及不可能的任務高科技裝備。\n\
  \n  故事大綱滿老套的，就是親人因為被壞人逼到自殺，主角決定報仇。故事中男主角的父親\n就是因為被只覬覦利益的銀行家逼到絕境而選擇自殺，長大的男主角決定用他的馬戲團特技\n\
  來讓銀行徹底關門倒閉。\n\n  先從片頭，一開始男主角沙席吊著繩索在大樓牆壁垂降，配上天女散花搬的鈔票，讓我想\n到飆風特攻中，在燕子洞上方美金大灑幣給在下方的貧窮村落。而銀行內部用印度文寫著:\n\
  下地獄吧，銀行家，並留下一張小丑面具，這個作風有點像怪盜基德啊!!\n\n  再來講到追逐戲中的重機，騎車走鋼索就算了，哇靠！還會變形啊！能縮龍頭鑽過車縫，\n\
  衝到河裡變水上摩托車，兩台合體變成四輪，不過在美國街道的飛車追逐戲真的很不賴啦，\n話說這部片的摩托車也太會飛了吧XD\n\n  講到印度片，自然少不了歌舞劇啦！我最愛就是剛開始，男主角穿的像鬥陣俱樂部一樣，\n\
  在戲院中的踢踏舞橋段，而其他像是女主角的表演，以及馬戲團公演也都有大娛樂家的一點\n味道在。\n\n  然後就是角色心境方面了，沙席還有一個雙胞胎弟弟沙瑪，也因為這樣才能表演出魔術的\n\
  戲法，也用這套戲法來躲避警察，不過與其說是弟弟，不如說是影子，只能存活在哥哥之下\n，不能露面，因為他是父親的秘密。所以沒有什麼朋友，而警察也衝著這點，搞出了兄弟鬩\n\
  牆的心理戰。到了最後警察同樣使用女主角這張牌來控制也愛慕他的沙瑪，所以哥哥沙席決\n定以自己作為條件，要警察放走弟弟，要弟弟和女主角一起生活。\n\n  不過當沙席跳下水壩準備自殺時，沙瑪卻抓住了他，兩人吊在半空中，看著哥哥死意堅決\n\
  ，弟弟想起了父親的話:永遠不要放開他的手，所以沙瑪最後寧可放棄和女主的生活，也要\n和哥哥死在一起，而鬆開了撐住兩人的手，一同墜入。\n\n  阿米爾汗一人分飾兩角真的很厲害，尤其飾演沙瑪，這個有點遲緩的雙胞胎弟弟時，他的\n\
  表情和肢體語言，也表現豐富，劇中一幕是哥哥假扮成弟弟，從那個看似妥瑞氏症的動作，\n加上憨厚的笑容，以及些微懼怕的姿勢，立馬轉換為嚴肅，洞察一切，自信又霸氣的目光時\n\
  ，頓時覺得被深深騙到了，這演繹天賦極高啊！\n\n總之，喜歡阿米爾汗的人，我也很推幻影殺陣這部喔！\n\n我們是神的子民，誰能打敗我們？\n在一千個希望圍繞的太陽下，\n\
  帶著鋼鐵般的決心，無懼的步伐，\n我們今天要出征，\n改寫我們的命運！ -  <幻影殺陣>\n\n--\n我叫做諾亞，是艘方舟\n\n--\n\n\n對我來說只會排到第五欸\n\
  心中的小星星 我之前有發過文了\n\n三個傻瓜 我喜歡自由灑脫的主角與填鴨式體制對抗 過著毫無拘束的生活\n\n來自星星的傻瓜 反倒是一部像宗教提出質疑的電影\
  \ 與其他宗教片大相逕庭 是一個很有意\n思的題材\n\n冠軍女兒固然不錯 阿米爾對戲的付出也很多 但只是題材有點老 一位父親希望孩子更好而\n要求孩子去做他不想的事\
  \ 對我來說有點沉悶壓力吧\n\n其實印度片我只有看阿米爾汗的片  本人主要還是看歐美片或中日韓動作片為主啦 不過\n下次有空會看 看不見的旋律"
