title: '[新聞] 金馬奇幻影展開幕片 張作驥作品「醉‧生'
content: '金馬奇幻影展開幕片 張作驥作品「醉‧生夢死」


  「2015金馬奇幻影展」的開幕片，今天(5號)正式公布將由拿下柏林影展「勝利柱獎」、

  導演張作驥的最新作品「醉‧生夢死」擔任。這也是這部電影首次和台灣影迷見面。


  　金馬獎執委會指出，這部影片以「魔幻寫實」手法，表達母親對子女過度關愛所形成的

  壓力，精鍊出色的手法贏得國際媒體和影評人一致讚賞，是今年最值得重視的電影之一。


  　除此之外，金馬執委會也同時公布今年金馬奇幻影展的「特別放映單元」影片，將放映

  王小棣、王明台和廖士涵改編的文學作品「閱讀時光：冰箱、大象、降生十二星座」。執

  委會表示，這部影片試圖透過影像魅力，帶領觀眾重新認識台灣文學，透過文字和影像的

  碰撞，也為台灣電影拓展出更多的想像空間。


  (圖:金馬執委會提供)


