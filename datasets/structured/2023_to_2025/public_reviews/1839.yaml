title: '[情報] 2023 金馬奇幻影展 神秘影片片單'
content: '金馬奇幻影展神祕影片 《寶萊塢之絕地特工》印度巨星沙魯克罕再攀巔峰

  《血色珍珠》馬丁史柯西斯也盛讚　《超感啟示路》另類科幻揚威日舞影展


  2023金馬奇幻影展將於本週日（3/26）下午一點在官網開放線上售票，今日影展公布，包括，都是奇幻影迷不可錯過的精采佳作。



  《寶萊塢之絕地特工》（Pathaan）



  《寶萊塢之大帥出任務》印度名導悉達阿南德再出手，這回《寶萊塢之絕地特工》邀來睽

  違銀幕五年的印度巨星沙魯克罕，化身特工阻止叛國傭兵恐怖威脅，聯手蛇蠍美女迪皮卡

  帕度柯妮，對抗兇殘猛男約翰亞伯拉罕，另一位天王沙曼罕也難得同台。上映首日便打破

  印地語電影的影史票房紀錄，肌肉、歌舞、以及匪夷所思的大場面，沒有最狂只有更狂，

  刷新觀眾對動作片的所有想像！



  《血色珍珠》（Pearl）



  以《鬼屋禁地》、《生人活祭》等恐怖片聞名的名導提威斯特，由金獎製造機A24出品的

  新作《血色珍珠》邀來英國女星米亞高斯主演，將鏡頭轉向1918年遭西班牙流感肆虐的美

  國德州，嚮往成為演員的農場女孩，亟欲突破家庭牢籠，因一樁意外帶來轉機，卻也陷入

  萬劫不覆的血色地獄。米亞高斯以看似純真卻又詭異的演出技驚四座，毛骨悚然。一舉奪

  得西班牙Sitges奇幻影展最佳導演、女演員大獎，連好萊塢大導馬丁史柯西斯都盛讚不已

  。



  《超感啟示路》（Animalia）



  首部劇情長片《超感啟示路》便贏得日舞影展全球劇情片評審團特別獎（相當於最佳影片

  ）的新銳導演蘇菲亞阿拉維，描繪年輕孕婦離家尋夫，在神祕力量籠罩的北非大地展開不

  可思議的超自然旅程。影片將末日災難注入靈性與哲思，以獨到視角反思自我價值、信仰

  制度與社會階級，以科幻寓言揭示世界末日也能帶來精神覺醒的重生。



  好評不斷的金馬特別企劃的「影迷新世代」活動，日前「影迷新世代－金馬奇幻影展團體

  場」活動已額滿，影展也特別保留個人名額，於4月15日舉辦入選威尼斯影展正式競賽的

  《羅馬年少時代》青少年專屬場，即日起歡迎12至18歲的影迷個別報名，詳情請見官方網

  站活動頁面。



  2023年金馬奇幻影展將於4月7日至16日在台北信義威秀與MUVIE CINEMAS展開，獨家選片

  指南將於本週五（3/24）在臺北文創大樓舉行，並於3月26日下午一點於官網售票系統開

  放售票，更多詳情請上金馬影展官方網站。


  --'
