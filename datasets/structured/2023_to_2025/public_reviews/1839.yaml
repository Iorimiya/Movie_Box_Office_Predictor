url: https://www.ptt.cc/bbs/movie/M.1431942083.A.70A.html
title: '[好雷] 奇幻影展/寶萊塢之大帥出任務'
content: "圖文影音網誌版\n\n\n\nBang Bang! - Hrithik Roshan、Katrina Kaif -\n            \
  \                     2014/10/02印度、2015年4月臺灣金馬奇幻影展上映\n\n生活單純一成不變的銀行櫃台小姐Harleen，\n\
  因為突然空虛寂寞覺得冷，一時衝動透過交友網站配對跟一名陌生男子約會，\n到了約定之日，Harleen緊張得直想落跑，\n這時俊美的Rajveer突然出現，兩人相談甚歡，\n\
  Harleen原以為自己運氣好天外飛來艷福，沒想到除了豔福竟還附送橫禍，\n約會還沒結束就冒出一堆人要追殺Rajveer，\nHarleen莫名其妙被牽連也跟著Rajveer被追殺，\n\
  一連串的飛車追逐加上子彈炸藥滿天飛，簡直一團混亂，\nHarleen的人生遭受前所未有的衝擊，\nRajveer到底是好是壞，她究竟被捲進甚麼樣的陰謀事件裡，\n\
  天知道她本來只是覺得他很帥多聊兩句而已，沒想到竟然是個紅顏禍水阿.........囧\n\n英文字幕預告\n\n\n\n----\n\n本片翻拍自湯姆克魯斯與卡麥蓉狄亞主演的賣座電影Knight\
  \ and Day(騎士出任務，2010)\n，是由Fox Star Studios(美國二十世紀福斯公司與印度星空傳媒合資在印度成立的聯營\n公司)出品的官方翻拍作品，場景橫跨希臘、泰國、阿拉伯、印度、捷克等地，動作場面\n\
  浩大。\n\n也許是美國官方盯著，本片的劇本改編得挺不錯，情節跟原版一樣輕鬆不須耗費太多腦力\n，改編後的印度版，好萊塢味濃了不少，骨子裡卻不失印度人愛家愛國愛面子的特色，\n\
  反派比原版有氣勢一些，但同樣不太聰明，\n是說反正這種歡樂片本來也沒人care反派嘛，只要看起來有點樣子就可以了XD\n\n印度版在劇情主軸跟角色背景設定上作了部分更動，例如把能源電池改成鑽石，\n\
  男女主角第一次相遇從劫機變成相親等等，\n誇張程度意外的比原版低了些(￣y▽￣)╭\n(雖然我也很喜歡原版，但我個人覺得電池跟劫機比較扯XD)，\n對男女主角之間的情愫增加過程還有兩個人的家庭都多了點著墨，\n\
  使角色性格更立體了點，動作場面也強化不少，\n不像原版很常用女主角被下藥以後的模糊視角含糊帶過(\"￣▽￣)\n\n原版好幾個重要跟好笑的梗在本片大多有保留下來，\n\
  例如貫穿全片的「有一天(Someday)」這個概念，\n很多人都跟女主角一樣，常常跟自己說\n\"有一天，我一定會去哪裡\"或是\"有一天，我一定會去做什麼什麼\"\
  ，\n但往往會被許多需求跟承諾牽絆住，到最後\"有一天\"就變成了\"沒這天\"，\n原版跟本片的女主角都很幸運遇到一個帥哥實現了她們的\"有一天\"，\n阿我們既然不是電影女主角，就只能靠自己了。\n\
  \n在選角方面，大帥跟Katrina在臉跟巴底的緊實度上毫無疑問是大勝原版XD\n不過阿湯哥跟大帥飾演這種神經病帥哥都很適合，兩人各有各的風味，\n好笑程度跟帥氣程度有不同的呈現，\n\
  個人覺得本片是繼Dhoom2(幻影神偷，2006)之後，\n又一把大帥那種帥氣逼人的感覺完整拍出來的作品，\n光是大帥在本片正式出場後的第一個動作場面，\n跳上屋頂後把墨鏡摘掉的瞬間我就被帥到心跳漏了一拍，\n\
  更不用說本片的動作場面設計跟Dhoom2裡的花拳繡腿比起來進步了十倍不只，\n舞蹈動作也是為大帥量身打造，整個就是帥氣直上雲霄衝破天際，\n害我一直看著螢幕傻笑像個阿呆一樣（￣￢￣）(同學妳口水可以擦一下嗎)\n\
  \n至於Katrina的表現就中規中矩，不好不壞，很符合本片需求，\n表現最好的地方應該是她第一次看到大帥脫衣服的時候那個表情-->(⊙▽⊙)\n換作我的話應該表情也差不多那樣XD\n\
  \n是說看完這片真心覺得Katrina怎麼可以這麼爽，印度三K天王都親過了\n(曾經跟Salman Khan交往，在Dhoom3親過Aamir Khan，在愛無止盡親過Shah\
  \ Rukh Khan)，\n大帥還親過兩遍(三個大丈夫跟Bang Bang)甚至全身上下摸透透，\n然後又把到了我心愛的小天王Ranbir Kapoor，是七世行善累積的福報嗎，\n\
  真是令我羨慕忌妒恨阿(咬手帕)\n\n\n\n\n\n本片新設計了許多原版沒有的動作戲，幾乎大部分的動作戲都是大帥親自上場，\n在泰國普吉島拍攝時，有一個特技動作是要從30英呎的高空俯衝進水面，\n\
  大帥拍攝這個動作的時候因為姿勢沒喬好， 衝進水面時頭部受到的撞擊力太大，\n當下頭整個超痛，但只是吞了止痛藥就繼續拍攝，之後一直持續有頭痛症狀，\n有一天大帥的頭突然超級劇痛，痛到止痛藥都壓不住，\n\
  緊急送醫作了斷層掃描跟核磁共振攝影的結果，確認是硬腦膜下血腫，\n隔天馬上緊急動手術取出腦中血塊，這才脫離險境。\n大帥術後恢復情形良好，休息一陣子以後就跟著老爸去跑Krrish3(奇魔俠3，2013)的宣傳行程，\n\
  跑完後又馬上回到Bang Bang劇組把落後的拍攝進度趕完，整個認真到我都流淚了Q_Q\n拍個電影拍到差點看見天國的大門，大明星真的好辛苦阿Q_Q\n\n\n\
  ~動作場面拍攝花絮~\n\n本片的動作場面請來曾參與過蜘蛛人:驚奇再起，猩球崛起，雷神索爾等電影拍攝的好萊塢\n知名特技統籌兼助理導演Andy Armstrong設計指導\n\
  Andy的相關介紹\n\n\n拍攝花絮1 動作片按慣例就是要大車小車撞一團\n\n大帥拉著電纜飛過兩台公車中間看起來好危險阿(驚)\n這年頭片酬真難賺\n\n\
  拍攝花絮2 賽車很貴所以只能開不能撞(不是吧)\n\n動作戲大帥可以自己來，\n但是在大街上開賽車這種技術活當然還是得給專業的來啦\n大帥只要負責很帥的跳上車跟跳下車就可以了\n\
  \n拍攝花絮3 男人心中都有個機車魂\n\n大帥飆車飆得很樂的樣子XD\n故意騎很快讓Katrina在後面尖叫\n\n\n\n\n在介紹光之山前，首先跟大家介紹幾款赫赫有名的英國皇室珠寶\n\
  1、The Imperial State Crown 帝國皇冠\n2、St. Edward's Crown 聖愛德華王冠\n3、The Crown of Queen\
  \ Elizabeth the Queen Mother 伊莉莎白王后冠\n4、The Sovereign's Sceptre with Cross 皇家十字權杖\n\
  5、The Sovereign's Orb 皇家皇金寶球\n\n而鑲在前開珠寶上的世界知名鑽石有兩顆：\n\n\n印度是世界上最早發現鑽石的國家，雖然產量不多，但歷史悠久。\n\
  光之山原本重約186克拉，最早的文獻記載可追溯至西元1304年，\n原屬於1083年至1323年統治印度安德拉邦的卡卡提亞王朝，\n為迄今發現歷史最古老且保存完好的切割鑽石。\n\
  1739年波斯君王納迪爾沙遠征印度，取得這顆鑽石，\n在看到它的瞬間驚呼\"Koh-i-Noor \"(波斯語，意指Mountain of Light)，\n\
  光之山名稱即由此而來。\n美鑽人人愛，隨著統治政權更迭，光之山也被搶過來、偷過去、送人報恩，\n轉了好幾手，最後在1830年轉到錫克帝國的君王蘭季德·辛格手中，\n\
  他死後10年，旁遮普省被納入英屬印度的一部份，英國訂了拉合爾條約，\n其中一條讓蘭季德的兒子把光之山送給英國維多利亞女王，\n後來光之山被鑲在了3、伊莉莎白王后冠上面。\n\
  \n\n1905年發現於南非的卡利南礦場，是迄今發現最大的天然鑽石原石，重3,106克拉，\n相當於612.2公克，英國國王愛德華七世擁有它後，將其切割為九顆，\n\
  最大顆的非洲之星ㄧ號鑲在4、皇家十字權杖上面，\n第二大顆的非洲之星二號則鑲在1、帝國皇冠上面，\n當然，非洲之星三到九號也是都在英國皇室手裡=.,=\n\n\
  綜上，這兩顆鑽石的差別之大，\n就像哥吉拉跟酷斯拉都很大隻但不是同一隻一樣唷(好奇怪的比喻)，\n考據光之山的真實歷史淵源，\n本片設定全國印度人都覺得光之山應該還給他們就不奇怪了。\n\
  \n\n\n\n全場這麼多人只有大帥沒上衣可以穿好可憐但我想說導演幹得好!!(喂!!)\n這首的舞步特別融入了舞蹈之神Michael Jackson的招牌動作向他致敬，\n\
  不用說大帥當然是肯定跳得很帥，但那件褲子是怎麼回事阿.....(=_=)\n\n\n--\n\n\n\n\n\n\n\n--"
