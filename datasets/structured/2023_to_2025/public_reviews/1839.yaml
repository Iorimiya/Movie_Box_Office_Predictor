url: https://www.ptt.cc/bbs/movie/M.1648013323.A.BD8.html
title: '[情報] 2022金馬奇幻影展 神秘影片'
content: '【2022金馬奇幻影展。神祕影片】揭曉！


  2022金馬影展將於本週日（3/27）下午一點於金馬官方售票系統開賣！

  今日加碼曝光手冊上沒有的「神祕影片」



  《不可思議但千真萬確》Incredible But True





  法國影壇邪派教主 昆汀杜皮爾 又一次巧佈疑陣！

  哆啦 A 夢的任意門和瑪利歐的水管都沒這個猛！


  結褵多年的中年夫妻，終於攢足積蓄買房。房仲介紹一幢兩層樓的郊區物件，最大的賣點

  不是房況也不是地點，而是地下室裡的神奇祕道。這個祕道不僅24 小時隨到即用，還就

  地有效。深受吸引的夫妻倆大為傾倒，人生就此歪了跑道。只聽過買菜送蔥，誰想得到買

  房還有送祕寶？有一好沒兩好，千金難買早知道，為避免走火入魔，危險動作請勿模仿，

  各位看官還請小心服用。


  法國影壇邪派教主昆汀杜皮爾又一次巧佈疑陣，以讓人完全猜不到會如何發展的奇幻設定

  ，搭檔一眾怪咖角色，開啟懸疑詭譎又妙趣橫生的奇幻旅程。比《天生蠅家》更滑稽諷刺

  ，比《鹿皮奇談》更黑暗犀利，杜皮爾再度向教徒們宣示，自己持續在荒誕電影的歪路上

  無畏前行。


  -----


  沒有披薩也沒有火箭 哭啊


  --'
