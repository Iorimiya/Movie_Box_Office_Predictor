url: https://www.ptt.cc/bbs/movie/M.1649303444.A.9D5.html
title: 'Re: [討論] 為什麼金馬奇幻影展這麼夯呀？'
content: '理由不外乎就幾個：


  1.提早看到

  我說的不是提早兩週那種

  有些電影是三個月半年後才會在台灣上映

  真的等到場次也不多 還不如先去影展看


  2.導演現場講座

  這個就不予置評

  我自己沒有很愛聽講座

  不過影迷能直接跟導演互動 當然有其魅力

  以前還辦在西門時一直想問

  "導演走進獅子林大樓時在想什麼？"


  3.台灣合法管道找不到

  雖然目前串流平台盛行

  不少影展片還是有可能看到

  但很多片還是無法 畢竟影展一次就是上百部

  印象中近年影展就好部找不到

  然後多年來我一直找不到"變態少女毒殺日記"

  好想看啊!!


  4.經典重映

  很多經典電影比我年紀還大

  就算已經看過好幾次了

  也還是想在大螢幕好好欣賞一次


  5.整體觀影品質和氣氛

  欸...這個真的很玄

  在影展裡看電影真的比較好笑

  大概是有氣氛的感染力吧

  而且絕對不會有看電影聊line的人


  以上是追影展好幾年的心得

  但金馬改到信義區之後我也有點意興闌珊

  還是喜歡西門那個混亂的感覺QQ




  --

  很常阿XD

  金馬票根有評分票選單

  記得有次我一分都沒給直接揉爛丟進去'
