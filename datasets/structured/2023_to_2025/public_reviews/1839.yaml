title: '[好雷] 奇幻影展筆記：洛基恐怖秀狂歡場'
content: "寫了很多狂歡場當天的畫面\n其實也沒什麼好講的，就是一部很酷的片這樣！\n\n網誌版：\n\n----------------------------------------------------------\n\
  \n  老實說在看到【洛基恐怖秀】這個片名的時候，我還以為是一個\n充滿血腥暴力，卻又將之當作遊戲般玩樂的異色電影，讓這部電影\n的片名雖一直存在我腦中，卻始終被害怕恐怖片的我拒於門外。但\n\
  是很神奇的是，我的想法在看過這部電影之後馬上改變了，雖然電\n影中的元素所包含的東西，個人前面所提到的幾乎都沒少，但是這\n部Ｂ級電影在結合了各種元素大鍋炒之下，呈現出的盡是一種不可\n\
  思議的美妙感！\n\n　【洛基恐怖秀】描述小布和阿珍兩人在友人的婚禮後迅速墜入愛\n河，光速互許終身，卻在開車途中遇上暴風雨，汽車爆胎，兩人前\n往附近的一座古堡求救，卻發現古堡裡的每個人看起來都好不尋常\n\
  …於是小布和阿珍這對平常到不能再平常的情侶，在古堡主人法蘭\n克博士的安排下，經歷了改變他們兩人生命的一個驚人夜晚。\n\n　整部片剛看完給我的感覺有點像鬧劇，電影裡每分每秒的演出都\n\
  是段超展開，誰知道不按就理的法蘭克博士下一秒鐘會帶給我們什\n麼樣的驚喜，也不知道這些角色們什麼時候會突然開始唱起歌來，\n總之這部片給我的感覺就是好歡樂，大概是因為在金馬奇幻影展上\n\
  看的場次是狂歡場的關係，現場的氣氛一直在漲停板的狀態，讓我\n沒有想要專心研究這部片的意思…是說我應該也研究不出個所以然\n來就是了。\n\n　其實看【洛基恐怖秀】是個詼諧有趣的鬧劇，但是結合了音樂、\n\
  喜劇、恐怖驚悚、劇情和科幻等元素於一身，卻又讓觀眾在觀影之\n餘驚喜連連大呼過癮，光這幾點就已經能夠讓人讚不絕口了，不得\n不佩服導演將這麼多元素放進電影裡面，但是又把這鍋大雜燴炒得\n\
  讓人看了津津有味。\n\n　隨著一首又一首的歌曲不斷演唱，我相信觀眾們的反應早已經驚\n訝到說不出話來，因為當時我就是這樣子，現場許多觀眾熱情的尖\n叫又鼓掌，爆米花和捲筒衛生紙不斷從天而降，這真是我從未體驗\n\
  過的觀影經驗。我敢說電影裡的小布和阿珍也一定有同樣的感覺，\n畢竟他們僅是要跟屋主借個電話叫人來修車而已，真是可憐啊XD。\n\n　其實看這種電影，有時候就是一種「爽度」的問題而已，我相信\n\
  一定還有更多影評能對【洛基恐怖秀】當中的眾多片段提出評論和\n講解，包括他在電影中對多少經典電影作了致敬，往後又有多少作\n品對這部被稱作是「cult movie」之王（或后）的經典致敬；在沒\n\
  看過這部電影前，如果你有看過漫畫【ONE PIECE 航海王】，那你\n一定會在看到法蘭克博士和「吹濕哪裡癢年會」的場景感到如此熟\n悉。或是電影的旁白邊說著小布和阿珍，以及屎博士的遭遇時，你\n\
  的腦海裡或許會冒出的是「台灣變色龍」的盛竹如；你也會看到眾\n多令人驚喜的演員在35年前演出的模樣。如果是觀影年資累積至一\n定程度，或是身為一位「重度影癡」，那麼光是看到開場紅脣緩緩\n\
  唱出的「科幻電影／一票兩片」，就會令人感覺神迷，我想這也是\n作者想要透過【洛基恐怖秀】想要對這些影片致敬的意思。\n\n　如果認真去研究的話，也一定會對電影中許多的設計大嘆真是功\n\
  力一絕，儘管許多畫面的質感就現在看來應該是有點落伍了（畢竟\n這部片也有一段時間，而且那種光影的細緻度應該也不比高畫質拍\n攝出來的電影），但是在現今看來，當中的許多場面和情節，還有\n\
  美學方面絕對還是非常的流行、前衛，甚至還有許多當代電影都還\n難望其項背的創意。這些都一定是吸引人一睹這部「奇作」的賣點\n之一。\n\n　因為是參加狂歡場的播映，現場有許多的觀眾和工作人員在電影\n\
  還沒開始之前就不斷叫囂喧嘩，聞天祥老師更高喊「如果看電影只\n能正襟危坐的請立刻出場。」讓我當時簡直無法想像接下來會有什\n麼樣的驚人演出。早在電影開始前雖然早就知道會有這些儀式（工\n\
  作人員很貼心的附上了一張小紙條ＸＤ），但是當看到扮成新郎新\n娘的工作人員出現（聽說真的是當天結婚喔！），會場狂灑爆米花\n的盛況，我大概就已經跟劇中角色一起脫序了吧，更別說接下來扮\n\
  成法蘭克博士的演員真的從出口走了進來開始四處遊走於觀眾席間\n，四處勾引男性觀眾，真是讓我驚恐又害羞（笑）。\n\n　總之，這次的【洛基恐怖秀】真的是一場很驚人的體驗，我想以\n\
  前從沒有，往後應該也不會有這樣子的觀影經驗。但是去除了這點\n，【洛基恐怖秀】光是就電影來看，本身精采的情節和讓觀眾意想\n不到的發展，絕對會讓人大呼過癮。如果你喜歡電影中有科幻、恐\n\
  怖、驚悚、歌舞、變裝、同志等元素其中之一的話，這部應該也會\n讓你看得很盡興。\n\n預告：\n\n\n--\n　　  我討厭下雨的緊繃\n對擺出彷彿要的姿態\n\
  \      \n因為要放晴的緣故陷入睡眠\n       它就會用的速度  \n  \n\n--\n◆ From: 218.34.124.232"
