url: https://www.ptt.cc/bbs/movie/M.1624861470.A.1E0.html
title: '[新聞] 瑞士紐沙特奇幻影展首度以臺灣為主題國'
content: "標題:\n瑞士紐沙特奇幻影展首度以臺灣為主題國\n\n\n\n「瑞士紐沙特奇幻影展（Neuchâtel International Fantastic\
  \ Film Festival，下簡稱\n NIFFF ）」是全球指標性的類型影展，將於 7 月 2 日至 7 月 10 日舉行。本屆以臺灣\n為主題國，推出「奇幻福爾摩沙」（Formasa\
  \ Fantastica）專題單元。文化內容策進院（\n文策院）也與影展官方共同推出 4 場線上直播論壇，期盼透過創作者之間的對談，讓國\n際觀眾更加了解臺灣豐沛的文化底蘊與影像創作實力。\n\
  \n文策院院長李明哲表示，臺灣作品在歷屆 NIFFF 幾乎都有入選，影展官方在本屆選擇以\n臺灣作為主題，足見我國在產製「類型片」方面，獲得國際展會肯定，文策院也樂見臺灣\n\
  影視作品在類型方面的優勢和特點，透過 NIFFF 被凸顯出來。李明哲強調，此次的入選\n作品，展現出臺灣在影視內容的類型發展方面，也開發出多元題材，更能從臺灣作品中看\n\
  見我們自身豐富的文化風景。\n\n近年臺灣類型電影不斷推出佳作，備受國際展會關注，為呈現臺灣當代類型電影樣貌，\nNIFFF 官方特別策劃「奇幻福爾摩沙」專題單元，選映\
  \ 16 部優秀作品，涵蓋「劇情長片\n」、「動畫短片」、「影集」與「沉浸式內容」等四大類別。在「劇情長片」方面，入選\n作品有：《揭大歡喜》、《逃出立法院》、《消失的情人節》、《狂徒》、《紅衣小女孩\n\
  》；「動畫短片」類為《多雲時情》、《缺乏名字的場所》、《雛菊》、《一如往常》、\n《長島》、《當一個人》；「影集」類為《天橋上的魔術師》1、2 集；「沉浸式內容」\n\
  類則有：《Oil邊境》、《蘚的歌唱》、《輪迴》，以及《星際大騙局之登月計劃》。\n\n為強調臺灣在未來內容產業的優勢，文策院與影展官方針對單元選片內容，於 7\
  \ 月 3 日\n至 7 月 8 日期間舉辦 4 場論壇，主題除「臺灣類型電影風貌」外，也特別安排了「沉\n浸式敘事：臺灣作為一個豐沛創作基地」、「SAUVAGE展覽之延伸座談一：臺灣沉浸式內\n\
  容作品」，以及「臺灣奇幻文學」三場論壇，介紹臺灣在「未來內容」場域的發展優勢、\n臺灣的沉浸式內容作品，以及從後端產製延伸到故事源頭的奇幻文學討論。\n\n4\
  \ 場論壇除了邀請徐漢強、黃心健、蘇柏維等入選影片的創作人擔任講者外，亦安排臺灣\n資深影評人鄭秉泓、金馬奇幻影展策展人楊晴絮、高雄電影節 VR 單元策展人李懷瑾、綺\n\
  影映畫創辦人陳思婷等臺灣「類型電影」與「未來內容」相關領域的專家與會，並由臺灣\n電影史學者倪娃法（Wafa Ghermani）及 Visual Switzerland\
  \ 總監 Laetitia Bochud 分\n別擔任主持人；而在「臺灣奇幻文學」這場論壇中，也邀請了臺灣最具代表性的魔幻寫實\n與科幻作家吳明益及紀大偉，分享臺灣精彩的奇幻文學內容。論壇將全程以線上直播的方\n\
  式進行，歡迎所有影迷與書迷朋友共襄盛舉。\n\n文策院與影展官方推出的 4 場線上直播論壇，內容資訊如下，線上直播方式請參閱\n NIFFF 官網公告。\n\n\
  \n一、臺灣類型電影風貌（The Landscape of Genre Cinema in Taiwan）\n日期：7 月 3 日（六）20:00-21:00\n\
  \n講者：柯俋森（《逃出立法院》製片）、徐漢強（《返校》導演）、鄭秉泓（影評人）、\n楊晴絮（金馬奇幻影展策展人）\n\n主持人：倪娃法 Wafa Ghermani（臺灣電影史學者）\n\
  \n\n二、沉浸式敘事：臺灣作為一個豐沛創作基地（Immersive Storytelling: The Buzzing\nHub of Taiwan）\n日期：7\
  \ 月 5 日（一）16:00-17:00\n\n講者：陳思婷 Estela Valdivieso Chen（綺影映畫創辦人）、李懷瑾（高雄電影節VR單\n元策展人、製片）、敖瀚林（文策院顧問）\n\
  \n主持人：Laetitia Bochud（Visual Switzerland 總監）\n\n\n三、SAUVAGE 展覽之延伸座談一：臺灣沉浸式內容作品（Showcasing\
  \ SAUVAGE\nEXTENDED: Part 1, Taiwanese XR at NIFFF）\n日期：7 月 5 日（一）17:30-18:30\n\n\
  講者：François Klein（《Oil邊境》製片）、黃心健（《輪迴》導演）、蘇柏維（《蘚\n的歌唱》導演）、徐漢強（《星際大騙局之登月計劃》）\n\n主持人：Laetitia\
  \ Bochud（Visual Switzerland 總監）\n\n\n四、臺灣奇幻文學（Literature of the Imaginary in Taiwan）\n\
  日期：7 月 8 日（四）20:00-21:00\n\n講者：吳明益（《天橋上的魔術師》、《複眼人》作者）、紀大偉（《珍珠》、《膜》作\n者）\n\n主持人：關首奇\
  \ Gwennaël Gaffric（法國譯者）\n\n紐沙特奇幻影展官方網站：\n\n「奇幻福爾摩沙」專題單元：\n\n紐沙特奇幻影展論壇專區：\n\n\n\n\
  \n\n新聞網址：\n\n\n--"
