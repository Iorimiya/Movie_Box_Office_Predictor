title: '[贈票] 【被愛妄想症】2018金馬奇幻影展秒殺完售'
content: '★ 2018金馬奇幻影展秒殺完售口碑爆棚

  ★ 榮獲第30屆東京影展觀眾票選獎、演員特別獎

  ★ 榮獲第27屆日本專業電影大賞最佳電影、最佳女演員、年度Best 1

  ★ 入選2018香港國際電影節

  ★ 超人氣女星松岡茉優首次主演，兩大日本奧斯卡新人賞演員北村匠海、渡邊大知共同

  演出！


  良香（松岡茉優 飾）是個開朗的女人，天真浪漫都存在腦裡，和暗戀十年的同學一

  （北村匠海 飾）在幻想世界大談纏綿悱惻的愛情，雖說這樣有點膚淺，但沒辦法，

  誰叫她現實生活戀愛和染髮次數都是零！


  喜愛蒐集絕種動物又找不到知己，反正活得開心就行。可沒想到，如此特立獨行的她

  ，卻吸引同事二（渡邊大知 飾）注意，對她展開熱烈追求，雖然二身上沒一點特質

  讓良香著迷，還是半推半就在一起，內心不由得還是想鑽回幻想世界裡去。「腦內單相

  思」和「現實甜蜜蜜」讓她舉棋不定，還是乾脆大膽告白一次，讓腦內小劇場美夢成真？


  松岡茉優初挑大樑擔綱主演，純真又帶點浪、唱作俱佳的表演，保證能讓觀眾再嚐一次戀

  愛滋味。



  --



