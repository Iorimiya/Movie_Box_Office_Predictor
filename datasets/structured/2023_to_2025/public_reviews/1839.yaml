title: '[討論]金馬奇幻影展的Surprise Film公布是RAW了!'
content: '大家一直在猜的金馬奇幻影展Surprise Film確定是《RAW》

  影展中文片名取為《肉獄》


  官網影片介紹：

  影片預告：


  肉獄 Raw


  2016 坎城影展影評人費比西獎

  2016 倫敦影展最佳首部作品

  2016 西班牙Sitges奇幻影展最佳劇情片

  2016 奧斯汀奇幻影展最佳導演

  2016 多倫多影展


  害羞的朱絲汀是出身獸醫世家的素食主義者，高中畢業後，跟隨姊姊的腳步，進入了著名

  的獸醫學校就讀。然而從新生訓練開始，就遭到血漿浴、生吞內臟等等折磨身心的試煉，

  甚至連身體都開始出現異常。直到最後，她再也無法壓抑茹毛飲血的渴望。


  血腥滿點的青春成長電影。在奇觀之外，融合幽默、驚悚的能耐，讓它竟然具備某種「雅

  俗共賞」的魅力。風格形式的高度掌握，以及性覺醒的指涉挖掘，更把恐怖類型帶入《魔

  女嘉莉》後的全新領域。坎城首映便造成轟動，無論一般影展或奇幻影展，都為之驚艷、

  興奮。法國新銳女導演茱莉亞迪古何諾，也被讚美為老掉牙的類型，注入了回春藥與強心

  針。



  被喚醒的豈只是性渴望！ ──《好萊塢報導》



  導演簡介：

  茱莉亞迪古何諾，法國導演及編劇。2011年短片《Junior》於坎城影展獲獎，2016首部長

  片作品《肉獄》於坎城影展影評人週世界首映，並獲得費比西獎。

  　


  --








  --'
