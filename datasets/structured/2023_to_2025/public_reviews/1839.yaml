title: '[情報] 2021 金馬奇幻影展 第四波片單'
content: '鬼才導演黃明志新作《辣死你媽傳人》金馬奇幻影展世界首映

  港片《不日成婚》渣男慾女大鬥法 「政治（不）正確」全新單元挑戰觀眾極限



  2021金馬奇幻影展片單陸續揭曉，今日（3/10）再公布九部精彩佳片，除了有奇幻影展必

  備的喜劇和驚悚恐怖片，本屆影展更推出「政治（不）正確」單元，大膽挑戰道德極限，

  要觀眾看得瞠目結舌，嘖嘖稱奇。


  這波吸睛片單包括馬來西亞鬼才導演黃明志最新作品《辣死你媽》續作《辣死你媽傳人》

  ，將帶著國民美食「椰漿飯」穿越時空，笑爆馬國歷史。香港賀歲票房冠軍《百星酒店》

  編劇陳茂賢首執導演筒的《不日成婚》，讓帥氣男星陳家樂、女神衛詩雅與《金都》朱栢

  康展開渣男慾女大鬥法，爆笑、驚悚、諜報、黑道共治一爐，掀開愛情的真面目。


  法式喜劇代表則有法國影壇超級天后凱薩琳丹妮芙化身「虎媽」的《野蠻糾碴隊》（

  Welcome to the Jungle），她與人類學家兒子大鬧叢林淘金部落，妙趣橫生，「笑」果

  驚人。柏林影展七十週年特別銀熊獎認證的年度必看黑色喜劇《人生檔案求刪除》（

  Delete History），把鏡頭瞄向網路社群邊緣人，這些大叔大嬸試圖把不良紀錄通通刪去

  ，荒唐捧腹之餘，也讓身處IG、FB網路世界的觀眾心有戚戚。


  影展不僅要讓觀眾笑破肚皮，還要嚇出一身冷汗。《顛父人生》德國影后桑德拉惠勒演出

  的《噩夢現形記》（Sleep），帶領觀眾走進惡夢成真的詛咒。《茉莉人生》導演文森帕

  蘭德的新作《大獵逃》（Hunted），讓古老傳說與酒吧獵豔、虐殺追逐，結合成新時代的

  兩性寓言。《陰森》（The Toll）則是透過一台車、兩個人，看似最簡單的元素，詭異到

  底。


  奇幻影展首度推出挑戰觀眾「三觀」的「政治（不）正確」單元，超「激」影片包括先鋒

  情色導演布魯斯辣布魯斯的《愛摸你愛摸我》（Saint-Narcisse），自戀的俊美小鮮肉淫

  亂揭開家族秘辛，Cult片能量融入宗教神話，尺度開到衛道人士受不了。開創冰島恐怖電

  影新紀元的《死了都要吸》（Thirst），除了血肉橫飛，吸血鬼愛食「人肉大香腸」的癖

  好，應該會教電檢搖頭，卻讓觀眾笑爆。


  2021年金馬奇幻影展將於4月9日至18日在台北信義威秀與MUVIE CINEMAS展開，選片指南

  將在3月27日舉辦，並於3月28日正式開賣，更多精彩片單與周邊活動訊息將陸續公佈，請

  鎖定金馬官網、臉書粉絲專頁、Instagram，或下載金馬APP，掌握第一手消息。

  -------------------------------------------------------------------------------


  ▍《辣死你媽傳人》 ▍



  馬來西亞鬼才黃明志繼2011年《辣死你媽》獲得影壇注目，睽違十年終於推出續作《辣死

  你媽傳人》，這回主廚黃大俠除了有餐館倒閉、敵手踢館的難題，還穿越到古代深山，跑

  到海盜、明朝都虎視眈眈的馬六甲王國，眼看多方人馬即將開戰，空有一身廚藝的黃大俠

  該怎麼辦？黃明志再度自編自導自唱自演，爆笑爛梗亂箭齊發，勁歌熱舞黃腔幹話，這次

  不只負責餐廳生意好壞，更要承擔國家歷史興滅！



  ▍《不日成婚》 ▍



  香港賀歲票房冠軍《百星酒店》知名編劇陳茂賢首部導演作品《不日成婚》，便把喜劇長

  才發揮地淋漓盡致，讓都市渣男慾女展開愛情大鬥法，猶如探戈進一步退兩步，女人怒罵

  不娶何撩，男人大喊必取不要。新一代男神陳家樂攜手宅男女神衛詩雅靚麗出擊，《金都

  》男主角朱栢康反轉媽寶形象巧扮綠葉，鬥智鬥勇，爆笑、驚悚、諜報、黑道共冶一爐，

  像極了愛情。



  ▍《野蠻糾碴隊》(Welcome to the Jungle,2020) ▍(天馬行空代理發行，預計5月上映)



  法國新銳導演雨果貝納莫齊、大衛卡維歐利首部劇情長片《野蠻糾碴隊》，便邀來法國影

  壇超級天后凱薩琳丹妮芙與亮眼新星文森德迪恩，飾演一對相愛相殺的人類學母子，把叢

  林掏金部落搞得天翻地覆。宛如探險電影新品種，神經喜劇混搭變異民族誌，國家地理頻

  道式旁白配上荒誕部落生活，形成圖文不符的驚人笑果，除了戳破資本主義的幻象泡泡，

  也以顛覆常理的黑色幽默向荷索致敬。



  ▍《人生檔案求刪除》(Delete History,2020) ▍(光年映畫代理發行)



  法國雙導班諾戴爾賓、葛斯塔夫迪科文最新作品《人生檔案求刪除》，把鏡頭瞄準網路社

  群邊緣人的中年父母，他們找來駭客要把不良紀錄通通刪去，沒想到虛擬身份比真實人生

  還難掌控。柏林影展70週年特別銀熊獎認證，年度必看黑色喜劇，法式荒謬笑點一個接一

  個，就連配樂都嘲諷得恰到好處。升級智慧生活大不易，多少人在全球化的巨輪下被直接

  輾斃，但你的敵人究竟是Google、Instagram、還是FB？雖說科技始終來自人性，但網路

  這個酷東西，真的沒那麼好駕馭。

  -------------------------------------------------------------------------------


  ▍《噩夢現形記》(Schlaf,2020) ▍



  德國導演邁克維納斯首部編導長片《噩夢現形記》，便邀來《顛父人生》德國影后桑德拉

  惠勒，挑戰睡眠障礙者的最大恐懼！不僅重複惡夢、嚴重到可能中止呼吸，直到有天發現

  夢中旅館真有其地，決定瞞著家人一探究竟，不料惡夢成真，連女兒都牽扯進恐怖的夢魘

  中，那些駭人的影像，究竟是夢還是真？宛如《鬼店》加上《逃出絕命鎮》，充滿沉靜、

  神祕又詭譎的氛圍，繼有令人尖叫的娛樂魅力，也有直視問題的勇氣。



  ▍《大獵逃》(Hunted,2020) ▍



  以獲獎動畫《茉莉人生》威震坎城和奧斯卡的導演文森帕蘭德，擅長以黑色幽默包裝社會

  議題，最新作品《大獵逃》以直球對決傳統父權，以古老傳說的巨狼解救受難少女，對照

  出飽受職場壓力、更面臨死亡危機的現代女性，只不過這回同樣逃進神祕森林的她，該相

  信巨狼還是男人？影片以原始野性褪去男女之間的偽裝；有酒吧獵豔、虐殺追逐，還有童

  話寓言的反轉趣味。一舉揭發神祕面具下最純粹的惡，以大自然迷宮為劇本，上演一場野

  蠻脫序的困獸之鬥。



  ▍《陰森》(The Toll,2020) ▍



  曾參與編寫多部驚悚作品的新銳導演麥可納德，首部劇情長片《陰森》描述一位深夜搭車

  的女子遇上了怪司機，但更毛的事接踵而至，一股神祕力量不斷挑撥素不相識的兩人反目

  為敵，憑空飛來的警告說要找收費員繳過路費，但在這鬼地方到底如何繳費？難道只能拿

  命來抵？影片透過一台車、兩個人和一座森林，便將看似簡單的劇情巧妙揉合《逃出絕命

  鎮》、《陰兒房》和《凶兆》等恐怖元素，吊足胃口，驚悚到底，不到最後一刻，不知誰

  善誰惡。



  ▍《愛摸你愛摸我》(Saint-Narcisse,2020) ▍



  加拿大先鋒情色導演布魯斯辣布魯斯新作《愛摸你愛摸我》再出招，讓自戀的俊美小鮮肉

  揭開家族祕密，擁有同樣俊美容貌的弟弟，失聯多年的女巫母親和不老女人相依相守，他

  愛她、他愛他、她愛她，淫亂到最高點，是地球毀滅，還是世界大同？華麗復仇與神聖救

  贖就要展開。影片轉化70年代魁北克Cult片能量，融入宗教與神話，將現代人著迷自拍的

  自戀文化解鎖成酷兒畸戀。極致的色情加入聖光，腐味更是濃醇香。



  ▍《死了都要吸》(Thirst,2019) ▍



  冰島人氣名導史丹佛豪爾史丹佛森、高庫爾烏法松帶來冰島恐怖新紀元電影《死了都要吸

  》，讓善心女主角意外幫「噬屌如命」的千年老gay吸血鬼解圍，對方為了報恩，決定協

  助她調查哥哥死因，還槓上的宗教組織，掀起一場腥風血雨。原汁原味的雷克雅維克系剝

  削電影，終於降臨寶島。復古的後龐克樂聲，令人身體想要躁動；低成本的視覺特效，卻

  以腦洞大開的創意，讓你懷疑自己到底看了什麼？吸血鬼大戰撒旦黨徒，血肉橫飛、笑淚

  交織，不怕你罵爆，只怕你笑岔。


  --


  --'
