title: '[討論] 2020金馬奇幻影展停辦'
content: '來自金馬影展FB


  2020金馬奇幻影展 停辦公告

  　

  親愛的影迷朋友：

  　

  經過多方討論後，原定四月舉辦的2020金馬奇幻影展，決定停辦一屆。

  　

  自一月底開始，金馬團隊便因應「嚴重特殊傳染性肺炎（COVID-19）」疫情的變化，不斷

  討論研議，調整活動方式，希望能創造一個安心的影展環境，讓影迷朋友如期參與。

  　

  除了將按規定做好體溫檢測、提供酒精消毒，也決定採取嚴格的間隔座位售票及場場消毒

  等防疫措施，甚至規劃好實名制入場方式。也取消了K歌場，並將《洛基恐怖秀》狂歡場

  改為一般放映。即使因此座位數將減少一半以上，我們還是希望可以提供影迷歡樂與美好

  的觀影經驗。

  　

  但在不斷調整與更改中，我們發現金馬奇幻影展最可貴的特質可能無法實踐，而海外疫情

  的變化也影響了部分影片的聯繫與運輸作業。為了維持影展獨有的觀影體驗和活動特色，

  也確保所有觀眾與工作人員的健康，我們決定停辦一屆。除了下半年本來就有金馬經典影

  展與金馬國際影展已在籌備，延期也會擠壓到其他影展的時間與空間，後續調整如下：

  　

  1. 原計首次於台中舉辦的放映活動，與臺中市影視發展基金會討論後決議順延至明年。

  2. 部分影展節目將移至11月的金馬國際影展或順延到下屆金馬奇幻影展。

  3. 備受期待的奇幻紀念品，則會改由其他安全便利的方式提供影迷收藏。

  　

  金馬團隊要感謝所有參展影片影人以及單位廠商的理解和支持，也謝謝影迷朋友的體諒。

  雖然疫情還在變化，但我們會持續為下一個活動努力不懈。一起加油，平安健康。

  　

  台北金馬影展執行委員會




  --'
