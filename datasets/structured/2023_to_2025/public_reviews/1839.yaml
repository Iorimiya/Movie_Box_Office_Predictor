url: https://www.ptt.cc/bbs/movie/M.1650097929.A.C99.html
title: '[好雷] 金馬奇幻影展 柯南推理夜〈跨夜場〉 '
content: "2022金馬奇幻影展「柯南推理夜」四部上映電影:\n\n《名偵探柯南：引爆摩天樓》    （1997）\n《名偵探柯南：世紀末的魔術師》（1999）\n\
  《名偵探柯南：瞳孔中的暗殺者》（2000)\n《名偵探柯南 EPISODE \"ONE\" 變小的名偵探》（2016）\n\n沒想到首次的金馬奇幻影展跨夜場是獻給柯南!！\n\
  其實這也是第一次在大螢幕上看柯南的劇場版\n\n電影開始前\n奇幻影展的主持人還在現場抽10位觀眾\n獎品是一整條的樂檸吐司!\n\n好險第一部上的是變小的名偵探\n\
  還很有精神的看\n第一個畫面一出來，全場還驚呼連連XDDD!!\n變小的名偵探，老實說這是我第一次看QQ!\n水族館，遊樂園事件，別墅事件，可以讓人更瞭解前因後果\n\
  是說在變小的名偵探中，琴酒攻擊工藤的武器，竟然有點不一樣XDD\n\n以為會是每場結束都有休息時間\n結果是直接連播變小的名偵探跟引爆摩天樓\n之後才有中場休息時間\n\
  威秀的大螢幕還有顯示倒數計時器\n\n第三部跟第四部是播世紀末的魔術師跟瞳孔中的暗殺者\n不知道為什麼會跳過第14號獵物(?\n看瞳孔中的暗殺者中後段時，昏睡次數狀態越來越多QQ\n\
  還好還是撐完全場\n從深夜23:50分進場\n到電影結束後是凌晨六點半左右\n散場後，每個人還有一份樂檸早餐可以拿\n\n觀影的過程中，好多地方都有大家的笑聲\n\
  變小的名偵探笑點滿多的!\n主題曲一出來，真的是每首都經典!!\n聽到歌曲個人覺得還可以讓人提起精神一點(?\n\n引爆摩天樓主題曲     杏子      Happy\
  \ Birthday\n世紀末的魔術師主題曲 B'z       One\n瞳孔中的暗殺者主題曲 小松未步  あなたがいるから\n\n變小的名偵探沿用了TV版的歌很讓人催淚QQ\n\
  坐在椅子上偷偷地跟著一起唱\n\nTHE HIGH-LOWS  胸がドキドキ\nZARD           運命のルーレット廻して\n\n\n柯南也算是看了一二十年的動畫\n\
  就算劇情都已經知道了\n但很多畫面一出來\n還是都會起雞皮疙瘩\n感謝金馬奇幻影展的上映\n也算圓了沒有在大螢幕上看柯南的夢\n希望之後還會有!!\n\n--\n\
  \                                     04/16 16:32"
