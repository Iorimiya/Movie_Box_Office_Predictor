title: '[評論] 聞天祥談 / 金馬奇幻影展'
content: "願聞其詳：奇幻上雲端\n\n\n\n--\n\n金馬奇幻影展在 2018 年已邁入第九屆，\n這個全台滿座率最高的售票影展一直深受新生代影迷喜愛，\n\
  因為它的形式與內容有別於傳統，為影展開發出新的品味與路線。\n趕不上影展固然懊惱，但倒不見得無法彌補，\n譬如歷屆佳片如果能藉由新管道親炙，那就別再錯過了。\n\
  \n\n1.王牌冤家 Eternal Sunshine of the Spotless Mind\n\n第六屆  經典重現\n\n《王牌冤家》有個絕妙的劇本，把科技想像力注入到永恆的愛情習題裡。\n\
  試想如果有家「忘情診所」可以幫你把上段戀情的記憶全數刪除，相信失戀者應該很樂意。\n但在忘卻悲傷的同時，那些快樂美好、刻骨銘心也一併消逝，你會不會反悔呢？\n\n\
  查理考夫曼是好萊塢最有原創力的編劇，他寫的《變腦》、《蘭花賊》、\n以及最近上映的《安諾瑪麗莎》，都讓人看到他幽默慧黠的想像力，\n以及拼貼重構的後設感，加上米歇爾岡瑞突梯有趣的視覺奇觀，\n\
  《王牌冤家》完全不是片名暗示的芭樂片，而是一部用腦用心的談情寶典。\n\n\n2.女子漢的顛倒性世界 Jacky in Women's Kingdom\n\n\
  第五屆  當代奇幻\n\n這部片的情節是如此熟悉，卻又不可思議。\n高壓集權、性別歧視、貧富差距，但可憐的「灰姑娘」竟然是個「男性」，\n豆蔻年華的他只能仰賴萬人迷的女將軍改變他的命運，因此拼死都要去參加她的舞會。\n\
  此等顛倒世界，恐怕保守派看不下去，也有人大呼過癮吧！\n但別以為編導只想「以其人之道還治其人之身」替女人出口氣。\n如果只是相煎太急，革命不過是換個身份繼續彼此壓迫而已。\n\
  \n所以本片不能破梗的結局，才真是神來之筆！\n它考驗了那些自認開創新時代的人們真正的底線；也讓我們看到誠實去愛說來簡單，\n但要在宛如槍林彈雨的世俗輿論下抬頭挺胸，卻要有被視為離經叛道的勇氣！\n\
  這部宛如天方夜譚的怪片，講的其實是現實。\n\n\n3.聽說桐島退社了 The Kirishima Thing\n\n第四屆  東瀛狂想\n\n《聽說桐島退社了》是\
  \ 2013 金馬奇幻影展的震撼彈，當時簡直熱到一票難求的地步。\n這部校園青春電影描述一個尋常下午，風雲人物「桐島」傳說退出排球隊，\n在校園裡產生了宛如骨牌效應的風暴。\n\
  它的敘事手法很特別，電影的時空有如輪迴、倒帶地不斷回溯到同一時間，\n但觀點卻不斷轉移到不同人物身上，連帶震盪了理應無關的角色。\n\n有意或無意，最後無人倖免，也一併撕裂了看似相安無事的假象，\n\
  把校園的同儕競爭、階級矛盾，在看似雲淡風輕的素描中，達到力透紙背的結果。\n除了形式特別，更成功地召喚出那段慘綠歲月的青春躁動。\n當不同的怨懟與忍耐在同一刻爆發出來時，就成了影片最奇幻的段落。\n\
  一群年輕演員表現優異，除了有「資深童星」神木隆之介、大後壽壽花，\n因《告白》受到矚目的橋本愛，高大帥氣的東出昌大，更是本片出色的璞玉。\n\n\n4.親你跟我這樣做\
  \ Hand in Hand\n\n第四屆  非一般愛情故事\n\n以涉及亂倫內容的《非一般床邊故事》在 2015 坎城影展引起騷動的華蕾莉董澤利，\n是個演而優則導的法國才女，前作《親你跟我這樣做》描述到巴黎歌劇院修理鏡子的帥哥，\n\
  和神經質的女舞蹈總監，因為一個忘情之吻而帶來同手同腳的後遺症：\n一個坐下，另一個就不能站著；一個往東，另一個就無法往西。\n不同性別、階級的人，像被詛咒的連體嬰，只好共同行動，進而一起生活。\n\
  結果從心不甘情不願，到後來無法自拔地深入對方世界，這下換成身邊的人不適應了。\n\n有趣的構想，更有趣的是華蕾莉董澤利讓銀幕下已經和她分手的英俊男星傑瑞米艾肯\n\
  來演男主角，他還因本片榮獲羅馬影展影帝，而她沒有自肥當女主，\n反而演了男主角的姊姊。銀幕上下的分與合，還真大氣啊！\n\n\n6.阿米爾罕之大搜索 Talaash\n\
  \n第四屆  寶萊塢：天王降臨\n\n以《心中的小星星》、《三個傻瓜》、《來自星星的傻瓜》在台灣建立知名度的阿米爾罕\n（Aamir Khan）向來是寶萊塢巨星中最勇於突破的。他在本片扮起滄桑刑警，\n\
  一直無法從喪子之痛復原，與妻子漸行漸遠，又在查案過程中邂逅一名神秘妓女，\n當你以為劇情就要轉往婚外情時，它卻給你意想不到的答案。\n\n這個非英雄式的角色，給予阿米爾罕展現紮實演技\n\
  而非偶像魅力的考驗；而《三個傻瓜》女主角卡琳娜卡普爾（Kareena Kapoor）\n轉演妓女，也難得散發黑色魅力。但更令人意外的是納瓦祖汀西迪庫伊\n（Nawazuddin\
  \ Siddiqui）飾演的跛腳漢，他把鏡頭帶到社會最黑暗的底層，\n也散發出小人物渴求愛與夢想的卑微光芒。\n兩位女導演芮瑪卡葛緹（Reema Kagti）、柔雅阿克塔（Zoya\
  \ Akhtar）的幕後操刀，\n無論從類型融合到社會批判，也是不遜於檯面上的超級巨星的。\n\n\n6.猜火車 Trainspotting\n\n第三屆  經典重現\n\
  \n《猜火車》被視為上世紀末的電影神作，\n影響力甚至超越導演丹尼鮑伊奪得奧斯卡的《貧民百萬富翁》。\n這部節奏異常快速的電影，每個人物都有稜有角；想像力十足，卻完全反映真實的呼吸。\n\
  從迷幻到清醒，生動刻畫了一群拒絕中產價值觀，\n寧可縱情性愛與毒品的蘇格蘭青年的叛逆行止。\n\n男主角伊旺麥奎格為了「搶救」兩粒藥丸不惜躍入銀幕上出現過最噁心的馬桶那場戲，\n\
  看過以後，這輩子恐怕都忘不了！因為它太噁，也太有創意了。\n\n\n7. 一噤到底 The Silent House\n\n第二屆  午夜驚魂\n\n我不敢保證你會喜歡這部片，但它確實很另類。\n\
  這部在 2010 坎城影展引起注目的烏拉圭電影，在 2011 金馬奇幻影展台灣曝光。\n影片描述少女隨父親到郊區房子整理打掃並留宿此處，卻因樓上傳來異響無法入睡，\n\
  父親為了安撫她而一探究竟，卻自此失去音訊，於是少女開始陷入歇斯底里，\n直到最後一刻才真相大白。\n\n本片雖是根據真實凶案改編，但更令人津津樂道的是導演古斯塔沃賀南德茲\n\
  以數位相機一「鏡」到底拍完的技巧，以及他藉此塑造的主觀視野。\n想看血腥場面就不必浪費時間，若想一探電影工具與氣氛營造的關連，\n它可能是《厄夜叢林》之後的一大突破。\n\
  \n\n8.人類之子 Children of Men\n\n第六屆  大銀幕首發\n\n你相信以《地心引力》獲得奧斯卡最佳導演的艾方索柯朗，\n前一部作品《人類之子》在台灣竟然沒上映嗎？\n\
  2015 奇幻影展的「大銀幕，首發！」單元特別引進這部電影，\n劇情描述未來世界人類因故無法生育，即將陷入滅絕危機，\n克萊夫歐文受到成為反政府首領的前妻茱莉安摩爾所託，\n\
  要幫助一名黑人女子取得通行證，因為女子懷有地球上碩果僅存的「人類之子」，\n而她也成為各方人馬爭奪的目標。\n\n後來以《地心引力》、《鳥人》、《神鬼獵人》\n\
  連續三年贏得奧斯卡最佳攝影的曼紐爾盧貝茲基，\n早在本片就已示範了行雲流水的長鏡頭運動，光看那場飛車槍戰一鏡到底的場面就值得了。\n這也是一部走在時代前面的傑作。\n\
  \n--\n\n同場加映\n\n寶萊塢之終極保鑣 Bodyguard\n\n第三屆  當代奇幻\n\n殭屍有情天 The Neighbor Zombie\n\n\
  第一屆  活屍禁區\n\n--\n\n原文結束。\n\n--\n   \n   ◥\n  \n \n  \n￣￣￣￣\n\n--"
