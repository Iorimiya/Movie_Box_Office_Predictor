title: '[新聞] 金馬奇幻影展「柯南推理夜」經典劇場版連'
content: '新聞網址：



  【金馬奇幻影展「柯南推理夜」經典劇場版連發】


  《名偵探柯南：引爆摩天樓》

  《名偵探柯南：世紀末的魔術師》

  《名偵探柯南：瞳孔中的暗殺者》

  《名偵探柯南 EPISODE "ONE" 變小的名偵探》


  金馬奇幻影展獨有的跨夜場，歷屆規劃驚悚、動作、邪典、異形到喜劇等多種類型經典，


  今年首度推出動畫類型「柯南推理夜」，選映四部《名偵探柯南》動畫劇場版代表作，包

  括：


  首部劇場版《名偵探柯南：引爆摩天樓》（1997）


  怪盜基德、灰原、平次、和葉參戰

  大銀幕的《名偵探柯南：世紀末的魔術師》（1999）


  小蘭為故事中心的《名偵探柯南：瞳孔中的暗殺者》（2000）


  以及原作者青山剛昌全面監修、紀念電視動畫開播二十週年的《名偵探柯南 EPISODE "ON

  E" 變小的名偵探》（2016）


  —　邀您一起踏上獨特奇幻影展之旅　—


  2022年金馬奇幻影展將於4月8日至17日在台北信義威秀與MUVIE CINEMAS展開，選片指南

  將在3月26日舉辦，並於 3月27日正式開賣。


  ///


  好棒


  可是沒有貝克街和迷宮的十字路蠻可惜的


  --'
