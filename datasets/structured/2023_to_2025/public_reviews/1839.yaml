title: 'Re: [討論] 為什麼金馬奇幻影展這麼夯呀？'
content: '~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  做點功課不難吧~明明今年之後會上院線的很少

  比起來正展才更有一堆要上映的結果一堆人還在搶的情況



  主要在於奇幻影展的展期更短 片子有可能場次更少

  而且奇幻的片子本來就是吸引可能更小眾卻更熱衷的一群影迷

  近幾年老片重映也很容易炒作 就變得更多人搶


  不過一開始也根本沒那麼多人 奇幻主題可以玩的把戲更多

  奇幻影展也因此有越來越多花樣 趣味跟話題


  最後才變成現在這種瘋樣啦~


  --'
