url: https://www.ptt.cc/bbs/movie/M.1426661147.A.F79.html
title: '[討論] 影痴集合！2015金馬奇幻影展來囉!'
content: '建議閱讀：(原文網址)



  奇幻影迷注意！一年一度的《2015金馬奇幻影展》即將於4/10到4/19開演囉！今年邁入第

  六個年頭的金馬奇幻影展，祭出精選單元包括：「當代奇幻」、「跟著唱翻天」、「非一

  般愛情故事」、「腥銳五夜」、「東瀛狂想」、「經典重現」、「大銀幕，首發！」等，

  帶領大家盡情徜徉於愛與自由的造夢國度。


  每次遇到這類片種多元，片單豐富的影展時，最讓影痴頭痛的莫過於＂選片＂這件大事，

  所以西小姐趕快報馬仔一下：本屆金馬奇幻影展特別在本週五（3/20）首開夜間選片指南

  講座，為大家點亮心中的選片明燈，有興趣的朋友可以上奇幻影展官方網站報名！


  2015金馬奇幻影展 選片指南：

  　－ 講者：金馬影展執行長 聞天祥

  　－ 時間：3月20日(五)19：30～20：30

  　－ 地點：臺北市青少年發展處 花漾Hana展演空間

  　　（臺北市中正區仁愛路一段17號10樓）



  本屆金馬影展中，西小姐特別喜愛『東瀛狂想』單元，從精彩片單公佈後就影魂出竅了！

  其中最想共襄盛舉的莫過於『跨夜推理活動』，聽說將一口氣放映推理大神宮部美幸耗時

  15年構思、連載9年的推理小說改編的年度大作《所羅門的偽證》前、後篇，讓影迷搶先

  一夜破案！西小姐是還蠻想感受午夜時進場，黎明前散場的獨特經驗，但這種熱血行為需

  要擁有大學時連看兩部二輪片的體力與時間，對本人現在而言真的很吃力！（幸好《所羅

  門的偽證》電影即將上映，讓搶不到票的宮部美幸書迷仍可觀看到本片）



  除了《所羅門的偽證》前、後篇外，其他片單包括：


  《極道好聲音》

  本片導演為西小姐喜歡的日本導演山下敦弘，《極道好聲音》一片更集其風格之大成，講

  述一位失去記憶的魯蛇黑道想當歌手的古怪經歷。演員除了找來當地最俗擱有力歐吉桑天

  團「赤犬」助陣外，更有傑尼斯關八人氣偶像澀谷昂、新生代演技派女星二階堂富美（西

  小姐最近很關注的一位女演員），好像會充滿戲謔關西風蠻期待的！


  《狐仙麗莎煞煞煞》

  【東瀛狂想】首度出現匈牙利電影，但本片確實充滿東瀛趣味，女主角是個幻想與日本偶

  像談天說地，卻發現自己帶衰所有跟他交往的男人，而自認「狐仙」轉世的匈牙利女子，

  宛如神怪版的《艾蜜莉的異想世界》，融合日本元素與東歐文化的情節是西小姐最感興趣

  的部份！


  《海月姬》

  改編自暢銷漫畫的《海月姬》，由【小海女】能年玲奈主演，集合了對水母如數家珍的御

  宅女、鐵道迷、三國志通、大叔控、人偶蒐集狂及腐女漫畫家，真是充滿濃濃御宅味的電

  影啊，最愛看動漫改編電影的西小姐還挺想看看真人版呢！


  《0.5mm》

  《0.5mm》被譽為2014日本最佳影片之一。劇情圍繞在一個老人看護的奇異體驗，深刻描

  繪高齡化社會下的尊嚴與慾望。主角是被日本《電影旬報》選為「日本影史百大女演員」

  的安藤櫻，她也以本片獲得藍絲帶獎、電影旬報獎、每日電影獎等影后，西小姐早已見識

  過安藤櫻爐火純青的演技，加上這麼多肯定，本片可看度不言可喻！


  《人生最後那幾件事》

  這部片中兩位主要演員岡田將生、廣末涼子都將有突破性演出，岡田將生祭出從影以來最

  大尺度，而廣末涼子則為本片勤練鋼管舞，並以感人內斂的演技獲頒日刊電影獎最佳女配

  角。




  2015金馬奇幻影展 活動資訊：

  　－ 時間：2015年4月10日至4月19日

  　－ 地點：台北新光影城（台北市西寧南路36號4樓）

  精彩片單陸續公佈，3月22日正式開賣，影痴們一起搶票吧！


  --'
