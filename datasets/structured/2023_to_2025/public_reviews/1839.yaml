url: https://www.ptt.cc/bbs/movie/M.1564489131.A.B47.html
title: '[新聞] 【殺手寓言】奪加拿大奇幻影展最佳動作片'
content: '新聞網址：



  集結「日本奧斯卡影帝」岡田准一等頂尖卡司，共同呈現讓人興奮不已的最強娛樂動作爽片《殺手寓言》，即將在8月23日於台灣爆笑上映。本片不僅榮登日本首週新片票房冠軍，更已在當地勇破16億日圓（約新台幣4.6億元）票房佳績，還在上海電影節首映時全場笑翻。本片也於上週再傳捷報，一舉擊敗《極惡對決》、《葉問外傳：張天志》等各國強片，勇奪加拿大Fantasia奇幻影展「最佳動作電影」肯定！尤其持有多張專業格鬥技武術證照的岡田准一，簡直堪稱是日本動作演員的代表人物。製作團隊更將本片提升為世界級製作規格，「加碼」找來曾參與過《神鬼認證》（

  The Bourne Identity）、《即刻救援》（Taken）系列、《露西》（Lucy）等好萊塢動作大片的動作導演艾藍費拉茲（Alain Figlarz）擔任武術指導，再加上日本富田稔領軍的動作團隊負責特技協調，簡直與岡田形成全片最強的動作金三角。在片中飾演天才殺手的岡田，也獲得艾藍的高度讚譽：「從沒見過動作這麼敏捷的演員！」也因為岡田在片中身手矯健，反而讓導演江口Kan無奈笑說：「最讓我不甘心的，就是觀眾誤以為我調快了岡田的動作場面速度！」





  講述如傳說般存在的天才殺手，必須挑戰一年內不能殺人、去當個普通人的最強喜劇《殺手寓言》，不但充滿歡樂滿點的爆笑情節、震撼到脫力的動作場面、大咖演員們的精彩演出，更榮登日本首週新片票房冠軍，目前已經吸金突破16億日圓票房（約新台幣4.6億元）佳績，吸引超過120萬民眾入場觀賞，甚至連續四週穩坐日本票房前十大名次。如今本片再傳捷報，一舉擊敗《極惡對決》、《葉問外傳：張天志》等各國強片，勇奪加拿大Fantasia奇幻影展「最佳動作電影」肯定。影展方也給予本片高度讚賞：「有別於日本經典殺手電影，岡田准一與演員們共同打造出非常讓人

  耳目一新的作品。《殺手寓言》將強而有力的動作場面，完美結合了可愛的日式幽默。」



  改編自暢銷同名漫畫的《殺手寓言》，原著作者南勝久也表示：「作品改編成真人電影，對我來說是心中的遠大夢想之一。讀過劇本之後，感受到原本因電影規格限制，不得不取捨的場面，以及有別於原作的電影版故事流程，反而讓《殺手寓言》更饒富趣味！」尤其本片交給曾獲許多獎項肯定、有「廣告界鬼才」之稱的江口Kan執導，更可說是一時之選。導演表示：「這就是一部帥氣又爆笑的娛樂電影！我想拍的就是這樣的作品！本片保留原著的有趣之處，加上電影才會有的大型動作場面、酷炫的影像表現，以及爆笑喜感連發；而以岡田准一為首的優秀演員陣容，勢必也將씊銾q影充滿刺激。請各位務必前往電影院，透過大銀幕親自感受這股熱度！」





  對導演江口Kan來說，《殺手寓言》是他首度執導漫畫改編的真人電影，他進一步表示：「搞笑跟帥氣動作場面共存，是這部電影的關鍵，我想好好刻畫這些特色，並追加電影獨特的張力場面。」有鑑於此，劇組也特地向法國動作導演艾藍費拉茲提出合作邀約。尤其艾藍曾參與過《神鬼認證》、《即刻救援》系列、《露西》等好萊塢動作大片，以真實又極具獨創性的動作設計獲得好評。他在本片擔任武術指導，再加上由日本富田稔領軍的動作團隊負責特技協調，以及日本首屈一指的動作演員岡田准一，三人形成最強的動作金三角，將各自的本色發揮到極致。



  值得一提的是，在片中飾演天才殺手的岡田，他高超的體能，也讓曾與麥特戴蒙（Matt Damon）、連恩尼遜（Liam Neeson）等好萊塢知名動作演員共事的艾藍驚訝不已，直呼：「從沒見過動作這麼敏捷的演員！」一般來說，增加肌肉量勢必會影響到敏捷度，但艾藍卻對岡田矯健又敏捷的身手嘆為觀止。尤其他在片中撂倒敵人的一連串動作，毫不拖泥帶水。對此，岡田也以淡然的一句：「職業殺手不會浪費多餘力氣」瞬間鎮服全場。也因為岡田的矯健身手，讓導演江口Kan無奈笑稱：「最讓我不甘心的，就是觀眾誤以為我調快了岡田的動作場面速度！」



  這部榮登日本首週新片票房冠軍，並榮獲加拿大Fantasia奇幻影展「最佳動作電影」肯定的年度最強爆笑鉅獻《殺手寓言》，即將在8月23日於台灣正式上映。本片劇情描述任何目標都能在6秒內解決，有如傳說般存在的天才殺手「寓言」（岡田准一飾演），是個讓黑社會聞風喪膽的狠角色。從小在「老闆」（佐藤浩市飾演）手下工作的他，與搭檔（木村文乃飾演）共同葬送無數目標。深怕樹大招風的老闆，某天命令他跟搭檔去大阪生活一年，期間不得殺害任何人，否則就要把他殺了。於是，寓言用「佐藤明」的假名，和搭檔喬裝兄妹檔，展開人生首次的普通人生活…。面對

  突如其來的嶄新生活，他雖然慢慢融入不能殺人的普通生活，但他身邊還是陸續出現想殺他的殺手，或是想請求他幫忙的人，讓他面臨兩難的抉擇。究竟被命令不能殺人的他，要如何平安度過這一年的普通人生呢？



  欲知本片最新消息，

  請上電影官方部落格

  與臉書粉絲團查詢。


  --'
