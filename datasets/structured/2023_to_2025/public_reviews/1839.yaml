title: '[討論] 金馬奇幻影展會去看哪一部'
content: '大家有決定好要看哪一部嗎

  今年第一次參與

  因為想去看媽的多重宇宙 預告很吸引我

  個人還蠻喜歡楊紫瓊的 加上這部感覺超ㄎ一ㄤ

  國外評價也很高 雖然4/22會上院線

  但想在戲院上之前先看

  還蠻喜歡台裔藝術家James Jean的這張海報



  還有閉幕的《良辰吉時》雖然是台劇

  但是侯導第一次監製影集 徒弟黃熙也很令人期待

  感覺與以往侯導拍的東西不太一樣

  從預告中看起來偏黑色幽默

  閉幕當天會一次放映最後三集

  要選這部的記得先去Catchplay+上看前面XDDD

  上面也有侯導禮包可以看



  大家選好要看哪一部了嗎

  還是在等3/26的選片指南?


  --'
