title: '[情報] 2023 金馬奇幻影展 第二波片單 '
content: '金馬奇幻影展推出「東瀛狂想」與「外星來襲」兩大單元

  年度十大 《霸權動畫！》　還有坂口健太郎、松坂桃李、清野菜名偶像新作

  另類科幻片　貓咪變殺手  香菸救世界  影子太空人



  2023金馬奇幻影展精彩片單陸續揭曉！


  新銳導演吉野耕平改編同名小說的《霸權動畫！》，找來影帝柄本佑、吉岡里帆、尾野真

  千子、中村倫也為動畫夢想奮力一搏，《進擊的巨人》「艾連」梶裕貴、《鬼滅之刃》「

  戀柱」花澤香菜等知名聲優也參與「獻聲」，精彩揭開日本動畫界的幕後故事。日本導演

  平川雄一朗改編吉卜力經典動畫的《心之谷》，由日本影帝松坂桃李與演技派女星清野菜

  名談起遠距離戀情，童話愛情加入了現實考驗，為經典增添新意。《在世界的中心呼喊愛

  情》編劇伊藤千尋執導的《謎樣的你》，則以靈幻元素包裹情感羈絆，透過坂口健太郎的

  內斂演技，走進通靈男子的神祕過往。


  日本名導武正晴率中井貴一、佐佐木藏之介兩大型男三度耍詐的開運喜劇《噓八百：浪花

  夢之陣》，這回來到大阪城破解傳奇之謎，目標轉向傳說中豐臣秀吉的幸運茶碗，百年古

  董加上致富神話，再掀風波。師從美國Cult片名導勞埃德考夫曼的日本新銳導演津野励木

  ，首部劇情長片《貓無赦》大展身手，讓貓咪為了「貓薄荷」變身成迷人卻危險的女殺手

  ，不伸利爪而改拿刀槍。



  不讓日本專美於前，，讓超級英雄「金菸戰士」用香菸置敵

  人於死地並且拯救世界，荒唐再創新高度。，瑞典天才少女在怪咖叔叔阿姨的協助下，要從外星人手中找回失

  蹤的父親，讓科幻題材染上青春色彩。


  ，講述

  為了解決在火星出任務的宇航員的人際衝突，政府異想天開招募性格相似的平民志願者組

  成影子隊員，在地球沙漠中演練角色，找出解決之道，荒謬爆笑，也發人省思。



  2023年金馬奇幻影展將於4月7日至16日展開，選片指南將在3月24日於臺北文創大樓14樓

  文創會所舉辦，並於3月26日正式開賣。更多精彩片單與周邊活動訊息將陸續公佈，請鎖

  定金馬官網、臉書粉絲專頁、Instagram，或下載金馬APP，掌握第一手消息。


  －－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－




  《霸權動畫！》（Anime Supremacy!）



  獲選電影旬報年度十大佳片的《霸權動畫！》，是日本新銳導演吉野耕平改編直木獎作家

  辻村深月同名小說的電影新作。故事講述懷有動畫夢的女孩，為了超越她所憧憬的天才導

  演，毅然辭去公務員轉戰動畫界，當她的作品終於問世，竟與強碰偶像的復出之作，誰才

  能奪下霸權贏得最後勝利？東映動畫監製，Production I.G與梶裕貴、高橋李依、花澤香

  菜等豪華聲優陣容參與，完整解密動畫幕後製作流程。影帝柄本佑、吉岡里帆、尾野真千

  子、中村倫也齊聚為夢想奮力一搏，讓動畫點燃心中火光，成為改變世界的力量。



  《心之谷》（Whisper of Heart）



  《等待，只為了與你相會》日本導演平川雄一朗將吉卜力經典動畫真人化的《心之谷》，

  將故事延伸至原著十年後，找來演技派女星清野菜名與日本影帝松坂桃李共同譜寫長大後

  的遠距離戀情。故事講述因圖書館借閱卡相識相戀的月島雫與天澤聖司，兩人許下十年約

  定完成夢想，然而十年後，面對現實考驗和迷惘未來，這回他們決定傾聽自己的聲音。影

  片保留角色原型、穿插青澀回憶，更細緻還原藝術商店「地球屋」與貓玩偶「男爵」，主

  題曲更邀來渡邊杏跨刀翻唱70年代名曲〈請給我一雙翅膀〉，帶領觀眾一同重溫動人戀曲

  。



  《噓八百：浪花夢之陣》（We Make Antiques! Osaka Dreams）



  一只珍貴茶碗究竟能引來多少風波？日本名導武正晴新作《噓八百：浪花夢之陣》，率中

  井貴一與佐佐木藏之介兩大型男三度聯手耍詐。這回來到大阪城，目標轉向豐臣秀吉的寶

  物「秀吉七品」中的下落不明的茶碗「鳳凰」，傳說收集完整就會發生奇跡。古董商試圖

  找到茶碗吸引客群，陶藝家打算重製茶碗獲利，真正的茶碗仍待找尋。除了兩位老班底拚

  演技，更加入大眼甜妹森川葵神準塔羅，傑尼斯關八安田章大揮毫畫作，與眾卡司一起破

  解傳奇之謎。



  《謎樣的你》（Side by Side）



  《在世界的中心呼喊愛情》、《春之雪》編劇伊藤千尋第二部執導作品《謎樣的你》，由

  老搭檔行定勳導演擔綱監製，坂口健太郎飾演一名擁有看見靈魂能力的男子，從東京搬往

  鄉下與女友一家同住，靠著超自然能力治癒鄰里的疑難雜症，直到某天出一名男子的現身

  ，逐漸揭開他神祕過往與內在心魔。影片巧妙探討後疫情時代人與人之間的相處模式，神

  祕元素包覆著情感羈絆，坂口健太郎一展內斂演技，與市川實日子、齋藤飛鳥激起動人火

  花。



  《貓無赦》（Mad Cats）



  師從美國Cult片名導勞埃德考夫曼的日本新銳導演津野励木，首部劇情長片《貓無赦》便

  腦洞大開展開瘋狂奇想，讓貓咪化成人型，不伸利爪改拿刀槍武器。男子的尋兄之旅遇上

  一群迷人卻危險的女殺手緊追在後，原來是為了自己手上的「貓薄荷」，血路狂殺的旅程

  背後竟深藏一段貓咪復仇記。


  －－－－－




  《抽菸很遜，會讓你咳嗽》（Smoking Causes Coughing）



  香菸有害健康，但可以拯救世界？《超能輪胎殺人事件》、《天生蠅家》法國鬼才導演昆

  汀杜皮爾這回新作《抽菸很遜，會讓你咳嗽》劇情恣意揮灑，認知徹底顛覆，荒唐再創前

  所未有新高度！故事描述一群「金菸戰士」，他們堅決不抽菸，而是用香菸裡的有害物質

  置敵人於死地。影片致敬80年代電視特攝片，復古緊身衣、落漆布偶裝、陽春機器人全登

  場，一本正經卻是廢到笑、血腥瘋狂嚇到叫，怪過寰宇蒐奇，歪到無法預期。



  《怪咖幽浮社》（UFO Sweden）



  瑞典新銳導演維克多丹內爾的科幻喜劇《怪咖幽浮社》，宛如《怪奇物語》撞上《X檔案

  》，被寄養的天才少女堅信追逐幽浮的父親沒死，是遭到外星人綁架，卻無人相信，她決

  定找上UFO協會，打算集眾人之力尋父，但這群顧著喝咖啡吃點心的怪咖叔叔阿姨們，究

  竟是豬隊友還是她最溫暖的依靠？影片小成本卻有效打造好萊塢視效場景，重現《回到未

  來》般的迷人神采，超自然元素加入溫情與幽默，堪稱瑞典的年度青春科幻佳作。



  《維京計畫》（Viking）



  《妮可睡不著》加拿大導演史提凡拉夫勒睽違8年執導喜劇新作《維京計畫》，講述中學

  體育老師加入一項秘密計畫，成為人類首趟火星任務的影子隊員，在地球上模擬千萬公里

  外的太空人日常，以解決可能的團隊問題。儘管一切像在扮家家酒，但是「太空站」生活

  的枯燥、封閉和人際摩擦，都如假包換，影子隊員能提供最佳方案，還是面臨同樣挑戰？

  影片透過異想天開的劇情，探究人類對夢想的執著和自我犧牲的底線，荒謬發噱之餘也發

  人省思。


  --'
