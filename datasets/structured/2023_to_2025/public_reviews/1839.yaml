title: '[贈票] 荷蘭導演受台北啟發電影《小玩意》特映'
content: "「台北街頭有一種非常奇特的氛圍，和我在歐洲或亞洲去過的任何地方都不一樣。我不太\n能清楚說明，但它很神秘，帶著懸疑感，甚至有些讓人畏懼。」導演王洪飛曾說過自己\n\
  2007年第一次造訪台灣時，竟無法解釋地被一種獨特的魅力所吸引。\n\n台灣對王洪飛來說有著深刻的情感，他在鹿特丹影展首映時表示，與其說是他選擇了台灣\n做為這部電影的舞台，不如說是台灣啟發了《小玩意》的誕生。片中所有以台北街頭為主\n\
  題的攝影作品，都是王洪飛自己的作品，而樂樂飾演的女孩家中開的胡椒蝦店，也是王洪\n飛在台北生活時最常造訪的愛店\n\n電影介紹>>> \n\n\n即日起至4月19日12:00前\
  \ 推文回答你想要看《小玩意》的理由\n\n\n4月19日活動結束後將抽出5位得獎者，並會公布於文內，並寄站內信聯絡得獎者領獎事宜\n。\n\n\n時間：2018/04/23\
  \ (一) 21:00\n地點：台北長春國賓影城(台北市中山區長春路176號)\n\n\n\n\nkingpigjeter、winwinwin777、salvador1988、\
  \ yuhui9184、xmasgangfox\n\n\n--"
