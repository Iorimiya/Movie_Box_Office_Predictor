url: https://www.ptt.cc/bbs/movie/M.1457405934.A.ACB.html
title: '[新聞]金馬奇幻影展網羅四大影展奇片'
content: "新聞網址：\n\n金馬奇幻影展網羅坎城、柏林、威尼斯、多倫多四大影展奇片\n賈樟柯嫡傳弟子張撼依《枝繁葉茂》一鳴驚人揭露小村靈異事件\n\n　\n\
  本屆金馬奇幻影展精彩片單陸續公佈，包羅萬象的「當代奇幻」單元，這回更網羅了坎城\n、柏林、威尼斯、多倫多四大影展多部奇片。包括曾獲坎城金棕櫚的泰國名導阿比查邦大\n\
  獲好評的《華麗之墓》（Cemetery of Splendour），勇奪坎城影展「一種注目」單元最\n佳影片的《羊男的冰島冒險》（Rams），前者遊走在夢境與現實，後者則藉由拯救羊群側\n\
  寫兄弟情仇，一冷一熱，恰巧展現截然不同的奇幻風貌。\n\n而威尼斯影展則有多達三部得獎強片參展，包括阿根廷名導帕布洛查比羅將駭人聽聞的真\n實事件搬上銀幕並榮獲威尼斯影展最佳導演的《大犯罪家》（The\
  \ Clan）；《雨人》女主\n角薇拉莉葛琳諾結合悲喜與幻想、直追阿莫多瓦與費里尼風格的封后之作《安娜的美麗人\n生》（Anna）；還有義大利電影大師馬可貝洛奇歐融合古今、意在言外的《最後的吸血鬼\n\
  》（Blood of My Blood）則贏得國際影評人費比西獎。\n\n北美最重要的多倫多影展往往是眾多大獎的風向球。拿下最佳加拿大電影獎的《愛人怪物\n》（Closet\
  \ Monster）把男孩的性認同變成極具原創性的奇幻冒險；贏得觀眾票選午夜驚\n狂獎的《超狂亨利》（Hardcore Henry）則創造出匪夷所思的視覺奇觀；要掌握國際影壇\n\
  最為驚豔的奇幻新銳，看這兩部就沒錯了。\n\n剛剛才在柏林影展「青年論壇」單元亮相就技驚四座的《枝繁葉茂》（Life after Life\n），由國際名導賈樟柯監製，嫡傳弟子張撼依把一個借體還魂的鄉野傳奇變成了直指未來\n\
  的預言，新奇大膽，屆時他也將來台出席影展，與影迷分享他的創意與觀察。\n\n\n《華麗之墓》\n若說蔡明亮能把走路變成作品，泰國名導阿比查邦則將睡眠化作藝術。阿比查邦於坎城影\n\
  展首映大獲好評的奇幻新作《華麗之墓》，講述一名在醫院照顧沉睡士兵的中年女志工，\n在病床旁如呼吸般閃爍變色的燈管下，與看似凍結的男體展開奇妙連結。本片有《極樂森\n\
  林》的大嬸、《熱帶幻夢》的士兵、《戀愛症候群》的醫院以及《波米叔叔的前世今生》\n的靈魂出竅，堪稱集大成。即使國際影壇愈來愈多人在模仿他，但百分百的阿比查邦，依\n\
  然無可取代。\n\n《羊男的冰島冒險》\n同樣在坎城影展備受矚目的還有冰島新銳導演格里莫哈科納森的《羊男的冰島冒險》，不\n僅首度代表冰島入選「一種注目」單元，更擊敗眾家名導勇奪最佳影片，之後更連掃近二\n\
  十座大獎。故事描述一對以牧羊為生的兄弟，居住在隔壁卻互不說話，只靠牧羊犬傳遞紙\n條聯繫，但隨著傳染病而來的撲殺命令，他們必須放下成見攜手合作，才能拯救寶貝羊群\n\
  。導演將看似荒謬的無情對峙，卻在危急存亡時，爆發足以融化冰雪的力量，真摯得令人\n動容。\n\n《大犯罪家》\n將八○年代阿根廷惡名昭彰的普契歐家族般上銀幕的《大犯罪家》，是阿根廷名導帕布洛\n\
  查比羅榮獲威尼斯影展最佳導演的作品，講述看似與人為善的普契歐一家，私下卻從事恐\n怖犯罪活動，他們縝密的行動卻因時局的轉變，即將東窗事發。影片不僅深入普契歐一家\n\
  的日常生活，並重現當時場景以及作案手法，即便沒有血肉橫飛，詭異的氛圍卻更教人不\n寒而慄。\n\n《安娜的美麗人生》\n曾赴好萊塢演出《雨人》、《揮灑烈愛》廣為人知的義大利影后薇拉莉葛琳諾，在與義大\n\
  利導演朱塞佩高迪諾合作的《安娜的美麗人生》中，飾演白天在片廠寫大字報提詞、回家\n要照顧流氓丈夫與聾啞兒子的女主角安娜，但她眼前的世界總是一片黑白，唯有在瘋狂的\n\
  夢境和幻覺中才有濃豔色彩，而溫柔多情的男明星像是一道光，牽引她暫時逃離惡夢。薇\n拉莉葛琳諾精湛詮釋安娜渴愛又抗拒的複雜情緒，不僅風靡去年威尼斯影展，更讓她二度\n\
  奪得威尼斯影后寶座。\n\n《最後的吸血鬼》\n即便獲得威尼影展終身成就獎，義大利電影大師馬可貝洛奇歐仍創作不輟，淬鍊其畢生美\n學的《最後的吸血鬼》，將鏡頭轉向一處待售的百年修道院，房屋仲介驚動了隱身於此的\n\
  吸血鬼伯爵，也揭開一段深藏在修道院的百年祕密。馬可貝洛奇歐將鄉野奇談混搭末世預\n言，透過戒律、咒語，直指不分時空的宗教、政治與金權墮落，備受國際影評人讚譽，贏\n\
  得威尼斯影展影評人費比西獎。\n\n《愛人怪物》\n加拿大新銳導演史蒂芬鄧恩在多倫多影展獲得滿堂彩，拿下最佳加拿大電影獎的首部長片\n《愛人怪物》，將個人成長故事搬上舞台，講述從小被迫只能展現男子氣概的奧斯卡，始\n\
  終活在出櫃的恐懼裡，唯一的知己是隻會「說話」的小倉鼠，直到率性的美少男闖進他的\n小宇宙，讓他必須面對真實的自己。除了有《少年西恩的崩壞人生》小帥哥康納傑斯普的\n\
  精彩演出，《藍絲絨》女星伊莎貝拉羅塞里尼更跨刀「獻聲」，在穿透力十足的電音配樂\n下，增添奇幻色彩。\n\n《超狂亨利》\n找來《刺客聯盟》導演提默貝克曼比托夫擔綱監製，俄羅斯新銳導演伊利亞奈舒勒一鳴驚\n\
  人的長片處女作《超狂亨利》，以GoPro運動攝影機拍攝的特殊手法引起熱烈討論。全片\n以獨特的第一人稱視角，讓觀眾化身為主角亨利，一起上山下海、衝鋒陷陣，在宛如身歷\n\
  其境的火爆激戰中挖掘事情真相。影片不僅贏得去年多倫多影展「觀眾票選午夜驚狂獎」\n，還以千萬美金的天價賣出版權引發話題。\n\n《枝繁葉茂》\n師承國際名導賈樟柯的中國導演張撼依，首部作品《枝繁葉茂》就入選柏林影展「青年論\n\
  壇」單元，技驚四座。內容描述已成孤魂野鬼的妻子，為了保護出嫁時父親贈受的一棵樹\n，決定附身於兒子體內，展開一場借身還魂兼搶救樹木的旅程。張撼依用極簡的美學，成\n\
  功打造出魔幻寫實的幅畫，不僅拍出了魂魄，連山石與動物都有靈性，是繼榮獲金馬獎最\n佳新導演的《路邊野餐》後，又一部讓人驚豔的新銳奇片。\n\n--\n\n\n\n\
  \n\n\n\n--\n                                  03/08 11:00"
