url: https://www.ptt.cc/bbs/movie/M.1573048555.A.FD8.html
title: '[新聞] 【許怨房】揚威富川奇幻影展最佳影片！'
content: '新聞網址：



  前所未見的嶄新奇幻驚悚新片《許怨房》（The Room），台灣將於11月22日搶先全美上映。本片是《黑暗文藝復興》（Renaissance）導演克利斯汀沃克曼（Christian
  Volckman）睽違13年，再度推出的最新劇情長片，並由「007龐德女郎」歐嘉柯瑞蘭蔻（Olga Kurylenko）領銜主演。全片劇情超乎想像，劇情後半的精彩反轉，更讓本片廣受富川奇幻影展、西班牙錫切斯影展、布魯克林恐怖影展等各大影展青睞，甚至揚威本屆富川奇幻影展，勇奪「最佳影片」肯定。評審團委員之一、《死亡筆記本》導演金子修介都力讚：「《許怨房》的趣味性表現絕對是最突出的！」





  《阿拉丁》的神燈只能實現三個願望，而《許怨房》的神奇房間卻能滿足你無限欲望！這部由凱文詹森斯（Kevin Janssens）與歐嘉柯瑞蘭蔻領銜主演的作品，劇情描述一對三十歲的夫妻，選擇離開城市搬進一座偏僻古宅，想要開始重新生活。不久後，兩人發現一間密室，裡頭竟能滿足他們所有的物質慾望，不論珠寶、金錢、美酒，只要隨口說出，就能直接變到眼前。於是他們索求無度，日夜放縱自己的物質渴望。直到某天，由歐嘉柯瑞蘭蔻詮釋的女主角，開始不滿足於現況，貪得無厭的下場，將讓後果不堪設想…。



  導演克利斯汀沃克曼表示，本片的特殊主題，其實來自一個簡單的想法──「真正能給人類帶來幸福的是什麼？」而他也解釋，為什麼當女主角被這房間吸引時，第一個願望就是「錢」：「如果有人問我最想要的，當然會先回答錢！因為只要有錢，我們才能擁有讓我們幸福的東西。」





  值得一提的是，《許怨房》劇情後半的反轉，無疑顛覆所有觀眾想像。導演甚至在片中使用許多象徵敘事的拍攝手法，他認為「超自然」類別的象徵手法，特別適合揭露人類的隱藏特質。本片更憑藉這樣的拍攝手法，以及刺激想像的劇情概念，陸續受到南韓富川奇幻影展、西班牙錫切斯影展、布魯塞爾奇幻影展、布魯克林恐怖影展、納沙泰爾奇幻影展、霍夫電影節、斯特拉斯堡歐洲奇幻影展的放映邀約，更揚威富川奇幻影展競賽單元，勇奪「最佳影片」肯定，就連評審團委員之一的金子修介都大讚：「雖然競賽單元中有許多優秀作品，不過《許怨房》的趣味性表現絕對是更

  加突出！」



  值得一提的是，兩位南韓知名導演，也趁富川奇幻影展期間搶先觀賞這部作品，並給予高度好評。《七罪追緝令》導演金泰均就力讚：「無法預測的劇情發展，純度高超的緊張感！」《消失的女人》導演李彥禧更不禁感嘆：「本片證明一切都能成為可能！」



  比起欲求不滿的人，更危險的是為所欲為的人！這部題材創新，並廣受國際影展青睞的《許怨房》，即將在11月22日搶先全美上映。本片描述一對恩愛的夫妻麥特（凱文詹森斯飾演）與凱特（歐嘉柯瑞蘭蔻飾演），他們曾兩度懷孕都宣告失敗。試圖重新出發的兩人決定遠離都市，搬入一棟位在紐約郊區的幽靜古宅。某天，麥特發現一間隱藏在壁紙背後的密室，並驚訝地發現，只要在那間密室當中許願，無論什麼物質上的願望都能夠實現。起初，兩人就像孩子踏入糖果屋般興奮。不過凱特卻愈來愈無法滿足於這些物質上的慾望，而開始想要一個她們夢寐以求、卻又難以得到的

  孩子。只是兩人並不知道，只要從這間密室當中創造出來的事物，一旦離開這棟房子之後，就將化為灰燼…。



  欲知本片最新消息，

  請上電影官方部落格

  與臉書粉絲團查詢。



  --'
