title: '[新聞] 跟變裝皇后一起開唱 金馬奇幻影展男兒王'
content: '跟變裝皇后一起開唱 金馬奇幻影展迎來《男兒王》K歌場


  娛樂組2021年3月25日 週四 下午1:19




  榮獲金馬獎最佳造型設計的《男兒王》，以變裝皇后為主題展開各種載歌載舞的劇情，成

  為今年金馬奇幻影展的K歌場。（金馬執委會提供）


  預計在本週日開放線上購票的金馬奇幻影展，正式宣布片單上沒有的「神祕場」，就是拿

  下去年金馬獎最佳造型設計的《男兒王》。為了符合電影劇情，放映當天會邀請變裝皇后

  到場同歡。


  描述失業中年男子，誤打誤撞成了變裝皇后、反串演出風靡舞台的《男兒王》，全片充滿

  High歌，像是英文舞曲〈I Will Survive〉被改成了閩南語版，還有〈女人花〉、〈姊妹

  〉、〈看我72變〉等。歡樂的劇情加上動聽的歌曲，完全符合「邊看邊唱」的K歌場主題

  ，因此獲選成為本屆金馬奇幻影展的「神祕場」。


  當天除了放映電影外，還請來多位台灣知名變裝皇后粉墨登場，讓觀眾彷彿身歷其境，在

  片中表現亮眼的Kiwebaby也確定隨片登場與影迷同歡，一起散播歡樂。


  Kiwebaby表示跨性別題材在台灣並非主流，所以更要堅守到底，不會放棄，這麼難得的機

  會，屆時一定要和熱情觀眾飆唱比美。


  導演王國燊得知影片將以如此新鮮的方式重現，相當興奮，他說在離開台灣後還一直收到

  觀眾的鼓勵與肯定，這些溫柔的力量讓他十分感動，希望影片和歌曲能在金馬奇幻影展再

  次為大家留下美好回憶。


