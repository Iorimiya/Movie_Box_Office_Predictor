title: '[新聞] 【末日救世主】獲選布魯塞爾奇幻影展競賽'
content: '新聞網址：



  即將在9月2日於台灣爆笑上映的日本瘋狂動作喜劇《末日救世主》，近期持續揚名海外，

  繼日前勇奪加拿大Fantasia奇幻影展「最佳首部電影」肯定之後，本週再獲比利時布魯塞

  爾奇幻影展青睞，入選該影展首次創辦的「新興烏鴉」（Emerging Raven）競賽單元，影

  展方甚至將本片推崇為《愛情，不用翻譯》（Lost in Translation）的搞笑版。消息一

  出，男主角伊藤英明也感謝表示：「全世界的每一個人，請打從心底享受這部電影吧！」

  對於這回接演如此獵奇的搞笑作品，伊藤也期望能藉此讓觀眾打從心底歡笑，也因為必須

  在片中展露肌肉，他密集在一個月左右的時間進行肉體改造，甚至還戴上李小龍風格的假

  髮，增加角色的滑稽感，可說是為角色用心準備。值得一提的是，台灣片商也將在本週五

  （8/19）中午12:00起，於博客來售票網正式啟售「超值珍藏預售票」，只要300元優惠價

  ，就可以獲得電影交換券一張，以及電影A4資料夾及A4電影標語貼紙各一份，數量有限，

  敬請把握購買良機！





  慧眼邀約《末日救世主》進行國際放映的布魯塞爾奇幻影展，與西班牙錫切斯影展、葡萄

  牙Fantasporto奇幻影展並稱為「世界三大奇幻影展」。時逢影展成立40週年，影展方推

  出全新的「新興烏鴉」競賽單元，藉此表彰首度執導的新導演作品。本片因為「融合極其

  荒謬又普遍幽默，並與浪漫跟奇想融為一體的非凡概念」而入選這項競賽。影展方更美譽

  本片：「稍微想像一下，您可以將本片視為《愛情，不用翻譯》的搞笑版，雖然沒有史嘉

  蕾喬韓森（Scarlett Johansson），但充滿動漫風格。」



  對於本片再度進軍國際，片中四位「末日戰士」也紛紛發表感言。男主角伊藤英明感謝地

  說：「全世界的每一個人，請打從心底享受這部電影吧！」大貫勇輔則表示：「我很高興

  ，不僅在日本，全世界觀眾都能看到這部由大人們認真搞笑的精彩作品！我在片中戴著金

  色長髮，半裸還穿皮褲、吊帶褲與人字拖，雖然看起來有點尷尬，但我現在已經習慣了，

  可以很自豪地喜歡自己的角色。」山本耕史也欣慰表示：「我就知道這會成為向世界展翅

  高飛的作品！」小澤征悅也搞笑地說：「這是全球觀眾都會想看的最棒作品，演員和工作

  人員都很棒。而且我在片中的腹肌是真的，即使有人說那是假的，我也不會向你索賠。」





  伊藤英明在《末日救世主》當中，飾演勤練「無戒殺風拳」打算拯救世界毀滅，最後卻無

  用武之地的末日戰士「勝平」。曾演出《惡之教典》、《燃燒的劍》等片而獲得好評的他

  ，怎麼會想要接演如此獵奇的角色呢？據悉，伊藤本人接獲邀約時，自己也感到困惑不已

  ：「身為演員，能演一部能讓觀眾打從內心歡笑的作品，對因為疫情而艱困生活的人們來

  說，是很有意義的，因此讓我找到跟主角的共通點，燃起演出的熱血。」此外，因為要在

  片中秀身材，他首先就是從肉體改造展開角色準備：「我一直沒有鍛鍊身體，而且已經十

  多年都沒去健身房，當初心想該怎麼辦呢？受限於疫情，我只能密集在一個月左右的時間

  進行訓練。」不僅如此，為了讓角色的頭髮顯得不自然，他還戴上李小龍風格的假髮，更

  在台詞上下足功夫：「舉例來說，當勝平發現心儀之人跟學長親密走在一起時，他跑去質

  問兩人是否在交往。進入兩人對話當中的時機、語氣強弱等微妙語氣，表現起來都非常困

  難。」一席話也透露出他準備角色的決心。



  這部履獲國際影展青睞，並由伊藤英明領銜主演的瘋狂動作喜劇《末日救世主》，即將在

  9月2日於台灣爆笑獻映。「超值珍藏預售票」將在本週五（8/19）中午12:00起，於「博

  客來售票網」正式啟售。本片劇情描述好久好久以前，一個末日預言，宣告世界將在1999

  年毀滅。為了拯救人類滅亡危機，一位導師在小島上訓練弟子，學習無人能敵的「無戒殺

  風拳」。然而時光飛逝，如今已經來到2022年，世界依然還沒毀滅…。等到不耐煩的導師

  決定閃人，於是集結眾人宣告就地解散，徒留一幫傻眼的弟子們…。卸下拯救世界的重擔

  之後，勝平（伊藤英明飾演）與同伴來到繁華又和平的東京。對他來說，這裡五光十色的

  都市生活，一切都感到新鮮不已。他先是幫助膽小懦弱的大學生啟太（西畑大吾飾演），

  之後更對女大學生山瀨春（上白石萌歌飾演）一見鍾情。不過這位只知道拯救世界、卻完

  全沒有生活自理能力的男人，在他無用的鐵拳之下，將會在東京遇到什麼令人哭笑不得的

  事情？他又能在一連串新鮮的初體驗中，享受他那遲來的青春，並領悟到愛的真諦嗎？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
date: 2022-08-17
