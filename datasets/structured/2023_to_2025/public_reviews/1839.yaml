url: https://www.ptt.cc/bbs/movie/M.1710910785.A.48B.html
title: '[情報] 2024 金馬奇幻影展 狂歡場片單'
content: '金馬奇幻影展引領狂歡《洛基恐怖秀》把「影廳」變「舞廳」

  加碼推出《Barbie芭比》、《阿達一族》限定扮裝場 「粉」粉、「黑」粉站出來

  《無限泡湯兩分鐘》青少年免費專屬場 專業講師帶領破解電影密碼


  ，今年

  也將繼續帶來驚喜體驗。除了，更推出，號召「粉」粉和「黑」粉共襄盛舉，化身芭比和肯尼高歌得獎金曲

  ，加入古怪神秘的「阿達」一族，只要攜帶指定顏色配件或穿搭扮裝，就有機會獲得超級

  限量好禮，展開好看又好玩的奇幻電影之旅。


  ，除了觀賞「法蘭克博士」提姆柯瑞、「阿珍」蘇珊莎蘭

  登的精彩演出，影展還特別準備「奇幻環保狂歡包」，內含必備小道具和玩法指令，在金

  馬歌舞團的引領狂歡下，展開一場把「影廳」變「舞廳」的瘋狂之旅。


  除了影廳變舞廳，金馬奇幻影展更將戲院變成KTV，，在粉紅國度舞動身體、華麗登場。攜帶「粉色」配件或

  穿搭扮裝的觀眾，還有機會獲得台灣設計生產製造、100%耐水技術的「V-TEX超機能防水

  休閒鞋」粉紅款限量好禮。


  不讓粉紅專美於前，，一同加入「高魔

  子」勞爾朱利亞、「魔帝女」安潔莉卡休士頓、「星期三」克莉絲汀娜蕾茜，成為「阿達

  」一族，攜帶「黑色」配件或穿搭扮裝的觀眾，即可參與抽紅包活動，就有機會帶走金馬

  限量好禮。


  影迷期待已久的還有，還有機會獲得加

  碼驚喜小禮。此外，


  好評不斷的金馬特別企劃「影迷新世代」活動，日前「影迷新世代－金馬奇幻影展團體場

  」活動已額滿，影展也特別保留個人名額，於4月13日舉辦日本導演山口淳太充滿巧思與

  幽默奇想的《無限泡湯兩分鐘》青少年免費專屬場，映後還有專業講師帶領破解電影密碼

  。即日起歡迎12至18歲的影迷個別報名，詳情請見官方網站活動頁面。


  2024年金馬奇幻影展將於4月12日至21日展開，選片指南將在3月26日於臺北文創大樓14樓

  文創會所舉辦，並於3月31日正式開賣。更多精彩片單與周邊活動訊息將陸續公佈，請鎖

  定金馬官網、臉書粉絲專頁、Instagram，或下載金馬APP，掌握第一手消息。


  －－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－


  ▎《洛基恐怖秀》（The Rocky Horror Picture Show）▎



  金馬奇幻影展每年開賣都秒殺的傳奇經典《洛基恐怖秀》（1975），第14度狂歡上演！不

  論老朋友新觀眾，千萬別錯過越夜越瘋狂的古堡狂歡趴踢，看「法蘭克博士」提姆柯瑞放

  浪演出、「阿珍」蘇珊莎蘭登風騷登台，現場還有狂歡加碼的美豔歌舞團，一起跟著銀幕

  扭腰擺臀、抽離身體，一場金馬奇幻影展獨有的瘋狂之旅即將來臨！入場還提供特別準備

  的「奇幻環保狂歡包」，內含制霸狂歡場的必備小道具和玩法指令，絕對讓觀眾一次就上

  癮。



  ▎《Barbie芭比》（Barbie）▎



  全球年度票房冠軍《Barbie芭比》，美國名導葛莉塔潔薇率瑪格羅比、雷恩葛斯林，完美

  變身芭比和肯尼激情演出。當「典型芭比」不再完美，她前往現實世界尋求解方之際，肯

  尼卻密謀造反，把芭比樂園搞得一團亂，她該怎麼做，才能讓自己和芭比樂園恢復原狀？

  不只芭比風潮再度席捲全球，朗朗上口的樂曲一舉囊括金球獎、葛萊美、奧斯卡等多項歌

  曲大獎。金馬奇幻影展這回加碼推出「扮裝場」，邀請影迷一起化身芭比和肯尼，在粉紅

  國度華麗登場，影廳內齊聲大唱〈Dance the Night〉、〈What Was I Made For?〉、〈

  I''m Just Ken〉，放飛自我撩落去！攜帶指定顏色配件或穿搭扮裝的「粉」粉，還有機會

  獲得台灣設計生產製造、100%耐水技術的「V-TEX超機能防水休閒鞋」粉紅款限量好禮。



  ▎《阿達一族》（The Addams Family, 1991）▎



  奇幻經典《阿達一族》（1991），是《MIB星際戰警》美國名導巴瑞索納費德初試啼聲之

  作。影片講述古怪的「阿達一族」，他們過著異於常人恐怖又溫馨的生活，直到失散多年

  的叔叔現身，這家人不得不開始面對光怪陸離的突發事件。暗黑陰鬱的哥德美學，一時之

  選的絕妙陣容：「高魔子」勞爾朱利亞、「魔帝女」安潔莉卡休士頓、年僅10歲卻無比亮

  眼的「星期三」克莉絲汀娜蕾茜，以及靠單「手」成為傳奇的魔術師克里斯多福哈特，創

  造出30年屹立不搖的「阿達」經典。金馬奇幻影展這回推出限定扮裝場，邀請「黑」粉共

  襄盛舉，攜帶指定顏色配件或穿搭扮裝的觀眾，即可參與抽紅包活動，就有機會帶走金馬

  限量好禮。



  ▎《小精靈》（Gremlins, 1984）▎



  美國名導喬丹堤執導、史蒂芬史匹柏監製的經典恐怖喜劇《小精靈》（1984），男主角比

  利獲得爸爸買來的神祕生物「魔怪」作為聖誕禮物，牠有玩偶般淘氣可愛的模樣，能說話

  唱歌，還有學習能力，但必須遵守三項條件：不能見光、不能碰水、午夜後不能餵食，當

  這些規範逐一打破，引發恐怖災難也一發不可收拾。在電腦特效尚未成熟的年代，本片成

  功打造風靡數十年可愛又恐怖的魔怪，不僅週邊賣翻天，相隔四十年後推出前傳動畫影集

  也大獲好評。本次4K全新修復放映，讓你細細品味小精靈的每根「寒毛」！



  ▎驚喜場 ▎





  --'
