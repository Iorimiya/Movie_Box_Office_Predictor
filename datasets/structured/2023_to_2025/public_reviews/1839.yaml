url: https://www.ptt.cc/bbs/movie/M.1678952286.A.760.html
title: '[情報] 2023 金馬奇幻影展 第四波片單'
content: '《美食無間：第1-2集》金馬奇幻搶先看 一起和傅孟柏、王柏傑辦桌加辦案

  札維耶多藍劇集新作《羅根醒來的那一夜》　「夜有多藍」跨夜追劇

  復刻經典《紅磨坊》《搭錯車》K歌場　招牌秀《洛基恐怖秀》累積破萬人朝聖


  好看又好玩的金馬奇幻影展，今日公布精彩特別放映片單，將搶先放映《女鬼橋》奚岳隆

  導演結合美食與警匪類型的矚目台劇《美食無間：第1-2集》，看吃貨刑警傅孟柏和殺手

  王柏傑牽起亦敵亦友的孽緣，和簡嫚書、柯叔元、黃尚禾、陽靚、夏靖庭、王可元一起辦

  案加辦桌，冷汗和口水直流。影展更貼心在映前送上全家便利商店多款美味點心，讓觀眾

  看的開心、吃的滿意。






  在影迷許願敲碗下，影展也確定大銀幕復刻好評如潮的《紅磨坊》與《搭錯車》K歌場。

  《紅磨坊》將把影廳變身成巴黎大舞廳，重現影后妮可基嫚和伊旺麥奎格的動人戀曲，高

  歌〈Your Song〉、〈Come What May〉、〈Sparkling Diamonds〉等經典名曲，再現吸睛

  華麗歌舞秀，歡迎影迷一起扮裝加入勁歌熱舞。適逢華語歌舞經典《搭錯車》上映四十週

  年，金馬奇幻影展也再次獨家推出大銀幕Ｋ歌場，和銀幕主角一起飆唱〈酒矸倘賣無〉、

  〈請跟我來〉、〈一樣的月光〉、〈是否〉、〈變〉不敗金曲，感人故事加上悅耳曲目，

  保證讓觀眾哭得死去活來，唱到聲嘶力竭。



  堪稱最寵影迷的金馬奇幻影展，今年也要讓影迷滿載而歸。除了《美食無間：第1-2集》

  送上點心，「夜有多藍」跨夜場也會送上歐洲第一運動營養補給品牌Myprotein六層夾心

  高蛋白棒，讓觀眾熬夜看片能量不斷電。觀賞《洛基恐怖秀》狂歡場的觀眾，將有特別準

  備的「洛基旺兔水啦狂歡包」，內含制霸狂歡場的必備小道具、極富臺灣味的「來好奇幻

  人茄芷袋」和「HAPPY HAIR品牌好禮」。《搭錯車》、《紅磨坊》的「K歌場」也將各自

  送出100組「AIWA日本愛華」所提供的「真無線藍牙耳機 AT-X80E」。



  2023年金馬奇幻影展將於4月7日至16日在台北信義威秀與MUVIE CINEMAS展開，選片指南

  將在3月24日舉辦，並於3月26日下午一點官網售票系統開賣，更多精彩片單與周邊活動訊

  息將陸續公佈，敬請期待。


  －－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－



  ▎《美食無間：第1-2集》（Gourmet Affairs: Ep.1-2） ▎



  《女鬼橋》導演奚岳隆首次轉戰電視劇，找來傅孟柏和王柏傑飾演吃貨刑警與殺手，平時

  是上演飛車追逐戲碼的死對頭，上飯桌卻成了氣味相投的吃貨好友。台劇美味新混種，辦

  案辦桌一條龍，警匪片從沒看起來這麼好吃過！傅孟柏堅持原汁原味、王柏傑巧手精心調

  配、簡嫚書狂掃佳餚百匯，還有柯叔元、黃尚禾、陽靚、夏靖庭、王可元烘托點綴，桌上

  杯碰杯，桌下諜對諜，犯罪和飯局當前，保證讓人同時冷汗和口水直流。




  ▎《羅根醒來的那一夜》（The Night Logan Woke Up） ▎



  「坎城金童」天才導演札維耶多藍首次執導電視劇便成績斐然，《羅根醒來的那一夜》以

  《湯姆在農莊》劇作家米歇馬克布夏的同名舞台作品為底，透過母子家庭和驚悚懸疑元素

  ，描寫家族分崩離析背後細膩的愛恨糾葛。除了邀來御用班底安妮杜爾瓦勒，《親愛媽咪

  》、《不過就是世界末日》傳奇攝影師安德烈杜賓，與配樂大師漢斯季默等華麗陣容也為

  其助陣。影展將一次五集全映，歡迎觀眾一起來戲院追劇。




  ▎《洛基恐怖秀》（The Rocky Horror Picture Show） ▎



  創下影史最長上映紀錄的《洛基恐怖秀》（1975），連演48年還不過癮，再度預訂金馬奇

  幻影展秒殺王位！今年已是第十三次上演，不論老影迷新觀眾，進場High就一定中！提姆

  柯瑞無人能敵的扮裝皇后法蘭克博士放浪演出、「阿珍」蘇珊莎蘭登風騷登台，放開心、

  敞開胸，跟著銀幕一起扭腰搖擺、解放肢體、釋放靈魂，豪華美豔歌舞團帶你展開一場超

  越禁忌的奇幻之旅。




  ▎《紅磨坊》（Moulin Rouge!） ▎



  《大亨小傳》導演巴茲魯曼二十年前的成名作《紅磨坊》（2001），睽違7年再於金馬奇

  幻上演歌舞大秀。除了看妮可基嫚和伊旺麥奎格共譜史詩級磅礴戀曲，片中經典翻唱瑪丹

  娜、艾爾頓強、皇后樂團等流行金曲更不可錯過，從〈Sparkling Diamonds〉和〈Your

  Song〉到深情對唱〈Come What May〉，再來大跳一曲〈Lady Marmalade〉完美收尾。蓬

  蓬裙、紳士帽、晚禮服通通歡迎，丟開矜持，一起大跳康康舞，讓大腿透透氣，今夜的歌

  王舞后就是你！



  ▎《搭錯車》（Papa, Can You Hear Me Sing?） ▎



  華語歌舞經典《搭錯車》（1983）集結虞戡平、吳念真、孫越、劉瑞琪等強大的編導演陣

  容，以通俗劇式的煽情戲碼包裝棄養、族群、階級等議題，一舉入圍金馬11項大獎。詞曲

  更邀來羅大佑、李壽全、吳念真等台灣樂壇菁英齊聚一堂，與蘇芮的歌聲一同締造華語流

  行歌曲的新里程碑。四十週年大銀幕重現獨家Ｋ歌場，〈酒矸倘賣無〉、〈請跟我來〉、

  〈一樣的月光〉、〈是否〉、〈變〉等金曲連發，保證令你哭得死去活來，唱到聲嘶力竭

  。


  -------------


  今年的電子版手冊也已經上線啦




  是說今年的票價上漲了...


  然後《世紀教主》最後沒談到QAQ


  --'
