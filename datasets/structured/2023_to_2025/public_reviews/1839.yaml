title: '[情報] 2021金馬奇幻影展開幕片清水崇《異變者》'
content: '2021金馬奇幻影展開幕片揭曉 日本恐怖大師清水崇讓綾野剛化身《異變者》

  松坂桃李、岡田將生、成田凌、清原果耶、志尊淳 盡在「東瀛狂想」單元



  此外，影展也選入另外七部明星雲

  集，橫跨恐怖、驚悚、科幻、愛情、喜劇、青春校園等類型的日本電影，見證令人「腦洞

  大開」的東瀛狂想。


  包括，讓擁

  有英雄夢的學長遇見堅信一切不幸皆是幽浮造成的怪學妹，峰迴路轉的劇情，讓人好笑好

  哭又無比激動，不到最後一分鐘根本猜不到結局。連動畫名導押井守都盛讚的導演，將人們對疫情以及政府作為的憤怒轉化成橫行的惡魔，對映全球疫情

  籠罩的當下，更加真實駭人




  還有兩部改編人氣漫畫的佳作。


  2021年金馬奇幻影展將於4月9日至18日在台北信義威秀與MUVIE CINEMAS展開，選片指南

  將在3月27日舉辦，並於3月28日正式開賣，更多精彩片單與周邊活動訊息將陸續公佈，請

  鎖定金馬官網、臉書粉絲專頁、Instagram，或下載金馬APP，掌握第一手消息。


  ------------------------------------------------------------------------------


  《異變者》



  Netflix原創出品的《異變者》，是日本恐怖大師清水崇最新的科幻驚悚新作。影片改編

  自〈殺手阿一〉漫畫家山本英夫的同名邪典漫畫，邀來日本影帝綾野剛和人氣男星成田凌

  互拚演技。影片講述綾野剛飾演的流浪漢，在接受出身名門的醫大生成田凌的實驗手術後

  ，左眼竟然開始能看到各種類型的怪物，揭開別人內心深處的祕密，而他失去的過往記憶

  也逐漸浮現。



  《破碎的瞬間》



  作品類型橫跨奇幻、恐怖、喜劇的日本鬼才導演SABU，這回改編同名輕小說的新作《破碎

  的瞬間》，講述夢想成為英雄的高三男孩，出手相助被霸凌的學妹，沒想到學妹竟說一切

  都是「幽浮」在作祟，身上還有莫名傷痕，似乎連她的家人也有不為人知的一面。新生代

  明星中川大志、石井杏奈，以及實力派演員堤真一、原田知世聯手出擊。融合校園霸凌、

  青春純愛、超級英雄、奇幻驚悚等多種類型，不僅峰迴路轉，更充滿感官娛樂，前所未見

  。



  《超越無限兩分鐘》



  京都知名劇團EUROPE KIKAKU與東京獨立戲院Tollywood合作，導演山口淳太把劇團的科幻

  喜劇狂想搬上大銀幕。《超越無限兩分鐘》故事講述一間平凡無奇的咖啡店，老闆、店員

  和常客試圖將店裡與二樓住宅的兩分鐘的「時差」延長，用來預見趨勢進而飛黃騰達。沒

  想到現實不可承受的逆轉，竟指向意想不到的橫禍。全片沒有特效輔助，卻能憑著精密計

  算和天衣無縫的默契，讓線性拍攝創造非線性邏輯，一鏡到底也能超時空跳躍，讓動畫名

  導押井守看完都盛讚不已。



  《破壞之日》



  以《藍色青春》成名影壇的日本導演豊田利晃，這回《破壞之日》攜手老班底松田龍平、

  窪塚洋介、澀川清彥帶著觀眾走進神祕瘟疫壟罩的末日日本。影片描述一處農村礦坑發現

  了神祕怪物，自此瘟疫傳言四起，一名年輕修道者閉關展開終極修行，決心消除傳染怪物

  。本片是豐田利晃在2020年COVID-19疫情當下所拍攝的作品，意有所指之外，更暗喻日本

  民族的創傷，以及對政客、掌權者和群眾的抗議吶喊。音樂品味一流的豊田利晃，除了邀

  來知名樂團GEZAN打造主題曲，主唱MahiTo The People更挑樑演出年輕修道者，充滿爆發

  力的演出令人印象深刻。



  《老師！你會不會談戀愛》



  《水手服與機關槍—畢業》導演前田弘二前作才讓女神橋本環奈拿起機關槍，這回《老師

  ！你會不會談戀愛》則讓超人氣美少女清原果耶指導補習班老師成田凌談戀愛，沒想一個

  只會想不敢作，一個出張嘴，兩人都是愛情修羅場的超級魯蛇，兩個怪咖該如何找到幸福

  的絕對領域？清原果耶的青春無敵加上萌到帥的成田凌，兩人攜手打造屬於怪咖們的新時

  代愛情喜劇。



  《舌尖上的高潮》



  還記得《蒲公英》的那碗神級拉麵嗎？這回輪到日本新銳導演吉田浩太來上菜！吉田浩太

  在2018年「以食喻情」的短片《啊！好性感的納豆》初嚐滋味後，三部曲長片《舌尖上的

  高潮》終於問世。影片以一名其貌不揚的怪大叔拎著一盒天津甘栗貫穿三段故事，並透過

  牽絲納豆的獨特氣味，麻婆豆腐的嗆辣火爆，背脂大蒜拉麵的重擊濃郁，以舌尖勾動情慾

  ，借感官催化心靈，揭開探索慾望的獨門祕方。



  《三角窗外是黑夜》



  以《跟爺爺說再見》獲得影展注目的森垣侑大，這回將日本擅於BL劇情漫畫家山下朋子的

  同名漫畫《三角窗外是黑夜》搬上大銀幕。電影找來新生代男星志尊淳飾演擁有陰陽眼體

  質的書店店員，與飾演除靈師的岡田將生一起除魔破案，一樁分屍命案，卻為這對最佳拍

  檔帶來危機。除了有最帥最腐除妖搭檔，還有瀧藤賢一、「欅坂46」前成員平手友梨奈攜

  手加入，展開一場邪教組織、妖魔鬼怪的集體大混戰。北川景子更在片中驚喜客串，展現

  嚇死人不償命的演技。



  《早安甜心歐嗨喲》



  《小小夜曲》導演今泉力哉改編自漫畫家劔樹人自傳式作品的《早安甜心歐嗨喲》，不僅

  邀來知名邊劇富永昌敬妙手操刀，還找來松坂桃李、仲野太賀等一線男星化身早安家族狂

  粉。他們一起打屁挖苦、泡錢湯，更在地下展演空間說說唱唱聊偶像，不知不覺他們也成

  為彼此人生中不可或缺的重要存在。令人又哭又笑又充滿動人情懷的故事，帶領觀眾一起

  回到早安家族黃金時代，傳說中的千禧年代。


  --'
