title: '[新聞] 2024金馬奇幻影展柯恩兄弟導演專題'
content: "新聞網址：\n\n\n\n\n2024金馬奇幻影展今（21）日公布導演專題，推出美國兄弟檔名導柯恩兄弟\n的七部早期經典。適逢柯恩兄弟首部劇情長片《血迷宮（導演版）》（Bloo\n\
  d Simple (Director's Cut)）問世40週年，影展特別邀來4K數位修復導演版\n本，另外還有被評選為影史百大喜劇的《扶養亞歷桑納》（Raising\
  \ Arizona\n），囊括坎城影展金棕櫚、導演、男主角三項大獎的《巴頓芬克》（Barton\nFink），以及他們首度榮獲奧斯卡的《冰血暴》（Fargo）和Cult片經典《謀\n\
  殺綠腳趾》（The Big Lebowski），好看又好聽的《霹靂高手》（O Brother\n, Where Art Thou?），還有影史地位水漲船高的《黑幫龍虎門》（Miller's\n\
  Crossing）等精彩作品。\n\n\n\n被稱為「柯恩兄弟」的喬柯恩和伊森柯恩，擅以重構各種電影類型又兼具黑\n色幽默聞名，透過引人入勝的故事、鮮明的角色，以及獨特的影像風格，奠\n\
  定影壇地位。柯恩兄弟首度出手便玩轉黑色電影的\n，將偷情的人妻與酒保、買凶殺人的人夫和私家偵探，展開出乎預料\n的結局。喬柯恩也因本片與法蘭西絲麥朵曼結為伴侶，後者憑中冷靜辦案的懷孕女警一角躍登奧斯卡影后寶座，鶼鰈情深合作無間\n\
  傳為影壇佳話。\n\n荒誕喜劇讓搶劫慣犯愛上模範女警，兩人卻為了\n擁有小孩鋌而走險，尼可拉斯凱吉和荷莉杭特把為人父母的渴望詮釋地荒謬\n又可愛。則深入刻劃黑幫權力鬥爭和情愛糾葛下，\n\
  人性和良知的搖擺。贏得坎城影展金棕櫚的，以懸疑\n驚悚絕妙手法展現創作者靈感枯竭的內心世界，約翰特托羅的精湛演出也獲\n得坎城影帝殊榮。\n\n柯恩兄弟擅長把對社會人性的諷刺調侃化為笑料，\n\
  透過捲入綁架奇案的魯蛇男子，犀利嘲諷戰爭、哲學、藝術、性別和成功人\n士的虛有其表，甚至吸引粉絲以主角為名創立教派，號召70萬信眾追崇，前\n所未見。好看又好聽的音樂喜劇，喬治克隆尼率領天\n\
  兵罪犯踏上胡鬧惡搞的尋寶之旅，影片不僅入圍超過40個影展及獎項，更打\n敗巴布狄倫、U2勇奪葛萊美獎年度最佳專輯。\n\n金馬奇幻影展的獨家單元之一「影迷許願池」，今年邀來影迷敲碗已久的《\n\
  新‧里見八犬傳》（Legend of the Eight Samurai, 1983）、《似曾相識》\n（Somewhere in Time, 1980）和《奔向彩虹》（The\
  \ Love Affair of Rain\nbow, 1977）。日本古裝奇幻經典，由紅極一時的藥師丸\n博子與真田廣之主演，影展將特別放映4K修復版本，讓觀眾在大銀幕感受前\n\
  衛風格與華麗視覺的震撼，機會難得，影迷千萬不要錯過。\n\n堪稱穿越電影先驅的，《超人》克里斯多夫李維和古典美人珍\n西摩爾展開穿越時空的動人愛戀，電影配樂大師約翰巴瑞打造抒情配樂，更\n\
  是歷久不衰。瓊瑤電影，金馬影后林青霞化身美麗的山中姑娘\n，與都市少爺秦祥林談起不被家庭認可的愛情，搭配「帽子歌后」鳳飛飛膾\n炙人口的主題曲，近半世紀依然魅力無窮。俊男美女的吸睛演出，膾炙人口\n\
  的音樂，東西方浪漫愛情經典一次滿足。\n\n2024年金馬奇幻影展將於4月12日至21日展開，選片指南將在3月26日舉辦，\n並於3月31日正式開賣。更多精彩片單與周邊活動訊息將陸續公佈，請鎖定\n\
  金馬官網、臉書粉絲專頁、Instagram，或下載金馬APP，掌握第一手消息。\n\n--\n　　\n　　　　　                  OF\n　一手拿著\
  \ 靜止的羅盤  遺忘了妳的這個世界             \n用力凝聚 模糊的視線　如果有一天我能愛它我就會去見妳\n　　　 \n    ロストマン\n\n\
  --"
