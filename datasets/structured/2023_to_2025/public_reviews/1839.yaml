title: '[好雷] 金馬奇幻影展  人生最後那幾件事'
content: '一場意外的車禍帶走了四條人命，卻沒辦法將他們的靈魂帶走，一個即將步入禮堂的準新

  娘，一個對棒球隊難以忘懷暗戀隊長的高中球經，一個將消防安全視為己任的前打火弟兄

  ，以及一個放不下幼子的單親媽媽，四個對人間還有牽掛的靈魂，他們唯一的寄託是那場

  車禍的倖存者，一個玩世不恭的痞子，他們用利益交換，請他幫忙完成他們最後的心願，

  好讓他們安心離開。



  其實這也不算是很少見的題材，替靈魂完成人間最後的心願，各代表了愛情、友情、親情

  ，和工作熱情，坦白說那些故事情節並不難猜，可是特別的在他如何呈現。每個講到神鬼

  靈魂的故事都有一套自己的邏輯或是規則，但這裡的邏輯幾乎不重要，不需要解釋為何只

  有倖存者看的到，不需要解釋為什麼在滿足心願時陽間的人突然可以看到靈魂，因為作者

  本身不在於建構一個完整的陰陽世界，他故事的本身在於這個痞子如何去幫忙他們完成這

  些任務。雖然是老掉牙的情節，不過電影中，透過這個岡田將生誇張演技詮釋的痞子角色

  ，同時充滿了讓人爆笑的橋段，以及讓眼淚不由自主流下來的時刻，兩者巧妙安排，就算

  是老梗（最後的關鍵一球擊出全壘打之類的）也能給觀眾不一樣的觀影感受。



  導演深諳『如果在第一幕出現了一把槍，一定要在最後一幕前擊發』的道理，既然已經放

  了一個帥帥壞壞性感的岡田將生，就必須讓他脫啊！(咦)脫得莫名其妙脫得理所當然，甚

  至讓他反串跳鋼管，為故事增添不少亮點和笑點。好像都不會老的廣末涼子雖然這次演的

  是單親媽媽，多了一些溫和母愛，但還是和其他女孩一起挑戰性感火辣的鋼管舞。



  非常溫馨可愛的故事，讓人看了笑中帶淚，也提醒了世事難料，要及時把握身邊的人事物

  ，珍惜當下。



  --

  Sent from my Android


  --'
