title: '[情報] 2021 金馬奇幻影展 第三波片單'
content: "金馬得主林正盛《地球迷航》金馬奇幻影展世界首映\n《火神的眼淚》、《2049：刺蝟法則》矚目新劇搶先播映\n\n\n備受影迷期待的2021金馬奇幻影展，今日（3/3）揭曉多部精彩片單，其中包括金馬獎得\n\
  主林正盛費時十八年紀錄泛自閉症者以音樂、繪畫、詩句突破生命困境的紀錄片《地球迷\n航》，將在金馬奇幻影展世界首映。影展也將搶先曝光兩部備受矚目的劇集新作，有公共\n\
  電視、台灣大哥大myVideo共同出品，台灣導演蔡銀娟集結溫昇豪、陳庭妮、林柏宏、劉\n冠廷組成救火英雄的新劇《火神的眼淚》，以及台灣大哥大myVideo、東森電視、瀚草影\n\
  視共同投資拍攝的《2049：刺蝟法則》，導演朱建青率林子熙、莫允雯與金馬獎最佳新演\n員陳姸霏大膽挑戰科幻未來，一展華語影劇豐沛的創作能量。\n\n除此之外，金馬奇幻影展也一併公布六部影壇奇幻佳作，包括《通靈診療室》波蘭名導瑪\n\
  寇札塔叔莫斯卡新作《當世界不再下雪》（Never Gonna Snow Again），找來《怪奇物語\n》的「思樂冰男」亞歷克烏托葛夫主演神祕按摩師，擁有一雙消煩解憂的神奇之手。《我\n\
  們的故事未完待續》人氣女星奧莉薇亞庫克身兼監製主演的《愛在遺忘蔓延時》（\nLittle Fish）與英倫型男傑克歐康，則在爆發「失憶」疫情的世界裡，共譜浪漫又心碎\n\
  的戀曲。\n\n日裔巴西新銳導演小田艾德森勇奪日舞影展最佳劇本的《靈魂候選人》（Nine Days），\n除了有名導史派克瓊斯監製，更邀來《黑豹》溫斯頓杜克、《小丑》薩琪畢茲、《牠》比\n\
  爾史柯斯嘉等堅強卡司同片競演，描寫一群靈魂必須在九天內競爭重返人間的資格。師承\n坎城金棕櫚名導泰倫斯馬力克的卡洛辛特曼，處女作《未來之書》（The Book\
  \ of Vision\n）以極度唯美的影像穿越時空，串連起兩百多年前的醫學手稿和今日的繾綣關係。\n\n被視為本屆奧斯卡大熱門的紀錄片《女畫家與偷畫賊》（The\
  \ Painter and the Thief）\n，導演班傑明李真實記錄女畫家與偷畫賊匪夷所思的相濡以沫，峰迴路轉的程度比劇情片\n還不可思議。美國天才動畫家戴許蕭的動畫新作《怪奇獸樂園》（Cryptozoo），想像力\n\
  與尺度比《X戰警》還要狂，這場神獸宇宙大亂鬥也獲得柏林與日舞影展的青睞。\n\n2021年金馬奇幻影展將於4月9日至18日在台北信義威秀與MUVIE CINEMAS展開，選片指南\n\
  將在3月27日舉辦，並於3月28日正式開賣，更多精彩片單與周邊活動訊息將陸續公佈，請\n鎖定金馬官網、臉書粉絲專頁、Instagram，或下載金馬APP，掌握第一手消息。\n\
  -------------------------------------------------------------------------------\n\
  \n▍《地球迷航》 ▍\n\n\n《地球迷航》是贏得金馬獎得主林正盛導演自2018年起，紀錄妻子韓淑華成立的多寶藝術\n學堂，如何透過音樂和繪畫的教導與陪伴，提供泛自閉症者在生命困境裡的避風港。他們\n\
  透過詩句、音樂與畫筆，突破冷漠疏離，揮灑出內心熱烈的小宇宙。影片藉由影像作為橋\n梁，試圖以溫煦平等的角度，打破因不解而生的阻隔，欣賞他們天馬行空的創作天賦，接\n\
  納與包容他們與生俱來的困擾障礙。\n\n\n▍《火神的眼淚》 ▍\n\n\n公共電視、台灣大哥大myVideo共同出品，《候鳥來的季節》導演蔡銀娟執導的最新《火\n\
  神的眼淚》劇集新作，是台灣首部消防職人劇，集結溫昇豪、陳庭妮、林柏宏、劉冠廷組\n成陣容堅強的打火小隊。除了驚心動魄的救火場面，亦呈現消防員在各種任務中不為人知\n\
  的故事和各自面對的人生課題，從中透視人性冷暖與社會百態，更細膩刻劃他們在龐大壓\n力下內心的衝突與掙扎。為台劇的多元題材和精良製作，再次寫下一頁精彩篇章。\n\n\
  \n▍《2049：刺蝟法則》 ▍\n\n\n繼《紅衣小女孩》後，瀚草影視再度打造全新IP，與台灣大哥大myVideo、東森電視共同\n投資拍攝，以建構近未來的科幻世界為背景的〈2049〉系列影集，其中《2049：刺蝟法則\n\
  》描述一名家庭、事業皆遇上瓶頸的心理治療師半夜從噩夢驚醒，情緒低落的她原想取消\n看診，沒想到一名病患堅持治療，無奈之下帶她進入記憶重建室讀取夢境，竟發現兩人的\n\
  噩夢完全相同。導演朱建青執導，運用高端科技回探原始心靈；林子熙、莫允雯雙姝連袂\n，精彩對手戲句句直擊人心，金馬獎最佳新演員陳姸霏更展現爆發力驚人的演技。\n\
  -------------------------------------------------------------------------------\n\
  \n▍《當世界不再下雪》(Never Gonna Snow Again,2020) ▍\n (好威映象代理發行，預計5月上映)\n\n代表波蘭角逐本屆奧斯卡最佳國際影片的《當世界不再下雪》，是《通靈診療室》波蘭名\n\
  導瑪寇札塔叔莫斯卡與攝影師搭檔米歇爾恩格萊特攜手執導的最新作品。影片找來《怪奇\n物語》的「思樂冰男」亞歷克烏托葛夫飾演一名來自核災之城車諾比的神祕按摩師，他擁\n\
  有一雙神奇之手，彷彿能為冷漠的世界帶來一絲希望，但沒人知道他所為何來，又將去往\n何處。影片用災難倖存者成為新世界救贖的寓言，映照出東歐世界的過去與未來，優美卻\n\
  又諷刺。\n\n\n▍《愛在遺忘蔓延時》(Little Fish,2020) ▍\n\n\n新銳導演查德哈帝根新作《愛在遺忘蔓延時》，邀來《我們的故事未完待續》奧莉薇亞庫\n\
  克、《永不屈服》英倫型男傑克歐康攜手合作，演出一對深愛彼此的夫妻，當全球爆發一\n種會令人失去記憶的疾病，妻子發現丈夫開始出現徵狀，兩人昔日相遇相愛的細節，也成\n\
  為他們確認對方的證明。影片不僅揉合末日驚悚、浪漫愛情的類型元素，並帶出深層的存\n在哲理。客串一角的演歌雙棲的法國女星Soko，溫柔嗓音更唱出浪漫到令人心碎的末日戀\n\
  曲。\n\n\n▍《靈魂候選人》(Nine Days,2020) ▍\n\n\n日裔巴西新銳導演小田艾德森勇奪日舞影展最佳劇本的《靈魂候選人》，除了有名導史派\n\
  克瓊斯監製，更邀來《黑豹》溫斯頓杜克、《小丑》薩琪畢茲、《牠》比爾史柯斯嘉等堅\n強卡司同片競演。影片講述一名身處身生死交界的男子，除了整日觀察電視螢幕裡人世間\n\
  的生活，當一個生命隕落後，他必須在九天內選出新的靈魂去投胎。劇中以人世與靈魂、\n死亡與重生的對照，叩問生命意義，宛如結合是枝裕和《下一站，天國》和泰倫斯馬力克\n\
  《永生樹》，充滿詩意哲理。\n\n\n▍《未來之書》(The Book of Vision,2020) ▍\n\n\n導演卡洛辛特曼榮膺威尼斯影展影評人週開幕片的首部劇情長片《未來之書》，邀來名導\n\
  泰倫斯馬力克擔綱監製，以絕美的影像風格描述一名女醫生放棄了人人稱羨的前程，來到\n大學鑽研醫學史，並深深著迷一份十八世紀醫生的手稿，纏繞於字裡行間的情緒與記憶，\n\
  彷彿引領她回到那個年代。融合科學與情感，更添入時空跳曜元素，《諜海黑名單》荷蘭\n女星洛特佛貝克與《冰與火之歌：權力遊戲》查爾斯丹斯，挑戰演出相異時空的不同角色\n\
  ，也對比映照出今昔觀點。\n\n\n▍《女畫家與偷畫賊》(The Painter and the Thief) ▍(海鵬代理發行)\n\n\n挪威紀錄片導演班傑明李引發影壇熱議的紀錄片《女畫家與偷畫賊》，紀錄捷克女畫家的\n\
  畫作在光天化日之下遭竊，警方很快將竊賊逮捕到案，女畫家在法庭上鼓起勇氣和偷畫賊\n交談，還提出幫他畫像的要求；當兩人相濡以沫，情誼日漸滋長，也令人不禁疑惑，畫家\n\
  是出於寬恕同情，還是為了刺激靈感？竊賊是愧疚償還，還是另有所圖？導演班傑明里費\n時三年跟隨拍攝，不但記錄下女畫家和偷畫賊如何走進彼此生命，真情化做羈絆，其間的\n\
  峰迴路轉，堪稱比劇情片還不可思議。從日舞影展開始一路狂掃各大獎項，更是本屆奧斯\n卡的強力競爭者之一。\n\n\n▍《怪奇獸樂園》(Cryptozoo,2021)\
  \ ▍\n\n\n美國天才動畫家戴許蕭繼轟動影壇的《沉沒高校》，新作《怪奇獸樂園》則請出獨角獸、\n食夢貘到蛇髮女妖、吞天巨蟒，世界各地神話傳說中的怪奇生物領銜主演。故事描繪一座\n\
  鷹馬與祥龍齊飛、妖精同羊男共生的神祕園區，看似要打造一處全球異種奇獸的避風港，\n但動物園般的管理手段卻讓「獸權鬥士」葛蕾心生疑惑，決定與奇獸們聯手抗敵，不讓聖\n\
  地變成了監獄。戴許蕭以色彩絢爛、線條瘋舞的視覺風格，打造前所未見的神獸宇宙大亂\n鬥。在反戰時代背景襯托下，更顯靈性充滿、奇趣飛馳，堪稱嬉皮亂繪版的吉卜力系自然\n\
  寓言。\n\n--\n\n--"
