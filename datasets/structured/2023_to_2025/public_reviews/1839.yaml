url: https://www.ptt.cc/bbs/movie/M.1491659109.A.C94.html
title: '[負雷]金馬奇幻影展開幕片【自畫像】'
content: '4月7日欣賞金馬奇幻影展開幕片：陳宏一導演【自畫像】，

  該片一廂情願地宣洩對於臺灣政局的不滿與絕望，

  讓我感覺自溺有餘、感慨不足。








  （以下爆雷）─────分隔線













  劇中女主角是臺大政治系女學生，少女時期曾被親生父親強暴，

  就學在外租屋被畫家房東強暴，變成畫家的小三，

  去立法委員辦公室實習又被立法委員性侵，最後對人生萬念俱灰。


  劇中另一條支線跨性別者（心理女性、生理男性），

  劇末一樣被男性玩弄、對人生絕望，拿切刀拜託女主角幫忙割掉自己生殖器。

  但與女主角在絕望中擁吻後赫然勃起，發現自己「多元情慾」的無限可能，

  故決定「維持現狀」留住小鳥，影射導演心中的兩岸處境。


  但女主角最後就使用跨性別者拿來的切刀，猛力插入心臟、自殺成功。

  然後，對政治一樣失望的畫家房東挖掉女主角的兩顆眼球，

  用女主角的屍體完成最後一幅畫作，

  才拯救、昇華了女主角及自己被臺灣社會玩壞的破碎靈魂。


  女主角被刨空雙眼、全身塗白、宛若獻祭般的恐怖姿態，

  的確對於窘困人生有著震撼的控訴力道。

  但其餘情節都是為了這個祭典畫面而存在，

  全片因此陷入概念先行、血肉蒼白的尷尬局面。


  同樣在控訴臺灣社會玩壞青年理想的生命崩解，

  【女朋友‧男朋友】可以讓觀者為角色的青春感懷、為角色的衰敗感慨。

  【自畫像】劇中人物卻受到編導一廂情願的任意支配，

  角色一切的受辱、受挫、無盡倒霉，或者世故化、黯黑化、禽獸化的乖張行為，

  都是沒來由、沒鋪陳、理所當然的一再發生。


  編導對於角色沒有關懷，只在意自己對於臺灣社會的不滿。

  導致整部電影仿若一篇空洞的社會觀察，

  一再呼喊「我好悲慟、好感傷、好沉痛、世界是狗屎、活的像垃圾」，

  卻不願論述、缺乏辯證、架空於現實人生之外，

  足足哀戚了1小時47分鐘，就讓人覺得，唉，真的好煩膩喔。


  再多激烈與大膽的藝術手法包裝，

  企圖用七宗罪畫作來勾勒臺灣社會的慾望、虛榮與毀滅，

  也挽救不了基底根本性的耽溺與空乏！

  真是為全片演員掏心掏肺、掏出一切器官的犧牲演出感到可惜！


  不知同樣在奇幻影展欣賞到【自畫像】的網友，覺得如何？

  因電影播畢一日無人分享，特發此文拋磚引玉之。



  --'
