url: https://www.ptt.cc/bbs/movie/M.1523960794.A.8BB.html
title: '[好雷] NG你的人生：雪花飄逝的世代'
content: '今年的金馬奇幻影展在台北盛大開幕，受到去年的《肉獄》（Raw, 2017）所刺激，自然

  非常期待今年的Surprise film。主辦方在日前丟出了三個提示：「牙痛不要看」、「非

  真實人生改編」以及「見血不見鬼」。如此耐人尋味的線索真的是讓人既期待又怕受傷害

  ，直到碩大的幾個中文字投放在螢幕上，才知道這次的主題，原來是一場荒謬的黑色幽默

  。


  「NG你的人生」（中文暫譯，Schneeflöckchen，2017）描述了德國柏林在動盪的社會風

  氣下，暴力以及攻擊事件頻傳。法外之徒唐（Erkan Acar飾）跟賈維（Reza Brojerdi飾

  ）行事荒誕不羈，在槍擊沙威瑪店後，意外發現了某本「劇本」，內容講述著昨夜發生的

  所有事件、動作、場景以及對話，一字不漏的完全吻合。於是他們循線找到一位牙醫，沒

  想到這個牙醫除了寫下這本劇本以外，甚至還不停把未來的故事全都給寫完了！半信半疑

  的兩人除了一邊躲著復仇者的追殺以外，還得想辦法讓這個已經被「編好」的人生回到正

  軌，就這樣展開了一段莫名其妙的旅程。




  ■來自未來的劇本


  除了唐與賈維以外，本故事的另一條主線則是父母在沙威瑪店慘遭殺害的艾莉安娜（

  Xenia Assenza飾）以及前保鑣卡森（David Masterson飾），為了替父母報仇，兩人踏上

  買凶殺人的旅程。這兩條主線的發展是有其共通點的，也就是所謂的「復仇」。

  唐與賈維從小居住在難民營，但是德國官方對於難民的消極態度，使得兩人的家人在一場

  大火中喪生，他們為了找到當時疑似教唆縱火以及消極救災的警察隊長，拿著一把電鋸開

  始了復仇之路，甚至還把警察隊長的名字刻在電鋸上，來時時警惕自己不可忘卻仇恨。而

  艾莉安娜更是為了復仇而尋求旁門左道，發誓要唐與賈維死在她面前。


  看似普通的復仇式電影，卻從天外飛來一本荒唐的劇本來攪亂這一池春水。劇本從一個平

  凡牙醫的手中寫出，但內容卻讓唐和賈維開始思考跟懷疑人生，也讓兩條故事主線在交錯

  揉合後各自飛向不同結局。唐和賈維是活在「劇本外」的人，他們清楚劇本的存在，他們

  希望能改寫劇本的內容，但只能一步步照著牙醫的瘋狂思緒起舞。而艾莉安娜跟卡森以至

  於其他人是活在「劇本裡」的人，他們不知道劇本的存在，他們只需面對自己的人生課題

  ，可他們活在他人的彈指之間也不自知。


  在這個特別的劇本安排之下，兩邊兩人組的對手戲是相當有可看之處的，唐和賈維試圖掙

  脫劇本的枷鎖並同時進行復仇計畫，可是在被殺手們瞄準的過程中，劇本卻又變成他們存

  活的唯一浮木，面對到種種困難，透過兩人時而幽默時而冷酷的手段，著實令人驚豔。




  ■所謂的「雪花」


  本片英譯名為「snowflake」，也就是所謂的雪花。唐與賈維在故事中途開始尋找劇本中

  的「雪花天使」（Judith Hoersch飾），因為雪花天使會守護他們不被刺殺。雪花天使的

  出現跟離去都令人感到唐突，本來應該令人懷疑這條支線到底是否有存在的必要，但總要

  幾經思慮後才使人驚訝。「Snowflake」其實是被用來形容，約莫在2010年左右的年輕人

  ，他們缺乏在社會生存的彈性，且對周遭社會具有較高的敵意。甚至在2016年的11月，柯

  林斯英語詞典（The Collins Dictionary）將「snowflake generation」放入年度十大單

  詞中。


  而唐與賈維，就是兩片浮沉在人世中的雪花。


  鬥陣俱樂部（Fight Club, 1999）的作者Chunk Palahniuk在其1996年出版的原著書中說

  到：You are not special. You are not a beautiful and unique snowflake.


  在本劇中，雪花同時代表著流亡到德國的難民們。他們承受過戰爭的苦難而來到德國，卻

  因反對的聲浪而受到不正常的對待。即使出現火災或是暴力事件，德國官方絲毫不回應這

  些難民的求助而任其自生自滅。而唐跟賈維是擁有兩種身分的雪花，他們活得既痛苦又脆

  弱，但也因為如此，當敘寫著他們的未來的劇本出現時，他們仍選擇相信一切，因為在這

  瘋狂的亂世之中，能擁有信念是他們唯一的救贖。




  這是一部透過黑色幽默包裝難民議題的電影。電影中有大量的元素來構築成嚴謹的故事架

  構。電影中的每個角色都有其獨特性格以及引人入勝的角色魅力，但又恰如其分，絲毫不

  搶走主角群的風采。經典的非線性敘事卻不會讓故事看起來過度凌亂，少數支線劇情與對

  話過於晦澀難懂，但仍然不減全片的精采程度。一本劇本幾乎撐起整部電影，劇情的走向

  透過牙醫的靈活的大腦跟雙手在鍵盤上的動作，也讓觀眾跟著唐與賈維一樣，心中忐忑的

  等待劇情的下一步會如何進行，我想這也是另類的打破第四面牆吧。


  這次的Surprise film依然讓人驚奇，雖然沒有大量恐怖或是血腥的場景，但是其荒謬程

  度的確到了令人難以忘懷的地步。希望本片未來有機會在台灣上映，是部絕對適合大家去

  觀賞的片子。



  原文網址







  --'
