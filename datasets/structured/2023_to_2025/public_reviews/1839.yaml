url: https://www.ptt.cc/bbs/movie/M.1517309154.A.DDD.html
title: '[新聞] 2018金馬奇幻影展開幕片《犬之島》'
content: '將於4月13日展開的金馬奇幻影展，今日公佈美國鬼才導演魏斯安德森（Wes Anderson）

  備受矚目的動畫新作《犬之島》（Isle of Dogs）為本屆影展開幕片。金馬奇幻影展過去

  曾邀來魏斯安德森的前作《歡迎來到布達佩斯大飯店》為影展揭幕、規劃導演專題，他獨

  樹一格的電影美學吸引許多影迷追崇，這回新作放映恰逢農曆狗年，劇中一隻隻超萌狗兒

  也將帶領觀眾踏上另類奇幻之旅。


  《犬之島》是魏斯安德森繼《超級狐狸先生》後第二部動畫長片作品，電影以濃厚的日式

  風格帶有向黑澤明致敬的意味，以小男孩為了拯救愛犬奮不顧身要衝撞體制，透過魏斯安

  德森詼諧的手法及獨特的定格動畫風格，將要再度驚豔影壇！


  劇情講述二十年後的未來日本，因犬隻數量超過都市負荷引發犬流感，政府將所有犬隻隔

  離到滿是廢棄物的垃圾小島，一名男孩為了尋找愛犬來到犬之島，在狗兒的幫助下，展開

  充滿驚奇的冒險旅程。


  影片除了有老班底比爾莫瑞、艾德華諾頓、蒂坦史雲頓，還找來今年以《意外》角逐奧斯

  卡影后的法蘭西斯麥朵曼、《淑女鳥》才女導演葛莉塔潔薇、《絕命毒師》布萊恩克蘭斯

  頓、哈維凱托、史嘉蕾喬韓森等影帝后巨星等超強卡司獻聲；另一頭也邀來演唱動畫電影

  《你的名字》主題曲的RADWIMPS樂團主唱野田洋次郎、日本影帝渡邊謙、小野洋子等人配

  音，帶來超越語言、人與狗的幽默溫情。


  2018金馬奇幻影展於4月13日至22日舉行，選片指南將於3月25日舉辦，票券於4月1日正式

  開賣，更多奇幻佳片將陸續公佈，邀請影迷呼朋引伴，一同參與這場拋開尺度、大開眼界

  的電影嘉年華會。


  --'
