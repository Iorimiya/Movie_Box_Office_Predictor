title: '[新聞] 【真犯】勇奪富川奇幻影展觀眾票選獎肯定'
content: '新聞網址：




  第23屆南韓富川奇幻影展圓滿落幕，入選國際長片競賽的唯一南韓電影《真犯》，一舉奪得「觀眾票選獎」肯定，也讓本片成為繼韓片《哭聲》與台片《報告老師！怪怪怪怪物！》之後，再度獲得本獎項加持的話題強片。導演高政煜透露在草擬本片劇本時，就不斷諮詢檢察官出身的律師，務求劇情設定更加具體真實；甚至還參考監獄重刑犯的論文，了解凶案實際發生的殺人動機、行凶方式，以及身邊親人的關係，將片中各個角色面向給鮮明地呈現出來，並增添故事的豐富性與張力，也讓本片可說是繼《致命目擊》、《鎖命危機》之後，今夏最受觀眾期待的懸疑驚悚燒腦強片

  ，即將在7月19日於台灣震撼獻映。





  富川奇幻影展自1997年開始以來，目前已經邁入第23屆，不僅是亞洲最大規模的奇幻影展，每年更吸引大批觀眾參與，是全球公認的知名影展。南韓新銳導演高政煜，曾以短片《毒蛙》榮獲第17屆富川奇幻影展短片觀眾票選獎肯定。這回推出首部電影長片《真犯》，再度獲得富川奇幻影展青睞，入選國際長片競賽單元，甚至還是競賽當中的唯一南韓電影。本片也以精心編排的故事內容、演員完美的演技搭配，以及懸疑驚悚的劇情設定，最後打敗眾多強敵，一舉奪下「觀眾票選獎」肯定，證明本片卓越的驚悚成就。


  對於二度獲得富川奇幻影展的觀眾肯定，導演高政煜感激表示：「這是我第二次在富川獲獎，從短片到長片，讓出道作品成長為更好的作品。我的故事能與觀眾溝通，並且得到認可，對我來說是非常有意義的獲獎。」影展方也大力稱讚本片：「導演精心描繪這個複雜故事的韌性，以及面對真相時猶豫不決，在善惡界線上搖擺不定的柔弱人物形象，給人強烈的說服力。」就連主流媒體也在觀賞本片之後，給予強烈支持。《Newsen》稱讚：「四位主角相反的主張，以及隱藏的秘密過程非常有趣。本片透過人物之間的互動與心理戰，帶給觀眾緊張與驚險感，刻畫出高密度的懸念。

  而演員們的表演，也像在看一場以真實遊戲為主題的戲劇般精彩。」《Viva100》則肯定：「時隔很久，終於出現一部讓人欣喜不已的驚悚電影！」





  《真犯》以謀殺懸案當中，「受害者的老公」與「嫌疑犯的妻子」雙方攜手合作查案的矛盾心理，為劇情增添戲劇張力。導演高政煜運用過去與現在的時空穿插方式，一點一滴累積角色的情緒，在最後的結局引爆燒腦片的解謎快感。導演透露在執導過程當中，必須細膩呈現人物之間的關係與心理，所以在草擬劇本階段，就不斷諮詢檢察官出身的律師，試圖為劇情增添現實性，甚至還大膽加入殺人案件之後，由遺屬親自清理凶案現場的震撼畫面，體現出受害者及其遺屬所經歷的傷痛。不只調查事件，導演也參考了監獄重刑犯的論文，了解他們實際的殺人動機、行凶方式，以及

  身邊親人的關係，細膩描繪出片中真凶的輪廓。他還諮詢心理學教授，了解人們對某些案件會有哪些反應，細膩呈現出角色內心深處所隱藏的本能。也因為這樣的努力，讓本片成功將各個角色的面向，更加具體地呈現在觀眾眼前，不只增添故事的豐富性，更提高劇情的張力。精彩的劇本也讓男主角宋詩曦（網路又譯宋清晨）力讚：「故事就像發生在隔壁的事情，感覺像是在偷看別人的日記。緊密的人物關係，以及事件的進展速度，都給我留下深刻的印象！」


  這部榮獲富川奇幻影展觀眾票選獎肯定，備受觀眾期待的懸疑驚悚話題強片《真犯》，即將在7月19日於台灣震撼獻映。本片劇情描述英勳（宋詩曦飾演）的妻子慘遭謀殺，他最好的朋友俊成（吳?錫飾演）成為頭號嫌犯。俊成的妻子多燕（裕善飾演）堅信丈夫並非兇手，希望英勳能在上訴時為丈夫作證。英勳答應了多燕，但也要求她協助一同追查真相。就當兩人進行案件還原的某天，英勳意外發現多燕所隱瞞的秘密，多燕也發現英勳家中消失的證據，再加上目擊者尚民（張赫鎮飾演）的出現，讓這起兇殺案變得更加撲朔迷離。隨著真相愈來愈明朗，兩人對彼此的懷疑也愈來

  愈大…。



  欲知本片最新消息，

  請上電影官方部落格

  與臉書粉絲團查詢。


  --'
