url: https://www.ptt.cc/bbs/movie/M.1552664303.A.483.html
title: '[新聞] 2019金馬奇幻影展歡慶10週年132部強片搶看'
content: "2019金馬奇幻影展歡慶10週年 132部強片搶看\n\n2019-03-15 16:59 聯合報 記者陳建嘉╱即時報導\n\n2019金馬奇幻影展十年有成！本屆影展將於4月12日至21日在台北舉行，除了邀請台灣知\n\
  名插畫家安哲操刀設計主視覺，更邀來被粉絲暱稱為「國師」的星座專家唐綺陽跨界擔任\n「奇幻大使」。影展片單包含15個單元、53部（不含未公開的神祕片）精采電影、總計\n\
  132場放映，內容涵蓋科幻、恐怖、驚悚、歌舞、喜劇、動畫、愛情以及各類cult film。\n\n開幕片「大體臨門」（Over My Dead Body）是曾以「青田街一號」提名金馬獎最佳新導\n\
  演的李中的第二部劇情長片，透過一對渴望藉由買房賣房發大財的夫妻，遇到屍體從天而\n降，讓千萬豪宅頓時變成凶宅的「成家」惡夢。柯宇綸、張允曦（小8）、廖峻、林美秀\n\
  、曾之喬、劉冠廷、陳竹昇、張少懷、方季惟齊展搞笑功力。\n\n新銳導演盧豐淵的首部劇情長片「緝魔」（Deep Evil），以整形醫美題材帶來超越尺度\n的驚悚作品，曾提名金馬影帝的莊凱勛與邵雨薇、傅孟柏一起捲入整形美女的斷頭虐殺案\n\
  。二度贏得坎城影展評審團大獎的法國名導布魯諾杜蒙的「泥好，荒唐小鎮」（\nCoincoin and the Extra-Humans）讓兩光警探調查從天而降的泥岩，手法新穎光怪陸離\n\
  ，被權威的法國「電影筆記」選為年度10大影片。阿根廷導演馬里亞諾利納斯費時十年拍\n攝的「花系列」（La Flor），片長超過14個小時，大膽翻玩電影類型元素，也歡迎影迷\n\
  來挑戰！\n\n呼應本屆影展主視覺以「月球」為主題，除了將重現影史第一部科幻電影「月球之旅」（\nA Trip To The Moon），也將選映挪威史上最賣座的動畫電影「月球出任務」（Louis\
  \ &\nLuca - Mission to the Moon），是一部令人省思又能捧腹大笑、甚至可以闔家觀賞的動\n畫。\n\n備受影迷喜愛的「K歌場」，除了有贏得奧斯卡最佳男主角等四項大獎的「波希米亞狂想\n\
  曲」（Bohemian Rhapsody），還有上千名觀眾投票選出的「樂來越愛你」（La La Land\n）、「梁山伯與祝英台」（The Love Eterne）兩場復刻，不僅要將影廳變成KTV包廂，還\n\
  要化身成演唱會舞台。秒殺招牌節目「洛基恐怖秀」（The Rocky Horror Picture Show\n）也將連續第十年嗨翻戲院。\n\n影迷許願成真的經典單元，包括侯孝賢與鳳飛飛、鍾鎮濤合作的「風兒踢踏踩」（\n\
  Cheerful Wind）；好萊塢名導亞歷山大潘恩與奧斯卡影后芮絲薇斯朋從未在台上映過的\n「風流教師霹靂妹」（Election）；金凱利導演、芭芭拉史翠珊唱作俱佳的「我愛紅娘」\n\
  （Hello, Dolly!）；還有影癡許願多年，終於在問世八十週年後重登大銀幕的「亂世佳\n人」（Gone with the Wind）。\n\n本屆焦點導演為美國恐怖大師約翰卡本特（John\
  \ Carpenter），特別選映他最受好評但難\n得一見的「攻擊13號警局」（Assault on Precinct 13）、家喻戶曉的恐怖經典「月光光\n\
  心慌慌」（Halloween）、結合異形入侵、媒體洗腦和美式摔角的「X光人」（They Live\n），還有以美國水門案為靈感、寇特羅素脫胎換骨演出的「紐約大逃亡」（Escape\
  \ from\nNew York），讓台灣觀眾重新認識這位過去被低估的導演。\n\n適逢「異形」上映40週年，另一個「跨夜場」將可連看「異形」一至四集。雷利史考特、\n\
  詹姆斯卡麥隆、大衛芬奇，尚皮耶居內，四大導演各展身手，還有雪歌妮薇佛的精湛演出\n，大銀幕一次看足。\n\n--\n\n帝釋所問經講記77頁拆穿的。\n毗婆舍那講記(含法的醫療)說明如何修四念處增加智慧斷除所有煩惱。\n\
  \  PTMC 寂靜禪園\n、、、、()、、是。\n  是    是\n\n--"
