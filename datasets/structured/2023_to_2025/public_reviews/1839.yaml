url: https://www.ptt.cc/bbs/movie/M.1491671004.A.1CC.html
title: '[好雷] 金馬奇幻影展驚喜場 RAW '
content: '簡單分享一下自己看完的感想吧


  血腥的部分並沒有想象中難以入目

  不過這個在我跟朋友討論後

  覺得可能是我們Walking Dead跟Game of Thrones看得多了

  對血腥的閾值已經提得非常高

  加上我們都具有醫學相關領域背景

  什麼皮啊肉啊血啊，完全沒有障礙


  甚至播映完畢還覺得肚子好餓

  什麼東西這麼好吃啊，根本就宵夜文嘛...


  我個人對RAW這部片的解讀

  主要就是一個社會中的異類

  如何融入（或選擇不融入）這個大環境的隱喻


  其實也不算是隱喻

  因為女主角本身在獸醫學院就很明顯是一個大異類了

  不吃肉、不開趴、無性行為

  跟她的室友形成強烈的對比

  （法國的學校都這麼狂嗎？請問轉學怎麼申請.....）


  被迫吃了生肉後發生的過敏反應

  就像是把異類丟到社會中會發生的矛盾一樣

  覺得煩、覺得受傷、覺得心神不寧


  而姐姐則是一個已經“社會化完全”的個體

  但是卻保有/隱藏了最真實的自我

  姐姐帶著女主角一起踏入社會的舞池

  卻意外地發現/開啟了妹妹一樣的嗜血獸性


  直接跳到最後

  妹妹帶著姐姐去浴室

  洗去身上沾染的血

  這時候姐姐已經恍神，在腥味中迷失自我


  妹妹原本可以用手上的雪杖

  一秒解決掉這個可怕的野獸

  但是她做了不一樣的選擇


  洗去了血，洗去了罪孽

  我們都不要再假裝，把自己硬是套入這個根本不合身的框架裡


  不過最結尾是我一直想不透的地方

  姐姐坐牢，妹妹卻繼續有自由（逍遙法外）

  妹妹少說也有參與到吃室友這件事情上

  是因為姐姐一如吃手指事件一樣，包庇了她嗎？（我覺得很有可能）

  那妹妹又怎麼確定（或是根本不在乎）她會不會繼續吃人呢？


  以上是我的碎片式心得，感覺領悟的程度約有70%

  希望有感想的朋友可以一起討論～～

  感謝閱讀！


  --'
