title: '[新聞] 金馬奇幻影展 四大影展影片登台'
content: '本屆金馬奇幻影展片單陸續公布，而外界一直都很期待的「當代奇幻」單元，這次更網羅

  了坎城、柏林、威尼斯、多倫多四大影展多部奇片。包括曾獲坎城金棕櫚的泰國名導阿比

  查邦大獲好評的《華麗之墓》和勇奪坎城影展「一種注目」單元最佳影片的《羊男的冰島

  冒險》。


  金馬執委會表示，除此之外獲得威尼斯影展最佳導演的《大犯罪家》、「薇拉莉葛琳諾」

  結合悲喜與幻想、直追阿莫多瓦與費里尼風格的封后之作《安娜的美麗人生》和義大利電

  影大師馬可貝洛奇歐獲得國際影評人費比西獎的《最後的吸血鬼》，拿下最佳加拿大電影

  獎的《愛人怪物》，贏得觀眾票選午夜驚狂獎的《超狂亨利》和由名導賈樟柯監製的《枝

  繁葉茂》也都在名單之內。


  (圖:截自金馬執委會)


  新聞網址：


