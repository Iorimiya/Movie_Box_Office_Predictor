url: https://www.ptt.cc/bbs/movie/M.1485237115.A.1A8.html
title: '[新聞] 陳宏一驚悚新作《自畫像》榮膺2017金馬奇幻影展開幕片'
content: '新聞網址：


  017金馬奇幻影展將於4月7日展開，今日搶先曝光陳宏一導演的驚悚新作《自畫像》為本

  屆開幕片。


  陳宏一是橫跨電影、廣告、MV的知名導演。2008年執導的《花吃了那女孩》曾獲金馬獎最

  佳造型設計。2011年以《消失打看》獲瑞士佛瑞堡影展評審團特別推薦獎及台北電影獎最

  佳導演。2014年執導《相愛的七種設計》讓許瑋甯入圍金馬獎最佳新演員。擔任本屆奇幻

  影展開幕片的最新力作《自畫像》曾以企劃入選2015金馬創投會議（原名：《恐怖的並不

  是愛情》）。故事以2016台灣總統大選為背景，熱衷社運的女主角被發現陳屍租屋處，雙

  眼被刨出，全身赤裸，被塗滿油彩，宛如畫作。她的畫家室友與變性閨密皆涉有重嫌。但

  是當案情逐漸清晰，呼之欲出的不只是兇嫌，還有更不安的靈魂。


  陳宏一表示，在這個流行自拍的年代，人們渴望看見自己，他在《自畫像》中嘗試結合繪

  畫，畫出慾望、憤怒、憂鬱、虛榮、暴力等噩夢；並如啟示般，揭開黑暗。除了具備他強

  烈的個人風格，對於當下台灣的愛慾瘋狂，也有令人震撼的手筆。影片邀來在《醉‧生夢

  死》表現不俗的張寗領銜主演，首次參與電影演出的林哲熹、林微弋、Kiwebaby（張喬翔

  ）等新演員皆有大膽演出。本片也已入圍本屆鹿特丹影展角逐大銀幕獎。


  本屆奇幻影展也邀來曾以《南方小羊牧場》入圍金馬獎最佳視覺效果的蘇文聖導演設計主

  視覺，他以外星馬搭乘幽浮來到地球，望見有如世外桃源的景象作為發想，除了加入奇幻

  影展招牌節目《洛基恐怖秀》的經典角色，更在充滿細節的設計中融入廢核家園、婚姻平

  權等理念，期許人與自然、動物、科技和諧共處。手繪稿長達2.5公尺，暗藏玄機的多元

  趣味，讓影迷驚呼簡直是奇幻版的清明上河圖。


  2017金馬奇幻影展於4月7日至16日舉行，更多精彩片單將陸續公佈，獨家選片指南將在3

  月25日舉辦，並於3月26日正式開賣，邀請影迷呼朋引伴，一同參與這場拋開尺度、大開

  眼界的電影嘉年華會。


  --'
