title: '[好雷] 幻影'
content: "沒看過原作\n\n純當不同電影覺得算有水準上的表現\n\n真的沒有某些說的那麼不堪\n\n我也覺得沒必要一直拿劇情不如原作去戳幻影\n\n畢竟是改編且又主打動作戲\n\
  \n\n\n其中道具、佈景看起來真的很舒服\n\n演技、動作也沒什麼地方可以挑\n\n一些劇情上的問題我覺得還是能解釋\n\n像是日軍怎麼那麼廢\n\n大概就像義務役一樣沒什麼訓練\n\
  \n一群雜魚很難面對高手\n\n套到大部分的電影應該也差不多\n\n且我認為幻影已經比去年同樣主打動作戲的的夜叉好非常多\n\n夜叉真的是完全看不到動作只有無聊槍戰的戲而已\n\
  \n夜叉的特種部隊還比幻影的日軍還不如\n\n另外幻影中的朴素丹真的算是本部印象最深的角色\n\n原以為是花瓶但轉換成幻影身分後真的帥氣\n\n整體來說瑕不掩瑜\n\
  \n不會因為不合理的地方而覺得不值得看\n\n\n\n原本就在抉擇要看幻影或火線交涉\n\n看完覺得很滿意覺得沒選錯\n\n對於沒看過風聲的可以考慮看看\n\n\
  --\n \n \n \n \n \n \n\n--"
