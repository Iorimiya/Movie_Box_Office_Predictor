url: https://www.ptt.cc/bbs/movie/M.1486453591.A.4EE.html
title: '[新聞] 金馬奇幻影展帶你暢遊歌舞片的La La Wond'
content: "新聞網址：\n\n\n隨著奧斯卡頒獎典禮的靠近，平影史紀錄入圍十四項的《樂來越愛你》（La La Land）得\n獎呼聲愈來愈高。這部叫好又叫座的電影取法致敬了不少名片，四月登場的金馬奇幻影展\n\
  特別規劃「La La Wonderland」單元，除了讓觀眾可以邊看邊唱《樂來越愛你》，還能在\n大銀幕朝聖《萬花嬉春》（Singin' in the Rain,\
  \ 1952）、《花都舞影》（An American\n in Paris, 1951）、《柳媚花嬌》（The Young Girls of Rochefort,\
  \ 1967）、《紐約\n紐約》（New York, New York, 1977）等數部影史歌舞經典。\n\n\n\n譽為影史最偉大的歌舞片，也是調侃及辨證好萊塢電影夢的先驅，且娛樂性極高，百看不\n\
  厭。舞王金凱利身兼編舞、導演（史丹利杜寧合導），唱作俱佳，他在街頭與燈柱共舞、\n展臂揮帽等招牌舞姿，成了《樂來越愛你》男主角雷恩葛斯林模仿的對象。本片也是前陣\n\
  子隨女兒嘉莉費雪辭世的老牌女星黛比雷諾的成名作。\n\n　　　　　　　　　　\n\n曾囊括六項奧斯卡大獎的《花都舞影》不僅向巴黎致意，成功把繪畫、芭蕾以及古典音樂\n\
  融入歌舞類型的壯舉，更讓這部美輪美奐的作品具有里程碑意義。尤其片尾長達十七分鐘\n的舞蹈，透過想像讓無法結合的男女主角雙宿雙飛，無論場景與敘事，都是《樂來越愛你\n\
  》的靈感來源。\n\n\n除了好萊塢歌舞片，也不能忽略法國巨匠傑克德米對《樂來越愛你》的影響。德米曾以《\n秋水伊人》勇奪坎城影展金棕櫚獎，並以《柳媚花嬌》結合美、法歌舞之長。《樂來越愛\n\
  你》導演達米恩查澤雷也擁有法國血統，他指出傑克德米的電影常因超乎慣例的創意而讓\n人起初不太入戲，卻具備看到最後情不自禁流淚的魔力，這應該也是《樂來越愛你》給許\n\
  多觀眾的感受。德米大膽的場面調度手法和唯美的色彩運用，自然也是達米恩查澤雷的養\n分來源。\n\n\n\n好萊塢歌舞片不乏藝術家分合的故事，大部分都是有情人終成眷屬，無法走完的，通常得\n\
  加上生離死別的煽情藉口，但馬丁史柯西斯有「黑色歌舞片」之稱的《紐約紐約》則反其\n道而行。影壇流傳當年有人勸史柯西斯更改男女主角分道揚鑣的結局、票房保證可以再多\n\
  一千萬，但史柯西斯拒絕了。奧斯卡影帝影后勞勃狄尼洛、麗莎明妮莉為演出本片可說使\n出渾身解數，狄尼洛苦學薩克斯風以強化表演可信度，明妮莉演唱的同名主題曲更成為日\n\
  後所有鐵肺女歌手效法的範本。\n\n\n?\n\n金馬奇幻影展也將上演《樂來越愛你》，除了中文字幕外，出現歌曲時另搭英文字幕，讓\n觀眾可以跟著雷恩葛斯林、艾瑪史東一塊唱，歡迎二刷、三刷\
  \    的影迷來體驗更特別的\n觀影方式。\n\n\n--"
