url: https://www.ptt.cc/bbs/movie/M.1560875118.A.E49.html
title: '[新聞] 韓影唯一！【真犯】入選富川奇幻影展競賽'
content: '新聞網址：



  繼《致命目擊》、《鎖命危機》在台引爆驚悚電影旋風之後，由宋詩曦（網路又譯宋清晨）、裕善（網路又譯柳善）領銜主演的新片《真犯》，即將再以高強度的懸疑燒腦劇情、衝擊性的角色秘密，以及一分一秒都無法喘息的懸念來擄獲觀眾的心，即將在7月19日於台灣震撼獻映！全片聚焦一場人妻謀殺慘案，被害者丈夫與嫌疑犯妻子，兩人相互隱瞞卻又必須共同合作，去追查真兇到底是誰；卻因為目擊者的驚人證詞，讓彼此的猜忌愈來愈深。導演高政煜笑稱自己因為「被借錢不還」，給予他靈感寫出這個劇本，再透過宋詩曦與裕善精采的演技與追兇過程，直到真相揭曉的ꠊ漱@刻，絕對讓人大呼震驚。這部優秀的作品，日前也確定入選本屆富川奇幻影展「富川之選」國際長片競賽單元，也是唯一入選該競賽的南韓電影，證明其卓越的驚悚感，未演先轟動。





  至親好友被控告是殺害妻子的兇手，在任何人都無法相信的混亂狀況當中，好友的妻子跳出來，聲稱自己老公並非兇手，究竟事發當晚發生了什麼事情？如果為了查明真相，必須跟嫌疑犯的妻子聯手合作，又會發生什麼意想不到的衝突？一部懸疑燒腦超越《致命目擊》、《鎖命危機》的南韓懸疑驚悚話題新片《真犯》，就是描述被害者丈夫與嫌疑犯妻子，兩人相互隱瞞卻又必須共同合作追查兇手的精采之作。全片圍繞兇殺懸案當中，許多人的不同主張，以及隱藏其中的衝擊性祕密，打造出流暢且高密度的懸疑性。燒腦情節有如現代版《羅生門》的強烈故事，輔以過去與現在

  交錯的縝密敘事結構，以及精采的導演手法，將帶領觀?一同追查這起兇殺案件。



  對於曲折離奇的的懸疑劇情，身兼編導的高政煜功不可沒，不過他也自爆劇本撰寫的起因，竟是來自一次不好的「欠錢不還」經驗：「當時有個熟識的朋友跟我借錢，錢就這樣有去無回了…。一旁的老婆看了，是不是該覺得心寒呢？即便對方是值得信賴的人，但最終還是變得無法信任。這件事成為一個契機，讓我寫出這個劇本。」值得一提的是，本片除了懸疑之外，也是一部感情戲眾多的電影，演員的演技也變得非常重要。劇組請來活躍於電影與電視領域的宋詩熙，詮釋妻子被殺之後，徘徊於尋找真相的丈夫「英勳」一角；光是透過眼神與念白，就讓觀眾對角色非常信服。

  至於要證明丈夫無罪，而與男主角聯手追查真兇的「多燕」，則由曾演出《青苔：死亡異域》等片，被粉絲譽為「驚悚女王」的裕善擔綱；她也將以多層次的感情表現，以及跟男主角讓人為之緊繃的相互猜忌，?觀?呈現一場令人窒息的驚悚追兇過程。





  此外，《真犯》集結擅長打造驚悚電影的優秀製作班底，像是《捉迷藏》的美術指導、《解凍屍篇》的配樂師、《狼少年：不朽的愛》的化妝指導，共同打造出這部不論導演、劇情、空間設計、色彩、音樂等方面都完美無瑕的驚悚之作。而本片也不負眾望，還未上映就一舉入選南韓富川奇幻影展「富川之選」國際長片競賽單元，成為該競賽唯一的南韓電影，也證明本片卓越的驚悚感。影展方更力讚本片：「在為之震驚的事件之後，隱藏彼此目的想要追尋真相的兩人的故事。導演精心描繪出這個複雜故事的韌性，以及面對真相時猶豫不決，在善惡界線上搖擺不定的柔弱人物形

  象，給人強烈的說服力。尤其宋詩曦與裕善等演員的出眾演技，更是讓人印象深刻。」



  這部備受觀眾期待的懸疑驚悚話題強片《真犯》，即將在7月19日於台灣震撼獻映。本片劇情描述英勳（宋詩曦飾演）的妻子慘遭謀殺，他最好的朋友俊成（吳?錫飾演）成為頭號嫌犯。俊成的妻子多燕（裕善飾演）堅信丈夫並非兇手，希望英勳能在上訴時為丈夫作證。英勳答應了多燕，但也要求她協助一同追查真相。就當兩人進行案件還原的某天，英勳意外發現多燕所隱瞞的秘密，多燕也發現英勳家中消失的證據，再加上目擊者尚民（張赫鎮飾演）的出現，讓這起兇殺案變得更加撲朔迷離。隨著真相愈來愈明朗，兩人對彼此的懷疑也愈來愈大…。



  欲知本片最新消息，

  請上電影官方部落格

  與臉書粉絲團查詢。



  --'
