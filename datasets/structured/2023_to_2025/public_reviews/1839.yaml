url: https://www.ptt.cc/bbs/movie/M.1524189550.A.37F.html
title: '[普雷] 金馬奇幻影展－天黑請關門'
content: '《天黑請關門》：末世生存的掙扎



  《天黑請關門》（It comes at night, 2017）透過今年的金馬奇幻影展在台灣上映，在

  看完之後，必須講這並不是一部典型的恐怖片，因此在國外的評論相當兩極，我認為是因

  為這部電影實在無法說到底好不好看，只能用對不對胃口來形容。而實際上，新銳導演

  Trey Edward Shults的確使用有限的資源跟經費，拍出了一部CP值不算太低的電影。


  本片講述在未知病毒肆虐的時代，Paul（Joel Edgerton飾）為了保護妻子Sarah（

  Carmen Ejogo飾）跟兒子Travis（Kelvin Harrison Jr.飾），在樹林裡遺世獨立的房子

  中建立起屬於這個家的一套制度，並認為跟著制度與規定，才有辦法在這末世中存活。某

  天一個男子闖入他們的堡壘中，男子Will（Christopher Abbott飾）宣稱他是為了家人去

  尋找資源。Paul雖然半信半疑，但還是讓Will跟他的家人帶著大量的食物入住到屋內。本

  來以為相安無事、合作無間的生活，卻因為一次的意外整個崩壞…。


  ■信任的建立與崩壞

  全片並沒有任何前情提要，也不在劇中講述清楚故事背景，只從非常微弱的線索中獲得蛛

  絲馬跡：這是一個未知病毒肆虐的時代，病毒可能會使人死亡，病毒可能透過接觸或是空

  氣傳播，受感染者最好將其殺死並焚燒銷毀。即便如此，本片並不像其他相同類型的電影

  ，在疾病上做許多著墨，反而是描寫在這樣的末世中，如何搭建起信任，以及信任又如何

  崩壞。人心在這樣的狀態下的細微變化，便是導演想要傳達的理念。


  ■末世生存的掙扎

  Paul在為了生存下所做的選擇，演員Joel Edgerton將這份毫不猶豫詮釋的相當精采。但

  要特別提出的便是Travis在片中所展現的內心掙扎與變化。從一開始面對外公因為受到感

  染而被父親給殺死與焚燒，Travis便開始了無止盡的惡夢。他在心中種下了創傷。但與其

  說是創傷，不如說是在潛意識中的某種渴望。


  家中最主要的出入口是紅色的大門，紅色也是本片中最鮮豔的顏色，這讓我聯想到面對病

  毒感染屍體的處置方式－－也就是焚燬。這扇紅色大門對內象徵著保護跟隔絕，待在門內

  才可能存活。但通過大門代表著危險與死亡，在外可能要面對病毒感染的威脅其他存活者

  的攻擊，或是任何未知的危險。


  Travis的夢境中剛開始都會面對到變成喪屍的外公，甚至就算是暗示情慾的夢也都是以變

  成喪屍作為結局。可見「感染」對於這個青少年有著深刻的影響。到最後則是會出現

  Travis離開家在樹林中探索的夢境，而走出紅色的大門就像是投身火焰之中，提醒著觀影

  者，也許Travis心中認為，在這失去希望的末世中，「死亡」可能是唯一的解脫。




  本片最令人印象深刻的是氣氛的營造，在拍攝過程中導演只有使用自然光以及提燈的燈光

  ，讓陰暗的屋內以及樹林中都帶給人窒息般的絕望氣息。然而大多的負面評論多在於恐懼

  感的不足以及故事本身的空洞感。但在這個「後恐怖」電影時代的崛起，許多傳統或是經

  典的恐怖元素已經開始無法滿足一般觀影者的想像，如《逃出絕命鎮》（Get out, 2017

  ）或是《鬼的故事》（A Ghost Story, 2017），都絕非是以往類型的恐怖電影。


  在營造「未知的恐怖感」上，後恐怖電影的類型可能會給觀影者更多的感官刺激及想像。

  因此本片的缺點可能在於尚不足以迎合大眾口味，但優點也在於有限的資源內，導演正嘗

  試著以嶄新的概念跟手法來提供更不一樣的「恐怖片」。



  原文網址看完整版：





  --

  大多都是覺得恐怖片的元素太少 但我個人也還是滿喜歡這種表達方式!'
