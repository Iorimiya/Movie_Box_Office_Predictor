url: https://www.ptt.cc/bbs/movie/M.1680920415.A.056.html
title: '[新聞] 2023金馬奇幻影展熱鬧開幕 六百人齊聚戲院'
content: '2023金馬奇幻影展熱鬧開幕 六百人齊聚戲院用電影《疫起》告別疫情


  2023金馬奇幻影展在MUVIE CINEMAS與台北信義威秀盛大開幕！一開賣就瞬間秒殺的矚目

  開幕電影《疫起》，導演林君陽和監製李耀華也率領聯合監製張庭翡、編劇劉存菡，

  以及劇組演員王柏傑、曾敬驊、薛仕凌、項婕如一同出席今晚的世界首映為影展揭幕。

  劇中參與演出的王明台、陳家逵、高伊玲、許筑婷、黃雋智，特別參與演出的樓一安

  、潘客印導演與郭子乾，以及金獎幕後團隊包軒鳴（攝影）、黃美清（美術）、涂碩峯（

  美術）、解孟儒（剪接）、簡豐書（聲音）、盧律銘（配樂）和嚴振欽（特效）都到場支

  持，和六百多名觀眾迎接疫情解封後的新開始。



  林君陽以2003年撼動全台疫情下封院事件為靈感的電影《疫起》，從籌備階段就備受關注

  ，不僅獲得2020年金馬創投會議百萬首獎，更邀來王柏傑、曾敬驊、薛仕凌、項婕如、張

  永正、謝盈萱等超強卡司加入陣容。電影中描繪致命病毒在醫院爆發後的恐慌，以及醫護

  人員在自保與救人之間的身心拉扯，不僅深刻揭開台灣20年前的抗疫傷痛，也讓經歷過

  COVID-19疫情的觀眾們心有戚戚。


  談到電影《疫起》的創作契機，林君陽表示自己對當20年前的封院事件印象十分深刻，一

  看到電影劇本時就決定要完成這部作品，也為此做了許多研究田調，希望能完整呈現疫情

  當下的人性掙扎。面對作品今晚首次與觀眾見面，林君陽笑說：「就像是準備聯考的緊張

  心情一樣，但也很期待映後和觀眾交流，好奇會聽到什麼樣的問題。」監製李耀華也說：

  「相信這個電影能引起有大眾的共感，希望大家會喜歡這部作品。」


  影視雙棲的王柏傑銀幕角色多變，這回飾演內心矛盾的胸腔外科醫師，以精湛演技詮釋不

  同心境的細膩轉變，大獲觀眾好評。王柏傑表示，自己不僅做了許多專業醫學研究，在訪

  問角色原型的醫師後，了解角色內心的複雜糾結，也希望能完美詮釋。劇中化身媒體記者

  的金鐘影帝薛仕凌，在看似不擇手段的獨家新聞中道出挖掘真相的使命，薛仕凌談起當初

  看歷史新聞紀錄，都是醫院外的視角，這回自己是從醫院內看出去，身處其中的感覺有很

  大的不同。


  影壇矚目新星的曾敬驊和項婕如，兩人繼劇集《做工的人》後再次湊對，飾演在困境間相

  互扶持的護理師與實習醫生。曾敬驊表示自己一開始對護理知識很陌生，在專業護理師的

  指導下，才知道從除菌到替換手套都不能馬虎。項婕如也表示，自己不怕血，但會暈針，

  一開始透過香蕉皮做縫針練習以為很簡單，沒想到排練時改用豬皮，觸感施力完全不同。

  面對兩人劇中的情感對戲，項婕如笑說自己是「戀愛腦」，也會和角色一般為愛相隨，全

  力支持對方。


  2023金馬奇幻影展即日起至4月16日於MUVIE CINEMAS與台北信義威秀影成展開，今年影展

  選映45部影片，超過130場放映，不僅推出美國當代重要導演保羅湯瑪斯安德森的專題放

  映，還有涵蓋科幻、恐怖、驚悚、歌舞、喜劇、動畫、愛情和各類cult film等多部精彩

  作品，以及跨夜場、驚喜場、K歌場、狂歡場等好玩有趣的獨家活動陸續展開。





  --'
