title: '[情報] 2021 金馬奇幻影展 第五波片單'
content: '金馬奇幻影展致敬《科學怪人》90週年

  威尼斯影展酷兒獅獎得主帶來《美好未來》



  2021金馬奇幻影展即將於4月9日在台北熱鬧展開！今年適逢名導詹姆斯惠爾的經典恐怖片

  《科學怪人》（Frankenstein, 1931）問世90週年，除了重現這部鉅作，也特別規劃專題

  選映《科學怪人的新娘》（Bride of Frankenstein, 1935）、《眾神與野獸》（Gods

  and Monsters, 1998）、《蜂巢的幽靈》（The Spirit of the Beehive, 1973）等受其

  啟發的傑作。奇幻影展的固定單元「酷兒理想國」則將推出《我的房東男孩》（Sublet）

  、《美好未來》（The World to Come）、《辣個艾莉絲》（Alice Júnior）三部嶄新同

  志佳片。


  詹姆斯惠爾改編自「科幻小說之母」瑪麗雪萊同名經典的《科學怪人》，不僅在場景、造

  型、剪接和光影上的表現極為原創，男星波利斯卡洛夫的演出更是無人能出其右。電影中

  濃厚的人文思維及寓言色彩，深刻影響提姆波頓、吉勒摩戴托羅等名導，連電影大師費里

  尼都情有獨鍾將其選入影史十大影片。加倍精緻的《科學怪人的新娘》進一步描繪怪物對

  愛情與友誼的渴求，更是影史少數青出於藍的續集電影。


  西班牙導演維克多艾里斯一鳴驚人的神作《蜂巢的幽靈》，透過小女孩觀賞《科學怪人》

  後的幻想世界，揭開政治極權的歷史傷痕，魔幻手法也啟發奧斯卡金獎導演吉勒摩戴托羅

  的《羊男的迷宮》。比爾坎登榮獲奧斯卡最佳改編劇本的《眾神與野獸》，則將《科學怪

  人》暗藏的同志情結與詹姆斯惠爾的晚年秘辛精彩結合，由當時尚未以《X戰警》萬磁王

  為影迷所熟知的老牌戲精伊恩麥克連和青春正茂的布蘭登費雪共譜忘年情。


  如果說《眾神與野獸》揭開了好萊塢名導藏在恐怖片下的情慾，贏得上屆威尼斯影展最佳

  同志電影酷兒獅獎的《美好未來》（The World to Come）有如女女版《斷背山》，深刻

  挖掘舊時代婚姻下的虐心禁戀，威尼斯影后凡妮莎寇比與《怪獸與牠們的產地》凱薩琳華

  特斯頓的演繹十分動人。以《我的軍中情人》、《唱你媽的歌！》聞名的以色列導演伊藤

  福克斯新作《我的房東男孩》（Sublet），讓已婚美國大叔遇到帥氣小鮮肉，把文化衝突

  與世代差異，反轉為真摯的情感對話。在柏林影展大放異彩的《辣個艾莉絲》（Alice J

  únior）則跟上網路直播潮流，讓跨性別網紅掀起性平波濤，又笑又淚地對抗不安與歧視

  。這三部新作都將出現在「酷兒理想國」單元。


  2021年金馬奇幻影展將於4月9日至18日在台北信義威秀與MUVIE CINEMAS展開，選片指南

  將在3月27日舉辦，並於3月28日正式開賣，更多精彩片單與周邊活動訊息將陸續公佈，請

  鎖定金馬官網、臉書粉絲專頁、Instagram，或下載金馬APP，掌握第一手消息。

  -------------------------------------------------------------------------------


  ▍《科學怪人》(Frankenstein,1931) ▍



  好萊塢名導詹姆斯惠爾改編「科幻小說之母」瑪麗雪萊名著的《科學怪人》（1931），堪

  稱影史最偉大的恐怖片之一。詹姆斯惠爾不僅在場景、造型、剪接和光影上都極為原創，

  更深入展現法蘭克斯坦博士與科學怪人背後的科學偏執、社會排擠與怪物本性等主題，充

  滿濃厚的人文思維及寓言色彩，為後世許多恐怖電影反覆演繹。除了對提姆波頓、吉勒摩

  戴托羅等導演產生具體的影響，也被費里尼列為影史十大影片。



  ▍《科學怪人的新娘》(Bride of Frankenstein,1935) ▍



  詹姆斯惠爾繼《科學怪人》獲得空前的成功激勵，續集《科學怪人的新娘》（1935）更讓

  博士重操舊業，為科學怪人打造專屬新娘。電影帶來更加精緻的場景和妝髮，以及濃烈的

  情感與詰問，不僅前承佛列茲朗的《大都會》，後啟提姆波頓的《地獄新娘》，也為哥德

  式電影美學奠下經典里程碑，將懾人心魄的宿命悲劇延伸出完美續篇，成為影史少數青出

  於藍的續集電影。



  ▍《眾神與野獸》(Gods and Monsters,1998) ▍



  好萊塢名導比爾坎登勇奪奧斯卡最佳改編劇本的《眾神與野獸》（1998），則將鏡頭轉向

  《科學怪人》導演詹姆斯惠爾的晚年生活。講述老導演大病初癒，返家後遇上精壯帥氣的

  直男園丁，展開一段奇異的忘年友誼。影片將恐怖經典中潛藏的酷兒隱喻攤在陽光下，比

  爾坎登與伊恩麥克連兩位公開出櫃的同志影人，聯手共揭好萊塢祕史，將不死怪物的幕後

  奇譚，幻化為一首慾望與毀滅交織的好萊塢輓歌。



  ▍《蜂巢的幽靈》(The Spirit of the Beehive,1973) ▍



  受到《科學怪人》啟發的還有西班牙大導維克多艾里斯一鳴驚人的《蜂巢的幽靈》（1973

  ），影片以西班牙血腥內戰為背景，六歲的小女孩安娜深深迷上《科學怪人》中的溫柔怪

  物，陷入朦朧的幻想世界，直到某天，她發現不尋常的腳印與一名負傷的神祕男子。電影

  巧妙以科學怪人情節隱喻政治迫害，迂迴挑戰七○年代佛朗哥政權垮台前夕的電檢制度，

  並透過兒童視角映射歷史傷痕的魔幻手法，多年後更啟發奧斯卡金獎導演吉勒摩戴托羅的

  《羊男的迷宮》。

  -------------------------------------------------------------------------------


  ▍《美好未來》(The World to Come,2020) ▍



  以演員出道，且憑《邪惡的養成》、《逆光天后》編劇廣為人知的挪威導演莫娜費斯沃德

  ，勇奪威尼斯影展最佳同志電影酷兒獅獎的《美好未來》，更展現她的導演才華。故事改

  編自美國作家吉姆薛波短篇小說，邀來威尼斯影后凡妮莎寇比與《怪獸與牠們的產地》凱

  薩琳華特斯頓演繹一段十九世紀的虐心禁戀。透過16mm膠卷捕捉唯美的山林光影，宛如柔

  情萬千的女女版《斷背山》，令人怦然又痛徹心扉。



  ▍《我的房東男孩》(Sublet,2020) ▍



  以《我的軍中情人》名噪全球的以色列導演伊藤福克斯，同志議題新作《我的房東男孩》

  ，讓已婚中年男同志作家遇到電影系學生的帥氣房東，一個就寢前必定換上睡衣，一個用

  交友軟體約炮友，五天的相處時光滿是新舊世代的差異衝擊，卻也揭開各自深藏的哀傷與

  溫柔。伊藤福克斯再次以真摯動人的情感，透過美國大叔與猶太小鮮肉的五日情，不僅反

  思種族、性向、家庭、婚姻，也讓不同世代走進彼此心中，展開對話。



  ▍《辣個艾莉絲》(Alice Júnior,2019) ▍



  巴西新導吉爾巴羅尼傲視影壇的青春酷兒電影《辣個艾莉絲》，讓跨性別網紅掀起風潮。

  故事講述跨性別少女艾莉絲是直播界明日新星，但搬家換校後宛如身處地獄；幸好除了父

  親支持，怪胎妹、刺青女、捲毛男、以及未來的時尚大師逐一加入她的世界；但當友誼晉

  升為愛，愛情習題將為性平浪潮掀起巨大風波。影片從視覺元素到剪輯手法都充滿網路世

  代的獨特神采，一班年輕演員以青春活力對抗外界的不安與歧視，勇敢追尋自我、愛情、

  友誼和家庭，令人熱淚盈眶。


  --


  --'
