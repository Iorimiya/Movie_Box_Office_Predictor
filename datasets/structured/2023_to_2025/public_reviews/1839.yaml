title: '[情報] 2022 金馬奇幻影展 一～三波片單'
content: "《媽的多重宇宙》（Twisted Strings）\n\n\n以狂想喜劇《屍控奇幻旅程》驚艷影壇的美國導演丹尼爾關、丹尼爾舒奈特，新作《媽的\n\
  多重宇宙》把腦筋動到國際巨星楊紫瓊身上，她宛如千面女郎，從心力交瘁的主婦不斷變\n身，成為跨越無限宇宙的最強老媽，和《七寶奇謀》關繼威、《月光光心慌慌》潔米李寇\n\
  帝絲一起突破形象拚演技。潛力新秀史蒂芬妮許華麗出演與母親相愛相殺的逆女，誇張造\n型完勝渡邊直美，目不暇給的百變演出，令人直呼過癮。\n\n\n\n 《良辰吉時（最後三集）》\n\
  \n\n由侯孝賢導演擔任總監製、以《強尼‧凱克》提名金馬獎的新銳導演黃熙執導的奇幻劇集\n《良辰吉時》，描述一個詭異城市接連發生多起荒誕的死亡事件，從老死、病死、自殺、\n\
  他殺、意外到不詳死因，各自獨立的七個篇章，卻有著微妙關聯。影片不僅邀來攝影姚宏\n易、美術黃文英、配樂林強、許志遠等金獎班底打造虛實交錯的城市巷弄，更請出金馬得\n\
  主李康生、謝欣穎、瑞瑪席丹、陳姸霏，以及張艾嘉友情演出，還有楊祐寧、姚以緹、段\n鈞豪、薛仕凌、黃仲崑、林哲熹、白潤音等豪華陣容卡司。\n\n－－－－－－\n\n\
  \n\n\n\n《大尉叛逃記》（Captain Volkonogov Escaped）\n\n\n俄羅斯導演夫妻檔娜塔莎摩古羅瓦、艾力克西楚波夫入選威尼斯影展競賽片的《大尉叛逃\n\
  記》，找來《邂逅在六號車廂》俄羅斯代表新星尤里鮑里索夫，飾演一名在史達林政權下\n被肅清的祕密警察，為了避免死後地獄的無盡折磨，他踏上一段懺悔之旅。影片揭開蘇聯\n\
  紅色恐怖下的荒謬和殘酷，以及無所不在帝國幽靈，叩問真相與平反的到來。\n\n\n《極惡無間》（The Execution）\n\n\n俄羅斯新銳導演拉多克瓦塔尼亞的首部劇情長片《極惡無間》，描述一名警探耗時數年終\n\
  於抓到殘害30多名女性的連續殺人魔，正當他慶祝破案之時，竟然又出現新的受害者。影\n片以真實犯罪案件為靈感，巧妙透過心理驚悚的黑色電影，描繪蘇聯解體前的小人物群像\n\
  ，以及對鐵幕國家機器的控訴。乍看以為是塔可夫斯基的《殺人回憶》，但當剪輯時序翻\n轉，竟是蘇聯復仇史詩版《無間道》，宏大的格局與敘事野心，令人震撼。\n\n\n\
  《弒女的故事》（No Looking Back）\n\n\n勇奪多項影壇奇幻大獎的《岳父受死吧》俄羅斯新銳導演基里爾索科洛夫，這回不來女婿\n大戰岳父這套，喜劇新作《弒女的故事》竟是老媽聯手不孝女的前夫，誓把孫女奪回來！\n\
  有其母必有其女，這對相愛相殺的三代母女情家務事，連警察都難辦。視覺強烈，風格明\n快，戰鬥民族的母女大和解真的沒有《淑女鳥》那麼簡單，飛車追逐加森林逃亡，頭破血\n\
  流和無情子彈，最痛的傷是最深的愛。\n\n\n《犀牛－浪流連》（Rhino）\n\n\n曾因參與政治運動而遭俄國囚禁的烏克蘭導演奧雷森索夫，一出獄便展開拍攝的《犀牛－\n\
  浪流連》，講述烏克蘭在蘇聯政權瓦解後，權力真空導致社會充斥貪腐與街頭犯罪，一名\n男孩憑著無懼狠勁和勇猛身手，成了各路人馬敬畏的「犀牛哥」，然而刀口舔血的人生，\n\
  卻也日夜反噬著他的身心。影片邀集烏克蘭小城當地居民共同演出，以長鏡頭穿梭在有血\n有肉的真實場景，神乎其技的場面調度令人讚嘆。片中對角色心理的深刻探索，也為黑幫\n\
  電影增添另類光譜。\n\n\n《魂斷威尼屍》（Veneciafrenia）\n\n\n金馬奇幻影展曾專題介紹的西班牙鬼才導演伊格萊希亞，最新作品《魂斷威尼屍》帶著他\n\
  的瘋狂奇想來到觀光勝地威尼斯。一名即將踏進婚姻的脫單女，和閨密來到威尼斯參加嘉\n年華縱情狂歡，沒想到迎接她們的竟是當地居民的抗議和怪客騷擾，當友人神祕失蹤後，\n\
  才發現居民敵意不是說說而已。片中這座精雕豔麗城市背後令人猝不及防的集體暴力，將\n帶來前所未有的感官眩惑。\n\n\n《蠻牛的復仇》（Bull）\n\n\n英國名導保羅安德魯威廉斯繼驚艷影壇的《亡命英倫》，這回帶來更黑暗驚悚《蠻牛的復\n\
  仇》。影片講述硬漢「蠻牛」闊別十年後回到家鄉，除了決心不擇手段找到愛兒，還要那\n些當初將他驅逐的幫派成員付出背叛代價，多年前的殘酷真相終將揭開。宛如小鎮版《追\n\
  殺比爾》，無情暴力和噴發血漿粗礪爽快，略帶神祕主義的詭譎氛圍更為本片增添迷人色\n彩，爛番茄影評網站更獲得超高分好評。\n\n\n《爆橘的正義》（Bloody\
  \ Oranges）\n\n\n法國電影、舞台劇雙棲導演尚克里斯多夫莫里斯，在坎城影展好評如潮的法式黑色喜劇《\n爆橘的正義》，以日常角色揭開偽善人性。從家產散盡的老夫妻、貪得無厭的財政部長，\n\
  到情竇初開的青春少女，把矯情偽善與自私暴戾，加料炒出一盤激辛嗆辣的浮世亂象大雜\n燴，當看似錯綜的多線敘事最終同流合污，正義才踏著迷離腳步翩翩降臨，完美示範如何\n\
  賞政治正確一記大耳光，看得爽度爆表！\n\n－－－－－－\n\n\n\n\n\n┃《節日》（Jour de fête, 1949）┃\n\n\n賈克大地首部執導劇情長片《節日》（1949），一名法國小鎮郵差在園遊會上觀賞到一部\n\
  美國現代化郵政系統的紀錄片，決心自我改造，展開一場令人啼笑皆非的驚奇冒險。影片\n透過低限對白、靈活肢體、錯位音效，展現荒誕日常與詼諧妙趣。以小人物視角，諷諭美\n\
  國現代工業科技化對法國傳統生活的衝擊與滲透，也奠下賈克大地日後的創作母題。影片\n一推出即斬獲口碑票房雙豐收，也贏得威尼斯影展國際獎最佳劇本獎。\n\n\n┃《于洛先生的假期》（Les\
  \ vacances de Monsieur Hulot, 1953）┃\n\n\n賈克大地繼《節日》編導演大獲好評，在《于洛先生的假期》（1953）則化身這位影史經\n\
  典喜劇角色于洛先生，高大笨拙的他來到海濱旅館度假，雖然本性善良又真誠開朗，卻總\n是不合時宜，頻頻弄巧成拙，還惹出一連串的鬧劇。賈克大地精心編排視覺「笑」果，開\n\
  懷大笑之餘，也探觸人性溫柔，初亮相「于洛先生」不僅引發熱烈迴響，也將賈克大地的\n喜劇品牌成功推向國際，贏得坎城影展影評人費比西獎與美國國家評論協會傑出外語片等\n\
  殊榮。\n\n\n┃《我的舅舅》（Mon oncle, 1958）┃\n\n\n賈克大地首部彩色電影《我的舅舅》（1958），描述習慣傳統生活步調的于洛先生，住進\n\
  姊姊的高科技住宅裡，遊手好閒的他被姐夫視為孩子的壞榜樣，偏偏姪子就愛與舅舅閒晃\n。雖然姊姊一家幫他安排工廠工作，還積極牽線良緣，無奈于洛就是和這新時代的制式生\n\
  活水火不容。賈克大地精彩地透過荒誕日常，犀利反諷現代人際關係的溝通失能、機械化\n生活，以及物質至上的消費社會，堪稱集其藝術之大成。一舉拿下坎城影展評審團特別獎\n\
  和奧斯卡金像獎最佳外語片。\n\n\n┃《遊戲時間》（Playtime, 1967）┃\n\n\n賈克大地一生僅完成六部長片，《遊戲時間》（1967）是他耗費最多心力，亦是最鍾愛的\n\
  作品。他在片中依舊扮演最受歡迎的于洛先生，這次和美國女孩芭芭拉在巴黎相遇、交錯\n，從機場、公寓、展館、公園、辦公室到驚人的車陣。賈克大地不以花都實景拍攝，反而\n\
  全數搭景，打造比當時的「現代」還要「前衛」的市容，暗喻老巴黎的魅力或許會在「未\n來」消逝殆盡，就像于洛先生所代表的精神。賈克大地驚人的魄力與眼界，不僅讓人嘆為\n\
  觀止，也完整見識到他在電影內容與形式的超越。\n\n\n┃《車車車》（Trafic, 1971）┃\n\n\n賈克大地拍攝「于洛先生系列」最終曲《車車車》（1971），于洛先生這回搖身一變成了\n\
  汽車繪圖設計師，奉命和貨車司機、美豔公關一起將新車運往在阿姆斯特丹舉辦的車展會\n場，路途卻一波三折，上演一段驚心動魄的旅程。影片獲得荷蘭資金贊助，雖然原定以電\n\
  視電影規格製作，這部生涯晚期作品仍延續賈克大地一貫的個人風格，展現嫻熟流暢的喜\n劇技法。細緻鋪排的詼諧橋段讓人捧腹大笑，他更不忘在片中對高度現代化的科技亂世，\n\
  投以荒誕一瞥。\n\n\n┃《遊行》（Parade, 1974）┃\n\n\n賈克大地為瑞典電視台拍攝電視電影《遊行》（1974），是他完成的最後一支珍貴長片作\n\
  品。在柏格曼的傳奇攝影師貢納費雪掌鏡下，拍攝由賈克大地親自主持的馬戲團盛會，既\n是對馬戲團表演的忠實紀錄，也實驗性地打破了觀眾與表演的距離，挑戰真實與想像的分\n\
  際。作為生涯謝幕作品，影片彷彿也為觀眾召喚了賈克大地當年以喜劇表演驚豔全場的舊\n日時光。\n\n----------\n\n┃《我不是慣老闆 》（The Good\
  \ Boss）┃\n\n\n曾以《失業日光浴》代表西班牙角逐奧斯卡的名導費南多李昂狄阿拉諾，諷刺喜劇新作《\n我不是慣老闆 》再度與西班牙影帝哈維爾巴登聯手出擊，從失業工人化身大老闆，眼看\n\
  卓越企業獎就要到手，暴走部屬、抗議員工還有實習美眉卻輪番攪局，他四處奔走，卻一\n再失算。哈維爾巴登演出雙面總裁的陰鷙與霸氣，既討厭又充滿魅力。影片更打破哥雅獎\n\
  紀錄狂攬20項提名，勇奪得最佳影片、導演、男主角、原著劇本、剪輯、原創配樂等六大\n獎。\n\n\n┃《尖叫開麥拉》（When the Screaming Starts）┃\n\
  \n\n演員出道的英國導演康諾博魯，首部長片《尖叫開麥拉》便笑翻眾影壇、好評如潮。電影\n以偽紀錄片手法開場，講述一位紀錄片導演遇上立志成為連續殺人犯的男子，兩人一拍即\n\
  合，更決心組織殺人集團，從面試嗜血同黨到進行合宿集訓，一場殺戮儀式即將展開，最\n爆笑的虐殺電影就要登場。影片精妙擷選並顛覆所有驚悚類型元素，更讓人捧腹大笑。對\n\
  虐殺電影人設及橋段如數家珍，或熱愛《吸血鬼家庭屍篇》冷調幽默的奇幻發燒友們，千\n萬別錯過！\n\n\n┃《兄弟超有事》（Goodbye Happiness）┃\n\
  \n\n以《星叭克超有種》紅片影壇的加拿大導演肯史考特，暖心喜劇《兄弟超有事》再度梳理\n笑中帶淚、愛恨交織的親情關係。個性南轅北轍的四兄弟在父親葬禮上重聚，相約帶著父\n\
  親骨灰回到家族的海島別墅，送父親最後一程，然而一見面就吵架的他們，是否能發現父\n親留下的真正寶藏？曾在札維耶多藍《聽媽媽的話》出道的法蘭索瓦阿諾，獻出大銀幕演\n\
  技代表作，道出西方家庭倫理的獨特面貌。\n\n\n┃《非戀人絮語》（Nö）┃\n\n\n曾以《少女的歧禱》奪得柏林最佳劇本獎的德國名導迪特里希布格曼，新作《非戀人絮語\n\
  》講述一對被親朋好友追問婚期的情侶，但他們從交往到同居再生子，從愛情到成家，不\n變的是他們的未婚關係。 導演以魔幻寫實的場面調度技驚四座，把派對變監獄、產房變\n\
  戰場。透過一場戲、一個鏡頭或是一幕人生片刻，十三段荒誕冷冽的戀人絮語既是致敬電\n影大師洛伊安德森，而伍迪艾倫式的愛情詰辯，也讓感情成為檢驗世俗規範與集體意識的\n\
  試紙，透析背後的文化光譜。\n\n----------\n\n\n\n┃《飛向太空》（Solaris, 1972）┃\n\n\n電影大師安德烈塔可夫斯基的《飛向太空》（1972），上映半世紀以來被視為橫越科幻電\n\
  影框架的經典之作。影片改編波蘭自科幻作家史坦尼斯勞萊姆同名小說，一名心理學家前\n往廢棄太空站調查索拉力星，深藏內心的幽暗深淵，彷彿被索拉力星的神祕力量給召喚出\n\
  來，逝世多年的亡妻竟也重生來到眼前。塔可夫斯基鏡頭下的美學與思辨，不僅超越科幻\n電影，更賦予電影語言思想，將人類的認知推向極限。\n\n\n┃《西城故事（1961）》（West\
  \ Side Story, 1961）┃\n\n\n由《真善美》導演勞勃懷斯與東尼獎得主傑若姆羅賓斯攜手執導的《西城故事（1961）》\n，不僅賣座鼎盛，更勇奪10項奧斯卡，在美國電影協會影史最偉大歌舞片選拔高踞亞席，\n\
  僅次於《萬花嬉春》。電影把莎士比亞的《羅密歐與茱麗葉》搬到二十世紀紐約，劇情雖\n然耳熟能詳，但它對歌舞藝術的開創卻是劃時代的。伯恩斯坦的作曲融合交響樂與爵士樂\n\
  、傑若姆羅賓斯賁張高調的舞蹈，以及勞勃懷斯大張旗鼓的場面調度則讓實景與片廠、寫\n實與夢幻融合為一。即使史蒂芬史匹伯出手重拍，也難以撼動其經典地位。\n\n\n\
  ┃《拿破崙炸藥》（Napoleon Dynamite, 2004）┃\n\n\n美國名導傑瑞海斯以超低成本獲得百倍票房的《拿破崙炸藥》（2004），找來《冰刀雙人\n\
  組》冰上花美男瓊海德獨挑大樑，飾演美國中西部小鎮的高中生「拿破崙炸藥」，不受同\n儕青睞也沒有異性想愛，當得來不易的新朋友決定參加學生代表選舉，他當然要使出渾身\n\
  解數一波！無厘頭的冷冽笑料、怪咖角色大集合，讓本片在魯蛇電影豎立起神聖不可侵犯\n的地位，甚至誕生出「拿破崙炸藥節」。白線條樂團與傑米羅奎的時代金曲，加上瓊海德\n\
  經典的魔性舞姿，更成就本片的獨特氣質與狂熱人氣。\n\n\n┃《巴西》（Brazil, 1985）┃\n\n\n英國奇幻名導泰瑞吉蘭揚名影壇的反烏托邦經典之作《巴西》（1985），故事描述在體制\n\
  至上的近未來，平凡的公務員總是夢見自己成為拯救美女的飛天英雄，沒想到美女真有其\n人，還是警察追捕的對象，他決定在現實生活中解救她。天馬行空的奇幻色彩，復古又前\n\
  衛的驚人造型和場景，結合《銀翼殺手》黑色陰鬱科幻風格，打造出一齣超現實的諷刺喜\n劇。影片當年上映時的美好大結局，讓泰瑞吉蘭和電影公司鬧得不可開交；本次修復導演\n\
  版重登大銀幕，導演腦內的異想迷幻世界，保證原汁原味完整呈現。\n\n\n┃《破膽三次》（The Howling, 1981）┃\n\n\n美國恐怖名導喬丹提代表作除了《陰陽魔界》、《小精靈》，其中《破膽三次》（1981）\n\
  ，更是40年來影史狼人電影中的不敗經典。故事講述美女主播在電視台與警察聯手下，終\n於擺脫恐怖陌生人的騷擾，餘悸猶存的她來到療養中心接受治療，但行徑怪異的居民、破\n\
  碎的夢境和窗外的嚎叫都讓她心神不寧。影片除了超級逼真的特殊化妝，令人心驚膽顫過\n目難忘；其中暗諷媒體亂象，更點破人性瘋狂，在壓抑的軀殼之下，每個人心中都藏有一\n\
  匹狼。\n\n-----------\n\n看了板上好像都沒人貼 就把目前公布的片單一次貼上來\n\n然後據國家影視聽中心董事長藍祖蔚老師的貼文\n《少年吔，安啦》三十週年數位修復版\n\
  也會在今年奇幻影展首映 且於七月全台排映\n\n--\n\n--"
