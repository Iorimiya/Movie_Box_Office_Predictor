title: '[好雷] 金馬影展：夏威夷男孩－人生中的一段涼夏'
content: "影展中強打得深津繪里和蒼井優都是驚鴻一瞥，千萬別被騙了！\n出現比較多的大概是長谷川潤，但是倍賞千惠子飾演的比婆婆超搶戲！\n\n很喜歡這部片緩慢的氣氛，不經意流露的笑點\n\
  還有許多對話很少，但卻不言而喻的場景。\n\n金馬影展好像只剩下一場平日中午的票了...要買要快！\n\n圖文網誌版：\n\n--------------------------------------------------------------\n\
  \n　說到夏威夷，除了是個風光明媚的度假勝地外，它也總帶給人慵懶、\n悠閒的形象。\n\n　真田敦的首部劇情長片【夏威夷男孩】便是充滿這種風格的一部片，\n它不光展現了夏威夷和緩的生活節奏，也融入了日本人一貫的溫暖和情\n\
  感鋪陳，讓這部電影在輕鬆之餘還讓人倍感溫馨感人。\n\n　電影展現出人與人之間的真摯情懷。而當中的所有場景皆發生在聚集\n許多日本人移民的夏威夷小鎮上，不光是風光明媚的海天一色場景，或\n\
  是電影中出現的許多精緻美食，甚至是電影裡許多個性可愛的居民們，\n都讓人感覺可親可愛。更別提電影當中展現的優閒生活，讓人看完後恨\n不得想立刻收拾行李，前往這個美麗之地。\n\
  \n　在金馬奇幻影展首次播映，這部電影被分配到「非一般愛情故事」單\n元，如果沒有實際看過這部電影，光是看電影手冊上的介紹，還會以為\n是岡田將生所飾演的雷歐和比婆婆兩人在這個宛若觀光勝地的小鎮上，\n\
  所發生的一段忘年之戀（笑）。但看完整部電影之後，卻讓人心中充滿\n了溫暖，感動萬分。【夏威夷男孩】劇情其實並不是一開始所想像的愛\n情電影，其實在輕鬆詼諧的情節之外，還透露出了一些哲學般令人反思\n\
  的人生道理。在電影當中真要具體描述的話其實沒有太曲折離奇的走向\n，主要在描寫這座小鎮上發生的種種人事物，呈現了這座夏威夷的各種\n生活片段。\n\n  劇情發生真實存在於夏威夷北方的濱海小鎮荷諾卡，這裡感覺像是與\n\
  世隔離的，時間來到了這裡就此停止。一開始令人會心一笑的種種情景\n，在那裡像是理所當然般的存在，猶如世界不變的定理。整部電影就用\n這種不急不徐的步調去說這個故事，加上種種甘草穿插其中，為這部電\n\
  影注入了生動活潑的原宿。雷歐和比婆婆在神奇的情況下相遇，接著成\n為了一般情況下不會變成的忘年之交。在電影中出現，充滿創意和意想\n不到食材組合的美食，就猶如電影中的人事物一樣，乍看之下奇特，但\n\
  卻如此自然。或許會覺得電影裡那位有時差又愛睡覺的老爺爺、偷吃店\n內商品又忙著減肥的老闆娘、沉默寡言卻又不經意透露笑點的電影放映\n師這些組合在一起很奇妙，但是在看完整部電影之後，卻又讓人覺得融\n\
  入其中，理所當然。\n\n　在前面用了那麼多「理所當然」這樣的形容，但電影本身的情節並不\n是那種讓人理所當然能猜到的老梗。在倍賞千惠子所飾演的比婆婆，對\n\
  雷歐處處展現不經意的溫柔，又用美食企圖誘拐岡田的企圖，在觀眾看\n來感覺既可愛又純情，也對婆婆墜入愛河的表現一目瞭然，然而這部戲\n並不會讓觀眾馬上就猜到這部電影的結局。雷歐和比婆婆這段朋友以上\n\
  ，戀人未滿的親密關係，反倒有點像是家人的陪伴，教人看了叫人心頭\n好溫暖。但當觀眾看見雷歐只當比婆婆是朋友，並沒有把她當座談戀愛\n的對象時，那種失落之情難免無法掩飾，更別說是片中比婆婆好幾次試\n\
  圖掩飾自己的失落去成全兩人的愛情，但難免小小吃醋想給個教訓的表\n現。\n\n　電影難免有令人趕到沉重的部分，但是猶如一切幻化成風般，導演和\n編劇並未想讓這樣的氣氛持續壟罩在電影中。到了最後我才有種恍然大\n\
  悟的感覺，原來在小鎮當中，那種時光暫停的悠閒生活，以及日復一日\n的理所當然，全非僅僅是虛度光陰，而是有所意義的。人和人的相遇和\n分離，皆屬必然，可能我們活在世上，生而在世，就是為了和某人相遇\n\
  ，我們在人生道路上，就注定要遇見某人。這是我們生命中必須要學會\n的學分，也是僅屬於自己不假手他人的珍貴經驗。我相信雷歐在那個夏\n天在荷諾卡所經歷的點點滴滴，必定會成為他保貴的經驗和永難忘懷的\n\
  回憶。在這段旅途中所經歷的那些不可承受之輕，總有一天也會成為自\n己所珍惜的寶貴經驗。\n\n　我們學到的，就是要把這一切當作是自己寶貴的一部分，儘管失去了\n\
  ，但在荷諾卡，這些人事物在心裡終究不會改變。就如那虛無飄渺，又\n讓人深深憐愛的月之虹般，當我們在次回到這裡時，相信一切都不會失\n去，只是暫時將他收到記憶的抽屜裡罷了。\n\
  \n　【夏威夷男孩】是一部輕淡的小品，他展現了夏威夷的小鎮風情，雖\n然場景在異國，但電影仍然充滿濃濃的日本風格和人文關懷。它不光僅\n是生活片段的縮影，更重要的是讓我們能了解到，人和人的相遇、以及\n\
  離別，也都是屬於自己的珍貴寶物，這並非是一部愛得火熱的愛情電影\n，而是在涼夏中給人治癒感的作品，讓人看完後忍不住感動落淚。電影\n裡集合蒼井優、深津繪里等演員的驚鴻一瞥，更讓人不容錯過這部清新\n\
  的夏日小品！\n\n電影預告：\n\n--\n　　  我討厭下雨的緊繃\n對擺出彷彿要的姿態\n      \n因為要放晴的緣故陷入睡眠\n       它就會用的速度\
  \  \n  \n\n--\n◆ From: 218.34.54.55\n                                      04/10\
