url: https://www.ptt.cc/bbs/movie/M.1660135905.A.5F5.html
title: '[新聞] 【末日救世主】奪加拿大奇幻影展最佳首部'
content: '新聞網址：



  瘋狂爆笑動作喜劇《末日救世主》，在席捲日本口碑與票房之後，日前更轟動國際，在有

  「北美最大類型影展」之稱的「加拿大Fantasia奇幻影展」上，榮獲New Flash Award的

  「最佳首部電影」肯定，同時也是日本電影首度榮獲這項大獎。導演平野隆聽聞喜訊後，

  驚訝表示：「很榮幸可以透過這部作品，向世界傳達『感動』。」男主角伊藤英明也表示

  ：「身為演員，看到本片不只在日本，還可以跨越國境讓這麼多人欣賞，知道這部這麼棒

  的電影，真的感到很開心。」他更發揮幽默本色對媒體笑稱：「如果這段感言需要翻譯成

  英文的話，麻煩大家與我聯繫，我會重新發表的。」此外，台灣發行商考量要確保本片有

  更多戲院與映演場次，決定將檔期順延一週，改至9月2日於台灣爆笑上映；搭配精美獨家

  贈品的超值預售票資訊，也將在近日公佈，敬請影迷密切期待。





  創辦於1996年的加拿大Fantasia奇幻影展，如今已經邁入第26屆，放映來自亞洲、歐洲、

  北美等400多部影片；由於規模龐大，也因此有「北美最大類型影展」美譽。影展近日也

  公佈得獎名單，來自日本的《末日救世主》，便一舉榮獲New Flash Award的「最佳首部

  電影」肯定，也是日本電影首度獲得這個獎項，表彰知名製片人平野隆首度當導演，就以

  精湛的導演手法，讓北美觀眾笑得樂不可支。尤其本片以搞笑及科幻要素作為基底，再染

  上戀愛喜劇色彩，天馬行空的同時，也昇華成能跨越時代及世代，進而引發共感的娛樂大

  作，也讓評審團力讚本片之所以獲獎的原因：「這是一部荒謬又俏皮的喜劇，當中有古怪

  又可愛的角色，以及動漫般的人物表情，讓你所看到的一切都變得更加有趣。雖然作為一

  部類型電影已經夠好笑，但這部作品已經成功超越了這一點。」





  《末日救世主》導演平野隆聽聞獲獎喜訊，也驚訝地表示：「就連對日本人來說，這都是

  一部艱澀且需要哲理思考的作品，但很感謝評審團打破語言隔閡，給予這部作品高度評價

  。」他並感性地說：「我也很想念和這些日本代表性演員們，共同討論如何演繹觸動人心

  細膩表演的日子，很榮幸可以透過這部作品，向世界傳達『感動』。」而在片中飾演末日

  戰士的男主角伊藤英明，對於本片獲得肯定也笑說：「恭喜平野導演！！很抱歉之前一直

  開玩笑說：『才不是這種感覺啦！』『現在這把年紀了，才不想演這種電影呢！』『這種

  電影怎麼可能會得獎啦！』身為演員，看到本片不只在日本，還可以跨越國境讓這麼多人

  欣賞，知道這部這麼棒的電影，真的感到很開心。非常感謝本片的所有工作人員，也謝謝

  大家喜愛這部電影！」此外，他更發揮幽默本色，進一步對媒體記者喊話：「各位記者朋

  友們，如果這段感言需要翻譯成英文，麻煩大家與我聯繫，我會重新發表的。」



  這部改編自經典同名漫畫，由伊藤英明領銜主演的瘋狂動作喜劇《末日救世主》，即將在

  9月2日於台灣爆笑獻映；搭配精美獨家贈品的超值預售票資訊，也將在近日公佈，敬請影

  迷密切期待。本片劇情描述好久好久以前，一個末日預言，宣告世界將在1999年毀滅。為

  了拯救人類滅亡危機，一位導師在小島上訓練弟子，學習無人能敵的「無戒殺風拳」。然

  而時光飛逝，如今已經來到2022年，世界依然還沒毀滅…。等到不耐煩的導師決定閃人，

  於是集結眾人宣告就地解散，徒留一幫傻眼的弟子們…。卸下拯救世界的重擔之後，勝平

  （伊藤英明飾演）與同伴來到繁華又和平的東京。對他來說，這裡五光十色的都市生活，

  一切都感到新鮮不已。他先是幫助膽小懦弱的大學生啟太（西畑大吾飾演），之後更對女

  大學生山瀨春（上白石萌歌飾演）一見鍾情。不過這位只知道拯救世界、卻完全沒有生活

  自理能力的男人，在他無用的鐵拳之下，將會在東京遇到什麼令人哭笑不得的事情？他又

  能在一連串新鮮的初體驗中，享受他那遲來的青春，並領悟到愛的真諦嗎？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
