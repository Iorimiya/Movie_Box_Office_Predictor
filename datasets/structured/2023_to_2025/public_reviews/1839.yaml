title: '[評論] 聞天祥談 / 2019 金馬奇幻影展匈牙利電影'
content: "來勢匈匈──金馬奇幻影展的匈牙利電影\n\n\n\n--\n\n講到匈牙利電影，影迷聯想到的大多是楊秋（Miklos Jancso）、貝拉塔爾（Bela\
  \ Tarr）\n等長鏡頭大師，或是在奧斯卡拿下最佳外語片的二戰電影《千面惡魔梅菲斯托》\n（Mephisto, 1981）、《索爾之子》（Son of Saul,\
  \ 2015）。\n殊不知他們堅實的電影傳統早已化為天馬行空的想像力，\n或者該說即使是熟悉的題材也有不一樣的表現手法。\n\n或許有人會把這歸功到近年以《忠犬追殺令》（White\
  \ God, 2014）、\n《天使追殺令》（Jupiter’s Moon, 2017）的柯諾穆恩德秋（Kornel Mundruczo）\n跨入本地藝術院線的導演身上。其實早在\
  \ 2003 年，\n出生在洛杉磯但長大後回匈牙利學電影的莫洛德安塔爾（Nimrod Antal）\n就已經把布達佩斯地鐵查票員的生活拍成驚悚懸疑片《地鐵迷宮》（Kontroll,\
  \ 2003），\n掀起了一股類型化的風潮。\n\n但走在更前面的是喬治帕爾菲（Gyorgy Palfi），他的《田園春光》（Hukkle, 2002）\n沒有一句對白，卻利用各種聲響，以及有節奏的打嗝，完成一個小村莊的謀殺案；\n\
  之後的《百年癲狂》（Taxidermia, 2006）和《公寓瘋光》（Free Fall, 2014）\n也都是在影展震驚不少觀眾，無論是探索食慾、性慾、藝術的沉迷，\n\
  或是透過一個自殺未遂的老太太帶出每道門後面本本難念卻光怪陸離的經，\n想像力和批判力皆不容小覷。\n\n他根據《索拉力星》（Solaris）科幻小說家史坦尼斯勞萊姆（Stanislaw\
  \ Lem）同名小說\n改編的新作《異境之音》（His Master’s Voice）入選了上屆東京影展的正式競賽，\n也將在本屆金馬奇幻影展放映。這確實是個吃力不討好的工程，電影敘述一個千里尋父的\n\
  故事，男主角和腦性麻痺的弟弟在父親缺席的情況下成長，\n然而透過媒體、網路等現代科技，他們發現父親其實在美國過得好好的，\n甚至早已另組家庭。然而男主角發覺父親的祕密不僅是拋家棄子，\n\
  還牽扯到美國太空競爭的野心和一場不可告人的意外。\n男主角在美國公路上撞見百呎巨人仿如怪異的西部神話，\n百女交纏的猗狔場面則小小驚世駭俗了一下。諷刺的是對父親的新家庭與下一代而言，\n\
  他口中的匈牙利「鐵幕」成長經驗，更像是科幻片情節。\n\n說到太空競爭，美蘇之間在冷戰時期的互別苗頭，早已被拍成不少電影，自我吹捧。\n現在則橫空殺出一部挖苦舊蘇聯的黑色喜劇《我的太空不是夢》\n\
  （Lajko－Gypsy in Space）以充滿想像力的方式重構了這段歷史。\n它強調在蘇聯太空人加加林、甚至太空狗狗萊卡成功出任務之前，\n蘇聯就先找了幾個符合條件的外國俘虜或罪犯當試驗品。\n\
  而本片男主角、一個自小抱有飛行夢的吉普賽人，也成了其中之一。\n理解強國競爭心理與無所不用其極，大可覺得這注定是場悲劇。\n\n但新銳導演巴拉茲連耶爾（Balazs\
  \ Lengyel）卻把男主角塑造成一個全心投注在夢想裡的\n狂人：玩個火箭筒，把媽媽射上了天；挑戰熱氣球，卻被當成間諜。他的專注與少根筋，\n對應了政治的複雜算計，也多了股悲天憫人，讓人聯想到《爸爸出差時》\n\
  （When Father Was Away on Business, 1985）、《地下社會》（Underground, 1995）的\n庫斯杜力卡（Emir\
  \ Kusturica）。這部在義大利 Trieste 科幻影展獲得觀眾票選獎的影片\n將在金馬奇幻影展做它的亞洲首映。\n\n另一個值得介紹的新導演是嘉博雷茲（Gabor\
  \ Reisz），\n他在第二部作品《爛情詩》自編自導自演，\n詮釋一個在花都巴黎被女友拋棄而重返匈牙利的導演，在舔舐情傷與展開新生之際，\n不禁回顧起自己不同階段的志向與困惑。是不是人生自況？我不清楚。\n\
  但在這種極易陷溺自戀的題材裡，他卻藉由真幻交錯的流暢敘事，把成長必然的詰問，\n化為生動的影像。如果魯蛇人生可以啟動浪漫因子，爛情詩自然也能變成好電影。\n當中的慧黠幽默和現代感性，應該能讓不少文青影迷如獲至寶。\n\
  \n《自殺Ｘ檔案》（X - The eXploited）的主創就不是那麼陌生了。\n事實上，導演卡歐利烏梅薩羅（Karoly Ujj Meszaros）和女主角莫妮卡貝瑟\n\
  （Monika Balsai）艷驚影壇的《狐仙麗莎煞煞煞》（Liza the Fox-Fairy）\n正是四年前被金馬奇幻影展引進台灣的。\n\n望穿秋水，他們合作的第二部電影終於面世，卻一反前作的日式影響與夢幻斑斕，\n\
  而更像挑戰美式懸疑、步步驚魂，但成果依舊不落俗套。\n演技卓越的莫妮卡貝瑟這次不再做白日夢、而是被記憶糾纏的刑事探員，\n往事讓她無法靠近刑案現場一步，但她卻有從檔案的蛛絲馬跡破解真相的能力。\n\
  她試圖解開一連串自殺案背後的疑點，卻在警局孤掌難鳴，好不容易得到一個新任警探的\n支持，但她能否克服心結，進入現場在第一時間找出答案，又逼使她回顧不堪往事。\n\
  加上單親母親的身分，這個女探員的角色簡直讓好萊塢也望塵莫及。\n\n你會發現這些匈牙利電影一面昭示他們對類型電影的掌握得法，\n一面不吝往自己的國家身世裡挖掘。金馬奇幻影展邁入第十年，\n\
  在傳統的商業與藝術之爭間，提供了更活潑多元、刺激心靈的可能。\n\n--\n\n原文結束。\n\n--\n   \n   ◥\n  \n \n  \n￣￣￣￣\n\
  \n--"
