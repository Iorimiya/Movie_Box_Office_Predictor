url: https://www.ptt.cc/bbs/movie/M.1675493429.A.0FA.html
title: '[普雷] 沒人看韓片幻影?'
content: '昨天週五下午去台中日日新看幻影

  全場不到十人

  看來大家最近多去看灌高或其他電影吧

  看本版也沒人討論此片,只好自己發一篇


  幻影改編自小說"風聲"

  2009年中國也拍過同名電影

  沒看過風聲,看網評寫風聲較多懸疑戲份

  而幻影則是較多動作成分


  電影背景在被日本統治近十年下的朝鮮

  劇情大意是幻影是反抗分子團體

  對手當然是日本政府=警察

  五人被抓且需找出誰是幻影,不然會被殺


  以下是雷...






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  本片一開始即完整交代時空背景及環境

  新任京城督導會到此地就任

  幻影的任務是殺掉督導

  先演出幻影的成員及彼此聯繫方式

  第一殺手只讓督導受傷並在逃脫過程中被殺

  其他成員則得繼續任務


  五人包括被降職的警大隊長,行政收發專員,解碼專家

  督導秘書(=性愛侍奉者)跟某小職員,以上都在日本政府工作

  日方主導找出幻影的是特務處長,也是原警大隊長的前部下


  小職員跟解碼專家沒多久就掛了,剩下三人


  行政收發專員一開始就是幻影,也跟初代殺手熟識


  督導秘書一開始藏的很深,中期大爆發直接跟警察對幹


  警大隊長被降職原因為母親是朝鮮人,也是幻影

  中間應該是一直考慮要不要轉換立場

  後來曾對副隊長=原部下說"你們自己處裡,不要牽扯到我"

  面對特務處長的步步相逼,只好殺了他並取代對付幻影


  專員跟秘書後來合作,秘書被抓及嚴刑逼供受傷但被專員救出

  兩人對付警大隊長並幹掉他,結局順利完成任務幹掉督導...


  心得是劇情不枯燥,有感人處,沒啥不合理或交待不清處

  演員演技也不錯,動作戲分好看


  最後歡迎看過風聲的人來發聲分享

  (查維基百科中的風聲電影介紹,劇情跟幻影差很大...)

  謝謝嘍!


  --'
