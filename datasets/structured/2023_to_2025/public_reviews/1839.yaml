title: '[情報] 金馬奇幻影展部分片將於金馬影展播映'
content: '今年的奇幻影展因疫情爆發所以停辦


  但金馬官方也為了奇幻影展的影迷 把部分片移師到金馬影展播映啦



  奇幻影展單元片單如下


  ▎《驚魂記》Psycho　▎

  　

  今年適逢英國驚悚大師希區考克的《驚魂記》（1960）問世60週年，這部影史經典鉅作以

  精妙的視覺構圖、剪輯技巧及聲音鋪陳皆被視為當世驚悚、虐殺類型美學之濫觴，穩居美

  國電影學會百大驚悚電影榜首。美艷女星珍妮李飾演的女秘書將客戶鉅款捲款逃跑，路途

  中停留一間老舊旅社，意外揭開看似害羞的老闆與他聞聲不見影的暴躁母親，兩人背後的

  驚人秘密。《驚魂記》上映後不僅影響無數電影工作者，其中膾炙人口的浴室殺人戲也吸

  引許多電影橋段向其致敬。



  ▎《深夜止步》Deep Red　▎

  　

  深受希區考克啟迪的義大利恐怖大師達里奧阿基多，經典代表作《深夜止步》（1975）將

  義大利邪典電影推向另一巔峰。故事講述《春光乍現》男主角大衛海明斯飾演的鋼琴師目

  擊鄰居靈媒慘遭殺害，自己也成為兇手的目標。阿基多不僅把《驚魂記》的母子情結、同

  志原型、甚至驚心動魄的殺人場面，發揚光大；也沒放棄招牌的鮮濃色調、黑皮手套、邪

  氣娃娃、戀物的特寫鏡頭。前衛搖滾樂團Goblin所作的配樂，也影響了《月光光心慌慌》

  、《奪魂鋸》。

  　


  ▎《蠻牛》Raging Bull　▎

  　

  美國名導馬丁史柯西斯把對《驚魂記》的致敬，精彩融入其代表作《蠻牛》（1980）。影

  片改編自前世界拳王拉莫塔自傳，呈現他在拳壇發跡、成名到墮落的曲折人生。其中一場

  蔚為經典的拳賽擂台戲，馬丁史柯西斯參照《驚魂記》浴室殺人戲的鏡頭順序來分鏡拍攝

  ，不僅毫無違和，反更顯張力。本片除了贏得當年奧斯卡最佳剪輯，勞勃狄尼洛為詮釋角

  色，不僅苦練結實體魄和精湛拳技，片末更為戲增胖27公斤，最終成功榮膺奧斯卡影帝。



  ▎《剃刀邊緣》Dressed to Kill　▎

  　

  希區考克影響電影後輩無數，《魔女嘉莉》的美國名導布萊恩狄帕瑪堪稱是最忠誠的追隨

  者，他引用了《驚魂記》的招牌鏡頭和結構手法，以同級精準的場面調度和俐落剪輯執導

  出《剃刀邊緣》（1980）。影片描述慾求不滿的家庭主婦在電梯中遇害，目擊一切的應召

  女郎向警方報案，卻被視為嫌犯，她只好與主婦的兒子一起追緝兇嫌。然而布萊恩狄帕瑪

  對性與暴力的直陳不諱，也帶來不小的爭議。



  ▎《驚魂記中計》78/52　▎

  　

  去年帶著《迴異：異形誕生》、《超信仰分析：大法師》兩部作品首次訪台參加金馬影展

  的紀錄片導演亞利山德奧菲利浦，另一部力作《驚魂記中計》便是瞄準希區考克徹底影響

  電影史發展的《驚魂記》著名淋浴場景。影片請來奧斯卡名導吉勒摩戴托羅、《恐怖旅社

  》導演艾利羅斯等許多好萊塢當今一線技術專才和資深影評重看《驚魂記》，從預告、劇

  本、分鏡、聲音、道具，乃至歷史與社會背景等不同角度切入，將這段傳奇劇碼逐鏡還原

  。



  ▎《緝毒風暴》Just 6.5　▎

  　

  伊朗新銳導演薩伊德盧斯塔伊創下伊朗影史票房新紀錄的《緝毒風暴》，找來《分居風暴

  》伊朗影帝佩曼莫阿迪飾演緝毒的硬漢刑警，好不容易循線揪出藥頭，自己卻與組員的信

  任崩盤，看似凶狠狡詐的毒梟還引發民眾同情。影片不僅逼視伊朗社會的貧窮惡性循環，

  以及失能的司法體制，還將阿斯哈法哈蒂式的道德辯證，融入警匪電影的賁張節奏，文武

  戲皆十分精彩。不只佩曼莫阿迪展現影帝級的出色演出，扮演毒梟的莫哈瑪查德充滿張力

  的演出更勇奪東京影帝大獎。



  ▎《消失的死刑犯》The Warden　▎


  才在《緝毒風暴》中飾演毒梟的伊朗男星莫哈瑪查德，這回在《消失的死刑犯》中詮釋即

  將升官的鐵面典獄長，意外獲知一名死囚仍藏身在即將改建的監獄中，面臨丟官危機的他

  立即展開獵捕行動，卻也被美麗女社工告知死囚其實蒙冤，讓他陷入逮捕與否的道德難題

  。伊朗導演尼瑪賈維蒂透過幽閉的空間、聳立的絞刑台，宛如卡夫卡式的人性迷宮與權力

  桎梏，構築出一齣令人惴慄不安，卻又滿溢幽默諷刺的威權寓言，到底誰才是真正的囚徒

  ？



  ▎《怪奇理髮院》A Hairy Tale 　▎

  　

  伊朗導演霍馬揚賈尼沙登的《怪奇理髮院》，則將鏡頭移置一間毫不起眼的理髮院，三位

  理髮師卻各懷手藝，而當街頭陸續出現缺髮女屍時，性格古怪的他們立刻被視為重要嫌疑

  犯。片中理髮院的場景如旋轉舞台般變幻延伸出各種想像空間，不僅融合《黑店狂想曲》

  黑色幽默節奏、《香水》偏執連環謀殺、《巴西》真實幻境交錯，並向《北非諜影》、《

  鬼店》等影史經典致意。



  ▎《愛在陰陽兩極擺》Dancing Mary　▎

  　

  《愛在陰陽兩極擺》是日本鬼才導演Sabu的最新奇幻力作，邀來日本天團「放浪兄弟」舞

  者NAOTO首度擔綱主演，飾演一名被迫解決鬧鬼都更案的政府職員，好不容易找來通靈少

  女超度冤魂，卻又跑出黑道勢力來攪和，讓他只好請出黑道亡魂「千人斬」來幫忙，一場

  鬼界與黑幫的大鬥法就此展開。影片利用黑白與彩色交錯的唯美攝影，區隔陰陽兩界之餘

  ，也洞悉人心善惡。



  ▎《暗黑聖女》Saint Maud　▎

  　

  英國影壇備受矚目的新銳女導演蘿絲葛雷斯，首部編導長片《暗黑聖女》描述信仰虔誠的

  私人看護，前來照顧病入膏肓的舞蹈家，因死亡相遇的兩人，一個打算把握最後生命縱情

  菸酒性愛，另一個卻祈求上帝賦予她拯救垂死靈魂的力量，讓這趟救贖之路令人怵目驚心

  。宛如《魔女嘉莉》遇上《大法師》，蘿絲葛雷斯大膽質疑宗教與道德的底線，無畏保守

  觀眾的憤怒，將質疑化為影像，不僅獲得倫敦影展評審團熱烈好評，更被韓國名導奉俊昊

  列為未來20年最值得注目的導演之一。



  --'
