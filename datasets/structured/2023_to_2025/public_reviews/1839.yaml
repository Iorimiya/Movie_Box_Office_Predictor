url: https://www.ptt.cc/bbs/movie/M.1429005675.A.52F.html
title: '[討論] 2015金馬奇幻影展：魏斯安德森的三部電影'
content: '2015 金馬奇幻影展：魏斯安德森的三部電影


  《歡迎光臨布達佩斯大飯店》仍記憶猶新？如果你喜歡這部電影，說不定也會喜歡它的導

  演魏斯安德森（Wes Anderson）其他的作品。

  2015 金馬奇幻影展焦點導演單元今年選列魏斯安德森，他的六部電影都會於影展期間播

  映，我特別推薦其中三部分別是：《天才一族》《海海人生》《超級狐狸先生》。


  《天才一族》（The Royal Tenenbaums, 2001）

  這部片子在講一個大家庭，借用看倌們的想像力讓我打個比方來形容它的看點：假設岳飛

  和白雪公主結婚成家，有三個孩子分別是令狐沖、孫悟空和海綿寶寶，還有一位養女是張

  愛玲，他們各自有鮮明的人格特質，用「父母兄弟姊妹」把他們連結起來放在一個大家庭

  裡面，透過生活事件讓他們產生有趣的互動關係，像是令狐沖請張愛玲去倒垃圾，她可能

  會回答我沒有空是因為我不想有空，你大概知道我的借喻對吧？並非直接對應本片的情節

  ，而是它的精神相似，也因為眾多人物性格鮮明向來是魏斯安德森講故事的看家本領，那

  麼多知名演員願意擠進他的電影，就像擠在那張海報裡一樣，細節讓他們各自擁有一塊發

  揮的天地，故事也就豐富了起來。


  《海海人生》（The Life Aquatic with Steve Zissou, 2004）

  這部片子是一個特別的冒險故事，除了我先前所說安德森導演講故事人物性格鮮明的特色

  之外，本片巧妙揉合了一些經典故事的精神，容我再打個比方：如果有一票人要去找一本

  經書，大家必須團結合作，彼此若說謊耳朵會變大，冒險旅途充滿困難，但是持續努力奮

  鬥一定會達成任務，你會不會覺得這個故事的精神，有那麼一點點西遊記、一點點小木偶

  、一點點美國夢的味道揉合在一起呢？本片神奇的故事魔力，就算不知道《大亨小傳》、

  《安培遜大族》或是《白鯨記》，安德森導演已經取其精神揉合再創作，也就是你所欣賞

  的《海海人生》，對我而言這個困難程度超越改編，也不輸原創。


  《超級狐狸先生》（Fantastic Mr. Fox, 2009）

  這是一部動畫，故事沒有傳達太多複雜的精神意念，繼續保持人物鮮明的特色之外，

  George Clooney 和Meryl Streep 高識別的聲音魅力，使得故事生動有趣，形式和技法上

  也給我強烈的印象，它是定格的動畫，可以想像成觀賞話劇或是舞台劇，沒有太多眼花撩

  亂的鏡頭運動，而是動畫人物的追趕跑跳碰。故事情節在兒童心中恐怕只有滑稽，但是在

  大人眼裡便可感受到它的幽默與歡樂。


  魏斯安德森的電影作品，上述主要提及故事文本，所下工夫火侯可見一斑，但是電影方式

  呈現，還得加上許多精巧細緻的場景、服裝、燈光、鏡位…等等構思設計，因此他的作品

  都是好幾年才一部，也就不奇怪了。如過錯過了影展，這些佳作都有發行出租或是串流，

  推薦給喜愛 Wes Anderson 風格的朋友。


  圖文網頁版


  --



  --'
