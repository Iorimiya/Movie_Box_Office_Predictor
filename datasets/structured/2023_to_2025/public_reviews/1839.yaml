url: https://www.ptt.cc/bbs/movie/M.1491666147.A.8CE.html
title: '[好雷] 金馬奇幻影展開幕片-自畫像 生猛有料!! '
content: '金馬奇幻影展開幕片【自畫像】


  看到有版友po文,那我也速寫一下我的心得好了,我來奇幻影展就是要看這種嗆辣有料的電


  影阿，不要給我什麼喜劇、愛情、小清新，我就是要看這種晚上會想很多、讓你睡不著覺


  的電影。尚未觀賞之前以為是一部政治、社會寫實片，但其實導演用一種抽離的方式，將


  政治與社會融於背景，很聰明的方法，不然稍不注意，電影本身便會變得矯情、說教，讓


  觀眾自行去摸索其中寓意（超多隱喻）、選擇解讀的視角。



  聞天祥老師說當初選片人觀賞這部作品時就哭了，而他去鹿特丹看片也深有感觸。《自畫


  像》如同昨日許多出席演員說的，並不是一部完美的作品，卻是台灣近年少見，實實在在


  去寫政治、社會的電影，表現手法獨特、顏色運用深具巧思（原本想說這是《相愛的七種


  設計》的導演嗎？風格也差太多了吧，但想想《消失打看》，好吧！色彩運用也比《相愛


  的七種設計》更上一層樓），台灣從來沒有見過這種用犯罪、情色、性別去，原本是打算叫《恐怖的並不是愛情》，但公司說不是恐怖片所以不能有恐怖二字


  ，導演認為改成《自畫像》更為恐怖，因為我們要看見的是真實、赤裸裸、醜陋的自己。


  （以下有劇情雷）



  前段女主角有許多說教、理想的表現，原本我以為這部片就這樣，教條式的表演，但後來


  完全翻轉，原來是為後面希望的毀滅做鋪排。女主角被自己父親性侵，同時又遭受到政治


  上的傾慕者（理想）給潛規則了，還說是教她社會、生存的規則；後來也被藝術上的傾慕


  者（理想）強暴，政治跟藝術象徵著肉與靈，兩者都幻滅（被強暴）的結果換來最後她的


  自殺，（導演說女主角是台灣，所以台灣在政治上跟藝術上，肉與靈都．．．．．．最後


  壓力過大用一個自殺的方式尋找出口）



  後段Kiwebaby也是隱喻台灣，徘迴於該當男生還是女生，最後看清男女情愛，覺得都是虛


  假的，「維持現狀」就很好了，現在的她很快樂。後面房間的劇情我很喜歡，隨著女主角


  與Kiwebaby移動，變換之間（超限制級），讓人一時摸不清什麼是真什麼是假。最後河堤


  上也是一種因果的暗示。



  導演說還是有留一點希望（給台灣），也就是最後一幕盲眼小男孩的摸索，穿透了七宗罪


  。


  九月再上映如果有空有錢還會再去支持，很喜歡！！


  --'
