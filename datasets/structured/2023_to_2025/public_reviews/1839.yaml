title: '[新聞] 金馬奇幻影展開賣 《洛基恐怖秀》連7年'
content: '新聞網址：


  2010年創立以來，金馬奇幻影展始終帶給影迷許多另類的電影片單，以「奇幻」為題的主

  題影展有別於台灣其他影展，創辦7年來走出自己的路，培養出許多死忠影迷，而今年度

  的奇幻影展將在4月8日展開，今日下午1點於官網正式售票，連續7年獻映的《洛基恐怖秀

  》2場再次秒殺，其他還有如開幕片《暗色天堂》、特別放映《枝繁葉茂》、經典重現《

  魔王迷宮》、《男人的一半還是男人》都已售罄。


  金馬奇幻影展內容涵蓋科幻、恐怖、驚悚、歌舞、喜劇、武俠、動畫、愛情以及各類

  cult film，策展單位精心挑選多部精采電影獻給影迷，而影展也曾經策劃多位影壇大師

  專題，例如伍迪艾倫、魏斯安德森、 伊格萊希亞、大衛林區等人，而今年則是帶來西班

  牙導演班偉特利（Ben Wheatley）的多部經典作品，包含《不良之家》、《英倫夢田》、

  《無限殺人意料之外》，影迷叫好的《觀光客出沒，注意！》、以及新作，由「邪神洛基

  」湯姆希德斯頓主演的科幻新片《摩天樓》。


  開幕片為歌神張學友與金馬影后林嘉欣主演的《暗色天堂》。（圖／取材自金馬奇幻影展

  官網）

  連續7年在奇幻影展登場的《洛基恐怖秀》則再次於開賣迅速秒殺，讓許多沒搶到影迷相

  當扼腕，這部根本不恐怖的經典之作，結合歌舞與奇異的元素，邀請影迷變裝進場，一同

  享受這瘋狂的午夜時光，而去年叫好叫座的《瘋狂麥斯》原版的《瘋狂麥斯三部曲》則挾

  帶氣勢迅速搶光，其他同樣售罄的電影包含《暗色天堂》、《摩天樓》、《吻兩下打兩槍

  》、《死期大公開》、《巴黎走音天后》、《尼羅河女兒》等近50場完售，除了網路購買

  ，在影展舉行期間也可以至現場購票。金馬奇幻影展將於4月8日起至4月17日上映。

  ==========================================

  這次購票網站還當機

  真的超難買的.......


  --'
