url: https://www.ptt.cc/bbs/movie/M.1553615901.A.845.html
title: '[新聞] 金馬奇幻影展神祕片 熱門作品攜續集強勢'
content: '金馬奇幻影展神祕片 熱門作品攜續集強勢回歸



  （中央社記者洪健倫台北26日電）金馬奇幻影展今天公布今年3部「神秘影片」，包括「

  性愛自修室」阿薩巴特菲爾德主演的新片「屠宰場守則」、去年的搶手奇幻cult片「人生

  超友事」，及其續集「人生狠友事」。


  「屠宰場守則」導演克里斯平邁爾斯（Crispian Mills）原是知名樂團庫拉雪客（Kula

  Shaker）的主唱，首部導演作品「作家想太多」也曾在2013年金馬奇幻影展獲得熱烈好評

  。


  新片「屠宰場守則（Slaughterhouse Rulez）」除邀來主演「血腥冰淇淋三部曲」的英國

  喜劇黃金拍檔賽門佩格（Simon Pegg）與尼克佛洛斯特（Nick Frost）擔任監製與演出，

  還找來近期以「性愛自修室」走紅的阿薩巴特菲爾德（Asa Butterfield）飾演誤闖校園

  禁地的魯蛇轉學生，和陰鬱室友及女神學姊踏上抵抗巨怪的冒險，最後一起逃脫險境。


  去年金馬奇幻放映好萊塢奇人湯米維索（Tommy Wiseau）作品，其中，湯米維索和「大災

  難家」原著作者葛瑞格賽斯特羅（Greg Sestero）在合作了邪典電影（Cult片）經典「房

  間」（The Room）之後，兩人相隔10餘年再度搭檔演出的「人生超友事」，引起台灣Cult

  片迷熱烈討論。


  金馬奇幻影展今年將再次放映「人生超友事」（Best F(r)iends Volume 1），其續集「

  人生狠友事」（Best F(r)iends Volume 2）也將登上奇幻大銀幕。葛瑞格賽斯特羅這集

  將帶著湯米維索藏錢的ATM機器，踏上一段「開鎖」之旅，湯米維索招牌的詭異演技在驚

  悚懸疑的氛圍下更顯另類歡樂，荒謬地令人發噱。


  2019金馬奇幻影展將於4月12日展開，並於本週六3月30日下午舉行選片指南講座，週日下

  午1點開放線上購票。


  （編輯：翁翠萍）1080326



