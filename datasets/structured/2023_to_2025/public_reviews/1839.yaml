title: '[無負雷] 超狂亨利  Hardcore Henry 奇幻影展'
content: '無雷的部分


  先講結論，劇情稍嫌薄弱，害怕皮開肉綻者、容易暈車暈船者自己斟酌觀看。


  此片配上日新威秀大螢幕暈眩靈氣效果至少加20%。


  拍攝手法就如預告片所呈現的，也是該片最大最大最大的賣點!!


  看在拍攝手法這麼有誠意的份上(好像砸爛了不少GOPRO)所以劇情就不要太挑剔了


  片長約90分鐘，我大概有87分鐘心裡的OS都是



  幹，這到底怎麼拍的阿!!!  到底是怎麼用的剛那到底是綠幕還是替身


  喔幹好暈，我快不行了。



  以下開始微負雷含劇透










  如果想瞭解中國共產黨如何活摘器官過程者必看!!


  各種血淋淋插喉割眼近距離博鬥，手榴彈炸不用錢，子彈不用錢射到飽


  第一人稱手法暈眩加上血液亂噴、臟器外露，下雨的晚上，旁邊的人把鞋子拖掉晾鹹魚。


  以上種種造成我第一次在電影院有乾嘔狀況。


  好吧，來聊聊劇情的部分。


  既然正妹老婆是阿肯方的，那為什麼敢博命演出從逃生艙太晚拉傘差點害死自己這種橋段


  好阿，你可能會說『幹你一定沒看過門徒，九樓？條子怎麼可能敢跳』要演就要演全套阿


  ok，想把亨利影像當成範例來造出人造人軍隊的初始記憶。最後只聽你正妹老婆的話


  但記憶中，你阿肯還是大魔王阿!!還是大壞蛋阿!!


  (還是其實我沒看懂如果阿肯成功了要怎麼利用這隻軍隊)


  其實電影裡面有幾段的跑酷好像沒那麼重要，只會加強這部片我超暈，暈到崩潰的印象


  說說優點的部分


  在癱瘓博士SHOW分身那一段拍攝手法的畫面真的很厲害，一度懷疑是雙胞胎替身XDD


  打打殺殺有些割喉挖眼挖臟器的畫面也是蠻厲害到位的。爆頭還是爆上半身就更不用說了


  以上淺見，請多指教謝謝。


  --'
