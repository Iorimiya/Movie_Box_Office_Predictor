url: https://www.ptt.cc/bbs/movie/M.1431944256.A.0A4.html
title: '[好雷] 奇幻影展/寶萊塢之武林大盜'
content: "圖文影音網誌版\n\n\n\nHappy New Year  - Shah Rukh Khan、Deepika Padukone、Abhishek\
  \ Bachchan、\n                  Sonu Sood、Boman Irani、Vivaan Shah -\n           \
  \                       2014/10/24印度、2015年4月臺灣金馬奇幻影展上映\n\n查理的父親曾是印度首屈一指的保險箱設計製造商，卻遭奸人陷害入獄，\n\
  他蟄伏8年終於等到為父報仇的機會，找回身懷絕技卻被迫躲藏的兩位昔日夥伴，\n再拐來為金錢所惑的小屁孩、酒鬼跟夜店舞孃，組成詭異的六人團隊，\n以參加World\
  \ Dance Championship(WDC，世界舞蹈錦標賽)為幌子，\n不擇手段以各式賤招晉級了決賽，\n一切只為了進入WDC的決賽地點 - 位於杜拜的亞特蘭提斯飯店，\n\
  潛入奸人設在飯店地底下的高科技保險庫，竊取天價鑽石，以其人之道還治其人之身，\n但人算不如天算，這場復仇計劃是否真能如查理所想的完美成功呢.....\n\n英文字幕預告\n\
  \n\n\n\n當年一起創造出寶萊塢經典電影Om Shanti Om（如果愛在寶萊塢，2008）的沙哥、\nDeepika、導演Farah Khan，終於再度合作賀歲片\n\
  (雖然之前的Chennai Express三人也有一起合作，但那片Farah Khan只是編舞不是導演)，\n於2014年10月的Diwali(排燈節)上映，上檔前沙哥不辭辛苦帶主要演全到處跑宣傳，\n\
  上映後雖然票房不是破紀錄的威，但排到寶萊塢10億盧比排行榜第7名也是非常厲害了。\n\n去年到印度自助旅遊的時候，剛好是本片的上映檔期，基於對沙哥的熱愛，\n\
  我強力說服(?)了友人A、B陪我去齋浦爾的知名戲院 Raj Mandir Cinema看這片，\n想說賀歲片嘛，就是看沙哥跟感受印度電影院的歡樂氣氛，沒字幕應該沒關係。\n\
  \n雖然當天沒字幕劇情一知半解，但沙哥真的是有.夠.帥，帥得我暈頭轉向找不到北，\n反正大家拍手跟著拍手笑就跟著笑，印度觀眾都會很熱情的尖叫拍手吹口哨，\n超有臨場感，而且隨時有人用閃光燈拍螢幕真的很妙，\n\
  也沒人阻擋XD(可能阻擋也沒用？) 在印度戲院看電影真的是很奇妙的體驗，哈哈\n\n不過人清醒過來恢復神智以後，再回想一下劇情跟人物，覺得...\n沙哥的角色個性好像有點差，老是在女生背後偷講壞話，然後還每次都被發現=.,=\n\
  Deepika依舊很漂亮但對沙哥的痴迷有點over讓我不太適應，\n也許是因為我這些年來已經被許多寶萊塢電影養大了胃口，\n又也許是我對Om Shanti Om的感情真的很深，\n\
  總忍不住會把這片跟Om Shanti Om比較而感覺有落差，\n因此對這片的評價就是除了沙哥很帥之外都普普，\n劇情也普，角色塑造也普，歌舞編排也普。\n\n\
  But!!女人心，海底針，因為我是個女人，所以翻臉跟翻書一樣，也是很合理的，\n就在我被雀雀的影評啟發，重頭認真看一次Happy new year之後，\n我-頓-悟-了，\n\
  什麼邏輯、合理通通都是浮雲，一切都是假的，\n只有沙哥(的巴底)是真的！！\n在排燈節這種全家團圓的節日，大家一起去電影院裡面，嗨翻天一起開心拍手大笑，\n女生看沙哥，男生看Deepika，爸爸媽媽們看親情，哥兒們看友情，\n\
  然後全部人再一起看著片末的祖國國旗留下感動的淚水，\n其實Happy new year確實有努力充分滿足各族群的需求，倒也是部成功的賀歲片，\n這麼一想，我的評價也就從\"\
  普\"升等到\"不錯\"。\n等到奇幻影展進了戲院，再次感受大螢幕上帥到一個逼死人程度的沙哥之後(暈眩)，\n我的評價又莫名其妙從\"不錯\"升到了\"推薦\"\
  ，\n只能說沙哥真的是特殊加分事項，一個人就可以加分50%這樣呵呵\n當然在戲院裡跟臺灣自己人一起嗨的歡樂的氣氛也是加分事項之一啦XD\n\n\n\n\n沙哥你幹嘛舔Boman叔叔的臉頰好噁心阿....\n\
  Boman在沙哥背後緩緩被轉走好好笑...\n阿比的浴巾掉下來啦哈哈哈\n原來頂樓打鬥的背景是藍幕阿..我竟然看三次都沒看出來..印度的CG技術也到了這個境界了(驚)\n\
  阿比你幹嘛抓著打板小弟不讓人家走啦五告謀聊XDD\n抓著枕頭在走廊上追著人跑的是誰阿，畫質不好看不太出來XD\n\n\n\n\n* 沙哥的招牌POSE，一整個浮誇帥這樣XD\n\
  \  在片中插曲Manwa Laage跟後面他們扭轉大家印象之後，\n  都有人在模仿這姿勢XD  最後本人以這POSE出場帥翻天\n  \n\n*開頭Jag上衣扣子沒扣被導演嘲笑說你以為你是Dard\
  \ E Disco風格嗎\n 用的是Om Shanti Om這首歌的梗\n \n\n*查理說他是看Ram Leela發現Nandu的，說的是Deepika跟Ranveer主演，\n\
  \ 改編自莎士比亞名著\"羅密歐與茱麗葉\"的電影Goliyon Ki Raasleela: Ram-Leela\n (寶萊塢殉情記，2014)，不過他並沒有真的在裡面演猴神哈努曼XD\n\
  \ \n\n*晚宴上當Mohini盛裝出席時，背景音樂是Om Shanti Om的插曲Ajab si，\n 絲巾梗也是出自這首歌\n \n\n*一群人在海豚池裡幻想沙盤推演，推到Tami準備打開保險庫的時候，\n\
  \ 沙哥在後面作了拉小提琴的動作，\n 這是在學沙哥在電影Mohabbatein(情字路上，2000)的經典場景 -\n 鋸.小.提.琴.(我真的覺得是鋸不是拉XD)\n\
  \ \n\n*準決賽時沙哥他們穿的紅夾克跟舞步，有點是在向泰盧固電影Donga的插曲Golimar致敬，\n 這樣講大家可能很陌生，但如果說\"印度麥可\"應該就有點印象了XD\n\
  \n*準決賽前，Mohini在休息室的精神喊話，是模仿Chak de India（加油印度）中，\n 沙哥飾演的教練在冠軍賽前對球員的激勵喊話\n \n\n\n\
  \n＊Anupam Kher - 知名老牌演員，客串沙哥的爸爸，出道多年在寶萊塢電影裡演過的爸爸\n                應該沒有上千也有五百個吧...\n\
  \n＊Malaika Arora - 阿猛(Salman Khan)的弟媳，客串開頭Jag工作片場的女主角，\n                  曾經客串沙哥的電影Dil\
  \ Se，一起在火車頂上跳舞\n                  \n\n＊Sajid Khan - 本片導演Farah Khan的弟弟，客串開頭嘲笑Jag的導演，\n\
  \               長得就像男版Farah Khan..XD\n\n＊Prabhu Deva  - 演員、編舞及導演，客串中間穿白吊嘎來教沙哥他們跳舞，\n\
  \                 導致沙哥他們扭曲成一團的老師，\n                 中間有段很像半蹲開車的動作出自他幫Hrithik Roshan的電影Lakshya\n\
  \                 插曲Main Aisa Kyun Hoon編的招牌動作，\n                 然後Prabhu Deva主演的作品Any\
  \ Body Can Dance曾在桃園電影節放映\n                 過。\n\n＊Vishal Dadlani - 知名音樂製作人，客串WDC海選評審(光頭的那個)，本片的原聲帶也\n\
  \                   是他製作的，只要Farah Khan有找他作音樂通常就會叫他客串，然後\n                   他都放很開XD\n\
  \n＊Anurag Kashyap - 知名導演及編劇，客串WDC海選評審，曾經擔任威尼斯影展評審，\n                   作品向來很有氣質，看到一個理論上文質彬彬的導演放得如此之開\n\
  \                   ，我實在不知道該說什麼好XD\n\n＊Gauri Khan - 沙哥的太太，江湖人敬稱為沙嫂(哪來的江湖)，在最後片尾的時候出來跳\n\
  \               了點舞\n\n＊AbRam Khan - 沙哥的小兒子，生日是2013年5月27日，超萌超可愛der\n           \
  \    跟沙哥長得一模模一樣樣根本複製人(心)\n\n＊Czar 、Diva 、Anya - 導演Farah Khan的龍鳳三胞胎，就是最後把她關進保險庫的三個\n\
  \                       小朋友XD 都長得滿可愛的呢\n\n\n特別推薦WDC最後總決賽混音舞曲 World Dance Medley\n\
  沙哥以招牌POSE出場整個就是個帥炸阿阿阿阿阿阿\n\n\n--\n\n\n\n\n\n\n\n--\n                           \
  \  05/18 18:20"
