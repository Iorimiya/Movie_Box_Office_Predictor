title: '[片單] 主角背後有厲害的組織撐腰的片(幻影偵探雷)'
content: '1. 請描述欲尋找電影的類型或特徵（請盡量描述清楚）


  標題不夠長


  我想問的是有沒有兩大組織強碰  不過主角方的組織超厲害  不知不覺搞定一切


  我剛剛看完MOD上的幻影偵探(偵探洪吉童，韓片)


  雖然片中大部分都是看男偵探主角一人+兩蘿莉去辦案(尋仇)


  不過其實他一直有在拜託他所屬的事務所辦事


  到最後的最後才把他的計劃說出來  而且他的偵探社還帶一堆人來幫他撐腰


  尤其最後一堆穿西裝的人拿衝鋒槍掃射  那種感覺真的很爽


  我想找是真的有出來辦事的  而不是聽起來很厲害那樣


  就是那種有一群看起來很菁英很厲害的人出現收尾那樣


  有一堆人穿西裝出來掃射最好(我可能只是想看一群人穿西裝掃射)



  2. 已知符合需求的電影或偏好的電影類型（為避免重複推文，請至少列舉一部）


  幻影偵探


  捍衛任務1的飯店方就很像  他們有西裝人出現辦事  不過他們沒有掃射


  3. 不喜歡的電影類型            （不需要板友推薦的電影，可填刺陵）


  所屬於某個組織  但是組織沒戲分的電影


  不要主角「群」都很厲害的作品 組織不用做太多介紹，反正你穿著西裝進來掃射就對了，不用名字




  抱歉要求很奇怪   麻煩各位了!


  --




  麵包超天


  --

  黑衣組織太弱了啦

  先生還是任務?

  都看過了  嗨爪跟金仕曼不是都很弱嗎? 印象中都沒做什麼

  不是這個意思  不過我喜歡XD

  MIB不是整天被打爆嗎?

  急速之巔?'
