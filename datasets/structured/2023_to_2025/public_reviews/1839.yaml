url: https://www.ptt.cc/bbs/movie/M.1583823076.A.AC4.html
title: '[新聞] 2020金馬奇幻影展第三波片單'
content: '新聞網址：


  金馬得主徐漢強VR新作《星際大騙局 之 登月計畫》奇幻影展世界首映

  伊朗、日本、澳洲、紐西蘭、西班牙、義大利 猛片如雲



  2020金馬奇幻影展今日（3/10）陸續公布14部精彩強片，其中最受矚目的是影展也特別聚焦伊朗近期在類型電影的建樹，保證一新耳目

  。而年年必備的「東瀛狂想」單元將帶來日本名導Sabu、武正晴的新作，還有超人氣女星

  廣瀨鈴飆唱死亡金屬樂；「當代奇幻」單元則從偶戲、漫畫、經典文學取經，還有推理、

  暴力、浪漫各式歡樂處方，等你來領教。



  在世界影壇佔有一席之地的伊朗電影，早已突破寫實格局，在各個類型大放異彩。



  深受觀眾喜愛的「東瀛狂想」，今年也有名導、巨星加持。



  堪稱奇幻指標的「當代奇幻」單元，今年有不少精彩改編作品，包括多次獲得坎城評審團

