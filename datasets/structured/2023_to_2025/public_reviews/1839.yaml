title: '[影評] 奇幻影集【Hercules】–Xena 的前身'
content: "圖文版\n        \n\n        Hercules 就是我們說的「大力士」，不過先不要有錯誤的印象，不是\n        那種光靠蠻力打來打去的電影，基本上我非常非常討厭「肌肉戰士」這\n\
  \        種東西，玩格鬥遊戲我只打死不用力量型，完全不想看阿諾的一人無敵\n        電影（不過仍都看了），但是，我很喜歡【Hercules】這部影集。\n\
  \n        今天只聊它的前五部電影和第一季的影集，後面的我還沒有看完，共有\n        六季。\n\n        先介紹一下【Hercules】是怎樣的影集。\n\
  \        可以說它是把希臘神話拿來當背景用，很久很久以前，神都很殘忍不在\n        乎人命的時代，Hercules 是一個 Zeus（宙斯）和\
  \ Alcmene的小孩，半\n        人半神，在這個世界上四處幫助人類，對抗邪惡的神／怪物。\n\n        別急別急，我知道聽來很蠢…，可是【Hercules】並不是那種英雄伸張\n\
  \        正義無人可擋的電影，事實上，Hercules 這角色還蠻討喜的，沒有定\n        型的正義嘴臉，沒有高不可攀的距離，就是一個很普通的人，一個你會\n\
  \        很想和他成為朋友，個性蠻不錯的人（當然肌肉還是會有…力氣也還是\n        小不了）。我想這影集最讓我喜歡的一點，就是 Kevin Sorbo\
  \ 對\n        Hercules 的詮釋，且他演起來一舉一動都相當自然，一點也不僵硬，\n        越看越覺得他就是這個角色，習慣了他有點而冷的幽默之後，還看得挺\n\
  \        開心。Sorbo 給把 Hercules 唯我獨尊的領導氣質用一種親切的謙虛包\n        起來，平衡點取得很好，以一個沒什麼演戲經驗的人來說，相當出色。\n\
  \n        但也不要誤會了，它不是【24】，不是【CSI】，不是【Alias】，不是\n        【6 Feet Under】，不是那麼嚴肅那麼「成熟」的影集，故事還是免不\n\
  \        了會有覺得幼稚的（比如，獨眼巨人 Cyclops 占去村民的河流，因為\n        小時候他的怪異被村民排斥，但有個溫柔的女生願意接納他，後來他為\n\
  \        了保護村子而戰，而過去討厭他的人也決定給他再一個機會…夠老套吧\n        ？），把這部影集定位時不要定錯才是。\n\n       \
  \ 坦白說，這部影集可能是喜歡 B 級片（B-Movie）的人才會欣賞的。製\n        片就是 Sam Raimi，如果你喜歡他拍 A 級片「之前」的作品，有可能\n\
  \        會很喜歡【Hercules】，要選個例子的話，【Hercules】的感覺和\n        【Army of Darkness】這個 cult\
  \ 電影系列第三集比較像，Sorbo 就像\n        Campbell 一樣有種自嘲的幽默，只是沒 Campbell 那麼誇張明顯。\n       \
  \ 若聽不懂我在說什麼，翻成白話就是…特效很鳥。嗯，如果真的很在特\n        效很鳥的話也不會是 B 級片迷了吧？像 Centaur（半人半馬）出現時\n\
  \        ，畫面就是假… 巨人出現時，畫面還是假，Cerberus？假，Serpent？\n        假，Hydra？假。魔法？當然也是假。\n\
  \        （Campbell 在第二季第一集出現演出俠盜 Autolycus 喔！）\n\n        也許有人會想問我，故事幼稚特效又假，那你是愛它愛個什麼勁？\n\
  \        我恐怕也只能告訴各位，看到這種電影我通常也是馬上關電視的，但【\n        Hercules】就是有一種魅力，會吸引我一集接一集看下去。最初會看它\n\
  \        的理由，是 Kevin Sorbo，我超喜歡 Sorbo，喜歡他不看【Hercules】\n        就見鬼了，所以就開始看啦，最初多少有不耐煩，多看了一些之後，對\n\
  \        角色有了親切感，能放輕鬆去欣賞它後，馬上進入了欲罷不能階段。\n\n        第一季也會看到不少人客串，劉玉玲、Kevin Smith（演\
  \ God of War -\n        Ares 喔！）、還有大家可能比較熟悉的，Xena… Lucy Lawless。【\n        Xena】算是【Hercules】發展\
  \      出來的外傳，她在第一季的最後有\n        三集都有出現，在前面 Lawless 還有順便演出另一個角色，一個和\n        Centaur\
  \ 們混在一起的人類。我不哈【Xena】，但建議【Xena】迷可以\n        看看她是如何出現的，後來發展出自己的影集的。\n        第一季最後一集，Xena\
  \ 最後的一句話我非常喜歡。她要和 Hercules\n        離別時，Xena 說「Let me go. There is much I have to\
  \ make\n        amends for. I've got to get started.」Hercules 回說「I wish\n      \
  \  you'd let me help.」，她回答「You already have. You unchained\n        my heart.」這一集的名字就叫做\
  \ unchained heart。連我不是 Xena\n        迷都很欣賞這一季的結局了，Xena 迷還用說~~。\n\n        Anthony\
  \ Quinn… 我倒是真的不喜歡他演的 Zeus，怎麼說呢，這 Zeus\n        給人的感覺就是沒用的糟老頭… 雖然我們再也看不到 Quinn 了，能在\n\
  \        這影集中看到不少他的身影也是難得，但…就是希望他不要演這個角色\n        。\n        Michael Hurst 的角色一開始我也不是很喜歡（尤其是電影中），但影\n\
  \        集裡他越看越可愛，也進而變成一個不可少的寶，和 Sorbo 一搭一唱\n        還挺好玩的呢。（他演的角色是 Iolaus，Hercules\
  \ 的好友），還有一\n        個類似的人，演 Salmoneous 的 Robert Trebor，他實在是搞笑到極點\n        ，兩個主角是比較冷型的好笑，他是讓你笑到肚子痛的好笑，只要有他\n\
  \        出現，肯定會是愉快的一集。\n\n        大致上，角色是來自希臘神話，但也沒有全部忠於神話。Hercules 仍\n        是\
  \ Zeus 和 Alcmene 的兒子，是 Ares 的半個兄弟，繼母 Hera 很討\n        厭 Hercules… 這些都差不多，只是神話中 Hera\
  \ 把 Hercules 逼瘋讓\n        他殺了自己的妻子和三個兒子，片中倒不是這樣的（是怎樣？留給大家\n        自己看吧！第一季第一集就有了）。對片中的神話故事不能太過相信，\n\
  \        但小時候也就是這樣的電影會讓我們對神話產生興趣而去了解更多不是\n        嗎？我都老大不小了，看完【Hercules】還會想要好好研究希臘神話人\n\
  \        物間的關係呢。\n\n        還有一點，就是不能太在意場景啦，因為這世界看來真的很紐西蘭…（\n        全部都在紐西蘭拍攝）。看【魔戒】不會覺得中土世界很紐西蘭，但看\n\
  \        【Hercules】會。（還是很美就是了）\n\n        如果有興趣要看，應該先從電影下手，一共有五部，這五部看完才接影\n    \
  \    集，沒有絕對的連貫，只是照順序看總是比較好，且可以更清楚了解角\n        色的背景和成長。我雖然很愛【Hercules】，還是要承認一下它的缺點\n\
  \        ，在【The Maze of Minataur】中，幾乎都是偷懶用回憶的方式把舊片\n        段剪來用，用了真不少，如果像我是連著五部一起看，不耐煩是正常的\n\
  \        。這種偷懶在影集也有小小地發生，到市場的片段就重用了好幾次，如\n        果又是像我這樣整季一起K完，要不發現也很難。\n\n   \
  \     可是，我最近還是迷【Hercules】迷得一踏糊塗，所以還是來推薦對 B\n        級影集和神話型的奇幻有興趣的人，一定要看看【Hercules】，它就是\n\
  \        B 得好看。台灣有沒有撥過我不清楚，所以沒有提供中文名稱，它在美\n        國還頗有知名度所以一點也不難找就是了。\n       \
  \ 我是以 Sorbo 迷的身份來看這一個系列的，我所能給的忠告也只能給\n        所有的 Sorbo 迷，錯過【Hercules】的話你這輩子是白活了知道嗎？\n\
  \        非 Sorbo 迷，就請給【Hercules】多一點時間，也可以考慮從第一季\n        看起，喜歡再去補電影版，多看幾集再來評斷喜歡或是不喜歡，總之【\n\
  \        Hercules】不是一見鐘情型的影集，但它絕對有討人愛的一面要靠你去\n        挖掘。\n\n        P.S.我目前進度是看到第二季的一小部份，第二季又比第一季更好，除\n\
  \        了特效還是差一點之外，多了更多的人情味，談了不少 Centaur 爭取\n        「人權」和 Hercules 的家庭（有回他為了要解決\
  \ Hades 的事到「The\n        Other Side」去，重見家人卻又得要再次離別，那集超感人），賺了我\n        不少眼淚呢，故事有比第一季更有深度些。\n\
  \n\n        firewalker\n\n--\n【火行者的影評小站】 \n    電影的 心得/感想/評論 附設討論區 歡迎投稿任何電影相關文章\n\
