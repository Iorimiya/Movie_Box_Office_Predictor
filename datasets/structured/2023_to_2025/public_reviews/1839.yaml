title: '[情報] 2023 金馬奇幻影展 開幕片：《疫起》'
content: "2023金馬奇幻影展將於4月7日至16日熱鬧展開，今日（2/23）公布《我們與惡的距離》、\n《茶金》林君陽也感性表示\n：「我想以這部電影，遙祭大家共同的記憶，同時也為那個曾經，畫上一抹溫暖。我相信\n\
  ，疫情結束的這年，是我們新的開始。」\n\n作品橫跨電影、電視製作的名導林君陽，以和高炳權聯手執導的首部電影《愛的麵包魂》\n備受影壇注目，影集《我們與惡的距離》獲得金鐘獎最佳導演，《茶金》亦是好評如潮。\n\
  這回重返影壇執導《疫起》，\n\n《疫起》深刻揭開台灣20年前的抗疫傷痛，講述致命病毒在醫院爆發，病人與醫護人員相\n繼倒下，無預警封鎖的醫院宛如白色監獄，與死神只有一層口罩的距離，在這場沒有煙硝\n\
  的殊死戰場，醫護人員也陷入自保與救人的身心拉扯。影片邀來金鐘影帝薛仕凌、王柏傑\n、曾敬驊、項婕如等演技派與新生代演員同台飆戲，金馬影后謝盈萱加持演出，以精湛演\n\
  技道出人性試煉下的掙扎與恐懼，也留下溫柔的希望曙光。\n\n\n \n\n\n\n金馬奇幻影展每年吸引超過三萬五人次影迷朝聖，除了影片好看，更以熱鬧的活動和豐富\n\
  的禮品成為台灣最好玩、滿座率爆棚的影展。今年觀賞開幕片的觀眾，每位可獲得以「小\n人物大生活」理念聞名的台灣知名古早味手搖「龜記茗品Guiji」飲品一杯；閉幕片更將\n\
  送出一人一份「樂檸漢堡」特製餐點，也歡迎大家看完電影穿短褲至樂檸漢堡店家購買還\n享有專屬優惠。眾多品牌聯名活動即將陸續公開。\n\n2023年金馬奇幻影展將於4月7日至16日展開，選片指南將在3月24日於臺北文創大樓14樓\n\
  文創會所舉辦，並於3月26日正式開賣。更多精彩片單與周邊活動訊息將陸續公佈，請鎖\n定金馬官網、臉書粉絲專頁、Instagram，或下載金馬APP，掌握第一手消息。\n\
  \n--"
