title: '[情報] 真人版電影《岸邊露伴一動也不動 懺悔室'
content: "真人版電影《岸邊露伴一動也不動 懺悔室》釋出主視覺圖與正式預告影片\n\n\n\n以荒木飛呂彥的作品為基礎改編，真人版電影《岸邊露伴一動也不動\
  \ 懺悔室》今（11）\n日公開了主視覺圖以及正式預告影片。\n\n\n\n《岸邊露伴一動也不動》原作故事以擁有替身「天堂之門」的岸邊露伴作為主角，作為\n 16\
  \ 歲就出道的天才漫畫家，他的天堂之門可以將人變成一本書，讓他讀取別人的人生經\n驗或是想法，也可以利用寫入敘述改變對方的行為。\n\n　　「懺悔室」是《岸邊露伴一動也不動》系列的第一篇故事。故事中岸邊露伴為了漫畫\n\
  取材前往義大利，然而當他進入威尼斯某間教堂時，基於自身的興趣以及好奇心踏入了懺\n悔室，沒想到卻進到了本來應該是神父的位置？！隨著一名男子進入懺悔室開始懺悔，岸\n\
  邊露伴因此聽到了一樁 25 年前駭人聽聞的故事……\n\n　　在視覺圖中可以看見，在義大利威尼斯的知名教堂聖若望及保祿大殿前，岸邊露伴佇\n立著凝視遠方的樣貌。而在正式預告影片中，不僅可以看見岸邊露伴穿梭於威尼斯大街小\n\
  巷的場景，也可以聽見他說著義大利語使用「天堂之門」的部分。\n\n　　真人版電影《岸邊露伴一動也不動 懺悔室》目前預定將於 5 月 23 日於日本上映。\n\n\
  \n\n--"
