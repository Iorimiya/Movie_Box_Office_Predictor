url: https://www.ptt.cc/bbs/movie/M.1736225321.A.F3F.html
title: '[情報] 《岸邊露伴一動也不動 懺悔室》宣布改編 '
content: "《岸邊露伴一動也不動 懺悔室》宣布改編真人版電影 預定 5 月日本上映\n\n\n\n以荒木飛呂彥的作品為基礎改編，《岸邊露伴一動也不動》系列宣布「懺悔室」將改編真\n\
  人版電影的消息，目前預定將於 5 月 23 日於日本上映。\n\n\n\n\n\n　《岸邊露伴一動也不動》原作故事以擁有替身「天堂之門」的岸邊露伴作為主角，作為\n\
  \ 16 歲就出道的天才漫畫家，他的天堂之門可以將人變成一本書，讓他讀取別人的人生經\n驗或是想法，也可以利用寫入敘述改變對方的行為。\n\n　　「懺悔室」是《岸邊露伴一動也不動》系列的第一篇故事。故事中岸邊露伴為了漫畫\n\
  取材前往義大利，然而當他進入威尼斯某間教堂時，基於自身的興趣以及好奇心踏入了懺\n悔室，沒想到卻進到了本來應該是神父的位置？！隨著一名男子進入懺悔室開始懺悔，岸\n\
  邊露伴因此聽到了一樁 25 年前駭人聽聞的故事……\n\n　　《岸邊露伴一動也不動》系列曾分別於 2020、2021、2022 以及 2024 年推出了改編\n\
  影集，並且在 2023 年時上映了《岸邊露伴在羅浮》真人版電影，創下了 12 億日圓的票\n房佳績。真人版藉由高橋一生以及飯豐萬理江等演員的活躍，將原作故事忠實的重現。\n\
  \n\n\n--"
