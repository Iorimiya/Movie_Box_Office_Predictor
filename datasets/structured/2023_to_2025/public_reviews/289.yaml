title: '[微雷] 看完馴龍高手3後覺得跟對人看很重要'
content: '昨天去看了馴龍高手3，跟兩個單身肥宅加我共三個。不知道為什麼整場看下來發現周圍的觀眾


  都是情侶，只有我們這群是單身肥宅團，看完後赫然發現這部電影如果跟伴侶一起看一定很甜蜜，


  但是單身宅看只覺得不爽，媽的連龍都變馬子狗了，果然有異性沒人性啊。在加上現場都是情侶。


  整個決定被嘲諷好難過QQ

  -----

  Sent from JPTT on my iPad


  --'
