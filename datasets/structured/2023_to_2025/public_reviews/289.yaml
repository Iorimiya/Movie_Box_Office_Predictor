title: '[討論] 看完馴龍高手3'
content: '第一次發文，有任何不妥請告知


  我初一那天去看了馴龍高手3


  看完之後很感動，差點在堂兄弟面前哭出來


  一直到今天，只要想到劇情就會有一種很惆悵(?的感覺


  那是一種想到這個故事可能不會再出續集就很不捨的感受，心情會變得很沉


  但這是我第一次有這樣的感覺


  不知道是不是受到自己讀心理科系的影響


  在看電影看到這樣的情節會把自己投入其中


  就像剛剛在電影台看歌喉讚2看到最後大合唱差點哭出來


  這樣的感受也讓我很想去2刷馴龍3


  不知道各位有沒有這樣的想法


  -----

  Sent from JPTT on my Samsung SM-G955F.


  --

  我也有點不習慣哈哈

  也不是說同理，就是更容易投入劇情中哈哈

  說不定可以等外傳呢！'
