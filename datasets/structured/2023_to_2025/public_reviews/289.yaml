url: https://www.ptt.cc/bbs/movie/M.1749573250.A.9D1.html
title: '[新聞] 《馴龍高手》女主不在乎自己不是金髮'
content: '新聞網址：



  電影《馴龍高手》主演妮可·帕克表示，對於選角爭議「我就是不在乎」：「我無法看重

  你對我髮型的看法」


  妮可·派克（Nico Parker）對那些不滿她出演真人版《馴龍高手》（How to Train

  Your Dragon）的人毫不在意。


  在最近接受《泰晤士報》（The Times of London）採訪時，派克談到了圍繞她出演年輕

  的馴龍高手亞絲翠（Astrid）所引發的網路反彈。有些人對派克不像原版動畫《馴龍高手

  》中的角色那樣擁有金髮藍眼睛感到不滿。然而，這位 20 歲的英國女演員解釋說，她不

  會讓這些評論影響到自己。


  她說：「有些人真的很喜歡動畫電影，也真的很希望看到電影的每個細節都原汁原味地呈

  現，我希望你們能觀看（新版本）並從中找到你們喜歡的東西，不管怎樣。」她繼續說：

  「但對於那些只是仇恨包容性、仇恨改變的人——當涉及到這方面的事情時，我根本不在

  乎。」她補充說：「如果我對生活中大多數事情的看法都不會重視你的意見，那我也不會

  重視你對我頭髮的意見。如果我這樣做，我會瘋掉的。」


  派克出身於一個電影製作人家庭。她的父親是導演奧爾·派克（Ol Parker），母親是演

  員譚蒂·牛頓（Thandiwe Newton）。她補充說，她小時候，好萊塢對「混血或黑人偶像

  」的代表性「非常少」，但她認為看到這個行業發展到現在的程度「真的很特別」。


  派克補充說：「還有很長的路要走——對於女性來說，無論是新角色、原創素材還是女性

  主導的故事，都還有很長的路要走。」「但我認為一切都在改變。我希望我能在某個時候

  為這種改變做出貢獻。」




  稍微看了一下片段，這位童星演的比動畫還爛，拔斧頭那邊沒有情緒，據說和男主角

  也沒有化學作用，搞翻拍這種沒創意的事情還好意思大小聲

  參考影片:


