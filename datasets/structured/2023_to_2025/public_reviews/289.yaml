url: https://www.ptt.cc/bbs/movie/M.1677807335.A.0D8.html
title: '[  好雷] 馴龍高手'
content: '防雷



































  當年國高中有在電影院看2

  懵懵懂懂是覺得人類那邊沒太多亮點

  龍倒是都很有印象啦,如今從第一集開始看

  其實就有在大量鋪陳人的部份

  看開頭講這麼多話就知道了


  龍和人的相愛相殺是這個系列的主軸

  第一集展現了一部分,二三如果沒失焦就不算失敗吧

  人類的天生我才必有用和龍的生存即生活

  看起來有些兜不攏,但又如此貼近兩方的日常

  所以才會有不完整的一人一龍聚在一起的故事

  非傳統維京人和缺了半截尾巴的龍

  最後完整了彼此,很老套但有用的安排


  話說這部電影的維京人都被描述的很善良

  但看過海盜戰記就知道完全不是這樣

  在這也私心推爆海盜戰記

  第二季我還沒看，但第一季真的神

  雖然這是兒童向沒辦法

  但如果是我會用暗示來呈現維京人的凶暴


  我看很多評論都覺得是神作

  事實上我也是因為他在imdb top 250才看的

  不過個人覺得就是個佳作

  精準的兒童賣相、明確想探討的主題

  都很符合佳作的標準,但是呢！

  要到神作需要更多跳脫標準的元素

  這點我覺得馴龍高手就有待商榷了

  不過都是好作品,何必分這麼細呢？

  好看就足夠我們珍惜了,尤其是電影越是衰微的時代


  ----

  Sent from  on my Samsung SM-M325FV


  --

  萊斯特在最後敘述中講述了生活中有意義的經驗，他說，儘管他死了，他還是很高興，因

  為這世界上有這麼多的美


  --'
