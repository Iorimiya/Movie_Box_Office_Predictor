url: https://www.ptt.cc/bbs/movie/M.1749743127.A.358.html
title: '[新聞]獨／預購《馴龍高手》海報撲空　影城主管'
content: '新聞網址：


  記者張君豪、黃宥寧／台北報導


  《馴龍高手》真人版昨（11）日正式上映，國賓影城更推出限量海報與角色娃娃等預購贈

  品。不料北市西門國賓卻爆發爭議，有影迷控訴依規於預售期間購票，首映當天卻撲空無

  法領取特典，現場員工卻稱「當天買票也算預售」，讓人質疑規則朝令夕改。更有女影迷

  控主管態度惡劣，嗆聲「妳就是來要贈品的」，現場一度混亂，警方也到場協助處理。


  J小姐（化名）向《ETtoday新聞雲》投訴指出，她為了獲得《馴龍高手》限量D-BOX場次

  專屬海報，早在6月11日上映前兩度親赴西門國賓臨櫃確認，影城人員明確表示「需於6月

  10日前完成購票，方屬預售資格」，並在正式上映後當日憑票根領取海報。但6月11日下

  午1點多前往影城，卻被告知「海報已送完」。


  她當場質疑：「我是買5點10分的D-BOX，怎麼可能那麼早就沒了？既然有發放限制，為什

  麼沒公告？甚至沒人說要早上來排隊。」更讓她錯愕的是，影城主管竟當場表示：「今天

  買下一場也算預售。」她傻眼直呼：「我看電影20年，第一次聽到預售可以當天算。」


  當她進一步要求解釋時，主管不僅態度冷淡，還當眾開酸：「妳就是來要贈品嘛！」甚至

  出手拍手機並揚言報警，導致雙方爆發衝突。J小姐隨後自行報警，並表示有友人錄下主

  管言行，控訴「被輕視、被羞辱，還被誣指只為了贈品糾纏」。


  西門町派出所於11日下午2時接獲報案，指西門國賓影城前發生糾紛。警方到場了解後，

  發現是J姓女子參與影城舉辦之集點兌換活動，集滿點數後因未在期限內兌換，遭影城人

  員拒絕，引發爭議。


  劉女表示，自己並未接獲任何活動結束提醒通知，對相關規則有所疑義，認為自身權益受

  損；惟警方查證發現，活動確有明訂兌換期限，影城方面依規定處理。


  警方呼籲，類似消費糾紛應理性處理，如有爭議，可循申訴管道反映，避免現場爭執甚至

  衍生違法情事。


  《ETtoday新聞雲》記者實地走訪西門國賓影城，現場人員表示，限量海報已全數發完，

  目前僅剩3隻角色玩偶可供兌領。至於贈品發放準則及爭議部分，記者聯繫該影城國賓欲

  求回應，截稿前尚未獲得正式說法。


  然而，J小姐並非唯一受害者。多位影迷也在國賓影城粉絲專頁留言指出，國賓5月30日曾

  公告，海報需於預售期間購票才能於上映日領取。他們依規於6月10日前完成購票，卻被

  現場即日購票的觀眾「掃光特典」，更有傳言指出部分贈品已被轉賣牟利。


  有影迷怒批：「預售已結束，憑什麼當天買票也能拿海報？我們守規矩，結果成了笨蛋。

  」也有影迷不滿遭質疑為何沒一早來排隊反問：「我是觀眾，不是員工，不需要打卡上班

  吧？」


  更有老顧客比較不同分館表示：「長春國賓服務清楚、態度親切，處理會員問題從不推責

  ，哪像西門這邊主管大小聲又說謊，令人失望透頂。」


  這場預購風波，也凸顯戲院在行銷活動與現場執行間的溝通斷層，以及對於消費者權益保

  障的不足，引發不少忠實粉絲質疑：「贈品究竟是回饋還是噱頭？」




  --'
