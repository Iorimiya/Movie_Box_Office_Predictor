title: '[討論] 馴龍高手 Homecoming 比想像中好的後篇'
content: '馴龍高手3的評價有很多不同意見


  我個人也是對馴龍3心有遺憾


  不過這次推出的馴龍高手後篇，比我想像中來得好


  稍微補足了這點遺憾


  =======================椅下有雷=====================












  故事發生在人龍分離的十年後

  小嗝嗝的兩個小孩已經是有自我意識的年紀了

  小男孩像個小呆瓜，整年拿頭去撞東西，證明自己勇敢

  小女孩反而有點像爸爸，聰明愛思考，懷疑老爸說龍是好的是在騙她的

  有一天她在閣樓發現以前博客人對龍的描述的書，她發現了掩埋已久的真相.....


  好啦不是柯南

  小女孩懷疑爸爸是否為了小孩害怕所以掩蓋龍的真相

  所以還製作一大堆道具防止龍的入侵(雖然都是打到老爸)

  (這個能力真的像小嗝嗝)


  小嗝嗝為了解釋也為了讓大家記著人龍共存的美好時光

  決定在博克島節日舉辦話劇表演

  內容是以前小嗝嗝父親經過一連串事件跟Toothless和解的過程


  小嗝嗝對小孩們說Toothless的故事，小孩半信半疑

  過程中他忍不住思念起Toothless 也對亞絲翠說不知Toothless也有想過他


  畫面切到龍巢穴中，Toothless正拿著樹枝畫出小嗝嗝的樣子

  小龍們過來亂畫之後，Toothless反而又畫出了顯示人跟龍的牽絆的線

  但是老婆看到不開心了XD (也不到不開心，比較類似不以為然吧)

  Toothless也快點過去跟老婆撒嬌(我心中只有妳啦，沒有那個斷了腿的男人)

  但其中一隻白鼻心小龍，對這張圖特別有興趣


  製作話劇過程太多細節不詳述，總之小嗝嗝做了Toothless的外殼來扮演他

  雖然小嗝嗝對悍夫納特扮演他自己不太滿意，但扮演過程中亞絲翠還認錯人XD

  直到要開演的那一天節日


  白鼻心小龍想出來找那個"人"

  所以揪個其他兩隻小龍出來探險

  三隻小龍搖搖晃晃地接近了博克島


  節日當天

  話劇開始演出

  演出過程平凡無趣XD

  直到扮演史圖依克的魚腳司假鬍子在一陣慌亂燒起來之後


  人在假Toothless的道具殼內

  不知道發生甚麼事的小嗝嗝

  只能任由吊繩亂晃，東倒西歪

  不知不覺走到了懸崖邊


  Toothless跟老婆大人發現小孩不見了

  一起出來找小孩的蹤跡

  終於找到小孩躲在博克島上偷看話劇XD

  一起把小孩罵了一頓

  突然Toothless目光看到一個不知名怪殼，發出小嗝嗝的聲音

  在懸崖邊搖搖晃晃


  小嗝嗝終於掉了下去

  危急之際

  Toothless耳朵一縮，噴了出去(有看過就知道動畫裡這個速度超噴)


  Toothless救起了小嗝嗝

  但是小嗝嗝在殼內甚麼也看不到

  還以為是戈伯救了他


  一團慌亂中

  話劇竟然變的火光四射，聲光效果十足

  最後煙霧中還隱約出現龍的身影

  大家都大呼精彩


  最後Toothless輕輕舔了一下小嗝嗝的殼之後準備離開

  離開的時候

  小女孩準備來看爸爸

  在台後跟Toothless碰個正著

  Toothless溫柔地看著她叫了幾聲之後，跟老婆小孩離開

  小女孩成為當天唯一看到Toothless的人

  小女孩似乎也改變了對龍的看法

  (記錯了，小嗝嗝一家最後有看到Toothless一家)

  (因為Toothless回到小嗝嗝家上空飛了幾圈才走，跟紅豬一樣XD)


  最後戈伯用力地暗示他在佳節只能一個人吃飯粉可憐

  當然地就被小嗝嗝一家邀請過去了

  做個Happy Ending




  這個後傳雖然沒有太多劇情

  但是看到小嗝嗝跟Toothless能短暫重聚

  還是很令人開心

  尤其在Toothless看到小嗝嗝有危險，瞬間衝出去的時候

  還是忍不住紅了眼眶

  動畫製作品質也很不錯

  算是頗值得觀賞的後篇了


  推薦給對馴龍高手3有遺憾的影迷們


  --'
