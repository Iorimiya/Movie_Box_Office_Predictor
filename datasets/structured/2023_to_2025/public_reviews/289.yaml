url: https://www.ptt.cc/bbs/movie/M.1549293605.A.D5B.html
title: '[好雷] 除夕夜的馴龍高手3 談長大'
content: '馴龍高手的第三集，可以說是壓箱寶全出，


  所有該解決的問題都在這邊一次給到位了。


  整理來說，節奏略嫌快速、配角搞笑樣板化，依舊拿賣萌當賣點。


  算是一部，以單部電影來說是中規中矩的片。


  但是一想到他長遠以來的鋪陳，


  以三部曲來算的話，


  又忍不住覺得這是一部非常好看的收尾電影。










  大家都相當認同的第一部神作，


  也在第三部有很多的回應跟致敬。


  運鏡配樂美術各種畫面更是一級棒，終於到了電影世代的全勝時期。




  此外也替中間力道不足、略嫌無聊的第二部，


  猶如俯衝般的拉高了評價。









  下面先談談角色發展。


  最重要的自然是小嗝嗝了，


  其實整部三部曲電影中在角色成長中是有進度表的。


  第一部，大家還未了解龍的世界觀前，


  談的是大家最為熟悉的親子問題與認同問題。


  小嗝嗝無法融入維京人的生活，


  最後跟龍族大和解，取得了大家的認同。


  透過有趣感人的馴龍過程、令人血脈噴張的最後大決戰以及父子與村子的認同，


  取得了神作的評價。







  但此時的小嗝嗝，仍舊是一個普通的維京人，從追求村子的認同，


  到得到村子的認同，以及龍的友誼，他的生活仍然受到父親的庇護。




  第二部，在大家對龍開始有了一定印象後，


  電影野心頗大的追加了至尊龍、母親的設定，


  最後讓小嗝嗝失去了父親，必須強迫自己成長。


  最後在沒牙的開外掛賣萌幫助下，小嗝嗝趕走了敵人，


  接下了他本來不願意的村長擔子，開始向他的父親看齊，成為一個維京族長。







  最後一部，小嗝嗝跟沒牙道別，


  真正的，擺脫了以往所有的保護傘，用他自己的方式來保護村子。


  這時候的他，正式成為小嗝嗝族長，用他的溫柔與智慧，來帶領族人。




  其實從第一集到最後一集，


  我們都可以看到，小嗝嗝其實是一個，蠻容易懷疑自己的人，


  需要身邊的母親、亞絲翠來解除迷惘。


  但是當面對，敵人跑來傷害自己所愛的一切時，


  小嗝嗝又變得比任何人都堅強。









  這就是屬於小嗝嗝的溫柔。



  所以這樣的溫柔帶領小嗝嗝，解開島上對龍族的誤會，


  解放各種被抓走的龍，


  最後跟他自己的龍說再見。













  再來談談沒牙，


  沒牙其實就蠻簡單的，就第一集走馴化路線，


  第二集賣萌讓大家買單到不行，


  到第三集，他又離開人類的束縛，回去大自然。



  其實這樣的結局，在我來看是舒暢的。


  因為在第二集時，總有一種，都當到至尊龍了，


  還在小嗝嗝身邊賣萌的神奇寶貝感，


  到了第三集，總算是把這個結給解開了。










  總之跟龍族的關係就是，


  第一集收編、第二集調查物種生態外加賣萌，第三集就大家放生，


  順便回到歷史之壁上。




  算是收得中規中矩。


  角色刻劃也是超級動人，一人一龍的互動超催淚。












  小嗝嗝雖然很捨不得，但從未阻擋過沒牙追求自由，


  要尾巴給尾巴、要求偶舞給求偶舞，


  但最後他終於知道，他沒有辦法再陪在沒牙的世界裡了。



  就像父母，終於必須讓孩子長大離家一樣。


  小嗝嗝此時能做的，就是替沒牙準備好一切，


  所以他告訴沒牙，感謝沒牙所做的一切，給了沒牙沒有遺憾的道別。









  雖然整個三部曲的進程有點過於刻意，像是安排好的放生大會


  但是一人一龍的感情流露、小嗝嗝個人的角色成長（也因此讓其他角色都


  變得功能化扁平化）以及迷人的世界觀設定與美術呈現，


  都足以讓這部電影成為經典了。




  電影的片尾，播放了第一集與第二集的相處互動，


  我們看著稚嫩的小嗝嗝伸手去碰沒牙，


  再對應到長大後的小嗝嗝跟沒牙家族。












  我們知道友誼會隨著時間改變，


  這一人一龍終將各自擁有自己的人生，


  但相信他們永不會忘記，


  在對方最需要自己的時候，他們從未在彼此的生命中缺席過。



  --'
