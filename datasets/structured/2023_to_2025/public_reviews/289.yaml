url: https://www.ptt.cc/bbs/movie/M.1751709799.A.854.html
title: '[好雷] 馴龍高手(2010)─解析〈禁忌的友情〉一節'
content: "大家好，\n\n以上的電影配樂〈Forbidden Friendship〉，\n\n是作曲家John Powell為動畫版《馴龍高手》製作的配樂。\n\
  \n我非常喜歡在電影中使用這首配樂的劇情，\n\n扣人心弦，人龍之間禁斷的情感，我深深地被感動，\n\n因此寫了這篇解析希望能讓大家瞭解到這個段落的厲害之處，\n\
  \n雖然都只是些個人的看法，也請大家多多指教了。\n\n\n\n\n\n因為《馴龍高手》(2010)是一部非常優秀的作品，\n\n裡面有太多東西可以探討與解析了，\n\
  \n為避免講到開花，本文僅解析〈Forbidden Friendship〉配樂\n\n開始到結束的這段劇情，\n\n但還是先交代些前情提要讓大家能快速瞭解到狀況，\n\
  \n那麼，以下開始解析：\n\n\n\n\n\n\n\n\n零、前情提要\n\n\n\n\n\n『為什麼牠／他不殺了我？』\n\n──這不管是小嗝嗝或者夜煞，都存在於他們心中的困惑，\n\
  \n或許是基於衍生出來的好奇，\n\n所以當小嗝嗝帶著魚出現，並解除自己的武裝，\n\n誘使夜煞接近，才讓這一人一龍有了交流的機會，\n\n於是，一段禁忌的友情油然而生……\n\
  \n\n\n\n\n\n\n\n一、起──禁忌的友情\n\n\n\n\n\n當夜煞遽然搶吃下了魚，接著持續湊到小嗝嗝面前，\n\n小嗝嗝懼怕遭受攻擊、不斷退後之際，\n\
  \n夜煞卻做出了一個完全相反的舉動──反芻吐出半條魚出來，\n\n給了他，便對坐著，這代表「感謝」與「反饋」之意，\n\n卻使小嗝嗝愣住，並讓一人一龍間尷尬地對看了半晌。\n\
  \n\n\n\n\n在這裡岔開一下，先闡述一件重要的前提，眾所皆知，\n\n夜煞，或者說沒牙（劇情此時尚未賦予牠名字）是一隻動物，\n\n因此無法使用對話、自語、內心獨白等方式來表達感受，\n\
  \n只能用誇張的表情、肢體動作，以及不成言語的叫聲語調等，\n\n來明示或暗示自身的意念及情感，\n\n這在敘事上其實是一大挑戰。\n\n\n\n\n\n那麼，回到僵持的場景，\n\
  \n這邊夜煞活靈活現、生動的臉部表情，彷彿依序說著：\n\n「不吃嗎？」、「吞下去！」、「好吃嗎？」等話語，\n\n而驚魂未定、傻眼的小嗝嗝，看著巨龍分享的半條魚，\n\
  \n或許是不想辜負的牠的好意，也可能是一種交心策略，\n\n總之雖然不太情願，卻還是選擇回應了牠：\n\n咬了一口，硬吞了下去，再擠出一個笑容，\n\n然後，重點來了，\n\
  \n先是顯得困惑，夜煞卻也回應了──\n\n牠竟模仿了小嗝嗝，也擠出了一個相當彆扭的笑。\n\n這相當地有意思，不論是「模仿」的動作還是「笑」的本身，\n\n\
  其實都是被豢養的狗才會有的習性，\n\n雖然我們知道之後的劇情沒牙展現出一堆像狗又像貓的行為，\n\n但我想這裡特別暗指的是所謂「馴化」的過程。\n\n小嗝嗝‧阿倫德斯‧哈德克三世，維京人，15歲，\n\
  \n這輩子從來沒見過龍擠眉弄眼地笑，感到些許驚訝，\n\n膽子或許因此大了起來，便向著龍伸出了手，\n\n夜煞見狀，齜牙咧嘴，馬上飛走了，\n\n人龍之間的第一次碰觸就以失敗收場。\n\
  \n\n\n\n\n\n\n\n二、承──夜煞的心境與小嗝嗝的領悟\n\n\n\n\n\n飛走的夜煞，用龍火在地上吐了一圈，\n\n然後便窩在燒焦的範圍內。\n\
  \n這邊顯然在暗示一件事，同時也解釋牠逃離的原因──\n\n因為夜煞選擇封閉自己的內心，不想讓任何人踏進來；\n\n那麼，為什麼夜煞要畫地自限，封閉自己呢？\n\
  \n再下一個鏡頭就是答案：畫面帶到夜煞看見一隻鳥從巢裡飛走，\n\n代表著兩件事情──「飛行」以及「自由」，\n\n這正是當下的巨龍曾經擁有過，如今卻失去的重要事物。\n\
  \n\n\n\n\n我想有一點值得一提，夜煞身處的這個看似美麗的峽谷，\n\n其實不盡然，實質上，這是一座困住巨龍的巨大牢籠，\n\n夜煞已嘗試許久，已摔落數次，卻也無法離開，\n\
  \n顯然身心俱疲了，牠的心情應是盪到了谷底，\n\n我想這恐怕是這隻年輕夜煞生命中最糟糕的三天了，\n\n因此，心情低落，才不想讓任何人接近牠。\n\n\n\n\
  \n\n但我們的人類主角還是鍥而不捨，儘管夜煞一臉受夠了的表情，\n\n他卻還是不斷地靠近牠，牠吃飽了只想睡大頭覺，\n\n他又伸出手想要碰觸牠，牠突然抬起了尾巴驚覺：\n\
  \n「幹嘛啦！」\n\n──我彷彿聽到夜煞說出了這樣的話。\n\n他嚇到若無其事地離開，牠也起身悻悻然地離去。\n\n其實這段劇情只是想表達一件事：\n\n封閉內心的夜煞，除非牠主動，不然小嗝嗝是不可能接近牠的。\n\
  \n我想小嗝嗝是個聰明的孩子，雖然白目了點，\n\n但這件事實想必他也是有所領悟的。\n\n於是，人龍之間的第二次碰觸仍以失敗收場。\n\n\n\n\n\n\n\
  \n\n三、轉──要破冰，不如先跳支舞吧\n\n\n\n\n\n不知過了多久，倒掛的夜煞醒來，天色更暗了。\n\n那人類還在。在幹嘛？不為什麼但還是過去瞧瞧了。\n\
  \n\n\n\n\n……好吧，意識流寫法真的不適合用在沒牙，\n\n我怎麼會知道龍的內心在想些什麼啊，\n\n不好意思，我們重來──\n\n\n\n\n\n夜煞醒來了，又聞到小嗝嗝的味道，\n\
  \n看見他還獨自在湖畔邊，不知道在做什麼；\n\n小嗝嗝在做的事情很有趣：拿著樹枝在地上描繪夜煞，\n\n這邊理所當然地表示，他還是很在意夜煞。\n\n夜煞從後面接近了，小嗝嗝注意到了，但不動聲色，\n\
  \n因為他明白必須讓牠主動靠近才行；\n\n夜煞好奇地看了看，接下來的舉動更加有趣，\n\n牠竟也模仿小嗝嗝，叼起了樹幹，也在地上作畫。\n\n這裡表現出這夜煞的玩心很重，像小孩子一樣，\n\
  \n因為看見了小嗝嗝在畫畫，所以牠也要畫，\n\n中間一度還停了下來，看了小嗝嗝一眼，然後再繼續畫，\n\n最後的成品非常藝術、非常抽象、非常靈魂繪師，\n\n\
  但看的出來是在畫小嗝嗝，或許可以推測出牠也在意他吧。\n\n總之夜煞似乎很滿意，以致於小嗝嗝不知所措地想離開繪圖陣，\n\n踩到線牠還會生氣（這邊一人一龍的互動真的很可愛），\n\
  \n最後小嗝嗝總算找對了方法，小心翼翼地跨過線，\n\n非常笨拙地離開，通過了「巨龍的考驗」，\n\n卻也因只顧著看線，無意間，來到了夜煞的身邊……\n\n\n\
  \n\n\n以上，可能是一般大眾對於這段情節的理解，\n\n然而，我要說，這段劇情真的很厲害，\n\n在這邊，我們不妨用另外一個角度來看待同樣的劇情，\n\n\
  那麼，我們重來──\n\n\n\n\n\n夜煞看見了小嗝嗝在畫牠，或許覺得好玩，\n\n牠也「碰、碰、碰」地快步跑去叼了樹幹，也想要畫他。\n\n夜煞畫著圖，一邊擺動著巨大的身體、躍步、轉圈、滑行，\n\
  \n像是一段翩翩優美的舞蹈，使得小嗝嗝目不轉睛地看著牠，\n\n中間一度枝葉還打到小嗝嗝，卻不影響牠，也不影響他，\n\n最後圖畫好了，打量著自己的成果，夜煞彷彿在說：\n\
  \n「（畫的）真好啊！」；\n\n至於起身的小嗝嗝，左顧右盼，呆頭呆腦，不慎踩到了線，\n\n夜煞生氣了，但小嗝嗝很快就明白不能踩到線，\n\n於是，他淺淺笑了一下，帶著一點自信的樣子，\n\
  \n謹慎地提起手、抬高腳，迴身閃線移動，也像是一段舞蹈，\n\n雖然笨拙，但舞動著身軀，其實就是作為巨龍舞步的回應……\n\n\n\n\n\n這情節真的編排得非常巧妙，看似畫圖的互動，\n\
  \n其實背後隱藏的是──夜煞和小嗝嗝都各自獨舞了一段，\n\n而且主角雙方都沒有意識到自己在跳舞。\n\n關於舞蹈這種東西，\n\n人類自古以來就懂得跳舞，野獸也懂得跳舞，\n\
  \n可以用於社交，可以用於求偶，\n\n可以做為一種直接以身體表達情感的方式。\n\n所以我認為這裡隱藏起來的含意是──\n\n\n\n\n\n我獨舞了一段，你也獨舞了一段，\n\
  \n之後，我們就可以一起跳舞了。\n\n\n\n\n\n雖然是我個人對於這段劇情的註解，\n\n但對照著後面一人一龍一同翱翔的發展，我覺得非常浪漫。\n\n總之，小嗝嗝就這樣跳著笨拙的舞，\n\
  \n無意間，來到了夜煞的身邊……\n\n\n\n\n\n\n\n\n四、合──「名場面」\n\n\n\n\n\n小嗝嗝來到了夜煞的身邊，他們四目相望著，\n\n\
  這次，小嗝嗝仍又伸出了手，\n\n再次，夜煞仍又內心抗拒著。\n\n『必須讓牠主動才行……』小嗝嗝馬上想到一個方法：\n\n他把頭別了過去，僅是將手臂伸直而已。\n\
  \n這段非常重要！傑出的一手啊，小嗝嗝，但風險很大！\n\n這背後代表著兩個意思，\n\n其一是「信任」，\n\n不消多做解釋了，就像不會有人蒙著眼，\n\n\
  將手伸向獅子、老虎等這類猛獸，\n\n正常維京人絕不會毫無防備地將手伸向巨龍，\n\n小嗝嗝卻這麼做，完全是基於對於夜煞的信任；\n\n其二是「選擇」，\n\n\
  小嗝嗝給了夜煞選擇的機會，\n\n而不是單方面地、強迫牠接受人類所謂的「善意」，\n\n讓龍有選擇的餘地，畢竟終究還是得讓牠能夠主動，\n\n這樣才能突破牠的心防。\n\
  \n我想看到此情此景，夜煞的內心一定有很多小劇場吧，\n\n但根據之前的協議，我們不探究夜煞內心在想什麼，\n\n只闡述顯而易見的結果：\n\n夜煞緩緩地，將頭靠近小嗝嗝的手掌，\n\
  \n中間一度還遲疑了一下，但，還是閉起眼睛，\n\n用鼻子輕輕碰觸小嗝嗝的手，造就了本作的「名場面」。\n\n夜煞選擇「接受」了，小嗝嗝回首，也是一臉訝異，\n\
  \n夜煞柔和的眼神看著他，似乎有點害羞，\n\n吐息了一下，便溜走了，小嗝嗝甚至還沒反應過來。\n\n到此音樂漸弱，本段正式結束，\n\n人龍之間的第三次碰觸總算是成功了。\n\
  \n\n\n\n\n\n\n\n結語：\n\n《馴龍高手》動畫版是一部相當優秀的作品，\n\n其中〈禁忌的友情〉的段落，起承轉合敘事結構完整，\n\n小嗝嗝和沒牙之間深切的互動，建立起來的友誼，\n\
  \n更具有深刻的意義，在劇情發展上亦有重要的地位，\n\n像是後來一人一龍一起練飛就是以此為基礎，\n\n也帶出了之後種族間、父子間衝突的情節。\n\n好了，解析到此，都只是些個人的想法，\n\
  \n感謝各位閱讀到這邊了。\n\n\n\n--\n                                  07/05 18:07\n\n\n謝謝大家的回應及推文，\n\
  \n雖然本篇是一篇解析文啦，但其實用了很多寫小說的筆法在寫，\n\n如果各位喜歡的話，那我會很高興的。\n\n\n\n我非常喜歡《馴龍高手》這部作品，\n\n\
  也是看了2025年真人電影版後，回頭再重看2010年動畫版時，\n\n才發現原來有這麼多細節與暗示，是當初沒有注意到的，\n\n所以就寫了這篇解析來跟大家分享一下我的理解，\n\
  \n順便推廣一下《馴龍高手》，真人電影版和動畫版都很棒，\n\n劇情相當出色，而且重點是沒牙真的很可愛，\n\n我好喜歡沒牙喔，進場光是看到沒牙就讓我好開心。\n\
  \n\n\n總之，再次感謝各位看到這邊了，謝謝大家。"
