url: https://www.ptt.cc/bbs/movie/M.1549718209.A.3F3.html
title: '[普雷] 馴龍高手3 '
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  1.影片名稱 :馴龍高手3


  2.觀影時間 : / 拒答


  3.觀影地點 : 台南威秀


  4.觀影方式 : 自行購票


  §其他防雷說明(非必要) :




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  此區為發文防雷頁

  可選擇性提供上列 1~4 資訊  或不提供亦可

  觀影心得於分隔線下方發布即可


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這次看了板上一堆好雷說馴龍高手3結局很感人


  而且imdb有8.0分


  因此利用新年假期去看了這部


  不知道是不是期待太高


  本來以為會像是玩具總動員3那樣的神結尾


  但後來也覺得還好


  講幾個我覺得有點鳥的點吧


  一開始各個抓龍軍團集合起來


  弄的浩浩蕩蕩、威風八面


  加上葛林魔直接跑去主角的博客島撒野


  搞得主角一行人嚇得舉家搬遷


  結果


  最後幾個小屁孩就打爆這些軍團的人了


  不知道當初嚇到搬走的理由是什麼


  直接帶飛龍大軍主動出擊打趴敵人不就好了


  而且我搞不懂


  飛龍空軍團這麼強


  主角一行人每次都要跳到人家船上打肉搏幹嘛


  那些龍一隻一口火 就把那些船都燒光啦


  就像美軍有F22還要機員跳傘到人家軍艦上拿槍跟人家船員PK一樣蠢


  而且搞不懂為什麼這部一定要搞一個大反派


  如果要表達因為人類濫殺 所以希望龍能隱藏起來


  那可以不一定非要葛林魔不可


  可以用主角已經盡力搶救


  結果還是看到許多龍被世間獵魔獵人撲殺的絕望感


  或是人類創造了新的獵龍武器


  讓主角無能為力


  所以要舉家搬遷到祕境


  而不是簡化成打敗一個大反派來解決所有的事


  不能使人對現實濫殺動物來做反思實在是有點可惜


  雖然我覺得有待加強


  不過最後主角獲得成長 放手讓沒牙離開


  而且成為一個成功的首領 也確實是一個很不錯的收尾


  總而言之 這部沒有馴龍高手1讓我驚艷


  但比起2好看不少


  算是一個合格之作


  imdb 8.0是有點過譽 分數應該還會往下修一些吧


  --'
