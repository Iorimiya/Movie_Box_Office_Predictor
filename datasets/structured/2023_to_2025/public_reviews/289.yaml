url: https://www.ptt.cc/bbs/movie/M.1749888515.A.096.html
title: '[超爽雷] 馴龍高手 真人 必看4DX 喜歡怪獸就看'
content: '猶豫要不要看馴龍高手4D

  一律建議直升4DX

  基本上是在玩遊樂設施

  後面真的搖到便秘都通了

  腰又痛又爽

  花600坐2小時的按摩椅值啦～

  沒牙紫色火焰真的超漂亮

  劇情一摸一樣

  但還是很感動


  但小咯咯帥（有阿湯哥跟影集夜翼的臉）

  女主角美～（我是覺得髮色不是重點好嗎？）

  沒牙超級可愛（有養寵物狗一定喜歡又帥又可愛的沒牙）


  打戲蠻好看而且打好打滿（建議一定要4DX)

  父子衝突意外感動


  第二集拜託也真人化（我沒看第二集）


  而且特效真的很棒

  有種回到小時候看變形金剛的感覺


  大推

  95/100

  沒4D可能80/100

  -----

  Sent from  on my iPhone


  --



  --

  中上啊

  大螢幕跟體感椅的差別

  聽06/15 15:12

  我也是台中人去高雄看'
