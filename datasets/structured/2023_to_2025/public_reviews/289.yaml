url: https://www.ptt.cc/bbs/movie/M.1749805665.A.461.html
title: '[好微雷]馴龍高手 --為某原因二刷XD'
content: "這部片上映後，我兩天刷了兩次，倒不是因為這部片多好看。\n而是光這部片沒有魔改任何劇情，已經值得給個嘉獎。\n\n\n\n\n\n以下都是個人觀感，若看法不一致都是我錯，謝謝。\n\
  \n\n\n\n\n\n\n因為對於看過動畫的觀眾來說，真的會減卻幾分驚奇感，但不失為一部好作品。\n\n\n\n\n\n\n\n\n\n它就是一個口號：「老老實實把一部動畫真人化有那麼難嗎？」\n\
  \n\n\n\n\n說實在的，以一部真人化作品，這是它的長處，也是短處。\n\n長處是它確實作到了幾乎九成的還原，十分美景的感動；本來的動畫變成真正場景，\n\
  會讓人意識到這世上當真存有那樣的海洋與島嶼，山林與天空。\n曾經有一群驕傲的維京人，住在傳說中的島嶼，與神奇的龍們共存。\n\n短處就是看過動畫版的人，對於劇情不會有太大的驚奇，因為都會知道發生什麼事情。\n\
  只有一些在現實狀況中其實不太可能做出來的效果，就用其他方式取代。\n\n比如說動畫版裡面，當亞絲翠知道沒牙的存在後，小嗝騎著沒牙把亞絲翠吊在樹梢，\n後來改電影版成掛在峭壁上，可能就是樹梢這個拍攝上有難度。\n\
  \n\n或者亞絲翠多了出身低微所以野心勃勃一心往上爬的設定，其他的大致沒有很多差別。\n\n至於主角：就是年輕演員群，基本上小嗝演員太帥或者亞絲翠演員其實不是金髮碧眼\n\
  什麼的，或者演技上面無甚突出什麼我其實可以接受啦。\n\n大家主角是要沒牙啊！可愛的沒牙！\n\n嚴格說來，沒牙在真人版中的皮膚感其實是做得很好的，一定要挑剔的話，個人以為\n\
  動畫版的神情和眼睛還有動作做得更靈活一點點，比如在經典試飛場景中\n小嗝不小心讓他們撞了一下山壁，沒牙氣得用長耳朵拍了一下小嗝，這個我真的覺\n得很可愛，或者亞絲翠嚇得尖叫時牠露出那種嘻嘻嘻嘻的眼神，還是動畫版更靈活。\n\
  \n不過這是我個人想法，有人若看法不一樣一定是他對。\n\n\n\n我特地要PO這篇文章，以及我為什麼要二刷，我只是想大喊：史圖依克阿爸好帥！太\n帥了！\n\n\
  如果各位有看過動畫就知道，史圖依克就......就維京族長，勇敢、壯碩，\n有著大老粗的形象，但不是個壞人，相反地充滿責任感和勇氣，\n雖然不懂兒子但很愛他，這部片令人感動的就是會讓人意識到父母意識到\n\
  孩子跟自己是不一樣的個體，史圖依克有很多毛病，但他永遠愛自己的孩子\n但以動畫來說不能說帥，至少我不能。XD（純主觀，反對的人一定是正確的）\n\n\n當初動畫版是請演員傑瑞德巴德勒來配音，真人版乾脆就真的請他來當老爸。\n\
  \n各位，傑瑞德巴德勒啊，先說作品太多了，隨便舉大家可能都看過好幾部。\n\n喜歡音樂劇的，他是「歌劇魅影」中的魅影。\n\n跟我一樣熱愛商業動作片的，是「全面攻佔：倒數救援」中的麥克班寧組長\n\
  \n欣賞史詩片的，他是「斯巴達」中的列奧尼達王，或者「荷魯斯之眼」的賽特\n\n其實還有超多作品，族繁真的不及備載XDXDXD\n\n重點是，傑瑞德巴德勒很帥，超帥XDXD，當初演魅影還被兔曹說這麼帥的魅影\n\
  女主角還會看上子爵到底有哪裡不對？？？\n\n總之史圖依克請傑瑞德巴德勒來演，真的是太帥了，帥到他劇組不得不絞盡腦汁讓他看\n起來不能很帥，而是要很壯了，還要得不穿了20公斤的衣服還披著羊毛毛毯，\n\
  還貼了滿臉大鬍子，來符合大塊頭史圖依克的形象\n\n不過如果鏡頭拉遠，就會有點漏餡，因為爸爸的肩膀和上半身很寬，但是腿又長又細XD\n\n然後劇組為了壓制傑瑞德巴德勒的美貌，還堅持讓他大半部片都戴著頭盔，不然\n\
  這部片就變成阿爸是主角了，小嗝你還是站遠點吧。\n\n中間過程就不提了，總之當劇情走到史圖依克跳進海裡撈起小嗝，又放了沒牙時，\n因為這時候不用帶頭盔了，史圖依克頭髮飄盪在海中，看著沒牙那決定放了牠一秒。\n\
  \n長 髮 阿 爸 真 的 超 帥。\n\n史圖依克阿爸的眼睛裡有小宇宙啊！！！（抱歉，但我一時想不出其他形容詞了）\n\n後來以為小嗝嗝犧牲了的悲痛也詮釋地很好，其實這部片裡的演技擔當就是史圖依克\n\
  （另外一位是戈伯）\n\n所以我承認我就是為了看史圖依克阿爸的帥臉，又去刷了一次。\n\n\n\n\n\n所以，如果要開拍第二集的話，劇組你是不是該給我一個凱蘭崔爾k王后a冥王府女神海拉\n\
  aka依莉莎白女王的娃卡阿母？\n\n說好了哦XDXD（劇組：沒有！我們沒有說好！）\n\n所以說，阿爸是傑瑞德巴特勒，阿母是凱特布蘭琪，還有一隻龍族限量版夜煞當僚機\n\
  \n小嗝嗝不要再說你自己是魯蛇了。你真的很勝利超級勝利好嗎？\n\n\n\n\n\n\n\n\n--\n\n室友A：火星人趕快回火星去吧！地球不是個好地方啊\\\
  ____/\n\n我：*^^*危險的火星人都到地球來了，現在火星才安全呢！\n\n往火星的機票買一送一買商務艙送頭等艙哦～\n\n--\n坦白說個人認為年輕組以外的其他角色真的就NPC\n\
  所以最重要的戲份都在史圖依克和戈伯上，他們也演得恰如其份\n\n我有感覺他很投入這個角色（拇指）\n\n 06/13 18:23\n我是覺得因為是動畫真人化，所以沒有超出動畫劇情範圍，是有點可惜\n\
  但是太多太滿也會喧賓奪主（可能？）\n\n\n期待劇組邀到凱特來演娃卡媽媽\n\n是真的帥，拿掉頭盔後帥氣更是爆表\n\n下面有一篇有分享\n\n\n應該算是這幾年最成功的真人改編版\n\
  \n\n動畫真的是很不錯！若是可以的話可以再回頭看動畫，也會很感動喔\n\n 06/13 20:17\n\n2025目前看到最佳改編作品\n\n\n有機會來體驗看看！\n\
  \n我覺得那一瞬間搞不好傑瑞德會想喊，不過還是忍住了XDXD\n期待凱特布蘭琪加入這個宇宙\n凱特女王應該也很適合維京戰士裝！\n\n\n\n可以看看，真的蠻推薦的\n\
  \n好看+10000\n\n\n阿爸忍住了（但是拿著武器大喊時還是很帥）\n\n\n傑瑞德算是高產\n不過2004年他就演歌劇魅影了，2006年才接300壯士，後來也嚐試各種戲路\n\
  全面攻佔系列算是站穩了商業動作片主演的地位，我個人是蠻喜歡的\n\n真人版其實感情的部分，還是父子間的表現最深入\n\n\n看來300壯士那一幕深植人心XDXD\n\
  \n\n\n找他是正確的，只是真的太帥了XDXD\n\n\n雖然如此，進攻的場面其實只有幾秒鐘，因為立刻就被至尊龍掃蕩到差點全員GG\n\n史圖依克阿爸的演講其實還是蠻有魄力的沒錯\n\
  \n\n我是覺得有把父子彼此相互關心，但是相處上尷尬又有隔閡的部分表現出來\n\n\n我為了史圖依克又刷了一次，就是為了要看阿爸的帥臉\n\n\n動畫是經典+1\n\
  真人版還是有做些調整，可能還是考慮到時間長度和內容表現吧\n\n\n看來大家在那一幕都默默期待過"
