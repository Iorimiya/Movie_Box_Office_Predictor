url: https://www.ptt.cc/bbs/movie/M.1750154709.A.2F0.html
title: '[微好雷] 馴龍高手 精緻但有好有壞'
content: '剛看完馴龍高手的IMAX版，還原度真滴高XD

  劇情、分鏡、畫面幾乎都跟動畫版一模一樣

  優點是原作本來就很精彩

  這次用更精緻的畫面與配樂呈現，視覺聽覺都算蠻有誠意的

  但同樣也會不太理解，既然忠於原作，那翻拍成真人版的意義在哪？


  私心期待能在角色互動或劇情細節上有更多延伸

  甚至帶出一點新的觀點，應該會更驚喜

  整體來說還是好看的，只是喜歡原作的人可能會希望劇情不只是「重新演一次」


  喔然後完全可以不用複習原作動畫，忘記一點點比較有驚喜感


  --'
