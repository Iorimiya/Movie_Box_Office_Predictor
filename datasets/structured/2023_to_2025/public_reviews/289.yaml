url: https://www.ptt.cc/bbs/movie/M.1528383917.A.3FB.html
title: '[討論] 【馴龍高手3】前導預告-2019年 歡樂登場'
content: '類型：                史詩動畫冒險片

  卡司：                傑巴魯契、艾美莉卡弗瑞娜、凱特布蘭琪、基特哈靈頓、克雷格

  弗格森、莫瑞亞伯拉罕

  編導：                迪恩戴布洛伊

  原著作者：            葛蕾熙達柯維爾

  製片：                布萊德路易斯、邦妮艾諾


  夢工廠即將推出全球影迷引頸期待，影史最受歡迎動畫系列電影之一的最終章：

  【馴龍高手3】。

  這場驚險刺激、感動人心的冒險旅程，

  從一個維京族少年和一隻叫夜煞的凶猛巨龍之間，建立起令人意想不到的深厚友情之後展開，並且演變成為一部刻劃他們生命成長歷程的

  史詩三部曲。在最後的篇章中，小嗝嗝和沒牙終於將找到他們真正的使命：

  小嗝嗝和亞絲翠一起成為博克島的族長，沒牙則成為龍族的老大。

  他們分別成為領袖之後，卻必須面對有史以來最可怕的威脅，

  以及一隻母夜煞的出現，這一切都將考驗他們之間的深厚關係。

  【馴龍高手】系列電影導演迪恩戴布洛伊和全明星卡司再度回歸。

  製片是布萊德路易斯（【料理鼠王】、小蟻雄兵），

  以及【馴龍高手】系列電影製片邦妮艾諾（【玩具總動員】、【泰山】）。


  --'
