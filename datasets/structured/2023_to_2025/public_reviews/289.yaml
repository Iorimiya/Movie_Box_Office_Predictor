title: '[新聞]《馴龍高手》真人版 女主角非裔血統引論戰'
content: '新聞網址：


  原標題:



  廖旼謙

  2023年6月1日 週四 下午9:51



  人氣動畫電影《馴龍高手》劇情講述一名維京人跟巨獸一同冒險的故事，先後在2011、

  2014跟2019年上映了三集，合計創造16.91億美元(510.84億新台幣)的票房。近來出品方

  夢工廠宣布推出真人版電影，且確定男主角是梅森塔姆斯(Mason Thames)，





  上月底，眾所矚目的《馴龍高手》真人版卡司名單出爐，男主角「小嗝嗝」由一頭捲髮的

  新生代演員梅森塔姆斯來飾演，女主角「亞絲翠」則是演過《小飛象》、《西方極樂園》

  的妮可帕克，身為電影導演兼編劇奧爾帕克（Ol Parker）和黑人演員譚蒂紐頓（Thandiwe

  Newton）的女兒，





  消息傳到後，影迷們展開熱烈討論：「雖然女主角顏值夠，可馴龍高手不是維京人的

  故事嗎？」、「動畫形象就在那邊，女主角去染金髮吧」、「男主角適合，女主角有點

  微妙」，

  、「這要感謝小美人魚，讓大家對黑人耐受力

  增加了」、




  先前迪士尼出品的《小美人魚》公開女主角「愛麗兒」由海莉貝利(Halle Bailey)飾演時

  ，，對此，海莉貝利透過雜誌的專

  訪回應，坦言

  。



  --


  PTT上不是都說選角選得不錯嗎!!??


  --'
