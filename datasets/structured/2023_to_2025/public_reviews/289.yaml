title: '[好無雷] 馴龍高手-女主選角失敗的佳作'
content: "前無雷後有雷\n \n \n \n傑瑞德· 巴特勒個選角堪稱完美，\n男主演技稍嫌生澀但還可以接受，\n \n女主角就真的是讓人傻眼\n \n\
  \ \n \n女主不是說非常醜，\n \n大概就是倒貼也不要的普妹，\n \n但問題是動畫的設定上女主不是普妹\n \n \n \n然後又頂著一坨不知道是髒辮還是什麼的髮型，\n\
  \ \n每次聽到那些描寫女主多有魅力的台詞出現時就真的超出戲\n \n \n \n我記得動畫裡女主是金髮啊，\n \n真人版為什麼造型弄的像山頂洞人？\n \n\
  \ \n \n一部電影的女主角不見得一定要美若天仙，\n \n很多電影可以藉由劇情去襯托一個女角的魅力，\n \n但馴龍高手並沒有為女主設計這種橋段，\n \n\
  所以顏值有一定的重要性\n \n \n \n整體當然還是瑕不掩瑜，\n\n但是女主整條線都可以砍掉沒差，\n比小隊其它人還沒存在感\n\n\n\n這種選角真的不如砍掉感情線，\n\
  \n把戲份都加到小嗝嗝跟沒牙建立感情上面\n\n\n\n\n\n以下有雷\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n\n\n\n\n另外一點比較出戲的部份，\n\n就是沒牙被主角老爸拖出海找龍穴時，\n\n小嗝嗝說早知道當時殺了沒牙就沒後來這些事情，\n\n\n\n人家沒牙前一秒才冒生命危險救你，\n\
  \n你後一秒說早知道當初就殺了牠？\n\n\n\n我知道你會擔心你爸，\n\n但沒牙怎麼搞的像直接變成你棄若敝屣的家畜？\n\n不能兩邊一起擔心嗎？\n\n這或許是動畫原本的設定，\n\
  \n但我認為電影還是可以修飾一下\n\n--"
