url: https://www.ptt.cc/bbs/movie/M.1548150846.A.561.html
title: '[好無雷] 馴龍高手3-在戲院淚流滿面'
content: '本身就蠻喜歡馴龍高手1還有2

  覺得整體畫風 劇情 都很喜歡


  原本有點小小擔心會不會敗在第三部曲

  好險擔心是多餘的 第3集也是非常好看


  我看的是英文配音版

  有點不是很確定小朋友去看英文版 能不能看懂劇情

  畢竟有些人物講話都有點快

  建議小朋友還是看中文版可能會比較適合


  第3集是故事最終章(這不算暴雷吧?)

  這個系列也算是陪伴我從在學時期到現在過了9年

  還真是不同時期看三部曲都有不同的心情以及心得


  先講動畫本身  第3集絕對是現在動畫科技的極致展現

  比起2進步不少 跟1比當然不用說

  也增加了很多不同類型的場景 從人物風景到各種龍 都做得很細緻



  劇情部分也很好懂  壞人好人都蠻好分的XD

  雖然覺得3跟2有個共同的問題就是有一點點太緊湊

  如果這兩部都多個10分鐘我覺得會比較合適

  (但小朋友要上廁所可能坐不住了也沒辦法)


  夜煞跟光煞各種賣萌  喜歡夜煞的進戲院應該會非常開心


  看到最後幾個橋段

  真的是會哭到一把鼻涕一把眼淚的


  尤其是最後有些場景還跟第一集的相呼應

  整個雞皮疙瘩都起來了

  看3之前可以稍微複習一下這個第一集的片段


  再看3會更有感覺



  只能說非常好看

  真的值得進戲院看


  要我排名三部曲的話  可能是1=3>2


  私心希望馴龍高手可以拿下奧斯卡最佳動畫

  結果明年好像又會碰到當年第一集的對手玩具總動員

  又是迪士尼..又是玩具總動員..看起來是兇多吉少


  不過在我心中  馴龍高手三部曲真的很棒

  他給我的感動勝過很多其他動畫片


  --'
