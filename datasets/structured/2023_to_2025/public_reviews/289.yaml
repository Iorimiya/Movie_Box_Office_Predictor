title: '[負雷] 馴龍高手3-不夠過癮'
content: "雷文防雷資訊頁\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n1.影片名稱\
  \ : 馴龍高手3\n\n2.觀影時間 : 2/8\n\n3.觀影地點 : 日新戲院\n\n4.觀影方式 : 自行購票\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  此區為發文防雷頁\n可選擇性提供上列 1~4 資訊  或不提供亦可\n觀影心得於分隔線下方發布即可\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線\
  \ ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n先說優點\n1.龍鱗甲很帥\n2.那兩首經典配樂有出\n3.有新龍 (可惜沒介紹)\n\
  4.Happy ending (夜光煞寶寶好可愛><)\n\n再來缺點\n1.話講太多\n    尤其雙胞胎妹妹被抓那段...剛開始覺得好笑可是聽到後來會有「他什麼時候要講完?」的感覺...還有很多其他段劇情也是打嘴遁而已\n\
  \n2.兒童不宜的感情線\n    自稱二當家那個角色居然一直想追小嗝的媽媽?!這劇情能給小朋友看嗎...\n\n3.奇怪的人跟人打鬥\n    小嗝明明就斷了一條腿了還硬要用火劍幹架也太尷尬...都能幫沒牙做尾巴了就順便幫自己弄個遠程武器吧@@做把弓騎龍和對方弩對射也很帥啊\n\
  \n4.新配樂沒記憶點\n    感覺第三集比較深刻的還是舊的經典配樂~可惜好像沒有像第二集那種打大boss的大場?\n\n總的來說就是一個結局的感覺，不過中間有一些笑點還算不錯，個人最喜歡前面鋪梗雙胞胎\n\
  最後感謝馴龍高手這部作品~有時間再去追板上有人推的影集XD\n\n\n\n\n\n\n-----\nSent from JPTT on my Asus ASUS_Z01KDA.\n\
  \n--\n我覺得二當家和小嗝算同輩所以追同輩媽媽怪怪的囧抱歉可能我沒見識過隔代戀的關係@@\n1、２的配樂真的很棒很感動~完結篇可惜了...\n嗯嗯上一部就有~只是第三集每次看到小嗝拿近程被對方遠程壓制都覺得很尷尬@@\n\
  媽媽真的正~媽媽的龍也很好看(個人覺得馴龍裡最帥的龍雖然中譯名超怪XD\n嗯啊~嚴格說起來這集爸爸也有出場囧所以覺得尷尬..."
