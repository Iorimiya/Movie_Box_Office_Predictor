title: '[好微雷] 馴龍高手真人版ScreenX'
content: "基本上劇情跟動畫版一模一樣沒有更動\n原本的劇情就很精彩，所以順順的改編完全沒有問題\n不過為了符合政治正確部落裡面硬是增加了黑人跟亞洲人\n\
  但都是一閃而過不影響劇情\n一些搞笑的橋段也都有還原\n各種龍的CG比起動畫版來的沒那麼可愛但更加寫實\n動作的呈現比動畫版來得更有速度感\n練飛跟最後俯衝的畫面非常刺激\n\
  \n這部作品三個畫面佔的時間滿長的，而且飛行畫面可以看到沒牙完整的翅膀\n所以看ScreenX還算合適\n相信4DX跟IMAX也會有不錯的體驗\n--\n\n\
  Sent from \n\n--\n\n\n更正IMAX片段是50分鐘\n\n一模一樣的是劇情，畫面上的呈現還是有差異，實拍的背景真的很壯闊\n還有IMAX、ScreenX的畫面延伸，都是非戲院看不到的\n\
