url: https://www.ptt.cc/bbs/movie/M.1549120070.A.602.html
title: '[好雷]《馴龍高手3》博克人深藏心中的美麗傳說 '
content: '~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  1.影片名稱 : 馴龍高手3


  2.觀影時間 : 1/30


  3.觀影地點 : 信義威秀


  4.觀影方式 : 自行購票



  痞客邦圖文版：



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  《馴龍高手3》是一部美國奇幻動畫電影，由迪恩·戴布洛伊執導，傑·巴魯契、艾美莉


  卡·弗瑞娜、凱特·布蘭琪配音，改編自葛蕾熙達·柯維爾《如何馴服你的龍》，劇情講


  述在《馴龍高手2》小嗝嗝成為博克島族長的一年後，他與同伴時常四處把被人類捕獲的


  龍帶回島上生活，目標建立一個龍和人都能和平共存的世界。某天，「夜煞」沒牙突然在


  島上遇到見一頭母龍「光煞」馬上便陷入愛情，小嗝嗝也竭盡所能想幫沒牙贏得女朋友的


  芳心，不過他們不知道的是，這背後竟是「獵龍者」葛林魔的邪惡陰謀。




  作為夢工廠動畫工作室用來對抗迪士尼與皮克斯的當家王牌，誰也沒料到這種人與動物的


  美妙友情，在小說、電影中早已履見不鮮的題材，竟能在上映後得到各界的一致好評，之


  後推出的兩部續集更維持系列的高水準表現。其中不光是想像力十足的架空世界觀，完美


  以人們對於「龍」的著迷，發展出一段大家夢寐以求的奇幻冒險旅程，其中精彩的特效場


  景運用，加上深刻的故事內容，我想都是觀眾如此為之著迷的主因。




  就我而言，《馴龍高手》系列是近年來個人最喜歡的動畫電影，三部曲的故事架構可以說


  是相當完整，它不只透過人類與龍族的關係，呈現出雙方跨越物種的深厚情誼，從最初水


  火不容、彼此仇視的關係，到慢慢化解仇恨、建立起互信的橋樑，片中小嗝嗝與沒牙所經


  歷的冒險，更是一個孩子逐漸成長茁壯的過程。




  雖說《馴龍高手》三部曲劇情並沒跟原作有太多相關，不過作為動畫片與兒童文學改編作


  品，其故事與所要傳達的意涵並沒有太過複雜。《馴龍高手》小嗝嗝從最初被父親寄予重


  望，最終確立自身所向與目標，並消除兩個種族的隔閡，《馴龍高手2》接納各方來客，


  並學會對自己和別人負起責任，而到了《馴龍高手3》便是把整個系列做個總結，電影以


  沒牙找他朝思暮想的同類為主軸，這看似輕鬆有趣的劇情，但實際上卻是小嗝嗝這幾年來


  最擔心的時刻。




  打從《馴龍高手》開始，小嗝嗝會成為博克島英雄，進而成為族長，絕大部分的原因都是


  他在那次意外中遇到沒牙，而《馴龍高手3》沒牙愛上另一頭白色的光煞，也意味著跟小


  嗝嗝相處時間將漸漸減少，因此在電影後段，原本遇到危機只會「等我找到沒牙，我們再


  來解決」的小嗝嗝便面臨最大的挑戰。《馴龍高手3》的高明之處，正是從《馴龍高手2》


  失去父親這位能夠依靠的對象之後，再次利用沒牙被捕，引發「沒有龍，我們還剩下什麼


  」的這個難題，激起小嗝嗝的獨立自主意志。




  或許對於首集的小嗝嗝來說，這大概是永遠無法通過的挑戰，但《馴龍高手3》他作為一


  位富有愛心的博克島首領，面對要剷除龍族的反派葛林魔，必須對人類與龍族負責的責任


  感，卻使他在失去所有飛龍的狀況下，帶著同伴奮不顧身跳下懸崖，也正是因為有三部曲


  循序漸進的鋪陳，小嗝嗝的角色成長曲線才顯得更有說服力。




  另外，我認為《馴龍高手2》會成功，很大原因在於比起首集開創更為廣闊的世界觀，滿


  足影迷對於龍的想像，不過把視野從博克島向外延伸也引發了不少問題，就像裡頭出現的


  捕龍者「跩爺」，儘管在片尾眾人合力下將他擊敗，不過這也讓人類與龍族付出慘痛的代



  價。而《馴龍高手3》獵龍反派再次現身，也迫使小嗝嗝重新思考人類與龍族之間的關係


  ，以往他總是單純的認為兩個種族一定能在自己努力下在和平共存，但事與願違，貪婪的


  人心卻一再威脅龍族的安全。




  然而最令人揪心與遺憾的是，小嗝嗝在經歷這麼多事件後，最終還是只能得出一個解決辦


  法，既然人們無法確保龍族不受危害，讓他們前往「龍國秘境」才是最好的選擇。如同父


  母面對長大成人的孩子必須懂得放手，《馴龍高手3》面對要追求光煞的沒牙，小嗝嗝予


  以成全，熬夜幫他製作不需要自己操控就能飛翔的尾翼，就因為兩人曾一同度過這麼多美


  好時光，就因為博克島人這麼愛這些飛龍，他們才有辦法在百般不願下跟他們道別，為了


  不讓龍族再受人類侵擾，決定永遠把這些回憶藏在自己心中。




  總而言之，儘管《馴龍高手3》論精采度不及前面兩部作品，但它不光成功為系列劃下完


  美的句點，電影主旋律出現同樣也足以震撼人心。就我個人而言，如果把三部曲視為一個


  「完整」的故事，甚至還差點動搖《玩具總動員》在我心目中第一動畫的地位。因此，大


  家或多或少都能發現文章中有刻意提及前作設定與情節，原因正是我認為《馴龍高手3》


  作為整個系列的最後篇章，其中許多情感與內容都是由前面兩部作品累積而成，博克島從


  最初又冷又偏僻，還會不定時受到「害蟲」侵襲的不毛之地，變成所有飛龍都能無憂無慮


  生活的樂園，最後又終於回歸平靜，雖然地上不再能看到有著巨大翅膀的黑影，但居民心


  裡卻多了許多無法抹去的珍貴記憶。




  《馴龍高手》系列從2010年開始就給我們帶來無數的感動，如今這部經典動畫也終於走向


  尾聲，或許在影迷眼中，必須在《馴龍高手3》跟沒牙和小嗝嗝道別是有些難過，但就如


  同這部電影所講述的主旨「學會放手」，這絕對不是故事的終點，而是另一場旅程的開始


  ，夢工廠已經在片中多次展示他們動畫的製作實力，往後還會有什麼作品登場，實在非常


  值得期待。



  --


