url: https://www.ptt.cc/bbs/movie/M.1549823557.A.DF9.html
title: '[討論] 艾莉塔跟馴龍高手3結局是不是有問題'
content: '艾莉塔前面都很好看

  一直到結尾他最後還去打死亡球賽也太奇怪

  百夫長都幹掉了結果居然去打那個球賽

  就像飢餓遊戲主角如果強到到把守衛輕鬆殺光

  然後還要去玩飢餓遊戲

  讓我真的非常錯愕


  馴龍高手3 感覺真的硬要收尾都忘記前兩集有個關鍵設定是至尊龍嗎

  一個至尊龍就是一個龍巢照理應該很多至尊龍很多龍巢

  結果至尊龍一隻不剩上一集那隻也不見了

  找到祕境裡面居然還沒有至尊龍

  夜煞一進去直接變至尊龍

  而且外面還完全沒有其他龍群他們直接就是最後的龍群


  --'
