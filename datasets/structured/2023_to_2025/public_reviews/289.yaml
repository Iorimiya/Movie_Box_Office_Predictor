url: https://www.ptt.cc/bbs/movie/M.1749900219.A.185.html
title: '[討論] 雷文條款討論 以馴龍高手為例 (內有雷)'
content: "如題 誠心發問\n\n雷文條款寫\n\n\"未上映或在台上映未滿六個月電影劇情心得文章規範\"\n\n但類似這種動畫電影重製 (馴龍高手初次上映15年了)\n\
  \n真人版重拍 極高程度還原原作\n\n關鍵劇情幾乎都重複\n\n這個該如何界定？　我把馴龍相關問題放在最後面　以避免爆雷　\n\n\n\n再舉一個電影超人為例　\n\
  \n重置好幾次了　\n\n但假如就有年輕的新觀眾　從來沒看過任何超人作品\n\n結果被某篇新上映超人的劇情討論文　給　雷到了　該篇作者沒做防雷處理\n\n內容是描述超人害怕某種大家都知道的東西　\n\
  \n原發文者會想　新電影講的那個東西　在最早1978年的電影老早演過了\n\n年輕觀眾不知道 白白就中了這個雷 有點冤枉 也許會影響觀影體驗？\n\n\n\n\n\
  \n\n隔頁有馴龍高手劇情雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n原動畫第一集  toothless被主角繩索發射器捕捉\n\
  \n造成尾翼半斷　\n\n之後又被主角所救　重新學飛　慢慢建立友情\n\n可是他好像從來不曉得自己是因男主角的原因變半殘的吧？\n\n動畫和真人版電影有講到這段嗎？　請知道的大大解答下\n\
  \n--\n   問題就出在這裡啊\n   如果有人討論15年前的動畫劇情\n   會雷到15年後的\"真人版\"馴龍新觀眾\n   你是不是看不懂我說的重點\n\
  \   還有你的符號很醜耶\n   ☑=.= ☒== ☒= = 不要亂用好嗎\n   沒仔細思考板規的是你\n   所以有點狀況外\n   我當然知道只要在標題註明\
  \ \"內有雷\"\n\n    或  裡面內文特別註明 隔頁後有雷\n\n   這是避免觸犯雷文板規最保險的做法  所以兩個都做了\n\n   但針對上映已滿15年　遠超過板規限制上映6個月以內的電影　\n\
  　 你只要不在文章標題上爆雷\n   那麼無論怎麼寫 即使標題內文都未註明防雷文字\n　 理論上都是不觸犯雷文條款的\n\n   這就會形成一種BUG\n  \
  \ 就是我明明在討論15年前的電影\n   完全合乎板規\n   但因為這部15年前的電影\n   劇情＆設定幾乎和15年後 重製的真人版電影 一模一樣\n　\
  \ 那麼沒看過原版本電影 準備進場看真人版的新觀眾\n   就有可能不小心點進來 被大量爆雷\n\n   這樣  清楚了嗎？\n   動畫這段設定幾乎是一模一樣的\n\
  \   沒牙被主角長距離捕捉後\n   隔天主角找到沒牙 然後舉起刀 但刺不下去\n   改為割斷繩子放了他\n   但沒牙由始自終應該不知道主角就是前天夜晚射出捕捉網害他斷尾的人\n\
  \   呃....我已經盡量解釋清楚了 感謝你給這麼多推\n   祝你好好欣賞這部電影\n   我要鑽漏洞何必寫這篇？XD\n　 直接鑽就好了提出來幹嘛\n \
  \  感謝樓上 :)\n   ☑=.= ☒== ☒= =\n   ☑=.= ☒== ☒= =\n   ☑=.= ☒== ☒= ="
