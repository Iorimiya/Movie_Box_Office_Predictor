title: '[情報]沒牙再度回歸！《馴龍高手 3》主角概念圖'
content: '來源：


  沒牙再度回歸！《馴龍高手 3》主角概念圖首度曝光　小嗝嗝長大成人擔任新村長！



  圖片來源：hollywoodreporter.com



  由夢工廠動畫製作的動畫電影《馴龍高手》（How to Train Your Dragon）在 2010 年開啟

  之後，男主角小嗝嗝（Hiccup）與他的坐騎之龍沒牙（Toothless）的搭檔廣受到觀眾喜愛

  。2014 年推出的續集《馴龍高手 2》更在全球熱賣了 6.21 億美元票房，等候了多年，我

  們終於能盼到《馴龍高手 3》在明年回歸大銀幕。就在這周拉斯維加斯授權展上，《馴龍高

  手 3》的角色全新形象圖首度被曝光！


  ▼夜煞沒牙（Toothless）在第 3 集的最新概念照，你是否也能夠在沒牙的臉上感受到歲月

  的痕跡呢？




  圖片來源：@goawayitsmonday


  ▼在《馴龍高手 3》的最新劇情中，將描述已經成為大人的小嗝嗝，終於繼承了維京首領爸

  爸史圖依克的地位，成為博克島上村落的領導人，正當小嗝嗝想要依照自己的理想建立起烏

  托邦時，沒牙卻意外被一隻還沒有被馴服、性格捉摸不定的龍給吸引過去，讓小嗝嗝面臨了

  新的危機。




  圖片來源：@jlassijlali


  ▼《馴龍高手 3》的正式電影名稱叫作「How To Train Your Dragon: The Hidden World」

  第 3 集成為村長的小嗝嗝，不只身形明顯更大，似乎臉型也更方，藉此來展現小嗝嗝被歲

  月改造的痕跡。



  圖片來源：@goawayitsmonday


  ▼小嗝嗝的女友亞絲翠則看起來雙頰變得更加圓潤，身手矯捷的她騎乘著總是看起來相當歡

  樂的暴飛飛（Stormfly），她與小嗝嗝的戀愛是否會在《馴龍高手 3》開花結果呢？




  圖片來源：@jlassijlali


  ▼金髮的亞絲翠以前就是屠龍高材生，同時也相當喜歡冒險。




  圖片來源：@goawayitsmonday



  ▼魚腳司則依然保持著圓潤的身材，駕馭著跟他有著同樣肥圓身材的肉丸（Meatlug），看

  起來相當可愛。




  圖片來源：@jlassijlali


  ▼魚腳司雖然相較之下個性較膽小怕事，但其實他是個對龍群有著高度研究的學霸，對所有

  龍的攻擊防禦能力和速度等屬性都無所不知，卻也常因為他的愛現而被朋友覺得煩人。




  圖片來源：@goawayitsmonday


  最後看到總是驕傲又不服輸的鼻涕粗，依然駕馭著兇猛的尖牙王（Hookfang），自負的他在

  戀愛的道路上則相當坎坷，第一集暗戀女主角亞絲翠，對方卻愛上瘦弱的小嗝嗝，第二集愛

  上暴芙那特，對方卻對於捕龍者艾瑞特是一見鍾情，《馴龍高手 3》是否會為他找一個新的

  對象呢？《馴龍高手 3：隱藏世界》將於 2019 年 3 月 1 日上映，全數的原班人馬都將回

  歸配音




  ————————————————————————


  一直都挺喜歡這一部作品，很期待啊！



  --'
