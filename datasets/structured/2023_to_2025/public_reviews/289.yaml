url: https://www.ptt.cc/bbs/movie/M.1549817195.A.61D.html
title: 'Re: [普雷] 馴龍高手3 '
content: '今天剛帶小朋友去看完...

  趁記憶猶新，稍微回應一下...

  一開始，小嗝嗝確實沒把葛林魔放在眼裡啊！

  所以，葛林魔跑到他家裡時，他還很自豪的以為自己已經喘便便等著他了！

  結果，人家在天羅地網包圍下，輕易突圍，還兼燒了他們整個村了！


  然後就是前後呼應（回憶他跟他老爸及後來跟他女友聊的時候）的順道在村民會議時，提

  出了舉家遷移到龍國秘境這個計畫！

  你前後順序搞錯了！而且後面的重點就是在強調主角的能力...

  從頭到尾，他們都很依賴龍軍團的力量...

  後來就被葛林魔用抓到沒牙這隻至尊龍和光煞，再以光煞要脅至尊龍以控制所有的龍群了

  啊！

  所以，那時候就是他女友跳出來跟他說...

  在還沒有沒牙的時候，他就是一個有能力的人，他並不是因為有沒牙，所以才會變強的！


  然後，就是你講的，幾個人就飛鼠的跳下去打肉搏戰！

  其實，後面還是有靠龍軍團啦！只是這階段是在強調主角群的成長！

  （本來，我自己看...是以為他們會去找龍國秘境的那龐大龍群！想不到居然是幾個人直

  接跳下去囧）

  最後這邊......

  就是要以一個人才能強烈強調出人類可怕的地方！

  單就只是一個殺龍獵人就能把所有的夜煞殺到剩一隻，而且讓他們那麼難應付！

  讓主角感受到縱使他們這樣努力救龍，只要有一個厲害的殺龍獵人出現！他們就疲於奔命

  了！

  所以，這也是最後為何會放手讓沒牙他們躲到龍國秘境去的原因！


  等到人類能跟龍族和平共處的時候，龍族才有可能在出現！


  大概就是這樣吧？



  --'
