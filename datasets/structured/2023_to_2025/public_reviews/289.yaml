url: https://www.ptt.cc/bbs/movie/M.1548805767.A.99F.html
title: '[好無雷]馴龍高手3：不完美的完美收尾'
content: '1.影片名稱 :馴龍高手3


  2.觀影時間 : 2019/01/29


  3.觀影地點 : 今日秀泰影城


  4.觀影方式 : 朋友邀約


  圖文網址:


  【How To Train Your Dragon 3】:不完美的完美收尾


  上映時間：2019/01/30   導演：Dean Deblois


  觀看時間：2019/01/29(今日秀泰特映)


  二刷時間：2019/01/30(IMAX)


  　　2010年【馴龍高手】三刷、2014年【馴龍高手2】四刷，身為系列腦粉期待今年的【


  馴龍高手3】期待了4年半，能夠在上映前一天搶先看到特映會真的要感謝太多人了。看完


  電影的感想：還是超好看啦！改善了不少前一集的缺點，但也多了一些新的缺點就是了。


  真的看完第二集與第三集，才知道當年的第一集究竟有多神！！



  　　【馴龍高手3】的時間設定在【馴龍高手2】結束的一年後，新的敵人出現挑戰Hiccup


  與Toothless，身為族長與至尊龍，他們必須攜手合作，帶領人類與龍族一同度過這次的


  難關。先回答常見的問題，看第三集之前需不需要補前兩集呢？我的建議：「基本上要直


  接看三也是可以啦，但有些地方的情緒與情節可能會摸不著頭緒？」，所以還是建議大家


  先補完前兩集再來看第三集。（腦粉心聲：沒看過前兩集！？神片你竟然沒看過！？快去


  看啊！第三集的彩蛋多到爆啊！）



  　　【馴龍高手3】的核心故事就跟前兩集一樣，藉由Hiccup與Toothless闡述人與龍之間


  的友情，但劇情依舊是以Toothless為輔，核心還是放在Hiccup的成長上。【馴龍高手】


  裡Hiccup貫徹自己的信念改變他人，【馴龍高手2】Hiccup從痛苦中學會寬恕與面對現實


  ，並成為一族之王，在【馴龍高手3】，Hiccup則必須學會獨立，畢竟天下無不散的筵席


  ，他必須學會放手並靠自己的力量領導族人。本次的敘述風格比較像第一集，在故事中穿


  插歡樂搞笑的成分，劇情比較沒有第二集那麼黑暗，故事的走向還算好預測，但可能因為


  節奏的問題，所以有些地方在觀影時其實是有那麼一點突兀。



  　　我個人認為【馴龍高手2】的兩個缺點，就是配角戲份太少，以及結尾的節奏偏快，


  【馴龍高手3】在配角戲份這一點真的是大大的改善，好友們的互動不但大量的提升，利


  用每個人顯明的個性製造笑點，並在不少地方擔任劇情關鍵。與配角相比，Hiccup與


  Toothless之間的互動就明顯比前兩集少了許多，但這一點完全不構成缺點，為什麼？因


  為故事就是要藉此讓Hiccup學會獨立，藉由兩者的分離帶出Hiccup的徬徨，並在沒有夥伴


  的情況下尋找自己的價值。



  　　至於【馴龍高手3】的故事節奏，比起【馴龍高手2】花了大量的時間鋪陳介紹反派


  Drago，這次則是完全相反，開場沒多久就跟你介紹這次反派的來歷與能耐，故事節奏完


  全不拖泥帶水，劇情以很快的速度前進，並讓正反兩方不斷的產生衝突與碰撞，到最終對


  決之前的節奏真的是又快又順，但到了最後對決時，跟【馴龍高手2】一樣的問題又出來


  了，正反最終對決的節奏真是快到不可思議，這個缺點與上一集相比真的是有過之而無不


  及啊，我覺得這必須歸咎於世界觀做的稍為大了一點，這次反派並不是單單一個人，他背


  後還有更為龐大的黑暗勢力，但故事對於這龐大勢力沒有太多著墨，導致他們最後的正反


  對決實在太快太簡單，反派在結尾前的表現都超強，就收尾覺得弱了一點，看完只覺得好


  像可以聚焦在一個人就好？而在對決結束後，這快速的節奏也延續到故事收尾，雖然是劇


  情的高潮，但我還沒能培養最後的情緒故事就結束了，在第三幕的節奏掌握上【馴龍高手


  3】真的太快了。但好家在故事在收尾後，還有一段類似後日談的故事，這段倒是做的蠻


  棒的，Hiccup在這邊幫整個系列做了總結，並讓經典場景再現，多少彌補了前一段的遺憾


  。


  　　對我來說，【馴龍高手】系列經典的兩個地方，就是飛行場景與超神的配樂。飛行的


  部分因為Hiccup與Toothless互動的減少而減少，不像前兩集有經典的飛翔畫面；配樂的


  部分我就真的想抱怨一下了，當年【馴龍高手】經典的地方就在於很多地方完全不說話，


  單靠配樂與畫面就能說故事，第一集的Forbidden Friendship、Roamntic Flight就是兩


  個例子，前兩集的原聲帶我都有購買，這兩集我只要聽配樂，電影的畫面就能浮現在我的


  腦中，但在【馴龍高手3】，我想John Powell可能想打安全牌吧，許多配樂都直接沿用前


  面兩集，電影還是有靠配樂說故事的地方，但因為這次的新角色的配樂比較空靈，導致我


  真的對該場景的配樂沒什麼印象，反派也是，不像【馴龍高手2】的Drago一樣自帶BGM，


  只能說配樂的部分，真的不像前兩集讓我印象深刻，好消息是片尾曲依舊是跟Jónsi 合


  作，這三集的片尾曲真的是經典。



  　　最後聊聊我對【馴龍高手】這系列的心得吧，「完美中的不完美」，這一直是這個系


  列的核心，與前兩集相比，第三集的「不完美」可能比較抽象一點，但我真的非常喜歡本


  系列的這個價值，難過歸難過，但人生不如意十之八九，人生有時就是這麼難不是嗎？這


  次的故事真的把這系列收尾了，以後頂多出外傳吧，這次的結局真的讓【馴龍高手】不太


  可能再寫續集了，遺憾歸遺憾，但我也想不出更好的方式幫這個系列做收尾了，就像本片


  告訴我們的，有時愛它就要放它走啊，讓一個系列結束也是需要勇氣的，感謝導演這邊畫


  下休止符，就讓【馴龍高手三部曲】成為夢工廠動畫工作室的經典吧！



  　　在總結之前，我還是呼籲一下吧，我在看【馴龍高手3】時，能明顯感覺本片想要增


  加【馴龍高手】的經典元素，畫面、故事、台詞、配樂、角色，很多地方如果你看的懂真


  的會會心一笑，所以真的建議你看過前兩集再來看第三集，沒時間看兩集也請看過第一集


  。


  　　最後做個總結吧，【馴龍高手3】的畫面再次進化，比前兩集還美，除此之外，本片


  不但改善了不少前作的缺點，還帶回了不少經典元素，故事雖然老套，但這系列就是有辦


  法把老套故事說得很精采，雖然本片還是有些許缺點，但我想這真的是續集的原罪，整體


  來說，本片就是一部瑕不掩瑜的精采續集、並為這經典系列作了完美的收尾。



  【馴龍高手3】：大力推薦、值得一看再看。


  我知道我前面說過了，但我還是要再說一次，真的看完二&三，才知道當年的一究竟有多


  神！！




  後記：


  1.我2/1原本都請好假了，這次的上映日期為什麼會突然往前2天啊？？


  2.澳洲1月初就上了，我朋友直接在澳洲看完後打電話嘲諷我．．．


  3.我知道很多人不喜歡【馴龍高手2】，但不論別人怎麼說我就是喜歡，喜歡的理由我都


  寫在2的影評裡了。


  馴龍高手1：


  馴龍高手2：


  4.明明是特映會，但影廳硬體的品質真的不佳啊(我覺得我已經很不嚴格了)，【馴龍高手


  3】很多夜間場景，影廳的螢幕真的超暗，看得非常吃力，左側音響的音質也有點可怕，


  就某方面來說已經破壞觀影體驗了…更不要說人多必有白癡，拜託看電影別遲到、先遇上


  廁所行不行…希望二刷IMAX不會有上述的這些問題。


  5.公車海報上的Astrid修圖修過頭，我看第一眼還想說她是誰…


  6.夢工廠動畫的開頭動畫改了！！這系列還是看舊版比較有感覺．．．


  --


  我覺得這有帶出人與龍之間的衝突，所以我很可以接受啦~



  剛看完IMAX，真的讚!



  我倒是很喜歡二XD



  IMAX只有2D喔，但我晚點才要看3D的，所以無法給你建議'
