title: '[普雷]  馴龍高手3  '
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  1.影片名稱 : 馴龍高手3


  2.觀影時間 : 2019/1/31


  3.觀影地點 : 台中大遠百


  4.觀影方式 : 自行購票



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  2010年首集上映的驚艷，2014年第二集的小失

  望，直到2019年完結終章，帶給我的不是印象

  深刻的結局，反倒是中規中舉的表現。


  無論是飛翔、打鬥、情感，都不太如前二集，第

  二集至少還有史圖依克領便當的感人情節，第三

  集老實說很平鋪直敘，沒什麼太大的高潮疊起，

  不管是小隔隔自我認同的劇情，還是與沒牙的不

  捨分離，都沒有做到很讓人入戲，小隔媽說小隔

  還不知道團結的重要，但劇情卻沒有讓全部族民

  為了龍族共同出面坑敵的磅礡橋段，有點可惜了

  能夠做為最高潮的部份。但最後與飛龍們的分離

  到片尾曲的回顧，還是硬將此片拉回一點分數。


  建議看大螢幕、IMAX，某些畫面真的非常美，

  雖沒有很多的飛龍空戰，但還是值得進戲院一看

  ，雖然只有短短8年歷史，但畢竟是最終章（？）

  ，也讓自己對沒牙的故事  一段落吧！









  --'
