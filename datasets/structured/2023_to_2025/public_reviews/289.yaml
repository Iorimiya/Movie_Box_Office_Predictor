url: https://www.ptt.cc/bbs/movie/M.1746231436.A.BB1.html
title: '[新聞] 《馴龍高手》《不可能8》以爆米花桶搏取'
content: '《馴龍高手》《不可能8》以爆米花桶搏取影迷的心




  （大紀元記者葉子杰編譯報導）當地1日，真人版《馴龍高手》以「沒牙仔」的可愛爆米

  花桶來擄獲影迷的心，而《不可能的任務8：最終清算》也推出阿湯哥參與設計的鑰匙爆

  米花桶，將在美國各地影院出售。


  去年11月，AMC劇院策略發展（商品）總監羅布‧貝內特（Rob Bennett）在《時代》雜誌

  的一篇文章中表示，阿湯哥指導即將推出的《不可能的任務8》（Mission: Impossible–

  The Final Reckoning）爆米花桶的設計。如今，據《MovieWeb》報導，該爆米花桶已經

  公開，它呈現膠囊形狀，裡面的鑰匙在兩部最新電影中都有出現。


  《不可能的任務8》爆米花桶：



  Regal連鎖店的官方X和IG帳號分享了這段宣傳片，透露《不可能的任務8》爆米花桶的形

  狀類似塞凡堡號潛艇上核心儲存器的紅色球形外殼，還配備了《不可能的任務7：致命清

  算》（Mission: Impossible–Dead Reckoning，2023）中，阿湯哥奪得兩個半十字形鑰

  匙，這似乎意味著該設計得到了明星的認可。


  此外，Regal也在X上發布真人版《馴龍高手》（How to Train Your Dragon）爆米花桶影

  片，展現可愛友好的「沒牙仔」。官方在貼文上面寫著，忠誠的沒牙仔是個傳奇，牠會幫

  你拿著爆米花。影片顯示，影迷們可以將爆米花安全地藏在那條可愛龍的嘴裡。


  《馴龍高手》爆米花桶：



  《馴龍高手》將再次講述小嗝嗝的故事，他是博克島上一位年輕又笨拙的維京人，他努力

  給熱愛獵龍的島民和父親史圖依克留下深刻印象。但糟糕的是，他與一條可愛又友善的龍

  成為朋友，他還給這條龍起名叫「沒牙仔」。在原版動畫故事中，小嗝嗝和沒牙仔必須聯

  手一起對抗巨大惡龍「紅色死神」。


  近年來，爆米花桶已成為影院的一種熱門產品，越來越受到影迷的追捧。有時，這些爆米

  花桶還為電影提供了行銷效果。所有電影的爆米花桶都與電影中的關鍵元素有關。如《沙

  丘：第二部》（Dune: Part Two）的沙蟲、《死侍與金鋼狼》的金鋼狼、《腦筋急轉彎2》

  的腦中情緒和《神鬼戰士II》的羅馬競技場等。


  --'
