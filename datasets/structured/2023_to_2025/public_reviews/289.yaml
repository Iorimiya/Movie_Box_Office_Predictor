url: https://www.ptt.cc/bbs/movie/M.1685517621.A.98A.html
title: '[情報] 真人版《馴龍高手》男女主角演員確認！'
content: '根據綜合外電的報導指出，真人版《馴龍高手》的男女主角已經正式確認！


  飾演《馴龍高手》真人版「小嗝嗝」和「亞絲翠」的兩位演員都是影壇較新的面孔。「小

  嗝嗝」由去年演出賣座驚悚電影《闇黑電話》的美國新銳演員 Mason Thames 飾演；而「

  亞絲翠」則由曾演出真人版《小飛象》和好評影集《最後生還者》的英國新銳演員 Nico

  Parker 演出，他也是知名實力派女演員 Thandiwe Newton 的女兒。






  真人版《馴龍高手》由曾執筆該系列動畫電影的 Dean DeBlois 執導，這將成為他首部執

  導的電影長片，當然他也會繼續為這部電影編寫劇本。


  真人版《馴龍高手》依然由環球影業出品，預計 2025 年 3 月 14 日正式上映。



  --'
