url: https://www.ptt.cc/bbs/movie/M.1550487798.A.A05.html
title: '[好雷] 馴龍高手3中的彩蛋'
content: "雷文防雷資訊頁\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n1.影片名稱\
  \ : 馴龍高手3\n\n2.觀影時間 : 1/31, 2/8, 2/13, 2/17\n\n3.觀影地點 : 台南南紡威秀(IMAX), 台中新光影城(2D),\n\
  \             高雄大遠百威秀(3D), 高雄大遠百威秀(3D)\n\n4.觀影方式 : 自行購票\n\n§其他防雷說明(非必要) :\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n第三集與第一集相互呼應啊！讓我驚喜連連。\n\
  \nA.\n第一集：最初巨大火炬倒塌，滾落之際摧毀部落不少設施，\n        Hiccup露出不忍直視的連續表情。\n第三集：一開始博克島因為一個意外，大量建築倒塌，Hiccup也是露出類似的神情。\n\
  \n\nB.\n第一集：第一堂屠龍課程結束後，大家坐在大廳檢討時，\n        Astrid說明自己犯了什麼錯，並加一句\"It was sloppy\"\
  。\n第三集：大家一回到博克島，Astrid也是立刻說大家應該進行特訓，\n        結尾仍是\"It was sloppy\"。\n\n\nC.\nSnotlout\
  \ Jorgenson的爸爸Spitelout在哪？ (這點不算彩蛋，但我就是會去注意他 XD)\n\n第一集：Spitelout在Stoick開會計畫尋找龍巢時，就站在Stoick旁邊。\n\
  \        後面他們到達龍巢把Red Death引出來後，Stoick為了替族人爭取逃命時間自己\n        當誘餌，也是叫Spitelout率領族人逃命。\n\
  \n(兩件事足以顯現Jorgenson家族在村中的階級地位，也是電影與影集裡Snotlout特別\n愛挑戰Hiccup的根本原因)\n\n第三集：在一開始的宴會中比腕力輸給Valka。\n\
  \        在部落被Grimmel燒掉後，大家聚集到大廳，\n        Spitelout在門口當守衛指揮大家進入。\n\n\nD.\n有其父必有其子\
  \ XD\n\n第一集：尋找龍巢時，Gobber問Stoick計畫細節，Stoick回答：「找到龍巢，摧毀它！」\n第三集：遷徙時，Gobber問Hiccup計畫細節，Hiccup回答：「一直飛，直到世界盡頭！」\n\
  \n\nE.\n在帳篷中Hiccup跟Toothless依偎的睡相，\n讓我想到Race to the edge S2E1：Team Astrid睡在一起的模樣。\n\
  \n\nF.\n在沙地畫圖這點就不必多說了，經典再現！\n\n第一集Hiccup趁Toothless掛在樹上時畫畫，\n第三集換Toothless趁Light\
  \ Fury掛在樹上時畫畫。\n\n稍微不同的是，Hiccup被Toothless兇幾次就不敢再踩到Toothless筆跡，\n但Toothless被Light\
  \ Fury反兇就龜縮了XD\n\n\nG.\nHiccup趴在Toothless尾巴安裝義尾，\nToothless不安分地動來動去，隨後就很開心地飛起來~~~\n\
  \n不同點在第一集他載著Hiccup，敲響日後患難同當的鐘聲，\n第三集單獨飛離，象徵分別的前兆。\n\n(在 Gift of the Night Fury 中，Hiccup早就做出能讓Toothless獨立飛行的尾翼，\n\
  \ 但當時Toothless希望能跟Hiccup一起飛，自己破壞掉尾巴 ... 感謝sthermit補充)\n\n\nH.\n飛行約會，第一集Toothless藉此讓Hiccup與Astrid湊成一對，\n\
  第三集他又帶著Light Fury飛一次，這一段背景音樂相同。\n\n\nI.\n龍巢只有龍本身找得到。\n\n第一集是Toothless帶著Hiccup與Astrid抵達龍巢，第三集則是Stormfly，\n\
  整集同樣是只有他們兩個人類見過龍巢內的全貌。\n\n\nJ.\nToothless跟Light Fury被抓走後，Astrid與Hiccup單獨談完之際，問一句\n\
  \"So ... What are you gonna do about it？\"\nHiccup回應\"Probably something stupid\"\
  \n\n，第一集Hiccup失去一切後的那段對話也是。\n\n\nK.\n第一集Hiccup在水中為Toothless解開鎖鍊，第三集在空中，這段背景音樂雷同。\n\
  \n\nL.\nTuffnut說自己硬闖過兩次婚禮，爭著當Hiccup的伴郎還為他指點迷津(？)\n\nRace to the edge S2E5: Snoulout\
  \ gets the axe，雙胞胎有提到他們從未參加過婚禮，\nFishlegs好心教導他們婚禮流程，自己假裝新郎、Ruffnut假裝新娘，讓Tuffnut唸誓詞，\n\
  沒想到Tuffnut突然說：「我有婚禮主持人的資格」，就這樣Fishlegs意外地跟Ruffnut\n結婚了，不過結尾時Hiccup他們提到Tuffnut沒有完成主持人受訓，教授教到一半就被\n\
  Tuffnut推下懸崖了，所以婚姻無效，但也讓Fishlegs與Ruffnut產生了一點情愫。\n(我想跟第三集婚禮時他們抱在一起有關)。\n\nRace to\
  \ the edge S6E6: Mi Amore Wing，\n雙胞胎也是超積極地為兩個影集原創角色策畫婚禮，但人家很不屑XD\n\n似乎雙胞胎對婚禮規劃上就是特別有興趣。\n\
  \n另外，第三集主持婚禮的長老Gothi是名喑啞之人，\n若照著影集Race to the edge S2E5: Snoulout gets the axe裡的婚禮流程走，\n\
  Gothi應該要唸以下誓詞：\n\n\"Hiccup Haddock, child of Odin.\n dost taketh Astrid Hofferson,\
  \ daughter of Freyja, to be his betrothed.\n And, by utterance of these words,\n\
  this union may only be broken in the Halls of Valhalla.\"\n\n我的翻譯：\n「奧丁之子，Hiccup\
  \ Haddock，攜手芙蕾雅之女，Astrid Hofferson，\n作為他的伴侶！以上誓言為證，此段結合，僅允許終止於瓦爾哈拉殿堂！」\n\n\nM.\n\
  第一集 Hiccup 單挑 Red Death 與 第三集單挑 Grimmal 時，\n都有從上空飛過，村民們吶喊助陣的喬段。\n\n\nN. (感謝提醒)\n\
  附帶一提，背景音樂也一樣\n\n\nO.\n\n\nP.\n\n在第二集裡，Gobber曾提到他不結婚「有另一個原因」，可能也在暗示同性戀\n\n\nQ.\n\
  結局兩家庭一起在空中翱翔時，最後一起朝太陽飛去，消失在刺眼的日光中，\n隨後劇名才出現在下一個畫面。\n\n第一集結尾也是如此表現，這喬段配樂也是相同的。\n\n\
  \n\nPS.\nAstrid整個很有戰鬥女王的架式，只要對手是人類，她都在玩啊！\n一開始登場悠閒地伸懶腰、用斧柄敲敵人的頭、後面打到一半跟Hiccup耍浪漫、讓船傾斜\n\
  時的邪惡笑容還丟斧頭玩，完全表現戰鬥就是她的生活樂趣。\n\n--\n\n接下來是國外網友的想像、觀點與分析：\n\nA. Hiccup與Astrid的小孩：Zephyr，髮色像爸爸、眼睛像媽媽的小女生；\n\
  \                         Nuffink，髮色像媽媽、眼睛像爸爸的小男生。\n\n   Toothless的小孩：\n   黑皮藍眼那隻，膚色像爸眼睛像媽，對照到Zephyr，推測也是小女生。\n\
  \   白皮綠眼那隻，膚色像媽眼睛像爸，對照到Nuffink，推測是男生。\n   黑皮綠眼最像Toothless的那隻，\n    也許在暗示Hiccup與Astrid將有第三個孩子，棕髮綠眼最像Hiccup。\n\
  \n來源 \n\nB. 為什麼Grimmel會是這系列最後的對手？\n\n因為Grimmel就是另一面的Hiccup，同樣瘦小又有點怪，同樣喜歡發明東西，同樣聰明絕\n\
  頂，連想抓住對方的戰略思維都一樣。\n\nGrimmel選擇殺害遇到的第一隻Night Fury，他的人生走向，就是如果Hiccup在第一集選\n擇殺害Toothless日後的模樣。\n\
  \n這個對手不是為觀眾設計的，是劇組為Hiccup量身打造的，所以會有第二集反派還比較有\n特色的感覺。\n\nGimmel說你沒遇過像我這樣的對手，暗示著Hiccup面對的是他自己，完全反面的自己。\n\
  \n來源 \n\nC.\nLight Fury的出現是來提醒Toothless他是王者，Hidden World需要他的回歸。\n\n當Hiccup與Toothless在一起時，Hiccup把龍族看得比村莊本身重要，Toothless也把陪伴\n\
  Hiccup這件事視為理所當然。\n唯有分開回到各自崗位，才能真正地照顧到整個部落及所有龍族。\n\n另外電影中對Hidden World篇幅不長，因為Hidden\
  \ World屬於龍，不是為人類存在的。\n\n來源 \n\n--\n馴龍系列依角色年紀排列，有：\nHow to Train Your Dragon    \
  \    (電影第一集, Hiccup 15歲)\nLegend of the Boneknapper Dragon(短片, 時間上離第一集不遠)\nGift\
  \ of the Night Fury          (短片, 時間上離第一集不遠)\nRiders of Berk                  (影集,\
  \ 共20集,\n                                 描述博克島大小事, Hiccup 15~16歲)\nDefenders of\
  \ Berk               (影集, 共20集,\n                                 描述博克島與其他部落的關係,\
  \ Hiccup 15~16歲)\nDawn of the Dragon Racers       (短片, Hiccup 18~19歲)\nRace to the\
  \ Edge                (影集, 共6季, 每季13集, Hiccup 18~19歲)\nHow to train your dragon\
  \ 2      (電影第二集, Hiccup 20歲)\nHow to train your dragon: The Hidden World (電影最終章,\
  \ Hiccup 21歲)\n\n\nRace to the Edge 在Netflix上，總共六季，但台灣Netflix目前只有四季。\n前兩部影集就要費心思咕狗看看了。\n\
  龍巢目前看到的都是Light Fury，全黑的也許真的只有沒牙一家了 Q__Q\n這是我第一次看3D，不曉得與以往大家大推的3D比起來如何，\n但我覺得前後層次感有出來，會有角色只是隔著一面玻璃在裡面演的感覺。\n\
  \n我四刷時也是3D，特地坐在第一排，\n有些飛翔的畫面會有座椅浮起來融入其中的錯覺，很驚豔的體驗！\n如果Heather是電影角色，我希望她能跟Eret在一起。\n\
  Heather獨來獨往、愛冒險、擅長臥底，Eret也有隻身一人闖蕩世界的特質，\n兩人也都有一些跟黑社會(？)打交道的經驗，感覺就很合。\n\n至於Fishlegs，我覺得比較偏一個可以訴說苦水的暖男，\n\
  他如果不為Hiccup做事，就是個能讓妻小過著平淡安逸日子的對象。\n\n簡單來說，8+9男友與宅宅老公的概念 XD\n一起宅圖 \nAstrid對一起宅表示\
  \ \n完全被晾在一邊的Astrid \n\n可是Hiccup自己宅時卻有這種福利 \n有這個可能喔~  不過我想Hiccup是從小就暗戀Astrid了"
