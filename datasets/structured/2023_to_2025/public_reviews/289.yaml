title: '[普雷] 馴龍高手3  小心得'
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*



  1.影片名稱 :馴龍高手3


  2.觀影時間 : 今日10：40~12：30


  3.觀影地點 : 南投戲院


  4.觀影方式 : 自行購票






  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  此區為發文防雷頁

  可選擇性提供上列 1~4 資訊  或不提供亦可

  觀影心得於分隔線下方發布即可


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  1跟2我都是下架的時候在電影台看的


  這次3出了就下定決心跟同事買票進電影院看


  劇情  偏普


  對於習慣看電影的人會覺得這部就是照著基本順序走


  演到哪大概都會知道下一幕劇情


  2的時候找到媽媽卻讓爸爸領便當


  大概就是鋪成後面小嗝嗝跟亞絲翠交往的時候有個人可以推一把


  畢竟維京人男生都比較死腦筋(？


  3的收尾算是收的很守規矩


  跟沒牙分離→兩人結婚→帶小孩找沒牙


