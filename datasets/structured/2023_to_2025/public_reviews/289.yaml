url: https://www.ptt.cc/bbs/movie/M.1748366278.A.366.html
title: '[討論] 馴龍高手新test drive配樂試聽'
content: '剛剛發現新版馴龍高手放出原聲帶第一首試聽


  果不其然的放出經典之一的test drive

  但標題做了些微變動 test driving toothless




  這次新版重錄的部份我覺得比起舊版更立體


  以往在背景襯音的部份，這次可以明顯感受到被拉出來靠前


  可以更細緻地聽出有哪些樂器在當底襯

  而大方向上的編曲依舊維持著舊版，並沒有像第三集那樣

  在舊的編曲基礎上擴編，雖然更氣是磅礴

  但整體上來說第三集是有點偏雜的


  這次的就維持地很不錯



  後半段危機的部份，跟以往不同

  不諧和音的部份減少了許多，增加了更多和聲來處理轉折

  這樣的改編我還蠻喜歡的，只是會跟既定印象的場景會搭不太起來


  但這樣反而更讓我期待實際演出手法會不會有些微改變，更好奇配樂要如何插入



  總而言之，這次真人版可以找回原導演跟原配樂

  目前來說我還是樂觀的

  畢竟可以比較不用擔心失去原作核心價值


  最後附上原版test drive，有興趣的人可以反覆聽來比較





  剛好看到配樂訪談，也新增上來




  -----

  Sent from JPTT on my iPhone


  --





  --'
