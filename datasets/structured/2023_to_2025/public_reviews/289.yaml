title: '[討論] 關於馴龍高手3的小臆測'
content: '防雷



















  結尾出現的兩個小孩，官方已說明女生叫Zephyr，男生叫Nuffink。


  至於為什麼叫這兩個名字？


  Astrid 的龍叫 Stormfly，Storm(暴風) -> Zephyr(微風)


  Hiccup 的龍大家都知道叫 Toothless， less -> Nuffink ( Nuffink 就是 Nothing )



  以上純屬個人猜測。


  --'
