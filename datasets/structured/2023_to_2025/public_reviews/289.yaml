title: '[普雷]馴龍高手3-隱藏的伴侶 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  第三集內容平淡就不多講了


  但關於伴侶的設定就很值得一提


  有很成人童話的傾向


  首先是小葛格的媽媽挖卡


  劇中很明顯暗示鼻涕粗對她有意思


  而結尾時挖卡也表達對他的欣賞


  從劇情來看


  鼻涕粗大約跟小葛格同輩


  可能稍微年長個幾歲


  這難道是友達的母親系列嗎...


  況且史圖依克為挖卡守貞那麼久


  結果挖卡一個回歸成為未亡人之後


  居然就想發展新戀情了


  對象是兒子的朋友...


  兒子的朋友還是處男!


  喔買尬


  我真的為史圖依克悲傷


  再來


  從第2集開始暗示的胳膊是老光棍一事


  第3集更加赤裸的展現


  不論是擁抱艾瑞特


  或是捧花被艾瑞特接到


  都在在暗示了甲甲的真相


  艾瑞特看起來大約是20幾歲的小伙子而已


  這組除了又是老少配之外


  同時又是甲甲


  看到這對肌肉棒子的組合


  我真的覺得這系列的編劇基本上已經崩壞


  馴龍高手3


  集年差、未亡人、朋友的母親、奪童貞、甲甲於一身


  說是成人卡通一點也不為過


  啊啊啊


  --'
