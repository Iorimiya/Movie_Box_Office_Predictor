url: https://www.ptt.cc/bbs/movie/M.1749475490.A.84E.html
title: '[討論] 《馴龍高手》真人版 爛番茄開盤'
content: '距離北美上映還有將近一週，但影評已經開始解禁了

  看來環球對這部片的評價是蠻有信心的。



  爛番茄的頁面上雖然統計分數還沒出來，

  但是已經刊出38篇影評，其中6篇是負面評價。


  大致掃了一下影評，

  優點主要就是非常忠於原作，能精準抓到原動畫版的情感和讓人喜愛的元素，

  這部份做得比大部分動畫真人版電影都要好。

  但缺點也是太過忠於原作，連下一幕長什麼樣子觀眾都知道了。


  --'
