title: '[好雷] 馴龍高手最終章我的歲月啊～'
content: '2.觀影時間 : 2/5


  3.觀影地點 : 威秀影城


  4.觀影方式 : 自行購票


  §其他防雷說明(非必要) :


  這集劇情說起來其實滿簡單的～

  雖然我從來不看預告就直接去看

  但音效實在大大加了不少分


  然後光煞這角色很可愛

  鋒頭完全不輸給沒牙～


  這系列終於也到了最終章

  以下雷：





  雖然片長不短

  但我覺得這集的劇情實在很簡單

  壞蛋張力很不夠啊

  一開始講得頭頭是道

  結果要領便當時一點都不振作～


  但當小嗝嗝請光煞去救沒牙時喊出

  "save him" 這邊我有流淚QQ


  流淚的原因是我想起看第一集時

  小嗝嗝那時還是菜比八

  什麼都不會完全拖油瓶

  然後他爸帶著他成長然後又領便當

  一路走來,看著了他的人生經歷

  這一刻,小嗝嗝似乎已經全然茁壯


  尤其印象中這系列至少兩年才新作

  所以至少經歷了我六年時光

  （剛一查發現第一集首映是2010）

  天阿！歷經了我八年的歲月～


  記得當年自己去看第一集時

  朋友還笑說這什麼鳥名字

  完全一點興趣都沒有


  但我去看後

  發現...

  WTF相當好看啊！爽度超夠～

  （印象中好像還有寫心得哈哈）


  第二集到現在的第三集也都沒錯過

  但以原文我也想不出怎麼翻得更好了


  最後,稍微可惜是收尾時間有點急

  如果最後中年後再和沒牙相遇後

  小嗝嗝醒來發現是個美夢

  然後握緊兒女的手更甚珍惜

  最後畫面呈現與沒牙共處的成長時光

  覺得會更好:P



  Anyway,謝謝你馴龍高手我的歲月～







  --'
