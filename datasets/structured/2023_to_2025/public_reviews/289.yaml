url: https://www.ptt.cc/bbs/movie/M.1760978028.A.5DD.html
title: '[新聞] 真人版馴龍高手2下個月就開拍 真人小嗝'
content: '真人版《馴龍高手2》下個月就開拍！真人「小嗝嗝」證實：同樣會高度還原「動畫版」

  第二集




  （圖片來源：環球影業）


  今年暑假檔取得熱烈迴響的《》（How to Train Your Dragon）真人電影，不僅

  觀眾和媒體普遍都給予正面好評，票房更是突破 6.3 億美元，榮登迄今包含動畫版在內

  的所有《》電影之中最賣座的一部。


  負責出資製作及發行的環球影業，更是早就預料到電影的成功，搶在上映前就先排定真人

  版的第二集會在兩年後問世。




  （圖片來源：環球影業）


  但第二集的籌備進度似乎比原本預期地還快，因為飾演真人版「」的梅森塔姆斯（

  Mason Thames）近日接受外媒《The Direct》採訪時透露：「我 11 月 01 日就要進劇組

  開拍了。」


  觀眾目前對真人版第二集最好奇的一點，就是劇情和分鏡是否會如第一集那樣，繼續高度

  和動畫版保持一致，而塔姆斯對此也表示：


  「我不能說和動畫版第二集會有多相似，但動畫版第二集在我心中有很特殊的地位，是動

  畫版三部曲之中我個人最愛的一部，而我真的很喜歡我們目前的成果，所以確實會很相似

  。」




  （圖片來源：Pinterest）


  確定會回歸繼續執導真人版第二集的狄恩戴波尤（Dean DeBlois）導演，在今年六月第一

  集上映前接受《娛樂週刊》（EW）採訪時，也有證實第二集會採取相同策略：


  「我認為環球影業看見巨大的市場價值，就是迎合那些觀看這些電影長大的觀眾們潛藏的

  懷舊情緒，同時也為那些可能還不熟悉這些電影的新觀眾呈現出新鮮的內容。所以我認為

  ，選擇這條路沿著走下去，嘗試在我們所做的每個層面都有所創新，比如深化世界觀和人

  物關係、增強動作場面的沉浸感，這樣就能在不徹底改造電影的情況下帶來更多的內容。

  如果第一集上映後反應良好，我們就會繼續沿著這條路走，用類似的方式拍第二集，講述

  一個人們抱有念舊情懷、同時也有驚喜的故事。」


  文：Joker


  新聞網址：






  --

  可憐哪'
