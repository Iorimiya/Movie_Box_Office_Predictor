url: https://www.ptt.cc/bbs/movie/M.1548931078.A.161.html
title: '[好雷] 2019 馴龍高手3 觀影心得'
content: '~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  1.影片名稱 : 馴龍高手3


  2.觀影時間 : 2019/01/31


  3.觀影地點 : 大遠百威秀 3D


  4.觀影方式 : 自行購票


  5.網誌版：


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  ◎[好雷] 2019 馴龍高手3 觀影心得




  其實看完這個系列，才發現近九年的時光匆匆而逝，


  抱著捨不得的心情，跟這個系列說再見。




  當初第一集在電影院所看到的瑰麗畫面與飛行感動，


  到現在都還印象深刻，這個系列值得在大螢幕上看，無庸置疑。




  多數人認為首集的劇情好，續集的劇情比不上，


  可是看完完結篇，才驚覺第二集真是擔了虛名，


  如果不是前一集讓人物跌落低谷的鋪陳，


  最後的劇情就不會收的如此完美。




  說到劇情，那就先來大略談一下第三集的內容。


  以下是大雷，還沒看的人千萬忍住，請避開劇透。




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~












  以下圖片取自 IMDB：




  一開始是救龍的大場面，Hiccup 和 Toothless 聯手出擊。




  這次的壞人 Grimmel，擅長毒液麻痺，


  讓人訝異的是他的金髮與吃蘋果的模樣。




  本集的女主角出現了， Light Fury，Astrid取的名字。


  一出場就很神秘，但編劇一開始就告訴我們，


  她是壞人放出來，目的是要來引誘 Toothless。




  沒牙做單身狗（貓）這麼久，期間還要看 Hiccup 和 Astrid 談戀愛 ，


  與其他龍族伙伴們求愛放閃，連觀眾看了也深覺不忍，


  編劇當然一下子就讓牠迷上了美艷性感兼之難以捉摸的 Light Fury。




  電影裡頭說，夜煞的一生只有一個伴侶，


  沒牙既然愛上了日煞，牠和 Hiccup 的好感情會有所改變嗎？




  在壞人的威逼下，Hiccup 又發揮他的專才，不按牌理出牌，


  帶著維京人舉家遷移，希望能找到傳說中的 Hidden World。




  沒牙有了女朋友，也愛起打扮來，Hiccup 幫牠穿上了更強的（把妹）裝備。




  這期間曲曲折折，Hiccup和Astrid 動身前往尋找 The Hidden World，


  本來以為很難，沒想到在Stormfly（爆飛飛）的帶領下，很容易就發現了。




  龍界裡貌似還有其他日煞？！


  原本以為沒牙會在這裡跟原本的老大打一打，


  結果完全不用，毫不費力就拿下了 Alpha 的位置。




  一開始鋪陳日煞是壞人那邊放出來勾引沒牙，


  原本懸著一顆心，想說好虐，沒牙好可憐。


  結果日煞還不錯嘛，本身除了會隱形，還教導沒牙使用閃電雷劈隱匿技能，


  一點都沒有女特務的樣子，那壞人是有什麼底氣放她出來並控制她的呢？




  沒牙在龍界得到 Alpha 的位置後，日煞也認可了沒牙，


  戀情終於開花結果，觀眾鬆了一口氣，


  還暗暗為壞人想，這下子該怎麼玩下去咧？




  一陣混戰後，壞人輸了，Hiccup 整集都在思索的糾結終於有解了。


  It''s time to say goodbye.




  多年後的鏡頭，Hiccup 長了鬍子表示年紀有所增長。




  劇情就別說太多，看過的人就知道，很多都要自己去內化才能吸收。


  因為才看一次，還有許多看不明白的地方，


  應該會再去刷 IMAX，看仔細點，


  這次觀賞 3D 還不錯，但因為廳小可惜了。




  再來說說本系列一些富於特色的配角們。


  特夫這次扮演小嗝嗝的戀愛結婚指導，


  洛芙則陷於不知該選猛男鼻涕粗還是暖男魚腳司。




  比較詭異的是鼻涕粗居然對小嗝嗝的媽媽產生興趣，


  還把瓊恩雪諾 Eret 想成競爭對手。小嗝嗝的媽在劇情中，


  感覺不知是撩還是鼓勵著鼻涕粗，難道真想替小嗝嗝找個新爸爸？


  觀眾光想那畫面就會打冷顫耶。




  魚腳司本集擔任龍族保母，最後放手雖然不容易，


  不過他應該也算脫魯了，喜事一件。




  亞絲翠這次幫夫幫很大，女王氣場制霸，


  新娘造型又超美，得妻如此夫復何求？




  片中也討論到男女主角結婚安定下來的問題，


  跟沒牙與日煞形成對照。




  而 Hiccup 在第二集犯了許多錯，這一集很明顯思慮更加縝密，


  更有一個族長的樣子。雖然僅憑一個傳說就帶著族人舉家遷移有些冒險，


  但很多方面都顯示他成熟很多，懂事很多，三集的故事完整交代了他的成長。




  就如這張海報所顯示的，成熟的他與當年的他，


  兩相對映下，有許多情緒夾雜在裡面，看完的感覺是很難以言喻的。




  喜歡第一集的人，會覺得第三集還不錯，收的很好，


  不喜歡第二集的人，還是推薦第三集，


  會有感種 catharsis （情感宣洩）之感。




  動畫電影在台灣一向不是太熱門，


  我問過朋友為何不愛看動畫電影，他們回說，


  都花錢看電影了，要看當然要看人演，誰要看人造的動畫。




  或許動畫也是很吃電波的，或許有些動畫在電視上看看即可，


  但馴龍高手一定要去電影院看，才能得到最好的觀影感受喔。


  --'
