url: https://www.ptt.cc/bbs/movie/M.1758295681.A.FED.html
title: '[  超爽雷] 4DX 3D 馴龍高手'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  超爽雷，幾年前已經看過動漫的第一集了，劇情差不多忘了七八成，所以這次再去看還是

  有新奇感，超愛沒牙!!


  4DX 的《馴龍高手》是 3D 的，一開始看因為有配戴眼鏡所以不太習慣，後面找到甜蜜點

  就很棒了，比起純 2D 來看，飛行跟戰鬥的畫面還是要從 3D 展現才是最棒的，搭配晃動

  的椅子真的很棒~

  但那個椅子吹氣我就不太懂了 XD 感覺有點多餘哈哈，噴水的部分也是偏少，並不至於到

  會影響觀影體驗，噴霧的部分算比較少，我猜只有前三排會有比較明顯的效果吧，超過前

  三排就沒有什麼感覺了，主要戴上 3D 眼鏡迷霧的效果本身就不錯，霧氣只能算是畫龍點

  睛（前三排）。


  椅子真的會有打人的感覺~~

  晃動程度遠比 DBOX 還要高，甚至是真的會有點被晃出去的感覺，常常看到一半會需要調

  整坐姿 XD，飛行的時候真的超爽的，不只椅子晃動，連旁邊的風都會變強很多，很像是

  真的跟著一起飛行很棒，4DX 看《馴龍高手》真的不後悔，劇情也很棒。


  劇情簡介：

  主角是島上唯一一個不會屠龍的維京人，老爸身為族長即便愛兒子但還是會失望，族人也

  幾乎都看不起主角，認為他就是累贅。開頭的戰爭，小嗝嗝為了證明自己有作用，於是把

  自己的設計砲台推出去射擊，雖然真的打到了一條龍，但也因為被巨龍發現導致一連串的

  屋子倒塌，然後羊群被捕捉走。身為族長的老爸覺得很失望，命令小嗝嗝的師傅好好看著

  小嗝嗝，不要讓他亂跑，結果小嗝嗝馬上就跑出去找他打到的那條龍。結果真的是一條夜

  煞，不過心軟的小嗝嗝還是沒辦法下得去手殺掉夜煞，就讓它飛走。後續便是族長去找龍

  穴，然後留小嗝嗝在島上參加訓龍課程。


  後來小嗝嗝去找夜煞，經過一番波折終於跟他當上朋友，也幫他取名叫做沒牙。因為跟沒

  牙的相處對龍的特點了解更多，在課程上表現優異，讓鎩羽而歸的父親非常開心，但後來

  才發現小嗝嗝並沒有達成他心中的期望，反而想要跟龍當朋友，也意外從小嗝嗝的口中得

  知了龍穴的位置，把沒牙綁在船頭出發準備要去佔領龍穴，把龍趕出去。到了才發現事情

  不是自己想像，馬上就被龍的女王秒殺。幸好後續小嗝嗝跟他的夥伴騎著巨龍過來救援，

  後面靠著沒牙跟小嗝嗝同心協力才打敗女王。後面雖然少了一隻腳踝，但也因此得到全族

  人的支持，族人也因此改變行為，大家都養了一隻龍的寵物，整體和氣融融。最主要的還

  是看到老爸願意認同兒子，中間雖然說有很多固執堅持的部分，但願意認錯的老爸也是非

  常少見，能夠讓群族做出改變真的太難得了。


  整部劇情算是很棒的，除了女主角的態度轉變得比較快之外其他都很讚~

  真人版的選角也都很棒，演得也滿到位的，是很值得一看的真人改編電影，尤其是 4DX

  版本。

  整體的動畫品質算很好，劇情也沒有做出太多改變，有看過動畫的人一定也看得懂在演什

  麼，值得推薦!!



