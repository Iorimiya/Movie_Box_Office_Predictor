url: https://www.ptt.cc/bbs/movie/M.1549450540.A.DD4.html
title: '[好雷] 馴龍高手3 簡短心得 (有劇情雷)'
content: "雷文防雷資訊頁\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n1.影片名稱\
  \ :馴龍高手3\n\n2.觀影時間 : 剛剛\n\n3.觀影地點 : 威尼斯\n\n4.觀影方式 : 自行購票\n\n§其他防雷說明: 角色名字記沒有很清楚。請原諒><\n\
  \n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n此區為發文防雷頁\n可選擇性提供上列 1~4\
  \ 資訊  或不提供亦可\n觀影心得於分隔線下方發布即可\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n\n\n一、那個反派提到他沒有把自己的龍當成同伴的時候，我超驚訝。\n那些龍對他來說只是工具，然後那些工具龍也對自己的同伴能下得了手......\n反派認為他的龍既不是同伴，也不是龍，只是屠龍的工具，直接異化（使對象的行為與自\n\
  身的意義背道而馳）了他的龍身為龍的本質。\n\n二、沒牙跟他女朋友比起來好扁，他女朋友的皮膚比他細滑好多（沒牙臉上有點疙瘩），\n個性超傲嬌，身為女孩子的個性有做出來。\n\
  \n小嗝嗝說：\"沒牙不能只要有我就好嗎？\"的時候我笑出來......XD\n（我看了很多本本了......= =　而且HTTYD的本以前真的很多-.-）\n\
  \n我甚至覺得小嗝嗝摔下去那一段，利用的就是光煞身為女孩子的那種細膩心理，才會說：\n\"我就知道你一定會回頭的。\"（馴服母龍的過程，茶）\n\n\n三、小嗝嗝長大真的越來越帥。\n\
  \n他有提到身為博克島人的身份認同，以及結局提的，對龍的認同。\n對小嗝嗝而言，只要是願意與龍和平相處的，就全部都是所謂的博克島人。也就是說，觀\n眾只要認同與龍共同生活的理想，也可以是博克島人，是主角的同伴，結局也為龍還沒有\n\
  在現代滅絕，舖了伏筆。\n\n\n四、夜煞跟光煞的中文翻譯還有英文名字都取得好好，英文諧音，中文義都有對照到。\n\n從進入龍之秘境開始，電影就狂舖放生梗，這部的本質就是放生，反派只是一個催生放生\n\
  、讓主角心靈成長的過程與引子。（還直接送一條母龍給沒牙，根本血虧ＸＤ）\n\n放生的一大意義也是為了讓主角克服心魔，主角之所以不願意與青梅竹馬結婚，就是因為\n\
  有本質上的自卑（可能也和他跛腳了有關，他朋友又一直說他是肉腳，幸好最後那個人不\n是伴郎= =）。\n\n讓沒牙離開主角是一個重要的過程，讓主角實踐小時候他爸跟他說的話（愛的本質就是犧\n\
  牲），只有真正做到才是真正的理解（王陽明所謂知行合一嘛），同時開始活出自己的人\n生，只有自己過活才會讓主角感覺自己可以獨立，也才真的能擔負身為族長的職責，最後\n\
  他朋友（就是前面毒舌他那個）也才真正認同他，認為他配得上女主角。\n\n結局最後主角跟女主角生三個小孩，沒牙跟他老婆生三個，其中兩個小孩都是白肚皮，有\n一隻是白色的超可愛。\n\
  \n兩個家庭居然意外重逢，感覺之後應該也能常常在一起，但就是屬於自由見面、見不見看\n緣份，而不是本來那種畜養、家畜、工具的感覺，而是平等的關係。\n\n本來我看到放生的時候差點傻眼，但幸好沒像神奇寶貝那樣亂放生，這放生是有意義的，\n\
  主要是為了恢復龍與人類之間的平等，以及讓龍能幸福快樂地生活在一起，免受人類的迫\n害。\n\n\n在龍之秘境裡，看到所有的龍臣服於沒牙那時，小嗝嗝就已經下定決心，他覺得與其讓沒\n\
  牙在人類的村子裡受宰制，不如讓牠回來當萬龍之王，這才是牠配得的生活。\n\n小嗝嗝說：\"人類的世界不配擁有牠。\"\n一、不能給牠牠該有的榮耀與自尊，二、不能給牠牠應該享有的安全與安穩。\n\
  \n何況龍之秘境的環境完全不適合人類居住，沒有陸地可以走路，小嗝嗝在真正進入龍之秘\n境以後，就體會到自己的想法是天方夜譚，才會對沒牙說：\"我一直讓你去實現我的夢想\n\
  ，但現在我該讓你去實現你的夢想。\"原因是因為他真的愛沒牙。\n（兄弟、朋友上的愛，真的不是BL-.-　雖然我本跟圖看很多）（茶）\n\n\n五、暴芙根本是這一部的笑點擔當，每次她在耍花癡，全電影院都在笑，不過這次她真的\n\
  很豬隊友，要不是男女主角＋男主媽媽太強，她一定被罵爆。\n\n\n結論：\n\n很適合過年全家一起禁去電影院看的勵志好片，角色很美型，女主角超級堅強（近年來少\n\
  數看到女主角，感覺非常喜歡的一部片，人美心善），畫面很美。\n\n我在威尼斯看的，還有環繞音效ＸＤ（有被從後面發出的音效嚇到）\n\n尤其是劇情，細細回想其實很流暢，主支線分明，劇本真的是很不錯，推薦給各位，基本\n\
  上不會失望的。\n\n\n\n\n\n\n\n\n--\n　真三國無雙的周公瑾與程德謀祝各位大大新年快樂喔\n　本圖P站\n　周瑜與司馬師的勇者夥伴\n　2018年繪圖歸檔\n\
  　主活動巴哈小屋\n 個人繪圖委託募集中，詳情請看本文件\n\n--"
