title: '[新聞] 《馴龍高手》團隊打造最強片《宇宙特攻隊'
content: '《馴龍高手》團隊打造最強片《宇宙特攻隊》踢球救地球



  2021-05-07 21:44聯合報 編譯張佑生／即時報導


  拯救地球，踢出新宇宙！打破疫情苦悶，俄國重啟戲院的第一部大片《宇宙特攻隊》（

  Cosmoball）挾帶高期待度，上映首周榮登票房冠軍，由俄國國寶級特效公司Main Road

  Post與曾參與多部好萊塢電影《馴龍高手》、《變形金剛》、《蜘蛛人》的動畫團隊，耗

  時3年、斥資近3億台幣共同打造，華麗的戰鬥場面與超狂視覺特效，年輕的超級英雄們為

  了捍衛家園，一同並肩作戰踢爆「宇宙球」，抵禦銀河系面臨的巨大威脅。近期片商釋出

  台灣版海報與預告，影迷直呼身兼戰艦功能的外星生物好萌：「好像《壞壞萌雪怪》！」

  科幻冒險電影《宇宙特攻隊》娛樂性十足、適合闔家觀賞，即將於6月4日在台上映。


  電影故事設定在未來2071年在銀河戰爭之後，月球被毀，地球上的氣候改變，莫斯科變得

  像是巴西一樣炎熱，被雨林覆蓋，各種族及文化共存於陽光普照的街道上。在地球的高空

  上盤旋著一輛巨大的宇宙飛船──這是舉辦「宇宙球」的專屬體育場，「宇宙球」是一種

  風靡世界的新型態的足球運動，以極高的速度及驚豔的視覺著稱，全世界都為之著迷。主

  角安東為了生病的母親，加入地球隊成為球員之一，學習如何與踢球必備的變身機器「夥

  伴」連線，意外發掘了自己神力，然而同時，背後不為人知的黑幕也隨著一場接一場的比

  賽逐漸露出，每場球賽都左右著地球的命運。


  曾執導俄羅斯版「300壯士」的動作鉅片《怒戰天下》，在最新力作《宇宙特攻隊》身兼

  導演、編劇與製片人的山尼克．費茲夫（Dzhanik Fayziev）表示，期望製作一部大人小

  孩都喜歡的家庭電影：「我們的目標是創造一個充滿驚喜與活力的世界觀，打造科幻現實

  都沒有挑戰的事物。」並提及自己被宇宙、外星生物、太空旅行題材深深吸引：「哪個小

  孩沒有夢想過擁有超能力同時玩著喜歡遊戲？」電影成功結合世界狂熱的足球運動與英雄

  電影超能力，締造一部寓教於樂的科幻佳片，導演坦言要完成電影十分不容易，需要龐大

  資金與技術投入，挑戰當今俄國影史從未達到的製作水平。


  美國版權由曾發行過《哪吒》、《刺客聶隱娘》、《計程車司機》、《少年的你》等多部

  優質電影的發行商Well Go USA在北美發行上映，Well Go USA總經理Doris Pfardrescher

  表示：「引人入勝的故事情節、一流的視覺特效和精妙的編排，令人讚嘆的家庭娛樂科幻

  電影，能夠吸引從運動迷到各個層面的所有人。」「很少有這種跨類型的題材如此有吸引

  力，《宇宙特攻隊》做到了，而且做得很好。」國外網友也給予五星好評，大讚特效宛如

  《艾莉塔：戰鬥天使》：「一部很棒的科幻超級英雄冒險電影！」




  新聞網址：





  --'
