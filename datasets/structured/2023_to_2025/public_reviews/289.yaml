title: '[好雷] 馴龍高手(2010)─解析〈試飛〉一節'
content: "大家好，\n\n以上是作曲家John Powell為《馴龍高手》製作的電影配樂，\n\n幾乎是電影主題曲等級的〈Test Drive〉。\n\n\
  雖然在電影中使用這首配樂的段落無非是希望觀眾\n\n好好享受畫面與音樂所帶來的感官刺激，\n\n但其實這段劇情的敘事結構也相當完整，亦有許多細節可以賞玩，\n\n\
  因此寫了這篇解析跟大家分享，也請多多指教了。\n\n\n\n\n\n由於〈試飛〉的劇情真的非常簡單，\n\n就是大家所理解的那樣，看似沒什麼好解析的，\n\n\
  所以本文會著重於講述細節、前後劇情的呼應，\n\n以及與2025年真人電影版相互對比等，\n\n因此別緊張，不用正襟危坐，因為我也是隨口漫談而已；\n\n另外，其實本段只有一個暗示，但，該怎麼說呢……\n\
  \n反正嘛，既然導演都敢呈現了，那我就敢說。\n\n那麼，以下開始解析：\n\n\n\n\n\n\n\n\n一、起──忐忑\n\n\n\n\n\n經過好幾個月的試誤後，在討伐龍的船隊歸來的這天，\n\
  \n小嗝嗝和沒牙第一次放膽去海岸邊試飛。\n\n一開始，空中的一人一龍都顯得忐忑不安，但幸好，\n\n小嗝嗝做了飛行小抄，對照著小抄調整著他研發的飛行系統，\n\
  \n或許還能提供點依靠及安心感吧。\n\n總之先飛看看吧，在第一個轉彎時，有個小細節，\n\n小嗝嗝檢查了他的飛行小抄是否牢固，其實埋了個伏筆。\n\n繼續飛，小嗝嗝還回頭了數次，不斷確認義尾翼的狀況，\n\
  \n心懸著，還是進行了下一項嘗試：俯衝，並貼到海平面上飛行，\n\n在通過海蝕門前，鏡頭帶到兩位主角的特寫：\n\n沒牙已意識到這套飛行系統有用，對比著小嗝嗝仍抱持著不安。\n\
  \n於是他們通過了海蝕門……\n\n\n\n\n\n\n\n\n二、承──挑戰\n\n\n\n\n\n「好！這有用！」\n\n當小嗝嗝說出這句話時，他老兄已經慢了沒牙整整7秒察覺，\n\
  \n但意氣風發，心中的不安也悄悄卸下了；\n\n然而，得意不到幾秒，小嗝嗝駕著沒牙撞到了海蝕柱，\n\n不到五秒鐘，又撞到了第2次，\n\n「○娘賊！」──沒牙彷彿暴言說出了這句話，\n\
  \n順勢用耳朵拍了小嗝嗝一記耳光，\n\n小嗝嗝自知理虧，做錯事情的話就會被打，\n\n就是這邊所要表達的，其實也是一個伏筆，詳後述。\n\n至於在真人電影版，沒牙其實也有要打小嗝嗝耳光的動作，\n\
  \n只是沒有打到而已，或許是想要淡化暴力的描寫吧，\n\n畢竟這部電影應該會有很多家長帶小孩來看。\n\n總之，再次調整飛行系統的位置，再下一項嘗試，\n\n\
  小嗝嗝拉起了龍鞍，沒牙也順勢仰首升空，\n\n越飛越高，持續挑戰著地心引力，持續挑戰著他們的極限，\n\n太久沒翱翔的沒牙相當亢奮，小嗝嗝也沉浸在凌空的快感，\n\
  \n一切都很美好，直到──\n\n強風，吹走了飛行小抄，誘使小嗝嗝，分心去抓，\n\n一時間，卻也失去了，對於飛龍的控制，\n\n所以，當他們來到了世界之巔，因為扣環設計的缺陷，\n\
  \n接踵而來的，小嗝嗝整個人騰空，而失去引導的沒牙，\n\n就這樣，他們，只能依循著自然法則──\n\n\n\n\n\n\n\n\n三、轉──墜落\n\n\n\n\
  \n\n傳說中，伊卡洛斯無視父親的警告，\n\n使用蠟製的翅膀越飛越高，直到太接近太陽，\n\n使得羽翼融化，而從天上墜落了下來……\n\n\n\n\n\n小嗝嗝和沒牙從天空墜落，\n\
  \n驚慌失措的沒牙，在自由落體的狀態下，\n\n自始無法保持著自身姿態的穩定，\n\n就算小嗝嗝想要靠近補救，也無濟於事，\n\n更甚著，還被旋轉的沒牙用翅膀又打了一記耳光，\n\
  \n登登，伏筆回收了，這裡也是一樣的意思：\n\n只要做錯事情就會被打，哪怕沒牙是無心的，\n\n順帶一提，真人電影版再被打一次的這段就直接被拿掉了。\n\n\
  只不過，這記巴掌確實有當頭棒喝的功效，\n\n它打醒了小嗝嗝，好讓他冷靜以對，\n\n改用嘴巴叼著飛行小抄，也安靜了不少，並在兩手並用下，\n\n總算抓到了龍鞍，沒牙也振奮地叫了一聲，\n\
  \n扣好扣環，取回了主導權，小嗝嗝用力地拉起了龍鞍，\n\n沒牙順勢張開了牠的雙翅，卻也沒減速多少，\n\n只換來了更多沒牙驚恐的表情包。\n\n而前方就是礁岩地障，又看了一眼被風吹弄的飛行小抄，\n\
  \n危機尚未解除，小嗝嗝正面臨著生死抉擇……\n\n\n\n\n\n\n\n\n四、合──一體\n\n\n\n\n\n接著，可說是一連串的直覺反應了。\n\n\n\
  \n\n\n小嗝嗝想也沒想，直接將一開始視為救命符的飛行小抄向後一扔，\n\n蛋雕它！在這種生死存亡之際，也沒時間查閱了，\n\n於是腎上腺素爆發，只憑藉著自身高超的技術跟敏銳的直覺，\n\
  \n調整飛行系統，邊擺動著身子，帶領著沒牙，\n\n高速穿梭在礁岩陣中，此時人龍合為一體。\n\n這段真的精采絕倫！在這種高速下，\n\n要是撞到礁岩的話，可不是被打一下耳光就能解決的，\n\
  \n但小嗝嗝辦到了，通過了這次被逼到極限的危機，\n\n想必往後他操控飛行的技術會大幅進步吧，\n\n技術正是如此，唯有在不依靠其他外來的輔助，才能算真正熟練，\n\
  \n難怪在危機解除後，雖還驚魂未定，但也振奮地大叫了一聲。\n\n\n\n\n\n另外還有一個亮點是沒牙，這我一定要提，\n\n穿梭在礁岩陣，沒牙屏氣飛行的樣子真的好可愛喔，\n\
  \n一副「我是誰？我在幹嘛？」的表情，真是太棒了！\n\n但我認為他們能度過這次危機，沒牙當然也功不可沒，\n\n除了信任小嗝嗝，依循他的引導外，\n\n某方面也要仰賴牠野性的直覺以及肌肉的記憶，\n\
  \n在極短的時間做出正確的反應，才能千鈞一髮逃出生天。\n\n\n\n\n\n於是，一人一龍毫髮無傷地飛越礁岩陣，\n\n搭配激昂振奮的配樂，心中的悸動，實在難以言喻，\n\
  \n本段落也即將邁向尾聲……\n\n\n\n\n\n……暫停，以為結束了嗎？怎麼可能啊。\n\n提醒一下，接下來，若是不想壞了本段落美好的印象的話，\n\n那還是趕快按上一頁離開吧。\n\
  \n\n\n\n\n……\n\n\n\n\n\n……\n\n\n\n\n\n……\n\n\n\n\n\n嗯，確定嗎？\n\n很多事情要是知道的話，就回不去了喔，\n\
  \n好吧，如果想繼續的話，那麼──\n\n\n\n\n\n\n\n\n五、超（展開）──「爆點」\n\n\n\n\n\n「耶──！」\n\n小嗝嗝振臂高呼，在完成壯舉之後，沒想到沒牙也回應了──\n\
  \n牠從嘴巴噴射出了龍火，搭配著一臉超爽快的表情……\n\n\n\n\n\n……嗯？\n\n──看到這裡，我眉頭皺了一下。\n\n\n\n\n\n接著那發龍火在前方不遠處爆炸，小嗝嗝馬上傻眼，\n\
  \n但重點不是他，重點是此時沒牙的表情，這才是爆點──\n\n牠正滿臉享受著射出龍火後的餘韻……\n\n\n\n\n\n……啥？\n\n──我的嘴角又抽動了一下。\n\
  \n\n\n\n\n……不會吧，我沒看錯吧，我確定又倒帶重看一次，\n\n腦海閃過一堆念頭，但全都指向一個答案，\n\n對，各位觀眾，這是──\n\n\n\n\n\
  \n性暗示，沒有錯。\n\n\n\n\n\n哈哈，畢竟沒牙是隻可愛的小男生嘛，\n\n是隻血氣方剛的年輕夜煞，又是隻具有七情六慾的野獸，\n\n而且剛剛才經歷了生死關頭，生命的本能就是這樣嘛……\n\
  \n──我到底在說什麼啦！煩耶，導演到底在想什麼啦！\n\n但好消息是，真人電影版這部分完全被刪掉了，\n\n只能說幸好導演也還算有自知之明啊，\n\n畢竟這部電影應該會有很多家長帶小孩來看嘛，\n\
  \n不然沒牙把小嗝嗝射得滿臉都是，這不曉得怎麼跟小孩子解釋齁。\n\n\n\n\n\n什麼？我想太多，在胡言亂語些什麼，\n\n那好，我再加碼，今天沒人能阻止我繼續揭露本片的黑歷史──\n\
  \n\n\n\n\n〈試飛〉結束後，切到下一幕更荒謬更好笑，\n\n場景帶到一人一龍在海岸邊休憩，\n\n小嗝嗝一臉呆若木雞，被龍火射得滿臉都是，\n\n然後一旁的沒牙就吐出了半條魚要給小嗝嗝吃，意思是：\n\
  \n「謝謝你讓我爽到，這是給你的獎賞！」\n\n哈哈，畢竟白嫖是不對的，這點連畜生都知道啊……\n\n──搞啥啦，我到底看了什麼啊！我幹嘛要看懂這個啊！\n\n\
  當然，這整段在真人電影版都通通被刪掉了，\n\n因為太難解釋了，所以乾脆不演出來了，\n\n偉哉啊！導演也會心虛呢，早知如此，何必當初啊！\n\n\n\n\n\n\
  \n\n\n結語：\n\n〈試飛〉在《馴龍高手》中是個令人振奮，\n\n簡單易懂，精彩無比，具標誌性的段落，\n\n其起承轉合超的敘事結構完整，雖然有很黃很暴力的成分在啦，\n\
  \n但在2025年真人電影版全都修正了回來，使得本段更臻完善；\n\n本段落讓小嗝嗝與沒牙之間的羈絆更加堆疊，\n\n訴說著博克島上第一位維京人成功駕馭了飛龍，\n\
  \n也堆疊了劇情，引燃了接下來鬥競場上本作最大的衝突點。\n\n好了，解析到此，都只是些個人的想法，\n\n可能也讓某些東西崩壞了，但還是謝謝各位閱讀到這邊了。\n\
  \n\n\n--\n                                  11/08 15:24"
