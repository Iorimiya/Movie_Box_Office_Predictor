url: https://www.ptt.cc/bbs/movie/M.1549617489.A.B35.html
title: '[普雷] 馴龍高手3 適得其所的平淡句點'
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  1.影片名稱 : 馴龍高手3


  2.觀影時間 : 2/8


  3.觀影地點 : 拒答


  4.觀影方式 : 自行購票


  夾銗L防雷說明(非必要) : n刷等其他說明請於此區說明....可留空




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  此區為發文防雷頁

  可選擇性提供上列 1~4 資訊  或不提供亦可

  觀影心得於分隔線下方發布即可


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  又一部曾造成全球大熱的動畫系列劃下句點


  Hiccup跟Toothless互相依存的緊密關係終於在這一集演變為更深層的聯繫


  再見並不是結束，但人類與龍族無法在確保彼此的安危之下和平共處


  因此只能讓彼此都回到最適合彼此的地方。


  為了領導族人、Hiccup找到比原有Berk更加廣大更宜居的領地


  Toothless則帶著新把到的妹(XD)與其他龍族回歸龍族秘境


  故事很明顯試圖將觀眾融入Hiccup對於Toothless依依不捨難以放手的情感


  也確實在一些設計過的角色動作細節中，感性的觀眾能夠被擊打淚腺


  但跳出整個故事框架來看，不管是Hiccup恐婚、不捨Toothless、異想天開要帶族人一起

  到龍族秘境定居等


  主線劇情都只是拋出一個結果讓觀眾接受後推進，而欠缺更具說服力的因子


  尤其是本作的反派Grimmel，前段說如何恐怖如何殘忍如何異於常人的變態


  最後的招數跟走向卻讓人覺得蛤就這樣而已??


  輕易地找到新Berk據點、再輕易地找到龍族秘境


  為了讓彼此回到最適合彼此的地方，劇情細節的塑造還是薄弱了


  不過也因為如此，也許更讓對Hiccup與Toothless有感情的觀眾更能好好與他們道別


  Hiccup與Toothless的羈絆在本集依然有不錯發揮，包括Hiccup出招幫Toothless把妹


  以及最後近乎於八點檔式(?)的犧牲橋段，雖然老梗


  但確實在其中看出Hiccup對Toothless的依賴，以及彼此互相支持的感情


  在明白並且確實感受的龍族必然得回到牠們應該存在的地方


  而不是人類的座騎或武器，Toothless最後離開前與Hiccup的一望其實是個很美的句點


  然後Hiccup與Astrid的婚禮，我也差點以為Toothless會回來


  不過轉念一想，這才應該是完美的結局，就像Richard Parker終究沒有回頭一樣


  不把人類的情感加諸在本該自由自在的生命萬物之上


  差點我就覺得這是個perfect end了




  ...直到最後一段，結果還是矯情了一把 XDD


  重新回到闔家觀賞老少咸宜的動畫片層次


  終究雖然句點平淡，還是感謝並收藏HTTYD系列九年帶來的回憶~



  --'
