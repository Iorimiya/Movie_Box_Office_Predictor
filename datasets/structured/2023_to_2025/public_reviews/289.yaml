url: https://www.ptt.cc/bbs/movie/M.1752168415.A.93A.html
title: '[  雷] 馴龍高手'
content: "雷文防雷資訊頁\n \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n \n\
  \ \n \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n \n \n\n\
  觀影證明：\n\n\n這部動畫算比較後期小弟沒看過，小弟的童年是看迪士尼的但因為太多膚色竄改完全不會去\n支持；因為看電影海報及預告還原度近乎動畫而且小弟才知道路上有些摩托車安全帽黏在上\n\
  面的黑色玩偶原來出自於這部電影！\n\n電影角色：\n男主：\n善良的維京白人男孩，比動畫角色帥很多竟然還有人會講路人，真不知道他自己本身長什麼\n樣笑死；只可惜結局男主角少了一條腿，這樣好像剛好跟夜煞少了半邊尾翼一樣。XD\n\
  \n女主：\n看板上有在講女主因為非原著金髮，拜託要不要去看一下迪士尼都還原什麼鬼樣子；勇敢的\n維京非白人女孩，在她對男主角說我懂了之前其實個性不討喜，不知道動畫也是這樣呈現嗎\n\
  。\n\n男主父親：\n如果不是先看演員介紹還真的不知道是巴特勒就像不知道布萊德利客串超人原生爸爸一樣。\n，角色也從固執專制轉為理解諒解也接受這樣算黑洗白嗎，畢竟我覺得不配做兒子那句話太\n\
  重。\n\n夜煞：\n整個外型就很可愛，除了不喜歡鰻魚之外習性像喵星，只不過他算是高級龍那麼容易就被男\n主打下來，好吧！劇情需要。XD\n\n配角方面：\n\
  劇情時間分配也算合理這個就真的比較偏路人一點，頂多就是巨型羊毛袋還有印象，片中好\n像有提到一些元素恐龍，但真正展示的好像只有噴火，夜煞噴的是紫色應該是混沌魔法不屬\n\
  元素，騎龍期間畫面都很棒，這就是在家裡不管用多大的螢幕看都不會有的環境效果，比較\n小小不合理的地方不是只有男主是馴龍高手嗎，怎麼包含女主以及小跟班一下子就能騎龍了\n\
  ，當然結局他們龍穴那段合作模式還是OK的啦。\n\n結語：\n看了一下動畫的人物風格除了夜煞不太喜愛那種畫風，只是不曉得兩者之間的改編大不大，\n不過這近乎還原的角色還是大大給讚！科技進步原想回味迪士尼動畫電影怎知硬要改顏色，\n\
  反正老鼠有錢賠那就繼續慢慢賠囉～\n\n回歸正題，真人版馴龍應該不用看動畫也看得懂在演什麼畢竟好似沒有太多前情需要了解，\n兩個過場名單有不到4秒的片尾，但不知道是代表什麼伏筆，最後龍跟維京人在島上共生很美\n\
  滿、以上。\n----\nSent from  on my iPhone SE 3\n\n--"
