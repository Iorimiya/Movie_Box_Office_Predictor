title: '[好雷] 馴龍高手(2025)(三種放映方式心得)'
content: '雷文防雷資訊頁

  防雷頁順便附人權



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  上映第一天一刷



  看完立馬下訂當週美麗華 IMAX

  票根遺失了只剩海報 q_q



  然後看 4DX 好評本週再刷

  威秀手機訂票不給票根只能印購票證明










  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  先說我 Toothless 腦粉

  原本動畫版就是我最愛動畫電影沒有之一

  所以照著拍 好雷我一定給爆


  當初聽到要開拍真人版心境很複雜

  超擔心慘遭真人化

  另一個疑問是這麼快就要拍真人版了？

  不過上映前拼命刷動畫版片段時

  確實是有感受到十幾年來動畫技術的差距


  事實證明找原導演回來照拍真的太對了

  完全了解這個世界觀 沒有亂七八糟的增刪

  (歡迎懷疑我在偷臭...)


  Hiccup 神選角 Mason Thames

  拍攝時還不到18歲 演技這樣是不是有點強?


  Stoick 請出原配音 Gerard Butler

  維京老爸我想不到還有哪位更合適的


  第一次看的時候是不太記得完整細節去的

  只有一些橋段的印象

  跟不知道刷了幾遍的 test drive

  刻意不先重看動畫版是希望進場後

  重溫一些劇情感動


  沒想到!!這對螢幕父子

  讓 15 年間從研究生變成人父的我

  從頭哭到尾


  起先是

  Hiccup 想要證明自己 與 Stoick 的期盼


  接著衝突

  Hiccup 挑戰自己的路 與 Stoick 的誤解


  最後是 Hiccup 的成就與

  Stoick 說出父親的愛與驕傲

  (為人父超譯) 不在於子女的成就高低

  而是在於存在的本身與想要保護的心


  短短兩個小時只要是他們兩個對戲的橋段

  我幾乎都是眼匡含淚在看

  真人版最棒的地方就是

  這些動畫做不到的情感傳達

  看完真心覺得

  能好好拍成真人版原來是這麼棒的事



  ========================================



  不過看第一遍覺得有一點點小遺憾

  因為我對於原版 test drive 實在太熟了


  動畫版音樂與畫面搭配精準

  丟掉小抄後的畫面

  強調人與龍的搭配與快速穿梭的緊張感


  真人版這段

  加長了浮空的畫面

  原本的音樂插入了一段只有人聲的橋段

  丟掉小抄後的穿梭鏡頭比較遠

  多了一點景色的壯麗

  但總覺得少了點什麼


  二刷 IMAX 的時候在這段有獲得了一點舒緩

  但 就一點

  IMAX 是讓景色更壯闊

  穿梭更有臨場感

  但看完還是覺得沒有動畫版那麼完美


  直到我看了 4DX

  那些原本感覺有點冗長(開頭 Stoick 火龍互毆)

  或不夠精準的鏡頭

  在 4DX 得到了解答

  試飛的遠景搭配 4DX 提升臨場感

  這就是我要的 test drive 啊啊啊啊

  還好有三刷!!!


  ========================================


  小插曲

  美麗華 IMAX 那場散場時

  有觀眾"提醒"另一位觀眾觀影時不應使用手機

  沒想到 有錯在先的人惱羞嗆聲

  "我坐最後一排哪會影響到誰? 你是在xxx"


  不知道要怎麼表達我的遺憾與憤怒


  就 祝福 Movie 版版友

  好人一生平安 看電影不被小白干擾wwww


  --'
