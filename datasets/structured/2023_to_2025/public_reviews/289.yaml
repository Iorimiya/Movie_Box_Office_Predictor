title: '[選片] 艾莉塔vs馴龍高手3'
content: '各位大大好

  小弟我預計明後天會跟朋友一起看威秀

  想看爽片但又希望劇情不要太不合理

  原本是直接決定看艾莉塔的

  但看版上評價似乎劇情轉折有點生硬

  另外我們都沒看過原著漫畫

  所以也怕一些細節設定看不太懂


  小弟我馴龍1&2都有看

  覺得沒特別愛但也不會不喜歡

  看3的預告覺得劇情大概和前兩集風格滿類似的

  算是安全牌


  想問各位大大意見

  -----

  Sent from JPTT on my iPhone


  --'
