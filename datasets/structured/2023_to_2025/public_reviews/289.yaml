url: https://www.ptt.cc/bbs/movie/M.1732204792.A.078.html
title: '[新聞] 沒牙回歸！ 真人版《馴龍高手》預告曝光'
content: "沒牙回歸！ 真人版《馴龍高手》預告曝光\n\n10:37 2024/11/21 中時 杜欣穎\n\n\n梅森塔姆斯主演《馴龍高手》真人版。（圖／UIP提供）\n\
  \n三度奧斯卡獎入圍者及金球獎得主迪恩戴布洛伊，是打造夢工廠動畫叫好叫座《馴龍高手\n》三部曲極具遠見及創意十足的幕後推手，他即將帶來這個備受好評的動畫電影系列，令\n\
  人震撼與感動的全新真人版電影。\n\n\n在荒蕪粗獷的博克島上，維京人與龍族是世代相傳的宿敵。但是小嗝嗝（《闇黑電話》、\n影集《太空使命》梅森塔姆斯 飾）卻與眾不同。作為族長大塊頭史圖依克（傑瑞德巴特\n\
  勒再度詮釋動畫版中的經典角色）充滿創意卻不被重視的兒子，小嗝嗝打破數百年來的傳\n統，和一隻令人畏懼的夜煞－沒牙－成為好朋友。他們出乎意料的深厚友情不但揭露了龍\n\
  族的真正本性，同時也動搖了整個維京社會的根基。\n\n在勇猛善戰又野心勃勃的亞絲翠（《小飛象》、影集《最後生還者》英國電影學院獎入圍\n者妮可帕克 飾）以及維京人村莊個性古怪的鐵匠戈伯（《公主與狩獵者》、《活人甡吃\n\
