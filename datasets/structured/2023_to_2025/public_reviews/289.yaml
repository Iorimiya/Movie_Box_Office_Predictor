url: https://www.ptt.cc/bbs/movie/M.1748443770.A.874.html
title: '[新聞]《馴龍高手》動畫太優！導演憂真人版粉絲'
content: '《馴龍高手》動畫太優！導演憂真人版粉絲不買單



  最近，動畫《馴龍高手》三部曲導演迪恩‧戴布洛伊在拍完該


  系列的真人版電影後，很擔心動畫電影的粉絲對該電影的反應，


  並且他還透露最初是不願意翻拍的，只因兩個因素激勵了他拍這部電影。



  導演、編劇兼執行監製迪恩‧戴布洛伊（Dean DeBlois）在製作了動畫《星際寶貝》（

  Lilo & Stitch，2002）和動畫《馴龍高手》（How to Train Your Dragon，2010-2019）

  系列三部曲之後，他決定將《馴龍高手》系列第一部動畫的翻拍版搬上大銀幕。儘管他是

  一位資深導演，但他最近承認他擔心粉絲對真人版《馴龍高手》的反應，並透露有兩個因

  素激勵他翻拍這部真人版電影。



  據《CinemaBlend》報導，當地22日，迪恩在環球影城的Epic Universe主題樂園區的真人

  版《馴龍高手》放映會上，談到了他在首映前的一些疑慮。他說：「這是我們第一次把這

  部電影播放給別人看。我當然會擔心，只是因為——其實我不應該說擔心，我對這部電影

  有信心，但我對觀眾是否能接受它並沒有把握。你知道的，他們可能對原版動畫電影太有

  感情了。」


  迪恩補充說：「或者，還有人們會討論像是『為什麼還要這部電影呢？』你知道的，『太

  早拍它了吧』，或是『動畫電影就已經很好了啊。』」


  但迪恩表示，雖然真人電影與第一部動畫電影很相似，但他們已經做了一些改變。他解釋

  說：「所以，我們需要去說服觀眾這部電影是值得一看的電影。我們嘗試著讓角色更加豐

  富，或讓動作場面更加身臨其境，並稍微擴展了神話故事。」


  《馴龍高手》導演兼編劇迪恩曾憑藉該片入圍最佳動畫長片獎。27日，迪恩向《

  Animation》雜誌坦言，原本他是抗拒翻拍「懶惰」的真人版。但當他從正面角度想到能

  夠重新回到小嗝嗝與沒牙仔的世界，且有機會確保真人版不會削弱他動畫三部曲的核心價

  值時，他改變了主意。


  迪恩說：「有兩個動機因素，是，當我和環球影業談話時，我回憶起自己曾經對這些真人

  版翻拍片的看法。我總覺得它們缺乏目的性，因此看起來像是錯失了機會，因為你可以把

  那些預算放在原創作品上，用來取悅觀眾，甚至可能創造出一個全新的系列作品。」


  「但我也明白，拍它可以規避風險，因為這些都是投資巨大、成本昂貴的電影。我很保護

  這些角色和世界。雖然我不覺得非要做這個項目不可，但我對這些動畫電影感到很驕傲。

  我覺得我已經在那三部作品上畫上了句點，讓這三部曲故事合而為一，成為一個更宏大的

  成長故事。」


  迪恩表示，真人版許多方面都擴展了原版動畫內容，並談到了激勵他翻拍的兩個要素，一

  個是挖掘角色深度，另一個是體驗宏偉的真人版。迪恩說：「（現在）我們可以更深入地

  去展現這個部落是如何團結起來的神話故事，我們可以更深入地去挖掘角色的深度，對之

  前著墨較少的角色，像亞絲翠，給予更多的關注。」


  原版動畫中亞絲翠明顯對小嗝嗝有敵意，但動畫並沒有敘述其背後的故事。迪恩說：「即

  使在動畫電影中，她也是一個很有魅力的角色，但我覺得可以去了解她的背景，以及為什

  麼她會和小嗝嗝有那種敵對關係，這些都是很好的機會。」


  迪恩談到第二個因素說：「然後，就是真人版中如何呈現龍在飛行。我們可以探索那種貼

  近現實的質感，就是真正騎著龍飛行會是什麼感受。我們不會過於投入在奇幻元素，而是

  會著重於真實感的呈現，就好像龍真的活在我們身邊一樣。騎上龍背、在IMAX那種壯觀的

  畫面中體驗飛行會是什麼感覺？我覺得我應該把錢花在刀刃上，嘗試打造一個充滿愛與關

  心的版本，而不是想去取代動畫電影。」


  《馴龍高手》2025年6月11日在台灣上映，6月13日在美國上映。




  --'
