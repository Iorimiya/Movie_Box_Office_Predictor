  4.觀影方式 : 自行購票


  §其他防雷說明(非必要) : n刷等其他說明請於此區說明....可留空




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  此區為發文防雷頁

  可選擇性提供上列 1~4 資訊  或不提供亦可

  觀影心得於分隔線下方發布即可


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  距離沒牙與小嗝嗝相遇已經九年，陪伴著影迷的《馴龍高手》系列也終將告一段落。三集

  品質都在水準之上，而系列最終章不但感動依舊，同時也在觀影結束馬上與第一集並列

  All-time list，毫無疑問會是2019年最棒的電影之一。



  經歷過前兩集的冒險犯難，小嗝嗝與亞絲翠共同領導著全新的博克島。在這可以說是既輝

  煌又混亂的龍之烏托邦裡，大家過著幸福快樂的日子，每當聽聞附近有補龍船，則出隊執

  行救援任務。一方面是由於這樣無條件的接納讓博客島快要無法負荷，一方面是因為博克

  島遭遇有史以來最大的威脅：一名自稱夜煞殺手的捕龍獵人葛林魔，讓小嗝嗝不得不思考

  過去父親所追尋的、世界盡頭的龍國秘境是否存在，而移居到那裡又是否可行。於此同時

  ，沒牙居然...戀愛了！！！光是看預告就被萌翻！吾家有龍初長成的小嗝嗝，不僅得幫

  沒牙追女孩，還得面對野性的呼喚對他倆關係的影響。



  三集一路走來有過不少動人的經典畫面，來到系列最終章，《馴龍高手3》充分利用前後

  呼應 ( Bookend ) 的手法，一邊帶觀眾回味這些記憶裡的片段，一邊讓他們感動得死去

  活來。首先，由於沒牙的義尾必須有小嗝嗝的幫忙才能操作，使得牠無法跟隨母龍光煞翱

  翔天際，於是，小嗝嗝便為牠升級了配備。當亞絲翠一早起床看到忙碌工作的小嗝嗝與設

  計草圖，便知道他一夜沒睡忙趕工，不禁讓人想起當初小嗝嗝第一次為沒牙打造義尾的畫

  面。



  另外，電影末段小嗝嗝與亞絲翠帶著孩子們航向龍國秘境，小嗝嗝悉心指導充滿恐懼的孩

  子們如何取得龍的信任，戰戰兢兢的模樣就像《哈利波特：阿茲卡班的逃犯》裡，學生們

  忙著向鷹馬鞠躬行禮一般。而令人又驚又喜的是，片尾真的播了很多過去小嗝嗝與沒牙一

  人一龍「小時候」的相處過程，尤其是緊接著小嗝嗝孩子與沒牙互動後播放，感動萬分。



  如同《哈利波特：死神的聖物》裡，觀眾需要準備心情與系列說再見，而哈利也得與部分

  角色道別一樣；《馴龍高手3》作為系列的最後一集，同樣也利用「下一代的出現」來代

  表時光飛逝，向觀眾交代角色們後續的生活。而小嗝嗝與沒牙的道別，固然揪心，但電影

  中間不時穿插對父親的回憶時點出「有愛就有失去」，不過，正如父親逝去後過去的話語

  與相處點滴存在小嗝嗝腦海仍不褪色，與沒牙道別的那一刻到來時，彷彿沒那麼痛，也沒

  那麼困難了。再遇見時，小嗝嗝心裡有著忐忑，擔心自己被遺忘，保持戒心的沒牙一聞到

  對方的氣味，則馬上卸下防備，完全應證伍思凱得分享裡唱道：「時間已做了選擇/什麼

  人叫做朋友/偶爾碰頭/心情卻能一點就通。」即便只是偶爾碰頭，過去一起共患難的心情

  絕對是一點就通的。



  《馴龍高手》系列本就是成長故事，從失去父親，到找到母親，如今統領全島並征戰，以

  及學習處理各種關係，小嗝嗝這個角色成長許多。從第一集，電影就透過小嗝嗝與沒牙都

  有缺陷給了兩人成為絕佳拍檔的完美理由，而在這一集裡，精神上的能力比物理上的缺陷

  所帶來的影響更加深遠，又再次被放大。光是從葛林魔控制龍的方法即可看出，猶如《

  Avengers復仇者聯盟》裡洛基利用無限寶石控制鷹眼心靈使其投誠，遠比使其肉體受傷還

  來得有殺傷力。在誤以為沒牙「見色忘友」，永遠離自己而去時，小嗝嗝認為自己又回到

  過去那個沒用的自己，但其實就像亞絲翠所說，成就他的，從來不是沒牙或是他的義肢，

  沒有這些，目標只是較難達成，這一路上的堅持與選擇才是真正重要的。正因為有了這些

  體悟，小嗝嗝從男孩成為所謂「有肩膀的男人」。



  在這段旅程裡，除了心靈成長之外，電影裡的感情著墨也不少。俗話說：「天下無不散的

  筵席」，沒牙與小嗝嗝如兄弟般如膠似漆的友情，終有不能再形影不離的一天。但是，他

  們一人一龍也都找到屬於自己的幸福。由於沒牙小時候沒有其他同種的夥伴，牠甚至必須

  靠偷看其他龍的求偶舞，以及小嗝嗝為牠打暗號，才能順利追母龍光煞，這段插曲不只是

  為電影提供笑料，也再次強調小嗝嗝與沒牙的感情深厚。



  最後，也是最催淚之處，莫過於小嗝嗝為了沒牙的幸福，願意與葛林魔同歸於盡的瞬間。

  「犧牲」是一個領袖非常珍貴的特質，不論是犧牲精神、時間，甚至是更多更難割捨之物

  ，如同《Captain America美國隊長》裡史提夫羅傑之所以成為超級士兵計畫的幸運兒，

  就是因為博士看到他願意為了同袍犧牲自己。可能也如小嗝嗝所說，相信龍族與人類能夠

  和平共處的他，心裡深知光煞肯定會回頭來救自己的。在這一來一往之間，雖說大夥也成

  功除掉最大威脅，但小嗝嗝也體會到，貪婪的人類，勢必總會找到殘害龍族的方法與理由

  ，所以，在人類世界完全接那龍族之前，龍國秘境還是龍族最能安身立命之處。










  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
