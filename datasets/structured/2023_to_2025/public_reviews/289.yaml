title: '[討論] 3D英文版馴龍高手2高雄威秀包廳參與意願'
content: "大家好:\n\n昨天查詢了高雄區 3D英文版 《馴龍高手2》的場次\n發現幾乎都被影城列到小廳場\n\n朋友看完公關首映的心得非常爆錶的大推\n\
  故事精彩度、內涵，還有動作與特效整整超越第一集\n一定要在電影院享受大螢幕多聲道的快感!\n\n想在大廳觀賞\n並跟威秀確認了包廳的需要\n1.需徵求到285人\n\
  2.需提前10~15天與威秀確認日期與場次\n\n\n想請有意願並會參加的朋友填下表單\n\n(人數過少包廳確認無法成功已刪除表單)\n\n包廳需人數達285人才成功\n\
  人數是重點也歡迎高雄有興趣朋友幫忙轉發這資訊\n希望能成團(緊握)\n\n謝謝大家\n\n\n--\n                            \
  \           07/03 15:12\n不是用推文統計，請大家填下表單喔QQ\n\n感謝大家的協助調查，只是截至目前為止(0709)\n預計觀賞人數累計為43位，跟預期的285位還有很大的距離\n\
  \n很遺憾跟大家告知，大廳包團確認無法成行\n\n希望影城們在首波暑期檔期搶下首週票房冠軍的狀況\n能加開大廳場次\n祝大家都能順利觀影:)"
