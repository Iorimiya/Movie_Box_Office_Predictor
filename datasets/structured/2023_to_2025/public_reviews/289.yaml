url: https://www.ptt.cc/bbs/movie/M.1749363313.A.EBC.html
title: '[ 極好有雷] 馴龍高手真人版'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  首先動畫版就很好看了，真人版更好看

  這次看到是威秀IMAX的搶先版

  動畫版一個半小時，真人版兩個小時

  沒有拖戲多了更多細節，而且

  選角上沒有問題，主角小嗝嗝很討喜帥又可愛

  真人版的沒牙版也更大隻更帥氣

  然後原本就知道我在後面劇情會哭

  但沒想到前面就滿滿的感動

  有好幾幕從畫面到音樂都美到目瞪口呆



  1.小嗝嗝嘗試摸到沒牙頭成功的那一刻

  （這一幕我真的沒想到我會感動，音樂太好聽了）


  2.小嗝嗝成功坐在沒牙身上翱翔天際的那一刻


  3.小嗝嗝帶著亞絲翠衝破雲端看到極光的那一刻

  （這一幕是極光美到讓我覺得身歷其境）


  4.沒牙衝去保護小嗝嗝的那一刻


  5.族長跳進海裡拯救小嗝嗝後再次下來拯救沒牙的那一刻


  6.小嗝嗝醒來後發現沒有那麼完整的那一刻


  看完馬上就讓我想2刷甚至迫不及待想看馴龍高手2的上映了~




  --

  期待4DX心得

  好像有改編，但一樣是由原動畫的作曲家製作，我覺得也很好聽更氣勢磅礡~

  而且好想要杜比和前導海報~

  我覺得一定滿意，除非雞蛋裡挑骨頭（？

  可是他們長得很像，我跟他媽媽一樣差點認不出來

  2027續集會上映，不知道媽媽會找誰，但氣質滿符合的

  好看慘'
