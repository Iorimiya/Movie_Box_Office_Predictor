title: 'Re: [請益] 馴龍高手1夜煞模仿主角畫的圖案？'
content: '這是我看過最喜歡的解釋

  就是小嗝嗝伸手去摸沒牙的樣子

  沒牙應該對這個人類拼命想摸他印象深刻吧


  會畫成這樣主要是因為視點的關係

  沒牙經常是居高臨下看著小嗝嗝

  不像我們在電影中大都是平視著他

  老實說在這麼大片地面上畫這樣很不錯了


  --

  人生苦短 戀愛吧 少女

  趁著唇瓣的朱紅未褪

  趁著澎湃的熱情未涼

  只因青春歲月 餘日無多


  --'
