url: https://www.ptt.cc/bbs/movie/M.1750439964.A.F8B.html
title: '[新聞] 《馴龍高手》亞絲翠髮色 人種被批毀原作'
content: '《馴龍高手》真人「亞絲翠」髮色、人種被批毀原作！演員回擊：我不鳥那些反對多元包

  容的意見




  （圖片來源：環球影業）


  真人電影版《馴龍高手》（How to Train Your Dragon）自上週六起，就已陸續各國登陸

  院線，目前普遍收獲好評居多，無論特效、美術、演員的表現都備受讚賞，連事前受到某

  些影迷非議的「亞絲翠」女星 妮蔻帕克（Nico Parker），最終也深獲不少觀眾的認可和

  喜愛。


  但談到電影問世之前所收到的許多關於她外貌不符動畫版造型的批評，帕克仍有一些感觸

  想要表達。




  （圖片來源：環球影業）


  近日接受《泰晤士報》（The Times）採訪的帕克表示：「有些人真的很喜歡動畫版，真

  的很想看到百分之百照著演的真人版電影，而我也希望你們可以去看新版本，並且無論如

  何都能從中找到自己喜歡的部份。但對於那些討厭多元包容、討厭改變的人，我根本不在

  乎，如果我不在乎你對生活中大多事情的看法，我當然也不會在乎你對我頭髮的看法。如

  果我在乎了，我會起肖的。」


  帕克也認為，在她的成長過程中，好萊塢很缺乏像她這樣的混血和黑人偶像被塑造出來：


  「對於女性角色來說，在新創角色、原創題材和女性主導的故事方面，我們還有很長的路

  要走，但我認為一切都在改變，我希望自己總有一天能為這種改變趨勢做出貢獻。」


  文：Joker



  新聞網址：




  --'
