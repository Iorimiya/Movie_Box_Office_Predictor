url: https://www.ptt.cc/bbs/movie/M.1704566845.A.738.html
title: '[新聞] 完美選角！傑哈巴特勒回歸《馴龍高手》'
content: '完美選角！傑哈巴特勒回歸《馴龍高手》真人版續扮主角爹


  2024/01/06 13:30




  叫好又叫座的《馴龍高手》系列，預計明年推出真人版電影。（資料照，UIP提供）


  〔記者許世穎／綜合報導〕


  賣座動畫《馴龍高手》系列去年傳出將打造真人電影版電影，選角陸續曝光，外媒今驚喜

  報導，在動畫系列中為主角小嗝嗝父親，同時也是博克島原領袖「史圖依克」獻聲的硬漢

  男星傑哈巴特勒，將在真人版電影中繼續飾演該角，由於角色本來就和他本尊非常契合，

  影迷也大讚這根本是不二人選。


  叫好又叫座的《馴龍高手》系列改編自暢銷童書，首集於2010年推出後大獲好評，並入圍

  奧斯卡最佳動畫長片與原創歌曲，之後在2014及2019年推出兩部續作，三部曲全球票房超

  過16.38億美金（約台幣507.28億元），也推出幾部衍生電視版動畫及短片。




  傑哈巴特勒原先就在《馴龍高手》系列為「史圖依克」獻聲。（翻攝自IMDB）


  真人版將由動畫版系列編導迪恩戴布洛伊回歸執導，同時也是他個人執導的首部真人電影

  ，先前已曝光包括《闇黑電話》少年男主角、現年16歲的梅森塔姆斯將飾演小嗝嗝，以及

  曾演出真人版《小飛象》、影集《最後生還者》的星二代妮可帕克將飾演亞斯翠，預計20

  25年6月上映。


  新聞網址：






  --'
