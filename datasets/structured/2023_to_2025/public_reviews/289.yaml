title: '[  雷] 馴龍高手2+3'
content: "防雷\n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n \n \n \n \n之前忘了PO第二集的心得,想說這次兩集一起說\n\
  第二集以前去電影院看過,當時還小沒什麼感覺\n但長大再看一次才發現他的內容很水\n他還是有讓兒童看的開心的地方在\n但就像是為了出而出的續集\n完全把第一集累積下來的資本展示一遍\n\
  算是陷入了狗尾續貂的低谷中\n以三部曲裡面第二集最好看的角度來說蠻妙的\n \n但到了第三集竟然有辦法扳回一城\n雖然這集依然有著一些問題\n最大的問題是浪費了光煞的戲份\n\
  明明在劇照c位卻都只是打醬油\n還有敘事太分散的問題\n不過這些缺點在漂亮收尾面前都消失殆盡\n雖然我對這系列沒特別熱忱\n但不得不說這樣優秀的收尾讓人讚嘆\n\
  而且也沒把話說死(可以出續集\n不管對人類還是龍族都是很棒的結局\n----\nSent from on my iPhone 14 Pro Max\n \n--\n\
  萊斯特在最後敘述中講述了生活中有意義的經驗，他說，儘管他死了，他還是很高興，因\n為這世界上有這麼多的美\n \n--"
