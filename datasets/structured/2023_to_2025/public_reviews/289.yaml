url: https://www.ptt.cc/bbs/movie/M.1549209030.A.F51.html
title: '[好雷] 馴龍高手3 '
content: '1.影片名稱 : 馴龍高手3


  2.觀影時間 : 拒答


  3.觀影地點 : 拒答


  4.觀影方式 : 自行購票



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  圖文完整版：





  碎碎念的臉書專頁：




  懇請支持 m(_ _)m









  說到類似《E.T.》套路類型的電影作品，前陣子的《大黃蜂》執行成果還算不錯，而同類

  型中的翹楚，當然莫過於2010年代，夢工廠儼然和皮克斯分庭抗禮時期的《馴龍高手》，

  至今依然還是個人最喜歡的好萊塢動畫電影以及配樂之一。


  不僅僅是異族相知相遇相戀（呃?）的故事，還有與自然共存的寓意、不是一味熱血勉強

  而是探索屬於自己的真正夢想，最後更有一點不那麼圓滿的缺憾之美。共經患難，帶有殘

  缺的一人一龍，相互扶持，打破兩種族之間的隔閡與偏見，迎向光明的無限未來。故事其

  實直接結束在這邊也很好，雖然票房不算超高，又不幸遇上《玩具總動員3》，和奧斯卡

  最佳動畫失之交臂，但極佳的口碑，使得續集製作的呼聲一直不小，但卻還是在隔了四年

  之後才問世。


  第二集的壯麗戰鬥和風馳電掣的飛行場景更加驚艷，沒牙的賣萌也更上一層樓，可惜有些

  硬凹的故事卻走向一個不甚討喜的死胡同。雖然前集本身就反映出了某些較為寫實、人生

  往往沒有那麼美好的觀點在裡頭，但比起首集的恰到好處，第二集令人有些心痛的安排就

  似乎有些過頭。小嗝嗝也只得百般無奈的接下他心中根本不願意承擔的重責大任，對他和

  沒牙都是殘酷的命運。


  和第一集的高完成度相比，第二集其實比第一集更需要一部「續集」來好好把第二集的缺

  失彌補一些回來。而經歷了一些外在因素，我們這頭超可愛的沒牙和小嗝嗝，又隔了將近

  五年，才又終於再次回到各位觀眾的跟前。


  號稱《馴龍高手》系列的完結篇，打從一開始就放出的「沒牙談戀愛」賣點，其實結局的

  走向不會令人感到意外。但值得稱道的是，呈現出來的效果相當優異，情感真摯又自然，

  喜歡這個系列的粉絲很難不被這個意料之中、震撼卻出人意表的放手、分離與重逢感動，

  然後哭得亂七八糟。


  承接族長大位之後的小嗝嗝，其實幹的事情很難說是為了自己族人的發展而努力，多半還

  是延續他母親那套野生動物保育的志向，到處對決盜獵者，將飛龍救回自己的村莊，但卻

  使得自已樹敵無數，博克島也成為容量爆炸的浪浪收容所。所幸長輩、夥伴和其實比小嗝

  嗝更有領導風範的女友都還是相當支持他，擁有這批親友義氣相挺真的是他不知道幾世修

  來的福氣，甚至居民也都各個好說話，否則老早就該上街抗議、發動罷免了。唯一一個想

  要取而代之的同儕也只是笑鬧遠大於認真。話說博克島是不是也有少子化的危機啊？人口

  看起來不少，但年輕人好像只有他們這幾個啊。


  這其實已經隱隱算是在修正第二集的錯誤。說真的，小嗝嗝本來就不是當族長的料，就像

  他在一開始本來以屠龍勇士為志向，後來發現自己根本不適合一樣。但這個勉強讓他當上

  族長的安排又有些覆水難收，只好就這樣讓他順水推舟的當下去。


  反派了無新意的又是一位盜獵者，威脅度比上一集的反派還要薄弱，設定上是喜歡玩遊戲

  、享受捕獵快感的獵人，但這其實也只是劇本便宜行事，Grimmel得以放出「誘餌」（但

  是放出那頭光煞給沒牙當女友的用意是什麼依然不明，就算沒有光煞，龍還不是照抓、架

  還不是照打）、給博克島居民逃離的時間，好讓找到龍族秘境的必然可以發生。否則當他

  老兄首次潛入博克島的時候，如果小嗝嗝他們不要廢話，這位看起來心狠手辣、莫測高深

  的傢伙就可以去死一死了。本以為最後是有什麼獨特手段想利用光煞和沒牙帶他前往龍族

  秘境大屠殺，結果也不是這麼一回事，真正做的事情只有追蹤了智商為零的丑角Ruffnut

  。而最後的決鬥，博克島失去了龍，只有小嗝嗝帶著幾個年輕人滑翔進去，就……打贏了

  。那到底先前是為什麼要撤退呢？


  不過，人類就是這麼自私險惡的動物。只要有飛龍存在的一天，就會有盜獵的人類，人類

  並不配擁有這麼美麗的生物，就好像我們屢次看到山林土地被盜採開挖、看到石虎的棲地

  慘遭毀滅的痛心一般，這些短視無知的人類，的確不配擁有大自然的瑰寶，而這些珍貴的

  寶藏也只會被這些愚蠢的人類視為糞土。


  說到底，什麼反派、什麼龍族秘境，甚至沒牙交女友，通通都只是為了讓觀眾看到最後的

  離別。否則不僅僅只是反派的塑造和戲份無法理解，就連所謂的秘境也沒什麼邏輯。如果

  全世界的龍都是從那裡飛出來的，難道這群龍飛到秘境之後就不會再有龍飛出來了嗎？傳

  說中聽起來彷彿遙遠世界彼端的秘境，最後好像也只不過是飛行幾小時的路程罷了。而沒

  牙的個性和與小嗝嗝的相逢以及化敵為友是有經過鋪陳的，那光煞的性格和故事呢？為什

  麼她會接受沒牙的追求呢？為什麼光煞把沒牙帶回去，他就可以當上秘境的至尊龍了呢？

  也是很可惜的被忽略掉了。跟反派和憑空生出來的秘境設定一樣，除了娛樂效果之外，就

  只是提供沒牙和小嗝嗝分離的藉口而已。


  所幸這個結局的效果相當動人，說服力也夠強。畢竟沒牙和其他飛龍在博客島上，說穿了

  就只是寵物和家畜的存在，一直到小嗝嗝開始正視「自己沒有龍就什麼都不是」的事實，

  族人和飛龍的命運才終於走上了分岐，對飛龍族群來說也是好事。全片最大哭點其實是在

  小嗝嗝接受了沒牙終究也應該要離開自己的時候，並且自我犧牲讓光煞去救沒牙的抉擇。

  在這個當下，其實小嗝嗝才終於擺脫「飼主」的身分，也真正讓沒牙成為平起平坐的夥伴

  ，小嗝嗝終於用了自己的方式拯救了沒牙。龍真的是拿來「馴」來當坐騎家畜工具的嗎？

  或許他們從來就不應該「馴龍」，而是讓飛龍們自由自在的在屬於牠們的天地翱翔


  也再次證明了小嗝嗝基本上不適合當個族長，也扣回了第一集的主題。有什麼是我不能做

  到的？有什麼是我可以做到的？那我就只做我能和想做的事情就可以了。如果是他老爹，

  身為一族之長，縱使傷痛，但他應該會選擇保全自己，畢竟身上還有著族人的責任在。最

  後的安排也相當合理不矯情。就像剛才提到的，龍族秘境這個棲地其實航程不遠，就當作

  去沖繩一趟差不多，小嗝嗝依然還是可以跑去看看自己的老朋友，順便做點設備的保養維

  護。


  雖然分隔兩地，各自擁有各自的人生龍生，但還是可以帶家人見個面，吃個飯，聊聊最近

  過得好不好，這，才是真正對等的關係。


  同樣是在講離別和給予各自空間的類似題目，去年的《無敵破壞王2》就真的勉強多了。


  《馴龍高手3》還是很棒，雖然它的過程完全都只是為了服務結局而存在，就像《玩命關

  頭7》一樣。它有還可以的前大半段，但結局一出來，前面在演什麼都不重要了。配合這

  個離別的大結局，John Powell寫出三集以來最淒美動人又具備神聖和戲劇性的新主題，

  用樂音替這段友情譜下餘音繞樑的詮釋。電影或許畫下了句點，但我們都知道，這一人一

  龍的情誼，會跟著John Powell的經典創作一起，永存於世。









  --


  盧秀燕向前走得一步，噹的一聲，一個小瓷瓶掉在地下，

  正是顏清標投在她身上的，拾起一看，見瓶上寫著八個篆字：


  「谷關空氣，嗅之即解」。


  --'
