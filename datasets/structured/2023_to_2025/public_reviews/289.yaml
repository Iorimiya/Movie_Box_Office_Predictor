url: https://www.ptt.cc/bbs/movie/M.1548592155.A.2E0.html
title: '[好雷] 【再見不是結束，而是另一個開始 - 馴龍高手3】'
content: "雷文防雷資訊頁\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n1.影片名稱\
  \ : 馴龍高手3\n\n2.觀影時間 : 1/22\n\n3.觀影地點 : 美麗華IMAX\n\n4.觀影方式 : 片商(商家)邀約\n\n§其他防雷說明(非必要)\
  \ :內有小雷\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n此區為發文防雷頁\n可選擇性提供上列\
  \ 1~4 資訊  或不提供亦可\n觀影心得於分隔線下方發布即可\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n【再見不是結束，而是另一個開始 - 馴龍高手3】\n\n部落格圖文好讀版：\n\n\n--\n\n\n馴龍高手系列一直都是我最愛的動畫之一\n從第一集小嗝嗝與無牙的相知相惜\n\
  到第二集龍族與龍族之間的大亂鬥\n到此集做了個完美的收尾\n此系列無疑是繼玩具總動員以來最好看的動畫三部曲\n\n而剛好我又在PTT抽中了IMAX特映會的票\n\
  因此就一定要來寫一篇影評紀念我逝去的青春(誤)\n\n\n\n\n故事的開始是從博克島越來越擁擠開始的\n雖然小嗝嗝在上一集的大戰後\n已經當下博克島的族長\n\
  但是團隊其實藏著很大的隱憂：\n\n       「所有人都太依賴龍族的幫助了！」\n\n當然這一系列動畫一直都FOCUS在龍族與人類之間的互動上\n但是當博克島已經實現人與龍族的和平共處後\n\
  卻發人類之間彼此卻完全沒有默契\n不管是小嗝嗝團隊每次都糊里糊塗的打贏勝仗\n或是依舊存在想要捕捉龍族的壞人\n每一個都提醒著我們危機依然存在\n\n而小嗝嗝本身也開始產生自我矛盾\n\
  因為一直以來他的成功都伴隨著無牙的陪伴\n而當無牙不在他身邊時\n他是否又回到當初那個瘦弱的小男孩？\n\n\n\n\n當然馴龍高手系列內最受歡迎的無牙\n在這一部的表現也是可圈可點\n\
  不管是片中超級可愛的求偶舞蹈\n還是結尾久未重逢的飛撲\n都讓人忍不住想要有一隻可愛的無牙\n\n但隨著小嗝嗝與無牙的成長\n兩人在同伴間的責任也越來越重 (一個是至尊龍，一個是族長)\n\
  故事到此，已經不在是當初那個熱血就能打贏勝仗的青少年童話\n取而代之的是身為領導者所需的特質與勇氣\n因此，本片也非常細膩的描述了這段：「男孩成長到男人的故事」\n\
  \n從馴龍高手一到現在也過了九年了\n本片的觀眾也早就從當初的青少年成長為大人了\n成長中所受到的經歷正跟片中的小嗝嗝一樣\n我們都曾經迷惘與自我懷疑過\n我想這也是本片為何如此賺人熱淚的原因之一\n\
  \n\n\n\n另外，本集也加入了新的角色：無牙的女友 – 光煞\n光煞是一種與夜煞相近的龍族\n其擁有藍色的大眼與光滑的皮膚\n光煞是十分少見的龍族\n更擁有可以在穿過火圈後隱身的超能力\n\
  \n這麼可愛的龍族，理所當然地讓我們的無牙迷的暈頭轉向的\n而小嗝嗝也非常大方的讓兄弟離開身邊\n去追求屬於自己的幸福\n畢竟龍族跟人類還是兩種不同的種族\n\
  終究還是要分開生活的\n\n這裡有趣的是小嗝嗝就像個父親一般\n一方面他又不想要拘束住無牙的交友自由\n但另一方面他又想要幫助無牙追求女友\n至於有沒有追到，就請大家自己進戲院觀看囉！\n\
  \n\n\n\n而本片也跟上最近好萊塢女權主義上升的腳步\n不管是小嗝嗝女友亞翠絲的表現\n還是小嗝嗝媽媽在劇中根本就是維京女戰神\n在在都顯示女性已不再像過去一樣\n\
  只能是等待王子來拯救的公主\n\n甚至就連配角暴芙那特超有自信的碎碎念\n還有無牙在遇見光煞後，才真正的成為英雄\n我們都可以看見女性角色在此片的重要性 (其實維京人根本就是母性主義吧XD)\n\
  相信在未來也會看見更多以女生為主角的動畫\n\n\n\n\n至於片尾的結局，則是讓人哭的一把鼻涕一把眼淚的\n也許是因為無牙已經陪伴我們太久了\n而我們的成長歷程中，也像小嗝嗝充滿了自我的疑問\n\
  因此就算最後的選擇是對的\n但是那樣的場面還是如此的令人不捨\n\n還好導演很聰明地安排了回馬槍\n讓此部電影最後還是以開心的方式收場\n畢竟這還是一部很受歡迎的動畫電影\n\
  如果太過傷心票房可能會一落千丈\n設定取消廣告分潤\n\n\n\n總之，這還是一部蠻不錯的三部曲電影\n雖然此集的場面沒有像上集如此龐大 (IMAX的效果沒有這麼好，可以考慮錢包再決定)\n\
  而劇中的刺激程度也只能算合格的程度\n但是整體來說還是蠻讓人印象深刻的\n\n如果你跟我一樣是很愛馴龍高手系列的人\n我相信你還是會跟我一樣很喜歡這部作品的\n\
  讓我們一起來跟無牙說再見吧！\n\n--\n\n\n\n  藍天影評 - 我只分享好電影"
