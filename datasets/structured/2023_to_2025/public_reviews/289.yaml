title: '[超負雷]馴龍高手3：不要再有4了'
content: '雷


  雷


  雷


  雷


  雷


  雷


  雷


  雷


  雷


  雷


  雷


  雷


  ==================


  馴龍高手1，絕對是近年最經典的動畫！


  馴龍高手2我就覺得很難看了


  結果馴龍高手3還是一樣難看


  劇情完全是冷飯熱潮又十分老套


  根本就是巴他蝶和小智的故事啊，再穿插一個獅子王吼叫的場面


  整部電影都很無聊，就是2的情節再演一次，


  幸好結尾成功賺取粉絲的眼淚，有救回一點


  整部電影就只有結尾勉強算是可以，


  有感人，不過情節安排也是普普通通，


  拜託不要有4了


  然後特別要說的


  馴龍高手1的配樂真的是超級洗腦，跟劇情契合無比


  不知為何，到了馴龍2，


  就變成非常複雜又嘈雜的配樂，不搭劇情，十分腦人


  馴龍3也是一樣，


  配樂在背景非常嘈雜，聽覺很凌亂


  覺得十分失望。










  --'
