url: https://www.ptt.cc/bbs/movie/M.1537007644.A.815.html
title: '[新聞] 導演親自確認《馴龍高手 3》為大結局　小'
content: "導演親自確認《馴龍高手 3》為大結局　小嗝嗝將要思考失去「沒牙」的後果！\n\n由夢工廠動畫在 2010 開啟的動畫電影系列《馴龍高手》（How\
  \ to Train Your Dragon）\n，男主角小嗝嗝（Hiccup）與他的坐騎之龍沒牙（Toothless）的搭檔廣受到觀眾喜愛。\n距離上一部《馴龍高手\
  \ 2》已經是 4 年前的事情了，明年我們終於要迎來《馴龍高手 3\n：隱藏的世界》（How To Train Your Dragon: The Hidden\
  \ World）的上映，現在官方又\n於 Entertainment Weekly 釋出獨家劇照，讓我們一探《馴龍高手 3》的最新畫面。\n\n《馴龍高手 3》劇情描述小嗝嗝和女友亞絲翠一起成為博克島（Berk\
  \ Island）上的維京\n村落首領，而沒牙也成為了龍族的老大，但當他們各自成為領導者時，卻要面對更大的威\n脅以及一隻白色日煞（Light Fury）的現身，這些改變都會讓他們將為著自己的同伴做出\n\
  不同的抉擇。\n\n在這一篇專文報導中，官方也確認《馴龍高手 3》會是這部系列電影的大結局，指出這一\n集將會「成為刻劃他們生命成長歷程的史詩三部曲」。導演迪恩·戴布洛伊（Dean\n\
  DeBlois）表示：「這是我們計劃了很久的結局，我認為以這個結局來告別《馴龍高手》\n這些角色，是一個正確的方式，當然也苦樂參半的（bittersweet）。沒牙將會有女朋友\n\
  的劇情，這不只是一條支線，這會讓沒牙更相信自己的天性，因此小嗝嗝就要被迫去思考\n，如果沒有了沒牙，他自己要成為怎麼的領袖。」\n\n「在《馴龍高手 3》也會解開一些謎題，像是為什麽預告中小嗝嗝說了一句\"\
  在我還是個\n小男孩時，世界上是有龍的。\"，這會帶給結局什麼樣的影響？一切都會在這部電影中解\n答。」同時小嗝嗝的父親大塊頭史圖伊克也會出現在《馴龍高手 3》閃回畫面中，當年大\n\
  塊頭史圖伊克選擇站在眾人的立場攻擊龍族的故鄉，而小嗝嗝則是開放了人與龍族之間的\n關係，但隨著小嗝嗝成長，他發現博克島也因為與龍族的過度親密而逐漸與外界的人類世\n\
  界脫節。\n\n在《馴龍高手 3》小嗝嗝臉上也會開始出現鬍渣，最終更留起了落腮鬍，象徵著我們透過\n電影一路見證了小嗝嗝從小男孩到男人之間的成長。導演迪恩·戴布洛伊的訪談似乎預告\n\
  了《馴龍高手 3》將會出現令人感傷的劇情，就讓我們一起期待在《馴龍高手 3》於\n2019 年 2 月 1 日在台灣上映。\n\n\n\n--\n\n那個男人，臉上永遠有著捉摸不透的悲傷微笑。竹鼠們不知道他為什麼會那樣的殘忍，總\n\
  是莫須有地給自己扣上「中暑、內外傷、長太肥、長太瘦、憂鬱症」的荒謬病因，反正那\n個男人一開口，所有竹鼠的數量就會少一隻。\n竹鼠們都很慌張，大家都在討論要不要集體出逃，離開這個鬼地方。\
  \ \n \n\n--"
