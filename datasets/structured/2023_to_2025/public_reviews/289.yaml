title: '[負雷] 馴龍高手'
content: '把美好的記憶留在動畫裡吧



  那個族長 (小嗝嗝的爸爸) 比較像壞人吧? 要殺害龍 啊夜煞就不是龍喔?

  那個至尊龍 明明就完全沒有得罪到誰 舉村所有人都要殺了牠

  夜煞的尾巴也沒交代是如何做成 那個小嗝嗝就突然變成了悲劇英雄

  而且最後面自己的右腳截肢了還笑得這麼開心很像中樂透一樣...

  很多不合理的劇情都沒交代清楚

  不知道怎麼吐槽 今天下午看完 我連發負雷都懶得發了

  把時間和錢省下來 去看馴龍高手動畫版第一集就好了


  --


  那個....那個.....實現我的夢想(小聲)  摸你的頭  欺負你到哭


  --'
