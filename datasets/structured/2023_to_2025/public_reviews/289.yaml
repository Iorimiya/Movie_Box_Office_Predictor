url: https://www.ptt.cc/bbs/movie/M.1549700551.A.507.html
title: '[負雷] 馴龍高手3 - 但我還是流了兩滴淚'
content: "1.影片名稱 : 馴龍高手3\n\n2.觀影時間 : 108年 元月初三（國曆不知道幾號）\n\n3.觀影地點 : 新竹大遠百威秀影城\n\n\
  4.觀影方式 : 自行購票\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n優點：\n\n1. 動畫精細，沙、人物臉上的汗毛都栩栩如生。\n\n2. 敵人弱到跟智障一樣，完全不會有心理負擔。\n\n3. Toothless真的好像我家的貓。\n\
  \n缺點：\n\n1. 求偶片段長到快睡著，這部劇情實在弱到不行。\n\n2. 將主要敵人描述的跟神一樣，事實上他的潛入、置放陷阱確實都跟神一樣，但是\n\n\
  後來幾個沒什麼鍛鍊過的小屁孩就能把他大軍幹掉，實在沒有說服力。另外，身為酋\n\n長，都靠身邊的精衛隊，底下那些壯男只會吵沒戰力，不考慮都砍頭嗎？\n\n3.\
  \ Light Fury也跟智障一樣，她其實也沒必要一直跟Toothless糾纏，因為對於Toothless\n\n來說Light Fury是唯一的，但是Light\
  \ Fury心裡應該明白在世界的盡頭事實上她們根本\n\n沒絕種；但想吐槽的還有，麻醉針功效很不一，有時候時效很長，有時候又很短，有\n\n時候讓人睡著，有時候又是控制功能。\n\
  \n4. 幾個笑點一直重複，實在令人不耐，有些電影會故意強調笑點，後面再來個畫龍點睛\n\n，像是這次的Mary Poppings的大砲（詳細就不說了），但是這次這部電影許多笑點一直\n\
  \n重複最後也沒有破梗，實在不需要一直重複，像是：\n\n        A. Number 2 一直強調自己很猛\n\n        B. 鬍子男強調自己鬍子多（這可能稍微有一點，因為後來因為鬍子被揭穿而\n\
  \n        爆發，但還是強度不夠）\n\n        C. 小雖龍（這也稍微有一點，但也是強度不夠，強調太多次）\n\n\n\n結論：\n\n1.\
  \ 反正過年也沒太多好電影，逃離親戚群看看還可以\n\n2. 但如果你有很多事情，建議你不要浪費時間看\n\n3. 如果要好心情，建議你看愛滿人間，音樂劇情都好很多，大人小孩都歡喜。\n\
  \n補哭點：\n\n男主角從Light Fury身上放她自由，帶著反派往下掉的時候。\n\n\n\n\n\n\n\n--\n有點想看 又有點沒動力\n一個人的解藥\
  \ 是另一個人的毒藥\n我也努力撐著\n世界的盡頭 可能還有夜煞\n畢竟也有別的光煞了\n完全沒用心呀 但動畫師還是很努力\nMoana也沒啥劇情\n但是用音樂彌補一切\n\
  以及有看頭的配角\n第二部的反派 真的精彩\n根本金剛戰士\n除了那個殺龍大師\n其他反派也是沒存在感\n乾脆不要出來 浪費時間\n不過不出來 可能求偶片段又更多\n\
  因為根本沒用心設計戰鬥 其實短一點也好\n第一集真的是經典\n第二集至少有媽媽+大反派龍 記憶點多一些"
