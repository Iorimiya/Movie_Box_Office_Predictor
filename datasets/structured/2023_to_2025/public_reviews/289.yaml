title: '[討論] 《馴龍高手》電影新預告'
content: '《馴龍高手》電影新預告




  在荒蕪粗獷的博克島上，維京人與龍族是世代相傳的宿敵。


  但是小嗝嗝卻與眾不同。作為族長大塊頭史圖依克（傑瑞德巴特勒飾）


  充滿創意卻不被重視的兒子，小嗝嗝打破數百年來的傳統，


  和一隻令人畏懼的夜煞－沒牙－成為好朋友。他們出乎意料的深厚友情


  不但揭露了龍族的真正本性，同時也動搖了整個維京社會的根基


  --'
