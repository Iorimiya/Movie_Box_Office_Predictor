url: https://www.ptt.cc/bbs/movie/M.1749645717.A.C14.html
title: '[好雷] 馴龍高手 2025'
content: '台中場大遠百 剛看完IMAX3D


  覺得不用看到3D，果然當年的體驗無法複製


  突然想到忘了說明為何不用看3D

  其實他的3D做得不錯，景深立體感很讚

  但主要是原本最期待的試飛，這次的攝影變更為較多的搖晃

  不像舊版比較屬於固定視角，視覺呈現上相對弱化很多


  所以我才會說無法複製當年的體驗


  先靠杯一件事，順便當防雷


  他媽的我坐H16


  你H18的是在幹三小？？ 操你媽當電影院自己家隨便看隨便滑手機不用管其他人是不是


  我都講過一次你到底有沒有要看電影了還一直看手機


  你H17朋友也說你手機螢幕開太亮人家都看得到


  你白爛到還繼續滑，是以為你螢幕調暗就不會影響到人


  媽的爛人




  基本上就是完全照著動畫版的分鏡，然後額外添加了一些細節


  在完全照著拍的情況下，非常吃演員的演技


  這次翻拍史圖伊克、小嗝嗝、亞絲翠這三位比重吃重

  其他演員就都各司其職


  傑瑞德演的爸爸史圖伊克不用說，就是完全本人

  畢竟動畫聲配就是他，變成真人版

  我想沒人比他更了解這個角色


  至於小嗝嗝的演員梅森塔姆斯，必須說我完全不認識他

  但是他演的小嗝嗝我認為很到位，缺點就是帥了一點

  但考慮到續集如果媽媽真的請到凱特布蘭琪，帥了一點也是可以

  況且動畫在第二集開始確實慢慢變帥了，哈



  飾演亞絲翠的妮可帕克

  老實說第一時間知道時確實是擔心

  但我記得我看到幕後花絮的一些片段後，認為好像還不錯

  今天看完後覺得其實選他來演亞絲翠也是可以的

  有演出動畫前期的亞絲翠那股狠勁的感覺


  但中後期轉折確實是如一些人所說跟小嗝嗝的演員好像沒什麼化學反應


  不知道是不是導演想要刻意抓那種青少年間的那種尷尬感

  畢竟亞絲翠在前期是很鄙視小嗝嗝的，但她因為被綁架後發現自己好像有那麼點喜歡上小

  嗝嗝後有點彆扭


  不過演技確實還是要再加強


  鼻涕粗跟魚腳司沒什麼問題，就跟動畫同個性格

  比較不爽的是悍夫納特跟暴芙納特

  雙胞胎組男的就符合動畫形象，女的就硬要弄相反有點不懂

  不過還能拿來開媽媽認不出來這玩笑就算了



  最後沒牙還是跟動畫一樣可愛

  綁架亞絲翠那邊，小嗝嗝先被打後親那邊

  沒牙先是看到被打被小嗝嗝嘴，直接一臉干我屁事（笑死

  後面被親直接演了一個還不是靠我，不然你要是能把到的臉（真不愧是兄弟




  這次真人版原導演下來導真的是與其被人搞爆

  不如自己下來好好對待自己的寶貝


  不能說沒有缺點，但在今年一眾真人改編之下

  已經是最維持原始作品的核心價值了





  PS

  最可惜的大概就是Jonsi 這次沒回歸吧

  John Powell這次都回歸了

  屬於靈魂之一的Jonsi 沒回來真的覺得少了什麼






  在這邊幫女主講下話


  其實她真的是耐看型的，雖然不是第一眼你看到就會覺得美若天仙

  但看久了會覺得她其實蠻漂亮的

  加上我自己看了一下他們的宣傳，他們兩人搭在一起氛圍還不錯


  所以目前我是傾向導演想抓在他們剛好處在青少年時期尷尬彆扭



  最後是我知道她最近有個發言會讓人覺得不爽

  這幾年DEI確實過頭會讓人害怕

  但實際上女主的選角在實際看完成品之後並不覺得是有過度的問題



  我們原作粉絲確實是都想看到原汁原味的選角

  但不能否認的是，當今選擇下來的就是她

  我自己也很愛亞絲翠，超級喜歡那種

  但今天看完後我覺得這選角目前並不會讓我討厭

  也從中找到喜歡的一些新東西



  雖然前陣子她的發言讓人感覺或許傲慢

  但以一個20歲的演員，碰上這幾年反噬DEI的大浪潮

  難免不會被大量仇恨訊息淹沒

  她講這些話，已經算是得體的了


  畢竟我們也不希望演員自己出問題

  當然有些太白目到不行的例外（某黑雪）


  -----

  Sent from JPTT on my iPhone


  --





  --'
