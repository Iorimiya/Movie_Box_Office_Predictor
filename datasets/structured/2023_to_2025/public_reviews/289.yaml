url: https://www.ptt.cc/bbs/movie/M.1750327573.A.22C.html
title: '[好無雷] 馴龍高手與現實的反思心得'
content: '文長 裡面可能有教育意涵防雷

  如果不習慣可以直接左轉謝謝

  雖然大家應該都知道動畫版在演什麼了哈


  剛剛看完真人版

  跟動畫有9成像

  選角個人認為沒有DEI 給推

  如前面板友都討論的Astrid的選角跟動畫有差

  其他劇情 節奏 取景都跟動畫電影版符合


  看過動畫1-3的觀眾

  在一些劇情和經典配樂應該有點感動


  就拿花束般的戀愛裡有提到動畫改編真人版的議題

  這部整體真的蠻還原電影版原作

  比想像中成功


  最後片尾的一睹北愛爾蘭的自然景觀頗為震撼

  跟之前看影集outlander的蘇格蘭取景一樣

  景觀優美，會讓人想衝動旅遊的感覺


  接下來想敘述一下觀影心得和現實生活的反思吧

  有看過動畫版的應該都知道

  恐懼對於族人來說產生什麼行為

  在台灣，甚至人類

  在現實生活中，對於生物的恐懼

  都來自於不了解和無知


  人類對於未知生物總是具有防備心

  這也無法避免

  畢竟也有電影提到「恐懼是驅使人類進步的原因」

  但是哪部電影我就忘了XD


  現實生活中

  除非是可愛動物

  人類在既有觀點或是前人流傳下來的習俗與教育

  皆對蛇類、爬蟲動物、鯊魚

  等肉食動物有所誤解


  但如馴龍高手的劇情一樣

  很多對生物的打殺都是沒必要的

  因為對生物未知習性的恐懼

  而產生有錯誤，長久下來的污名化觀念

  一旦放下既有成見

  慢慢觀察和防備心態，也可以發現生物的行為也只是基於生存本能


  (不好意思這邊想藉機生態教育一下)


  舉凡大部分蛇類很少主動攻擊人

  即便是毒蛇或是顏色鮮豔的警示功能

  也是基於生存本能所演化

  毒液也只是備而不用

  除非真的「受到威脅」或是掠食

  才會使用，不然基於生存本能或生命威脅沒必要浪費在根本食用不了的人類身上


  很多時候，人跟蛇其實靠得很近

  蛇無攻擊行為下

  人只是因為沒看到蛇所以不會恐懼

  所以人對蛇的恐懼不是來自於蛇是否會攻擊

  而是來自於人的自我意識


  所以現實生活中如馴龍高手Hiccup的行為跟族人久遠傳下來的教育與既有觀念衝突

  很多蛇類、鯊魚等肉食生物都被蛇類在生態中扮演吃老鼠的重要角色長期污名化


  但其實我們不一定要學習

  How to train the snakes or sharks


  我們只要看到牠們驅趕或迴避遠離

  好一點 願意的話遠距離慢慢觀察就好了

  不要打死 拜託了


  在家看到用掃把引導進入畚箕放入水桶或布袋

  蛇類在生態系中扮演重要的吃老鼠角色


  給點活路行不行！不要趕盡殺絕啊(功夫的台詞)


  相對老一輩的既有觀念污名化

  蛇類其實怕人類怕得要死

  看到比自己提醒大幾十倍的動物誰不會怕呢

  想比我們怕蛇  他更怕人類


  呼應馴龍高手，族群對龍的污名化恐懼

  應該也是有8成像吧


  --------------


  順帶一題流浪貓狗的議題

  希望看到這邊的板友不要餵食流浪貓狗

  覺得可愛在能力允許下直接帶回家養


  自從禁止安樂死，加上大家看到可愛貓狗餵食流浪貓狗

  野外的流浪貓狗族群越來越大

  除了餵食後食物引來蟑螂老鼠蝸牛的問題

  吃飽喝足就會去咬一些鳥類 穿山甲等動物

  當娛樂

  已經嚴重壓縮的山羌 石虎 穿山甲等

  原生種的生存空間了


  打那麼多，大概就是我的廢話心得了

  希望看到這的各位多少能放下對蛇或其他生物的恐懼，感謝各位







  --'
