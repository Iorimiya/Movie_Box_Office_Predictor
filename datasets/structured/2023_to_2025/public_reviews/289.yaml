url: https://www.ptt.cc/bbs/movie/M.1743691866.A.C11.html
title: '[新聞] 真人版《馴龍高手》外媒好評熱烈！選角'
content: '真人版《馴龍高手》外媒好評熱烈！選角完美、感動到哭、忠於原作、不像其它真人化電

  影那麼空虛




  由原版電影三部曲的編導-狄恩德布魯（Dean DeBlois）回歸掌舵的《馴龍高手》（How

  to Train Your Dragon）真人版電影，今天在 Cinema Con 舉行了媒體試映會，而環球影

  業也馬上開放有參與放映的各界媒體在網路上分享第一手的簡評觀後感，就目前的整體風

  向來看，本片的口碑是偏正面的，雖然不免有提及一些瑕疵，但大致是好評居多。



  「《馴龍高手》是很棒的動畫真人改編，加入了一些可補強原有劇情的小細節。梅森泰姆

  斯和妮蔻帕克絕妙化身為屬於他們的小嗝嗝和亞絲翠，傑瑞德巴特勒則是全片最讓我喜歡

  的部份。還有，我很高興能再聽見主題曲。」



  「《馴龍高手》重拍版完全符合你原先的期待。它不像其它真人電影那樣很明顯地毫無靈

  魂，這點我會給他大力稱讚，而且片中不時有震撼的奇觀出現。不過，它最終仍然沒有完

  全擺脫掉存在感多餘的感受。」



  「身為一個沒看過動畫版三部曲的人，我覺得真人版《馴龍記》電影滿好看的！妮蔻帕克

  和傑瑞德巴特勒是全片兩大亮點，攝影技術也很強大！」



  「《馴龍高手》可能是我看過的最忠於原作的動畫真人改編作品之一。準確的卡司選角、

  畫風有抓到平衡的龍族設計，絕對都不會讓你感到出戲，還有配樂也很強。你一定不會想

  錯過這部電影，我也想養一條龍啦！」



  「真人版《馴龍高手》幾乎各方面都捕捉到原作的魔力，經典橋段都沒漏，所有的感動和

  刺激都保留了，眾演員也獻出精彩表演。我唯一想抱怨的是新劇情，雖然還不錯、很巧妙

  ，但始終沒將電影提升到足夠的高度。」



  「《馴龍高手》精美重塑了史上最受歡迎的動畫電影之一，全片充滿著真摯情感，為了引

  介給新一代的觀眾，他們透過令人驚嘆的視覺效果、引人入勝的故事，將最初造就原作如

  此獨特的要素推向新高度。」



  「《馴龍高手》是迄今為止最棒的真人改編電影之一。整個觀影過程中，我都開心地嘴角

  上揚。這將成為影史上一部會讓人們討論很久的其中一部電影。我需要更多沒牙！」



  「《馴龍高手》2025 年版將原作的所有魅力，提升到了我從未想過它能達到的水平。卡

  司表現出色，龍族也非常可愛，我已經記不清自己到底哭了多少次。這真是一部很驚奇的

  電影。」



  「《馴龍高手》太棒了！ 迄今最棒的真人改編電影之一，但我還是比較喜歡動畫版啦。

  演員選角堪稱完美，情感刻劃觸動人心。多虧於出色的表演和角色的互動關係，我深深地

  將情感投射了進去，並再一次地愛上了沒牙。這是非常紮實的電影，值得在最大的銀幕上

  觀賞。」



  本片主演卡司囊括：飾演「小嗝嗝」的梅森泰姆斯（Mason Thames）、飾演「亞絲翠」的

  妮蔻帕克（Nico Parker）、飾演「戈伯」的尼克佛洛斯特（Nick Frost）、飾演「魚腳

  司」的朱利安丹尼森（Julian Dennison），在動畫版配音「史圖依克」的傑瑞德巴特勒

  （Gerard Butler），則以真人姿態回歸飾演相同角色，原版三部曲的作曲家-約翰鮑威爾

  （John Powell）亦繼續替真人版操刀配樂。台美預定 06 月 13 日同步上映。




  --'
