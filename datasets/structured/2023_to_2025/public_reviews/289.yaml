url: https://www.ptt.cc/bbs/movie/M.1743092826.A.44B.html
title: '[新聞] 真人《馴龍高手》角色個人海報！「龍族」'
content: '真人電影版《馴龍高手》多款角色個人海報公開！一窺「龍族」清晰造型




  翻拍自夢工廠系列同名動畫系列的《馴龍高手》（How to Train Your Dragon）


  真人電影，今天正式釋出了角色專屬的個人海報，觀眾可以瞧見除了「沒牙」以外，


  其他龍族要角更為清晰的造型。








  真人版《馴龍高手》依舊由原版電影三部曲的編導-狄恩德布魯


  （Dean DeBlois）繼續自編自導，並由催生過《阿拉丁》（Aladdin）、


  《小美人魚》（The Little Mermaid）、《時尚惡女：庫伊拉》（Cruella）


  等迪士尼真人化作品的製片人馬克普拉特（Marc Platt）坐鎮監製


  本片主演卡司囊括：飾演「小嗝嗝」的梅森泰姆斯（Mason Thames）、


  飾演「亞絲翠」的妮蔻帕克（Nico Parker）、飾演「戈伯」的尼克佛洛斯特


  （Nick Frost）、飾演「魚腳司」的朱利安丹尼森（Julian Dennison），


  在動畫版配音「史圖依克」的傑瑞德巴特勒（Gerard Butler），


  則以真人姿態回歸飾演相同角色，原版三部曲的作曲家-約翰鮑威爾


  （John Powell）亦繼續替真人版操刀配樂。台美預定 06 月 13 日同步上映。










  --'
