title: '[討論] 馴龍高手 真人版 小彩蛋 微雷'
content: '本身是動畫版粉絲

  上週看完4DX簡直爽死

  不過戴上3D眼鏡感覺整部電影背景很暗

  有些細節感覺看不清楚

  剛好想帶長輩再看一次

  選了IMAX

  雖然沒有4DX的動感

  但音效還是再度爽死一次



  ———防雷分隔線，彩蛋主要跟動畫第二集有關——-








  彩蛋1

  在動畫第一集電影中

  有很多龍的場面，永遠都是主角團的那幾隻種類的龍

  Monster nightmare, Deadly nadder, Hideous zippleback跟Gronckle四種龍,頂多是換

  個顏色再登場

  真人版電影大多也是這幾種類的龍加上Terrible terror撐場面

  不過真人版在Toothless帶Hiccup 跟Astrid去龍穴時

  有一幕Toothless躲在龍穴石壁上時

  後面有一隻Stormcutter啊啊啊

  是Hiccup他媽騎的Cloudjumper的同類啊啊啊啊



  彩蛋2

  仔細看Hiccup的右側下巴有一道疤痕

  是在動畫第二集中

  小時候他媽被Cloudjumper帶走的同一天

  不小心被Cloudjumper劃到的傷口啊!!!!



  好喜歡這些小細節

  二刷時仔細聽

  Hiccup跟Gobber的演員

  不管是在講話用詞或是語調的抑揚頓挫都很生動的還原了動畫角色


  真的好希望真人版會繼續拍第二集!



  --'
