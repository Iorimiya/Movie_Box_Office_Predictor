title: '[普雷] 馴龍高手3'
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  1.影片名稱 :馴龍高手3


  2.觀影時間 : 2019/01/16


  3.觀影地點 : 澳洲電影院


  4.觀影方式 : 自行購票



  §其他防雷說明(非必要) :

  本人英文差

  單純用主角動作猜大致劇情

  所以可能解說有誤差




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  此區為發文防雷頁

  可選擇性提供上列 1~4 資訊  或不提供亦可

  觀影心得於分隔線下方發布即可


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  因為看過前兩集

  第三集完結篇，理所當然會去看

  但是是在完全沒看預告片情況就去看這部

  只知道澳洲比其他國家早快一個月上映

  算是先給還沒看的大家

  說一下大約的劇情




  1.

  劇情非常簡單

  反派襲擊村落，想把龍全抓走

  主角想辦法救回來，就是這樣


  其他劇情很好猜

  看完後，爬了之前文章

  有些網友猜的劇情也幾乎都中


  其實這集重點就是一個主題【家】


  2.

  整個戰鬥格局並不大

  反派其實沒有很強大

  只有「一招」打天下



  3.

  風景很漂亮

  有些場景會讓人想用IMAX大螢幕去欣賞



  4.

  人類配角 其實可有可無


  記得第二集是說媽媽的故事

  這集媽媽也是有出來

  但在這集就是一個探路功能的腳色


  其他配角比較深刻的

  就是那位愛碎嘴的女生

  看到她碎嘴那段

  真的會超煩



  5.

  無牙  求偶片段真的超可愛


  光煞  比較像是「蝙蝠?!」


  。



  其他網友想問的都可以問

  我會把我「看」的懂的回答您們













  --'
