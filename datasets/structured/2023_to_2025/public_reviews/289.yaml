url: https://www.ptt.cc/bbs/movie/M.1549647686.A.A3C.html
title: ［微雷］馴龍高手3
content: "是說拋夫棄子一個人跑去看卡通也不是第一次了，但好歹都坐三望四了，跟同事說Friday\n night 要來看馴龍高手3，也被笑了一下xd\n這部也算是從嬸大學橫跨到生子的系列作，總是有點感情的，大概就跟這部的感情線一樣\n\
  濃（喂）以下防雷且不專業心得\n請大家多多包涵\n\n\n\n\n\n\n\n\n\n\n\n\n\n———防雷線———\n是說這系列作變成成長電影也是蠻意外的，應該是第一集票房太好，才啟了續集。\n\
  人跟龍（異物種）的電影經典之作不外乎侏羅紀公園或者金剛之類的，看到這只能說主角\n的背景已經註定分離的結局（門不當戶不對），但這畢竟是卡通還是要在乎兒童的觀感所\n\
  以結局仍是好的雖然兩位（相愛的）主角最後還是分開。\n什麼，小嗝嗝不是跟亞絲翠結婚嗎？夜煞不是跟光煞在一起嗎？不是各自happy ending嗎\n\n再複習一次電影名稱是馴龍高手，所以高手跟龍才是主角啊，從第一集到第二集根本偶像\n\
  劇情節，男主角失落在路上走著隨便打個靶就打中女主角（夜煞），一看天啊還是黑富美\n（至尊龍）根本天上掉下來的狗屎運，但黑富美那是那麼容易搞定的，經歷了千辛萬苦才\n\
  把他馴服愛他愛到什麼事都願意做，然後兩人共同冒險捍衛世界和平（第二集）根本愛情\n故事！第三集光煞一開始那麼討厭小嗝嗝應該就是吃醋吧哈哈，好啦拉回正題。\n放手是愛情最偉大的表現（怎麼又跳回愛情），失去是長大的必經之路，還有對自我的認\n\
  知都是成長的一部分（雖然她可能得到了爸媽和村民認同，但是自己對自己的認同他仍然\n很疑惑，最終他仍然是肯定了自己，克服了心魔）\n其實我覺得最有趣的地方在於每當小嗝嗝陷入對沒牙的歉意或該怎麼做的掙扎時，就會浮\n\
  現他小時候爸爸對他講的一些話（每次浮現這些畫面、我眼淚就快掉出來）小時候爸爸對\n小小嗝嗝講的話，或許他不是那麼懂或者似懂非懂，但當他面臨一些決擇時，這些話就會\n\
  浮現。很多人生的體悟的產生都是在經歷一些事之後。現在她也感受到了。（但為什麼要\n讓夜煞開始癡戀光煞後會出現爸爸對他說因為他最愛的人只有媽媽所以不會找新媽媽給他\n\
  ？還是我劇情亂跳xd,過度聯想了我）\n\n壞人的角色太過扁平就不要太苛責了，畢竟卡通裡的壞人只是為了讓主角的心靈再度提升\n和發現他真的愛的人是誰（喂）（很多卡通的壞人都很佛心來著，明明一開始就可以把人\n\
  都殺光，但總是有諸多理由拖延殺他們的理由，就跟佛地魔一樣的佛心，是說格林魔的大\n壞龍也很佛心，硫酸液這樣噴都和尾巴刀這樣刺都傷害不了主角和主角龍們）\n是說雖然小嗝嗝跟沒牙出生入死後，已經培養的深厚的感情但為了沒牙和其他的人不受貪\n\
  婪的人類傷害，最終還是分道揚鑣，只能說愛情最偉大的就是放手了。\n我也不是一直要偏向愛情電影，但最終沒牙和小嗝嗝兩個人都有生命危險的時候，小嗝嗝\n寧願犧牲自己也要救沒牙，這不是真愛是什麼啊（狂哭）\n\
  然後分道揚鑣多年後雙方都有自己的下一代，小嗝嗝還去世界的盡頭尋找沒牙，沒牙在洞\n裡就算了，這麼剛好就坐在世界盡頭的入口，小嗝嗝一來就看到了，不是每天都在那邊守\n\
  株待兔等他來嗎。根本就是用成長電影外殼包裝異物種愛情故事嘛（喂\n\n其實他還是冒險與成長電影啦，對自我的肯定和愛與勇氣什麼的（喂）都是我從這部電影\n得到的東西，愛情電影什麼的就當我亂腦補，腐女心態作祟，大家別當真\n\
  當然這部電影橫跨了我的青春，戲中的主角成長了，我也長大了（至少年紀大），對於一\n些主角的感覺不免有些投射（其實我夫是張桌子哈哈哈），卡通裡的主角總是富有愛與勇\n\
  氣，這或許是我都當嬸了還是很愛看卡通的原因，因為隨著年紀增長，愛與勇氣都是相對\n珍貴的（或許太迂腐了）但看這些卡通總是讓人霎時充滿希望。\n\n\n或許情節不像玩具總動員那麼細膩但還是\n\
  推薦大朋友小朋友都去看喔！沒牙那麼可愛！\n配樂也好好聽！\n\n\n--"
