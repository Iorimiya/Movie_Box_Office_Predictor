title: '[新聞] 上週票房:馴龍高手8300萬美金'
content: '新聞網址：



  「馴龍高手」上映首週開出神秘數字 $8300 萬美元亮眼成績，A24 的「天作之合」以 $

  神秘數字1200 萬美元的成績令人驚艷。


  馴龍高手，全球首週票房總計高達 神秘數字1.978 億美元。

  《馴龍高手》的製作成本為 1.5 億美元，行銷費用約為 1 億美元。


  派拉蒙影業的《不可能的任務：最終清算》（Mission: Impossible – The Final

  Reckoning）以 1,030 萬美元的票房位居第四，

  迄今在北美已累積 1.663 億美元，全球票房則達到 5.06 億美元。然而，考慮到其高達

  4 億美元的龐大預算，《最終清算》在院線上映期間卻無力擺脫虧損。


  不要問為什麼會有神秘數字，因為會被水桶


  --

  根據版規，低於一周的票房不可以貼，我看各位很想要被水桶喔!

  大膽違抗版主意旨檢舉人，到現在倫家守規矩了還嘲諷，太狠了吧老濕?

  老伯講話年輕人注意聽，要推文

  補血是推，你的手腦是不是....?

  噓兩次了喔，小心水桶'
