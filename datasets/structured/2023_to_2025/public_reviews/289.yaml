url: https://www.ptt.cc/bbs/movie/M.1749661896.A.234.html
title: '[無雷] 激推！馴龍高手4DX3D'
content: '剛看完神犬沒牙4DX 3D回來…絕激好評….


  進戲院前，員工拿眼鏡給我。


  「疑？眼鏡？」立體眼鏡？？？我坐下後再看了看手機APP上的票…ox咧是立體3D格式啊

  我的媽呀….有沒有十年沒有立體3D電影可以看了？？？（雖然我現在都玩VR頭盔立體3D

  遊戲）


  電影內容，這絕對是看過頂級的真人版電影了…原本神級的劇本分鏡本來就不需要修多少

  ，看的就是特效跟演員。


  先講特效：無死角。沒其他評語了…真人+特效毫無違和感！！上禮拜看了侏羅紀公園的

  預告，光看預告就覺得有點假，這部完全是頂啊我覺得，超感動！！！


  再來演員：

  優點：演技基本上我個人覺得都算很到位，神韻都有抓出來。

  缺點1：小嗝嗝有點太帥…少了呆萌感

  缺點2：亞斯翠個人覺得在某幾場戲感情稍微沒有到位，但是整體還是可以！其他父親跟

  師父還有一些跟班的表演也都非常好！


  有砍掉一些我很有印象的小鏡頭，也有增加一些這次版獨特的鏡頭。砍掉的地方雖然遺憾

  ，但增加的部分很有感覺，做得很好！


  強烈建議4DX3D ，現在的立體3D技術比起以前真的又前進好大一截！！眼鏡族如果沒有隱

  形眼鏡記得帶幾條小橡皮筋，把你的眼鏡跟立體眼鏡綁在一起，觀影會順利很多！


  沒牙最帥最可愛了QQ 剛剛趕忙又買了桃園的交響樂演奏特別場，一張票1700，這個月真

  的幾乎吃土…..


  --'
