url: https://www.ptt.cc/bbs/movie/M.1737380139.A.6D9.html
title: '[新聞] 真人版《馴龍高手》新預告 再現沒牙和小'
content: '真人版《馴龍高手》新預告 再現沒牙和小嗝嗝經典場景




  （大紀元記者葉子杰編譯報導）19日，環球影業釋出真人版《馴龍高手》（How to

  Train Your Dragon）新預告片，片中揭示了更多有關夜煞「沒牙」和小嗝嗝第一次見面

  ，以及更多維京人與龍戰鬥的經典場景。導演表示，這部片將是一場宏偉壯觀的冒險。


  在真人版電影《馴龍高手》的最新預告片中，可以看到龍和維京人的世界栩栩如生，該片

  翻拍自著名動畫《馴龍高手》三部曲，故事改編自克瑞西達‧科威爾（Cressida Cowell

  ）的系列叢書。該片由動畫原導演迪恩‧戴布洛伊（Dean DeBlois）再次執導，美國男白

  人演員梅森‧塔姆斯（Mason Thames）飾演小嗝嗝，而英國蘇格蘭演員傑瑞德‧巴特勒

  （Gerard Butler）飾演小嗝嗝的父親「史圖依克」。


  最新預告片：



  新預告片中展示了與龍戰鬥的經典場景和「沒牙」和小嗝嗝第一次見面的感人場面，忠實

  再現深受粉絲喜愛的經典場景，從小嗝嗝在沙子裡畫出「沒牙」的那一刻到「沒牙」好奇

  的反應及感人的行為。此外，預告片還展示了龍在戰場上細節，壯觀地呈現了維京人的動

  作和龍的表現。


  另外，此前環球影業也釋出了幕後花絮，可以看到塔姆斯和英國女演員尼可‧帕克

  （Nico Parker）聽到他們選上了「小嗝嗝」和「亞絲翠」一角的驚訝神情。


  巴特勒曾在原版動畫三部曲中為史圖依克配音，導演迪恩表示，這次他回歸演出真人版就

  像大塊頭史圖依克從動畫中走出來，活生生地出現在觀眾的面前。迪恩表示，這部片將是

  一場宏偉壯觀的冒險。




  據《Collider》報導，巴特勒在宣傳最新電影《鑽石大劫案：極盜戰》（Den of

  Thieves 2: Pantera） 接受《今夜娛樂》訪問時，談到了扮演史圖依克的感受。他坦言

  ，這個角色很有挑戰性，每天都要花幾個小時化妝，然後再花一個小時穿上戲服。他微笑

  說：「在最冷的那天，汗水濕透了身體，因為裡面就像火爐一樣。」。


  真人《馴龍高手》2025年6月13日在美國上映。


  --'
