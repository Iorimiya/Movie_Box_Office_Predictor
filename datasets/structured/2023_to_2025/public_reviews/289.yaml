title: 'Re: [新聞] 影迷不滿《馴龍高手》電影「亞絲翠」選角批評政治正確'
content: '妮科帕克是本身就比她老母白

  譚蒂紐頓本身就黑白混血

  一代一代淡化

  雖然並沒因此就變白人

  但劇照裡一看


  其實可以說基本不容易看出是黑人

  但周邊演員是很明顯的紅棕色

  或者相對清晰的棕色

  而不像她雜金棕

  而別張照片還是可以看到

  她亂髮內又藏著很明顯黑髒辮


  她日常打扮還是很習慣保留黑人特質

  但這部電影挑選族群

  她如果把這些黑人特質不要保留

  基本就可以說

  會看不太出來種族不太對

  但正因為為了多元保障

  不給她完整扮的更像北歐人

  或說變成更像原作女主是一種正確

  這就有點可惜




  -----

  Sent from JPTT on my Xiaomi 2410FPCC5G.


  --'
