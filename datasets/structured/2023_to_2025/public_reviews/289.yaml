title: '[新聞] 原版編導操刀！《馴龍高手》將翻拍真人版'
content: '新聞網址：


  原標題:



  Yahoo奇摩電影戲劇編輯部

  2023年02月16日



  【文／血紅蘭姆】夢工廠動畫《馴龍高手》如今將重返大銀幕，改以真人版電影之姿跟觀

  眾見面。



  改編自英國作家克瑞希達科威爾筆下同名系列小說，2010年動畫《馴龍高手》描述一名維

  京少年小嗝嗝整天夢想成為屠龍勇士，不過當他意外遇上了一頭受傷的飛龍沒牙時，這一

  人一龍竟然就此結為好友。



  首集電影不僅抱回了近五億美金的亮麗票房，更一舉入圍了奧斯卡最佳動畫長片和最佳原

  創配樂，因此接連推出了兩部續集電影，分別攻下了六億兩千萬美金和五億兩千五百萬美

  金，也都雙雙入圍奧斯卡最佳動畫長片，除此之外還推出了三齣外傳動畫影集。



  而在第三集上映四年之後，

  。根據好萊塢記者報指出，這部真人版新片將由動畫三部曲編導迪恩戴布洛伊自編

  自製自導，本片也將是他的真人版電影處女作。



  好萊塢記者報表示，就如同原始動畫三部曲一樣，

  ，並在這三者之間取得完

  美平衡。




  。如果真人版《馴龍高手》大

  開紅盤的話，我們。《馴龍高手》將

  於2025年3月14日上映。


  --


  又一部慘遭真人化!!??


  --'
