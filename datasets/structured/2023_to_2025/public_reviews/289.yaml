url: https://www.ptt.cc/bbs/movie/M.1749372545.A.962.html
title: '[好雷] 馴龍高手真人版 IMAX'
content: '剛好有空檔，想說帶小孩去看個電影


  沒想到馴龍高手真人的IMAX特映還有票


  今天美麗華這場大概也不到半滿


  而且感覺是電影荒


  前面預告片居然放馴龍高手XD


  你看的電影的預告片就是你看的電影Orz


  整體評價非常非常非常推薦


  首先如果你沒看過原版動畫


  也不要先去補，因為劇情一模一樣


  這點我就很羨慕我兒子


  因為他可能很久以前看過動畫但忘光了


  我自己也是印象很模糊但基本上沒有魔改


  場景整個都非常到位


  外景都是在北愛爾蘭或冰島的壯闊場景


  龍的CG也不會太突兀


  最重要的靈魂人物無牙也是非～常地可愛


  音樂的改編有搭配真人格局顯得壯闊


  但除了主題旋律其他不太有印象，算是不錯吧


  選角我覺得都很不錯


  都有抓到動畫版的精髓


  女主角有種....Zendaya的氣質？



  全片最大的亮點其實預告就有部分


  那段飛行在IMAX下真的相當過癮


  但某些畫面有一點點晃


  整體看完真的是不錯


  （註：IMAX並不是全部都是滿畫面，有些場景會縮）


  絕對是適合闔家觀賞


  現場小孩的反應也都蠻有趣的（親親....唉幽噁～）


  這片真的多加讓人有點「啥～」的反應的地方就是


  在這維京村子有個黑人跟亞裔


  然後他們大概各獲得2秒的螢幕時間


  說是什麼東方跟南方炎熱小島來的菁英之類


  這感覺就是很敷衍地完成一個多元的代辦清單XD


  算是值得嘉許（？）















  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  是說劇情都一樣還需要防雷嗎？XD


  即便早就看過了，但真人拍攝


  確實能引發一些悸動


  尤其是父子之間的互動


  畢竟現在是爸爸了，當初看的時候還是孩子XD


  對於小孩的期望與小孩的成長真的很有感觸


  族群之間的仇恨、和解，簡單帶過但也能讓小孩理解


  也可以趁機讓小孩知道身體殘缺還是有克服的方法



  所以說無牙到底是貓還是狗XD


  真的是太可愛了


  --'
