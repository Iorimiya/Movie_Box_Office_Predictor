title: '[好雷] 爆雷馴龍高手3'
content: '1.影片名稱 :馴龍高手3


  2.觀影時間 : 2/2


  3.觀影地點 : 遠百威秀


  4.觀影方式 :自行購票



  =

  =

  =

  =

  =


  >>>>>>>>>>大爆雷注意<<<<<<<<<<<<<


  =

  =

  =

  =

  =



  先說

  我是只看電影的腦粉

  只要沒牙賣萌行為都買單



  以下雷文

  文長注意

  可跳結論 最後一頁

  ======

  ======


  被第二集爸爸死掉影響

  觀影忐忑不安


  劇中Gobber忠告hiccup/剛到新島紮營時Valka單獨回頭看有沒被跟蹤，讓我內心flag滿

  滿



  沒立




  第一次帶隊衝進去Grimmel陣地的大混戰以為要發便當



  沒發






  還好都沒有


  年輕人就是年輕人  說衝就衝

  要不是媽媽跟跳跳雲很carry

  早就團滅了啊 XD

  -




  女生都很罩，不論是打團戰、被反派抓走或hiccup受挫時媽媽推Astrid去安慰


  都是女性推動劇情關鍵處




  反觀



  不是trust me就是lets go

  -



  反派


  除了Grimmel還有另外三人，看起來像同業友人不像小嘍嘍、前期鏡頭也滿多的

  以為會有驚人之舉or發言


  結果

  為了突顯Grimmel是一個頑皮龍廚

  -



  結局


  最後野放回歸自然的時候有哭

  哭的是好夥伴一路打拼為了幸福而分開


  重點是告訴粉絲


  「雖然分開了各組家庭，但友誼不變，好兄弟一輩子都是好兄弟，還是可以一起飛」


  你們都是我的翅膀

  的溫馨結局


  ps沒牙小孩中有兩隻黑白相間，很牛






  結論


  馴龍三部簡單說就是






  是極具生態教育意義的電影

  是從事keeper相關必看的電影(無誤)


  所以我給好雷


  --

  好像也通吼

  被圈養習慣的動物必須重新野放訓練，非易事且另外訓練成本。

  讓瀕危動物既使在人工環境也能有野性，確保就算野放也不會失去野外生存能力又滅絕，

  這是「異地保育」的ㄧ種工作

  我不清楚南非在野生動物投注的資源，但在台灣土地跟預算都是非常有限的

  真的邊看邊傻笑

  差不多，跟龍差很遠但也算野生動物xD

  但想到三寶騎龍…………瞬間冷靜

  這也是一個 保育團體vs野生動物走私集團的電影XD

  龍廚能量滿☆滿☆

  過年動畫片不用劇本只要賣萌夠可愛(才沒有

  按電影時間線，嗝培養了沒牙快十年，突然來一隻母整碗端走能不正嗎

  年後人少再看一次4Dx，那精美的風景

  真的插入很多對劇情不重要的累贅，明明沒他事硬要講幾句突顯存在感

  實在很粉絲向

  然後我還是吃下去了(欸

  以為hidden world最後是被嗝關起來，就合理銜接現代世界為什麼沒有龍(可以騎)

  不但沒有，嗝還帶妻小用一艘船就划到沒牙家門口

  所以這部很粉絲向

  嗝x沒牙可逆不可拆'
