title: 'Re: [好雷] 馴龍高手(2010)─解析〈試飛〉一節'
content: "大家好，我是這篇解析文的作者，\n\n自己的文章自己回。\n\n雖然我在文章最後看似一直在吐槽本片外加導演，\n\n但其實我超喜歡《馴龍高手》的喔。\n\
  \n\n\n\n\n承解析文最後，有沒有人想問：為什麼導演要做這種暗示呢？\n\n我想不會有人去問導演，導演當然也不會自己跳出來解釋，\n\n只不過身為創作者，我大概知道為什麼。\n\
  \n以下的說法純屬個人臆測，沒有任何根據，看看就好了：\n\n\n\n\n\n答案是因為很好玩啊！\n\n為什麼這麼說？因為我懂，我也喜歡做這種事情啊，\n\n\
  簡單講，這是導演給觀眾們的挑戰信，\n\n他自認為沒有人能夠看出在這邊偷偷隱藏起來的訊息，\n\n還在觀眾驚嘆本段的精彩之際，他就可以躲起來偷笑，\n\n但像我這種尋常可見、又普通的觀眾都看出來了，\n\
  \n想必一堆人都發現了吧，所以在真人電影版導演就縮了啊。\n\n\n\n\n\n另外在解析文中關於我個人反應的描寫，\n\n其實都是經過誇大且戲劇化的描述，我的真實反應並非如此。\n\
  \n我記得前陣子重看動畫版，發現這個暗示時的真實反應是：\n\n先是愣住，然後再一直狂笑，因為真的沒想到導演這麼敢啊，\n\n我想導演當初大概也沒想到《馴龍高手》會賣這麼好吧，\n\
  \n所以才會輕忽地對觀眾開了這種玩笑。\n\n\n\n\n\n反正後來就是秉持著「這件事不能只有我知道！」的想法，\n\n所以登登，我花了3個月寫了這篇解析文，\n\
  \n仔細想想，我也真是個有夠閒，又無聊的人啊。\n\n但也好奇問一下，在我揭露這個暗示之前，\n\n就已經有人發現或者知道這件事了嗎？\n\n\n\n\n\n\
  那麼最後我還有一件事想說，簡單講就是，\n\n我想寫一篇《馴龍高手》的同人小說，\n\n草稿也差不多擬好了，雖然現在還不能透漏太多，\n\n但嚴格說起來，這篇小說的主角是沒牙，而且我覺得故事很棒。\n\
  \n只不過問題是，我也知道《馴龍高手》算是小眾的作品，\n\n所以就算完成好像也沒有什麼合適的地方可以發表啊，\n\n要是有板友知道哪裡適合的話請讓我知道一下喔。\n\
  \n但先聲明，不會寫那麼快啦，至少也需要幾個月吧，\n\n只是希望到時候能有多一點人給予我回饋就是了。\n\n\n\n\n\n以上，謝謝各位看到這邊了。\n\n\
  \n--\n                                  12/07 11:38"
