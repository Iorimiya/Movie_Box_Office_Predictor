url: https://www.ptt.cc/bbs/movie/M.1270820875.A.583.html
title: '[好雷] 馴龍高手–喚醒你心中的小王子'
content: "BLOG圖文版：\n\n\n我非常非常喜歡這部電影。\n\n好久，沒有這樣觀影的感動…如果我有十分可以打，毫無疑問的「馴龍高手」將會是十分\n\
  。這是連我自己都十分訝異的，我不斷問自己為什麼？儘管近幾年我看了許許多多的電影\n，各式各樣的類型，然而「馴龍高手」所帶給我的，竟然是一種強烈的童年感動。\n\n\
  然後我開始想起幾年前，看「超人再起」時，我電影院後座的一對父母，將一對小孩放在\n我的肩膀上…這當然不是笑話，那兩個孩子緊緊抓著我又笑又鬧，可能只有五歲不到，然\n\
  後爬到我兩旁的座位上興奮的又叫又跳，因為事出突然，我整個愣住了。\n\n在愣住的那一瞬間，我忘記了很多電影院外的煩惱，看著兩個小孩大叫「超人萬歲！」，\n眼睛裡閃爍的光芒，我突然領悟：阿，這的確是我的初衷。\n\
  \n在我的心裡也有大喊著「超人萬歲！」的時刻，我要記住它，每一個wow的時刻，都為著\n生活帶來一點新鮮跟美好。那無關大人或是小孩，每個人心中一定都有閃閃發亮夢想：駕\n\
  駛著超酷的巨龍飛翔在極光之中、蒼穹之上，盡情翱翔，享受那種無拘無束的生活；我們\n之中的多數只是忘記了心中曾有那樣的赤子。\n\n這部夢工廠的年度鉅作，帶我們進入北歐神秘的國度，在極寒之境的博克城上盤旋，讓鋼\n\
  鐵與干戈在山壁上躍動出炙熱的光芒，並且藉由古老生物「龍」的牽引，告訴我們一段充\n滿細膩感情，又撼動人心的維京冒險傳說。\n\n\n\n一顆火球飛來！我們瘦弱的主角小嗝嗝飛也似的關上房門躲開衝擊。「別人家的害蟲可能\n\
  是蚊子或是什麼，我們這裡的則是…『龍』。」\n\n這個由Cressida Cowell的童書「How to Train Your Dragon」改編而成的電影，與原著\n\
  劇情有很大的不同，電影做的尤其出色的地方在於整個故事嚴謹的結構與豐富的感情。儘\n管這是一個所謂的「王道」故事，有著典型的敘事結構跟內容，你卻不會覺得老掉牙；透\n\
  過3D眼鏡呈現出來的是一個個精緻的場景，乍看之下人物跟龍比例都很有喜感，細節卻絕\n不馬虎。\n\n一開場的氣勢就相當有看頭，透過群龍攻擊村莊的場景直接解釋了維京人與龍族的相處之\n\
  道就是以牙還牙，互不相讓。在一群拿著斧頭奔跑的三百壯士中，我們的主角幾乎要瞇著\n眼睛才能瞥見他在人群裡氣喘呼呼推著推車奔跑得背影。\n\n\n他是小嗝嗝，瘦小無肉，連斧頭都舉不太動，在鬍子兄貴的眼裡簡直就像一根會說話的魚\n\
  骨頭。更糟的是，他還是最強壯維京人 – 首領的兒子。父親一直期許他成為屠龍高手，\n成為像他一樣無所畏懼、兇猛的戰士；而主角本身為了追求村民的認同，也夢想著成為一\n\
  個屠龍高手，這樣不僅能扭轉大家對他的看法，說不定暗戀的女孩也會注意到他。\n\n懷抱著夢想的主角卻一開始就備受打擊，老爸、長輩、同儕都看不起他，希望他乖乖關在\n\
  家門裡就好，可以省了大家的麻煩。然而主角從沒有甘心於窩在家裡，當別人都說「You\nCan’t」的時候，他用力推著石弩衝了出去，他說得話我至今仍然印象深刻：「沒有人看\n\
  過夜煞或是殺過一隻夜煞，因此我要做第一個。」\n\n\n小嗝嗝並不是個膽小無用之輩，他非常清楚自己是個怎麼樣的人；當別人認為他有什麼地\n方不對勁，指著他全身時，他卻拒絕這種「因為某處與眾人不同而整個人都遭受否定」的\n\
  認知。\n\n父親曾經自豪的將維京人的武器斧頭交給他，說這把斧頭就象徵你是我們的一份子；你拿\n著斧頭，就等於我們整個族人都在你手上，而我們也代表著你，這把斧頭就是維京人的象\n\
  徵！\n\n然而主角卻連斧頭都舉不太起來，他沒有粗壯有力的臂膀；這也代表著他無法承擔這種責\n任，因為這個因素，他始終無法得到父親的認可，父子間也幾乎沒有共通的話題。但是小\n\
  嗝嗝也沒有放棄彰顯自己的價值，他聲稱自己確實能夠屠龍，並且擅用了自己在煉鐵與鍛\n治方面的長才做了機動石弩，成功的利用這個石弩擊落了別人心目中不可能捕捉的夜煞。\n\
  \n在開場的20分鐘內，主角就展現他與眾不同價值給予所有觀眾知道，那就是「智慧」。其\n實他身上從不欠缺維京人天生的勇氣；他雖然少了一份肌肉，卻多了一份頭腦。這份智慧\n\
  讓他能以不同的角度去思考去行動，他始終知道自己的天賦給予了他與大家都不同的武器\n。\n\n也因此他從來無法像他爸爸小時候那樣聽話，看見石頭就把它撞成兩半；因為生物往不同\n\
  的趨向發展，這才是天生我材必有用的真諦。鐵匠工戈柏對主角的父親說：「你要相信他\n，而你所要做的就是準備好。」你生養了他，並不代表可以強迫他往你的路走，而應該準\n\
  備好，讓他往他的生存之道奮鬥。\n\n\n正因為小嗝嗝在這種環境下長大，當他眼前那隻巨大的黑龍張大著眼睛望著他時，拿著刀\n的他卻下不了手。事後女主角在望海的懸崖上問他：「當幾百年以來的維京人都會選擇殺\n\
  了那條龍時，為何你下不了手？我想要記住你的答案。」小嗝嗝先是承認自己膽小懦弱，\n但大家都知道那不是真正的答案，他嘆了一口氣說：\n\n「當我看著他，我知道他也在害怕…我看著他，就像看到我自己。」\n\
  \n這句意義深遠的話，真的深深震撼了戲院中的我…我心裡想著，這不就是所有「理解」的\n來源嗎？我們儘管來自不同的世界，但是我們在內心深處發現彼此的共同之處。那隻龍，\n\
  也與我在做同樣的掙扎嗎？無法融入群體的世界…同樣在為了生存奮鬥著，想要證明自己\n、想要榮耀自己、想要光明正大的活下去，這一點上我跟你又有什麼分別呢？\n\n\
  「Everything we know about them is wrong.」\n\n這是一個巨大的分歧點，也因此這部片不叫做屠龍高手，而叫做馴龍高手。它不僅敘述了\n\
  人與人的誤解與真實的感情，也描繪了人與生物那種共通的情感。\n\n\n而當你看見那隻漆黑的巨獸從霧中踱步而來；腳步好似黑貓一般優雅，翼翅展若蝙蝠般神\n秘，眼神又如寵物一般可愛，充滿著好奇與純真。這一定讓你想起了家中寵物那溫柔的模\n\
  樣，當牠睜大眼睛試圖模仿主角的表情時，我們都不禁會心一笑。這隻極具魅力的龍確實\n與別種龍族有著相當的不同，他看似溫和，又相當致命而兇猛；看似天真，卻又滿腦子的\n\
  鬼靈精怪。這怎麼叫我們不愛上這隻「沒牙」呢？\n\n從卸除武裝並給予好處這個友善的動作開始，這對人龍的感情就急速的拉近。他們一同吃\n魚、一同在地板上畫圖、裝出奇怪的表情。這些模仿的動作都在加強彼此的聯繫與理解，\n\
  如果仔細觀察幼童，他們一切的學習都從模仿開始，「理解」也是一樣，這部電影在這裡\n用優美的配樂跟場景切換砌出最原始的心靈交會火花。\n\n一人一龍最終藉由肢體上親密的碰觸建立了一份堅固的信任，這種信任是關係中最為親密\n\
  也最為難得的羈絆，這表示我認可你，你也認可我。這是一份「I see you」的呈現，不\n需要多餘的言語保證，我們就是朋友。\n\n\n由於電影以如此自然的方式呈現，我們幾乎略過了所有人際中的不愉快與誤解，平滑的順\n\
  著劇情一路拾階而上。小嗝嗝發現沒牙無法飛行的關鍵在於尾翼的缺陷，因此他運用了自\n己的才能順利做出相符的尾翼，最後還製作出合適的座椅與尾翼切風角度的變換機構，無\n\
  論從哪方面看他都是這方面的天才。\n\n他們成功的取得了彼此的信任，並且更進一步的彌補了彼此心中的缺陷。當鏡頭置於主角\n後方，我們隨著沒牙展翅飛入萬里的長空，在雲端盡情翱翔；接著墜入迷霧的海岸礁石，\n\
  在石洞與粼粼的波光中間忽左忽右的穿梭；隨著劇情的推展，後座還多了奧絲翠，我們繼\n續上飆到夕陽光暈中淺淡的雲層捕捉朦朧的迷霧，又一個轉身，我們潛入了夜幕的薄紗中\n\
  ，在滿天星斗與極光下伸展我們的毛孔，徜徉每一個浪漫的時刻。\n\n\n管弦樂團激情又溫柔的演奏，帶給我好久不曾擁有的體驗。曾經在我很小的時候，我也會\n像那些孩子們大叫「Go\
  \ Baby！！」「Wowww！！」「Hell ya！！」，這部電影成功的讓\n我回到了那時的夢幻迷人，讓那些只能在夢中追憶的飛行時刻一一成真。如果我們要重拾\n\
  一些不在乎是否稚氣的夢想，這些時刻真的讓我一時間胸口塞滿感動。\n\n你知道的，不必忍受別人指著自己說你與別人不同；不用忍受失望的眼神望向天空。儘管\n這只是短短地幾十分鐘，這部維京少年的冒險故事再度提醒了我好多好多已經忘記的事。\n\
  \n在一個講求創意的年代，我們也許不必總是敘述嶄新的概念或是奇詭的劇情，把奇特帶入\n觀眾的腦海。也許我們需要的沒有想像中這麼多，一個富有感情的老梗故事，卻以全新的\n\
  活力帶領你回想起你從未忘記，只是想不起來的熱血，這也許才是我們心中真正想獲得的\n娛樂。\n\n它告訴你以另外一個角度面對現實的故事，告訴你有另一種方法的可能，告訴了你也許路\n\
  不是走到盡頭，而是該轉彎了。\n\n\n當小嗝嗝越來越成功，越來越受村民認同的同時；一向對主角失望的父親終於能夠進入兒\n子那不符合他身材的房間，以他的角度來對話。然而觀眾都可以注意到他們的立場就如同\n\
  身高一樣仍然是一高一低的，這代表著父子間的地位、族群中的地位、社會上的地位以及\n認知的差異。\n\n相對於熱情的老爸，自卑的小嗝嗝卻是語塞的無法道出真相，他無法眼睜睜的讓父親失望\n\
  ，特別是接受了一個老戰士來自母親的胸甲頭盔傳承，對首領來說，這象徵著你終於跟我\n一樣，是一個戰士。對於一個男生來說，想要追尋父親(尤其是偉大的父親)的認同往往都\n\
  是一輩子的事…這裡應該許多人都心有戚戚焉。\n\n但是他無法說謊，他理解到不能靠謊言來尋求理解的一天終於來臨了，於是他在競技場上\n卸下全身的武裝，說了「我不像他們。」想當然爾真相的代價是殘酷的，對於族群之間的\n\
  仇恨與偏見，鴻溝沒有想像中來的好彌補，特別是在傳統與多數的束縛下，想要逆流而行\n更是難上加難。\n\n\n最後小嗝嗝被禁足，沒牙被綁起來帶去龍巢，通常整個社會的錘釘子行為會在這裡劃下句\n\
  點。多數人甚至沒有第二次表達與證明的機會就被抹煞了。幸好有女主角奧絲翠的支持\n(Astrid，丹麥語，象徵神聖的力量。)讓他理解到他的確「已經證明」了一些東西，雖然\n\
  他是幾百年第一個沒有屠龍的維京人，但也是第一個騎龍的維京人。這需要面對恐懼與未\n知的勇氣，就很多角度來說，這比單純的殺一隻龍要來的更加困難。\n\n既然已經冒了一次險，第二次險看起來也沒有這麼嚇人。少年龍騎士隊就這樣出發去拯救\n\
  他們的老子們，這也可說是新世代反傳統的革命吧。面對一隻超級巨大沒有盲點的巨龍，\n所有維京戰士們使勁了渾身解數，我們看見了他們渾身是膽的勇氣，在大怪物的面前，父\n\
  親跟戈柏居然還在挑釁牠！當然少年屠龍隊不會讓我們的大鬍子吃鱉，馬上帥氣的登場解\n決了危機。\n\n\n最後的大決鬥可說是魄力滿點，尤其在父親親自跳下水去解救沒牙的那一瞬間，我們看見\n\
  了一個勇於認錯的父親，當他老人家滿臉溼潤，面有愧色的抓住小嗝嗝說：「你是我兒子\n，我以你為榮」時，我承認我都快飆淚了，這個橋段我真是無法忘懷。\n\n小嗝嗝則是回頭說：「我知道，爸，我也是維京人。」接著衝向天際，這實在只有熱血阿\n\
  阿阿！！「This is Vikings！！」\n\n沒牙的黑翼切過厚重的雲層，與巨龍在天空搏鬥，巨龍的火焰彷彿要燒遍天空，然而沒牙\n在雲間高速的飛行，左突右刺不斷偷襲，飛燄與閃電在天空交響如同冰與火之歌，連大地\n\
  都為之振動。\n\n最後以「龍族的嘴巴裡不防火」這個同樣透過理解得來的知識絕地大反攻，墜地前一顆電\n光火球硬生生以逆轉之勢噴進巨龍的嘴巴裡造成後天吞嚥困難，在火光與爆炸中落地，急\n\
  速脫出的沒牙與小嗝嗝仍然被尾巴掃中，落入火海…沒牙迴身搶救，一人一龍在火海中隨\n著地心引力定格可謂經典場景，整部戲可謂毫無冷場，精彩萬分。\n\n\n結尾的時候，小嗝嗝活了下來，卻損失了一個腳掌。我看見主角深深地吸了一口氣然後些\n\
  許難過的眼神，心中卻欽佩製作群這不完美中的完美。你怎麼可能毫髮無傷的存活過每一\n場戰鬥？其中必定要有犧牲，然而這樣的缺陷背後隱藏著一個戰士的榮耀。其實前面戈柏\n\
  在夜晚火光前的故事就說明了一切。\n\n一個瘸腿的小子跟少了一半尾翼的黑龍，這兩個生物卻能完美的互補，這才是一段關係中\n最美的一段。我有缺陷，你也有缺陷，但這不重要，重要的是我們在一起完美無缺，這才\n\
  是人生中許多羈絆的見證不是嗎？\n\n\n\n\n我不禁想起了法國聖修柏理筆下的「小王子」裡狐狸說得話：\n\n狐狸：我的生活非常無聊，我捉雞，人類捉我。所有的雞看起來都一樣，所有的人類看起\n\
  來也都一樣。這是很自然的情形，我感到挺煩悶的。但假如你「馴養」我了，那將會像陽\n光照耀我的人生。我將會知道你的腳步聲與其他腳步聲的不同，其他腳步聲會讓我趕緊躲\n\
  到地下去，但你的腳步聲卻會像音樂似的喚起我，讓我離開洞穴．\n\n狐狸：你看那遠處的麥田，我不吃麵包的；對我來說麥子一點用處也沒，麥田也是一樣。\n但如果你「馴養」了我，那金黃色的麥田，就會讓我想起你頭髮的顏色，我將想起你，我\n\
  也將愛上聆聽麥田上的風聲。 狐狸：所以，請你「馴養」我。\n\nxxx\n\n小王子：我要怎麼做才能「馴養」你呢？\n\n狐狸：你要很有耐心，首先你要坐在離我有點距離的地方，就像這樣，在草地上。我會像\n\
  站在街角看你般，而你一句話也沒說。語言啊！是所有有誤解的來源。還有你每天都要離\n我近一點，每天．．．．\n\n狐狸：你最好每天都在同一個時間回來。比如你都在下午四點來，但我在下午三點的時候\n\
  ，就會開始快樂了起來，因為時間愈來愈逼近，我會變得愈來愈快樂。到了四點我會緊張\n的活踫亂跳，告訴你我有多快樂。可是如果你隨時都會來，我的心就不會準備為你感到喜\n\
  悅．．．這就像是進行一場儀式般．．．\n\n\n小王子：什麼是「儀式」？\n\n狐狸：那也是常被忽略的動作。「儀式」就是讓每一天看起來不同於每一天，每小時不同\n\
  與每小時。比如說，在獵人之中，星期四他們跟村子裡的女孩跳舞，對我來說星期四就是\n很棒的一天，我可以在葡萄園裡散步；但如果獵人們隨時都在跳舞，日子就每天都一樣，\n\
  那我就沒假期可言了。\n\n於是小王子馴養了狐狸。\n\n狐狸：喔！我要哭了。\n\n小王子：那是你的錯，我從來都不想你受傷的，但你要我馴養你．．．\n\n狐狸：是啊，沒錯。\n\
  \n小王子：可是你要哭了。\n\n狐狸：是啊，沒錯。\n\n小王子：「馴養」對你一點好處都沒有。\n\n狐狸：不，它對我是好的。因為我會想起麥田的顏色。\n\n\
  狐狸：走吧，再去看看玫瑰。你將會了解你的玫瑰是世上獨一無二的。然後再回來跟我說\n再見，我會告訴你一個秘密，做為禮物。\n\nxxx\n\n狐狸：再見了。我要給你的禮物，只是一個很簡單的秘密，那就是「只有用心才能真正地\n\
  看清楚，本質上的東西眼睛是看不見的． It is only with the heart that one can\nsee rightly; what is\
  \ essential is invisible to the eye．」\n\n\n我想我在「馴龍高手」這部電影上也看了類似的東西，而這個「馴養」的概念在「小王子\n\
  」上最為深切，透過這個概念去看人與人或是人與世界的關聯，會驚覺我們的眼界竟然如\n此狹小，很多事情被視為理所當然就不再改變；很多事情只有用心才能看的清楚，我們是\n\
  否見到事物的本質了呢？。\n\n在這個「主流」壓過「非主流」的社會中，「非主流」的漸漸連發聲也不能，故事中的主\n角小嗝嗝證明自己與眾人的不同，而成功的發揚出自己生命的價值；在我們的世界中，我\n\
  們又有沒有能力去接受不一樣的人不一樣的聲音呢？我們指著某個人的與大家不同的「怪\n」，是不是又指著他全身呢？(完全否定他這個人)這都是值得我們深思的。\n\n\
  我只能說我好久沒有像今天這樣，迫不急待的打出自己的心得與大家分享。也好久沒有這\n樣努力的尋找電影的原聲帶，畢竟配樂實在太出色了。\n\n究其原因，整部電影超乎想像的用心與細節，自然的將許多寓意包涵在簡單的橋段，逗趣\n\
  的人物與龍族設計、獨特的幽默感，即使看了第二遍都有嶄新的發現；溫暖的人龍之情、\n溫馨的父子之情與輕快有活力的故事、精彩刺激的空戰，都讓我們重拾自己的赤子之心，\n\
  喚醒我們心中的小王子。\n\n\n夢工廠的許多動畫都十分傑出，今年則是成功的藉由這部「馴龍高手」打出一個漂亮的代\n表作，也成功的佔據了我心中近幾年最佳電影的位置。我必須承認這部電影不在於要告訴\n\
  你什麼新的東西，而是要提醒你已經遺忘的東西。\n\n那可能是太皎潔的月亮，太遙遠的夢想、太陡峭的山上。\n\n你站在哪裡，心中滿懷喜悅，知道你也會笑著說：\n\n\
  「WOwww YA！！」\n\n\n\n\n--\n\n不需要刻意找答案。再說，答案根本不存在。\n\n一切都只不過是「自己真的盡情地做過了嗎？」而已。\n\n\
