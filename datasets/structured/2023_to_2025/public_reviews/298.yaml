title: '[  雷] 小子難纏 空手道傳奇'
content: "雷文防雷資訊頁\n \n \n \n雷文防雷資訊頁\n \n \n \n雷文防雷資訊頁\n \n \n \n \n沒看過1984的老版\n不過這個版本直接看也可以\n\
  \ \n \n不知道是不是外國的月亮比較圓這句話也適用於國外，本片在爛蕃茄得到蕃茄58爆米花91的\n分數(順帶一提我上次看的囍宴蕃茄87爆米花84)\n \n\
  似乎英語系國家就是愛亞洲味，只要來點功夫或者舞獅分數就會往上加一些。儘管我們這裡\n還有豆瓣是一片罵聲。果然就是文化差異吧\n \n劇情講的就是一個融合\n不論是這部片用了漢語、英語甚至日語\n\
  武術方面有功夫、空手道\n \n \n一開始看片長不是很長可能會不好看\n至少劇情還算是流暢\n打戲很多，算精彩\n但是最後參加比賽、打大BOSS的理由有點薄弱\n\
  \ \n整體來說可以看，也有娛樂性\n \n另外我對成龍沒什麼意見，有些人可能不是很喜歡就是\n \n \n個人主觀評分：7.7/10\n \n \n--\n\
  好像有吧 就反派"
