title: '[超大負雷] 小子難纏-空手道傳奇就是部大鬧劇！'
content: '剛看完“小子難纏”，真的超難看，超級大爛片！


  劇情膚淺又非常不合理。基本上看到男主說要教披薩爸功夫就已經開始出戲了。明明男主

  才剛打輸五區冠軍，那你到底是哪來的自信還可以教人家功夫？而且還是個前職業拳擊手

  ？更別說空手道和拳擊根本就是兩門完全不同的武術，男主根本就不懂拳擊，這樣還能在

  擂台邊做起指導教練來了？什麼鬼？


  女主的感情線也很莫明其妙，明明在地鐵偶遇時眼神還對這個前男友充滿不奈，結果接下

  來就看她跟前男友你儂我儂？然後到了拳擊比賽後台又說她想跟男主發展新關係？這是破

  麻吧？


  雷夫馬其歐本來不是說絕對不會去紐約嗎？那後來怎麼還是去了？轉折點是什麼？沒講。


  韓師父特地去琉球請雷夫出山，結果人真的來紐約了卻在教男主功夫時還在爭“誰才是那

  比較強的樹枝”？你既然這麼行那就你自己敎就好了啊，脫褲子放屁？而且也沒說為什麼

  非要男主學宮城派的空手道不可，只因為要讓雷夫露臉？靠！


  最後打贏反派的絕招也是前面就知道了，那還有什麼觀影的驚喜可言？為什麼小子難纏本

  傳當時會讓人覺得好看，就是雷夫最後打贏的絕招出乎人意料之外又讓人印象深刻啊！那

  你現在前面都講白了，我看大決鬥是在看心酸的喔？


  總之這部電影的槽點真的太多了，簡單三個字講，就是“爛透了”！不要說進電影院是浪

  費錢，我看連看串流都是在浪費生命！


  我只能說成龍你完蛋了，以後你就是票房毒藥了，難怪這部片的全球票房慘不忍睹！


  你完了不是因為你老了打不動了，而是這麼爛的劇本你竟然會OK ？


  真的會被氣死，浪費了我260元，幹！


  --'
