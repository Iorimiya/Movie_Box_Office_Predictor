title: '[好雷] 《男孩．賽車．性醜聞》好雷推薦'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《男孩．賽車．性醜聞》好雷影評：性少數和性醜聞一樣，需要躲藏。\n\
  \n不刻意煽情，是它最難能可貴的地方。除了歸功導演的安排鋪陳，\n\n\n「性醜聞」是電影名翻譯中最吸睛的字眼，但它的篇幅卻相當地低。同性、師生、禁忌戀\n，讓人期待深沉的情感糾葛、道德感情的利益拉扯，電影中的呈現卻非常平順直接。輿論\n\
  爆炸、焚毀的機車、情人的冷漠。\n\n我很喜歡電影把篇幅，留給喬喬死後的餘波。\n\n死後的他蒼白冰冷，回憶依舊鮮活。他們口中罪大惡極的「faggie」死了，卻無人感到開\n\
  心。兇手擦乾鱷魚眼淚，邀請威利完成最後的比賽。他們的友情、喬喬之死以及繼承遺志\n的贖罪，都只是為了完成父親的「陽剛夢想」。\n\n死亡只能讓旁觀者閉嘴沉默，卻未能鬆動快速疊加的歧視成見。一如社會對性醜聞的常見\n\
  論調，要嘛激烈批判，要嘛閉口不談。然而\n\n\n《男孩．賽車．性醜聞》也談到喬喬和威利的堅實友情，以及如何放下過去、迎接新生。\n不做任何的美化包裝，因為整理與告別往往困難且緩慢。\n\
  \n現實無情又殘酷的背叛，襯托出少數情誼的美好動人。我們都可能是少數、在做自己與社\n會價值的平衡間，不小心摔得粉身碎骨。\n\n最後我跟著威利駛離未完成的賽道，一邊拾起一\n\
  邊放下，不疾不徐，練習抬頭向前看。\n-\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n圖片提供：原創娛樂\n\n\
  --\n                             03/19 13:42\n認真好看喔～\n這部片克制的很有美感\n帶出演員的青澀真誠"
