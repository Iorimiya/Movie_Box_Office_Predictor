content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  侏羅紀世界 一直都是爆米花電影


  我的確高興的嗑完一包爆米花


  這點給過


  侏羅紀世界 在把恐龍放到野外與人類共生後


  其實我不太看好 後續劇情


  不過這集有凹回來 野外恐龍病死到只剩部分地區有 又回到原始設定 我覺得凹的不錯


  給過


  綜觀劇情 雖然有兩群人 不過其實故事本質上是呈現線性的 有點太單調


  讓整部劇情單純就是遇到恐龍 過關


  這樣的劇情 跟其他集比 有點太單純


  這點不給過


  再來 滄龍大小應該有問題 依照前集設定


  滄龍應該要可以吞掉船吧 這邊稍微吃書


  不給過


  暴龍睡懶覺 這邊 很可愛 又有傳統侏羅紀的暴龍追逐片段 這點非常優


  至於最後的變種恐龍 醜到爆 我不行

  不給過


  綜合起來 只能給普雷


  --'
