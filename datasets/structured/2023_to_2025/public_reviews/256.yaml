url: https://www.ptt.cc/bbs/movie/M.1753365162.A.A40.html
title: '[普好雷] 侏羅紀世界：重生'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  有耳聞這部片普遍評價很爛

  怕被雷沒有去看哪裡爛

  就沒有抱太大期待



  整個就是恐龍沒人感興趣了所以變成浪浪的世界

  這時候就要提到那個愛媽小朋友亂餵野生小恐龍居然沒出事警世

  一直在等他們因為小恐龍出事沒有等到 (政治錯誤?)


  還有這一家人還以為在最初的船難或他們救完他當完劇情觸發器就下去了

  結果不知道為啥活到最後

  私心希望砍掉他們戲份多點恐龍也好


  還以為暴龍後面還會出來(不一定是要跟異形龍打)


  另一團應該是女主的那一團整體就覺得還行

  一開始幫船長坑那個有錢人完

  另一位來還想演一次發現已經談完了蠻好笑的

  那個宅宅看見恐龍時雀躍跟興奮表現得還不錯


  島上恐龍會那麼醜也算是符合前面說的前提吧

  「那邊是雜交基改失敗太醜沒人喜歡的恐龍被丟在島上」

  (領養代替購買)


  可能因為我本身就喜歡恐龍有濾鏡

  (加上有幾幕有嚇到跟我一起去看的人)

  所以結論整體上覺得還行吧


  但的確還有進步空間

  希望繼續加油


  10月等遊戲的3代出了應該還是會買



  --'
