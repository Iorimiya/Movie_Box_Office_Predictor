url: https://www.ptt.cc/bbs/movie/M.1752140833.A.CCE.html
title: '[普雷] 七重點看《侏羅紀世界：重生》消費恐龍'
content: '網頁版點這裡：








  看更多電影點這裡：
















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  自從1993年《侏羅紀公園(Jurassic Park)》開啟了恐龍熱潮至今，侏儸紀電影系列也已經超過30個年頭了！


  原以為上一部《侏羅紀世界：統霸天下(Jurassic World Dominion)》沒意外應該就是這系列的結局之作，沒想到「環球影業」竟又在2025年毫無預警地推出該系列第7部作品，《侏羅紀世界：重生(Jurassic
  World Rebirth)》！還真的是很不按照牌理出牌呢，不過既然牌都掀了，就讓我們親自見證一下這一步棋究竟是驚喜還是驚嚇吧！



  重點一：我沒看過侏儸紀系列電影


  電影標題中所用的「重生」二字，其實也暗示了這部電影將開啟一條全新的故事線。雖然為了賣情懷還是會蹭一下前作們的設定啦，但也不至於影響劇情走向，因此就算是從未接觸過恐龍電影的朋友們也可以很輕易地理解劇情。當然，如果是侏儸紀電影的粉絲，應該可以找到更多「侏儸紀公園」以及「侏儸紀世界」系列的小彩蛋。



  重點二：眼大肚小的設定


  《侏羅紀世界：重生》最大的問題在於，意圖開啟多條支線故事以增加電影的精采度，但現實的骨感讓劇組到最後只解完了主線任務...而那些被爛尾的支線故事包含：花時間鋪成主角悲慘的過去、設計小女孩與恐龍寶寶的互動、營造最終boss，名為「D
  rex」的變異恐龍的壓迫感等等，這些東西全部都講一半是怎樣？我就好奇導演你一開始到底是計畫塞多少內容啊？



  重點三：情懷確定永遠賣不膩？


  這邊主要強調的情懷是配樂，畢竟任誰都沒想過竟然有兩首專門為恐龍所製作的旋律可以從1993年沿用至今？聽見孰悉的旋律確實能夠勾起粉絲們初見恐龍電影時的感動與回憶，偶爾使用一、兩次還可以當作是一種致敬橋段或是滿足粉絲的設計感。但當這些曲子頻繁地出現在每一部續作時，難道劇組就不怕引發觀眾們的審美疲勞嗎？



  重點四：怎麼恐龍好像有點醜


  版上對於本次恐龍造型最有意見的無非就是那隻名為「D rex」的變異恐龍了。說句冒犯的話，我確實也有些搞不清我看的究竟是恐龍電影還是異形電影了...不過這也不能算劇組的鍋，畢竟《侏羅紀世界：重生》的背景設定就是量產各種基因融合及改造的恐龍。並不是說不能讓你們天馬行空的設計變異恐龍，但你們就不能將恐龍設計的好看一點嗎？



  重點五：出任務到底危不危險？


  依照系列電影的前例，一旦跟恐龍扯上關係的任務大都會出現不少犧牲或是受傷的場面，藉此營造出電影的驚悚與危機感。但這一部不知道出了什麼問題？要不就是犧牲的太草率，要不就是毫髮無傷？整場戲掛掉的沒幾個，受傷的好像也就1人？整群主角團共計11人，死傷數加起來竟然連總人數的一半都不到？到底是這場任務的危險係數太低，還是主角群的威能開太大啊？



  重點六：智商堪憂的團隊


  《侏羅紀世界：重生》有很多沒苦硬吃的橋段，像是明明有樓梯走硬要玩垂降；明明已知要出任務，全程也沒見他們帶幾件武器防身？另外也有一些令觀眾困惑的行為，像是恐龍學家直接站在龐大的草食恐龍下方也不怕被踩死；平民明知海域中有恐龍卻毫無防備的駛進等等。其他不勝枚舉的吐嘈點就交給有看過電影的朋友自行發掘了，不得不說這群人能夠不團滅地完成任務也算得上是奇蹟了......



  重點七：Scarlett妳盡力了！


  這部電影最大的賣點除了恐龍之外，應該就是「Scarlett Johansson(史嘉蕾·喬韓森)」，畢竟有著復仇者聯盟「黑寡婦」的光環加持，請她來拍這部動作片倒也頗具說服力。比較可惜的是，由於該部電影需要聚焦的角色太多，再加上恐龍的戲份也不能落下，導致她雖身處C位卻沒什麼可拿得出來說嘴的高光時刻。儘管如此，她也算是為自己圓了一個夢，畢竟恐龍電影也不是任誰都可以拍得到的啊！



  《侏羅紀世界：重生》雖然有著不少的槽點，還有許多虎頭蛇尾的設定，但整體故事的走向還算流暢，中途發生的事件也非常符合爽片該有的元素。雖然跟《侏羅紀公園》與《侏羅紀世界(Jurassic
  World)》這兩部神作比起來確實相形見拙，但整體來說作為一部爆米花電影倒也是綽綽有餘。


  最後，原以為《侏羅紀世界：重生》會為了續集的商業價值安排片尾畫面，殊不知直到字幕跑完都沒見到這個操作，難不成是電影商終於良心發現不應該再繼續消費恐龍了嗎？






