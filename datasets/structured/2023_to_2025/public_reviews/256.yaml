url: https://www.ptt.cc/bbs/movie/M.1751435551.A.693.html
title: '[ 好雷] 侏羅紀世界：重生'
content: '本片為侏羅紀公園系列電影的第七集

  (片長134分鐘,非常考驗膀胱)

  先說結論是比上集好看,算是獨立於系列外之作

  所以主角全換人,連恐龍也變不一樣

  以下有雷...


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~











  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  35年前在某島上的恐龍實驗室發生意外,至今已變廢墟

  另恐龍因不適應地球天氣而大量死亡,只有少數還在赤道活動

  而人們對恐龍也不感興趣了...


  所謂的重生亦即重組DNA,簡單說就是不同物種間的雜交

  好創造出新恐龍,目的竟是吸引觀眾...


  而本片的主角任務則是為了治療心臟病,需取出三種恐龍的血

  必須是空中,陸上及海上的最大型恐龍,因它們的心臟最大也最長壽

  依序是滄龍,腕龍跟風神翼龍


  第一是滄龍,過程刺激也遇到另一個求救的家庭

  船隻被脊龍跟滄龍攻擊被迫上岸,也有同伴掛了並跟家庭失散


  島上已無人居住,恐龍則是實驗失敗的作品

  所以看到的恐龍,會跟之前系列電影中的不太相同


  任務組去取溫馴的腕龍血非常容易,因他們正在XX...

  再來是家庭遇暴龍攻擊,過程非常驚險

  任務組則去取翼龍的卵中液體,此時又有人領便當

  所有人在舊基地重逢,即是35年前發生意外的實驗室


  在這遇到變形的翼龍

  及本片中最大型,但也是最醜陋的重組迅猛龍霸王龍=D-Rex

  它的頭跟異形一樣長,眼睛卻非常小...


  結局就不透露了,只能說是美好的,主角們也違反任務...


  本片沒有恐龍間的決鬥,幾乎都是大吃小,人遇恐龍則多逃難

  最後給本片80分,喜歡看恐龍的還是可以看看


  (片尾沒彩蛋不用等啦！)


  --'
