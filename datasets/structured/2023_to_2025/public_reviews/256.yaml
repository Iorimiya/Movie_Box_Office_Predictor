content: '《侏羅紀世界：重生》採新視角編劇 驚奇又刺激




  （大紀元記者葉子杰編譯報導）當地2日，編劇大衛‧柯普透露了續集電影《侏羅紀世界

  ：重生》與前三部曲不同的地方，男女主角喬納森‧拜利和史嘉蕾‧喬韓森也證實，該片

  充滿了驚奇，同時也有很多緊張刺激的場景。


  備受觀眾期待的大電影《侏羅紀世界：重生》（Jurassic World: Rebirth）即將於7月2

  日在美國上映。據《帝國》雜誌報導，編劇大衛‧柯普（David Koepp）表示新電影與之

  前的《侏羅紀世界》三部曲有所不同。此前，恐龍是在人類環境中的情境，現在將讓人類

  探索牠們的環境。英國男演員喬納森‧拜利（Jonathan Bailey）和美國女演員史嘉蕾‧

  喬韓森（Scarlett Johansson）也證實續集旨在慶祝原版電影。


  柯普說：「前幾部電影是在探討『嘿，如果恐龍來到我們的世界裡會怎樣？』的這個想法

  。他們拍得很好，現在我們則想要回到恐龍的世界裡面，去體驗那種感覺。我們想重新找

  回我們身處於恐龍環境中的那種感受。」


  在《重生》電影中，拜利飾演古生物學家博士，喬韓森飾演一名秘密行動專家，而編劇柯

  普則撰寫過原版《侏羅紀公園》（Jurassic Park）三部曲中的第一、二部電影的劇本。

  拜利說：「這部片真的讓人感覺像是在邀請大家一起來慶祝原版的電影。它保有那份驚奇

  與敬畏感，同時也不怕重現那種刺激和恐懼的元素。」


  喬韓森補充說：「這部電影會讓人回想起第一部電影，裡面有很多很棒的驚嚇橋段，且緊

  張刺激的劇情讓人感受到高度的危險感。」為了重現氛圍他們飛到泰國叢林深處拍攝。拜

  利說：「真的有很危險的水蛇從我們身邊游過，所以那種恐懼感和腎上腺素的刺激感真的

  是非常真實的。」


  另外，導演蓋瑞斯‧愛德華（Gareth Edwards）透露《重生》的恐龍主角是「Distortus

  Rex」，又名「D-Rex」。愛德華說，牠有點像H‧R‧吉格爾（H.R. Giger）設計的霸王龍

  ，與星際大戰中的「龍戈獸」（Rancor）交配出來的樣子。


  然而，《重生》中的恐龍群並不僅限於霸王龍，柯普曾這樣描述長著翅膀的變龍：「翼龍

  與迅猛龍的結合體，這些都來自我的突發奇想。」「我們在之前的一些《侏羅紀世界》電

  影中看到，他們的實驗讓恐龍變得更大、更兇猛、更可怕，但我和（該系列製片人）史蒂

  芬‧史匹柏都覺得，這些實驗不可能全都順利成功。」


  --'
