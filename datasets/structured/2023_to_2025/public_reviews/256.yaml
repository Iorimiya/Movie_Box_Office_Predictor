url: https://www.ptt.cc/bbs/movie/M.1752603152.A.DDC.html
title: '[好雷] 侏羅紀世界：重生 Jurassic World: Rebirth (2025 美國片)'
content: "本月影院可看《超人》但孩子不認識超人外的超級英雄，不過七年前幼稚園時認識很多恐龍甚至對古生物學分類如數家珍，當然無論影評高低就是要看《侏羅紀世界：重生》！結果孩子從頭到尾聚精會神屏息凝神從沒有冷場、出場還對劇情如數家珍對恐龍使用也各有見解、看完一部電影既讓他心得滿滿當然給\
  \ [好雷] 無誤！不過相較之下整個系列我以大人眼光最愛還是《侏羅紀世界》第一集與第二集... 今天看《侏羅紀世界：重生》，覺得整體好像雖有核心價值卻沒有完整敘事綿密支撐，但沒挖深的片段提點仍給我很多靈感，至於「恐影幢幢」的驚悚感我覺得還更勝前作。\n\
  \n\n\n        失落世代，已恐龍疲乏\n\n首先本片的「恐龍情境」已與過去大不同：過去好像不是「遊園危機」就是「博士落難」跑給恐龍追、凡有「特種部隊」多半若非反派就是免洗\
  \ XD 主角還是要弱者來當，但這集直接讓「寡姐」Scarlett Johansson穿個吊嘎演個傭兵還玩世不恭吊兒郎當！記得以前山姆尼爾演貧窮博士聽到贊助就按捺不住心下竊喜、這次寡姐也是「一個十與六個零」就眼睛一亮，之後也沒在演就挑明了說「我要的是錢、你要的是錢、你則要所有的錢」大家犯險登島尋覓恐龍擺明為的就這個！看來本片人們已進入一個「理想虛無」的爛命年代，同樣地「恐龍夢碎」一個時代已走向夕陽：\n\
  \n\n片中所提的「32年前」基因工程初再現恐龍、也正是戲外 1993 年《侏羅紀公園》上映的年代，當年我們現世無數大小朋友讚嘆驚艷打開一扇窗、日後二十年養了全新一代「古生物學家」不但自己圓夢還靠電影熱潮拿到更多經費更有研究量能！只是如今過了\
  \ 32 年這「恐龍熱潮」在戲內戲外有無消退的跡象？戲外有沒有這我不知道，七八年前我家孩子小時恐龍熱潮是方興未艾，現在家有小幼生的家長們又覺得現狀如何呢？但戲內的《侏羅紀世界：重生》已經過上集《侏羅紀世界：統霸天下》到處都是恐龍的榮景與亂象，顯然此時人人都已看膩受夠\
  \ XD 恐龍館已乏人問津。\n\n\n\n        恐龍旅程，已世故流俗\n\n本劇幾位主角當中少數文藝路線的 Henry博士，看他年紀也許就是 1993\
  \ 那波「恐龍熱潮」所激勵出的古生物學家新兵？結果如今人到中年卻迎來「恐龍疲乏」博物館一天才賣十幾張票... 不管本片接下來冒險旅程將遭遇什麼、讓他重拾熱情重燃希望看到人們再愛恐龍就是他救贖！話說本片眾生有任何「熱愛恐龍」的徵象嗎？(1)\
  \ 藥廠代表 Krebs生意做很大時間是金錢，看到「雷龍塞車」翻個白眼渾身不耐煩，如今熱潮退去的恐龍對他來說就是「剩餘價值」還能開發新藥再賺一筆！(2) 寡姐\
  \ Zora 雙眼就是「錢」從沒在遮掩，背後有其創傷但解決方法就「賺最後一把」。\n\n\n(3) 同負創傷但韜光養晦的走私客 Kincaid初堅持拒絕後語氣鬆動，與其說是寡姐趁亂喊價跟他唱雙簧？不如說是兩人創傷如何療癒須相伴探索。(4)\
  \ 初出海不久已鎖定目標，卻遇海難事件是「救人優先」或唯利是圖？Ed Skrein 飾演的第三位傭兵 Atwater才不像他們婦人之仁婆婆媽媽！(5) 救到翻船民眾卻不先後送、反而帶著逆天犯險\
  \ (!)簡直「侏羅紀版《白鯨記》」苦苦相逼等巨獸反噬！(6) 只被主角追這麼一回，為何彷彿老經驗般與分進合擊以人類為敵？在此只提了句「彷彿當我們是競爭者」應已有其他人類海上活動令牠們隱忍已久。\n\
  \n\n\n        親炙恐龍，令你心眼開？\n\n在此棘龍吃的兩位配角，與其說有什麼惡行惡狀或自大傲慢甚或欺負小動物？不如說更像是這個時代「拋棄恐龍」或其他「生態剝削」的集體不仁剛好反噬到他們身上。然而上了小島稍事喘息靜下心來攜手共渡時，這個對恐龍缺愛也對未來絕望的「失落世代」仍將找回一點心底的火花：(7)\
  \ 有隻角龍寶寶孤身一龍找女孩賣萌！我一眼驚呼滿心期待上演「原角龍 vs 迅猛龍」經典大對決！後來才知不是 1.8m 原角龍的走失寶寶、而是的 0.6m 成年型態...\
  \ 雖然上個十年都教「野生動物別帶回家」但在這絕望世代燃起女孩希望 <3 老爸都願破例一回呀。\n\n\n(8) 鷹角龍寶寶只是小女孩前菜，真正攝影配樂火力全開重拾純真的還是蜥腳類！有別於《侏羅紀公園》令人一見傾心打開視野的腕龍學長，本片泰坦巨龍有更優雅長尾更細緻動作\
  \ <3 彷彿「恐龍版《阿凡達》」般四肢百骸都是情意流動！「這可不是天天看到」「一輩子都未必得見」眼看大地生機如此純真、反觀我們人類庸碌汲營又在幹什麼？(9)\
  \ 一直被寡姐捉弄挑逗的科宅博士 Henry終於囁嚅告白了，非關浪漫愛情卻是人情道義：這一回即使有人犧牲仍不虛此行，但未來血清交給藥廠獨厚那 1%？不如把恐龍恩賜\
  \ open source 讓全民共享！\n\n\n(10)經典主角在本片就客串一場，其實就一夜好眠起床漱口準備吃隔夜早餐，遇到幾個人類也未必是心血來潮想打牙祭\
  \ XD 更可能是對半隻櫛龍的「屍體爭奪」不容侵門踏戶！不然看看那隻面帶驚惶恫嚇正妹又是在幹嘛... (11)在此看似無關緊要的兩代男子 Men's talk\
  \ 亦有其世代諭示：生在 2000s豐衣足食無憂無慮長大的這代，人生沒有試煉卻被譏為「草莓」啞巴吃黃蓮，但危難當前二話不說為愛赴湯蹈火 <3 連自命鐵打過來老氣橫秋的上代長輩都刮目相看：你們這代好命長大被嘲諷久了，但切莫照單全收更別任由嘲諷定義你人格！\n\
  \n\n\n        恐龍之愛，只鏡花水月？\n\n(12)然而這趟採血之旅本就是逆天，逆到最大「登高垂降」不找翼龍媽媽竟然來偷翼龍蛋！在此犧牲個法語小咖也只能說是天經地義。倒是築巢之處竟彷彿神廟格局、此地有無阿茲特克傳統自帶冥冥天意那就未可知...\
  \ 只是此前抽恐龍血偷翼龍蛋都還只是吐吐舌頭對不住就好，接下來才是「人類暴行」殘龍以逞只是為了「錢」：(13)隨著多年前恐龍熱潮越演越烈、侏羅紀世界正式開放遊客越來越多、消費者口味越來越重\
  \ (!)逼得恐龍研發推陳出新永恆炒作下一波商機！誰知如今「恐龍疲乏」造成大肆棄養 QQ 更別說還有更無人聞問。\n\n\n比較可惜的是本片末段端出這些「基改變種」恣意拼貼已成四不像，對我們觀眾來說是醜陋巨獸毫無經典恐龍的期待、在電影中則是震撼教育驚則驚已卻雷大雨小、並沒像《侏羅紀世界》那般「自然對決人慾」最後交給命運的決戰啟示、只剩藥廠奸角自大貪念惡貫滿盈算小快人心...\
  \ (15)難道片末啟示就是寡姐喊話「咱們就來 open source」讓恐龍恩賜澤被全民？我個人認為儘管片末虎頭蛇尾拍得很模糊，但綜觀全片還是在訴求庸碌心累的中年世代找回純真的理想初衷、也訴求成長平順的千禧世代別憂讒畏譏更別顧影自憐、只要找回「恐龍之愛」仍有機會喚回人生的熱情！\n\
  \n\n\n回想上一回的「恐龍之愛」是否在「侏羅紀世界」隆重開幕後就漸漸忘卻了初衷？變成一場動物奇觀甚或寵物熱潮 XD 最後搞出一堆基改怪龍如喪家之犬？想想現世人們對寵物往往一時跟風不久就棄養、現世爸媽生養小孩也時有熱情幾年就後繼無力、是否亦如片中「恐龍退潮」一般任其茫然漂泊只想眼不見為淨？本片「以龍喻人」的人情寓意仍值得深思！只是以敘事完整來說我覺得比起《侏羅紀世界》第一集與第二集都差了一截...\
  \ 但一群精悍傭兵滿嘴幹話深入叢林恐影幢幢 (!)是比《侏羅紀世界》更接近初代《侏羅紀公園》的驚悚片味道！仍強力推薦闔家欣賞。\n\n\n--\n這種熱血喊話當然是男女主角喊給對方聽的啦，不然歷劫歸來怎有心情默契一起滾床單？"
