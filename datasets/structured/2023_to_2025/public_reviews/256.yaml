title: '[好娛樂雷] 《侏羅紀世界：重生》 大滿足'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  比統霸天下好看太多，上集真的又臭又長，這次重生的節奏掌握得不錯，恐龍表演很帶勁

  。前面鋪陳可以再精簡一些，不過大致上還能接受。


  當經典神配樂一下，搭配泰坦巨龍群的出現，那份悸動又回來了。第一刷就獻給4DX，準

  備好要二刷杜比。


  之前文章有人說前面一小時都是文戲，沒看就不要瞎鬼扯。中間有穿插黑寡婦對抗棘龍和

  小船家人的逃難戲，從這裡開始就沒冷場。


  小男友的小便橋段很有笑點，全場爆笑。

  最後鄧肯拿著經典信號棒的場面，那段表現的情感讓我差點飆淚。

  很慶幸結局不再是暴龍老奶奶的神救援老梗，用稍微反高潮的形式走出另一條路。


  --'
