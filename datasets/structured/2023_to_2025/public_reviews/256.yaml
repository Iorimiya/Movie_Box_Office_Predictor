url: https://www.ptt.cc/bbs/movie/M.1752560761.A.191.html
title: 侏羅紀世界重生，每次主角都死不了有何刺激
content: '每次 每段 每集 主角團都不會死


  叫再大聲場景再危險 高空摔下去連斷腿都沒有


  尤其這幾年


  每集必有的小孩


  每集必有的男主


  每集必有的女主


  一家一定整整齊齊必活也不會受什麼重傷


  知道這個定律後


  看每個場景真是一點波瀾也沒有


  前期分出誰主誰配


  恐龍一定咬配角


  反派一定最後會死


  主角一定會距離很近然後平安存活


  有這種觀影體驗心理會覺得很無聊


  不同恐龍照著劇本輪流出現


  像複製貼上的公式


  真不是恐龍沒吸引力


  是劇本千篇一律


  （上上集放走恐龍的小女孩不死，也是恨啊）


  --'
