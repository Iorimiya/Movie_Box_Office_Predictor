title: 'Re: [負雷] 侏羅紀世界重生'
content: '這次那個姐姐到底是要幹嘛


  代表什麼？



  人家根本也沒有要殺你


  不知道在堅持什麼


  就是你要報警


  人家有任務不讓你報警


  然後搶電話時自己沒站穩掉下去



  然後就開始造謠



  更重要的是沒有這趟任務


  你們就死定了



  雖然小物臭反派沒有想救一家人


  但是也沒有阻止



  而且人家有自己的目的


  救了你們一家人還討價還價


  人家就答應要讓你們的安全地了



  好像主角團一行人是活該一樣




  侏羅紀公園一直都沒長進耶


  總是要設計兩條線


  然後一條線就專門搞事情


  --'
