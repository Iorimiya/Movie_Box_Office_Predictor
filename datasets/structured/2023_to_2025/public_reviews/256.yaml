title: 'Re: [情報] 侏羅紀世界：重生 終極預告'
content: '官方也公布最新的海報


  預告開場的實驗室人員被畸形種暴龍抓住的畫面，就之前的情報+預告的外貌這隻應該就是公園時期在補足暴龍基因的缺陷時做出來的失敗品，對JP1還有印象的話應該還記得侏儸紀恐龍的DNA有缺陷需要用其他動物的去補

  把那塊大肉瘤跟手臂去掉的話看起來就跟普通暴龍差不多


  預告還有另一個也是類似失敗品的迅猛龍，外型是迅猛龍+翼龍，大概1個月前就有這隻的情報，但想不到長這麼醜



  看了一下YT留言跟其他國外討論區，討論比較熱烈的都是在講新的暴龍，果然大家還是比較喜歡正常外貌的






  -----

  Sent from JPTT on my Samsung SM-A3460.


  --'
