url: https://www.ptt.cc/bbs/movie/M.1751644949.A.087.html
title: '[負雷] 侏羅紀世界 重生 很好很棒下次不要拍了'
content: '乳體


  本來就沒什麼打算來看這一部，有人找我來看就看了。



  劇情就是，製藥公司來找寡姊，開出高薪號召人員可以去採集樣品，賺大錢！



  途中遇到被恐龍襲擊的一家人，救了他們之後，被恐龍追殺到被拋棄的恐龍島，分兩邊線

  進行，工作組的一直遇到危險，人被吃的差不多，家庭組的遇到危機化險為夷，還有老班

  底暴龍出來賣萌順便追殺，很多畫面都有3D的運鏡，不過因為不是看3D板沒有感覺


  最後在實驗室大家會合，直升機趕來救援的時候，不用想也知道直升機會被最後的Boss異

  形巴龍幹掉


  接著壞蛋被Boss吃掉，黑人自我犧牲讓大家逃亡，結果大家都得救，藥品也聖母的分給全

  世界，可喜可賀可喜可賀





  就是一部很爆米花的電影


  也知道醜到爆炸的異形恐龍沒人愛，拉暴龍出來救場，還有讓小恐龍出來當吉祥物


  還有拜託，我是要看恐龍的，這部沒有IMAX可以看，新竹小廳畫質糞到像垃圾，看起來根

  本沒有感覺…


  好了，拍的很好，但是下次別再拍了，真的



  --'
