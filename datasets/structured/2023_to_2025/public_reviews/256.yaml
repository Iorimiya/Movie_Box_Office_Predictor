url: https://www.ptt.cc/bbs/movie/M.1751706085.A.4E0.html
title: '[普雷] 侏羅紀世界 重生'
content: '暑期檔看的第二部電影


  衝著寡姐跟恐龍的組合去看，特工加恐龍其實還挺新奇的


  看著寡姐伸手矯健戲耍各種恐龍，編劇你腦袋沒問題嗎


  ㄧ隻變種龍被寡姐碰碰碰幾槍打趴，比九頭身蛇小兵還弱


  整部最大敗筆就跨海一家子，看的有夠煩躁，戲份多又死不了


  爸爸跟小女兒其實還好，大女兒跟呼麻仔真的看的拳頭都硬了，尤其是大女兒一直鬼吼鬼叫

  ，我真想給他巴下去


  本片MVP我會給翼龍，把一個黑人一口吞，電影最精彩橋段，上一幕還在拉繩子，下一幕直接吞下去，唯一看的爽的地方


  其他就沒啥驚奇的，白男就是該死，第一個白男傭兵最快被秒殺，在留一個白男給異形恐龍

  衝業績

  你要說導演不仇視白男，我還真的不相信


  再來是恐龍很失敗，都是基改龍，唯一期待的異形恐龍，除了咬死兩個白男之外，意義不明

  要賣玩具也很難賣吧


  整體娛樂程度一般吧，閒著沒事可以看看





  -----

  Sent from JPTT on my iPhone


  --'
