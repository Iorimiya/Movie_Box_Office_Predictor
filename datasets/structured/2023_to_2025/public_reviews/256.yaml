url: https://www.ptt.cc/bbs/movie/M.1751772531.A.D60.html
title: 'Re: [負雷] 侏羅紀世界重生'
content: '看完我也有一樣的感想

  想當初是衝著侏儸紀公園的續集去看
















  這真的超爛 一個巧克力包裝紙就可以毀掉

  這間實驗室安全等級還真是低

  他們真的是該掛掉的那群 什麼都不懂

  妹妹就算了！ 年紀小 什麼都不懂

  爸爸一上船 以為叫到計程車 想要送到附近島上

  主角們也是有自己的行程要走好嗎？

  姐姐男友一天到晚不穿衣服 都不怕蚊子叮

  內心戲真的演得很爛 講話有點含滷蛋

  最誇張的是姐姐 上來就亂動別人的通訊

  呃 他們差一點掛掉欸 然後被制止還理所當然

  最衰的就是召集人 看起來像反派 但啥也沒做

  姐姐被甩出去 也不是他推的 只是看了一眼

  也不到幾秒鐘沒行動 姐姐落海就被當殺人兇手

  真的是有夠慘 這樣就變成反派

  這也是吐槽點 我看後面一直蟒蛇游來游去

  然後不趕快上岸 泡在水裡聊天是怎樣

  姐姐真的是最該掛掉的那個

  掉下去海裡 居然沒被拖走 真是可惜

  我也覺得莫名其妙 這麼大隻 一下就出來

  而且還是好幾隻 然後都是腕龍

  這是拍的爛 是每個龍都太單一

  除了一開始蒼龍跟棘龍一起出場

  其它的都是個別出場 絕對看不到第二種龍

  這可能是當機 這點就不吐槽了

  應該是雜種龍只對會動的有興趣

  很多生物都這樣

  就頭殼壞了有點牽強 掛掉同事的家人不用照顧


  我覺得這次拍的最爛的就是8+9姐姐跟單一

  8+9姐姐應該第一時間就掛掉才對

  不尊重人之外 又愛吵 真的是...

  另外恐龍有一種出現就不會有第二種


  還有最後那個畸形龍有夠醜 醜到爆

  一直動來動去 又暗 真的看不太清楚原貌

  上一集的霸王暴龍還可以看 混合物種優點

  跟暴龍對打戲也很不錯

  上上集安排蒼龍一口吃掉暴龍當結尾也不錯

  最後什麼都沒有加雙龍互打 感覺結尾一般


  這一集應該最後安排蒼龍在出海時 撞爛小艇

  一口把8+9姐姐吞下肚才對



  --

  可是又不是他推下海的 就剛好船被撞

  姐姐就順勢甩出去

  自己掉下去的 就算對方反應不過來或是算計

  也不至於是殺害自己的仇人

  超扯對不對

  重點是被救還在那邊吵 一家人都沒啥規矩'
