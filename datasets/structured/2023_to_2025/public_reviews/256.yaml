title: 'Re: 侏羅紀世界重生，每次主角都死不了有何刺激'
content: "好萊塢拍的電影很公式化  一開始看到各個角色出現  就知道最後誰死誰活了\n\n        小孩  不會死  所以在溪邊那段一看就知道絕對不會有事\n\
  \        不然一個小孩只剩半截身體能看嗎?\n\n        女主角  不會死  尤其是美女黑寡婦演的\n\n        黑人男主角  不會死\
  \  因為政治正確\n\n        藥廠主管  會死  因為藥廠現在在美國是過街老鼠  人人喊打\n\n        路人  會死  因為那麼多人都不死\
  \  一定要有些人死\n\n\n--\n首先 我們認為這不是頂新一個個案 這是台灣食安轉型的一個契機    3號 宋楚瑜 徐欣瑩\n只有拉到這個高度 才不會淪為政治對立的祭品\
  \ 並以為消滅了頂新 就解決台灣的食安問題\n當人們集體去抵制廠商 這代表我們的政府 在這件事上 缺席了\n政府的責任 是該給廠商能夠清楚改善的方向及法令 給人民能夠安心的嚴管及補償\n\
  台灣人不是貪心的人 也不是狠心的人   \n而是對未來失去信心的一次吶喊 所以這一次的抵制 有一部份是對政府的絕望\n\n--"
