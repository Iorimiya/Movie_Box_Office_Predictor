url: https://www.ptt.cc/bbs/movie/M.1751431963.A.9FA.html
title: '[討論] ［爛雷］侏羅紀世界：重生'
content: '看了早場08:40的

  人潮還不少

  原本還在考慮要不要看特別場，幸好沒訂票


  如果你還沒訂特別場

  柯南/超人/F1都還有特別場可以選擇

  這部片真的不值得花七八百塊進場

  倘若你是黑寡婦粉，非得要看

  那可以平日去用信用卡折扣









  ～～～～～以下微微劇透～～～～～～～




  本片整整前一小時幾乎看不到恐龍

  除了誤闖馬路的病懨懨雷龍（？）

  跟撞翻路人一家四口小船的滄龍以外

  （這時滄龍還只露個看不清楚的影子）

  片長133分，真的前一小時只看到幾秒鐘的雷龍


  一直在鋪陳無聊的人設劇情

  有趣也就罷了

  對話無聊又尷尬還沒笑點


  路人大女兒跟男友演技尷尬

  大女兒自己推藥廠老闆+被滄龍撞而落海

  然後很尬的說老闆要殺她

  人家只是沒有趕快去拉妳，或是不想救妳


  船長跟博士也很尬

  兩個人會莫名在那邊尷尬地笑

  笑得我都想離場了




  --

  Sent from nPTT on my iPhone 13


  --'
