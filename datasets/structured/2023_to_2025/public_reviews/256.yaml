url: https://www.ptt.cc/bbs/movie/M.1751526778.A.491.html
title: '[雷] 侏羅紀世界：重生 根本大蟒蛇二恐龍版？'
content: '侏羅紀世界：重生

  大概是侏羅紀系列裡面第二難看的

  公園1最經典

  公園2還不錯 有冒險感

  公園3當爽片 無新意但有格蘭特就是還可以


  世界1算不錯的重啟

  世界2炸裂爛 房子裡面跑跑跑

  世界3救回來一點 帶回一部老情懷

  但馬爾他那段不知道在欉三小


  這部重生唯一值得讚許的部分是

  把第一部第二部小說的部分情節抓進來


  ——————以下防雷——————

  故事先來到十幾年前 還幾十年前

  反正就是InGen研究變異恐龍

  實驗室的人員不專業垃圾亂丟耶

  結果被機器吸進去以後

  所有研究炸了 有人被吃

  有人啊啊啊啊啊啊啊

  前言結束

  -

  一開始敘事就覺得完蛋了

  很像當年大蟒蛇2的故事情節

  藥廠要開發藥物

  需要去取恐龍血

  （啊大蟒蛇是去取蘭花）

  然後開始組團準備冒險

  寡姐很美 但人設有點不清楚

  有美式幽默但不懂的會覺得不好笑

  刀鋒哥很帥很有船長感

  藥廠人很明顯就是壞人

  （跟大蟒蛇一樣）

  博士男有點在致敬格蘭博士但又怪怪的

  剩下三個隊員很明顯就是跑龍套

  之後一定會領便當的那種

  -

  另外一條故事線的一家四口

  其實根本可以刪掉增加恐龍

  已知那邊基本上禁航區還要開船去

  這個爸爸智商堪憂

  大女兒就是出來叫叫叫很吵

  小女兒一看就知道不可能死

  好萊塢正常不會讓小朋友死的

  大女兒男友除了去救落水的大女兒的部分

  其他部分真的不知道要幹嘛

  硬要給他跟爸爸建立情感也是怪怪的

  尤其他在尿尿時迅猛龍準備攻擊

  本來期待著看他領便當

  結果迅猛龍被變種翼龍給吃了（？

  -

  回到故事線

  總之一家四口的船被滄龍掀翻

  寡姐的團隊救了他們

  結果他們知道寡姐團隊的任務時

  就開始各種叫叫叫

  （人家剛救了你 你可以就安靜嗎？

  還是回到水裡等其他人來救？）

  獵滄龍的部分滿好看的

  只是總覺得滄龍變小隻了？

  然後變異的棘龍可以在海裡游這麼遠

  有點硬要把滄龍跟棘龍弄成一對

  說他們互利共生（？ 有點詭異

  然後團隊龍套男先去送人頭給棘龍

  （這對傭兵智商堪憂）

  刀鋒哥把船開上岸後

  龍套女在岸邊也去送人頭

  （疑… 不知道後面的棘龍可以上岸？）

  一家四口在剛剛的打鬥中跳船

  （很奇蹟沒被滄龍棘龍追）

  從島的另一邊上岸開啟支線任務

  要去找島上的據點求救

  主團隊剩下寡姐、刀鋒哥、藥廠男、博士男、龍套三

  他們要繼續採集樣本然後去島上據點求救

  以下分為主線與支線任務


  主線任務：

  寡姐團隊找到那個啥泰坦巨龍

  （人家在OOXX你還來打擾）

  這邊這CG讓人看得很痛苦

  那個恐龍的尾巴長的讓人無法言喻

  還在空中像蛇一樣扭來扭去

  成功採集樣本後要去找風神翼龍

  寡姐、博士男、龍套三辛苦垂降下去

  殊不知後面就有樓梯

  這到底啥設定啦

  InGen挑個有古遺蹟的島做實驗？

  拿到樣本時龍媽媽剛好來打招呼

  就在啊啊啊啊 跑跑跑後 龍套三被吃

  博士男拿到樣本樣本飛出去

  博士男摔下去 沒短腿沒扭到

  其實他才是真。傭兵？

  藥廠男刀鋒哥跑下去 寡姐垂降

  四個人完好無損

  三個樣本GET準備去據點求救


  支線任務：

  一家人島上散步

  小妹撿到一隻賣萌小龍

  繼續散步散步

  爸爸跳船時腳受傷走不快

  所以他們決定去走水路

  就撿到了InGen遺留的充氣皮艇

  跟暴龍完了場急流泛舟落水

  （這邊致敬第一部小說有小感動）

  暴龍游泳把船掀翻

  一家人被沖到一個天然石頭閘口

  暴龍覺得過閘口很累不追了

  充氣皮艇完好無損噴出閘口

  附贈的船槳還沒有被沖走

  然後他們就繼續朝據點走去求救

  遇到了寡姐一行人

  主線支線任務合併


  據點用地熱發電

  幾十年來沒有維修還能繼續發電

  一行人被變異翼龍追開始逃

  藥廠男（跟小說裡達吉森一樣）

  掙扎後丟下眾人開車逃走

  （這車什麼品牌的 幾十年過去還能開 超級屌的 想要）

  一家人在據點內超市跟變種翼龍玩你追我跑

  追到了就要被吃掉的遊戲

  最後逃到了地下污水管道

  （這裡致敬第二部小說 有小興奮）

  博士男看到直升機來就射了…

  射了照明彈

  完全沒發現後面是變種暴龍

  （這麼大隻走路還這麼安靜

  變種暴龍表示已開啟特殊能力）

  然後直升機就在煙霧裡被變種暴龍爆了

  眾人沿著污水管道跑跑跑

  說港口有船可以逃

  變種翼龍追追追

  變種暴龍跑去出口等

  到這裡我覺得好像在看異形片？

  就在眾人被變種暴龍逮住時

  藥廠男開車來送人頭

  變種暴龍可能想替天行道

  吃了藥廠男以後速度就變慢了

  眾人要上船時才想起來要繼續追

  刀鋒男致敬馬爾康博士

  用照明彈吸引變種暴龍

  眾人成功開船逃脫

  刀鋒男跟變種暴龍單挑勝利逃脫（疑

  最後大夥開著小橡皮艇逃離小島

  準備開回本土（中間不會沒油

  -

  以上故事結束

  恩…

  感覺侏羅紀IP應該又會被冷凍一陣子了


  --'
