url: https://www.ptt.cc/bbs/movie/M.1753634860.A.F38.html
title: '[好雷]超人,侏羅紀世界：重生,驚奇4超人：第一步'
content: '以下只有微雷，有提到一些角色，但不透漏劇情，就不放防雷資訊頁了。


  最近連續三個週末都去台中大遠百威秀影城看電影，先說結論，我喜歡的排序：

  《驚奇4超人：第一步》＞＝《超人》＞《侏羅紀世界：重生》，但都算是佳作好雷，

  去電影看也不覺得吃虧。

  我太太對超級英雄比較沒有愛好，他喜歡的排序：《侏羅紀世界：重生》＞

  《超人》＝《驚奇4超人：第一步》


  7/12週六看IMAX《超人》

  劇情有創意，雖然轉折有點硬，瑕不掩瑜。超人的個性很好，外型也不錯，

  這個版本像是溫柔的大哥哥，亨利版比較有殺氣。

  本片的打鬥精彩，幾位配角：卓越先生、綠光戰警，鷹女都很有趣，有點星際異攻隊

  的感覺，反派雷克斯的演技很好，超狗很搶戲，甚至有點太刻意了。

  個人覺得整體來說，這片比不上《超人：鋼鐵英雄》，但也算不錯了。


  7/20週日看3廳《侏羅紀世界：重生》

  3廳大小僅次於IMAX廳。前面鋪陳有點陳悶冗長，出現滄龍之後就精彩了，

  後面的暴龍和風神翼龍兩段都很讚。有很多致敬侏羅紀公園1的畫面和音樂。

  劇情老套，也不是很合理，但不去計較，當成爽片看是ok的，覺得比前一集

  《侏羅紀世界：統霸天下》好看，個人認為統霸天下可能是系列作最差。

  另外，基因混種的恐龍外型太醜了。


  7/27週日看IMAX《驚奇4超人：第一步》，劇情架構有點像《超人》，

  平時被民眾吹捧和愛戴，遇到危機時被民眾唾棄和討厭，危機解除後又和樂融融。

  這部的復古美術、畫面特效都很棒，尤其是霹靂火和銀色衝浪手，特效很過癮。

  主題音樂也很洗腦，讓人印象深刻。

  文戲很多，打戲不多，但打戲都很精采。

  霹靂火表現最多次超能力也最帥氣，驚奇先生表現超能力的次數有點太少。

  霹靂火和石頭人也有吵嘴和打鬧互動，但沒有2005年版好笑。

  劇情推動的轉折有點太硬，但瑕不掩瑜。整體來說跟《超人》差不多，

  都是不錯的超級英雄電影，打戲和反派是《超人》較佳，劇情、情感和美術是

  《驚奇4超人：第一步》較佳。

  個人蠻喜歡驚奇四超人這個IP，這是第三次重拍電影了，第一次是2005和2007年，

  第二次是2015年，覺得這次跟2005、2007年版不分上下，各有優點，都比2015版好，

  2015前半段的黑暗壓抑氣氛不錯，後半段各方面都很差，而且驚奇四超人比較適合走

  歡樂又不太嚴肅的風格吧。


  --'
