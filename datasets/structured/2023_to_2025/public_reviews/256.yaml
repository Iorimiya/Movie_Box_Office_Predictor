url: https://www.ptt.cc/bbs/movie/M.1751759673.A.34F.html
title: '[負雷] 侏羅紀世界重生'
content: '雷





















  光是開場我就看的頭好痛。

  1. 我一來想知道哪家生科公司僱用的員工會在進實驗室前會隨地亂丟垃圾，

  二來想知道為什麼這個實驗室設計可以爛成這樣，

  一個巧克力包裝就可以癱瘓整座實驗室搞到需要放棄整個園區？我的天。

  不知道多少資本投資進去，就為了這個弱智巧克力包裝全部打水漂？


  2. 一家人在荒島落難的時候，

  都還沒確保安全的食物和水源，

  小妹妹就一直把食物分去餵小恐龍，真的是嫌食物太多不怕餓死嗎？

  荒島求生真的可以這樣浪費食物嗎？


  3. 在溯溪那段女主都說水裡有東西了要大家注意，

  那個生科公司的還一直泡在水裡不上岸，

  是不是真的很不想活啊


  4. 最後在等直升機時一家人的姐姐能不能拜託讀一下空氣，

  在周圍隨時都可能有恐龍出沒的情況，

  有恩怨不能先忍著等到大家都成功逃離之後再說？

  立刻就想找公司高層單挑嗆聲，還一直大叫，

  是真的很想把恐龍引來讓大家一起死就對了？


  5. 泰坦巨龍那段，那麼多龍竟然可以在草原上全體隱形，

  下一幕突然出現，太強了吧。

  我能理解那堆草是有點高，

  但就算那樣能藏住還是太硬要了吧。


  6. 最後在加油站找到的車到底為什麼可以這麼吵？

  這地方是科研園區又不是遊樂園，

  裡面的車子真的有需要裝備這些吵死人關不掉的音效嗎？


  7. 最後信號彈為啥不往外丟就好，

  非得要肉身去引恐龍演一齣壯烈犧牲的戲碼，

  我就當你是為了爭取更多其他人逃命的時間好了，

  但最後你又用信號彈大家回來救的時候，為什麼D Rex沒有被信號彈引回來？


  8. 最後說要把藥給全部人，

  很明顯就是硬搞教育橋段，

  就是要搞什麼全人類福祉>>>企業利益什麼的，我懂。

  但生物樣本就只有那三瓶要怎麼分給全部人？

  你要提取dna還是什麼的終究還是需要先找個科研公司或是藥廠合作吧？

  哪個公司這麼佛心幫你提取樣本還不顧自己利益的，真的有這麼好的事嗎？


  --'
