url: https://www.ptt.cc/bbs/movie/M.1750774168.A.C3F.html
title: '[新聞] 《侏羅紀世界：重生》泰國取景　異形恐龍現蹤熱帶島嶼'
content: '《侏羅紀世界：重生》泰國取景　異形恐龍現蹤熱帶島嶼


  國際中心楊雅婷／綜合報導


  2025-06-24 15:00:00



  ▲《侏羅紀世界：重生》到泰國南部三府取景。（圖／翻攝自IMDB）


  好萊塢鉅片《侏羅紀世界：重生》（Jurassic World: Rebirth）選定泰國為主要拍攝地

  之一，劇組斥資逾4億泰銖，2024年6至7月間深入泰國南部三府取景。片中熱帶景觀與恐

  龍冒險元素結合，也讓泰國成為全球影迷關注的焦點。


  泰國總理府副發言人莎西甘（Ratchada Thanadirek）23日表示，根據旅遊與體育部通報

  ，《侏羅紀世界：重生》的拍攝橫跨甲米、攀牙與董里三府，包括攀牙灣、考帕侬本查國

  家公園及格島海灘等經典自然景點，展現泰國生態旅遊與國際影視製作的強大吸引力。


  《侏羅紀世界：重生》是風靡全球的恐龍電影系列第7部作品，自1993年《侏羅紀公園》

  上映以來，恐龍熱持續延燒。這次由全新卡司擔綱，包括「黑寡婦」史嘉蕾‧喬韓森（

  Scarlett Johansson）、喬納森‧貝利（Jonathan Bailey）與馬赫夏拉‧阿里（

  Mahershala Ali），劇情設定在前集5年後，地球生態變遷迫使逃脫的恐龍集中棲息在熱

  帶地區。


  一支特種部隊受命前往任務，需回收海、陸、空三種巨型恐龍基因，以研發新型藥物，卻

  意外流落侏羅紀公園遺留的實驗基地島嶼，陷入重重危機。片中最令人膽寒的，是一種全

  新基因改造的異形恐龍，成為全片最大威脅。


  莎西甘表示，這次拍攝不僅是推動泰國軟實力政策的重大成果，也讓全球觀眾透過大銀幕

  一睹泰國南部壯麗的海洋與森林之美。本片拍攝更為當地創造2245個就業機會，涵蓋製片

  、攝影、住宿、交通與後勤支援等，為地方經濟注入活水。她強調，政府未來將持續強化

  影視產業發展，培育本土人才、升級基礎建設，讓泰國在國際影視與觀光領域占有一席之

  地。


  《侏羅紀世界：重生》將於2025年7月2日全球同步上映。



  新聞網址：



  --'
