url: https://www.ptt.cc/bbs/movie/M.1751467611.A.B6B.html
title: '[新聞]《侏羅紀世界：重生》爛番茄分數開盤！評'
content: '《侏羅紀世界：重生》爛番茄分數開盤！評價相較《殞落國度》與《統霸天下》回升！



  由蓋瑞斯愛德華執導，史嘉蕾喬韓森主演的《侏羅紀世界：重生》


  終於將會在本週正式上映，而首波媒體評價也陸續揭曉，並紛紛湧入了爛番茄網站。


  這部《侏羅紀世界》系列最新續集為觀眾們介紹了一批新的角色，講述他們在一間製藥公

  司的僱用下前往一座小島進行調查。這座小島曾被 InGen 公司當成一種研究設施，但在

  荒廢數十年後，島上仍然盤據著失敗且變異的恐龍實驗體。除了史嘉蕾喬韓森之外，其他

  參與本片的演員還包含了馬赫夏拉阿里、喬納森拜利、魯伯特佛列德、曼紐賈西亞魯佛、

  露娜布蕾絲、艾德斯克林等。


  根據爛番茄網站的評價，本片在截稿前公開的 86 則評價中


  僅獲得 57％ 的腐爛新鮮度，但隨著更多媒體評價的湧入，這個分數勢必將


  會再次出現變動。而觀眾的爆米花評分則得要等到正式上映後才會揭曉。












  就在目前公開的評價中，不少評論者都讚賞了《侏羅紀世界：重生》回


  歸根源的風格、刺激的動作場面，以及蓋瑞斯愛德華的執導方向。


  此外，史嘉蕾喬韓森的演出也受到了不少好評，


  甚至還有人將本片稱為繼原版《侏羅紀公園》以來最棒的一部，


  也是今年最值得一看得暑期大片之一。


  另一方面，針對本片給予負評的媒體則認為《侏羅紀世界：重生》


  缺乏了原創性，而劇情也相當空洞，同時也缺少引人入勝的角色和


  目標，或直接不客氣地將本片稱為一部騙錢的「複製品」，認為系列已經


  陷入了一種創意匱乏的狀態，並且只願意打安全牌，讓批評者質疑本片存在的必要性。


  雖然這個爛番茄分數暗示了本片在媒體之間的兩極反應，


  但相較於《侏羅紀世界》的前兩部作品《殞落國度》


  和《統霸天下》的分數來看，依然出現一種回升。







  --'
