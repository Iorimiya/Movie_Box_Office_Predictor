url: https://www.ptt.cc/bbs/movie/M.1751433904.A.0BF.html
title: 'Re: [負雷] 侏羅紀世界：重生'
content: '防雷









  人類戲份以及劇情都低能到懶得討論了

  只討論恐龍的部分


  雷龍

  一開始市區出現一隻死氣沈沈的雷龍

  車子一台一台無感的經過雷龍

  想表達民眾對恐龍無感

  但是就真的只是擺一隻雷龍在那裡動也不動

  傻眼



  滄龍

  莫名沒來由的攻擊帆船

  翻船後弄了一幕在海中的滄龍表達海中巨物恐懼症

  結果攻擊完默默的就游走了


  滄龍+棘龍

  硬搞了一個兩種恐龍互利共生

  一起攻擊主角船

  動作場面預告幾乎全演完了

  棘龍吃了兩個人之外不知道在幹嘛

  滄龍追到淺灘不追了游走了就這樣


  飛行迅猛龍

  有一幕飛行迅猛龍抓走一般的迅猛龍回去吃


  小小三角龍

  賣萌而已


  一種類似雷龍的恐龍忘記名字了

  一群在草原上走致敬第一集

  恐龍已經被復活幾十年了

  恐龍博士卻在這給出了整部戲最吸睛的演技

  就是看到野生恐龍時的悸動


  暴龍

  算是整部戲我最喜歡的橋段

  把暴龍很完整的拍出來很長一段時間

  讓喜歡暴龍的人大飽眼福

  很有生物感但是整段看起來暴龍像一隻有氣無力的老狗

  暴龍只登場這段

  傻眼


  風神翼龍

  吃了一個人

  而且是用爬的去吃

  突然覺得侏羅紀公園第三集翼龍那段很好看


  結尾高潮

  幾隻飛行迅猛龍出來跑龍套一下

  動作場景過目即忘

  大魔王異形暴龍颯爽登場！

  片頭已經吃了一個人

  高潮戲再吃一個人

  也只是跟棘龍打成平手各吃兩人

  沒有特別突出

  異形暴龍動作慢的要死

  一群人站在碼頭跟異形暴龍大眼瞪小眼

  以為暴龍要出來了結果沒出來

  有一個人拿煙霧彈吸引牠

  然後牠就傻傻跟著過去

  然後慢的要死，人在水裡走路都比牠快

  然後沒追到那個人

  然後也不知道異形暴龍最後怎麼了







  大概只有喜歡暴龍的人姑且可以看一下















  --

  Sent from nPTT on my iPhone 12


  --'
