title: '[討論] 《侏羅紀世界：重生》首支預告'
content: "官方IG：\n\n\nYouTube：\n\n\n\n（中文版）\n\n 《侏羅紀世界：重生》首支預告正式正式上線\n\n\n\n\n官方劇情大綱：\n\
  \n在【侏羅紀世界：統霸天下】中的事件發生的五年後，地球的生態系統絕大部分的地方已\n被證明不再適合讓恐龍居住。倖存的恐龍只能在赤道附近孤立的環境中生存，這些地方的\n\
  氣候和牠們曾經繁衍興盛的環境類似。在這個熱帶生物圈之中，有三隻體積最龐大的恐龍\n體內含有一種關鍵性成分，能夠用來製造一種能為人類帶來奇蹟般地回生續命功效的藥物\n\
  。\n\n曾獲奧斯卡獎提名的史嘉蕾喬韓森飾演佐菈班奈特，她是一名高竿的臥底行動專家，受聘\n率領一支精英團隊執行一項最高機密任務，目標是從世上體積最巨大的三隻恐龍身上取得\n\
  遺傳物質。然而當佐菈和她率領的隊員遇到一個正在從事水上探險，卻遭到掠奪性水生恐\n龍攻擊而翻船的平民家庭之後，他們全都被困在一座小島上。而他們在那裡即將發現一個\n\
  隱藏了數十年，既驚人又邪惡的秘密。\n\n導演：《哥吉拉》、《AI創世者》蓋瑞斯愛德華\n\n\n\n\n\n\n\n\n\n--"
