url: https://www.ptt.cc/bbs/movie/M.1751425843.A.C28.html
title: '[負無雷] 昏昏欲睡的《侏羅紀世界：重生》'
content: '最近怎麼好像都少了一些令人感到驚喜的電影

  恐龍的CG有點差強人意

  不過整體來說算是不錯吧


  劇情算是很有年代感的那種

  覺得不錯的人應該也還是有

  不知道該怎麼評論這個時好時壞的劇情

  有點令人頭痛

  整體而言我還是比較喜歡蝗蟲世界的劇情

  直接把說教感融入在劇情內

  這部就有點落漆


  角色發揮的其實還不錯

  每個人的個性鮮明

  演員之間的表現也很有趣

  算是這部的一個長處


  缺點在於恐龍的發揮實在不太行

  偏偏你又是打著恐龍招牌的電影

  應該多給恐龍一點發揮空間吧？


  千萬不要上串流再看

  會看到睡著

  電影院裡至少還能撐一下


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
