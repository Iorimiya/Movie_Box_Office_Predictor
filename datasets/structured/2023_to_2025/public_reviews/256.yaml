title: 侏羅紀世界：重生
content: "雷文防雷資訊頁\n \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n \n\
  \ \n \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n \n \n\n\
  觀影證明： \n\n前言：\n有點像遊戲分成兩個支線，娜塔莎的隊伍跟墨西哥家族中途失散，最後在廣場會合然後脫逃\n；生還者：男黑鄧肯，男女主，墨西哥家族+女兒男友。\n\
  \n心得：\n事實上，劇情有點平穩沒有太多恐龍在吃人時的血腥畫面可能是日版的關係，娜塔莎隊伍取\n恐龍標本前奮勇在海上折返變搜救隊救了一開始小弟以為很白目的家庭（被救不知感恩）後\n\
  來女兒男友跳海救刷新小弟對軟爛男的印象，小女兒算發揮正常沒有太討死，天真的模樣也\n很可愛，父親則是愛女心切嘛再來也是算開無敵星的一家人直到最後可以跟專業人士會合在\n\
  那危險的叢林；\n\n娜塔莎隊伍的保全最先領便當再來是女副舵手，男黑鬍子被翼手龍吃掉沒什麼人物袍描繪，\n白人男壞劇中也沒使到讓人牙癢癢的壞最後被疑似腦部腫脹的異形龍吃下去惹。\n\
  \n男女主方面，不熟男主但帥算扮演很沉著不白ㄘˉ的隊友，雖然現實年紀小喬韓森3歲但劇中\n感覺姊弟大概相差10幾歲，史嘉蕾表現的也很好是個勇敢重情的女子面對喪失隊友還有抉擇\n\
  ，男女主唯一有親密接觸大概就是第一場取蒼龍丸要幫固定於船尾時的接觸，沒有太多感情\n鋪陳，但希望下一集可以在一起畢竟歷經了第一集不在一起說不過去吧。\n\n結語：\n\
  沒記錯劇中用了五次經典背景音樂，當聲音響起還是蠻感動的，過程中好像沒有要致敬前面\n幾集的味道，裡面有個恐龍小弟很怕就是會打開屏噴汁的還有那個聲音，有出現但沒噴、雖\n\
  然知道現在電影大多綠幕，但不知是否因為只看數位，大夥在草叢取泰坦龍的草原遠景有點\n假，按理那應該表現的很開闊真實；希望二級趕快出，不然小弟怕娜塔莎會變的比較重。XD\n\
  ----\nSent from  on my iPhone SE 3\n\n--"
