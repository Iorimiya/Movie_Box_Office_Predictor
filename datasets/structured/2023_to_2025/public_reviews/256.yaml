content: "新聞網址：\n\n《侏羅紀世界：重生》由史嘉蕾·喬韓森（Scarlett Johansson）領銜主演，影壇備受矚\n目的新秀喬納森·拜利（Jonathan\
  \ Bailey）以及兩度榮獲奧斯卡獎的實力派演員馬赫夏\n拉·阿里（Mahershala Ali）聯合主演。\n\n導演為《星際大戰外傳：俠盜一號》的蓋瑞斯·愛德華（Gareth\
  \ Edwards），劇本則請回\n了編寫第一部《侏羅紀公園》的大衛·柯普（David Koepp）操刀。\n\n而在近期接受訪問時，大衛·柯普聊到他原本有寫一段「恐龍嘿咻」的戲，在片中有一幕\n\
  是兩隻「泰坦巨龍」親密接觸的甜蜜場景，而柯普則表示：\n\n那一幕很美啊！但那段劇情寫起來其實有點棘手…你知道嘛，我們到底要讓這場親密戲拍\n的多激烈？會不會太像《侏羅紀性愛片》？\n\
  \n＊柯普在原話中是說 Jurassic Pork，這是一個雙關語，也就是將 Jurassic Park 中的\n Park 替換成 Pork，而 Pork 在英文俚語中有「與他人發生關係」的意思。\n\
  \n那段確實寫進過劇本某個版本裡。我那時寫說：「主角群走入草原並靠近恐龍。結果發現\n牠們總共有八隻腳，但只有六隻還踩在地上。」\n\n\n\n--"
