url: https://www.ptt.cc/bbs/movie/M.1750586589.A.8D5.html
title: '[新聞] 侏羅紀世界：重生 首波媒體評價出爐：'
content: '《侏羅紀世界：重生》首波媒體評價出爐：劇情乏味、動作戲過目即忘，但也被讚找回首

  集精神




  （圖片來源：環球影業）


  「侏羅紀」系列的第七部電影《》（Jurassic World：Rebirth）日前

  盛大舉行全球首映，參加完放映活動的各家媒體，近日也已陸續在網路上分享了自己的第

  一手簡短觀後感，而綜合目前的風向來看，這集的製作品質似乎是落在中等範疇，有人肯

  定特效和拍攝層面的用心，也有人批評角色刻劃扁平和敘事無趣，有褒也有貶。


  「《侏羅紀世界：重生》是一部鏗鏘有力的佳作，也是本系列絕佳的入門作品。我愛每隻

  新恐龍，還有我的老天啊，有幾隻好恐怖。準備愛上多洛雷斯（一隻幼年鷹角龍）吧。我

  很喜歡，這是一次對第一集的絕妙致敬。」


  「《侏羅紀世界：重生》有紮實的概念 ─ 變異的恐龍出現在一座新的島嶼上。我原本很

  感興趣，但。一堆人過目難忘、亂沒重點的戲碼被串在一起。有一段河

  流戲特別突出，但其餘部份亂成一團。角色呆板，毫無化學反應，我發現自己竟然會為了

  想感受一點刺激而選擇去支持恐龍吃人。

  整個故事就像電影公司的核對清單一樣 — 沒半樣東西被深入探索，也缺乏溫度。有些恐

  龍的造型設計讓人想起老怪獸電影的氛圍，但這部電影幾乎沒什麼用那些恐龍露臉。沒亮

  點、沒鋪陳、也沒激起任何關於這系列未來走向的期待，雖然，

  但仍然感到。」


  「《侏羅紀世界：重生》完美體現『侏羅紀』電影的所有精髓，角色引人入勝、配樂精彩

  、攝影絕讚、工業光魔大廠的視效更叫人讚嘆。向脫帽蓋瑞斯艾德華（導演）和法蘭克馬

  歇爾（製片人）脫帽致敬，我迫不及待想二刷了。」


  「。」


  「當你進入充滿恐龍的海洋和陸地時，《侏羅紀世界：重生》會帶給你滿滿的刺激，滿到

  讓你從頭緊張到尾。 儘管有太多情節很好猜，其它段落要嘛可愛要嘛就是令人，但

  這仍然是一段充滿懷舊和刺激的娛樂時光。


  「《侏羅紀世界：重生》動作冒險精彩萬分，懸念與恐怖交織，還有 Distortus rex 和

  Mutadons 的戲份也很亮眼，本片充分證明它不只是關於恐龍的故事！這還是一段關於科

  學、自然界和家庭的歷史。還有，我必須再說一遍，這裡面有自從第一集以來最棒的場景

  設計！」


  「《侏羅紀世界：重生》是本系列的精彩新作，它滿足你所有的期待，甚至超乎你的期待

  ！從動作到攝影，蓋瑞斯艾德華很懂如何打造一部精彩的恐龍電影。這集抓到了第一集的

  精髓，讓你又再一次沉浸其中。」


  「《侏羅紀世界：重生》符合你所期望的，劇情有愚蠢的時候，但。電影拍得超

  棒，恐龍也超讚，喬納森貝利或許是我現在最喜歡的演員之一。我全程心跳不斷加速，有

  些時刻我甚至開心到想歡呼。」


  （圖片來源：環球影業）


  官方劇情簡介：


  前作《侏羅紀世界：統霸天下》（Jurassic World：Dominion）事件的五年後，地球的生

  態系統絕大部分的地方已被證明不再適合恐龍居住。


  倖存的恐龍只能在赤道附近孤立的環境生存，這些地方的氣候和牠們曾經繁衍興盛的環境

  類似。


  在這熱帶生物圈之中，有三隻體積最龐大的恐龍體內含有關鍵性成分，能用來製造一種能

  為人類帶來奇蹟般地回生續命功效的藥物。


  佐拉班奈特是高竿的臥底行動專家，她受聘率領一支精英團隊執行一項最高機密任務，目

  標是從世上體積最大的三隻恐龍身上取得遺傳物質。


  然而當佐拉和她的隊員遇到一個正在從事水上探險，卻遭到掠奪性水生恐龍攻擊而翻船的

  平民家庭之後，他們全都被困在一座小島上，而他們在那裡也將發現一個隱藏了數十年，

  既驚人又邪惡的秘密。


  文：Joker









  --'
