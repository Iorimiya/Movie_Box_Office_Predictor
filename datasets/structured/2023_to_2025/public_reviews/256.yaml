title: '[新聞] 《侏羅紀世界：重生》英國首映 觀眾評價出'
content: "《侏羅紀世界：重生》英國首映 觀眾評價出爐\n\n【大紀元2025年06月20日訊】（大紀元記者葉子杰編譯報導）《侏羅紀世界：重生》於17\n\
  日在英國倫敦進行全球首映後，當地18日，首批觀眾評價終於出爐。到目前為止，反應大\n多是正面，許多觀眾透露這部電影劇情緊湊，還有可愛的地方。負面評價較少。\n\n\
  週二，《侏羅紀世界：重生》（Jurassic World: Rebirth）在倫敦萊斯特廣場Odeon\nLuxe影院首映後，翌日，雖然官方評論尚未開始，但觀眾評論員在X社交媒體平台上的反\n\
  應多數都很正面，有人稱這是最美的侏羅紀電影。但也有其他人認為整體故事有些愚蠢且\n欠缺深度，目前，負面評價並不多。還有一些人提到劇中一隻可愛的小鷹角龍多洛雷斯（\n\
  Aquilops）很吸睛。\n\n\n《侏羅紀世界：重生》（Jurassic World: Rebirth）劇照。（UIP提供）\n\n艾希莉‧卡特（Ashley\
  \ Carter）在X上（點這）說：「《侏羅紀世界：重生》是系列中一\n部扎實的作品。有一些非常精彩的動作場面和令人驚豔的視覺效果。很喜歡新出現的恐龍\n，以及電影如何強調它們的可怕之處。這部片帶有《侏羅紀公園》的精神，並且巧妙呼應\n\
  了原作。」\n\n爵士‧唐凱（Jazz Tangcay）在X上（點這）說：「《侏羅紀世界：重生》值得喝采，也\n是系列中完美的作品。喜歡所有新出的恐龍，哇，有些真的很可怕。準備好愛上多洛雷斯\n\
  吧。非常喜歡這部電影，對原作也是一個美麗的致敬。」\n\n麥克‧雷耶斯（Mike Reyes）在X上（點這）說：「《侏羅紀世界：重生》我需要一些時\n間好好消化這部電影，仔細理清我更深層的想法。但表面上來看，這讓我有動力重看《侏\n\
  羅紀公園3》，看看我是否應該給它一個道歉。」\n\n巴里‧萊維特（Barry Levitt）在X上（點這）說：「《侏羅紀世界：重生》讓我印象深\n刻，這部電影理解恐龍既雄偉又完全令人恐懼。整個演員陣容很有趣，而多洛雷斯是史上\n\
  最強（懂的人自然懂）。」\n\n德雷文（Draven）在X上（點這）說：《侏羅紀世界重生》是系列中一部極佳的新作品，\n帶來了你想要的一切，甚至更多！從動作場面到攝影手法，蓋瑞斯‧愛德華（Gareth\n\
  Edwards，導演）懂得如何打造一部出色的恐龍電影。這部作品捕捉到了原作的精神，讓\n你瞬間重回其中。」\n\n康納‧韋伯（TheConnorWebb）在X上（點這）說：「《侏羅紀世界：重生》滿足了你的一\n\
  切願望。劇情可能有點傻，但誰在乎呢。電影畫面華麗，恐龍超棒，喬納森‧拜利（\nJonathan Bailey，主演員）可能成了我新的最愛演員之一。我的心跳加速，有那麼一刻\n\
  ，我高興得想要歡呼。」\n\n艾連（Eren）在X上（點這）說：「今晚終於看了《侏羅紀世界：重生》，玩得非常開心\n。很高興看到恐龍再次變得可怕。蓋瑞斯‧愛德華拍得很棒，讓你感受到這些生物的巨大\n\
  ，並以極具恐怖感的方式呈現出來。還有一些很棒的佈景！」\n\n麥克‧溫克勒（Mike Winkler）在X上（點這）說：「《侏羅紀世界：重生》非常有趣，\n充滿了侏羅紀的感覺。雖然整體故事沒有太大進展，但這裡的劇情很有趣，角色也不錯。\n\
  感覺就像原版三部曲，這讓我非常開心。有一幕特別讓我起了心驚肉跳。」\n\n亞歷克斯‧埃文斯（Alex Evans）在X上（點這）說：「女士和先生們……這是史上最美\n\
  麗的侏羅紀電影！即使沒有恐龍，這也將是一場視覺盛宴！」\n\n露比‧羅斯（LionLikesRubyRose）在X上（點這）說：「如果你是《侏羅紀公園：失落的\n\
  世界》或《侏羅紀世界：殞落國度》中努布拉島場景的粉絲，你一定會喜歡《重生》。這\n是最具史匹柏風格的《侏羅紀世界》電影，故事緊湊。此刻：我超愛它。」\n\n安德烈‧聖阿爾賓（Andre\
  \ Saint-Albin）在X上（點這）說：「《侏羅紀世界：重生》絕\n對是一場充滿恐龍元素的視覺盛宴，會讓你興奮得不已！蓋瑞斯‧愛德華打造了一部史匹\n柏風格的驚悚片，充滿了震撼的畫面、令人恐懼的恐龍，以及讓你緊張不已的動作場面，\n\
  讓你欲罷不能。」他提醒說：「片中有激烈的肢解和血腥場面，可能會嚇到年紀較小的孩\n子！」\n\n莫德‧加勒特（Maude Garrett）在X上（點這）說：「《侏羅紀世界重生》一開始就讓你\n\
  置身於充滿恐龍的海洋和陸地，緊張感貫穿始終。雖然有些劇情在意料之中，但有些時刻\n，要嘛可愛，要嘛讓人尷尬，但整體來說是一段充滿懷舊感和驚嚇的有趣時光。」\n\n\
  以下為批評者的評價\n\n尼古拉斯‧詹岑（Nicholas Janzen）在X上（點這）說：「《侏羅紀世界重生》有一個不\n錯的概念就是變異恐龍出現在一個新島上，這讓我很感興趣。但整部電影感覺平淡無奇。\n\
  它是一連串容易讓人忘記的場景，沒有任何進展。其中有一段河流戲份比較突出，但其他\n部分令人印象模糊。」\n\n「角色乏味，毫無化學反應，我甚至開始支持恐龍，只為了找點情感。故事像是照著製片\n\
  廠的清單走一樣，沒有任何深度，也缺乏內涵。有些恐龍設計帶回了老怪獸電影的氛圍，\n但電影幾乎沒好好利用它們。電影就這樣結束了，沒有什麼動力，沒有鋪陳，也沒有讓人\n\
  興奮的地方。雖然不如前幾部那麼糟，但依然讓人感覺空洞。」\n\n約翰‧弗利金格（John Flickinger）在X上（點這）說：「我在看完《侏羅紀世界：重生\n\
  》後的電影排名：1.《侏羅紀公園》2.《侏羅紀公園3》3.《失落的世界：侏羅紀公園》\n4.《侏羅紀世界：殞落國度》5.《侏羅紀世界》6.《侏羅紀世界：重生》7.《侏羅紀世界\n\
  ：統霸天下》這個排名是正確的，目前沒有任何問題。」\n\n《侏羅紀世界：重生》2025年7月2日在北美上映，7月4日在台灣上映。\n\n責任編輯：蘇漾\n\n\n\
  \n--\n                 \n   \n\n\n\n--"
