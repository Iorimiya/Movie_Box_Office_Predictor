title: '[ 好無雷] 侏羅紀世界重生'
content: '整體來說還不錯

  可能是為了閤家觀賞，

  或為了小朋友不被嚇到，

  基本上很多場景就點到為止，

  但是滿滿的巨型恐龍也是誠意滿滿

  劇情什麼的老套是沒辦法，

  好萊塢基本上在劇情這塊已經爛很久了

  不管恐龍片還劇情片都一樣，

  兩個小時吹吹冷氣看恐龍蠻值得的

  票價也才幾百塊，建議上電影院大螢幕看

  等上串流老實說就沒必要看了



  --'
