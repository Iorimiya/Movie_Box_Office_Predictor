title: '[新聞] 《侏羅紀世界：重生》票房迅速攀升 創兩紀'
content: "《侏羅紀世界：重生》票房迅速攀升 創兩紀錄\n\n【大紀元2025年07月10日訊】（大紀元記者葉子杰編譯報導）當地8日，《侏羅紀世界：\n重生》上映在美國僅上映一週，票房榜上迅速攀升。並創下了兩個重要的紀錄；不僅成為\n\
  今年迄今為止全球首映票房最高的電影，且全球總票房超越《侏羅紀公園3》總票房。\n\n據《ScreenRant》報導，儘管《侏羅紀世界：重生》（Jurassic\
  \ World Rebirth）評價褒\n貶不一，但票房並沒有因此受到影響。《重生》於美國7月2日上映後，據The numbers統\n計數據顯示，截至8日，該片美國票房突破1.7億美元，總票房達1.746億美元，全球票房\n\
  也正式突破3.8億美元。在該系列電影的總票房排行榜上正式超越了《侏羅紀公園3》（\nJurassic Park III，2001）的總票房3.659億美元。\n\
  \n《侏羅紀》系列七部電影中，儘管《重生》是該系列總票房第二低的作品，但仍然有潛力\n在未來幾週繼續攀升。此外，《重生》在為期五天的美國「獨立日」假期，在美國獲得\n\
  1.478億美元的票房收入，全球票房收入達3.18億美元，成為今年迄今為止全球首映票房\n最高的電影，也是該系列中首映票房第二高的電影。\n\n該片也登上北美週末票房榜首，而其票房成功也讓主演史嘉蕾‧喬韓森（Scarlett\n\
  Johansson）登頂演員的全球票房榜，她所有演出的電影總累積票房，超越了其他所有好\n萊塢影星，已正式成為全球票房史上最高的演員。（先前報導：《侏羅紀世界：重生》助\n\
  史嘉蕾登頂全球票房榜）\n\n\n《侏羅紀世界：重生》（Jurassic World: Rebirth）劇照。（UIP提供）\n\n據報導，DC宇宙的新作《超人》（Superman）在本週末將與其競爭票房，雖然這兩部電影\n\
  的觀眾可能有所不同，但很可能會搶走《重生》的部分票房。\n\n在評分方面，美國網路電影資料庫（IMDb）、影評網站「爛番茄」（Rotten Tomatoes）\n\
  和「影院評分」（CinemaScore）是評估電影好與不好的參考依據之一。IMDb滿分為十分\n，截至今日，《重生》獲得觀眾6.3的普通評分；爛番茄影評員與觀眾分別給予52%及72%\n\
  的普通新鮮度評價；獲得影院評分「B」的普通評分。\n\n上週末，北美週末票房排名第二的是由美國男演員布萊德‧彼特（Brad Pitt）主演的《\nF1電影》（F1）上映第二個週末北美票房收入為2,580萬美元。而截至8日，北美總票房收\n\
  入已達1.16億美元，全球票房達3.05億美元。\n\n排名第三的是真人版《馴龍高手》（How to Train Your Dragon），上映26天後，北美總\n\
  票房達2.28億美元，全球票房為5.3億美元。已超越《馴龍高手3》（How to Train Your\nDragon: The Hidden World）的5.2億美元，成為該系列電影中票房第二高的電影，僅次\n\
  於《馴龍高手2》。\n\n責任編輯：蘇漾\n\n\n\n--\n                 \n   \n\n\n\n--"
