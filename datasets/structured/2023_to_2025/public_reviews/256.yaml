url: https://www.ptt.cc/bbs/movie/M.1751700924.A.B93.html
title: '[普雷]侏羅紀世界重生  棘龍 又榮登MVP '
content: '7/2《侏羅紀世界：重生》上映時我就躍躍欲試，畢竟台新信用卡有七折優惠，超香。但

  可惜現實太忙，只好一路拖到7/5這個充滿「特別意義」的日子才去補看。


  所幸台新假日還有80元的爆米花＋可樂套餐優惠。

  我還特別選了早場，結果人潮一樣多，連熟食區都擠得水洩不通，七成觀眾都買了恐龍

  套餐。現場滿滿親子觀眾，直接屌打我上次看《柯南》的早場人數。



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  之前看過版友對於這部侏儸紀有著滿滿的吐槽，的確是有很多值得吐的，例如: 為何團隊

  設備準備不足，充滿危險的赤道海洋家族旅行....等等


  但是整體的任務架構可以看到編劇試圖去圓，像是


  恐龍從恐霸天下進化成瀕臨絕種?  環境因素

  為何一定要找陸海空三巨頭恐龍取血?  因為心臟夠大

  為何不直接另外重組DNA製造? 因為之前事件鬧很大，世界IRB禁止

  為何不派軍隊級武裝宰了恐龍取血?  因為血要新鮮的才有用，這是保密任務

  為何翼龍蛋要搞卵膜穿刺不直接拿走?  可能想避免侏儸紀公園3被恐龍追殺



  電影任務看起來就是某間製藥公司靈光一閃想搞生技創新，於是丟出一個「極機密

  任務」＋「只給一千萬美金」的預算讓專員當金主去辦事，結果金主自己還親上火線，

  然後領便當，合理懷疑藥廠根本不在意成功與否，反正錢多、再搞一次就是了。

  然後主角團竟然真的成功了！雖然黑人船長的三位手下全滅、過程一團亂，主角最後還開

  源恐龍DNA，感覺就像「上傳到 GitHub」一樣簡單。於是製藥公司瞬間變輸家，但仍舊超

  有錢。



  雖然任務主線是要採集陸海空三巨獸的DNA，但整場電影的真MVP，毫無懸念還是交給——

  棘龍。

  跟《侏儸紀公園3》那種陰暗水域的登場背景相比，在陽光普照的海洋出場氣場直接+200%

  ，而且還不只一隻。更別說黑人船長的兩位手下，都是被牠處理掉的，效率驚人。


  而三巨龍方面，意外由風神翼龍奪得第一，有1.5擊殺數（膚色種族加權計分），其

  他像是混種迅猛龍、正宗迅猛龍、暴龍、滄龍等老牌明星，這次居然擊殺數全掛蛋。

  最後壓軸出場的變種暴龍好歹吃掉了金主，算是有刷點存在感，讓主角團可以把恐龍DNA

  開源。


  變種暴龍的出場方式也讓我瞬間回憶起《侏儸紀公園3》的棘龍：

  同樣選在晚上、同樣畫面一片漆黑，根本看不太清楚恐龍全貌。

  我合理懷疑：這恐龍設計是不是太醜，所以只好整隻藏在暗處

  光線不能打太亮，不然小朋友會哭出來....


  總結來說，這部片雖然稱不上「好看」，但也沒有難看到讓我翻白眼睡著的程度。

  以我最近看過的五部電影來說，它是唯一一部我全程沒跑廁所的。

  （不排除是因為兩邊都坐滿人，懶得尷尬開口「不好意思借過」）


  如果你對恐龍還有那麼一點點情懷、對劇情邏輯抱持佛系心態，

  那這部《侏羅紀世界：重生》說不定能讓你笑著走出電影院，


  雖然我的內心還有個小疑問:

  「重生是指什麼？我只看到一堆基改畜生在搶戲!!」



  --'
