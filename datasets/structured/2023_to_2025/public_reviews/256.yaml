  我其實不知道是不是因為最近高製作大片太多了

  又是馴龍高手又是F1

  導致觀影標準被提高了

  但是後來想到當初看侏羅紀世界(2015)的時侯的感動與震撼

  這次侏羅紀世界：重生確實是不值得一看的片


  如同戲裡講的，人們對恐龍失去興趣

  連我坐在戲院觀眾席也對恐龍失去興趣了


  整部片除了兩隻草食恐龍看起來要交配那邊稍微有點感動之外

  其他片段都是昏昏欲睡

  劇情不行就狂放主題曲配樂，更顯得廉價

  最後那隻D REX的變異恐龍真是醜到爆，醜到不忍直視

  別人說是從異形啟發的外型，我只覺得像個大禿頭







