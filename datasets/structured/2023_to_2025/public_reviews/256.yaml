content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n今天去信義威秀二刷，我是很喜歡恐龍怪獸片的\n\
  \n但是本片不合理的地方太多了\n\n實在不吐槽不行\n\n1.整個探險小隊沒帶攻擊武器，只有帶麻醉槍\n\n  然後槍法還很爛，棘龍目標那麼大，還射不中\n\n\
  2.姊姊去拿充氣艇那段，手電筒一拿就有電\n\n  電池三個月不用就沒電了，何況十七年?\n\n3. 充氣艇打開，暴龍一秒就不見，這動作也太快了吧\n\n  \
  \ 然後充氣艇暴龍怎麼咬都咬不破，這暴龍牙齒也太\n\n   爛了吧，該看牙科了\n\n4.主角團走路居然比金主開車下山還快，然後突變龍又\n\n  剛好到碼頭附近，真是巧\n\
  \n5.信號彈在水裡也可以燃燒嗎?\n\n6.船開出一段距離了，鄧肯居然出現在附近，他會\n\n  瞬間移動?\n\n7. 巨龍這麼大，草叢遮的住?\n\n雖然這部bug很多，但還是恐怖刺激，個人評價1>4>3>2\n\
  \n--"
