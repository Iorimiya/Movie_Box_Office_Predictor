title: '[負雷] 少男少女-虎頭蛇尾的普通之作'
content: '早上剛看完，有雷











  ———————



  板上幾乎沒什麼討論


  看完因爲實在太難受


  上來抒發一下




  全片走一個沉重的路線


  在這方面的表達，我覺得還不錯


  素人演員男女主角也發揮的還蠻好


  演技有超乎我的預期


  滿期待他們未來的表現的




  ….


  優點講完了


  接下來講看的心累的地方


  ….




  整部片從一個小屁孩出發


  有些不合邏輯的地方我是能接受的


  誰沒有中二過


  男主真的就是中二極致的那種


  但生活在社會底層


  活得像8+9


  或是被生活逼迫成8+9


  勒索、賣淫、販毒等等


  導演有讓我們看到底層人的冷暖淒涼



  但以一個故事來看


  背景設定的不錯


  但最重要的故事呢？


  故事好歹有個起承轉合



  我知道了他們很慘，被生活逼迫成了這樣


  然後？


  就沒了


  停在一段走入大海的畫面



  到底三小？


  下海嗎？


  不知道是不是我沒有慧根


  最後一段男主從海上的小屋往海裡走


  我真的看得很跳tone




  欸不是


  上一幕女朋友還丟在旅館和一尊警察的屍體待在一起


  他跑去殺他媽的客兄


  他媽要承擔下所有的罪責


  男主卻還差點想強暴他媽



  這段轉折應該是整部劇的高潮了吧！？




  等我還在期待接下來應該會怎麼發展時


  結果就….



  結束了？！？！




  不說我以為我在看黑鏡


  片尾總是有我看了三小的感覺





  我不知道這樣對文青人士是否很加分啦


  什麼都很隱晦


  都藏在細節


  但對於一段故事


  我所期待的是女主後來怎麼了


  一個人和警察屍體在賓館，對他這個人產生了什麼影響？


  她會因為這樣發現一切都是錯的重新開始


  還是落入更不幸的深淵？



  男主嗑藥暴力傾向


  醒來後是否會對自己殺人以及對媽媽強暴未遂感到後悔？


  如果想強調的是社會底層的悲哀


  那麼是否可以鋪陳一個底層人物的悔悟？



  或許走向大海有要表示這個感覺


  但我真的看不懂


  也沒什麼人討論，所以我連想看大神的分析都看不到



  感覺就是虎頭蛇尾



  唯一看到一個網友的評論


  是男主對於金錢與權力之於性關係的想法和轉換


  我覺得講的不錯


  客兄有錢，就可以幹他媽


  教練有權，就能幹女學生



  所以當他殺了媽媽的客兄時


  他覺得現場現在掌握權力的是他，所以想幹他媽


  因為他對性關係的價值觀已經完全扭曲了




  雖然大神分析的很好


  但我還是想看導演再説清楚一點



  到底男主是不是媽媽親生的？


  這個也是看不出一個所以然


  至少看得出來媽媽是真的把他當親生兒子對待就是了




  另外


  媽媽的表現


  我覺得差強人意


  因為有很多時候媽媽感覺應該情緒可以很有張力


  像是客兄告發小孩她趕客兄出去的時候


  那個聲線太平穩了


  還有客兄被殺的時候


  他在旁邊看起來不知為何一點都不緊張


  也不激動


  正常應該會先驚嚇，再冷靜處理吧？


  但她看起來並沒有


  或許有但真的看不太出來


  就….感覺這個情緒沒有渲染出來


  有點可惜了



  總歸一段


  如果10分，我應該給5分


  因為我覺得男女主需要一個結局


  不管是正面還是負面的


  至少有個收尾吧




  以上























  --'
