url: https://www.ptt.cc/bbs/movie/M.1700668474.A.193.html
title: '[雷] 少男少女'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~










  看海報覺得還蠻浪漫唯美的


  但劇情跟我想像中落差頗大


  整體而言我還蠻喜歡的


  劇情蠻簡單的講述了鄉下小鎮的一對少男少女的生活


  他們各自因為自己的不快


  萌生想要離開這個地方的想法


  雖然簡單但是基調蠻黑暗的





  電影一開始是一名少男


  剛睡醒 看起來正準備洗漱


  結果撞見客廳裏有一對男女正在燕好


  場面有些尷尬


  但興許是青春期對於性的好奇


  少男移不開眼的看著


  而體位轉換的過程 女人似乎也發現了少男的窺視



  如開頭一般的性愛的橋段在電影中出現頻率頗高


  不過每段對於男主這個角色的塑造而言都有不少的影響


  因為原生家庭疏於（又或者說難以）照料教導的情況下


  男主對於很多事情都是陌生無知的 尤其是性


  他想渴望了解愛的本質與男女關係之間的面貌


  但他所接觸到的


  媽媽和他人的性


  女主和他人的性


  自己和她們的性


  這些對於他而言都是不純粹的


  不是發乎於情的享受 而是帶著權力掌控的利益交換


  而片尾少男令人不解的舉動似乎也與此相應



  我覺得其實少男少女


  是很尋常常見的小孩


  想要追尋愛與了解愛 想要師長的肯定


  以及對自身的迷茫 與對於自由未來的憧憬


  這些都是很一般的事情


  只是他們浸泡在不尋常的生長環境中


  所以也走上了不尋常的道路



  電影還有一個比較特別的安排是


  大家都沒有名字


  而且彼此的關係也沒有明說


  所以要靠著劇情互動才能看出他們的身份還有關聯性


  我還蠻喜歡這樣的安排的（不過得基於人物關係簡單的前提下）


  另外


  值得一提的是電影的畫面和音樂都表現的很不錯


  對於氣氛的塑造功不可沒


  --'
