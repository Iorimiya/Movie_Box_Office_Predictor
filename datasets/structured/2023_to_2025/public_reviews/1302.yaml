title: '[問片] 好多富豪劫持少男少女的片'
content: '歐洲某個國家內的幾個大富豪合在一起強行劫走很多的少男少女，


  把這群少男少女集中在某座城堡內，


  然後有一些優雅的大嬸穿的還滿性感的在幫他們說故事，


  這部片好像是限制級的年代有點久遠，


  之前有看過原文的片段熊熊想不起來！


  突然很想知道結局是怎樣？！


