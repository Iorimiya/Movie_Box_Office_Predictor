content: "正值青春年華的少男少女，拼了命的想離開這座濱海小鎮\n涉世未深的他們，走上了無法回頭的路\n想離開這裡，哪裡都好....\n\n\n監製｜唐在揚\n\
  編劇 · 導演｜許立達\n主演｜胡語恆、尹茜蕾、管罄、李銘忠、姚淳耀、張懷秋\n\n\n《抽獎方式》\n11月7日 23:59 前，推文留言你想要參加【少男少女】的〈場次〉與〈原因〉，\n\
  就有機會搶先看電影！\n（如：台北場，我想看少男少女！）\n\n《獎項內容》\n【少男少女】電影試映券（一組2張）\n\n\n《特映會場次》\n台北場：11/15\
  \ 18:50 (週三) 台北誠品 20組 （一組2張）\n台中場：11/14 19:00 (週二) 台中新光 10組（一組2張）\n高雄場：11/16 19:00\
  \ (週四) 高雄草衙道國賓 10組 （一組2張）\n\n《中獎通知》\n11月 8日 23:59 前，公布中獎者於回文內，並寄站內信通知得獎者得獎事宜。\n\
  11月10日 18:00 前，請各位中獎人務必回覆領獎資訊，恕不接受逾期回覆。\n\n《注意事項》\n1.試映券為非賣品，嚴禁兜售等圖利行為。\n2.票券尚未劃位，請於開演前60分鐘自行領票，座位劃滿即不受理。\n\
  3.請準時入場觀賞，電影開演後10分鐘戲院與主辦單位有權謝絕入場。\n4.如本活動因不可抗拒之特殊原因無法執行時，主辦單位有權決定取消、終止、修改或暫\n停本活動與延遲得獎公告。\n\
