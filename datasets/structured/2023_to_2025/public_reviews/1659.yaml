title: '[極好雷] 非關男孩'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~











  No man is an island.


  這部戲不是在講一個38歲的男人與孩子的事情

  it''s a man to man thing.


  一個長不大的大男孩

  與 想要急著長大的小男孩

  兩人之間的火花


  劇情其實不用說太多

  但是到中段

  你會發現 marcus比你想像地成熟許多

  而Will 是跟你想得差不多幼稚XD


  兩個人其實是可以在同一個層級來談論的








  難能可貴地是

  Will了解到了 這個不速之客Marcus

  對於自己 是個什麼樣的一個存在與意義


  看到中段還沒覺得這部戲有什麼太特別

  但是後來兩人之間的互動

  你可以了解到


  某一個人在你心中是

  擁有一個特殊地位的


  所以 Will去拯救了Marcus

  又看著他 慢慢地殺死自己........


  然後Will出來伴奏

  這是朋友才做得到的事情








  然後 Will代替了Marcus

  讓大家殺死了自己 QQ


  再來就是美好的結局了




  這是一個大男孩與小男孩交心的故事

  而處於這個年紀的我


  要加到一個知心好友

  是多麼困難的事情


  我很羨慕劇中的Will跟Marcus

  大推這部電影











  --





  --'
