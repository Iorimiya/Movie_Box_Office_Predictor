title: '[好雷] 非關男孩觀後感之享受孤獨'
content: '──「我認為每個人都是孤島，這年頭大家都很孤獨，這是個孤島年代，百年前的

  　　　人必須互相依賴，當時沒有電視、CD、DVD 或義大利咖啡機，沒有任何方便

  　　　的電氣產品，現在你可以擁有屬於自己的樂園，只要有錢有閒，就可以當座

  　　　熱帶小島吸引性感的辣美眉。我就是座快樂小島，我覺得自己挺酷的，我喜

  　　　歡想自己是性慾小島。」


  　　　　這是電影非關男孩(About a Boy)一開頭男主角威爾(休葛蘭飾)說的話。


  　　　　電影男主角有兩個，一個是三十八歲沒有工作無所事事沒有朋友的老男人

  　　以及一個十二歲在學校被排擠被欺負沒有朋友的小男孩，兩個沒有朋友的男性

  　　相遇然後走入彼此的生命。電影傳達的主軸很明顯，人是需要朋友的。


  ──「人生就像一齣電視劇，我是威爾秀的主角，威爾秀是一齣獨角劇，來賓來來

  　　　去去，只有我是主角，我必須獨挑大樑。」


  　　　　這是電影裡的一段威爾的旁白。


  　　　　我認為，人終究是孤獨的。或許該這麼說，人要學會孤獨。換句話說雖然

  　　孤獨但也可以同時擁有朋友。或許有的人認為「人終究是孤獨的」這句話過度

  　　悲觀，但我一直不這麼認為。人是孤獨的，可以孤獨得快樂或不快樂。


  　　　　人是群居動物，要找到像電影裡男主角般真的沒有朋友的人比例應該是少

  　　數，雖然現代科技異常發達，但人心的距離卻越遙遠，重點在於我覺得現在人

  　　的心卻是越來越脆弱。


  　　　　或許因為人心遙遠所以我們渴望有人愛有人陪伴，然而人與人之間的互動

  　　並不是如此簡單你情我願，導致被對方拒絕時很多人跌落無底深淵。


  　　　　所以我覺得該學會孤獨，所謂的學會孤獨不代表目中無人不需朋友不去愛

  　　人，而是應該學會先待自己好。


  　　　　要孤獨得快樂就要學會享受孤獨。


  　　　　既然說到孤獨就得提提寂寞。這兩個詞外在的字型與構造都不同，但其所

  　　代表的涵義卻不是那麼容易釐清，尤其是每個人的見解不同其解讀出來的意思

  　　也會不同。有的人可能會認為這兩個詞相差不遠，但對我來說卻是南轅北轍迥

  　　然不同，偏偏無奈的是我的能力不好，不能明確指出其相異之處。


  　　　　我以為寂寞與孤獨是對立的，那孤單又該擺在何處(我也不知道)。或許可

  　　以籠統地這麼說，一個害怕孤單的人可能比較容易寂寞；而一個能夠面對孤單

  　　的人或許比較可以享受孤獨。


  　　　　寂寞應該比較偏向心靈層面(可能愛情的比例上佔最多)，那應該算是一種

  　　情緒，當我們有些慾望沒有辦法被滿足時出現的失落感使我們落寞，如果把這

  　　慾望套在情感上時，那落寞應該就可被稱為寂寞。孤單或許是外在形式上的，

  　　是外在的個體而非內心世界，從大陸撤退來台的榮民無親無故孤老終身，我想

  　　這就是孤單的最佳證明。


  　　　　有的人雖然結婚了卻跟另外一伴同床異夢，有的人明明有男朋友但對方心

  　　可能不在她們身上，所以也才有「寂寞少婦」這個名詞，但我們卻沒聽過孤單

  　　少婦。所以說，寂寞是心在寂寞，失戀的人其好朋友看他如此替他辦了歡樂派

  　　對，人來人往好多人陪伴他，大家一起唱歌喝酒歡樂，雖然嘴巴也是上揚笑聲

  　　不斷，但派對落幕一人躺在床上時還是痛哭流涕椎心刺痛，外在上再怎麼不孤

  　　單，心裡還是寂寞萬千啊。然而有的人雖然獨來獨往，但音樂是他的朋友，書

  　　籍是他的朋友，電影是他的朋友，即使一個人去看電影一個人去逛書局一個人

  　　喝咖啡一個人聽音樂，但他們就能夠自得其樂充分享受一個人的自由時光，縱

  　　使外在再怎麼孤單他們一點也不寂寞。


  　　　　就以我為例，因為喜歡人多熱鬧的感覺(我也會討厭寂寞)，所以儘可能地

  　　會呼朋引伴三五成群大伙兒一起行動。看電影時會找人一起去，但如果今天剛

  　　好朋友都有事情要忙不能隨行，我並不會害怕孤單而不敢去看電影，因為我想

  　　看電影，我想看「這部電影」，所以我可以一個人去看(享受孤獨)。


  　　　　人一定會害怕寂寞，但我們可以學會享受孤獨。


  ──「一個人要懂得安排自己的時間，秘訣就是把一天分成不同單位，每一個單位

  　　　不超過半小時。」


  　　　　這是電影非關男孩(About a Boy)裡面一句很有名的台詞。


  　　　　這跟我常說的生活的重心一樣。以自己為出發點，安排自己的時間享受自

  　　己的生活。倘若我們把對方成為自己的重心但對方卻不是如此時那種感覺是很

  　　難受的。享受孤獨跟安排自己的時間、享受自己的生活是同樣的道理。


  ──「每個人都是一座孤島，我絕對相信這點，但其實有些人是群島的一部分，海

  　　　底下其實緊緊相連。」


  　　　　雖然片尾威爾說每個人都是一座孤島，但在海底下其實卻緊緊相連。然而

  　　反過來說，雖然我們都是在海洋表面下相連的島嶼，但終究只是一座島嶼而已

  　　。


  ──「威爾：重要的是你要讓自己快樂。

  　　　馬克斯：我試過，她也試過。不過沒用，你需要別人。

  　　　威爾：別人能讓你快樂，也能讓你不快樂。」


  　　　　從這簡單的對話可以呈現出一個人快樂或不快樂跟朋友是沒有關係，因為

  　　朋友可以讓我們快樂也能夠讓我們不快樂，快不快樂完全取決於自己的心，然

  　　而這跟我說的「人終究是孤獨的」其實遙相呼應。


  　　　　我想，人是需要朋友的，然而我們也可以孤獨，享受孤獨。


  --

  人們之所以懷念過去，正是因為我們回不到過去。



