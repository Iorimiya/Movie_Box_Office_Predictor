title: '[情報] 休葛蘭《非關男孩》電影預告 '
content: "《BJ單身日記》製作群賣座40億暖心經典！\n\n休葛蘭主演【】About a Boy 電影預告\n\n\n\n5/19(五) 經典重現\n\n\
  英倫男神  主演！\n\n他曾認為自已會孤老終生\n直到遇見12歲的他……\n\n\n《》5月19日 (五)經典重現\n\n改編自尼克宏比百萬暢銷同名小說\n\n\
  《》製作群傾力打造暖心之作\n\n《愛是您，愛是我》《》英倫男神\n\n領銜主演\n\n《》《X戰警 系列》\n\n 一鳴驚人大銀幕演出\n\n2003 奧斯卡金像獎\
  \ 最佳改編劇本 提名\n\n2003 金球獎 音樂及喜劇類最佳影片、最佳男主角 提名\n\n003 英國奧斯卡 最佳改編劇本、最佳女配角 提名\n\n沒有人是一座孤島......\n\
  \n生活富裕、英俊瀟灑的單身雅痞威爾（ 飾）發現單親家長互助會是一個泡妞天堂\n後，便積極參加該會活動，也遇見一個12歲的古怪男孩馬克斯（ 飾）。\n\n馬克斯在學校經常受到同學欺負，更有個患有憂鬱症的嬉皮老媽費歐娜（東妮克莉蒂\
  \ 飾\n）。\n\n一次意外，讓馬克斯把威爾當成了生命中的救星，於是開始纏著他不放。\n\n雖然威爾一開始非常排斥這個古怪的小男孩，但他們還是漸漸產生感情的羈絆......。\n\
  \n\n資料來源：\n\n--"
