url: https://www.ptt.cc/bbs/movie/M.1683531389.A.3EA.html
title: 'Re: [情報] 休葛蘭《非關男孩》電影預告 '
content: '這部我是一定會到戲院重看的


  莫名其妙很多人生涯巔峰的電影


  休葛蘭接過最棒的角色


  95年召妓事件後他還是持續在演英倫帥哥暖男(即使全世界都知道他不是)


  這部才是他真正邁向本色轉型的開始


  妳是我今生的新娘很經典


  但休葛蘭最棒的演出我會給這部


  導演兄弟檔第一部長片美國派爆紅


  第三部 環球就讓他們改編尼克宏比的書 編+導


  兩個美國年輕人搞出一部非常原味英國的電影


  劇本還入圍奧斯卡


  也是他們掛名合體執導的最後一部片


  之後他們各自有精彩的作品  也搞砸一些大片


  但巔峰就是這一部了


  不用說也完全捧紅尼可拉斯霍特


  至今全部人都在好萊塢走跳



  --'
