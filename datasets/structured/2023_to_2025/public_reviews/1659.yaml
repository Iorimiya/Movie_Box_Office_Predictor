url: https://www.ptt.cc/bbs/movie/M.1684421280.A.D53.html
title: 'Re: [討論] 休葛蘭《非關男孩》為何重映 ?'
content: '防雷


















  非關男孩對於單親家庭的青少年心裡健康跟教育問題有很深的體現


  馬可斯因為母親深陷在離婚的失敗中，有著嚴重的憂鬱症跟自殺傾向，也造成著馬可斯有著懦弱（不敢告訴他人母親狀況），遇事不敢反抗（怕再給母親負擔）的性格。


  風情萬種的瑞秋，雖然是單親媽媽但仍然表現的光鮮亮麗，且事業有成；但她的兒子私底下其實是易怒且會欺負同儕的性格，但在母親面前絕不會表現出來，很顯然瑞秋可能在兼顧事業跟家庭方面忽略了兒子。


  在這個單親已是常態的時代，雖然不代表單親就無法教育出正常的孩子，但或多或少都一定會造成影響。


  忽略就是一個很大的主因，也可說是身兼父（母）職已身兼乏術，無法面面俱到。



  當看完你會驚覺，為何很多時候當馬可斯快被逼到爆發時，只有威爾能看得出他的窘態而出手幫助他。



  例如跟馬可斯父親聚會時，朋友差點說出母親曾自殺的事情，威爾馬上將在公園扔死一隻鵝的事情爆出來轉移了焦點。


  你會詫異為何在場的大人，都沒意識到在他人面前說出馬可斯的母親狀況，會嚴重傷害到馬可斯的內心。



  在表演現場馬可斯出糗快要被群眾嘲笑時，威爾便出手將被嘲笑的目標轉移到自己身上，同樣的情況換做另一個大人可能就是帶個嘲笑的口吻將馬可斯趕了下去，那勢必將在青少年心中留下很深的傷痕。


  你會驚覺很多時候那些所謂的大人，都沒法看出青少年心中的想法與困境，但為何一事無成的威爾偏偏能一眼看出？


  也許是大人們長大之後都忘記了自己也曾是個青少年，而威爾內心有個長不大的孩子，所以他才能立刻理解馬可斯的狀況並遇見後果，進而出手幫助他。


  當然也可能是威爾有著相同的經歷，看著馬可斯便看到從前的自己，所以進而衍生出“每個人都是一座孤島”這種生活方式，但真的這樣演整部片的調性將會變得非常灰暗。



  也許當我們都是青少年時，我們都妄想有一個威爾幫我們擋著前方的阻礙，適時給予陪伴跟幫助，但實際上威爾從不存在，當我們承受創傷而長大過後我們都忘了那個曾經希望出現的人。




  或許



  當看完電影之後，你可以試著當別人的“威爾”，去幫助他人。










  此片雖然是喜劇，但對於有相同成長經歷的人來說，其實是恐怖片，尤其看到東妮克莉蒂飾演憂鬱症的母親時。


  -----

  Sent from JPTT on my Xiaomi Redmi Note 9 Pro.


  --'
