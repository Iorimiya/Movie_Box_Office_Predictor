title: '[新聞] 當《戀戀風塵》遇見飛碟 趙德胤把金馬變'
content: '新聞網址：




  當《戀戀風塵》遇見飛碟 趙德胤把金馬變科幻了



  繼陳哲藝、畢贛之後，「金馬53年度廣告」推出趙德胤

  執導的最終篇，他以最新的360度VR全景拍攝技術，

  重現侯孝賢1986年經典影片《戀戀風塵》的一場戲，

  甚至還有飛碟亂入。



  趙德胤拍攝「金馬53年度廣告」，添加了畫龍點睛的

  視覺亮點，觀眾可以在Youtube，用滑鼠上下左右游動，

  360度欣賞二位男女主角柯震東、吳可熙，選擇與主角

  同行，或者遠望他們背影，甚至鳥瞰、仰視都可以，

  猶如身歷其境。



  而且趙德胤導演，還為了他下一部拍科幻片打廣告，

  在這支金馬宣傳影片中，加了個「不速之客」：

  竟有飛碟「亂入」，相當趣味。片中，柯震東與

  吳可熙跨越時空，回到主角純樸的生活狀態，

  穿著制服、背著書包走在回家路上。



  柯震東表示：「很期待拍攝成果，第一次參與360度

  VR拍攝，配合鏡頭設置，還要有不同以往的走位方式，

  很有趣。」吳可熙的反應則是大笑：「這次終於可以演台灣人了。」


  --'
