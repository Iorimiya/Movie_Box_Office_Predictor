url: https://www.ptt.cc/bbs/movie/M.1432131290.A.139.html
title: '[新聞] 侯孝賢「戀戀風塵」遠播美國聖地亞哥'
content: '美國聖地牙哥「攝影博物館」Museum of Photographic Arts及「太平洋藝術運動」

  Pacific Arts Movement與洛杉磯辦事處臺灣書院合辦「臺灣電影焦點：侯孝賢電影回顧

  展」(Taiwan Cinema Spotlight：Hou Hisao Hisen)，自5月28日起至5月30日，以每日映

  演候孝賢的一部電影，選映「戀戀風塵」、「尼羅河的女兒」及「千禧曼波」等3部代表

  作品。


  在文化部贊助下，洛杉磯辦事處臺灣書院再度與美國聖地牙哥「攝影博物館」與「太平洋

  藝術運動」合作，同時邀請著有「1960年代至1970年代臺灣電影」（Transnational

  Representations: The State of Taiwan Film in the 1960s and 1970s）一書作者

  James Wicks與「太平洋藝術運動」藝術總監Brian Hu等人共同主持映後Q&A 導聆，帶觀

  眾更深入了解臺灣社會人文景況。


  洛杉磯臺灣書院表示，經典影片保留了全民的記憶，本次選映3部侯孝賢導演的力作，首

  度以35釐米規格影片在聖地牙哥放映，呈現臺灣60年代從農業社會轉變至80年代工業化社

  會流行文化的興起，至當今21世紀與全球連結的社會時代下，青少年成長的故事。希望透

  過本次選映的侯孝賢導演作品及導聆，讓南加州觀眾進一步瞭解臺灣的社會及文化。


  侯孝賢導演為臺灣新浪潮電影代表人物，著名的長鏡頭電影美學及濃厚人文關懷奠定其獨

  一無二之風格，不僅為臺灣最重要電影導演之一，也深受國際各大影展及各國導演一致的

  推崇。透過本次類型各異的作品回顧映演，盼吸引更多新生代觀眾體驗臺灣電影的獨特風

  格。侯孝賢2015年新作「聶隱娘」亦入圍坎城影展。


  文化部指出，本次活動舉辦地點「攝影博物館」，座落於聖地牙哥著名的Balboa Park藝

  術文化園區，緊鄰美術館（Timken Museum of Art）及自然博物館（Natural History

  Museum）等，藝文氣息濃厚。該館Joan & Irwin Jacobs電影院是當地極為少數仍配備35

  釐米影片播放設備的電影院，一年四季舉辦各類影展與主辦「聖地牙哥亞洲影展」的「太

  平洋藝運」，為當地著名藝文組織。


  此次續與兩個組織合作，推出臺灣名導經典電影回顧，為當地注入一股臺灣電影新浪潮。

  詳細影片介紹、映演時間及購票資料，請至該館官網（）查詢

  。


  新聞網址：


  --'
