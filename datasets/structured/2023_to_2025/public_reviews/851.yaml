url: https://www.ptt.cc/bbs/movie/M.1441008287.A.4A4.html
title: '[好雷] 《戀戀風塵》人生就是種蕃薯啊 '
content: '與其說是《戀戀風塵》的感想，

  不如說是最近看了很多「導讀聶隱娘」後，

  對於如何看侯導的電影有了一些感觸。



  圖文好讀版（無音樂）






  「沒種的時候都沒下雨，等到種了，颱風卻來了，把藤都吹斷了。」


  －《戀戀風塵》



  最近看到一些對於電影《刺客聶隱娘》的導讀，

  需要這些導讀的，想必對於侯導的電影涉獵不多，

  其實與其看完那些沒用的歷史背景，

  不如直接去看《戀戀風塵》的最後十分鐘。



  剛開始「學著」看侯導的電影時，

  我最大的疑惑就是「到底誰會喜歡這種電影？」

  如果我不是一個讀書人、知識份子、文藝青年（笑），

  我絕對不會一部又一部地接著看，

  彷彿這是什麼宿命，每隔幾年，無奈地輪迴著。



  「無奈」。



  我並沒有按照什麼特定的順序看侯導，

  但一直看到戀戀風塵的結尾時，

  我才終於明白－說明白也許太自負了－應該說，

  至少我終於找到一個屬於我自己的角度看侯導，

  那就是「無奈」。



  你不用知道聶隱娘是誰，

  你只要知道她是一個很無奈的人，

  然後坐下來好好欣賞她如何在無奈中掙扎，

  如何學會接受，又如何反抗自己的接受，

  你知道這些並不是因為你讀過新舊唐書，

  而是因為這是侯導的電影，

  侯導只會拍一種電影。




  《戀戀風塵》裡，阿遠的女友兵變了，

  阿遠的弟弟寫信到金門說：



  「哥，阿公說這是緣份不能勉強。」



  退伍後，阿遠回到山城，

  和阿公一起抽著煙，聽他對著蕃薯碎唸著：



  「沒種的時候都沒下雨，等到種了，颱風卻來了，把藤都吹斷了。」




  人生，

  有些無奈像是兵變，只能接受，

  而有些無奈像是種蕃薯，

  認清事實後，還是要接著努力，

  因為人生還是要繼續。




  這就是侯導的電影，

  最後一定要拉一個長鏡頭，

  恍惚之間，

  螢幕已經在播製作名單，

  而你腦裡還是一直纏繞著那些碎唸。




  「現在這些藤長成這樣又要割了，如果不割，蕃薯種出來就只有這麼小，

  藤割了蕃薯才能吸收養分，才會長大。」




  「顧這些蕃薯比顧巴蔘還要甘苦。」




  「幹伊三妹。」




  「今年，颱風來得特別早，不知道來了幾次，阿公種這些蕃薯，今年收成一定不好。」




  「幹伊三妹...」




  --'
