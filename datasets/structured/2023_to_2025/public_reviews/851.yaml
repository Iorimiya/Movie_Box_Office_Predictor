title: 'Re: [討論] 預約的戀戀風塵終於到館了'
content: '自問自答一下

  因為有大大在推文寫

  數位修復版的影像侯導不滿意

  後來出的2k修復版比較是侯導眼中的台灣


  我深深認同這個眼光


  小時候 一到假日 父親就帶我們往山裡跑

  我總被繚繞的山路弄得暈車嘔吐

  但有次到太魯閣 我忘記了身體的不適


  古人說：鬱鬱蔥蔥

  台灣的山林真的就是這樣。


  那個綠 鬱鬱蔥蔥

  帶著青春期 濃郁到化不開的深綠與憂愁


  之後 每次我坐台鐵西部山線列車

  經過瑞芳 九份 平溪等路段

  都會在那樣的綠色中漫步

  常常伴著微微的雨 好似一場洗滌


  這是2k的山林


  這是數位的山林



  --'
