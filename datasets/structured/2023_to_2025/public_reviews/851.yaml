url: https://www.ptt.cc/bbs/movie/M.1439555634.A.A7E.html
title: '[好雷] 戀戀風塵 - 明天太陽依舊升起 '
content: '無音樂網誌好讀版：



  (註：本篇不特別介紹劇情內容，但文中可能提及劇情片段，不喜慎入)














  最近看了《戀戀風塵》，才發現我似乎不是第一次看這部電影了。關於內容的記憶十分薄

  弱，許多畫面卻仍印象深刻：阿遠和阿雲在晃動的火車上。阿遠和阿雲在戲院後的空間吃

  飯。阿遠和阿雲發現摩托車遭竊。年代久遠，上一次看還正值青春，對劇情的淡忘大抵是

  無可避免 -- 畢竟這部電影淡得像水，想必當時年輕的自己不曾將它放在心上，但侯導的

  畫面卻美得像詩，也因此深深刻印在腦海之中。


  隔了大概有十年再看，忽然發現感受完全不一樣了。電影還是一樣平淡的鏡頭、一樣平淡

  的生活瑣事、一樣盡量避開激烈的情緒交鋒；但，或許是心境不同了、也或許是電影看得

  更多了，這一次觀看卻發現一幕幕平實的影像，竟都帶來莫大的震撼。


  整個故事非常簡單：九份長大的一對青梅竹馬，初中畢業就到台北工作；兩人彼此認定、

  互相照看，女主角卻在男主角服役期間兵變與郵差結婚。如此單純的故事，讓電影有了開

  頭、有了結束；但在侯導的電影語言之中，卻感到故事並非主體，重點反而在於生活。


  令人措手不及的失戀幾個畫面就帶過了，鏡頭卻不斷拍攝劇中人吃飯、工作、移動，然後

  還是吃飯。細微的情感變化在餐桌上流動，不被言說卻一樣真真切切：一天 24 小時、一

  個月 30 天，日子多半如流水帳一般的過，能烙在心上的時刻其實並不那麼多，而感情的

  建立就存在這些微小的、逐漸的、日復一日的生活當中。它是會驟然終止的，就像阿雲那

  麼突然的不再寫信來了一樣，但在那之後呢？我們一樣還得繼續吃飯、工作、移動，然後

  再吃飯。然後也許某些劇烈的挫敗、某些刻骨銘心的眼淚，其實就沒有那麼嚴重了吧？


  但侯導卻木訥得連這點體會都不明確的倒給觀眾，只在電影結束前擺了一個長長的山城鏡

  頭 -- 陽光下美麗的九份，一片雲浮過來、又再浮過去，恰如一片落葉使湖水起了漣漪，

  卻終究會歸於平靜。接著我們看見阿遠穿著阿雲親手做的那件花襯衫，與阿公談著今年的

  收成；有人認為花襯衫代表對阿雲永遠的思念，我卻覺得那是種釋懷 -- 因為放下了，所

  以過去的回憶不再使我們悲傷、反而成為我們的一部份，而明天太陽依舊升起。




  個人評分：7 (推薦)


  筆者粉絲頁：


  --'
