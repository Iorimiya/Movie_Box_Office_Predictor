url: https://www.ptt.cc/bbs/movie/M.1661993650.A.AD2.html
title: '[新聞] 台灣新電影40週年 戀戀風塵、稻草人大銀幕再映'
content: '台灣新電影40週年 戀戀風塵、稻草人大銀幕再映[影]


  2022/8/31 16:48（8/31 18:54 更新）



  金馬終身成就獎得主、導演侯孝賢在1986年執導作品「戀戀風塵」，描述礦工孩子到台北

  打拚的70年代時代背景，以及小情侶的青澀戀曲，將於台灣新電影40年回顧展中重映。（

  國家影視聽中心提供）中央社記者葉冠吟傳真 111年8月31日


  （中央社記者葉冠吟台北31日電）適逢台灣新電影40週年，國家影視聽中心策劃回顧展，

  重映「戀戀風塵」、「稻草人」、「牯嶺街少年殺人事件」等經典外，也挖掘同代難得一

  見作品，召喚新電影的叛逆與革新精神。


  「台灣新電影」（1982-1986）以革新運動的姿態載入史冊，在台灣影史上占有重要地位

  ，代表人物包括知名導演侯孝賢、楊德昌等人，一群電影工作者以行動和作品掀起巨浪，

  為台灣影史留下傳奇與重要的文化遺產。


  影視聽中心為這次「再新電影出發的時候：台灣新電影40年回顧」專題影展，策劃「開始

  的開始」、「新電影再發現」、「結束的開始」、「在野的新影像」4個子單元，以被視

  為台灣新電影起點的電影「光陰的故事」（1982）為分水嶺，視野由中心擴及歷史角落與

  時代邊陲，讓更多作品有重新觀看與詮釋機會，選映34部電影。


  不只楊德昌編劇的「一九零五的冬天」、張毅「竹劍少年」、金仕傑「那個破樓梯怎麼辦

  」、柯一正「迷林」等作在大銀幕播映外；同時也重新整頓典藏，如麥大傑「阿福的禮物

  」、萬仁「惜別海岸」等作品，進行4K畫質重新掃描、調光上字，讓闊別多年的新電影，

  在最好的時刻被好好閱讀。


  此次「再新電影出發的時候」影展的名稱靈感，取自於已故電影人邱剛健未完成的詩集「

  再淫蕩出發的時候」。超前時代的電影先鋒邱剛健，為華語電影不能忽視的身影，身兼詩

  人、編劇、導演多重身分，曾以劇作3度獲得香港電影金像獎最佳編劇，並以「三個女人

  的故事」獲得第26屆金馬獎最佳編劇。


  本次影展也將放映邱剛健唯3部導演作品「紅樓夢醒」、「唐朝綺麗男」、「阿嬰」，以

  此對應到台灣新電影一切革新、勇於嘗試的先鋒精神。


  「再新電影出發的時候：台灣新電影40年回顧」於10月7日至11月27日為期8週放映，票券

  預計於9月16日週五中午12時起，OPENTIX售票系統正式開放購票。（編輯：張芷瑄）

  1110831


  ---


  《戀戀風塵》Dust in the Wind ｜藍光發行 Blu-ray｜全新數位修復預告 Trailer｜中

  影,中影數位電影頻道,經典影片,數位修復




  --'
