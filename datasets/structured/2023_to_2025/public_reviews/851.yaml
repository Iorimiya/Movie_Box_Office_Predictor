url: https://www.ptt.cc/bbs/movie/M.1514846749.A.CCB.html
title: '[影評] 聞天祥評 / 戀戀風塵'
content: "戀戀風塵　Dust In The Wind\n\n\n\n2014 - 03 - 12\n\n--\n\n收到王晶文因心律不整猝逝的消息，一陣驚愕。\n\
  許多哀悼的電影朋友其實和他並不熟，\n那份情感大都來自他唯一主演的電影《戀戀風塵》（1986），\n已然成為許多人共同的鄉愁。\n\n《戀戀風塵》是由吳念真「奉獻」他的初戀故事，而被侯孝賢搬上銀幕。\n\
  男孩阿遠（王晶文）與女孩阿雲（辛樹芬）青梅竹馬，\n他先從九份礦村出去，在台北一邊工作、一邊讀夜校，後來女孩也來作裁縫。\n\n之後阿遠去金門當兵，阿雲還大費周章送給他一千多個寫好姓名地址、貼好郵票的信封，\n\
  要他每天寫信給她（男孩是這樣成為作家的吧）。\n結果阿雲卻移情別戀，嫁給送信的郵差。\n後面這一點，教當年國防部拒絕協助本片拍攝，\n因為它觸及「兵變」，對軍心有負面影響。\n\
  \n哪裡知道侯孝賢這部電影拍得淡到不能再淡，\n男女主角經歷的不過是女孩剛來台北差點在月台被騙，\n而男孩和騙子起衝突，把老闆兒子的便當摔爛也不敢說；\n女孩在同鄉友人聚餐被慫恿敬酒，男孩事後的不以為然等等這類芝麻綠豆。\n\
  但仔細看，這些事件都反映了早已熟識的兩人心裡的在乎，\n生活即是重點，拍環境即是拍人。\n\n當服役中的阿遠收到弟弟來信告知阿雲結婚的事，\n侯孝賢切進來的竟是完全沒有對白的戲，\n\
  只見阿遠一家大小只敢在自家門前排排坐，\n原來阿雲母親不讓她與新婚丈夫進門，\n反而是阿遠母親一副是自己兒子做錯事的模樣而想當和事佬，\n人情世故，何需多言？\n\
  反而可以更煽情的部分，比方男主角母親把應該給媳婦的傳家禮物\n送給了別嫁他人的女主角，只透過畫外音帶過。\n\n也難怪記得當時有次聽吳念真演講，\n他打趣說第一次看《戀戀風塵》見到自己的初（失）戀故事被拍得幾乎認不出來，\n\
  有種被「強暴」的感覺，但是再看一遍，則有種「認了」的豁達，\n因為導演已經拍出另一部超越他意想的電影。\n\n是啊！我相信無論什麼時候，\n都會有人覺得這是部平淡的流水帳，因為他們見不到戲劇化的激情。\n\
  然而在擺脫傳統劇情片對公式與煽情主義的依賴後，《戀戀風塵》無疑走得更遠。\n片中大量的「省略」反倒清楚體現侯孝賢藉由生活細節對人際與性格的有效掌控。\n\n這也是為什麼有愈來愈多人被這部電影的結尾震撼：\n\
  阿遠歷經情變退伍返鄉，和阿公（這也是布袋戲國寶李天祿第一次在侯孝賢電影出現）\n在菜圃閒話天氣、收成，接著長鏡頭就帶向寧靜山城，\n此時一片皚雲飄過，陽光穿越雲間空隙，俯照、移動於山城之間。\n\
  較諸天地，一切都顯渺小，卻又同時被其撫慰。\n無論以景喻情、或人景交融，都是嶄新的境界。\n\n大約十年前，我在聯合晚報寫《珈琲時光》時提到了《戀戀風塵》，\n\
  之後收到王晶文的信，才知道當時處理我稿子的竟是《戀戀風塵》的男主角。\n從此以後，我想像的阿遠不是吳念真了，他進了報社，住在陽明山上，\n我會在影展碰到他，他會跟我聊電影，直到突然離我們而去。\n\
  \n天地悠悠，人世無常，更讓我想起《戀戀風塵》的最後一顆鏡頭。\n\n--\n\n原文結束。\n\n--\n\n題外話：\n\n最近終於看了《戀戀風塵》，\n\
  所以把老師的文章轉來，\n才知道原來王晶文已經過世了，\n而且這也是他唯一的演員作品。\n\n另外，當兵時領信那段，有唸到明金城的名字耶，\n我一直在看演的演員，看起來瘦瘦的不大像\
  \ XD\n影片結尾的演員表沒看到他的名字，\n維基百科上查也沒有看到他的資料，好好奇他到底有沒有演這部作品。\n\n--\n   \n   ◥\n  \n \n\
  \  \n￣￣￣￣\n\n--"
