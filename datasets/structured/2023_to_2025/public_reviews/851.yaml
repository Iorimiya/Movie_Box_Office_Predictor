url: https://www.ptt.cc/bbs/movie/M.1630290074.A.A5F.html
title: '[新聞] 中影與黨產會和解 戀戀風塵等國片轉國有'
content: '新聞網址：


  標題：中影與黨產會和解 戀戀風塵等國片轉國有


  內文：

  前總統馬英九在國民黨主席任內，涉及賤賣中影資產，讓中影成為黨產會追討的對象


  多年。而如今黨產會宣布，和中影簽署行政和解契約，中影同意給付9.5億元交易價差，


  並將330部國片版權轉為國有，成為黨產條例施行以來，第一件以「締結行政契約方式」


  解決的不當黨產案件。


  以九份山城為背景，1986年的《戀戀風塵》是許多民眾心目中的經典國片，版權原本


  屬於中影公司所有，但隨著中影確定要繳回不當黨產，影片也會收歸國有。


  位在國民黨中央旁的中影八德大樓，是中影的不動產資產之一，在2006年時被國民黨


  以低價出售，如今中影跟黨產會簽訂和解契約，要把當年的9.5億元交易價差，以及影


  片版權繳還給國家。


  過往國民黨黨營的「中影公司」是台灣國片龍頭，拍攝過200多部電影，買了100多部


  電影版權。但2006年時，時任國民黨主席馬英九，將中影不動產以31億元低價出售，


  330部的電影版權更無償送給買家，涉及背信罪。包含知名導演李安的《喜宴》、


  《飲食男女》、楊德昌的《牯嶺街殺人事件》等國片，形同被賤賣，當時引發已故


  導演李行，以及侯孝賢寫信向國民黨陳情。


  2018年，中影被黨產會認定是國民黨的附隨組織，追討不當黨產。如今雙方簽訂和解


  契約，中影同意交付9.5億元價差給國庫，取得的影片版權也轉讓給國家，換取黨產會


  廢止附隨組織的處分，並不再追究不當財產，成為黨產條例施行以來，第一件以


  「締結契約方式」，解決的不當黨產爭議案件。


  黨產會發言人孫斌表示，「我們認為就是說，這是一個合理的一個條件，那簽約之後


  如果未來履行順利的話，那未來的話中影，我們不再認為他是附隨組織。」


  立委（民）陳亭妃說，「雖然是不當黨產案首例的和解，可是起碼可以避開冗長的


  司法過程，也證明了我們終於可以揭露真相，然後把我們不當黨產的部分追討回來。」


  中影發出新聞稿證實，對和解方案內容「沒有遺憾」。希望這一批珍貴的影片資產，


  移轉國有後，能妥善保存，也成為全民都可使用公共財。


  ------------------------------------------------------


  很多經典的國片，能夠轉為全民共享，真的太好了！


  --

