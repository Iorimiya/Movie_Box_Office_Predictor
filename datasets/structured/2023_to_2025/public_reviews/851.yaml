url: https://www.ptt.cc/bbs/movie/M.1583674609.A.280.html
title: '[好雷] 戀戀風塵'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~









  趁著禮拜天還有時間

  就繼續找辛樹芬的片子來看


  簡單爆雷 就是兵變的故事

  但是也道出兩個青梅竹馬從小到大的關係


  講個我兩個比較有印象的鏡頭

  一個是阿雲送阿遠去當兵，在月台上的表情

  阿遠沒注意到，阿雲的眼睛轉呀轉，淚光閃閃


  最後要走的時候，阿雲是跑著離開月台的

  阿遠你怎麼那麼笨至少牽個手也好啊










  另一個則是 阿公帶著阿遠要去當兵

  一邊放鞭炮一邊送阿遠的鏡頭


  最後一個長鏡頭，阿遠跟阿公走到底

  阿公放著鞭炮 跟阿遠說些話，望著阿遠離去


  鞭炮的煙跟阿公手上抽著的菸是一個對比

  什麼都不用多說，就知道阿公有多捨不得


  最後阿遠退伍，回來跟阿公聊天

  阿公一直講著種的番薯被颱風搞得多亂的事情

  講了好幾次，你以為阿公是老番顛了嗎


  我覺得是，阿公不知道要怎麼安慰阿遠

  但是又沒話好說，只好重複的事情再講一次


  然後望東望西，阿遠跟阿公兩人互看

  就這樣到了結尾





  你說這部戲平淡也好 無趣也好

  但是可以看到過去台灣的一些舊時代的畫面


  光是台北車站的月台畫面 我就沒看過

  再來是以往人的相處之間，與現在的差異


  現在要去哪找到男女相處是這樣交往的呢

  阿雲那麼可愛的女孩，我如果是郵差我大概也會想追她


  反正男朋友在金門當兵，林杯跟你慢慢磨

  哀


  來聽首康康的兵變吧





  --





  --'
