title: 'Re: [請益] 戀戀風塵一問'
content: '借這篇問問


  「金門軍營裡的輔導長向營長說情，讓阿遠請幾天假回台灣，在即將啟程時，阿遠告訴輔

  導長：『我不回去了，回去也沒用，都是別人的老婆了。』」


  所以這段是不是也沒有在電影裡出現？

  我是看my video裡的數位修復版


  也在為一千零九十六封信跟輔導長的話感到苦惱

  重複看好幾次那附近的片段都沒看到

  還想說是不是有什麼版本不同的問題

  但一直上網查也都沒找到哈哈哈







  在維基百科看見劇情內容的一段，而聞天祥老師的影評中也對此橋段有描述。


