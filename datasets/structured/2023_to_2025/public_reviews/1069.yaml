title: '[新聞] 【GIVEN：柊mix】聲優分享主角閃耀魅力！'
content: '新聞網址：



  台灣動漫迷爭相傳頌的「這本BL不得了！」話題之作《GIVEN被贈與的未來劇場版：柊mix

  》，即將在4月3日（三）於台灣珍愛獻映。這回劇場版主角「鹿島柊」和「八木玄純」，

  由人氣聲優今井文也與坂泰斗分別擔綱配音。今井文也不僅在訪談時透露所飾演角色的魅

  力所在，更參與本片的音樂與演唱，讓他直呼：「自從第一次聽到Given的音樂，就感受

  到一種非常獨特的氛圍。」值得一提的是，為了慶祝本片即將上映，台灣片商也順勢公開

  兩大好康特典，分別是接續在正片之後的連續四週「特典彩蛋影片」，以及由原著作者

  Natsuki Kizu親自繪製的「首週入場特典漫畫小冊子」，值得影迷把握機會入場觀賞並收

  藏。





  這次《GIVEN被贈與的未來劇場版：柊mix》的主角是鹿島柊和八木玄純，他們是真冬與由

  紀的兒時好友，也是樂團「Given」的競爭對手「syh」的成員。這次劇場版與之前電視動

  畫與電影版的不同之處，在於片中角色們「熱愛音樂」的感覺，轉而描繪為「為音樂而生

  」的選擇和決心。為鹿島柊擔任配音的人氣聲優今井文也，也分享柊有如「一朵花」的魅

  力之處：「相較同儕來說，他很可愛，或者說有點頑皮和魯莽，但也開始有成年人的樣貌

  。我覺得他介在男孩和成年人之間，而且作為一個樂團，他也是樂團的門面，如此地閃閃

  發光。」一旁的聲優坂泰斗也認可：「沒錯，柊絕對是一朵花！」



  尤其今井文也同時參與了本片的音樂與演唱內容，他也分享參與的感想：「自從我第一次

  聽到Given的音樂，就感受到一種非常獨特的氛圍。雖然當中的歌曲是由同一個人創作，

  但每首歌都有不同的樣貌，當然Given中的每首歌也都有不同的個性，讓我覺得十分迷人

  。這次，syh樂團的新歌將被作詞並作成歌曲，所以我也非常期待歌曲會長成什麼樣子。

  當我嘗試唱這首歌時，便直接意識到『我明白了，這就是syh和Given之間的區別。』」





  值得一提的是，適逢《GIVEN被贈與的未來劇場版：柊mix》即將在台上映，台灣片商也為

  影迷呈現一系列好康。除了放映正片之外，還將會播出一段四分鐘的特別彩蛋短片，每週

  更換一支，持續四週放送四部不同短片！可以讓觀眾欣賞到主線故事中未曾被描繪的另一

  個故事，請觀眾在電影院看完片尾字幕之後，千萬不要錯過！不僅如此，片商也同時公佈

  「第一週戲院特典」，只要購買本片第一週（4/3-4/11）場次的電影票乙張，就可以憑電

  影票在4月3日起至原購票影城，即贈原著作者Natsuki Kizu親自繪製的漫畫小冊子乙份，

  數量有限，送完為止，請務必把握可以永久保留的超豪華特典收藏機會。



  這部集結青春、樂團與BL元素，台灣動漫迷爭相傳頌「這本BL不得了！」的話題之作《

  GIVEN被贈與的未來劇場版：柊mix》，即將在4月3日（三）於台灣珍愛獻映。本片劇情描

  述高中生上山立夏（内田雄馬配音），某日被佐藤真冬（矢野獎吾配音）的歌聲所震撼，

  因此邀他加入自己與好友中山春樹（中澤匡智配音）、梶秋彥（江口拓也配音）的樂團擔

  任主唱。在首次Live表演成功後，他們以「GIVEN」為團名展開活動，立夏也意識到自己

  對真冬產生了感情，兩人進一步展開交往。之後，「GIVEN」持續活躍，並參與音樂比賽

  。雖然最後由真冬的兒時玩伴鹿島柊（今井文也配音）與八木玄純（坂泰斗配音）所屬的

  樂團獲勝，但「GIVEN」仍受到愈來愈多關注。此時，柊與玄純兩人決定以「syh」的名義

  正式出道，並邀請立夏成為樂團的支援吉他手。同時，柊還希望立夏可以協助他完成某件

  事…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
date: 2024-03-28
sentiment_score: 1.0
reply_count: 0
positive_reaction_count: 0
negative_reaction_count: 0
replies: []
