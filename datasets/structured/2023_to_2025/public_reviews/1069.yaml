title: '[新聞] 【GIVEN：柊mix】3D動態細膩捕捉樂團演奏'
content: '新聞網址：



  台灣動漫迷爭相傳頌的「這本BL不得了！」話題之作《GIVEN被贈與的未來劇場版：柊mix

  》，即將在4月3日於台灣珍愛獻映。全片透過牽動人心的音樂、細膩的情感刻畫、豐富的

  故事層次、令人玩味的台詞，尤其這次劇場版將為本系列作品邁入最終章，更是讓全台動

  漫迷引頸期盼。全片有大量的音樂演奏場面，根據導演橋本能理子透露，製作團隊運用3D

  動態捕捉技術，來呈現角色彈奏琴弦，以及打鼓的手部特寫畫面，更找來負責本片所有歌

  曲的人氣樂團Centimillimental，親自扮演動態捕捉的演員，加強全片的專業與真實感，

  以高品質製作，為觀眾帶來安心的觀賞體驗。值得一提的是，片商不僅將在本週五（3/22

  ）中午12點開賣「限量預售票套組」，購買就有機會獲得「角色拍立得小卡乙張」（六款

  隨機出貨），更將在本週六（3/23）舉辦「真愛唯一搶先場」，目前也正在搶票當中，值

  得觀眾把握蒐藏精美周邊與搶看的機會。





  《GIVEN被贈與的未來劇場版：柊mix》是漫畫家Natsuki Kizu最具代表性的漫畫作品，以

  搖滾樂團為故事主軸，結合音樂、校園、愛情與BL元素，打造出讓讀者動容又難以忘懷的

  青春群像。即將為本系列邁入最終章的這部作品，找來《身為女主角！～被討厭的女主角

  與秘密的工作～》導演橋本能理子執導，她也曾擔任過本作電視動畫版第10話的演出與分

  鏡。對於這回有機會執導長篇動畫，橋本導演表示：「我知道原著和動漫系列的粉絲，會

  對這部作品充滿熱情，而看到上映後在社群媒體上的反應，以及親自參與電影宣傳活動後

  ，都讓我再度意識到我真的做到了！」尤其這回以人氣角色「柊」和「玄純」為主角，導

  演也認為柊是個多面向的角色，這讓他變得很有魅力。而對於玄純這角色，導演也透露：

  「當我第一次閱讀原著時，我便想『我明白這個人在說什麼』，我認為玄純是個很容易讓

  人產生共鳴的角色。」



  除了角色魅力是一大看點，多場精彩的歌曲演奏，也是全片不容忽視的賣點。橋本導演談

  到關於表演場面的動作捕捉，表示：「動作捕捉由負責片中歌曲的Centimillimental完成

  ，並親自扮演動作演員。3D 總監和3D部門的每個人，都必須確保角色動作的細微差異，

  並要忠實地去呈現。從電視動畫開始，我們便使用3D製作，而透過這項技術，更能將握住

  和彈奏琴弦的手，以及打鼓的手的特寫畫面精確呈現。」本片也因為高品質的製作，將為

  觀眾帶來安心的觀賞體驗。





  適逢《GIVEN被贈與的未來劇場版：柊mix》即將在台上映，片商也將舉辦一系列相關活動

  。除了將在本週五（3/22）中午12點，於博客來售票網、金石堂網路書店、安利美特網站

  與實體店面開賣「限量預售票套組」，350元便可獲得能夠收藏上聯的電影交換券乙張，

  以及角色拍立得小卡乙張（六款隨機出貨）；本週六（3/23）更將與威秀影城合作，在台

  北、新店、台中、台南、高雄五地的威秀影城，舉辦「真愛唯一搶先場」，單人套票550

  元內含本片電影票乙張、獨家電影明信片組乙份三張、獨家電影原文A3海報乙張，以及中

  爆米花、中杯飲料、吉拿棒，目前正在威秀影城官網與現場熱烈預售當中，值得觀眾把握

  蒐藏精美周邊與搶看的機會。



  這部集結青春、樂團與BL元素，台灣動漫迷爭相傳頌「這本BL不得了！」的話題之作《

  GIVEN被贈與的未來劇場版：柊mix》，即將在4月3日於台灣珍愛獻映。本片劇情描述高中

  生上山立夏（内田雄馬配音），某日被佐藤真冬（矢野獎吾配音）的歌聲所震撼，因此邀

  他加入自己與好友中山春樹（中澤匡智配音）、梶秋彥（江口拓也配音）的樂團擔任主唱

  。在首次Live表演成功後，他們以「GIVEN」為團名展開活動，立夏也意識到自己對真冬

  產生了感情，兩人進一步展開交往。之後，「GIVEN」持續活躍，並參與音樂比賽。雖然

  最後由真冬的兒時玩伴鹿島柊（今井文也配音）與八木玄純（坂泰斗配音）所屬的樂團獲

  勝，但「GIVEN」仍受到愈來愈多關注。此時，柊與玄純兩人決定以「syh」的名義正式出

  道，並邀請立夏成為樂團的支援吉他手。同時，柊還希望立夏可以協助他完成某件事…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
