title: '[選片] 烈火救援vs黑祭司：闇黑修女'
content: '兩部都是韓片

  想帶家人去看其中一部

  —————————


  現在韓國那邊的票房都是喬神佔榜

  黑祭司2韓國台灣都是同步上映

  雖然板上有負雷文

  但想看恐怖片被嚇的話

  是否值得去看呢？


  接著請益烈火救援

  1/29今天在台上映


  韓國那邊去年12月初就已經先行上映了

  而且好像佔榜首很長一段時間

  韓國影迷那邊評價好像不差


  台灣前一陣子有辦特映

  板上找不到心得文

  但應該也是有些板友們先看了

  （期待心得文）


  帶家人去看上述這兩部的話

  哪部會比較好？

  先謝謝大家

  ----

  Sent from  on my iPhone 15


  --'
