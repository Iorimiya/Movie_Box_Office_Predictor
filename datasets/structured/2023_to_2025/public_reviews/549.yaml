title: '[雷] 烈火救援'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  趁Hami Video的7天免費序號，看了幾部電影


  烈火救援整體就是很一般的消防員救火的故事，韓國真實事件改編


  內容跟其它火災電影都差不多


  基本上就是消防員的勇敢、工作的危險、家屬的不安、裝備的落後、火災特效




  故事用消防員常去的一家店的女老闆跟消防員們關係很好，消防員還叫她順子媽媽


  但是她養了一個廢物兒子，常常拿店裡的錢


  然後被其它小混混慫恿要拿建物火災保險的保險理賠，就放火燒了自己家的房子


  順子媽媽被救出後其實也不清楚自己兒子是不是在裡面，還很激動的要求消防員進去救她兒

  子，她兒子還在裡面


  接下來就悲劇了





  然後我就要說說扣分的地方了


  在順子媽媽要求消防隊救她兒子時，現場指揮已經說了這棟建築違建太多，結構很危險，禁

  止再次進入


  但是救援班的班長不顧指揮禁止，堅持要進去救人


  接著其它的救援班隊員就跟著班長進去


  我不知道這樣搞是不是要突顯消防員的熱血、偉大還是不怕犧牲什麼的


  但是我很討厭這種消防員不顧現場指揮的劇情，而且還是班長帶頭，然後帶著一群隊員都不

  鳥指揮的


  結果整隊進去後，建物倒塌，全員活埋，死了6個，其他受傷，我看了真的是不覺得難過，

  只是想：果然，係賀




  而且以前看的消防題材都會強調優先保證自己的安全，救援者變成待援者或罹難者是大忌


  但這部在中間時班長就說過消防隊要有犧牲自己拯救他人的決心…


  好哦，恭喜如願以償




  再說另一個扣分的地方


  電影就在消防員的公祭上就結束了


  然後結尾字幕提到影響了後續消防員待遇啥的


  但是放火燒自己家的廢物下場如何沒拍出了，也沒字幕介紹


  就…沒了？


  真的是有看故事被太監的不爽感





  一般這種災難片我都評價比較好，但以上兩個扣分點我只能給普雷


  --'
