url: https://www.ptt.cc/bbs/movie/M.1709190283.A.D40.html
title: '[情報] 比爾史柯斯嘉《滅世男孩》電影預告'
content: "從頭打到尾！！《》\n\n2023多倫多國際影展首映獲全場激讚\n\n 《》 化身復仇鬼\n\n2023多倫多國際影展「午夜瘋狂」單元正式入選、《蜘蛛人》名導\
  \  擔任製片的\n年度最狂動作片《》於當地時間9日在多倫多國際影展舉辦世界首映，本片由《\n捍衛任務4》《牠》瑞典人氣男星（Bill Skarsgard）領銜主演。\n\
  \n《》在多倫多國際影展首映之後，因為宛如電玩的快節奏加上充滿張力的動作場\n面，而獲得眾多權威影視媒體喜愛，比爾史柯斯嘉不多話、幾乎從頭打到尾的演出也讓人\n\
  印象深刻。\n\n《The Playlist》認為這部片是「一段充滿暴力和濺血歡樂狂歡」\n\n《Film Threat》：「《滅世男孩》就像是一場兩小時的雲霄飛車。」；\n\
  \n《JoBio》：「這部片本身是一部非常狂野的反烏托邦動作史詩，其中包含大量黑色喜劇\n和令人怵目驚心的內容。」\n\n\n《》Boy Kills World\n\
  \n近期在台上映 敬請期待\n\n2023 多倫多國際影展 入選\n\n《蜘蛛人三部曲》名導擔綱製片最狂動作片\n\n《捍衛任務4》《牠》瑞典人氣男星領銜主演\n\
  \n《即刻救援系列》荷蘭知名女星飾演大反派\n\n《忌日快樂系列》新生代恐怖天后潔西卡羅瑟共同演出\n\n《怪奇物語》「莫瑞鮑曼」、《全面突襲》「#瘋狗」驚喜現身\n\
  \n一名男孩（ 飾）天生聾啞，但擁有豐富的想像力，某天，他的家人遭到統\n治這個國度的暴君希爾達（芬姬詹森 飾）殺害，男孩因此逃到叢林內，接受一位神秘薩\n滿的訓練，壓抑自己幼稚的想像力，化身為無堅不摧的殺人機器，只為了替家人復仇……\n\
  \n #車庫娛樂 #捍衛任務4 #比爾史柯斯嘉 #祝你忌日快樂 #潔西卡羅瑟 #紳士\n追殺令 #蜜雪兒道克瑞 #怪奇物語 #布雷特吉爾曼 #全面突襲2 #亞洋魯辛\
  \ #即刻救援 #\n芬姬詹森\n\n資料來源：\n\n--"
