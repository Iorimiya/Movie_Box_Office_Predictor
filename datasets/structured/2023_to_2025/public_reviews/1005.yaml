title: '[好雷] 滅世男孩'
content: '今天去西門LUX影城看XL巨幕廳

  噴血斷肢場面讓人相當滿足

  可惜主角演員實力不足

  動作場景不斷在晃鏡頭打混

  只有最終戰打Shaman算是不錯


  越看Shaman越覺得臉熟

  回去一查果然是全面突襲裡的瘋狗

  這麼能打的演員

  不配個一樣能打的對戰真是可惜


  前面畫面裡有帶到台塑石油的桶子

  我整個人在意到不行

  這種置入性行銷也太狂


  劇情仔細深究會腦死

  B級片就不用想太多

  以主角旁白帶動劇情展開

  鏡頭切換流暢不會冷場


  整體好評

  滿符合我的胃口的


  --'
