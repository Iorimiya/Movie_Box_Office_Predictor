title: '[新聞] 有村架純為【迷宮裡的魔術師】將他設桌布'
content: '新聞網址：



  改編破億暢銷作家東野圭吾同名小說，並再度攜手福山雅治開創新時代黑暗英雄的最強懸

  疑娛樂強片《迷宮裡的魔術師》，即將在10月23日（四）於台灣華麗獻映。本片請來「日

  本奧斯卡影后」有村架純，飾演為了揭開父親死亡真相的女主角，與福山雅治演共組「叔

  姪搭檔」，成為難得一見的最強破案組合。兩人曾在2022年的報知電影獎上，以影帝影后

  身分相遇，初次與演藝圈大前輩福山雅治見面，讓有村架純十分感動，並相約有一天能夠

  合作。當她接到本片戲約、得知有機會能與東野圭吾和福山雅治合作時，她便毫不猶豫決

  定參演。雖然是初次合作，但兩人開拍首日便相互產生信任感，有村架純更時常在片場關

  心福山雅治的飲食與睡眠狀態，讓福山雅治笑稱：「她有點像媽媽的感覺呢！」但他認為

  也正因為有村充滿這種溫柔堅韌與包容力的「母性」，讓自己能夠更自由地嘗試不同表演

  方法。值得一提的是，有村架純在準備角色時，為了培養對於片中父親的情感，別出心裁

  地將飾演她父親的仲村亨照片設定成手機桌布。只是當仲村得知這個消息後，反應卻是又

  驚喜又緊張？！細究原因，原來是他擔心自己的參演消息還未公開，萬一被有心人瞄到手

  機桌布，恐怕會影響到自己的演出！





  福山雅治與有村架純首度合作演出《迷宮裡的魔術師》，化身「最強叔姪搭檔」，共同揭

  開殺人事件背後的層層迷霧。兩人在2022年的報知電影獎上，分別以《破案天才伽利略：

  沉默的遊行》與《前科者》勇奪影帝、影后，並在典禮上相遇。回憶起兩人的初次見面，

  有村架純坦言：「非常感動！」並表示：「福山雅治先生在電視、廣告、電影方面，早就

  是已經活躍著的大大大前輩，那時我甚至還沒開始這份工作，而且我的媽媽也是福山先生

  的粉絲！」也讓她期盼有一天能夠一起合作。就當她接到本片戲約，得知有機會能與東野

  圭吾和福山雅治合作時，便毫不猶豫決定參演，並表示：「東野圭吾老師和福山雅治先生

  的搭檔關係，已經持續了大約十年，我深刻感受到他們之間的深厚羈絆。當然我也會感到

  緊張，但想到能有機會投入他們之中，這種機會並不常有，所以我便毫不猶豫地決定參演

  ！」



  雖然本片是福山雅治與有村架純的首度合作，但兩人在開拍首日，便快速相互產生信任感

  ，有村架純還時常在片場關心福山雅治的飲食與睡眠狀態，讓福山笑稱：「她有點像媽媽

  的感覺呢！時常會關心我『有睡飽嗎？有沒有吃點營養的東西呢？』有村這樣的個性，不

  僅能接住角色，也能接住整部作品。她有一種投入角色、甚至願意拋下一切去演繹的氣魄

  ，同時又具備溫柔的母性，以及強大的精神力與韌性。」他也接著補充：「她的包容力也

  讓我能以更自由的方式去嘗試不同的表演方法。」





  值得一提的是，在準備《迷宮裡的魔術師》角色的過程中，有村架純為了培養對片中父親

  的情感，特別將飾演她父親的演員仲村亨的照片設成手機桌布，希望能將他的形象內化成

  自然記憶，她對此分享：「因為每天都會看手機，而眼前有仲村亨先生的臉，自然就能把

  爸爸的形象烙印在心中，真的是很感謝他的幫助。」然而，當她把這段「敬業小秘密」告

  訴仲村亨時，對方的反應卻非感動，而是驚喜中帶著一點緊張，仲村回憶：「她把桌布給

  我看時，我可能是一副藏不住開心的傻笑。不過當時我的參演消息還沒公開，因此很擔心

  如果在其他地方被看到，大家的想像力會暴走、消息外流，最後害我什麼都失去。」雖然

  只是幕後趣聞，卻也從中窺見有村對角色的用心投入，以及兩人之間自然又真誠的合作火

  花。



  這部由《信用詐欺師JP》系列導演田中亮執導，透過華麗魔術結合縝密懸疑推理、全員皆

  可疑的史上最強娛樂懸疑鉅獻《迷宮裡的魔術師》，即將在10月23日（四）於台灣華麗獻

  映。本片劇情描述一處在疫情蔓延後，失去昔日熱鬧活力的小鎮，深受學生愛戴的前國中

  教師神尾英一（仲村亨飾演）慘遭不明人士殺害。原本還有兩個月就要步入結婚禮堂的真

  世（有村架純飾演），在收到父親喪命的噩耗後，不得不立刻重返小鎮，試圖找出父親的

  死亡真相。沒想到，她卻在老家意外迎來許久不見的叔叔武史（福山雅治飾演）。曾在拉

  斯維加斯叱吒風雲的武史，曾是一位魔術師，不僅擁有精湛的魔術技藝，更擁有媲美偵探

  般的觀察力與巧妙的審問技巧，讓他與真世一同踏上破解命案的旅途，運用華麗手法，解

  開一層又一層的謎團…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁

  及Threads專頁查詢。



  --'
