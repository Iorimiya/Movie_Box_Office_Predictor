title: '[新聞] <迷宮裡的魔術師>福山雅治告白台灣秀魔術'
content: '新聞網址：



  由「日本天王」福山雅治與「日本影后」有村架純攜手主演的最強懸疑娛樂電影《迷宮裡

  的魔術師》，即將在本週四（10/23）於台灣隆重獻映。本片改編自日本破億暢銷作家東

  野圭吾的同名小說，曾與福山雅治多次合作的東野圭吾，透露因為聽聞他想挑戰不同於以

  往的「黑暗英雄」，成為他動筆寫下本作的契機。而在故事中絕對不走正道、為了解謎不

  擇手段的主角「神尾武史」，也是東野圭吾自認至今寫過「最帥氣」的角色。看完電影後

  ，他不僅滿意大讚：「比原作更華麗精緻！」更立刻傳訊息給福山雅治直喊：「太帥了！

  」福山雅治除了在片中展現新時代黑暗英雄的帥氣形象，也親自為本片創作引發高昂情緒

  的主題曲〈幻界〉，並自曝在曲中埋入許多名曲片段以示致敬。值得一提的是，福山雅治

  聽聞台灣即將上映本片，特別在百忙之中錄製影片向台灣觀眾問好（

  ），除了細數過去在台灣的珍貴點滴，更感動直呼：「我

  愛台灣！」甚至還角色上身大秀魔術把戲，期盼台灣觀眾都能進場享受更多精彩演出。而

  本片在日本上映之後，也獲得大量好評盛讚，更一舉登上日本新片票房冠軍寶座。





  最新懸疑娛樂強片《迷宮裡的魔術師》，改編自破億暢銷作家東野圭吾的同名小說。曾以

  《破案天才伽利略》系列，多次與福山雅治合作的東野圭吾，在某次跟他的對談當中，聽

  聞福山雅治想挑戰不同於以往的黑暗角色，並希望東野圭吾能創造出全新的「黑暗英雄」

  ，進而成為他動筆寫下本作的契機。作品中，主角「神尾武史」是個絕對不走正道、為了

  解謎不擇手段的魔術師，而東野圭吾自認這是自己至今寫過「最帥氣」的角色：「我在寫

  這個角色時，始終認為他是個極其帥氣的人。雖然至今創作過無數角色，但他在我心目中

  是最帥氣的存在；所謂帥氣不僅是華麗耀眼，而是無論什麼樣子都散發魅力，這點非常重

  要。」



  東野圭吾在觀賞本片過後，也滿意大讚：「比原作更加華麗精緻！身為原著作者的我非常

  開心，因為我自己看電影時，經常會沒耐心地看手錶，但這次卻完全沒有這種感覺，感覺

  時間一下子就過了，而且不是漫不經心地看完，而是全程興奮又享受。我可以自信地說：

  『這真是一部非常好看的電影！』」東野圭吾甚至還在觀影後，立刻傳訊息給福山雅治，

  直喊：「很好看，很精彩，福山先生你太帥了！」





  在「日本天王」福山雅治主演的《迷宮裡的魔術師》當中，福山雅治不僅傳遞新時代黑暗

  英雄魅力，甚至親自上演華麗魔術場面，更展現音樂才華，親自為本片創作主題曲〈幻界

  〉，他對此分享：「我在創作時，想像武史過去在拉斯維加斯舞台上表演時的登場感。他

  離開日本，站在異國舞台上喊出『It’s Show Time（好戲登場）』的那份高昂情緒。作

  為武史登場的前奏，應該是怎樣的聲音？是怎樣的歌曲？我在拍攝期間一直在思考這件事

  。」曲中高昂的情緒，配合絢麗的吉他技巧，也獲得眾人盛讚，本片導演田中亮表示：「

  從拿到Demo時，就被他帥氣又俐落的吉他給深深震撼，聽到完整版時，更被他傾注的愛與

  深厚情感打動，根本就是頂級的表演者！」福山雅治更自曝〈幻界〉是首向經典名曲致敬

  的作品，他分享：「製作這首歌時，裡面埋進許多名曲的片段，將它們分解後重新拼裝。

  某種程度上，也像是一種魔術的展現吧！那些在曲中散落的世界名曲片段，如果不特別說

  出來，聽眾可能察覺不太到，但其實都被我悄悄地埋在裡面了。」



  值得一提的是，福山雅治在聽聞本片即將在台上映，也特別錄製影片向台灣觀眾打招呼，

  甚至情不自禁地說了三分多鐘！他先是一一細數過去來台灣開唱與拍攝廣告的珍貴回憶：

  「在演唱時獲得如此熱烈的回應，讓我非常開心，我至今仍鮮明地記得當時的畫面。」甚

  至還用英文感動呼喊：「我愛台灣！」更在最後親自秀上一段魔術把戲，期待台灣觀眾能

  進場觀賞本片，享受更多精采表演。而本片在日本上映後，也獲得眾多觀眾的好評盛讚，

  紛紛讚揚：「所有角色都刻劃得淋漓盡致！」「解謎設計精良，營造出扎實的電影高潮！

  」「已經三刷了，非常輕鬆又有趣！」這也讓本片一舉登上日本新片票房冠軍寶座，是台

  灣觀眾務必要進戲院，透過大銀幕體驗的史詩級懸疑娛樂饗宴！



  這部由《信用詐欺師JP》系列導演田中亮執導，魔術結合縝密懸疑推理、全員皆可疑的史

  上最強娛樂懸疑鉅獻《迷宮裡的魔術師》，即將在本週四（10/23）於台灣隆重獻映。本

  片劇情描述一處在疫情蔓延後，失去昔日熱鬧活力的小鎮，深受學生愛戴的前國中教師神

  尾英一（仲村亨飾演）慘遭不明人士殺害。原本還有兩個月就要步入結婚禮堂的真世（有

  村架純飾演），在收到父親喪命的噩耗後，不得不立刻重返小鎮，試圖找出父親的死亡真

  相。沒想到，她卻在老家意外迎來許久不見的叔叔武史（福山雅治飾演）。曾在拉斯維加

  斯叱吒風雲的武史，曾是一位魔術師，不僅擁有精湛的魔術技藝，更擁有媲美偵探般的觀

  察力與巧妙的審問技巧，讓他與真世一同踏上破解命案的旅途，運用華麗手法，解開一層

  又一層的謎團…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁

  及Threads專頁查詢。



