url: https://www.ptt.cc/bbs/movie/M.1761490657.A.A62.html
title: '[雷] 迷宮裡的魔術師 看點是女主的奶'
content: '原本是看到預告片的福山雅治跟東野圭吾組合看的


  這個組合拍的《神探伽利略》、《嫌疑犯X獻身》都很好看



  東野圭吾原作改編的電影看的不多


  除了嫌疑犯外就看過《假面飯店》、《解憂雜貨店》


  解憂雜貨店不是推理但是很精彩，嫌疑犯更是敘述性詭計的經典之作，至於假面飯店就很爛

  了


  所以東野圭吾的電影對我來說是兩好一壞


  等看完本片後好壞變2:2平手了



  推理真的鳥鳥的，硬要說的話比假面強一點，主要是女主的關係


  女主本來就長的很正，不知道是劇組刻意挑顯身材的衣服，還是女主身材太好遮不住


  整部電影看下來女主的胸部好大！



  其實福山雅治很帥也是一大看點啦，配上很裝逼的BGM（就是預告片的那首），真是帥到不

  行






  然後優點就這些，沒了



  如果想看的人要做好預期管理，不要衝著劇情或推理看，為了演員去看吧

















  --'
