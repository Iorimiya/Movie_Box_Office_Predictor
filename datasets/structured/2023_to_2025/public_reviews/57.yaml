url: https://www.ptt.cc/bbs/movie/M.1760014412.A.C09.html
title: '[新聞] 福山雅治【迷宮裡的魔術師】親秀華麗魔術'
content: '新聞網址：



  改編破億暢銷作家東野圭吾同名小說的最強懸疑娛樂鉅獻《迷宮裡的魔術師》，即將在10

  月23日（週四）於台灣華麗獻映。本片由「日本天王」福山雅治詮釋頂尖魔術師，透過絢

  麗手法破解殺人謎團，將以顛覆想像的魔術大場面揭開序幕，讓觀眾從一開演便能迅速體

  會主角「武史」的高超技藝。為了達到開場即震撼的效果，劇組請來影像藝術家西郡勲與

  動作導演川澄朋章打造，更在當中加入向《13人刺客：殊死血戰》、《醉拳》、《盲劍俠

  》等電影名作致敬的元素，是劇組公認最困難的一場戲。片中不論魔術大秀或是手邊小把

  戲，都是由福山雅治在耗時超過四個月的練習後親自上陣。為了自然散發魔術師氛圍，他

  不僅天天勤練到一度手指拉傷，更堅持「一鏡到底」表演，甚至主動提出加深魔術難度，

  讓擔任魔術指導的魔術師KiLa也大讚：「超越魔術師了！」值得一提的是，片中一場他在

  生瀨勝久面前使用火焰表演的魔術，卻因為環境因素遲遲無法成功，前後重拍快20次才完

  成，也讓福山雅治懊惱感嘆：「這是我職業生涯NG最多次的戲了！」。





  透過《破案天才伽利略》共組「黃金組合」的東野圭吾與福山雅治，這回再度攜手新作《

  迷宮裡的魔術師》。由於這回福山雅治挑戰詮釋曾在拉斯維加斯活躍的頂尖魔術師，因此

  電影一開始便以顛覆想像的超華麗魔術大場面揭開序幕；為了呈現開場即震撼的效果，劇

  組請來曾參與東京帕運的影像藝術家西郡勲，以及知名動作導演川澄朋章打造，導演田中

  亮分享：「這場戲我們討論特別多，因為必須讓觀眾從開場就明白，他是個多麼了不起的

  魔術師，並展現他身為日本人的美學與特質。」因此，劇組與福山雅治決定在這場戲中，

  向日本電影與知名動作片致敬，福山雅治表示：「我們想在其中點綴一些日本電影元素和

  知名動作片的場面，例如一開始握著刀的動作，是向《13人刺客：殊死血戰》中役所廣司

  的演出致敬，還有一點向成龍的《醉拳》致敬，以及《盲劍俠》的身段等等。」高能量的

  開場表演，也是劇組公認最困難的一場戲。





  在《迷宮裡的魔術師》中，不論是魔術大秀或是手邊小把戲，都是由福山雅治在耗時超過

  四個月的練習後親自上陣，他表示：「能練能做的部分，我想毫不保留地展現！一定要表

  現出真的是本人在做這一點！」只不過練習過程並不容易，回憶初次與魔術指導KiLa見面

  時，他分享：「KiLa對我說『學硬幣滾動就像學騎自行車，如果小時候學過，長大之後也

  能做到，但福山先生這年紀才開始，不太可能了。』我當時心想這可麻煩了，但也激起我

  的鬥志、努力去做，結果竟然被激起來了！」為了自然散發魔術師的氛圍，他不僅天天練

  習，更勤練到一度手指拉傷，並堅持不靠剪輯「一鏡到底」表演魔術，甚至主動提出加深

  魔術難度，讓KiLa看了都大讚：「他已經超越魔術師了啊！」



  值得一提的是，片中有場他與生瀨勝久的對手戲，必須使用火焰表演魔術，但由於處在有

  風的戶外，導致他遲遲無法成功，前後重拍近20次，他回憶：「當時生瀨先生需要大喊台

  詞，表演得非常棒，但因為我試了很多次都沒成功，我覺得讓他反覆拍好幾次很不好意思

  。」並懊惱感嘆：「這是我職業生涯NG最多次的戲了！」



  這部由《信用詐欺師JP》系列導演田中亮執導，華麗魔術結合縝密懸疑推理、全員皆可疑

  的史上最強娛樂懸疑鉅獻《迷宮裡的魔術師》，即將在10月23日（週四）於台灣華麗獻映

  。本片劇情描述一處在疫情蔓延後，失去昔日熱鬧活力的小鎮，深受學生愛戴的前國中教

  師神尾英一（仲村亨飾演）慘遭不明人士殺害。原本還有兩個月就要步入結婚禮堂的真世

  （有村架純飾演），在收到父親喪命的噩耗後，不得不立刻重返小鎮，試圖找出父親的死

  亡真相。沒想到，她卻在老家意外迎來許久不見的叔叔武史（福山雅治飾演）。曾在拉斯

  維加斯叱吒風雲的武史，曾是一位魔術師，不僅擁有精湛的魔術技藝，更擁有媲美偵探般

  的觀察力與巧妙的審問技巧，讓他與真世一同踏上破解命案的旅途，運用華麗手法，解開

  一層又一層的謎團…。



  欲知本片最新消息，

