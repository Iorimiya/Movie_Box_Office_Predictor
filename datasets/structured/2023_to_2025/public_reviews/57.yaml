title: '[負雷] 迷宮裡的魔術師 某飛自制電影好看多了'
content: '為了消耗百貨公司抵用券，偶然經過一樓的電影售票口，

  我的問題，只看到東野圭吾和福山雅治就先入為主的以為是伽利略系列，

  即使被告知無法使用抵用券，還是在電影開演前三十分鐘刷了信用卡。


  東野圭吾的書我也讀過基本，大多是隨機挑選，

  即使有些劇情不是那麼喜愛，但在我心中也都是好評的。


  這是我第一次入場的劇院，不知平常的來客量，

  只覺得排片及入場人數都異常的稀少。


  是啊！以原作者及卡司的知名度來看，早就暴露了許多信息，大意了～



  就一個稱不上影迷、書迷的普通觀眾而言，

  我認為這是一部幾乎沒有一方粉絲會滿意的作品，

  除非有人只期待福山雅治變魔術。（笑



  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  本片受害人為中學教師，故而劇情圍繞在女兒有純架純及其過往學生身上，

  但吸睛場面幾乎都與飾演魔術師的福山雅治有關，

  偏偏福山雅治於本片被刻畫的非常單薄，

  身為被害人的弟弟卻幾乎沒有兄弟間的回憶，

  最多是為了讓主角加入嫌疑人行列而刻意牽扯犯罪動機。


  電影只有兩小時，廣義的嫌疑犯卻將近有十來個，

  還因為被害人是國中老師，一個角色需要找兩個演員，

  許多角色看似嫌疑重大卻在三五句台詞後莫名被排除，

  在觀眾還困惑其邏輯當下，就直接跳入下一幕場景，

  這天下一大五郎看了怕是要讓福山雅治一秒把自己變離這個小鎮。


  日式推理向來喜歡說教，本片也不意外，

  或者說他根本就是一部包著推理皮的群像校園說教片。


  原著是什麼樣子的我不清楚，只在電影結束後隨意看了幾篇書迷的心得，

  說是反映疫情的現況（原著出版時間為2020年），

  但就整體看下來，讀者們似乎對推理部分依然不甚滿意。


  做個總結，

  我認為這本書或者電影的改版方式比較適合電視劇，

  一集說一位學生的故事，裡頭穿插一些小鎮觀光的困境，

  最後在用電影的伎倆收尾。


  這部電影我是昨天看的，睡了一覺情緒穩定不少，

  昨日我在等車回家的途中接到了家母的電話，

  家母成了我這趟路程的情緒垃圾桶，我沿途向她抱怨這部電影有多麼的難看，

  順便得罪某串流平台自製片。


  認真說，我經常在某飛上看爛片，但大概要看十部爛的才能看到一部這麼爛的。


  我有誇張化嗎？


  也許有，因為串流我一個月花不到四百元就能無限看到飽，

  苗頭不對可以隨時ESC，

  這部我原價購票加購飲料炸物，花了四百五將自己困在電影院兩小時，

  為了不浪費錢，只能浪費自己的時間來確認自己真的看了一部爛片，以上。

  -----

  Sent from JPTT on my iPhone


  --'
