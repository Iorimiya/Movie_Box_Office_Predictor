url: https://www.ptt.cc/bbs/movie/M.1701451494.A.CE0.html
title: ' [好雷］全羅道少年殺人事件'
content: "先講一下為何會看這部順便防雷\n上星期日剛好看到臉書跳推薦\n \n還特地截圖以便記住上映時間\n這張圖直接吸引到我的目光\n加上註明熔爐團隊打造，不看不行\n\
  \ \n甚至我完全沒有查任何演員和預告片\n因為其實韓國演員我也不知道名字只認得臉\n劇中有看到金師傅的護理師、信號的主角、驅魔麵館的演員、惡鬼的小女孩，還有我唯一\n\
  叫\n的出名字的徐仁國\n\n另外要買票時還遇到一點困難\n今天不是剛上映嗎？\n結果影廳超少時段也超少\n就連觀眾也超少不超過十人\n雖然廳少看的人也少但我還是很推各位去看\n\
  \ \n好的進入正題\n內容大致上分兩條線\n黃班長過去線為了幫忙翻案遇到重重阻礙\n而這些阻礙卻是韓國司法跟警察的腐敗和造假\n代替真兇服刑的三位小朋友也在權力跟毆打下被迫屈服只能默默承受莫須有的罪名\n\
  \ \n現代的時間線\n黃班長畢竟跟整個司法對抗日子並不好過\n得罪了當時火速結案的菁英同僚和檢座之後\n他被調去偏遠小島，整整十六年沒有升職\n而過去施予暴力及造假的警察檢座則當上高官\n\
  冤獄的三位小朋友也出獄長大\n但是旁人眼光總是把它們當成人渣、廢物\n偶遇黃班長後，希望可以幫他們洗脫罪名\n過程當然也是遭受許多脅迫利誘\n甚至對手連黃班長的女兒也不放過\n\
  難能可貴的是主角並沒有因為這些事情退縮\n老婆跟同是警察的女兒都支持黃班長做對的事\n最後在法院審判時，真相水落石出\n雖然晚了十七年，但是判決下來那一刻\n\
  三個大男孩大聲喊「我們不是殺人犯」\n讓我這個35歲中年大叔泛淚了QQ\n我女友原本還說這部都沒人要看怎麼可能好看\n結果她哭的更誇張XD\n真心推薦各位去看看喔！\n\
  \n--"
