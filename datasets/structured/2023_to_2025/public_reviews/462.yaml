title: '[新聞] 徐詣帆攜手馬志翔扮《獵人兄弟》'
content: "徐詣帆攜手馬志翔扮《獵人兄弟》\n\n04:10 2025/02/14 中國時報 李承陽\n\n\n徐詣帆（左）與馬志翔在片中飾演兄弟，兩人各自堅持不同信念產生矛盾衝突。\n\
  （牽猴子提供）\n\n獲選去年高雄電影節閉幕片並入選夏威夷國際影展的電影《獵人兄弟》，定檔3月21日上\n映，卡司集徐詣帆、馬志翔、林慶台，是繼電影《賽德克．巴萊》後，暌違14年再聚首大\n\
  銀幕，詮釋當代原住民家庭在現代與傳統間的矛盾與情感。\n\n電影導演蘇弘恩擁有一半太魯閣族、一半閩南血統，分享家庭對自身的影響很深，也成了\n創作《獵人兄弟》的動機，演繹了現代價值與傳統信仰的交鋒與矛盾，並將個人經歷延伸\n\
  至家族、族人，乃至部落的衝突，以大環境的變遷反映到個人的掙扎。\n\n《獵人兄弟》全片台詞幾乎都以太魯閣語發音，並在蘇弘恩的家鄉花蓮拍攝，貼近故事的\n真實氛圍，最新發布的電影預告中，飾演爸爸的林慶台1句：「我繼承了這麼好的獵場，\n\
  結果兒子這麼大了，連打獵都不會！」成了和片中大兒子徐詣帆爭執的開端；此外扮演弟\n弟的馬志翔手持獵槍佇立山林，彷彿暗示著一場無法挽回的命運，也讓人揣測兄弟關係的\n\
  最終走向。\n\n#現代 #馬志翔 #獵人 #林慶台 #矛盾\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\
  \n\n\n--"
