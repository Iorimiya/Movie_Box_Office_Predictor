url: https://www.ptt.cc/bbs/movie/M.1757398530.A.176.html
title: '[好雷] 獵人兄弟'
content: '看完後覺得裡面媽媽演得最好

  過幾個禮拜再看一次賽德克巴萊

  發現原來這個媽媽也有演

  還在第二集唱了很久的歌


  一查媽媽叫巫惠玲

  還是花蓮玉里東森房屋的房仲

  感覺原住民好像都天生會表演

  唱歌演戲都很渾然天成


  演哈勇家的最佳男配角洪金輝

  他這片也有演，一樣臉很有觀眾緣

  像海角的民雄也演得好

  賽德克所有素人都演的超棒

  但有繼續演的大概一隻手算得出來

  像林慶台也是素人被抓去演男主角


  這齣戲就像現代版的賽德克巴萊

  鐵木瓦力斯還演花岡一郎的弟弟

  看完覺得大哥被漢化的太嚴重了

  竟然還賤賣祖產大逆不道

  難怪他媽媽會瘋掉


  但整個部落都想賣山坡地

  看來祖靈真的會不高興

  不知道會不會拿去蓋廟

  就算捐給教會蓋教堂也好


  最近看到蠻多這種原住民

  學歷都蠻高的，出類拔萃

  真的就像賽德克裡的模範番


  跟大多數的原住民砂石車司機不同

  像賽德克裡面滿多演員是做工的人

  都是天生驍勇善戰的原住民勇士

  可能在玉山當健步如飛的背工

  或是在特種部隊當教官


  都是天生的獵人跟戰神



  --'
date: 2025-09-09
