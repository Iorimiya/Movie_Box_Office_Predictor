url: https://www.ptt.cc/bbs/movie/M.1743074638.A.A66.html
title: '[普雷]《獵人兄弟》獵場狩獵是遺產還是傷口？'
content: '部落傳承與生活，上世代原民的選擇矛盾


  對於部落與原住民文化，是台灣許多人知道但卻不熟悉的一塊領域。尤其在台灣多元種族

  的狀況下，有著不同族群部落的不同習俗，要來了解是困難且需要時間去專研的。


  但不管是在日治或民國時代，台灣原住民的生活發生許多重大的改變，有一部分是關於，

  原住民的部落傳統習俗，與當代價值之間相觸的矛盾性，尤其是土地與經濟能力的變化。

  當時代改變，抵觸台灣原民的傳統價值，並尋求不一樣的價值認可感後，是否可以找到出

  口。


  電影《獵人兄弟》是敘述出生於太魯閣族兩個兄弟截然不同的人生故事。兄弟因一次上山

  與父親狩獵時發生意外，而出現分歧點。哥哥林祥成為醫生，弟弟林正則因入獄服刑。在

  弟弟出獄後，每天跑山上老家、並說著獵場的事，弟弟的舉動讓林祥不斷回憶起過去的父

  親，適應現代生活的他也對於弟弟部落價值歧異，產生越來越大的矛盾。






  《獵人兄弟》是什麼電影？


  台灣原住民各族的文化，是台灣這片土地具有與他國不同的代表性文化之一。尤其經過歷

  史脈絡結合南島民族、歐洲宗教、日本殖民與國民政府等，讓台灣原民文化成為一個他人

  無法複製與用一個族群概括的多元性的種族和各部落社會的價值觀。根據台灣原住民族委

  員會資料，台灣原住民目前有高山族9族，與平埔族7族，全台灣大概有700多個原民部落

  ，其中高山族與平埔族過去會被搞混，歷史資料難以界定，故現代台灣政府才有比較明確

  的定義。


  這樣的錯誤其實是歷史政治的一環，對比過去明、清無法管轄全台，在過去日治時期為了

  殖民台灣，對全台做了一次勘查，以「生蕃／熟蕃」做出分類，故才有如今高山族、平埔

  族界定台灣原住民分類。


  高山和平埔並不是絕對以原民生活的地理位置做出判別，這之中也已原住民族群的漢化或

  日化程度作為依據，故平埔族一般是認定漢化日化較完整的族群，但這也導致族群文化的

  消逝，有些依附其他族群的原民到近幾年才逐漸又找回自我民族的文化與正名，例如：太

  魯閣族、賽德克族就是從泰雅族所分支正名的原民族。







  過去電影《賽德克．巴萊》讓人了解過去日治時代的原民歷史與賽德克族的風俗，而太魯

  閣族的電影《獵人兄弟》也是以原住民的生活為主題，但聚焦於當代原住民在現代社會與

  原民傳統文化上的矛盾。故事以一對原住民兄弟林祥與林正，父親是太魯閣族的獵人，哥

  哥林祥對於打獵不擅長，常遭父親責罵，相反弟弟林正卻很能適應獵人傳統。但在一場上

  山打獵意外後多年，林祥成了醫生、林正則剛出獄，兩兄弟生活再次有了交集，但對於林

  正那有如父親翻版的想法與做法，卻與林祥產生摩擦。


  提到太魯閣族相關的電影多半都是以紀錄片或短片的形式去呈現，例如：最新乙太盧閣族

  過去抗日紀錄影片為主的《抵禦之山》或是描繪太魯閣族獵人耆老所見的變遷紀錄片《靈

  山》，較少有劇情片的故事去呈現太魯閣族故事。


  《獵人兄弟》算是近年又有得講述太魯閣族獵人在當代台灣社會下的處境，與在傳統與社

  會變遷結構下，難以抗衡的時代洪流，與在當代社會，生為新一代部落原住民，原民價值

  不等同於普世認同價值的錯亂與迷茫感。










  《獵人兄弟》分析與延伸：


  台灣原住民電影主軸向來有「歷史、土地、自我認同」這些大方向，許多時候原住民的歷

  史與台灣這片土地的牽連性，可以更好的敘述台灣故事，並且由於比不管本省人或外省人

  這些族群在台灣的時間都來得久，故經歷一代代的變化也相對與一些當年的漢人或其他遷

  徙來台的人要更豐富，但如果美國歷史的印地安人和外來美洲白人一樣，台灣原住民的處

  境一直也都伴隨著殖民與統治階級的不斷交替，而形成原民文化受到外來文化的入侵，而

  逐間消逝根被遺忘。


  關於《獵人兄弟》電影中的太魯閣族從一開始，就與統治殖民有著關係，例如2004年受官

  方認可的正名運動前，太魯閣族一直都還是被定義為泰雅族的分支，這有些於日治時代不

  明確對高砂族群錯誤歸類的沿用。


  因為日治時代，日本對於東部台東、花蓮等地原名的教化，故也與原民的傳統生活發生劇

  變，其中一項是關於如太魯閣族獵場的奪取。太魯閣族與獵場的關係，相當於原住民祖靈

  與土地共居的象徵性，是一個家族延續與核心，但如今時代的山林開發，和原民偏鄉經濟

  上的困境，獵場的消逝變得嚴重。







  《獵人兄弟》中展現許多關於太魯閣族群的狩獵文化，不管是父親帶孩子了解我們的獵場

  、打獵前的習慣與巫師問事、還有關於打獵相關。太魯閣族使用火槍狩獵，應該來於日治

  時代，太魯閣青年開始從弓箭製作轉換為火槍的保養與使用。可以說也是狩獵型態傳統與

  科技的轉變，但當時原住民與日本人的衝突有許多也是因為原民傳統與日本所帶來文化有

  關，這種對比到現代社會一樣是原住民族群內在的矛盾與衝突之一，要順應時代變遷或祖

  靈傳統？新一代的原住民似乎成了裡外不是人的局面。


  導演表示《獵人兄弟》故事的緣起是家群聚會上，長輩因為土地的關係起爭執，在田調中

  發現花蓮大型開方都更案，往往都會有人的土地必須犧牲，卻也有人從中受益。在原住民

  年輕人身上，似乎都背有一道不能忘本、需要傳承祖靈的責任，而這責任當遇到不可擋之

  力時，原住民無法達到自我或家族的期望，便會陷入自責的深淵。


  同時他們在現代社會中可能有著良好的工作、教育水準，但在自己族群文化上，背負比一

  般人要更多幾乎不是他們可以負擔的責任，即便一個族群文化的消逝洪流使許多時代淺移

  默化的結果，但這時代的年輕人的認知與責任，讓他們無法逃避自己無法傳承部落習俗與

  文化的擔子。








  《獵人兄弟》值得一看嗎？


  整題來說我覺得這部電影的節奏相對最近一些原民電影戲謔、諷刺與黑色幽默，還是直接

  切入主題來說，《獵人兄弟》顯得相對壓抑，與讓人不舒服的氣氛。林祥與林正兩個兄弟

  ，過去同時受到太魯閣族父親原民教育的傳承，但又得順應社會上風氣的轉變，有適應良

  好也有不適應之處，但因此在會讀書，在一般人眼中有出息的林祥心理，對於太魯閣族的

  傳統文化的排斥，可能來於自己被父親長期的失望，或是對弟弟適應良好的忌妒心裡，而

  導致一連串無法正視自己與接納自己的折磨。


  也可以說就因為林祥是聰明的，故他對於自己的原住民身份和自我認同，無法輕易妥協，

  雖然電影中，他對於林正許多事情有所抵觸，但整體而言從一些電影的細節，他懂弟弟為

  什麼會這麼做、也懂自己不去做的原因，雖然只是一種猜測，但有無可能林祥最根本的原

  因是一邊不想親易放過自己、一邊又想結束這些事情。


  這也讓林祥心裡處境呈現於原住民身份在現代生活的矛盾，故我認為在成長階段中，林祥

  用讀書相對想讓父親認可自己，而不是在打原民傳統文化打獵上顯得無用之餘，一點所求

  父親以自己為榮的驕傲感。







  這讓我想到關於無法適應傳統原住民文化的新一代都市原民或年輕原住民，傳統的原住民

  文化可能離他們遙遠，例如打獵、織布，文字語言，當老一輩想傳承給他們時，他們無法

  做足或做好，對於長輩失落或生氣的語言，是否給予這些活在現代的年輕原民感覺壓力。


  但同時因為台灣文化教育水準相對高，這些原住民知道自己的族裔，與離不開這樣的習俗

  ，那這種傳統美好的文化，瞬間成為一些人的枷鎖與原罪，轉而有自己為何不能像個被認

  可原住民的自我厭惡中。


  不管是《獵人兄弟》中，無法適應太魯閣族傳統打獵與父親期望的哥哥林祥，或是遵循太

  魯閣爸爸教誨，固執起見的弟弟林正，他們身上其實都有著對於原住民在當代社會下的恐

  懼與不安全感，林祥對於無法達到父親期望的不安，與弟弟林正害怕失去獵場沒有容身之

  處的不安，整體來說這是從過去到現代一層層疊加而成在現代原住民年輕人上的重擔。而

  成為這時代原住民自身的「我們與部落的距離」，變得曖昧且複雜。




  --

  個人Blog：

  小說連載頁：


  --'
