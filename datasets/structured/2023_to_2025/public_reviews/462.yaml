url: https://www.ptt.cc/bbs/movie/M.1742624534.A.C50.html
title: '[ 好雷］大推獵人兄弟'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  我必須很誠實的說，

  我在看之前其實沒想到會這麼感動。


  我原本以為會是老套的原民家庭片，

  就是很簡單的講講兄弟爭家產之類的故事。

  但裡面給的元素比想像中複雜的多。


  它其實還帶有一點懸疑跟心理的呈現在裡面，

  從片頭父親的死，一路跟著發瘋的母親、土地的買賣、兄弟的爭執一路發展，到最後我們

  會窺見事件真相。


  而這也是讓人頭皮發麻，存在你我之間，錐心刺骨的痛。


  裡面的演員也讓人很驚艷，這是部專業演員跟素人共同演出的片，裡面的氛圍卻很協調，

  一點都沒有現在國片背台詞的尷尬感，尤其兄弟的對手戲更是精彩可期。


  誰說國片都拍不好，這邊就有一部新導演的片讓人驚艷，進戲院看，真的不會後悔。


  --'
