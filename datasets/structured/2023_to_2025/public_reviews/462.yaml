url: https://www.ptt.cc/bbs/movie/M.1743006838.A.B7E.html
title: '[無雷]獵人兄弟 - 不該用手持攝影的三個理由'
content: '1. 劇情不需要


  手持攝影可以提供懸疑感、緊張感和臨場感，但本片描述的是一個家庭裡

  親子手足之間的關係，不像警匪片或災難片需要分分秒秒都維持住張力。

  此外劇情有過半都在呈現徐詣帆和馬志翔等主要角色的生活日常，像是吃

  飯、騎開車、準備牲禮等等。在此前提之下，手持攝影更應該局限於那些

  角色間已開始衝突或正在醞釀潛在衝突的場景；畫面無窮無盡的上下晃動

  ，除了造成視覺疲憊，也容易擾亂電影的節奏感，觀眾會不知道何時該休

  息，而何時又該繃起精神緊盯螢幕上的細節。


  2. 畫面不需要


  本片的一些場景真實到令人印象深刻，比如餐廳、獵寮、教會、主角的家

  ，大大小小的日常什物俯拾皆是。或許正因為沒有經過整理修飾，雖然營

  造充分的生活感，但畫面難免顯得雜亂，這時候要是再配上左搖右晃的視

  覺效果，真會讓人不知該把重點擺在哪。花蓮美麗的山林更是如此，任何

  一片樹林都能呈現一百種以上的綠，這麼繽紛飽滿的場景還用手持攝影實

  在太過焚琴煮鶴，應該多來幾個定焦長鏡頭才是。


  3. 演員不需要


  個人認為真正優秀的演員，是毋須台詞也能精準演繹角色的想法和情緒，

  。以此標準來評斷徐詣帆和馬志翔的話，說這兩位是第一流的演員一點也

  不誇張。觀眾從兩人的肢體語言就能看出倆兄弟的性情迥異，馬志翔在鮮

  少涉足的教會上舉止侷促，徐詣帆在原始野蠻的獵場中同樣手足無措，而

  他們在這幾場戲裡都沒有太多台詞；同樣的表演也出現在另外兩幕：一是

  兄弟爭吵時，馬志翔在瀕臨崩潰的前一刻極力克制自己；二是電影結尾徐

  詣帆獨坐在桌前一語不發，臉上寫滿了若有所失。其他配角表現不差，但

  和馬徐兩人相比，光采不免黯淡許多。希望導演蘇弘恩下次少用點手持攝

  影，比照【沙丘】的Denis Villeneuve 給男主角Timothée Chalamet一堆

  巨型特寫鏡頭的方式，多給兩人幾個超近距離的鏡頭，讓觀眾好好欣賞他

  們演技炸裂的瞬間吧!


  --'
