title: '[好雷] 香巴拉'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  《香巴拉》是導演敏巴姆的第二部長片，不但榮獲金馬獎最佳攝影與最佳造型設計雙料大

  獎提名，也讓他兩度代表尼泊爾角逐奧斯卡最佳國際影片。不過，這部以喜馬拉雅山區藏

  人文化為主的電影，背後是橫跨八國的共同製作，包括美國、法國、土耳其、台灣、尼泊

  爾、挪威、卡達與香港，而且後期的調光、剪輯與聲音全部都在台灣處理，是與台灣淵源

  很深的一部作品。



  全片都在尼泊爾和西藏之間的喜馬拉雅山的多爾波地區拍攝。劇情則描述一名女子嫁給三

  位丈夫之後所面臨的轉變。



  片名的「香巴拉」是由藏語音譯而來，是藏傳佛教徒追求的「理想聖地」、「極樂世界」

  或「人間仙境」，也就是信徒的夢想之地。片中出現三處夢境，每一次都帶有不同的寓意

  ，並以黑白方式呈現，以區別出夢境與真實。



  第一場夢是女主角佩瑪懷孕後，開始遭到村人指指點點時，夢到夫婿返家，看著自己隆起

  的肚子開心接納她的景象。這是佩瑪的盼望，也可能是她的相信，只可惜札西並未如佩瑪

  夢中一般歸來。第二場夢是二弟噶瑪最害怕的事發生的那一天，一直眷顧著佩瑪的仁波切

  在離開人間之前，還來到她的夢境道別，並在最後留下「幾個月後見」這句耐人尋味的話

  。最後則是佩瑪追隨仁波切進入到另一個世界的夢，即便電影最後並未明確點出佩瑪的生

  死狀態，但按照這兩個夢的邏輯推理，她應該已經與仁波切一同前往香巴拉。



  全片不斷出現藏傳佛教的禮敬法器──名為「哈達」的長方形絹布。由於使用哈達主要是

  為了向對方表達純潔、誠心與尊敬，所以多為藏族人認為代表繁榮、吉祥與純潔的白色。

  不過，《香巴拉》裡也出現代表智慧與宗教的黃色哈達。在佩瑪得知自己懷有身孕之後，

  她不僅前往寺廟祈求仁波切的祝福，也到札西為兩人的愛情所銘刻之石板處掛上黃色哈達

  ，象徵富貴吉祥、豐收、喜慶與心想事成，非常符合佩瑪盼望丈夫歸來的心與對即將出生

  的孩子之期待。



  獻哈達是藏族最常見的禮節，不論是拜佛、拜會尊長，還是民俗節慶、婚喪嫁娶都會看到

  ，而在《香巴拉》中因為以上所有這些場合都有提及，因此哈達出場的次數非常多。其中

  ，比較特別的是葬禮的儀式。藏族地區普遍的喪葬方式有四種：天葬、土葬、火葬與水葬

  ，另外還有最高貴的塔葬。土葬與火葬與一般常見的葬禮無異，而天葬則是片中自殺女孩

  的父親為女兒採用的方式。這位爸爸由於找不到喇嘛為女兒唸經超渡而有求於佩瑪與噶瑪

  ，而觀眾則可看到後方的天葬台有分解給禿鷹啄食的屍體。電影裡與水葬類似的場景並非

  真正的葬禮，而是在噶瑪傷心欲絕地剃髮並回鄉奔喪之後，佩瑪以哈達包裹著他剃下的頭

  髮投入河中放水流，象徵與過去道別。



  「對待丈夫一視同仁，但三個之中一定有一位深得妳心。」



  這是佩瑪出嫁前爸爸告訴她的話，從婚禮與後續的互動來看，最簡單暴力的答案自然是與

  佩瑪有愛情基礎的札西，但隨著劇情推進，觀眾才會慢慢發現，原來這句話指的不一定要

  是愛情。《香巴拉》以尼泊爾喜馬拉雅山區的一妻多夫制為主題，故事講的也是一名女子

  在婚後尋找自我的過程，但卻不是一部探討女性主義的電影。這也是為什麼本片的男主角

  反而是噶瑪而非札西，不只是因為噶瑪的戲份比札西多，而是他才是三位丈夫裡真正懂得

  疼惜佩瑪的那位。或許也與他是出家人慈悲為懷有關，但在這段短短的婚姻中，即使沒有

  愛情作為基礎，噶瑪才是與佩瑪在身心靈都最契合的丈夫。聰明的佩瑪必定也領會到這點

  ，而片尾噶瑪穿著她親手織的毛衣便是證明。



  「妳找到的會比妳尋求的還要多。」



  雖說佩瑪與噶瑪並非走在「公路」上，但《香巴拉》無疑是一部公路電影。對佩瑪來說，

  真相不言自明，她深信只要自己能夠找到札西，什麼都不必說就能洗清嫌疑，而早在出發

  前就開始織的毛衣，彷彿是佩瑪心靈的寄託，也是她與札西愛情堅定的象徵。即使一路上

  酷寒難當又崎嶇難行，但隨著佩瑪與噶瑪對彼此的認識越深，噶瑪每次不知該如何表達情

  感時，也可以透過讚美毛衣寄託自己的心意。



  噶瑪則是在這段旅程裡學會如何騎馬，並在碰上仁波切圓寂之後，認清自己的志向。就算

  心裡從來不想離開仁波切，但身為丈夫的責任讓他心甘情願地踏上這趟旅程，只是有些擔

  憂。這段時間裡，噶瑪對佩瑪說的每一句話，也成為她這趟遠行的養分，仁波切所說的「

  比尋求的還多」可能就是這個意思吧。除了獲得之外，兩人也有失去，佩瑪的愛馬在脫逃

  後慘死在狼群口下，而噶瑪沒能在仁波切圓寂時隨侍在側勢必會成為他一生最大的遺憾。



  「不管孩子是誰，生命本身就是奇蹟。」



  雖然佩瑪與噶瑪在路上目睹的「射箭試煉」並未明說是否為證明婦女節操的考驗，但從後

  段佩瑪也接受同樣的試煉來看應當如此，不禁讓人想到《最後的決鬥》一片，懷孕的女人

  要證明自己的清白居然還要靠強暴犯與丈夫的決鬥來決定。14世紀的法國如此，《香巴拉

  》裡的尼泊爾至少得以由女人自己平反，但卻是與DNA鑑定毫無關係的「射草人」。



  不同的是，《最後的決鬥》裡的丈夫在接受考驗的當下是相信妻子的，但札西看到不遠千

  里而來的佩瑪，居然仍舊懷疑她的忠誠，也難怪佩瑪要把毛衣留給噶瑪。電影特意不揭曉

  佩瑪是否成功射中草人，就像噶瑪所說，生命本身就是奇蹟，他並不在意對方是否不忠。

  從箭射出後的音效判斷，佩瑪應該成功射中，但後來與仁波切重逢的夢境或許是指她難產

  而死，並且從後續噶瑪抱著的孩子身上的裝束來推測，佩瑪與仁波切在夢境的接觸可能是

  仁波切轉世的象徵。


  --

