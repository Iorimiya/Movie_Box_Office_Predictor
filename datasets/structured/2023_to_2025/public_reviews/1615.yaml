  從劇情與娛樂性來看，

  其實是有超乎我的期待的。


  整個劇情轉折跟各方面環環相扣，

  並且不斷地翻轉，

  到最後大梗出現的時候，

  沒有猜到，而且大快人心的結局，

  覺得是一部爽片。


  值得進電影院看。





