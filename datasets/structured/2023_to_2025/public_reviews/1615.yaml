url: https://www.ptt.cc/bbs/movie/M.1686123158.A.BB2.html
title: 'Re: [負雷神作] 催眠狙擊'
content: '你應該沒認真看吧？


  先說，我的解讀如下。


  小班已經洗掉自己的記憶，同時留下

  訊號（也就是那張照片），透過這些

  訊號片段，就可以恢復自己的記憶。


  因此最後一次重啟，他已恢復記憶。


  你說為何不拷問就好？


  因為小班不會回答，而且已經洗掉記

  憶，怎麼問也問不出來。


  所以只能不斷重啟，試圖在過程中，

  讓小班發現自己安排的訊號，藉此恢

  復記憶，才能找到那張骨牌，也就是

  他女兒。


  基本上是成功的，只是沒想到小班賭

  的是女兒長大後（劇情是四年後）能

  力強大到可以壓制Boss。


  事實上，只能算平手。因為Boss中招

  後，其實已再出招，當時養父早就是

  Boss的幻影了，自殺的早已經是養父。

  可能有人會認為是沒死起來殺了養父，

  我不認為，我傾向boss已經出招。


  至於為何boss出招後不趁機抓下他們？


  女兒的實力莫測，小班夫妻又不是弱者

  ，加上boss的人馬已躺光光，這時候

  硬拼的勝算不高，自然選擇沈潛。


  很有意思的片子，不覺得有為了反轉而

  反轉，整個劇情都有前後呼應，很棒的

  神作！


  美中不足的就是畫面太弱，製作成本應

  該不高，這種片子搭配大場面會更爽。


  彩蛋說明了續集的企圖，我是蠻期待的

  ，但可能性大概不高。


  總之，是很棒的神作，絕對值得一看！


  --



  至少我看的懂，不覺得有為反而反。'
