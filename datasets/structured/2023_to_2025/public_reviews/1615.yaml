url: https://www.ptt.cc/bbs/movie/M.1685689617.A.9E3.html
title: 好雷 催眠狙擊
content: '以下為不專業敘述，斟酌使用


  整部片用催眠堆疊出一層又一層的故事線，整體精彩無冷場處又不拖戲。


  故事線連接很強，不像平常看諾蘭可能要看兩三次搭配影評才看得懂邏輯，有很好的用故

  事線敘述出故事的翻轉跟走向，雖然微燒腦但這樣的拍攝方式讓觀影的時候很容易看懂內

  容。


  最後有彩蛋，感覺會是一個系列作品的首部曲


  非常推薦可以去看，本來沒有什麼特別期待

  結果超好看，算是這兩年自己看過少數的好片


  --'
