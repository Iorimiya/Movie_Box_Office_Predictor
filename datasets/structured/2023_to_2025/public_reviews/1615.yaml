url: https://www.ptt.cc/bbs/movie/M.1685759268.A.65F.html
title: '[負雷神作] 催眠狙擊'
content: '以下有雷

  以下有雷

  以下有雷























  這部片真的爛到我覺得有點驚奇了，根本負雷中的神作


  從頭到尾簡單講就是主角一開始就被催眠組催眠了，

  催眠組很細心得安排了一連串給主角夢到的故事，

  為的是問出他女兒的下落，催眠組大家也都很用心地cosplay，

  還為主角安排了在夢中各種對抗逃命的劇情，催眠組真的非常用心，

  但我就問



  怎麼不安排一個主角被綁在椅子上被拷問的內容就好？還要這麼累大家各自cosplay

  好自己的角色，安排很多小道具，安排脫衣女路人、安排搶銀行，安排讓主角怕到不行

  的大魔王，安排認識女靈媒，安排夥伴被殺，

  還慢慢細心跟他解釋催眠超能力，女靈媒還假裝

  很隱密帶他認識駭客，催眠組還細心向主角安排了駭客查得到、查不到資料的劇情


  大魔王還要在主角已經被催眠組催眠的狀態下跟主角火拼催眠實力，

  讓主角發覺自己有不會被催眠的能力(在被催眠的情況下)

  還特地打電話催眠主角(雖然前面都催眠不了，但突然透過電話就可以屌打主角了)，

  讓主角想殺女主，然後給主角一台電腦，

  讓他在電腦裡面查女兒資料，最後主角快發現什麼的時候，女主直接破梗


  「哈哈！上面都是我們演的！嘿嘿！我們都是一夥的唷！

  你已經中招12次了 ～ 同樣cosplay劇情我們也跑了12次，可是問不出你女兒下落，

  再來一次吧～」


  幹～～～毫無意義，到底有啥毛病！！？？

  從頭到尾就是在瞎忙，

  後面開車找到女兒後，

  催眠cosplay組追過來其實劇情也很好猜了，

  肯定是女兒出場變超能力大神了。


  劇情矛盾到要梳理出劇情中的矛盾也很累的，

  畢竟裡面有很多矛盾再矛盾再再矛盾的情形，

  負雷神作無誤。











  --'
