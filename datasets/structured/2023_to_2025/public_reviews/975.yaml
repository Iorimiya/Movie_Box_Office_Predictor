title: '[ 負雷] 嗜殺路人甲'
content: "據說這部電影是「陌路狂殺」的重啟\n\n我沒看過陌路狂殺，所以無法比較兩者優劣\n\n所以我只就這部新拍的The Stranger chapter\
  \ 1評論\n\n首先我要說的是 \n\n片長才1個半小時左右 就花了將近一半的時間\n\n在一些無聊且無意義的片段 剩下一半的時間\n\n那些面具殺人魔出現\
  \ 但是一直跟男女主角玩躲貓貓\n\n明明殺人魔就發現目標了 還一直不直接動手\n\n本片完全沒有任何血腥畫面 連養眼畫面都沒有\n\n真的有夠爛 舉例來說 Ryan用獵槍誤殺屋主\n\
  \n結果鏡頭也是用遠鏡帶過 不敢近拍 笑死\n\n然後男女主角本來要在沙發上開戰了\n\n結果一個敲門聲就直接帶過\n\n我褲子都……你給我看這個？ 女主角洗澡也是\n\
  \n洗完澡不是穿睡衣而是穿外出衣服 是有多怕露？\n\n男主角明明在叢林裡可以直接幹掉其中一個面具人\n\n偏偏拖泥帶水 結果反而被面具人同夥打暈\n\n影片最後男主角應該是死了\
  \ 女主角沒死\n\n鏡頭最後一幕就是女主角在醫院\n\n接著電影就出現 「待續」To be continue字幕\n\n我應該不會再看續集了 除非電視台有播\n\
  \n有時間才會考慮看   應該選怒火狂猴 唉\n\n\n\n\n--"
