url: https://www.ptt.cc/bbs/movie/M.1684156195.A.F93.html
title: '[  雷] 邪厄—近期還不錯的泰國鬼片'
content: '只加了海報的邪厄圖文版心得：



  近年來的泰國鬼片感覺都蠻積弱不振的，除了薩滿的恐怖氛圍還不錯（但這部的評價相當兩

  極）之外，我覺得其他近年的泰國鬼片都蠻乏善可陳。


  相較之下，邪厄算是我近年看到還不錯的泰國鬼片，雖然在劇情上還是有些想吐槽的地方，

  但至少看完之後沒有失望，個人還蠻推薦這部，我覺得比後面變成喪屍片的薩滿好看。


  邪厄的英文片名是Home for rent，我覺得英文片名取得很好，十分點題。中文片名邪厄就有

  點不知所云，我有在想改名「厄房客」會不會好一點？但又覺得這還是很像好萊塢電影台的

  片名，但改成某些片名又會提前破這部電影關鍵劇情的梗，所以也許叫語焉不詳的邪厄也是

  沒辦法的事情。


  邪惡的男主角是泰星weir，女主角是泰星mew，兩位在泰國都有不少作品，皆坐擁一定人氣，

  所以這部電影在泰國的票房還不錯。


  看完預告之後，可以知道邪厄的故事大致上在說，一個倒楣的女房東因經濟所迫，被迫把房

  子出租給一群看起來很像邪教信徒的訪客後，在房東一家身上逐漸發生的詭異事件。我本來

  預期這部電影的焦點會鎖定在邪教上，但看完之後發現不止於此。


  邪厄的故事套路和人物設定其實略嫌老梗，一個全心全意保護孩子的母親、身上逐漸產生異

  變的女童、看起來藏有秘密心懷鬼胎的老公、一副看起來就圖謀不軌的邪教婆婆和她的信徒

  們，以及很衰的鄰居，這些都是很常在恐怖片裡面出現的人物類型。


  不過我覺得這部的演員們，都有詮釋出各個角色該有的感覺，尤其是邪教婆婆真的蠻有氣勢

  ，然後一直出現的烏鴉和扭來扭去的書遮面動作，和摩耶摩耶的喃喃鬼語，也為這部片增添

  了不少懸疑感、壓迫感與恐怖氛圍。


  所以雖然看到一半還是會想吐槽，家裡都鬧鬼成這樣了，媽媽怎麼不趕快去找高僧或法師、

  龍婆幫忙，但除此之外，我個人沒有太多出戲的地方，有沈浸在電影裡面的劇情和氛圍裡面

  。


  我覺得邪厄最讓我喜歡的地方在敘事方式，帶給我不少驚喜，有完整回收劇情前面的伏筆，

  這是這部電影最讓我欣賞的地方，在此就不多說，以免破梗。


  這部的劇情還蠻流暢，不會陷入近年一些泰國鬼片在畫面和劇情交代不知所云的狀況，大部

  份的畫面安排都帶著明確意圖。嚇點和使用的嚇人元素和道具也安排的蠻緊湊，算蠻有誠意

  的鬼片，不過主要還是靠音效和突然出現的鬼嚇人，我被音效嚇到好幾次。


  雖然這部的劇情還是有些讓人想吐槽的地方，但如果喜歡結尾劇情會回收前面伏筆的恐怖片

  ，可以考慮看這部邪厄。


  以下提及關鍵劇情與謎底，未看勿入






















  我覺得Home for rent這個英文片名取得很好，是因為這個名字有雙關的意涵，一方面指那間

  出租給邪教房客的屋子，另一方面則是指有潛力被靈魂奪舍的女兒的身體，我蠻喜歡這樣的

  設計。

  ----

  Sent from  on my iPhone 13


  --

  「阿鍾。」常記得有人這麼呼喚，分明是哥哥的聲音，阿鍾偶爾應聲道：「小辛。」那是

  他叫哥哥的方式，「祝阿鍾和小辛白頭偕老。」那是不知道什麼人寫在哥哥大學紀念冊的

  戲謔留言，紫色的墨水筆跡，隨著歲月漸漸暈開淡化，解離成了藍色字體與粉紅色水痕，

  想著那水痕，答案全具體了，阿鍾是哥哥的少年好友，紀蘭從沒忘記過那張年輕的臉孔，

  始終懷念那許多次的共同出遊，只是需要各種訊息拼湊，才能將名字與影像聯想在一起。

  怎麼在記憶裡，最遙遠的路程卻是直線距離。　　      ----朱少麟<<地底三萬呎>>


  --'
