url: https://www.ptt.cc/bbs/movie/M.1682934206.A.5E2.html
title: '[新聞] 《邪厄》爭霸泰國四周票房冠軍 片場洋娃'
content: '新聞網址：


  《邪厄》爭霸泰國四周票房冠軍 片場洋娃娃「中邪」嚇壞工作人員


  2023-05-01 中時新聞網 翁紫曦


  2023票房冠軍泰國電影《邪厄》，由泰國鬼片教父索分沙達菲斯執導，再度挑戰觀眾恐懼

  極限，揭開租屋邪門內幕，泰國上映迄今爭霸四周冠軍票房寶座，打敗《超級瑪利歐兄弟

  電影版》與《捍衛任務4》，《邪厄》將於5月12日在台上映。今日釋出電影《邪厄》主視

  覺海報，一樁伴隨邪教厄咒的駭人租屋事件，詭異房客凌晨四點的誦咒儀式與血跡神秘符

  號，以及恐怖祭祀儀式的巫蠱邪術，即將揭密！今日亦同步釋出《邪厄》邪靈木偶款海報

  ，一尊泰國木製詭異玩偶坐立在神秘三角圖騰神壇前，令人看了毛骨悚然，片商更在官方

  社群舉辦兩款海報的恐怖票選活動，引起網友一波討論熱潮，直呼：「木偶款超邪門！」

  、「光是這個木偶就覺得陰森！」


  電影《邪厄》除了日前釋出預告中令人不寒而慄的邪咒與恐怖租屋事件，也充滿許多詭異

  的物品，製作團隊日前公布拍攝期間發生許多無法解釋的神秘事件，其中包含了海報中的

  邪靈木偶，當開始拍攝木偶的橋段時，在場的工作人員開始有身體不適的症狀，最後拍攝

  完畢將木偶送回，不適的症狀才消失。另外一件離奇的事件是電影中小女孩抱著的洋娃娃

  玩偶，製作團隊在拍攝期間的夜晚聽見了詭異的女孩笑聲，但是房間內並無任何人，僅有

  那一個洋娃娃。女主角尼塔莎吉拉尤吉恩更透露：「拍攝期間大家都不敢碰這些玩偶，太

  可怕了！」


  電影《邪厄》描述小寧和科文是一對恩愛的夫妻，兩人育有一女瑩瑩。某天，夫妻倆決定

  從搬家至公寓，並將原住處出租給一位年邁的退休醫生（彭帕克 飾）及他的女兒。房子

  出租後，小寧接獲鄰居投訴房子每到半夜都會傳來奇怪的聲音，科文也開始出現詭異的行

  為，瑩瑩更遭受一股邪惡力量的威脅。究竟這對房客的來歷為何？為了逃出恐懼，小寧將

  不惜一切尋找真相。電影《邪厄》即將於5月12日在台上映。


  --'
