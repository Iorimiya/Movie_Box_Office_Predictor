title: '[新聞] 《邪厄》邪教徒突襲西門町 詭異誦咒遊街'
content: "《邪厄》邪教徒突襲西門町 詭異誦咒遊街\n\n2023/05/09 05:30\n\n\n《邪厄》誦咒團突襲台北街頭，引起路人好奇圍觀。（CATCHPLAY提供）\n\
  \n〔記者鍾志均／台北報導〕泰國恐怖電影《邪厄》片中的「邪教徒誦咒」橋段出現在台北\n街頭，於上週末在台北各大商圈遊街，引來民眾關注！\n\n《邪厄》揭開租屋邪門內幕，講述男女主角為出租房屋，卻遇上邪教房客，不僅半夜四點\n\
  出現誦咒聲，還有詭異烏鴉徘徊在房屋上空，挑戰觀眾恐懼極限。\n\n片商找來正宗泰國誦咒團穿著泰國宗教傳統服飾，全程播放邪咒音樂，詭異教徒團更不時\n拿起小紅書搖晃擺頭，還有民眾因為好奇，一起擺出詭異動作，引來路人表示恐怖，也有\n\
  人說：「誦咒團遊街很有趣，期待電影上映！」\n\n除了泰國誦咒團，《邪厄》也於台北in89豪華影城打造片中邪教祭壇，以蠟燭、紅色邪教\n標誌及木偶等邪物布置，讓民眾能一窺詭異邪教儀式，即日起至16日期間限定展出；《邪\n\
  厄》12日在台上映。\n\n--\n佛教經典的\n是 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
