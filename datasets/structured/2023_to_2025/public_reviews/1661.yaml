  來自菲律賓的喬伊是個家事淸潔工，沒有簽證只能偷帶著女兒在倫敦各處打黑工。從新雇

  主凱瑟琳手上獲得郊區豪宅工作，陰森宅邸裡僅住著她與臥病昏迷的老叔叔。凱瑟琳餵藥

  不假他人之手，喬伊只需簡單看護、居家打掃，薪資不差還包住宿，唯一條件是要即刻上

  工。喬伊將女兒偷渡進屋，調皮的女兒卻不理會警告到處溜達。眼看她誤打誤撞，即將掀

  開潘朵拉的盒子。



  心得：

  有夠難看


  --'
