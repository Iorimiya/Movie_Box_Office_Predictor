content: '爬文看邪厄大家給予的評價都不錯

  似乎不只有恐怖還帶有劇情

  因為我喜歡看懸疑驚悚，就是可能最後才知道「原來是這樣的」

  有點峰迴路轉的概念

  喜好驚悚懸疑大過於恐怖

  但不確定看的過程是否會有過於恐怖的壓迫感

  隨時都要緊張是否會有嚇人或恐怖的畫面出現


  所以想請教有看過的人

  這篇比較偏重懸疑驚悚，還是恐怖的成份也蠻多的呢？

  謝謝大家^_^



  --

  我天生就愛吃蛋糕....

  這輩子我註定脫離不了蛋糕了....



  --'
