url: https://www.ptt.cc/bbs/movie/M.1684929866.A.9F5.html
title: '[ 好微雷] 邪厄-懷念的泰國鬼片水平'
content: '一開始是抱著不期待不受傷害的心情看的


  畢竟泰國鬼片很久沒讓我覺得不錯的作品了（拜託不要走搞笑路線了）


  越南近年也產不少鬼片 但是都差強人意 有的還感覺很粗糙



  邪厄 一開始節奏就拉的不錯


  製造很多懸念 女主角個人覺得很漂亮


  嚇人的橋段多 密集在前段 jump scare算不少


  但是氣氛又有日式鬼片的壓迫感


  音效不單純是突然大聲


  而是整體氣氛營造的很好  反轉也充滿驚喜



  整部片最特別地方是


  邏輯細節解釋的很清晰


  靠近中段就解開始析事件的因果


  讓人有恍然大悟 ‘’原來如此！‘’的感覺


  細節處很用心 例如符號


  附身瞳孔的變化


  結尾個人覺得很棒 有點溫馨~


  個人很推  覺得算是泰國近期鬼片佳作


  --

  女主角還會軟骨功，行李箱也行XD

  看之前心得 下面的推文也以為像咒

  結果超乎期待的好看

  有種挖到寶的感覺XD

  真的我愛倒敘法 且超級詳細'
