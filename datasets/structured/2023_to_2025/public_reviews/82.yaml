url: https://www.ptt.cc/bbs/movie/M.1524799733.A.190.html
title: '[微好雷] 《羊之木》，狼來了？'
content: '部落格版：


  由山上龍彥原作、五十嵐三喜夫作畫的推理懸疑漫畫《羊之木》，曾獲得日本文化廳媒體

  藝術祭優秀獎的殊榮，曾以《聽說桐島退社了》榮獲有著「日本奧斯卡」之稱的日本電影

  金像獎最佳導演肯定的吉田大八決定將之改編成電影，找來人氣偶像、「關8」成員錦戶

  亮主演，其他飾演要角的也都是演技派影星，如木村文乃、北村一輝、優香、松田龍平等

  人，電影保留著原著獨特創新的世界觀，將人性善惡面的曖昧模糊拍成影像呈現出來，最

  大看點除了這引人入勝的故事情節外，就是吉田大八與原作不一樣的結局收尾，弔詭而又

  充滿衝擊性，完全讓人不禁想到是否是電影中虛構魔神「諾羅羅」的惡作劇，亦或者是對

  將祂困住的魚深市的報復？祂將殺人犯匯聚到這寧靜海村，使得魚深市不再平靜，可又在

  最後讓善與惡有了不同命運走向，有些惡意又帶點善意，替《羊之木》增添不少神秘詭譎

  的色彩氛圍。


  在未來的日本犯罪人口過多，監獄快要負荷不了，日本政府為了解決此現象，擬定出一項

  新政策，也就是安排罪犯到人口外流嚴重的鄉鎮「成為當地居民」，此舉非但可以改善偏

  鄉地區的人口外流問題，也能替減低監獄負擔，而罪犯在這種像是在假釋的過程中，也能

  藉由此獲得更生的機會，透過從監獄中學習到的技能、或者是魚深市公所安排的工作，讓

  他們得以融入社會、貢獻己力。魚深市因政府提供高額獎勵金給協助的市鎮，決定接受政

  府這項充滿實驗性質的政策，接納了六名罪犯來到魚深市，並安排他們住所與工作，而負

  責接洽他們的是公務員月末一，他在不知情的情況下接觸了這六名罪犯，不敢吃魚的福元

  、身材姣好的太田、沉默寡言的栗本、曾為黑道的大野、友善親民的宮腰、以及壯碩粗鄙

  的衫山。




  最後月末得知了此六人全是罪犯，且都還是犯下殺人罪的重罪犯後，雖然非常吃驚認為自

  己遭到長官欺瞞此重要資訊，但他依舊還是繼續著這工作，觀察著這六人適應魚深市的情

  況，並小心翼翼地不讓這六人接觸。月末在隨著深入了解，他知道了這些人殺人的理由與

  背景，福元因受不了長期遭到欺負，用剃刀將老闆喉嚨割斷；太田丈夫是位喜愛窒息式性

  愛的愛好者，在一次太田應丈夫要求勒住他脖子做愛時，一個不小心失控誤殺了其丈夫；

  栗田遭到家暴對待，趁對方熟睡時殺死了對方；高腰則是防衛過當，失手打死了對方；大

  野和衫山也都因不同理由殺了人。現在他們卻都在市公所安排下，在魚深市當起了市民，

  做著被安排好的工作，當看護、送貨員、清潔工、理髮師等等，本來一切都很順利的進行

  著，直到魚深市舉辦了傳統祭典，這六人才齊聚到了一塊，當晚祭典卻因他們引發了騷動

  ，其中幾個人更察覺到了彼此的秘密，尤其是敏銳的衫山，終於耐不住作惡的本性，主動

  向擁有高強體術的高腰談話，但高腰婉拒了衫山的「邀請」，在下著大雨的祭典尾聲，一

  具屍體被人發現，魚深市市民人心慌慌，月末開始懷疑是否是這六人其中的誰下的手？


  在警方的協助下，月末知道了當晚的命案全是一場意外，根本不關六人的事情，稍稍放下

  了心中的擔憂，可他卻完全閒不下來，因為他同時要煩惱青梅竹馬小文和高腰越走越近，

  另一方面又要戒備讓父親愛到不行的太田，尤其在他得知太田曾失手殺死丈夫後，更害怕

  她接近父親。難掩忌妒的月末，為了拆散小文和高腰，忍不住脫口而出高腰是殺人犯的過

  去，當小文負氣離開後，月末冷靜過後決定打電話向高腰道歉，「你是以朋友的身分還是

  工作的職責說的？」，在聽見月末告以「朋友」的回答後，高腰接受了月末的道歉，但這

  也是造成高腰心底那股殺人慾望再度竄升而起的間接原因。高腰這句問句其實點出了身為

  更生人的懼怕，一如電影中穿插著的小支線，理髮廳老闆和福元、以及洗衣店老闆娘和大

  野的相處接觸，幾場不過幾分鐘的戲就道出了世人對於更生人的刻板印象，還有更生人小

  心翼翼、較為敏感的纖細神經，於是當高腰提出這問句時，我們不妨想到，是否高腰害怕

  著真遭月末背叛，可即便他回以朋友這樣的答案，又難免猜想著這二字背後真正的意思，

  信任與懷疑、本性與友情相互拉扯，也逐漸影響著高腰。




  《羊之木》提出了這樣一個未來社會可能會面臨到的情況，也許現階段不太可能會實施，

  但誰能保證未來幾年真有某國下達這樣的政令呢？讓罪犯與居民共同生活，在不知道對方

  過去的前提下還能無事共存，可在一旦知道了真相後，誰又能真正平心看待？《羊之木》

  用懸疑劇包裝人性善惡、信任與猜疑，在主線與支線的安排，讓人感受到微小卻強烈的忌

  妒、憤怒、關愛與原諒，同時也放進對更生人的諒解與包容，四處充滿著矛盾與掙扎，是

  《羊之木》最好看的地方所在。電影最後高腰帶著月末一起跳海，因為自古魚深市就相傳

  ，若在此地跳海必有一人獲救、一人失蹤，觀眾難以明白高腰的想法，就我認為或許高腰

  是想透過這樣的方式，好來證明自己被認為的「惡」其實是值得被寬恕原諒的「善」，而

  表面上正人君子的月末，對他做的一切才是用「善」包裹住「惡」，究竟他們誰才值得活

  下來，就讓諾羅羅做出審判。


  《羊之木》讓人聯想到前年的一部日本電影《怒》，同樣用懸疑推理劇的方式包裝著，探

  討關於人性的議題。在編排上與手法兩者也非常相似，就連前面鋪陳敘述冗長這點都很像

  ，想不提《怒》光講《羊之木》，我很喜歡《羊之木》的氣氛營造，畫面搭配著詭譎配樂

  ，確實能夠挑動觀眾的神經，讓人聚精會神地看著電影，這樣說來冗長也許不太正確，應

  該說吉田大八在鋪陳這塊不夠，觀眾早已鎖定戲分最多的衫山與高腰，按照過去經驗來看

  ，往往最張狂的人越不是犯人，而乖巧溫文的才是元凶，因此最後以高腰作為「主角」引

  發後續所有效應完全不意外，對於早猜想到這種結果的人來說，《羊之木》懸疑這塊做的

  不是很成功，但它最後的收尾確實震撼，足以彌補前面的不足，逼使觀眾再回去思考電影

  中所涉及的人性。


  讓人驚豔的演員非飾演高腰的松田龍平莫屬，它就像是戲份很多的《醉極芧琣滿n的呂雪

  鳳，是整部電影的暴風眼，完完全全震懾住全場，各種矛盾全匯聚到他身上，使他成為電

  影中最具有魅力的存在。


  --'
