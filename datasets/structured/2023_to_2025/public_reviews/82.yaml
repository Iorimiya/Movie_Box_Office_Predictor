url: https://www.ptt.cc/bbs/movie/M.1760026020.A.FBE.html
title: '[普好雷]《狼來了》，諷刺中帶有警示意味。'
content: '部落格版：


  美國洛杉磯野火事件時有所聞，而在今年一月更是爆發史上最具破壞性的大火，乾燥的氣

  候與強達颶風等級的聖安娜焚風助燃下，火勢迅速蔓延且持續延燒，日落大火、伊頓大火

  、斷崖大火、肯尼斯大火等火災肆虐洛杉磯各地，範圍超過6千9百公頃的土地，高達1萬5

  千人撤離、近30人死亡、1萬2千多棟建築焚毀，其中許多著名豪宅區、太平洋斷崖區更是

  成為重災區，名媛芭莉絲希爾頓、作曲家戴安華倫、奧斯卡影帝安東尼霍普金斯、演員亞

  當布羅迪、比利克里斯托等人均痛失家園。專家認為，此次洛杉磯野火之所以這麼嚴重，

  主因為人類為解決人口增長問題，於是不斷向荒野、山坡、森林開墾、開發，越來越多人

  搬進所謂的森林與城鎮交界域（WUI），等同於讓自己搬到了野火高風險區。而當住宅周

  圍的樹木受到強風吹拂，樹枝便容易折斷壓到電線造成停電、甚至火災的發生。於是在自

  然與人為的雙重影響下，野火的規模與強度當然也就隨之提高。


  與此同時，伴隨而來的還有受到野火蔓延失控，導致棲息地破壞，為了生存不得不侵入人

  類社區的郊狼所引發的危險。飢餓讓郊狼出現攻擊性行為，傷人事件層出不窮，今年8月

  更發生郊狼出現在人聲鼎沸的球場，直接攻擊一名6歲男童的恐怖事件。郊狼出現在住宅

  區、街道的情況日益頻繁，嚴重到讓當地居民開始不敢出門散步與遛狗。為了應付顯然失

  去控制的郊狼數量，政府與相關組織都呼籲民眾不要餵食郊狼，因為這不僅會讓牠們錯認

  為這裡會有食物而停留不走，也會讓牠們出於想要保護其地盤與食物的本能，進而去攻擊

  其他動物，例如寵物犬、寵物貓與其飼主。在這個美國房價最為昂貴的城市，居住在此的

  人們無不是想花錢享受人生，可如今他們卻面臨著野火與郊狼的威脅，本該悠哉愜意的生

  活沾染上灰燼與鮮血，或許看在導演柯林米尼翰的眼中，這何嘗不是種相對必須付出的代

  價？



  與許多同類型的動物災難、自然災難電影同樣的，《狼來了》利用劇情諷刺人類對於自然

  過度索取與破壞，最終遭致無情的反撲。儘管看似又是一部走著相似公式套路的老調重彈

  ，《狼來了》卻給人更多的真實感，主要的原因在於不論是那些撕咬著主配角群的郊狼，

  或者吹斷樹木砸毀史考特停在門前的車的暴風，還有新聞台播報著的野火事件，都是不停

  發生在洛杉磯、幾近成為日常的災害，沒有常見動物受到感染發生異變、沒有外星物質侵

  害地球、沒有誇張的天崩地裂情節，而是將觀眾平常在看的新聞內容忠實呈現，讓電影更

  加貼近於現實，比起其他同類型電影多半讓人覺得「不太可能吧？」然後貼上「就是部電

  影」的標籤，《狼來了》步步緊逼的真實感反而更容易讓觀眾、至少對於曾經歷過或者正

  面臨野火與郊狼危機的人們來說，能夠去反思甚至檢討這些災難，其實都是人類的咎由自

  取。


  就如同野火與郊狼問題日趨嚴重並非一朝一夕的偶發情況，而是長久累積至今的爆發，可

  人們卻總是只注意眼前而忽略、不在意那些他們認為離自己很遠的危機其實轉眼就會發生

  。當史考特還在處理家中鼠害問題的時候，新聞報導其實早已呼籲人們留意暴風的猛烈，

  妻子麗芙也提醒是否該修剪上個月早該處理的樹木，但史考特並未特別在意，認為新聞總

  是習慣誇大危險性，也許這次也會和過去一樣安然無事，甚至當隔日暴風過後，門前樹木

  折斷砸毀車子、住宅區大規模停電都還沒有危機意識。直到鄰居慘遭郊狼咬死才終於開始

  正視問題，但停電讓各種設備無法使用、手機因為沒有充電無法求援，車子毀損使他們失

  去逃生工具，退無可退只能躲在家中摸黑躲避闖進來的郊狼群，只能說史考特一家要不是

  有著主角光環，電影再現實點的話或許他們早就命喪郊狼口下。



  《狼來了》的主線諷刺中帶有警示意味，導演柯林米尼翰用娛樂性的情節來平衡議題本身

  的嚴肅性，偶爾來一下的惡趣味成了點綴。而同時卻也能顧好親情支線，讓史考特與妻子

  麗芙、女兒克蘿伊之間的關係，隨著劇情發展有著清楚可見的改變，不會過於生硬也不會

  太過矯情。不論是主線還是支線，我認為導演柯林米尼翰都處理得很好，沒有用來填充時

  間的沒必要橋段，時而緊湊時而鬆弛的節奏，還有相當流暢的敘事，都讓《狼來了》成為

  一部能讓觀眾看得很舒服的電影。或許比較可惜的是，結局方面似乎可以有更適合、讓議

  題更為深刻的選擇。


  如前面所言，棲息地遭到破壞等同於食物來源減少，所以郊狼被迫從森林走進城市，冒著

  危險尋找食物甚至出現攻擊人的行為，但《狼來了》最後卻是選擇讓郊狼襲擊鄰居、史考

  特等人的動機是為了救出受困在這個住宅區的幼崽，最後還讓史考特上演一齣「我懂你是

  為了保護孩子，而我也是」來試圖打動郊狼的戲碼，我認為這是很讓人出戲的違和編排，

  也稀釋掉了電影可貴的真實感。不過整體而言，《狼來了》依然是近年值得一看的動物災

  難電影，至少邏輯性與主角群智商沒有讓人吐槽的地方，光就這點就值得加分。賈斯汀隆

  的演出也很討喜，與妻子凱特柏絲沃的默契不用多說，連與飾演兩人女兒的米拉哈里斯之

  間都很有化學反應，三人替電影增色不少。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
