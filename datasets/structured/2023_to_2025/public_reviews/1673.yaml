title: '[ 微負雷] 高評分《鬼噤聲》？弱版黑暗榮耀'
content: '太久沒有好看又恐怖的東南亞恐怖片

  但我不死心，還是一場一場衝

  看到《鬼噤聲》奇摩和Line的評分這麼高

  幾天前下班帶著疲憊衝


  ...？

  只能算溫溫的校園小品

  鬼毫無恐怖，背景音樂超搶，手法很古

  有點像鬼娃娃花子那個年代的效果



  --------以下雷雷-------




  如《黑暗榮耀》般

  以校園霸凌、復仇和青澀情感為主菜

  主角是個能「看到」的人

  會有一些鬼想找他幫忙（？）

  但對著空氣說話使他在校園中被視作怪咖

  因此轉學、展開人生



  在新學校認識跟一個可愛的女學生鬼戀愛

  同時校園又流傳一個「戴口罩鬼」傳聞

  在懸疑的氛圍下漸漸揭開真相

  被霸凌後死亡的女學生開始向同學復仇

  有權有勢的學生一一遭報應後

  最後就是真相....


  可愛女學生鬼，和口罩復仇鬼是同個人

  但她變成了雙面惡魔，不知自己的另一面

  在男主的救贖與喊話下

  最終拾回本心成佛


  ---


  基本上劇情好猜且俗套

  其實我是蠻喜歡這類的劇情轉折


  但手法實在不佳，畫面張力和鬼本身超~弱

  被霸凌的回憶和女主死亡的那幕實在不行

  根本是自己不小心才殞命...

  惡魔的設定也很不全

  是被古老惡魔控制，還是變成惡魔？

  口罩拿掉毫不嚇人


  只給一點分數，是給男女主的那一點火花

  以及對青春的那遺失美好

  沒想到網評這麼好~

  看來是我標準太高了..@@


  好懷念過往邪降、鬼影、鬼肢解的年代啊！





  --'
