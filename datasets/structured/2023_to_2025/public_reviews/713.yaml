title: '[普雷] 鬼們之蝴蝶大廈-人比鬼可怕'
content: '雷文防雷資訊頁




  看到某節目中某演員工商

  外加預告片疑似不錯?

  也很久沒進戲院看國片的鬼片了

  以下無劇情雷，請入

  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  前段劇情正常進行，偶爾輪流跑出ABC鬼嚇嚇人很正常的鬼片步調。

  中段劇情開始進行就慢慢偏離正軌了。

  後段整個大暴走，甚麼鬼(雙意)真的是甚麼鬼。

  總之只能勉強寫個普雷給化妝團隊辛苦了。


  總結是不推進影院，等串流即可，以上完畢。


  --'
