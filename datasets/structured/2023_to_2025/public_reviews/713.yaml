url: https://www.ptt.cc/bbs/movie/M.1730799011.A.E11.html
title: '[新聞] 《鬼們之蝴蝶大廈》裸身女鬼陣容驚人　'
content: "新聞網址： \n\n【記者王郁惠／台北報導】由導演錢人豪執導的電影《鬼們之蝴蝶大廈》，上映首周末全台賣出339萬，口碑逐漸發酵；影評人鄭秉泓與膝關節觀後讚不絕口，盛讚本片為「恐怖片天花板」。\n\
  \n\n電影《鬼們之蝴蝶大廈》鬼演員高達20位，堪稱近年「鬼影最多」。圖／劇匯文創提供提供\n\n電影《鬼們之蝴蝶大廈》以其精湛的特效、壓迫式的節奏感，打破觀眾對國片恐怖片的刻板印象。上映第一周導演錢人豪率領演員曹佑寧、曾莞婷前往各戲院送上城隍爺加持的小福票，尹馨、莊凱勛、白潤音南下高雄舉行映前映後活動，兵分兩路為宣傳不遺餘力。\n\
  \n值得一提的是，光鬼演員有20多位，堪稱近年靈異題材中「鬼影最多」的電影；片中有多位裸身演員，僅貼胸貼上陣，其中一位還是台灣知名的AV演員伊芙蝶。《鬼們之蝴蝶大廈》平均3分鐘一小鬼、5分鐘一大鬼，也被影迷戲稱是「最適合約會」的電影，因驚嚇之餘會忍不住抓緊身邊朋友，讓感情升溫。\n\
  \n至於片尾暗藏續集伏筆，對此，導演表示：「當時在取鬼們做為片名主軸時，確實有想過發展系列的可能性。但不限於往同組人物或建築發展。創作是自由的，期許自己可以一直做觀眾喜愛的電影，一直做下去。」\n\
  \n\n電影中有多位裸體女鬼，緊貼胸貼上陣。圖／劇匯文創提供\n\n\n電影邀來知名AV女優助陣當裸體女鬼。圖／劇匯文創提供\n\n補充：水塔那段真的是讓我感到驚艷耶！鬼們之蝴蝶大廈的美術、道具、妝造真的是恐怖片中的精品了吧！\n\
  -----\nSent from JPTT on my iPhone\n\n--"
