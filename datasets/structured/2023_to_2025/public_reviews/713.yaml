url: https://www.ptt.cc/bbs/movie/M.1721305687.A.801.html
title: '[情報] 尹馨、白靈 《鬼們之蝴蝶大廈》預告'
content: '《鬼們之蝴蝶大廈》定檔預告正式發佈


  轉自官方粉專





  預告連結：





  陳薇（尹馨 飾）帶著女兒（林采潔 飾）為躲避家暴的丈夫住進有自殺勝地之稱的蝴蝶大

  廈後怪事頻傳。管理員梁伯（馮淬帆 飾）和頂樓的廟公山叔（蔡振南 飾）不斷提醒她這

  一層樓不太乾淨，如果有能力還是盡快搬走，但是經濟拮据的她暫時只能棲身於此。


  各種三教九流的鄰居、雜貨鋪有陰陽眼的自閉症男孩阿弟（白潤音 飾），還有那間被再

  三交代禁止靠近的613號房，一切都令陳薇感到詭異莫名。外表陽光的代班管理員小梁（

  曹佑寧 飾）對獨立堅強的陳薇照顧有加，經常藉故上門幫忙維修家電，陳薇女兒看到他

  來也會難得露出微笑。正值鬼門開時，蝴蝶大廈內意外頻傳，甚至發生許多靈異事件，但

  老住戶們似乎已經習以為常。陳薇原本是想帶女兒逃離丈夫，不料卻將自己捲入更大危機

  之中...


  《鬼們之蝴蝶大廈》由億萬票房電影常勝軍吳明憲監製以及曾拍攝過多部前衛驚悚電影的

  錢人豪執導，加上曾獲金鐘獎最佳美術設計獎的儲榢逸擔任特效化妝指導，以及由嚴振欽

  率領的罡風創意特效團隊，金獎團隊同步出擊，強強結合打造2024最驚悚電影。


  上映日期：2024年11月1日


  主演：有尹馨、白靈、白潤音、曹佑寧、曾莞婷、安心亞、莊凱勛、馮淬帆、蔡振南、林

  哲熹


  --'
