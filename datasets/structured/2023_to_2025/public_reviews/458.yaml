title: '[好無雷] 被告汪星人 動物行為學中的生命重量'
content: "‧\n\n動物行為學之父「康拉德勞倫姿」，在1937年提出的本能理論原型，本片用以一場職場性\n騷擾為引子，逐步的將觀眾帶入了旁廳席，看了一場荒謬的法庭攻防戰，卻也是突然懾人\n\
  心魄的心靈重擊，法庭上象徵平等的天平，卻秤出重量不均的生命權，人類犯罪有著斟酌\n量刑的選擇，而狗卻只有唯一死路？\n\n而性是人類生理本能，當動機越強，其反應就越大；開頭的職場性騷擾，便是扣住這樣理\n\
  論的例子，即使毫無動機，只要刺激夠強，就體現在上司對女主角的言語騷擾上，加上隨\n意的碰觸撫摸狗，也顯示毫無尊重的行為；我們都知道未經它人同意，隨意觸碰身體或言\n\
  語挑逗，都足以構成性騷擾，但人類卻也常常不經狗的同意或是不利用減敏方式，而隨意\n觸摸狗，而造成狗的反感而反擊，所以【被告汪星人】巧妙利用人類社會的議題，轉化成\n\
  為人類、法律 與動物行為學上的盲點與極其重要的相處之道。\n\n‧\n\n我們以此片的狗主角「宇宙」為例，在動物行為學上，狗並不具備人類社會的道德與責任\n，牠所有的一切都出自於本能反應，這基因可能來自於狼祖先對恐懼的不信任及因恐懼而\n\
  咬人；如同受害者無視對於動物護食及動物凝視理論一樣，越過柵欄的安全距離，使得動\n物產生畏懼而有攻擊性。\n\n但許多國家的法律，通常把貓狗等人類飼養之寵物視為「物品」，但荒謬的是這樣的「物\n\
  品」卻只有沒入後，等待著可能安樂死選項，當然可以理解這是架構在公共安全的考量之\n下，所做的不得以選擇，但【被告汪星人】對法律的不完整性充分做出主軸闡述，並藉由\n\
  性騷擾的橋段，來反扣住人類與動物的行為關係及本能反應。\n\n\n‧\n\n【被告汪星人】是部非常典歐洲風格電影，但卻穿插許多令人感覺荒謬的劇情，但正洽洽\n\
  在控訴人類試圖以自我的標準，去衡量不知道德責任感的動物，而缺少了女主角律師所提\n出的「因罪量刑」，人類犯了相等的罪行，卻有可能只是被罰罰錢，而狗卻必須接受剝奪\n\
  生命的罪罰；並對於動物在法律上屬於「物品」或「個體」上的模糊不清地帶，拋出了許\n多國家法律的漏洞或不完整性；讓在法庭上象徵公平的天平，似乎量不準了對生命的重量\n\
  ，也許人類是神的傑作完成者，散發著理智的光芒，不像似野獸只能在地上俯伏，但也許\n就是這份高傲，看錯了對世界萬物生命權的輕重。\n\n\n‧\n\n宇宙跟隨著森林狼群嚎叫，證明了馴服千年的家犬，還可能保有野性本能的象徵，但隨著\n\
  被拉緊的項圈、那無助的眼神及靜默的片段，讓無奈飄息在法庭的空氣之間，但真正有哪\n一方是正義或邪惡嗎？飼主應要有馴服訓練責任、受害者也必須了解動物護食及其他防衛\n\
  本能；我想這場法庭攻防戰沒有一個人是勝者，讓我們看到的是法律對待非人類生命權的\n不夠完整。\n片名很可愛、狗狗很會演，但這卻不是部可以讓人因狗而開心觀影的作品，而是隨之因各\n\
  種荒謬橋段，而產生的沉重動保及動物本能議題作品。\n\n本片改編自法國真實事件，已於4/2上映\n\n\n\n‧\n\n\n追蹤茶太郎IG\n\n\n‧ \n\n\
  --"
