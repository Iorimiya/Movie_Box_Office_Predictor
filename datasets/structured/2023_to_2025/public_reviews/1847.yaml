url: https://www.ptt.cc/bbs/movie/M.1676301228.A.A8A.html
title: '[好雷]《伊尼舍林的女妖》'
content: '原文>>>



  （有提及劇情）


  在愛爾蘭的小鎮上，康姆和派德克每天同一時間都會到酒吧喝酒聊天，但有一天康姆突然

  不理會派德克，還直言不想再跟派德克有往來，甚至威脅派德克若是再來找他講話，他就

  要剁掉自己一隻手指，直到雙手的手指都剁完為止。


  「你為什麼突然不理我哥了?」

  「因為他很無聊。」

  「但他一直都那麼無聊啊！」


  冰凍三尺，非一日之寒，在長期不滿漸漸累積之下，只需要被踩雷的一個瞬間，或是想法

  的一個轉變，就可以結束一段關係，再也不理一個人看似絕情，卻又是如此合情合理。


  在派德克的逼問之下，康姆說了之所以不想理會他的原因：「我就是不喜歡你了」，這和

  情侶分手最不喜歡聽到的理由一樣，是個令人摸不著頭緒的單方面分手，既死不瞑目，也

  無從挽回。


  但這卻也是最有力的分手理由，朋友之間如果沒有利害關係，那就是建立在「喜歡」的基

  礎上，所以要是不喜歡了，那的確也沒什麼好說。


  當然大家都是成熟的大人了，所以康姆還是給出一個「更確實」的理由：因為派德克很無

  趣，因為他需要平靜。「我的內心需要一點平靜，你可以理解，對吧？」這句話讓前來理

  論的妹妹詩凡也啞口無言，因為他最清楚他哥是個無趣的人。


  這些理由對康姆自己來說是再肯定不過，但對其他吃瓜群眾來說並非如此，路邊的傻子、

  鎮上的神父，連康姆養的狗可能都不相信他會突然跟多年老友絕交，直到他用剪刀剪下自

  己的食指。


  康姆想分手的決心已經不容懷疑，但他這麼做卻和一開始說的理由相互矛盾。當初想創作

  音樂在這個世界上留下足跡，所以才嫌棄派德克的無趣會侵蝕他寶貴的時間，但他把手指

  都剪掉了，還能再拉小提琴創作音樂嗎？


  此時的康姆或許比被分手的派德克還迷惘吧，面對所剩不多的生命該如何發揮僅剩的價值

  ，在面對老年危機的此刻，不知道自己真正想要的是什麼而把氣出在別人身上，或許在這

  段關係的處理上，康姆並沒有大家想的這麼「聰明」。


  相對於康姆的穩重與音樂素養，天真的派德克對大家來說的確是個無趣的人，但大家還是

  會和他當朋友，雖然沒有藝術天分或工匠技巧那樣值得尊崇的「價值」，但他的天真善良

  本身就是一個無法取代又令人喜愛的事，只是無法以作品的形式展現出來而被低估。


  派德克在大鬧酒吧時說，想在世上被大家記得，真的只有亙古流傳的作品才做得到嗎？能

  被自己重視的人放在心上不算嗎？可以看得出康姆和派德克的「格局」不同，但也不能因

  為格局小就需要被嘲笑，而且派德克說的也沒錯，如果被世界上的人記得，卻被周遭的人

  唾棄，那也算不上是成功的人生。


  而最可怕的是兩人的一廂情願，康姆認為他必須以大格局為重，而犧牲兩人的友誼，派德

  克樂於待在小格局裡，卻還要硬拉別人下水。單方面的分手變成雙方面的纏鬥，最後兩敗

  俱傷，伊尼舍林的女妖預知的不是死亡，而是一段從親密到反目成仇的關係，變成比死亡

  還痛苦的凌遲。


  --'
