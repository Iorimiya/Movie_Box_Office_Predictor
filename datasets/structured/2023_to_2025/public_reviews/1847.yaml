url: https://www.ptt.cc/bbs/movie/M.1675513899.A.BE3.html
title: '[好雷] 伊尼舍林的女妖之心得'
content: '終於等到這部片上台灣電影院，我之前金馬影展的時候還搶不到票，看新聞這部在去年的

  金球獎拿了很多大獎。


  故事時空背景在1923年4月，不存在的愛爾蘭西岸島嶼—伊尼舍林，那時愛爾蘭內戰已到

  了尾聲，主角派瑞卻突然被麻吉絕交，爾後發生的各種效應。


  整部片用黑色幽默搭配詭譎的配樂，營造出整座小鎮滿滿的壓迫氛圍，同時也讓人不禁思

  考，到底是什麼成就了每個角色？或許時空背景造成的共伴效應，畢竟人群建築起社會，

  社會同樣也影響人群。壓力逼迫人們看清現實、學會成長，同時也能籠罩憂愁、憤怒，讓

  無處安放的異樣情緒蔓延。


  總體而言除了好看，它更是一部有後勁的作品。看完會深深思考裡面角色的互動是不是都

  有更深的涵義，不愧是馬丁麥多納導的戲，在各項細節都隱藏深刻意涵，穿插些許黑色幽

  默的同時，又把原本不起眼的生活芝麻小事，呈現的如此精彩，藉由知心好友的友誼分裂

  ，道出了人性的課題，從頭到尾引人入勝，發人深省、反思卻又震撼。裡面各個主角、配

  角演技都超好，除了柯林法洛以外，貝瑞柯根更是讓人為之一亮，跟他之前在永恆族的演

  出方式和角色都有很不一樣的突破，整部電影在場景呈現上更是把愛爾蘭小鎮的景緻展露

  無遺，進電影院看更能感受到那種遼闊浩蕩，能在金球獎得了3項大獎，在奧斯卡又入圍9

  項大獎真的完全不意外。


  --'
