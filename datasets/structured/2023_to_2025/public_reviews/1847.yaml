url: https://www.ptt.cc/bbs/movie/M.1679062979.A.B1B.html
title: '[好雷] 伊尼舍林的女妖'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  在看之前就知道這是一部隱喻愛爾蘭內戰的片，

  然而我對愛爾蘭內戰的歷史不太熟悉，

  也沒有做任何功課就點開Disney+ 來看，

  但還是被深深打動了，

  不談論它隱喻的東西的話，

  還是十分引人入勝。


  真的很驚人，這麼簡單的劇本，搭配愛爾蘭小島如詩如畫的美景，

  演員群戲精般的演技，

  （好幾度想搖晃康姆的肩膀大喊：你至於嗎！！）

  就可以讓人很順暢地看下去，

  我想這就是大師級的編導功力。


  看著平靜的海景、矮石牆，不知為何心頭卻是悶的慌，

  電影最後一幕，燒毀的焦黑房子和女巫的視線，烏雲湧動，

  海水越是湛藍，美景越美，就越是讓人不安。

  總之，雖然整部戲處處在平靜小島中綴以暗潮洶湧、讓人如鯁在喉，

  但不知為何這樣反而更加迷人，

  是部讓人難以形容的好作品。


  在奧斯卡後來看這部片，

  真的覺得本片在這屆全槓好可惜，

  但矛盾的是我也很喜歡《媽的多重宇宙》，

  只能說今年真的是《媽的》的年，

  但是《女妖》男主角、女配角、男配角，大家都有得獎的演技啊


  還有再補充一點，

  很喜歡這部片處處表現出的對動物的關懷，

  愛狗人士點個讚

  （珍妮QQ）

  （ps. 沒什麼意義的補充：被Jimmy Kimmel 請去奧斯卡獎的珍妮，不是本片真正的珍妮XDD）

  -----

  Sent from JPTT on my iPhone


  --'
