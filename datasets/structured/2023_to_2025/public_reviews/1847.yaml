title: '[  雷] 伊尼舍林的女妖'
content: '防雷




















































  我看版上都大力推薦這部電影居多

  他的確有自己絕妙的地方，但他是十分吃電波的

  如果沒能從中體會到什麼意義的話

  大概就是在看兩個演技高強的人在看彼此不爽罷了

  當然其中塑造出來的陰鬱詭異氣氛很強

  那個老婆婆總是讓我心裡有種發寒的感覺

  因為誤食手指而死的驢子也是相當精彩的轉折點

  而貝瑞柯根的角色也是畫龍點睛

  這些搭配極為美麗的取景

  就襯托了這部電影的價值所在

  但還是提醒這部電影是有著觀看門檻的

  要服用請先看清楚標示~

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  會拿美麗比喻成愛的人，都是不知愛情真相的人

  會把醜陋比喻成愛的人，都是熟知愛的驕傲者


  --'
