url: https://www.ptt.cc/bbs/movie/M.1681582737.A.597.html
title: '[好雷] 伊尼舍林的女妖 '
content: 'Martin McDonagh又一次劇本創作範本級的





  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  看到片尾是Martin McDonagh執導才又回想導演著名前作《意外》：以舞台劇感的敘事方

  式：某種架空現實環境的表演詮釋，十分仰賴以角色為主的罪惡感與事件的因果巧合。



  同時似乎已經可以直接稱讚，並且很合理覺得劇本上的許多巧思：一對本來喜歡聊天的麻

  吉好友，突然在有一天A朋友發覺之前的喇賽都在浪費時間，所以不想浪費時間聊天，於是

  兩人不再是朋友。但B朋友硬要靠過來聊天，於是A朋友就嗆說如果我們在聊天一次，我就

  砍斷一根手指頭。



  英文片名Banshees報喪女妖，具有愛爾蘭意味 本身涵蓋我所理解的愛爾蘭文化，酒吧聊

  天，以及背景的高原景觀。企圖在帶點暗示20年代的時間背景，同時保持抽象與架空空間

  感中，以某種鄉村寓言的人云亦云的庸俗，與自命清高的孤傲之間，再帶點我所認為英國

  戲劇的喜劇感，與其中在談孤獨與時間遺忘等等的感傷氣氛，其實是很不容易處理的作品

  ，不管是劇本上，或是電影上調度與氣氛拿捏。



  Banshees報喪女妖的死神設計也讓人想起《第七封印》的死神帶有某種宗教上的啟示，如

  同A朋友自殘做為某種報復，或抵抗，乃至於作品完成後對人生的無可留戀感：也讓人想

  起耶穌說「有人打你的右臉，連左臉也轉過來由他打」（經由查閱資訊，並我的理解是，

  對應冤冤相報的解方之外，更有讓對方的惡讓自己承受的救贖意味。）



  電影最後因為巧合砍掉的手指亂丟害死B朋友的驢子，讓本來A朋友砍斷五根手指之後，讓

  B朋友無話可說的狀態下，反過來成為某種負罪。一直到焚燒的房子都帶有某種宗教性，

  以及神來之筆的鐘聲，同時畫面是讓動物的眼神像是有某種感應，到這裡的留白感都挺好

  。只是最後劇本邏輯理性困境：朋友A一直內心愧疚，反而因此在最後的場景打破原則開

  始跟朋友B閒聊了。於是最後的結局意味著，還是劇本上的邏輯的思考，而非我覺得會更

  好的留白感受。






  --


  拉特飯 - 以商業力量進入獨立市場


  --'
