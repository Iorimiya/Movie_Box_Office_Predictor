title: '[好雷] 伊尼舍林的女妖 觀後感'
content: '在之前有看過馬丁麥多納的「意外」，就對這種在人性互動上有深刻探討，卻是以事件交

  織組成的敘事方式很有興趣，但一開始聽到「伊尼舍林的女妖」片名的時候，不知道為什

  麼就是一直想到凡赫辛。本來沒什麼興趣的，不過看預告提到的那些威尼斯影展等大獎，

  還有發現是「意外」的導演時，就決定揪朋友一起看了，回家後看新聞報導，這部片又入

  圍奧斯卡九項提名，真的有夠猛！


  劇情內容分享 微雷請小心

  ----------------------------

  ----------------------------

  ----------------------------

  ----------------------------

  ----------------------------


  故事大致上是描述兩個朋友之間的友誼，在一夜之後，突然其中一方就跟對方鬧翻了，先

  暫時代稱為Ａ與Ｂ，A是生氣的那位。過程中B處心積慮想與對方和好，所以用了很多不同

  的方式找Ａ溝通，從對話、懇求、失落到燃起希望，就這樣反覆地嘗試幾次。後來在彼此

  的來往中，Ａ的絕交的心情又更堅定一些，甚至以如果與Ｂ對話，就要以斷指來懲罰自己

  ，其實看到這麼極端的對應方式，更不能理解演變成這樣的契機是什麼，是直到看到Ａ君

  表達對於音樂愛好，以及自己對自己的期待與事實之後，有一點似懂非懂的，可以感受到

  友情之間出現的嫌隙，那樣的厭惡與憤怒會不會是來自於自己？


  不確定對不對，但感受比較深刻的是兩件事，一是最好朋友認識的「我」，其實不是真的

  我，而是偽裝的我，所以感受到厭惡。另一是「我」是被受阻饒而無法前進，所以並非「

  我是」真的不願意前進的自己。

  但一樣都是源自於無法面對自己所產生的厭惡感，而他的好朋友B就是這個厭惡的出口。

  藉由跟朋友相處的對話的過程與階段，實際上影射的卻是跟自己相處。


  只看一遍的記憶力跟感受大概是如此，但也真的蠻佩服導演的敘事功力，有在思考是不是

  去看第二次會有不同想法，也有其他看過的人想討論嗎？



  --'
