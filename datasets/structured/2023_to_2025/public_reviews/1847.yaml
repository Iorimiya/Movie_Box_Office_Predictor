url: https://www.ptt.cc/bbs/movie/M.1675055976.A.76A.html
title: '[好雷] 伊尼舍林的女妖 The Banshees of Inisherin (2022 愛爾蘭片)'
content: "2006 我第一次去比利時 Bruges 驚為天人，就有個導演拍了《殺手沒有假期》於 2008 上映！2003 我第一次去愛爾蘭 Aran Islands，此導的《伊尼舍林的女妖》卻到\
  \ 2022 才隆重推出，拍攝地點正是「阿蘭三島」當中最大的「大島」Inishmore ！此島面積 31 平方公里比蘭嶼還小，島型狹長滿佈牧草地與砌石牆，也沒多少家戶還散居各處，我們觀光客搭船入港的島東碼頭就已算唯一聚落，租個腳踏車很快縱貫南北兩岸，島西另一端則比較荒僻渺無人煙...\
  \ 看看柯林法洛飾演的主角都在他家看夕陽西下、被碼頭雜貨店稱之為「你們那邊」，可知他所處之地已是天涯海角。\n\n\n\n        因尼艾琳，島嶼故事\n\
  \n歐陸以西有不列顛、不列顛以西有愛爾蘭、愛爾蘭以西有Aran Islands、阿蘭三島最西就是 Inishmore、島上最西就是主角姐弟 Siobhan &\
  \ Pádraic 的家，如果歐洲文明是由東方漸傳向西邊、那這就是文明最晚到的天涯海角！本片這島取名「伊尼舍林」Inisherin 未必專指 Inishmore，以導演\
  \ Martin McDonagh早年「阿蘭三島三部曲」已演過「中島」Inishmaan 與「大島」Inishmore 來說這次應是要演個「東島」Inisheer的故事...\
  \ 但劇本改編成電影後取個「伊尼舍林」就引起各種「愛爾蘭隱喻」的聯想，畢竟 Inisherin = Inish Erin = Inis Éirinn即「愛爾蘭島」。\n\
  \n這島名加上 \"Banshees\" 就成了片名「愛爾蘭島的報喪女妖」，由小見大演繹一場「愛爾蘭死亡記事」，而且這死亡有跡可循可以預見！只是儘管被預見也未必\
  \ 100% 會導向死亡，畢竟事仍在人為而非命定公式，還要看人性的覺醒何時到來。話說此導前片《瘋狗綁票令》和《意外》我雖沒看過，但光看《殺手沒有假期》覺得裡面好多人都超有原則超堅持公式！但最後這「殺小孩者死」的公式只是讓人走向死胡同。回頭看看導演早年「阿蘭三島三部曲」，一齣談小島瘸子拼命前進大島尋求翻身、一齣談大島子弟大舉報仇卻報錯了仇，我雖沒看過全劇但看大綱已聞到濃濃執念。\n\
  \n\n\n        小島社會，庸碌人情\n\n看回本片《伊尼舍林的女妖》The Banshees of Inisherin，兩位主角 Colm & Pádraic\
  \ 也是充滿執念的死腦筋！以當代文明社會來看他們的蝸角之爭簡直不知所謂，以片中最接近主流文明的姊姊 Siobhan看來兩個都瘋了，但他們身在這日復一日年復一年彷彿永恆不變的小島，就硬是養成這種單純僵硬不知變通的牛脾氣。且別說一個小島會為了芝麻小事急轉直下結下樑子了，連更文明的對岸「主島」愛爾蘭都能曾經攜手卻演變為內戰，耳聽小島警察官僚都能說出「有九先令與一頓午餐我管他處決的是誰」，這已不只是人性撤守得如此容易、而更令人懷疑人性是否存在過？\n\
  \n本片小島多位主配角也許有「人情」，但那未必是真「人性」展現，反而更像是固守封閉小島代代相傳渾噩學來的慣例，充其量是懂得些人情世故可社會化能遵從制度與慣例，但同生為人看見彼此體察其情的\
  \ humanity 尚懵懵懂懂。主配角群中唯一體現小島「教養」的是警察 Peadar 與其子 Dominic，只能希望其他家庭不是如此但恐怕也好不到哪去，畢竟這農牧社會的教育只是急著培養孩子加入勞動存活一生，唯一外來的主流文明就是神父帶來的佈道與告解，只是隨著兩場\
  \ Colm 的告解戲份我們也知宗教的角色只是公式化規訓... 那島外還能滲透進來哪些非主流文明呢？\n\n\n\n        文化執念，忘卻人情\n\n\
  一是 Siobhan的「閱讀」、一是 Colm 的「音樂」，當然在這內戰時代還有「砲擊」令主島超有存在感、但如 Pádraic 這樣的鄉民只道「你們為了什麼打這場仗老子都不管」！這「島嶼記事」中的小島小民繼續日復一日自得其樂宛如化外之境...\
  \ 這當中，姊姊 Siobhan年紀尚輕還有未來值得她出走，也許使得她仍能跟小島社會和平相處靜待轉機；而自命「只剩12年」的 Colm 也沒什麼投奔主島另創基業的未來了，只能留守島嶼小宅將有限人生做到最大：每天寫曲三天成一首、酒館演奏由舞曲改抒情歌謠、民俗小提琴教授科班學生、欣見民族音樂現代化成愛爾蘭四重奏！\n\
  \n看到四個音樂學生演奏時 Colm 那欣慰笑容我也滿心雀躍，原來這就是我去玩愛爾蘭時隨處可見的酒館小樂團！看來「鄉土與城市」的相遇果能令文化開花結果！Colm也直言不諱他不想再瞎混而要把握人生正是著眼「文化」，是「音樂繪畫詩歌」讓人們如莫札特般永垂不朽，我僅剩\
  \ 12 年的生命可延伸數百年！的確眾志成城的文化力量可無遠弗屆超出個人一生想像... 不過在本片被 Colm 視為「渾噩島民」代表的 Pádraic 亦振振有詞捍衛自己價值：我只是\
  \ nice 而已「但 nice 錯了嗎？」做人 nice 不會像莫札特被世人紀念、但我爸我媽我姐都很 nice 會被我永懷一生！\n\n\n\n      \
  \  人情文化，孰為人性？\n\n本片中段這段爭吵應算直白地勾勒了對立格局：Pádraic代表著小島恆定的日常、充滿相濡以沫的人情與言不及義的社交，Colm則代表著求新求變的超越意志、充滿文化的追求與遺緒的建立！這兩種價值有沒有孰優孰劣呢？這恐怕要看觀眾自己的人生處境與階段，以我個人來說常常在當\
  \ Colm 想望著他方：國高中覺得同班同學都好庸俗我好想長大、大學覺得國內同學都好小鼻小眼好想去留學、留學又不滿於單校單國自命池中魚還想游去更大的世界、越爬越高卻每年過年都要回家言不及義真狂翻白眼！這種「不想浪費人生」而想把握時間做點事的情懷，也許過完年最有感吧？\n\
  \n Colm 代表文化與卓越、Pádraic代表社會與人情，一個如「割袍斷義」般為卓越進步而「斷指絕交」、另一個自命好友卻沒尊重朋友意志而堅持掛著，兩個都有《殺手沒有假期》主角群那種執著原則絕不妥協的死腦筋！但能像《殺》片雙主角最終超越執著學會變通找到生路嗎？那就要看《伊》片兩人各執原則之餘如何綻放人性。人性這東西，都是存在的，較明顯能自由實踐人性的是姊姊\
  \ Siobhan，她雖也有文化夢想但仍能耐心面對小島日常；渾渾噩噩的 Dominic雖粗魯無文，但他對 Siobhan兼具心儀與尊重、對 Pádraic 明辨人情針砭事理，這人性品質可不輸給文明人。\n\
  \n甚至看似絕情冷酷的Colm，他看見 Pádraic 被打在地灰頭土臉時，即使自己早已立了「斷指之誓」仍默默扶起來陪送回家，畢竟他也只是追求一爿自我實踐追求卓越的靜謐角落，倒並沒有要拋棄基本的人情義理，雖然這樣公道地保持距離也實在不太夠\
  \ nice ；但相對地，人很 nice 的 Pádraic 就能展現人性嗎？看他為了留住好友能夠忽視好友意志、違逆好友意願、侵犯好友自由、乃至酒醉後對好友惡言相向、甚至對好友的新友口出惡毒謊言！連比他更粗魯無文的\
  \ Dominic 都知這樣一點都不 nice！於是我們知道他的 \"nice\" 與其說是人性，不如說只是表面的社交儀節。\n\n\n\n        渴望上爬，淡忘人性\n\
  \n當然 Pádraic 也有其單純卻獨到的人性見解，只是看這人性的發揮是否受到看見與鼓勵。本片從「文化」到「無文」的交友光譜大致可以這樣分：第一名 Colm\
  \ 有文化理想且激進實踐、第二名 Siobhan有文化理想仍能融入社會、第三名 Pádraic 人雖渾噩無文但尚在意社會儀節、第四名 Dominic則不但渾噩甚至不長眼睛簡直視社會儀節如無物、第五名則是驢子\
  \ Jenny與其它畜生根本無法跟人相提並論... 但很悲傷地，人總是想往更高處去交友、卻對低處的朋友鄙夷不耐，譬如 Pádraic 念著 Colm 卻對 Dominic渾沒好氣、譬如\
  \ Siobhan嚮往前進主島卻拒絕驢子進家門...\n\n於是 Pádraic 的人性在意想不到之處發光：「牠只不過想要陪伴」，渴望友情的他竟對驢子同病相憐心生同理，竟漸讓驢子\
  \ Jenny登堂入室平起平坐相濡以沫，這看見別人的人性發揮竟及於與文明最遠的動物身上！直到這人性希望遭到意外扼殺時才讓 Pádraic 徹底變了個人。這意外肇因於\
  \ (1) Pádraic 為爭回老友而對其新友口出惡毒謊言，(2) 老友 Colm 本來都快跟他和解但聽到這事臉色一變仍決絕斷指，(3) 斷指陰錯陽差害死驢子\
  \ Jenny令 Pádraic 如喪親人般誓言以牙還牙從此勢不兩立！可說 Colm 本來拒人於外意在找到平靜，但兩相對立衝突升高反結下樑子。\n\n\n\n\
  \        執著原則，錯過人性\n\n這故事，時空背景設定在 1923 年春天「愛爾蘭內戰」末期，是要用一個小島寓言來隱喻愛爾蘭內戰嗎？要以「五根手指」去隱喻「北愛六郡」嗎？與其從小見大去隱喻愛爾蘭內戰，我還更重視片末\
  \ Pádraic 由大見小為他倆關係畫下註解：「內戰結束了？這只是開始，以後只會有無盡衝突，」愛爾蘭如是我倆亦如是。說愛爾蘭內戰罷，關於國家民族的意識型態與權力劃分恐佔很大因素；但說\
  \ Colm & Pádraic兩人罷，我倒覺得是兩人心中各自對其「文化卓越 vs 社會人情」的理想都太過執著。但遺憾的是這兩者都無關人性，反而兩人都有的人性在這執著對立中都被犧牲。\n\
  \n衝突處處都有，就看兩造願不願找到機會退一步：Colm明明可以對 Pádraic 敞開心胸表達其志好聚好散，但他以冷面決絕開始致對方心裡累積空缺與執著，後來他願意坐下來好好談恐為時已晚，「斷指」宣示更一次次激化升溫再難冷靜；Pádraic聽\
  \ Dominic「挺身而出」的建議，直到在酒館捍衛「nice價值」時都是正面交流令 Colm 暗暗點頭，只是當他下一步已不是表達自己而是在排除敵人時，那可不是人性表述而是欺騙與佔有了，Dominic\
  \ 聽了也無法苟同 Colm 更翻臉爆氣再斷四指。衝突兩造都有人性有其關懷，但兩造若執著原則而犧牲人性，終將每下愈況再難回頭。\n\n\n\n        島嶼偏執，豔羨傲視？\n\
  \n至於這種死腦筋的偏執性格，有沒有其「島嶼」的環境因素呢？本片雖沒明確指向這因素，但有好好利用阿蘭三島「大島」Inishmore 的場景、去勾勒一個生活空間就這麼點大的\
  \ Inisherin，各種令人嘆氣的渾噩庸碌就這樣年復一年代代相傳，留在島上沒有出路只會讓小情緒日復一日慢慢擴大（化作台詞就是同一句話一直重複宛如鬼打牆），甚至那「尋找出路」的希望也做成了偏執決絕彷彿向過去人生復仇似地...\
  \ 但島民想到的作法難道只是擁抱外面花花世界的「音樂繪畫詩歌」等豐美文化嗎？在島上無文時可能還這麼覺得，但真出去浸淫文化後恐才發現又陷入另一執著。\n\n本片夾在「文化\
  \ vs 人情」之間總是出不了頭的「人性」，若拿來給角色評分誰最高分呢？我竟覺得是最粗魯無文的 Dominic：他什麼文化藝術與人情眉角都不懂，說話行為都不得體令人聽了生厭，但他想追妹就去訴說己心傾聽對方回應、鼓勵朋友訴說己心朋友走歪也直言針砭，只是這樣的人只換來一句很有禮貌的「你這種人我恐怕不行」一翻兩瞪眼...\
  \ 每個人的心都有其自由、敞開己心互相傾聽體察就是「人性」，但心的交會看的難道不是個別人心而是分類？甚至本片幾位主要角色包括動物之間還有個基於文化體面的「交友位階」？只嘆文化儀禮與人情世故疊床架屋呀。\n\
  \n導演拍這島嶼故事是在批判島民文化嗎？也許最純真的島民文化反而是 Dominic這樣單純直率呢？可惜小島神父公式告解聽不見人心、小島警察權勢規訓令人不敢造次、小島港口流言蜚語不真關心人處境、小島社會要人遵從儀節不從就排斥、甚至島民朋友沒朋友時才拿他當備胎、不滿島嶼現狀者如有能力只想離島而去...\
  \ 本片由 Inisherin「因尼艾琳」隱喻「愛爾蘭島」難道也有類似的島嶼窠臼嗎？是否也能換個時空回視我們「因尼大員」呢？我們也有文化的向外艷羨向內傲視甚至出走性格嗎？我們島內最純真的人性又在何處出現？島內的曾經好友也會急轉直下針鋒相對？\n\
  \n\n\n結果那位顯然是「報喪女妖」Banshee 化身的老太太 McCormick，她預言到的竟是小島最純真心靈的死亡，而片名既是複數 \"Banshees\"\
  \ 那第二位「報喪女妖」又是誰？恐怕就是大膽預言「這只是無窮衝突的開始」的主角Pádraig，這樣的島嶼命運壓抑了各種一閃而逝的人性、先埋葬了人性最純真的 Dominic、亦將見證島內衝突源源不絕的犧牲！這島民性格又有何解呢？這是個既悲傷又悲觀的故事，不像《殺手沒有假期》最後儘管有死有活仍放下偏執完成了一種超越體悟...\
  \ 今日的島嶼處境已然不同，這「對立」故事卻對整個世界更加切題了，推薦做好心理準備耐心欣賞。\n\n\n--\n想念 Aran Islands & Galway！當年年輕我還騎車縱貫\
  \ Connemara現在想來都冒汗 XD\n大方來超譯，別太拘束嘛 :D 只要敢預言敢放話敢烏鴉嘴，誰都能當個報喪女妖～\n話說 Colm 寫這曲也對 Pádraig\
  \ 放了個話，好像也值得推敲推敲他的創作心境。\n以「人情」的和解來看，這場戲他顯然還不到要和解的地步；\n但以「文化」來看，這時的 Pádraig 振振有詞據理力爭，Colm那敬佩可假不了的。\n\
  \n至於「從來沒想要」和解嗎？在聽到 P惡毒謊言騙人前一刻，恐怕已在和解邊緣了。"
