title: '[好雷] 伊尼舍林的女妖'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~













  如果有一天 你的好朋友不再與你交談

  不願意再跟你有任何牽連


  原因就是 不想再浪費時間跟你閒聊了

  你會怎麼辦?


  雖然說板上有人講到這是在隱喻愛爾蘭跟英格蘭的關係

  但其實現實中真的有那種類型的人


  有興趣的可以去google 一下infj

  這種人追求的是心靈上的和平


  也最討厭虛偽

  所以說出口的事情，就一定要做到









  回到電影本身


  節奏其實還蠻慢的

  結構倒是簡單易懂，但是對劇情能否有更深刻的理解

  我覺得跟觀影者的人生經歷會有些關係


  如果在人生中沒有遇過一些風雨

  可能會覺得 你這部戲真的是無聊透頂


  但是現實生活真有可能這樣發生

  而padraic其實也只是個單純的大男孩


  身處在百般無聊的伊尼舍林

  你的生活也很可能就是那樣地無趣









  而當這麼單純的人

  好朋友是個 會對身為人的存在，去質疑、去思考的類型


  那你要怎麼期待P會理解C的做法呢


  所以兩方都沒有錯，兩方也都很真誠地面對彼此


  一開始當P被警察打了兩拳之後

  C把他扶起來，然後要載他回家


  P想跟他說話，但是卻又無法言語時

  柯林法洛的演技真的是好到嚇人


  非常能感受到P當時的感覺

  因為你與我都已經無法互相理解了 :''(








  這部片裡面討論的有友情、孤獨

  想望，還有歸屬感


  風景很美，對話也很有趣


  這部片用很淺顯的劇本

  想表達出更有層次，但是更隱晦的那個層面


  只不過 這不會是每個人都喜歡的片




  --





  --'
