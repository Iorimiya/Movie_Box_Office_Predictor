url: https://www.ptt.cc/bbs/movie/M.1673106981.A.758.html
title: '[新聞] 友誼的傷害比愛情更可怕《伊尼舍林的女妖'
content: '新聞網址：





  友誼的傷害比愛情更可怕　《伊尼舍林的女妖》柯林法洛跟老友翻臉


  5年前《意外》（Three Billboards Outside Ebbing, Missouri）在奧斯卡拿下最佳女主

  角與男配角，導演馬丁麥多納（Martin McConagh）功不可沒。現在他帶著新片《伊尼舍

  林的女妖》（The Banshees of Inisherin）拿下8項金球獎提名，以神話妖精比喻男性友

  誼的傷害，讓柯林法洛（Colin Farrell）成為角逐奧斯卡男主角的熱門人選。


  在愛爾蘭的傳說裡，報喪女妖代表死亡的象徵，她們在某人即將死去時會號哭，一直到

  1948年，都還有目擊報告。電影就是取這個典故，在名為伊尼舍林的島上，音樂家康姆跟

  鄰居派瑞本來是好友，但突然間康姆決定斷交，不想再聽到派瑞成天言不及義。友誼的小

  船說翻就翻，讓派瑞先是覺得受傷，進而無助，甚至為此憤怒，決定無論如何都要討個說

  法，更激怒了康姆採取激進手段。


  14年前《殺手沒有假期》（In Bruges）是導演馬丁麥多納、與柯林法洛、布蘭登葛里森

  （Brendan Gleeson）首次合作，創下極高的評，如今這3位都是來自愛爾蘭的電影咖，在

  愛爾蘭西海岸的島嶼進行拍攝《伊尼舍林的女妖》。而柯林法洛因本片威尼斯影展奪得影

  帝，讓接下來的奧斯卡呼聲極高。


  2019年底，製片人葛拉漢布羅德本特（Graham Broadbent）在阿根廷旅遊時，收到了馬丁

  麥多納的劇本，在飛機上，他深陷在《伊尼舍林的女妖》各種人物的情緒當中，「兩個朋

  友的疏遠，導致災難性的後果。它擁有馬丁麥多納的所有標誌：有趣、悲傷、黑暗，充滿

  人性。」導演透過兩個摰友的情感破裂隱喻愛爾蘭內戰帶來的傷害和悲劇，「我希望這部

  電影能提醒人們，做出一個錯誤的決定會產生深遠的影響，你是否投入全部的身心靈到工

  作中而無視朋友、戀人或家人？工作是最重要的嗎？誰受傷有關係嗎？這是一個我跟電影

  都沒辦法有答案議題，但也許我們可以面對它，不要再嘗試走那條路。」


  電影預告（1/27上映）




  --'
