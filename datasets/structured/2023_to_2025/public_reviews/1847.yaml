title: '[好雷] 伊尼舍林的女妖'
content: '看完其實滿抑鬱的，柯林法洛把派瑞這個角色詮釋地很討喜，老實說滿可愛的，一開始看

  電影很不習慣XD

  派瑞這角色不全然是不懂人情世故的白目，也可以看到他心境上的變化，天真跟對友情執

  著的一面逐漸瓦解，甚至被多明尼說了一句。


  伊尼舍林的環境或多或少影響裡面角色發展跟做得決定，雖然伊尼舍林愜意，但是卻也很

  無聊，感覺派瑞生活在這島上，也沒特別的事情可做，所以才更對朋友決裂更執著，不知

  道是不是也表示當時愛爾蘭內戰，伊尼舍林代表大環境的影響，所以有很多的不得已。

  最後，

  姐姐選擇離開

  多明尼了斷生命

  康姆選擇自殘，執著自己想做的事情

  派瑞也不得不放下天真的糖衣，被迫成長QQ


  --'
