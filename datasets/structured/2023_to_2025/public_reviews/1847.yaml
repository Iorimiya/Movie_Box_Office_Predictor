url: https://www.ptt.cc/bbs/movie/M.1674902390.A.817.html
title: '[好雷] 《伊尼舍林的女妖》，緣分盡了那就好聚好'
content: '部落格版：


  實在是太喜歡《伊尼舍林的女妖》了，比導演馬丁麥多納前部作品《意外》更讓我喜歡。

  《伊尼舍林的女妖》和《意外》兩部作品劇本同樣優秀，然而和《意外》相比的話，《伊

  尼舍林的女妖》顯然寫得更為高明，電影描述著兩位曾經形影不離的好友，但有天某方卻

  單方面突然的提出絕交，讓莫名被絕交的另一個人百思不得其解，只能不停地釋出善意，

  企圖修補這段連怎麼回事都不曉得的關係，而在來來回回的數次拉扯之後，因一次的偶發

  意外徹底的讓被絕交的這方心死並認清事實，回頭找上提出絕交的那方告訴他、他們真的

  如他所願的「回不去了」。導演馬丁麥多納以這樣一個看似通俗的談論友誼關係的劇本，

  來暗喻著愛爾蘭與英國間的歷史關係，將故事背景設定在1923年愛爾蘭內戰用意顯而易見

  ，不僅是讓主島的綿延戰火和伊尼舍林島上同樣正發生的「內戰」遙相呼應，同時亦是輕

  巧的讓歷史化身為角色，用他們來實際帶領著觀眾去認識這段過往。


  康姆就好似當時在一次世界大戰後高喊著獨立的愛爾蘭，而派瑞則是那原本將其綁在一起

  的英國。康姆（愛爾蘭）告訴派瑞（英國）自己有感於歲月的流逝，他不想再繼續陪他無

  所事事、渾渾噩噩的過日子，想要寫下一首能流傳百世的小提琴曲子（想被承認為獨立國

  家），所以即使派瑞難以理解、甚至還一度認為是愚人節的玩笑話，康姆（愛爾蘭）還是

  強迫派瑞（英國）立下從此井水不犯河水、不准與他交談的約定（英愛條約），可是派瑞

  （英國）卻始終不放棄和康姆（愛爾蘭）尋求重修舊好的機會，數次的無視約定前去向康

  姆搭話（似英愛條約仍無法讓愛爾蘭完全獨立自治，而僅是仍屬於英國監督的自由邦），

  導致康姆（愛爾蘭）憤而依照自己立下的毒誓砍下自己的數根指頭（北愛爾蘭六郡）送給

  派瑞（英國），最後派瑞因心愛驢子遭康姆斷指噎住害死徹底心死，直衝酒館放話要放火

  燒了康姆還有他的房（後來英軍加入由英愛條約而起的愛爾蘭內戰），兩人在海邊對話完

  後派瑞的先轉頭就走，好似英國終於不再執著於和愛爾蘭的關係，也彷彿知道他們兩人（

  兩國）將來還是會維持著微妙的平衡關係。



  雖然在順序上與本意上有些順序調換，然確實的是在《伊尼舍林的女妖》中能將角色與情

  節和歷史有個互相對照，當劇情與歷史有了巧妙連結，整體觀影的趣味性便提高不少，不

  過《伊尼舍林的女妖》有意思的地方在於，即使觀眾對愛爾蘭內戰或者是英國與愛爾蘭間

  的歷史不熟悉也無所謂，導演馬丁麥多納筆下的眾多角色，包含著派瑞和康姆、詩凡、多

  明尼與他愛猥褻兒子的警察父親、詭異的麥柯米婆婆、雜貨店愛聊八卦的女店長、酒吧一

  搭一唱的老闆與熟客，甚至就連一週才來伊尼舍林島一次的神父，他們彼此間的對話與互

  動就已能帶給觀眾足夠的娛樂性。此外，康姆想要分道揚鑣而向派瑞提出的、派瑞後來陷

  入糾結的「好人」問題，還有困擾著他的「無趣」問題，以及貌似只有康姆才有但從島民

  們的對話裡依稀都能察覺到的、對生活在此久了的絕望感與煩悶，想靠著議論八卦是非來

  遮掩內心因一成不變而生的空虛，都成為空氣瀰漫整座伊尼舍林，隨著呼吸進到觀眾肺裡

  ，然後感染上似是無解的多愁善感，反芻著被留在島上的寂寞。


  派瑞就好像是整座伊尼舍林島上最格格不入的存在，他是康姆口中的好人，也是無趣的人

  ，然而這裡最不需要的其實就是好人跟無趣的人。但偏偏派瑞去怎麼也想不明白，自己是

  好人不好嗎？自己真的有那麼令人感到無趣嗎？他就好像在電影的最開始，所有人都問著

  他是否有跟康姆吵架？他從「我們沒有吵架」，到「我覺得我們沒有吵架」，最後連自己

  感到困惑「我們有吵架嗎？」，派瑞在康姆疏遠他的初期總是逢人就問，連他姊姊詩凡都

  被問到受不了，只是沒辦法，他就是要從別人口中得到自己「是好人這件事是沒錯的」、

  「是有趣的人」的肯定答案才滿意。有了這些評論當靠山，派瑞仍舊追著康姆想要替自己

  爭辯，才於是導致後面連串風波的發生，但老實說兩個人都沒有錯，康姆認為這個世界上

  不會有人因為善良、因為是好人而被記住，能留下來的往往只有作品，或者是作惡多端的

  惡人，既然這樣他何不選擇把更多的時間留給自己，好去創造一個能讓自己被世界記住的

  作品？


  可對派瑞來說，單純無心機的他只願把善良留給值得的人，而那個人除了姊姊，就是康姆

  了。他也許沒有任何遠大的理想抱負，他想的就是和姊姊繼續住在島上、和康姆每天到酒

  館報到，喝著酒聊著天、分享生活瑣事就夠了。《伊尼舍林的女妖》說的可以是英國與愛

  爾蘭的歷史故事，也可以說的是朋友若道不同不相為謀、各走各路各自安好也好的故事，

  身邊的那些人（鄰國）、勸離的、勸和的、看好戲的、只想當茶餘飯後話題聊的，都是這

  個故事的一部分，見證了曾經友好的一段關係至分手的過程與結束。


  而有趣的是，導演馬丁麥多納不僅以曾經形影不離的兩位好友來形容英國與愛爾蘭的關係

  ，也在電影中放入麥柯米這位「帶來死亡預報的報喪女妖」角色，除了替電影增添神秘的

  詭譎感，更是藉由她曾經向派瑞預告「將有兩人死亡」的警語，悄悄暗指著如果他（英國

  ）與康姆（愛爾蘭）無法達成共識的話，兩人（兩國）或將兩敗俱傷、甚至步入死亡（滅

  亡）都有可能。至於最後沒有發展成如麥柯米所言的兩人死亡結局，亦有種聚散離分總是

  緣，曾經好過是緣分；如今分手也是緣分，實在不需要將場面搞得太難看，避免日後需要

  對方幫忙時尷尬的告誡，回頭看看英國與愛爾蘭不也如此？就算兩國曾因鬧分手發生爭執

  ，但幸好兩邊沒有撕破臉，迄今仍在英國享有某些特殊禮遇。



  《伊尼舍林的女妖》可以有很多種的看劇情角度，也可以得到不同種的觀影收穫，這是我

  很喜歡導演馬丁麥多納這次劇本的原因。而除了劇本之外，幾位主要演員的精湛演繹更是

  讓角色徹底活了過來，不論是何種組合搭配均能激盪出不小火花，尤其兩位靈魂人物、柯

  林法洛與布蘭登格里森的對手戲更令人目不轉睛，完全不想錯過任何一字一句。柯林法洛

  將派瑞這個角色詮釋的讓人討厭，卻也令人心疼不已，從他眉宇之間與眼神裡能看見從懷

  抱希望到陷入絕望的被「惡」所吞噬過程，情感表達看似直接笨拙，實則細膩充滿層次變

  化，無疑是他從影生涯最棒的一次演出，首度入圍奧斯卡就有很大機會順利稱帝。布蘭登

  格里森戲份雖然如同男主角，可確實放在男配角更具競爭力，無奈碰上幾乎無人能敵的關

  繼威，不然由他詮釋這樣子拼命絕情也貌似絕情，可實際上根本溫柔到不行的大漢康姆，

  同樣值得一座小金人肯定，特別是知道原來他就是《哈利波特》裡的瘋眼穆迪之後。


  不過整個《伊尼舍林的女妖》最讓人驚艷的還是飾演多明尼的貝瑞柯根，從《聖鹿之死》

  開始注意到他，到後來《敦克爾克大行動》、《永恆族》到《蝙蝠俠》，每次見到他都是

  不同的類型角色，但每次他都能帶給觀眾很深的印象，這次在《伊尼舍林的女妖》中的多

  明尼無疑是整部電影中最悲慘的角色，不論是他所承受的異樣眼光，或者是他毫無遮掩的

  真情告白，跟他最後的結局都給人不同於派瑞的心疼與心碎。這次跟著布蘭登格里森一同

  入圍最佳男配角，陪榜機率更高，但也讓人對他的未來發展更加期待。


  --'
