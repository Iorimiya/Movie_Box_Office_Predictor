url: https://www.ptt.cc/bbs/movie/M.1682600066.A.A6E.html
title: '[好雷] 伊尼舍林的女妖 堪比莎翁戲劇的傑出電影'
content: '雷文防雷資訊頁





  雷


  勒



  雷



  雷





  這部片很值得看，沒看過的強烈建議別被雷到!!





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  近期才看這部片，令人驚豔。


  這是我個人近期看到最好看的電影之一。



  電影評論的部分，因為之前許多版友已經有做了很多深刻的分析，此不贅述。


  我也參考了幾篇IMDB上的評論。



  雖然版上不少人提到電影很可能聯想或隱喻愛爾蘭過去的政治情況，


  但意外的是在IMDB上比較大的幾篇評論，卻都沒有從這個角度切入評論。





  這部片的劇情其實說起來可說是相當簡單，


  但是它關連到的主題，相當的多元，


  而且表現或者隱喻的方式，相當出色迷人。


  也有許多令人忍俊不禁的黑色幽默。




  隨著電影劇情的推移，


  會讓我感覺對人物的印象，逐漸的改變。


  比如說柯林法洛演的派瑞，


  剛開始覺得這個人很nice，很值得同情，


  但是越到後面會覺得他有時實在很蠢，蠢到有點渾蛋的地步。





  布蘭頓·葛利森飾演的康姆，則是一個很有個性的角色。


  剛開始你會覺得他根本有偏執的毛病，


  可是他除了面對派瑞顯得莫名冷酷之外，


  面對其他人卻是相當理性且有風度，


  而且即便他後來與派瑞斷交，


  但是他在關鍵時刻仍數次幫助他的昔日好友，


  體現一種哲學家康德說的「出於義務，而非情感」的去幫助他人。





  所以影片看到後來，會開始納悶或許康姆打好久以前就不太喜歡派瑞這個人，


  只是隱忍多年終於爆發，於是突然切割，而令派瑞感到莫名其妙。




  凱莉肯頓飾演的詩凡  和 貝瑞科漢飾演的多明尼克，也相當出色。


  凱莉肯頓就是集智慧、氣質、仁慈於一身沒啥好說，而且正翻了。



  多明尼克這個角色也演得很棒，看似笨拙卻其實有點大智若愚的感覺，


  尤其告白失敗那段，我看得目不轉睛，很逼真。





  柯林法洛演的角色可能是最出色的，有人評論說這是他最好的作品，我覺得無誤。


  他把這個集憨厚、傻呆、愚蠢、粗心、凡事不經大腦思考，


  卻又情感細膩的驢蛋，演得太好了，


  真的很難想像一個電影明星可以把明星光環刪光，把一個驢蛋演得維妙維肖，


  很經典的演出。





  我覺得這部片涉及了很多主題，人際情感的疏離、虛無主義、存在主義、


  人世間的荒謬，對於寂寞、空虛、時間的有限、坐困愁城的憂鬱等等的，


  在這部片當中透過影像以及人物的對話，來表達出來。




  一些評論不約而同的提到，這部電影很像一部戲劇(play)，而不只是電影。


  因為在一些故事線中，導演沒有給觀眾答案，而是留下許多想像空間，


  引發很強的令人深思的後勁。有些人將此視為缺點，有些人將此視為優點。




  比如說，康姆到底在不爽甚麼？ 不能用好一點的方式跟派瑞絕交嗎？


  有必要自殘嗎？ 他是有病嗎？還是有更合理的理由？


  多明尼克是怎麼死的？ (自殺嗎?)


  女巫這人是怎樣？


  派瑞和康姆之後會怎樣？


  以及，導演到底想表達什麼？





  導演沒有把更多的人物心路歷程描述出來，但是也讓這部片保有深深獨特的魅力。


  影片結束後把觀眾懸在那裡，讓我們自己去思考這些事件背後有何意涵。


  它讓這部片的後勁很強且富有想樣空間，


  而且人生確實許多事其實就像這部電影一樣，沒有甚麼明朗的答案。



  加上它的配樂，更是引人入勝。





  上一次看導演馬丁·麥多納的《意外》(三個告示牌)，便覺得相當驚艷。


  這次的《依尼舍林女妖》，仍然是相當精彩，有過之而無不及，


  相當有導演獨特的風格與魅力。


  若單從電影角度看，我覺得這部比《媽的多重宇宙》更聰明且出色，


  但是《媽的》無疑是更為大眾化的電影。



  總之，個人私心推薦這確實是一部不容錯過的好片。相當獨特的作品！！






  --


  奧茲：你可以吃一堆香蕉！

  芬利：哦，我懂了，就因為我是一隻猴子，所以我一定要喜歡香蕉！

  奧茲：你不喜歡香蕉嗎？

  芬利：別傻了！ 我當然喜歡香蕉，我可是一隻猴子！我只是不喜歡你的推論方式。


  --


  意外也是難以取代的傑出作品'
