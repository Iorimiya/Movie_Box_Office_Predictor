url: https://www.ptt.cc/bbs/movie/M.1675475535.A.3C2.html
title: '[好雷] 友誼與戰爭的荒謬喜劇：《伊尼舍林的女妖'
content: "本文涉及劇情，且具個人觀點，建議觀影後再讀。\n\n　　　　本片已上映第二週，有意者請把握本週時間。\n\n\n　　　　圖文網頁版：\n\n　　　　\n\
  \n\n　　　　預告片：\n\n　　　　\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\
  \n\n\n\n男性友誼與戰爭的荒謬喜劇：《伊尼舍林的女妖》\n\n\n\n　　電影《伊尼舍林的女妖》（The Banshees of Inisherin）去查過之後，\n\
  \n才知似乎是隱喻「愛爾蘭內戰」的寓言。但能令觀眾有所感觸的，應該還是\n\n導演馬丁．麥多納 （Martin McDonagh）如何設計劇情，去展現自大而偏執\n\
  \n的男性特質，導致對人生追求卻逃避責任的徒勞和自我評判的誤差等，將這\n\n些現代的議題放進歷史脈絡再與傳說結合，去呈現戰爭看似慎重且血腥，實\n\n則無聊至極的事實。\n\
  \n\n\n　　１９２３年４月１日已為愛爾蘭內戰末期（1922年6月28日－1923年5月\n\n24日），故事發生在一座偏遠、虛構的小島伊尼舍林，派瑞（柯林．法洛飾）\n\
  \n照例去尋找好友愛爾蘭民謠音樂家康姆（布蘭頓．葛利森飾）去酒吧，對方\n\n卻突然表示要跟他絕交。無法置信的派瑞一再確認，在伊尼舍林島上熟識他\n\n們的人也來勸阻，卻無法改變康姆的決心。絕交的理由原先是「不再喜歡你\n\
  \n了」，後來則透露因為身為小提琴手的他想要安靜獨處的時間創作音樂，\n\n「好心很快就被遺忘，但音樂（創作）卻能流傳久遠」，更直指派瑞是個無\n\n趣的人，「會花兩個小時述說他在驢子大便裡發現什麼」，「我只想求內心\n\
  \n的一點平靜」。被這樣批評的派瑞更無法接受，向周遭徵詢時親友也站在他\n\n那邊，他的姐姐詩凡（凱瑞．康頓飾）附和認同康姆可能是「得到憂鬱症」。\n\n\n\n\
  　　無法認同的派瑞一再試圖「恢復友誼」，使康姆放話若再打擾，一次他\n\n就剪斷自己的一根手指。但當派瑞泄漏祕密被島上唯一的警察彼得（蓋瑞．\n\n萊登飾）打傷，在旁看到的康姆拉他上車，為他趕車，在路口下車兩人分道\n\
  \n揚鑣的身影，像在預示人生歧路眾多，總會來到友誼無法持續下去的岔道，\n\n那一刻，我以為兩人都有了「我不恨你，但也不想再跟你同行」的默契。\n\n\n\n\
  　　意外的是，這個確知不是愚人節玩笑的決定，卻有了猶如黑色喜劇的走\n\n向。\n\n\n\n\n\n\n\n\n　　派瑞再次徵求他人的意見。而他另一個「朋友」，被全鎮視為第一無趣\n\
  \n的笨蛋多明尼（貝瑞．科漢飾），勸他要「堅定信念」：「也許他只是需要\n\n你用別的方式對待他。」當下派瑞認同的表情，接下來在康姆家粗暴的動作，\n\n都令人膽寒，卻又有種即將實現的預感：\n\
  \n\n\n　　是了，派瑞這樣的「好人」，終究會去嘗試：拉小提琴、決心要投入藝\n\n術創作的康姆會不會如同誓言，剪下他的手指。\n\n\n\n　　於是派瑞得到了康姆扔到門上的食指，他還鄭重的從泥土取起，放進鞋\n\
  \n盒裡，「我怎麼能讓他的手指沾上泥土？」\n\n\n\n　　如果我在現場，大概會跟詩凡一樣尖叫──難怪康姆要用這種方式來跟\n\n派瑞「分手」：面對一個愚蠢、無趣、固執、寂寞而對此一無所知，自以為\n\
  \n樂天開朗是好心與美德的驢男（對所有的感情、心理、思想的運作全都嗤之\n\n以鼻，只會用自己的角度去看事情），不這麼絕決，他就不會當回事。\n\n\n\n　　還是詩凡比較聰明不是嗎？順從他、安撫他，附和他，適當的時候把他\n\
  \n趕去朋友那裡，換取想要的平靜與閱讀的時間──派瑞畢竟是自己的弟弟。\n\n只要有那樣的空間，她可以拿出所有的耐心與愛和他對自己的尊重與愛，去\n\n忍受他在身邊如一頭蠢驢──現在因為康姆，她可能要減少獨處的時間了。\n\
  \n連同弟弟受到的傷害，她怒氣沖沖的去問罪，對康姆的實話卻一句都無法反\n\n駁，只能回應：「你們都很無趣。」確實，想跟派瑞這種蠢驢相處，要嘛必\n\n須跟他一樣蠢與無趣，要嘛不必長時間，要嘛就得用全部的好心去容忍。所\n\
  \n以當派瑞在酒吧裡跟康姆爭辯「我的爸爸、媽媽以及姐姐都很好心，我會記\n\n住他們」時，我幾乎大笑：他應該毫無察覺，跟他長時間相處、聽他抱怨需\n\n要多少的好心。\n\
  \n\n\n　　派瑞當然不會理解。自此，鎮民都轉為勸阻派瑞不要再打擾康姆，使得\n\n派瑞將恢復友誼的努力，逐漸轉變成無明的怒氣。他甚至欺騙康姆的朋友\n\n\
  「你的母親被牛奶車撞到」讓他離島，只因他嫉妒康姆與對方交流音樂、談\n\n笑風生。他的一再進逼，使原本稍有軟化的康姆聞知此事後，最終一口氣把\n\n左手的手指全部剪下，扔向派瑞的家門，卻意外使派瑞寵愛的小驢子珍妮誤\n\
  \n食咽死──當熱愛閱讀的詩凡在本島找到圖書館員的工作得以離開後，只剩\n\n珍妮能寄託依賴與情感的驢男派瑞，終於被其拒絕理解的寂寞和男性向來熟\n\n悉的憤怒包圍而瘋狂，聲稱要燒掉康姆的房子作為報復。當他放火前雖然帶\n\
  \n走了康姆的狗薩米，但看到康姆坐在裡面仍不改初衷。最終房子燒毀，康姆\n\n離開屋子未被燒死，對派瑞說他們之間的一切用房子一筆勾銷，派瑞說他們\n\n沒有完，「維持這樣的恨意應該也不錯」。\n\
  \n\n\n　　派瑞沒有目標的人生，就這樣用「好心」鋪向了地獄。蠢與無趣如果同\n\n義，和派瑞近似的還有多明尼，詩凡在說鎮上「無趣第一名」是多明尼之後，\n\n\
  在派瑞面前的欲言又止轉移話題的答案顯而易見。只是派瑞還有姐姐、珍妮\n\n（牠無法也無能拒絕），以前有康姆，多明尼只有會猥褻他、對他暴力相向\n\n的父親，鎮民的嘲笑、帶有輕視的招待──然而有些人是僅有好心也無法相\n\
  \n處的。多明尼對詩凡的赤裸示愛，除了自己的欲求，對他人的細微感知毫無\n\n判斷與理解能力──想來這是父親待他的複製，但沒有人能靠好心去忍受這\n\n種騷擾，儘管詩凡善良懂得應對，卻無法跟他們相處超過太長的時間，甚至\n\
  \n不願意招待多明尼住超過一個晚上，遑論接受求婚。所幸受盡傷害的多明尼\n\n比派瑞善良，懂得不去傷害他人，也懂得別人的委婉仍是拒絕。因此在河邊\n\n的對話，其實非常悲傷：一個寂寞，一個溫柔，人生卻毫無交集的可能──\n\
  \n詩凡不需要去當聖母，去承擔多明尼的悲劇；康姆也沒有義務，去花時間承\n\n擔派瑞的愚蠢。最終多明尼失足溺死（或實則自殺）的冰冷，與派瑞的孤獨\n\n相似，卻又與後者化為仇恨放火抒發形成對比。\n\
  \n\n\n　　倘若沒有麥科米太太看見預言、冷眼旁觀的智慧，倘若沒有詩凡的聰敏\n\n自省、把握機會即時離開的行動力，待在那座島上，再「好」不過派瑞與多\n\n\
  明尼。\n\n\n\n\n\n\n\n\n\n　　「找點事做，延續死亡的到來。」\n\n\n\n　　伊尼舍林是這樣與世隔絕的小島：悠閒、封閉，毫無目標、只能打發時\n\
  \n間的活著。生活就是八卦、閒扯、挖掘他人祕密、彰顯自己的權威，在別人\n\n身上找樂子，還有「好心」，卻對真正需要協助的人視而不見。已過中年的\n\n康姆自稱想要把握時間留下有意義的作品，而創作必須獨處與思考的空間──\n\
  \n一般人應該都能理解，即使是派瑞這樣的蠢驢，如果不是多明尼的鼓勵和建\n\n議，他應該就能學會避開康姆。只是為什麼康姆非得剪手指？一個在意創作\n\n的人，怎麼會用這樣同時傷害創作與自己的方式來表達意志？\n\
  \n\n\n　　從詩凡糾正他莫札特的年代是十八而非十九世紀，以及「同樣無趣」的\n\n評價來看，康姆的才華顯然並不特出，能與派瑞成為好友未必只是好心。雖\n\n\
  然熱愛創作與才華並無絕對關聯，長時間的耕耘依然可以從創作中得到樂趣\n\n和自我實現，即使他想要的是能「流傳後世」的不朽──但這仍然與剪手指\n\n的行動背道而馳。\n\
  \n\n\n　　無論是派瑞的「進逼求和」或康姆的「遵守諾言」，顯然都與不捨情誼\n\n或追求理想無關，而是執著，是各自固執己見的對壘，試圖從這種對峙中分\n\n\
  出勝負。派瑞真的關心康姆是否得到憂鬱症嗎？沒有，他只是想證明他是對\n\n的，證明有問題的是康姆，至於憂鬱症的絕望痛苦與反覆掙扎想來他永遠不\n\n會也無法理解，可能還會「開朗樂天」地說：「出來跟我喝酒、聊聊天就會\n\
  \n好了。」康姆真的想要好好創作嗎？是的，但他要的是「非凡成就」，無法\n\n忍受自己實則無趣平庸，他最終寫出了一曲〈伊尼舍林的女妖〉，雖說想要\n\n平靜，但報喪女妖的不祥意涵又怎麼不會記錄對峙的過程？他想向派瑞證明\n\
  \n自己會實現諾言與分手的決心，比創作及為彼此造成什麼傷害更重要，畢竟\n\n如果剪了手指，從此被藝術摒除就是派瑞的責任；況且這種對峙能為如死水\n\n的生活帶來靈感與刺激，即使為此失去手指亦在所不惜，若創造了不朽，是\n\
  \n自己「獻身藝術」的成就，怎樣他都不虧。\n\n\n\n　　隨著劇情雖能理解康姆想跟派瑞分手的理由，卻不免疑惑為何至今日才\n\n忽然中斷，看似相異的兩個人如何能成為朋友？但細思就會明瞭，除了康姆\n\
  \n不肯承認的、與派瑞相同的庸俗無趣，以及對派瑞的蠢居高臨下、俯視的優\n\n越感之外，派瑞能長時間向康姆叨絮生活瑣事，亦使他感受到自己成為被關\n\n注的中心──過去的「摯友」關係由此得到平衡，而固執是彼此最大的相似\n\
  \n之處，兩人都只在乎自己的感受：派瑞無視自己的任何缺失，拒絕面對「開\n\n朗樂天」背後的粗疏自大只會徒增他人困擾，所謂的「好心」如果失之體貼，\n\n就常因對方的容忍與配合才會延續自我感覺良好。更可怕的是，派瑞完全守\n\
  \n不住祕密，一旦情緒激動或喝酒就會吐露。而康姆表面承擔、實則欣賞這種\n\n蠢驢似的固執──所以派瑞酒醉拿下「好人」的面貌，毫無掩飾地對他大吼\n\n大叫時，他說：「我又喜歡他了。」\n\
  \n\n\n　　如此需要時刻餵養、膨脹的自我形象、自我中心的極大化，就是多明尼\n\n的父親彼得。這個只會施暴、威脅與猥褻的警察，在這個島上有無人可以違\n\n\
  抗的權威，而且永遠不吝於施展。康姆不會拒絕他的接近和付錢喝酒的要求，\n\n也不會對他剪手指；派瑞即使被痛揍，也不會去燒他的房子──因為他不在\n\n乎，還會加倍報復。而這個人管的閒事，包括對詩凡說：\n\
  \n\n\n　　「難怪沒人喜歡你。」\n\n\n\n　　被這樣的（男）人「喜歡」等同任其宰割，敬謝不敏。但對詩凡仍足以\n\n造成傷害──這裡沒有隱私，也就難有足夠的尊嚴。她拒絕當男人放大自我\n\
  \n的鏡子，拒絕為了被愛或逃避寂寞而選擇一個她根本無法相處的人──拒絕\n\n當一個傳統意義、襯托男性的「好女人」（或許弟弟是例外）。她理解寂寞，\n\n但在這座島上找不到能彼此理解的對象，或證明自我的事（她打算去本島就\n\
  \n職，她親愛的弟弟擔心的是「我的生活怎麼辦」、「誰給我弄吃的」）──\n\n或許還有麥科米太太，但她是女巫、死亡的預言者，不是對等的朋友。\n\n\n\n　　總結來看，派瑞的「好心」，包括一時氣憤吐露多明尼的祕密，包括招\n\
  \n惹康姆剪下手指，包括用放話／火燒房子，來轉移實則是他的固執愚蠢害死\n\n珍妮的事實；康姆的絕決固執無論是剪斷手指扔向房門、以及將切去指頭帶\n\n血的手露出來的舉動，都既是昭示「你別想反抗我」的決心，也是轉移自己\n\
  \n同樣平庸無趣的事實，同樣都只帶來負面情緒、誤食即死。這兩個男人之間\n\n的戰爭，實則皆以自我為關注焦點、單方面的情感發洩：對派瑞來說，這種\n\n「友誼」是真實可靠的人際關係，否決關係就是否決他的存在價值；對康姆\n\
  \n而言，斷絕這種毫無益處的關係是穩賺不賠，畢竟他關注的也僅於自身──\n\n雖然這可能跟他必須面對絕望感有關。他們都不會在乎對方真正的感受，僅\n\n是希望找到把自己當中心、認同自己的人，這份父權文化塑造下共通的固執，\n\
  \n使他們亢奮地進入熟悉的、輸贏的世界，進而創造了兩人的地獄。\n\n\n\n\n\n\n\n\n\n　　當康姆說「一筆勾銷」時，派瑞說：「有些事還是無法釋懷，我想那是\n\
  \n好事。」\n\n\n\n　　是的，他們的生活再也不會無聊了。就讓他們糾纏到死吧，這樣互相報\n\n復既有目標，感受到自己支配的力量，造成的惡果更有恨來支撐自己持續下\n\
  \n去，簡直就是完美結局，就在那座島上不要放生彼此，謝天謝地。然而擴大\n\n來想，若這是戰爭的隱喻，外界的苦難無法影響他們的執著與恨，那是全世\n\n界最重要的事；或者如彼得這種荒誕而又真實的、不在乎處決的戰犯是何立\n\
  \n場、一頓飯及幾便士的利益就是處決的條件──與現實對照該有多諷刺，也\n\n值得一笑。\n\n\n\n　　慶幸電影裡還有詩凡，而她順利逃出了這座島。這是我觀影結束後最慶\n\
  \n幸的事。\n\n\n\n　　但願我們都有如此的幸運。\n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\
  \n                                  陳斐雯  貓蚤札（其三）\n\n--\n\n　　謝謝。:)\n\n\n　　謝謝提醒，我記得派瑞原先是說母親，戴克倫說母親早逝，才改口說是父親。\n\
  \n　　這樣拙劣的謊言，戴克倫還相信了，讓我想到以前接到家人綁票詐騙電話的經驗。\n\n　　派瑞真的是好人，還說他回家發現事實就沒事了，讓多明尼主動離開他。"
