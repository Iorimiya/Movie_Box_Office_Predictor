title: '[好雷] 伊尼舍林的女妖'
content: "1. 我抱著錯誤期待去看這部片\n   因為我原本以為後面會轉為奇幻故事\n   會有什麼女妖跑出來挽救兩人的友誼\n   很遺憾的, 並沒有\n\
  \n2. 跟上一部意外一樣\n   我看完當下在想主軸就是一群好人卻不斷傷害彼此的故事\n   不過更遺憾的是這次片子好沈重\n   導演的前三部作品看完時我心裡都喊:\n\
