title: '[新聞] 【GIVEN：去海邊】台灣領先海外最速上映'
content: '新聞網址：



  台灣動漫迷爭相傳頌的「這本BL不得了！」話題之作《GIVEN被贈與的未來劇場版：去海

  邊》，即將在4月2日（三）於台灣珍愛獻映。這部感人肺腑的超人氣神作，這回將邁向最

  終完結篇，更是讓影迷引頸期盼，也讓本片一上映，就勇奪日本最大影視口碑網站「

  Filmarks」的「初日滿足度」冠軍。日本票房更大破三億日元（約新台幣6240萬元），刷

  新系列作品的影史最高票房紀錄，甚至還連續七週稱霸獨立戲院票房排行，展現火熱氣勢

  。值得一提的是，本片同樣在台灣擁有廣大粉絲，經過台灣發行商「采昌國際多媒體」的

  長時間努力爭取之下，也讓台灣確定成為本片在海外第一個最速上映的地區，台灣影迷也

  得以在第一時間，領先其他地區的觀眾，進戲院搶看到這部人氣完結篇。此外，日前訪台

  開唱的人氣歌手Centimillimental，也搬出九年前所創作的壓箱寶〈結言〉，成為本片主

  題曲。他透露當時遇到非常重要的人，也不免意識到總有一天會必須面對離別，成為本曲

  的創作理念，跟本片情感為之相通，也讓他對粉絲掛保證：「我相信對大家的人生來說，

  這會是一部非常重要的作品。」





  《GIVEN 被贈與的未來》是日本漫畫家Natsuki Kizu最具代表性的漫畫作品，以搖滾樂團

  為故事主軸，結合音樂、校園、愛情與BL元素，打造讓讀者動容又難以忘懷的青春群像；

  尤其角色們唱出追尋夢想與愛情的酸甜苦辣，也被日本媒體譽為「讓人為之揪心的傑作！

  」漫畫在2013年於BL雙月刊《Cheri+》春季號開始連載之後，便獲得廣大讀者的好評回饋

  ，更曾在2020年的「這本BL不得了！」當中榜上有名，甚至在國外知名動漫排行榜「

  Anime Trending」上，以男男CP登上情侶排行榜冠軍。漫畫當中，Natsuki Kizu老師潔淨

  優美的線條筆觸，讓人物透過表情與台詞，將彼此的細膩情感醞釀得十分到位，分鏡畫面

  更如電影般充滿張力，輔以豐富的故事層次、讓人反覆玩味的台詞，還有精心設計的人物

  情感相呼應，都讓人再三玩味，甚至隨著劇情發展忍不住潸然淚下。雖然內容涵蓋BL元素

  ，但BL只是輔助，也因此吸引到不看BL的讀者好奇閱讀，一看便入坑成為粉絲。



  隨著漫畫的成功，本作接連推出廣播劇CD、電視動畫，更在2020年推出電影劇場版，甚至

  是真人電視劇。適逢漫畫在2023年9月1日發行最終集，製作團隊也在2024年推出《GIVEN

  被贈與的未來劇場版：柊mix》，找來《身為女主角！～被討厭的女主角與秘密的工作～

  》導演橋本能理子執導，她也曾擔任過本作電視動畫版第10話的演出與分鏡。此外，原班

  聲優陣容再度集結，並以漫畫中的超人氣角色「柊」為劇情核心展開。之後更在同年推出

  集結原班製作人馬的續作《GIVEN被贈與的未來劇場版：去海邊》。兩部作品同樣都有細

  膩的人物情感刻畫、令人玩味的台詞、充滿細節考究與意境的精緻作畫風格；在認真的情

  節發展之餘，也有讓人會心一笑的逗趣橋段，適度調劑觀眾們的情緒。尤其《GIVEN被贈

  與的未來劇場版：去海邊》更是整個系列的完結篇，也讓本片一上映，便榮登日本最大電

  影、電視劇、動畫評論網站「Filmarks」的「初日滿足度」冠軍，日本票房更大破3億日

  元（約新台幣6240萬元），強勢成為本系列作品的影史最高票房之作，更連續七週稱霸獨

  立戲院票房排行榜，展現上映戲院不減反增的火熱氣勢，絕對是粉絲們的必看之作！





  值得一提的是，本片主題曲〈結言〉，請來甫於日前訪台開唱的人氣歌手

  Centimillimental擔綱演唱，尤其Centimillimental是以包辦作詞、作曲、演唱於一身的

  溫詞，以他為主的個人企劃，透過豐富的曲風與饒富情感的歌詞，唱出了青春與成長的酸

  甜苦辣。他也在日前的台灣演場會上，演唱多首《GIVEN被贈與的未來》歌曲，讓粉絲聽

  得如癡如醉。對於一路陪伴著本系列作品，來到了這次的最終章，他也感到非常高興。尤

  其這回的主題曲〈結言〉，是他早在九年前就創作的歌曲，他對此透露：「我當時遇到了

  非常重要的人，那次的相遇讓我意識到，總有一天會必須面對離別，讓我想如果能透過音

  樂，將這份感情給留下來，就能讓它成為永恆，於是創作了這首歌。在這個情況下遇到了

  這部作品，讓我覺得作品的主題跟我這份情感是相通的，所以我主動提議能否使用這首歌

  曲，直到最後確定被採用為主題曲。」尤其將本片視為人生最重要作品的他，也向粉絲掛

  保證：「我相信這對大家的人生來說，也會是一部非常重要的作品，希望大家可以反覆觀

  賞，並享受其中的樂趣。」



  這部集結青春、樂團與BL元素，台灣動漫迷爭相傳頌「這本BL不得了！」的話題之作《

  GIVEN被贈與的未來劇場版：去海邊》，即將在4月2日（三）於台灣珍愛獻映。本片劇情

  描述由佐藤真冬（矢野獎吾配音）、上山立夏（内田雄馬配音）、中山春樹（中澤匡智配

  音）、梶秋彥（江口拓也配音）組成的搖滾樂團「GIVEN」，雖然在音樂競賽中落敗，卻

  仍收到唱片公司的出道邀請。當成員們都對出道充滿積極態度的情況下，真冬卻遲遲無法

  給出回應。另一方面，短暫加入鹿島柊（今井文也配音）與八木玄純（坂泰斗配音）所屬

  樂團「syh」，並在其中擔任支援吉他手的立夏，正努力完成柊託付給他的某首曲子。某

  天，立夏接到真冬的電話，趕來真冬身邊，卻發現他對音樂產生抗拒。真冬在對立夏的思

  念，以及自己對音樂的情感中感到迷茫而停下腳步。面對這樣的真冬，世界知名的小提琴

  家村田雨月（淺沼晉太郎配音）找上了他…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
