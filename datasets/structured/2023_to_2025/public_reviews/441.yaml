title: '[好無雷] GIVEN〈去海邊〉完結恭喜'
content: '應該沒有劇情雷(微雷?)，但有片中歌曲的詞曲雷

  然後建議觀影前要看過動畫卡通及前面的劇場版

  再不然也要看過原作漫畫，不然應該看不懂這集



  ~~~以下正文~~~




  上週五工作告一段落，就直奔電影院首刷《Given》完結篇下集，接下來一整週重看卡通

  11集+OVA動畫+劇場版兩集，然後又馬上二刷電影。首刷時也許是期待心情大於一切(畢竟

  等上映等了整整一年)，所以只覺得電影&歌曲比我預期好太多太多，結果回溯完整套動畫

  作品再二刷時，情緒累積到片尾主題曲響起，沒想到我直接邊聽歌邊看歌詞邊哭爆XD



  首刷時會認為〈結言〉這首主題曲是由紀對真冬說的心聲：就算經歷生離死別也不要忘記

  我、只要你別忘記我就不會消失；但二刷時卻覺得也是作者及製作團隊藉由這首歌在向粉

  絲道別啊：總有一天我會消失但能與你相遇太好了、謝謝你我最喜歡你了。帶入這些情緒

  後怎能不哭爆啊嗚嗚嗚QQ



  對我而言這部作品最吸引人的果然還是這些角色對音樂的愛恨情仇，以及在個人與他人關

  係之間各種痛苦掙扎撫慰進而療癒等情感交流，有沒有BL成份根本不重要，他們只是愛上

  的人剛好與自己同性別而已。感謝原作刺傷老師刻劃出這麼深厚情感的漫畫、也感謝動畫

  製作組沒有毀滅原作反而讓動畫版更升級；最要感謝的還有創作出所有詞曲的温詞，畢竟

  這部作品最重要的要素就是「音樂」本身，音樂糟糕的話動畫版也等於毀了，但温詞卻能

  掌握住原作劇情意義，替每個角色傳達出他們的心聲。



  例如最終章最重要的〈去海邊〉這首歌，原作只提到是由紀為真冬創作的demo但詞曲未寫

  完就死去，而完全不認識由紀的立夏卻能從demo側面瞭解由紀這個人並接手完成歌曲，温

  詞的做法就是把真冬常在哼唱的旋律寫進A段裡，最後一聲則是最開始真冬被立夏隨手刷

  的吉他聲響打動的那個和旋。這些巧思我聽到時真的心臟都快爆炸了！



  這部動畫每一首歌不論詞曲都超棒超棒超棒！大部份時間我看動漫都是屬於原作黨，但老

  實說我會更喜歡《Given》的動畫全因為這些歌曲啊～先是漫畫完結接著動畫也完結，隨

  著〈結言〉最後一句在戲院裡響起，粉絲也要跟這部作品告別了，但就像住在音樂裡不會

  被真冬忘記的由紀，「只要不要忘記這首歌，我們就會一直在一起」，我們一定不會忘記

  這部好作品的，完結恭喜♡




  --'
