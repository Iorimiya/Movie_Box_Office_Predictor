url: https://www.ptt.cc/bbs/movie/M.1560380290.A.FA1.html
title: '[好雷] #自拍人生 #Selfie 指考前先去海邊'
content: '這是 Netflix上找到的羅馬尼亞 YA 片，是羅馬尼亞美女導演 Cristina Iacob 的長片首作。西方YA片最多的當然是好萊塢，英德法也有不少不過往往稍嚴肅些、西班牙義大利產量稍少不過也是有些媲美好萊塢作品、倒是羅馬尼亞以及其他東歐國家好像向來和「YA片」甚至「喜劇片」這些青春快樂的印象無法聯想在一起？這部《
  #自拍人生》我覺得製作水準是有個好萊塢的架勢，但也是有自己獨樹一格的故事與說故事方式，並沒要照抄好萊塢模板，於是 2014 年在羅馬尼亞上映時從一眾好萊塢大片間殺出血路取得大成功！尤其受到青少年觀眾的支持與認同。




  YA片就要有帥哥美女、派對歌舞、陽光沙灘、喝酒嗑藥、蹺課逃學、禁忌戀情、青澀焦慮、友情長存等等基本元素，一般來說要看這些看好萊塢就很夠，但看過編導 Cristian
  Iacob 的訪談後我有點感動，而決定也瞧瞧這羅馬尼亞片會怎麼拍：


  Iacob 首先感謝歐美多國歷次來到羅馬尼亞拍片，讓本土各技術部門專業愈趨茁壯；其次提到她自己也曾嚮往倫敦巴黎紐約這些電影都會，自己也赴倫敦留學一遭；然後她相信電影可在任何地方製作訴說地方故事，羅馬尼亞環境也已成熟；最後她指出羅馬尼亞片多半是藝術片、後共產主題、年年打入歐洲三大影展不成問題，但揮別憂鬱擁抱陽光的商業喜劇仍如鳳毛麟角。她就要從這部《
  #自拍人生》開始為羅馬尼亞商業片殺出條血路。


  首先視覺上，此片是五彩繽紛的，不論是夜間舞會的紅男綠女、派對的火樹銀花、街頭的遊人衣著、海灘的萬國旗幟、商店街的招牌擺設、節慶時的氣球彩帶等等，頗有一種就是要讓羅馬尼亞亮麗起來的感覺！然後劇情呈現上，以三個女高中生的海灘瘋狂之旅為主軸，從頭到尾都是一場場放浪形骸串接起來，並不想多花時間嚴肅地談心談人生、只會用傻氣喜劇呈現角色人格與夢想、就算要談心也一定是花前月下男女調情...
  整個有一種深度閃邊去、娛樂最重要的暢快感，難怪羅馬尼亞青少年觀眾這麼愛！




  也許，編導 Iacob努力想從陰鬱的羅馬尼亞電影風景中打開一條歡樂道路的意識，就投射在此片各個層面的成果上。除了多彩視覺與喜劇調性外，這YA劇情主軸也關於傳統的陰鬱與新時代的希望，讓YA電影中的「世代和解」主題談出了一個羅馬尼亞版本。三位布加勒斯的高中女主角，各自代言一種傳統束縛與掙脫的渴望：三人中的辣妹
  Yasmin 的束縛是傳統的「女孩要檢點」，但她有趴必開有酒必喝有舞必跳，真叛逆的是她還勾搭上了歷史老師，更嚴重的是不只叛逆她還認真要和歷史老師長久在一起，老師家長乃至同儕能接受？還有得爭取。


  三人的渴望與掙扎多少都有父輩陰影，譬如Yasmin吃歷史老師，恐怕出於父母在羅馬尼亞後共產時代拼經濟忙賺錢把她擱一旁，自己率性叛逆下的潛意識裡很需要可靠的人從旁抱住她打醒她。三人中的胖妹
  Roxi 則很在乎自己外表與身材、很在乎旁人眼光、會焦慮地節食又暴食，這和她出身單親家庭母親懷了孕就被拋棄的陰影大有關係，令她成為本片這「 #自拍人生」少年焦慮的最佳代言人。擴大說來，也不只Roxi，每個少年角色都有那麼一個傳統老羅馬尼亞社會抱著上代焦慮期待她們變成的樣子，等著她們叛逆一回後告訴爸媽放心吧，兒孫自有兒孫福、新時代有新希望。


  三人中比較走在正道上的乖乖女 Ana，則最有主角格代言這個世代衝突。她家有個最傳統嚴格的老爸，她功課最好有機會申請到美國名校，她是才女會樂器又會唱歌，一切都在最正典的道路上；但在畢業典禮後這個週末姐妹們要飆去海灘度週末、還有她最喜歡的樂團與DJ，就算老爸管得死死地，但為了夢想與友情還能不去嗎？更糟的是：這週末過完的下週一，就是羅馬尼亞高中畢業會考
  Bacalaureat/Bac，那週末去海邊簡直就像我們台灣的 聯考/指考前先去墾丁玩！多少人這樣幻想過？恐怕很多，但多少真做過？本片就代考生做一回。




  乖乖女 Ana的虎爸，則另開了一條支線來談羅馬尼亞的傳統心結，編導小心翼翼地讓這線不掃少男少女們夏日海灘玩水調情的興致，而讓家長們自己來一場少年的自況，感嘆羅馬尼亞什麼時候變了一個國家、然後轉念一想這樣的改變又有什麼不好呢？羅馬尼亞，過去在
  1989 年前都是強人希奧賽古的時代，雖然他們是共產陣營史達林式體制，但和我們 1988 年前的兩蔣這反共的威權體制也沒什麼大不同，台灣觀眾看了也許在一定程度上能感同身受。


  正如我們至今不上不下的台灣還有人在懷念兩蔣時代的穩定，今日民主走資的羅馬尼亞也有人在懷念希奧賽古時代的穩定，本片 Ana老爸甚至還珍藏了一台號稱希奧賽古搭過的古董巴士、帶著另一位家長要來海灘追女兒！身為國家中代表舊建制穩定生活豐衣足食的軍公教，Ana
  老爸很糾結著「高中會考」這穩定的象徵；只是他帶來的另一個家長 Roxi 媽，倒是早就被排除在舊建制的穩定之外一路自力更生的棄子，連媽媽都帶著笑容掙扎存活到了今天，難道新一代的女兒就做不到嗎？


  電影在青春傻氣的海灘週末後，少女與少男們該犯的錯都犯了、該闖的禍都闖了、該搞砸的都搞砸了、該爆發的都爆發了... 不論是整個少年世代還是羅馬尼亞尚年輕的後共產時代，都帶著滿腔壓抑橫衝直撞走了這一遭，那當這些少年週末過完終要拾回現實生活時，舊世代長輩人人都仍會幫推一把。片尾的感性高潮，在爸爸開大巴趕在最後一刻送少年們回考場，認識的與不認識的長輩都來幫忙推車了、有恩愛有仇恨的長輩也各自令人驚訝地出力支持了。海灘電影的片尾仍結束在會考現場振筆疾書，只是經過一次人際與世代間的仇怨發洩與和解後，面對未來的心已煥然一新。




  是呀，這個時代的羅馬尼亞高中會考再也不能保障什麼、正如我們台灣的指考也再也不能保障什麼，少年們如本片主角們想做藝術的、想做火箭的、想當記者的，不管會考考得好壞未來都還是一條坎坷路、沒人能再承諾夢想的實現、只有自己能確認己心踏在夢想道路上。此片有如同聯考的會考、有如同墾丁的海灘、有如同兩蔣的希奧賽古幽靈、有如同台灣軍公教的鐵飯碗想像、更有如同台灣今日的世代衝突...
  但它還有如同台灣平溪的天燈、在這前途未卜的時代傳遞我們的夢想：不論升學就業的前途怎麼樣，大家一定要友情長存！


  《 #自拍人生》這青春傻氣的一片，成長議題從不直談，但把意象丟出來誰都懂！推薦台灣觀眾在 Netflix上欣賞，看看與我們似曾相識的遠方羅馬尼亞、回頭看看自己一路走來的讀書考試升學就業，也許心情會豁然開朗起來？羅馬尼亞片，真要我回想一部快樂的喜劇還真想不起來，他們的年輕人高中會考電影我也只想得到慘淡至極的《畢業風暴》XD
  這位快樂多彩的美女導演 Cristina Iacob真令人期待呀。



  --'
