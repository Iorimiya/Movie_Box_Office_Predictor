title: '[問片] (有結局雷)一部家庭去海邊露營的恐怖片'
content: '記得2013或14年和別人租片一起看的


  劇情大概是一家人去海邊或湖邊露營附近都是森林，然後有一隻奇怪的魚擱淺到岸上而且

  每過一天他就會往帳篷移動一點。


  然後他們在一座湖裡面看到有其他人自殺的屍體（？


  然後他們發現之前好像也有一個家庭（或是一群人）在那邊自殺


  結局好像是女主人逃到一個馬路上然後被車撞死大爆血


  目前記憶裡只記得這樣而已希望能知道是什麼電影感謝！


  --

  就是這部！非常感謝！！

  已改 感謝'
