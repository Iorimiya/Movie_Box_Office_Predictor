title: '[好雷] 突然想去海邊《消失的情人節》 '
content: '突然想去海邊。



  有時候我會花很久的路程獨自去一片海岸，待了一回兒，曬陽光看海浪、吹著風聞著其中

  的鹽味，如果很孤獨的時候，好像那裡是一個秘密基地。我們可以脫下腳上的鞋子踏著炙

  熱的沙與來臨的海，或著拿起一旁的枯樹枝還有貝殼裝起一面旗幟，還有些小石子或者遠

  方的天際線。我覺得自己平凡的很渺小，當我開著公車穿越車水馬龍的城市時候，大家都

  好匆忙，和我緩慢了一拍的時間一點都不一樣。覺得辛苦，但喜歡上了你之後覺得活著卻

  很好，因為期待著有一天你會記得那個信箱裡頭有我們的記憶。



  我坐在海邊，在無所事事中獲得了一種愉悅，就像我心中始終掛念著偷偷見著你的那一刻

  。那短短的幾分鐘，我們沒有交談、我們沒有接觸，你忘了我的名字，只記得我是個怪胎

  每天用口水黏上郵票，但你還記得我或許就好了，因為我真的很喜歡你，無論這個世界是

  什麼樣子，我想帶妳去那一片海、我想和你一起拍張照。我們用攝影機觀拍下了瞬間了某

  刻永恆，如果我和也有那一刻永恆，那麼即便我們的時間軸僅交會在那一個莫名的平衡情

  人節也罷。



  你覺得自己不夠好，容易花癡的陷入熱戀（但其實未必他也一樣那麼愛你），你覺得房間

  很小、夜晚很長，廣播裡的聲音是陪伴城市例行日子的另一種分享過程。但你愛自己嗎？

  你知道你其實也是很好的嗎？或許也有人正同樣害怕的不敢好好愛你嗎？



  妳忘不了弄丟的父親，就像那把忘了什麼用處的鑰匙。其實我們根本不可能真正遺忘發生

  過的事情，只是暫時想不起來罷了。習慣的工作業務還有過快的節奏，生活走得太快，沒

  有人跟著上妳。直到世界都停止了那一天，緩慢的我終於追上了妳。



  這是一場很詭異的約會。我們總說談戀愛就是在創造回憶，你的回憶有我、我的回憶有你

  ，我們彼此一起生活向前走過了最好不過。但如果對方根本沒把你看得那麼重要呢？你該

  怎麼面對，難道你就沒有資格愛一個人或是好好覺得自己擁有秘密基地的海岸嗎？我寫了

  很多封信後放手了這段詭異停滯與消失日子的生活意義。我覺得我的回憶有你就夠了，也

  滿足了。



  但忘記的事情並沒有真的消失，你也決定一個人去找一片海岸，試著找尋那些無所事事愉

  悅的時刻。只要你有心試著放慢一些看看這個世界，那一個神秘的鎖頭其實就是打開了一

  段你過得太快的日子裡差點忘記的事情。



  一封八元的信件很便宜，但裡面得字很重；多了幾張照片的信件變得重了一點，但我把看

  見的摯愛分享了出去。我說了「再見」，你知道再見是什麼意思嗎？請你一起到那個海邊

  找到我們消失的情人節裡度過的情人節，那是真的存在的一切。我很喜歡你，雖然我可能

  說出口的時候你沒有聽見。



  你要好好愛自己，因為有人真的很愛你。


  --





  --'
