title: '[新聞] 【GIVEN：去海邊】首週好康特典有看有拿'
content: '新聞網址：



  台灣動漫迷爭相傳頌「這本BL不得了！」的話題之作《GIVEN被贈與的未來劇場版：去海

  邊》，即將在明日（4/2）於台灣珍愛獻映，台灣更搶得先機，成為本片在海外第一個最

  速上映的地區，戲院排映廳數更是刷新系列新高，提供粉絲更多元的觀賞選擇。值得一提

  的是，台灣片商選在上週末舉辦四場「前後篇連映特別場」，不僅戲院出現超長排隊人龍

  ，票券更在第一時間搶購一空，搶先觀賞的粉絲直呼感動，甚至在觀賞過程中數度感動熱

  淚。為了回饋粉絲熱烈支持，台灣片商也順勢公佈「第一週戲院特典」，不僅有機會獲得

  「原著作者親繪拍立得風小卡－GIVEN」乙張，更加碼長達25分鐘，只限第一週才能在戲

  院觀賞到的「特別訪談影片」，請粉絲務必把握有看又有拿的難得機會！不僅如此，本片

  也是整個系列邁向完結的最終篇章，在片中聲演主角「佐藤真冬」的矢野獎吾，也分享自

  己的真實感受，並表示：「回首過去，我感覺自己也和真冬一起成長了！」





  感人肺腑的超人氣神作《GIVEN被贈與的未來劇場版：去海邊》，這回邁向最終完結篇，

  不僅日本上映勇奪最大影視口碑網站「Filmarks」的「初日滿足度」冠軍，票房更大破三

  億日元（約新台幣6240萬元），刷新系列作品的影史最高票房成績，甚至連續七週稱霸獨

  立戲院票房排行。台灣片商也積極向日方爭取成為本片在海外第一個最速上映的地區，上

  映規模更強勢刷新本系列劇場版在台灣的排映數量，讓粉絲可以在各地有更多的觀影戲院

  選擇。尤其片商在上週末舉辦四場「前後篇連映特別場」，票券更是在第一時間搶購一空

  ，展現強大的買氣之外，也讓搶先觀賞到的粉絲紛紛直呼感動：「在影廳裡面哭了好多次

  ！」「好愛、好棒、好好看、好好笑、好好聽、一定要去電影院看！」



  為了回饋廣大粉絲的熱烈支持，台灣片商也順勢公佈「第一週戲院特典」，只要購買本片

  第一週（4/2-4/10）期間場次電影票乙張，就有機會獲得「原著作者親繪拍立得風小卡－

  GIVEN」乙張（


  ）。不僅如此，更在正片開始之前，加碼播放長達25分鐘，只限第一週才能在戲院觀賞到

  的「特別訪談影片」。這支訪談影片當中，為七位主角群擔任聲優的矢野獎吾、內田雄馬

  、中澤匡智、江口拓也、今井文也、坂泰斗、淺沼晉太郎都將現身說法，回顧至今的系列

  內容，除了分享當初拿到角色時的心情、在錄音時的深刻回憶、印象深刻的戲份之外，還

  將透露自己在錄音現場所特別注意的部分，還有分享給粉絲的真心話。內容豐富，請粉絲

  務必把握上映第一週有看又有拿的難得機會！





  《GIVEN被贈與的未來》劇情以擁有過人歌喉的佐藤真冬，和擁有超越高中生吉他技術的

  上山立夏的相遇為開端，譜寫出搖滾樂團「GIVEN」成員們的青春歲月。在這次最終完結

  的《GIVEN被贈與的未來劇場版：去海邊》當中，真冬卻開始對音樂感到迷茫而停下腳步

  ，讓觀眾開始糾結最後他的選擇究竟會是什麼。擔任真冬配音聲優的矢野獎吾，也分享自

  己在演繹角色的過程中，有很多時候能深刻感受到與角色的情感連結，尤其是被音樂擊中

  的瞬間，或是能夠看到自己平常經歷和常識之外的事物：「這就是本作的魅力，在那些瞬

  間，真冬的歌聲就像觸動立夏的琴弦一樣，觀眾也能夠感受到這樣的共鳴。我覺得那種感

  覺就藏在音樂當中，讓人能與角色的情感產生強烈共鳴。」



  對於本作邁向完結，矢野也有感而發：「非常感激有機會參與這部作品，這也是我第一次

  擔任主角。我深信，多虧大家的支持，我才能繼續聲演真冬這位透過一連串奇蹟事件推動

  故事發展的角色。回首過去，我感覺自己也和真冬一起成長了。」他並透露：「原作漫畫

  迎來完結，動畫也演到完結，我真心感到高興，雖然有些寂寞，但相較之下，『恭喜』的

  心情更加強烈。對於到目前為止參與動畫製作的工作人員、粉絲以及所有相關人士的感謝

  ，是我最強烈的心情。」



  這部集結青春、樂團與BL元素，台灣動漫迷爭相傳頌「這本BL不得了！」的話題之作《

  GIVEN被贈與的未來劇場版：去海邊》，即將在明日（4/2）於台灣珍愛獻映。本片劇情描

  述由佐藤真冬（矢野獎吾配音）、上山立夏（内田雄馬配音）、中山春樹（中澤匡智配音

  ）、梶秋彥（江口拓也配音）組成的搖滾樂團「GIVEN」，雖然在音樂競賽中落敗，卻仍

  收到唱片公司的出道邀請。當成員們都對出道充滿積極態度的情況下，真冬卻遲遲無法給

  出回應。另一方面，短暫加入鹿島柊（今井文也配音）與八木玄純（坂泰斗配音）所屬樂

  團「syh」，並在其中擔任支援吉他手的立夏，正努力完成柊託付給他的某首曲子。某天

  ，立夏接到真冬的電話，趕來真冬身邊，卻發現他對音樂產生抗拒。真冬在對立夏的思念

  ，以及自己對音樂的情感中感到迷茫而停下腳步。面對這樣的真冬，世界知名的小提琴家

  村田雨月（淺沼晉太郎配音）找上了他…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
