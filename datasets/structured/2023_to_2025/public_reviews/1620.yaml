title: '[新聞]<烈火浩劫>預言大火，凱薩獎影帝曝抖M傾向'
content: '新聞網址：



  取材真實森林大火事件的最新災難新片《烈火浩劫》（The Blaze），即將在6月2日於全

  台震撼獻映。劇組為讓觀眾擁有大火席捲的沉浸式體驗，特別在攝影棚內大手筆重現80公

  尺的朗德道路，百分百掌握最佳大火場面。本片還找來法國「凱薩獎影帝」艾歷克斯魯茲

  （Alex Lutz），飾演帶著父親奮力逃生的男主角「西蒙」。尤其角色除了內心戲之外，

  還要面對可怕大火，困難挑戰連他自己都笑說：「我熱愛虐待自己的身體！」尤其更讓人

  震驚的，是本片拍完後的隔年夏天，真實世界居然驚人吻合電影設定，在同一時間、同一

  地點發生了「朗德森林大火」，讓本片成為網友驚呼連連的「神預言」之作。





  以森林大火為題材的《烈火浩劫》，選擇法國南部的朗德省作為故事背景。劇組先是在朗

  德省北部和吉倫特省南部拍攝外景，再移至安古蘭的攝影棚拍攝大火場面。為了百分百有

  效掌握光與火的運用，將大火包圍的窒息感，在不造成危險的狀況下真實呈現，劇組特地

  在攝影棚中，還原約莫80公尺的朗德道路，並安排消防人員擔任顧問，呈現最實際的火勢

  狀態，還將汽車連結氣瓶以根據指令產生火焰，甚至在特技演員身上塗上特殊凝膠，讓演

  員變身「人體火球」，使逃難驚悚程度更上一層樓。



  導演昆丁雷諾（Quentin Reynaud）對片場的精心設置表示：「我們使用大約30棵的松樹

  ，以及一些植被，它們被運來使用在攝影棚結構上。我們周圍有消防人員確保安全，以及

  視覺效果人員掌控不同處的火焰。不過拍攝時最主要的困難點，就是雖然對視覺有雄心，

  但這是一部大約400萬歐元的低成本電影，用有限預算製作一部需要大規模組織、高效率

  的災難片，也許帶給我們更好的創造力！」從零開始，重現出窒息又不安的森林大火現場

  ，讓片中飾演年邁父親，也同為「凱薩獎影帝」的安狄度索里亞（Andre Dussollier）大

  讚：「這一切真是太令人驚艷了！」





  與導演昆丁雷諾透過《烈火浩劫》再度合作的艾歷克斯魯茲，在片中必須帶著年邁父親死

  裡逃生，導演對角色分享觀感：「西蒙這個人物給演員帶來難度，他非常需要極端的身體

  投入。」富有挑戰性的角色，也讓艾歷克斯坦言：「西蒙需要大量身體上的投入，是相當

  具有挑戰性的角色，必須在兩個不同場地拍攝同一個場景，這並不容易，需要記住所經歷

  過的感受。即使導演為了減輕演員壓力，盡量按照時間順序拍攝，但也不能總是如此。內

  心的狀態也會影響身體表現，身體在走過燃燒的森林，和走入冰冷的海水，會是不一樣的

  表現。」但他也幽默補充自己的「抖M」屬性：「請注意！我不是在抱怨，我熱愛虐待自

  己的身體。」此外，由於片中的父子關係不佳，為了能營造在父親身邊個性較為退縮、不

  夠成熟的模樣，他和劇組討論過後，也刻意將頭髮燙捲，製造出差異感。



  除了窒息恐懼的沉浸式體驗令人感到害怕，全片拍攝完後一年，竟也快速跟上劇情，驚人

  吻合了電影設定，在同一時間、同一地點發生「朗德森林大火」。導演對此也不敢相信地

  表示：「我們甚至在構想時，定義片中的故事是發生在2022年7月17日，而現實的這一天

  ，正是朗德地區森林面積被燒毀最大的一天。」令人震驚的巧合，連法國網友看了都驚呼

  ：「看了很有共鳴！」「真實到很可怕！」「氣候災難真的離我們非常近！」



  這部震撼國際的最新森林災難電影《烈火浩劫》，即將在6月2日於全台震撼上映。本片劇

  情講述西蒙（艾歷克斯魯茲飾演）與年邁父親喬瑟夫（安狄度索里亞飾演）住在綠樹成蔭

  的法國南部沿海地區，然而一場突然襲來的森林大火，卻逐漸摧毀他們的家園，迫使兩人

  必須在警報響起時，拋下一切逃出生天。隨著火勢與強風愈來愈大，濃煙讓撤離的交通陷

  入嚴重堵塞。眼看大火逼近，氣溫攀升到難以負荷的程度，連灰燼都開始如雪片般落下，

  西蒙必須盡快找到出路，讓自己與父親脫離險境…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
