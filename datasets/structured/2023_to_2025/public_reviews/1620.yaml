title: '[新聞] 凱薩獎雙影帝【烈火浩劫】受困火場車陣！'
content: '新聞網址：



  以森林大火為題材災難電影《烈火浩劫》，（The Blaze）即將在本週五（6/2）於全台震

  撼上映。本片是法國導演昆丁雷諾（Quentin Reynaud）的第三部劇情長片，找來「凱薩

  獎兩大影帝」艾歷克斯魯茲（Alex Lutz）、安狄度索里亞（Andre Dussollier）組成父

  子、演技交鋒。尤其兩人從外型、聲音到表演方式的相似程度，更是讓導演讚嘆：「宛如

  天生的父子！」





  《烈火浩劫》導演昆丁雷諾，近年來看見加州與澳洲的森林大火事件之後，決定將氣候災

  難釀成的自然火災故事搬上大銀幕，讓觀眾隨著主角「西蒙」受困在被大火包圍的車陣當

  中，眼看溫度不停升高、水分逐漸流失，甚至目睹路人燒成火球，還要想盡辦法帶著行動

  不便的年邁父親逃離火海，體驗絕地求生的沉浸式恐懼。值得一提的是，本片是導演跟凱

  薩獎影帝艾歷克斯魯茲，兩人繼《吉比一家》（Meet the Guilbys）和《五盤大戰》（

  Final Set）後三度合作。因為數度合作成為摯友，一直都有保持聯絡，他暖心分享道：

  「某天，艾歷克斯對我說：『如果你需要我，只要你告訴我何時何地，我就會過去。』這

  席話讓我深受感動，便想著他，寫下了『西蒙』這個角色。」因此促成兩人的第三次合作

  ，讓他演出這個身心都充滿挑戰的角色，而艾歷克斯對於能夠再度一起完成作品也表示：

  「我永遠感謝他對我的信任，我會一直努力回報他的！」





  在艾歷克斯的選角確定後，在《烈火浩劫》擁有同等重要戲份的年邁父親「喬瑟夫」一角

  ，當談及演出人選時，導演和艾歷克斯都一秒想到安狄度索里亞。安狄在讀完劇本之後，

  也表示：「喬瑟夫的個性令我感到興奮，不僅是粗魯控制狂、退伍軍人，跟和兒子的關係

  還一團亂。這個角色讓我思考良多，片中我也會陷入無法逃脫的境地，我很喜歡這樣。」

  尤其這角色一反過去他在大眾心中留下的魅力健談形象，演出差別甚大的反差感。



  能夠與資深前輩合作，艾歷克斯也興奮表示：「有機會飾演他的兒子，是夢寐以求的事情

  ！我覺得我們很合拍，特別是表演的時候，有相同的品味、放縱、精力與樂趣；我們還有

  其他共同點，帶有一點金屬調的嗓音，相似的措辭與表達方式。」連導演看完兩大影帝的

  共同演出後，也不由自主讚嘆：「這兩人宛如是天生的父子檔！」雖然他們在片中必須經

  歷煎熬的逃難過程，但兩人在鏡頭之外可是大玩特玩，安狄更回憶：「我和艾歷克斯有很

  多『即興表演』與歡笑聲，雖然受限在車子裡面，導致很多時候沒辦法繼續，但拍攝時還

  是有很多樂趣，也才能得到許多放鬆的機會。」



  這部震撼國際的最新森林災難電影《烈火浩劫》，即將在本週五（6/2）於全台震撼上映

  。本片劇情講述西蒙（艾歷克斯魯茲飾演）與年邁父親喬瑟夫（安狄度索里亞飾演）住在

  綠樹成蔭的法國南部沿海地區，然而一場突然襲來的森林大火，卻逐漸摧毀他們的家園，

  迫使兩人必須在警報響起時，拋下一切逃出生天。隨著火勢與強風愈來愈大，濃煙讓撤離

  的交通陷入嚴重堵塞。眼看大火逼近，氣溫攀升到難以負荷的程度，連灰燼都開始如雪片

  般落下，西蒙必須盡快找到出路，讓自己與父親脫離險境…。


  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
