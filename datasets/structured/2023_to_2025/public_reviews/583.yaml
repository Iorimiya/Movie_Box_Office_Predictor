title: '[新聞] 《漂亮朋友》奪金馬觀眾票選 耿軍盼上映'
content: "新聞網址：\n\n【金馬61】《漂亮朋友》奪觀眾票選獎最佳影片　中國導演耿軍盼「入圍就能在台灣上映\n」\n上報流行 2024年11月22日 17:59:00\n\
  \n\n第61屆金馬獎「觀眾票選獎最佳影片」，由中國導演耿軍執導的《漂亮朋友》奪下，耿軍\n也希望入圍「最佳劇情片」的作品，可以直接在台灣上映，不必透過抽籤制度。（金馬執\n\
  委會提供）\n\n\n金馬執委會今（22）日舉行第61屆金馬獎入圍午宴，為明日（23日）登場的金馬獎頒獎典\n禮暖身，本屆金馬獎觀眾票選獎最佳影片，由《漂亮朋友》奪下；國際影評人費比西獎則\n\
  由《空房間裡的女人》獲得，執導《漂亮朋友》的導演耿軍開心表示：「感謝大家愛《漂\n亮朋友》，《漂亮朋友》愛台灣，這部片很適合聖誕檔、春節檔、情人節檔。」希望能夠\n\
  在台灣上映。\n\n\n今年「金馬獎觀眾票選最佳影片」總共徵選了483位觀眾，完整觀賞完五部入圍最佳劇情\n片《從今以後》、《鬼才之道》、《默視錄》、《一部未完成的電影》、《漂亮朋友》後\n\
  ，才能投票選出心目中的最佳影片，結果由耿軍導演的《漂亮朋友》勝出，雖然《漂亮朋\n友》從法國出品，但團隊幾乎都是中國人，要在台灣上映必須抽籤，可惜未能中籤，耿軍\n\
  受訪時，認為現今法規很沒意思，希望入圍作品都可以在台灣上映。\n\n\n中國導演耿軍（右）以《漂亮朋友》奪下觀眾票選獎最佳影片，並與主席李屏賓（左）一\n起合照。（金馬執委會提供）\n\
  \n\n「國際影評人費比西獎」由《空房間裡的女人》獲得，評審由日本影評人與獨立策展人槻\n舘南菜子、西班牙影評人伊娃佩德羅、電影與藝術評論人徐明瀚擔任，他們認為《空房間\n\
  裡的女人》塑造了在既有亞洲女性形象之外的可能，呈現女性於各種惡劣形勢下的自覺與\n決斷。從高度完成的形式美學中，得見導演內在創作動機的強度與必要性。從具體空間框\n\
  限的困鎖與逸離，到無形社會暴力的籠罩與掙脫，在編導與攝製皆完成了高度精巧的辯證\n，深具展望性。\n\n \n「國際影評人費比西獎」由《空房間裡的女人》獲得。（金馬執委會提供）\n\
  \n\n第61屆金馬獎華麗頒獎陣容，包含日本金像獎影帝阿部寬，以《媽的多重宇宙》獲得奧斯\n卡最佳男配獎的關繼威、最佳導演關家永及製片人王慶，金馬影帝張震和七位金馬影后張\n\
  艾嘉、楊貴媚、吳君如、林嘉欣、楊雁雁、謝盈萱、林品彤，包含許光漢、王淨、袁澧林\n、曾敬驊、陳柏霖五大星光，還有四大角頭蔡振南、太保、高捷、龍天翔助威，堪稱眾星\n\
  雲集。李安、王童、朱延平三大導演將擔任特別獻獎嘉賓，金馬主席李屏賓，與評審團主\n席譚家明則將揭曉最佳劇情片得主。\n\n\n「國際影評人費比西獎」評審伊娃佩德羅（左起）、槻舘南菜子、邱陽擔任，並將獎項頒\n\
  給邱陽執導的《空房間裡的女人》。（金馬執委會提供）\n\n\n金馬獎星光大道將於明日5點30分開始，頒獎典禮準時於晚間7點舉行。台灣觀眾11月23日\n可鎖定台視頻道同步收看第61屆金馬獎頒獎典禮直播，網路直播由MyVideo影音獨家播出\n\
  ，LINE TODAY共同轉播。海外除了新加坡（StarHub）、馬來西亞（Astro）各有當地電視\n台直播外，其餘地區皆可透過金馬與台視YouTube同步觀賞。更多最新消息將在金馬官方\n\
  網站、Facebook、IG等社群平台陸續公開。\n\n\n--"
