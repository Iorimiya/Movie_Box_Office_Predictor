title: '[普雷]耿軍作品《漂亮朋友》：偷偷'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《漂亮朋友》有雷影評：偷偷\n\n\
  逗趣跳躍的台詞+黑白基調的影像，講晦暗世界下的平凡情愛。\n\n■ 夾縫之中的同道中人\n\n《漂亮朋友》裡最常見的場景：試探與交換。不是摸摸小手這種曖昧。人到中年時間不多\n\
  ，學會直搗重點省去廢話。\n\n無需擺放其他角色耳語碎嘴，他們偷偷摸摸的姿態，反映了中國社會對同志團體的待遇和\n定位。\n\n\n《漂亮朋友》裡描寫的男同志並不是主流的年輕小鮮肉，而是已屆中年的大叔，再加上缺\n\
  乏自由透明的交友風氣與管道，在戀愛、甚至單純滿足情慾的追求上頻頻受阻。\n\n細數張志勇和徐剛一路上遇到的男人，有想以金錢赤裸買賣慾望的公廁大叔、要求絕對服\n\
  從的霸道會長，還有一派為了安穩外在形象（形婚），極力避免與過多同志牽扯。\n\n同為同志，知道這些男人尋覓情愛的難處，也清楚無人為他們主持公道，所以才敢討價還\n\
  價、死皮賴臉吃豆腐。\n\n吃豆腐在電影裡反覆出現。比如徐剛在理髮廳的小伎倆、泉哥如何被客人大姐熊抱、薛寶\n鶴對徐剛的挑逗與強求等等。\n\n\n\n\n游渡慾海、逃脫同類相輕，徐剛和張智勇終於認出了彼此，找到世間難尋的一份愛。薛寶\n\
  鶴貪圖加入他們好不容易組成的團體，最後在自主選擇下被兩人淘汰。\n\n\n■ 為了自由，先走向囚籠\n\n《漂亮朋友》中出現兩對形婚的男女，一對是張志勇與他的妻子，另一對劉潁和阿布則找\n\
  上理髮師泉哥。\n\n這裡最重要的是劉潁和阿布的自由之辯。台詞裡說到：自由的反面是自由，自由的四周只\n能是自由。\n\n為了在不自由的社會風氣和制度中獲得自由，他們只能先找人嫁了、娶了，給個交代，才\n\
  能心安理得去追尋、保留心中自由選擇的愛。\n\n為了保護愛人、一次過關，阿布還非常小心的篩選與把關，確保能找個道德合格、身體健\n康的好人。\n\n\n\n最後畫面由黑白轉彩色，三人在鏡頭前見證他們締結的婚姻，與她們的愛。\n\
  \n\n–\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n--\n                   \
  \          04/06 22:20"
