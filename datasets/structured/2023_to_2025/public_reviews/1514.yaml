url: https://www.ptt.cc/bbs/movie/M.1691413301.A.607.html
title: '[好雷] 忍者龜—變種大亂鬥'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  意外的好看，小時候的最愛沒有讓我失望，記得以前墊板上畫滿了各式各樣的忍者龜。「

  變種大亂鬥」解構了原本的劇情角色設定（讓洛克史迪比巴和忍者龜並肩作戰也是夠有創

  意），從忍者龜的起源開始，帶入了青少年（其實忍者龜的英文第一個字就是teenage）

  、次文化、父子矛盾、人和動物的衝突、網路世代等各種元素，賦予這部跟我差不多老的

  動畫全新的生命。特別的仿2D畫風也不錯，只是處理動作場面時稍顯凌亂。題外話，這大

  概是成龍近十年來最好的演出（他幫老鼠師父配音XD)。



  --'
