url: https://www.ptt.cc/bbs/movie/M.1691641041.A.EEA.html
title: '[無雷] 忍者龜變種大亂鬥，太好看了'
content: '優點：


  畫風特別，美國塗鴉風加黏土風


  劇情簡單又不沉悶，節奏流暢爽快


  動作設計很棒，配合音樂超讚


  四龜跟反派配音很神


  超多流行文化的彩蛋，而且都滿通俗好懂，像BTS之類的，不會很偏


  缺點：


  有些人可能不爽白人記者歐尼爾被改成黑胖，但我覺得改得不錯，不突兀


  反倒忍者龜的老鼠師傅改得不太好，可能造型跟表情問題，以往武功高強的酷炫感都不見了


  其他真的沒什麼好挑剔的了



  評分9.4/10


  -----

  Sent from JPTT on my Google Pixel 6a.


  --'
