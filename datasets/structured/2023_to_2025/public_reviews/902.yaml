url: https://www.ptt.cc/bbs/movie/M.1720627101.A.EF4.html
title: '[新聞] 《龍捲風暴》首映 阿湯哥挺老搭檔'
content: "《龍捲風暴》首映 阿湯哥挺老搭檔\n\n2024/07/10 05:30\n\n\n湯姆克魯斯（左）驚喜現身《龍捲風暴》倫敦首映會，力挺格蘭鮑威爾。（翻攝自IG）\n\
  \n〔記者許世穎／綜合報導〕曾於《捍衛戰士：獨行俠》飾演「劊子手」的格蘭鮑威爾，在\n災難鉅作《龍捲風暴》飾演「龍捲風牛仔」，電影昨在倫敦舉行首映，除了和他一同化身\n\
  「風暴追逐者」的黛西埃德加瓊斯、安東尼拉莫斯一同出席，「阿湯哥」湯姆克魯斯更驚\n喜現身力挺。\n\n\n格蘭鮑威爾（右起）、安東尼拉莫斯、黛西埃德加瓊斯在《龍捲風暴》化身新一代「風暴\n\
  追逐者」。（華納兄弟提供）\n\n先前格蘭和阿湯哥合作《捍衛戰士：獨行俠》深受前輩照顧，今年初傳出續集正在開發中\n，包括阿湯哥、「公雞」麥爾斯泰勒、格蘭都有望回歸，導演約瑟夫柯金斯基也將繼續執\n\
  導。\n\n雖然《捍衛戰士3》開拍還沒正式排程，但阿湯哥也以行動支持好搭檔，同時也力挺和他\n簽訂全新策略合作的「華納兄弟」，格蘭也分享和阿湯哥和照並寫道「當你的僚機駕駛員\n\
  跟隨你進入風暴時…」，足見兩人好交情。《龍捲風暴》將於7月17日在台上映。\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛   \
  \     是 菩薩\n\n\n\n--"
