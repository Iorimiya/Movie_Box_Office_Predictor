title: '[好雷]龍捲風暴:劇情簡單，特效滿滿的爽片 '
content: "雷文防雷資訊頁\n\n1. 女主角漂亮\n\n   男主角痞帥，越看越喜歡\n\n2. 劇情簡單，特效誠意滿滿，適合單純想看爽片的\n\n\n\n\
  \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n~~~\n~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n1. 開頭看到桃樂絲5號，但單純只是致敬\n\n2. 男主角的開場表現就像一個為了流量譁眾取寵的網紅，再加上一些誤解，真的會讓\n\
  \   理性派的女主角反感，不過很喜歡女主角不是溫良恭儉讓的類型，有幾次擺了男\n   主角，從而讓男主角的視線越離不開她\n\n    很喜歡那段切換男女主角畫面分別分析著龍捲風的劇情，兩人是那樣互補\n\
  \    有共同的語言，所以漸漸的女主角才不排斥男主角，甚至主動請他幫忙\n\n\n3. 有個疑問，都說是龍捲風密集的地區了，沒有建地下室避難所?\n   <龍捲風>女主角的爸爸可是躲在地下室時，拉不住地下室的門被捲上去的\n\
  \n4. 男女主角中後期隨著相處漸漸多了一點曖昧，可惜到片尾連個擁抱接吻都沒有，\n   感覺一直處在朋友以上，戀人未滿的階段\n\n5. 可喜可賀哈維轉正了，從反派轉完正派，在火龍捲中還以為他就要下線了\n\
  \n6. 媽媽是真正了解女主角的人，也給足女主角空間讓他自己成長\n    女主角的理性說不定就是遺傳她\n    更直接把一面之緣的男主角留下過夜，這是認定準女婿了嗎?\n\
  \n--"
