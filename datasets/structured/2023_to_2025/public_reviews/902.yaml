url: https://www.ptt.cc/bbs/movie/M.1721566394.A.23B.html
title: '[好雷] 龍捲風暴 - 勵志高於災難感 順順演完'
content: "無雷的部份：\n\n這部看新光4D\n\n晃動還算不錯\n\n噴水時機有點讓人會心一笑\n\n但噴氣聲略大聲就有點干擾\n\n\n\n整體劇情就是順順過去、不會拖泥帶水\n\
  \n基本上大概就是可以想到的劇情\n\n但角色倒是沒有特別討人厭的\n\n大部份都還蠻討喜\n\n尤其男女主角\n\n不只外表賞心悅目\n\n全程也都算是有帶腦子在行動、也都是有很合理的理由\n\
  \n比起災難片感覺看完更像是勵志片的正向感\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n\n這部我覺得整體結構跟第一集有點像\n\n雖說就龍捲風來襲的壓迫感沒有前集那麼強\n\n但如前述因為角色們有帶腦子在行動\n\n所以心裡同時也希望他們是能成功\n\
  \n\n\n\n一開始就直接切入主題\n\n先讓女主角跟她的團隊為了研究如何撲滅龍捲風\n\n帶出她原本就有研究、有天賦、還有理念(雖然當時略為天真)\n\n\
  但無奈遇到EF-4而只有兩人存活\n\n附帶一提領便當的眼鏡妹在片中的扮相\n\n讓我直覺想到偶像團體成員徐沛婠XD\n\n\n\n\n\n\n\n經過災難後要讓女主角重回龍捲風一線而不是螢幕後\n\
  \n有經過爭扎但不會拖拖拉拉糾結\n\n男配邀請→拒絕→看到新聞有災情→決定回歸\n\n片中有許多互動也都不會拖戲真的是這部的優點\n\n\n\n男主角一開始出現故意營造是譁眾取寵youTuber\n\
  \n當時就在想劇情會怎麼鋪陳他其實是好人\n\n而也很符合期待的\n\n狂雖狂但整個團隊的人根本超好！\n\n用YouTuber賺的周邊幫助災民\n\n而且也不是無腦帥渣\n\
  \n甚至最後還能夠鼓勵女主角重新啟用之前的構想\n\n一起跑模型、實驗\n\n我蠻喜歡最後面發現女主角還活著時\n\n男主角那幕有點澿淚的演出很不錯\n\n\n\
  \n許多人很推的其中一點就是女主角很漂亮\n\n而且那種科學家的知性蠻到位的\n\n然後也是真的想幫忙受災者的好人\n\n\n\n男配雖然聲線我比較沒那麼喜歡\n\
  \n但整體演出也不至於讓人討厭\n\n幸好編劇也沒有灑狗血讓他領便當\n\n雖說後面讓他及時來救男主角也是老梗用法\n\n不過以當時氣氛就是夠爽\n\n\n\n\
  最後也沒有灑狗血隨便犧牲\n\n或是男主角無腦跑出去\n\n而是都留在戲院盡量減少死傷\n\n這點我也給予好評\n\n\n\n\n\n片中除了提到桃樂絲5號讓人回味前集\n\
  \n其他獅子、稻草人也都是用綠野仙蹤的梗\n\n讓人會心一笑\n\n\n\n\n配樂的部份\n\n有些橋段搭配鄉村音樂\n\n選的歌還蠻好聽的\n\n\n\n\n\
  \n\n\n\n--\n           \n\n       ●\n\n\n\n\n--"
