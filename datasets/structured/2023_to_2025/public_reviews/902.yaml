url: https://www.ptt.cc/bbs/movie/M.1721543106.A.CCC.html
title: '[新聞] 龍捲風暴 北美首週票房上看8000萬美金'
content: '一路開高遠超預期！《龍捲風暴》北美首週票房上看8000萬美金




  《龍捲風暴》在北美開出超乎預期的票房佳績。（華納兄弟提供）


  〔記者許世穎／綜合報導〕


  災難鉅作《龍捲風暴》正在全球上映中，北美更是從優先場就開出超乎預期的票房數字，

  讓該片首週末（7月19至21日）的開片數字一路上修，片約不斷的男主角格蘭鮑威爾儼然

  成為新生代好萊塢一哥。


  該片由《夢想之地》的編導鄭李爍執導，影集《正常人》黛西埃德加瓊斯、《捍衛戰士：

  獨行俠》格蘭鮑威爾、《變形金剛：萬獸崛起》安東尼拉莫斯主演，在世界各地首映後，

  持續累積好評，不僅在知名影評網站爛番茄已獲得新鮮認真，代表觀眾意見的爆米花指數

  也有92%滿意度。




  格蘭鮑威爾（左）、黛西埃德加瓊斯在《龍捲風暴》攜手追風。（華納兄弟提供）


  電影於週四（18日）在北美的優先場便收穫800萬美金（約台幣2.62億元），在今年僅次

  於《腦筋急轉彎2》、《沙丘：第二部》和《哥吉拉與金剛：新帝國》，成為今年第四好

  的優先場成績，加上先前的提前放映，讓該片在正式於北美上映前已收穫1070萬美金（約

  台幣3.5億元）。


  緊接著週五（19日）北美上映首日就收穫3220萬美金（約台幣10.56億元，含提前場數字

  ），週六（20日）初步統計再收2700萬美金（約台幣8.85億元），比週五日場上漲不少，

  兩天內票房已經達到5900萬美金（約台幣19.35億元）。


  而 《龍捲風暴》上映前被預估在北美首週開片大約落在4000至5000萬美金（約台幣13.12

  至16.4億元），目前已上看至8000萬美金（約台幣26.24億元），除了看齊年初《沙丘：

  第二部》、《哥吉拉與金剛：新帝國》，也和去年同個週末上映的《奧本海默》的開片相

  當。


  註：《龍捲風暴》在北美和《奧本海默》一樣由環球影業發行，海外包括台灣則是和《沙

  丘：第二部》、《哥吉拉與金剛：新帝國》一樣由華納兄弟發行。


  《龍捲風暴》全台上映中，IMAX、D-BOX、4DX、MX4D、Atmos、Dolby Cinema、Screen X

  等特殊版本同步登場。


  新聞網址：






  --'
