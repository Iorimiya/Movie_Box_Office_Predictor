url: https://www.ptt.cc/bbs/movie/M.1722337827.A.A3A.html
title: '[  雷] 有人跟我一樣期待龍捲風暴致敬那段經典的'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\n\n\n\n\
  \n\n......牛排蛋佐薯泥肉汁嗎？\n\n\n真心不片騙 龍捲風的情節我幾乎都忘光了 偏偏就是記得那段\n\n團隊大啖牛排蛋+薯泥肉汁\n\n還記得城市來的男主未婚妻，團隊不客氣直接在她面前擺上一大片比臉大的牛排\n\
  \n再堆起一座薯泥小山然後灌上大瓢肉汁、讓她徹底傻眼的畫面\n\n什麼龍捲風 乳牛天上飛 對我來說都不如這一段來得經典\n\n\n我先說我完全沒看預告，然後當看到凱特媽招待泰勒住下\n\
  \n我就開始瘋狂OS，要來了嗎牛排蛋薯泥肉汁，雖然人少了點不過泰勒猛男份量再大都可以\n\n結果...就那樣 平淡的一餐\n\n可能我的點異於其他人吧 但我真的想牛排蛋+薯泥肉汁想瘋了\n\
  \n每次看完這段就會跑去夜市\n\n但台灣夜市就算有牛排蛋但也不可能會給薯泥 更別說肉汁了阿...\n\n--\n\n\nPTT本來就不是民主制度。     \
  \                                                    \n是啊，這點我不否認               \
  \                                               \n\n--"
