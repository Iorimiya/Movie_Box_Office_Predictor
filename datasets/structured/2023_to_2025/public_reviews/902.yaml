url: https://www.ptt.cc/bbs/movie/M.1723057540.A.274.html
title: '[普雷] 什麼要素都沾一點的龍捲風暴'
content: "本人從沒看過以前的龍捲風系列電影，\n所以不曉得這算是系列續作，\n跟我想像的災難片有點落差。\n。\n。\n。\n。\n。\n。\n。\n 故事開場還不錯，當稻草打在男人臉上時還以為會像絕命終結站那樣的片，結果不是，但\n\
  對龍捲風的危險已經清楚一二了。\n\n出事後幾年好友找女主去分析龍捲風，女主同意後第一次嘗試失敗，女主角很悔恨，相信第\n二次她一定會全力達成目標！\n\n第二次千辛萬苦放置好的雷達結果整台被吹走了，不過資料還在，只要去找一下就能完成任\n\
  務，不會愧對團隊！\n但女主角此時卻聖母心態大發決定要去幫助災民，其實我不太懂為什麼要去幫忙，而且影片\n開頭也沒有女主為何會有想去幫助災民的原因，導致後面突然去救災民會感覺很突兀。\n\
  一般來說都會先把份內的事情弄好再去幫助需要救助的人比較合常理吧！\n\n再來就是競爭方的男主，到哪有他的鏡頭\n(完全不知道他是戲份最多的男主角)\n女主角無論在哪，男主都能跟她搭上幾句話，\n\
  在追風的路上、回房間的路上、災區救小狗的時候、房門響打開看到男主帶披薩的時候、回\n到媽媽家住隔天早上男主就來敲門了。\n讓我覺得這男的比龍捲風還可怕…....但他夠帥，給過。\n\
  \n好友的工作其實也沒有很壞，畢竟他的工作就是檢測龍捲風，也沒敲詐災民，但就碰觸了女\n主的逆鱗了，對一同活下的好友除了臭臉還是臭臉，有夠可憐，車子還被女主開走…\n\
  \n最後一幕救災都還不錯，就不懂女主為啥要獨自一人去對抗龍捲風，是在自我救贖？\n還好有女主威能完美解決，後來也跟男主好上了~~\n最慘的就是那位好友，工作沒了，也沒得到女主芳心，只能說人帥真好。\n\
  \n\n整部片在我看來不算是標準的災難片，因為加了好多元素進去，但都很平淡無奇，沒特別的\n記憶點。\n\n但龍捲風特效我給100分啦\n\n\n--"
