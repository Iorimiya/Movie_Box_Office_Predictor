title: '[討論] 《龍捲風暴》 2個小疑問'
content: "多年前有在教室(?)看過《龍捲風》\n\n不過遺留的印象一幕,只剩下車子被兩個龍捲風夾著轉的那幕\n\n美國天災片來說,《火山爆發》給窩的感覺還比《龍捲風》好\n\
  \n(防雷頁)\n\n\n\n\n\n\n\n\n\n\n\n\n1.片尾的靜態新聞看來,主角三人應該是另起爐灶,開了新公司\n\n  所以說這種\"馴服\"\
  龍捲風的事業,真的有搞頭嗎?  風險明顯太大了吧?\n\n2.片名《Twisters》比前作多一個\"s\"有什麼特殊涵義嗎?\n\n  就像異形2英文片名也比異形1多一個s\
  \ 因為真的多出很多異形\n\n\nPS.這樣,火山爆發應該也可以趴拍續集了吧?\n\n--\n\n\n\n。。10多年後，孩子成了40多歲的大叔，開始稱\n\
  養大他的爸媽還在島上呢。\n\n--"
