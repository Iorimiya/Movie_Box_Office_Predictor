url: https://www.ptt.cc/bbs/movie/M.1720963436.A.2E1.html
title: '[好雷] 龍捲風暴4dx'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  因為人在越南，這週就有機會搶先看了這部片


  只能說這是我這幾年看下來，

  覺得最適合看4dx的電影之一了，

  座椅搖動的次數跟幅度都很過癮，

  建議各位千萬東西要收好，

  爆米花也不太適合帶進去，

  保證噴光光。


  劇情的方面我也覺得算小有用心，

  片頭一開始就有承先啟後的感覺，

  算是部無腦爽片。


  題外話，越南4dx真的有夠便宜，

  兩張票才27.8萬越盾（合台幣355）

  比台灣一張還便宜。


  --'
