title: '[討論] 龍捲風暴的北美票房追上龍捲風'
content: '就在今天 龍捲風暴票房很努力累積到2.42億

  剛好超越 1996年龍捲風的 2.41億 先恭喜

  也差不多要收尾了 有2.5億就算很不錯了


  龍捲風1996年的片 能有這種票房真的滿強的，國際票房更是完全碾壓，當初在台灣也滿紅的，新作國際市場表現不好有點可惜就是了。現在這種北美海外佔比差這麼懸殊的好像很少見，通常大片都是反過來居多，也是滿特別的現象。

  -----

  Sent from JPTT on my iPhone


  --'
