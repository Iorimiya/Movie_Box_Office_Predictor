url: https://www.ptt.cc/bbs/movie/M.1721618561.A.8F0.html
title: '[好雷] 龍捲風暴4DX 災難片不看4DX就太可惜了'
content: '本身對災難片本來就有濾鏡加成，

  1996年的龍捲風更是災難片經典中的經典


  這片滿滿的致敬彩蛋也是很巧妙

  ，雖然跟之前的龍捲風演出的公式一樣

  但是各種轉折點卻也不會拖戲或是太生硬


  這次加入了拯救災民的人性來鋪陳，比較更有帶入感

  也讓整部片在致敬之餘多了深度


  男女主角的演出也很精彩，加上男的帥女的美(超正)

  雖然當年海倫杭特也是很正，但是現在這兩個年輕的更養眼


  溫馨提醒

  災難片想看4DX的真的不要不信邪還點飲料爆米花

  剛開始的第一個龍捲風直接把我的飲料搖到灑出來，

  爆米花也是要封口才沒爆出來....


  或是你在龍捲風開始前就把飲料喝到一半就沒事了


  搖到看完都有點暈車的感覺，超嗨


  --'
