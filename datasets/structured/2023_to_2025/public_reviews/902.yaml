url: https://www.ptt.cc/bbs/movie/M.1721483296.A.3CD.html
title: '[好雷] 4dx龍捲風暴真的很讚'
content: '小弟我看的是林口4DX龍捲風暴特別場


  上星期逛威秀網頁無意中看到這部片


  想體驗一下4DX災難片的感覺於是就訂票了


  前幾天看場次的訂票人還很空


  昨天看突然爆增


  很慶幸有提前訂票搶到好位置


  不確定有沒爆雷


  所以還是防雷一下



























  首先進戲院工作人員會先發輕便雨衣


  因為老子就是來體驗4DX的效果


  所以索性就不穿


  不過電影院裡真的一狗票的人穿雨衣看電影


  我給87分不能再高


  這部的4DX效果大概有風效(龍捲風刮起的風)、水霧(下雨、噴水)、煙霧(沙塵)、


  光效(閃光打雷)、動態(震動晃動)、氣流(有東西劃過你臉頰)、


  氣味(不確定有沒有，但一直聞到萬金油的味道)


  特別是這部片的動態沒在跟你客氣的


  超級晃超級震比少女與戰車還晃還震


  會讓你在效果結束後


  原地呆笑


  剛剛戲院是發生什麼事的那種......................


  美中不足的是下雨效果沒有很明顯


  中間有些空檔就是完全沒任何效果


  另外女主角超正 男主很會把妹


  想說會有一段秀身材


  或是


  結局會來個接吻之類的


  結果沒有


  唯一接吻好像就是開頭女主角叫他男友起床的那段


  比我想像中還保守


  但震動晃動就很超值


  還是很推大家去看啦






















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  --'
