url: https://www.ptt.cc/bbs/movie/M.1721055973.A.276.html
title: '[無雷] 龍捲風暴'
content: '剛看完screenX特映，這部非常適合screenX，其他朋友看完4DX也說很適合，總之這部非

  常適合特殊廳。


  整體就是今年流行的半重啟半續集，很安培林、很史蒂芬史匹柏電影的調調。


  整部片滿緊湊的一直在追龍捲風，龍捲風的大場面戲碼只少5場，就是一直追追追追追（

  只有有追逐龍捲風的戲碼銀幕都是三面全開），龍捲風的型態也比舊版多變。


  電影的高潮戲非常「身歷其境」，看特殊廳會超真實。


  至於有沒有舊版的牛？我不能暴雷，只能說有動物梗。這部不會過度賣情懷（反而說是刻

  意避開），但又能感到滿滿的致敬味。


  --'
