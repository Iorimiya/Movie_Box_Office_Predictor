url: https://www.ptt.cc/bbs/movie/M.1721216959.A.0F7.html
title: '[微好雷] 滿滿似曾相似的龍捲風暴'
content: '雖然跟第一集隔了幾十年


  同樣的題材看得出導演用了第一集滿滿的元素


  但是沒辦法營造出像第一集一樣緊張刺激的感覺


  在女主角顏值拉滿的情況下


  個人特寫鏡頭倒是蠻多的


  有印象覺得不錯的鏡頭可能只有幾個


  像是捲進火的龍捲風


  還有最後戲院螢幕的龍捲風view




  不過。 有印象好看的點好像就這樣..



  跟第一集一樣


  女主角小時候（？）經歷過親友被捲走的創傷


  男主角開著紅色皮卡


  支援車一樣是露營車~


  有為企業工作的車隊（反派？）

  （這次有幫車取了綠野仙蹤的角色名）


  唯一跟第一集聯繫的桃樂絲5號

  （到底從哪來的！！完全沒說明）


  路上突然竄出的車隊


  有開車到面前突然消失的龍捲風


  有雙子龍捲風

  （沒啥戲份的配角有大喊藤原效應）


  有晚上突然襲擊活動的龍捲風~


  有牛（不過這次在地上跑）


  有吃東西畫面（美味程度跟第一集比輸慘了）



  雖然看的是4DX 不過搖晃的時機點幾乎都在開車


  噴水倒是蠻常 有次份量還很多 需要衛生紙




  最後


  比較起來  第一集太經典了


  當年進電影院的氣氛真的很棒


  音樂也配合的很好   外加特效完全不輸新版本


  新版本的尾聲高潮部分也沒第一集精彩


  第一集緊張的時候


  還塞了那個跑進工具房的笑點


  新版本就... 算了




  以上是我的心得 感謝大家


  p.s 威秀4DX除了特映場外沒有海報唷~~~



  突然想到 隊名也太爛 什麼龍捲風牛仔


  第一集追風者不是超帥的嗎











  -----

  Sent from JPTT on my Sony XQ-BC72.


  --'
