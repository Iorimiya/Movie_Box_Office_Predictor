url: https://www.ptt.cc/bbs/movie/M.1721208156.A.2E3.html
title: '[無雷] 龍捲風暴其實是教把妹的片'
content: '以下無雷


  今天本來想要看噤界，但臨時發現龍捲風暴居然上檔，噤界幾乎沒檔次了


  於是決定改看龍捲風暴


  對這部片沒有做太多功課，以為是翻拍1996年的龍捲風(有看過)


  今天看了之後，確實有一些致敬的橋段，但整體來說不太一樣


  我看了龍捲風暴最大的感想，就是這部片可以說是把妹教學片


  把男女情感互動的一些細節拍出來，蠻有既視感


  阿法男是什麼樣子? 貝塔男又是什麼樣子?


  為什麼貝塔男認識妹那麼久，卻久久沒有進展，


  然後一個剛出現的阿法男可以在短時間內突破妹的心防?


  阿法怎麼把妹搞到手? 貝塔男又是怎麼把妹丟掉?


  為什麼妹子喜歡阿法男但又不徹底跟貝塔男切斷?


  這部片都有刻畫，總之可以教觀眾如何當一個成功的阿法男


  雖然片長有兩小時，但劇情相當流暢，沒有冷場，場景畫面也相當精彩


  值得一看


  --'
