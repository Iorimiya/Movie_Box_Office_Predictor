url: https://www.ptt.cc/bbs/movie/M.1721217289.A.E0F.html
title: '[普雷] 人才是主角的《龍捲風暴》'
content: '在距離1996年十幾年過後的《直闖暴風圈》

  讓大家迎來了好久不見的這種破壞力驚人的災難片類型

  （比較驚訝的是這部片居然已經是2014年十年前的片了！？）

  我記得《直闖暴風圈》當時好像被批評故事內容過於簡單平面

  但是特效場面滿不錯的，壓迫感和獵奇感都有做足

  然後再過十年這次正宗的續集也陸續報到

  也讓大家重溫與懷舊龍捲風第一集的氛圍

  但是比較起來我個人還是更喜歡爽度和誇張感更重的《直闖暴風圈》

  不知道是不是因為是絕命終結站5的導演的關係

  各種奇形怪狀莫名天馬行空的龍捲風型態和死法都沒在跟你客氣的

  當下看了真的就是爽

  這次的《龍捲風暴》相較下來會發覺故事裡面的人才是主角

  災難這個元素反而比較像是在幫主角心境歷練的過程推屁股

  女主角的受挫成長克服、男主角看似輕浮到被感化的內斂

  配角們的湊熱鬧與商業上的市儈，到最後聯手一起互相幫助

  讓這部片在整體上描寫人物與天災間達到中規中矩的平衡

  不得不說女主角黛西真的是近年來少數的美顏

  《沼澤謀殺案》的時候就覺得她真的超美的

  然後看到有些人對於男主角跟男二各有不同的評價

  我反而覺得男二在人設上面比較實際一點

  發生片頭一開始那種悲劇後，打起精神過生活

  選擇了從軍建立資源，然後退伍後再利用這些優勢

  結合商業手段繼續下去才能維持他所謂的理想

  喜歡女主角然後也不忘找她一起來延續他們的理念

  雖然大概也知道是在幫壞人賺錢

  但是沒有經濟來源也沒辦法完成想做的事情

  最後也不計前嫌的跑回去幫助女主角和其他人

  再怎麼看也覺得男二如果在現實生活中才是比較實在的人吧？

  最後想說的結局的第三幕安排在“戲院”這段作為高潮大戰

  算是不算是一種後設上的趣味啊？

  婊一下觀眾說你們想要在戲院身歷其境

  我就直接讓天災降臨讓你們真實感受來真的

  然後劇情裡面上映的電影《科學怪人》

  是不是也算是在暗指人類玩弄自然（環境）

  最後遭到反噬（無法控制的天災）的隱喻

  當然以上只是我自己個人的腦補或是超譯的部分



  --'
