title: '[好雷] 龍捲風暴-凱特好可愛'
content: '一部節奏滿順暢的電影


  起承轉合掌控厲害


  沒有拖戲


  也沒有為了轉到下一幕


  讓劇情嘎然而止的不滿足


  好啦 也許要親不親是尬了一些



  滿滿的鄉村音樂


  可以湊一串播放歌單放整天也開心



  耐操好用的四輪傳動


  唯一無法抵抗的是最高傷害級數的龍捲風



  南方口音懶懶軟軟的語調


  加上凱特的笑容


  認真工作的表情


  跟她髮型根本是絕配


  不論是盤起來 或是綁成馬尾 還是紮起來留個小尾巴


  都可愛到很難不看她


  光看她就值得了


  --

  可能有我自己的偏好吧

  她頭髮盤起露出後頸和下巴以及側臉的畫面 真的很美

  如果沒有前作可能評價會更好

  突然想到一個問題:

  那雞被龍捲風吹起來是怎麼存活的

  還能安全落地停在車蓋上XD'
