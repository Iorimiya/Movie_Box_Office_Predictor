content: "如果看過第一集龍捲風的觀眾\n應該會對龍捲風暴裡面隨處可見的致敬會心一笑\n雖然角色跟第一集的主角群沒有關聯 但還是可以看到一些彩蛋\n致敬的部分我想到的有:\n\
  \n桃樂絲再度現身 雖然重要性沒有第一集這麼高\n\n女主凱特的朋友被閃電打過 第一集其中一個角色就說過想被打過一次\n\n第一次遇到龍捲風 凱特一行人躲在橋下\
  \ 車子被吹走 第一集也有 不過那次沒死人\n\n與哈維同行的史考特戴墨鏡造型超像第一集那個角色 但最後他不聽主角話掛了\n這點史考特只被丟包\n另外有些路人造型也很像第一集主角群的角色\
  \ (想到已逝的影帝菲利浦QAQ)\n\n凱特跟第一集的比爾一樣 會透過泥土風向等觀察龍捲風走向\n\n這次沒有乳牛被吹起來 取而代之的是從天而降的雞\n\n\
  雙胞胎龍捲風依樣有出現\n\n最期待的牛排加蛋沒出現 只有泰勒在凱特家吃的烤肉 這點好失望~~~~~~~~~~\n\n戲院被吹走也跟第一集露天戲院被吹走很像 (第一集有致敬經典電影鬼店)\n\
  \n最後一幕凱特開車衝進去龍捲風也是致敬第一集結尾\n\n\n\n整部劇情都很刺激 龍捲風出現次數很多\n覺得最精彩的是晚上在鬥牛後找地下室躲龍捲風那段\n不過看完龍捲風暴後還是覺得第一集的記憶點更深\n\
  尤其是喬與比爾在結尾用繩子捆住身體保命那段太經典了!!!!\n可惜網飛已經下檔 好想重看第一集\n\n\n--\n\n\n\n\n\n同場加映 \n\n--"
