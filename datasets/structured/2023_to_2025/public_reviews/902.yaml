url: https://www.ptt.cc/bbs/movie/M.1715350213.A.7A8.html
title: '[新聞] 《龍捲風暴》經典回歸 掀史詩級災難'
content: "《龍捲風暴》經典回歸 掀史詩級災難\n\n2024/05/10 05:30\n\n\n史詩級災難電影《龍捲風暴》曝光全新預告。（華納兄弟提供）\n\
  \n〔記者許世穎／台北報導〕史詩級災難電影《龍捲風暴》為1996年賣座鉅片《龍捲風》的\n現代篇章，金獎導演史蒂芬史匹柏再度出任監製，並由獲奧斯卡金像獎提名的《夢想之地\n\
  》編導鄭李爍執導，將於今年暑假帶來使人腎上腺素飆升的大銀幕冒險之旅。\n\n\n黛西埃德加瓊斯（左）和葛倫鮑威爾在《龍捲風暴》追逐駭人風暴。（華納兄弟提供）\n\
  \n電影集合影集《正常人》黛西埃德加瓊斯、《捍衛戰士：獨行俠》葛倫鮑威爾一同演出。\n導演鄭李爍自小在美國中西部長大，直說龍捲風對他而言是種生活方式，但他表示監製史\n\
  匹柏才是真正的龍捲風狂熱者，「我給他看YouTube上的龍捲風影片，每看一支他都會說\n：『是的，是的，我有看過，我有看過。』」\n\n鄭李爍也表示，新片盡可能讓這一切變得身臨其境，「這會是一趟快樂、有趣的旅程！」\n\
  《龍捲風暴》預計7月17日在台上映。\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
