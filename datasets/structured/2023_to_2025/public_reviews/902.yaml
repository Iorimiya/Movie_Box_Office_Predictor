url: https://www.ptt.cc/bbs/movie/M.1722009830.A.708.html
title: '[雷] 龍捲風暴-不輸前作的好片'
content: '雷







  不太會寫心得，所以就單純列出個人覺得讓我感到驚豔的點


  (一)劇情方面：

  1.前面女主角失去三位朋友的心理創傷，在第一次追風時用得很好，後來她心態逐漸從還有

  點恐懼到最後自己敢一人開進龍捲風內，心理層次有做出來


  2.喜歡這次跟前作來說有點對調，女主角一開始不是在狂野的車隊，而是偏科學的那邊，這

  設計有新意


  3.雙子龍捲：這在前作也有出現，但這次設計成兩組人馬路線選擇之爭，用來一較高下，這

  點感覺就比前作優


  4.這次的龍捲風又多又過癮，尤其龍捲風經過工廠時引發爆炸，也是與前作不同的壯觀，一

  個接一個完全沒冷場，緊張感塑造得不錯


  5.這部最後雖然有點政治正確的女力發威，但完全不會讓人討厭，反而是一種救贖


  6.中間女主角脆弱的一面演得不錯，也一度被她演出感動，男女主角在家中跟媽媽的互動也

  讓人覺得溫馨，看來媽媽很滿意這女婿喔^^


  7.劇情設計成女主角以為牛仔們單純是為了追求刺激及出名才在追龍捲風，到後來發現他們

  是在做公益，連帶影響那位找他回來的朋友向善，編排也是很有層次及深度，跟前作也有一

  定呼應


  8.這次不只偵測龍捲風，還具體說明怎樣對社會有益，能讓龍捲風消散這點，我覺得比前作

  突破


  (二)角色塑造及道具

  1.簡單來說，主角就是男帥女美，兩個人未來都很有發展性


  2.女配角來說，我也滿喜歡一開始就領便當的那位，也是滿有潛力，牛仔車隊那個黑人女配

  角是神鬼奇航裡的那個女巫？男主角旁邊那個男配角一開始出現我也以為是強尼戴普，後來

  拿下眼鏡就不像了，這集選角也都不錯，科學車隊那個被噴滿臉泥巴那個，我原先以為是前

  作那個反派^^"


  3.我喜歡無人機這構想，顯示科技進步，又很帥，

  在龍捲風裡放煙火及鑽地的設備我也覺得不錯



  最後

  雖然這次沒去看4DX，但看一般廳也是很過癮，有機會二刷真的會想試試看

  另外不確定死侍及金鋼狼如何，至少選看這部我不會後悔，所以推一個


  --'
