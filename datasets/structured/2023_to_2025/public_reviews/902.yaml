title: ［普無雷］龍捲風暴
content: '1、災難片來說，差強人意。


  2、劇情片來看，平鋪直述。


  3、演員表現，普通，女主夠正。


  沒有冷場，順順的走，轉折無感，最多就

  是女主的心境轉變，剛好她夠正，所以會

  吸引人看下去。


  劇情跟前作無關，至於桃樂絲比較像是致

  敬，確實有出現，但跟前作無關。不過，

  劇情有個小巧思，會讓人會心一笑。


  主軸也不同，前作是研究，這一次就不暴

  雷，喜歡的可以進戲院看。


  畫面呈現有水準，真實感很重，但氛圍不

  太夠，會讓你開始緊張，然後就結束了，

  有點搔不到癢處的感覺。


  還是可以進戲院看，這種片在大螢幕才值

  得，也不會無聊到睡著。


  10分的話，我給8分，1分是女主太正。


  比較最近看的噤界3，頂多給5分。


  --




  我也不知道那算不算彩蛋，正劇感覺播完了，但還有一些影片，可以坐到開燈再離開。'
