url: https://www.ptt.cc/bbs/movie/M.1722615615.A.3CA.html
title: '[負雷] 龍捲風暴 女主正 特效好看 '
content: '雷文防雷資訊頁

  雷

  雷

  雷




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  不太會寫心得，單純交流分享。



  我是看一般場，非4D，

  整部電影，女主特效都沒問題，可以給好雷。



  主要是男主泰勒讓我有種不舒服的感覺。



  比如一開始，哈維接女主，

  女主在觀測風暴，男主走過去搭訕，沒有任何搭訕的動機吧？。

  好吧，本斥但正。



  第一場風暴追逐，

  男主的危險駕駛風格，導致讓我對他後面的災民關懷很有衝突感。


  中間男主不斷暗示明示，哈維的團隊有問題，


  雖然哈維確實是在和魔鬼交易，

  後來也自訴知道投資者的意圖，需要資金建立團隊。

  但女主也好像沒特別想聽哈維解釋，哈維呃一下女主就跑了。


  男主透過不斷的關心及一個披薩帶走女主。





  牛仔競技場風暴之後，哈維找到女主，

  說了一段「當初是我有罪惡感，但你只想拿到科學補助金」，大概這意思，

  這段話我一直覺得有點突兀。



  女主被哈維氣到回家，

  結果男主竟然可以追到家中？？？


  真的是人帥真好。


  即使後面解釋，是隊友想起來你上過新聞，

  不過這也不是構成，男主直接殺到家裡等女主的理由吧？



  這也是我整部電影中，最沒辦法接受的地方。





  在倉庫裡面，

  男主一直想要讓女主面對創傷，結果拋出他有實驗模型可以跑？


  這邊我只覺得為什麼男主的科技力，似乎比哈維的團隊更強？

  一個是百萬YT，

  一個是軍方科技出身＋多位投資人注資。





  後來哈維重新找到女主，看到男主出現在女主家門口，

  哈維整個都心碎了，哈維真的對女主付出所有。


  扛著被團隊隊友指責的壓力，讓女主重新追夢。

  將研究數據交給女主，讓女主去跑實驗模型。


  很有種在看網文小說的既視感。

  女主有個舔狗青梅，青梅讓自己變得更好，將一切給他，

  但是只有男主能夠讓女主有實現自我，

  所以舔狗最後還要笑著成全男女主（最後把車子釘住那段）





  然後中間好幾次，

  女主男主男二放棄當下的風暴研究，去救援去幫助災民，不是說這件事情不對，

  但就好像科學家放下實驗室，跑去當小說家，專業不對口。


  像是有一次，

  觀測板被風暴吹走，但裡面有觀測到很棒的數據，

  拿到之後，有機會對將來的風暴防災更有幫助吧？


  但女主選擇救援。


  想要救援更多人，應該是建立搶救團隊，而不是風暴團隊吧？



  補充一點，

  男主身為百萬YT，需要在災害現場去賣周邊籌資救災，總感覺微妙。






  最後，

  女主好看，

  特效很讚，

  這兩個沒毛病。


  --'
