title: '[討論] 《龍捲風暴》的演員（有劇情雷）'
content: '這裡不是要討論男女主角啦

  畢竟女主角的美跟男主角的紅一直以來大家都已經津津樂道了

  我只是想說電影一開始片頭就掛掉的女主角同學

  感覺很Q的金髮妹

  居然是《莎賓娜的顫慄冒險》的琪蘭席普卡

  好歹她也擔任過其他戲劇電影的女主角，還是她真的沒有那麼紅？

  戲份居然這麼少，這樣不太好吧

  然後男二旁邊一直看不起女主角的雞巴同事

  不就是我們岡恩最愛的新超人克拉克肯特的扮演者？

  還以為在電影後面的下場會很慘

  結果被潑了一身泥後也不見了

  希望他的超人電影能夠精彩一點



  --'
