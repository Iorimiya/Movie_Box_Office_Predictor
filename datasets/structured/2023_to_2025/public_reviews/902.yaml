url: https://www.ptt.cc/bbs/movie/M.1721517215.A.290.html
title: '[絕讚好雷] 其實是女科學家勵志片的《龍捲風暴》'
content: "基於前陣子在HBO GO看完1996海倫杭特的版本，\n\n當時覺得非常精彩，但都在趕著追風，對角色情感鋪陳稍嫌不夠力，\n\n新版《龍捲風暴》則是以女主角Kate克服傷痛重新追風甚至直面和龍捲風對決\n\
  \n的主軸去進行，但災難場景和龍捲風規模等級卻比1996年更加多元，\n\nCGI虛實交織，完全分辨不出哪裡是真景拍攝哪裡是特效，加上片中對\n\n破解龍捲風的大量科學知識，相信內行人和路過粉都能看得相當滿足。\n\
  \n\n看完這部一定要好好享受這個歌單，雖然動人心魄的配樂純編曲都沒收錄，\n\n但有滿滿鄉村樂，裏頭不少新歌都有用電影畫面拍mv \n\n\n下面這首是搭配女主角返家尋找初心的襯樂，雖然老梗但是我聽到還是十分感動。\n\
  \n\n\n\n（以下有詳細劇透，怕影響觀影的朋友建議看到這就好）\n\n\n不過和我同行的友人是想看到更多Glen Powell和災難場景，\n\n認為女主角內心戲很煩的也有XDDD\
  \ 因此發這篇文來提醒大家，這是很適合\n\n啟發小女生也可以當聰慧勇敢科學家的片，\n\n片中滿滿知識女力但卻不說教，卻又能讓你了解碘化銀原來可以對抗龍捲風、\n\
  \n風暴來臨時千萬不要待在車內等知識，就算不是追求被嚇刺激的觀眾也能很滿足。\n\n\n看似沽名釣譽的網紅Tyler原來是想用浮誇的方式吸引網友對龍捲風\n\n\
  有更多關心以便幫助災民，其實也是個資優知識份子，\n\n而擁有高科技與炒地皮賣保險金主的Javi才可能被投資客利用，\n\n種種不斷反轉的劇情和大場面災難讓人目不暇給。\n\
  \n\n至於有人覺得女主角跟泰勒沒有親到很可惜，但我覺得就是這種純純友誼以上戀人\n\n未滿的感覺才讓人意猶未盡，而且女主角人生大事都要琢磨許久，直接趕進度\n\
  \n跟男方怎麼樣反而不符合她細膩但喜歡多多琢磨的個性，\n\n中間也有施展幾招把泰勒騙得傻呼呼的XDD\n\n\n像是騙男主角要幫他買飲料那段太好笑了，還有Glen\
  \ Powell送披薩那段\n\n在門外的眼神，就是隻楚楚可憐的小狗，實在好可愛XDDD\n\n\n最後，想說一下很感動的就是這部明明有很多題材可以拍續集，\n\
  \n卻只以新聞標題的方式帶到三位熱血追風的科學家（對，Tyler也有相關學歷喔）\n\n要合作的消息，讓人意猶未盡反而想敲碗續集啊。\n\n\n--\n\n幻想●---------------☆\n\
  /﹀\n/\\ \n\n按a加入最愛\n\n--"
