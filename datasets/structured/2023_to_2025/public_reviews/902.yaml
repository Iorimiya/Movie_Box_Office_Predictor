title: 'Re: [好無雷] 《龍捲風暴》晃啊晃，很開心'
content: '請問 4DX 搖晃程度有好到願意再次進場體驗嗎？


  爬了一下 nobady98 的心得文，

  跟我一樣 4DX 初體驗都是《名偵探柯南：黑鐵的魚影》

  體感普通，只是了解原來 4DX 就這麼一回事~


  當天同廳休息一場次，接著看 MI7《不可能的任務：致命清算》4DX

  個人願意再次進場體驗飛車追逐跟火車那兩段！！！

  雖然版上大多負評，應該是看錯版本了，沒有 4DX 加持我也會覺得爛片


  最近還看了《特技玩家》4DX 跟《芙莉歐莎》4DX 搖晃程度都覺得普通

  不知道《龍捲風暴》的 4DX 會讓人失望嗎？


  有好到願意再次進場體驗嗎？


  --'
