title: '[好雷] 約見波布'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  為期一個月的2025台灣國際人權電影節，選擇柬埔寨導演潘禮德的新片《約見波布》做為

  開幕片。長年聚焦民主柬埔寨的暴政與屠殺等相關議題的他，繼《消失的影像》後，再度

  代表柬埔寨角逐奧斯卡最佳外語片，只可惜本次未獲提名。



  1978年，三名外國記者在重重警戒下，踏進由波布統治的紅色高棉，展開一趟訪查之旅，

  曾為昔日同窗的亞蘭更滿心期待與波布重逢。原本排定與波布的會面，一再推遲。



  手雕手繪的泥偶塑像是潘禮德的特色，在《約見波布》裡，仍舊能夠看到這些人偶的「演

  出」，主要原因有二。首先是崇尚真實的導演認為自己沒辦法叫健健康康的演員，為了呈

  現出飢荒的場景，特別減重，更不要說讓真人演出大屠殺的情節；再者則是對潘禮德來說

  ，這些恐怖的過去已無法再現，以模型與人偶象徵當時發生的事情，只要觀眾也能理解，

  甚至自行想像，便已足夠，不需要特別將不堪入目的畫面放在大銀幕上。



  不過，以紀錄片聞名的導演，仍然在《約見波布》中放進不少真實畫面。即便都是黑白檔

  案，不論是動態影像，還是靜態照片，還是能在模糊虛實界線的同時，帶給觀眾當下的震

  撼。潘禮德提到，很多畫面都是紅色高棉剛解散的時候，外國媒體希望知道當地究竟發生

  什麼事而留下來的珍貴史料。即使保羅與莉絲無法以相機與攝影機記錄下自己親眼所見，

  現實中幾十年後的觀眾，還是在導演的作品裡，透過兩人的雙眼，看見當年被隱藏的真相

  。



  電影裡的三名主角身分為記者，分別在這場訪查之旅中經歷不同程度的迫害，而成立於法

  國的國際記者聯盟與無國界記者便是為了保護記者不受迫害，強化記者的人權，並促進新

  聞自由而存在的組織。由國際紅十字會推動與執行的《日內瓦公約》明定，只要不是經國

  家准許伴隨部隊前進的「戰地記者」，都應秉持保護平民的規定與原則，給予保護與尊重

  ，但不管是在公民抗命運動的示威現場，還是威脅更高的戰地，都不時有記者遇襲甚至遇

  害。



  新聞自由是民主表現的指標之一，但無論是「國際民主及選舉協助研究所」發布的《2025

  全球民主現況報告》，還是「無國界記者組織」公布的2025年「世界新聞自由指數」，都

  顯示出全球的新聞自由正面臨近50年來最嚴峻的挑戰。雖說多數惡化的國家皆深陷貧困、

  政治動盪與長期內戰所苦，但多達60%的國家排名下滑，顯見普遍情況不樂觀。《約見波

  布》裡的記者「受邀」前往赤棉採訪，只能報導安排給他們的行程，凡是稍具媒體素養與

  獨立思考的記者，馬上就會察覺到異狀。



  保羅打從一開始就不願屈就於蒙蔽他們雙眼的謊言，所以一再偷溜，試圖挖掘一些禁止他

  們報導的真相，最後果然因此惹禍上身。莉絲對於參訪行程其實也不以為然，幾次訪談下

  來，不論她提出的問題有多尖銳，都讓莉絲覺得自己的提問未獲正面回答。但是，她有自

  己的盤算，打算在三人到金邊去訪問波布時，到處晃晃尋找自己的口譯朋友，所以才先按

  兵不動。可是，後續抵達金邊後，莉絲才知道自己的計劃其實都是多餘的，整座城市空蕩

  蕩，一個人影都沒有。那時的她八成也早已放棄尋找朋友的希望，畢竟連同行的記者都已

  不知去向，遑論赤柬認定為「知識份子」的親西方四語人才。



  片名開宗明義說我們所看到的一切都是為了要「約見波布」，莉絲與亞蘭最後的確也見到

  他本人，但對觀眾來說，其實都是只聞其聲，不見其人。一方面可能是潘禮德希望保留神

  秘感，不讓民主柬埔寨的實質領導人曝光，就像他以「第一兄弟」等各種不同的稱號自稱

  ，就連波布也只是化名，一方面或許是由於演出波布的就是導演本人，他可能不想要自己

  以這樣的形象出現在大銀幕上。就連本來要出演波布的演員，最後都因為無法違背自己的

  理念而臨陣脫逃，何況是親身經歷紅色高棉大屠殺的潘禮德呢？可是，導演最後還是把波

  布撫摸貓咪的姿態、神韻與語氣揣摩地恰到好處。



  雖然波布出身農家，與他後來主張的農業社會主義烏托邦相符，但波布一家也算富有，推

  崇取消貨幣與市場的極端共產主義，實則無法理解。再加上他自己留法接受高等教育，卻

  大規模屠殺知識份子，甚至自我清洗黨內幹部，就連家族內也不乏死於赤棉統治的農民與

  知識份子，讓許多家人也對波布不諒解，只能說如同他在《約見波布》中對老同學亞蘭所

  說：「寧可錯殺，不可錯放。」凡是不完全認同波布理念的人皆為異己，就像亞蘭只是提

  出「萬一無法達成目標」的質疑，最後就遭到謀殺。



  雖說《約見波布》是歷史劇情片，但亞蘭的遭遇依舊有所本。電影改編自美國記者伊莉莎

  白‧貝克的非虛構文學《當戰爭結束時》，內容講述其在1978年前往赤柬的記事。畢竟是

  劇情片，為了保有創作的張力與自由，潘禮德在改編時更動了一些細節，與史實並非完全

  吻合。當年與貝克一同拜訪民主柬埔寨的其中一位是學者而非記者，而另一位美國記者並

  未如片中的保羅一樣消失，但那位支持紅色高棉的英國學者馬爾柯姆‧考德威爾的確在與

  波布會面幾小時後遇害。



  導演把三位訪問人員的身分都設定為法國記者，提升赤棉幹部對他們的反感與戒心，並強

  化現今新聞自由的可貴與重要，同時將行前最推崇赤柬的亞蘭設定為長年與波布通信的老

  同學，卻在實際會面後，對於對方正在做的一切與野心感到害怕，搭配其最後的下場，為

  電影的結局增添反差與戲劇張力。《約見波布》也從莉絲的角度寫下一些伊莉莎白書裡的

  內容，像是：「我們在泡泡內旅遊，沒人能自由與我們交談。」一針見血地點出那趟訪問

  最可怕也最真實的無奈。


  --

