url: https://www.ptt.cc/bbs/movie/M.1689563296.A.08C.html
title: '[垃圾雷] 史上最難看的陰兒房：鬼門陰深處'
content: '＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝防雷＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝
























  劇情：


  男主角與兒子道騰在歷經靈魂被鬼綁架事件後

  找專家透過催眠來忘記跟鬼有關的一切回憶

  包含父子兩人會靈魂出竅的能力通通遺忘


  幾年後男主角跟老婆離婚

  男主角因為腦霧與長期幻覺頭腦不清楚

  道騰叛逆期不爽爸爸這幾年都沒關心他

  兩人長期冷戰中


  這天大學開學

  男主角開車帶道騰去大學讀美術系

  一到宿舍兩人又吵架

  男主角：「你居然變成一坨不知感恩的shit！」

  道騰：「難怪媽要跟你離婚！」

  兩人不歡而散


  道騰晚上洗完澡一開房門就看到

  黑人女室友開心地吹著口風琴一邊跳著舞

  彷彿在歡慶：嘟嘟嚕～現在的恐怖片也要政治正確呦～


  隔天道騰去上美術課

  老師教學生畫畫搞得像要帶學生觀落陰

  要學生畫畫前 還講一堆鬼話＋倒數

  「你會想起...最深...最深的事情...5.4.3.2.1」

  男主角聽完倒數直接天靈蓋又打開

  憑著兒時記憶畫出一道門

  門上還突然像月經來一樣在流血


  道騰回宿舍開始摸那個門

  門像受到刺激一樣血越流越多

  道騰狂摳直到整扇門都變成紅色

  然後道騰就把這幅血門掛在床邊牆上欣賞

  ？


  隔天黑人女拉道騰去兄弟會派對

  道騰在兄弟會派對的房間

  看到廁所裡有隻鬼趴在馬桶旁一直吐

  鬼喊「關上門！」

  人家在吐 道騰還一邊看一邊靠近

  看道騰還一直看 鬼又衝過來大喊「關上門！！」


  道騰驚魂未定的回到宿舍

  坐在椅子上突然靈魂出竅

  這令道騰又驚又喜

  還變態的闖入黑人女房間偷吹她的口風琴

  黑人女被嚇醒 他得逞後趕快回到自己身體

  黑人女衝到他房間責問「你是噁男嗎？」


  後來黑人女上網查跟道騰說 「哎呦～你這個叫靈魂出竅喔～」


  道騰：「那我要再靈魂出竅去追問那個派對鬼 為什麼要叫我關上門」

  ？？


  於是黑人女陪道騰回到當時兄弟會派對房間來靈魂出竅

  道騰出竅去找嘔吐鬼時 有個鬼掐住黑人女的脖子

  直到道騰趕回到他的身體才停止

  黑人女上一秒還興致勃勃陪道騰來

  下一秒翻臉暴怒「都是你！老娘會被你給害死！」

  ？？？


  晚上黑人女突然想開了 又來道騰房間示好

  「我阿嬤說不要用簡訊吵架」

  卻赫然發現道騰已經被厲鬼附身

  臉變成神似大蛇丸的五官

  準備要殺掉她


  同一時間

  男主角靈魂出竅出發去救兒子道騰

  道騰像第一集一樣被關在惡魔的房間

  坐在一堆課桌椅堆成的牢籠裡面發呆


  男主角拿斧頭過來砍斷道騰腳上的鎖鍊

  「斷開魂結！斷開鎖鏈！」

  之後拉著道騰逃跑


  兩人逃出紅色的門

  沒想到這時惡魔卻追上來

  男主角用身體壓著那扇紅門說：

  「你快走！」


  道騰就先烙跑了


  惡魔持續撞門

  接著開始特寫男主角猙獰的臉流著淚

  「再見了～就由我來結束這一切 」

  （畢竟我才是陰兒房主角）

  （第一次當導演 這邊我要給觀眾看我的演技）

  演了快一分鐘男主角用身體抵著門大吼


  突然門的頂端開始變黑


  原來回到現實的道騰拿黑色顏料把紅門像塗黑


  但是道騰可能希望爸爸被折磨久一點

  拿一支超級小隻的筆刷來塗


  眼看惡魔快要把門撞開

  「啊啊啊啊！！！」爸爸用盡全身力氣在抵擋

  一邊看門慢慢被塗黑

  千鈞一髮之際 門終於被完全塗黑


  爸爸順利回到現實


  最後一幕

  道騰在宿舍房間掛上  爸爸公主抱著道騰的畫像


  父子相抱而泣

  男主角：I love you son.

  道騰：Dad I love you,too.


  Happy Ending



  心得：


  這應該是由始以來陰兒房系列最糟的電影

  從開頭Insidious下標的位置插的這麼生硬就感到不妙

  全片大量使用大白天卻調低亮度冷色調的濾鏡

  整部片的節奏很緩慢無聊

  恐怖的氣氛沒有足夠的堆疊時間

  常常在不同氣氛之間生硬的切換

  只有沒幾幕jump scare

  手法也了無新意

  惡魔本身也長得不可怕

  比較可怕的也只有出現一秒的客串新娘鬼


  無論是回憶畫面或是畫作的呈現

  都沒有讓觀眾相信當年的威脅有多令人恐懼

  靈魂出竅只是原場景加藍色濾鏡地板加乾冰

  跟第一二集那種真的有去無回的恐懼感相差甚遠


  導演有野心想要拍一部不只有恐怖的恐怖片電影

  卻忘記恐怖片的本份就該以恐怖為優先

  且親情線故事令人感到乏味尷尬


  劇本與人物刻畫可以說是相當之糟糕


  惡魔房間的道具與佈景假的令人出戲

  還給一堆大特寫怕大家看得不夠清楚


  --'
