url: https://www.ptt.cc/bbs/movie/M.1689324742.A.3CC.html
title: '[ 負雷] 陰兒房：鬼門陰深處'
content: '我覺得這是系列最差的一部


  4已經夠差了 想不到5還能更差


  全片大部分都是父子親情的老梗


  節奏非常的緩慢 前面鋪陳的很長


  後面拿出來的也沒什麼特別


  不懸疑 都是預料中的展開


  全片高潮部分很無聊


  還沒前面幾個的jump scare嚇人


  僅剩的優點是jump scare


  比同類型的片恐怖 掌握的不錯


  有幾幕驚嚇度有到








  ~~~~~~~~~ 雷~~~~~~~~~~~~~~





  其實也沒什麼雷 因為沒什麼劇情


  就是高潮部分真的很老套


  又是父子在鬼門 虛實交錯的片段


  反覆來回 讓人看的煎熬


  妖魔鬼怪也是一晃而過


