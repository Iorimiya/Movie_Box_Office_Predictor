title: 'Re: [ 負雷] 陰兒房：鬼門陰深處'
content: '借標題

  防雷頁

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .


  陰兒房系列最無聊的一集

  全劇濫用JS，氣氛營造大輸其他系列

  想弄一些懸疑的橋段

  都是之前別人玩過得全部搬過來演一遍

  例如厲陰宅2小演員在畫面中焦外慢慢變臉

  致敬沒有不可以，但能不能用的巧妙一點

  描述一點也沒有意義的鏡頭

  想營造氣氛的任務幾乎失敗

  就是做到那種「喔功課我都有寫喔，但是字跡醜到不行的成果」


  陰兒房系列在原編劇撰寫下

  都有有一個精彩的反轉

  例如第一集靈騷現象原來是過去賈許

  第二集賈許慢慢露出附身的模樣

  以及媽媽去找出鬼新娘的過去


  本傳之後以愛麗絲的角度出發

  第四集是結合辦案，與童年記憶的反轉

  第三集則是愛麗絲遭受生活上的打擊

  但在救人的過程中慢慢找回自己


  我自己個人最喜歡是第三集

  嚇人橋段最多而且有創造出經典

  用了很多很真實的遇鬼經驗會描述的橋段


  例如：

  遠方會有別人對自己揮手、利用靈騷現象消磨心智最後達成控制的意圖


  以上這些本片通通沒有

  就是爸爸跟兒子再度開始遇鬼

  然後聯手解決問題

  什麼懸疑什麼氛圍通通跳過

  只有冗長的鏡頭語言跟無意義的對話


  唯一賣點就是大團圓

  所有演員都歸來

  衝著這點，我算看了一部溫馨


  對了，本片有彩蛋

  就是片尾被道頓封印的門

  上面有一盞燈，突然又亮了


  以上。



  --'
