url: https://www.ptt.cc/bbs/movie/M.1701309448.A.3A5.html
title: '[娛雷]陰兒房：鬼門陰深處'
content: "雷文防雷資訊頁\n手機排版請見諒\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n核磁共振那麼短愛爬不爬的\
  \ 也不怕男主角馬有失蹄往頭踹嗎 男主角頭旁邊的手是在幹嘛\n 直接從頭頂處露臉不是才有效率嗎\n\n在玩親族對對碰的時候獨漏父親的牌搞得父親很不爽 氣到彈出來撞出照片給男主角看\n\
  不是  虎毒不食子你有話不會好好講嗎 根本傲嬌\n\n原來是精神科集體治療啊 我還以為我選到畫畫課了\n\n廁所鬼吐了兒子滿嘴穢物 兒子竟然沒被奪舍 KPI減1\n\
  \n兒子怕黑偏偏在宿舍都不開大燈 室友有保護色你不怕踩到室友被告嗎 媽媽也很奇怪 給\n那麼小的夜燈難怪兒子氣到不接媽媽的電話 校方也很糟糕每晚都停電 好兩光的學校你要\n\
  不要重考\n\n尼克的媽媽就這樣放陌生人進家裡不太明智 至少要跟在身邊帶路 尼克和女同學在房間那\n邊我以為會有多餘(x)的調情戲結果沒有 是很認真地在討論功課\
  \ 其實尼克是純情男孩對\n吧\n\n室友遵循鬼片公式有不死之身是個好孩子 切八段切完了還是願意回頭幫兒子 緊要關頭還\n算可靠\n\n男主角的太太aka前妻蠻倒楣的\
  \ 都生了3個才知道自己嫁了有Astro星光體體質的人 跟著\n撞鬼差點沒命還要幫圓謊 寫進族譜的備註欄吧 Dalton相親前記得開誠布公\n\n--"
