url: https://www.ptt.cc/bbs/movie/M.1735312810.A.611.html
title: '[好無雷] 音速小子3 金凱瑞粉絲的禮物'
content: '如題


  第三集真的贏前兩集不少


  雖然也是子供向但打戲真的太精采了

  真的像版上說得一樣像七龍珠


  而且我在音響比較好的廳

  打戲的重低音直接讓整個影廳震起來很過癮


  然後喜歡金凱瑞的人一定會愛這部

  這部除了前兩集就有的金凱瑞招牌浮誇表情及幽默

  還給了《楚門的世界》般的感動


  爽片推推推



  --'
