title: '[負雷] 音速小子3 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






















  我個人覺得因為有個第二集在那

  所以3變很難看


  首先是場景，第一集沒經費我能接受就是小家子氣

  第二集有錢，搭出了類似電玩世界的海邊場景

  第三集拉到東京是還不差，但電玩味就少了很多

  不過還能接受

  後面月球就.......空虛



  不能接受的是蛋頭博士的機器

  第二集的超巨大博士型機器人就是我從小最喜歡的

  這集大概是因為暗影太強，所以沒什麼機器人的戲份

  那個雷射塔也很無聊



  然後戰鬥不喜歡就是兩個超級賽亞人3互毆

  想看點呈現速度的

  開場的那幕和東京追逐還比較好



  當作是我個人喜好

  我比較想看到蛋頭的機器人和較電動風場景


  --'
