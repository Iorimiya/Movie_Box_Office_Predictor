title: '[討論] 音速小子3 vs 木法沙 美加票房咬緊緊'
content: '聖誕節假期因為寒假有兩個禮拜，有小孩的家庭可能選擇平常日去看，而不是擠在週末，

  所以會開局比較低，但是默默賺大錢。


  Sonic 3 跟 Mufasa 因為同一天在美國上映，又都是子供向，所以常常被拿來比較。

  靠著狂熱粉絲的支持 Sonic 3 前三天以 77% 六千二百萬輾壓 Mufasa 三千五百萬，

  但是在聖誕節跟元旦當天又被 Mufasa 超越，目前兩方 Sonic 領先 9 天，Mufasa 領先

  四天，甚至有天差距不到 $7500 ，看起來獅子王會比較長賣。


  目前雙方進入膠著戰，前所未見，真的是非常有趣的戰局。




  +------+-----------------------+----------------------+-------------------+

  | Date | | | Daily Difference  |

  +------+-----------------------+----------------------+-------------------+

  | 12/20/24 | $13,340,381.00 | | $12,109,174.00  |

  | 12/21/24 | $11,850,488.00 | |  $7,470,458.00  |

  | 12/22/24 | $10,218,496.00 | | 12/23/24 |  $7,083,956.00 | |  $2,965,961.00  |

