title: '[[好雷］] 音速小子3'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~








  《音速小子3》延續了前兩集的成功

  表現精彩，這系列沒有崩掉令人欣慰

  基哥的角色塑造相當帥氣，能在大銀幕再次看到金凱瑞幽默的表演也是一大享受

  打鬥場面節奏緊湊，看得過癮，特效也不至於讓人出戲

  雖然劇情上有些問題，但不太影響整體觀感，足夠爽


  系列中最好的一集，尤其第三幕的動作場面，算上今年看過最好的動作戲之一….

  隨著第二集結尾留下的伏筆，原本以為故事發展會受限，但第三集依然帶來了驚喜

  片尾彩蛋讓人期待





  第二集結束還想說，超級索尼克都出現了

  第三集還能怎麼打，結果夏特也變身

  超級帥的…打得毀天滅地

  片尾沒想到是夏特…還以為是蛋頭


  女朋友來了、夏特復活加上蛋頭變友善…

  這集已經打上宇宙，兩位超級強度

  這下不知道第四集強度會有多高啊啊啊



  --'
