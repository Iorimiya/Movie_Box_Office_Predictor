url: https://www.ptt.cc/bbs/movie/M.1735369032.A.870.html
title: '[好無雷]'
content: '因為阿母很少看電影，這片又好評不斷，特地帶她去看。

  到國賓看，會員230元，敬老票155，兩人花了385元。


  我雖然是SEGA老粉，但只玩過MD版的SONIC一代，

  這遊戲我不是很有興趣。阿母更是完全不知道這是啥玩意。


  整片可以說是毫無冷場，一開始就直接入主題。

  雖然索尼克小組因為設計有點卡通化和現實場景有違和感，

  但很快就習慣了。

  劇情很老套甚至可說毫無意外，

  但是在輕快的節奏和金凱瑞的強力carry下瑕不掩瑜。

  最後的大戰打得天翻地覆相當精彩，

  只是索尼克和夏特變身後有點難分辨。


  散場後問阿母好看嗎？

  她雖然看不太懂在演什麼但也覺得娛樂性不錯。


  片尾有2個小影片，一個是要等到最後字幕跑完才有，而且只有幾秒。


  如果你沒看過前2集，我覺得也是可以看，只是會少一點點樂趣。


  最後說一下，我看那場全場只有9個人。

  電影業的寒冬...........


  補充，國賓現場付款竟然只收4家銀行的信用卡，

  連售票和販賣爆米花都整合一起了。

  是要節省成本到這種地步了嗎....


  --'
