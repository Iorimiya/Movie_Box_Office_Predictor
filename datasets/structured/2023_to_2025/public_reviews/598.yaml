title: '[好雷] 超神級娛樂片「音速小子3」'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這部片太神了，完全沒有任何缺點

  從角色刻劃，動作場面，劇情編排，都達到爐火純青的境界

  前兩集兒童取向的幼稚劇情全部消失，變成成熟的大人之作

  看到瑪麗亞那邊我都哭的亂七八糟的

  動作場面更是讓七龍珠相形失色，整個打到宇宙都快爆炸了

  金凱瑞再次帶來經典橡皮臉雙倍誇張演技

  很多劇情問題都很輕鬆地就解決掉了，比方說索尼克要拿綠寶石報仇的時候

  納克魯斯本來要阻止的，結果放一個丑角當守門員，一下子就被拿走了

  這麼精巧的編排我此生第一次看到

  千萬不要錯過如此神作

  這部不看，整年白看!


  --'
