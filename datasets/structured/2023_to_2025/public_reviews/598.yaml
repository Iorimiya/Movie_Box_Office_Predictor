url: https://www.ptt.cc/bbs/movie/M.1724945179.A.A54.html
title: '[新聞] 金凱瑞重返《音速小子3》 反派變盟友'
content: "金凱瑞重返《音速小子3》 反派變盟友\n\n2024/08/29 05:30\n\n\n金凱瑞（左）再度於《音速小子3》化身蛋頭博士，這回和音速小子索尼克結盟。\n\
  （UIP提供）\n\n〔記者許世穎／綜合報導〕賣座電影系列新篇章《音速小子3》前晚曝光首支預告，音速\n小子索尼克、納克魯斯和塔爾斯組成「索尼克小隊」，共同對抗由「基哥」基努李維獻聲\n\
  、力量強大的全新敵人「夏特」，展開精彩刺激的冒險。 前兩部《音速小子》分別於\n2020及2022年推出，全球累積票房高達7.07億美金（約台幣225.95億元），第3部也由班\n\
  許瓦茲、伊卓瑞斯艾巴、柯琳歐尚納希再度為索尼克、納克魯斯和塔爾斯配音。\n\n\n《音速小子3》全新敵人「夏特」由基努李維配音。（UIP提供）\n\n有趣的是，由於「索尼克小隊」不敵夏特的威力，只好求助於前兩部中由金凱瑞飾演的大\n\
  反派「蛋頭博士」，蛋頭博士也搖身一變成為新盟友，幫忙阻止夏特毀滅地球。金凱瑞還\n在預告中表示：「既然不能統治世界，那救救它總可以吧？」讓影迷相當期待。《音速小\n\
  子3》將於12月27日在台上映。\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--\n\n\
  \n\n\n\n上座部佛教馬哈希帝釋所問經講記77頁戳破大乘妙法蓮華經\n帝釋所問經講記78頁開示說明假佛教大乘西方極樂世界是外道邪見（常見）假裝佛教"
