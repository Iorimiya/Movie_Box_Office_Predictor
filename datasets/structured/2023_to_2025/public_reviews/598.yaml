url: https://www.ptt.cc/bbs/movie/M.1734762510.A.D72.html
title: '[  雷] 很好看的音速小子3'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  有幸換到了音速小子3的特映票

  前面二集我覺得蠻好看的 但有時人類戲份就很拖時長

  像第2集結婚那段好笑歸好笑,但跟音速小子無關

  這一集就完全沒這問題








  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  真正的七龍珠真人電影版


  有一段根本是抄   XDD


  超級索尼克打超級夏特根本是超級賽亞人對打

  速度感、超必殺威力綜合起來的感覺 可以跟mos一拼

  但打擊感就輸MOS了,MOS打擊10的話音速小子大概6、7而已

  贏MOS在索尼克他們有光線特效加成,配上又是超級賽亞人狀況 真的很炫


  僅僅1.2億美金的預算太扯,裡面一堆CGI特效質感很不錯的

  從地球打打打打到宇宙 還造了太空武器 還有小黑洞滅山


  劇情就還行 索尼克好友人類的戲份幾乎用到最低了,而且對劇情推進也還蠻有用的


  金凱瑞就還是金凱瑞 肢體動作太強 還一次來二個


  但一刻都沒有為了夏特與金凱瑞的爆炸悲傷



  馬上就來了一堆金屬索尼克還有艾咪

  2027 金凱瑞都65了...不知道還會不會接


  --'
