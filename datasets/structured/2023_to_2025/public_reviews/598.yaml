url: https://www.ptt.cc/bbs/movie/M.1735812704.A.553.html
title: '[普雷]  音速小子3'
content: '整體看了是會被娛樂的爆米花片

  以下有雷

















  優點：

  1. 劇情簡單小孩好懂

  2. 剪接節奏快，知道重點要留給索尼夏特&蛋頭博士

  3. 喜歡金凱瑞的人會很喜歡很喜歡


  缺點：

  1. 部分背景資訊對第一次看的人不太夠（續集的壞處），簡單30秒的黑頁或是多三句台

  詞解釋一下會很有幫助

  Ex:

  -Gun是什麼樣的組織？

  -Gun的老爺子為什麼特別信任索尼？

  -蛋頭爺爺年輕在做什麼實驗？

  -蛋頭爺爺為什麼不愛孫子？

  -守護王者翡翠的人為什麼那麼隨便？



  2. 關鍵情緒、關鍵轉折不夠飽滿

  Ex:

  -夏特為什麼最後良心發現不該毀滅地球？

  我知道有鋪陳夏特打傷湯姆看到索尼傷心、夏特問爺爺毀滅地球是不是瑪麗亞想要的。

  但最後其實是因為索尼不扁他而轉念，作為劇情最重要的關鍵我覺得太牽強


  -蛋頭爺爺是因為痛失孫女才想毀滅世界嗎？那孫子不好嗎？


  -蛋頭為什麼轉變成想拯救世界？跟著其他三隻搭金幣下去不香嗎？




  3. 打鬥有點多…

  這個見仁見智啦，個人對動畫打架比較無感

  畢竟都知道公式是主角前期輸、後期贏




  最喜歡的地方：

  跟別人不一樣，我最喜歡這部刻畫紅色那隻Nacos


  前期嫌主角弱、跳傘喊team Nacos

  中期合作要闖進總部時，大家耐住性子教他緊急狀態再打破玻璃，而他經歷了三次維大力

  義大利後，是有學會的！

  團隊溝通的重要，我覺得在這個細節上處理的很棒，對兒童觀眾來說是很棒的示範

  後期即使反對交出翡翠，但仍為信守諾言而讓步

  結尾親自跳下飛船拯救隊友，並認同

  team sonic


  這是我覺得最飽滿、最喜歡的部分


  --

  讚讚讚

  原來如此 感謝補充

  我是不介意電影這樣表現，畢竟親子向電影打好打滿不會錯

  但我也想表達我個人喜歡的電影風格，這不衝突對吧～

  說他笨蛋也太壞了xd'
