title: '[情報] 《音速小子 3》票房成遊戲改編電影第二'
content: '截至2月2日止，《音速小子 3》票房來到4.62億美元，擠下《名偵探皮卡丘》(4.5億美元)

  ，成為遊戲改編電影第二名。


  目前遊戲改編電影票房第一的是《超級瑪利歐兄弟電影版》(12.6億美元)，第四名是《魔獸

  ：崛起》(4.39億美元)，其後則有《毀滅大作戰》(4.28億美元)、《秘境探險》(4.07億美

  元)、《音速小子 2》(4.05億美元)。



  ng-video-game-movie-of-all-time




  --'
