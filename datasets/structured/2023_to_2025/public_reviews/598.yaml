title: '[新聞] 爭霸北美票房 獅子王、音速小子3分居寶座'
content: "爭霸北美票房 獅子王、音速小子3分居寶座\n\n2024/12/30 16:08\n\n（中央社洛杉磯29日綜合外電報導）北美院線耶誕檔期有2部強片爭霸，由「獅子王：木\n\
  法沙」與「音速小子3」分別位居5天耶誕假期、3天週末假期的冠軍寶座。\n\n根據追蹤票房數字的北美院線聯盟（Exhibitor Relations），迪士尼動畫片「獅子王：\n\
  木法沙」（Mufasa: The Lion King）於25至29日期間在北美吸金6380萬美元，排名居冠\n。\n\n法新社報導，在上述5天假期中，動作喜劇片「音速小子3」（Sonic\
  \ the Hedgehog 3）也\n有5990萬美元入袋，但在27日至29日的週末假期中，「音速小子3」以3800萬美元票房險\n勝「獅子王：木法沙」的3710萬美元。\n\
  \n分析師葛羅斯（David A. Gross）表示，總體而言，耶誕週末「可觀的票房數字」雖未打\n破紀錄，但預期「接下來7天的元旦假期表現應該相當出色」。\n\
  \n新片「吸血鬼：諾斯費拉圖」（Nosferatu）也取得亮眼成績，5天票房斬獲4030萬美元，\n週末票房為2120萬美元。\n\n葛羅斯形容，這是「恐怖新片的絕佳首映表現」，影評人對此片也評價頗高。\n\
  \n「魔法壞女巫」（Wicked）的5天進帳為3170萬美元、3天收入1950萬美元，在排行榜上滑\n落1個名次至第4位。這部由辛西婭艾利沃（Cynthia Erivo）和亞莉安娜（Ariana\
  \ Grande\n）主演的音樂奇幻片開映至今全球總票房已達6億3400萬美元。\n\n排名第5的迪士尼動畫「海洋奇緣2」（Moana 2），5天票房估計2830萬美元、3天收入估\n\
  1820萬美元，名次比上週滑落一位，但已連續5週霸占排行榜前5名。\n\n第6名「巴布狄倫：搖滾詩人」（A Complete Unknown）的5天票房為2330萬美元、3天收\n\
  入為1160萬美元。\n\n排名第7至第10的電影依序為「乖女孩」（Babygirl），5天票房720萬美元、3天票房440\n萬美元；「神鬼戰士II」（Gladiator\
  \ II），分別斬獲590萬美元、420萬美元；「美好家\n園」（Homestead，暫譯），530萬美元、320萬美元；「內心之火」（The Fire Inside，\n\
  暫譯），430萬美元、200萬美元。（譯者：紀錦玲/核稿：施施）1131230\n\n#北美 #亞莉安娜 #法新社 #迪士尼 #北美票房 #葛羅斯\n\n--\n\
