title: '[好雷] 青春豬頭少年不會夢到嬌憐外出妹'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  改編自《青春豬頭少年》系列小說，《青春豬頭少年不會夢到嬌憐外出妹》是系列的第二

  部劇場版。第一部比較像前傳的話，《嬌憐外出妹》就是接續在電視動畫《青春豬頭少年

  不會夢到兔女郎學姊》之後，也是高中篇的尾聲，對於系列影迷來說是階段性的完結篇。



  某一天，長年以來一直喜歡待在家中的妹妹花楓向哥哥咲太坦白自己不曾告訴過其他人的

  心聲。雖說知道這是非常困難的選擇，但咲太還是決定溫柔地在花楓背後支持她。這是兩

  個人一起朝未來踏出步伐的故事。



  與電視動畫與前一部劇場版不同，《嬌憐外出妹》講的就是妹妹花楓，也就是說，這部劇

  場版的主角是妹妹。電視動畫的最後兩集說明在經歷種種事情之後，曾經遭受霸凌而「解

  離」的花楓如何在哥哥的幫助與陪伴之下恢復記憶。雖然恢復記憶是好事，但過去兩年的

  相處以及為了讓妹妹重返校園所做的一切努力又得重頭開始，而這些心境就是《嬌憐外出

  妹》的核心故事。了解來龍去脈的話，在電影最後看到花楓不但勇敢外出，甚至懂得考量

  自己的特性為自己做出最好的決定，的確是極為感動的一幕，但對不了解《青春豬頭少年

  》系列的影迷來說，可能會由於不了解妹妹過去到底發生過什麼事，而滿頭霧水、無法進

  入感傷的情緒裡，稍嫌可惜。



  《青春豬頭少年》系列主要從兩個面向談「青春期」這件事。主角之所以是「青春豬頭少

  年」，是因為他大體來說不太在意所謂的「青春期潛規則」，他不在意他人對自己的看法

  ，別說智慧型手機他是連手機都沒有；片中經常提到的「思春期症候群」其實是將現實生

  活中青春期的少年少女會遇到的各種問題以奇幻的方式誇大呈現，並將其稱為一種症狀，

  讓觀眾得以從客觀的角度來看待這些現象。舉凡霸凌、課業壓力、社群媒體、容貌焦慮、

  存在感、與兄弟姊妹比較、愛情煩惱等議題都有在系列當中提及。



  雖說主角是花楓，但喜歡麻衣與咲太曖昧的感情戲的影迷也不會失望，電影當中還是有不

  少兩人之間的互動，仍舊是相當適合情侶或曖昧中的對象一起觀賞的作品。既然本作的分

  類是戀愛、感人、青春與校園，劇場版當然是各個元素一個都不會少。在戀愛與青春仍然

  佔據一半比例的情況下，麻衣與哥哥兩人之間還是有各種甜而不膩的戲份讓大家滿意。除

  了讓麻衣與妹妹到咲太家教妹妹讀書之外，兩人的關係也繼續向上升溫，互動也更加親密

  。



  劇場版裡的主角花楓是霸凌主題的延伸，她在高一的時候由於回覆訊息比較慢而遭到同學

  霸凌，進而在網路上受到謾罵，不僅懼怕上學，甚至嚴重到解離，所以劇情設定上她一直

  都是在家生活。《嬌憐外出妹》則是描繪她如何走出陰霾，心理層面之外也搭配日本的學

  制與升學壓力。哥哥面臨考大學的一年，目標是考上品學兼優的學生藝人女友的大學，雖

  然咲太成績還不錯，但那所大學也算是一個不能輕忽的目標。另一方面，恢復記憶的妹妹

  延續解離後的自己所訂下的目標，一一實行後決定考上與哥哥一樣的高中，但對已經離開

  校園很長一段時間的花楓來說，幾乎不可能。雖說她最後幸運在報考人數不足的情況下，

  即便有些節次身體不舒服沒有到考，還是順利考上，但她決定選擇更適合自己的「函授式

  高中」。因此，《嬌憐外出妹》也能夠說是一部講述找尋自我的作品。



  不過，在整部劇場版中幾乎都沒有提到整個系列不時出現的「量子糾纏」或「穿越時空」

  的情節，或許是為了不要造成沒接觸過系列作品的影迷困擾。但是，下一部劇場版《青春

  豬頭少年不會夢到紅書包女孩》將會正式結束高中篇，也會再次提到因為「思春期症候群

  」而造成的時空位移，預計將會於今年年底上映。看完《嬌憐外出妹》後打算繼續關注《

  紅書包女孩》的影迷，建議至少先補完電視動畫與前一部劇場版，稍微了解一下《青春豬

  頭少年》系列在這部分的設定，才不會在觀影的時候滿頭問號喔。


  --

  Viola''s World：Screen Scream影迷尖叫屋


