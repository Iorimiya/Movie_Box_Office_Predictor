title: '[討論] 紳探追緝令、非常殺手透露的韓國社會問題'
content: '阿肥昨天看了紳探追緝令，就想起去年張赫主演的非常殺手。


  有雷

















  有雷


















  兩部片主軸都是政府官員而且都是與司法院有關，為了性招待而從民間一般女性下手，且

  多社會經驗鮮少之學生。


  這裡有沒有對韓國社會比較了解的人士？

  因為對年輕妹子下藥，拿去招待上位者真的蠻誇張的。


  對了，紳探追緝令的崔成恩很漂亮。


  --'
