title: '[好雷] F1電影'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  距離布萊德‧彼特上一次擔綱主演自己製作的電影已經三年，如果說湯姆‧克魯斯身材保

  養得宜，那小布肯定是回春了。影史首次專注在「F1」為主題的作品，以《捍衛戰士：獨

  行俠》的製作規模與技術拍攝，再加上男主角，只能說是帥上加帥。即便劇情老套，兩個

  半小時的片長全無冷場，讓觀眾完整沉浸在方程式賽車的魔力與緊張氣氛中。



  獲封「實力最強的遺珠」的賽車手桑尼海耶斯，在1990年代曾是前途無量的一級方程式新

  秀車手，但他的職業生涯卻因一場意外而墜入谷底。魯本說服桑尼給自己最後一次機會重

  回一級方程式的賽場，幫助他拯救車隊，並挑戰成為全世界最強車手。當引擎怒吼、賽事

  進入白熱化之時，桑尼過去的陰影也步步逼近，他很快就發現，在一級方程式的賽場上，

  隊友也是你的勁敵，然而通往救贖的道路，絕非孤身一人能走完的旅程。



  既然找來《捍衛戰士：獨行俠》的導演柯辛斯基，就知道他肯定會把當時的成功經驗從空

  中搬到陸地。不論是拍攝技巧、氛圍還是節奏，都帶給觀眾如觀看《獨行俠》時的感動與

  緊張刺激。除了觀眾席的視角與空拍畫面，讓人宛如置身F1賽場觀看現場賽事之外，車手

  的主觀鏡頭與車內的特寫也少不了。這些用心設計的攝影機架設與運鏡，都是為了呈現出

  最真實、沉浸感十足的賽車體驗。



  「你相信奇蹟嗎？」



  片中多次提到「賭博」，但其實真正的命題是「信任」。賽車本身就是高風險的運動，每

  一次坐上車、每一個在方向盤後所做出的決定，其實都是一場賭注。桑尼比賽前的「儀式

  」包括最後抽一張撲克牌插進口袋，但他從來不看牌面，畢竟不管上面是梅花3還是黑桃A

  ，桑尼都還是會全力以赴地跑完這場比賽。



  魯本在窮途末路之下，找上老朋友幫忙，希望能夠拯救自己的車隊，這何嘗不是一場豪賭

  ？不過，這也代表魯本對桑尼的信任，他相信即使到這個年齡，桑尼仍舊擁有衝擊冠軍的

  能力。董事會也得夠相信魯本才會放手讓他出奇招，雖說最後來個小轉折，在熱血的運動

  電影裡安插個小反派，唯一支持魯本的董事其實希望桑尼可以直接搞爛車隊，他好轉手大

  賺一筆。這種相信，雖然出發點與魯本相反，但也是這位董事的放手一搏，而且在結局揭

  曉之前，某種程度上來說，他的確是賭對了。



  凱特找JP與桑尼到酒吧談心、玩牌，以「首席車手」作為賭注，最後經驗豐富的桑尼讓小

  老弟相信自己贏下牌局，為的就是要讓JP明天上場對自己有信心。兩人從一開始就不對盤

  ，但在桑尼的策略漸漸奏效之後，JP賭一把採用對方的建議，卻沒想到時機沒抓準反而造

  成自己重傷。復健中的他，可能心中有些不甘，但JP一次又一次地用模擬器測試，甚至開

  始嘗試「老人」土法煉鋼的慢跑與網球抓握練習，都能一點一滴地看見賽車手是如何從「

  賭博」發展出「信任」，而「相信我之術」對他們來說又更為重要。就算全世界都不相信

  你能奪冠，自己還是要有衝線的決心與信心。



  「F1是團隊運動。」



  不了解F1的觀眾或許會以為，賽車就是坐在車裡的車手獨自在賽場上奮鬥的比賽，但《F1

  電影》非常詳盡地剖析這項運動所需耗費的人力。從改良與研發車體的技術總監、對車子

  各部位都極為了解的首席技師、他們下面的團隊，到根據各種數據建立模擬器模組、進行

  情蒐的分析師，以及媒體公關等各方面的後勤團隊，都能在電影裡看到。



  即便找來桑尼，加上車體升級，都沒辦法讓本來墊底的APXGP突然脫胎換骨，變成前段班

  的車隊，所以開策略會議時，桑尼總是會提出眾人不當一回事的「C計畫」。他並不是故

  意唱反調，而是賽場上瞬息萬變，隨機應變才是上策。桑尼或憑藉自己過去的經驗，或遊

  走在犯規的灰色地帶，充分利用團隊的特點與長處，在維修站偷點秒數，再於彎道省些時

  間，並透過互相破風、吃尾流，兩台車一起一個名次、一個順位地慢慢往前推進。



  為了更加貼近真實的F1賽事，《F1電影》不但在真正的方程式賽道拍攝，甚至還讓演員在

  不影響比賽的情況下與車手同場競技。片中著墨最多的場地，正是F1創立的第一座開跑賽

  道──英國的銀石賽道。雖說這條賽道本身紀念性非凡，但會選擇給它比較多的篇幅，可

  能也是由於劇組找來確保電影細節與真實賽場相符的製片，是7屆世界冠軍得主路易斯‧

  漢米爾頓（Lewis Hamilton），這個場地賽道維修站的直道更是以他命名（Hamilton

  Straight）。



  他不僅親自教導主角賽車技巧，也親自上陣擔任車手，賽車迷如果仔細看片尾字幕，應該

  還能看到更多熟悉的名字。雖然桑尼‧海耶斯完全是虛構的角色，但片中提到的都是現實

  中的知名賽車手，像是漢米爾頓、洗拿、阿隆索，連退休後發生滑雪意外的車神舒馬克都

  有提及。網路上也有不少整理出片中F1細節的文章，有興趣的朋友不妨延伸閱讀。



  「錢不是重點。」



  桑尼在片中共講這句話兩次，一次是「錢很多，但那不是重點」，一次是「錢很少也沒關

  係」，他對賽車的熱愛已經不是金錢所能衡量。雖說當年的意外之後，他的確迷失一陣子

  ，但即使不是F1，從他回歸「賽車場」之後，對自己的要求之高，身材保持得很好可見一

  斑，他仍然是以最高標準在看待這項運動與自己參賽這兩件事。重出江湖是為了證明自己

  ，而最終的結果也已達到此目的，身體狀況其實早已不允許桑尼繼續玩命，他當然只得抱

  著冠軍獎盃轉身離去。但是，桑尼旋即抵達拉力賽車手招募現場，報出名號竟是剛奪得F1

  單站冠軍的車手，對方馬上表達「錢不多」，但對他來說，能夠再次緊握方向盤在場上馳

  騁，已經是最美好的事。



  「我們下一站會再相見嗎？」



  《F1電影》的情節固然老套，觀眾在進場前八成已經猜到整體走向，只是，既然整部電影

  已經以F1這項運動為主，在高張力之餘，凱特與桑尼的愛情線的確為電影增添一點輕鬆與

  趣味的調性。凱特也是因為魯本的信任而加入車隊，而她同樣來此證明自己，這樣的壓力

  讓凱特不想與桑尼廝混，但兩人相同的認真態度讓她不自覺被對方吸引。既然故事陳腔濫

  調，幫主角安排點感情線也是一定要的吧。近日陸續傳出續集的籌備消息，雖然桑尼應該

  不會再回到F1賽場，但或許會加入車隊的策略團隊也說不定呢。



  最後，一定要提的是本片的聲音。除了配樂由金獎大師漢斯‧季默操刀，令人屏息的感覺

  不用說之外，音效也相當完美，臨場感十足。桑尼告訴凱特，真正讓他回到賽道的是自己

  朝思暮想的「心流狀態」。桑尼描述自己開車到某個境界之後，賽道旁的觀眾喝采聲與耳

  機裡的團隊指令都會消失不見，全世界只剩下他與這台車，那一刻，他正在飛。



  講完這句話後，觀眾便可以開始期待最後會有的寂靜真空，不過，最後那段衝線前的畫面

  ，並非全然沉默，而是保有部分的環境音，真實模擬車手達到心流狀態時心無旁騖的感覺

  。除了這段賽道之外，整部電影塞滿排氣管蓄勢待發的聲音、輪胎在賽道上拚盡全力的摩

  擦聲、觀眾撕心裂肺的加油聲與引擎的低沉怒吼聲，每一顆鏡頭都經過精心安排。就算對

  F1一無所知，光聽到這些音效，就足以令人血脈噴張，恨不得能在現場為小布──我是說

  桑尼──吶喊一次。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
