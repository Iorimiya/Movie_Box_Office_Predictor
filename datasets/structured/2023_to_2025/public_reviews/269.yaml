url: https://www.ptt.cc/bbs/movie/M.1753701337.A.8AB.html
title: '[新聞] 再度蟬聯！《F1電影》續奪全台冠軍飆破'
content: '再度蟬聯！《F1電影》續奪全台冠軍飆破3.88億


  記者許世穎／台北報導


  由「小布」布萊德彼特主演的飆速強作《F1電影》在台勢不可擋！上週末（7月25至27日

  ）在台繼續蟬聯票房冠軍，上映第5週再以全台破台幣3100萬的票房佳績拿下票房冠軍，

  全台累積票房突破台幣3.88億，賣破台幣4億大關已毫無懸念。


  這也是《F1電影》在台上映繼首週及第四週拿下票房冠軍後，拿下的第3個週冠（首週、

  第四及第五週），同時，台北票房也突破台幣1億大關，成為今年繼「阿湯哥」湯姆克魯

  斯的《不可能的任務：最終清算》後，第2部台北票房破億之作。


  《不可能的任務：最終清算》為全台今年目前票房冠軍，已賣破台幣4.5億元，同時也是

  今年目前唯一全台破台幣4億的電影，《F1電影》將延續氣勢，成為今年達此成績的第2部

  ，下週則要面對8月8日上映的日本動畫強敵《劇場版「鬼滅之刃」無限城篇 第一章 猗窩

  座再襲》。


  而北美及全球票房方面，目前《F1電影》北美累積票房已高達1.65億美金（約台幣48.67

  億元），全球票房也已正式衝破5億美金（約147.5億元）大關。電影持續在台熱映中，本

  週預計將會有更多特殊廳放映回歸，請洽各大影城及戲院。




  --'
