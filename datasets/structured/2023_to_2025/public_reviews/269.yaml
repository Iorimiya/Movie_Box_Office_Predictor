url: https://www.ptt.cc/bbs/movie/M.1755786985.A.446.html
title: '[普雷] F1電影'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~














  聲光效果滿分

  劇本俗氣老套到不行


  離開賽車圈那麼久

  一下子就能重返榮耀

  不知道是想騙誰


  Sonny自己對於賽車熱衷

  電影中並沒有真的表現出來


  只是一句話帶過，而且是經理講的

  像是在飛一樣











  整個劇本套路滿滿


  糾結的菜鳥

  來提點一下的老將

  還有非常容易預測到而且無意義的愛情線


  如果爽片來看

  很爽，就只剩下爽


  但是公式化太滿

  個人覺得不值得到好雷


  兩個半小時的片

  可以帶給觀眾應該是更深層的東西



  --





  --'
