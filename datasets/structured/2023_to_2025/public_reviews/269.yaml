title: '[新聞] 《F1電影》上週蟬聯4天全台平日冠軍 特殊'
content: '《F1電影》上週蟬聯4天全台平日冠軍 特殊廳本週強勢回歸


  記者許世穎／台北報導


  由《捍衛戰士：獨行俠》導演喬瑟夫柯辛斯基執導、「小布」布萊德彼特主演的新片《F1

  電影》上映以來票房節節上升，上週更從週二（8日）起，蟬聯4天平日票房冠軍。幾家擁

  有特殊影廳的影城也陸續宣布，《F1電影》本週將回歸特殊影廳，包括IMAX、Dolby Cine

  ma、4DX、SCREEN X等版本都將強勢回歸。


  該片持續在在台熱賣，上週末（7月11至13日）全台再進帳台幣4307萬元佔據週末票房亞

  軍，累積票房已來到台幣2.53億元；該片上週末於北美也再收1300萬美金（約台幣3.8億

