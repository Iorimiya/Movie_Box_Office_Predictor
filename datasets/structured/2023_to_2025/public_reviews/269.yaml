url: https://www.ptt.cc/bbs/movie/M.1755969805.A.369.html
title: '[微好雷] 《F1電影》一些聯想 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~










  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  《F1電影》看到一半，好奇這有點「半紀錄式」─以虛構方式深入現實令人嘖嘖稱奇的賽

  車工業，背後除了人類最新科技（之一）結晶的展現，與萬中選一車手：必須擁有卓越的

  體能與反應來配合高超的駕駛能力，缺一不可。與各種賽制和相關龐雜歷史，並牽涉龐大

  研發與商業利益的高等社會結構。



  隔天與老婆分享F1，一下子就發現了運動賽事「卓越的困境」：往往是男生講的口沫橫飛

  ，女生聽完著說，恩恩，所以？好像了間接證實了黑格爾式定義即是否定，F1賽車證明了

  人類的極限，然後呢？



  不常看好萊塢與英雄電影，《F1電影》算是稍微有些層次和深度的賽車英雄片。尤其在賽

  車工業這種窮盡物質與技術各個環節只為了追求零點幾秒的準確與極限中，說來與好萊塢

  的製片工業似乎有著同步的頻率。



  幾個鏡頭喚起了自己對於布萊德彼特的演員生命史回憶，所以才會說若是單薄的樣版英雄

  電影只是體現了另一種美式的偶像崇拜意識形態，反而欠缺一種紀實性的厚度。於是說「

  半紀錄式」意味著看到實際賽事會出現的相差無幾的景況，包含不少場景，車手與車隊都

  是現實的排練。



  結尾也處理的不差，布萊德彼特最後一圈賽車手POV的賽道空景，想起之前思考空間與速

  度和時間的關係，好像就體現在開車，開車在窄巷與高速公路速度的「平面視覺」差異（

  既遮蔽又開顯），同時看電視轉播不說也難以察覺F1賽車動輒三百公里的高速。或舉例來

  說，有些電影拍車子移動，其實是下面還有一台貨車在控制速度等拍攝方式，只是讓它「

  看起來」有達成某種速度感就可以了。



  於是那個結尾堪稱唯物主義（賽車工業的極限技術）與形上學（布萊德彼特演員生命）共

  存的時刻想到了「無盡的賽道」這件事情，想到了會不會其實距離不存在（深度只是幻象

  ）。然後在一片黑暗，真空的太空之中，於是之前說我們只是每個獨立生命在人世間漂流

  ，會不會其實是在黑暗中「原地移動」？（如電影中賽車手模擬真實賽道的360度環形投

  影）



  --


  拉特飯 - 以商業力量進入獨立市場


  --'
