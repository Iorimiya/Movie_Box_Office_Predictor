url: https://www.ptt.cc/bbs/movie/M.1750937491.A.231.html
title: '[負雷] F1電影版  一點也不爽的賽車電影 '
content: "雷文防雷資訊頁\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n  無雷心得就是\
  \ 毫無爽度的F1電影\n\n  老布演這腳色實在令人出戲\n\n  劇情很荒謬~ 對，就是你想到最荒謬的那個版本\n\n  整部電影沒聽到令人感動的配樂啊!?\n\
  \n  中間看到差點睡著\n\n  RUSH決戰終點線/賽道玩家/GT跨界玩家\n\n  這三部絕對都比F1好看 而且讓觀眾有跟隨劇中角色成長\n\n  F1\
  \ ?? 啥都沒有~\n\n  以下有觀影心得雷\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n  因為本身也算有在看F1\n  關心賽事結果為主 很難把整場賽事看完 不是專業F1迷\n  所以對這部電影還蠻難看得下去的\n\n\n  先不論F1是世界最頂尖的賽車賽事，參賽車手要有Super\
  \ License超級駕照\n  不會是去隨便找來一個30年沒參加過F1的老車手就有資格參加的\n\n  然後這隨便找來的老人，用些不入流的小伎倆就把其他19支車隊耍得團團轉?\n\
  \  如果F1靠這些策略就能出奇制勝，就不會被紅牛連霸這麼多年了\n\n  由於這部片設定的對手都是現今車手，\n  看著老布橫空出世就把其他人耍得團團轉 只有滿臉問號?\n\
  \  我知道這些都是電影效果\n\n  OK~那來談電影的缺點\n\n  你說要吸引沒在看F1的人\n  整部片~看不出角色有何成長，\n  本來吊車尾的車隊裝個空力套件瞬間變成爭冠車隊??\n\
  \  也沒有對對手有任何深入刻劃\n  每個賽道有啥特性也沒花任何篇幅介紹\n\n  電影美場賽事就是把實際比賽後頒獎台/噴香檳/噴彩帶 的畫面塞進來\n  跟看Youtube各場賽事精華沒兩樣\n\
  \  以前小布的電影還可看他耍帥\n  這部只剩老布\n  看了個寂寞~\n\n--"
