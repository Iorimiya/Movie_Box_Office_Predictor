title: '[好雷] F1電影 想起閃電霹靂車的熱血'
content: '有雷哦




  今天去看了IMAX版，覺得很好看


  我沒研究過現代的F1，所以也不知道他裡面的東西是否為真


  觀看時在想，哇，方向盤跟遊戲手把沒兩樣


  可以變換後翼！？超酷


  咦...？居然還有電腦輔助模式？阿斯拉的懸空打轉膩？


  在看的途中，腦海一直閃過閃電霹靂車的畫面


  主角在用“招”來cover隊友時，腦海付出這個畫面




  各種手段，根本布利德加賀啊！


  賽車一流，手段不少



  還有中間的旋風衝鋒龍捲風也讓我出戲


  最後的“飛”彷彿零的領域？


  真的懷疑導演和編劇是否有看過閃電霹靂車


  改天想去看4DX看看


  應該會很過癮！




  -----

  Sent from JPTT on my Sony XQ-DQ72.


  --

  原來如此'
