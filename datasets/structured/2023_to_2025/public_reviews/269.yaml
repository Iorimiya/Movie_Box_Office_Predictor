title: '[無大好雷] F1電影 沒去過現場至少去看大螢幕'
content: '首先看的是威秀19號的特映場


  附上人權




  通篇無雷或微雷心得


  請斟酌觀看


  整齣步調緊湊毫無尿點


  基本上我看任何電影大約播到50～70%進度


  一定會看一下手錶抓時間


  但是這齣，我一直到最後結尾我才想看錶


  完全喪失對時間的概念，體感5分鐘(x


  賽事段落還有現場播報的臨場感


  大螢幕上看F1撞車真的不一樣


  很多人都倒抽一口氣


  引擎轟鳴加上超重拍的背景音樂


  你會整個人跟著緊張到忘了呼吸


  每場賽事結束


  你都會聽到整個廳的人都在深呼吸XD


  片中也穿插很多第一人稱視角


  讓你感覺真的就是在一起跑賽道


  車輛近逼的壓迫感跟周遭景物飛馳的速度感


  真的爽


  整個硬要吹毛求疵


  大概就是多了沒必要的感情戲橋段


  我只想說


  女人不要影響我看賽車(x


  大推，必看！




  --

  信我一把

  我想去刷一次ScreenX

  感覺會比IMAX還爽

  XDDDDDDDDD

  尤其最後一圈賽道

  87

  而且他們看完可能還嫌東嫌西XD

  我覺得很值得考慮XD

  比高義連喝10罐機油還好看100倍

  我自己只看過幾次的F1轉播

  老實說你要跟真實比賽比我覺得多少有落差

  畢竟講求戲劇效果

  但是沉浸感跟劇情節奏來說

  這種改動我覺得是非常合理且必要的

  我兩齣都看過我有資格說

  這齣好不是一點半點好不好XDDDDDDDDD

  差遠了

  一個70分的來跟這個95分的比

  別鬧了'
