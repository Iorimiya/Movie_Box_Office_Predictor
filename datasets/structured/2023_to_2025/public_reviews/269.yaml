url: https://www.ptt.cc/bbs/movie/M.1755932894.A.36E.html
title: '[新聞] 小布重返榮耀！《F1電影》奪年度原創電影票房冠軍 最逼真的'
content: '小布重返榮耀！《F1電影》奪年度原創電影票房冠軍 最逼真的賽車場景在家體驗


  2025/08/23 07:06


  羅子秦／核稿編輯


  〔記者許世穎／綜合報導〕由奧斯卡得主「小布」布萊德彼特領銜主演的《F1電影》，絕

  對是今年夏天必看動感鉅作，目前已正式於各大平台數位上架，但全球戲院包括台灣仍持

  續熱映。該片票房表現亮眼，全球票房即將突破6億美金（約台幣182.16億元），拿下年

  度原創電影票房冠軍、飆進全球年度票房榜第8名；全台票房方面累積超過台幣5.1億元，

  暫居今年票房冠軍寶座，本周末結束也將衝破台幣5.2億元。



  布萊德彼特（右）和達姆森伊卓瑞斯在《F1電影》從互看不順眼到並肩作戰。（Apple

  TV+提供）


  不少熱血影迷分享在上映期間多次進戲院觀賞多刷，並蒐集各種特殊影廳版本。創下投資

  院線片以來最賣座紀錄的Apple Original Film 也宣布，《F1電影》已在全球 100 多國

  提供付費隨選視訊（Premium VOD）及數位購買（Electronic Sell-Through）服務，觀眾

  們即可搶先收藏，在家就能體驗前所未有最逼真的賽車場景，感受極速燃燒的飆速魅力。



  《F1電影》創下全球年度原創電影票房冠軍。（Apple TV+ 提供）


  該片同時在台灣、北美、全球都寫下小布從影以來最高票房紀錄，更獲得觀眾與影評一致

  盛讚，在CinemaScore 獲得 A 級好評，爛番茄觀眾評分高達97%，被譽為「影史最真實的

  賽車電影」。小布飾演一名退役的賽車手，在好友力邀下重返F1賽道，亮眼新秀達姆森伊

  卓瑞斯則飾演他在「APXGP」車隊中的隊友，兩人從互看不順眼到並肩作戰，過程既熱血

  又刺激，絕對值得影迷一看再看。《F1電影》已於各大平台數位上架。



  新聞網址：



  --'
