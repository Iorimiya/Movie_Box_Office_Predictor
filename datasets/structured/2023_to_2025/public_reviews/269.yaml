url: https://www.ptt.cc/bbs/movie/M.1752072892.A.A4E.html
title: '[新聞] F1電影佳評如潮 蘋果欲收購明年F1美國轉播權'
content: 'F1電影佳評如潮 蘋果欲收購明年F1美國轉播權


  2025/7/9 18:22


  （中央社倫敦9日綜合外電報導）英國「金融時報」（Financial Times）今天報導，由布

  萊德彼特（Brad Pitt）主演的「F1電影」（F1: The Movie）大獲好評，美國蘋果公司正

  計畫收購F1賽事明年在美國轉播權。


  路透社報導，金融時報引述美國娛樂週刊「綜藝」（Variety）及其他媒體報導，由蘋果

  公司推出的優質賽車電影「F1電影」票房亮眼，上映10天已締造全球票房2.93億美元（約

  新台幣95億元）的佳績。


  金融時報表示，據知情人士透露，蘋果公司正與F1現任美國轉播商，迪士尼旗下的ESPN，

  競爭F1賽事明年在美國的轉播權。


  路透社無法立即證實此消息。


  先前由串流影視平台Netflix推出的「Formula 1：飆速求生」（Formula 1: Drive to

  Survive）系列紀錄片在美國帶起了運動類影劇的風潮，現在蘋果公司希望能從這波趨勢

  中獲利。


  2月時多家媒體曾報導，由於ESPN與F1集團談判新合約的獨家期限到期，Netflix會成為

  2026年賽季F1賽事美國轉播權的競爭者之一。


  蘋果公司與F1未立即回應路透社置評請求。（實習編譯：張家語/核稿：陳政一）1140709



  新聞網址：



  --'
