url: https://www.ptt.cc/bbs/movie/M.1754565977.A.DE2.html
title: '[新聞] 《F1電影》上映44天登頂全台年度票房冠'
content: '新聞網址：


  《F1電影》上映44天登頂全台年度票房冠軍 明天對戰強敵《鬼滅之刃》

  2025/08/07 14:44


  〔記者許世穎／台北報導〕由「小布」布萊德彼特主演的飆速強作《F1電影》在台票房再

  突破！截至昨天（6日）全台票房正式衝破台幣4.5億元，成為今年繼「阿湯哥」湯姆克魯

  斯的《不可能的任務：最終清算》後，第2部在台達到此成績的電影，今天也將正式登頂2

  025年目前的全台年度票房冠軍。


  《F1電影》從6月25日在台上映至今，靠著超強口碑帶動票房吸金力，先在上映首週拿下

  票房冠軍，接下來兩週將冠軍寶座讓給拿下雙週票房冠軍的《侏羅紀世界：重生》，上映

  第4週再度重奪冠軍寶座，上週末（8月1至3日）更完成「逆襲後三連霸」，共拿下4個週

  冠，上映44天終於登上年度冠軍。


  今年目前僅《不可能的任務：最終清算》及《F1電影》的全台票房突破台幣4.5億元，台

  北票房目前也僅這兩部片破億，其中《不可能的任務：最終清算》突破台幣1.21億元，《

  F1電影》則突破1.23億元。


  接下來不論是阿湯哥或是小布，都將面對明天（8日）正式在台上映的日本動畫強敵《劇

  場版「鬼滅之刃」無限城篇 第一章 猗窩座再襲》，票房冠軍之爭似乎還有變數。《F1電

  影》持續在台熱映中。


  --'
