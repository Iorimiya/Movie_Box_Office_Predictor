url: https://www.ptt.cc/bbs/movie/M.1751902752.A.F6D.html
title: '[爽雷] F1電影'
content: '3 年前《捍衛戰士：獨行俠》大獲成功，90 年代的姐妹作《霹靂男兒》也傳出將推出續

  集。只是派拉蒙遲遲沒點頭，阿湯哥也忙著解不可能的任務，這部號稱「賽車版《捍衛戰

  士》」一直未能重返賽道。

  .

  還沒等到阿湯哥回來當霹靂男兒，Apple TV 豪擲 3 億美金（直逼《星際大戰》《復仇者

  聯盟》等科幻 IP 鉅作的預算級別），把《捍衛戰士：獨行俠》幕後團隊：導演約瑟夫考

  辛斯基、監製傑瑞布洛克海默、編劇埃倫克魯格、攝影克勞迪奧米蘭達甚至配樂漢斯季默

  通通集結，再加上 F1 傳奇車手路易斯漢米爾頓監製加持，一起為《F1 電影》催下油門

  。

  .

  《F1 電影》的野心很明確，就是再復刻一次《捍衛戰士：獨行俠》的神話。成功與否有

  待票房驗證，但就成品而言，他們辦到了嗎？


  /


  為了讓觀眾到戲院享受無可取代的視聽體驗，《F1 電影》祭出讓人難以置信的賽道臨場

  感。

  .

  劇組不僅打造一支虛構的 F1 車隊「APXGP」，還真的進駐各大世界級賽道，包括銀石、

  亞斯碼頭等場地，在賽事期間實地拍攝。他們還擁有與法拉利、賓士並列的專屬維修間，

  演員更接受真實訓練，親自駕駛 F2 車體改裝賽車上場奔馳。不靠綠幕與 CG，以實境還

  原為主，車輪擦過柏油的引擎聲足以沸騰腎上腺素、引發顱內高潮，而授權費、安全管制

  、場地租金的天價也可想而知。

  .

  影片中每當比賽切換場地，畫面就會出現路線圖與車手排序的動畫，清楚標示當下賽況，

  即使是對 F1 不熟的觀眾如我也能快速融入戰況；若你是死忠粉絲，看到熟悉車手的名字

  出現、甚至本尊客串必然會心跳加速。這些細節並非技術堆砌，更是對 F1 文化的深度理

  解與致敬。

  .

  導演考辛斯基是當今好萊塢最懂得以「時間壓力」製造戲劇張力的導演，無論獨行俠（湯

  姆克魯斯 飾）駕駛 F-14、還是桑尼（布萊德彼特 飾）手握方向盤，敵人都不是對手，

  而是時間 — 0.01 秒的差距足以決定成敗，過了青春巔峰的他們更懂得歲月不饒人的殘

  酷，在與時間賽跑、與自己對決的過程重燃熱血，就是找回初心的方式。

  .

  這一切也說明為何 Apple TV 願意押下重本在《F1 電影》，因為目標不止是票房，更是

  一場關乎品牌未來的高風險佈局。蘋果高層 Eddy Cue 本身是法拉利董事會成員，也是狂

  熱車迷，他看準 Netflix《F1：飆速求生》帶動的 F1 熱潮，透過這部作品促成後續為漢

  米爾頓製作紀錄片，也為蘋果鎖定 2026 年 F1 美國轉播權鋪路。從串流平台、原創內容

  到體育產業，蘋果正試圖整合軟硬體資源，透過這場賽車豪賭，實現品牌的跨界滲透。



  /


  注意到了嗎？我還沒提到劇情。即使不用我提，你也能猜到會怎麼演：天賦異稟但個性難

  搞的賽車手，在老友邀請下重出江湖，與潛力新秀組隊出擊，老鳥與菜鳥起初水火不容，

  在多次挫折後建立革命情感，最終共同為團隊拼搏，也完成自我救贖。

  .

  上面這段劇情，幾乎是從《捍衛戰士：獨行俠》照抄的 – 但有別於阿湯哥的傲骨，布萊

  德彼特更有一股難以捉摸的傲氣。他飾演的桑尼像極了西部牛仔，遊走規則邊緣，危險卻

  又讓人著迷。即便年過 60，小布的笑容燦爛中帶著叛逆，大男孩的氣質與不羈的熟男魅

  力並陳，在鏡頭下越陳越香。

  .

  雖然布萊德彼特近年多退居幕後，以製片公司「Plan B」執行長身份活躍於獎季，但久違

  地在大銀幕擔綱商業鉅片，仍展現寶刀未老的巨星丰采。

  .

  桑尼與老友兼車隊經理魯本（哈維爾巴登 飾）的互動，則是全片的情感支點。一方面要

  為經營車隊傷透腦筋，一邊還得照料團隊士氣，對不按牌理出牌的桑尼又愛又恨，情誼動

  人不遜於《捍衛戰士：獨行俠》的獨行俠與冰人。哈維爾巴登儘管戲份不多，但他的演技

  與情緒張力，讓兩人的火花更加豐富。


  /


  過氣王者東山再起固然是電影的王道公式，但《F1 電影》的情節推進過於工整，總給我

  一種「跑進度條」的感覺。人物關係很容易與《捍衛戰士：獨行俠》對號入座，某些橋段

  彷彿能聽見編劇在討論：「好，菜鳥準備受傷、讓主角自責囉」、「女主角應該要愛上男

  主角囉」。

  .

  然而，相較於《捍衛戰士》橫跨 36 年、有兩個世代的集體回憶累積，《F1 電影》並沒

  有額外的情懷加成。這些熟悉的公式雖然有效，卻少了一份新奇與樂趣。

  .

  整體而言，《F1 電影》是一場極致的感官體驗，也是計算精密的商業鉅作。它沒有帶來

  太多劇情驚喜，但無論熱愛賽車、喜歡巨星、還是單純想體驗大銀幕聲光震撼的觀眾，都

  能在其中找到樂趣。而對 Apple 來說，這也是一場高速推進的新賽道嘗試 ─ 會開向勝

  利終點，還是偏離彎道？就交給觀眾和票房來決定了。


