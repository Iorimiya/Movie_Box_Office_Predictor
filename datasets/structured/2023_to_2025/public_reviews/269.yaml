title: '[請益] 請問F1電影中開個賽前會議為何要戴耳機?'
content: '請問F1電影劇中布萊德彼特及新手和領隊,技術或機械總監等一些人開賽前小組會議,


  討論何時策略要採Plan A或Plan B或Plan C時,


  我看會議室也小小的,就圍個小圓長桌,頂多10來人,為何布萊德彼特和新人要戴耳機 ?


  看起來是那種專業打電動的高級耳機,請問為何 ?


  還有最後一場阿布達比的比賽,為甚麼舉紅旗,所有車輛就要停止比賽 ? 後面就重新開始.


  謝謝,


