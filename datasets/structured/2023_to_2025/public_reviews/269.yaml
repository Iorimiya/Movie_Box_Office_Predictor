url: https://www.ptt.cc/bbs/movie/M.1753922890.A.E0D.html
title: '[普雷] F1電影'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  本作電影分類為浪漫愛情片


  講述阿皮和桑尼在媒婆魯本的媒合後，所鋪出的愛情故事。


  一開始阿皮和桑尼和眾多情侶一樣，在相處的過程中有很多磨擦。


  在一次的比賽中，就在賽中吵誰要在上位的問題，


  阿皮覺得我最近的比賽經驗豐富，我應該在上位，

  這也是整個團隊的共識。

  而桑妮覺得如果要在上位就憑實力超越我，為何要我放水讓你?


  兩個人的理由都有道理。


  而桑妮和阿皮的家人相處也是不好，有一次比賽時要換輪胎，

  桑妮想要軟一點的，但家人覺得要硬一點的，

  桑妮不聽，而家人回嘴說「我可是帶過世界冠軍的人耶。」

  此時覺得家人霸道了些，雖說家人是專業，但是否也應該了解賽車手的想法


  阿皮脾氣暴躁衝動，這點身為她的伴侶桑妮也知道，在一次的比賽中，

  阿皮想表現給桑妮看，我是第一名，而在求勝心切時，發生了令人難過的事故。

  這裡我的想法是，在實踐自己想法時，若意識到會賭上自己的性命的風險，

  而且沒有任何變通的彈性，是否還會去賭?


  而經過一系列的磨合，阿皮的個性也有所改變，一開始對媒體總是鬼吼鬼叫，

  讓社會觀感不佳，在一次與桑妮的擦撞後，也開始會承認自己的過失。


  本作可惜的是，雖說是浪漫愛情劇，男主角們卻沒有進一步的深情互動，

  有的也只是含情脈脈的深情相望。而我想看到的是，在一次的爭吵後，

  彼此冷靜後，開始安撫對方產生了溫存，在一時眼神交際，開始口水交融，

  產生身體上的親密互動。若有加入這片段，我的評價肯定是好雷，

  這部分真的是可惜了。


  以上是F1賽車的心得



  --'
