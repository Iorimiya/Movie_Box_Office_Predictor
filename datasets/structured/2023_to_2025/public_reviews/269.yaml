url: https://www.ptt.cc/bbs/movie/M.1756112830.A.B9F.html
title: '[討論] F1電影看到最後很感動是正常的嗎？(雷)'
content: '如題


  三刷完4DX了


  前幾週分別看了兩次信義的4DX場次之後


  今天也特別去林口三井4DX三刷


  想說比較一下兩邊4DX廳差別



  最後阿布達比站


  sonny hayes的最後一圈


  成功做到他前面在拉斯維加斯那時候


  跟女主說的那個「心流狀態」


  就是心跳變慢 整個世界變得很安靜


  很專注在自己當下很享受的那個狀態


  任何事情都影響不到他



  從老漢跟男二雙雙撞出去失去資格


  整個片子的氛圍開始變慢


  女主說了一句：他在飛 之後


  後面每一個彎道 每一條直線


  隨著座椅這樣懸空慢慢轉


  搭配那個畫面


  就像自己真的也實際體驗了他所謂會飛的感覺


  當下真的挺感動的


  不知道是前面劇情種種的鋪成


  還是說看他最後比賽結束回room哭了


  鏡頭再次給到當年兒時跟父親合照



  有人看的時候也有這種很感動的感覺嗎



  我自己一刷單純只是為了4DX的爽


  劇情細節什麼的沒有很仔細看


  但二刷 三刷 會特別去注意裡面的細節


  然後最後一段(上述阿布達比站那邊)


  就特別感動




  阿對另外就是兩個4DX廳的小小心得



  個人覺得信義威秀年初重新裝潢後的二廳 4DX


  椅子蠻舒服的


  機器風扇聲音什麼的跟以前比好很多


  比以前更舒適



  林口三井威秀4DX廳的話


  體感上在特效方面更好一點


  但椅子還是信義威秀這個重新裝潢的比較好



  二刷三刷4DX的結論 還是覺得 值回票價



  --'
