title: '[好雷] 《F1電影》(2025) 極速鬥陣！ '
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\n\n\n簡單條列式打些心得：\n\
  \n1. 極速鬥陣是我本來亂猜的台灣片名，因為鬥陣俱樂部也是小布代表作\n   所以這樣翻好像說得過去\n\n2. 今天才在美麗華IMAX看了本片\n   剛上映時我很忙，加上暑假大片多，所以錯過了一開始在大廳看的時機\n\
  \   沒想到在鬼滅熱映的今天還能在大廳看到本片，覺得很難得\n\n3. 哈維爾巴登你為何不直接演龍嫂就好（片中真龍嫂也有出現）\n\n4. 很多現役F1車手也有亮相，我本來很期盼看到角田被亂入，\n\
  \   然後在無線電裡幹譙小布的畫面，可惜他好像根本沒出場(有被提到）\n\n5. 小布在片中真的太亂搞了，如果是現實中應該會被揍吧(被Max揍?)\n\n6.\
  \ 最後的BOSS是老漢XD，我本來以為是Max，但片子前中段比賽冠軍好像大多是Max\n   算是給兩代的王者都留了面子\n\n7. 女主角超正，當初第一次看到她是在HBO\
  \ ROME，她演屋大維的姊姊\n\n8. 承上，董事會老賊班寧也有演HBO ROME，演布魯圖斯（刺殺凱薩的人）\n\n9. 基本上看到一個五六十歲老人在F1奪冠，相當於看到F-14擊落SU-57\n\
  \   但因為F1比賽變因本來就超多，\n   而且片中的小布策略主要是圍繞在觸發安全車或紅旗\n   所以好像還說得過去\n   不管怎麼說，最後是小布贏了，我也感到很欣慰\n\
  \n10.不知道劇組有沒有玩Pitt進pit的梗（不來的pit)\n\n11.女觀眾好多，前陣子在ChatGPT問現在F1女車迷比例大概多少，\n   GPT回答約40%，跟我現在看的情況差不多\n\
  \n12.看片時後座一直踢我椅背，散場時我正打算青對方一眼，結果轉頭一看，是女觀眾XD\n\n\n總評：\n相當好看，但仍不如Rush，不過在我心中是略遜賽道狂人而已\n\
  \n個人賽車電影評價：Rush > 賽道狂人 >= F1 > 汽車總動員一 >= 法拉利\n\n--"
