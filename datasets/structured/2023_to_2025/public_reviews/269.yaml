title: '[新聞] 《F1電影》放映會 專業F1車手先睹為快給評'
content: "《F1電影》放映會 專業F1車手先睹為快給評價\n\n《F1》電影海報，布萊德‧彼特。（華納兄弟提供）\n\n【大紀元2025年05月26日訊】（大紀元記者葉子杰編譯報導）布萊德‧彼特主演的《F1電\n\
  影》即將於6月上映。當地21日晚上，在摩納哥大獎賽之前，F1賽車車手和車隊老闆受邀\n為此片的私人放映會的觀眾嘉賓，他們普遍讚揚了電影內容，但也有提醒觀眾的部分。\n\
  \n好萊塢巨星布萊德‧彼特（Brad Pitt）主演的《F1電影》（F1）由傑瑞‧布洛克海默（\nJerry Bruckheimer）和七屆F1世界冠軍車手路易斯‧漢米爾頓（Lewis\
  \ Hamilton）製作\n。漢米爾頓週三在摩納哥蒙地卡羅與一大群車手一起觀看了《F1電影》，據《MotorSport\n》《Espn》報導，20名現役賽車手中，有18名車手出席了私人放映會，關於這部電影的評\n\
  價非常正面，但也有提醒觀眾的部分。\n\n談到看完這部電影的感受時，漢米爾頓開玩笑說：「首先，這不是我第一次看這部電影，\n我已經看了大概有20次了。」「我把所有的車手都請來了，而我坐在中間，我很緊張！我\n\
  心想： 『天啊，大家都是第一次看這部電影。』環顧四周、觀察大家的反應，尤其是車\n手們的反應，感覺很棒。我真的很關心車手的看法。」\n\n漢米爾頓繼續說：「我希望他們給這部電影高度的評價。後來我還特別跟他們說，歡迎大\n\
  家誠實地發表意見，因為肯定有些部分可能會讓人覺得，『嘿，（F1）策略停車的時機可\n能不太對』，或者諸如此類的問題。但我覺得最棒的是，影片的音效很棒，畫面也令人驚\n\
  豔。這是從來沒有人拍過的，所以我真的為此感到驕傲。」\n\n\n圖為路易斯‧漢米爾頓（Lewis Hamilton）資料照（Clive Rose/Getty Images）\n\
  \n西班牙車手費爾南多‧阿隆索（Fernando Alonso）是漢米爾頓的老對手，他說：「這部\n片很不錯。我喜歡這部電影，我覺得F1賽車及耐力賽的部分呈現得很好，這在這種電影中\n\
  是很少能保證做好的，如有時會一切都假假的，或者覺得沒有很好地拍出想要表達的。但\n這部電影在這方面做得相當好。」\n\n\n圖為西班牙車手費爾南多‧阿隆索（Fernando\
  \ Alonso）資料照。(Mark Thompson/Getty\nImages)\n\n法國車手埃斯特班‧奧康（Esteban Ocon）說：「這部片讓人身臨其境，駕駛場景很精彩\n\
  ，是我們從未見過的。但有些部分對我們這些身處（賽車場）圍場裡的車手來說，感覺不\n太合理。不過，我能看出漢米爾頓在其中下了功夫，試著讓一切盡可能逼真。」\n\n\
  奧康繼續說：「還是有一些部分需要多一點好萊塢風格，畢竟電影是面向大眾的，需要吸\n引大眾目光。對我們來說，有幾個地方我希望可以更專注在賽車本身，少一點撞車場面。\n\
  但總體來說，毫無疑問，這是目前為止最好的賽車電影，它一定會大獲成功的。」\n\n\n圖為雷諾集團旗下的Alpine車隊兩名法國車手奧康（Esteban Ocon、左）和加斯利（\n\
  Pierre Gasly）。(Nelson Almeida/AFP via Getty Images)\n\n西班牙車手小卡洛斯‧塞恩斯（Carlos Sainz）說，「我真的很喜歡這部電影，我覺得對\n\
  我們這些F1專家來說，我們會看到一些類似於我們在看《一級方程式：飆速求生》（\nDrive to Survive）時的感覺，你可以感受到電影帶點好萊塢的風格。我真的相信它會吸\n\
  引很多新的觀眾，對於那些不了解F1的人來說，這部片拍得很棒。」\n\n塞恩斯補充說：「對於忠實粉絲和記者來說，我們可能會發現有些地方有點太美國化或太\n好萊塢了。但老實說，我很喜歡整部電影。有些內容真的讓我很驚訝，製作團隊非常出色\n\
  地完成了一部很棒的好萊塢電影。就讓我們看看觀眾的反應如何。」\n\n\n圖為西班牙車手小卡洛斯‧塞恩斯（Carlos Sainz）。(Chris Graythen/Getty\
  \ Images)\n\n英國車手奥利華‧貝爾曼（Oliver Bearman）說：「我覺得這部電影非常棒，它真說到了\n我們所經歷的一切，不過是以一種好萊塢的方式呈現，這也在意料之中。這部電影會讓更\n\
  多人想看F1，這是它的真正目的。車載鏡頭和他們所做的工作其實非常驚人——看到他們\n採用的技術，讓人印象深刻。」\n\n貝爾曼補充說：「電影中有一些有趣的橋段，但這本來就是要這樣刻意安排的。當然，有\n\
  些地方並不是完全準確……比如典型的電影場景，兩輛賽車在直道上齊頭並進，突然另一\n名車手好像找到了其他檔位。不過這是典型的電影劇情，對於觀眾而言，我認為這會很吸\n\
  引人。」\n\n\n圖為英國車手奥利華‧貝爾曼（Oliver Bearman）資料照。(Clive Rose/Getty Images)\n\n英國車手蘭多‧諾里斯（Lando\
  \ Norris）說：「我在電影裡表現出色，這才是最重要的，\n這是一部很好的電影，劇情很棒——我不知道我能說多少、不能說多少。這是一個很酷的\n故事，我覺得是個勵志的故事，背後有很多不同的意義。但劇情很酷，且為年輕人帶來很\n\
  多啟發。」\n\n\n圖為英國車手蘭多‧諾里斯（Lando Norris）資料照。(Mark Thompson/Getty Images)\n\n據《The Race》報導，許多車手在該片中都有客串。儘管受訪的車手們都表示喜歡這部電\n\
  影，自然不願意批評F1電影，但他們用了「好萊塢」這個詞，似乎意指部分內容戲劇性的\n誇張或是偏離了現實。\n\n另據《PlanetF1》報導，由於《F1電影》是在世界各地的各種一級方程式賽車比賽中拍攝\n\
  的，據傳2023年一級方程式賽車隊的所有車手都會以某種方式亮相。2024年的鏡頭還可能\n包括貝爾曼、澳洲車手傑克‧杜漢（Jack Doohan）和阿根廷車手弗蘭科‧科拉平托（\n\
  Franco Colapinto）。\n\n奧康和塞恩斯已在美國網路電影資料庫（IMDb）上的演員名單中，而荷蘭車手馬克斯‧維\n斯塔潘（Max Verstappen）、墨西哥車手塞爾希奧‧培瑞茲（Sergio\
  \ Perez）、前哈斯F1\n車隊老闆京特‧史坦納（Guenther Steiner）都出現在第一部預告片中。阿隆索還表示他\n有參與2024年英國大獎賽期間該片的拍攝。\n\
  \n《F1電影》於2025年6月25日在台灣上映，6月27日在美國上映。\n\n\n《F1電影》劇照。（華納兄弟提供）\n\n責任編輯：蘇漾\n\n\n\n--\n\
  \                 \n   \n\n\n\n--"
