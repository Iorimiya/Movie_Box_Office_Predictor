title: '[討論] F1電影一個小問題（雷）'
content: '防雷防雷防雷






























  沒想到已經兩個月了竟然還在上映

  昨天看完覺得有去電影院看F1真的太棒了

  明明是賽車電影卻拍出了磅礡史詩的感覺


  只是其中有一個小片段不太明白來請教一下大家

  翻了前面的文章沒有看到類似問題

  （如果已經有人問過我再刪文抱歉）


  凱特找海耶斯和皮爾斯打撲克（？）那裡

  他們用賭博決定誰是隔天的頭號車手

  為什麼海耶斯會故意不亮底牌把頭號車手讓給皮爾斯？

  因為後面的劇情好像也沒有特別提到隔天比賽的頭號車手有發揮什麼作用

  不可能是為了把電燈泡支開好讓海耶斯可以順利啪啪啪這種理由吧？


  再麻煩大家幫忙解惑了

  感謝


  --'
