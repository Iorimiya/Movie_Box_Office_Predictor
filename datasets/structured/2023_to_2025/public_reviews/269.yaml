title: '[新聞] 《F1電影》製作成本高 全球首映票房預測出'
content: "《F1電影》製作成本高 全球首映票房預測出爐\n\n【大紀元2025年06月26日訊】（大紀元記者葉子杰編譯報導）當地25日，外媒預估好萊塢\n\
  巨星布萊德‧彼特主演的《F1電影》（F1）全球首映票房可望突破1.15億美元，與《捍衛\n戰士2》相比，其製作成本相對較高，而影評網爛番茄上的影評員評分相對較低。\n\
  \n據《Deadline》報導，由布萊德‧彼特（Brad Pitt）主演、《捍衛戰士2：獨行俠》（\nTop Gun: Maverick）導演約瑟夫‧柯金斯基（Joseph\
  \ Kosinski）執導的《F1電影》，預\n估將在北美首映週末票房三天票房收入預測將在4,000萬至5,000萬美元之間，並登上北美\n週末票房冠軍。\n\n\
  \n《F1電影》（F1）片場照，導演約瑟夫‧柯金斯基（Joseph Kosinski）和布萊德‧彼特\n（Brad Pitt）。（華納兄弟提供）\n\n此外，《F1電影》的預售成績超過了《神鬼戰士2》（Gladiator\
  \ 2）和彼特主演的《子彈\n列車》（Bullet Train）等大片。預計，《F1電影》在北美外的國際市場將獲得約7,500\n萬美元的票房，全球首週票房至少達到1.15億美元。\n\
  \n據《ScreenRant》《Collider》報導，《F1電影》的製作成本高達3億美元，超過了《捍\n衛戰士2》的製作成本1.7億美元。然而，製片人傑瑞‧布洛克海默（Jerry\
  \ Bruckheimer\n）對這數字提出了質疑，他表示，預算估計「錯估了數千萬美元」。他提到地區性退稅是\n節省部分成本的原因之一。\n\n\n《F1電影》（F1）片場照，製片人傑瑞‧布洛克海默。（華納兄弟提供）\n\
  \n柯金斯基說，在他參與製作的電影中，他發現預算過度報導的問題一直都存在。他表示，\n他「不確定《F1電影》那個數字是從哪裡來的」。目前，導演跟製片人雖然都對預算發表\n\
  了意見，然而，並沒有提供具體調整後的預算。\n\n\n《F1電影》（F1）片場照，導演約瑟夫‧柯金斯基。（華納兄弟提供）\n\n據報導，假設《F1電影》預算低於3億美元，估計在2億到3億美元之間，製作成本仍然非\n\
  常高。通常來說，電影需要達到預算的2.5倍左右才算是成功，也就是全球票房收入需要\n達到5億到6.5億美元才能收支平衡並獲利。\n\n而彼特主演的票房最高的電影，目前是《末日之戰》（World\
  \ War Z），全球票房為5.318\n億美元。因此，彼特需再打破紀錄，才能獲得票房利潤。此外，不僅要保持電影熱度，還\n要應對下週即將上映的大電影《侏羅紀世界：重生》（Jurassic\
  \ World: Rebirth）的票\n房衝擊。\n\n雖然如此，但蘋果或許對這部電影已經制定了多項計劃，即使沒有5億美元或更高的票房\n收入，蘋果很可能也會讓這部電影能在串流媒體和數位平台上實現獲利。\n\
  \n據《ComingSoon》報導，《F1電影》的評價相對低於《捍衛戰士2》；《F1電影》獲得爛\n番茄86%的影評員評分，《捍衛戰士2》獲得96%的影評員評分並榮獲「認證新鮮」殊榮，\n\
  自2022年《捍衛戰士2》上映以來一直維持其地位。兩部電影均由柯金斯基執導，布洛克\n海默擔任製片。\n\n《F1電影》已在台灣上映，6月27日在美國上映。\n\
  \n\n《F1電影》劇照。（華納兄弟提供）\n\n\n《F1電影》劇照。（華納兄弟提供）\n\n新聞網址：\n\n\n\n--\n              \
  \   \n   \n\n\n\n--"
