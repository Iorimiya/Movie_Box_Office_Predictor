title: '[雷] F1電影 適合入門者'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n    這部基本上是讓入門或是沒看過F1，入門的電影，畢竟是自由媒體跟Apple為主要的出資者。\n\
