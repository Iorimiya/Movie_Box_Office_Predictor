title: '[好雷] 絕戰終點線Rush - 我看過最好的F1電影'
content: '雷文防雷資訊頁

  雖然這是2013的電影了，甚至還是真人真事改編，還是意思防一下雷。




  預告片



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  故事在講兩位70年代的賽車手，James Hunt是個風流倜儻、果敢年輕的年輕車手，

  由雷神Christopher Hemsworth飾演。


  另一位是Niki Lauda，是個機械天才，是個喜歡事前精密計算的人，和亦敵亦友

  的James Hunt是兩個完全不同類型的賽車手。


  內容就是兩人在場內場外，互相競爭、互相扶持的賽車手情誼。


  心得:


  剛去看完Brad Pitt的F1，不知不覺就和十幾年前，也是去電影院看的Rush做比較。

  甚至連電影配樂，還是一樣是Hans Zimmer作曲。




  我個人是覺得，2013年的Rush，帶給我比較多賽車熱血男兒的感動。


  --'
