title: '[討論] 二刷F1電影'
content: '剛去二刷回來


  板上心得常有人詬病Sonny“在飛時“配樂怎麼放那麼大聲

  才沒有好嗎！！！

  那段明明就只有Sonny的呼吸聲！

  配樂是後面才出來的！


  一刷是在剛上映時的A13 Titan廳，螢幕到大近在眼前

  小布的chill跟帥根本從螢幕滿出來

  而且感覺同一場的人滿多都知道F1正賽跟DTS的梗

  電影的笑點都有人捧場



  二刷是中型影院的小廳

  從觀眾的反應來看，應該不是賽迷

  電影笑點不太有人get到

  螢幕不大，觀影體驗真的沒大螢幕來得好



  --'
