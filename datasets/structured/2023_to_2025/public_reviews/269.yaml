url: https://www.ptt.cc/bbs/movie/M.1754314280.A.457.html
title: '[新聞] 《F1電影》全球票房破168億！成布萊德'
content: '新聞網址：


  《F1電影》全球票房破168億！成布萊德彼特34年來「最賣座作品」

  2025年08月4日 19:30


  記者劉宛欣／綜合報導


  好萊塢男神布萊德彼特（Brad Pitt）主演的賽車題材電影《F1電影》（F1 The Movie）

  近期在全球票房傳出捷報，總收入正式突破5.456億美元（約168億台幣），打破他個人34

  年演藝生涯的票房紀錄，超越2013年上映的《末日之戰》（World War Z），成為他演藝

  生涯票房最高的主演作。


  《F1電影》由《捍衛戰士：獨行俠》導演約瑟夫柯辛斯基（Joseph Kosinski）執導，上

  映以來話題不斷。根據外媒報導，《F1電影》目前全球票房已正式超越《末日之戰》，雖

  然與真正「賺翻」的商業大片還有距離，但在布萊德彼特個人主演代表作中已締造新高。


  回顧布萊德彼特的高票房代表作，除了《F1電影》與《末日之戰》，還包括2004年史詩鉅

  作《特洛伊》（Troy）以4.974億美元（約148億台幣）居次，接著則是安潔莉娜裘莉共演

  的《史密斯任務》（Mr. & Mrs. Smith）則以4.873億美元（145.3億台幣）緊追在後，他

  的生涯至少有超過25部作品的全球票房突破1億美元，可謂是當之無愧的票房保證。


  不過，《F1電影》雖然氣勢如虹、票房亮眼，但由於製作成本高達3億美元（約89.4億台

  幣），業界推估恐得達到約7.5億美元（約223.6億台幣）才能回本。所幸出品方Apple St

  udios並不以院線收入為主要目標，而是將此視為品牌與平台宣傳的前哨戰，實際的收益

  更著眼於後續在Apple TV+上的串流播放表現。


  --'
