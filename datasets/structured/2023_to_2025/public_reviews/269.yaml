title: '[新聞] 湯姆克魯斯驚喜現身《F1電影》首映！導演'
content: '湯姆克魯斯驚喜現身《F1電影》首映！導演透露：曾想找阿湯哥和布萊德彼特一起演出《

  賽道狂人》




  湯姆克魯斯驚喜現身倫敦《F1電影》首映會，與布萊德彼特一同踏上紅毯，兩位好萊塢頂

  級巨星並肩合影，睽違 31 年的再會讓影迷激動不已——他們曾於 1994 年共同主演尼爾

  喬丹執導的經典恐怖片《夜訪吸血鬼》。


  彼特本月稍早在《F1電影》墨西哥首映時接受《E! News》訪問時曾表示，自己樂意再度

  與克魯斯合作演出。不過，這位曾以《從前，有個好萊塢》奪得奧斯卡的男星，似乎對克

  魯斯熱愛的高空特技興趣缺缺。


  他笑說：


  「我可不想把屁股掛在飛機外面，或搞那些有的沒的。所以等他哪天拍回到地面上的戲，

  我們再說吧。」


  今年夏天，湯姆克魯斯與布萊德彼特分別領銜主演兩部最受矚目的鉅片。克魯斯於五月回

  歸《不可能的任務：最終清算》，該片創下系列全球首週票房新高，達 2 億美元，目前

  全球票房已突破 5.4 億美元；彼特則主演 Apple 與華納兄弟聯手打造的賽車電影《F1電

  影》，由《捍衛戰士：獨行俠》導演喬瑟夫柯金斯基執導，兩部電影的製作人也都是知名

  的傑瑞布洛克海默。


  柯金斯基日前接受《GQ》專訪時透露，其實他早有意讓克魯斯與彼特在他原本構思的《賽

  道狂人》版本中同台飆戲，兩人甚至打算親自上陣駕駛。不過該計畫最終因預算未獲批而

  流產，最後由詹姆斯曼格執導，改由克里斯汀貝爾與麥特戴蒙主演。


  當被問到如果當初由克魯斯主演《F1電影》會如何時，柯金斯基說：


  「湯姆總是把一切推到極限，但他真的非常有能力又技術高超。他和彼特一樣，都擁有極

  佳的駕駛天賦。不過老實說，我覺得湯姆可能會把我們嚇得更慘一點吧。」


  --'
