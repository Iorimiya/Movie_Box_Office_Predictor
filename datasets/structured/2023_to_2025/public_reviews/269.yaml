url: https://www.ptt.cc/bbs/movie/M.1753759724.A.5BF.html
title: '[新聞] 《F1電影》全球票房突破5億美元 8月中旬上'
content: "《F1電影》全球票房突破5億美元 8月中旬上線\n\n【大紀元2025年07月28日訊】（大紀元記者葉子杰編譯報導）截至當地週日（27日），好\n\
  萊塢巨星布萊德‧彼特主演的《F1電影》（F1）上映一個月後全球首映票房已達5.09億美\n元，對蘋果公司而言，算是一部成功的電影。該片將於8 月中旬在線上發行。\n\
  \n\n《F1電影》劇照。（華納兄弟提供）\n\n據《ScreenRant》報導，自6月27日《F1電影》在美國全面上映以來，雖然與《侏羅紀世\n界：重生》和《超人》等暑期檔熱門電影競爭票房，但仍持續吸引著眾多影迷。該片製作\n\
  成本高達2.6億美元，截至27日，北美總票房達1.65億美元，全球票房達5.09億美元。北\n美票房表現平平，但在國際市場上卻表現出色。\n\n對於奧斯卡獲獎演員布萊德‧彼特（Brad\
  \ Pitt）來說， 5億美元的票房里程碑實屬罕見\n，《F1電影》已是他職業生涯中全球票房第二高的作品，此前他曾憑藉派拉蒙影業的《末\n日之戰》（World\
  \ War Z）創下過5.4億美元的票房佳績。基本上，他都避開拍攝像漫畫電\n影這樣高成本的系列電影。\n\n\n《F1電影》片場照（華納兄弟提供）\n\n《F1電影》不僅已是彼特的鉅作，也是蘋果影業至今為止最賺錢的電影，其全球票房5.09\n\
  億美元遠超過之前蘋果所有電影的最高紀錄，由名導演雷利‧史考特（Ridley Scott）執\n導的史詩片《拿破崙》（Napoleon）僅2.21億美元，而大導演馬丁‧史柯西斯（Martin\n\
  Scorsese）的《花月殺手》（Killers of the Flower Moon）只有1.58億美元。\n\n據《Maxblizz》報導，《F1電影》將於2025年8月15日起在美國Amazon\
  \ Prime Video、\niTunes、Vudu和Google Play影視等數位平台上提供購買和租賃服務。據《9to5Mac》報導\n，該片最終將登陸\
  \ Apple TV+，預計10月後上線。\n\n在評分方面，美國網路電影資料庫（IMDb）滿分為十分，截至今日，《F1電影》獲得觀眾\n7.9的好評；爛番茄影評員與觀眾分別給予83%及97%的新鮮度好評。\n\
  \n\n《F1電影》劇照。（華納兄弟提供）\n\n據報導，雖然《F1電影》因高製作成本導致利潤空間不大，但這對蘋果影業而言是一個完\n美的經典範例，展示了蘋果如何藉由與IMAX的合作、以及利用其旗下所有平台（包含串流\n\
  服務平台）進行推廣，從而獲得豐厚的報酬。\n\n\n《F1電影》電影海報。（華納兄弟提供）\n\n責任編輯：蘇漾\n\n\n\n--\n           \
  \      \n   \n\n\n\n--"
