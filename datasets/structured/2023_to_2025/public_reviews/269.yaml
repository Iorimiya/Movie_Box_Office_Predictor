url: https://www.ptt.cc/bbs/movie/M.1751377502.A.5F1.html
title: '[無雷] F1電影，帥就完事了，過癮'
content: '完全沒在看賽車運動的我看得是非常爽


  配樂還有引擎的轟鳴聲真是嚇嚇叫，無比熱血


  我才不管現實比賽中怎麼樣怎麼樣


  這部片看起來就是非常的過癮


  除了是陸地版捍衛戰士獨行俠之外


  還有卡通超智遊戲的感覺


  真難想像老布已經60歲了


  好幾幕還真是帥到不得了


  其他配角甚至小小配角也是男帥女美，看了就是賞心悅目，心情很好


  現場2.5小時體感1.5小時


  看了實在太過癮


  至於片尾很多人說處理得不好我覺得超棒的


  這部分有看過的應該不少有所體會


  滿分十分，這部我給9分，太讚太爽了




  -----

  Sent from JPTT on my Google Pixel 6a.


  --'
