url: https://www.ptt.cc/bbs/movie/M.1751141819.A.7BC.html
title: '[普無雷] 《F1電影》'
content: '不知道

  我不是車迷

  也很少看F1比賽

  這片給我的感覺就是很刺激的賽車，加上平庸的劇情

  演員感覺沒有什麼發揮到


  是不會睡著

  但是整片對於非車迷來說

  就是有點不上不下的感覺

  對新手有一定的難度

  尤其是旗號代表什麼？

  戰術又是什麼？

  一直故意搞車禍可以嗎？

  為什麼布萊德彼特不會被禁賽？

  很多疑問在腦中迸發


  Netflix的紀錄片或許可能比較平易近人？

  我沒看過，我也不知道


  我是候補特映看的

  很少有電影是看完我寫不出什麼感想的

  恭喜F1躍登第一


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
