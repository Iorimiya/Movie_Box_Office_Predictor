url: https://www.ptt.cc/bbs/movie/M.1754957360.A.435.html
title: '[新聞] 《F1電影》沒被《鬼滅》砍成重傷！全台'
content: '《F1電影》沒被《鬼滅》砍成重傷！全台賣破4.7億 暫居年度冠軍


  記者蘇詠智／綜合報導


  暑期票房大戰結果瞬息萬變，布萊德彼特《F1電影》近期才超越湯姆克魯斯《不可能的任

  務：最終清算》，以4.7億的全台賣座數字暫居目前台灣年度票房第一，馬上又碰到來勢

  洶洶的《劇場版「鬼滅之刃」無限城篇 第一章 猗窩座再襲》，雖然該片首週末票房就達

  1.7億元，《F1電影》卻只比上週末下滑24%，後勁超驚人，還有機會在冠軍寶座上再撐一

  陣子。


  《F1電影》搶下年度賣座冠軍　《鬼滅之刃》來勢洶洶準備取代


  今年暑假強片的賣座之爭，各方原先都看好《不可能的任務：最終清算》，認為台灣觀眾

  對於湯姆克魯斯的熱情支持，以及對動作類型的情有獨鍾，都讓這部片極具贏面。反而《

  F1電影》被打上大大的問號，儘管布萊德彼特在台灣也算知名度極高，卻沒有湯姆克魯斯

  那麼穩固的票房號召，加上主題又是在台灣並沒有蔚為風潮的賽車，《F1電影》能否被市

  場主流觀眾接受，都沒人敢打包票。


  不過真正上映後，靠的就是口碑效應，而《F1電影》在台灣觀眾之間的口碑極為出色，不

  只對賽車不熟悉的觀眾看了因此產生興趣，原先就是賽車迷的觀眾更在討論到底片子的情

  節符不符合現實？至於刺激過癮的場面，更讓銀幕尺寸巨大的IMAX，或是能感受到顛簸效

  果的4DX等票價更高的特殊版本呈現驚人的滿座率，在片子剛推出的一、兩週，甚至是一

  票難求。


  《F1電影》威力強大到連《超人》、《侏羅紀世界：重生》等稍後才在台灣上映的大片，

  賣座數字都還被先上映的它壓下，台灣放映超過一個月還坐在票房冠軍的位子上，直到日

  本動畫超級巨片《劇場版「鬼滅之刃」無限城篇 第一章 猗窩座再襲》登場，才被擠下週

  末票房冠軍寶座。


  《鬼滅之刃》奪年度冠軍聲勢強　《阿凡達：火之燼》年底上場挑戰


  接下來兩部片要爭奪的全台年度票房冠軍榮銜，《鬼滅之刃》最新劇場版挾上一部電影在

  台狂賣6億多的氣勢，續集有機會更上一層樓，而《F1電影》從在台上映首週末賣座還未

  破億，到現在幾乎有機會飆破5億大關，後勁已算非常強旺，要衝破全台6億比較困難。按

  照這樣來預估，《劇場版「鬼滅之刃」無限城篇 第一章 猗窩座再襲》超越《F1電影》、

  搶下台灣年度票房冠軍，只是時間早晚而已。


  不過今年底還有《阿凡達：火與燼》要上映，上一集《阿凡達：水之道》全台票房破7億

  ，《鬼滅之刃》未必能打贏，使得年度賣座冠軍大戰，賽果變得更詭譎難測，也更加有意

  思。




  --'
