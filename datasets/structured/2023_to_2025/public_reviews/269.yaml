url: https://www.ptt.cc/bbs/movie/M.1755843695.A.4F9.html
title: '[普雷] F1電影 不如賽道狂人'
content: '防雷











  標題寫不如賽道狂人 並不是說不好


  畫面 拍攝品質都最高規格


  但是明顯劇情人物刻劃不如賽道狂人 當然賽道狂人是真實事件改編的劇情當然會比較好


  先說好的


  畫面很清晰賽車時很有真實感 喜歡F1或喜歡賽車的應該都很喜歡這部


  沒了


  缺點就是這是一部賣賽車的電影


  精力幾乎都投注在賽車和其他設備


  劇情很一般


  布萊德彼特的屌樣演技遠不如貝爾的屌樣


  尤其是當獨當領先時的起飛 對我來說沒有感同身受


  而貝爾在獨當領先時先是大唱特唱 興奮後感覺到的孤獨感 讓我感同身受


  最受不了的是為什麼一定要有親熱戲？


  完全是多出來的橋段 是要表現主角很風流嗎？不懂


  總之這是一部值得去戲院看的電影 對於不熱衷賽車的我來說 完全沒有想去二刷或是下檔後

  在第四台播放時停下來看的慾望


  反而我還是會回味賽道狂人


  --'
