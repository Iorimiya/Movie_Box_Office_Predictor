url: https://www.ptt.cc/bbs/movie/M.1749718994.A.1CA.html
title: '[新聞] 布萊德彼特頂小平頭走《F1電影》紅毯'
content: "布萊德彼特頂小平頭走《F1電影》紅毯\n\n2025年6月9日，好萊塢巨星布萊德‧彼特（Brad Pitt）參加了墨西哥城舉行的《F1電影\n\
  》粉絲活動。（華納兄弟提供）\n\n【大紀元2025年06月11日訊】（大紀元記者葉子杰編譯報導）當地9日，好萊塢巨星布萊\n德‧彼特（Brad Pitt）參加墨西哥城的新聞發布，宣傳他主演的《F1電影》，紅毯上他\n\
  以小平頭的造型亮相，再次開啟了他的寸頭時代。\n\n據《時人》報導，61歲的布萊德‧彼特為了宣傳他的《F1電影》（F1），週一他白天出席\n了墨西哥索菲特酒店（Sofitel\
  \ Reforma）的拍照活動，晚上出席納烏卡爾潘德華雷斯的\n托雷奧中央公園（Toreo Parque Central）粉絲活動，首次以新髮型正式亮相。\n\n\
  白天彼特穿著鮭魚紅西裝、淡藍色襯衫和白色穆勒鞋與《F1電影》導演約瑟夫‧柯金斯基\n（Joseph Kosinski）、製片人傑瑞米‧克雷納（Jeremy Kleiner）和英國男演員丹姆森\n\
  ‧伊卓斯（Damson Idris）和愛爾蘭女演員凱莉‧肯頓（Kerry Condon）一起合影。\n\n\n2025年6月9日，（左起）導演約瑟夫‧柯金斯基、丹姆森‧伊卓斯、凱莉‧肯頓、布萊德\n\
  ‧彼特、製片人傑瑞米‧克雷納參加了墨西哥城舉行的《F1電影》拍照會活動。（華納兄\n弟提供）\n\n這並非粉絲第一次目睹彼特的寸頭髮型， 2004年至2005年間他曾留這種經典的平頭。晚\n\
  間粉絲會活動時，他換上了一套灰色西裝、一件白襯衫和一雙尖頭靴。他在F1粉絲活動上\n暢談了賽車運動。\n\n\n2025年6月9日，布萊德‧彼特（參加了墨西哥城舉行的《F1電影》粉絲活動。（華納兄弟\n\
  提供）\n\n當彼特被問到是否害怕方程式賽車開快車時，彼特向《Extra》說：「不會，速度是相對\n的，如速度更高更要信賴剎車，那會讓你更專注一點。」\n\n\
  談到在實際的F1大獎賽中拍片和比賽時，彼特坦言他有點緊張，「我們已經在英國銀石賽\n道排練了幾個星期，所以感覺有點像回家的感覺，但當整個比賽準備開始時，那就真像一\n\
  台龐大的機械裝置，會讓人感到敬畏，然後能夠和十萬名觀眾一起站在賽道上，我確實有\n點緊張。」\n\n但比賽開始後他感受到一種興奮感，彼特說：「事實上開始後，並不緊張了，那是一種興\n\
  奮，像是在等待時，一旦開始了，那就是一種興奮，一種高潮。」\n\n談到F1車迷對這部電影的反應，彼特分享說：「我對我們作品成果很有信心。你知道，我\n覺得我們成功地串起了兩方粉絲，既照顧到了解F1運動的車迷，也能吸引新觀眾了解F1，\n\
  他們也明白這是我們的目標，而且，我不知道，我覺得他們也玩得很開心。我覺得這很有\n趣，真的非常有趣。」\n\n\n2025年6月9日，丹姆森‧伊卓斯和布萊德‧彼特（右）參加了墨西哥城舉行的《F1電影》\n\
  新聞發布會。（華納兄弟提供）\n\n\n2025年6月9日，布萊德‧彼特參加了墨西哥城舉行的《F1電影》新聞發布會。（華納兄弟\n提供）\n\n\n2025年6月9日，布萊德‧彼特參加了墨西哥城舉行的《F1電影》粉絲活動。（華納兄弟提\n\
  供）\n\n此外，他還透露了接下來的計劃——《從前，有個好萊塢》（Once Upon a Time in\nHollywood，2019）的續集電影。彼特說：「我們正在製克里夫‧布茲這個角色生活中的\n\
  另一集。這集是昆汀‧塔倫提諾（Quentin Tarantino）編劇的，導演將由大衛‧芬奇（\nDavid Fincher）執導，我們全部都在洛杉磯拍攝，這將會非常有趣。」\n\
  \n\n電影海報。（華納兄弟提供）\n\n《F1電影》2025年6月25日在台灣上映，6月27日在美國上映。\n\n責任編輯：蘇漾\n\n\n\n--\n  \
  \               \n   \n\n\n\n--"
