  \    如果是F1一直觀看的車迷，千萬不要有太多的連結，不讓會很是失望，捍衛戰士獨行俠，陸地版來看就好。\n     另外布萊德彼特，真的帥翻。為威廉斯默哀，配合電影演出，還要接受調查。\n\
  \    另外最後一站比賽後布萊德彼特，他在口袋抽到的撲克牌，到底是不是是黑桃A這就讓觀眾去想像？\n\n-----\nSent from JPTT on my\
