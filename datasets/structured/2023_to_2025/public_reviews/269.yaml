url: https://www.ptt.cc/bbs/movie/M.1750780431.A.AD4.html
title: '[好雷] F1電影'
content: '今天去美麗華看F1電影


  人很多 還做了起跑燈號背景


  還找阿Ken 玖壹壹來站台(為什麼不找林志穎?


  觀看體驗則是很像賽車版的捍衛戰士獨行俠


  很多鏡頭都有種上一站是不是看過的感覺


  然後引擎聲浪及氛圍感的音效很值得去電影院看


  那是在家裡無法比擬的


  一直在畫面上找實際的賽車總監及車手


  能看到PEREZ出現在大銀幕真的很感動


  還有岡瑟寶貝有跟劇中的人互動超好笑


  還有其他像是TOTO/James/Vasseur等TP也有台詞鏡頭


  但是這部片真的是拍給對F1沒概念的人看得


  裡面的一些劇情推動真的會讓F1車迷覺得很傻眼


  只當娛樂爽片的話還不錯,但心目中最好看的還是RUSH


  去看的話不要太過認真,已經比跨界玩家合理多了


  以下有雷


  劇情推動的部分以F1車迷來說太不合理


  planC的策動早就讓他被判黑旗DQ 不然就是套圈套到看不到車


  而且都揮藍旗了還可以擋車擋成這樣


  而且一個財務困難的車隊最好可以這樣玩


  然後一個季中升級可以那麼大幅度,那怎麼還會排位賽那麼差


  細節真的是看看就好,太過認真會看不下去


  --'
