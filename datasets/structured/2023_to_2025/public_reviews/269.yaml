title: '[新聞] 《F1電影》不只登頂台灣年度最賣 全球將'
content: '新聞網址：


  《F1電影》不只登頂台灣年度最賣 全球將飆破6億美金

  2025/08/18 07:28

  羅子秦／核稿編輯


  〔記者許世穎／綜合報導〕由「小布」布萊德彼特主演的飆速強作《F1電影》票房持續上

  升，上週末（8月15至17日）上映邁入第8週，全球累積票已達5.9億美金（約台幣177.11

  億元），即將衝破6億美金（約台幣180.12億元）大關，其中4.07億美金（約台幣122.18

  億元）來自北美以外的海外市場，在海外市場展現驚人韌性。


  該片目前穩坐2025年全台票房冠軍，電影上週六（16日）在台上映55天，正式飆破台幣5

  億大關，成為今年首部在台賣破台幣5億的電影，也是發行該片的華納兄弟影業首部達此

  里程碑的作品，除了刷新華納兄弟在台發行紀錄，也已成為小布在台、北美、全球最賣座

  電影。


  --'
