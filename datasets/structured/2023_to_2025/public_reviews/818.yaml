url: https://www.ptt.cc/bbs/movie/M.1721317130.A.D79.html
title: '[情報] 《陰間大法師 BEETLEJUICE》最新預告'
content: "以他的名字呼喚他\n今年鬼門不給關\n\n怪才導演 #提姆波頓 全新作品\n 【#陰間大法師 BEETLEJUICE】9月5日 (週四) 請支援收驚\n\
  \n陰間大法師回來了！曾獲奧斯卡金像獎提名、獨具創意遠見的導演提姆波頓與入圍奧斯卡\n金像獎的麥可基頓再度攜手合作【陰間大法師 BEETLEJUICE】，這是怪才導演提姆波頓獲\n\
  獎無數的【陰間大法師】備受期待的續作。\n\n麥可基頓再度回歸演出他受歡迎的角色，入圍奧斯卡金像獎的薇諾娜瑞德（影集【怪奇物\n語】、【小婦人】）以及二度艾美獎得主凱薩琳奧哈拉（影集【富家窮路】、【聖誕夜驚\n\
  魂】）也再度回歸，分別演出莉蒂亞迪茲和笛麗雅迪茲；新加入的演員則包括賈斯汀瑟魯\n斯（【STAR WARS：最後的絕地武士】、影集【末世餘生】）、莫妮卡貝魯奇（【007：惡\n\
  魔四伏】、【駭客任務】電影系列）、首次演出大銀幕作品的亞瑟康堤（影集【龍族前傳\n】）、入圍艾美獎的珍娜奧特嘉（影集【星期三】、【驚聲尖叫 6】）飾演莉蒂亞的女兒\n\
  亞斯翠，以及入圍奧斯卡金像獎的威廉達佛（【可憐的東西】、【梵谷：在永恆之門】）\n。\n\n陰間大法師回來了！在發生一場意想不到的家庭悲劇後，迪茲家族的三代家人又回到冬河\n\
  鎮的家中。莉蒂亞仍然受到陰間大法師的糾纏，當她叛逆的青少年女兒亞斯翠在閣樓發現\n了神秘的小鎮模型，以及通往陰間的入口不小心被打開之後，她的生活就被搞得天翻地覆\n\
  。當陰間和陽間開始出現麻煩時，遲早會有人說出陰間大法師的名字三次，然後這個調皮\n搗蛋的惡魔就會回來，釋放他獨特的混亂力量。\n\n【陰間大法師 BEETLEJUICE】由華納兄弟影業出品及全球發行。\n\
