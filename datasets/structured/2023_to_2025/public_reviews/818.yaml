url: https://www.ptt.cc/bbs/movie/M.1724754408.A.154.html
title: '[贈票]  【陰間大法師 BEETLEJUICE】 特映搶先看'
content: "★ 怪才導演 提姆波頓 全新作品\n\n★麥可基頓、薇諾娜瑞德、凱薩琳奧哈拉 經典回歸\n\n★【星期三】珍娜奧特嘉 重磅加盟\n\n★ 電影預告：\n\
  \n★【陰間大法師 BEETLEJUICE】9月5日 (週四) 請支援收驚\n\n\n陰間大法師回來了！曾獲奧斯卡金像獎提名、獨具創意遠見的導演提姆波頓與入圍奧斯卡\n\
  金像獎的麥可基頓再度攜手合作【陰間大法師 BEETLEJUICE】，這是怪才導演提姆波頓獲\n獎無數的【陰間大法師】備受期待的續作。\n\n\n陰間大法師回來了！在發生一場意想不到的家庭悲劇後，迪茲家族的三代家人又回到冬河\n\
  鎮的家中。莉蒂亞仍然受到陰間大法師的糾纏，當她叛逆的青少年女兒亞斯翠在閣樓發現\n了神秘的小鎮模型，以及通往陰間的入口不小心被打開之後，她的生活就被搞得天翻地覆\n\
  。\n\n當陰間和陽間開始出現麻煩時，遲早會有人說出陰間大法師的名字三次，然後這個調皮搗\n蛋的惡魔就會回來，釋放他獨特的混亂力量。\n\n\n《抽獎方式》\n\
  8月28日 23:59前，推文留言你想要看【陰間大法師 BEETLEJUICE】原因，就有機會獲得\n電影特映券\n（如：我想看陰間大法師 BEETLEJUICE，想看提姆波頓這次會帶來什麼樣的驚喜)\n\
  \n\n《獎項內容》\n【陰間大法師 BEETLEJUICE】電影特映券（一組2張）\n\n\n《特映會場次》\n台北松仁場：9/2(一) 11:30 松仁威秀\
  \ TITAN Ｘ10組\n台北美麗華場：9/2(一) 20:00 大直美麗華 X 5組\n台中場：9/4(三) 19:00 台中站前秀泰 X 5組\n高雄場：9/4(三)\
  \ 19:00 高雄夢時代秀泰 X 5組\n\n\n\n《中獎通知》\n8月28日公布中獎者於回文內，並寄站內信通知得獎者得獎事宜。\n8月30日12:00 前，請各位中獎人務必回覆領獎資訊，恕不接受逾期回覆。\n\
  \n《注意事項》\n1.特映券為非賣品，嚴禁兜售等圖利行為。\n2.票券尚未劃位，請於開演前60分鐘自行領票，座位劃滿即不受理。\n3.請準時入場觀賞，電影開演後10分鐘戲院與主辦單位有權謝絕入場。\n\
  4.如本活動因不可抗拒之特殊原因無法執行時，主辦單位有權決定取消、終止、修改或\n暫停本活動與延遲得獎公告。\n更多電影資訊：華納兄弟台灣粉絲團 \n\n--"
