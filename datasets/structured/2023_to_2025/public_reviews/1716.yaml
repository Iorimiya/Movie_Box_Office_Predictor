  \n這個年輕女子名字叫凱西（ 飾），她過去似乎跟喬有某種關係。\n\n與此同時，喬與駁船老闆的妻子艾拉（ 飾）之間漸漸產生了曖昧的情愫……\n\n\n\n\n\
