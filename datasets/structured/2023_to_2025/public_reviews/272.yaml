url: https://www.ptt.cc/bbs/movie/M.1527420660.A.607.html
title: 'Re: [請益] 讓子彈飛，八歲兒子的疑問'
content: "兄台你好，我是小生，偶爾客串回文，點綴你的人生。\n\n讓子彈飛這部神劇，我也非常喜愛。\n有時候在電視台轉到，或是在版上看到有人分享，\n我都會再重溫一次裡面許多的經典片段。\n\
  而且不同的時期看，都會有不同的體悟。\n\n這個橋段，我認為不該獨立出來看，\n而應該跟前面的劇情一起連著看，才能理解其中的隱喻。\n\n師爺這個角色，買官當縣長的目的，不為別的，就是為了掙錢。\n\
  還記得他在張麻子第一天到縣衙的時候兩個人的對話嗎？\n\n師爺：「晚了，鵝城的稅，已經被收到民國九十年以後了。來錯地方了！」\n麻子：「我倒覺得這地方挺不錯。」\n\
  \n師爺：「百姓成窮鬼了，沒油水可榨了！」\n麻子：「老子從來就沒想過刮窮鬼的錢。」\n\n\n\n\n看到了嗎？\n\n這就是師爺和麻子兩人在中心思想上最大的對立。\n\
  \n師爺想遵循舊體制，賺穩妥的錢，\n即便在金權一把抓的黃四郎手裡就是跪著要飯的也無所謂，\n\n麻子想做的，表面上是掙錢，\n但實際上是顛覆舊有的體制與黑暗的政治。\n\
  \n這兩個人思想上的差異，註定了他們在日後必然分道揚鑣的結局。\n\n--\n\n師爺唯一的目標就是賺錢，他選擇跟在麻子身邊，\n不外乎就是他認為麻子奇貨可居，可以在他身上賭一把。\n\
  \n所以當麻子成功的綁架豪紳換到贖金時，他認為麻子集團一開始的目標，\n\n\n\n於是他對麻子說：「我認為，六子的仇，算是報了。」\n但是在麻子心中，人命和錢，不是這樣算的。\n\
  \n他決心要推翻黃四郎，及其所代表的黑金體制，\n所以他做了一個非常重要的舉動，那就是「發錢」。\n\n\n\n這舉動可以說是踩到唯利是圖的師爺的停損點了，\n\
  師爺原本以為他和麻子至少有個共同的目標就是掙錢，\n\n掙窮鬼的錢也好，能掙到有錢人的錢更好。\n只要是錢，他都可以。\n\n但把錢發給窮人，這他媽就是搞革命了。\n\
  革命的風險不只是花錢，還會流血，\n這大大違背了師爺為了賺輕鬆錢，跪著要飯不寒酸的精神。\n\n所以他便決定停損了。\n\n可那白花花的銀子都發出去啦，他能拿回什麼呢？\n\
  當然就是那兩顆鑽石了。\n\n他知道麻子內心其實非常善良，只要有個好故事，\n麻子在沒有銀子給的情況下，一定會把寶石交出來。\n\n於是他就找了這對母子，來騙取麻子的同情，\n\
  把麻子的殘餘價值榨乾，想拍拍屁股走人。\n\n所以不管這對母子是真傻還是假傻，都不重要。\n重要的是寶石到手，他就能腳底抹油。\n\n--\n\n而事實證明，湯師爺對風向的判斷非常敏銳。\n\
  從麻子發錢給窮人之後，兩陣營的衝突便升高到另一個層次。\n\n也許你會問，不過是發點錢，有啥大不了。\n\n兄台，重點從來就不在錢的數目，\n而是這樣的行為告訴老百姓，錢是可以回饋到人民身上的。\n\
  \n從前的縣長上任，巧立名目，拉攏豪紳，蓋了一堆蚊子館，\n收完稅後豪紳的錢如數奉還，百姓的錢三七分成。\n\n現在的縣長上任，不巧立名目，不拉攏豪紳，\n樽節市政府的預算，把還債當作一個KPI，\n\
  不只把錢還給市民，還想到了民國一百三四十年以後的子孫，\n\n突然之間全國各縣市的舉債都被百姓們拿來放大檢視，\n大家才發現有的縣根本破產了，幸福城市的市民原來背了那麼多債，\n\
  \n\n\n你說再給這樣的人四年，那些金權集團體系能不崩解嗎？\n\n--\n\n所以你說，發錢算不算革命？\n所以你說姚師爺..不對湯師爺，能不趕緊停損嗎？\n\
  所以你說那些從前一起喊剿匪的盟友們，能不想盡辦法跳出來弄死他嗎？\n\n整部戲最讓人唏噓的地方，就是樓破人散，\n老七跑來告訴張麻子花姐的真面目其實是內應，\n\
  團隊成員們一個個跟著花姐要離開的時候，\n\n麻子舉起槍，一手抵著太陽穴，一手抵著花姐説：\n\n\n\n這一幕不管看多少次，都難免感嘆。\n因利而聚者，終究因利而散。\n\
  \n--\n\n政治人物，\n\n不怕你好色、不怕你賤格、\n不怕你食言而肥，不怕你是個牆頭草，\n\n就怕你不愛錢。\n\n也因此師爺那句話言猶在耳，久久揮之不去。\n\
  \n\n\n\n\n罵的終究是自己，還是整個腐敗的體制？\n就留給各位看官自行評斷了。\n\n\n\n--\n『臉上潸潸淚兩行\n    書紙草草擱一旁\n \
  \     我飲陳年穿腸酒\n        是故昨夜迴夢鄉\n          小樓軒窗應猶在\n            生前生後兩相茫』       ──《唐‧佚名書生》\n\
  \n--\n\n如果他體面，你就讓他體面，\n如果他不體面，你就幫他體面。\n\n                                05/29 16:25\n\
  \                                      05/29 17:56\n                           \
  \       11/23 11:47"
