title: '[請益] 讓子彈飛，八歲兒子的疑問'
content: '大家好


  最近重看讓子彈飛

  想請問八歲兒子那裡到底有什麼隱喻

  理論上來說，張麻子應該已經知道師爺暗中跟黃四郎勾搭

  可是進了房間之後，那一段戲演起來是很歡樂的，跟一進門的肅殺氣氛格格不入

  還是其實張麻子知道師爺在騙人，而且知道那兩個人是黃四郎的手下，所以要故意把鑽石送回去給黃四郎


  而且師爺對著那個女人說：「你傻呀，這可是寶石」這句話也讓我很在意


  很多地方都看懂了但這段卻一直看不懂，求解釋



  -----

  Sent from JPTT on my Asus ASUS_Z017DA.


  --'
