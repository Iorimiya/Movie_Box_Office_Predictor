url: https://www.ptt.cc/bbs/movie/M.1750512073.A.AC8.html
title: '[溫馨雷] 八歲K9'
content: '這部有沒有暴雷真的有差嗎XD























  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  K9 這個詞，其實就是英文的 Canine 的簡寫

  英語系國家多用來當作警犬/軍犬 的代稱


  八歲K9 開頭以福星和其它警犬的榮退儀式做開場

  講述了台灣新北警察局警犬隊的點點滴滴


  整部電影沒有旁白講解，也沒有甚麼明顯的敘事結構

  更沒有刻意營造的情緒渲染、運鏡轉場、專業配樂


  很像是把警犬隊大家自己拍攝的各種片段

  不做甚麼修飾的剪輯在一起

  不只拍狗，也拍辛苦的警犬隊的工作日常

  還有大家的日常幹話XD

  整體來說是一部很親切平和的電影


  看的過程忍不住想到之前在網路上面看到

  英國警犬上崗兩個月就職業倦怠退休的新聞

  不知道對這些狗警官們，值勤出任務

  到底是一種使命，還是也只是一種遊戲?

  在搜尋炸彈的時候，是不是有意識到這是有危險性的?


  雖說沒有刻意營造情緒渲染

  但這種平實的日常，反而情感上更為寫實

  看到比利時狼犬粗骨的告別式大隊長對著牠講話

  個人也還是忍不住眼眶泛淚了


  最後一段訪問了警犬隊的隊員們

  那個喜歡狗的眼神，真的是沒有辦法掩蓋的


  退休後的福星看起來胖了不少

  看來福星也跟很多台灣退休大叔一樣

  一沒工作重心就開始各種放縱了XD


  整體來說是一部很真誠的紀錄片

  喜歡狗的人也千萬別錯過了


  --

  能夠理解公家單位經費有限，沒辦法像商務片這樣大雜行銷預算

  但是是一部很真誠的紀錄片，看得很開心'
