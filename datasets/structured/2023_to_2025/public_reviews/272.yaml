url: https://www.ptt.cc/bbs/movie/M.1461855219.A.156.html
title: '[好雷] 慾謀～韓國驚悚入侵好萊塢 血的十八歲'
content: '片名：慾謀

  台灣上映日期:2013

  網誌好讀版:


  心得：



  每年最期待的生日

  最愛的父親發生噩耗

  陌生的他來到了家裡


  總帶著迷人微笑

  將花園整理得美輪美奐

  但週遭熟悉的人們

  也悄悄的失去了蹤跡


  十八歲  即將成年的時刻

  蠢蠢欲動的慾望逐漸湧上～



  韓國人對於內心黑暗的描寫總是特別擅長，要推薦驚悚片的佳作可說是一拖拉庫，

  那股深入骨子裡的邪惡也讓好萊塢趨之若鶩，陸續邀請韓國大導到美國拍片，

  像殺人回憶導演奉俊昊頗受好評的末日列車，還有以原罪犯驚艷全球的暴力導演朴贊郁，

  初次跨足美國網羅了冰山美人妮可基嫚，所拍的第一部西洋片～慾謀


  不同於原罪犯或親切的金子之複雜，慾謀的故事和角色都相當簡單，

  描述一位妙齡少女面對成年的過程，但是導演是朴贊郁想必沒那麼簡單，

  藉由父親遭遇意外後突然出現的叔叔，挑起原本就很緊繃的母女關係，

  也一再攪動女孩心中那股渴望，不論是對性或是對血的慾望～


  劇情簡單卻探討得非常深入，

  加上用心的場景燈光設計，以及導演擅長的流暢運景，

  讓慾謀像一本精緻的小書，美麗畫面下藏著邪惡的念頭，

  即使步調慢卻能維持懸疑感，越看越感受到人心的恐怖。


  許多前面不經意說出的對白，

  後面是拼出真相的重要關鍵，叔叔與母親、女兒的禁忌之戀，

  不見血卻暴力異常的殺人片段，讓慾謀有好萊塢片少見的黑暗。


  最近於腥紅山莊登場的蜜雅·娃絲柯思卡，

  在片中將這位怪少女演得非常傳神，心境變化呈現的深刻又細膩，

  演叔叔的馬修·古迪也是超有魅力，當狐狸面具揭開時更是令人不寒而慄，

  至於妮可基嫚則維持一貫的美艷，受限於角色只能成為叔姪中的一顆棋子。



  劇情★★★★★★(最高10星)

  演員★★★★★★★★

  氣氛★★★★★★★★

  運景★★★★★★★★★


  整體★★★★★★★


  星等說明


  九星以上 經典

  六星以上 值得一看

  四星以上 還可以看

  三星以下 別浪費時間


  --

  歡迎光臨我的部落格

  阿一一之詩意與電影的流動



  --

  阿!查錯資料了 趕快去修改

  故事真的很簡單 導演功力超強(來修改一下星星)!!'
