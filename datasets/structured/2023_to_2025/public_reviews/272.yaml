title: '[普雷]《八歲K9》當小奶狗成為帥氣警犬'
content: '萌犬變猛犬，台灣警犬隊的服役艱辛路


  網路上有很可愛的迷因圖凸顯貓、狗的不同，狗認為給他食物的人類是神，而貓咪則認為

  自己是神，人類必須上繳食物。雖然是有趣的梗圖，但也可以了解，比起貓咪的自我與個

  性，狗的服從度與訓練是更為高的，也讓牠在人類社會中，常扮演著各式各樣的輔助角色

  。


  如今寵物的地位與尊重各種生物的觀念，已經在發達社會中不斷被敘述，狗、貓、甚至許

  多飼養的動物，都已經不是工具跟炫耀的玩具，而是陪伴人類的存在。其中不免俗的，狗

  也是加入人類社會最多的動物。


  《八歲K9》是一部在台灣較為少見，描繪警犬和新北警犬隊的紀錄片。故事以警犬退役為

  開頭，倒敘法回顧這些警犬從出生、訓練、出任務的專業警犬狗生。從一出生就有成為警

  犬的使命，並且經過訓練和與領犬警察的培養默契、執行逮捕犯人、拆彈等任務，這也讓

  這人狗之間不只是工作關係，有有著跨越物種的夥伴情誼，目送退下戰袍。





  《八歲K9》是什麼電影？


  寵物，在現在社會中已經從過去工作需要，轉變成一種深刻的陪伴，尤其是與人有著千年

  歷史訓化的狗、貓等常見的動物。在台灣，根據台灣農業部在2024政年度的統計，2023年

  全台寵物狗總數140萬，在兩年左右成長了19%。其中幫狗植入晶片、做絕育手術的數量也

  增多，全台約有七成。而飼養貓咪的人在近年來也大幅度的增加了50%，可以看見吸貓貓

  的魅力，以台灣來說整體養狗的人還是多於貓，兩邊還是達到平衡狀態。流浪貓、狗的狀

  況雖然略有好轉，但全台流浪貓狗還是達到約14萬隻。


  狗加入人類社會，作為輔佐人類需要的存在已經有很多年，在研究上將這樣的以狗來輔助

  工作的行為稱之為「公共用途」。其中又以「輔助、公務、醫療救難」三種項目為主，狗

  是能服從命令、高智商的動物、演化過程也較習慣於人類社會之中穿梭不被側目。


  在台灣公務上常見的如地震救難犬，常常在大樓坍塌，和友人被掩埋時派上用場，搜查犬

  也是常出沒於飛機場，通常會檢查旅客的行李，來看是否入境有攜帶違禁品，而警犬算是

  在世界各國警察體性最廣泛運用的公共用途之一，可以說如今儼然也是日常的一環。








  《八歲K9》是一部拍攝新北市政府警察局警犬隊，警犬紀錄長片。導演－張緯誌與林意婷

  ，兩人用8年的時間拍攝、剪輯完成，忠實的呈現，警察犬從小時候到長大，玩耍、訓練

  和與警員培養默契的模樣。其中也有實際出巡，和工作的樣子，還有每個警員描繪各自狗

  狗搭檔的訪談，雖然在外面執行、參加活動時，警犬與警員總是表現出專業，但實際上專

  業底下是一場努力的訓練，警犬搭檔也會不時在自己警員搭檔上留下烙印，但在又愛又恨

  下，警犬隊還是跟著警犬一起從出生、服役、走完這多年來的退役狗生。


  《八歲K9》中的K9是在工作犬中的術語，表示這隻狗在軍警領域受過專業訓練、並有自己

  的任務編制。其中K9是英文Canine（犬科動物）的縮寫，常用於指稱警犬。


  電影會用八歲命名，也是象徵服役年歲，通常八歲是警犬的退役年齡，故《八歲K9》如果

  直接翻譯片名可以說是「待退警犬」。其中軍犬、查緝犬也可以使用K9稱呼，其他工作犬

  則並不使用。《八歲K9》是從退役警犬的警察生活中倒推這八年的警察生涯，並從小時候

  開始直到長大迎接新的警犬小生命。










  《八歲K9》分析與延伸：


  警犬出現在現代社會之中已經超過百年的歷史，目前已知的資料是在19世紀末的歐洲比利

  時，開始訓練犬隻輔助警察夜間巡邏，之後也被歐洲各國模仿跟進。1899年，德國正式建

  立系統化的警犬訓練計畫和警犬學校，這也是K9的開端，當時第一批訓練的犬隻是以牧羊

  犬為主，這也讓提到警犬很習慣的聯想到該犬種。歐洲各國，每處都有著自己的警犬訓練

  進展，例如：法國的馬利諾犬原種，就是以自己警犬體系來選種，在國際相當知名，能訊

  述完成任務的犬種。


  雖然警犬是結合狗的服從與習性加以訓練，但並不是所有的狗都適合當警犬。例如台灣、

  日本喜歡的柴犬，就因為通常無法團體行動又神經質，較不適合當警犬，其中愛玩、脫軌

  演出的大狗哈士奇也很難擔任警犬職務，這類的狗比較適合居家寵物性質。


  適合警犬工作基本是服從度高、高智商的犬類，例如牧羊犬、拉布拉多、史賓格獵犬等。

  在《八歲K9》退休警犬主角「福星」就是一隻拉不拉多，這種親近人的犬隻通常會以偵爆

  、緝毒為主。








  《八歲K9》其實是導演張緯誌與林意婷在2016年就開始拍攝，在2018年曾剪輯出短片《

  K9 Canine》獲得新北紀錄片獎，也成為改編成長片的契機。導演表示：雖然這是一部描

  繪小狗們從出生就要當警察，成為國家守護者的故事，但也是有笑有淚的生命真實寫照。

  除了關注，警犬、軍犬退役後的社會再適應，與人狗情感歸屬，也讓人知道警犬的訓練與

  狗的認知兩者，都是辛苦的訓練和實戰所累積下的結果，並非輕鬆容易之事，並且在任務

  之中，不只警察的生命，警犬的生命也是同等重要。


  在國外也有不少描繪警犬的紀錄片，或系列探索的短片。例如德國有很硬派，以聯邦警察

  與反恐任務的警犬日常為單元的《K-9: Diensthund im Einsatz》描繪軍、警犬的實際作

  業工作。


  許多關於警犬的紀錄片多半都伴隨著警察任務、和警政宣傳的性質。跟《八歲K9》較為接

  近的紀錄片可能是英國BBC所拍攝的《Inside the K9 Unit: Britain''s Best Dogs》從專

  業訓練、到與訓練員的互動記錄，可以了解跟台灣不同有規模的國家警犬訓練和警犬服役

  退役制度的實行的制度化。









  《八歲K9》值得一看嗎？


  過去其實有大概看過幾部以警犬或軍犬的國外紀錄短片，裡面有詳細敘述訓練和警犬的培

  訓工作，並訪談專業的訓練師，和警犬查緝任務等跟拍實務等，算是很有警匪片的味道，

  只是主角換成了帥氣的軍警犬。這點上面其實是《八歲K9》中比較缺乏的，雖然《八歲K9

  》紀錄片也有出任務和訓練的場面，但可能是國情不同，又或是拍攝的風格差異，並沒有

  像歐美那樣，展現出帥氣的台灣警犬鏡頭，多是日常互動的風景。


  但要我說以國外的警犬紀錄片和台灣《八歲K9》紀錄片來話，我可能還是比較偏愛《八歲

  K9》給我的感覺，一來電影裡並不是刻意展現各種警犬帥氣的角度，而是從警犬小時候懵

  懂，跟其他犬隻夥伴吵吵鬧鬧，然後接受訓練從上下樓梯都有困難的小萌犬，變成可以到

  電車、機場執行任務的工作犬，有一種接近生活但又保持專業的實在感。


  我認為這是《八歲K9》跟其他國外警犬紀錄片的差異，畢竟我還沒見過哪一部國外警犬片

  ，會拍攝警察犬懷孕的鏡頭，和警察直接第一線接觸從小到大陪伴警犬互動的風景。









  雖然我很喜歡這種直接拍攝警犬隊的人與狗互動，但《八歲K9》紀錄片有是反應出台灣警

  犬制度還需要加強的地方。為什麼會拍新北警犬隊，主要就是台灣警犬本身全國規模就偏

  小，編制不足，新北警犬隊算是較有規模的小隊。其中在2018年台灣公視長青節目《誰來

  晚餐》也拍攝過關於台中警犬隊的狀況，也曾現出對於投入警犬訓練，目前仍是資源有限

  的情況。目前台灣警犬的訓練仍然很仰賴領犬員的傳承和實務摸索經驗，要達到像歐美等

  地的制度化，仍需要許多時間和投入才能完成。


  在電影剪輯上，可以看出導演一開始撥出警犬們的退役典禮，然後接續小狗的出現，可以

  說用回顧的方式，讓觀眾藉此回顧警犬服役的一生。但我覺得在許多方面剪輯和節奏的調

  整並沒有太過銜接，有種像是電視介紹片的片段性、碎片化，像是雖然知道狗狗們在做某

  項訓練，但卻不理解上面的訓練跟下面訓練的連接性，整體故事好像硬是要湊成一體，但

  反變得不能理解。


  當然裡面講述關於警犬的事情是很不錯的面向，但是《八歲K9》沒有能好好的串聯起來，

  是電影可惜的地方，但如果對警犬生態和喜歡狗的人，這部電影會是增加你對人狗感情認

  知的不錯的動物紀錄片。




  --

  個人Blog：

  小說連載頁：


  --'
