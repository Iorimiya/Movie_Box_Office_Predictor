url: https://www.ptt.cc/bbs/movie/M.1527327430.A.DE6.html
title: 'Re: [請益] 讓子彈飛，八歲兒子的疑問'
content: "其中不合理之處有幾個\n1.黃四郎為人小氣貪婪 為何一見面就大大方方送寶石給張麻子\n\n2.張麻子看到師爺老婆喊要錢\n為何不直接給錢反而給寶石\n\
  通常寶石難脫手 給現金最實在\n\n3.師爺竟然沒有替老婆加碼要現金\n反而拿到2顆寶石\n急忙要老婆趕緊收下走人\n\n\n\n因為寶石是假貨\n前面宴會中師爺明知寶石是假貨\n\
  仍與黃四郎聯手騙張麻子說寶石是真貨\n把寶石送給張麻子當見面禮\n\n師爺原以為黃四朗有錢一定大方\n沒想到為人小氣極度貪婪\n連別人送給百姓的錢也要派人搶回來\n\
  那可能會大大方方初次見面就送寶石給張麻子\n師爺深怕張麻子發現黃四郎送的寶石是假貨 當下想法子找人扮演老婆騙回來\n\n扮演老婆的人也不知道要騙假寶石回來以為要騙真貨\
  \ 看到張麻子拿出來的寶石 一眼看破\n是個假貨 才喊我不要石頭我要錢\n 一旁師爺急喊你傻呀，這可是寶石 要扮老婆的女 子趕緊收下走人\n\n\n至於張麻子應該也知道寶石是假貨\n\
  否則不會婦人要錢卻只送寶石不再給任何現金\n心理已明白在之前晚宴\n師爺與黃四郎早已暗通款曲\n所以之後計劃皆不主動告知師爺\n也不找師爺討論事情該如何做\n\n\
  \n石\n\n--\n內文已寫黃四郎+師爺知道送假的\n除此之外 其它人以為是送真的\n黃四郎順勢藉此向部屬表明因他們無能才會弄到老闆要花大錢送寶石暫時解決\n\
  黃四郎在這之後也沒在講寶石如何\n\n打個比方\n就像修勞基法明知對顧主有利\n對勞工好是假的\n政府仍對勞工講：我是為你們好 才修法\n\n套用回來\n黃四郎明知寶石是假的\n\
  仍對底下人講 為了你們辦事不利\n老闆出面花大錢才解決 賠了夫人又折兵\n你們不再把他解決 就走著瞧\n\n但細想回來 到這裡黃四郎損失什麼\n沒有 頂多損失一頓飯\n\
  搶別人捐給百姓的錢叫小氣不為過\n假麻子談分錢臉色馬上變 叫小氣不為過\n\n這問題又回到上面\n黃四郎+師爺知道送假的\n除此之外 其它人以為是送真的\n\n\
  師爺見到寶石竟又被假麻子送回到張麻子手中 一旦被其它人發現是假寶石加上張麻子自\n己弟兄路上遭埋伏死了\n肯定會被懷疑是內鬼\n\n當然馬上哭著偷偷閃到一旁\n\
  駕著整車銀子 不顧一切趕緊跑路\n不然妻小被殺不報仇\n若不想報仇 師爺此時跟張麻子開口要分錢跑路 相信張麻子也會同意\n\n寶石要是真的\n師爺竟馬上跑路這橋段不合理\n\
  \n師爺臨死前跟張麻子講\n他還有秘密沒講\n沒講就死了 我猜就是寶石是假的\n他早跟黃四郎暗通\n錢要是對黃四郎不重要\n幹嘛還派人去搶張麻子發給民眾的錢\n\
  \n你已經快講到宇宙大解密\n不是補腦\n寶石要是真的 有幾點無法合理解釋\n再重述一次\n1.黃四郎為人小氣貪婪 為何一見面就大大方方送寶石給張麻子\n\n\
  2.張麻子看到師爺老婆喊要錢\n為何不直接給錢反而給寶石\n通常寶石難脫手 給現金最實在\n\n3.師爺竟然沒有替老婆加碼要現金\n反而拿到2顆寶石\n急忙要老婆趕緊收下走人\n\
  \n4.師爺見假麻子已幹掉妻小並拿出寶石\n竟然馬上跑路 這橋段不合理\n依戲裡張麻子作為\n師爺不報仇想離開 向張麻子開口要分錢 相信張麻子一定會同意\n為何會沒意義\n\
  寶石在戲裡是媒介 串出黃四郎跟師爺早已暗通款曲\n不懂為何寶石會沒了？\n張麻子已把寶石給師爺家人\n算是師爺家人的 常理來講家人遺物\n還是歸師爺 別人如何開口\
  \ 寶石最終應該仍歸師爺\n\n劇情在那一段 師爺硬是突然跑路不合理\n要就是師爺不報仇 開口要分銀子 就此離去才對\n\n即然這樣 前面的劇情\n師爺為何有膽量張麻子討價還價\n\
  \n電影看完對內容的解讀本來就是想像力\n導演又沒出標準答案可以一一核對"
