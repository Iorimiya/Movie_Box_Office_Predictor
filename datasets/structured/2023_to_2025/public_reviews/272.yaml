url: https://www.ptt.cc/bbs/movie/M.1527339286.A.CB4.html
title: 'Re: [請益] 讓子彈飛，八歲兒子的疑問'
content: '或許不合理 但後面有一段殺雞取卵 黃四郎要扮成刺客的胡萬一定得把鑽石拿回來


  而且非常的憤怒 嚴厲


  所以不燒腦袋(雙方一直發動陷阱卡)的話 鑽石應該是真的




  這邊都有點假設立場 但應該不太可能


  如果這兩個是黃四郎的手下 那在後面假麻子出來的時候


  不應該被假麻子殺掉  師爺也不應該嚇到跑路




  這部戲中 師爺永遠是第三陣營的人 他只為了自己的利益行動 見人就說鬼話


  他永遠給雙方陣營留下一步活路  所以他不會特別倒向哪一派系 有錢賺為主要目的




  然後在根據電影中的對話去推(腦補)的話


  縣長夫人有罵師爺說他是"寫幾個爛劇本的老色鬼" "不是我出錢 誰給你當縣長"




  代表這兩個人是一個犯罪集團  縣長夫人是出資人 (也可能被師爺騙來的)


  師爺則是擬訂計畫 負責撈錢以後走人分贓




  後面出現的女人跟兒子 應該也是師爺的犯罪同夥


  師爺在九個地方當過縣長(騙錢) 可以確定之前撈過不少油水


  所以他一定得要有犯罪同夥在身邊接應 或是幫忙調度撈來的財物




  是不是他真正的夫人和兒子 就不重要了 主要是偽裝這個身分


  夫人跟兒子(麻子這邊則是二哥) 帶著鑽石離開的路上就被假麻子抓到 直接殺了


  後面師爺跑走後問的是山西在哪邊 代表山西可能是師爺藏財物的地方


  所以他在最後


  1.真的害怕 沒有意料到黃二爺有假麻子的存在 想要趕快離開鵝城


  2.自己的假家人死了 裝作崩潰的樣子 趕快逃回山西


  無論哪個 總之他就往地雷的方向跑了 掛了




  另外還可以腦補的就是 師爺說的第二件事


  我猜應該是縣長夫人是假的這件事 因為在死前師爺笑了 (跟他戲中爬上夫人床時一樣)


  這部戲當中師爺都表現出很迷戀縣長夫人的樣子


  至少不單單是個犯罪同夥 而是鍾情的對象




  --


  前面沒有看出來張麻子有想把鑽石拿出來的意思啊

  女人要的是錢 師爺交代的也是要女人拿錢


  沒有想到張麻子更大方直接拿鑽石出來給女人

  所以師爺說鑽石更值錢的時候女人就馬上把鑽石收起來了'
