url: https://www.ptt.cc/bbs/movie/M.1611893885.A.5B2.html
title: '[情報] iTunes多部$90起 獵殺星期一.舞動人生'
content: "全片單如下：\n\n\n$90 獵殺星期一 : \n\n娜歐米瑞佩斯主演，當年台灣票房意外好的黑馬科幻片。\n\n-\n\n$90 當辣妹來敲門\
  \ : \n\n基努李維跟新任007女郎安娜德哈瑪斯主演的驚悚片。\n\n-\n\n$90 唐頓莊園 電影版 : \n\n不少人看衰，結果超乎預期電影版口碑意外很不錯\n\
  \n-\n\n$90 地獄哪有那麼HIGH : \n\n神木隆之介主演，當年台北電影節口碑橫掃日系重金屬喜劇。\n-\n\n$90 紅鞋茱莉 : \n\n頗有法國新浪潮感的劇情小品，口碑挺好。\n\
  \n-\n\n$90 非正義搜查 : \n\n韓國政治驚悚劇。以1980年代的南韓全斗煥新軍事獨裁為背景。\n\n-\n\n$90 青少年哪吒 (修復版) :\
  \ \n\n蔡明亮導演處女座，李康生、陳昭榮主演。\n\n-\n\n$90 火花 : \n\n菅田將輝、桐谷健太主演。改編芥川賞暢銷300萬套小說，網飛影集版口碑超好，電影版\n\
  也是大推，有抓到那種寫實壓抑的氛圍。\n\n-\n\n$90 飛上天空的輪胎 : \n\n半澤直樹作家新作，真人真事改編，卡司很狂。\n\n-\n\n$90 一週斃命\
  \ - 不死退費 : \n\n歐洲口碑黑色幽默喜劇！突然的戀情，讓他不想死了，但他雇來殺他的殺手卻不喊停\n\n-\n\n$90 神佈局 : \n\n安東尼奧班德拉斯主演，頗有Ｘ戰警結合瞞天過海的感覺。\n\
  \n-\n\n$150 舞動人生 (數位修復版) : \n\n超經典雞湯，看幾次都哭\n\n-\n\n$150 惡魔島 : \n\n奧斯卡影帝 雷米馬利克、環太平洋\
  \ 查理滓~納主演。真人真事改編，震撼逃獄史的男人\n\n\n\n--"
