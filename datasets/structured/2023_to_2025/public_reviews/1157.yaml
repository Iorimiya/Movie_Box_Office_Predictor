url: https://www.ptt.cc/bbs/movie/M.1707577297.A.805.html
title: '[好無雷] 輕鬆小品喜劇 「 飛鴨向前衝」'
content: '其實預告演的差不多了 我指的是劇情走向


  但其實過程中笑料百出，滿滿的笑點


  人物討喜有趣，色彩豐富變化


  甚至有些飛翔的視角帶有一點3D劇院的FU


  很有臨場感 !!


  老梗的劇情


  但因為是老梗，卻意外的覺得有趣


  這部推薦給過年想放空與大笑的版友


  希望皮克斯能加把勁


  不要被照明娛樂搶盡風頭!


  PS: 我很喜歡皮克斯，可是這幾年真的不太行....








  --'
