url: https://www.ptt.cc/bbs/movie/M.1707574965.A.A68.html
title: '[選片] 飛鴨向前衝-賀歲片就是你了'
content: '四隻鴨子遷移到南部


  鴨子也沒有手


  要如何拍的有趣呢


  Illumination公司就是做到了


  一個貫穿全場的目的


  配合一段段好笑又可愛的冒險


  你會去關心每個角色


  且每分每秒絕無冷場


  不得不佩服編劇的功力


  當你以為好萊塢已經用光所有的idea後


  這部片又讓你如此耳目一新


  猜不到會有什麼樣的冒險


  但每個冒險卻又那麼有趣


  作畫可愛又讓你歡笑不斷


  強烈建議闔家觀賞


  你們會共享一段歡樂的時光





  --'
