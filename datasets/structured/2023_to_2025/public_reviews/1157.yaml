  各位！Apple TV第三周的特價開跑了！這次的特價有大量的動畫片與喜劇，我自己覺得值

  得把握的有提摩西夏勒梅主演的經典電影前傳《旺卡》，以及笑料十足，適合闔家觀賞的

  《飛鴨向前衝》。《魔髮精靈：樂團在一起》也同時優惠，算是新特價很多的一周。當然

  小朋友最愛的《汪汪隊立大功：超級大電影》也在特價之列，相信能讓全家大小度過一個

  歡樂的暑假。

  －

  除了暑期活動片單之外，本周還有華納的超多大片特價！首先$90的多部災難片可說是誠

  意十足，除了巨石強森的《毀滅大作戰》和《加州大地震》之外，還有《海神號》和《氣

  象戰》兩部氣勢磅礡的作品。$190的部分則是有幾部科幻大片，《魔鬼終結者：創世契機

  》和《科洛弗檔案》都頗值得收藏。

  －

  最後還有一些全系列特價的動畫！之前才剛特價第四集的《尖叫旅社》系列這次直接把前

  三集同時打折，難得特價的《打獵季節》也是四集全部優惠中。《史瑞克 6 部電影集合

  》我覺得也很值得把握，畢竟這套幾乎沒有同時單部特價過，可以趁套裝特價一口氣入手

  。

