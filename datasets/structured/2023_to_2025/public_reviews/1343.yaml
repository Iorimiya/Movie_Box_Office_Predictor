title: '[情報] 《驅魔13》全台上映戲院列表公開！'
content: "西班牙恐怖片年度票房冠軍！\n\n真實駭人驅魔案件【驅魔13】\n\n全台上映戲院列表公開！\n\n10/27 (五) 全台上映\n\n\n驅魔，不能超過13次——\n\
  \n有些禁忌，千萬不能鐵齒…\n\n\n《驅魔13》10/27 (五) 惡靈入侵\n\n電影預告：\n\n\n\n更多資訊：\n\n\n\n    《#屍物招領》《#佈局》製片團隊打造驅魔懼作\n\
  \    《#紙房子》《吉勒摩滅髡姻馱妞矇_櫃》特效團隊打造駭人場面\n     馬尼加西班牙電影節 最佳女主角 瑪麗亞羅曼尼奧斯 主演\n     威尼斯影展\
  \ 地平線單元 最佳女主角 露絲迪亞茲 共同演出\n     西班牙本土恐怖片票房冠軍\n     2023 西班牙哥雅獎 最佳特效 入圍\n\n\n在擅自和朋友舉行降神會後，少女蘿拉（瑪麗亞羅曼尼奧斯\
  \ 飾）開始出現各種反常的行\n為，蘿拉的家人們立刻聯絡梵諦岡，請他們派驅魔人來處理，然而，這只是一連串恐怖遭\n遇的開端...\n\n #車庫娛樂\n\n資料來源：車庫娛樂\n\
  \n--"
