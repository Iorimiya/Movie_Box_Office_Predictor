url: https://www.ptt.cc/bbs/movie/M.1693496717.A.257.html
title: '[好無雷] 贖命救援'
content: '8.3/10，沒有意料之外的劇情，但整體意料之外地好看。


  金成勳 X 河正宇 X 朱智勛，三強合體真的很猛。尤其河正宇在這部電影展現了很多眼神和表情變化的細節，非常迷人。

  如果最近想看刺激、豪華，同時又幽默的動作類型電影，推薦贖命救援！

  9/1 全台正式上映～


  --'
