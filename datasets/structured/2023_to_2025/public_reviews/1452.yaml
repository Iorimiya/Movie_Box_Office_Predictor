url: https://www.ptt.cc/bbs/movie/M.1693780474.A.C46.html
title: '[好雷] 無冷場《贖命救援》'
content: '衝著演員去看了這部

  意外的很好看

  幾乎沒有冷場


  劇情在講以前黎巴嫩

  一個外交官員被綁架後平安被救回來的事件


  一個外交官跟計程車司機

  為了拯救一兩年前(有點忘了是幾年)被綁架的外交官

  花錢請中介人幫忙

  雖被黎巴嫩腐敗軍人以及當地混混追殺

  但還是成功救回被綁架的外交官


  兩個主角是《與神同行》的兩個演員

  河正宇

  朱智勛


  演技就不用說了

  劇情安排真的還蠻棒的


  因為是國家機密

  整個事件真實人物只有那個外交官員以及中介人

  其他應該都是想像出來的或是中介人口述的


  就不雷了

  有興趣的可以去看看




  -----

  Sent from JPTT on my iPhone


  --'
