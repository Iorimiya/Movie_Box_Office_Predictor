title: '[好雷] 神偷奶爸4 格魯二世超萌'
content: '真的超喜歡這集新角色「迷你格魯」，也就是格魯跟露西的兒子

  小小一隻又一直和爸爸唱反調、想參與壞事卻又天真可愛的樣子，真的很療癒

  每次他出現我都不自覺讓我發出少女的聲音




  不過…講到劇情就真的有點偏可惜了

  主線其實蠻簡單，就是格魯一家遇到新反派麥星，被迫進入證人保護

  然後還有小小兵們的外傳支線

  但老實說節奏有點散，很多地方看起來像橋段拼貼

  感覺新角色跟老角色都沒發揮得很完整

  整體故事量偏少，讓人有種看得開心但沒吃飽的感覺


  --'
