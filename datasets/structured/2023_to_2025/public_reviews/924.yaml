url: https://www.ptt.cc/bbs/movie/M.1721875021.A.CB8.html
title: '[負雷] 神偷奶爸4：超級小小兵毀了小小兵'
content: '陪同小孩、女友的可以去看

  劇情有道德瑕疵

  中文配音和角色命名都有問題



  配音

  角色命名原則

  打鬥畫面

  超級小小兵

  道德瑕疵

  埋線







  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  【配音】

  本人是支持中配的，但是這部中配運用得沒有很好

  主打胡瓜、曾國城、王彩樺

  格魯（胡瓜）：連續4集御用，片中完全找不到胡瓜，輩分上只能給予尊重

  如果是Matzka配的會更適合（他配的海洋奇緣很好）

  露西（王彩樺）：有辨識度，但是選角把角色配老了，這個角色的聲音沒這麼老，找個賈

  靜雯鍾欣凌還差不多，這個角色也不是屬於老派幽默




  曾國城（反派麥斯）：找曾國城完全正確，但是配錯角色

  聽不出來是曾國城，而且沒保留曾國城的特色，

  ，

  反而符爽把紀畢谷配得很像曾國城？


  院內聽到的情境很像是：


  不過這也是最理想的搭配組合

  就當做歪打正著吧


  ，修到你聽不出來是胡瓜和曾國城的聲音

  如果是抱有期待的人可能會失望

  因為和花絮聽到的聲音大不同

  大概只剩百分之三十


  【角色命名原則】

  影片裡為了偽裝有把角色用假名替代

  這些假名其實可以幽默加分的

  或者要加入時事哏會心一笑也無所謂

  但中文版或中文字幕卻是以饒口的漢字直譯

  片中想強調布蘭琪難聽，其實可以換成其他幽默的字來詮釋

  山羊叫來福，看得出來想取得一些笑點，卻完全沒達到效果

  這些都是很容易加分的地方

  代理片商卻沒有好好把握

  用的反而是電影結束你也回想不起來的漢字


  【打鬥畫面】

  這本來就是一部闔家觀賞的影片

  所以打鬥畫面本來就不期待多

  也不用像哥吉拉那樣過癮（太多）

  但是也不能太少吧

  只是把反派簡單推下去就結束了（觀眾問號？）


  【超級小小兵】

  超級小小兵的變身是這部片的看頭

  也是很多人衝著預告片來的

  結果完全沒有派上用場

  該運用的地方沒用

  例如返回壞壞高中竊盜和反派決鬥都可以運用

  和反派決鬥也只是就結束了

  或許這就是小小兵系列的幽默吧


  【道德瑕疵】

  這片有一群受眾是小孩

  劇末卻讓人一頭霧水

  劇情的女俠盜偷了校長的蜜貛

  校長理所當然應該回去討


  女俠盜卻爽拿蜜貛

  要運用俠盜的劇情無所謂

  蜜貛不用還也無所謂

  但是不至於把校長惡人化吧

  這在教育上會讓孩子認為

  搶了東西可以不用負責

  物主合理自衛還有可能是錯的哦


  【埋線】

  這部埋了很多不必要的線和角色

  又或者說埋了卻沒有運用


  反派女友和狗：可以再多一點畫面，其實可以很有笑果

  超級小小兵：前面提到的，沒運用到變身後的功能在主線劇情

  鄰居一家人：除了女俠盜其他和主線劇情完全無關，角色和網球都是

  露西得罪沙龍客人：和主線無關，是多餘的線，不過有一個庫伊拉彩蛋

  山羊便便：以為會在後面埋哏，沒有就只是賣萌

  自助加油站快速插卡：，卻沒運用

  如果是要凸顯反派的昆蟲槍，店員示範完再把反派惹怒也不遲

  學校：學校是個很好發揮的素材


  總結來說：

  很多地方不提就沒事

  提了反而有事

  就像



  等於


  讓人不吐不快


  抱持爽片或是陪同去看的話是可以去看的

  如果心目中有更想看的片子的話

  這部可以等之後數位媒體就好


  不過還是有優點

  小小兵的笑點正常發揮

  但是超級小小兵毀了這部電影

  可以說是

  因為大部分的人都還是抱持超級小小兵會do something去看的

  結果卻沒有


  原聲帶和選曲都算不錯

  再次和菲瑞威廉斯(菲董)合作一首Double Life

  插曲也很新，例如

  艾爾頓強和Dua Lipa的Cold Heart

  不過音樂都大概幾秒而已


  --'
