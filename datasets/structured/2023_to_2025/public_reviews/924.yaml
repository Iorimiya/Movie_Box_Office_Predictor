url: https://www.ptt.cc/bbs/movie/M.1722156996.A.DDA.html
title: '[新聞] 《神偷奶爸4》全球票房達6億美元 8月線上'
content: '《神偷奶爸4》全球票房達6億美元 8月線上發行




  （大紀元記者葉子杰編譯報導）截至27日，《神偷奶爸4》（Despicable Me 4）上映

  25天全球票房獲得超過6億美元的收入，2024年上映的電影中排名第三，該片將於8月

  在數位平台上發行。


  環球影業與照明娛樂推出的《神偷奶爸》與外傳《小小兵》（Minions，又譯：小黃人

  大眼萌）系列前幾部作品包括：《神偷奶爸3》（2017）、《神偷奶爸2》（2013）、

  《神偷奶爸》（2010）、《小小兵2：格魯的崛起》（2022）和《小小兵》（2015）全

  球票房收入分別為10.34億美元、9.7億美元、5.43億美元、9.4億美元和11.59億美元。


  據《Collider》報導，《神偷奶爸4》全球票房收入達6億美元，已超越該系列的第一部

  電影的全球票房，但仍遠遠落後於《小小兵2：格魯的崛起》。《神偷奶爸4》在2024年

  上映的電影中排名第三，不計算印刷品和廣告費，製作預算約為1億美元，已是部成功

  獲利的電影。


  可惜的是，評價方面截至28日，《神偷奶爸4》在影評網「爛番茄」僅獲得影評員55%的

  支持度，是該系列中最低，而觀眾給予88%的新鮮度評價，比起首映評價有略微下降2%，

  目前在該系列中的評價排名第二高。


  另據《WhenToStream》《富比士》報導，將於8月6日起可以在「優質／高端隨選視訊」

  PVOD（Premium Video on Demand）、亞馬遜Prime影音、AppleTV+和VUDU等串流平台上

  購買或租賃。


  據報導，《小小兵3》電影已確定於2027年 6月30日上映，第五部《神偷奶爸》電影也

  在製作中。


  --'
