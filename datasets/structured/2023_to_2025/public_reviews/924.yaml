url: https://www.ptt.cc/bbs/movie/M.1645352692.A.ECA.html
title: '[新聞] 小小兵2尚未問世 "神偷奶爸4"上映檔期公開'
content: '新聞網址：


  原標題：


  2022-02-19 17:57:40




  （圖片來源：環球影業）



  環球影業今宣佈了兩部「照明娛樂」動畫的檔期，一部是原創作品《Migration》，

  ；前者排定 2023 年 06 月 30 日上映，與同

  期登場的 《印第安納瓊斯 5》打對台；



  《Migration》由《熊熊遇見小小鼠》（Ernest et Célestine）導演班傑明雷納（

  Benjamin Renner）執導、《搖滾教室》（School of Rock）編劇麥克懷特（Mike White

  ）執筆劇本 ，本片以一群鴨子家族為主角，描述子女們想要說服他們保護慾過強的父親

  踏上一趟畢生難得的遷徙旅行，而這趟旅行的路線將一路從新英格蘭穿越紐約、並最終抵

  達至巴哈馬群島。




  在





  《小小兵 2：格魯的崛起》由《神偷奶爸 3》（Despicable Me 3）、《小小兵》（

  Minions）導演之一的凱爾巴爾達（Kyle Balda）、《寵物當家 2》（The Secret Life

  of Pets 2）導演之一的強納森德瓦爾（Jonathan del Val）、以及新加入的布萊德艾伯

  森（Brad Ableson）共同執導，史提夫卡爾（Steve Carell）、茱麗安德魯絲（Julie

  Andrews）、羅素布蘭德（Russell Brand）回歸配音，泰拉姬漢森（Taraji P. Henson）

  、楊紫瓊、RZA、尚克勞德范達美（Jean-Claude Van Damme）、杜夫朗格（Dolph

  Lundgren）、丹尼崔吼（Danny Trejo）、亞倫阿金（Alan Arkin）等眾星加盟獻聲。



  --



  神偷奶爸      2010.07.23    6900萬     5.43億

  神偷奶爸2     2013.07.03    7600萬     9.70億

  小小兵        2015.07.09    7400萬    11.59億

  神偷奶爸3     2017.06.29    8000萬    10.34億



  單位：美元  (以台灣上映時間為準)



  意外發現這系列票房這麼好!!??


  --'
