  但是最後也沒了 想說會跟她偷偷出任務


  當反派 結果去監獄大合唱？


  前幾集反派也一起出來唱



  小小兵部分惡搞 驚奇四超人


  蜘蛛人和其他電影


  但是最後boss戰也沒發揮....


  格魯也沒拿什麼新道具 冷凍槍也沒拿一下


  我看這系列收在這裡會大爆死


  --

  大雜燴 最後大團圓

  你沒說還沒想到'
