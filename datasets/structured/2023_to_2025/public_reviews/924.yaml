url: https://www.ptt.cc/bbs/movie/M.1720414867.A.306.html
title: '[負雷] 神偷奶爸4  一度差點睡著'
content: "防雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n本次神偷奶爸是系列作最差的一部\
  \  (包含小小兵系列)\n\n\n看的時間是昨天在林口威秀下午場次\n\n幾乎坐滿\n\n\n大家都是來看小小兵鬼吼鬼叫跟搞笑的\n\n無奈真的沒有看到，無聊到不行\n\
  \n這集非常誇張的是全線崩壞失敗\n\n\n主線劇情走的是格魯改邪歸正跟反派是蝗蟲人的高中同學進行對抗的戲碼\n\n\n然後帶有溫情跟新手爸爸的支線、陪伴鄰居小孩偷竊的支線\n\
  \n\n這三個點是我覺得爛到不行的理由\n\n1.魔王非常路人，所有系列裡面最失敗的反派\n\n前期營造出的大魔王，最後關頭不到一兩分鐘就草草結束\n\n我真的不知道編劇在幹嘛\n\
  \n蝗蟲人有一堆昆蟲軍團，可以跟小小兵進行兩邊的大戰\n\n有改造槍，可以改造一堆平民為他作戰\n\n然後讓小小兵、格魯一家來救援平民\n\n還有他的女友，本來也很期望他最後可能也會變身可能是蝴蝶或是螳螂人\n\
  \n結果啥都沒有，從頭到尾就只是抱著狗\n\n然後也沒有善用昆蟲人的設定\n\n他除了外觀是昆蟲外，根本沒說明為啥他喜歡昆蟲或是挑蝗蟲的原因\n\n以往的反派都有很強的目標\n\
  \n這個反派只想報復他高中的小仇.....\n\n\n\n2.一堆毫無意義的串場跟追逐戰\n\n小小兵好看的追逐戰是有意義的\n\n搶皇冠、偷寶物這些要素都是之前建立的成功例子\n\
  \n這一集的追逐戰在幹嘛\n\n偷母校校長的寵物，好....還說得過去\n\n理髮廳客人的超市追逐????\n\n然後最爛的追逐是反派毫無意義的在天上一直開著巨大飛船\n\
  \n正義聯盟找不到他????\n\nWTF 這麼大台在天上都上新聞的吧\n\n就算有黑科技追蹤不到，他下來襲擊加油站也會報導吧\n\n更爛的是他居然要等校長告訴他才知道格魯住哪\n\
  \n那你在天上飛來飛去逛街?\n\n你躲地下等到有知道位置再起飛不就好了，還飛到沒油\n\n三小啦\n\n\n\n3.超級小小兵超級無趣\n\n超級英雄的設定不是不行\n\
  \n只是這種設定在之前已經用過類似的手段，只是那時候是用動物，12生肖\n\n而且大力士跟石頭人這麼無聊超能力你還要硬出兩個\n\n或許怕吃版權炮\n\n但如果你弄一個小小兵復仇聯盟\n\
  \n我想都比人氣本來就低落的驚奇四超人好得多\n\n鋼鐵小小兵、美國隊長小小兵\n\n還可以英雄內戰，反正本來他們就愛互打互罵，觀眾也是來看這些的\n\n重點是這個設定還中場就草草收掉\n\
  \n片尾也是隨隨便便登場就收掉\n\n只是為了想讓它們出現而出現\n\n反派被打倒的速度比日本的戰隊特攝片還快\n\n毫無掙扎毫無反轉\n\n就 阿~~~~~~我輸了的結束\n\
  \n\n\n以上就是我覺得這次非常爛的三個大點\n\n我第一次看系列作看到快要在電影院睡著\n\n而且很可怕的是，全場沒啥笑聲\n\n接近滿場的電影院大家卻沒啥笑\n\
  \n不看票根我會以為這場是噤界\n\n\n\n編劇真的非常的混，就是仗著這個IP非常無敵\n\n可愛就是無敵，小小兵加嬰兒加可愛動物根本無敵\n\n放任劇情毫無邏輯超級鬆散\n\
  \n硬是把一個蛋糕造型的大便塞到觀眾的眼裡\n\n這部片就是系列最爛沒有之一\n\n片尾大合唱也讓人看了一頭霧水\n\n我到底看了三小\n\n我要看的是小小兵唱歌\n\
  \n你給我看一堆罪犯唱歌\n\n然後鄰居的設定也是一個大便\n\n\n--\n\n◣    \n\n◤   ◤     \n◤     \n◤        \n\
  \n--\n我偏要都看\n還好還沒睡著\n那你那場大概笑點都在腳底板\n                                           \
  \  *低  給過\n偷皇冠偷月亮都劇情很棒耶\n指數是54%的腐爛番茄耶 更何況 「爆米花指數」早就不值得參考\n\n數字會說話，最終爛番茄指數拿去比對系列作幾部就知道了\n\
  \n補數據給你 第一集 爛番茄 80   第二集 75  第三集 58  現在第四集掉到53\n\n小小兵 則是 56 小小兵2 70\n\n這才是大多數觀影人的真實感受\n\
  \n而且還在持續掉，估計會是系列作最差的一片沒問題喔!\n\n照你這邏輯可能沒人可以進電影院了wwwww\n並非全部是實際花錢喔，爆米花指數可以透過試映或是行銷手法來拉抬分數喔\n\
  \n具體來說爛番茄只是\"參考\"，不是你抓著這個浮木就可以說因為爛番茄好評價=好片喔\n\n但如果連爆米花跟爛番茄指數都雙爆，可以肯定就是這片應該就爆了\n\n\
  這系列最爛是這一集我想大多數粉絲都不會有異議\n\n你也是蠻熱心的 每一篇負雷神偷4的都會去噓\n\n每一篇說好話的都會去讚讚XD"
