  2024年7月17日 週三 下午11:56




  《神偷奶爸4》劇照


  1.《神偷奶爸4》上映票房紅盤，目前全球票房已累積4.4億美元。


  2.《神偷奶爸4》票房大賣，助照明娛樂全球累計票房突破100億美元。


  3.照明娛樂發行電影的平均票房，比皮克斯和夢工廠還高。


  【文／克里斯蒂】


  動畫電影《神偷奶爸》系列全新續集《神偷奶爸4》月初在全球上映，電影上映後開出票

  房紅盤，目前全球票房已累積4.4億美元（約143億台幣），連續兩週位居北美票房冠軍。


  隨著《神偷奶爸4》的票房大賣，發行工作室照明娛樂（Illumination）再次確立了其動

  畫長片龍頭的地位。


  照明娛樂於2010年推出首部電影後，至今已發行了15部動畫長片，雖與另外兩大動畫長片

  工作室皮克斯和夢工廠的歷史年資相比，實屬後輩，但以發行電影的平均票房而言，帳面

  上是遙遙領先的！




  《神偷奶爸4》劇照


  照明娛樂於2010年推出首部《神偷奶爸》電影，全球票房大賣5.4億美元（約175億台幣）

  ，並接續推出了系列作品。


  此後的幾年裡，照明娛樂主要專注於創造和發展新的IP，光是《神偷奶爸》就催生了三部

  續集和兩部衍生作品，同時也發行了兩部《歡樂好聲音》系列電影和兩部《寵物當家》系

  列電影。


  令人驚訝的是，照明娛樂在其發行過的15部電影中，沒有任何一部電影的製作成本超過1

  億美元（約32億台幣）。




  《神偷奶爸4》劇照


  觀察另外兩大動畫長片工作室，夢工廠發行電影的全球平均票房約3.7億美元（約120億台

  幣），其中零部影片在全球突破10億美元的里程碑。


  皮克斯發行電影的全球平均票房超過5.7億美元（約185億台幣），其中五部作品的全球票

  房超過10億美元。


  照明娛樂則以超過6.6億美元（約214億台幣）的全球平均票房遙遙領先，《神偷奶爸》的

  六部電影就貢獻了總收入的近一半，考慮到《神偷奶爸 4》才剛剛上映，這一數字在未來

  幾週內還將會大幅增加。




  《神偷奶爸4》劇照


  《神偷奶爸4》的全球票房佳績，使照明娛樂的全球累計票房突破了100億美元大關，工作

  室最賣座的電影仍然是《》，它以13.6億美元（約442億台幣）的

  全球票房，榮登有史以來票房第二高的動畫電影。


  《神偷奶爸4》的最終票房是否有機會再創工作室新高，票房後續走勢值得觀察。



  新聞網址：






