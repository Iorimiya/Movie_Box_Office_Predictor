title: 'Re: [負無雷] 天龍八部之喬峰傳 緯來電影台既視感？'
content: '這部只有打戲跟部分音效還行


  其他慘不忍睹


  1.選角失敗 甄子丹太老了 身形也太單薄 怎麼演出超級契丹人 還他媽使用蒲島太郎造型


  而且文戲的嚴重不足 完全沒有喬峰大仁大義的FU 慕容復XDDDDDD


  你找一個46歲的老頭來演風度翩翩瀟灑倜儻的慕容公子 就長這幅德姓 連阿碧都不要


  更何況神仙姊姊 慕容博找呂良偉也是XDDD 呂良偉適合飾演霸道總裁 跛豪 丁力


  販毒賣報紙的馬二爺 慕容世家是皇族後代 怎麼樣也要一個風度儒雅的貴氣中年人


  選角失敗到極點


  2.故事來龍去脈都沒有交代清楚 整部戲只有聚賢莊那段還行




  但是看TVB是怎麼處理這一段的 喬峰在狂性大發下失手重傷奚長老 心中後悔下把兵器


  丟棄 才被趁機偷襲 最後還饒了老和尚一命 處處不在暗示他的仁義為人 然後看著喬峰


  全力保護阿珠的那一段 康敏嫉妒的表情之經典 這都是重要的細節 都沒有好好處理



  再來燕子林那一段 喬峰替四大長老挨刀 是因為身為幫主要赦免四大長老 要自身挨刀刑


  每挨一刀喬峰就講出那一個長老的豐功偉業和對丐幫的貢獻 那個才是喬峰的大仁大義


  也是在旁邊偷看的阿朱 眼睛冒小星星的開始 這麼重要的橋段和人設都沒處理好


  只他媽顧著打 對比葉問系列真他媽大爛戲


  阿朱接口道：「有一個人敬重你、欽佩你、感激你、願意永永遠遠、生生世世、陪在你身

  邊，和你一同抵受患難屈辱、艱險困苦。」


  後來喬峯在雁門關外以掌擊石，傳來一位少女的聲音「喬大爺，你再打下去，這座山也要

  給你擊倒了。」阿朱在山上等喬峯五天五夜，後與喬峯朝夕相處互生愛意。

  24.52開始


  PLUxlohmoXranLxaU6cseCnEg2oU6g6Iqj&index=15


  再來打死阿朱那段 喬峰也說五條命 還五掌 五掌之後恩怨勾銷 不斷的在重複喬峰仁義

  的人設 電影 你媽的立刻就打過來 恨不得馬上就殺阿朱


  原著交代得很清楚 阿朱替段正淳死 不只是要還段正淳阮星竹的生孕之恩 更重要的是為

  了喬峰 他不要殺了段正淳之後喬峰跟整個大理為敵 他的代死 更多是為了喬峰

  這才是喬峰為什麼一生只愛阿朱一人 阿朱死後他就已經心死的原因 也是為何阿朱

  的美貌排不盡天龍前五 但前半段他是第一女主角的原因 後面喬峰帶著阿珠去見他爹娘

  那種生無可戀的樣子 才是見證阿珠跟喬峰的愛情 電影甄子丹氣沖沖的就去找白試鏡

  跟康敏報仇 完全沒法讓人有情緒起伏

  16.31開始


  CnEg2oU6g6Iqj&index=19


  整部片多拍個8.9分鐘文戲就能非常完整 結果弄得不倫不類


  另外段譽輕易被點穴太扯 小鏡湖時他內力已經相當高

  不可能喬峰隨便點就當機


  最後放上萬水千山縱橫

  也知道想要蹭當年82 97經典

  的fu 當真的差太多


  --

  好好拍完文戲 豆瓣拿個6分不難 亂搞就是4.9分 97天龍9.3分

  沒錯

  就可惜了 不過選兩個老人演北喬峰南慕容超大敗筆'
