url: https://www.ptt.cc/bbs/movie/M.1674834563.A.22D.html
title: '[負無雷] 天龍八部之喬峰傳 緯來電影台既視感？'
content: '《#天龍八部之喬峰傳》5/10分


  -


  是我期待太高…


  簡單條列缺點：

  ·甄子丹的眼線我很出戲

  ·感覺甄子丹的臉有後製美顏，覺得不太自然…

  ·聚賢莊的燈光好怪，是不是沒調色啊，超死白的

  ·場景道具都有一種塑料感，Like 石碑、岩石 ,etc.

  ·好幾幕都能看出後製去背的痕跡，這團隊不行啊

  ·有些橋段明顯在水時間，根本不重要

  ·動作戲不難看，但橋段太少，也沒有太多印象深刻的運鏡，網路上有影評說什麼打好打

  滿，真的是在瞎說欸

  ·劇情太多吐槽點，真的就是快變搞笑片，各種硬到不行的轉折，但不帶腦子笑笑是還行

  啦


  -


  反正整部片就很王晶感（導演陣容確實也有王晶），很像會在緯來電影台看到的那種片

  然後武功招式的部分，有些超唬爛誇張，我是覺得也是看得蠻爽的啦，但應該會有觀眾覺

  得這是三小？


  只能說好在它是建立在天龍八部之上，觀眾不用從頭理解角色劇情，不然這劇本也是一個

  差勁


  -


  再不然當《大尾鱸鰻》笑笑也是可以啦



  --


  無雷 電影/影集短評IG：




  --'
