title: '[好雷] 天龍八部喬峰'
content: '我沒看過天龍八部

  對金庸很不熟，對喬峰更不熟

  但因為周星馳還知道降龍十八掌

  也知道洪七公的打狗棒，棒棒都打狗


  看到周星馳蘇乞兒裡面教睡夢羅漢拳的乞丐

  袁家班的袁祥仁又出現在喬峰裡面演個老神醫

  他好像一天到晚在演乞丐，像功夫裡面也在演乞丐

  跟小周星馳推銷降龍十八掌跟各式金庸武林秘笈騙小孩錢

  以前奇門遁甲也常常反串演老太婆，常跟周星馳合作

  也看過他來台灣拍過馬路小英雄裡面的專業武行

  手沾了汽油點火都不怕燙，證明特技演員的實力

  這回終於看到他演到醫生不用再演乞丐了

  但可惜也是演個沒醫德的壞醫生反派


  因為天下第一武指袁和平不太會演戲

  所以他是袁和平的弟弟，又很愛演所以常露臉

  沒想到到今天還能看到他在港片影壇屹立不搖

  隨著港片殞落，不少人都隨著港片一起消失

  但他總是能成為袁家班的演員代表常常露臉

  其他袁家班的演員也都已經很少出現在幕前

  也漸漸被大家遺忘，但今年還能看到他就很開心

  因為對於德高望重的老生來說就看到一次少一次

  這些武行前輩都是我們偉大國術哲學的傳承人


  喬峰這片打得不錯，硬橋硬馬

  感覺跟超英片差不多，一樣有甄子丹的水準

  一樣以寡擊眾，降龍十八掌像超能力一樣

  隔空就能用氣功掌風震飛一大票人，還能用來生火

  當然這些特效不流行了，輕功調鋼絲的特效也很假

  要是請專業的跑酷選手來表演輕功應該會增色不少

  真正好看的還是看他一個打一百個，個個一招斃命

  但還是不敵演神醫的袁祥仁背後一刀要害暗劍傷人


  裡面的阿紫也真夠毒辣

  比玉嬌龍還任性潑辣可怕

  對自己爸爸段正淳放毒針

  對比自己美的大反派壞女人潑硫酸

  不知道以現在當代先進的醫美技術

  被潑硫酸毀容的臉能不能救的回來？

  而且她攻擊人的絕招就是用毒粉讓人毀容

  好可怕的招數，就像辣椒水一樣防不慎防

  完全被大理國王段正淳寵壞的官二代公主


  看到喬峰被天下人誤會跟追殺

  連少林寺的和尚慈悲為懷都要殺他降魔

  把他從丐幫幫主變成殺爸媽跟師父的大魔頭

  這種人在社會上跟監獄裡應該大有人在

  被奸人所害或是自己倒霉，反正樹大招風

  真的是蠻慘的，連和尚都笨到說

  天下人說你說是，你就是

  那真是跳到黃河都洗不清了


  宋朝人討厭契丹人

  大概就像中國人韓國人討厭日本人

  台灣人討厭中國人這種戰爭敵對的氛圍

  契丹查了維基後是在中國東北的蒙古人

  所以宋朝漢人討厭蒙古人也理所當然


  以前看王家衛的東邪西毒東成西就

  只知道北丐是洪七公，然後到蘇乞兒

  丐幫打狗棒傳到了清朝第17代掌門人蘇查哈爾燦

  漢人也能讓滿清貴族當丐幫幫主也算民族融合

  就像台灣人不可能選大陸新住民當總統一樣

  中國人北韓人也不可能選美國人日本人當主席


  總之這片留下很多伏筆好像想拍續集

  片尾弄得跟漫威宇宙一樣，金庸宇宙超英武俠動作片

  但這大概只有熟讀金庸天龍八部的書迷才知道劇情

  像我看漫威也是不知道來龍去脈所以只看熱鬧

  真正熟讀小說漫畫的人才能看門道知道因果關係


  之前王晶找古天樂拍了李連杰倚天屠龍記的續集

  讓大家能重溫以前李連杰的賀歲片

  記得當年我看完真的覺得浪費錢

  賀歲片都亂拍一通超難看

  但沒想到多年後竟然成為惡搞經典

  大家竟然還想看續集，可能因為書迷多吧


  港片沒落之後就很少看到古裝武俠片跟金庸電影

  連金庸都升天了，我想金庸大概過氣沒人看了

  沒想到還是很多人知道金庸的故事來龍去脈

  所以把這片喬峰的形象從頭罵到尾

  認為北方蒙古人應該人高馬大

  但甄子丹南方人身材矮小形象不合

  覺得片尾的呂良偉還比較像蒙古人喬峰

  但我沒看過金庸所以就不會先入為主設限


  裡面的特效還是很無聊，掌風跟鋼絲

  一看就知道是王晶無聊的的花招

  很像印度片裡面惡搞動作特效

  現在長大後就沒那麼笨了

  不過帶小孩去看應該會有個不錯的童年

  因為漫威迷也都是從小看到大才能接受劇情

  這種武俠片但願未來能有點長進，別再用特效了

  拜託找真正全世界最好的跑酷選手來當輕功替身

  降龍十八掌周星馳的蘇燦都打得比甄子丹好看

  想到以前李連杰倚天屠龍記的寒冰神掌用噴霧就

  一整個囧rz .......



  -----

  Sent from JPTT on my iPad


  --'
