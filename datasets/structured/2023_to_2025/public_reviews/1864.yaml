title: 'Re: [討論] 甄子丹自導自演《天龍八部之喬峰傳》'
content: "《天龍八部之喬峰傳》香港預告 1月19日 義薄雲天\n\n…這預告太好笑了，\n\n這個台詞，不曉得是誰寫的？\n\n人不犯我，我不犯人，\n\n\
  人若犯我，我就要跟他打，\n\n他要打多久，我就打多久，\n\n一直打下去。\n\n超級直白中二的台詞，\n\n配上甄子丹那毫無情緒起伏的讀稿棒讀，\n\n絕、絕、絕，連三絕。\n\
  \n笑到噴淚XDDDDDDD\n\n早年看港劇廣東話梁家仁版是豪氣干雲，\n\n黃日華版則是風霜豪俠。\n\n怎麼甄子丹念得好像『給開司來罐啤酒』\n\n\n\
  幹XDDD\n\n\n還有，這一版的演員年紀怎麼都這麼老？\n\n沒一個三十歲以下的？\n\n人家都是演新天龍，\n\n他們另僻新徑，演老天龍八部嗎？\n\n\n\
  \n\n\n\n\n\n--\n                                    華\n甄哥是不是很缺錢？"
