title: '[微雷] 天龍八部之喬峰傳'
content: '——————————以上防雷——————————



  主要看點是甄子丹的武打，然後沒演到天龍的結局，

  所以應該會有續集。

  畢竟看過評論，

  所以進場前就直接把這部當爽片來看。

  因為甄子丹59歲了，

  他的武打片真的是且看且珍惜……



  總之，真的是一直打下去。

  打戲塞好塞滿，一直打，一直打，一直打，


  丐幫大會，打。

  少林寺菩提院大戰，掌氣對轟，近身短打。

  聚賢莊大戰，甄子丹一挑多，一次打30個以上。




  差點以為是致敬葉問系列。


  對上慕容復的那場

  有拿著水車當盾牌扛箭雨，硬生生衝破慕容復私兵，這段很猛。

  吐槽一下，慕容復的部份實力被調高不少。

  這是我第一次看到慕容復在首戰可以和喬峰打的有來有回，

  甚至打到五五開的畫面。

  不然一般來說都是南慕容被北喬峰屌虐。


  因為對上慕容復的戰鬥被提前。

  喬峰還沒改名叫蕭峰。

  所以也還沒有後面少室山大戰時那句：


  「蕭某大好男兒，竟和你這種人齊名！」


  還是滿想看到喬峰嗆下去，

  但是慕容復大概是裡頭武力排行第二的，而且這一次慕容復不只有家臣，還有私兵。


  至於文戲的部份不多，大多數集中在和阿朱的互動上。


  陳鈺棋很正，但大多時候扮相比較憔悴，大概像這樣


  片尾有和蕭峰一起牧羊的假想橋段。

  這個直接讓我想到倚天屠龍記她演趙敏時，

  和張無忌一起牧羊的經典戲份。


  康敏(馬夫人)很騷，

  就是色氣擔當

  只是可以再多露一點。




  遺憾的是白長老都撲上去了，結果被打斷了

  套句老話，可惡，我褲子都要脫了



  至於阿紫的部份改很多，沒有原著那種狠辣感

  反而強化了打戲用毒的部份，

  我印象中阿紫沒有這麼強啊？


  虛竹、段譽沒啥戲份，畢竟重點是喬峰打架。


  整部電影武打最精彩的是喬峰一路打到底，

  其次就是阿紫打的滿華麗的，


  總之呢，畢竟是甄子丹嘛

  所以甄子丹各種拳腳和兵器戲是這部的重點

  打得是真的漂亮，

  裡頭有塞一個彩蛋是最後面有

  萬水千山縱橫這首BGM變奏版



  總之就是看甄子丹一路打到底，打好打滿，殺進殺出。

  打戲很有水平，其他的要深究就講不完了

  畢竟要把主軸是段譽的天龍八部改到喬峰為主

  確實不是一件很簡單的事情，這部分我個人是不太苛刻就是了



  ——————————以下防雷——————————



















  --'
