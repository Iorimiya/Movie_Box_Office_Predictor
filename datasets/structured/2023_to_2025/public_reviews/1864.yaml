title: '[好雷] 過年適合長輩看的《天龍八部之喬峰傳》'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  1.影片名稱 : 天龍八部之喬峰傳

  2.觀影時間 : 1/23

  3.觀影地點 : 永和喜樂時代

  4.觀影方式 : 自行購票


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  此區為發文防雷頁 可選擇性提供上列 1~4 資訊 或不提供亦可 觀影心得於分隔線下方發

  布即可



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  最近正好是過年期間，趁著年假空檔帶媽媽去電影院看她很喜歡的甄子丹新電影，


  只不過這次的甄子丹不是那個挽起袖子說要＂打十個＂的葉問師父，


  而是在江湖上行俠仗義、能使出降龍十八掌的喬峰大俠。






  由於我媽本身對於金庸小說的劇情其實並不是那麼的熟悉，也並沒有讀過原著小說，


  唯一對天龍八部有的印象，可能是在我出生以前，


  她每天晚上都會邊做家事、邊看梁家仁主演的《天龍八部系列》，


  對於劇情內容以及人物關係她也都忘的差不多了，


  所以這次進電影院看的這個天龍八部版本，對她來說也像是全新的故事～



  相較於我媽對這部電影是純粹的接觸一個全新的劇情架構，


  我自己本身則是有看過原作的，所以可以明確知道劇情與人物關係是有做了不少改編，


  不過這倒也是挺常見的～


  除了這種武俠小說題材外，神怪類的孫悟空、哪吒、白蛇傳…之類的，


  也是大約每2.3年就會出一部新電影版本，


  然後為了吸引觀眾、內容上都會與原著或其他同題材作品有所不同，


  對此我個人是抱持著比較開放的心態，畢竟讀過歷史的人都能理解，


  傳統著作與舊有的文化這一類思想上的產物，除了原作的傳承外，


  挑戰創新的也是一種可以讓原作更加廣為流傳、引發注意與討論的方式，


  至於改編的好不好、大家喜不喜歡……就交給時間長河去篩選流載。




  由於劇情的喜好我覺得比較偏向個人的觀感與想法，這部份很多人在討論了我就不深究，


  但除了劇情上的創新外，我有注意到幾個比較特別的地方！


  像是電影中採用了很多比較像是電視廣告拍攝的一些運鏡，


  白話一點就是會有一些像是畫面範圍極快速伸縮、特殊主體的局部放大、鏡頭晃動……之

  類的分鏡，


  這種一般比較會在電視廣告、電視劇或是日系動畫電影中才會出現，


  因為是專門用來營造一種情感或環境氛圍的，


  但這樣的拍攝方式，除了運用在武打場面的時候會讓人感覺更加暢快外，


  在一些比較需要劇情張力的時刻、也能將氛圍拉滿，


  所以我覺得這樣的手法嘗試是相當不錯的！




  而在特效的部份，雖然整體上很逼真華麗，但反而因為太過好、所以我個人比較不習慣，


  如果是放在神怪類的電影當中，這樣程度的特效我就會覺得很棒！


  但可能因為我以往看傳統武俠的打鬥特效，


  還是比較習慣那種＂肉眼不可見＂的內力，感覺這樣比較真實，


  所以特效做好做滿，我自己反倒是挺不習慣的！XDD


  不過也不得不說，確實有甄子丹的電影，在武打動作的部分都不會讓人失望！




  另外透過今年過年的電影檔期進行觀察，


  不難發現今年的賀歲片類型電影，不管是國片還是港片真的沒幾部欸！


  如果過年期間想要帶家中長輩去看電影的話，感覺可選擇性真的不多……


  今年就只有這部《天龍八部之喬峰傳》與國片《我的婆婆怎麼把OO搞丟了》可參考，


  其他則都是外語片居多……


  雖然知道是受疫情影響，但還是蠻希望華人的電影產業能夠突破這樣的困境，衷心祈願！


  也推薦這部新編的《天龍八部之喬峰傳》，給過年期間會帶長輩去看電影的人，


  武打精彩、動作暢快外，劇情跟題材上也相當適合闔家觀賞！




  --'
