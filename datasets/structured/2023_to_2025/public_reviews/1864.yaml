url: https://www.ptt.cc/bbs/movie/M.1674469518.A.B51.html
title: '[好雷] 《天龍八部之喬峰傳》期待有續集'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  圖文重點標示好讀版↓




  前幾天去看了《天龍八部之喬峰傳》，在看的過程就產生蠻多心得，因此撰寫本文來分享

  ，另外，本片名為《天龍八部之喬峰傳》，片中的人名字幕顯示也是喬峰，雖然用字不同

  於小說的喬峯，不過喬峰及喬峯在意義上並沒有什麼區別，而且喬峰也已被廣泛使用了，

  所以尚可接受，但慕容復卻顯示成慕容複，有看過《天龍八部》小說的人應該都知道慕容

  復之所以名為「復」，是因為有想要復國的含義，因此我覺得字幕顯示成「慕容複」實在

  不妥，故以下提到「慕容複」皆以「慕容復」來呈現。


  一、觀影動機

  首先，喬峰是金庸筆下我最喜歡的角色，原因不外乎為人豪爽、俠義人心、武功絕頂，還

  記得當年就讀高中一年級時，有次與朋友討論金庸小說裡的角色武功高低排行，當時我雖

  然還沒看《天龍八部》小說，不過也知道喬峰的武功很高，但對於朋友給喬峰的武功評價

  出奇的高，著實令我蠻驚訝的，而在看過《天龍八部》小說後，我覺得朋友給喬峰的武功

  評價的確是合理，因為在小說劇情裡，喬峰的綜合表現就是這麼的強！

  其次，在觀影之前我就先查了一下《天龍八部之喬峰傳》的演員陣容，有我很喜歡的甄子

  丹、陳鈺琪、呂良偉，尤其是陳鈺琪，在看了她飾演電視劇《倚天屠龍記》（2019年版）

  的趙敏一角，更是被她在劇中的聰明伶俐、姣好外貌深深吸引，因此更覺得非看不可！


  二、劇情介紹

  本片一開始就簡略帶過喬峰從嬰兒成長為少年，直到當上丐幫幫主的歷程。

  之後從鳩摩智手中救下段譽，隨後馬上就進入其契丹身世被揭露、遭陷為殺害馬副幫主的

  凶手，並失去幫主之位的橋段。

  為了查明真相，前去養父母所住之處，卻發現兩老已遭人殺害，接著趕往少林寺想透過其

  師父玄苦得知自己是否真為契丹人，卻又發現其師也已遭人殺害，而後救走被大力金剛掌

  所傷的阿朱。

  為了治療阿朱身上的傷，帶著阿朱前往聚賢莊求助薛神醫，接著在聚賢莊與眾人大戰時，

  氣會穴遭薛神醫用刀從背後刺傷，因此無法運功、寡不敵眾，之後被蒙面黑衣人救走。

  傷癒後與阿朱重逢，卻因為馬夫人康敏的設計，而誤殺阿朱，之後得知這一連串的事件都

  是慕容復在幕後策劃所導致，因此與慕容復決一死戰，在經過激戰後終於取勝，並到塞外

  生活，本片也告一段落，最後在片尾彩蛋，慕容復之父慕容博、喬峰之親生父親蕭遠山終

  於彼此現身在雁門關對峙，為續集埋下伏筆。


  三、本片及小說的差異

  本片及小說之間存在不少差異，以下僅就我有印象的部分作列舉：

  （一）在前者，喬峰從鳩摩智手中救下段譽，但後者並沒有這一段劇情，而且在段譽逃離

  鳩摩智之前，喬峰及段譽是素未謀面的。

  （二）在前者，阿朱並不是直接被大力金剛掌所傷，而是在喬峰接下大力金剛掌時，從旁

  被大力金剛掌的餘力所震傷，但在後者，阿朱是直接被大力金剛掌所傷。

  （三）在前者，喬峰在少林寺就將阿朱所偷的《易筋經》物歸原主，但在後者，是喬峰將

  阿朱救走後，阿朱才將《易筋經》交給喬峰，而後輾轉落入游坦之、鳩摩智手中。

  （四）在前者，喬峰在聚賢莊一戰時遭薛神醫用刀從背後偷襲，但在後者，薛神醫並沒有

  （也不太可能）作出此等小人之舉。

  （五）在前者，虛竹只是一個客串的小和尚，戲份極少，而且與喬峰素不相識，但在後者

  ，虛竹、段譽及喬峰是結拜兄弟。

  （六）在前者，白世鏡是被慕容復賄賂而與馬夫人康敏聯手揭露喬峰的身世，但在後者，

  是全冠清因為貪圖馬夫人康敏的美色，而與其聯手揭露喬峰的身世。

  （七）在前者，慕容復的戰力爆表，甚至一度將喬峰打倒在地並吐血，但在後者，慕容復

  及喬峰兩人實力相差懸殊，慕容復三兩下就被喬峰打敗了。

  （八）在前者，三十年前雁門關一役，帶頭大哥是慕容博，但在後者，帶頭大哥是少林寺

  方丈玄慈。


  四、角色分析

  （一）由甄子丹所飾演的喬峰

  在我心中一直覺得將喬峰這個角色飾演得最好的是在電視劇《天龍八部》（2003年版）的

  胡軍，他把喬峰所應有的氣勢呈現得淋漓盡致，也因此在看《天龍八部之喬峰傳》前，多

  多少少擔心甄子丹所飾演的喬峰會被前者徹底比下去，但實際觀影後，我覺得這個擔心是

  多餘的，甄子丹也將喬峰這個角色詮釋得非常好，除了氣勢有呈現出來，更展現了小說裡

  喬峰幾乎沒使用的劍術，讓我覺得耳目一新！

  （二）由陳鈺琪所飾演的阿朱

  我會去看《天龍八部之喬峰傳》的其中一個原因是想看陳鈺琪重現在電視劇《倚天屠龍記

  》（2019年版）裡的風采，但我卻忽略《天龍八部》的阿朱及《倚天屠龍記》的趙敏畢竟

  是兩個不同風格的角色，阿朱大多數時候都是因傷氣虛的模樣，也因此陳鈺琪在本片中，

  讓我看上去覺得不像是演出電視劇《倚天屠龍記》（2019年版）的陳鈺琪，反而像是演出

  電視劇《龍門飛甲》、電影《無雙》的馮文娟，但儘管如此，陳鈺琪還是有將阿朱聰明機

  智的特色表現出來，讓我覺得相當不錯！


  五、總結

  本片在劇情上雖然有諸多與小說不同之處，但我認為都還是在可接受的範圍內，並不會讓

  我有覺得「明明是掛名《天龍八部》，怎麼卻感覺像是在看別的作品」的想法，相較於本

  片，1994年的電影《新天龍八部之天山童姥》就讓我覺得改編幅度過大，不像是在看《天

  龍八部》了。

  另外在片尾時仍然沒有揭露在聚賢莊救走喬峰的蒙面黑衣人真面目，也沒有出現呂良偉所

  飾演的慕容博，讓我一度懷疑會是爛尾結束，幸好在片尾彩蛋有化解前述問題，甚至為續

  集埋下伏筆，也算是把疑似爛尾的結局扭轉回來。

  唯一讓我覺得可惜的地方是，本片把一些劇情省略，會導致沒有看過《天龍八部》小說或

  電視劇的人，在觀賞本片時有些橋段可能會覺得莫名其妙，例如喬峰及段譽結拜為兄弟的

  劇情就直接省略，甚至兩人根本沒有什麼對話，但之後卻直接稱兄道弟，顯得很突兀，如

  果把那些省略的劇情補上，我想即使沒有看過《天龍八部》小說或電視劇的人，在觀賞本

  片也不會有覺得莫名其妙的地方。

  因此我個人覺得本片不適合沒有看過《天龍八部》小說或電視劇的人看，而有看過《天龍

  八部》小說或電視劇（任何一個版本都可以）的人，真的推薦可以觀賞本片。


  本文就分享到這了，感謝各位的閱讀，謝謝！


  --

  原來如此，已修改，感謝！

  大致上還是看得懂的，畢竟武打場面占蠻多時間，只是會有一些細節不太懂而已。

  電影裡的確沒有明說慕容博是帶頭大哥，但在整個隊伍裡刻意只讓他明顯露臉，似乎有意暗示他是帶隊者，而他在小說裡是完全沒有在隊伍裡的，基於這些改動，我暫且還是偏向認為他在電影裡是帶頭大哥。

  經您提醒，我想起來了，的確是全冠清沒錯，已修改，感謝！'
