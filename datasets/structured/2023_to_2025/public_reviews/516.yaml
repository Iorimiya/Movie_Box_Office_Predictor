title: '[好雷] 辛辛監獄劇團Sing Sing'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這部在奧斯卡頒獎典禮前幾週上映的冷門電影，若不是身邊有A24粉絲特別去看，我真的

  完全不知道。知道後，查了一下，發現算是自己感興趣的片，只是場次太少，雖為奧斯卡

  片，但並非熱門那幾部，第二週場次就極少。


  本週終於有一個空檔，原是要去看《喵的奇幻漂流》，忙一個趕不上早場，只好把最近想

  看的幾部片《納米比亞沙漠直播中》、《感應》與《辛辛監獄劇團》全部查一次，結果時

  間上這部最完美，就衝去看了。


  演員與拍攝方式相輔相成，小而美的一部片。很難真的有什麼巨大的感想，但看的時候很

  投入，看起來極素卻有意思的的表演，加上一點真實畫面，全部的元素都在恰好的位置上

  。幸運在下片前趕上。我喜歡。




  ***


  這裡是我的樂園:




  --'
