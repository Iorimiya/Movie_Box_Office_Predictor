title: 'Re: [討論] <60分鐘亡命直播>關於那個開車歹徒(有雷)'
content: '昨天剛看完這部覺得蠻驚艷的

  綁匪司機在高速公路上倒車根本駕駛天才

  只是我看完有兩個小問題

  1.當綁匪強迫女主脫衣而整個直播間觀眾也都在鼓噪時

  女主怎麼會突然抽刀插向自己手？

  這時候自殘有什麼邏輯嗎

  2.羅局長的結局是什麼？

  在水中逃生之後怎麼羅局長就沒戲份了

  是被綁匪幹掉了嗎？好像也沒看到屍體


  希望看過的人幫我解惑








  -----

  Sent from JPTT on my Vivo 2006.


