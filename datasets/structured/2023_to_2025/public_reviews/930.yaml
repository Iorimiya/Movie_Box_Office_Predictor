url: https://www.ptt.cc/bbs/movie/M.1720150045.A.A5D.html
title: '[討論] <60分鐘亡命直播>關於那個開車歹徒(有雷)'
content: "電影介紹：\n\n\n\n想問問有去看過這部電影的朋友們\n\n最後交代的我看得有點霧煞煞\n\n就是開車的歹徒，是女警官追緝的通緝犯\n\n\
  所以他是有跟女警官達成甚麼協議，才幫助女警官配合出演這場直播嗎？\n\n那為何最後男歹徒要拿刀刺死女主角的那一刻\n\n女警官又要把男歹徒開槍射死呢？然後再自己在拿槍瞄準女主角？\n\
  \n有沒有知道的人可以分享一下的\n\n感謝啦！\n\n--\n   對的，好像是女主角撥通手機結果女警官的手機響了......\n   女警官才起殺意的！\n\
  \   謝謝大家的討論！本片還是值得一看，反轉精彩、有探討社會寫實人性面！\n   懂了！謝謝指引方向！\n   但是我突然想到一個問題：\n   既然男司機和女主角並沒有啥深仇大恨，\n\
  \   為何在女主角從水裡爬出來後，男司機非得要拿刀把她桶死呢？\n   好吧，感覺確實後面交代的有點潦草。\n   關於男司機與女警官之間的關係、達成的協議、合作的方式，有點不清楚。\n\
  \   恩恩，這樣子聽起來就合理多了"
