title: '[新聞] 【草迷宮恐怖殺人事件】獲觀眾票選獎肯定'
content: '新聞網址：



  揭開菲律賓「殺人草叢傳說」的最新恐怖電影《草迷宮恐怖殺人事件》（Legend of the

  Tall Grass），即將在本週五（11/1）於全台驚悚獻映。在有「菲律賓獨立電影女王」之

  稱的伊爾瑪阿德拉萬（Irma Adlawan）推薦下，新生代女星吉蓮維琴西奧（Gillian

  Vicencio）跳過試鏡直接空降成為本片女主角，精湛演技也被導演阿爾文雅潘（Alvin

  Yapan）大讚：「只要她有空，我會一直找她演戲的！」雖然本片並非吉蓮的恐怖片初體

  驗，但她要在夜晚於尖銳的草叢中狂奔，不僅讓她倍感疲勞，更把自己搞得滿身是傷。值

  得一提的是，本片也獲選「馬尼拉之光獨立影展」放映，並在影展中榮獲「觀眾票選獎」

  肯定，讓劇組又驚又喜，同時在放映後廣獲影評與媒體好評，值得台灣觀眾親自進戲院體

  驗震撼！





  由菲律賓知名導演阿爾文雅潘執導的《草迷宮恐怖殺人事件》，在有「菲律賓獨立電影女

  王」之稱的伊爾瑪阿德拉萬推薦下，讓導演阿爾文雅潘向新生代女星吉蓮維琴西奧發出邀

  請，甚至讓她跳過試鏡，直接空降成為本片女主角。導演對此分享：「我跟伊爾瑪說想找

  一個年輕點的演員，所以她向我推薦了吉蓮，而她的表現真的讓人驚喜！」更還大讚：「

  此後只要她有空，我會一直找她演戲的！」



  雖然這次並非吉蓮的恐怖片初體驗，但這次不僅得在夜晚拍攝，還需要在高草叢生的草叢

  中狂奔，讓她倍感疲勞、表示困難：「現場拍攝很不容易，會體驗到高草的尖銳，那些都

  是真的，會時不時被尖銳的葉片割傷。」雖然累積不少傷痕，但真實又特殊的經歷，也讓她展現正能量笑說：「這不就是我們想追求的嗎？有時候受點傷是值得的！」





  《草迷宮恐怖殺人事件》也在今年入選「馬尼拉之光獨立影展」，除了入選影展中的「最

  佳劇情長片」獎項，更榮獲「觀眾票選獎」肯定。劇組在領獎時又驚又喜，並在現場開心

  歡呼，吉蓮維琴西奧也興奮感謝：「真的讓人非常開心，看到大家支持我們的作品，特別

  是菲律賓的觀眾們，真的很謝謝你們！」尤其本片放映後，也廣獲當地影評與媒體好評，

  媒體網「ABS-CBN」：「從頭到尾都超『殺』的！」《每日論壇報》：「是會耗盡能量、

  扣人心弦又驚心動魄的電影之旅！」娛樂新聞網「PEP.ph」：「充滿跳躍驚嚇和血的超自

  然驚悚片！」影評「My Movie World」：「是一部有趣的電影，最好要在大銀幕上觀賞！

  」值得台灣觀眾進戲院親自體驗！



  這部揭開駭人都市傳說的《草迷宮恐怖殺人事件》，即將在本週五（11/1）於台灣驚悚獻

  映。全片描述一處廢棄草叢，發生一系列詭異的殺人魔連環殺人事件，讓警探阿邦（瓊姆

  芭絲康飾演）展開調查。某夜，他們遇到喬伊絲（吉蓮維琴西奧飾演）與她的一群朋友，

  揚言要在這片草叢中上哀悼慘遭殺害的親友，實際上她們也是為了調查這一連串真相，而

  來到了這片草叢。兩邊人馬開始在草叢中搜尋，竟意外發現殺人魔可能並非人類，更像是

  神祕的超自然力量；而另一位神秘人物史蒂芬（克里斯多夫加西亞飾演），則掌握著這個

  超自然殺手魔的關鍵真相…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
