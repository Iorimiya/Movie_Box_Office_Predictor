title: '[傻眼雷] 海賊王紅髮歌姬:史上最強片尾'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  如果你認為蜘蛛人返校日的美隊片尾讓你生氣

  那千萬別錯過海賊紅髮歌姬的彩蛋

  絕對讓奇異博士多元宇宙的自打臉大叔蒙羞

  我那場看完旁邊觀眾好幾個紛紛說道:就這樣?

  浪費我時間等那麼久

  看那麼多片尾還是第一次碰到迴響這麼熱烈的片尾


  這部是粉絲向的作品，旁邊的人都說沒熱血的感覺

  反正一直開揍打到贏就對了

  然後塞一堆熟悉人物粉絲就會高潮

  看到後面動畫轟炸整個疲乏掉

  強者天下是海賊劇場最有邏輯的一部

  沒辦法超越了

  畢竟這是海賊王阿


  --

  我那場也都是男生

  最近的劇情深度好像差不多耶'
