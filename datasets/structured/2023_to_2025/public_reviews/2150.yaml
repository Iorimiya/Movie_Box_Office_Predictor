url: https://www.ptt.cc/bbs/movie/M.1661069763.A.3C9.html
title: '[ 好雷]  航海王劇場版：紅髮歌姬'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~





  今天看完很感動，原本看航海王都是抱著看爽片的心情去看，但這部真的讓我看到眼眶泛

  淚


  可能我自己本來就喜歡這種音樂類型的電影或動畫，所以並不會因為歌曲頻繁出現覺得疲

  勞


  整部電影劇情、歌曲及畫面的結合堪稱完美


  搭配電影院的大螢幕及音響設備可以達到最大的視覺跟聽覺體驗


  強烈建議進電影院看







  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  這次的劇情著圍繞著紅髮歌姬「美音」展開，開場路飛海賊團參加了超人氣歌手美音演唱

  會


  在開場歌曲後，藉由路飛和美音的相認，講述的兩人的關係


  接下來big mom海賊團成員跟其它海賊團亂入想綁架美音，美音用自己的能力制服這些想

  綁架他的海賊團

  （我覺的這裡其實就展現美音雖然討厭這些作亂的海賊，但其實心底並不真的怨恨所有海

  賊，算是跟後面的劇情呼應，因為她只是把這些海賊困在音符上，並沒有傷害他們）


  後來劇情講述了美音和紅髮海賊團的關係，以及介紹這次的舞台音樂之島「艾利吉亞」的

  歷史


  並且講述了剛開始演唱會出現的男子「高登」與美音的關係


  原來高登是艾利吉亞的國王，而美音與紅髮海賊團之前曾經造訪這座音樂之島


  島上的人都很喜歡美音的歌聲，傑克雖然捨不得美音，但也希望美音能留在這座音樂之島

  學習


  將來能讓她的歌聲被世界聽到並且感動這個世界的人們


  但美音的歌聲卻無意吸引並喚起了封印在島上的惡魔，使得音樂之島毀滅


  雖然藉由紅髮海賊團的力量壓制了覺醒的惡魔，但音樂之島卻只剩下高登與美音兩人


  美音因為無意唱出了惡魔的樂譜而暫時陷入沈睡，醒來時發現整個音樂之島已經毀滅


  高登跟美音說，音樂之島的毀滅是因為紅髮海賊團的關係


  他們一開始就是為了音樂之島的財寶，才藉由美音來欺騙島上的居民


  這時的美音還不知道，其實這是紅髮傑克為了不讓美音知道事實而無法承受，請高登說的

  謊言


  美音看著紅髮海賊團離去的船影及船上滿載的財寶非常傷心，船上的成員也都背對著港口

  不回頭


  但在另一側卻是紅髮海賊團因為捨不得美音哭泣的臉


  美音雖然在多年後因為撿拾到紀錄當時音樂之島毀滅影像的電話蟲而得知真相

  （我覺得這時後的美音心底雖然知道真相，但還是選擇相信自己是被背叛的）


  但因為之前透過Live直播電話蟲知道了許多平民被迫害的痛苦情況

  （美音根本是現在的網紅實況主吧，還可以辦線上演唱會，不過不知道收不收得到donate

  就是了*o*）


  美音決定藉由自己惡魔果實的能力，讓所有的人陷入不會再被迫害，而且所有人自由平等

  的夢境


  並犧牲自己的生命，讓所有人能永遠在美夢中不用醒來，面對殘酷的現實生活


  儘管最後透過眾人的努力以及紅髮傑克的出現，使得美音放下了執念，讓所有人回到了

  現實世界


  但美音也因為過度使用能力而死去

  （這邊我是偏向相信美音是已經死了的，因為片尾大家都是透過留音貝聽美音的歌，但也

  代表美音雖然不在了，但她的歌聲仍然會存在大家心中並傳承下去）


  整部作品最感人的，我覺得是美音與紅髮海賊團的關係，電影裡每部歌曲的歌詞也都與當

  下劇情相呼應

  （每首歌搭配畫面幾乎都讓我起雞皮疙瘩，儘管我在這之前不認識演唱的歌手Ado）


  看到後面都懷疑自己怎麼會看海賊王看到想流淚


  總之我自己是蠻推薦的


  這部的畫面跟音樂都很讚，強烈推薦去電影院看！





  --'
