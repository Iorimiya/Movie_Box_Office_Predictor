url: https://www.ptt.cc/bbs/movie/M.1660992996.A.307.html
title: '[好雷] 航海王RED：紅髮歌姬'
content: '好雷文，直接分享心得


  劇情在版友：jfgt7j8qgx那篇已經說得很清楚了


  這部的優點跟特色就是音樂、創新、情懷


  劇情、邏輯方面、角色強度有一點問題，但這是熱血少年漫畫Jump的冒險作品


  既然推理類的柯南都可以這很柯學了，那就算海賊這部分還有精進的空間


  以歷屆劇場版的品質相比也是很可以接受的



  我進場之前沒看什麼預告片，想用白紙一張的心態去體驗這部電影

  音樂的部分非常驚豔不說，開場超過10分鐘的連續唱歌+舞蹈+角色鋪陳非常棒

  我很期待後續會有舞蹈的影片放出來

  這次劇場很不一樣，他結合了過去好幾部的特色(對我來說是優點)

  來把UTA跟她的故事講明白，走出電影院，拼裝過去的作品時，心裡是滿滿的感動


  近幾年的海賊作品

  1. Z：Boss捷風

  2. Gold：Boss特索羅

  3. STAMPEDE：Boss巴雷特


  以下開始連結紅髮歌姬跟前幾部作品的雷同處

  Z捷風：紅髮歌姬開場特別從一般老百姓的角度切入，表達痛恨海賊、也有點討厭海軍

  這點其實跟捷風的願景相似，前者想要改造成自己的新世界，不惜犧牲自己

  後者想要毀滅新世界所有海賊，也不惜犧牲自己

  海賊這部作品很少從一般老百姓角度去切入，然而世界上最多的是小老百姓

  而不是得天獨厚的天龍人、大海賊、海軍...


  Gold特索羅：也是自己有個領地，在那個領地內包含一般人，而且可以胡作非為

  ，對照到UTA用歌聲創造的世界。最重要的是天龍人的影響，特索羅這個角色之所以立體

  並不是他本性很壞，而是他遇到了天龍人，而天龍人的威勢讓他也跟著墮落

  他不像天龍人讓別人恐懼，但沒有特索羅的允許，你不准笑。

  UTA的劇情在後半段，突然殺出很突兀的天龍人，結果發生台下觀眾即便進到這個歡樂世界

  他們內心還是有對世界貴族深深的恐懼，進而動搖，產生對UTA的質疑

  ↑不過也有可能是UTA吃了不眠菇導致能力不穩

  所以不是大家在這個虛假的音樂島一起當朋友玩樂就peace了，有些刻進心底的創傷還是在


  STAMPEDE：對照巴雷特，就是孤獨感，動漫劇場版為了讓夥伴有點戲份

  通常會安排對應的敵人，但在海賊歌姬的劇場版中，卻像巴雷特那部一樣

  讓所有人專心對UTA以及她所創造的世界，這樣的做法好壞參半

  好處是反派只有一個會很立體，但壞處是強度容易崩掉，打鬥單一，且動作運鏡變得很雜亂

  (Z-film的運鏡就是最棒的劇場版，每次重新看索隆那段都會高潮)


  接下來要講這部的缺點了

  歌唱果實的能力/設定矛盾：能力很強是一回事，但很多設定自圓其說又是另一回事

  首先UTA的目的是要把大家困在精神世界，據一開始的設定來說大家都到精神世界

  然後她靠著不眠菇累死自己，所有人就都會困在裡面出不來

  呃，可是那又不是冷凍艙，現實世界人不吃不喝昏迷過去還是會死啊=口=

  還是說肉體崩壞精神永遠留存，所以精神世界內的UTA跟其他人可以永遠相安無事？


  另外還有一件事情令我細思極恐：正如布魯諾所說，之前有發生過打敗音樂魔王

  解放精神世界的事情，所以這個方法才流傳了下來。

  但換言之，克比說過：如果UTA真的成功實現計畫，那麼大家都會被困在精神世界

  欸，你怎麼知道這件事情的啊？那照你這樣說其實前幾代的歌唱果實能力者

  真的有成功做到這件事情，所以現在某個精神世界關著以前...？


  最後，紅髮歌姬我覺得最大的問題是紅髮的設定

  因為他的說法扭曲了海賊王的核心價值，就是夥伴

  UTA的夢想並不是成為多厲害的歌手，而是紅髮海賊團的音樂家

  即便紅髮自願把那天的事情一肩扛起，但他並沒有給UTA選擇的機會

  但沒想到UTA從此以後就在那座島上直接關了12年

  如果沒有影像電話蟲，她一輩子如此孤獨地跟那個長臉男(國王)學音樂

  也只能從下面2個痛苦的選項挑1個

  1.假設沒找到慘劇真相→一輩子痛恨紅髮，屠城+丟棄自己

  2.就算有找到慘劇真相→一輩子恨自己，懷疑紅髮為什麼不來接自己


  說到底都是那個愛音樂愛過頭的國王惹禍，明明知道樂譜有問題不摧毀

  然後12年來一直沒讓UTA出去看看真正的世界...

  然後紅髮你不跟魯夫說UTA在哪裡的原因是？

  不只強迫別人賣面子你自己還賣關子嗎？


  最後，那個畫風突變的音樂魔王真是醜到不行，妥妥的一隻木樁王

  不如把UTA弄成巨型機器人啊(巴雷特：？！)



  --

  可是UTA怎麼知道...肉體死了精神不會死？

  能力者不見得能100%知道惡魔果實的能力跟限制(比如月光摩利亞)'
