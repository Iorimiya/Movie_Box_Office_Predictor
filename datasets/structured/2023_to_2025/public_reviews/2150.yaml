title: '[好雷] RED 紅髮歌姬'
content: '我從還沒看過海賊王的劇場版 漫畫只看到人魚島就停追了


  今天是看在紅髮傑克的面子上(還有Ado的歌)進電影院的


  本來怕會有不知道的腳色出場(UTA不算) 會少了點甚麼


  結果還是能順順看 所以如果也是停追海賊王的人是不用太擔心


  最多就是片尾出現的角色不知道是誰罷了 不影響正片觀賞


  先說結論 如果原本就很喜歡海賊王的 這部應該也是會喜歡


  如果也喜歡Ado的歌的話 這片會逼近神作


  因為電影院的音響通常比你家裡的喇叭或音箱好太多


  所以很值得進電影院觀賞


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  來聽首歌吧

  新時代




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  故事一開始先說明大海賊時代開始後 對世界與人民的影響


  普遍來說就是因為海賊的燒殺擄掠 讓人民怨恨不已


  有時會有海軍會來保護他們 但是更多的時候海軍並沒有出現


  而普通人民該祈求誰來保護他們呢?


  畫面一轉來到世界的歌姬UTA第一次的現場LIVE


  開場直接來一首"新時代" 直接震撼世界與電影院的我們!


  不愧是本片的主題曲 立體感十足的3D作畫 能配合歌詞舞動的煙火與UTA的靈活舞蹈


  配合節奏輕快與Ado的歌聲 彷彿像是Ado套著3D皮在開演唱會 令人十分的驚豔


  有人說這部片根本是Ado的演唱會也不能說他錯 不過每一首歌出現都能推進劇情


  要我說的話 我會覺得這是一部海賊王的歌舞劇 故事裡每一首歌曲都有它存在的意義


  並不是像演唱會中只是要換下一首歌而唱出來的


  不管這首歌是為了戰鬥還是為了唱出UTA心中的感受


  每一首歌都能很直接的讓觀眾感受到其中的情感


  就像我現在把這張Ado的專輯拿出來一首一首聽腦中就能出現這在劇中是哪一段劇情一樣



  這一部劇場版把UTA小時候遭到傑克的拋棄並且看到世界上的普通人民遭到海賊的侵害


  從而利用自己的歌唱果實能力計畫創造"新世界" 被海軍與世界政府下令殺害


  本想豁出性命創造沒有海賊也沒有海軍與世界政府及天龍人的新世界


  卻發現新世界並不是普通人民想要的


  在海軍攻擊與吃下不眠菇的雙重壓力下最後招喚出魔王


  最後在傑克與魯夫的共同努力之下擊潰魔王 但是UTA也為了將已進入新世界的人釋放出來


  用盡了最後的體力而死



  在看到傑克拿刀抵著黃猿說"只是父女吵架而已，能不能不要打擾我們"笑了


  與釋放出四皇霸氣威懾全場海軍說


  "UTA是我的女兒，是我們紅髮海賊團的一份子，誰要逮捕她就是與我們紅髮海賊團為敵!"


  看得我眼角濕潤


  本片將UTA短短的一生從頭到尾說完了


  從他人生最輝煌的時候到最後黯然消逝


  配合上最後一首歌"風のゆくえ"回顧世界每個人都在聽UTA的歌的畫面


  不愧是世界的歌姬


  真不希望UTA真的死了 希望未來漫畫還能出現UTA


  --


  人們往往對陌生人太好 卻對自己人苛刻


  只為了不讓人留下自私的印象


  --'
