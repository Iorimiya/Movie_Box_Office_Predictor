title: '[微負雷]   海賊王 紅髮歌姬 red'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  1.有點明知不好看還是去看，因為這種電影都像是同人創作，只是借用海賊王的角色去創

  作，但本身又很喜歡海賊王，所以還是會去看。


  2.也不是說劇情不好看，只是劇情的風格跟尾田差太多，會進電影院看的人多數是海賊的

  粉絲，顧客群是被挑選過的，如果風格跟原先海賊差太多，不符海粉胃口的機率就比較大

  ，像海賊電影中，這部風格就跟《狂歡島男爵》有點像，《黃金城》跟《強者世界》就跟

  尾田風格比較像。


  3.不喜歡的一點，電影把一大堆角色加進來，跟上部《奪寶爭霸戰》一樣，覺得很不真實

  ，一堆魯夫認識的人一起在這邊不期而遇，整個海賊世界是只有幾坪大而已嘛。


  4.整個電影像是海賊形式包裝成的Ado演唱會，喜歡聽演唱會的會覺得很好，不喜歡聽演

  唱會的會想打呵欠，所以評價應該會很兩極。


  5.後面的戰鬥畫面很像在看動畫的片頭曲，因為背景很抽象，又有背景音樂。



  --'
