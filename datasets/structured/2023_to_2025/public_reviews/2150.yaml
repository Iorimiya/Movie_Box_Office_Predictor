url: https://www.ptt.cc/bbs/movie/M.1679390612.A.06D.html
title: '[開箱] 義版 海賊王劇場版紅髮歌姬 藍光BD雙版本'
content: '原文片名：ONE PIECE FILM RED

  中文片名：航海王/海賊王 劇場版：紅髮歌姬


  我必須承認，我漫畫大概追到魚人島就停了XDDD

  當時電影預告老實說看了也還好，畢竟已經沒追一陣子了，無感

  直到上映前朋友找我去看了IMAX特映....


  然後我就默默的到下映前十刷了(遮臉


  你要說這片劇情多棒多感人打鬥多精采多震憾

  老實說我真的覺得還好，邏輯問題說真的也一大堆

  劇情編排也不算好，動作戲也算都一閃而過


  但就是想一看再看，還因此破戒買了不少的周邊與特典

  (演唱會倒是比我收的那堆Arashi、和樂器樂團...etc華麗XD)


  嘛，總之難得有這樣一部喜歡的動畫，那當然是能收就收啦

  之後應該會把全球各國發行的影音版本都收齊吧


  目前全球發行最快的版本就是本次開箱的義大利版

  表訂3/16發行，一共分成普通膠盒版與鐵盒版


  今天剛從DHL送貨員那拿到手，第一時間開箱啦～


  一般膠盒版：






  限量鐵盒版：

  其實我覺得這鐵盒比日版那個好看XDD






  最後是附贈的卡片，兩個版都有附



  基本上BD本身是鎖B區的，台灣正常沒辦法看

  而且只有義大利文字幕，無中字甚至無英字


  不過我本來就有常備一台能播全區的機器

  加上已經看了10次，沒問題啦！！


  再來就是等四月初的法國版啦～


  以上！！


  --








  --'
