url: https://www.ptt.cc/bbs/movie/M.1687509697.A.6DE.html
title: '[開箱] 德/西版 海賊王劇場版紅髮歌姬 藍光BD'
content: '原文片名：ONE PIECE FILM RED

  中文片名：航海王/海賊王 劇場版：紅髮歌姬


  結果德版跟日版同一天到，DHL真的快XDD

  不過因為日版還有東西還沒到齊，還是先來開箱歐洲版


  這次開箱的是西班牙跟德國的兩個版本

  西班牙就比較簡陋，只發了個膠盒版

  不過有用了比較少見的紅色膠盒還算有心啦XD


  德國就發行了收藏版跟鐵盒版兩種版本

  底下就來開箱啦～


  先來三版合個照：



  西班牙版：



  旁邊那張是封面，因為膠盒是紅色半透明的

  抽出來拍比較清楚一點


  德國鐵盒版：



  有附摺頁海報、歌詞本(當然是德文)

  最左邊那張是包裝的背紙


  這鐵盒跟之前義法兩國的鐵盒不同

  背圖跟內圖都有所差異


  德國收藏版：






  附贈了12張小卡(背面為台詞翻譯)

  摺頁海報、歌詞本、厚紙做的立牌(草帽一行)

  片子本身是Digipack包裝


  日版就等這幾天東西到齊了再開箱啦～


  以上！！


  --








