url: https://www.ptt.cc/bbs/movie/M.1681833577.A.10E.html
title: '[開箱] 法版 海賊王劇場版紅髮歌姬 藍光BD雙版本'
content: '原文片名：ONE PIECE FILM RED

  中文片名：航海王/海賊王 劇場版：紅髮歌姬


  「這法版鐵跟義版鐵不是長一樣？幹嘛買？」

  「給紅髮面子阿」

  「你那明明是饞人家女兒身子」

  「....」


  以上為某日與友人的對話XDDD


  訂的時候不知道這兩個鐵盒一樣咩

  現在看來大概是兩個國家的代理商一起訂製的


  不過法版這次直接是ABC全區片，不需要啥特殊機器就能看了

  缺點一樣是老問題，日語發音時鎖死法文字幕


  特收有個獨家的法語版歌手Hoshi短訪談

  法國連美音之歌都有請歌手翻唱、還有發CD與黑膠XDD

  對我來說這就是收各國版本的醍醐味啦~


  底下來開箱：


  這次這兩版其實都是限定版

  分別是Cultura限定膠盒版＆Fnac限量鐵盒版



  Cultura限定膠盒版：




  這個限定版多了那三張卡片XDD


  Cultura那天測了一下似乎不寄台灣

  最後是寄到平常有在用的轉運商的義大利倉再寄回來

  運費上就....嗯....


  Fnac限量鐵盒版：




  這個限定版多了一片DVD

  就是碟面印刷是紅髮傑克的那片

  收錄了TV連動特別篇三話

  『淡い記憶ルフィと赤髪の娘ウタ』

  『新時代の誓い！ルフィとウタ』

  『伝説の記録！赤髪のシャンクス！』


  對，就是日版拆開賣的那三集XDDD

  可惜是DVD


  不過目前的資訊來看美版BD也會直接收錄那三集

  如果到時候台版沒有收錄又不想買貴貴的日版的話

  可以考慮一下相較之下比較便宜的美版


  接下來就等4月底的西版跟6月的日版德版

  還在想6月的美音之歌LP要不要買(思


  以上!!


  --








  --'
