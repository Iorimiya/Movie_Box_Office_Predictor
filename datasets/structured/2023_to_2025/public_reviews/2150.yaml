url: https://www.ptt.cc/bbs/movie/M.1661667098.A.2F8.html
title: '[負雷] 海賊王RED紅髮歌姬'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~\n~~~~~~~~~~~~~~~~~~~~~~~~\n\n就是一部拿紅髮傑克與女兒話題當搖錢樹\n\
  跟狂歡男爵角逐最爛的海賊王電影\n\n如果說是粉絲向\n這也完全不是海賊王的風格\n硬要說的話就是Ado演唱會聯名海賊王\n感覺製作組討論如何把所有歌塞進去\n\
  只是一個用海賊王角色二創的電影\n\n沒有否認視覺設計的用心\n但歌好不好聽跟電影好不好看是兩回事\n他可能是一部成功的兩小時MV\n但是一部極其失敗的電影\n\
  \n這部夥伴全淪為打醬油角色\n主要角色負責露臉一下與搞笑\n羅賓負責看劇本並讀出內容\n羅負責帶魯夫逃跑(不知道要Room幾次)\n紅髮露臉善後對電影海報做交代\n\
  \n美音的聲優與Ado 完全搭配不起來\n連童年時期唱歌也用Ado的聲音徹底出戲\n加上突兀生硬的舞蹈設計看著十分尷尬\n音樂再好聽 強行轟炸的手法讓人很疲勞\n\
  後面某幾首歌人聲調太大導致很刺耳\n\n不是沒有看過也唱歌的動漫電影 \n但違和感都不會如此之重\n看得當下真的尷尬到腳趾扭曲\n\n在前面堆疊這麼多 美音對海賊殘暴的印象\n\
  結果原來美音早就知道滅國的真相\n讓她原先的動機變得蒼白無力\n只是一個叛逆期又中二的屁孩\n\n整座島居民全滅無人倖存\n只剩紅髮團全員與美音就安然無恙\n\
  留國王一命是為了劇情需要\n為了保護美音卻是放她在島上\n這些粗糙隨便的劇情與人設\n看的當下無言以對\n\n羅賓脖子抬得酸得要死才得知Boss的真相\n也是雷聲大雨點小\
  \ 強度設定不明的Boss\n沒看過更糟糕的戰鬥場面了\n打Boss的環節完全回合制\n慣用老套童年卡通手法\n每個角色輪流各部位一刀 \n最後給主角打本體輸出全靠吼\n\
  \n美音明明可以唱完歌再喝解藥\n非要摔破再唱\n可能她知道她在片尾必須要死\n才會有好像很難過的感覺\n也不會影響到本篇的劇情\n\n結論\n想聽歌MV就去\n\
  海賊王的粉絲則不用期待\n\n-----\nSent from MeowPtt on my iPhone\n\n\n--\n\n\n\n08/29 13:29"
