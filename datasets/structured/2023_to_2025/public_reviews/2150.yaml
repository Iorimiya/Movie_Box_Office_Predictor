url: https://www.ptt.cc/bbs/movie/M.1661633159.A.92C.html
title: '[好雷]航海王:紅髮歌姬之有雷想太多心得'
content: "第一次發文，如有問題請告訴我~~~\n然後我是一個思考會無限延伸的人，以下心得就是之於想太多產生的\n所以不要留言告訴我想太多，我知道啦，標題就說了\n\
  除了會提到哭的點、想法之外，也會提部分覺得可以更好的地方\n\n\n不知道是不是因為最近狀態不好，我整部電影大爆哭\n在說心得之前，先做我的背景提要：\n\n\
  - 喜歡Ado，知道一些訊息，像是不到20歲、以前在衣櫃錄音之類的，但不到迷的程度\n- 原生家庭有些問題，有父親議題(不是指daddy issueXD)\n\
  - 最近入坑Nijisanji EN(Vtuber)，去扒了Enna中之人，聽她以前cover的歌，\n知道她從6年前甚至更久就一直在接觸音樂，直到現在可以以Vtueber的身分開演唱會，\n\
  頗為感動QQ\n- 小時候守在電視看航海王，但到外面住之後就沒有再追了，進度可能是到蛇姬左右?\n\n\n（背景提要結束，有助於你看懂下面的心得XDDD）\n\n\
  \n\n\n\n\n\n~*-*~*-*~*-*~*-*超級雷文 暴雷主文分隔線*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n從一開始Uta(美音，本部主角)初登場就讓我眼眶泛淚XD\n\
  從舞台走出來的全身畫面，配合舞蹈做的3D動態感，我就直接聯想到Vtuber了\n如果真的把這部電影Uta出場的樣子，想成背景提要說的Ado和Enna\n可以透過有廣大觀眾的當紅電影，當成出道的樣子，那該有多好？\n\
  甚至後面劇情提到的，\n透過電話蟲傳遞畫面、聽到觀眾反饋生活的苦、觀眾覺得從Uta這裡感受到幸福\n也都會讓我聯想到Vtuber(當然也可以說每個做為被追的公眾人物都適用這些狀況)\n\
  只是最近了解一點點這個圈子的我會覺得，\nVtuber本人或是其粉絲，應該都有一點想逃避現實生活的地方，才會存在在2D的世界裡?\n(好啦這句話好像有點以偏概全哈哈哈哈哈)\n\
  對應Uta想創造幸福世界，我會想到V圈，有各種人設故事，非現實樣子的主播\n\n再來Uta為此想創造一個完全幸福的新世紀，就像在表示\nVtuber和觀眾的界線到底怎麼界定？\n\
  你想背下你全部粉絲的苦嗎，你要接受粉絲們所有的要求嗎\n你覺得你以為對他們好的，就是他們想要的嗎\n(但我知道有健康一點的主播們會知道怎麼劃清啦)\n\n這部分除了V圈之外，也可以反思\n\
  好與壞是並存的，會有情緒不好的時候，也會有快樂的時候\n要怎麼面對生活很爛，去接受負面情緒發生，而不是反抗，我覺得很難\n\n還有「新世紀」的概念，我覺得也很符合V圈的崛起？\n\
  不知道是因為我最近才接觸，還是真的最近開始變紅\n不露出現實樣貌的偶像，正在創造出一個新的世紀，\n會有很多與傳統偶像不同的地方開始產生，行銷、與粉絲見面的方式等等\n\
  \n\n\n再來我看到有些讓人詬病的劇情，是傑克做父親的態度，但這反而是讓我哭的地方\n其實從以前故事在描述傑克的角色時，就可以知道，他的個性就是這樣\n接受生活所有對待他的方式，泰然面對一切；對待他的朋友，就是拚死保護\n\
  失去手臂的時候、看到嬰兒Uta的時候、Uta丟掉睡眠藥水的時候\n都可以看到他很快的接受這一切，做出相對應的處理\n這是我想像中成熟的人會有的樣子。\n另外我最近也領悟，如果你足夠信任對方，就可以\n\
  不把別人「背在身上」、不會怕自己的行為讓別人誤會、不去過度解釋別人的行為\n相信他可以自己面對這個問題，相信他不會有這個想法\n所以我對傑克的解讀是，他信任Uta，也相信自己，所以做出這些決定\n\
  (當然可能會嘴他如果那麼自信就不要騙Uta，就把Uta帶在身邊，\n那麼自信結果最後Uta搞這齣，阿但這就是他衡量的結果啊，他之於這些信任而做的決定，\n但可惜產生這些結果，我只是想解釋那些過去他做決定的可能原因不是不合理)\n\
  \n然後一切做父親的樣子，都讓我爆哭\n擔心滅島對Uta太殘忍，把責任往身上背\n(我有看到別人覺得這不合邏輯，但我覺得可以接受啊XDD)\n當Uta要殺魯夫，溫柔握住Uta的手\n\
  Uta躺在他懷裡時，他對Uta說因為你是我的女兒\n傑克船員們說Uta是他們所有人的女兒時\n沒錯，就這樣，我就哭得很慘XDDD\n\n傑克好帥，現在身材好好\n\
  \n\n最後我覺得劇情可以更好的地方\n是Uta其實早就知道是自己滅的島??\n是怕最後被島主告知時會無法接受嗎，為什麼要加這個劇情我不太懂\n是為了省被告知時的情緒、需要被眾人安慰的劇情嗎\n\
  因為這感覺是很重要的轉折，\n但卻沒有更多著墨Uta自己發現，到想辦演唱會過程中的情緒想法\n說是純粹贖罪，但又其實殺了更多人\n我覺得這樣轉有點硬啦\n\n\n\
  ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\nOK心得文結論其實跟大部分人一樣\n航海王迷可看，Ado粉去看(最好先不要聽已出的新世紀專輯，看電影時會比較有驚喜感)\n\
  要有就是去聽音樂的心理準備，不然會覺得很浪費時間\n像我一樣沒有追到最新劇情的人也不妨礙，\n反正有些沒看過的角色只要知道他們之前跟魯夫有認識就好，只是有些笑點會get不到\n\
  但老粉看到過去角色出現應該會滿感動的？\n\n\n以上，下台一鞠躬\n(是說有推哪部劇院音響超好，聽得很爽嗎?)\n\n(再p.s.\n附上Enna作品：\n\
  \  Jazz旋律origin--https://youtu.be/GIKNnvcylsk\n  微感人歌詞origin--https://youtu.be/ndj2qYnvT_s\n\
  \  残響散歌live cover--https://youtu.be/kaqOTwggZ64\n  最近的live--https://youtu.be/n6cAE2ue84w\n\
  \n--"
