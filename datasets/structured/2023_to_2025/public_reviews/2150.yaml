url: https://www.ptt.cc/bbs/movie/M.1660901563.A.37E.html
title: '[普好雷] 航海王劇場版紅髮歌姬RED'
content: '我是抱著聽Ado演唱會的心態去看的，進電影院前已經把所有發佈曲loop了N遍，在日本上

  映後才發布的因為怕被雷一開始還忍著不看，後來還是忍不住，嗚嗚Ado好棒。


  個人航海王進度從司法島後就有一搭沒一搭的看，到兩年後不久完全棄坑，所以這次劇場

  版中有一些人不認識，但不太影響觀影。


  之前沒有看過其他動畫劇場版。









  ---以下雷---












  先講壞的，太不過癮。


  以聽演唱會的心態的話。


  之前看其他心得時有提到前半小時都是美音演唱會，但其實除了第一首新時代外都沒有唱

  完，而是比較像配合劇情演出（因為美音的能力要唱歌發動）大概唱個半首，通常是精簡

  的主歌->round1副歌或round2副歌就打住，而非是像之前想像中寶來烏那樣唱跳一整個比

  較完整的段落。


  沒有哪種做法一定比較好，但因我抱了有點錯誤的期待，覺得些許失望。


  另外在插入歌曲的處理部分，因為美音的聲優和唱歌不同人，有些地方聲線的割裂感會有

  點大，尤其是最後本來應該要很感動的那個部分...這是我覺得真的蠻可惜的一環。



  然後我不知道是不是所有劇場版都這樣，但我會覺得除了戲份比較多的草帽、紅髮海賊團

  、克比和羅一行外，還有很多角色要被塞進來亮個相的感覺，所以有點亂的感覺，但沒有

  很嚴重，美音的主線還是抓得不錯。


  主線的爆點不會太難猜，但即使有猜到傑克和美音的父女情還是有點感動。


  另外不知道是不是自己老了，覺得劇情的表達蠻子供向的...就是什麼立場感情道理都說

  得非常清楚沒有餘韻，但這本來就是海賊王劇場版，在這邊刁劇情應該多有深度好像也怪

  怪的。海軍殺人，海賊救人也是航海王的定番了嘛。



  整部看下來的感覺還是OK的，劇情也沒太大的bug（紅髮第一次是怎麼殺魔王的算嗎？）

  美音的角色刻畫的不錯，雖然極端但有她成長背景的理由，後面黑化也很可愛（咦）喬巴

  、熊、千陽號出來賣萌也蠻好笑的，所以給普好雷。



  --'
