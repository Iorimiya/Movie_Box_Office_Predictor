url: https://www.ptt.cc/bbs/movie/M.1659230243.A.78E.html
title: '[新聞] 《航海王劇場版：紅髮歌姬》日本全球首映'
content: '《航海王劇場版：紅髮歌姬》日本全球首映嚴禁劇透 六百多萬粉絲關注劇情發展



  少年漫畫劇場版史上頭一遭，《航海王》25週年第15部電影《航海王劇場版：紅髮歌姬》

  讓熱血動作場面結合更多演唱會舞台聲光效果，找來紅遍日本大街小巷的神秘歌姬Ado詮

  釋美音所演唱的每首歌曲，陸續在富士電視台「2022 FNS 歌謠祭夏」、「ONE PIECE DAY

  」武道館演出，讓全球粉絲更加期待。


  「ONE PIECE DAY」7月22日這天還在武道館舉行了《航海王劇場版：紅髮歌姬》全球首映

  ，湧入4000位粉絲進場，在這個音樂聖地觀看新劇場版別具意義，因為在電影裡，美音就

  是世界頂級的歌姬；日本陸續舉辦影迷試映會後，《航海王》官網也號召粉絲在社群以「

  #心に響くにFilmRed」（中譯：觸動人心的Film Red）分享心得，也不忘提醒大家千萬不

  要透過圖片、文字、同人創作等形式來暴雷，目前有將近六百多萬人關注並分享觀影感想

  ：「戰鬥的場面太讚了，等不及要再去電影院多看幾次」、「Ado的歌聲讓我起雞皮疙瘩

  ，看完以後更愛美音了」、「紅髮傑克太帥了」、「史上最震撼的劇場版」、「感動到哭

  」、「一定要看大銀幕才爽」。


  《航海王劇場版：紅髮歌姬》全球首映當天也釋出第二彈正式預告，更是吊足了全球眾多

  還沒觀看電影的粉絲們的胃口；影片前半段還是劇場版主題曲〈新時代〉充滿正能量的曲

  風，後半段則是由秦基博為美音量身訂做的感傷歌曲〈風之去向〉，他曾為《STAND BY

  ME 哆啦A夢》打造感動千萬人心的〈向日葵的約定〉，這首〈風之去向〉催淚的音樂搭配

  畫面，讓許多粉絲感動落淚甚至哭掉一包衛生紙，影片中，美音哭訴被紅髮傑克拋棄，魯

  夫則回應：「他是為了救妳」勾起許多粉絲對三人過往的好奇心；《航海王》連載漫畫最

  新第1055話標題為「新時代」，封面還是原著尾田榮一郎所繪製的紅髮傑克，不少人從內

  頁看到美音的剪影，猜測故事將與電影有所連結，海賊世界最神秘的「辣」個男人，紅髮

  傑克這次會不會與眾人見面，讓人萬分期待。


  另一個劇場版大謎團，草帽海賊團繼梅莉號之後的第二艘戰艦「千陽號」這次化成「人」

  ，名叫「千陽君」，不僅保有獅子頭的造型，腰帶也有著船身的數字「1」，搭配大又可

  愛的尾巴超級萌，圈粉無數，許多影迷笑稱喬巴吉祥物的地位不保了，也很好奇千陽君會

  擁有什麼樣的技能，而在新角色的聲優名單陸續公開以後，千陽君的「聲」世還是個謎題

  ，在日本嚴禁劇透下，令人相當關注會是由誰來配音。好消息是，2022年漫畫博覽會，睽

  違兩年的《航海王》主題館再度「降肉」，不僅有許多劇場版獨家商品，發行商台北双喜

  電影也特別為寶島粉絲爭取福利，搶先在漫博推出限定超值套票組合：2D鐵粉套票、4D動

  感套票，購買就贈送全球獨家千陽君絨毛玩偶，也為《航海王劇場版：紅髮歌姬》在台的

  實體宣傳活動開出響亮的一炮，2022漫畫博覽會今天（28日）起一連五天將在台北世貿一

  館舉行，千萬不要錯過！


  《航海王》25週年，加上劇場版要上映，不斷有聲量吸引全球矚目，最夢幻的企劃莫過於

  《航海王》原著尾田榮一郎與《名偵探柯南》原著青山剛昌世紀大對談，並且讓兩大動漫

  的要角：魯夫、索隆、柯南、安室透合體，兩位老師惺惺相惜，都於去年共同突破漫畫

  100卷，尾田大方承認曾經不太想看柯南，因為把青山視為敵人，並且想打敗他；談到劇

  場版，尾田坦言自己參與電影製作會非常挑剔，所以一開始都不想加入，但後來卻連廣告

  宣傳、海報設計等都會審查；也由於劇場版腳本是交由其他編劇撰寫，為了符合角色的人

  設，特別是魯夫，尾田更是花大把時間逐一確認台詞，相信粉絲在觀賞電影時，也會感受

  到尾田積極認真的態度。





  新聞網址：



  --'
