title: '[選片]七龍珠超-超級英雄VS海賊王劇場版紅髮歌姬'
content: '如題

  最近很久沒看電影了

  本來是想看七五計劃

  但最近壓力比較大一點想要看個動畫劇場電影

  所以想問看看七龍珠超跟海賊王

  這兩部的劇場版

  各位大大會比較推哪一篇

  劇情倒是還好不要太誇張爛就行了

  當然如果能夠有還不錯的場景畫面是最好囉

  七龍珠超是蠻期待打鬥畫面

  海賊王則是聽說歌很好聽畫面很有聽現場演唱會的感覺

  目前心中的天秤是比較偏向海賊王XD

  就看有沒有兩部都看過的大大能給一點建議囉


  --

  願我所愛的人永遠幸福


  --'
