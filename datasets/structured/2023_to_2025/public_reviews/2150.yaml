url: https://www.ptt.cc/bbs/movie/M.1660569565.A.E8E.html
title: '[好無雷] 航海王：紅髮歌姬 RED 無雷推薦心得'
content: '我是上週六搶到特別場去看的

  觀賞的影廳是MUVIE TITAN廳


  本身是海賊老粉，有全套漫畫和無數週邊，至今還是持續在追最新進度的那種。

  個人心得是：超愛！後勁很強，我會去二刷（過去的劇場版沒有二刷過）


  這部電影的缺點還是有的，最大的缺點我覺得是開場唱歌太長了XD


  電影故事環繞在海賊世界裡最火紅的歌姬 aka 紅髮傑克的女兒美音（本次原創角色），

  這位最紅的歌姬要開自己第一場LIVE演唱會，而吸引了包括草帽一行人在內無數的觀眾到

  場欣賞。


  所以電影的一開始就是這個演唱會的開場，大概30分鐘的片段，雖然中間有一些劇情互動

  ，但還真的主要就是唱了三首歌。給我的感覺就像看五月天演唱會電影版一樣，既不能好

  好聽歌，也不能好好看劇情，以電影的角度來說很破壞節奏。


  但因為歌曲本身很好聽，這次負責演唱的Ado歌聲也很有感染力，加上經費炸裂的演唱會

  舞台效果畫面，就當做在看演唱會也還是沒問題的。


  中後半段就回到了一部正常電影該有的節奏，雖然美音還是會時不時唱歌，但這些歌曲就

  比較類似迪士尼電影，是配合劇情與角色心境唱出的，非常的契合、有感染力。


  這次的電影類似於之前Film Z的架構，故事完全圍繞在電影全新出場的人物上，魯夫等人

  反而不是電影的主角，而是來參與這個角色的故事。這使得美音這個角色刻劃的十分立體

  ，她與魯夫、紅髮之間的故事與情感也十分生動，不是為了劇場版而生的免洗角色，我相

  信他會像Z捷風一樣，即便從未在原作中出現，也依然是個會在粉絲間留下深刻印象的好

  角色。


  這次的電影音樂自然沒話說，電影中音樂登場的順序跟專輯的順序是一致的，所以整張專

  輯雖然曲風大相逕庭，但實際看完電影就知道這完全是隨著電影起伏在安排的。我本來是

  完全不認識Ado的，看完電影後直接把這次的兩首抒情歌瘋狂循環播放。然後Tot Musica

  這首歌在電影裡的登場實在太猛了，第一句一出來我的反應是：哇 太到位了吧！


  畫面表現也是令人滿意，最終決戰的畫面張力與華麗度看得是通體舒暢。紅髮在故事中的

  份量也是有誠意的，不是只是借個名號讓人拍電影而已（？）劇情上也蠻令人動容的，很

  海賊王式的走向，也有很海賊王式的感動（有一種：我就知道要來這招！但還是會被感動

  到），沒聽錯的話那一場有賺到很多啜泣聲。


  其他的缺點就是一些為了服務粉絲而登場的老角色為什麼會出現在這裡（或是為什麼現在

  才出現），以及這段故事發生的時間點跟原作有衝突等必須直接無視的bug，建議大家這

  部分直接放空去看就好了。


  總結一下

  海賊粉：必看啦！


  Ado粉：必聽啦！演唱會都不會這麼華麗


  曾經看過海賊但很久沒看的：不用補任何東西直接去看也沒問題，畢竟你不可能不知道魯

  夫跟紅髮的關係吧？其他沒特別介紹的登場角色就是客串演出的程度，不重要


  完全沒看過海賊，只是不知道要看什麼想圖個樂子的：好聽又好看、娛樂性十足的電影，

  你只需要去補海賊王第一集了解魯夫跟紅髮的關係就好了


  海賊黑：不給紅髮一個面子嗎？


  特別提醒，首周買兩張2D票會拿到這次的特典卷40億，強烈建議看完電影前不要打開他，

  裡面會是完全的暴雷（不過都是日文的）。如果是海賊粉絲的話，如果沒拿到或看不懂中

  文，務必觀影後去搜尋一下內容，裡面有尾田對於紅髮和美音相關的詳細設定，粉絲必看

  ！


  --'
