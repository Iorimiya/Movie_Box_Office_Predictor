title: '[好雷] 失控教室'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~












  片長不長

  前中段個人感覺節奏稍微慢


  然後直到後段一次爆發出來


  老師慢慢構起來的上課模式

  以及學生互動默契，整個瞬間崩塌


  老師拍攝影片是有錯

  她自己也理解到這是有問題的


  而原本學校裡面的體制

  老師們與她的溝通、加上孩子們的不諒解

  班上默默地因為偷竊事件而形成的霸凌行為


  整個讓老師處在一個兩面不是人的狀態







  這部片很精彩

  後段感覺有些場景是稍嫌誇張的


  看影片都能感受到老師的壓力有多大


  而實際上

  老師跟我們什麼都做不了


  老師真的是一個很難當的職業

  你有熱情 會被體制牽絆、會被人情世故消耗殆盡


  你要是只做到該做的而已

  內心的責任感又會不允許自己漠視這一切










  所以佩服在這工作上還保有熱情的老師


  在教學的這過程之中，

  一定或多或少都有犧牲掉了什麼

  卻還能繼續堅持下去自己的路


  蠻沉重的好片 推薦一下


  --





  --'
