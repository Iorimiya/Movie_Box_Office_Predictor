url: https://www.ptt.cc/bbs/movie/M.1754493283.A.2CB.html
title: '[新聞]DAY6電影【6DAYS】台灣影城預售抽限定好康'
content: '新聞網址：



  南韓人氣樂團「DAY6」迎來出道十週年，將首度登上大銀幕，推出充滿音樂與感動的公路

  電影《6DAYS》，預計將在8月22日於台灣正式上映！憑藉DAY6在全球的火紅人氣，本片國

  際版權也狂銷亞洲、歐洲近30個國家與地區。尤其本片不只是音樂旅程，更是一段關於青

  春、友情與成長的紀錄。DAY6所屬經紀公司「JYP娛樂」表示：「本片描繪成員們在旅途

  中遇見意外的緣分，以及未曾預料的事件，透過重新理解彼此的過程，回顧他們共同走過

  的十年。」聯合製作方「MBC電視台」也看準DAY6的獨特魅力與深厚人氣，表示：「DAY6

  是詮釋『青春』與『旅程』主題最合適的團體。」尤其本片融合紀錄片與綜藝節目特色，

  打破影視類型界限，讓MBC直言：「本片是一次展現內容新可能性的挑戰。」為了慶祝本

  片即將在台上映，全台威秀影城、秀泰影城、台北美麗華影城也在今日（8/6）中午12:00

  起，搶先開放8月22日至28日部分場次預售票。更令人驚喜的是，三大影城同步祭出首波

  「限量早鳥抽獎」活動，只要購買首波預售票的粉絲，就有機會參加抽獎，贏得《6DAYS

  》在8月16日（週六）於韓國的限定活動入場資格，詳情請見各影城粉絲團公告。





  自2015年出道以來，DAY6以紮實的音樂實力和扣人心弦的創作，贏得「值得信賴的樂團」

  等高度讚譽。他們融合搖滾與流行元素的獨特風格，使DAY6成為南韓流行樂壇無可取代的

  存在。每次發表新作，都在粉絲間引起強烈共鳴，持續締造口碑佳績。尤其今年5月，他

  們完成名為《Forever Young》的世界巡迴演出，橫跨全球23個地區、共舉辦45場演出，

  震撼國際舞台。尤其在首爾奧林匹克體操競技場的場次中，每場吸引約1.6萬名觀眾，創

  下該場地單一巡演歷代最多觀眾紀錄，意義非凡，也進一步奠定他們作為全球頂尖樂團的

  地位。適逢出道十週年，DAY6順勢推出首部大銀幕音樂公路電影《6DAYS》，消息一出便

  掀起全球熱議，國際版權狂銷近30個國家與地區，包括台灣、日本、香港、印尼、馬來西

  亞和新加坡等亞洲地區，也將在英國、西班牙、義大利、波蘭、葡萄牙、加拿大、南非和

  拉脫維亞等歐洲地區上映，展現驚人影響力。



  本片由南韓電視台MBC聯合製作，也是他們首度挑戰原創電影，試圖打造一部突破框架、

  充滿創意之作。MBC表示：「本片融合紀錄片與綜藝節目特色，打破電視與電影界線，是

  一次對內容形式的新嘗試，也是我們所夢想的敘事進化之路。」MBC也透露選擇DAY6的理

  由：「他們是當今最具人氣與音樂深度的樂團，最能詮釋這部作品所要傳遞的青春與旅程

  主題。」DAY6所屬經紀公司JYP娛樂則進一步揭示故事核心：「本片描繪成員們在旅途中

  遇見意外的緣分，以及未曾預料的事件，透過重新理解彼此的過程，回顧他們共同走過的

  十年。」全片便以美國遼闊風光為背景，融合DAY6的音樂演出、街頭互動與團員真摯對話

  ，不只是旅程紀錄，更是感情流動。戲劇化的敘事節奏與音樂旋律相互交織，讓全片不僅

  感動人心，更是獻給粉絲最真摯的禮物。





  值得一提的是，為了慶祝《6DAYS》即將在台上映，全台威秀影城、秀泰影城、台北美麗

  華影城也搶先在今日（8/6）中午12:00起，開放8月22日至28日部分場次預售票。三家影

  城更同步加碼宣布，只有購買首波預購電影票的粉絲，即可參加「限量早鳥抽獎」活動，

  有機會贏得「8月16日（六）的《6DAYS》韓國限定活動入場資格」！只要在首波於威秀影

  城（限8月6日購票之iShow會員）、秀泰影城（限8月6日至7日購票之會員），以及美麗華

  影城（限8月6日至8日購票之會員）購買本片預售場次之電影票，即有機會抽中！此外，

  購買本片首週電影票，更可獲得精美紙相框膠捲卡片(五款隨機)，若購買特殊規格4DX、

  SCREENX版本，更加碼贈送工藝A3海報。豐富活動詳情，請見各影城粉絲團公告。



  迎接出道十週年的超人氣實力樂團「DAY6」，首部音樂公路電影《6DAYS》，即將在8月22

  日於全台上映。本片描述為了慶祝出道十週年，DAY6四位成員——晟鎮、Young K、元弼

  與度云——在圓滿結束世界巡演後，展開一場為期六天的美國公路之旅。這趟旅程沒有明

  確計劃，只有一台車、一群夥伴，以及無盡的前方。起初，旅程像是一場輕鬆假期，隨興

  彈唱、自在駕車，甚至在沙漠中駕著越野車奔馳，感受自由氣息。沿途偶遇音樂人，與其

  暢談音樂，以及意想不到的挑戰接踵而來。他們逐漸在陌生風景中彼此靠近，進行真誠對

  話，並回望這十年來的心路歷程。這場宛如Man in a Movie般的電影之旅，紀錄下DAY6與

  My Day一同走過的燦爛時光——而這場融合音樂、友情與青春的冒險，都將凝聚為他們生

  命中最重要的旋律。



