title: '[新聞] 【6DAYS】試映DAY6成員真情吐露拍攝甘苦'
content: '新聞網址：



  南韓人氣樂團「DAY6」在5月完成《Forever Young》世界巡迴演唱會，巡演橫跨全球23座

  城市，共計45場演出，尤其在首爾奧林匹克體操競技場的演出，更刷新該場地單一巡演歷

  代最多觀眾紀錄，穩固他們作為全球樂團的地位。尤其今年適逢團體出道十週年，近期他

  們更公佈將在8月底開跑《The DECADE》十週年巡演，消息一出，更是讓粉絲大呼期待。

  而在巡演前夕，他們的首部大銀幕音樂電影《6DAYS》也將在8月22日於台灣正式上映，片

  商並順勢公開正式預告，展現出更多電影精采畫面。尤其本片日前在首爾舉辦試映會，成

  員們也共同出席，並分享精采拍攝花絮，以及對本片上映時的期許，成員之一的晟鎮更笑

  稱：「我正式以電影演員出道了！」







  DAY6迎來出道十週年，透過音樂公路電影《6DAYS》首度登上大銀幕。不同於一般單純的

  演唱會實錄或旅遊紀錄，本片採半紀錄式劇情片的創新架構，讓四位成員晟鎮、Young K

  、元弼、度云在音樂流淌在陌生城市街道上，透過彼此的眼神交流，蘊含著十年青春的悸

  動與深刻情誼。透過電影，不僅呈現一場場動人的旋律集合，更是一段段直擊人心的故事

  篇章。觀眾將聽見敲擊靈魂的節奏、自然流露的即興對話、真摯交織的笑聲與煩惱，見證

  這趟充滿戲劇張力的六日之旅，如何化為DAY6與My Day（官方粉絲名）之間，永生難忘的

  青春印記。



  在台灣片商釋出的正式預告當中，從逆襲全球串流排行榜的代表作〈Time of Our Life〉

  起始，揭開一段意想不到的旅程序幕。元弼在預告中說：「我們想嘗試之前沒做過的事。

  」晟鎮也隨即興奮表示：「應該會有很多有趣的事情吧？畢竟我們是DAY6啊。」畫面中，

  成員們徜徉在自由奔放的氣氛中，盡情享受屬於青春歲月的假期。當度云驚訝呼喊：「那

  台不是我們的車嗎？」預示故事即將出現意外反轉。而Young K一句：「如果錯過這次，

  將會錯過人生的重要機會。」更讓人對這趟旅程的深意產生無限遐想。DAY6以全新姿態展

  現的絢麗色彩與視覺美感，唯有透過大銀幕才能全面感受，也因此獲得My Day們的熱烈支

  持，紛紛在社群上留言大呼：「興奮到心臟都快炸出來了！」「一定五刷起跳！」「好想

  快點看到！」「真正的沙漠出現了，浪漫合格！」等熱烈迴響，甚至一度登上X（Twitter

  ）即時熱門話題榜，未演先轟動。





  值得一提的是，《6DAYS》日前舉辦VIP試映會，導演鄭有錫與黃在錫特別率領DAY6四位成

  員親自出席站台。Young K表示：「能夠體驗電影這種全新領域，真的感到非常榮幸。我

  們在拍攝現場與工作人員一起投入滿滿熱情，真的非常期待看到最終成果。」晟鎮則笑說

  ：「我正式以電影演員出道了，還親自駕駛越野車在沙漠上奔馳，真的非常新鮮有趣。」

  元弼也回憶難忘場景：「我們在拍攝現場忍不住驚呼，因為天空中的星星實在太密集、太

  美了，這段回憶至今仍深深烙印在我心中。」度云則分享拍攝現場的挑戰與感動：「這是

  我人生中首次有這樣的經歷，真的一點都不容易。尤其是拍攝時氣溫變化劇烈，一下熱、

  一下又冷，熱的時候甚至高達38度，看著所有工作人員在酷暑中默默堅守崗位，不僅讓我

  深刻體會拍攝的辛苦，也學習到作為專業人士應有的態度與精神。」聽完成員們的真情分

  享後，導演黃在錫也忍不住讚賞：「在多變的天氣與陌生的拍攝環境中，總是成為眾人中

  心的晟鎮、既聰明又有Sense且對工作一清二楚的Young K、總是掛著『謝謝』兩字的溫柔

  元弼，以及明明非常有男子氣概卻又充滿反差魅力的忙內度云，讓DAY6成為一個真的很棒

  的團體！真的非常感謝你們，辛苦了！」



  迎接出道十週年的超人氣實力樂團「DAY6」，首部音樂公路電影《6DAYS》，即將在8月22

  日於全台上映。本片描述為了慶祝出道十週年，DAY6四位成員——晟鎮、Young K、元弼

  與度云——在圓滿結束世界巡演後，展開一場為期六天的美國公路之旅。這趟旅程沒有明

  確計劃，只有一台車、一群夥伴，以及無盡的前方。起初，旅程像是一場輕鬆假期，隨興

  彈唱、自在駕車，甚至在沙漠中駕著越野車奔馳，感受自由氣息。沿途偶遇音樂人，與其

  暢談音樂，以及意想不到的挑戰接踵而來。他們逐漸在陌生風景中彼此靠近，進行真誠對

  話，並回望這十年來的心路歷程。這場宛如Man in a Movie般的電影之旅，紀錄下DAY6與

  My Day一同走過的燦爛時光——而這場融合音樂、友情與青春的冒險，都將凝聚為他們生

  命中最重要的旋律。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
