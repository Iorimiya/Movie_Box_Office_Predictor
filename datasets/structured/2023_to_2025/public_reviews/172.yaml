title: '[新聞] 【6DAYS】創韓國偶像音樂片罕見票房佳績!'
content: '新聞網址：



  南韓人氣樂團「DAY6」在迎接出道十週年之際，推出首部音樂公路電影《6DAYS》。本片

  於上週三（8/13）率先在南韓上映，首日即吸引超過1.5萬名觀眾湧入戲院搶先觀賞，強

  勢空降新片票房冠軍，截至昨日（8/17）更已累積近3.4萬觀影人次，並在入口網站「

  NAVER」拿下高達9.52分（滿分10分）超高評價，並在「CGV」網站以92%的金雞蛋指數佳

  評如潮。根據南韓影視業界透露，本片叫好叫座，短時間便突破偶像演唱會或音樂電影都

  難以衝破的三萬觀影人次門檻。尤其本片僅在南韓CGV影城獨家上映，在這樣的發行條件

  仍能創下佳績，堪稱一大壯舉。即便正值暑假檔期，商業大片如《全知讀者視角》接連上

  映，本片仍憑藉明確的觀眾輪廓與粉絲向題材脫穎而出，充分展現DAY6無可撼動的票房號

  召力。此外，DAY6四位成員也親自投入宣傳行程，上週末更現身戲院舉辦見面會，與熱情

  的My Day（官方粉絲名）一同重溫他們十年來的感動旅程，氣氛溫馨感人。本片也將在本

  週五（8/22）於台灣隆重上映，不僅有2D版本，更同步推出極致沉浸體驗的SCREENX與4DX

  版本，讓粉絲如臨現場、身歷其境。首週入場特典與特殊版本專屬特典也同步公開，絕對

  不容錯過！





  DAY6四位成員晟鎮、Young K、元弼、度云於上週六（8/16）出席位在首爾舉辦的《6DAYS

  》戲院見面會，與台下熱情的My Day一同回顧他們出道十週年的軌跡。只見四位成員以「

  新人演員」自我介紹，讓現場氣氛輕鬆又溫馨，也為這部結合音樂、紀實與劇情的特殊之

  作拉開溫柔帷幕。只見眾人分享本片最讓他們感動的橋段，毫不意外地，眾人都一致提到

  〈Congratulations〉這首出道歌曲。Young K表示：「中間的回憶片段，讓我想起過去一

  路走來的時光。」元弼更坦言在聽到這首歌時，已經忍不住落下眼淚。至於被問到片中哪

  一幕最能代表DAY6的十週年時，元弼也毫不猶豫再度提到就是〈Congratulations〉這首

  歌。



  現場氣氛高潮迭起，當被提問想起拍攝時，腦中所浮現的歌曲是什麼時，Young K則幽默

  提到是尚未發行的新曲，引發現場My Day驚呼。而他最後選擇清唱了〈Time of Our Life

  〉，儘管一度笑場，My Day仍報以最真摯的應援，讓整場活動充滿感動與歡笑。尤其在活

  動尾聲，度云也向所有支持DAY6的粉絲深情致謝：「雖然已經是十週年了，還是要感謝大

  家一直以來的陪伴。我們會一直懷著感恩的心努力生活，而且為了回報大家的愛，我們會

  繼續努力的，以後也請多多指教，我愛大家！」





  值得一提的是，《6DAYS》除了2D版本之外，台灣也將同步上映SCREENX與4DX版本，提供

  觀眾更豐富的觀影體驗。SCREENX版本將結合中央銀幕與左右兩側延伸的三面銀幕，成員

  更將從三面銀幕上現身，讓觀眾在欣賞DAY6目不暇給的精彩表演，同時還能生動體驗到沙

  漠、海灘、懸崖等美國西部廣闊而充滿異國情調的景緻，再透過寬廣畫面展現，以最大程

  度提升觀賞沈浸感。此外，4DX 版本則讓觀眾有如成為DAY6成員般的臨場感，進一步提升

  期待值。從成員親自駕車時的引擎震動、迎面吹拂而來的微風，再到淡雅的香氣，真實呈

  現出DAY6的公路之旅，再配合隨著樂團演奏節奏而律動的動感座椅效果，將帶來與眾不同

  的觀影體驗。眾多南韓觀眾也在觀賞後紛紛表示：「能和DAY6與美麗的星辰一起開懷大笑

  、落淚，真是太棒了！」「就像回顧DAY6一路走來的漫長旅程，看電影時總是心潮澎湃！

  」「是一場視覺和聽覺的盛宴！」「回顧DAY6的十年歷程，既感人又歡樂！」



  為了慶祝本片即將在台上映，台灣片商也順勢公佈「首週入場特典」，只要購買本片第一

  週（8/22-8/28）期間場次電影票乙張，即可憑電影票「不限版本」於8月22日起，至原購

  票影城兌換領取「紙相框膠捲卡片」乙張（五款隨機）。不僅如此，更還加碼贈送特殊放

  映版本的入場特典！只要在各影城開放販售日起，購買本片「4DX版本」或「SCREENX版本

  」電影票乙張，即可q影票在8月22日起，至原購票影城兌換領取相對應版本的入場特

  典。4DX版贈送「哇！4DX工藝A3海報與當週一般2D場次特典」各乙份，SCREENX版贈送「

  肯洽拿SCREENX工藝A3海報與當週一般2D場次特典」各乙份。兩版本海報及當週一般2D場

  次特典數量都不相同且數量有限，都是送完為止，敬請觀眾把握第一時間的蒐藏機會。



  迎接出道十週年的超人氣實力樂團「DAY6」，首部音樂公路電影《6DAYS》，即將在本週

  五（8/22）於台灣隆重上映。本片描述為了慶祝出道十週年，DAY6四位成員——晟鎮、

  Young K、元弼與度云——在圓滿結束世界巡演後，展開一場為期六天的美國公路之旅。

  這趟旅程沒有明確計劃，只有一台車、一群夥伴，以及無盡的前方。起初，旅程像是一場

  輕鬆假期，隨興彈唱、自在駕車，甚至在沙漠中駕著越野車奔馳，感受自由氣息。沿途偶

  遇音樂人，與其暢談音樂，以及意想不到的挑戰接踵而來。他們逐漸在陌生風景中彼此靠

  近，進行真誠對話，並回望這十年來的心路歷程。這場宛如Man in a Movie般的電影之旅

  ，紀錄下DAY6與My Day一同走過的燦爛時光——而這場融合音樂、友情與青春的冒險，都

  將凝聚為他們生命中最重要的旋律。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
