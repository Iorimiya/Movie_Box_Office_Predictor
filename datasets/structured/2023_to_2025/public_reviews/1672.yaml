url: https://www.ptt.cc/bbs/movie/M.1684249822.A.3CD.html
title: '[好雷] 我的幸福婚約～～好看 '
content: '雷文防雷資訊頁




  這部電影其實有滿多可以吐槽的點，但是我還是覺得很好看。



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  電影背景設定在大正年間，有所謂的異能者，用來滅除異形，

  這些異能者通常在痛苦中死去，所以必須要特殊的墳墓埋葬，

  預防他們的靈魂帶著太重的怨念，跑到人間騷動，

  這些被關在奧都城的異能者靈魂，就稱之"蟲子"，

  故事就從有人故意把這些蟲子從奧都城解放出來開始。


  在天皇底下有一群異能者，每個人都有特殊能力，

  其中男主角久堂清霞就是這群異能者的頭頭，性格冷酷，

  所以過去所有許配給他的未婚妻都受不了他怪異的性格，

  最短時間創下三天被未婚妻退婚的紀錄，

  久堂清霞也不太在意那些退他婚的女子們，可能長太帥，

  不怕沒人要的樣子（亂詮釋ing）


  這時候剛好女主角齊森美世是個沒有異能卻很漂亮又溫柔善良的女孩，

  以下劇情根本灰姑娘日本版，她的母親過世的早，

  爸爸又娶了繼母，繼母生了一個女兒，女兒長得很普通，

  卻剛好有個不怎麼樣的能力，媽媽跟女兒聯合起來霸凌虐待美世，

  最後還打了如意算盤把美世嫁給久堂清霞，原本以為三天就會被退婚

  或是被未婚夫殺死之類的，這對母女做夢沒想到，久堂清霞長超帥

  而且兩個人還上演霸道總裁系列的愛情故事，最後可憐的美世

  終於打動冷酷的久堂清霞的心，最後劇情開始離開灰姑娘,,,,,


  原來美世的母親出身名門薄刃一族，而美世其實繼承了家族罕見的能力

  叫做夢見之力，美世母親為了保護美世不受到天皇的荼毒（這裡沒交代清楚）

  所以就把美世的能力封印起來，讓大家都以為美世是個麻瓜,..

  最後薄刃一族的人把美世留在他們部族身邊，但美世想老公....

  特別是聽到未婚夫有難，直接衝到戰場要去救夫，

  也不管自己還不太會用夢見之力


  最後蟲子跑去異能者總部肆虐，幾乎一半的人都被蟲子附身，

  搞得久堂清霞殺也不是，不殺也不是，殺了人就等於殺了自己部屬，

  不殺就是蟲子大作怪，正在久堂清霞殺到好像也快要不行的時候，

  美世出現了，就像超能力被喚醒一樣，在直接衝破異能者部下的結界

  還使出夢見之力？？蟲子好像跟人體分離一樣，讓沒有被附身的人，

  輕輕鬆鬆揮刀就會砍到蟲子，不會砍傷人？？（這裡也是沒交代）


  我覺得這部電影有些特效的畫面做得很好看，特別是清霞去救美世的時候，

  清霞一怒之下使用火的異能，把美世娘家燒光光的效果做得很好看。

  再來就是奇怪的人跑去奧都城解放那些蟲子的一段也是拍得很有奇幻感，

  以及清霞使用異能的時候，臉上出現的圖騰的設定也是頗有奇幻的感覺，

  最後是灰姑娘和霸道總裁的愛情設定，雖然現在大家都在倡導女力，

  但是愛情也不是只有一種面貌，這種設定也是提供觀者另外一種想像，

  只是美世和清霞的愛情讓我想起村上春樹說過：


  人只要發自內心地愛一個人，人生就會有救，哪怕是不能和他生活在一起。


  美世因為清霞而感受到愛情，讓她長期受虐的自卑開始找到自信，

  因為被愛而變得勇敢，在後來面對那個母女的再度霸凌，美世也因為愛着清霞

  而勇於堅持自己的信念，最後還不顧一切衝到戰場要去救清霞，

  沒想到反而救了整個異能總部，美世和清霞因為愛，一個救了自己的自卑

  一個救了自己的冷酷，兩個人的愛救了整個日本，這種愛情很夢幻，但很動人。


  電影的最後還留了一個伏筆，看似還會再拍續集。


  --'
