url: https://www.ptt.cc/bbs/movie/M.1684211803.A.847.html
title: '[好雷] 我的幸福婚約'
content: "台灣場次已經五刷，覺得每次刷都更釐清故事條理和一些用心的小細節，也更喜歡這個文\n本改編的電影作品。\n\n不同於片名專注在清霞/美世的婚約，故事整個架構更昇華到環繞主角的人物情感互動，\n\
  美世/美世母親、美世/保姆花姨、皇子堯人/天皇、清霞/部屬五道、清霞/保姆由里江，\n愛情，親情，友情，兄弟/忠臣之情都在這些主角和周圍人物的互動細膩描寫出來。故事\n\
  一開始的旁白就帶到引發社會動盪的異形，在上位者對於臣子功高震主的描寫也擴展了故\n事的格局，讓作品的受眾更廣。但當然不能不提的，還有導演塚原あゆ子的鏡頭語言，更\n\
  具人味的描繪，故事鋪陳和後面轉折發展，關鍵時刻的角色表情/事物特寫都讓觀看者更\n加共感角色內心情感。\n\nめめ目黑蓮的表情非常細膩，在大銀幕特寫下除了出塵俊美的臉蛋，和渡邊圭祐飾演的鶴\n\
  木新第一次見面，兩人握手時爭鋒相對的段落可以看到他眼角睥睨的抽動，做了斬斷和美\n世情緣決定時滿眶的淚水和哽咽（這裡他連喉結都很有戲），和保姆以及部屬的互動也能\n\
  看出這個長官/從小服侍的少爺讓這些部屬，保姆忠誠的地方，清霞對於親近的部屬/保姆\n是充滿人味的，是讓部屬信任能力強大的長官，會和部屬聊天打鬧，在住所時就是個小少\n\
  爺，會乖乖聽保姆僕人由里江念他，咕噥說不要叫我少爺等等可愛反應，めめ把清霞面對\n親近的人的大男孩面貌詮釋地非常好，也完美駕馭了清霞非常二次元的銀色長髮外貌設定\n\
  ，真的會覺得他就是清霞的化身啊。\n\n我的幸福婚約在被擦掉的初戀和月之圓缺拍攝之後開拍，真的感覺到他演技上急速的進步\n，也了解了為什麼訪問時他說到非常感謝塚原導演的教導，應該是在對於演戲詮釋和角色\n\
  理解的整理都有了脫胎換骨的進步了。\n\n今田美櫻更把楚楚可憐的美世詮釋的讓人心疼，隨時處在驚恐的神情和濃濃的黑眼圈，一\n開始登場的美世旁白說自己只在呼吸，內心只期盼和死去的母親相見的時候就讓人覺得好\n\
  心痛，看到清霞稱讚自己準備的早餐美味忍不住掉淚，說是第一次被人稱讚，就覺得這個\n孩子之前的人生是受了多大的折磨，然後就忍不住跟著美世一起哭出來了，對比之後能在\n\
  清霞的關懷下展開笑容，用著滿滿的愛意看著良人，就覺得美世能跟清霞相遇真的太好了\n    。\n\n其他對戲的硬底子演員，飾演美世後母的演員山口紗彌加光是口語就讓人感覺到強烈的壓\n\
  迫感，這裡導演的鏡頭語言也非常精彩，先讓觀眾處於和美世一樣卑微的視角，鏡頭停留\n在美世低頭擦拭被妹妹朝臉潑過來的茶水角度，接著我們先聽到了讓人毛骨悚然的敲打聲\n\
  ，鏡頭再緩緩移動到餐桌上後母敲雞蛋的動作和問候走進餐廳的美世父親，這裡齋森成員\n自在吃早餐的畫面構圖，完全展現齋森家對於美世的糟蹋和不在意。\n\n而在角色成長的描寫，美世也從一開始低頭問候不敢望向清霞，只能一直道歉的畏縮態度\n\
  ，到後來體會到清霞的關懷愛意，清霞在兩人第一次約會，在咖啡廳對話時鼓勵她說出內\n心想法，找到花姨讓美世和照顧自己的保姆見面，美世從這些地方知道對方是個可以託付\n\
  一生的良人，原本總是配合他人接受被掠奪的事實，在後母繼妹逼迫她放棄婚約時勇敢說\n出自己是清霞老爺的未婚妻不願意放棄。\n\n\n\n\n美世和清霞從彼此孤獨一人的處境，到相互扶持成長，美世為了所愛之人激發了自己家族\n\
  血統的夢見之才，讓在殘殺處境的清霞軍隊能發揮異能砍除蟲的異形擺脫蟲的操控，清霞\n也從原本冷漠防禦的內心，在遇到這個“從頭到尾徹底的怪女孩”，看到美世為由里江著\n\
  想操持家務，和美世滿手做了太多粗重活的傷痕，準備的早餐被誇讚掉下的淚水，和夜裡\n被惡夢糾纏，喊著花姨對不起，流下淚水的模樣之後，找到美世的保姆花姨，傲嬌要美世\n\
  每天準備藥草浴，實則是想修復美世雙手的傷痕。兩人為彼此準備的物品，美世親手編織\n的髮帶，和清霞送給美世，象徵求婚意義的梳子，都是充滿愛意的紀念物。\n\n\n\
  \n\n\n\n這邊也帶到這部電影精緻的美術佈景，不管是和洋華麗的齋森家，古典清幽的久堂家，還\n是天皇養病金碧輝煌的堂所，都選在歷史古蹟實景拍攝，以及精緻的場景擺設物品都可以\n\
  感受到製作的用心，電影場刊更描述美術組在準備角色衣著時為了考量還原故事架空仿造\n的大正背景，還特地找到真正的古董和服作為角色服裝。\n\n\n電影為了異能打鬥場面做的特效也非常出眾，沒有以往印象尷尬滿滿的漫改電影生硬感，\n\
  清霞在齋森家營救美世沿路走過發動異能燃燒房屋，或是發動降下雨水的異能場面特效都\n非常華麗。最後小隊的打鬥戲導演花絮提到想營造真實打鬥處在其中人物的慌亂場面也經\n\
  營的很好，塚原導演更在打鬥場景中帶入了隊員彼此的羈絆，鏡頭在清霞和部屬打鬥時特\n寫了部屬先前和隊友展示的剛出生孩子照片，讓清霞在不得已的殺戮中語帶歉意對部屬說\n\
  對不起，彼此有深厚感情隊友面對互相殘殺的心痛，在五道感染蟲的異形，為了不傷及隊\n長而手刃自己，這裡塚原導演特寫了清霞心痛慌亂的神情，和五道流下的眼淚，對於觀眾\n\
  來說渲染力都非常強大，也是我哭到不行的一幕。\n\n而這部電影的配樂也扮演了稱職的角色，立山秋航恢弘奇幻的弦樂和和式樂器編度，不論\n是製作，拍攝都非常用心，電影在めめ的silent完結社會現象大熱時在日本上映，好的作\n\
  品抓住好的時機，也達到了26億的高票房，身為粉絲也希望在台灣上映也能有好的回報率\n了，推薦！\n\n--"
