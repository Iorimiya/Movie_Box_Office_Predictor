title: '[新聞] 目黑蓮 主演電影《我的幸福婚約》特別專'
content: '新聞網址：


  由日本團體Snow Man團員目黑蓮與女星今田美櫻共同出演的電影《我的幸福婚約》5月12

  日正式在台上映。改編自顎木亞玖彌暢銷輕小說，小說及漫畫累計發行700萬冊，以唯美

  、奇幻的和風灰姑娘故事受到廣大讀者喜愛，以「文明開化」的近代日本為概念的架空世

  界為故事背景，描述出生帝都名門望族的長女齋森美世（今田美櫻 飾）由於生母早逝，

  自小就被繼母與同父異母的妹妹如同僕人般虐待。美世捨棄一切，每天刻苦忍耐，雪上加

  霜的卻是她被下令要與傳聞中冷酷無情的將軍，久堂清霞（目黑蓮 飾）進行政治聯姻的

  故事。


  台灣在上週進行包場試映後，不少觀眾讚嘆導演塚原亞由子的拍攝手法，以及編劇菅野友

  惠恰到好處的劇情推進節奏，而目黑蓮與今田美櫻的互動更是讓影迷們直呼「太可愛了！

  」。而藉由這次在台上映的機會，本網也與主演的目黑蓮進行一段採訪，除了分享他自己

  拍攝的趣事外，也稍微談論了自己的戀愛觀！？同時也向他傳達了台灣粉絲、影迷們對於

  電影上映的期盼！


  --'
