url: https://www.ptt.cc/bbs/movie/M.1768410995.A.658.html
title: '[SD雷] 《沒好婚姻》演員風格強烈派？'
content: '認認真真沉澱一天後，那種觀影後奇妙的感覺，有了個出口，原來是每個演員的風格都都

  很強烈，沒有人要當背景或白噪音（一般來說除了男女主角，其他角色應該都要很忙、流

  動的）；都是重點就沒有了重點，但

  這種取捨，也許更貼近現代人的既視感；不曉得是演員內心戲沒有堆疊起來，還是我眼濁

  ，或者少了一種〔曖昧〕嗎？


  演得非常直白，但又少了《丹麥女孩》那種來回拉扯（但真實的人生節奏好像其實是這部

  電影的樣子）


  回到〔戲〕是什麼？又該是什麼樣子這件事....就會好像在看法學歌劇。致敬了很多電影

  橋段，


  噢！很像火力不夠的氬焊，熔了但沒融

  （BTW近期看的電影都有這樣的感覺）


  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  AMY根本就是致敬fat Amy的那種荒唐腦，這不得不吐槽，竟然沒有昇華～～～

  觀影中一直出現netflix 《人生切割術》晚餐的場景、《Menu五星主廚》的氛圍....


  電影的剪片真的好重要耶，剪片才是導演吧！原本看預告以為的劇情，看正片完全不是那

  個邏輯，李安的剪片是李安有在旁邊叨叨念念嗎？諾蘭的呢？他們到底如何配合的～～～

  ～


  這部片蠻推薦給所有要結婚的人去看耶，太多莫名其妙的想法正是婚姻裡會遇到的鬼故事

  ，比如（1）婚姻中誰犧牲，最後當有機會都不要犧牲的時候，又一定會有一方需要些微

  的退讓（沒有雙贏嗎？明明就有雙贏的方法，而且他們也做到了，但是在觀念上就會卡住

  。可能敗給了人腦的退化）

  （2）格局。思維較細膩的一方通常更在意另一半若狀況不好，也不要分享自己的好消息

  給對方，可能因為女性潛意識有容易忌妒的buff自然也不想帶給他人可能引起忌妒的心理

  ，然後讓事情變得更複雜。

  （3）想搞事。若把歸因丟於科學，在這部電影中，妻子是非常感性那一派，而且很愛吃

  糖，很愛挑戰刺激，甚至知道自己可以用過敏體質來測試；而老公是理性那派，用數據來

  訓練兩個小孩，雖然老公不過度介入老婆的感性，但老婆可能會為了獲得更多關注而故意

  失控（食用大量的糖），這一直是一種未解之謎〔既使是相愛的兩人，某一方依舊可能會

  想不斷搞事〕

  （4）生存欲大於親情。一直自覺被打壓的一方，當有機會狀況反過來時，下手只會更狠

  。（女方後期是更肆無忌憚的，而男方在一開始甚至餐廳虧錢都讓女方繼續圓夢；最後蛋

  糕簽離婚協議書時腦子也都很清醒，男的覺得會給她腎上腺素，甚至她可以隨便亂簽名，

  男的都不疑有他）

  （5）受害者反撲。里歐最後不想分享他拯救了一隻擱淺的鯨魚時，女方已經站在〔你是

  我的（物品）〕的姿態，因此婚姻到最後自覺被打壓的人的反擊是非常大的，她以被害人

  自居，這也是婚姻中最大的鬼故事。


  最後結局竟然是被炸死（AI沒安裝到氣體偵測嗎？爛！）不是一個很舒服的交代，也許把

  小孩拉回來，或是一起去找小孩的這種溫馨童話結局會不會更令人舒適呢～


  整部片有跟Ai科技連結到，蠻好笑的，deepface都出來了；欸～看電影還是要有經典的藝

  術風格啊！這樣直直白白很不美耶.....《那個男人來自地球》就算預算很少，劇情安排

  上也有詩意美感，可以參考一下嗎......我相信《彗星來的那一刻》也沒多高，剛查了一

  下《奪魂鋸》預算也很低耶......................


  電影史不會被提起，但婚姻觀／心理系可能會。


  --

  so deep 自創的一種感覺陳述，氬焊電力不夠的狀態，熔了但沒融

  而且他主要用對話直接破題〔誰來犧牲〕蠻好笑的，但是重複的技法用太多次，戲就不見

  了。魔術師在舞台上一直用同一種深度與原理表演，觀眾可能會越來越少吧...整部片給

  我的感覺就是可惜，

  也有可能這如同台灣有一陣子要把舞台劇表演方法放上電視劇（又或者是把電視劇鏡位跟

  節奏放上舞台劇）那樣，還在探索中～'
