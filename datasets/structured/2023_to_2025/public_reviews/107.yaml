url: https://www.ptt.cc/bbs/movie/M.1760515551.A.0B8.html
title: '[微好雷] 沒好婚姻'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n先前預告看到男女主角就決定進電影院觀賞。\n\
  雖然版上為數不多的觀影評論一度令人有些卻步。\n\n整體來說這種戀愛模式不曾也不會出現在我身上，\n大概亞洲人應該也很少，所以我根本上不太能理解，不過拍電影就算了。\n\
  \n男女主角的演技還是一樣精彩，整篇故事也完整的，框架也不大。\n男女主角的人格特質盡顯在電影中，對於生命中各個面向轉換，\n職場，家庭，子女，愛情的取捨，付出，悔恨，都顯露在每一次的爭吵。\n\
  每對男女都有屬於自己相處方式，爭吵的模式也是，\n其實男女主角很懂得彼此，只是最後都被自己所打敗，\n不管是男主角走不職場上的失敗，還是女主角放不下職場上的成功，\n\
  就像其中一句台詞，好像是說 婚姻當中註定有一方就要犧牲。\n但不管如何，就算有一方得到了自己想要的，注定也是要失去其他的(就算是不想要的)\n\n一對子女的存在也很好的帶出了主角們的人生軌跡變化。\n\
  子女們是第一手當事人感受到了男女主角婚前婚後，在家庭地位上的改變，\n最後從他們決定要離婚的時候的反應，也知道其實在子女們的眼裡，\n兩個人早就往不同方向在前進，所以忍不住會計較，忍不住會互相嘲諷，\n\
  因為離不開又想要，說不出口又不想承認。\n\n最後結局的黑色幽默，倒是令人會心一笑。總算是實現了夫妻兩個人的諾言。\n雖然偏向串流片，電影院場次少，討論度低，但是演技派的電影看起來就是舒服\n\
  總體來說還是個不錯的觀影體驗，也沒有遇到一直玩手機聊天吃東西的觀眾\n以上\n\n--\n\n    給我跪到天亮!!!\\_/\n  ●/\n <▊    \
  \ ●\n  ||     ▊=\n         >>  女友大人永遠是對的..b\n\n--"
