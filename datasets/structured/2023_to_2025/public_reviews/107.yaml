url: https://www.ptt.cc/bbs/movie/M.1760003041.A.9DF.html
title: '[微好雷] 沒好婚姻'
content: '對男女主角的印象一直停留在奇異博士和大熊餐廳，沒想到這次可以看到兩人的組合，化

  學反應意外地新鮮

  電影對婚姻生活的細節描繪得很細膩，表面看似和諧的婚姻，實際上那些瑣碎的日常、起

  伏不定的工作狀態，以及一肩扛起的育兒壓力，都讓壓抑、不滿與憎恨的情緒暗暗累積

  夫妻之間的鬥嘴逐漸帶著攻擊性，直到親友聚會那天全部爆發，色調和氛圍也變得黑暗緊

  繃，場面也是張力十足！


  夫妻之間的對話也藏著不少地獄梗，整體看得算輕鬆愉快，比較可惜的是，夫妻朋友圈的

  角色鋪陳稍嫌單薄，如果能多花點篇幅在他們身上，應該能替電影加分不少

  不過，那些奇特的相處模式和意料之外的發展，依舊替電影增添了不少亮點


  整體來說，這部雖然不算完美，但誠實呈現了婚姻的真實與殘酷，看完後還是會忍不住思

  考「關係到底該怎麼走下去」，還蠻值得一看


  --'
