url: https://www.ptt.cc/bbs/movie/M.1741594158.A.C0D.html
title: '[負雷] 殺人預言 不用浪費時間'
content: '整部電影最精彩的片段大概只有預告...


  劇情鋪陳非常冗長

  而且無聊到好幾次快睡著

  演到很後面才開始有一些動作片段

  但都蠻短的沒有到非常過癮


  最讓人不解的是

  為什麼不把男主角的動機交代清楚

  鋪陳鋪半天

  最重要的核心動機什麼也沒說

  只看到男主角拼了命要為那個人渣弟弟討公道

  但他有值得大家這樣奔波嗎？？？


  這部電影如果有打算拍續集的話

  那我會考慮去把後續劇情看完

  但如果故事就在這裡結束

  那大家真的不用浪費時間去看這部...


  --'
