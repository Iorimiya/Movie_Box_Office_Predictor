url: https://www.ptt.cc/bbs/movie/M.1740895094.A.76C.html
title: '[負雷] 殺人預言'
content: '這是一部懸疑韓國電影，觀看前對這部沒有任何了解，預告片也沒看


  果不其然踩雷了


  最大的問題是主角，主角是前黑道


  黑道主角其實不少見，但這種主角通常會刻劃的有種俠義感，韓國自己的電影就常有


  而本作的主角真的就爛人


  弟弟到處惹事生非，而男主就只會放任，但有人敢傷害他弟就會打到他非死即殘


  真的愛弟弟就該管好他，而不是當一個幫親不幫理的雙標狗


  還有作為一部懸疑片，雖然有反轉但也是不怎麼樣，沒有意料之外情理之中的感覺



  打戲倒是不錯，這也是我喜歡韓國片的原因，打戲都有種暴力感，爽快又不至於太血腥，可

  惜打戲不是很多


  如果打戲很多，就算劇情不怎麼樣我也會給予高評價，比如另一部韓國電影《黑帶出勤中》

  就是這種類型，不過黑帶連劇情都比這部有趣就是了




  總結：主角讓人觀感很差，劇情也不怎麼樣，打戲也不多，整體我覺得不行











  --'
