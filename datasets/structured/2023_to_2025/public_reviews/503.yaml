title: '[  雷] 殺人預言    又被片商騙了'
content: '以為有河正宇應該不錯


  沒想到劇情超無聊==


  片商主打動作戲


  但根本就只是一群流氓在打架而已


  不僅打戲少也沒什麼特別的亮點


  這部大概和鄭雨盛的保護者有得拼


  不過我覺得保護者略好看點……









