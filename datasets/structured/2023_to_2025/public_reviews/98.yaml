url: https://www.ptt.cc/bbs/movie/M.1760589302.A.2DE.html
title: '[微 好雷]奇幻導航'
content: 'A big bold beautiful journey  奇幻導航


  版上關於奇幻導航的文章只有3個 --> 1情報  2贈票  3請益

  今天想看電影，搜尋附近電影院的片單只有這一部吸引自己、看預告是自己喜歡的題

  材(穿越)，便買票進場。


  整廳只有自己一位觀眾，所以最壞的情況是不會發生拿手機出來被打的情形…

  以下有劇情雷













  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  男主角大衛(柯林法洛飾)、女主角莎拉(瑪格蘿比飾) 是素昧平生的兩個人

  電影一開始是大衛去租車(我晚8分鐘入場，最開始幾分鐘的畫面沒看到)，租車時被問到

  許多奇奇怪怪的問題，最後妥協於「需要有導航的車子」才順利租到。

  接著男女主角參加共同朋友的婚禮上相遇，大雨中舉行的婚禮莎拉看到留鬍子帥氣的大衛

  ，使出勾人的眼神與微笑，後來婚禮餐會上兩人開始有交談一下、在走廊上出來透氣又遇

  到，這時聊著聊著互相挖苦「對你/妳而言，至今還單身想必是毀過不少人的感情吧!」

  很快的莎拉突然蹦一句「你想不想娶我?」讓大衛相當錯愕，這麼快就進入嚴肅的問題，

  不過問題一下子結束，莎拉去跳舞了。


  幾天後，習慣一開人開車獨旅的大衛，汽車導航竟然自己發出聲音問「你想參加一場奇幻

  旅程嗎?」

  不明究裡的他與導航來回問幾次，為了劇情走下去當然是選擇接受參加。


  導航導到一間速食餐廳、指示他點特定漢堡，坐下咬一口漢堡的大衛，竟然看到前前方座

  位竟然是獨自吃漢堡的莎拉。莎拉也看到大衛便移動餐食來跟大衛一起坐，聊天中得知莎

  拉也是習慣獨自旅行出遊的人。吃完離開去取車時，兩人有依依不捨的感覺可是都沒有說

  出來，住在相同城市的彼此似乎又要再次分離。各自坐上車子，汽車導航故意讓莎拉車子

  發不動，順理成章地兩人坐上同一部車子，便一路順著汽車導航的指揮，開始一個個突然

  冒出的門(時空門、任意門)冒險。


  車上聊天，回到為什麼單身的話題，莎拉直白地說「因為我會劈腿，我是想跟男人在一起

  的，可是另一半的自己不安定、想找調情的對象。就這樣交往、劈腿、被發現、單身…循

  環」，這時大衛還沒有說清楚自己的感情狀況，只是用「還沒遇到值得追的對象」呼攏過

  去(個人覺得柯林法洛在本劇演出的表情呆版、苦悶；瑪格蘿比外型本身就亮麗、表情較

  為生動)。然後開始電影主題任意門的冒險，突如其來在森林、在野外、在高速公路下冒

  出的任意門其實是穿越回兩人過去分別喜歡、深愛、有記憶的過去，例如大海邊風景絕佳

  的燈塔、存有母親回憶的美術館、高中舞台劇與喜歡的女同學、母親過世的醫院(母親過

  時的同時她正在跟教授上床)。

  (劇中兩人現實年齡大約40歲，穿越過去的人物看他/她的年紀仍是1、20歲。)


  其中一個任意門，他們看到門面就知道將會遇到什麼情況，硬著頭皮下還是打開面對。原

  來此門連接的是大衛&莎拉最近一次交往的對象、場景為某餐廳(咖啡廳)。大衛與論及婚

  嫁的前女友坐一桌，前女友表情哀苦的退回大衛給她的訂婚戒指並問為什麼要反悔?不能

  繼續一起嗎? 大衛說「因為沒意義沒目標了，我很愛你，很喜歡追求妳的過程、充實我們

  的生命。可是終於論及婚嫁後，這個滿心期待的過程消失了、一覺醒來覺得無法繼續走下

  去。」(這裡才終於知道大衛單身的原因)；另一邊莎拉與前男友坐一桌，男友歡喜地翻閱

  冊子，一直述說未來的規劃，莎拉只是應付聽著、單字回應著，空洞無感情置入，然後她

  對前男友說「我不能跟你在一起，我本來只是想不帶太多感情地找個相同的伴，沒想到你

  真的愛上我了，因為你太愛我了而我會傷害你所以我不能跟妳在一起。」前男友不可置信

  問「妳因為我太愛妳而不要跟我在一起?」


  愛情觀扭曲的兩人，在穿越時空回到過去記憶深刻的片段，也修補年輕時沒說出口的話與

  錯過的遺憾，可是仍無法跨出舊有感情想法、彼此駕車分離也不再理會導航給她們的關卡

  提示，逕自回家。

  片尾，大衛回到獨居房屋，在門前路邊樓梯坐著喝飲料，莎拉突然出現在眼前。

  「妳怎麼知道我住這裡?」大衛狐疑道。

  「導航跟我說的。經過…我覺得我們可以在一起試試看…」

  大衛會心一笑(表情還是呆板) 「妳願意再幫我開一扇門嗎?」

  兩人笑著，走進身後真實的房門。

  -----------------------------------------------------------------------


  心得

  劇情算是老套，可是原創劇本電影在現代來說蠻難得的，可以不用看大量的特效與動畫，

  只純粹感受演員演技發揮與體會劇情深度。個人認為有一點年紀的人來看可以較為體會劇

  中要講的人生道理，不然會覺得沉悶。可是劇中道理講得太多、複雜，又讓人一時理解不

  出而沒有共鳴。

  現在不結婚的時代，單身男女也越來越多，單身很有自由性想幹嘛就幹嘛，可是就像劇中

  第一扇時空門男主在最喜歡的燈塔頂眺望大海時他說「越是絕美的風景下會感到異常孤寂

  」。想要有個伴但怕傷害別人作罷，電影歌曲 I love you ,  I’m sorry 也道出男女主

  角兩人的心境吧!


  最後要偷渡瑞秋麥亞當斯的電影

  這部奇幻導航的預告片剪得很吸引人，讓我聯想到超正+鄰家女友感十足的瑞秋電影，這

  個才是我會去看這部的主因。

  瑞秋麥亞當斯的時間穿越系列(時空旅人之妻、午夜巴黎、愛重來、真愛每一天，沒有連

  貫性，要先看哪一部都行)，感情在現在與過去交織。重點是不要一昧的追求幸福，那樣

  只會讓幸福快速走味。其實只要在平凡簡單的生活中發掘美好值得留念的事物，感情才會

  走得較為持久且常印於心。


  --'
