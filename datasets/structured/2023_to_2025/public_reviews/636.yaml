title: '[好雷] 窺鏡'
content: '看之前沒先看評論，但看完很喜歡

  懸疑、人性題材很有不錯看，結局轉折令人意外

  朴智賢、曹汝貞演技不怯場，超強！


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  很喜歡他們兩個在浴室鏡子前後的視角、對話

  美珠因為被背叛懷恨在心的復仇

  再回到兩人以前在學生時期交往的事情

  整件事一層一層被撥開，喜歡這樣的節奏


  有被大尺度嚇到！先佩服朴智賢，身材超好...

  在美珠第一次與成鎮發生關係時

  秀妍在鏡子後面大喊的不是自己未婚夫而是美珠的名字

  ：「美珠...你不是很討厭男人摸你嗎？」

  我才搞懂秀妍、美珠的女女戀是真的戀！

  而秀妍對成鎮的感情，只是不喜歡有事情不在自己的掌控之內


  不過最後還有幾件事沒解釋到

  1.秀妍還繼續跟成鎮演夫妻情的用意有點不明白

  2.整件事都報警了，警察調查就這麼結束？

  3.秀妍媽媽，怎麼可能沒問怎麼突然不見

  4.最後美珠被關在倉庫，成鎮知道嗎？


  最出戲的是秀妍都那樣了在倉庫還是穿著高跟鞋XD

  但劇情真的很精彩，有空再去看原作


  --'
