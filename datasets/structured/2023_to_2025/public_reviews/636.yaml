title: '[無雷] 窺鏡，有優有劣'
content: '目前正在院線的這部窺鏡


  是韓國是翻拍十幾年前的西洋片


  我沒有看過原本的片子就跑來看


  優點：


  因為沒有看過原版，覺得劇情蠻有意思的，反轉算合理，大結構也沒有問題


  朴智賢演技再突破，非常勾人，煽情的床戲拍得好


  缺點：


  除了朴外，最大缺點是其他角色刻畫不足，張力不夠，偏平板兼淡而無味，雖然知道各自的動機，但不合常理之處也蠻多的，可能需要一點想像力



  建議沒有看過原版，甚至不知道這部片在講什麼的人前來觀看


  分數6.8/10


  -----

  Sent from JPTT on my Google Pixel 6a.


  --'
