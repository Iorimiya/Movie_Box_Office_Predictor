url: https://www.ptt.cc/bbs/movie/M.1471631740.A.407.html
title: '[問片]  郵差送信 偷窺鏡 10年以上老片'
content: '小時候在電視上看的電影


  只記得有一個郵差送信到一個住址


  但是那個住址早就放滿很多信在門口


  郵差想可能沒人住 就進去一探究竟


  結果進去發現有偷窺鏡


  可以看到裡面的人在幹嘛


  小時候看的，我現在很想看他到底在演什麼


  大概有10年～15年以上


  謝謝!


  --'
