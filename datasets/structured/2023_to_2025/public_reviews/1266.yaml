url: https://www.ptt.cc/bbs/movie/M.1700578517.A.E06.html
title: '[負雷] 我們從末日開始 不知道末日在哪'
content: '看簡介還以為是甚麼硬核末日電影


  末日時一個新手媽媽剛生下孩子 爸爸就出去找食物不見了 然後媽媽艱難求生之類的


  實際看了之後才知道完全不是這麼一回事


  更接近公路旅行作品 主角一路旅行看盡壯麗山河風光這樣


  一路上遇到的都是好人　最像末日的就是主角媽媽自己科科



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  首先生孩子是在醫院生的 末日時代還有一個床位整個醫療團隊幫你接生喔啾咪


  生完護士還記得提醒她填寫出生資訊給政府登記喔啾咪


  然後倫敦要末日了 老公開車載她回鄉下公婆家 末日了但是很輕鬆就開到了喔啾咪


  到了公婆家她就整天在家裡帶孩子 帶煩了就出去抽菸 等公婆丈夫去覓食回來


  然後公婆死掉了 她就帶孩子住進政府避難所 老公自己去外面想辦法喔啾咪


  去避難所還有媽媽團體幫她帶小孩 瞬間交到好閨蜜搞百合喔啾咪


  避難所被暴民入侵 暴民很好心的的載她們一程 想上車就上車 想下車就下車


  不愧是英國暴民 這麼有禮貌的啾咪


  接著跑去好閨蜜的姊妹辦的人民公社 吃飽穿暖後批判人民公社不回倫敦幫忙壞壞


  人民公社首領就贊助她全套裝備回倫敦 中間她還搶了一對老夫婦的車子開走


  回倫敦後大家都在幫忙重建就她先跑回家裡清點財產


  然後就這麼剛好丈夫也回家了！大團圓ＥＮＤ！


  導演說這部電影是想讓觀眾知道媽媽的辛苦 但說真的我看完這部電影要說能學到甚麼


  那就是末日時代你看到一個帶嬰兒的年輕媽媽向你接近 肯定非姦即盜！


  很久沒看到這麼忘恩負義不知感謝的主角了你知道嗎？


