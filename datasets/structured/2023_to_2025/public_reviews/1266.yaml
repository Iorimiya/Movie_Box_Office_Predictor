content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  單純想看茱蒂康默的影迷有福了，本作能提供滿滿的茱蒂。


  不過第一次看見預告時還以為是類似沒有科幻要素的最後生還者的末日生存作品，結果相

  差甚遠。本作步調平緩，主角的冒險幾乎就是折返跑，災難也相當樸實，沒有想要解釋原

  由。就給觀眾靜靜的看著主角經歷分離、逃亡以及歸寧*歸於平靜，想看茱蒂的就去看吧

  。



