url: https://www.ptt.cc/bbs/movie/M.1742629060.A.601.html
title: '[普好雷] 型男主廚三星夢：巴黎篇'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  原名《天才主廚餐廳》，後來上串流時改為《型男主廚三星夢》的日劇是男神木村拓哉在

  2019年推出的作品。大獲好評之後，劇場版的籌備計畫就應運而生，不巧碰上疫情，才會

  相隔5年才千呼萬喚始出來。不論是木村拓哉的粉絲，還是日劇的影迷，《型男主廚三星

  夢：巴黎篇》都絕對不會讓大家失望。



  自從「Grand Maison東京」在日本榮獲米其林最高榮譽「三星」肯定之後，接著又歷經疫

  情衝擊與大企業對抗等種種危機，早見倫子將主廚身分交棒後輩，跟隨昔日夥伴尾花夏樹

  ，兩人重返法國料理發源地「巴黎」開設新店「Grand Maison巴黎」，再度為了米其林三

  星奮力一搏，並目標成為首位獲得米其林三星肯定的亞洲主廚。尾花下定決心，向昔日恩

  師承諾：「倘若下次評選無法取得三顆星，就將辭職離開法國。」究竟他能否與夥伴們，

  再度攀上米其林的星級巔峰呢？



  既然劇情以米其林摘星為主題，過程中不免出現針對米其林評選所斤斤計較的餐廳管理。

  不管是擺盤的比例，還是桌椅、餐巾的擺放，甚至為了配合料理的特色與火侯，內外場必

  須搭配並練習好餐具加熱的溫度與上桌的速度，一點都不得馬虎。雖說《型男主廚三星夢

  ：巴黎篇》為劇情片，但劇組也請來首位在法國奪得米其林三星的亞洲主廚小林圭擔綱本

  片的料理監修。想必除了料理本身之外，對於經營米其林餐廳要有哪些講究之處，小林圭

  主廚都會一併指導。



  電影後半開始積極為了摘星而努力的片段，不禁讓人想起講述台灣米其林主廚江振誠回台

  源起的紀錄片《初心》。《型男主廚三星夢：巴黎篇》裡，尾花夏樹的恩師曾經認為他已

  經失去料理的初心，甚至為了摘星決定拋棄餐廳內一切屬於外來文化的元素，卻忘記這才

  是自己最初選擇法國料理的原因。江振誠在紀錄片中談到自己為何在新加坡摘星成功後，

  會毅然決然回到台灣時說：「完美的最後一塊拼圖不是功成名就，而是放下。」恩師要尾

  花夏樹放棄對法國的執念，回到日本，但他不肯，不過，尾花夏樹還是有放下什麼，才能

  讓他拾起成功，那便是不懂傾聽別人的固執與對人的不信任。



  日劇的第一集從尾花夏樹風光地在巴黎拿下米其林二星開始，沒多久就急轉直下，安排一

  場讓友邦元首吃到過敏食材的餐會，讓主廚不但再也無法在法國立足，就連日本國內都稱

  尾花夏樹為「國恥」，顏面掃地。《型男主廚三星夢：巴黎篇》的敘事架構仍舊遵循日劇

  的模式，電影同樣從倫子與主廚在巴黎開設的新店獲得米其林二星開始，但在競爭更為激

  烈的法料發源地，光是「守住」二星並不足夠。沒想到，屋漏偏逢連夜雨，尾花夏樹又搞

  砸一場重要的大型晚宴，讓故事再次從谷底危機開始述說。



  當年日劇前往巴黎拍攝已經是創舉，電影版直接訂為《巴黎篇》，語言當然是全片重要的

  主題。除了主要演員們為了應付與日文台詞量差不多的法文台詞，必須接受高強度的法文

  訓練之外，「語言」本身也象徵尾花夏樹的餐廳是一文化揉合之地。在電影版裡飾演甜點

  主廚的玉澤演，除了法文之外，全程講韓文，初期不禁讓觀眾好奇，他與主廚自顧自地一

  人說韓文，一人說日文，難怪溝通會有問題。但是，隨著角色甜點主廚瑞克元的債務問題

  逐漸明朗，觀眾也得知，其實在異地打拼的他們，為了與來自世界各地的同事溝通，彼此

  都會對方的語言。



  尾花夏樹在決定放手一搏之後，由倫子邀請其恩師來餐廳用餐最後一次，那頓被美食評論

  家琳達稱為「奇蹟」的晚餐，呈現方式非常令人感動。畫面以主廚的團隊如何備料、料理

  與擺盤呈現，搭配上調理過程中會出現的各種悅耳聲響，以及琳達以其精煉且精準的文字

  ，描寫每一道料理帶給她的感動與感覺。每一句比喻，都彷彿讓觀眾一同感受她舌尖上的

  食材一般新鮮。就像琳達所說，享用美食的同時，吃進嘴裡的是全世界大地所孕育的生命

  ，而坐在電影院裡看著《型男主廚三星夢：巴黎篇》的觀眾，則透過琳達的文字與尾花夏

  樹在大銀幕上所「創作」的料理，一同享用這頓令人感動的晚餐。



  即便是熟悉日劇的影迷，在觀看本片時，也會發現尾花夏樹明顯的不同，最顯而易見的是

  他的一頭金髮。據說木村拓哉在進行角色準備時，單純覺得他肯定是位不願意被人說「這

  麼多年過去，還是一模一樣」的角色，所以就大膽地漂金自己的頭髮。沒想到，居然剛好

  與料理監修小林圭「撞髮」，意外地致敬首位在法國取得米其林三星的亞洲主廚。可是，

  除了造型之外，尾花夏樹在個性上也有所精進。在下定決心之前，他與倫子在當年承諾對

  方的橋上，再次做出約定。倫子說：「當初你幫我拿下星星，現在換我幫你了。」這是互

  為伯樂的惺惺相惜。



  沒錯，在電影一開始時，他乍聽、乍看之下都還是那個固執、堅持己見的霸道主廚，但隨

  著劇情推展，我們才知道原來尾花夏樹只是「刀子嘴，豆腐心」。包括他一開始對倫子的

  批評與口不擇言，其實是由於她確診後失去味覺，因此尾花夏樹才會不放心將料理的味道

  託付給她，以及他找來瑞克元並不是出於亞裔認同，而是打從心裡欽佩對方的甜點功力。

  這些與同事間的細膩互動，在《型男主廚三星夢：巴黎篇》短短兩小時內也都能清楚看到

  。



  尾花夏樹與同事間的關係改善絕對是全片最重要的轉折，他要所有廚師發揮創意，將自己

  的文化納入到料理中，一起試菜，有任何意見勇於提出。最後在大家腦力激盪，集思廣益

  之下，產出脫胎換骨版的新菜單。某天與倫子徹夜鑽研新菜的過程裡，尾花夏樹表示自己

  還是很喜歡壽司、生魚片、烏龍麵這些日本料理，但當初讓他選擇法國料理的原因就是其

  能夠海納百川，吸收世界各國的文化與元素，並不斷改良與進化。最後在「團結」的力量

  下，尾花夏樹成功奪得米其林三星，完成這場勵志的美食之旅。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
