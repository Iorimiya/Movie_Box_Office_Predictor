url: https://www.ptt.cc/bbs/movie/M.1742306536.A.930.html
title: '[新聞]木村拓哉<型男主廚三星夢:巴黎篇>首染金髮'
content: '新聞網址：



  日劇原班人馬全員回歸，打造色香味俱全美食饗宴的日本話題強片《型男主廚三星夢：巴

  黎篇》，即將在3月28日於台灣盛大獻映。木村拓哉睽違五年，再度化身天才主廚「尾花

  夏樹」，向世界級米其林三星邁進。劇組本次還遠赴法式料理發源地「巴黎」實景拍攝，

  不同拍攝環境且必須展現出「巴黎」風格，讓木村拓哉苦笑直呼：「我真的覺得不可能做

  到！」也因為在巴黎拍攝，本片法文台詞量幾乎與日文台詞量相當，讓木村拓哉、及川光

  博、澤村一樹等主演群們都紛紛苦喊是一大挑戰，為此他們還接受高強度法文訓練，每每

  拍完都壓力大到狂飆汗。值得一提的是，本系列已經許久未與觀眾見面，考慮到尾花這角

  色在這些年的變化，木村拓哉也決定放膽改變，首度嘗試漂髮，化身金髮型男主廚，沒想

  到這一染，卻意外與擔綱本片料理監修的米其林三星日本主廚「小林圭」巧合撞髮！





  延續日劇時間線，透過大銀幕呈現最道地法式風味的日本話題新片《型男主廚三星夢：巴

  黎篇》，重返主角尾花夏樹與早見倫子的初遇之地「巴黎」，描繪他們立志在法式料理之

  都攀上米其林三星巔峰。為此，劇組特地遠赴巴黎實景拍攝，不同的拍攝環境，讓木村拓

  哉坦言相當緊繃，尤其他被要求必須從裡到外展現出「巴黎」風格，他苦笑直呼：「我真

  的覺得不可能做到！」他並分享：「在巴黎拍攝，等於是你必須像巴黎的居民一樣存在。

  不僅是與人之間的情感交流，所有的事情都必須遵循巴黎的方式，這簡直是無理要求，就

  像要一個不會飛的人學會飛一樣。」本來十分苦惱的他，看見身邊不放棄、努力著的工作

  人員，讓他心態轉變表示：「他們從來沒有放棄，正因為這不只是我一個人的意志，而是

  大家的努力，我才能克服這一切。」



  由於本片將舞台設置在巴黎，因此本片的法文台詞量，幾乎跟日文台詞相當，讓主演群之

  一的及川光博笑道：「我一度想著哪有那麼多字的日本電影？」演員們為此都接受高強度

  法文訓練，從ABC開始一個個字母練習，十分有難度的挑戰也讓木村拓哉表示：「訓練的

  強度超乎想像，我們只能不斷重複練習，然後在正式拍攝時呈現出來。每次拍攝結束後，

  衣服內側都被汗浸透了！」





  將人氣日劇搬上大銀幕的《型男主廚三星夢：巴黎篇》，繼劇集播畢後，在歷經疫情，相

  隔五年再度與觀眾見面。木村拓哉思考著角色在這段時間的變化，並表示：「當時我就在

  想『尾花這傢伙現在應該是什麼樣子呢？』以尾花夏樹這個人來說，他絕對不會是一個被

  形容為『還是跟以前一模一樣呢！』的人吧。作為在巴黎生活的日本人，我想說『是不是

  該放開手腳試試？』於是就鼓起勇氣，人生第一次把整頭給漂金了！」沒想到這一染，卻

  意外與擔綱本片料理監修，同時也是首位在巴黎拿下米其林三星的日本主廚「小林圭」撞

  髮，也讓木村拓哉驚訝表示：「我知道在巴黎有位拿到米其林三星的日本主廚，但我並不

  知道小林圭的長相；結果在試裝結束後，我才突然想到要搜尋圖片，當下差點嚇到手滑把

  手機摔下來。」他更笑著分享兩人相見時的狀況：「當我真正見到小林主廚的時候，覺得

  超級害羞，我們還互相盯著對方的頭看了一下呢！」



  這部集結《半澤直樹》製作人、《LAST MILE：全面引爆》導演、《王者天下》編劇豪華

  製作陣容，在日本上映後勇破40億日圓票房佳績的最新話題強片《型男主廚三星夢：巴黎

  篇》，即將在3月28日於台灣盛大獻映。本片劇情描述自從「Grand Maison東京」在日本

  榮獲米其林最高榮譽「三星」肯定之後，接著又歷經疫情衝擊與大企業對抗等種種危機，

  早見倫子（鈴木京香飾演）將主廚身分交棒後輩，跟隨昔日夥伴尾花夏樹（木村拓哉飾演

  ），兩人重返法國料理發源地「巴黎」開設新店「Grand Maison巴黎」，再度為了米其林

  三星奮力一搏，並目標成為首位獲得米其林三星肯定的亞洲主廚。然而在眾多名廚競爭的

  巴黎，尾花卻遲遲無法交出滿意成績，甚至在一場大型晚宴上意外失誤。這讓尾花下定決

  心，向昔日恩師承諾：「倘若下次評選無法取得三星，就將辭職離開法國。」究竟他能否

  與夥伴們，再度攀上米其林的星級巔峰呢？



