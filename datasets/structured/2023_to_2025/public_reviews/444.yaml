title: '[新聞] <型男主廚三星夢:巴黎篇>日韓男神飆演技'
content: '新聞網址：



  由木村拓哉領銜主演，遠赴巴黎取景，透過大銀幕打造最道地美食饗宴的日本話題電影《

  型男主廚三星夢：巴黎篇》，即將在本週五（3/28）於台灣盛大上映。本片不僅集結日劇

  原班人馬熱血回歸，監製更看上韓團「2PM」成員玉澤演的直率個性，認為他與片中的甜

  點師性格相符，因此邀他首度演出日本電影，也讓本片可謂日韓男神夢幻聯動。尤其玉澤

  演一直是木村拓哉的粉絲，對於能有機會跟他搭擋共演，也讓玉澤演直呼超級緊張，但實

  際相處之後，卻一方面透露木村有「傲嬌感」，另方面也大讚他暖心舉動滿滿。尤其玉澤

  演還透露木村為了怕他受寒，特地為他購買保暖衣物，讓他忍不住告白木村：「我愛你！

  」值得一提的是，玉澤演還在片中流利切換韓文、日文與法文，其中他神速進步的日語能

  力，更是讓木村驚豔：「玉澤演主動走近我們，開始直接用日語交流，讓我們大吃一驚！

  」





  由日劇原班人馬熱血回歸的日本話題電影《型男主廚三星夢：巴黎篇》，這回製作規模大

  幅提升，並請來南韓野獸男團「2PM」成員玉澤演，首度演出日本電影！據悉，曾參與過

  《半澤直樹》的王牌監製伊與田英德，在看過玉澤演的演出後，對於他傳遞情感的方式印

  象深刻，認為與本片的甜點師「元」的性格相符，並表示：「我覺得他能將情緒直接傳遞

  給觀眾，他的直率很符合元的性格，所以就邀他來演出了。」玉澤演也因此仔細鑽研角色

  ，並分享：「我發現自己飾演的『元』，雖然是個麻煩製造者，卻能為廚房注入活力。我

  覺得他跟我最相似的一點，就是『在信任某人之前需要時間，但一旦相信了，就會貫徹到

  底。』」在開拍前，他不僅完整觀賞完日劇版，以深入了解角色魅力與故事亮點，更在日

  本料理學校親自學習烘焙技巧，展現出準備角色的高度決心。





  值得一提的是，《型男主廚三星夢：巴黎篇》也能看見玉澤演與木村拓哉，兩大日韓男神

  的夢幻聯動！對於能跟崇拜已久的木村拓哉共同演出，玉澤演也直呼超級緊張，並分享：

  「我第一次見到木村先生時，與其說是要一起演戲的演員，倒不如說是『天啊！真人就在

  我面前！』」由於行程關係，他與木村是直到開拍才初次見面，他也分享當時的情況：「

  木村前輩只簡單說了請多指教，就立刻開拍，所以讓我有點緊張。實際開拍後，他還會對

  我的台詞提出建議，例如：『這句話換成這句會更適合吧？』或是『試著說一次，如果感

  覺更自然的話就換掉吧。』」因為不太熟悉而不知道該如何相處的反應，也讓玉澤演笑道

  ：「這就是傳說中的傲嬌嗎？！」不過他也透露兩人熟悉之後，木村更因為擔心玉澤演拍

  攝受寒，而特地為他購買保暖衣物，暖心的舉動也讓玉澤演忍不住告白木村：「我愛你！

  」



  尤其玉澤演這回還在片中大秀流利韓文、日文與法文，其中他神速進步的日語能力，更是

  讓木村拓哉超驚豔：「剛開拍的前五天，玉澤演的斜後方一直站著一位口翻幫他溝通，但

  直到第六天，那位口譯突然不見了，讓我當時心想『這樣沒問題嗎？』結果沒想到，玉澤

  演主動走近我們，開始直接用日語交流，讓我們大吃一驚！」他也大讚玉澤演：「這並非

  背下來的感覺，而是完全自然地在對談，真是太厲害了！」



  這部集結《半澤直樹》製作人、《LAST MILE：全面引爆》導演、《王者天下》編劇豪華

  製作陣容，在日本上映後勇破40億日圓票房佳績的最新話題強片《型男主廚三星夢：巴黎

  篇》，即將在本週五（3/28）於台灣盛大獻映。本片劇情描述自從「Grand Maison東京」

  在日本榮獲米其林最高榮譽「三星」肯定之後，接著又歷經疫情衝擊與大企業對抗等種種

  危機，早見倫子（鈴木京香飾演）將主廚身分交棒後輩，跟隨昔日夥伴尾花夏樹（木村拓

  哉飾演），兩人重返法國料理發源地「巴黎」開設新店「Grand Maison巴黎」，再度為了

  米其林三星奮力一搏，並目標成為首位獲得米其林三星肯定的亞洲主廚。然而在眾多名廚

  競爭的巴黎，尾花卻遲遲無法交出滿意成績，甚至在一場大型晚宴上意外失誤。這讓尾花

  下定決心，向昔日恩師承諾：「倘若下次評選無法取得三星，就將辭職離開法國。」究竟

  他能否與夥伴們，再度攀上米其林的星級巔峰呢？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
