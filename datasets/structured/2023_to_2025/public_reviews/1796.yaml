url: https://www.ptt.cc/bbs/movie/M.1682080938.A.5FB.html
title: '[好雷]光影帝國-少了光，就什麼也沒有 '
content: '這週Disney+終於上了光影帝國，之前因為工作太忙沒辦法去電影院看，現在終於讓我看

  到了

  有段時間沒有坐下來好好品嚐一部電影，我個人很愛看這種文藝類型的電影，以下心得分

  享


  這部電影以1980年代的”電影院”作為故事背景設定

  女主是一個約莫40-50歲左右，且具有精神疾病的女人-希拉蕊

  因為難以控制自身情緒，所以需要長期看醫生、服用藥物，並且隨時會被社工給帶走

  而男主是一個20出頭歲的年輕黑人-史蒂夫之間

  在那個年代，黑人就是被嚴重歧視的一方

  甚至連找到工作都會被白人欺壓，表示黑人搶了他們的工作

  他們兩個人的都有各自的原因而不被社會接受

  在電影剛開始可以很深的感受到兩個人內心的孤獨



  希拉蕊在工作時是一位非常盡責的經理，也非常地守規矩

  每每史蒂夫問他為何不偷溜進戲院看電影時，他都會說：那是放給客人看的

  有心理疾病的他，在旁人眼中已不是一個正常的人

  因此他不願意再做“不正常“或”違規“的事，他想表現得像一個正常人

  然而我覺得這是他的偽裝，也是他一直不願意面對自己內心的一個表徵

  而史蒂夫恰恰相反，他一直嘗試打破僵局，做一些“白人“做的事

  例如：上大學、找工作、去夜店等等，不過跟希拉蕊相同的是“他也想表現得像正常人”


  而整部電影讓我最有感觸的地方，就是史蒂夫與放映師諾曼的對話，我覺得這段是這部電

  影的核心價值

  諾曼說：別人只看到一道光，不知道這裡有很多的帶子、齒輪等等

  在我們眼中，總是看到別人光鮮亮麗的一面，總是羨慕那些成功的人們，看著他們發光

  但我們從來不知道，在那背後，到底有多少東西才能撐起這美麗的畫面


  另一句話說道：電影，只是夾雜在黑暗中的靜止畫面，但當放映機以每秒24格的速度轉動

  膠卷，畫面就會開始有運動的感覺

  生命中常常遇到的挫敗、困難，甚或是天生的缺陷

  這些都是我們生命黑暗，唯有開始轉動時，人生才會開始前進，這些黑暗也會漸漸地看不

  見

  獨自進到戲院看電影以及與反抗白人，這是希拉蕊與史蒂夫面對內心最深處的問題的時候

  也因為這個“面對”，讓他們的生命開始轉動




  最後一句，也是本文標題：少了光，就什麼也沒有

  我認為這句話貫穿了整部電影

  希拉蕊與史蒂夫兩人的愛，就像是照亮彼此生命膠卷的光

  他們讓彼此看見自己的生命正在轉動

  也因為這道光，讓他們願意去面對內心的問題

  光，讓他們看到自己，勇於面對

  面對，使他們的生命轉動

  就這樣，屬於他們自己的電影，也終於繼續放映下去



  這部電影很推薦大家看兩次以上，我覺得會有不同的感觸

  細節的部分，每次看也都不一樣

  推薦大家值得一看


  --'
