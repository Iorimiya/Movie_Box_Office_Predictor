title: '[討論] 《光影帝國》上映戲院再度被威秀廳內廣告騙'
content: '繼《法貝爾曼》之後換《光影帝國》再次被威秀的廳內廣告騙！！！


  我很清楚記得去林口和松仁威秀看片的時候至少其中一家的廳內預告有放這部，結果這兩

  家都再次沒上...。


  雖然台灣 20 世紀有明寫限量上映，奧斯卡的確也表現不好，但去年《貝爾法斯特》同樣

  限量上映這兩家都有上（在林口一刷後去泰坦二刷），今年獎季片的排片真的好慘...。


  可不可以拜託威秀沒要上的片就不要放廳內預告騙觀眾啊！！！

  又不是被片商徹檔，一直被騙感覺很差...


  《光影帝國》看來上映戲院比《法貝爾曼》還要糟，這麼漂亮的攝影只能去華山看了嗎Or

  z



  --'
