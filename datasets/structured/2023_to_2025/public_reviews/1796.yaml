url: https://www.ptt.cc/bbs/movie/M.1677942456.A.70B.html
title: '[普雷] 光影帝國'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  一部感覺想以電影院為背景致敬電影的作品，不過我心中已經有《新天堂樂園》這道不可

  跨越之壁，《光影帝國》迎戰的結果只是變成一道光消逝而已。可惜片名感覺格局很大，

  但是想講的層面太多，導致這部片可能不只是失焦，而是我根本找不到焦點在哪。


  主軸是一個在電影院工作很久的女人，遇上一個新來的年輕黑人工讀生，兩人發展出一段

  忘年戀情的故事。背景是電影院這點還算有趣，而且有大概帶過一些電影院的生活，例如

  售票、驗票、清理影廳、放映機的整理、電影院的活動等等。但問題是都太片面了，導演

  呈現的方式看起來像日常生活隨處可見的場景，只是「剛好」背景在電影院而已，電影院

  變成希拉蕊跟史蒂芬這段你可能也不知道他們為什麼會這麼愛對方的戀情的龍套，失去了

  片名帶來的意境，至少我一開始以為《光影帝國》這個名字是試圖展現電影用光影呈現出

  的廣大世界。


  電影畫面還是不錯的，雖然我不是專業，但可以感受到隨著導演取景的方式與真正「光影

  」的變化，導演有試著藉由這些方式傳達一些想法或是一些不用言語就可以表達的念頭，

  但因為劇情有點混亂或硬要接續故事，導致譬如「希拉蕊穿著寶藍色的晚禮服暴走，寶藍

  色是不是代表她其實很憂鬱？」或是「這一幕沒有打光在主角身上，讓兩個人好像剪影，

  是不是為了讓人有帶入感，好像可以替換成任何一對情侶，還是導演是想要藉此表示他們

  兩個人的關係已經黯淡無光？」這種種聯想都遊走在是觀眾的藍色窗簾還是導演真的有意

  暗示的邊緣上。說起來那你不如拍默劇，直接讓觀眾去腦補台詞做劇情的連結可能還更有

  趣一點，反正演員的表現絕對足以撐起這種需求。


  配樂也搭配得很好，有隨著場景或當時的情緒做相應的樂曲選擇。不過我最喜歡的應該還

  是希拉蕊在電影院大廳暴走揭露經理的性騷擾作為時，背後影廳中幽幽傳來的《火戰車》

  主題配樂吧，那個場景配那首音樂，足夠諷刺又非常的激勵人心？大概也是整部電影我前

  幾喜歡的片段。


  攝影很好、演員表現很強、配樂有帶來驚喜，但角色設定與劇情相較之下就有點太亂，雖

  然不到複雜，但就是給人一種導演要把現在有討論度的議題都加進來的感覺。希拉蕊被經

  理性騷擾，還要幫他解決生理需求，又因為感情路坎坷而有心理疾病，甚至嚴重到要住院

  ，要以藥物控制病情；史蒂夫是黑人，剛好那時英國的極右派主義正盛，所以種族歧視是

  史蒂夫時常要面對的問題；而史蒂夫跟希拉蕊既是同事，年紀又有一段差距，而且女大男

  小，在1970,80年代並不會輕易被接受。兩個人幾乎要把現代有關社會正義的議題都串一

  遍了，但是串一堆設定又沒有好好地描述，感覺就像現在劇本演到妳有心理疾病囉，希拉

  蕊就突然復發；史蒂芬落單囉，他就會被白人揍；有極右派份子在遊行囉，他們就會衝進

  戲院把史蒂夫暴揍一頓。連在電影院驗票會遇到奧客這種應該算家常便飯的事情，都硬要

  牽扯到老白男不爽黑人員工阻止他，只為了一包薯條以及一杯喝一喝還會滴到衣服上的茶

  ，兩個人的暴怒都來的莫名其妙。


  也許導演想藉由一段原本應該很淒美（或者應該很寫實？）的愛情故事襯托電影院與當時

  的時代背景，但太多雜亂的議題導致我根本不知道導演想要表達甚麼？相較於前作《1917

  》用簡單的傳令兵冒險記帶出戰爭的殘酷與肅殺，這部導演就像是鬼遮眼一樣。不過片中

  對於電影院日常作息的描述，雖然只是簡陋而淺淺的帶過，但還是蠻有趣的。


  --'
