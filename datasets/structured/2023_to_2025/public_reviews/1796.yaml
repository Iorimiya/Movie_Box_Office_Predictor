  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  光影帝國跟法貝爾曼都是好電影


  但如果只看帳面成績

  會有光影帝國只有攝影可以看的錯覺

  根本誤會超大吧


  Roger Deakins + Trent Reznor + Lee Smith

  這種變態鐵三角組合

  完全就是沒有輸給 Kaminski+John Williams


  尤其音樂 出乎意料深層好聽


  Olivia Colman也是拿出絕活爆發力在演


  而且說真的光影帝國的小人物比較有感阿


  看不懂法貝爾曼入圍盡一切 光影卻只能吃到渣渣的道理= =


  光影帝國 出乎意料好看 扎實平穩的好片


  PS: 昨天八點威秀只有兩個人看?? 笑死XD 還想要泰坦廳R








  --'
