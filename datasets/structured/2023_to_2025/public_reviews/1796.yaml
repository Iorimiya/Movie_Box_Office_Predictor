url: https://www.ptt.cc/bbs/movie/M.1682503673.A.E3F.html
title: '[雷] 光影帝國 沒耐心也能看的文藝片 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  一直以來看電影的習慣就是以動作片、爽片為主

  家人則是對劇情、文藝片比較有興趣


  昨天吃飯家人在看D+的新上線的電影光影帝國

  原本只是想說瞄幾眼，結果就跟著看完了我的第一部藝術片

  值得我發篇文分享


  看完搜尋這部發現原來導演就是Sam Mendes

  身為007的粉絲深感抱歉 但也覺得不愧是山姆 品質有保證

  情感細膩的文藝片也是拍得嚇嚇叫 能讓非受眾的同樣看的入迷


  話說我其實過往沒看過Olivia Colman的作品

  但在光影中有被她的演技驚艷到

  後半Micheal Ward去她家找到 聽她講為何會有精神疾病的橋段

  拿著酒不知道在看哪裡 光打的很暗 然後她越講越激動

  蕭婆我快嚇爛 把躁鬱症者演的有夠好&像 一度想叫Micheal Ward快逃rrr


  雖然我是半路加入跟著看

  但覺這部蠻友善我這種沒耐心喜歡爽片的觀眾

  劇情算平淡簡單 但會讓人在看完時感到舒服

  然後導演跟演員都是奧斯卡保證 畫面很美 音效也有加到分

  而且Micheal Ward是長得很可愛的黑人(?)


  大家還有其他類似的作品推薦嗎 ?


  --'
