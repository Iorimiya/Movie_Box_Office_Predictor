url: https://www.ptt.cc/bbs/movie/M.1691149722.A.5F9.html
title: '[好無雷] 《神鬼海底撈》《TOKYO MER行動急診室》'
content: "週六晚間到總圖喜樂時代看《神鬼海底撈》\n整部電影拍的很復古，不僅是時代氛圍跟服裝，連劇情走向跟反派降智的部份都很復古\n但是旅館內的打鬥真的令人驚艷，完全沒有預料到會在劇情片中看到如此精彩的打戲，還有海中打鬥的安排也很有意思\n\
  韓國的商業片真的很強，整體而言算是好看，但居然只排在4排小廳\n\n週日一早去大遠百威秀看《TOKYO MER行動急診室》\n雖說沒有看過日劇版，但電影版以回憶片段的方式讓人快速了解之前的劇情，並不會看不懂\n\
  MER概念類似於《Code blue》以直升機載醫師到現場，不同的是MER到現場的是8人醫療小組加上可以執行手術的車載行動急診室，負責提供到院前的維持生命的基本手術\n\
  只是醫護直接衝入火場等危險環境進行醫療實在不合常理，有些部份也很狗血，但劇情非常熱血刺激，看到有人形容是醫療版的超級英雄電影實在很貼切\n--\n\nSent\
  \ from \n\n--"
