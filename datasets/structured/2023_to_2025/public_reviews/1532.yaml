url: https://www.ptt.cc/bbs/movie/M.1691865987.A.59A.html
title: '[好雷] Tokyo MER 行動急診室 劇場版'
content: '雖然這部全台灣也沒剩幾廳了，還是想分享一下簡單的心得

  我自己是這部日劇版的愛好者

  但認真說，我認為這部是只要大概了解日劇背景設定，不用先看劇也能覺得很好看的電影

  一言以蔽之，是一部會看到熱淚盈眶的熱血醫療大場面爽片


  簡單介紹一下日劇，如果看過日劇可以跳過

  總之就是東京都知事成立了一個叫做「Tokyo MER」的團隊

  主打醫護人員直接進入災害現場進行現場緊急醫療行為

  他們會開著一台非常炫砲的大卡車，直接開到現場，車內備有緊急手術室，需要的話病人就

  直接推進去開刀

  帶領團隊的是鈴木亮平飾演的喜多見主任

  他是個醫術高超又非常熱血的醫師，主張不管多危險的現場，只要有人需要醫療救助他就會

  衝進去

  當然這個想法是非常不合理的，因為無論如何在醫治病人前，確保現場安全都是最重要的

  (空中急診英雄的黑田醫師都用一條手臂告訴過你這個道理了)

  不過享受這部劇的重點第一個就是要先暫時當作這條這個道理不存在，接下來就能完全投入

  在劇情中了

  簡單來說這日劇就是以一集一個大事件為主軸

  由喜多見主任帶領的團隊(包括醫師、護理師、隨車工程師)，去深入災害現場解決每個事件

  而且都非常唬爛，不管多危險的事件和多絕望的現場，最後的死亡人數一定都是零

  唬爛程度直逼Dr. X的我不可能會失敗

  經常出現的爆炸事件或大場面也被日劇迷戲稱每集都跟電影一樣的「醫療特攝片」


  電影版維持著日劇版一貫的風格

  開場直接進入緊張感拉滿的機場跑道燃油外洩事件

  搭配爆炸範圍的預告和緊湊的音樂，雖然知道

  最後死亡人數應該還是零，還是看得非常冷汗直流


  事件結束之後的一段帶入了幾個電影設定和新人物介紹後

  馬上出現了本部電影的主要事件「橫濱地標塔爆炸事件」

  這也是橫濱真實存在的建築物，標高近300公尺的地標塔，中段樓層出現了爆炸事件

  雖然緊急救出了低樓層的民眾，但高樓層卻還有193個民眾受困

  其中也包含了喜多見主任已懷孕的妻子

  更急迫的是其中竟然有一位阿婆出現了腦出血的狀況

  必須緊急做手術取出血塊否則阿婆就要死了

  喜多見主任當然不可能放任這樣的事情發生

  堅持帶領團隊殺進火勢延燒的70層高樓救人


  接下來就是一系列絕望再絕望的設定

  在好不容易開出一條緊急逃生道，帶領頂層民眾疏散時竟然又出現了樓層連續爆炸

  然後又有人出現心包膜填塞，好不容易現場緊急開刀處理，又發現他有服用抗凝血藥物而無

  法止血

  喜多見的孕妻高輪更在某一層遭遇爆炸而昏迷

  然後喜多見緊急殺回去救孕妻後，卻又遭遇到了腳被壓住動彈不得的窘境，而孕妻也出現了

  早產的跡象...

  總之就是絕望感極重 情況極度壓迫

  這也讓之後援手出現時直接讓人眼淚潰堤


  劇情方面就不多贅述了，太多文字無法傳達的緊張感和催淚點

  這是一部狗血灑好灑滿的電影，但就是完全灑中你的心頭和淚腺

  爆炸特效或許比不上好萊塢，但整個大場面和場景的壓迫設定完全有感受到劇組的用心

  爽片該有的劇情張力也是拉好拉滿，一個問題解決後絕對還有另一個更令人絕望的問題

  情感部分也非常令人動容，

  包括各角色之間的關係，親情、愛情...

  如果看過日劇版更是絕對會哭出來


  還想提一下片尾，劇組放的不是劇照，而是非常多醫護相關人員的真實工作照片

  包括醫師、護理師、藥師、營養師、各種治療師、救護人員、甚至連醫院的打掃阿姨都放進

  來

  搭配前面劇情內所有人的捨己救人，真的就是感動

  要給劇組的用心一個鼓勵，也要給所有付出一切的醫護相關從業人員最深的Respect


  我認為這部片以爽度而言不輸近期歐美的動作爽片

  節奏的掌握絕對是讓人腎上腺素狂飆

  催淚點也是滿滿，不論是熱血的淚還是為劇中人物之間情感所掉下的眼淚

  只可惜日劇可能在台灣真的是小眾，沒看過日劇版也不太會來看這部的電影版

  也就造成了討論度極低，在台上映兩周幾乎沒剩幾檔的狀況 (雖然日本還是賣破台幣10億)


  超級推薦這一部，有看過日劇版絕對要看

  沒看過的其實也還是可以很自然享受其中

  雖然幾乎要下檔了，還是歡迎想體驗爽片的板眾們，等電影上串流可以來享受一下這部


  當然，先看過日劇會更好

  這部的日劇版號稱醫療特攝片真的不是唬爛

  他沒有日劇常見過於平淡的節奏

  完全就是當作電影在拍

  把每一集都當作一個爽片來看也是很OK的 推薦大家！



  --'
