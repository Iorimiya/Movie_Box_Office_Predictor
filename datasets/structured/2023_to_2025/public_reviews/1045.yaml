url: https://www.ptt.cc/bbs/movie/M.1706628760.A.95C.html
title: '[情報] 蓋瑞奇新作《非紳士特攻隊》預告'
content: '蓋瑞奇執導，亨利卡維爾、艾莎岡薩雷斯、艾倫瑞奇曼等人主演的二戰題材新作《非紳士

  特攻隊》（The Ministry Of Ungentlemanly Warfare）釋出第一支預告，


  本片改編自達米安路易斯所著同名書籍，時間線設定在1939年，英國遭受德國的猛烈襲擊

  ，邱吉爾希望強勢回擊，而他主張戰爭中不需要紳士原則，一切可行的手段皆可使用，於

  是在英國創立了一支秘密特工部隊，在對抗納粹的戰爭中功不可沒。



  《非紳士特攻隊》將在今年4/19於北美上映，台灣檔期未定。


