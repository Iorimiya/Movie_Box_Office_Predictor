title: '[好微雷] 非紳士特攻隊'
content: '覺得好看

  男的帥

  女的美

  殺得很爽

  尤其是使用各種冷兵器的殺法


  亨超戲份不算最重

  秀肌肉擔當也不是他

  肌肉擔當我覺得很帥


  女主真的很美（再說一次）


  劇情都很合理，可以吐槽的部分很少

  為了加入緊張感有改編史實的部分

  （爬文看到的）

  偶爾加一點點笑點

  以現在來說

  這樣就很好看了

  （可能我標準低不要炮我）

  算很爽的片










  -----------------以下微雷---------------














  要吐槽一點就是女主有鋪陳說槍法很準

  結果後面他只有開一槍


  爬文說覺得不好看是因為任務很順利

  很無聊

  我不認同是因為

  他們其實也是有遇到困難

  要臨機應變更改計畫

  這也是我覺得精彩的一部分

  看他們怎麼解決問題完成任務











  ------------------以上微雷--------------------














  --'
