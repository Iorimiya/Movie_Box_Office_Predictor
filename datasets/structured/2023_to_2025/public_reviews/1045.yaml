url: https://www.ptt.cc/bbs/movie/M.1713629867.A.C3C.html
title: '[微雷] 平淡普普的非紳士特攻隊'
content: '想說衝著蓋瑞奇跟亨利的造型而進戲院看


  結果看完是真的覺得還好


  跟女生朋友唯一的討論就是女角的美背




  雖然是以二戰當背景


  還以為會像惡棍特工那樣充滿黑色幽默


  結果就是順順的推進劇情完成任務這樣


  反派好像要塑造的很壞


  但其實對主角也沒造成威脅


  甚至連個照面都沒有....


  配角來說


  隊員除了大肌肌比較秀之外


  其他隊員的鏡頭還蠻少的


  倒是有黑人的鏡頭比例相對高...



  看起來說是特攻隊好像是走特務路線


  又說主角是007的原型


  但其實也沒有什麼動作戲


  或者是驚險特技鏡頭 甚至 跟女角也沒互動


  印象只記得散步跟開槍而已...



  雖然給女主角很多造型看的很賞心悅目啦



  但是...也就這樣了


  尾聲的大場面也還好


  相比之下


  上一部休葛蘭收尾那段炸衛星天線要帥多了




  可惜了..



  -----

  Sent from JPTT on my Sony XQ-BC72.


  --'
