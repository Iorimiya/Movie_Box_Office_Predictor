title: '[情報] 蓋瑞奇新片【非紳士特攻隊】，4/19上映！'
content: '資料出處：采昌國際多媒體





  精彩預告：




  ★「英國鬼才名導」蓋瑞奇，帶來年度最爽最炸爆米花動作強片！

  ★ 二戰真實故事改編，重現邱吉爾不為人知的機密諜報特攻隊！

  ★【神鬼奇航】億萬監製傑瑞布洛克海默再度打造賣座鉅片！

  ★【紳士密令】蓋瑞奇X亨利卡維爾二度合作，再創戰爭爽片！

  ★ 暢快純粹的動作爽片，大膽打造英國史上第一個特種部隊任務！

  ★ 亨利卡維爾挑戰嶄新「非紳士」風格，反差詮釋粗魯隊長！

  ★ 豪華卡司共組「天菜級」機密特攻隊，不擇手段反攻德國！

  ★ 砲彈！槍火！斧頭！機關槍！從頭爽到尾讓人大呼過癮！





  二次世界大戰期間，歐洲接連被德國納粹攻陷，英國受到德國的持續轟炸，甚至連物資補

  給管道都被摧毀，讓英國的投降聲浪不斷。不過首相邱吉爾非但不屈服，反而更下定決心

  要改變現狀！某日，他發現德國艦隊總會來到赤道幾內亞的小港口，重新武裝與修理軍艦

  ，而這正是可以摧毀德國戰爭資源的大好機會。掌握到珍貴情報，又看準能夠猛烈反攻的

