title: '[普好雷] 非紳士特攻隊：政治正確'
content: "炸魚薯條V.S.香腸酸菜黑麵包\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n剛剛看完，有符合期待也有美中不足的部分，戰鬥非常的爽快，\n\
  \n特別是丹麥人拉森有如海克力士附身，射箭短刀無雙，拿槍反而是拘束器。\n\n看他打到刀都斷掉，瞥見牆上掛著斧頭、拿起斧頭笑得像個孩子。\n\n雖然納粹德國在劇中被醜化，在二戰中大部分時間他們也是會遵守日內瓦公約，\n\
  \n不太可能直接槍殺中立國西班牙將領與盟國義大利人，只有一個例外：\n\n片中角色所屬的英國突擊隊(特別空勤隊SAS前身)，德國在二戰中只要抓到突擊隊員，\n\n\
  一律就地處決，因為突擊隊員殺起德國人就像拉森一樣殘酷凶狠。\n\n以戲份與重要性來說，美人計史都華才更像是主角，\n\n沒有她跟赫倫即時傳回正確情報，整個行動絕對會失敗。\n\
  \n亨利卡維爾雖然是電影宣傳重點，他的角色格斯菲利普斯少校其實相對發揮有限，\n\n除了談笑殺納粹很爽快外，給人的印象就是紳士密令的索羅。\n\n叫他喝茶偏要喝酒，看到好雪茄跟打火機就順手牽羊，完全不紳士也不龐德。\n\
  \n最後看到格斯與史都華結婚的史實，對比電影只會覺得黑人問號，\n\n他們除了剛開始開會跟最後一起被抓外，根本沒什麼交集，幫開手銬就可以結婚？\n\n片中濃濃英倫風，當地傭兵頭頭因為畢業於伊頓公學、「血統純正」，\n\
  \n馬上跟校友格斯結為生死之交，最後還說我不在乎獎章，只想被封個騎士做做。\n\n儘管電影主打不走英國紳士作法，片中角色仍然拼命宣揚大英帝國精神。\n\n只有史都華敢酸「英國贏就只能吃炸魚薯條，德國贏就只能吃香腸酸菜黑麵包」，\n\
  \n真可惜她不是主角。\n\n\n\n\n另外翻譯真的...德國酸菜沒吃過也不該翻成高麗菜吧，\n\n後段還把龐德上將降級為龐德上校，真的會影響觀影體驗。\n\n\
  \n--\n謂鋼彈者，凌厲剛猛，無堅不摧，弱冠前以之與吉翁群雄爭鋒。\n加諸磁膜，一年戰終前所用，誤殺拉拉不祥，悔恨無已，乃棄之阿巴瓦空。\n運機無鋒，大巧不工，八七年持之直撞阿席馬。\n\
  九三年後，不滯於物，盾榴餌翼均可為劍，自此精修，漸進於無劍勝有劍之境。\n                                     \n\n--\n\
  感謝指正。"
