content: "看到有人問配樂，就很想回一下\n\n從2019年的「紳士追殺令」開始，\n\n蓋瑞奇就都是和 Chris Benstead 這位作曲家合作\n\n\
  其中我個人特別推薦「Wrath of Man」、「The Covenant」這兩部的音樂\n備註: Wrath of Man = 玩命鈔劫；The Covenant\
  \ = 絕地營救\n但我覺得這兩部台灣翻譯的片名都超沒感覺的 XD\n\n分享幾首我比較喜歡的\n\nF**king Lunatic\n\n\nWrath of\
  \ Man\n\n\nDangerous Job\n\n\n100 Kilometres\n\n\nDarunta Dam\n\n\n他的音樂都滿凶狠、有氣勢的\n\
  \n這次的非紳士 soundtrack 也是他配的\n\n但目前似乎還沒有釋出\n\n所以可能要再等一、兩個禮拜，才能夠在網路上找到哦～\n\n\n--\n\n\
