title: '[新聞] 艾倫里奇森【非紳士特攻隊】公認肌肉擔當'
content: '新聞網址：



  「英國鬼才名導」蓋瑞奇（Guy Ritchie）的最新執導動作爽片《非紳士特攻隊》（The

  Ministry Of Ungentlemanly Warfare），即將在4月19日於台灣盛大上映。以「即興創作

  」出名的蓋瑞奇，開拍首日便更改「英國帥氣男星」艾力克斯派帝佛（Alex Pettyfer）

  的腔調，也時常和「壯肌男神」艾倫里奇森（Alan Ritchson）臨時調整動作特技，讓演

  員們紛紛表示：「必須隨時準備好接受挑戰！」而曾在《惡棍特工》（Inglourious

  Basterds）演出納粹德軍的「德國性格男星」提爾史威格（Til Schweiger），本來已經

  拒絕演出相似角色，但身為蓋瑞奇鐵粉的他，卻破例點頭接演！值得一提的是，時常對動

  作戲提出想法的艾倫里奇森，一身的壯碩好身材，也讓亨利卡維爾（Henry Cavill）跟亨

  利高汀（Henry Golding）決定把本片的「肌肉擔當」頭銜送給他！





  以「即興創作」出名的蓋瑞奇，在新片《非紳士特攻隊》再度為演員們帶來「即興特訓」

  ！開拍首日，他便大改艾力克斯派蒂佛的腔調，讓他在五分鐘內徹底改變成全新感覺，艾

  力克斯派蒂佛對此分享：「他就像一位指揮家、一位大師，在合作過程當中，不僅是在拍

  電影，更是在塑造角色。」此外，他也時常與擁有大量動作戲的艾倫里奇森，臨時調整動

  作特技，最終呈現出的絕佳效果也讓蓋瑞奇忍不住稱讚：「我從來沒有對人們的特技想法

  感到印象深刻，但艾倫的情況並非如此，他與他的特技演員是非常出色的搭檔，帶來創意

  又新鮮的表演。他們會在當天提出想法，而且效果很棒，這種情況太少見了！」



  而曾在《惡棍特工》演出納粹德軍的提爾史威格，本來已經拒絕再度演出相似角色，不過

  身為蓋瑞奇「死忠粉絲」的他，為他破例演出片中的納粹指揮官「魯爾」，他對此表示：

  「蓋瑞奇是一位真正的導演，當他把場景弄給你看時，你就能明白一切；因此當他邀請我

  演出魯爾時，我想說『好吧，我真的很愛你的作品，我是你的死忠粉絲！』」同時，他對

  跟蓋瑞奇的合作更是高度讚賞：「這是我有過最好的拍攝經驗！我從來沒有在其他人的片

  場感到如此舒適，感受到安全感與被欣賞，他是個好人，也是個很出色的導演！」





  值得一提的是，在《非紳士特攻隊》中演出「瘋狗獵人」，更號稱可以有「100種殺人方

  法」的艾倫里奇森，除了擁有大量困難的動作特技戲外，一身壯碩的好身材，簡直快要把

  片中的戲服給撐爆，也讓亨利高汀驚嘆：「他的手臂簡直就跟我的大腿一樣粗！」更與亨

  利卡維爾決定把「肌肉擔當」的頭銜送給艾倫里奇森。兩人也表示：「我們有嘗試要保持

  身材，上一些早晨的健身課程，但最後還是把肌肉擔當留給艾倫吧，他也確實扛起了這個

  頭銜，重點是沒人可以超越他了，我們就像是『艾倫，你就把聚光燈都拿走吧！』」



  這部改編二戰傳奇真人真事，由鬼才名導蓋瑞奇執導，集結億萬票房製作團隊與超豪華卡

  司的《非紳士特攻隊》，台灣即將與全球同步在4月19日盛大上映。本片劇情描述二次世

  界大戰期間，歐洲接連被德國納粹攻陷，英國受到德國的持續轟炸，甚至連物資補給管道

  都被摧毀，讓英國的投降聲浪不斷。不過首相邱吉爾非但不屈服，反而更下定決心要改變

  現狀！某日，他發現德國艦隊總會來到赤道幾內亞的小港口，重新武裝與修理軍艦，而這

  正是可以摧毀德國戰爭資源的大好機會。掌握到珍貴情報，又看準能夠猛烈反攻的時機，

  邱吉爾下令組織一批機密特攻隊，並由格斯（亨利卡維爾飾演）帶頭衝鋒陷陣。這支隊伍

  的唯一原則，就是「不需紳士！不擇手段！」帶著必死決心的這群機密特工，最終能否打

  贏勝仗，成為扭轉戰局的關鍵呢？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。


  --'
