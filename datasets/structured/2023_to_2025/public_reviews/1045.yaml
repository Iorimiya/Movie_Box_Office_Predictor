title: '[新聞] 蓋瑞奇新作【非紳士特攻隊】中文首支預告'
content: '新聞網址：





  「英國鬼才名導」蓋瑞奇（Guy Ritchie）強勢回歸！這回他攜手《神鬼奇航》系列（

  Pirates of the Caribbean）的「金牌監製」傑瑞布洛克海默（Jerry Bruckheimer），

  帶來年度爆爽動作強片《非紳士特攻隊》（The Ministry Of Ungentlemanly Warfare）

  ，引領觀眾一窺二戰時期，當英國遭受德國猛烈攻擊時，首相邱吉爾如何打造秘密諜報組

  織，不擇手段反轉局勢。台灣發行商「采昌國際多媒體」不僅在今日（2/5）宣布台灣定

  檔4月19日與全球同步盛大上映，更公開首支精彩預告。預告當中，可以看到《超人：鋼

  鐵英雄》（Man of Steel）男主角亨利卡維爾（Henry Cavill）再度領銜主演，更集結「

  天菜級」豪華卡司共組機密特攻隊，手持槍砲彈藥上演讓人大呼過癮的爆爽行動！





  曾經執導《紳士密令》（The Man from U.N.C.L.E.）、《玩命鈔劫》（Wrath of Man）

  、《福爾摩斯》系列（Sherlock Holmes）的鬼才名導「蓋瑞奇」，攜手億萬票房監製「

  傑瑞布洛克海默」，帶來最新戰爭動作強片《非紳士特攻隊》。本片改編自二戰時期真實

  故事，描述當年德國一一攻陷歐洲各國，連英國都在德國的連續攻擊之下，幾乎快要淪陷

  ；當時的英國首相邱吉爾，在掌握珍貴情報、有望反攻德國後，下令組織一批不為人知的

  機密特攻隊，要他們「不需紳士！不擇手段！」都要帶著必死決心，成為拯救英國戰況的

  關鍵！



  帶領這群特工們衝鋒陷陣的隊長，正是由曾在《紳士密令》與蓋瑞奇合作過的亨利卡維爾

  飾演。亨利卡維爾對於睽違九年，再度跟蓋瑞奇合作表示：「能遇到一個如此有動力、敬

  業、投入於說故事的團隊實屬罕見，這種動力和奉獻精神，有了蓋瑞奇這樣的領導者而變

  得更加強烈！」





  在今日公開的《非紳士特攻隊》首支預告當中，可見亨利卡維爾一改過去形象，蓄起大鬍

  子，一邊大吐舌頭，一邊瘋狂掃射，反差詮釋粗魯隊長，令人相當驚喜！此外，從中還能

  看到《玩命關頭X》（Fast X）艾倫瑞奇森（Alan Ritchson）、《玩命關頭：特別行動》

  （Fast & Furious Presents: Hobbs & Shaw）艾莎岡薩雷（Eiza Gonzalez）、《瘋狂亞

  洲富豪》（Crazy Rich Asians）亨利高汀（Henry Golding）、《沙丘》（Dune）巴布斯

  奧盧桑莫昆（Babs Olusanmokun）等天菜級演員，共組「瘋瘋癲癲」的特攻隊，隨手把玩

  手榴彈、開槍不眨眼地瘋狂掃射，更有大場面海上爆破。以流暢的動作場面，為觀眾帶來

  爆爽觀影體驗，而他們又會祭出什麼大招來扭轉劣勢？絕對值得觀眾們進戲院，好好享受

  這部年度動作強片！



  這部集結億萬票房製作團隊與超豪華卡司的《非紳士特攻隊》，台灣即將與全球同步在4

  月19日盛大上映。本片劇情描述二次世界大戰期間，歐洲接連被德國納粹攻陷，英國受到

  德國的持續轟炸，甚至連物資補給管道都被摧毀，讓英國的投降聲浪不斷。不過首相邱吉

  爾非但不屈服，反而更下定決心要改變現狀！某日，他發現德國艦隊總會來到赤道幾內亞

  的小港口，重新武裝與修理軍艦，而這正是可以摧毀德國戰爭資源的大好機會。掌握到珍

  貴情報，又看準能夠猛烈反攻的時機，邱吉爾下令組織一批機密特攻隊，並由古斯（亨利

  卡維爾飾演）帶頭衝鋒陷陣。這支隊伍的唯一原則，就是「不需紳士！不擇手段！」帶著

  必死決心的這群機密特工，最終能否打贏勝仗，成為扭轉戰局的關鍵呢？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
