title: '[請益] 非紳士特攻隊 配樂'
content: '本身是配樂佳就會對電影加分的類型，

  不得不說非紳士特攻隊的配樂真的十分優秀，

  有些普通場景配上它恰到好處的音樂就變得完全不一樣。

  讓整部電影節奏順暢又很舒服!



  想問的是，

  最後偷船爆炸場面時的配樂有沒有大大知道是哪首曲子?

  印象中主旋律是有笛聲的~




  另外還是再推一下喜歡亨利、英倫風、黑色幽默還有歷史的觀眾可以去看看!

  悠閒的開槍非常紓壓



  --'
