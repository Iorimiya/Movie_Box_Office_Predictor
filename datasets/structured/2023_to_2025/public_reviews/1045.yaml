title: '[普好無雷] 《非紳士特攻隊》'
content: '好累，不想寫一大串


  缺點：主要角色曲線沒有什麼形塑，所以臉盲的我看的有點痛苦，很難知道誰是負責什麼重

  要職位的角色(對啊，我根本不知道亨利卡維爾是扮演哪個角色)。不過個性豐富的次要角色

  則是形塑的非常出色，讓人可以一下就知道他們是在扮演什麼樣的人物，是壞人還是好人，

  這一點還是很容易分辨的。


  優點：劇情節奏非常順暢，沒有操之過急或是緩慢拖步的情形，整體都是處於一個在導演掌

  控中的感覺，快慢分明，不帶一點拖沓，很紮實的兩小時作品。

  可惜的是劇情就順順演下去，幾乎都跟預期的一樣，沒有什麼轉折，讓人有點小失望。

  而且音樂BGM跟劇情非常搭，在我內心不知道替這些幫助掌握劇情節奏的音樂加了幾分，可

  以說是這些音樂救活了一部原本可能有些平凡無奇的作品，讓《非紳士特攻隊》的形象大幅

  展露。


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
