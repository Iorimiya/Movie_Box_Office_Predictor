title: '[好雷] 非紳士特攻隊 '
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n剛看完 電影院只有1小廳\n\n\n劇情就類似自殺突擊隊\n主角戴罪立功帶一群問題兒童\n去非洲南部爆破德國U型潛艇的後勤\n\
  \n\n爽片一部\n主角一行各有特色\n\n1.主角 團隊決策執行者\n2.水手 負責開船\n3.壯漢 殺手(身材超好 帶小圓框眼鏡超帥) 精通各種殺人手法\n\
  4.亞裔 潛水員+爆破專家\n5.博士 決策制定者\n\n\n還有另一條線的黑人跟美女特工\n\n黑人很紳士扮成成功商人\n美女超正(歷史原型的人物也很美後來嫁給主角)\n\
  \n劇情就殺納粹  突發小狀況 臨機應變 殺殺殺\n\n\n爽片  劇情邏輯也沒有不太通順  適合不帶腦進去看1\n\n\n\n\n\n\n\n\n--\n：\n\
  \ 1.同學:我都沒唸啊，不知道為何考這麼高。 2.來賓:大家好，我只簡單講兩句。\n 3.老闆:我不會忘記你的貢獻。             4.職員:明天我就不幹了。\n\
  \ 5.商人:跳樓大拍賣，只到今天。           6.明星:我們只是朋友。\n 7.男孩:乖，不會痛的。                   8.女孩:這是我的第一次。\n\
  \ 9.父母:我幫你把紅包存起來了。          10.小吃店歐巴桑:帥哥！你要吃什麼?\n\n--"
