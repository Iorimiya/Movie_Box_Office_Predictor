url: https://www.ptt.cc/bbs/movie/M.1714051788.A.CB6.html
title: '[好雷] 非紳士特攻隊-散步完成任務 '
content: "雷文防雷資訊頁\n\n\n預告片看起來很狂暴\n可是正片稍微有點紳士\n以下多劇情雷，慎入\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n劇情大綱:\n\
  礙於法規等約束，邱吉爾決定派一隊不被官方承認的特攻隊，\n去執行炸毀德國U潛水艇補給線的任務。\n\n嘈點:\n一、如果真要搞機密任務，收發電報單位可不可以用心點自己另外找一組人馬啊?\n\
  \    居然還是用海軍公用的機關，整個任務差點被007上將摧毀了耶。\n\n二、德軍要審問重要的敵方情報人員\"奶頭先生\"，不直接後送進本國再慢慢玩，\n\
  \    放在怪怪的地方難怪被劫走，後面人物介紹有說他任務完成後又被抓一次，\n    所以又被救了一次?\n\n三、整片如果沒有\"專業獵戶\"負責血流成河的畫面的話，(完美詮釋了近戰弓手)\n\
  \    實在是不知道非紳士的點在哪。\n    其他人都走著走拿著有超級消音器的槍，一路逛，一路殺，悠悠哉哉。\n    阿，回過頭來說預告片的部分，救\"\
  奶頭先生\"的那段就還蠻非紳士，\n    不錯不錯，可惜後繼無力。\n\n四、凱薩大帝智商在穿上COS服的就下線了，抓到一個間諜連搜身都沒有，\n    活該你死在掌心雷手上。\n\
  \n五、翻譯有時候同一個人是上校有時候又變上尉...可以麻煩統一一下好嗎。\n\nP.S.本以為隊長跟王子的賜封橋段後面會真的讓邱吉爾給他的爵位之類的，可惜沒有。\n\
  \n總結:雖然嘈點不少，但整片進度流暢，便當發起來沒在客氣的。\n     本以為會在航行上拖時間，好在沒有，俐落帶過。\n\n\n\n\n\n--"
