title: '[新聞]《演員夢》日本首映 座無虛席 議員名流盛讚'
content: '《演員夢》日本首映 座無虛席 議員名流盛讚



  2023年5月31日，電影《演員夢》在日本東京首映。國會議員與社會名流前來觀賞，對影

  片所展現出的善與寬容讚不絕口。現場座無虛席，演員與觀眾熱烈互動。（盧勇／大紀元

  ）


  更新 2023-06-04 1:00 AM


  【大紀元2023年06月03日訊】


  （日文大紀元記者王文亮、清川茜採訪報導）


  獲獎電影《演員夢》5月31日在日本東京首映。國會議員與社會名流前來觀賞，對影片所

  展現出的善與寬容讚不絕口。現場座無虛席，演員與觀眾熱烈互動。


  電影講的是，在中國大陸亂象紛呈的演藝圈，演技精湛的女演員林美月因電影界的黑暗失

  去心儀角色，在精神恍惚中發生車禍，身心俱創，落下半身不遂，十年的輪椅生活，到過

  無數的醫院，看過眾多的名醫，依然一籌莫展。最後由一位台灣中醫推薦，林美月與一本

  奇書相遇，最後重新站了起來。明白了生命的真諦後，林美月最終與曾經的仇人一笑泯恩

  仇。故事情節打動人心，許多觀眾紛紛落淚。



  電影《演員夢》5月31日在日本東京首映，現場座無虛席，演員與觀眾熱烈互動。（藤野

  偉／大紀元）



  電影《演員夢》5月31日在日本東京首映，現場座無虛席，演員與觀眾熱烈互動。（新世

  紀影視基地提供）



  電影《演員夢》5月31日在日本東京首映，現場座無虛席，演員與觀眾熱烈互動。圖為主

  要演員馮曉雅和鄭雪菲。（新世紀影視基地提供）


  日本眾議院議員石橋林太郎觀看影片後表示：「愛和寬容是一件很難的事情，將其作為電

  影的主題我認為非常好。」石橋說，影片中講述的「真善忍」的原則是「我們人與生俱來

  的最美麗的品質」。他說，他也要珍惜這樣的理念，在今後的政治生涯中「要做到像蓮花

  一樣，出於污泥而不染」。



  日本眾議院議員石橋林太郎觀看影片後表示：「愛和寬容是一件很難的事情，將其作為電

  影的主題我認為非常好。」（新世紀影視基地提供）


  政治評論家三井田孝歐讚揚了演員們的表演技巧：「扮演反派角色製片人的演員，她的表

  情和演技非常到位，真的很出色。」他表示，電影體現了「如何放下仇恨和敵意」，而這

  正是能觸動日本人心靈的內容。



  政治評論家三井田孝歐讚揚演員們刻畫人物非常到位，很出色。他表示，電影體現了「如

  何放下仇恨和敵意」，而這正是能觸動日本人心靈的內容。（藤野偉／大紀元）


  《演員夢》裡飾演林美月的馮曉雅向觀眾分享了在飾演過程中的心得。「我在演出的過程

  中，有一場戲我自己都很受感動，最後，主角林美月在面對讓她遭受十年半身不遂的痛苦

  ，和人生低谷時期的仇人時，她卻對她的仇人說：『過去的就過去吧！』那一刻，我自己

  在表演的過程中都在流淚，是什麼樣的動力促使她說這樣的話，十年的傷痛害得她那麼慘

  ，最後淡淡的一句『過去就讓它過去吧』。」


  在名牌大學攻讀中文系的內田琉士被劇情深深吸引，尤其對於影片中主角林美月原諒仇人

  的場景深表讚歎：「原諒別人可以打破怨恨的鎖鏈。在劇中林美月成功實現了這一點，我

  認為正是『真善忍』的原則影響了她。」


  飾演郭欣雨的鄭雪菲說，希望通過這部影片傳遞光明和希望。「這部影片很觸動我的是，

  這個女主角林美月能夠放下自己的仇恨，將一個寶貴的機會讓給了自己的仇人，這種大善

  大忍的胸懷特別觸動我，這樣的一種展現在現代社會中也是少有的。我也是希望通過《演

  員夢》這部影片，能夠給大家送去溫暖和鼓勵，能夠給那些在追夢的路途中遇到坎坷的朋

  友們，希望他們通過這部影片找到希望，找到那個希望的燈塔。」


  日本觀眾廣田寬光在互動環節說，觀看影片，他的內心得到了救贖。「我在公司是最年輕

  的員工，長輩們有時會拿我撒氣，在來劇場的路上我還在想明天怎麼跟他們鬥，但看到這

  部影片中女主角純善的心態，自己的爭鬥之心逐漸淡去，不再計較那些事情。」



  日本觀眾廣田寬光說觀看影片，內心得到了救贖，不再計較和同事的矛盾。（新世紀影視

  基地提供）


  非政府組織高管籐木俊一稱讚道：「為孩子們創造良好的成長環境是大人們的使命，這部

  影片能夠教導孩子們學會忍耐和原諒，真是一部好電影。」他表示，日本社會的道德觀念

  正在衰敗，而這部電影體現的返本歸真的概念是非常可貴的。


  《演員夢》是由導演大衛‧李執導，加拿大新世紀影視拍攝的長篇藝術電影，獲得加拿大

  Alternative國際電影節最佳女主角、美國金畫國際電影節最佳女主角、上海獨立國際電

  影節第二季度的最佳服裝獎和最佳男配角獎等24項大獎，在世界各地廣受好評。


  主辦方表示，希望今後能夠在日本全國的電影院播放該片，吸引更多的觀眾。


  首映會結束後，演員與觀眾合影留念。觀眾們表示要向更多人介紹影片《演員夢》，傳遞

  人類應有的品德——善與寬容。


  責任編輯：盧勇


  大紀元



  --'
