title: '[新聞] 小潘潘堅持演員夢 感性告白阿莫多瓦'
content: "小潘潘堅持演員夢 感性告白阿莫多瓦\n\n2019/08/01 05:30\n\n\n潘妮洛普克魯茲在《痛苦與榮耀》飾演貧困母親，展現無比韌性與溫柔（傳影提供）\n\
  \n〔記者鍾志均／綜合報導〕「小潘潘」潘妮洛普克魯茲今年以阿莫多瓦新片《痛苦與榮耀\n》再登演藝巔峰，回憶起18歲剛出道時，曾被阿莫多瓦以「太年輕」為由拒絕。不過她堅\n\
  持演員夢想，時隔30年後，談起阿莫多瓦仍心存感激：「他就是我成為演員的唯一原因！\n」\n\n小潘潘說：「永遠忘不了第一次看到阿莫多瓦經典作《綑著妳，困著我》的那天，像是去\n\
  了一趟月球，這片徹底改變我的人生！」讓她放棄學了10年的芭蕾舞，決心朝演員之路邁\n進。\n\n她在《痛》片中近乎素顏，飾演以洞穴為家的貧困母親，為供兒子讀書，不得不低聲下氣\n\
  求修女收留，而她為孩子展現的韌性與溫柔，也成為觀眾難以忘懷的一幕。《痛苦與榮耀\n》明在台上映。\n\n--\n\n帝釋所問經講記77頁拆穿的。\n毗婆舍那講記(含法的醫療)說明如何修四念處增加智慧斷除所有煩惱。\n\
  \  PTMC 寂靜禪園\n、、、、()、、是。\n  是    是\n\n--"
