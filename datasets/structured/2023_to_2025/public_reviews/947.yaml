title: '[討論] 黑水巷的銀幕比例?'
content: '請問大家:


  是喜樂時代的問題


  還是黑水巷影片的問題


  我又一次看到這種奇怪的銀幕比例的影片


  永和喜樂銀幕是2:35:1


  然後二邊本來就已經是黑的變成1:85:1


  但是他居然在1:85:1裡面又多一個框


  也就是說影片投射出來所佔銀幕的部分


  更小?


  還是黑水巷是藝術影片所以銀幕比例特別不同?


  --



  奕睿哥哥 一路好走


  希望你在另一個世界能過的快樂



  --'
