url: https://www.ptt.cc/bbs/movie/M.1746087139.A.46D.html
title: '[普雷]《跳進部落的孩子》跳舞亦我再算上部落'
content: '舞團的後臺與舞者，跳出部落與自我衝突


  中央山脈下、風災、部落文化，雖然沒有與世隔絕但晚上附近沒有商鋪，必須開車到附近

  鄉鎮才能購買必需品，里民鄰居生活緊密，活動中心除了族人偶爾還能看見觀光的遊客，

  即使生活用不太到依舊要知道一些過去自我文化和傳統。


  這是台灣許多生活、在部落長大的新一代小孩的寫照，加上過去與現代之間的思想碰撞，

  部落的孩子往往面臨走出去或回家去的兩難，在想被人看到與如何不忘根的矛盾下，夢想

  究竟是必須出走？還是終究得回家。


  以台灣原民舞蹈團紀錄為出發點的紀錄片《跳進部落的孩子》，敘述關於在國際上成為傑

  出舞者、編舞者－布拉瑞揚，在多年後選擇回到台東故鄉，成立布拉瑞揚舞團，與非科班

  出身的原住民青年舞者創作原民群像的當代舞蹈。當同時面對於生活亦舞蹈的原住民舞者

  ，舞團的未來與表演舞者的不確定性，是布拉瑞揚所擔憂與無法捉摸的。






  《跳進部落的孩子》是什麼電影？


  在一些台灣原民部落觀光，往往在各縣市觀光欄目會想上部落的舞蹈表演與祭典，有些歡

  迎遊客體驗或加入，有些則是公告表示日期並無進一步的資訊。雖然現在我們常在一些如

  九族文化村、地方或國家表演廳聽到或看到原民的舞蹈與傳統歌謠，但是以過去傳統的一

  部分來說原住民的唱歌與舞蹈，其實並不是拿來表演的一部分，而是以他們過去的生活與

  信仰有關。


  甚至在祭典中起舞也是儀式的一環，連結部落所有人與他們土地、祖靈精靈信仰有關。而

  在現代部分開放表演與遊客觀禮，許多時候是一種讓外人看見原民的一種手段，和讓更多

  人了解這種台灣本土的土地、族群信仰。


  在當代舞中由於，原住民的舞蹈與習俗信仰、生活，涉及到原民本生的文化遺產，往往會

  採用合作的方式，例如知名的雲門舞集、優人神鼓等，都曾經合作與用自己的方式演藝原

  住民與台灣土地故事。而許多原住民舞者也多半會透過舞蹈與身體展現出自我族群的特色

  ，並用現代、當代舞展現出自我的身分認同，並且在當代多元文化中，許多舞團與表演團

  體也不全都是原民單一族群，各部落之間與白浪的混合，也展現出原住民文化在如今台灣

  生活中不可或缺的一環。





  紀錄片《跳進部落的孩子》，是導演王政一，從編舞者布拉瑞揚，成立布拉瑞揚舞團初期

  開始，就紀錄長達八年的拍攝，紀錄布拉瑞揚舞團的舞者、舞風和創辦人布拉瑞揚為何會

  回到台東成立自己舞團的原因。這部紀錄片採取非線性的說故事方式，也沒有固定的人物

  介紹，而是將原民文化、舞者還有布拉瑞揚之間，以舞團為中心來敘述故事，整體來說像

  是環繞在舞團之間點點滴滴的VLOG，甚至也記錄不少，演出曲目和舞者們的生命故事。


  布拉瑞揚・帕格勒法是台東嘉蘭部落的排灣族編舞家，小時候曾受雲門舞集《薪傳》演出

  的啟發，後來擔任雲門舞集舞者，和到歐美等地跳舞、編舞等。在2015年後回到台灣成立

  自己的布拉瑞揚舞團，將自己的原住民部落文化和當代舞作結合，並培育非正規訓練的原

  住民青年舞者。


  在《跳進部落的孩子》電影中，有拍攝出許多以這些舞者心境和成長為項目的演出節目，

  他希望透過舞蹈，讓舞團成員展現出對自身的迷惘與未來成長，一起與觀眾找到生活中的

  共鳴，和繼續下去舞蹈的力量。









  《跳進部落的孩子》分析與延伸：


  布拉瑞揚舞團的舞風介於現代舞與當代舞之間的整體概念，而整體而言，當代舞比較是布

  拉瑞揚舞團的核心，以在電影中表演幾部經典，如由投十塊錢的卡拉OK的原住民小店唱歌

  文化延伸的舞目《＃是否》、工地條紋帆布、被颱風侵襲後一片狼藉的場地，苦中作樂的

  原住民嬉鬧《漂亮漂亮》等。


  這些舞目都展現出當代舞中以「生活行為和肢體語言」做為舞蹈的理念，而在原住民從小

  到到的生活中，這樣將生活融入舞蹈，和隨樂曲起舞的概念，其實在日常生活比比皆是，

  可以說當代舞的文化，其實某方面展現出這時代每個人都是表演者的概念。


  當代舞與現代舞其實目標有點不同，一般來說現代舞是反制式與傳統舞蹈，以西方一個明

  顯的例子就是「反芭蕾」，制式化的舞蹈動作與編舞，整體而言是比傳統的舞蹈更展現出

  內在情緒的身體解放。而當代舞則是現代舞的再延伸與再挑戰，並且有著身體政治性。有

  時候當代舞比較不是完全都以跳舞為主，他有可能是行為藝術、日常行為的反覆、或是融

  合藝術，和不同載體的表演。也就是將舞蹈延伸到任何人、任何時候、任何題材都可以成

  為舞蹈的一部分。






  布拉瑞揚舞團一方面有著原民舞蹈傳統基底，如牽手、團體舞步，一方面又以生活、政治

  來展現出不同的舞蹈結構，而展現出身軀。它可能是一種無法放手、痛苦或持續下去的展

  現，例如舞目《阿棲睞》牽了就不要放掉、不斷勞動、日復一日的持續下去，痛苦但有彼

  此牽絆。


  《跳進部落的孩子》紀錄片中滿多展現出這種舞蹈在排練、呈現、解釋理念的過程，但由

  於它不流於制式化，故更多的時候是以各種小片段拼湊而成。有些則從發想和舞者本身出

  發的舞目，可以讓觀眾看見，舞蹈從頭到尾的發想過程，這點相當有趣。


  整體而言《跳進部落的孩子》紀錄片很像是一種舞團的導讀，與對於舞者每個人的跳舞敘

  述，如同布拉瑞揚自己也清楚的，很少會有舞者永遠地留下，布拉瑞揚舞團可能會來來去

  去有著各式各樣的舞者與舞目，或是展現出不同的表演形式。但整體來說，布拉瑞揚展現

  出的是當年原住民所沒有的一部分，從喜歡跳舞、想要跳舞、跳舞是否可以當飯吃、跳舞

  是我的工作，一直到永續的舞蹈。這些是電影中有趣的思索點，也是一種原民傳統與當代

  舞蹈碰撞下的魅力。








  《跳進部落的孩子》值得一看嗎？


  這部電影其實是一部時而嚴肅、時而又有趣的地方，整體而言它很原住民又不同於一般原

  住民電影。在台灣原住民電影很長會講到的幾個點：部落、土地、自我認同，在《跳進部

  落的孩子》中被提及時並沒有用很嚴肅、很乏味的方式去表現，反而都放進舞蹈之中。也

  就是說在這部紀錄片中，每個舞者的生活、原住民對於生活的態度、各種不同的多元風格

  碰撞，最終都成為了一齣舞蹈，用身體來說話，來表達，關於我是怎樣的原住民？或是布

  拉瑞揚舞團是一個怎樣的舞團。


  以布拉瑞揚舞團為主，有很大的一段在講述布拉瑞揚這位舞者、編舞者的生平，和踏上國

  外與回國成立舞團的過程，《跳進部落的孩子》電影有嘗試跳出一般的傳記式說法，以比

  較隨興隨拍，再把布拉瑞揚一些隨興的對話和自白剪入片段之中，展現出真實的模樣。


  對於舞者們的展現，也是如此，訪談多位曾經在或現在還在的布拉瑞揚舞團的舞者，用有

  趣巧妙的剪輯方式，展現原住民舞團率性、可愛的一面。不過也因為這樣電影整體來說重

  點與主題感有些薄弱，雖然跳進部落的孩子電影名可以讓人想像到電影內容，但其實並不

  清楚，重心到底是布拉瑞揚本人？還是布拉瑞揚舞團表現方式，這點是很模糊的。






  根據導演幕後影談的說法，布拉瑞揚本人至今並沒有實際觀看過這部電影，甚至兩邊對於

  電影呈現的方式，有一些分歧和衝突。在一些訪談中，布拉瑞揚也表示過自己沒有看這部

  紀錄片，但會透過其他人轉述電影內容。


  《跳進部落的孩子》紀錄片對於裡面主角布拉瑞揚，是一種自我暴露的壓力，裡面有太多

  時候讓布拉瑞揚感覺是在講人與人之間、他與舞團和親友之間的生活和糾結。被放在大螢

  幕上，他自我感覺沒有辦法承受這一些在自己眼前很現實的關係。


  雖然導演有敘述關於電影的最後，布拉瑞揚尊重他的呈現方式，但我覺得導演其實有加強

  許多在布拉瑞揚舞團的演出，弱化一些布拉瑞揚人生和敘述，這一點有可能也是基於布拉

  瑞揚想表達不要那麼赤裸的立場，所做的一些調整。但這樣的調整雖然尊重被攝者本身，

  但也讓作品整體主體變得較為模糊，布拉瑞揚覺得這部電影應該是屬於布拉瑞揚舞團、表

  演者、和觀眾。而他只是其中一塊拼圖，但就電影本質來說，他這塊拼圖其實還是最主要

  的那塊，故我覺得這也成為《跳進部落的孩子》電影，最後無法聚焦於甚麼主題為中心的

  原因。




  --

  個人Blog：

  小說連載頁：


