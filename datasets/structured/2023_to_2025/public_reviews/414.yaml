url: https://www.ptt.cc/bbs/movie/M.1746080248.A.E54.html
title: '[好雷]《跳進部落的孩子》:沒電的時候就看這部'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《#跳進部落的孩子》好雷影評：沒電的時候就看這部\n\
  \n#推薦語\n太美、太震撼了！進場前完全不認識布拉瑞揚舞團，觀影過程不斷被觸動。是一部無法被\n爆雷的紀錄片，想訴說的故事都在每個當下、每個舞步。\n\n好看到想請人去看了。有夢的人、迷惘的人、想要開心看電影的人都來看～\n\
  \n#無處不在的生命力\n\n《#跳進部落的孩子》是屬於布拉瑞揚舞團的紀錄片，他追溯到布拉瑞揚老師為何成為舞\n者，談到每個團員與作品背後的掙扎與脈絡，最後也給予想像畫面暢想舞團的未來。\n\
  \n最令人震撼的是滿溢的生命力。舞團充滿魔力的舞蹈不在話下，團員的生命故事、布拉瑞\n揚本人的人生歷程與反思，還有耆老的吟唱。有笑有淚，給予每個追夢人無比的感動，看\n\
  完全身充滿力量。\n\n#漢化與父權\n\n影片中布拉瑞揚老師談到，在過去他曾經因為國語不標準而遭受異樣眼光，又在國語變得\n標準後感到自豪。這樣的覺察進一步推動他把族語帶回來的意念。\n\
  \n這個段落讓我馬上想到父權（最近爆紅的《混沌少年時》也有討論到）。男孩從小就被鼓\n勵剛強不能陰柔，甚至遭到排拒，為了融入而表現剛強，就會得到其他人的尊重和認可，\n\
  進一步強化整個體系的傳承延續。\n\n在那個當下，為了存活和立足，我們都可能經過同樣的流程，被馴化和同化。但後設的思\n考與整理，可以幫助我們辨識自己為何成長至此，並自主決定未來發展的方向，無論是擁\n\
  抱本心或融入群體。\n\n#父子的結\n\n片中另一個觸碰到我的點，就是布拉瑞揚和父親的拉扯。父親並不支持他成為舞者，甚至\n連回鄉舉辦的演出也未出席。那樣難以言說的張力與情感，無論是家長和小孩都會被牽動\n\
  。\n\n我本來感到寬慰和理解，相信有些結一生可能都解不開。但後來老師在QA提到，爸爸後來\n參加了《跳進部落的孩子》的首映，也很關心舞團成員的生活。\n\n\
  很高興《跳進部落的孩子》能成為他們父子和解的助力，也很慶幸自己能觀賞這部作品，\n及時給我的生命注入新生的活力。\n\n\n\n網頁好讀版 >>\n–\n\n\
