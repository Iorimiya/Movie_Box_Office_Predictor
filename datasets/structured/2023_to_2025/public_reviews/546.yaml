url: https://www.ptt.cc/bbs/movie/M.1739274774.A.70B.html
title: '[好雷] 完美伴侶-完美愛情，能有幾分真？'
content: "原文>>> \n\n\n\n這世界沒有真正的「完美」，尤其在電影裡提到完美，那絕對是有鬼。\n\n艾莉絲與喬許在超市邂逅，兩人一見鍾情，成為彼此夢寐以求的「完美伴侶」。他們倆一\n\
  起到湖邊小屋共度假期，和另外兩對情侶一起分享彼此有多愛對方，此時神秘的小屋主人\n對艾莉絲拋出一個邀約，讓這場甜美假期露出暗藏在「完美」之下的裂痕……\n\n\
  不少人建議觀影前避開電影的任何相關訊息，因為對這部電影了解得越少，驚喜越多。雖\n然我個人是覺得不會太影響這部電影的精彩程度，即便提前知道部分劇情，它依然能帶來\n\
  足夠的衝擊。\n\n（以下有雷）\n\n\n\n\n\n\n\n\n\n《完美伴侶》的劇情類型很難不聯想到《黑鏡》，主題圍繞在科技所衍生出的故事，而《\n完美伴侶》所選擇的愛情題材，在《黑鏡》的集數中也並不罕見，如果是《黑鏡》的粉絲\n\
  ，應該在電影開始不久，就能大概知道劇情走向。\n\n但即使如此，《完美伴侶》還是能給足驚喜，可以看到癟腳的犯罪手法鬧出的笑料、發便\n當不眨眼的驚嚇不斷、你追我跑的峰迴路轉，觀影過程還是創造出很難不喜歡上這部電影\n\
  的轉折。\n\n《完美伴侶》透過機器人的主從關係，將「被控制的愛情」詮釋地毛骨悚然（再次想到去\n年最喜歡的影集《馴鹿寶貝》）。\n\n艾莉絲在餐桌上和大家分享她是有多愛喬許的，「就像破碎的自己，遇見了一個能夠修補\n\
  的人，讓自己成為完整的個體。」雖然聽來動人，只是說出這句話的同時，就隱藏著危機\n在後頭：那些存在的裂痕真的能永久被弭平嗎？要是這個人離開了，會不會又恢復成破碎\n\
  的自己？\n\n當傷口無法靠自己痊癒，依賴便會產生，當依賴越來越深，就越容易被控制。沒有發現自\n己已經深陷在一段感情的控制中而不自知，最後就會像智商被調到0的機器人，掌控權也\n\
  會是0。\n\n最喜歡的一幕，是喬許控制艾莉絲舉槍自盡的時候，扣下板機前的最後一句話是「不要」\n。\n\n當有了拒絕被控制的意志，才能有一線生機。\n\n--"
