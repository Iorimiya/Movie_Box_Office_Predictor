url: https://www.ptt.cc/bbs/movie/M.1728458813.A.11F.html
title: '[新聞] 《完美伴侶》女主角手放蠟燭上烤！驚悚見血預告曝光'
content: '新聞網址：



  驚悚電影《完美伴侶》公開前導預告，一開始充滿著浪漫氛圍，沒想到風格驟變，華麗的

  場景及露骨見血的暴力場面接連刺激感官，女主角甚至一度把手放在蠟燭上燃燒，眼睛充

  滿淚水，在視覺上及心理層面所激盪出的火花都讓人十分好奇故事發展。



  《完美伴侶》由《宿劫》的製片團隊所打造，由《黑袍糾察隊》傑克奎德（Jack Quaid）

  、《黃蜂》蘇菲蔡徹（Sophie Thatcher）主演，詭譎預告中可以看到女主角蘇菲蔡徹似

  乎被囚禁，遭持槍威脅、被鎖在椅子上、被拖行，背景播放著The Flamingos的歌曲《I

  Only Have Eyes for You》，顯來格外諷刺。



  本片原本預計為札克克瑞格（Zach Cregger）繼《宿劫》後的導演作品，後來改為編劇德

  魯漢考克（Drew Hancock）的導演處女作。其他演員還包括《深櫃奇遇》盧卡斯蓋奇（

  Lukas Gage）、《醜聞真相》魯伯特佛列德（Rupert Friend）等。

  《完美伴侶》將於2025年1月9日在台上映。

  —------------------------------------------




  預告前面看起來很像浪漫愛情片，後面畫風瞬間轉變

  感覺是浪漫驚悚？


  --'
