url: https://www.ptt.cc/bbs/movie/M.1738486817.A.592.html
title: '[普雷] Companion《完美伴侶》 世界觀不夠完整'
content: '雷文防雷資訊頁


  前幾篇文章都是好雷的情況下，加上imdb 目前7.4的情況下，很多人可能過份期待

  因此這邊發個普雷


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  本片的格局真的不大，更像是Black Mirror《黑鏡》第四季第四集

  《約會程式-HangTheDJ》的延伸，編導Drew Hancock首部電影長片

  之前作品都是影集。


  先講優點，編導也無意讓本片格局過大，因此聚焦本片少少的6位主角

  角色的智商甚至比一般人還低，做的蠢事是本片的笑點


  但就連《約會程式-HangTheDJ》也嘗試解釋世界觀的完整性，

  那麼院線電影《完美伴侶》光是加入了警察的角色

  然後警察被殺了後，就沒有後續了，警察局都不知道有警察消失了?


  再來，「機器人」的設定，似乎又有點接近「複製人」?

  一開始提到這個世界的機器人會受到法律的規範

  但沒想到開外掛那麼容易，比iphone還簡單

  不禁令人好奇這個技術到底發展多久了

  編劇應該無意做解釋，就算隨便唬爛也好


  我就是屬於想要多點解釋的那種觀眾




  --'
