url: https://www.ptt.cc/bbs/movie/M.1739513516.A.107.html
title: '[ 好雷] 完美伴侶 Companion '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  好雷 完美伴侶 Companion 再獵奇的故事也比不上人性可怕




  在一個普通的超市

  一位美麗的女子推著cart遇到了一個把橘子全部打翻的男生

  天雷勾動地火

  但為何美麗的女子穿著復古且髮型死板跟男子好像是不同時代的人？





  電影封面照是一個女生翻白眼

  私自解讀為兩個意思

  一個是女主是愛情機器人並非人類

  一個是在感情中忍耐到極致的白眼



  是的 故事一開頭從Iris對於要參加男友Josh的朋友聚會感到很不安

  尤其說出覺得女性友人Kate對她有敵意

  在餐桌上 Iris說出自己對Josh的情感時 大家面面相覷

  當Iris在沙發上跟Kate說覺得自己不受她待見

  Kate說沒有，只是Iris在覺得好像自己『容易被取代』

  直到後面Josh跟Iris上完床倒頭就睡 Iris睜大雙眼看著天花板

  到Iris突然爆發式的拿刀殺了Kate的俄羅斯sugar daddy

  Josh對她喊了：『Iris, go to sleep』





  雖然前面只是要鋪陳Iris是戀愛機器人

  但我對於這段有點孤立Iris的鋪陳特別有感覺

  因為如果是正常的男友 其實是該特別顧及女友感受

  這段把Iris的不安全感詮釋的很好

  雖然是機器人 但一定也真實發生在現實情侶當中吧



  後面接下來一連串可以說是有點荒謬的劇情發展

  更爲這部片增添了許多黑色幽默

  在看一群人在客廳共舞的畫面

  當時還想說 現實生活中的同志情侶 外在條件應該不會差這麼多

  這應該是為了現在DEI潮流的角色設定

  結果Patrick也是機器人哈哈啊哈



  從Josh身上看到好真實的渣男例子

  他是個不錯的朋友 還不差的情人 只是對於某些事沒那麼上心

  但等到真正講到責任 就開始各種 都是因為妳的錯

  然後想要掌控對方 我會這樣是因為怎樣怎樣 都是別人對不起我

  當Josh聽到Iris把血淋淋的缺點講出來就大抓狂

  叫她把手放在蠟燭上 然後燒爛 試圖洩憤

  真的很有現實生活中渣男的即視感 自己無理就用別的方式傷害對方




  最後Iris拿著巨款開車走 遇到隔壁車道的同事（？）

  揮揮自己被燒到剩最初的機械手掌

  雖然赤裸 但是真實 表現出做自己的自由




  真正可怕的是機器人會殺人嗎？

  還是可怕的是把攻擊力調到100的人類？

  現實生活中是不是也有人想要把你/妳的智商調到0呢？




  圖文網誌



  --'
