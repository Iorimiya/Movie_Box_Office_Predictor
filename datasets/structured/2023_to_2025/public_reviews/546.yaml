title: '[好雷] 完美伴侶:來找碴吧'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  完美伴侶非常好看

  以下有劇透

  感覺整個陷害計畫從頭到尾就注定完蛋

  機器人公司的人都很清楚使用者會犯罪

  警察鐵定完蛋

  好幾次男主有機會叫艾莉絲睡覺

  甚至到聲音可以傳遞的距離都沒用

  後來男主打電話過去也不叫艾莉絲睡覺

  還有很多服務劇情的簡單通關法

  只能說這種劇本太難寫了

  場景少演員也少

  成本相當低

  不過設定卻是相當有趣

  推薦所有人去看


  --'
