url: https://www.ptt.cc/bbs/movie/M.1737636695.A.800.html
title: '[好無雷] 別知道太多比較好的《完美伴侶》'
content: "在板上抽中試映會中午場候補\n事後查IMDB才知全球尚未上映（所以還無法評分）\n有幸成為世界上第一批看到本片的觀眾\n重點是，本片很好看，非常精采有趣\n\
  \n試映會進場被要求手機開飛航模式\n由工作人員裝進破壞袋，令人印象深刻的試映經歷\n\n\n建議大家不要估狗本片任何資訊\n一堆標題爆雷的宣傳稿XD\n很慶幸自己像白紙一樣進場\n\
  因此完整體驗本片的處處驚喜\n這篇也盡量無雷\n\n一開始會覺得大家對待女主角艾莉絲的態度很奇妙\n深究細節也是各種不自然\n直到揭開第一個謎才恍然大悟\n這些都是伏筆\n\
  \n當然驚人的也不只這件事\n內容反映了這類型的片種常描述的人心之惡\n還有一直在探討的議題\n觀賞時會想到這領域的名作，尤其結局\n但編排適宜，不僅不會落入窠臼\n\
  仍然讓人看得又驚又笑\n\n角色安排也是很有意思\nDEI運用得恰到好處\n有多元性向和人種，有女權（？）\n即使一開始不愛同志支線的人\n後來應該也能看得出穿插這段的意義\n\
  不只與男女主角做對比\n而且對後來的劇情也有其影響\n\n其中也反映了「部分男性」對男女愛情觀差異的想法：\n男性與乖巧聽話的對象談戀愛的強烈需求\n無論性向、溫拿或魯蛇\n\
  只要有$$$就會滿足\n女性則是看客觀條件（？）擇偶\n\n本片的尺度是驚悚片\n雖然有撒血漿的場面，但不至於太血腥\n殺人手法很直接，沒有凌遲場面\n所以討厭看傷口、斷肢特寫的可以安心\n\
  \n\n--\n\n     「完全犯罪就像第一次下廚的的老爸，注定會失敗。」\n\n                                    \
  \                －古畑任三郎\n\n--"
