content: "★ 今年開春最驚悚\n★【手札情緣】及【宿劫】團隊攜手打造\n★【完美伴侶】 1月29日 (週三) 春節 浪漫懼獻 陪你睡睡平安\n★  電影預告：\n\
  \n\n居家監禁、野外拖行、綑綁PLAY 、相愛相殺\n看似完美感情的背後，隱藏著駭人的真相\n\n艾莉絲的人生有兩次最快樂的時光\n\n\n第一次是遇見喬許那天\n\
  第二次是殺了他的那一天\n\n\n《抽獎方式》\n1月17日 23:59前，推文留言分享想看的原因，就有機會獲得電影特映券\n（如：台北場，我想看完美伴侶，想看男女主角綑綁PLAY\
  \ ）\n\n\n《獎項內容》\n【完美伴侶】電影特映券（一組2張）\n\n\n《特映會場次》\n中午場：1/21（二） 12:30  欣欣秀泰 X 25組\n\
  台北場：1/22（三） 19:20 台北松仁威秀MUVIE CINEMAS X 10組\n台中場：1/22（三） 19:00  台中文心秀泰 X 10組\n高雄場：1/22（三）\
  \ 19:00  高雄夢時代秀泰 X 10組\n\n《中獎通知》\n1月18日公布中獎者於回文內，並寄站內信通知得獎者得獎事宜。\n請於1月20日12:00 前回覆領獎資訊，恕不接受逾期回覆。\n\
  \n《注意事項》\n1.特映券為非賣品，嚴禁兜售等圖利行為。\n2.請準時入場觀賞，電影開演後10分鐘戲院與主辦單位有權謝絕入場。\n3.如本活動因不可抗拒之特殊原因無法執行時，主辦單位有權決定取消、終止、修改或暫\n\
  停本活動與延遲得獎公告。\n更多電影資訊：華納兄弟台灣粉絲團 \n\n--\n\n--"
