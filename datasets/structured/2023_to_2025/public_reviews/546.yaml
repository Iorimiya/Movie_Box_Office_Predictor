title: '[好雷] ，內文無雷，大推〔完美伴侶〕'
content: '很久沒有進電影院

  自從串流影音崛起


  電影院的片子很難有吸引我進去消費的慾望


  感謝小編抽中我看〔完美伴侶〕特映會


  難得跟先生生有了小孩還走進電影院


  這不是一部爆米花片


  也不是單純嚇人的驚悚片


  是一部引發思考的片子


  前後呼應，劇情合理


  看完心情也不會沉重，或作惡夢，或不開心


  如果說全面啟動、星際效應、頂尖對決我給100分。


  這部片我可以給90分。


  --


