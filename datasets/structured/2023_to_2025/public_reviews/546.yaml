title: '[完美伴侶雷] 什麼時候發現女主身分的？'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  完美伴侶在版上被大家力推，大家都說不要看預告就去看才能得到最佳體驗。

  遵照版友們的建議沒看預告直接去看，對本片的認知只有女主翻白眼的海報，其他什麼都不知道。


  然後電影開始5分鐘就知道女主是機器人

  爛男喬許叫艾莉絲起床時她眼睛很明顯沒有閉眼

  兩人到別墅時爛男喬許背著小背包，兩個行李箱都是艾莉絲拿

  凱特開門後對艾莉絲不是無禮而是無視

  凱特在沙發上對艾莉絲說的話


  線索超多


  小胖伊萊的男友在講他們相遇時的故事時，男友對小胖的形容詞美好到太刻意，加上男友俊美外表讓我也開始懷疑他不是人

  然後，大家都知道了


  那麼多線索明顯到讓我懷疑

  「不會這麼簡單吧」

  結果劇情就是那麼單純


  唯一沒猜到的大概只有凱特和爛男喬許沒姦情、賽吉只是有錢的草皮商這兩點而已


  想問問真的有版友完全沒猜到劇情發展的嗎


  -----

  Sent from JPTT on my iPhone


  --'
