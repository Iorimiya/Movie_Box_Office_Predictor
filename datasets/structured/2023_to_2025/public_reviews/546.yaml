content: '真的是不建議看任何的預告、文章，

  連它是什麼類型的電影都不知道更好，

  哪怕一個小細節就會影響到觀影樂趣。

  回家補看預告片會覺得還好沒看過預告，



  劇情安排算合理，但總覺得不夠力，

  有的地方覺得結束的有點突然，

  蛤？就這樣，我以為會變成什麼X!@#@

  會自行腦補其它看過的電影劇情做發展，

  但它就是這樣結束了。



  看完後覺得算是個小品電影，

  想去電影院真的沒啥強檔是可以選來看，

  但如果是我朋友要看的話，我是會建議等串流。



  不過電影中有的設定也許往後的電影可以參考，

  也許現實生活中真的會出現也說不定XD。

  ----

  Sent from  on my iPhone 11


