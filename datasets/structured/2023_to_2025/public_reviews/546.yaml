title: '[討論] 完美伴侶設定問題（雷）'
content: '剛看完完美伴侶這部電影


  覺得有點設定問題


  從一些地方可以知道，伴侶機器人已經存在，並且已經有人‘’可能‘’拿來犯罪等等


  1. 從同性戀伴侶機器人得知，這款機器人已經五六年以上，代表伴侶機器人已經存在至少5

  -6以上


  2. 從後面原廠人員來回收機器人，並且表示會觀看錄影錄音時，表示很多人會亂吹，偷偷

  說要可以請男主去法庭扯。


  透過以上兩點，再想到中間出現的警察，竟然對於是機器人或是人類沒有一點防備及手段，

  實在是不太合理


  不知道大家怎麼想？


  --'
