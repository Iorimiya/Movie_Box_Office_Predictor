title: '[情報] 《佛萊迪餐館之五夜驚魂》全新預告'
content: '《佛萊迪餐館之五夜驚魂》的新預告片已發布。






  《佛萊迪餐館之五夜驚魂》的全新人物海報。




  改編自恐怖遊戲《玩具熊的五夜後宮》。




  電影由艾瑪塔米執導，《飢餓遊戲》喬許哈卻森、《安眠書店》伊莉莎白萊爾、《驚聲尖

  叫》馬修利拉德等人主演。




  北美 於10 月 27 日萬聖節檔上映。






  --

  有台版海報應該會上'
