title: '[普好雷] 佛萊迪餐館之五夜驚魂'
content: '看到各種網站分數都很低

  實際上看覺完得....還可以阿XD

  可能因為我不太愛看恐怖片

  當初遊戲只敢看別人實況不敢自己玩

  整體來說故事完整 玩偶可愛(?

  幾段氣氛也有到位

  以驚悚而不是恐怖片的角度來說觀賞可能比較適合

  至少我覺得及格啦 看完還挺開心的

  意外的算是不敢看恐怖片的粉絲也可以無壓力觀賞的電影


  當然如果你是想體驗被嚇的感覺的傳統恐怖片觀眾

  那可以略過

  嚇人的點非常的少XD 連jumpscare都不多大概4.5個吧

  看到某些網上評論這片定位是給兒少看的恐怖片

  算是有點荒謬都又很貼切的形容XD















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  首先美術真的很到位

  那個餐館那個玩偶那個閉路電視畫面

  明明是歡樂卻又驚悚的氛圍重現得很好


  開頭警衛被殺的氣氛做得很好

  那個改造道具很有奪魂鋸風格

  一直到後面四個路人送死都是很典型的恐怖片路線

  但是幾乎一滴血不見 畢竟PG13


  結果主角妹妹上場以後風格鬼轉

  還出現主角女警妹妹一起跟四個玩偶在餐館搭堡壘和樂融融???

  這真的是在遊戲中完全無法想像的荒謬畫面XDDDD

  可能有些粉絲會覺得這段風格不合(對某些粉絲來說可能是夢幻場景)

  但我當下覺得還滿娛樂的XDD


  劇情上算是完整

  主角到職的理由 發現異常還是不辭職的動機也算清楚

  比較少恐怖片主角一直自己送死的愚蠢感

  (四個路人倒是一個比一個蠢 特別是保母)

  過去的事件有串聯起來

  妹妹的畫圖能力最後也用上

  大魔王真的比較無言一點

  打開來是個兔子裝老頭真的有點好笑

  直接用怨靈比較好吧 反正其他玩偶也都是怨靈附體了

  甚至不穿兔子裝本人出場都比較合理一點

  尤其最後還死於自己穿的玩偶裝的彈簧機關

  還死得很慢又很不血腥

  實在是很沒有力道的結尾XD


  --'
