title: '[雷] 佛萊迪餐館之五夜驚魂2-fnaf無限之戰'
content: "成人版動物方程式\n啊不是\n\n會說無限之戰是因為基本上是角色全明星出演，根本復仇者聯盟，但因為故事還有的演，故\n非終局之戰。\n\n以下有全面劇情大雷+遊戲彩蛋+故事吐槽還有個人推論。\n\
  趁還沒下檔（估計2個禮拜內台灣就沒了）趕緊來不吐不快\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n開始啦\n—-\n\n開頭介紹了一間新弗萊迪餐廳，有飄飄船、海盜船等各種設施。\n\
  孤僻的女孩夏綠蒂，常常一人蹲在表演台前等著開演。\n在親眼看到黃色兔子擄人的場面後，追了上去將小孩救出，卻不幸死在了黃色兔子的刀下，\n屍體滑入了傀儡的機關門裡，死在了自己最愛的puppet懷中。\n\
  因為一系列指控，迫使經營者關閉了這間店，重新開了一間新店（就是1的那間），而在照\n片中，與凡妮莎赫然在列….。\n——\n\n劇情接續上集，火燒過後艾比敞開心房上學去了，雖然小古怪但是同學都很好，就是老師有\n\
  點討厭。\n\n艾比一直很想老朋友們，雖然麥克一直說他會將他們修好，但還是無法減少他的思念。\n\n凡妮莎雖然甦醒了，但仍為噩夢所苦，麥克認為唯有直面這段記憶才有放下的可能，建議她\n\
  可以嘗試之前自己的睡眠療法。\n\n因為思念他的朋友，艾比獨自一人跑去了燒過的店內，發現自己的朋友消失無蹤，趕來的麥\n克安慰他後，讓艾比從廢墟裡拿走了一個對話盒做紀念。\n\
  \n艾比常收看節目裡的靈異特攻隊登場，這次他們打算探查這間有名的本店，順便被花式虐殺\n，包含：\n拿輻射偵測器結果掉進水裡，被迷你傀儡玩偶絞殺的靈異哥。\n\
  關掉傀儡音樂盒作死，下場是被附身的主持妹。\n聽到主持的尖叫，想去救援但被盤據天花板的曼果扯爛的攝影師。\n\n新角色麥可作為警衛登場，明顯是參考自遊戲原作的玩家角色麥可，不過除了裝神秘嚇人外\n\
  ，沒有什麼特別的表現。\n（看到被附身主持人的夏綠蒂朝他尖叫的時候整個大烙跑到安全地帶才講「歡迎回來，夏綠\n蒂」就算預期有城府，逼格也掉了很多）\n\n艾比意外的發現撿來的音樂盒可以與消失的朋友們對話，因為他們的求救，被誘導去了本店\n\
  ，見到了換上嶄新外殼的Chica（為了方便這邊會將新外殼的玩偶用Toy做代稱)，以及Fredd\ny, Bonnie等人。\n雖然有些古怪，不過艾比還是非常開心，與眾Toy系列玩偶度過了開心的夜晚，順便完成了\n\
  科展的作品。\n（透明Chica機器人，結構以外的外殼是透明的，原來Toy Chica會塑膠成型啊…）\n\n凡妮莎在生活中不斷的見到父親的幻影，不堪其擾。\n\
  她決定嘗試夢境療法，經過一番努力，成功面對恐懼，再也不畏懼父親。\n（中間有出現SL的Baby，電玩第5部的角色）\n\n興高采烈的凡妮莎來到麥克的家，正好遇上開心回來的艾比，一聽不對啊，這不是本店嗎？\n\
  （艾比期間還講Toy Freddy手指很肥，捏他了UCN跳殺梗）\n憂心的凡妮莎原本想跟麥克講這件事，卻沒想到大天才麥克完全沒在聽，自顧自的把自己調\n查出來的，夏綠蒂以及凡妮莎的過往一股腦的講了出來。\n\
  結果兩人不歡而散。\n\n這狀況第一集就有，到第二集更是變本加厲，真的是夠了…。\n\n沒辦法，凡妮莎只好自己去本店，一進去就看到停住的音樂盒以及空空如也的音樂盒，\n\
  而被附身的女主用詭異的妝容滑了出來….\n是夏綠蒂，她獲得了軀體，準備向所有人復仇\n（這時說出Puppet經典的，I don’t hate you. But\
  \ you need to stay out of my way)\n但因為凡妮莎設下的結界，讓他無法如償，只好將其囚禁。\n\n艾比拿著完成度很高的Chica機器人去參展，卻被老師故意摔壞，傷心的她再度回到了本店\n\
  向Toy Chica訴苦。\nToy Chica表示自己可以當她的作品，只需要幫她輸入限制他們的密碼。\n在同時，辦公室裡的凡妮莎正被夏綠蒂捆綁著，威脅不交出密碼就殺死艾比，無奈之下，凡\n\
  妮莎只能遵從。\n隨著載入成功，所有玩偶都解除了不能離開店裡的限制\nToy Chica跟艾比又一次搭上了倒霉黑人小哥的車，去到了學校\n（這段有讓Chica秀出了電玩裡喙消失的黑眼狀態，非常還原）\n\
  \n麥克去到了散發傳單的夏綠蒂父親家，深入了解了弗萊迪餐廳的過往。\n聽著聽著才發現，原來凡妮莎跟艾比講的漂漂河設施，是真實存在的本店。\n這才恍然大悟，得知大事不妙的他趕忙離開。\n\
  \n另一邊，艾比的新作品讓眾人無不驚歎，可惜對弗萊迪有成見的老師不僅不讚賞，還做死一\n般的羞辱Toy Chica。\n果不其然，在前去鎖門的途中被逮住，頭被像西瓜一樣壓爆。\n\
  \n來到弗萊迪本店的麥克先是救出了凡妮莎，從她的解釋裡才知道，這一切都是夏綠蒂在搞鬼\n根本沒有什麼新外觀的Chica，有的只有夏綠蒂一人在操控。\n夏綠蒂被凡妮莎的父親-黃兔子殺死，但他卻只怪漠視導致這一切發生的所有父母。\n\
  死後她附身到了傀儡Puppet身上，透過特有的無線系統操控著所有Toy系列玩偶\n（在過程中麥克以及凡妮莎被氣球男孩BB從水裡伏擊，不過除了轉動螺旋槳緩速靠近外並沒\n\
  有幹啥，應該是嚇唬而已，不愧是你BB)\n\n除了Toy Chica在陪伴艾比外，其他Toy系列都被派出去執行夏綠蒂殺光父母的復仇大計\nToy Bonnie找上了一個小家庭、Toy\
  \ Freddy找上了一對無辜的夫婦\n（走過去的途中還路過了弗萊迪祭，被小屁孩說外殼很像玩具，算是捏他原作他們被稱呼的\nToy系列）\n\n得知緣由的麥克決定留在店裡嘗試從系統阻止玩偶，凡妮莎則開車去阻止已經出發的機械玩\n\
  偶。\n（但一問之下才發現這裡沒有門，吐槽這什麼爛設計….）\n\n掌控著一切的夏綠蒂自然不會善罷甘休，啟動了原型系列的玩偶們來阻止麥克。\n（偵測到系統漏洞時跳出的Security\
  \ Breach是最新款遊戲的標題名，同時也是遊戲內的一\n個畫面）\n這些機器人偶看起來與第一集的很像，不過破舊很多，\n伴隨著馬達運轉的噪音以及低吼，這些原型機睜開了眼睛。\n\
  （原型系列啟動時的分鏡很大程度捏了原作遊戲第二集的預告，在我來看根本是英雄甦醒一\n般的熱血磅礴）\n凡妮莎那方則派出了Mangle-曼果（原Toy Foxy，被小孩拆裝成有2顆頭的怪物）爬上車子攔\n\
  截。\n\n\n期間麥克如同遊戲一般，一邊手忙腳亂的用手電筒查看進攻的玩偶，一邊查找如何停止無線\n系統。\n這邊高度還原遊戲，自己記得的就有\n-用手電筒照亮看來襲的玩偶是誰\n\
  -戴面具騙玩偶是自己人（判斷過後還真的傻傻的就走回去了）\n-從通風管來襲的Bonnie\n-BB來襲，沒偷走電池但是放高頻率音頻干擾、閃光燈狂照\n（最後被麥克拔掉頭，死好啦）\n\
  -面具對Foxy無效（遊戲裡是因為Foxy面部辨識系統失效）\n-關掉遙控系統讓全部玩偶停機（不是遊戲，但畫面超級捏他5 am at Freddy)\n\n成功關掉無線系統後後，盤踞在Toy\
  \ Chica的Puppet的因為無法再控制玩偶，直接從胸口炸\n了出來，附身到了艾比身上。\n解決其他玩具系列玩偶的凡妮莎雖然首先趕到了，但對於附身的夏綠蒂毫無辦法，只能眼睜\n\
  睜的看著自己被Puppet的手臂逐漸勒斃。\n此時麥克趕到，使用夏綠蒂父親託付的音樂盒成功讓Puppet睡去，強迫她解除了附身（音樂\n盒裡的芭蕾舞娃娃是SL的Ballora造型）\n\
  \n本想說一切都解決了，沒想到本集的幕後黑手，麥可出現，他是凡妮莎的哥哥。\n伴隨著他的出現，關閉的眾人偶也在Puppet的操控下再度啟動，瞬間將它們包圍了起來\n\
  原來就是他將Freddy餐廳鬧鬼的傳聞渲染，促成了弗萊迪祭典的舉辦。\n目的就是繼承父業，讓夏綠蒂以及眾玩偶大開殺戒\n（恩，真的很白痴，不過原作本來就全家都有毛病）\n\
  \n凡妮莎表示她已經有家人了，就是麥克以及艾比。\n麥可對她老姐背棄了家庭感到非常失望，不過也沒差，命令眾人偶將凡妮莎等人撕成碎片。\n\n萬念俱灰。\n\n\
  此時，一陣熟悉的低哼響起。\n還沒反應過來，Toy Bonnie就被一根駭人的勾爪拖去了窗外，伴隨著腳掌落下，紅色的身軀\n現了出來。\n是Foxy！\n\n\
  窗外的Mangle則被一個藍色身影撲倒，殘暴的撕成了碎片，Bonnie也來了。\n\n而Toy Freddy似乎感到了些許異常，身體劇烈抖動。\n隨後上半身就被整個扯開，扔到了一邊去。\n\
  Freedy登場。\n\n見人偶都被輕易的擊敗，夏綠蒂也不在從容，操控著Toy Chica逼近艾比，準備要先下手為\n強。\n…\n在她身後的，是真正的Chica。\n\
  她一把將Toy Chica的頭扭下，算是一吐了被假冒的怨氣。\n\n原來，在來的途中，麥可跑去了被火燒過的舊址，向空無一人的大廳喊話，請求玩偶們前來\n幫助艾比。\n\
  \n見朋友有難，玩偶們也沒有遲疑，突破了系統的限制，前來拯救艾比。\n話雖如此….。\n「…」Foxy的勾爪緩緩的垂落。\n「…」Bonnie的頭低著，像是快睡著了一般。\n\
  「…」Freddy身子一斜，倚到了牆壁上。\n「…」Chica則往後一攤，坐到了地上。\n他們無法離開弗雷迪餐廳，離開就意味著系統的損壞，這副軀體已經無法再供他們棲息。\n\
  \n「他們會死嗎？」艾比哭喊著\n「我們只是去到了更好的地方。」一個金髮男孩突然出現在眾人旁邊。\n是Golden Freddy\n「那麼，就之後見囉。不過，也不要這麼快啦？」\n\
  他安慰著艾比\n\n「麥克，你必須知道，我們走了後，就再也沒人能壓制住”它”，而它一定會回來。」\n「什麼？你在說誰啊？」麥克疑惑道。\n沒等他細問，男孩就消失了\n\
  \n就在奔逃的麥可被一拳打暈，準備要happy ending的時候。\n麥克卻憤怒的叫凡妮莎不要靠近他們，她太危險了，不能相信。\n結果傷心的凡妮莎就被傀儡趁虛而入附身了，結束。\n\
  你媽的….。\n\n片尾彩蛋就是幾個小混混在密室找到了腐爛的黃色兔子，因為腐爛已經變成經典Springtrap\n外觀，隨著眼睛緩緩發出了藍光，續集看來勢不可避了。\n\
  \n——-\n\n個人疑點/推論\n\n阿姨一直跟別人講fnaf鬧鬼的故事，不過記得她第一集被Golden Freddy掛掉啦？\n\n店內找不到Chica等人可能是因為眾玩偶躲在密室裡壓制/折磨Springtrap，最後被發現也是\n\
  同理，玩偶消失，密室就無法再被隱藏。\n（遊戲裡黃兔子裝是唯二的人形/機器人兩用套裝，因為常常有員工被夾傷，所以有一間安\n全房，讓著裝者出問題時可以進去，這房間沒有攝影機，也沒有在玩偶的資料庫中，所以是\n\
  一間密室）\n\nBB是否有自我意志？\nFnaf最神秘、最討打的氣球男孩在這集正式登場，基於其他Toy系列都帶有一點自身機器玩\n偶的性格，BB可能也只是受到夏綠蒂的操控而已。不過他基本上完全沒傷害麥克，只是嘲諷\n\
  +干擾而已，或許他是更高等級的存在…？\n（這傢伙在原作也是個奇特的存在，到底有沒有靈魂在內都是個能討論一大串的問題）\n\nToy Chika不知道為啥有兩用式內骨骼。\n\
  Toy chica要殺掉艾比前有用裸露的內骨骼威嚇，記得第一集有個洋娃娃造型的內骨骼也有\n類似的設計，看起來電影是直接設計成全部兩用了？\n（遊戲裡黃兔子跟golden\
  \ Freddy是兩用套裝）\n\n夏綠蒂怎麼知道艾比的？\n忘記先後，應該是艾比先撿到對話盒-夏綠蒂附身倒霉蛋-夏綠蒂誘導艾比過去-得知後凡妮\n莎也過去了-脅迫凡妮莎給出密碼（讓他可以離開）\n\
  仔細想有點怪，中間都挺剛好的，有很多資訊落差應該是麥可從中給消息？演出上實在沒什\n麼感覺。\n好比開頭對話盒的閃爍，吸引艾比拿時是否就是夏綠蒂在搞鬼？\n\n\
  個人推論：\n麥克一直潛伏等待機會，發現時機成熟（開始有鬧鬼披薩店的傳聞），就加大渲染讓祭典開\n始辦，然後跟半合作對象夏綠蒂計畫殺光所有人\n\n恩…聽起來巧合的地方太多，嘛，反正只是個理論。A\
  \ game theory ~\nXD\n\n\n-\n\n缺點：\n聽說編劇這次是純Scott，看下來有不少割裂的地方\n(原作電玩是以劇情破碎出名的）\n\n\
  好比麥克的人設，各種躁，看完只想掐死他，好好聽人講話大概有一半的事都不會發生\n（不過二刷仔細看看，其實大概從救出凡妮莎後表情就開始不對，最後凡妮莎宣言是他們家\n\
  人的時候更是完全的冷漠）\n\n還有加入的麥可這角色，雖然是致敬原作的警衛，但表現很差，刪掉基本上也沒差。\n\n凡妮莎救人後送去的律師住處，似乎是上集登場的那個？完全沒有get到\n\
  \n最後播出的錄音不確定是捏Pizza Simulation 放火的亨利，還是1-2集打電話來的phone gu\ny\n（ps的亨利是用計畫終結一切後播放錄音，phoneguy則是打完電話後被眾玩偶圍殺）\n\
  \n各人物表現：\n麥克\n又是你，你最爛，前有睡覺睡到沒工作，後有完全不聽凡妮莎的話，有夠欠扁。\n艾比\n傻小孩擔當，基本上是完全被利用，不過經歷第一集後心智還沒長歪，已經是滿分了\n\
  凡妮莎\n眾人都吐槽過的人設「我嘗試警告你，但從沒真的說出口」，阿爸是反派，只要什麼沒講清\n楚就一律推給ptsd，隨便啦。\n麥可\n劇情工具，十分免洗，到底下一集還會不會出來都是個謎。\n\
  夏綠蒂（puppet //marionette )\n真反派，完全有復仇的理由，一個人搞全部的事情，就連結局也都沒被完全擊敗，看來下集\n活躍還是能期待。\n\
  作為傀儡本身沒什麼表現，都是附身到人身上才有動作，小可惜。\nToy Freddy\n電影封面，不過表象都在各種劇中的形象上了（周邊、海報等），實際上在劇中都表現不多\n\
  ，講話的感覺跟UCN很像。\nToy Chica\nC位，戲份超重，聲線讚，還原也高（連黑眼無喙模式都有），取代toy freddy當這集主角\n也完全沒問題\n\
  Toy bonnie\n聲線少了點ucn那種搖滾明星的感覺，小可惜\nMangle\n設定上是被小朋友亂拆亂裝，最後工作人員都放棄急救，乾脆當成賣點的原toy\
  \ foxy。\n炫技擔當，光是知道這是實體道具而非CG就讓人感動萬分。沒講話，但動起來就是讚。\nBalloons Boy(BB) 氣球男孩\n原作唯一不會幹掉主角的機器人，只會偷走電池後在那邊靠杯的笑而已\n\
  電影裡也只是用燈跟音頻干擾麥克，不過麥克一怒之下就把它的頭拔掉了，也是圓了眾玩家\n的夢。\nWithered Freddy(原型機系列）\n破損最少，只有些許破舊。跳殺時還原了原作的動作，笨重笨重的很可愛。\n\
  Withered chica\n下巴合不起來、手斷掉露出電線，驚悚程度很高。沒有講話偏可惜，一樣是被面具騙後呆呆\n的走掉。\nWithered Bonnie\n\
  臉整個被扯爛，露出內部的攝影機，左手還斷了。嚇人擔當，負責進攻通風管，可惜之後就\n沒戲份了，很可惜。\nWithered foxy\n原作是唯一不能被頭套騙的，需要用手電筒趕走。\n\
  破損部位主要在牙齦，整個牙齒都外露。\n啟動時有明顯的野獸吼叫聲，雖然戲份也不多，但光是舉著勾爪進攻的畫面就讓人印象深刻\n了。\nFreddy\n徒手拔掉Toy\
  \ Freddy的上半身，狠人。\nChica\n被夏綠蒂冒用，超火。\nBonnie\n暴力兔子，不知道為啥對mangle毫不留情。\nFoxy\n英雄總是最後登場，\n\
  Bgm dum-dum-dum一響起我差點沒尖叫，海盜勾爪用起來也是帥的一逼，一腳踩爆toy bonni\ne的臉更是潮到出水。\n10/10，My hero。\n\
  Golden Freddy\n這次只有本體金髮男孩出現，作為號令者警告麥克要為之後作準備。\n\n\n\n\n細節補充：\n\nFanf2遊戲在設定是fnaf1前傳，所以原型機實際上就是1的那些玩偶很久沒用被廢棄的樣子\n\
  （故事結束後被翻新成1的造型）。\n\n夏綠蒂附身傀儡與原作相同，但附身後從原作的保護者改成了殘忍的加害者。\n\n麥可，原作遊戲主角，終極倒霉蛋，在電影被改成反派。\n\
  \nSister Location\n凡妮莎夢裡出現的玩偶Baby是第五作Sister location出現的角色，算是第3（4）家分店，\n該店的特色是玩偶都是金屬外殼的機器人。\n\
  Baby,Ballora皆是登場自該作。\n\nPizza simulation\n第六作，免費遊戲，看起來是8bit像素風小遊戲，實際上是集經營模擬、恐懼生存於一身超\n\
  有誠意作品，最後甚至還將整個故事系列作了個完美收尾（至少在安全漏洞sb出來以前是啦\n）。\n\nUCN(ultimate custom night)終極自定義夜晚\n\
  遊戲1-4作都有自定義模式，可自由調整玩偶難度。\nUCN則是作者免費釋出的遊戲，擁有殘暴的50款玩偶參戰（作爲參考，數量次多的是2代的10\n隻），全開下去遊戲畫面會極度的混沌，特色則是被玩偶跳殺時都會有對應的語音嘲諷。\n\
  Puppet, Toy Freddy的台詞彩蛋就出自於此。\n\nSecurity breach(SB) 安全漏洞\n由遊戲公司接手後擴大世界觀、畫面玩法全面升級最新作，是由全新系列搖滾明星Freddy在\n\
  一場表演中安全防護失效倒下作為劇情開頭。\n\n網路神人找到的彩蛋：\n在警衛室保衛的橋段，幾個一閃而過的畫面有出現RWQFSFASXC（全黑神秘bunny)跟shadow\
  \ f\nreddy(紫黑色freddy)\n\n\n—\n\n總的來說\n場面更大，劇情更磅礴（殺人人偶數量來到了2倍，格局有大一點，但也還好）\n但不像是第一集一樣是個完整的故事，結尾為了接續的第三集弄的很糟糕，沒有一個段落的\n\
  感覺。\n\n最終全員登場在我看根本是復仇者集結，有夠讚。\n\n\n\n--\nSent from my iPhone 12\n\nPiTT \n\n--\n\
  亞凱之神說:再買更多亞凱~!\n\n\n\n\n～(￣▽￣)～(＿△＿)～(￣▽￣)～\n\n--\n                            \
