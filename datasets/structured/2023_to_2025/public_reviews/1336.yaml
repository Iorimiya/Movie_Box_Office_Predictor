title: '[新聞] 佛萊迪餐館之五夜驚魂嚇嚇叫北美票房奪冠'
content: '新聞網址：


  佛萊迪餐館之五夜驚魂嚇嚇叫 北美票房奪冠


  2023/10/30 14:47


  （中央社洛杉磯29日綜合外電報導）在萬聖節前上映的恐怖片「佛萊迪餐館之五夜驚魂」

  登上北美票房冠軍，估計進帳7800萬美元，對於一部也可透過串流觀看的電影而言，這樣

  的院線初映表現可說是嚇嚇叫。


  影藝事業顧問公司「娛樂經銷研究」（Franchise Entertainment Research）分析師葛羅

  斯（David A. Gross）表示：「這個開映成績太棒了。」他還說，在北美首映的恐怖片中

  ，「佛萊迪餐館之五夜驚魂」（Five Nights at Freddy''s）排名可能僅次於改編自史蒂

  芬金（Stephen King）小說的「牠」（It）和「牠：第二章」（It: Chapter Two）。


  先前連續兩週奪下北美票房冠軍的「泰勒絲：時代巡迴演唱會」（Taylor Swift: The

  Eras Tour）本週排名居次，1470萬美元入袋。


  「泰勒絲：時代巡迴演唱會」在北美票房囊括1.493億美元，海外票房累計5300萬美元，

  成為全球首部突破2億美元大關的演唱會電影。


  第3名是馬丁史柯西斯（Martin Scorsese）導演的長片「花月殺手」（Killers of the

  Flower Moon），較上週下滑一個名次，進帳900萬美元。這部作品由勞勃狄尼洛（

  Robert De Niro）和李奧納多狄卡皮歐（Leonardo DiCaprio）等A咖影星主演。


  以信仰為主題的紀錄片After Death講述人們瀕死經歷，本週票房排名第4，收入510萬美

  元。


  名列第5的是恐怖片「大法師：信徒」（The Exorcist: Believer），比上週排名下降兩

  個名次，收入310萬美元。


  排名第6到第10的佳作依序為：「汪汪隊立大功：超級大電影」（Paw Patrol 2: The

  Mighty Movie），220萬美元；「超危險保鑣」（Freelance），210萬美元；「聖誕夜驚

  魂」（The Nightmare Before Christmas），200萬美元；「奪魂鋸X」（Saw X），170萬

  美元；「A.I.創世者」（The Creator），100萬美元。 （譯者：紀錦玲/核稿：劉文瑜）

  1121030


  --'
