url: https://www.ptt.cc/bbs/movie/M.1698637595.A.7FD.html
title: '[普雷] 佛萊迪餐館之五夜驚魂'
content: "1. 導演讓我感覺像乖學生\n   拍的時候用大量特寫鏡頭, 換角度敘事這兩點重複運用來進行\n   有點像是教科書會教的樣子\n   這些鏡頭都有設計過,\
  \ 看起來也很精緻\n   不過這樣子比較是拍劇情片的方式了\n   恐怖片在敘事上節奏通常不會那麼密切的\n   這樣子導致片子的Jump Scare缺少了很多壓抑期待感跟驚嚇感\n\
  \   最後這部片就變得有點像劇情片, 不像恐怖片\n   以恐怖片來說, 不及格\n   但我還是覺得導演蠻認真的, 這點感受得出來\n\n2. 跟尼可拉斯凱吉的Willy's\
  \ Wonderland 相比\n   弒樂園是部只有橋段沒有劇情的片\n   這部剛好有點相反, 是空有劇情, 但橋段設計不好的電影\n   玩偶的定位也很尷尬,\
  \ 想要有小孩的可愛感\n   但又做不到弒樂園恐怖殺人那種惡搞感\n   這點是蠻可惜的地方\n   兩相比較, 我喜歡本片稍微多一點\n   Willy's\
  \ Wonderland那個只剩橋段沒故事,\n   看了幾段重複的事件後, 讓人看得很不耐煩\n\n3. 女警察可愛\n   包著全套整齊的制服也很可愛\n\
  \   不過按照劇情這樣子講, 她也算長期共犯了ㄟ\n\n4. 插曲選了Iggy Pop在80年的歌, 這張專輯(blah-blah-blah)我很喜歡\n \
  \  \n   加上有些台詞是我平時創作也會用的\n   讓我對導演好感上升, 希望導演能夠修正問題, 更上一層樓\n   未來可以拍更多好作品出來\n\n5.\
