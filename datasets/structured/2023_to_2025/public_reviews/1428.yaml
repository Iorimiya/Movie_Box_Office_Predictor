title: '[選片] 威尼斯謀殺案 我的天堂城市 千萬別開門'
content: '週末要補班

  所以安排今天特休多休一天

  很多部電影都看了！其他部可以不用推薦

  早上空閒時段打算來看電影

  最晚決定時間9點50分


  目前選手

  威尼斯魅影謀殺案 劇情犯罪

  我的天堂城市 劇情愛情

  千萬別開門 劇情驚悚


  不想呆家裡因為道路施工超級吵


  --



  票房惡魔重返 忘記有這部 不要讓我失望

  不過時間有點晚！


  就決定來看威尼斯謀殺案 最多討論


  好可怕的時事梗 晚點來打心得'
