url: https://www.ptt.cc/bbs/movie/M.1630391558.A.932.html
title: '[新聞] "浴血任務4"確認開拍 梅根福克斯擔綱女主'
content: '新聞網址：


  原標題：





  雖然 2014 年上映的《浴血任務 3》（The Expendables 3）票房收益有些差強人意，不

  過身為本系列大家長的席維斯史特龍（Sylvester Stallone）近年仍極力推動第四集、甚

  至其它外傳電影的誕生，而經過將近七年的準備，《浴血任務》的全新續集如今終於將要

  正式啟動，外媒《好萊塢記者報》（THR）則率先獨家披露了電影的開拍日期、以及新加

  入的卡司。



  這部未定名的《浴血任務》續集

  ，


  。



  本集的導筒這次改交由特技演員出身的《極速快感》（Need for Speed）導演史考特沃夫

  （Scott Waugh）接手，並預計將在今年秋季開拍。史特龍一直是前三集的核心主角，但





  有趣的是，報導裡並未明言本片是「正宗第四集」，史特龍前陣子也在他個人 IG 發文透

  露，

  ，外加史特龍自己和《好萊塢記者報》揭露的開拍時

  間都在秋天，因此今日傳出即將開拍的這部新《浴血任務》電影，很可能正是史特龍先前

  所指的「外傳」作品。



  此外，史特龍過去就早有要替史塔森的角色打造外傳電影的計劃，如今則似乎更加確定，



  --


  看來東尼嘉取代了李連杰......


  --'
