url: https://www.ptt.cc/bbs/movie/M.1695461365.A.4E6.html
title: '[普雷]浴血任務4 無腦依舊故人不再 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  影片版



  2010年上映的【浴血任務】，可說完全是席維斯史特龍一手催生出來的動作電影，這部電

  影原本就是一個致敬1980年代與1990年代英雄動作片的話題作，描繪一個強者輩出的傭兵

  團體，擁有自己的運輸機、重火力與各種強者輾壓海外恐怖組織的故事。


  其實就我個人看席維斯史特龍的歷代作品，史特龍的這種「硬漢聯盟」的構想，應該早在

  2008年的【第一滴血4】當中就已經出現了，在【第一滴血4】裡頭，史特龍飾演的約翰藍

  波隱居在泰國，卻被一組試圖營救被緬甸軍閥抓起來的義工團的傭兵委託當嚮導，結果整

  隊傭兵在與軍閥的遭遇戰當中被俘，藍波單槍匹馬潛入軍閥的營地解救了傭兵們，然後在

  最後的大戰當中，傭兵與藍波與緬甸軍閥的軍隊們開戰，苦苦支撐到援軍抵達。


  雖然【第一滴血4】仍舊是史特龍一人英雄式的作品，但是在這部電影片尾的大戰當中，

  藍波所拯救的傭兵有不少英勇作戰的描繪，雖然說這種描繪也並不是到第四集才有，從【

  第一滴血2：藍波】就已經有被越共俘虜的美軍在被藍波搭救之後一起奮戰的描繪，在【

  藍波3】中也有阿富汗的當地反抗軍與藍波一起對抗蘇聯軍的刻畫。（我一直覺得這個描

  繪現在已經是黑歷史了，因為在真實世界當中，這個「阿富汗反抗軍」後來就催生出奧薩

  馬賓拉登來，而且好萊塢還在911發生前就拍了一部【緊急動員】來反省這件事。）但是

  【第一滴血4】當中藍波與傭兵們在戰場上合作無間，拿著大槍大砲把敵人殺得血肉橫飛

  的場面充滿了娛樂感與熱血，我敢打包票，絕大多數的直男觀眾簡直愛死了這場面。


  因此，在2010年，史特龍帶著自編自導自演的【浴血任務】回來了，這一次除他自己之外

  ，靠著自己的人脈集結的團隊簡直是老硬漢當中的黃金陣容，不但有當年的新秀硬漢傑森

  史塔森、還有過去他在【洛基4】的老對手杜夫朗格，還有香港功夫巨星李連杰、藍迪寇

  楚、泰瑞克魯茲等人，更驚人的是還找到了布魯斯威利與阿諾史瓦辛格客串一角。以及史

  蒂夫奧斯丁、米基洛克等美國硬漢代表。


  回想起來，在漫威超級英雄電影如日中天的2010年代，史特龍帶著這群老硬漢們演出的【

  浴血任務】可說是一個「老兵不死」的頑強逆襲，憑著8千2百萬的預算，硬是殺出了2.7

  億美金的票房，證明了這種故事線超簡單，暴力至上，然後主角團隊的人數靠著分工合作

  （？）屌虐邪惡反派的電影還是有其市場，於是史特龍接連推出了【浴血任務2】與【浴

  血任務3】。


  2012年的【浴血任務2】找了【空中監獄】的導演賽門韋斯特，找了尚克勞范達美當反派

  ，還讓阿諾史瓦辛格與布魯斯威利回來打了一場，甚至還讓B級動作電影的傳奇人物查克

  羅禮士出場客串，這部電影大概是【浴血任務】系列場面最輝煌的一集了，這一次成本多

  了兩千萬，1億美金的預算奪得了3.12億的票房收益，在這一次之後，老硬漢們的聲勢就

  此滑落，2014年的【浴血任務3】雖然又找了幾個新面孔，像是哈里遜福特、安東尼奧班

  德拉斯、衛斯理史奈普等人加入演出，預算減少到9千萬美金，但是票房卻滑到2.06億，

  雖說第三集的商業成績基本上也不能算是差，但是在之後【浴血任務】系列就此沈寂，中

  間一度傳出要製作女性版本的【浴血任務】，卻仍是不了了之，直到2023年，續集【浴血

  任務4】終於來了，距離第一集竟然也已經過了十三年了啊。


  在經過十三年之後，當年還能打的史特龍如今也已經77歲，雖然我個人覺得他應該還能打

  ，但是顯然史特龍自己想要交棒了，浴血幫仍舊健在，只是老大巴尼羅斯打算要退場了，

  打從電影的一開始，劇情設計讓巴尼羅斯找上傑森史塔森飾演的聖誕，硬是藉口自己背痛

  ，纏著聖誕幫他討公道，爭回巴尼羅斯口中喝醉酒賭輸的戒指，卻在聖誕秒速撂倒了酒吧

  中的幾個壯漢之後卻又出手支援的戲，就可以感受到全片的傳承意味，意思就是席維斯史

  特龍還能打，只是比較喜歡看傑森史塔森出招，好讓兩人享受一下彼此的友情。


  其實我還注意到一件有趣的事，【浴血任務4】的劇本主筆寇特溫默，2002年的自編自導

  電影【重裝任務】中，開場也是來了一段西恩賓與克里斯丁貝爾的對話戲，這氛圍果然是

  同一個編劇會寫出來的東西，只不過【浴血任務4】歡樂得多，而如果看過【重裝任務】

  這部片的觀眾，應該都會對片中的主角威能印象深刻吧，寇特溫默當年在DVD的導演講評

  裡頭可是說過他不吃敵人讓主角陷入危機絕體絕命這套，所以他的風格顯然很合【浴血任

  務】製作團隊的口味，接班的傑森史塔森果然在電影當中幾乎毫無懸念的碾壓出場的反派

  。


  當然，這個故事主角必定有需要達成的使命，所以傑森史塔森要因為心繫好友，違反命令

  拯救史特龍卻失敗而被政府代表安迪賈西亞開除，他的女友梅根福克斯所帶領的浴血幫則

  在剛抵達任務點就慘遭俘虜，而傑森史塔森本來只是想要偷偷跟著浴血幫，加入為大哥史

  特龍報仇雪恨的任務，結果在路上碰到了史特龍之前的好友東尼嘉，兩人一起殺上由伊科

  烏艾斯所領軍的武裝商船。


  演到這邊，基本上故事劇情就已經差不多講完了，接下來觀眾就會看到各種傑森史塔森獨

  戰整個邪惡恐怖組織的個人秀，因為故事就只把戰鬥的舞台設定在一艘大船上，所以演到

  這邊幾乎就是傑森史塔森版本的【終極警探】與【魔鬼戰將】，有趣的是，據說【浴血任

  務4】原本傳出皮爾斯布洛斯南與史蒂芬席格都一度是參演的人選，現在想起來，這艘船

  上要是帶隊的是史蒂芬席格，應該真的頗有意思，不過現實之中我們只有【全面突襲】的

  伊科烏艾斯，當然伊科烏艾斯也是很有氣場與魅力，但是很不幸的他與他的小隊碰到浴血

  幫這群人就很倒霉，有傑森史塔森與東尼嘉兩人在船上就已經夠雞飛狗跳了，更別提被俘

  虜的浴血幫成員被放出來之後，整艘船更是陷入主角陣營單方面凌虐反派的一面倒戰況，

  打到最後，敵方的小頭目甚至必須要一人對抗三個浴血幫成員，那場面瞬間變得非常可愛

  ，只見小頭目相當艱難的左支右拙，浴血幫的成員則是爭先恐後的爭相攻擊對手，顯然敵

  方陣營的人完全不夠浴血幫殺啊，打到大頭目伊科烏艾斯時，傑森史塔森跟他一對一打到

  最後，更是被打得只差沒跌倒在地上被浴血幫成員們踩踏了。


  故事到了最後，【浴血任務4】還是讓狡詐的反派翻轉了一下，讓局勢有了點難處，但是

  【浴血任務】本來就是那種直腸子硬漢屌虐聰明人的故事，所以那種小聰明詭計到了最後

  根本難有發揮，陰謀者到最後甚至台詞都還來不及說完就被打成了肉醬，可想而知，硬漢

  們再次得到了勝利，回家開趴喝啤酒去。


  總體而言【浴血任務4】這個系列到了第四集，前三集團隊輪流表現的部分已經被壓縮，

  在席維斯史特龍讓出了戲份之後，傑森史塔森的表演佔了一大半，不過杜夫朗格、梅根福

  克斯與安迪賈西亞等人都還是有不錯的文戲空間，而東尼嘉則是雖然戲份不多，但是一出

  場誰都難以忽視他的存在，伊科烏艾斯則是非常努力的讓自己一人就有對抗整個浴血幫的

  氣場，雖然說他其實撐得有點勉強，但是這並不是什麼問題，反正過去的敵人就算氣場強

  大也是輸得很快啊。


  你若是問我【浴血任務4】爽不爽？我會回答當然爽啊！我好久沒有看到這麼歡樂的動作

  場面了，看這部片會讓我回想起自己青少年時期頭腦簡單只想看打架的幸福時光，如果你

  想要收起腦袋，純粹的只想爽一下的話，【浴血任務4】絕對是可達到這個目標的，當然

  ，只要你不要想著哈里遜福特、安東尼奧班德拉斯、李連杰或是阿諾史瓦辛格都還在片中

  的前幾集的話，因為那個黃金陣容似乎一去不返了。


  --'
