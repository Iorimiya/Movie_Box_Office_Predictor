url: https://www.ptt.cc/bbs/movie/M.1695457782.A.468.html
title: '[負雷] 浴血任務4 真的別浪費錢 '
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n這集真的爛，劇情無邏輯到能用低智商來形容\n\
  \n人物特色呈現方式也是爛到有剩\n\n\n史特龍很明顯打不動，所以連開槍都省略了只需要開開飛機，跟客串沒兩樣\n\n但很怪，劇情中史特龍已知CIA主管是幕後大魔頭二十幾年\n\
  \n要去抓魔頭手下的時候還按著魔頭訊息走導致被偷襲\n\n還得運氣好敵人還放你到機場降落才沒全軍覆沒，要是運氣不好呢？ 連假死機會都沒有\n\n然後自己假死也不留個訊息警告一下浴血幫的人\n\
  \n才導致浴血幫第二次連槍都沒開就全員被抓，沒死照樣是主角團威能運氣好\n\n被抓去當假死屍體的人更可憐，別人是在賭局中正正當當的打敗你，贏得那枚戒指\n\n\
  結果史特龍賭輸不認證，烙人用拳頭把別人正當贏到的戒指搶回去\n\n還更進一步把人抓到飛機上當替身直接燒死？\n\n浴血幫直接進化到看誰不爽就可以直接宰了？\n\n\
  \n\n梅根就是個花瓶，但不要誤解花瓶不一定是負面形容\n\n譬如她在變形金剛一中就是非常讚的花瓶\n\n但可惜真的不知道為什麼要去整形，臉整的非常怪\n\n\
  明明以前就已經很正了卻硬要整的結果\n\n就是臉部表情變得極度僵硬，很明顯臉上有幾個部分皮笑肉不笑，表情肌有問題了\n\n那就只剩下賣肉，但又賣的很刻意，很刻意的穿上性感內衣\n\
  \n很刻意的no bra凸點看奶頭乳暈，一點美感都沒有\n\n\n\n另一個白頭髮的亞裔演員也是個花瓶，連美色都沒有的花瓶\n\n但也不要誤解，其實我覺得這個亞裔演員選的非常好，但完全浪費演員\n\
  \n她叫Levy Tran，人正奶大身材好又帥氣\n\n\n\n\n\n名字跟另一個叫Revy的很像 \n\n戰力就是拿九節鞭當一般鞭子甩來甩去，完全沒有發揮九節鞭的特色\n\
  \n最後還像花癡一樣莫名其妙跟人湊一對\n\n\n至於其他硬湊的黑人跟另一個不知道啥裔的黃金碎嘴男\n\n也是完完全全硬湊個人特色，但明顯只是要湊人種搞政治正確用的\n\
  \n\n而變成精神病的東尼嘉或是反派伊科烏艾斯就更慘了\n\n明明是全劇中武術底子最硬的，打出來的東西還是難看得要命\n\n整部片的武指大概就只有光頭稍微好一點點，其他都完全是浪費演員\n\
  \n\n其他還有很多看了快吐血的劇情跟戰鬥編排........\n\n真的建議別花錢去電影院看，等哪天上好萊塢電影台再看就好\n\n--"
