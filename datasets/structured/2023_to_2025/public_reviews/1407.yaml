content: "痾..好像也沒啥前言可說\n\n浴血幫就這樣啊~\n\n(防雷頁)\n\n\n\n\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
