content: '想看爽片的


  可以無視外媒負評 安心觀看了


  整部片就是前幾集的風格


  無腦劇情 老人聚在一起說垃圾話出任務


  但是我覺得打鬥更爽了  拳拳到肉


  爆破場面也更多


  梅根在裡面還是很性感


  新角色金髮女狂鞭也很正


  還有伊科烏艾斯  東尼嘉的加入很有新鮮感











  ~~~~~~雷~~~~~~~~~~~~~~~~~



  小抱怨一下


  傑森史塔森戲份比其他人多太多


  中間完全是他個人秀


  我覺得其給他人多一些發揮會更好


  東尼嘉打鬥還是這麼好看


  角色帶點喜感很特別


  梅根就是賣臉性感比較多 動作場面很少


  --'
