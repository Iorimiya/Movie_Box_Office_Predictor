title: '[新聞]《浴血任務4》票房系列最慘！監製仍想拍攝《第一滴血6》'
content: "新聞網址：\n\n原標題:\n\n\n2023-09-25\n\n\n《浴血任務 4》終於在上週正式上映，但這部睽違將近十年的續集，卻在觀眾以及影評之\n\
  間一致獲得了慘烈的評價，\n\n\n但就在這部續集推出前，監製凱文金坦伯頓以及萊斯威爾暗示，除了《浴血任務》之外，\n他們目前還正在考慮要將另一個由席維斯史特龍主演的系列重新復甦，儘管史特龍本人未\n\
  必認為這是個好主意。\n\n\n與《Coming Soon》網站談論《浴血任務 4》時，這兩位監製表示觀眾的需求是讓他們決\n定發展哪些電影計畫的一大誘因，\n\
  \n\n\n《浴血任務 4》監製表示：\n\n\n\n\n\n\n\n有時候，凱文會跟我說：『這個嘛，我不確定還會不會拍另一部。』買家也會不斷詢問，\n這部電影的情況就是這樣。所以我們非常認真地發展這部續集，你知道的，這樣我們才能\n\
  做到好。沒有錯，這樣也能為觀眾帶來他們想看的。」\n\n\n然而從上周末的票房成績來看，觀眾們對於《浴血任務》系列的需求可能並沒有兩位監製\n想像中的那麼高，至於這個成果是否將會對他們持續發展《第一滴血》系列的想法帶來影\n\
  響，目前還有待觀察。\n\n\n《魔鬼終結者》以及《月光光心慌慌》等來自 70 到 80 年代的電影系列一直到現在都還\n能持續推出續集，而由席維斯史特龍主演的《洛基》系列也以後傳系列《金牌拳手》的形\n\
  式延續下去，\n\n\n《第一滴血》系列於 1982 至 1988 年間推出了三部電影，之後的《第一滴血 4》則在\n 2008 年上映，再隔了 11 年後則看到了《藍波：最後第一滴血》的上映。而在最近被問\n\
  到是否有意願回演出《第一滴血 6》時，史特龍表明了他並不認為這是個明智的點子。\n\n\n\n\n\n\n雖然另一部《第一滴血》電影確實充滿了許多可能性，例如推出前傳，或是像《金牌拳手\n\
  》一樣讓一位新角色繼承藍波的衣缽，但放下這個系列，並著手打造另一個全新系列當然\n也是另一個選擇。\n\n\n--"
