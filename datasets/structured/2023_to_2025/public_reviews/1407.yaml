url: https://www.ptt.cc/bbs/movie/M.1695489240.A.E2D.html
title: '[負雷] 槽點滿滿的浴血任務4'
content: '雷雷雷雷雷雷滿滿的大負雷*[












  自從二寶出生到現在能進電影院看一場的電影已經少之又少了，今天補班又加班還殺回娘家

  ，太座難得開金口給放風，結果看到這部大爛片真的是無言到爆...



  “吐槽點滿滿，尷尬值爆表”


  1. 老套的劇情，開頭一段狂轟猛炸，詐死情節再度上演


  2. 營造了BOSS好像很強的劇情，雙手武器好像很特殊，結果最後沒兩下就被傑森史塔森KO


  3. 一貫的主角群半顆子彈都打不到，敵軍砰砰砰一顆子彈死一個，一點緊張感都沒有


  4. 幾個頂尖中的頂尖傭兵，連手腳都沒被綁關在一個空間這麼大的地方，發呆了老半天戲

  都快演完散場了才靠撒泡尿逃出來？？


  5. 好幾個尷尬又硬要的雙人併排pose特寫，回想起來畫面都很尷尬


  6. 這麼重要的船竟然沒人在控制方向航行讓主角進去亂爽的？？？


  7. 角色一堆沒半個發揮到，出來之後每個人安排一兩個鏡頭，不誇張就幾秒鐘，尤其是狂

  鞭，拿個特殊武器結果也是出來甩兩下就沒戲份，煙燻妝的泰國高手也是，前面講的很厲害

  結果也沒特別強的感覺


  8. 最後果然又是長官叛變，而且主角還25年前就已經知道還可以忍這麼久用這麼北七的方

  式處理？？？


  看完真的是覺得莫名其妙，樓下接力吐槽



  --'
