url: https://www.ptt.cc/bbs/movie/M.1705265065.A.451.html
title: '[討論] 浴血任務4小問題'
content: '(防雷)








  整部片還算OK，但是好看度遠遠不及第一集

  尤其是船上騎車那段真的滿爛的

  梅根福克斯還是很正！


  史特龍找史塔森在片中開頭跟人打架

  因為史特龍的戒指喝醉酒賭輸給了「巨蝦」

  去找他們要回來


  然後在最後說了他把巨蝦抓上駕駛座墜機成了替死鬼

  可是他只是一個小混混，不是什麼軍隊、叛軍還是傭兵之類的

  而且也是因為你自己喝醉亂賭才會把戒指輸給他的

  這樣就把他弄死也太慘忍

  比起你出生入死殺的那些軍隊做的壞事

  這根本只是一件小鎮上的小事情，而且你也痛扁他們了還不夠嗎

  這小混混還真是慘...

  這是不是有點人設破格了啊，對方只是一般百姓小混混而已


  --'
