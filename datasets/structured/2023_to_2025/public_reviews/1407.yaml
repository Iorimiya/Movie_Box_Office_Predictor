title: '[負雷] 浴血任務4 系列粉再考慮進場'
content: '這集...真的...蠻爛的


  三幕戲第一第三幕都很爛

  第二幕色調比較暗加動作戲比較多才勉強可以


  新角50cent跟Fox都不太能打，

  老班底Couture跟Lundgren也都打不太動，

  倒是Levy Tran有給表現機會


  劇本不行就不用多說了，

  後面主角群要放棄撤離的時候根本超怪，

  沒看過這類的片子主角群就這樣說 好這沒救了，只能放他爆炸我們快點逃

  特別是那一段坐船場景特效之爛，根本是KANO以來最假的坐船畫面，

  一群人坐在小艇上飆船閃人然後髮型文風不動是在 ?_?


  還是覺得喜歡前兩集的人可以進電影院看看啦，

  畢竟史塔森跟東尼嘉打得不差，個人覺得這個系列還有救，

  只是這集真的不太行，可以改進的地方太多了


  --'
