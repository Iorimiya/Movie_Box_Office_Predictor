url: https://www.ptt.cc/bbs/movie/M.1695840306.A.AB6.html
title: '[普雷] 浴血任務4  傑森史塔森個人秀'
content: '微雷




  這系列的主旨，


  就是集結各路在全盛時期王不見王的老牌動作英雄，包括阿諾、布魯斯威利、羅禮士、李

  連杰等人，


  一起舉辦一場槍林彈雨的同樂運動會。


  我最愛的則是前兩集，


  簡單直線的劇情、爽快的動作場面、拿捏得宜的戲份分配和各種沒營養的插科打諢，



  就算我不是生在他們活躍影壇的黃金年代，


  也很享受這票人的銀幕魅力。





  第三集史特龍明星想培養動作新秀，


  找來龍達魯西、凱蘭魯茲、葛倫鮑威爾等新人加入，


  同時也請來哈里遜福特、梅爾吉伯遜、衛斯理史奈普、安東尼奧班德拉斯等大咖共襄盛舉

  ，


  卻導致戲份分配失當，


  故事過度聚焦年輕演員，


  擠壓了老牌大咖們的戲份，


  與這系列粉絲期望看到的背道而馳。





  過了九年，才終於又推出了第四部。


  這集的成本和上集一樣是一億美元，


  但這次製作期間遇到了疫情攪局，


  或許包含了不少隱性成本，


  本片整體規模和卡司豪華度都比前三集縮水了不少，


  最後大戰更是只發生在一艘船艦上。





  原本以為卡司縮水可以更專注於平均分配戲份，


  不過浴血幫新增的梅根福克斯、黎薇陳、五角、東尼嘉等人卻還是只有短暫的表現，


  根本沒發揮到多少，更像是來湊人數的。


  本片就像是專門搭給傑森史塔森的舞台，


  在片中秀好秀滿，


  如果是他的粉絲應該會很滿足，


  但《浴血任務》的重點並不是只有史塔森，


  其他動作明星也同樣重要吧？




  反派伊科烏艾斯也是雷聲大雨點小，


  前面表現得很兇殘，


  最後和史塔森過了幾招後就被收掉了，


  和上一集的梅爾吉勃遜有類似的問題。


  而且沒讓他跟東尼嘉打一場真的可惜。




  系列大家長史特龍在這集戲份大幅減少，


  甚至連巴尼這角色招牌的手槍都沒開到一發。


  史特龍或許覺得自己年歲已高，


  不只一次透露過想把系列交棒給傑森史塔森，


  但特地把整集當成他的專屬舞台似乎有點過了。


  查了IMDb 後發現前兩集親自寫劇本、第三集掛story 的史特龍這次完全沒有參與編劇，


  難怪這次的故事有不少淺而易見的漏洞，


  轉場也有種不明所以的割裂感。




  另一個很失望的點，


  是前三集由Brian Tyler創作的《浴血任務》主題曲這集完全沒出現，


  取而代之的是毫無記憶點的過水音樂，


  就算作曲家換人還是能用吧，


  不懂是什麼考量才沒放？


  那首主題曲光是前奏響起就讓人感到血脈噴張了說。


  附上連結：



  抱怨了一堆，


  還是要講一下優點，


  這部動作場面和槍戰爆破塞好塞滿，


  有些老男人笑話也蠻白痴好笑的，


  作為不帶腦、不細究劇情進場看的爽片，還是可以的吧。





  --'
