url: https://www.ptt.cc/bbs/movie/M.1516178104.A.537.html
title: '[新聞] 《浴血任務4》捲土重來 席維斯史特龍宣布'
content: '《浴血任務4》捲土重來 席維斯史特龍宣布將開拍

  2018/01/16 07:40



  〔記者林南谷／綜合報導〕以《洛基》系列電影打響名號的好萊塢動作巨星席維斯史特龍（

  Sylvester Stallone），在2010年自編自導自演動作冒險電影《浴血任務》（The

  Expendables），昨他宣布將會拍攝第4集。



  《浴血任務》在2012及2014年陸續拍攝續集，史特龍為了專注演出退出導演職位，更在2015

  年底傳出該系列將續拍第4集、並以該集作為最終章，不料去年4月卻因史特龍與片方意見分

  歧，一怒之下放棄2千萬美金（約台幣6.1億）片酬，也不惜要離開自己一手打造《浴血任務

  》系列電影。



  前天史特龍在IG上傳《浴血任務4》最新劇照，意有所指留言說：「當你以為安全而出外…

  …現在要回來啦！」暗示《浴血任務4》即將捲土重來。昨天史特龍又進一步上傳他在片中

  角色照片，開心驚曝：「我會回來！」







  officialslystallone





  officialslystallone





  officialslystallone






  --'
