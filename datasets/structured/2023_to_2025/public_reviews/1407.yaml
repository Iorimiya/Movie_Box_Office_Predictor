url: https://www.ptt.cc/bbs/movie/M.1695778738.A.734.html
title: '[  普雷] 新光4D浴血任務4觀後感'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  其實原本並沒想到要看4D版本的..

  昨天（9/26）莫名的很早就醒來，蹲馬桶時滑個手機電影影城app，想說不然來看看浴血

  任務4好了（雖然聽說負評滿滿）威秀要1110！看完去上班太趕，pass！

  咦？新光1030有個“2”D！ 沒想那麼多就衝了，結果現場購票時售票小姐說：這場是4D

  喔，請問需要飲料爆米花嗎？

  我：囧（不過還是買單了

  （解鎖人生第一場4D電影成就）

  其實體驗還不錯啦！

  重機、軍車奔馳時椅座會震動；飛機起飛爬升時椅子大幅度往後傾斜；跳傘空降過程中一

  直有風吹出來www

  至於電影本身其實也沒那麼糟啦，想看武打片的（這武打片是指像李連杰、甄子丹之流等

  ）你會失望！這是動作片！就一堆大多數是80年代的動作巨星結合在一起的爆米花爽片！

  不過史特龍真的老了（77歲）很明顯有傳承意味，整部他沒打戲。就開運輸機密接支援，

  後面開直升機把頭目用機砲轟爛右半部

  高蘭在知道岡納是隊上的狙擊手時一臉驚訝（當時戴著眼鏡）岡納說道：林北這瞄準鏡有

  度數啦！ 後面決戰時一開始打不準，喝了酒茫了之後就準了www

  傑森史塔森佔了整部約70%的打戲吧！各種用軍用小刀戳、削、砍！動作場面是R級！梅根

  很有誠意，片尾穿白色背心很明顯激凸（不過她不應該整形的，原本臉蛋就不錯了！她的

  臉頰看起來硬梆梆，皮笑肉不笑的感覺，給我她在變形金剛時的臉啊） 東尼嘉（泰國武

  打巨星）本片也有出演，他的打戲很棒！


  然後...其實整部片幾乎是浴血幫碾壓反派，烏艾斯最後跟史塔森的對打沒我預料中的一

  開始史塔森落居下風然後暴走反殺；東尼嘉跟拉希還合攻一個小頭目。雜魚們就是各種被

  爆頭、炸飛、刀子戳削...看起來就是不夠被浴血幫們殺的感覺

  特力屋殺手表示：你們殺的夠多了啦，我在第三集才殺沒幾個....


  這部就當作想殺時間解悶用啦！不過那個蝦蝦（還是要叫巨巨？）有夠雖小，被巴尼抓去

  當替死鬼（這部的槽點之一）


  --'
