url: https://www.ptt.cc/bbs/movie/M.1695353796.A.B16.html
title: '[好無雷] 浴血任務4'
content: '這部片反政治正確非常嚴重

  那些影評是不是對這種片很反感

  不過就是要這樣才爽

  .

  裡面充斥 血腥、暴力、貶低女性的對話還有一堆奶子

  男角都包緊緊，女角能露就露

  整部片就是看梅根福克斯賣肉

  尤其最後一幕是男人看了都會硬

  .

  打鬥沒有廢話該殺就殺

  該噴血就噴血

  如果對這些賣點感興趣那值得一看

  想看劇情跟演技就算了，傑森還是演他自己一直都撲克臉

  總之梅根真的是極品

  啊嘶！

  .

  補充一下：整部劇情無聊也沒演技能看，R級內容打鬥噴血居多，只要有女角出場都有奶子但都沒露點…不過梅根最後一幕不好說就是了…

  .

  -----

  Sent from JPTT on my iPhone


  --'
