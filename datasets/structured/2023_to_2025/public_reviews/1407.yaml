url: https://www.ptt.cc/bbs/movie/M.1695639182.A.900.html
title: '[無法給好雷] 浴血任務4 - 沒有誠意的作品'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  看這片的人不就是想看上一世代的動作巨星，

  想重溫一下他們的螢幕風采。


  年紀大了，

  打不動了，

  沒關係啊，

  打打嘴炮總可以吧。


  直接消失是哪招？


  要看傑森史塔森，

  以後機會多得是，

  有必要多這一部嗎？


  洛基5,6，第一滴血4,5，

  都是老了打不動了之後拍的，

  但至少螢幕前演好演滿。


  打不動沒關係，

  用頭腦，用炮，用機槍，用陷阱，

  展現長者智慧，

  照樣很好看。


  結果浴血任務4，

  直接在螢幕前消失，

  簡直是欺騙影迷感情的渣男。


  比起來 阿諾 有誠意多了，

  Fubar 還是滿滿的動作。

  帥氣不減當年，

  還更多了歲月歷練下的成熟穩重。


  總之，

  想看動作片，

  浴血任務4 算是及格。


  但是如果是想看 80 年代動作巨星重出江湖的電影，

  那 4 就沒必要看了。


  --

  美國海軍陸戰隊資深教官，示範如何對付持刀壯漢，

  非常實用，真的能救你一命，學起來！



  --'
