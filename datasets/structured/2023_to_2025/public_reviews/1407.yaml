url: https://www.ptt.cc/bbs/movie/M.1482453220.A.E30.html
title: '[新聞] 老將最後一次出征！浴血任務4》成最終章'
content: '新聞網址：

  Yahoo 電影




  ---------------------------

  由席維斯史特龍領軍，《浴血任務》系列電影的第四集、也是最後一集，如今已經拍板定

  案了。《浴血任務4》有望登上大銀幕的消息已經傳了好一陣子，但現在看來終於大開綠

  燈了，因為發行過前三集電影的德國發行商Splendid Films已經證實此說。


  根據媒體報導，史特龍將再次披掛上陣，飾演一身肌肉的傭兵巴尼羅斯，而傑森史塔森也

  會回鍋演出李聖誕、阿諾史瓦辛格則飾演壕溝鼠。至於還有哪些原班人馬會重回第四集的

  懷抱，目前還不得而知，但李連杰、杜夫朗格林、蘭迪寇楚和泰瑞克魯都曾是前三集的固

  定班底。


  前兩集電影曾接連創下票房佳績，第二集更足足收進了三億美金的亮麗票房。但相較之下

  ，第三集的票房卻顯得欲振乏力，只抱回了兩億一千四百萬美金。其中部份原因在於，有

  別於前兩集主打血腥暴力的限制級定位，第三集則調回了比較保守的特別輔導級（PG-13

  ）。


  image 史特龍則表示，第三集的確重重傷害了《浴血任務》系列電影：「毫無疑問。為了

  觸及更廣大的觀眾族群，當初才會做出這個錯誤判斷；但如此一來，卻也過度刪除了觀眾

  期盼看到的暴力場景，而我相信每個人對此都難辭其咎。我很確定，我們不會再重蹈覆轍

  了。」


  早在今年九月便傳出，劇組有意找史蒂芬席格軋上一角，史特龍甚至還希望傑克尼柯遜能

  來擔綱全片反派。有趣的是，皮爾斯布洛斯南曾在2014年表示，自己早就答應過製片艾維

  勒納（Avi Lerner）要演出一部《浴血任務》電影。


  皮爾斯布洛斯南當時透露：「我不知道自己究竟會演哪一集，我就只有點頭答應而已。可

  能是《浴血任務7》也說不定。」在此同時，千禧影業自2012年以來就在埋首籌備一部全

  女性版的《The ExpendaBelles》，但我們不清楚這項計劃目前的進度。

  ------------------


