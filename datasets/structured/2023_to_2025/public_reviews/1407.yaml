url: https://www.ptt.cc/bbs/movie/M.1494088402.A.3C1.html
title: '[舊聞] 史特龍放棄6.1億 退出「浴血任務4」'
content: '剛看完第三集 找了一下相關消息居然看到這條新聞

  雖然在4/1發布的可是不少標題寫不是愚人節玩笑

  這樣第四集也不用拍了吧QQ 難得的無腦爽片阿...




  好萊塢冒險動作系列電影「浴血任務」，集結A咖巨星「席維斯史特龍」、「阿諾史瓦辛

  格」、「布魯斯威利」等人，全球票房開紅盤，一拍就是三集，堪稱是「阿伯版」的復仇

  者聯盟。最近「浴血任務4」也即將籌備開拍，沒想到現在傳出，元老級的「席維斯史特

  龍」，因為與片商高層意見分歧，宣告退出。


  三年前，風光出席坎城影展，席維斯史特龍 登高一呼，將好萊塢動作巨星老將們，全都

  聚在一起走紅毯，他發想的「浴血任務」系列電影，一拍就是三集，堪稱是阿伯版的「復

  仇者聯盟」沒想到現在卻傳出 ，正在籌備開拍的「浴血任務4」，席維斯史特龍跟片商高

  層，意見分歧宣告退出，放棄6.1億台幣片酬。


  回顧「浴血任務」第一集，席維斯史特龍 因為人緣好，決定自編自導自演動作冒險片，

  找來傑森史塔森李連杰當傭兵，阿諾史瓦辛格布魯斯威利克串，好萊塢A咖齊聚 當時全球

  創下，2億7千多萬美金票房。隨後浴血任務第二集登場，繼續主打熱血.動作和冒險，更

  是創下三億1500萬美金票房，證明阿伯們實力依舊。浴血第三集 聚集更多A咖，梅爾吉勃

  遜 哈里遜福特，甚至加入年輕演員，雖然票房有下滑，但仍是超級吸票機，浴血任務四

  宣告開拍後，影迷們正期待，這群阿伯們還有甚麼新花招，沒想到元老級，席維斯史特龍

  突然決定不玩了，這浴血4該怎麼拍下去。



  --


  --'
