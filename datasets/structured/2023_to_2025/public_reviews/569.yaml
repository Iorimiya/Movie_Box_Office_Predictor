url: https://www.ptt.cc/bbs/movie/M.1527073073.A.FD9.html
title: '[神奇雷] 派對撩妹守則：愛情之後，我們變成更好的人了嗎？'
content: '因為預告片感覺不錯，所以就跑去看了。劇情大概就是講一個喜歡龐克的男孩，遇到了一

  個外星女孩，在女孩離開地球前的48小時帶著她體驗地球龐克文化，也順便談起戀愛(?)

  的故事。


  這部片的氛圍有點ㄎ一ㄤ又有點獵奇。

  雖然視覺跟配樂的部分我個人覺得挺出色的，但還是要講，如果抱持著這是一部奇幻純愛

  片跑去看的觀眾可能會有些不習慣或小失望。

  （後來知道原著小說是尼爾蓋曼寫的，這樣有些獵奇就讓人不意外了，想當初讀《美國眾

  神》讀到一個女神把人活生生的用＿＿＿吃掉的時候，我整個人都驚呆了）



  ---以下有(結局)雷---



  電影想講的東西很多，龐克、叛逆、外星、愛情、雙親與子女的關係，各種神奇的腦洞大

  開，有聽到也去看這部片的朋友看完有種WTF的感覺，但我自己在最後一幕還是有被小小

  觸動到。


  看完最後一幕的我在想，很多時候愛情發生的沒有道理，可能就是兩個孤寂的心剛好遇見

  了，也願意去理解與包容彼此的不同，就在一起了，像這部電影一樣。剛開始的時候我還

  在想，能這麼短就愛上彼此嗎？（日久生情派是我）後來覺得，嗯，這也是愛情，雖然從

  相遇到離別也就48小時。



  以前有個朋友講過一句話：「沒有在一起到最後的愛情，就不是好的愛情。」

  基本上我是100%不同意這段話。


  一段好的愛情，不是在一起的時間長短，也不是有沒有在一起到最後。

  而是在愛情中或在愛情之後，我們是否變成了更好的人。



  那是一種很微小的，向上向善的力量。



  分開多年以後，男孩成為了作家，在一場簽書會上遇見了女孩的外星小孩們。當時他臉上

  的表情不只是想念起了女孩，也包含了一絲了解到彼此都過得很好、變成比當初相遇時更

  好的人（或外星人）的微小情緒。（個人意見）


  我想那就是看到這部電影的最後有點觸動我的原因。


  推薦給喜歡風格特異的愛情片的人。



  P.S

  艾兒芬妮超萌超蠢超可愛<3

  請跟我交往(誤)


  --

  高雄駁二in89和MLD台鋁有上映

  自體繁殖可說是也不完全是，認真建議看完比較好懂XD加入前篇有人提到的脈輪說

  可能更好理解（或完全相反）'
