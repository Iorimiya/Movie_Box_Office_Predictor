title: '[好雷] 更好的人 Better Man 羅比確實是隻89猴'
content: "我是不忠實羅比粉，以前買過幾張專輯和DVD\n（家裡太亂，只翻得出兩張DVD）\n\n大臉特寫就是片中最後演的那場演唱會\n英國的皇家亞伯廳在英國樂壇地位很高\n\
  似乎是很多英國歌手的目標\n\n看了板上相關討論覺得，酸民無知也要有個程度\n羅比最紅的時候\n還請得到當紅的妮可基嫚為他的專輯合唱好嗎XD\n\n\n這則是跟凱莉米洛的合作\n\
  \n\n這首Rock DJ在片中佔很重要地位\n原MV有點血腥，曾被禁播鬧得很大\n充分表現「妹仔怎可以不看我」的89猴性情XDD\n\n片名叫《更好的人》也是取自他的名曲之一\n\
  \n這邊有中文翻譯，也是電影最後想表達的中心思想\n\n想看電影之外的接招合唱團和羅比的歌\n可以直接跳最後一段\n\n\n回到本片\n先說結論，我覺得喜歡音樂電影的人可以看\n\
  歌舞部分無庸置疑很棒\n但太多描述心魔的部分，看得很累\n如果能在縮減一點會更好\n居然有拍女粉露奶這類情節，不愧是羅比傳記片\n猴臉真的好煩，但我能理解\n\
  一直很期待最後剃毛變人類QQ\n\n另外，我很喜歡羅比的No Regrets，沒這首歌失望\n\n\n以下長文，微雷而已，知道了不會影響觀賞樂趣\n\n\n一月初看別的電影時看見本片的預告\n\
  居然把自己描繪成猴子，笑死（拍手）\n看一堆人說不懂，如果認識他當紅時的鬼樣子\n譬如說他跟辣妹團員做過（片中有提到）\n常明示自己性向是彎的\n實際上根本是直到不行的直男\n\
  還說他跟長期合作的製作人蓋伊錢伯斯「有穩定的性關係」\n自稱跟妮可基嫚、凱莉米洛都交往過\n……各種引人側目、真假難辨的發言\n他確實就是隻猴子，非常有自知之明\n\
  只是我討厭猴子，拖到現在才看XD\n本片對蓋伊的部分點到為止真善良\n我一直期待重現這個著名發言\n\n我覺得羅比的魅力是沒有偶包\n唱歌卻很好聽，不只是賣壞小子形象\n\
  歌曲有狂妄有深情，曲風多元\n可說是天生的大娛樂家\n本片用〈Let Me Entertain You〉開場太適合\n相較下蓋瑞巴洛形象實在太端正……\n\n\
  整部片花了很大的篇幅在講羅比的心魔\n常常虛實交錯，細節有點抽象\n搞得有些部分很混亂，我不太愛這邊\n該仔細敘述的經歷卻以歌舞帶過\n實在非常可惜\n畢竟不是每個人都經過那個時代、認識那些藝人\n\
  連羅比本人在本板都沒人認識了\n這種敘事方式很像只拍給認識90年代樂壇的樂迷\n\n歌舞部分拍得很棒\n導演是《火箭人》的製片，難怪有些表現部分很像\n同樣也有陷入水底的的妄想\n\
  兩邊都各有厲害之處\n瘋狂的女粉化為海中妖物拉住羅比叫他不要走\n雖然有點失禮，但對瘋狂女粉的類比很貼切\n\n片中最愛的部分敘述接招合唱團的成立到羅比退團\n\
  我不是接招粉，對他們的底細並不是很清楚\n看完這段恍然大悟\n原來初期裝扮那麼gay，是因為以同志為市場XD\n這段描述接招大紅時的大型歌舞場面\n卻是用羅比的歌表現，而羅比終於變C位\n\
  \n\n羅比的演藝生涯沒真正的大困難\n一切都只因為他自卑轉自大\n即使他在接招不是站C位\n但已經算蠻常唱歌，比另幾位伴舞小夥伴好太多\n愛情上也非常順利，根本身在福中不知福\n\
  最後心理治療那邊很好\n治癒跟別人的關係的第一步就是治癒自己\n比起偶爾才出現的父親\n他更該珍惜一路支持的媽媽和阿嬤\n不過人就是對得不到的東西特別留念吧\n\
  \n還記得要跟蓋瑞道歉，太好了QQQQ\n\n好奇查了幕後英文訪問\n羅比有把劇本初稿寄給蓋瑞看\n後來蓋瑞打電話給羅比抱怨\n說不太喜歡片中對自己的描述\n\
  羅比無法完全捨棄不提那段團體時光\n但仍為了蓋瑞修改了部分劇情\n\n噗～他真的好在意蓋瑞XDD\n訪問提到蓋瑞不是稱Gary，而是叫小名Gaz\n他也有提唯一有看本片的團員是馬克歐文！\n\
  \n\n以下相關題外話\n\n接招在台灣是紅到PTT有個板\n第一次來台灣宣傳是90年代\n上了胡瓜主持的《金曲龍虎榜》吧！\n2007年又來台灣宣傳，還上了《康熙來了》\n\
  ……看女藝人卸妝，真是一場災難，網路上找得到影片\n\n一出道的MV和造型很gay\n\n\n我個人超愛下面這首〈Pray〉，人生買的第一張單曲CD\n\n早期真的在賣肉\n\
  \n羅比也有當主唱過啊，就說比其他伴舞小夥伴好了\n\n\n貼一下劇中出現的幾首名曲\n\nAngel\n\n\nShe's the One\n\n\n\n以下是片中沒出現但我很愛的QQ\n\
  \nNo Regrets\n\n\nMillennium\n\n顏藝很欠扁\n\n\n之前有推文提到羅比來台罵髒話\n這邊有寫詳情\n\n我以前在桃園機場追過凱莉米洛的經驗，那時也是擠到不行\n\
  記者大哥為了拍畫面真的很恐怖\n我也曾看過他們在機場搞得某中國藝人跌倒\n然後對方很生氣，就寫成失控飆罵\n總之外國藝人現場失控罵人這種通常水很深\n\n\n\
  --\n\n     「完全犯罪就像第一次下廚的的老爸，注定會失敗。」\n\n                                        \
  \            －古畑任三郎\n\n--\n\n自傳片難免粉飾一下當事人XD\n\n\n我覺得《火箭人》歌舞好，但剪輯差\n段落與段落間卡卡的\n看刪減片段時\n\
  發現能大幅提升劇情深度的地方都剪了\n\n\n沒錯，很勸退！所以我拖到現在才看\n\n\n有些人說他沒傳奇到需要拍自傳\n這實在太嚴苛\n曾經待過英倫第一男團\n\
  單飛後也紅過、好歌輩出，到底有什麼不行拍\n\n我覺得這部片若早個10年推出，票房會比較好\n\n\n對呀，當初也考慮很久才去XD\n\n\n我猜大概想描寫更多團員間的衝突\n\
  片中感覺很多部分都點到為止\n\n\n查了一下\n羅比在2025年中要開歐洲巡迴演唱會\n\n\n同好（握手）\n較少看到有人喜歡這兩首！\n一邊覺得就是個猴，但還是比較想看變回人XD\n\
  \n\n女團多，但好像很多一片或兩片團\n現在是幾乎沒有了\n懷念那時代，不管什麼團，歌都很好聽\n\n\n去估狗啦\n\n\n對呀，所以要看要趕快QQ\n\n\
  \n哈，確實！我跟酸民認真了！\n\n\n對呀，好險有看！！\n畢竟也是一個時代的回憶\n\n\n由任何一位團員來描寫團員糾葛，可能都不會太客觀\n的確這個交給紀錄片就好\n\
  \n\n真的！！！\n之前看到FB有人在感嘆\n現在連熱音社都沒人知道皇后、\nWelcome to the Jungle等等這些搖滾名團和名曲\n下面居然有年輕人回應：\n\
  現在的人可能比較喜歡旋律好記的歌\n\n看了一頭霧水，那個例子的旋律都夠好記了吧\n連查都不查就做這種評論是怎樣啦\n\n想到樂友提到，現在的歌手變得跟網紅差不多\n\
  \n\n——————\n\n\n對了，重回電影本身\n跟網友聊觀後感，對方補充羅比和蓋瑞的事\n樂壇上年紀大了重組一起賺也很常見\n但和解還拍了甲味濃的MV，就不常見了吧？！\n\
  \n當初還以為是迷妹開腐眼剪的\n沒想到居然是官方MV啊，2011年的合唱曲\n\nRobbie Williams & Gary Barlow - Shame\n\
  \n官方頻道的畫質不佳，所以貼非官方的高畫質版本\n\n\nShame的幕後花絮和訪問\n\n\n謝謝影片！！喔喔喔，我好興奮啊啊\n\n\n偷捏和擦麥克風(?)小表情都很有愛\n\
  這樣男能可貴可以嗎>////<\n\n年紀都那麼大了\n希望他們都能好好珍惜對方XD\n\n\n經紀人就算選菜也真的成功\n團員有顏質、有才華\n光五位有兩位單飛仍很成功\n\
  這眼光也是厲害\n\n\n我也覺得成功，就是猴因仔\n不過總覺得結局可以讓他進化一下XD\n\n\n確實這等級一般很難被拍成電影\n英國更多資深前輩連傳記片都沒有\n\
  但身為90年代音樂迷\n還是很慶幸有這部電影\n\n\n他們以前的舞台裝與舞蹈真的好恥（稱讚）\n這種介於色情和青春的氣氛\n演員再怎麼揣摩都很難重現吧\n\n\
  \n\n有道理！\n而且他在美國沒有知名度\n所以應該能預見票房不會太好\n\n\n不客氣！\n板上只有另一篇文介紹得比較詳細\n我這篇就是以不忠實粉絲心態來介紹XD\n\
  \n\n謝謝補充事蹟和影片！\nStrong太有Oasis風格了XDD\n\n目前大部分音樂傳記片共通點：\n在美國有名、沒聽英文歌的人都聽過\n我想有些人可能認為沒到喬治麥可那種程度\n\
  哪有資格出傳記片\n這樣考慮下來\n90年代之後發跡的英國solo歌手\n大概只有Adele能拍了\n\n不過在英國\n甚至連因選秀節目紅過一下的保羅帕茲都被搬上大銀幕\n\
  出了一部《翻聲吧！保羅》\n羅比的歌唱生涯和成績遠遠超過保羅帕茲\n只能說很多人對傳記片的標準比較傳統\n\n\n幸好不是拍成恐怖片，不怕不怕\n\n不客氣\n\
  能讓大家再來聽聽他的歌，太好了！\n\n一直覺得片中最後至少該變回人\n畢竟他已經在進化了嘛\n腥球崛起XDDD 那段實在看了傻眼\n\n\n搞不好真的沒看XD\n\
  \n\n有看過他現場，太羨慕了！！！\n\n看他的紀錄片就一直看他說壓力大好累，不想上台\n我都在想會不會忽然取消或倒下\n結果他還是上台做了完美的表演\n真心佩服！體能也是有夠好的\n\
  \n\n以前只單純覺得很好聽\n沒去深究歌詞含意\n但這次看電影搭配劇情覺得好感動\n每首歌都寫得好透徹，觸動心靈QQ\n配合劇情得選曲超厲害\n重新再認識了這些很棒的歌"
