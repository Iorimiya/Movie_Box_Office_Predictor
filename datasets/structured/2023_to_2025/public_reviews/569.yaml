title: '[好雷] 更好的人-很容易被錯過的絕佳歌舞電影'
content: '如果這幾年有個專屬於音樂電影的獎季，那《更好的人》在我心中能輕鬆包辦所有獎項。


  （查了一下紀錄，上一部讓我深感驚艷的歌舞片，已經是2021年的《倒數時刻》）


  《更好的人》講述了英國樂壇巨星羅比威廉斯的傳奇人生，從童年到成名、從壞小子到世

  界巨星的成長軌跡。如果你熟悉羅比，那這部絕對是必看，可以看到電影改編上的強大。

  就算對他毫無了解，也完全不會影響觀影，反而可以是認識這位樂壇傳奇的契機，裡頭的

  歌舞片段精彩絕倫，看完的一個禮拜你可能都會沉浸在原聲帶中。


  （以下將提及部分劇情）






  <Rock DJ>可以拿下最佳歌舞片段獎。這首歌幾乎可以說是把歌舞電影該有的樣子給呈現

  到滿分，這段表演像是《樂來越愛你》開場的<Another Day of Sun>，行雲流水的走位讓

  畫面在不同場景間巧妙切換，達到一鏡到底該有的流暢，最重要的是「沒把這世界看在眼

  裡就跳起舞來」的氛圍，並用隨手獲取的道具和路人做互動，最後再把所有路人都拉進來

  ，一起來個破百人的超整齊大合跳，將氣勢推向巔峰，令人雞皮疙瘩掉滿地。


  <Relight My Fire>可以拿下最佳演唱會片段獎。歌舞劇通常都是走個奇幻路線，而《更

  好的人》基於是真人故事，所以演唱會片段成為其獨特亮點，因為在其他歌舞電影裡較少

  有這樣的類型出現。這段演唱會有小鮮肉男團的魅力，加上強烈的燈光與音響效果，帶來

  如臨現場的感受，而在台上也不忘推動劇情，加強羅比自信爆棚的明星氣場。


  <Come Undone>可以拿下最佳獨唱片段獎。心理甫遭衝擊的羅比開著車在路上狂奔，宣洩

  著內心的不滿，抗議際遇對他的不公、眾人埋沒他的才華。歌曲除了些許憤怒，卻又在歌

  聲中透露出追求屬於自己道路的堅定意志，不顧一切開著車往前衝，代表他破釜沉舟的決

  心。


  <She''s the One>可以拿下最佳對唱片段獎和最佳剪接獎。羅比和妮可的初次見面就火花

  四射，音樂人的默契讓他們很快就墜入愛河，除了深情對唱之外，更有精湛的雙人舞令人

  目不轉睛。而這段最讓人敬佩的是剪接，同時將甜蜜初遇與幾年後感情破裂的片段交錯剪

  輯，讓氣氛在甜蜜與悲傷之間穿梭，除了暗示了這段感情的走向，畫面的對比也讓人倍感

  心酸。


  電影中將羅比轉化為黑猩猩的形象來呈現，或許對於讓觀眾走進戲院看這部電影，反而形

  成障礙，所以這個安排比較偏向是藝術面的展現。羅比的旁白一開始就說這部電影會用非

  凡的方式呈現，因為他對自己的看法和大家不一樣，所以選擇用未進化的黑猩猩作為形象

  。可能是在表達他在成名的那一刻就未再進化；或是反映他的「壞小子」名號，做任何事

  都有著一股野性衝勁；又或是在表達自己過去做了許多不好的事，就像未進化的人類一樣

  。


  人生若從某個時間點來看，總是會看到無能為力的自己，被迷惘無助的影子跟隨，做出無

  數個錯誤的決定，好像自己很糟一樣。但要是把時間拉長再回頭看，就是有過如此的挫折

  ，才找的到那些專屬於自己的東西。可能是無可被取代的獨到創造力，或是不輕易屈服的

  堅定價值觀，以及下次如何做出更好選擇的判斷。


  擊敗那些過去不堪的自己，便能成為「更好的人」。


  原文＞＞＞


  --'
