title: '[新聞] 羅比威廉斯傳記片《更好的人》大爆死！'
content: '羅比威廉斯傳記片《更好的人》大爆死！成本破億美元、上映至今票房僅 1000 萬美元




  （圖片來源：派拉蒙影業）


  前接招合唱團成員 羅比威廉斯（Robert Williams）的傳記電影《更好的人》（Better M

  an）自去年 12 月 25 日的聖誕節檔期開始，就已經陸續在多個國家正式上映，不過該片

  開出的票房數字相當慘烈，迄今全球上映超過半個月，票房仍然只累積到 1000 萬美元出

  頭，這成績對比於 1.1 億美元的製作預算，無疑是非常糟糕的，基本上已經確定最終會

  是虧損收場。




  （圖片來源：派拉蒙影業）


  《更好的人》於去年聖誕假期先在美國少數幾家戲院進行小規模的限量放映，直到上週末

  才正式擴大聯映，但小規模的限量放映模式，通常其一功用就是為了要先讓好口碑發酵，

  但《更好的人》的好口碑顯然沒被傳播出去，上週依舊只開出約 100 萬美元的淒涼數字

  。


  《更好的人》在威廉斯的老家英國也同樣滑鐵盧，首週只賣到 190 萬美元，迄今也只累

  積至 470 萬美元左右。


  《大娛樂家》（The Greatest Showman）導演 麥可葛雷希（Michael Gracey）執導的《

  更好的人》這回特地採取動態捕捉技術，將戲中的威廉斯用猴子的造型呈現，因此造就片

  中不少規模頗大的魔幻場面，而這也代表製作費勢必不斐，只可惜，高昂的成本無法在財

  務上獲得同等的回報。


  《更好的人》本週五（17 日）將輪到台灣正式上映。


  文：Joker



