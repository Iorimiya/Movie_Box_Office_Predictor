title: '[討論] 更好的人 Better Man劇情考究（雷）'
content: "對了，Better Man有被林憶蓮翻唱成中文版\n\n當年EMI側標還有她的宣傳\n\n\n先前以不忠實羅比粉的角度寫了介紹和觀後感\n\n\
  進場前看看也不會影響觀影樂趣\n\n如果看過電影，剛好有訂Netflix的話\n對羅比非常有興趣的話\n可以搭配紀錄片\n《壞小子再接招：羅比·威廉斯25年私房檔案》\n\
  \n本篇則是考究片中劇情與現實的對照\n所以有小雷、有中雷、大雷\n適合已經看過電影的人閱讀\n參考資料來自羅比、蓋瑞巴洛自傳\n還有紀錄片與各種報導\n內容有錯的話請指正\n\
  \n\n\n\n《Life thru a Lens》（浮華人生）\n\n\n\n仿滾石雜誌那張似乎沒有參考來源\n\n\n\n\n導演麥可格雷西覺得現在傳記片多到浮濫\n\
  為了做出賣點，於是問羅比他的靈性動物是什麼……\n\n羅比上節目的說法很好笑\n他說他那天剛好跟其他天一樣，正在尋找自我價值\n於是回答了「獅子」\n導演就？？？於是羅比又說了「猴子」\n\
  \n剛好隔壁坐的是演皇后主唱佛萊迪的雷米馬利克XD\n\n我看過兩次羅比上BBC葛雷漢諾頓秀的訪問\n他很會講故事，跟平常中二猴樣不一樣，很好笑\n\n\n\n\
  \n從小到大，最後一張大概2017年\n現在的羅比已經50歲，\n長相變得很像《東城奇案》裡的蓋皮爾斯\n\n他的身高\n但從臉看不出來有這麼高\n\n\n\n\
  \n1998年帶媽媽珍娜出席頒獎典禮\n\n\n阿嬤\n\n\n\n\n這是片中唯一虛構的角色\n\n羅比確實有個同鄉的兒時友人\n但那個人也是藝人，常會陪羅比巡迴\n\
  \n\n\n\n1991年，左到右：蓋瑞、羅比、傑森、霍華、馬克\n\n\n1995年，左至右：馬克、傑森、蓋瑞、霍華、羅比\n\n接招合唱團內有三位身高超過180的團員\n\
  羅比最高，傑森和霍華183\n蓋瑞172，馬克165\n\n片中選角其實很不錯\n\n\n\n\n真的，羅比也是事後從經紀人口中知道這件事\n經紀人其實對他並不滿意\n\
  \n\n\n假的，戲劇效果而已\n\n實際上尋找廠牌的情況和簽約很普通\n透過各種關係到處詢問和被拒絕\n那時他們跟A&R唱片接洽時\n遇到了後來當選秀節目評審知名的賽門考威爾\n\
  他那時不看好接招，所以拒絕\n事後還說開除掉那個胖子（蓋瑞），我就簽下去\n\n簡化成掌握到千金的心有趣很多\n\n\n\n\n電影提到羅比是最小的團員\n他進團時才15、16歲\n\
  其他人對他而言成年的大哥哥\n經紀人一開始想將他們捧成同志天團\n常開車帶他們去各處同志夜店征戰\n蓋瑞唱作兼具很受寵，羅比很眼紅\n有次錄音還一直重唱，後來蓋瑞來唱\n\
  錄音室的大人們紛紛稱讚\n\n這些都是真的！\n\n前一篇文提到蓋瑞本人對劇本有意見\n他打電話跟羅比說：\n「羅伯，你把我搞得好像比\n  星際大戰第一集的達斯維達還壞。」\n\
  羅比做了部分妥協\n決定電影中唯一的反派只有他自己就好\n\n劇情也沒有講太多團內恩怨\n\n但羅比堅持不能完全去除這段\n因為他想重現自己16～20歲時的想法\n\
  對他而言很重要\n\n\n兩方以前的傳記都提過一直重唱那天\n羅比說錄了12小時，他抽了20支大麻菸\n怎樣唱都無法讓製作人等人滿意\n後來他們把蓋瑞叫進錄音室\n\
  叫蓋瑞先唱，羅比照著那個唱法就好\n\n就是〈Everything Changes〉這首歌\n\n雖然背後故事這麼糟\n但上電視表演的版本有夠可愛\n\n值得一提的是\n\
  羅比在團內的好友是馬克\n（影片最右邊黑衣）\n上面影片前奏時\n可以看到羅比跟馬克對到眼後相視而笑XD\n\n接招的經紀人是同志，他自己也有開夜店\n這解釋了他初期養團的策略\n\
  因為他比較了解這部分的客群\n只有羅比未成年不會開車\n所以開車是由經紀人和另四個團員輪流開\n\n五位團員都是異性戀\n雖然經紀人並沒有對團員潛規則\n但態度較高壓\n\
  （管團的思考像極亞洲慣老闆：\n　你不做就滾，我會找別人來做）\n會PUA年紀較小的團員\n羅比是其中之一\n大家都對經紀人很敬畏\n\n他特別寵愛蓋瑞\n蓋瑞在相處過程中，也學會討經紀人歡心\n\
  各種好事都第一個或只給蓋瑞\n這也讓羅比十分嫉妒\n\n羅比退團將近十年後，有次跟馬克聊天時\n說他很想得到經紀人的認同，很希望被愛\n但一直得不到\n陷入對經紀人恨意濃\n\
  但愛意也很濃的矛盾情緒\n（網友覺得可能把失去的父愛投射到經紀人身上）\n\n接招的歌幾乎是蓋瑞作詞作曲全包\n對其他團員想參與創作有掌控權\n羅比想寫一首跟娼妓有關的歌\n\
  馬上就被蓋瑞駁斥\n說他的歌較適合搖滾團\n蓋瑞其實也想獨佔創作掛名\n即使某首歌採用了羅比寫的rap\n但他不願讓羅比也掛名\n稍後他的態度有軟化\n其他團員也能參與且有掛名\n\
  蓋瑞就發現\n原本對團體事務很沒勁的羅比\n忽然變得很積極\n\n羅比對男團生活要求紀律\n不能這樣、不能那樣也非常有意見\n他覺得受到限制很不開心\n對接招的曲風、編舞也沒興趣、沒參與感\n\
  所以我行我素\n不理會大家決定好的事情\n也開始萌生是否該離開的想法\n剛好其他團員對他毒癮和失控也很不滿\n後來就被叫到團體會議希望他離開\n\n總之，羅比認為自己會變成這樣\n\
  前經紀人與蓋瑞要負很大的責任\n因為他們不願意花時間關心他\n他當時只是個小朋友\n脫團爆紅後，他開始對蓋瑞窮追猛打\n\n然而羅比未離團前\n常常在很怪的時間往蓋瑞家跑\n\
  還會睡他床睡個一兩天\n甚至會帶朋友去他家吃東西\n蓋瑞完全沒想到羅比這麼憎恨他\n\n其他內容就文後再補充\n\n\n\n\n沒有！這完全是電影想製造的戲劇效果\n\
  \n改編的是這個演唱會，是跟一位老藝人Lulu合唱\n影片已經設定在1:50出場這邊\n\n留言還真的有人很努力看\n羅比（光頭穿拳擊衣和手套）有沒有昏倒和搶歌XD\n\
  \n蓋瑞在自傳《My Take》提及\n雖然羅比即使在表演前一晚都在狂歡\n但在舞台上沒發生過差錯\n而且不管何時聯絡他，他都很有活力\n（蓋瑞這本自傳是在跟羅比和解前寫的\n\
  　所以我覺得不會有偏袒）\n\n不過接招的舞蹈有抓住團員腳踝，拋接的橋段\n需要專注力\n所以羅比有被傑森（團員中唯一的專業舞者）警告過\n要羅比表演前不要嗑藥，否則會害他摔斷脖子\n\
  \n\n\n\n以這段在攝政街拍的大型歌舞為例\n\n之後的註明分秒都是指攝政街這支的段落\n\n一開頭羅比猴的衣服（最左邊）\n\n下面則是蓋瑞在開頭的穿著\n\
  \n由此可見片中考究之細緻！\n\n英國人一定要唱一下披頭四組曲\n0:25之後藍色西裝的出處\n\n他們當時被BBC譽為繼披頭四後，英國最受歡迎的男團\n\n\
  唱片行的看板和海報\n\n第一張專輯\n\n1:16的白衣和白色吊帶褲\n\n羅比在這首是主唱\n\n2:12 出現的大衣和俄羅斯帽\n\n印象中《更好的人》羅比猴好像沒事就會轉個圈？\n\
  看上面影片就會發現轉圈很常出現\n\n最後兩套懶得找orz\n\n\n\n\n都是真的\n\n不過羅比離開的實際情境有點可愛\n沒那麼悲憤\n\n蓋瑞提到羅比離開前經過水果盤\n\
  忽然問可不可以帶走一個水果\n團員有人說可以後，他就拿了\n\n以下引用傳記中的段落：\n\n他開了門，轉身說：\n「那我出去了，我要走了，再見。」\n「再見，兄弟。」\n\
  「再見，羅伯。」\n「掰，兄弟。」\n「掰。」\n\n他邊告別邊關上門，\n我們幾個交換了一下眼色。\n然後門又打開了。\n\n「我真的要走了，以後再見。」\n\
  \n接著他關上門離開了。\n\n\n13. 單飛後與蓋伊錢伯斯\n\n單飛初期的羅比沉溺酒癮毒癮之中\n無論電影和紀錄片都講得他那時好像很廢\n事實上，他發行第一首單曲算很成功\n\
  翻唱喬治麥可的〈Freedom〉\n意圖很明確……\n「我們必須看清這個事實：\n  我不屬於你，你也不屬於我」\n\n有夠嗆XD 可惜這首沒登上電影\n\n\n\
  左：90年代的蓋伊與羅比\n右：近年的蓋伊與羅比\n\n羅比很愛對外胡說八道\n讓人誤會他跟寫作搭檔蓋伊是一對\n事實上，他們是會一起度假的工作夥伴兼好友\n\n\
  可惜羅比與人相處似乎有種模式\n合作五張專輯後，2002年跟蓋伊拆夥了\n但2012年兩人又恢復合作\n\n\n\n\n\n在90年代末英國女團輩出\n其中一支就是聖女合唱團，台版第二張專輯封面\n\
  \n\n片中出現〈Never Ever〉是她們第一張專輯的成名作\n\n\n在〈She's the One〉這段\n快速地交代兩人相識到熱戀的過程\n其中有一段看著嬰兒床\n\
  之後妮可無奈地跟著一群人離開……\n\n兩人其實是在英國著名音樂節目\n《Top of the Pops》後台認識的\n\n但兩人交往時\n聖女合唱團才剛出第一張專輯\n\
  這種情況根本醜聞等級\n於是在唱片公司壓力下墮胎\n\n不過就如電影所說\n妮可有愛上渣男的體質\n跟羅比分手後隔年\n她跟綠洲的主唱連恩蓋勒格交往\n\n綠洲兄弟在片中有出現\n\
  他們曾經熱門一時的搖滾樂種Brit-pop名團\n羅比跟連恩有陣子是好兄弟\n但妮可之後又未婚懷孕（？！\n這次剛好遇到聖女解散\n所以也沒唱片公司壓力了\n\
  過了數年成了蓋勒格太太\n\n可惜連恩後來搞外遇，兩人離婚了\n消息出來時，羅比還公開為妮可抱不平\n我想羅比猴帶走妮可那段\n應該是在演這件事\n\n根據導演與羅比的訪問\n\
  羅比非常保護妮可\n劇本這段每個部分都要經過妮可同意才能拍\n直到現在，羅比還一直覺得妮可是天使\n當時的自己是毒蟲爛人，辜負了人家\n電影拍完後搶先讓妮可看了這段\n\
  還說討論感想時兩人都哭了\n\n\n\n\n片中提過數幾次\n羅比對內博沃斯的演唱會非常興奮\n\n指的是倫敦近郊的\n內博沃斯廳（Knebworth House）裡的公園\n\
  \n英國最大的演唱會場地\n許多英國傳奇樂團都在那邊辦過\n2000年代那邊最大的英國活動\n就是羅比的演唱會，三天共有37萬5千人參加\n\n官方網站的附圖還用羅比\n\
  \n影片在這裡，開頭有人群空照\n\n這是他個人的演唱會，不是音樂祭喔！\n\n\n那場還找了馬克來合唱接招的歌〈Back for Good〉\n（原曲前面有貼，就是俄羅斯帽那邊）\n\
  \n建議大家把開頭看完，電影是完整重現這段\n就可以知道他以前在英國和歐洲紅到不行\n之後猩球崛起就是電影效果XD\n\n\n\n\n這邊要更正上一篇\n雖然電影中是改自2011年的皇家亞伯廳最後一曲\n\
  \n但那時只有羅比獨唱\n\n\n不確定父子倆何時第一次合唱\n但2019年的演唱會上一起唱名曲〈That's Life〉\n\n\n\n私心再多講一點兩人的恩怨情仇\n\
  \n超級長文！\n跟電影沒什麼關係，所以沒興趣就不用看下去\n兩人從反目到和解\n簡直可以再拍另一部電影XDDD\n\n羅比直到出單曲〈Angel〉整個爆紅\n\
  \n網路上有中文介紹這首歌\n\n相較下，接招合唱團解散後\n蓋瑞單飛出了第一張專輯大熱門\n但出在1999年第二張後一落千丈，最終被唱片公司解約\n\n聲勢如日中天的羅比不時會在演唱會\n\
  或透過媒體向蓋瑞嗆聲\n常常在巡迴時跟工作人員說蓋瑞壞話\n\n但那時當紅且離團近十年後的羅比\n有次跟那時的經紀人聊到蓋瑞\n說他知道在背後攻擊蓋瑞很不行\n\
  但他不敢直接跟蓋瑞表達自己的想法\n他還是很怕蓋瑞（……原來是吉娃娃）\n\n事業跌到谷底的蓋瑞\n仍被公開嗆聲和間接傳話打擊到\n精神狀況很差，得了暴食症\n\
  他那時覺得吃胖到別人認不得\n就不會有媒體或陌生人\n跑來跟他說羅比又講了什麼\n後來放棄歌唱事業六年休養並成家\n改當幕後詞曲創作者\n\n\n雖然羅比這麼討厭懼怕蓋瑞\n\
  但馬克過去找他聊天時\n羅比說起接招時期往事正熱烈\n並脫口而出：「然後小蓋（Gaz）就說……」\n講完馬上愣住，好像很吃驚自己這樣叫\n就更正「然後蓋瑞說……」\n\
  \n在2003年左右，某天蓋瑞打電話給羅比的助理\n說這次聖誕節前一定要跟羅比說上話\n羅比不想跟蓋瑞聊就沒回\n\n那年羅比有天半夜看電視\n看到自己在接招時期\n\
  由他主唱的舊歌〈Everything Changes〉\n忽然非常想參加接招合唱團\n在那年聖誕時節重組一晚的表演\n讓他周圍的人都震驚到\n明明一直罵前經紀人、一直罵蓋瑞\n\
  卻主動想回去，遇到他們沒關係嗎？\n羅比說沒關係啊\n被問到想參加的原因\n羅比想了很久說不知道，就很想去參一腳\n覺得好玩，想一起慶祝\n最後被經紀人勸阻，要他別再走回頭路\n\
  \n2006年接招合唱團重組\n羅比在馬克協調下\n願意配合製作全投影出場唱歌\n羅比還送了超大束花到接招團員住的康萊德酒店\n而且他恰巧就住在康萊德對面的Belvedere飯店\n\
  蓋瑞的房間剛好正對那邊\n於是他花了15分鐘很努力想看羅比住哪間房間\n還試著想像羅比在做什麼，心中在想什麼\n\n羅比主動要求在康萊德酒店跟老隊友們見面\n\
  坐在康萊德的酒吧能看到入口的地方等了一小時\n因為團員們還要打包行李\n於是在某個時間點只有羅比和蓋瑞共處一室\n羅比一直想知道重組演唱會的各種細節\n還想知道他們在這段期間的近況\n\
  甚至還想聽聽接招未來新專輯的片段\n但蓋瑞心裡馬上覺得很不舒服\n以前他們單飛初期較勁的回憶全湧上來\n於是沉默了下來\n羅比似乎意識到這點，很快轉移話題\n\n\
  接招其他團員邀請羅比來看演唱會\n羅比說他不能去，他一去就會想上台\n無法坐在台下\n大家討論巡迴，覺得很樂在其中\n羅比卻說他超討厭巡迴\n蓋瑞就說他在演唱會前會養精蓄銳\n\
  不能讓大家失望\n羅比又回這就是他討厭巡迴的地方\n責任全要他擔，不能生病或幹嘛\n\n蓋瑞對羅比這番話的OS是\n「典型的羅伯，一堆矛盾」\n（蓋瑞大多叫羅比的原名羅伯）\n\
  \n隔天羅比又在飯店酒吧等蓋瑞一群人回來\n講了一句話讓蓋瑞整晚睡不著\n「」\n\n（兩人居然開始有心電感應了？！）\n\n蓋瑞對這次久違的相見\n做了很長還有點酸味的一番評論\n\
  提到以前每次想到羅比就生氣，覺得他完全是個雞掰人\n從沒人像羅比一樣造成那麼大的傷害\n也從沒人像羅比一樣\n對自己說出那麼惡劣的話，做出那麼惡劣的事\n沒想到見到面卻一點感覺都沒有\n\
  覺得眼前的羅比也沒什麼特別的\n還是那個多年前的他\n還提現在的羅比讓他想到當年的自己：\n自戀，一直工作工作工作想保持自己的地位\n對世界視而不見\n\n另外，令人吃驚的是\n\
  羅比有買蓋瑞的第一張專輯\n當然也看了蓋瑞的那本自傳《My Take》\n所以上面對他的評論，羅比都看到了\n2007年再次進勒戒所前很沉溺讀那本自傳\n還會向身邊工作人員數落看不爽的段落\n\
  \n快轉到2008年後\n羅比洛杉磯家中與接招團員們聚會\n並與蓋瑞和解\n回歸接招合唱團一起錄製新專輯\n在這期間蓋瑞與羅比一起寫了和解之歌〈Shame〉\n\
  是收錄在羅比個人精選輯\n\nMV仿斷背山，甲味超濃，上一篇推文有分享\n這次貼現場版，一直盯著對方唱超有趣\n\n歌詞對他們15年的相愛相殺（？）\n描寫得有夠寫實：\n\
  \n\n\n之後羅比在接招和自己的紀錄片\n說到這時期就是一心想報復\n承認他當時想毀掉蓋瑞，毀掉接招的記憶\n就算蓋瑞倒了，他也不會放下仇恨\n他要擁有蓋瑞原本能夠擁有的成功事業\n\
  讓蓋瑞付出代價\n\n另一方面，感覺有點勵志（？\n把仇恨轉為動力擴展到如此龐大的事業\n即使嘴上一直抱怨巡迴，態度也很中二\n但還是上台把所有表演和歌唱完\n\
  似乎沒有因為毒癮或耍脾氣取消\n\n跟蓋瑞一和解\n羅比整個態度非常積極和興奮\n還建議兩人出個人專輯時\n可以同一天發行當作慶祝\n蓋瑞回絕了他\n說又想起以前惡性競爭的時光，人都不好了\n\
  \n羅比後來還回到接招\n相隔15年再度以五人團形式\n出了《接招進化論》（Prograss）專輯並參與巡迴\n\n演唱會趁別的團員唱歌時，跟馬克跳舞也太可愛XDD\n\
  \n羅比還因回歸，刺了接招團標在身上\n曬給團員看，大家都覺得他有夠蠢\n（有種小朋友感，一有好事就非常開心）\n巡迴完又再度離團，思考實在令人無法掌握\n不過有距離才有美感，也許不久留是件好事\n\
  \n個人演唱會也邀蓋瑞一起上台\n\n還曾考慮跟蓋瑞出一張雙人專輯\n兩人在羅比家寫了一整張的歌\n後來羅比覺得兩人思考都已經老人化\n需要加點年輕人的東西，所以專輯胎死腹中\n\
  但羅比還是有使用部分寫好的歌\n包括繼2004年最後一次拿單曲冠軍後\n相隔8年再度讓他回到單曲冠軍的〈Candy〉\n\n\n兩人一起寫歌時，羅比還很沮喪向蓋瑞抱怨\n\
  他被BBC Radio 1的主持人批評\n「他已經（對聽眾）不太重要」（過氣的意思）\n雖然得單曲冠軍打臉，羅比超開心\n但蓋瑞覺得被排行榜掌握心情不太健康\n\
  \n蓋瑞2018年出第二本自傳時\n對羅比評價整個大躍升\n同樣對羅比做了一番觀察\n覺得他不是能靜下來喝茶聊天那種人\n要抓住他注意力的方法就是直接進入工作\n\
  蓋瑞同時稱讚羅比一大堆點子很有創意\n也對兩人終於和解鬆了一口氣\n蓋瑞說他們都是（英國）北方人\n無法坦然對對方說出自己的想法\n起初即使見面常常擁抱\n但總覺得和解後的友情很表面\n\
  後來兩人在一起寫歌後\n終於打開內心障礙\n真正坦然相對，開始聊內心話\n甚至還哭了\n\n\n吃老瓜後覺得人生妙不可言\n羅比從那麼討厭蓋瑞霸佔詞曲創作\n\
  到三番兩次把蓋瑞邀到家裡\n唱著兩人一起寫的歌XDD\n在各種場合看著對方，抱來抱去\n\n推文還有很多新補充\n請務必看到結尾！！\n\n--\n\n   \
  \  「完全犯罪就像第一次下廚的的老爸，注定會失敗。」\n\n                                                \
  \    －古畑任三郎\n\n--\n\n不客氣！\n\n實際簽約過程確實是個沒有戲劇張力XD\n改成千金還能表達團員的魅力\n\n羅比願當全片唯一的反派\n\
  安排他吸毒拖累團員\n馬上達到讓人印象變超差的目的\n\n\n寫得讓人有興趣看看這部，太好了！！\n\n\n謝謝Gaz推廣連結！\n我覺得他是個穩紮穩打，很厲害的人\n\
  能夠從谷底走到現在多方經營事業\n\n把和解簡化成道歉\n大概顧慮到講太明白，等下害Gaz又PTSD了\n所以點到為止就好\n搞懂整個過程後\n我很驚訝羅比完全不提對經紀人的怨念\n\
