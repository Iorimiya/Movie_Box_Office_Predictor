url: https://www.ptt.cc/bbs/movie/M.1510626619.A.090.html
title: '[微好雷]《最美麗的意外》　蛻變成更好的人 '
content: '部落格版→

  以下有微雷

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .


  　　《最美麗的意外》，其實看完一點都不意外，是一部典型的溫馨感人喜劇，免不了有

  許多心靈雞湯的語錄，洋溢著正能量，能讓觀眾在曲折的人生道路上，多一點走下去的勇

  氣。如果用來調劑身心健康，鼓舞人心，本片絕對及格，但它的套路還不至於到感人肺腑

  的境界，不過本片是由《逆轉人生》的歐馬希主演，衝著他的演技，這碗心靈雞湯，我覺

  得值得一喝。


  　　本片蘊含的精神，跟《逆轉人生》有異曲同工之妙。在《逆轉人生》中，乍看是歐馬

  希在照顧佛朗索瓦克魯塞，其實歐馬希也漸漸受其薰陶，成為更優秀的人，彼此互助，《

  最美麗的意外》亦如是，山謬（歐馬希飾）照顧女兒葛洛莉雅（葛洛莉雅柯利斯頓飾），

  這幾年含辛茹苦父兼母職，他從玩世不恭的享樂主義者，逐漸開始去認真面對人生，尋求

  屬於自己的認同，變成更加穩重。因此《逆轉人生》是友情的薰陶，《最美麗的意外》則

  是親情的感染，使得歐馬希所飾演的角色，修正原先的缺點，蛻變成更好的人。

  　　《最美麗的意外》在劇情方面，有點偏鄉土劇風格，把絕症、出國失聯、搶子女撫養

  權和親子鑑定這些套路全用上，很容易就猜到劇情走向，不過在絕症這個設定上，耍了點

  小聰明，有可能會讓觀眾誤判，算是有點意思。本片的橋段，大多在於父女間情感層面的

  互動，而非強調山謬父兼母職獨自撫養女兒有多麼辛苦，跟《當幸福來敲門》那種刻苦感

  大相逕庭，所以會覺得本片給予主角的阻力不夠，比較沒有強烈的衝突點，多半都維持著

  輕鬆詼諧的調性，溫馨感人而不催淚。


  　　雖然沒有很深的套路，結尾也用了老套的旁白模式來講道理，但整體來說，《最美麗

  的意外》的表現算是四平八穩，而歐馬希精湛的演技倒是再為本片加了點分數，他那一場

  騙女兒下樓隨即關上大門淚崩的戲，不僅走心，簡直是虐心，直叫人動容！最後，用一首

  十四行詩點評：


  最美麗的意外男主角歐馬希，

  就是逆轉人生兩大要角之一，

  他飾演的山謬崇尚享樂主義，

  每天在海灘工作更不忘嬉戲，

  某日前女友來見他不遠千里，

  帶了一名女嬰說是山謬後裔，

  三言兩語無預警將女嬰拋棄，

  山謬嚇得直忙帶女兒去登機，

  從法國遠赴英國這陌生之地，

  受困異鄉進退兩難又寒又飢，

  為求謀生養女從事替身特技，

  一晃多年父女建立深厚情誼，

  但前女友為搶女兒暗施詭計，

  結局溫馨但算不上皆大歡喜。


  九品中正制度評分：四品，中上之作。

  （一品最高，九品最低）


  【同場加映】


  《亞人》影評→

  《死者的審判》影評→




  --'
