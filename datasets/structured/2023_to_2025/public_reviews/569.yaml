url: https://www.ptt.cc/bbs/movie/M.1440161539.A.1FE.html
title: '[普雷] 我的少女時代之我們都希望成為更好的人'
content: '無音樂乾靜好讀版：






  「我們都希望成為一個勇敢的人。」



  以下是我的個人評論


  首先我只能說對國片的印象一直都偏負，也知道是各種人才與資源的缺乏，國片在電影

  市場很難有所突破

  所以常是小清新、國族意識等等特定類型（我忘不了PPS的台灣小清新分類）


  因為PTT上的好雷、還有同學各種淚崩…

  所以我還是和Y去看了（與Y之前還一起看了5/1…）


  我抱持著回憶青春一定會有很多戀愛梗想愛又沒在一起的錯過的心態去看（內心戲）

  但是還是有觸碰到一點少女心啦，整場微笑看完


  Y則是邊看邊受不了地用指甲抓我的手臂，最後還哭了…

  我倒是笑著看完、沒有多大的情緒起伏…（而且HIGH咖一直讓我出戲…）




  ----劇情（有雷）----


  林真心（陳喬恩 飾）長大後在公司上班卻是個軟弱的組長，成為了一個高中時代可能會看

  不起的人


  她懷念起高中時代的林真心（宋芸樺 飾），在那個時代一定會有長相優功課好的風雲人物

  歐陽非凡（李玉璽 飾）與作惡多端的老大徐太宇（王大陸 飾），當然也少不了每個學校

  都會有的萬人迷校花陶敏敏（簡廷芮 飾）


  因為幸運信，愛慕歐陽的林真心與暗戀陶敏敏的徐太宇相識了，他們成為盟友幫助對方追

  到愛慕的對象，但是在過程中對彼此都有了一些情愫，他們守著那些說不出的話、揚著不

  明白對方心意的強顏歡笑


  林真心與徐太宇因為相處變得更勇敢也變得軟弱，為彼此挺身而出、因為不明確的心意患

  得患失


  徐太宇開刀後前往美國讀書再也沒有連絡，林真心也長大來到了職場


  看著同一片星空的林真心得到了勇敢，她遞出辭職、與愛抱怨的男友分手，但即使再勇敢

  她還是買不到偶像劉德華的演唱會《真心愛你》的門票啊！


  結果在買飲料時遇見了劉德華，劉德華知道林真心的名字後留下了電話要她打給工作人員


  就在演唱會門口，林真心與工作人員接通了電話，這才發現工作人員是徐太宇（言承旭 飾）！

  徐太宇實現了他的承諾：「讓劉德華唱歌給妳聽！」




  總結


  我覺得青春商業片有點譁眾取寵，可能透過觀賞青春片經歷別人的青春，竊取情節補足自

  己的遺憾，但很難在裡頭得到什麼生活上的實質幫助


  而情節的鋪陳、哭點笑點與衝突佈局得有些刻意，導致我很容易就出戲、思考著剛才的情

  節是不是太故意了


  畫面上我覺得普通雖然沒有美到不行，但可能以預算來說也不太苛求（台灣電影加油）


  最後，我最喜歡的一幕就是言承旭出現！（絕對是因為他太帥）

  從語調上有感受到徐太宇對林真心變得溫柔，所以最後言承旭木訥溫柔還含淚地出現變得

  很合理，不然我實在難以把陽光大男孩與憂鬱小生連結在一起


  我覺得可能是我的高中生活真的太貧乏了導致對這部片很難有共鳴

  早餐我都在家吃，午餐帶便當，班上讀書風氣很盛、所以都在念書

  （看爽報還會被老師罰），沒有補習，沒有參加社團，沒有迷戀校園偶像

  （甚至不知道高中的校園偶像是誰），沒有學校老大，沒有改衣服，沒有談戀愛、幾乎都

  在教室周圍活動


  乏味的生活有好有壞，不過對於這種青春片就少了些可能會有的感動



  以上僅為個人意見。


  --'
