title: '[好雷] 更好的人'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  雖說接招合唱團出道33年歷經不少變動，但魅力與人氣不減，去年底甫以現今活動的三人

  模式來高雄開演唱會。雖然羅比‧威廉斯與近年重心轉往戲劇的傑森‧奧蘭奇不包含在內

  ，但喜歡接招的歌迷對「壞小子」羅比肯定不陌生。電影《更好的人》則是由他個人參與

  ，講述自己如何從當初的荒誕歲月轉變，成為「更好的人」。



  《更好的人》由擅長拍攝音樂傳記電影的導演麥可‧格雷希執導，他以拍攝紅粉佳人的紀

  錄片《P!nk: All I Know So Far》、描寫艾爾頓‧強一生的《火箭人》與講述傳奇馬戲

  團大亨過去的《大娛樂家》聞名。本片則聚焦在近二十年最偉大的英國流行巨星羅比‧威

  廉斯的崛起，從年少時心懷雄心壯志，到成為偶像男子天團成員，經歷快速成名與退團風

  波的跌宕，直至如今創造輝煌個人成就的精彩歷程，片中有多首耳熟能詳的經典歌曲。



  「Lord I''m doing all I can/To be a better man」



  與電影同名的歌曲「Better Man」是威廉斯在2000年發行的《Sing When You''re Winning

  》專輯所收錄的歌曲。這首懺悔的作品，明白點出羅比‧威廉斯深切感受到自己過去的荒

  唐，如今願意痛定思痛，也就像歌詞裡所寫的一樣，知道自己的靈魂將能夠治癒一切的羞

  愧，他也將在痛苦中茁壯。電影《更好的人》如同這首歌所寫，先告訴觀眾羅比過去是如

  何對待身邊的人，包括團員蓋瑞、女友妮可與從小到大的好友奈特。即便曾經有過不愉快

  ，片尾的和解也呈現出他不但有心修補關係，也確實付諸行動，並且與他們至今都保持良

  好的關係。



  「成名之後，你就永遠停留在當時的年齡。」



  改過自新後的威廉斯，在參與AA聚會時如此說。海內外不乏成名後迷失自我的童星，也難

  怪人家會說：「少年得志大不易。」加入接招合唱團之前的羅比‧威廉斯，是個還在擔心

  該怎麼跟媽媽坦承自己考試考糟的孩子，一瞬間，他變成舞台上大家爭相合照的寵兒。不

  要說羅比無法承擔這股壓力，他一心想證明自己的慾望也漸漸把他壓垮。《更好的人》裡

  呈現出，威廉斯從小就是一個缺乏自信的孩子，這是由於他在學校不受歡迎，下課時間踢

  足球時，他總是最後一個被挑中的成員；這也因為他在家未受到父親的鼓勵，爸爸從來不

  會稱讚他歌唱得好，父子的歡唱時光也會被羅比‧威廉斯的笨手笨腳給破壞殆盡。



  AA聚會的輔導員告訴羅比，修補親密關係是修復自己的起點。演唱會前壓力山大的威廉斯

  對爸爸說：「我知道你一直都很支持羅比‧威廉斯，但你為什麼不能同樣支持羅伯（本名

  ）呢？」一直以來，羅比的休息室裡只有三張大神「平‧克勞斯貝、法蘭克‧辛納屈與小

  山米‧戴維斯」的照片，對他來說，只有變得與他們一樣，爸爸才會肯定自己。與爸爸和

  解之後，威廉斯才終於把爸爸的照片也一起放在休息室，他其實一直都很崇拜爸爸，他們

  彼此都是對方的驕傲。



  除了無法獲得父親的肯定之外，在接招負責大部分詞曲創作並擔任主唱的蓋瑞肯定也給予

  羅比‧威廉斯很大的壓力。的確，蓋瑞是他們之中最有音樂才華的一位，但誰都不想被貶

  低，待在接招合唱團的那幾年，同樣具有詞曲創作天分的羅比，一直活在蓋瑞的陰影之下

  ，導致他不論做什麼都要與之相比，甚至在面對歌迷時偶爾還會假裝自己是對方。就像威

  廉斯所言，加入接招的他還是個毛頭小子，與四位其實也沒大他幾歲的大哥哥一起闖蕩，

  當他們勸說羅比‧威廉斯退出，他當然會有怨懟，但從片尾羅比將寫有「抱歉」字樣的西

  瓜送給蓋瑞，以及威廉斯後續與其他團員一起重新合體不難看出，這部分的嫉妒也已獲得

  良好的處理。



  想要證明給爸爸與蓋瑞看的自尊心是一回事，這些都是羅比‧威廉斯心裡的掙扎，但與聖

  女合唱團的成員妮可交往的往事，讓他至今仍舊耿耿於懷，甚至直言自己當初是「愚蠢至

  極的男友」。雖說兩人當時都是偶像團體的成員，突然宣布懷孕，的確會影響到形象，但

  當時為了彼此的事業，唱片公司只得逼妮可墮胎，這也成為兩人內心的黑歷史。妮可2002

  年推出回憶錄，以及羅比拍攝《更好的人》時決定將這段往事批露出來，都是經過兩人共

  同的討論。目前關係良好的他們，只能說當年是在不對的時機遇到對的人，只得承受名氣

  帶來的壓力。



  諷刺的是，妮可最後嫁給威廉斯經常開嗆的綠洲合唱團主唱連恩，真的是冤家路窄，連恩

  在《更好的人》中也是以放蕩不羈與粗魯態度的形象呈現。片中的羅比‧威廉斯受到綠洲

  在內布沃斯開演唱會激勵，將對方視為目標與勁敵，當時那場演唱會也在2021年推出紀錄

  片《OASIS KNEBWORTH 1996》，隔年，連恩也重返內布沃斯公園開唱。2009年因兄弟決裂

  而解散的綠洲合唱團，也在去年世紀大和解後宣布重組，羅比也送上祝福，連恩也曾在社

  群媒體關心對方與憂鬱症對抗的經歷。只能說過去的不和都是年少輕狂，事過境遷之後，

  大家都是英國樂壇的傳奇，也共同經歷過演藝圈孤立、隔離藝人的瘋狂環境，如今都已能

  相知相惜。



  《更好的人》作為一部音樂劇，除了收錄接招合唱團與威廉斯單飛後的知名歌曲之外，也

  有幾場精彩的群舞戲，不禁讓人想到《歌舞青春》系列與《樂來越愛你》。由於接招的經

  紀人奈吉的同志身分，以及同志酒吧比較容易獲得演出機會，接招合唱團一開始的定位是

  「同志天團」，他們的確也以這個名號闖出一片天。以早期的成名曲串燒為背景的群舞，

  不僅快速帶領觀眾走過他們前期的風格演變，也彷彿一起經歷接招快速崛起的那幾年。至

  於妮可與羅比‧威廉斯相戀的那場雙人舞，則是以「She''s the One」為背景，搭配上優

  美的編舞，把郵輪變成充滿粉紅泡泡的場景，不時再穿插兩人其他的相處片段，無比浪漫

  。



  「How did I get mixed up with this fucking monkey anyhow?」



  實際觀影之前，很多人可能會疑惑為何要以猴子的形象呈現羅比，但如同他的歌曲「Me

  and My Monkey」所唱，威廉斯希望他的猴子不會拿槍指著誰，也想了解究竟牠為何會做

  出牠所做的事。羅比‧威廉斯經常形容自己過去像一隻被迫不停表演的猴子，這也是為什

  麼《更好的人》要以猴子的樣貌貫穿全片，海報也採用單飛後首張專輯被鎂光燈圍繞的畫

  面。電影前後呼應，用的都是同一段羅比的旁白。開場時聽，感覺他還有點桀傲不遜，像

  是要炫耀自己的豐功偉業，等到最後同一段自述出現，觀眾才知道，這其實是威廉斯這些

  年來，從猴子「進化」成人類的過程中所產生的體悟。



  「你頭上任何一根毛我都不會想改變。」



  因為《更好的人》講述的是羅比‧威廉斯當年的心魔，所以觀影過程其實很壓抑，但他今

  天可以成功勒戒、走出來，或許要歸功於羅比的阿嬤一直在他的成長過程中注入一點溫暖

  的力量。小時候，除了好友奈特之外，威廉斯並不受同儕歡迎，在家也得不到父親的鼓勵

  與肯定，不過，阿嬤不只從一開始就相信他有才華，也總是支持著羅比‧威廉斯追求夢想

  ，甚至將他比作拔出石中劍的小亞瑟，要羅比不要在乎旁人唱衰的眼光，儘管去做自己。



  甚至在他迷失自我的時候，都是阿嬤從旁看出當年那個雙眼發光的小孫子已經不復見，只

  可惜成名後，威廉斯不常回家，沒能讓阿嬤的愛及時把他拉回來。阿嬤晚年失智，心中惦

  念的總是羅比‧威廉斯，可見祖孫倆的感情多好。要說阿嬤的離世是給予他當頭棒喝的契

  機也不為過，他下定決心在開完內布沃斯大型演唱會（2003）之後，於2007年由好友艾爾

  頓‧強逼迫羅比住院勒戒，也是他成為「更好的人」的關鍵。



  威廉斯的爸媽在他三歲時就離婚，自此之後，他便經常待在阿嬤家尋求慰藉，因此也與阿

  嬤共度許多看電視、吃著洋芋片的親子時光。就像電影裡所呈現的，羅比‧威廉斯加入接

  招合唱團之後，歌迷經常聚集在阿嬤家外，阿嬤甚至會邀請歌迷進屋內，非常親民。雖然

  電影好像輕描淡寫地帶過，但其實阿嬤過世對羅比的打擊真的很大，他發表的第一首創作

  歌曲就是紀念阿嬤所寫的「Nan''s Song」，也收錄在單飛後於2002年推出的首張專輯裡。

  威廉斯耳後有一個「B」的刺青，也是為了紀念阿嬤而刺。雖說阿嬤生前沒能看到乖孫變

  回她熟悉的樣子，但電影最後，羅比‧威廉斯接上延長線，將電視搬到阿嬤的墓碑旁，吃

  著洋芋片懷念祖孫間的親密時光，就是羅比對阿嬤最深的想念。


  --

  Viola''s World：Screen Scream影迷尖叫屋


