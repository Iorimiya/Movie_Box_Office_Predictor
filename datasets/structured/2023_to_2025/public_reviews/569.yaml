url: https://www.ptt.cc/bbs/movie/M.1466146829.A.4A9.html
title: '[好雷] 我就要你好好的－因為彼此而成為更好的人'
content: '圖文網誌好讀版：



  自從看了預告片，就相當期待這部電影，

  即使劇情走向從預告片就能看出來，

  但帥氣男主角、好聽的音樂、浪漫的情節依舊吸引人。

  「我就要你好好的」由小說改編成電影，

  令人好奇電影會怎麼演？故事的走向會不會改變？

  　

  劇中有很多幽默有趣的對話，浪漫溫暖的橋段，也有充滿洋蔥的時刻，

  很喜歡《歐普拉雜誌》寫的評論：「好像邊吃糖果邊掉淚。」

  　

  故事以愛情為主軸，同時探討著一個值得思考的議題，

  如果事情發生在你我身上，我們又會做出怎樣的選擇？






  電影前半段就像一般愛情小說的發展，

  高富帥男主角－威廉，跟身世普通的女主角－克拉克，彼此相處並不融洽，

  威廉卻漸漸被克拉克的開朗熱情與良善所打動，克拉克也越來越在意威廉。


  跟一般愛情故事最大不同是 威廉四肢癱瘓，克拉克則是照顧威廉的看護。

  　

  熱愛運動、外向開朗、有著穩定女友的威廉，在車禍導致四肢癱瘓後，

  彷彿一切都失去了，他變得憤世嫉俗，不想出門，每天繃著一張臉，

  讓他撐下去的理由，只是因為跟父母的約定－活完這最後六個月。

  　

  克拉克家裡的經濟狀況並不好，所以她非常需要這份工作，

  即使一開始被冷漠以待，還是咬牙撐下去。

  　

  威廉與克拉克是天差地遠的兩個對比，

  克拉克為了上班賺錢而放棄學業，金錢的負擔讓她沒想過自己喜歡生活是什麼，

  跟克拉克相反，威廉無論是車禍前還是車禍後，自始至終都清楚自己想怎樣過日子，

  兩人的相遇迸發出絢麗的火花，

  很喜歡看見威廉因為克拉克而展露笑顏的樣子，

  本來那麼不開心的威廉，似乎找回一點快樂的光芒，連威廉媽媽看到威廉改變都驚訝不已

  　

  威廉跟克拉克去聽音樂會的時候，

  威廉偷看克拉克的表情，發現克拉克非常滿足，自己也開心的笑了。

  「我想多停留一下，當那個帶紅衣女孩去聽音樂會的男人。」　威廉說。


  但克拉克意外得知威廉在活完這六個月後，就要接受安樂死，

  克拉克非常無法接受，她希望改變威廉的決定，也為此做了非常多的努力跟準備，

  她希望讓威廉感受到只要活著就會發生很多快樂美好的事情。


  克拉克過生日，威廉跟派崔克互相較勁(?)的場面很有趣，

  派崔克送了刻有自己名字的項鍊，

  威廉則送克拉克小時候最愛的大黃蜂褲襪，克拉克收到褲襪開心到不行。

  　

  其實克拉克有男友我滿驚訝的，因為她在跟派崔克交往途中就已經喜歡上威廉，

  有種劈腿的感覺……

  看小說的介紹，克拉克似乎本來就覺得跟男友不那麼適合，

  但還是覺得派崔克有點可憐，

  也讓我後來沒辦法完全投入威廉跟克拉克的感情裡。



  p.s.派崔克跟飾演《哈利波特》的奈威居然是同一個人



  雖然威廉四肢癱瘓，片中卻仍舊有很多甜蜜到不行的橋段，

  兩人坐在輪椅上面一起跳舞、漫步的畫面太棒了


  當晚威廉跟克拉克一起度過，站在窗戶前被風吹動頭髮跟衣服的克拉克好漂亮。


  克拉克跟威廉度過很多開心的時光，克拉克認為自己跟威廉應該都改變了，

  「因為你，我蛻變成全新的人」　克拉克說。


  威廉卻在此時告訴克拉克他的決定，

  雖然他很喜歡跟克拉克相處，也曾想過自己可能會改變心意，但最後還是決定邁向死亡。


  「我不想你錯過其他對你好的人」　威廉說。

  克拉克崩潰了，她沒辦法接受自己明明跟威廉互相喜歡，明明帶給威廉這麼多快樂，

  威廉看起來是這麼開心，為什麼還是要選擇死亡，為什麼還是要拋下她。

  　


  我滿能理解克拉克的想法，

  我們都知道要改變一個人很難，

  但是彼此相愛時，總會認為對方可能因為愛你而改變，

  可能因為愛你而找到的活下去的目標跟勇氣，

  但是威廉的選擇卻沒變，即使他也愛著克拉克。

  　

  關於威廉決定安樂死這件事，威廉的爸媽也是抱持不同的看法，

  威廉媽媽非常希望兒子能回心轉意，威廉爸爸則是尊重威廉的決定，

  但無論是誰都相當捨不得威廉，因為威廉是他們寶貝的兒子。


  　

  克拉克回家後，卡崔娜問她結果如何，克拉克忍不住落淚，抱著卡崔娜哭了，

  看到這裡我也不自覺流下眼淚。

  　

  克拉克的爸爸安慰克拉克，他說「你無法改變別人，你只能去愛他們」

  克拉克在威廉執行安樂死之前，去探望威廉，然後擁抱、接吻、道別。


  　

  威廉選擇死亡有很多原因，

  畢竟從身體健康、喜愛挑戰極限運動的人生勝利組，

  突然變成四肢癱瘓要人照顧的狀況，很多人可能都不想活下去，

  　

  威廉遇見了克拉克，卻沒有改變他的決定，

  威廉覺得自己無法帶給克拉克幸福，克拉克應該去追求更好的人生，

  況且人都會有自尊心，威廉希望他能夠尊嚴的死去，

  而不是每天讓自己心愛的女人照顧自己，自己卻無法照顧對方，

  　


  還有，也許，對威廉來說愛情並不是他生命中的全部，

  興趣、夢想、尊嚴或者是其他電影中沒演到的(威廉自己的)考量，讓他堅持原本的選擇。

  　

  片中對於安樂死的事情沒有刻意著墨，

  我卻想起以前看過的一段話，

  「在越來越自由的現在，我們保障人們生存的權利，卻剝奪人們死亡的權利」

  生命誠可貴，只要活著就會有美好的事情發生，不可以輕易的選擇死亡，

  所以我們希望救回所有想不開的人，但如果對方覺得生不如死呢……？

  　

  無論大家對於安樂死的看法是什麼，劇中的威廉最後在心愛的人陪伴下跟生命說再見。

  　


  　

  電影的最後，克拉克坐在咖啡廳，讀著威廉寫的信。

  當克拉克起身時，克拉克的腿上正穿著威廉送的大黃蜂褲襪。


  當克拉克往街道上走，艾菲爾鐵塔出現在畫面裡……


  太子廣場，塞納河新橋旁，

  克拉克來到巴黎－威廉生前最愛的地方。



  威廉曾經對克拉克說：

  「你不該滿足現狀，你只能活一次，活得精采充實是你的義務」

  　

  克拉克雖然展現出活潑外向的性格，內心卻比較不敢挑戰或做夢，

  威廉雖然四肢癱瘓，心靈上卻很自由開闊，

  他鼓勵克拉克去浮潛，

  「You can. You can do anything. 你可以的，你可以做到任何事」

  只是短短一句話，我卻覺得很感動，

  起初認為克拉克為受傷後的威廉帶來陽光，

  最後發現威廉也為克拉克的人生帶來方向。

  　

  愛情是一件很奇妙的事情，

  它可以讓兩人之間陷入一團混亂，每天為愛而憤怒、哭泣、傷神，

  卻也可以讓兩人之間，因為彼此，而成為更好的人。


  --'
