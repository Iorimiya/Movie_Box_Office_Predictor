url: https://www.ptt.cc/bbs/movie/M.1737628849.A.F42.html
title: '[  雷] 更好的人 Better Man'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  《更好的人》這部以音樂劇形式呈現羅比威廉斯從叛逆小子蛻變成巨星的心路歷程，先說

  我個人認為電影精彩程度，我覺得跟導演麥可格雷希前作《大娛樂家》有同樣的高水準，

  兩部都將音樂元素發揮得淋漓盡致，但《更好的人》更深入地剖析了主角內心的掙扎與轉

  變。


  電影中可以聽到幾首羅比威廉斯那些經典的歌曲，並將這些歌曲融入劇情，推動故事發展

  ，接招合唱團時期的青春洋溢，到單飛後的狂妄自大，音樂不僅是角色的情感出口，也串

  聯起他人生中幾個重要的階段



  這部之所以能讓我那麼喜歡，是因為整部電影並非單純音樂的堆砌或是導演在秀肌肉(技

  術)，更多的是電影中著重描繪羅比內心的掙扎與成長，電影之所以用「猴子」意象貫穿

  全片，象徵他過去被迫迎合大眾、迷失自我的狀態，再透過父親、團員、女友等重要人物

  的互動，電影從羅比個人內心出發切入，再漸漸探討親情、友情、愛情對他造成的影響，

  以及他如何透過反思與和解，最終成為「更好的人」


  這種以音樂為載體深入挖掘人物內心的敘事手法，其深度與感染力我自己覺得跟導言前作

  《大娛樂家》相比毫不遜色



  --'
