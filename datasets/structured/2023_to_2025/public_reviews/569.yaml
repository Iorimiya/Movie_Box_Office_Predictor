title: '[普雷] 更好的人:可以理解票房低落'
content: '更好的人是由麥可格雷希執導，同時也是大娛樂家的導演

  該編自羅比威廉斯的個人經歷

  原本就不喜歡大娛樂家

  不過這部口碑非常的好

  所以還是好奇去看了

  看完可以理解為何賣不好

  歌舞編排好看

  不過整部片用猩猩的次數真的太多

  主角就不說了

  從頭到尾都是猩猩

  其實可以不用徹頭徹尾

  可以安排上台變成猩猩就好了

  日常也是猩猩看久了感覺厭煩

  還不只如此

  很多羅比在台上唱歌時

  台下還會不時地冒出一堆猩猩

  可以想知道這個用意就是猩猩是羅比的心魔

  甚至還有一場猩猩大亂鬥

  這個強力灌輸的方式

  就是如果大家不買單

  就真的不買單


  除此之外傳記片該有的親友衝突等等本片都算少

  導演還製作過火箭人

  可是本片個人覺得本片水準遠遠落後火箭人

  簡單來說很想看歌舞的觀眾可以去看

  不想看猩猩的人千萬別去看


  --

  他已經答應要寫心得了，不過對於人渣不要相信，畢竟已經是說謊慣犯'
