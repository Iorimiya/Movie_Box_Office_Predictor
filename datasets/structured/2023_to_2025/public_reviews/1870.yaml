  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  《分居風暴》伊朗導演阿斯哈法哈蒂（Asghar Farhadi）的劇本總是電影的重要看點之一

  ，倒也不是像達頓兄弟那種批判並帶有無力感的社會觀察與巧妙，而是角色往往面對體制

  ，周旋在社會關係層次的八點檔戲劇性。於是本片也如《咎愛》般可以單看劇情的爽感，

  或是可以思索關於劇本帶出的道德哲學思考。


  藉由戲劇佈署的「道德的曲徑」。尤其在伊朗這樣十足宗教性國家，所謂的信仰不只是不

  為人知的內在信念，也矛盾像是「榮譽」意味的是關乎社會眾人如何看待的面子與名聲。

  如同中英文片名相對的反義，英雄與狗熊的一線之隔，名聲的象徵性如影隨形也同時遠離

  那位活生生的一個人。


  主角的道德矛盾，藉由平凡人的小善小惡，意圖建構社會的獎勵與懲罰系統，運用常見的

  媒體報導，並隨後添加而上當今流行的社群網路影音多媒體，劇情如同電影本身一切來得

  太快，翻臉比翻書（劇本）還快，但處理得還算是在瀕臨八卦狗血邊緣的寫實與自然狀態

  。


  電影中一句台詞：不是太天真就是太聰明。像是點破一個人在面對外在道德重重選擇中的

  迷障。不管世界如何複雜，它總是回到自身（選擇的個人）。而電影巧妙的就在於觀影者

  的假客觀，容易誤導，或在劇情的引誘下當起了法官。


  總是會想說，雖然不會遇到像主角這樣特別的經驗，但這樣為了一片和氣而犧牲個人選擇

  的隱忍，或者妥協；或電影中演繹塞錢作為報答的「禮貌」，並不是一種殊異的經驗，應

  該是舉世常見的現象。又或者是在社群媒體當道的喧嘩中選擇靜默，獨自好好的做一件沒

  人知道的事情，如同有時創作會轉過身發現不知道自己在忙什麼的遺世感，這或許也是電

  影最後鏡頭的空景，緩緩地將一切還給自身（諸現象），給觀眾最有藝術性的啟示了吧。



  --


  拉特飯 - 以商業力量進入獨立市場


  --'
