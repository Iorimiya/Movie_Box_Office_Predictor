url: https://www.ptt.cc/bbs/movie/M.1437490538.A.660.html
title: '[新聞] 「HERO電影版2」 日本票房周冠軍'
content: '新聞網址： 聯合報


  日前來台掀起木村旋風的木村拓哉，上周末在日本推出新片「HERO電影版2」，創下首周

  票房7億3000萬日圓（約台幣1.85億）成績，不但奪下當周票房冠軍，更刷新今年真人演

  出電影票房紀錄，兩天就有近55萬觀影人次。木村拓哉和松隆子再次搭檔，果然吸睛又吸

  金。


  暌違8年推出的續集「HERO電影版2」，由木村拓哉、北川景子和松隆子主演。根據日劇改

  編的「HERO電影版」在2007年推出第一集，第二集原班人馬大集合，不但有日劇第2季卡

  司報到，木村拓哉飾演的檢察官久利生公平與北川景子飾演的事務官麻木千佳繼續搭檔，

  久違的日劇第一季與電影第一集女主角「雨宮舞子」松隆子，也回歸加入，讓HERO粉絲引

  頸期待。


  對松隆子的重新歸隊，木村拓哉表示，儘管時間相隔有點遠，但松隆子立刻就和大家打成

  一片。「她仍保有能壓制久利生的雨宮舞子的眼神，讓我確信這就是雨宮舞子的眼睛。」

  此外續集電影裡，木村拓哉還將與演技派男星佐藤浩市鬥智，挑戰日本司法大難關—大使

  館的「外交特權」。記者項貽斐／綜合報導


  --'
