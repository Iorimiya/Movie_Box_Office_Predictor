title: '[好無雷] 韓國安重根電影 Hero'
content: '其實好像也沒甚麼大雷可以說~就是改編自韓國義士安重根動手前的電影


  那時候是看電影預告被震驚到 今天剛好有空就去看了

  看完是真的蠻滿意的~ 一方面儘管之前做功課有看到是改編自韓國火熱音樂劇

  但還是相當訝異他們放上大螢幕不同介面時的執行力

  音樂本身就已經是經過聽眾考驗 甚至搞不好韓國耳熟能詳(演好幾年了)

  加上演技 運鏡與美術 真的呈現出相當悲壯的史詩氛圍

  (加上題材完全正確 難怪上映以來在韓國票房只輸水之道 跟最新一周輸灌高)


  二者今年已經看過兩部韓國的音樂片

  前一部"人生多美好" 這次則是選材截然不同的Hero

  不禁感佩也羨慕韓國在類型電影上的又一次站穩腳跟


  特別推薦兩點

  1.主角鄭成華大家可能還陌生~ 查了一下在韓國主要演音樂劇

  電視大概10年沒演了 電影也很少 但他就是音樂劇主角

  這次受邀親自演出電影版安重根 真的是很會唱


  2.演她媽媽的羅文姬 有常看韓劇韓影的可能耳熟能詳

  這位奶奶專門戶這次一樣極為出色 尤其是憶兒的演出相當令人動容

  喜歡她的觀眾可別錯過~


  --'
