url: https://www.ptt.cc/bbs/movie/M.1420198571.A.B17.html
title: 'Fw: ＜IN THE HERO＞－－特攝電影幕後的英雄傳記'
content: "作者: weepchild (...) 看板: C_Chat\n標題: ＜IN THE HERO＞－－特攝電影幕後的英雄傳記\n時間: Fri\
  \ Jan  2 19:18:29 2015\n\n\n\n網誌圖文版:\n\n\n\n　　前陣子出國時在飛機上看了一部名為＜In The Hero＞的日本電影，\n\
  由唐澤壽明主演，故事主軸是講述特攝片武行替身的甘苦談！\n\n　　開場故意做了個特攝片OP感，然後一拍完下戲之後，神龍粉紅(DragonPink)\n走進休息室，脫下面具看到的是個看起來五六十歲的大叔，把戲服最外層拉開來\n\
  散熱時還可以看到裡面穿白色長袖內衣，然後為了墊身材，內衣外面還穿了粉紅\n色的胸罩...不愧是描寫業界殘酷面的作品，一來就給觀眾震撼教育啊！\n\n　　不過畢竟女性的替身武打演員人數不多，加上特攝片戲服又是全身包得死死的\n\
  還戴上面罩，只要身材墊得好，讓男性來代替，確實是日本業界行之多年的慣例！\n\n    當然現實中當然有女武行！本片中也有登場一位，但是劇中這位...穿起戲服看\n\
  起來比較大隻,所以還是去演男人的替身(也就是變身之後的神龍藍)...事實上歷年\n的戰隊系列電視劇，好像多半也都是由男演員來演變身後的粉紅，前面雖說是震撼\n\
  教育，但其實老粉絲們大多都知道這個殘酷的事實。\n\n    大叔我依稀還記得十多年前有同好討論時抱怨過說怎麼不能找女武行來演，像某\n戰隊粉紅那樣一看就很可愛，不像另一部戰隊的黃色，雖然應該是女角但是那麼大隻\n\
  一看也知道是男人－－結果沒多久就被其他同好吐槽說那個粉紅的是男人演的，你說\n的大隻黃色那才是真的請女武行來演的...\n\n    嗯，看走眼也是常態，更何況這年頭很多人也愛說男的更好...其實古今中外，\n\
  從古希臘劇場，到中國京劇中的男旦，以及日本歌舞伎的女形，這些由男人來飾演\n女性的作法，一直都很常見，所以說，其實不用太在意皮套底下是個大叔啦！\n\n　　至於唐澤壽明飾演的男主角則是位演了26年，一直都在當武行作替身的演員，\n\
  雖然在武打替身演員這行當中已經是老大哥，但是即使在特攝這個圈子他的地位\n夠高，但出了這個圈子在演藝圈裡面可以說還是沒什麼地位啊！\n\n　　然後主角其實因為長年擔當武行，頸骨已經有點毛病啦！因為是個薪資不算高\n\
  職業傷害又多而且沒有什麼前景只能靠熱血跟夢想來當糧食的職業，所以跟老婆分居\n（實際上應該是離婚了，因為後面老婆會被勸告考慮去跟人相親），女兒也跟媽媽住\n...雖說至少女兒看自己老爸還沒有到什麼像是看垃圾那種糟糕的地步，但是難免會\n\
  覺得自己老爸有點丟臉，畢竟...\n\n    這位老爸正義感過剩，就像特攝劇的主角是一樣的！跟女兒吃飯的時候，看到有\n奧客在爲小事痛罵店員，於是主角就跳出去指責對方，還擺出李小龍的戰鬥pose！\n\
  \n結果...\n\n店員：先生（指著主角）你再這樣我就要報警啦！\n\n　　好不容易有機會說電影版要加重要的新角色，能夠露臉上大螢幕，演的是電影版\n新登場的，主角神龍紅的反面鏡向，從邪惡誕生的神龍黑－－結果高興的通知親友說\n\
  終於有機會讓自己的臉上大螢幕之後，去開會的當天，被告知說抱歉喔，經紀公司要\n推一個傑尼斯系的偶像，所以決定讓他來演變身前的樣子，您還是穿上皮套戲服繼續\n演變身後的吧！\n\
  \n　　等到了當天，才說不行，這根本擺明沒把人放在眼裡吧？然後更慘的是，被偶像\n踢下新角色就算了還被拜託說請你多照顧這位新人，傳授他一點武打演技，根本毫不\n\
  體諒人啊！而且這個年輕偶像根本一點都瞧不起特攝片！\n\n偶像：\"現在是關鍵時刻，好不容易好萊塢知名導演要來日本拍戲找日本演員，我不\n想花時間在這種哄小孩的東西上頭啊！\"\
  \n\n　　一開始偶像給人的印象就是很惹人厭，不重視後台，瞧不起武行，後來才透露出\n他老媽拋棄小孩跑到美國去，留他一個人養兩個弟妹，所以他一心想說紅到米國的話\n\
  老母就會看到他，希望這樣就能夠讓家庭重新團聚。\n\n　　正因為急於自我表現爭取機會，所以偶像只顧著看光鮮亮麗的一面而忽視其他那\n些不夠吸引人眼球的地方，直到他為了爭取曝光率而要求親自上場卻因為先前都沒有\n\
  跟其他人套招而搞砸為止，才終於發現武打戲不是光靠一個人就能搞定，是要大家一\n起配合才有可能演得好的，他不會打戲，在這次好萊塢動作片的徵選他就肯定過不了\n最後一關。\n\
  \n　　所以偶像終於放下過於高傲的自尊心去向主角求教，主角在知道他的理由之後也\n決定幫他特訓，然後偶像也學會了尊重幕後工作人員以及其他鎂光燈沒有照射到的人\n\
  ，沒有這些人的努力，就算演的是主角，戲劇本身也是不可能成功的。\n\n　　在偶像洗心革面不耍孤僻認真努力之後，終於上了徵選！但是！這個時候那部\n好萊塢電影出狀況啦啊啊啊～～～\n\
  \n\n　　...導演堅持說要不用CG不吊鋼絲的武打，然後該場戲的主角白忍者會從約兩米\n高的地方被打下來掉在地上後爬起來繼續戰鬥，這邊導演還堅持還要搞一鏡到底，\n\
  所以底下沒有辦法擺護墊。\n\n\n　　原本演白忍者的香港武打演員嫌太危險不幹所以抽身走人了，但是這邊是日本\n場面的重要場景，要砍就得整個日本劇通通砍光！換到韓國去重新拍，因為韓國會\n\
  給比較優渥的補助！由於根本找不到其他演員敢接，所以跑去求主角，然後這憨人\n就真的答應去演了...\n\n　　所有人都勸他這風險太大一個失手肯定要出人命的,但是主角心想不會有別的\n\
  機會了，為了讓世界看得到日本武打的努力，最後還是接了。然後旗下的武打演員\n得知後，跑去找製作人要求...既然老大哥要演，那請把這場戲的武打配角(雜魚)\n通包給我們！所謂的殺陣演武，最重要的就是默契！所以為了能讓老大哥賭命的\n\
  舞台可以有最精采的演出，所有人都來了，即使是中途曾經因為對這個業界跟自己\n的才能感到絕望，選擇離職的演員，在此時也歸隊一同努力，展現出最好的表演。\n\n　　最後劇尾的高潮戲就是這個武打，事實上在過程中，那個兩米摔落的橋段，\n\
  主角就受身失敗受了傷，但是他硬撐到演完才倒下，讓戲得以完整拍完收場。\n主角的老婆決定回到他身邊，表示\"這人太笨了，沒我看著肯定會繼續做傻事！\"\n，偶像也因為這片走紅得以去美國宣傳，然後在美國也成功母子相認，結局可謂\n\
  皆大歡喜。\n\n\n　　最後的收尾算是比較傳統，沒啥爆點的日式結局，不過在點出日本替身演員的\n辛苦之處非常的寫實，事實上劇中也不是真的所有人都能有機會實現夢想，飾演神\n\
  龍綠的替身演員，由於光靠替身的薪水難以負擔支出，所以需要額外賣保險，苦撐\n了多年之後，看到偶像成功獲得徵選之後，比起爲後輩高興，更多的是感受到自己\n沒有才能無法走紅的苦澀，於是遞了辭呈。\n\
  \n    神龍粉紅的替身演員，雖然是業界中最資深的女角替身，但是內心還是奢望著\n如果能夠不是扮演女人而是扮演領隊的紅色的話該有多好，然而身高不夠是他注定\n\
  無法擔當主角替身的硬傷。在自己婚禮的餘興節目上，主角安排讓他扮演神龍紅來\n拯救新娘，當他摟著妻子流淚高喊著我是你的主役英雄的時候，作為觀眾的我，總\n覺得這個眼淚並不純粹是高興，也多少帶著無法真正演出主角的辛酸。\n\
  \n    總體來說就是因為整個過程已經夠痛了，結尾不能不給點救贖啊！\n\n　　強烈本片推薦給喜歡特攝片的同好朋友們，另外如果是喜歡唐澤壽明的朋友，\n也千萬不能錯過，因為唐澤先生原本就可以說是從動作演員出身，曾經加入過東映\n\
  動作俱樂部，甚至還在《10號誕生！假面騎士全員集合！！》這部特攝片中擔當過\n騎士人一角的－－替身演員！\n\n    我想這部電影中呈現的，應該確實是有不少部份取材自唐澤先生的真實人生\n\
  體驗，所以在此也強烈推薦給喜愛唐澤先生的朋友。\n\n最後，奉上本片預告：\n\n\n\n--\n                              \
  \    01/02 19:19"
