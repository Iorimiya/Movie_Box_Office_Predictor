title: '[好雷] 檢察官們回來囉 !! ------《Hero 2》'
content: "檢察官們回來囉 !! ------《Hero 2》\n\n\n\n網頁文：\n\n\n\n    看完《Hero 2》的電影，第一反應就是好想吃大香腸呀！看起來十分美味、可口，\n\
  \n怎能不吃吃看。可惜一直找不到台北附近有這樣食物的店家，只能用眾多口味的小香腸\n\n來滿足一下悸動的胃。\n\n\n\n    故事的劇情是圍繞著一樁車禍命案，身為檢察官，一場車禍關係到一個人的死亡，\n\
  \n以及另一位肇事主未來的命運。這是單純的事件，抑或是某一種的暗藏殺機，意外只是\n\n表面，還有什麼內幕呢？此次困難的地方是牽涉與外國領事館的特別的免責權，日本地\n\
  \n方的檢察官可以入室偵查嗎？\n\n\n\n    大部分的檢察官聽到是牽涉外交領事館的案件，都選擇草草了事，但身為男主角的\n\n久利生公平，當然有自己的堅持，而且這次遠赴來協助辦案的，可是當年跟著自己的菜\n\
  \n鳥事務官雨宮舞子，兩人的感情交流如何？事件會如何發展？還是要隨著自己的信念，\n\n去試試。\n\n\n\n    日本電影節目好看的地方，就是可以為了自己的工作堅持而努力，不論是哪一個行\n\
  \n業，都會將自己的價值呈現給觀眾，讓我們除了看裡面的感情內容，也可以了解各個職\n\n業的價值，給人一種安定神經，往前的力量。\n\n\n\n    《Hero\
  \ 2》也是這樣，儘管現實的考驗在眼前，久利生還是不顧眾人的反對，持續\n\n自己想要挖掘真相的路，還因此感染身旁的夥伴們，讓大家一起齊心合作，各盡一份自\n\n\
  己的心力。這樣的渲染力，也是我們目前社會中所渴望的，當有一項正確的抉擇出現，\n\n只要有人堅持，人就會被默默的感染，然後就會一起向前，多麼感人的力量！\n\n\
  \n\n\n--"
