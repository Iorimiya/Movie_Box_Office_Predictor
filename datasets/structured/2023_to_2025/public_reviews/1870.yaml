url: https://www.ptt.cc/bbs/movie/M.1422171988.A.DC5.html
title: '[好雷] 大英雄天團Big Hero 6 -愛是無所不能'
content: '心得:

  這部是走療癒系列的風格無誤，流暢、搞笑、溫馨兼具，創新與發人深省程度不若《無敵

  破壞王》、性感與美艷、朗朗上口程度也不如《冰雪奇緣》，其它夥伴的著墨深度與人物

  刻劃又過於薄弱，似乎變成理所然的取捨。



  官方版mv 主題曲

  非常可惜與遺憾的是完全沒有任何創意，就是照著一個cd播放…然後…沒有然後了，從頭

  到尾就是cd在轉。畢竟mv還是有視覺性需求，這也許是很大膽的嚐試卻一點也不適合當影

  片看待，因為就一個唱片轉來轉去，其實可以閉上眼睛也沒差。只有一點點的真人演出，

  只在開頭而已。當然也沒有任何電影動畫畫面，可能是版權關係或要有所區分，不過真的

  可以多一些變化或另寫角本演出更搭這主題曲的。


  其中一首主題曲 Story AI - 永遠都不要放棄（杯麵）比較輕柔


  Fall Out Boy-Immortals 打倒男孩樂團的《無所不能》

  他人說我們是如何

  我們何必去迎合？

  儘管素行不良亦為我能做到的完美

  我將成為永耀火焰的守望者

  也將成為你那熱烈夢想的守衛犬

  哦！

  我如沙漏中時光飛逝的沙礫

  哦！

  無法想像你若不在我的身邊會怎樣？

  只因你和我同在就能無所不能

  即便稍縱即逝

  現在起你我還是直到永遠

  拉下窗簾擋住他們的視線


  我們無所不能x4


  有時抱有信念付出的唯一代價就是

  儘管歷經千錘百煉

  我還是比較著你的昔日與我的將來

  那怕是你的傷口 那縫合時的傷痛我也深深感受

  …以下重複




  這首歌的量身訂作很切合故事主角的兄弟情，儘管劇情沒有太出乎意外的新奇面，療癒系

  的機器人勢必緊扣淚線與心弦的最後一道防線。難怪有網友將它改成龍貓的圖，太適合了

  而主角的「英雄」名，總讓我想起美劇Hero中那能穿梭未來的憨厚角色。英雄的定義，善

  與惡的掙扎、暴力與癒合、守侯與反擊，遠遠不如無敵破壞王來得深刻與反叛，卻自有一

  股萌系療癒風。劇情是似乎走向皆大歡喜的大結局，天才弟弟灰心喪志的谷底期間，難免

  令人不耐卻是必備的橋段(發現兄長留下來的愛的象徵與具體的守侯)。每一次的反問這種

  行為會有助於療癒你嗎？像是可長可短的回力球，迴旋鏢輕輕丟出帶回可大可小的震憾與

  反思，會不會這走錯路是摸索的必需過程？這暴力與復仇的試探也是回歸正道(或者觀眾

  期待)的必要轉折，起承轉終將走向合。


  人生，一定會受傷、一定會迷失、一定會衝動、一定會挫折


  可是，相同的是，也一定會癒合，總會有站起來、走出去的那一天


  回頭一望，那真正無所不能、無處不在的魔法與奇蹟，借由科技的延伸與固體化，溫柔的

  象徵、勇氣的凝結、手足情的無盡迴盪，答案呼之欲出。再平凡也不過卻是一切的根本，

  不太有什麼離經叛道的大道理，卻在某些片段還是緊緊揪住大家的心。









