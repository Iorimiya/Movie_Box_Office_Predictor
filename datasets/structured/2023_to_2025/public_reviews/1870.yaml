url: https://www.ptt.cc/bbs/movie/M.1609071059.A.C69.html
title: '[好雷] 全民小英雄 We Can Be Heroes (Netflix)'
content: '很 B級的一手包辦導演 Robert Rodriguez ，繼拍過最高預算劇情最正經動作最紮實的《艾莉塔：戰鬥天使》後，在聖誕節 Netflix上架的超英片《全民小英雄》終於回到老本行了。所謂他的老本行又是哪一行？是《英雄不流淚》還是《殺千刀》還是《萬惡城市
  2》？這一次比較像是《小鬼大間諜》那一系，如同過去在大人諜報片當紅時他要拍部兒童諜報片一般，這次在大人超英片當紅時他也來拍部兒童超英片。




  本片有不少我們熟悉的大人演員穿上派對戲服演喜劇式超英，譬如還在大銀幕上演《神力女超人1984》的 Pedro Pascal 、譬如在《玩命關頭》和蓋兒演情侶的姜成鎬、譬如《斷箭》的老小生
  Christian Slater ，那些逗趣角色們各有對超人閃電俠喪鐘梅拉黑金絲雀霹靂火驚奇先生 X教授等經典超英的致敬... 不過在一場又像復聯「紐約大戰」又像
  MoS「大都會之戰」的外星人入侵中，所有大人英雄通通被抓了、英雄的孩子們被集中保護、關進一棟外觀有像「神盾局」Logo有像「復仇者大樓」的英雄總部中。


  既然爸媽被抓了、象徵大人世代失靈了，那地球未來當然掌握在孩子們手中！片末居然還致敬兼惡搞了DCEU《正義聯盟》望向遠方的鏡頭 XD 當然這裡的大人一定自私自利、勾心鬥角、世故猜忌、忘卻初衷、終成一盤散沙被各個擊破...
  在近年一種 Greta Thunberg 式的少兒勵志中，的確是會出現這種「大人早已腐敗、幼苗才有希望」的論調，而且本片到最後還會把這個隱晦的論調直白說出來成為結論！這種少兒勵志好不好呢？我也不知道，有人說讓少兒別這麼快毀掉對家長的理想期待比較好、有人說讓少兒早點面對現實認清世故比較好...
  這見仁見智，能接受再看。


  劇情大概是：某天一堆章魚外星人駕著章魚太空船大舉入侵地球了、超英組織 Heroics指揮超英爸媽們升空迎擊全數被抓了、懦弱的美國總統舉手投降準備獻出地球執行「交接」了、如校長般只會約束小孩的女指揮官
  Granada女士把超能孩子們保護在地下碉堡誰也不准動。當然美國的民族幼苗不會乖乖坐以待斃的、一定同心協力另闢蹊徑闖出一片天、把校長形象的指揮官氣個半死就是一大樂事！曾經他們的父母一盤散沙被各個擊破了，如今他們一樣各有小屁孩個性互看不順眼，不過人人都有被父母望子成龍望女成鳳其實卻被當籠中鳥過度保護的矛盾童年...
  必須改變！




  這裡孩子們很多，主要以群戲的一搭一唱來表現，說難聽是角色發展不夠立體有深度，說好聽是群戲節奏感緊湊又歡樂，彷彿看得到 Robert Rodriguez 當大哥哥帶一群小孩嘻嘻哈哈在演話劇似地。這裡人人都有超能力，有的和其父母的能力相似、有的則恰巧相反、總之都處在一種「這能力沒什麼用」的喪氣心態中，平常彼此聊天打屁膨風時會吹牛吹到天上去、但危難當頭需要祭出能力時都變成縮頭烏龜。於是很老梗地，其中唯一沒有超能力的女主角
  Missy成了領導者，因為「團結領導」知人善任又懂得動腦、就是她的 super power。


  這一路冒險，Missy 先臨危不亂迅速指揮發揮大家的能力、再懂截長補短讓團體實力加成、然後傾聽大家各自的焦慮給予相應的激勵、最終不止指揮戰陣籌劃計謀更帶起大家的信心！這一切情節都是正向勵志的、這一切互動都是童趣屁孩的，我個人覺得小笑點是精彩連連喘不過氣、但真要說什麼驚天計謀或驚人動作好像也沒有。而打鬥的場景，從地球搬到了外星太空船，那場景設計簡直像是童話派對糖果屋，隨著角色們相繼聲稱「是為小孩打造的」甚至「是由小孩打造的」，一種「Robert
  Rodriguez在自家車庫」把美術建模後製配樂一手包辦的大男孩玩樂感油然而生。


  而最終，「為小孩打造」與「由小孩打造」這些充滿暗喻的宣言、在反派大梗終於爆出時都由暗喻變成了明言！只差外星大反派沒找 Greta Thunberg （或和她長很像的《單親貴族》小女主角）來友情客串
  XD 回想本片前置與開拍都在 2019 年，剛好是全球中學生響應小葛 School strike for climate的時節，不知此片是否要讚頌這些孩子的努力、或是說搶食這塊孩子的市場呢？片末這「大人未能團結而讓地球陷入危機」、「懂得團結面對的下一代快快接手」的「交接」儀式，是否也在由小見大控訴各種國際合作保護地球的各懷鬼胎終致失敗呢？




  此片很有童趣，是我一路享受不覺冷場的；此片對許多經典超英做了致敬與嘲弄，也是令我嘴角上揚的惡趣味；此片的童話糖果屋美術設計，那質感越幼稚越有 Rodriguez感；此片的兒童創意動作與計謀則比較平凡，並沒多大新鮮感也不像真有什麼獨特競爭力；此片的「大人搞砸了、兒童救世界」之宣言，那說教感相當直白甚至回想現世喻示恐有
  SJW之嫌 XD 無論如何，我是為了看 Robert Rodriguez 而來的，《艾莉塔：戰鬥天使》雖然好看但不像他作品，他這次《全民小英雄》雖非他風格的一流表現但至少《小鬼大間諜》風味有重現幾分，只推薦喜歡他的觀眾欣賞。



  —

  本片片名顯然取材大衛鮑伊名曲 "Heroes" ，片中還有個超能唱歌正妹每事必唱，不過其中我覺得最搞笑的是范吉利斯《火戰車》配樂：



  --

  這種片的存在多重要呀！我兒第一次完整看完真人電影是六歲看侏羅紀世界2'
