title: '[好雷] Big Heros 6 --- 很好哭的一部片'
content: "由於\"無敵破壞王 \" 我開始注意到這部 Big Heros 6\n中文或英文的片名老實說\n實在一點也不吸引人 --> 大英雄天團 (Big\
  \ Heros 6 )\n\n看完預告也覺得只是很好笑\n不過衝了之前看\"無敵破壞王\" 的感動\n最近工作也很煩\n想找部電影來好好\"哭\"一場\n\n\n\
  \n\n\n\n\n\n ----- 此為底下有雷分割線 -----\n\n\n\n\n故事一開始，就是很有未來感的機器人打架\n之前看過休傑克曼的鋼鐵擂台\n\
  雖然是小型機器人打架\n但是編劇很巧妙的用 \"好人臉\" & \"壞人臉\"\n分出來的後面的劇情\n弟弟 (好像是叫做阿廣)是個發明家小屁孩\n哥哥 (阿正)是個也是實驗室Nerd\n\
  阿廣在阿正個引導下，也想跟哥哥上同一間大學\n在一次的實驗室意外，哥哥就掛了\n只留下他的 Healthy care Robot (像米其林輪胎的白色機器人)\n\
  \n\n然後更意外的發現\n哥哥的死原來不單純，跟一個野心的發明家有關\n一開始為了復仇\n但是白色機器人內建是治療系統\n一點點循序漸進的把阿廣往正確的方向導入\n\
  \n中間細部....就等各位進電影院慢慢咀嚼欣賞\n哈哈\n\nQ : 為什麼我很推這部片\nA : 因為有幾個很好哭的點\n\n1. 白色機器人第一次出場，是在哥哥離開之後，從背後給阿廣一個深深的擁抱\n\
  2. 白色機器人消失的唯一方法，就是阿廣說 Thanks for your service.\n3. 最後，白色機器人掉到黑洞前，用盡最後的燃料，等待阿廣說\n\
  \ thanks for your service, 然後在博士女兒和充滿回憶的白色機器人，做出選擇\n阿廣默默說出 \"Thanks for your service\"\
  . 然後...金剛飛拳，就讓阿廣從黑洞逃脫\n出，看到白色機器人掉到黑洞底，白色又胖胖的身影，那一幕...我的眼淚，\n根本就是用噴的，那個是阿正(哥哥)的回憶的機器人，感覺是要跟過去說再見\n\
  \n\nPS : 再騙了觀眾很多眼淚之後，你就會發現導演鋪梗的能力，原來機器人的金剛飛拳\n還有阿正(哥哥) 的晶片，所以...弟弟又再次把機器人研發出來(感動推....)，對了!!\n\
  電影最後有彩蛋，不要太快離開戲院喔!!\n\n\n\n\n\n\n--"
