url: https://www.ptt.cc/bbs/movie/M.1441369816.A.8BA.html
title: '[好雷] HERO2 觀看心得'
content: "～之防雷頁～\n\n\n\n\n\n\n\n\n\n\n我心目中永遠的大神又要登上大螢幕！！！！\n\n二話不說揪朋友一起去看～\n\n\n一開始以受害者事故發生的一間房子開場，受害者不斷的狂奔～有點恐怖片的Feel\
  \ XD\n\n一股緊張的氣份隨之而來，最後受害者跑到房子的後門發生車禍身亡，\n\n而木村大神所飾演的久利生就負責這次意外的案件。\n\n\n當久利生正在審訊駕駛，另一方面松隆子飾演的雨宮所追查有關黑幫的案件，\n\
  \n似乎跟這起車禍有關聯，所以前往跟久利生一起調查案件，\n\n根據駕駛所說受害者從巷子跑出來沒看到就撞到了，於是前往案發現場勘查，\n\n隨即發現後門是大使館！！！\n\
  \n\n一堆人都放棄追查真相，只有久利生不斷的追查，\n\n之後走在路上等紅燈要過馬路被人推出人行道，差點被車子撞上，\n\n又發生久利生跟麻木(事務官 北川景子飾)在路邊攤被大卡車追撞，\n\
  \n在醫院久利生跟雨宮的對話，讓久利生城西支部的同事們都一股滿腔熱血～\n\n大家分頭行事調查，最後追查出真相～\n\n\n我認為本劇有幾個重要的看點：\n\n\
  1.木村大神跟松隆子的合作睽違八年～～！！\n\n2.這部雨宮前後的表現都顯示出，她喜歡久利生，但最後兩人的感情留伏筆。\n\n3.在電視劇第二季出場，外表跟性格差很大的麻木，在這部也有一點點的感情內心戲。\n\
  \n4.雨宮被流放(?)，之後的發展令人期待，我認為這是伏筆之一～\n\n5.劇中有很多橋段一樣也很令人大笑XD，劇中人物非常有趣的互動也是HERO的一大看點！\n\
  \n6.揪竟～久利生會不會再跟雨宮在一起呢？\n\n\n\nHERO好看的地方不僅是久利生的正義，更好看的是一直留伏筆的感情線，\n\n相信不久會有續集～我很期待看到久雨配開花結果XD\n\
  \n\n個人看完之後第一個想法是～受害者為什麼會受害沒有明確的答案？\n\n答案都是檢察官們根據查到的證據後推測出來的，\n\n受害者在一間餐廳上班聽到一些秘密，所以才會被殺人滅口～\n\
  \n那個秘密是什麼？不過最後大使做出的決定有驗證檢察官們的推測。\n\n\n\n還有一點是電影一開始的時候，受害者為什麼很慌張的狂奔？\n\n的確是有幾幕西裝衣褲的背影畫面，但是他是拿刀要追殺她呢？\n\
  \n還是要侵害她？在最後也沒有交待清楚那時候是發生什麼事情，有點可惜。\n\n\n整部電影的表現都還不錯～劇中人物的互動也有很多笑點，還蠻歡樂的～\n\n雖然我比較喜歡木村拓哉搭柴崎辛，不過木村拓哉跟松隆子也是很棒的一對螢幕情侶～\n\
  \n\n如果喜歡看日劇，甚至喜歡木村大神的話，還蠻推薦你去電影院看這部的^^\n\n--\n                \n\n\n--\n感謝糾錯"
