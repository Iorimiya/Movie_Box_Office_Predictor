url: https://www.ptt.cc/bbs/movie/M.1441467349.A.0E5.html
title: '[好雷] HERO 2 電影版'
content: "期待已久的HERO電影版終於在台灣上映了，\n\n其實8月去日本看演唱會的時候，已經先抽空去看過了，\n\n當時因為日文還是有一小部分不是很能理解，在日本的電影院裡面有點分心\n\
  \n昨晚在台灣看到有字幕的，感動的程度有加三成（毆）\n\n台版字幕翻譯的很不錯也很到位，這一點值得稱讚！\n\n會在上映第一晚就衝戲院的果然都是死忠粉絲，看電影的氣氛超級棒！\n\
  \n台灣的觀眾真的比較放得開，該笑的地方通通都會笑出來，\n\n不像日本的觀眾整場靜悄悄> <\n\n好了以上是無雷感想，下面開始有雷……\n\n\n\n\n\n\
  \n\n\n\n\n……………………………有雷分隔線…………………………\n\n\n\n\n\n\n\n\n\n\n\n\n\n主要案件的故事，其實非常的HERO。\n\
  \n由一件看似普通的案件，在城西支部所有人努力不懈追查下，\n\n找出事件背後的真相及牽連的巨大問題。\n\n松隆子的回歸，帶來依然和城西支部默契十足，化學效應豐富的雨宮舞子。\n\
  \n不論是城西支部的集體八卦，雨宮跟久利生久違的搭檔。\n\n看得到角色間的默契，更看得到角色的成長。\n\n雨宮跟久利生每一場對戲都讓我看得目不轉睛。\n\n\
  不論是久違重逢當下久利生手中的健身器材掉落，雨宮刻意搞笑搭話，\n\n兩人在大使館外面的互動讓老觀眾熟悉，又感受到雨宮已經獨當一面的氣勢。\n\n在牛丸次席面前雨宮又回到以前那種有點氣弱死板的事務官。\n\
  \n雨宮第一次要離開城西支部的時候，衝進久利生辦公室那瞬間景物依舊她卻語塞，\n\n又有點氣惱地對久利生說「你沒有話要跟我說嗎？你一定覺得很失望我居然放棄了吧！」\n\
  \n這一幕一幕再再都豐厚了雨宮的角色層次。\n\n\n\n當雨宮隔著電話，感受到城西支部所有人熬夜為了幫久利生追查線索的時候\n\n終於也開始衝了，搞來大使館晚宴邀請函，跟久利生一起潛進晚宴互相鬥嘴的時候。\n\
  \n我彷彿又看到了2001年那對黃金搭檔的互動，\n\n那種「果然就是要久利生跟雨宮啊！」的感覺，當下讓我差點冒出雞皮疙瘩。\n\n\n\n劇情當中也一直很巧妙地埋進各種橋段，展現久利生當年對雨宮的影響持續至今。\n\
  \n我最喜歡的一幕，莫過於雨宮回到大阪難波支部時，\n\n發現同僚也為了她擅自的行動，加班熬夜消化她應該處理的案件。\n\n那個瞬間，我突然理解到，\n\n「雨宮也成為另一個像久利生了一樣，能用追求真相的信念，影響旁人的HERO了。」\n\
  \n這一點跟最後雨宮對久利生說出「我決定走上跟你一樣的道路」相互呼應。\n\n\n\n片中也透過久利生的話語，強調麻木跟雨宮是不同的個體，並沒有誰能取代誰。\n\
  \n麻木跟雨宮最後的對話，讓我既感動又感傷，\n\n雨宮大方承認了「我很喜歡久利生唷！」\n\n從雨宮一句句描述久利生固執又難搞性格的話語中，\n\n我感覺到那種喜歡超越了單純的戀愛，\n\
  \n但這或許也是久利生跟雨宮在戀愛上沒有修成正果的原因。\n\n\n\n\n最後兩人的道別，我記得我在日本電影院聽到雨宮那一句\n\n「我哪…決定走上跟久利生你一樣的道路了！」\n\
  \n眼淚居然完全無法控制地掉落下來。\n\n因為走上了一樣的道路，所以無法再並肩而行，\n\n但從兩人相背而去時輕鬆的腳步和笑容。\n\n或許、或許，未來在某一刻、某一個地點，兩人會再相遇也說不定。\n\
  \n\n\n我覺得電影中是刻意把木村拍老的（毆），\n\n歲月的痕跡讓他洗練了，但某些部分依然不變。\n\n城西支部新成員間的互動，比起日劇版更進步了，角色性格也更明顯，\n\
  \n連警衛都很有戲，這就是HERO團隊的魅力吧！\n\n還有一些小小跟舊版致敬的橋段，\n\n比如說田村雅史（杉本哲太）跟遠藤賢司（八嶋智人）去追查砂石車，\n\
  \n最後田村壓制心虛逃跑的業者後，一群人一擁而上的畫面。\n\n跟日劇版阿部寬演過的十分神似。\n\n久利生跟雨宮在大使館被抓到關在地下室，兩人擠在沙發上，\n\
  \n也讓我想起日劇雨宮到久利生家借住時在沙發上的場景。\n\n\n最後的片尾……請一定要看完，\n\n一幕幕HERO的畫面有如回憶的軌跡，\n\n每一幕都能讓老粉絲瞬間想起劇情，\n\
  \n就像當時我旁邊的男生說的「這也太感人了吧！」\n\n沒錯，「這也太感人了吧！」 HERO就是這樣一部有魅力的戲劇。\n\n--\n            \
  \                        09/05 23:52\n                              已更正了！感謝指正！"
