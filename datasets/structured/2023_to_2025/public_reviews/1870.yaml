title: 'Re: [負無雷] 大英雄天團Big Hero 6'
content: "本篇是[好雷]\n\n!!以下多少有大英雄和些許馴龍劇透，未看者小心被雷!!\n\n\n\n\n\n\n\n\n--- 稍微隔遠一點的防雷線 ---\n\
  \n\n\n\n\n\n\n\n先說個人對親情劇碼哭點特別低，當初板上正負評五五波的馴龍2哭得比這部更慘\n\n(一方面是非常喜愛馴龍系列，第一次看2時中間被衝擊後就一路低落到片尾，\n\
  \n 二刷時從Stoick的見到老婆、到用小船送別這整段眼淚沒停過)\n\n其實看大英雄已經是兩三個禮拜前的事了，本來沒有想特別打一篇心得文，\n\n但看到原文章和底下推文，想寫一些自己的感受：\n\
  \n\n\n大英雄天團給我種莫名的親切感，\n\n即使它的時空背景，是融合舊金山和東京的先進科技世界，\n\n但裡面人物的經歷，卻是常可以在現實生活中體會到的：\n\
  \n例如 總在一起玩樂搞怪的手足、\n\n      口頭上嘮叨卻用行動默默愛你的長者、在學校興趣相投的同好等；\n\n還有 失去親人朋友的傷痛、恨意以及原諒、\n\
  \n      永不放棄、換個角度想、幫助有需要的人等等。\n\n\n我覺得大英雄天團其實很貼近現實世界，許多事情往往沒有絕對的黑或白。\n(但畢竟是迪士尼動畫，所以當然有被簡化並充滿正面理想)\n\
  \n這部片裡沒有所謂的\"好人\"，\n\n大家都只是普通人...或是比普通人再聰明一點的宅宅大學生們。\n\n也沒有\"誰\"是絕對的壞人，只有被憤怒而侵蝕的心。\n\
  \n\n就像現實生活，的確有人會為了鼻屎大的動機就引起汪洋般的殺意，\n\n何況教授是失去最愛的女兒、而且對方還一副滿不在乎的態度呢?\n\n\n\n其實阿廣跟教授的命運本來會是一樣的──\n\
  \n沉浸在悲傷和傷痛裡，被仇恨占據甚至殺人。\n\n但他們倆最大的差別，就是阿廣的身邊有愛他的人。\n\n\n在阿廣失去最重要的人時，凱絲阿姨持續默默地守護他；\n\
  \n意外出現的杯麵，強勢XD執行治療計畫，讓阿廣原本如死水的心開始流動；\n\n還有在事情前後總是幫助阿廣的朋友們，\n\n在他失去理智時及時阻止他，並且完全接納，與他一同哀傷與渡過難關；\n\
  \n哥哥就更不用說，不管是生前還是生後，都是阿廣最溫暖的安慰。\n\n\n反觀教授，或許他有其他選擇，但他的心中只剩下復仇，\n\n任憑強烈的恨意吞噬了他的心，\n\
  \n抹煞掉一切阻擋在他前面的人，甚至是自己的學生，\n\n直到他最後才發現，過去仇恨蒙蔽了他的理智，\n\n使得他從未想到過自己或許有能力修復機器去救女兒，\n\
  \n最後也失去和女兒重逢享天倫之樂的權利。\n\n\n因此我個人認為，大英雄天團表面上看似英雄片，實際上的主軸卻是\"人的情感\"。\n(所以雖然北美是主打英雄，但在日本卻是主打親情)\n\
  \n說實在這部片是非常有正向教育意義的動畫片(認真\n\n\n\n關於\"nerd\"這個特色我也覺得非常可惜!\n\n這四位朋友人設非常有趣，只可惜篇幅和主軸的關係而無法打出每個角色的深度。\n\
  \n另外，身為比普通人聰明的科技宅，最後大戰卻無特別令人驚艷的表現，\n\n雖然有呼應(換個角度想)但基本上沒甚麼合作戰略可言，實在浪費了這個設定。\n\n\n\
  \n\n這點對我來說就不這麼認為了。\n\n大英雄和冰雪(破壞王沒看過所以不談)兩部都有優點和缺點，也各有令人喜愛的部分。\n\n單就親情和友情的刻劃來說，我對於大英雄的共鳴比冰雪多很多。\n\
  \n\n有趣的是，驅動故事裡情緒的角色，竟然是一個沒有情感的機器人。\n(\"Baymax isn't a person, he is a robot. He\
  \ has set of programming.\nHe drives the emotional story, but he doesn't have any\
  \ emotions.\"\n by Hank Driskill, tech supervisor)\n\n杯麵這種呆萌又治癒的笑點正中我的點，加上感情戲也完全命中要害，\n\
  \n所以雖然這部片稱不上是神作，\n\n但充滿了歡笑、悲傷、接納和愛，看完會讓人感到心是暖的。\n\n\n\n====\n\n最後，雖然主角是阿廣和杯麵，\n\n\
  但個人認為貫穿影響全片的卻是隱藏人氣王──哥哥阿正。\n\n先撇開不討論他是否有點正向的太過分了(強烈懷疑因為太過完美所以必須被賜死XD)\n\n但他的善良和幫助人的信念，\n\
  \n創造了杯麵、影響改變了阿廣、甚至促成Big hero 6的誕生。\n\n\n中間放映影像那段真的很棒...(哭\n\n--\n(握手!!)\n真的  就是喜歡單純歡樂.溫馨的勵志故事\n\
  但現在好像只有精細繁複或人性寫實的電影才叫深度...orz\n兩種不同取向的電影  只能說鳥人比較合你的口味囉  青菜蘿蔔各有所好\n謝謝a大! 過了這麼多天還有人回\
  \  真感動!\n謝謝u大! 喜歡這部的情感+1 不是驚天動地,卻讓人感到厚實且溫暖"
