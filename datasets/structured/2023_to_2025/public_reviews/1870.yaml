title: '[好雷] HERO 2 電影版'
content: '身為ＨＥＲＯ迷

  昨天晚上吃完晚飯直接衝戲院

  也許大部份人還在少女時代

  所以難得坐到了不錯的位置


  詳細劇情就跳過

  基本上就是久利生式的辦案

  我想說的是一些橋段真的要看過之前系列的人才會有反應

  例如所有城西支部除了部長外的男性都被久利生影響買電視購物

  田村檢去修車場抓嫌疑犯時完全就是致敬第一部的芝山檢他們那集

  其他像是法式滾球比賽時一直弄成像星際大戰實在有夠煩www

  還有進藤春菜終於不負眾望露臉了 HERO 2日劇時大家可是期待了很久

  當然沒看過前作的

  這部仍是部充滿正義,歡笑與淚水的好戲 只可惜會少了那麼點味道

  在大使館被抓到時

  久利生語帶雙關的問雨宮為什麼要回來

  加上最後一幕雨宮頭也不回的離開

  看來現在是雨宮佔優勢啦

  就看有沒有下一集換久利生殺去石垣島啦


  --'
