title: '[請益] HERO2中,木村的動作用義?'
content: '最近補了HERO2電影版

  甚很喜歡

  但有一個鏡頭一直看不懂


  就是後面

  久利生帶著雨宮和麻木來到紐斯特利亞公國大使館時

  三人的排列是

  麻木  久利生  雨宮

  涉案的公使從大使的辦公室走出來

  和久利生一行人面對面要擦肩而過時

  公使原來要從久利生和雨宮間走過

  久利生特意伸頭擋了公使的去路

  公使改由久利生和麻木間走過


  想請問

  久利生伸頭的動作有何用意?

  應該不是調皮那麼簡單吧

  還是警告

  不管涉案者藏多深,久利生都會把他挖出來

  但在人家的地盤警告,很怪

  還是另有涵意呢???


  謝謝


  --'
