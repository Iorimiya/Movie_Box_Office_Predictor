url: https://www.ptt.cc/bbs/movie/M.1463134832.A.54A.html
title: '[極好雷]請叫我英雄 I AM A HERO'
content: '基本上日本改編漫畫的題材

  如果是脫離日常要素，那炸掉的例子比比皆是


  大概幾年前在電影院被強姦眼睛的某ㄎ學小飛俠

  (火鳥攻...火鳥攻你X啊...

  之後正個在電影院被嚇傻的巨人

  我非常訝異我居然把上下集都看完了


  雖然心目中不是沒有看過好的片

  如死亡筆記本、神劍、寄生獸(僅限上集)...等

  不過就我看過的日漫改編片裡面 沒達標的還是超過了六成以上


  所以今天去看英雄時其實沒有抱持非常大的期待

  大概想說有原作開頭的一半就夠了，反倒遠遠超出我的預期


  這片讓我在電影院背脊發涼了五六次

  腎上腺大爆發了兩次，出了戲院以後真的非常過癮

  ====================================分界線====================================

  我本來就不是對殭屍題材特別喜歡的人

  雖然看過原作，不過並不算原作粉

  漫畫大概看到一年前就沒再追下去了，

  所以在看電影時雖然~很多場景有印象

  不過並沒有特別去找彩蛋，或是跟原作有致敬或重疊的地方


  男主角由大泉洋飾演之下

  少了幾分噁心大叔的味道

  倒是更多添了幾分廢柴味


  有村飾演女子高中生比呂美

  不過因為中後期因為===嗶===的關係

  所以基本上不需要演技(?)


  然後長澤雅美不愧是我小時候的女神

  變成戰場大姐頭風格以後非常讚


  這部片的番茄醬也是和寄生獸一樣噴免錢的

  殭屍出來以後的末世絕望感也有呈現出來

  算是非常值得一看的地方

  比起年底終於要到最終章的某惡靈骨塔比起來還要真實

  ==================================以下有雷====================================

  這部大概的劇情走向和漫畫差不多(印象中)

  男主角日常→跟鐵子吵架→遇到比呂美→

  比呂美發病→到商場→逃離→結束

  不過男主角認識比呂美、到比呂美發病都跳過很多細節


  不過好處是沒有日本電影令人詬病的說教或是無謂的嘶吼

  倒是...男主角虧你在這種情況可以冷靜成這樣啊(原作就是了)

  很有趣的展現出了日本人如果對待殭屍末日時大概會變得怎樣w


  原作記得最清楚的鐵子殭屍化→襲擊英雄

  整個過程的分鏡就非常直接的把漫畫搬到大螢幕

  但是驚悚度、戰慄度100分，節奏醞釀的也非常棒(用大螢幕音響看超震撼)


  但這個英雄比漫畫的還要孬

  到了商場最後搶食物大戰才真的第一次開槍

  而那把槍的第一次還是被一個痞子搶走的w

  不過英雄拿起槍瞄準，到打下的第一槍的段落安排得非常得宜

  讓這樣的廢柴大叔瞬間帥了不知道幾倍

  (剛剛在電影院看也快忍不住拍手叫好)


  就是比某個隨便拿小刀都可以刷死10來隻殭屍的大嬸好(X

  ====================================分界線====================================

  整體來說，雖然這部電影也是有些毛病

  像是前幾秒搶男主角槍的痞子突然幫變成男主角好麻吉一起刷怪

  (flag插得又深又穩)


  比呂美的變化演得有些趕戲

  如果沒看過原作的確會有一種What~~?的感覺

  不過看有村賣萌可能很多人就夠了


  又或是男主角在停車場有點無雙化

  (不過我沒記錯原作也有這段)

  但在最後Boss的段落還是又讓人感受到一次緊張感

  然後男主角又開一次大招了XD


  這部電影應該是小弟看過最好看的殭屍末日作

  化妝的也還蠻有恐怖感的...扭曲的面容、殭屍化後誇張的執著...

  不會讓人感覺廉價或是有假假的感覺(所以也噁心)


  不過因為篇幅受限，

  所以這部兩個小時左右的片子就斷在看起來還要有續集的地方了

  如果台灣會上映，對殭屍題材也有喜歡的朋友

  我覺得一定可以得到100分鐘的享受


  .


  ..


  ...


  最後一定要強調

  這比某部給殭屍看的恐怖片有趣太~多~了~~


  結局斷的地方雖然也是擺明了我就是要拍續集

  但是讓人意猶未盡，而不是 蛤~~~~?? 的感覺


  --'
