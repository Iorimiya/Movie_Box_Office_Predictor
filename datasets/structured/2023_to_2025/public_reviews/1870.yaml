url: https://www.ptt.cc/bbs/movie/M.1431520480.A.8A0.html
title: '[新聞] Ella敷臉變身 粉絲讚SHERO'
content: '（中央社記者王靖怡台北13日電）藝人Ella今天在臉書分享敷蝙蝠俠黑眼膜照片，粉絲讚

  帥直呼是「SHERO」；Ella也在電影「缺角一族」演檳榔西施大玩變裝，超人等造型吸睛

  。


  女子團體「S.H.E」成員Ella（陳嘉樺）凌晨在社群網站臉書（facebook）上傳敷蝙蝠俠

  黑眼膜照片，笑稱白天忙著當巨星，晚上還要拯救世界上的鬆垮眼們，Ella表情認真、耍

  酷，搭配蝙蝠俠黑眼膜，非常逗趣。


  粉絲紛紛留言稱讚Ella好帥、蝙蝠女，直呼是名副其實的「SHERO（S.H.E專輯名，意指女

  英雄）」，還有粉絲要Ella快去拯救他。


  Ella也在電影「缺角一族」大玩變裝，飾演檳榔西施，和導演江豐宏討論檳榔西施造型時

  ，Ella提出變裝概念，跳脫一般檳榔西施造型，電影角色莎莎一出場就是亮點。


  片中共換7套服裝，包括超人、美國隊長、海盜、日本藝妓等造型，Ella表示，最喜歡美

  國隊長造型，笑稱提出變裝概念就是想做很特別、性感的「女英雄」，當台灣的「婦仇者

  聯盟」專抓負心漢。


  新聞網址：


  --'
