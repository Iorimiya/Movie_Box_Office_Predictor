url: https://www.ptt.cc/bbs/movie/M.1272157100.A.C8D.html
title: '[無雷] 從Kick Ass論Superhero類型電影'
content: '雖然說是無雷但是會提到不洩漏重大劇情的片段，在意的人請小心


  對我而言這部跟阿凡達一樣是期望過高的片子

  不是不好看，就是評望過高了


  板上和imdb評價都很高

  但看完覺得還好，就是一部什麼都好就是沒什麼深刻感覺的片

  之前板上有人不讓別人說它是爽片，但我依然是這麼覺得

  動感十足、剪接利落、運鏡流暢、配樂漂亮、血漿四溢，不是爽片不然是什麼？

  沒有留下讓人喘息和思考的空間

  而且前面丟了很多伏筆，後面卻沒用到，可以被視為建立述事節奏和刻劃人物性格的片段

  也是爽片會有的風格


  但是爽片不等於爛片

  只能說是美國Superhero的類型電影也進入到了第四時期了


  根據"認識電影"這本書把類型電分四個階段


  Ⅰ、原始時期：這個階段通常很天真，雖然因為形式很新，但情感強烈。許多類型的規範

  都在此時期建立。


  大概是從Superman、Burton的Batman到Blade、X-men拖了很長一段的期間。


  Ⅱ、古典時期：這個中間階段有平衡、豐富和穩定的古典概念，其價值已廣受觀眾認可。


  諸如X-men的續集和Spiderman、Ironman我也認為是這階段的片。


  Ⅲ、修正時期：這時類型較象徵化、曖昧化、對原先的價值觀較不確定。這個階段的風格

  複雜，訴諸理性多過情緒，類型原先設定的傳統則常被質疑，流行的信仰亦被破壞。


  Spiderman續集、Watchmen和Nolan的Batman系列開始反思Superhero自身存在的問題


  Ⅳ、仿諷時期：類型至此已對傳統規範大加嘲諷，喜歡用喜劇方式將之貶抑為陳腔濫調


  從比較不入學院之流的"Superhero Movies"到Kick Ass算是吹起了第四時期的號角


  可以預見未來會接二連三的出現有喜劇類型的Superhero電影

  但第四時期的出現並不是一個終結

  就像西部片這個最明顯的類型電影在四個階段都走完之後，也會有回歸古典時期的新片像

  是No country for old man這類的好片出現

  經歷第三、四時期反而是讓類型電影更成熟的一個方式

  讓所有人反思該類型的特點


  所以我相信Nolan的Batman第三集不會讓我失望

  我相信即使在Nolan有一天離開了Superhero電影之後某個導演仍會接下這個類型的棒子

  拍出好看的電影

  而在我個人的見解裡，反類型因為立足點的關係，終究是難成氣候

  因為反類型終究是在類型的框架之下跳脫不出來

  它可以很好看，但要看懂需要累積一定的電影數


  簡單來說，反類型電影要是空降出現的話，好看的程度會大減一半

  假如世界上所有Superhero的電影都被燒掉只剩一部Kick Ass

  十年後出生的人回頭看這種類型的片的時候一定沒有那麼精彩

  所以類型電影終究還是要回歸古典時期的


  回歸電影本身

  有幾段的畫面對到配樂真的很漂亮

  Hit Girl的打戲和最後一場戰鬥這兩段應該是是配樂最獨出的時候

  然後一開始的劇情真的有打動到我

  讓我有"這是一部在講真實Superhero的電影"的錯覺，可惜後來急轉直下，我就抽離了…

  可惜幾個構圖形狀式的蒙太奇只淪為轉場

  穀片盒和墓碑、子彈和保齡球都沒有這類蒙太奇應有的畫龍點睛的效果

  反英雄的心境也沒有深入探討

  就在開始同情主角眼淚快要掉下來的那一刻，我又抽離了…


  不過有一點倒是做的很好，Superhero板上有說原著漫畫之中Big Daddy不像電影裡的那樣

  電影把這個點藏了起來，只漏出一條細線給我們追尋

  當馬克斯找到Big Daddy的住所，看到那本漫畫的時候，他說了一句關鍵性的對白

  這對父女的身世用動畫的方式來呈現也有兩層意涵，第一層當然是向原著漫畫致敬，畢竟

  是部漫畫改編的電影，第二層就是在暗示這段身世的性質了

  在電影取向和有限的時間之內，說了但不說明白反而比說明白來的聰明

  兩群觀眾可以各取所需


  題外話

  京站威秀五廳第二排有點太近了…整個銀幕梯形化了起來…

  為了要縱觀全場，對白都只能用聽的，偶爾偷瞄幾眼

  然後在大銀幕上看起來置入性行銷也太嚴重了吧…


  總之，適合給想看爽片或Superhero片的人

  但不要對電影的走向和類型有先入為主的期望


  --

  ◆ From: 59.121.2.184'
