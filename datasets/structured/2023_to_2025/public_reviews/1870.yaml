url: https://www.ptt.cc/bbs/movie/M.1441980407.A.49E.html
title: '[好雷] 無雷 HERO電影版2'
content: '痞客邦圖文網誌:





  --



  本篇文章將不會提到此電影的任何劇情內容


  文中提到的角色設定和人物關係都是只要看過日劇的人都已經知道的


  所以請放心服用




  首先在文章開始前 先簡單做個小回顧


  HERO到現在為止總共出了兩部日劇 兩部電影 一部特別篇


  時間序如下:


  2001年播出HERO第一季 平均收視率超過30% 創下當時的收視神話


  2006年播出特別篇 為主角久利生到某海濱小鎮調查案件 (其他共演: 提真一 凌賴遙)


  2007年電影版上映 主角回歸 票房為當年度日本影壇第三名


  2014年播出HERO第二季


  2015年電影版第二集上映




  我自己全部都有看過，前面日劇、特別篇跟電影都非常好看，第一季日劇更是被視為經典


  但是第二季的日劇我雖然也有看完，卻覺得少了一些以前那種引人入勝的感覺


  不過電影上映後看到的評價普遍都是正面的，因此對這次的電影還是充滿期待




  而昨天去西門町的電影院看了HERO電影版2，只能說完全超乎預期的好看


  如果大家想要去大螢幕看，最好不要拖太久


  因為日本電影在台灣的票房通常都差強人意，撐不了多久


  我原本打算在離家裡比較近的公館看，結果這禮拜有事，等有空的時候發現已經下檔了




  在電影方面，大家最期待的雨宮(松隆子 飾)回來了


  而且這次是以檢察官的身份回歸，和久利生(木村拓哉 飾)聯手辦案


  也因為這樣，所以劇情會有很多勾起觀眾回憶的地方，日劇迷看起來會非常有感覺


  但是麻木(北川景子 飾)的角色我覺得處理的還算不錯，並沒有讓人覺得她被路人化


  在劇中的角色定位也不會讓人覺得是為了安排角色而硬插進去的




  劇中也出現非常多讓影迷會看得很開心的橋段


  以及很多充滿日劇，或是說充滿HERO風格的拍攝手法


  有不少地方是會讓人在電影院忍不住笑出聲音的


  尤其是建立在角色個性或是之前日劇劇情上的笑點


  會讓觀眾有既熟悉又好笑的感覺，在大螢幕上看到有種特別的感動




  調查辦案的過程雖不復雜，但也還算精彩


  也有出現整個城西支部團隊合作的片段


  劇情的轉折和情感關係的描寫，雖然稍微有些直接


  但也算是維持了日劇一貫的作風，我想日劇迷都不會感到太陌生




  而一如每一部HERO的作品，久利生在面對公平正義時所展現近乎固執的堅持背後


  代表的是我們每個人對公平、正義的渴望


  久利生對案件的調查不會因為對方是國會議員、黑道集團甚至是外交使節而有所動搖


  甚至連遇到了工作前途和人身安危的威脅都無動於衷


  這種明明應該是現實生活中每個法官、檢察官、律師都要做到的事


  出現在電影劇情裡卻顯得那麼令人動容


  或許某種程度上也是滿悲哀的一件事情




  最後再次推薦給所有日劇的影迷


  只要有看過第一季或是第二季的日劇而且覺得不討厭的人


  進場都應該會看得非常開心


  至於以前沒看過任何日劇的觀眾該不該進電影院看這部電影呢?


  其實我也沒有太大的把握，但是我覺得這次HERO的電影


  無論在劇情、畫面、演技等各方面都有一定的水準


  或許有人進場看了之後會想回頭把日劇給追完也說不定呢...




  最後附上預告片，想在大螢幕上看到木村拓哉的朋友們手腳要快呀





  --'
