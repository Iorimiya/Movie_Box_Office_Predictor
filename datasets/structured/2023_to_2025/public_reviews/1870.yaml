url: https://www.ptt.cc/bbs/movie/M.1571313703.A.5B5.html
title: '[討論] a hero borns from Gotham'
content: '整部完全就是看瓦昆完美飾演精神病患/小丑


  開始沒多久就在街頭被痛打搶劫，只能躺在地上哀號


  被霍老闆叫進去聽到最真實殘酷的批評之後

  這裡最厲害的部分是

  亞瑟至始至終臉上掛著笑容都不變，但卻透過眼神還有其他臉部肌肉等等細節讓氛圍不知

  不覺轉為憤怒，到最後甚至還比鬼片還恐怖的表情

  這種演技放眼全世界有多少演員可以淋漓盡致發揮到這種程度

  威尼斯得獎級的實力在播放沒多久就這樣大方的矗立在觀影者眼前


  在小巷裡瘋狂地踹踢垃圾堆，甚至踢到腳發痛

  這裡開始看到亞瑟有了瘋狂宣洩的情緒。

  這個簡單的重複踢擊動作讓我第一次感覺到了小丑瘋癲的神韻~還有內心那扭曲永不止盡

  的憤怒



  地鐵中被壓制在地上時，我是有猜到會把槍拿出來

  不過拍攝手法光明與黑暗的不斷切換~突然猛一瞬間血花四濺，還是有意外的驚喜效果

  因為在我看過的電影中並沒有這麼寫實又恰到好處的血腥處理


  很快的解決了第二個之後

  剩下的漏網之魚在慌亂之中只打到腳，而地鐵也準備到站開門

  此時，瓦昆並沒有順從心中燃起的憤怒做出像是腦衝去找對方或是對著可能的出口亂開槍

  這類的行為

  相反的，他變得異常冷靜。選擇躲藏等待最佳的開槍時機

  到此，導演透露出原來亞瑟有著自己從沒發現過的天生犯罪基因


  在確定殺死對方後持續鞭屍~這邊開始展現小丑的血性



  對了

  在突然發現自己殺人然後慌亂怪誕的奔跑姿勢

  詮釋很到位，有仔細看的話會發現跟片頭前面愚蠢滑稽的奔跑感覺很不一樣

  如果說前面踢擊垃圾堆只有稍微展現一部分的神韻

  那這段奔跑就是把小丑的味道毫不保留飽滿的散發出來



  忐忑不安的亞瑟在看完病歷後

  心中最堅信的唯一一塊人性也以最暴力的方式徹底爆裂

  原來自己悲慘的身世完全是曾經最深愛的母親一手造成的

  在最悲傷最絕望之後，卻是瘋狂的喜悅

  因為他窮其一生都不斷找尋著笑梗，在此刻突然頓悟原來自身的存在就是最大的喜劇了~

  大家千呼萬喚的小丑就此正式登場


  隨後決定親手悶死養母當作謝禮。第一次在地鐵殺了三個人的亞瑟是萬分驚慌的，然而現

  在親手殺掉自己曾經最至親的家人

  ，過程卻是如此堅決且平靜


  本片最高潮的橋段莫過於宰殺自己送上門來的藍道

  在對話還在持續的過程中還沒有任何爭吵引爆情緒的跡象

  就衝過去往喉嚨痛快的一刀

  多下戳刺之後不忘往眼珠狠狠插下去

  在觀眾都以為就此罷手時

  又領著他的頭用力地往牆上狂砸猛撞~~


  其實從剪刀刺進喉嚨的那一幕

  坐我附近的幾位女生無一不發出驚呼畏懼的哀鳴聲

  但如果跟我一樣對這腳色或這部電影有期待的

  相信絕對也是沉浸在這短暫而美妙的殺人交響曲，而不是單純報復的痛快

  至少我是以愉悅滿足的心情享受著這段獵殺


  因為我從觀影前就好奇如何演示這種暴力還有展現永不停歇的憤怒

  小丑殺人跟一般失去理智殺人的普通人的差別到底在哪???

  導演以及瓦昆透過這一段給了我超乎期待之外的完美答案

  殺人前的眼神、如猛獸的蓄勢待發、令人畏懼萬分的殘暴神情全部都完美到位

  歷代在特寫小丑殺人那種非常人的肢體動作透過這段又呈現到了新的高度;白話一點講就

  是殺人的時候小丑會讓我感覺他完完全全就是一頭野生動物

  Good job PHOENIX!


  至於侏儒

  如果是熱愛犯罪的變態殺人犯

  鐵定是把你玩弄獵物一番~在冷不防地把你也幹掉

  或者站在控制到最低風險的立場,多殺一個人封口絕對是必要的選擇

  但亞瑟一直的記得侏儒是對他最好的同事，所以保證決不對他下手


  侏儒想跑~可是他媽的門鎖太高了QAQ


  一點也沒錯，小丑系列電影就是一定要有這種詼諧厚重甚至略為惡劣的黑色幽默才夠味

  (從各大論壇的討論也確定導演成功的激起了各方的辯論)



  我認為這裡一定讓更多人對小丑產生了許多的認同感

  就算開始瘋狂殺人還是有極度理智跟自我原則

  他被同事惡意欺騙，甚至他前面的人生都是一場被摯愛母親欺騙的幻影

  所以他絕不欺騙人~說放你走就是放你走




  這部影片還有太多太多經典的眼神表情變化我沒有提出來




  黑暗騎士的小丑似乎是以瘋狂熱愛混亂為風格(這部我沒看，只看過影評跟打扮造型)

  那威尼斯影展等級的這部小丑則是以最純粹原汁原味的血腥為主打






  我認為這部電影最特別的點在於"啟發性"


  這世上眾多生下來就遭受各種不公不義或承受許多霸凌的人們

  都曾嘗試以和善寬容的態度面對這世界

  然而一切善良天真最終都只帶來無止盡的傷害

  看完小丑後或許會把亞瑟投射到自己的人生經歷

  開始思考，如果像亞瑟繼續相信著光明與希望只是讓你在接受現實時顯得更不堪、受到更

  慘烈的衝擊，那何不也開始以冷漠暴力的方式對待我生活周遭的一切?


  搭上同樣近年越來越火熱的反霸凌議題

  也許某個受盡欺凌的青年看完之後也找到了他的答案~原來一切都是有太多顧慮，一旦我

  真的被逼到"沒甚麼好失去的"的地步，就是我完全放逐自我來一場痛快的校園刺殺時候了


  曾經脆弱的靈魂因為這部藝術品而受到鼓舞~狂熱的不顧一切讓自己可憐之人轉變成可恨

  之人


  亦或者止是這社會的中間分子甚至是勝利組，也會啟發你在更多事情、議題抱持更非黑即

  白的態度~或者僅僅是看破了某些俗事


  這些不同背景不同人生經歷的人們都可能會是現實中潛在的小丑信徒






  這絕對是一部煽動性空前絕後的傑作






  a hero borns from Gotham

  高潭市，這邪惡又冷漠的罪惡之都，若要有渾然天成的英雄~那必然是小丑這般的傳奇人

  物




  將相本無種、高潭市的英雄曾經也無助的在小巷被人痛打，只能孤獨的哀嚎忍痛







  願所有小丑信徒終有一天能破繭而出


  活出屬於自己的joker


  --'
