title: '[好雷] Big Hero 6 '
content: '無關內容，單純推薦


  今天恰巧有機會看到口碑場


  之前看預告就期待很久了




  對我來說是這幾年最好的動畫了。


  不管是腳色美術設定還是場景世界觀


  每個都打到我的點



  尤其是Baymax的可愛笑點


  我看的全場笑得超開心



  另一個讓我喜歡的是反派的設計


  不是無腦邪惡的壞蛋


  反而很帥氣的腳色，動作氣勢都是帥氣滿點



  有家人帶家人，有伴攜伴，一個人也是可以


  笑得很滿足的看完整部片


  另外片尾還有一小段喔




  --'
