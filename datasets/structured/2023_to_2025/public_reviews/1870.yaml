url: https://www.ptt.cc/bbs/movie/M.1318857791.A.070.html
title: '[公告] 關於 mysheros 大量檢舉之處理說明'
content: "電影板慣例，判決成立會以精華區備份檔之標題公告處理方式，\n不成立者會在檢舉文中以推文系統說明理由。\n唯此次檢舉案件量極高，故統一說明。\n\n\
  查 mysheros 大量檢舉「跳針」用語一事，\n按「跳針」多半用於形容他人論點或話語重覆，無涉人格，\n一般而言並不構成人身攻擊情事。\n\n至若是否為引戰、挑釁，查跳針一語有負面之意涵，\n\
  但其攻擊之意味並非極端強烈，除非有前後文配合，\n否則通常單獨出現不致於違規。\n置底文中大量檢舉，皆難見有其他意圖引戰之相關證據，因此不予處理。\n但建議板友為維護討論和諧，儘可能以更和緩之用語指出其論點之重覆，\n\
  避免以此類詞語造成討論失焦。\n\nmysheros 之大量單挑此一關鍵字進行檢舉，\n可能與精華區 Z - 4 - 2 - 648 遭 liDong 板主判決違反板規\
  \ 3 有關，\n故要求板務需統一尺度，進行處理。\n唯該文判決之理由，於 Buzz_Service 板  文中已敘明：\n「板主群在接受到檢舉時，並不會因檢舉就直接判定違規，\n\
  \  會先查閱事情始末，經查閱該使用者與其他使用者推文互動，\n  依據上下文意判斷他鼓勵人噓文在先，對噓文表示敵意在後...\n\n  又\"一群跳針王\"\n\
  \  跳針實屬貶義，加上冠上群體，等於是對所有噓文者有所貶，所以判定為引戰。」\n\n故知該項判決主要原因是「鼓勵人噓文在先，對噓文表示敵意在後」，\n「跳針實屬貶義」及「對所有噓文者有所貶」係說明「對噓文表示敵意在後」乙節，\n\
  而非單就此點就逕行判決。\n請 mysheros 切勿逕自斷章取義，並據以發動大規模檢舉，浪費板務處理資源。\n\n\n\n另關於「  okayyyyyy 罵人低能\
  \ 違反板規三」之檢舉，\n查該推文可明確判斷所指目標，即便成立亦應屬板規三中「人身攻擊」項目，\n該項目明文限定僅當事人可提出檢舉 (即告訴乃論) ，\n因此不予受理，亦不判斷是否違規。\n\
  \n--\n◆ From: 61.64.65.129"
