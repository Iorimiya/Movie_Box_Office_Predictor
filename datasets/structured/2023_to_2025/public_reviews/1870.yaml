  《大英雄天團》（英語：Big Hero 6），是一部美國的3D電腦動畫超級英雄喜劇電影，由

  華特迪士尼動畫工作室製作、華特迪士尼影業發行。以漫威漫畫的同名超級英雄漫畫為藍

  本[3]，由唐·霍爾與克里斯‧威廉斯執導，是迪士尼經典動畫長片系列第54部作品。《

  大英雄天團》是第一部以漫威漫畫角色為主的動畫電影，其母公司漫威娛樂於2009年由華

  特迪士尼公司收購[4]。


  電影於2014年10月23日在東京國際影展首映，2014年10月31日在阿布達比影展以3D上映。

  2014年11月7日於全美上映。


  維基百科


  《大英雄天團》改編自漫威於1998年出版的同名漫畫。故事發生在一個虛構的未來混合大

  都市「舊京山市」（或「舊京山」[5]，San Fansokyo，是舊金山與東京都的混成詞[6]）

  ，14歲機器人學神童濱田廣（Hiro Hamada）的最新發明，竟令他捲入一個足以摧毀舊京

  山市的巨大陰謀！孤立無援，阿廣只能藉助一班另類勢力，由書獃子實驗室裡的包括芥末

  （Wasabi）、化學天才檸蜜（Honey Lemon）、單車信差速美子Go Go（Go Go Tomago）、

  宅男漫畫迷費德（Fred），以及醫護機器人杯麵（Baymax），為他們配上高科技超級裝備

  ，組成非一般的「大英雄天團」，盡出奇謀怪招，最後能否力保他們最愛的城市免於滅亡

