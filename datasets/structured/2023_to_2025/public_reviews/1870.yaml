url: https://www.ptt.cc/bbs/movie/M.1437642327.A.A66.html
title: '[新聞] 木村合松隆子《HERO2》日本兩天票房破7億'
content: '新聞網址：



  睽違八年，由木村拓哉、北川景子和松隆子主演的《HERO電影版2》18日在日本上映，果

  然木村神話再現，上映2日首周票房7億3000萬日圓，不但奪下當周票房冠軍，更刷新今年

  真人演出電影票房紀錄，兩天就有近55萬個觀影人次！不僅力壓第二名細田守的動畫新作

  《怪物的孩子》、最新神奇寶貝動畫劇場版外，更勝過日本人最愛的皮克斯動畫《腦筋急

  轉彎》，HERO一出手果然魅力無法檔，再次證明天王木村拓哉的人氣依舊超旺，前陣子剛

  來台灣掀起一波熱潮，而《HERO電影版2》也將延伸這股「木村熱」，將於9月4日全台盛

  大上映。




  史上收視率最高的經典日劇，繼2007年的電影版後，這次原班人馬再次齊聚《HERO電影版

  2》，這次續集不僅集合第2季日劇本卡司，木村拓哉飾演的檢察官久利生公平與北川景子

  飾演的事務官麻木千佳繼續搭檔辦案，而觀眾引領期盼的第一季女主角松隆子，也在歷經

  8年後再次回歸，讓所有HERO粉絲們全部超興奮。對於松隆子久違的參演，木村也表示：

  「儘管時間隔的有點遠，但她立刻就和大家打成一片。演技方面還是保有能壓制久利生的

  雨宮舞子的眼神，讓我確信這就是雨宮舞子的眼睛。」除了銀幕情人搭檔松隆子的加入外

  ，新片木村還將與飾演對手的演技派男星佐藤浩市鬥智，這次將挑戰日本司法的最大難關

  —大使館的「外交特權」！



  ===========

  上週木村來台又勾起我的回憶

  才把HERO又複習一遍了

  有人也在期待上映的嗎?


  --'
