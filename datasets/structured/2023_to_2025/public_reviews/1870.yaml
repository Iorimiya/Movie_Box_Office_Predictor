title: '[好雷] HERO電影版2'
content: '打從聽到雨宮回來時就一直期待到現在


  終於台灣上映了~


  光從一開始看到雨宮和久利生的久違鬥嘴就已經讓我心情好激動


  接著故事正式開始,熟悉的片頭樂一出,雞皮疙瘩都出來了


  其實覺得這次富士出電影版第二部還蠻有誠意


  故事中很多部分都可以看到那些充滿回憶的梗.


  電視購物和ARUYO老闆當然不可少,第一季出現的警部也出來幫忙追查案件


  連大家千呼萬喚的春菜也露了一下臉(雖然只有照片XDD)


  當然最重要的還是久利生和雨宮的感情去向~


  聽到雨宮後面那重點的一句,真的是覺得8年的等待都值得了阿


  雖然也不算是正式的答案,但對迷妹而言這樣就很滿足了


  記得HERO電影2在大阪的觀眾見面場上,現場有觀眾表達說很希望看到最後


  久利生和雨宮的感情歸屬.


  木村說若可以的話,希望很快能回應觀眾的要求~


  感覺有伏筆阿(也或許只是迷妹我的自我幻想)


  無論如何~真的希望HERO能再有續集


  這次的電影版,是少見的續集電影中,不會破壞影迷們的回憶甚至比前作還好看的一部


  (個人覺得比電影版1精彩)


  希望各位HERO迷不要錯過阿,去大螢幕欣賞一次,


  跟現場的觀眾們一起找回以往的回憶吧,看到熟悉的梗時全場一起大笑的感覺


  實在太過癮了


  最後要提醒的是~請一定要把片尾曲看完,不要聽到片尾曲響起開始跑工作人


  員名單時就急著離開喔""


  PS:好想趕快再去看三刷阿~~~~~~





  --'
