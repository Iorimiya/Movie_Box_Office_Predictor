title: 'Re: [好雷] HERO 2 電影版'
content: "其實我覺得從電影一開始帶出雨宮的戲份時\n每一幕都在搞笑，真的是字面上的每一幕。\n\n1.審犯人──命理老師的無敵預言，動搖。\n\n2.難波支部部長室──聽到城西分部表情不自然，公佈檢察官名稱時的反應\n\
  \n3.到東京後走到城西分部──走過頭，被事務官提醒才又走回來。\n\n4.搭電梯到指定樓層──在電梯裡面不想出來。\n\n5.進入大廳後，舊同事們紛紛出現，立馬一秒背對。\n\
  \  但老同事也不是省油的燈……八卦王遠藤擺出奇怪的姿勢從背後慢慢接近\n  然後一秒閃到雨宮面前跟她打招呼。\n\n最後久利生從房間出來，嚇到趕快扔掉手上的健身器材。\n\
  \n雖然在案件處理上很沉穩老練，但突然間看到雨宮就突然一點都不淡定了！（爆笑\n久利生你也有這樣的一天哈哈哈！UCCU!!!（被歐\n\n\n沒有錯，其實我覺得久利生在Hero\
  \ 2也有很大的改變\n說實話，Hero 2劇本並沒有比第一部差，純粹是因為第一部的新鮮度較高\n因此第二部在沒辦法召回原班人馬時，有沒辦法突破的設定和劇本限制\n\
  能夠作到那樣，我已經算滿足了。\n\n這邊的雨宮衝進辦公室跟久利生講話的時候\n其實久利生一直都淡淡的沒有說什麼（嗚嗚二部之後的久利生變得善解人意了）\n不過也看出雨宮不愧是跟在他身邊最久也讓他印象最深刻的搭檔\n\
  \n\n\n他們在大使館被關起來的時候，只能說久利生就是久利生（笑\n幾番輪迴試探後，馬上猜出雨宮說有經過上司同意這件事情根本是呼嚨\n\n我很喜歡看久利生那種一語道破雨宮逞強的偽裝，\n\
  後者還硬要裝若無其事的樣子\n不管看幾次都覺得好可愛XDDDD\n\n\n電影版第一部拍得比較像這一對總算變成情侶的感覺\n但我個人更喜歡第二部詮釋這一對的手法，雖然比較曖昧。\n\
  即使現階段沒有在一起，但兩人的牽絆並沒有因此斷絕\n雨宮選擇和久利生一樣的道路，或許有一天可以真正的並肩走在一起\n\n我相信全城西部的人都在關注這對看他們有沒有機會修成正果。（笑\n\
  \n其實Hero每個角色都很有自己的風格\n城西分部的每一個都很可愛，而且其辦公室文化就是：八卦和偷聽。\n\n每次稍微有重要一點的對話，全辦公室的人就跑去門板那邊束耳朵\n\
  真是太可愛了啊哈哈哈哈哈哈哈哈哈\n\n這次被門板砸的兩人：遠藤＆末次\n（真是最悲情的兩個事務官啊……大叔們辛苦啦！）\n\n--"
