url: https://www.ptt.cc/bbs/movie/M.1438829849.A.BD4.html
title: '[新聞] 「HERO」再聚首 木村要松隆子認真演'
content: '「HERO」再聚首 木村要松隆子認真演


  2015-08-05 18:26:28 聯合報 記者陳昭妤／綜合報導


  暌違8年，松隆子終於再度入主「HERO 2」電影版，與木村拓哉合體，事務官雨宮舞子和

  檢察官久利生公平的經典組合，讓電影在日本上映兩天就創下7億3000萬日圓的好成績。

  但多年後回歸「HERO」行列，松隆子坦言有些近鄉情怯，所幸木村拓哉總會在她斷線時開

  玩笑提醒：「小姐，你有沒有認真演戲啊？」讓松隆子笑說：「這種時候，就會喚起我內

  心的雨宮，像某種有趣的默契。」


  對於老搭檔重新回鍋，木村拓哉也入戲地說：「看到松隆子換上雨宮的裝扮走進場景，真

  的有種時光飛逝的感覺，那種曾經很親近的人，卻散發出一種很陌生的氣息。這種複雜的

  感覺應該就是久利生真正的心情吧。不過隨著開始搭檔辦案，以往的感覺又找回來了。」

  木村說，他和松隆子總能自然地用彼此熟悉的語氣鬥嘴，並產生出劇本上沒有的臨場反應

  ，這樣的火花常讓他感到激動。


  對於雨宮舞子一角，在新版電影中該有的表現，松隆子坦言自己一開始也不太知道該怎麼

  拿捏。「隔了這麼久，她在個性上一定會有所改變，那當然也會有沒變的地方，這兩者之

  間的拿捏常讓我不安。」不過她笑說，正式開拍後整個劇組就以木村為首，氣氛非常和樂

  ，一踏入電影中城西分部的場景，立刻像回歸到了8年前的時光，讓她安心不少。


  除了讓兩大主角重新合體，導演鈴木雅之和編劇也安排了許多會激起影迷心中回憶的橋段

  與對話，預料9月4日於台灣上映後，也將吸引大批跟隨日劇多年的劇迷們入場回味。




  --'
