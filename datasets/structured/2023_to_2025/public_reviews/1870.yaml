url: https://www.ptt.cc/bbs/movie/M.1437545223.A.A3E.html
title: '[好雷] HERO電影版'
content: '有一些圖片說明的網誌版




  純文字如下


  應該也有不少大大看過連續劇HERO 2了


  最大的改變就是曾經在劇裡擔任木村拓哉(久利生公平)事務官的松隆子(雨宮舞子)


  換成了北川景子(麻木千佳)，香蕉周遭的人大多都認為Hero(1)比較好看


  我想跟久利生的搭擋有很大的關係...


  但也不是北川景子不好~只是戀愛場景也是頗重要的(汗)


  HERO當然是近期主打


  而HERO電影版最引人注目的就是...


  這次松隆子因為某"交通事件"從大阪出差到城西支部拉!!!


  所以從上圖也可以看到城西的大家(包含松隆子)一起去酒吧的場景


  下午預約好位子，準時抵達取票~那就要進入雷區嚕!!!


  小雷雷雷 小雷雷雷 小雷雷雷 小雷雷雷 小雷雷雷















  這次的電影版是牽涉到"大使館"的事件


  (原來是個交通事件，但其實背後牽涉到大使館人員與日本黑道的毒品掛勾)


  會拍成電影是因為有一個難以突破的點--治外法權


  大使館就如同在日本的"外國"一樣，檢察官也是沒辦法進去調查的


  當然木村的作風一定會想盡各種方法"混進去"


  結果被日本外務省的"歐洲局長"佐藤浩市狠狠教訓一頓


  但透過城西的所有検事、事務官的合作


  喔~還有因為警衛小杉喜歡的電視節目錄影


  而發現本案毒品交易的關鍵人! 後來也因為證據全部到齊


  讓原本非常強硬的佐藤浩市，也去跟大使談了這個案情~


  除了案件本身之外，還有2點很值得注意


  1. 松隆子要結婚!?


  上上圖的矢口繁之(児嶋一哉飾)和松隆子在劇中有交往感


  裡頭也打電話給松隆子希望能夠去見他父母談談結婚的事情


  　


  而預告當中最後講的”大事な話があるんです”(有很重要的事情要告訴你)


  其實是對矢口繁之不是對木村~這是預告詐欺嗎XD


  補:


  到了後半段北川景子問松隆子~ 妳很喜歡木村嗎


  松隆子: 超級喜歡(過去式)


  後來他沒有去看追求者的父母 被問理由


  她說因為他還不是個成熟的檢察官


  AND 她有喜歡的人...


  戲中最後她跟第一部最後的木村一樣要去石垣島


  感覺上2個人還是會持續有什麼進展的感覺XD




  2. 長的很像牛丸次席、田村檢事的老婆登場


  登場的地方只有一瞬間~這點先保密~XD


  而其角色可能也有不少大大知道了~的確就是近藤春菜


  如果有在拍續集~本人應該真的會出現吧XD


  除上述之外城西支部那些讓人噴笑的角色們依然大賣點


  也因為有這麼多精采的要素，推見大家可以去電影院捧場一下唷!


  木村也說了~有沒有續集就要看大家了XD 戲院見!


  最後看一張~連METRO都配合HERO作海報


  --

  愛家 愛台灣 愛京都 香蕉草莓的部落格


  & 近期開箱文--多拉ㄟ夢超合金



  --

  我補在文裡XD'
