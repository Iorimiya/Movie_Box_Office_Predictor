title: '[好雷] 台灣超人 Taiwan Unsung Hero'
content: '雷文防雷資訊頁


  台灣超人

  Taiwan Unsung Hero

  2024台灣電影

  記錄片


  from:



  劇情簡介:


  台灣超人，並不是擁有超能力的英雄，而是那些勇敢超越自己，面對人生困境的人。台灣

  最美的是人，曾以記錄土地之美獲國際3D大獎的曲全立導演，創辦美力台灣，用影像扎根

  與推廣，自2009年開始到2024年，3D行動電影車已經跑了30萬公里，啟發超過32萬名學童

  。


  《台灣超人》製作團隊為導演曲全立、監製王師、電影配樂大師鍾興民在2017年的《美力

  台灣》之後，再次聯手打造。透過多位超越本身困境的超人故事，希望經由影像的力量，

  鼓勵正在人生十字路口遭遇挫折的學童和家庭，為他們提供創造夢想，開創視野的機會。

  也許他們的故事與你不同，但你總能在電影中，找到某個時刻的自己。看著因病只能用手

  走路的劉大潭，求職時被兩百多間公司婉拒，突然間想起自己生活似乎也沒那麼難；見到

  王志揚妻子離世，獨自照顧兩歲大的女兒，之後父母失智、中風，卻坦然接受扛起責任，

  好像看開了過於執著的人際關係。還有好多好多超人的故事，都在這部電影中，希望你看

  完後，能為自己找到生命的出口。


  台灣超人電影版的由來，是從2023年開始，有許多人詢問曲導，希望台灣超人製作成電影

  版，上映的時候可以改變更多人，讓更多的人看見台灣超人的能量！從曲導決定接受了這

  個挑戰，也是面對的開始。台灣超人他們的遭遇各有不同，但面對困境不變的精神，是勇

  於接受挑戰。



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  感謝這片的產出及放映，再度感受台灣有這群超越自己難關的人（台灣超人），身旁協助

  的人，拍攝的人等等，有你們真好。


  這片經由長期數年的拍攝及累積，情感及幹勁，散發的正面能量及力量，令人悸動。


  片中有一人提到，用另一種角度看這些台灣超人，其實是傻瓜啊。對啊，那麼不辭辛苦去

  付出，花費自己時間，金錢及心力去為他人，不如自己好好享受生活，會更舒服更美好？

  但是他們就這樣堅持信念，奮鬥向前行，長期這樣走過來了。


  看完《台灣超人》，真心覺得這部記錄片像是一封溫暖的信，寫給每個在人生路上迷茫的

  人們。這部片讓人笑、讓人哭，也讓一些人，包括我自己，可以重新審視自己面對困難的

  態度。


  現在有些人對於一些心靈雞湯，可能太久或太常而膩掉，而有些排斥，甚至厭惡而麻木！

  懇請可以看看這片，真實存在地一些人，他們每天要自己奮鬥才能食衣住行之行動的人們

  ，看看孫翊倫小朋友臉上的微笑，多麼感人。


  接受現狀，轉念而生。

  影片以簡單而動人的方式，講述了多位“台灣超人”的故事。他們不是那種飛天遁地的超

  級英雄，而是你我身邊那些默默承受生命重擔及痛苦，卻依然擁抱磨難，奮發向上的人。

  例如：因病只能用手走路的劉大潭，在被兩百多家公司拒絕後，仍舊堅持尋找機會，終於

  找到屬於自己的舞台；或是王志揚，妻子離世後要一邊照顧幼女、一邊面對父母的病痛，

  鬼門關走了一遭的愛樹之人莊傑任的經歷，...他們的堅韌，讓人不禁反思，自己的煩惱

  ，是不是也能更坦然接受一些？


  本片出現的唐氏症的年輕人組成的陶笛樂團，團長林啟通和這群年輕人們的互動及努力，

  看到了他們肯定了自己，意志更昂揚，生命更有希望，我們也隨之微笑：對自己永不放棄

  吧，自己失去的就接受，好好珍惜自己所擁有的吧。


  導演曲全立和他的團隊，用鏡頭將這些生命故事，呈現得真實且充滿力量，每個細節都讓

  人深受觸動。尤其是看到導演的3D行動電影車跑了30萬多公里、啟發了過30多萬名學童時

  ，真心覺得這不僅是影像創作，更像是一場生命的接力賽。他們跑遍台灣，就是為了告訴

  每個人：困難不可怕，可怕的是我們忘了自己有多勇敢。


  此外，電影的配樂，由鍾興民大師操刀，每一段旋律，都適當襯托了故事的情感起伏，讓

  觀眾更能融入角色的心情，故事和音樂之相得益彰。


  這部片可以讓一些人，重新找到對生命的熱情，更是一個提醒：我們其實比想像中更強大

  。如果你最近有些低潮、迷惘，或者只是單純想看一部感人卻又能帶給你力量的作品，請

  試試去看《台灣超人》。看完後，也許你會驚訝，原來我們每個人都可以是自己的超人！


  本片的主題曲：伍冬拾冬




  --'
