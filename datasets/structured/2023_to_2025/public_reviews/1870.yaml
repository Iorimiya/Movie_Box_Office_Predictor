title: '[普雷] 超能英雄總動員 Superhero Movie'
content: "大家早安\n\n超能英雄總動員\n\nSuperhero Movie\n\n是一部諷刺超級英雄電影\n\n除了輕鬆搞笑之外\n\n也可以思考為什麼\n\
  \n超級英雄電影\n\n越來越多？\n\n超級英雄電影\n\n觀眾群到底是哪些人？\n----------------------\n以上只是防雷頁\n\n電影一開始就會演魯蛇倒楣又被霸凌橋段\n\
  \n但魯蛇又幻想要和美女在一起\n\n但幾乎任何努力嘗試都失敗，該怎麼讓自己夢想成真呢？\n\n電影給你最簡單的標準答案，那就是\n\n成為超級英雄\n\n超級英雄電影的科幻呈現方式為了取信觀眾\n\
  \n都需要建構在似是而非的偽科學基礎之上\n\n譬如此片主角 - 蜻蜓人\n\n因為被基因改造的蜻蜓咬了一口，突然有了超能力\n\n反派 - 漏斗人\n\n因為得了不治之症，只剩一天能活，而研發了讓自己長生不老的機器\n\
  \n但缺點是每 24 小時，就需要壓榨一位活人的精氣，來延續自己的生命\n\n其實就是暗諷慣老闆\n\n為了貫徹個人英雄主義，避免牽扯更多無辜的人被用來威脅英雄\n\
  \n必須戴上面具，忍受孤獨，奇奇怪怪的規定一堆\n\n這不就是邪教嗎？來複習一下邪教檢查表\n\n\n每次出現意外，警察反而說，我們不需要超級英雄，我們需要更多預算和人力\n\
  \n愚蠢的人們其實一點不關心到底社會那些弱勢需要幫助？\n\n只是喜歡看熱鬧耍猴戲，暗諷超級英雄電影就是猴戲耍得好看\n\n最後英雄救美的結局，代表魯蛇只是為了想讓異性崇拜的幻想\n\
  \n所以為什麼超級英雄電影越來越多？\n\n因為魯蛇真的越來越多了，但是魯蛇不會去檢討是不是自己夠蠢？老是做出錯誤決定\n\n觀眾群到底是哪些人？\n\n就是現實不得志的魯蛇，需要大量正能量夢想暗示，來增加自己生活的動力\n\
  \n但如果每個魯蛇真的成為超級英雄會如何呢？\n\n每個魯蛇心中的正義都不同，就可以看到類似劇情中\n\n愚蠢的主角被奸巧的反派愚弄，把達賴喇嘛當作壞人\n\n\
  不但達不到非法正義，反而會有反效果\n\n--\n 安全、無毒的食物\n 有錢結婚生養小孩\n買得起的房子\n被老闆當人看\n下班還來得及和親友吃晚餐\n租得起房子找得到工作\n\
  \n--"
