url: https://www.ptt.cc/bbs/movie/M.1460703275.A.619.html
title: 'Re: [問題] Hero片尾'
content: "片尾就是系列作中的劇照，滿滿的回憶，\n要是片尾曲是放宇多田光的Can You Keep A Secret，那就更完美了\n\n我真心覺得業者應該善用片尾這段時間才對，\n\
  不求像漫威系列這樣，放進彩蛋等當片尾，\n也不求像小小兵這樣，片尾當逗趣短片看，\n只要像HERO 2 這樣，放幾張劇照進去，我就會心甘情願的看完那串製作團隊名單了...\n\
  \nPS.為什麼松隆子的演員名單放在這麼後面才出來?(倒數第2、最後1位是佐藤浩市)，\n有什麼特殊涵義嗎? 木村放第1個無庸置疑，當時我一直在猜下1個是北村還是松隆子，\n\
  結果北村第2，松隆子倒數第2...\n\n\n--\n三位地位顯赫之人坐在一個房間，一位是國王，一位是僧侶，最後一位則是富翁。有個傭\n兵站在他們中間，此人出身寒微，亦無甚才具。每位顯赫之人都命令他殺死另外兩人。\n\
  \n                                          『請告訴我——究竟誰會死，誰會活呢？』\n\n--\n\n一開始有這麼想過，可是為啥壓軸是擺在倒數第2?\n\
  依松隆子的等級來看不是第2就是倒數第1吧? 還是說佐藤浩市更大咖?\n\n\n成龍系列的片尾也是很棒，可惜很少業者會拿ng片段來點綴片尾，\n大多都只是把片尾當成單純的製作團隊名單、要看不看隨你便這樣，很可惜"
