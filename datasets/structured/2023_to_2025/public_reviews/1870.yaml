title: '[負無雷] 大英雄天團Big Hero 6'
content: '當壞人不夠壞，失去的不夠痛，好人就沒有太多理由好起來。


  英雄片裡沒有對立，就缺乏張力，劇情的推進就沒有足夠動能。


  想賣角色，用nerdy的天才怪咖當賣點，但最後也只用各種gadgets突顯了其nerdy面而非人性面，看完後我們還是不知道主角的歡樂夥伴是怎樣的人，我們只知道他們是好人。


  這部片很好理解，算是符合人情，但除了電腦動畫的品質以外刻劃都不突出，如果世上只有好或爛電影，相比Frozen或Wreck it Ralph，Big Hero Six就是部爛片。


  商業片才有明確的好壞，這是一部非常商業的片子，每個要素都試圖討好觀眾，所以失敗時也是很有感的。



  --'
