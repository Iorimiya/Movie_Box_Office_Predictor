url: https://www.ptt.cc/bbs/movie/M.1441637098.A.854.html
title: '[好雷] Hero電影版'
content: '2014年，想了好久的東京地檢城西支部終於再度開放，新的久利生公平

  團隊雖然也滿有趣，但總覺得有少了幾人的缺憾，最有懸念的，當然就是有

  張水煮蛋臉的雨宮舞子囉，公平與舞子就跟哲平與理子一樣，本來就是要配

  在一起的嘛，還好，2015的電影版終於找回這位久利生公平的最佳搭檔啦，

  在第二部中，只能聽久利生隱約提到兩人應該是分手了，我總是不信，可惜

  這在電影版被證實了，他們已經分開八年，到底發生什麼事我好想知道啊@@


  　　而兩人的再遇見場所正是以前共事的城西支部，因為一位剛開始就被車

  撞死的女服務生恰好是某事件的關係人，為了查她的真正死因，雨宮又回到

  城西支部，在知道自己要去那裏，而且合作對象姓久利生時，她的慌張表情

  真的很逗XD，跟老同事見面時很溫馨，但與久利生面對面時的假笑真的太假

  了啦XD


  　　前後任久利生事務官的相見完全沒想像中的火花，不過也是啦，在第二

  部裏我是看不到她對久利生有什麼其他的想法，這也讓我看的比較愉快XD，

  身為後輩的千佳很崇拜從事務官變成檢察官的前輩，她們在某些方面也是有

  相似之處，難怪都可以勝任怪咖久利生的最佳助手


  　　電影版的事件與外國大使館有關，雖然因為外交規定不能進使館查案，

  但我們都知道這是阻止不了久利生的，不過新角色佐藤浩市不知道，在幾段

  對戲中的你來我往還頗有張力，不過最後當然還是被久利生和他的同事們給

  合力說服而協助辦案囉


  　　眾家同事們還是神一般的隊友，在久利生因為查案受傷後就自動分組，

  各自查找多路線索，川尻部長和牛丸次席也努力協助部下，這兩位真是我理

  想中的好主管啊XD，身兼吃貨的川尻部長不愧是獨孤美食家，三不五時就吃

  吃吃的真是幸福:D，而他也依照慣例大發飆，每次抓狂開罵跟事後清醒的龜

  縮樣真是強烈對比XD，然後我們終於看到傳說中的田村太太，也就是跟牛丸

  次席長的很像的女兒，不負眾望的就是春菜，但只有照片而已XD


  　　變成檢察官的雨宮還是保持勇往直前的個性，可能中間有所遲疑，但終

  究還是做自己覺得對的事，她的事務官也是個妙人，幫雨宮跟主管說謊時的

  痛哭超好笑，這還跟最後一段有呼應呢；而每集都有的酒吧老闆還是有出現

  ，變出更多奇妙美食，這次的口頭禪提點了辦案方向，不過看片尾的以往劇

  照，才發現老闆比以前壯好多哦～


  　　離開八年的雨宮除了事業得意，感情似乎也有著落，只是應了劇中算命

  女的直斷又遇見舊愛，面對這個同時影響她事業及感情的男人，總覺得她的

  處理方式還是那麼彆扭，好像只要過了某個時機點，原本想講的就說不出口

  ，是不是因為這樣才造成兩人的分手呢？新男友是相親認識的，原本已決定

  見男方父母準備進一步的交往，在重遇久利生後，雨宮很合我意的拒絕了這

  個會面，雖然男方很大氣的說會等她，但我相信他等不到的<(￣︶￣)>


  　　多年不見並未影響兩人的默契，該做啥就做啥非常流暢，派對那段的打

  扮好有趣，只是也真的能看出松隆子真的不復當年青春，這點在跟北川景子

  對戲時更明顯，但即使如此，我還是很喜歡她啦；也許是因為感情線的鋪陳

  明確吧，這兩女一男在相處時都沒有尷尬的感覺，只有在久利生受傷時，千

  佳短暫的露出一點點失落感，但隨即以微笑掩去


  　　劇中沒有很大的場面，其實跟看電視版沒有很大差別，用一個案子串連

  出各種事件及角色互動，對於看過電視版的人來說還滿好入戲，但沒看過的

  人可能就很辛苦，光是看一群人鬥嘴就眼花了XD，這場的觀眾人數不多，但

  應該都是日劇迷，因為大家的笑點都滿一致，只除了最後一段的偵詢戲，看

  起來應該是請諧星之類的來客串，我只認得女的，但名字忘了XD，其他完全

  不熟XD，因為太陌生，所以大家都沒啥感覺:P


  　　看完電影版後又是熟悉的惆悵感，雖然兩人仍舊單身有稍稍撫慰了我，

  但跟這部戲一樣，想知道後面的進展，應該是越來越難了，可是若真的出了

  結局又要擔心不如我意，有夠矛盾的XD，總之這兩小時看的滿過癮，也希望

  以後還能看到城西支部的成員再度出來辦案囉


  --'
