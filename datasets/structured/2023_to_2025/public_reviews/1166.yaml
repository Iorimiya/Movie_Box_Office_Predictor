title: '[普雷]《情慾的界線》M男的友誼、愛與性'
content: '在BDSM與日常間，性虐也可以很文藝


  愛要耐心等待、仔細尋找、感覺很重要。這是戴愛玲2003年《對的人》的歌詞，用來說明

  找尋真愛的人，而在現代越見開放、理性的時代裡，找尋愛之外，找到自己契合的「性」

  ，也是重要的一環。


  對於性愛是一體或分離仍然有所討論，但有時候對性的愛好，總會有那麼幾個特殊性，較

  為不同的性感受，試一次便上癮、並期待。


  《情慾的界線》是一部以BDSM中M男的世界和感受為主軸的小品文藝電影。故事敘述看似

  正經、照顧臥病母親的公務員吉田義雄，私底下是個重度被虐狂，興趣是會光顧鎮上的SM

  俱樂部，成為女王美穗的忠實客戶。但最近吉田覺得自己開始無法投入在SM情欲之中，是

  不再感興趣、還是有其他理由？他與女王美穗一步步探索，找尋原因。







  《情慾的界線》是什麼電影：


  「性啟蒙」有時候不單單是指第一次發生關係，它有時候意味著我們對性的觀點有了全新

  的認識，例如當一位異性戀男性或女性，第一次意識到喜歡之後想碰觸到對方的身體或了

  解對象。


  或當一位保守社會生活的女性發現自己也是可以追求自我的欲望表現或對於性事上有主導

  權，這些都算是性的啟蒙點之一。有時候只需要一個契機，就像網路上常說的：「開關就

  這樣被打開了。」


  故，對於性癖這件事，有時候也需要一些契機上，有時候是可大可小的一件是，小事的癖

  好包括如異男對於女性胸部大小、頭髮長度、身材豐滿或偏瘦等，有時候配件和身分也是

  勾起性慾望的一環：例如制服、眼鏡、絲襪；護士、運動員、軍警等。而在視覺之外其它

  感觸也是相當重要，如有些人喜愛聽見低沉的嗓音、有些人偏好某種氣味、或是喜歡上某

  一種觸感和痛覺。








  以BDSM受虐者的視角為出發點的《情慾的界線》，是改編由漫畫家－山本直樹在2009年繪

  製的漫畫作品《晚間的友人》，是一部情色短篇漫畫合集，這部短篇也表達出山本直樹對

  於喜愛性虐的男性與特殊工作女性之間的情感，與周遭不懂這圈子的人諸多視線，現實和

  慾望之間那無法共融的界線。電影則是將其用較為文藝的方式敘述，並加入更多男主吉田

  義雄的日常軌跡，讓整體更天真實性。


  《情慾的界線》的故事敘述是敘述在政府水務局工作木訥男子吉田義雄，在被同事半開玩

  笑的帶去性虐俱樂部後，發現自己享受著被虐本質的癖好。這成為他在乏味的生活和照顧

  年老母親兩者間抒發情緒的一環。


  但最近他越來越不能投入在SM的情慾之中，這不只為他自己帶來困擾，也讓女王美穗產生

  好奇，這對女王與奴隸打算找尋吉田義雄無法投入性虐世界的原因。











  《情慾的界線》分析與延伸：


  電影《情慾的界線》的原作漫畫家山本直樹的作品，應該算是日本一代男性的性啟蒙，他

  本身對於性慾的開端影響的漫畫一是《無敵鐵金剛》作者永井豪的《破廉恥學園》，是一

  部偏向男性的學院搞笑情色漫畫。二來是少女漫畫月刊《りぼん》，知名如《橘子醬男孩

  》吉住涉、《NANA》的失澤愛、《櫻桃小丸子》櫻桃子等有名的少女漫畫家都在這部月刊

  上連載作品。山本直樹也從同人誌中出版第一部原創的情色漫畫，並在1984年於漫畫月刊

  《ピンクハウス》以森山塔的作者名出道。


  當時山本直樹有幾個不同的藝名在不同的漫畫雜誌上，但逐漸都整合成山本直樹，同時他

  的作品因為有不少情色內容也長期被當時日本社會限制為不健全的漫畫作品，並且1991年

  日本東京都《青少年保護發展條法》對於漫畫有著諸多限制，山本直樹因為大量的情慾漫

  畫描繪被列為重點管制漫畫家，其中又以他出版的《BLUE》為核心，要大量回收。


  《BLUE》是一部短篇情慾漫畫合集，其中除了有差邊球的高中生情色部份，另外更大一部

  份的重點是裡面假想藥丸有隱射嗑藥。但山本直樹認為這本漫畫已經是名義上的18禁作品

  ，並且在創作上創作者應該保持創作作品的自由。






  雖然普遍上大眾對於情色漫畫家都抱持著另類的目光，但其實山本直樹從原生家庭到太太

  生兒育女，一家都是普通的小家庭，並鼓勵小孩閱讀漫畫和創作的作品。雖然山本直樹中

  的人物都以大膽情慾、顛覆世俗的性為主軸，但仔細閱讀就可以知道這些作品有些並非單

  純的描繪性慾。


  在《謝謝》這篇短篇情慾漫畫中，他就描繪主人翁如何從被人霸凌、家族強暴、新宗教精

  神虐待中怎麼克服與探討「家庭的根本」，在藝文圈內有著不錯的評價。


  這點在《情慾的界線》中也是如此，在BDSM這塊虐與被虐的情慾之中，很多部份的性與愛

  還未受到同俗社會的理解。但主角吉田義雄坦然展現自己的被虐心理，在某一方面是許多

  當代男女未能坦白認同自己愛於受虐中的性慾這一塊，尤其當世界男性在普遍父權陽剛社

  會中，被硬是富於為主導性別的那一方，或是現在起步女性主義對於新時代女性必須起身

  抵抗，修於承認在性事裡享受虐與佔有的性事的女性。










  《情慾的界線》值得一看嗎？


  在看《情慾的界線》時，我想到同樣是在同志圈內，世界裡有一定地位性虐日本漫畫家－

  田龜源五郎，2004所繪製的中長篇漫畫《PRIDE》，敘述自負的男大生從性事主導方，一

  步步因為交觸到教授性虐與調教的開發而成為SM中的性奴方，從排斥、懷疑到最後全然接

  受自己M奴的本質。


  雖然整體而言並沒有《情慾的界線》這樣清流，但可以說在看見電影裡吉田義雄受虐的場

  景都會讓我想到這被虐者，對於疼痛與被支配的渴望，其實事對於自己性慾表現的誠實。


  《情慾的界線》這部作品我認為是一部帶有粉紅泡泡的輕度BDSM作品 ，女王與奴隸之間

  在性慾之外有所接觸，並還能探討其中對於性虐投入的問題，這其實算是很美好與美化的

  展現。畢竟要找到虐與被虐方平衡的性虐待遊戲在現實相當困難，奴與主之間都會有一個

  適應期，並且也有個停損點，故在電影中吉田義雄的行為的確是一種對虐的本質超乎他人

  的想像，尤其連女王也無法控制他對於私虐最終的渴望。








  但實事求是我認為《情慾的界線》吉田義雄某方面在BDSM中也算是一種特例，應該說他算

  是性奴的一種妄想或特殊情勢。如把電影中吉田義雄的Ｍ奴表現當作BDSM我覺得是不太正

  確的。


  2006年由台灣出版的《鐵軍的野蠻性史》中，敘述多種性虐者的自白與癖好的敘述，其中

  一項性慾是接近死亡的性，這不是真的去死而是模仿與接觸，舉凡如窒息式性愛或電影中

  泡於海水中的放置遊戲便是一環，故可以說吉田義雄的性虐也許並非肉體上的疼痛，而是

  追群心理的死去與重生，享受其過程而達到高潮。


  故美好的性其實在於「享受它」，而能了解這種享受之道或理解想法的人其實微乎其微，

  畢竟通常人並不懂那種「痛，並快樂著。」的M男心理。虐待的本質每人感受不同，而如

  何享受那爽勁陣頭，是施虐與被虐者間彼此的默契。如同夏慕聰《軍犬》裡作為犬奴的軍

  人李軍忠為何心理一直有他的犬主BT，在女友與主人之間的愛與性的糾葛，除了性愛之間

  ，有時候還有著更多對於慾望與權力身分的轉換與心境的順從。




