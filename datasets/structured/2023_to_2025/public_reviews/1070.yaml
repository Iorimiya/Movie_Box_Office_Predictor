url: https://www.ptt.cc/bbs/movie/M.1602843138.A.87C.html
title: '[新聞] 安雅談演《芙莉歐莎》：要不同於莎莉賽隆'
content: '安雅泰勒喬伊談論接演《瘋狂麥斯：憤怒道》前傳《芙莉歐莎》




  在經過幾個月的謠傳後，安雅泰勒喬伊（Anya Taylor-Joy）於日前確定接演《瘋狂麥斯

  ：憤怒道》（Mad Max: Fury Road）前傳電影《芙莉歐莎》（暫譯，Furiosa），而安雅

  泰勒喬伊近日接受Happy Sad Confused播客節目訪問時透露，


  。



  除此之外，當然觀眾也相當好奇安雅泰勒喬伊會如何呈現芙莉歐莎一角，畢竟這個角色之

  前在金獎影后莎莉賽隆（Charlize Theron）的詮釋下已經留給觀眾非常深刻的印象，對

  此，安雅泰勒表示，「首先這是最重要的一件事，我很喜歡莎莉賽隆詮釋芙莉歐莎的方式

  ，是如此出色又美麗，

  」




  《芙莉歐莎》的其他演出卡司還有克里斯漢斯沃斯（Chris Hemsworth）、葉海亞阿巴杜

  馬汀二世（Yahya Abdul-Mateen II），並且將找回《瘋狂麥斯：憤怒道》金獎幕後團隊

  包括剪接瑪格麗特希克索（Margaret Sixel）、美術設計柯林吉勃遜（Colin Gibson）、

  音效混音班歐斯莫（Ben Osmo）、妝髮萊絲莉范德華特（Lesley Vanderwalt）等，目前

  未曝光劇情細節，也還沒有排定確切上映時間。






  --'
