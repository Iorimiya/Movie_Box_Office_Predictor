url: https://www.ptt.cc/bbs/movie/M.1559102549.A.288.html
title: '[討論] 莎莉賽隆在台灣是不是毫無票房號召力'
content: '莎莉賽隆


  從國小看到現在


  一個我對她敬意已達巔峰的女星


  女魔頭.北國性騷擾 拿獎時是很驚豔


  但那時覺得還不夠全面


  還覺得她就是扮醜+比較認真演而已


  11年Young Adult真正開始喜歡她


  完全能勝任喜劇還挑大樑 也更平易近人


  之後不用贅述


  大抵就是在喜劇跟動作間遊走  也慢慢涉入製片


  14年 百萬種硬的方式又正又搞笑完


  可以隔年MAD MAX馬上剃大光頭帥翻世界


  而且厲害在於她主演的片大多都很好看


  尤其憤怒道跟極凍之城 在近幾年動作片幾乎是可以封頂的作品



  但她當女1的片在台灣票房都不是很好


  甚至可以說慘


  極凍之城的宣傳我是覺得不夠力


  厭世媽咪日記宣傳力度跟票房就不成正比了


  上週選情尬翻天 不意外的被片商草草上映


  票房超慘


  偏偏又是莎莉主導 演技層次分明的優質作


  整個Seth Rogen跟他的喜劇團隊和莎莉融合極佳


  好笑度.劇情.演技都贏安海瑟威跟FAT AMY


  雖然片商沒好好做很明顯


  但有莎莉賽隆+喜劇 台北現在還沒破百萬


  也是蠻誇張的數字就是


  (今天要討論的是詐騙女神，

  同樣是喜劇，然後某方面也是在賣安海瑟威跟肥艾咪的星度，但片子普普。

  但一個現在台北破2千萬還不錯，

  反觀選情尬翻天比想像中好，但目前一百萬還不到，這樣的差別)


  --

  其實沒有，但輕鬆喜劇+大明星台北還沒破百，這種票房爛度就是比較我認知外的

  其實 詐騙女神 某程度就是在賣安海瑟威跟肥艾咪的名號 然後片子普普

  同樣喜劇 詐騙女神台北破2千萬  選情歐買尬目前沒有100萬  是在討論這個

  但票房不好，下次就不會有人想上映。

  看吧 名字爛到有買票進場的都忘記'
