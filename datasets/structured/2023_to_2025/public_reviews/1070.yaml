content: "全民超人喔？\n\n前半部好看，後半部糞作，\n\n尤其是最後發現莎莉賽隆其實也是超人，\n\n然後威爾史密斯是她的Ex後。\n\n而且尷尬的是，還是莎莉賽隆扔下了頻死的威爾史密斯，\n\
  \n然後一走了之，只留下好不容易死裡逃生，\n\n卻失去所有記憶的威爾史密斯，\n\n成為一個憤世忌俗，以為自己孤單一人的，\n\n自暴自棄的活著。\n\n然後莎莉塞隆扔下前男友，自己過上了美好新生活，\n\
  \n明明電視上就一堆前男友的消息，她也權充沒看見，\n\n繼續讓對方悲慘的活著。\n\n新老公把男超人帶回家後，她還故意把男超人當成陌生人看，\n\n又禁不住男超人對她的吸引力，兩人又開始準備修車。\n\
  \n\n結果新老公以為老婆出軌，是因為男超人勾引她，但其實他才是第三者，\n\n而男超人對新老公也很抱歉，對方把自己當朋友、當兄弟，\n\n結果自己卻只想上人家老婆(但其實她是你老婆)\n\
  \n\n最後紙不包火了，女超人才承認是自己扔下男超人一走了之，\n\n而她不是故意，請原諒她，她不曉得男超人會失去記憶，\n\n她離開他是為了好(下略三百字)\n\
  \n\n\n最後結局卻是女超人坐享齊人之福，\n\n跟男超人與新老公多元成家，\n\n雙方都還是好麻吉喔>_6\n\n\n\n我他●的當年看到後半段的情節，\n\
  \n差點沒理智斷線，怎麼會有這麼婊的女人？\n\n然後還一堆理由嬸，兩個男人都被她耍得團團轉，\n\n被蒙在鼓裡，完全不知道她是女超人的事，\n\n然後她開開心心的活著，完全不管身邊的人被她唬得團團轉，\n\
  \n事情爆出來了，又在那邊哭，\n\n『我這麼作一切都是為你們好啊~我不知道會這樣(哭哭)』\n\n『I'm sorry~~~』\n\n媽的，賤人就是矯情。\n\
  \n\n女超人這角色如果換成是男的，\n\n保證就是被SJW砲轟到外焦裡嫩的渣男啊，\n\n怎麼編劇會覺得這些角色性別互換，\n\n觀眾們就會接受呢？\n\n\
  整部只有女超人在爽，她的男人們(複數)反而變成苦情受害者。\n\nWTF？\n\n難怪當年票房很好，影評卻很差，而且全數集中在後半段，\n\n主角也不想拍續集，根本就當男歷史。\n\
  \n你以為威爾史密斯才是真主角嗎？\n\n錯，莎莉塞隆才是。\n\n--\n 我還沒說完吶~~      夠多了夠多了，回家吃藥了啦~!\n    　　　  \
