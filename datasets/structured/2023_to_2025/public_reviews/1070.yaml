url: https://www.ptt.cc/bbs/movie/M.1696993792.A.E54.html
title: '[新聞] 《莎莉》釜山影展舉辦世界首映，坐無虛席'
content: '普雷資訊頁









  普雷資訊頁









  普雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  網戀無國界話題十足！劉品言遇交友詐騙一無反顧追真相　


  《莎莉》釜山首映座無虛席


  作者 潘韜宇／綜合報導 -2023-10-11


  曾拿下金馬創投百萬首獎電影《莎莉》，導演練建宏經歷五年的劇本修改、拍攝到完成，

  如今終於在釜山影展舉辦世界首映。三場電影票都秒殺，現場座無虛席，練建宏表示「能

  在釜山影展世界首映非常緊張，可以放映醞釀五年的故事，也感受到現場觀眾對於電影的

  喜愛。」電影首映後，也聽到許多觀眾的回饋，其中有觀眾對他說，看完《莎莉》讓他知

  道愛的形式有很多種，感到很幸福。更有許多觀眾誇獎劉品言的演技，完美詮釋在婚姻之

  外的女性角色，可以選擇愛得自由、愛得坦蕩、更明白自己為何而愛。


  女主角劉品言其實是抱著忐忑的心情前往釜山，因為她將要跟現場觀眾一起首度觀賞《莎

  莉》。她在看的時候回想起拍攝時的點滴，因為她飾演一個鄉村養雞的農婦，與雞群有很

  多互動，當時的初體驗現在大銀幕上呈現出趣味溫馨的一段段畫面，劉品言覺得能與雞群

  們一起演戲真的太好玩了！


  原先劉品言擔心會因為語言或文化的關係，釜山影展的觀眾會不會不了解《莎莉》所要表

  達的愛情故事，在映後獲得滿堂掌聲才放下不安的心情，自己也深受感動。其中他們問了

  有趣的問題像是：台灣年輕人也會被長輩催婚嗎？也會藉由交友軟體認識對象嗎？遇到交

  友詐騙的情況多嗎？諸如此類的問題，可見《莎莉》的故事也讓韓國影迷有深刻的體驗。

  除了首映行程，劉品言也是第一次到釜山，她更做足功課要吃到好吃的釜山道地美食，海

  雲台的海景美色，她大讚釜山真的是一個好好吃的美食城市。


  導演練建宏也在此趟行程與多家國際片商會議，《莎莉》的大受好評也在國際展開知名度

  ，目前詢問度不斷，練建宏說：「《莎莉》是我第一個電影，希望把握每一次放映的機會

  ，讓世界各國都能看到。」《莎莉》的故事靈感來源自台灣很常見的網路愛情詐騙案，在

  看這些新聞事件的時候，大家總會說受害者怎麼那麼傻？練建宏說：「我時常在想，他們

  又有什麼錯呢？他們不過就是希望有人愛而已。於是我開始了《莎莉》的故事。每個人都

  渴望愛人，也渴望被愛，但不要在尋找愛的過程中迷失了，忘了最重要的是，你必須先愛

  你自己。」他解釋，《莎莉》用愛情包裝，講的卻是每一個人面對孤獨，學習自處的故事

  ，期待它是一個具有陪伴力與療癒性的電影。


  《莎莉》電影由李烈、吳明憲監製，練建宏執導，劉品言、林柏宏、李英宏主演。伯樂影

  業股份有限公司、中環國際娛樂事業股份有限公司、文化內容策進院、中華電信股份有限

  公司、艾慕影藝股份有限公司、氧氣電影有限公司、百聿數碼創意股份有限公司、華映娛

  樂股份有限公司共同出品。十宜影樂有限公司、畢業生有限公司和伯樂影業股份有限公司

  共同製作。電影劇情描述：女主角惠君是個內心渴望愛情，卻又怯於表達的純樸農婦，只

  能透過交友軟體化名「莎莉」，與法國男子談情說愛，不僅弟弟唱酸，全村的人都說她被

  騙了，她決定義無反顧飛到巴黎，展開一場屬於自己的追愛之旅。將於2024年4月全台上

  映。更多電影訊息可上官方FB：。


  --'
