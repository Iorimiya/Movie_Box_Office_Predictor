title: '[新聞] 莎莉賽隆主演，控制作者著作《暗處》'
content: '文/Jean


  美國作家吉莉安弗林（Gillian Flynn）2012年出版的小說《控制》（Gone Girl）在去年

  被導演大衛芬奇（David Fincher）改編搬上大銀幕，而大衛向來也相當擅長處理描述人

  性的題材，加上羅莎蒙派克（Rosamund Pike）精湛的演出，絕對是去年令人震驚萬分的

  精彩作品之一。


  今年，吉莉安弗林還有另一部小說《暗處》（Dark Places）也已經翻拍電影即將上映，

  並在今天釋出了首張國際版海報。此片是改編自吉莉安在2009年出版的同名著作，劇情

  描述女主角Libby Day在小時候目睹了殺害全家的兇手，雖然幸運的存活下來，但是她卻

  在法庭上作證兇手是自己的哥哥。25年之後，Libby被帶到一個專門解決犯罪案件、神秘

  的地下組織「殺手俱樂部」，希望她能夠吐露出實情。


  本片由《心鎖》（Sarah’s Key）導演吉爾巴克貝納（Gilles Paquet-Brenner）執導及

  編劇，卡司包括莎莉賽隆（Charlize Theron）、克蘿伊摩蕾茲（Chloe Moretz）、尼可

  拉斯霍特（Nicholas Hoult，X戰警未來昔日）、寇瑞史托（Corey Stoll，紙牌屋）、

  克麗絲汀娜漢卓克斯（Christina Hendricks，影集廣告狂人），3月30搶先在巴黎特映

  ，4月8日法國全面上映。


  ------------------------------------------------------------------------------


  參考外電：The Playlist

  First International Poster For ''Gone Girl'' Author Gillian Flynn''s ''Dark

  Places'' Starring Charlize Theron



  心得：這卡司跟「控制」相比強度算是並駕齊驅，但不知是否是導演知名度的緣故，

  暗處電影版被媒體與影迷注意的程度，似乎遠不及控制？


  當然這種情況也跟投資的片商有關，控制是由福斯影業出資並統一做全球行銷，

  反觀暗處到目前為止，仍然沒有確定電影在美國的發行片商



  --'
