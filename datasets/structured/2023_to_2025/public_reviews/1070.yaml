title: '[新聞] 莎莉賽隆為戲暴肥16公斤 1個月突變大嬸'
content: "奧斯卡影后莎莉賽隆（Charlize Theron）美豔絕倫，繼封后之作《女魔頭》後，再度為\n新片《塔莉》（Tully，暫譯）犧牲色相。她最近在溫哥華拍片，從頭、胸部與腰部，整\n\
  整肥了一大圈，據傳她為詮釋片中孕婦，1個月增重近16公斤。\n\n為新片增肉\n41歲的莎莉在2003年《女魔頭》中增胖14公斤，當時靠嗑甜甜圈與洋芋片等高熱量食物「\n\
  堆肥」，她曾說：「我的工作是演員，我愛這份工作的原因就是能把自己變成另一個人。\n」她在新片飾演3個孩子的媽，有人質疑她穿道具服裝製造臃腫效果，但她的臉部明顯變\n\
  肉感，敬業的她很可能真的吃胖上陣。\n\n\n\n 七月初出席電影活動\n\n--"
