title: '[好雷] 重磅腥聞-莎莉賽隆、妮可基嫚與瑪格羅比'
content: '轉載網址（圖文好讀版）：


  【影評】《重磅腥聞》：莎莉賽隆、妮可基嫚與瑪格羅比同台飆戲戳破職場潛規則


  作者：另起爐灶

  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  入圍奧斯卡最佳女演員、最佳女配角的《重磅腥聞》(Bombshell) 改編自真人真事，劇情

  描述喧騰一時的福斯新聞性騷擾案件，電影找來兩位奧斯卡影后莎莉賽隆 (Charlize

  Theron)與妮可基嫚 (Nicole Kidman)，加上以《老娘叫譚雅》(I, Tonya) 入圍奧斯卡最

  佳女主角的瑪格羅比 (Margot Robbie)，三位重量級演員同台飆戲，光這點就不得不買單

  進戲院一睹風采。


  《重磅腥聞》有著《大賣空》的風格（編劇也是同一位），嘗試將複雜的真實事件濃縮在

  兩個小時的電影裡，故事以三線並行：莎莉賽隆飾演當紅主播梅根凱利 (Megyn Kelly)，

  即使背後的老闆力挺唐納川普 (Donald Trump)，也直言不懼槓上當時的總統候選人；妮

  可基嫚飾演的格雷琴卡森 (Gretchen Carlson) 則是開了第一槍的勇敢主播，率先跳出來

  指控福斯新聞董事兼執行長羅傑艾爾斯 (Roger Ailes) 性騷擾；瑪格羅比則擔任電影中

  的虛構角色，以剛進入福斯新聞的新人，懷抱熱情力爭上游最後黯然夢碎，以小人物對比

  兩位真實角色。


  《重磅腥聞》呈現爭議人物羅傑艾爾斯正反兩面


  如果認為《重磅腥聞》只是單純描繪職場潛規則就錯了，故事從正反兩面講述羅傑艾爾斯

  這個爭議人物，他有能力，帶領福斯新聞創下高收視率、獲利大把鈔票；他夠堅強，即便

  梅根凱利對上川普招來海量批評，他也力挺到最後一刻；他有眼光，知道觀眾要看的是什

  麼，「我們報導。你決定。」(We report. You decide.) 與「公平而平衡」(Fair and

  balanced) 是他的名言。


  他是保守派，但同時也是蠻橫的暴君，會從辦公室衝過來痛罵工作人員，更會伸出魔爪，

  是一匹令福斯新聞的女性聞之喪膽的惡狼。如果只是一面倒，觀眾對受害女性的同情絕對

  會加深，但劇情忠實呈現羅傑艾爾斯的雙面性格，為何多年來福斯新聞都沒人舉報？電影

  本身問的問題是：


  「他的能力真的能夠掩飾不堪的潛規則嗎？」


  《重磅腥聞》神還原入圍奧斯卡最佳化妝與髮型設計


  觀看電影時，不得不讚嘆妝髮技術，莎莉賽隆的裝扮竟讓人有點認不出，但卻不失影后氣

  場。身為羅傑艾爾斯力捧的頭牌主播，面對同僚提出的指控時，她猶豫是否站出來聲援，

  除了羅傑的知遇之恩，她更不想要被「性騷擾受害者」這個標籤貼在身上、職業生涯一輩

  子。她的地位、名聲都是自己努力付出、爭取來的，一旦跟性騷擾扯上關係就會被大眾質

  疑她的能力。這也是為什麼多數受害者不願意、害怕站出來作證的原因。莎莉賽隆其實很

  早就做出決定，但她打算靜觀其變，給予福斯新聞致命一擊。


  妮可基嫚則是忍辱負重、保全證據的頭號控訴者。面對律師再三詢問，她始終無畏地表示

  自己準備好了，「第一個」總是需要最多的勇氣，即使後期福斯新聞沒人支持，甚至面臨

  眾多抹黑與懷疑的聲浪，她依舊不願退讓。歷史會選擇誰做出改變是很奇妙的一件事，妮

  可基嫚不僅演出受害者的心路歷程，更精采詮釋職場女性與母親的拉扯。


  每個人都有可能是受害者


  瑪格羅比飾演全家都愛看福斯新聞、從小就夢想站上主播台的新人，為了在競爭激烈的新

  聞台中向上爬，甚至接受羅傑的「邀約」交換得到主播位子。對比上面兩位已有一定地位

  的人物，她是更無力反抗體制的女性，而且她也服膺了「潛規則」得到利益，但事後卻十

  分痛苦悔恨，原本的美夢成為一場惡夢，同事卻沒有人能伸出援手。這裡電影原本有機會

  提出問題：羅傑其實只是照著人人默認的潛規則走？瑪格羅比的順從是否助長了羅傑的為

  所欲為？可惜著墨不深。


  電影最印象深刻的一幕在電梯場景，也是三條主線唯一交會的瞬間，三位主角進到電梯之

  中，尷尬的空氣瀰漫密閉空間，儘管都是羅傑性騷擾下的受害者，卻無人能認出彼此，因

  為人人都有可能是潛在的被害人，面對職場潛規則沒有誰能置身事外。


  《重磅腥聞》精采劇情讓人沒有喘息空間


  《重磅腥聞》的缺點在於資訊量太過龐大，尤其開頭讓人難以吸收，但中後段隨著越來越

  豐富的內容，讓人漸入佳境，觀看時除了訝異如此劇情竟是真實事件外，更多的情緒是對

  三位主角的欽佩以及不捨。


  電影讓人見識到現代職場女性的難處，除了美麗，還得要有實力，而職場潛規則無處不在

  ，必須勇敢堅持住自己的底線。結局福斯新聞為羅傑艾爾斯與歐萊利的性騷擾案件付出

  了 5 千萬美金的賠償金，但兩人的離職金卻高達 6 千 5 百萬美金，恐怕這才是現實比

  電影更荒謬的地方。

  -------------------------------------------------

  恭喜《重磅腥聞》獲得奧斯卡最佳化妝與髮型設計,大家覺得像亞當麥凱(為副不仁&大賣空

  )的風格嗎?總之三位女主角都很棒,為他們進場的!!

  --

  歡迎追蹤我的FB專頁



  --'
