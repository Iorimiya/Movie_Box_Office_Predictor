title: '[討論] 莎莉賽隆新動作片:極凍之城 爛番茄開獎'
content: '新鮮度:78%

  均分:6.9

  好評:14

  差評:4


  此片是John Wick其中一位導演David Leitch第一部單飛作,

  以暑期動作強檔來說這分數不差,尤其主角又是沒甚麼武打底子的莎莉賽隆

  看起來場面調度安排上應該能夠COVER莎莉底子不夠的問題

  只是同一周有敦克爾克再加上本片為R級,票房很可能未必有預期的高....


  正式預告:



  甚至雷神本人還稱讚莎莉賽隆可擔任下一任龐德(如果龐德要轉性的話)



  --


  這片配角還有X教授James McAvoy / 女木乃伊Sofia Boutella


  看得出基哥底子還是比她好

  基哥如果本來就沒有柔術底應該很難拍這種一鏡至少4~5個柔術動作的片



  不就普羅米修斯?'
