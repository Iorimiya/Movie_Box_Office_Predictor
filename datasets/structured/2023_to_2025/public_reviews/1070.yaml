url: https://www.ptt.cc/bbs/movie/M.1713534526.A.6C6.html
title: '[好雷] 莎莉Salli也許大家身邊都有個他/她'
content: '莎莉算近期老少咸宜、約會觀看的一部電影


  節奏輕鬆有趣，雖然網路交友的題材不新鮮，


  但故事背景蠻有創意的，


  在鄉下養雞的大齡女子因為網路交友開啟一段跨國追愛的旅程。



  劉品言飾演女主角林惠君(莎莉Salli)發揮得恰如其分，


  電影中許多抱雞、抓雞的動作都是信手拈來完全不生澀，


  雖然有搞笑的成分但又不會太浮誇，有些對白挺幽默的，


  但稍微刻意就很容易變成做作，她都表現得很自然，哭戲也很有渲染力，


  蠻看好她可以入圍金馬獎。



  如今越來越多人透過網路來交友，因此共結連理的也屢見不鮮，


  但同樣地網路愛情詐騙案件也是層出不窮，莎莉也成為其中之一，


  即使早已打了預防針告訴自己玩玩就好別認真，


  大家也千叮萬囑如果對方談到錢絕對不能匯款，


  理智上明白，但知易行難，誰又能控制自己的心呢?


  或許在你我身邊就有這樣的人，


  覺得自己是那個遇到真愛的人，


  自己只是相信愛情而不是被騙，


  拒絕承認自己就是被騙的傻瓜，


  無論旁人如何勸說總有人執迷不悟，


  如同女主角也是飛到巴黎眼見為憑才死心，


  到最後如夢初醒才知道自己想要的是什麼。



  電影中另一個亮點是莎莉的姪女林芯茹，


  她把青春期女孩的叛逆和複雜的情緒演得很好，


  李英宏也很適合演流裡流氣的台客，


  還有林柏宏在婚禮對姊姊那段告白真的有點好笑又感人，


  整體而言是個值得一看得輕鬆小品，看完心情不錯。



  最後想討論一下，大家覺得莎莉在法國見到的那位網友，


  跟盜照片跟莎莉聊天的馬丁是不是同一人?


  因為他們都用"Mon poussin"（我的小雞）來稱呼莎莉，


  而且女主角應該發現了網友就是那個馬丁，


  所以一夜激情過後莎莉問網友願不願意娶她，網友回說願意，


  感覺就像之前就認識一段時間才會這樣對話吧?



  --'
