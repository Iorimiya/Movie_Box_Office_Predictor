title: '[新聞] 莎莉賽隆主演動作電影《極凍之城》首支預'
content: "新聞網址：\n\n莎莉賽隆主演動作電影《極凍之城》首支預告「爆發」登場\n\n文/Jean\n\n以特技指導出身的大衛李奇（Dacid Leitch）與查德史塔哈斯基（Chad\
  \ Stahelski）兩人\n在 2014 年帶來了非常精彩、華麗的動作電影《捍衛任務》（John Wick），而今年大衛\n李奇將要「單飛」帶來個人的首部獨立執導作品《極凍之城》（Atomic\
  \ Blonde），並在\n今天釋出了首支完整預告。\n\n此片是改編自原著作者安東尼約翰斯頓（Antony Johnston）的圖像小說〈The Coldest\n\
  City〉，找來《300壯士：帝國崛起》（300: Rise of an Empire）編劇寇特約翰斯達（\nKurt Johnstad）執筆劇本，內容描述一名\
  \ MI6 秘密官員在柏林圍牆倒塌前被殺害，因而\n激起另一名女性超級間諜展開攻勢。\n\n《極凍之城》由莎莉賽隆（Charlize Theron）擔綱主演，預告一開始就讓觀眾看到將近\n\
  一分鐘的一鏡到底打鬥畫面，後段還有相當火辣的親熱鏡頭。其他演出卡司包括詹姆斯麥\n艾維（James McAvoy）、約翰古德曼（John Goodman）、托比瓊斯（Toby\
  \ Jones）、蘇菲\n亞波提拉（Sofia Boutella）等，將在本週末展開的 SXSW 電影節世界首映，預計 7 月\n 28 日台灣上映。\n\n\
  --"
