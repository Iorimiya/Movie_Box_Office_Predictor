url: https://www.ptt.cc/bbs/movie/M.1455074497.A.614.html
title: '[新聞] 莎莉賽隆有望演出《玩命關頭8》女反派'
content: '據外媒報道，去年因《瘋狂麥斯：憤怒道》中芙莉歐莎指揮官一角再次成功扛起“硬派女

  漢子”大旗的莎莉賽隆，有望出演大熱系列片《玩命關頭8》。


  據悉，環球有意讓賽隆出演該片的女反派，這將是《玩命關頭》系列的全新角色，當然這

  位女反派絕不是“吃素的”，她將對劇情發展起著關鍵性作用。環球看中塞隆，也是基於

  她在喬治米勒的《瘋狂麥斯》中的驚艷表現，雖然此次飾演反派，但這對於奧斯卡影後賽

  隆來說拿下該角色肯定不在話下。


  莎莉賽隆主演的《狩獵者：凜冬之戰》 和配音的《酷寶：魔弦傳說》都已完成制作並定

  檔，另外《灰人》、與大衛芬奇合作的美劇《破案之神》、與詹姆斯麥艾維合演的《極寒

  之城》等片都還在前期狀態，此次若是加盟《玩命關頭8》，很可能預示著接下來的三部

  曲都將參演，所以檔期問題也將是賽隆考慮的重點之一。對於影迷來說，如果賽隆能加盟

  ，必然是大家願意繼續看“玩命關頭”系列的一個強大理由。


  《玩命關頭8》將由《衝出康普頓》導演F·加裡·格雷執導， 馮迪索、巨石強森、傑森史

  坦森都已確認回歸，將於2017年4月14日在北美上映。另外，《玩命關頭9》和《玩命關頭

  10》將分別於2019年4月19日和2021年4月2日登陸，並為整個系列畫上句號。




  --'
