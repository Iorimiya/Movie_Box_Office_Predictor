url: https://www.ptt.cc/bbs/movie/M.1712305524.A.0C9.html
title: '[ 好雷] 莎莉'
content: '盡量不要雷太多


  預設會點進來的板友們可能有考慮要看吧

  應該看過簡介及或預告了？


  這部女主角是一位鄉下雞農村姑

  在交友軟體上認識外國人然後網戀


  這個背景很令人好奇吧

  到底是被騙還是真的談戀愛


  發現這片時剛好預計要回台灣

  就決定四月初要進戲院看這部


  到底有沒有被騙這邊就不寫了


  看完這部感想覺得拍得很好


  周圍人跟社會給的婚嫁壓力

  雖然現在已經沒以前那麼嚴重

  不過以她飾演的過四十的年紀以及住在封閉的鄉下來說


  那種壓力還是存在的吧

  在傳統家庭女生不結婚

  就算手足不嫌棄周圍親戚也會講話


  最感動的是親人之間的感情

  我看這片哭了兩次 兩次都是感動親情



  社會大眾有時候看新聞可能會覺得

  一個年紀也不小的女人

  四五十

  甚至五六十

  更甚至七八十

  怎麼還在做戀愛夢

  幾歲了還自以為是女孩兒？

  以為會有網路上的外國帥哥愛上你？


  可是

  人想要被愛跟年紀無關吧

  錯的不是還願意鼓起勇氣懷有夢想的人

  就算被騙了 錯的是騙子啊


  女主角願意追愛的勇氣是很值得尊敬的


  還有在過程中她的自我覺察發現自己真正想要的是什麼

  什麼不是自己要的



  另外覺得有趣的部分

  背景一家人是雞農兼市場雞肉攤商

  片中雞出現的鏡頭很頻繁

  很難得看到著墨在這部分


  蠻感人又蠻可愛的一部片




  --'
