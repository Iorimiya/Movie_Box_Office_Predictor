title: '[新聞] 布麗拉森要失業了？莎莉賽隆傳加入漫威'
content: '新聞網址：


  By Berlin





  47 歲奧斯卡影后莎莉賽隆（Charlize Theron）外型亮眼，憑藉犯罪電影《女魔頭》中詮

  釋著名連環女殺手，擒拿雙金（金球獎和金像獎），精湛演技狠甩花瓶形象，之後加入《

  玩命關頭》系列電影，飾演狡猾聰穎的電腦駭客「賽芙」。如今有消息傳出，她可能加入

  漫威電影宇宙（MCU），引發熱議。



  ｜莎莉賽隆被爆可能加入漫威 網拱出演「驚奇隊長」


  繼先前基努李維爆出有望加入 MCU 後，綜合外媒報導，一名擁有大量漫威製作情報而聞

  名的知情人士透露，漫威正和莎莉賽隆交涉未來參與漫威電影宇宙製作的可能性，至於，

  莎莉賽隆會飾演哪個角色目前尚未有相關消息。消息一出引發影迷熱議，



  網友一致推舉莎莉賽隆出演驚奇隊長。（圖取自 Pinterest）



  ｜莎莉賽隆將投入拍攝《玩命關頭》外傳電影


  在此之前，莎莉賽隆將投入拍攝《玩命關頭》外傳電影，莎莉賽隆在《玩命關頭 8》以反

  派「賽芙」首度亮相，如今製片人馮迪索要替她打造角色獨立電影，電影預計今年開始製

  作。



  --


  !!!!!!!!!


  --'
