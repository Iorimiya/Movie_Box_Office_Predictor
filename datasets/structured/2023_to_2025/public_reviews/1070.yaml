title: '[新聞] 改變人生 莎莉賽隆認"芙莉歐沙"是最棒角色'
content: "新聞網址： \n\n\n2020-07-25 11:20聯合報 記者陳建嘉／即時報導\n\n\n莎莉賽隆近期帶來Netflix新片「不死軍團」，並為該片勤加宣傳，她近期現身線上舉辦\n\
  的漫畫展，提到自己最喜愛的角色有哪些，她也不免俗再次提到「瘋狂麥斯：憤怒道」的\n芙莉歐沙，認為這個角色改變了很多人對於女英雄的想像，也改變的她的職涯，認定她更\n\
  能主導許多動作大片。\n\n\n莎莉賽隆早前就演過「倩影刺客」等多部動作片，不過像是「瘋狂麥斯：憤怒道」這樣陽\n剛、短髮且與男主角麥斯並肩作戰的英勇女主角並不多見，「我為我們所取得的成就感到\n\
  無比自豪，\n」，莎莉對芙莉歐沙情有獨鍾，然則\n\n，為此莎莉也在受訪時表示很遺憾，。\n\n\n\n\n\n--"
