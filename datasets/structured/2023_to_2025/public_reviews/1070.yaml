url: https://www.ptt.cc/bbs/movie/M.1431801866.A.05E.html
title: '[好雷] 瘋狂麥斯 莎莉賽隆值得入圍奧斯卡女配 '
content: '撇開瘋狂麥斯本身就是一部硬派迷睽違已久


  把荒漠.廢鐵.汽油融合末日金屬風格發揮淋漓盡致


  酷到骨子裡的極致公路之作


  莎莉賽隆從頭帥到內裏的演出 根本全片靈魂


  造型帥不說 整個眼神的狠勁 俐落扎實的動作線條


  雖然通常予人帥女孩形象  但和去年百萬種硬的方式比 反差還是很大


  得知故土消失 卸下武裝 跪在狂沙中吶喊那幕 真的讚


  當有女性角色能超越本來片名的主角 甚至鮮明到成為記憶點


  就是該入圍女配角的時候了


  今年目前最佳女演員表現之一


  --'
