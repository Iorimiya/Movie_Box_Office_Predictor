url: https://www.ptt.cc/bbs/movie/M.1670775204.A.354.html
title: '[新聞] 原本對漫威很無知 莎莉賽隆:會取笑漫威粉'
content: '新聞網址：


  原標題:



  Yahoo奇摩電影戲劇編輯部

  2022年12月11日



  【文／血紅蘭姆】莎莉賽隆坦承，自己本來不懂漫威銀幕宇宙究竟好在哪裡。



  莎莉賽隆一向對漫畫改編電影不怎麼陌生，非但演出過《極凍之城》、《不死軍團》，對

  超級英雄類型作品也絕不外行，因為《全民超人》便是一部原創超級英雄電影，而她近來

  也先後客串現身《奇異博士2：失控多重宇宙》和「黑袍糾察隊」。



  在《奇異博士2：失控多重宇宙》的隱藏片尾中，莎莉賽隆便以女魔法師「克莉」之姿驚

  喜登場，警告「奇異博士」班尼迪克康柏拜區已引發對撞事件，並找他一同前往黑暗次元

  來解決這場危機。



  不過莎莉賽隆向好萊塢記者報透露，自己原本其實對漫威銀幕宇宙很無知。她解釋了這次

  飾演克莉的幕後來龍去脈。「答案就跟《不死軍團》一樣，如果我能找到定錨，那我就不

  會表現得像個勢利鬼，說：『喔，這會有損於我的演員身份嗎？』」



  「，直到有一個被我視為領養家庭的家族要

  我看完這些電影。




  「直到某年春假，我們租了一間房子，而我們的小孩都在參加春令營，他們則說：『妳必

  須坐下來好好看這些電影。』所以




  「其中自有一份神話學，克莉一角經過數十年下來也被鋪陳得很完整，這對我來說具有很

  大的挑戰性。你又要如何重新打造這個角色？所以我對此感到很興奮，但老實說，我不知

  道究竟會發生什麼事。」看來我們可以好好期待莎莉賽隆下一次現身漫威銀幕宇宙時，又

  會如何大顯身手了。



  --'
