title: '[新聞] 妮可基嫚、瑪格羅比加入莎莉賽隆演出福斯'
content: '妮可基嫚、瑪格羅比加入莎莉賽隆演出福斯新聞性騷擾醜聞題材電影


  Annapurna 影業未定名福斯新聞網（Fox News）題材電影繼五月宣布主演之一為莎莉賽隆

  （Charlize Theron）後，再傳出兩名女星洽談演出。一位為奧斯卡影后妮可基嫚（

  Nicole Kidman），另一位則是《老娘叫譚雅》奧斯卡提名女星瑪格羅比（Margot Robbie

  ）。


  該電影由《好萊塢的黑名單》導演傑洛奇（Jay Roach）執導，《大賣空》編劇查爾斯蘭

  多夫（Charles Randolph）執筆劇本。故事聚焦福斯新聞網已故前董事長暨執行長羅傑艾

  爾斯（Roger Ailes）在位期間，與他共事的女性工作者們，描述她們在任職時所遭受到

  的有害男性文化，並揭發領導者的惡行。


  莎莉賽隆飾演電視網前主播梅根凱利（Megyn Kelly，下圖）。


  妮可基嫚飾演電視網前主播格蕾琴卡爾森（Gretchen Carlson，下圖），她是首位因性騷

  擾一事對羅傑艾爾斯起訴的人。


  瑪格羅比則飾演電視網的助理製作人。




