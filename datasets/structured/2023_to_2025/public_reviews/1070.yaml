url: https://www.ptt.cc/bbs/movie/M.1433168711.A.884.html
title: '[新聞] 莎莉賽隆《麥斯》太搶鋒頭？湯姆哈迪五字'
content: '新聞網址：



  2015年06月01日 14:14 陳建嘉






  電影《瘋狂麥斯：憤怒道》從一開始不被看好的狀況下，票房倒吃甘蔗開出好成績，但片

  中的男主角瘋狂麥斯沉默寡言，主線故事也不在他身上，反而女主角芙莉歐莎是主導全體

  故事的人，日前全體劇組在坎城影展開設記者會，有記者問及湯姆哈迪這個問題，他瞬間

  的爽快回應讓現場所有記者都歡聲雷動激烈鼓掌。


  根據《好萊塢報導》指出，當《多倫多星報》的粉絲當場問及湯姆哈迪，詢問他是否會覺

  得怪異，原本應該是一個充滿雄性激素的男性動作電影，主要劇情卻在女主角芙莉歐莎身

  上，而且她的強悍程度也完全不輸給女主角，是否覺得被搶鋒頭？湯姆哈迪則回應：「

  No, not for one minute.不，一分鐘也沒有想過這個問題。」他隨後表示這是電影的呈

  現方式，他覺得很棒，不覺得被搶鋒頭。


  《瘋狂麥斯：憤怒道》在世界各地創下賣座佳績，已經決定開拍續集《瘋狂麥斯：荒原大

  地》（暫譯），目前確定湯姆哈迪將會回歸，其餘演員未定。


  --'
