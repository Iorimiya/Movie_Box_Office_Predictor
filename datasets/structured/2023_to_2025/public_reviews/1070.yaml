url: https://www.ptt.cc/bbs/movie/M.1625221096.A.B09.html
title: '[新聞] 莎莉賽隆：《不死軍團2》明年就會開拍'
content: '新聞連結：


  莎莉賽隆透露，Netflix熱門電影《不死軍團2》很快就會跟觀眾見面了。

  改編自同名美漫，由吉娜普林斯貝瑟伍（Gina Prince-Bythewood）執導、莎莉賽隆主演

  ，《不死軍團》聚焦於一群不老不死的傭兵集團，他們擁有超乎常人的自癒能力、壽命長

  達數個世紀，並利用一身異能來拯救他人。

  《不死軍團》製作成本足足有七千萬美金，也讓吉娜普林斯貝瑟伍晉升為影史上第一位執

  導大成本美漫電影的非裔女性導演，而本片問世前四週便吸引了七千八百萬戶觀賞，在

  2020年串流電影排行榜上高居第七名。


  除了高潮迭起的動作場面之外，《不死軍團》同時著重於細膩私密的情感鋪陳，身兼編劇

  一職的美漫原作者葛瑞格盧卡（Greg Rucka）更在合約中寫明，片中非得拍出一對同志情

  侶角色的浪漫戲不可，也讓本片在LGBT的描寫深獲世人盛讚。

  在電影大獲成功之下，Netflix於今年初正式宣佈籌拍續集電影，而女主角兼製片莎莉賽

  隆如今則向綜藝報透露，《不死軍團2》的劇本已正式完工，電影計劃在2022年第一季開

  鏡。

  女主角自己當然不在話下，而在首集電影裡飾演同志情侶的馬文坎薩利（Marwan Kenzari

  ）和路卡馬林內利（Luca Marinelli）也確定會回鍋演出續集。莎莉賽隆親口證實：「沒

  錯，他們肯定會登場亮相。」看來我們又能在續集電影中期待更多同志戲份了。


  ======

  還記得第一集超普....

  但我人很簡單 有莎莉賽隆的電影就會看哈

  坐等明年拍完上映


  --'
