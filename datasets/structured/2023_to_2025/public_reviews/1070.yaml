url: https://www.ptt.cc/bbs/movie/M.1431704930.A.E40.html
title: '[新聞]《瘋狂麥斯》坎城首映 莎莉賽隆樂當女悍將'
content: "出席坎城 紅毯又有范冰冰XD\n\n口碑爆棚的好萊塢動作片《瘋狂麥斯：憤怒道》(Mad Max: Fury Road)於法國時間14日在\n坎城影展舉辦歐洲首映，導演喬治米勒George\
  \ Miller也率領男主角「麥斯」湯姆哈迪\nTom Hardy、女主角「芙莉歐莎」莎莉賽隆Charlize Theron和「戰爭男孩納克斯」尼可拉\n斯霍特Nicholas\
  \ Hoult等人盛裝出席，並分享拍片幕後心得感想。\n\n導演喬治米勒對於重啟讓自己聲名大噪的《瘋狂麥斯》系列電影，他表示「某一天突然靈\n感就乍現，起初電影也沒有設定將擁有一位強而有力的女性角色，但劇中人們所追討的東\n\
  西並非某個物品，而是活生生的5位種母，因此她們需要有一位戰士來保護，但又不能寫\n成一名男性從另外一名男人手中拯救出5位妻妾，因此芙莉歐莎這號人物因而誕生。」，\n\
  關於這部反烏托邦的電影，喬治稱儘管看似瘋狂又刺激，但深藏在電影之中的意涵，像是\n一直存在的能源危機、女性主義等等，都是能讓當今社會人們值得深思的議題。\n\n\
  在片中將金髮剃掉以光頭女悍將造型示人的莎莉賽隆，則大讚導演喬治十分懂得女性在社\n會中的地位，她說當所有人觀賞電影後，絕對會很訝異竟然能在一部陽剛味十足的動作電\n\
  影中，看到一位堅強又剛毅的女性，能夠與男主角互相抗衡，而這同樣也是當初讓她答應\n出演的原因。\n\n至於出演新任麥斯的湯姆哈迪，則直說「我欠喬治一個道歉」，原來是因為長達7個月在\n\
  沙漠的拍攝期間，他除了得面對自己的恐懼外，還必須在沒有完善劇本情況下達到導演心\n中的期待，這讓他感到困惑又沮喪，他更坦言自己沒有一天不心想「你絕對是瘋了才會\n\
  答應演出！」，但直到他看到電影成品後，才了解自己的短視想法大錯特錯。不過歷經長\n時間拍攝並非只有湯姆一人，莎莉賽隆也表示自己在拍攝期間也曾有過憤世忌俗的壞心情\n\
  ，然而導演非但沒對自己失望，反而向她保證會透過電影傳遞她心中渴望的訊息，對於自\n己能夠擁有這樣的演出機會她十分感激。\n\n在首映紅毯上，除了主要演員其亮相外，主要贊助商L'oreal巴黎萊雅眾代言大使茱莉安\n\
  摩爾Julianne Moore、娜歐蜜華茲Naomi Watts和范冰冰等女星同樣受邀亮相，而與莎莉\n賽隆愛得火熱的影帝西恩潘Sean Penn則特地前來捧情人的場。\n\
  \n\n 莎莉談芙莉歐莎\n\n\n--"
