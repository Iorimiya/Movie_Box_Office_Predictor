title: '[新聞]艾瑪史東推辭《蝙蝠俠2》、莎莉賽隆不接《'
content: '艾瑪史東推辭《蝙蝠俠2》、莎莉賽隆不接《大法師3》，史嘉蕾喬韓森全去演！


  艾瑪史東推辭《蝙蝠俠2》、莎莉賽隆不接《大法師3》，史嘉蕾喬韓森全去演！


  這個月初，史嘉蕾喬韓森（Scarlett Johansson）傳出加入新版《蝙蝠俠2》（The

  Batman - Part 2）的卡司，讓影迷為之驚喜，但知名影視記者-傑夫史奈德（Jeff

  Sneider）日前爆料，喬韓森其實不是《蝙蝠俠2》劇組的首選，原本其實還有其他大牌女

  星也在候選名


  單。


  史奈德在他的部落格《The InSneider》透露，艾瑪史東（Emma Stone）才是第一個受邀

  接演的女星，但拒絕理由不明。史奈德稱，史東之前因為嫌漫威影業提出的片酬價碼太低

  ，而婉拒接演《驚奇4超人：第一步》（The Fantastic Four：First Steps）的「隱形女

  」一


  角，所以他猜這次可能也是相同原因。




  史奈德也提到，喬韓森一聽聞史東確定不接之後，立刻就請經紀團隊全力幫她喬出檔期，

  爭取演出《蝙蝠俠2》。而喬韓森會需要喬檔期，則是因為她同時也已經接演《大法師：

  信徒》（The Exorcist：Believer）的續集，所以得另外騰空檔。據說，喬韓森還有特別

  壓低


  片酬，以換取更多後端的票房分紅。


  有趣的是，喬韓森在《大法師：信徒》續集的角色，也是多位女星拒絕之後，才輪到她接

  手，劇組本想找安潔麗娜裘莉（Angelina Jolie）或莎莉賽隆（Charlize Theron），但

  都沒牽成線，最後導演-麥克佛拉納根（Mike Flanagan）才決定選用喬韓森。喬韓森對於

  成為


  次要人選的經驗並不陌生，她當初有機會接下漫威宇宙「黑寡婦」一角，也全是因為艾蜜

  莉布朗（Emily Blunt）礙於檔期衝突而退出，才輪到她出線。


  至於喬韓森會是扮演什麼角色，史奈德認為是「雙面人」哈維丹特的妻子「吉兒妲古德」

  ，他更大膽猜測，吉兒妲和丈夫在片中可能會和漫畫《蝙蝠俠：漫長的萬聖節》（Batman

  ：The Long Halloween）的情節一樣，最後都被揭露是反派「假日殺手」的真面目。另外

  ，


  最近有傳言稱，布萊德彼特（Brad Pitt）原本也有機會參演《蝙蝠俠2》， 但沒促成，

  而史奈德則透露，小布退出前正在洽談的角色，其實是哈維的父親。




  --'
