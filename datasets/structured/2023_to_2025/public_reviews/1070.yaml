url: https://www.ptt.cc/bbs/movie/M.1501397903.A.DCE.html
title: '[普雷] 急凍之城-莎莉賽隆的報告'
content: '在此劇透一段

  莎莉賽隆和蘋果下巴的床戲超讚！

  好不是重點...


  和許多諜報電影一樣 這片也有著吃虧、老梗的難題

  真真假假早已不吸引人 太多狗血太多國族情節令人無感


  但急凍之城的編導用人物選角和拍攝風格

  來巧妙的平衡這種疲乏 讓東歐的色彩獲得發揮

  跳脫一種幼稚感 沒有奇怪的包袱 把小格局做得更扎實

  街頭取景也讓畫面更真實


  片中豪氣地穿插許多音樂歌曲 營造出很棒的詼諧反差

  在冷硬鋪成中創造刺激感 並故意拉長時間使人感到黏膩

  給人感受這些特務、殺手、間諜之間的故事

  就是一串你爭我奪的迴圈 像是重播的副歌


  莎莉賽隆把其他片女特務身上會有的花瓶感直接凍碎

  打鬥表現得更不要命不怕痛 整部片沒有無敵的人物

  沒有殺不死的人 沒有人不流血 漂亮光鮮都是假象

  蘋果下巴的演技 相對於在神鬼女木乃伊中好上不知數倍

  而很可惜的是因為男一、女一都給莎莉賽隆包了

  X教授反而沒有什麼令人深刻的印象


  看完覺得急凍之城片有種使人回到想像的原點

  的確有所新意 白髮造型的莎莉賽隆性感得讓人無法忘懷

  在爽片中應該可以得到不錯的分數 值得一看

  人物選角、敘事手法、服裝、化妝特效都屬中上及格


  強烈建議去電影院觀看 因它的美術風格看小螢幕

  會產生廉價感 會有非常嚴重的視覺誤解


  -----

  Sent from JPTT on my iPhone


  --'
