url: https://www.ptt.cc/bbs/movie/M.1465098050.A.14C.html
title: '[討論] 莎莉賽隆非常願意演出瘋狂麥斯憤怒道續集'
content: '撇除卡司間的彆扭！莎莉賽隆表示非常願意演出《瘋狂麥斯：憤怒道》續集

  由澳洲導演喬治米勒（George Miller）執導的末日後爽片《瘋狂麥斯：憤怒道》（Mad

  Max: Fury Road）在奧斯卡金像獎上狂掃了包括最佳剪輯等六個獎項，儘管沒有拿下第88

  屆奧斯卡獎的最佳影片獎，在影評人以及觀眾心中《瘋狂麥斯：憤怒道》所帶來的視覺震

  撼似乎已經超越了獎項的肯定。


  先前在訪談中，喬治爺爺表示他已經將接下來兩部續集的劇本初稿交給電影公司了，儘管

  導演有意願繼續拍下去，先前傳出鬧彆扭的兩位主要演員湯姆哈迪（Tom Hardy）以及莎

  莉賽隆（Charlize Theron）也成為大家關注的對象，畢竟如果這兩個演員不再度聯手合

  作，這個系列似乎會有一點無味，對此莎莉在訪談中提到了他的想法。







  不過受到《夜晚還年輕》（Tangerine）激發出的靈感，喬治想要先拍攝一部比較小的製

  作，對此莎莉也表示他對於導演的支持，更相信等導演準備好了他就會打電話來。

  「我從奧斯卡之後就沒見到喬治了，我想他對於這一切（得獎）一定感到很開心，他也非

  常懂得如何運用自己的時間，而且非常簡樸的一個人，我想等他準備好了，他就是準備好

  了，希望他會打給我。」


  喬治米勒接下來準備要拍攝的兩部曲，其中有一個是針對莎莉飾演的芙莉歐莎（Furiosa

  ），會更仔細地帶大家回顧他的背景故事，而湯姆哈迪的合約裡面也仍然擁有兩部續集的

  空間，除了帥氣十足的整體視覺設計以外，這個世界觀裡面的故事也讓人十分好奇，例如

  芙莉歐莎的手去哪了？以及這個世界是如何被不死老喬統治之類的問題。不過《瘋狂麥斯

  ：憤怒道》本身就是非常完整的獨立作品，所以就算接下來的電影與它無關，相信喬治爺

  爺的講故事功力，也能夠讓接下來的系列非常有可看性，讓我們繼續期待吧！



  --'
