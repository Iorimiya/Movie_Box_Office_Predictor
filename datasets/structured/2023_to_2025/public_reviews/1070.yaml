url: https://www.ptt.cc/bbs/movie/M.1646583063.A.D7D.html
title: '[新聞] 莎莉賽隆演《奇異博士2》？傳阿湯哥前女'
content: "莎莉賽隆演《奇異博士2》？傳阿湯哥前女友也加入\n\n\n 葛大維\n\n有造勢之嫌的瘋傳已經到了無所不用其極的地步嗎？影視媒體「The Direct」報導：好萊\n\
  塢盛傳很久漫威力邀莎莉賽隆加入可望成真，將首次演出《奇異博士2》，而且角色還是\n奇異博士的老婆克莉（暫譯）。\n\n克莉於1964年11月在漫威漫畫《奇異故事》（直譯）初登場，由漫威之父史丹李創造，是\n\
  神祕銀髮少女！身高173公分！體重86公斤！曾在電視劇版《奇異博士》中出現。\n\n\n\n今年8月7日將邁入47歲的莎莉賽隆，身高177公分，曾為演《女魔頭》增重13—15公斤；\n\
  為演《厭世媽咪日記》增重22—23公斤，她曾說後來為了瘦身難過到崩潰。\n\n現傳莎莉賽隆首度加入漫威演奇異博士的老婆，今年7月19日才邁入46歲的奇異博士班奈\n\
  狄克康柏拜區，會顛覆漫畫娶「姐姐妻」嗎？讓粉絲超好奇。\n\n《奇異博士2》早就瘋傳今年7月3日將邁入60歲阿湯哥可能演「不同宇宙」（暫譯）鋼鐵\n人，但「The\
  \ Direct」加重碼報導：和阿湯哥合演《不可能的任務7》傳假戲真做的前女\n友（現已分手）海莉艾特沃，將在《奇異博士2》演卡特隊長。\n\n今年4月5日將邁入40歲的海莉，曾在2011年《美國隊長》飾演對美國隊長克里斯伊凡有好\n\
  感的佩姬卡特；曾替漫威動畫影集《無限可能：假如…？》中替卡特隊長配音，如今傳在\n《奇異博士2》將正式升級，所以「The Direct」直指她是：「半」瘋傳。\n\
  \n《奇異博士2》其他新瘋傳還包括和翹臀珍合演《嫁給我》的53歲歐文威爾森將演「大叔\n版魔比斯」；還有最驚豔的是：第一代蜘蛛人陶比麥奎爾+第二代蜘蛛人安德魯嘉菲爾德\n\
  ，也將現身。但至截稿前，以上瘋傳都沒證實。\n\n《奇異博士2》的瘋傳已和副標：《失控多重宇宙》那樣大失控喧賓奪主嗎？不見得，「\nThe Direct」報導：男主角班奈狄克康柏拜區片中一人演四角：奇異博士本尊，綁馬尾的\n\
  「守護者」（暫譯）奇異博士，穿黑袍的「邪惡」（暫譯）奇異博士，穿藍袍的「至尊」\n（暫譯）奇異博士。所有瘋傳的真相，有待該片預定5月6日在美上映揭曉。（圖／美聯社\n\
  ，2020年10月12日阿湯哥和海莉在羅馬拍《不可能的任務7》）\n\n\n\n新聞網址：\n\n\n--"
