title: 'Re: [新聞] 莎莉賽隆怒嗆:男人老了像美酒 女人老了'
content: '能長壽一直有戲演的

  最重要的就是你年紀慢慢變大時還能演讓觀眾願意看的腳色


  好比底下這幾類


  一,年輕時就能演成熟腳色

  例如陳莎莉 20幾歲就能演中年的將軍夫人

  不到30歲就能演慈禧,一路演三四十年

  到了六七十歲了還是能演慈禧


  二 動作型的 其實動作型的顧好身手就能演很久

  這個臉隨時間有點滄桑老態是沒差的

  幾個動作大IP 主角一演就是10幾20年

  終極警探 洛基 第一滴血 惡靈古堡 不可能任務 玩命系列 等諸如此類

  東方的成龍李連杰楊紫瓊也都演了很多年的動作片


  三,保養得宜幼幼臉老很慢的

  你看TGM的男女主就是這種的


  四 順利轉型的

  好比史恩康納萊,007退役後其實也低沉一陣子

  後來連續幾部電影成功轉型為睿智長者角色後才又大紅起來

  時空英豪 鐵面無私 聖戰奇兵等,戲中表現都能力壓當時的男一


  --'
