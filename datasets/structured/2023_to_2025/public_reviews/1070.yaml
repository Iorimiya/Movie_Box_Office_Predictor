url: https://www.ptt.cc/bbs/movie/M.1492357375.A.525.html
title: '[新聞] 雙影后加持 莎莉賽隆《玩命關頭8》使壞'
content: '含花絮影片


  《玩命關頭》系列中除了有令人熱血熱騰、爽度爆表的飆車動作場面外，電影最核心的故

  事主題莫過於「家庭」(Family)，身為劇中關鍵要角、由馮迪索(Vin Diesel)所飾演的唐

  老大，向來把家人放在第一順位的他，在全新一集《玩命關頭8》(The Fate of the

  Furious)裡卻成了背叛至親好友的角色，並跟性感與智慧兼具的瘋狂反派「賽芙」莎莉賽

  隆(Charlize Theron)聯手。


  事實上，當製作團隊在發想一個能夠讓唐老大背叛家人的反派角色時，心中最佳人選即是

  能夠美艷又能狠毒的奧斯卡影后莎莉賽隆，劇中她不僅對唐老大的團隊造成致命威脅，同

  時也帶來讓人驚呼連連的劇情轉折。對於自己成為系列第一位女反派，莎莉賽隆表示自己

  深感榮幸，「我真的覺得非常幸運，能加入全球最受歡迎的電影系列，並且演出系列第一

  名女性反派角色，這真是極大的榮幸！」。


  過去曾在《公主與狩獵者》(Snow White and the Huntsman)詮釋惡皇后使壞的莎莉賽隆

  ，這回在《玩命關頭8》更升一個層級，化身擅長高科技犯罪的女駭客，面對阻礙她計畫

  的人事物，二話不說瞬間「冷血」處理解決掉，談及這個瘋狂又有點變態的角色，她說：

  「賽芙是一個真正的狠角色，她真的會為了達到目的，不擇手段。這也是一個性格複雜、

  魅力十足的角色，身為一個演員，能夠演出一個霸氣十足的角色真的很棒。她就這麼直接

  地闖入這個世界，奪走她想要的東西，而且用的手法完全令人意料不到。」。


  導演蓋瑞葛雷補充：「當賽芙和唐老大在片中首次交手，馮迪索和莎莉賽隆在大銀幕上擦

  出的火花真的是電力十足，他們從第一場戲開始就針鋒相對，隨後在片中的每場對手戲都

  能夠讓觀眾感受到他們互相對立又互相吸引的矛盾關係，這也是系列電影中從來沒有出現

  過的關係，我對於能夠塑造出這種強烈關係感到非常驕傲。」。



  除了莎莉賽隆加持，同樣身為奧斯卡影后的英國巨星海倫米蘭(Helen Mirren)同樣加盟新

  一集演出陣容。事實上，海倫過去受訪時曾公開喊話想演《玩命關頭》，如今美夢成真，

  更成為新一集劇情關鍵要角。至於參演契機，則要回溯至2016年她於奧斯卡獎上遇見馮迪

  索那一刻，當馮迪索第一次見到這位英國金獎影后時，表面上裝得很酷，但是內心卻超級

  興奮，他很高興海倫米蘭主動想加入《玩命關頭》系列電影。


  馮迪索表示：「導演蓋瑞、編劇克里斯和我在短短的一星期以內就把她的角色寫進劇本裡

  ，最棒的是，她的角色對我們來說就像天上掉下來的禮物，因為她能把前兩集沒有交代清

  楚的劇情完整地連結起來，到目前為止，我和海倫米蘭的對手戲是我最喜歡的一場戲。」

  ；至於海倫米蘭本人參演心情，她笑說：「和馮迪索合作，一起飆車？這聽起來是最棒的

  工作。」。《玩命關頭8》中心主題和核心價值觀依舊圍繞著家庭，劇情則將與接下來的9

  、10集成為全新三部曲。




  --'
