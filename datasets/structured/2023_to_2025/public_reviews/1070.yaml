title: '[心得] 當哈利碰上莎莉 When Harry Met Sally  '
content: '偶然間看到的一部佳片,挑起了一些意外的感動,這部片子挺久了1989年等於是民國78年的作品了,劇中人物穿著當然看起來蠻復古的,但是之中RYAN的部份髮型還是挺經典的,其中的直髮造型我最喜愛.


  男女主角各是Billy Crystal跟甜姐兒RYAN看著他們由高中生演到中年,化妝技巧還不賴,高中生式的扮相還挺有說服力的.


  兩人一見面就是唇槍舌戰,理念南轅北轍.

  第二次兩人見面隔了5年之久,也是匆匆一會罷了.

  到真正有交集時Billy Crystal已跟前妻正在協議離婚了,而RYAN跟交往5年的男友分手,因境遇相似,進而同病相憐轉變成朋友.


  跟一般愛情片有所不同的是,這部片子讓我們看到男女許多天性不同的部份,例如:當要度過一段情殤時,女人無心跟男人約會更不可能上床,而男人卻可以跟別的女人有性無愛.


  其中有幾段我印象挺深刻,SALLY說女人在男人面前常假裝性高潮...HARRY說他不信性高潮可以假裝.SALLY於是就開始在餐廳呻吟^^讓HARRY開了眼界...不過這段以現在來看演出真是略嫌保守.點到為止...,但想想這是多年前的作品,連片中的髒話都會被消音就不足為奇了.


  再來是之中導演會根據劇情的進展穿插不同的銀髮夫妻閒話家常他們當初彼此定情的情況,我覺得也蠻有創意也不會突兀,蠻好的,原來愛情一直存在於各種不同的形式與年紀.


  其中一段因為彼此的好友要結婚,僅因為一個傢俱造成的爭執也很有意思,那幕HARRY說的話也很有POWER.


  整部片子隨時都有意外的驚喜,也不是隨時都有歡樂,但看完後,讓我覺得或許有些愛情來的晚點也不壞.


  很特別但又好看的片子,介紹給大家.




  --

