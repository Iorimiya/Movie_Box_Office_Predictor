url: https://www.ptt.cc/bbs/movie/M.1712977931.A.76A.html
title: '[好雷] 莎莉，雞與家與機與家'
content: "~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n~~~~~~~~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n一個台中養雞女與法國畫廊男的愛情故事\n\n多金帥總裁看上杉菜飛上枝頭變鳳凰的情節\n\
  請留在90年代以前吧\n\n現在在網路上遇到夢幻對象\n你應該知道他是詐騙\n所有人都應該內建這樣的防詐模式\n\n這部電影也不是只有反詐騙宣導\n從選擇「雞」當作題材開始\n\
  就是個與家密不可分的關係\n\n(台語的雞與家同音)\n\n談失親、姊代母職、阿姨/姑姑代母職\n一個奉獻自己生命給家人的堅強女性\n心裡也有柔軟想被愛的一面\n\
  \n談鄉下與大城市、刻板印象中的粗鄙與高尚\n台中農村與法國巴黎\n法式社交與辦桌婚宴\n用鏡頭、音樂與故事把兩個看似天差地遠的地方連結起來\n\n談迷信與愛情\n\
  人類對信仰、命運與愛情的邂逅是不是如同夜盲的雞一樣\n看不清\n\n----\n\n而讓我最有感觸的部分\n是當日復一日過著安定生活的女主角\n在下載了交友軟體後，從雞不離身變成機不離身\n\
  \n原本專注的模式被手機打破\n日有所思，看有所感\n\n這幾天我一直在想\n所謂的「內容創作者」與毒販本質上沒有差別\n都是試圖做出並且販賣成癮的東西\n讓受眾ㄉ一ㄠˊ住\n\
  \n破壞人的平靜與專注\n然後以此獲利\n\n詐騙也是\n\n電影在最後給了一個很好的結尾\n不落俗套而且富有發展的深意\n\n人生本來就不完美\n能夠把自己手上的牌打好\n\
  藉由新工具擴展自己的舒適圈與眼界\n\n停止當個受害者\n\n--\nFB: \nYT: \nIG: \n\n--"
