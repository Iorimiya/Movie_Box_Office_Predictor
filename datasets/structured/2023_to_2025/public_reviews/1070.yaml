url: https://www.ptt.cc/bbs/movie/M.1444787314.A.D8E.html
title: '[新聞] 與「瘋狂麥斯」不和 莎莉塞隆續集消失'
content: '與「瘋狂麥斯」不和 莎莉塞隆續集消失


  2015-10-13 21:53:09 聯合報 記者蘇詠智╱即時報導


  今年備受好評的動作片「瘋狂麥斯：憤怒道」續集蓄勢待發，編導喬治米勒卻透露片中不

  會出現由莎莉塞隆扮演、大獲好評的女英雄一角，喬治計畫中的兩部續集，只有第二集可

  能會讓莎莉的角色客串亮相。雖然顯得詭異，但莎莉在拍攝「瘋狂麥斯：憤怒道」時和湯

  姆哈迪、尼可拉斯霍特都不和，在續集中消失也省了不少麻煩。


  莎莉在宣傳時不諱言和演麥斯的湯姆哈迪處不來，但兩人也都夠專業，還在坎城影展上合

  體宣傳影片。而尼可拉斯則被傳在拍片時為莎莉的大牌氣燄惹火，兩人之後又合作了「暗

  處」，然而尼可拉斯曾經一度考慮拒接。雖然莎莉讓男星都怕怕，演技表現依舊深獲肯定

  ，因此本來設定布萊德彼特主演的一部新片，可能主角陰陽調換，改由她挑大粱。




  --'
