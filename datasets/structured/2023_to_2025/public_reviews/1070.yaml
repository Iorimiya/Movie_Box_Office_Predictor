url: https://www.ptt.cc/bbs/movie/M.1493240966.A.B23.html
title: '[新聞] 被莎莉賽隆虧吻起來像「死魚」 馮迪索氣'
content: "被莎莉賽隆虧吻起來像「死魚」 馮迪索氣炸了！\n\n2017/04/26 09:35\n\n 馮迪索（右）與莎莉賽隆（左）在《玩命關頭8》中有一幕吻戲，但2人對這一吻的反應\n\
  卻是天差地別。（翻攝自Hindustan Times）\n\n〔記者陳昱均／綜合報導〕《玩命關頭8》目前上映才短短2周，在全球票房就已締造超過\n9億美金（約273億新台幣）的佳績，在各地都開出票房紅盤。而該片最受矚目的除了馮迪\n\
  索與巨石強森2名硬漢之間的不和傳聞外，其實另一個關鍵則是由影后莎莉賽隆飾演的「\n賽芙」，在劇中綁架了馮迪索飾演的「唐老大」的前女友及其兒子，讓他反過來與「家人\n\
  」們自相殘殺，成了引發本片重要轉折的焦點人物2人甚至還有一場吻戲，馮迪索事後更\n到處炫耀說：「這是我人生中最棒的一吻」；不料莎莉賽隆卻完全不給他面子，回嗆他吻\n\
  起來像「死魚」，而馮迪索聽完簡直不敢相信，整個被氣炸了。\n\n莎莉賽隆（左）這次在《玩命關頭8》裡的角色將成為讓馮迪索（右）所飾演的「唐老大\n」去背叛「家人們」的關鍵。（翻攝自film.it）\n\
  \n先前馮迪索在接受《USA Today》訪問時，大讚莎莉賽隆是個很棒的吻戲對手演員，更十\n分享受地表示：「吻跟嘴唇都是不會騙人的，她真的做得超好」，並到處炫耀這是他人生\n\
  中有過最棒的一吻；但後來莎莉賽隆本人在《艾倫秀》上聊及此事時，整個人只能尷尬大\n笑，回應：「我真的不懂，我整個就像是個要對他做這樣可怕事情的瘋女人一樣，而他就\n\
  只是僵硬地站在那，雖然他的角色確實必須這樣啦...不過感覺就像條死魚」，甚至補充\n：「我喜歡我的男人更有動感一些」，引發爆笑。\n\n馮迪索（左）不斷對外炫耀與莎莉賽隆（右）的吻戲是「人生最棒的一吻」，沒想到對方\n\
  卻說他吻起來像死魚。（翻攝自Hollywood.com）\n\n因此，最近換馮迪索上《艾倫秀》時，主持人艾倫狄珍妮整個毫不客氣地將莎莉賽隆所說\n的原話整段傳述給他聽，當聽到自己原本開心稱為「是人生最美好的一吻」被對方形容成\n\
  「吻起來像死魚」時，馮迪索整個人被震驚到跳了起來，大呼：「什麼？！天啊，你們說\n我看起來像條死魚嗎？」還氣憤難平地表示：「首先，妳不應該在為優秀動畫《海底總動\n\
  員2：多莉去哪兒？》中「多莉」一角的配音員艾倫面前提到死魚，更不應該把我跟一條\n死魚拿來對比！」激動反應笑翻眾人，不過也讓人見證2名演員的幽默與深厚好感情。\n\
  \n\n--\n\n\n\n\n\n\n\n--"
