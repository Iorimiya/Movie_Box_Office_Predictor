url: https://www.ptt.cc/bbs/movie/M.1572598907.A.B58.html
title: '[情報] 《阿達一族》動畫電影即將上映 莎莉賽隆'
content: "《阿達一族》動畫電影即將上映 莎莉賽隆和克蘿伊摩蕾茲配音幕後花絮公開\n\n （GNN 記者 阿Lu 報導） 2019-10-30 16:13:37\
  \ 動畫\n\n11 月 1 日即將在台上映的《阿達一族》首部動畫電影，近日公開了為作中女主人魔帝女\n配音的莎莉賽隆、以及為女兒星期三配音的克蘿伊摩蕾茲兩人的幕後花絮。\n\
  \n\n\n準備來大彈手指吧！地表最陰森的古怪家庭《阿達一族》首部動畫電影登上大銀幕啦！搞\n笑、詭異、超經典的阿達一家人這次要來告訴你什麼叫做正港的好厝邊。詭異又怪奇、神\n\
  秘又怪僻，一直以來備受喜愛的《阿達一族》將在今年萬聖節重返江湖，以全新姿態登上\n大銀幕，超經典阿達一家人的首部動畫電影裡，高魔子、魔帝女、普斯利、星期三、肥斯\n\
  特伯伯和奶奶，將攜手一票生動角色合力勾起我們對這個地表最古怪家族的搞怪回憶。\n\n\n\n莎莉賽隆在《阿達一族》中飾演優雅、迷人、嚴謹的魔帝女。針對魔帝女的聲音，製作團\n\
  隊一開始嘗試用羅馬尼亞口音，後來決定採用一種更獨特的口音來凸顯這部新版本：大西\n洋中部口音。莎莉賽隆聽了許多凱瑟琳赫本的聲音檔，進而融會貫通成自己的版本。「她\n\
  堅忍內斂、舉止端正、善於表達，我想她是這個家的管家婆，這些都是我想保有的特質，\n」莎莉賽隆說到。\n\n\n\n\n\n「因為這是個起源的故事，我想先帶入她比較年輕的樣子，她跟高魔子談戀愛時的樣子，\n\
  接著他們組織家庭，她漸漸成為這個家的主導人物。」魔帝女通常被描繪成冷冰冰的大家\n長，受到大家的敬畏和尊重，很少人敢挑戰她的權威，在這部電影裡卻起了變化，倔強青\n\
  少年星期三使盡一切手段激怒她這個媽媽，同時她正飽受家族裡眾多成員質疑他們為何大\n老跑來這裡開始新生活。「在這部電影裡，魔帝女和星期三之間的感情深厚且複雜，」莎\n\
  莉賽隆表示。「我自己還沒有這麼大的小孩，但我們大概都很清楚家裡有個青少年會是什\n麼樣子。我很喜歡她們之間的關係，基本上這個故事述說了一個母親害怕失去她和女兒之\n\
  間的感情，而星期三正在經歷成長過程。」雖然星期三很可怕，但她也正飽受折磨，不只\n因為弟弟普斯利每天都想要她的命，她本人正經歷一段相當典型的青少年成長之旅/儀式\n\
  ：挑戰極限，尋找自我。\n\n\n\n\n「她知道自己有點奇怪，她喜歡被別人討厭，她發現看別人丟臉很好玩，詮釋這些真的很\n有趣，」克蘿伊摩蕾茲說到。「但在內心深處她就只是個青少年：她想把她媽逼瘋，尋找\n\
  屬於自己的自由，她覺得自己被困在這棟大房子裡，一心只想遠走高飛。我們一開始就看\n到她走近大門口，聽到門外有奇怪的聲音，她很想知道那是什麼東西，於是她開始對他們\n\
  家這棟鬼屋之外的世界感到好奇。當她發現外面還有另一個世界，發現她媽媽超討厭粉紅\n色、啦啦隊，以及主流社會覺得很正常的東西，她的反應其實很正常，這些再普通不過的\n\
  事情，卻是星期三做過最瘋狂的事情，我覺得她也滿喜歡與人互動的。」尼克克羅爾表示\n：「克蘿伊摩蕾茲所詮釋的星期三有那種年輕卻老成的味道，還有很棒的冷面特質，一整\n\
  個恰到好處。」莎莉賽隆也成了她的粉絲。「說到克蘿伊摩蕾茲，我活像個跟蹤狂，」她\n笑著說。「我基本上試著把她拉近我製作或演出的每一部電影裡，我很幸運跟她合作了幾\n\
  次，我們也成了好朋友，我一直覺得自己就像她老媽，所以這其實是個很完美的機會。」\n\n《阿達一族2》當年上映時，克蘿伊摩蕾茲才 6 歲大，但她印象非常深刻，因此對詮釋星\n\
  期三的聲音躍躍欲試。克蘿伊摩蕾茲很開心能將這個瘋狂家族的原始版本介紹給年輕一代\n。「我覺得小朋友一定會喜歡他們的阿達一族初體驗，」她表示。「因為這跟其他故事都\n\
  不一樣，而且相當真實、熱鬧又瘋狂，傻裡傻氣卻充滿內涵，故事最終是要提醒人們接納\n彼此的差異。」\n\n\n\n《阿達一族》趣聞和彩蛋，查爾斯亞當斯的原創漫畫裡，很多地方都是取景自紐澤西的韋\n\
  斯特菲爾德小鎮。你知道小手有女朋友嗎？卡羅琳瓊斯！她在《阿達一族》影集裡扮演過\n魔帝女，也扮演過小手的伴侶，手指小姐。扮演過魔蒂女的女星包括了卡羅琳瓊斯、戴露\n\
  漢娜，還有在影集《奇異果女孩》裡飾演知名角色佩蒂小姐的莉茲托瑞絲。《阿達一族》\n第一部卡通影集出自漢納巴伯拉動畫公司，在 1973 年僅播出一季。當時為普斯利配音的\n\
  是茱蒂佛斯特。在 1960 年代，真的有一種舞步叫做「The Lurch」（老蛆），在《阿達\n一族》某一集影集裡曾出現在劇情中。《阿達一族》音樂劇是美國中學經常表演的音樂劇\n\
  劇碼之一。肥斯特伯伯原本是魔蒂卡那邊的親戚，後來在電影版本裡被改編成高魔子的哥\n哥。星期三阿達在《紐約客》的原創漫畫裡原本沒有名字，改編上電視時需要角色名字，\n\
  查爾斯亞當斯參考童謠《星期一的孩子》的內容幫她取名。（不難理解，「星期三出生的\n孩子充滿悲傷。」）\n\n\n\n--"
