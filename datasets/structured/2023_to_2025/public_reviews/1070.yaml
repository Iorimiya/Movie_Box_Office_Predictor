url: https://www.ptt.cc/bbs/movie/M.1433312157.A.606.html
title: '[新聞] 「驚奇隊長」擬撮合莎莉塞隆、裘莉攜手'
content: '2015-06-03 03:27:04 聯合報 記者蘇詠智／綜合報導


  莎莉塞隆「巾幗不讓鬚眉」的形象備受觀眾肯定。路透資料照片


  安琪莉娜裘莉的導演功力受到青睞。路透資料照片


  漫威籌備中的女性超級英雄新片「驚奇隊長」，有可能撮合兩大美豔性感的奧斯卡得主攜

  手。據「華盛頓郵報」報導，漫威一直屬意由安琪莉娜裘莉執導，粉絲心目中的最佳主角

  人選則是莎莉塞隆，兩人近期走得頗近、互動不差，不是不可能合作。


  安琪莉娜裘莉與莎莉塞隆年歲相近、外表皆美豔、崛起的時間差不多，兩人亦都得過奧斯

  卡，也是觀眾心目中少數可以演動作英雄的女星，然而兩人並不會爭搶「驚奇隊長」這個

  角色，而是分別擔任導演與女主角。裘莉執導的「永不屈服」在美國票房不錯，她比真正

  主演的演員都更受到矚目，也是片子真正吸引觀眾的賣點，號召力受到漫威的肯定，早在

  年初就被傳有可能是「驚奇隊長」導演人選之一。


  莎莉塞隆近期在「瘋狂麥斯：憤怒道」表現搶眼，贏得不少觀眾的崇拜，堪稱飾演「驚奇

  隊長」絕佳選擇。她自與西恩潘交往後，由於西恩潘和布萊德彼特為「永生樹」一起在坎

  城影展造勢後交情持續熱絡，彼此常帶著另一半來個4人約會，使她和裘莉常有接觸，很

  有共同的話題，迅速成為朋友。若是莎莉願意接演「驚奇隊長」，裘莉很可能會答應執導

  。




  --








  --'
