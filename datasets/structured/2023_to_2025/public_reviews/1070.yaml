url: https://www.ptt.cc/bbs/movie/M.1714402299.A.0CB.html
title: '[好雷]  莎莉 心得 出乎意料的優質國片'
content: '剛好晚上沒事，想說支持一下劉品言，就來看看莎莉。


  莎莉出乎預料的好笑又好哭，整部劇情節奏沒有拖到，有親情、有愛情（被騙？）讓我留

  下男兒淚





  以下防雷

















  防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  有幾個點讓我印象非常深刻

  1.劇中劉品言活在農村的背景，在那種傳統環境，交不到男友還要被週遭逼親？

  真的很像我逢年過節，長輩就在問，真的很煩！


  2.因為姪女誤入手機交友世界！其實也因為單身很久，網路廣告都會打omi也曾經讓我下

  載過，但肥宅如我竟然還真的有遇到配對跟我聊天的，也真的就像品言一樣，被周遭的朋

  友嘲笑會不會是詐騙，當時真的氣炸！雖然跟那位網友沒有後續就是了！


  3.讓我最佩服的是品言跑到巴黎追愛！

  我自己經驗好像現代男女要認識異性，透過網路交友真的是很正常的事情，只是沒有想到

  追到國外去！ 我通常就雙北吃吃飯，看個電影就是了！


  4.在鄉下地方還有社會與論、風情民俗壓力！

  沒有想到現在結婚還有什麼屬虎的會跟弟弟結婚相剋！ 那時候看到這段劇情真的很生氣

  ！怎麼會到這個年代了還會在那邊唧唧叫左右他人的三姑六婆！

  但好在劇組有給他完美的ending


  5.你的愛就是愛，我的愛就不正常嗎？

  這段我哭了，劉品言的演技大爆發，愛不被認可任誰都會覺得很心酸。然後，劉品言從巴

  黎回來參加弟弟林柏宏婚禮，他在婚宴上大哭的那一幕我也跟著流淚，姊弟情深！


  總結


  9.7/10分


  原以爲是本土感性小品，看完以後發現好好笑又感人，無限循環的爆笑加爆哭，很推，想

  周末去二刷。


  --'
