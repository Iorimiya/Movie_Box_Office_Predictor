title: '[新聞] 李英宏為莎莉配樂 幽默台語氣口變身男二'
content: "李英宏為莎莉配樂 幽默台語氣口變身男二\n\n2024/04/10 05:30\n\n\n李英宏製作配樂，更受到導演青睞成了第二男主角。（記者王文麟攝）\n\
  \n〔記者陽昕翰／台北報導〕音樂才子李英宏為喜劇電影《莎莉》製作配樂，導演發現他獨\n到的趣味喜感，相當適合片中充滿台味的臭屁直男「阿豪」一角，試鏡後更成了片中的第\n\
  二男主角。\n\n\n李英宏詮釋臭屁的直男角色，在電影中上演機智鄉村生活。\n（伯樂影業提供）\n\n李英宏與劉品言、林柏宏上演機智鄉村生活，渾然天成的直男幽默與台語氣口，以自然不\n\
  造作的演技深獲好評。\n\n《莎莉》是李英宏個人第三部的電影配樂作品，他突破自我挑戰全新曲風，原聲帶融合民\n謠、爵士樂隊演奏曲、電子舞曲等元素。電影同名主題曲《莎莉》以李英宏擅長的台語創\n\
  作，生動描述女主角的愛情異想世界，喚起初戀無限美好的回憶；李英宏表示：「希望讓\n觀眾感受從農村的平淡歲月靜好，到對愛充滿想像、勇於去愛，面對愛情不可捉摸的狀態\n\
  。」\n\n《莎莉》電影原聲帶專輯將在4月下旬發行，李英宏也預告今年夏天，會推出全新的個人\n創作專輯。\n\n--\n\n 是菩薩成佛之道\n       \
  \ 是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
