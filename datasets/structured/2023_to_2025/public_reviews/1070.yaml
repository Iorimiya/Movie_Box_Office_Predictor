title: '[新聞] 西恩潘宣傳新片 莎莉賽隆愛相隨'
content: '新聞網址：


  2015-03-12 03:11:09 聯合報 記者陳于嬙／台北報導


  西恩潘主演的新片「全面逃殺」，3月20日台美同步上映，西恩潘因演出動作片，在網路

  上被與柯林佛斯、連恩尼遜封為「好萊塢三大性感型男」，不過西恩潘更勝一籌，只因他

  的女友是奧斯卡影后莎莉賽隆，兩人每天只想膩在一起，就算西恩潘為電影全球跑透透，

  莎莉賽隆都愛相隨。


  踏入影壇40年，西恩潘首度接拍動作片，他表示，一直都在尋找獨特的劇本，尤其是動作

  片，直到看完「全面逃殺」劇本才讓他心動，不希望角色，只是一個有勇無謀的莽夫，所

  以除動作之外，還有鬥智與懸疑劇情。


  西恩潘螢幕上展現鐵漢的一面，感情上則毫不掩飾對莎莉賽隆無盡的愛，他說：「只要莎

  莉在哪，我的家就在哪，因為我的心都在她身上。」

