url: https://www.ptt.cc/bbs/movie/M.1522372364.A.D20.html
title: '[新聞] 莎莉賽隆變身女魔頭 「男性逼出來的」'
content: '新聞網址：


  奧斯卡影后莎莉賽隆（Charlize Theron）將於黑色動作喜劇《老闆好壞》中飾演稱霸職場

  的性感女魔頭，為達目的不擇手段，不僅嘴上功夫了得，賤話盡出令人無法招架，更善用

  自己的智慧與美貌做為談判籌碼。


  莎莉賽隆受訪時表示為詮釋這個角色下了很多苦功，她希望這個角色能讓人注意到真實的

  企業環境與職場女性，她說：「我飾演的職場女魔頭都是被男性逼出來的，她長年在由男

  性訂定規則的企業裡奮鬥，被迫遵從這些規則，卻也從中創造出自己的規則，找出自己的

  做法。我不希望讓她只是誇張的搞笑，她在人前大搖大擺，人後也有脆弱的一面，我想要

  挖掘她的各種面向。」


  《老闆好壞》卡司陣容堅強，除了有興風作浪的「慣老闆」莎莉賽隆和喬爾埃哲頓Joel

  Edgerton，美國甜心亞曼達賽芙瑞（Amanda Seyfried）也參一咖，飾演甜美卻兩光的豬隊

  友，想對苦命員工大衛歐洛沃（David Oyelowo）伸出援手卻頻幫倒忙。連近日與英國超模

  卡拉迪樂芬妮（Cara Delevingne）陷入熱戀的麥可傑克森女兒芭莉絲傑克森（Paris

  Jackson）也在本片首度在大銀幕亮相，還與亞曼達賽芙瑞互搶男人。莎莉賽隆大力稱讚芭

  莉絲的積極與熱情，她說：「這個角色本來在劇本設定是一名男性，但芭莉絲特地來參加

  試鏡，做好十足準備，極力爭取演出，她的表現也十分優秀。」


  《老闆好壞》描述認真負責、個性溫和的上班族哈洛（大衛歐洛沃飾），突然應公司要求

  赴墨西哥出差，不料出差過程卻淪為逃命旅程？！哈洛辦事不成，意外牽扯到墨西哥毒梟

  、美國緝毒局和國際傭兵，把威嚇四方的女魔頭上司（莎莉賽隆 飾）惹得氣噗噗，他的直

  屬主管（喬爾埃哲頓飾）也只想攤手不管。死到臨頭的哈洛迫不得已打回公司求救，狠心

  主管們卻見死不救，他要如何全身而退呢？電影30日在台上映。


  --'
