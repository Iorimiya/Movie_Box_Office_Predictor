title: '[新聞] 湯姆哈迪曾稱「惡夢」 雷神力挺莎莉直誇'
content: "湯姆哈迪曾稱「惡夢」 雷神力挺莎莉直誇完美\n\n2016/04/08 21:03\n\n\n莎莉賽隆、艾蜜莉布朗特與克里斯漢斯沃近日為電影《狩獵者：凜冬之戰》\n\
  宣傳。（美聯社）\n\n〔記者陳建嘉／台北報導〕莎莉賽隆日前坦言，拍攝《瘋狂麥斯：憤怒道》時與男主角湯\n姆哈迪不合，兩人拍完電影後才正式和好，湯姆事後還曾寫給她一封信說：「妳是我的噩\n\
  夢，但妳也他X的超棒，我會一直想妳的。」最近莎莉與克里斯漢斯沃共同宣傳電影《狩\n獵者：凜冬之戰》，克里斯發揮暖男形象力挺莎莉，直誇她完美。\n\n\n克里斯漢斯沃大力稱讚莎莉賽隆。（美聯社）\n\
  \n兩人共同在脫口秀節目《The Kyle & Jackie O Show》宣傳時，克里斯又被問及此事，詢\n問他與莎莉合作拍攝兩集電影，是否有所嫌隙？克里斯否認並表示：「不，她很完美，我\n\
  非常幸運能夠跟她合作。」\n\n隨後克里斯又稱莎莉很像男孩子，個性也狂野，完全不像外表那樣嫵媚嬌豔，克里斯還稱\n她的開車技術非常高超。「老實說，她是我合作過最棒的演員之一。」直接表示與莎莉合\n\
  作兩部電影，一點問題也沒有。\n\n\n\n--\n\n                                                   \
  \          \n\n--"
