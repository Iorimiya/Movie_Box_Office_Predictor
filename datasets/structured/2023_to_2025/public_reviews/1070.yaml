url: https://www.ptt.cc/bbs/movie/M.1575984620.A.C3E.html
title: 'Re: [新聞] 金球獎0女導演提名 莎莉賽隆轟：非常荒謬'
content: '仔細看這份導演名單，除了馬丁、昆汀、奉俊昊這三個大種子外，

  還有近期1917大獲好評氣勢衝上來的山姆曼德斯，

  我想這四位應該是牢固住入圍位子了，沒有太大的爭議



  而令人意外的是竟然出現了Todd Phillips的名字


  並不是指小丑本身不好，而是沒想到這次金球特別青睞小丑

  加上事前預測Todd在導演部份的呼聲並不高

  (先前影評大多看好Martin、Quentin、奉俊昊、

  Sam Mandes、Noah Baumbach or Greta Gerwig)


  確實是驚喜的一手




  因此也讓人意外大熱門的婚姻故事Noah以及小婦人Greta這對CP雙雙跌落




  但攤開各項獎項仔細看，這屆金球確實忽視了小婦人

  (影片、女配 Florence Pugh、劇本都沒提)

  所以Greta沒提名似乎也不太意外





  所以會有這樣的性別質疑聲浪其實很正常

  (前一篇提到前年淑女鳥被金錢世界的雷利史考特擠掉，真的讓人滿頭????????)



  加上金球獎上一次有女性導演入圍已經是2014年的逐夢大道了



  只能客觀地猜測這屆金球真的比較厚愛教宗的承繼吧XD   (?)

  小婦人缺的劇情類影片&劇本剛好都提名了



  --'
