  曾經以電影《女魔頭》（Monster）拿下奧斯卡最佳女主角的莎莉賽隆（Charlize Theron

  ），一直以來在電影中強悍的表現都讓人印象深刻，今年他即將度過他的 40 歲生日，

  很難想像在《瘋狂麥斯：憤怒道》（Mad Max: Fury Road）中的強悍獨臂女，竟然也到

  了不惑之年的歲數。在與 GQ 雜誌的訪談中，談到關於自己年紀到了這個歲數，做為

  一個女演員的心路歷程。


  「我們活在一個女性老了就枯萎，但男性越陳越香的社會，長久以來女性都默默承受，

  其實我們在等待的是這個社會結構的改變，但我們現在要把主控權拿回來了。…如果

  我們說女性比起男性在面對年齡增長這件事情比較不用擔心，那一定是在說謊，對我來

  說，似乎有一種不真實的標準在規範一個女性過了40歲應該要是什麼樣子。」


  最近即將上映的《狩獵者：凜冬之戰》（The Huntsman Winter’s War）是前作《公主

  與狩獵者》（Snow White and the Huntsman）的沒有白雪公主版本，也可以算前傳，

  在談薪資的過程中，

  ，並不是要展現他有多大牌，而是他認

  為這完全是好萊塢應該要給與女性電影工作者的尊重。


  其實早在2014年索尼公司被駭客入侵之後，相差懸殊的男女工資比例被揭露時，莎莉就

  極力為女性電影工作者爭取平等工資，包括梅莉史翠普（Meryl Streep）、奧斯卡最佳

  女配角派翠西亞艾奎特（Patricia Arquette）等人，都曾公眾提起這個議題，而對於

  莎莉來說，這不僅僅是同工不同酬的問題。


  「每一個工作都由外型上能夠完全符合條件的人接下，就是這麼簡單，有多少美麗的角

  色是專門給那些天殺的又高又漂亮的模特兒演出？我也曾經經歷過這個階段，當那些有

  深度的角色出現時，那些長得漂亮的人就會先在試鏡的時候被刷掉。」


  其實這個議題包含了非常複雜的產業結構問題，除了主要角色還是以男性角色為大多數

  以外，女性角色過於刻板的現象還是無法被平反，更不要說同工不同酬的問題，這都需

  要時間以及更多有能力、有資源的人幫忙推動，而這也與奧斯卡先前爆出的風波有所

  關連，一個產業的多元性是需要從上到下更多人的努力才能達成，讓我們繼續看這些

  大咖明星如何幫助產業活化吧！


  ------------------------------------------------------------------------------


  參考外電:Variety

  Charlize Theron: ‘Pretty People Get Turned Away First’ for Movie Roles



  心得︰讓我有感慨的是，Chris Hemsworth的身價已經突破千萬美金囉！

  他敢多元接片是值得稱許，但除了雷神他其他電影的票房都表現平平啊..

  這點相信親身參與多次片酬談判，

  近年也繳出普羅米修斯與瘋狂麥斯等票房代表作的賽隆應該更有感觸了


  --'
