title: '[新聞] 莎莉賽隆叫賣《狩獵者》嗆男記者'
content: '新聞網址：



  【封以恩╱新加坡報導】


  奧斯卡影后莎莉賽隆（Charlize Theron）在即將上映的《狩獵者：凜冬之戰》裡扮演

  美豔卻邪惡無比的惡皇后，她昨在新加坡受訪透露，兒子在片場看到她和「冰皇后」

  艾蜜莉布朗(Emily Blunt)特拍對手戲，竟脫口說：「媽咪好嗆！」戲外莎莉也展現

  女皇氣勢，制止大聲搶發問的男記者，堅持女士優先。


  莎莉賽隆、克里斯漢斯沃(Chris Hemsworth)、潔西卡雀絲坦(Jessica Chastain)以及

  《凜冬之戰》導演賽德瑞克尼可拉斯托楊(Cedric Nicolas-Troyan)昨聯袂出席記者會

  ，1名男記者大聲搶著提問，莎莉賽隆展現直爽本性，要他讓女記者先來。後來該名

  男記者問她扮演女強人有何想法，她不以為然地說：「我演戲20多年來，從來沒碰過

  有人拿這類問題問男演員。」



  未婚的莎莉收養了一對非裔兒女，有時會帶小孩上工，4歲的兒子傑克遜(Jackson)看

  她「角色扮演」早已見怪不怪，但她和「冰皇后」的對手戲卻讓他驚呼「好嗆」。她

  女兒奧古斯特(August)才10個月大，但整形在好萊塢有如血拚一般的普遍，她說：「

  有點擔心有一天女兒跟我說想去整形。」


  「雷神」克里斯漢斯沃片中和潔西卡雀絲坦飾演的女戰士是愛侶，兩人拍戲拍出好交情

  ，潔西卡在記者會上套出熱愛潛水的雷神最怕鯊魚。


  漢斯沃在銀幕上總是扮好人，如果有機會演反派，他說希望詮釋有點幽默感的壞人，《

  蝙蝠俠》中的小丑是他心目中的最佳反派之一。


  ------------------------------------------------------------------------------


  心得：先前曾聽說莎莉賽隆與瘋狂麥斯主角湯姆哈迪拍戲時經常吵架，

  看過這則新聞不僅間接證明這八卦的真實程度，也不難看出她的直率與剽悍


  另外，儘管三位演員在異地宣傳新片很辛苦，還是要補充一個不大妙的消息，

  那就是《狩獵者：凜冬之戰》的第一波媒體影評成績並不好，

  爛番茄的分數比近期熱門大片蝙蝠俠對超人還低(2好7壞，22%)，

  值得不少對此片有興趣的影迷持續留意


  --'
