url: https://www.ptt.cc/bbs/movie/M.1594549890.A.C4C.html
title: '[新聞] 莎莉賽隆透露NF正在開發《極凍之城2》'
content: '莎莉賽隆透露NETFLIX正在開發《極凍之城2》




  由莎莉賽隆（Charlize Theron）主演的全新動作電影（The Old Guard）已

  經於7月10號上架NETFLIX ，目前也在爛番茄開出了不錯的成績，為沒有暑假商業大片可

  以看得觀眾解悶．而後續續集、系列發展的討論聲音也隨著本片世界觀的架構，出現討論

  的聲音，但有趣的事，莎莉賽隆在接受TOTAL FILM訪問時，先透露了另一部他主演的動作

  電影續作，有可能會在NETFLIX發生：



  「我們把（極凍之城2）拿去給NETFLIX，然後史考特史坦柏（Scott Stuber，NETFIX原創

  電影負責人）感到非常有興趣，我們廣泛的討論續作的可能性，目前我們正處於撰寫劇本

  的階段。在續作，主角被設定要有更多先前沒有透露出的性格，因此有很多可能性在其中

  ，門檻不低，但對此我們依舊感到很興奮。」



  然而早在去年8月，《極凍之城》的導演大衛雷奇（David Leitch）就表示有串流平台對

  這個故事的續作有興趣，並且可能會由雷奇的太太凱莉麥考密克（Kelly McCormick）擔

  任製片，因此他回歸繼續執導的可能性相當高。大衛雷奇前陣子剛剛宣布，而他本人手上也有另一個與NETFLIX合作、（The Division）。





  各位已經看過《不死軍團》了嗎？喜歡之前的《極凍之城》嗎？


  --'
