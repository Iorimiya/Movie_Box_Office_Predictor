title: '[新聞] 莎莉賽隆：尚未確認回歸《瘋狂麥斯》續集'
content: '新聞網址：



  撰文 / Canny Yen


  《瘋狂麥斯：憤怒道》（Mad Max: Fury Road）導演喬治米勒（George Miller），花了

  不少功夫宣傳拍攝續集的計劃，甚至更進一步宣布續集片名暫定為《瘋狂麥斯：荒蕪大

  地》（暫譯，Mad Max: The Wasteland）。主演湯姆哈迪（Tom Hardy）也向外界透露已

  簽下三部片約，但深受觀眾喜愛的莎莉賽隆（Charlize Theron）是否出演仍是未知數，

  加上拍攝過程異常艱辛，可能也會降低她投入續集的意願。且米勒若想要芙莉歐莎（

  Furiosa）指揮官霸氣回歸，他勢必要親自和完全不知情的賽隆解釋一下目前情況。


  「荒地（Wasteland）到底是什麼？我完全不曉得，我從來沒聽說過類似的東西。」賽隆

  接受 USA Today 訪問，被問到是否簽約演出續集時表示。


  但觀眾更關心的還是：到底會不會有續集？《瘋狂麥斯：憤怒道》橫掃全球票房，進帳

  直逼3億7000萬美元，但電影公司還是得衡量收支情況再做打算。雖然大家都很愛《瘋

  狂麥斯：憤怒道》驚人炫目的飛車追逐和極富隱喻的劇情內容，但能否拍攝續集，不只

  牽涉人氣高低與否，最終還是得看片商臉色。且華納兄弟電影公司（Warner Bros.）或

  許會觀察 DVD、BD 等家庭影音的收益，來評估並做最後決定，影迷們只能耐心等待。


  上述考量可能是導致還沒有人邀請賽隆出演續集的原因，但觀眾也別擔心，以角色而言，

  賽隆飾演的芙莉歐莎雖是全新角色，不像哈迪飾演系列同名主角麥斯，但以她受觀眾喜愛

  的程度，續演機會勢必大幅增加。不過，距離我們能看見麥斯再度狂踩油門催落去，還有

  很漫長的一段路要走。


  ------------------------------------------------------------------------------


  參考外電：The Playlist

  Charlize Theron Says She Isn''t Signed For ''Mad Max: Fury Road'' Sequel ''Mad

  Max: The Wasteland''



  心得：新聞中是有提及「拍攝過程異常艱辛」影響了莎莉重返瘋狂麥斯的意願，

  事實上這個因素，也包括拍攝後期賽隆與男主角湯姆哈迪溝通不順暢。


  雖然這個心結在瘋狂麥斯票房獲得成功後，有一定的被平息，

  但每天都要在大熱天拍外景戲，也的確不是每個人都願意時常經歷的拍片環境吧！


  --'
