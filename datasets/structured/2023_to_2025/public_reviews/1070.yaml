url: https://www.ptt.cc/bbs/movie/M.1727026120.A.CAE.html
title: '[好雷] 清新可愛的『莎莉』 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~











  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  最近因為回到台中鄉下外婆家，才重新想起莎莉

  這部片清新可愛，可惜聲量不高。


  開頭莎莉在鄉下養雞的幾段演出

  雖然清淡，但在大銀幕前卻覺得自然有味

  我認為這是演員也有吃進角色的結果否,則這段呈現背景的戲會感覺無聊


  片尾婚禮也非常讓人感動，小泛淚


  整部片最可惜的是老演員

  姑姑的角色好像不是找楊麗音就會是林美秀

  而只要是她們二個演出，就會給觀眾固定的印象

  不再覺得女人在婚姻市場上受到壓迫

  (因為她們出現就是喜劇定調了，什麼事都可大可小化掉)


  團員中李烈扮演給人生忠告的團員，可惜太功能性，讓人有點出戲

  其他年輕一代的角色互動都十分自然好看



  這部片票房不高真的可惜了

  這是一部充滿誠意的製作、溫馨可愛的電影



  --'
