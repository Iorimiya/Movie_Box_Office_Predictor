title: '[討論] 莎莉賽隆'
content: '莎莉賽隆


  首次看她是在The Devil''s Advocate裡 莎莉賽隆全裸演出

  直覺這個女演員好美 全裸那幕印象非常深


  讓莎莉賽隆得奧斯卡女主角的女魔頭 因為題材不是很喜歡

  總是沒看完


  直到最近瘋狂麥斯 原來看電影是要看湯姆哈迪

  但是莎莉賽隆表現太搶眼了 讓人忍不住一直注意她

  覺得莎莉賽隆在瘋狂麥斯和湯姆哈迪並駕齊驅 雙主角


  她的演技太耀眼奪目


  請問有沒有人喜歡莎莉賽隆 能分析一下她的演技好在哪? 最欣賞她的哪一部演出呢


