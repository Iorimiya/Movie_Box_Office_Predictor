url: https://www.ptt.cc/bbs/movie/M.1431708526.A.F5E.html
title: 'Re: [新聞]《瘋狂麥斯》坎城首映 莎莉賽隆談悍將角色'
content: '先聲明 我是莎莉賽隆腦殘粉，所以可能未必客觀









  ===========================防雷分隔線=====================================















  Max這片我等很久了，從知道她剃了平頭去拍這部，到留出短髮走奧斯卡紅毯

  天啊都多久了~~~總算到現在才看到這部的真面目，不過等待真的是值得的!!


  不得不說莎莉真的是極品，有這樣的美貌何需演技?有此等演技又何需美貌?

  偏偏她2者皆具

  問題是在這爽度滿點的動作片裡她還是能告訴觀眾"老娘就是會演戲"

  一開始是堅毅 冷酷的語氣眼神，然後開始跟Max有了患難與共的交流

  跟Max說自己幫助名模種母團出走綠洲是為了救贖的哀痛

  一直到發現綠洲沒了，她卸下機械手臂，蹣跚地走在沙漠裡

  最後無助跪下悲慟又絕望地大喊~~真的不愧是影后

  雖然有一點點小灑狗血，可是她拿捏的尺度很好不會讓你覺得很刻意在狗血

  然後回程時因為傷勢太重氣胸發出怪聲，那是她自己發的聲音吧？！

  雖然我沒真的聽過氣胸的聲音但那個聲音一聽就讓我覺得好可怕她快GG了

  如果真的就那樣那她好會模仿 如果不是那樣我還是要說那個聲音好能帶領情緒




  其次就是  為什麼一個那麼美艷的女人可以那麼帥啊啊啊啊!!!!!

  俐落的身手  端槍瞄準開槍的架式  還有裝上機械手臂時有型到爆

  (斷臂時又真的好像 那種左臂控制力不佳顯得僵硬的感覺演得好神)

  雖然背影真的壯碩了點但還是帥到不行

  且平頭黑臉沒甚麼妝還是正正正!!

  另外其實她本身的髮色不是金色  而是片中那種比較偏棕一點的髮色



  我是一直覺得很哀怨她這種極品為什麼在好萊塢總是沒上到頂級那層

  明明她能演的戲路很廣啊~~

  要脫敢脫  要打能打 要演能演 要當花瓶能當花瓶 她耍白癡搞笑其實也還蠻猛的

  公主與狩獵者那種糞作也可以演到大家都說她超讚

  (然後這是少數開拍第2集 第1集明明領便當也能回鍋演出的案例)

  還好她早已有了影后肯定

  倒是希望她能再拍點商業大片鞏固一下自己的片酬和地位

  然後高興的時候再拍點獨立製作保持演技不生鏽

  6/18有她監制並主演的新片暗處會上映

  演員陣容其實蠻強的 尼可拉斯霍特 克蘿伊摩蕾茲都有演

  是控制小說原作者的另一部作品  應該會不錯看吧~


  --'
