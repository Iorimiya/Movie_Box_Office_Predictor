title: '[新聞] 莎莉賽隆:男導要我在片中打扮得讓人更想上'
content: '新聞網址：


  原標題：



  Yahoo奇摩電影戲劇編輯部

  2022年09月27日



  【文／血紅蘭姆】儘管如今貴為奧斯卡影后，莎莉賽隆在生涯早期仍然有時候不得不忍氣

  吞聲。



  先後以《女魔頭》、《北國性騷擾》、《重磅腥聞》三度入圍奧斯卡最佳女主角，並以前

  者順利封后，莎莉賽隆不僅演技早已備受肯定，近年來更轉型為動作女星，一連演出《極

  凍之城》、《玩命關頭》系列電影、《不死軍團》，接下來還將參戰漫威銀幕宇宙。



  但即便目前已晉升為好萊塢一線女星，莎莉賽隆在剛出道時也常常陷入有苦難言的處境。

  她向哈潑時尚解釋道：「完全無法掌控自己要穿什麼衣服，這件事曾困擾我很多年。有些

  傢伙會叫你幾乎在人們面前試裝，這真的很貶低人。」



  「當我剛出道時，沒有人會去談這種事。他們說：『這就是妳要穿的衣服。』我還特別記

  得一部電影，




  在親身經歷過這一類困境之後，莎莉賽隆如今也試圖去扭轉好萊塢的種種歪風。莎莉賽隆

  透露




  「我體內有一種自然而然的鬥志，想去打造出自己在三十年前剛出道時所渴望擁有的那種

  環境。我並非每件事都能做得很周全，但我總是會記得去放眼大局，並說：『我們真的交

  出最好的表現了嗎？』」



  除了在攝影機前大展拳腳之外，莎莉賽隆近年來也積極轉往幕後發展，多半都會在自己演

  出的電影中身兼製片一職。「我覺得自己已經來到了一個階段，可以坦然接受事情的現狀

  。就算接再多工作，也不會改變自己的名氣。」



  「我這一路走來始終不上不下，從來就不曾達到金卡戴珊的等級，一直都是如此。以前人

  們會說，你必須得到一定的名氣，才有辦法拍出自己真正想拍的作品。但我現在整天都在

  提案，人們卻說：『不了，謝謝。』」



  「我猜名氣現在已經不值錢了。但這樣也很好，因為你會去拍一部作品，是考慮到它究竟

  有多麼出色，而不是『喔，你很有名，而我們想跟你的名氣一起合作。』」莎莉賽隆新片

  《善惡魔法學院》將於2022年10月19日在Netflix上線。



  --'
