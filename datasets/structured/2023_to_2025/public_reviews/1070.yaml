url: https://www.ptt.cc/bbs/movie/M.1625323071.A.5DD.html
title: '[新聞] 「玩命關頭」又有新外傳 莎莉賽隆「賽芙」將啟動'
content: "「玩命關頭」又有新外傳 莎莉賽隆「賽芙」將啟動\n\n\n莎莉賽隆在「玩命關頭8」、「玩命關頭9」飾演反派賽芙。圖／摘自推特\n\n2021-07-03\
  \ 21:00  聯合報 記者陳建嘉／即時報導\n\n全球熱賣系列強片「玩命關頭」，今年推出「玩命關頭9」，雖然要等到7月底才能在台上\n映，但已在全球斬獲亮麗票房，擔綱系列男主角、製片的馮迪索，先前已表態「玩命關頭\n\
  11」是完結篇，卻也表示該片會拍攝外傳，下一部外傳就是片中大反派之一「賽芙」。\n\n馮迪索向美媒「綜藝報」透露，下一部外傳電影將會是「賽芙」，可能會在明年開始製作\n\
  ，「賽芙」由莎莉賽隆主演，曾任「玩命關頭8」反派，也在「玩命關頭9」有精彩演出，\n個性狡猾聰明，是一等一的電腦駭客，手下也有許多菁英反派，外加賽芙也擅長飆車，這\n\
  個角色背後會有什麼故事，勢必讓外界相當關注。\n\n此外，莎莉賽隆也證實Netflix的熱映電影「不死軍團」會推出續集，不過「不死軍團2」\n最快可能在明年開拍，「玩命關頭」系列外傳「賽芙」目前還沒確切製作時程。\n\
  \n\n「玩命關頭9」將於7月在台上映。圖／摘自推特\n\n--\n、。帝釋所問經講記77頁拆穿佛法的。\n是 是菩薩成佛之道\n、、、、()、、是佛經。\n\
  \  是佛          是菩薩\n\n和破十方諸佛\n\n--"
