content: '雷 (全劇透)






  劉品言住在台中東勢種田養雞維生

  弟弟林柏宏早上在菜市場賣雞肉

  有個姊姊死了留下一個女兒

  女兒跟爸爸蔣偉文住上海


  女兒因爸爸跟上海女人再婚

  在上海住不慣就回台中東勢念高中

  跟劉品言、林柏宏一起住


  林柏宏要結婚了

  婚後要跟老婆去台北開台菜餐廳

  女兒在台灣沒爸媽管自由自在

  抽菸、早熟、玩交友軟體


  還教40多歲的姑姑劉品言一起玩

  劉管不了小姪女就跟她一起玩

  用莎莉當網名來找戀愛的對象

  結果認識一個法國大帥哥畫家

  馬上熱戀深陷其中無法自拔


  玩到後來法國帥哥跟劉要錢買房

  劉就領了三十萬要去法國找帥哥

  但跟團到了法國帥哥就音訊全無


  跟團碰到一位常來法國的貴婦李烈

  教劉怎麼在巴黎租日租套房

  然後去找畫室發現地址是假的

  發現果然被騙了就傷心地回租屋處


  一回去房東正在開派對

  派對結束後認識一堆法國朋友

  房東跟法國朋友問她怎麼會來法國 ?

  他說被網路愛情騙子騙來法國


  法國朋友說她去過這個畫廊

  就給劉正確的地址

  她找過去後，看到了網戀的畫家

  畫家跟她解釋他畫室照片被盜用

  騙子用他跟他畫室的照片到處騙錢


  警察找到他後

  把騙子所有的帳號全都停掉

  所以來法國他才會音訊全無

  劉跟夢中情人照了張像傳回台灣

  讓台灣的親友知道他在法國沒事


  後來一個人在法國放空

  主要是他鄉下的雞舍被颱風吹垮了

  他的雞死了一堆所以想出國散散心

  反正法國免簽證能住3個月

  他就一個人享受住在歐洲的時光


  在小酒館又在交友軟體碰到一個法國人

  馬上約出來喝酒聊天，然後一夜情豔遇

  一夜情後早上起來問法國人願意結婚嗎

  法國人說好，但導遊說別相信法國男人的嘴


  劉聽到帥哥說願意娶她又突然不想結婚了

  他想到台灣還有很多牽掛放不下

  他還有弟弟、跟喪母的姪女要顧

  結了婚台灣的關係可能都會瞬間切斷


  所以在巴黎一夜情爽玩了就開心回台中了

  回台中準備參加弟弟的婚禮當主婚人

  劉就像弟弟跟姪女的義母一樣


  但回台中後，劉又會變成一個人

  因為弟弟要去台北開餐廳

  而姪女的爸爸要帶女兒回上海念大學

  然後只有雞舍唯一的白公雞陪她


  片子一開始白公雞就跟劉相依為命

  她的雞舍就那一隻公雞，其他母雞能殺

  就那隻公雞不能殺，因為一堆母雞

  要靠這隻唯一的公雞才能生小雞

  沒公雞就只能生無法孵化的雞蛋

  就只能賣雞蛋當蛋農而已


  然後就草草結束了....


  我還以為她會懷孕，但還沒演到

  如果有續集應該會演到她懷孕吧

  然後男主角應該會從法國嫁來台灣

  然後每天跟夢多和杜力上【二分之一強】


  覺得她一個人在鄉下養一個混血兒蠻好的

  村民也有一個男的青農小農很喜歡她

  應該也會幫她照顧這個混血兒吧

  但我覺得法國人一定會為愛為子來台灣


  但願導演能有錢繼續拍續集

  或許劉可以找大監製林心如投資拍續集

  因為姪女在戲裡的名子就叫林心茹


  很棒的片，很棒的導演，再接再厲。

  但願這片在中國的票房能超越周處

  有雞、有手機詐騙、有農村、有愛情

  每個題材都是中國大賣的元素之一

  大賣之後才能把電影當影集拍一輩子。









  --'
