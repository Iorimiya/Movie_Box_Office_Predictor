url: https://www.ptt.cc/bbs/movie/M.1595307350.A.3DD.html
title: '[普雷] 不死軍團：因為拍成影集的話請不起莎莉'
content: '雷文防雷資訊頁





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  通常長生不死題材都不脫兩個方向：超級能力或存在主義。

  要嘛討論他因為不怕死而能多做到什麼事，

  拍成超級英雄故事；

  要嘛討論當人失去死亡必然性帶來的成就動機後，

  人生會變成怎樣，

  也是軟科幻的一條傳統路線。


  從開頭莎莉賽隆的牢騷來看，

  這部片是有想要拍成後一種方向的，

  但是4+1個不死人並沒有怎麼表現出來。


  首先是主角莎莉賽隆，

  人最老、又是劇情中心所在，

  照理說應該是最能顯現「過去幾千年未來幾千年都沒有意義」的角色，

  然而關於他自己的經歷、感受秀出來的劇情太少，

  感覺是為了留到續集再揭露，

  也就讓觀眾對他的角色難以進入。

  順便說下放棄瓊這事，

  對大海撈針是很難，

  你只是不死又不是超人，

  但還是很......

  花個兩三百年存錢開一間海底探勘公司之類的不是很難想像吧？

  一邊感嘆生命沒有盡頭做好事沒有意義，

  一邊放著這麼大一個私人目標不做？

  我相信他一定有好理由啦，

  運氣好的話第二集可以知道吧。


  然後說到「做好事」，

  那面功績牆真的扯，

  既然隔了兩三代都算間接成就偉人，

  CIA阿宅如果有心，

  肯定也能找到他幾代之前救了希特勒曾爺爺一命啊，

  而且只有這種程度就夠的話，

  莎莉賽隆自己救完人記個通訊錄，

  隔幾百年翻出來看看自我充電不就行了，

  要你CIA幹嘛？


  再來說菜鳥，

  本來這角色應該是作為對照組的，

  就像他自己說的「還要好幾年才會意識到（不死）這件事」，

  來對應四人組已經失去的意義感。

  然而四人組自己的無意義感就已經不明顯了，

  於是菜鳥單純就只是多了一個不死buff的海陸悍將，

  算是走了超級英雄路線吧......但打戲又是莎莉賽隆更爽阿。


  十字軍小情侶的部分，

  首先真的無法相信這是那種「阿就這麼巧怎麼樣」的設定，

  但大概又要放到續集吧！

  四人組中最缺乏無意義感的，

  畢竟真愛無敵嘛，

  不過我沒辦法被這樣說服就是了。

  驚喜點在於綁架時沒把他們拆開，

  很好運都不用受到考驗欸，

  但真的有甜......唉我對長壽屬性的CP完全沒抵抗力。


  最後是背骨仔，

  本片唯一的存在主義擔當，

  跟菜鳥談心那段甚至有點《這個男人來自地球》的影子，

  所以背骨動機很有說服力，

  最後被放逐也感覺真的有痛到，

  誰教我們的反派屁孩太小物臭了，

  抱錯腿一樣沒救。


  簡單說，

  這片有要拍的又有哲學深度又有視覺爽度的企圖，

  但拍出來五千歲跟五十歲沒有差太多。

  看完之後覺得，

  乾脆拍成影集，

  每集出個任務當超英片也不錯吧，

  但這樣大概就請不起莎莉賽隆來拍了，

  我就是因為莎莉賽隆太香才看完這片的啊啊啊。


  --'
