url: https://www.ptt.cc/bbs/movie/M.1492011921.A.C04.html
title: '[普雷] 玩命關頭8 為了莎莉賽隆才去看'
content: '防雷頁

  不過其實也沒打算講多少劇情啦。





















  本系列算是從第3集起死回生。


  第1集可說是犯罪界小屁孩的生活紀錄，


  第2集就看女主角的身材跟黑人超強嘴砲，


  第3集才讓人真的感受到飆車的刺激。


  後續的4、5集真的是越拍越好看，


  雖然整體的氣氛跟前3集越差越遠。




  後來又出了讓人失望的6、7集。


  要不是沒有阿湯哥，


  差點都以為自己在看不可能的任務系列了。


  君不見每在任務會議時，


  Roman一定會說這根本是不可能的任務。




  第7集真的太讓我失望，原本不打算再看第8集。


  沒想到莎莉賽隆加入FF8，


  衝著Furiosa，還是乖乖掏錢上電影院。


  本集若以獨立作品來看，


  劇情中規中矩不算太差。


  在節奏上拿捏得當，


  全片沒有令人感到冷場或無聊的場景。


  但是它是一部系列作，


  導致劇情的安排有太多不合理的地方。


  我是不知道有多少人可以接受Elena被抓走沒人發現，


  何況她在第7集裡，是Hobbs的部下，


  身為高級探員，沒人發現她被綁架真的不合理。


  再來，她懷孕的設定整個搭不上前一集的時間線，


  幾乎吃書吃光光。




  開頭的賽車也是極度不合理。


  引擎冒火表示氣缸進不了氣，


  哪有可能越燒越快，最後還來個爆炸前噴射。


  簡直把車子當太空梭在開。




  Dom與Deckard在上集打得死去活來，


  這集什麼都沒做，輕鬆洗白，


  真是太令人受不了了。




  最後，我一直認為，就算換人演，這集也必須讓Brian出場。


  其他人不找他，他也不可能袖手旁觀。


  前幾集塑造出的Brian形象，


  知道Dom遇到麻煩，不可能什麼都不做的，


  就這樣把Brian這角色從系列作拿掉，


  實在太不合理。




  總結，單純作為一部動作片，真的是精彩好看，


  雖然再也看不到Paul Walker演Brian了，


  但作為系列作，我實在沒辦法給好雷，


  劇情與前幾集脫勾太多，


  然而莎莉賽隆帶給這部電影全新的生命，


  我想，下一集還是會乖乖買票進場看莎莉賽隆。





  --


  --'
