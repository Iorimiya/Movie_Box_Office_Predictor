title: '[新聞] 悲慘童年經歷 成就莎莉賽隆新角色'
content: '新聞網址：


  好萊塢女星莎莉賽隆除了演技受到肯定外，渾身散發的霸氣也讓她成為許多時尚品牌的寵

  兒，不管是大小時尚活動或是代言廣告，都能常常見到她的身影。不過，你知道這樣一位

  自信美麗的女星，其實有著悲慘的童年經歷嗎？近日，忙著宣傳新電影《黑暗之地》的她

  在接受國外媒體訪問時，談到了她在戲中的角色，並分享了這個角色和她的童年經歷有怎

  樣的關聯。


  「在我15歲時，我的父親因為對我媽家暴而遭到我媽防衛性的射殺，這是我人生中很大的

  創傷。而某方面來說，這樣的人生重大事件也造就了今天的我。在這次的新片中，我的角

  色設定為在她8歲時經歷了重大悲劇，片中探討這樣的悲劇對一個孩子會造成怎樣的影響

  ，當她在敘述這樣的經歷時，又有怎樣的感受...而這一塊，碰巧就是我能百分之百感同

  身受的部分，因為我在真實人生中確實有著類似的遭遇。只不過電影中談的是一宗謀殺案

  ，而我經歷的是意外事件。」莎莉賽隆說。


  其實這不是莎莉賽隆第一次談到她的悲慘回憶，早在04年她就曾表示，「我花了很多時間

  去接受這樣的悲劇，因為在此之前，我和每個人一樣，都認為這樣的事不會發生在自己身

  上。這是我人生中不可抹去的一部份，但它也沒有毀了我的人生。」


  《黑暗之地》改編自吉莉安弗琳同名小說，由法國導演吉爾斯帕奎布萊納編導，除了莎莉

  賽隆外，本片還網羅青春女星 Chloe Moretz及帥氣男星尼可拉斯霍特。


  --'
