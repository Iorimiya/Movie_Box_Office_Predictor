url: https://www.ptt.cc/bbs/movie/M.1580136782.A.88D.html
title: 'Re: [新聞] 被要求演「女超人」的媽 莎莉賽隆揭殘忍'
content: '莎莉提到這件被性騷擾的事,很明顯是去年5月上這節目提到的：




  問題在於,在影片裡,是說「製片」,不是說「導演」。


  順便說一下,妮可基曼只差水行俠的男主角12歲。


  而且安潔莉納裘莉也演過柯林法洛的媽媽,但是她只大柯林法洛一歲。


  史恩康納萊也演過哈里遜福特的老爸,但是他們只差12歲。



  --

  莎莉也演過媽媽啊：Tully,Hancock,跟強尼戴普合演的那片。

  問題在於,你看那些文字報導,完全是引用這影片的訪問,


  逐字逐句,但是在影片裡,她明明就是說製片。

  1. 憑妮可的地位,她有意見還要那麼委屈的接喔？你是以為她缺錢還怎樣？


  你知道他老公開Bugatti嗎？


  而且妮可還被CG減齡,更沒尊嚴,因為這樣就等於說：妳看起來太老了。


  2. 沒問題,只是讓人覺得很不專業。

  問題是她挑戲演的理由很虛,


  威爾史密斯拒絕昆丁的決殺令,原因是：「飾演的不是主角,而是配角。」


  結果這新聞一爆出來,招來嘲笑。


  結果莎莉只是因為「說她老」而不想演。


  而且就像很多人指出的,她飾演的是神,不會老的。

  你發文之前不會先看文章嗎？很多人都講了,她是演神。

  演員有權不演,但觀眾也有權評論他們的理由。


  就像我講的,威爾史密斯的理由很虛,所以當初才會招來嘲諷。

  我知道你想說什麼,但是也舉例好一點的。


  急凍可是在神力之後上映的。而且莎莉主演的片,賣得也很少,


  有些賣得好的,主演是不是她也很難說,像瘋狂麥斯跟全民超人。

  哇～隨便都可以？那我問一下,Bombshell現在的票房,是妮可帶壞的,還是莎莉撐起來的？

  我有說她沒資格提出嗎？

  問題是,阿湯哥的行為大家都知道是特例,你能舉出第二個例子嗎？


  但是這種年齡差距很小,卻飾演父母在演藝圈很正常。


  你可以搜尋hollywood age differences parent children。


  史恩康納萊也演過哈里遜福特的父親,而他們也只差12歲。


  我給你一個更殘酷的例子,Danny DeVito客串六人行,飾演一個搞笑的脫衣舞男,


  因為製片覺得他很胖很矮,所以會很好笑。


  威廉達佛因為長得很邪惡,所以被選為綠惡魔。


  這種選角在演藝圈本來就很正常,你能想像演員整天說「這角色是在歧視我的外表。」


  憑什麼對別人的選擇指手畫腳？


  當年威爾史密斯拒絕決殺令,是嫌戲份不夠多,結果網路一片嘲笑,


  他竟然因為這種理由拒絕昆丁塔倫提諾。


  當年強尼戴普被爆出不想背劇本,所以戴耳機聽對白,也招來一片嘲笑。


  當年大家嘲笑他們的時候,


  你有好奇的問：「你們大家有什麼資格對人指手畫腳？」'
