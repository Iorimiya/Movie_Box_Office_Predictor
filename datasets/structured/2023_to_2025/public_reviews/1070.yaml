url: https://www.ptt.cc/bbs/movie/M.1589559869.A.2D6.html
title: '[新聞] 莎莉賽隆、哈迪還原《瘋狂麥斯》不合真相'
content: '莎莉賽隆、湯姆哈迪還原拍攝《瘋狂麥斯：憤怒道》時傳不合的真相




  由喬治米勒（George Miller）親自回歸執導的全新重啟《瘋狂麥斯：憤怒道》（Mad Max

  :Fury Road）絕對可以說是近年來最精彩的動作電影之一，但此片的幕後故事也一樣「

  精彩」，除了經歷艱困的拍攝過程以及嚴峻的拍攝環境外，演員的心理狀態也因此受到影

  響，更加深了彼此之間的摩擦，期間就不時傳出兩位主演：湯姆哈迪（Tom Hardy）與莎

  莉賽隆（Charlize Theron）不合，不過兩人日前也透過紐約時報的專題還原了當時的心

  境與真相。




  表示，驅使整個製作過程前進的最大動能其實是，「我非常的害怕，因為我

  從來沒有拍過像這樣子的電影。

  這些年輕女孩們都

  把我視為可以幫她們解決問題的那個人，這並不是任何人的錯，而我現在會這麼說是因為

  ，我認識喬治，我也跟喬治一起經歷了這些，所以我完全地相信他。但」


  註：不知道她指的過去結果一團糟是哪部？


  也解釋，拍攝過程真的相當艱辛，「我們每到一個新的拍攝環境，就要處理非常

  多的細節，但能掌握的又非常少，還有每一個鏡頭的拍攝時間也都非常快速，因為需要這

  些細小瑣碎的片段才能完成最終的剪輯，我們前進的速度很快，有時候是讓人有點不知所

  措的，我們必須要相信唯有團結才一起才能完成更大的願景。」


  而

  ，對此，在《瘋狂麥斯：憤怒道》飾演「種母」之一的柔伊克

  拉維茲（Zoe Kravitz）表示，兩人都曾在片場中表現出沮喪、憤怒的情緒，尤其是湯姆

  哈迪表現得更加明顯，當然這是讓人不樂見的情況，但也不能怪他們，因為他們都被要求

  做很多事情，更有很多事情是得不到答案的。


  不過在事隔多年之後，

  ，但兩人卻沒有適當的互相溝通，「現在想起來，



  不過就某種不可思議的方式來說，我

  們表現得就好像我們的角色一樣，一切都是為了生存下去。」



  對於莎莉賽隆這樣的說法，湯姆哈迪也表示認同，「事後看來，我在很多時候都是處於超

  出能力範圍的情況下，有時我們兩人所承受的壓力是難以忍受的。她所需要的是一個更好

  或是更有經驗的夥伴，這是無法偽裝的。我想，

  」




  --'
