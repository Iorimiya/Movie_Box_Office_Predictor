title: '[新聞] 「莎莉」金馬放映，劉品言笑稱對戲的雞有'
content: '新聞網址：


  「莎莉」金馬放映 劉品言笑稱對戲的雞有靈性


  2023/11/11 17:19（11/11 17:31 更新）


  （中央社記者王心妤台北11日電）電影「莎莉」今天在金馬影展放映。劉品言笑稱片中的

  雞都有靈性，工作人員甚至進到雞舍時會覺得雞在打招呼，或是抱怨劇組太早來拍；林柏

  宏則是主動要求全部台詞都使用台語。


  「莎莉」導演練建宏今天跟演員林柏宏、劉品言、李英宏及湯詠絮出席並分享花絮。此片

  日前已經在釜山影展放映，練建宏表示，能把作品帶回台灣跟金馬影展觀眾分享是一件開

  心的事。


  劉品言片中因交友軟體認識法國帥哥，並為愛飛出國。劉品言笑說，現實中也曾用別人的

  照片使用過交友軟體。近日有網友自稱是「紅樹林柏宏」並在交友軟體使用林柏宏的照片

  ，被問到這名網友跟他像不像，林柏宏笑而不語。


  知名錄音師湯湘竹的女兒湯詠絮跟劉品言有多場對手戲，她表示，中間有當回學生2個月

  準備考學測，但只要化好妝，就能重新找回演戲的感覺。


  片中需要跟雞演出，導演練建宏笑說，要拍動物是件困難的事，經過「莎莉」後暫時不會

  想拍跟動物有關的戲。劉品言也分享事前有到雞舍學習所有的工作，有時帶著會反光的物

  品，還會被雞啄。（編輯：李亨山）1121111


  --'
