url: https://www.ptt.cc/bbs/movie/M.1712548782.A.A67.html
title: '[好雷]莎莉-在地的故事訴說相同的主題 '
content: '雷文防雷資訊頁









  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~












  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  莎莉給我感覺是講述勇敢追夢找尋自我


  同樣這種跳出舒適圈類型電影也有白日夢冒險王跟享受吧！一個人的旅行


  但片中自然樸實的台灣農村日常


  給台灣人有更強的帶入感  女主角可以看出從小父母離世扛起養家責任


  同時親戚跟家人給的支持讓女主生活無虞並能幫忙照顧侄女


  但就是相對純樸單調的生活讓女主開始沉迷網路交友並無法自拔


  片中也用鄉村各種傳統習俗讓女主無法安於單身現狀


  譬如虎姑婆暗指單身老處女 養雞戶暗喻老母雞


  相反新世代的姪女不煩惱家庭事業 速食戀愛


  反而像個小大人般開導交友軟體萌新的女主


  但人生第一次被異國戀和新未來迷惑的女主怎麼聽得進勸呢


  開始學習英文 買畫 研究出國


  並反抗家庭跟自己的責任 第一次做自己所愛


  到了法國脫團後看似得到自己想要的生活跟快樂


  但最後才了解到自己真正想要的是什麼


  巴黎的鐵塔就是台電的高壓電塔


  家裡的小公雞才是不會離開的馬丁


  真正的愛情是先從愛自己開始


  雖然莎莉沒有曲折的劇情  但也是說了一個好故事的輕鬆小品





  --'
