  妮可。\n\n莎莉則是在上映中的「厭世媽咪日記」裡面飾演被子女和家事壓到喘不過氣的媽媽，為了\n扮演孕婦，美豔的莎莉特地增胖變腫，讓造型更有說服力。莎莉生動詮釋媽媽獨力承擔家\n\
