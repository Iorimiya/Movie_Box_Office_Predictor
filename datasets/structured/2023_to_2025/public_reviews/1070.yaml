title: '[新聞] 漫威迷認為莎莉賽隆才該演「驚奇隊長」'
content: '就是看不順眼？漫威迷認為莎莉賽隆才該演「驚奇隊長」




  ▲部分漫威迷認為莎莉賽隆才是飾演「驚奇隊長」最佳人選，還模擬出她的造型。圖／摘

  自twitter



  雖然《驚奇隊長》已經上片超過一年、儘管片子在全球各地累積票房突破10億美元，還是

  有部分漫威迷強烈抗拒該片女主角布麗拉森，認為另一位奧斯卡影后莎莉賽隆才是最佳人

  選，更到處




  布麗拉森扮演的驚奇隊長，據稱將是，只是她以女性主義

  者自居又勇於為此發聲的作風，惹怒不少男性，這之中有些人正是漫威迷，因此對她的冷

  嘲熱諷、各種打擊從不間斷，試圖影響一手主導漫威新片走向的凱文費吉，無奈吵到現在

  ，凱文依舊沒有要把布麗換掉的意思，籌拍中的續集仍預定由她主演。




  在DC漫畫與漫威的超級英雄電影大戰中，漫威目前幾乎在票房或口碑上都沒有吃過敗仗，

  但像《驚奇隊長》這樣賣座開出大紅盤卻有一批大聲抗議要求換女主角的酸民，確實相當

  罕見。只是歐美媒體分析，




  ▲布麗拉森遭到少部分漫威迷的持續攻擊，相當無辜。圖／摘自Instagram






  《驚奇隊長2》定檔在2022年7月8日上映。


  --

  現在還沒有《復仇者聯盟5》


  《黑寡婦》2020年11月


  《永恆族》2021年2月12日

  《上氣》2021年5月7日

  《蜘蛛人3》2021年12月17日


  《雷神索爾4》2022年2月11日

  《奇異博士2》2022年3月25日

  《黑豹2》2022年5月6日

  《驚奇隊長2》2022年7月8日'
