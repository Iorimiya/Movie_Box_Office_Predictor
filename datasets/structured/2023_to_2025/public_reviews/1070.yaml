title: '[新聞] 大量裸露性暗示 莎莉賽隆不知淫穢細節'
content: '大量裸露、性暗示 莎莉賽隆不知「淫穢」細節解僱經紀




  伊莉莎白柏克莉。圖／車庫提供


  2022-06-08 00:44聯合報 記者黃保慧／即時報導


  名導保羅范赫文（Paul Verhoeven）經典之作「美國舞孃」（英文片名：Showgirls）由

  伊莉莎白柏克莉（Elizabeth Berkley）主演，故事描述一名年輕女孩到拉斯維加斯追求

  成為舞者的夢想，結果卻意外踏入燈紅酒綠的舞孃世界，因為大量裸露場面和性暗示，本

  片是美國影史第一部「NC-17級」（17歲以下禁止觀賞）的電影，當年上映時，發行商還

  派出數百名工作人員到北美各電影院，以確保不會有17歲以下的觀眾進場觀賞。


  「」大獲成功之後，保羅范赫文決定拍攝他夢想中以拉斯維加斯為背景的音

  樂劇，但是在進行田野調查後，他發現自己對正統的歌舞表演不感興趣，反而更關心底層

  的脫衣舞孃，因此才有「美國舞孃」這部片的誕生。


  為了拍這部片，保羅范赫文和編劇採訪了超過200名拉斯維加斯的脫衣舞孃，並將他們的

  台詞融入劇本，讓對話盡可能貼近真實。


  茱兒芭莉摩（Drew Barrymore）、安潔莉娜裘莉（Angelina Jolie）、莎莉賽隆（Charli

  ze Theron）等知名女星都曾經參與本片女主角「諾咪」的徵選，其中茱兒芭莉摩獲得製

  片大力推薦，但因為有太多裸露戲而婉拒了。


  莎莉賽隆在試鏡時表現出色，幾乎就要贏得這個角色，但在得知電影內容後也婉拒了，她

  甚至因此解僱她的經紀人，因為沒有事先告訴她這些「淫穢」的細節就讓她去試鏡。


  「美國舞孃」當年在北美上映時，票房評價雙輸，成本4000萬美元、全球票房只有3775萬

  美元，在金酸莓獎也創下高達13項入圍的影史紀錄，最後拿下最爛影片、最爛導演等7項

  ，保羅范赫文還自嘲地出席了頒獎典禮，成為第一個親自領取金酸莓獎的導演。


  他預言五十年後人們會對這部片改觀，「從藝術和視覺的角度來看，這是一部製作精良的

  電影。」


  後來，「美國舞孃」在北美影碟市場獲得高達１億美元的收入，影迷將其追捧為邪典電影

  ，保羅范赫文想必對此相當欣慰！


  「美國舞孃」的失敗，也給伊莉莎白柏克莉帶來很多麻煩，當時許多評論都對她進行人身

  攻擊，她只能努力演出各種角色，讓自己振作起來。


  如今，「美國舞孃」重新獲得肯定，讓伊莉莎白柏克莉感到振奮，「這是一個不同的時代

  ，看到如此有爭議的事物現在如何被接受，真是讓人驚訝，」


  她說：「學者們寫過關於這部電影的文章。人們繼續討論它而且聚在一起像在看『洛基恐

  怖秀』那樣觀賞它。」


  「美國舞孃」數位修復版將於7月1日全台大銀幕上映。




