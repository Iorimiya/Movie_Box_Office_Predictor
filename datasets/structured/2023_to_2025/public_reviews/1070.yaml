url: https://www.ptt.cc/bbs/movie/M.1533410693.A.11D.html
title: '[新聞] 妮可基嫚、莎莉賽隆、「小丑女」演新片 外界等看好戲'
content: "新聞網址：\n\n2018-08-04 21:46 聯合報 記者蘇詠智╱即時報導\n\n俗話說「一山不容二虎」，近期宣布將開拍的一部新片，居然湊齊了妮可基嫚、莎莉賽隆\n\
  與「小丑女」瑪格蘿比聯手主演，3人都是金髮亮麗美女，妮可與莎莉還都有奧斯卡影后\n榮銜，屆時會不會爭戲分、搶排名而鬧得不愉快？各方都在等著看好戲。\n\n以往同類型的女星最忌諱同台，因為各自特色類似，競爭更為激烈。妮可與莎莉都是人高\n\
  馬大的金髮影后，外型都偏向冷豔，過去就常被眼拙的觀眾搞混，甚至妮可主演的「雙面\n翻譯」，角色原本是為莎莉量身打造，她接演後也招來批評，被嫌是選角錯誤、遠不如莎\n\
  莉合適。她和同樣來自澳洲的瑪格，也被傳過有心結，原因是瑪格在好萊塢迅速崛起，妮\n可卻因年過半百，能夠擔任女主角的機會愈來愈少，逐漸被年輕20歲的瑪格逼退。莎莉賽\n\
  隆就更不是省油的燈，曾經在拍「瘋狂麥斯：憤怒道」時大姐頭氣燄太盛，搞得兩位男主\n角湯姆哈迪、尼可拉斯霍特都一肚子不滿，不想再合作。而今3人終要同片，私下互動一\n\
  定會成為外界矚目的焦點。\n\n這部新片由「選情告急」、「門當父不對」導演傑洛奇執導，講述2016年福斯新聞網主播\n葛瑞琴卡森狀告總裁羅傑艾爾斯性騷擾，讓他辭職下台的經過，妮可基嫚扮演葛瑞琴卡森\n\
  ，莎莉賽隆演該頻道另一位主播梅根凱莉，瑪格則飾演虛構人物—和兩大主播共事的新聞\n製作人。3大女星同片飆戲，除了銀幕下是否大鬥法的「好戲」，觀眾在畫面上應該也有\n\
  不少精彩的情節可以欣賞。\n--\n\n    \n\n\n--"
