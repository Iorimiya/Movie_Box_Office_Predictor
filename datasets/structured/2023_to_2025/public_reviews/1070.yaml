  腫，各自詮釋為母則強的意義。\n\n妮可一改甜美風格，在18日上映的「派對撩妹守則」中飾演1970年代的英國龐克教母，開\n導情竇初開、想在派對把妹卻把到外星人的魯蛇少年，展開一段充滿龐克搖滾的奇幻之旅\n\
