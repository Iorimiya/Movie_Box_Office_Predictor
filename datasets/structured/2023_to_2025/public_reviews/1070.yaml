url: https://www.ptt.cc/bbs/movie/M.1206944737.A.B7C.html
title: '[好雷] 《當哈利碰上莎莉》相遇的各種可能（+經典片段分享）'
content: "《當哈利碰上莎莉》（1989）堪稱是80年代浪漫愛情電影的經典。\n快20年後回味這部電影，的確有他迷人之處，\n\n電影裡的對白妙語如珠，清楚闡釋了男女感情觀真的大不同。\n\
  最經典的莫過於餐廳那段「假裝」了XD。（文中附連結）\n\n梅格萊恩19年前真的好清秀...\n我後來才發現，演莎莉朋友的竟然是演星際大戰4-6集（1977~）的莉亞公主！\n\
  只能說，真的是歲月催人老阿...(嘆）\n\n這部片對不會很愛看浪漫愛情戲碼的我，\n可算是看不膩的電影了。\n介紹給沒看過的版友，看過的人也一起回味吧！\n\n\
  -----------------------------------\n\n影音圖文版\n\n\n男女之間有沒有純友誼？蓋棉被能不能只純聊天？很多人說1989年的《當哈利碰上莎莉》\n\
  主要探討上述問題，可是我覺得不盡然。是的，他們對於這件事的看法南轅北轍，但這只\n是他們相遇的起始點。我覺得，這部電影除了探討男女感情觀的差異，還闡釋了相遇、相\n\
  戀的各種可能。\n\n\n\n電影一開始是一對銀髮夫妻接受訪問，他們訴說彼此相遇的故事。隨著劇情開展，各種\n跨越年齡、膚色的老夫老妻現身說法：有的雙手緊握濃情密意，有的老公說得丟三落四，\n\
  老婆不時插話補充，有的人結婚憑得是媒妁之言，有的是一見鍾情然後私奔，也有住在同\n一棟樓但從沒見面，直到數年後機緣湊巧才碰上。\n\n\n\n相遇有各種可能，那哈利又是怎麼碰上莎莉的？\n\
  \n\n第一次相見，哈利是莎莉好友的男朋友，兩人結伴開車去紐約追尋夢想，在車上兩人開\n始聊天，話題慢慢轉到男人和女人有沒有純友誼。哈利認為男人都是下半身思考的動物\n\
  ，交女性朋友不是被對方吸引，就是別有居心。哈利的自命風流和無禮讓莎莉惱怒，車終\n於開到目的地，莎莉說：可惜我們做不成朋友，要不然你是我在紐約唯一認識的人。說完\n\
  兩人便分道揚鑣。\n\n\n\n五年後，兩人第二次相遇，莎莉剛交新男友喬伊，她去機場時看到哈利遠遠走來，但他\n卻不認得她，原本以為兩人會錯身而過，沒想到哈利轉過頭，和喬伊開心地打招呼，原來\n\
  兩人曾是同事。這時哈利似乎假裝不認識莎莉。\n\n\n\n飛機上，哈利認出莎莉，兩人盡說些客套話，有沒有找到理想工作、戀情進展如何？哈\n利還雞婆地給她「男性觀點」的建議。最後哈利說他要結婚了，莎莉驚訝不語，沒想到有\n\
  人忍受得了他的個性！兩人互道恭喜說再見，又是一次不歡而散。\n\n\n\n再見面時又過了五年，這時哈利剛離婚，莎莉剛分手，失去另一半讓兩人有了同是天涯\n淪落人之感，話匣子一開就說不停，兩人終於有了共識：因為他們對彼此沒性趣，所以男\n\
  女可以有純友誼。終於，兩人一笑泯恩仇，他們花很多時間相處，無話不談的結果，使得\n彼此開始瞭解對方，逐漸變成知己朋友。\n\n\n\n這部電影的經典片段，就是餐廳橋段。莎莉說在男人面前假裝性高潮，是每個女人都有\n\
  的經驗，哈利卻覺得女人有沒有高潮逃不過他的法眼。莎莉為了證明她的論點，馬上在餐\n廳表演一段，表演之逼真讓在場所有人瞠目結舌，隔壁桌的阿婆甚至對服務員說：我也要\n\
  點她吃的那份！\n\n\n★假裝性高潮。收看時請確定旁邊無閒雜人等，以免尷尬。\n\n\n\n這時，我才知道，原來不只女人會假裝，男人也會假裝。兩人不僅對感情加溫視而不見，\n\
  還介紹朋友給對方認識，這不也是一種假裝？假裝對彼此沒那麼在乎？哈利表面上和女人\n約會、上床，其實心裡很想念前妻，所以街上巧遇時才心情沮喪；莎莉在人前也假裝，她\n\
  假裝堅強，假裝失戀對她一點影響也沒有，但接到他的來電，知道他要結婚了，也不禁情\n緒崩潰，要哈利來公寓陪她。\n\n\n蓋棉被果然不只純聊天，尤其是蓋同一條棉被的時候。因為互相安慰，兩人終於發生了性\n\
  關係。但兩人並非從此由朋友變成戀人。激情過後，哈利睡不著，眼睛發直驚慌失措，一\n方面覺得尷尬，一方面也不敢相信吧，昨夜的激情也是莎莉假裝的嗎，自己對莎莉的感情\n\
  有愛情成分嗎？莎莉一覺醒來也察覺到哈利的不對勁，她也開始懷疑了，前一夜難道只是\n互相取暖嗎？哈利只是可憐她，並不愛她？\n\n\n\n之後，兩人避不見面，最後大吵一架。哈利後悔，想和莎莉重修舊好，回復原本的好朋\n\
  友關係，但莎莉無法接受。這又是男女對愛情/友情的不同之處。\n\n\n\n《當哈利碰上莎莉》的經典之處，就是花很多篇幅辯證男女對愛情/友情觀點的歧異，男\n人看女人和女人看男人有多麼不一樣。機緣讓他們相遇、相識，但兩人並非一開始就天雷\n\
  溝動地火，而是經過意見不合、彼此溝通、相互瞭解、包容接受、信心危機，到最後確認\n相愛。對照貫穿全片的夫妻訪談，他們能夠結婚、白頭偕老，在鏡頭面前回憶往事，全是\n\
  因為彼此相偕走過這段磨和的過程。\n\n\n\n 因此，片尾哈利最後的告白，就顯得真摯感人，那不是花言巧語，而是肺腑之言，要說\n出這番話，需要完全瞭解對方的優點，也愛對方的缺點才說得出口。\n\
  \n\n★片尾妙語如珠的感人告白。\n\n\n\n當哈利這個名字被波特霸佔10年之久，也別忘記80年代末，有另一位哈利經典詮釋了的現\n代都會男性的感情觀；19年前的梅格萊恩不愧為美國甜心，除了現在看來不合潮流的一頭\n\
  捲髮，她的演出的確有令人刮目相看的一面，至少餐廳那段演出已算是經典之作，不會輕\n易被人遺忘。（至少我是聽說這段很經典，才找了這部片來看XD）\n\n\n\n\n\
  \n\n\n--\n◆ From: 220.132.156.33"
