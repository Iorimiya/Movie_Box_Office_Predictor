title: '[新聞] 噓要嗑電影／「阿達一族」莎莉賽隆霸氣不輸「黑魔女」'
content: "新聞網址：\n\n2019-10-31 21:58 聯合報 記者蘇詠智／即時報導\n\n從黑白電視影集翻拍為彩色賣座大片的「阿達一族」，最新動畫版將在台上映。比起以前\n\
  的真人演出版本，動畫版不僅保留原汁原味，更找來「星際大戰」系列奧斯卡艾薩克、影\n后莎莉賽隆、「超殺女」克蘿伊葛蕾絲摩雷茲、奧斯卡最佳女配角艾莉森珍妮以及傳奇巨\n\
  星貝蒂蜜勒等為主角獻聲，陣容堅強不輸舊作。\n\n「阿達一族」是一家子看來像妖魔鬼怪，其實卻相親相愛、和「正常」家庭並沒有太大分\n別的奇葩，動畫版一開始就讓觀眾知道他們之所以無法和凡人共處、不得不隱遁在高山古\n\
  宅的理由，巧妙為真人版影片完成「前傳」，之後的主戲聚焦山下的完美社區平民百姓和\n阿達一族間的趣味衝突，嘲諷了所有人都陽光、開朗、樂觀、一致，並不一定正常，往往\n\
  更病態，因為抹煞了每個人先天的不一樣。編導也消遣在美國大為風行的「居家改造」節\n目大都千篇一律的美學，加倍突顯主角一家與他們居住環境是多麼與眾不同，有相當多的\n\
  黑色幽默，足以令觀眾會心一笑。\n\n行事風格霸氣、率性的莎莉賽隆為總是一身黑色長袍、有如巫婆化身的「阿達一族」女主\n人「魔帝女」配音，展現不輸「黑魔女」 的氣派，讓人印象深刻。說學逗唱樣樣精的貝\n\
  蒂蜜勒則為「阿達一族」老奶奶獻聲，雖然戲分不多，卻每一出場都搶足鏡頭。倒是聲音\n演出搞怪女兒「星期三」的克蘿伊，並未能媲美真人版中光芒四射的克莉絲汀娜蕾茜，戲\n\
  分也稍嫌被稀釋。片尾字幕時全家大合照一邊彈手指唱主題曲的片段，「阿達一族」死忠\n粉絲千萬不要錯過。\n--\n    \n\n;\n\n \n\n\n--"
