url: https://www.ptt.cc/bbs/movie/M.1559021213.A.69E.html
title: '[新聞] 莎莉賽隆當天鵝遇上癩蝦蟆　《選情尬翻'
content: '莎莉賽隆當天鵝遇上癩蝦蟆　《選情尬翻天》動人約會電影


  圖文／鏡週刊


  《選情尬翻天》以美國大選前夕為背景，國務卿夏洛特聰明又充滿魅力，即將由現任總統欽

  點競選下任，她開始了巡迴世界的暖身拜會。弗瑞是才華洋溢卻不願妥協的記者，因抗議報

  社被媒體集團收購憤而離職。兩人多年前是保姆與屁孩，再次聚首決定攜手合作，然而幕僚

  團隊對弗瑞的加入有所疑慮，兩人戀情也給外界違和感。


  表面上以政治題材為背景，本質上是浪漫愛情電影，儘管加進煞有介事對政治與媒體的反思

  情節，但該部分粗淺又聊備一格，重點還是在於憤世嫉俗宅男與光鮮亮麗大明星，如何跨越

  氣質與性格的反差、對抗他人眼光，讓真愛勝出。


  讓人想起《新娘百分百》，既是戀愛雙方的懸殊，也關於愛情裡最珍貴的心靈契合和真摯。

  歡鬧或有過火，終場收束時卻仍動人，滿適合作為約會電影。


  《選情尬翻天》是《殭屍哪有這麼帥》編劇兼導演喬納森萊文的新作，他的喜劇在出色創意

  的笑點之外，亦有清新氣質，題材並不新穎，卻不會感覺膩煩。只是許多巧思都靠角色的舌

  燦蓮花，滔滔不絕台詞搭配誇張的表演，一度有點太吵了。


  讓政治舞台淪為戀愛背板實在可惜，談一場不一樣的戀愛和打一場不一樣的選戰，許多地方

  可以互為隱喻。電影偶也意識到這一點，卻幾乎不曾認真發展。


  莎莉賽隆的百變演技之於此一角色遊刃有餘，這位準總統候選人不太像宣傳說的以希拉蕊為

  藍本，她的強大更來自於她亦不排斥自己身上小女人一面。塞斯羅根收放自如，但角色設定

  和以往太像了，隨時給出他和那群《大明星世界末日》哥兒們文青式惡搞的既視感。


  84分


  導演：喬納森萊文


  演員：莎莉賽隆、塞斯羅根


  片長： 124分鐘


  級別：輔12級


  上映日期： 5月24日


  90分以上：神作！一定要膜拜　


  80～89分：佳作！不看就沒話題了


  70～79分：普作！錢很多就看看吧　


  60～69分：爛作！避之大吉


  60分以下：糞作！看完要洗眼睛






  塞斯羅根的表演方式很做自己，看他的電影不用動腦，只要進去哈哈大笑就好了


  --




  到底在講什麼，那個標題是他媽的記者下的，我自己講的是我覺得賽斯都是演自己，就像我

  們總覺得阿湯哥是演自己一樣好嗎？'
