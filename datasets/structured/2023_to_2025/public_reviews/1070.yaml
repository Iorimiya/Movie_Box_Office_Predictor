url: https://www.ptt.cc/bbs/movie/M.1445559888.A.5CB.html
title: '[新聞] 票房女打仔片酬少5億 莎莉賽隆4折價搶小'
content: '新聞網址：


  票房女打仔片酬少5億 莎莉賽隆4折價搶小布飯碗


  2015年10月23日


  【謝宛儒╱綜合報導】奧斯卡影后莎莉賽隆（Charlize Theron）在電影《瘋狂麥斯：憤

  怒道》理平頭化身獨臂戰士「芙莉歐莎」，盡力強悍女打仔形象，傳電影公司不惜換掉「

  小布」布萊德彼特，找她主演新片。小布每部片酬高達2500萬美元(約8億1150萬元台幣)

  ，改由片酬1000萬美元(約3億2460萬元)的莎莉賽隆擔綱，現省4億8690萬元台幣。


  新片《灰人》（The Gray Man，暫譯）改編自同名小說，描述中情局出身的殺手，一邊躲

  避敵人的追殺，一邊要保護未曾蒙面的女兒，原本鎖定小布主演。美國電影網站Deadline

  報導，電影公司日前決定換角，改請今年演出《瘋》片叫好叫座的莎莉上陣。


  不惜改劇本省錢


  索尼影業為此不惜大改劇本，主角性別由男變女，雖然劇本費用提高，但主角片酬一口氣

  省了近4億8700萬元台幣，怎麼算都划得來，但「好萊塢男女星同工不同酬的議題」恐再

  升溫。


  過去安潔莉娜裘莉也搶過「阿湯哥」湯姆克魯斯的飯碗。電影《特務間諜》中臥底中情局

  的蘇聯刺客本來由阿湯哥詮釋，因他辭演換成裘莉。珊卓布拉克主演的新片《危機女王》

  原定喬治克魯尼自製自演，但她一通電話讓克魯尼改變主意。


  克魯尼日前受訪透露，珊卓打電話給他，劈頭就說：「你那個角色我要了！你可能演得不

  錯，但我來演的話，肯定更好。」該片下月27日在台上映。




  --'
