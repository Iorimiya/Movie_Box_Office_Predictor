url: https://www.ptt.cc/bbs/movie/M.1519354176.A.0D2.html
title: '[新聞] 莎莉賽隆從小就霸氣 開卡丁車不輸人'
content: '新聞網址：


  影后莎莉賽隆（Charlize Theron ）在爆笑職場黑色喜劇《老闆好壞》中再展霸氣，化身

  職場超辣女魔頭，差遣任勞任怨的苦命員工大衛歐洛沃 （David Oyelowo）到異地出差，

  卻意外演變成一段緊張驚險的「起肖」旅程，為公司賣命搞到要逃命，日前為宣傳新片

  《老闆好壞》替年度Daytona 500 賽車開賽，一身黑色勁裝的她透露自己從小就喜歡賽車

  ，童年時會開著父親打造的卡丁車與朋友競賽，還擊敗所有小男孩。


  已是女強人代名詞的莎莉賽隆這次在戲裡飾演盛氣凌人、唯我獨尊的賤嘴上司，過足戲癮

  ，她表示很喜歡這次的角色，她說：「她是個做任何事、講任何話都理直氣壯、氣場強大

  的女人，在飾演這個角色時，我就會自動講出很多自己都想像不到會講出口的話。」


  莎莉賽隆因欣賞導演納許艾格登 Nash Edgerton的才華而加入演員陣容，還親自擔任製片

  ，雖然她很喜歡這次飾演的職場女魔頭一角，但在演戲的過程常常覺得羞赧，因為這個角

  色講話的風格太賤了，她笑說：「我常常講著講著就臉紅，忍不住轉頭對劇組示意：『我

  真的很抱歉講出這些話』，還好他們很溫暖又友善。」該片3月30日上映。


  --'
