title: '[新聞] 梅格萊恩兒子好尷尬！訪當哈利碰上莎莉'
content: '梅格萊恩兒子好尷尬！造訪《當哈利碰上莎莉》經典餐館，「那個位子」還被特別標記出

  來——


  2023-09-04




  《當哈利碰上莎莉》演員梅格萊恩最近揭露，這部經典浪漫喜劇中的經典片段其實讓她的

  孩子尷尬不已。


  這部最初於 1989 年上映的電影講述了分別由比利克里斯托以及梅格萊恩飾演的哈利與莎

  莉，多年下來漸漸意識到身為朋友的他們其實偷偷愛上了彼此，而《當哈利碰上莎莉》其

  中一個最經典的片段就是莎莉在一間熟食店吃飯時假裝高潮。


  最近一篇報導中，《訪問雜誌》揭露梅格萊恩在演員工會罷工行動展開之前的一通電話訪

  談，她在過程中提到了她最近透過電話與自己的兒子、也就是《黑袍糾察隊》演員傑克奎

  德聯絡，而她的女兒黛西特魯萊恩就在同一個房間內。


  傑克奎德表示他當時住的飯店就位於《當哈利碰上莎莉》那個熟食店經典片段拍攝地點的

  對面，而這讓梅格萊恩的兩位孩子都感到十分尷尬。




  梅格萊恩說：


  「是啊，這確實很好笑，我兒子在今天早上打了通電話給我，他當時住在紐約的一間飯店

  ，而對面正是 Katz’s Deli 餐廳。我女兒當時也在場，所有人都在線上，他們就說：『

  媽，這真是一種非常獨特的尷尬感受。』


  他表示：『你知道你可以直接進去那間餐廳，然後他們還用一個箭頭指向了你當初拍攝那

  個片段的位置！』我真好奇他們有沒有指對。」




  在這個《當哈利碰上莎莉》的片段中，哈利對於女人能不能成功假裝高潮感到有所懷疑，

  而這個想法讓莎莉決定在用餐到一半時當場表演高潮，藉此證明他是錯的，接著一位由導

  演羅伯雷納的母親埃斯特爾雷納客串演出的客人，則向服務員表示她想要莎莉吃的餐點。


  這個經典片段在那之後被模仿了無數次，像是《新娘百分百》和《料理鼠王》中都能看到

  對於這個片段的致敬，而埃斯特爾雷納的台詞也被列入了 AFI 百年百大經典電影台詞的

  第 33 名。




  這個片段的拍攝地點為一間位於曼哈頓東休斯頓街 205 號的真實餐廳 Katz’s Delicate

  ssen，而就如同傑克奎德所說的，這間餐廳目前不僅依然還在營業中，而且還會向那個經

  典片段致敬。


  就在梅格萊恩當年拍攝那個片段的位置上，能夠看到一個寫著「哈利遇上莎莉的地方，希

  望你點了她所點的餐點，好好享受」的黃色指標牌。


  梅格萊恩這個來自《當哈利碰上莎莉》極具代表性的經典片段確實會讓她的孩子們感到有

  些尷尬。


  然而，傑克奎德也在近年演出的另一部代表作品《黑袍糾察隊》中回敬了他的母親，這位

  演員在這部由 Amazon 發行的成人異色影集中曾演出過一集圍繞在超級英雄大亂交的集數

  「Herogasm」。


