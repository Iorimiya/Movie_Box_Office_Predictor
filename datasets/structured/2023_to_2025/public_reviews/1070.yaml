title: '[新聞] 莎莉霍金斯主演奧斯卡提名短片《The Phone Call》完整上線'
content: '新聞網址：


  莎莉霍金斯主演奧斯卡提名短片《The Phone Call》完整上線


  文/Jean


  雖然不如長片電影能獲得廣大關注，但是有許多短片同樣相當優秀並深具潛力。由柏林影

  后、金球影后莎莉霍金斯（Sally Hawkins）主演短片《The Phone Call》已經在翠貝卡

  影展獲得最佳敘事短片以及許多國際影展的提名，在剛出爐的奧斯卡入圍名單中也獲得了

  最佳短片提名，現在這支20分鐘的短片也在網路上曝光。


  本片由廣告及音樂錄影帶導演Mat Kirby自編自導，講述一個關於失去與意志消沈的故事

  。劇情描述一個莎莉霍金斯飾演的輔導專線的咨詢員Heather，接到一通神秘男子Stan的

  來電，Stan因為妻子去逝而痛苦憂鬱的想要自殺。一向內向害羞的Heather在結束這通對

  話後也徹底改變了她面對生活的態度。Stan則由金獎影帝吉姆布洛本（Jim Broadbent）

  帶來精湛聲音演出。


