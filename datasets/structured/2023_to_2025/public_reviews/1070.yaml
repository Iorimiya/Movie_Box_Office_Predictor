url: https://www.ptt.cc/bbs/movie/M.1614314968.A.99B.html
title: '[新聞] 拍女版【終極警探】？莎莉賽隆給回應'
content: "拍女版【終極警探】？莎莉賽隆給回應\n\n世界娛樂中心/圖文轉載自網路\n\n\nNetflix\n\n從性感花瓶成功轉型為演技派女星，近幾年又再打入動作類型領域，奧斯卡影后莎莉賽隆\n\
  演藝事業的多元發展的成績早已是有目共睹；而近日，這位好萊塢動作大姐大也針對網友\n提出的演出建議作出回應。\n\n\n【終極警探】 Twentieth Century\
  \ Fox\n\n在接連於【瘋狂麥斯：憤怒道】、【極凍之城】、【玩命關頭8】以及Netflix人氣電影【\n不死軍團】…等動作片中的犀利演出之後，就有網友開始敲碗這位影后級女打仔主演女版\n\
  【終極警探】。\n\n\n【極凍之城】 Focus Features\n\n近日，在接受Vanity Fair雜誌訪問時，賽隆就被問到，如果到時候真的有電影公司找她\n\
  拍女版【終極警探】，那影后會有意願演出這個改編版新作嗎？對此，賽隆給出這樣的答\n案：\n\n\n\n\n【玩命關頭8】 Universal Pictures\n\
  \n「當然，我是說，這是一個很棒的點子。這也是為什麼我之前會在推特上回覆，因為我就\n是認為這個點子還真的是超有創意的。我當下的念頭就有點像是：『這傢伙應該要開始去\n\
  提案了，這點子棒透了！』」\n\n\n【終極警探】 Twentieth Century Fox\n\n布魯斯威利在1988年上映的【終極警探】中飾演一名紐約警探，為了救出被恐怖份子挾持\n\
  的人群以及妻兒，隻身與恐怖份子對抗。而網友的建議則是賽隆可以飾演威利的角色，然\n後前去解救自己的妻子！\n\n更新日期：2021-02-26\n\n--\n\
  、。帝釋所問經講記77頁拆穿佛法的。\n是 是菩薩成佛之道\n、、、、()、、是佛經。\n  是佛          是菩薩\n\n和破十方諸佛\n\n--"
