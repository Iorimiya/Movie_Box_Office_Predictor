url: https://www.ptt.cc/bbs/movie/M.1683684573.A.CF9.html
title: '[新聞] 莎莉賽隆：我的影響力已經大不如前'
content: '新聞網址：


  2023/05/09｜新聞快訊



  奧斯卡影后莎莉賽隆（Charlize Theron）無疑是好萊塢巨星等級的存在，擁有出色的外

  表，受到獎項肯定的演技，演出的類型跨度多元，甚至幾乎沒有負面新聞，出道將近 30

  年至今依舊穩定輸出高品質作品；不過近日莎莉賽隆接受 BAZAAR 專訪時透露，自己已經

  沒有以前那樣的影響力。



  「我覺得我現在處於一個很平凡的位置。」莎莉談到，「





  這位 2016 年時代雜誌評為全球 100 位最具影響力人物之一的女演員，在訪問中表示如

  果有什麼改變的話，那就是他的明星影響力比以前還要弱。「我會說，





  具有影響力的演員，除了商業大片之外，其實也會以自身的信用去參與、製作一些獨立電

  影，演出一些自己想要演出的角色，也就是莎莉賽隆在訪問中談到的「自己想做的事」；

  北美最大的獨立影展日舞影展就會有許多這樣的作品案型；然而，莎莉賽隆對此則抱持樂

  觀的態度看待，「不過這樣也好，我會樂意看到他們是針對你的東西好壞決定要不要執行

  ，而不是取決於你是不是一個咖。」



  莎莉賽隆這幾年參與了諸多票房動作作品，包括了主演的《不死軍團》、即將上映的《玩

  命關頭X》以及《奇異博士2：失控多重宇宙》，自己也製作了電視、電影如《重磅腥聞》

  （Bombshell）、《破案神探》（Mindhunter），期待她在之後能夠帶來更多多元且具有

  挑戰性的作品。



  --'
