url: https://www.ptt.cc/bbs/movie/M.1693488759.A.695.html
title: '[新聞] 莎莉賽隆怒嗆:男人老了像美酒 女人老了'
content: '莎莉賽隆怒嗆「男人老了像美酒，女人老了像殘花」說法：這根本是雙標！




  48歲奧斯卡影后（Charlize Theron）強大的電影女性角色形象深植人心，即使

  她已經是好萊塢一線巨星等級，。


  最近關於她「」的謠言更是甚囂塵上，讓這位影后在最新訪問中正面回嗆：「！」




  莎莉賽隆2017年加盟《玩命關頭8》飾演反派賽芙


  因為在銀行罵人被星探挖掘 身高177公分的莎莉賽隆是好萊塢一代巨星，無論是《公主與

  狩獵者》惡皇后拉維娜、《瘋狂麥斯：憤怒道》平頭造型的芙莉歐莎指揮官、Netflix動

  作大片《不死軍團》、《極凍之城》、《玩命關頭8》賽芙到勵志家庭片《厭世媽咪日記

  》全都能駕馭。




  莎莉賽隆《公主與狩獵者》飾演惡皇后拉維娜，美貌比拚女主角克莉絲汀史都華


  要說到莎莉賽隆最神演技，當屬讓她奪得奧斯卡影后的2003年《女魔頭》（Monster），

  她在片中以「易容式」妝容+強大演技演出真實的美國連環殺人犯Aileen Wuornos。


  不過你可能不知道，當年原本立志要成為職業芭蕾舞者的莎莉賽隆，其實是在銀行排隊兌

  付支票時與行員發生爭執，這一場吵架反而讓她當場被星探挖掘，安排她去就讀演藝學校

  ，8個月後接到她人生的第一部戲，開啟電影巨星之路。




  莎莉賽隆《女魔頭》拿下奧斯卡影后Photo from IMDb





  莎莉賽隆不滿輿論對於男性和女性老化的雙重標準


  不過就在莎莉賽隆代言的Dior最新廣告發布之後，輿論針對她每一年在Dior廣告中的容貌

  變化提出：「她是不是去整過頭了？」


  莎莉賽隆在接受Allure最新訪問時就正面回應這個謠言：「我的臉在變化，我喜歡我的臉

  的變化和衰老……人們認為我整容了。他們會說『她對自己的臉做了什麼？』我只想說『

  Bitch，我只是老了！這並不意味著我去做了一場失敗的整容手術！』這就是現在正在發

  生的事情。」




  莎莉賽隆坦承自己隨著年齡變化，外貌已經有明顯老化





  莎莉賽隆2020主演Netflix動作大片《不死軍團》


  莎莉賽隆進一步指出：「你知道嗎？這裡就出現了雙重標準。我一直對『男人老了像美酒

  ，女人老了像凋零的花』這個概念很不以為然……我鄙視這個概念，我反對它！不過同時

  我也認為每個女人希望以自己喜歡的方式變老，對她們來說是正確的，無論她想要自然老

  化或是去接受療程，我認為大眾需要對所有人如何經歷老化的旅程多抱持一點同理心。就

  像是我看著廣告牌上不斷記錄出自己的臉在變化，這種感覺其實很有趣。」




  莎莉賽隆驚喜加盟漫威超英宇宙Photo from IG@charlizeafrica


