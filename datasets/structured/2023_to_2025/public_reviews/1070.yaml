url: https://www.ptt.cc/bbs/movie/M.1520912805.A.F70.html
title: '[新聞] 喬爾埃哲頓聯合莎莉賽隆耍賤當混蛋慣老闆'
content: '新聞網址：


  最新黑色動作喜劇「老闆好壞」中，躍於影壇的澳洲性格男星喬爾埃哲頓，飾演一名自命

  不凡又愛空口說白話的企業老闆，外表體面帥氣，遇到危機卻出賣平時稱兄道弟的下屬以

  求自保。曾演過拳擊手、土豪、怪咖和特務等多元角色的喬爾埃哲頓笑稱這次很開心能改

  演一名「混蛋」，他笑說：「我覺得演混蛋很不錯。我每次演好人都需要花很多心力準備

  ，但可能天性擅演壞人，加上演壞人可以展現更多創意和情緒，相較之下準備功夫就簡單

  多了。」而埃哲頓與飾演嘴賤職場女魔頭的莎莉賽隆 這次在戲中合夥開公司，兩名「慣老

  闆」一搭一唱，激盪出許多火花和笑料。


  「老闆好壞」由好萊塢知名替身演員、同時也是喬爾埃哲頓的哥哥納許埃哲頓執導，描述

  由大衛歐洛沃 飾演的憨厚員工奉莎莉賽隆和喬爾埃哲頓飾演的老闆們之命到國外出差，但

  過程意外不斷，出差之旅竟變成危及生命的逃命冒險，劇情高潮迭起，充滿轉折，趣味橫

  生。


  被問到與弟弟合作，納許大讚喬爾是名優秀的演員，總能為角色塑造獨特個性，兩人雖然

  是兄弟，但弟弟在拍戲現場還是很尊重他這名導演，他打趣說：「如果喬爾不聽我的指導

  ，我就打電話給我媽告狀。」電影將於30日上映。


  --'
