title: '[新聞] 為何不加入漫威? 莎莉賽隆：沒人聯絡我'
content: "新聞網址： \n\n2020-07-11 12:26聯合報 記者陳建嘉／即時報導\n\n\n莎莉賽隆最近帶來Netflix全新動作片「不死軍團」，在片中飾演能力強大的不死戰士，\n\
  實際上莎莉從影多年，早演過「瘋狂麥斯：憤怒道」、「全民超人」以及「公主與狩獵者\n」多部動作片，卻從未有機會演出漫威電影，她近期在訪問中透露真正的答案，因為從未\n\
  有人聯絡過她。\n\n\n在接受播客節目「The Big Ticket」的訪談中，\n，莎莉也坦率\n給了答案，，但隨後也表示「我正在為自己鋪路，\n創造自己的機會」，認為無論如何，還是想要多演一些自己想演的電影，無論是娛樂動作\n\
  片、劇情都想嘗試，曾獲得奧斯卡影后的她，這一兩年主演並擔任製片的「重磅腥聞」、\n「厭世媽咪日記」都獲有極佳評價，證明她在幕前幕後都是傑出人才。\n\n--\n\
  \n巨猩喬揚時超正 可惜沒第二集\n\n--"
