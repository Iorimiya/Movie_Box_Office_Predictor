url: https://www.ptt.cc/bbs/movie/M.1735659247.A.A71.html
title: '[好雷] 當哈利碰上莎莉'
content: '先祝大家新年快樂,希望大家渡過了開心的2024

  也希望電影之神接下來保佑我們遠離爛片接近神片



  防雷




































  基本上確定是我2024最後一部電影

  曾經的美國甜心梅格萊恩的一大經典

  我之前看幾部他的作品都覺得還好

  但這次她真的很漂釀很有氣質

  終於有甜甜的感覺,當時的她也還好年輕

  所以當哈利碰上莎莉會發生什麼事情？

  會勾動天雷地火？會發展成世紀戀情？

  一開始是以上皆非,結束時成了以上皆是

  其實就是到處可見的愛情故事

  透過精美的包裝讓其昇華,像幾段夫妻訪談就很棒

  重點還是在於男女主角將火花控制得當

  要全程憋住,最後再綻放開來,這也是成功的點之一

  對我來說還有個加分的點就是引用北非諜影

  因為我看過哈哈,我是幾乎忘光在演什麼

  一些台詞場面依然雋永,我們可以擁有巴黎

  最後他們擁有了彼此,就像其他尋常的故事一樣

  一段美好的關係跟數十年等著他們

  果然經典,梅格萊恩的魅力和男主角的調情


  ----

  Sent from  on my Samsung SM-S9280


  --

  每當處在我人生的十字路口，我總是知道哪條路是正確的

  沒有例外，我總是知道，但我從來沒去做，你知道為什麼嗎？

  因為那實在他媽的是太難走了

  而現在的查理也正處在人生的十字路口，他選擇了正確的路

  一條通往原則、導向人格的道路。讓他繼續走完這旅程

  委員們，你們正掌握著他的未來。這會是個寶貴的未來


  --'
