url: https://www.ptt.cc/bbs/movie/M.1608393899.A.81A.html
title: '[新聞] 想看女同志版《終極警探》！莎莉賽隆回應'
content: '網友許願想看莎莉賽隆拍女同志版《終極警探》！意外釣出本人回應





  女同志聖誕節慶電影《求婚好意外》（Happiest Season）在串流平台「Hulu」上十分熱

  門，但除了常見的浪漫喜劇類型片，粉絲們也期待看到聖誕節電影的突破，一名推特網友

  的創意點子，在網路上造成熱烈討論。



  網友Francis O.在推特上貼文：「女同志聖誕節喜劇很棒，但我真的想看的是莎莉賽隆（

  Charlize Theron）參演《終極警探》（Die Hard）翻拍，橫衝直撞地突破重圍拯救自己

  的妻子。」因討論串劇增，莎莉賽隆本人竟然也轉發回應：「我要在哪裡簽名？（意指簽

  下拍片合約）」



  近年來，莎莉賽隆於動作片作品的表現皆大受好評，如《不死軍團》（The Old Guard）

  、《瘋狂麥斯：憤怒道》（Mad Max: Fury Road）、《玩命關頭8》（The Fate of the F

  urious）和《極凍之城》（Atomic Blonde），且部部叫好又叫座。



  ▲莎莉賽隆於電影《極凍之城》中也有精彩女女性愛場景。



  除了討論《終極警探》女同志版外，網友們也開始為莎莉賽隆的妻子選角，荷莉貝瑞（Ha

  lle Berry）、蜜雪兒菲佛（Michelle Pfeiffer）、莎拉保羅森（Sarah Paulson）、凱

  特布蘭琪（Cate Blanchett）和女神卡卡（Lady Gaga）皆榜上有名，還有一熱門選項是

  愛莎泰勒（Aisha Tyler），她本人看到討論串後也轉發道：「我又該在哪裡簽名？」



  看來大家皆對女同志聖誕電影抱有更多期待，希望繼《求婚好意外》後也能有更多元的LG

  BT作品出現！






  --'
