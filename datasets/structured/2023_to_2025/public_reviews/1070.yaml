url: https://www.ptt.cc/bbs/movie/M.1576048077.A.A4F.html
title: 'Re: [新聞] 金球獎0女導演提名 莎莉賽隆轟：非常荒謬'
content: '性別真的是很好用的工具，


  沒提名？一定是因為我是女生。


  沒得獎？一定是因為我是女生。



  這種心態久了就不會檢討，


  不會檢討就不會進步，不會進步就更難被提名，


  然後沒被提名又再來靠腰因為我是女生，


  就這樣無限循環，永無止盡的哭哭。


  金

  在

  聲

  l

  。

  與

  能

  引


  --

  性別真的是很好用的工具，不管女生怎麼歧視，只要

  說男生擁有特權就safe了

  在電影方面女導演得不到提名，只要說女導演實力不夠，

  女生就開始崩潰了

  我知道啊，但我不認同啊，

  但我來說他們就像富二代抱怨社會不公一樣，

  然後一群跟風仔在那邊幫忙喊聲，

  幫忙一群薪水是自己幾百倍的人搖旗吶喊，

  笑死。

  你倒是說說看我有什麼特權好了，

  好好舉例喔，免得被我打臉～

  會削減他們靠腰不平等的正當性，

  因為他們身上一堆優勢自己看不到而已。

  我只是反對那些有意見的人喲，

  反對=支持男導演？二分法嗎？

  富二代靠腰一身皺摺，

  想必你一定非常同情他們的吧QQ

  別這麼說，

  我相信他們都是優質好女孩的～

  所以你是質疑評審明知女導演更優秀，

  還是刻意只提名男導演囉？

  比起這邊一堆鍵盤評審的分析，

  和一個根本不是導演的女演員的話，

  我更相信評審的專業罷了。

  這裡鍵盤評審沒這麼厲害～'
