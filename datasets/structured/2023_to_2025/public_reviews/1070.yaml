url: https://www.ptt.cc/bbs/movie/M.1463833951.A.996.html
title: '[新聞] 《玩命關頭8》莎莉賽隆角色曝光　馮迪索'
content: '新聞網址：


  《玩命關頭8》莎莉賽隆角色曝光　馮迪索洩首張劇照


  記者許瑞麟／綜合報導

  電影《玩命關頭》首集在2001年上映，續集的票房一集比一集還要高，更捧紅片中一大票

  演員，劇組雖然因為保羅沃克（Paul Walker）逝世感到巨大傷痛，仍是堅強起來拍攝第8

  集，更找來奧斯卡影后莎莉賽隆（Charlize Theron）助陣，近日馮迪索（Vin Diesel）

  便首度曝光她的首張劇照和角色名稱。

  莎莉賽隆在照片中將一頭長髮綁成馬尾，穿上黑色皮衣，裡頭穿著超低胸的T-shirt，若

  隱若現的事業線相當吸睛，身旁還擺著許多槍枝，一臉酷勁，似乎暗示她在片中的角色和

  在《瘋狂麥斯：憤怒道》中一樣驍勇善戰，馮迪索也在臉書公開她的角色名字叫做「

  Cipher」，表示這禮拜拍攝時間接得很緊，並強調她和「唐老大」會有許多對手戲，直誇

  她表達了從影以來從未表現出來的爆發力演技。

  另一方面，據《Wired》網站報導，馮迪索受訪時表示打算讓華裔導演林詣彬回來執導最

  後一集，也就是第10集，對方曾因為執導過第4到6集打開知名度，並透露雙方經常見面聊

  有關於《玩命》的事情，好友總是會和他討論未來幾集可能的發展，而林詣彬方面則是回

  應「有在考慮」，還是不敢把話說得太早。



  --'
