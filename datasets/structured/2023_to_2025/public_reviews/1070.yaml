url: https://www.ptt.cc/bbs/movie/M.1751940908.A.D5A.html
title: '[新聞] 莎莉賽隆坦言好萊塢性別雙標 男演員票房'
content: 'Netflix《不死軍團2》評價慘淡！莎莉賽隆坦言好萊塢性別雙標：男演員票房失利還有無

  數次機會


  2025-07-08電影神搜




  近日，莎莉賽隆 (Charlize Theron) 為了宣傳《不死軍團2》，在接受《紐約時報》專訪

  時，毫不避諱地指出好萊塢動作電影領域存在的性別雙重標準問題。




  《不死軍團2》（來源／IMDb）


  ？


  「是的，這更困難。這是眾所周知的事實，」


  當被問及動作片領域的性別差異時，莎莉賽隆的回答直截了當且充滿無奈。


  她進一步解釋道：


  「最讓我感到沮喪的是，男演員們總能得到免費通行證。當女性參與動作片製作，如果電

  影票房表現不佳，她們通常不會再得到第二次機會。同樣的男演員即使連續幾部動作電影

  都票房慘淡，片商仍會一次又一次地給他們機會。」


  這種現象反映好萊塢根深蒂固的性別偏見。在這個以商業利益為導向的產業中，女性動作

  明星必須承受更大的壓力和更嚴格的標準。


  一部電影的失敗可能意味著職業生涯的終結，男性演員卻能在多次失敗後依然獲得新的機

  會。





  《倩影刺客》（來源／IMDb）


  回顧莎莉賽隆的動作片生涯，她的每個角色都伴隨著巨大的身體犧牲。


  自 2005 年的《倩影刺客》(Aeon Flux) 開始，她就深知自己走上了一條充滿挑戰的道路

  。


  「在我第一次嘗試動作片時就遭遇了不幸的意外，在《倩影刺客》拍攝的第九天，我做了

  一個後空翻，沒有足夠的高度，結果頸部撞在混凝土橋上。18 年前我最後一次進行頸部

  手術。我做過雙肘、右肩、拇指、腕管的手術，還有很多骨折。」


  在《不死軍團2》中，塞隆甚至懸掛在飛行的直升機上完成特技動作，她形容這是她動作

  電影生涯的新高點。


  「我們在接近尾聲時完成了這個動作，我想：『天哪，如果我能成功完成這個，我就再也

  不做特技了。』當然，這個想法沒有持續多久。」


  儘管面臨重重挑戰，莎莉賽隆仍在動作片領域擁有許多成就。


  從《瘋狂麥斯：憤怒道》(Mad Max: Fury Road) 中強悍的芙莉歐莎，到《極凍之城》(At

  omic Blonde) 中的冷酷特工，再到《不死軍團》系列中的不朽戰士，她成功塑造了一系

  列令人印象深刻的女性動作角色。




  《瘋狂麥斯：憤怒道》（來源／IMDb）


  莎莉賽隆在訪談中表示希望《不死軍團》能發展成三部曲，但她也承認不知道 Netflix

  的續集規劃會走向何方。


  而目前《不死軍團2》爛番茄新鮮度僅有 25 %，爆米花指數也僅有 38%，相較第一部新鮮

  度 80%，爆米花指數 70 %來說，評價一路下滑，看來出下一集恐怕是有難度了。



  新聞網址：




  --'
