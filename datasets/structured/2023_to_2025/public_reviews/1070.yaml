url: https://www.ptt.cc/bbs/movie/M.1573814415.A.397.html
title: '[新聞]《重磅腥聞》莎莉賽隆神還原演出  獲三提'
content: '新聞網址:http:// www.niusnews.com/=P20u0608?sc=umlaj

  難怪會說化妝是易容術，莎莉賽隆在戲裡真的變一個人

  雖然還是很正 對比圖真的有差


  以下正文:

  妝與髮型設計師工會獎於週一(11日)公佈入圍名單，改編自震驚全球真實性醜聞的《重磅

  腥聞》獲最佳時裝電影化妝、最佳特殊化妝效果、最佳時裝電影髮型在內3項提名，領跑

  本屆化妝與髮型設計師工會獎。於《重磅腥聞》中飾演前福斯女主播梅根凱莉（Megyn

  Kelly）一角的莎莉賽隆，在特殊化妝加持之下，幾近神還原的演出更獲得各大媒體一致

  好評。《重磅腥聞》在首映後即獲得媒體及大眾關注，對此莎莉賽隆於接受專訪時表示：

  「我在演出這個角色時其實頗有壓力，因為梅根凱利是全國上下都認識的名人。這和我當

  年演出《女魔頭》時的情況完全不同，當時我告訴其他人說『我飾演艾琳華諾』，他們會

  回答『那是誰啊？』。現在是只要妳一說出梅根凱莉的名字，大家都知道妳在說誰還有什

  麼事情。」。而為了讓自己更投入演出，莎莉賽隆看了很多梅根凱莉的影片：「梅根是個

  很堅強的女性，並且堅守自己的原則，但是有些時候你可以感受到她脆弱的一面，這點在

  拍完《重磅腥聞》後更為顯而易見。《重磅腥聞》並沒有要刻意去塑造一個英雄或是壞蛋

  ，我們希望藉由這部片讓觀眾們對片中的角色產生同理心。」。




  莎莉賽隆神還原演出 誠懇拜託「他」為《重磅腥聞》出力


  莎莉賽隆除了在《重磅腥聞》中飾演主角之一的梅根凱莉，更身兼本片製片。為了讓整體

  演出效果更加逼真，莎莉賽隆特別找來近年已處於半退休狀態，前年以《最黑暗的時刻》

  (The Darkest Hour)奧斯卡最佳妝髮設計獎得主辻一弘（Kazuhiro Tsuji）擔綱本片特殊

  化妝效果，在他出神入化的化妝術之下，果然神還原片中各角色。莎莉賽隆透露：「我費

  了九牛二虎之力才請到這位日本特效化妝大師，而他也特別為我的角色設計8個特殊化妝

  假體，其中兩個假體得完全覆蓋我的眼皮，其精細之程度讓我可以在特殊化妝的狀態下可

  以做出眨眼之類的細膩動作。」《重磅腥聞》改編自前福斯新聞董事兼執行長羅傑艾爾斯

  (Roger Ailes)被多名女性員工接連指控性騷擾的駭人性醜聞事件，將於2020年１月１０

  日在台隆重上映。


  --'
