url: https://www.ptt.cc/bbs/movie/M.1594105244.A.F07.html
title: '[新聞] 「這很難接受」！莎莉賽隆談「芙莉歐莎」'
content: '「這很難接受」！莎莉賽隆談「芙莉歐莎」角色前傳電影




  【瘋狂麥斯：憤怒道】編導喬治米勒在五月接受媒體訪問時，公開表示目前手上已經在進

  行的企畫案並非【憤怒道】續集，而是以片中女主角芙莉歐莎指揮官為主的角色前傳電影

  ，並且女主角將會啟用更年輕的新生代演員來詮釋。




  近日，於【憤怒道】中賦予角色血肉的奧斯卡影后莎莉賽隆，在接受THR訪問時，首度坦

  言角色前傳沒有她的心情：「這(對我來說)很難接受。聽著，我完全尊重喬治，在電影拍

  完之後我對他只有更多的敬意。他是個大師，對他我送上最誠摯的祝福。」




  雖然希望大師一切都順利，不過賽隆還是忍不住要抒發自己的落寞心情：「的確，那個消

  息還真的是讓人有點傷心，這是一定的。我是真心喜愛那個角色，並且我也很感激自己能

  夠成為創造她的一份子。我將永遠想著她，並且深深受到她的影響。」




  「很明顯地，我會很想看到這個故事繼續發展下去，並且如果他覺得他必須以這個方向來

  說這個故事，那麼我相信他的方法。我們對於細節的過於執著，導致我們忘記了投入情感

  的這件事與我們正在關注的那件事並沒有關係。」




  其實早在今年三月就已經傳出米勒曾接觸主演【女巫】、【分裂】與【異裂】等片的與新

  生代女星安雅泰勒喬伊、洽談合作這部前傳的傳言，不過至今電影公司並未正式宣布演員

  陣容。




  只是可以確定的是，想要找到一個可以媲美賽隆詮釋這個角色的新生代女星，無論是對導

  演米勒還是對於接手演出年輕版芙莉歐莎的人選來說，這個挑戰的難度絕對會很高！





  --'
