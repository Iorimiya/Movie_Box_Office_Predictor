url: https://www.ptt.cc/bbs/movie/M.1654837382.A.3DD.html
title: '[討論] 莎莉賽隆 怎麼最近突然轉型演超級英雄??'
content: '莎莉·賽隆 Charlize Theron


  本來想說在奇異博士2裡面有出現就很驚奇了，


  結果最近看 黑袍糾察隊 第三季，


  竟然也跑來演 劇中劇《七巨頭曙光》的風暴前線，


  必須說風暴前線真的是正爆了，很喜歡這種金髮造型，


  而且莎莉·賽隆也已經46歲了，轉型得很徹底，


  來演超級英雄真的不輸那些年輕人，


  不過我還是最懷念 1997年跟基奴李維演的魔鬼代言人，


  當年真的讓我為之驚艷，尤其跟艾爾帕西諾的對手戲，


  期待莎莉·賽隆在奇異博士3，會有怎樣的表現了~~


  奇異博士2



  黑袍糾察隊




  --'
