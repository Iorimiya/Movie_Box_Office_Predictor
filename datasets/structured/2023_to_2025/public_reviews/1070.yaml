title: '[新聞] 驚！莎莉賽隆斬斷戀情 分手西恩潘'
content: '新聞網址：


  〔記者陳昱均／綜合報導〕先前常公開放閃秀恩愛的奧斯卡金像獎影帝后莎莉賽隆（

  Charlize Theron）和西恩潘（Sean Penn），今天竟被美國媒體爆料2人目前不但取消婚

  約，更在交往一年半後決定分手，令人相當震驚。


  據《Us Weekly》報導，39歲的莎莉賽隆和54歲的西恩潘，交往約1年半，感情看似甜蜜，

  但女方卻突然喊卡，斬斷這段戀情。而莎莉賽隆和西恩潘本來就已經是認識多年的好友，

  2人在2013年12月將友情昇華成愛情，並開始交往。據傳，2人更於2014年12月在巴黎祕密

  訂婚，相關人士對週刊透露，求婚過程並不鋪張，「沒有準備訂婚戒指，不過2人確實已

  許下承諾」。


  先前《法新社》更曾報導，莎莉賽隆才大方表示自己很幸運能遇到西恩潘，對方也會是她

  一生的摯愛，西恩潘則是愛相隨，在5月份到坎城陪莎莉賽隆宣傳新片《瘋狂麥斯：憤怒

  道》，2人在紅毯上十指交扣的甜蜜模樣好像還歷歷在目，但那之後就沒有再一起在公共

  場合亮相，週刊推測這段期間內2人之間應該發生了什麼事情，才導致2人感情生變，走向

  分手結局。


  --


  --


  本來就不是很看好'
