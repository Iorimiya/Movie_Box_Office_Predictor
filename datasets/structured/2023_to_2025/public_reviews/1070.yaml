title: '[新聞] 喊話想演「全民超人2」莎莉賽隆認心跳加速'
content: "喊話想演「全民超人2」莎莉賽隆認心跳加速\n\n\n「不死軍團」。圖／Netflix提供\n\n2020-06-28 19:36 聯合報 記者陳建嘉／即時報導\n\
  \n威爾史密斯、莎莉賽隆主演「全民超人」於12年前上映，全球票房熱賣，近期莎莉賽隆宣\n傳Netflix新片「不死軍團」，接受外媒訪問，則再度證實自己仍在努力推動「全民超人2\n\
  」開拍。\n\n根據「Comicbook.com」訪問，莎莉賽隆說：「有一段時間，我們一直在研究續集，我想\n這部電影越來越有可能發展續集計畫，但應該不是近幾年，我們會慢慢讓自己回歸成為超\n\
  級英雄，我依舊會回歸，我還是想拍那部電影，一想到這我就心跳加速。」除此之外，莎\n莉也提到自己演過許多「永生不死」的角色，包括「公主與狩獵者」的壞皇后、「全民超\n\
  人」的超級英雄，這次也有不一樣的風格，「我想你雖然可以與過往的角色做出比較，但\n是不同的角色，不同的生存模式，都是不一樣的，我覺得這就是演員這份工作，讓人敬而\n\
  畏之的原因」。\n\n「不死軍團」將於7月10日在Netflix上線。\n\n\n「全民超人」。圖／摘自IMDb\n\n--\n、。帝釋所問經講記77頁拆穿佛法的。\n\
  是 是菩薩成佛之道\n、、、、()、、是佛經。\n  是佛          是菩薩\n\n和破十方諸佛\n\n--"
