title: '[新聞] 逆子弒親？《當哈利遇上莎莉》導演驚傳與'
content: '新聞網址：




  逆子弒親？《當哈利遇上莎莉》導演驚傳與妻陳屍家中


  2025/12/15 12:14 國際中心 綜合報導

  【國際中心／綜合報導】美國警方表示，他們在好萊塢名導演羅伯萊納（Rob Reiner）家

  中發現2具屍體，證實為他本人與妻子。


  綜合美媒報導，14日下午警方接獲報案，羅伯萊納位於布倫特伍德（Brentwood）的家中

  發現有2具屍體，到場勘驗後證實是78歲的羅伯萊納，以及68歲妻子蜜雪兒。


  警方正調查釐清案情及死因。消息人士透露，夫妻倆是被兒子尼克殺害。


  羅伯萊納70年代演出經典影集《一家子》打響名號，之後演而優則導，執導多部膾炙人口

  電影，包括《當哈利遇上莎莉》、《軍官與魔鬼》、《公主新娘》、《搖滾萬萬歲》、《

  義海雄風》等。


  --'
