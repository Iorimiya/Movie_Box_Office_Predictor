url: https://www.ptt.cc/bbs/movie/M.1751642707.A.649.html
title: '[新聞]莎莉賽隆爆最近和 26 歲鮮肉一夜情！爽到'
content: '莎莉賽隆爆最近和 26 歲鮮肉一夜情！爽到後悔沒早點嘗試：老娘有小孩要顧，哪有時間

  約會啊



  現年 49 歲的奧斯卡影后-莎莉賽隆（Charlize Theron）這些年來，


  雖然偶有一些交往對象或謠傳的緋聞對象，但至今從未結過婚，


  仍是獨力撫養兩名女兒的單親媽媽。不過這不代表賽隆沒有


  滋潤的性生活，最近忙著宣傳 Netflix 新片《不死軍團2》（


  The Old Guard 2）的她，在登上播客節目《Call Her Daddy》


  受訪時就坦言，她近期才和一位年紀小自己將近兩輪的小鮮肉發生一夜情。





  賽隆在節目中被主持人請求給觀眾一些性方面的建議，而她立刻就分


  享了自己覺得一夜情的好處：「我是最沒資格回答這問題的人。


  我這麼說可能會聽起來有點自大，但我想這是因為我在四十多歲


  時才找到這種性解放，真的令我讚嘆的那種解放，


  所以我接下來只是想客觀地分享一下。我這輩子大概有過三


  次一夜情，但我最近才和一個 26 歲的年輕人搞上，而那感覺真他媽的爽，


  我以前從沒這麼做過，所以我當下心想：『這實在太棒了。』」


  主持人隨後幽默補充，那位年輕人根本是世上最走運的幸運兒。


  賽隆接著說道：「我坐在這裡講這些，好像我有過好幾次一夜情


  似的，但當我真的有這經驗的時候，我心想：『哦讚啦，我 20


  多歲的時候就該嘗試了。』」賽隆坦言，她現在真的沒空談戀愛：


  「後來我有了孩子，誰他媽還有時間約會、刮毛、


  除毛、化妝啊？而且我還要送兩個孩子上學呢。」


  賽隆雖然和西恩潘（Sean Penn）、史都華湯森（Stuart Townsend）等圈內人交往過，但

  她目前仍單身，不喜歡使用交友軟體，也不想再和圈內人交往。賽隆並非覺得自己完全不

  可能再和圈內人談感情，她只是覺得「跟圈內人交往」這件事本身，對她而言不是好事。




  --'
