url: https://www.ptt.cc/bbs/movie/M.1594989595.A.F3A.html
title: '[新聞] 極凍之城合體捍衛任務？莎莉喊「當然想」'
content: "新聞網址： \n\n\n2020-07-17 12:01聯合報 記者陳建嘉／即時報導\n\n\n莎莉塞隆近期演出動作片「不死軍團」，並為該片頻頻宣傳，\n\
  ，繼續讓這名神秘且強悍的女特務再度登場，日前莎莉接受「\n好萊塢報導者」訪問，\n莎莉也立刻回應「當然很希望實\n現」。\n\n\n莎莉賽隆在專訪中表示，「聽著，只要一接到電話，我就會立刻答應演出，他們只要告訴\n\
  我何時何地開拍，我就會出現，基努是我在全世界最喜歡的人之一，我非常愛他，我尊重\n他，我也佩服他，能與他拍了兩部電影，這讓我非常感激。如今我們都處於職業生涯的新\n\
  階段，，如果我們可以讓這兩個角色在\n適切的時間軸上碰面，就可以解決一切問題」。\n\n\n莎莉過往曾與基努合作過「魔鬼代言人」、「甜蜜的十一月」等電影，更在後者大談戀愛\n\
  ，展現絕佳默契，莎莉在該片身懷絕症，最後還送給基努李維一隻狗，被外媒揶揄說，這\n片該不會就是「捍衛任務」的前傳？聞及這個問題，莎莉的反應也非常可愛，「哦我的天\n\
  啊，我真不敢相信你會把這兩部電影聯想在一起，你真的是個電影迷，我愛你，你太強了\n，天啊，我真的要馬上傳訊告訴基努」。\n\n\n\n--"
