title: '[新聞] 莎莉賽隆不想再接需劇烈改變體型的角色'
content: "莎莉賽隆不想再接需要「劇烈改變體型」的角色：我 48 歲了，那些肉根本甩不掉\n\n2023-08-23\n\n\n\n演員受訪表示，她不會再接下那種需要在短時間內劇烈轉變體型的角色。\n\
  \n「我再也不會在拍電影的時候說：『好喔，我必須增重 40 磅。』我再也不會這樣做，因\n為那是甩不掉的。我在 27 歲演出《》時甩掉了 30 磅的體重，簡直是在一夕之間\n\
  達成的。我直接三餐不吃，之後很快就回到了原本的體重。」\n\n\n\n莎莉賽隆當年也以她與克莉絲汀娜蕾奇一同演出的《》成功贏得了奧斯卡最佳女主\n角獎，在這之前，她就已經提過自己在為這部\
  \ 2003 年犯罪傳記電影減重後，立刻又輕鬆\n回到了原本的體重，但她也表示隨著年齡的增長，要減掉多餘的體重已經變得一件近乎不\n可能的事。\n\n她在 2018\
  \ 年為了演出《》而增重 50 磅後，也親身體會到了這點。\n\n莎莉賽隆說：\n\n「我在 43 歲時演出了《》，記得我之後花了一整年的時間減重，我聯絡我\n\
  的醫生：『我想我快死了，這些體重根本減不掉』，醫生則說：『你已經 40 多歲了，冷\n靜點。你的新陳代謝已經沒以前那麼好了。』......沒有人想聽到這種話。」\n\
  \n\n\n《厭世媽咪日記》\n\n莎莉賽隆在《》中飾演一位精疲力竭的三寶媽，她與導演傑森瑞特曼一同監\n製了這部電影。\n\n2018 年，她公開談論了自己在化身為這位角色時面臨了一種「」。\n\
  \n「我為《》增重了將近 50 磅。我想要感受到這位女人的感受，而我認為有\n一種方法能讓我更接近她、進入她的心理狀況。你知道的，這對我來說是個意外狀況。我\n\
  直接面對了憂鬱。是啊，這是我人生中第一次吃那麼多加工食品，也喝了太多的糖。參與\n這部電影並不是個那麼有趣的體驗。\n\n前三週總是最有趣的，因為你就像一個到了糖果店的孩子一樣。去\
  \ In-N-Out 吃早餐，一\n次喝下兩杯奶昔非常有趣。但過了三週後，樂趣就不復存在。就好像，你在那一瞬間吃膩\n了，一切都變得像是在工作一樣。我還記得必須將鬧鐘設定在半夜，藉此維持體重。我真\n\
  的得要在凌晨兩點起來，喝一杯冰卡布奇諾配起司。我起來後就開始吃......就好像把東\n西\n塞到喉嚨裡。要維持體重非常困難。」\n\n\n\n在那之後，莎莉塞隆花了一年半的時間才甩掉為演出《\n\
  \n\n《極凍之城》\n\n \n\n對莎莉賽隆來說，隨著年齡增長而漸漸變難的不只有減重而已，如今 48 歲的她表示，在\n動作電影的片場受傷都會讓她很受挫，因為現在傷口要癒合的時間完全不如她在\
  \ 20 歲時\n期快了，特別是她在這過去幾十年演出過《》、《》和《\n--"
