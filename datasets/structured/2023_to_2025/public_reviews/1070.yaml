title: '[新聞] 影帝后聯姻破局 莎莉賽隆西恩潘驚傳分手'
content: '奧斯卡影后莎莉賽隆（Charlie Theron）與影帝西恩潘交往1年多，原本盛傳2個月後在南

  非約翰尼斯堡完婚，美國媒體卻報導兩人上月同赴歐洲後不久，莎莉提出分手、解除婚約

  。


  莎莉上月赴坎城影展宣傳新片《瘋狂麥斯：憤怒道》時，拉著西恩潘在紅毯甜蜜放閃，沉

  浸在相戀喜悅。先前也有媒體指出，西恩潘在年初共同領養了她的3歲養子傑克遜，看似

  兩人早已認定彼此。但美國《US Weekly》報導，兩人從歐洲返回美國後，莎莉決定分手

  ，西恩潘已搬出她家，莎莉最近則要到倫敦拍攝《公主與狩獵者》續集。（李子凡／綜合

  報導）


