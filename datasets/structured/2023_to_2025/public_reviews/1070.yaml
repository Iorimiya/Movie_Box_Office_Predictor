url: https://www.ptt.cc/bbs/movie/M.1444704263.A.D25.html
title: '[新聞] 莎莉賽隆再演動作片《The Gray Man》接下布萊德彼特角色'
content: '《瘋狂麥斯：憤怒道》莎莉賽隆﹙Charlize Theron﹚將飾演殺手，再度挑戰動作片，根

  據 Deadline Hollywood 報導，她的下一部作品是索尼影業原本預計由《怒火特攻隊》布

  萊德彼特﹙Brad Pitt﹚主演的《The Gray Man》，改編自 Mark Greaney 的同名小說，

  由《美國隊長 2：酷寒戰士》導演 羅素兄弟﹙Russo Brothers﹚編劇，但他們正忙著拍

  攝《美國隊長 3：英雄內戰》﹙Captain America: Civil War﹚因此不會接下導筒。






  《The Gray Man》講述原為 CIA 探員的殺手，為了救突然冒出來的女兒，被迫攻入敵人

  陣營的故事。乍聽之下是一個由女性來詮釋很有挑戰性的角色，但索尼已經不是第一次把

  電影主角的性別調換了，2010 年的《特務間諜》﹙Salt﹚也是在《不可能的任務：失控

  國度》湯姆克魯斯﹙Tom Cruise﹚退出後，才改由《黑魔女：沉睡魔咒》安潔莉娜裘莉﹙

  Angelina Jolie﹚主演，再加上 莎莉賽隆今年才在《瘋狂麥斯：憤怒道》﹙Mad Max:

  Fury Road﹚中有相當亮眼的表現，影迷可以好好期待她所詮釋的殺手。


  --'
