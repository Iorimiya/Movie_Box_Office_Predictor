url: https://www.ptt.cc/bbs/movie/M.1721499290.A.DBE.html
title: '[新聞] 終於等到不死軍團2！莎莉賽隆解釋延後'
content: '終於等到《不死軍團2》！莎莉賽隆解釋本片延後的原因，並強調：我真的很愛這部電影


  2024-07-19電影神搜




  莎莉塞隆最近針對 Netflix 動作電影《不死軍團》睽違已久的續集分享了近況，暗示《

  不死軍團》續集將會在「不久之後」推出。


  首部《不死軍團》電影在 2020 年登上 Netflix 時帶來了不小的成功，雖然續集早在 20

  22 年就已經拍攝完成，但在那之後就陷入了沉寂。


  莎莉賽隆最近接受《綜藝報》網站的訪談時，解釋了為何《不死軍團2》會拖那麼久的時

  間，並暗示這部續集將會超越前作，直接表示自己很愛這部電影。


  她表示：


  「Netflix 內部經歷了重大的變動。我們被卡在其中，而我們的後製作業也因此停擺，我

  想當時大概已經處理了五週左右的時間。」




  Netflix 領導階層的異動，再加上今年稍早的演員與編劇工會罷工行動都導致《不死軍團

  2》後製作業的延宕，但莎莉塞隆表示她從來就不擔心這部漫畫改編電影可能會遭到取消

  ，而她目前對於能夠在漫長的等待後，看到《不死軍團2》正式上線感到非常興奮。


  「他們經歷了不小的變動，而我完全能夠理解這點。我們終於能夠完成善後，而我對此也

  感到非常興奮。這部電影真的非常棒，對於我們來說也是很重要的作品。我只有在能夠帶

  來超棒成品的情況下才願意接。我真的很愛這部電影。」




  吉娜普林斯貝瑟伍執導的《不死軍團》改編自格雷盧卡筆下的同名圖像小說，最初於 202

  0 年登上了 Netflix，故事圍繞在一群由莎莉賽隆的角色安蒂所率領的神秘傭兵團身上，

  然而，團隊成員其實都是活了上百歲的不死超人類。


  首部電影講述了他們發現某個神秘人物正在調查他們的祕密身世，因此他們必須要起身捍

  衛自己的自由。


  除了莎莉賽隆之外，其他參與本片的演員還包含了琪琪萊恩、馬提亞斯修奈爾、馬文坎薩

  林、路卡馬林內利、哈利米爾林、吳青芸以及奇維托艾吉佛。《不死軍團》最初上線的四

  週內，成功於 Netflix 平台上創下了 7200 萬次的收視表現，並且在爛番茄網站上獲得

  了 80% 的好評。




  目前，莎莉賽隆等多位演員已經確定都將會在《不死軍團2》中回歸演出他們的角色，演

  員陣容新加入了鄔瑪舒曼以及亨利高汀。


  至於導演則改為了薇多莉亞馬霍尼，而原作者格雷盧卡也將再次擔任編劇。


  新聞網址：




  --

  你也是啊，前任洗文王'
