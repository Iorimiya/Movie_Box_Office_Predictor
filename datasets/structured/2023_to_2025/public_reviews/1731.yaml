title: '[好雷] 正年輕 Les Amandiers (2022 法國片)'
content: '本週上映的法國片《正年輕》Forever Young 是部熱情洋溢燃燒青春的年輕人電影！法文片名 Les Amandiers則指出這群年輕人集結的巴黎南特Théâtre
  Nanterre-Amandiers！這間「杏仁劇院」於 1960s創立、1970s 建築、更在 1980s開設劇校、本片導演 Valerie Bruni Tedeschi
  就是當年學生如今來拍「半自傳」回憶錄故事！本片年輕人是很劇場的、比起其他領域年輕人更多愁善感熱情奔放富於表現力；本片年輕人同時也是 1980s的，比起 1990s後的「全球化」年代更多戰後嬉皮解放的遺緒。這樣屬於如今
  60 歲這輩的青春，我們當代青年會有共鳴嗎？




  以我個人來說既有距離又有共鳴。距離主要在於時代：那個沒有電腦手機社群網路把人們的心帶到虛擬空間的時代、那個自由解放四海一家仍勝於力爭上游五子登科的年代，他們珍視著當下的相遇交會掏心掏肺尋找著存在意義、這點與我們當今已很遙遠？如願帶著好奇心來看看也頗有新鮮感、同時也值得帶著當代更進步的人道價值回視過去的單純與瘋狂；而共鳴主要在於領域：我雖不出身劇場但也在某藝術領域體驗過「工作坊」與「師徒制」，那在許多藝術領域都是人人聲稱指向藝術核心的唯一正道？只是當年「正年輕」往往一頭栽下去、長大回顧恐會有不同看法。


  本片編導 Valerie Bruni Tedeschi 不知台灣觀眾認識嗎？或是更熟她妹妹「卡拉布魯妮」？總之他們近 60 這代年輕主演的法國片在當年台灣進的也不多我們恐怕聽過的更少，我們看過的她近年演出都是長輩了...
  不過這片她倒是廣招法國名不見經傳的年輕影人們來各擅勝場摩擦火花交出爆發演出！新人中除得凱撒新人獎的女主 Nadia Tereszkiewicz與正陷官司風暴的男主
  Sofiane Bennacer 外，觀眾唯一可能認識的是年輕導演Suzanne Lindon，想到她以少女之姿拍少女當下的《春日小戀曲》，我覺得還是老人回顧少女時代的《正年輕》想得更多看得更遠更對我胃口。




  本片片頭字幕前，開場就是十分鐘左右的「試鏡」戲、一大群年輕演員已火力全開精銳盡出、各種狂暴焦慮張牙舞爪語不驚人死不休！只見坐在評審席的學校老師們看著這些荒唐青春面上笑吟吟
  XD 本片最有意思之處就在於赤裸裸演出現象卻不多明說、就交給不同觀眾各自投射經驗做自己解讀。這「試鏡」戲該如何解讀？我們是要讚頌那時代劇場青年與文藝青年掏心掏肺「用生命演出」的藝術榮景、還是要對同一個「用生命演出」面帶戒慎保持距離珍惜當代更加文明？我們是要以老師們的選秀眼光欣見這麼多年輕學子代有才人出、還是站在年輕人這邊關心他們處境與心境？


  令學生累癱令老師欣喜令助理嚇到 XD 的這場「入學試鏡」戲，隨後有請年輕人來「各言爾志」：你為什麼來考本戲劇學校？有人想挖掘自己表達自己、有人則相反過來想隱藏自己用分身說話，有人家境貧苦既有演出才能就來餬口、有人才能不夠但嚮往表演寧端盤子也要考進來，有人直言崇仰大師「巴提斯謝侯」Patrice
  Chéreau想來「跟他做點事」、更多人嚮往交換「李史特拉斯堡學院」Lee Strasberg Theatre and Film Institute朝聖紐約！女主角
  Stella 則是豪宅裡的超級富家女，但恐怕正是行禮如儀的上流社會令她感嘆「青春正在流逝」想要燃燒自己把握點東西！




  顯然這些青年對於「存在」有種近乎執著的自我追尋，如有機會絕不任自己在或貧窮或富裕的庸碌人生中隨波逐流！每天挖掘自我掏心掏肺爆發展現的「劇場」就是他們夢寐以求的歸宿！只是在第一段「試鏡」戲人人挖掘自我表達角色後、第二段「工作坊」戲人人的角色慢慢回頭影響自我甚至漸佔據自我，最令人目瞪口呆的高潮是
  Stella 和對戲夥伴一吻下去就停不下來！誰知只見史實劇校主任 Pierre Romans在此彷彿抓到「魔幻時刻」般小心呵護、悄悄帶走全體學生讓他倆享受此刻無限延伸...
  原來角色上身如此受到肯定甚至崇敬？人生與戲劇悄悄合一也將是這行命運？


  本片約兩小時大約分前後兩半，前半基本都還像年輕圓夢揮灑自我享受人生的劇場蜜月期，這裡真有整個法國最深邃情感最豐富表達的最可愛心靈！與每個人上戲交鋒伸展肢體敞開心扉後、爆發情感久久不散成就更精彩的下戲人生！尤其在那揮灑青春尋找自己愛無壁壘的後嬉皮年代，大家有空來點個名畫出性關係網絡
  XD 人人才開始擔心 SIDA/AIDS... 可以看見這掏心掏肺熱情爆發的「劇場」人生已漸失去理智與節度！對 Stella 最刻骨銘心的，則是以憂鬱人生深邃表達敞她心扉的男友
  Etienne、自由解放的熱情魅力很快結合了吸毒、飄然人生分不清戲劇現實急速下墜中！




  吸毒是藝術必然嗎？回想我曾參與過的藝術領域，幸好以激發靈感為名的成癮文化僅限菸酒 XD 不菸不酒者人放不開靈感不來創作不夠狂、甚至還會招來輕蔑嘲笑被貼上標籤...
  本片談戲劇青年除「人生 vs 戲劇」已混作一團產生衝突外，亦有令整個世代隱隱覺得不對卻心照不宣的文化眉角：藝術人一定要自由奔放？一定要夜夜笙歌？一定要多重伴侶才是愛無壁壘？一定要迷醉飛昇才有超越靈感？一定要痛徹心扉才有爆發創作？眼看連劇校主任
  Pierre Romans都跟著女主男友 Etienne踏上了毒癮人生、排戲到一半竟沉沉睡去？學生的反應竟不是專業檢視而是趁機又親又抱！


  而曾幾何時門徒與師父的關係已漸忘卻專業、而演化為老男與少女的膚淺迷戀？在那年代如有 #MeToo 更該擔心的反而是老男 XD 回想我參與過的藝術領域，一樣有許多聲名遠播風度翩翩的「大師」當然以絕大多數是男性，女學生談起大師總是小鹿亂撞迷戀崇拜彷彿想吃老鮮肉
  XD 而這種崇拜與褻瀆已傻傻分不清的「造神」將培養放棄理智喪失自主的不對等關係！等前半片篩選訓練完後到後半片才登場的史實劇場主任 Patrice Chéreau
  更變本加厲：「我的劇場沒有民主」在那年代講來如喝水自然，滿堂學生看到大師五體投地都來不及了，這種地方竟有人白目敢出言質疑？




  面對這種「工作坊」與「師徒制」大師最大全員聽話甚至爭相討好的環境，回想我參與過的藝術領域裡，能適應的人就生存下來了、如能得大師青睞更是種勳章走路都有風、能與大師建立私交甚至成為入幕之賓的未來更將平步青雲！反之敢頂撞大師質疑大師的將遭橫眉冷眼淡出小圈圈...
  那本片這麼多年輕角色又各自怎麼看待這「大師中心」的權威結構？有個顯然是《她媽媽的公主》化身的 Adèle 早見識過這套扭曲調教而最能氣定神閒、其他人對大師則亦步亦趨爭相表現尋求肯認、有人視大師如偶像說到一句話都會手舞足蹈！不過透過後台屏幕遠觀大師背影又是什麼樣？


  也許年紀也才 40 出頭的大師也仍在自我探索、仍在多方嘗試為藝術尋找新方向？看他眼睛骨碌腦筋飛快隨時攫取年輕人火花、每有靈光乍現的「魔幻時刻」宛如天啟激動不已，腦中藍圖無法如身使臂時可以理智斷線如暴君！但恢復理智頹然坐倒又像個挫敗小孩需要有人傾訴給親親抱抱
  XD 權威大師偶遇挑戰若心理強壯還能嗤之以鼻摸個頭、但若挑戰真戳到痛點那可豎起寒毛口不擇言展開人格攻擊... 這一切當年 20 歲「正年輕」的小輩們看在眼裡不知所措默默消化、有天年逾
  40 甚至如編導年近 60 慢慢才會懂。重點是這一切扭曲你能接受嗎？如決定接受了又如何面對？




  把心智版圖從劇校核心 12 人繼續擴大又有不同況味：(1) 劇校廣招時人人來考天花亂墜推銷自己夢想無極限，(2) 考上的歡天喜地高陞殿堂卻漸脫離現實看不見別人，(3)
  沒考上的有人負氣遠離有人則對藝術殿堂永懷艷羨，(4) 考上的蜜月期如天之驕子揮灑人生卻讓戲劇引領人生，(5) 不久戲劇開始吞噬人生造成傷害卻已無路可退，(6)
  這才想起長輩警語「要不就當正常人過幸福生活、要不就當演員燃燒生命」，(7) 生命被戲劇吞噬宛如染了 SIDA/AIDS、有人死了有人存活陷入創傷，(8) 青春繁花落盡後終要痛定思痛重審戲劇、找到全新方式融合戲劇與人生以完成成長。


  若以一個「正常人過幸福生活」的外人眼光看，本片這些劇場老師簡直濫權造神處處踩在道德紅線上、這種劇場操磨少年身體異化少年心智誰也不值得！但對本就熱愛戲劇也跳了下去的年輕人們，我們真能以一種完美主義道德潔癖去否定他們所熱愛所經歷過的？難道被這扭曲訓練折騰一回只有棄它而去嗎？藝術終究還是個奮鬥，縱有再多扭曲不公與瘋狂譫妄都仍要克服，以
  Stella 為核心的主角們也許曾天真地燃燒生命奉獻藝術？曾以熱情與創作之名棄守理智與節度？最後反讓藝術吞噬人生徒留創傷？片末小演出 Stella 終於學會以藝術想像彌補缺憾療癒創傷與人生共處。




  劇場界真是編導 Valerie Bruni Tedeschi 拍的這個樣子嗎？它只存在於 1980s或只存在於這「杏仁劇院」謝侯門下嗎？抑或如此「燃燒生命」的藝術取向至今仍見於表演藝術甚至更多藝術領域中？而我們又該採什麼視角或欣賞讚嘆或戒慎審視？相信不同觀眾都會有不同視角，編導拍來的回顧視角更像是百感交集，總之許多劇場人與藝術人就這麼傷痕累累地走了過來、許多人失敗甚至死亡但存活下來的也慢慢成長茁壯...
  以我這藝界逃兵的眼光看來是對這文化不甚苟同啦 XD 但何嘗不是他們的燃燒生命才成就了我們的藝術欣賞？只希望藝術產製的人權與人性都要繼續進步。



  --

  覺得最近我更愛看的德國 ZDF電視電影才是正港八點檔 XD 話說 Eva Ionesco也拍過自己故事兩次了，這次才知她在那年代也這掛的...

  是呀，當有他自己要說的故事時並不一定要把個別人物「刻畫」到多深，這是不是「法國片」特徵我就不好說，只能說法國片看多了這種狀況也並不新鮮。以這片來說，雖然男女主角顯然是主角，但它談年輕人的「集體」遭遇是重於任何個別角色的，所謂的鋪「陳」點到為止交代到了就不會再多挖下去。這個點到為止，就是兩人相遇眉來眼去不久後
  Etienne給的一場儼然自剖（或是真自剖）的獨白演出，看完後 Stella 整個哭個不能自已，那時這兩顆心就已接觸相印，剩下就無須多談。因為看來本片最後要談的還是這「劇場文化」、以及這文化下「年輕人」集體的命運。'
