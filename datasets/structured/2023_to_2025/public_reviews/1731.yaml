url: https://www.ptt.cc/bbs/movie/M.1449155304.A.E5B.html
title: '[好雷]《夜晚還年輕》─ 今夜，我們正年輕！ '
content: '《夜晚還年輕》Tangerine

  ★★★★

  ----------------------------------------------------

  Director: Sean Baker

  Writers: Sean Baker, Chris Bergoch

  Stars: Kitana Kiki Rodriguez, Mya Taylor, Karren Karagulian

  ----------------------------------------------------

  《夜晚還年輕》─ 今夜，我們正年輕！

  一部精采的電影該有什麼樣的架構才能稱得上一部好電影，要說一個成功的要件元素，那

  絕不是「錢」，而是一個想法創意的誕生，《夜晚還年輕》絕對是一個可以推翻金錢定律

  的一部電影，同樣在LA的好萊塢，只有三支iphone5S，能拍出的竟是如此龐大的視野，看

  到的卻是這麼一塊鮮為人知的社區，而也在一張簡單的街道地圖上，走進的卻是一個諾大

  的議題，演出的是如此「Drama」之事，但點出的是當下世界都可能漠視的社會關懷。

  ----------------------------------------------------

  聖誕節，並不是只有紅色和綠色，在《夜晚還年輕》中，他們的聖誕節是橘色，一種溫暖

  的氣氛，沒有過多的狂歡，也不需富足的物質享受，即使他們身上沒有錢，縱使他們貧窮

  ，但有時簡單的滿足僅僅是「慾望」的達成，Razmik心中的性向秘密、Sin-Dee的小三糾

  紛，又或是Alexandra歌唱夢想，在一個人們只用物質來滿足自己的同時，卻忘記心中最

  初的種子，在紙醉金迷的世界裡，也忘記在世界的某一角落仍有這群弱勢群體，性交易的

  滿足，變性人的自由，不禁想想有沒有哪一天，大家不再已一種歧視眼光去看待，這就是

  他們，自由的表徵。而聖誕節對於已長大的我們來說，是否已不再能像小孩一樣，像

  Sin-Dee和Alexandra再次如此有好奇心的去探索這世界，做出一些驚人之舉，達成自己的

  夢想，也正如Mya Taylor獨自坐在酒吧，縱使自己要付錢唱歌，縱使自己的外在不符合那

  些社會世俗，但是她想做的是她自己，她想完成的是自己歌手的夢想，即使小小的一首歌

  ，她唱出的是她渴望中的《Toyland》



  ----------------------------------------------------

  《夜晚還年輕》的確是一部讓人非常驚豔的作品，故事背景從兩位變性人的友誼和一個被

  漠視的小區，開頭的出發點即非常吸引人，隨後又已一種狂躁、聒噪的方式去呈現相當風

  格化的戲劇手法，雖然口中不停的說著不要抓馬，但仍然展現出非常「抓馬」的戲劇張力

  ，但在愛情抓取小三的故事張揚下卻能細細點出少數民族的被排擠、白人黑人之間的種族

  隔閡、雙性、變性和性向轉變的社會認同，在原本簡單的平行支線下，最後都匯集到甜甜

  圈之家，更有趣的是在所謂一種大混戰中，他們時常同一陣線，也時常不同陣線，這種若

  即若離的爭吵氛圍一點也不嫌緊張混亂，反倒你從對白和肢體中都能感受到非一般的趣味

  ，十足引人大笑，也可看出導演在處理角色性格上的游刃有餘，而此片的優秀程度不僅僅

  是在整體的氣氛掌握，更厲害的是如何能將小成本製作玩到如此大規模的創意深度，不論

  是題材的選取，從器材設定或是角色選擇，又或是在之中所匯集的多元族群，小細節的設

  置皆能看出導演在電影上的靈活度，也因為這些鮮明性格的決定讓成品看起來更為鮮活真

  實，我們看的已不再是個電影，而正是他們當下的生活，正如同片名《Tangerine》，導

  演希望給人是一種暖和氛圍，讓人感受到心中的溫暖，就像那每次拍出的魔幻時刻下，當

  夕陽的餘暉渲染到夜幕，顏色齊放下，卻有千種的組合可能性。

  ----------------------------------------------------

  《夜晚還年輕》的劇本結構可說在整片都是以一種澎湃堆積，他不讓你有過多喘息的空間

  ，也猶如他神奇的iphone一樣，不停的跟人穿梭巷弄，不停地開車兜繞，又或是上天下地

  的俯視運鏡，在這種引人聯想起Emmanuel Lubezki的驚人攝影下，色調呈現橙紅畫色的溫

  和，更透過本片的強大剪輯拿捏好戲劇張力的頓點穿插，該收該放，更隨著鏗鏘音樂的高

  潮起伏，歌劇貝多芬爵士電子，音樂的豐富性更使電影亮點爆發，導演說本來也試著以畫

  面去配音樂，但最後覺得依場景氣氛去配樂的效果更好，打破一曲到底的框架，更凸顯電

  影貫穿的「Drama」性。

  ----------------------------------------------------

  《夜晚還年輕》可以說在LGBT題材上是一種重大突破，過去我們多數都是看到所謂的男扮

  女裝去實演這些角色，而此部電影卻是大膽的直接啟用已變性人去飾演，在這種無關性別

  設定下更能讓角色性格和社會地位更貼近生活，導演Sean Baker也在映後座談提到，起初

  他們只找到Mya Taylor，而透過此演員進而也接觸到Kiki，更了解到當地亞美尼亞人的族

  群生活，說是偶然機遇也好，在電影拍攝期間，幾乎多場戲都是不照劇本走向，雖為虛構

  故事情節，但隨意的對白架構，也展現他們平常生活上的性格，打鬧活潑毫不掩飾的豪放

  ，他們真的已不再是演戲，完全呈現最真實的他們，當然在劇情走向， Mya Taylor和

  Kitana Kiki Rodriguez的友情也處理得非常 之細膩，更別說兩人的演技已經完全成為電

  影最注目的焦點，讓人大為驚豔，也非常肯定他們的功力和用心。Mya Taylor 也在美國

  哥譚獨立電影獎獲得年度突破演員

  ----------------------------------------------------

  而在激情熱鬧之後，當秘密的戳破全盤的揭露，我們就彷彿已乘坐到雲霄飛車的終點，進

  入了該是沉澱之感，但這個谷底的瞬間沉默卻不是將所有帶向一個愛恨情仇的撕裂感，而

  是換來一個溫馨暖情的結局，當Sin-Dee已靠在Alexandra的肩膀上，當她們互戴假髮，一

  天的奔波，夜幕的降臨，在兜兜轉轉、爭吵沸騰之後，一次屎的襲擊，也正正打開兩人友

  情最緊密的結合，同樣的路、同樣的身分我們一路走來不論有再多紛爭，這一份友誼不會

  隨著外在而改變，我們還是永遠的好姊妹。


  今夜，我們正年輕！


