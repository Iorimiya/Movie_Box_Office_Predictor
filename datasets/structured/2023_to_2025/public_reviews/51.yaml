title: '[好雷] 全力奔跑'
content: '你是為何而跑？


  原本是為了多賢而進場，但意外的這部電影真的好看，中間也掉了幾次淚，但發現在擦眼

  淚的不只有我XD


  按照拍攝順序來說，這是多賢拍攝的第一部電影，但覺得智恩這個角色比《你是我的蘋果

  》的善雅更立體，在表現上也更吸引我，不甘與落淚的場景非常catch也很自然，覺得很

  棒。


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  你有沒有過怎麼努力都還是差一步的經驗？在同一條跑道上盡力的跑著，卻總是跨不了那

  道牆，漸漸地周遭的人不再相信你，而到最後也不相信自己，夢想就止步於此？男主角就

  是這樣，就是差那0.02秒，而這0.02秒卻停滯了六年的時間，直到他看到了高中時代的拍

  立得，才想起為何而跑。


  電影中穿插了主角停滯不前的現在與高中時代的回憶，那個他開始跑步生涯的理由，那些

  他進步的動力，那次乘著風的體驗，對比現在的人生，工作不順利、對媽媽的虧欠、觸礁

  的婚姻，處處充滿著失意，女兒跟朋友根宰是拉他出來的關鍵，他也想起了當年對智恩的

  承諾，於是他決定不顧一切再跑一次。


  未來會如何不知道，但至少全力奔跑後不留遺憾就好了。



  智恩受傷復健後成績不如以往被教練罵的那幕，還有九榮跟媽媽說對不起那裡，還有最後

  開心的躺在跑道上的時候我都落淚了，覺得人生就是一條長長的跑道，在抵達終點前一定

  會遇到很多不如意的事情，但無論是慢下來還是向前衝刺，都不要忘記你不是獨自一人，

  就抬起腳、順著節奏前行吧。


  --'
