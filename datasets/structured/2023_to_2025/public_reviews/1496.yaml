url: https://www.ptt.cc/bbs/movie/M.1207111824.A.5CA.html
title: '[好雷] 【我的藍莓夜】：講白了，就不美了'
content: "網誌版：\n\n    「語言」，是最普遍的溝通方式，同時也是最巧妙的一種，很多時候我們嘴裡吐出\n    來的話語，並不真的代表我們此時此刻所想的事物，最基本的莫過於男人在路上邂\n\
  \    逅女人，第一句話往往是：「今天天氣真好。」然而，男人心底所想的，真的只是\n    對晴朗的天氣有感而發嗎？\n\n    當然不是，怎麼看他心底所想的都是：『嗨，小姐，我可以跟妳作朋友嗎？』如果\n\
  \    說人生如戲，我們所說的每一句話都不過只是冥冥之中早已注定的台詞，那麼這種\n    潛藏在話語底下的各種真義便是所謂的「潛台詞」，因為有太多事，講白了，就不\n\
  \    美了。\n\n    【我的藍莓夜】是本人第一次接觸王家衛的作品，說來慚愧，雖然我喜歡看電影，\n    可是卻從來沒有想到應該鑑賞一下大師之作，看完本片之後，一種「相見恨晚」的\n\
  \    感覺油然而生，沒想到居然有導演可以將角色們內心的各種想法幻化為一句又一句\n    含糊，卻甜美的潛台詞，在搭配上那匠心獨具的蒙太奇手法，使得角色們的澎湃情\n\
  \    感能夠毫無流失的傳達到觀眾心底。\n\n    本片由一段旅程來貫穿三段故事，第一段是失戀的女人意外的闖入某家咖啡店，與\n    老闆兩人之間所誘發的些許化學效應，藍莓派象徵一種「選擇」，戀愛不是一種條\n\
  \    件上的交換，或比較各個對象之間的好與壞，而是更單純的回歸到「喜歡」或「不\n    喜歡」，就像沒人要吃藍莓派，不是口味不好，只是沒人愛。\n\n \
  \   看著老闆裝酷的將自己傷心的故事說成彷彿別人家的事一樣，但是收藏鑰匙的舉動\n    ，卻暴露出老闆根本沒有走過情傷的事實；看著女人硬著頭皮將鑰匙與情人一同拋\n\
  \    棄掉，但每天探頭探腦只是想知道男方是否將鑰匙取回的行為，同時也說白了女人\n    根本就放不下這段感情，兩個無法正視已逝之情的男女成了好友，我想是因為他們\n\
  \    在對方的一舉一動當中看到了自己。\n\n    女人為了釐清自己的感情，決定拉開與咖啡店老闆的「距離」。\n\n    第二段談得是警察與前妻的故事，這也是被「過去」給牽制住的兩個可憐人，當婚\n\
  \    姻走到盡頭時，雙方居然異想天開的渴望用酒精來麻痺自己，然而烈酒畢竟不是小\n    叮噹的時光機，沒辦法讓早已產生裂縫的愛情回復那最甜美的模樣，拋脫不開的執\n\
  \    著，終於讓兩人的生命化為一場最痛的悲劇。\n\n    這段故事對比著女人對前男友糾纏不清的情感。\n\n    第三段談得是蹺家少女與父親的故事，少女自以為看透人性，無往不利，卻看不透\n\
  \    自己與父親之間最真實的聯繫，如果連最愛自己的人都無法信任，那麼還能夠在人\n    世間品嚐到名為「快樂」的美酒嗎？\n\n    這段故事襯托出女人豐富而真切的情感的可貴。\n\
  \n    於是，經過三百天的旅行之後，女人回到咖啡店，終於放下了過往的「執著」，也\n    再次付出了最真實的感情，而男人也終於將收集來的鑰匙給拋棄掉，讓那些打不開\n\
  \    的門徹底遠離自己的生命。\n\n    這是一場既美好又純粹的邂逅，最後導演運用漂亮的蒙太奇剪接手法，將兩人相吻\n    與香濃可口的藍莓派結合在一塊，看得我不禁感到強烈的飢餓感，生理與心理上都\n\
  \    是，懷抱著美好的情緒步出戲院，迎面而來的卻是「俗隔有力」的鹹酥雞招牌，唉\n    ，果然這邊才是現實的人生。\n\n--\n◆ From: 123.252.84.125"
