url: https://www.ptt.cc/bbs/movie/M.1206989630.A.D3F.html
title: '[好雷] 我的藍莓夜'
content: "如果說\n華人普遍覺得我的藍莓夜是部優雅細膩，象徵王家衛超越華人領域，\n成為駕馭全球電影美學的作品之一，\n會否是出於華人觀影者立足於華人文化、對西方文化的想像或崇拜的投射？\n\
  洋導演，西方人以西方人對東方文化的認知，移植日本文化，\n橘越淮而為枳，慘不忍睹，這是藝伎回憶錄。\n這和華人導演臆測西方文化，拍洋片，將華人眼中的西文化移植大螢幕，\n\
  有什麼差別呢？\n簡單來說，這完全是西方版的王家衛，\nJude Law飾演的Jeremey，就像2046、花樣年華中的梁朝偉，\n纖細憂鬱，缺乏動力，等待填補。\n\
  而Norah Jones飾演的Liz，她在街頭，鏡頭特寫轉身離開時的高跟鞋，\n完全是王家衛一貫的手法，你說那是張曼玉也絕對妥貼。\n深夜、街頭、街燈，電車，失焦的霓虹，似乎是王家衛電影中不可少的元素。\n\
  \n但為什麼華人看著這些洋面孔演出，不會覺得怪呢？\n是因為王家衛的美感是overwhelming？還是對導演的崇拜?\n抑或出於對西方文化粗糙的想像，看不見detail，\n\
  因而看不出「王家衛」(他的故事、邏輯、風格)置於西方脈絡中的衝突矛盾？\n畢竟在藝伎回憶錄中，有眼睛的人都看得出該片的荒腔走板，\n那我的藍莓夜不同的地方在哪？\n\
  \n然而既然我已擺脫不了閱聽人的文化預設，那就誠實的這麼出發，去討論吧。\nMy blueberry Night是部很棒的電影。\n如果，你想要聽到生活如何轉化為言語--各種生活輕而細緻而完整的絮聒，\n\
  那麼，進戲院看藍莓夜，\n隨時她對著自己、他人、空氣、觀眾說著，說，以再現那些情緒想法感受情境。\n\n心碎的Liz，無力再收拾熱愛的Ernie，受困愛恨折磨彼此的Sue\
  \ Lynn，與Leslie。\n各式的交錯、撕裂、背叛、忽略、信任、孤獨、不堪；\n競逐、眷戀、崇拜、狂戀、不捨、抵抗、憤怒、鄙視；\n看著人與人之間關係的本質，如同牛奶酸敗的化學變化，衰頹-腐壞-變質，\n\
  有些可以修補，有些無可修補。\n我最心痛的應該是，Ernie憤怒不可抑；\n憤怒Sue Lynn傷害他、憤怒自己為何還這麼愛她，\n他忍不住出言污衊自己深愛的女人，而Sue\
  \ Lynn也斷然撕裂關係，\n此刻他卻又無望慌亂的抱住背對他的Sue Lynn，將鼻子埋入她頸項：\n\"don't do this to me, I love\
  \ you babe, I love you so much....\"\n我心跟著死了。\n\n無論何時，Liz都不斷寫著明信片。\n持續投遞，在遠方有一個人讓她想寫，\n\
  如果說，世上有一個人，能讓你想傾訴，有個人你相信他會聆聽，即使他不是個戀人，\n那麼這世界--即便這世界以傷害或冷漠或攻擊性對妳，\n被迫活在虛幻無常、片刻短暫、愛、不愛、腐敗的生活中，\n\
  也就不再無奈地那麼徹底，\n工作之外的空虛便有了個依附的底，薄薄一如明信片。\n妳已明白諸多傷害，這不是世界的錯，只是眾多樣貌的一種。\n而妳也有屬於妳的。如果傷害要再來，妳不害怕。那已與妳無關。\n\
  \n我的藍莓夜隨時以物品作為意象的延伸，短暫的固定鏡頭，都是物品：\n門、鑰匙、燈、最常出現的是門。關上、打開，重複歸來、離去，或還是離去。\npeople come\
  \ and go, and then you leave, too.\n\n基本上，一部電影如果能喚起觀眾的情感共鳴，\n為他說出他想說，卻不知如何說、無法描述的話，\n\
  是那麼貼近閱聽人，又加以將些共同點粹練為更精緻優美的情調，\n那就是一種希望的製造啊。\n不管，現實中生活有多悲慘不堪：「妳可以的。有一天妳也可以的。」\n\n\
  碎語：\n還有原來Liz和Leslie分手時的配樂，就是革命前夕的摩托車日記在片末照片\nreview時的BGM，當時苦思許久(這很痛苦)才想起(幸好)，\n\
  只想說這首歌真適合為旅程劃上終點。\n--\nblog有其他 \n\n--\n◆ From: 218.175.172.40"
