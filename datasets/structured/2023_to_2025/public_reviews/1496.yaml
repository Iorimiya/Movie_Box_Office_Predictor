title: '[好評] 《我的藍莓夜》by（時光之硯）'
content: "《我的藍莓夜》- 時光之硯部落格                          \n\n\n======================================================\n\
  \n\n\n\n\n======================================================\n\n二十六歲生日前兩天的夜裡，你在凌晨兩點多走出天母美麗華。忠誠路上的欒樹成排地蜿\n\
  蜒到了視線的邊緣，那些你曾經再熟悉不過的身影依舊無言，站立在微濕的霧氣裡。滴落\n它們身上的是細細的雨、雨中緩緩吹送的是涼涼的風。冬夜冷冽的空氣穿過層層厚衣，直\n\
  直地吹入你心底，如一則令人悵然的消息。\n\n\n你忍不住要想：這一回，橫亙在他與他的演員之間的，應該不只有那副墨色的鏡片，而還\n有絕對的語言距離罷？所以從來不靠劇本的他這次找來了編劇，所以這部電影才會如此地\n\
  流暢、純真得幾乎都不「王家衛」了；也所以到了故事的尾聲，這些角色們都是帶著微笑\n離開鏡頭前的。\n\n最近這陣子，連著看了幾部心情不會太好的電影。《少女死亡日記》、《贖罪》都讓你沈\n\
  浸了好一段日子，但也在反覆整理之後、投降認定自己無法在現階段寫下那些思緒。\n\n寂寥與惆悵——至此也許還能連結到前些時候的《色，戒》？——是這些電影共同的標記\n\
  。難以擺脫的心頭的微小卻凝固的重量，壓得人喘不過氣、找不到出口離開此地，直想問\n「這裡究竟是哪裡？」。也許無法改變的是過去，也許無法動彈的是未來；在空無一人的\n\
  大街騎樓邊、自門簷下步出的少女，她究竟要走往哪裡去？\n\n同樣地，在看完了《 我的藍莓夜（My Blueberry Nights）》之後，你花了一整個星期反\n\
  覆地聽那張爵士味濃厚、卻又不時散發著夜晚空氣的原聲帶，一再地想把自己浸回那股氣\n氛裡，卻無論如何就是進不去。關於失去的痛楚、關於道別的旅途——這些你都曾經經歷\n\
  過的，卻又如此地難以召喚出。\n\n但這次你可不打算投降。比起無法逆轉的憂傷，《我的藍莓夜》是個從城市的暗處走向光\n明的故事。當兩個女孩在一望無際的大漠公路上道別，四下雖是人煙罕至，卻有著曠遠的\n\
  藍天與無垠的未來在等待著她們。這樣的氣質讓你變得無意剖析它的層層哀傷，而是打算\n以一些文字、幾個片段來記下它的酸甜滋味，仔細地品嚐。\n\n雖然少了點風格化的鏡頭、多了點單純的話語，但這些都未曾影響《我的藍莓夜》成為一\n\
  部討人喜愛的電影。有了精巧而可愛的劇本，及一批不可多得的極好的演員，《我的藍莓\n夜》的精彩之處便在於：它寫傷痛與離去，並未失去那陣深深地刺入骨中的痛楚；但那痛\n\
  楚便是痛到了底，而終於得以化作輕盈的。\n\n失去的瞬間總是讓人猝不及防，但真正重要並留下來了的，是你那道別的手勢。而這部電\n影營造了各式各樣的離去、也搬演了各式各樣的道別：無法承受的、難以放下的，說不出\n\
  口的、遲遲未決而終究來不及了的——當然也有溫暖而圓滿的，看呀看著你為此而痛著、\n傷著、感懷著，又或者是笑著。你其實十分地喜歡它，只是不曉得該怎麼說明。\n\n\
  當然關於這部電影，你是有很多話可以說的。爵士樂界的新星諾拉瓊斯，在此自然而專注\n得好讓人驚心。年輕女孩的自信與面對人生的難以置信，在她清秀的臉龐裡表露無遺；而\n\
  與她對戲的裘德洛，其瀟灑與淡淡的世故，為都會轉角的小小咖啡店保住了溫暖。當然還\n有娜塔莉波曼，在她十三歲的時候你就和所有人一起發現了掩藏在那雙大眼睛下的慧黠與\n\
  天分。在此她的角色無比地搶眼，讓你明白當年的小瑪蒂達早已長成了一個成熟的演員，\n擁有深邃難以見底的演技。\n\n但整部電影最讓人驚豔的，是瑞秋懷茲。這位英國氣質女星，已先在《\
  \ 疑雲殺機 （ The\nConstant Gardener ）》裡沈重地照亮過你的目光；如今來到《我的藍莓夜》，她那內斂\n的爆發力將一個早熟美人的風華、與無力改變人生軌跡的悲傷與痛楚掌握得如此嫻熟，讓\n\
  人雙眼被緊緊地揪著、無法離開銀幕。\n\n白天與夜裡、人前與人後、忙碌與空虛、堅強與脆弱....這些角色們都有共同的面具戴在\n胸前，掩蓋住逐漸萎縮的心。但那面具一被摘除，便是逃也逃不掉的孤獨。看看大衛史崔\n\
  森，白天是認真而清醒、挺拔而近乎陽光的警員；到了晚上卻是沈醉在杯中，困在早已丟\n失的愛情與澆滿回憶的酒精裡。這當中不只是層次分明，更殘酷地道出了扮演多重角色的\n\
  辛苦。\n\n終究那熟悉的身影闖入，如一絲火苗燎過記憶的酒杯。希望瞬間被點燃，但也快速燒灼而\n至分毫不留。潘朵拉的小盒子是否為木頭所製？才會如此地禁不起星火。殘留的灰末飄向\n\
  慘澹的未來時光，而那永遠無法被填滿的空處，從中照見了寂寞與孤獨。\n\n原來，我們都是如此地在害怕著的嗎？\n\n你想起多少個夜裡，坐在桌前打開記事本、心裡想著該來寫點東西。望著空白的螢幕發呆\n\
  ，手指卻不聽使喚地點開MSN聯絡人名單， 在一行一行長短不一的暱稱間巡梭、來回地讀\n著。那些文字如此地近，與那些人們只有敲幾下鍵盤的距離；但又離真實的你如此遙遠，\n\
  遠大過從你心底來到螢幕的距離。\n\n於是往往就這樣到了深夜，記事本裡仍是一片白，如一首只有音高而沒有旋律的曲。你禁\n不住獨處的溫度，彷彿在等什麼似地度過了幾個小時；但你其實很清楚，只是想要找個人\n\
  說說話而已。\n\n你還記得在故事裡，城市的天際是如何地被鐵路系統劃過，每隔一段時間送來了熒熒的星\n火，閃動著綠色或水藍的幽光。夜裡的路燈總是格外吸引你，那無聲地在上頭釋放溫暖的\n\
  身形，彷彿永遠都不會埋怨孤獨；但在晨光漫起的那一刻，默默地黯淡下來的它，究竟是\n鬆了一口氣、還是正為了不再被需要而悵然著？\n\n你想起推開玻璃門走進店裡的伊莉莎白，有傑瑞米在等著聽她說話；你想起走回賭場裡的\n\
  萊絲莉，有桌邊的賭客們在等著她上場；你想起醉步踏入小酒吧的蘇琳，吸引了在場所有\n人各有所思的目光。等待是漫長的，而在一段距離之外的人們往往看不進你的心裡。只有\n\
  當你的脆弱裂開一道痕，真正的溫暖才能滲進來。\n\n滲入、覆滿、水乳交融，王家衛一再地剪入食物的意象。而距離與時間與道別的言語，則\n成了一個個段落、一則則心情的標記。你當然記得老警察厄尼枯坐在吧邊的身影，也記得\n\
  他那年輕的妻子跌坐在路邊、無法承受深沈哀慟的臉龐。你記得萊絲莉強裝的堅強，那輛\n美麗的敞篷Jaguar、及她們最後道別的風向。你記得伊莉莎白無法逃避地想看那錄影帶，\n\
  親眼目睹戀情已逝的證據而哭得難以自抑。 你還記得Cat Power客串飾演的前女友來和傑\n瑞米道別，他們之間那相知相扶持、相視而笑的盡在不言中...\n\n\
  你想起了他對這段故事的描述：那是個迷戀著落日的女孩，而他把鑰匙給了她。「但她喜\n歡追逐落日勝過那串鑰匙，終究消失在其中的一道餘暉裡。」\n\n愛會消失，但是回憶並不會；又或許回憶會消褪，但曾經擁有的心意卻是千真萬確的。無\n\
  論如何，曾有一個人來到了離你好近的地方；而在一扇又一扇的房門被關上的同時，還有\n另外的一扇又一扇被開啟了。放下必然要承受傷痛，但就在痛過了以後，才會更懂得珍惜\n\
  下一次擁抱的溫度。\n\n所以在步出戲院的那個夜裡，你望著渺無人跡的街景，心底想著該結束這一路上的回頭與\n療傷了。「one day , I'm gonna grow\
  \ wings」，記憶中的一刻刻固然美好，但未知的將\n來才是你應該用心經營的地方。而你想用更輕快的腳步踏上——至於身後的一切，就先反\n手把它關上了吧。就像片中一再出現的那首〈\
  \ The Greatest 〉，與你同是水瓶座的 Cat\nPower惆悵的歌聲，及背景裡那句永遠都只奏了一半的〈Moon River〉主題。\n\n「 Let\
  \ down and hanging around 」， 要學會放下與離開。然後總有一天，你會長出一\n雙翅膀。\n\n--\n\n   \n\n      \
  \   時光之硯部落格 \n\n\n--\n◆ From: 118.169.167.144"
