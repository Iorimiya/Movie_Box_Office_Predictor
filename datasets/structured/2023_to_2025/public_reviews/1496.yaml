url: https://www.ptt.cc/bbs/movie/M.1201152405.A.5A5.html
title: '[好雷] MY Blueberry Nights我的藍莓夜'
content: '圖文網誌版



  --



  當初想看這部片的主因，是因為我是JUDE LAW迷，進電影院之前一直不敢查看太多資訊，

  不過看完之後，我會打從心底推薦這部片。


  其實我很少看電影，所以王家衛的電影我並不是很熟悉，只是大概知道他的風格。但當電

  影一開場，馬上就令我聯想到《重慶森林》的風格。也許是拍攝手法，也許是畫面的呈現

  。


  當畫面還沒出來時，電影的配樂可以馬上讓你進入劇情裡，不管前面的預告/廣告多麼讓

  你分心，當音樂的張力一出來，整個人就被抓住了。


  故事從一個情傷的女孩，以及一間咖啡店開始，女主角的行為其實在我們日常生活中很常

  見，想放，卻又放不下。所以他開始天天光臨咖啡店，也許是想等人來領回鑰匙，也許是

  想找個人說話。也因為這樣，才和咖啡店老闆傑瑞米有了交集...


  "

  ""

  "。


  伊麗沙白最後選擇吃了藍莓派，或許是覺得，她和藍莓派一樣，都很好，只是，總是遇到

  不適合的人。

  有天， 伊麗沙白吃掉了整個藍莓派，趴在吧台上睡著了。傑瑞米親了他...我想，她是知

  道的。只是她還沒辦法處理眼前的局面，她還忘不了前男友，卻同時，也似乎對傑瑞米產

  生了好感...

  所以，她選擇離開，選擇開始繞遠路。她不敢再進咖啡店，因為她不想在看到這樣的自己

  。




  她兼兩份差，她希望藉由忙碌來忘記傷痛。

  而也因為這樣的關係，他認識了厄尼，一個愛酗酒的警察。後來才知道，還有一個形同陌

  路的老婆蘇琳。

  麗茲問厄尼，為什麼要喝那麼多酒？厄尼跟他說了白徽章的故事...


  蘇琳是個風情萬種的女子，十七歲那年與厄尼相識並結婚，卻因為愛玩的個性，受不了厄

  尼的太束敷的愛，選擇離開厄尼...

  當厄尼拿槍指著蘇琳，蘇琳嘶吼"It''s Over"，我心碎了...同樣的，我也看到厄尼的心碎

  ...所以，他也選擇了離開，而且是永遠的離開，也許是因為，這是他唯一能放開蘇琳的

  方法...


  厄尼的離開，對蘇琳有極大的打擊。她看起來不再那麼有魅力，反而多帶了一股憂傷。他

  碰了戒了六年的酒，才深深體會到，沒有人是因為喜歡酒的味道才喝酒的，厄尼也是一樣

  ...


  她到了厄尼選擇離開的地方，同時也是他們相識的地方。厄尼的離開讓她發現她其實深愛

  著他，只是他們彼此用了不同的方式，且雙方都無法接受的方式去愛對方...


  最後，蘇琳也選擇離開田納西，雖然離開田納西的她，或許就像少了靈魂...臨走之前，

  她將厄尼的帳單全交給麗茲，只希望大家能別太快忘了厄尼...




  在這裡，她遇見了一個女賭徒，無法對任何人事物產生信任的Leslie


  Lesile教導伊麗沙白永遠不要去相信任何一個人，她幾乎甚至不能相信自己。當他們在往

  賭城的路上，Lesile得知父親住院時，我想他的心其實在動搖，因為這一路上，他或許多

  多少少受到伊麗沙白純真的個性所影響，只是，最後他仍選擇了不相信任何人。最後，得

  到的是一張冷清清的病床...


  ，在這部片中我們看到了許許多多這樣的例子。


  伊麗沙白最後回到了紐約，她的旅程讓她學了很多，也得到了一個新的自己。她發現，其

  實繞遠路並不困難，只是能不能踏出第一步而已。


  他回到了咖啡店找傑瑞米，而最後，他的心也能面對傑瑞米了。




  有人說，這部片不夠好看，因為沒有重點。


  但我認為，這才是最真實貼近我們生活的，不是嗎？

  穿著PRADA的惡魔我也覺得他很好看，但他卻似乎離我很遙遠。而我的藍莓夜，他就像是

  將發生在你我周圍的事搬上螢幕，他沒有太多心中的敘述，靠的都是演員們的表情、行為

  來說故事。也因為是如此的真實，才更能打動人心。當那一句"It''s Over"，我流下了眼

  淚...因為那是一種很真實的感覺，很心痛的聲音。




  那你呢？你想當蘋果派，還是藍莓派？


  我想，我還是會選擇當藍莓派。





  --

  ◆ From: 61.217.247.110'
