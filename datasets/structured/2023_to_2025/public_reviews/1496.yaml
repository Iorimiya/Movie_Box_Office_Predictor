title: '[好雷] 我的藍莓夜  My Blueberry Nights'
content: "老樣子，這篇文章含有完整電影劇情及大部分的內容，如果尚未看過My Blueberry\n\n Nights、預定去看本片並且不想提前知道電影情節的朋友，請欣賞完電影後再行閱讀本\n\
  \n文。由於這是部溫柔的電影，我這篇影評就不以慣用的中立、理性分析方法來撰寫，改\n\n用直覺和感性的手法，儘管我一向習慣用旁觀者角度來寫影評，但偶一為之也還不賴。\n\
  \n\n　　這是一個簡單的故事、關於療傷與等待，有那麼點類似吉本芭娜娜的小說情節。由\n\nNorah Jones飾演的女主角Elizabeth因為一通電話知道了男友劈腿：她的男友帶著另一\n\
  \n個女孩到Jeremy (由Jude Law飾演)經營的咖啡店，於是Elizabeth來到咖啡店、遇到了\n\nJeremy。那晚女孩留下了前男友的鑰匙，要Jeremy如果遇到前男友來拿就還給他\
  \ (當然\n\n，附上一句混蛋。) 然而，Elizabeth又來到了這家cafe，也許是因為不願在New York這\n\n繁華的城市裡獨自孤單，或者是想放卻又放不了手、希望能重遇鑰匙的主人，她夜夜光\n\
  \n顧Jeremy經營的咖啡店、與Jeremy聊天打發時間與寂寞，她開始和Jeremy逐漸熟識。\n\n\n\n　　Elizabeth在Jeremy的店裡看到了一玻璃缸的鑰匙，於是她問了Jeremy關於這些鑰匙\n\
  \n的故事。每串鑰匙都有著不同的故事，屬於年輕人的、屬於老人的，或者，屬於情侶的。\n\n\n　　Elizabeth：What's happened？\n\n\
  　　Jeremy：People happened. Time happened.\n\n\n　　Elizabeth問Jeremy為什麼不丟掉這些鑰匙，Jeremy說：「如果丟掉鑰匙，有些門就\n\
  \n永遠都打不開了。」\n\n\n　　每晚店裡打烊的時候，起士蛋糕和蘋果派總會賣完，其他的也只會剩下一兩塊，卻\n\n只有藍莓派仍然是原封不動的。\n\n\n\
  　　Elizabeth: So what's wrong with the Blueberry Pie?\n\n　　Jeremy: There's nothing\
  \ wrong with the Blueberry Pie, just people make\n\nother choices. You can't blame\
  \ the Blueberry Pie, it's just... no one wants\n\n it.\n\n　　Elizabeth: Wait! I want\
  \ a piece.\n\n\n　　Elizabeth最後選擇吃藍莓派，也許是覺得藍莓派和她很像，很好、卻沒有人要。\n\n\n　　某一晚，她來到前男友家的樓下，看到樓上溫暖的房間裡、前男友和新的女孩親熱\n\
  \n著。\n\n\n　　要怎麼跟重要的人說再見？我什麼都沒說，只是離開，從此之後我開始避過這裡繞\n\n遠路。\n\n\n　　我想著這段台詞想了很久，很有感觸。有時候，當自己不知道該怎麼面對，只好選\n\
  \n擇視而不見、或者，讓自己逃避，可是，這不代表不難過了，事實上，那難過是在心中\n\n沉澱、發酵，有一天不小心觸動了，才發現那苦楚已釀成了酸澀的酒，而自己更得將其\n\
  \n慢慢飲盡。\n\n\n　　有一晚Elizabeth醉倒在Jeremy的店裡，Jeremy看著熟睡中的Elizabeth，忍不住吻\n\n了她。然後，隔天Elizabeth離開了這個城市。我一直覺得，那晚Elizabeth其實是醒著\n\
  \n的，她知道Jeremy吻了她，只是她還忘不了前男友，她無法在這個時候愛上Jeremy，儘\n\n管她對Jeremy是有好感的。\n\n\n***\n\n\n\
  　　第一站，Elizabeth來到Tennessee的一個小鎮。\n\n\n　　為了麻醉自己、讓自己能夠忙碌，她很辛苦的兼了兩份工作，白天叫做Betty、在\n\
  \n餐廳當waitress，晚上則用Liz為名、在一家不是太高級的酒吧當bartender，對外，她\n\n用買車作為解釋自己為何忙碌的藉口。在酒吧裡，她認識了每晚都在店裡待到關門的\n\
  \nErnie，Ernie是一個參加了無數次戒酒協會活動的警察，他和妻子在這個小鎮裡認識、\n\n結縭，但隨著時間過去，兩人的婚姻出現了問題。由Rachel Weisz飾演的妻子Sue\n\
  \nLynne是個年輕貌美、野艷動人的女子，她和Ernie相遇太早、年輕的靈魂不甘被束縛在\n\n這小鎮之中，她想盡辦法想要離開Ernie、卻又不能真正的離開這個城鎮；他們折磨著\n\
  \n彼此，Sue Lynne濫交男友藉以傷害Ernie，Ernie想要挽回Sue Lynne、卻又不知道該怎\n\n麼做。一次爭吵中，他們徹底決裂，Ernie甚至拿出槍威脅Sue\
  \ Lynne留下，但Sue\n\nLynne大聲吼著：「It’s over!!」，然後頭也不回的走出了酒吧。\n\n\n　　一夜，Ernie給了許多的小費之後離開了酒吧，然後出了車禍，我想，也許不只是\n\
  \n個意外。接著，Sue Lynne在戒酒六年後又開始喝酒，她發現酒並不是那麼好喝的，「\n\n酒真難喝，但有誰是因為酒好喝才喝的呢？」她突然知道了Ernie的感覺。\n\
  \n\n　　在Elizabeth送Sue Lynne回家的途中，她們坐在路旁Ernie車禍地點的路旁說話。\n\nElizabeth以為Sue Lynne很恨Ernie，但其實不，他們只是不懂得怎麼愛彼此。他們相\n\
  \n遇的太早，所以當感覺轉為平淡，就以為愛意已逝，甚至用酗酒來試圖找回曾有過的\n\n熱情。\n\n\n　「He is still crazy about me.」當Sue\
  \ Lynne對Elizabeth說出這句話的時候，我\n\n有點感到鼻酸。\n\n\n　　Sue Lynne最後付清了Ernie在酒吧積欠的酒帳，並請求Elizabeth將Ernie的帳單\n\
  \n留在酒吧的牆上，「我希望大家別那麼快忘了Ernie。」她終於離開了小鎮，只是，她\n\n也知道自己已經失去了靈魂中最重要的部份。\n\n\n　　世上的愛情往往不像小時候看的童話故事，王子遇上了公主、從此過著幸福快樂的\n\
  \n日子，常常是經歷了無數次70%、85%戀情，卻還找不到心目中的Mr.或者Miss Right。\n\n有時候，即使我們遇到了正確的對象，時間卻早了、或者遲了，「在錯的時間遇到了對\n\
  \n的對象」、「恨不相逢未嫁時」都屢有耳聞，甚至，我們在ok的時間和正確的對象遇上\n\n了、交往了，卻又開始懷疑自己是不是太早決定了，其實他或她並不是100%的對象，然\n\
  \n後離開了、甚至背叛對方了。在看著電影的當下，我想到了這裡、想到了自己、想到了\n\n許多許多我曾聽過的故事，幾乎被深刻的悲哀所掩埋了…\n\n\n***\n\
  \n\n　　下一站，Elizabeth在一個賭場打工。\n\n\n　「在賭場工作久了，你會失去時間感。」「這樣也好，解決了我睡覺的問題。」賭場\n\n的生活日夜不分，紙醉金迷、夜夜笙歌，Elizabeth在這裡認識了由Natalie\
  \ Portman飾\n\n演的美麗賭徒Leslie，Leslie在一次賭局中輸光了所有的現金，Leslie告訴Elizabeth\n\n在Las Vegas有人會借他錢、但她不願意向他借，Leslie想和Liz進行交易，條件是她借\n\
  \n走Elizabeth打工以來所有的積蓄，如果賭贏了、連本加上贏得的1/3金額給Liz，如果\n\n輸了，她全新的Jaguar敞篷跑車就是Liz的。\n\n\n\
  　　Elizabeth考慮再三之後接受了交易，然而Leslie卻輸了。\n\n\n　　Leslie把車鑰匙交給了Elizabeth，並要求她載她一程。因為Leslie已經走投無路\n\
  \n了，也只好去Las Vegas求援，但Elizabeth發現Leslie似乎一點都不急著到Las Vegas\n\n、甚至有點在拖延的感覺，她不懂為什麼。在途中住宿時，Elizabeth從Leslie口中知\n\
  \n道了原來她在Las Vegas的救星是她的父親，但她們的關係並不好，於是Elizabeth就也\n\n順著Leslie的意思慢慢前進，直到她接到打給Leslie、來自Las\
  \ Vegas的醫院的電話。\n\n電話裡說Leslie的父親病危告急、要Leslie盡快趕到，一開始Leslie並不願相信這個消\n\n息，她認為這和過去無數次父親耍弄的手段相同、只是他父親安排的騙局，但又難免擔\n\
  \n心如果這消息是真的，於是就順著Elizabeth的堅持趕到了Las Vegas。然而在醫院門口\n\n，Leslie卻又不願親自進入醫院證實，她要求Liz先進醫院確認、她不想要又被愚弄一\n\
  \n次。\n\n\n　　Elizabeth帶回來的消息卻是她們遲了一步，Leslie的父親已然過世。\n\n\n　　這時候Leslie才發現自己有多麼愛她的父親，即使他並不是一個適任的好爸爸，他\n\
  \n教導她的是賭術與「Never trust other people.」而父親其實是疼愛Leslie的，\n\nLeslie的敞篷跑車是一次父親大贏之後買下的，Leslie偷了這台車、想看看父親會做何\n\
  \n反應，想不到他卻在找到了Leslie的所在後，將車子過戶文件寄給了她。想到這邊，\n\nLeslie告訴Elizabeth她必須保留這台車、不管是作為回憶或者是父親曾經對他好的証\n\
  \n明，她並且對Elizabeth她坦白了她其實贏了在賭場最後的賭局，她只是想看看\n\nElizabeth有多麼純真、容易相信人。接著Leslie帶著Elizabeth去買了屬於她自己的車\n\
  \n，在二手車店，即使Leslie告訴Elizabeth只要她耍點小手段、保證可以省錢，但\n\nLeslie只是單純的覺得自己很喜歡那台車、不願意冒險，而用車商的價格買下了那台車\n\
  \n。\n\n\n　　兩人最後在公路上分開，Elizabeth朝著回New York的路上開去，而Leslie朝著另\n\n一個方向。我看著這段，思考著Leslie可能的改變，她過去奉行不渝的真理是父親教導\n\
  \n她的永不相信別人，她在賭場打滾多年、在爾虞我詐中討生活，在無數的賭局中她去觀\n\n察別人、用這個真理引導她達到勝利，逐漸的，也許她真的不再相信人、或者該說無法\n\
  \n相信人，甚至最後連父親都不相信了，直到遇到了Elizabeth、與父親的過世。她說她\n\n和Elizabeth同行是為了看看她有多純真，也許，並不只是這樣。\n\
  \n\n　　人與人相處，需要的基本條件是真誠的相信彼此，然而，實行起來卻不容易。成\n\n長的過程中，我們遇到很多，有些誠實、有些滿口謊言，有些人真假莫辨，於是我們\n\
  \n學會玩梭哈，藉由一些線索與訊息來判斷彼此的底牌，但牌局玩到最後，卻忘了這趟\n\n旅程的意義本來是為了追求真摯的友誼。\n\n\n***\n\n\n　　Elizabeth在這段旅程中，不斷寫明信片給Jeremy、告訴她自己遇到的一切。\n\
  \nJeremy為了想能夠給予Elizabeth回應，一開始甚至打了無數通電話到Tennessee的酒\n\n吧和燒烤店，可惜他並不知道Elizabeth在旅程中使用的並不是自己的本名，後來\n\
  \nJeremy覺得說相同的話沒意思，不如改成寫明信片、只消有一封到的了Elizabeth手\n\n上就值得了。於是他寫了上百封相當內容的明信片並寄出，卻沒有任何一封正確到\n\
  \n達Elizabeth的位置、查無此人退件的明信片厚厚一大疊。\n\n\n　　當我在電影院看著這段的時候不禁覺得Jude Law飾演的Jeremy這個角色的表情\n\
  \n和演技實在精湛，讓人感到由衷的可愛及喜愛Jeremy，那通接到名字同為Elizabeth\n\n的電話讓我大笑了出來、也無法不喜歡上Jeremy那誠摯的形象。\n\
  \n\n***\n\n\n　　Elizabeth不在的期間，Jeremy的俄國女友曾經回到Cafe。\n\n\nJeremy對著她說：「我想買一些新的桌椅，但總找不到適合的。」『也許你找錯地\n\
  \n方，或者，你其實是捨不得丟掉這些舊的？』她說。\n\n\n　「如果丟掉鑰匙，有些門就永遠都打不開了。」Jeremy還記得她說的這句話。『\n\n就算擁有了鑰匙，也不一定能打開那扇門。』她接著說，「就算開了那扇門，裡面\n\
  \n的人也許早就不在了。」Jeremy最後回答。\n\n\n　　於是兩人之間再無芥蒂。\n\n\n***\n\n\nElizabeth終於回到了New York，她站在前男友家的樓下、發現人去樓空，她眼裡\n\
  \n含著淚、卻也帶著微笑。\n\n\n我想，這是一個很好的結束，也是一個很好的開始。\n\n\n***\n\n\n　　Elizabeth回到Jeremy的Cafe，打開了門、坐上Jeremy為她保留了她習慣的位\n\
  \n置，同樣的blueberry pie and ice cream，同樣的blueberry night。\n\n\n　「在離開的前一晚我來過，但我沒有進來，我得離開，因為我不想當原本的那\n\
  \n個自己。」Elizabeth說。\n\n\n　　然後她離開了，又回來了。\n\n\n　　離開New York前的最後一晚，Jeremy親親的吻上Elizabeth的唇、舐去了嘴邊\n\
  \n的cream，Elizabeth無法給Jeremy回應。\n\n\n　　這次，Elizabeth回應了Jeremy的吻。\n\n\n***\n\n　　電影後，我和朋友討論，朋友認為My\
  \ Blueberry Nights開始的節奏太慢，但\n\n後段很精采。我說了其實王家衛的風格就是這樣，「淡淡的悲傷，卻不會太過，讓\n\n觀眾享受電影的過程、卻不會覺得深刻的難過而不舒服。」在看電影前、曾有另一\n\
  \n位朋友和我說他對這片的評語，並不是太好，「就是西洋版的王家衛電影」，其實\n\n，我倒也不會否定這個說法。\n\n\n　　對他而言，王家衛的風格是既定的、沒有太多改變的，儘管每部作品都相當好\n\
  \n看、但突破卻很有限。\n\n\n　　可是如同文章開始時提到的，我喜歡王家衛的電影，所以這樣的特色反而是吸\n\n引我的因素。而我個人比較熟悉的是他這幾年的作品，某個角度來說，2046給我的\n\
  \n感覺和My Blueberry Nights是類似的，只是當然因為劇情的差異還是有所不同。\n\n對我而言，好的電影除了能夠引出內心的情緒與腦海中的記憶、造成共鳴外，還要\n\
  \n能藉由劇情與演技讓觀眾擁有比回憶更深刻的感動。我認為所有的感動都是來自於\n\n自己記憶的痕跡，如果不曾失戀、那麼可能就無法為了電影中愛情的消逝而落淚，\n\
  \n即使可以，也無法那麼深刻、那麼痛。My Blueberry Nights有個甜蜜的結尾，但\n\n在過程中，我感受到不少熟悉的情緒，對我來說，其實是種享受。人不可能永遠沉\n\
  \n浸在回憶中，但幾十分鐘又何妨？這樣的緬懷讓我感動而著迷。\n\n\n　　總評部分，我想My Blueberry Nights應該不能以藝術電影來分類，她擁有蠻\n\
  \n明顯的商業化影子，但不是以哪種電影來說，我都會給予其極高的評價、並建議\n\n想看看浪漫電影的朋友去看。\n\n\n\n\n\n\n\n--\n\n\n\n\
  --\n◆ From: 61.62.211.252"
