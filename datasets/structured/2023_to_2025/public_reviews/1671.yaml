url: https://www.ptt.cc/bbs/movie/M.1449566964.A.7A0.html
title: '[好雷] 韓影 開心鬼上身'
content: '不是黃百鳴演的，方向不太一樣的開心鬼


  車太鉉這部演得真好啊～





  網誌圖文版：



  開心鬼上身，這個片名我這個年代的人很容易直覺想到開心鬼系列的香港電影，但基本上車太鉉主

  演的這一部，鬼魂的成分相當之低，膽小或不喜鬼片的人還是可以看看(不過其實看完還

  是不了解為什麼叫開心鬼，這部也不太像喜劇)，除了車太鉉之外，其他演員對我都算陌

  生，可或許也因為這樣，整部電影看起來更為寫實，讓人忍不住檢視一下自己的人生。


  開心鬼上身的故事是從一個無父無母，沒有家庭，感覺一無四處的男子決定要自盡開始，

  奈何失敗的人，就連死也不一定死的成，吃個安眠藥也因為沒有水而死不成。但在就醫的

  期間他卻忽然有了陰陽眼，可以看到鬼魂的存在。


  原本在世界上沒有跟別人有互動的他，家裡頓時多了四個鬼魂，老少男女都有，而且時不

  時會上身，對他來說實在是麻煩透頂，因此去求教道士該如何讓這些鬼魂離開，而道士告

  訴他唯一的方法就是滿足他們的願望。這些鬼魂一個設定，就是人沒主動問的他們不能主

  動提，這個設定讓整個故事到最後真相大白前讓人對劇情總是模模糊糊的感覺。這部分鋪

  陳的相當好，雖然不明主旨，但演員的演出以及節奏都掌控得宜，不會覺得無聊反而會好

  奇，到女鬼提出願望的時候開始發現一些端倪，大概猜出了最後結局。


  直到最後車太鉉吃入飯包，突然回憶起小時候的意外- (人如果發生了重大的事故，會有

  失去記憶的情況發生)，淚水忍不住在眼眶打轉的那一幕，累積的情緒完全爆發，跑回家

  中以小孩子狀態的哥哥奔跑拿出玩具起頭，才讓人放下心中的石頭安心的喘口氣，原來家

  人，自始自終都陪在他身邊。


  開心鬼上身的故事設定主軸明確，每個細節都掌握得很好，片頭片尾的銜接，以及最後跑

  字幕的花絮都讓人會心一笑，車太鉉不愧是資深老演員，這部戲的演技演什麼像什麼，似

  乎有點明白為什麼他能夠走紅那麼多年了，總之，是部值得去好好品嘗的電影囉。


  --'
