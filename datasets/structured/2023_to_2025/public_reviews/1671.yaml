url: https://www.ptt.cc/bbs/movie/M.1423120791.A.D6E.html
title: '[片單] 幫助人坦然赴死的電影 例 開心鬼上身，海上鋼琴師'
content: '親戚就要死了 現在在加護病房，沒有痊癒之希望


  他45歲，正值壯年，卻因意外受重傷


  因為醫療技術先進，他意識清楚，但無法下床，氣切後無法言語


  面對漫漫死亡之路，我們弄了一台電視到他房間  他想看電影或影集


  平常喜歡古典樂和網球


  我找了海上鋼琴師和開心鬼上身，他覺得不錯


  想請問還有什麼可以例如 講說人坦然赴死，接受生命的無常之類的片子或影集？


  絕命毒師可能會是我接下來嘗試的


  但是我覺得因為他已經沒有任何行動能力，強調死前要做很多事情的片子似乎不太適合


  所以不知道這適不適合，另外我也不會給他看一路玩到掛


  開心鬼上身讓人感覺死後還可以做些什麼效果似乎不錯


  謝謝！


  --'
