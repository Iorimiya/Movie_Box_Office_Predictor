title: '[好雷] 開心鬼上身'
content: "好久沒有一部電影願意讓我為他寧願失眠，也忍不住來寫影評推薦了！\n這就開始介紹吧！\n\n初看「開心鬼上身(Hello Ghost)」這部電影，我馬上有一種感覺：\n\
  「這不就是黃百鳴的開心鬼系列電影嗎？怎麼他跑去韓國拍續集了？」\n\n\n\n咳....不小心透露年紀....總之這當然只是中文翻譯問題，類似的亂翻\n電影名稱例子還多得很！因此也就很習慣地丟開成見，開始欣賞了！\n\
  \n\n主角是演「我的野蠻女友」的車太炫，對他的印象，就是一副\"總受\"....\n不是啦～是衰鬼樣！（聽得懂這名詞的請別用異樣眼神看我XD）\n\n而他演的角色相滿，也的確開頭就是一副衰鬼樣！一開始就表明由於從小\n\
  在孤兒院，重要節日也沒親人看他，他「感覺寂寞孤單、覺得冷」\n因此吞藥準備自殺！\n\n\n結果忽然感到難受，全吐了出來！旁邊的水竟也沒了（最後梗爆出來時候\n\
  你就知道這邊重要性了）\n\n難受之餘，又聽到旅館老闆在催促他住房要加錢（我想就類似我們這邊的\n休息六百、過夜一千），痛苦之餘要跑，卻因安眠藥發作而昏迷。\n\
  \n自殺不成的他，繼續跑去跳海，在這邊救難船接連救兩個人讓我想起韓國\n的高自殺率。\n\n\n結果當然還是沒有死成，大難不死的他，有因此必有後福嗎？沒有！反而\n\
  讓他陷入另一個地獄！用台語說法就是\n\n\n首先出現在他身邊有抽煙鬼，接著被送入精神科（最近看到進瘋人院的電\n影好多呀！一定是現代人壓力大XD）、在診所裡又看到愛哭鬼，接著又是\n\
  被酒鬼、死小鬼一一纏上。\n\n\n這幾個鬼麻煩點，就是都會用他的身體，來做一些事情，結果號稱注重健\n康的他（忍不住吐槽：強調注重健康的那你還跑去自殺！），竟因此被迫\n\
  借身體喝酒、抽煙。\n\n\n原來這是「乩童起駕」的故事呀XD！\n\n\n當然，就如同大多數鬼片一樣，主角開始求神問卜，希望趕快趕走這群麻\n煩得要死的小鬼們了！（）\n\
  \n\n很老梗的，主角就要「解任務」了：幫助這些麻煩的鬼魂們滿足他們的願\n望，好讓他們一一成佛！\n\n\n到此描述，你是否覺得，！大家怎會這麼\n推呢？讓我們繼續看下去吧～\n\
  \n\n首先是老色鬼的願望，得到一台相機，這容易，到店裡買就好？可惜老色\n鬼任務沒這麼容易！要取得的，是一台特定相機，而這台相機，在一個警\n察手上，為了討回相機，主角用盡各種手段，最後還是吃了苦頭，蹲入牢\n\
  裡～\n\n幸虧老色鬼知道警察一些秘密，總算是拿到相機，被放了出來。第一個願\n望完成。\n\n\n拿到相機後要做什麼呢？要還給老朋友，因此主角又進了醫院，要把相機\n\
  還對方，對方當然滿腹疑惑，跟這個來路不明的主角喝起酒。\n\n\n這邊真的一定要看車太炫的演技了！！在這部電影裡面，主角一樣是個憨\n厚笨拙的人，可是當一「」、被鬼附身時候，就會有各種表情變化，\n\
  由於四個鬼的個性都完全不同，因此光看主角變臉來變臉去就非常有趣了\n！\n\n\n接著主角就遇到女主角啦！老色鬼還因此教主角一套老套把妹技巧。讓主\n角跟女主角開始有所互動。\n\
  \n\n看到這邊，你是否覺得這又是一部老梗到不行的愛情喜劇呢？繼續看下去！\n\n\n接著小鬼頭的願望，當然都很小鬼頭，吵著要看機器人電影（請注意這是梗\n）、買玩具、玩飛鏢遊戲，而且還偷偷作弊，讓主角贏得一個超級大糖魚（\n\
  用糖漿製成）\n\n這邊也繼續讓主角跟女主角有些互動...\n\n\n\n再接著是煙鬼的願望....竟然是偷車？喔不！原來是他要一台指定的計程車，\n為什麼一定要這台呢？這當然也是梗。主角因此被現在車主怒追，煙鬼這時候\n\
  開始用噴煙特技幫主角～\n（這不又是鬼片老梗嗎= =！還是一樣，請繼續看下去）\n\n當然這特技沒啥用，主角還是得幫車主解決婚姻問題才行，車主的老婆有外遇\n\
  ，但現在懷孕了，正決定不接受治療。這邊繼續推進主角和女主角的姻緣。\n\n解決車主問題後，就拿到指定計程車了（推測那個車主應該是二手車行老闆之\n類），煙鬼的願望，就是開著計程車，帶著主角到海邊，和主角談話聊天，最\n\
  後還教主角游泳～喔不....是強迫游泳....\n（車太炫在我的野蠻女友裡面也是演旱鴨子呀XD）\n\n\n回程途中，煙鬼用著主角的身體，開車、還亂丟煙蒂，也因此被警察盯上而攔\n\
  下，一問之下，開什麼玩笑！主角又沒駕照又交通違規！而且還瘋言瘋語，下\n場當然又是－進入警察局啦！\n（這邊主角說他沒駕照的原因，）\n\n\n沒親沒故的主角，當然也沒人來保他，只能呆坐在警察局裡，最後還是女主角\n\
  來，聽到主角訴說著沒有親人的痛苦，決定保他出去。\n\n男主角與女主角又繼續推進感情戲了....男主角希望擁有家人，女主角卻希望\n拋開家人，女主角有個怪癖，喜歡聽人心跳聲（後來就會知道原因了。）\n\
  \n男主角也藉此，要聽女主角心跳聲....喂喂！這是性騷擾呀！正常你這麼做可\n能又要蹲回監獄去囉！\n\n\n女主角回醫院後，病人對她說：你衣服很好看，如果再有一雙鞋就完美了！女\n\
  主角毫不理會。（這是梗）\n\n\n前面任務都解完，最後就是滿足愛哭鬼的願望了！愛哭鬼願望就是去買菜，然\n後煮菜給心愛的人吃....那心愛的人是誰？愛哭鬼故意不講清楚！（應該大家\n\
  都有疑惑，如果只是要這樣，妳怎不跟主角約會就好？）\n\n\n女主角這邊，又再次跟病人起爭執了，原來那病人，就是她爸爸，女主角很不\n諒解他，因此對他非常凶悍。\n\
  \n那病人死了，照例來找能「」的主角，請他幫忙轉達願望。\n\n也繼續推進男女主角之間的感情戲，女主角說出當年母親要走時，父親卻沒出\n現，她只能聽著媽媽心跳聲，逐漸微弱........\n\
  （也因此解釋為什麼女主角喜歡聽心跳聲）\n\n\n別忘了愛哭鬼的任務，愛哭鬼帶著男主角，到市場去買菜，注意愛哭鬼是挽著\n男主角手臂，一起去菜市場買菜的！這邊甚至還會讓人以為愛哭鬼有想跟主角\n\
  有感情戲呢！但這同樣是梗，請記下來～\n\n\n愛哭鬼做了一桌好菜，讓主角跟大大小小的鬼們吃....啊這是七月半的辦桌嗎\n！！XD\n\n\n\n女主角由於要還相機給主角（這邊有點複雜，我也是看報紙....不對是看網友\n\
  解釋才知道相機是誰的，但那不是重點），因此來到男主角家，也因此享受到\n這桌「」。又繼續推進兩人之間感情。\n\n\n到目前為止，總算滿足所有鬼們的願望了吧？但這群鬼還是一樣，賴著不肯走\n\
  ，主角也因此大怒、大罵他們。當然是沒有用的。\n\n主角又決定自殺了....利用前面那台車廢氣自殺....在迷濛間，忽然想到跟女\n主角的種種，這次，他決定要自己清醒，跑去跟女主角告白了！\n\
  \n\n場景回到醫院，女主角偶然之下，發現原來她父親，其實真的有買一雙鞋送給\n她！也因此瞭解她父親還是愛她的！這時候，已經決定重新做人的男主角出現\n，跑來約吃飯。\n\
  \n兩人繼續聊著心事....男主角順勢跟女主角告白，女主角也以默許，答應這段\n緣分，男女主角終於要在一起了......................\n\n\
  真是一部超老梗的溫馨愛情搞笑喜劇鬼片呀...........??!??!?!?\n\n\n\n\n\n\n\n\n\n\n接著的接著，就是這部電影最重要、最大的梗要爆發了！如果你還沒看過這部\n\
  電影，建議你立刻離開這篇文章！!因為這個梗太重要了！！\n\n\n\n（以下有超大雷，請千萬不要看！）\n\n\n\n\n\n\n\n3..\n\n2...\n\
  \n1........要爆了！\n\n\n\n\n\n\n\n\n\n\n就在女主角疑惑說，為什麼你做的壽司捲，裡面竟然是包水芹菜呀？主角毫不\n在乎回答：那是我媽媽教我的，水芹菜對身體很好..............\n\
  \n\n\n回憶....開始逐漸浮現起來...........\n\n\n..........原來..........那些纏上他的鬼，看似完全彼此不相干的鬼，看似\n\
  完全沒有關連的各種任務，有一個重要的關係.....\n\n\n那就是....那就是.....（還沒看電影的快給我離開呀！！）\n\n\n原來....\n\n\n\
  \                  所有的鬼其實都是他的家人！！！\n\n\n\n\n整個梗開始大爆發了.........！筆者的眼淚也開始跟著爆發出來！！\n\
  \n\n\n老色鬼其實是他爺爺，當年就是希望用那台相機，幫全家人拍照....\n\n煙鬼是他的爸爸，他最大的心願，就是用那台計程車，帶著全家人去海邊旅行\n、教主角學會游泳........\n\
  \n小鬼頭是他的哥哥，當年由於被搶走錢，而無法帶主角去看電影.......\n\n愛哭鬼是他的媽媽，當年總是做這些芹菜壽司，讓全家人享用....\n\n\n....整個故事過程，看似要滿足些鬼的願望.........\n\
  \n其實....都是他的家人，因為愛他，所想要滿足的願望！\n\n\n可惜，就在當年大家高興地要去海邊時候，發生了重大意外，全家死亡，只有\n主角，因為被媽媽抱著，而孤獨活了下來....也呼應女主角說的梗：人遇到重\n\
  大意外時候、就會失憶...\n\n\n\n\n隨著男主角傷心地跑回家，對著空蕩蕩的家裡，原本希望那些鬼趕快滾蛋的他\n，現在卻反罵你們怎麼可以滿足願望，就這樣憑空消失....\n\
  \n\n主角哭訴著說：「別走....別走.......」簡直是讓人催淚到爆炸的橋段呀！\n\n\n\n\n如果這個家從此空空蕩蕩，那結局可就夠悲了，幸虧，一個腳步穿過，主角的\n\
  哥哥，出來告訴他，要把那個玩具送主角。\n\n煙鬼也跑出來了，告訴他把煙戒了，他還要教他開車...\n\n色鬼也回來了，告訴主角把妹秘訣，要他好好把握女主角。\n\
  \n愛哭鬼也出來了....她終於說出為什麼愛哭，因為當年拋下主角，就這樣走了...\n\n\n於是愛哭鬼抱著男主角，好像當年抱著小時候的他一樣.......\n\
  \n\n\n之後，他們拍了全家照，當然，照出來的結果是獨照...\n\n主角表面看起來是獨自一個人....實際上....他的所有家人....都一直陪伴著他.....\n\
  \n\n隨著主角結婚拍照，生孩子拍照....一直都是，看似獨照，實際上，卻都有著一家\n人陪伴著他.....\n\n\n\n故事回到最前面，主角準備吞藥自殺橋段，他家人們連著「上身」，讓主角喝水催\n\
  吐，無論如何，這群鬼，都不會讓主角遭遇各種危險的.....\n\n\n\n因為他不是一個人活著....他的家人.....將會永遠陪伴著他.............\n\
  \n\n\n\n後記：\n  筆者看完，不發一語，只默默做了一件事情，進入房間，默默地抱著正在睡著\n  的小孩，我也會永遠保護著你們、守護著你們唷....................\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n（防雷頁）\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
