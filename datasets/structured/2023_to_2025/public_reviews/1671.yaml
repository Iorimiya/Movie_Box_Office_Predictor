url: https://www.ptt.cc/bbs/movie/M.1515118851.A.5AF.html
title: '[好雷]《開心鬼上身》 片名能否給負雷?'
content: "結果又得再發這篇...好累\n我覺得片名取得好能讓整部電影更多加分\n改編原著也是有名稱調整的先例\n像是《變身怪醫》原著是《化身博士》\n案例不多，但有機會歡迎大家去欣賞一下台灣作家的論述\n\
  林斯諺／〈改編作品一定要忠於原著嗎？〉\n\n\n《開心鬼上身》這片名我真的超想狂罵個五分鐘\n(好吧!也許年輕一點的朋友不會馬上想到黃百鳴...但我就是會阿QQ)\n\
  台灣片商真的有時候超煩，有陣子就是「終極」、「魔鬼」系列\n然後才介紹朋友有機會，請耐著性子慢慢看完\n而且還要求他前半段沉悶時別關掉離場\n\n但我還是會選擇給他「好雷」\n\
  理由是結局真的有炸裂的爆破力\n(雖然缺點也很明顯，灑狗血是整鍋淋、刻意安排，但還算細膩巧妙)\n\n- - - - - - - - - - - 以下有雷 -\
  \ - - - - - - - - -\n\n這部電影開場就是男主角要自殺卻失敗\n而且同樣主角是車太炫\n我認為相較《與神同行》，在這部電影中他的演技相較有發揮出來\n\
  因為扮演的是一位孤單寂寞的邊緣人\n沒死成還馬上被旅店催討付錢\n\n沒想到因為瀕臨死亡邊緣，所以他能「見鬼」了\n(我內心OS：衰上加衰就對了？)\n因為能見鬼，所以接下來劇情就走「附身」實現願望路線\n\
  好吧!這片和《靈異第六感》有點不一樣\n\n老實說，接下來陸續出現的這幾位鬼魂\n我就不一一說明了，許多人看到這部分就關機閃人了\n我也認為這個部份沉悶 + 搞笑有點刻意卻失敗\n\
  一直冷場真的節奏感有點差\n\n所以我把最後仍給這部電影的好雷舉出來\n一、伏筆使用得當\n    壽司捲包\"水芹菜\"，雖然我並不熟悉韓國壽司捲平常包什麼\n\
  \    但裡頭有清楚掌握到未來說明時的刻畫\n二、對應舉目無親孤寂的溫馨\n    超級灑狗血的最後展開，把親情一口氣灌入\n    爆炸性的催淚，平常我不太喜歡這麼刻意的方式\n\
  \    但本片的惆悵和無奈，我覺得不論是過著幸福生活的我\n    仍然會替碰到如此不幸經歷的男主角\n    一把鼻涕一把淚的迎向結局\n\n最後，我仍然想表達對於片名的不滿\n\
  「開心鬼」?用《倒楣鬼上身》還比較不會嚇跑觀眾吧!\n就像是哪個欠揍的人想得出《刺激1995》這種怪名？\n早期的話應該我想到的是《魔鬼總動員》...好片爛名\
  \ OX@#\n\n而看完漫畫《與\"神\"同行》\n男主角在過程中對律師開口問了「你是\"神\"嗎?」\n我當初也就是表達這樣前後呼應我保證加分\n甚至你改編要真的把律師(最後一幕變身成閻羅)我都會鼓掌\n\
  但...\n\n--\n\n      有一天\n    大象就問駱駝說：\n    「你的胸部怎麼長在你背上啊？」\n    駱駝回答：\n    「我想這個問題，由\
  \ 一個老二長在臉上的人來問我實在是很奇怪耶...」\n\n--\n我當時覺得片商是惡意，覺得\"開心鬼\"比較好賣\n有些被騙進場的肯定中場甩門...\n對了，我可以偷問你是以前\"\
  爸刀\"的ck大嗎? XD\n樓上你不專業...明明是「爸刀」才對 XD"
