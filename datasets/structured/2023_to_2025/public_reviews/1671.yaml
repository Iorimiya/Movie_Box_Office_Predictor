url: https://www.ptt.cc/bbs/movie/M.1413214064.A.2DC.html
title: '[微好雷] 開心鬼上身'
content: '之前看其他心得文(好像是7號房的禮物)的推文一直提到這部


  一直以為是黃百鳴的開心鬼


  想說這部到底哪裡感人了......


  最近才知道是牽牛主演的溫馨電影



  孤兒院長大的車太鉉，對人生感到絕望


  自殺不成反而被四隻鬼纏身


  為了擺脫他們的糾纏，只好一一幫助他們完成未了的心願


  幾經波折後終於真相大白


  最後車太鉉決定好好活下去，並娶了美嬌娘，還生了個可愛的孩子



  電影剛開始時蠻令人好奇的


  到了解任務的橋段會稍嫌沉悶


  不過抽菸鬼跟老色鬼這兩個角色還蠻討喜的


  而小孩鬼跟未來老婆做了連接


  正妹熟女愛哭鬼這梗我最愛，哭哭



  雖然前面只有60~70分


  不過跟結局綜合起來平均也有80分左右


  主角車太鉉+5分，正妹老婆+5分


  所以這部給90分上下!!!


  PS.韓國電影真的越拍越好看


  --

  推 timmysas:    風中白頭翁頭白中風  <--台大動物研究所高材生

  推 suhaw:       床上女子和子女上床  <--台大家庭研究所高材生

  推 MyCuteTaitai:景美衣內有內衣美景  <--台大城鄉研究所高材生

  推 starseven:   中國山中有中山國中  <--台大教育研究所高材生

  → ruruking:    叫南韓全國全韓南叫  <--台大外交研究所高材生

  推 AllenbeaR:   媽祖你幹嘛幹你祖媽  <--台大宗教研究所退學生


  --

  嘖嘖，同感'
