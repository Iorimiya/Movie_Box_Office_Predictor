url: https://www.ptt.cc/bbs/movie/M.1426257506.A.A50.html
title: '[好雷] 宅男慢半拍～開心鬼上身後又一噴淚喜劇'
content: '豐富圖文版:



  世界

  是如此的慢   動   作


  從小累積異樣的眼光

  讓他從此與一切隔絕

  唯一陪伴的只有電視劇


  直到  走出了第一步


  發現眼前的滿滿鏡頭

  宛如一幕幕連續劇同時上映

  但都是一個個真實人生


  驚呼的同時

  他的春天也即將降臨



  曾經對於韓國片的印象，就是寫實驚悚片拍的非常好，

  表現出人內心最深處的黑暗面，這幾年不知不覺也看了不少片，

  發現他們對於題材挖掘的創意，已經不侷限於擅長的驚悚類型，

  連愛情片、喜劇片也別樹一格，像今天要跟大家介紹的，

  車太鉉和導演金英卓在開心鬼上身後，再度挑戰感動喜劇～宅男慢半拍


  宅男慢半拍光基本設定就很吸引人，一位擁有瞬間動態視力的男子，

  雖然沒辦法像外星人都教授能時間暫停，但看得到一般人無法查覺的慢動作瞬間，

  感覺很有成為超級英雄的特質，但因為從小被同事視為怪咖而隱居在家，

  直接他決定走出家門踏進這個社會，來到監視器監控中心上班，一切就此改變～


  這樣的題材來到好萊塢手中，一定會特效狂發展現主角特異功能，

  或拍成像來自星星的你的超現實，但宅男慢半拍卻沒有落入窠臼，

  動態視力為故事重點卻沒有濫用，反而將主軸放在男主角和世界的互動，

  因為他願意聽從建議踏出這一步，無形中也慢慢跟每個人連結了情感。


  相對開心鬼上身在前段嫌悶的劇情，

  宅男慢動作故事結構又再進化，情節環環相扣還不時偷偷埋梗

  (這部片梗非常多，在此就不暴雷，對故事越陌生會拍得更加驚喜)，

  搭配讓人眼睛一亮的影像呈現，處處讓你發出會心一笑又感動。


  從我的野蠻女友一炮而紅的車太鉉，十多年下來已經累積不少票房大作，

  可說是南韓的喜劇天王，之前都覺得他的表演方式差異不大，

  就是略帶憨厚又有點可愛的風格，

  直到這片真的發現他的演技，即使電影中幾乎一半時間戴著墨鏡，

  藉由臉部(特別是嘴唇)和肢體動作，就是讓人邊看邊拼命發笑，

  搭配女主角南相美同樣細膩的演出，接近結尾處一整個大噴淚。


  每一次與別人的接觸

  都是一個契機


  用聲音溝通同時心也在流動

  擴展原本狹小的視野


  讓你看到

  原來世界是如此的廣大美好


  --

  歡迎光臨我的部落格

  阿一一之詩意與電影的流動



  --'
