content: "《星之彩》\niTunes NT$90\n>> \n\n《霹靂戰士龍》導演理查史丹利 翻拍 H.P. 洛夫克拉夫特同名短篇，打入\n錫切斯影展主競賽！隨尼可拉斯凱吉發揮獨特演技，賦予面對掉進偏遠農\n\
  場的耀眼隕石，引發周遭一連串的詭異現象，並察覺自家人受此得到影響\n，鋪墊克蘇魯宇宙恐怖氣氛。\n\n《開心鬼上身》\niTunes NT$150\n>> \n\
  \n《與神同行》實力韓星車太鉉主演動人奇幻作，韓國院線賣破二百億韓元\n！經他扮演無依無靠的孤獨人士下決心去陰府報到，倒意外撿回一條命，\n更遭四名不速之客纏身。然而，為了滿足對方心願的過程，逐漸導向沒料\n\
  到的精采發展。\n\n《當男人戀愛時》\niTunes NT$190\n>> \n\n多金影帝黃晸玟、話題影星韓惠珍共演忘年戀愛片！個別由黃、韓當起討\n債人、欠債方，彼此展開愛情長跑。儘管有帶來被追者不太好受，卻不氣\n\
  餒運用真情化解隔閡，進而改變追求者原先待的處境。\n\n☆ 其他特價\n\n《騙徒》\niTunes NT$150\n>> \n\n《拉麵狂》\niTunes\
  \ NT$150\n>> \n\n《叛獄無間》\niTunes NT$150\n>> \n\n《終極勝利》\niTunes NT$150\n>> \n\n《阿諾是個模範生》\n\
  iTunes NT$150\n>> \n\n《魔鬼琴聲帕格尼尼》\niTunes NT$150\n>> \n\n《熔爐》\niTunes NT$190\n>>\
