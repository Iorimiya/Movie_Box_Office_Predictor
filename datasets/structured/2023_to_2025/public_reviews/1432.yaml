title: '[雷] 斷捨離天堂好雷心得'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  今天心血來潮去看了斷捨離天堂這部日本電影


  一開始看過簡介以為是一種介紹專業清理孤獨死清潔公司的沉悶故事


  結果出乎我所料的這部很好笑


  基本上電影的故事都圍繞在男主角律稀的身上


  他原本是一名專業的鋼琴家


  征戰鋼琴比賽優勝多年還累積了一些粉絲，還有交往長達11年的女友


  但這一切都在律稀生病雙手顫抖到無法達到演奏的水準之後


  通通都變卦了


  在女友得知她改當鋼琴老師之後把律稀給甩了之後


  律稀雖然在母親的關心建議下繼續擔任鋼琴老師直到手部顫抖的疾病解決了，律稀再回去擔

  任鋼琴家


  但律稀一邊上課一邊感到難過到流淚


  就在母親憤怒不滿的情況下


  改行進入斷捨離天堂社長的麾下


  擔任需要處理雜務的強健體力與能抵擋惡劣環境的堅強意志力的特殊清潔工的一員


  電影第一個case是單親媽媽的故事


  單親媽媽她年輕的時候擔任AV女優


  拍過很多3級片自己還有一整箱珍藏的絕版自己作品光碟


  由於自己被自己的親生兒子的老師們


  要求到學校參加家長面談


  女老師跟單親媽媽說一些她兒子


  在學校午餐都吃很多，學習上也有一些困難


  學校方面在關心學生的立場上


  想要跟單親媽媽提出家庭訪問的要求


  但是女老師被同樣身為女人的單親媽媽


  利用女老師身上噴的強烈香水味挑逗說


  香水噴這麽重是不是有男朋友啊


  四兩撥千斤轉移話題為了逃避家庭訪問的問題


  後來被男老師出來阻止了


  男老師代表學校方面強烈要求單親媽媽要進行家庭訪問


  單親媽媽強烈拒絕之後帶著兒子就逃跑了


  後來女老師的強烈拉扯下


  連哄帶騙的跟單親媽媽講要她停下來


  妳的錢包掉了


  單親媽媽才牽著兒子的手停下來


  要女老師把錢包還來


  女老師說當然是騙妳的


  一直盧單親媽媽要去她們家拜訪進行家庭訪問


  於是單親媽媽才受不了女老師的糾纏


  勉為其難的答應女老師的家庭採訪要求


  雖然這樣講而且單親媽媽還寫了紙條貼在牆上說是為了自己的兒子


  要把跟垃圾屋一樣的家裡打掃乾淨


  但是單親媽媽就是有心病做不到


  於是上網找了清潔公司當然還要有帥哥才可以


  斷捨離天堂社長就帶著律稀上門進行清潔工作


  他們工作的方式就很簡單


  帶兩個不同顏色的大袋子進行分類


  分類的工作請屋主協助進行分類


  因為只有屋主知道什麼東西她還想要留著或什麼東西不想留著


  社長會在清潔工作進行前用卡夾式錄放音機撥放音樂


  舒緩清潔工作的精神壓力


  很快的在單親媽媽躲在陽台看自己的小簿子跟抽菸的情況下


  就在女老師跟男老師登門拜訪家庭訪問之前把家整理乾淨了


  家庭訪問在乾淨的單親媽媽的家順利進行了才怪


  櫥櫃的門還是倒下裡面的雜物跑出來


  第一個單親媽媽的故事就在這尷尬的氣氛下轉黑落幕


  還有個小插曲


  社長有給服務過的單親媽媽建議


  如果要保持家裡環境整潔


  那建議可以多邀請兒子的同學朋友來家裡玩


  另外還有給單親媽媽參加服務後的抽獎活動


  她抽到一本清潔公司為背景的繪本故事書


  第二個故事


  菲律賓看護遠渡重洋到日本的老人院擔任看護


  在日本待了八年的時間


  受不了思念家鄉之情


  於是提出辭職了


  離開看護公司之後聘請斷捨離天堂來清理雜亂的租屋處


  準備歸還公寓回菲律賓


  等清潔工作完成之後


  律稀詢問菲律賓看護為何從兩年前開始囤積垃圾呢？


  因為一年前在菲律賓的母親過世了


  斷捨離天堂會收購一些雜物當中有價值的物品並把估價金額從清潔費當中扣除


  最後律稀一樣會拿抽籤桶給客人抽籤


  菲律賓看護抽抽到的是可以要求斷捨離天堂的員工免費15分鐘為他做任何事情


  菲律賓看護要求律稀跟他一起吃他去世媽媽八年前留下來的冷凍燒肉


  律稀就跟看護一起吃到時間到了還在吃


  第三個故事


  就是第一個故事的單親媽媽兒子的國小女老師


  她很用心在自己的教學上跟關心自己的學生


  例如跟同事一起上電視呼籲小學附近垃圾屋的屋主不要給別人造成麻煩要自律一點


  而且這個故事就點出為什麼單親媽媽會在意女好師香水噴太多了


  她有男朋友沒有錯


  但真正的原因是她住在垃圾屋裡面


  後來在她男友求婚之後給她訂婚戒指之後


  她男友強行要去她家看看她到底為什麼


  女老師接受她求婚後還不讓他進她公寓到底是有什麼秘密


  結果她男友一進門就被垃圾屋惡臭燻到吐


  馬上落荒而逃


  但她男友沒有離開小學女老師


  反而幫她聘請斷捨離天堂還幫她清理她的公寓


  律稀跟另外一位女職員一起來清潔


  只是女老師很奇怪不配合分類物品的工作


  而是要律稀跟女職員幫她分類要不要留下來


  途中嚇到女職員的事情是挖到死掉的寵物貓


  最後她男友來她公寓視看清潔情況


  律稀找到訂婚戒指問女老師要不要留著


  她男友看著女老師有什麼反應


  但女老師一臉看著律稀由你決定


  律稀就把訂婚戒指丟了


  女老師會這樣子是因為她男友強行改造她變成她心中的樣子吧


  然後清潔作業完成後


  律稀又給女老師參加抽獎


  女老師抽到雙人對打的玩具


  她帶到單親媽媽家讓她兒子跟其他同班同學一起玩這個雙人對打的玩具


  女老師還跟單親媽媽變成好朋友


  彼此能談吐心事跟互相照應


  第四個故事


  是關於垃圾屋的男主人的故事


  他走路一跛一跛的


  很討厭別人清理他家的垃圾


  還要攻擊跟阻止別人碰他家的垃圾


  至於為什麼男屋主


  因為自己的妻子過世了對她有很深的愧疚感吧


  社長為了幫斷捨離天堂拍廣告於是找了高中的舊識出來吃飯聊天


  想委託人家幫他拍廣告


  但是人家的條件是幫他處理掉父親的垃圾屋


  於是社長動員了斷捨離天堂所有的社員一起清理垃圾屋


  中間有好笑的插曲


  他們一邊清理一點尋找有超高價值的古董


  但事與願違


  有待你們去電影院欣賞這部好笑的故事吧


  很喜歡這部電影的部分是社長很照顧自己的社員


  就算社員要離職遠到東京發展


  公司全體他們會幫離職員工辦送別會真的很溫馨


  最好彩蛋有社長跟社員一起拍的斷捨離天堂的廣告


  要記得看到最後唷~~^_^


