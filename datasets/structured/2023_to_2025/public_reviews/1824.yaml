url: https://www.ptt.cc/bbs/movie/M.1676480809.A.2A3.html
title: '[好雷] 差點睡著 蟻人3(蟻人與黃蜂女：量子狂熱)'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  2015蟻人(MCU第12部)，預算1.3億美金，票房5.19億美金


  2018蟻人與黃蜂女(MCU第20部)，預算1.95億美金，票房6.22億美金


  2023蟻人與黃蜂女：量子狂熱(MCU第31部)



  保羅路德三部電影演出時的年紀：45、48、53歲，依舊能扛得起！


  不過歲月不饒人，就像甄子丹59歲，出演30歲的喬峰一樣


  感嘆這角色機會來得晚些，都不曉得下一部出演時，還能不能扛得起？


  保羅路德獨特的笑容、個人特質，讓蟻人這角色有種是特地為他而生的感覺



  蟻人1、2，算是MCU裡的小品，詼諧幽默輕鬆的調性，劇情流暢


  蟻人3有了征服者康，有別於前兩集的格局，原有風格不再



  征服者康，喬納森梅傑斯演技真的沒話講，心中大讚，漫威又選對人了！


  但角色在劇情裡有幾點，讓我不斷出戲


  (1)只能用言語好幾次的吹噓「時間」概念，欠缺抽象概念具體化的感受


  (2)剛開始作作手勢就要人命的強大，到後面能力展現一直被削弱，前後差太多


  (3)驚世駭俗的天才能力，自己發明的東西要靠別人修，也無法再造


  (4)像是大廚能做頂級美味佳餚，卻造不出一雙筷子供自己用餐(皮姆粒子)，

  真的是術業有專攻？



  凱瑟琳紐頓演出蟻人女兒凱西，電影看起來真的很不錯，十足美少女


  漫威不斷增加少年復仇者，也讓人很期待集結起來的效果


  但不小心看到凱瑟琳紐頓戲外一些照片，怎麼沒有電影那樣好看，咦？


  (翹翹的睫毛是分身？生硬，太搶戲了)


  復4原凱西飾演者「艾瑪傅爾曼」


  是在公布新凱西演員後才得知自己被換角，真是太慘了



  64歲蜜雪兒菲佛，蟻人岳母，熟女魅力十足，依然賞心悅目！


  保養得比在蟻人2時，更加動人


  時不時懷疑，全片多少地方用了特效？還是沒有？64歲怎麼那麼美！


  蜜雪兒菲佛在蟻人3戲分吃重，片名的黃蜂女，應該是指第一代黃蜂女了吧！


  封存30年的祕密，也許是生理需求的出軌，才不想多講


  很緊張凱西的量子訊息被征服者康發現


  可妳第二集結尾，不也是大膽讓朗恩回去採集量子修復粒子？那時不怕？


  量子領域的時間概念，真的不好拿捏


  第一代黃蜂女迷失在量子領域，外頭真實世界時間長達30年


  她在量子領域裡，也真的是體感30年，媽媽外表變阿嬤


  不是，量子領域時間這樣算？


  史考特朗恩被困量子領域，外頭真實世界5年，他的體感卻只有5小時


  這量子際遇太不公平XD



  二代黃蜂女，伊凡潔琳莉莉，三集演出年齡：35、38、43歲


  第三集己經有點顯老，明顯有別於前兩集的狀況，保養須向蜜雪兒菲佛請教


  整部電影像是不存在一樣的低存在感


  決鬥高潮時挺身出來，才拉回了一些感人、振奮



  麥克道格拉斯，三集演出年齡：70、73、78


  在電影裡奔跑時，都不小心在心中幫喊「其他人跑慢點！等等老爺子！」


  前兩集戲份很吃重，第3集也是只剩在決鬥時，出來秀一波而已



  魔多客，身份有令人驚艷一下，也就這樣，沒了


  蟻人1時達倫的喪心病狂凶狠，沒了


  取代的是爛到有剩，很糟糕的特效詭異臉，這是幾億美金投資電影該有的效果嗎？



  量子領域呈現，看完會有種，蛤？就這樣？


  幾乎就是原本正常世界，加些奇特怪異的粉墨裝飾而已，沒太多出奇驚人的點，


  想像力平平，很多還是建構在人類原本已知、習慣的模式，


  被原有世界已知概念束縛，欠缺突破性的想像力發揮，


  到牆上了，卻再也翻不過去的感覺


  又或者是，被這類奇異電影養得胃口太大，對創新的期待、要求太多



  電影前半，劇情發展算是快的，但有些點卻是感到生硬、話太多的緩慢不精簡


  父女教養矛盾、蟻人被逼喝翻譯紅汁、比爾莫瑞舊情人等都感覺處理不細膩？


  前面一度快睡著，所幸後面決鬥拉起一波小高潮


  前兩集父女情深，凱西從小孩變青少年的叛逆原因匆匆帶過，很難投射同理


  或然率風暴時萬眾一心的蟻人塔，「只為了凱西」


  其實是很容易感動的點，只是前面氛氛烘托處理太不好，感覺就少了那麼一點味



  保全三人組，沒有


  前妻二人組，沒有


  輕鬆詼諧、話癆搞笑，少了，大部分也是尬尬的


  縮小時和大東西互動的慢動作特寫，第3集似乎也沒有印象有


  前兩集的優點，很多都消失了，可惜


  如果蟻人跟黃蜂女留在量子領域，結局停在這裡，會不會好一點？



  兩個彩蛋，沒看電影前，這兩個彩蛋被報導吹捧得多厲害，害我很期待


  彩蛋1、一群變體康聚結，原本就知道法老康這些，所以沒太大驚喜


  等了長~長~的片尾人員、廠商名單過去


  彩蛋2、洛基跟莫比烏斯亮相，看過洛基影集，也沒太大驚喜


  寧願有人用文字告訴我就好，看完兩個彩蛋，真的還好


  進戲院確實能提高觀影感受，整體還是很享受(死忠的，沒辦法)



  不少人會覺得漫威越來越難看


  或許是因為MCU實在太成功，大家的期待心理就很高，


  有一定穩穩的票房，還不拍爆，一直拍


  2008-2022


  30部漫威電影，282.77億美元票房，平均每部9.43億美元


  漫威漫畫改編電影，在一定的架構上去呈現、去突破


  不知是影迷胃口變大還是期待太高？還是漫威真的再也翻不過去高牆？


  復4高峰後，評價就下滑


  (前一部，驚奇隊長也是託復4的福，才有高票房，不然也是平平之作)



  就等下一部《星際異攻隊3》吧！還是很期待！


  (要準備帶衛生紙進去哭？)


  剛看完新的，就像連續劇等下一集一樣心情，只是還要等到5月初，太久了！


  一個月一部漫威電影，也很可以



  --


  寫錯XD，感謝提醒



  有道理



  我也差點睡著XD'
