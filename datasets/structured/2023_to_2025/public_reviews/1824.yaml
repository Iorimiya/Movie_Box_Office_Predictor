url: https://www.ptt.cc/bbs/movie/M.1676519230.A.3F7.html
title: '[負雷] 蟻人3:量子狂熱-第五階端踉蹌的起步'
content: "無雷部分\n凱西真的很正，IMAX下的量子領域還蠻壯闊的\n(雖然用壯闊來形容量子領域很微妙lol)\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n量子狂熱作為多重宇宙神話的重要鋪墊作品\n\
  終極大反派康的塑造卻是失敗的\n你要說他是個多麼恐怖的征服者，毀了多少人的家園\n但這些都只存在腳色的簡單幾句對白，與一次襲擊裡\n\n這部電影把量子領域拍得太大了\n\
  讓康的極權統治顯得非常微不足道\n他或許控制了部分區域\n但量子領域看起來還有非常大的空間足夠大家分享\n並且劇情並沒有花太多時間去描寫康的統治到底差在哪?\n\
  是啦，台詞中他毀了一些人的家園\n但這充其量只是個土霸王，而不是威脅所有生命的危險存在\n\n你讓珍妮特摸到多重宇宙核心然後看到幻象\n卻又不好好把幻象演出來，我真的感覺不到他危險在哪\n\
  畢竟我們可是已經見過薩諾斯與他的軍隊能造成的傷害了\n薩諾斯本人的戰鬥力也絕對輾壓本片的康\n\n我們姑且不論薩諾斯在無限之戰前只是一個屁股黏在椅子上\n只出一張嘴的阿宅\n\
  \n在無限之戰中，他初登場就打趴了復仇者中單挑戰力頂標的浩克\n手下的薩諾斯之子雖然戰績不佳，但在1打1的狀態中也幾乎都能壓制復仇者\n\n但康威壓感最強的，卻是把史考特關在監獄裡威脅的時候\n\
  後面每況愈下，雖然有展示出他一人打暈蟻人跟黃蜂女\n不過也只是打暈而已，兩人醒來後就沒事一樣的反攻了\n\n他的手下也是清一色無臉雜魚，外加一個笑話魔多克\n\
  外加沒多花時間描寫他的高壓統治手段\n這讓他的\"王朝\"相當蒼白無力\n也讓我心想量子領域的人抗壓性是不是特別弱\n畢竟這康的統治看不出恐怖在哪(都長在角色嘴巴上)\n\
  不喜歡被他統治你也還有很多地方可以逃啊\n\n更別說最後反抗人民入侵時，他雖然曾一度反殺\n面對一般人是一炮一個，但打在史考特身上變抓癢一樣\n更別說但後來螞蟻大軍淹過來以量取勝他就直接敗下陣來了\n\
  \n我知道，這個結局很蟻人\n\n但問題是你想描寫的是多重宇宙神話的大魔王\n這個下場瞬間讓他的強度變得非常可笑\n\n後面失去戰衣的加持後，空有一身肌肉\n\
  打一個弱雞史考特卻半天都打不倒也是掉漆\n當然你可以反駁說，這是所有康裡最弱的那一個\n弱一點也是可以接受的\n\n但就為未來鋪墊的角度來說，這個反駁就不太聰明了\n\
  \n1.這傢伙並不強，所以我們能夠打倒他\n跟\n2.這傢伙強的不像話，我們好不容易找到契機才打倒了他\n\n怎麼想2都是對一個多重宇宙大魔王比較好的描寫\n\
  但是本片演起來是1\n\n當然，本片對於主角們的刻畫扁平也是劇本差的一個原因\n\n從預告來看，我會以為史考特對失去與凱西相處五年的時光很遺憾\n而這點被康用來迷惑或誘惑他\n\
  \n但並沒有，史考特從頭到尾都是同一個史考特\n沒有任何成長與改變\n\n甚至連開頭稍微點到的他是否被名氣沖昏頭，忘了身為英雄的意義\n都真的只是點到為止而已，他本人並沒有為此作出反省跟改變\n\
  他對抗康只為了救回凱西，與量子領域的人過得好不好一點都無關\n\n荷普也就是一個完美好阿姨，在現實世界裡幫助世人\n還對凱西視如己出，跟漢克一起當寵女魔人\n\
  對史考特也是毫無保留的愛，奮不顧身的相挺\n沒有任何可著墨挑剔的地方，也就顯得很無趣\n(一段真正的關係應該會有點價值觀的碰撞與爭吵吧?)\n\n漢克腳色跟前兩集完全不連戲\n\
  和藹可親的漢克爺爺\n不該是這個尖端科學家與前代蟻人展現的唯一面貌\n但本片就是選擇這樣做了\n\n除了對量子領域嘖嘖稱奇外，大多時間都在放空\n甚至連珍妮特流落量子領域時找炮友他也沒啥反應\n\
  很想跟他說一句:\"先生，我們在拍片\"\n\n\n珍妮特也跟前坐不連戲\n明明上集最後，她參與讓史考特進量子領域收集能量的實驗\n也並沒有任何反對或不悅\n\
  這集她卻一聽到量子領域就大發神經\n卻又死都不把話講清楚\n(我相信他們找人的過程絕對夠講完這一切)\n\n凱西的表現相對上符合腳色，又賞心悅目\n本來是沒啥好挑剔的\n\
  硬要挑只能說這集特地把她的童年夢饜拉回來用\n卻又沒有啥突破心魔之類的描寫\n稍嫌可惜\n\n但這腳色本該是史考特的感情驅動\n是史考特超越自我(因為父愛而激發更大的鬥志打倒康)\n\
  甚至做出重大抉擇(犧牲自己拯救女兒)的理由\n卻因為劇本沒有多花時間打磨塑造兩人的關係\n而顯得空虛\n\n史考特本來就很愛小凱西\n就算凱西變大了不聽話也一樣愛\n\
  所以這段關係沒有任何成長與變化\n明明五年的差距能有很多空間發揮\n能讓這部戲更加昇華\n\n但沒有，因為我們是輕鬆愉快的蟻人系列\n所以就讓我們把一切都變得卡通、滑稽、沒有後果\n\
  \n就算最後荷普為了史考特回到量子領域\n並為了打倒康而把出口關上了\n也沒有任何的緊張感\n\n因為可愛的凱西會馬上重啟出口\n不讓你有一絲絲擔心他們回不去的機會\n\
  但同時也讓史考特前面對凱西的捨身一推\n與荷普的回來變得毫無重量\n\n既然有人在對面就能隨便開門\n你們留個漢克或珍妮特在現實世界\n其他人全都回去圍毆康不是更直接了當?\n\
  \n我對這部戲的最後評價\n就是該大的地方不大\n(譬如康的統治，與史考特跟凱西的感情描寫)\n該小的地方不小\n(珍妮特與量子領域人的互動都蠻雞肋的，包括比爾墨瑞)\n\
  \n最後補一個觀賞中不斷想吐槽的點\n在不斷縮小才能抵達的量子領域裡\n大小怎麼還會有個標準呢?\n\n譬如說史考特最後對凱西說\"你跟哥吉拉一樣大\"那邊\n\
  我心想，你們本來的大小比這個大上不知道多少倍\n怎麼不變的再大點再進攻呢?\n我看史考特在裡面變得更大或更小都沒啥代價啊\n所以有需要在那邊瞎忙嗎?\n\n史考特再變大幾倍，把康的堡壘變得像顆彈珠一樣\n\
  一捏就爆，再來幾萬個康也微不足道吧?到底?\n\n--\nPS.我是個對漫威標準很寬容的人\n   連在板上被噴爆的雷神4我都能找到好雷的理由\n   但量子狂熱真的不太OK啊\n\
  \nPS2.我好像忘記聊聊魔多克了\n    或許是我的腦袋在幫我自動遺忘\n    魔多克面具下的那張臉真的讓人難以直視\n    這個恐怖的CG特效將來應該會在YT上不斷被拿出來檢討\n\
  \n    魔多克在漫畫中是個看起來滑稽，但仍相當有威脅性的角色\n    但在這部電影裡成為了一個純粹的腦殘(非人身攻擊)丑角\n    編劇甚至沒想過他不應該知道史考特是復仇者\n\
  \    仍然讓他死前用生命演出了那段笑話\n\n    連死都是個笑話，我們真的走到這地步了嗎?\n\n以上\n\n--\n應該說，魔多克不可能知道史考特是復仇者\n\
  以蟻人1的時空背景，復仇者應該就只是那一小撮人\n當然也就不會產生那段談話\n你說的對白應該確實有發生，但我真的很難這樣去聯想到最後那個笑話\n又不是說他看過終局之戰(感覺打過那場的都可以自稱復仇者lol)\n\
  以蟻人1的時空背景，不該有一起戰鬥過就是一員的想法吧\n我不就這點去反駁，就當我純粹非常討厭那個時間點的那個笑點"
