title: 'Re: [大負雷] 【蟻人與黃蜂女：量子狂熱】是AI劇本吧'
content: '應該說  現在的編劇很偷懶  用一個萬用公式套到所有漫威電影  卻沒有安排合理性


  那個萬用公式來自一本書  先讓英雄救貓咪.


  先說這本書的確分析的很好  但是他是把好劇本拿出來解析


  現在的劇本則是  幾分鐘了  主角該推進到哪邊


  XX分該讓主角陷入危機  XX分反派該出現  XX分主角開始逆襲  收工.



  但是完全忽略了劇情的合理性


  蜘蛛人無家日也有同樣問題  會發現  幹怎麼突然某個重要配角就掛了  死的莫名其妙


  這就是為了推動劇情而推動劇情.


  或許以後給chatGPT來編劇還能編的正常一點


  至少AI可以快速生成一堆劇本從裡面挑出比較正常的劇本


  --

  莫欺少年窮, 莫欺中年窮, 莫欺老年窮,


  最後來句人死為大入土為安, 你這輩子也就這樣了.


  --

  跟以前國小寫作文會教你用起承轉合一樣  有人寫出好文有人寫出廢文'
