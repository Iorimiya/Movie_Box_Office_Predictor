url: https://www.ptt.cc/bbs/movie/M.1676700237.A.1A6.html
title: '[負雷] 極不推薦的蟻人3'
content: '漫威給我的感覺一直以來都是


  1.喔喔喔喔，好酷




  2.靠～太帥了吧




  3.嘿嘿...好正喔>\\\\<




  4.劇情什麼的，不要太離譜都能接受


  5.每個有趣的小故事，拼成一個有趣的大故事


  就沖前3點，讓我覺得漫威就是要去電影院看才好看，而且還要看imax 才爽



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  ————————以下有雷————————


  。

  。

  。

  。

  。

  。

  。

  漫威原作是個有趣的故事

  然後電影賦予它帥爆的外觀


  加上滂薄的音樂


  看漫威電影成了很棒的享受



  拯救漫威的小羅勃道尼



  芋頭人薩諾斯



  突然




  尚氣的皮衣




  黑豹的鋼鐵之心




  然後這次的


  征服者康





  ？？？



  還以為我在看金剛戰士




  齁齁齁

  氣氣氣氣氣氣


  我還看luxe 3D!


  原來的美術組是走光了嗎！


  整部片看到快睡著好幾次


  只有快結束的後5分鐘！


  五分鐘


  就他媽的5分鐘！


  我才以為我在看漫威電影


  真的氣到彈出來


  齁齁齁齁


  然後一堆莫名其妙的劇情演很久

  需要讓人知道的東西卻又幾句話帶過

  根本在看DC鋼骨


  本來以為黑豹2的戰鬥夠荒謬了


  原本所有人一碰就死的光線

  在蟻人前面可以抗好幾發


  就像你本來以為要跟埼玉老師打


  突然變成龜仙人



  啊啊啊啊啊啊啊

  氣到



  最後話


  以前看完漫威

  整個廁所都在說哪一幕超帥的

  哪一幕超酷，不然就說哪裡很好笑


  這次廁所一群人超安靜...


  ...


  .



  然後凱西很香

  真的很香

  XD



  （以上圖片抓自網路。如有侵權請告知，我會手刀下架）


  --'
