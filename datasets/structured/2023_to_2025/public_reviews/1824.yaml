url: https://www.ptt.cc/bbs/movie/M.1676902473.A.D9C.html
title: '[好雷] 蟻人與黃蜂女:量子狂熱 比想像中好看'
content: '看之前在板上一片普雷負雷 我還想說有到底有多不好看


  今天去看了以後..... 沒有不好看啊.....


  甚至比黑豹2、尚汽、永恆族都好看 打鬥場面也精彩


  蟻人3這次的世界觀也很精彩


  黑豹2那個打鬥真的讓人發笑 我就不說了 場面真的小到可憐


  尚氣還行 但世界觀我完全無感


  永恆族對話超冷 每個對話都又臭又長 看一半看不下去



  蟻人3劇情有頭有尾 有世界觀 有打鬥 有正妹


  甚至彩蛋也算精彩 至少不是什麼自己為搞笑的彩蛋



  覺得不要被板上的負雷騙了


  甚至一堆水管主也在那邊失望 黑豹2那種打鬥才該失望好嗎



  大推我婆凱西！！





  --

  跟黑豹2 永恆族比 是還行沒錯

  不講別的 光縮小放大就比黑豹2精彩了

  那邊也不錯'
