url: https://www.ptt.cc/bbs/movie/M.1677076852.A.041.html
title: 'Re: [大負雷] 【蟻人與黃蜂女：量子狂熱】是AI劇本吧'
content: "防個雷，先說我是覺得黑豹2＞雷神4＞蟻人3\n然後媽的多重宇宙我覺得是神片(理由有機會可以分享\n---------------------------------------------------\n\
  \ \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n這部缺點真的太多 中間有一大段跑來跑去很尷尬\
  \ 太多無意義的對話\n \n然後父女的情感前面沒有複習或鋪陳 後面強調的時候就很廉價\n \n反派強弱不一致 最後突然跑出一群超進化螞蟻 很出戲\n \n螞蟻要出來不是不行\
  \ 一開始就要出來 然後最好漢克單獨烙單跑這條 最後再會合\n \n蟻人打架沒有很好看 應該要很有速度感 史考特都一直強調跳再揮了\n \n不過還是有幾個印象點\
  \ 一堆蟻人一起拯救女兒那顆鏡頭很不錯 但情感很廉價\n \n還有看的出來編劇想要用小人物貫穿整部電影 但真的太公式化\n \n女兒站上去演講我就知道要提他爸了\
  \ 但這也沒關西\n \n只是觀眾根本不知道女兒對於他爸是抱持甚麼想法  是很仰慕嗎還是很尊敬 不知道\n \n所以很難被感動到  甚至電影裡史考特對自己是小人物還是英雄\
  \ 也沒有多著墨 很可惜\n \n \n最後我心中漫威第一名是復3 爽片的頂點\n \n光是每個英雄登場跟會合都是高潮 很難有能複製的電影 甚至不用說打戲還拍得精彩\n\
  \ \n電影節奏 在與反派爭奪寶石跟英雄登場打架之間 完全沒有斷檔 有夠過癮\n \n就醬 抒發一下我的想法  畢竟剛看完也是氣死\n \n--\n \n黑豹2我倒覺得\
  \ 有很多拍的不錯的地方\n電影融入南美洲羽蛇神文化 很迷人\n後半段節奏很亂 問題也不小 但就像你說的\n帝查拉死掉真的差很多 真的不好評價\n可以理解進場看漫威就是\n\
  想得到一部精彩的爆米花片\n好好放鬆一下 而不是沈重的劇情\n可能黑豹對我來說就是贏在\n情感跟故事營造 比蟻人real吧\n黑豹從1就喜歡走八點檔\n雷4對我來說廢到笑\n\
  可能watiti很白爛有打中我\n我覺得中間再多一段\n給珍跟雷神會比較好\n最後不要突然冒出可以許願的門\n解決電影問題 頭很痛"
