url: https://www.ptt.cc/bbs/movie/M.1676507837.A.A68.html
title: '[普雷] 蟻人3量子狂熱 弱智的智力反派'
content: '雷文防雷資訊頁















  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  喜翻25down的 可以看凱西

  喜翻25up的 可以看珍妮

  至於那個黃蜂女...真的不知道出來做什麼的..



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  雖然是蟻人一家的歡樂大冒險

  但說實在 應該沒有人關心蟻人一家的命運

  更不會有人關心量子世界的未來

  大家想看的 都是讓我康康吧


  康康一出場在回憶的戲 表面誠懇溫柔

  實則充滿了不為人知的過去

  的確有展現智力反派的架勢

  讓我一度以為齊默男爵mkII要出現了

  到首次面對蟻人

  康康一展現能力 就是壓到性的

  完全不下薩諾斯

  齊默+薩諾斯

  根本就是一個完美的反派啊!


  但到了電影後半

  當編劇決定要開始收一個身在巔峰的智力型反派的時候

  常見的窠臼就出現了

  智力型腳色開始嚴重失智

  退化成只靠拳頭暴力型腳色

  但一開始鎮壓全場的暴力 竟然也一個主角群都殺不死

  堂堂穿越無限時空的康康

  就這樣被蟻人一家歡樂的幹掉了..


  雖然很多很多的康 看起來很厲害啦

  但我只想知道

  看完2025年復仇者聯盟六<秘密戰爭>的 未來版的康康

  應該知道他是一定會輸給復仇者聯盟的

  那為什麼連KD的大招「打不贏就加入」都學不會呢?

  看到蟻人出現 根本應該第一時間立刻加入復仇者聯盟才對吧..

  沒有智力的智力型魔王

  變成除了命多(無限康)沒有其他特點

  只能一直死 各種死

  幫康康寫個慘字


  --'
