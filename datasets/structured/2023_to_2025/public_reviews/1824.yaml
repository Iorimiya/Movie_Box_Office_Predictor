url: https://www.ptt.cc/bbs/movie/M.1684475841.A.859.html
title: '[  雷] 蟻人與黃蜂女：量子狂熱'
content: '防雷






























  我先說結論：我是喜歡他的,沒這麼糟啦

  他提供了穩定的娛樂性,至少我不覺得無聊

  在第四階段幾乎大爆死的狀況下

  我是覺得他已經是最好看的了

  （第五階段才沒多久先不計

  而整體他應該算是中段班吧


  蟻人ㄧ行人的角色我是覺得還行啦

  漫威電影我從不要求把角色塑造的多有血有肉

  有個樣子就好了,尤其是他們已經退步這麼多

  至少父女之間的關係是讓我感興趣的

  而且兩人都進過監獄好幾次也很有趣

  蜜雪兒菲佛還是好美,以這個年紀來說

  他在疤面煞星真的是女神到不行

  但麥可道格拉斯我就覺得不太行

  完全變成路人角色,欸要當薪水小偷也不是這樣的吧


  當然他還是囊括各種漫威式缺點

  不過我幾乎都不覺得有到很嚴重

  真的比較嚴重的無疑是魔多客

  一開始全身機械的樣子很帥

  但露出臉之後……好喔.我無言以對

  如果能接受他是丑角也許這樣還好

  但不能接受,那魔多客會是你討厭這部電影的主因

  我是不知道該不該接受,看久了其實有點…憨厚老實？


  也有人提到康的強度,這邊我倒有些見解

  以一個大魔王來說他打的差強人意

  給人的絕望感不是太多(至少我看時沒有緊張感

  但他只是其中一個變體,那這樣其實還說得通

  這麼多分身一定有比較不強的啊

  而且強度也是要循序漸進的好

  薩諾斯也不是一開始就展現其實力的

  總之康我是覺得還不錯,但現在要換誰演呢？


  整體而言我是喜歡這集的

  至少邏輯丟掉他就是不錯的爆米花電影

  這也跟第四階段太弱有著很大的關係

  老實說我已經忘記以前追漫威的興奮感長怎樣了

  不過就算緩慢,有在慢慢恢復也好

  希望接下來的秘密入侵不要被亂搞

  雖然我女浩克都還沒看,唉我不知道該不該看

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  萊斯特在最後敘述中講述了生活中有意義的經驗，他說，儘管他死了，他還是很高興，因

  為這世界上有這麼多的美


  --'
