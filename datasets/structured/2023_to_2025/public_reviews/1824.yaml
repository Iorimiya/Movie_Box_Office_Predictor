url: https://www.ptt.cc/bbs/movie/M.1678526737.A.E25.html
title: '[超負無雷] 《蟻人與黃蜂女：量子狂熱》'
content: '板上已經一堆負雷了

  我還是選擇去看

  所以我是智障，大聲罵我是「智障去看什麼蟻人3」我都不會去檢舉

  這次連海報都懶得貼了


  我以為黑豹2已經夠難看了

  結果作為第五階段開頭的蟻人3更難看


  原本想說

  結果劇情胡搞瞎搞鬧到根本不讓人睡

  尤其是那些特效產物粗糙之至

  讓人眼睛視覺疲勞到真的完全無法入睡

  我感覺下週去看看沙贊2的特效說不定還能洗眼睛


  尤其是魔多客……我……唉……

  聽說是經典反派啦，在遊戲裡也常看到啦，然後在蟻人3裡……☺


  搞得我現在期待下一片漫威電影反而是《尚氣2》了(回歸迪士尼的《死侍3》我還不太敢期

  待)

  說不定預期中的DC漫威交叉還真的會出現……之前有人說漫威還有X戰警、驚奇四超人之類

  的可以玩，我倒是不覺得迪士尼能玩出什麼新花樣來了……


  我希望真的吼，漫威能重新玩好一點，多讓導演發揮個人特色有什麼不好的……


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
