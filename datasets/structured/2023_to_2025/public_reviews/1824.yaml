url: https://www.ptt.cc/bbs/movie/M.1676730917.A.5E0.html
title: '[  雷] 蟻人3 量子狂熱'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  很少看電影


  因為很討厭看到爛電影浪費我寶貴的時間


  去年 TOP GUN很讚   去年的鬼滅也很讚


  去年的奇異博士我很失望(本來是最期待的片)


  今年灌籃高手很讚



  終於輪到這一片蟻人3了


  天啊


  真得慘不忍睹


  好幾次差點看到睡著


  劇情不緊湊


  笑點很低


  邏輯很多地方不通


  打鬥也沒啥好看


  在這麼已經乏善可陳的情況下


  還要外送一堆 LGBTQ 的暗示


  真的夠了



  今天九點醒來


  本想多睡一點


  想想十點有一場可以看


  就免強自己爬起來走路到家旁邊看 IMAX


  人多就算了


  但真的劇情很不行啊


  而且椅子震動的邏輯  也大輸去年的鬼滅之刃和TOP GUN


  中間不小心看到度估兩次



  為什麼復仇者系列電影會墮落到這種程度....


  早知道今天就開車去宜蘭吃吃喝喝


  有夠後悔把時間浪費在這部片上


  猶豫要不要看得  勸你放棄


  這是一部我連在飛機上可能看10分鐘不到就會跳掉的片




  最後推薦前陣子我搭飛機看到 阿湯哥的明日戰記


  真是太好看了  以前怎沒看過


  --'
