title: '[普雷] 蟻人與黃蜂女：量子狂熱'
content: '片名叫：蟻人與黃蜂女：量子狂熱


  所以我說那個量子狂熱呢？




  首先，本片特效足夠華麗，主角群經過的各地區帶著五顏六色，就像是奇異博士系列


  製作群帶來相同的花花綠綠感覺，比起黑豹2瓦干達以及塔洛坎環境是賞心悅目多了。




  那些主角群進入了量子領域，等等~你說那裡是量子領域，我怎麼覺得就是一顆新發現


  的星球，每個生物從漫威電影出現的宇宙及世界觀裡都可以猜到在某個星球上會有這樣


  的存在。就是說編劇寫了量子領域，實際上它是在塑造一個外星星球世界而已，所以我


  說...那個量子狂熱呢？




  還有這個「征服者康」很弱呀，被迫留在領域裡經營了一個帝國，手下只有一個魔多客


  對主角具有威脅性，其他全都是泡泡面具士兵。而且這些士兵超級弱小的。


  珍娜對「征服者康」想逃出量子領域一事相當害怕，片尾也看到經過時間變異管理局事


  件後的洛基看到另一個「征服者康」也很恐懼。但是這個認識珍娜的「征服者康」看不


  出強度，就一張嘴時間時間的~或是在某時曾經打過復仇者之類的...




  對比一下，薩諾斯在復3開頭先來個下馬威，兩三拳就輕易打倒浩克告訴觀眾他很強~~


  之後隨著拿到愈多無限寶石，帶給主角們的絕望感就愈深。薩諾斯不只自己很強，四


  名部下就算觀眾不記得名字，也多少記得四人的造型以及他們給復仇者聯盟的干擾。




  蟻人3的前半段劇情在極其亮麗的背景下，漢克家庭和史考特&凱西找尋著離開量子領域


  的方法還有慢慢了解「征服者康」是怎樣的人。漢克家庭和史考特&凱西每個人都有發揮


  空間之外，其實劇情有點無趣。


  但是後半段從「征服者康」要求史考特去拿回太空船的能量核心開始，劇情就變得進展


  很快，看到成千上萬的史考特跑來跑去真的很好笑。最後史考特變大變超大也很好玩。




  不過「征服者康」的想法也很特別，重點是「征服者康」自己趕快離開量子領域，他卻


  要把武器&士兵打包帶走，拖著拖著等到蟻人+遲到的螞蟻軍團駕到，是對呀不對？





  結論就是有空時可以看看，對了~蜜雪兒菲佛在蟻人3很漂亮。





  --

  不是 這個是被其他康丟到量子領域的康'
