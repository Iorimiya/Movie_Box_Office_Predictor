content: '裡面最想吐槽的是小兵


  羈押人質能力根本是零


  可以好好的押好人質嗎


  至少上個手銬或是至少派個一隊十幾個人


  搜身也是必要的 誰知道身上還藏什麼武器


  人質在手 只贏不輸阿


  你看看你 你看看你




  那好吧 手上還有人質二號老奶奶


  現在老大我沒空 把人押下去


  一樣是派兩個小兵


  一樣是散步逛街模式


  不然你起碼讓她走前面避免偷襲ㄚㄚㄚㄚ


  結果老奶奶比葉問還能打 打完三個 沒啦???




  整個帝國只有老大自己一人能打 後營一直失火


  關鍵還輸給蟻海戰術 征服者??




  看起來就像玩無雙選軍師 要打又不太能打


  只靠玩家一人四處奔波打到一半 人還沒死整局就莫名其妙判輸了


