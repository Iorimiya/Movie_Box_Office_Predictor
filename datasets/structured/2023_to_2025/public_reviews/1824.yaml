url: https://www.ptt.cc/bbs/movie/M.1676438420.A.488.html
title: '[好雷] 蟻人與黃蜂女:量子狂熱  劇情細節雷'
content: '雷文防雷資訊頁


  整體挺不錯的 還算是保有蟻人系列的歡樂感


  但是還是會有些壓迫跟緊張感


  跟預告相同 整體故事都是發生在量子世界裡面


  不過預告實際上透露出來的劇情其實算是個誤導


  所以在看之前不會因為預告而得知故事全貌


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~












  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  預告給人的感覺就好像是凱西學壞了


  史考特為了彌補沒跟女兒在一起的時光而跟康達成協議而做出一些決定


  至少這是我單純從預告裡面的資訊腦補出來的劇情


  正片則是因為女兒凱西覺得爸爸史考特身為復仇者聯盟


  但是每天只會在那邊裝B以及賣書出有聲書 卻沒有實際對於社會做出其他的貢獻


  而且還一直活在自己拯救了世界的過往光榮中


  凱西的個性則是因為幫助弱勢發聲抵抗權威(警察) 把警察車變小才被抓去關


  並不是真正學壞了而做了真正的壞事


  之後透露出凱西在家人消失的五年間為了找到量子世界的爸爸


  用了漢克的筆記本做了可以觀測量子世界的機器


  像是一個迷你版的哈伯望遠鏡的功能


  這樣就不用實際進入量子世界但是又可以捕捉到裡面的信號


  在示範的時候發出的訊號被量子世界的戴倫捕捉到信號


  沒錯 魔多克就是戴倫 也是康的手下


  不過他也有點算是搞笑擔當 不是真正的那麼邪惡


  最後還幫忙了主角群打敗康而身亡


  量子世界的設計讓人覺得跟星際大戰頗為類似


  但是大部分的場景都簡略帶過沒有太深入的細節


  這部分依照大部分這類型的電影


  康身為一個征服者到處壓迫原本的住民


  所以有反抗者集結要做革命


  主角群進入量子走散了分為兩組人


  漢克家庭一組 史考特/凱西一組


  在戶找雙方的過程認識了量子世界的狀況以及珍娜的過往


  原來康在被流放到量子世界的時候是珍娜救了他


  但是當下的康只有說自己在旅程中太空船墜毀導致卡在量子世界


  而且裝做一副好人樣 身上也沒有任何裝備


  最後在珍娜的幫助下修好了時空旅行船 康也拿回了原本的裝甲


  但是過程中珍娜得知了康的過往以及目的


  用了皮姆裝置讓太空船的能量核心變得巨大 讓康無法離開


  之後珍娜逃離以及協助訪抗軍對抗康 之後被誤入的史考特救離


  這邊就交代了珍娜當初回去後沒跟家人說的事情


  回到現在線


  康抓到了史考特/凱西兩人就是因為史考特有辦法變小進入能量核心


  也有皮姆裝置讓能量核心變回原本的大小 好讓康可以繼續他的時空旅行


  預告看到的很多蟻人也不完全算是平行宇宙的蟻人


  是因為史考特靠近能源核心後會受到影響 每個決定都會產生一個他自己的分身


  雖然每個分身都有對於這個目標都有不同的疑慮 但是他們最終的目標相同


  都是希望拯救自己受到康挾持的凱西 所以最後還是同心協力來達成這件事情


  這期間候普也找到了史考特來幫他一把


  最後經歷了一番大戰後 康被打敗(?) 因為康被能源核心吸入而不是真正死亡


  我覺得之後還是可能有一定的再次出場


  眾人回到現實的世界


  片尾有兩個彩蛋


  第一個是帶出了康的王朝 一個康招集了所有平行宇宙的康


  這裡應該就是為了漫威第五階段做鋪陳


  第二個則是洛基跟莫比斯在1901的時候找到了偽裝成Victor Timely Powers的康


  這邊應該是為了影集洛基2去做一個前導


  整體來說我覺得這部算是漫威近期比較好看的作品


  作為一個第五階段的前導也相當不錯


  也還是建議先補充看一下影集洛基會比較看得更明白一些


  --'
