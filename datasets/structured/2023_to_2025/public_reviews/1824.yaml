title: '[大負雷] 【蟻人與黃蜂女：量子狂熱】是AI劇本吧'
content: '想說簡單寫一下這部的感想，卻發現想批評的還真多。

  -


  【蟻人與黃蜂女：量子狂熱】講述蟻人史考特朗恩一家人被吸入量子領域後，


  強碰上當地獨裁者-征服者康，他們必須擊敗他才能重回自己的世界。

  -


  對我來說【蟻人與黃蜂女：量子狂熱】是徹頭徹尾的糟糕，


  它的劇情、世界觀、角色、為MCU下一階段奠定的基礎，


  每一個層面都能挑出一堆毛病。

  -


  簡述一下劇情，


  開頭是蟻人很享受自己現在的生活，美中不足的點在於自己和女兒有一點小代溝。


  回到家，一家人看女兒做量子實驗的demo，不小心被吸入量子領域。


  主角群分成兩批人馬，有血緣關係的剛好聚在一起（？


  蟻人父女很快理解到這世界是被一個獨裁者統治，反抗軍正在起義。


  另一批主角的行程比較chill一點，還能去酒吧點能喝醉的飲料，但也馬上陷入危機。


  中段蟻人和康碰頭，並威脅蟻人去拿到某個很厲害的零件，


  好讓他重返原來的世界，不然女兒可就慘了。


  接著兩批主角們碰頭！拿到零件！康食言！


  啊，是時候讓反抗軍vs免洗複製小兵的大戰開打了，


  因為這年頭商業大片的第三幕都該這樣演，


  然後康被一堆高科技螞蟻圍毆，耗掉他大多的技能和血條，


  最後蟻人和康進行肉搏決鬥，兩人血條看似都快沒了，黃蜂女跳出來給康最後一擊。


  重返人間後，蟻人又開心回到自己的小確幸生活。

  -


  編劇有不少地方都很偷懶，隨便舉例幾個，


  像阿嬤碰到康的機器能接收康的記憶，好讓阿嬤能知道康的真面目，


  量子領域的居民被康欺壓也只透過台詞交代，更別說後面的螞蟻大軍有多讓人傻眼XD


  除此之外，量子領域的世界觀沒有好好刻畫，讓它看起來只像是一般的外星球，一點特色

  都沒有。

  -


  角色刻畫也很糟，有人說這部有著真誠的情感核心，但我真的感受不到，


  蟻人和女兒的情感理當是核心，兩人一開始小吵架，


  照理講電影應該藉由冒險過程中的互動來化解彼此的衝突，


  結果這部分卻輕鬆帶過，我真受夠漫威一定要講笑話的風格，尷尬死了。


  這樣的作法連帶影響到蟻人這角色本身的刻畫，跟後段劇情的力道，


  即便知道蟻人做的一切都是為了女兒，但明顯打動不了觀眾。（至少我沒被打動

  -


  這部MCU電影還背負一個重要使命，就是介紹康這個大反派。


  然而Jonathan Majors演的康看起來多嚴肅、多有威脅性，就顯得他的結局有多蠢。


  電影提到他有操縱時間的能力，但卻沒有實際演出來。


  他在這部裡的能力只有操縱跟發射能量束而已，


  然後被螞蟻圍毆真的蠢到不行，我真的不知道自己在看什麼。


  唉…演員真可憐…

  -


  看到有板友提到很多場戲都有話劇社的既視感，我認為這是導演和編劇的鍋。


  同一場戲有太多演員，但一半人在場的意義不明，只是他們必須出現在那而已，


  加上大多台詞都冗贅，整場戲就很乾，一點張力都沒有，演起來當然尷尬。


  再次為演員們感到不值。


  麥可道格拉斯甚至像在等著領薪水而已XD

  -


  總結一下，這部的元素過多，編劇和導演沒有能力駕馭（或無心想處理


  導致最後的成品混亂、抓不到重點，故事活像AI操刀的劇本。


  對我來說，這部就是適合邀朋友來家的時候當背景在播，


  然後就專心跟朋友聊天打屁，聊到一個段落再轉頭看一下演到哪，再繼續聊天。

  -


  咦，打完最後這段發現這不就是多數的Netflix原創電影嗎XD


  --

  不會。我就不覺得媽的是神作。稍微能理解你拿這兩部比較的原因，但很多時候觀影口味

  不是單純很喜歡一部就很討厭另一部。

  抱歉，不懂。

  忘了補充，這個AI的參考資料可能只有第四階段的漫威作品XD

  我覺得Pfeiffer和Majors一樣，只是更慘。她演的多認真就顯得多尷尬，身邊對戲的人很

  乾，搞得像她在窮緊張。

  因為該鋪陳的戲、該堆積的情緒都被拿去拍意義不明的笑話戲了。

  但電影中他說自己有能力讓蟻人不斷重複過一段痛苦回憶，我想這也算一種操縱時間的力

  量吧。

  哈哈我甚至不想提到他XDD

  小鬼大間諜是有自覺在耍蠢(self-aware stupid)，這部沒有。'
