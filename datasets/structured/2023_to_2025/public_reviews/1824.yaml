url: https://www.ptt.cc/bbs/movie/M.1697526778.A.B9E.html
title: '[新聞] "蟻人與黃蜂女:量子狂熱"失敗據傳震驚漫威'
content: '新聞網址：


  原標題:



  2023-10-17



  《蟻人與黃蜂女：量子狂熱》承擔著帶領觀眾們認識漫威第五階段大反派「征服者康」的

  重責大任，上映前期待度也很高，然而，當電影在今年 2 月正式上映後，卻在影評以及

  觀眾之間負評不斷，最終直接衝擊了票房表現，而這樣的結果據傳也讓漫威工作室官方感

  到十分詫異。



  在接受《The Watch》Podcast 的訪談時，《漫威帝國：美國大眾文化的崛起》作者喬安

  娜羅賓森聲稱，




  根據她的說法，漫威工作室原本認為所有觀眾都會喜歡《蟻人與黃蜂女：量子狂熱》，而

  實際的結果卻完全出乎他們的意料，甚至感到有些受傷。



  她表示：


  「漫威工作室注意到了他們的品牌出了什麼樣的狀況。在跟許多人討論過之後，我的理解

  就是《量子狂熱》讓他們感到十分震驚，我敢說《秘密入侵》震撼他們的程度比這更大，



  他們原本都以為『所有人都會愛死這部電影』，當電影公開上映之後才知道不是這麼一回

  事。


  」



  計畫中的《復仇者聯盟：康王朝》將會讓《量子狂熱》登場的征服者康或康之議會再次回

  歸，而漫威應該要從《量子狂熱》的失敗中記取許多教訓。



  身為全新篇章「多重宇宙傳奇」的核心反派，康就如同薩諾斯一樣擁有著舉足輕重的地位

  ，然而他卻在《量子狂熱》中遭到蟻人輕易擊敗，大幅降低了這位核心反派應該塑造出的

  威脅感與風險，這也成為了《蟻人與黃蜂女：量子狂熱》備受批評的其中一個原因。



  值得慶幸的是，這位反派很有可能將會在《洛基》第二季中再度登場，無論會以征服者康

  本人或是其他變體的形式出現，重新塑造出令詭計之神洛基也感到害怕的形象，一甩《量

  子狂熱》的失敗，藉此為《復仇者聯盟：康王朝》的來臨鋪路。







  漫威工作室近年來的作品在電腦動畫和特效品質的部分都備受觀眾質疑，同時還爆出相關

  工作人員過勞和低薪的傳聞，但在漫威相繼延後了多部影視作品的發行計畫，同時針對影

  集的發行方針進行了調整後，觀眾們或許有機會在為來的作品中看到改善。



  至於世界觀建構的部分，漫威似乎有點在《蟻人與黃蜂女：量子狂熱》中塞入了過多的要

  素，而非像過去的作品一樣以更加自然的方式呈現。在將《復仇者聯盟：康王朝》向後推

  遲了一年後，漫威能花更多時間好好計畫該如何好好向觀眾們介紹漫威電影宇宙即將到來

  的全新故事。



  --'
