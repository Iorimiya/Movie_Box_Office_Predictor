title: '[無雷] 《蟻人與黃蜂女：量子狂熱》行前忠告'
content: "XXY 視覺動物  \n\n1. 我想現在的觀眾要先放下那種看《復仇者聯盟：終局之戰》大格局的心態，來看現在\n正在鋪陳和開啟新篇章的漫威電影，或許才能夠找到不一樣的樂趣；《蟻人與黃蜂女：量\n\
  子狂熱》雖然是為了介紹「征服者康」這個反派，更為了《復仇者聯盟：康之王朝》的大\n集結電影鋪路，但它依舊是《蟻人》系列電影的規格：小人物、邊緣人、親情、微觀世界\n\
  。\n\n特別是在第二集進入量子領域後的更微觀世界，《蟻人與黃蜂女：量子狂熱》的劇本交由\n曾經編寫過《瑞克與莫蒂》的編劇 傑夫洛夫尼斯操刀，那勢必調性將比第一集和第二集\n\
  更加天馬行空、超乎想像；但故事的主軸仍然圍繞在蟻人這個相對人氣矮一截的超級英雄\n，聚焦在他的日常生活，以及他所在乎的家人。做為MCU第五階段的電影作品，好好認識\n\
  「康」這個角色，他的能力、他的思想、還有蟻人家族，似乎是這部電影的重點。\n\n感覺《瑞克與莫蒂》的粉絲會頗愛這個調調？\n\n-\n2. 能夠完全理解為什麼國外媒體評論如此炸裂，因為過於天馬行空的世界觀，對於「康\n\
  」和「蟻人」兩者間的篇幅拿捏失準，是本片的致命傷；換句話說，好不好看端看你在不\n在乎微觀世界，對於量子領域是否有想像空間。如果你對高中物理中探討原子核或電子雲\n\
  這部分沒有興趣，那相信什麼或然率、量子科學、多重宇宙、平行時空那就更虛無飄渺了\n。\n\nWell...  再換句話說，身為一個科學宅、歷史宅、怪咖，影評真心話反指標的XXY而言，\n\
  除了某個突然意義不明的洗白橋段，《蟻人與黃蜂女：量子狂熱》整體而言我真的頗愛。\n\n所以... 推薦給怪咖邊緣人？我不知道。（面對輿論已呈現半放棄狀態）\n\n\
  -\n3. 很難想像接下來的K.E.V.I.N. 在面對第五階段開局的口碑挫敗會進行什麼調整？畢竟\n除了《蟻人與黃蜂女：量子狂熱》，傑夫拉夫尼斯還接下了《復仇者聯盟：康之王朝》如\n\
  此重擔；漫威在處理多重宇宙的題材在經歷《蜘蛛人：無家日》《奇異博士：失控的多重\n宇宙》，再到現在的《蟻人與黃蜂女：量子狂熱》，似乎也顯示了一般大眾在面對資訊量\n\
  龐大的電影作品時已出現疲態，是不是還需要將它視為重大事件？我想這方面值得持續觀\n察強大的K.E.V.I.N.動態。\n\n本片有兩個隱藏片尾，強烈建議在看《蟻人與黃蜂女：量子狂熱》之前補完《洛基》第一\n\
  季，才能夠稍微習慣這種穿梭時間，或是超出大腦負荷量的資訊。\n\n有點感慨，看個電影搞得很像在智力測樣一樣，系列電影走到一個規模、品牌走到一個聲\n量，好像就不得不面臨這方面的挑戰。K.E.V.I.N.\
  \ 加油啊！\n\n\n\n\n\n--"
