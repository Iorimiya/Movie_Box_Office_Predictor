url: https://www.ptt.cc/bbs/movie/M.1676801694.A.6A5.html
title: '[普無雷] 蟻人與黃蜂女：量子狂熱'
content: '剛看完

  算是普通

  以下無暴雷心得

  我拿前陣子的阿凡達：水之道來對比


  劇情：

  阿：★★

  蟻：★★★


  對我來說這兩部細節的劇情編排一樣低能

  一樣是強調家庭的科幻動作片

  有差不多的缺點

  都是經不起認真一點的檢視

  設定的漏洞百出

  隨隨便便就能找到槽點

  可說是想怎麼拍就怎麼拍

  觀眾用腦看電影會看得很痛苦那種

  那蟻人多一顆星

  是多在至少蟻人的整體劇本設定與走向還算有趣

  讓人會想繼續看下去之後是怎麼演

  量子國度跟反派這邊算是蠻有想像空間

  而阿凡達背景設定明明也頗認真

  但大概是沒有強調這部份

  所以處理得索然無味令人沒有興趣

  演出都專注在主角家庭與反派身上



  畫面：

  阿：★★★★★

  蟻：★★


  無懸念阿凡達完完全全屌打蟻人

  但放眼望去能跟阿凡達比畫面特效的大概影史上也沒幾部了

  蟻人畫面特效是普通偏差

  有些場景看就知道是在混水摸魚隨便弄弄

  與阿凡達整片從頭到尾精雕細琢成了強烈對比



  剪輯節奏：

  阿：★★★★

  蟻：★★


  導演實力差距非常大

  詹導還是勝出太多

  而且是大勝

  蟻人全片節奏有些奇怪

  打鬥運鏡也遠不如阿凡達順暢

  但還不至於讓觀眾看不下去



  演員：

  阿：★★★

  蟻：★★★★★★★★★★★★★★★★★★★★★



  真心希望這位能好好發展別走歪路就好

  像是把床當廁所的某人....


  阿凡達？就是個藍皮外星人 毫無反應


  對我就是偏心正妹

  難得有一部沒受汙染的商業動作片



  總結：

  與阿凡達一樣

  要進影院

  請將智商下線

  這片與阿凡達一樣

  劇情極度低能

  都是主題樂園

  阿凡達主題樂園外表精心打造

  但內容沉悶無趣

  蟻人外表平凡無奇隨處可見甚至有一點破爛

  但內容還算有一點想像空間

  會讓人在意接下來的發展


  大概是這樣


  --'
