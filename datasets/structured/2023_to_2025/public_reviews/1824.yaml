url: https://www.ptt.cc/bbs/movie/M.1676442657.A.52B.html
title: '[雷] 蟻人與黃蜂女：量子狂熱 微好雷'
content: '做為漫威第五階段開篇，單看劇情是普通(還是比第四階段大部分好)，但我覺得有達到它實

  質的意義，也就是鋪陳第五階段大反派征服者康。


  雖然我們已經在《洛基》影集知道康的想法跟目標(看這部前最好先看過洛基)，但我們在這

  部才真的能見識到康的威力(不過現在看起來大部分是靠衣服的威力)。而且Jonathan Major

  s演的很有說服力，征服者康那種純粹的邪惡有表現出來。很多場景都讓我想到星際大戰，

  飛船、外星人、多樣化的地貌以及很廢的小兵。


  女兒Kathryn Newton跟奶奶Michelle Pfeiffer都很香，期待之後青年復仇者Kathryn跟Hail

  ee Steinfeld合體。


  P.S.片尾片段有兩個，都蠻重要的


  --'
