title: '[普雷] 蟻人與黃蜂女：量子狂熱'
content: '(防雷)















  條列式心得：


  1.

  顏值排名：凱西 珍娜 荷普

  荷普不知道是不是得罪了化妝帥造型師 幫QQ

  然後蜜雪兒菲佛要是再年輕個30歲

  應該連凱西都被比下去了


  2.

  珍娜坦誠跟克萊拉(比爾莫瑞的角色)是砲友關係，但觀(我)眾(自)們(己)更想知道跟康修理

  飛船的那段期間是不是也........

  下集若冒出個什麽量子小孩也不奇怪吧(咦？)


  3.

  開頭凱西有講到彈指事件後很多遊民無家可歸

  這是難得有提到該事件對世人的影響

  (另一個是無家日裡那個老婆跟人跑的老師)

  但也同樣都一兩句帶過而已


  (凱文費吉表示：好喔，可以來拍一部講述災後重建的外傳電影，有掛漫威名字就有錢撈，

  科科）


  4.

  魔多客(達倫)最後用「他其實不壞，只是想得到認同」的人設洗白，本來是覺得老梗歸老梗

  ，也沒什麽大問題，直到我想起第1集他把別人變成肉醬那一幕.....


  5.

  最後，這部是帶著螞蟻那麽大的期待去看的

  結果已經超乎預料，所以給普雷

  至少比近期每況愈爛的幾部

  (我的排名：奇異2 黑豹2 雷神4)都好了


  下一部要上映的就是星際異攻隊3了吧

  嗯.....也稍微期待一點點好了.....





  --'
