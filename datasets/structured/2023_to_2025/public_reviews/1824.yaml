title: 'Re: [討論] 蟻人與黃蜂女：量子狂熱 預告與海報'
content: '仔細想來 蟻人這一群真的是被虐耶

  尤其是蜜雪兒菲佛的第一代黃蜂女


  生下女兒沒多久就被困在量子宇宙30年

  好不容易出來沒多久~ 結果沒幾天就被彈指灰飛煙滅

  好不容易復活 沒多久女兒男友的女兒又搞事 又把她送回量子領域


  她這樣早就該有PTSD吧

  被縮小後關30年回來->被救馬上變成更小的灰燼->又回來又被關回那座30年牢籠


  能不瘋真的很厲害..................


  --'
