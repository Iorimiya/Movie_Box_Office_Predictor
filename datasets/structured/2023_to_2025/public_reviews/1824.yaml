url: https://www.ptt.cc/bbs/movie/M.1675786130.A.A65.html
title: '[新聞] 《蟻人與黃蜂女：量子狂熱》首波評價'
content: '《蟻人與黃蜂女：量子狂熱》首波評價出爐！「漫威至今最怪的電影」 影評盛讚征服者

  康的演出




  漫威電影宇宙的《蟻人與黃蜂女：量子狂熱》在洛杉磯時間週一晚上舉辦了世界首映，隨

  後社群媒體評價也解禁。


  《蟻人與黃蜂女：量子狂熱》由派頓瑞德執導，是 MCU 迄今第 31 部電影，也是「第五

  階段」的第一部。保羅路德飾演的史考特朗恩／蟻人和伊凡潔琳莉莉飾演的荷普／黃蜂女

  都會回歸，麥克道格拉斯和蜜雪兒菲佛也會再次演繹他們的角色。


  凱瑟琳紐頓則是這集才加入，飾演史考特長大了的女兒，漫威第五階段的主要反派「征服

  者康」則由強納森梅傑斯飾演。


  《蟻人與黃蜂女：量子狂熱》將於 2 月 15 日在台灣上映，以下是社群媒體解禁的首波

  評價——


  影評 Erik Davis：


  「第五階段開跑！這部新的《蟻人》電影就像一趟迷幻的雲霄飛車，沿途有各種嚇人和怪

  誕的事物發生，再加上超有威脅性的征服者康。遇上

  。魔多客很猛，但強納森梅傑斯真的征服了一切。搭乘愉快！」


  影視記者 & 影評人 Daniel Howat：


  「《蟻人與黃蜂女：量子狂熱》……但是好事！電影往 M

  CU 比較科幻的那一面深入，做了很多瘋狂的嘗試。並不是所有的設計都很踏實，但非常

  有趣、有創造力，且是一段美好的時光。這是一段愉快而奇異量子領域之旅。」


  Buzzfeed 編輯 Nora Dominick：


  「強納森梅傑斯就是《蟻人與黃蜂女：量子狂熱》中的那股力量。他令人信服、令人不寒

  而慄，並且給出了頂級的表演。我喜歡他光用一個眼神就能替征服者康帶來複雜性。選了

  這個演員，MCU 真的大獲全勝。」


  認證影評人 Courtney Howard：


  「在之後，《蟻人與黃蜂女：量子狂熱》終於開始上軌道，但。雖然外在情節看起來很清楚又重要，但人物內在的情感驅動卻顯

  得微不足道。這也就是說，。」


  Podcaster & 多媒體製作人 Dempsey Pillot：


  「看《蟻人與黃蜂女：量子狂熱》看得很開心，保羅路德從來沒有這麼棒過，而強納森梅

  傑斯輕易的征服了他出現的每個時刻。但這部電影的真正明星是傑夫拉夫內斯的劇本，提

  醒了我們 MCU 還是那麼美麗的奇特與神秘。」


  Podcaster Shahbaz：


  「《蟻人與黃蜂女：量子狂熱》告訴了我們征服者康就是來這邊雄霸一方的。強納森梅傑

  斯可能會成為撼動 MCU 的核心。

  /


  「目前為止最怪」=漫威史上最怪嗎？



  這幾則就是一如往常的漫威罐頭評論


  很多人都在誇強納森，他的演出或許真的有可看性

  但其中幾則明顯能感受出是在硬擠優點來講


  --'
