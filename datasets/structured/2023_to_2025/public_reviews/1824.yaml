url: https://www.ptt.cc/bbs/movie/M.1691839446.A.C3C.html
title: '[負雷] 蟻人3量子狂熱  極度扁平化的故事'
content: '雷文防雷資訊頁


  算是很晚才觀看的電影，還是配合防雷線提醒還沒看的人


  *-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看完漫威亂哄哄的第四階段大部分作品後，這部象徵第五階段揭幕作

  的《蟻人3：量子狂熱》似乎同樣無法喚回粉絲的信心和票房。



  漫威的電影，多數情況下，票房可以說明一切。在經歷一連串系列作品的

  舖陳後，理應獲得許多粉絲紅利並花了兩億美金成本的第3集續作，竟輸給

  當初的第1集，實在相當難堪。



  翻開《量子狂熱》的內容，除了「親情」的主題訴說得還算成功外，剩下的東

  西簡直乏善可陳。做為串聯四、五、六階段的大反派「康」，對比前三階段的

  魔頭「薩諾斯」，戲迷很難對這角色產生什麼共鳴。



  「多元宇宙」這一主題，本來在第四階段時就處理得不好，難以看出邏輯、毫

  無章法，每部電視劇和電影都像在各說各話。康做為關鍵大反派的角色，觀眾

  們完全不了解他的出身背景、價值觀以及內心世界。而這角色又很特別的不僅

  是單一角色，是具有一堆不同宇宙的變體角色其中之一，這種前提下，能夠不

  好好先交待一下他的出身嗎？



  也許漫威迷了解漫畫，可以順利進入狀況、感同身受。但大部分的觀眾可能都

  只了解近年來的影視作品。對於征服者康究竟為何要到處征服其他世界？又為

  何擁有眾多變體？為何變體之間像是知道彼此存在且能夠互相接觸，甚至結盟

  ？就算看過漫威電視劇《洛基》，也很難理解這些事。當觀眾對於這個地位重

  要的大反派背景仍是一頭霧水時，被其他變體忌憚的代表人物征服者，就在《

  量子狂熱》裡讓螞蟻大軍和男女主角給擊敗。身為魔頭的舖陳角色，別說威壓

  感或是恐懼感，觀眾對康的感覺，其實只有滿滿問號。



  另外，第一代黃蜂女珍娜對於過往事情遲遲不願交代，也使得劇情拖泥帶水，

  令人煩躁。而更致命的，要算是次要角色的「過度扁平化」。在異世界進行革

  命，無論怎麼想，都是不小的題材，何況目前的世界觀還涉及多元宇宙，要寫

  革命軍和統治者的故事，肯定是史詩格局。



  這種前提下，只想藉由一部片就塞進整個故事架構，必定會有顧不好或被犧牲

  的事物。而我們看到的，就是除了主角一行人外，其他配角以及世界觀的介紹

  ，變得極為扁平且簡陋。



  明明視覺效果很絢麗（魔多客除外），我們卻無法理解量子世界中的地理環境

  、生態人文以及各區域的政治版圖等訊息。只知道征服者康在這裡是霸主，擊

  垮了許多未知的民族。配角們無法引人共鳴，全部像是背景，僅有的少數台詞

  似乎也只是為了搞笑而存在，哀傷的是還不怎麼好笑。種種因素使得整個故事

  完全沒什麼值得深度探索的空間，成了一部連商業爽片都算不上的電影。



  既然《蟻人3：量子狂熱》單獨看沒有值得品味的價值，當成漫威影業第五階

  段的序曲，又無法讓人對量子世界和征服多元宇宙的魔頭起興趣。最終本片獲

  得的票房，也就十分相襯其應得的分數了。對照第一集的趣味感和當時復仇者

  聯盟活躍的盛況，如今局面不禁令人唏噓。





  --

  有深度的閒聊



  --'
