url: https://www.ptt.cc/bbs/movie/M.1676476575.A.E26.html
title: '[普雷]蟻人與黃蜂女-量子狂熱  有關康的問題?'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n    有關劇情,電影板前面的心得文都雷完了~就不再打劇情出來,\n\
  這篇除了主要分享觀影感受,後面想問有關康的問題?\n寫一些個人理解,看跟大家看完的想法是否有出入?\n\n看完覺得這次劇情架構還不錯,應該是可以到好雷的,\n\
  就不會覺得哪段太拖沓,或是哪段非常無聊的,\n漫威式要你笑這次的量覺得還是多了一些些,有些蠻好笑,\n有些是在戰爭時比較突兀的搞笑,就覺得打斷了戰鬥的情緒,像那個洞我就覺得超不好笑\n\
  \n給普雷主要原因是我個人覺得是反派表現不夠強......強強對決才好看吧?\n以遊戲的比喻來說,就是覺得難易度調錯了?\n一個劇情優秀的遊戲,如果調成\"初學者\"\
  難度去體驗,\n也會難免覺得這也太簡單了吧?\n這次的戰鬥感覺就是如此,規模浩大,但從流放者康.魔多客到康的帝國,都不夠強阿~\n蟻人.黃蜂女三代.老蟻人,每個人出手都以一擋十,\n\
  每個人戰鬥都很帥,但反派就越來越落漆~ 康小兵每個都被當成無雙遊戲的草一樣割XD\n太EASY有虐菜感就沒這麼熱血了,大戰時一堆戰機的砲火連巨大化蟻人都能扛好一陣子\n\
  就很像開到超簡單模式,主角們血條都超厚的,讓那個觀影的緊張情緒減弱不少~\n\n以下就新反派康有些想法和問題\n\n1.沒有看完洛基的影集,對康的認識會少掉什麼?\n\
  看前面的討論,要更理解康就一定要補完洛基了,但找到時間去補完前還是想先問,\n只看了蟻人3,會少認識康的什麼部分?好像連漫威多元宇宙如何設定也要從洛基補滿?\n\
  \n2.認為流放者康比其他康更弱是可以的嗎?\n康的戰鬥能力感覺是跟自己的裝備高度綁定的類型?\n他本部最強的時候就是多重宇宙引擎剛回到他手上的時候吧,好像空間時間都能操控~\n\
  他後面就是急著要帶著整個帝國從量子宇宙出去,所以引擎離手拿去接電源,\n就被科技蟲族和魔多克窩裡反淹過去......\n所以我的理解是,如果是其他宇宙的康,因為不需要讓引擎離手,所以實力能更加萬全?\n\
  沒有操控時間.空間手段的康,只剩下能量砲能量盾,不覺得他能對抗索爾那等級的復仇者,\n最後感覺也是真的掛了,他的引擎被破壞時連他自己都不能控制,流亡者康還能活下來嗎?\n\
  反正還有千千萬萬個康~\n\n3.康雖然似乎能知曉別的宇宙自己的事情,但其實也不算是自己的經歷吧?\n從他的言語中可得知他幹掉過索爾和蟻人等等的復仇者,\n但那件事可能也不是他自己(流放者康)所為吧?可能是法老康教授康其他康做的阿?\n\
  我的意思是流放者康他自己除了在量子宇宙開創帝國,其他事情真的是自己去經歷過嗎?\n還是如他所述,他不活在線性時間內,所以他同時知曉過去和未來的事情?\n\n最後附上大家比較好討論的個人近期漫威排序:蟻人3>黑豹2>蜘蛛3>奇異2>雷神4\n\
  --"
