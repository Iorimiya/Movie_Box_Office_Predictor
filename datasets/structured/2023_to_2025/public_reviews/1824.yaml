url: https://www.ptt.cc/bbs/movie/M.1676472565.A.6F1.html
title: '[負雷] 蟻人與黃蜂女：量子狂熱'
content: '身為一位超英電影上映就一定會去看的死忠，這次也第一天就看了《蟻人與黃蜂女：量子

  狂熱》。


  這部電影為了能給第五階段一個盛大開局，選擇，而這些恰好都是這個角色在超英世界觀裡顯得獨特而可貴的特質。


  以下則是原先對這部電影的期待：


  劇照防雷






  因為主角方一句 Don''t be a dick 就直接洗白，。




  蟻人其實沒有跟康妥協，單純是對方拿女兒的生命威脅，也因此康會如何說服史考特，或

  者史考特會如何說服自己去幫康做事，這些原本可以著墨的點可能都被分給康的說明性台

  詞了…，所以才只是隱約覺得自己做錯了什麼。


  越是把康講得多強的，他。劇本得靠機械神的科技螞蟻大軍

  一起打康就算了，康就不能看到有人來了趕快搭船離開嗎？…


  最後是之前看到劇情外流時還很期待的片尾片段，結果實際看到「康之議會」時，只看到最後一幕一堆康，裡面還有幾個莫名奇妙鬼叫的看起來就是在湊數

  划水。




  凱西有自己的想法不過這部電影的主角是量子領域所以就不多談囉，然後珍娜似乎跟別人

  有一段情史但安排這段只是為了讓大家看漢克的反應好好笑而已喔。


  而且然後找比爾莫瑞來的客串就這樣沒了？




  --


  身為MCU整體敘事的粉絲，勉強可以吞下這部情報量不小的作品，但如果今天自己是喜歡

  甚至只看過《蟻人》系列的觀眾，大概只會感到困惑吧？到底自己是來看一部電影還是來

  看下一部電影的預告的？


  --'
