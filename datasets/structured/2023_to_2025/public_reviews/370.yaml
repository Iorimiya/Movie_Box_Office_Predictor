title: '[影評] 野心過大而流於表面《頤和園》....'
content: '野心過大而流於表面《頤和園》

  文∕小智


  最美的愛情，不是距離，而是回憶。-而又怎樣的愛情，能夠如此激昂強烈？


  中國第六代導演婁燁，繼2003年的《紫蝴蝶》之後，睽違三年再度推出新作《頤和園》，一推出果然話題不斷，不僅因為片中敏感的六四議題以及激烈性愛場面，又因為在沒獲得中國電檢通過的情況之下參加坎城影展，而讓導演遭到五年內「禁拍電影」的悲慘命運。確實，北京電影學院近年來急於培養出一批「大導」，期望他們所拍出的影片能在國際各大影展當中嶄露頭角，替中國爭光，而在這「第六代」導演們之中，婁燁就是其中一人。也的確，《頤和園》不論是在敘事手法或是影像風格上，都是一部十分「歐式」風格的「藝術電影」，而這也對了咱們外國人的看片口味

  。再者，不論是影片中十三年的時間跨度，又或是驚人的跨國拍攝，這些都是近幾年來獨立電影中所少見。種種原因造就本片成為2006年坎城影展當中，唯一入圍競賽片的華語片。但也因為本片偏向非主流式的「藝術電影」，對於已經看慣平鋪直述的中國電影觀眾來說，會有些許不習慣。


  就如導演所說，這是一部探討「愛情」本質的電影。從一開頭余紅的日記字幕中，導演就明確地破題，讓觀眾清楚這是部愛情電影。原以為這是個好的開始，但是越看就越覺得本片各方面都刻劃得過於「表面」，
  甚至流於一種「為賦新辭強說愁」的悲哀窠臼，原因以下一一說明…


  一、性愛場面無力替劇情加分：

  首先，導演似乎有意將人物其中的愛恨糾纏與性慾橫流擺在全片的最中心位置(光看電影海報就知道了)。並不是說這樣的呈現方式失當，筆者承認在那性愛壓抑的保守年代，初遇或是偶遇的男男女女，總是會在那矜持的眼神交錯之中，隱藏著無限不安的肉慾渴望。但全片性愛場面之多，著實出乎筆者意料之外。可以看出導演野心過大，拍出了青春期男女性焦慮的盲目與衝動，但卻沒有刻劃出角色背後那份理由與孤寂，感覺角色「只」是為了發洩其內在慾望而進行交媾。大膽的全裸鏡頭以及過多的性愛場面，都好像是導演不捨把這些鏡頭刪去，又或是為了將就觀眾，而剪輯進

  影片當中，不但感受不到太多意義，反而使得這些性愛在全片過於累贅。


  二、人物刻劃過於表面：

  看完影片，筆者竟然對人物形象感到十分表面且模糊，感覺每個角色都只是性愛動物，缺乏了人物那種「立體感」。女主角余紅可以說是全片的敘事主線，影片也透過她日記裡的口白，來讓觀眾了解現在是怎麼樣的一個狀況。但女主角這種「喃喃自語」式的唸白，並也沒有讓筆者更加貼近這角色的內心。好吧！頂多我們可以從劇情中得知，她是一位敢愛敢恨的新時代女性，但在這之後呢？她是怎樣的一個人？她為什麼會愛上這些男人？這些男人對她來說又代表些什麼？劇中對這些問題的解答都只是透過她的日記「淺嚐則止」，少了一份更細膩的內在情緒。比起刻劃已經頗淺

  的余紅，更別說是男主角周偉了，在片中除了他英俊的外表之外，筆者已經想不起來他有何特別之處了。在這邊筆者必須澄清，並不是說演員表現不好，感覺得出來演員在片中已經十分盡力且敬業。全片演員其實是可以表現得更好的，但卻又因為過多性愛場面而模糊掉焦點，實在可惜。


  三、以政治事件來標記年代的虛無意義：

  有人說這是一部「政治電影」，但請別忘了導演的初衷，他是要在影片中探討「愛情」的本質。配合著片中時代，導演在影片裡穿插了許多記錄片畫面，例如六四天安門事件、柏林圍牆倒塌、蘇聯瓦解以及香港回歸。這樣的呈現手法確實讓觀眾可以清楚理解片中目前的時代，但既然影片一開始都已經用字幕來提報年代了，又何必再多此一舉使用政治事件來標記年代呢？我們可以說導演他曾歷經以上種種事件，算是想藉著這些影片來勾起觀眾的「歷史記憶」。可是種種時代變遷對這些角色來說，究竟又意味著什麼？影片藉著重現歷史事件，卻又無法將敘事主線與這些歷史事件

  成功串連，成為本片最為尷尬的問題所在。


  四、影片後半節奏過於托沓：

  從以上三點，可以印證筆者所說導演的極大「野心」。感覺導演想要表達的東西太多，但卻又淺嚐則止而抓不到重點。而過多性愛場面，也顯得十分累贅，以致於影片後半段，雖然「愛情」的主題依然存在，但劇情卻過於隱晦，造成節奏緩慢；角色之間大量的沉默以對，雖然刻劃出人性真實，但還是不免讓人有些坐立難安。


  在以上種種缺點之後，筆者要對本片的攝影風格與音樂使用大力稱讚。就如筆者第二段所說，本片不同於中國以往的寫實拍攝，而採取較為「歐式」的風格，讓片中某些畫面拍得詩意十足；而搖晃的手持攝影質感，也成功帶出了角色內心的不安與迷離。再來片中的音樂使用，不論是羅大佑的《青春舞曲》，又或是經典英文老歌《Can’t
  Take My Eyes Off You》，相信觀眾都耳熟能詳，不失為觀賞影片的另一樂趣。


  最後讓筆者引用一段章子怡與婁燁合作《紫蝴蝶》時，面對記者訪談所說過的話：「年輕導演在拍攝電影追求自我個性的同時，如果再能將大眾觀看影片的普遍口味溶入其中，讓大家更容易接受的話，我想那樣將更為理想。」章子怡在這邊說得好(雖然筆者有時候認為她說話很不經大腦)，身為一位導演，如果他的作品長期不能與自己的觀眾對話，那必定會很難持續下去。而要如何在「主流」與「非主流」之間，還能保有其自身的堅持，相信這對每位導演來說，都是十分重要的課題。




  【小智的電‧癮‧強迫症】



  --

  ◆ From: 203.135.73.251'
