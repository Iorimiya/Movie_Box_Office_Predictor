url: https://www.ptt.cc/bbs/movie/M.1188100160.A.006.html
title: '[好雷] 頤和園'
content: '此為一個月前台北電影節的觀影記錄


  2007第九屆台北電影節觀影記錄(十一)

  看完這部電影後,有一種極大的悲傷壓在心裡頭,這是頤和園,

  一部牽扯到政治議題以及擁有瘋狂性愛場面

  讓大陸導演婁燁笨中國當局處以五年以內禁拍電影的處罰


  原文出自:


  這是一部描述劇中男女主角周偉與餘紅之間從1987到2000年長達十幾年的情感糾纏

  象徵著中國大陸這一代的年輕人,對於愛情觀念的開放,

  也透過劇中角色的眼睛,來窺探這幾年世界上政治情況的改變,尤其是六四天安門事件

  其實透過這些歷史事件,以及劇中人物的互動,還有最後婁燁所下的結語,

  我可以感受到婁燁最終是想要傳達"自由"這個概念

  只是隱晦地藉由才經過不久的那一個年代的年輕人的愛情故事,

  來傳達心中最原始的意念罷了,或者也可以說那個時代的年輕人,

  不管是在政治理念上,甚至是愛情意識上,內心也逐漸開始狂野奔放


  就某些人來說,至少就我而言,劇中的愛情是如此狂亂到難以置信,

  不過仔細想想曾經閱覽過或視聽過的真人真事,其實真的確有其事

  有些人就跟餘紅一樣,害怕與最愛的人分離,而乾脆自己先提出分手,

  或故意或真有其事地輕易地說出與誰上過床以測試愛人是否會因而吃醋等等

  很無聊的考驗忠貞程度的問題,其實其內心充盈著對愛情強烈的不安全感,

  一而再再而三的向對方索求愛情存在的證據,卻因而與真正的愛無緣

  或像李緹是個重義氣的女人,卻忍受不住寂寞的侵擾,而情不自禁地與周偉發展出軌的戀情,

  但卻受不了對自己良心的譴責以及與自己情感間的拔河拉拒,最後仍過不了情字這一關

  反觀周偉,周旋與兩位女人之間,很明顯地他是深愛著餘紅,

  只是卻捉摸不定餘紅的情緒起伏,無法承受餘紅一而再再而三的考驗,

  只好尋求李緹的慰藉,看來李緹比起餘紅,最不讓他心煩,

  或許也是因為他對李緹的愛實在不比餘紅深吧!?

  因此在李緹面前反而比較自在,但卻讓自己落到兩頭皆空的田地

  又或許我們不像劇中人物一樣愛得轟轟烈烈,但心裡總有一畦田地,

  僅有愛情可以當作養份照料,卻對愛情既期待又怕受傷害

  這個年代,愛情雖自由自在,但卻容易把自己弄得遍體鱗傷

  像周偉與餘紅之間,分手分得猶豫不決,雙方都無法下定決心好好做個了斷,

  表示著他們的的確確互相深愛著,但同時也因為其他因素,彼此折磨著

  到最後,餘紅把性愛當作是一種儀式,讓男人透過這樣的儀式,更瞭解自己的脆弱,

  卻不准他們愛上自己,怕自己又在愛情觀上原地打轉,

  而周偉遠走他鄉,卻陷入另一場愛情的內心風暴


  愛情真的是一道難解的習題,能在其中完美滿點的人,幾乎趨近於零吧!?

  這讓我想到幾部經典日劇,東京愛情故事等大概這個時期的日劇

  都是描寫著遇到的愛情的困境


  愛情是兩人的關係共同建立,就好像政府與人民的關係一樣,不也好像戀人一樣嗎

  無法這麼容易說分手,但彼此有所誤會嫌隙產生或對政策心生不滿,

  所以有些人移民到其他更好的國家去了......

  餘紅就好像是那霸道的政府(象徵中國),一再考驗著周偉這人民的信心,讓周偉不得不遠走他鄉

  投向李緹(代表他國:德國)的懷抱,但畢竟餘紅與周偉感情還是無法化開

  但他回去找餘紅時,卻還是失望了!

  這可以說是藉由這段愛情關係影射導演本身對中國政治體系的失望吧!?


  我想大陸官方不只因為狂亂的性愛場面而禁播這部電影,

  或許關於政治自由(揭露64天安門的實情以及柏林圍牆倒塌的奔向自由),

  以及上述這些影射也是原因之一吧!?


  不過或許我們觀影時,可以單純些

  不需要這麼嚴肅地看待這些事,就單純地把他視為一場糾葛數十年的愛戀,

  愛情困境就是困境只因個性上的不同,對事情的觀感不同,而無法永遠在一起,

  總會有那麼一點惋惜,總會有那麼一點不勝欷歔,

  但過去的事情終究會隨風散去,只留下了日漸薄弱的悼念之情而已,

  或許就是一切悲傷的主因:曾經相愛,且那麼相襯的兩人,卻......

  世界上總是有那麼多事情出乎我們意料之外


  片中三位主要主角演活了他們所扮演的角色,

  最令我驚豔的就屬郭曉冬的帥氣,那是一種會讓女性癡狂的魅力


  至於為什麼片名要取名為頤和園呢?以下為從維基百科所查到的頤和園基本資料

  頤和園 英語名稱 Summer Palace, Beijing

  法語名稱 Le Palais d''ete

  位於中國北京市西北海淀區，占地290公頃（合4400畝），是一座巨大的天然山水園。

  修建於清朝乾隆年間、重建於光緒年間，曾屬於清朝北京西郊三山五園之一。

  頤和園素以人工建築與自然山水巧妙結合的造園手法著稱於世，

  是中國園林藝術頂峰時期的代表，1998年被評為世界文化遺產。


  看了許久,依然看不出個所以然,曾經想過就單純取那個夏天在北京發生的故事,

  所以取英文名為夏宮的頤和園

  但不知正確與否,或許就只有編劇與導演才可以丟給我們解答吧?!



