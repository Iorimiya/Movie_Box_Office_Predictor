url: https://www.ptt.cc/bbs/movie/M.1233505176.A.2DE.html
title: '[好雷] 頤和園'
content: "全文連結─Mr.movie的電影部落格(歡迎參觀^^)：\n\n\n    這部片子描述的是一段刻骨銘心的愛情故事，配合當時的時空背景，從男女主角在北\n\
  京的相遇說起，一直橫跨多個城市到重慶結束，時代背景的發展，始終與男女主角的感情\n發展相互呼應，不僅僅是前半部的六四天安門事件、柏林圍牆倒塌、蘇聯解體對照出的衝\n\
  突、混亂，到了後半部的經濟起飛、政治穩定，也帶出男女主角感情的平淡、甚至終結。\n\n    這部片子在大陸引起的最大爭議便是提到了六四天安門事件，觸動了當局的敏感神經\n\
  ，而在大陸地區遭到禁播。事實上，以全片兩個多小時的篇幅來看，六四天安門事件的場\n景其實了不起佔到十多分鐘，看起來比例不是很大。不過以筆者的觀察，導演應該是想要\n\
  藉由這些歷史事件，去和男女主角感情發展的高潮、衝突、背叛等環節相呼應，動盪不安\n的時代背景，加上錯綜複雜的混亂感情，彼此互相烘托，凸顯主角在大時代背景下，所面\n\
  臨到的內外衝擊。\n\n    要說全片沒有政治色彩，其實也難以信服於人，畢竟，如果只是要藉由當時的時空背\n景去和男女主角感情發展相互呼應，應該還是有很多的事件可以去援用，不一定要與政治\n\
  事件扯在一起。不過，也正是因為導演巧妙運用政治事件的衝突張力，與男女主角感情發\n展的衝突相互映照，讓全片的可看度大為提升！即使有其他的事件可以做為援用，可能還\n\
  是比不上六四天安門事件的震撼力吧！\n\n    愛與性，是本片的重大主軸。在本片中，對於男女主角的感情發展有相當深入的刻劃\n，藉由許多的性，也反射出了不同的代表意涵。一開始，女主角與青梅竹馬在東北家鄉的\n\
  第一次，帶出了女主角的敢愛、敢付出；接著，到了北京之後與男主角的第一次激情，則\n刻畫出了男女主角感情發展的高潮；後來，男女主角感情發展遭遇不斷的背叛、痛苦、衝\n\
  突，這時候的性便成了一種肉體上彼此依賴的發洩；再來男女主角分離，女主角在重慶與\n新的男人發生關係，這時的性成了女主角展現自我、希望讓男人了解自己的工具；同時，\n\
  男主角在德國與另一位女主角的性，則對兩人來說是不同的意義，對男主角來說，存粹只\n是肉體上的發洩，對另一位女主角來說，則是愛的展示；最後，男女主角於重慶的再次相\n\
  遇，卻激不起性的火花，這時也象徵兩人的感情走向結束。\n\n    導演在本部片中對於性愛場景處理的大膽開放，固然引起了許多爭議，但是，筆者卻\n認為，正是有這些場景，才讓觀眾能夠對男女主角感情的發展變化有更深刻的體會。如果\n\
  一味以道德保守的角度去譴責本片性愛場景的大膽開放，那就太沒意思了。性在本片其實\n只是反射出感情轉折的一種象徵手法，如果只看到性而沒看到愛，那就猶如見樹不見林般\n\
  的可惜。\n\n    本片藉由女主角在不同時期的感情世界，也描述出感情的多重意涵，感情可以是純純\n的相戀，不帶有任何雜質；感情也可以是一團混亂、互相傷害，讓彼此都很痛苦，卻又離\n\
  不開彼此；感情也可以只是存粹為了結婚而進行；感情甚至可以只是為了找到自我價值而\n產生。人正是因為有著如此複雜的情感而痛苦，但是也正是因為這些情感，才讓人生變得\n\
  多采多姿。\n\n\n--\n我的部落格─Mr.movie：\n\n這是一個分享電影的心得與感想的小天地，期望藉由書寫與分享，\n讓自己更加成長、也為自己的生命留下深刻的腳印。\n\
  \n--\n◆ From: 122.124.103.142"
