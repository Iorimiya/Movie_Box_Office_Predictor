url: https://www.ptt.cc/bbs/movie/M.1227124785.A.B9A.html
title: '[好雷] 頤和園之李緹'
content: '遲到了八百年的觀影筆記@@




  儘管女主角余虹為一切的故事起了頭，並且在這麼漫長的時間裡翻覆眾人、翻覆一

  切，那樣的奔放令我感覺遙遠，一種肇因於不可捉摸、不能觸碰的遙遠；電影中的

  側線──李緹，反而獵取了我較多的注意，連帶使得整個電影的篇幅在我心中重量

  不一。最令我回想再三的不是余紅和周偉熱戀時，在頤和園湖畔渡過夜晚時完美無

  瑕的戀愛，而是在時局、友情、愛情、生活全都混亂了之後，余虹、周偉、李緹三

  人之間的揪葛情仇。


  早在故事還在北京譜寫之時，周偉和李緹就有一腿了。對周偉來說，余虹是神秘且

  專制的，要不同歸於盡、要不天各一方；李緹則是奔放自由，完全誠實於自己的感

  受。站在李緹的角度，她的男朋友若谷長時間住在德國，這提供了一個外遇的可能

  原因。外遇本是人的自然情感所致，我沒有看出來到底是周偉引誘了李緹還是李緹

  引誘了周偉，但這事情本來就是一個巴掌拍不響的。


  天安門事件之後，李緹和周偉選擇去德國投奔若谷。名義上李緹回到了男朋友的身

  邊，然而此時周偉也在德國了，依舊在李緹身邊。若谷或許從頭到尾都不知道李緹

  和周偉有一腿，否則不大可能一起把周偉接來德國。李緹可以和周偉當表面上的男

  女朋友，藉此在表面上的世界維持和平。但是她心底卻是對周偉渴望的。此時，余

  虹在遙遠的中國。除了空間上的遙遠，時間上也是。極有可能在這一生，李緹和余

  虹不會再見面了，李緹根本不用考慮余虹這個人的存在。此時李緹與周偉無論發生

  任何事，都只是他們兩人的故事而已。李緹奔放且自由，或許他只在乎當下自己的

  快樂，無論是內心的感受或是身體的欲望。


  當周偉告訴大家他決定回去中國，這或許是李緹和周偉永遠的分開，李緹心裡會想

  些什麼呢？或許周偉要回去中國的原因，不只是單純地「想要回去祖國」而是因為

  在那個名喚「祖國」的地方，還有一個叫做余虹的女人。於是李緹身邊剩下若谷，

  如果只是因為即將失去了心愛的男人，我想這應該還不至於讓李緹有尋死的念頭；

  讓李緹決定自殺的原因是她自己老早就種下的，即是「背叛」。


  李緹背叛了余虹、背判了若谷，她連自己也背叛了。


  在德國的日子，李緹遠離了從前在中國的一切，從前的愛恨情仇都如同過往雲煙。

  在德國的日子，李緹的身分象徵著自由的、新生代的東方知識份子。有工作、情人

  和穩定的環境，同時周偉也就在身邊不遠處。如果不是周偉決定離開，我猜想李緹

  根本不會回憶起從前在中國的一切。在德國，李緹沒有顧慮地用身體和心靈背叛若

  谷，這不一定是什麼天大的罪惡，或許人與人之間不過互相尋求撫慰寂寞。但是周

  偉的離開使眼前現狀和過去的回憶連結，李緹即將失去了一個或許是她唯一真正愛

  過的男人，然而她在背叛了太多事情之下才得到周偉，以及得到現在的美好生活。

  無法承受失去周偉，加上李緹承受著背叛之後自己內心的痛苦，所以他選擇在周偉

  和若谷面前自殺。李緹站在屋頂的那一刻，或許她曾想過：這樣縱身一躍，一切過

  往是否就能得到救贖？






  --

  ◆ From: 140.112.244.41'
