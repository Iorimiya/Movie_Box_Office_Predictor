title: '[問片] 無水的泳池'
content: '在書上讀到的，好奇是哪部片。


  「那天我看了一部電影，開場戲有一段無水的泳池，

  字幕宣示出一場如夏夜晚風來襲、猝不及防的愛情。」


  是影展的電影，在中山堂播映。


  --

  應該就是頤和園沒錯，謝謝你。'
