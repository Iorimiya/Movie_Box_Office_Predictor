url: https://www.ptt.cc/bbs/movie/M.1594981296.A.D26.html
title: '[好雷] 市長你累了嗎？ Alice et le maire'
content: '今年 COVID-19 疫情開始前我最後一次搭長榮航空，看見了這部法國新片《市長你累了嗎？》Alice et le maire （直譯「愛麗絲與市長」），有法國老演員中我最愛的
  Fabrice Luchini、以及法國青年演員中我最愛的 Anaïs Demoustier、兩人在法國城市中我最愛的隆河明珠 Lyon 展開一段忘年之交！這可不是一般的交際、更談不上什麼浪漫戀情，而是一個活力仍充沛志向仍高遠、但腦筋已僵化才思已枯竭的里昂社會黨市長，要從外空降一位三十歲學者出身的政治素人來當市政顧問、專門以一雙清澈的眼睛直指市政窠臼與盲點。


  這人名叫 Alice Heimann，是牛津大學文學博士兼擅哲學，要以哲學眼光重審一切馬不停蹄習以為常的政治，這位社會黨明星市長 Paul Théraneau每天行程再多再滿都要把她給帶著，就為了百忙中抽三五分鐘跟她來場對話辯論腦力激盪！這種神奇的職位，上達天聽的權力有點像特助、工作性質則是特助級的組織再造顧問，每每說句簡單真話做個簡單分析，就把市政機器多少人不眠不休的成果都砍掉重練
  XD 雖然這種職位很夢幻、雖然有開明市長真能實踐點理想，但顯然踩到很多人痛腳阻礙很多人利益，到底 Alice是「愛麗絲夢遊仙境」還是「小白兔誤闖叢林」呢？




  記得我上次在長榮機上看，是一路興奮地只看到大概一半，眼見開明有耐心又願意不斷求進步的市長與 Alice經過一段磨合後越來越上軌道、諮詢她的事情越來越多甚至還指派她空降下來重新召集一個
  "Lyon 2500"大案子，看起來真正欣欣向榮準備革新市政做出一番成果來？結果令人振奮地看到一半就匆匆下機了，直到這兩天發現中華電信 MOD有上才續看了下去...
  怎知，劇情的光明高潮就在我下飛機時、接下來就是急轉直下更每下愈況！難道市長破格拔擢 Alice察納她雅言、Alice 美夢成真應用哲學為市政實務做出一點事、畢竟只是曇花一現終成幻夢一場嗎？


  本片前段，從 Alice進入市府到任開始，除了談 Alice與市長的認識磨合外，更透過她的眼睛觀察這尾大不掉的市政世界：這裏年輕人很多、市長辦公室秘書三十出頭俐落強悍又提拔自己像個「學姊」般、幕僚團隊到處都是二十出頭西裝筆挺法政科系出身的金童、人人都年輕面嫩雖然名義上都是「公務員」理應較保守、但其實身段都已有倫敦金融城或巴黎
  La défense那種金融青年上緊發條力爭上游的模樣... 說穿了，他們都是靠「發展」在推動著、夙夜匪懈賣命工作使命必達一刻不得閒、大家都是高學歷但已經沒人在讀書在思考遑論批判了...
  小學者 Alice該如何面對？


  另一線，則是 Alice下班後的同學會，那風景截然不同，是個迷惘的左派青年世界，畢竟大家都是學文學或學哲學出身的，本來對這資本主義宰制的金權與物質世界早就多所批判如家常便飯、不用說這裏每個青年都是鐵桿左派堅守社會正義的文青知青或覺青...
  只是大家都 30 歲了、當年 Alice暗戀的助教也快 40 歲了，大家反而赫然發現自己埋首書本學業不知不覺韶光已蹉跎、這已是功成名就結婚生子的年紀、怎麼我們這掛左派人人都還停滯不前啥也沒做到？許多年輕時的左派人，就在這個「功名事業」面前慢慢失守了，說穿了他們一樣是讓頭上的「發展」陰影推動著。




  法國教育，在世界上很出名的就是小學開始教哲學、長大到高中大學人人都有機會成為哲學家思索現世人間、對個人存在與人文建制處處批判，只是很詭異地，好像大學生出了校園、或是像
  Alice這票讀完博士又沒留在學界才出校園的，竟然往往把過去的理論辯證與批判性格瞬間忘光光？這時，就不得不令人對本片市長主角 Paul 的洞見與堅持感到認同：他年輕時是廣告界出身的創意人、他從政至今三十年致力城市創新、前二十多年每天滿腦子點子源源不絕...
  但如今跟著市政機器漸漸磨光了，他必須要設一個專門拉開距離「思考批判」的職位，拋下一切包袱不停地言辯。


  本片這一老一少兩位主角不停地「說」，當然市長很忙每天只能擠出一點點空閒把 Alice找來說話給自己醒醒腦、其他大部分時間市長都在主持會議跑行程簽公文、Alice
  則是一直默默觀察市政同仁們在做的案子並默默把思考提問記在筆記中，這樣子差不多「八分鐘觀察、兩分鐘對話」的電影戲份分配，倒做出了一種「八分鐘世俗、兩分鐘超越」構成了本片動靜皆宜的節奏感！每每看著老市長一頭白髮目光炯炯有神地站上講堂慷慨陳詞、看著
  Alice穿著簡單的牛仔褲與牛津鞋身處一堆西裝幕僚行伍中睜大一雙眼觀察、伴以上下班的里昂電車里昂山水景觀... 就是種饗宴！


  Alice 初來乍到第一天，她本來應徵的市府職缺被裁撤掉了，但這市府仍很負責地照市長指示專門為她開了這新缺，第一天不認識市長甚至還跟市長說不到話只能遠遠觀察記筆記，Alice
  默默記下了關鍵字 "modestie" 也默默記下了幾個文學家與哲學家的書單，後來我們知道她將在此片漸漸成為市長的忘年之交、良師益友，已三十年沒空讀書的市長也蒙她多次書單推薦與兩次贈書、市長還在大位時沒空讀書就直接上場摘要辯論，而一次次辯論儘管主題看似各不相同，但那主要的核心問題還是一個「謙卑」modestie，而且是要從表面現象一路挖到市政存在本質的「謙卑」：




  第一辯：什麼是左派？什麼是社會主義？市長號稱是左派社會黨，但正如 1997 鄰國布萊爾身為工黨當選走「第三條路」後，全球左派的社會黨與工黨們好像都面臨了新挑戰也陷入新迷思：我們傳統左派缺乏市場競爭力、缺乏光鮮亮麗的發展動能、缺乏讓人民熱情追求的動機、更缺乏讓選民們投一個希望未來的夢想。於是，左派都在傾中靠右，聲稱我們左派的社會主義計畫並不輸給資本主義自由競爭，我們的城市發展藍圖可以兼顧生產生態與生活、可讓「發展」與各種社會價值得兩全...
  但 Alice要提問：這是否已經淪為紙上畫畫牆上掛掛的左派？具體人民參與又在哪？


  第二辯：既要談參與，那到底什麼是民主？什麼又是進步？先說進步罷，Alice 直陳她在市政府內所觀察到的「進步」，不外就是一直無法安於現狀、躁動地不停為未來畫新的大餅，只是把我們今日給設定為
  A 未來給設定為 B 然後畫一條 A到B 的直線就叫做進步？這進步聲稱納入的人民那多樣複雜的實際處境之「民主」又在哪？在此，Alice 一見就知其疊床架屋本質的里昂市政大計畫
  "Lyon 2500"說穿了就是畫大餅，由超有錢的創意人企業家聲稱可將城市帶進未來，其實完全忽略城市令人不想見的那一面、只想擁抱最光鮮的全球城市網絡、把萬眾都拋在後頭？必須重審。


  第三辯：就算有民主真能當飯吃？難道民主社會公共討論做出多數決甚至多贏共識，真的就是全球城鄉發展正道？在一次市長脫口而出「在民主之前生態不是絕對的價值」引起軒然大波令幕僚忙救火時，Alice
  終於要提出左派最基進堅守的底線了：地球資源與自然生態，一翻兩瞪眼，是人文發展與進步的上限、甚至民主都無法解決這門檻，試想我們民主程序人人都要好生活、而且大同理想中沒有人的生活水準應該低於其他人，那說穿了不就是為保人類富貴與平等而無視地球容受力？更基進地說，發展與進步可和生態與資源相容嗎？大家心裏多少都有底，但政治從不願承認。




  本片前 2/3，大概都在 Alice與市長充滿理想樂觀向前的時代，他倆一次次辯論都還認為「發展」與「保護」是可以並行的，包括對社會對歷史對生態的保護都可以，而也在這過程中認識了好幾個代表光譜兩端的角色們，包括：(1)
  Lyon 2500 的承包商創意總監Brac、(2) 接口這位創意總監的市長辦公室秘書Isabelle、(3) Alice 過去助教的末日論藝術家妻子Delphine、(4)
  Alice 在民間看對眼的傳統書籍製造商Xavier。這光譜兩端的四人，Alice 在電影前 2/3一直多多少少在敷衍，他們都想彼此見面衝撞一回、但 Alice下意識一直擋著，終於到了
  2/3處的歌劇盛會時...


  本片雖然只下了前奏幾小節，但聽過的人都知這是華格納指環系列第一集《萊茵的黃金》Das Rheingold ，開場不久就將有代表自然的三位萊茵女神出來講一個人文建制對自然巧取豪奪的故事，而指環系列到最終集《諸神的黃昏》Götterdämmerung
  則談這人文建制一路不受勸告也不聽警告的最終隕落了... 聽這歌劇、看這場合代表「發展」與「保護」的不同人們，也許 Alice才初次發現兩邊鴻溝有多麼深廣、橋樑有多麼難搭。別說
  Brac 強勢施展權力、Isabelle滿腦子功名上爬，就算 Delphine 也只能雞同鴨講無法溝通、Xavier更打從心底鄙視 Alice他們這些做政治的。


  這場令人心情沈重的歌劇盛會，果然如預言般迎接著最後 1/3的急轉直下：Alice 與市長都還在摩拳擦掌展開改革，市長剛好在法國社會黨內部競爭中幾乎拔得頭籌可能成為總統候選人、他也躍躍欲試地要從此帶起一個截然不同的政治風潮、不再為政經權勢與民意風向所宥而要基於批判思考面對真實，他更相信
  Alice的意見大膽撤銷了那打高空的 "Lyon 2500"大計畫、而拔擢 Alice起來一起起草「放慢腳步檢討發展」的新里昂藍圖... 只是可惜，一切做到蒸蒸日上只欠臨門一腳時，社會黨終究放棄了他們這一系訴求人文社會生態保護的基進左派，選擇了更有市場的候選人。




  本片 Alice與市長一連串天馬行空的對話辯論，總是這邊談一點那邊談一點跳來跳去地，我猜對哲學與政治理論出身的觀眾來說可能太淺、對政治實務的觀眾來說可能太打高空、對非此領域的觀眾來說可能又有點霧煞煞不知要不要認真聽下去...
  不過我認真把每一場對話主題都聽完後，倒也漸漸了解此片編導 Nicolas Pariser想說什麼故事：他是有政治與社會熱忱的、對未來是抱有期許的，但他對這熱忱與期許的結果卻是悲觀的、而認為有志者包括自己不管提出什麼都是無法撼動現狀的。一切人文社會的期許堆疊到最後，最後底線就是當代左派右派都無暇理會的「生態」。


  近年法國電影的確也有一系令人往往看了沈重卻又茫然未解的「末日電影」，譬如台灣前兩年上過的《野蠻迷林》與《失控班》、又譬如更早推出的《阿寶動物一族》與《不打不相愛》，這些片在懸疑驚悚親情愛情或奇幻喜劇等表象下，電影看到最後我們都知有極沈重的末日控訴：當代法國已世衰道微、不論環境生態人文社會還是人心世道，都早已庸庸碌碌走向崩解中，儘管有少數人大聲疾呼，但終究埋葬洪流中而任災難發生。談回本片，這導演
  Nicolas Pariser是很基進的，他絕不訴求光鮮的「發展與生態雙贏」，而認為「必須抑制發展回歸簡樸」，但政治哪裏會聽呢？


  我個人在曾經參與部分地方政府的標案時，也真是看過很多這種「發展與保護並行」或「未來與歷史共榮」的漂亮口號，這些口號還可以寫出一堆天花亂墜的發展計畫，號稱對人文歷史古蹟遺產生態環境的保護、都可以成為新經濟的火車頭作為發展新動力...
  ？但真的細究下去，那往往都是創意型政治人的舌粲蓮花，說穿了只是兩面討好不想做選擇，這一邊不敢得罪文化與生態保育份子丟掉他們的選票、另一邊又不敢告訴一般民眾你們的生活型態需要改變並節制，於是陷入一種恆常的兩面討好和稀泥，永遠只在擘劃一個接一個空想的「未來」但根本沒有成真可行的一天。




  看這片，我的確又陷入了幾年前看《不打不相愛》(2015)、《阿寶動物一族》(2017)、《失控班》(2018) 與《野蠻迷林》(2018) 等片的沈重感與憂鬱感，覺得這種片總是拍個風和日麗的當代日常、結果卻是給我們看個世衰道微一路下沉的未來，絕沒有好萊塢電影那種振衰起敝力挽狂瀾的希望未來、而是就照著我們這瘋狂世界的步伐繼續往毀滅走去...
  在這末日的前夕，《市長你累了嗎？》的 Alice et le maire兩位忘年之交又該如何自處呢？沒有答案，只有實踐，市長終於有時間留給自己思索人生與世界、Alice
  離開市府有了生活成家生女，且以一本贈書提醒彼此初衷。



  全球疫情持續加劇的時刻，看這種電影心情實在不太好，不過看 Fabrice Luchini再次演目光炯炯有神身段瘋瘋癲癲的活力老人，是種爽快！而看 Anaïs Demoustier一身簡樸雙眼靈動演個青年學者躍躍欲試改變世界，更令我回想起參與每一個工作的美好初衷、以及每一次比預期還快很多的墮落
  XD 話說 Demoustier 此片演出竟然擊敗「燒女」Adèle Haenel 得到了凱薩獎最佳女演員？嗯我是覺得她演得很好但總是沒「燒女」那般精彩啦，真不知這得獎有沒有惹來什麼風波呢？突然發現，2010年
  Demoustier 也和 Haenel & Sciamma 合演過一齣八分鐘短片 "Pauline"呢：



  --'
