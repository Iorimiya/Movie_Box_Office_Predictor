url: https://www.ptt.cc/bbs/movie/M.1681528293.A.4AE.html
title: '[好雷] AIR 商業本質下的動人故事'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


















  說真的 看完電影回到家第一件事

  就是把Air Jordan歷代的廣告看過一遍

  即便已經是凌晨一兩點


  原po記憶中 人生第一雙品牌運動鞋確實是Nike

  但事後回想 那應該是一雙多功能訓練鞋

  第一雙籃球鞋則是Converse


  所以電影一開始描述Converse Adidas Nike三家公司的市佔率

  對原po來說是蠻有感的


  電影裡的第一個記憶點

  就是桑尼跟行銷組大頭史特拉瑟在會議室裡

  思索如何用25萬鎂的預算簽到那些球星

  這一幕 真的像極了

  《魔球》裡豆爺跟一群球探

  在會議室裡決定 如何填補戴蒙 吉昂比跟伊士寧豪森離開的空缺


  在與會的同事們提了一些可能的人選後

  桑尼就跟豆爺一樣沉默不語

  覺得如果只是單純的簽下球星

  他們就在做競爭對手同樣會做的事

  We''ve got things different


  接著劇情安排了桑尼看著喬丹比賽的影片

  坦白說我沒有感受到桑尼因為影片受到啟發的感覺

  但劇情透過那個橋段告訴我們

  桑尼不想只是簽球星 他想簽的 是傳奇


  但想要簽下傳奇談何容易

  猶如電影一開始演的

  桑尼在進到Nike之前 已經在業界是有名的球探

  不過即便是經驗再老道的球探也是有可能看走眼

  就如同你因為運彩贏了錢 但還是會在賭骰子的時候一把輸光


  要拿年度預算單壓在一個球員身上

  使得桑尼受到了許多人的質疑

  從公關大頭懷特 行銷大頭史特拉斯 到大老闆菲爾

  所有人都覺得桑尼瘋了


  但在這其中還是有人扮演著啟發桑尼的角色

  例如他找上了喬丹以前的教練

  從他口中才知道當年馬丁路德金的演講下半段完全脫稿演出

  引申出有時候就是要適合的打破既有的規則


  所以桑尼做出了極為大膽的決定

  繞過經紀人福克 直接去拜訪喬丹的家人

  喬丹老爸知到桑尼來意之後的反應跟表情真的很經典

  "好戲就要開始嚕~~~"


  面對老練 對 真的是老練的喬丹媽

  桑尼很清楚自己必須把Nike特別的一面說出來

  而他也做了一次不錯的說服

  告訴喬丹媽她在面對Converse跟Adidas會遇到什麼狀況

  最後也幾乎如他所說

  當然這裡應該是劇本的吹捧


  真正的關鍵還是在桑尼受到了網球拍廣告的啟發

  發現球星的打造還是要靠運動品牌自己下手

  有別於Cons跟Adi還在覺得 球星就只是球星的時候

  Nike決定自己把球星打造成傳奇


  在菲爾的決定下 大家決定孤注一擲

  但其實中間桑尼還是承受了很多壓力

  硬性的壓力不說

  得知桑尼背著自己去找喬丹一家的福克

  大概把自己一輩子學會的髒話都拿來詛咒桑尼

  軟性的壓力則是來自史特拉斯

  告訴桑尼如果這次失敗了 自己會有多慘

  還有後面的一個長鏡頭 桑尼在等待電話的時候

  環視了一次籃球部門辦公室 彷彿是在說

  萬一失敗了 這個部門應該就會被裁撤


  最後結果出來 喬丹媽不忘來個回馬槍

  直接要求商品出售的分潤

  這一步真的殺的桑尼猝不及防

  還好最後菲爾決定扛下這一切

  才有了這世紀般的結合


  ======================


  傳記類電影的靈魂莫過於角色的刻畫


  找Chris Tucker來演懷特

  而且讓他在電影的開場就跟桑尼一陣碎嘴

  我覺得是很成功的安排

  這樣的幽默開場 除了讓影廳裡的大家頻頻發笑

  也讓大家願意繼續看下去


  再來就是找老班來演菲爾

  他真的有把菲爾那種上個世紀八零年代老闆的感覺演出來

  總是一副ㄎㄧㄤ的感覺

  然後篤信東方宗教 時不時還要來個靈修之類的

  最後那場會議菲爾登場時直接先雷一波

  真的演的很傳神


  至於史特拉斯跟福克則是徹底點出

  職業運動商業化下那個現實又血腥的一面

  但有趣的是 運動本身卻是一個能屢創感動的事

  所以如何在商業化的氛圍下

  取得感性跟理性的平衡才是最重要的課題


  偷臭一下 悍創就是搞不懂這件事 才被大家譙成這樣 XD


  許多人都會認為 整部片的高潮

  就是桑尼對喬丹說的那一串激勵人心的發言


  但對原po來說

  整部片讓我最有感的

  卻是桑尼跟小七店員的互動

  那兩幕看似平常

  但卻展現了職業運動的魅力之一

  就是無論兩個人是多麼的素昧平生

  只要有觀看共同的職業運動

  就是能夠聊上兩句 誰誰誰最近表現怎樣

  哪支球隊最近又怎樣

  對我來說 這就是職業運動迷人的地方


  其實原po從來都沒有穿過Jordan Brand的任何一雙鞋

  年輕的時候只有AJ系列 真的買不起

  出了社會 有了經濟能力 Jordan Brand也開始發行除了AJ以外的鞋款

  但自己卻已經不再打球了


  對映電影裡時不時出現的80年代元素

  這應該也是某種程度的致青春吧


  真心推薦這部片 好看




  --'
