url: https://www.ptt.cc/bbs/movie/M.1554789347.A.4DE.html
title: '[好雷] 魔女南西與隱藏的樓梯間 Nancy Drew'
content: "雷文防雷資訊頁\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n1.影片名稱 :\
  \ 魔女南西與隱藏的樓梯間（我自己的中譯）\n             Nancy Drew and The Hidden Staircase (en)\n\n\
  2.觀影時間 : 04/08\n\n3.觀影地點 : 住家網路\n\n4.觀影方式 : 網路，iTunes 美國版商店\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n美國有個家喻戶曉的少年偵探小說系列\
  \ The Hardy Boys （有些人暫譯「哈地男孩」）、還有同作者的少女偵探小說系列 Nancy Drew （有些人暫譯「魔女南西」，雖然其實不魔只是不太乖而已），美國的阿姨在我小時曾經送我幾本，但在中文世界好像不紅目前還沒找到中譯版。倒是今年三月在美國有限上映了\
  \ Nancy Drew 的電影「魔女南西與隱藏的樓梯間」、英語的藍光 DVD與串流資源也在本月初全上架了。看這片，相當清新可愛，適合學齡少年與兒童，在聲光刺激的商業電影市場中找到一點簡單說故事的復古純真。\n\
  \n\n\n這位 Nancy Drew 她的系列小說從 1930 年問世至今已經一路出版改版與時俱進到了 21 世紀，一個美國小鎮校園與社區的鄰家小偵探故事仍歷久彌新。十二年前曾有\
  \ Emma Roberts 主演的改編電影《魔女南西：星河謀殺案》，不過人物形象與造型風格大改了、也從小鎮改到了洛杉磯大都會、原著的 sidekicks也都換了一批人；今年這部則堅守傳統小鎮、大體維持原著班底、人物形象則在鄰家少女的格局上稍微改得叛逆一點鬼靈精、造型則搞個\
  \ Tomboy 風的滑板女孩走跳社區。\n\n最重要的是此片選角，爛蕃茄影評不論好壞一致公認女主角生動演出是本片最大貢獻：這位 17 歲演員 Sophia Lillis是前年恐怖片《牠》的小姐姐Beverley，在此片繼續留著在《牠》片剪掉後的那頭短紅髮，只是在此沒有鬼父卻有親愛爸爸、沒有壓抑憂鬱只有爽朗笑容、沒有畏縮恐懼只有享受人生。Lillis長大了兩歲戲路轉開朗、睜著一雙大眼睛看什麼都好奇、喜歡插話搶話嘲諷頂嘴、喜歡惡作劇伸張正義兼添生活情趣、每每被抓包只吐個舌頭看你奈我何、遇懸案如神破解但平日少根筋像個傻妹...\
  \ 那靈活配傻氣的天真結合，實在像是年輕版的 Zooey Deschanel呀！\n\n\n\n這故事談個普通小鎮、鄰家少女、生活謎案，連帶 Nancy Drew\
  \ 的偵探才能在此片也被塑造得比較日常，不像是萬中選一的出世奇才，而更像是一個單純愛觀察愛思考愛動腦又叛逆的平凡少女。這樣的生活小偵探與任何中學少年都不遙遠，人人腦筋也不用多好，只要打起精神發揮質疑探索的獨立精神、捲起袖管的實踐精神、假設求證的理性精神，每個人都可以發揮自己能力解決自身與鄰里的小問題，既是自我實踐也是參與社會。\n\
  \n這麼日常親切的故事，電影拍起來也真很像日常闔家觀賞的電視影集或電視電影，不太像格局宏大劇力萬鈞的電影。它有偵探劇偶爾公式化的懸疑配樂製造氣氛、簡單的攝影調度把環境與人物交代清楚、簡單的聚焦與視角切換提點觀察推理、簡單的小鎮住宅學校場景建立世界觀、甚至連台詞也有點像話劇般用詞簡單咬字清楚口白徐緩...\
  \ 這種電影我猜大人若上電影院看恐怕容易失望，但在小螢幕串流也可以輕鬆推理輕鬆看，對少年兒童來說則是淺顯易懂可以看片思考又有 role model ，更是看片學習英文的好教材。\n\
  \n\n\n原著裡的 Nancy班底有她自己和好友兩人出任務、還有一個帥氣的男友、在上則從小喪母而有個相依為命的親愛老爸。在電影中，留下了Nancy 的兩位好友\
  \ Bess & George，一個女孩子氣擅長化學常被人欺負、一個男孩子氣擅長電腦，三人搭檔是學校裡較 nerdy的一小群，而這學校也是有一般高中的風雲人物如肌肉男婊子和美貌女婊子，兩邊往往看不順眼針鋒相對，她們這\
  \ nerdy三人組則善用電腦化學與偵探才能扳回一城出口惡氣，好一個慘綠又驕傲的少年呀。這是 Nancy的快意人生，卻也是她自我封閉的盲點，需要在本片小冒險中學習打開窗子伸出手。\n\
  \n原著裡 Nancy的帥氣男友在此片缺席，讓她在校園身處邊緣自傲自憐帶點不屑的姿態更立體。她身為能觀察洞見更能出手干預的小偵探，在小說裡也許酷炫，但放到現實校園與社區就是令警方校方頭痛的問題學生，電影開場給她發揮長才快意復仇闖下小禍後、每天八小時穿亮光背心做社區服務過完慘澹暑假。她的問題是什麼？只是在行禮如儀經年不變的小鎮強出頭，讓平靜生活的表象被戳破而令保守者不悅罷了。保守者，在此片是罰她的警長，這警長粉飾太平專打出頭鳥，真遇到社區老婦發生「神秘案件」時只是一直踢皮球，唯有不聽話的\
  \ Nancy代為出頭揭發社區大秘密。\n\n\n\n原著裡 Nancy年幼喪母與爸爸親愛長大，這背景成為此片重要感情線：她們家本是城市人，現在卻因爸爸喪妻需要療傷，只好一起搬回爸爸老家這小鎮，這裡雖有叔叔與姑姑好像多點人情味，但\
  \ Nancy只想留在母親逝世的大城以懷念母親。小鎮與大城，表面看似有一種保守與前進的對比，但說實話 Nancy也不是為生活多采多姿才懷念、而是為了眷戀母親才懷念，恐怕才是她保守之心的體現；反而，搬回小鎮展開新生的爸爸，表面上珍惜小鎮生活並用律師專業阻擋開發勢力看來像是保守派，但其實在處處要開發要投資要炒作的年代裡，挺身而出維護小鎮生活恐怕也是種前衛？\n\
  \n這就談到了以爸爸為核心的大人世界，都讓無憂無慮過著少女人生的 Nancy靜靜看著也沒多想，只是這一切無聊的大人事兒終究會串起來讓一切明朗。小鎮，正有開發勢力要整合鎮民地產蓋火車站、要靠這「都市更新」把在地小鎮變成區域節點、讓人與金錢川流不息搭上資本列車欣欣向榮；懵懵懂懂的\
  \ Nancy也曾遇建商威脅、身遭長輩有人反對有人贊成、而爸爸自己就是反對派律師引領鎮民捍衛權益... Nancy 不懂這一切，她只知道有個老婆婆家裡鬧鬼等著她解謎，殊不知這大宅鬧鬼和這場都更風雲完全牽連在一起！\n\
  \n\n\n本片很小品，女主角又超可愛，雖然是有個鬧鬼事件而且乍看之下超靈異，但 Nancy看到靈異絕不害怕反而眼睛一亮彷彿挖到寶、被鬼捉弄就算鼻青臉腫也絕不受害自憐而要當一場精彩遊戲、這間大宅器物豐富機關眾多讓她當個原野樂園和鬼來場追趕跑跳、大宅裝飾優美五彩繽紛更處處提供鮮明的視覺意象讓她觀察蛛絲馬跡。\n\
  \n偵探玩抓鬼，重點仍在一個對實證的堅持、對理性的堅信，不管多少炫目亂象或多少流言誹語，理性的少女仍不為所動理性自持，終究可以慢慢抽絲剝繭完成拼圖揭發陰謀。這是\
  \ Nancy Drew 原著最長壽的系列主題 \"Mystery Stories\"「神秘事件」，給予少兒觀眾的不只是精彩推理，還有在這花花世界中堅守理性正道的成長訊息。\n\
  \n而這部作為新時代介紹 Nancy的起源故事（希望還能趁女主年輕拍幾部續集），除了拍她小偵探的理性與叛逆身段外，也交代了她的生活環境、人際關係、以及家庭心結，這一切生活與人情的成長，也都和她解決神秘事件的偵探精神異曲同工：這社會有許多時代趨勢、這社區有許多主流聲音、這校園有許多人群分類、甚至自己的心也有不願面對只想逃避的盲點，一切都在建構個僵固不變的「典型」等人們傻傻遵從別質疑；但偵探少女，不為這一切所惑，要讓自己歸零從頭觀察理性爬梳，終能拆穿表象看見人事物的真實，包括生活的真實美好、以及人情的真實美善。\n\
  \n\n\n Nancy Drew 系列小說，我也只有多年前匆匆翻過兩本，這少年偵探故事在書中可能還像少年小說混著推理小說，但拍成這部電影「魔女南西與隱藏的樓梯間」可就比較像個鄰家少女成長喜劇了。她身為「少女偵探」的推理劇情其實還是一方面以歡樂為主、另一方面呼應理性處世面對人生的成長訊息，一般推理劇迷會不會喜歡呢？我是持保留態度。但以爸媽帶子女看一場清新小品\
  \ YA 片、聽聽英文看看劇情歡樂一個半小時的標準來看，看看一個有自我有理智有能力也有愛心的平凡中學生能怎麼掌握人生過生活，倒是親子心得都滿滿。在此推薦。\n\n\
  \n--\n也把希望放在 Netflix上~"
