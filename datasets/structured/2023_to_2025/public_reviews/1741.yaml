title: '[新聞] 美食外送員「戴AirPods」秒變醫生 《我出'
content: '新聞網址：


  美食外送員「戴AirPods」秒變醫生 《我出去醫下》笑奪新片票房冠軍


  新冠肺炎疫情持續延燒，許多民眾紛紛減少外出，讓近期廣告很大的美食外送業績更加蒸

  蒸日上，不過此時居然有外送員誤打誤撞變成了醫生！法國喜劇電影《我出去醫下》（A

  Good Doctor）敘述Uber Eats美食外送員跟醫生發生了車禍，導致醫生無法出診，沒想到

  醫生竟突發奇想，讓外送員戴上AirPods，利用電話隔空指導外送員代替他看診，過程發

  生不少爆笑趣事。《我出去醫下》在法國上映首週空降新片票房冠軍，累積票房破1億

  8000萬台幣；電影由坎城影帝、最佳劇本得主米歇爾布朗（Michel Blanc），與法國當紅

  YouTuber哈基姆傑米利（Hakim Jemili）共同主演，將於3月20日在台上映。


  《我出去醫下》男主角之一的美食外送員由哈基姆傑米利飾演，這是他的大銀幕處女作，

  在法國哈基姆傑米利可說是家喻戶曉的網紅，他參與的YouTube頻道「Le Woop」目前訂閱

  人數高達364萬，而他的個人IG也有57萬人追蹤。另一位醫生男主角則是由法國老牌實力

  派影星米歇爾布朗擔綱，他曾榮獲坎城影帝及最佳劇本獎，才華無庸置疑。其他演員包括

  自編自導自演《終極殺陣5》的法蘭克葛斯湯比（Franck Gastambide），在片中演出胡亂

  給外送員差評的奧客，以及外型亮眼的法國新銳女星索琳里戈特（Solène Rigot）等。


  《我出去醫下》由「法國奧斯卡」凱薩獎最佳首部電影得主布魯諾納宏 （Bruno Nahon）

  製作，《劫局》、《推銷員之戀》攝影師及《今夜，我們無罪》、《烈火焚身》作曲家傾

  力打造。電影講述前無國界醫生賽吉是唯一一位會在聖誕夜出診的醫生，他跟美食外送員

  馬利克發生了車禍因而無法看診，情急之下，馬利克只好代替賽吉登門看診。於是他戴上

  AirPods，透過賽吉的隔空電話指導，搖身一變成為超瞎醫生！今年最好笑的法國電影《我

  出去醫下》，將於3月20日爆笑上映。


  --'
