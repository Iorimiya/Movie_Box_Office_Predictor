title: '[無雷] 空氣人形 Air Doll'
content: '古羅馬詩人奧維德在《變形記》（Metamorphoses）裡，曾經寫過這樣一個故事：

  Pygmalion 是塞浦路斯島上的雕刻家，擅長將象牙雕刻成女人，雖然島上有

  一群因否認阿佛芙黛蒂（愛與美之神）的神性而被誘惑去賣淫的女子們讓他

  對女人興趣缺缺，但是他卻愛上自他手中完成，近乎完美且栩栩如生的雕像。


  某日，他在愛神慶典中，獻上祭品，還許下希望象牙雕刻品能變成真人的心願，

  於是愛神派出丘比特，讓他親吻了雕像的手，還套上一枚戒指，允諾了這個願望，

  當 Pygmalion 回到家，發現願望成真，便與其成婚，生下一子。


  日本導演是枝裕和執導的《空氣人形》說的是一個充氣娃娃的故事：對單身的大叔

  來說，小望是他撫慰寂寞、解決生理需求的工具。某日，小望有了心，她趁著大叔

  上班空檔外出探索世界，她像個好奇的小孩複製所見所聞，遇見形形色色的人......


  裴斗娜飾演的小望，肢體跟表情的拿捏都恰到好處，好幾個鏡頭，讓我分不出當時

  的小望是充氣娃娃或血肉之軀。當小望看著大叔床上新型的充氣娃娃，並跟他討論

  自己存在的意義，奪門而出那段，深深觸動我的心，此時的小望，想必心裡無比

  複雜，百感交集......



  在奧維德的故事裡，象牙雕像變成真人，後來還跟 Pygmalion 產下子嗣，結局

  完美圓滿。但是《空氣人形》中的小望，有了心之後，即便能體驗真實的人生，

  但她仍註定是個充氣娃娃，終究會因為同類型產品推陳出新，可能面臨被束之高閣

  的命運。所以擁有一顆心，對小望來說，到底是幸運，還是詛咒？




  --



  感謝補充！'
