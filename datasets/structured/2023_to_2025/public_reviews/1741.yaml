title: '[新聞] 《驚聲尖叫》恐怖豪宅Airbnb出租 萬聖節'
content: '《驚聲尖叫》恐怖豪宅Airbnb出租 萬聖節限定一晚僅140元


  10月31日萬聖節即將到來，加上今年適逢經典恐怖電影《驚聲尖叫》上映25周年，Airbnb

  與《驚聲尖叫》團隊合作推出萬聖節限定體驗，讓影迷有機會入住位在美國加州的拍攝取

  景小屋、重溫驚悚場景。


  電影中大衛艾奎特（David Arquette）飾演的杜威警長，則將會化身成虛擬房東，帶領旅

  客體驗最原汁原味的拍攝場景，包括門上刀痕與警長姊姊Tatum遇害車庫，都將真實呈現

  。


  旅客可以在屋內觀賞1至4集電影馬拉松，享用爆米花、奶油冰淇淋等90年代經典小吃，甚

  至能打電話給「鬼臉」（Ghostface）提問，也有機會把電影紀念品或海報帶回家。


  《驚聲尖叫》1996年上映後，成為影史最賣座的恐怖電影之一，電影中的鬼臉更成為之後

  萬聖節常見的扮演角色，系列新作《驚聲尖叫5》預計明年1月在全球上映。


  此次推出的萬聖節限定體驗開放10月27日、28日、29日三晚，一晚可以入住4名房客，價

  格為象徵性的5美元（約新台幣140元），與即將上映的電影票價相同。


  新聞網址：


  --

