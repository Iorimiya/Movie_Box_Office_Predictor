url: https://www.ptt.cc/bbs/movie/M.1707119739.A.C0F.html
title: '[好雷] 三劍客：達太安 Les Trois Mousquetaires'
content: '本片 Netflix阿根廷版連結，可 V出去搭配英文字幕欣賞：




  法國這幾年拍了難得耗費鉅資大牌雲集的古裝文學英雄片《三劍客》，分為《三劍客：達太安》與《三劍客：米萊蒂》上下兩集於去年上映！目前上集《達太安》除已出國際版實體影音外，亦已在
  Netflix的幾個拉美國家平台上可見。話說三劍客拍成電影我最好奇的應該還是選角：初出茅廬的主角 D''Artagnan 由近年法國商業片首席青春男星 François
  Civil飾演！看他第一場戲路見不平拔刀相助、看鏡頭跟他騎馬跑動的焦急衝動、看他穿梭劍戰左支右絀卻初生之犢不畏虎、看他與女生調情睜著一雙汪汪大眼面露天真無害的微笑...
  真令我覺得當代達太安就是你了！



  原著以一場「達太安衝突」開場表現其血氣方剛，不過本片這開場衝突一方面開宗明義扣連全片主線陰謀、另一方面著重表現達太安的見義勇為奮不顧身、卻也揭示「難過美人關」的男劍客命運：路上有個貴族仕女與其侍從被人打劫了、達太安前去英勇相助雖險象環生卻也逢凶化吉了、誰知英勇颯爽打退壞人正要迎接女士出轎卻被女士開了一槍！本片開場就是背後跟拍鏡頭讓達太安帶領觀眾見識全方位戰陣，總是多方劍客縱橫來去隔幾秒鐘就一聲火槍，這三劍客詮釋絕非童話豪情五彩繽紛而是冷峻寫實刀槍無眼，一場亂鬥俱作塵土唯達太安有主角威能從墳中爬起！



  於是本片戰陣再冷峻人命再脆弱世道再炎涼，只要有 François Civil演達太安拍拍塵土摸摸鼻子戴上了帽子，重新咧嘴展開天真笑容每天都是一條青春樂天好漢子！接下去的「達太安進城」本片充分展現他們法國領導的歐洲製作設計不讓好萊塢專美於前，總是長鏡頭跟著達太安左打招呼右串門子順道看那
  17 世紀巴黎市井與宮闕，按圖索驥走進「火槍手軍營」各種教官學員演武練兵真令男孩熱血沸騰彷彿找到歸屬踏上遠大前程！只是亦如原著般達太安一進城就將連續開罪帽插羽毛的菁英火槍手「三劍客」，一條小命大言不慚約了三個決鬥
  XD 竟不打不相識成換帖好友！



  毫無疑問三劍客都要嚴選法國當代商業電影中堅男星：(1) 戲份最輕的 Porthos由年近四十的《舊愛來找碴》Pio Marmaï 飾演，在三人中武戲文戲表現相對都較少，主要任務是以一身大塊喝酒大口吃肉的豪情、帶著小弟達太安進入火槍手花花世界：火槍手雖然有很多傳統騎士傲氣常驍勇鬥狠、在這
  17 世紀行走城市動不動就血洗衝突與人私鬥、但只要團結陣線義氣相挺同氣連枝就是"Tous pour un, un pour tous"！酣戰一回交了朋友就是酒館把妹不醉不歸！不過他左擁右抱有女也有男
  XD 達太安寄住他家翌晨起床不禁忐忑「我們也有嗎」？



  (2) 戲份居中的 Aramis 由年近五十的《西班牙公寓》Romain Duris飾演，負責演繹火槍手的精準狠辣與從容優雅：人人酒館把妹不醉不歸，唯 Aramis
  維持冷靜保持距離隨時做好準備，同樣酒館召妓他卻既有紳士風度亦有宗教虔敬、只是宗教虔敬只是優雅外表真耍起狠來毫不倚賴上帝只相信現實邏輯，遠距射擊技驚全場他只氣定神閒恍若無事、近距拷問冷靜兇狠令人心膽俱裂還請兄弟們迴避。本片幾場突擊反擊攔截救援都由他指揮若定、由
  Porthos從旁搭檔帶著達太安亦步亦趨，先救王后再救國王無役不與令「三劍客」成為壞人眼中的絆腳石欲除之後快！



  (3) 戲份最重的 Athos由年近六十的《太保密碼》Vincent Cassel飾演，原著裡他就與反派瓜葛最多淵源最深，本片則加重這故事給他一場天降橫禍身陷囹圄，卻也給他文戲令他回顧思量並傳承小輩：本片
  Athos才與主角們打完一場不醉不歸、誰知翌晨床上醒來旁邊是個女屍與一把兇器，難道是他這陽剛士兵酒醉召妓暴力殺人卻全無印象？這必有奸人陷害但 Athos正直虔誠幾近死腦筋、酒醉一場記憶模糊他堅決保留自己有罪的可能！結果不但自己下獄還害得人心惶惶連整個火槍隊都暫受拘留、親痛仇快給密謀壞蛋可乘之機，但可能的背後黑手還要由他唏噓道來：



  (4) 經典女反派 Milady 由英法雙聲道 Eva Green飾演應能開拓本片國際市場！原著 Milady 本就勾結紅衣主教成為背後黑手、過去與 Athos愛恨情仇現在則對達太安聲聲誘惑，本片當然維持這設定並給她「復仇女郎」的加重表現、甚至背後多線陰謀更盤根錯節鋪天蓋地：她從開場達太安路見不平勇救仕女時就是幕後黑手、片中
  Athos被人陷害顯然也是她甜蜜復仇、達太安查案走到哪都遇見她更每次都栽她手上、更大陰謀「王后醜聞」亦是她一手設計再人贓俱獲、不但前進英國寄生上流當個「小丑女」Arlequin誘惑白金漢、還穿針引線勾結紅衣主教黎塞留要推翻國王！



  (5) Milady陰謀設計的王后 Anne d''Autriche則由剛演完茜茜皇后的 Vicky Krieps 飾演，如原著般演繹皇后出軌成醜聞破口，只是這次加重「貴族女子婚姻枷鎖」的滄桑憂鬱：看這國王路易十三與王后
  Anne 平日按表操課君臨天下、但兩人獨處話不投機只是盡王室義務，別說 Anne 獨守空閨不安於室嚮往外面浪漫愛情、就連國王自己也語帶憤懣「婚姻一場沒有贏家」每個人都是囚徒！本片誰都不真在乎但都必須如實演出否則動搖國本的「王后貞操」，其象徵寶物就是一串國王送給王后卻被轉送情郎的鑽石項鍊，達太安能在皇家儀典前搶回項鍊維持王室表面與王國安穩嗎？



  (6) 經典大反派當然是「紅衣主教黎塞留」，在這 17 世紀 Richelieu代表天主教勢力要鞏固法國政教合一，但國王自己的「王權」可不想受制於天主教而要有自己的路，面對近在眼前的胡格諾教派「新教徒分離」與其背後更大的「英格蘭威脅」這政教兩大巨頭出現了歧異：Richelieu
  與新教徒水火不容也樂見法國與英格蘭對立、但路易十三想要維繫整個法國的包容團結「不要再有一個 Saint-Barthelemy 大屠殺」，兩人表面維繫平衡私底下勾心鬥角之餘、手下各有親衛隊與火槍手各擁其主劍拔弩張！紅衣主教亟須證明新教是威脅，但新教對天主教與法國王權卻又怎麼想？



  (7) 小說末段的史實「拉羅歇爾圍城戰」Le Siege de La Rochelle 本片在上下兩集的上集已先鋪陳，試圖描繪一個本能和平共處但有人挑撥離間致擦槍走火的分裂命運：片初國王對「胡格諾教派」新教徒採寬鬆政策，畢竟他在乎的是整個國家在王權之下團結起來，不過本片安排了個新教陣營要角竟是
  Athos 的兄弟 Benjamin，他們不但為了搶救 Athos先來場「武裝劫囚」、更雄心壯志要建立新教國家獨立於法國！如果他們堅持獨立甚至劍指國王激怒國王最後會是誰得利？以這角度觀察本片動機那背後黑手呼之欲出，將裡應外合扮裝反串來場「皇家屠殺」作為片末決戰！



  (8) 國王到底是怎樣一個人物？他有何底線令奸人挑戰考驗？法國中年小生 Louis Garrel 飾演路易十三一臉憂鬱，他並非待救國王任人玩弄而很有王者威嚴與眼界，在這時代獨排眾議訴求宗教包容因為大國實力才是硬道理！只是這種「王國」需他調和鼎鼐將眾多陣營聚在同一大傘效忠於他時，他自己也很壓抑委屈犧牲小我忍辱負重中，國王的大器理智與憤懣率性往往就在一線間！片中他首先對「皇家婚姻」也滿心不願忍耐已久，雖未必真愛王后但若王后背叛可絕難容忍，但主角們查案一回儘管搶救了王室婚姻與國王龍體，真能阻擋人人虎視眈眈摩拳擦掌的歷史時勢？



  (9) 不過本片畢竟仍是「達太安」的小伙子故事，能與前輩攜手酣戰一回成為「三劍客」的兄弟、大破敵軍搶救國王更保住王后貞操、王后感恩為他牽線追求美人才是騎士人生的浪漫！原著為王后辦事的「房東太太」Constance
  在本片取消老公角色成為「單身俏房東」，她落落大方聰慧靈巧又 resourceful令達太安一見傾心，演員 Lyna Khoudri 帶著三分強勢搭配 Francois
  Civil 的天真純情也是種新時代的天造地設，令傳統有點強勢的達太安追求攻勢變成一種小男子的無害傾慕令女生心花怒放！只是原著中到了下半本 Constance有其命運結局，電影下集還有機會翻轉嗎？



  電影下集就是背靠背拍完隔半年上映的《三劍客：米萊蒂》！不知英雄能否救到美人呢？不過達太安更該擔心的仍是「英雄難過美人關」：蛇蠍美人 Milady 在電影上集戲份已超過小說、長袖善舞無所不在彷彿串連多線的幕後黑手、她沈潛蟄伏奮發圖強背後的復仇動機又是什麼？電影下集能以新時代女性觀點站她立場給她新詮甚或平反嗎？上集《三劍客：達太安》由法國主導多國聯合製作已算歐陸高成本，但兩集總預算也才八千萬美元
  XD 難望好萊塢項背，只是光靠製作設計場景調度運動鏡頭等電影基本功就已令我看得熱血沸騰！若有台灣片商慧眼引進我由衷感謝。




  --'
