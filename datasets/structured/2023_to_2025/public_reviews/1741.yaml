url: https://www.ptt.cc/bbs/movie/M.1446706309.A.548.html
title: '[金馬影展]樓下的夏天summers downstairs '
content: '心得有雷



  慎入









  ****



  看完簡介和預告，原本還在猶豫要不要去看的《樓下的夏天summers downstairs》，出乎

  意料地好看。


  電影敍述一個個性溫和的馬提帶著女友和她的小孩在父母的別墅生活。他的哥哥卻突然現

  身，帶著太太要來這裡度假（希望能在假期中懷上小孩）。哥哥就把馬提和女友趕到樓下

  房間，並要求小孩在他在的期間離開別墅。原本馬提逆來順受、受制於哥哥，卻在女友忽

  然轉變向哥哥示好之後，產生一連串變化。最後馬提發現哥哥深藏的秘密和煩惱，也逼哥

  哥與哥哥的太太正視他們婚姻關係中潛在的問題。


  電影全部場景只有一棟草坪別墅、一個游泳池和一間小樹屋，全部角色就兩男兩女一小孩

  ，卻不能不說是一部精巧美好的夏日輕喜劇。劇情巧妙有趣、暗藏許多有意思的互動，既

  呈現了兄弟又愛又恨、互競又互助的情誼，又表現出夫妻情人之間關係的張力，加上小孩

  子帶出的問題，更顯生動有趣。


  個人非常喜歡劇本簡單而充滿暗示的設計，從法語與德語、騎士之劍、除草工作、酒與大

  麻到那極愛那幾場在游泳池的戲，透過物品與角色互動把故事裡人物關係和情緒變化展示

  在眼前。配得剛好的音樂與幾個戲水的鏡頭，讓整部片都浸在迷人的夏日氛圍中。

  兄弟與情人之間的關係，往往是如此隱晦而曖昧。平凡無事的日子裡，我們很難去正視和

  覺察其中的問題，唯有這種共同生活的時刻，我們才有機會發現問題－更認識自己，更認

  識對方，也更認識彼此的關係。


  電影拍得很輕，但卻明明地告訴我們：當我們正視關係中存在的問題，「關係」才有可能

  繼續發展下去。



  --


  這裡是我的樂園:




  --'
