title: '[好雷] AIR'
content: "雷文防雷資訊頁\n\n本片描述了Nike如何排除萬難，說服Jordan一家，\n不與當時鞋業龍頭Adidas及Converse簽約，轉向與Nike簽約，\n\
  開啟了驚人銷售的Jordan Brand之過程及創造球星、\n行銷NBA甚至改變了整個職業運動的文化。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n~~~~~~~~~~~~~~~~~~~ 以下有雷請慎入 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n雖然檔期在夾殺下，票房可能不見得理想，\n\
  不過總得來說這部片仍是值得一看，\n目前imdb 7.8/10，拍攝手法還原當時的商業運作滿有風格的，\n片頭保留了許多當代的片段，令人驚豔的，\n除了把這部片當成Jordan傳奇的補完計畫，\n\
  當成商業行銷的參考資料也不錯。\n\n簡單分享幾個查到的花絮\n\n一、主要角色：\n\nSonny Vaccaro / Matt Damon，麥特戴蒙飾演，\n\
  \n本片主角，主導簽下喬丹的關鍵人物，\n1984代表Nike簽下Jordan，\n\n1984創辦了ABCD訓練營ABCD Basketball Camp，\n\
  (其中代表cademic etterment and areer evelopment)\n專為高中的優秀球員提供舞台與培訓管道，從這點來看，Sonny是很有遠見的。\n\
  知名的MVPs包含了：\n1993/1994 Stephon Marbury\n1995      Kobe Bryant\n2001      LBJ\n2005/2006\
  \ Kevin Love\n\n\nSonny於1991跳槽到Addidas，並在1996簽下Kobe，也曾接觸LBJ：\n\n\n\n\nPhil Knight\
  \ / Ben Affleck 班艾弗列克飾演，\nNike co-founder / CEO，商學院畢業，運動員出身，\n與教練Bowerman共創Nike，入選2012奈史密斯籃球名人堂，\n\
  2023富比世身價415億鎂，排17位。\n\n\n\n\nRob Strasser / Jason Bateman 傑森貝特曼飾演，\n\n協助Nike在sneaker\
  \ wars擊退 Adidas，成為國際鞋業與運動服飾龍頭，\n1987轉投Adidas，1992成立Adidas America並擔任CEO，\n但不幸於1993病逝。\n\
  \n\nGeorge Raveling / Marlon Wayans 馬隆韋恩斯飾演，\n\n片中提到曾與馬丁路德金遊行，從教練退役後擔任Nike全球籃球營運總監，\n\
  對於鼓勵Sonny去接觸MJ有很大的助益。入選2015奈史密斯籃球名人堂。\n\n\nDavid Falk / Chris Messina 克里斯梅西納飾演，\n\
  \nMJ的經紀人，被認為是僅次前NBA總裁大衛史騰的第二大權勢人物\n也算是一號響噹噹人物。\n他的演技把經紀人這角色詮釋得相當好。\n我最有印象的就是那句我沒有朋友，我只有客戶\n\
  \nHoward White / Chris Tucker 克里斯塔克飾演\n\nJordan Brand副總裁，片中對於Nike公司與Jordan一家有重要的情感聯繫\n\
  (我認為拍攝手法裡有稍微點出，因他同為黑人，有情感上效果)\n也是Jordan Brand能持續在Nike成長的推手\n\n\n\nDeloris Jordan\
  \ / Vioala Davis 薇拉·戴維絲飾演\n\n據說選角是MJ指定，其實我覺得她演得還不錯，\n拍攝角度也很清楚指出，都是Jordan媽的主意，\n\
  片尾有節錄MJ名人堂談話，對Jordan媽的描述令人讚賞\n\nPeter Moore / Matthew Maher 馬修·馬赫飾演\n\n片中溜滑板，以及AJ1\
  \ 鞋款的設計師，Air Jordan發想，\nAir Jordan標誌、Jumpman標誌、Adidas山形標誌的設計人，\n\n\n1987加入Adidas，1992成立了Adidas\
  \ America,\n1993於Rob Strasser身故後接任首席設計師，後離開擔任版畫工作，\n2013回歸Adidas擔任品牌顧問，2022於本片開拍前逝世\n\
  \n\n\n\n\n\n\n二、據聞Rob Strasser跟Peter Moore離開Nike要創業並嘗試挖走MJ\n這一段推特所提到的弦外之音有點精彩，\n\
  \n\n2022 Jordan Brand達到年營收50億鎂，亦即MJ賺了近兩倍他在NBA生涯的收入\n這其實要歸功某個人，Tinker Hatfield，他是傳奇Bowerman的旗下運動員之一，\n\
  1980年代Nike銷量不佳，Reebok追上，公司面臨生存危機，\nTinker Hatfield此時加入設計團隊，設計出著名的外露氣墊鞋款Air Max 1，\n\
  雖被主管大肆批評，卻出現爆紅銷量，故事是這樣的。\n\nNike副總裁Rob Strasser與AJ1&2首席設計師Peter Moore跳槽打算挖走MJ，\n\
  帶走了AJ3的設計內容，Hatfield臨危受命，與MJ溝通設計新款的AJ3，\n老闆Phil與Tinker約好要展示，但MJ遲到了，正與Rob and Peter打高爾夫，\n\
  且不只是打高爾夫，R&P展示了新設計想搶生意。MJ告知將會停止與Nike合作，\nTinker這時出大絕，他的新鞋款放上Jumpman logo，而非傳統的Nike勾勾標誌，\n\
  \"沒人知道我要這麼做，連Phil也不知道，這個以MJ個人為品牌中心的概念，\n吸引了MJ並讓他決定留了下來，繼續與Nike合作，\nAJ3系列就以Jumpman開啟了飛人品牌的王朝，Hatifield表示，時至今日，\n\
  Phil都說是我拯救了Nike。\n\nNike 股價\n1984-1988:-50%\n1988-2020:42,000%\n\nJumpman logo甚至比NBA\
  \ logo都還熱銷，之所以MJ是GOAT，是有所本的。\n\n\n\n\n\n三、本劇頗具深意的引言：為求原意就不翻譯了\n\nA shoe is just\
  \ a shoe until my son steps into it.\n-Deloris Jordan\n\nYou're remembered for the\
  \ rules you break.\n-Phil Knight\n\nI don't have friends; I have clients.\n-David\
  \ Falk\n\nIt won't be the NBA promoting my son, it will be the other way around.\n\
  -Deloris Jordan\n\nWe need you in these shoes, not to have meaning in your life,\n\
  but so we can have meaning in ours.\n-Sonny\n\nThe mommas run stuff.\n-Howard\n\n\
  \n最後，是片中出現的The 10 Principles at Nike\n\n\nThe Original Nike Principles from Rob\
  \ Strasser in 1977\n 1.Our business is change.\n\n2.We're on offense. All the time.\n\
  \n3.Perfect results count - not a perfect process.\n    Break the rules: fight the\
  \ law.\n\n4.This is as much about battle as about business.\n\n5.Assume nothing.\n\
  \   Make sure people keep their promises.\n   Push yourselves push others.\n   Stretch\
  \ the possible\n\n6.Live off the land.\n\n7.Your job isn't done until the job is\
  \ done.\n\n8.Dangers\n    Bureaucracy\n    Personal ambition\n    Energy takers\
  \ vs. energy givers\n    Knowing our weaknesses\n    Don't get too many things on\
  \ the platter\n\n9. It won't be pretty.\n\n10.If we do the right things we'll make\
  \ money damn near automatic.\n\n\n謹此分享~ 謝謝收看！\n\n補充：\nTinker_Hatfield\n\nNF紀錄片，The\
  \ Art of Design第一季第二集有他的特輯，專門介紹鞋類設計\n可以參考\nMJ有在訪問裡出現，以下為預告\n\n\n--"
