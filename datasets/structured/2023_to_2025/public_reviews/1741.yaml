title: '[影評] 髮膠明星夢 Hairspray'
content: "在紅磨坊之後，歌舞片似乎開始了緩慢而穩定的復興。靠著一系列中上水準的音樂人物傳\n記電影以及舞台劇改編作品，歌舞片終於重新找回觀眾對於類型的喜愛與興趣。但重要的\n\
  是，即便在同一個類型裡，歌舞片引人入勝之處仍有著顯著的差異。舉芝加哥及去年的夢\n幻女郎兩部成功的類型電影為例：前者靠的華麗的服裝、細膩編排的舞蹈以及故事題材本\n\
  身的尖銳新鮮；而在故事平鋪直述甚至略顯陳舊下，夢幻女郎則在歌唱部分擁有壓倒性的\n優勢，同時良好的製作水平以及攝影燈光也讓電影增色不少。髮膠明星夢雖較在風格上較\n\
  偏向於夢幻女郎（求精緻細膩而非華麗花俏的視覺製作、利用歌手而非演員、平鋪直述的\n故事），但靠其本身無可救藥的天真爛漫以及延燒到銀幕之外的熱情，仍帶給電影獨特的\n\
  魅力，在大多數時候抓住了觀眾的注意力與情緒。\n\n事實上，要在這年頭找到像髮膠明星這樣樂觀明亮的電影還真的不容易。或許來自題材本\n身已具有一定的時間背景，髮膠明星夢與現今多數電影比起來基調顯得有些突兀，但在現\n\
  在這種同質性高的環境下，反而顯得與眾不同且懷舊－更別提電影本身百分之百的投入與\n相信。從電影的第一個畫面到片尾工作人員名單，電影自始至終散發著讓人沈醉的甜美，\n\
  搭配上時代背景的似曾相似感以及明亮的基調，這是一部會讓人想要跟著畫面載歌載舞的\n電影。電影並未要傳達什麼重要的訊息，就只是單純讓觀眾開心的開懷大笑，同時在走出\n\
  戲院後心情愉悅，而這也正是其最成功之處。另外，電影本身的幽默感也從最簡單開朗的\n肢體語言，到編劇Leslie Dixon刻意注入的些許犀利對白，甚至少部分針對自身的反諷，\n\
  都是讓電影更迷人的地方。\n\n另外，演員也很明顯地熱愛且投入這部電影。女主角 Nikki Blonsky不僅有著好歌喉，同\n時本身也具有相當的個人魅力，雖然不確定當面對較沈重複雜的題材她是否能應付，但在\n\
  髮膠明星夢裡她的Tracy是個極易愛上的角色，也或多或少成為整部電影歡笑的泉源；\nMichelle Pfeiffer則感覺已經成為40過後風情萬種壞女性的化身，不僅演得好且在這邊\n\
  再一次展現她的歌唱能力；我不知道這部片子要用到拌裝的理由，但這應該是John\nTravolta進入21世紀來最好的一次演出，不僅有趣且出乎意料地吸引人；或許歌喉不行，\n\
  Christopher Walken仍把他獨一無二的個人色彩在這裡發揮得恰到好處，從從最簡單的眼\n神到對話都可以勾人； James Marsden大概很難再有比這裡更好的演出，唱歌也是嚇人的\n\
  好。其他演員像Zac Efron、Amanda Bynes（話說她到底可以16歲幾年？）、Queen\nLatifah或Elijah Kelley都表現不錯，特別是幾段個人獨唱都相當夠水準。\n\
  \n不知道是題材熟悉還是有燒香有保佑，在拍了一系列爛片（這傢伙拍了十二生笑二跟限制\n級保母居然還可以在好萊塢混，人生真美好）後，導演 Adam Shankman終於修成正果，拍\n\
  出了無論製作或內容都遠遠勝過他任何一部前作的作品。可能跟本身專長即是編舞有關，\n髮膠情人夢的舞蹈－即使本身並不花俏－非常夠水準，在基本的素材下有著炫麗的成果。\n\
  同時，Shankman也非常懂得運用電影鏡頭，利用運鏡、剪接幫助音樂及舞蹈本身達到最大\n極限。的確，他在步調控制和一些比較具有張力的段落仍顯得平庸，但，這畢竟是歌舞片\n\
  ，而他無疑是個一等一的歌舞片導演。\n\n而我也很愛這部電影的製作。豐富的用色、懷舊的情緒、音樂本身的朗朗上口、加上先前\n即提過的技術層面，無論服裝、燈光、攝影、剪接，甚至Marc\
  \ Shaiman的配樂都與題材的\n懷舊性與積極向上搭配得天衣無縫，讓觀眾更容易進入電影的世界中。\n\n唯一比較不幸的，是這個世界實在有點陳舊。\n\n就如同一開始即提到的夢幻女郎，髮膠明星夢也面臨同樣的問題：故事題材本身實在太過\n\
  平庸。芝加哥之所以百看不厭，在於那份諷刺與一針見血的評論，即使經過再長的時間仍\n歷久不衰。但當故事本身相對簡單，音樂又已經熟悉，則題材便很容易開始顯得重複。這\n\
  個問題在夢幻女郎中尚不明顯，畢竟該片的故事雖然平凡無奇，但至少這種 \"成功後迷失\n自我後重新奮鬥再起\" 的故事屢試不爽。然髮膠明星夢所講的，卻是一個顯得有些時代隔\n\
  閡的故事，編劇又完全沒有將其調整或修改的企圖，使得我們用60年代的眼光，在看一個\n60年代的故事，題材本身自然不甚吸引人。另外，雖然電影本身各方面都是最頂尖的水準\n\
  ，這一切的基調都太過相似，僅是無止盡的蓋上樂觀勵志的噴漆，加上相近風格的音樂及\n舞蹈，類型難以避免的疲勞感也更早出現，也使中間兩段較不同的音樂更讓人歡迎。當然\n\
  ，電影中後段出現了些許的變化，也幫助把結尾推上了一個精彩絕倫讓人喘不過氣的高峰\n，但這還是造成電影開始大約50分鐘後有些疲軟且讓人不耐，使得電影有個絕佳的開頭，\n\
  恰到好處的結尾，卻終究無法在全片中維持觀眾的專注。\n\n總的來說，髮膠明星夢還是一部會讓人愛不釋手的電影：風趣、細膩且讓人充滿希望。如\n果看完後你沒有一種胸口滿到快要炸開的幸福，或者在最後高潮時情不自禁地用腳打拍子\n\
  ，那你真的應該思考一下自己的情緒是否太過低沉。毫無疑問，一部無法被阻止的電影與\n快樂。\n\n--\n\n                       Ich\
  \ bin der Welt abhanden gekommen\n\n--\n◆ From: 61.57.150.187"
