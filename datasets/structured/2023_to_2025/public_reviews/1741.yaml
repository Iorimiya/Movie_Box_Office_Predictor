url: https://www.ptt.cc/bbs/movie/M.1270181634.A.F31.html
title: '[好雷]Up in the air:輕與重的弔詭'
content: "Up in the air:輕與重的弔詭\n\n\n    波蘭籍的社會學家Bauman在液態現代性(liquid modernity)一書\n\
  點出了資本主義的轉換:從沉重的資本主義，如福特公司，過渡到輕盈的\n資本主義(light capitalism)，像是微軟。以微軟公司為企業起點的人，\n對在於何處結束，毫無把握;而在福特或雷諾公司工作的人，對於生涯都有種\n\
  著地的確定性。Bauman是這樣說的「在資本主義的沉重時期，資本像勞動力一樣\n固定在那個領域。現在，僅僅通過一只包括公文包、行動電話和筆電的行李箱，\n資本就能輕鬆移動。」這個場景，就像片中剛開頭主角萊恩俐落的身影，優雅簡約\n\
  的旅行美學。這一頭是高貴的企業戰士，擁有來去自如的移動力；另一頭則是因著\n組織要走向越來越「輕」，缺乏行動力，沒有太多選擇只能固著在一點的勞工。\n當企業戰士累積無數的哩數時，被解雇的員工累積的可能是債務；當企業戰士已經\n\
  在全球化時，沒錢的人或像他妹妹那樣只能用照片或電視體驗全球化。越來越輕的\n世界，除了衝擊組織以及經濟，此外，也重塑了我們的關係以及對未來的想望。\n\n\n\n\
  \n\n    Baman這樣譬喻輕與重的差別:沉重的資本主義輪船上的乘客相信只要\n全神貫注的閱讀每一條通道的規則，船長就會帶領著他們駛向它的目的地；\n然則，乘坐輕快資本主義班機的乘客則發現自己陷入一種恐慌:駕駛艙空無一人，\n\
  完全自動駕駛。但你根本無從得知在哪飛、在哪著陸、又有什麼規則可以依循？\n我們不再有單一權威可以主宰我們人生的價值觀，無論政治的選擇或是生活的\n價值觀似乎越來越多元，越來越沒有明確的答案；我們有的是各式各樣的專家\n\
  與顧問，他們是詮釋者而非立法者，就像潛能開發演講的各個講者，兜售著\n他們的價值觀，聽聽看，你不用非得這樣做，我也不希望你真的這\n樣做，因為我無法替你負責。這也反映在娜塔莉與萊恩在價值觀的辯論上，\n\
  萊恩說:「你相信直視一個人的眼睛就能夠看見他靈魂深處，然後就獲得平靜嗎？」\n娜塔莉說相信，他則說我不信。被質問到這樣的生活方式到底有什麼好時，萊恩說\n這沒有好或不好，只是一種選擇。是的，一種選擇。越來越個體化的社會，讓我們\n\
  越來越難去置喙別人的生活方式，一來是很難，二來是為什麼要？就像主角所說的背\n包理論，你不覺得你的肩被勒得很緊嗎？責任、義務、承諾太沉重了吧，一切隨緣，\n沒有娜塔莉你所說的那種標準藍圖，更何況認真投入關係又有失去的風險。\n\
  好不容易從既有的各種束縛掙脫出來，為什麼又要我回去？然而，我\n們真的能忍受自由所帶來的不確定嗎？或者說寂寞。\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n    當我們所處的世界越來越不穩定、越來越不知道未來與下一步是什麼，\n但同時工作的例行與瑣碎又使得自己疲憊且缺乏意義感，然而尋找意義感\n\
  的宗教已然退位，或者說我們無法像過去那樣那樣願意把自己交出去，於是乎，\n我們將自己這方面的焦慮訴諸於愛情，或投身到消費之中,好讓自己脫離沉悶，\n逃逸出既有的生活之中。就像雅莉對萊恩，我只是想逃離，我以為我們在這方面有\n\
  共識。正如Bauman在另一本書《液態之愛》所說的愛情的兩難，愛情有某種程度的\n獨佔感需要用承諾來換，但我們又害怕承諾破滅的痛苦。一如娜塔莉在機場痛哭，\n\
  還有萊恩好不容易動搖，決定將自己交出去，卻又重摔了一次那樣。雖然我訝異\n編劇這樣的設計，但也佩服編劇這樣的設計，因為這部片就不是那一種直接告訴你\n一個孤獨的人最後還是得到愛了，所以擁有羈絆是比較好的，正如同他處理了裁員\n\
  這樣的議題，討論的也是在越來越輕的世界裡，責任與承諾是甚麼？你很難去說到\n底該怎麼做，或是做到甚麼樣的程度是對的，而這種劇情帶來的開放性，輕與重的\n弔詭與矛盾，選了一邊就失了一邊，各有各的失落與收穫，也許他真正和雅莉在\n\
  一起後也會像他見到機長的那一刻，他說他想過很久他要說些甚麼，\n但這一刻他卻不知道要說些甚麼，也不知道自己要甚麼\n自己快不快樂。恰好是Up in the air\
  \ 這個狀態想要描述的。\n\n\n\n\n\n\n    結局，我的解讀是雖然主角受挫，但他第一次不是因為工作的關係而去旅行，\n而是聽了娜塔莉的話，看著無止無盡的未來，選一個他要去的地方。\n\
  我們都在輕與重的弔詭中擺盪，在雲端上兀自飛行。\n\n   一個人也很好，一個人沒什麼不好，一個人無所謂好不好。\n\n\n--\n◆ From: 61.229.54.8"
