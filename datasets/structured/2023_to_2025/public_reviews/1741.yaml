url: https://www.ptt.cc/bbs/movie/M.1681484093.A.5D7.html
title: '[普雷] 《AIR》一雙經典籃球鞋的誕生'
content: '被人穿上才有價值，有著麥克喬丹名字的鞋


  運動是古今中外少數能一直激勵人心的活動之ㄧ，不管是賽場上的競爭或是場外觀眾的觀

  戰，都讓人熱血沸騰，尤其是球類運動更是吸引全球收視，並讓出生小地方的運動員名氣

  水漲船高。


  而有人氣、有收視，這也代表了是件好生意，運動用品隨著運動員的代言而有所起色，其

  中籃球鞋更是這類的佼佼者。


  《AIR》是一部以運動用品商戰為主軸的電影，敘述在上世紀年代Nike籃球部門岌岌可危

  ，銷售遠輸其他運動品牌，營運主管桑尼瓦卡羅，想物色下一季的籃球明星作為代言人，

  他鍾愛籃球新星麥克喬丹想打造用它命名的品牌一搏高下，但不只公司內部意見不同無法

  支持高預算、其他運動品牌也虎視眈眈，而且喬丹想簽adidas，前途坎坷。







  《AIR》是什麼電影？


  在資本市場下，商業可以說是當今社會大眾生活重要的一環，任何事情皆是商業，也是生

  意，而賺錢之道影響著如今每個人的生活品質與未來。錢不是萬能，但沒錢萬萬不能，許

  多事物從過去就有著濃厚的商業氣息，例如一場運動比賽。


  運動賽事行銷其實行之有年，從地方賽事、足球世界杯、到國際奧運等，運動都以商業掛

  鉤，也需要贊助廠商才得以繼續舉辦大規模賽事。


  以台灣運動迷熟悉的NBA美國國家籃球協會為例，光是2002年簽訂的轉播權就價值約46億

  美元，一直到2016年這個轉播權也變成240億美元，可以看見世界運動賽事的蓬勃發展，

  而籃球熱也在全球展開，不只有觀賽與賽事周邊，球員個人的魅力與運動明星的聯名商品

  ，變成許多企業的好的行銷生意。










  以籃球為主題的商戰電影《AIR》，是敘述Nike最成功與傳奇籃球員麥克喬丹合作的籃球

  運動鞋系列Air Jordan。


  當時幕後推手之一的營運主管桑尼瓦卡羅，他透過學生運動聯賽，來挖掘下一個運動品牌

  聯名的代言人，但因為Nike籃球部門一直低迷，他們無法跟其他運動品牌競爭已成熟的明

  星球員，而其他明日之星也不會選擇沒名氣的他們。


  桑尼瓦卡羅根據自己長期關注美國籃球的經驗，最終決定要將這一季的資金全部投入在他

  看中的籃球員麥克喬丹身上，但不僅他們的預算無法比美對方，上層主管也覺得太過於冒

  險，連喬丹的運動經紀人都不看好Nike，甚至球員本身想簽約adidas。桑尼瓦卡羅決定只

  好挺而走險，他決定思考一個內部和外部都無法捉模，可以讓麥克喬丹簽約的策略。












  《AIR》分析與延伸：


  電影中由籃球明星麥可喬丹授權的Air Jordan，是目前Nike旗下最成功的運動鞋聯名品牌

  。其經典標誌單手扣籃的動作，如今也是許多籃球員模仿的經典剪影。第一雙飛人喬丹一

  代在1984年推出，而系列雖然以喬丹球衣背號，在23代畫下一個完美的結束。


  雖然後續也有延伸的子品牌跟繼續每年的喬丹鞋推出，但在23代之後其實有明顯的下滑。

  最受歡迎的喬丹球鞋為11代，除了喬丹之外，也有許多名人、體育明星穿著這穿球鞋出入

  公開場合。


  不過這部講述麥克喬丹的電影，喬丹本人並沒有參與只有敘述一些自己當時的想法。有意

  思的是電影首映日期選在2023年4月5日，是配合喬丹職業生涯  23與45兩個球衣數字。


  這部電影是由亞馬遜出資拍攝，原本只打算上串流平台，但因為試映會時受到好評而決定

  上院線。這部片的拍攝手法也配合電影的時間點，除了影片大小外、連色彩與粒子也故意

  致敬當時的影片，做出完全復古的手法。







  雖然電影受到好評，但是故事內容卻有所爭議。針對飛人喬丹這個聯名品牌的成功，當時

  的團隊每個人都認為自己是最大的幕後工程，而電影《AIR》的主角營運主管桑尼瓦卡羅

  也是其中之一。


  跟他共事的團隊許多人認為桑尼過度誇大自己的重要性，其實最終這筆合作案的成功，他

  只是其中一員而已，但桑尼瓦卡羅卻認為這是故意抹黑他與邊緣他的功勞，認為Nike會這

  樣表示是報復他後來離開Nike到競爭對手公司－adidas。


  同樣以麥克喬丹為主題的運動紀錄片《最後一支舞》中訪談喬丹時，喬丹也有表示桑尼瓦

  卡羅的確有喜歡把所有功勞都歸功於自己，但說的話往往與實際上可能有所出入。甚至在

  這部許多籃球運動人士都推崇的紀錄片中，他完全沒有出鏡也先少被提到，跟電影中對籃

  球員如數家珍，穿梭多個籃球運動賽事的形象有所落差。但因為幾乎每個人都認為自己是

  飛人喬丹這個品牌的最佳推手，故也成為一席羅生門。










  《AIR》值得一看嗎？


  這部電影有個有趣的題外話，有人統計這部電影觀眾歲數平均都是落在35歲以上，而且受

  到這些人的好評。實際上《AIR》的確除了目標客群明顯之外，在許多影評也給予不錯的

  評價，除了是少數以運動鞋商戰為題材的電影外，復古風格和懷舊的敘述手法，讓觀看這

  部片時像是回到80與90年代，對於時代感的營照可說是非常可圈可點，尤其在影片中提到

  許多當時的籃球明星，可能會一下讓人拉回籃球熱的回憶旋窩中。


  但也有人覺得這部電影除了懷舊外，在無優點。除了故事無聊外、甚至還不確定是否為真

  實改編，並且劇情偏袒於某個主管視角等，回到過去典型的美國英雄的口吻，實在太老掉

  牙。


  這些不喜歡的觀眾與影評認為，復古風的確是一個加分項目，但是全然復古到完全連情結

  跟角色塑造都在看舊電影大可不必。甚至有人認為根本是一部大資本的運動品牌宣傳片，

  甚至在為可能失去買氣的喬丹鞋重新造神。








  如果以我一個雖然知道籃球、也知道麥克喬丹的經典，但卻沒有太過關注的普通觀眾來說

  ，《AIR》的復古風情的確很有意思，如果不刻意去院線在電視台撥出的話，真的會讓人

  誤會是哪一部經典老片。


  但也如同一些不喜歡這部片的觀眾所說的，這電影少了很多不可預期的期待感，喬丹鞋爆

  紅程度應該是就連不看籃球的人都知道，故這也讓裡面的故事少了緊張感，而到電影後半

  部甚至平鋪到如同變成了電視劇的水準。


  不過如果你曾經是籃球迷，甚至到現在還熱愛打籃球對與80年代的籃球名人，略知一二的

  話，這部《AIR》會讓你直得上院線，雖然故事和主角的真實性都有所爭議，但這部電影

  主打懷舊與球鞋粉絲向的作品，且製作也算有一定水準，是一部熟知籃球的觀眾會看了很

  開心的作品。但對於一般來觀眾來說，可能就沒有如今電影的快節奏與少了那緊張刺激營

  造的氣氛，然後讓你知道的adidas的小秘密。


  --

