title: '[ 好雷] 《AIR》  NIKE喬丹簽約，像劉備找諸葛亮'
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  影評全文：




  《AIR》，改編自喬丹與NIKE簽約的事件。


  電影導演是班艾佛列克，由他好友麥特戴蒙主演，講述當年排行第三的NIKE，如何與前兩

  名的品牌Adidas和Converse競爭，簽下麥可喬丹代言。


  這三個運動品牌對立的局勢，讓我想到《三國演義》裡三顧茅廬的故事，雖然麥特戴蒙並

  不像劉備求諸葛亮，前去拜訪三次麥可喬丹，但NIKE與麥可喬丹的處境，確實適合拿來與

  劉備和諸葛亮對比。


  市佔率最高的Adidas，彷彿是三國的曹魏，疆域最大財富最雄厚，市佔率第二的Converse

  ，如同三國的東吳，有不少世家大族相助，反觀NIKE的籃球鞋部門快被裁撤，簡直像是當

  時劉備只能據守在一座小小的新野城的處境。


  而麥可喬丹就是諸葛亮，他被NIKE的誠意打動了，沒有選擇馬上可以讓他名利雙收的Adid

  as和Converse，他的媽媽眼光精準，知道與這兩個品牌合作，被重用的機率並不高。


  回到三國的案例，撇除對漢室的忠誠，諸葛亮也許當初也有類似的想法，他出仕已有大量

  人才的曹魏和東吳，不見得受重用，但劉備身邊無軍師，他會是出謀劃策的首要人選，他

  確實成功輔佐劉備翻轉局勢，NIKE也一樣，願意砸所有行銷成本在麥可喬丹，他也幫助NI

  KE翻轉整個市場。


  麥可喬丹做的決定，正是「寧為雞首，不為牛後」的策略，而且他比諸葛亮幸運，喬丹在

  球場和市場都取得全球性的成功，拿下NBA總冠軍和成立了Air Jordan的品牌，名利雙收

  ，助NIKE併購Converse，晉升為市佔率約40%的球鞋公司。


  然而，諸葛亮鞠躬盡瘁死而後已，換來得仍是漢室的覆滅，但我不以成敗論英雄，麥可喬

  丹和諸葛亮都是傳奇。




  全文詳見：


  --'
