url: https://www.ptt.cc/bbs/movie/M.1679316957.A.75C.html
title: Ben Affleck 透露開拍《AIR》前取得 MJ 本人意見
content: "對 Michael Jordan 而言最重要的是…..？\n\n\nTim Mosenfelder/Jacob Kupferman/Getty\
  \ Images\n\n隨著傳記電影《AIR》即將上映，如今有越來越多不為人知的幕後秘辛遭到揭露，像是導演\nBen Affleck 最近就在首映會中向媒體透露當初開拍前曾向\
  \ Michael Jordan 本人請益，\n而電影中的一名「要角」更是 MJ 本人欽點。\n\n消息源自娛樂媒體 Variety，\nBen Affleck\
  \ 證實在製作《AIR》之前的確獲得了 Michael Jordan 的認可。\n「當時我有個機會和 Michael Jordan 坐下來談談。\n　因為我不會不過問他就拍這部電影。」\n\
  \n「當時我問他『有什麼事對你來說是很重要的？』有趣的是，他的確有些重要的建議。」\n\n根據 Ben Affleck 的說法，MJ 確實提供了一些關鍵信息，\n\
  「其中之一是現任 Jordan Brand 副總裁 Howard White 必須出現在電影中。」\n為此，Ben Affleck  立即聯想到曾憑《尖峯時刻》而廣為人知的\
  \ Chris Tucker\n相當合適飾演這名角色，而他自己也一直很想與其合作。此外，Michael Jordan 還分享了\n在生命中影響他最多的人。「他說是他的父親，然後也談到了他的母親。\n\
  這是我第一次在他臉上看到這種表情….. 是一種崇敬、敬畏、充滿愛與感激的表情。\n他說：『如果沒有我的母親，這一切都不會發生。』\n而我則反問你想要誰來扮演你的媽媽？\
  \ Michael 回答：『必須是 Viola Davis。』」\n\n最終，Chris Tucker 和 Viola Davis 都真的加入《AIR》的行列，\n\
  如願扮演 Howard White 和 Michael Jordan 的母親 Deloris Jordan。\n\n電影《AIR》將描述三十年前 Nike 簽約\
  \ Michael Jordan 的一段往事，\n預計於 4 月 5 日上映。\n\n  \n   \n \n\n\ntinyurl目前有問題的樣子，因此附上備用聯結\n\
  --\n\n\n--\n\n必須的\n　\n\n必舔，當年都擔心他會咬舌自盡 XD~"
