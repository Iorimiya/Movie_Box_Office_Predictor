url: https://www.ptt.cc/bbs/movie/M.1739250954.A.55A.html
title: '[好雷] 新世紀福音戰士劇場版：AIR/真心為你'
content: '防雷



































  相信在年齡層偏大的ptt有聽過看過的人應該還不少

  最近偶然聽了殘酷天使的行動綱領而開始追

  我真的覺得畫面剪的真棒

  當然事先就有聽說追到後面要怎麼看

  這篇就討論最後兩集的重製

  也會提及當年一開始匪夷所思的最後兩集

  當然有蠻多人事物礙於篇幅沒辦法提及

  我就想到什麼就講什麼了,請見諒我的任性


  最後兩集最讓我感到震撼的是seele 派部隊鎮壓

  大部分時候nerv都在對抗使徒

  大家眼中就只有那些怪物,努力不讓他們接近亞當

  但人類的敵人果然還是包括同類

  前面一堆看起來很奇葩的使徒再怎樣都能打贏

  最後大家還是幾乎都死了,而且是極為殘酷

  明日香死前的淒厲正是她倔強性格的最後掙扎

  美里死前跟真嗣的成人之吻勝過跟加持的溫存


  最後全人類被人類補完計畫給淨化

  獨留真嗣和明日香,這很大程度說明他們倆的羈絆

  配合他對明日香打手槍的經典場景

  跟明日香的互動是青春期男女關係的一個面相吧

  跟綾波零的關係則是另一種端點

  他們倆都有創傷（誰沒有？）,都因家人而痛苦

  表現出來即使大相逕庭,仍然同病相憐

  最後只剩他們倆,我很喜歡這個安排

  不過明日香應該是死了,那個我覺得只是幻想


  我後來還是有看完原版的最後兩集

  看完之後其實心情有點複雜,怎麼說呢？

  我沒辦法讚美或批評這兩集給我的感覺

  簡單來說就是這兩集什麼都沒做

  只專心在真嗣等人的內心描寫

  其實這是很必要的,畢竟這個動漫的一大重點

  在於青春期的迷惘和內心世界

  但這他媽的是結尾,你應該是要面面俱到

  以收尾來說這完全是亂來

  如果單獨拉出來做兩集我想大家會更能接受

  至少我不討厭這版本,看到最後畫面停在真嗣的笑容

  那一刻在演什麼也不重要了,因為大家都被拯救了


  ----

  Sent from  on my Samsung SM-S9280


  --

  會拿美麗比喻成愛的人，都是不知愛情真相的人

  會把醜陋比喻成愛的人，都是熟知愛的驕傲者


  --'
