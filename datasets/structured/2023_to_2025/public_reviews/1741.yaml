url: https://www.ptt.cc/bbs/movie/M.1662850098.A.7ED.html
title: '[好雷] 戰火狂愛 Mon légionnaire (2021 法國＆比利時)'
content: '這週串流上架的《戰火狂愛》Mon Légionnaire談法國外籍兵團 Légion étrangère的故事，海報上可見法國文藝小生 Louis
  Garrel 轉換戲路練了不少肌肉來演出，女主角則是從法劇《找我經紀人》走紅後多了很多片約可惜尚沒什麼出色表現的 Camille Cottin ，看這海報格局就知這絕非男人上前線打仗的戰爭片、而是兩性故事分庭抗禮的愛情片。而全片戲份最重表現最複雜最引人關心的，倒是海報下方那個只見側臉的年輕女子，這演員是立陶宛大導
  Sarūnas Bartas的女兒 Ina Marija Bartaite，正當我驚喜她也跨足法國影壇時，竟發現此片上映前她已車禍身亡...


  導演是比利時訓練的法國女導 Rachel Lang，前作《安娜的夏日》Baden Baden (2016)在台灣各串流平台上也有，當然看見女性導演就別太期待多緊張刺激氣勢滂薄的戰爭場面，不過她自己年輕曾經從軍浸淫過軍中實務與文化，應該多少對她鏡下的軍人描繪有所助益。本片一百多分鐘片長中，的確沒什麼戰爭描繪，甚至沒什麼國家使命等熱血呼喊，反而幾乎全部是日常生活，甚至以一般觀眾觀點來看恐怕「無聊」又「冗長」，不過也許這就是
  Rachel Lang有意要塑造的「漫長」感：軍旅一回，就是考驗你靜定堅持的漫長等待，這既是女人的等待、也是男人的等待。




  從已逝的立陶宛演員飾演的烏克蘭少女 Jana 開場，此片最明顯的還是「軍眷」故事，有軍團太太女友的女人群戲，以一大一小兩位女主為核心來演繹：小女主 Jana 是烏克蘭人而且看來家境不好，他情郎
  Vlad 是烏克蘭人加入法國外籍兵團，看來也是圖個經濟支柱打造兩人小家庭；只是 Vlad 知道軍旅人生對愛情並不友善不想耽誤女友，但女友 Jana 仍不計一切自己來到科西嘉島追隨情郎，就算知道未來聚少離多五年才能結婚仍堅持要在一起！這也是軍方所期待的家庭模式：前線軍人出生入死承受高壓、後方家眷給予精神支柱無後顧之憂，兩方都是要認真經營的戰線！


  隨後電影拍很多「軍團女人」在後方的組織與活動：當男人在軍營居住時她們辦各種社交、當男人在軍營訓練時她們辦各種康樂，當男人展開 Tour 踏上前線一去幾個月、她們則安排各種美甲
  SPA編織手工孩子寵物的溫馨互助會... 這的確是常見的「軍眷」社群風景：軍眷就是嫁雞隨雞架構隨狗的，往往丈夫就是唯一的家庭經濟來源、女人就負責持家育兒安定軍心，生活單純行禮如儀就按表操課、就算彼此只是逢場作戲就各安其位別想太多。這種生活是軍方努力維持的圖像，也是撐持無數軍人完成任務與無數軍眷撐持生活的必要，但本片顯然帶著批判眼光穿透其空虛。




  本片一大一小兩位女主就不是這種經典標準的完美軍眷，反而都更有一般民人不隨波逐流的獨立自主：大女主 Séline是法國籍中尉隊長的夫人，但她是巴黎執業律師出身天天搭機向外跑，和其他純靠丈夫收入的軍太太截然不同！這種經濟自主事業自主的獨立女性，其生活方式絕非科西嘉軍營所支持，她自過自的不參加太太團更非軍方高層所鼓勵，不但旁人漸漸開始明示暗示咬舌閒話，甚至長官還叮嚀她丈夫「想辦法讓你太太合群點」XD  唉，軍隊是高壓體制，但也是維繫國家主權（與利益）的必要之惡，但真的一點包容人性獨立自由的空間都沒嗎？


  烏克蘭小女主 Jana 處境不同但心境類似：她雖然不是什麼高端專業知識份子，但身為一個普通民女也知人都要自力更生做自己主人，連背起背包追隨情郎都她自主決定；來到科西嘉她尚無夫妻名分但也沒要情郎養，直接自己找到了看護與保姆工作自食其力，自己打點好獨立生活等情郎回來與她結婚共築愛巢。只是她理應努力融入認識學姊打好人脈的「軍眷社群」呢？大家每天美甲美髮剪貼編織言不及義地、明明人生各有苦悶亦有夢想可連結經驗、怎麼淨是埋首瑣事轉移焦點粉飾太平？獨立的
  Jana 寧可出去交投緣的科西嘉朋友，卻有流言蜚語說她不合群甚至不守婦道！




  耳聽 Jana 滿心不服「男人都沒回來、回來也不和我生孩子、難道我連交友都沒權利？」這又道出更深層危機：正典的模範夫妻們，維繫關係生兒育女只需按表操課服膺體制壓抑真心，但像
  Jana 與 Vlad 這對認真面對真心夢想愛情開花結果的，反而會發現這「真心」極難經受考驗！初來乍到時，小倆口儘管將於聚少離多還是懷抱信心，只是第一次數月的分離就已漸行漸遠，在此導演把鏡頭轉移到男人舞台這邊：來自多國的年輕男子們，加入外籍軍團除為養家活口外，更認真對這事業懷有使命感甚至有遠大志向！然而當一天24小時都投注在此時，與後方女人不覺漸行漸遠。


  本片兩男主角就是雙女主角的兩位良人，軍階一高一低各有不同的熱情與志向，也相應產生不同的家庭問題：大男主 Maxime 是法籍中尉隊長，帶起整團男孩們團結一心完成任務就是他24小時努力的一切，從軍的更偉大志向則是解救非洲苦民脫離博科聖地等諸多伊斯蘭極端組織魔掌，就算妻子的巴黎律師朋友們都語帶世故「還不就為了法國的利益」，但對他來說苦民在那等待解放、那就我們使命就當為法國贖罪吧...
  總之訓練備戰遠赴前線的男性團結軍旅生涯、和妻子的巴黎知識份子高談闊論風景越來越遙遠，妻子能夠忍受一切分離隔閡努力留下經營都是為了「愛」。




  但這與其說是心心相印的感性之愛，不如說已成為了知性相許的理性之愛，彼此意識都知道愛著對方是初衷也是責任、但身體早已不自覺地分道揚鑣了、還能維繫在一起都靠理智的努力。對人已三十多歲心智成熟懂得承擔的小隊長
  Maxime 來說，這樣聚少離多各安其位的家庭關係已走上「正軌」：他專心訓練備戰帶領男孩上戰場完成任務、就放妻子衝自己律師事業自找保母顧小孩，家庭有什麼需他操心的就等回家再說；但真回家後也只是理智上盡丈夫義務愛護著妻子撫慰她孤心、盡父親義務好好陪兒子給他建立榜樣，只是真有空餘可以選擇要幹嘛？還是選擇和兄弟們一起。


  年長主角 Maxime & Séline 雖然表情體態互動細節等細微演技已看得出身心分離，但至少維繫家庭「在一起」這事仍能夠苦澀撐持。但年少主角 Vlad &
  Jana這一對，在這堅持傾聽真心揮灑自我尚未世故的純真年紀，真心的結果就是連「在一起」都難維繫： Jana 知道自己和情郎心已漸行漸遠而且絕不避諱，但仍把握與情郎的每次相聚去努力重燃愛火；可惜情郎
  Vlad 雖然理智仍愛著女友但心已不在此，他的心都在突擊隊訓練志業上、都在同生共死的弟兄們身上、都在他遠赴異國看到的苦難百姓身上，而他能給女友的就是送個布娃娃、送隻小狗狗、送個戒指、辦個婚禮。




  這身心分離狀態最苦澀的高潮戲，是性的高潮卻是愛的低潮，片名 "Mon Légionnaire" 竟然冷冷地在此出現令人百感交集！難道本片給女人拍了這麼多又是柴米油鹽又是美甲
  SPA又是流言蜚語的「漫長等待」後，等回來的 "Mon Légionnaire" 已經只剩這軀殼？但怎知，這些回家只剩軀殼的男人也正在屬於他們的「漫長等待」中，只是女人沒親身接觸這些就永遠不懂：


  在戰場，他們身為軍人就只是漫長指揮鏈中的小螺絲釘，戰爭絕非見敵殺敵保護隊友那樣直覺，而是連要搶救兄弟要打擊敵人都要經過層層授權的「漫長等待」，看 Maxime
  某場遠遠聽見戰事發生卻只能狂打電話的熱鍋螞蟻戲可見一斑；出任務，他們長年訓練備戰只為迎接敵人，就像是揮灑多年熱情只為迎接戀人 XD 但敵人不知在何方亦是個「漫長等待」，可能一次車隊幾個禮拜或一次
  tour 好幾個月都沒見敵人；回到科西嘉島與家人聚首數月，這對他們來說反而是一場煎熬，因為一顆熱情的心都在兄弟身上在遙遠戰場，與家人相處的時光反而成了數饅頭的「漫長等待」。




  這真不是我們一般民人可以想像呀！我們這些「不願役」以前當兵數饅頭都是在服「兵役」，覺得我們的人生正軌是在軍營外的事業與家庭，當兵是一種不得不負的義務甚至是煎熬、卻從不是人生熱情自我實踐之所在，甚至不少「志願役」也只是在數二十年饅頭等領終身俸；但對本片這些真的知道「為何而戰」更已全心奉獻的法國外籍兵團男人們來說，反而任務結束與家人聚首才是「家庭役」，與其說是有家人讓他們無後顧之憂可以放心上戰場送命，不如說家庭時光更像一種「義務」訓練他們沈潛忍耐謹守本份，以讓他們揮灑熱情攜手同袍投身戰場時更有責任與節度。


  結果本片女人們有沒有期待到「漫長等待」開花結果？這場法國外籍兵團救援馬里的反恐戰爭有沒有造成改變？放長時間看那都是持續努力中的進行式、很少人有緣得見圓滿的一天、倒是更多人中途失敗鎩羽而歸。本片最後一鏡很不避諱地展現了女導眼光下的男男「肌情」XD  如果建軍備戰海外干預是國家的必然，那是否本片描繪下的外籍兵團男人們反而找到了屬於他們的圓滿？只是這從身到心成為軍人的圓滿，卻與民人的家庭愛情徹底分道揚鑣了...
  本片對這現象並沒讚頌或批判等明顯立場，就只是從日常中冷靜拍出其苦澀，推薦可以忍受「漫長等待」的觀眾欣賞。



  --'
