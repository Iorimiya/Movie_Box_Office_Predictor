title: '[好雷] AIR'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  講到世界知名的運動品牌，一定會想到Nike與愛迪達，而這兩間公司的競爭早在四、五十

  年前就已經非常激烈。不過，真正讓Nike躍升為一流球鞋品牌的是1984年Nike為傳奇球星

  麥可‧喬丹發行的Air Jordan系列。Matt Damon與小班這對哥倆好的最新力作《AIR》便

  是講述這個運動鞋品牌生產線的誕生過程。



  當年仍是菜鳥球員的麥可‧喬丹，和Nike成立不久的籃球部門合作，憑著Air Jordan改寫

  體育世界及流行文化。



  Matt Damon與小班兩人的銀幕魅力再一次為影迷帶來經典之作，他們在1997年憑藉《心靈

  捕手》奪得奧斯卡最佳原創劇本，《AIR》更是他們第20次合作，也是小班首次執導由

  Damon主演的電影。兩人在片中飾演的角色：Nike創辦人菲爾‧奈特與籃球部門球探桑尼

  ‧瓦卡洛，同樣靠著同甘共苦、開疆闢土的堅定友情，帶領Nike邁向成功。



  電影一開場就開宗明義告訴觀眾桑尼是一個喜歡賭博的人，雖稱不上是賭徒，但至少是勇

  於承擔賭博風險的人。Nike以賣跑鞋起家，當時的知名籃球員腳上踩的都是Converse，

  Nike的籃球部門成立不久，成效一直不好，正面臨遭裁撤的危機，對桑尼與整個籃球部門

  來說，能否成功簽下麥可本身就是一場賭注。本來25萬美元是要用來簽三位新秀，但眼光

  獨到的桑尼認為既然要一舉成功就必須孤注一擲，決定傾全力與Converse與愛迪達進行一

  場搶人大戰。



  桑尼正在煩惱究竟該簽下哪位球員時，品牌主管霍華就分享自己過去成功簽下大牌球星的

  關鍵是「搞定有決策權的媽媽」，讓桑尼後來決定不遵循正常程序時，直接殺到北卡去登

  門拜訪。雖說唐突無禮，甚至得冒著破壞行規丟掉飯碗的風險，桑尼也要說服全世界最早

  相信麥可一定會成功的人。他不但解釋自己對麥可‧喬丹的信心來自何處，也清楚指出對

  手的問題所在，希望喬丹家能夠給Nike一個機會。



  《AIR》並不是麥可‧喬丹的傳記，而是傳奇鞋款誕生的故事，全片都沒有出現麥可的正

  臉，真要說的話媽媽的戲份還比較多，而且是由麥可本人親自欽點金獎演員Viola Davis

  飾演。媽媽最後選擇打算全心將兒子打造成明星的Nike，也開啟球員與球鞋品牌分潤銷售

  的先例，現在也與麥可‧喬丹一起經營以丈夫命名的基金會，幫助與他們一樣的弱勢家庭

  ，並為球員與家屬創造被動收入。



  除了媽媽的信任與支持、桑尼的鍥而不捨與獨到的球探遠見之外，《AIR》也仔細描繪球

  鞋產業的分工。包括品牌如何圍繞著球員塑造新產品、行銷手法與球鞋設計等。運動行銷

  先驅羅伯‧史崔瑟更大膽提出挑戰NBA當時的「51%」規則，要求傳奇球鞋設計師彼得‧摩

  爾大膽用色，再由Nike為麥可‧喬丹支付罰款，達到另類的宣傳效果。對彼得來說，設計

  Air Jordan系列也是一件極為享受的事，除了終於可以做出自己夢想中的完美鞋款，片尾

  也說明他是如何發想出系列經典的「Jumpman」標誌，不禁讓人驚嘆一個成功的品牌，背

  後有多少努力與用心，當然帶有賭博成分的機運也很重要。



  既然《AIR》改編自真實事件，考據自然不能馬虎。電影一開場就置入不少歷史畫面蒙太

  奇，搭配上復古的配樂、歌曲與畫面，建立滿滿的時代感。串聯劇情之餘，也穿插很多

  Nike的趣事與軼聞，像是Nike早期的員工十大守則、經典Logo與標語「Just do it.」背

  後的故事，以及與執行長菲爾‧奈特有關的細節都有呈現，包括他的葡萄紫色跑車、慢跑

  習慣與赤腳辦公等。另外，與麥可相關的人、事、物更是不能遺漏，例如：大力推薦Nike

  給他的教練喬治‧拉維尼與他擁有馬丁‧路德演講稿的軼事、經紀人在賣掉公司當天獨自

  用餐。



  不論觀眾是否為Air Jordan系列或Nike的忠實客群，能夠透過《AIR》這部電影了解這個

  系列鞋款的歷史與其背後有趣的故事，都是令人愉快的兩小時。雖然麥可完全沒有露臉，

  也絲毫不減本片的精采程度。挾著金獎卡司、、激勵人心的轉折與引人入勝的敘事，《

  AIR》絕對是今年至今最棒的一部片。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
