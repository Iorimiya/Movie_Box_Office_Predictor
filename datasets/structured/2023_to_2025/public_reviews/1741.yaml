title: '[問片] 假神父跟弟弟盜賣鑽石'
content: '因為只是短暫的看大約半小時 所以印象很少


  歐美片  沒有很嚴肅 故事很好笑  大約兩年前看的 不知道台灣有沒有上映過


  故事應該是兩個兄弟 手上有鑽石 然後被追殺 （應該是被黑道追殺）


  應該是他們偷了誰的鑽石


  然後哥哥  躲到教堂 一個很純樸的地方


  偽裝成神父  還聽人告誡 還給人建議


  因為哥哥本來就不是神父 所以有些建議 or 舉動 很有趣


  然後私下吩咐弟弟把鑽石賣


  弟弟 看起來愛玩愛玩  賣掉有錢後


  居然拿去大花特花 找女人開好車跟party


  結果好像被逮到了


  然後 追殺他們的人就找到哥哥在的教堂  那天教堂還在舉辦活動 居民都來了


  然後記憶就到這了


  感覺是喜劇片


  感謝大家了


  --'
