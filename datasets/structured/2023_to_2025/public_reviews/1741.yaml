url: https://www.ptt.cc/bbs/movie/M.1681035989.A.19D.html
title: 電影Air主人翁現身說法 慧眼獨具相中喬丹
content: '電影Air主人翁現身說法 慧眼獨具相中喬丹


  2023/4/9 17:59


  （中央社紐約8日綜合外電報導）


  本週在美國上映的電影Air，主角是運動品牌Nike的員工瓦卡羅，他稱自己當時在年輕的

  喬丹身上，看到「從未在其他人身上看過的特質」，並說服公司和喬丹建立革命性的夥伴

  關係。


  法新社報導，1984年在耐吉（Nike）總部進行的一次會議中，瓦卡羅（Sonny Vaccaro）

  提議將公司未來用來招募美國職籃NBA球員的所有經費，全部押在喬丹（Michael Jordan

  ）這位體壇新星的身上。


  由班艾佛列克（Ben Affleck）執導的Air，敘述了Nike 追逐當時將大學畢業的喬丹之事

  ，並提到當時喬丹比較想簽約的對象，是Nike的競爭對手Converse和Adidas。


  在歷經近40年之後，Nike和喬丹的夥伴關係已經發展成為一個大帝國，總部設在美國俄勒

  岡州（Oregon）比佛頓（Beaverton）的Nike，去年光是喬丹品牌（Jordan Brand）銷售

  額就達51億美元（約新臺幣1553億元）。


  當年在Nike的工作岌岌可危，現年83歲的瓦卡羅說：「我（在喬丹身上）看到一些別人可

  能沒有的東西…我賭上自己的工作，因為我覺得他就是那個天選之人。」


  瓦卡羅說：「喬丹有些與眾不同之處，他具備殺手本能，他總是很有競爭力，我從未看過

  其他球員能（像他那樣）。」


  集企業家、商人、球探身分於一身的瓦卡羅說：「我認為惟一能拿來和喬丹及其成就相提

  並論的…就是布萊恩（Kobe Bryant）。」瓦卡羅認為，布萊恩「擁有同樣的本能」，跟

  喬丹一樣，有那種「我才不甩任何東西，我祇想成為最強的」。


  在電影Air中，麥特戴蒙（Matt Damon）飾演的瓦卡羅，在1996年把布萊恩簽進他當時服

  務的公司Adidas，2003年還差點簽下詹姆斯（LeBron James）。


  （譯者：李晉緯/核稿：劉淑琴）1120409


  #喬丹 #瓦卡羅 #布萊恩


  中央社









  --'
