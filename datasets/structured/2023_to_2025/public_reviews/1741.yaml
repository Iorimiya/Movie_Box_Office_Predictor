title: '[好雷] 愛在天邊 love is in the air'
content: '雷文防雷資訊頁


  愛在天邊

  love is in the air

  2023澳洲電影

  Netflix原創電影


  一名在熱帶地區飛行的水上飛機飛行員，發現自己愛上了一個被派來毀掉她生意的男人。




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  本片的澳洲場景畫面之碧海藍天綠地，優美遼闊，女主角Delta Goodrem是美麗，活潑朝

  氣，充滿活力的機師Dana Randall，男主角Joshua Sasse是帥氣魅力的商業菁英William

  ，

  來自英國，二人好匹配，劇情可預期卻流暢好看，全片給我賞心悦目的感受，看完感覺舒

  暢的影片。


  個人滿意度80分（滿分100）。這種影片因為劇情老梗及可預期，影評分數都很低，所以

  影評不叫好，也可以預期。但我個人當做爆米花娛樂電影的標準來欣賞，是看地輕鬆愉快

  的。



  --


  典型羅曼史言情小說系列之一，哈哈哈。'
