title: '[金馬] Fresh Air : 花樣那卡西'
content: '這部看得很不完整，一開始完全看不到中文字幕…之後直接看英文字幕才了解劇情，

  但已經走了四分之一。不知道是喜好還是刻意安排，這對時有衝突的母女一個以紅色為基

  底、一個以綠色為基底，母親的環境場域都是暖調、女兒的場域環境都是中冷調子，母親

  喜歡俗艷的玩意兒、女兒是小受肯定的服裝學校的學生；片中她們唯一和樂相處的客廳壁

  紙則是一片變色中的樹林與短路電視的連續劇。


  　　我看不懂這部除了肥皂劇般的劇情，還想傳達什麼樣額外的訊息(身後的兩個女孩倒

  笑得挺開心的)。也是因為劇情很簡單，我把焦點都放在演員的表情與小動作上，一注意

  反而覺得很多地方太過做作，鏡頭又過分強調：例如女兒的窗戶開關，母親總會幫她關上

  窗戶(母親的自信心與女兒的嫌棄)，窗檻似乎就像一個界線，女兒總是坐在上面；描述愛

  情與感情變化的部分與其說是細緻，感覺暗示的僑段又太過頭，但可以感受到明顯母女(

  年齡)對感情的態度、感受這點倒滿新鮮；我喜歡那場打翻母親信件的戲，女兒男友的激

  情到打翻信的轉折，媽媽的情書被朗誦的憤怒、媽媽回家迅速隱藏起來的感情、男友落荒

  而逃，我覺得這段女兒的戲演得很棒，整個叛逆的感覺有演出來又不過於矯情。


  　　她想去羅馬參賽過了一天又回到搭車的地方、母親幫她錄的錄影帶、母親受傷住院、

  她穿上母親暖橘的清潔制服這段我真的覺得很弱，最後她跟母親一樣噴灑香芬劑、不再用

  衛生紙掩鼻，暗示她也妥協了什麼的感覺，最後鏡頭拉遠我心裡也響起「啊？！」的聲音

  。




  --

  ◆ From: 211.74.219.103'
