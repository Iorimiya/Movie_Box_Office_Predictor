url: https://www.ptt.cc/bbs/movie/M.1664084419.A.24F.html
title: '[微好雷] Catch the Fair One'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~













  無意間看到的

  直接盲狙


  片長很短

  一個半小時都不到


  但是後段節奏稍嫌緩慢

  故事劇情有點平鋪直敘了點


  簡單來講就是 一個女拳手

  為了找妹妹 讓自己臥底單槍匹馬直闖賊窩


  用了兩年的時間 各種訓練

  包括被男人撲擊的時候如何反抗


  如何面對比自己噸位大上許多的男人

  並且要練習要在自己嘴巴裡面放刀片 以備不時之需






  一人solo當然就是戲份都在女主角身上


  說片子緊湊嗎 好像也還好

  其中還有配角的老婆幫忙


  感覺配角的老婆，可能也是以前被綁架過的一人

  只是剛好被配角男主角看上了


  另外女主角為了要復仇

  各種沒有讓自己有多喘息的時間


  裡面還帶一點女主角與媽媽之間的隔閡

  因為妹妹的失去而起 不過就只帶出那一點點


  總之是部還不錯看的動作片

  最後女主角重回台上，我想應該是死前的幻想吧


  就是各種單薄了點


  --





  --'
