url: https://www.ptt.cc/bbs/movie/M.1178469047.A.409.html
title: '[心得] A Prairie Home Companion (大家來我家) 觀後感'
content: "本文同步刊登於中央情報局鍾情電影版 telnet://cia.hinet.net\n----------------------------------------------------------------\n\
  \n\n\nPICTUREHOUSE影業2006年發行。2006年柏林影展獲獎；獨立精神電影獎、\n芝加哥電影評論協會獎、廣播電影評論協會獎、紐約高譚電影獎、衛星獎\n\
  等多項提名，榮獲第78屆奧斯卡終身成就獎的電影巨匠Robert Altman最\n後一部作品。片中希望傳達的，幾乎等於他在癌中面臨生命最後階段的人\n生獨白。\n\
  \n六七零年代廣播電台的音樂節目，時常有許多由歌手團體在電台現場演出，\n電台中便設置了類似表演廳的場所讓觀眾可以直接欣賞，而現場收音的即\n時演出與觀眾的掌聲反應等，更增添收音機前聽眾的參與感。只是從電腦\n\
  興起跨入娛樂工業之後，這種現場表演、收錄與放送的經營模式便開始式\n微，某種程度上來說也是閱聽大眾的損失。\n\n本片根據Garrison Keillor的同名廣播節目改編而成，背景設定在一間即\n\
  將吹起熄燈號的地方廣播電台，許多景物道具帶著十足的六七零年代風格，\n許多空間使用黃色燈光局部照明，氣氛顯得昏黃懷舊，畫面色澤充滿復古\n質地。漂浮的粉塵微粒襯托出了膠捲粒子感，與主線故事十分契合。\n\
  \n\n全片以Robert Altman獨有的敘事結構組成，展現出導演人生將盡，卻體\n察細微的人生多種樣貌呈現。片中眾多知名演員一字排開可以演好幾部主\n流商業電影了，Kevin\
  \ Kline、Meryl Streep、Lily Tomlin、Woody Harrelson、\nLindsay Lohan、Virginia Madsen、Garrison\
  \ Keillor、Tommy Lee Jones等，\n如何讓許多角色恰如分際地表現出平易近人的生活質感，同時不會干擾彼\n此的戲份與注目度，都考驗著導演的敘事功力與編劇的架構編制，這也是\n\
  Altman式劇本最獨到之處。\n\n一般導演大多讓一個演員清楚講述完台詞後，才輪到同場景的下一個演員\n開始發言與演繹。但Robert Altman獨創了多人同時發言，多線多段劇情\n\
  同時交叉進行的敘事手法，使得劇情推衍看似雜亂，難以聚焦，實則必須\n觀賞近尾聲，才能體會導演的獨特手法營造出人事地時物的真實厚度。從\n70年代引起主流商業電影界的負面評論，使得後世有類似架構的電影誕生，\n\
  如Crash、Babel等，並獲得多方肯定，Robert Altman的影響絕非只是一\n座奧斯卡終身成就獎所能囊括。\n\n\n影片開始後沒多久，幾乎九成以上的演員便已全部出場，以極度生活化的\n\
  自然對話緩緩地將觀眾帶入Garrison Keillor's radio show的後台。這樣\n的劇本在一開始自然不造做到甚至有點瑣碎，有點挑戰習於主流商業電影\n\
  觀眾的耐心，但導演也適時加入許多懷舊與即興風格的鄉村與爵士音樂，\n同時展現出鄉村廣播電台充滿平民化趣味的部分，以吸引閱聽者帶著輕鬆\n的心情繼續往下看。這些零散繁雜的台詞，以及看似無意義的劇情段落，\n\
  無形中建構出片中這群長年工作夥伴的鮮明形象，並帶出每個人的性格與\n彼此間的相互關係。\n\n眾多資深演員親自配唱且現場收音的插入歌曲，包括Meryl Streep、Lily\
  \ Tomlin、\nWoody Harrelson、John C. Reilly等，連充滿時代感的鄉村歌曲都能詮\n釋得絲絲入扣，不僅展露他們的精純演技，更表現出專業演員對於角色演\n\
  繹的高度融入。除了讓本片獲得音效技術專業項目提名，也絕對能讓觀眾\n感受到鄉村音樂的獨特魅力，輕鬆爽朗又充滿即興的詼諧。\n\n從每個演職員面臨電台歇業前最後一晚的現場播出，或坦朗以對、或眷戀\n\
  不捨、或生澀未熟、或冷然平淡、或頻頻回顧，逐漸架構出這一群合作多\n年的工作夥伴間不同的人生態度，以及各自懷抱的相異卻深厚的情感。看\n似瑣碎，實則羅織蔓密，使得觀眾逐漸浸淫析透於其中。那股煦煦熱情即\n\
  使年老力衰卻依舊燃燒不息，即使面對熟人年邁撒手卻仍然攜手向前。\n\n或許是幾十年的光陰歲月讓他們看過了太多，讓他們明白握緊現在身邊的\n手，比什麼悲傷哭嚎都還要來的更重要更實際。\n\
  \n\nLindsay Lohan的角色十分微妙，雖然在眾多演技派老將的光輝之下，她\n一向擅長略帶叛逆卻古靈精怪的高中女生因而顯得薄弱，卻有獨特象徵\n意義。她從一開始不耐無趣的態度，後來在演出中逐漸發現了現場演唱鄉\n\
  村歌曲的張力與趣味，結尾再出現時卻早已遠離鄉村音樂圈，成為金融工\n作者後變得世故古板。這或許象徵著Garrison Keillor's radio show的演\n\
  職員們在這幾十年鄉村音樂工作生涯中，身邊來來往往、去去留留的人們。\n有人留下，有人離開，送往迎來，即使曾經擦出火花，卻還是選擇了不同\n的道路，最後剩下的就是自己身旁這些夥伴。\n\
  \n\n另一個悄悄帶來轉折的人物便是Virginia Madsen飾演的白衣天使。雖然\n初出場時感覺不到她在劇情間扮演的角色所在，只見她默默地來往穿梭電\n\
  台間，沒有人特別覺得訝異。直到Guy請託她帶走Axeman，大家才似乎終\n於發現她真實身分。而當她最後出現於片尾的時候，Garrison Keillor、\n\
  Kevin Kline、Meryl Streep、Lily Tomlin以各自的角色性格，演繹出那\n既複雜，卻又多少了然於心，知道終有一天會到來的心情，想來是該坦然\n\
  接受，但似乎還有無法放下的事物，平實淡泊卻無比深刻，讓人過了好久\n再回想到那個畫面，每個人的表情都寓著極深的深意，仍覺哽咽。\n\n本片的原聲帶有出附一片DVD的豪華版，DVD收錄電影中幾首經典歌曲的演\n\
  唱片段，還有幾個電影中並未出現的演奏曲片段，是一片內容非常豐富、\n值得收藏的作品。\n\n\n\n\n--\n☆★   終於開始了  我的電影觀後感文章Blog\n\
  \       有電影海報  有文字感想  有我....有你\n                ☆★\n\n--\n◆ From: 218.168.52.179"
