url: https://www.ptt.cc/bbs/movie/M.1680009504.A.8B9.html
title: '[好雷] 《AIR》Just do it'
content: '這部應該會衝擊明年奧斯卡一些獎項，而且

  很適合行銷企劃相關人員來看，感覺之後會

  有滿多行銷公司會像《魔球》一樣，包場請

  員工看，當然懂NBA的人會更容易入戲，劇

  中都會提到不少上古神獸球員。



  對於Air Jordan，當年還是屁孩在打籃球時，

  會穿著Air Jordan 7代黑白配色，在投藍前會

  大喊 欸啊Jordan！然後接著喊「ㄘ ㄨ ㄚˋ克」

  ，感覺穿了喬丹鞋命中率會加個30%那樣的屁

  ，就算沒進手腕也會在那空投一次，然後「嘖

  」一聲XDD，但後來長大才知道Nike當時壯大

  的背景故事。


  櫻木的喬丹1代Bred





  雖然看似行銷商業戰的電影，但骨子裡卻是

  跟運動比賽場合一樣精彩熱血緊湊，很佩服

  小班的導演功力，希望茱莉亞別再攻擊小班

  的村莊，讓他那麼累了。



  這部電影並非強調喬丹的事蹟，但在許多場景

  是無所不在，當初覺得喬丹不出演，只用替身

  當背影形式出現，以目前來看是正確的，因為

  無人可以代替喬丹，總不可能叫麥可B喬丹來

  演吧XD





  劇中主角們打造的不是只有喬丹個人，而是

  Nike整體的王國，雖然以小搏大、創新思維都

  在現今聽起來是很普遍的，但在那個年代、那

  個Nike，算是翻天覆地的改革，加上劇本很節

  奏明快又明確，不會讓人感受到商業戰的乏味

  ，而且這些卡司演出都具有相當水準，就像籃

  球場上快速導傳一樣，迅速又準確的帶進觀眾

  內心，幾乎毫無什麼太大冷場，尤其喜歡桑尼

  在會議中那段話橋段，喬丹經典畫面配合桑尼

  感人的對白，甚至帶到喬丹爸爸被槍殺的新聞

  畫面，彷彿進入的時光隧道。




  劇中對白節奏很快，但不會有艱深的商業用語

  ，時不時穿插幽默笑點，尤其時小班跟克里斯

  塔克，劇中甘草人物擔當。



  劇中的美術蠻不錯，還原了80年代許多服裝

  跟佈景，也出現許多令人懷念的畫面，ex:

  霹靂遊俠、黛安娜王妃、Ghostbusters等，

  非常推薦進場觀看。




  -----

  Sent from JPTT on my Xiaomi 21091116UG.


  --'
