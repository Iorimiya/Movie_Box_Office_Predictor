url: https://www.ptt.cc/bbs/movie/M.1679047405.A.994.html
title: 贈票【AIR】北中南特映會搶先看
content: "【AIR】是獲獎導演班艾佛列克的最新作品，描述當年仍是菜鳥球員的麥可喬丹，和\nNike 成立不久的籃球部門合作，憑著 Air Jordan 改寫體育世界及流行文化。片中的故\n\
  事感動人心，呈現一個不按牌理出牌的團隊賭上一切；一位清楚知道自己兒子有著無比才\n華及巨大價值的母親；以及一位將成為史上最偉大的籃球天才。\n\n\n《抽獎方式》\n\
  3月19日 (週日) 18:00 前，推文留言你想要搶先看【AIR】的〈場次〉與〈原因〉，就有\n機會搶先看電影！\n（如：高雄場，這對金獎組合非看不可！ 也想知道經典是如何打造出來了！）\n\
  \n《獎項內容》\n【AIR】電影試映券（一人得獎兩人同行，共抽10組）\n\n《特映會場次》\n中午場 3/21(週二) 12:30 台北大直美麗華影城 10組（一組2張）\n\
