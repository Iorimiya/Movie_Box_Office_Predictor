url: https://www.ptt.cc/bbs/movie/M.1686481192.A.D64.html
title: '[新聞]麥特戴蒙幫川普競選代言？《Air》台詞遭競'
content: '麥特戴蒙幫川普競選代言？《Air》台詞遭競選團隊移花接木，電影公司嗆：不同意使用

  ！




  美國前總統川普 (Donald Trump) 正為2024年美國總統大選背水一戰，然而最近他的宣傳

  物料卻爆出侵權。上週六，川普在個人創立的社群平台「Truth Social」上傳一支募款影

  片，公然使用了麥特戴蒙 (Matt Damon) 在電影《Air》中的台詞音檔，形同讓麥特戴蒙

  為他的競選背書一般。


  麥特戴蒙與班艾佛列克 (Ben Afflick) 共同創辦的電影公司「Artists Equity」 週六立

  刻發布聲明，明確表示：「我們對於川普在競選或任何用途使用《Air》電影的素材一事

  事前並不知情，也沒有給予同意或認同。」並嚴正通知川普團隊：「在競選活動使用《

  Air》電影素材必須得到授權，且我們不同意這樣的授權。」


  《Air》是由班艾佛列克自導自演的電影，講述80年代中期Nike公司如何成功說服「空中

  飛人」麥可喬登 (Micheal Jordan) 接下自家的代言，以及傳奇運動鞋 Air Jordan 的崛

  起。片中麥特戴蒙的台詞說道：「金錢可以讓你買到一切，但它不能讓你永垂不朽。」沒

  想到意外與川普個人的競選理念不謀而合。


  ======

  川普人緣真差,不過這版權也太嚴苛就是了



  新聞網址：




  --'
