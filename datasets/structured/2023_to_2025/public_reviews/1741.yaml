title: '[閒聊]電影裡亞洲女生的條染 Asian Hair Streak'
content: "網誌圖文版\n\n\n\n\n\nHair Streak，這個陌生的英文名詞，目前中文常和「挑染」( Highlight ) 搞在一起，\n但是兩者之間有根本上差異，根據物理上外觀以及原有的髮型界名詞，因此翻譯成條染。\n\
  \n\n「條染」與大家熟知的「挑染」有什麼差別呢？請看下表(1)。\n\n\n│條染與挑染的比較                          | by \n\
  ┌────────────┬────────────┬───────────┐\n│                        │ 條染  ( Hair Streak\
  \ )  │挑染    ( Highlight ) │\n├────────────┼────────────┼───────────┤\n│        \
  \  區域          │      從髮根到髮尖      │      頭髮的末端      │\n├────────────┼────────────┼───────────┤\n\
  │          髮量          │   常用較厚的頭髮著色   │  常用薄薄的頭髮著色  │\n├────────────┼────────────┼───────────┤\n\
  │          顏色          │    常和原髮色不相似    │    常與原髮色匹配    │\n├────────────┼────────────┼───────────┤\n\
  │          效果          │   使臉部看起來更顯著   │    賦予柔和的外觀    │\n├────────────┼────────────┼───────────┤\n\
  │          對象          │      通常適合短髮      │     通常適合長髮     │\n└────────────┴────────────┴───────────┘\n\
  \                                             \n\n\n定義完成後，開始討論今天主題，電影界有個現象：亞洲女性角色常常會有條染造型，\n\
  \n這有個專有名詞叫 \n\n\n\n\n藍色組的代表有《環太平洋》( Pacific Rim ) 的菊地凜子跟《歪小子史考特》( Scott\n\nPilgrim\
  \ vs. the World ) 的王艾倫 ( Ellen Wong ) 。\n\n\n\n\n\n紫色組的代表，往《X戰警》( X-Men ) 系列看就好，《X戰警：最後戰役》(\
  \ X-Men:\n\nThe Last Stand ) 的靈蝶 ( Psylocke ) 、《X戰警：未來昔日》( X-Men: Days of\n\nFuture\
  \ Past ) 演閃爍 ( Blink ) 的范冰冰、乃至於《死侍2》( Deadpool 2 ) 的忽那\n\n汐里皆是如此。\n\n\n\n\n\n紅色組的代表則有《雲圖》(\
  \ Cloud Atlas ) 的裴斗娜跟《金鋼狼2：武士之戰》( The\n\nWolverine ) 的福島莉拉。\n\n\n\n亞洲女性角色的條染問題，2014年以降就有諸多文章探討這個問題\
  \ (2, 3, 4)，然後在\n\n2017年在推特上再炒過一次，有亞裔女生回應，大意如下。\n\n\n\n\n\n只能說這真的是傻傻的阿兜仔，不僅遺忘了他們祖先說過的經典：\n\
  \n\n\n\n更不知人間險惡，亞洲女生看似文靜，但最後仍然會默默地接管你的一切，從車房存摺到\n\n你的行為思想皆然。\n\n\n\n扯遠了。\n\n\n條染是不是有什麼種族歧視涵意或者莫名的種族刻板印象，那個是左膠與SJW們的飯碗，\n\
  \n隨便就可以從社會學講到女權流派，甚至是後現代主義，進而引發筆戰與上街抗議，實在\n\n是嘆服。\n\n\n\n\n《大英雄天團》( Big Hero 6 )\
  \ 中的神行蛋葆 ( GoGo Tomago )\n\n\n\n個人才疏學淺，只能自美學角度探討，所以問個基本問題，\n\n為什麼條染幾乎都是挑紫色或者藍色？\n\
  \n\n\n從配色的角度來說，這兩種顏色都不是人類正常的髮色，運用上就顯得有種叛逆氣質。\n\n\n\n這兩者又同時是冷色系，冷色系給人感覺常是堅實、強硬的，然後記得這些用上條染的亞\n\
  \n洲女性角色又多留短髮，這幾項元素加乘下，會讓角色更有種動力十足與身手矯健的印象\n。\n\n\n\n而且紫色與藍色，鋪在亞洲女生的黑髮上時，原來是冷靜收縮的顏色，在黑色相襯下，也\n\
  \n頓時活潑起來，畢竟顏色還是有相對之分。\n\n\n\n至於紅髮，本來就是傳統上認為叛逆的髮色之一，所以用它剛好，江湖有道是：\n\n\"Blondes are\
  \ wild, Brunettes are true but you will never know what a Redhead\n\nwill do.\"\n\
  \n( 金髮女孩狂野，黑髮女孩則真誠，但你永遠不會知道紅髮女孩會做什麼。)\n\n\n\n關於紅髮女性的種種觀念，詳見《電影裡的紅髮美女》\n\n\n\n\n\
  底下有人發問了，一樣是冷色系，為什麼不挑綠色？\n\n\n\n因為綠色的話，在西方文化中，經常與死亡或者巫術等的邪惡事物聯繫在一起。\n\n\n\n\n\n\n\
  這個例子遠的有的伊娃．葛林 ( Eva Green ) 的《萬惡城市2：紅顏奪命》( Sin City:\n\nA Dame to Kill For ) 的綠瞳壞女人\
  \ ，\n\n近的有凱特．布蘭琪 ( Cate Blanchett ) 在《雷神索爾3：諸神黃昏》\n\n( Thor: Ragnarok ) 的死亡女神\n\n\
  再來是《星塵傳奇》( Stardust ) 的蜜雪兒．菲佛 ( Michelle Pfeiffer ) 用的魔法\n\n注意看也是綠色。\n\n\n\n\n\n\
  我都可以猜到西方人心裡的OS是這樣了。\n\n\n所以綠色就被屏除在外了，幫QQ。\n\n\n\n\n\n當然知道這點之後，女生們，如果妳想要扮演一個可愛又迷人的反派角色，就用一下綠色\n\
  \n條染吧！\n\n\n\n至於其他顏色，金色，西方女生已經有了，不勞亞洲女生來搶，橙色或粉紅色，又有種甜\n\n美感覺，對於本來就甜甜的亞洲女生來說，帶來的反差不大，所以也不用。\n\
  \n\n\n總結文章重點。\n\n\n\n\n\n\n相關文章\n\n\n電影裡的紅髮美女\n\n\n\n\n電影裡的「金黑紅女孩現象」( Blonde, Brunette,\
  \ Redhead )\n\n\n\n\n參考文獻\n\n1.\n2.\n3.\n4.\n5.\n\n--\n\n\n\n--\n\n            \
  \    感謝回應 我也是因為覺得有趣才找資料寫這個主題\n\n                v(￣︶￣)y\n\n\n               幫補圖\
  \ \n\n               原來這叫 Balayage 一直覺得這種髮型設計特別漂亮\n\n               女生髮型真是博大精深!\n\
  \n              是喔 會一眼就認出來 @@\n\n\n              對啊 那篇我寫的 其實本意都在研究電影裡的美女 只是從頭髮出發\n\
  \n                對啊 就是個刻板印象 但是讓髮型很美觀的刻板印象\n\n\n                近期電影其實還有新版金剛戰士的幽冥女王"
