title: 'Re: [金馬] Fresh Air : 花樣那卡西 (劇情)'
content: '女兒一直嫌棄母親。嫌棄她的工作、她的職業習慣、她對小事物的品味。也

  之所以她幾乎不與母親對話，只以字條傳言。母親一回家就女兒忙著打開全

  屋子的窗，像是厭惡共居一室般地亟欲散去母親的氣味，從她那卑微鄙賤工

  作帶回來的廁所臭氣與芳香劑。她唯一能與母親共處、只有當她們一同看著

  電視上的肥皂劇之時，因為那是女兒也喜愛的興趣，她才能於此刻接納同為

  愛好者的母親。那是短暫的沉默和平。


  這對母女就如同彼此身上的色彩，紅與綠，水火不容。


  直到母親受傷住院，見著她臉龐上的傷痕、以及即使不能下床行走卻依然存

  在的堅強性格（「他們休想拿走我的鑰匙！我很快就會回去上班」），必須

  自力更生的女兒這才肯正視母親的存在。她悄悄取走母親皮包中的鑰匙，循

  著母親每日留下的步伐，來到女兒一直避之唯恐不及、一直冷笑不屑的母親

  之工作場所。


  一開始她還用衛生紙摀住鼻子，害怕那想像中的惡臭會向她襲來。她打開母

  親的櫃子、望著那色彩繽紛的瓶瓶罐罐，指尖滑過牆上的掛飾、輕撫花瓣舒

  張的人造花，然後她取出自己的服裝設計草圖、釘在牆上；原來女兒跟母親

  始終相像，就連愛在牆壁上掛滿小東西這點習慣也極雷同。她們只是無法容

  納彼此的色彩。她也才發現母親每日辛苦經營的微不足道工作，並非如想像

  中那麼屎尿不堪，亦會在每日來往的顧客中留下印記，亦有人會為了母親傷

  勢而擔憂。


  於是女兒拿起母親的俗豔大紅長袍，披在自己雙肩上，讓母親的顏色沾染上

  自己的全身。她悄悄地與不在場的母親達成和解，並在母親每日獨處的陋室

  裡拿出自己未完成的草圖，一邊跟隨著母親步伐，一邊走出自己的方向。原

  來這兩件事並非完全背道而馳。女兒不知不覺中放下了掩在鼻頭的衛生紙，

  開始收起零錢、換上新的廁紙，就如同她母親每日慣常的行為一般。


  （眼淚不爭氣地滑落）


  --'
