url: https://www.ptt.cc/bbs/movie/M.1531666051.A.FF2.html
title: '[好雷] 《皇家風流史》(A Royal Affair)'
content: "◎《皇家風流史》(A Royal Affair / En kongelig affare)\n   - 一段影響國家走向的轟轟烈烈情史\n\n\
  圖文完整版： \n\n瞧丹麥電影《皇家風流史》這片名，很容易誤將本片想作充滿火辣後宮鬥爭\n與激情的片子，但其實它是一段與丹麥國家走向緊緊相連的真實歷史，除了\n\
  風流韻事，還可以看見一位改革者，想找到平衡點有多困難：一方面要有雖\n千萬人的衝勁與勇氣，但又能不因滿腹理想而躁進，或是被野心所蒙蔽。\n\n1766年，15歲的英國公主Caroline（艾莉西亞薇坎德），嫁給丹麥的年輕國\n\
  王Christian VII（Mikkel Boe Folsgaard）成為皇后，原本懷抱憧憬的她\n，卻發現國王行為怪異、瘋癲幼稚、沉溺女色，於是皇后在順利生下繼承人\n\
  後就與丈夫形同陌路。國王無心國事，前往歐洲其他國家旅行，途中因身體\n出狀況，找來德國醫生Johann Friedrich Struensee（邁茲米克森）擔任御\n\
  醫。一同回到丹麥後，內心崇尚自由思想的醫生，與皇后陷入愛河，並操縱\n孤獨需要朋友的國王，對抗守舊、迷信的宮廷政客，將丹麥帶往更現代化、\n自由、開放的政治路線......\n\
  \n《皇家風流史》有兩大主軸：浪漫愛情與政治，當時丹麥在歐洲算是思想較\n為落後的國家，啟蒙運動挑戰舊秩序的改革火苗還沒燒到那兒，皇后從英國\n帶來的書有好多本被沒收，因為那些作品當時在丹麥仍屬禁書；Struensee\n\
  醫師則是伏爾泰和盧梭思想的支持者，這類思想在丹麥是非常前衛甚至是禁\n忌的。\n\n於是，國王、皇后、與醫生，三人形成頗為奇異的關係。先是國王與皇后不\n合，再來是孤獨的國王因為繼母與宮廷朝臣都不站在他這邊，又對國政興趣\n\
  缺缺，非常渴望友情，因此懂得如何讓國王開心的醫生，特別容易獲得信賴\n；另一方面，年輕、堅強、喜愛自由的皇后，在深宮也是毫無盟友，還是個\n外國人，因此同為異鄉人、抱著自由思想的醫生，成了皇后唯一的依靠，也\n\
  點燃了愛情，而且國王並未察覺有異，甚至期待醫生能讓被國王戲稱為「母\n后」的嚴肅皇后，能受醫生影響，成為活潑有趣的老婆。\n\n這些關係的形成，顯現了「知識」如何讓人的心靈開始交談與溝通。醫生與\n\
  國王第一次真正「溝通」，話題是莎士比亞，也讓醫生發現國王其實很喜歡\n演戲，只是礙於國王身分，不能圓夢。醫生與皇后則是經由對於伏爾泰和盧\n梭思想的推崇，將他們牽在一起。\n\
  \n就這樣，醫生與皇后聯手利用國王的權勢操弄政治，而丹麥在這段時期也進\n入快速進步的時期，醫生的理想，如保障言論自由、廢除農奴、禁止逼供、\n給兒童注射疫苗、改善貧民困境、清理下水道等等，都快速施行。若只看這\n\
  時期，會覺得三位主角的關係幾乎是完美狀態，他們可以互相吸取需要的友\n情或愛情，還讓丹麥躋身先進國家之林。而且，醫生對國王的「友情」，並\n非完全虛假，在好幾個地方看得出他們並非只是「聰明人利用呆瓜」的關係\n\
  ，而是有著真情關懷的，甚至可以說，國王、皇后與醫生，在那個皇宮與時\n代之中，都是「異類」，不難產生某種惺惺相惜的感情。\n\n只可惜，雖然啟蒙運動崇尚理性，但醫生最終屈服於他的激情，不管是政治\n\
  手腕與政策太過激進與一廂情願、日益膨脹的權力慾望、或是對皇后的愛火\n，都已經失控了。醫生把國王當傀儡，宮廷與宗教人士早就等著好好教訓他\n，再加上國王的繼母也有兒子，對王位一樣虎視眈眈。這位外國醫生一次樹\n\
  立了這麼多敵人，他與皇后的戀情給了反對者大好機會，畢竟這不僅是通姦\n，更是叛國，有心人士以這樁醜聞為基礎，運作民眾的保守與排外心態、翻\n轉民意，醫生一手建立的新秩序就如紙牌屋般不堪一擊。\n\
  \n更諷刺的是，醫生提倡著以人民為主、為人民著想，卻使用獨裁的方法，一\n切依照他的個人意志而行，因此久而久之連人民也不站在他這邊。或許他心\n裡幻想著自己在對抗貴族與權貴，但他順便也把人民變為敵人了，反而令改\n\
  革重回原點。有心改革的有志之士，在理想與現實條件下該如何妥協、與民\n溝通、達到平衡，一向是重大考驗。\n\n《皇家風流史》曾入圍奧斯卡最佳外語片，除了劇情引人入勝，技術項目如\n\
  服裝與場景設計也極為細膩精緻，宮廷的明亮優雅，對照著平民百姓居住環\n境的黯淡無光與雜亂，當時的社會環境與階級狀況不言而喻；電影時序的最\n前段，Caroline還在英國的時期，光線明亮、色彩繽紛，隨著劇情發展，鏡\n\
  頭色調越來越朝藍灰色調為主，暗示著不詳的命運。\n\n三位主角的精采演技更是一大看點，丹麥最具國際知名度的演員邁茲米克森\n，飾演有野心又對皇后深情款款的醫生，他的種種情緒不需靠言語，總是可\n\
  以從表情、臉部線條的變化等等看見，配上角色的下場，是非常揪心的演出\n，他最後的戲份會看到讓人心靈受創。瑞典女星艾莉西亞薇坎德當時還很年\n輕，而且是為戲學習丹麥語，但演技純熟有自信，皇后外表的堅強與內心的\n\
  煎熬，都絲絲入扣。不過，全片最佳表演，是拍攝本片時還沒從戲劇學校畢\n業的Mikkel Boe Folsgaard，他演的國王，起初看來殘酷瘋癲，卻漸漸令人\n\
  同情，觀眾會發現這號人物內心是有些天真與善意的，只不過，由國王身分\n帶來的無奈與禁錮感、以及或者在那個年代還無法被正確辨認與治療的疾病\n，令他對外的憤恨與厭惡更加激烈。\n\
  \n喜歡歷史與政治的朋友，《皇家風流史》不容錯過。\n\niTunes立即看：\nGoogle立即看：\n\n--\n\n我的部落格 \nFB粉絲團  \n\n\
  --"
