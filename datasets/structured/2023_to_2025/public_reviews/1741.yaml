title: '[ 普無雷]  AIR - 中規中矩的人物傳記'
content: '《AIR》6/10分 中規中矩的人物傳記

  -

  據說本來只是要在串流上而已

  後來因為內部試映評價頗好

  於是改上院線


  若以串流說來 高於水準

  但以院線片來看

  又有點不夠精彩


  本片以NIKE員工桑尼的視角來紀錄當初NIKE是如何從愛迪達、Converse 等大品牌手中簽

  到麥可喬丹這隻金雞母


  要比喻的話

  《AIR》 像是戲劇張力沒那麼強的《魔球》（布萊德彼特主演）

  同樣是在講述運動產業裡的真實事件

  《魔球》深刻的人物刻畫 豐富的內容 都贏《AIR》幾條街


  《AIR》也不乏明星陣容 光是麥克戴蒙跟班艾佛列克這兩位好兄弟擺出來

  就有一定的號召力了

  演技上也挺好

  就是在劇情上的精彩度少了

  有點太好預測 沒太多印象深刻的橋段

  雖然整體看下來是順的 是有趣的

  卻還是有點太溫和了

  （幾段內容跟《魔球》有點類似 直接高下立判）


  片中有些對話滿引人省思的

  以及提到許多過往的球星

  個人對NBA籃球是完全沒研究

  所以情懷這個加分題我是沒被打到


  所以

  喜歡真實人物傳記的可以看

  喜歡麥可喬丹與那個年代的NBA可以看

  喜歡麥特戴蒙跟小班的可以看


  最後再推一下《魔球》


  以上


  ——


  更多無雷電影心得：


  --'
