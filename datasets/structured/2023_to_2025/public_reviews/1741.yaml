url: https://www.ptt.cc/bbs/movie/M.1676944438.A.128.html
title: '[新聞] 麥可喬丹指定 班艾佛列克銜命完成《AIR》'
content: "新聞網址：   \n   AIR 中文預告\n\n麥可喬丹指定非要她演不可 班艾佛列克銜命完成 《AIR》卡司陣容\n\n鏡週刊 的故事\n\n\
  繼《心靈捕手》《最後的決鬥》，班艾佛列克（Ben Affleck）與麥特戴蒙（Matt Damon\n）決定再次合作《AIR》，把當年Nike如何開發出飛人喬丹鞋（Air\
  \ Jordan）的傳奇搬上\n銀幕。\n\n《AIR》描述當年仍是菜鳥球員的麥可喬丹，和Nike成立不久的籃球部門合作，憑著Air\nJordan改寫體育世界及流行文化。片中的故事感動人心，呈現一個不按牌理出牌的團隊賭\n\
  上一切；一位清楚知道自己兒子有著無比才華及巨大價值的母親；以及一位將成為史上最\n偉大的籃球天才。\n\n\n），但是扮演麥可喬丹母親洛絲喬丹的可是剛剛奪下葛萊美獎，集滿艾美獎、奧斯卡獎、\n\
  東尼獎等四大獎項的薇拉戴維絲（Viola Davis）。麥特戴蒙飾演魄力十足的Nike主管桑\n尼瓦卡洛（Sonny Vaccaro），班艾佛列克飾演Nike共同創辦人菲爾奈特（Phil\
  \ Knight）\n。\n\n《AIR》也是導演班艾佛列克第一次執導由麥特戴蒙擔任主演的電影，他們在2021年發現\n了這個劇本後，愛不釋手，決定一起合作搬上大銀幕。班艾佛列克日前才出席了NBA全明\n\
  星賽事，，「。」\n\n他表示拍攝《AIR》的動機並不是創作所謂的傳記電影，「而是我個人對這些事件的看法\n。如果這跟任何事情有關，那就是麥可喬丹對整個體育界、全世界的意義，還有他是誰，\n\
  以及這又如何改變體育跟整個體育行銷，運動員如何獲得收入，還有這整個過程如何支持\n他勇往直前。」\n\n在與麥可喬丹聯繫過程中，他親自告訴班艾佛列克，。但\n\
  是小班面有難色，心想：「麥可，你是沒辦法叫得動薇拉戴維絲的。」但是麥可喬丹堅持\n不要其他人選，於是班艾佛列克不得不親自出馬，「謝天謝地，她答應了。我很高興我能\n\
  辦到這一點，這對他非常重要。\n\n如同飛人喬丹鞋從此改變了球鞋世界，《AIR》也創下了先例，就是由Amazon買下了版權\n，照理說應該是在自家的Prime\
  \ Vidoe串流平台上架，但這次卻按照一般電影發行模式，\n先在戲院發行。至於串流平台的上架日則尚未公佈。\n\n\n\n\n看了預告 真的蠻期待這部~~~~~\n\
  \n--"
