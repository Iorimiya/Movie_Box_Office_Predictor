url: https://www.ptt.cc/bbs/movie/M.1680114980.A.C24.html
title: '[好微雷] 《AIR》飛人喬丹與 NIKE 傳奇'
content: '“A shoe is just a shoe until someone steps into it.”




  這不是一部 Michael Jordan 的傳記電影，而是 Nike 如何簽下麥可喬丹，並且為他打造系列球鞋的歷程。

  但這部電影要說的，並不是大資本勝利的故事。


  Nike 當年只是球鞋市場裡的小咖，遠遠敵不過老大 Adidas 和老二 Converse，更被戲稱「人們只有買跑步鞋才會想到 Nike」，籃球部門風雨飄搖隨時要被裁撤。


  當然，後來發生了什麼我們都知道了：Michael Jordan 成為不看 NBA 的路人也家喻戶曉的名字。Air Jordan 系列鞋款一出就是三十幾代。


  但這也不是一部單純歌頌小蝦米擊敗大鯨魚，上演跌破眾人眼鏡的逆轉爽片。


  表面上或許是球星、鞋牌各取所需的交易罷了。




  但沒有眼光精準的球探轉任 Nike 行銷專員 Sonny Vaccaro（Matt Damon 飾）、運籌帷幄的經紀人 David Falk（Chris Messina
  飾，喜歡《新聞急先鋒》的老觀眾應該會覺得眼熟）、愛講佛法但骨子裡還是勇於冒險的管理高層 Phil Knight（Ben Affleck 飾）、把製鞋視為打磨藝術品的設計師
  Peter Moore（Matthew Maher 飾），以及知子莫若母的喬丹母親 Deloris（美劇《謀殺入門課》女主、《自殺突擊隊》召集人 Viola Davis）等等角色的動機與行動，串聯成這運動產業鏈，喬丹還會是我們所認識的麥可喬丹嗎？


  更甚者，球員如何成為一種職業，如果只是「把球打好就好」，沒有那些後勤、沒有娛樂化的產業聯動，怎麼能單純透過展演人類體能極限的力與美，就如此激勵人心呢？台灣人應該經典賽後尤有所感吧。


  是啊，如果生活的意義本身就不存在，生命本是無常，那麼能夠仰望無限逼近奇蹟的人物，並且有個信物，彷彿自己也與他同在，這賦予意義的過程，不就正是生活本身嗎？即使這層意義，透過造神與行銷不斷的販售，而不只成為運動場上的傳奇、更是商場上的神話，那又何妨？


  敬那些能說好故事、為創造奇蹟燃燒熱情的工作者們（不管是打工人還是資本家）。


  敬那些明知生涯如流星轉瞬即逝卻仍想多留下點什麼的運動員們。


  身為一個遊戲玩家和電影迷，近年來娛樂產業的發展及科技硬體的進步，讓視覺與體感饗宴的邊界逐漸模糊，於是作為消費者的我們開始企圖在遊戲裡找到自身的定位和歸屬，我想是同理的。


  所以也敬有緣分能閱覽這些故事，從中汲取鬥志回到日常生活奮戰的你我。


  願你也能好好紀念那些讓你的奮鬥有意義的故事。




  --'
