title: '[好雷] 皇家風流史 A Royal Affair (2012 丹麥)'
content: "回顧瑞典小天后 Alicia Vikander舊片，第三部是台灣終於有上院線的《皇家風流史》，我竟也沒看過。此片談 18 世紀末丹麥國王 Christian\
  \ VII、他任內任用了一位德國醫生 Johann Friedrich Struensee 、這醫生卻漸掌大權且與王后 Caroline Mathilde私通的故事。關於丹麥史上有位國王近臣坐大攝政還當小王的故事，我也是當歷史八卦聽得很有印象，看看這片海報都以\
  \ Vikander 飾演的王后為中心、開場也是王后回顧過去書信道來、難道這是一個女人夾在兩個男人之間的女性悲劇故事嗎？\n\n看完全片我才發現，這當然是悲劇，但並不是以那傳統的女性悲劇為核心，而是一場屬於三個理想主義年輕人的悲劇；若要說這裡有什麼「三角關係」，那與其說是一個女人夾在兩男之間，不如說是一個平民夾在國王與皇后之間！這貌合神離的王與后，倒是靠這位平民雙手各自撐起圓滿了自我也建立了情誼；倒是這位平民出身的大醫師\
  \ Struensee，史實中在這段時間應該才 32 歲，比起分別 20 與 18 的王與后是大上一輪但仍很年輕呀，竟然讓邁叔來演突然有種堅強可靠引人孺慕的歐巴感\
  \ XD\n\n\n\n        皇家風流，青春三人行\n\n此片是個精緻考究的古裝劇，除了史實操德語入主丹麥朝廷的 Struensee在本片只講丹麥語、以及片中王后寫給女兒的遺書應該是杜撰之外，好像所有關鍵劇情、人物關係、乃至花絮事件統統都緊貼史實？那這種片的功用就是給不熟歷史的我們上一堂丹麥歷史課嗎？那倒也不，我覺得它把冷冰冰歷史課所看不到的各種「情懷」給栩栩如生拍出了，令人看起片來情緒緊緊跟著三位主角熱情地起伏。看片前，我以前印象所知對這三人都冷冰冰地沒什麼好感：一個是精神異常不能任事的瘋癲國王、一個是心猿意馬自由自在的天真王后、另一個則是處心積慮奪權上爬的心機醫生。\n\
  \n不過看了電影後，對這三人的印象大改觀！此片為這三人失敗不堪的一生提出了動機、勾勒了處境、描繪了奮鬥、而作出了一種平反：瘋癲國王之所以瘋癲，是千年的王權枷鎖壓在男孩身上令他喘不過氣、只剩下國王至少還被允許的瘋癲做出一次次發洩與抗議；天真的王后，一樣是千年王權的性別枷鎖強制其婚配、禁錮其一生，尤其她來自的英國那時已經歷改革漸趨開明、然而丹麥仍保守如中世紀；而心機的醫生，與其說充滿心機汲營上爬、不如說滿懷熱情追尋理想，他是要來解救國王小友禁錮的自我、進而解救王后禁錮的孤心、更雄心壯志要來解救這禁錮國家的人民。\n\
  \n而這一切，包括男孩從王權枷鎖的解放、女孩從性別枷鎖的解放、以及人民從中世紀制度的解放，都可上綱到我們今日追溯的歐洲現代化源流：啟蒙運動。片頭開宗明義不談國王不談王后更不談什麼「風流」，就只專心談「啟蒙」Enlightenment\
  \ ：故事展開的 1766 年，歐洲尤其是西歐英法等強國，啟蒙運動如火如荼展開已逾半世紀，本片主角們熱衷閱讀而茅塞頓開的盧梭洛克伏爾泰等著作已廣為流傳；只是這啟蒙之火尚未撼動歐洲最保守的丹麥，丹麥仍以歐洲最後的基督教捍衛者自居，對啟蒙書籍嚴加查緝、對啟蒙份子罷黜流放，堅持捍衛中世紀政教合一與農奴制傳統。\n\
  \n\n\n        啟蒙運動，丹麥的種子\n\n歐洲啟蒙運動在民間流傳無遠弗屆，然而體制改革有先有後，分水嶺就在各國「廢除農奴制」這一關，說實話丹麥在歐洲廢得也不算太晚，是在本片這位國王\
  \ Christian VII仍在位的 1788 年。不過當時丹麥真掌權的是國王兒子，時年 20 的「攝政太子」Frederick VI，本片聲稱要談「啟蒙運動」，但場景設在丹麥王室卻不談這段啟蒙開花結果的制度改革？本片卻是把時間往前推移了二十年左右，要談這位攝政太子出生長大時的啟蒙種子：生下他的父王與母后、以及從小為他安排教育養成的皇家老師\
  \ Struensee，他們正經歷一場啟蒙運動理想主義者的青春夏日。\n\n電影從 1766 英國公主嫁進丹麥王室、與瘋癲的國王丈夫毫不對盤互相厭惡只剩義務談起，到了\
  \ 1768 生下太子盡完義務相敬如冰、孤寂的國王逃避出遊時倒邂逅了一見如故的德國醫生Struensee。1769 國王返國帶他回來當御醫、御醫成功紓解國王情緒使他愈上軌道令百官稱頌，起初討厭丈夫的王后恨烏及屋連他一起討厭、他卻愛屋及烏對王后處境一併關懷。到\
  \ 1770 春天他引進「牛痘疫苗」為太子接種終於破冰、更與王后展開禁戀！同時 1770 夏天他開始掌權之路、在 1771 年一路頒布數千個改革法案，但改革過於激進引起政敵謀害、於\
  \ 1772 年一月終於被捕迅速處死。\n\n本片大概分三段：前一小時是三人的集結，從他們各自出身不同互不相識、有緣相遇卻互不對盤、直到彼此伸出橄欖枝後互相看見交心而同氣連枝，啟蒙思潮正為孤寂少年們帶來心頭活水；中段十五分鐘，是這場「啟蒙運動理想少年的青春夏日」，醫生一手牽著國王推行政治改革、一手牽著王后談論啟蒙享受愛情、三人心照不宣卻成最佳拍檔殷切期待「自由」的來臨；可惜馬上進入後一小時的急轉直下，醫生的改革畢竟太過躁進，不但動搖國家現狀缺乏可行性、更得罪既得利益者招來政敵，他的愛情也太過理想、以爲能隻手遮天終要爆出來，終成小辮子給政敵抓到砍了頭。\n\
  \n\n\n        三段魅力，理想的傾頹\n\n前段魅力，在一場場年輕的知遇：戲劇，在莎士比亞，在憤懣國王誰都不信時、促成了他與醫生一見如故的交心，回宮後兩人更進一步把本來國王只當橡皮圖章的無聊政治，當成一場酣暢淋漓的戲劇；文學，在伏爾泰等啟蒙文學，王后自小在英國讀慣了、帶來丹麥卻被悍然查禁？倒是赫然發現討厭的醫生書架上也有這禁書；科學，在醫生帶來的「牛痘疫苗」，在天花流行人人束手無策時率先接種保護小王子，取得王后的感念與信任；運動，在終於打開心扉與醫生搭話的王后，在醫生慫恿下初次由束手縛腳的女性側鞍轉為腿夾馬肚的正規馬鞍，在草原上初次享受自由的快感！\n\
  \n中段魅力一轉，成為一種歷史跑馬燈，這段其實才是「啟蒙運動少年的青春夏日」，在王后聲音娓娓道來的書信回憶中，是「那些年，我們通過了好多法案，自由的果實彷彿就在眼前」，然後一幕幕國王的台上表演、一幕幕醫生的背後編導、一幕幕的法案公告令人心花怒放宛如美夢成真！只是美夢真能成真嗎？在歡快的旁白與配樂節奏下，鏡頭仍很有意地不時帶到不甚苟同的諮議會貴族政客們、憂心忡忡的國王繼母\
  \ Juliana Maria、以及看著法案公告茫然不解又惴惴不安的市井小民們，我們都漸漸知道三位年輕人理想高遠走在尖端，這龐大的國家包袱其實極難撼動。\n\n\
  電影末段，傳統宮鬥劇魅力登場！這對諮議會主席來說，是基進主義與保守主義的衝突，改革可以但激烈如革命可不行；對諮議會貴族來說，他們的權位與財勢才是真的，其他理由都是冠冕堂皇純粹當令箭；對國王繼母\
  \ Juliana Maria來說，就是最傳統的奪權宮鬥，要擁立自己兒子當攝政王、自己當太上攝政女王、就要把國王的「瘋癲」加緊逼迫加重打臭、更要用宮鬥老招「通姦」清掉醫生與王后、留下可繼承的小王子與小公主。於是由政府要員主動贊助散佈「皇家風流」醜聞，謠言滿天飛竟然都是合法的！因為\
  \ Struensee才剛頒布廢止審查的「言論自由」法令 XD\n\n\n\n        三位少年，純真的幻滅\n\n很弔詭地，Struensee 自認為人們帶來革新、諸般法令賦予人民自由，但自由很快受政客操弄、短短一年變成巨獸反噬天真改革者。人們不懂啟蒙也不在意政治改革、反而他們更在乎傳統王室威儀天下，愚昧人民聽到捕風捉影的王室醜聞、不用消息來源不用核實辯論先罵再說。反倒聰明的貴族政客從不真正在乎醜聞真假、他們只在乎醜聞可以動員群眾遂行政治鬥爭。史實中，到底有沒有這醜聞呢？到底王后的小女兒\
  \ Louise Augusta 親生父親是不是醫生可？那都很難說，本片倒都拍真了，只是政客清楚利益所在，不管信不信這醜聞為真，殺了醫生驅逐王后留下子嗣才是真。\n\
  \n\n我們最熟的 Mads Mikkelsen 飾演醫生的演技，在電影前段是充滿理想摩拳擦掌躍躍欲試、在中段則漸漸如魚得水進退得宜更宛如父輩肩膀撫慰兩位少年的心，然而到了後段，隨著改革在體質上與政治上的失敗，他原本堅定有節的心也漸受蠶食鯨吞。在此電影給他和王后的姦情一個關鍵的影響：隨著謠言甚囂塵上、三人之間心照不宣的關係也漸漸失去了默契、本來國王與醫生同氣連枝的「內閣」也處處彆扭負氣無以為繼，於是導向了醫生在史實中走錯最大的一步「獨裁」，使他真正失去了開明派的肯定、保守派的忌憚、人民迷迷糊糊的支持、以及國王不計條件的積極保護。\n\
  \n靠此片拿柏林影帝的 Mikkel Følsgaard飾演國王的演技，在前段是瘋癲國王不計形象百無禁忌，是那種地位頂天、主權為零、只能行禮如儀當個橡皮圖章、只能努力靠發瘋耍潑刷存在感的悲喜劇演技；在中段，以同一套身段同一招瘋癲、加以對自身處境定位的「啟蒙」就脫胎換骨、竟遊走宮廷若真似假收放自如、成為專屬他的君王城府掌握了群臣；到後段，這種曇花一現的君王城府畢竟缺乏實權的根基，他表面的悠遊自得也缺乏心志的考驗，於是面臨醜聞他衝動爆氣了、面臨陰謀他輕易受騙了、唯獨面臨妻子與醫生的隱瞞（而非通姦），他咬牙忍淚決定都當沒發生。\n\
  \n當年靠本片打入國際市場的 Alicia Vikander飾演王后的演技，則比較旁觀、比較沉潛、也比較擔待。在前段，她是最錦衣玉食的棄婦，兩人都乖乖聽話聯了這一百個不願的姻，兩人打過幾炮有了孩子盡完義務後，再也懶得見國王的王后擺明放棄人生只與兒子相依為命；在中段，醫生的關切是這裡初次遇見的人性、醫生帶來的禁書是這裡初嘗的文明、醫生的提點更是恍如昨日的啟蒙之聲，王后在此即使身體仍受重重禁錮，心靈已如花綻放漸容光滿面藏也藏不住；在末段，眼見醫生的政爭失了盤算、國王的維權更流於天真、她身為女人也只有當個棋子任人宰割無聲見證著...\n\
  \n\n\n        上代種子，下代果實\n\n倒是這「見證」也許才將為本片那一閃即逝的大同理想、那曇花一現的啟蒙改革、以及那短短一年的三人行青春，都能承接下去開花結果吧？據許多史家的評估，此片穿針引線的「王后臨終家書」應該是不可能存在任何史料的，因為若果真正存在受到了驗證，等於明言「Louise\
  \ Augusta公主是私生女」，這會讓她被廢位驅逐的；但此片，硬是要讓早逝的王后於 1775 年寫下這自傳式遺書、勾勒那啟蒙理想曇花一現的改革實踐、來提醒 1783\
  \ 時年 15 的太子 Frederick VI 回想童年懵懂的見證、而能於 1784 年發起政變成為攝政太子後展開丹麥真正的劃時代改革吧？\n\n照電影字幕所說，太子\
  \ Frederick VI 未來攝政加繼位總共統治丹麥 55 年，勵精圖治徹底將丹麥由中世紀封建農奴國家改造為 19 世紀現代化國家！不過當然我們查查史實也會知道，他改革歸改革，這一路王政也並沒多堂皇多順遂啦\
  \ XD 但無論如何一個國家從中世紀進入近現代的「啟蒙」過程，絕非一蹴可幾，必須尤其理念與實踐的變革。也許在本片呈現的這個丹麥案例中，理念變革由上一代的醫生與國王基進地先做了個全、即使失敗仍得勾勒理想讓王后見證傳承下去、到下一代重起爐灶記取教訓才能開花結果作出結構性的改變吧？\n\
  \n看維基百科上談到本片劇本，靈感來自一本以醫生與國王之改革冒險為題材的小說 \"The Visit of the Royal Physician\" ，只可惜這本小說電影翻拍權落在別人手上，編劇才找了另一本以醫生與王后之醜聞為題材的小說\
  \ \"Princess of Blood\"，把兩本小說各自著重的啟蒙探索給結合起來成為一場三人行，並在政治改革與個人自由這集體個體兩線上隨時比較參照，這才成了我們看到的《皇家風流史》！此片製作考究、切合史實、理性摘要、感性演出，它給觀眾上一課看似嚴肅的啟蒙運動歷史、卻靠年輕人們四目交投會心一笑攜手前行的青春紀事來呈現！推薦欣賞。\n\
  \n\n--"
