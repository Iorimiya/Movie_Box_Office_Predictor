title: '[討論] 班艾佛列克導演新片《Air》預告 '
content: '班艾佛列克執導、改編自真實事件的體育題材電影《Air》釋出第一支預告





  劇情描述 Nike 在八零年代中期是如何說服籃球巨星麥可喬登（Michael Jordan）接下自

  家代言的過程，小班在片中將飾演 Nike 共同創辦人菲爾奈特（Phil Knight），麥特戴

  蒙則飾演當時負責極力遊說喬登的桑尼瓦卡洛（Sonny Vaccaro）。



  本片由班艾佛列克執導，和麥特戴蒙共同擔任製作人，並且親自演出。



