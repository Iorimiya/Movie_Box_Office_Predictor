url: https://www.ptt.cc/bbs/movie/M.1536039588.A.E06.html
title: '[普雷] 億萬男孩俱樂部 Billionaire Boys Club'
content: "雷文防雷資訊頁\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n1.影片名稱 :\
  \ 億萬男孩俱樂部 Billionaire Boys Club\n\n2.觀影時間 : 2018/09/02 23:00\n\n3.觀影地點 : 住家網路\n\n\
  4.觀影方式 : iTunes美國版商店\n\n\n§其他防雷說明 : 此片在台 10/19會上映，\n                 我建議愛 Ansel\
  \ Elgort 或 Taron Egerton 的就來看，\n                 要抵制 Kevin Spacey 的就別看。\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n雖然凱文史貝西在影壇已經毀了，不過我還是挺愛他和安索艾格特在《玩命再劫》中的默契與魅力，當然就對他們兩合作的另一部《億萬男孩俱樂部》也很期待。看完後，只能說他們兩人的角色關係雖然不同了，但其間針鋒相對的火花還是挺精彩的，而且此片安索艾格特帥出一個新高度，助攻的兄弟泰隆伊格頓學了一套美國口音橫掃比佛利山也有一種囂張的狂傲，看兩大帥男盡情發揮最棒了！\n\
  \n\n\n只是很可惜，我覺得此片看點就是這幾位演員了（安索第一泰隆第二史貝西第三），其餘整個故事說得不太行、有點沒脈絡、許多可以挖深的社會亂象與小人物情感都沒去挖深。這個故事題材\
  \ \"Billionaire Boys Club\" 是 1983-1984 年一次「龐氏騙局」空殼公司挖東牆補西牆的詐騙大案，這間空殼公司叫作 \"BBC\"\
  ，由於公司成員都是哈佛貴族預校的金童校友們才得了「億萬男孩俱樂部」的暱稱，這些男孩要的也不是錢，而是一種掌控自己人生、擁有自己事業、在父親底下獨立出一口氣的感覺。\n\
  \n這種貴族學校有錢公子心路歷程的題材，我覺得很棒很有得發揮，譬如 2015 年電影《玩酷壞痞子》The Preppie Connection就拍得瘋狂、憂傷、又唯美，看一幕幕不知所措的少年們自大犯險做毒品生意，拍到後來在一幕幕豪宅樓閣的吞雲吐霧中，我們彷彿都見到末日前夕失怙孩子們只渴望著父母一眼關心，讓底層出身不怕死向上爬的男主角一次次鋌而走險、一面放不下這又病態卻又迷人的友情、另一面又為這些貴族孩子的美麗與哀愁感到憐憫。\n\
  \n然而《億萬男孩俱樂部》呢？也許算是我期待錯誤了，這片雖然兩位男主角是出身洛杉磯下層 \"The Valley\" 爬進高層比佛利山莊與貴族為伍、開場很快也精闢分析了貴族孩子的心理缺陷與有效的合夥動機，但此片關於貴族孩子的心理問題就拍到這裡為止了、一群貴族帥男就這樣變成任主角動員的應聲蟲、沒什麼角色動機也沒什麼戲份（裡面還有《戰馬》Jeremy\
  \ Irvine 耶，他快過氣了嗎？）。要真說談心路歷程，本片只談兩位爬上來的主角，可惜也談得差強人意、沒發揮這題材的巨大潛力。\n\n\n\n兩位主角出身 \"\
  The Valley\" 爬進比佛利山高層，這點在泰隆美國腔娓娓道來的電影開場白中有談而且是重點，整個彷彿是他們從底層帶著憤懣與夢幻渴望翻身的情結。只可惜自開場白結束、兩男相遇互相鼓勵開始哄騙老同學共組\
  \ BBC展開詐騙事業後，電影彷彿就忘記了它是要探索這兩個底層爬上來的男孩心理的、更忘了片名那群理應得到同等關注的「億萬男孩」們。\n\n反而，電影好像很想像其他金融電影如《大賣空》或《華爾街之狼》等，拍出一種充滿旁白解釋金融運作規則與詐欺撇步的風格，不過它又拍得往往節奏快速場景華麗、又是豪宅又是派對又是吸毒、主賣那貪婪與紙醉金迷...\
  \ 我倒是覺得編導在努力建構這 BBC空殼小王國如何建立的過程中，建構得太講究細節也解釋得太多（還不見得很精彩 XD ），讓觀眾在電影中總是只把這些詐騙法則給看懂、卻距離男孩們那孤寂憤懣不顧一切的內心越來越遠。\n\
  \n有時看到一場接一場的派對把妹與吸毒戲、彷彿在談男孩們如何一步步迷失自己時，我卻覺得是編導漸漸拍得迷失了自己在開場白承諾過的心理主軸、卻拍成一部有點炫目有點獵奇的爆米花片。從派對中認識的幾位女角我們大概可以看出此片的失控：女角有\
  \ Emma Roberts 與 Suki Waterhouse這些二十世代中還算中大牌的，結果完全被浪費掉，她們彷彿只成為男孩平步青雲路上的獎賞，儘管也有意思意思想要給她們一兩場自有主見不聽男孩話的戲碼，但基本上她們沒有自己故事只是來造成男孩心情起落的。\n\
  \n\n\n當然，安索艾格特飾演的主角，也就是事件主犯 Joe Hunt ，他本身在詐騙戰場上還是有很多層次發揮強大魅力的，甚至那詐騙人生中想要找個純情女子在一起的一爿靜謐角落也表現得很好，就男女主角\
  \ Joe & Sydney 的幾場浪漫邂逅與爭執分手戲來看，我們看得出安索艾格特的自信魅力與純情渴望、看得出他輕盈隨性出人意表的浪漫、也看得出他在末日將臨對這純情的絕望守護，而相對地艾瑪羅伯茲表現也不錯。只可惜，我個人認為這段戀情和這詐騙人生的呼應並不大，只是片片斷斷出來虛應故事賣浪漫罷了。\n\
  \n真正貫串全片的精彩演出，還是在安索與泰隆飾演的詐騙夥伴 Joe Hunt & Dean Karny兩人之間。我們大概可以看到兩個人都有一股向上爬的野心與把事業搞大的狼性，但兩人對各種越來越高的風險也都總是難以招架。只是行騙路上若有一人時可能很快打退堂鼓、若有兩人彼此互推一把則可以一路硬著頭皮走上不歸路。電影每當\
  \ Joe度不過良心難關準備收手、Dean就會推他一把重振雄風；每當 Dean 面臨巨額虧損嚇得皮皮挫、Joe 一定用自大膨風更上層樓的自信計畫硬闖難關。這二人組互補梗連續用多了雖很像公式，但總是很有魅力的。\n\
  \n電影彷彿想以 Joe & Dean 的兄弟情為始、然後以兄弟間的背叛為終。只是很弔詭地，這兄弟間的魅力雖然很強，此片卻都只拍在事業上互補的那一面，竟很少拍他倆曾經共有的點點滴滴與交情基礎、很少談他們過往如何互相認定互相支持、甚至很少談他們彼此的人生夢想與真心話...\
  \ 結果電影這樣拍下來，我是可以感覺兩男是事業好搭擋可以做大案、但要說你我會情義相挺？好像沒什麼說服力，導致電影最後搞到一發不可收拾後，Dean把一切罪責都無情推給\
  \ Joe理應令人心寒、我卻一點都不感意外（倒是看泰隆耍壞很精彩）。\n\n\n\n另外，這個詐騙案的東窗事發與結局，我個人覺得電影拍得令人有點理不清頭緒，不太像是一個步步走錯後滿身罪惡導向的必然命運、卻像是一些無謂的衝動與巧合。大體上，這種「龐氏騙局」挖下線補上線的詐騙模型，規模越玩越大遲早要東窗事發的，此片就讓主角關鍵的一筆週轉金被凱文史貝西飾演的騙子\
  \ Ron Levin給虛晃一招掏空了，而致整個騙局開始崩潰。只是令人難以理解的是為什麼這樣的崩潰會導向史實的兩場謀殺？這是史實，很混亂也可能很難釐清邏輯，但我覺得電影至少該試著釐清，然而電影卻像拍小流氓打架失手一般，很隨機地草草解決。\n\
  \n對我來說，這樣為了符合史實而符合史實、卻草草了事隨便拍個巧合就不管，令這一整個敗德的詐騙故事之道德訊息缺了句點、戲劇張力瞬間渙散。結果很遺憾地，我認為此片拍底層向上爬的男孩心沒拍好、貴族男孩心根本沒拍、女性角色完全是花瓶、甚至詐騙過程一場場都不太有說服力（配角們被騙得好輕易）...\
  \ 甚至整趟詐騙一遭與心底的人生缺憾，也沒能在片尾做出個擲地有聲的呼應。還好，兩大帥男還是多少救了本片一些，令一場場當下或詐騙或調情或打氣或緊張的時時刻刻都還算是扣人心弦，如果喜歡安索艾格特或泰隆伊格頓任一人，還是必看的！\n\
  \n\n--\n如果是客串插花一下的龍套我覺得還 OK ，但他是時常出現在背景中卻沒存在感的小角，不知道這算不算龍套？或是有其他更好形容的字眼？\n不太多，但很迷人，而且有幾幕辣到噴鼻血...\n\
  他本來就小小隻嘛，而且西裝要是沒像 Kingsman 穿講究（譬如此片小銷售員）恐怕真的就是矮矮粗粗的... 今年秋天要看 Taron耍帥應該是要看羅賓漢吧？一起期待！"
