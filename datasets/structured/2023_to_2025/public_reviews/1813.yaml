url: https://www.ptt.cc/bbs/movie/M.1675257992.A.241.html
title: '[新聞]日本奧斯卡獲獎女星杉咲花獻聲<我們的黎明'
content: '新聞網址：



  日本話題動畫電影《我們的黎明》，即將在2月24日於台灣隆重獻映。本片改編自漫畫家

  今井哲也的同名科幻漫畫作品，並交由《碧藍之海》、《野球少年》的動畫公司「ZERO-G

  」擔綱打造。本片不僅請來以《幸福湯屋》勇奪日本奧斯卡等多項最佳女配角獎肯定的女

  星杉咲花擔綱主角配音，更齊聚悠木碧、藤原夏海、岡本信彦、水瀨祈、朴璐美等超人氣

  聲優共同聲演。全片將場景設定在未來世界的2049年夏天，透過一台人工智慧家用機器人

  被未知存在給駭入，開啟主角們一場難以忘懷的壯大冒險。熱血情節不乏歡笑與感動，也

  讓本片強勢入選西班牙錫切斯奇幻影展，以及蘇格蘭愛之動畫節兩大影展的競賽單元，就

  連東京、夏威夷等影展也都爭相邀約，足見其魅力之處。





  《我們的黎明》導演黑川智之透露，他將這次的製作重點，擺在如何將今井哲也原本兩冊

  的漫畫系列故事，改編成大約兩小時的劇場版動畫，並將故事聚焦在主人公「悠真」與機

  器人「娜娜子」之間的關係。尤其故事中的悠真，因為偶遇來自遙遠外星的「二月黎明號

  」，因此展開這場冒險故事，也讓本片的企劃與製作人新井修平透露：「太空探測器『二

  月黎明號』，它體現出希望透過『學習』與『溝通』的普遍願望。無需贅言的是，有溝通

  活動的地方，也必定會發生戲劇性事件。這發生在人工智慧與人類之間，這也會發生在同

  學、手足與老朋友之間。本片便捕捉動畫當中，青春戲劇的各種歡樂與驚奇之事，希望能

  藉此感動這世上所有孩子與大人們的心。」





  值得一提的是，劇組針對《我們的黎明》的角色設計，也提出「希望不要受到原著漫畫畫

  風束縛」這項相當大膽的要求，更希望能將電影角色改編成「不僅能吸引漫畫粉絲，也能

  盡可能吸引更多觀眾」，這讓擔綱角色原案暨概念設計的知名插畫家pomodorosa充滿幹勁

  ，試圖打造得以吸引更多觀眾的畫風。而這個大膽設定，也獲得原著漫畫作者今井哲也的

  認可，他並表示：「我的漫畫能在電影院大銀幕上放映，這件事感覺起來還是很奇怪與超

  現實。不過由於漫畫沒有電影院的大銀幕與戲劇性音效加持，讓我希望觀眾都能充分享受

  到這些面向。不論是對理解還是不理解漫畫的人來說，這都會是一部振奮人心的電影，希

  望大家都能來觀賞。」



  這部履獲國際影展青睞邀約的話題動畫電影《我們的黎明》，即將在2月24日於台灣隆重

  獻映。本片劇情描述未來世界的2049年夏天，熱愛宇宙及機器人的少年悠真（杉咲花配音

  ），正沉迷於接近地球當中的彗星。此時，悠真家中的人工智慧家用機器人娜娜子（悠木

  碧配音），竟被未知的存在給駭入。這個未知存在自稱為「二月黎明號」，因為在2022年

  降落至地球時，發生不可預知的故障，因此在悠真家附近的公寓中休眠，並請求悠真幫它

  重返宇宙，也讓悠真及好友們，展開了一場極機密的冒險任務…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
