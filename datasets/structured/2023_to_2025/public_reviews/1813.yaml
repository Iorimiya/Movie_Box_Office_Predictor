title: '[新聞] 【我們的黎明】重現轟動建築史"奇蹟住宅"'
content: '新聞網址：



  改編自《愛麗絲與藏六》今井哲也同名科幻漫畫，並由《碧藍之海》、《野球少年》動畫

  公司ZERO-G打造的最新動畫電影《我們的黎明》，即將在2月24日於台灣隆重獻映。本片

  將熟悉的日常生活，與「宇宙」、「太空」等主題交織，看似《E.T.外星人》的情節設定

  也讓人感到親切，不僅贏得孩子的共鳴，更贏得大人的肯定，榮獲諸多國際影展爭相邀約

  ，就連日本奧斯卡名導山崎貴都直言：「希望所有生活在現在的孩子們都能看到。」尤其

  本片透過一艘宇宙飛船迫降住宅區，並隱身在住宅區中，勾起孩子們的冒險故事，也讓眼

  尖觀眾發現，片中所刻劃的住宅區，就是曾被美譽為「奇蹟住宅區」，2013年卻因為老化

  而被拆除的「阿佐谷住宅區」。這座曾經轟動留名建築史的住宅區風景，這回栩栩如生地

  在片中復活，也讓導演黒川智之表示：「我認為這在電影中創造出一股重要的推動力。」





  《我們的黎明》改編自今井哲也的同名科幻漫畫，今井透露他原本先發展出一個十集組成

  的作品結構，並完美分成兩冊漫畫系列，想打造一個能縈繞在讀者腦海中的故事，就彷彿

  他們才剛看完一場電影或一齣電視劇那樣，於是便萌生要在劇情中加入宇宙飛船的想法：

  「我一直都很喜歡《哆啦A夢》系列中，人類與機器人之間的情感描繪，所以決定寫一個

  設定在近未來所發生的故事，講述一位小男孩，與跟他同地位機器人之間的關係。故事原

  本以『少年科幻』路線展開，不過後半段則開始包括關於這些孩子父母的情節。」



  不僅如此，「宇宙飛船迫降，隱身變成住宅區」的劇情也相當吸睛，編劇佐藤大表示：「

  十年前首度讀到這部漫畫，當時就震懾於題材之先進。對於故事還能巧妙連結到少年文學

  中的典型比喻，也讓我感到印象深刻。此外，阿佐谷住宅區的設定也同樣引人注目。」原

  著作者今井則回應：「我和在大學動畫實驗室一起工作的朋友，在工作時產生這個想法，

  不知道迫降的宇宙飛船隱藏在住宅區，會發生什麼事。」特別新鮮的是，本片讓『二月黎

  明號』這艘宇宙飛船模仿住宅區中的一棟建築，處於休眠狀態，也讓本片的科幻成分更加

  分；而將住宅區場景設置在阿佐谷地區，也十分吸引導演目光：「我很熟悉阿佐谷的氛圍

  ，這裡融合古老與現代，我想知道時空扭曲的感覺是否有吸引力。我認為這是一個非常有

  氣氛的地方。當我讀原著時，我對阿佐谷住宅區的熟悉感、場景、我在某處看到的懷舊風

  景，以及住宅區的處理方式，都給我留下深刻印象。」





  值得一提的是，《我們的黎明》的主要場景「阿佐谷住宅區」其實真實存在過，於1958年

  竣工，350套住宅錯落有致地排在一起，也曾因為當地豐富的自然環境、蜿蜒的街道、屋

  宇之間的庭院等綠化環境受到高度評價，成為城市規劃典範，甚至被美譽為「奇蹟住宅區

  」。不過之後由於老化和重建，這個住宅區於2013年遭到拆除，改建為大型公寓。而在本

  片這個發生於2049年的近未來故事當中，這座留名建築史的住宅區風景，終於得以栩栩如

  生地復活。



  導演黒川智之對於能將「奇蹟住宅區動畫復活」也感到滿足：「我們在片中增加拆除住宅

  區的部份，這在漫畫一開始並未出現。阿佐谷住宅區在多年前就不存在了，不過在電影當

  中，我們把拆除時程安排在夏天之後。這個設定對主角悠真與朋友們將『二月黎明號』送

  回太空，造成了時間上的限制，也為劇情高潮營造更多緊張氣氛，我認為這在電影中創造

  出一股重要的推動力。」



  這部履獲國際影展青睞邀約的話題動畫電影《我們的黎明》，即將在2月24日於台灣隆重

  獻映。發行商也精心推出「戲院入場特典」，第一週（2/24-3/2）隨票附贈「電影原版海

  報透卡」，第二週（3/3-3/9）隨票附贈「電影原版A3海報」，數量有限，贈完為主，請

  務必把握搶購良機。本片劇情描述未來世界的2049年夏天，熱愛宇宙及機器人的少年悠真

  （杉咲花配音），正沉迷於接近地球當中的彗星。此時，悠真家中的人工智慧家用機器人

  娜娜子（悠木碧配音），竟被未知的存在給駭入。這個未知存在自稱為「二月黎明號」，

  因為在2022年降落至地球時，發生不可預知的故障，因此在悠真家附近的公寓中休眠，並

  請求悠真幫它重返宇宙，也讓悠真及好友們，展開了一場極機密的冒險任務…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
