title: '[新聞] 女星杉咲花【我們的黎明】首度男音聲演'
content: '新聞網址：



  改編自《愛麗絲與藏六》今井哲也同名科幻漫畫，並由《碧藍之海》、《野球少年》動畫

  公司ZERO-G打造的最新動畫電影《我們的黎明》，即將在本週五（2/24）於台灣隆重獻映

  。全片集結女演員杉咲花，以及知名聲優悠木碧、藤原夏海、岡本信彦、水瀨祈、朴璐美

  等人共同聲演。其中擔綱男主角配音的杉咲花，這回第四度為動畫獻聲，因為是詮釋男聲

  ，她透露自己盡量壓低聲調，更因為有許多尖叫場景，讓她笑說：「我的喉嚨有種平時沒

  有的奇怪感覺。」尤其她跟悠木碧獻聲的人工智慧機器人有大量對手戲，也讓她非常佩服

  專業聲優的表現，更透露對方常在錄音室給予她許多中肯意見，讓她獲益良多，透過這次

  配音經驗值大提升。悠木也大讚本片將水畫得非常美麗，讓她感受到作畫者的熱情。她更

  大力催票：「無論你是原著粉絲還是剛剛才了解它，這都是你一定會喜歡的作品！」





  以電影《幸福湯屋》及NHK電視劇《小侍女千代》等作品廣為人知，並為《回憶中的瑪妮

  》、《瑪麗與魔女之花》、《言語如汽水般湧現》等動畫擔綱配音的杉咲花，這回在《我

  們的黎明》詮釋熱愛宇宙與機器人的男主角「悠真」。第四度為動畫配音的她感性表示：

  「當我想到必須珍惜悠真，一個相信我所珍視、和希望保護的人時，就讓我感到相當緊張

  。」當實際開始為這個角色配音時，她透露：「導演讓我盡量壓低聲調，所以我試圖將它

  理解成一種傳達悠真洋溢活力的方式。在極為安靜的錄音室空間當中，我一邊感受著自己

  的感情變化，一邊再次感受僅靠呼吸和聲音，卻難以表達人物動作及情緒的困難。同時，

  我也被這些細節積累而成的故事給深深吸引。」尤其她在片中有許多尖叫的場景，讓她笑

  說：「我的喉嚨有種平時沒有的奇怪感覺。」不過她的努力也在片中獲得肯定，導演黒川

  智之力讚：「杉咲小姐的聲音非常清脆悅耳，她是在眾多領域中十分活躍的女演員，她的

  演出顯然也無可挑剔。」



  值得一提的是，對於這回加盟跟「宇宙」、「太空」相關題材的科幻動畫，杉咲花透露自

  己其實非常喜歡宇宙，並回憶過往：「當年我和一位同樣對太空感興趣的朋友，一起去圖

  書館看繪本，在能看到流星雨的日子去看天空。我還記得我們一邊吃著糖果，一邊看著天

  空聊天的時光。」此外，她在片中有一個人工智慧家用機器人，當問到如果現實生活中，

  真的擁有這樣的機器人時，她也笑稱：「我想讓它折衣服，因為我不太擅長折東西，而且

  過程有些乏味，如果它能幫助我，我將不勝感激。」她同時力讚本片：「這是一個非常夢

  幻的故事，觀眾可以在片中感受到跟宇宙的聯繫。同時，角色相信重要事物並保護它的方

  式，在某種程度也是相當現實的。我認為這是一部讓觀眾思考對你來說很重要的存在，以

  及讓你想擁抱所愛之人的暖心作品。」





  此外，曾替《魔法少女小圓》、《妖怪手錶》、《電影版聲之形》等眾多知名動畫配音的

  悠木碧，這回在《我們的黎明》詮釋男主角家中的人工智慧家用機器人「娜娜子」，除了

  可以像人類一樣交談和幫忙家務，也全心全力支持男主角一家人的生活，只是因為太嘮叨

  而被對方覺得厭煩。悠木透露接到本片的邀約非常興奮：「我喜歡非人類和人類互動的故

  事，當我得知拿到娜娜子的角色時，我真的很高興！」她並表示：「娜娜子是高科技，但

  我覺得她是個不太像機器人的角色。實際在試音的時候，我的詮釋比較機械化，在後期錄

  製現場嘗試各種東西時，我收到工作人員的指示，說也許它不應該太像機器人。尤其娜娜

  子是個能跟人一樣說話的機器人，在交流的過程中，她能像人一樣看到自己。」這也讓她

  邊錄邊調整，完成片中討喜又活潑可愛的機器人形象。



  她更稱讚本片在視覺表現上，水跟夜空的繪畫尤其漂亮：「我之前聽過在動畫中，水很難

  被表現出來。這就是為什麼我認為畫水的人，把更多精力放在把水描繪得漂亮上面。本片

  跟水相關的畫面真的很美，讓我感受到作畫者的熱情，音樂也很好聽。我認為動畫是一門

  綜合藝術，這部作品有著精妙的平衡。」她並大力催票：「無論你是原著粉絲還是剛剛才

  了解它，這都是你一定會喜歡的作品！如果你能在戲院裡感受到作品所傳遞的溫暖，我會

  非常高興。」



  這部履獲國際影展青睞邀約的話題動畫電影《我們的黎明》，即將在本週五（2/24）於台

  灣隆重獻映。發行商也精心推出「戲院入場特典」，第一週（2/24-3/2）隨票附贈「電影

  原版海報透卡」，第二週（3/3-3/9）隨票附贈「電影原版A3海報」，數量有限，贈完為

  主，請務必把握搶購良機。本片劇情描述未來世界的2049年夏天，熱愛宇宙及機器人的少

  年悠真（杉咲花配音），正沉迷於接近地球當中的彗星。此時，悠真家中的人工智慧家用

  機器人娜娜子（悠木碧配音），竟被未知的存在給駭入。這個未知存在自稱為「二月黎明

  號」，因為在2022年降落至地球時，發生不可預知的故障，因此在悠真家附近的公寓中休

  眠，並請求悠真幫它重返宇宙，也讓悠真及好友們，展開了一場極機密的冒險任務…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
