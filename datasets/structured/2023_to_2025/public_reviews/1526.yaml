url: https://www.ptt.cc/bbs/movie/M.1749129237.A.E28.html
title: '[好雷] 《在水中》（in water） '
content: "南韓藝文片名導 洪常秀( HONG Sang-soo)\n於2023台北電影節與曾經短暫上映的片子\n\n\n\n\n雷文防雷資訊頁\n\n\n\
  \n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n (發布於網誌的原文，含圖)\n\n\n洪常秀( HONG\
  \ Sang-soo) 2023年作品《在水中》（in water），一開始還想說是不是檔\n案壞掉，畫面糊糊的，去找預告片來確認，影片幾乎從頭到尾的脫焦感，恩，沒有問題。\n\
  \n\n「這樣看似「隨便」且日常的反形式化，縱使那個笨拙素人感的zoom in/out已經成為洪\n尚秀感的作者標記似的。」寫於《江邊旅館》（註1）\n\n\n\
  雖已經不太意外如此隨便的形式，電影還契合著螢幕外過了端午難得微涼的台北夏天，就\n像是秋天溫度交接會有一種空氣共振，記憶消逝之感；如同趴睡午覺，洪常秀電影常用突\n\
  然安插一段睡覺的象徵生命夢境的時間迴圈。是說這部他「刻意」擔任此片各種職務：攝\n影、剪接、配樂等等（不僅多產，還多才多藝），重點是同樣追求低限的「一人電影」，\n\
  只帶了兩個素人朋友的電影製作，但聊天都在講一些有的沒的。\n\n\n《在水中》還需要分析嗎？ 如果說生活與作品的界線，根本沒有任何界線。儘管電影基\n本的形式與結構，矛盾的回應著沒有形式的形式，沒有結構的結構的悖論。\n\
  \n\n那麼倒不如去好好感受生活吧，那樣如悶熱天氣騎機車等紅燈，煩於瑣事，看到前方騎士\nT-shirt秀著「莫忘初衷」字樣帶有好笑與某種不為人知的悲涼感。那如同電影中「振作\n\
  一點啊」的笑話，是在對懷才不遇的創作者或是不得志人們的呼喊？在旁人卻覺得有些好\n笑，所謂有心人戚戚焉。\n\n\n一個孤獨美麗的創作者；一個傷心又好笑的故事。\n\
  \n在海灘 撿垃圾 ， 在海灘 拍電影\n\n回想起來 對創作來說因為過於普通\n「喜歡喝可樂 ，一天可以喝一整瓶。」\n「看看她（女主角）和這個巷子搭不搭。」\n\
  勘景時太過無聊，攝影師發現女主角會跆拳道。\n\n那些顯得可笑，垃圾話般的台詞。\n\n好比去問在煮麵的麵店老闆「知道自己的存在嗎？」如此好笑，近乎廢話式提問，\
  \ 難道\n還期待他回答著：「我煮麵，所以我存在。」（註2）\n\n把各種遭遇狀況都納入其中。面對如此複雜現世反倒要端出一付與世隔絕的姿態，像是到\n達一個沒有人的地方。（註3）\n\
  \n\n於是最後主角投身向海。\n\n\n沉默著、冷靜著，能把一切的一切都概括了。\n\n就像在河堤騎腳踏車看到一旁溜冰場的「選手」在練習旋轉\n劃出一圈又一圈「抽象」的圓\n\
  與一旁早已習慣的河邊臭味和雜亂的台式景觀\n\n突然明白現實與「美學」之間的關係（電影中所謂的「對比」…）\n與唯有自己才能察覺那一丁點的…意義。\n明白了 語言\
  \ 如\n美學藉由抽像化的「理解」\n（察覺了人跟人交流命定感覺失語的困境）\n是瞬間令人失落與傷心的時刻\n\n於是才會令人想哭。\n\n\n\n\n（註1）關於《江邊旅館》詳見筆者舊文\n\
  \n\n\n（註2）引用筆者舊文《現實在夢裡和解 ∕ 無聊會找到路》\n\n\n\n（註3）引用筆者舊文《抽象還要更抽象》\n\n\n\n--\n\n拉特飯 -\
  \ 以商業力量進入獨立市場\n\n--"
