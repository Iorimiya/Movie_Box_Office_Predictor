title: 'Re: [討論] 水行俠在水中的強度(雷)'
content: '關於強度，我只有一點比較想講


  以下防雷






















  .............................................................................


  就是一開始，直接把潛水艇扛到水面，會覺得這是水底超人吧(因為超人直接扛飛機)


  結果後面打鬥感覺弱的跟什麼一樣，動不動就倒地


  另外速度感的展現，也是怪怪的，以電影呈現放式


  水行俠游泳的速度，和梅拉開水船的速度感覺很像阿，會覺得那就直接游泳就好


  然後反派的那把槍，也是做得很沒質感，一整個塑膠槍的感覺


  其他我都覺得很讚啦，海底世界，有錢的人色彩就很鮮豔，海溝就是難民營，色彩黯淡


  整體流暢度夠，不會想睡，海底大戰也精采



  --'
