url: https://www.ptt.cc/bbs/movie/M.1565968275.A.8C7.html
title: '[情報] 在水中與逝去之人重逢《乘浪之約》湯淺政'
content: '在水中與逝去之人重逢《乘浪之約》，湯淺政明導演浪漫奇幻動畫電影最新力作!!


  動漫 2019-08-16 14:55:21 poki543

  　　

  今年夏天最浪漫的愛情動畫《乘浪之約》，劇本不但找來以《貓的報恩》、《聲之形》等

  電影知名編劇吉田玲子全新創作之外，日本人氣偶像明星片寄涼太的配音也備受矚目，電

  影將場景設定在日本千葉縣，正巧當時拍攝《哥哥太愛我了怎麼辦》時，也有不少場景在

  千葉縣拍攝，也讓他頻呼很有緣份。而首度擔任動畫電影配音的片寄涼太，也自爆配到需

  要輕聲調情的時候，還會因為害羞而笑場！



  《乘浪之約》中文預告


  片寄涼太說：「男女主角在聖誕夜野餐時吃蛋包飯的時候，男主角需要輕聲耳語跟女主角

  說話，導演當時已經說 OK 了，但是自己很害羞就笑場了！」第一次為動畫電影配音，片

  寄涼太覺得自己當「聲優」可一點也不容易，「演戲是可以借助全身動作來表達角色，但

  配音只有聲音，只用聲音來表達那麼多情感是很難的。」戲中角色身為消防員，認識了愛

  衝浪的開朗女孩，從小就學過游泳的片寄涼太，聊到新片以千葉縣的海岸作為動畫場景的

  參考時，他表示：「千葉縣很大，很多地方都靠海，在拍攝《哥哥太愛我了怎麼辦》的時

  候，也有很多場景是在那裡。對我來說我和千葉的大海是很有緣分的！」



  《乘浪之約》片寄涼太短訪


  片寄涼太的消防員角色，為了救人不幸在海中離世，留下傷心欲絕的女友。但女友卻意外

  發現透過哼唱兩人定情的主題曲，居然可以讓片寄涼太配音的角色在水中出現，兩人不但

  藉水傳情，持續滋長愛意，浪漫又奇幻的劇情，也在曾獲得法國安錫國際動畫影展最高榮

  譽水晶獎的導演湯淺政明調度下，讓夏日戀曲持續延續。







  而繼《你的名字。》新海誠後，日本動畫片影壇明日之星非《乘浪之約》導演湯淺政明莫

  屬，近年他更在國際獲得不少影展大獎的肯定！這次湯淺政明更再度與《聲之形》編劇吉

  田玲子再度於《乘浪之約》合作，打造全新的戀愛電影劇本；片寄涼太談到這次與名編劇

  吉田玲子合作時，也表示對她更早年的編劇作品《貓的報恩》印象深刻！《乘浪之約》現

  正熱映中，由双喜電影發行。


  劇情大綱

  　

  為了去大學念書而搬家至海邊、喜歡衝浪的女主角「向水雛子」，與正義感強烈的消防員

  「雛罌粟港」，因為某一場火災而認識的兩人發展出了一段愛情故事。但不久雛罌粟港發

  生了意外而過世，面對突如其來的分離，雛子該如何是好？某一天，當雛子哼唱著兩人回

  憶中的那首歌曲時，港卻在水中現身了……。




  --'
