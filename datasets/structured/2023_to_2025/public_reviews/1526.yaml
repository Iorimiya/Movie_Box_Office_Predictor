content: '如題

  記得當初有人說在海中的話

  甚至可以稍微跟超人抗衡一下

  雖然忘記那個人說是漫畫還是電影中


  不過在電影裡荒原狼入侵亞特蘭搶走母盒時

  水行俠在自己擅長的領域跟他對打

  還打輸 那一拳回轉拳一點魄力都沒有

  明明都在水裡了

  至少打荒原狼這種等級的對手至少要平手吧

  這樣真的有辦法抗衡超人嗎？(水中)


  還是說我記錯了

  水行俠在水中也遠不如超人?

  那這角色就沒捨用了吧

  阿蝙至少智謀超高

  閃電俠速度快過超人(漫畫)

  其他正聯的角色就算實力不如超人

  至少也有一項強項超過超人

  水行俠呢？


  請幫我解惑


  --'
