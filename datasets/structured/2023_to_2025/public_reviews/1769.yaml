url: https://www.ptt.cc/bbs/movie/M.1679694902.A.AB1.html
title: '[好雷] 致蕾絲莉：中樂透卻完蛋。兼談奧斯卡入圍'
content: '防雷頁

















  新聞常看到說「中樂透卻反而讓中獎者一敗塗地」的故事


  （歐美樂透得主很勇欸，都會露面上電視，難道不怕被壞人盯上或親戚紛紛來借錢www)


  「致蕾絲莉」女主角蕾絲莉就是這種人...

  原本單親媽帶兒子，雖然不寬裕也尚可。結果幸運（不幸)中了樂透，突然有大把鈔票

  可爽，被沖昏頭抵擋不住誘惑，整個人完蛋...

  揮霍、染酒癮，傷了所有愛她的人後，逃之夭夭。


  等在外面敗光最後一毛錢，夾著尾巴回來求援...

  然後再度背棄了接納她的兒子

  （兒子是好孩子，卻被傷透了心QQ)

  酒癮上來了，滿口謊言、耍賴、爆粗、偷竊

  老家德州鄉下的人因為她的作為都瞧不起她

  只有一個外地來的旅館老闆，因為妻子也曾酗酒的往事而同情，願意給她個機會


  老實說是自作孽的一個人，看了會生氣

  但同時又可憐她...


  蕾絲莉總是後悔、卻老是意志薄弱

  用醉生夢死逃避搞砸的人生

  非常非常可悲，可悲又破碎...


  其實活到像那樣子，也許再向下墮落更容易，就像最近韓劇「黑暗榮耀」的女主老母...


  但蕾絲莉終究沒有徹底放棄「活」

  粉紅行李箱那些照片是剩餘的光

  最終她一步一步的爬回來了...步履蹣跚的...

  這次，終於沒有辜負愛她的人們



  安德莉亞瑞斯波羅格（Andrea Riseborough）在這屆奧斯卡影后是大黑馬入圍。也因為不

  走傳統公關策略，而是直接邀演員來看推薦，所以引起了很多爭議



  但平心而論，安德莉亞演技是真心有奧斯卡入圍的水準


  小成本獨立製片。但她做為靈魂人物很有渲染力。複雜的情緒衝突都詮釋很好。也不只是

  扮醜而已，安德莉亞完全有把頹廢又神經質的破碎融在身上


  蕾絲莉在酒吧，看著一杯7美元的酒，她努力做工1小時也是7美元...


  拜託搭訕的陌生男子對她說「告訴我，我很好。我不是爛人」...


  在她身上確實看見了一個在泥潭苦苦掙扎的人



  看完蕾絲莉，這屆奧斯卡影后入圍名單

  我私心排應該是


  凱特布蘭琪（塔爾）> 楊紫瓊（媽的多重宇宙）> 安德莉亞瑞斯波羅格（致蕾絲莉）=蜜

  雪兒威廉斯（法貝爾曼）>安娜德哈瑪斯（金髮夢露）


  凱特和楊紫瓊誰拿獎都蠻開心的。但凱特在「塔爾」演技難度真滴神（跪）


  安娜是個人還好的一個。覺得她只演了夢露脆弱、傷感的那一面。不太夠所以排第五...

  不過想想這也是導演的鍋...她在一部雷片也盡全力了，可能更襯托出她的演出吧...



  雖然有人說安德莉亞演谷底翻身的角色很常見。但常見不等於都能演的好啊。就像奧斯卡

  更愛的演藝人員、音樂人傳記片不也是如此嗎？


  是說，安德莉亞實在星運不佳（可能她名字太難記w 到現在都很懷疑有沒有念對她的姓...

  ）

  第一次認識她是在「遺落戰境」，演暗戀阿湯哥的女二。當時就演的比女一更讓人有印象

  。可是之後都沒什麼大片找她了，一路演配。希望這次能帶給她多點片約...


  以上，純個人看法



  對了，片子用的鄉村樂也很好聽

  而且旅館老闆是網飛「GLOW: 華麗女子摔角聯盟」男主角馬克馬龍演的！（順便推這部影

  集！超！好看！）


  預告



  Glow






  --'
