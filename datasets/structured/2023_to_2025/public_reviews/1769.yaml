title: '[好雷] 從過度自責到點亮自身：《致蕾絲莉》'
content: "本文涉及劇情，且具個人觀點，推薦觀影後再讀。\n\n　　　　首日票房影響上映時間，若有意者請把握本週場次。\n\n\n\n　　　　圖文網頁版：\n\
  \n　　　　\n\n\n　　　　預告片：\n\n　　　　\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n從過度自責到點亮自身：《致蕾絲莉》\n\n\n\n　　看《致蕾絲莉》會令我一直聯想到《我的鯨魚老爸》，都是主角身為父\n\n母，在遭遇人生最大的幸運（中樂透／遇見所愛）之後逐漸失去了一切，更\n\
  \n在拋棄了孩子後自暴自棄，過度自責加速了他們的沉淪。不同的是，《我的\n\n鯨魚老爸》的父親查理是一心求死，期盼在死之前為女兒做一點事；而《致\n\n蕾絲莉》的母親蕾絲莉（安德麗亞．瑞斯波羅格飾）則是掙扎求生，再怎麼\n\
  \n逃避或努力，唯一不變的是對兒子詹姆士（歐文．蒂格飾）的愛──他們都\n\n有愛的心意，卻失去了愛的能力。\n\n\n\n　　蕾絲莉是單親媽媽，偶然中了十九萬美金的樂透，原以為人生能就此改\n\
  \n變，卻在六年間散盡，甚至拋下十四歲的兒子，同樣六年後被趕出租屋處，\n\n除了一箱粉紅色行李外一無所有，只能投靠已經獨立生活的詹姆士。染上酒\n\n癮的她，兒子一出門工作，就毀掉「不喝酒、不出門」的約定，不僅偷兒子\n\
  \n室友的錢、和鄰居廝混，在酒吧勾引男人……每個行動看似是荒唐的「選擇\n\n墮落」，實則是本能求生──無力克制的酒癮是長時間逃避痛苦最快生效的\n\n捷徑，自然愈陷愈深。為什麼這麼克制不住？她與詹姆士相聚的每一刻，都\n\
  \n能感受到詹姆士的防備、惶懼，加上發現她違背諾言酗酒的崩潰，便知過去\n\n帶給他的傷口只結了一層薄薄的痂，稍一碰觸就痛徹六年，亦同時撕開蕾絲\n\n莉的痛苦與愧疚，她沒有補償的方法與能力，只能一再酒遁。對兒子如此，\n\
  \n對昔日好友南西（艾莉森．珍妮飾）與道奇（史蒂芬．魯特飾）亦然，加上\n\n舊日情誼怨憎的牽扯，和作為一個人必得撐起的驕傲，使她的行動好似在反\n\n覆證明自身的無可救藥。從演員神經質的表情動作，細緻的線條牽引我們看\n\
  \n見她的倔強與脆弱：求生的韌性一拉一放就會彈傷靈魂，無法更換久了便稍\n\n觸即裂。查理藉由暴食來嚥下罪惡感，吃得愈多愈是自懲，他的身體就是致\n\n死的自責；蕾絲莉是只有酒能按下自責與自覺無能的ＯＦＦ：我不要面對、\n\
  \n不要去想，再想下去我會徹底崩潰。\n\n\n\n　　蕾絲莉逃離家鄉，或許是覺得在新環境可以重新開始，但事實是少了周\n\n遭人的支撐，她更沒有支持自己的能量；回到家鄉的她，酒精仍是她習慣遺\n\
  \n忘恥辱的藥／毒，支撐／摧毀她的驕傲，重蹈覆轍使她再次流落街頭卻沒有\n\n離開，除了折磨那些看不起她的人，更想找尋一份歸屬感，冀望有人能同情\n\n她，拉她一把──摩鐵的史威尼（馬克．馬龍飾）從外地來到此處，由於前\n\
  \n妻亦曾深陷酗酒的泥淖，基於同情給了她工作的機會。只是習於麻痺、自我\n\n放棄的慣性非朝夕可改，即使這條繩索曾經鬆手，去過曾與詹姆士同住的房\n\n子後，蕾絲莉下了戒酒的決心並且認真工作。但過去帶給他人的傷害仍在反\n\
  \n噬，史威尼找出她當年獲得樂透的報導，想要為她打氣，卻又刺傷她的敏感\n\n與脆弱，一度離開了摩鐵。\n\n\n\n　　劇情至此看似沉淪，然而蕾絲莉數次在求救與自責、酒精與自覺間反覆\n\
  \n掙扎，先前的努力已能抗拒一杯可抵一週薪資的酒；想回去卻又不敢現身，\n\n從廢棄的冰淇淋店窺見史威尼和摩鐵老闆羅伊（安德烈．洛伊飾）遍尋不著\n\n的沮喪後才發現：原來她還值得被找尋、被在意，那麼，她得先找回迷失的\n\
  \n自己──藏身在廢屋裡固然安全，卻也將永遠置身黑暗。\n\n\n\n　　故鄉裡曾經一同長大、交往過的親友之所以唾棄蕾絲莉，除了南西所言：\n\n曾經愛她卻為她一再逃避吃盡苦頭之外，在小鎮舞會與彼特（詹姆士．蘭德\n\
  \n里．赫伯特飾）的衝突還可以發現除了輕視，更多的是愧疚與恐懼：他們應\n\n該都曾在蕾絲莉發財後和她一起享樂、投資，做過改變未來的夢。蕾絲莉的\n\n失敗狼狽，多少會喚起他們曾經推波助瀾，以及同樣的一事無成；若生活不\n\
  \n如意，居高臨下的嘲弄也會帶來一點自我寬慰：「如果我是她，絕對不會……」\n\n畢竟有些厭惡，是來自於看見相似之處，和恐懼相差無幾的人生之路。這也\n\n是蕾絲莉對待自己、獲取短暫安心的方式：連我都看不起自己，那麼不振作\n\
  \n也是理所當然。\n\n\n\n　　導演麥克．莫里斯把重心放在主角自身和周遭的拉鋸，沒有明示蕾絲莉\n\n如何在六年間散盡獎金，只能從對話去推測。那筆錢就像她的愛，沒有妥貼\n\
  \n運用的能力，無效揮霍後的債是遍體鱗傷和自我否決。在電影裡，她對詹姆\n\n士在三個場合說過「我愛你」，一次是被詹姆士揭穿謊言後崩潰，她試圖用\n\n母親權威與「我愛你」博取心軟仍無力挽回，母子均再次絕望；第二次是她\n\
  \n離開摩鐵後打電話給詹姆士，對方沒有接聽，她在留言對著話筒說了好幾次\n\n「我愛你」，最終掛上電話；第三次就是最後的擁抱，從情感勒索、空洞無\n\n力到用自身證明，每一次都能看到她愛的能力逐漸復甦──畢竟愛從來不是\n\
  \n拯救的唯一解，而是精神上的浮板，如果自己沒有擺動手腳，便會拖著所愛\n\n之人一起下沉；只有自己能夠好好呼吸，才能看見及給予愛。所以看完《致\n\n蕾絲莉》後，回想著《我的鯨魚老爸》，或許正呈現了愛的不同樣貌，來自\n\
  \n於如何看待生命：查理在下沉前想讓女兒浮上海面，看見自身的價值；蕾絲\n\n莉則是攀著浮板，即使一再翻覆、幾度自棄，仍然掙扎著游到了岸，給予仍\n\n在岸邊徘徊的孩子一個擁抱──令人慶幸她發現自己仍擁有許多，也願意去\n\
  \n珍惜那些擁有。\n\n\n\n　　「跟我說我很好，跟我說我不是爛人。」\n\n\n\n　　願每個人都能有這樣對自己說的人，或者力量；即使曾經廢棄，也能重\n\
  \n新開張，在黑暗裡點亮自身，再微小，至少看見存在的座標。\n\n\n\n　　《致蕾絲莉》，致每一個努力想愛、努力求生的人。\n\n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n\
  我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\n                                  陳斐雯  貓蚤札（其三）\n\
  \n--\n\n\n　　詹姆士真的很愛媽媽，他們母子相處的時間不長，但詹姆士看媽媽那種又愛\n\n又怕被她傷害的眼神，根本就是十四歲的孩子。蕾絲莉也是，她有給孩子買吉他，\n\
  \n也在乎他沒有當歌手，孩子的一切她都記得，行李箱裡唯一珍貴的就是照片和電\n\n話啊。她會掙扎那麼久，都是因為有詹姆士的關係。和解那段真的為他們慶幸。"
