url: https://www.ptt.cc/bbs/movie/M.1679712705.A.DDD.html
title: '[好雷]《致蕾絲莉》，敬所有曾經爛過卻還沒放棄'
content: '部落格版：


  記得當年《羅馬》女主角耶莉莎阿帕里西奧獲得奧斯卡最佳女主角提名時引起不小討論，

  因為在當年的獎季中她的名字幾乎、或者說根本沒有出現在任何提名名單中，即使《羅馬

  》本就是當年的熱門之一，卻從來沒有人想過耶莉莎阿帕里西奧能夠提名奧斯卡，也因此

  當奧斯卡入圍名單揭曉時看到她的名字赫然在列有多少人感到驚訝、驚喜甚至是驚嚇。不

  過幾年之後，又再次的出現令人驚訝、驚喜甚至是驚嚇的入圍者，也就是《致蕾絲莉》的

  安德麗亞瑞斯波羅格。


  雖說奧斯卡本就是你知我知的公關戰，不過《致蕾絲莉》的宣傳方式卻疑似觸犯到了相關

  政策，而當入圍名單公布後安德麗亞瑞斯波羅格擠下了《女王》薇拉戴維絲與《提爾：純

  真之死》丹妮兒戴德維勒兩位備受看好的黑人女演員，膚色問題再度讓此話題繼續延燒，

  嚴重到一度傳出美國影藝學院曾討論是否要撤銷提名資格，然而最後美國影藝學院還是保

  留了這次提名，並允諾將會依據此例修正與更新相關規章。


  本該值得慶賀的首次奧斯卡提名卻意外因爭議蒙上層灰，這對安德麗亞瑞斯波羅格來說是

  件相當可惜的事，尤其在看過《致蕾絲莉》之後。某方面來說，這也許可用因禍得福來形

  容，因為《致蕾絲莉》確實因本次事件被更多人看到、注意到，就連台灣觀眾都因此有機

  會在戲院觀賞這部作品。先將爭議放到一旁，如果看過安德麗亞瑞斯波羅格在《致蕾絲莉

  》裡頭的演出，就不會讓人來用跌破眼鏡四字為她的提名註解。


  同樣都以劇中角色當作電影名，《致蕾絲莉》中的蕾絲莉和《TÁR塔爾》中的塔爾正好是

  相反的兩個人，劇情走向亦是恰好的兩個方向。蕾絲莉從落魄潦倒到發奮振作，而塔爾則

  從意氣風發搞到眾叛親離，《致蕾絲莉》讓觀眾跟著蕾絲莉從谷底步步向上爬，哪怕數次

  摔倒滿身污泥偶爾有血，仍然不放棄給自己再一次振作的機會，《TÁR塔爾》則讓塔爾從

  擁有所有到失去一切，直至最後依然傲氣不知悔悟，終從神壇跌落的結果總教人唏噓不已

  。對我而言，《TÁR塔爾》精準鋒利，是部有劇情的電影，《致蕾絲莉》充滿不安與失控

  ，更像部擁有故事的人生，各自精彩、各自好看。



  「有些人就是生在福中不知福。」


  羅伊一句話簡單直接的道出了蕾絲莉的問題，那就是她從來不懂得愛惜自己，明明有過那

  麼多次機會，卻總是不斷糟蹋這些好意。事實上要中一次樂透要得多幸運？而想要順風順

  水的人生又需要有多少的好運相伴？那些不斷給予她的機會，就像是從天而降的好運，光

  就這點來看蕾絲莉肯定比起多數人都來得幸運護體，但她卻是從來都不懂得珍惜。身為單

  親母親，樂透的中獎能讓她過上好日子，她卻選擇將之揮霍殆盡，拋家棄子還染上酒癮；

  六年後兒子願意再次喊她母親、將流落街頭的她接回住處照顧，她卻偷錢再去買酒享樂更

  還說謊欺騙兒子；家鄉的昔日好友收留了她，但終於還是忍受不了她而將她趕出門。


  重蹈覆徹的爛戲碼，就像蕾絲莉那難以戒掉的酒癮，她甘心用短暫的快樂換來不甘心的懊

  悔，每每在盛氣凌人的態度之後，總能在她眼神裡看到悲傷的空虛，也知道她好想好想再

  得到一次機會，可是觀眾知道、蕾絲莉自己也清楚，機會或許從來都在轉念之間，就像史

  威尼願意讓她預知的薪水，她可以繼續拿去買酒狂歡，也可以八點起床準時工作，認認真

  真的過好生活。


  其實觀眾從來沒有辦法明確的說出蕾絲莉究竟經歷了什麼。我們知道蕾絲莉在六年前中了

  樂透，興奮的採訪鏡頭裡又叫又跳的，兒子詹姆士的生日成了她的幸運號碼，讓她獲得也

  許能就此改變生活的19萬美金，然而在下一個畫面裡，再次出現在觀眾面前的，是早已把

  那19萬花完並且還染上酒癮，慘被房東趕出去的落魄模樣。這六年來裡，蕾絲莉發生了什

  麼、和兒子與母親、和昔日好友南西與道奇又發生了什麼，為何狼狽的離開家鄉？曾經風

  光的名字為何如今沒人願意再提？觀眾隱隱約約的知道，但又是這麼不確定的。


  導演麥克莫里斯不給出完全的蕾絲莉這個人，而是要觀眾跟著劇情的行進，從她的承受與

  反擊、她的強勢與軟弱、她的火爆與懊悔之中，自己去想像然後用自己的角度去認識蕾絲

  莉。其實很多時候相信蕾絲莉自己也很清楚自己的問題在哪，只是從來沒有人要她去認真

  面對並且解決她的問題，這也是為何蕾絲莉會如此怨恨南西的原因之一，她或許從來不在

  意自己被曾經的好友放棄，而是沒有在她好幾次脫離生活正軌的時候，嘗試過拉住她、賞

  她幾個耳光要她清醒吧。



  「跟我說我很好。」


  「跟我說我不是爛人。」


  從各方各面來看，蕾絲莉都是一個極度需要別人幫助的人，一如她也許明知自己的問題在

  哪，但需要有人、像南西，出來明確告訴她，她想要下定決心去振作，卻也需要有人親口

  對她說，妳很棒、妳可以，再努力一點就好，哪怕是個在酒吧隨便搭訕的陌生人都好。她

  的努力需要有人去給她肯定，好讓她知道她的努力是值得的，蕾絲莉那卡陪著她流浪一個

  又一個地方的粉紅色行李箱，裡頭的那些失去了但很想找回來的美好歲月，在最後用力的

  推了她一把，讓她終於不再放棄史威尼朝她伸出的援手，讓他拉住自己朝著生活的正軌走

  去。


  《致蕾絲莉》是部相當溫柔的電影，如同導演麥克莫里斯最後溫柔的拯救了蕾絲莉，它給

  了每個曾經糜爛、頹喪過卻還沒放棄自己的人，再次想起振作後能拾起多少美好的機會。

  安德麗亞瑞斯波羅格飾演的蕾絲莉，黯淡無光可同時是又這麼的耀眼奪目，她是《致蕾絲

  莉》的靈魂，破碎、不完整且滿是傷痕，或許沒有凱特布蘭琪強大攝人的氣場，卻有著屬

  於她獨特迷人的味道。安德麗亞瑞斯波羅格的詮釋細膩、真摯動人，最後在她重新出發的

  餐館裡與南西和解，與詹姆士相擁，無疑是電影最感人的幾分鐘。


  不過除了安德麗亞瑞斯波羅格的演出，《致蕾絲莉》裡的那一首首歌曲亦讓電影變得更有

  感覺。尤其是蕾絲莉在酒吧中聽到後皺眉並罵了幾句的那首《Are You Sure》，聽著威利

  納爾遜緩緩唱著，「You seem in such a hurry to live this kind of life. You''ve

  caused so many tears and misery.」，彷彿唱出了蕾絲莉的惶恐不安，焦急的想要逃離

  開這裡，但是還有哪裡能夠讓她去？她就快無處可去了，「Are you sure that this is

  where you want to be？」，是時候該好好看看自己、好好看看所在的地方，感到羞愧後

  讓眼淚流下也沒關係，不要再次放棄自己就好。



  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
