url: https://www.ptt.cc/bbs/movie/M.1534478367.A.560.html
title: '[好雷] 詭屋  （林中小屋，屍營旅舍）'
content: '電影心得： 詭屋  （林中小屋，屍營旅舍）

  The Cabin in the Woods










  一、簡評



  這部片有很多經典恐怖片的元素，算是恐佈片的總集篇，常看恐怖片

  的人應該會覺得蠻精彩的！








  二、劇情大意









  *****  以下有雷  *****









  五名好友準備前往一棟坐落於深山中的小屋度假狂歡，結果這棟小屋

  似乎位於神秘的區域……表面上是郊外，地表底下卻有一群像是科學

  家的人正在監控著他們。




  這一行人渾然不知自己已步入陷阱，悠閒的在湖邊戲水，晚上還玩真

  心話大冒險，好開心！




  科學家認為時機成熟，打開了小屋的地下室門。眾人好奇心起走進地

  下室，女主角Dana 拿起一本日記，唸了其中一段拉丁文……結果喚

  醒了殭屍！




  科學家們因此大為鼓譟，原來他們正在賭博：下注這五個年輕人會死

  在什麼怪物手上……




  接著五個人被殭屍攻擊，其中一名女生被殭屍砍頭……她男友試著騎

  機車出外求救，結果機車撞上一道看不見的隱形牆，連人帶車墜入山

  谷……而和 Dana 剛開始談戀愛的男生也被躲在車上的殭屍殺死！




  Dana從車裡掙扎逃出，結果也遇上殭屍，就在千鈞一髮之際，另一位

  倖存的伙伴Marty救她，還發現殭屍出現的墳墓裡有一個電梯通往地

  底……兩個人搭乘電梯發現了科學家們的基地。




  原來科學家們不知道在祭祀什麼邪神，每年都會引誘一些人來當怪物

  們的祭品，Dana和Marty兩人憤怒之下，放出了所有的怪物……屠殺

  了整個基地的人員……




  最後抵達基地深處，一名女科學家說如果Dana必須殺死Marty，不然

  邪神就會復活，殺了兩人，再消滅所有人類，造成世界末日。




  「你只有兩個選擇……死在這裡拯救世界，或者世界末日和全人類一

  起死！」




  Marty回答：「兩個選擇聽起來都不錯！」




  然後選擇世界末日和全人類一起死……最後Dane和Marty一邊抽著大

  麻菸，一邊等待世界末日……









  三、評分



  劇情：3 不錯

  這片雖然沒頭沒尾的，沒有把架構交代清楚，但是劇情本身很流暢，

  我是認為能把故事講得精彩基本上就是個好劇本了！



  結局：4 優秀

  反正怎樣都要死了，自己死和拖所有人一起死好像也沒多大差別……

  唯一我覺得結局的缺點是Dana猶豫要不要殺Marty那邊轉折有點太硬

  ……感覺就是為了要接結局才安排的橋段，也罷。



  血腥：4 很多

  各種死法都有，尤其是最後在基地便當發免錢的，看得還蠻爽的！



  人物：2 普通

  焦點是千奇百怪的魔物虐殺人類，而不是幾個主角。這種類型的片其

  實焦點不放在人物本身也還好！



  氣氛：4 優秀

  光看到這麼多經典怪物就值得了……任何一隻怪物就夠讓人頭痛了，

  何況成千上萬隻！整體的絕望感很讚！




  推薦：4 優秀

  開派對的其實不是主角群，也不是科學家，而是妖魔鬼怪。很有《烙

  印勇士》主角們被獻祭的絕望感！身為恐怖片迷一定要推薦這片！




  --

  60秒后世界末日


  世界末日來臨時，你只有60秒可以逃……

  漫畫作品，2018/8/12完稿


  --'
