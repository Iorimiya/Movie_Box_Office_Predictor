url: https://www.ptt.cc/bbs/movie/M.1693996936.A.1BF.html
title: 'Re: [請益] 看不懂詭屋和鬼支解'
content: '底下沒有太多人提到鬼肢解的部分，來簡單說一下好了

  以下有雷～

























  男主角 宗 其實是殺害女老師（還是教授）的兇手，而且是已經結婚的大叔 這點無庸置疑


  關鍵是  到底為什麼大叔會以為自己是宗？



  因為女老師在被下藥之後 對大叔下了一個最後的催眠

  內容大概是

  「如果你聽到現在這首旋律的時候，仍然是愛著我的，那麼這首曲子會帶你想起我們美好的時光」

  「但如果你打算做什麼對不起我，覺得會內疚的事情，那麼這首曲子將會讓你想起最愧疚的事情」


  從劇情前後我們可以得知，大叔最後殺了女老師

  並且一直對沒辦法救到她弟弟耿耿於懷

  於是在和老婆去音樂會聽到那首催眠指令的旋律時

  直接變成宗的人格在進行劇情 且一直以為自己有姐姐


  最後那個萬箭穿心的畫面 是故意解除指令的

  讓大叔同樣體會到被千刀萬剮 粉身碎骨的痛




  大概是這樣 憑印象打的 有錯歡迎留言補充

  這部片真的很神 以前泰國恐怖片的代表之一


  -----

  Sent from JPTT on my Samsung SM-G9900.


  --'
