url: https://www.ptt.cc/bbs/movie/M.1443880609.A.F8A.html
title: '[新聞] 《詭屋》導演高達：片商想要拍詭屋2'
content: '新聞網址：



  2012 年上映的《詭屋》（Cabin in the Woods）是當年最有趣的電影之一，或者可以說

  是近年來對好萊塢恐怖片一個巨大的諷刺電影，片中有趣的設定和世界觀，挑戰觀眾對

  老梗驚悚電影的「預測能力」，而整個故事走向確實也達到了對觀眾「挑釁」的目的，

  不過看起來獅子門影業想要把這部電影發展出更多的續集！


  《詭屋》導演徳魯高達（Drew Goddard）在接受 Den of Geek 訪問時，證實了片商有想

  要續集的意願：「片商想要拍續集，他們來找過我們了，不過好玩的事，這部片從頭到

  尾我們都沒有想要拍續集的想法。」如果你看過本片的話，就知道《詭屋》的結局要連

  結到全新的故事，是有點難想像的。


  「不過《詭屋》的重點就是我們設定的規則非常瘋狂，所以我蠻確定我們可以從中找到

  解決的方式，喬許和我都不想要浪費第一集的好成績，如果有續集，我想我和他都必須

  對此感到更加有趣才行。」


  目前看起來編劇和導演兩人對續集都一頭霧水，不過就如同德魯所說，《詭屋》有趣的

  地方就是在於他沒有「既定」的規則，也許他們能從中找到諷刺「系列電影」的方式也

  說不定！


  ------------------------------------------------------------------------------


  參考外電：Den of Geek

  Cabin In The Woods 2: "the studio wants to do it"



  心得：不過Drew Goodard在今年的電影與影集事業陸續獲得成功後，

  要敲定詭屋2的劇本與檔期，可以想見會有一定的難度


  (他今年的代表作有與漫威、Netflix合力打造的動作影集夜魔俠，

  以及最近熱映的太空冒險片絕地救援)


  --'
