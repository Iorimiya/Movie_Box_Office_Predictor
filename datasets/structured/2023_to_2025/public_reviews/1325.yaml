url: https://www.ptt.cc/bbs/movie/M.1479725548.A.5F5.html
title: '[片單] 像詭屋，不知道是不是恐怖片的恐怖片'
content: "以下有些微詭屋雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n--------------------------\n\
  1. 請描述欲尋找電影的類型或特徵（請盡量描述清楚）\n\n像詭屋那樣已經不知道是沙小的恐怖片\n後面根本是變形金剛但又很有梗好玩有趣又恐怖\n\n\n\n不是像奪魂鋸or厲陰宅那種純粹的恐怖\n\
  \n而是緊張恐怖中，帶點特別的感覺\n可是搞笑、正經、奇幻、電玩? 不知怎麼說\n總之就是不只恐怖懸疑部分，希望能加點其他滋味\n\n\n\n驚聲尖笑&殭屍肖恩，這種為了搞笑但又不好笑的恐怖\n\
  勉強算但是有點不太好看\n\n\n2. 已知符合需求的電影或偏好的電影類型（為避免重複推文，請至少列舉一部）\n\n 1.詭屋\n 2.回魂夜 (周星馳+喇叭花+收音機那部)\n\
  \n\n3. 不喜歡的電影類型            （不需要板友推薦的電影，可填刺陵）\n\n 1.驚聲尖笑\n 2.風飛鯊\n 3.3D食人魚\n 4.稀人\n\
  \ 5.飛機上有蛇\n\n\n要求可能有點難，希望能有版友推薦類似的好片\n先謝謝各位了\n\n--"
