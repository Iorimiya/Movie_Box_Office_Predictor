title: '[請益] 請推薦類似「詭屋」的片'
content: '想跟太太一起看類似「詭屋」的片

  克里斯漢斯沃演的那部

  類似的片已看過的且覺得好看的：迷霧驚魂、柯洛佛檔案。

  類似的片已看過但覺得還可以的：柯洛佛悖論、柯洛佛10號地窖、惡靈13、深海終劫站。


  可以的話，請儘量推薦Netflix或Disney+或Youtube有的為主，謝謝。


  --

  有看過，但比較單一一個怪物，謝謝。

  歡迎光臨死亡小鎮嗎

  這部我也很喜歡，尤其是結局。

  但不是我要找的類型。

  有聽過沒看過，謝謝。

  有看過，蠻喜歡的，但不是我要找的類型。

  很經典，極地詭變也很好看。

  查了一下，請問是認真推薦的嗎？

  這還太新，好像串流還沒有。

  好，謝謝。

