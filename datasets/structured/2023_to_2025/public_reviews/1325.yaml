title: '[請益] 詭屋這部片的梗'
content: '各位版大晚安:


  因為朋友在臉書貼了詭屋這部片群魔亂舞的片段後...


  讓原先以為是傳統驚悚片情局的我


  對這部片有了興趣


  以上廢話...


  從一群人下地下室探險(玩玩具?)的片段開始


  我就覺得超有梗了!


  因為最近安納貝爾很受討論，大家還記得他的上一部作品


  <<厲陰宅>>


  因為我看到音樂盒就笑了，因為轉玩音樂盒就可以招換邪靈跟你玩捉迷藏(啪啪!!)


  另外其他像海螺(招喚出很醜還只能用爬的的人魚XD)、投影機、項鍊、想魁地奇的球


  糾~~竟是哪些電影的梗(出處、由來)呢?--------Q1


  心裡還期待可以看五種魔物上來殺人，然後主角處女再開個無敵


  畢竟都捅死兩隻殭屍了，只是被他們老大差點在甲板上玩摔角而死


  BTW 看了之後發現恐怖片的女主角都蠻腦殘的...


  傻子腳色又嗑藥的馬丁都叫你不要念日記了，然後不聽最後又念了一連串會


  死者甦醒的拉丁文 = =''''


  我想若她不念大概也會有其他死法吧!就不計較了



  最後是群魔亂舞出現的小丑、白色面具怪客X3、生肉手術台還有中央控制室警衛


  被一群麻布袋蒙著臉的人類魔物


  這些我蠻有興趣知道其由來的，能告訴我電影名稱嗎?感謝


  以上(土下座)


  --'
