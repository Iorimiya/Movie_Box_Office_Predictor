title: '[好雷] 《詭屋》相見恨晚的神片'
content: '以下無雷


  最近喜歡找一些冷門題材又特別的片來看，這部正好都符合這些條件


  這部說來也很有緣份，本來是在本板搜尋"燒腦"主題的片單中，想找燒腦懸疑片，卻無意看到有人推薦這部，說這部最後有讓人意外的大翻轉，個人就喜歡這種類型的片，所以就收到片單，剛好看到愛奇藝竟然有這部片，就抱著打發時間的心情來看看


  整部片的舖成，一開始就像是很公式化的恐怖片，一群年輕人到了一個森林小屋渡假，發生的一些恐怖事件，這種類型的片還不少，前陣子在Netflix看的《經典恐怖故事》就幾乎一模一樣


  但隨著劇情的發展，就如同板友說的，一整個超展開，最後半小時太讓人驚艷和驚喜了，看著看著就笑了


  跳脫既有的恐怖片框架，擺脫傳統驚悚片的邏輯，還能結合災難片和一點科幻元素，實在是太佩服編劇的創意


  前面就是低成本的YA片，慢慢變成恐怖片，接著就是驚悚片，然後就是災難片，接著科幻片，最後是奇幻的神話片，短短一個半小時這麼多轉折，說到這裡相信大家也一定也感到興趣吧，千萬別錯過，絕對會顛覆你的想像


  太多太多恐怖片都是用老梗的公式化，看來看去都是那幾種手法，這部片惡搞這些傳統的電影，完全不是你想像中的劇情走向


  另外也推薦也和這部有點像的《醉後末日》《我們撞到外星人》這兩部都是賽門佩吉主演的搞笑片，一樣是在惡搞傳統的電影模式，也一樣有超展開的豪洨劇情


  --'
