url: https://www.ptt.cc/bbs/movie/M.1336931356.A.FCC.html
title: '[好雷] 詭屋 - 當血腥恐怖片達到了哲學的層次'
content: '詭屋 (The Cabin in the Woods)

  導演：德魯戈達德 (Drew Goddard)

  編劇：喬斯溫登 (Joss Whedon)

  推薦：４顆星 (不看可惜)



  如果你有打算要去看這部電影，拜託，這篇文章你就別看了。應該說

  是拜託你連劇情簡介都不要看，預告片也不要點開來，就抱著甚麼都

  不知道的心情走進電影院吧！你有可能會因為抱著想看極度恐怖的心

  情進場，而在最後失望地破口大罵，但說實在話，電影演的不是一場

  遊戲，是真的有人掛點，也絕非惡作劇的情況下，劇情顛覆傳統地"

  超展開"！在我眼裡，破口大罵的人就像是大魔神一樣，本身也參與

  了電影的演出阿！有趣到翻天了。



  這部電影顛覆了我對傳統恐怖血腥片的刻板印象，玩遍好萊塢血腥片

  幾乎所有的非成文規定，語帶諷刺地左批右打東西方電影工業…我不

  知道喜歡看恐怖血腥片的觀眾到底都進場在看些甚麼(因為我自己非

  常害怕開腸剖肚的血腥電影，每次看都會被嚇傻)，但《詭屋》卻讓

  我如倒吃甘蔗般驚呼連連！同樣都在"拋頭顱、灑熱血"，你會佩服編

  劇和導演的無限創意，也算是在幾乎已經沒有甚麼好變化的血腥恐怖

  片市場裡，紮實打了觀眾一記回馬槍吧。



  《詭屋》聽說是《復仇者聯盟》導演喬斯溫登(Joss Whedon)，關在

  旅館房間裡苦思出來的劇本。前幾個星期當所有電影都在閃《復仇者

  聯盟》檔期，沒有甚麼其他電影可看時，我還納悶為什麼片商要讓喬

  斯溫登要自己打自己？殊不知，就是因為大家都去看《復仇者聯盟》

  了，同時間上映的電影就只能出奇，看能不能制勝。一開始，我真的

  以為《詭屋》就是一般的美式恐怖片，心裡對這部電影還充滿了不屑

  …反正不就是一群人到一間旅館還是甚麼小木屋，結果遇到殺人魔然

  後被凌虐之類的電影嗎？《針孔旅社》如此、《恐怖蠟像館》如此、

  《魔山》也是如此…



  打開好萊塢恐怖片片單，其實也都大同小異，從早期的《德州電鋸殺

  人狂》、《佛萊迪大戰傑森之開膛破肚》，一直到《歡迎光臨死亡小

  鎮》、《絕命聖誕夜》、《母親劫》、《嗜血狂獅》、《食人魚》…

  喜歡看美式血腥恐怖片的觀眾，應該開始對劇情的變化程度越來越不

  滿足了…反正不外乎就是殺人狂、恐怖噁心的鄉野傳說、變態外科醫

  生、討厭的嗜血怪獸(殭屍片應該加進去嗎？)…總歸就是"血肉模糊"

  、"性"、"暴力"這幾個元素加在一起按不同比例調配，生出這麼一大

  票電影，就看誰的劇本有創意。



  《絕命終結站》系列就是在玩各種不同的死法，結果哪個不被要命的

  觀眾嫌無聊、抄襲、老梗；《人形蜈蚣》也開始拍一系列，比哪一集

  接的蜈蚣比較長，結果被嫌為了噁心而噁心，還有天殺的觀眾放話說

  「我是笑著看完電影的」；經典《奪魂鋸》系列總沒話講吧？但有沒

  有人聽到恐怖片迷在讚嘆好可怕？要不是劇情加入了很多對社會制度

  的反思，值得大家探討，否則你大概也只會常聽到好胃口的觀眾說「

  奪魂鋸喔？還好啦，我還一邊吃滷肉飯一邊看咧」



  觀眾要甚麼？不僅導演、編劇、製片、電影公司不知道，我看有時候

  就連觀眾自己都不會知道，到底想在血腥恐怖片裡看到甚麼。觀眾的

  胃口越養越大，上帝與撒旦之爭已經不夠看，拿電鋸還是手術刀的也

  已經落伍，甚至開始出現像是《陰牙人》這樣的電影，尤其是看到即

  將上映的《3D食人魚2：全面獵殺》，大奶金髮妹一邊尖叫一邊抖奶

  已經不夠看，還有食人魚透過男人的精蟲到女人的子宮裡產卵，一幕

  女人泡澡時食人魚在兩胯之間遊走的場景…我的老天啊，是我太衛道

  還是這個世界太開放？追求刺激到了這個地步，真的只能祝你幸福了

  。(順道一提，我表姊說基隆秀泰影城居然在《復仇者聯盟》上映時

  播放《3D食人魚2：全面獵殺》的預告片，就是那個有抖奶和泡澡的

  片段的，到底有沒有想到觀眾席上可能有小孩啊？)



  回到《詭屋》，一開始我也只是隱約地覺得電影有點不對勁，但前半

  段還是看得讓我一邊心驚一邊罵人，一方面是導演壞透了，突然的定

  格和特大音效搞得我心臟都會瞬間落一拍，另一方面則是暗暗抱怨怎

  麼看了一部八股到不行的美國恐怖片。但這一切就逆轉在處女女主角

  被殭屍在湖邊凌虐，而事件製造者們在控制室喝著香檳慶祝…當然這

  一瞬間的反差讓人覺得突兀，同時我也突然發現，當血腥恐怖片迷們

  在電影院看到大螢幕上的角色，被用盡各種可怕的方式凌虐時，眼裡

  閃出的光芒亮度，大概不下於這群工作者吧。



  網路上已經有許多關於《詭屋》的電影文章，大部分都把五位可憐被

  害人當成電影主角，事件製造者們當成電影工作人員，而最可怕的大

  魔神就是觀眾。想一想…也的確，金髮淫蕩妹一定要先死，死前一定

  要大露奶，接著就是身材很好的運動員帶領著大家逃跑，然後聰明的

  學者總會有一些反擊的辦法，愚者通常都扮演搞笑的角色，最後就是

  單純聖潔的處女女主角傷痕累累地反擊成功或是慘死，反正處女就是

  要最後死就是了。為什麼？因為公式，這樣的角色陣容和劇情曲線就

  會讓觀眾買單。但《詭屋》如同哲學名著"蘇菲的世界"一樣，讓蘇菲

  本人穿越時空，跟創造者見了面。被安排就是應該要這麼玩幾位主角

  ，就有個不是這麼笨的愚者，和根本就像是運動家的處女沒死，突破

  了界線跟一手策畫全局的事件製造者見了面，反客為主讓這麼一大票

  可怕的"電影創意"反噬，最後還在象徵著觀眾的大魔神面前講：世界

  換人主宰也不錯…你以為這是爛尾？當觀眾可以主宰的時候，身為觀

  眾的我們有沒有想過，我們想在電影裡看到甚麼？



  日本人號稱都不失敗，卻殺不死任何一個小學女生。有人說這是因為

  電影慣例就是不殺小孩…我覺得應該沒有想的這麼遠，反而是諷刺了

  東洋鬼片的厲鬼幾乎沒有殺傷力這件事。當孩子們一起唱歌超度了厲

  鬼幸子，幸子變成了一隻快樂的青蛙之後，身為對東洋鬼片接觸最多

  的我們，你滿意嗎？我個人是頗喜歡這種溫馨快樂的結局啦，但想到

  當初強調母性光輝的《鬼水怪談》(黑木瞳演保護孩子的媽媽喔！)普

  遍獲得鬼片迷的噓聲後，我也就完全贊同觀眾是大魔王這件事了。



  喬斯溫登真寶，關在旅館裡居然可以苦思出這麼有創意的劇本，我猜

  他大概是帶著一大疊恐怖片的DVD進了旅館，在看過這麼多恐怖片後

  ，心一橫想「既然這麼愛看，就看個夠吧！」。劇中人物是自己選擇

  了死亡的方式，處女主角讀了死亡殭屍家族女孩的日記，念了拉丁文

  咒語喚醒了撲殺率100%的殭屍家族…但如果是運動家吹了海螺，就喚

  醒血腥人魚；金髮蕩婦放完了音樂盒，就喚醒大嘴芭蕾女；學者玩了

  球，就放出殘酷殺人魔；動了電影放映機…我想…出現的就應該會是

  殘暴的凌虐高手。



  有趣的是電影還出現了很多有看過的、沒看過的殘暴角色。大蟒蛇、

  史前飛怪、奪命幽魂…以至於暴力綁架集團、殺人小丑、貞子、狼人

  …甚至是有如變形金剛的機械獸、哈利波特裡面的獨角獸…都被列為

  殘暴角色之一。不知道為什麼，除了後半段的電影內容超展開，我越

  看越爽外，甚至有一種看到大家都回娘家的感覺。這電影劇本實在太

  幽默，跳躍到讓人嘆為觀止啊！



  所以…我想問，你生氣了嗎？你覺得這部片在胡搞瞎搞，讓想看血腥

  恐怖片的你失望發火了嗎？那電影就講得太好了！因為大魔神果然發

  火了。《詭屋》也許沒有這麼血腥暴力，但不妨看成是劇組對整個血

  腥恐怖片市場的怒吼，你到底想要多血腥？多暴力？多恐怖？《詭屋

  》一次讓你滿足很多個願望，還讓故事達到了一個哲學思維的層次，

  我覺得好看到不行啊！真要看噴血？一個人身上的血液也不過佔體重

  的十三分之一，想看的話，乾脆找十個大胖子來噴好了，哈哈。



  電影劇情：★★★★★

  演員演技：★★★☆☆

  角色刻劃：★★★☆☆

  故事氛圍：★★★★★

  畫面美感：★★★★★

  服裝化妝：★★★★☆

  音效配樂：★★★★★

  剪輯流暢：★★★★☆

