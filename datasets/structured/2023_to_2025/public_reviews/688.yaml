title: '[贈票] 【餘燼】北中南特映會搶先看'
content: '★ 金獎導演鍾孟宏首次挑戰跨時代巨作

  ★ 集結金獎卡司陣容，打造不一樣的鍾孟宏電影

  ★ 11月15日全台上映

  ★ 最新預告：


  電影以鍾孟宏導演獨特的個人風格翻開歷史的舊帳，表面靜好的歲月，背後有多少遺忘與

  秘密？故事描述發生在市場裡的一起凶殺案劃破了寧靜，接二連三的刑事案件背後有著不

  為人知的關聯。導演鍾孟宏點燃歲月餘燼，遊走多線時空，直探白色恐怖歷史。



  推文留言你想要看【餘燼】的原因+想參加的場次，就有機會搶先看電影！



  【餘燼】電影特映票（一人中獎兩人同行）



  台北場：11/6（三）19:30 長春國賓影城

  高雄場：11/9（六）15:30 喜樂時代影城 高雄總圖店

  台中場：11/11（一）19:00台中日日新影城



  11月4日公布中獎者於回文內，並寄站內信通知得獎者得獎事宜。

  11月5日 （二）18:00前請各位中獎人務必回覆領獎資訊，恕不接受逾期回覆。



  ・影廳內禁止拍照、攝影

