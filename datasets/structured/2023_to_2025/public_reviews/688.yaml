url: https://www.ptt.cc/bbs/movie/M.1751530883.A.0B8.html
title: '[討論] 馬德法克 巴帝斯塔 寇瑞蘭柯「餘燼」預告'
content: '戴夫巴蒂斯塔，山謬傑克森，歐嘉寇瑞蘭柯，克里斯多夫西夫朱(冰與火的野人)

  基於 Scott Chitwood、Paul Ens 和 Wayne Nichols 的同名 Red 5 Comics 系列

  劇情發生在地球技術被太陽耀斑摧毀十年後


  導演是替身出身的，好久沒聽到原汁原味的馬德法克


  --

  據說這部居然籌備了13年?

  你不是嗎?

  粉絲集結得很快喔!'
