url: https://www.ptt.cc/bbs/movie/M.1731413579.A.D24.html
title: '[好雷] 餘燼'
content: '雷到爆









  黑白畫面開始回憶1956年的共諜案

  小薰帶著兒子去警總認屍領回家屬

  在一堆被槍斃的人裡找丈夫的大體

  兒子在旁邊看，媽媽要兒子好好看

  別忘了他當醫生的爸爸是怎麼死的


  畫面變彩色回到2000年的台灣

  一個華裔老人在美國公路上

  失魂落魄的遊盪喃喃自語

  被美國警察攔下帶去送醫


  畫面又轉回2006的台灣

  張震正在看王建民打美國職棒

  正精彩的時候，劉冠廷打電話來

  說菜市場發生了一起凶殺案

  一個名人被歹徒一刀斃命腸破肚流


  張震是刑事偵查隊長，劉冠廷是他的部下

  劉冠廷叫小蔡，延續陽光普照菜頭的名子

  陳以文演張震跟小蔡的長官


  開始去找死者的老婆楊謹華問案甚麼都問不到

  他們夫妻倆經營心靈成長課程謀取暴利

  被騙錢的巫建和被騙錢不滿常去鬧事

  就被劉冠廷鎖定為嫌犯


  但抓了巫建和發現他不是歹徒

  後來關係錯綜複雜不知怎麼查到金士傑

  金士傑在戲裡改叫許士傑，跟許瑋甯姓

  因為許瑋甯演她女兒，她女兒報案她爸失蹤


  張震跟許瑋甯問案，問到後來變一對

  張震當警察當到離婚，許瑋甯也分居

  所以兩個都單身男女剛好湊一對


  想說許瑋甯會不會現實生活中也分居了

  她在這片裡還是很美，鍾導把她拍得很美

  但在一群很高的帥哥中，她就顯得很矮


  畫面帶到金士傑被莫子儀囚禁在密室

  一直問他當年在警總辦共諜案的回憶

  金士傑以前是警總特務頭子

  莫子儀是則是演小薰的丈夫

  跟小薰長大的兒子


  莫子儀長大後在餐廳當學徒變廚師

  後來創業靠開佛跳牆調理包工廠致富

  是台灣飲食業奇蹟的有頭有臉成功商人

  發了財之後開始尋找自己的仇人報仇

  很像韓國片朴贊郁的(原罪犯)老男孩


  在自己工廠的樓上住家

  設計了一個密室軟禁仇人金士傑

  審問的過程中說去他家殺了他女兒

  就是預告片裡許瑋甯被開三槍的畫面

  金士傑聽到女兒被殺就癡笑的敲窗戶

  也是預告片裡的橋段


  但這只是要嚇嚇他讓他有喪女之痛而已

  徐瑋甯沒被殺，還跟張震他家越走越近

  這些政治犯二代好像只殺男人不殺女人

  從菜市場兇案第一個就是男的

  接二連三都是男的被殺


  洋片跟韓片拍的都是二戰時期的老人尋仇

  這片則是這些老人的下一代找下一代尋仇

  題材倒是很別出新裁，要讓上一代的仇人

  也嚐嚐喪親之痛，所以都只殺他們的兒子


  還一路殺到美國去，當年很多軍官

  退休後就全家移民美國去國外享福

  遠離台灣這個是非之地

  就像宋美齡張學良一樣


  後來張震跟劉冠廷查案查了兩小時多

  查到我膀胱都快爆炸了，就去跑廁所

  聽說這片有3小時後來剪到2小時半多

  所以沒看到一點點，回來就打起來了

  黃柏傑準備在放假時在銀行毒殺張再興

  張再興的爸爸好像是告密者


  劉冠廷查到了黃柏傑當天出現在菜市場

  有賣鹹粥的攤販看到他的臉過目不忘

  查到他是個法警，當兵時是是涼山特勤

  後來退伍當警察，因為看到同仁貪汙而改考法警

  當法警後槍決了四個人，把子彈融成項鍊戴著


  後來認識了莫子儀跟李銘忠

  這三個都是白色恐怖的受難家屬

  他們開始物以類聚的聯合起來復仇


  例如在美國把電影開始的那個老人抓起來審問

  問到他以前的同事跟家人在哪裡等等等

  後來回台灣一個個的尋仇


  這些人就像當年的餘燼，星星之火可燎原

  這些小孩就像殘存火苗，長大後開始發爐

  就像被丟棄的菸蒂演變成森林大火一樣

  最後都會跟著這些關係人一起同歸於盡


  後來劉冠廷因為追查跟蹤黃柏傑

  結果被黃推下樓，菜頭就腫成豬頭，沒死

  張震最後抓拿黃柏傑一火大就給了他三槍

  幫部下報仇，檢察官來問案說怎麼殺的

  張震說當時打太兇記不太清楚

  檢察官說上法庭千萬要說站著開槍的

  因為如果說坐在地上開槍那彈道就不對

  一被法官發現說謊就會變殺人罪


  張震在戲裡當刑警真是嫉惡如仇，殺人不眨眼

  跟那三個尋仇的後代一樣，完全不會良心不安

  頂多因為瀆職引咎辭職而已，也不會睡不著覺

  後來李銘忠跟黃柏傑這兩大高手都被警察幹掉

  李銘忠好像死在自己土地上比客死異鄉安穩點


  張震查到莫子儀的佛跳牆工廠

  開始查到他樓的住家，從電視查到

  連接到密室的監視器，才查到金士傑被他囚禁

  莫子儀先跑去街友辦桌大會的佛跳牆寒冬送暖

  請了洪榮宏上來演唱台語歌，知道張震會來抓他

  看到張震帶隊來抓人，就拔槍開了幾發空包彈

  張震當然開槍反擊，把莫子儀給打死

  結束了這一切，都是莫子儀事先安拍好的計畫


  裡面講到當今現況每個人好像都很厭世

  莫子儀佛跳牆工廠因原物料上漲不賺錢

  李銘忠出生在美國但還是像在異鄉孤獨

  黃柏傑則在公家機關看到人性的黑暗面

  他們感到厭世就湊在一起想玉石俱焚

  跟上一代仇家的小孩一起同歸於盡


  最後張震辭了職跟徐瑋甯在一起

  劉冠廷醒了，但神智不太清楚有點失意

  讓我想到國軍傘兵也是跳傘沒張開摔下來

  也是後來就活了沒死還能參加今年國慶大典


  總之這片看完就是鍾導要用來攻奧斯卡的片

  張震是臥虎藏龍裡的羅小虎，王建民也是旅美球星

  徐瑋甯是混血兒，外國臉會讓美國白人有點親切感

  還拉去美國拍，而且政治題材也想像羅馬一樣成功

  就像悲情城市在威尼斯大紅大紫到今天一樣

  裡面也提到蔣總統萬歲

  可能美國對蔣介石很熟


  但願明年金球奧斯卡能如願以償

  讓我們的鍾導能成為李安的接班人

  在奧斯卡拿獎，早日超越奉俊昊

  拿最佳影片、導演、男主角等等等


  不過張震要拿奧斯卡影帝可能要再等幾部片

  雖然他的演技已經比臥虎藏龍時進步很多了

  但願徐瑋甯也能因張震紅到美國好萊塢去

  就像演玉嬌龍的章子怡一樣


  她在這片裡被拍的真美

  祝她早日超越前男友阮經天

  成為國際影后紅片全世界

  變林青霞、林志玲、王祖賢的影后接班人


  影迷一直說台灣要學韓國多拍些政治題材的片

  要能檢討過去的政治歷史，現在終於拍了這部

  像之前返校拍了也大賣，但應該是因電玩大賣


  所以鍾導也藉政治題材趁當局支持可以發輔導金

  就順應時勢來拍這部片看能不能象返校一樣發財

  希望能大賣，像返校拍那麼難看竟然還那麼賣座

  所以選對題材應該就能賺錢，至少這片比返校好看


  結局最後就是一張黑白照片

  莫子儀、小薰跟兒子三人的全家福


  昨晚在台中辦的試映會，本週五大後天全台上映，鎖定目標要去美國拿奧斯卡，金馬獎最

  佳導演鍾孟宏以台灣戒嚴時期白色恐怖為主題的片，1956年因共諜案被判刑槍斃的人，他

  們的下一代們長大後活到今天，開始尋找當年承辦共諜案的警總特務的後代們尋仇，這片

  所想表達的是有些恩怨情仇不會隨著時間被遺忘、釋懷或放下，而會至父及子的代代相傳

  並且與日俱增，政治信仰就像宗教信仰一樣，沒完沒了的歷史糾葛。


  我看過鍾導公司拍所有的片

  從在美國拍的第一部紀錄片醫生、廣告下棋

  停車、第四張畫、一路順風、陽光普照、瀑布

  監製的大佛、麥娜絲、腿，到現在這部餘燼

  他說他的片都叫好不叫座，除了大佛賺錢外

  其他片全都賠錢，但願這部片能讓他發大財


  同行的友人說這片跟以前國片不太一樣了

  他是多數只看好萊塢爽片不看國片的觀眾

  他說整個拍攝方式跟場景都跟美國片很像


  --'
