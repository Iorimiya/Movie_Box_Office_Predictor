url: https://www.ptt.cc/bbs/movie/M.1731778554.A.999.html
title: '[好雷]餘燼-現在過得好好的 管他過去幹什麼'
content: "趁著觀影後印象正新鮮，盡量減少雷點的抒發下心得\n\n先說結論：這是十分值得一看的作品，尤其喜好台灣歷史、白色恐怖題材的觀眾。\n\n以警匪對決的懸疑主題帶入歷史政治敏感的復仇題材，美國與韓國已經算常見（尤其韓國\n\
  真的特別用力），但引入白色恐怖時期的陳年舊案，這在台灣倒是十分新鮮了。\n\n電影雖沒明講，但幾乎是以「記憶」充斥了全片主軸。特務的記憶、小孩的記憶、警察的\n\
  記憶、攤販的記憶...記得也好、不記得也罷，在這樣彼此猜疑、試探中，確認著對方是\n否真的記得。\n\n與返校中「是忘記了，還是害怕想起來？」的明示正好相反，片中充滿了各種諷刺、暗喻\n\
  ，宛如罵人不帶髒字的橋段，一再試探著觀眾（留意有些演出情節刻意的讓演員正對逼近\n鏡頭：對著螢幕前的觀眾）\n\n所以看到有些人說這部在輕輕放下白色恐怖加害者，我只能說他們顯然是看漏了那些暗喻\n\
  。這絕對100％是部復仇劇，只是不是那麼張牙舞爪，而是溫和冷靜，甚至略帶優雅的，\n在嘲弄著那些強裝鎮定的加害者、共謀者。不得不說莫子儀這角色選得好，他非常適合這\n\
  種王子復仇記般的角色，看到後來反而幾乎要共感在這個反派身上。\n\n\n\n裡面有幾幕戲我滿喜歡的：\n\n\n一個是莫子凡在談到馬邦國的那一段，當兩個本該不會再有交集的人，在美國相遇。早已\n\
  時過境遷，莫子凡迎了上去\n\n\n「他明明還記得，但裝作不認識我」\n\n\n當加害者裝睡的那一刻，你的委屈求全、甚至原諒，都失去了意義。也在那一時刻，就像\n\
  把銀紙丟進炭灰中，倏然燒起依樣，餘燼未消。\n\n這算是一個十分簡短也極具說服力的復仇理由了，尤其對有過被對方一句話、一個動作勾\n起新仇舊恨火起來經驗的人來說，應該很能體會\n\
  \n另一個滿喜歡的，是檢察官進來探視張震的那一段，幾乎是全劇精華了。\n\n\n「你是坐著射？還是站著射？想清楚再回答」\n\n\n這場略帶心虛、試探、猜疑，小房間內的官官相護，對比起前面為了正義大張旗鼓的追查\n\
  、與一心追求真相與復仇的反派方相比，霎那間變成了極度荒唐的鬧劇。\n\n\n「正義比一張衛生紙還薄」\n\n所以後面才會有張震辭職不幹的結局，有些人可能以為他是因為射殺莫子凡才辭職。但其實這幕戲才是張震遞辭呈的原因\n\
  \n因為他已經髒了\n\n可能在回答完檢察官問話後就後悔了在那個當下他才真正體會到自己只是凡人\n\n對比起那個整個分局收賄，只有自己沒收錢，過於正直而被排擠，最終被張震私刑的警察\n\
  \n這兩個角色對比也十分有趣\n\n最後是許士節在河岸邊的對話\n\n\n「既然知道是錯的為什麼要做？」\n\n\n「是為了信仰」\n\n\n這邊剛好停在了這邊，一個沒問清楚不行，再多講下去會太狗血的微妙橋段。如果是一般\n\
  電影模式，大概會繼續講下去，清清楚楚交代，無奈也好、推給國家也好、狡辯也好，但\n就停在這了，欲言又止。\n\n剩餘沒講出的，就留給觀眾細細咀嚼了。\n\n再來要談些缺點部分\n\
  \n以電影時長來說，還是不免有些拖沓。雖然為了填補辦案中的流水帳，穿插了不少生活劇\n情和分支，但總顯得有些多餘。\n\n譬如這次劉冠廷部分，其實全砍掉也不影響劇情...還有主角香港老媽這些部分，都跟主\n\
  線幾乎毫無關聯，把這些劇情精煉化聚焦主線，應該能讓電影節奏快上不少。\n\n\n\n整體而言，還是非常推薦進戲院支持的電影\n\n\n之前在返校的心得曾寫過，期望在日後的電影中見著更多願意挑戰台灣過往禁忌題材的電\n\
  影\n\n\n到沒想到這麼快能看到把白色恐怖打在片尾的電影\n\n\n且看且珍惜\n\n--\n\n我覺得單純他們沒看懂，說白了可能就是平常少看這類型的題材，而過往談論白色恐怖的電影題材又太少，所以變成他們很興致沖沖的跑去看，結果完全沒看懂裡面的隱喻\n\
  \n但如果放去好萊烏，就會發現這類題材已經算很常見\n\n主角與劉冠廷的搭配，幾乎就是致敬了火線追緝而來\n\n\n所以其實全片都在處理這種內心情緒\n\n加害者方再三的說「時間都過了那麼久了」計較這些幹嘛？\n\
  \n莫子凡不冷不熱的「我殺了你女兒，只是想看看你會有怎樣的反應」 對比許士節的激動，更顯得那種加害者有多虛偽\n\n莫怪乎最終，莫子凡成為了許士節靈魂拷問的幻象，而且是幼年的形象\n\
  \n因為莫子凡的角色，就是那個喊出「國王為什麼沒穿衣服」的「天真」孩童\n\n\n私刑正義+轉型正義這樣的題材處理白色恐怖，我覺得以第一次拍這樣題材來說，是處理得很不錯的。\n\
  \n政治題材處理的深度上我是給過的~瑕疵反而出在劇本演出上這點我反而沒料到w\n\n\n他們幾個為了保命，簽了子虛烏有的自白書，害莫聲遠等8人被槍斃，妥妥的加害者沒錯。\n\
  \n更諷刺的是還讓馬邦國跟許士節你我惺惺相惜情不自禁，莫子凡沒把佛跳牆砸在他頭上真的是脾氣好\n\n對 要留著他講台詞\n\n說殘酷點，這就是現實。仍然是現實中的ing\n\
  \n看看最近的新聞，薄瓜瓜要來當台灣女婿了\n\n張震跟許士傑女兒，可能從來都不是什麼正直的好人(誰沒事去泰北教英文？去泰北都教中文)\n\n\n所以小莫沒給答案，肯定或否定。事實上連馬邦國挑起的動機，都是這樣曖昧\n\
  \n「他只是想找回那隻鞋」\n\n剩下的問題就是，那隻鞋，那個麥高芬，對觀眾來說是什麼？\n\n\n對，不只殺了他，而且還為了自保說了謊，那瞬間張震才意識到正義跟衛生紙一樣薄，而自己輕易地踩破了它\n\
  \n 美國內戰又更難懂了點，畢竟那是給美國人看的隱喻，作為外國人還是很難懂\n\n\n畢竟說真的：國內文本比較量不多\n\n近年能比較的也就返校、流麻溝這兩部\n\
  \n但返校劇本深度差太多無法比，流麻溝背景在外島、姚文智背景身分讓這部處理上也顯得小心翼翼\n\n警探懸疑結合白色恐怖類型，你也很難說這個走向正不正確\n\n\
  不過我的立場還是跟返校當時的心得一致\n\n有人覺得自己拿同樣素材可以拍得更好，激起更多創作，那對台灣都是好事\n\n石頭已經擲出，會掀起怎樣的漣漪，都是值得期待的\n\
  \n\n既然你拿了希特勒比較，那我反倒好奇：你認為片中有什麼不符合歷史、吹捧希特勒的地方嗎？\n\n\n 這邊留意一下：它並沒有結束喔。\n\n許士傑有問到關鍵的問題：你也要把我殺了嗎？\
  \ 莫子怡沒有明確回答\n\n扮演反派的三人事實上都是戰鬥到了最後一刻\n\n他們知道危險近了，沒有選擇逃離、沒有求饒\n\n可以說從一開始，莫子凡的「復仇」，就不是殺了幾個告密者和特務這樣簡單的目的\n\
  \n\n 哈哈哈哈哈\n\n 抱歉這個讓我笑出來了\n\n 我沒想過把白色恐怖事件貼在電影片尾會有被台灣人自己嘲笑的一天\n\n 韓粉統派笑也就算了，台灣人不爽說在教育你...？\n\
  \n 這真的太有趣了XDDD\n\n 沒有白色恐怖這背景，那打從一開始就不成立。\n\n 要記得這一切的開端：\n\n 白色恐怖的受難者後人流亡海外後，與為了逃避責任逃到海外的白色恐怖告密者\n\
  \n 在美國這塊異地相遇了\n\n 受難者後人主動上前攀談，告密者只說了你認錯人了\n\n 這一切復仇的張力，不建立在白色恐怖的背景下，就沒有任何意義了\n\n\
  \n那你覺得更好的台詞是什麼呢？能滿足莫子凡的期待的答案，又是什麼？\n\n\n  如果阿堯願意拍，那我也十分期待\n\n 我自己其實有點懷疑，真正想殺人的是另外兩人\n\
  \n 流亡海外什麼髒事也做過的受害者後人、和過度正直而加入復仇行列的警察\n\n 莫子凡自始自終態度其實都很曖昧，始終沒對張的女兒下手(當然循環完會不會排到她也不知道)\n\
  \n 最後射出的還是一發空包彈\n\n\n 說搞砸我想太嚴重，畢竟這部片遠沒到搞砸的程度，它只是不那麼符合某些人的期待，但它畢竟是好好拍出了一部白色恐怖的電影。\n\
  \n真正要討論搞砸，至少也要環太平洋2或惡靈古堡拉昆市那種等級的鍋\n 沒關係，75分對要求100分的人來說，確實是大爆死。但對連60分都考不到的人來說，簡直是奢望的分數\n\
  \n 對於我來說？「挖靠~它沒缺考耶」\n\n 看一部少一部，我自己都不確定下一部取材白色恐怖的商業片什麼時候會出現\n\n 對，我也很愛那段，非常直球，少了那段，這部戲就會完全失去重心\n\
  \n\n 直接在不識相的莫聲遠/莫子凡，和識時務的王大鵬/張振澤之間劃出了一條線\n\n 然後你會驚駭的發現，要妥協自保，是可以多麼輕易，多們簡單甚至毫無記憶點\n\
  \n\n做不到喔，所以張士節能活得好好的\n\n現實中的王大鵬們，也還活得好好的\n\n想想他們可以對這部電影做出什麼事\n\n這也是非常有趣的地方\n\n\n\
  \ 說到小莫還真的不會覺得在醜化他，這角色的率真完全是主角格\n\n「天真的是我們這種想知道真相，卻始終只能在歷史門外徘徊，不得其門而入的人」\n\n他那喜怒幾乎不形於色的溫文儒雅，反到會讓那些滿嘴正義，卻不斷找藉口的王大鵬們，越看越心虛、越見越惶恐\n\
  \n只差最後沒來個致敬城市英雄的射水槍了\n\n\n 怎樣？ 你是在跟風噓文嗎w"
