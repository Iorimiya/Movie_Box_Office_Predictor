title: '[情報] 鍾孟宏新作《餘燼》殺青'
content: '在2021年鍾孟宏接受THR專訪時有提過新作品訊息

  而此部新作也已在6月中開拍且於近日殺青 定名為《餘燼》


  如果有看上個月北影頒獎典禮

  卓越貢獻獎得主也為鍾導長期合作夥伴的劉振祥 感言就有提到此部電影

  而在近日公布的長片輔導金名單 此部也有入列


  《餘燼》再次跟前作製作班底合作

  鏡文學的董成瑜及瞿友寧擔任監製

  取景地以屏東為主 拍攝後期有到台中、苗栗、台北


  演員名單也是金獎陣容齊聚 目前得知參與演出的有

  張震、陳以文、金士傑、劉冠廷、莫子儀、馬志翔、劉亮佐、謝欣穎

  其中莫子儀、馬志翔、謝欣穎為首次參與鍾孟宏作品


  其他五位則是已合作過


  張震

  《停車》《陽光普照 (監製身分)》


  陳以文

  《一路順風》《陽光普照》《瀑布》《大佛普拉斯》《小美》《同學麥娜絲》《腿》


  金士傑

  《停車》《第四張畫》《失魂》《一路順風 (特別客串)》《腿》


  劉冠廷

  《陽光普照》《瀑布》《小美》《同學麥娜絲》《腿》


  劉亮佐

  《瀑布》《腿》



  《餘燼》目前訂於2024年上映






  --'
