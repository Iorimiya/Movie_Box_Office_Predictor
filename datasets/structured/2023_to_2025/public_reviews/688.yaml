url: https://www.ptt.cc/bbs/movie/M.1726451230.A.AC3.html
title: '[討論] 《餘燼》角色情報'
content: '"2006年，當全台灣的人都專注於王建民的比賽，市場裡一場凶殺案劃破了寧靜。一名許姓

  女子前來報案，她宣稱自己的父親已經失蹤了半年，而父親與市場死者的父親是好友。負

  責此案的警官張振澤（張震 飾）從同期警官那裡，得知另一場謀殺案的死者父親，與市

  場殺人案也有著不明的關聯。


  張振澤與搭檔小蔡（劉冠廷 飾）在諸多謎團中找尋線索，張振澤查到一樁1958年的共諜

  案，推測這些受害者的父親，很可能都與當年的讀書會有關。另一方面，一位食品工廠的

  老闆莫子凡（莫子儀 飾）為了喚醒過往與父親的回憶，也獨自展開調查。在記憶與遺忘

  間，真相慢慢浮現。張振澤和莫子凡在歷史夾縫中，一腳踏著過去的影子，一腳踏向未知

  的未來。兩個執著於真相的人，以各自的方式，撕開台灣歷史的疤痕。


  "


  這次在雜誌批露的情報又跟以前的不一樣

  之前說時代設定是50年代

  現在則是2006年


  張震:南京第二分局(奇怪的分局名字，是在影射什麼?)辦案警官，電影主視角

  劉冠廷:張震的sidekick，在辦案過程中會有角色路線變化

  劇照可以看到還有一個警察是侯彥西

  莫子儀:之前說是檢察官，現在變成工廠老闆。白恐受難者家屬，重新調查父親之死。

  金士傑:黨國餘孽，退休調查局特務，以自己的工作為榮，但不對家人提起工作的事

  許瑋甯:金士傑之女，因為父親失蹤而被迫面對父親的過去


  從這篇報導我猜劇情是白恐受難者對加害者復仇的故事

  但兇手應該不會是莫子儀這麼簡單

  劇情有懸疑推理感覺會很好看

  會不會是因為太類型化導致這部片沒有國際影展入圍???


  --'
