url: https://www.ptt.cc/bbs/movie/M.1504973832.A.BA2.html
title: '[好雷]回憶的餘燼─歷史是勝者的書寫 '
content: '歷史是勝者的書寫。

  記憶是修飾的自我安慰。



  你有沒有過那種時候？

  午夜夢迴時，被忽然從腦海底層浮上來的、羞恥的、不肯承認的記憶驚得渾身發冷，你忽

  然發現你記錯了細節，你描摹，刪改，用各種理由合理化甚至竄改過的記憶裡，你成了寵

  辱不驚的被害者，不需要在二十年後忽然背起沉甸的十字架，不需要再想像那蒼白細瘦的

  手腕上滲出的鮮血。




  自殺當死得如同希臘悲劇的英雄，在手腕上斜斜切上三刀，最好割斷大動脈，來不及也不

  需要被救。




  亞德利安說，「我們念歷史有何意義？舉例來說，自殺者自殺的原因，除了當事人之外無

  人知曉，那是亙古的謎團。」青年在課堂上擲地有聲，恰如在開學典禮上遲來的被注目者

  ，他出場自當高調，連死亡也非同一般。

  如果問莎拉對此作何感想，她也許會願意引用狄蘭‧湯馬斯的詩，說一句死亡也並非所向

  披靡。




  記憶也不過是當事者編造給旁人的一個合理的藉口，同一件事在不同人口中就有不同的說

  詞，當每個人說起維諾妮卡和亞德利安的相遇，便逐漸揭露東尼最開始給讀者和前妻的敘

  述所產生的微妙落差，特別喜歡這部在最開始採用單一敘事者的偏頗時，東尼的前妻瑪格

  莉特毫不猶豫地用中途離席表達了她的不滿：

  你用一副打算坦白多年心結的模樣開始扯謊是什麼意思？




  整部最美的是時間軸的安排，倒敘和插敘一點一點地推翻原本主軸呈現的故事。

  喜歡劇情安排東尼在二十年後忽然地領悟到一時氣話造成的後果，就算那不能算是他的錯

  。





  至於最喜歡的，莫過於電影對維若妮卡的刻劃，東尼突來的領悟和遲來的道歉對維若妮卡

  不具意義，就算到整部電影的結尾她也拒絕接受。我非常喜歡她早用一把火燒掉亞德利安

  日記的橋段，電影輕描淡寫地用一句話塑造腳色的立體感和決絕。




  畫龍點睛的是東尼堅持做代理孕母的女兒，無論是諷刺父親沒有做到隨叫隨到的承諾（典

  型的英國尖酸幽默）還是在產房裡握住父親的手，低聲說，「你現在就做得很好。」




  她最後抱著新生兒出現在東尼經營的萊卡相機店內微笑，終於讓宛如浸沒在倫敦陰沉細雨

  的電影裡，迎來雨過天青。




  --'
