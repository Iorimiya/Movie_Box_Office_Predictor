url: https://www.ptt.cc/bbs/movie/M.1728979234.A.FE2.html
title: '[討論] 餘燼今日試片  首波評價出爐'
content: "膝關節：\n鍾孟宏導演的《悲情城市》+《返校》+《超級大國民》+《索命黃道帶》。\n結局我有被催淚到。可惡！\n關於一個六歲男孩被媽媽牽著趕著認父親遺體，父親買給他的新鞋在路上掉了一隻。小男孩\n\
  用盡一生，去尋找那隻鞋的故事。\n\n王雅蘭：\n《#餘燼》是部好看緊張刺激又血腥的警匪綁票凶殺片！\n\n~~~一般觀眾被這樣吸引進去戲院就好了。\n看完各自吸收解讀溢出類型片的東西\n\
  血腥是戲裡檢察官說的\n但也真的槍戰爆血滿多\n\n讚美導演 #鍾孟宏！\n可以把警匪片和政治歷史傷痕包裝得這麼精彩、感人，\n格局龐大、蘊意恢宏，\n演員個個精英、沒計較戲份個個演好，\n\
  所以細節也好看，\n楊謹華穿瑜伽服很美，\n許瑋甯化不一樣的妝好特別。\n\n接下來又要問金馬獎評審了！！！\n最佳影片、導演和攝影都沒入圍是怎麼回事呀？\n\
  攝影真的好強啊看畫面都內心會顫一下的，\n看過片的都來評評理\n另外主題曲很強！\n\n金士傑又沒入圍是怎樣?\n金馬獎金鐘獎歷屆評審對得起金老師嗎？\n他就有一場戲讓人掉淚的本事啊！\n\
  戲裡這角色真非他莫屬。\n\n 還有年輕生猛的 #王柏傑 爆打年近半百的 #張震，\n真怕張震被打壞打扁哪~\n後來....我就想到對喔！\n張震不是一天到晚拿武術冠軍，\n\
  難怪.....\n以下不爆雷 ，\n想知道自己\n#11月15日餘燼全台上映時去看\n\n\n\n如履的電影筆記：\n今天來看金馬5項入圍的《#餘燼》\n\n\
  片長161分鐘\n應該是導演鍾孟宏生涯格局最大\n故事最錯綜複雜的一部作品\n\n進場前沒查任何資訊\n完全沒想到竟然會是這樣的故事\n\n一場光天化日之下發生的市場命案\n\
  挑起台灣白色恐怖時期留下的創傷\n跟著刑警主角從破碎的線索中\n拼湊出那些不為人知\n或者說明明清楚卻刻意視而不見的隱藏真相\n\n這當然不是一件簡單的事情\n\
  角色眾多 又有不同的觀點角度\n如何去梳理其中的歷史脈絡\n把他們之間的關係串連起來\n也成為整部電影的主要看點\n\n同樣題材 如果是韓國電影應該會很煽情催淚\n\
  但這部片拍得相當克制 鮮少透過人物來傳達情緒\n而是將其留給每位看完電影的觀眾\n\n2019年有《返校》 2024年有《餘燼》\n這種對過去的反思是我們這個時代最珍貴的價值\n\
  \n看完覺得應該也是要至少入圍10項吧\n結果居然最佳影片 導演 連攝影都落馬\n裡面有很多鏡頭都很漂亮耶\n而且也沒有以前電影那種髒髒的感覺\n\n難道這種高成本的展現\n\
  有跟警匪和社會寫實這麼格格不入嗎？\n\n《餘燼》做出不少突破嘗試 可惜了\n今年金馬競爭真的這麼激烈喔\n\n\nLizard的海底影院：\n“正義有時候就薄的像衛生紙”\n\
  “但大家只在乎總統有沒有貪污，王建民有沒有打全壘打”\n“我們抓到了兇手，卻從未給出真相”\n\n很硬的題材、很棒的演員、很大的野心、很對的時間\n\n但是\n\
  \n很笨重的電影\n\n而同時這種笨重卻又是那種很虛浮、不留痕跡\n\n影像來來去去\n\n角色死死活活\n\n好像看了什麼\n\n卻什麼都沒看到的電影\n\n\
  作為一個極少數喜歡“瀑布”而且在電影院看過兩次的人\n\n“餘燼”我不會想要看第二次\n\n本片探討時間\n\n看完之後\n\n我覺得自己不只老了一百六十分鐘\n\
  \n或許餘燼終究無法成為星星之火\n\n引起大家對於土地歷史國族傷痕的反思熱潮\n\n而只能是既得利益的老人們茶餘飯後“想當年”的感慨\n\n正如白恐家屬的怒火\n\
  \n終究只能是雷聲大雨點小的空包彈\n\n這是溫柔\n\n還是悲哀？\n\n看完之後我也懶得想了\n\n因為當年的兇手不只逍遙法外\n\n還勾結更大更兇狠的兇手\n\
  \n準備把我們送上斷頭台\n\n而我們還沉浸在自我感動的和解共生中\n\n推嗎？\n\n當然推啊\n\n不能只有我陪金士傑坐牢快三小時\n\n你們通通給我來體驗一下全身被蟲咬的焦慮\n\
  \n已經宛如片中角色毫無血肉的空虛\n\n那是盧律銘溫柔配樂也撫平不了的傷痛\n\n影院指數：2/5\n\n#台灣\n#歷史\n#電影\n#鍾孟宏\n#新作\n\
  #餘燼\n#年度必看\n#不能只有我看到\n\n\n\n\n以上都是從臉書擷取下來的\n各位可以自行去找原文\n雖然評價看似不錯\n但是考量業內人士時常自我滿足\n\
  所以還是不能太過看好\n\n--"
