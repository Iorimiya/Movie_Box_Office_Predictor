url: https://www.ptt.cc/bbs/movie/M.1522089733.A.906.html
title: 'Re: [好雷] 《黑暗騎士》－小丑實驗後的謊言餘燼'
content: '其實我也想了很久，布魯斯究竟是想救瑞秋，還是想救哈維？


  最直接的想法，就是他被小丑的線索誤導，原本想救瑞秋卻跑到了哈維所在的地方。


  但是以布魯斯的思考，我相信他應該可以看透小丑的伎倆。所以當他踹開大門看見哈維的

  時候，並沒有太多驚訝的表情。




  （戴著面罩實在有點難辨識，有興趣的版友可以重看這個片段）


  也就是說，布魯斯在知情的情況下，選擇先拯救哈維的性命。


  為什麼這麼做？我想當他穿上蝙蝠裝的那一刻起，就決定要為了高譚市犧牲自己的一切，

  即使是最愛的女人。哈維丹特存活下來，對打擊高譚的犯罪無疑是很大的幫助。做為布魯

  斯韋恩，想必他會毫不猶豫的選擇瑞秋。然而一旦決定走上黑暗騎士的道路，便註定無法

  再當瑞秋的白馬王子。


  這是必要的犧牲，也是他必須承擔的痛苦。因為他知道，瑞秋也和他一樣，不希望小丑贏

  得最後的勝利。這是他們兩人的默契。即使瑞秋最終選擇的，仍不是他。


  “It''s not who I am underneath, but what I do that defines me.”


  --

  我沒忘記，同我的論述，布魯斯和蝙蝠俠必須做出不同的選擇

  後面指的是續集嗎？如果是的話，那就是沒料到哈維會墮落成為雙面人，犧牲了摯愛卻換

  不到高譚市的正義，會感到悔恨我覺得合理呀

  小丑說完地點後，蝙蝠俠馬上離開偵訊室，此時戈登問「你要去救誰？」在這個時候，如

  果還跟他爭執小丑情報的真假會延誤救援時間，所以直接照小丑給的資訊，要警察去「瑞

  秋」的所在地

  已回覆在上面

  哈囉哈維丹特是高譚難得一見的清流，可以說是讓這城市走向光明的希望，我覺得這理由

  對痛恨犯罪的布魯斯來說很充分了

  我覺得這就是我要討論的點呀。布魯斯韋恩會選擇瑞秋，但是蝙蝠俠只能選擇丹特

  真的，第一集比較正......

  回在上面了

  就說寫在上面了，不看留言嗎？

  發文就是爭取認同？表達自己想法不行？'
