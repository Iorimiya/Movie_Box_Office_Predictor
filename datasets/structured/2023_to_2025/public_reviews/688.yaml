url: https://www.ptt.cc/bbs/movie/M.1488355607.A.D54.html
title: '[ 好雷] 愛國者行動，悲慟餘燼中的愛'
content: '（以下有雷）







  身為真實事件改編電影的衷實愛好者，

  不得不說，

  愛國者行動比怒火地平線

  好，多，了，

  先講一下人物，

  麥特戴蒙，噢不對，是馬克華伯格，

  演技全方位，

  從變型金剛演到鑽油平台職員再到美國公務員，

  吐嘈一下，開場親老婆的場面跟怒火重複了，

  但是，

  馬克哥這次的主角威能強多了，情感也多了點層次。

  至於其他人物，值得稱讚的點是，

  這部電影中的人物都沒有打醬油，導演也沒有河蟹掉某些人，人物結局都有交待清楚。

  私心講一下水鎮警局阿伯局長，

  原本以為他是擺爛公務員，可是其實不然，

  他不搶功，處事態度冷靜，訓練有素（正直的阿伯果然是我的菜啊～～）

  美中不足之處在於，對政治人物的刻畫太過正向，正常的政客就先嘴別人再講，負責的少

  。


  劇情部份，

  鋪陳足夠，音效能夠製造緊張感，打鬥場面不多，但刺激感十足，不會讓人有感官疲勞的

  問題，中間穿差的感情線適度撫平觀影者的內心。還有一個值得讚許的是丟小槌子，不是

  笑話，可是在激烈的槍戰中，能夠娛樂大眾。

  另一點優點是劇情流程是


  情緒悲觀低潮>爆炸痛苦激進>回歸團結平靜


  不過，有一點小小可惜，整部電影對兩兇嫌背景的描述太過淺顯，犯案動機沒有著墨，略

  讓人失望。


  整體來說，我給這部片很高的評價，因為它讓人看完後還會思考。不會向前幾個禮拜我去

  看完格雷之後，走出來只覺得浪費錢。

  如果口袋有餘錢的話本週還想二刷這部，

  愛國者行動。






  --'
