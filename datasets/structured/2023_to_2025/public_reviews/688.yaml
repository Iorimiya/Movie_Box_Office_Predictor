url: https://www.ptt.cc/bbs/movie/M.1526016413.A.9CC.html
title: '[無雷] TIDF 飄散空中的餘燼、被遺忘的藍'
content: '飄散空中的餘燼

  孩童們於馬尼拉那最陰暗不堪一角結黨成派，做盡些不屬於他們年紀的事。


  2025年的時空背景，是對未來與現今相同處境的延續假想，藉以反思，年輕到老的生命歷

  程，讓觀眾從影片中尋求各自解讀下之意義。

  具空間感的長鏡頭、前衛的概念與敘事、導演獨特的美學參照，是一部讓奇幻影展相形之

  下成了小兒科的怪片，風格詭異到極點。

  裡頭素人小演員們黑話狂噴，直逼《無法無天》，話說如果奇幻選這片，可能會不小心被

  放到，非普通愛情單元XD


  值得一看的奇片，這種片果然還是只有影展看得到~


  －－－－－－－－－－－－－－－－－－－－

  被遺忘的藍

  鏡頭貼近捕捉在療養院裡戰後精神受創的老兵，紀錄著他們所有從話語間透露的感傷、無

  法自理生活的失落神情與被遺忘。


  為什麼我和我的腦袋無法相處、有著複視的疾病卻無法動刀治療，只能接受這樣的身體/

  自己，最終接受著在想要離去的地方歸去。

  時間能使世人淡忘，但無法撫平傷痕，歷史疤痕本不該被磨滅，但社會對於過去遠比你想

  像的還要健忘。導演自影片提出對國家歷史的自省與戰爭背後的反面觀點。影片裡老兵們

  與家人、彼此、導演的對話是對兩伊戰爭(聖戰)，最殘酷也最直接的透視。




  --

  佛系影展!!然後今天剛看完 不敢跟你講，只能說這紀錄片影展的質量真的高的太狂張!!'
