url: https://www.ptt.cc/bbs/movie/M.1731841452.A.14F.html
title: '[雷] 以類型片來說《餘燼》劇本必須要大改'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  多年前侯孝賢對鍾孟宏說要嘗試拍類型片

  鍾孟宏嘗試了

  但也拍砸了

  撇開意識形態、面對白色恐怖所抱持的態度等等

  單就以類型片來說

  《餘燼》的劇本也是有很多毛病

  下面來談談餘燼的劇本該怎麼改比較好

  沒什麼系統統整

  想到什麼就打字什麼


  1.人物太多、累贅冗員太多

  受害者有五對-王大鵬們的子女有四組+金士傑許瑋甯父女組

  實在是太多條線了

  劇情一下辦這邊

  沒收尾又辦另外一條

  抓王柏傑那條線又是一條

  所以看到張少懷出場時

  其實我已經記不清楚哪個人名對應誰了

  受害者的數量真的該減少

  或者敘事方式要改成持續發生的連續殺人案

  我是編劇會改成

  受害者直接就是王大鵬們

  這樣就至少少掉四個大鵬們的兒子角色

  本來莫子儀不去幹掉真正最惡的迫害者金士傑

  去挑王大鵬們就有點怪怪的

  他還不去殺王大鵬們而是他們的兒子

  這個細想就覺得超莫名其妙

  王大鵬們的兒子又沒有做錯事

  為什麼要為父親的罪惡買單??


  再來張震媽跟許瑋甯完全是冗員

  戲份全砍掉都不影響劇情結構

  劉冠廷+侯彥西的主角跟班設定應該要直接合一

  沒必要分兩個角色


  李銘忠的角色也不知道他在凶殺案中做了什麼

  為什麼不把他跟王柏傑的角色合一??


  2莫子凡年紀設定有問題

  他1956年應該是6-10歲

  我抓8歲好了

  2006年時就58歲了

  莫子儀演這個角色還是太年輕

  戲中張震飾演的警察年紀設定是40歲

  都可以當莫子凡的兒子了

  我看電影時一直想到年齡問題導致出戲

  莫子凡其實該由陳以文這個年紀的演員飾演才對

  或者年份不要設定在2006年

  目前也沒看到導演說設定在2006年有什麼含意

  我是編劇的話會把年份改成新公園改名成228和平紀念公園的1996年

  把王建民的畫面改成阿扁揭幕228紀念碑的新聞畫面

  這樣也呼應莫子凡在電影後段說的受害者們只得到一個紀念公園跟國定假日


  3.白色恐怖淪為背景板、角色存在沒有意義

  除了莫子儀、李銘忠跟被害者外

  其他角色都沒有呼應到白色恐怖

  甚至於凶殺案的執行者王柏傑也跟白恐沒有關係

  單純只是國家機器體制內的反社會者


  張震媽與其在戲中整天催婚張震

  倒不如改成張震爸還活著

  而他跟金士傑的差別是他雖在威權政府體制內

  但他是選擇不為惡的人


  劉冠廷飾演的小蔡在電影設定只是個火爆衝動正義感的警察

  我會改成認同轉型正義

  看不慣老舊國家機器沉窠的新世代警察


  照我這樣設定

  一個認同轉型正義的警察但是又要抓捕具有白色恐怖受難者背景的兇手

  戲劇衝突感就出來了

  張震的角色一邊面對曾經在體制雖然不作惡但也漠視惡行發生無能為力的父親

  一邊面對新世代的劉冠廷

  一邊面對延續自威權戒嚴時期仍居上位的長官

  他該怎麼破案?

  面對情有可原的兇手他又該怎麼做?

  這樣子設定

  白色恐怖在《餘燼》中就不會被批評只是單純的兇手背景板

  而是跟主角張震也關係密切


  4.鍾孟宏亂花錢

  聽聞本片成本破億

  但是片頭片尾就是兩個亂花錢的場景

  片頭去美國拍攝完全沒必要沒意義

  參考《刻在你心底的名字》去加拿大拍戲成本1400萬


  考量這幾年通膨以及去物價更高的美國

  莫子儀、李銘忠去美國拍的這一段成本至少1千萬


  片尾辦流水席請遊民這場戲

  之前在聽聞《餘燼》在河濱公園動員了超過1000位臨演

  是台灣影史之最時

  我還滿心期待是什麼大場面

  會不會是馬場町集體槍決政治犯之類的

  結果就只是辦桌

  我在電影院看到超級傻眼

  "就這樣???"

  這場流水席又是至少1000萬的成本


  去美國拍跟辦桌省下來

  就是省20%的成本了

  我要是管錢的監製我會要求鍾孟宏改掉

  根本對劇情沒意義嘛


  5.兇手群對主角的威脅感太低

  王柏傑是涼山特勤退役的

  張震竟然徒手搏鬥還能不輸他?

  劉冠廷重傷就只是背後被人推下樓

  莫子儀就是跟一下金士傑講講話

  一下跟張震講講話

  沒有看到他在運籌帷幄什麼鬼的

  李銘忠則是根本不知道他在幹嘛?

  這群兇手對主角的威壓感真的太低


  好的刑偵兇案類型片就必須兇手要強大威脅到主角

  通用設定就是槍枝火力強大、武力值高

  過程中主角有伙伴受害身亡

  主角家人被威脅

  受害者在警察保護底下依然被兇手探囊取物等等

  就是要有對抗的感覺

  《餘燼》這點沒做好

  根本就不是合格的類型片


  鍾孟宏應該要找誰是被害者、模仿犯之類的編劇

  來輔助他完成類型片文藝片的融合


  目前大概就是這些

  有想到再補充


  --'
