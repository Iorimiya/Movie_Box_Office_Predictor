url: https://www.ptt.cc/bbs/movie/M.1737507082.A.336.html
title: 'Re: [新聞] 比林昶佐電影誇張！《餘燼》拿5千萬補助'
content: '不是啊 那些罵補助的人不是都說不是不能補助，是要補助給有成績的人

  那鍾孟宏拿補助有什麼問題，就算不說瀑布，陽光普照絕對是近年品質前幾的國片吧

  還進了奧斯卡國際影片15強短名單，這已經很不簡單了

  有這種資歷他要拿到補助本來就會比較容易不是很合理嗎

  雖然餘燼拍出來結果是不如預期啦，我也覺得不好看

  但覺得只要拿了補助就一定要拍出賺錢的心態很奇怪吧，這種事情哪有人能預測到

  覺得補助政策合不合理要不要調整是一回事，但一部拍不好就說導演是來騙補助也太過份了

  吧


  --'
