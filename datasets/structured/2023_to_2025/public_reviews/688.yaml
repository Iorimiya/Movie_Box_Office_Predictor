url: https://www.ptt.cc/bbs/movie/M.1737454437.A.E1E.html
title: '[新聞] 比林昶佐電影誇張！《餘燼》拿5千萬補助'
content: '比林昶佐電影誇張！《餘燼》拿5千萬補助票房僅5百萬...只因綠友友



  黃楚甯

  2025年1月21日 週二 下午3:36



  文化部預算遭刪減與凍結，事件引發文化界廣泛關注。新黨北市議員侯漢廷昨（20）日指

  出，電影「餘燼」描寫白色恐怖，符合民進黨價值觀，獲政府5千多萬元補助，票房卻僅

  577萬元，而且製作公司董事林鴻鈞是綠營金主，侯諷「以文化之名，行納稅錢圖利綠友

  友、洗腦之實。」



  電影業者回應


  電影業者表示，該電影雖有點平淡，但刪文化部補助，確實無法幫助影視產業人員創作出

  更好的作品，反而可能會因為資金短缺，少掉更多發掘好作品的機會。現階段應該去思考

  如何去使用這筆預算，創作出更好的台灣影視作品，進而走向國際。


  侯漢廷昨日在臉書發文表示，相比林昶佐電影「衝組」拿1900萬元補助金、總票房卻只有

  244萬元，電影「餘燼」更誇張，獲得文化部補助3280萬元、文策院加碼用國發基金投資

  2000萬元，整部電影使用政府金流5280萬元，票房卻只有577萬元。


  他抨擊，「大賠錢！民脂民膏放水流！」或有人言，電影不能僅看票房，要看其「藝術」

  ，然而該電影劣評如潮，被影評人批得體無完膚。知名電影人許常德發文就直言「結構鬆

  、推動無力、少了新意」；文化人朱宥勳也說，這部片沒有「技藝」可言，唯一好消息是

  他看完了；網路上罵聲一片，縱使藝術是主觀，該片確實差強人意。


  侯漢廷指出，演員幾乎都是強棒、優秀的演員與演技，影評抨擊的都是腳本。他質疑，為

  什麼這樣的腳本能獲得政府5千多萬元補助，因為內容在描寫白色恐怖，符合民進黨價值

  觀，能夠傳遞國民黨壞壞，潛移默化幫民進黨拉票，當然應該補助。


  他表示，「餘燼」是由本地風光電影股份有限公司製作，該公司的董事之一林鴻鈞是玖億

  投資股份有限公司代表法人。


  侯漢廷進一步指出，林鴻鈞過去曾是靠著「591」網站起家的「數字科技」，曾經被潘孟

  安任立委時期起底攻擊，說他引進中資、後來投誠，先後靠著重要關係人捐給立委吳秉叡

  至少80萬元、蔡其昌至少40萬元的政治獻金，這些都在2020年立委選舉發生，儼然成為綠

  委政治獻金大戶，洗綠成功搖身一變成為綠營金主。


  他續指，發行商牽猴子公司創立者李烈，作品有具有「台灣價值」的「返校」、「還願」

  等；李烈曾被導演錢人豪抨擊，擔任北市府文化局補助電影評審委員是球員兼裁判。


  侯漢廷說，文化圈都知道，必須拍符合民進黨意旨、必須有綠友友當老闆才能拿補助，逼

  迫好演員、好劇團都只能服膺當道、搞政治片，失去創作自由，「我們無法改變民進黨以

  意識形態及圖利心態、而非以優秀與否決定補助，當前反而排擠真正有才能卻不容於當道

  的文化人。」


  他認為，刪補助、回歸市場機制，不被民進黨以納稅錢控制，才能真正讓文化人展現本領

  ，自由創作。以消費者、閱聽人為導向、真正讓人看了會開心感動，而不是被迫偷渡置入

  一堆政治的「怪片」。嚴格監督預算，不讓拿5千萬元補助、卻僅5百萬元票房的怪狀一再

  發生。





  電影餘燼拿了政府5280萬補助


  但票房只有577萬


  業者完全不覺得愧疚


  只認為補助不該刪


  政府應該要繼續發補助


  台灣電影才會發光發熱 走向國際





  --'
