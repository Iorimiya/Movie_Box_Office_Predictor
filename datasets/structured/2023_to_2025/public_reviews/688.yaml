title: '[討論] 從餘燼看台灣的動作片'
content: '前幾篇影評有說餘燼打得很爛

  是沒錯，的確打得很普通

  我想鍾導的片好像也好少動作

  頂多陽光普照阿和被毒販打流鼻血

  或是在牢房跟獄友打架

  但真正你死我活的對打還是第一次

  那篇影評還會跟周處做比較

  說周處打得比較好

  廢話，人家是動作片大國的香港導演

  我們台灣導演只會拍拿獎的劇情文藝片


  最近幾年感覺打得比較好的就是

  吳康仁演2018年演的冷門片狂徒

  看完以為是找韓國人來當武術指導

  因為從頭到尾都像在看韓國動作片

  沒想到是台灣的肆號工作室一戰成名

  因此拿了好幾座金馬獎最佳動作設計

  但好像也只有這部作品超棒

  之後的片就感覺還好了


  看餘燼張震跟王柏傑在地上用MMA在纏鬥

  周處的李李仁跟阮經天也用MMA在纏鬥

  現在MMA好像已經變成是武術界的主流

  但要拍得好看還真是不容易

  就算要越真實越好，但還是需要設計

  以前成龍那套京劇傳武式的套招不流行了

  但東尼嘉還是在拳霸裡保留下來發揚光大

  到印尼也開始在學東尼嘉那套在推廣印尼動作片


  像鄭人碩就說想像成龍那樣紅，再高都敢跳

  所以拍賠錢賀歲片寒單時就從二樓跳下來

  但也拍的不怎麼樣，一點都不驚險刺激

  等於白跳了，之後又在同學麥娜絲最後跳橋

  我去看台中豐樂公園那座橋大概有四層樓高

  但拍起來感覺只有二樓一樣的小橋

  也是完全沒有搏命演出的感覺

  建議他下次可以提議導演去碧潭拍跳橋

  這樣以後大家去碧潭玩就可以說

  鄭人碩曾經從碧潭吊橋跳下去過

  所以演員想當成龍接班人都很搏命

  但導演就沒法像成龍的片一樣拍得那麼好看


  連劉冠廷被推下樓也看得很明顯是動畫

  但還算像真的，像錢人豪的孔雀魚

  尹馨被藍瑋華推下去就真的超假

  想到最真的應該是終極警探1的大反派

  被男主角給丟下樓那真的有夠真的

  那還是好幾十年前的技術


  現在一堆動畫反而拍得很難看

  總之讓張震跟王柏傑打

  把王柏傑設計成涼山鬼退役

  跟刑警打還打輸的確不合理

  但可以設計成張震用八極拳打贏

  但打來打去還是用MMA在地上纏鬥

  建議下次張震還是請八極拳的人來當武指吧

  不然用自己不擅長的武術

  真的拍得有夠難看


  不是甚麼人都能善用MMA巴柔的技術

  像李李仁在周處就拍得蠻強的

  可以設定張震在國安局待過所以會八極

  所以國安局退役的刑警對涼山退役的法警

  也算合理，但願香港的高手都能來台幫忙

  台灣的動作片，以前龍門客棧也有香港的幫忙

  台灣早期的好小子就很是純正的台灣動作片


  像捧紅成龍的蛇行刁手跟醉拳雖然在台灣拍

  但也是袁和平他爸袁小田導的


  說角頭一定有動作，但找韓國人也未必好看

  像第一集就很難看，第二集顏導動作片出生

  所以他拍動作片超好看，真的是爽片

  配樂也配的很棒，還入圍金馬獎最佳電影歌曲

  但之後把顏導開除後換姜導那就變劇情文藝片了

  完全沒有顏導那種動作爽片的感覺


  所以我認為顏導應該轉武術指導

  才能超越肆號的洪導成為台灣第一武指

  不用老是模仿韓國人那種亂打一通的流氓拳

  韓片看多了也會看膩，看他們韓片也沒打多好


  好萊塢的話，尚氣打得的最好

  再來是玩命光頭6在地鐵韓哥跟黑人

  對亞洲黃種人的反派一打二那場很棒

  韓哥跟同伴被亞洲小鬍子反派打得很慘

  尚氣也是找香港成家班的老外來當武指

  所以應該都是成家班的人加盟漫威


  所以國片導演們要拍動作片

  還是多找好小子出生顏鄭正國導演來幫忙吧

  我看導的少年也，也是動作場面好過無聊的劇情

  要是能專注在動作爽片，應該會大賣才對

  但他劇情一大段鋪陳太久，動作才一點點

  美術也很差，當然賠錢賠到死

  但如果只專注做武指，相信就不用再花大錢請韓國人了


  --'
