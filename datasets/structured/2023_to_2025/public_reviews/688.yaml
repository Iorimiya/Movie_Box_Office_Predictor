url: https://www.ptt.cc/bbs/movie/M.1731690897.A.A45.html
title: '[大便片雷]餘燼 '
content: '沒想過有天會給鍾孟宏的片負雷

  從意外接觸的第四張畫開始

  除了被串流剪的亂七八糟的版本外

  一直到瀑布都還算喜歡

  沒錯 就連一點招牌血腥味也沒有的瀑布也還算喜歡

  不暴雷的幾句話評語就是

  星級名廚用盡高級食材(演員)熬煮卻用屎曬乾 磨成粉 加入調味

  導致整盅都飄著屎味的佛跳牆


  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  主劇情大概就是看似無關的個別犯罪 逐漸拼湊出犯罪計畫的類推理片

  但犯了推理片的禁忌之一 鼻屎大的殺機 汪洋般的殺意

  把折磨人的罪魁禍首 特務高層軟禁

  不去找折磨拷問人的審訊人員

  為了活命 交出成員名單的讀書會其他成員卻要被一個個找出來復仇?

  去把慈湖給炸了都比較像找對復仇對象



  另外

  整部片最令人不舒服的就是時不時跳出的228受害劇情

  就像關不掉的彈出式廣告那樣噁心

  每隔五到十多分鐘 扁平的228劇情就會跳出來一次

  像被規定這部片要出現幾次 總長度至少要幾分鐘似的

  如果這是片商/贊助的要求 真的會讓人噁心到不行

  尤其片尾的那些檔案還被封存在不知名的某處類的鬼話

  歷經了三次非國民黨執政 成立了轉型委員會 228相關部會

  當事人還能神通廣大到完全找不到?

  退一萬步講 太陽花的打人警察才隔幾年

  他是被車撞死了?也沒看到找出來懲處啊

  太陽花還是民進黨力挺/深度參與的運動欸

  沒膽子像德國一樣把老納粹送上法庭審判

  就少整天拿這些事情當提款機

  都2024了還要拿文化部的補助金噁心觀眾快三小時



  以上大概是鐘導被逼著拍這些劇情 或為了票房考量硬是塞進劇情的評價

  畢竟整部片拿掉228 換個好一點的復仇動機 整部片還是可以成立

  壞警察 慈善家Boss 逐漸串連的兇殺案 這些元素就足夠拍一部電影了


  但如果鐘導勇敢到用扁平 破碎的方式

  來諷刺當局對228總是不忘提起 卻又永遠草草處理

  評價倒是能翻轉不少 可惜劇情的細節找不太到這種暗示

  這種只能做不能說的事情也不可能公開講

  餘燼注定成為鐘導的黑歷史

  像昆汀編劇的惡夜追殺令一樣 只有風格 沒有靈魂


  --'
