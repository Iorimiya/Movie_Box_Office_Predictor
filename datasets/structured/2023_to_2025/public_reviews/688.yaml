url: https://www.ptt.cc/bbs/movie/M.1608912920.A.EC2.html
title: '[好雷]靈魂急轉彎:燃燒生命的餘燼，正是人生意義'
content: '圖文網誌:


  影評網址:


  【SOUL】：燃燒生命的餘燼，正是人生的意義


  上映日期：2020/12/25　　　　　　導演：Pete Docter


  觀看日期：2020/12/25


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  　　今年聖誕節很幸運的有休假，閒來無事就隨便挑了【靈魂急轉彎】這部動畫片來看，


  由於是臨時起意的，所以我簡介、預告都沒看，就直接進電影院看電影了。看完感想：這


  未免太好看了吧！！！看到哭泣，哭到斷氣啊！！



  　　【靈魂急轉彎】的主角Joe，是個懷才不遇的音樂家，當他終於有機會飛黃騰達時，


  卻出了一場意外，讓自己的靈魂來到了彼世，並被送到鬼門關的面前。準備投胎的主角，


  不甘自己即將起飛的人生就這樣結束，毅然決然地展開奮死一搏，並設法回到自己人間的


  肉體，好完成自己的使命，一場穿梭於人間與彼世的大冒險就這樣開始了。



  　　【靈魂急轉彎】的前半段，就是Joe在彼世亂闖的故事，彼世說穿了，其實就是靈魂


  的世界，而電影的前半段，就是藉由主角的觀點，帶我們了解靈魂世界的設定與架構；這


  裡的靈魂，又分為嬰兒的靈魂、迷失的靈魂、以及死後的靈魂，一個人的靈魂如何投胎轉


  世？為什麼靈魂會出竅？進入忘我境界究竟是怎麼回事？這些問題在電影中都有合理的解


  釋，故事在建構的這個世界觀，除了很有創意之外，還非常有說服力。



  　　 【靈魂急轉彎】的後半段，則是Joe回到人類世界，並設法抓住那個飛黃騰達機會的


  故事。在前半段的故事裡，Joe跟一個靈魂，22，成為了朋友，當Joe回到人間時，22也跟


  著主角一起來到人間，但因為一場陰錯陽差的意外，導致主角必須要靠著22的協助，才能


  達到自己的目的。



  　　【靈魂急轉彎】有兩位主角，Joe與22，兩個靈魂的互動，就是本片最漂亮的地方，


  當他們兩位在電影後半段展開人間的冒險故事時，就是好看、有梗、有趣。當Joe試著完


  成自己人生的意義時，從沒來過人間的22也同時藉由這次的冒險，來尋找自己人生的意義


  。當這兩個靈魂在人間冒險的同時，其實也在醞釀電影最後的收尾，而電影的收尾，我只


  能用三個字來形容，超、級、棒！！



  　　【靈魂急轉彎】的收尾，真的是超棒，這段故事不論是敘事方式、畫面呈現、還是故


  事的寓意，在我看來，真的是完美，無可挑剔；而本片收尾最厲害的地方，就在於電影並


  沒有故意塞一個要你哭的橋段，電影並沒有刻意去說教，而是藉由細膩的畫面與超棒的配


  樂，來傳達電影想表達的寓意，本片的收尾真的完全直擊我的心靈深處，我看到後面真的


  是淚流滿面，我自己走出戲院時也不敢相信自己會哭成那樣，那真的是一種只能意會，不


  能言傳的感動。



  　　最後，讓我聊聊【靈魂急轉彎】的心得吧，在漫長的人生裡，我們時不時都會詢問自


  己一個問題，人生究竟有什麼意義？可惜的是，每個人的人生，都是從零開始的，所以你


  越是努力想尋找人生的意義，會發現其實打從一開始，人生就沒什麼意義。難道我們這一


  生就這樣了，我們只能坐著等死嗎？？？也不盡然，在人生的道路上，如果你有認真地活


  著，認真打拼、認真享受人生，這些感覺、情緒與回憶，就會沉澱在你的靈魂深處，當你


  開始回顧過往的人生時，這些積年累月堆疊出來的東西，正是我們不斷在尋找的東西。說


  來好笑，人生的意義，並不是一個你特地去創造就能擁有的東西，相反地，人生的意義，


  是一個殘留下來的東西。人生不如意十之八九，我們能從不如意之中，留下什麼東西，才


  是重點，人生的意義並不是建立在勝利或成功之上，而是建立在享受之上。所以，好好活


  在當下，享受人生吧！



  　　總結【靈魂急轉彎】，畫面細膩精緻，世界觀的設定有趣，配樂好聽，兩位主角的互


  動精彩，冒險的過程也好笑，而本片所傳達的寓意，更是深深重擊了我的心靈。本片真的


  是一部我想不到缺點的超優質電影。




  【靈魂急轉彎】：大力推薦，值得一看再看的超優質電影。


  我就是喜歡這種尋找人生意義的電影，所以特別有共鳴啊！！






  後記：


  1. 原本以為2020年的電影就這樣了，殊不知竟然在年末來了一部如此好看的電影。


  2.我敢說這種感動絕對吃一定的電波，可能不是每個人都能跟我一樣感動，但我是真的是


  徹徹底底地被感動到了。


  3.這次的開場短片，就是既可愛又溫馨！


  4.紐約尼克是爛到連電影都要吐槽了嗎....


  --'
