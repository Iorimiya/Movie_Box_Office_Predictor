url: https://www.ptt.cc/bbs/movie/M.1522133500.A.A06.html
title: 'Re: [好雷] 《黑暗騎士》－小丑實驗後的謊言餘燼'
content: '來假設幾種可能，當時情況是哈維跟瑞秋二選一


  小丑說了兩個地點，如果......


  （1）蝙蝠俠相信→想救哈維→結果跑瑞秋線（矛盾不通，想救哈維就該跑哈維線


  （2）蝙蝠俠相信→想救瑞秋→結果跑瑞秋線（結果被騙，小丑玩弄人心


  （3）蝙蝠俠不相信→想救哈維→反其道而行跑瑞秋線（這是原ＰＯ的看法


  （4）蝙蝠俠不相信→想救瑞秋→反其道而行跑哈維線（神通廣大腹黑版本


  從劇情上來講，1跟4可以先排除了


  所以就只剩下2.3來討論



  2是多數人的看法，這邊就不多說了


  來說3，在蝙蝠俠不相信的情況下，跑瑞秋線的效果是什麼？



  小丑計畫失敗，說謊沒騙到蝙蝠俠


  而蝙蝠俠面臨二選一，馬上展現高貴的黑暗騎士心態


  在這一刻就已經為高譚市犧牲心中最愛的人了


  但這樣的劇情效果好嗎



  所以面臨二選一時，想救哈維是不太合理的。


  你要說布魯斯會選瑞秋，蝙蝠俠會選哈維，嗯


  這個說法很不錯。



  但從前面蝙蝠俠選擇跳下樓救瑞秋，而不是抓小丑


  以及小丑在訊問室那段話



  還有從小丑一路以來一直在玩弄蝙蝠俠的情境


  這裡蝙蝠俠如果忽然變得神通廣大起來，想救哈維就救到哈維


  那樣小丑也未免太掉格了吧


  --'
