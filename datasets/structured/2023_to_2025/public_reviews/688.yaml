title: 'Fw: [情報] DOC NIGHT 本周五9/11《燃煤的餘燼》'
content: "作者: fansss (新天堂樂園) 看板: documentary\n標題: [情報] DOC NIGHT 本周五9/11《燃煤的餘燼》\n\
  時間: Wed Sep  9 21:45:48 2015\n\n【關於紀錄片的每週五】\nTIDF DOC NIGHT 本週（9/11）播放《燃煤的餘燼》\n\n\
  9.11 (FRI) 19:00 國家電影中心\n燃煤的餘燼 Glowing Embers\n\n瑪麗．希梅內茲 Mary JIMENEZ、班內荻克特．里耶娜德\
  \ Benedicte LIENARD\n比利時 Belgium、祕魯 Peru ｜ 2013 ｜ DCP ｜ Colour ｜ 85 min\n2014 TIDF國際競賽優等獎\n\
  2014 赫爾辛基紀錄片影展\n\n在祕魯雨林河岸邊，住著一戶以燒煤維生的人家，一家三代皆以手工方式與大量勞動\n為生活拼搏。某天，在燒煤的過程中，奶奶不幸灼傷了自己的腳，決定要離開這裡，\n\
  到他方度過餘生，家中慣常的生活因而起了變化；而煤炭價格一日不如一日，生活壓\n力日漸沉重，面對奶奶的別離與無奈現實，這個家該如何走下去？\n\n瑪麗．希梅內茲、班內荻克特．里耶娜德：「南茜不會算數，只要賣了煤炭賺到錢，\n\
  就會趕緊到市集去買食物。但不知算計也無法擁有多餘收入的她，又能攢下多少？我\n們給了她鉛筆、計算機和筆記本，每天晚上都會出數學題目讓她練習算數。我們唯一\n一次看到她落淚，是當她明白自己什麼也沒賺到的時候。」\n\
  \n\n【入場方式】\n國家電影中心季會員、半年及全年會員免費（加入國影會員）；非會員每場酌收\n新台幣100元清潔費（僅限放映場次，不適用圖書館、視聽室等資源）\n\
  \n開演前15分鐘先行開放會員入場，10分鐘前開放非會員入場，座位有限，額滿為\n止，敬請提早排隊入座。放映20分鐘後，不再開放觀眾入場。\n\n\n\n【放映場地】\n\
  國家電影中心放映室（40席），台北市青島東路7號4樓，近捷運板南線善導寺站2號出口。\n\n\n\n【洽詢資訊】\nW: \nE: tidf@mail.tfi.org.tw\n\
  FB: TIDF.info\nT: 02-2395-6556\n\n\n\n【九月份放映場次公告】\n放映時間                片名      \
