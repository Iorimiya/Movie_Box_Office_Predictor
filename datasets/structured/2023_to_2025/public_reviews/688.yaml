content: '《餘燼》前導預告公開 —— 11 月 15 日磅礴上映


  m陽光普照》、《瀑布》金獎導演鍾孟宏新作

  雙影帝張震 × 莫子儀首度同台飆戲


  市場裡的一起凶殺案劃破了寧靜，接二連三的刑事案件背後有著不為人知的關聯。警官張振澤（張震 飾演）與搭擋小蔡找尋線索時與一名陌生男子莫子凡（莫子儀飾演）相遇。歷史的舊帳，像是歲月的餘燼。


  表面靜好的歲月，背後有多少遺忘與秘密？


