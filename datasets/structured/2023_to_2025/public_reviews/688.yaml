url: https://www.ptt.cc/bbs/movie/M.1732969810.A.5E4.html
title: '[負雷] 餘燼 '
content: '雷文防雷資訊頁


















  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  滿可惜的

  做為中島哥的小粉絲

  停車、一路順風、陽光普照、瀑布一路看下來

  最新作品餘燼，中島哥史上預算最高、片長最長的電影

  繳出來的成績真的是不太理想


  不過他很大膽的用加害者的角度去看待白色恐怖

  這在台灣是一個創舉


  中島哥想創造一個互相理解的高度

  加害者與被害者在電影最後達到那感人的高潮

  但完全失敗了


  金士傑，明明應該是台灣演員中最適合這個角色演員

  該說老了嗎還是...沒有演出那個感覺

  演得好表面，流裡流氣，不像特務也沒有省思的感覺

  當然這應該是中島的鍋拉


  莫子儀演得有好一點，但也沒有演到那個高度


  演得最好的就是張震，他在電腦看到爸爸新聞的那個眼神，還勝過他在緝魂的演出

  跟小蔡的兄弟情，還有跟鮑起靜與許瑋甯的對手戲都演得非常好

  沒拿影帝真的是很可惜，當然我沒看漂亮朋友無法比較他跟張志勇


  最後金士傑跟小孩的那段和解戲真的是看得有夠無言

  太刻意塑造那個情境，反而是扣分


  白色恐怖做為台灣現代史最大的傷痕，不該被這麼膚淺地對待

  中島這次嘗試夠大膽，但也真的失敗了

  金馬獎不給最佳長片與最佳導演入圍是非常正確的



  --'
