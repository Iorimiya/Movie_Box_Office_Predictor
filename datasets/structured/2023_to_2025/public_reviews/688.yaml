title: '[普雷]被預告爆雷的回憶的餘燼 '
content: '沒看過原著。覺得電影普通


  先吐槽中文預告竟然爆雷!


  中文預告把男主角起初隱瞞的事情講出來了! (寫惡毒信)

  他一開始只說自己給已經交往的前女友/好友寄了"沒事"的明信片

  敘事後段才承認其實寫的是惡毒的詛咒信


  其實應該是峰迴路轉，給男主自認平凡穩定人生一記重擊的故事

  但轉折都軟綿綿的...


  衝著有Charlotte Rampling和Joe Alwyn("比利林恩的中場戰事"男主)看的

  但Joe Alwyn出場很少...Charlotte Rampling也不多，但她氣場好強!

  冷冷的眼神令人記憶深刻


  電影最後男主被治癒了。因為他改進了不重視身邊人的自己

  但我想問記憶的不可靠性和這缺點有什麼關係欸???

  還有孫子出生的新氣象

  是不是跟小說差很多啊? 調性有點不統合阿


  只推薦給Charlotte Rampling的粉絲







  --'
