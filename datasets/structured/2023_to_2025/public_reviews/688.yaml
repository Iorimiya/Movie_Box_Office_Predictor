url: https://www.ptt.cc/bbs/movie/M.1731852324.A.679.html
title: '[ 雷] 餘燼:創意的新瓶，可惜裝的仍是陳腐的舊酒'
content: "雷\n文\n防\n雷\n頁\n\n\n============================\n\n《餘燼》：創意的新瓶，可惜裝的仍是陳腐的舊酒\n\
  網頁版：\n\n\n看完《餘燼》心情實在複雜。確實被一些片段觸動，幾乎在淚腺潰堤的邊緣，比如母子領\n屍的段落、結尾小男孩上門對話的部分；但也極不喜歡電影所傳達的對於台灣白色恐佈的\n\
  認知。\n\n\n我並不是認為，不能以警匪懸疑片或復仇故事來講台灣白色恐怖，對於讓遺族以非法私刑\n報家仇，乃至於走向極端與悲劇，我也不覺得是什麼邪惡的編排，或是對於歷史事件的廉\n\
  價消費，我甚至認為這是對於相關題材，本應值得期待的大膽嘗試。雖然警察辦案的這條\n劇情線很「鍾孟宏」，可能不是每個人都會喜歡，但起碼我自己還看得津津有味。只是，\n\
  電影對於白色恐怖的受難者和告密者的刻板呈現，卻令我感到厭倦與疑惑。\n\n\n電影裡，作為家屬被牽連的「石頭仔」一人除外，受難者清一色仍是知識階層：醫師、教\n\
  師、藥劑師，且參加的又是讀書會，這種大眾既定想像裡的白色恐怖被鎮壓的結社型態。\n對於檔案已大量公開，相關研究、書籍如雨後春筍的現今，要用戲劇呈現一個能代表1950\n\
  年代政治案件的典型，仍無法突破這樣的窠臼印象，沒能展現，那個士、農、工、商，甚\n至軍、警、流氓皆有人蒙難的時代，更多元的政治犯樣態，實在是件可惜的事。\n\n\
  \n而比較受不了的，還有電影透過老特務的嘴，將白色恐怖的獵捕對象，輕率、簡單的劃分\n成兩種：無辜、純然讀書的理想主義者，與確實想在地方發展組織，以顛覆國家的「真共\n\
  諜」。完全不考慮，在真實的歷史中，許多所謂的理想主義者，正是想要達成他的理想社\n會，而確實參與顛覆國家的謀劃與行動。因而，電影也就沒能夠更進一步去探究，在那個\n\
  吏治不彰、憲法與民主被凍結擱置、時有壓迫、人民生活負擔沉重的年代，顛覆那樣失能\n的統治政權與「不法國家」的正當性。\n\n\n另一個讓人納悶的地方，是電影粗暴的將「自新者」等同於「抓耙子」，而沒有去理解，\n\
  白色恐怖年代被情治機構運用、提供情報的人，也有各種類型：有因為各種不同個人原因\n、利益糾葛與恩怨而檢舉他人的；也有原本就是情治機構佈建來監控、蒐集事證，甚至誘\n\
  人入罪者；當然也有許多是如同電影中的「自新者」。\n\n\n歷史上這些「自新者」，從被偵辦的「案嫌」轉為協助當局辦案的人，很多時候並不是他\n們品行低劣，而純粹是因為，有限的人性經不起審訊者的操弄、挑撥。如果考慮到這點，\n\
  對於劇情安排上，復仇者嚴苛殘忍的針對也算曾受難於白色恐怖的「自新者」，卻對於玩\n弄脆弱人性的特務本身寬容、嘗試溝通理解，如此失衡的尋仇行徑，就更令人無法接受。\n\
  \n\n最後，聽著旋律優美的電影片尾曲〈北方來的人〉，不免更加迷惘。如果說，片尾曲在一\n部講述歷史悲劇的電影，是具有安魂的作用，那全曲詠唱著「北方來了一群人」、他們「\n\
  揮別了母親家園」、「揮別了山河朋友」、「滿身疲憊」、「滿身驚慌」，不確定「這裡\n是否是應許之地」，除了試圖讓觀眾同理當年南下流亡的軍民，甚至是「國家」的苦難外\n\
  \ — — 我以為這樣的敘事，在1949年以來，既有的歷史陳述中並不缺乏 — — 恐怕一點\n也沒能安撫，電影重點刻畫的，那些只能「在歷史門外徘徊」、「想知道真相，卻始終不\n\
  得其門而入」，真正的悲傷靈魂。\n\n\n\n--"
