title: '[好雷] ‘’餘燼”無雷心得'
content: "一開始真的被很多負評嚇到，也做了一些心理建設將期待降低，但在觀影期間就覺得\n，這就是很鐘孟宏的電影，不論攝影或者電影的節奏，都是我很喜歡的。‘’餘燼‘’比\n\
  起‘’瀑布‘’我看的更懂一點，喜好程度應該是陽光普照>餘燼>瀑布，其實挺佩服他敢\n觸碰這個議題的，對於白色恐怖議題觸碰的敏感度，‘’餘燼”不像是‘’流麻溝十五號\n\
  ‘’的渲染煽情，也不像‘‘返校’’那樣淺淺帶過，而是直指白色恐怖事件核心，凡事\n牽涉到立場問題就難免會有爭議，所以評價被罵也是很合理，觀影前看到一篇新聞寫到，\n\
  鍾孟宏說‘’餘燼”目標從不在和解，而是應該揭露真相，透過最後一場戲也能理解到導\n演的溫柔。\n    或許是鐘孟宏宇宙的關係，片中熟悉的演員很多，含金量也很誇張，台灣電影界最To\n\
  p的幾個男演員都在這部電影裡了，怎麼可能不好看，光看演員就值得入場了，其中我對\n金士傑是比較陌生的，他的演技也是讓我最震撼的。但因為支線較多片長較長所以可能會\n\
  感覺劇情有點鬆散，但不至於讓人坐立難安，而且雖然不多但裡面有幾個笑點我都有get\n到，笑得挺開心的。\n    電影的年代選得很好，2006年是我生活成長的年代，新聞跟社會事件都讓人記憶猶新\n\
  ，卻又不得不承認距離2024年的現在已經改變了很多事情跟觀點，所以能用更客觀的角度\n來解讀當年的歷史事件，這是一部比起‘’國有器官‘’更貼近台灣的故事，也很謝謝鐘\n\
  導拍了這樣一部電影。\n\n--\n是的 尤其2024的現在界線又更加模糊了 但還是有很多立場無法客觀的人就是了"
