title: '[選片] 餘燼 or 神鬼戰士2'
content: '我看板上討論餘燼的戾氣很重

  我的問題是 從電影角度來說

  他是很拖 演技表現很差 還是

  有很多電影表現的硬傷?

  因為我個人沒太明確的政治偏向

  我覺得我應該無論他怎麼拍都能接受

  但根本上邏輯爆炸 或是很節奏很慢 那就不會是選擇之一



  神鬼戰士2看到一個有趣的評論

  好像是說有場面 但不精采的樣子

  所以如果想看無腦好萊鎢商業片還是比較推神鬼嘍?



  純粹覺得最近餘燼新聞很多

  台灣人可以看一下

  不過沒這麼多錢也沒這麼多時間

  假設要2選1的狀況下 選誰好?


  --







  --

  還有人說沒打戲 我想說 怎麼會有這麼奇怪的片子

  有場面 不打架

  那應該要文戲比較多 但又說沒劇情??

  這麼慘 這檔期直接省電影票嗎?'
