title: '[討論] 餘燼正式預告，11月15日上映'
content: '導　演｜

  鍾孟宏


  演　員｜

  張　震、莫子儀、許瑋甯、金士傑

  劉冠廷、鮑起靜、陳以文

  王柏傑、李銘忠、馬志翔

  侯彥西、黃瀞怡


  角逐第61屆金馬獎

  最佳男主角、最佳男配角、最佳美術設計、最佳造型設計、最佳原創電影歌曲


  161分


  劇情簡介:

  2006年，當全台灣的人都專注於王建民的比賽，市場裡一場凶殺案劃破了寧靜。一名許姓

  女子前來報案，她宣稱自己的父親已經失蹤了半年，而父親與市場死者的父親是好友。負

  責此案的警官張振澤（張震飾演）從同期警官那裡，得知另一場謀殺案的死者父親，與市

  場殺人案也有著不明的關聯。


  張振澤與搭檔小蔡在諸多謎團中找尋線索，張振澤查到一樁1958年的共諜案，推測這些受

  害者的父親，很可能都與當年的讀書會有關。另一方面，一位食品工廠的老闆莫子凡（莫

  子儀飾演）為了喚醒過往與父親的回憶，也獨自展開調查。在記憶與遺忘間，真相慢慢浮

  現。張振澤和莫子凡在歷史夾縫中，一腳踏著過去的影子，一腳踏向未知的未來。兩個執

  著於真相的人，以各自的方式，撕開台灣歷史的疤痕。




  鍾孟宏第七部長片，創下最高預算

  大家一定要看啊!!!

  我也迫不及待了，中島的電影部部佳作，品質穩定

  期待票房破5000萬


  --'
