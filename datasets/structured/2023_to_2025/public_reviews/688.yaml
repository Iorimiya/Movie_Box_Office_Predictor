url: https://www.ptt.cc/bbs/movie/M.1726327608.A.DA3.html
title: '[新聞] 《餘燼》卡司強 張震莫子儀首度軋戲'
content: "《餘燼》卡司強 張震莫子儀首度軋戲\n\n04:10 2024/09/14 中國時報 孫伊萱\n\n\n張震（左）時隔16年和鍾孟宏導演合作，在《餘燼》中飾演警官。（本地風光提供）\n\
  \n金馬獎最佳導演鍾孟宏繼《陽光普照》、《瀑布》後，新片《餘燼》13日發布超前導海報\n公布主演名單，包含張震、莫子儀、許瑋甯、金士傑、劉冠廷、鮑起靜、陳以文、王柏傑\n\
  、李銘忠等，眾星雲集。\n\n曾在2008年電影《停車》合作的鍾孟宏導演與張震，時隔16年再度合作，昨日發布的前導\n預告中，飾演警察的張震，以一顆大特寫鏡頭作為預告開端，清楚可見他眉間的細微抽動\n\
  ，卻猜不透他的情緒變化吊足胃口。\n\n首次與鍾孟宏導演合作的莫子儀，預告中一句「王大鵬是誰？」滿是懸念，面對老戲骨金\n士傑的崩潰拍窗，莫子儀的沉穩冷靜，讓人揣測他們的角色關係。\n\
  \n該片將於11月15日在台上映，張震、莫子儀雙影帝首度同台飆戲成為最大看點，導演鍾孟\n宏坦言，真的沒想到能遇到與角色設定如此契合的演員：「莫子儀是個非常溫柔且內心堅\n\
  定的人，我當初寫這個角色的時候都沒有想到別人，其實劇本最初就是以張震和莫子儀的\n角色為發展。」\n\n#餘燼 #角色 #合作 #金士傑 #張震\n\n\n--\n\
  \n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
