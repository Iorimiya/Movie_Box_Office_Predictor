  ・電影開演20分鐘後謝絕入場，本特映會如遇天災等不可抗力因素而取消，恕不補辦ꀊ・本公司於現場保留謝絕非邀請對象入場之權利

  ・票券尚未劃位，請於開演前60分鐘自行劃位

  ・不接受現場臨時索票，也請勿在未經本公司同意下轉貼或轉寄本特映資訊

  ・本特映會嚴禁兜售、販賣、複製等圖利行為，如經查獲依法究辦


