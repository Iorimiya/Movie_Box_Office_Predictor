  就隨便給你五千萬嗎？\n還不用還錢耶！\n\n拿錢不用還\n你那麼善良的話\n我現在就跟你借五十萬。\n麻煩明天匯款給我，謝謝。\n\n\n記住，政府不是慈善單位\n\
  更不是什麼藝術資助家\n而是平均照顧每一個國民，才是基本義務\n\n為何獨給一些聽話的導演錢？\n\n\n你那麼支持國片的話\n麻煩你多看個幾萬次\n每小時都來包場\n\
  也許票房就拉回來了\n這才是行動支持國片吧？\n\n但抱歉\n我們一般人根本不想看『爛片』\n\n\n電影拿到錢\n結果不符合比例原則\n拿錢的方式幾乎到了毫無審查的地步\n\
  \n官員失職\n那些導演更是可惡\n這才是讓大家討厭的地方。\n\n----\nSent from \n\n--\n官員失職\n那些導演更是可惡\n這才是讓大家討厭的地方。\n\
  \n----\nSent from \n\n--\n你賺不回來嗎？"
