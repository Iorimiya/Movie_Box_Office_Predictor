url: https://www.ptt.cc/bbs/movie/M.1731417539.A.956.html
title: '[好雷] 餘燼'
content: '防雷




  首先，一開始這部片吸引我的地方在於演員陣容（張震、莫子儀、劉冠廷），跟鍾孟宏導

  演。


  光是看到這樣的黃金陣容，怎麼樣也值得一看

  帶著期待看大家飆演技的心情去觀賞

  劇情中刺激滿分！

  演員的演技滿分！

  導演的敘述鏡頭滿分！

  但沒有想到的是

  劇情後面衍伸出的反思是出乎我自己意料之外

  （昨天看完沈浸在劇情裡面好久好久）



  原本一樁市場兇殺案隨著更深一步的追查

  在更多證據更多人牽涉進來時

  浮現的卻是背後不為人知的過去及傷痛。



  查案的過程中不冷場

  每個角色都有他獨特的魅力

  每個角色代表的一個故事環環相扣


  就像看到中間非常想知道誰是王大鵬！！！

  最後答案揭曉後的那種無力跟無奈感

  也是在觀影的時候深深感受到


  隨著劇情的推進跟著小莫提起的故事

  帶著觀眾一同回到那動盪不安黑白的年代。


  看完這部片，接收到的訊息量很多

  會不禁讓人思考什麼是正義？

  也許到最後張警官也是因為這樣而選擇辭職吧


  在不同的年代不同的被害者及加害者

  要如何去面對所做過的事情及要承受的痛苦？



  在電影的最後市場的兇殺案抓到了兇手

  難道所謂的正義就伸張了嗎？

  （是誰的正義被伸張了呢？）


  而在歷史的那次大迫害當中

  受害者遺族申討的正義

  卻石沈大海真相不了了之？


  看完這部片高潮迭起無冷場

  鍾導傳達出來的故事及情緒太龐大

  甚至能夠感同身受。



  雖然整體電影不是歡樂系列的走向

  但劇情當中穿插的笑點

  讓整廳的觀眾笑的蠻開心的

  要說這部電影沈重也不算就像一般的推理懸疑片

  主要是看完之後的反思會讓人久久不能自拔。


  來說說我最喜歡的片段


  （歡樂篇）

  小蔡拿著犯人畫像被張警官唸了一頓

  還有巫建和在小蔡病房外面

  說出為什麼會有那張素描的由來

  以及最後在副局長室小蔡看到素描掛在牆上

  的那一段逗得觀眾哄堂大笑


  （震撼催淚篇）也是我整部片最揪心的片段


  在電影的最後

  許士節的門鈴響起打開門居然是片頭的小莫

  小莫一字一句天真的問話讓我想起片頭的那一段

  小莫問的問題是他終其一生都在追求的真相

  （鞋子為什麼不見了，爸爸為什麼不見了）

  而這個真相不管是在過去抑或是現在都沒有答案


  鏡頭一轉許士節的眼淚流了下來。

  看著小莫慢慢的走下樓梯

  看到這裡眼淚就跟著一直掉

  也聽到其他觀眾的隱隱約約的啜泣聲

  這是整部電影裡感受最深的片段。



  整部片誰對誰錯，無法交代

  取而代之的是無限的思考及反問

  （昨天看完後回家一直沈浸在裡面）


  歷史的傷痛永遠都在，

  不論時間怎麼經過

  都是道難以磨平的傷口。


  要如何去面對甚至是否要去原諒

  都留給觀眾慢慢的去思考。



  這次非常幸運能參加特映會提前觀賞這部電影。


  看完沈澱了一天

  把自己的感受轉成文字後寫出來分享

  也許每個人對於電影角色的看法不同


  不過對我來說這部好電影值得大家去看！


  （手機排版文章比較不好閱讀請見諒）





  --'
