title: '[情報] 《鬼聲泣3》泰國上映僅2天票房破億'
content: '【鬼聲泣系列】的第3部《鬼聲泣3》前天（10/1）在泰國上映首日，票房突破6000萬泰銖

  （折合新台幣約5600萬），成為今年泰國當地首日開票第二高紀錄！



  今年第一名則是由首日7000萬泰銖票房的《鬼滅之刃劇場版：無限城篇》拿下，不過仍不

  敵去年《鬼聲泣2》上映首日的8000萬泰銖（折合新台幣約7500萬），一舉打破泰國影史

  首日最高票房及最高預售票雙冠紀錄！



  昨天（10/2）是《鬼聲泣3》上映的第二天，票房便已突破1億泰銖，接下來將碰上週末假

  日，預估票房累積會更加迅速！



  而先前已在台灣上映過的【鬼聲泣系列】前兩部，也皆為去年台灣最高票房的泰國電影，

  台灣方面也將於10/31迎戰泰國最兇猛鬼片《鬼聲泣3》 ！








  《鬼聲泣3》泰國上映首日（10/1）票房衝破6000萬泰銖




  《鬼聲泣3》泰國上映第二天（10/2）票房已突破1億泰銖




  【鬼聲泣系列】三部泰國票房破億花費時間




  《鬼聲泣3》幕後工作照




  《鬼聲泣3》幕後工作照




  《鬼聲泣3》幕後工作照


  --

  第三集又回來了

  這部真的是顏值擔當

  第三集換導演，目前聽說整個風格會完全不同

  我喜歡第一集真實事件改編，第二集開始就是用編的了，第三集更是換導演了XD

  其實第二集就完美收尾了 但有錢就是任性XD

  我也好想她！'
