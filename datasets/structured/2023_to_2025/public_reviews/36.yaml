url: https://www.ptt.cc/bbs/movie/M.1741005669.A.7BB.html
title: '[討論] 《鬼聲泣3》今天舉行開鏡儀式'
content: '鬼聲泣是泰國疫後票房冠軍


  上映第1天曾在泰創下8000萬票房泰銖（約7700萬新台幣）


  最終第2部票房來到8.6億泰銖（約8.28億新台幣）


  成為泰國史上最高預售票紀錄





  鬼聲泣1.2也都是2024在台票房最高的泰國電影


  在台灣票房賣不錯，還超越 懼裂、微笑2、鬼們


  是繼2023年鬼修女2後最高的正宗鬼片票房





  今天看到泰國發布的消息


  鬼聲泣3今天正式舉行開鏡儀式


  3/16就會開拍鬼聲泣宇宙的第3部


  目前已敲定10/9上映


  希望台灣也可以同步引進IMAX和杜比版


  強檔正宗鬼片的部分9/5會先上映厲陰宅4


  明年上映鬼玩人











  (從照片上來看主角群一樣不變，只是顏值最高的妍恩缺席應該是第2集去投胎了）



  目前得知訊息是：鬼聲泣3一樣接續鬼聲泣2（1975年後)的故事











  更：


  （正想說妍恩不會演，剛看到妍恩也有出席，然後三弟也長太高了，第1集明明比大哥矮

  ）







  --

  導演在記者會上説黑衣鬼不只一隻

  第一集是照原著小說，作者描述以前在北碧府遇到的經歷（寄生靈），第一集上映時還有

  請當事者全家和當時看妍恩病人的醫生作證，還滿恐怖懸疑的。第二部很明顯就娛樂性用

  編的，但反而是真實故事好看'
