title: '[情報] 《鬼聲泣3》首週特典'
content: '《鬼聲泣3》第一週特典


  燙銀工藝簽名海報（主角群簽名海報)



  第1集1972年（女主角二姐死亡）


  第2集1975年（大姐結婚）


  本集：第3集1976年（大姐懷孕）




  看似恢復平靜的家庭，結果又出了大事！


  這次換成是小妹出事：小妹上學上到一半突然離奇失


  蹤，於是著急的家人們透過碟仙召喚二姐來協尋小妹


  的下落。




  有看過前作的人應該會覺得很扯


  明明第2集的最後就完美收場了


  女鬼被男主角虐得體無完膚


  結果看了預告 那隻女鬼又跑出來了




  雖然不知道這集會怎麼接下去


  但目前已經確定會開拍《鬼聲泣》前傳


  描述女鬼與男主角前世的關係


  預計2026年9月30日上映！







  《鬼聲泣3》10/31全台上映







  --

  一年一度展露大肌肌時刻又到了XD

  因為太熱了

  這次直接自家人組隊'
