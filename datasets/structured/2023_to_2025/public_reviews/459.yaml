  好了 直接說結論


  整部電影就是台灣電影版本的底子配上韓國素材的照抄仿製版


  而且是硬性的套用偶像劇的框架在拍


  先講優點:

  1-因為原版的劇本底子還不錯 主題性也明顯

  因此直接照抄該有的效果還是會有(包括最後婚禮的搶吻新郎)


  但對看過台灣電影版的觀眾來說就沒啥驚喜意外可言


  頂多就是感受一下不一樣的口味這樣



  2-男的帥女的美


  K-POP偶像直接拉兩個風格對得上角色氣質的來演

  因此賞心悅目以及服務粉絲的效果還是有的


  但他們的演技也就是MV等級的極限了 不能要求再多

  (男主角在演技的表現有稍微出色些)


  另外女主角確實是偶像包袱太沉重了


  校園戲裡女主角的微笑全都是愛豆在舞台上對粉絲那種拉到最開的笑

  (是很好看 粉絲也愛看 但就是會出戲)



  3-尊重原著


  這部份還真是沒話說 韓國版尊重原著的程度


  幾乎會讓你覺得應該是有一群編劇在會議室裡列出台灣版的劇本


  然後把每一個可以換成韓國元素+偶像劇化的部份都用紅圈圈起來


  其他的咱原封不動 最後直接拍的感覺


  導致劇情的起承轉合以及敘事都跟台灣版一個樣


  但因為偶像劇框架的影響 反而削弱了韓國版敘事的部份


  以上大概就是這部片的優點了 說完


  --------------------------------------------------------------------------


  缺點的部份:

  1-承著第三點的優點 電影被偶像劇化因此配角群被很大的淡薄化


  台灣原版的配角群是很豐滿的 人人各有特色以外


  電影主軸敘事:那些年我們一起追的女孩->重點在於"我們"


  一樣是校園青春電影 但講述被大考以及教育體制綁著的高中生們


  用追求女主角來豐富撰寫自己青春的一頁 這是原著敘事


  也因此雖然男女主角戲分壓倒性的多 但配角們特色鮮明


  觀眾也能看到同主角困在體制的大家 以及配角們也真的用自己的方法追女主角

  (比如說指導升學/跑步追公車 男孩們是真的都有追女主角來撰寫青春)


  但韓國版沒有 而且是幾乎完全沒有


  配角們也都喜歡女主角 但也就電影開頭大家一起看女主角時直接點出來


  還有男女大雨中分手後嚷嚷著要去追女主角(然後只有男二有實際行動)


  韓國版的男孩們頂多就是"喜歡"女主角而已 而且也完全沒那種"非妳不可"的醍醐味


  也對啦 韓版的定調就不是群像劇了 但配角們也被弱化的很尷尬


  他們的定位變成:剛好跟男主角喜歡班長但更在乎玩在一起的哥兒們


  也就是青春校園生活的背景人物而已 (喜歡班長似乎也只是他們校園生活背景 笑死)


  唯一有打算加入競爭的只有區區男二 而且還是魔改過的高配男二(帥+學霸+爹是法官)


  結果這個男二的競爭表現也很保守 頂多吃醋打擾男女主角互動而已(籃球K過去)


  很像單方面在賭氣 但卻也沒展現多少對女主角的追求慾望...根本是來輸的


  女二也是徹底配角化 單純女主角需要有一個姊妹互動而存在的角色


  (男主爸是朴星雄演的而且演得很有喜感令人驚喜 大概是過往黑道大哥印象太深了)



  2-角色服務劇情 而劇情被原著綁架 隨便舉例:


  因為要有男女們一起被罰的經典場景 所以班費必須被偷


  因為男主角是個跟原著一樣的漫畫熱血笨蛋 所以很唐突的大學硬要辦格鬥比賽


  因為男女主角必須在一場全南韓有感的大災難後聯繫 因此班長必須借男主角手機


  這些全都是服務台灣原著的劇情 韓國版本照抄 卻沒有多出色的敘事手法很可惜


  最慘的是韓版在原版的劇本裡偶像劇化的情況下直接衝擊主線的感情敘事脈絡


  比如說男女主角雨中分手後 男主角後來是有交女友的


  也因此大災難後兩人通電話 女主角想探兩人復合的機會 男主角卻沒這個立場


  但韓版因為偶像劇化(男主角怎可以再交女友呢~)直接把男主角交女友這一趴刪了


  導致兩人在大災難後的通話 感情會止步似乎就是因為兩人有默契感情止步於此??!


  還真的是....趴!沒了!


  我說屁勒...男主角變心的話還會執著大災難後聯繫女主角喔?

  (班長問家人嗎 男主還回:朋友 班長直接傻眼)

  (女主角明明都坦白這群人之中好像只有你是真正的喜歡我的)


  啊男主角到底是在無動於衷啥啦 看不懂


  男主角變心的話 婚禮也不會有那個去強吻新郎執著的合理性了啦


  如果女主角是男主角的白月光 那麼兩人彼此奔赴但錯失緣份就不該這麼輕描淡寫!


  這段硬傷實在是整部電影大扣分(畢竟你都捨棄群像劇只著重男女主了還不好好處理)



  3-很多地方 該有的有 但就是為了需要而需要


  也就是合理應該跟必須有 但沒有多加著墨 舉幾個例子:


  3-1-韓國2000年的時代背景:有 男主角的日本漫畫/世界盃南韓踢進四強/著名的颱風


  但也就僅此而已 輕輕帶過 沒有多少時代背景的撰寫


  3-2-男主角被女主角用原子筆刺藍的制服襯衫(經典互動)


  女主角有刺 但電影裡也沒刺多少次 無法連結男主角執意不洗襯衫大呼小叫的情緒

  (因電影裡連一個男主角發現襯衫被刺藍證明男女羈絆而甜笑的場景鏡頭都沒有)


  而這一段明明可以安排男女主角上大學分隔兩地發現聯繫不太上對方戰時出現


  或是男女主角大雨戲分手後 男主角誤洗 發現當年的羈絆/回憶被自己洗淡薄了


  但都沒有 頂多就是男主角最後穿著這件襯衫出席婚禮而已


  要說感動嗎? 當然有 但這麼重量級的元素被這樣處理也太可惜了吧


  3-3-男主角的志向(世界因為我而有一點改變)


  台灣版男主角後來成為小說家 韓國版男主角後來成為漫畫家


  一樣是把自己當年的愛情故事呈現出來做為結果


  但韓國版本對於男主角堅持當個熱血笨蛋並畫韓漫的過程也沒啥描述


  頂多就是女主角拿到男主角借的課本 發現男主角有畫隔頁漫畫+男主角愛看日本漫畫


  其他的....啥都沒有 好像男主角後續成為漫畫家很理所當然順理成章


  這一點特別被我點出來的原因是


  電影中女主角曾強調自己除了讀書什麼都不會(大考失利時)


  也就是說女主角其實是個跟著體制走 但本身沒啥夢想跟志向的人


  這一點完全可以做為女主角被男主角那種莫名其妙的自信(對人生)所吸引的人性依據


  但沒有 女主角真的喜歡男主角的理由變成:好像只有他是唯一真正喜歡我的人


  但女主角的這個理由卻沒足夠的說服力!!


  因前半段校園戲裡並無男配角們為追而追的戲碼(因為韓版的配角們連追都沒追 笑死)


  無法凸顯男主角的特別 只能靠打賭後真的理平頭

  (服務原版劇情 而且也沒多平 原版是因為理得幾乎光頭很可笑丟臉因此凸顯男主熱血)


  以及公車站玩水等等的橋段 也就是標準偶像劇的感情戲互動來情升溫男女的脈絡


  說實在 整部電影下來 男主角還真的是留下來陪女主角晚自習(因為鬼故事)開始


  就注定能夠得到女主角的芳心了

  (而且男主角成績進步 電影裡女主角好像也沒啥反應 少了原著那種競爭產生尊敬的心態)

  (原著裡女主角賭贏改變髮型是向男主角理平頭致敬 電影裡則是喜歡男主角的表現)


  根本與男主角想成為什麼樣的人無關 實在是很可惜


  女主角的大學階段的發展也是唐突的就跟一個場景有良性互動的同學結婚了


  唉....這部電影也就這樣了



  我的分享到此為止就好


  要說這部電影毫無亮點嗎? 也不是


  很多呼應年代的元素(連當年K-POP的代入也是)


  最後婚禮收尾的環節 依著台版的情節走 最後大量回放+女主角心境花絮


  醍醐味也是有出來 氣氛也是有到位



  但...也就是這樣而已


  這不是一部撰寫關於青春的愛情故事


  而是在以青春為背景下另外一部偶像劇式愛情故事


  以上是我的觀後收尾



  PS:"妳是我眼中的蘋果"也僅僅是男主角用功唸書背英文時在練的詞句而以


  電影裡完全沒有啥點題的敘事手法


  好歹也來一個男主角伸手遞蘋果給女主角 女主角日後自己發現含意的環節好嗎...


