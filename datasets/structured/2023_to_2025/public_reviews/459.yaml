title: '[普雷] 妳是我眼中的蘋果-偶像劇框架的四不像'
content: '熱騰騰的心得文 文長~


  昨天晚上一人在院廳看完


  這部 (包場狀態)


  一方面是因為喜歡金多賢 另一方面原著小說跟電影都很喜歡


  於是想說來看看韓國人的版本會拍得如何


  整體看下來


  確實是蠻失望的


  以下為我的主觀分析 想避雷的話別往下拉


  -

  -

  -

