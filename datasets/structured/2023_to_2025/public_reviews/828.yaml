url: https://www.ptt.cc/bbs/movie/M.1586046072.A.957.html
title: '[討論] 快銀廚房之戰以後都沒人做得出那種感覺'
content: '我發現現在很多有角色跑很快的電影

  都會借鑑這場未來昔日裡廚房之戰的概念


  正義聯盟的閃電俠、最近的音速小子

  甚至X戰警自己拍的續集


  乍看好像一樣

  但它們都只是捕捉到


  "大家定格但主角可以正常移動"


  這個概念而已

  都比不上這段給人的高速之下的時間緊繃、壓縮的窒息感


  可能是只有這段快銀在移動的時候

  會有一段時間還沒那麼快的畫面

  有出現頭髮被風吹動臉上被風吹的抖動的感覺

  雖然只出現一下，但那一小段真的很關鍵


  引導觀眾一步步走進子彈時間的感覺


  然後過程中會有「變速」的安排

  讓時間一下快一下慢，只有在快銀有特別行為時

  會變成常規慢動作，動作完他又進入不正常的縮格快速移動


  小細節真的很多


  但其他部就單純只是定格而已



  --

  說好不提....XDD'
