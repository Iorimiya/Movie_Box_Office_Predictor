url: https://www.ptt.cc/bbs/movie/M.1530976453.A.BA3.html
title: '[新聞] 導演逐格解析《蟻人與黃蜂女》的廚房打鬥'
content: "新聞網址：\n\n\n\n在《Vanity Fair》今天釋出的解析影片裡，導演佩頓˙李德（Peyton Reed）向觀眾逐格\n\n說明了《蟻人與黃蜂女》其中一幕的拍攝技巧。\n\
  \n\n\n\n在這幕裡，遭到FBI通緝的霍普˙范戴恩（Hope van Dyne）與父親漢克˙皮姆（Hank Pym\n\n）為了打造量子隧道，決定向一位名叫桑尼˙博奇（Sonny\
  \ Burch）的黑市商人購買特殊\n\n的零件，但卻在交易時遭到桑尼反咬一口，一場發生在廚房裡的大戰就此展開。\n\n\n\n\n佩頓表示，這一幕的重點在於向觀眾展示黃蜂女（Wasp）縮小、放大及飛行的各種能力，\n\
  \n因此在動作場面的安排上，必須讓各種廚房物品與威脅不斷襲來，藉以創造出一種緊湊的\n\n感覺，而佩頓也和演員伊凡潔琳˙莉莉（Evangeline Lilly）進行過深入的討論，認為黃\n\
  \n蜂女的打鬥應該具有一種精確、果敢且致命，同時又帶有一點芭蕾舞步的優雅風格。在其\n\n中一幕裡，霍普甚至變成了一位名符其實、真的在刀鋒上奔馳的「銀翼殺手」（Blade\n\
  \nRunner）。\n\n\n\n\n為了盡力符合現實世界的物理運作，在麵粉四處飛散、黃蜂女落地的一瞬間，劇組也加入\n\n了一段模仿滑冰的動作，而當然了，這個部份是由伊凡潔琳本人親自為數位替身進行動態\n\
  \n捕捉。\n\n\n\n\n雖然這個打鬥片段的鏡頭語言基本上與拍攝一般的動作場面無異，同樣包含了主觀視角、\n\n廣角鏡頭的組合運用，但其困難之處在於：這場驚天動地的打鬥是發生在非常狹窄的廚房\n\
  \n裡，角色縮小後更會進入許多一般攝影機無法擺放的位置，因此特效團隊必須為廚房裡的\n\n蔬果、菜刀……等物品打造出符合實物質地的數位替身，與實物鏡頭交錯使用，並將其相\n\
  \n互結合，為這個微觀世界建立出一個宛如大型片場般的場景，供虛擬鏡頭拍攝使用。\n\n\n\n\n\n為了創造出黃蜂女的視覺效果，這個片段也混合了各種不同的人物畫面，有些是純粹的電\n\
  \n腦動畫，有些是替身演員的演出，有些是演員本人進行的動態捕捉，有些則是以演員為藍\n\n本製成的數位替身，彼此交錯使用；而為了不讓觀眾對著裝後的角色感到疏離，劇組也使\n\
  \n用了一種名叫「陣列」（Array）的拍攝技巧，讓伊凡潔琳坐在椅子上唸出劇本的台詞、\n\n做出各種表情變化，四周則圍繞著5台攝影機、打上各種強光，最後再透過後製將其臉部\n\
  \n放進數位替身裡，讓觀眾可以在特寫畫面中透過頭盔的透明遮罩看到演員真實的表情。\n\n\n\n\n值得一提的是，在與黃蜂女對戰的敵方成員中，一位飾演黑幫的特技演員其實在鏡頭前投\n\
  \n擲了3把不同的菜刀，劇組並特地為他打造了手腕部份的數位替身供後製時使用。\n\n\n\n\n佩頓並透露，本片劇組在拍攝類似的動作場面時，會用同樣的鏡頭移動分別進行兩次拍攝\n\
  \n，一次包含演員演出，一次則只有單純的場景，如此一來，後製時就能獲得更高的自由度\n\n，讓動畫團隊可以將不同的素材相互堆疊，並將人物調整至更加適合的位置，這也是拍攝\n\
  \n本片最大的樂趣之一。\n\n\n\n\n完整影片請見：\n\n\n\n\n\n--\nQ for Quest:  \n\nMarvel電影世界觀百科：\n\n\
  Marvel電影世界觀百科臉書頁面：\n\n--"
