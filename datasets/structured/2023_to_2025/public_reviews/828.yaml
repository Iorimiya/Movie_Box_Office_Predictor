url: https://www.ptt.cc/bbs/movie/M.1700388606.A.851.html
title: '[新聞] 《沉默的羔羊》85歲男星廚房做1事 網竟嚇'
content: '新聞網址：


  《沉默的羔羊》85歲男星廚房做1事 網竟嚇到:毛毛的


  2023-11-19 中時新聞網 許庭瑛


  英國男星安東尼霍普金斯（Anthony Hopkins）於1992年演出《沉默的羔羊》經典恐怖角

  色「漢尼拔」，而獲得奧斯卡影帝肯定，30年過去他精湛的表演依舊讓觀眾印象深刻。最

  近安東尼霍普金斯曬出一段在廚房「活潑亂舞」的畫面，許多網友相當高興85歲的他依舊

  活力滿滿，並虧他：「怎麼有點怕怕的！」


  85歲英國男星安東尼霍普金斯以「漢尼拔」形象深植人心，不過他其實私底下為人相當親

  切和善，最近他上傳一段8秒在廚房準備料理餐點，興奮得手舞足蹈的歡樂影片，只見白

  髮蒼蒼的安東尼霍普金斯面色紅潤，可愛彷彿「我家阿公」的模樣，他也向粉絲發問：「

  你們喜歡看我跳倫巴的樣子嗎？周日的氛圍～」，貼文曝光後，吸引超過178萬名粉絲到

  場關心「漢尼拔」的近況，不少粉絲都留言問候：「很開心見到你健健康康！」、「愛你

  ～好好保重！」、「太可愛了。」、「生活一直都很精采。」


  不過也有粉絲笑稱：「當漢尼拔開始煮飯了……」、「還是有點怕。」、「感覺毛毛的。

  」、「我知道那只是你扮演的角色之一，但是不知道為何，我還是不相信他做的任何料理

  。」、「爐子裡不知道煮的是什麼。」。


  --'
