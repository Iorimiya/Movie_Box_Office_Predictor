url: https://www.ptt.cc/bbs/movie/M.1753627157.A.1BA.html
title: '[好雷] 來自廚房的花束'
content: '雷文防雷資訊頁















  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~







  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  滿好看的料理職人紀錄片，


  紀錄主軸在於白手起家的廚師兼餐廳負責人——齊風瑞阿姨，


  以及那伴她一生，簡樸卻傳奇的料理店「Fumin」(ふーみん)。


  讓人想起《一坪的奇蹟》的稻垣篤子，


  只不過齊風瑞與臺灣更有一段深刻的連結。


  如果是自己有開設餐飲業的，觀賞此片應該會更有共鳴。




  全片鏡頭語言沉穩內斂，


  自然光經常灑落在受訪人物、店裡的木質家具或小街上，


  營造出和風瑞阿姨相似的和藹氣質。



  在呈現料理和製作過程方面，


  對白、影像，甚至熱油澆上菜餚的滋擦聲，會讓人看得好嘴饞，


  恨不得奔回家立刻捲起袖子下廚。



  受訪人物眾多，紛紛訴說他們對齊風瑞的感念、描述她的為人，


  透過這些他人的聲音、老照片和齊風瑞的自述，


  我們得以逐漸完整這個人的一生；


  令人驚豔的是剪接的巧妙，


  經常細膩且輕快地，把每個人談到相近話題的對白剪在一起，


  猶如文字上對人物刻劃的速寫，


  很快就能勾勒出齊風瑞生活中的一塊模樣，


  並且不會讓觀眾感到沉悶。



  結尾我們看風瑞阿姨在紙筆前正襟危坐，


  鏡頭從她左後拉背，看見白皙平整的紙張與她經歷風霜的手，


  像寫俳句般，認真寫下了短短一句她對料理的信念。



  在片尾字卡跑完以後，


  猛地又看見一句發人深省的題詞，


  從黑底浮出了白字。


  整部片對一個退而不休職人的偉大精神，


  既沒有灑狗血的慷慨激昂，也沒有譁眾的歡樂，


  電影從日本拍到臺北，


  故事從年輕氣盛說到髮鬢皤然，


  不由得讓我們肅然起敬。


  --'
