url: https://www.ptt.cc/bbs/movie/M.1556673383.A.3E9.html
title: '[心得] 幸福廚房 Love''s Kitchen'
content: '松山分館停車不方便，現在柯市長將松山車站附近納入

  路邊機車停車格收費之後，想要不花錢停車，就真的

  要靠運氣，問過聽障館員停車資訊，答非所問，所以

  要到松山分館的話，有1280元月票就從松山站上來就會到。


  幸福廚房是松山分館以愛為主題的系列電影之一，

  週六上午同時段會播映，有內湖分館與啟明分館，

  但松山是每月最後一週的週六上午播，所以時間上

  是會錯開來了，因此會去看幸福廚房，完全是時間

  上空檔，片子就是一般的公式劇情，但播完之後，

  有帶小孩家人來看的先生，本想請館員繼續循環播放，

  無奈聽障館員只無情緒的回答說：你可以借回去看！

  所以這部片是會吸引到人再看幾回的喔。


  會想打這篇，主因是這部片的演員印象深刻，

  一般來說，維基百科找不到內容的片，通常是沒上

  院線或是冷門到沒人幫忙打維基內容。


  這部片的男主角Stephen Dougray Scott，乍聽想不起來

  是誰，其實就是不可能的任務二，被阿湯哥戴上易容後

  的面具，嘴被貼上灰色強力膠帶的那個替死鬼，對他只有

  反派的印象，所以看到這部片演廚師暖男，有一種很排斥

  的感覺，跟克萊兒·馥蘭妮在2007年二婚，這部是2011年的片，

  所以是夫妻檔在電影放閃的片，在即刻救援三，把最強老爸

  的前妻弄死，讓最強老爸去跟俄國長腿黑幫火拼，綁架

  最強老爸的女兒也是自己的女兒，搭私人灣流飛機逃跑，

  最強老爸不能拿槍殺害的人也是他，所以我說他演正派

  主角，就像韓國瑜的胖編輯講的-噁心。


  而克萊兒·馥蘭妮是誰呢？她就是絕地任務的英國間諜

  脫逃在舊金山碰面的女兒，還有成龍的免死金牌。



  跟臺灣短電視電影差不多，廚師頂了一個堪用的地方開店，

  拿手點心吃下去，就跟漫畫橋段那樣，眼睛會瞪大，開店

  不久就讓小鎮的交通癱瘓，因為慕名的饕客受到英國版

  的食尚玩家廚神激勵，鎮上有人扯後腿投訴衛生單位，

  想讓餐廳歇業，由於片長一個半小時，所以很快就用個

  轉折，正面收尾。


  總之，不要想東想西的話，只看這些公式化的溫馨橋段，

  是一齣適合殺一個半小時空閒的片，真的當演員要挑劇本

  也要挑片，要不然會有先入為主的觀念。


  --'
date: 2019-05-01
sentiment_score: 0.5
