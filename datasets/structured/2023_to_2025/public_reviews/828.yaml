url: https://www.ptt.cc/bbs/movie/M.1651068785.A.492.html
title: '[問片] 一個廚房場景 冰箱有人頭 有奸詐記者'
content: '想破頭好幾天了，才來拜託大家

  問家人也不知道，明明一起看的啊啊

  —

  是西洋電影。

  主角不確定是男生或女生


  有可能是最近一年內的電影、或是Netflix 或Disney 裡的片，因為我印象是在家裡跟家

  人看的


  腦子只有一個場景，這是電影剛開始沒多久

  是主角跟穿英倫西裝的男生在廚房喝紅酒交談(談判)


  應該是廚房主人在威脅主角留下來幫他做某件事，有遞名片給主角

  然後打開冷凍櫃裡面有一個男生人頭，好像是之前主角不小心殺死的(?


  —

  劇情某一段是在房子的外面，廚房主人在烤牛排，也邀請了一個記者

  然後奸詐的記者也是總是在威脅主角


  —

  整部電影不是驚悚片恐怖片，我的印象就到這裡

  拜託拜託幫幫忙了


  --

  謝謝回應(跪，查了一下不是這部，

  不是驚悚/恐怖片，我膽子很小應該可以排除這類


  查了一下也不是，

  有可能是最近一年內的電影、或是Netflix 或Disney 裡的片，因為我印象是在家裡跟家

  人看的

  太太太感謝了！！！

  就是這部！！！

  好感謝好感謝樓上跟樓樓上呀！！！

  謝謝！！！謝謝！！！'
