url: https://www.ptt.cc/bbs/movie/M.1744568521.A.3DE.html
title: '[ 普好雷] 2025版《囍宴》希望你能做自己'
content: '無雷心得

  如果你抱持著李安版的囍宴可能會失望，但整體其實把原版重新詮釋出美式現代化的話算

  成功，用悲劇包裝成喜劇也有到位，整體是通俗感人選角和演員上也有不少亮點，尤其是

  很喜歡尹汝貞和陳沖的動容演技，讓電影中以美國為背景卻有種展現融合韓式和華裔的文

  化。

  ________________________________

  有雷

  .

  .

  .

  .

  .

  2025版囍宴其實還是以李安版本同妻假結婚的議題下去描述劇情，但加入同志代孕等議題

  ，相比李安的內斂卻含有豐富情感，新版的整體氛圍相當外放，讓同志議題不再是以往只

  能壓抑的社會氛圍，角色同時有歡樂也有生活困境，交錯的視角和偶遇的敘事方式，讓電

  影有種情境式喜劇感，沒有原版的倫理深度變小品卻更淺顯易懂，但整體我還是很喜歡這

  種美式熱鬧的基調。


  我其實很喜歡每個角色在面對自己的困境的難題，然後逐步運用彼此關係動推進劇情來化

  解問題，尤其是安琪拉與媽媽和珉與奶奶的故事線，雖然套路但我還是有被感動到，我想

  應該真的是飾演媽媽的陳冲和奶奶的尹汝貞強大的表演讓這兩個故事線增加不少賣點。也

  有被最後舞獅的證婚戲給觸動，想必前面很多劇情鋪陳都是為了這場戲。


  而且不得不說陳冲和尹汝貞戲份不多，但只要一出來都是戲，陳沖把活潑和愛現卻又不知

  道怎麼表達真實情感的亞洲媽媽演的活靈活現，尹汝貞也把看似嚴肅卻試圖理解非韓國文

  化舒適圈的奶奶詮釋得相當細膩，尤其是浴室和碎布的戲，真的為這些年輕演員們展現什

  麼是前輩及演技，有一場飯桌戲兩位教科書般式的演技，沒有過多的台詞只靠眼神和舉止

  就彰顯角色情感與文化，但好惜那場戲被剪得不多。而Kelly Marie飾演壓抑的安琪拉、L

  ily Gladstone飾演受挫的李和楊博文飾演不願面對現實的Chris都算是有各自發揮不錯的

  地方。


  但不免俗的還是看的出來敘事上有點過於跳躍，可能太多角色不知道怎麼去抓出精準節奏

  ，顯得女同志的線表現比男同志的線相較立體更好，男同志的故事線在雙方過於在情勒和

  逃避不斷迴圈，最後突然個大結局覺得鋪陳不夠。還有把韓國文化與視角用財閥、男權等

  刻板印象寫入劇情裡不知道是否是好事，而且其實原版可以叫喜宴，但我覺的新版可以叫

  婚禮就好?喜宴的元素變得不多。


  --'
