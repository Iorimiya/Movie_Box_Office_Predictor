url: https://www.ptt.cc/bbs/movie/M.1498454051.A.E08.html
title: 'Re: [新聞] 拍囍宴這一幕 高金看到好脾氣李安動怒'
content: "看到這篇關於李安的新聞，我又忍不住想分享一件事。\n\n小弟是做國外業務的，上個月有一個法國的客戶來台灣拜訪，\n晚上陪吃晚餐的時候，聊到食物，然後就聊到他是法國人(56歲)，\n\
  會吃的慣台灣的食物嗎，他說，他自己本身算是半個美食家，\n所以他很喜歡嘗試各種新鮮的食物，他吃過幾次台灣的食物，他很喜歡，\n重點來了，他說，他尤其記得他以前在法國看一部台灣導演拍的電影，\n\
  拍的內容是有關食物的，他說他看了那片就覺得裡面的食物看起來就很好吃的樣子，\n我說，是不是李安的飲食男女，他就說對對對~\n\n然後他說因為他大學就是念電影的，所以他很了解法國的電影市場，\n\
  他說法國人其實很喜歡看這種非主流的片子(非商業片)，\n他覺得像李安跟侯孝賢(對，他也知道侯導XD)的電影在法國都還蠻受歡迎的，\n所以他對他們的電影印象都特別深刻。\n\
  \n所以以前導演磨演員演技的時代，是真的能結出相當有影響力的果實的。\n\n\n--\n「Manners Maketh Man」\n \"禮儀．成就不凡的人\"\
  \n                       = Kingsman =\n\n別把粗鄙而毫無格調的言詞與行為，當成了自由與個人風格，\n因為你的所言所行，將成就你為怎樣的人。\n\
  \n--"
