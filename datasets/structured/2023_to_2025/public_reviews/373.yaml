title: '[有雷] 囍宴，黑暗火鍋'
content: 'Andy老師防雷



















  (防雷)


  一個男同志向男友求婚失敗，情急之下竟想與女同志好友假結婚，一整個雞飛狗跳的故事


  很難想象這是由1993囍宴翻拍(我沒看過原版),  題材真的超前於時代


  LGBTQ，同性題材，假結婚，文化衝擊，各種各樣政確無比的元素交融成一部荒謬喜劇。


  片中笑點真的很直接粗暴，我看的這場笑聲不斷，還頗對胃口的


  後面的節奏並不像商業片這樣緊湊刺激，本來以為會有打架飆車送醫見血之類的大場面，很遺憾並沒有。


  這題材要是拍成美劇應該更好發揮，畢竟…八點檔你知道的。


  片中家長開明的超乎想像(換做現實，多半是一場悲劇)，少了一點親子間的衝突元素，還有不得不說陳沖演的媽媽真的很有特色，有夠搶戲的。


  當然最搶戲的還是男方的珉，長的有夠像Andy老師，害我超出戲的XD





  --'
