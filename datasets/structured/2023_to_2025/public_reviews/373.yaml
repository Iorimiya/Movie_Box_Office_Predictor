url: https://www.ptt.cc/bbs/movie/M.1498406226.A.250.html
title: '[新聞] 拍囍宴這一幕 高金看到好脾氣李安動怒'
content: "（中央社記者李明宗台北25日電）電影「囍宴」女主角高金素梅回憶，導演李安在預算壓\n力下力求完美，但一場兒子向媽媽出櫃的戲，因未達李安要求，拍攝經費又有限制，讓高\n\
  金素梅首度看到一向好脾氣的李安動怒。\n\n「拍戲的時候真的好苦喔」，高金素梅回憶近25年前的拍攝情景，拍片現場總有人在旁盯\n場，不斷催促李安，不能多用膠片，預算很有限。\n\
  \n「囍宴」上映後，成為首度入圍奧斯卡金像獎最佳外語片的台灣電影，更拿下柏林影展最\n佳電影金熊獎，在台灣影史占有一席之地，但高金素梅坦言，拍攝當下，絕對沒想到電影\n\
  後來會那麼成功，也由於經費限制，讓李安與演員們吃足苦頭。\n\n她說，為節省膠片使用成本，李安花很多時間紙上作業與排戲，包括鏡頭擺哪、燈光怎麼\n弄等，整個團隊耗費許多心力。\n\
  \n一場男主角趙文瑄向戲中媽媽（演員歸亞蕾飾演）出櫃情景，可說是整部電影的高潮，拍\n了很長一段時間，一次又一次，都無法達到李安想要的效果。\n\n高金素梅還記得，那個盯場的人「個子好高，一直插著口袋，把李安叫到旁邊去，用英文\n\
  講，你不能了...！超支了！」李安是很難發怒的人，但她第一次看到李安有情緒，用腳\n踢牆角，「很氣啊」。\n\n這樣的壓力不只在李安身上，演員們也深切感受到不能有太多次NG，而對高金素梅來說，\n\
  演對手戲的既有金馬獎影帝郎雄、亞太影展影后歸亞蕾，也有剛出道、完全沒演出經驗的\n趙文瑄，更是倍感壓力。\n\n李安為戲求好心切那一幕，高金素梅說，「相信Winston（趙文瑄）也看到了」，大家重\n\
  整旗鼓再拍一次就OK，這也讓高金素梅對這部戲留下很深刻的印象。\n\n新聞網址：\n\n--\n                               \
  \       06/26 00:02"
