url: https://www.ptt.cc/bbs/movie/M.1702522013.A.D1B.html
title: '[新聞] 多部經典入列！李安《囍宴》、《小鬼當 '
content: '多部經典入列！李安《囍宴》、《小鬼當家》《魔鬼終結者 2》等片獲美國電影保護局典

  藏




  每年底，美國國家電影保護局都會照慣例公佈最新的收藏片單，自 1989 年至今，他們每

  年必嚴選 25 部電影列入國家影片登記表（National Film Registry），這些作品須符問

  世超過十年的門檻，並在文化與歷史、抑或美學方面具重要價值，而今年獲選的作品們，

  則包括《小鬼當家》系列的第一集、近代黑奴題材的代表性作品《自由之心》、被普遍視

  為續集電影模範之一的《魔鬼終結者 2：審判日》、以及定格動畫的指標性經典《聖誕夜

  驚魂》等片。




  一如往常，除了劇情長片之外，電影保護局此次挑選的作品，也包含短片、默片和紀錄片

  等呈現形式，截至目前，國家影片登記表的收藏片量已達 875 部。



  今年被指定典藏的完整片單如下：


  《A Movie Trip Through Filmland》（1921）

  《Dinner at Eight》（1933）

  《Bohulano Family Film Collection》（1950s — 1970s）

  《海倫凱勒》（Helen Keller in Her Story，1954）

  《小姐與流氓》（Lady and the Tramp，1955）

  《黑白金剛》（Edge of the city，1957）

  《We''re Alive》（1974）

  《Cruisin'' J-Town》（1975）

  《!Alambrista！》（1977）

  《Passing Through》（1977）

  《名揚四海》（Fame，1980）

  《神秘約會》（Desperately Seeking Susan，1985）

  《The Lighted Field》（1987）

  《暴亂風雲》（Matewan，1987）

  《小鬼當家》（Home Alone，1990）

  《Queen of Diamonds》（1991）

  《魔鬼終結者 2：審判日》（Terminator 2：Judgment Day，1991）

  《聖誕夜驚魂》（The Nightmare Before Christmas，1993）

  《囍宴》（The Wedding Banquet，1993）

  《林瓔：強烈而清晰的洞察力》（Maya Lin：A Strong Clear Vision，1994）

  《阿波羅 13 號》（Apollo 13，1995）

  《王牌電視秀》（Bamboozled，2000）

  《籃球之愛》（Love & Basketball，2000）

  《自由之心》（12 Years a Slave，2013）

  《伴唱人生：聚光燈外 20 呎》（20 Feet from Stardom，2013）





  --'
