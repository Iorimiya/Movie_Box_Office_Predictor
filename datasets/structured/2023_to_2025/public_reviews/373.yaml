title: '[好雷] 囍宴2025 以現代方式重現經典'
content: '這星期剛好有2部都是翻拍的電影，又剛好都跟結婚有關，分別是冥婚鬧泰大、囍宴。因

  為鬼家人之前才剛看過沒多久，就選囍宴來看囉。(我其實不喜歡這種沒改片名的翻拍，

  因為之後搜尋片名還要加年份不然會搞混)


  我對囍宴(原版LOGO是三喜，只是文字打不出來)改編版本(要說這是韓國版還是美國版都

  可以，不如就說韓裔版吧)從預告開始就會走出它自己的路，李安版看似有些笑點，整體

  仍然是極度壓抑的，正如李安串場親口講到這是中國人5000年的性壓抑。

  至於韓裔版的改編，到底如何呢，下面開始爆大雷劇透囉。




  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  劇情(僅看1次若有錯誤請見諒)



  人物介紹(為了講解使用代號簡稱)




  男1(Min)：男2的男友，有家族企業，有錢，父母雙亡，剛完成美國學業，因簽證將到期

  ，被奶

  奶逼回家接家業、爺爺是反同大將(未出現)。目前跟男2住同志小屋的車庫。

  男2(Chris)：男1的男友，對於這份感情不太確定，研究所論文寫不出來休息中。有個表

  妹，負責

  出主意和一起打電動

  女1(Lee)：同志小屋的屋主，同志中心工作，想要有個小孩。

  女2(Angela)：華裔，從事科學研究，出櫃之後媽媽挺同。


  一開始這4個主要角色是住在一起的，關係也很緊密，就像是大學同學之類的關係。


  之後某天奶奶打電話給男1，要求回韓國繼承家業。另外，這時候女1的人工生殖失敗。醫

  師說可能是年齡大了不好成功，她們很失望，本想再做一次但是卻沒錢了，或者乾脆換女

  2做，因為年輕，但是還是沒錢。


  然後男1拿出已買很久的戒指跟男2求婚(因為學生簽證要到期了，為了綠卡)，男2因不確

  定這份感情，拒絕了。


  經過一段沉澱，男1想出另外一個方案，跟女2結婚，並且作為交換，會資助女1做人工生

  殖。


  之後男1把要結婚的消息跟奶奶講，奶奶行動派的馬上搭飛機到美國，為了營造假象，剩

  下3人趕在1小時內把家裡大改造不能留下任何同志痕跡。


  等奶奶到了之後，一眼就識破你們這是假結婚嘛，當我是傻子是不。但是你們這婚必須得

  結，不然韓國人輿論是很恐怖的，而且必須辦個盛大喜宴，才能騙過所有人，尤其男1爺

  爺是反同大將軍，只要婚事辦成上報他就會相信。


  之後女1女2拿到男1贊助的錢，馬上去做第二次人工生殖。


  為了慶祝男1女2要結婚了，他們幾個人就去同志酒吧做最後狂歡，在酒精的催促之下，男

  2女2竟然全身裸體上床了，等到醒來之後兩人驚呆，完全不記得晚上發生什麼事。

  (按照原版情節必須一發入魂)


  婚禮當天使用韓國儀式，就在最後新浪背新娘環節，女2吐了，經過驗孕，是2條線。


  這個重磅炸彈，讓女1、男1、男2通通不能接受，全部離開同志小屋。剩下兩個家長(男1

  奶奶、女2媽媽留下來吃整桌的菜)

  經過了解，是男2把男1給甩了，男1還是深愛著男2，並沒有因為霧社事件影響感情。


  男2失落之下，回到表妹房間這時表妹有個主意。。。


  婚事這邊，他們只辦了婚宴還沒去登記，還是要把程序辦完，男1女2就去了市政府登記，

  下面坐著男1奶奶、女2媽媽。


  詢問證婚官要站在哪裡的時候，證婚官說隨便啦，都可以。要男左女右還是男右女左都沒

  差了。 就在男1女2要說我願意之前，闖入一隻舞獅還有樂隊打鼓直接攔截婚禮。


  舞獅裡面的正是男2還有表妹，這時站好的男1馬上回頭說「夠了都別說了，我要跟這個男

  的結婚」

  證婚官馬上傻眼，問女2妳有要反對嗎？ 女2回答「我贊成他們2人結婚」

  後面2老也衝到台前鼓掌


  後續：兩個娃的哭聲打破寂靜的深夜，女1女2趕快來哄小孩睡覺，男1男2也來幫忙換尿布

  ，看起來是幸福的4人行。


  -----------------

  李安的原版囍宴還是經典

  但是新版把原有的元素拆解、重新組裝之後編寫出符合現代版的囍宴，娛樂性也是很高的

  ，李安版真的太壓抑了，或者說那個年代太壓抑了(甚至斷背山的年代都還是)

  這部片前10分鐘隨處可間LGBT彩虹元素，真的是世代變了。



  奶奶這個角色也是承接了原版的父親角色，只是這次不用故意被騙了。



  個人主觀評分：8.5/10



  --

  片尾名單看完

  李安在感謝名單第一位


  如果這部片不叫囍宴，我不會看

  而片中確實有原版的元素

  至少我可以接受這個改編


  我後來又想了一下

  新版在兩位家長看似都不算嚴重反對，也沒什麼衝突

  假如爺爺是反同大將軍這個演出來會不會增加一些世代隔閡呢



  時間不夠啦～


  至少這個版本把最後四人行的劇情拍出來了


  李安當年應該沒辦法把三人行給拍出來只能用個開放式收尾


  這也算時代進步了吧


  是的，這兩位配角的演出比四位主角來的好

  是，豆瓣已經在狂噴了

  不過我覺得在原有元素下重組成現代版也未嘗不可'
