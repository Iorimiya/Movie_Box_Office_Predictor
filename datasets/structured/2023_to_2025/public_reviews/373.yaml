title: '[情報] 《囍宴》將翻拍！陳沖、尹汝貞、莉莉葛萊史東參演！'
content: '根據綜合外媒的報導指出，台灣名導「李安」的經典作品《囍宴》將進行全新的美國翻拍

  版。


  《囍宴》為李安的第二部長片，也是他躍上國際舞台的重要作品，當年一舉拿下了柏林影

  展的金熊獎，且同時代表台灣獲得奧斯卡最佳外語片的提名。如今將有曾拍出《那一夜，

  我在三溫暖》和《熱戀彩虹島》等好評電影的韓裔美國導演 Andrew Ahn 進行翻拍，他本

  身也是一位公開的男同志。




  翻拍版《囍宴》（以下稱為《The Wedding Banquet》）劇本將由導演 Andrew Ahn 和原

  版的編劇之一 James Schamus 共同編寫劇本，據悉這將是一部更具「當代酷兒文化色彩

  」版本的作品，一如導演上一部取材自《傲慢與偏見》而改編成的《熱戀彩虹島》。


  劇情描寫一位韓裔的男子 Min 在向他的男友 Chris 求婚並被拒絕後，Min 請求他最要好

  的朋友 Angela 跟他結婚，好讓他取得綠卡，並且願意支付 Angela 女友 Liz 的 體外受

  精治療費用作為回報。儘管 Min 和 Angela 密謀在市政廳舉行低調的婚禮，但當 Min 的

  祖母來到西雅圖要幫他們舉辦一場豪華的韓式婚宴的時候，他的生活開始天翻地覆。


  目前除了男主角 Min 仍在進行選角之外，其他主要角色的演員都已到位。包括男友

  Chris 由《週六夜現場》固定班底「楊伯文」飾演、Angela 和 Liz 這對情侶則分別由《

  STAR WARS：天行者的崛起》的越南裔女星 Kelly Marie Tran 和今年甫以《花月殺手》

  獲得奧斯卡提名的 Lily Gladstone 演出，至於族母一角則找來了曾以《夢想之地》獲得

  奧斯卡的韓國國寶級演員「尹汝貞」飾演。除此之外「陳沖」也在演員名單中，但未知會

  演出甚麼角色。




  Min 的角色雖然還在進行選角，但這個角色被描寫是一位擁有堪比 K-Pop 偶像外表，對

  於時尚相當敏銳的韓國酷兒男子，並且剛結束他的美術碩士學程。而他的祖母已經為他找

  好了家族企業中的一個職位。


  《The Wedding Banquet》即將在五月底陸續於溫哥華、英屬哥倫比亞開拍，直到六月底

  。


  --'
