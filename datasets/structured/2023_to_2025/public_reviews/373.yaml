title: '[好雷] 愛就是接納。囍宴'
content: "《囍宴　The Wedding Banquet》\n\n內文有雷，\n文筆不好，只是單純看完這部片後有感而發想跟大家分享！\n敬請自行斟酌觀看。\n\
  \n------------------------------------------------------------------------------\n\
  \n李安導演在《囍宴》中，\n把華人同志處在華人世界所面臨的困境通通拍攝出來，\n在長久受中國傳統思想「傳宗接代」的觀念下，\n結婚、生子，成了家中男丁的最大壓力，\n\
  甚至對於女人生男孩延續香火，也成了女人的使命。\nSimon有一幕說 ”Why don’t you just tell them?”\n這一句話道盡了中西文化上的差別，\n\
  而偉同聽了這句話卻只是無奈的繼續填寫來電的擇偶條件，\n想要圓一個謊去實踐中國文化所謂的「闔家歡樂」，卻不願面對真實的答案。\n\n\n   「愛」就是接納。\n\
  \n\n對Simon而言，在講了 ”Why don’t you just tell them?”\n這個直覺反應的語句後，立刻接上了 “Shit!”\n這充分了表示他愛偉同，並且接納他的中國文化背景及家裡的壓力，\n\
  甚至他幫助偉同圓這個謊，搞到最後連他自己都筋疲力盡。\n\n而偉同對他父母的愛，出自於「囍宴」這個謊，\n他清楚地知道他如果沒有結婚、生子就是不孝，\n連高父撐著最後一口氣都是等著抱孫子，\n\
  所以他壓抑著自己的性向，去籌備著這個滔天大謊，讓兩老高興。\n\n對於高母，在第一時間聽到偉同親口告訴他這場「囍宴」都是一個謊言，\n向她坦承自己內心隱藏秘密的時候，\n\
  因為她對小孩的愛，雖然她無法接受這個事實，\n甚至到最後她都還期望偉同能夠改變過來。\n但她一直「試著」去接納，\n「試著」\n在機場看照片那幕最為明顯也是導演刻劃每個人對這件事情的反應最深刻的鏡頭，\n\
  當看著「囍宴」上的照片的時候每個人都露出滿足的笑容，\n但翻到最後偉同與Simon的合照，\n原本都還笑得很開心地大家，高父跟高母卻收起了笑顏，\n而高父只是不發一語，\n\
  但高母卻裝作沒看到接著說著藉口「時間真的到了。」\n甚至最後要登機的時刻她哭了，高父問她：「怎麼了？」\n她回答：「沒事，我只是高興。」\n歸亞蕾的無奈表情演得深刻動人，\n\
  一臉懺悔說著：「對不起高家祖先」的神韻，\n背後盡是無法完成「傳宗接代」的無奈及自責。\n\n另一方面高父則是沉默了接受偉同的一切，\n有幾幕偉同跟Simon按耐不住顯露出他們是愛人的訊息的場景，\n\
  卻也都巧妙的連接高父在場的場景，\n從高父跟Simon說的 ”I watch, I hear, I learn.”\n到後來高父要離開機場說的那句\n「我也高興。」\n\
  平鋪直敘地說著卻直打進心裡，令人動容。\n\n在美國宣布婚姻平權的幾天後，看了這部電影，\n至今，還是能夠反映出台灣社會上存在這部所要傳達的意念。\n真心期望看見男女、男男、女女都能與自己愛的人舉辦一場\n\
  「囍宴」。\n--\n\n我自己的解讀是一開始高母也有向前要去跟賽門告別(沒有想太多)，我覺得是出於離別的\n時候，要感謝他，這陣子打擾到他。但當賽門要將高母擁入懷裡的時候，高母那錯愕的表\n\
  情很像突然想到賽門跟偉同是愛人的這件事情，而高母也還沒完全接納，所以她才愣住。\n而高父看到後，轉而握住他的手說「謝謝你照顧偉同」我覺得是因為他之前在河邊的時候\n\
  也跟賽門說過：「如果我不讓他們騙我的話，我怎麼能抱得了孫子。」所以我覺得高父是\n不想讓大家知道，其實他早就已經知道賽門跟偉同的「愛」，而他也早已經接納了，相較\n\
  於他對威威說的「高家會謝謝妳」我覺得純粹只是因為威威幫高家延續香火，而他也清楚\n往後是賽門會陪在偉同身邊所以才跟他說了謝謝他照顧偉同，只是他不願將這個大家精心\n\
  謀劃的「囍宴」戳破罷了。　以上是個人的見解！"
