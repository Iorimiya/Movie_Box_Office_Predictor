url: https://www.ptt.cc/bbs/movie/M.1498456738.A.4C7.html
title: '[新聞] 高金素梅憶囍宴 還想再演一次'
content: '導演李安執導的囍宴明年上映25週年，片中女主角、無黨團結聯盟籍立法委員高金素梅表

  示，如果能重來，還想再演一次囍宴，一定會很不一樣，人生歷練會讓她更能表達劇中情

  緒。


  同婚議題近期在台灣社會有許多討論，而近25年前的國片市場，同志議題還不多見，囍宴

  推出後，不但成為首度入圍奧斯卡金像獎最佳外語片的台灣電影，更拿下柏林影展最佳電

  影金熊獎，在台灣影史占有一席之地，後續也引發同志文化議題相關討論。


  高金素梅接受中央通訊社訪問時，回憶與李安初見面過程表示，當初正在趕拍鄉土連續劇

  ，得知要與已藉電影「推手」嶄露頭角的李安見面時很緊張。雙方見面時，她覺得李安非

  常樸素，聊天時李安也沒直接說就是要用她，。


  李安還問高金素梅英語如何？高金素梅很坦白對李安說，程度不好，但如果李安願意給她

  這機會，她很願意嘗試；直到最後，謹慎的李安都沒明確告知高金素梅是否要用她，高金

  素梅也是「」。


  高金素梅表示，當時她在小螢幕演出，連續劇1集可有約新台幣8萬元到9萬元酬勞，雖不

  軋戲，但週末假日她會要求導演讓她跑工地秀，待遇甚至比演連續劇還優渥很多，且都是

  拿現金，「」。


  轉戰大銀幕接下囍宴，要飛到紐約演出，斷絕了所有可能在台灣的工作機會，高金素梅說

  ，，但她其實很興奮與期待，「是給自己一個學習的機會」。


  到了「大蘋果」的高金素梅確實沒少學，李安為讓剛到美國的高金素梅沉浸在角色中，把

  高金素梅丟在母校紐約大學宿舍，感受留學生的感覺；李安也覺得高金素梅走起路來太「

  飄」，甚至。


  至於為何能在囍宴中突破，演出裸露出浴劇情？敬業的高金素梅表示，她拍戲時很少「軋

  戲」，就是為全心投入每部作品，另一方面是在紐約長時間與李安相處，了解李安對戲劇

  的堅持與熱衷，當李安提出這項要求時，她二話不說就說沒問題，「為了戲劇好有什麼關

  係」。


  不過，她說，雖然表面這麼說，真正拍時，內心很掙扎，在電影院看這部戲時，自己也不

  敢看這一幕。


  高金素梅說，如果能重演，她相信一定會更不一樣，但留一點遺憾也不錯；她回憶，劇中

  她決定要生下孩子的那幾場戲沒演得很好，情緒轉折不太夠，現在經過更多生命歷練，慢

  慢可體會到那場戲該怎麼表達。


  ----

  該不會這部片最花錢的就是他的片酬吧


  --'
