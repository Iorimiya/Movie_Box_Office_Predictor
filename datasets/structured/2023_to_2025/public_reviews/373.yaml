title: '[情報] 2025新版囍宴預告'
content: "預告在此，將於金馬奇幻影展亞洲首映。\n\n\n李安原版共同編劇詹姆士夏姆斯，《熱戀彩虹島》韓裔導演安德魯安，\n\n奧斯卡最佳女配角尹汝貞，兩屆金馬影后陳冲。\n\
  \n 安琪拉與伴侶李因試管嬰兒療程屢屢失敗，卻無力負擔新的療程費用。而他們的好友珉\n，雖是跨國企業家族的隱藏繼承人，坐擁豐厚財富，卻因學生簽證即將到期而陷入困境。\n\
  當他的男友克里斯拒絕求婚後，珉靈機一動，向安琪拉提出一樁交易——只要她願意與他\n假結婚，助他取得綠卡，他便資助李的試管嬰兒費用。\n\n然而，他們原本打算低調進行的計畫，卻因珉的奶奶突然從韓國飛來探訪而徹底失控。這\n\
  位精明的老夫人不僅對孫子的婚事半信半疑，還堅持要為他們辦一場盛大的傳統婚禮，讓\n這場「交易」瞬間變成一場盛大而混亂的囍宴。隨著婚禮逼近，兩對情侶的感情與關係也\n\
  面臨前所未有的挑戰——當承諾、家人與自我認同交織在一起，他們是否能勇敢地面對內\n心真正的渴望？\n\n---\n陳沖是吃了什麼仙丹怎麼都不會變？\n男主角的演技好尬，只能靠尹汝貞撐場了吧。\n\
  \n--"
