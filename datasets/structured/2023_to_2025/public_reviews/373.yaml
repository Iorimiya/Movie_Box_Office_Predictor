url: https://www.ptt.cc/bbs/movie/M.1552985465.A.5B6.html
title: '[新聞]台VR作品囍宴機器人美國南方音樂節口碑爆'
content: '新聞網址：


  一年一度的SXSW美國南方音樂節於今日落幕，由Janet（謝怡芬）與George（吳宇


  衛）夫妻檔合演的台法合製VR作品《囍宴機器人》不僅順利入選該音樂節的VR電影


  單元，並入圍「最佳電影海報」、「最佳360影片」、「最佳互動」及「最佳敘事」


  及「最佳沉浸式體驗美術」五項大獎，放映後更獲得觀眾熱烈的迴響，因影片導入


  專屬技術，電腦會即時運算觀影者對哪位角色的故事線比較有興趣，進而播放哪種


  版本，讓觀眾可以真正的融入並享受劇情，許多人表示影片完美的將故事及技術結合。



  SXSW美國南方音樂節舉辦地位於德州，出身德州的Janet也為此感到非常開心，她


  的先生也是同劇演員George也表示：「從日舞影展到美國南方音樂節，是非常棒的


  經歷，很意外能夠入選，也感到非常的榮幸。」同劇演員Janet的師妹大霈表示：


  「之前對SXSW的印象大都和音樂有關，身邊也有許多獨立音樂圈的朋友曾入圍，沒


  想到我們《囍宴機器人》能夠入選，感覺自己在國際上多了一個頭銜。」




  Janet跟George聊到如果未來兒子Egan的婚禮也配了一台伴娘機器人，會想怎麼調整


  設定呢？George笑著說：「希望機器人能把我綁住，不要讓我在婚禮上跳驚人的舞


  蹈讓兒子難堪，還有最好禁止我發言，不要在婚禮上脫口而出如何在水槽洗他的屁


  股。」Janet倒是很豁達地說：「只要Egan不是跟機器人結婚，我都可以。」《囍宴


  機器人》預計2019下半年起會在台北、台中、高雄以日舞版規劃中文版國內巡演，


  英、法文版本也即將展開國際巡演。




  看到這則新聞，其實比較好奇的是裡面講到的「電腦會即時運算觀影者對哪位角色的


  故事線比較有興趣，進而播放哪種版本」，這是甚麼意思啊？看起來也不像是讓人去


  選擇有興趣的故事線，那這樣電腦要怎麼運算？有人對這個技術熟的嗎？


  --'
