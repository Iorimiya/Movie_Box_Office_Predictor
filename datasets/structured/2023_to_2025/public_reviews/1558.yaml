url: https://www.ptt.cc/bbs/movie/M.1206558117.A.FCC.html
title: '[好雷] 我的左派老師(Half Nelson)'
content: '兩個與毒品有切身關係的人,一個和你所想像中的老師形象不太一樣的老師,一個難以想像

  那個年紀可以如此成熟的女學生,一個白人,一個黑人,一段跨種族的忘年之交,一則關於改

  變的故事,這是我的左派老師


  原文出自:


  本部電影是2006年的,至今才在台灣上院線,且僅在光點午夜場(是否會上院線可能得看片

  商),所以擁有許多中文譯名,我看過的就有,我的毒蟲老師,衝擊教室,及我的左派老師,我個

  人比較喜歡"我的毒蟲老師"這個片名,但英文片名卻有另一番更深刻的風景,

  片名Half Nelson是摔角的專業術語,是一種壓制對手的困鎖手法，幾乎可以讓對方無法脫

  逃。導演Fleck與製片Boden選用這個英文片名，意在隱喻影片主角Dan與Drey所處的困境

  (資料來源:開眼電影網)


  Dan是個老師,但卻是個與你所以為的傳統老師形象不符合的老師,在課堂上,他教學活潑生

  動,喜歡讓學生討論,辨証,一點也不死板,但仍有他教室內的原則,如不允許作弊等不法情事

  發生,不過雖然他在歷史教學上,有一套自己別出心裁的教法,甚至影響了一個學生在大學裡

  選擇歷史當主修(雖然他本人怎麼也想不起那位學生的模樣),但這樣獨數一格的教學,卻不

  被學校所接受,學校只希望他能夠按照進度,照本宣科,但Dan所期待的課堂方式並非是這樣

  的;在私生活上,他被他自己的藥癮所折磨,我們無從得之什麼時後開始,什麼原因,Dan開始

  吸毒,但可以確定的是他逃避著無形的壓力,逃避著原有的理想和熱忱消失殆盡,不過我發覺

  到他還是有試圖振作的,因為他還是試著往自己的夢想前進,包括在教學上傳遞著熱忱,打算

  出書,試圖阻止Drey墮入毒品世界中,但卻屢屢欲振乏力,

  Dan實處在理想與現實拉扯的困境中


  而Drey則處在父母離異,照顧他的母親又太忙,哥哥也因為幫Frank販毒而被送進監牢中的孤

  獨狀態中,他知道毒品的可怕,但卻逃離不了藥頭Frank的手掌心,原因只是幫Frank販毒的哥

  哥坐牢,但Frank卻安然無事,因此Frank覺得這是對他們家虧欠的補償,但我可以感覺到Drey

  並不想淌這灘渾水,但又不知要從何作起,直到發現他的老師Dan吸毒,我想Drey大概是感受

  到Dan覺得被發現吸毒很不好,但卻深陷其中,無法自拔,而感到抱歉吧!?剛好和Drey所處的

  進退維谷的狀態很像,想要改變,卻不知從何著手,而Dan後來也發現Drey的狀況,所以在不知

  不覺中,他們兩人漸漸在某些程度上成為好朋友,而相互扶持,希望彼此雙方能夠改變,

  衝破現有的困境


  改變是本部片的一個中心思想,巧妙地運用了Dan的職業及任教科目,陳述歷史上的改變,

  當然不只是政治上,歷史上的變動罷了,更是藉此(就如同前面所述)來帶出Dan與Drey內心層

  面的改變需求,而Dan上課的點點滴滴,雖說是為了陳述歷史上的改變的理論基礎,但我覺得

  其實這也是一個人改變的理論基礎,我們甚至可以說我們人體就是一個小型的社會,我們內

  在許多想法,就代表著社會中各式各樣的想法,總在欲改變之時,會有許許多多的想法互相角

  力著,有些安於現狀,也就是我們所說的習慣,如入鮑魚之肆,久聞不如其臭的狀態,有些卻不

  是,所以才會有相反的力量出現,當相反的力量勝過於原本的力量時,改變於焉產生,在社會

  上是如此,在個人內心思想中,又會多一個關鍵,即為自己願不願意去接受這樣的變化,還是

  習慣了原本的習慣,因而故步自封,在一場老師與學生:"機器剝奪自由,這裡的機器是什麼?"

  的問答討論中,直到最後,其實不也道出了,人類本身即為剝奪自己自由的機器嗎?我自以為

  這也是說著人類即為剝奪自己改變機會的體制!而Dan與Drey便是囚禁在自己的人體當中,

  被毒品這個東西所加以控制著,而猶疑地難以跨出改變的一步


  另外有趣的是,在我尚未看到Half Nelson是摔角的專業術語,而導演與編劇將此拿來做隱喻

  時,我先Wiki一下Nelson,發現了南非首位黑人總統的名字為Nelson,他是南非的國父,片中

  的Dan不斷地傳達著民權運動與歷史的改變,讓我一度覺得Nelson是代表該位南非總統,(最

  近有一部電影"再見曼德拉"即為描述這位總統的故事);不過後來又Wiki到現任

  Golden State Warriors的教練的姓是Nelson,他發明了控球前峰概念,保持跑轟的攻擊式戰

  術風格,創造備受爭議的"砍鯊戰術",在比賽中總是使用出人意料的怪招來贏得勝利,咦!

  Dan不也是一個籃球教練嗎?那Nelson也可以說是籃球教練Nelson嚕?當然最後還是找到取名

  如此的真正用意,但是否編導或許也剛好運用這些歷史上著名的Nelson來潤飾這個故事呢?

  不管是有意或無心,至少這個劇本在意義傳遞的表現上是相當突出,具有深度的!!


  另導演利用運用手持拍攝的手法,成功捕捉布魯克林區居民的荒蕪與無助,特別是那手持拍

  攝獨有的搖晃,將主要演員的心慌與恍惚,表現得相當傑出,以及Ryan Gosling的精彩演技,

  無怪乎獲得去年奧斯卡金像獎最佳男主角提名,讓整部電影相當精彩,只是以多起事件平淡

  地堆砌出Dan和Drey的生活樣貌,可能容易讓人昏昏欲睡,當天觀影精神不佳的我,差點就蒙

  周公寵召,不過本部片確實把街頭生活,還有關於改變的民權運動及個人的掙扎,

  倒是深刻傳達,是一部不錯的電影




  --

  ◆ From: 59.105.17.220'
