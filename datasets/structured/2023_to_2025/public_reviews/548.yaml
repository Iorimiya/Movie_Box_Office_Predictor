title: 'Re: [好雷] 哥吉拉-1.0 近期很棒的哥吉拉'
content: '開

  是?

  你

  道

  拖

  成


  以前有看過1部日本A片

  是日本女間碟要套中國人軍隊裏的機密 用了對男人最慘無人道的辦法


  就是讓女上男下,男的被五花大綁

  女的拼死命的搖 讓男人高潮


  到男人快射時用絲線死命綁住男人雞雞不給射,直到套出機密後才讓男人射精


  沒有一個男人撐的下去


  來看看哥老怎死的


  ①哥老被沉氣筒五花大綁 嘴砲快射時立刻沉下去深海 真慘無人道 哥老HP-30%


  ②哥老又被充氣閥快速上升得潛水夫病  哥老身體當然撐不住 又被二邊拔河死命快提上

  水面 哥老HP-30%


  ③最後嘴砲又被口爆 又射不出來 終於身體反噬從內部亂竄


  想出這辦法的人類是最奸惡的 老學究完全不給哥老活路 死命不給哥老射~

  讓哥老死於自己的體內射線


  哥老死的極慘 又能復活 真的要從它體內提鍊出『偉哥老金槍不倒丸』 造福世界才是


  希望下一集能掰點 哥老造福世界的好事


  ..


  --'
