url: https://www.ptt.cc/bbs/movie/M.1701089883.A.E4A.html
title: '[  好雷] 哥吉拉-1.0 史上最好！'
content: '雷文防雷資訊頁

  無雷部分：

  借用漫威口頭禪，還給「史上最好」一點信任


  個人非哥粉日文初學者，今天單純旅遊空白時間就不抱期待看哥吉拉想說打發時間，沒想

  到有夠讚。


  這部超推薦非哥粉也要看，少了許多日本片特有的尷尬感，也完全不用懂任何背景設定。


  日本系二戰軍武迷也是必進場，你會微笑著看的。


  也是超級強烈推薦要在戲院看，音效 音樂震撼度非常爽。

  不愧是哥吉拉70年作品，隔壁100年的根本笑話








  以下雷









  設定在二戰末與二戰後，二戰武器打怪獸就是浪漫，主角就人生被哥佬搞的亂七八糟，誓

  死報仇。


  哥佬死光真的有史以來最強那種，噴在東京直接秀核爆等級畫面附帶後續的黑雨。哥佬也

  是不像以前很省著用，整個該噴就噴，而且這次馬的 前置動作帥歪，以前只有背鰭發光

  ，現在背鰭還會有特殊動作。


  以往日本片充滿 尷尬熱血、說教、尷尬搞笑、尷尬男女關係，這部….其實全部都有只是

  剩10%，感覺的到控制的不錯，可是畢竟是日本人還是必須加進去。


  小缺點：

  特效方面，雖然確實沒有好萊塢那麼強，哥佬眼睛有點出戲，但是好萊屋以外最頂，也沒

  有給你感覺特別省經費

  劇情發展實在太好猜，連我這日文N87都知道再來會發生啥事，不過怪獸片馬，不尷尬就

  好。

  結局…近幾年大家好像都不敢悲劇結尾，一定要沒死人，這就我說的尷尬感，如果悲壯的

  打贏，應該會更好。



  最後，我第一次日本看電影 真的發現大家乖乖看完工作名單，剛好這部最後放的也是 登

  登登～登登登～  戲院聽就是爽。

  離場時偷聽到日本人說：這次是站在人類角度啊～

  挺有趣的。

  台灣哥吉拉迷建議直接飛日本看了，不然你這哥迷會懊悔很久




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  --'
