title: '[討論]《熔爐》11/6(日)21.00好萊塢電影台首播'
content: "《#熔爐》11/6(日)21.00 #好萊塢電影台CH68 全台首播\n\n\n\n\n★《屍速列車》孔劉 演技經典代表作， 2011 年 9\
  \ 月 22 日韓國上映\n\n★ 改編自作家孔枝泳同名小說，令人痛心的真人實事\n\n★ 蟬聯三週票房冠軍，寫下最快達成300萬觀影人次的限制級電影紀錄\n\n\
  ★ 一部改變社會的電影，引發社會輿論不斷，促使韓國成立專案小組重審，修正性侵害\n\n防治法量刑標準，而本案真實加害者之一，於三審逆轉緩刑判決，改監禁12年。\n\
  \n 【熔爐】Silenced完整版電影預告請看\n\n\n你可以不相信，但這是聾啞學校發生的真實案件。\n\n我們都不願承認，但這故事是真的。\n\n來自首爾的美術老師仁浩（孔劉\
  \ 飾），前往霧津一聾啞學校應聘，然而校長李江福卻向\n\n他索賄5千萬韓元，為獲得職位養家的仁浩只好答應。任職後，本應天真活潑的孩子們，\n\n校園中卻不見絲毫歡愉的氛圍，洗手間時常傳來學生的尖叫聲。他抽絲剝繭後，發現校長\n\
  \n與老師們對學生進行各種性侵與暴力虐待，真相令仁浩感到痛苦與震驚，他決心聯合人權\n\n組織社工幼真（鄭裕美 飾）將學校老師和校長告上法庭！仁浩與孩子們一路奮戰，不是\n\
  \n為了改變世界，而是選擇不被世界改變…\n\n--"
