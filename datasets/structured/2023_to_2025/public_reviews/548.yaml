content: '《哥吉拉-1.0》是東寶製作的第 30 部《哥吉拉》電影，也是系列 70 週年紀念作。




  由《寄生獸》真人版導演山崎貴兼任導演、編劇和視覺總監，主演包括神木隆之介、濱邊

  美波、山田裕貴等人，劇情描述戰後日本受到重創，此時哥吉拉的出現為國民帶來更加慘

  烈的創傷。





  日本將於11/3上映，台灣檔期未定。


