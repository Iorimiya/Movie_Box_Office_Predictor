  人剛好在美國\n \n看板上哥吉拉-1.0被狂推\n \n連預告片都還沒看過就買了票進場\n \n \n \n看到的剛好是只播放為期一週的黑白版\n \n直接說感想\n\
  \ \n這隻哥吉拉大概是我看過戰力最強的吧\n \n那個原子吐息有夠誇張\n \n蓄力的時候 從尾端一節一節的背鰭發光突起\n \n抵達最後一節時 所有背鰭同時下壓\n\
  \ \n瞬間從嘴巴射出熱線\n \n不是像傳奇版本的持續放送\n \n而是像狙擊槍一樣一發入魂\n \n接著就是遠處的蕈狀雲直接長一顆出來\n \n當下看到這幕的念頭就是：哇靠也太帥了吧！\n\
  \n完全可以為了哥吉拉的射線二刷\n\n真心覺得日本拍的比傳奇影業版本有味道多了\n\n畢竟哥吉拉象徵的是日本對於戰爭造成的破壞的投射\n\n哥吉拉如天災般的存在反映出的是日本人對長崎廣島核爆的恐懼\n\
  \n這部分完全在傳奇版本的哥吉拉身上看不到\n\n除了完全不遜於好萊屋的特效之外\n\n劇情和人物刻畫也都遠勝過好萊屋花大把鈔票端出來的大片\n\n背景是二戰結束滿目瘡痍的日本\n\
  \n哥吉拉這時候出來雪中不送炭\n\n而是讓日本陷入更絕望的-1.0\n\n雖然哥吉拉在電影中出現的比例不高\n\n但份量拿捏得恰到好處\n\n每次出來就是宣告拎北要搞破壞了趕快認命\n\
  \n滿滿的壓迫和絕望感\n\n剩下大部分時間是人類戲份\n\n但因為劇情合理流暢不拖泥帶水\n\n你甚至會想要看這些人物在絕望情況下的心理狀態和反應\n\n主角把畏戰苟活的神風特攻駕駛員的罪惡感完美呈現\n\
  \n劇情更巧妙的利用了他曾經有機會阻止哥吉拉卻又畏縮而導致後續的死傷產生更大的罪惡感\n\n\n將他跟哥吉拉連結\n\n唯有阻止哥吉拉 他才能放下心中的罪惡\n\
  \n結束他心中從未曾結束的戰爭\n\n其他綠葉角色也都有各自的深度\n\n呈現出在戰後無奈的大環境下各自的生存之道\n\n這部片甚至還有哭點 依稀聽見有觀眾在啜泣\n\
  \n這真的不是好萊屋的怪獸片能比擬的深度\n\n\n哥吉拉-1.0在各方面都是上乘之作\n\n希望台灣有機會上映讓更多人看到優秀的作品\n\nP.S. 在美國的戲院聽到哥吉拉進行曲有種感動\n\
  ----\nSent from  on my iPhone 13\n\n--"
