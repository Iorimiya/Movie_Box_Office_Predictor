url: https://www.ptt.cc/bbs/movie/M.1738411508.A.992.html
title: '[好雷] 哥吉拉-1.0'
content: '補上票根



  第一張是在京都TOHO戲院看的

  第二張是在東京109影城新宿的ScreenX廳看的

  當時剛好是得到奧斯卡特效再映

  三面螢幕搭配坂本龍一監修的音響效果真的不是蓋的

  (我私心覺得日本劇院的影音效果比台灣好)



  第三張就美麗華IMAX影城

  難得台灣有上，當時我沒中文都看得如此開心

  超大螢幕看哥老太香了

  有中文跟海報當然要衝一波啊

  (還有櫃台賣哥吉拉商品可以買一波)




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  劇情版上前面的文章都介紹許多

  我講我最喜歡的部分

  銀座登陸毀滅這邊

  女主角上班搭乘電車哥吉拉來襲

  帥氣的將車廂插在軌道上像土匪般的打劫

  典子被哥吉拉咬住的車廂像阿湯哥懸掛在半空中

  死裡逃生的跟男主角浩一會合

  眼看哥吉拉被前往國會的坦克部隊壓制

  孰悉的BGM響起，藍色射線射出

  宛如原爆的衝擊波隨即摧毀著建築物

  女主角護著男主將他推向小巷結果就不知消失在何方

  鏡頭一轉覃狀雲緩緩升起，鏡頭由下而上帶到哥吉拉

  男主角無助的表情，天空下著黑雨

  絕望的怒吼



  我每次看到這邊都在哭

  心裡像獵人的小麥一樣想著

  "這麼幸福是可以的嗎"

  這樣的運鏡、特效、BGM、還有哥老

  不像好萊屋那種搞笑版是那麼感動粉絲的心XD


  另外每當看似哥吉拉被壓制，人類要勝利之際

  總是被哥老以一發射線解決(想想高雄號)

  在戰爭剛結束，日本政府無能又害怕引發國際情勢

  將人民推向第一線

  而這些小人物一生懸命的努力

  為了將來，也為了解決在戰場上的心魔

  成就了彼此

  本來以為要特工的浩一因為有彈跳座椅的關係

  成功打倒哥吉拉，也保住了一條命

  此時即時的電報得知典子生還住院

  一家人痛哭在醫院相聚

  "此時你的戰爭已經結束了嗎?"

  這個特效跟劇本真的是近期日本哥吉拉的經典

  (只是女主最後在脖子上的黑紋，應該是感染G細胞

  至於後續如何發展，就看有沒有續集了)


  當年台灣戲院沒上 我特別到日本去看

  這次台灣有上，而且票根還送香香海報

  這部片只看網飛版真的太可惜

  要是哥吉拉迷一定不能錯過


  最後補上哥吉拉丸井百貨東京專賣店-1.0版大型模型


  如果有要去買最後剛開就去，不然模型很快就賣完了

  衣服跟周邊商品還不錯 有空可以逛逛


  --'
