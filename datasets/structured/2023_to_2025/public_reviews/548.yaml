title: '[好雷] 哥吉拉-1.0 心得分享&結局分析'
content: '這部真的是目前最喜歡的哥吉拉電影

  人類戲份和哥吉拉戲分拿捏得恰到好處，完全不會有讓人感到煩躁的部分

  哥吉拉作為反派，才能凸顯渺小的人類要憑一己之力對抗巨大的怪獸

  許多人性都被放大，很考驗劇組這部分的描寫

  以下有雷















  二戰剛結束，敷島面對戰爭和第一次遇見哥吉拉都選擇逃亡

  所以他也選擇逃避了他與典子之間的關係

  雖然看得時候也會覺得為什麼敷島這麼孬

  或許他開了槍，在大戶島的技師可以免於一死

  但是敷島終究是一般人，個人認為責怪他有點過於苛刻

  （而且飛機上的砲火射向哥吉拉應該不會有什麼作用）


  其中面對船長的質問「為什麼沒有和典子結婚」

  「我的戰爭尚未結束」這句回應真的讓我覺得超感動

  短短的台詞就包含了敷島所有的心境

  包含避戰逃跑的後悔、面對哥吉拉的恐懼及創傷

  即使和典子相互扶持、相互喜歡

  卻仍然受過去所束縛，無法跨出下一步

  同時也在說出這句台詞之後，燃起對哥吉拉的恨意

  這不僅是宣布他與哥吉拉的戰爭正式重啟

  同時也是宣布要與自己的內心抗爭，正式面對懦弱的自己

  短短一句話就交代清楚整部電影的轉捩點，真的差點落淚


  最後哥吉拉落海，大家一同敬禮那部分

  我的解讀是眾人對共同對抗哥吉拉的小人物們的致上最高的敬意

  以及希望哥吉拉帶來的災難受難者能夠好好安息

  結局看似是happy end，看似典子感染了哥吉拉細胞，可能也活不久

  但是我認為向典子傳達心意也包含在敷島的「戰爭」中的一部份

  所以典子必須活下來，才能結束敷島口中的戰爭

  搭配典子最後一句台詞「你的戰爭終於結束了嗎？」

  前後呼應，真的很感人


  至於哥吉拉屍體重生以及典子感染細胞的部分

  應該是為了解釋為何典子能在銀座的那場風暴中生存下來

  （因為哥吉拉的傷口可以快速痊癒，所以典子應該是感染才活得下來）

  所以我猜這不一定是為了續集所埋的伏筆


  --'
