title: '[LIVE]【不存在的房間】STAR MOVIES全台首播21.00'
content: "想像你有記憶開始就一直住在一個小房間，或是想像你被當成禁臠多年來只能待在一個小\n\n房間...但當你們終於能夠逃脫，要面對的是怎樣的世界呢？\n\
  \n 預告請看\n\n\n\n                          【不存在的房間 Room】\n\n                  10月23日\
  \ 週日晚上9:00 STAR MOVIES全台首播\n\n本片獲得2016(88屆)奧斯卡最佳女主角，以奧地利真實綁架事件為藍本，改編自紐約時報\n\n十大小說的【房間】。《法蘭克》導演藍尼亞伯漢森執導，《她和她的小鬼們》布麗拉爾\n\
  \n森、《藍色小精靈》雅各特倫布雷與《變臉》瓊艾倫主演。由碧昂絲御用美術伊森塔布曼\n\n(Ethan Tobman)擔任藝術指導，伊森表示是以「太陽系」的概念，溫暖重現母子相依為命\n\
  \n的世界。《王者之聲：宣戰時刻》、《悲慘世界》丹尼柯恩操刀音樂。\n\n\n\n\n小小五坪的房間是傑克的全世界，他與媽媽裘依在裡面遊戲、生活，媽媽一直告誡他，這\n\
  \n狹小空間是個神奇的世界，傑克從未意識到這是座將他們監禁起來的牢籠，只有一個男人\n\n老尼克不定時會來補給生活必需品。就在傑克五歲生日時，媽媽為了給傑克正常真實的生\n\
  \n活，告訴他所有事實真相，兩人靠著母子間的默契與信任，策劃了一項大膽的逃脫計畫，\n\n但後來他們才發現現實世界才是最難面對的。\n\n\n\n--"
