title: '[好雷]人命是為未來而戰的哥吉拉-1.0 不是爽片'
content: '本片很特別，深深地省思發起那次大戰讓人民人命死於戰火

  是很少見在日本主流片中強調這個想法的

  顯然 現在日本的對二戰的想法 有明顯的轉變了

  另 本部片不是爽片 甚至應該說是劇情片了

  但描繪刻畫的不錯

  不要用爽片的心態看 才會比較正確


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~









  這部片 不是用爽片的手法去拍 沒像美國片 都會帶點幽默的橋段

  這片完全沒有，也沒有刻意營造怪獸將至的熱血感 或者打鬥的

  刺激感 有的是很寫實去刻畫經歷戰爭後殘破而弱小的平民

  如何去面對這個怪獸的天災 這片應該說是劇情片 有怪獸大場面

  的劇情片


  1.留著你 是為了我們的未來  濃濃的反戰理念

  本片很特別地直接指名神風特攻隊，男主背棄這個使命，又因懦弱導致

  一個維修班犧牲，被軍人與鄰居婦人唾棄，自己也因此被心結纏住

  其實維修班組長也說沒必要為這個命令犧牲，畢竟戰爭已不可挽回

  女主典子也對男主擁抱說著不必這樣犧牲 活著才重要

  本片充滿濃濃的反那次大戰的氛圍，透過那些市井小民說出來

  連博士都說 這個國家太輕視生命 坦克裝甲過薄 飛機無彈射逃生椅

  補給太少讓人去犧牲..

  頗有深刻去反省發起那次大戰對人民的傷害，是相當難得

  掃雷船的老鳥們對菜鳥 背著說沒參加戰爭才是好的 不讓你參加

  最後的行動，是把你留著為我們的未來

  顯然是直指那次大戰 毫無意義為了野心犧牲整個人民的性命

  人命 應該是留著為著未來而打拼努力的

  顯然新世代的日本人 不再有為團體為國家而盲目犧牲個人

  更會去檢視這樣的行動是否是正確與合理


  2.劇情片的敘事與畫面

  男主神木隆之介演出還不錯，其他角色也恰如其分，本片有不少文戲

  風格呈現也如同傳統日片 步調較慢 沒有現代那種國際化節奏較明快

  所以中間有一些稍嫌沈悶，剛開始會以為導演明明在怪獸場面取景調鏡

  都挺順暢，怎文戲又這樣傳統風格，但看完全片，可以了解到

  導演就是將這片做成劇情片 不是純娛樂爽片 想呈現戰後自己破敗的國家，

  國人的掙扎與努力，也想呈現懷舊風格，所以在文戲上 都走不激情而

  相對寫實的表現 鏡頭也多保持理性客觀的視角 來讓觀眾去感受回到

  那個年代的氛圍


  3.難得本格派怪獸特效片，怪獸場面明快不囉唆

  幾場怪獸的戲，鏡頭取景調鏡很精彩而有新意，很有現代風且相當明快

  而且不以爽片來鋪陳製造戲劇高潮，完全不刻意鋪陳哥那種怪獸將至

  的效果來娛樂觀眾，比如經典的株羅紀公園暴龍的地面腳步音效，搭配

  水杯的幾次波紋 然後來個暴龍的jumping scare突發式入鏡這種商業娛樂手法

  都是直接就突然進場出現 導演用寫實式的劇情片風格 來呈現怪獸

  的戲碼 就連收場 也是嘎然而止 不是讓你餘韻尤存地叫好

  在怪獸畫面方面 日本終於能拿出一個正宗的怪獸電影

  不再是被皮套特攝與微縮建築模型所綁住 弄出那個不像真實的怪獸娛樂片

  而是能真正運用實景與電腦特效呈現真實巨大怪獸降臨的正統本格大怪獸片

  能跟美國怪獸片並駕


  4.主題音樂展現的是日本人民的拼命精神

  本片哥老的主題音樂當然有出現，但是都不是哥老在大發神威的時候

  正在納悶時怎不放來展現哥老氣勢，卻在最後大戰時，哥老海上的強烈射線

  發出 產生如核彈的巨大爆光黑雲時，那些人在膽怯 但主事帶頭者絕對

  背水一戰就算犧牲也要拼下去，各船艦開始展開行動時，主題音樂此時

  才精彩展開，這個導演將哥的主題曲，轉化成那些日本人民的奮戰音樂

  做了一個精彩的重新詮釋與運用，相當不錯

  而我特別喜歡是在最後大戰，哥老出現時，導演所安排的那段開場音樂

  不斷地三拍子的音符的重複呈現 低吟地呈現那些人視死如歸為家園而戰

  的情感 此段也頗有如諾蘭常用的配樂風格 如星際效應在黑洞這段


  不斷重複的節拍慢慢堆疊營造出影片的緊張肅然的氣氛

  後段並搭配眾人的詠唱和聲 呈現出一股眾人的險峻壯烈感受

  相當喜歡


  期待這個導演能繼續接手下一部哥老的作品



  --

  劇情內容還OK吧 只是中間文戲稍稍多又節奏慢些

  但還是比正宗哥理想

  看到2/3時覺得不太行 整個看完瞭解到導演的目的與想法後

  是以劇情片要描述那個戰後殘敗人民的奮鬥精神 就能理解接受了

  覺得還OK吧 並沒到尷尬突兀的情況 神木有演出那種懦弱無力感

  導演更沒搞一堆什麼崩潰大叫狂奔 或者這個家園 我要來嘛毛路的說教爛芭樂戲碼

  唯一較差是那個小女孩 較無法帶起情感 哭戲也很僵 但小孩就算了


  動作唯一怪點在哥行走時的鏡頭 上半身特別僵硬 手跟胸頭直挺挺

  跟正宗哥那個移動花燈一樣，但面對物體要攻擊時又都很靈活

  所以這點很奇怪 不知是否為了致敬當年原版刻意弄的

  走路腳下壓跟地面的狂爆裂的確仔細看力量傳遞些許不太自然


  原來如此 沒看過以往原版 所以還好個人並沒感覺錯誤

  這次將主題曲修正偏見 回歸給抗哥的人民 而非哥的主題曲

  反戰不少 但講述到戰爭多以受害角度來講 像螢火蟲之墓 風起

  謝謝你，在世界的角落找到我 多以遭受大空襲或原爆受到傷害來展現探討

  直接明指這次大戰的等等作為 在主流大片中較少看到'
