url: https://www.ptt.cc/bbs/movie/M.1736208173.A.2DD.html
title: '[新聞] 《哥吉拉-1.0》終於在台灣上映了！1/29'
content: "《哥吉拉-1.0》終於在台灣上映了！1/29震撼登大螢幕　怪獸迷嗨翻\n\n\n怪獸迷等好久了！日本怪獸電影《哥吉拉-1.0》（ゴジラ-1.0）在2024年拿下第96屆奧斯卡\n\
  的「最佳視覺效果獎」締造歷史，也成為首部獲獎哥吉拉電影，還在全球創下1.07億美元（\n約33.65億新台幣）極佳票房，不過時至今日仍有許多亞洲國家都無法在戲院看到這部神作\n\
  上映，沒想到今（6）日秀泰影城無預警宣布，將在1月29日獨家上映，讓「負一哥」搬上台\n灣大銀幕。\n\n\n\n由日本導演山崎貴與東寶工作室所拍攝製作的《哥吉拉-1.0》，是哥吉拉系列的第30部電影\n\
  ，而這部電影一推出後就廣受好評，更勇奪第96屆奧斯卡的「最佳視覺效果獎」，成為70年\n以來第一次奪得獎項的哥吉拉，全球票房也相當驚人，直接賣破1億美元（約新台幣32億）\n\
  ，要知道這部《哥吉拉-1.0》拍攝成本僅1,500萬美元（約新台幣5億）。\n\n而且《哥吉拉-1.0》的全球票房，還不包含了廣大的亞洲市場，因為除了日本在2023年11月\n\
  上映之後，亞洲各國戲院一直都沒看到這部神作現身，直到2024年9月份，才在馬來西亞上\n映。\n\n且在2024年6月份，《哥吉拉-1.0》就登上了Netflix串流平台，雖然台灣觀眾也能看到了，\n\
  但怪獸電影就是要去電影院用大螢幕看才夠刺激，因此仍有許多怪獸影迷期盼「負一哥」能\n在台灣登上大螢幕。\n\n沒想到今（6）日秀泰影院無預警宣布，《哥吉拉-1.0》即將登陸大銀幕，「終於在2025等\n\
  到負一哥搬上台灣大銀幕！」秀泰宣布將在1月29日獨家上映《哥吉拉-1.0》，還會採用\n           大銀幕加強沉浸式體驗，而一般2D版也將同步上映，作為2025新年賀歲檔。\n\
  \n\n\n記者潘毅／綜合報導\n\n\n\n\n\n\n--"
