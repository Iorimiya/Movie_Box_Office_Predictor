url: https://www.ptt.cc/bbs/movie/M.1705025699.A.551.html
title: '[好無雷] 哥吉拉-1.0/C 黑白版'
content: '板上大大好～人在日本

  今天1/12日本上映黑白版的《哥吉拉-1》

  之前已經有看過彩色版，這次為了特典，特別來看黑白版，板上已經很多劇情討論，這邊就不多提了。



  無雷心得：

  劇情設定在二戰後，黑白版更顯得滄桑，哥吉拉出現後，也因為黑白的關係整個末日感又加重了一點，雖說是黑白版，但你仍然可以看清楚各個細節，後製處理的相當好，幾乎沒有糊在一起的片段，哥吉拉本人的身體線也更為明顯，真的是除了帥以外真是想不到其他形容詞，比起彩色版，我更喜歡黑白版，唯一缺點就是我只聽得懂5%日文XD



  電影票本人


  特典為雙面厚磅印刷

  分別是美國海報+日本版海報




  -----

  Sent from JPTT on my iPhone


  --

  當個正常人


  --'
