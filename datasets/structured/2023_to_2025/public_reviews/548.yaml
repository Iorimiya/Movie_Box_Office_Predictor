title: '[請益] 哥吉拉-1.0（有雷）'
content: '防雷
































  電影前半段我們可以看到男主角的生存宗旨就是“逃”

  逃離神風特攻隊任務、逃離開槍正面對決的時機


  那為什麼在第一次出海面對哥佬回家後，知道哥佬要往東京衝，還沒有馬上帶著女主和明

  子逃離東京呢？

  感覺還跟明子玩玩具也太悠閒了吧！


  --

  政府下了封口令，我還是會馬上帶著家人離開

  不會原地等死

  我的想法是，主角的個性本來就不是會把眾人的性命放在優先級的英雄（否則他在島上就

  會扣扳機了）

  但看得出來他是重視家人的個性，以他當時的狀況，他要說服的也只有女主，頂多外加一

  個鄰居

  也看得出來女主非常相信他，即使不相信，他當下應該做的就是“想辦法說服女主”

  而不是和明子悠閒地玩玩具直到哥佬上岸'
