url: https://www.ptt.cc/bbs/movie/M.1736220482.A.E8C.html
title: 'Re: [新聞] 《哥吉拉-1.0》終於在台灣上映了！1/29'
content: '《哥吉拉-1.0》於本月底上映印證了我先前發文所說的內容:


  「美日各自的哥吉拉電影不在同一年發行。」







  《哥吉拉-1.0》於日本2023年11月上映，同年12月登陸北美，


  而《哥吉拉與金剛:新帝國》則在2024年3月上映。


  原本的美國東寶僅打算於美1000間戲院上映一周，


  達千間戲院雖已是廣泛播映(wide release)，但比起強檔電影動輒近4000間戲院相比，


  哥吉拉的旅美生涯可說是相當保守。《哥》於北美票房一路長紅，客隨主便延長上映至


  隔年2/1日，若非提前下檔，哥吉拉本可抬頭挺胸地將這6000萬美金給掙了，對照後續接棒


  的美國本土《蜘蛛夫人》，好萊塢應該沒想過有天自個兒生意得看日本人臉色。




  《哥吉拉-1.0》導演山崎貴:「我們從未有讓美日哥吉拉在戲院競爭的打算」，


  既然如此，2024年3月後自然不能再打擾另外兩隻怪獸肆虐地球。



  《哥吉拉-1.0》當年於1月最後一周上映了黑白版『Godzilla Minus One/Minus Color』，


  因此若票房熱絡開紅，台灣未來應該有機會欣賞此特殊版本。查詢了下，《哥吉拉-1.0》


  竟於去年11月在美國偷回檔了一周…。



  同場加映: 《哥吉拉-1.0》片名的由來




  --


  --'
