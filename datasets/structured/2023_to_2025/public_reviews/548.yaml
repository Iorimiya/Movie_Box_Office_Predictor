url: https://www.ptt.cc/bbs/movie/M.1705660333.A.F8B.html
title: '[新聞] 還差超夢一點 !《哥吉拉 -1.0》成北美'
content: "還差超夢一點 !《哥吉拉 -1.0》成北美影史最賣座日片第二名，全球票房更衝破 1 億美元\n\n\n\n知名的日本電影怪獸哥吉拉，其電影系列最新作《哥吉拉\
  \ -1.0》，自 2023 年末在美國上\n映以來引爆不少話題更屢創記錄，全球總票房近日正式突破 1 億美元，不但已成為北美影\n史上最賣座的日本真人電影，也是北美影史上最賣座日本電影第二名──僅次於\
  \ 1998 年的\n日本動畫片《神奇寶貝劇場版：超夢的逆襲》（劇場版ポケットモンスター ミュウツーの\n逆襲，美國於 1999 年上映） 。\n\n1998\
  \ 年日本動畫片《神奇寶貝劇場版：超夢的逆襲》實在太過經典，2019 年曾重製為 3DC\nG 版電影上映。\n\n\n《哥吉拉 -1.0》不只是怪獸電影，也是探討戰後療傷的人文電影\n\
  \n《哥吉拉 -1.0》的電影故事背景，設定在二戰之後的日本，百廢待興的狀態下又遭到未知\n巨獸哥吉拉的肆虐，人們該如何重建一切？電影探索了戰後的哀悼、創傷以及復興等主題，\n\
  再加上一些心理驚悚要素，而標題裡的「-1」，則暗指日本在當時處於深淵中，而「0 」則\n為哥吉拉的到來。\n\n\n《哥吉拉 -1.0》導演山崎貴晒席尼墨菲合影照，促成哥吉拉與阿公相認？\n\
  \n《哥吉拉 -1.0》導演山崎貴日前飛往美國參加公開活動，在社群放上他與影星席尼墨菲的\n合影，讓網友又驚又喜，更讓怪獸迷大喊：\n\n「祖孫相認啦！」\n\n\
  原來是因為席尼墨菲在近期主演的話題電影《奧本海默》中，飾演二戰時期研製原子彈的美\n國物理學家奧本海默；而紅遍全球的日本電影怪獸明星哥吉拉，其誕生背景為二戰後受原子\n\
  彈爆炸影響，從被輻射污染的海域中復活的史前巨獸。如果沒有「原子彈之父」奧本海默，\n哥吉拉也不會從遭到輻射污染的海中甦醒，可說是另類的祖孫同框。\n\n\n\n\
  不過二戰帶給世界太多傷痛，哥吉拉電影的誕生也乘載著日本對戰爭與原爆的記憶，就有網\n友在山崎貴導演的 PO 文下方幽默留言：\n\n「哥吉拉真應該對著奧本海默說：『原來就是你噢……』」\n\
  \n\n《哥吉拉 -1.0》屢創票房佳績，更獲影評及諸多電影獎項肯定\n\n目前為止《哥吉拉 -1.0》在北美的票房表現仍不斷衝高，不但是繼 2019 年韓國電影《寄\n\
  生上流》後，首部扣關北美 5,000 萬美元票房門檻的非英語電影，也已經成功超越由吉勒\n摩戴托羅執導的《羊男的迷宮》，成為北美影史票房第六高的外語片；不僅如此，《哥吉拉\n\
  \ -1.0》已收獲國際多個影評協會「最佳科幻電影」獎項肯定，爛番茄網站上更有著高達 98\n% 的超高好評，看來這股怪獸熱潮還會持續發燒下去。\n\n《哥吉拉\
  \ -1.0》在日本及北美各地上映至今創下許多票房佳績以及各種話題，希望在台灣\n的我們很快也有機會能一睹為快。\n\n\n\n\n\n--"
