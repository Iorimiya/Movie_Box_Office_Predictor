title: '[好雷] 哥吉拉-1.0在家追觀後影好震撼'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  <主觀評分>

  美術風格：4.5/5

  配樂：3/5

  角色設定：4/5

  劇情：4.5/5


  <劇情摘要>

  第二次世界大戰後的日本滿目瘡痍，男主浩一身爲神風特攻隊一員

  因害怕戰爭而逃到一個島上，這次他第一次親眼見到「哥吉拉」

  而因為一次美軍在進行試核行動，間接讓哥吉拉身體發生巨大變異。


  再過一段時日，男主跟船員們在清理魚雷，卻意外發現哥吉拉有超強的自癒能力，同時也

  知道傷害如果來自內部，哥吉拉的自癒能力就會下降。


  爾後男主做了一件事情，成功摧毀巨獸

  故事展現了男主的勇氣與智慧，並反映戰後日本面對巨大挑戰。

  這部作品會有很多人推崇，也許是因為一個小人物，面對生活種種無力選擇逃離，對於自

  己無用之處，卻沒想到因為勇氣而面對恐懼，用於拼搏到最後吧


  (飛機衝入哥吉拉嘴巴時候，哥吉拉整個傻掉，不自覺我也跟著張嘴XD)



  <心得>

  會把這部列為片單主要是因為有獲得96屆奧斯卡金像獎最佳視覺效果獎

  奔著這殊榮，趁著閒來無事週末把它給追完

  原以為鋪陳會很久，沒想到開場不到五分鐘，哥吉拉就出現了！

  在黑夜當中能看清楚哥吉拉身上顆粒感，果然跟新電視有關

  MiniLED面板的電視讓整個黑暗畫面又更細緻了

  就好像哥吉拉就在眼前，皮膚粗糙感都能感受到，之前用舊電視看常常畫面會黑到會以為

  自己雙眼失明只剩下聽覺，完全看不到

  但這部哥吉拉在黑夜中能看清楚所有畫面細節，視覺效果真的沒話說

  果然是拿下最佳視覺效果獎的電影，再加上C845電視好加分！




  其中的對話鋪陳就比較平，但只要是哥吉拉憤怒怒吼時，視覺跟聽覺直接被衝擊，

  中低音喇叭讓聲音更厚實、震撼，視覺上因為有杜比音效特別加分

  雖然我原本想說不是好萊塢的特效跟音效，應該會很陽春。

  但我錯了，大錯特錯！！

  本片追求的就不是華麗而是真實二字！

  舉例好了，像是~


  1.火車的墜落感


  (光看螢幕都覺得自己要撞上了，加上強烈的撞擊聲，不自覺都會倒抽一口氣）


  2.房子傾斜的失速感


  (感覺像是在坐海盜船從高點到低點的癢感，這真的要透過大螢幕才能感受到）


  3.還有熱射線的能量感與颳起的強風




  (這一段超級精彩，千萬別眨眼！

  飛沙走石的視覺特效和立體感十足的衝擊波撞裂聲，能夠得獎真的實至名歸）


  就連爆破的畫面也是很細緻呈現！



  如果家中有高畫質的電視真的很推薦看，因為特效太真實

  讓我不得不佩服日本人的職人精神，講究的就是讓你身歷其境！

  很多電影在電影院看都沒有關係，但是電影看的時候就很假，當然除了片源問題，

  也許跟電影規格有關係吧！


  坦白說我覺得好看的原因，是因為整個畫面夠真實，連電影名稱都是負值，

  代表二戰後的日本已經傷痕累累，急需復原。

  而哥吉拉本身就是日本人對於核彈的恐懼的具象化，但通過男主的努力，讓日本開始恢復

  勇



  看完後真心覺得哥吉拉真的是恐龍界的國際巨星，過N年仍有人記得它

  很推薦列入片單~~~

  不過我看完有點小走心，好奇哥佬到底怎麼只露出上半身站在大海中的？？







  --

  才不是 這部真的很值得看，但認真說如果要在家看 電視畫質也真的會影響XD

  這部分我有查過 但是沒有看到~

  不過話說哥吉拉與金剛那部特效鏡頭也很多

  他就只是個人類呀~

  XDDD

  你一說還真的有點像

  這也是不同的感覺

