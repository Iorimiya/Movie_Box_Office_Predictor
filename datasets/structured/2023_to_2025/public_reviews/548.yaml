url: https://www.ptt.cc/bbs/movie/M.1746453091.A.658.html
title: '[好雷] 哥吉拉-1.0'
content: "推薦廣島吳港鐵鯨館\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n看到開頭清除水雷的內容就想到日本廣島鐵鯨館(海上自衛隊吳史料館)，\n\
  \n裡面詳細介紹日本二戰後如何清除圍繞在日本周邊的數萬顆水雷，久病成良醫，\n\n掃雷起家的海上自衛隊後來還到波斯灣協助清除水雷，可說是世界第一掃雷專家。\n\n\
  本作重點在反戰，哥吉拉作為核爆與軍人PTSD的象徵，\n\n要說打倒哥吉拉本身反而不是本片重點，計劃與執行各種可吐嘈的部分。\n\n機工長在跟主角講解炸彈引信開關時，我本來以為那其實是彈射座椅的開關，\n\
  \n機工長故意騙主角，以免一心赴死的主角知道後反而不去用。\n\n畢竟主角把女主的照片放在儀錶板上時，一副我很快就要去找你的覺悟樣。\n\n不過想想照本片演出直接講明也好，代表主角在出發前已經跟機工長和解，\n\
  \n他終於能像其他人一樣，為未來與生存而戰、而不是為赴死而戰。\n\n看到震電超興奮，不愧是日本二戰最夢幻的戰機，\n\n雖然二戰結束就因為渦輪噴射引擎而迅速過氣，無損它的傳奇色彩。\n\
  \n\n--\n謂鋼彈者，凌厲剛猛，無堅不摧，弱冠前以之與吉翁群雄爭鋒。\n加諸磁膜，一年戰終前所用，誤殺拉拉不祥，悔恨無已，乃棄之阿巴瓦空。\n運機無鋒，大巧不工，八七年持之直撞阿席馬。\n\
  九三年後，不滯於物，盾榴餌翼均可為劍，自此精修，漸進於無劍勝有劍之境。\n                                     \n\n--"
