url: https://www.ptt.cc/bbs/movie/M.1702397919.A.BDE.html
title: '[新聞] 成本才1500萬美金？《哥吉拉-1.0》導演'
content: '成本才1500萬美金？《哥吉拉-1.0》導演：有這麼高就好了


  Yahoo奇摩電影戲劇編輯部


  2023年12月12日 週二 下午12:23




  《哥吉拉-1.0》（圖：Toho）


  1. 哥吉拉新片在日美兩地都創下票房佳績。


  2. 外傳製作成本卻不到好萊塢版十分之一。


  3. 導演透露，製作成本其實比外傳數字低。


  【文／血紅蘭姆】


  《哥吉拉-1.0》導演山崎貴透露，比起外傳的一千五百萬美金，本片的製作成本其實更加

  低廉。


  由《永遠的三丁目的夕陽》系列導演山崎貴自編自導並操刀電腦特效，神木隆之介和濱邊

  美波主演，《哥吉拉-1.0》將片中舞台搬至1940年代後半上演，當日本人好不容易從敗戰

  後的百廢待舉中重新站穩腳步，東京竟然又遇上哥吉拉的來襲。




  《哥吉拉-1.0》（圖：Toho）


  自《正宗哥吉拉》以來睽違七年，東寶才又推出第三十七部《哥吉拉》系列電影，同時也

  是問世七十周年紀念之作。本片至今不僅在日本抱回了逾四十億日幣，更在北美市場攻下

  了逾兩千五百萬美金，一舉超越了1986年電影《子貓物語》，相隔三十多年後再次刷新日

  本真人電影的最高美國票房紀錄。


  相較於好萊塢版的怪獸宇宙，2014年電影《哥吉拉》耗費一億六千萬美金製作，《金剛：

  骷髏島》投入了一億八千五百萬美金，《哥吉拉II怪獸之王》砸下一億七千萬至兩億美金

  ，《哥吉拉大戰金剛》花上一億五千五百萬至兩億美金，坊間則盛傳《哥吉拉-1.0》只用

  了一千五百萬美金，沒想到竟在全球創下票房佳績。


  原因無他，畢竟導演山崎貴原本就是從電腦特效師出身。


  從《永遠的三丁目的夕陽》系列電影、《永遠的O》、《寄生獸》、《名叫海賊的男人》

  到新片《哥吉拉-1.0》，他除了身兼編導之外，往往也負責操刀片中電腦特效，因此深明

  如何壓低電腦特效成本，卻又不會顯得粗製濫造。


  關於《哥吉拉-1.0》究竟耗費多少製作成本，山崎貴先前曾在X上透露：「不可能只有十

  億日幣，成本比這更高。」


  至於外傳的一千五百萬美金（約二十一億餘日幣），山崎貴日前則在東京漫畫博覽會上感

  嘆道：「如果有這麼高就好了。」


  由此可以推想，《哥吉拉-1.0》的製作成本應在十至二十億日幣之間，跟前作《正宗哥吉

  拉》相差無幾，就日本真人電影來說已算是製作成本的上限，甚至不到好萊塢版怪獸宇宙

  的十分之一。


  沒想到本片竟能打造出摧枯拉朽的影像奇景，絲毫不輸給好萊塢大成本製作，也讓歐美怪

  獸迷聽到這個數字之後備感驚奇。


