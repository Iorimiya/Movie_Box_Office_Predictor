url: https://www.ptt.cc/bbs/movie/M.1717181475.A.3FC.html
title: '[  好雷] 哥吉拉-1.0'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  去年就非常想看哥吉拉-1.0了，結果半夜睡不著，起來滑手機看到這部上了Netflix，還

  搭配地震一起看。我充滿了臨場感。


  這部電影其實從頭到尾都沒有拖戲。

  大時代的小人物各種身不由己要為國捐軀的苦痛


  「有一類戰犯叫參謀。」

  「你們發動的戰爭，要我們來受苦」


  這是這部電影最大的控訴。


  劇情給予主角的人物弧光也相當出色。


  主角打扮起來有夠像錢小豪。真的不是找錢氏兄弟去拍嗎？


  主角一開始不願意當神風特攻隊為國捐軀，所以假裝戰鬥機出狀況，降落在大戶島的維修

  廠。維修廠的橘先生，只能說戲精，把推戰鬥員去死這點演得出神入化。又替自己工班的

  人陣亡哀號不已。是一個很明顯只認同自己維修班同事的一般人。


  主角回到自己被炸毀的老家，鄰居大姐的不體諒。誤打誤撞收留了漂亮女主角這點最不真

  實。


  怎麼就不是我收留濱邊美波？


  戰後主角應該是得到PTSD，從來沒有惡夢是跟家人有關，都是戰場，陣亡同仁。


  從事的工作是戰後的回收水雷。

  薪水高但是隨時會死。

  我不知道還有什麼工作適合戰敗的退伍軍人。


  船長

  學者

  小子

  這些人的樣子完全都在生活中會碰上。


  船長：日本最會的就是控制資訊

  學者：希望如此

  小子：我也想保家衛國


  完全符合身分還有階級自身處境的發言。


  用小人物的發言來控訴被推上前線擋火力的無奈。


  在親眼看到巨艦被哥吉拉簡單摧毀。眾人開始失去希望。也很有日本人碰上美軍火力開始

  絕望一樣。每一點都在重現自己最痛苦的騙自己會贏這個過程。


  只有沒經歷過戰爭的人才會喜歡戰爭。

  船長跟學者的共識，至理名言啊。


  這是一部快人快語又讓人快樂的電影。


  文戲對話水準高又通俗易懂。

  是8歲到80歲能觀賞的好電影。


  為什麼我不討論女主角？


  因為我的心得是我要去哪裡才能撿到濱邊美波？



  --

  剛剛才看完，還處於回味階段（茶）


  配地震一起看很有臨場感。'
