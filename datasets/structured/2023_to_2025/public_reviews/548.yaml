  \n美術指導文念中、王牌音樂製作人陳建騏。耗資八千萬台幣遠赴北極圈實景拍攝，共譜年\n\n度最浪漫「凍」人、高顏值愛情喜劇。充滿北國浪漫情調的【我的蛋男情人】探討正值適\n\
  \n婚年齡的OL梅寶，在等待真愛出現前先行凍卵，卻遇上了堅持新鮮為料理原則的帥氣餐廳\n\n主廚阿始，當「冷凍」的深情遇上「新鮮」的熱情，愛情究竟有沒有保存期限？\n\
  \n\n\n　　【我的蛋男情人】故事描述現代都會女性努力工作、愛情卻亮起紅燈。只是想要幸福\n\n的小小渴望，卻必須面對與時間賽跑的困境。梅寶相信冷凍食品可以安慰許多無法享受新\n\
  \n鮮食物的人，也期待著愛情能像被冷藏的食物靜止住保存期限。深信冷凍能為自己的青春\n\n爭取時間、尋找真命天子。偏偏卻遇上新鮮至上，對愛情只相信此時此刻的阿始，當「冷\n\
