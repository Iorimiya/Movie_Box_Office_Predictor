url: https://www.ptt.cc/bbs/movie/M.1703133872.A.1F1.html
title: '[雷] 哥吉拉-1.0觀後心得'
content: '哥吉拉-1.0真的好看了，從中段就開始非常感人，直到結局。在YouTube有瞄到有日本的youtuber 說這是超越庵野秀明「正宗哥吉拉」的作品，我本來還覺得怎麼可能超越神作，但在日本的imax
  看完，確實感到蠻多地方比正宗哥吉拉更為卓越。


  故事背景設定在1948年日本剛戰敗後，在百廢待興的廢墟之中，面臨了「哥吉拉」這個未知的天災，一群從二戰中生還，已經從海軍退役的市井小民們，不想再次面對戰爭，不想白白送死，但又為了要解決大家面臨的威脅，不得不挺身而出，電影中很完整的描繪出這種退伍軍人的矛盾心情。


  另一個很大的亮點是：當主角要重新駕駛戰鬥機時，身邊的人說「但是這一台有一點特別  」果不其然，劇中出現的是「夢幻戰機」前翼機「J7W1震電」。震電的長相很特別而且優雅，看它跟哥吉拉對戰真的是一大樂趣。



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  故事是一個從神風特攻脫逃的飛行員，目睹地勤戰友在1945年被哥吉拉殺害殆盡後意外生還，但從此渾渾噩噩的過著生活。直到哥吉拉再次出現，傷害了他的家人以及整個銀座之後，他才毅然而然再次挺身而出面對挑戰，在眾人努力下一起成功擊敗哥吉拉。


  故事是happy ending，最後主角們全部都生還，但我還是感受到裡面滿滿的「特攻精神」，一種「我也不想死，但如果是為了家人眾人非死不可的話，我也不會逃避」的氛圍貫徹整部電影。劇中有一段是指揮官說「明天要出擊了，大家今天早點回去，好好陪陪家人」，就很有這種氣氛。雖然之後的台詞是接「過去的日本軍隊太過輕視人命，我們這次的作戰是目標全員生還不會有人犧牲」，但我還是隱約的感受電影論述了兩方，光榮犧牲面跟覺得生還面，以現在的政治正確來說，導演願意幫兩邊都講好話，就已經有點贊揚犧牲奉獻精神的味道了。


  更進一步聯想，我總覺得導演講的故事，一群「凡夫俗子」面對哥吉拉的無差別破壞，一邊希望死傷不要到自己頭上，另一方面又覺得自己責無旁貸，要拯救家人與國家不出擊不行的故事，講的其實就是二戰時面對美軍的日本軍人，那種面對對手絕對優勢的絕望感，以及不得不挺身而出的矛盾心情以及勇氣。這種「暗暗包藏讚揚自己民族歷史」的題材真的不錯，很發人省思。


  -----

  Sent from JPTT on my iPhone


  --'
