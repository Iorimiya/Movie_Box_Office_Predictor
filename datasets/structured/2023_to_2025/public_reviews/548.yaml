url: https://www.ptt.cc/bbs/movie/M.1698980627.A.59E.html
title: '[好雷] 哥吉拉 G -1.0'
content: '剛好在日本旅遊最後一天，決定上飛機前衝一波8:50第一場，先說結論，如果你喜歡1984

  哥吉拉、真哥吉拉，這類型的，只能說這部片必看！




  —-以下有雷—-














  來自日文能力大概初學者的簡易心得



  一、沒有另外一隻怪獸，存粹就是當初哥吉拉的創作理念「災難」。


  二、滿滿的絕望感，戰後什麼都沒有的時代，好不容易慢慢建立起來的城市，一瞬間就全

  滅的感覺。


  三、這次的熱線回到最常見的藍色，但威力設定覺得滿合理的，外觀類似平成哥吉拉，但

  威力類似真哥吉拉，而且還加碼，熱線的盡頭直接就來一顆原子彈，加上衝擊波，所以不

  只是熱線的正面爆炸，而是真的像原子彈一樣會有大範圍的衝擊波。


  四、經典配樂應有盡有：哥吉拉出場音樂，防衛軍出擊曲（登登登～登登登 那首）在日

  本戲院聽到直接起雞皮疙瘩。


  五、人類第一次以合乎當時代的軍事力量設定，打贏哥吉拉，也是少數第一次看到哥吉拉

  被炸成碎片的電影。


  六、哥吉拉不會死。


  希望台灣可以上，我一定最少五刷！





  PS這次還去了淡路島的哥吉拉園區，哥粉也是一定要來玩啊啊！突入作戰超帥！




  --'
