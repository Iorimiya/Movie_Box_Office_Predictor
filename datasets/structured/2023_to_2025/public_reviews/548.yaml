title: '[新聞] 《哥吉拉-1.0》續集《哥吉拉-0.0》 北美11'
content: "《哥吉拉-1.0》續集《哥吉拉-0.0》 北美11月上映\n\n\n《哥吉拉-1.0》劇照。（東寶提供）\n\n【大紀元2026年01月11日訊】（大紀元記者葉子杰編譯報導）今年哥吉拉迎來上映71周年\n\
  紀念日。東寶公司近日公布《哥吉拉-1.0》（Godzilla Minus One，2023）續集名為《哥\n吉拉-0.0》（Godzilla Minus Zero），將於11月6日由GKIDS在北美發行。\n\
  \n據《Godzilla》《Gkids》報導，3日，在東京舉行的2025年哥吉拉電影節上，東寶公司正\n式公布怪獸之王哥吉拉系列下一部電影的片名為《哥吉拉-0.0》，並將於今年11月3日在\n\
  日本上映。9日，東寶和GKIDS公司宣布，GKIDS也將在北美發行這部新電影。同樣由山崎\n貴（Takashi Yamazaki）執導、編劇並負責視覺特效。官方也發布了續集電影的海報（點\n\
  這）。\n\n\n《哥吉拉-1.0》於2024年榮獲第96屆奧斯卡金像獎最佳視覺效果獎。雖然續集《哥吉拉\n-0.0》劇情細節尚未公布，但已在東寶開拍。由Robot公司負責製片，曾負責原版電影視\n\
  覺特效山崎駿的公司白組（Shirogumi），這次也再次參與製作中。\n\n據《World Of Reel》報導，這部新電影預算更高，規模更大，並且已在三個月前悄悄開\n\
  拍。雖然一度傳言它是不是直接續集，根據山崎駿最近的言論暗示，這部片確定會延續《\n哥吉拉-1.0》的劇情脈絡，並進一步深化核心角色的發展。這明確表明《哥吉拉-0.0》就\n\
  是直接續集。\n\n《哥吉拉-1.0》的故事發生在二戰後的日本，當時日本剛從戰爭的陰影中恢復過來。故事\n圍繞著前日本海軍神風特攻隊飛行員敷島浩一展開，他在一次行動中遭遇哥吉拉襲擊日軍\n\
  基地後，一直飽受創傷後壓力症候群（PTSD）的折磨。他努力想為當初自己因怪獸來襲的\n無所作為贖罪。\n\n隨著哥吉拉登陸日本，敷島浩一新認識的大石典子和他們救下的小孩，全都岌岌可危，他\n\
  決定直面心魔，阻止哥吉拉的威脅。雖然最後在怪獸體內引爆炸彈後，哥吉拉沉入海底收\n尾，但牠未徹底消失，片尾畫面還看到牠在沉入漆黑深海時身體開始再生。\n\n在評分方面，美國網路電影資料庫（IMDb）、影評網站「爛番茄」（Rotten\
  \ Tomatoes）\n和「影院評分」（CinemaScore）是評估電影好與不好的參考依據之一。IMDb滿分為十分\n，截至今日，《哥吉拉-1.0》獲得觀眾7.7的佳評；爛番茄影評員與觀眾分別給予99%及\n\
  98%接近滿分的新鮮度好評；獲得影院評分「A」的好評。\n\n《哥吉拉-1.0》製作成本約1,500萬美元，北美票房收入約為5,700萬美元票房，成為史上\n\
  票房最高的日文真人版電影。全球票房收入約為1.13億美元。\n\n責任編輯：茉莉\n\n\n\n--\n 神韻晚會觀眾反饋（2025）\n\n--"
