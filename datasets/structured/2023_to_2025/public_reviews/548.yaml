title: '[-1.0雷] 哥吉拉-1.0'
content: "一般的片 給0分已經很慘了\n\n這部我給-1.0分 也算切合他的片名\n\n-防雷頁-\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n先講優點好了\n\n女主角長得不錯 有點像年輕時、鼎盛時期的俞小凡\n\n更像剛出道時的周子瑜\
  \ 而且更清秀\n\n  板友的圖借用一下\n\n但戲份實在太少了點\n\n\n沒了 接下來講缺點\n\n首先是哥吉拉\n\n爛到炸 整部片原子吐息吐三下這你敢信？！！？　\
  \ 騙錢啊~～～？？\n\n好萊塢　哥吉拉x金剛:新帝國那隻　吐了都不知道幾下了　打冰魔還連吐　射給觀眾爽\n\n你整部片只射三下　一發還用來自殺沒射出來　廢到笑\n\
  \n幽助一天都能射四發靈丸了你卻只有三發搞屁啊？　\n\n\n然後是男主角　我以為是鬼滅的哭柱　竈門炭治郎　\n\n跑過來客串了　在那邊大哭大叫衝殺毀？　看得有夠煩躁　\n\
  \n老婆被噴不見後　下黑雨那邊　他在那邊憤怒的大哭、怒吼　\n\n我還以為他跟特南克斯一樣要變超級賽亞人了　結果什麼都沒有\n\n咁...爛到笑　一整個出戲　\
  \ XDDD\n\n\n再過來是劇情部分　\n\n既然叫哥吉拉　那強度應該不能差太多才對\n\n結果這版的哥吉拉　在二戰後日本那個殘廢一般的武力　居然能把它擺平　\n\
  \n讓哥吉拉得潛水夫病來擊敗他？？　這什麼搞笑點子？\n\n我看場景設定　那年代感落後的可以　和江戶時代的街景差不了什麼了\n\n居然能打贏哥吉拉　那這隻哥吉拉強度實在有點弱啊　和好萊塢比差太多\n\
  \n然後女主角被衝擊波爆震噴那麼遠\n\n用常識都判斷得出來　那一定死定了　摔成肉醬都有可能　最好的情況也是全身骨折而死\n\n卻能活下來？　只有美隊和冬兵才有可能\n\
  \n這肉體強度卻又太離譜了　\n\n\n\n算了算了　這部片的嘲點太多\n\n喜歡看那種奧特曼打怪獸的小朋友　可能會很愛吧\n\n我已經過了這年紀了\n\n\n\
  　　　　　　　　　　　　（完）\n\n--\n   可以 我尊重你的見解 至少理性 底下那幾個噓的學著點\n   我是不想講那些人是托啦... 人身攻擊不太好\
  \ 我也不想被桶\n   就像好幾年前查克史納德被一些人猛吹 我也早有先見之明\n   結果證實了那些人果然是托 查導失勢後那些人全不見了 可悲\n   哥粉會出征你\
  \ 低調點\n   就有一種奇怪的節奏和語調 可能和我們被好萊塢電影養大有關係\n   美國電影看習慣的人同樣看不習慣法國片\n   你這算人身攻擊喔~~ 保重捏\
  \  :)\n   原來她已經被注射了哥吉拉的超級基因血清？！？？！\n   哈哈 別人在討論電影 你迴向到網友本身 素質可見一斑\n   你我更不意外\n　\
  \ 美版哥吉拉連放震撼多了\n   我推薦你去看一部滿有意思的片子：蠢蛋進化論\n   我就知道有人會問這個 嘻嘻\n   文化差異 日本人在演戲時講話語調本來就略顯浮誇\n\
  \   日常生活我就不知道了\n   奧斯卡根本笑話 奧本海默這種糞片也能得最佳影片 XDDD\n   誰想進電影院看一個多小時的聽證會？\n　 再過一百年也會是個笑話\n\
  \   還有人進電影院二刷聽證會\n   笑死人了 國王的新衣現代版\n   哈哈 就這種素質還想要我釣他？ 笑死人了\n   日本人演技一向並不優啊 這我不會太苛責\
  \ 且有文化差異的部分\n   笑死人了\n   樓上大帥哥\n   !!! 怎麼會!!! 難道我真的錯了"
