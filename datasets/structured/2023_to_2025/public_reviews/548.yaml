url: https://www.ptt.cc/bbs/movie/M.1706029353.A.E12.html
title: '[討論] 有關《哥吉拉-1.0》在奧斯卡的資格問題'
content: '先恭喜日本今年奧斯卡再創佳績！《我的完美日常》、《ゴジラ-1.0》和《蒼鷺與少年》

  都獲得提名！（可惜《鈴芽之旅》了Q）




  不過關於《ゴジラ-1.0》的資格我有一點滿好奇的想跟大家討論看看～


  《ゴジラ-1.0》美國在去年底上映，所以有資格角逐所有一般劇情長片的項目，因而入圍

  了最佳視覺特效。不過這部片在日本是於 11 月 3 日，並不是本屆「最佳國際影片」的

  資格範圍內，而是 2025 年的，所以我很好奇，《ゴジラ-1.0》已經角逐過一般其他獎項

  ，這樣日本明年還可以推派這部去角逐「最佳國際影片」嗎？因為正常來說，被國家選為

  代表的作品，即使當年度沒在美國上映，也可以競逐全部的劇情類長片獎項，這樣如果

  2025 年日本推《ゴジラ-1.0》的話，好像會有點矛盾？或是有規章規定就因而喪失報名

  國際影片的資格了呢？


  不過雖然還沒機會看《ゴジラ-1.0》，我猜日本推《邪惡根本不存在》的機率還是比較高

  啦，這部真的拍得很好！超好看！




  --'
