url: https://www.ptt.cc/bbs/movie/M.1718035378.A.E05.html
title: '[好雷] 哥吉拉-1.0'
content: "今年 2 月去了一趟東京，回台灣前最後一天的上午，抽空進戲院看了《哥吉拉-1.0》。\n\n.\n這是我今年最難忘的觀影體驗。\n\n.\n縱使沒有字幕、對日文也一知半解，但完全不影響對這部片的享受。日本的近代史，就是\n\
  連串與天災人禍搏鬥的生存史。因此比起美國卡通化的大蜥蜴，日本電影的哥吉拉不只擁\n有強大破壞力，更是帶來恐慌的荒神，祂值得被敬畏、也必須傾力封印，這才是哥吉拉電\n\
  影的精神 – 在歷經原爆、天皇投降後，日本的國力與建設趨近歸零，巨獸帶來的災厄將\n讓民生跌入更悲慘的地獄，生存以上、生活以下，就是所謂的「-1.0」。\n\n\
  /\n\n我喜歡《哥吉拉-1.0》，正是導演山崎貴很有層次地揭示這個「從 0 到 -1」的過程 。\n\n.\n全片以神木隆之介飾演的敷島浩一為主角，理應衝鋒陷陣的神風特攻隊成員，卻因為貪生\n\
  得以苟活，首先剝除了他身為軍人的榮譽感；接著又因為怯戰，無助看著夥伴慘遭哥吉拉\n滅團，返鄉後則發現父母在空襲中喪命，倖存者的負罪感讓他活在陰影之下；後來與同樣\n\
  失去雙親的婦女典子（濱邊美波 飾）和她收留的孩子相依為命，典子卻在哥吉拉肆虐銀\n座時為了救他而甘願犧牲。\n\n.\n敷島的角色成長，就是以哥吉拉 / 戰爭為軸心，先是因逃避而背棄了個人榮譽、全國存\n\
  亡、進而痛失家庭，卻也喚醒他面對命運的勇氣，扛起全國存亡、找回個人榮譽，在絕望\n中踏上充滿贖罪色彩的復仇之路，看似刻板老套，但對一部以二戰為背景、怪獸為本體的\n\
  災難電影而言，這樣的英雄旅程已然非常足夠。\n\n.\n置之死地而後生的不只敷島，還有整個日本。片中不只一次出現「日本重建的速度可快了\n」這樣的台詞，但重建得再快，也禁不起原爆空襲、怪獸登陸的接連肆虐，日復一日的重\n\
  建與消耗，是表面上的絕望。更深層的意涵則是二戰後日本受到美國管轄，去軍事化的虛\n弱國力該如何與哥吉拉抗衡？\n\n.\n因此，比起為國犧牲這種看似光榮、實則虛無的成就，《哥吉拉-1.0》訴求其實是很個人\n\
  的：「好好活下去」看似煽情卻不俗濫，在理想化的結局之下，挖掘了對軍國主義遺毒的\n反思與反戰思想，在國家試圖張牙舞爪對外侵略的時刻，犧牲的往往是平民，某些時候讓\n\
  我想起宮崎駿的《風起》，意外動人。\n\n/\n\n事實上，這不是導演山崎貴第一次拍哥吉拉 — 早在 《Always 再續・幸福的三丁目》，\n他就用動畫生成一段哥吉拉毀滅電訊塔的戲中戲，代表具體化恐懼並與之並存的概念，已\n\
  經成為日本人戰後生活的一部分，和本片相映成趣。毫無疑問，本片是山崎貴的集大成之\n作：充滿負罪感的飛行員來自《永遠的 0》，鄰里扶持的人情味則延續《永遠的三丁目》\n\
  系列，將兩者合而為一，套上怪物電影的外殼，就是《哥吉拉-1.0》。\n\n.\n但有了人情味與反戰思想，不代表《哥吉拉-1.0》會是一部優秀的商業電影。本片最出色\n\
  的部分，多跟哥吉拉的現身有關。\n\n.\n山崎貴不諱言《哥吉拉-1.0》有偷師《侏羅紀公園》，因此儘管哥老露面的篇幅不長，但\n總是先透過周邊景物（比如典子在電車玻璃倒影看見哥吉拉逼近，簡直是後照鏡反射暴龍\n\
  追逐的翻版）拉長山雨欲來的緊張感，伊福部昭經典的「登登登登」主題曲〈哥吉拉的動\n機〉只播了兩次，卻都精準地在巨獸登陸的時刻響起，適時將壓迫感催到極致。片尾則以\n\
  \ 1954 年首部《哥吉拉》主題曲搭配招牌吼叫收官，作為 70 週年致敬之作堪稱完美。\n\n/\n\n這兩年堪稱日本影視在歐美市場的大反攻，除了《哥吉拉-1.0》叫好叫座，35\
  \ 人的精簡\n人力、以綠幕搭配 CG 的驚人效果拿下日本影史第一座奧斯卡最佳視覺特效獎，此外《蒼\n鷺與少年》讓吉卜力抱回第二座小金人、影集《航海王》成功洗刷「漫改慘遭真人化」污\n\
  名、黑馬《幕府將軍》則打破 FX 全球觀看數紀錄，都讓日本面對近年強勢的韓流，仍能\n以多元面貌在流行文化站穩一席之地。\n\n.\n至今還是很慶幸當初在日本看了《哥吉拉-1.0》，光是在大銀幕看著哥吉拉的背鰭一片片\n\
  立起、發出藍光蓄能噴發原子吐息的震撼，就已經值回票價。\n\n.\n如今終於盼到在 Netflix 上架，雖然家庭劇院無法與戲院相比，但小螢幕絲毫無損精彩\n\
  。\n\n.\n要怪獸有怪獸，論破壞有破壞，就連這類型常被詬病的人類劇情，也都圍繞著哥吉拉這個\n等同天然災害與人為戰亂的夢魘開展 – 有的因為戰火痛失家人、成為彼此扶持的伴侶，\n\
  有的試圖回歸日常、和同事建立革命情感 – 觀眾則跟角色一樣，擔心得來不易的平靜會\n被摧毀，而被難以忽視的壓迫感牽動情緒，非常推薦《哥吉拉-1.0》。\n\n\
  更多影評推薦，歡迎按讚追蹤：\n\n\n--"
