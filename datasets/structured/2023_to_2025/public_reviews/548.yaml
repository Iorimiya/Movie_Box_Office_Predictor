title: '[雷] 哥吉拉-1.0'
content: '剛從東京回台


  坐ANA 正好上面有哥吉拉-1.0


  去程時正好看到神木隆之介在觀察詢問震電的細節就下飛機了


  之後回程從那邊看到電影結束


  正好去新宿歌舞伎町東寶戲院裡 哥吉拉-1.0應該是已經下片了 看了電影時刻表並沒有播映





  神木隆之介在本片飾演一位生還的神風特攻隊隊員 但是在小島遇到哥吉拉時因為怯戰而導

  致島上的技工僅剩一人活著 其他的人則是全數罹難 （我當時在想如果那些技工不要開槍，

  哥老會不會自己離開而不傷及無辜？）


  之後回到日本東京的神木因為身為神風特攻隊沒有為大日本帝國犧牲自我而被鄰居（安藤櫻

  飾演）視為恥辱


  在巡視四周時撿到濱邊美波以及不是她生的棄嬰，把濱邊美波領回家後，一個沒結婚嬰兒也

  沒有血緣的三人便成為了一家三口的一家人


  之後神木加入了吉岡秀隆和山田裕貴還有佐佐木藏之介的海上掃雷隊


  沒想到這艘木造的小船在一望無際的海上居然遇到了哥吉拉 而哥吉拉因為吸收了美軍在比

  基尼環礁的核試爆而產生更強大的能力


  在海上他們嘗試投擲地雷到哥老嘴裡失敗後 高雄號重巡洋艦來幫助他們 一開始還佔了上風


  結果哥老背鱗升起 背部發起藍色的光 嘴巴蓄力 直接一發原子吐息把巡洋艦送走了 整艘船

  的士兵都罹難了


  畫面一轉 哥老上岸東京 直接進攻剛重建的銀座 神木隆之介聽到廣播哥吉拉進攻銀座正在

  大肆破壞 於是趕到銀座去找正在銀座的美波


  美波在銀座吊在電車扶桿上的畫面呈現很經典 後來一躍而下跳進河裡


  在銀座躲過第一波攻擊的美波與神木會合後依舊沒躲過原子吐息 在許多物體集合的衝擊衝

  向兩人時 美波捨身救人將神木推向一旁小巷內 犧牲了自己


  這便是神木下定決心要和哥吉拉決一死戰的關鍵


  哥吉拉的作戰策略是由吉岡秀隆飾演的博士策畫


  作戰兵分多路 但是剛開始一艘戰艦就在他們眼前飛過去然後爆炸 哥老剛開局已經打飛一台

  戰艦了


  一開始的計劃想要將哥老沈在海裡 但是計畫失敗了 雖然哥老再次浮起來 但是已經造成傷

  害 然後山田裕貴帶領來支援的艦隊將哥老拖行並拉他起來哥老站起來後便想對戰艦群用原

  子吐息 想帶給艦隊傷害 但是這次因為被氣壓傷到而造成傷害的哥老 神木隆之介開著震電

  用神風特攻隊的自殺式攻擊直接撞進哥老的嘴裡造成原子吐息無法射出


  正當大家以為神木已經陣亡的時候，沒想到他用上震電上的彈跳裝置彈射出飛機 並用降落

  傘降落在安全地帶


  之後安藤櫻飾演的鄰居帶著明子（小女孩）和一封電報來找神木


  接著場景來到醫院 原來濱邊美波並沒有死亡 而是受了重傷躺在醫院接受治療 這邊是一大

  淚點


  一家人重逢喜極而泣 濱邊美波也問神木你的戰爭終於結束了嗎？


  神木這次不娶人家回家不行了 但濱邊美波已身受重傷 恐怕也來日不多了


  最後一幕則是哥老的肉塊在海底結合中 等待重生的機會 估計還會有續集



  這部真的很好看 哥老的破壞神形象給觀眾很大的震撼 也有感動的親情戲和夥伴的羈絆 也

  有反戰的要素 還有滿滿的大場面 很難相信1500萬美金就能做出這樣完成度之高的電影


  可惜到東京時戲院皆已下檔 無法體驗在大銀幕觀賞的震撼


  --




  飛機上看不太清楚 後來看版友的文章好像有說到


  只有英文字幕 但我覺得翻譯的有點太簡化 會省略很多日文


  吉岡秀隆我感概他變太老了 以前五島醫生診療所那帥氣的他回不去了





  那我沒查到那家'
