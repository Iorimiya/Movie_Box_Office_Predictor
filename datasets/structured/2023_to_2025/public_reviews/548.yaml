content: '《復仇者聯盟3》北美首日票房1.059億美元


  《復仇者聯盟3》北美首日票房1.059億美元（含3900萬美元週四提前場），成為繼《星際大

  戰7》（1.191億美元）和《星際大戰8》（1.047億美元）後又一部單日破億的電影。


  值得注意的是，以1.059億美元計算，《復聯3》週五日場票房為6800萬美元，基本上達到了

  北美週五日場理論上的極限水平（就單片而言）。


  週五日場票房最高的一些電影：


  《侏羅紀世界》，首周五日場6345萬美元（不含1850萬美元提前場）；

  《星際大戰7》，首周五日場6212萬美元（不含5700萬美元週四提前場）；

  《復仇者聯盟》，首周五日場6211萬美元（不含1870萬美元午夜場）。

  此外無一影片週五日場票房破6000萬美元。


  迪士尼官方預估《復聯3》北美首周末3天票房為2.25到2.35億美元（含3900萬美元週四提

  前場）


  ---------


  全球上映2天票房累計9500萬美元


  【英國】週四首日640萬英鎊（約890萬美元），位居迪士尼歷史第3，僅次於《星際大戰7

  》的970萬英鎊和《星際大戰8》的750萬英鎊。


  【巴西】週四首日480萬美元，打破由《正義聯盟》（420萬美元）保持的巴西首日票房紀

  錄。


  【阿根廷】首日觀影人次16.5萬位居影史第2。


  【中美洲】、【智利】、【秘魯】、【玻利維亞】和【阿拉伯】的首日票房紀錄全部被刷

  新。【德國】、【奧地利】、【波士尼亞】、【捷克】、【愛沙尼亞】、【希臘】、【匈

  牙利】、【中東】、【波蘭】、【塞爾維亞】、【斯洛伐克】、【斯洛維尼亞】和【烏克

  蘭】的超級英雄電影首日票房紀錄全部被刷新。


  【韓國】公映2天累計1140萬美元，反超【澳洲】的1000萬美元成為《復聯3》目前第一大

  海外票房倉庫


  【法國】2天累計650萬美元；【義大利】2天累計510萬美元；【菲律賓】2天累計470萬美

  元；【泰國】2天累計410萬美元；【印尼】2天累計360萬美元。


  於本週五在除【俄羅斯】和【中國】外的所有市場公映，全球首周票房有望衝擊5億美元大

  關。

  ---------


  deadline 4/27-4/29的北美票房預測


  《復仇者聯盟3》更帶動《黑豹》票房從第8名上升到第5名






  --


  日本


