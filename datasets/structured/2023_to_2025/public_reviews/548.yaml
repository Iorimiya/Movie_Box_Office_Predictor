url: https://www.ptt.cc/bbs/movie/M.1717264120.A.31F.html
title: '[請益] 哥吉拉-1（有雷）'
content: '今天剛看完-1，


  看到時間空間設定在2戰時代的東京，


  在銀座的那發原子吐息直接蘑菇雲，


  震撼的不只是畫面，


  更大的震撼是，


  哥吉拉在日本人的創作上，


  代表的就是美國？？


  美國就是那隻哥吉拉？


  那個摧毀日本本土（東京大轟炸、廣島長崎等）的大怪物？


  一直以來對哥吉拉的反戰設定，


  自己一直以為的是希望藉由哥吉拉的輻射相關等破壞，


  希望不要再有輻射戰爭之類的，


  結果-1這部的畫面強調的部分給我感覺，


  就是在直指美國用核彈破壞日本本土的直接明示？


  哥吉拉一直以來的設定就是直指美國本身而非反核戰的形象？



  --'
