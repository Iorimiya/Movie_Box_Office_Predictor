url: https://www.ptt.cc/bbs/movie/M.1714821362.A.96E.html
title: 哥吉拉-1.0雜感
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  不知是不是因為板上一片好評，讓我期待拉太高

  實際看過之後，發現沒有預期中的驚艷。


  從一開始哥老登場就覺得有些出戲

  前一秒警鈴大作，下一個鏡頭就看到一隻恐龍在那搖頭晃腦

  這時哥老還是小size，再加上把人咬起來甩出去的動作

  真的很像在看侏儸紀公園，讓人很想笑

  總體來說覺得這個初登場來得很突然，缺乏醞釀。


  人類戲的部分

  優點是主軸明確易懂

  男主的糾葛符合時代背景，且巧妙地和哥吉拉連結起來

  缺點是個人認為神木的演技撐不起男主的心理創傷

  可能是我對他的印象就是個開朗男孩

  總覺得他在戲中的眼神還是很清澈明亮

  雖然很努力表現出戰後創傷的形象

  但就感覺是在「演」，不是發自內心地受傷

  在觀戲時沒辦法融入他的情緒裡。


  人類戲的另一個優點就是女主選了美波，這點超過一百分

  雖然男主的遭遇很悲慘，但看到美波跟著他回家還一起同居

  我心中只有大寫的羨慕兩個字

  而且不管是流浪漢造型、傳統日本婦女造型、OL造型

  連最後躺在病床上的狼狽樣，都超級可愛

  哥老大鬧銀座，把美波坐的電車咬到半空的時候

  我心中怒吼，就算你是哥老也不能欺負美波！


  後來美波一個完美落水躲過一劫

  沒想到不久後就被原子吐息噴飛領了便當

  看到這裡，我除了覺得很幹之外

  也覺得女主在這裡領便當好像有點早，隱約覺得是不是並沒有死

  但又覺得讓女主活下來又太煽情，還是死了比較好

  沒想到最後真的吐便當，給了一個happy ending

  看心得文很多人覺得這段很感人，但我覺得有點硬要

  感覺就是為了HE而HE。


  最後說說哥吉拉的部分

  先說明一下小弟很喜歡正宗哥吉拉，所以這段會和正宗哥做比較

  在造型方面，還是比較喜歡正宗哥那種神經質的設計

  尤其那瘋子般無神的眼睛是精華

  負一哥的頭形跟嘴巴設計得圓圓的，加上那大得不成比例的腳

  我覺得整體看起來偏可愛，反而沒有破壞神的霸氣感


  原子吐息方面

  負一哥搭配背鰭的動作設計我覺得很有創意

  而且他射出的光炮爆炸的方式跟核彈一樣

  在這個故事背景下又別具意義

  但論整體的視覺呈現，我還是更喜歡正宗哥一點

  正宗哥先放瓦斯再一舉點燃，東京瞬間燃成火海

  搭配那悲壯的配樂，我覺得在美感上還是略勝一籌


  結論，雖然講了很多讓人出戲的點

  但整體來說還是一部好看的電影

  沒在電影院上映實在很可惜

  希望未來能有機會在大螢幕上看到美波。



  --

  神木可能跟他的氣質有關吧，他演一些開朗樂觀或傻裡傻氣的角色就很適合，但演這種悲

  情角色就沒有代入感

  其實我覺得每部哥吉拉電影裡的哥老都很有壓迫感（某幾部美國拍的歡樂哥吉拉除外）

  男主跟別人講他遭遇怪獸的事，大家好像都理所當然地就接受了，是我第一反應一定是：

  哩系咧供三小

  正宗哥真的好看，人類戲稍嫌冗長但拍得很有意思

  短髮美波就是無敵，可惜最後還是便當

  哥老也奈何不了主演名單上的人

  那小女孩其實目測不到兩歲，我也覺得引導這個年紀的小孩在正確的時機點講台詞跟哭哭

  很難，應該NG很多次

  我也覺得不帶先入為主的期待看，評價或許會更高

  其實2014的傳奇哥還是不錯看，哥老戲分雖少，但每次出場都張力十足，而且這部片好幾

  個畫面的構圖跟攝影都很美，氛圍掌握得很好，但後來跟金剛合演的那幾部就另當別論了

  文戲占了整部電影那麼長的篇幅，不可能不重要，只是這部的文戲有些沒騷到癢處，很可

  惜'
