title: '[新聞] 《哥吉拉-1.0 Godzilla Minus One》正'
content: '《哥吉拉-1.0 Godzilla Minus One》正式登上北美「外語電影」影史最高票房第三名



  日本經典怪獸特攝系列《哥吉拉 Godzilla》最新作《哥吉拉-1.0 Godzilla Minus One》繼

  全球票房打破由《正宗哥吉拉 Shin Godzilla》保持的「哥吉拉」日語系列電影最高票房紀

  錄之後，今番再登上北美地區「外語電影」影史最高票房第三名的位置。


  作為 Toho 東寶第 33 部「哥吉拉」日語系列作品的《哥吉拉-1.0》，拍攝成本為 $1,500

  萬美元，由知名日本動畫導演山崎貴執導，在北美地區上映之後造成轟動，在上映的 59 天

  裡（截至 1 月 28 日）現已成功進帳 $5,500 萬美元，成功擊敗《Parasite》站上「外語

  電影」影史最高票房第三名的位置，第二名為 1997 年電影《Life Is Beautiful》的 $5,7

  56 萬美元，第一名則是《臥虎藏龍》的 $1.28 億美元；此外本片也一舉站上英國及墨西哥

  兩國影史最高票房的日語真人版電影。


  《哥吉拉-1.0》目前在日本上映87 天裡（截至 1 月 28 日），票房收錄高達 55.9 億日

  元，全球票房突破 $1 億美金，官方甚至另外追加推出名為《哥吉拉-1.0/C》的黑白電影版

  本，此外也在上週公布的第 96 屆 Oscars 奧斯卡完整入圍名單中搶下「最佳視覺效果」的

  提名，可謂喜事連連且勢如破竹。


  《哥吉拉-1.0》目前尚未確定是否登陸港台地區，讀者們只能繼續等待。






  --'
