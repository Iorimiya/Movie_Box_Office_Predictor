url: https://www.ptt.cc/bbs/movie/M.1723881199.A.45A.html
title: '[  雷] 哥吉拉-1.0'
content: '防雷






























































  那個,有誰可以解釋一下為什麼標題是-1.0？

  看完還是滿頭問號,不過完全不影響這部電影的好看

  對只看過美版的我來說,這次體驗了截然不同的哥吉拉

  第一次用日本的角度去看這個大個子會有不同想法

  好看是好看,我覺得心中會有多喜歡也要看人

  能否體會當時日本人的心境是關鍵

  我是很了解所以時空背景這部分加分不少

  從男主角個人的創傷到當時日本的創傷

  （別扯日本先侵略吧啦吧啦的,這不是重點）

  其實哥吉拉的出現又更強化這些主題

  一群渺小的平凡人要怎麼對抗龐然巨獸？

  日本的未來又要何去何從？要如何克服心魔？

  在這場同心協力的戰鬥中自會有所解答


  這隻哥吉拉就比較沒那麼精緻,果然是因為預算不高

  我是蠻愛他的嘴砲,比美版更讓人絕望

  幹根本是小型核爆,直接一路輾過去

  我終於見證哥吉拉有別於守護神的另一個面向

  後面主題曲響起也是別有一番風味

  我看著是很享受的,只是我想抱怨一下

  那個女的掛了然後又活了很多餘欸

  男主角方面的張力銳減不少,這點美中不足

  其他就很滿意,某方面也道出日本對戰爭的態度

  也不知道會不會有續集,雖然有埋梗啦

  然後有人要推日本自己拍的哥吉拉有哪些好看的嗎？

  有點想去看日本拍的,但沒有很了解

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  會拿美麗比喻成愛的人，都是不知愛情真相的人

  會把醜陋比喻成愛的人，都是熟知愛的驕傲者


  --'
