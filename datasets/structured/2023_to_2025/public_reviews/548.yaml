url: https://www.ptt.cc/bbs/movie/M.1717480953.A.B19.html
title: '[ 普好雷] 哥吉拉-1.0'
content: '雷文防雷資訊頁




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  其實這次哥吉拉真心覺得不錯看，至少個人覺得比上次正宗好看多了。不過還是有幾點想

  討論的。


  1, 為何我總覺得日本電影特別是男演員演技總有說不出的誇大或中二感？老實說跟近幾

  年的韓劇比起來日本男演員的演技真的很不自然。我真心覺得這次-1.0最大的敗筆全在男

  主角的演技，哭戲帶出的情緒還有敗戰歸國的頹喪悲傷感還有最後去找飛機技師的悲憤感

  我覺得演的都不太到位…


  2, 其實最要稱讚的是日本的CG技術總算進步很多，不再像以前那樣假假的。這次哥吉拉

  口爆前集氣背鰭突出發藍光的效果真的是很細致，還有海戰時軍艦海上航行的畫面以及男

  主角駕機與哥老纏鬥的鏡頭CG效果個人覺得應該勉強有達到好萊塢的85分了…


  3, 有個跟歷史可能比較有關係的小問題是最後圍剿哥老的兩艘驅逐艦在舷側都漆上大大

  的英文船名包括史實上被當賠償艦送給中華民國的雪風號，想請問日本敗戰後軍艦改漆上

  英文船名是歷史確實如此還是純粹電影要打入國際市場才做的？


  --

  我得修正我的說法，大概十年前好萊塢全盛時期的85分…最近五年好萊塢水準則是一直退

  步，包括後期漫威復仇者系列還有我覺得經典的環太平洋以及傳奇哥老CG水準似乎都不及

  這次哥老-1.0…

  哇，我也是知道二戰服役時都漆片假名看來還真的算有考證史實ㄟ

  好萊塢近年的特效似乎為了省錢都喜歡暗暗的場景，這次-1.0直接場景都在大白天更是對

  CG特效的考驗。這次東寶哥老系列最讓人刮目相看就是日本特效水準的進步而不是只會以

  前的特攝風格～'
