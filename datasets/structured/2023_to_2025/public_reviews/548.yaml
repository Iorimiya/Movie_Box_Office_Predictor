url: https://www.ptt.cc/bbs/movie/M.1711355363.A.FB2.html
title: '[討論] 《哥吉拉：-1.0》導演山崎貴專訪（下篇）'
content: '本文將節錄較有趣的部分翻譯


  同時此訪談含有《哥吉拉：-1.0》大量劇情透露 請斟酌閱讀

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  問：

  在電影的開頭，有位技工說他從大戶島的村民聽說了吳爾羅的傳說，但電影中卻沒看到任何村民，有刪除片段是關於這部分的嗎？如果沒有，哥吉拉的背景故事又是如何？


  山：

  沒有什麼特別的刪除片段和背景故事，就只是個村民傳遞了鄉野傳說，但又更加現實一點，我只能說那些故事和話語是如何流傳，而那也是個帶回大戶島設定的手法，像是他們會獻祭給吳爾羅之類的…


  問：

  像是木筏上的女孩之類的？

  山：

  是的，傳說就是如此流傳


  問：

  您曾經在其他訪談提過，吳爾羅在核爆前就有再生能力，既然如此，那片頭敷島戰機中的子彈對牠有作用嗎？

  山：

  嗯～牠連核爆都承受的住了，我想2公分寬的子彈不會有多大作用


  問：

  吳爾羅是哥吉拉的前身，這對《哥吉拉vs王者基多拉》中的哥吉拉龍是個致敬嗎？還是單純的巧合？

  山：

  在電影中，我們想確保核爆前的哥吉拉能長成後來的樣子，而作為尊重，我們確保牠看起來不會像《哥吉拉vs王者基多拉》中的哥吉拉龍


  問：

  在結局中，典子的脖子出現了奇怪的印記，你能解釋那是什麼嗎？還是就當成一個謎團？

  山：

  我不想回答（笑


  問：

  為了將哥吉拉引來最後的戰場，人們用了錄下來的哥吉拉吼聲，但他們是何時又如何取得的？有刪除片段嗎？

  山：

  這是個好問題，事實上你回想哥吉拉在襲擊銀座時，有一群記者在屋頂上，建築倒塌後人們發現了那段錄音，而這在電影的小說版中有提到


  問：

  吳爾羅住在大戶島上，牠是牠們種族的最後一個個體嗎？

  山：

  這是個無法解釋的謎團（笑


  問：

  這會是個粉絲們將會猜測多年的謎團，我想消滅這個問題，因為他們變成一人的觀點被大家採信的狀況，我想阻止這件事發生

  山：

  作為另一方，如果我現在確定了太多設定，這可能會阻礙或縮限到將來的發展或計畫，所以我不能證實太多


  問：

  哥吉拉在電影一開始相當敏捷，但被核爆過後牠變得很笨重，這個變化的理由是什麼？

  山：

  第一點，在自然狀況下，大型生物本來就移動緩慢且笨重，但另一個理論是在暴露於輻射前，哥吉拉比較像是個生物，但後來牠幾乎昇華成一個神聖如神一般的生物，牠半神半生物的特性是我感到牠動作緩慢和意圖明顯的理由


  問：

  如果你要製作續集，會找來原本的選角來進行新的故事嗎？還是您想採用新角色？

  山：

  如果我能全權掌控並沒有限制的話，我會想看原有角色的後續發展，不過再次聲明，這只是我的個人意見，那並非在暗示接下來會發生的事（笑），這只是我的個人意見


  問：

  為何會用「生」這個重要的元素來當作主題對抗「毀滅」的概念？

  山：

  製作一部怪獸電影，我認為這是用來講述面對天災 最強烈的反面主題，還有戰爭也是一大背景，以及核武的影響，因此我相信能與之抗衡的唯一力量便是人們求生的意志，所以以這主題來對抗哥吉拉，我認為非常合理


  問：

  您對續集的想法中，對哥吉拉的敵手有任何想法嗎？

  因為有些猜測像是基多拉或安基拉斯，大家都想看牠們回歸

  山：

  無可奉告（笑




  問：

  這些是很熱門的問題呢

  山：

  安基拉斯的粉絲很多，這很有趣

  我在想因為我的電影和1954的風格有緊密的連結？所以假設有部續集，牠會是接下來會出場的怪獸，大家會喜歡安基拉斯是因為這樣嗎？


  問：

  是啊 牠就像個敗犬，或者牠會變成那樣，但牠現在是粉絲最喜歡的選擇

  山：

  （笑）


  ——

