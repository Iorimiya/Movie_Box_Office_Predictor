url: https://www.ptt.cc/bbs/movie/M.1702205242.A.5BC.html
title: '[無雷] Critical Drinker盛讚哥吉拉-1.0'
content: "雷文防雷資訊頁\n\n(無雷，請安心服用)\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n如題 我最喜歡的蘇格蘭YouTuber觀影人/影評\n\
  \nThe Critical Drinker去看了哥吉拉-1.0\n\n然後說這可能是今年他看到最好看的一部電影\n\n\n\n\n\n上面他的影片請斟酌服用\n\
  \n因為雖然他的影評或心得通常都不會暴雷\n\n但是為了敘說跟論述 會把故事的大綱簡單介紹一遍\n\n這部也不例外\n\n\n\n所以我會把所有跟劇情有關的內容全部剔除掉\n\
  \n單純條列式 把無雷的心得跟評論整理後放到底下\n\n上面的影片如果不想被任何程度雷到 請斟酌服用\n\n或是看我接下來的整理即可:\n\n1.開臭今年的西方電影作品\
  \ 製作規模膨脹 愛說教 創意破產\n  年尾他最期待的拿破崙也還好而已\n\n  就當他以為2023年就是他的觀影人生最失望的一年\n    當他以為2023年就這樣了\
  \ 平靜的心拒絕再有浪潮的時候\n\n  他看了哥吉拉-1.0\n\n\n\n2.這部低預算低成本日本產怪獸電影 在一年的最後就這樣輕輕地來到他面前\n  彷彿不失禮貌地問了他一句\"\
  嘿，想最後再來看一部哥吉拉電影嗎?\"\n\n  反正是年尾了 那就一手拿爆米花 一手拿蘭姆酒 就硬著頭皮看一下吧\n\n\n\n3.結果后里蟹!!這部有夠靠北好看的!!\n\
  \  哥吉拉-1.0很有可能就是他今年最愛的一部電影\n  是一連串嚴肅而且有反思性的角色劇情故事\n  混合強而有力的戰爭電影以及華麗的怪獸毀滅大場面\n \
  \ 而這三者被巧妙聰明地整合到一部精簡的兩小時敘事裡\n\n\n\n4.然後這麼優秀的電影作品 製作成本($15M)竟然僅僅約半集的\"律師女浩克\"($25M/集)\n\
  \                                                (嘔嘔嘔嘔嘔 嘔嘔 嘔嘔嘔嘔嘔)\n\n\n\n5.哥吉拉-1.0是一個很好的例子\n\
  \  一群盡責投入且具有熱情的拍攝創作團隊\n  靠著少少的資源 作出優秀的作品\n  然後讓一個早被各種續集前傳外傳平行世界觀給詮釋無數次 比MCU還多產的IP\n\
  \  注入一股新的轉變 賦予一陣新的氣息\n\n  而這個故事是如此放諸四海 不僅日本觀眾 連西方觀眾也能引起共鳴與戚戚\n  今時今日的好萊塢創作團隊 也只有在夢裡才能達到這種創作效能\n\
  \n\n\n6.(接下來開始介紹電影主軸 可能有雷所以跳過)\n\n\n\n7.怪獸科幻創作有個很有趣的地方 就是其實這類型作品有意識或無意識地反映了\n  一個文化與承載文化的社會做為一個總體\
  \ 所面對的隱藏在內心深處最深的恐懼\n\n  例如科學怪人反映了科技的飛速進步 讓人類能成為創造者 操縱生死的失控可能性\n      天外魔花折射了50年代美國社會對共產主義赤化美國的憂心\n\
  \      哥吉拉系列其實反映的是日本人在廣島與長崎後 對戰爭與核武的獨特觀點\n\n  在當下(哥吉拉問世的1954年)這樣的創作軌跡對日本人而言是相當強烈引起共鳴的\n\
  \  但是到了70年後的今日 日本人對同樣的議題 是否也能同樣感到共鳴?\n\n\n\n8.而這部2023年的哥吉拉電影 巧妙地把埋在主軸議題從核武恐懼\n \
  \ 轉變成對戰爭與戰爭代價上 由主角與他的經歷當作黏合整個故事的核心\n  訴說各種直到現在依然相當放諸四海皆準的戰爭議題\n  例如倖存者罪惡感 戰敗挫敗感\
  \ 他的故事體現了當時日本社會多數人的心態寫照\n  而用這種對戰爭與戰敗的描述 巧妙地把焦點抽離了以往強調的核武恐懼議題\n\n  也因此 這部新作讓創作的舊軌跡與新軌跡達到了一個平衡點\n\
  \n\n\n9.這部電影講述了家庭在苦難與災難中的重要性 職責與自我犧牲精神的偉大\n  以及在挫敗、失敗與失去中尋找一條繼續好好生活下去的出路\n\n  當你把這種能引起觀眾強烈代入感與引人入勝情緒的故事主軸\n\
  \  與那種我們在這裡(指歐美)太常看到的那種枯燥乏味、貧瘠、\n  毫無吸引力的一坨虛無敘事偽裝成的所謂\"角色故事\"來做對比\n  (這邊偷臭魔戒：力量之戒、驚奇隊長跟亞蘇卡)\n\
  \n  你就能明白為什麼近年歐美影視作品會這麼糟糕\n\n\n\n10.通常哥吉拉電影很難讓人連想起\"引人入勝的角色劇情\"\n   因為人類在哥吉拉片通常會扁平化成一邊尖叫一邊逃離災難的人群\n\
  \   或是外觀邋遢的科學家在灰塵瀰漫的會議室進行冗長又複雜的解說\n   或渡邊謙遙望遠方 反思為什麼自己當初要接這種角色\n\n   但是哥吉拉-1.0有成功破解那個受歡迎的套路\n\
  \   就是給予觀眾們一群有趣的核心角色，讓你能深深入戲，與之產生共鳴\n\n   所以當哥吉拉開始幹他的工作 也就是摧毀建築物跟踩扁人類的時候\n   你會為這些角色感到著急\
  \ 憂心 擔心他們能不能存活下來\n\n   這就是所謂的\"角色刻劃\"跟\"戲劇張力\"\n\n\n\n11.怪獸鏡頭也相當有娛樂性 你想在怪獸電影獲得的那種\
  \ 怪獸史詩級破壞力與戰績\n   還有人類軍事力量的微弱反抗與最終的徒勞 各種軍事裝備在怪獸神威下爆破損失\n   在這部片裡一點都沒少\n\n\n\n12.而且OMG\
  \ 這部有他看過的哥吉拉電影中最具毀壞力跟power的原子吐息 有夠爽\n\n\n\n13.此外這部其實有刻劃出\n   哥吉拉與軍隊的對峙與戰鬥中 兩方有來有往\
  \ 彼此有在過招的動作戲\n   而非僅僅是哥吉拉一面倒屠殺日本自衛隊 人類軍事力量所有反擊都是徒勞這種戲碼\n\n\n\n14.講到缺點 如果要特別吹毛求疵\
  \ 這部的缺點應該是節奏\n   故事中盤發展的有些許冗餘跟緩慢 感覺可以削減一點長度的戲\n   讓從序盤開始一路流暢的敘事節奏不至於在中盤被稍微拖慢\n\n\
  \n\n15.另一個缺點是視覺 可能就是因為這部是控制在很低的成本下拍攝完成的\n   在某些動作場景你能感覺得到視覺效果跟CG沒有辦法做到歐美大片栩栩如生的程度\n\
  \   並不是說視覺效果不好 反而應該說已經很好了\n   但是依然看得出來跟頂級預算成品的差別\n   但這大概是同樣資金運用下 所能做出的極限操作 最好最好的結果了\n\
  \   這很可能就是所謂的極限了\n\n\n\n16.同時因為故事非常扣人心弦 你大多數時間是沉浸在那個哥吉拉跟人類對拚的體驗中\n   這些\"不理想的視覺呈現\"\
  又很少 所以並不會為娛樂與沉浸感產生出戲的負面影響\n\n   然後他又找到機會臭好萊塢了 說如果你們懂得怎麼好好講好一個扣人心弦的故事\n   就不用靠光彩亮麗的視覺效果來轉移觀眾的注意力了\n\
  \   因為根本不需要轉移他們的注意力 如果故事夠好 他們就會被好好娛樂到\n\n\n\n17.還記得從前有個好萊塢 曾經有那個能力拍出這種優秀的作品\n  \
  \ 同時還不需要浪費一個小型非洲國家一年的GDP總量才拍得出來嗎?\n\n   我記得\n\n   所以如果哥吉拉-1.0有什麼值得歐美電影借鑒的地方\n  \
  \ 那好萊塢影業們真該看看東寶是怎麼拍電影的\n\n==========================================================================\n\
  \n看完他的心得/評論之後我只有一個想法\n\n就是鄭伊健說的:\n\n\n\n\n\n台灣快點上阿幹!!!!!!\n\n\n\n--"
