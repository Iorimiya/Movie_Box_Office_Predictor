url: https://www.ptt.cc/bbs/movie/M.1748995766.A.ACC.html
title: '[新聞] 《超人》特效仿《哥吉拉-1.0》 製作成本'
content: '《超人》特效仿《哥吉拉-1.0》 製作成本揭曉




  （大紀元記者葉子杰編譯報導）導演詹姆斯‧岡恩最近透露，他下個月將上映的《超人》

  電影靈感來自《哥吉拉-1.0》。另據報導，《超人》的製作成本為2.25億美元，並且全球

  票房需達7億美元才能視為大電影。


  2日，《超人》導演詹姆斯‧岡恩（James Gunn）接受日本新聞媒體《Cinematoday》的採

  訪透露，他嘗試在《超人》電影融入《哥吉拉-1.0》（Godzilla Minus One，2023）的特

  效。岡恩談到怪獸時說：「我受到了特效影響。」他表示，他希望在這部電影中將特效與

  DC漫畫的世界觀融合在一起，「我試著融合巨大怪獸、機器人、會飛的狗、其他超級英雄

  等這些元素。」


  岡恩繼續說：「我的目標是製作一部既能像《哥吉拉-1.0》那樣的電影，既能刻畫哥吉拉

  ，又能展現精彩的人性劇情。」


  當地2日，根據一位不願透露姓名的頂級經紀人向《The Wrap》表示，《超人》製作成本

  高達2.25億美元（不含行銷成本），需要在全球票房突破7億美元，才能被視為一部成功

  的電影。據《ScreenRant》報導，如電影要達到損益平衡標準，總票房收入必須達到製作

  成本的2.5倍，以此推算即5.6億美元。


  最近，《超人》官方X帳號上發布了一段新的幕後花絮宣傳片，片中，飾演的「超人」大

  衛‧科倫斯韋（David Corenswet）在拍攝空檔與小孩們玩耍、互動。而正片的其中一個

  片段，他用身體擋住意外發生飛來的碎片保護一名小女孩的場景，恰好詮釋這個角色。




  另據《ComicBookMovie》報導，Uno卡牌還透露了《超人》中的所有角色，有一位身穿綠

  紫色戰衣的反派，就是片中大反派雷克斯‧路瑟的戰衣外型。





  此外，超人寵物「氪普托」（Krypto）除了出現在《超人》中，預計會在明年夏天的《超

  少女：明日之女》（Supergirl: Woman of Tomorrow）中扮演更重要的角色。


  知名內部人士MyTimeToShineHello透露，氪普托將會在《超少女：明日之女》的電影中長

  大。我們還會看到氪普托在氪星當小狗時的回憶往事，很可能會探討氪普托與年輕的「超

  少女」卡拉‧佐-艾爾（Kara Zor-El）之間的關係。


  --'
