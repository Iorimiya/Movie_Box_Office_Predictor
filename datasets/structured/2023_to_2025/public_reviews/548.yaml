title: '[ 神好雷]  哥吉拉-1.0  近期最佳電影'
content: '在美國看黑白版










  結束之後全場直接鼓掌…..












  =====================







  哥吉拉當初日本一開始的設定背景就是戰後的日本，核子彈、戰後貧窮疾病的東京灣，被

  破壞後的人類的渺小，軍國主義後的反戰思維，有回到初衷的味道。




  漫畫劇情+日劇+美式災難篇




  1.廢物男主角神特攻隊友基本都自殺死光了，該死沒死，遇到哥吉拉又不敢開槍害覺得自

  己害死隊友，苟且回到日本社會，被社會看不起。發現爸媽也掛了唯一的精神支柱也死光

  了。


  2.在家撿到正妹女友+一個小孩超爽的，日本漫畫後宮男主角劇情。


  3.哥吉拉其實就是男主角戰爭後的心魔，有時他已經分不清楚自己是否已經死了，或是這

  幸福的生活只是幻覺。


  討論戰爭後的心理重建問題，為什麼要活下去，為了誰而活下去。


  4.哥吉拉破壞力夠強，很像日本漫畫人事物瞬間就沒了，比美版那種長鏡頭或是小打小鬧

  ，更有人類比起哥吉拉像是螞蟻般震撼感。


  5.殺哥吉拉的策略很科學，還有很多備案，很符合邏輯，還會自我吐槽成功率，編劇有帶

  腦。


  6.最後是好結局，太好了，觀眾，大家都哭了。廢物男主角找到救贖的故事。


  這從二戰到哥吉拉，日本社會經不起更多的傷害了，大家都很脆弱，但又充滿希望，對於

  男主角或是劇中所有小人物，這一場漫長的戰爭終於結束了。



  這幾年最棒的電影，比好萊塢刻劃人性更細膩，更符合亞洲思維一點，不是無腦的英雄怪

  獸片。


  --'
