url: https://www.ptt.cc/bbs/movie/M.1738207168.A.861.html
title: '[好雷] 哥吉拉-1.0 '
content: '雷文防雷資訊頁
















  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  太好看啦~~~

  感人又熱血


  這是一部致敬1954年版哥吉拉的70周年電影


  感人的點當然是

  神木與美波、小女兒真摯的感情

  漁船四人組熱血的基情

  影后安藤櫻與掰咖技師的毒舌鼓勵與支持


  熱血的點當然是最後的大圍攻

  充滿速度、刺激、緊張、熱血

  不愧是熱血動漫大國


  當然對軍國的反思也是不可或缺

  日本人檢討自己還是滿痛快與犀利的

  神木一直背負著創傷與哀慟，讓人想到七月四日誕生


  哀痛了幾乎一整片，觀眾看到都煩躁起來

  幸好最後給大家看幸福快樂的結局

  當然他這樣積極獻身，又與反戰觀點相悖，日本人還是太愛這套壯烈犧牲情節


  美波幾乎全片素顏還是非常可愛

  與美波比美是全片特效真的是超出亞洲的水準

  哥老、戰艦、毀壞的建築物、衝擊波都非常寫實

  完全不尷尬的好特效

  難怪美國人都為它的低成本(1500萬美金)感到震驚

  放在美國絕對是1.5億起跳


  此片也幾乎橫掃日本各大電影獎

  包含日本電影學院獎跟藍絲帶獎

  安藤櫻拿下日本電影學院獎最佳女配角

  美波拿下藍絲帶獎最佳女配角


  --'
