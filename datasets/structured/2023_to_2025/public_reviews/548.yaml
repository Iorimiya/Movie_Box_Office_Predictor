title: '[新聞] 哥吉拉登票房之神！《哥吉拉-1.0》殺進'
content: '哥吉拉登票房之神！《哥吉拉-1.0》殺進北美票房第3…破日片紀錄



  日本「怪獸之王」哥吉拉系列是東寶電影公司的代表作，今年推出70周年紀念大作《哥吉拉

  -1.0》（Godzilla Minus One），上周末在美國上映，首週就奪下北美票房第3高，全美票

  房進帳1103萬美金，大破了日本真人電影在美國票房的新高紀錄。短短數天已經快追平這部

  電影的拍攝預算，這些數字也讓美國網友驚呆了。


  哥吉拉在日本被稱為「怪獸之王」、「破壞神」，如今也將再添「票房之神」的封號。最新

  電影《哥吉拉-1.0》由名導山崎貴擔任導演兼編劇，時代背景是第二次世界大戰後，日本的

  經濟狀態已經是零，哥吉拉的出現讓日本陷入負以下的狀態。


  《哥吉拉-1.0》事前以全面封口保密的狀態製作，事前沒有過多宣傳，並選在《哥吉拉》首

  部電影公開日（11月3日）上映，情懷殺緊緊抓住死忠影迷。緊接著是觀眾口碑成功發酵，

  大家觀影後讚評不斷，認為電影描述人性情節催淚，淚水成功激出驚人票房，上映32日票房

  超過38億日幣。


  緊接著《哥吉拉-1.0》在北美上映，根據網友分析，該片在北美上映影廳數高達2308個，首

  日票房包含試映票房收入，共計472萬美金（約台幣1.49億元），首週北美周末票房1103萬

  美金（約台幣34億元），登上北美票房第3，這個數字刷新日本電影在全美票房的新高紀錄

  ，也是非英語電影開票票房史上第2高，僅次於張藝謀執導的大陸電影《英雄》。


  除此之外，日片《哥吉拉-1.0》製作預算是日幣20億元，換算美金約1500萬美金，如今他首

  週北美票房就已經1103萬美金，比起北美冠軍片碧昂絲演唱會電影、亞軍《飢餓遊戲：鳴鳥

  與游蛇之歌》花1億美金製作，成本要來的低，讓海外影迷無不驚呼低預算拍出精緻特效，

  更被讚「一部讓大多數現代好萊塢大片相形見絀的傑作」。


  《哥吉拉-1.0》集結一票實力派演員，男主角是童星出身、現年30歲的神木隆之介。他童星

  時期演過無數夯劇、電影，並且為動畫《神隱少女》、《你的名字》擔任角色配音，由於參

  與過的電影票房大多都有破百億的票房紀錄，令他被網友封為百億票房男，是少數為動畫配

  音沒有挨負評的明星。如今《哥吉拉-1.0》在海外票房告捷，網友預估全球總票房可望達到

  破百億的目標，個人演出紀錄將再添一筆好成績。




  記者陳芊秀／綜合報導





