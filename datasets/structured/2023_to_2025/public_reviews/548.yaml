url: https://www.ptt.cc/bbs/movie/M.1715603353.A.CC8.html
title: 'Re: [普雷] 哥吉拉-1.0 大家都不跑的嗎??'
content: '幫劇情護航一下，這邊應該是對劇情有誤會

  這一集哥吉拉出現的時間是1947年五月。

  在歷史上的1946~1954年間，日本是沒有軍事力量的，

  實質上所有防衛任務由盟軍最高司令官總司令部（GHQ）負責。


  扣掉背景知識不談，其實劇中也一直提醒這點：


  一開始新聞報導提到麥克阿瑟公開說不介入，但日本政府要求提高保護能力。


  主角群當誘艦時博士提到，重巡高雄艦原本是前往新加坡自沉，緊急被同意調回。


  主角醒後得知哥吉拉消息被封鎖，船長說政府只擅長情報封鎖。

  博士說那是因為怕造成混亂，因為現時沒人能為即將到來的混亂負責。

  （連有序地大規模疏散都作不到）


  在國會前迎擊的是四輛四式中戦車，這是末期才研發出來的坦克，

  史實上四式中戦車只完成兩輛試作型，

  一號車因為後面貼了Type 5被當成五式中戦車，移往實驗場途中下落不明。

  二號車預定要跟其他戰車沉進猪鼻湖。

  劇中還好心幫忙多生出兩輛量產型四式，歷史上沒趕上終戰所以其實不存在。


  老艦長召開會議時，直接就說了當下日本沒有軍隊，美國不管，所以才要自救。

  雪風號（給臺灣）、櫸號（給美國）、

  夕風、響（都給英國）都是臨時被拉回借給他們使用。


  找戰鬥機，博士講到所有戰機都被報廢。

  震電１號機是唯一保存下來研究的機種，不過在1945年10月就運去美國，

  劇中為了二戰軍武迷的浪漫，硬是讓它登場了一回。



  總而言之，當時的日本政府不是不為，而是不能（先不論是不是真的有內閣總辭光線）。

  劇中對白對政府的不滿，對戰時政府表現的是怨懟，

  對戰後政府則是充滿了無奈。



  --'
