url: https://www.ptt.cc/bbs/movie/M.1738224719.A.D6E.html
title: '[心得]  哥吉拉 -1.0 ScreenX 視覺呈現'
content: '先分享負一哥在ScreenX的表現，從台灣引進SX影廳後，負一哥可以說幾乎有在台灣SX上

  映的作品中，算是中後段班的表現。




  （1）除了開場登場外，後面的海戰、銀座戰、最終戰都有很棒的畫面呈現，尤其銀座戰

  熱線發射，有幾幕的橫向畫面非常美。


  （2）SX畫橫向面比一般版，是真正有多出畫面，有些其他電影只是拉長，像TGM駕駛艙，

  有些只是拉寬畫面。


  （3）後三場戰役沉浸感很足




  （1）有部分畫面接縫不好，例如人走向左右兩側畫面，卻直接消失；或者接縫景色上下

  左右分離過大。


  （2）部份利用後製且粗糙，例如四人團隊剛見面時，船長將手伸往右側畫面，那個手指

