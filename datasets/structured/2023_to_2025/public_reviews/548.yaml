url: https://www.ptt.cc/bbs/movie/M.1717434040.A.0DA.html
title: '[普雷] 期望過高的哥吉拉-1'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n先說結論\n整體來說我覺得能看\n\
  但是並不特別推薦\n如果我沒看過元祖我可能覺得很棒\n\n有些我個人不怎麼喜歡的缺點\n\n1.\n現代日本電影很愛用的浮誇感\n不是說不能浮誇\n我最愛的元祖和正宗也有這種演出\n\
  但是過量演出都這麼浮誇我覺得很出戲\n\n2.\n剪接不佳\n這種剪接不是像怪獸之王亂切的問題\n而是劇情尾韻沒收好就換到另一個情境\n這種劇情描述方式有時會讓我情感中斷\n\
  無法連貫\n\n3.\n哥吉拉的出場氣氛很糟\n也許是導演覺得哥吉拉大家看這麼多次了\n實在沒必要再故弄玄虛\n所以每次都讓哥吉拉登場非常直接\n但我覺得啦\n\
  不管你要不要藏哥吉拉\n那種應對的氣氛和大場面的鋪陳還是很重要\n而且很明顯負一有很多致敬元祖的場面\n但這些部分感覺缺乏一體性\n有點硬塞的感覺\n\n4.\n\
  人戲的意涵\n看得出來本劇的劇情核心\n是戰後士兵的愧疚感和釋懷啦\n但因為前面的剪接和演出問題\n我實在很難對主角共鳴\n而且主角後半的憤怒理由\n有點讓這個主題跑題\n\
  所以我並不覺得這個劇情算優秀\n\n5.\n結局\n雖然我近年比較喜歡看大歡喜結局\n但那個衝擊傷害下還能活著實在太扯了\n差評\n\n除此之外的部分我都覺得沒什麼問題\n\
  解決哥吉拉的方式也很有創意\n特效部分我也很滿意\n\n\n以上是一個元祖廚的碎碎念\n\n-----\nSent from JPTT on my iPhone\n\
  \n--\n07/30 20:08\n \n\n--\n好，支持拒絕支語\n這我的錯"
