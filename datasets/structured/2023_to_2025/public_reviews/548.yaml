url: https://www.ptt.cc/bbs/movie/M.1718121040.A.37D.html
title: '[好雷] 哥吉拉-1.0觀後感 之 苦海無涯 苦盡甘來'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  哥吉拉-1.0，為什麼那麼受人推崇，我想是因為這部作品，拍出了人類的渺小，生活上的無力，以及最後一切都會好轉起來的”希望”吧。


  人生再怎麼覺得自己沒用，過得再怎麼生無可戀，都別輕易放棄，生命中總會另外一道曙光，在你認真努力的活下去時，重新展現在你眼前。




  舉幾點我很喜歡這部電影的地方：


  1. 膽小、懦弱其實存於你我的心中~ 面對恐懼，是會不顧性命奮力抵抗呢? 還是落荒而逃?


  看哥吉拉-1.0時，想到一部作品，井上雄彥畫的漫畫-浪客行。裡面刻劃著兩號人物-大名鼎鼎的宮本武藏，以及他的童年玩伴-本位田又八。所謂近朱者赤，按道理說，兩人應該會有差不多的人生成就，不過如同親身經歷的事實，並非如此。


  武藏面對恐懼、困難、貧景，雖然會怯步，也有打不過，逃跑的事蹟，不過重新鍛鍊修行後，最終總會打敗敵人，克服各種難關，彷彿世界的主角。


  而又八這號人物呢? 在最一開始，與武藏一同經歷了被強盜圍攻的困難，面對生命受威脅的恐懼，又八卻與武藏不同，不是與強盜相搏，而是躲了起來。

  看作品的當下，可能會對又八的行為嗤之以鼻，認為又八是無法有難同當的朋友，然而若將我們放在同樣的處境，我們是否能夠做得比他更好呢?


  有時生活上的體驗，跟二戰後的日本十分相像。在背負著恥辱與傷痛的同時，還得被原子吐息痛擊，根本苦海無涯。


  不如意的事情很多，工作上被長官羞辱，難以得到賞識；交際時尷尬、無法得到關注；感情路上各種吃鱉；努力賺錢卻沒有生活品質等等。遭遇困難當下，痛苦而無助，彷彿全世界都跟你作對，想做點甚麼卻又沒勇氣，這樣的當下，該怎麼辦呢???



  2. 被需要的感動


  戲內有一個很突兀，很搶戲的角色，是主角的鄰居。


  鄰居阿姨總是酸爆主角，不嘴人心理不舒服的那種。主角剛回來，詢問父母是否安在被嘴，撿到老婆小孩被嘴，甚至最後成為英雄時，全部人為主角歡呼時，鄰居還是沒有好臉色(雖然是因為喜極而泣吧…..)。為何特別提到這位出場可能沒有幾分鐘的角色呢?
  可能是因為我覺得這角色很讓人深刻吧。


  為何深刻? 因為她在困難的當下，即使處境已經很慘，卻還是願意幫助主角!


  戰後修復時期，大家都窮到隨時會被鬼抓走的年代，阿姨會願意分享白米；主角出門工作時，會幫忙照顧家庭；有些人嘴巴雖然壞，卻是刀子口豆腐心!


  幫助別人或許無法得到回報，在追求自身利益的年代，甚至會使自己變得更累、更忙。不過善良是一種選擇，幫助別人時，先不說能否互利，光是能夠感受到自己被別人需要，就是一種很幸福的事。


  我想若能被人需要，不僅能增進人與人間的感情，還能提升自己面對困難的勇氣。退一萬步來說，再怎麼慘，若能夠對別人伸出援手，至少也能讓自己獲得優越感吧。



  永遠不要小看幫助別人的人，有多漂亮~~~




  3. 跳脫傳統犧牲框架


  以前日本影視作品，會推崇一種文化，就是犧牲小我，完成大我的精神。這種大愛精神很偉大，很感動，不過以人類來說，要全心全意為別人付出，跟哥吉拉是否存在一樣，幾近不可能!
  而且就算努力達到了，真的會很快樂嗎? 別人若沒有給予回報，甚至恩將仇報的話，難道自己不會黑化? 最後就算付出後感到幸福快樂，但犧牲自我後，被幫助的人看到自己的幸福建立在別人的犧牲上，難道不會充滿愧疚?


  套用別人的話：完全的奉獻是一種病態的利他主義。經常犧牲自己的福祉來幫忙別人，反而會讓自己陷入倦怠失去自己。


  大師新津覺之進也說過：必須懂得，寶貴的不止是別人的生命，自己的生命也同樣值得珍惜。同樣的，全然無私的奉獻並不一定會帶給別人幸福，有時反而會帶給自己深愛的人，無盡的悲傷。唯有在自己與對方都能夠活到最後，才能算得上是幸福。


  很高興這一部哥吉拉電影，有跳脫這個傳統犧牲賺人熱淚的框架，我果然還是最喜歡HAPPY ENDING(是否有哥吉拉細胞先不說)。




  結語：


  視覺效果好的電影，看完當下，心情很爽很棒，不過好心情可能只能維持到上班前。而一部讓人感觸很深的電影，卻能夠帶給我滿滿的回憶與感動!


  哥吉拉-1.0，或許特效上不如傳奇哥吉拉，不過會讓我特別寫一篇文章歌頌的，卻是這部以人類為主角的哥吉拉電影。


  總結感動如下：


  a. 膽小、懦弱其實並不可恥，只要有認真做事，重新給自己站起來的機會，那麼我們走出來的路，會比那些意志堅定的人，還要更為寬廣。



  b.  面對深不可測的困難，互助能夠讓我們有與之一搏的機會。哥吉拉再恐怖，在人類有錢出錢，有力出力，有頭腦出頭腦的情況下，還是有機會讓哥佬嘴巴痛痛的!



  c. 人生中，遭遇如何努力，卻還是感到不知所措時，別忘了保持希望! 哥吉拉中的主角，戰敗失意，被朋友唾棄，被鄰居嘴砲，被愛人所救，他都能挺下來了，我們應該算比他還要不慘一點，更應該懷抱著希望，努力面對生活中的困難。



  雖然男主一臉衰樣，也真的很衰，但他都挺過來了!!!


  d. 犧牲自我固然很悲壯，不過了解保護自身權益同樣相當的重要。照顧人時也需要照顧好自己；幫別人做事時，也不要累死自己，畢竟全然無私的奉獻，有時會傷人，而互利至少大家都會開心一點。



  以上~~~



  最後附上哥佬可愛照片，推薦大家去看~~~

