url: https://www.ptt.cc/bbs/movie/M.1739262002.A.45B.html
title: '[好雷] 哥吉拉-1.0'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  奪得2024奧斯卡最佳視覺效果獎的《哥吉拉-1.0》，在台灣並沒有跟北美與日本一起於

  2023年底上映，如今千呼萬喚始出來，台灣的觀眾終於能在大銀幕上一睹日本影史上最經

  典、最悠久也最有名的怪獸角色──哥吉拉──在最新的70週年紀念作品裡的樣貌。



  雖說《哥吉拉-1.0》是一部主打「哥吉拉」的電影，但卻不是純看怪獸打架的爽片。故事

  背景設定在二戰後幾年，這也是為什麼片名取為「負一」。導演解釋，戰敗後的日本，急

  需重建，一切歸零，而片中哥吉拉肆虐的情況則讓日本雪上加霜，所以才會陷入負數的狀

  態。電影裡呈現出東京大轟炸後的東京，其實這一系列的大規模戰略轟炸早已讓日本考慮

  投降，因此，哥吉拉這隻輻射汙染的產物，也可說是廣島與長崎原子彈爆炸的影射。畢竟

  ，牠一直以來都被視為核武的隱喻。哥吉拉的熱射線噴出後所產生的衝擊波與其後降下的

  黑雨，都是將之比做原子彈的證明。



  不過，《哥吉拉-1.0》並不是一部拍來舔舐日本二戰傷口的作品。相反地，片中不斷批評

  日本政府草菅人命，並放大民間草根力量所能產生的影響。主角敷島戰後參與除魚雷的任

  務，一同工作的同事還有學者、船長與對於報效國家充滿熱忱的「小子」。由於小子在四

  人上一次於海上遭遇哥吉拉時傷到手臂，學者與船長再三告誡他不得參與殲滅哥吉拉的海

  神行動，沒想到他最後還是號召成群的漁船前來幫忙。猶如《敦克爾克大行動》的團結，

  象徵著日本人的韌性，以及為了彼此與下一代願意付出一切的決心。



  《哥吉拉-1.0》不但在背景設定上是時代劇，就連劇情設定也是如此，所以不少網友認為

  男主角神木隆之介很多演出都過於用力，不夠自然。情節安排上，也能看到許多台灣八點

  檔或舊日劇會出現，令人啼笑皆非的邏輯，像是「確認過眼神」就隨便把小孩交給陌生人

  ，以及衝擊波來襲，把人推進巷裡，自己直接承受的場景。



  不過，撇開這些為了懷舊所設定的劇情，《哥吉拉-1.0》果然是拿下奧斯卡最佳視覺特效

  的電影。從片尾字幕來看，這部作品的團隊規模與經費絕對不比好萊塢的大製作，但不論

  是爆破、哥吉拉的熱射線，還是水下樣貌，甚至是哥吉拉「本獸」，效果都非常精湛。除

  此之外，電影的配樂也懷舊地使用最經典的1954年版裡大家一聽就知道「哥吉拉要來了」

  的主旋律，搭配上大銀幕的視覺震撼，完全能夠感受到片中角色的恐懼。



  「我們需要更多像你一樣的人，結果已不能改變為何要光榮赴死？」



  《哥吉拉-1.0》用懦弱的主角一路走來的轉變強調「活下去才有希望」。敷島與橘隊長第

  一次的相遇，橘隊長就因為幫他檢查飛機而知道敷島是從「神風特攻隊」臨陣脫逃的懦夫

  ，他完全不是「敢死隊」。但是，戰時貪生怕死又何錯呢？保家衛國固然重要，但若只是

  到前線送命根本沒意義。敷島第一次活下來是自己決定逃跑，第二次存活又是由於自己的

  膽怯，甚至害得大戶島的後備兵全滅，也讓他一直活在自己「苟且偷生」的內疚。第三次

  則是典子反應快救敷島一命，第四次他終於下定決心，為了幫典子與大戶島的弟兄報仇，

  敷島決定採取神風特攻隊的自殺式攻擊，但戰爭後期製造的震電戰鬥機早已安裝彈射座椅

  ，而看出他做好覺悟的橘隊長，不僅在最後一刻告訴他這個配備，還要求敷島一定要「活

  著回來」。



  「沒上過戰場，是極為幸福的事。」



  除魚雷小隊裡的「小子」，因為二戰時還太過年輕，因此沒被徵召，失言說出「要是戰爭

  久一點就好了」的話，而後也對於「大人」不讓他上戰場報效國家感到相當不滿，船長只

  幽幽地說出短短這句涵蓋整部《哥吉拉-1.0》寓意的話。是啊，願意為國家出生入死十分

  難得，但如果可以不要有戰爭，不需要上戰場，不是更好嗎？由於「屬於他的戰爭尚未結

  束」，所以敷島遲遲不願娶典子。不要說他是跨不過心裡的倖存者內疚，光是還有哥吉拉

  與除魚雷的工作這些隨時都會「站著出門，躺著回來」的事存在，敷島就不願讓自己有家

  累與牽掛，雖然在執行任務前把典子的照片放在儀表板上的他早已將無血緣的明子與典子

  視為一家人。這固然是屬於戰時的浪漫與佳話，但同時也是這個時代的悲哀與無奈。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
