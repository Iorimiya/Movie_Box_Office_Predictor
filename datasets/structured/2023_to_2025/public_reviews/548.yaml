url: https://www.ptt.cc/bbs/movie/M.1717224610.A.301.html
title: '[好雷] 喜歡哥吉拉-1.0的結局嗎?'
content: '雷文防雷資訊頁



  有城市英雄、

  第一滴血、

  遠離賭城

  和哥吉拉結局雷。





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  有一種固定類型的片子總是能打動我，

  通常是先有一個一無所有的主角，

  然後讓他被現實逼到絕境，

  接著在自己的谷底對人生做出最後的反抗後，

  迎來悲劇的結局。


  像是城市英雄 (人生無望最後在警察槍下自殺)

  第一滴血一 (戰爭英雄在最後的反抗後被關進監獄)

  遠離賭城 (錢花光後醉死在妓女身上)


  (順帶一提，遠離賭城的原著作者在賣掉版權後就自殺了...)


  剛剛在netflix上看哥吉拉-1.0

  發現這部片也能給我這樣的感動，

  害我一大早看的老淚縱橫。


  但是我本來的預期的結局

  要不是男主角暴死在哥吉拉嘴中。

  就該是悲傷的男人在報了仇後，

  默默地帶著女兒離開東京這個傷心地之類的。


  但是...


  大團圓結局就算了，

  連女主角都復活了?


  疑?

  不對吧?


  女主角被大爆炸引起的風暴先推後拉，

  附近建築物都成了一堆廢墟瓦礫，

  然後她居然還活著?


  這刻意地轉折讓前面悲壯氣氛瞬間消失了一半，

  害我情感上有點... 不知所措?


  而且最後女主角脖子上冒出的黑圖騰是啥?

  不要說她是靠著哥吉拉的查克拉還是黑鬥氣附體

  才活下來的啊 = =a


  好奇問一下，大家喜歡

  1. 大團圓的救贖結局，還是

  2. 大悲劇的美學結局?


  --'
