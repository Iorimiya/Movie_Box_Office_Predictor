url: https://www.ptt.cc/bbs/movie/M.1739458653.A.0D8.html
title: '[新聞] 《哥吉拉-1.0》導演山崎貴談論人工智慧：'
content: '《哥吉拉-1.0》導演山崎貴談論人工智慧：目前算是一個非常可靠的輔助工具，但尚無法

  取代人類




  《哥吉拉-1.0》導演、同時也是日本知名特效師山崎貴，在美國時間週二於視覺效果協會

  頒獎典禮上（Visual Effects Society Awards），被問及如何看待人工智慧的議題，同

  時他也證實了，目前正在為下一部哥吉拉電影創作劇本與分鏡表。


  去年《哥吉拉-1.0》僅僅以 1500 萬美金的製作預算，打敗了《A.I.創世者》、《星際異

  攻隊3》...等大片勇奪奧斯卡最佳視覺特效，不過山崎貴透露，全新的哥吉拉電影他將擁

  有更豐沛的預算資源，儘管他沒有透露出確切數字。


  至於人工智慧該如何被需要大量電腦運算的特效部門運用，甚至共存，山崎貴也有自己的

  看法，「就目前而言，它是一個非常可靠的助手或是工具，但它還沒有達到可以佔據中心

  位置，同時產製人類可產出的東西的程度。基於這個原因，它還不在我們的產品線中，但

  人工智慧的發展速度非常快速，它未來的狀態值得持續觀察。」


  就算如此，山崎貴認為自己的將會非常後期才會選擇採用人工智慧，「最近我都還在用膠

  卷拍攝，同時我也喜歡用微型模型，雖然我知道未來的某一天我們還是必須擁抱人工智慧

  ，但我認為我應該是最晚上車的其中一位，因為我確實喜歡用舊的科技與技術。」


  人工智慧的運用將會是未來好萊塢無法躲避的議題，製作團隊會如何與之共存，業界又該

  如何制定規範，甚至是獎項也會面臨相關的道德問題，最重要的是，觀眾的接納與排斥，

  這類的辯證、應變，都考驗著每一個人。


  --'
