url: https://www.ptt.cc/bbs/movie/M.1711352203.A.6B0.html
title: '[討論]《哥吉拉：-1.0》導演山崎貴專訪(上篇)'
content: '來源



  本文將節錄較有趣的部分


  問：

  對於這部電影而言，有什麼主題是你想透過它傳達的嗎？


  山：

  是的，我的主題絕對是採用了戰爭與核武、核戰，我認為因為目前在世界上發生的事情，我們身處於此應該去反映這些主題以及其後果

  甚至是核戰，這是從1954年的哥吉拉就在延續的問題，你甚至可以說什麼都沒改變，至少在戲劇性的方面來看，所以說，哥吉拉表現了這些主題，我認為這次個再利用哥吉拉去思考戰爭核武之類的東西


  問：

  哥吉拉本身在過去70年中代表了不同事物，也包括了環境議題，您的哥吉拉在電影中象徵了什麼呢？

  山：

  是的，在《哥吉拉：-1.0》中的哥吉拉象徵的絕對是如剛才所提的戰爭與核武

  所以一隻涵蓋了戰爭與核武的怪獸，就是我的哥吉拉


  問：

  這部片打從一開始就是哥吉拉的獨角戲嗎？

  山：

  是的，我一直傾向於拍攝只有哥吉拉一隻怪獸的哥吉拉電影，事實上在《正宗哥吉拉》之前，我就跟東寶討論過一部哥吉拉電影，但我一直請他們要等到科技和數位技術發展到能呈現我想表達的東西時

  我的哥吉拉電影一直都是設定在戰後並只有哥吉拉一隻怪獸，而人們用他們所剩餘的武器背水一戰


  問：

  會有續集嗎？其他怪獸會不會登場？你會使用現有的東寶怪獸嗎？還是會自己創造新怪獸？


  山：

  我還沒想那麼遠，如果我要做第二部《哥吉拉：-1.0》電影的話，是的，我會用現有的怪獸帶出怪獸配角之類，而當然我會使用現今的數位科技來呈現


  但最大的挑戰在於講述一個兩大怪獸對戰的故事，會不會因為觀眾只想看怪獸打架所以失去了人類方故事的品質，我認為最大的挑戰會是劇本，如何去平衡一個穩固的人類故事但同時還有怪獸大戰，所以我得在劇本方面下非常非常多的功夫


  ——

