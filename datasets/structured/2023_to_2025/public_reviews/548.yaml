url: https://www.ptt.cc/bbs/movie/M.1717836352.A.176.html
title: '[ 好雷] 首看哥吉拉-1.0長評心得'
content: '第一次看哥吉拉電影。因為Netflix的電影宣傳頁面看起來很有質感，就看了。


  直接講感想，非常喜歡。大概可以列出三個優點。

  (以下文長，有一些劇透)
























  >>>

  第一，  基調沉靜但畫面台詞精煉，傳達激烈思考衝突。


  它的畫面和台詞少有贅字，卻能精煉傳達令人無法一下子就給善惡或好惡結論的議題，讓人思考咀嚼，慢慢品味不無聊。


  就以開頭馬上出現的幾個全劇重要衝突點來講。


  ---

  片頭飛機降落小島維修，載著自殺炸彈的機腹、崎嶇得不能稱為跑道的土路，男主穩穩將飛機滑行落地。畫面就傳達了自殺炸彈、精湛技藝、爛路也不能阻攔逃生的決心..等等訊息，所以那段降落畫面還定格特別長..我感覺到的是嘲諷吧，或自嘲?
  可稱是沒有累贅畫面。


  維修技師很快檢修報告飛機完美無故障，修理工隊長橘和男主才短短幾句對話，就交代了幾個馬上引起觀者腦袋思考判斷，但又無法一下子有完美答案的議題。


  一是男主是模擬飛行高手、難得的年輕人才，但首次真實飛行就是去當自殺特攻隊..這對話傳達很難說沒有批判國家機器吧。


  但馬上又出現反方觀點。橘先生的逼問皺眉、以及修理工們壓抑的激憤，可看出社會群體們對於男主這種戰時逃避職責的行為是多麼不認同。但再反向思考，又因為這是送死的責任，所以他們雖不認同，但也是壓抑激憤的心情，而非出口討伐逃避責任的那個人。


  至此，觀影者的心情我想和橘先生是一樣複雜、難有結論的。


  所以最後橘先生甚至這樣說了，「也是挺好的，有像你這種人存在。戰爭結果都已經確定了，何必奉命『光榮赴死』」。 所以這到底是諒解、還是嘲諷，還是都有? 責難的是逃兵，還是國家機器?


  所以，真的只是短短幾句話，每句話沒有贅字，讓觀影者的腦袋轉了又轉，很不無聊。


  哥吉拉當晚來襲，大家喊逃，眾多修理工奔逃時不忘帶男主肩頭拉一把，鏡頭也不忘在奔忙中特別帶到這一鏡。這就是剛才衝突點的後續餘韻 :


  「這是個逃兵，但他逃避的是必敗的境況被賦予的必死責任，他很可恥但我又能責難他到什麼境地呢」。 所以真的大難來時，他們還是像拉兄弟一樣但又只是值得順手顧一下而已、順便拍他快逃。


  這糾結壓抑的情感呈現，真的很細膩。




  ---

  接著就是第二個重要衝突點。橘讓男主登上戰機去對哥吉拉發射機砲。哥吉拉和機砲零距離時，男主還是沒有按下發射，最後哥吉拉把橘以外的修理工都殺死了。


  觀影者第一反應一定是對男主的再度逃避很難有好感，總之他是搞砸了。「小」哥吉拉在零距離機砲下到底殺不殺得死? 我這個哥吉拉初學者來看，我會猜是兩可之間? 因為是小的哥吉拉?


  所以他很可能是真的搞砸，害死這麼多人。但反過來說，橘叫他去做這種超危險的任務也是半點不猶豫，雖橘解釋是因為這飛機只有飛行員會操作，但修理工就不會操作了嗎?


  還是危機臨頭直覺反應，要求唯一一個不是你兄弟、且以飛行員為本職、又是逃兵的人去做這樣很大機率送死的任務，來解救大家，橘當然不會有很大壓力或內心掙扎啦。所以橘能尊重本心、從善如流、順理成章且理直氣壯。




  ---

  至此我做個小小的結論。


  片子開頭不久，男主就當了兩次逃兵，為社會團體所不容是可想見的應然活該下場。但反過來說，這兩次任務也都是社會團體沒有將男主視為「較應珍惜的一員」而給男主分派了必死和半死的任務。


  錯誤到底在誰? 雞生蛋還是蛋生雞?


  大家心裡其實都知道自己站不住腳的部分在哪裡。 所以男主壓抑、橘壓抑、那個原先對男主大加撻伐後來又忍不住照顧男主的鄰居大嫂，也是糾結的。


  整部片的情感基調就是壓抑糾結，然後哥吉拉登場，帶來破壞神般的絕望。完全契合二戰日本被轟炸過後的百廢待興、人心頹圮絕望難熬的現實。 至此，角色情緒與道德拉扯、社會與國家的檢討、戰後廢墟般的現實生活、魔幻巨獸哥吉拉，完美契合成一個虛虛實實、讓人走不出來的異界國度。





  >>>

  這邊講到第二個優點，電影打造了一個哥吉拉統治的難辨虛實的異界國度




  因為觀影者處在和平年代，戰爭廢墟對我們來說很有異世感。所以有時你一下精神沒集中沒有意識到，貫穿全片片長滿滿的城市廢墟場景與民眾撿垃圾生活，到底是哥吉拉幹的，還是二戰轟炸的?


  反正結果表徵都是一樣的，都很異界感。但理智你知道這是史實場景..所以哥吉拉又被帶得好像很多歷史存在痕跡一樣..? 真的存在了?


  滿城市的輻射殘留、得病的人們、城市的黑雨，這是核彈炸的，還是哥吉拉帶來的? 反正結果表徵都是一樣的。而且哥吉拉和核彈有因果關係呢。哥吉拉是完美穩穩的契合糾纏在這個充滿異世感的史實當中了。


  現代和平人，看二戰廢墟史實本來就陌生得像在看末日電影，那核彈造成的哥吉拉放在裡面，從人類情緒到城市表徵到身體傷痛..又方方面面契合。甚至政府軍隊和政客行事讓人詬病之處也處處重現、吻合實際。例如你無奈只能自組自衛隊的自救行動，是針對哥吉拉但也是很長時間的史實。從頭到尾有模有樣的重現了一次二戰日本人民歷經的種種對待、憤慨、傷痛、批判或無奈..你不會覺得，哥吉拉好像變成本來就在這世界中存在過?


  這就是哥吉拉統治的異世。


  我可以從片中感覺到日本人將對二戰的很多記憶與體感，轉化到哥吉拉統治世界中。


  幾乎可以想像為何哥吉拉系列會歷久不衰，成為很多人心中的聖地。哥吉拉像是一個將戰後日本提純具現化的異生物，傳達了完整的絕望世界和強烈的群眾情緒。真是非常難得的作品。對第一次看哥吉拉的我來說，是很棒的觀影體驗。





  >>>


  已經寫太長了。最後長話短說。


  最後一個很想講的優點是它的畫面色調與特效都很美、很精緻、很精采很順眼。這就不多說，自己看就知道了。


  總體來說，此電影文戲壓抑又衝突點滿點、情感細膩、武戲精緻暢快又有動腦，讓人耳目一新。商業娛樂性夠，同時不失為讓人思考的有趣電影。最後，還打造了哥吉拉破壞神的虛實史實與神性，這是它最特別的地方。


  我是看得很享受。 第一部哥吉拉電影。


  抱歉感想落落長，就分享到這吧。







  -----

  Sent from JPTT on my Xiaomi M2010J19SG.


  --


  其實以我個人好惡，當然不會認為男主逃避神風特攻隊的送死任務有錯。但也不是不能體

  會戰爭期其他日本軍民的糾結想法。 也許很多東西，戰時就不一樣了吧。


  我想和平年代人的價值觀一定很能認同主角，但戰時軍民的想法和我們不同。(若房子被

  炸了家人死人還會有和現在一樣的餘裕嗎)


  它拍出這衝突，讓主角行事似有大錯必須彌補，但觀影者看來其實這不能完全稱錯很能體

  諒。我想也是這部片很吸引人看下去、在美國票房也很高很討喜的原因之一。主角立得很

  正。



  非常認同qcwxez說的，讓我又很想補充第三段當時實在太長，所以倉促完結的感想。


  >>>

  優點三，戰鬥畫面、色調、特效、音樂很美。因為它試圖傳達「人神對抗」的絕望感，非只是人獸對戰畫面。


  很粗略的感覺來說，本片一半的時間在異界感的城市廢墟中呈現，至於另一半是多場戰鬥場面。為什麼我一直覺得這些色調、特效、戰鬥畫面都很美。因為它他X的哥吉拉發大絕時配聖歌啊!
  (攻擊高雄號時)


  哪個怪獸片在怪獸攻擊時配聖歌? 我能想到的就是史蒂芬金的迷霧驚魂。巨大到無可抵禦的怪物現身時，甚至猶如開天闢地的遠古神祇。我記得那片也是給怪獸現身配樂聖歌。


  迷霧驚魂是審判人性與人類文明的末日電影，電影賦予怪獸遠古神祇一樣的審判任務，給予配樂聖歌。和一些「真正」怪獸片中專職吃人的生物、怪物，任務是完全不同、不可相提並論的。XD


  侏儸紀公園的恐龍吃人、吃肉，你們有注意到哥吉拉在本片中不吃東西嗎? 牠咬到人都是把他們拋飛。我看電影時有很強烈的違和感，哥吉拉不是生物! 牠長得像暴龍，但走起路來卻迥異，牠走路居然像人。


  牠那好像「僵直性脊椎炎」在城市中筆直行走的姿態，應該沒觀影者能忽略。我覺得那像人的胸肌與走路姿態，而不是爬行動物的移動體態。


  牠沒有生物進食本能，那什麼本能驅動牠行動? 電影中很強調的就是牠在城市中筆挺行走大肆破壞的偉岸鏡頭，好像在城市中這樣一步一腳印大肆拆遷，就是牠的天職。


  也許是我聯想力豐富，反正看牠這樣的行為樣態，我是想到火之七日間的巨神兵。看牠解體，巨神兵解體也是這樣。


  所以哥吉拉在電影中被賦予的深層本質，應該是一種人造毀滅產物的..集結? 具象化? 或是反正不知道怎麼來的牠就來了。與其說牠像怪獸、生物，牠更像是二戰後日本面臨的一種…癌?


  因為牠有很強再生力、超強破壞力、和核能糾纏、令人無法對抗。牠不像生物，像個病變。且牠毀滅日本最強的對抗武力時，電影是賦予哥吉拉聖歌配樂，好像哥吉拉是一種審判或天罰一樣。是日本社會必須面對、難以迴避、令人極度恐懼絕望，但這次卻必須「好好把事情處理好」的議題。


  所以就如同qcwxez說的，您真的結論得很好。你的感想也激發我把最後這段自己的感覺還是整理出來了。但因為很個人感想，就不再另開回復另佔版面，直接繼續放這了。


  所以這部哥吉拉對我來講，牠不是只是怪獸片或動作片，那之外的元素才是我最覺得最特別與珍貴的。


  附帶一提，最終一戰，聖歌的配樂終於是給到了男主角。他可總算是立起來了，蠻帥的XD


  而哥吉拉呢? 聖歌給別人了。但一哥還是一哥，牠還是全劇最無法被人超越的那個角色，牠更厲害，得到的是全體敬禮。


  哥吉拉就是這樣的一部片。牠真的不只是怪獸…。'
