url: https://www.ptt.cc/bbs/movie/M.1717254085.A.658.html
title: '[好雷] 哥吉拉-1.0 好看但小不夠爽'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  今天看到Netflix上哥吉拉-1.0我就看了

  看完之後開始在想


  其實以一部好片來說 哥吉拉-1.0幾乎所有元素都有了

  但不知為何看完沒有那種 挖賽超好看 意猶未盡的感覺

  就是覺得是好片

  (要被噓了嗎)


  哥吉拉-1.0真的屌打一堆美國只敢在晚上出來的酷斯拉

  看得清楚多了 而且夠強 夠無腦 目的單純 就是要搞破壞

  出場時間其實也算蠻多了 但私心希望再多一點

  模型感還是有點重 甚至幾個正面特寫的畫面  真的讓人覺得在看公仔的樣子

  不過這就是日本哥吉拉的特色吧  以日本特效技術來說真的超屌


  劇情其實蠻流暢的  但人類戲部分還是有稍稍不耐

  有一種在看日本晨間劇的感覺 (就是15分鐘一集 湊起來那種感覺)

  甚至有點太老套了

  講個可能會被噓的

  就是為什麼男主最後不死掉啊XDD

  我知道很多人會說 這是在講戰爭存活下來的人 再給人希望 有的沒的

  但私心還是蠻希望他死掉的XDDD

  老實說整部片從頭到尾都蠻討厭他的 可以理解這種人在現實生活才是常態

  但就是蠻討厭的  到最後還是無法喜歡他

  我喜歡看那種充滿勇氣的主角  但這個人真心無法  甚至覺得演員演得普通


  其實大部分的角色  都刻劃的蠻棒的  不會覺得哪個很免洗

  都可以體會這些人的個性  存在在這部電影的意義


  哥吉拉放大絕真的很帥

  電影要把他幹掉的終戰也蠻有創意  雖然我覺得一堆船來支援那段

  有點太為了熱血而熱血  (日劇的老毛病)


  結局也回到核災的傷害   (日本人真的對這個受傷很深)


  特效 音效 音樂 都很棒

  導演功力也很強   導過永遠的0 再導哥吉拉真的功力又有上升


  其實就是一部幾乎任何元素都做得水準以上的好電影

  覺得不夠爽可能我個人問題吧XDD

  但這部電影的節奏真的  好像有點可以再更緊湊一點





  --

  感謝打錯'
