url: https://www.ptt.cc/bbs/movie/M.1717345418.A.1B0.html
title: '[好雷]  哥吉拉-1.0 - 影仔看電影'
content: "哥吉拉-1.0 / ゴジラ-1.0 / Godzilla Minus One　(2023)\n\n＊內文含些微劇情雷＊\n\n\n　　電影開頭，有很多的表情特寫，很強調角色的情緒與狀態，卻又偏偏主角的演技不太\n\
  好。電影的前半段看主角那個性，感覺好煩。不過後段還行，後段的角色心境單純些，表\n現也就還行。前段主角的經歷與心情，理應該是相當深層、複雜的感覺交織，但神木隆之\n\
  介讓我明白，原來他的演技就只能這樣了啊。\n\n\n　　開始覺得有趣的地方，是掃雷船上的四個性格分明的角色。船長討厭政府的制度與作\n為，但卻有著守護國家的心。學者就是個學者。小子不懂得戰爭的可怕，想著要上戰場可\n\
  以有番作為。而主角則是怕死又自私，卻也是無比的真實。他的身份與失職帶給他許多折\n磨，我認為主角是個寫得相當好的角色，有許多的內心衝突，大環境的壓迫以及戰爭的影\n\
  響，讓這個角色從頭到尾是一段精彩的心路歷程。因此我覺得劇本寫得很好，但男主角演\n得不好。好在女主角與配角等諸多安排，我都還是相當喜歡。\n\n\n　　電影的前半段，講述著剛結束二戰的日本。從侵略世界到成為戰敗國，以及被放了兩\n\
  顆原子彈，我覺得這些情緒對於日本民族是相當複雜的。是該當個好軍人，為國犧牲；還\n是對於侵略其他國家，感到悔恨。戰敗國的恥辱以及一切歸零，跟被原子彈摧毀的城市與\n\
  逝去的眾多性命，這樣的命運令日本人難堪卻也只能選擇繼續走下去。這部電影是要拍給\n戰後日本人看的回憶與鼓勵，既是對自身的反省，也是要日本人記得艱苦地走過這段路。\n\
  我認為因此日本選擇在一些國家不做上映。\n\n\n　　哥吉拉電影有兩種，一種是保衛日本人民的，一種是攻擊日本人民的。前者通常是哥\n吉拉打其他怪獸，後者則通常在講述哥吉拉的現身。電影整體的架構與之前的哥吉拉電影\n\
  類似，前段哥吉拉嚇到漁船，中段哥吉拉登陸摧毀城市，然後日本軍隊與人民共同努力擬\n定對策，最後暫時地將哥吉拉給擊退了。這部電影的主題是關於二戰後期的日本，中間哥\n\
  吉拉襲擊城市的段落，在此作中巧妙地跟原子彈的創傷給重疊了。我想著小時候看的哥吉\n拉電影，最喜歡的都是哥吉拉登陸時那經典的配樂，還有不斷逃跑的人民。想著這些都是\n\
  經典的哥吉拉電影橋段，今天才發現日本人民最後的團結努力，也是哥吉拉電影的必要元\n素。日本人會在災後重生，這是哥吉拉電影總是會存在的希望。\n\n\n　　關於拿下奧斯卡特效獎，這可是預期的一大看點。雖然整體來說並不感特效有特別出\n\
  色，尤其好多戰艦激起的水花都不太自然，不過電影的每一次哥吉拉的熱射線，做得真是\n相當震撼！ 我看哥吉拉電影沒有死忠迷多，但也還算是從小看到大。摒除好萊塢拍的版\n\
  本，傳統哥吉拉電影的特攝片風格，是種浪漫與情懷，但也是種缺陷。這種特攝片風格，\n我覺得到了《正宗哥吉拉》才終於結束，而走入CG特效電影的範疇。這次的《哥吉拉-1.0\n\
  》，則是比以往看過的日本哥吉拉電影來說，是特效做得最自然、最好的一次了。這樣的\n表現跟好萊塢的特效大片比，或許不到超越，但絕對是不輸人的。而預算跟好萊塢的作品\n\
  比則更是驚人地有效益，足以大大衝擊外國的電影業。以日本的哥吉拉電影，這次的整體\n表現絕對是史上最佳，不容錯過。\n\n\n影's 2024 06 02　給分：8.2/10\
  \ 分\n 粉絲頁\n\n\n#哥吉拉\n#網飛有得看\n#哥吉拉負1點零\n\n--"
