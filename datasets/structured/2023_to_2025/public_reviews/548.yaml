url: https://www.ptt.cc/bbs/movie/M.1699021014.A.3BD.html
title: '[好雷]哥吉拉-1.0感想+劇情'
content: '雷文防雷資訊頁


  前提

  我沒有看過很多哥吉拉片子

  只有看過好來屋吃魚蜥蜴版跟傳奇影業那三部曲(VS大金剛等)

  可能有人會說強度怎樣啊~的 不過這部分不是我的扣分點 請見諒

  還有一部分劇情仔細想想可能會有點不合理之處 不過我是看氣份的

  不是不合理到會出戲的話我也直接給過


  滿分10分的話 這部可以拿到9.0分

  扣分點是因為要尊重標題-1.0

  本片就我感覺沒有很嚴重的說教成分


  以下是劇情聶他

  (幾乎是講全劇情了 想自行體驗的不要看)

  (我文筆沒很好 文字也可能無法傳達出臨場看的感動 還是推薦去電影院看)



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~
























  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  --

  劇情開始 時間點是第二次世界大戰末期

  主角敷島浩一是特攻隊員 受命去給敵人特攻

  不過他怯懦了 謊稱自己機體有問題 因此轉頭回去補給基地說要維修

  補給基地的維修班長(橘 宗作)跟部下檢查之後發現機體沒有任何問題

  問敷島是怎麼回事 主角不回答 只是轉頭走到海邊坐下看著海

  一名整備兵過去安慰敷島"這樣活下來也不錯啊 沒啥麼"

  就在此時 敷島注意到了水中很多深海魚浮了上來

  基地也響起了警報

  時間是黑夜 所有人都拿了槍準備戒備

  警戒塔上的哨兵打開了探照燈 只看到一個大怪物

  在場突然有人說

  "那是哥吉拉 當地人都這樣稱呼"

  整備班長橘認為正面衝突穩死 所以要大家退後到壕溝


  哥吉拉一邊破壞基地一邊逼近

  這時候橘看到了敷島之前開的特攻機就停在哥吉拉的路線上

  要敷島上機然後拿上面的20mm機砲射擊

  敷島爬上了飛機 但是手一直發抖 無法開槍

  哥吉拉最後靠近了壕溝 一名整備兵受不了壓力開了槍

  打中了哥吉拉的眼睛 哥吉拉很不爽 開始攻擊士兵

  而敷島逃出飛機時看到哥吉拉把飛機拋非 飛機爆炸把敷島炸飛 他失去了意識


  白天了 敷島醒來 看到陣亡的士兵被排好他左看右看 發現橘拖著受傷的腳 慢慢把陣亡士兵的遺體搬過來

  橘看到敷島醒來 直接一拳扁下去罵他膽小鬼 其他人都死了


  (轉場)

  日本戰敗了 大家乘坐復員船一言不發的回國

  橘默默地走到敷島身邊 塞給他一封信之後頭也不回的走到另一側

  敷島打開信封 發現裡面都是照片 書信 那是那個島上的整備兵們的東西

  他慌忙的把信封收好


  (轉場)

  敷島回到了家鄉 但是東京已經被炸得面目全非

  老家只剩下廢墟

  這時候隔壁廢墟走出一名婦人 是敷島家的鄰居 太田太太

  太田太太看到敷島 馬上衝出去打他

  "為啥麼你們不爭氣一點 打輸了 我家的三個小孩都死了"

  敷島鼓起勇氣問太田太太他的家人怎麼了

  太田回答"都死了 火燒過來 你家父母跟我家小孩命運相同"


  戰爭結束了 但是生活還是要過

  敷島在大家湊起來的闇市吃飯的時候突然聽到有人大喊小偷

  敷島湊過去看 突然一名小姐(大石典子)把一名嬰兒(明子)交給了敷島

  說"你幫我看一下" 人就跑走了 店主在後面追著


  敷島抱著嬰兒等阿等 等不到人 原本想要把嬰兒拋著走開

  但是回頭看著嬰兒的眼睛又忍不住

  於是又回去把嬰兒抱起來

  離開闇市時卻發現原來典子就在旁邊看著

  "為啥麼你不來接"


  "我還想問為啥麼你待在那邊 我沒辦法回去阿"

  "...為啥麼你剛剛想拋棄小嬰兒?"


  "我才沒有"

  敷島回頭就走

  沒想到典子就這樣跟了上來一起回家


  在敷島家中 敷島問典子

  "你老公呢?"

  "我沒有老公"

  "那小孩是?"

  "不是我的孩子 之前空襲的時候一名不認識的婦人死前把小孩託付給我的"

  敷島轉頭沉默了一下 回頭卻發現典子抱著小孩睡著了


  第二天 敷島走出門時遇到太田阿姨

  他質問敷島他撿來的是啥麼

  敷島回答那是他們擅自跟過來的

  太田阿姨本來嘴巴很刻薄的酸敷島沒能力就別亂檢

  但是當他聽到小嬰兒明子不是典子的小孩 沒辦法弄出母乳

  馬上回頭拿了他家剩下的白米過來

  "你這樣是要搞死嬰兒阿 這剩下的白米好好弄個粥給他 不然會營養不良"


  (轉場)

  時間過了一兩年 周遭開始慢慢復甦

  而敷島也和典子一起住了下來 養育明子

  為了養家 敷島找了各種工作 最後他找到了"掃雷員"的工作

  薪水很高 但是不保證你存活

  典子本來很反對 但是敷島說這樣才有辦法養家 不然大家都會餓死

  只是很危險的工作 沒說是必死

  而且這次還有準備特製"防機雷"的船 碰到不會爆炸喔


  敷島到了工作現場 發現所謂"防機雷"船 只是個純木製船 名子叫做新生丸

  艇長 秋津

  白髮大叔 野田

  年輕小子 水島

  雖然船很破 不過大家倒也工作愉快 薪水高也讓敷島賺了不少錢


  (轉場)

  各種新聞畫面 整段都是英文語音

  比基尼環礁試爆

  發現巨大怪獸

  攻擊無效

  巨大怪獸直接往東京衝

  因為蘇聯的關係 米國不能軍事行動 日本好自為之


  (轉場)

  畫面回到新生丸上面

  敷島們受命待在海岸邊作為哥吉拉防線之一

  成員們很不滿"開啥麼玩笑? 這只是掃雷艇 上面只有機槍耶 美軍都打不贏的怪獸?"

  "上面說會暫時把重巡高雄還給我們"

  "那不就贏定了!?"

  "但是前提是我們能拖到時間讓高雄過來"


  哥吉拉出現了 新生丸狼狽的用各種手段都沒啥麼效

  就一次 哥吉拉嘴巴咬著機雷的時候被敷島開槍打到 頭部有受傷停了一下

  不過馬上就把受損的部分長出來了


  這時候高雄抵達了 砲擊好像有效 哥吉拉後退了一下 不過馬上就被衝過來咬掉艦橋

  之後下潛從下往上噴雷射把高雄炸掉了

  哥老發洩了一下好像滿意了所以轉頭走 敷島也因為現場的爆炸受傷昏迷


  敷島醒來時發現自己在病床上 他馬上說這個人類不可能贏 應該馬上疏散

  艇長秋津說上面下達封口令 不想讓民眾恐慌


  敷島也沒辦法 只好回去過著日常生活

  典子為了想自立 找了在銀座的工作


  某天敷島沒工作 典子出門時 警報響起

  收音機傳出了


  "緊急新聞"

  "巨大怪獸上陸了 前往銀座 這不是創作作品 請大家避難"


  敷島一聽到馬上衝出門


  另一方面 搭著電車上班的典子被哥吉拉波及到

  搭乘的電車被咬起來 拚了命才從裡面逃出

  在路上狼狽走著的時候被其他逃命的人撞倒 哥吉拉就在後面快踩過來了

  這時候趕過來的敷島扶起了典子一起逃命

  哥吉拉破壞了銀座 而日本自衛隊也開始用坦克攻擊哥吉拉

  哥吉拉用雷射摧毀了坦克 同時引發了暴風

  在旁邊看熱鬧的典子馬上馬被嚇呆的敷島踢進去巷子裡面 不過典子就被暴風吹走了

  敷島出來的時候發現周遭都被夷為平地 天上下著黑雨 他絕望的對著哥吉拉大吼


  (轉場)

  敷島家舉辦典子的葬禮

  敷島雙眼無神整個人虛脫

  不過這時候掃雷艇同事的野田跟他說"我們有反擊哥吉拉的計畫 你想參加嗎"

  野田同意了


  會場中 很多退伍士兵聚集在一起

  野田跟大家說明作戰方式

  聯合國願意暫時返還被沒收的四艘驅逐艦

  作戰大綱是讓雪風與小響拖著氣瓶

  繞著哥吉拉一圈之後排氣

  這會讓哥吉拉失去浮力

  作戰區域選在相模原灣 水深有1500公尺

  這樣急速下沉希望能讓水壓壓死哥老

  如果這樣還不行 就讓他再次急速浮上 看看這潛水夫病能不能殺死哥老


  敷島說"用船引誘哥老太不可靠了 你有飛機給我開嗎"

  野田說會想辦法 然後他找到了被廢棄很久的"震電"

  不過因為放很久了需要修理

  敷島就說他知道有一個人可以幫忙

  (中略)

  橘一開始很不爽敷島 不想幫他修飛機

  不過敷島說 他有成功給哥吉拉口爆過 至少確定內側的防禦力很弱

  他想直接開飛機從嘴巴飛進去炸

  "我的戰爭到現在都還沒結束 你的也是對吧"

  橘聽了之後決定要幫他修理飛機了

  修好之後跟敷島解釋"這個拉槓是炸彈的安全裝置 快撞上去之前拉開"

  還有其他裝置我跟你解釋一下...(畫面拉遠


  作戰本部開了作戰會議

  雖然這個任務危險性非常高 但是希望大家不是抱著必死 而是要活著回來的決心下去做

  會議結束時 掃雷艇同事的小夥子水島說"明天就是作戰了 真讓人緊張啊"

  不過野田與艇長秋津卻跟水島說你受傷了 別來礙手礙腳

  水島很生氣 在後面大喊"我們不是同伴嗎 讓我上船阿"

  離開的秋津對著野田"未來就交給年輕小夥子了"


  另一方面 敷島趁著明子睡覺的時候留下了一封信給鄰居的太田阿姨

  上面說"如果自己不在了 我全財產給你 麻煩你照顧明子了"


  作戰開始 哥老比喻想的還快衝上陸

  敷島開著震電對著哥老開槍引哥老下海

  經過一番搏鬥 小響和雪風成功的達成第一階段 讓哥老下沉


  哥老看起來還很活蹦亂跳 因此第二階段 讓哥老浮上

  不過哥老咬破了浮袋 浮力不足 只有小響跟雪風的出力也沒辦法把哥老直接拉起來

  大家不知道該怎麼辦的時候

  被拋下的小夥子水島帶著一堆漁船過來助陣

  水島"還敢說我礙手礙腳嗎!"

  艇場秋津大笑"我投降! 你贏了!"


  大家合力把哥老拖了上來

  這時後哥老很憤怒 根本就還活跳跳

  (注 好吧我知道這作戰聽起來真的很智障 但是這不是主要扣分要素)

  他準備要用雷射給這堆人類一個教訓

  大家看到哥老在集氣了 也做好死了覺悟了


  這時候敷島的震電回來 眾人驚訝"難道他!?"

  敷島看著儀表板上典子的照片 拉開了安全裝置 一頭撞上哥老嘴巴

  一個爆炸 哥老的頭上半部被炸飛了 全身發出藍光崩壞 沉入了水中


  然後大家看著天上 敷島居然拉著降落傘降落

  原來橘在修震電的時候 把座位改成有逃生機能的椅子 然後要敷島"活著回來"


  一群人回到了港口 敷島受到英雄式的歡迎

  這時候敷島看到了太田阿姨憤怒的衝過來打他 然後塞給他一份電爆

  他看了一下很驚訝

  原來典子在銀座被炸飛沒有死 只是被送醫然後失去意識很久

  醒來之後馬上打電報通知敷島 不過那時候敷島已經出擊了 是帶小孩的太田阿姨代收


  敷島帶著小孩衝去了醫院 打開門看到包著繃帶的典子

  "你的戰爭結束了嗎?"

  敷島抱著典子大哭


  最後畫面轉到海底 哥吉拉的殘骸開始再生

  (哥吉拉的吼聲)

  (劇終)


  --

  片中就藉由艇長的口中說出"情報管制是這國家的家傳本領阿"

  也不是沒有努力拉 但是就丟出豆戰車轟幾下 要掃雷艇挺前線拖住大怪獸

  片中一開始就有給解釋 因為蘇聯在那邊盯著所以米國不敢在日本附近軍事行動

  怕會出事...

  合不合理不知道 至少有給解釋了

  看完電影趁熱打的 雖然有些台詞細節可能有順序錯亂或是記錯的地方'
