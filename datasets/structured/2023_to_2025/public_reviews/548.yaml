url: https://www.ptt.cc/bbs/movie/M.1717307446.A.5A3.html
title: '[好雷] 哥吉拉-1.0 什麼都會好就男女主角…'
content: '~~~~~~~~~~~雷文 主文分隔線

  ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  劇情先不多做討論 就角色來說


  真的什麼都好


  就是神木隆之介撐不起這個角色 好可惜PTSD橋段各種出戲 想要演的很憤怒但看起來就很像

  船上怒視小子跟最後開飛機 是我覺得是少數亮點


  美波還是美波 演最好就最一開始臉髒髒的時候露臉後第一幕就超用力演 情緒給最滿 觀眾?


  小朋友明子就一種好像不小心走到-1哥片場的感覺 爆哭的時候有一種後期配音感…


  學者 船長 小子是不錯的配角 各司其職 也不會過多搶戲


  隔壁的澄子大姐一開始想說到底在兇幾八幾點 但想到他在大火中失去一切 而且面對小孩又


  哥吉拉-1.0 雖然沒有正宗哥內閣總辭熱線這種令人印象深刻的橋段 但整體不論是在編排節奏都恰到好處 最後作戰也沒話說 很值得一看


  -----

  Sent from JPTT on my iPhone


  --'
