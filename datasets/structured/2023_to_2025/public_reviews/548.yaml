title: '[好無雷] 哥吉拉-1.0'
content: '本文為兩人的心得綜合而成


  取材自資深哥迷(自稱)的老婆



  很驚嘆這次哥老的切入點..是以往都沒嘗試過的的方向


  不管是戰後的刻畫，還是人物設定都是九分有說服力的


  (比十分少一點，沒辦法終究是有些許的瑕疵)


  當然日本電影的演法總是在我們看起來尬感就是有那麼


  的嚴重，或許這種劇團感不得不說確實是日本電影特有


  的氛圍。



  但就算是你對人類側毫無期待，哥老本身也完全能撐起


  這次電影全部的篇幅。


  人類側作為配角的部分已經夠了，剩下的就交給哥老吧


  不論是本次的設計，嘴砲的氣勢、威力，各種烘托、取


  景角度、分鏡規劃等等都是十分亮眼的，看得出來在有


  限的預算內盡可能做到了最好。雖然總覺得還是有那麼


  些庵野感...


  我覺得日本作為一個多災多難的民族，真的很擅長發揮


  營造絕望感這件事情，而哥吉拉正是其中的精華凝聚的


  神祇。




  既然標題都無雷就不談太多了。


  身為一個被哥老陪伴著成長的中老年人，無疑是幸福的


  ，可以看到童年的ip依然在螢幕上活耀，哥老依然是那


  個哥老，靠著嘴砲、甩尾、死亡翻滾 (?)，擺動著萌萌


  的小手在海裡踩水浮出一半的身體打著蚊子...


  就可以輕而易舉擄獲大家的心，








  簡直就跟水豚沒有兩樣(?)









  就算是去電影院看也絕對不會失望的。


  絕讚推薦


  --





  --'
