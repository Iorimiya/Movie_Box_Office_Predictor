url: https://www.ptt.cc/bbs/movie/M.1704069113.A.8D6.html
title: '[新聞] 《哥吉拉-1.0 Godzilla Minus One》正'
content: '《哥吉拉-1.0 Godzilla Minus One》正式打破「哥吉拉」日語系列電影最高票房紀錄



  日本經典怪獸特攝系列《哥吉拉 Godzilla》最新作《哥吉拉-1.0 Godzilla Minus One》登

  陸日美地區之後好評不斷，目前全球票房成功累積超過 $7,800 萬美元，正式打破由《正宗

  哥吉拉 Shin Godzilla》保持的「哥吉拉」日語系列電影最高票房紀錄




  作為 Toho 東寶第 33 部「哥吉拉」日語系列作品的《哥吉拉-1.0》，拍攝成本為 $1,500

  萬美元，由知名日本動畫導演山崎貴執導，在北美上映之後成功造成轟動，現今在爛番茄獲

  得高達 98% 新鮮度，網友評分同樣是接近滿分的 98%。


  《哥吉拉-1.0》目前於日本國內獲得 $4,200 萬美元，國際票房為 $3,500 萬美元，全球票

  房總計 $7,800 萬美元，成功超越庵野秀明執導 2016 年電影《正宗哥吉拉 Shin Godzilla

  》的 $7,790 萬美元，成為有史以來最高票房的「哥吉拉」日語系列電影。


  上週，官方正式宣布加碼推出黑白電影版本，有興趣的讀者們敬請留意，目前港台地區仍未

  有上映情報，讀者們還需要再等等。






  --'
