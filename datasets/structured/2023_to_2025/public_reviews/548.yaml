url: https://www.ptt.cc/bbs/movie/M.1712151117.A.FFB.html
title: '[  雷] 哥吉拉-1.0'
content: "經典的哥吉拉的音樂出現，真的是滿滿感動。\n \n雖然聽不懂日語，\n但是電影緊張氣氛跟哥吉拉的出現，\n依然不失哥吉拉的霸氣。\n \n而且電影一開始就直接出現哥吉拉，\n\
  整片過程哥吉拉也是稱職的演好演滿。\n \n主線劇情大致上蠻好懂的，\n主角因為以前的受到哥吉拉攻擊，\n失去同袍創傷以及女主角為了保護他，\n也受到哥吉拉攻擊受傷，\n\
  奮不顧一切去決戰哥吉拉。\n \n整部特效真的看得很爽，\n哥吉拉無盡摧毀銀座建築物，\n然後搭配經典光束攻擊，\n這次光束攻擊我超級愛，\n直接從尾巴尾端開始一節一節背鰭？\n\
  開始往頭部漸進長出，長得更長，\n搭配藍色光跟音效，\n最後發出光束把整個銀座摧毀滿目瘡痍。\n \n片尾哥吉拉受到圍攻，\n再度搭配哥吉拉出場經典音樂，\n\
  真的是配到滿點。\n最後再度醞釀發出光束波，\n突然電影沒有聲音，\n整場非常壓抑緊張，\n最後主角的出現才開始出現背景聲音，\n真的很爽！\n \n最後主角的愛人最後找到在醫院，\n\
  特寫在女主角的脖子上的紋路，\n似乎有什麼含義跟伏筆。\n故事演到這的時候，真的蠻感人，\n聽到同場日本觀眾啜泣聲。\n \n當然哥吉拉被擊沈到海底時，\n突然產生變化，果然沒有這麼快就結束，\n\
  希望有機會看到下集。\n \n片尾名單繼續搭配哥吉拉經典音樂還是真的很爽，\n製作團隊名單跑完後，\n還出現哥吉拉的怒吼聲，真的很爽。\n \n--"
