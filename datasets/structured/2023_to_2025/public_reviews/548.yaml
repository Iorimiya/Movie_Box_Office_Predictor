title: '[新聞] 哥吉拉七十週年大作《哥吉拉-1.0》魅力'
content: '哥吉拉七十週年大作《哥吉拉-1.0》魅力盤點：自絕望而生的荒神哥吉拉，要製造更多的絕

  望



  2016年，由庵野秀明擔任編劇與總導演、樋口真嗣導演的電影《正宗哥吉拉》上映，這是當

  時日本影壇的盛事，當然，各大媒體忙著採訪許多商業電影導演，想知道他們對《正宗哥吉

  拉》的想法。而身為拍出《ALWAYS幸福的三丁目》與《永遠的0》大熱電影的導演山崎貴，

  當然也被問了——特別山崎貴還是以電腦特效效果見長的導演，他對一樣有大量特效的《哥

  吉拉》系列電影，一定有話要說。



  當時山崎導演表示：「（《正宗哥吉拉》）為下一部《哥吉拉》電影的導演立下了不得了的

  高門檻！」


  2019 年 8 月，山崎貴導演接到邀約，將成為最新《哥吉拉》電影的導演。山崎一想，這不

  是明晃晃的回力鏢打臉嘛！如今，2023年11月，山崎導演的電影《哥吉拉-1.0》正式在日本

  上映了。明年就是哥吉拉誕生七十週年的重要時刻，做為七十週年紀念電影、同時也是日本

  國產第三十部哥吉拉電影的《哥吉拉-1.0》，具有重大意義。在《哥吉拉-1.0》還沒在台灣

  上映之前，我們先來盤點這部電影的幾個魅力！



  1. 導演對哥吉拉的愛


  描述五零年代東京下町小市民生活的《ALWAYS 幸福的三丁目》，是山崎貴一炮而紅的契機

  。2007 年這部電影推出續集《ALWAYS 再續幸福的三丁目》，票房更加亮眼。在這部電影裡

  ，竟然出現了全3D動畫製作的哥吉拉。《ALWAYS 幸福的三丁目》這個系列並不是奇幻電影

  類型，出現哥吉拉實在是有點牽強。原因其實是因為第一部《哥吉拉》電影，就是在 1954

  年上映的。做為紀錄時代變遷的《ALWAYS 幸福的三丁目》系列，當然要列進五零年代最紅

  的日本社會現象……但還有另一個原因，就是山崎導演本人對哥吉拉的喜愛。



  後來，埼玉縣的西武園遊樂園，推出了3D電影遊樂設施《哥吉拉・THE・RIDE 大怪獸頂上決

  戰》，要讓遊客體驗哥吉拉大戰王者基多拉的震撼決戰。這部3D電影的導演，也正是山崎貴

  本人。可以說，放眼當今日本影壇，像山崎貴這樣……熱愛哥吉拉、甚至已經將哥吉拉兩度

  搬上銀幕、卻仍然沒有真正執導《哥吉拉》電影的導演，是很少見的。因此，東寶影業選擇

  山崎貴，幾乎是一個想當然耳的選擇。



  2.從戰後的光明面轉變為黑暗面


  《ALWAYS 幸福的三丁目》裡，二次大戰已經過去了十三年（1945～1958）。這部電影裡日

  本社會仍然隱約有著戰爭的影子，所謂的「戰後復興」，在這部電影裡如同三丁目的夕陽，

  是充滿溫暖與人情味的——街坊鄰居會互相照應生活所需，而即便許多人家境仍然困窘，但

  他們仍然相信著明天會更好，持續努力地工作改進生活。但是，在山崎貴的《哥吉拉-1.0》

  裡，「戰後復興」是一個諷刺的夢想：在經歷戰敗之後的日本，國民傷痕尚未痊癒，但就在

  此時，哥吉拉出現了，使全日本陷入了更大的絕望。


  這是為什麼片名會稱為「-1.0」的原因：日本已經因為戰敗而「歸零」了，此時哥吉拉的出

  現，讓日本成為了「-1」。這是山崎貴的構想，他希望這部哥吉拉電影，能讓觀眾感受到絕

  望——這正是初代哥吉拉在 1954 年帶給當時觀眾的震撼。1954 年《哥吉拉》上映時，當

  時日本敗戰尚未滿十年，哥吉拉等同於傷害日本的原爆，它的出現有強烈的弦外之音。對觀

  眾而言，他們在銀幕上看到的不只是一隻虛構怪獸而已，更是他們曾經經歷過的現實惡夢。



  3.絕望之後還有多重絕望


  才剛要在戰敗土地上重建，就遇上了哥吉拉，此時的日本陷入了絕望……但這僅僅是《哥吉

  拉-1.0》的第一層絕望。再者，因為戰敗，日本暫時受到駐日盟軍（GHQ）的管轄，而當時

  日本軍隊必須解散，另外日本所有的軍事武器，在當時也都必須納入 GHQ 管理。所以可以

  說，這個如今面對巨大新型怪獸的國家，完全沒有軍事力量可以與之抗衡……你不會看到《

  哥吉拉》裡的坦克與軍機攻擊哥吉拉，沒有軍隊、沒有武器、甚至沒有《正宗哥吉拉》裡的

  政府運籌帷幄，這是一場大怪獸對筋疲力盡人民的不公平戰爭……這是《哥吉拉-1.0》的第

  二層絕望。


  沒關係，我們還有主角……商業電影的主角都能以一擋千，飾演《哥吉拉-1.0》主角的神木

  隆之介，應該能赤手空拳地打飛哥吉拉吧？很可惜的是……神木飾演的角色，不是我們在好

  萊塢電影裡熟悉的動作電影主角。



  4.衰到爆的主角


  沒錯，神木飾演的角色敷島浩一是駕駛零式戰鬥機的軍人，看起來他應該會在電影裡駕駛軍

  機，最終擊敗摧殘日本的哥吉拉。在山崎最初的構想裡，主角有兩個設定：積極打倒哥吉拉

  的好戰軍人；以及只求明哲保身、被惡夢回憶纏繞的敗家犬角色。最終，山崎混合了這兩個

  角色形象，他讓敷島浩一先陷入了絕望深淵（這是本片的第三層絕望），他的同袍戰死、他

  做為神風敢死隊的任務失敗、他不敢面對哥吉拉……而大怪獸造成的惡夢，陪著他從戰場回

  到了日本本土，而且繼續剝奪他僅有的事物……


  敷島浩一應該是《哥吉拉》歷史裡最悲慘的主角……這都是山崎貴為了貫徹「絕望」所做的

  設定。



  5.極度求真的「日本戰後風景」


  有著最多十個車道的「晴海通」，是澀谷鬧區最重要的道路之一。這次的《哥吉拉-1.0》裡

  ，會出現哥吉拉踩著晴海通、大量民眾拔腿逃命的橋段。《哥吉拉-1.0》必須讓看到這個橋

  段的日本觀眾，一眼就能認出這是今日依舊車流繁忙的晴海通。因此特效小組盡可能地重建

  了晴海通上的店面、道路寬度、電線桿與路燈等等，甚至連行道樹都經過特別設計，將這些

  理應在多次空襲中已經燒毀的路樹，呈現戰後重新種植、尚未長大的模樣。


  這些透過電腦動畫設計的古早澀谷街頭風景，設計依據是來自當時的許多資料照片，甚至還

  包括了小津安二郎的經典電影。而且不只要畫出這些街景，在後製時還要計算哥吉拉的高度

  與行進速度，才能製作相對應街景橋段的哥吉拉影子、或是哥吉拉行走時揚起粉塵的數量等

  等。從《ALWAYS 幸福的三丁目》開始、長年與山崎貴導演合作的特效導演澀谷紀世子表示

  ，《哥吉拉-1.0》是她綜合數十年特效製作經驗的一款集大成之作。



  6.荒神哥吉拉


  荒神，是日本信仰中一種特別的神祇類型。荒神並不是單純實現人們願望的神明，反過來，

  荒神的性格狂暴、無理性、而且破壞力極大。人們對於被歸為荒神的神明，與其說是崇拜，

  不如說是懼怕。祭祀荒神並非為了實現願望，而是為了避免荒神帶來的災難。可以說，荒神

  是古時日本「神格化」無法解釋或影響巨大的災難的一種想像，所以代表病痛的「疫病神」

  是一種荒神、廚房的「火神」與「灶神」是一種荒神……而在山崎貴的想像裡，哥吉拉當然

  也是荒神。


  荒神是需要被尊敬的，甚至是要被封印的，這種對荒神的態度是來自祂對人世的殘酷影響，

  山崎貴這樣說：「對我來說，哥吉拉是神明與動物兩種形象融合在一起的象徵，牠有著人力

  不可比擬的能力。當然哥吉拉代表著恐怖，牠也同時帶來破壞，但是對人類而言，牠同時也

  是讓人類對其報以敬畏態度的荒神。」



  這是山崎貴想要在日本國產電影《哥吉拉-1.0》裡，與好萊塢版本或其他哥吉拉電影做出區

  隔的部份：對他而言，荒神無所謂善惡之分（這與七零年代被娛樂化、被塑造出正義形象的

  哥吉拉不同），荒神代表著勢不可擋的自然神奇力量，我們只能接受它、敬畏它……但我們

  同時也需要封印它，並且深刻地感受牠誕生的意義、並承受牠帶來的傷害並再一次重新站起

  來。這是在疫情期間開始撰寫《哥吉拉-1.0》劇本、並且喜愛初代《哥吉拉》的山崎貴，在

  思索戰爭與疫情意義後，為哥吉拉賦予的形象。



  《哥吉拉-1.0》在日本成為首週票房冠軍，它上映首日的當日票房（累計至下午三點），是

  《正宗哥吉拉》的265%；而上映三日票房成績也超過了十億日圓，同樣是《正宗哥吉拉》的

  122%。可以說，以這個趨勢，《哥吉拉-1.0》很可能會超越《正宗哥吉拉》的82億日圓成績

  ，甚至突破百億日圓票房。而目前《哥吉拉-1.0》也已經在美國進行首映，預計12/1在全美

  上映，試映的反應也非常好。相信台灣應該很快就能看到這部作品，希望全新的《哥吉拉-1

  .0》，不要讓台灣的哥吉拉粉絲們等太久。






  --'
