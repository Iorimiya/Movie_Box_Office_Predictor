url: https://www.ptt.cc/bbs/movie/M.1738167173.A.799.html
title: '[好雷] 哥吉拉-1.0 爽片也要說好故事'
content: '今天和家人一起去看screenX哥吉拉


  前幾次看好萊屋哥吉拉

  總覺得差了點意思

  這次我總算是找到原因了


  一般認為怪獸電影看的就是大場面 看特效

  這我絕對認同

  但好萊塢哥吉拉給我的感覺

  就是劇情真的太薄弱了


  哥吉拉-1.0雖然沒有太多高科技未來場景

  卻說了好好地說了一個完整的故事

  還是一個有點感人的戰後士兵自我救贖的故事



  至於screenX的視覺體驗

  我覺得一開始對他的期待有點錯誤

  本來我以為會是一個超寬螢幕

  像是電腦用曲面螢幕那樣被包覆起來


  但其實左右螢幕提供的資訊量很有限

  有點像拍照的景深模式左右比較模糊一點

  不是拿來讓你盯着看的

  而是讓你專注主營幕時更沉浸在場景裡


  比較特別是

  有些比較亮的場景

  三面投影幕都會打強光

  廳內的亮度就跟開燈沒兩樣

  一開始還適應了一下才習慣


  此外我覺得秀泰的ScreenX喇叭的表現好像有好一點

  沙發的舒適度也是沒話說

  還可以前後調整靠背

  看起來真的蠻讚的


  -----

  Sent from JPTT on my Samsung SM-F7210.


  --'
