url: https://www.ptt.cc/bbs/movie/M.1714732918.A.6D0.html
title: '[雷] 哥吉拉 -1.0 太好看啦～'
content: '肯

  定

  有

  雷


  防

  一

  下




  如題，趁著哥吉拉-1.0終於上串流總算能看到這部了


  我是本來就有訂閱amazon prime


  這次是再多花NordVPN一個月的訂閱用日本vpn在apple tv上看的


  (非業配，只是剛好爬文有看到有人說某鯊魚沒辦法vpn看日本prime所以才用nord）


  雖然家裡是75吋電視加家庭劇院組，但還是有點遺憾不能看IMAX版


  這片感覺超適合去看IMAX的啊～


  —


  跟庵野哥相較下這片應該算人類戲份跟哥吉拉戲份拿捏的恰到好處


  完全不會覺得人類的戲份很冗，只覺得神木小弟你也太衰了吧


  每次哥吉拉的出現都是滿滿的絕望感


  也確實有呈現出戰後已經百業待興，但剛有所起色又再一次被悲慘的現實打臉的感受


  在特效方面更是沒話說，不愧是能得奧斯卡的作品


  畫面很有魄力，也比較少以前那種看CG動畫是跟旁邊的景物明顯楨數不同的不協調感


  最後的對決要熱血有熱血要悲壯有悲壯


  想看的很推薦看，完全值得大吹特吹～


  最後來張哥佬帥一波～屌打某空虛的猩猩打架新帝國啊！




  —


  題外話，雖然有人說這部沒字幕聽不懂直接看也行


  不過還是覺得多少會對劇情理解造成影響(?


  所以我是載了字幕放iPad邊看電視邊看iPad的字幕克難的看XD


  過幾天再來看一下黑白版～


  --'
