url: https://www.ptt.cc/bbs/movie/M.1713359077.A.346.html
title: 'Re: [好雷]哥吉拉-1.0感想+劇情 '
content: '月初去日本看櫻花有順便去看哥吉拉-1.0

  真的太好看了QQ


  關於這個 震電



  造型非常奇特

  螺旋槳在後面

  乍看還以為是噴射機~


  然後查維基百科才知道

  震電沒有實際參戰過

  當年做出原型機 試飛成功後

  日本就宣布投降

  戰爭就結束了...


  震電戰後被拆解放在美國

  看維基百科 這次為了拍哥吉拉-1.0

  還特別做了個1:1複製品


  最後震電去撞哥吉拉那幕是完全無聲的

  就像灌籃高手最後一擊那段

  超有fu QQ


  話說看完後可以理解為什麼可以拿奧斯卡最佳視覺特效

  雖然哥吉拉大部分場景都是白天

  但因為整部電影畫面套上了厚厚的二戰懷舊濾鏡

  整部電影顏色都是那種舊舊的感覺

  所以反而哥吉拉毫無違和感

  大概就是類似畫濃妝的效果?!


  戰艦打哥吉拉那段真的好帥QQ


  --'
