url: https://www.ptt.cc/bbs/movie/M.1702008684.A.5F9.html
title: '[新聞] 再次感受牠的無敵宰制力：《哥吉拉-1.0》'
content: '新聞網址：


  再次感受牠的無敵宰制力：《哥吉拉-1.0》在爛番茄拿下近滿分的超高評價


  日本經典怪獸特攝系列《哥吉拉》（Godzilla）最新作《哥吉拉-1.0》（Godzilla

  Minus One）已於日前陸續在日本及美國上映，其他地區的觀眾則可先欣賞官方釋出的最

  終預告片，再次感受哥吉拉肆虐的無敵宰制力。


  本作背景為二戰後的日本，在經歷過戰爭的摧殘後，人民忍受著苦痛重新振作之時，哥吉

  拉的降臨和猶如破壞神般的姿態不僅讓許多人感到絕望，卻也激發眾人團結為了生存而戰

  。在這最終預告中，還能看到包括IGN、CBR、Variety、Slash Film、Dread Central、

  We Live Entertainment等知名娛樂媒體的影評摘要出現，而爛番茄評價也在近日公開完

  整評分。


  根據爛番茄釋出的結果，本作共拿下96%新鮮度與98%觀眾評比的超高評價，幾個特別值得

  留意的好評包括來自Time Out的Philip De Semlyen表示：「充滿真情且令人驚嘆，日本

  視覺特效大師導演山崎貴展現了數十年來最優秀的怪獸電影。」


  The Washington Post的Lucas Trevor則提到：「結局簡直宛如一場魔法，一場視覺饗宴

  ，從各方面來看都是一部有趣的史詩作品。」The Hollywood Reporter的Frank Scheck認

  為：「這可能是唯一一部會讓你看完後受到大量情緒淹沒的《哥吉拉》電影。」


  可惜的是，《哥吉拉-1.0 Godzilla Minus One》在港台地區暫時未有上映消息，不過隨

  著日美票房持續增加，相信很快會有更多海外上映的喜訊傳來，有興趣的讀者不妨持續關

  注。


  - - -


  突然好懷念以前那個哥老還能飛踢的時期



  --

  好像也沒錯，假面騎士我也喜歡那個時期的 XD'
