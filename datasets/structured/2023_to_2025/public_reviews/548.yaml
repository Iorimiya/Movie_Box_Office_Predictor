url: https://www.ptt.cc/bbs/movie/M.1717295919.A.C2E.html
title: 'Re: [請益] 哥吉拉-1.0（有雷）'
content: '沒有一直啦

  1984哥吉拉 才開始比較明顯的反美aka表達日本人對政治現況的不滿

  1954第一部哥吉拉哪有反美

  當時連美日安保都還沒有XDDDD


  1.日本人與其說反美不如說背負二戰戰敗原罪

  到現在都還不能當正常國家

  這從日本到處都是美軍基地這件事就看得出來了

  有興趣可以去google橫田空域

  你會恍然知道原來東京上空有一塊領空不是屬於日本的

  是屬於美國的XD

  所有民航機都要繞道不能經過這片上空

  因為那邊是美軍基地


  台灣人很難想像這種事

  台北上空難道會有部分領空不屬於台灣嗎???

  但日本就是這樣XD



  2.日本因為到處是美軍基地

  所以說穿了到處是美國領土

  平常沒差 特殊時候就知道了

  對啦 疫情啦XD

  日本疫情期間鎖國 觀光客進不去

  防疫規定一堆

  但對不起喔 這些規定

  全部不適用美軍基地XD

  對啊美軍要飛到他們基地

  哪需要管你隔離規定

  所以疫情期間 美軍基地傳出的群聚確診是非常多的

  沖繩在疫情期間是確診比例最高的地區

  毫無疑問跟當地美軍有關



  3.然後說穿了這一切就是因為

  日本是二戰戰敗國

  所以憲法被修到非常不正常

  怎麼會有一個正常國家憲法放棄軍隊啦XD

  想也知道不正常啊

  所以日本比同樣是戰敗國的德國還慘

  因為日本到現在還是不正常國家



  4.這種身為不正常國家的不滿

  處處被美國控制的不滿

  第一次在哥吉拉電影出現是1984那部

  當時總理很難過的要接受美俄想要在東京用核武解決哥吉拉

  日本人毫無辦法拒絕


  後來1989碧奧蘭蒂到2004最終戰役

  這中間反美情緒很少了 幾乎沒有

  但是後來正宗哥吉拉又出現了這種反美情緒

  而且幾乎是不演了


  像是美軍準備大範圍轟炸東京

  被罵比哥吉拉還亂來XD


  (港版藍光 翻譯是哥斯拉)


  或是準備使用核武

  日本內閣成員大罵逼人太甚



  這基本上完全顯現庵野秀明的政治立場和想法

  毫不掩飾



  5.話說因為日本憲法規定不能擁有軍隊

  開火權力也受限

  所以過去哥吉拉電影為了解套

  就是在電影中成立一個 G對策總部

  不屬於軍隊 專門對付哥吉拉的機構

  來為憲法解套


  但正宗哥吉拉裡面

  因為哥吉拉是第一次出現

  沒有這種對策總部啊

  所以片中有一段竹野內豐在跟其他內閣討論

  到底該用憲法哪一條來合理化對哥吉拉開火

  看看其實導演也很用心啦

  日本憲法就是不正常到連對哥吉拉開火可不可以都不知道

  像庵野秀明這種不滿的人很多啦


  --

  日本人反戰才是最不用矛盾的

  像宮崎駿這種完全反對戰爭的反戰左膠很多

  我本來不懂後來讀了一些日本史恍然大悟

  簡單說就是

  日本歷史上經歷過的戰爭 絕大部分是毫無意義的

  因為日本的戰爭說穿了只有兩種 內戰 侵略別人 就這樣

  日本唯一一次抵禦外國侵略事元朝打日本 就這麼一次 兩場戰役

  日本不像中國俄羅斯印度波斯

  這些古文明國家不只一天到晚被外族侵略

  甚至被滅國過 被外族統治過

  日本從來沒有

  日本從來沒有被外族統治過

  所以日本的反戰說穿了是因為 過太爽XD

  根本沒有人要打日本啊 為什麼要戰爭?

  其他國家不是 一天到晚有被侵略焦慮

  俄羅斯從東邊被蒙古侵略

  從西邊被德國侵略

  中國更是一天到晚被北方民族侵略 滅國兩次

  日本人根本沒有經歷過這些

  所以日本的反戰是完全反對軍隊反對戰爭

  因為日本經歷的戰爭都是內戰或侵略別人

  內戰當然毫無意義 自己人打自己人有什麼意義?

  日俄戰爭 日中戰爭都是侵略別人

  沒事去別人國土打仗幹嘛???


  所以日本人在談反戰

  其實跟大部分其他國家是不一樣的

  說穿了是日本人過太爽

  從來沒有滅國過'
