url: https://www.ptt.cc/bbs/movie/M.1708768772.A.9A7.html
title: '[好微雷] 哥吉拉-1.0'
content: '最近幾天去了趟日本 最重要的行程之一就是為了看這部目前在台灣無緣看到的大作

  雖然沒明說亞洲區為何那麼多國家還沒上映 不過綜合很多也不知道是否正確的小道消息 我想主要原因大概是有行銷上的考量才會那麼做（特別是在日本國內還刻意上映了英文字幕版這點）


  我也搞不太懂這操作 但就結果來看這片在全世界都算是名利雙收了


  回歸正題 畢竟在日本公開至今也四個月了 原本我這日文苦手也希望首刷能看英字版來大致理解劇情 無奈這個時間點已經沒了 剛到日本時又接近深夜  因此在日本這有限幾天內我首刷的特殊版本很神奇的成為了黑白版


  Minus color的版本是有他的缺點 像是某個關於哥吉拉生態的部分初次看到時完全不知道那是什麼（我還以為是牙齒在飄）後來再出現比較明顯時才看懂


  不過整體而言比其後來再看的一般版 確實能比較感受到劇情中的肅殺和悲慘氛圍 尤其是第一二幕的重頭戲 戰爭後被摧殘後的家鄉和哥吉拉襲擊銀座  甚至因為這樣會覺得更有1954的感覺


  目前比起比較近期的《正宗哥吉拉》我還是比較喜歡後者

  不過這個原因是還沒考慮到我看不懂對話這點 所以人類戲沒辦法全面的感受情緒堆疊

  尤其是災害對策成立後的大量文戲

  即便這片的劇情簡單到憑畫面就能理解個六七成 結局某幕還是能看到眼光泛淚的


  而我覺得仍然比較喜歡2016的一點是這次的主線是在處理男主角在二戰後的PTSD 可以明顯感受到哥吉拉比較像個推動這個傷痛處理過程的道具而非主角

  然後飾演敷島的神木隆之介演技又感覺撐不太起這個角色（但鏡頭又瘋狂take他的表情） 因此有時候覺得很出戲

  其他演員表現倒是都不錯 尤其我很喜歡野田博士和澄子姐 前者完全是本片亮點  水雷處理組的配角三人都很有趣



  這部和2016差別最大的部分確實在於視角的不同 2016在政府應對哥吉拉的決策回很清楚的講出前因後果 但在這部以人民視角看出去的時候 政府的決定不過是主角群隨口一提的台詞
  不過正因如此在哥吉拉攻擊的時候 更能感受的 政府一個小小的決定會對民生造成多大的衝擊



  至於哥吉拉 我認為某種程度上比正宗哥噁心(褒意） 體型回歸50公尺級反而有牠獨特的恐怖 每次一登場的那壓迫感真的是會直線上升的那種 射線和身體的關係設定也很有趣
  似乎很巧妙了隱喻了戰爭傷害這點 吼聲也很有巧思 不是把過去哥吉拉的叫聲直接挪用 做了相當適當的揉合 加上戲院音效加成那聽起來真的很爽

  而配樂的部分跟2016一樣有幫哥吉拉和人類方作做新的主題配樂  也有挪用舊作 尤其值得讚賞的一點是他們有把進行曲在初代其實是自衛隊的主題配樂這點做了適當的安排
  這部在音效這點真的做得十分出色  第三幕真的燃到爆炸


  還有即便這片沒看過任何哥吉拉相關作也能上 建議可以看過1954和2001這兩部 片中對這兩片有許多致敬


  二刷到了新宿東寶看了MX4D 順便去8樓朝聖一下哥吉拉景觀區 不過可惜因為跳樓事件不開放戶外區 倒是2003對戰組讓我拍了個爽



  看完後覺得這廳的音效沒日比谷好 搖晃倒是有值 二次觀賞除了有些畫面變得清晰以外最令人印象深刻的是銀座襲擊那段 比起第一刷感受了更多衝擊 再來首刷當晚後也找了完整劇透補了一下對話  所以這次看理清了很多劇情



  三刷是在109 cinema 看ScreenX  這家電影院比東寶明顯高級很多 椅背可以調到半躺 音效還特別說明是坂本龍一調校過的 票價也驚人的貴（台幣1000上下）
  不過實際觀看後覺得還是首刷的音效比較懾人  倒是觀看過程一直去注意兩側延展螢幕是怎麼去做到的


  四刷是在西武園www看的是負一哥的前身 跟隔壁棚力霸王比正片比較精彩 但前置的解說是力霸王更棒 粉絲會很開心


  然後官方的AR很出色 設施玩完後我在出口玩了很久



  目前我是對-1.0在台灣上映的可能性還是樂觀的 畢竟醞釀這麼久的商業強作 搞到後來在亞洲只能上串流未免也太浪費  不過以台灣來說3月還有個GXK得避嫌一下  所以還是只能等


  ——

