url: https://www.ptt.cc/bbs/movie/M.1702139545.A.3D6.html
title: '[神雷] 哥吉拉1.0'
content: '在日本品川觀看IMAX版本



  這間電影院一天只有一場IMAX的哥吉拉-1.0


  早上9點大約坐了6成左右吧，年齡層大約在30~60


  也有少許年輕女生來看。散場時看了一下全是日本人


  也沒有聽到有外國人的對話，應該是沒啥外國人來看



  簡單總結以下幾點


  ・沒看過哥吉拉也能理解整部電影


  我只看過酷斯拉、傳奇的幾部哥吉拉


  劇情沒有任何連結基本上觀看門檻是0


  不用看以前的影視作品也不用看又臭又長的影集之類的事先預習



  ・幾乎沒有日式說教以及尷尬熱血場面


  神木崩潰的場面倒是不少XD 整體演技也沒有任何問題


  也沒有一直開會



  ・哥吉拉嘴砲畫面非常爽


  不愧是破壞神整個帶來壓倒性的絕望感


  熱線射下去之後的暴風、蕈狀雲以及衝擊波都非常震撼


  完全就是核彈啊 並且該射就會射不會吊人胃口或者是愛打不打的 爽




  ・人類戲份與哥吉拉戲份都恰到好處


  剛開場沒多久馬上給你看哥，導演知道大家想看什麼


  水上戰陸地戰都有 爽



  ・使用經典配樂


  我沒看過多少哥吉拉電影都知道經典配樂


  如果是老粉應該會感動到爆哭(實際上影廳內不少人看到哭)



  ・美波很正


  很正



  本作的品質絕對有資格作為哥吉拉七十周年的紀念作品


  最純粹的娛樂電影。沒有政治正確沒有硬插的黑人角色沒有女權沒有作自己


  非常好看


  --'
