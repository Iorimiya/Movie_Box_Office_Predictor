url: https://www.ptt.cc/bbs/movie/M.1704269196.A.E18.html
title: '[好無雷]e哥吉拉-1.0美國觀影感想'
content: '前陣子懶惰病發作，在美國12/1上晚，一直拖到今天才去觀賞。


  我猜學校還在放假，加上我去的電影院，星期二票價一律五美金，滿多青少年來觀賞的。


  儘管配音還是原汁原味的日文，美國人也得乖乖學著看字幕。


  剛去爬了前面別的鄉民的文，和google，只花一千五百萬美金，這片真的是太難能可

  貴了。


  我也很久沒看過日本真人電影，印像還停留在進擊的巨人電影版，那種假到不行的CGI;

  這片真有顛覆我對日本電影的印像。


  氣氛渲染，哥吉拉的氣迫，和幾個以往只有好萊塢較會強調，人類的視角，都非常

  到味; 以往我看的，大多是較遠的視角，看兩個大怪獸互K，雖然爽度很夠，但劇裡

  人類的恐懼，觀眾就較難感同身。


  走出戲院，還聽到旁邊一個十幾歲的弟弟，還說這是2024最好看的電影，我差點要吐嘈他

  這片去年就上映了。


  --'
