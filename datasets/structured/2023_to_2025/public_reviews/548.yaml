url: https://www.ptt.cc/bbs/movie/M.1717259920.A.B79.html
title: '[好雷] 哥吉拉-1.0 普作變佳作的關鍵'
content: '內閣總辭防雷線










  #@%$^&*$^#@&*@$&*_(*(^%*$#@%$@%^&*(









  主角對於同袍與逃戰的愧疚之心

  以及對哥吉拉夢靨般的陰影，

  老實說對於生活在時間軸80年後的我來說，

  難以感同身受、跟著主角的情緒起伏。


  但是仔細想想，


  正宗哥吉拉中的居民們，

  面對著猶如颱風、海嘯般的天然災害生物，

  真麻煩，反正先躲遠一點划手機，

  交給政府傷腦筋就好了，

  政府還真的把這生活上的不便排除了。


  而活在-1哥吉拉中的人們，

  在戰敗後五子都歸零了，

  即使莫名的巨大生物出現，

  政府也因為戰敗後的國力與國際情勢，

  基本上是直接將人民放生了。


  所以整齣戲不斷地在醞釀絕望與希望，

  來到了最後的場面，

  遍體麟傷的哥吉拉準備朝向船艦發射射線，

  20秒異常寧靜，

  船上這些從二戰中倖存、想為後代爭取一絲希望的官兵們，

  有些人歇斯底里般的恐慌，

  但更多人是放下手邊的工作，慢慢望向哥吉拉，

  心涼了的這幾幕，

  終於讓我終於體會到何謂Minus One。


  看到這裡，也讓我對-1的評價由普作提升為佳作。

  如果把主角當配角看，更能感受這齣戲想營造的氛圍。


  另外，

  女主角在火車上"這就是...哥吉拉?"這一幕好漂亮。

  很喜歡掃雷艇船長這角色。

  主角與哥吉拉二次相遇讓我想起了平成哥吉拉vs王者基多拉。


  --'
