url: https://www.ptt.cc/bbs/movie/M.1717422330.A.15C.html
title: '[新聞] 《哥吉拉-1.0》登港台Netflix榜首 《異星'
content: '《哥吉拉-1.0》登港台Netflix榜首 《異星戰境》讓位




  （大紀元記者葉子杰編譯報導）1日，《哥吉拉-1.0》（Godzilla Minus One）於全球

  無預警上架Netflix後，翌日立即擠下《異星戰境》（Atlas）登上台灣及香港熱門電影

  榜首，並在美國排名第四。


  週六，東寶（Toho International）突然宣布自1日起，除了日本和法國，《哥吉拉-1.0

  》正式在全球Netflix上播放。此外，該片已在數位平台上線包括Apple TV、Amazon和

  Google Play。由於該電影未曾在港台電影院上映，片商發布訊息一天後，《哥吉拉-1.0

  》立即成為香港及台灣Netflix收視率最高的電影。





  此前，據《Torrent Freak》報導，《哥吉拉-1.0》早在5月6日已位居網路盜版排行榜榜

  首，領先《沙丘：第二部》（Dune: Part Two）。外媒指出此事件發生在5月1日日本發行

  《哥吉拉-1.0》實體光碟之後，雖然5月3日已登陸亞馬遜Prime影音販售，但在大多數國

  家與地區都限制觀看，導致絕望的粉絲非法下載。


  日本怪獸電影《哥吉拉-1.0》由山崎貴執導、編劇並負責視覺特效，電影追溯了大怪獸哥

  吉拉的起源。故事背景設定在第二次世界大戰剛結束時，美國對廣島和長崎進行了原子彈

  轟炸。


  本片講述了一位神風特攻隊飛官「敷島浩一」的故事，描述日本戰後，巨大核能怪獸從海

  岸線侵門踏戶，歷經傷痛的前戰鬥機飛官與一群平民聯手抵禦。該片去年12月在北美上映

  後廣受好評，在影評網「爛番茄」獲得評論家98%的支持率，觀眾評分高達98%，「影院評

  分」（CinemaScore）網站獲得觀眾「A」級高評價。


  爛番茄評論員總評語表示，《哥吉拉-1.0》以動人的人物故事作為影片的主線，是一部在

  大規模毀滅的場面之間依然引人入勝的怪獸電影。爛番茄觀眾總評語表示，作為《哥吉拉

  》系列的經典之作，《哥吉拉-1.0》不僅特效出眾，故事也真的非常有趣。


  據Box Office Mojo統計，《哥吉拉-1.0》製作預算為1,500萬美元，全球票房收入超過

  1.15億美元。該片獲得了多項獎項，包括榮獲第96屆奧斯卡金像獎最佳視覺效果，成為了

  第一部獲得奧斯卡獎的哥吉拉電影，也是首部獲得奧斯卡最佳視覺效果獎項的日本電影。


  --'
