url: https://www.ptt.cc/bbs/movie/M.1699484561.A.18A.html
title: '[新聞] 《哥吉拉-1.0》首映3天日本票房破10億'
content: '《哥吉拉-1.0》首映3天日本票房破10億日圓，人氣超越《正宗哥吉拉》



  日本東寶紀念三大怪獸之王「哥吉拉」（ゴジラ，Godzilla）70 周年，全新真人電影《哥

  吉拉-1.0》（GODZILLA MINUS ONE）11 月 3 日日本院線首映，三天內吸引逾?64 萬觀眾、

  票房突破 10.41 億日圓，超越庵野秀明執導的《新哥吉拉》紀錄。


  哥吉拉是從輻射海域復活的巨大怪獸，被視為日本對核能的矛盾情感，而《哥吉拉-1.0》回

  歸初衷，講述戰後一片焦土的日本，哥吉拉突然從海上襲來，面對雪上加霜「最絕望的慘況

  」，日本政府是否能撐下去？



  《哥吉拉-1.0》卡司陣容相當豪華，由《永遠的三丁目的夕陽》《STAND BY ME 哆啦A夢》

  山崎貴執導、編劇並負責視覺特效，東寶工作室和 ROBOT 製作，神木隆之介與濱邊美波主

  演，其他演員包括山田裕貴、青木崇高、吉岡秀隆、安藤櫻、佐佐木藏之介等等。


  《哥吉拉-1.0》不只是東寶哥吉拉系列的第 30 部電影，更是真人電影前作《新哥吉拉》首

  映 7 年來的最新作。



  2016 年《新哥吉拉》由名導庵野秀明擔任總導演兼編劇、樋口真嗣為導演與特效導演，《

  哥吉拉-1.0》首日票房較《新哥吉拉》上漲 265％意義非凡，目前為止算是日本有史以來

  賣最好的怪獸電影。


  本作預計 12 月 1 日登上北美地區大銀幕，日本首映時推出北美預告影片，三天觀看超過

  332 萬次，目前台灣尚未有任何代理消息。







  --'
