url: https://www.ptt.cc/bbs/movie/M.1705222254.A.C21.html
title: '[好雷] 哥吉拉 -1.0 '
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n我首次在看怪獸電影時哭了....\n\
  \n\n差點在那霸機場迷路\n\n\n\n 先來無雷心得\n\n 這次文戲\n 比起上次2016開會。這次更讓人動容 更能入戲\n\n不過前期篇無聊應該會有人想睡\n\
  \n\n 因為是戰後日本。所以一直在提戰爭和生活\n\n 片中還有批版戰爭還有日本政府的話。我能理解東寶不敢賣亞洲地區的理由\n\n 但是 台灣這真的不在乎這些。拜託在台灣上映吧\n\
  \n 武戲方面\n\n 哥吉拉出場不算短 而且都是洽到好處的出場\n\n 而且真的是天災 出場就是來宣告 我是來毀滅生物的\n\n 主角也是苦命鬼。哥吉拉出現他都看著人死亡\n\
  \n（1945~1947年日本。1946是美國核爆試驗）\n\n電影的日本真的是滿目瘡痍\n 這次是以海戰為主\n\n 不得不說。導演和編劇用二戰的戰艦就能演出這麼棒的演出\n\
  \n 真的很佩服\n\n 有玩過艦隊收藏 碧藍的應該都很有感觸\n\n pv中 對哥吉拉砲擊的。是重巡“高雄”\n\n 最後大戰對哥吉拉的 則是4艘沒武裝的驅逐\n\
  \n \n\n 由上到下是\n\n 側身印有 YUKIKAZE的 奇跡艦 雪風 (後為台灣的丹陽)\n\n印有  HIBIKI的 不死鳥 饗 (後引渡蘇聯)\n\
  \ 印有  YUKAZE的 夕風\n  還有驅逐艦 襷\n\n 海戰真的值得一看再看\n 人心更為貼近現代。各大心得都有提到文戲\n 就不再提了。我只講講哥吉拉以及文戲感想\n\
  \n\n ============以下有雷=============\n\n因為是戰爭及戰後日本\n\n所以明明都說 幹麻要聽日本去犧牲生命\n\n但是 一但看到摯愛\
  \ 朋友死了 旁邊的人還活著 就開始怪罪別人\n\n但是為了生活。卻又不得不攜手合作\n\n片中因為大量提到美蘇緊張關係\n\n還有批判當時日本政府。掌控訊息\n\
  \n草管人命。戰爭時補給跟不上 戰車裝甲薄弱\n飛機沒彈射裝置 還叫人去送死\n\n所以片中充滿各種說教。但我覺得說得好\n\n畢竟這是戰爭結束後 而且是對哥吉拉\n\
  \n不精神喊話。真的無法讓人行動\n\n各種“這不是送死 要活下去 要讓某人幸福”\n\n\n\n\n哥吉拉。一開始也只是大戶島上一隻殘暴的恐龍\n\n一開始沒多久就登場了。看到這我還以為在看侏羅紀公園\n\
  \n哥吉拉也只有瞭望台的高度 約3公尺高\n\n\n\n之後1946年核爆直接讓他突變\n\n所到之處有大量死魚。還會追殺各種船隻\n\n第二次登場就讓主角的掃雷船和高雄對上\n\
  \n直接展現了強力的再生力還有射線爆船\n\n\n\n再來就是pv的橫掃銀座\n\n說實話 我看到這次哥吉拉真的在“追著人類踩踩”\n\n會主動破壞建築物 還有射掉國際議事堂前的坦克\
  \ 不知道為何 心裡很爽\n\n\n\n日本因為美蘇冷戰不行動。只能由前雪風艦長領導\n民間自立對抗哥吉拉\n\n在相模川弄沉哥吉拉。如果海壓無法弄死哥吉拉\n\
  \n那就再讓他急速上浮\n\n無敵的生物就讓大自然送死他。或是讓他自爆\n\n蠻合理卻又不可能的作戰\n\n 而一些老人因為有家庭 不願在犧牲\n\n只剩年輕一輩的在奮戰。互相鼓勵不要死\n\
  \n\n這邊周圍的都在哭(其實整場不到20人)\n\n我自認我的哭點還蠻高的\n\n\n震電引導哥吉拉到海上\n\n\n夕風和襷 作為誘導 用繩子架著操動舵 讓哥引發射線\n\
  \n之後由響和雪風 出擊\n\n\n\n\n\n真的讓我掉淚的。是在作戰失敗時  意想不到的救援\n\n\n\n\n\n\n最後真的絕望時。主角最後不敢去做的神風特攻救援\n\
  \n說真的。哥吉拉上路。還有最後作戰。大家奮不顧身配上哥吉拉行進曲\n\n才是真的讓我哭的地方\n\n這感覺就像海賊王 大家在打海軍島絕望時。黃金梅莉號救援那樣\n\
  \n\n 最後在電影院坐完 聽完熟悉的行進曲 還有這次的新曲\n\n大家哭著眼淚離場。感覺真好\n\n\n好想多刷。但是台灣沒上。沒辦法\n\n\n----\n\
  Sent from BePTT on my Vivo V2041\n\n\n--\n\n\n\n\n\n--"
