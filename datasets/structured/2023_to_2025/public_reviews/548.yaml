title: '[好雷] 哥吉拉-1.0 近期很棒的哥吉拉'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






















  前幾天剛看了哥吉拉-1.0，我很喜歡這一次日本拍的哥吉拉。


  這次的哥吉拉是背景是二戰，所以朋友都很好奇，這到底要怎麼打贏。


  特效：


  這次的特效我覺得最逼真的就是哥吉拉在追著主角除雷船跑的那一幕，你真的會覺得


  有一隻怪獸在後面追著你，不知道這邊是用皮套加上特效，還是純特效。


  相信如果在大螢幕看應該會更棒 嗚嗚嗚


  並且這次的放射熱線肯定是最震撼的，上一次是從尾部慢慢發光，這次尾部棘會慢慢打開


  並且那個聲音超震撼。


  以及哥吉拉最後想放射線把全部人殺死時那個運鏡也是相當有張力。(而且挺多橋段都是在


  海上所以可能經費比較省?不需要這麼多光追運算


  劇情：


  我對這次的劇情編排挺滿意的，本身有認識ptsd的病人


  他們很明顯的會讓你覺得他困在過去，然後只要稍微類似的情境，就會反應非常劇烈


  大家都覺得男主演得不好很出戲，這點我也這麼認為


  不過日本的劇本和好來屋的劇本不同的地方是，好來屋通常在處裡這類的情境時


  通常會選擇暗喻的方式，比如手抖視線模糊，但日本的劇本完全不用暗喻明喻，直接跟你


  說，這樣的操作其實很容易推開觀眾，造成帶入感下降無法同理男主。所以版上有人


  不喜歡覺得演很差也是很正常。


  回到劇情的主軸，我覺得這次男主其實是有成長的，他從一個不知為何而死，轉變成知道


  為何而活，一個不知道為什麼要自殺的神風特攻隊飛行員，變成知道要為了所愛而戰。


  但要怎麼讓一個有ptsd的男主為愛而戰，編劇這邊安排是讓女主為他犧牲。有人不喜


  歡這個橋段，我自己也說不上喜歡。儘管後面女主其實活下來，不過脖子有輻射中毒的


  痕跡也挺讓人惋惜，也許是編劇想要致敬當時廣島長崎倖存下來但最後死於輻射病的人


  而這次收掉哥吉拉，自己覺得算是合理，因為科技力的不足，所以博士想到


  將哥吉拉快速下沉在快速上升，企圖讓哥吉拉被水壓壓死。


  在劇情演出上不像是被水壓壓死的，比較像是誤打誤撞打敗哥吉拉的，因為當哥吉拉被拖


  到海底前當時正在充能準備施放熱能射線，結果被斷法，射線在體內引爆，對哥吉拉造成


  第一次傷害，而當哥吉拉浮上來氣到想放第二次射線時，又剛好被男主自殺式攻擊，


  又再一次斷法，射線再一次在體內引爆。所以哥吉拉算是輸給自己?


  明明不要開大，只要普攻就可以贏的東西


  很像是玩Dota第一次不小心送頭，氣到要打回來結果又送頭 XD


  不過這版的哥吉拉好像本來就脾氣不好?



  ---------------------------------我是分隔線--------------------


  比較:



  1. 哥吉拉 2014


  哥吉拉整部片藏頭露尾的，人類戲分算是相當合理，但就是不夠爽


  2. 哥吉拉怪獸之王


  基多拉超帥超棒，人類無意義的戲分超多造成割裂嚴重......鏡頭一直切，一下子怪獸


  一下子人類，再一下怪獸，再一下子人類


  3. 哥吉拉大戰金剛


  人類的戲分雖然沒有割裂，但變成麥卡貝那套挺智障，不過打戲挺不錯的很有張力


  4.哥吉拉 新帝國


  這部我沒有看哥吉拉跟金剛在預告一起跑步是怎樣......超級英雄出任務嗎?



  5.正宗哥吉拉


  如果這邊有正宗的支持者，看到下面的文章應該會不開心


  相較正宗哥吉拉，整體而言比較喜歡這次的哥吉拉-1.0


  沒有要引戰，對於正宗哥吉拉有種恨鐵不成鋼的感覺


  正宗哥吉拉總辭光線前 >> 哥吉拉-1.0


  哥吉拉總辭光線後 <<<< 哥吉拉-1.0


  對我來說正宗哥吉拉在總辭光線前是非常棒的，後面就....


  正宗哥吉拉這部自己至少看了三次，電影看一次，Netflix看一次，跟家人又看一次


  正宗哥吉拉整部片在內閣總辭光線前，我自己覺得95分，節奏快速


  又有創意，看到日本人遇到新威脅不得已瘋狂開會想找到解決辦法相當有趣


  可是當內閣總辭光線之後的橋段文戲變得很令人煩躁，尤其是你石原聰美


  身為美國國務院特使，時不時講晶晶體讓人覺得傲慢，演技也很浮誇




  尤其是這個橋段我以為是看昭和時代的人，而不是一個美國籍日本人


  此時整個政治戲變得很兒戲，男主的性格又是個扁平的理想派，後段文戲感覺不像是


  在處理美國與日本關係，比較像是在水時間你越喜歡前面的文戲，就越討厭後面的


  還有拿牧教授構造組成分析表玩摺紙遊戲找答案......你好歹拿個電腦把二維的圖紙


  轉成三維結構......


  哥吉拉的決戰不知道是經費不足還怎麼樣，整個變得很假，那個列車炸彈.....


  還有灌哥吉拉冷卻液，超級出戲。觀看體驗就像當年EVA，打一打突然開始全員拍手.....


  要是給庵野秀明有好來屋的經費......



  結論： 希望能夠在電影院上看到哥吉拉-1.0   哭慘















  --'
