title: '[雷] 哥吉拉-1.0 '
content: '《哥吉拉-1.0》


  不愧是最佳視覺效果。


  斷垣殘壁、廢鐵破瓦、


  載具上的歲月痕跡、木頭新屋的嶄新亮麗、


  破壞中產生的粉塵、煙雲、黑雨，


  每個細節都很有真實感。



  黑夜中哥吉拉的猙獰感，


  讓人相信他們跟侏羅紀公園劇組一樣，


  有養真的哥吉拉。



  男主角的個性很不討喜，


  但刻畫不單薄，意外地能接受。


  看完後反而覺得，正是要這樣子的人，


  才能襯托出世界觀。


  --'
