url: https://www.ptt.cc/bbs/movie/M.1705051134.A.213.html
title: '[好雷] 哥吉拉-1.0 二刷'
content: '大家好

  第一次在電影版發文


  本人的日文為N87,有錯部份有請見諒


  邊搭車邊打字,照片跟心得都很隨意

  以下有雷~~







  1/11 在銀座買完東西後到日比谷TOHO看IMAX

  從銀座中心走過去約15-20分吧

  很新的影廳





  IMAX影廳外牆上是歷年哥老的海報




  對哥吉拉系列沒有很熟

  只看過預告片

  在完全沒被雷到的情況,抱著輕鬆的心情去看

  結果差點被嚇爛





  開頭太平洋小島哥吉拉第一次登場時

  被超乎想象的魄力嚇到

  讓人懷疑 蛤這是恐怖片嗎?的程度




  感覺不太適合帶太小的小孩看

  可能因為我坐後排,耳朵敏感又是IMAX的關係

  哥吉拉叫一次我就被嚇到一回



  最後結局有被感動到流幾滴眼淚







  1/12

  新宿TOHO看MX4D

  怕看黑白映像版在文戲會睡著

  選了一般版




  工作人員在進入影廳前會給塑膠袋

  讓你把食物裝好以免灑出來





  特典




  不是很推薦MX4D

  首先旁邊的人動一下椅子就會跟著搖



  再來噴氣聲非常吵

  在一些維修機械像修飛機的畫面

  明明是文戲卻又大聲嘶地噴氣及散發出奇怪的味道


  可能是想像觀眾體驗機油味吧

  但真正的機油味還比較好聞......







  結局


  除了哥吉拉會再生外

  典子吐便當時還以為是快樂結局


  沒想最後她的脖子竟然出現黑色的紋路

  我還以為眼花所以才二刷確認






  現在慶祝戰勝哥吉拉的人們

  接著要面對被污染的土地、

  近距離接觸過核子吐息的人的副作用



  原來從一開始到最後 絕望感一直沒有消失











  講一下小缺點


  哥老的眼睛好假

  路人配角演的太用力有點出戲


  作戰計畫爛到很想笑,而且果然行不通哈哈哈







  最後希望台灣有天能上

