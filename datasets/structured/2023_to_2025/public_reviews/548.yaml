url: https://www.ptt.cc/bbs/movie/M.1715103509.A.626.html
title: '[普雷] 哥吉拉-1.0 大家都不跑的嗎??'
content: '評價很高


  看完覺得有點吹


  但還算OK 至少人類的戲份不會像美版


  每次都覺得多餘


  而是融入劇情裡面


  雖然演技 環境 會多少讓人有點出戲


  瑕不掩瑜 主軸還是有抓住


  哥吉拉帶來的災難感 無力感 表露無遺


  可惜劇情太好猜 所以稍微普通


  真哥吉拉 給我的感覺是


  我們夠強 只要正常運作 科技是能克服災難


  而 -1.0 是即使只有一點機會 也要抓住






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  二戰末期神風特攻隊逃兵


  在小島遇到哥吉拉


  沒有勇氣開槍害死不少同袍


  這哥吉拉出來的很震撼阿


  很像jump screen


  直接照亮他


  下一秒就開始大肆破壞


  很像侏儸紀世界二的暴龍


  但人家暴龍出場有鋪陳 情境拉滿


