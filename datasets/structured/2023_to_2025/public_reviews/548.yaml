url: https://www.ptt.cc/bbs/movie/M.1717400900.A.2F0.html
title: '[新聞] 《哥吉拉-1.0》全球票房已近40億　創系'
content: '《哥吉拉-1.0》全球票房已近40億　創系列電影70年來最高紀錄



  【施養正／綜合報導】《哥吉拉-1.0》由日本影星神木隆之介、濱邊美波等人領銜主演，全

  球票房突破1.15億美元（約37億新台幣），不僅是「哥吉拉系列」70年最佳紀錄，更獲得首

  座奧斯卡金像獎肯定，截至5月6日為止，單單日本地區觀影人次已突破500萬，票房超過75

  億日圓（約16億新台幣），目前仍在上映中，票房成績可望繼續突破。


  《哥吉拉》是日本東寶電影公司自1954年推出的系列電影，敘述一隻透過核輻射獲得能量的

  怪獸「哥吉拉」，影射人類發展科技武器之餘，可能導致被反噬的後果，至今作品歷經70年

  ，共38部電影，包括33部東寶製作，外加5部美國製作，已被金氏世界紀錄認證為「持續時

  間最長的電影系列」。


  2023年11月《哥吉拉-1.0》率先在日本登上大銀幕，上映前3天票房即突破10億日圓（約2.1

  億新台幣），截至5月6日為止，日本地區觀影人次已突破500萬，票房超過75億日圓（約16

  億新台幣），目前仍有部分戲院持續上映中。


  而北美地區統計至今年2月為止票房為5600萬美元（約18億新台幣），已是日本電影在北美

  上映的歷史票房新高，並超越南韓電影《寄生上流》成為北美歷史票房第三高的非英語電影

  。2024年更獲美國奧斯卡金像獎「最佳視覺特效」殊榮，持續開創系列新猷。


  不過除了日本之外，《哥吉拉-1.0》並未在亞洲其他地區上映，直到近日才突襲上架串流平

  台Netflix，並火速攻上排行榜冠軍，台灣觀眾目前也可上線觀影。






  --'
