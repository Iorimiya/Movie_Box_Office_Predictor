title: '[新聞] 負一哥來啦！《哥吉拉-1.0》5月Prime Vi'
content: '負一哥來啦！《哥吉拉-1.0》5月Prime Video上架日確定


  出現啦！Amazon 旗下 Prime Video 今（16）日宣布《哥吉拉-1.0》（Godzilla Minus One

  , ゴジラ-1.0）即將於 5 月 3 日獨佔登上 Prime Video 平台。


  目前消息暫時由日本官方 X（前 Twitter 公開），為了同時慶祝這部紀念《哥吉拉》系列

  70 紀念的作品，包括《正宗哥吉拉》、《正宗哥吉拉：ORTHO》等 30 部作品，讓大家一次

  看到飽。


  《哥吉拉-1.0》由導演山崎貴執導，集結神木隆之介、濱邊美波、山田裕貴、青木崇高、吉

  岡秀隆、佐佐木藏之介等實力堅強演員，今年才於美國奧斯卡金像獎一舉拿下最佳視覺效果

  獎，驚豔全球。


  本次消息為日本當地發出，是否適用台灣或其他行銷活動，有待平台最後公告。

  #Amazon





  印象中亞馬遜prime 不支援用Surfshark VPN跨區

  用NORDVPN才能在亞馬遜PRIME 跨區的樣子


  --'
