url: https://www.ptt.cc/bbs/movie/M.1699013248.A.8CE.html
title: 'Fw: [閒聊] 哥吉拉ゴジラ -1.0有雷心得'
content: '作者: Lamuness (皇家水銀密) 看板: C_Chat

  標題: [閒聊] 哥吉拉ゴジラ -1.0有雷心得

  時間: Fri Nov  3 18:30:13 2023



  這篇有雷，請注意！



  (水中酸素破壊装置起動)


  (水中酸素破壊装置起動)


  (水中酸素破壊装置起動)











  今年是哥吉拉70週年。在印象中看過的哥吉拉相關文章裡會提到早期的哥吉拉是如同神一般的存在。牠是從原子彈誕生的，所象徵的意義一方面代表大自然的反撲一方面也是不爽美帝砸了兩個原子彈到他們家裡。


  這次的背景是1945年二戰結尾，以時代來說最接近初代哥吉拉。裡面的人類科技就是二戰水準，沒有任何現代炫炮的高科技武器，所以在人類突然面前現身的哥吉拉就宛如神一般的存在。對於這個未知的神從哪裡出現又要幹什麼，人類完全無從得知。但即便人類是如此渺小無力，當因哥吉拉破壞而失去親朋好友時也會想要盡全力消滅對方報仇。


  故事描述的是二戰神風特攻隊的一員在特攻前因怕死而逃避的自己的任務，怕死的心情在初遇哥吉拉時也因此害死了同袍。他就是一直帶著這份愧疚感退伍，直到與哥吉拉再次相遇，並在電影最後走出傷痛得到救贖。與其說這是一部哥吉拉電影，不如說是一部描寫二戰日本兵治療PTSD的故事。不只是主角，電影裡頭的日本兵角色非常多，所以故事也帶有日本特有的屬於戰敗國的戰後惆悵。與哥吉拉對抗的過程也是在描寫走出戰敗，找回失去的勝利並好好活下去的一個心境。


  神木隆之介與浜辺美波的組合是繼前不久結束的らんまん後再次看到。神木的演技非常令人動容。故事中的他在戰後雖然活著卻像是沒有活著，初遇哥佬害死同袍的惡夢不斷徘徊，讓他彷彿活在無間地獄。因此他雖然得到了類似家人的浜辺美波，卻不敢真正提起勇氣成為一家人。


  「俺の戦争はまだ終わっていない。」


  再次失去家人(浜辺)讓他萬年俱灰，甚至想開戰鬥機跟哥佬同歸於盡，完成當年沒能完成的自殺任務。而最後在上飛機前，當年指責他害死同袍的整備班長說了要他開降落傘活著回來，解除了神木赴死的魔咒。擊潰哥佬後又在醫院見到吐便當的浜辺，至此救贖完成。


  「あなたの戦争はもう終わったんだね。」


  最後浜辺吐便當真的太唬爛，我不相信被哥佬嘴砲衝擊波掃到外加埋在瓦礫下的人能活著。但是那段的情緒處理很好，我已經哭得淅瀝嘩啦的完全給過。果然還是HAPPY ENDING最可愛的啦QQ


  --'
