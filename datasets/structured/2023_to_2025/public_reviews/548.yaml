title: '[好雷] 哥吉拉-1.0 劇情+怪獸特效平衡的寫實佳作'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  早上發現台灣無緣上映的哥吉拉-1.0 突然在 Netflix 上線了!

  趁假日立刻就看完了! 不愧是 70 年來，史上首次拿到奧斯卡的日本哥吉拉


  人物劇情，特效，美術設計，都是佳作，跟庵野的正宗版互有千秋

  庵野版，著重在諷刺日本政府的官僚，和面對天災的無能，人物對白刻意毫無感情。

  哥吉拉被描寫成人類無能為力的天災，恐怖又壓迫，滿滿的絕望感。


  -1.0 則重回 1950 全系列的起點，日本二戰時期，觸碰敏感議題，重回反戰基調。

  很意外這個超級長壽的系列，居然還能再拍出新風貌

  但比起單純的反戰和檢討戰爭，本片卻又賦予了戰爭稍微正面的意義。

  發動侵略戰爭的是領導者，然而基層士兵也是迫於無奈，並沒有人喜歡戰爭。

  比起為了上位者的野心，毫無意義的去送死，面對哥吉拉的威脅，戰後倖存的

  退役軍人們，靠民間力量動員，終於能打一場有意義的戰爭，

  讓人有種跟二戰留下的傷痕和解的感覺。


  和正宗一樣，是偏寫實的風格。復刻了 1940 年代的的街道景觀，使用的也是二戰時期

  真實存在的武器，沒有外星人或好萊屋添加的那些遠古神話的設定，就很單純的軍事，

  這些參照真實歷史和軍武的考究，大大增加了故事的說服力和真實感，相當好看。

  另外此次對抗哥吉拉用的，也是二戰時的科技比較有可能做到的方法，

  姑且不論這在物理上是否正確，至少讓人覺得煞有其事，比灌食冷凍劑要可信些

  在戰後武器都被沒收，軍隊遭到裁撤的日本，該如何對抗哥吉拉，這很需要想像力。

  個人覺得這是歷代最具有真實感的作品。


  當年二戰開發的震電戰機，因為戰敗來不及參戰，終於有機會重新在天空翱翔

  而且是為了對抗哥吉拉保衛家園，而不再是為了侵略，這個設定也很不錯。


  此次怪獸的造型沒有延續正宗的風格，而是感覺和美版變得比較接近，生物感也比較多。

  發射射線的充電動作設計得很不錯，畫面也相當漂亮，吐出射線造成爆炸還故意做成

  原子彈爆炸的樣貌，反戰意味明顯，也持續呼應原本核污染的設定。

  對於爆炸場面的使用，負一明顯比正宗或是美版要少得多，但是透過畫面的設計

  光是一腳踩下地板完全變形，就能感受到重量跟破壞力，隔著螢幕都覺得壓迫，

  海中的畫面也做得很逼真，視覺效果獎當之無愧!


  最難能可貴的，還是主角戲份和人物感情刻劃。這個部分雖然不到特別優秀，

  但在同類型片中相當出色，至少劇情的推進是正常而且大致合理的，也不顯多餘。

  對於戰後創傷症候群的描寫，對於戰爭的檢討，也很呼應全片的主題。

  比起美版添加各種遠古神話，海底古文明，神秘的國際組織各種設定，

  這種簡單有力，又充滿真實感的劇情，反而更加引人入勝! 大推!


  --

  Sent from PCMan on PCMan''s PC


  --'
