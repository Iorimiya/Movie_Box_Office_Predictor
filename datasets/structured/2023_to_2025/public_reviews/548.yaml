url: https://www.ptt.cc/bbs/movie/M.1717465098.A.3E8.html
title: '[好雷] 哥吉拉-1.0  看到哭是正常的嗎?'
content: '雷文防雷資訊頁



  原本只是想周末看個爽片，想說這部有拿到奧斯卡最佳視覺效果可以來

  HIGH一下，本身對哥吉拉也沒有特別愛好，不過我覺得算是很好看




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  本片的感覺我覺得主要在於導演跟編劇算是很用心，可以感覺是個很有風格的導演


  哥吉拉這樣的題材，也拍出他的風格。反而滿好看的，一般看特攝片，都是會趕快


  期待怪物出來。然後文戲的部分，趕快過去。但這個版本，真人演員的部分，個人


  感覺編排還不錯，走一種情感壓抑的路線，還滿讓人想看下去，這些角色的未來會


  怎麼發展，另外我的感覺是配樂的應用反差很大，許多人物劇情的部分幾乎沒什麼


  配樂，但該有動作大場面的時候，配樂又很滿。


  而電影最重要充滿一種「真實」感，一開始覺得哥吉拉咬人都不噴血，會感覺這部


  電影走的是闔家觀賞路線，然而，中段竟然女主角就被核爆整個幹走，讓人頗傻眼


  （感覺是真的不會活的感覺）再來一些鋪陳就是讓人感受到導演用心細膩之處。透


  過一些照片跟人物的對白，表現出男主角對女主角的愛。


  整部片有愛情、也有熱血。


  「我的戰爭，還沒有結束．．．」很多地方都讓我看得很感動，後面看到哭出來，


  主要還有一點比較創新的是，一反哥吉拉電影中，大家都追求壯烈犧牲，這部電影


  竟然是為生存而戰，算是很特別的。


  另外真實感的部分，從哥吉拉跟真實世界的比例表現上，也很不賴。動作場面也很


  棒，個人是滿推薦的XD














  --'
