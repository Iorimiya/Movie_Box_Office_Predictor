url: https://www.ptt.cc/bbs/movie/M.1715907440.A.544.html
title: '[討論] 哥吉拉-1.0 4K藍光也太好看了吧o.O'
content: '人生第一片4K藍光



  實在太好看了o.O


  阿伯我的設備

  sony PS5

  sony 75X9500H

  關燈看


  防雷












  快轉到哥吉拉戰後首次出現

  在海上追逐主角的掃雷小艇

  到高雄艦出現砲轟哥吉拉


  實在太好看了QQ


  然後接著哥吉拉登陸東京

  咬火車

  噴射線

  核爆

  女主角噴噴

  男主角哭哭


  實在太好看了QQ


  這根本和有沒有被暴雷無關

  這些片段

  不管看幾次

  都是這麼令人感動

  尤其畫面真的太驚人了

  4K的高解析度

  HDR的高亮度

  超廣的色域

  這都是

  科技的進步

  電視的進步

  畫面的進步

  PS5的進步

  一切的配合太完美了

  太令人感動了


  實在太好看了QQ


  有沒有中文字幕真的沒差

  看哥吉拉哪需要字幕啦

  劇情根本不重要 對話根本不重要

  看畫面就夠了~


  實在太好看了QQ


  --

  還好啦我是用兩聲道喇叭廳

  其實我收集的哥吉拉片大部分還是兩聲道而已

  90年代以前的電影連5.1都不是主流

  甚至70年代以前電影院都還是mono單聲道而已XD

  其實正宗坦克決戰哥吉拉到哥吉拉第一次噴射線火燒東京

  這一段也是超好看

  不知道耶

  台灣其實很多日片都沒代理

  我北野武很多片子都是買港版

  我猜之後會有

  我中午又看了一下

  其實很多人覺得演員讓你出戲

  我覺得是太少看日片的關係

  這次-1.0的演員其實讓我有種既視感

  那就是七武士XD

  也難怪史蒂芬史匹柏很喜歡哥吉拉-1.0

  因為七武士也是他最愛的電影之一

  這次的演員其實很像七武士那種風格的戲劇表演方式

  很古典 也很適合二戰的調調

  看習慣現代片好萊屋片的

  可能就會覺得出戲了'
