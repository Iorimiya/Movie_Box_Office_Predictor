url: https://www.ptt.cc/bbs/movie/M.1700267076.A.E51.html
title: '[ 好無雷] 哥吉拉-1.0 不熟前作也好看'
content: '昨天學校帶我們去看哥吉拉-1.0，看的是新宿toho的DOLBY ATMOS，先說結論，我不是粉絲也沒看過前作，唯一看過的是好萊塢拍得酷斯拉，這次不論是特效還是劇情都有超越我的期待，原本對怪獸片這種類型毫無興趣的我甚至有點想去二刷，真心推薦五顆星



  以下無雷評價


  優點

  特效：超越日本電影過往的特效技術，雖然不到好萊塢大片那種精緻浮誇，但是已經是亞洲水準以上了，這次導演山崎貴身兼導演編劇和視覺特效vfx，真的有感覺到他對哥吉拉的愛，嘴砲真的太強大了好想為了嘴砲進場多刷，導演採訪說想把哥吉拉代表的動物性和神性的絕望感做出來，我覺得完全有達到這個效果


  劇情：有點老套，但是同時也有好幾段看到我不禁落淚，情緒氛圍做的很足，跟以前聽說怪物片都在開會比起來，這次開會戲份幾乎沒有，給好評


  音樂：下經典主題曲的時間點真的讓人起雞皮疙瘩，太厲害了


  缺點


  演員：我雖然很愛神木弟弟，但是感覺在演技上他還是沒辦法演出男主角那種深沉心碎絕望的感覺，演技略顯浮誇，我覺得裡面演得不錯的感覺是山田裕貴，但是這也是我的個人評價而已


  劇情：一樣是劇情，缺點我個人覺得女主角美波有點太強了，當下看到有笑出來，為了不爆雷我就不細說了，還有就是以路人來看最後的大戰，解決方法有點弱，感覺應該還能更有轉折，目前的結尾幾乎是觀眾完全能猜中的發展有點無聊


  特效：雖然我覺得這次特效不錯，但還是有出戲的地方，第一是哥吉拉的size ，不知道是不是在電影裡有慢慢隨著時間在變化，感覺不同時間看哥吉拉的size感很奇怪，忽大忽小，另外就是哥吉拉攻擊城市的畫面，還是有好幾幕能感覺到動作不自然，當下會有點出戲，不過整體還是挺不錯的



  以上


  --'
