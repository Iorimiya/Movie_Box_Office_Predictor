title: '[新聞] 哥吉拉-1.0續集最快可能在明年推出'
content: '新聞網址：



  看來我們不會等待 Godzilla Minus One 的續集太久。這部 2023 年的電影確實為世界上

  最著名的怪物的回歸留下了空間，東寶似乎正在準備讓哥吉拉大舉回歸。


  據 彭博社報道，Godzilla Minus One 續集最早可能在 2026 年上映。我們知道導演山崎

  隆已 將這部續集作為 他的下一部電影，但考慮到到目前為止似乎還沒有做太多工作，我

  們可能對這麼快上映有點懷疑。


  但是，嘿，如果它來了，它就會來。此外，還有一部潛在的《新哥吉拉》續集。2016 年

  的電影是哥吉拉在日本復興的開始，與 Godzilla Minus One 相比，哥吉拉也對怪獸有了

  全新的詮釋。


  隨著全球觀眾在哥吉拉-1.0 之後證明他們喜歡日本哥吉拉媒體，東寶似乎認為

  現在是出擊的時候了。



  現在中國網站翻譯比聊天機器人還要爛


  --'
