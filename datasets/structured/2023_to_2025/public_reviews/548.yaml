url: https://www.ptt.cc/bbs/movie/M.1718000844.A.192.html
title: '[好雷] 走過戰爭──故事充滿情感的哥吉拉-1.0'
content: '好看！要把哥吉拉電影拍出深度，恐怕還是日本人來拍較適合。至於所謂爽度，就交給好

  萊塢吧！


  本作之所以命名為《哥吉拉-1.0》，是指因二戰過後，日本已呈現「歸零」狀態，而哥吉

  拉的出現，簡直是更慘的「負一」局面。其實在這樣的命題下，哥吉拉的存在可謂是一個

  上天降給日本的艱鉅考驗，祂既有形象，卻又像沒有形象。所以整個故事裡，沒什麼交代

  哥吉拉的起源與過去，也就更不會出現像傳奇影業裡刻意描寫的怪獸個性或生活習性等情

  節。反之，哥吉拉在這部電影裡，比起當成一種生物，不如說更像是一種災劫。要說是人

  禍也好，要說是神罰也罷，甚至看成是日本重新站起前必須跨越出去的一個巨大心魔也通

  。總之，隨著故事推進會發現，祂其實是反映了人類各種情感於一身而又令人敬畏的巨大

  事物。


  看了好幾年傳奇影業拍攝的怪獸宇宙電影，現在觀賞《哥吉拉-1.0》，竟有種奇妙懷舊感

  ，好似在看小時候平成時代的哥吉拉片子。也許除了滿滿日文外，還有那不同於美式特效

  的街道破壞感，甚至人群逃難的拍攝方式、哥吉拉走路的緩慢節奏、經典的配樂等等，在

  在都令我勾起那段童年回憶。但我想觀影後感到最豐富的，還是這部電影對於人性的描寫

  。經典的怪獸片往往主角還是人類，在一定程度上，談的是人類的貪嗔癡、或是狂妄與自

  私，而本片主題則定調在「走過戰爭需要的勇氣」，主題正面有趣，命名也扣得很緊，頗

  能感受到編導的哲理心思。


  主角是二戰時期一位神風特攻隊隊員，雖在戰爭後倖存下來，卻背負沉重壓力，除了得面

  對自己的創傷外，命運更是不幸與哥吉拉糾纏在一塊，彷彿上天在戰爭後仍不願意放過他

  ，不停與他開玩笑。而其它配角，也都個性鮮明，可以從劇中看出許多人對於戰爭與戰後

  的想法。整體來講，人類在故事中出現的戲份和細節描繪，都比哥吉拉高出許多，後者的

  出場時間遠不如現在的傳奇影業作品，但就是這樣的比例拿捏，整體故事才能說得流暢又

  充滿情感。


  至於哥吉拉，你要說他在劇中除了考驗外，也像是在隱喻美國的軍武，或是某種因果、裁

  罰，甚至比喻成自身日本政府，也似乎都說得通。其實「戰爭後的反思」，就是《哥吉拉

  -1.0》的核心主題，而導演也只是提出了一部分的見解，再繼而讓觀眾激盪出更多的後續

  答案出來。所以這些隱喻無論代入什麼，都能產出相對應的批判，這種開放性的作答，不

  得不說挺有詩意。


  雖然本片榮獲奧斯卡最佳視覺效果獎，但最優秀處，仍然是劇中「人與人之間情感的表現

  」，這同時也是導演山崎貴真正的強項。或許就是在特效以外，本作還擁有一個能令觀眾

  跟隨主角不斷轉換心情的好故事，才能夠在日本及海外各地都普遍獲得好評。如果是喜歡

  看怪獸打架，或是怪獸戲份偏多的人，那傳奇影業目前的作品應該還是較能滿足這類胃口

  ，但假如想看點不一樣的怪獸片，同時也能接受日系演技，那《哥吉拉-1.0》真的值得體

  驗！






  --

  有深度的閒聊



  --'
