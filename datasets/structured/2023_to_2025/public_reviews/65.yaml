url: https://www.ptt.cc/bbs/movie/M.1760803141.A.F8E.html
title: '[好雷] 捍衛天使  窮人生活就是費盡全力了'
content: '這部片對我來說是今年前三名了




  本片導演應該是在臭資本主義，說人民為了生活就費盡全力了，努力工作賺錢的勞工們，

  缺還是被錢追著跑，應該會很有共鳴。



  劇情就是很流水，像一段段小短片，也很多笑點，如果你看過康斯坦丁，還有喜歡基努李

  維的話，會更喜歡，特別那種語調超慢的講話超讚XD







  以下簡單透劇：


  天使加百列是一位權能很低的天使，渴望能提供更多幫助於人，而不是只是行車中提醒駕

  駛開車不要用手機


  劇中原本要讓阿傑體驗一下富人的生活，其實根本沒有這麼如意，結果的確是錢能解決幾

  乎全部的問題，被換去窮人生活的傑夫確發現其實他根本不能度過這種生活，更不用說東

  山再起，結局當然也是阿傑同意回復原本的生活。







