title: 'Re: [討論] 捍衛天使裡的窮人真的這麼慘？'
content: '先別說遊民這種極端了


  有看過丹佐華盛頓經典好片-迫在眉梢嗎？

  一個基層美國工廠工人，領週薪，時數還被砍，小孩要動手術結果沒錢，沒辦法只能去搶銀行


  你說工人本來就很低階？那再看八卦神劇絕命毒師好了，一個高中老師，還要去洗車場兼差，儘管如此還是不夠看病，還想放棄治療把錢留給家人


  你就知道一般小民如果在美國遭遇事故（傷病、詐騙），基本就是死，台灣起碼還能賴活


  -----

  Sent from JPTT on my Xiaomi 2211133G.


