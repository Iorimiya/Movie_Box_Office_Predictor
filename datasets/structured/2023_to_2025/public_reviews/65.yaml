title: '[普雷] 捍衛天使 有趣但無法療育'
content: '對基哥粉來說，觀影體驗有很大的加成

  如果不是習慣以前基哥風格的電影

  可能很難體會這個憨憨歐吉桑的反差萌


  本片的笑點處理的很不錯，一路輕鬆有趣

  但比較讓人感到沮喪的是

  結局對於本片探討的主題，近乎逼死的人底層生活沒有給出一個解方


  對於如果自認生活有如阿傑的人來說

  電影的結束就像真的大夢初醒一樣

  一夜的笑料並不能緩解被催繳債務的痛苦

  點出問題，但沒有相應的解答

  前面的輕鬆愉快，反而更增添惆悵


  -----

  Sent from JPTT on my Samsung SM-A5660.


  --'
