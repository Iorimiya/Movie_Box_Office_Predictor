title: '[好雷] 捍衛天使'
content: '主角 Arj 是一名曾有美國夢，如今在美國掙扎的印度仔

  長年住在車上，靠打臨工幫人跑腿打雜苦撐著

  因緣際會成為社會成功人士 Jeff 的助理

  卻又因付不起餐錢公款私用被解雇，好死不死車子又被拖吊


  喪志的他此時遇到了一名

  業務職掌只有避免行車人因分心出車禍

  平常總是仰望高階天使講述他們的神蹟

  渴望有一天也能帶給失落的人希望與願景的低階守護天使Gabriel


  Gabriel 為了向 Arj 證明他的日子並不如他所想的悲慘

  有錢人的生活並不如他所想的美好

  於是便將 Arj 與 Jeff 的人生對調


  結果~~~ Arj 爽翻了，爽到整個人回不去

  被喚回記憶的 Jeff 則氣炸了，認為 Arj 偷了他的人生

  此時 Gabriel 慌了，這跟他想像中的完全不一樣

  而要讓 Arj 回去，必須要 Arj 心甘情願才行


  束手無策的 Gabriel 和他的上司 Martha 告知這件事

  Martha 認為 Gabriel 逾越本職加上失職

  便把他貶入凡間，開始了他與 Jeff Arj 亂七八糟的故事


  劇本看似平凡無奇，好像又要扯一堆不食人間煙火的高大上

  但有趣的是從頭到尾都沒有帶到"有錢人也有他們的苦"這種鬼扯

  反而不斷描寫有錢人多爽，社會底層的日子確實就是辛苦又掙扎

  本來抱持著人間每個人都各有辛苦之處的 Gabriel

  也在貶入凡間，要靠當洗碗工過日子後

  變成一個懷憂喪志憤世忌俗的癮君子


  當然故事最後還是走向 Arj Jeff 換回來

  Arj 認真看待自己的生活，Jeff 重視底層員工的待遇

  這種不會在現實發生的結局(但好像也沒辦法)


  整部片最大的亮點，個人認為就一代男神基努李維了

  基哥從以前的捍衛戰警、駭客任務、跳越時空的情書、康斯坦丁、捍衛任務

  不管他演甚麼，可能是面相體態和鏡頭形象的關係

  總讓我有一種帥到難以融入任何電影，不是人的感覺


  而這特質在捍衛天使裡反而超恰到好處

  因為他就是演一個不食人間煙火搞不清楚狀況的天使

  被貶入凡間後對於如何進食、對雞塊奶昔墨西哥捲餅感到驚喜

  微薄薪資還要被扣一大堆稅、狗這麼棒卻只能拿到一塊餅乾的不滿等

  都詮釋的超級到位，看到一直笑不停，他真的超適合這個角色


  總之這是一部適合放鬆觀賞的輕鬆小品

  如果有進場看的話，可以多花心力看看基努李維的演技大爆發(X

  車庫第一周送的海報還不錯

  跟前幾個月穆荷蘭大道重映送的相比紙質磅數有比較高了

  穆荷蘭大道送的那張真的是甚麼鬼，跟拉基一樣


  --

  是的，個人想法跟你一致

  我認為這部片就是要刻意避掉告訴觀眾"有錢人也有很多煩惱"這種逼機假道學

  有錢人有煩惱我承認

  但當社會底層的煩惱是 "我有沒有下一餐，我今晚要住哪" 的時候

  難道還要他們格局放大，努力學習向上，換位思考

  告訴自己啊有錢也沒有甚麼好的嗎?


  有錢有勢本來就是一種祝福，就少在那裏強說愁了

  看了只會讓人覺得噁心而已'
