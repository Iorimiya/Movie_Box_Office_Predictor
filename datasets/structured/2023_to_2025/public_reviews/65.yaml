url: https://www.ptt.cc/bbs/movie/M.1761863386.A.1C1.html
title: '[  好雷] 捍衛天使真的值得去觀看'
content: '如題


  自從知道看電影對腦的智能啟發是有作用XD我想應該可防老化吧

  每年都是突然有閒有興致就會去挑個好片到電影院看一下，而且已經從大排場的威秀到近

  幾年習慣去秀泰，只因不用煩腦停車問題,停機車也是超值

  身旁友人都說看手機就好，不用花那個錢，韓國電影院已面臨倒院潮，真的希望台灣別啊

  orz


  關於捍衛天使是從上週就開始搜尋觀後心得，正面是多的，又恰好某售票平台竟前幾天從

  臉書跑出，什麼，只要168+30元超商手續費等於198就能到捍衛天使首映的影院劃位，看

  了追蹤書20幾萬人，才打消可能是詐騙的想法,現在連去書店買團票都不是很便宜了（這

  大家都知嗎？）


  而昨天選的影城是台中廣三的新影城，首次踏入，再等進場就猜可能包場

  結果如願了 XD


  本來以為是會死沉的內容，尤其阿傑黑眼圈跟彼人真的差不多XD 自己近幾年因心情因素

  也從可月如十萬以上的工作換成平凡打工仔所以還蠻了解代排跟一天打好多工作的辛苦，

  雖然自己未從事過外送那類，但卻待過加百利的洗碗工作就因不想思考，這幾年中自己就

  待過幾間餐館

  但他還遇到好人同事與他分析人生現況，真的算職場中的小確幸

  港片郭富城所演的麥路人，內容也是經濟低層的謀生故事,當時忘了是2刷還3刷

  對於生處優境但想略知人間辛苦是可以參考的


  記得十幾年前為了拜訪一位旅店要出售的屋主，都要在傍晚算好他泡澡完的時間過去

  所以傑夫這等有錢人劇情中在桑拿房跟冰水交替的環節換取身體健康這事並不陌生，但影

  片接近尾聲是3人在一起在熱房跟冷水間交換，覺得好可愛又好笑，尤其是進去桑拿房戴

  的帽子，XD


  這部電影能全程peace，關鍵是這3人都是善良的，阿傑雖然喜歡富裕生活，車禍後還想裝

  失憶，但他最終在愛情跟他本性善良驅使下自願回到原本生活

  而加百列雖因讓富窮交換身份而失去小翅膀跟天使身份，但他因為當人體驗了吃東西 工

  作 跳舞 捲餅，還愛上抽菸，對於撫摸狗狗產生的好感，這都證實人性本善，甚至認為辛

  苦工作都拿去扣有的沒的卻更可以為狗狗爭取社會福利等


  有錢人傑夫也真的難怪有錢

  雖然他並非口中從沒錢做到有錢，而是有很好家庭背景

  支持做後盾

  他在影片中遇到任何困難，是找方法，而不是跟阿傑一開頭說想結束生命

  這就是人對生命充滿了熱忱吧

  最後就在他還想起自己有一堆名錶可改善他的經濟問題返回去拿取

  那支到底是叫什麼 baby的錶應該是他的最愛，記得他看它的眼神，然後轉身就被密碼124

  4的槍打到

  XD


  總之，因為包場，整個大笑也不怕影響旁人

  記得當時麥路人是好哭又好笑，但刷那幾次都沒包場，就是旁邊會有2-3人


  這片電影帶給自己的啟示是社會上每個人的生活不一樣但互相的尊重跟給予溫暖是非常重

  要的


  做打工仔這些日子，遇不爽的事情也就是會靠北啦 幹的直接掛在嘴上

  結果昨天片尾傑夫說什麼給一個糖醋醬給一星！！FUCK

  XD

  真的不是髒話多髒阿，而是那才能把把當下怒火放出來阿


  歐美較沒有港片跟韓片的表情跟細節細膩，所以還會再去二刷嗎 不確定

  但這部是會讓你看了暖暖，且不討厭的電影

  是很值得的：）








  --'
