title: '[好雷] 捍衛天使，推薦給想看喜劇片和基哥的粉絲'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  本篇微雷。


  今天10/24週五去看《捍衛天使》Good Fortune，目前一天只剩兩場小廳，有拿到

  特典A3海報。10/17上映，美國喜劇片，片長97分鐘。知名演員基努李維主演，

  阿茲安薩里導演處女作、編劇兼監製，也是男配角。劇情講述叫做加百列的天使

  （基奴李維飾演），嘗試運用神力向一名求職不順利，以兼職打零工維生的阿傑

  證明金錢並非萬能，無法帶來真正的幸福，並將阿傑與富有的科技新貴傑夫交換

  人生，但卻導致意外的後果，三人要如何收尾？


  這部電影是現代童話，有點諷刺和勉勵的意味，天無絕人之路，自己的選擇和努力

  也很重要，但不至於很刻意說教，可以很輕鬆的看完。

  劇情有很多橋段很有趣，而且出現不少基奴李維以前電影的梗，很推薦基哥的粉絲

  來欣賞。


  --'
