url: https://www.ptt.cc/bbs/movie/M.1762324427.A.040.html
title: '[好雷] 捍衛天使'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  單純因為Keanu Reeves才去看的一部片。

  雖然戲份不多，但是看到John很接地氣的一面，為什麼抽菸可以那麼帥 !!

  塞斯羅根也是很眼熟的一角，回來查才知道另一個印度家庭的主角也是得獎人物


  劇情方面算是很扁平簡單，但是明確要傳達的意境或許是人人感受皆異，

  因為主要是在講述社會底層小人物的生活，雖然勞工的環境地點是在美國，

  但是我想每個人應該都或多或少有類似的想法跟經歷在心中對比。

  那些成長過程中好一些常見的謬論都有在裡面對白出現。

  有錢不是萬能，沒錢卻萬萬不能;本以為金錢無法帶來真正的快樂卻解決的大部分的問題。


  結局也沒有過多的灑狗血，本片要傳達的對我來說應該是要滿足於自己的生活

  但是很難啊，要對自己的生活感到滿足又要對自己的選擇感到充滿未來的希望

  我只希望也可以重新轉生或者是交換到有錢人的靈魂阿。

  一輩子只活一種生活，真的很難說出可以感同身受別的人生活。

  我只想當個快樂的有錢人 ，然後再來樂善好施。


  最後，身而為人，片中吳珊卓飾演的瑪莎（Martha）一句台詞讓我覺得貫穿了全片

  "有時候，迷惘的人不需要天使，而是 另一個人"

  或許這才是讓我們對未來懷有希望然後堅持下去的理由吧。


  --

  生命之所以神奇


  在於它的獨特性


  --'
