url: https://www.ptt.cc/bbs/movie/M.1709387370.A.755.html
title: '[ 負雷] 浪費時間的B級片天眼救援'
content: '結論：不要去電影院浪費時間浪費錢，等好萊塢電影台上了倒楣轉到再看就好。


  被說比阿蓋爾好看騙進來看，看完真的是一頭霧水.....


  完全不懂犧牲兩個人救一個人的cp值在哪？

  雷神弟被抓兩次是在搞笑嗎？每次抓到就是脫上衣，是多沒有賣點只能賣肉？第一次被抓

  獲救後，天眼局都叫你待命等聯合部隊處理，是在腦衝硬幹甚麼啦？這樣的情節叫刺激？

  這叫耍笨吧？還沒有成功反而又被抓....是阿凡達的小女兒嗎？


  這部片是在反宣傳美軍的情蒐跟效率嗎？

  從頭到尾叫B1一顆飛彈炸光據點就可以全劇終的故事，連小隊都不用派。


  劇情節奏緊張？根本是硬編硬湊，後面反覆插入超市片段跟逃生片段的意義是什麼？要表

  現出羅素克洛最後臨危擋下直接拍最後一段就好，是在湊什麼片長？？？


  兩次耳鳴黑畫面也是偷懶省事偷時間到不行，雷神弟（可憐到只能用哥哥的名義代稱）的

  演技也很差，反派人還很好一直用清水幫他洗臉，就是要露出明星的乾淨帥氣臉蛋，是好

  萊塢要墮落到跟陸劇小鮮肉一樣惜皮嗎？阿被狗看到一直吠還想說要用甚麼巧思把狗趕走

  ，結果完全沒事？就只是壞人沒看到，你是恐怖組織的獵犬還是貴賓狗啊？


  看的時候一直在想預算到底有多低，結果還真的不到2000萬美金，羅素克洛就是個吉祥物

  的存在，最後還要充當政治教育的角色，全劇唯一的優點只有MQ9無人機+發射飛彈+F18+B

  1槍騎兵的出現片段。


  是因為海軍投資捍衛戰士結果大家都跑去報空軍，所以再投資一次黑空軍嗎？


  --

  嚴重懷疑那些好雷文章的真實性

  欸不是阿大哥，現代化美軍不是更重效率跟信息戰嗎？都有無人機可以隨時巡邏，不應該

  聽命行事等待聯合部隊做更詳細的配合行動嗎？第二次被抓加送頭純粹是莽夫行為，宣傳

  美軍人權至上然後緊急電話被關鈴聲五次是這樣宣傳的嗎？這部片是在矛盾啥？？

  一定會有人說爽片不要管邏輯，但也至少要夠爽吧，像top gun2F14打爆su57，就真的爽

  到

  沒人會在乎邏輯，而且公雞回去救獨行俠還成功脫逃才讓我看到人權至少不拋棄任何兄弟

  的光輝。

  沒有哦，敵人有說歡迎來到關達那摩，關達那摩港就有117公里大的美軍基地，而且這更

  搞笑，說是東南亞的恐怖組織，但是關達那摩其實在古巴==，但開頭又是從菲律賓基地出

  發，這個是哪來的邏輯？

  是，第一次遇到是黑吃黑不知道敵軍這麼多，第二次剩兩個人硬闖再被抓的理由是？

  這點倒是長知識了，但是電影裡也有說聯合部隊已經在附近準備集結了，並沒有要等好幾

  天的跡象，而且附近就有個具備B1、F18的菲律賓美軍基地，趕過來也不用到幾天後。

  真的...尤其在我昨天剛看完沙丘2，今天等不到工作人員名單，她們兩個最後在那跳舞我

  就離場了。

  還是多刷沙丘吧，我看新光一張330，多200可以看沙丘還是比較值得，不需要也不明白我

  為什麼要看完這種電影。

  我要來查查是不是有中資，我感覺完全在醜化美軍形象、把人命當兒戲、二等兵不聽命令

  硬幹造成隊友死亡、美軍情蒐不足等...。'
