url: https://www.ptt.cc/bbs/movie/M.1708433129.A.6E9.html
title: '[好雷] 天眼救援-爽缺上校'
content: "雷文防雷資訊頁\n\n\n\n看預告片滿滿的槍、爆炸，\n進場看舒服的爆米花片。\n以下多劇情雷，慎入。\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n劇情大綱:\n\
  一隻小部隊受命前往營救人質，但意外遭遇恐怖組織介入，導致任務遭逢巨變，\n敵人從原本的軍火商變成整個恐怖組織，最終在男主的努力不懈下成功炸毀敵方，\n並成功營救出隊友之一和目標。\n\
  \n嘈點:\n一、最初發現兩座洞穴出口時，明明就看到門內還有門，也沒確實確認，\n    就認為是安全的哨點，算是導致任務失敗的第一導火線。\n\n二、醫護包的配置怎會在戰時才詢問放置位置，不應該是任務前就要確認好?\n\
  \    雖然他的傷勢看起來就算有醫護包，應該也是救不起來了，RIP。\n\n三、在第一次撤離點的時候，前面才確認四周無敵方蹤跡，怎黑鳥一到，\n    敵人就突然間冒出?無人機不是都持續在上空偵測嗎?\n\
  \n四、雖然可以理解是為了避免過於冗長，但蘇格是怎麼就能找到男主的?\n    光從水壩逃跑到被捕，少說經過了1小時(5公里以上)。\n    總不可能被RPG炸(詐)死後就從遠處一直跟著男主吧?\n\
  \n五、全片最糟糕的嘈點在於，一部重要的軍線電話，可以這樣各種惡搞:\n    不接、調成無聲、直接掛起，這隨便一條都能判個軍法了。\n    死神也在片尾鄭重聲明該電話的重要程度，可惜沒演出上校被懲處的部分。\n\
  \n優點:\n槍砲、飛彈、刑求、近戰各個畫面帶的流暢，看著舒爽，相當爆米花。\n個人覺得瀑布藏身那段用第一人稱角度去帶很棒。\n\n--"
