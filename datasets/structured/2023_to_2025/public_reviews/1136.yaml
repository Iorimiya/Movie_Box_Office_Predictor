url: https://www.ptt.cc/bbs/movie/M.1708605998.A.374.html
title: '[好雷] 《天眼救援》不該被錯過的優秀動作小品'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  因為看起來太像隨處可見的過水動作片、主演還是雷片王連恩漢斯沃跟最近喜歡到處亂接

  片的羅素克洛，要不是朋友大力推薦，我還真的會直接略過這部其實很好看的《天眼救援

  》。

  .

  看之前特地查了一下發現導演威廉尤班克之前拍過我同樣很愛的《深海終劫站》，突然意

  識到這個男人好像蠻有料的，很會拍那種一直線、快節奏的動作驚悚電影。

  .

  對照《深海終劫站》開場不到五分鐘就遇到怪物的襲擊，這片前面還在鋪陳跟介紹人物時

  節奏確實慢了點，但不至於太無聊，而只要撐過去之後，後面一小時可就精彩了。

  .

  基本上等到開了第一槍之後，電影的節奏就直接加速了起來，幾乎是就這樣一路從頭打到

  尾的，而且導演對於場面的調度也確實有一套，動作場面多但不會疲乏，有一直不斷在做

  變化，從槍戰、爆破、近身肉搏甚至幾場飛機的空襲都拍得夠有質感也夠火爆，更驚人的

  是這片只用用不到兩千萬的預算就拍了相當高的水準，很樂見威廉尤班克未來繼續在中小

  製作的動作電影中耕耘。

  .

  當然為了增加劇情的緊張感以及加快故事節奏，劇本確實是處處從簡，我自己覺得比較大

  的缺陷是聯絡中心裡面的軍人設計，這些人也太扯，好像沒人在乎這個任務似的，已經死

  很人了耶，但是看球賽顯然比較重要，還要掛主角電話，笑死。看蠻多人說討厭那個上校

  ，但我覺得他設計感太重太刻意了，給人的感覺已經完全只是個負責給主角跟羅素克洛製

  造危機的劇情推進器而已。

  .

  但也不能說這樣的設計沒有效果，最後羅素克洛突然秀了一手《超危險駕駛》中學到的飆

  車技巧，搭配主角方的轟炸倒數，不得不說這樣的交錯剪輯還真的挺刺激的，有被娛樂到

  —雖然這邊有點太鬼扯，那個時間壓得緊到我完全不相信他能趕上，大概光是從超市跑到

  停車場就來不及了吧。

  .

  不知道這片還能在院線撐多久，但這片搞不好是今年為止最精采的硬派動作片也不一定，

  希望讀到這篇文章的人都能去看看。


  --


  如果這片結局是超展開變成主角打超級大怪獸我應該會更喜歡

  查到的成本是1870萬鎂'
