url: https://www.ptt.cc/bbs/movie/M.1715695557.A.8DA.html
title: '[好雷] 串流上不看可惜戰爭片小品《天眼救援》'
content: "會找這部來看之前，其實心情有點忐忑，\n\n之前有看過同樣劇情簡單但偏無聊的《危牆狙擊》（The Wall），\n\n這部Land of Bad一開始從連恩漢斯沃低頭看穀片盒，我就覺得有可能是雷片XDD\n\
  \n沒想到這跟柴米油鹽醬醋茶結局有所呼應，對這些軍人而言戰爭本來就是荒唐的日常，\n\n本來可以好好生活的人為了國家安全必須以死相逼，再怎麼精良的\n\n美軍也會有蠢長官\
  \ v.s.願意在第一線服務、看似為了薪水其實對戰鬥\n\n充滿熱情的羅素克洛（變圓滾滾之後不管是穿神父裝騎車還是找素食製品\n\n都好可愛）。起初我真的只是為了卡司追串流，沒想到好酒沉甕底，最後的反轉\n\
  \n也又好笑又刺激。\n\n\n本文只有結局雷，放個預告防雷，票房的結果很謎，不用太執著好好看片就好。\n\n\n\n\n\n我不敢說上電影院看值得，但我在串流平台看了是認為很值得XDD\n\
  \n《天眼救援》（Land of Bad）不但有近距離搏擊、槍戰、救援、空中鷹眼與爆破畫面，\n\n還不小心搞成18禁，對照印太局勢，推出這部場景設在菲律賓的片其實\n\
  \n也是國家的一種文攻武嚇，但在做電影大外宣的同時也不斷針砭美軍自身，\n\n真的不用神聖化軍人，軍人也會做出渣行為，例如只顧球賽不顧士兵死活，\n\n雖然誇張，但不誇張，要怎麼在這種小成本片邀請到這些好卡司呢？\n\
  \n\n雖然有渣行為，但好卡司也會做出神行為，最後的救援揮手那幕我雞皮疙瘩\n\n整個起來，羅素克洛飾演的Reaper為了鼓舞主角還告訴他自己神扯的婚姻和\n\n\
  一些雖是長輩幹話但聽了就是溫暖的話語，而主角只聽到一次手機號碼就能\n\n精準打過去的神扯轉折，種種巧合接在讓人喪氣的失去弟兄事件後頭，讓人\n\n感受到劇本的魅力，也難怪這樣中低成本才一千八百萬預算的片請得到這些大咖。\n\
  \n\nReaper最後被邀去走婚禮紅毯，自行加戲要一起跳父女舞也超萌的，\n\n真的想不到當年帥氣的神鬼戰士老了也是個寶XDDDD\n\n\n\"I shouldn't\
  \ say MEAT.\" lol\n\n\n\n--\n\n幻想●---------------☆\n/﹀\n/\\ \n\n按a加入最愛\n\n--"
