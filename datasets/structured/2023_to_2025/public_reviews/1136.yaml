url: https://www.ptt.cc/bbs/movie/M.1708167420.A.CB7.html
title: '[好無雷] 天眼救援'
content: '前半小時鋪陳很無聊

  無聊到令人想離場

  但是...

  半小時後開始名副其實的血脈噴張，一直推進劇情，槍戰、爆破該有的都有

  羅素跟雷神弟戲份各占一半，劇情跟演員表現都沒令人失望

  劇中也演出了第一線跟操控無人機同仁在協同作戰時的高度反差

  劇裡的三角洲部隊在進行任務時會想到火線獵殺這款遊戲，隊長需要不斷下令戰術指示同仁行動，這點很有真實感

  雖然是限制級但血腥程度還好，也有大肌肌的養眼畫面

  至於劇情的合理性…別想太多 當爽片看就好




  -----

  Sent from JPTT on my iPhone


  --'
