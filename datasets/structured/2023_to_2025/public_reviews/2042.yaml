url: https://www.ptt.cc/bbs/movie/M.1516032506.A.0FF.html
title: '[極好雷] 以你的名字呼喚我'
content: '整部電影美的如詩如畫，就像Elio那年夏天的青春。雖然導演拍得還蠻淺顯的，但裡頭用了很多的電影語言暗示。像是


  1. 電影一開始的時候，Marzia 走出了Elio的房間，換成Oliver住進去，象徵後續三人關係的變化。


  2. 相較於Oliver一開始就帶著項鍊，裡頭Elio帶猶太項鍊的時間點則暗示著Gay身份的顯露。用同志/猶太的圖案語言象徵不能輕易表露的身份。


  3. 電影中大量利用水、杏桃等等表現情慾的流動與性暗示。（像是泳池、喝水、最後瀑布等等）


  4. Elio 午夜與Oliver碰面的時候，那時，oliver站在陽台，Elio打開門“出櫃”，走向oliver，而最後臨別時，oliver搭上火車，被關上車廂門，則意味著Oliver走進櫃子，一去不回，同時也暗示了最終的結局。


  5. 中間有段園丁釣到了一條活魚，象徵著Elio那時的心理狀態對oliver的愛意已上鉤。


  其他的部分，就看大家自己解讀了。


  -----

  Sent from JPTT on my Samsung SM-N9208.


  --

  那是一種難堪的相對

  她一直羞低著頭

  給他一個接近的機會

  他沒有勇氣接近

  她掉轉過頭，走了


  --'
