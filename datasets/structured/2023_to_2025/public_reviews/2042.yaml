url: https://www.ptt.cc/bbs/movie/M.1518068885.A.E3C.html
title: 'Re: [討論] 以你的名字呼喚我-看完好厭世'
content: '我跟你同感，

  我覺得這部片不對我的胃口，不好看。


  我也覺得裡面的人過得都好悠哉呀！

  像奧利佛講的，在夏天的時候，閒坐在那裡等夏天結束，那在冬天要幹嘛？等夏天來？

  整部片就給我這樣的感覺，

  裡面的人成天晃來晃去，悠閒玩樂，不需要做什麼正事，

  有呀！我有在考古，可是只要心情高興的時候去看一下就好，

  有呀！我有在研究論文，可是只要想到的時候，拿起來讀一下就好，

  怎麼跟我認識真的有在考古，真的在寫論文的研究生，差那麼多？


  小男生也是，

  有呀！我琴藝驚人，可是只要心情高興的時候彈一下就好，

  怎麼跟我看到學音樂的一天都要苦練四五小時差那麼多？

  十七歲了也都不需要規劃一下，考慮未來，

  只要成天在家吃飽睡飽吃，擔心自己的戀愛生活就好，

  而實際上，他的戀愛生活，也沒什麼需要擔心的，

  男的女的通通都是自動送上門來，

  也就是說，他的人生，百分之一百，毫無任何需要花力氣之處


  然後，同樣的情況繼續上演，

  有呀！我有一個被我不當一回事甩了的女友，只是人家大方的表示要一輩子當朋友，

  怎麼跟我看到發現自己被同性戀男朋友欺騙了的女生差那麼多？

  接著，我已經連翻白眼都不想翻了，

  有呀！我是同性戀，可是家人無條件支持我的任何性取向，

  怎麼也跟我看到的同性戀鬧家庭革命才能出櫃的情況差很多？


  我簡直無法想出比他更舒服的日子了，

  到底，這樣的人生有什麼好猶豫？有什麼好壓抑？有什麼好淒美？

  有什麼好在那邊不敢去愛的？

  除了為賦新詞強說愁，我不知道還能給他的人生什麼註解

  他結尾在壁爐旁邊哭的時候，我替他難過的心情...

  抱歉了小少年，還真半點也沒有啦！

  要哭的話，我看你該反過來替我的人生哭吧？我過得實在比你辛苦多了！


  --

  喔！放心，我很放寬心的，

  不喜歡就是不喜歡，沒什麼好勉強自己的

  就是因為體會到了，

  所以結尾時我看到他還在壁爐邊哭的時候，我內心才一滴眼淚也沒有呀老兄

  喔那樣的生活我可嚮往了，我如果他，大概每天二十四小時笑嘻嘻

  另外有一點我正文裡客氣沒講出來，

