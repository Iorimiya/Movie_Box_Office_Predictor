title: '[新聞] 《以你的名字呼喚我》確定拍續集！ 艾米'
content: "《以你的名字呼喚我》確定拍續集！ 艾米漢默親口承認\n\n\n記者許瑞麟／綜合報導\n\n《以你的名字呼喚我》為2017年口碑極佳的同志電影之一，更讓堤摩西柴勒梅德（Timoth\n\
  ée Chalamet）和艾米漢默（Armie Hammer）2位男主角人氣直線攀升，近來艾米漢默受\n訪時坦承續集正在製作中，消息一出讓影迷都相當期待。\n\n\
  艾米漢默在多倫多影展上透露《以你的名字呼喚我》續集相關資訊，「這將會發生，因為\n大家已經在進行作業，盡力完成它」，不過他也不敢洩漏太多訊息，「我知道多少和我可\n\
  以告訴你多少是2件非常不同的事」，雖然知道很多，但目前還不能透露更多資訊。\n\n事實上，導演Luca Guadagnino先前便透露會拍攝續集，劇情會發生在1990年代，大約在\n\
  首集的5年後，也就是AIDS盛行的早期階段。\n\n《以你的名字呼喚我》改編自同名小說，故事發生在80年代北義鄉間，由堤摩西柴勒梅德\n飾演的17歲少年Elio，愛上了寄宿在他家的美國大學生Oliver，2人自見面開始便逐漸產\n\
  生情愫，面對內心的微妙悸動，Elio經歷了慌亂、衝動、示愛、分離，這份愛戀深深烙印\n在他心中。本片獲得奧斯卡最佳改編劇本，22歲的堤摩西柴勒梅德更成為最年輕的影帝入\n\
  圍者。\n\n艾米漢默這陣子為了新作《Hotel Mumbai》出席多倫多影展，本片描述2008年印度孟買連\n環恐怖攻擊，泰姬陵酒店也成為巴基斯坦激進份子的攻擊目標，其他演員還包括《貧民百\n\
  萬富翁》戴夫帕托（Dev Patel）、《52個星期二》澳洲女演員Tilda Cobham-Hervey、《\n哈利波特》系列電影傑森艾塞克（Jason Isaacs）等。\n\
  \n\n\n--\n\n那個男人，臉上永遠有著捉摸不透的悲傷微笑。竹鼠們不知道他為什麼會那樣的殘忍，總\n是莫須有地給自己扣上「中暑、內外傷、長太肥、長太瘦、憂鬱症」的荒謬病因，反正那\n\
  個男人一開口，所有竹鼠的數量就會少一隻。\n竹鼠們都很慌張，大家都在討論要不要集體出逃，離開這個鬼地方。 \n \n\n--"
