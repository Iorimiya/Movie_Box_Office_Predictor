url: https://www.ptt.cc/bbs/movie/M.1517288239.A.124.html
title: '[好雷] 以你的名字呼喚我 Call me by your name'
content: "身為喜歡浪漫追溯的考古與藝術史愛好者，我看《以你的名字呼喚我》格外地有知性的啟發；作為一個自小家教優良小有才氣走在知識份子正軌上的好學生，我看\
  \ Elio 這「什麼都懂，只不懂真正重要的事」更格外有感性的感觸。也許很多人也像我這樣，要音樂有音樂要文學有文學要科學史地也精通，也這樣一個個學期一個個寒暑假不停地耕耘自己才能到了青春期，一路養成這文藝身體的過程中卻不知不覺少了些什麼？\n\
  \n我們的才子男主角 Elio 的初始身段是很上軌道一路超然自持的，他一次次的夏日義大利別墅度假，儘管也都行禮如儀地跟著其他較平庸的男孩女孩上舞廳跳水池打排球睡午覺，看著那些平凡的女孩有事沒事過來追尋個無謂的夏日調情，但他自己是卓然不群寧願躲進耳機與抄譜的小世界裡，寧願躲進他自己的私人水池讀過一本又一本書。只是這麼多遙遠的知識，這麼一個談笑有鴻儒往來無白丁的波波學術家庭生活，到底真正為自己的心靈與身體開通了什麼？\n\
  \n雖身為異性戀，但我格外認同 Elio 這耕耘才氣卻自持壓抑的身體，也對 Elio & Oliver那蠢蠢欲動卻猶疑試探的愛情交鋒感同身受，也許我們東方社會中的東方壓抑身體就算是談異性戀都這麼壓抑吧？才不像他們\
  \ 1980s法國美國義大利少年們想吃哪個帥哥想釣哪個正妹就上了再說。剛好我們的文藝少年 Elio 就是這義大利小鎮唯一的猶太人，搞不好因此也是躁動夏日裡格外戒慎自律的少年，這才為我們獻上這個也許呼應你我許多台灣觀眾的青澀年少？\n\
  \n看此片我最喜歡曖昧不明的前 1/3，處處充滿史地文物意象提醒 Elio 打開心扉，儘管片片斷斷甚至有時有點刻意地充滿巧合，但我們就當作是一個文藝少年落花水面皆文章吧，他也許這夏日讀到了一百個文藝概念，只是電影只節選那真正打動他這一層面的那十個而已。以下一場場戲\
  \ recap，才發現這文藝少年追逐的文藝外殼有多華麗，但內裡真正重要的超越訊息又有多簡單。\n\n\n 0. 片頭，一堆考古發現照片，都是銅雕像，都極美麗細緻，但雙眼都無神，甚至身體都有殘缺。片頭系列畫面都是一張亂糟糟的考古學家桌子，放著一張張出土照片與既有歷史藝術品照片作比較，桌上有眼鏡紙鎮錢幣帳單報紙雜誌底片幻燈片筆筒撲克牌草稿打字機信封菸盒酒壺，倒數第二張還有\
  \ 1983 Dicembre的小票（是那看著火光的冬天接到的？）。整張桌子，是個，是亂糟糟的研究案與日常人生，但亟欲梳理清楚找到真相，並重建那曾經的眼神。\n\
  \n這一堆零碎拼湊的最終畫面停在一個完整的（希臘時代？）藝術品，金罐子上人們徜徉森林花鳥間舞蹈擁抱著。試著從考古學家（或某一系與考古走很近的藝術史家）觀點來看，日復一日珍視著古文明的斷簡殘編，帶著浪漫主義心情遙想著古人多少雄心奇情成就失落，所有做不到的理想與渴望，都化作細膩絕倫的藝術品（尤其是立體可撫摸的雕塑），它們卻支離破碎埋藏沙土與海底百年或千年...\
  \ 雖然有一系科學派考古是只想知道歷史知識將這一切碎片保存現狀，但也有一系浪漫的復原派是期待幫助古人完成遺憾的。\n\n本片的浪漫考古學家們（耳濡目染的 Elio\
  \ 也算一位吧），顯然就是要讓一個未能完成未能呼喊的理想，得以出水出土更能修補復原成為完整藝術品。那麼，世代少年埋藏心底未能呼喚出的理想呢？在這大地生機蠢蠢欲動的夏日，要努力把握機會把心理胡思亂想的斷簡殘編整合起來呼喊出來，不管遙遠的未來有什麼好後果或壞後果，都要把握這一刻把愛說出來也做出來。\n\
  \n\n 1. Elio是個音樂愛好者，他抄譜的音樂書桌和考古書桌異曲同工，他這夏天都和不知怎麼面對卻貼在身邊的女友 Marzia 混在一起，心裡想的卻是讀書聽音樂這些覺得和\
  \ Marzia 不是那麼有共鳴的事，看似種平靜的幸福卻又迷惘。Elio的生活在正經文藝少年的軌道上，但天降的 Oliver 我行我素什麼都沒在怕，睡死才不管主人的晚餐，有點\
  \ annoying 卻又令人嚮往。\n\n 2. 陽光早餐吃蛋談果園，第一次看見猶太六芒「大衛之星」大剌剌掛在脖子上，到電影中後段我們才知那是個 Elio 想表達又不敢表達的「」情結，居然有這麼個從天下凡無拘無束的身體？如大衛般張起雄健肌肉自信面對體制權威？心裡整個受到震撼，尚不知如何面對。\n\
  \n 3. 兩人腳踏車去 Crema開銀行帳戶，自我介紹從「夏天幹嘛」開始。夏天只是等待冬天？冬天只是等待夏天？假期就彷彿時間長河一次又一次，好像都在等待未來，就像\
  \ Elio 都在讀書聽音樂抄譜寫曲充實自己，日復一日做著少年夏日該做的白天游泳晚上出去玩（竟沒有認真把個妹，只放著 Marzia 在身邊不知所措），卻沒有在把握什麼當下找到什麼意義？Oliver\
  \ 初次一句 \"Later\" 彷彿在嘲弄你一切都等著下次假期的「再說吧」心態，令 Elio 如被刺一箭般渾身不自在，卻又對這打破生活成規的新可能有點蠢動。\n\
  \n 4. 考古書桌上幫爸爸分信件，爸爸考題 Apricot/Albicocca給 Oliver 賣弄一下語源學，順便帶出這歐陸中南部格外早熟的提醒人情的「早熟」，若不及時採擷很快就腐爛墜地永遠埋葬了。不只是壓抑的\
  \ Elio 面對開放的 Oliver ，就連整個老包袱甩不去的歐陸人都要這樣面對毫無包袱的美國人，爸爸每年出這一題相信能答的青年學者也不在少數，但能這樣若無其事信手捻來毫不在意打臉權威長輩的，恐怕還是這個\
  \ Oliver ，令全家人都吃驚片刻回過神來才能拍手。\n\n 5. 兩人上鎮晃晃，Oliver走進義大利酒吧參與大叔牌局如魚得水，相較之下 Elio 只是一直關在自己文藝小世界。度假少年打排球，有美有法有義，這一年一度的考古青年都是女孩們焦點，膽敢橫搶水更感強勢按摩的\
  \ Oliver 更有自我風格無拘無束誰人都嚮往。強勢按摩提醒的緊張與放鬆，的確是 Elio 需要自我審視的，他看了 Oliver 就不太爽還把趁機過來按摩調情的\
  \ Marzia 冷冷推開，表面看來像是男性間的爭鋒吃醋，潛隱糾結想的可能是我為什麼沒辦法做到這理想身段？真是迷惘少年，失落女友。\n\n 6. Oliver缺席的戶外晚餐，Elio初次發難講出心結，理性上是覺得\
  \ Oliver 這種姿態就如那句 \"Later\"很傲慢很不妥，自己可能會討厭；但感性上顯然很嚮往這姿態，只是自己做不到就在生悶氣，如果我也能這樣做自己會如何呢？\n\
  \n 7. 晚間與義大利鄰居家庭聚會，其他小孩少年近看電視上的流行歌舞，卓然不群的 Elio 對這生活焦慮不安沒心情，不想看電視甚至少年舞廳也完全不想去，但你焉知真正懂得傾聽己心把握當下不會是那些平凡少年？父親第一次催促著\
  \ Elio 彈鋼琴，然而彈琴未必是要娛樂客人或是主人要愛現，也有可能是你的滿腔樂音本應自然釋放流瀉？\n\n 8. 早上賴床自慰差點被抓包，這自慰還未必是在想著\
  \ Oliver 或 Marzia 或哪個性幻想對象，也說不定只是自己滿腔情緒不知如何梳理，無處抒發只好打兩槍 XD ？還是強勢的文藝復興英雄 Oliver 拉我一把出去河邊玩，把\
  \ Elio 從鑽牛角尖的焦慮中拉到河邊享受當下陽光。此時呼應知性上自我心理解放的，恰巧是感官上瞥見彼此換衣換褲的身體解放。愛情一直都有知性與感性兩面，能夠有個超凡的人帶我走出平庸就是無盡的嚮往，這崇拜之情不也自古到今都是愛情的動力之一？\n\
  \n 9. Elio出去是出去了，但還是在耍酷，戴著墨鏡坐個帥姿寫著文青的樂譜，覺得撂下一句「私人的思考」好像很有文藝少年的酷勁兒？但真正率性的人才不等你「不說拉倒，那我去找你媽玩」，而且是和你媽一起玩那充滿寓意的「成熟杏桃要及時採擷」。Elio耍不了酷還是只有忙不迭跟上去，雖仍不太會表達還是繼續默默彈吉他，更躍躍欲試帶著\
  \ Oliver 彈他更擅長的鋼琴。\n\n10. 彈琴戲完全展現 Elio 的少年迷惘焦慮，先談「如同李斯特改編巴哈」的高難度華麗炫技，再彈「如布松尼改編李斯特」的浪漫主義憤世重擊，但\
  \ Oliver 只想聽那直指單純初衷的「」？Elio劍拔弩張的少年競爭心性表露無遺，彷彿看見 Oliver 率性身體一次次挑戰我的才子身體，那我硬是要反擊一次給你閉門羹？看\
  \ Oliver 舉手投降暗暗得意，但投降者轉頭就走也忙不迭留下來，終於給你一曲年輕單純的巴哈，他思念哥哥我則嚮往著萍水相逢的兄長形象。\nFerruccio\
  \ Busoni (1866-1924)\nFranz Liszt (1811-1886)\nJohann Sebastian Bach (1685-1750)\n\
  BWV 992-Capriccio sopra la lontananza del suo fratello dilettissimo (1703-04)\n\n\
  \n11. 談完少年巴哈，配樂馬上接成年巴哈 Cantata BWV 140 (1731) 中的 \"Zion hört die Wächter singen\"\
  \ 接續這 Elio 心境，帶點嘲諷也帶點疼惜看這荒唐少年在亂搞什麼？少年曲是送別親愛的大哥，成年曲則是「」，彷彿心裡一夕長大的 Elio 回首從前「我對他太嚴厲，以為他不喜歡我」（小記事本剛好被風吹到這兩夜，是有點刻意，不過我想觀眾們應該都能體諒）。\n\
  BWV 140-Wachet auf, ruft uns die Stimme: No.4 Zion hört die Wächter singen\n\n\n\
  12. 戶外樹下抄譜，耳機裡聽的仍是這首成年巴哈，遠遠假裝隨性瞥一眼 Oliver ，其實只是像許多壓抑的台灣少年若無其事地與矇懂莫名喜歡的或嚮往的人多接近，只是從來不敢大方出手。老漁夫來給廚娘\
  \ Malfada送鮮魚，同時給 Elio 送來自然啟示：鮮魚就是夏日大地的禮物，魚嘴巴新鮮生動地一開一合雖有點殘忍，但就像自己的心怦怦跳一樣，，杏桃要趁初熟採擷，心情也要趁新鮮化為行動（別像爸爸等到蒼老）。\n\
  \n13. 海報上的泳池午睡，Oliver問起 Elio 關於海德格談早期希臘人「不認為人類有解釋不可知的能力」，對努力以人之姿解釋一切的科學家與考古學者來說當然\
  \ \"makes no sense to me, to your father either\"。但神來一筆的 Elio 回了「若是你寫的，可能就 make\
  \ sense 了？」誠哉斯言，他們兩個就在面對一個不可知，如果此刻來寫個心情一定都呀。這對同樣受到學術理性規訓的 Oliver 來說恐怕真正是「數月以來有人對我說過最仁慈的話」。也許工具理性是枷鎖，以知識開通己心才是仁慈？\n\
  \n14. 跟少年們去舞廳，我們看見 Marzia 真像個小媳婦努力地付出，又是幫大家拿飲料又是靜靜坐著看 Elio 有沒有多注意她一眼，只是不著邊際地提提別人的調情看看\
  \ Elio 有沒有反應。也許本片這要「及時呼喚及時採擷」訊息的身先士卒領導者倒是這主動女孩 Marzia ？或是更主動直接帶舞吻下去的 Chiara ？這 Marzia\
  \ 雖然表面害羞實則細膩洞察，馬上看出 Elio 負氣帶我來水池夜泳必與 Oliver 有關，只是到底是男性彼此嚮往還是男性彼此競爭？恐怕 Elio & Marzia兩個少年都仍在探索。\n\
  \n（在此，也許很多觀眾會覺得 Elio 有點渣，心裡明明想著別的愛慾對象，竟然沒魚蝦也好把可憐的 Marzia 使喚出來當備胎？我想 Elio 在此的心情還是很渾沌不明的，天降英雄\
  \ Oliver 到底是教我身心的典範還是令我想望的對象？夏日的迷惘少年們，能夠不瞻前顧後勇於嘗試總是好的，畢竟都跟著 Marzia 煞有其事卻止於平淡地過了半個暑假，難道不讓這可能的緣分嘗試推進一點點嗎？還是別害怕試了再說，更要向一直勇敢又有耐心不畏嘗試的\
  \ Marzia 學習。）\n\n15. 早餐，Elio分享「昨天我們差點上本壘」，顯然是衝著 Oliver 來，也許是要他嫉妒，也許是要他看看我也不是那麼僵固拘束的？湖畔找到了神秘寶物，只要兒子不露口風讓別的考古團隊發現，咱們就出發！本片超主動的\
  \ Chiara 很快就來找 Oliver 了，超主動把握時光，真是憂鬱少年的榜樣呀。上車，Elio那對 Oliver 很有事的競爭心與控制感越來越高調，終於惹得\
  \ Oliver 發難一句「別刻意當個好主人」。 Elio 壓抑蠢動卻以衝突表達的笨拙少年姿態在此達到高峰，也等下一場戲從高峰解放。\n\n16. 加達湖畔 ，走過曾經繁華埋葬沙土而今出土的考古遺址，撫摸著曾經完整卻埋葬海底而今重見天日的，隨著如海潮般的印象派鋼琴配樂\
  \ Elio 跟著這環境觸動心裡越來越開通。也許，看見了這些曾經渴望卻黯然失落的遺跡，讓 Elio 也心有所感決定別再豎起壁壘鬼打牆？是呀想想這兩千年一憾，我們這兩個月暑假的小彆扭根本不算什麼，於是兩男伸手和解，當代人類也與遠古銅雕攜手共進，正是考古學子弟的超然清心。\n\
  \n17. 清了心，且聽考古爸爸講故事：19世紀初 contralto Adelaide Malanotte，於 1812-1832 與 conte Luigi\
  \ Lechi di Brescia 有一段婚外情，這希臘大師  原作的複製品，經手了追溯希臘文化提倡人文主義的斷袖皇帝 (117-138)，又經手了雖堅守天主教卻發起人文主義反宗教改革的\
  \ Alessandro Farnese (1468-1549) ，前者出土修復後者重鑄成愛神維納斯，且不論意識形態與手法差異，那都是世代考古學家清除塵土細心復育，從地底重顯藝術之華的心血。\n\
  \n18. 那我們心底的人情與愛情之華呢？撫摸著說不出話的雕像，兩男心底都有了體會，爸爸把握韶光游個泳再走，給兩男初次「以你之名呼喚你」，爸爸還要加碼「今晚慶祝且別工作，把握夏夜韶光喝兩杯」。騎著腳踏車匆忙離去的\
  \ Elio 去找 Marzia ，難道不也算是嘗試把握他的韶光？但一塊空地見不到 Marzia ，不知這是塊真的空地還是心理空地？\n\n19. 早起彈鋼琴，偷讀\
  \ Oliver 在讀的書  ，也讀讀小筆記「河在流動，並非指事物一直在變，反而事物是靠著內部的恆變保持其不變」，也許真要堅守自己的本然身體，就必須讓故步自封的本心勇敢變化？Elio想進對方房間，卻又怕被\
  \ Malfada抓包而故作沒事，終於大膽進了，拿起 Oliver 褲子開始還懞懞懂懂套套看，像是性幻想又不知道是不是。\n\n20. 暴風雨夜，媽媽帶讀法國短篇小說集，主作者是法蘭西斯一世國王的姊姊\
  \ Marguerite de Navarre (1492-1549)，又是一個在亂世裡孕育文藝修補世界的人文主義者，比浪漫主義還早將近三百年的騎士公主故事絕不是搞蕩氣回腸，而是簡單直指存在處境的「說或死」：每個北義的度假少年呀，你這夏天是要說，還是放著不說讓暑假結束？\n\
  \n21. 越來越有所得的 Elio 愈發強勢，卻再也不是拐彎抹角競爭挑釁刷存在感，而是直拳挑戰越打越正，先把故事直接丟給 Oliver ，再來不故作姿態很主動爭取跟去鎮上，鎮上談起地方歷史再也不是賣弄知識而低頭自承「真正重要的事我都不懂」，最後臨門一腳是抬頭看看這\
  \  紀念碑，17 萬個想寫信回家的男孩已化作雕像再也說不出口。如果考古子弟能耳濡目染的父親志業中學到任何一丁點，就是學習歷史的遺憾，圓滿雕像的殘缺。\n\n\
  22. 第一次在身心解放的奮鬥上，Elio走在 Oliver 前面一截，輪到 Oliver 若無其事心照不宣，邀來秘密基地用青春肉體戲水毫無問題，兩個男孩在一起可以做的也都樂意享受，只是不可說的他一張美國明星臉故作不知。「我冒犯你了嗎？」當然沒有，冒犯的可能是別的無聊東西，我也笑笑不說破，你手拿開就是了。\n\
  \n23. 與鄰居的午餐聊天，回到那，突然間一切感覺都不一樣都好遙遠。大宅主客飯桌上要談政治要表立場，不談政治話鋒一轉要談電影談布紐爾，好像這知識份子的生活每一刻都要用文藝智識填滿似地，只有一個鏡頭飄向了斜倚在草地的老園丁笑吟吟地旁觀看好戲\
  \ XD 我們頓時知道這個家庭這個男主儘管充滿眼花撩亂的知識（這部電影充滿眼花撩亂的典故彩蛋），那其實都離「真正重要的事」很遙遠，夏天很短趕快離席告退吧。關心孩子的爸媽恐怕也很想離席，但要幫擋子彈「他美國人不懂啦」。\n\
  \n24. 重要的事還是腳底按摩，終於此二人的猶太身份與他們的身體觀連結起來了：「媽媽說要當個戒慎的猶太人」，的確猶太人四處樹敵本應戒慎，戒慎身段駕馭同志身份更是小心翼翼裹足不前，能夠有個小廚房兩人時光已是萬幸。然而聽到這「戒慎」的\
  \ Oliver 冷笑一聲「這套很適合你媽」，隨後開始賭氣耍消失，不論是看板女友還是同性愛人全都不理不睬。\n\n\n哎呀文章越打越長，就且先 recap到這裡。此後\
  \ Elio & Oliver彼此推開又彼此相吸的愛情小遊戲，處處惹人小鹿亂撞也令我笑吟吟地看他們回想自己。但我更有感觸的卻是許多觀眾覺得很渣男的 Marzia\
  \ 這條線。\n\n此片關於走出閉塞勇敢擁抱，兩位猶太男子多多少少都有點裹足不前，倒是儘管表面怯生生實則最勇敢大膽把握當下的 Marzia 更令人感動也令人學習超越。夏日，就是要把握一切生命的可能，就算這位憂鬱少年\
  \ Elio 未必是我一生良伴，能一起珍惜的這個夏日我就要步步進逼把他的可能性開發到最底。即使終歸黯然分手「我不是你的女友了嗎」，終究知道這彼此啟發的暑假讓我們「成為一生砥礪的好友」。\n\
  \n僅以觀賞此片的落落長心得文，致敬我自己那矇矇懂懂的少年夏日，致敬所有人也曾經擁有的那少年追尋。我個人私心要致敬的先是我生命中帶我飛昇向天的 Oliver ，但更要致敬的是教我擁抱土地的\
  \ Marzia ，那僅僅萍水相逢一個夏日，卻在這ㄧ生每四五年出現一次印證默契重複呼喊著「小羊小羊小羊」的 Marzia ，正如自己囈語般地呼喊的 \"Elio\
  \ Elio Elio\" 。\n\n--"
