  二大魅力男，來自美國的高大研究生奥利佛，義大利十七歲翩翩美少年艾利歐，互相暗戀

  ，終於有了露水姻緣，後來成為美麗回憶的故事……

  艾利歐的父母睿智開明，世間罕見的好。母親的愛情助攻，父親的循循善誘，讓艾利歐的

  愛的經歷成為人生的美好，而不是怕受傷……

  迷上二位男主角的女生都挺無辜，艾利歐的女性好友更是，以為親密關係後有望……但最

  後仍退回好朋友位置，令人欣賞她的轉變調適。


  美麗的場景，舒心的音樂，情節流暢鋪陳，演員及角色的相得益彰，構成了精采動人的作

  品。


