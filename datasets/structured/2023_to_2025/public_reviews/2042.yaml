url: https://www.ptt.cc/bbs/movie/M.1486809458.A.DB8.html
title: '[情報] 艾米漢默主演《以你的名字呼喚我》再釋最新電影片段'
content: '約莫十天前才會各位介紹過在今年日舞影展上造成轟動的電影《Call Me By Your Name》

  ，而目前該部電影也延續在日舞影展的好評入選了柏林影展的「電影大觀（Panorama）」

  單元，並且將於德國柏林時間 13 日晚間於目前已經正式開展的柏林影展中放映，而先前

  已經釋出首支電影片段的《Call Me By Your Name》也隨之再度公開第二支電影片段以及

  更完整的劇情介紹。


  《Call Me By Your Name》改編自猶太裔作家 André Aciman 筆下於 2007 年間受到相

  當推崇的同名小說《以你的名字呼喚我》，並由導演本人與《窗外有藍天》老牌導演

  James Ivory 共同執筆電影劇本。


  柏林影展於《Call Me By Your Name》頁面中的劇情大綱寫道：在炎熱且陽光普照的

  1983 年夏天，Elio 與他的雙親正身在坐落於義大利北部的鄉間。這位 17 歲的年輕人每

  日在聽音樂、讀書以及游泳中渡過，直到一位他父親來自於美國的助理來到他們的大別墅

  中。Oliver 是一位有魅力且如同 Elio 一般的猶太人後裔，Oliver 年輕、充滿自信且擁

  有出眾的外表。起初 Elio 對於 Oliver 保持距離且態度冷淡，直到兩人一同出門遊覽義

  大利之後而開始有所變化。Elio 在兩人的關係別得越來越親密之後開始試探 Oliver，即

  使 Oliver 嘴上說著：「人們不能談論『這樣的事情』。」隨著短暫夏日時光的消逝，兩

  人之間的吸引力也隨之變得更加強烈。


  在演員的方面，由《星際效應》新生代男演員 Timothée Chalamet 飾演男主角 Elio，

  來自美國的俊美青年 Oliver 則由《紳士密令》Armie Hammer 飾演，此外則還有《正經

  好人》Michael Stuhlbarg 與《瓶中美人》Amira Casar 在劇中飾演 Elio 的雙親。而在

  這次的片段當中可以看見 Elio 的父親向他介紹了來造訪的 Oliver，正如同最早釋出的

  劇照中的情景。



  《Call Me By Your Name》日前在日舞影展首映後便不斷的受到各家媒體的盛讚，包括英

  國衛報的五顆星滿分、IndieWire 與 The Plasylist 鮮少給出的 A 高分以及 Variety

  與 The Hollywood Reporter 都紛紛給予「大師之作」等相當高度的評價。劇中的三大主

  角 Timothée Chalamet、Armie Hammer 與 Michael Stuhlbarg 也都交出備受肯定的演

  出。


  而《Call Me By Your Name》即將在 13 日於柏林影展中首映，屆時將會有更多來自世界

  各國的媒體及影評人觀看此片，我們也期待《Call Me By Your Name》能夠再度開出不俗

  的評價，更期待能夠在柏林影展中斬獲有「酷兒電影最高榮譽」的柏林影展「泰迪熊獎」

  最佳影片。


  《Call Me By Your Name》目前檔期未定，而 Sony Pictures Classics 已早早買下發行

  版權，目前被評為具有奧斯卡向的該片是否有辦法成功進軍今年底的獎季就看 Sony

  Pictures Classics 的內部考量了。



  --'
