title: '[ 好無雷] 以你的名字呼喚我'
content: '沒有看過小說所以無法做比較


  飾演Elio的Timothee真的是個美少年

  儘管現實中已經22歲 演17歲少年也是沒有問題的 片中那種少年青澀的模樣表現的很棒


  而演Oliver的Armie Hammer整個就是賀爾蒙大爆發啊啊啊啊啊啊啊啊


  兩人站在在一起的身高萌差

  感覺就是純情羅曼史的那種感覺



  整部片拍的很美 沒有灑狗血 也沒有太煽情的鏡頭 雖然導演說裸露很多

  其實只是時間地點設定在北義的夏天大家不想穿太多的那種

  (


  然後步調滿輕鬆的 笑點也不少

  是部值得一看的片


  看完會回想自己青春時期的那種悸動

  而且腐魂不斷噴發啊啊啊啊啊啊

  兩個帥哥畫面太美了 (-艸-)



  喜歡Armie的人一定要看啊啊


  --'
