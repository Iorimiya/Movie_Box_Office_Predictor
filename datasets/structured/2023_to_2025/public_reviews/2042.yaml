  但是他這兩部沒脫，差評！

  其實他對那個女的做的事蠻殘忍的，

  不是說他無法愛上那個女生，

  而是說他自己也知道他對那個女生根本是玩玩就丟，但事後也沒看他有什麼補償，

  至少也講一句「對不起」，

  沒有，他什麼都沒有


  結果反而是那個女生自己走過來，還一輩子好朋友耶！

  把他在這部片唯一應該做的事也幫他做完了，

  超好的，幾個人能遇到這種事？


