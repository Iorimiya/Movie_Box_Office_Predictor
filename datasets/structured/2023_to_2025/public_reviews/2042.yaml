title: '[情報] 《以你的名字呼喚我》最新調琴片段'
content: "此篇為當機後重po~內容照搬@@\n──────────\n\n英國今天上映惹，羨慕嫉妒恨~~~\n\n但是剛好也有新的兩分鐘的長片段可以看喔!\n\
  調琴調個兩分鐘，好像很無趣，但實際上…是「調情」喔喔喔!!!(我使用了雙關語A_A)\n快來看看Elio是怎樣跟Oliver調情、挑逗他的～～～\n↓↓↓↓↓↓↓↓↓↓\n\
  \n\n\n那個短褲，那雙大長腿，那個敞開的襯衫(露出的body)…………………\nOliver根本也在挑逗你我…我是說Elio啊=/////=\n\n明明沒有激情，畫面怎摸這摸激情撩人這摸性感呢!!(手背敲手心)\n\
  一定是因為導演使用35mm底片拍攝的關係(誤)\n\n\n咳，明年一月還很久，先來聽聽Elio彈奏的曲子：\n\n\n還有之前預告片用到的BGM：\n\n\n\n\
  \n\n都很好聽耶\\@@/\n(然後重複播放小倆口調琴影片)\n\n\n────────\n新增一些感想：\n電影原聲帶已經出來了!!\n除了之前釋出曲目之中，youtube就找得到的歌&曲之外，\n\
  第一首點來聽的當然是《Mystery of Love》啦~\n漂浮恍惚感的歌聲，曲調有如溪谷潺潺流水、陽光穿過葉隙灑落溪流反射光芒…\n雖然有幾處微妙奇怪的部分，像未完善的歌曲，但衝著上述我還是要給高分\\\
  0.0/\n然後…聽歌啦～～～(完整歌曲，請自行考量)\n  (可以放嗎?不行我再刪)\n另外，《Visions of Gideon》是片尾曲，也請自行考量。\n\
  \n還有啊，各大社群網站上應該都充斥著各種劇透(文字偷拍偷錄都有)，\n想找相關訊息又不想被雷的請務必多留心~=_=|||\n(已經看到好幾組gif了…一瞥到就艸著臉快速滾動滾輪)\n\
  \n已在國外看過、搶到金馬影展三場的好心人請踴躍刊登無雷心得，感激O_Q\n\n--\n我也期待~~~期待心得文QQ\n太喜歡這段調琴了，一定要po回來XD\n\
  加碼~官方釋出「Elio與Oliver愛的小窩」(被揍)「Elio的家」(叮咚叮咚)\n有16張照片可以看，很漂亮:D"
