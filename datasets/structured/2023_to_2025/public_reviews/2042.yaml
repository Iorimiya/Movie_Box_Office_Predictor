url: https://www.ptt.cc/bbs/movie/M.1518158443.A.DAD.html
title: 'Re: [討論] 以你的名字呼喚我-看完好厭世'
content: '在推文中提到《斷背山》，沒想到有人說幹嘛跟斷背山比，好吧就來講為什麼要提斷背山

  ，以下有斷背山雷














































  《斷》也是個封閉的時代背景，兩個主角也都沒有勇氣出櫃，各自結了婚，在當時的時空

  背景下，男同性戀在一起可是會被亂石（輪胎鐵鞘）打死處決的，可是電影對他們婚姻中

  的問題毫不掩飾地呈現：


  娶富家女的傑克，自己偶爾去墨西哥（？）買男妓或找一夜情發洩，在家裡總是受岳父的

  氣可能不是性向問題，但從妻子最後說出傑克死訊的冰冷，可以感受的他們婚姻關係也是

  如此冰冷。


  而恩尼斯的婚姻就更糟了，除了自己賺不了什麼錢，讓老婆為一家生活辛苦操勞之外，他

  與傑克重逢的親密舉動又被艾瑪目睹，艾瑪一直知道老公和傑克的姦情，卻隱忍著直到最

  後才說出釣竿的秘密，對艾瑪而言，恩尼斯真的是個又不賺錢養家又出軌的男人。


  十年前的《斷背山》可以拍得如此突破時代樊籬，但是十年後的《以你的名字呼喚我》這

  部片（或者從原著小說就如此）卻選擇美化主角的性格，為惡劣行為開脫，對他人的痛苦

  視而不見。


  別誤會，我不是道德審視，而是審視說故事者，一個角色可以既是渣男又是個極富魅力的

  好角色，《春光乍洩》也沒講什麼抗爭和出櫃啊！純戀愛，但是我們可以清楚看到渣到不

  行的何寶榮，靠近他就會跟著淪陷泥沼無可自拔，又不專情又教唆人犯罪還偷錢，但也的

  確是有魅力得亂七八糟。


  這不是同志片，同志在這部片中只是Elio口中調侃的「桑妮和雪兒」而已，如果只有肉體

  極盛的青春才有資格談戀愛，那其實就只是把性別換掉的羅曼史而已。


  WT

  這

  一

  喘


  --

  我最先在意Oliver的妻子唷！

  本來在那種時代隱瞞性向走進婚姻也很常見，但是為什麼要由Oliver來說他的妻小也很幸

  福呢？是你說了算嗎？他說幸福就真的幸福嗎？

  看了各種演職人員的說法只會坐實了這部片為了拍得唯美浪漫而掩飾了傷害

  「沒有人受傷」是演員講的

  「女性角色」的處理是導演講的

  我還看過被神恢復的護家盟同志唷！

  啾咪！

  有可能，我自己這段是覺得女生把委屈往肚裡吞還要擺出大方的態度實在太揪心太苦了，

  但是後來看到的很多評論或是演職人員自己的說法，好像都不覺得女孩被傷害了。

  Nice to meet you

  標題塞不下了，留防雷頁可以嗎？'
