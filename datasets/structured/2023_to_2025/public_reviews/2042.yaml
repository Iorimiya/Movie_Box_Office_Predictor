url: https://www.ptt.cc/bbs/movie/M.1509863829.A.7D3.html
title: '[好無雷] 以你的名字呼喚我'
content: '剛看完金馬影展11:10的場


  看著戲院人潮果然是開賣2分鐘秒殺的熱門場


  原本以為F排不會太前面

  結果還是抬著頭看了130分鐘XD


  ----------以上是廢話----------



  衝著兩大主角的高顏值

  和原著小說的深刻描寫


  這部片從官方放進片單後

  就成了我搶票的首選




  飾演男主角Elio的21歲年輕演員Timothee Chalamet無疑是本片的靈魂


  從臉部表情到眼神，甚至到細微的小動作

  都能深刻的表現出內斂的感情



  另一位男主角Armie Hammer

  完全表現出原著描述的高大英挺，任何舉動都令人著迷的年輕學者Oliver


  我想無論男女，絕對都會愛上他吧  (笑



  明年初的奧斯卡說不定有機會一舉入圍男主配



  特別是Timothee

  完全沒有任何生澀的表現，就是位活生生的情竇初開的北義青少年


  結尾那場內心戲幾乎奪走了全場的目光




  另外，導演對於北義的景色風光描繪能力，在前作"池畔謎情"就證明了絕對是一等功夫


  從家中庭園到古典風濃厚的小巷，再到謐靜的河流瀑布


  彷彿置身其中




  而劇情的描述方式也較為隱晦


  每個鏡頭都不會拖泥帶水，也不多贅述

  簡單來說就是"點到為止"

  完全體現出兩人間的內斂情感與暗示


  配樂也運用大量鋼琴伴奏

  既不搶戲，也讓人深刻地融入




  尺度的部分，則是讓人相當滿意   (笑


  小說裡該有的場景戲碼，絕不會簡略的帶過


  許多情感暗示戲，也拍得相當有意思




  深入的劇情就不多說了

  還是讓觀眾親自去體會


  這是近年來最真誠，最深刻的"純愛片"



  無論是被演員卡司吸引，還是對小說題材有興趣


  都是今年必看的佳片





  --'
