url: https://www.ptt.cc/bbs/movie/M.1517089014.A.7D9.html
title: '[好雷] 以你的名字呼喚我，考古身體觀'
content: '愛與感受的能力，是身為人最珍貴。然而曾幾何時人類走過的各種澎湃多情，都埋葬心底

  與地底？


  考古，曾經的完整人形，要出水拼接

  雕塑，曾經的婀娜多姿，要復原解讀

  戰場，十七萬人拋頭顱，要懷念勿忘

  水果，夏日大地的甘美，要汁液橫流

  夏日，多情蠢動的夜晚，要把握韶光

  鋼琴，滿溢胸腔的樂音，要自然流瀉

  騎士，滿腔壓抑的情意，要誠實以對

  你我，心有靈犀的默契，以己名呼喚


  電影充滿時地文物的意象，儘管談人情與愛情都是日常絮語，談個人身心的啟蒙卻是片尾

  結語。我們人類文明世世代代，越是文明身體越是壓抑自持，心靈另找出路的藝術卻越是

  百花齊放。


  然而，與其讓說不出口的澎湃情感凝結為藝術，沉積水底一百年或塵封沙土兩千年，何不

  直接用身體把握？這也許是考古爸爸沈潛一生的專業忠告了。



  --'
