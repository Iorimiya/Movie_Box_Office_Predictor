title: '[好雷] 芭蕾少女夢(內有以你的名字呼喚我小說雷 '
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  1.影片名稱 : 芭蕾少女夢


  2.觀影時間 : 2/9


  3.觀影地點 : 華山光點


  4.觀影方式 : 自行購票




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  此區為發文防雷頁

  可選擇性提供上列 1~4 資訊  或不提供亦可

  觀影心得於分隔線下方發布即可


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  快滿16歲的Lara擁有男性的軀體，但心中住著女性的靈魂，她在家人的支持下正接受賀爾

  蒙療程，她必須要有健康的身心以便日後進行變性手術。喜歡芭蕾舞的她，看著身旁的女

  孩，自身卻是身心矛盾的尷尬，賀爾蒙療程距離結束又遙遙無期，在一波又一波壓力的侵

  襲下，她……。


  看的人是局外人，但又如此心疼。

  被軀體禁錮的靈魂，每一次注視著其他女孩的軀體、每一個身體的特寫鏡頭、男女交歡的

  畫面，都是一種渴望。見證了一般男性的生理機能，再面對鏡中的軀體，充滿了身心的相

  互矛盾與尷尬。淋浴間中的遮掩、隱藏男性特徵的膠布、無法開誠佈公的身體，慢慢的將

  自身吞噬。

  壓力從不是一加一等於二，每一次練舞的跌倒、踉蹌、舞鞋下的滲血與瘀青，

  都加劇了負面情緒的增長。 電影看到了中後段，我漸漸覺得Lara並非與其他女孩一樣這

  麼喜歡芭蕾，又或許初衷已經不同，《以你的名字呼喚我》小說提到(概述)「如果我

  (Elio)也有像這樣的體態，或許我就不會如此迷戀他(Oliver)」，對她來說芭蕾是一個證

  明自己是女生的管道，或是利用女生的團體生活來尋求認同的一個手段，如果靈魂不曾錯

  置身軀，Lara會有不同的選擇。種種的心境轉換，雖然不曾接觸過相關的經歷，但依然能

  感受到主角內心的焦慮但又覺得無能為力。


  此作撇除了對於第三性的社會、家庭議題，將重心著重於自身的處境，議題更為純粹，探

  討的面向不廣卻深入，結尾部分乾淨俐落，不拖泥帶水，這樣的安排深得我心。



  --'
