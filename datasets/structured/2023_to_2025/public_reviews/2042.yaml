title: '[好無雷] 以你的名字呼喚我無雷心得+有雷花絮'
content: "當初看完書再看到陸續的官方劇照後更加期待\n覺得第一時間看不到就要衝泰國看一波...\n還好金馬賜票(合掌\n\n\n充滿80年代音樂、古典和醉心的義大利小鎮景色\n\
  交織成難以忘懷的夏日戀曲，無法向他人開口訴說彼此間唯一僅有的愛\n我能想到最美的電影之一。\n雖然設定在80年代，但已經跳脫那種Come out與否的糾結\n\
  他們就是很單純戀愛會遇到的曖昧、刺探與猜忌\n這種純愛看得令人揪心。\n\n要是先看過原著的人\n看到電影畫面當下很多文字馬上浮上腦海\n可以看到導演給那頁白底黑字的小說塗上了怎樣的色彩\n\
  沒先看過小說的人也能回頭再觸及那些文字\n腦中的樂曲和對話似乎言猶在耳。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n以下的內容他們其實在很多地方都重複回答過類似問題\n\
  可能每次都有一點不一樣說法，但大方向一樣XD\n如果有誤煩請糾正>\"<\n\n\n1、James Ivory是最初購買下André Aciman的電影版權\n\
  \   進行改編劇本原本也有意自己執導，公司也有意雙導演(Luca Guadagnino)\n   但改編時已經花了不少時間，礙於時間和金錢上的考量(一開始沒有投資者)\n\
  \   也怕雙導執行上有尷尬，Luca Guadagnino擅長在有限的金錢和時間下拍片\n   加上是個義大利人，所以最後由Luca Guadagnino主導，James\
  \ Ivory則為編劇。\n   兩人在拍攝期間也都還有交換意見。\n\n\n2、Armie Hammer(以下艾米)在訪問中有說過\n   一開始很多投資者拒絕投資，因為這部不是傳統的同性戀電影\n\
  \   沒有外部和內部的抗爭、沒有壞人、沒有父母及社會壓力\n   他認為這樣超棒，沒人要因為身為同性戀而付出代價。\n\n\n3、原著小說的義大利小鎮推測是在利古里亞海岸(Riviera\
  \ Ligure)附近的小鎮\n   從書中的感覺也可以感受到是個近海的小鎮\n   電影中改到克雷馬(Crema)距離米蘭不遠的市鎮\n   而故事背景的古宅是17世紀豪宅\n\
  \   Luca導演目前與伴侶居住在克雷馬\n   他說拍這片最開心就是每晚能睡在自己床上XD\n   非常美的一棟老宅可以在這看介紹 \n\n\n4、James\
  \ Ivory原本的劇本中，兩位演員都有大量裸露戲份，甚至正面裸露\n   但在Luca導演接手後修改、也認為沒有必要大部分裸露戲\n   他有特別澄清說跟艾米和Timothee\
  \ Chalamet(以下稱Timmy)\n   兩人的合約中也有限制裸露的底線無關\n   且實際拍攝上兩人是全裸，但剪輯時發現這樣會影響注意力(這我懂\n\
  \   導演覺得像是腳互相觸碰、各種桃汁、和液體已經足以表現他們的情慾。\n   James Ivory覺得大家不會在意螢幕上女性正面裸露\n   但卻很在意男性的正面裸露，這很美國顆顆。\n\
  \n\n5、有4小時的導演剪輯版。(給我啊啊啊啊啊啊啊!!!!!!!!!!\n\n\n6、很多訪問有提到兩位演員如何培養化學反應\n   艾米和Timmy說導演也沒特別要他們培養，一切渾然天成\n\
  \   兩人在不同訪問也常透露...在Crema拍攝以外其餘時間兩人獨處的細節\n   艾米說過他們基本上整天都膩在一起，沒拍戲也膩在一起\n   Timmy先到Crema要學鋼琴，然後他隨後才到，人生地不熟\n\
  \   Timmy的義大利程度也比艾米好一些，所以Timmy和他兩人就騎著腳踏車四處晃\n   向他介紹Crema小鎮，就跟電影情節一樣所以很快就跟Timmy\
  \ fall in love了\n   沒人認識他們，兩人常常一起泡咖啡廳、一起看電視、聊天說話等等\n   很像是書中的Elio和Oliver的情況，所以那份化學變化是自然而然的\n\
  \   (題外話是...艾米太太其實沒過多久就隨後就跟到義大利了，\n    所以兩人獨處時間沒這麼誇張，萬惡宣傳期!!!!!!)\n\n\n7、Timmy被問到:「有沒有發生或類似電影那樣的戀情呢?」\n\
  \   他故意用感傷的口氣回:\n   「有，其實有的，就在我與一位叫Armie Hammer演員合作的那個夏天...」\n  “I have, actually.\n\
  \    It was the summer I was working with this actor named Armie Hammer …”\n\n\n\
  8、Timmy提到為什麼不會再有像Call me by your name一樣的拍攝經歷和感受\n   這對他來說甚至不像在拍戲，他完全忘記攝影機存在、忘記自己在拍電影....\n\
  \   艾米也說這夏天對他來說很特別，這永遠難以忘懷的義大利夏日在他心中。\n\n\n9、關於第一次也是唯一一次的排演...艾米很愛模仿Luca導演XD\n \
  \  \n\nA:「在這問題之前我可以插句話嘛!!關於實際排演狀況，那是第一次排演...」\nLuca導演:「是唯一一次排演」\nA:「好，是唯一一次排演!我們在別墅，是非常美麗的別墅，我們在四周參觀一遍\n\
  \   Luca說\"你們想來個排演什麼的嗎\"，我跟Timmy就想說\"好啊!!沒問題!!\n   來這不就是為了這件事嗎!!\"」\nT:「我當下是\"yessssssss!!!!\"\
  」\nA:「Luca就說\"好啊那我也沒什麼準備，不然隨便好了，來個第62幕\"，\n    我就想說\"好喔!62幕是吧沒問題!!翻翻翻翻~結果那頁只說了\n\
  \    \"Elio和Oliver在親熱\".......我們就想說\"額好喔\"\n    Luca喊著說\"來啊!!我們到後面去排演\"，我們別墅後面有一大片草坪\n\
  \    Luca就說\"你們兩個去躺著\"。」\nT:「我們兩個就照做」\nA:「OK~對!我們就躺下，他又說(學導演口氣)\"等你們準備好了就開始吧\"」\n\
  Luca導演:「(大笑)」\nA:「然後我跟Timmy躺在那邊、親熱了一會，我們都還沒結束\n    Luca就說\"好!這樣可以了\"就直接走人了!!!!!把我們丟在草坪上!!!」\n\
  \n\n10、Luca導演沒有特別面試演員，他覺得面試已經在線上的演員很可笑\n    因為你可以拿演員的作品出來看，他挑艾米和Timmy也是看了他們的作品\n\
  \    導演說他看了《社群網戰 (The Social Network》愛上艾米。\n\n\n11、Elio在火爐前那令人揪心的最後一幕，實際上有兩種版本\n\
  \    一種是Timmy沒戴耳機沒音樂\n    一種是Timmy戴著耳機而音樂是播著Visions of Gideon\n    最後Luca導演選擇有音樂拍攝的版本。\n\
  \n\n12、一開始艾米有回絕這角色但Luca導演讓他回家思考一下\n    並不是因為抗拒同性戀角色，一方面對裸露戲分不安因為擔心女兒長大後\n    在學校會有人會拿這件事開他女兒玩笑，一方面覺得這角色需要放大量真感情\n\
  \    去愛得很純粹，他不知道自己有沒有能力去演，但後來他決定接受這挑戰\n    並且跟Timmy間有著自然的默契，他覺得就算沒人喜歡這片，對他來\n  \
  \  說已經得到非常棒的回饋，就是那夏日回憶，就跟電影中一樣\n    永遠在他心中佔了很大一部份。\n\n\n13、艾米很愛演他跟Timmy第一次在義大利見面的場景\n\
  \    當時他剛到拍攝場地看到Timmy很開心張開手要衝過去抱一下\n    結果Timmy很尷尬說\n    \"額...我鋼琴課還要一段時間，你可能要等我一下\"\
  \n    然後艾米就乖乖等待，Timmy也說第一眼看到艾米時是他張開手臂衝過來。\n    艾米在不同影展講到這段，補充他很習慣Timmy在他身邊\n   \
  \ 但這次卻沒有他陪伴很不習慣(拍戲中沒跟到。\n\n\n我記得的部分大概這些其實還有更多!!!有機會再補XD\n總而言之就是...萬惡宣傳季啊啊啊啊<囧>\n\
  謝謝你們的觀看~\n\n\n--\n明年!!!!期待!!!\n\n\n14、Luca導演有意拍攝續集，時間設定在2020年，那時艾米34歲、Timmy 25歲\n\
  \    電影中的兩人在7年後重逢，並且跟演員實際年紀一樣。\n    但導演並不打算把Elio定位在同性戀，因為Elio還在摸索自己\n    原著作家則表示自己沒打算寫續集。\n\
  \    我自己覺得電影已經停在最美的地方了，其實沒那麼期待續集XD\n\n但有機會再度合作我一定還是會很喜歡...吧!!!!\n\n→  11/09 19:14\n\
  不知道會不會走到拋家棄子這地步XD\n\n推  11/09 20:04\n之\"以我的名字呼喚你\"\n\n爸爸的那段話說完，沒多久又接著Elio在火爐前流淚...\n\
  整個人快不好了(躺\n\n推  11/10 01:25\n片尾曲真的!!!靈魂啊~歌詞太美...明年絕對二刷還要拖人去看!\n\n推  11/10 03:25\n\
  我目前遇到有看過書喜歡原著的，都喜歡電影改的部分\n有看過書但沒那麼喜歡書的，也很愛電影!win-win!!\n\n\n15、原著作家André Aciman在電影裡有客串一角。\n\
  \    就是Elio爸媽那對花俏的夫夫檔友人，矮的那位就是作家本人!\n\n\n16、Luca導演說他剪輯通常都會幾個月以上，這部大概用了一週時間就剪完。\n\
  \n\n\n17、書裡Oliver和Elio相通的陽台，在電影中改成相通的浴室。\n    Luca導演認為浴室相通更為顯示那份親密感，生理或心理的...\n\
  \    有新花絮我都放到這XD\n\n真的是求導演版...4小時談戀愛(///艸///\n\n18、編寫電影中三首曲子的Sufjan Stevens本身是虔誠基督徒\n\
  \    而原著和電影裡頭也三不五時帶到Oliver和Elio家人都是猶太教\n    他們都信仰上帝。\n    所以在Sufjan Stevens的曲子中，你也可以看到很多宗教的用詞。\n\
  \    我個人很喜歡這種衝突!!\n\n謝謝觀看!\n\n19、看到不少人反映畫質不好或者粒子很粗之類\n    沒錯!!Luca導演用35mm的膠片作拍攝，雖然相對於電影預算用膠卷會增加成本\n\
  \    但Luca跟諾蘭導演一樣是膠卷愛好。\n\n20、這篇是艾米接受Vulture採訪，談到一些比較私密的拍攝時心境\n    \n    像是他根本不想拍攝結束、他入戲很深、他愛上導演之類XD\n\
  \n不客氣(//艸//  我懂!!!(握 現在每天期待明年正式上映~\n還有人回耶!開心XD"
