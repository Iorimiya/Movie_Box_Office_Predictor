title: 'Re: [新聞] 《以你的名字呼喚我》原著續集撰寫中'
content: 'Update: Andre Aciman已經完成續集小說：Find Me，今年十月底在美國出版。

  台灣沒意外的話應該要等明年了。


  前導劇情有雷：















  Elio的爸爸已離婚，從佛羅倫斯到羅馬拜訪現在是出師的鋼琴家的兒子。

  這段父子相聚將改變爸爸的生活。

  另一方面，Elio則從羅馬搬至巴黎，並有一段重要的感情糾葛。

  Oliver是在新英格蘭執教的教授，正考慮造訪歐洲。



  然而，電影製作上則因為還沒達到一定的預期成果，目前暫時擱置。

  待大家都沉澱後，再開始討論如何進行。



  --'
