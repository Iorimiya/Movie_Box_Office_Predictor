url: https://www.ptt.cc/bbs/movie/M.1527348499.A.7BC.html
title: '[請益] 以你的名字呼喚我的DVD版本（有雷）'
content: '剛剛去U2看以你的名字呼喚我


  覺得內容好像跟我當初電影院看的不太一樣


  所以才上來問大家DVD是不是有重新剪過


  如果有，那哪裡可以看到戲院版？



  1. Elio拿桃子開心的時候是有音樂的嗎？（ 我記得戲院版的沒有，但剛剛看的有音樂）


  2. 兩個男主角去旅行的時候 Oliver跟女生跳舞，Elio在旁邊看 然後就吐了（畫面有嘔吐物從嘴巴吐出來） 大家記得有這個畫面嗎？ 因為我只記得他對著水池嘔吐


  3. Elio 跟那個女生在頂樓的床戲 女生有露胸部嗎？ 剛剛的版本有露胸 但我對這個畫面也沒印象



  還有其他小地方

  Oliver跟教授討論杏桃的由來那段 我記得整段是沒有音樂的，但剛剛看到的那段的前半部有音樂 而且滿吵的



  兩個人的床戲的前戲吻蠻久的，我記得當初電影院看的時候一下就帶過了啊



  大家對戲院版的有印象嗎？ 想跟大家對一下內容 謝謝


  -----

  Sent from JPTT on my iPhone


  --'
