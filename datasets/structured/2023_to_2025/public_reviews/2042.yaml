url: https://www.ptt.cc/bbs/movie/M.1516724995.A.E8B.html
title: '[討論] 以你的名字呼喚我 攝影跟配樂'
content: '攝影師是一位泰國人


  Sayombhu Mukdeeprom


  幫泰國導演阿比查邦拍了很多片


  雖然對他不熟


  可是從這部片就看得出他卓越的運鏡能力


  長鏡頭抓的完美


  而且又能帶入情緒跟氣氛


  構圖也不會刻板


  希望能夠找他的電影看看




  當然還要提到配樂


  Sufjan Stevens


  本魯沒什麼聽過他的歌


  只知道電台頭


  他在這部電影的配樂


  尤其是鋼琴的部分真的好聽


  歌曲也是


  真的現在的電影很少能達到這個水準





  除了劇情吸引人


  這兩個部分也讓這部變成2017的傑作之一


  非常出色


  希望接下來能有所斬獲


  --

  剛剛查了一下 還真的

  那段夏天真的好棒 可能再也不會出現了

  所以男孩就哭了'
