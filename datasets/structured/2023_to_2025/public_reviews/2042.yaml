title: 'Re: [感動無雷］以你的名字呼喚我'
content: "乾脆藉回文po一下相關訪問和幕後花絮^^||\n\n* MTV 在 TIFF 影展期間的專訪\n  \n\n\n\n* 影迷剪輯近期兩人所有專訪精華片段和暖心互動\n\
  \  \n\n\n\n- \n\n  Armie 的角色在戲裡的超短短褲！\n  他說剛開始超不習慣露腿露這麼大XD\n  但穿了一個夏天之後回家反而覺得自己正常的短褲布料太多了哩\n\
  \n  另外就是導演 Luca 透露，短褲實在太短，所以 Armie 某些角度「曝光」過\n  需要數位後製修掉哩\n\n\n- \n\n  總之就是高大的 Armie(196公分)對於在眾臨演之間\n\
  \  必須在沒有音樂很嗨的跳舞，被大家盯著瞧，覺得很尷尬討厭XD\n\n\n- \n\n  Armie 在宣傳期間，對 Timothee 照顧有加，毫不掩飾對這個後輩的支持和欣賞\n\
  \  比如說在倫敦電影節的記者會上，在 Timmy 出場之前叫大家繼續鼓掌\n  在漢普敦國際電影節上，對於 Timmy 沒有在身邊一起宣傳這件事也忍不住說嘴\n\
  \n  另外 Timmy 今年其實總共會有三部片上映\n  \n  Armie 去年也有三部片上映，兩人基本上既「相捧」也有傳承的意味\n\n\n- \n\n\
  \  女主持人提到粉絲已經在私下\"shipping\"(「送作堆」)看好 Armie 和 Timmy 這一對\n  Armie 也半開玩笑的說他們倆很有潛力，而且兩人的愛\n\
  \ 「已經不可能再(比電影裡面的)更真實了」\n\n\n- \n\n  就是這個訪問 Armie 面對主持人問到，還是有粉絲冀望 Armie 扮演超級英雄\n\
  \  包括很久之前有傳聞的「綠燈俠」「超人」甚至有粉絲繪圖想像\n  Armie 困窘之餘，說出了讓大家都爆笑的答案\n  「我現在完全是賣身狀態！(什麼片都會接)」\n\
  \n\n- \n\n  小說的有聲書是由 Armie 錄製的\n  \n  所以他說，從電影 Oliver 的世界，突然完全進入 Elio 的世界真的很奇妙\n\
  \  然後 Timmy 就在一旁說 \"Yeah, welcome to MY world!\"\n\n\n- \n\n  就對岸記者提到大陸粉絲給 Timmy\
  \ 的綽號「甜茶」\n  還很積極的問他未來有沒有到中國參訪(發展)的計畫\n  除了Timmy很可愛的要大家從今以後都叫他 \"sweet tea\" 之外\n\
  \  這段最「甜」的就是 Armie 小聲的在一旁提醒他 \"say yes...\"\n  當然是要先有禮貌的說「有啊，有機會的話」之類的\n  但是 Timmy\
  \ 老實的說並沒有，還補刀自己沒想過會受到大家在乎關注(真是好孩子~)\n\n\n- \n\n  Timmy 談到整部片他最喜歡的其中一場戲，就是兩人的「初夜」和醞釀\n\
  \  然後他講到兩人肢體接觸，一開始感覺像是「很尷尬的摔角」\n  「因為 Elio 很想要，但是卻還不知道要怎麼做...」\n\n  他描述整場戲的表情和肢體語言超羞澀的，連最後的笑聲都好困窘\
  \ 哈哈~\n\n\n- \n Armie 為電影下的註解\n\n  Timmy 想不出更好的答案，然後笑著對鏡頭重覆 Armie 的三個字;)\n\n\n-\
  \ \n\n  兩人私下最被粉絲津津樂道的應該就是 Timmy 的 IG 限時動態\n  有出現過他側錄 Armie 上廁所的身影\n  這個版本有聲音，所以可以清楚聽到\
  \ Timmy 明顯很開心被逗笑的笑聲\n  然後 Armie 提醒 Timmy 要拍到隔板才不會被誤會XD\n  很喜歡兩人私下互動也這麼輕鬆自然\n\n\n\
  \n\nCheers!\n\n\n--\nSo, here we go\nA face in the crowd,\nJump up and jump down\n\
  Baby, can you see through me?\n\n--Verve, KNOCK ON MY DOOR\n\n--"
