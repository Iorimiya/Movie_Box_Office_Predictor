url: https://www.ptt.cc/bbs/movie/M.1517129357.A.71F.html
title: '[好雷] 以你的名字呼喚我'
content: '看完這部就像跟著Elio 與Oliver 談著一場戀愛。


  其實一開始看到Oliver 對Elio 按摩肩膀時候，


  我就覺得他似乎對他很有意思。


  最可愛地方是Elio 跟Oliver 一起騎腳踏出門，


  Elio 在噴水池質問Oliver 對他的感受時，


  心中跟著Elio緊張，因為不知道對方想法。


  整片最大亮點也是Elio 爸媽，


  很明顯媽媽一直偷偷觀察兒子一舉一動，


  也很鼓勵兒子跟Oliver 一起出遠門，


  雖然故事不是大家想要的結局，


  但就像爸爸說的一樣，擁有一段比友情更加珍貴感情，


  是很珍貴的。隨時隨地都記著去感受。


  我想Elio 在這樣家庭，也不會很刻意去隱藏他的想法，


  光是看到Oliver 來時，也不怕爸媽的想法，


  直接戴上項鍊，然後還很在意說出對Oliver 感受。


  就如Oliver 說的，如果是他爸，早就打到住監獄了。


  謝謝導演以及這整部的唯美畫面以及音樂。





  --'
