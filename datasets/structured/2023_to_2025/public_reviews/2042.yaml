title: '[感動無雷］以你的名字呼喚我'
content: '當初金馬影展開賣前

  就鎖定第一必搶call me by your name

  應當是預告片的運鏡和色調太迷人


  整部片沒有灑狗血的劇情

  但劇情轉換的速度恰到好處

  很多台詞與眼神都點到為止

  讓觀眾有足夠的想像空間

  中後段的推展常常讓人含淚與感動


  迷人的不只是兩個男主角的顏值與互動

  （這個真的很動人）

  義大利的鄉村美景

  配樂與歌曲選的畫龍點睛

  替主角傳達無法言喻的心情與愛戀

  讓成長與失落的過程更加感人


  很期待明年上映時再看ㄧ次

  推薦給喜歡看文藝片的同好鄉民

  也期待這部在明年奧斯卡能大放異彩


  最後不得不提Armie Hammer真的太勾人

  直接被他眼神圈粉

  華納要是夠聰明

  真的應該要簽他當綠燈啊



  PS:每一次的低喚名字真的相當催淚

  --'
