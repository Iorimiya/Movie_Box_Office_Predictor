title: '[討論] 以你的名字呼喚我片中歌曲'
content: '下面推文可能有雷

  -

  昨天看了call me by your name,

  真的好喜歡裡面的音樂，

  搭配慵懶的義大利夏日時光非常合適。

  而在兩位主角的戀情萌芽滋長中，

  有些聽起來是曖昧中帶點徬徨卻又不做作

  想問大家除了主題曲mystery of love 以外還有哪些片中的歌曲

  想要整理成歌單無限循環，謝謝大家

  -----

  Sent from JPTT on my iPhone


  --

  謝謝大大超專業

  可以問一下為什麼原聲帶的歌曲名稱跟一樓說的不太一樣？

  沒有Spotify QQ

  YouTube 有點零碎

  聽完好喜歡

  想買小說來看

  拍拍QQ我聽主題曲也是

  邊聽邊看感覺好享受

  真的超感謝大大！一生平安！

  不只旋律迷人歌詞也是整個往心裡去

  好的晚點來聽謝謝推薦～

  沒有Spotify QQ

  想進去一起跳XD

  鋼琴超好聽的！而且中間那段鋼琴鬥嘴戲碼很可愛XD

  好！

  不複雜的旋律但就很揪心

  還要忍住不哭又好想哭的感覺QQ

  還沒看那部欸在口袋片單中

  超讚！

  原本是聽大娛樂家的XD現在要換歌單了

  感謝！現在連睡著都夢到旋律XD'
