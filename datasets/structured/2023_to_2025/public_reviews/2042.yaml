url: https://www.ptt.cc/bbs/movie/M.1516881642.A.13F.html
title: '[討論] 有人看 以你的名字呼喚我 哭的嗎?'
content: '（雷）


















  一開始我看到別人說後來開虐/BE之類的


  我還想說是不是想太多


  看完結局之後雖然覺得悶悶的 倒是沒哭


  反而回來看steven sufjan的Mystery Of Love的MV以後




  發現神剪輯讓電影裡的暗喻變得好明顯


  第一次看這部MV沒什麼


  可是看過電影以後再看MV就什麼都懂了


  然後就哭了，但哭的感覺又跟當年看斷背山不一樣


  斷背山是因為其中一方死於非命而痛哭


  但這一部是因為明知很自然的不圓滿，本來那個時代同性戀就是不會幸福


  更何況因為劇情處理得太過現實，雖然畫面很唯美，但是結局很真實


  所以就是一種平凡的小遺憾吧


  尤其Mystery of Love是播在快要結局之前


  給人的感覺就更不一樣，歌詞也變得有預言的感覺了


  有人看這部或看ＭＶ也哭的嗎？


  --

  我也是

  還有媽媽開車那段

  Elio很易哭

  但他哭的點大概都有感覺到為什麼會哭

  很喜歡這種感覺

  不喜歡太浮誇的BE

  QQ

  有同感

  突如其來悲傷 不知為何

  那段完全能體會 Elio為何想哭 但我覺得Oliver其實也算有禮貌

  配合歌詞 大概能知 Elio就算跟Marzia在一起 心裡也一輩子忘不了Oliver

  他家人都對他好好 催淚點+1 而且爸爸還善意謊言

  其實爸媽都知道了

  從那裏那種悲傷的氣氛就開始不明蔓延TT'
