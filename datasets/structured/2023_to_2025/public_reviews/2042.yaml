url: https://www.ptt.cc/bbs/movie/M.1520326097.A.A06.html
title: '[  雷] Call Me By Your Name以你的名字呼喚我'
content: '這，戀愛的部分好像大家都寫很多了

  其實我只是想補充一點小地方


  一是這部片的時間點取得微妙

  選在二戰後三十多年時

  主角的父母十之八九是經歷過反猶太主義最強烈的時刻

  就算他們沒有  他們的父母輩也有



  再者是

  主角的父母 加上Oliver  美國人 法國人 猶太人

  其實都是在二戰時跟義大利不同邊的

  這也是為什麼Elio的媽媽會對自己是猶太人這件事情很低調

  但可能也是為什麼Oliver這麼有吸引力

  就像不可出櫃的性向一樣

  做猶太人有時候也是不能出櫃  必須低調的

  有許多猶太人也是在二戰時逃向美國

  因此這個很細微的  同時是這麼幾個國籍的人

  說明了很多這個家族背景的可能性



  有一些小地方很有趣

  其一是Elio的媽媽讀十日談但卻是德文版


  網友更正 是法國的七日談

  七日談也是學十日談的寫法ＸＤ


  (十日談是個瘟疫來時

  義大利的有錢年輕人躲到山間別墅

  每天沒事幹講故事的 故事集ＸＤ

  裡面不是色情就是暴力還有很多都是把猶太人講得不怎麼樣ＸＤＤＤＤ)


  猶太人的身份是這電影不可泯滅的一個基礎



  Elio其實是一個活在許多語言之間的人

  他跟他媽媽或者Marzia經常都是講法文

  跟爸爸有時候講義大利文或英文

  一家三口講一半的英文或義大利文

  跟Oliver講英文


  看不出他最會講什麼

  可能都很會說

  送給Marzia的書  應該十之八九也是法文 （沒看到螢幕所以先猜）

  Marzia最後打招呼先講英文

  最後轉成法文

  這其實都是很有意思的線索

  他們對彼此的親近程度  怎麼思考

  究竟那本詩集寫了什麼  讓Marzia的態度有改變

  這可能也是可以再研究一下



  Elio 雖然也可以說佔盡了語言的便宜

  卻也是一個必須在不同的人之間持續變通的人

  不只是他

  他媽媽在飯桌上也聽到其中一對義大利人說“自從你來以後這裡都不一樣”

  這故事雖然拿著Elio當核心

  家裡看起來經濟也不錯還有家庭幫佣

  但其實也不是表面那麼爽

  義大利其實很多部分都非常排外

  要在這樣的情況下當猶太人  是有一些內在的壓力不可避免的

  如果沒有 就不會說要低調



  故事的整體是個愛情故事

  但是背景有很多讓這個故事變得比較有層次的部分

  導演也對這些都很敏感地指出來了

  鏡頭突然朝向教堂的十字架

  冬天時點燈慶祝光明節

  項鍊



  最後


  愛本來就是一件很奢侈的事情

  思考也是

  所以會覺得Elio過太爽也是很正常的

  但其實電影也沒有想要把他描繪成一個什麼音樂奇才怎樣的

  他就是一個喜歡音樂 會彈吉他 會彈鋼琴的少年

  彈得不錯 會抄譜 （耳力很好） 但也不致於是個超級天才

  只是社交場合父母可以端出來娛樂一下大家而已

  然後雖然說過得爽

  但他家基本上就是家境不錯但不至於到超級強啦

  電影裡面都拍出看起來有夠陳舊的沙發墊跟斑駁的壁紙了

  哪家有錢人會放任自己家別墅壁紙斑駁成這樣ＸＤＤＤ



  另外一個好奇的點

  不知道那個來幫佣的義大利人是北義人還是南義人

  聽不懂義大利文也聽不懂口音

  但在義大利北與南也是有一些差異跟彼此歧視的狀態啊


  --'
