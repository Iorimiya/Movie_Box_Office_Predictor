url: https://www.ptt.cc/bbs/movie/M.1509877357.A.72D.html
title: '[普好雷] 以你的名字呼喚我 Call me by your nam'
content: '猶豫了好久不知道到底要給好雷還是普雷

  最後還是給中間值好了


  期待了超久的Call me by your name

  金馬搶票很幸運的撿到了不錯的位置

  感謝那位搶了票卻沒去付款的朋友XD


  如前幾篇所說

  配樂和畫面真的都非常的棒

  調性輕鬆的鋼琴聲配上那簡樸的鄉村美景

  再搭上兩雙穿著小短褲的長腿(咦

  坐在位置上好像都可以聞到清涼微風帶來的樹林味

  (讓我想到了宮崎駿的龍貓)


  兩位男主角的個性與互動都可愛到不行

  尤其是艾里歐的各種小舉動

  可以看得出他的稚氣和不成熟

  但也許就是這份不成熟讓他和奧利佛的感情

  僅能留在這個夏天這個小鎮


  艾里歐有著近乎完美的生活

  無條件支持自己的父母

  絕佳的音樂天賦

  以及關心自己的好友

  他就像是個溫室裡的花朵

  而奧利佛這個突兀的出現擾徹底動了他的生活

  或許說他們並沒有真的愛上對方

  比較像是一時綻放的情感

  只是彼此生命中重要的過客


  結尾艾里歐凝視著火爐好長一段時間

  從無言、落淚再到一抹淺淺的笑

  最後還是轉頭回應了媽媽那聲”艾里歐“

  或許call me by your name已然成為了心底的回憶


  以上都是我比較喜歡的部分

  會想要給普雷主要是因為劇情有點冗長

  甚至有些地方交代的太過隱晦

  我幾乎沒有察覺兩人是何時在意起對方的

  在告白之前根本沒有甚麼互動

  只有一些看似友好生疏的交流


  而兩人對女性的處理方式更是讓人無言

  尤其艾里歐根本利用瑪莉莎宣洩自己的無處發洩的性慾

  於決裂後

  還是在這段感情中受傷的女方主動釋出善意

  男方卻一句道歉都沒有

  當下心裡只有滿滿的what the fuck


  總而言之

  我喜歡這部片裡的配樂、畫面、主線以及演員

  但節奏和一些角色塑造有一些小缺點

  明年會考慮二刷

  希望能有不一樣的體驗～





  -----

  Sent from JPTT on my HTC_A9u.


  --'
