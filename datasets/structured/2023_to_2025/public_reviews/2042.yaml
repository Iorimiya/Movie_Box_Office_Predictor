title: '[好雷] 以你的名字呼喚我'
content: "Call Me by Your Name (2017) 以你的名字呼喚我\n\n　　 \n\n　　 \n\n　　───────────────────────────────────\n\
  \n\n　\n\n　　\n\n\n　　───────────────────────────────────\n\n\n　\n\n\n\n每年盛夏都會在莊園招待研究生的教授夫妻檔，以及他們才華洋溢的十七歲兒子艾里歐，\n\
  1983年迎來一頭金髮、身形高大、長相俊逸的奧利佛。\n\n他學富五車的幽雅談吐、活力充沛的氣宇軒昂、丰神俊朗的英姿風采，讓情竇初開又多愁\n善感的少年深深為之著迷。然而奧利佛卻因身份、性別等種種擔憂，禁錮了彼此萌生的愛\n\
  意。幾次你退我進的試探後，兩人終在炎炎夏日的小池塘邊一吻定情，也展開如火如熾的\n戀情。\n\n然而這段秘戀卻因奧利佛的歸期畫下句點；再次聽到奧利佛的消息，是冬日裡電話那頭奧\n\
  利佛告知來年的婚期，艾里歐看著壁爐裡熊熊烈焰，既是笑了也哭了，沒想到這年冬天和\n夏季一樣教人坐立難安。\n\n\n\n\n\n\n如同先前介紹過的許多夏日情懷電影一樣，這部《以你的名字呼喚我》從宣布開拍時，我\n\
  便在「同影板臉書粉絲團」持續關注著它拍攝到完成的訊息。終於在2017年底開始參展演\n播，2018年初開始在眾家影評一致稱讚期盼中擄獲男女影迷的心。\n\n\n\
  故事是從同名原著小說裡，篩選精揀出前三分之二的精華部份，並在2018年獲得奧斯卡最\n佳改編劇本，這讓《墨利斯的情人》編導詹姆士艾佛利，再次展現了自已不凡而深厚的劇\n\
  作功力。電影裡台詞和對白幾乎是從原著小說裡一字不刪搬上螢幕，可以說讓書迷大飽眼\n福的一部優質改編電影。\n\n\n導演盧卡格達戈尼諾（Luca Guadagnino）其實很擅長這種在閒逸環境下探討愛情的文藝\n\
  片，我在HBO觀賞過他上部執導的《池畔謎情 A Bigger Splash》，也是一部在秀麗靜謐\n的海邊豪宅裡，四個男女的交織情慾。可以說，在不特意強調好山好水的鏡頭裡，導演悄\n\
  悄地把場景裡的陽光引進了觀眾的心裡，看完本片，我真心一股莫大的衝動，想抓起行李\n飛往某個充滿陽光的不知名鄉間，狠狠曬他幾天陽光再說。\n\n\n導演處理的畫面和搭配的樂曲，絕對是為本片加分的點；然而，倘若沒有俊帥美形的演員\n\
  ，本片絕對不可能讓影迷書痴們如此意猶未盡的。\n\n\n飾演十七歲少年的男主角演員提摩西夏勒梅（Timothee Chalamet）因為本片而成為新一\n代嫩男演員中的新男神。就算對手是早已風靡影壇的金髮帥哥艾米漢默（Armie\
  \ Hammer）\n，兩種不同類型的帥哥嫩弟搭配起來，依舊是相得益彰，可說是毫無違合感的年度最佳銀\n幕情侶檔。另外，飾演父母的配角，恰到好處地詮釋了教授夫妻的角色，既是真摯熱切的\n\
  學者、也是善察人心的慈愛父母。\n\n\n總歸一句，從劇本故事、畫面鏡頭、配樂運用，到演員技巧等，真真是無一不精緻的好片\n，要不是這屆的奧斯卡遇上了另一個戲精，被對岸網民取名「甜茶」的提摩西，完全可能\n\
  拿下影帝獎座。\n\n\n因為片子本身就夠好，所以不需我再多追捧，以下將會重點式寫出本片劇情概要（補註少\n些和原著差異的內容），接著我會分享一些個人觀影後心得。花痴演員過後，新增一部份\n\
  文末雜記和各位分享。\n\n\n\n\n\n\n1.片頭：古代美男子雕像照片，接著慢慢出現錄音帶、鉛筆筒、樸克牌、打字機、幻燈片\n、六芒星、古代錢幣、銀行存款單、打火機、香煙、隨身鐵製酒壺、信件、稿件、印有\n\
  1983/12月字樣的旅行箱標籤\n\n2.艾里歐和長髮妹子知道家中有客要來，淘氣的少年故意把衣服從櫃裡翻出，任意撥散床\n上，想等這個佔據房間的異客來時，再在他面前故意整頓，以示主權。所以口裡對這客人\n\
  起了個「篡位者」外號。\n\n3.父母和少年，平時對話用法語、英語兼之義語，只有非不得已才用德語（在電影中後段\n只到一本德文的詩集，母親還嘮叨了一下女僕：因為他們是猶太人）\n\
  \n4.到樓下，艾里歐明知故問向奧利佛問：「幫忙搬行李到你的房間？」轉頭，又向母親詢\n問：「我的房間？」來到樓上，故意又加上一句：「我的房間現在是你的房間了」\n\
  \n5.女僕響起晚餐鈴時，艾里歐刻意將書砸到地上喚醒奧利佛；顯然奧利佛並不在意這些貌\n似有點無禮的小動作。\n\n---\n\n6.第一個早餐，奧利佛無法順利敲破水煮蛋。享用過蛋的美味後，教授要他再吃一顆，奧\n\
  利佛卻自述說「我很了解自已，如果再吃二個就會忍不住接二連三一直吃下去。」艾里歐\n第一次發現這個男人十分具有自制力，同時也注意到奧利佛頸上懸掛的六芒星項鍊。\n\
  \n7.鎮上，奧利佛驚訝問艾里歐：「你們也會來度聖誕節？我以為你們是猶太人。」（猶太\n人過的是光明節）艾里歐回答：「我們也是美國人、義大利人和法國人。而且你大概是除\n\
  了我家之外，這小鎮上唯一的猶太人了。」\n\n8.閒聊幾句，奧利佛第一次丟下艾里歐。\n\n9.書房裡，女教授端來杏桃果汁，男教授趁機用杏桃的起源來考考奧利佛，顯然奧利佛高\n\
  分過關，此時也顯露出男教授的動作舉止有些陰柔。\n\n---\n\n10.事隔幾日，奧利佛已在小鎮上混熟了，領著艾里歐進入一間連艾里歐都不知道酒吧，\n艾里歐倚在酒吧枱上微笑著望著奧利佛在熟男群裡如魚得水、神采奕奕地玩起樸克牌，少\n\
  年見到了奧利佛最自信而迷人的樣貌。\n\n11.打排球：奧利佛的球技連跟艾里歐同年齡的小夥伴們都很欣賞。這個高頭大馬的金髮\n美國人顯然征服了每個人的心。趁著休息片刻，奧利佛第一次對艾里歐身體接觸（也是試\n\
  探），奧利佛告訴艾里區，他的肌肉太緊繃了。\n\n面對周遭小夥伴對奧利佛高度讚賞，艾里歐內心有些吃味。晚餐時，艾里歐對眾人提出：\n「會不會覺得奧利佛每次都那句『Later』有點失禮啊？」。\n\
  \n這晚阿姨一家人來訪，要艾里歐彈奏鋼琴，雖然艾里歐一臉老不情願，仍舊保持禮貌當起\n娛樂眾人的乖小孩，當晚艾里歐輾轉難眠。\n\n12.過幾日午後，艾里歐本來要打手槍，奧利佛闖了進來約他去游泳。鏡頭拍攝到幾件不\n\
  同的泳褲（代表時間過去，他們一起去游泳數次了。原著小說提及，艾里歐的泳褲顏色是\n隨當日心情而刻意挑選的，但電影中並未強調這點。 ）\n\n13.艾里歐忍不住趁奧利佛游泳時偷瞄他。奧利佛浮出水面：「你在想什麼？」艾里歐嘴\n\
  角上揚了一下，回答：「我不打算告訴你」（也許心想：我在想你…）\n\n---\n\n14.艾里歐在樹下以吉他彈了一小段巴哈樂曲，奧利佛請他再彈一次，艾里歐轉身進屋內\n\
  改用鋼琴演奏，卻是不同版本的巴哈，小小舉動略微激怒了奧利佛，得以成功逗弄奧利佛\n，艾里歐感到有些得意。\n\n15.回到房裡，艾里歐寫下：「我那時以為他不喜歡巴哈，所以說話的語氣太衝了。」（\n\
  I was too HARSH when I told him I thought he hated Bach）\n\n16.風吹開另一頁筆記，卻是幾日前的筆跡，「我覺得他討厭我。」（I\
  \ thought he\ndidn't like ME.）\n\n---\n\n17.奧利佛對自已的論文不甚滿意，在池邊問起艾里歐的意見（這兩人已經常態性結伴到\n\
  泳池曬太陽），艾里歐第一次聽見奧利佛用「kind」這個字眼。\n\n18.社區舞會上，艾里歐看著奧利佛和捲髮辣妹熱情纏舞，身邊小夥伴們歎道：「如果我\n是他就好了。」另個妹子表示贊同：「誰又不想成為她呢？」。\n\
  \n他們的對話正中艾里歐的心聲，這是第一次見到奧利佛與女孩過從親密，從場外望進場內\n，一種局外人的心情，禁不住多抽了幾口煙。\n\n19.受到刺激的當夜，艾里歐第一次約了長髮妹子夜泳，這妹子其實一直都對艾里歐很有\n\
  好感，是故常出現艾里歐的身邊，對於妹子的不停放電，艾里歐過去只是不當一回事。沒\n想到這晚妹子和艾里歐直達三壘，差點達陣破處。\n\n20.隔日早餐桌上，奧利佛已能順利自已敲破蛋殼，艾里歐趁機說了昨晚的風流韻事，說\n\
  自已差點上了那個妹子。奧利佛不動聲色地說：「試過就比沒試好。」艾里歐仍不服氣回\n道：「只要我能鼓起勇氣摸下去，她會答應我的。」\n\n21.一旁教授說小湖裡撈到古物，邀請兩人一起前往。出發前舞會上的捲髮妹子來找，艾\n\
  里歐故作大方地把妹子介紹給奧利佛，沒想到奧利佛表面上熱情回應，私下嚴肅地警告艾\n里歐：「別假惺惺地故作好客！」\n\n22.艾里歐這才知道了奧利佛對那捲髮妹子其實沒有心思，心裡興奮了起來，所以前往湖\n\
  邊的路上禁不住興奮偷笑，趁奧利佛捧著雕像的手時，艾里歐主動向奧利佛提出談和。\n\n23.跟奧利佛談和後，心情愉快、小分身也硬了，回到家一把抓起單車衝向和長髮妹子約\n\
  好的地點，卻不見妹子人影，艾里歐只得失望地抓一抓跨下後。\n\n---\n\n24.接連幾日，奧利佛開始時常不見人影，見不到他，艾里歐只能在房間抓起一件奧利佛\n\
  的紅色短褲套在頭上，想像奧利佛的味道。\n\n25.炎炎夏日迎來一場大雨，女教授拿了本德語版的《七日談》，講了個公主和騎士的愛\n情故事。騎士愛上公主，公主卻沒意識到自已也愛上了騎士。但騎士不願破壞兩人之間日\n\
  漸升溫的友誼，最後只得鼓起勇氣問了公主「做人，應該把內心話一吐為快比較好，還是\n帶進棺材裡什麼都不說呢？」(Is it better to speak or\
  \ to die?)\n\n艾里歐對父母說「我永遠無法提起勇氣問出那樣的話。」教授已經察覺到這多愁善感的兒\n子心裡有針、如鯁在喉。\n\n26.事隔多日，泳池邊艾里歐向奧利佛說起這事。奧利佛皺著眉聽完，默默出神，但轉瞬\n\
  間又恢復神情，對於少年的情意和暗示，只能打了個哈哈混過。\n\n---\n\n27.艾里歐陪奧利佛到鎮上拿稿件，繞著紀念一戰的雕像，艾里歐終於說出自已想說的「\n\
  那件事」，而且以不同語氣連說了四次：「因為我想要你知道。」('cause I wanted\nyou to know.)\n\n面對艾里歐一再進逼地告白，奧利佛旋即制止了艾里歐，同時也制止了自已。\n\
  \n28.艾里歐帶奧利佛來到小水塘，稱說這是自已秘密基地（從沒帶人來過）。艾里歐再度\n進逼，幾乎將自已推上奧利佛胸前。仰躺草地上享受炎夏裡的襲襲和風，兩人的唇終於緊\n\
  緊相接，只是，吻技略顯生澀的艾里歐第二次想再強吻，卻被奧利佛強烈的道德感再次劃\n出楚河漢界。\n\n---\n\n29.教授宴客的午餐會上，艾里歐突然噴鼻血（電影版像是年輕人慾火憋太久了；原著則\n\
  是因為兩人四腳在桌下亂絞，以致於艾里歐狂噴鼻血）。奧利佛進屋照看艾里歐，幫他揉\n腳，兩人談起那個六芒星項鍊。奧利佛最後吻了一下艾里歐的腳背。\n\n30.隔幾日，艾里歐和小夥伴們在池邊游泳時，頸上已重新掛上那條本來覺得很豔俗的六\n\
  芒角項鍊。\n\n31.母親向艾里歐提到，奧利佛剛剛親口對我說，對你滿有好感的，同時她也注意到了艾\n里歐頸上的項鍊。（原著則是由鄰居小女孩負責姻緣牽線）\n\n\
  然而，接連幾日，艾里歐再見不到奧利佛蹤影，背景音樂響起：「我已好久不見你人影…\n」\n\n32.艾里歐坐等奧利佛到深夜，故意將兩人房間的門半掩著，沒想到奧利佛上完廁所便將\n\
  房間帶上離去，艾里歐躺在床上轉身一句「叛徒」（traitor），默默把燈關了。\n\n---\n\n33.等不到奧利佛出現，艾里歐開始找長髮妹子約會。小男孩這晚在河邊破處變大人了。\n\
  \n34.長髮妹子再美也比不上奧利佛深邃撩人的雙眼，艾里歐忍不住寫了紙條，要求跟奧利\n佛「談一談」，次日兩人在樓梯間相遇，本想多聊，但教授突然出現，三人對話中我們得\n\
  知原來奧利佛這陣子一直打樸克牌至夜深方歸（為了躲避艾里歐）。\n\n35.奧利佛和教授正整理一組肌肉線條明顯的雕像幻燈片，教授的用字講得奧利佛心癢難\n耐，另一頭艾里歐回到房間見到奧利佛的回覆字條，想像著奧利佛的語氣在心裡默念了兩\n\
  次：「成熟點兒，我們午夜見！」\n\n---\n\n36.天下有情人皆難以消磨約會前的等待時光，每一秒都像一年那麼久。這晚教授的一對\n男男情侶朋友來訪，奧利佛自然是找了藉口外出，而艾里歐則是約了長髮妹子到閣樓廝混\n\
  ，也消了消慾火。\n\n37.做了一晚乖小孩後，終於等到半夜，眼見一襲深綠長衫的奧利佛雙手撐在陽台欄杆，\n轉頭見到艾里歐慢慢從房裡走出來，伸手觸了一下艾里歐的手背，「很高興你出現了。」\n\
  \n38.回到房裡準備翻雲覆雨，艾里歐忍不住興奮，開心得像小孩尋到了寶，低頭在奧利佛\n胸前不停磨蹭著，艾里歐伸手一攔，搭上了奧利佛的頸間，「我能親你嗎？」「你不會把\n\
  鼻血噴得我滿身吧？」\n\n39.月光下四條毛毛腿交錯，大汗淋漓後，奧利佛枕邊細語那句：「用你的名字呼喚我。\n」\n\n40.兩人纏綿一夜，天色漸漸轉為魚肚白。艾里歐轉頭看了一眼奧利佛，一股莫名的憂慮\n\
  浮在臉上，奧利佛抓到艾里歐神情有異，不自然地勉強一笑。\n\n\n41.艾里歐愁眉不展許是想到「奧利佛總有一天要離開」，所以提及地上那件襯衫是他們\n第一天見面的同一件襯衫；而奧利佛卻誤以為艾里歐感到後悔，所以晨泳後開口問道：「\n\
  你會用昨晚的事威脅我嗎？」（原著裡是艾里歐怕自已就此上癮，故意想拉開距離讓自已\n冷靜。）\n\n42.回到房間，奧利佛瞟一眼激情過後的床舖，把艾里歐叫了過來，扒了他的短褲後，用\n\
  嘴玩了一下樂器後關門（撩弟高手啊……讓你硬著的時候只想到我。）\n\n---\n\n43.艾里歐來到鎮上找奧利佛，兩人把話說了個明白，彼此都是對對方極有好感的。\n\
  \n44.奧利佛在閣樓上發現剛用新鮮蜜桃充當飛機杯的艾里歐。艾里歐意識到奧利佛即將離\n開的事實而嚎啕大哭。（原著是奧利佛吃了艾里歐擼管後的蜜桃，艾里歐覺得奧利佛是真\n\
  心喜歡自已的全部而感動大哭）。\n\n月光下，艾里歐說「我們浪費了好多時間，為什麼你都不告訴我？」，\n奧利佛回道：「我說了，我暗示了。」\n「什麼時候？」\n\
  「還記得打排球那天，我第一次碰你的肩頭，你卻表現得像我在侵犯你一樣，那時候開始\n我就決定要跟你保持距離。」\n\n45.翌晨，艾里歐的床邊掛著那件兩人初次見面的襯衫。奧利佛用艾里歐的名義送給奧利\n\
  佛（名字互換的哏）\n\n---\n\n46.長髮妹子來找，艾里歐明顯冷淡應對，妹子難過得轉頭走人。\n\n47.教授們決定讓艾里歐陪奧利佛一起去鄰近城市度個假玩一玩，也許有意無意間，教授\n\
  們已經察覺到兒子的秘密戀情，只是伸手握了握彼此的手。\n\n---\n\n48.身處風光明媚的異地小鎮，月光下、大街邊，猶如蜜月新婚的一對儷影，兩人終能開\n\
  懷想唱就唱、想跳就跳、想吻就吻。沒想到，月光如水銀流瀉一地的石板路邊，當艾里歐\n看到奧利佛與未知名女子親密熱舞時，被摒除成外人的疏離感再度湧上心頭，加之年少不\n\
  勝酒力，使得艾里歐一陣狂嘔。\n\n49.最後一夜，奧利佛裸身立於窗口，回首一望床上熟睡的少年，心知這情路已到盡頭。\n\n隔日兩人不情願邁到火車月台上，終於還是來到這一刻。送君千里終須一別，即使再難放\n\
  手，也只能嘴一抿、頭一點，盯著坐在車窗玻璃另一端的奧利佛，目送火車緩緩駛離。\n\n50.初戀後的少年在母親來接的車上大哭，再笨的父母也早該知道發生了什麼事。\n\
  \n51.艾里歐顯然還在情傷，晚餐也沒吃了。父親坐在沙發上向艾里歐促膝一談，他語氣平\n靜地說：「你們之間的情誼是很特別的……所以，感受你現在感受到的心情吧，因為未來\n\
  你的心會隨著年齡變得沈靜、不起漣漪與波淘……我也曾經有過類似於你的經驗，但臨門\n一腳我退縮了，也正好被事阻擾了。……人生於世，我們能擁有的只有一輩子；當你意會\n\
  到這個道理時，心已老去，也沒人想再靠近你的肉體和靈魂了。所以現在好好感受全部的\n喜怒哀樂。」（原文請見下段影評）\n\n---\n\n52.冬日裡，一家三口再次回到小鎮過光明節。艾里歐接到奧利佛來電，提及自已即將結\n\
  婚。最後一次，只能在電話裡用自已名字呼喚著對方：「Elio」。\n\n看著壁爐燃燒的熊熊柴火，火光烘熱了臉龐、映紅了眼眶，艾里歐不爭氣的眼珠如串落下\n。這年的冬季和夏季一樣難以度過。（原著是奧利佛曾再回到小鎮，並幫忙挑來年的訪客\n\
  ；另外，多年後兩人曾多次重逢，奧利佛已育有子女…等，但電影皆節略刪去了。）\n\n\n\n\n\n\n\n\n\n\n看完本片第一遍時，我一直在想這個問題：「為什麼要使用『互喚名字』這個哏呢？」\n\
  \n\n關於「名字」的力量，我最先回想到之前介紹過的那部《死後的關懷》，雖然是部夾帶男\n男暧味的靈異片，不過當男主角對著小鮮肉男鬼的嘴裡，輕輕說出自已的名字時，小鮮肉\n\
  男鬼瞬間感受到名字的力量，接著精神為之一振，露出宛如被口爆後心滿意足的蕩漾神情\n。\n\n\n不曉得各位有沒有這種經驗，就是在某個場景環境裡看到、瞄到、掃到某個人，例如電視\n\
  廣告裡看到的演員、走廊轉角遇到的隔壁班同學、或者對面公司走出來一起搭電梯下樓的\n西裝男、又或是每每在超商裡就是能湊巧一起等咖啡煮好的型男，那個總是不期而遇的人\n\
  ，渾身散發著一種引起自已莫名注意的魅力。\n\n\n其實也說不上是很喜歡，但這種「如果能常遇到、多看一眼也挺不錯」的心情，一旦發現\n自已每天開始被這種心情拘役著，我接下來的動作，是驅使自已趕快找到那個人名字，不\n\
  然就是自已替他取了個代號，好像有了一個名字或代號，就可以把對方牢牢烙在自已心底\n了，接下來的活兒，說是迷戀也好、痴戀也罷。總之，那個人長相和名字已經牢不可分，\n\
  短期內再忘不掉了。\n\n\n舉兩個例子是想說，看完本片，我突然覺得「名字」這件事，是極為重要的一件事。它不\n單單是方便別人稱呼你、呼喚你，很多時候它是具有魔力的咒語，我想到不知從哪看到的\n\
  兩句話：「也許世界上效力最久的咒語就是你的名字吧！」、「這個世界最短的咒語，就\n是你的名字！」\n\n\n思念一個人的時候，你難道不會想像對方的畫面，唇齒間不經意默念出對方的名字？又如\n\
  同憎恨一個人的時候，恨不得咒罵幹譙，把對方名字鏤刻在空氣中，又讓某個負能量神靈\n代為懲戒對方。\n\n\n有了一個可以代替對方實體的詞語，將各種情緒加諸於這個代號，即便人不在眼前，也能\n\
  藉著名字的呼喚而愛他、恨他。\n\n\n愛一個人而不自知地喊出他的名字，那種夾帶溫暖的呼吸、和煦如春的聲線，好像每喊一\n遍「某某某」，就算不加上「我愛你」，那一句句叫喚聲，也已充滿了無限愛意。恨一個\n\
  人的情況亦然，把髒話和死咒都灌進了那個人的名字中，就算沒幹譙個祖宗八代，只是咬\n牙恨道「某某某！」，那人名字此時此刻已經和世上最骯髒的詞彙劃上了等號。\n\n\
  \n還記得小時候和同學嬉鬧，也有過那種把某個討厭同學的名字當作髒話來罵人的幼稚對話\n，現在偶爾還能在網路上看到，將某個政治人物名字視為洪水猛獸或骯髒下流的字眼進行\n\
  訕笑。\n\n\n就連向自已信仰的神靈祈禱時，無論是天父、上帝，還是佛祖、觀音、阿拉、真主，都需\n要一個名字，讓我們把無力做到的盼望寄託在對神祇名諱的聲聲呼喚中。民俗術士在招魂\n\
  時，也少不了要家屬親人跪在出事地點，一聲又一聲地叫喊故去親友的名字，「某某某，\n回來啊！媽媽在叫祢，祢有沒有聽到？」\n\n\n所以我發現了一件事，「名字」不但指稱著一個人生前死後的肉體和靈魂，叫喚名字的同\n\
  時，也摻雜了各種七情六慾，「名字」是個有力量的代號，也是最有意義和最沒意義的一\n組字詞。當它對自已產生了意義，就是一句有力量的咒語；當它不對自已有任何意義，就\n\
  是一句在歷史課本上想要死背卻背不起來的人名。\n\n\n我沒有暗示什麼姓名學的重要，也無意替任何擅於改名的老師代言，只是覺得，當某個名\n字對我們產生意義時，它就是具有力量的！\n\
  \n\n不管什麼語言，冗長如某個非洲族裔的全名、簡短如一個單音「喂」作為綽號，就連可愛\n的柴犬狗狗，當主人喚一聲牠的名字，牠也會樂得搖著尾巴向你狂奔，即便牠壓根兒不知\n\
  道「自已有名字」這一回事，也不知道「名字」到底是什麼東西。\n\n\n\n\n\n\n\n看完本片後第二件和名字相關的念頭，就是經典愛情片《鐵達尼號》的最後結局時，船難\n\
  生還的蘿絲被救難人員詢問：「女士，請問妳的貴姓大名？」，她想也不想就回道：「道\n森，我叫蘿絲道森。」\n\n\n事實上她不姓道森，只是歷經過和摯愛傑克在浮冰海面上的生離死別後，她已自認是道森\n\
  家的人、就算死也是道森家的魂。\n\n\n本片設定的1983年代，其實愛滋病正在媒體中被肆意抹黑、加油添醋地宣傳著，這段期間\n其實連科學家都還無法在「愛滋疫情的致病原究竟是何者」上取得同識，對病情未明、懵\n\
  懂摸索狀況下，更別提當時社會對於常常被相提並論「同性戀」，會有多麼戒慎恐懼了。\n\n\n所以當男主角奧利佛和艾里歐激情過後的枕邊情話，奧利佛提出「用你名字呼喚我，我也\n\
  用我的名字呼喚你」時，我想除了「你中有我，我中有你」的一般性影評看法之外，我認\n為：「把自已交給對方」和「為了隱藏這份情感」的兩種目的，應該是這個「互換名字」\n\
  橋段的潛台詞作用。\n\n\n其一，把自已交給對方，就像我上面提到的蘿絲，一種把自已生命和對方生命融為一體的\n想法，所以希望當我對著你喊著自已名字，你就是我，我也就是你。\n\
  \n\n我們的生命在此時此刻不是交會交錯，而是合而為一，我們享用著同一個代號、感受著同\n一段時光流轉、傾聽著相同頻率的心跳聲、呼吸著同一片空氣，愛是同享互通的，你的氣\n\
  息是我的溫度，我的呼吸是你的氧氣。\n\n\n其二，當我對著你叫自已的名字，即便是被外人聽見了，也不會知曉我自喊姓名的秘密，\n所以電話裡、隔壁房間裡這樣喊著、喚著都是安全無虞的，在那個人人對於同性戀避之不\n\
  及的年代裡，我不必為了喊出你的名字而擔心受怕，內化得夠了、叫得習慣了，就連夢囈\n也是安全的。\n\n\n所以我認為「以你的名字呼喚我」不只是枕邊情話的哏，背後更夾帶了你濃我濃的含意，\n\
  還有為了符合時空背景所創造出來的安全秘語。\n\n\n這樣的哏，不僅是書名片名，也是片中閱覽豐富、飽讀詩書的兩位主角深深體悟到，即使\n用盡各種語言和詞彙，最後鑽人心肺、刻骨銘心的，卻是最簡單、也是最有力量的一組字\n\
  ：我(你)的名字。\n\n\n\n\n\n\n\n這個小標語我本來待留到文章最後的文末雜記才想要用，但行文至此，不免還是用上了。\n因著最近生活上遇到了一些極大的變化，我憶起這兩句歌詞，實為感觸頗深。\n\
  \n\n就像我們都看過幾百遍、也知道或曾期盼過的某個夏日戀曲故事一樣，這部電影把原著中\n最精華的部份詮釋成一段難忘的初戀，其實是很恰如其分的。它將愛情最初的那份互猜、\n\
  互嫉，慢慢進展到相知、相守，到最後，與其說是因為距離而分開，不如說是因為在意他\n人眼光而結束。\n\n\n否則，在那個可以通書信、打電話的年代，科技也不是太過於落後的三十年前，難道彼此\n\
  真心相愛過一場的戀人，真敵不過茫茫大西洋的海水嗎？為何最後仍舊需要夢醒、回到現\n實？\n\n\n我想奧利佛和艾里歐在那次被我戲稱是小蜜月的旅行過後，彼此都感受到「我們大概真的\n\
  沒辦法走到一起了」，這樣的心情隨著旅行的過程越是清楚浮現心頭。\n\n\n艾里歐是在街邊看著奧利佛和女人共舞時，一時百感交集所以狂嘔；奧利佛則是裸身立於\n窗邊、回頭看著胸口靜靜起伏的男孩，皎亮的月光卻只是把理智照得更近、更明確堅定而\n\
  已。\n\n\n所以結局前，艾里歐父親的那一整段對白才會成為全片的文眼，本片改編得最好之處，就\n是把幾段重要的劇情對白，完全按照原著小說、原封不動搬出來。就如這段文眼，用字雖\n\
  然不艱深、感情卻是最真摯的一段對白：\n\n\nBut remember, our hearts and our bodies are given to us\
  \ only once. Most of us\ncan't help but live as though we've got two lives to live,\
  \ one is the mockup,\nthe other the finished version, and then there are all those\
  \ versions in\nbetween. But there's only one, and before you know it, your heart\
  \ is worn\nout, and, as for your body, there comes a point when no one looks at\
  \ it, much\nless wants to come near it. Right now there's sorrow. I don't envy the\
  \ pain.\nBut I envy you the pain.\n\n\n一整段其實就是總歸四個字：「」\n\n\n真心付出給你現在正在愛的人；感受你為了不能愛而發痛的每一寸肌膚；中文說「掏心掏\n\
  肺」「肝腸寸斷」。無論是愛的當下、或愛過之後，我曾真心驚訝著，人體器官真的會反\n應腦中那些化學反應，在胸口（真的大約在心臟附近）有一種好像在撞、在掏、在絞的悸\n\
  慟，相信曾經用心愛過、痛過的人會知道我在講什麼。\n\n\n總之，人生真的還滿短暫的，用八十個圈圈代表人生的每一年，轉眼之間你已經填滿了幾\n個圈圈？還留下多少空白的圈圈？如果所剩不多，再扣掉你身體無法有所反應的最後數年\n\
  ，你能愛、能痛的時間還有多少？\n\n\n還在為了上一個人而不敢緊握下一個人的手嗎？也許我們都應該估計一下，那些內心劇場\n裡一直執著重覆上演的戲碼是否該落幕了？因為生命真的很快很短暫，如果罣礙著過去，\n\
  就會影響現在；如果不感受當下，就會忽略愛你的人。愛你所愛，痛你所痛，才是最重要\n的事。\n\n\n\n\n\n\n我在不知第二刷、還是第三刷這部電影時，寫了一段對於奧利佛這個角色的描述：「努力\n\
  偽裝成外向而多情的異性戀男子，但卻在沒人見到的地方，顯露出自已本性，那唯有艾里\n歐能看到的憂鬱神情，其實也是艾里歐自已的心情。又因為對於小鮮肉艾里歐的愛是動軏\n\
  得咎、患得患失的，所以第一夜激情過後，讓奧利佛產生對這場愛情舉棋不定的猜疑。」\n\n\n對於艾里歐，我則寫著：「真正狠狠地愛過一次，才知道忘不掉一個人是什麼滋味，每喊\n\
  一次他的名字就像念過一遍咒語，鎖住的是自已正點燃的烈火。那種坐立難安、一直想見\n對方的衝動，是如何隱隱作痛、想要衝破胸口的撞著。艾里歐發現自已如此在意對方的一\n\
  舉一動、每個眼神、從他嘴吐出的一字一句。朝思暮想、無法自制，這大概就是所謂初戀\n（愛過）。」\n\n\n本片的某些過場手法很像老派愛情電影，例如激情時，把鏡頭緩緩移到一旁花瓶，然後再\n\
  回到床邊才發現演員已經被射了一身都是。又或者兩個主角在一戰紀念碑旁，運鏡和光影\n的流轉，這樣拍攝手法是十足十的老好萊塢手法，我沒說這樣不好，畢竟在電影界已經行\n\
  之多年，大家也多能接受這樣使電影看起來順暢的換鏡方式。\n\n\n換句話說，我發現本片沒有採用太多新穎的技法和拍攝角度（事實上也不需要），也沒有\n刻意加入很奇怪的拍攝視角或演員走場（在某些新銳導演的鏡頭下會看得到）。正因如此\n\
  ，老派的愛情電影才更可以把故事講得很清楚、讓角色變得很鮮明。\n\n\n導演也沒有為了展現大場面故意拍攝的景、或故意置入那些顯示莊園有多美的畫面，更多\n時候只是把陽光照得發燙的鄉村路面、池邊和樹下，忠實地佈置在主角四周，只是這樣靜\n\
  靜地陪襯，反而讓人更嚮往愛情故事之外的閒逸場景。好像在那個1983年的北義大利莊園\n裡，我也跟著主角活在陽光下，愛在沒人看見的黑夜裡。\n\n\n來到片尾的別離，沒想到月台上，兩個人竟是一句經典的分手對白也無，只是深深擁抱後\n\
  ，彼此抿了抿嘴、點了點頭後，眼見彼此的距離越來越遠。\n\n\n大概悲觀個性使然，我在今年年頭欣賞本片和到了年尾為撰本文而重新再看，兩種不同的\n慨然，卻指向同一種心得結論，「也許一開始就不要期待世上有『永遠』這種事，這樣會\n\
  過得比較開心和踏實。」\n\n\n我不是說要你看破了世上沒有永遠的真相，所以鼓吹你不必去找真愛了。我是說也許我們\n不應該一開始就把這份感情設下「一萬年」的期限。也許這樣，未來遇到波折、彼此口角\n\
  、遠距離戀愛…等困難時，就會比較沒那麼失落，期望越高失落越大。愛情的動力來源似\n乎可以修正為「雖然愛不到天長地久，但也要努力朝海枯石爛的境界邁進。」\n\n\n\
  但如果，真的有如果，也不要再花個幾年時間想刻意抹掉那個人留下的烙印，就讓它靜靜\n躺在心頭，偶爾用一聲無言輕歎悼念那段往事就好。\n\n\n因為真的不值得。\n\
  \n\n也許事先預設了每段感情都可能有盡頭的準備，所以趁熱戀的時候盡可能幹點傻事，將來\n好在對方睡前枕邊回憶著少年輕狂。也許想透了每一段人生路途都可能有出口的道理，所\n\
  以趁著眼前還看得到、摸得到的時候多多溫言幾句，以免將來只能對著照片默默掉淚。\n\n\n也許生命就是一堂不斷學習分離的課程吧，對愛情如此、對親人亦然。\n\n\n\
  ---\n\n\n\n\n\n　　\n\n--\n\n嗯嗯，真的是好片呢\n\n\n別客氣，大家互相交流 ^^\n\n\n我也是…XD\n\n\n優質啦,哈\n\
  \n\n感恩\n\n\n應該取個好萊塢式的情侶縮寫，Timmie或Army之類的 XD\n\n\n這……我個人覺得不像 XD\n\n\n;)\n\n\n好片就是會在不同地方感動人心\n\
  \n\n謝謝推文，趕快去刷啊 XD\n\n\n她也吃真好，都是帥哥啊……是說我也不討厭她，只是原著裡好像沒有著墨O太的部份\n不知道編導要怎麼編，而且除非真的開拍了，不然我是對續集有點不抱期待\n\
  純粹是擔心續集常常會毀掉前作的經典…(聳肩)\n\n\n那就慢慢期待兩人再重逢吧 XD\n\n\n感謝推"
