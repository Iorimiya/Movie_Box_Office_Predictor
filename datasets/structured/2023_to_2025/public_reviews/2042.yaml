content: "* \n  當然其中引起關注和討論的是，\n  我只能說，劇本和小說非常接近\n  然後是我需要的版本\n \n\n  Tumblr整理的影迷表示，導演Luca到底有沒有拍出這些戲份，我們不得而知\n\
  \  只知道電影給的是含蓄許多的剪輯\n\n\n* 於是在缺乏4小時版電影的滿足之下，我就移情轉向 shipping 兩位演員了！\n\n  ＊ * \\(￣▽￣)/\
  \ * ＊\n\n \n\n \n\n  很要命的是，他們兩私底下接受專訪或者上節目宣傳\n  互動實在有夠甜！！！！！\n  尤其是 Timmy 基本上有幾個片段的表情和回答我覺得已經「告白」了\n\
  \  總覺得他生命中無論之後和誰在一起，Armie 永遠有個特殊的位置\n  甚至很微妙的和小說裡面 Elio 對 Oliver 的感情呼應\n\n  特別是前陣子某訪問，主持人丟關鍵字給他們要兩人立刻反應聯想\n\
  \  \n\n  Timmy 竟然給了下列的答案\n\n  \n\n\n\n\n\n  這是要 shippers 們都瘋狂了吧！？\n\n  不曉得在 Ellen\
  \ show 那個幾乎無法超越的互動之後\n  我們還能不能有糖吃 >///<\n\n\nCheers!\n\n\n--\nWe came back to the\
  \ same place\nWe didn't speak just danced in our minds\n\n--Verve, DRIVE YOU HOME\n\
  \n--\n\n《Carol》不曉得為什麼我迷上的是原本就很喜歡的魯妮;)\n最近知道她和男友瓦昆合作的《Mary Magdalene》抹大拉的瑪利亞\n即將在國外上映，很期待\n\
  \n\n\n\n\n也不是第一次當shipper，但這一對真的太犯規了>/////<\n\n\n\n(含淚遙望 4 小時導演版以及之後的續集＊ *〒^〒* ＊\
  \ )\n\n\n照三餐配！！！\n\n\n:DDDDD\n\n\n嗯嗯嗯每次看Hammer太太在限時動態標 Timmy\n都有一種很「欣慰」的感覺XDD\n\
  真的是 \"modern family\" 啊 bravo!!!"
