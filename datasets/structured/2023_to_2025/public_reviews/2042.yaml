url: https://www.ptt.cc/bbs/movie/M.1520708521.A.E1D.html
title: '[ 普好雷］以你的名字呼喚我'
content: '雖然是一部同志的愛情電影


  但看起來給人的感受就如同一般正常男女


  從認識到曖昧然後交往一直到最後的激情


  不過卻多了一點擔心無法被周遭的人接受


  以致於感情無法正大光明的無奈與壓抑


  但不同於以往許多講述同志議題的故事


  片中主角的父母並沒有因為他的同志身分


  而極力打壓與阻撓他們交往


  反而是以一個正向積極的態度


  鼓勵他們的孩子勇敢正視自己的情感


  即便是普通男女的交往


  父母都不一定有如此開明的態度去面對


  自己孩子的感情問題


  更何況是一段在當時見不得光的同志戀情


  最後主角與父親的對話與坦誠相見


  是整片中讓我最感動的地方


  全片的步調緩慢


  沒有什麼很重大的劇情轉折與起伏


  但兩位主角之間的感情細節描述的非常細膩


  就如同發生在我們尋常的愛情故事


  情感的堆疊一直到了最後


  艾里歐得知了奧立佛結婚的消息


  埋藏在內心深處的情感就如同


  壁爐中的爐火


  再次被點燃


  更凸顯主角失去了這段感情的痛


  總結來說是一部還不錯的愛情小品


  有愛情的酸甜苦辣


  有親情的溫馨與包容


  唯一的缺點大概就是裡面的情節


  太生活化了容易覺得無聊


  還滿推薦大家去看的


  --'
