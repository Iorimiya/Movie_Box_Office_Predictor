title: '[好雷] 以你的名字呼喚我 '
content: '兩男主角顏值都超高

  度假生活超chill

  不是玩水吃飯彈鋼琴看書研究考古

  艾里歐奧利佛互動很有趣有愛

  最後一幕男主角面對壁爐


  音樂響起

  開始跑工作人員名單

  艾里歐在哭的長鏡頭

  好美好痛好哭

  接著畫面消失

  只剩名單

  而壁爐燒材的劈啪聲 依然響著




  奧利佛坐火車離開的時候

  艾里歐在火車站不知所措

  打電話找媽媽來載他最後哭出來



  在車上又哭了一次

  (感覺媽媽應該知道他為什麼哭吧)

  艾里歐問爸爸媽媽知道它們的事嗎?

  爸爸說 她應該不知道(?!)


  奧利佛離開後

  爸爸跟艾里歐談心

  說的那一段好觸人心



  我們為了快點痊癒而付出一切感情

  以至於到了30歲就沒有感情可以付出了



  但為了不要去感覺 而讓自已毫無感覺 實在太浪費了



  我們都只能擁有自己的心靈和身體一次

  而且不知不覺心就累了

  至於身體總有一天就不會有人想看

  更別說接近了



  現在你還有悲傷　痛苦

  別扼殺它

  喜悅就會伴隨而來




  爸爸中間還有說一段

  我可能差點擁有

  卻從來沒有你們所擁有的

  總是有東西讓我卻步或從中阻礙

  (這是代表 爸爸也跟男生有過一段情?)





  --'
