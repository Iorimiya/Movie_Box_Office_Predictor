title: '[好雷] 愛情美樂地 - 身體(臉孔)與性別的錯置'
content: '今年四月份有上映過

  得獎還不少

  坎城影展 酷兒金棕櫚

  坎城影展 一種注目 評審團獎

  美國獨立精神獎最佳國際電影

  奧斯卡最佳國際影片15強


  網路上也有一些評論

  就我自己補充一些其他的觀點

  參考參考




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  本來是因為巴基斯坦的異國情調吸引，抱歉本身對於同志議題還好，卻發現劇本寫得還不

  錯，看來同志議題只是吸引人的標語，其實探討的面向很多。本來覺得巴基斯坦比較台灣

  落後（抱歉我就明講了），看到一半突然覺得是台灣有點落後了….（台灣目前拍得出如

  此多面向的電影，大概就是哈勇家吧，但性別情慾的部分，我還停留在蔡明亮的河流李康

  生跟片中爸爸三溫暖遇到那邊）



  稍微查了一下，大部分談論此片聚焦在父權的壓迫，確實就仰賴劇本與演員的演技在於不

  會把父權與進步思想的對立性過於二元、黑白分明的，這樣十分政治正確的可以輕易選邊

  站的無聊感。



  電影確實在一個巴基斯坦傳統家庭的結構中，大兒子身為是家中模範：生了三個小孩又生

  了第四個做為開場，就傳統習俗來說必須殺羊慶祝於是主角小兒子過於陰柔不敢殺。電影

  先是把焦點放在小兒子，卻又悄悄著墨其他成員過於壓抑的情慾解放，包括父權中心的大

  家長年爸爸，電影中利用尿失禁有些淫蕩的表示某種羞愧與失能，於是進而與鄰居的寡婦

  共處一室，看似開始讓家庭分崩離析的想像。



  電影的中心還是放在小兒子與老婆之間，從工作，到性別的保守現狀與進步性之間的游移

  。主角小兒子因為工作加入寶來屋劇場舞團認識美麗的跨性別的舞蹈藝人，進而產生戀愛

  關係，被晾在家中的老婆寂寞難耐，藉由偷窺樓下陌生男子DIY自己也忍不住DIY；同時主

  角與跨性別發生親密關係，電影巧妙的是主角擺出姿勢想被插入，但卻被跨性別藝人暴怒

  趕走，說他不喜歡gay，當下指得是他(她）喜歡異性戀帥哥，有點顛覆我們對於男男性別

  的邏輯，於是電影利用了這樣的錯亂來達成曖昧和模糊，也難怪主角叫跨性別藝人千萬不

  要動變性手術，意思是如果成為真正的女人，會不會就不喜歡了？



  同樣的精采的身體（臉孔）與性別的「倒錯」也展現在主角俊俏小臉：較為陰柔；以及主

  角老婆微大餅臉輪廓比較像是男生，如此像是在暗示為何身為同志的男主角會娶陽剛老婆

  的原因；另一方面也暗指著許多臉孔視覺上像男性的女性，或是像女性的男性的但因為頭

  髮與裝扮「成為男性」或「成為女性」。甚至進一步思考，人出生的「無性別」，是因為

  醫學判斷給予分類男生和女生，以及社會規範下長大之後的男人和女人。



  電影的結尾倒是顯示了主角的演技似乎沒有呈現作為個人主義下追求自由的張力，相對於

  主角老婆的壓抑、有點瘋癲到最後自殺，以及跨性別的藝人的堅毅和凶狠都演得不錯，所

  以我完全想像不到主角最後一cut在海上奔向自由有啥解放含意，大海等於自由？反而是

  蠻cliché(陳腔濫調)的表現方式。



  --


  拉特飯 - 以商業力量進入獨立市場

  (剛搬家內裝待修)


  --'
