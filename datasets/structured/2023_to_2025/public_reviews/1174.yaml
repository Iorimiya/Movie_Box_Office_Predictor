url: https://www.ptt.cc/bbs/movie/M.1429749972.A.643.html
title: '[好雷]【忠犬追殺令】White God 眾生皆平等 '
content: "《忠犬追殺令》White God- 電影開場片段\n看前想說是溫馨片,\n片頭以為是保育動物片\n看的過程中覺得是恐怖片,\n最後又莫名其妙感動了起來,覺得這是寓言片...!!!@@\n\
  \n每個生物都只是生活在地球上的一份子,眾生皆平等...\n\n必須說這部片帶給我心靈上的感受是很多元，\n\n光是心中那種從開頭到中途甚至是結尾的情緒轉換，\n\
  \n從原本的憐憫之心，轉至驚駭恐懼，到了尾聲之餘，\n\n以為要結束時，突然被戳中感動地潸然淚下，\n\n這種複雜又多元的情感轉合上，真心認為這部的導演十分厲害，\n\
  \n可以這樣將觀眾情感帶到不同的層次，\n\n乃至要駕馭這麼多狗演員出擊，完全沒用特效，著實讓人嘆為觀止!!\n\n事前完全沒看電影簡介，\n\n只憑曾閃過幾幅此電影的海報就看了，\n\
  \n原本以為會是像迪士尼101忠犬那樣的溫馨片~\n\n結果大錯特錯~~\n\n這部片讓我驚嘆地是完全沒用特效，卻讓人強烈地感到這些狗狗彷彿被擬人化了般，\n\n\
  可以感受到牠們情緒的翻滾，\n\n當看到狗狗亮著粼粼利齒地狂吠，也不免讓人心疼，\n\n那武裝起來強悍外表下，曾經脆弱受傷又懼怕的心....\n\n因為怕受傷才需要武裝，\n\
  \n原本不能理解為何這部電影的英文片名為 \"White God\"\n\n透過導演的解說，才知是站在狗狗的角度而言，人彷彿是那可左右生命來去的神，\n\n看完這部電影，也不免讓人感嘆著為何有一說「世界上最毒的是人心」了！\n\
  \n\n\n －　－　以下內容含有劇情　慎入有雷區　－　－　－\n －　－　以下內容含有劇情　慎入有雷區　－　－　－\n －　－　以下內容含有劇情　慎入有雷區　－　－　－\n\
  \ －　－　以下內容含有劇情　慎入有雷區　－　－　－\n －　－　以下內容含有劇情　慎入有雷區　－　－　－\n\n\n\n《忠犬追殺令》White God -\
  \ 電影預告 (2015/4/24)\n\n\n若說[猩球崛起]是猩猩的反撲~那這部片[忠犬追殺令]應該就算是狗狗的反撲吧!!\n\n欺善怕惡，弱肉強食，或許是生存的法則，抑或本性！？\n\
  \n透過此部片，又不禁愧慚想著．．．．\n\n當人類的我們難道是因為如此，所以才去欺負殘害著生存在這地球上的其他動物，\n以滿足自己嗎？\n\n\n後來想想，這部電影做了一個有趣的假設，若號稱”人類最忠實的朋友”－狗狗，\n\
  有天也有如人類一樣記恨報復時，且有能力報復，會是甚麼樣的結果！？\n\n如同之前所提強欺弱，對於狗兒而言，飼主即是他們世界的中心，\n\n不少電影都做過人與動物間的互動電影，去年台灣也有出過【只要一分鐘】，\n\
  普遍是以人類的角度去看待狗狗，畢竟要從狗狗的角度來拍電影是有點困難的，\n但這部電影我覺得它做到了！可以感受到狗兒的情緒，甚至是心境上的轉變，\n很多場景設定都可以強烈到人類是強勢有資源的一方，狗兒根本無力反抗，\n\
  \n從一開頭，原來的飼主女孩，父親因為嫌麻煩不想花錢，\n在爭吵賭氣時順勢就將狗兒丟棄，狗兒被遺棄時還搞不清楚狀況，自己已被遺棄．．．\n以及捕狗大隊，還有賽犬過程等等，一些畫面都讓人感到真實又血腥，\n\
  也是因為這樣讓我感到驚悚（所以感到也有恐怖片的成分XD）\n\n也許這才是我們不知現實一面，透過這樣的現實，\n才可以更感到這些狗兒處境的堪憐，導演更特定設定狗兒要（mix）混種犬，\n\
  在世俗中的人類定義中：混種犬不如純種的有價值，這也是人類所給予的階級及標籤，\n但對狗來說又何辜呢？！\n\n讓我最印象深刻的是，和捕狗大隊面對狗狗時也說：”牠還不知道我們要幹嘛．．．”\n\
  \n買賽犬的人對狗說：”你的心還在．．．”（狗一邊舔著他的手，這是買的主因之一）\n\n對照他之後對狗的殘酷訓練，不免深感諷刺，那顆心是指甚麼心？\n就是”對人類信任的心”，\n\
  \n狗狗對人類信任的心，經由人類的行為一再地摧殘殆盡，電影在後面做了假設，\n這些弱勢被人類霸凌的狗狗有天也有如人類會復仇的話，會是怎樣的結果呢？\n\n更藉由狗狗在反撲的過程中，以不食肉來加強不要食物，只要復仇的意念決心！\n\
  \n最後的結尾，我覺得很經典，當小女孩在吹起熟悉的音符，撫慰了狗狗受傷的心，讓牠回想起曾經被愛的過往，小女孩也俯下身與狗狗在同樣視角的時候，突然很感動我．．．\n\
  \n眾生皆平等...每個生物都只是生活在地球上的一份子,何需這樣彼此傷害．．．\n\n這也是電影用來表示彼此平等的意喻，女孩父親也做同樣的事時，\n卻頓時覺得有點搞笑又帶點懺悔，總之這部電影雖然不用特效，\n\
  卻非常符合奇幻的元素，尤其能將狗狗的情感及面部表情拍的這麼好，\n一些畫面的構圖也很有美感～確實是大師之品無誤！\n個人是還蠻喜歡，很驚豔！頗具新意！\n\n\n\
  --\n\n 如果你要走，我不會留．．\n  但請記得當我牽你手的時候，我心永留存．\n   離別並不可怕，回憶會在我心中把你留在最美的時候．\n　　\n\n\
  --"
