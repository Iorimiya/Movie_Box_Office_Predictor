url: https://www.ptt.cc/bbs/movie/M.1685251609.A.BE4.html
title: '[負雷] White Men Can''t Jump 街籃聯盟 2023'
content: "雷文防雷資訊頁\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\nWhite Men\
  \ Can't Jump 街籃聯盟\n\n\n目前評分:IMDb: 4.7 /  爛番茄: 26\n\n先說我沒看過原版 \n以下劇情雷\n\n\n這部重製版基本上就是看Jack\
  \ Harlow打嘴砲\n垃圾話噴滿整部\n也不管你是白人黑人南美\n在當今這種政治正確的環境下\n這部戲還敢狂開種族玩笑\n我基本上是先脫帽致敬\n\n但說是籃球電影\n\
  籃球層面上的東西提及很少\n也沒有刻苦訓練這種東西\n單純就是兩個過氣前大學和高中明星選手\n靠天賦一路虐業餘比賽\n\n籃球轉播畫面略顯粗糙\n很多對手\"\
  故意\"失誤\n加上Jack Harlow一些很生疏的球技\n雖然Sinqua Walls本身就是籃球底\n但他就是一直灌籃三分灌籃三分\n就莫名其妙進入冠軍賽\n\
  最後Jack Harlow受傷 Sinqua Walls絕殺\n\n\nLance Reddick飾演Sinqua Walls老爸\n但出場時間很少\n最後劇情和現實一樣離開了人世....\n\
  \n\nLaura Harrier飾演Jack Harlow的女友\n只能說Jack Harlow賺爛了\n可以一直和Laura拍吻戲\n\n\nNBA球員就Blake\
  \ Griffin和Tyler Herro有客串\nBlake Griffin就當任冠軍頒獎人\n然後說一句我只是在做社區服務 趕快拍拍照結束\nTyler Herro也是客串\n\
  飾演火爆球員 把籃球當足球踢 搞笑了一下就沒了\n\n劇情方面可以給7/10分\n但是籃球畫面呈現上就是完全不及格\n甚至想給0分\n很像在看籃球火\n只是籃球火的演員需要吊鋼絲灌籃\n\
  黑人演員是不用鋼絲 能直接灌\n大概是醬\n\n\n--"
