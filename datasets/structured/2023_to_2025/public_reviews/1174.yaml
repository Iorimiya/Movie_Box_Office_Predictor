title: '[負雷] 白百合之戀 ホワイトリリーWhite Lily'
content: "大家晚安\n\n白百合之戀\n\nホワイトリリー\n\nWhite Lily\n\ngoogle 白百合 花語\n\n據說白百合是由苦苦追尋伊甸園的亞當和夏娃所流下的悲傷淚水所變成的。\n\
  \n在基督教裡因為一直被視為「聖母的花」，是復活節中不可缺少的花朵。\n\n儘管有那麼多種的百合，但是真正的百合，就指的是白百合。\n\n純白、優雅、高貴。\n\
  \n所以純潔是百合最合適不過的花語了。\n\n百合花語是聖潔的象徵，芬芳馥鬱、香氣迷人、純潔無瑕。\n-----------------------------------------------------\n\
  以上只是防雷頁\n\n如果看片名，以為這片是女同性戀片，就被誤導了\n\n因為劇情中，女主角和小鮮肉表示，他愛的不是女生，是愛老師，算師生戀\n\n這部片，算是經典爛片，房間\
  \ The Room 日本進化加強版\n\n房間 --> 陶藝教室\n\n男主角 --> 女主角\n\n女主角 Lisa --> 陶藝老師\n\n男好友 -->\
  \ 小鮮肉\n\n槍 --> 小鮮肉女友\n\n不過如果當成三級片看的話，就比房間好太多\n\n女主角是被家庭和學校排擠的邊緣人\n\n某天外面下雨，哭泣的女主角被陶藝老師和未婚夫看到，因此收留了可憐的女主角\n\
  \n不料某天陶藝老師未婚夫車禍過世，女主角自願代替未婚夫來愛老師\n\n但老師開始放縱生活，一大早就在喝酒\n\n老師晚上帶男人回來上床，叫聲連隔壁女主角都聽得到，女主角還因此自慰\n\
  \n如果老師沒帶男人回來，就會找女主角當洩慾工具，高潮完又回自己房間\n\n有一天老師帶小鮮肉回來上床，隔天老師變了，變的會做早餐\n\n女主角本來好心買無酒精啤酒，希望老師戒酒，沒想到老師改叫小鮮肉幫他買酒\n\
  \n小鮮肉被女主角發現他有女朋友，好心勸告老師，老師不聽\n\n小鮮肉女友發現，第一次闖進陶藝教室，被老師罵出去，老師先去洗澡\n\n小鮮肉說，是女主角束縛了老師，沒有自己的想法嗎？想要解放女主角的心\n\
  \n沒想到被老師看到，老師覺得被背叛，要小鮮肉上女主角\n\n沒想到小鮮肉軟屌，老師逼女主角幫小鮮肉口交\n\n小鮮肉女友第二次闖進陶藝教室家裡，發現女主角正在幫男友口交\n\
  \n憤而拿刀出來，老師又罵，就拿刀刺了過去\n\n女主角因為愛老師，幫老師擋下小鮮肉女友的刀，陶藝教室也因此休息半年\n\n半年之後，女主角又回到陶藝教室，和老師打了分手炮\n\
  \n最後女主角終於走出陶藝老師的陰影\n\n--\n 安全、無毒的食物\n 有錢結婚生養小孩\n買得起的房子\n被老闆當人看\n下班還來得及和親友吃晚餐\n租得起房子找得到工作\n\
  \n--\n掛羊頭賣狗肉的三級片"
