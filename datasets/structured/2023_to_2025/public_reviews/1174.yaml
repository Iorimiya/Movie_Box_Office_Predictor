url: https://www.ptt.cc/bbs/movie/M.1528207195.A.B86.html
title: '[新聞] 馬修麥康納主演《White Boy Rick》首支預告上線'
content: '新聞網址：


  法國導演楊迪孟治（Yann Demange）在 2014 年帶來了首部劇情長片《暴亂夜》（''71）

  ，不僅獲得柏林影展人道精神講特別提及、英國獨立電影獎最佳導演等許多獎項肯定，先

  前也曾是第 25 部龐德電影的主要鎖定導演人選，雖然最後沒有接下 007 任務，但楊迪

  孟治的最新執導作品《菜鳥毒梟》（暫譯，White Boy Rick）終於要在今年跟觀眾見面。


  《菜鳥毒梟》是改編自真人實事，描述在 1980 年代中期，於非裔藍領階級社區長大的

  14 歲白人男孩理查偉舍二世（Richard Wershe Jr.）成為了執法機關的臥底線人，其父

  親也接受 FBI 的金援，然而當他們提供了關於市長貪污的情報後，就被切斷了一切的援

  助。而在走投無路之際，理查只好回到了過去所涉入的販毒市場，最終成為了聯邦政府的

  目標，因持有大量古柯鹼被逮捕入獄並判處無期徒刑，直到 2017 年才首次獲得假釋。


  而楊迪孟治先前在與 EW 的訪談中則透露，此片真正要說的是關於一個家庭的故事，一個

  單親家庭在面對極度貧窮的狀況下努力求生的故事；演出卡司包括金獎影帝馬修麥康納（

  Matthew McConaughey）、瑞奇梅里特（Richie Merritt）、珍妮佛傑森李（Jennifer

  Jason Leigh）、貝兒寶莉（Bel Powley）、羅瑞考克萊恩（Rory Cochrane）等，8 月

  19 日美國上映。







  --'
