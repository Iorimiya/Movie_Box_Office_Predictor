url: https://www.ptt.cc/bbs/movie/M.1666759974.A.BF3.html
title: '[好雷] 白天鵝之戀 Sonja - The White Swan (2018 挪威片)'
content: '「瑪琳黛德麗？男人婆一個。」

  「秀蘭鄧波兒？還在包尿布。」

  「我從不客串，只會當主角！」

  「一次簽四片，算你賺到了。」

  「24個男舞者，簇擁我一人！」


  這個月看了挪威影集 Furia《復仇女神孚里埃》，驚艷於裡面的挪威男女主角 Ine Marie Wilmann & Pål Sverre Hagen，找找台灣串流找到他倆合作的溜冰女王片《白天鵝之戀》Sonja
  The White Swan，片中這位三零年代當世界滑冰女王、四零年代當好萊塢巨星的主角 Sonja Henie，一個挪威小女子初闖好萊塢就誇下海口語出驚人、而她的才能實力加上造夢敢衝的確令她扶搖直上大聲說話、甚至二戰開打失去歐洲市場她還能上達希特勒天聽！這位縱橫冰場秀場與影壇的「老娘叫宋雅」和《老娘叫譚雅》絕非同一等級，滿身肌肉親身上陣的挪威女主演光芒萬丈宛如女王。


  這位 Sonja Henie是史實人物，她拍過的好萊塢四零老片許多部在水管都有，看了就知絕不只是滑冰冠軍而更是經典明星。話說一部史實滑冰選手的傳記電影可以怎麼拍？可能有的會專注「滑冰」這件事、有的會著重長年練習的「受傷」等甘苦、有的會談大起大落的「星夢淚痕」、有的會談高處不勝寒的「愛情」渴望、甚至有的會談女明星遭到商業包裝乃至男性凝視的「異化」、當然也常以「破浪而出」或「重返榮耀」作為苦路到底的奮起救贖...
  以上這些都是很常見的女性運動員或女明星傳記片套路而且顯然很「美式」，不過這片由挪威來拍好萊塢明星取向極不同。




  當然這不同未必都正面，也可說它規避了很多傳統明星傳記片該說的事、甚至把史實與現實或醜化或美化地做了扭曲、但最終這些扭曲都意在集中火力談一個主題。本片這主題一開始雖然很高調明顯、但它的全貌也要隨著全片進展慢慢成形、而且往往透過不經意的小細節與小轉折而非正面飆戲直白談論：自小跟隨父兄在挪威學習滑冰的毛皮商女兒
  Sonja是個滑冰天才少女，二零年代參與國際賽事起連拿了 1927-1936世錦賽冠軍，更在 1936 德國 Ga-Pa拿下她第三面冬奧金牌還晉見戈培爾與希特勒！隨後赴美不但成為好萊塢明星，更引領美國「冰上秀」黃金年代傳統的奠定。


  本片前半小時就是她一飛沖天彷彿無所不能的起飛期，對應史實大概是 1936-1941成為好萊塢巨星住進比佛利山莊的黃金年代，在本篇描繪下可說是毫無困難險阻一路扶搖直上看不到頂端！面對政府發照與財務補助，她從不卑微討好反而以明星魅力折服官僚；面對經紀公司與片商商業考量計較風險，她大膽造夢身家擔保每次都證明眼光獨具；面對專業領域各種懷疑刁難與藝術歧見，她秀出專業實力與超強學力更展現無人能及的明星魅力，可說不論在賽場影壇還是冰上秀場她都是一呼百應的女王！只是這「女王性格」帶到整個人生經營與家庭相處就漸漸令人不安了起來：




  她在 1940s巔峰時期各種演出總年收逾兩百萬美金！但她仍以過去挪威小家庭經營毛皮小事業的態度來經營明星人生：首先，她賺這麼多錢卻對外界銀行疑懼不信，結果每場演出只收收現金動員家人一齊數鈔票，鈔票太多也只敢存到墨西哥金庫而非美國銀行帳戶，這樣經營遲早要出事；其次，她誰都不信只信親近的人尤其是家人，自己富了起來也雨露均霑要給父母哥哥都過好生活，作風海派任哥哥拿她資金投資生意也不多過問，這樣有錢能夠同甘未來潦倒未必能共苦；最高調的，則是她比佛利大宅派對不斷，白天夜晚演前映後永遠要當個大宅女王送往迎來受人簇擁...


  甚至，本片拍到中段令人悚然一驚的時刻，她連父親猝逝都不可置信呆若木雞未掉一滴淚，只是把該辦的喪事行禮如儀辦完後，二話不說「這房子需要更多派對」又熱鬧滾滾 XD
  這一刻不得閒的「派對渴望」或「女王焦慮」從何而來？一段看似不經意的童年回憶片段默默暗示：童年，本來挪威的冬天孩子們自由滑冰好不快活，只是有天孩子們被大人起鬨來場冰上小競技？看父親態度的熱切與冷淡，雖非道盡一切卻是刻骨銘心：當我贏了獲得喝彩是全場焦點，也就會是父親焦點得到他熱切的愛；但當我表現黯淡不是焦點時，父親連幫我整裝給我拍拍都意興闌珊。




  經過這個看似與全片劇情毫不相干的中段小插曲，全片 Sonja在各個場合的光芒萬丈突然都有了陰影與重量：在花滑賽事她要拿第一、在好萊塢電影她只當主角、每場冰上秀都必須是她個人秀、財管只要家人經紀只要親信以她為中心、台前台後每個場合都要明星魅力席捲眾生、大宅每天派對不斷人人都受我招待幕我風采來眾星拱月...
  這樣的「女王人生」一路順風順水彷彿能永遠過下去？但明星人生需要小心經營緊跟潮流隨時轉型，只要一個破口栽了跟頭戳破了女王表象，過去所有的榮景甚至人情都不堪一擊！哎，傳統好萊塢人情冷暖的「星夢淚痕」再次上演嗎？


  但在這部挪威片的冷峻視角中，這一切都不是「人情冷暖」「世道不公」或「時不我與」所能解釋的，追根究底都是 Sonja自己偏執傲慢所犯下的錯：(1) 她年紀漸大卻不願轉型讓出舞台給後輩，憤而與製作團隊分道揚鑣，結果任用說好聽話的自己人自製節目毫無藝管專業只會大慘賠！(2)
  賠了一個冰上秀、連帶賠了好萊塢、連歐洲市場都因她的「希特勒淵源」懼而遠之；(3) 奢華生活瀕臨破產卻不願放棄房產，於是找哥哥媽媽到處挖東牆補西牆，儘管「他們的錢過去都我出的」理直氣壯，但親情談成了金錢注定眾叛親離！唯一還疼她的媽媽過世了，她卻只記得拔下首飾。




  史實的 Sonja Henie真有這麼自我中心嗎？查查網上只大略知道她對事業內容掌控欲強，與製作人於 1950 分家後事業就開始起起落落也是史實，本片則連「起起落落」都省了就直接演成「急轉直下」！事業衰落了、財產散盡了、沒有舞台了，這些物質與虛名的繁華落盡都還是小事，但「女王偏執」最深層的人情一面又將如何「眾叛親離」？為錢為名沾她光的都拋棄離去了，為情為愛力挺她的也被她冷面推開了，因為她的「可以同甘不能共苦」非關她困苦時旁人能不能力挺、而是她自己落寞時能不能看見旁人：難道過去大家都只是「眾星拱月」從沒被她認真看待？


  本片身居女二地位的應是 Sonja在片中的愛爾蘭助理Connie，可說是從 Sonja默默無名到一飛沖天再到大起大落下仍「不離不棄」的貞定代表：平時看 Sonja夜夜笙歌奢華糜爛也從不踰矩、承擔
  Sonja這麼多事卻從沒覬覦其財富，甚至還是 Sonja力邀她當閨蜜陪伴自己才知節首份地初嚐一點奢華生活；她在 Sonja自尊自大時會提醒其節制、在 Sonja大膽妄為時會警示其風險、在
  Sonja背離人情會棒喝其走火入魔... 不過多種層面都每況愈下深不見底的 Sonja，如果冥頑不靈繼續自我中心目空一切，難道連這位忠誠無欲宛如聖女又直言諍諫宛如明燈的
  Connie 也無容身之處？




  如果是部好萊塢片，也許這就是帶罪主角痛定思痛做出終極之舉「力挽狂瀾」的結局時刻吧？但這部外表陽光普照骨子裡冰天雪地的挪威片，彷彿不把 Sonja的劣根性全部挖出、不把
  Sonja的光鮮表面剝奪到一點不剩，就絕不罷休 XD 當然史實 Sonja在 1950s也是事業起起落落時、在 1956 更徹底退出滑冰與演藝圈，但是否如此「失去一切」反能明心見性得到新生？本片倒是在許多階段都安排了一位沒沒無聞的同鄉男子與她擦身而過、直到人生歸零時才知這是伴我重審原鄉初衷的良伴與明燈！這「歸零」而非「再起」的結局就是好萊塢所不能為的挪威本色了...
  推薦欣賞。



  --'
