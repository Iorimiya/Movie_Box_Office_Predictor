title: '[普好雷] Spy x Family Code: White'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  動畫看了第一季，第二季只看了兩集就沒看了

  但我覺得應該沒看也不影響看劇場版

  他前面都會稍微簡介一下，有看可以更融入劇情就是了


  一開始在鋪陳甜點比賽的時候稍顯平淡了點，整部劇情算是可以順順的看完，有一些地方

  也滿好笑的。像是整集最精彩的安妮亞大便控制術，還有約兒以為洛伊德出軌擔心自己被

  換掉XD


  安妮亞怕被殺所以不敢大便這個劇情簡直為這部片加了50分有吧，安妮亞可愛到好想把這

  個畫面作成GIF留存，然後另一個我比較喜歡的就是打鬥的部分，約兒真的強到發瘋誒！

  ！！！跳上飛機就已經很扯了，跟一個機器人對打根本就是碾壓對方的程度，邊看邊在心

  裡尖叫 約兒帥翻了～～～


  當然這部有很多的小bug，但這些問題動畫也存在，所以基本上我已經算是無視這部的邏

  輯合理性，純粹想進電影院看安妮亞耍寶和約兒耍帥的XD 洛伊德在我心中就是個配角哈

  哈哈哈。而且這部片的每一個畫面都超美，說真的前面就算有點無聊但都不會覺得反感，

  果然角色夠可愛可以彌補所有XD


  唯一有一點就是節奏偏慢，前面有一些鋪陳不太懂用意在哪，就是反派喜歡吃甜點甚至能

  吃出有什麼食材和放的比例，就後面好像也沒有特別解釋這塊，感覺只是想讓洛伊德他們

  吃不到梅露梅露，感覺這部分有點多餘了


  --'
