url: https://www.ptt.cc/bbs/movie/M.1709473689.A.88E.html
title: '[討論] 【SPY x FAMILY CODE：WHITE】觀後感'
content: '本次的《間諜家家酒 CODE: White》為全新原創故事，由知名編劇大河內一樓（作品有：

  反叛的魯路修、甲鐵城的卡巴內里、機動戰士鋼彈水星的魔女等）負責本次故事腳本，並

  由片桐崇擔任導演。



  在一個寂靜的夜晚，執行秘密任務的洛伊德接到了一個新的任務代號——「梟」。在他深

  入執行任務的同時，安妮亞正在伊甸學院學習料理。在即將到來的料理實習課程中，傳聞

  獲得勝利的人將得到一顆星星。


  為了完成「梟」任務，洛伊德向安妮亞提出了一個特別的提議：製作一道能令校長大人喜

  歡的傳統點心。


  洛伊德、安妮亞以及佛傑一家三口的旅程就此開始。他們穿越鄉間小路，走遍各地的美食

  市場，尋找那些美味而富有故事的傳統點心材料。在這個過程中，洛伊德、安妮亞和佛傑

  一家，每個人都有著各自的目的和秘密，各自追尋著自己的目標和希望。



  旅途充滿了困難和挑戰，也充滿了意外和驚喜。當安妮亞誤食神秘行李箱中的巧克力時，

  一場世界的秘密揭開了。這個巧克力的味道似乎蘊含了無盡的能量和美好願景，而這些秘

  密恰恰關乎著世界和平的未來。




  看完覺得安尼亞真的好可愛喔

  waku waku

  而且看這部還可以順便練習日語


  劇中的彭德也曾是軍事實驗室的實驗體

  能夠預見未來



  然後安尼亞也會讀心術

  一家人都有很奇怪的特點

  爸爸是間諜

  媽媽是殺手


  莫名戳中我的萌點

  平常我是不太會看動漫的人

  這部真的推推



  不過最後也真的很好奇劇中（梅勒梅勒）

  看起來就很像平常我們吃的派

  是真實存在的嗎XD




  --'
