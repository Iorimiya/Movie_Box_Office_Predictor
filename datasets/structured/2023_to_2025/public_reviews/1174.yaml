url: https://www.ptt.cc/bbs/movie/M.1705691426.A.36C.html
title: '[好雷] SPYxFAMILY CODE:White 間諜家家酒'
content: '今天實驗剛好忙完一個段落，晚上在朋友邀約下一起去秀泰買雙人學生票(520)。因為是

  看晚上十點的場，所以人潮不多挺不錯XD (甚至看完才想到今天是首映日!應該算人生第一

  次首映日看電影)



  以下防雷
















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  電影前半段算是偏日常的劇情走向，先是黃昏被通知任務可能要換人接手，而恰好又遇到

  學校要舉行料理比賽，以此作為主軸，為了贏下比賽、得到星星，因此全家人打算一起前

  往弗林吉斯實際品嘗打算拿來比賽的甜點「梅勒梅勒」，過程中也穿插一些約兒看到疑似

  黃昏的情人(XD)而開始腦捕的外遇支線以及安妮亞誤吃了某個重要的東西最後被捲入軍方

  的事件。


  到了後半段劇情升溫，只能說真的非常精彩!!(感謝WIT和CloverWorks的努力，約兒的打

  鬥場景讓我想到巨人的立體機動裝置)要打戲有打戲、要顏藝有顏藝、要溫馨有溫馨~~不

  得不說有些畫面真的覺得製作組嗑了很多，邊看邊笑出來XDD


  整體來說真的是一部很適合各種年齡層電影，而且片頭一開始也會像動畫般簡單介紹人物

  角色，所以沒看動畫的人也可以直接去看不用擔心~推推


  而片頭是找鬍子男來唱、片尾曲則是星野源，兩首歌都好聽，但個人更喜歡鬍子男的

  SoulSoup一些(挺洗腦的)


  以上簡短心得，謝謝大家!


  --'
