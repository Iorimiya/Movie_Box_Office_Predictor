url: https://www.ptt.cc/bbs/movie/M.1687270944.A.C67.html
title: '[新聞]SPYxFAMILY 間諜家家酒 CODE:White公開前導'
content: '《電影版 SPYxFAMILY 間諜家家酒 CODE:White》公開前導海報，

  世界和平的秘密居然藏在巧克力裡？！


  這故事大綱好繞啊 XDD 大河內又會怎麼表現呢，挖苦挖苦


  2023-06-20 ｜ 花菱夕凪


  動畫電影《電影版 SPYxFAMILY 間諜家家酒 CODE:White》公開前導海報、故事大綱。




  　　將於今年 12/22 在日本上映的完全新作電影版，前導海報中可以看到手上捧著發光

  寶箱的安妮亞、飛撲的彭德、拿著指南書和望遠鏡的洛伊德、拿著鍋鏟和打蛋器的約兒。

  看起來比起拯救世界，佛傑一家的日常生活難度還是挺高的呢。


  　　故事大綱描述，洛伊德接到通知，「任務代號：梟」的負責人將要換人。安妮亞就讀

  的伊甸學園，接下來將進行可以獲得星星獎章的料理實習課程。知道這個消息後洛伊德看

  到一線希望，為了要繼續任務，洛伊德便對安妮亞提議要製作校長喜歡的傳統點心，以得

  到校長的青睞。而為了要確認這款點心的味道，佛傑一家以家族旅行的名義往該地前進，

  沒想到在火車上，安妮亞居然誤食了可能會動搖世界和平的巧克力......！


  　　電影版故事由原作者遠藤達哉擔任故事原案、監修、角色設計，動畫版導演古橋一浩

  擔任電影版顧問，導演由片桐崇擔任，劇本由大河內一樓撰寫。6/25 深夜將公開電影版

  的特報影片，敬請期待。


  Ⓒ2023「劇場版 SPY×FAMILY」製作委員会


  相關連結

  電影官網



  遊戲基地



  --'
