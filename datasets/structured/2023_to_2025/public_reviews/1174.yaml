url: https://www.ptt.cc/bbs/movie/M.1708915334.A.029.html
title: '[好雷] 被嚴重高估的SPY×FAMILY CODE: White'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  昨天跟老公去義大看，竟然兩個人包場。


  奉勸間諜家家酒的粉絲要快點去戲院看，不然就要下檔了！


  這部動畫是這個時代難得的家庭喜劇。身為兩個兒子的媽咪，很多內容都感同身受。也能

  理解黃昏/約兒/安妮亞的內心思路，覺得非常有趣～


  我最喜歡的笑果有：

  1.約兒懷疑黃昏外遇後的小劇場

  2.黃昏無法理解約兒的奇妙反應

  3.約兒突然酗酒發酒瘋

  4.安妮亞跟次子的冤家互動

  5.約兒隱藏強大力氣

  6.尤利聽到姊姊有危險的反應

  7.出現兩個反派頭目打架

  8.表面冷靜內心激動愛著黃昏的夜帷

  9.做了白工的弗朗基

  10.狗狗彭德可愛的手語


  除了以上我喜歡的無厘頭笑點外，還有精美的打鬥動畫，簡單的鬥智橋段，以及讓人非常

  喜歡的所有角色（有各自的性格缺陷，但是主要價值觀又是善良這種違和的設定）。


  以上，是我給好雷的原因。

  至於為什麼說被高估，是因為有一名有名的作者說，這樣說別人才會想看囉！

  -----

  Sent from MeowPtt on my iPhone



  --'
