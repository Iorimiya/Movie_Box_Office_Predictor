title: '[討論] 英國little white lies 雜誌2015最佳電影'
content: '1. Carol（卡蘿）

  2. Sunset Song（日暮之歌）

  3. The Look of Silence（沉默之像，奧斯卡紀錄片熱門）

  4. Taxi Tehran（計程人生）

  5. Timbuktu（在地圖結束的地方，凱薩獎大贏家）

  6. Selma（逐夢大道）

  7. Eden（巴黎電幻世代）

  8. Mad Max: Fury Road（瘋狂麥斯：憤怒道）

  9. Horse Money（里斯本記憶迷宮）

  10. The Voices（血色孤語）

  11. Phoenix（回不去的時光，德國電影）

  12. The Diary of a Teenage Girl（女孩愛愛日記）

  13. Aaaaaaaah!

  14. Jauja（安樂鄉，阿根廷電影）

  15. Crimson Peak（腥紅山莊）

  16. Dreamcatcher

  17. Inherent Vice（性本惡）

  18. Inside Out（腦筋急轉彎）

  19. The Supreme Price（紀錄奈及利亞民主運動的紀錄片）

  20. Tangerine（夜晚還年輕）



  ＿＿


  基本上是蒐羅各國佳片，眼光滿獨特的一個名單。


