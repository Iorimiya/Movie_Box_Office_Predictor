content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  先用電影院內的商店做防雷


  真的好羨慕日本電影院會在外面擺限定商店


  可能是剛上映的關係幾乎都是間諜家家酒的周邊


  聽說市區內幾乎沒有約兒的周邊了


  我這邊可能比較偏僻，所以還有xDDD


  買了安妮亞的證件套+掛繩回去 (我公司的已經壞了QQ









  故事主軸的話，大家就當作去看柯南或是蠟筆小新一樣就好了


  就算沒有看過本傳一樣都可以看懂


  開場也會用一小段時間介紹大家的能力


  主要角色都會登場 像是校園阿、弟弟阿、爆炸頭之類的，算是圈粉很夠( ?


  很推大家帶朋友或是家人去看


  中間很多ㄎㄧㄤ到不行的劇情


  戰鬥也是在高水準


  最後片尾過後還有一小段演出，請不要看到星野原唱歌就跑了喔


  --'
