url: https://www.ptt.cc/bbs/movie/M.1715779791.A.E8A.html
title: '[新聞] 《無言的山丘》登陸重映 楊貴媚憶長滿痱子'
content: "《無言的山丘》登陸重映 楊貴媚憶長滿痱子\n\n04:10 2024/05/15 中國時報 孫伊萱\n\n\n楊貴媚主演的電影《無言的山丘》數位修復版將再次登陸放映。（兩岸電影展提供）\n\
  \n第15屆兩岸電影展即將登場，14日公布即將於5月27日前往四川雅安的台灣電影及出席主\n創名單，由魏德聖導演的816《BIG》打頭陣，還有《無言的山丘》、《還錢》、《愛是一\n\
  把槍》、《小子》、《蘭陵40-演員實驗教室》、《壞男孩》以及特別放映的《周處除三\n害》。\n\n屆時導演朱延平、王童將帶領楊貴媚、范逸臣和《小子》中的2位功夫小子吳宗修、釋小\n\
  願與大陸影迷相見歡，另外，魏德聖、王耿瑜、王鼎霖、游智涵、王毓琦等導演們以及金\n獎製片人李烈、葉如芬也將與大陸影人進行交流，分享創作故事。\n\n楊貴媚這次和王童導演帶著《無言的山丘》數位修復版直呼興奮，也回想起32年前拍片的\n\
  點滴，楊貴媚難忘定裝時，導演覺得她太瘦了，便直接在戲服裡放了假奶和毯子，「但我\n滿身大汗長了痱子，服裝阿姨很貼心把涼涼膏擦在我身上，結果拍戲時就像在洗三溫暖，\n\
  身體裡面是冰涼的，但衣服包裹著是悶熱的，那種感覺很難形容」。\n\n魏德聖早在2009年影展第1屆時，就跟著導演李行、朱延平一起到大陸為台片開拓市場，\n很開心能再度前進雅安交流。與魏德聖合作多年的范逸臣則表示心情興奮，希望能將正能\n\
  量溫暖感人的電影帶給大家。\n\n#交流 #無言的山丘 #魏德聖 #小子 #導演\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛\
  \        是 菩薩\n\n\n\n--"
