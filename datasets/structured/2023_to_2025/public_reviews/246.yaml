title: '[好雷] 老國片「無言的山丘」'
content: '(手機排版請見諒)



  去年某天下午，在公視看到這部電影的下集。


  解析度不高的舊畫面以及熟悉的老演員們身影，馬上吸引了我的目光。

  劇情內容穿插著台語與日語，

  是訴說著日據時期金瓜石採礦工人們的故事，看的途中，立刻搜尋了電影相關資訊。


  後來、又在網路上搜尋，

  從頭再看一次這電影。


  這是一部曾經得過1992年金馬獎各項獎項的電影。

  最佳劇情片、

  最佳導演、

  最佳原著劇本、

  最佳美術設計、

  最佳造型設計、

  觀眾票選最佳影片。


  王童導演與吳念真編劇的聯手合作下的電影。

  內容細節表現細膩，

  深刻地表現出採礦工人們的無奈與心酸，

  日治時代下的台灣人民，

  以前我們的祖先們，

  是曾經活在怎樣的苦難殖民時期，

  那些不甘心、憤怒、悲憤、以及無奈，

  深深的可以體會到，透過這部電影。


  台灣人，曾經經歷過的歷史，

  台灣人，曾經捍衛自己的家園，

  台灣人，曾經為了生存而忍受屈辱，

  台灣人，曾經拼命只為了能飽餐一頓。


  日治時期的台灣，

  曾經受盡屈辱沒有尊嚴地活著，

  犧牲了數不盡的壯烈生命。


  沒有英雄。

  而是每一位各自有特色的小人物拼湊起來的故事


  戲如人生，人生如戲。

  哪個時代的電影，

  一定就代表那個時代的故事。


  雖然不曾屬於那個年代卻也悲傷不已。

  老電影，值得細細品嘗。


  歷史，

  總讓人有股遺憾的味道。


  無言跟劇中主角們的無緣相呼應。

  很值得大家一看的電影。


  --'
