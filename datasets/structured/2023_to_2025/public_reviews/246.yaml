  \        理經典電影放映暨映後座談會，為大家播映本片，更邀請本片\n        、女主角出席，由臺中市影視發展基金會副執\n        行長主持，共同進行映後座談。\n\
  \n        透過藝術與電影，一同來感受勞動者的面貌與生命故事。進一步由導演與\n        女主角的映後分享中，瞭解他們電影藝術生涯的發展與這個重要里程碑。\n\
  \n        歡迎您7/17做伙來國美館，在展覽與活動中，發掘臺灣勞動者在暗無天日\n        礦場與無言宿命裡，卻更加點亮的人性光輝！\n\n \
  \       【影片放映】\n        \n        影片對白以【台語】為主、部分日語，附華英文字幕。歡迎踴躍參加！\n\n        【映後座談】\n\
  \        ／臺中市影視發展基金會副執行長\n\n        \n／《無言的山丘》導演，2007第11屆國家文藝獎、2019第56屆金馬獎\n   \
  \     終身成就獎得主\n\n        ／《無言的山丘》女主角，1992新加坡國際電影節最佳女主角獎、\n        及多屆金馬獎、金鐘獎、新加坡國際電影節、亞太影展、亞洲電視大獎等\n\
  \        獎項得主\n\n        特別感謝：\n        不當黨產處理委員會（影片放映授權）、國家電影及視聽文化中心（影片\n     \
