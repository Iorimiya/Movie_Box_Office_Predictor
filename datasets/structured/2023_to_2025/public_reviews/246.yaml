url: https://www.ptt.cc/bbs/movie/M.1631975607.A.5BC.html
title: '[討論] 無言的山丘結局是不是壞了'
content: '剛看完無言的山丘


  最後在油菜花田

  阿尾終於跟富美子在一起的畫面


  但突然他伸手摸乳

  看得當下讓我覺得好像哪裡怪怪的

  有點錯愕

  雖然阿尾這角色設定的確一直想上她


  但富美子那個臉色根本就快掛了

  他之前在妓院都可以體諒他

  甚至花了錢沒有上

  怎麼最後突然在野外就把人家上了

  這樣淒美的畫面就被參雜了莫名的性慾

  想說算了，導演可能就是想這樣拍


  然後看完去查

  發現女生說劇本根本沒有寫這一段

  導演也說他不記得

  讓我對這部戲更覺得不舒服欸

  以後我應該不會對這部電影有什麼好感了吧


  有沒有人也覺得這個結局跟事件搞砸了這部電影


  --

  一開始我也是往這方向去想

  直到看到那個女方控訴劇本沒這段的新聞'
