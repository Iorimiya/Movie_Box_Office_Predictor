url: https://www.ptt.cc/bbs/movie/M.1476272382.A.C42.html
title: '[討論] 無言的山丘'
content: '無言的山丘


  剛剛才在這周的 LITV每周免費電影 看完


  好看!





  故事的開頭相當俐落的切入主題


  一對兄弟聽了礦山採金而發達的故事，決定也入山圖發財


  這故事說山上有個金蟾蜍，會吐出一道金光，尋金光走去，會得到金粉，可以買個三甲地


  哥哥問，為何不拿多些，可買五甲地?


  說故事的人答:三甲地的命要貪五甲地的運，貪心會倒楣的。看完這部片再回想這句話


  真是令人感嘆。




  於是哥哥(澎恰恰)與弟弟(黃品源)就這樣帶著行囊往山上爬




  簡單的幾句爬山對話便刻劃了兄弟倆的個性


  弟弟說:就這樣不辭而離開原本的長工工作，會不會不太好


  哥哥說:這樣都怕的話就不用想發達了



  爬到一半弟弟說:我們是長工的命，不應該肖想



  爬上去哥哥說: 西邊在哪裡


  弟弟回:哪裡都一樣，有何差別(因為爬得很累他很快就垂頭喪氣，這個性之後會再出現)




  路途中，兩人還曾在路上碰到一老人，問老人金瓜石怎走? 老人聽了乾笑苦笑幾聲，


  就自顧自往前走。這老人大概是看多了想來礦山發財的掏金客，此處回想來，這幾笑


  也的確料中了兄弟倆的命運。




  爬了一段，兩人都累了，有一種山窮水盡的感覺，兩人坐在石頭上，此時一道燦爛


  光芒打在兩人背上，兩人抬頭一望，是金瓜石天邊雲霧間一顆明亮的太陽


  (然後出現字幕:無言的山丘)



  這個鏡頭非常棒




  兩人上了金瓜石，先住進了楊貴媚的宿屋


  楊貴媚的演技也相當好，舉手投足言談相當入戲，而且 蠻正的



  還有一個賣麵茶的，口條相當道地，總之這部片相當寫實，幾乎3小時的片，但不令人


  厭煩



  兄弟大致了解後，原來這裡礦山由日本人經營，然後很多礦工，以及因應而生的各種店


  尤其一家妓院，是整部片的重心之一



  兩人應徵上礦工後，便開始漸漸融入礦村生活



  其中有幾個核心腳色，


  一個是戴眼鏡的，這個腳色有點像礦工中的領導者，可能因為有知識，吳念真常說的


  一個知識份子幫人潤飾信的故事，在本電影中有出現，這個戴眼鏡的就是扮演這個腳色



  還有一個瘦瘦高高的蠻常見的台灣演員，綽號阿西，在裡面演一個叫 憨溪 的人


  是個甘草人物



  妓院裡有一個小男生跟小女生，女的是陳仙梅，在妓院裡幫傭，漂亮。兄弟倆剛上山時


  ，有看到這小女孩在哼歌，弟弟對她一見鍾情。


  一個小男生，也在妓院幫傭(有點像韋小寶)，白天沒事會在街頭賣情趣用品。



  還有一個礦場廠長，這腳色很經典，幾個鏡頭便詮釋了衣冠禽獸、殺人不眨眼的冷血性格


  他看到人都會笑笑，然後點個頭敬個禮，衣裝也很整齊，是日本人




  有一次小男孩在礦場前賣情趣用品，驚動了廠長，廠長緩緩地走過去，對小男孩笑了


  一下，然後突然就甩了小男孩好幾耳光，又過肩摔，打得他站不起來



  兩兄弟在這礦村住了一段時間，有一天突然來了幾個凶神惡煞，詢問他兩兄弟在哪


  ，找到這兩兄弟後，這幾個流氓便打。



  這裡的打鬥戲很真實，完全不像現在武打片雙方擺好架式，互瞪三秒，然後左拳右拳


  迴旋踢...那樣，



  只見兄弟倆被打渾身血，此時戴眼鏡的登高一呼: 大家怎麼呆呆看，有人到我們村子裡來


  鬧事，我們不能當作沒看見，大家上啊!



  於是全村一起打這四個流氓，這四流氓被打得滿臉血，綁起來架到戴眼鏡的面前



  戴眼鏡的說:幹! 叫你們意思意思打一下，把人家打到滿臉血是怎樣


  (看到這裡我笑噴，打也是你說的，打太兇也是你說的XD)



  一問之下，原來四流氓是兄弟倆之前的老闆派來的，說這兩兄弟簽了賣身契，拿了錢


  說要葬父母，說好坐滿五年，結果就跑了



  戴眼鏡的看看澎恰恰(大哥)說:你怎麼說?



  澎恰恰說不出話，突然抽出旁人腰中一把菜刀，把自己兩根指頭剁下來，說:


  這兩隻指頭給你們回去做交代，一隻算我的，一隻算我弟的，拜託老闆開恩，


  以後我們兄弟發達了，會加倍奉還。



  黃品源(弟弟)抱著哥哥的手大哭



  看到這場景，大家都傻了，我想四流氓也不會多說甚麼。





  後來的情節，不詳述了，總之澎恰恰與楊貴媚日久生情，(前面忘了講，楊貴媚死了


  前兩任老公，只好在家中當SOHO版賣春，養大小孩)，本約好賺夠了錢，回鄉買地，


  結果澎恰恰在一次難得的挖到金礦意外，喪生了。



  楊貴媚心灰意冷，帶著小孩、多年賣春的積蓄、澎哥的神主牌，下山了。



  前面講的那個眼鏡仔，因為有一次礦工被集體搜屁眼，他大怒引起礦工集體反抗，


  結果被開槍打死



  之後，憨溪也走了，要兩手空空的回福州(來空空，去空空)



  那個小女孩，有一次礦場長來妓院搜黃金，小女孩因此被破處，並下海當妓女。


  小男孩一怒之下刺殺廠長報仇，然後被槍斃了



  總之最後大家都沒啥好下場。



  最後場景拉回到兄弟倆一開始來的那個金瓜石入口，依舊是風景明媚，滿遍野的黃花，


  但此時弟弟的哥哥死了，弟弟也心如死灰;而在此與弟弟初次相遇的那個小女孩，此時


  也因為賣身為妓，面色枯槁。



  兩人一句台語、一句日語，莫名其妙地聊了起來(小女孩是日本琉球人)，小女孩想報答


  弟弟之前的恩情，於是兩人就在草地野合了起來。 故事完




  這部片是悲劇，但是相當寫實地反映了當時人的生活。


  主題可說是感歎命運，當初兩兄弟為了發達，不辭辛苦上山當礦工，最後下場淒涼


  澎恰恰與他暗戀已久的楊貴媚，本來終於感情漸漸升溫，沒想到此時出意外掛了。


  楊貴媚也是好不容易在生命中出現第三個男人，沒想到跟前兩任一樣，短命，於是下山離


  開這個傷心地。


  弟弟終於可以和一見鍾情的美眉敦倫，但人事已非...



  應證了當初所說的，就是沒這個命啊...



  最後鏡頭再度拉回到那片雲霧，以及山丘。有去過金瓜石的應該可以體會，那就是金瓜石


  最經典的畫面，真的是一片茫茫大霧，讓人彷彿不知置身何處



  義大利導演塞吉歐·李昂尼有兩部片叫Once Upon a Time in America (西部往事)以及


  Once Upon a Time in the West(狂砂十萬里)



  我覺得這部片可堪作為台灣的Once Upon a Time in Taiwan


  因為它充分體現了台灣人生活、精神、性格，以及面對命運的無奈


  這部片多處表現了台灣人個性，如奸詐狡猾、想一夜致富不惜冒險犯難、愛鑽法律漏洞


  (這不是我說的是片中演老鴇的文英說的)，但是為生存又能刻苦耐勞，也有人與人之間


  的溫情，然後滿嘴的髒話但刀子嘴豆腐心...等等，相當能代表台灣的一部片


  尤其面對命運，有太多的無奈，看了這部片會很有感觸，如標題所言，無言阿...



  另外這部片的配樂也很好，很對情緒，演技也相當好，場景等等的，相當真實，


  如身歷其境。



  這部應該是我看過最好的台灣片，在這之前我覺得最好的台灣片是嫁妝一牛車、以及李安


  的一些片..等等。但看了這部之後，不得不說，令人十分激賞。





  --'
