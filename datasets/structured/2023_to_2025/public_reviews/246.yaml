url: https://www.ptt.cc/bbs/movie/M.1632017386.A.110.html
title: 'Re: [討論] 無言的山丘結局是不是壞了'
content: '我反倒非常喜歡這個結局

  憨溪淘金夢醒，看破一切決定回去和家人廝守

  阿助被炸死，有實無名的無緣妻子阿柔帶著牌位離開了

  阿屘當初沒主意的跟著哥哥來到金蟾蜍的美好之地淘金

  幻想著成為資產階級，可以好好安葬父母

  如今非但沒成真，反而失去一切，可謂家破人亡

  此時的富美子也是失去了最愛她的紅目仔，活著再無目的


  兩個身心支離破碎的人，那場肉體交纏早已不是性慾

  對富美子來說，阿屘是個可憐人，也是她不堪的世界裡除了紅目仔最後一個善良的存在

  對阿屘來說，他和這世界的聯繫只剩下富美子了，只有富美子是他此刻還活著的理由


  我比較想把這場性愛想像成明知救贖不到任何事情，還是卑微的想緊抓住它

  畢竟這部電影每個人都活得很卑微，受盡命運操弄，性愛是他們唯一以自己意志做的事情

  在此之前，兩人都還活著，在此之後，兩人都死了

  富美子死了，阿屘表面上瘋了，但其實他的靈魂也隨之死去

  只留下一付軀殼，年年種著一片油菜花海，吊詭的實現著未竟的金蟾蜍傳說


  最後鏡頭回到說書人，把金蟾蜍傳說頭尾呼應

  好像阿助阿屘兄弟當初聽到的傳說，其實是傳說源頭正是他們兄弟

  有一種魔幻的氛圍



  --'
