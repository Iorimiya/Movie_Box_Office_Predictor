title: '[請益] 哪個版本有"無言的山丘"完整結局？'
content: '大家好


  請問《無言的山丘》只有原版和修復版兩個版本嗎？


  因為印象中2020年文化部在youtube直播的臺灣經典電影版本，


  有保留最後洞穴裡講古老人的片段。


  但大家提到數位修復版不會有這一段，直接結束在富美子與油菜花田？


  網路上找到的版本也沒了這一段，觀看時總覺得少了點什麼。


  但文化部播映的版本不是數位修復版嗎？還是數位修復版也分成許多版本？


  現在哪裡還能找到完整的版本呢？


  先謝謝大家解惑！




