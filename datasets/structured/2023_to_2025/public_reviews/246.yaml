url: https://www.ptt.cc/bbs/movie/M.1568552747.A.39B.html
title: '[LIVE] 20:00 公視台語台 無言的山丘'
content: '9/15 20:00 無言的山丘 (上)

  9/22 20:00 無言的山丘 (下)



  導演： 王童

  編劇： 吳念真

  演員：黃品源、楊貴媚、陳仙梅、陳博正、文英、任長彬



  劇情簡介：

  憨直的阿助（澎恰恰）跟阿屘（黃品源）兩兄弟，聽了金蟾蜍的傳說後，拋下簽了五年約的

  長工工作來到金瓜石，希望能如願找到黃金。兩人跟寡婦阿柔（楊貴媚飾）租了房間，開始

  在礦坑工作。礦區裡各色人等都有。到了領薪日，九份街上燈紅酒綠，阿柔也兼差賺取外快

  。


  不久，地主派人找上門來，阿助為了可以跟弟弟留在礦區，剁下自己兩根手指頭。礦坑的工

  作暗無天日，大家都抱著能挖到金礦私下帶出去賣錢的希望。阿助跟阿柔之間情愫漸生，阿

  屘也喜歡上妓院的富美子（陳仙梅飾）。只是新來的礦長訂下嚴苛的制度，為礦區帶來緊張

  的氣氛。


  某天，阿助不幸在礦災中喪生，傷心的阿柔帶著孩子們離開。而留下來的阿屘，終於有機會

  跟心愛的富美子在一起。



  -----

  第29屆金馬獎最佳劇情片

  看到好多家中長輩都頗懷念的演員


  台語台應該是週日都有台語電影播出，可惜網站查不到近期片單。



  --'
