url: https://www.ptt.cc/bbs/movie/M.1495870706.A.28F.html
title: '[好雷] 無言的山丘 '
content: '大家安安


  乳提


  在MOD上看到的一部老國片


  聽說還蠻好看的就點進去看了





  =========================================================


  日治時代下的兩兄弟(澎恰恰、黃品源)


  為了脫離長工生活，偷跑去傳說中的金蟾蜍山


  原來就是台灣人幫日本人挖金礦的一個小村


  兩人向單親媽媽(楊貴媚)租房子，生活在一個屋簷下



  某日，以前的老闆派人終於找到兩兄弟


  為了給前老闆交代，哥哥二話不說拿起菜刀剁下兩根手指......



  礦工憨溪意外發現金脈，眾人開始偷偷把金子塞進肛門偷出去


  兩兄弟的發達夢終於有了開端



  酒店小伙計紅目為了心愛的富美子(陳仙梅)


  跑去向礦長告密


  至此開始，小鎮的恐怖和平終於失衡......


  =================================================



  這部真的沉重卻又非常好看


  以前的九份好美


  在日治時代沒有所謂的台灣人


  只有日本人跟台灣奴隸


  礦村只是時代下悲歌的一環


  為了生存大家都用盡力氣卻只能求得溫飽


  劇中角色個性都非常鮮明


  連只有幾秒鏡頭的許傑輝也沒有多餘的感覺


  神作!


  --'
