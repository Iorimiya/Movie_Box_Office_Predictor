title: 'Re: [討論] 無言的山丘結局是不是壞了'
content: '結局我也一直有個疑問

  以前用DVD看的時候

  DVD的結局並不是停在油菜花田

  而是鏡頭回到開頭的長工小屋內

  讓講古的老人說之後的故事

  他說阿尾醒來後發現富美子已經死了

  從此阿尾就發瘋了

  但之後每年還是會去種油菜

  而他種的油菜特別的好吃

  整片山波金黃得宛如撒上金粉


  但前一陣子發現修復版結局把老人的段落剪掉

  結局也就少了一種魔幻的氛圍

  覺得蠻可惜的

  有沒有人知道為什麼修復版要把這段剪掉


  --'
