title: '[好雷] 青春來接招 Greatest Days (2023 英國片)'
content: '今年六月在英國掀起熱潮的《青春來接招》，台灣本來七月要上後改九月竟都被撤檔？還好八月底德國已發行 DVD、也曾是接招歌迷的阿姨幫我帶進來。不知版上有多少「接招合唱團」Take
  That 歌迷？有多少男生又有多少女生？我個人是從 2010s的 X-Factor 時代才開始認識 Gary Barlow，至於以前 1990s男孩樂團的輝煌時代我則都沒經歷過，不過看來接招應是屬於我們
  PTT主流的四十歲上下叔叔阿姨們共同的少年回憶？本片由 Gary Barlow和另兩位團員製作，用的也都是他們過去接招金曲，不過這與其說是屬於他們的「音樂片」、不如說是獻給一代歌迷的「聽歌片」。




  本片雖是接招製作接招音樂，但片中從不出現「接招」Take That 團名，而只以彷彿象徵 1990s更廣大「男孩團體」熱潮的 "The Boys" 稱呼片中那團，這團也是找了五個能演能跳帥氣迷人的年輕男生來演男孩團！但觀其膚色造型與演唱風格也並沒跟當年接招一對一呼應...
  也許接不接招並不是重點，曾經 1990s高中少女們的「男團狂熱」才是本片想談的時代文化，主角不是高高在上的明星歌手而是每日生活的常民百姓，而此片選取的「北英格蘭」常民百姓更充滿社區傳統家庭包袱還講一口勞工階級口音！這裏孩子們都有夢想但很難飛起來，就來聽男團歌曲勾勒想像世界。


  故事開始：由愛爾蘭喜劇演員 Aisling Bea演出的中年女主角 Rachel 出身英格蘭北方蘭開夏小鎮 Clitheroe勞工社區，如今已在倫敦擔任兒科護士每天仍在聽蘭開夏廣播電台，年紀一把仍在醫院放
  25 年前男團 "The Boys" 老歌帶給病童們活力！而這天廣播報導蘭開夏之光 "The Boys" 25週年復出巡迴消息時竟給 Rachel 天降大禮：多年來都石沉大海的有獎徵答這次抽到
  Rachel 了、有免費機票旅館招待去希臘雅典看 "The Boys" 巡迴演出、「您是他們粉絲嗎」「我是世界第一大粉絲」Rachel喜出望外把握機會前進雅典！只是這大獎既可「攜伴參加」她又該攜哪個伴呢？




  故事隨著音樂回到 1993 年，史實那年接招推出了"Pray"，在本片中彷彿男團 "The Boys" 五位男孩寫給 Rachel 的私密情書：由演過兩部布萊納電影的
  Lara McDonnell 飾演的 Rachel 少女時代，儘管勞工家庭父母每天吵架不得安寧、甚至生氣摔盤大呼小叫嚇得她抱頭矇眼、自己只能吞下眼淚快速長大照顧弟弟，但只要有
  "The Boys" 金曲陪伴她都能歡欣雀躍充滿希望度過每一個絕望時刻！電影第一曲 "Pray" 快速奠定本片「少女聽音樂」想像表現法：生活中每一個難以承受的時刻、有了音樂就彷彿關上了門進入另一個世界、這有五個男孩疼我護我將我捧起可超越一切！


  有一種朋友是同聽音樂同追偶像分享人生共感的： Rachel 少女時代就有四位同學一起聽 "The Boys" 成為好閨蜜、五人每日踩街跳舞心懷偶像剛好與 "The
  Boys" 一對一，她們勞工家庭北方口音粗手大腳人生機會本來恐有限，但聽了歌曲都勇於大膽造夢更不怕秀給路人看！為一張演唱會票可以大膽放肆旁若無人也都是青春印記。的確像她們這樣勞工社區出身的孩子，若要為人生做出點不凡是需要很多狂放大膽「信仰一躍」的，譬如當妳面對跳台不敢跳水時、只要幻想五位男孩一起跳下就有了勇氣！只是勞工少女聽男團音樂勇於夢想時、音樂真也能帶她們踏上圓夢之道嗎？




  接下來劇情發展我就不多爆雷，僅談談本片少女粉絲變成中年阿姨的聽歌人生之懸念：回到 25 年後的 2018 線，長大的 Rachel 接到主辦單位「攜伴參加」的邀請後，要攜什麼伴不是理所當然嗎？不趕快打電話給昔日一起聽歌的四位閨蜜嗎？幹嘛演一堆回憶戲又哭又笑五味雜陳？最後這電話也沒自打而是由主辦單位代為邀請？到底昔日親愛精誠的閨蜜們遇上了什麼事情如今各分東西？她們各自呼喊過的少年夢想如今實現了多少又失落了多少？曾經發生什麼事情造成大家心結如今又要何時爆出來？而這心結又如何令她們從「聽歌造夢」的積極轉為「聽歌作夢」的消極人生？


  的確其中一位年輕最正長大最魯的閨蜜道出血淋淋經歷：當年想像 "The Boys" 五位男孩與我一起跳水多心花怒放？但真到了跳水賽場卻有個聲音「妳毋需如此拼搏」整個人生就雙手一攤鬆懈了下來，當然本有熱情的人們會放手鬆懈通常都是遇上艱難的卡關，但這關沒過未來就只剩下聽歌想像昨日美好的庸碌人生了...
  當然啦，夢想也許往往餅畫很大並非人人能做到，但真有意義的「圓夢」未必是勞工少女很難做到的功成名就，往往那有意義的一小步就在你身邊，只是人生某個階段卡著一關就此裹足不前...
  必須大膽回到過去聽歌造夢卻也聽歌跌倒的人生時刻重新站起來！




  雖然本片安排的「過去跌倒」事件老梗了些，但不論怎麼跌倒都要去爬梳面對那才是重點，既然大家過去「聽歌會友」那今日當然重返聽歌年代一起去追男孩們！至於 Rachel
  與閨蜜們一趟雅典之旅都到了古希臘劇場、有沒真的追到如今已是大叔的 "The Boys" 呢？彼此的友情相持與各自的人生實踐那才是重點，有沒追上一生也許謹此一次的演唱會也沒那麼重要了，倒是追尋路上公車地鐵等不起眼的小小風景往往藏著意想不到的寶藏...
  (!) 我雖不是「接招合唱團」歌迷但久仰其名來看此片也感動雀躍！相信真接招歌迷看了應會有更多靈感？希望片商繼續努力要上院線呀。



  --'
