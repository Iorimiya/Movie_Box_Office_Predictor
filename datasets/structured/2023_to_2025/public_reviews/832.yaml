content: '昨天去看了這部紀綠片，雖然片長只有短短一個多小時，但整部片傳達的訊息在我心裡留下

  深刻的印記。

  原來這個世界上有這麼邪惡醜陋的政府，淩駕法律之上，以一種國家級的犯罪型式，不法侵

  害著人民的生命自由安全。每個受害者身後對印的是一個原本幸福 ，但現在破碎的家庭。

  這些在中國仍在發生的事情，是生活在民主法制台灣的我們，難以去想像的。

  希望這部片有更多人可以看見，一起拒絕從中國大陸來的不明來源器官移殖供體，了解真相

  才可以制止迫害！



  ----

  Sent from  on my Sony XQ-CC72


