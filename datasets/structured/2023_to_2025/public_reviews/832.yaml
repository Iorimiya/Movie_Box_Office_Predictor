url: https://www.ptt.cc/bbs/movie/M.1728224896.A.4BB.html
title: '[新聞] 《國有器官》高雄特映遭恐嚇 中共懼真相'
content: '《國有器官》高雄特映遭恐嚇 中共懼真相曝光

  更新: 2024年10月06日 2:52 PM



  榮獲多個國際獎項的大型紀錄片《國有器官》揭中共暴行，2024年10月將在全台放映。（

  主辦單位提供）


  【大紀元2024年10月06日訊】（大紀元記者袁世鋼高雄報導）榮獲多項影展大獎的紀錄片

  《國有器官》，10月份在全台各地舉辦放映會，但就在1日、4日放映前夕，主辦單位雄獅

  影視公司、電影院業者卻接連收到恐嚇信，要求取消播出，主辦單位呼籲大家將明白的真

  相廣傳，就是制止中共惡行最好的方式。


  《國有器官》揭露中共大規模強制摘取民眾器官、對法輪功信仰團體的群體性滅絕等犯罪

  行為，榮獲2023年加拿大電影雄獅獎最佳導演、最佳音樂獎，以及2024藝術電影精神獎、

  榮譽全球電影競賽卓越獎，以及多個電影節提名，今年10月在全台各地同步播映，許多民

  眾觀看後，深有感觸。


  觀看民眾說，「最深刻的部分就是雲鶴的爸爸，然後他為了就是找他女兒的下落，就是20

  幾年來就是到處去詢問，然後就是雖然被打壓，然後都沒有結果，然後他還是願意一直去

  到處的尋找，對，我覺得這部分很感動。」；「善惡不是不報，只是時機未到這樣子而已

  ，如果時機到的時候就報應了，不是沒報應，一定有。」


  《國有器官》紀錄片中，許多關鍵人物克服恐懼站出來，訴說中共非法活摘器官真相，目

  前正值中共十一期間，台灣在全台戲院陸續放映，但主辦方影視公司及放映戲院竟陸續收

  到冒名「賴清德」發來的恐嚇信件，阻擋《國有器官》揭露真相。


  雄獅影視管姓負責人表示，中共以活摘器官的方式迫害法輪功已經長達25年了，這件事情

  是觸動了中共的敏感神經，「不單是我們受到這個（恐嚇）信，連戲院方（也被恐嚇）、

  還有支持我們的議員在臉書上Po出《國有器官》的訊息，也遭到了（例如言語）攻擊」；

  中共就是希望大家對此保持沉默，所以我們現在不單是要發聲譴責，更要把《國有器官》

  這部電影讓更多人知道，「我們只有拒絕沉默，才能真正能制止這場迫害。」


  主辦單位表示，目前已在台灣收到恐嚇信的地區，向所轄警政單位報警處理，呼籲民眾多

  把《國有器官》紀錄片所揭露的真相曝光，讓迫害者惡行無所遁形。


  觀看民眾表示，「越多人出來揭露，就可以代表說這件事情的真實性是可以被證明的，希

  望他們（迫害者）可以找回做人的良知吧，對，對，不要再進行這樣子的舉動了。」


  雄獅影視負責人管先生：「（中共）它就希望大家沉默，我們現在真正要做到的呢，不單

  是要起來譴責，而且要把《國有器官》這個電影鋪開來告訴大家，因為我們只有拒絕沉默

  ，我們才能真正能制止這場迫害。」


  今年6月25日，美國國會眾議院已一致通過《法輪功保護法》，法案要求中共必須停止迫

  害法輪功，並要求美國政府聯合國際社會，通過對參與活摘器官等罪行的人員進行嚴格制

  裁以推動迫害停止。◇


  責任編輯：于曼




  --'
