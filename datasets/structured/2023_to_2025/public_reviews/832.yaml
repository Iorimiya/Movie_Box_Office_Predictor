url: https://www.ptt.cc/bbs/movie/M.1719371830.A.FC7.html
title: '[新聞]揭露中共活摘《國有器官》曼哈頓電影節獲獎'
content: "揭露中共活摘《國有器官》曼哈頓電影節獲獎\n\n【新唐人2024年06月25日訊】6月23日，紀錄片《國有器官》在美國曼哈頓電影節獲得了\n「最佳人權紀錄片」獎。\n\
  \n\n\n上週日（23日）晚，紐約曼哈頓電影節舉行頒獎禮，講述中共活摘法輪功學員器官的紀錄\n片《國有器官》榮獲「最佳人權紀錄片」獎。\n\n紐約法輪功學員黃萬青：「很榮幸能夠替製片人領取這個獎項。我感謝各位給予中國人權\n\
  問題的支持。」\n\n紐約法輪功學員黃萬青在紀錄片中，講述了剛剛二十出頭的弟弟，因為秉持「真、善、忍\n」的原則，堅持做好人，就被中共在上海抓捕後神祕失蹤，至今已經21年，活不見人，死\n\
  不見屍。\n\n黃萬青：「21年，沒有任何消息。這是一種讓人絕望，讓人失望的一種心情。這個電影獲\n獎，讓我看到了希望。」\n\n《國有器官》拍攝歷時數年，收集到受害者及家人、目擊證人、參與醫生的第一手採訪，\n\
  講述了中共活體摘取法輪功學員器官的殘忍事實。\n\n曼哈頓電影節創始人尼爾森說，這是他創立電影節18年來，第一次看完影片後淚流滿面。\n\n紐約觀眾麗莎：「你們讓全世界了解到這些發生的事情，真的太好了。你知道，我們看到\n\
  （中共活摘器官）是錯誤的。」\n\n《國有器官》導演章勇進，在為影片錄製的影片中說，真相就是力量，他呼籲全球的人們\n站起來，制止這場正在進行的大屠殺。\n\n\
  紀錄片《國有器官》導演章勇進：「如果我們每一個人都能夠稍作行動，跟你的家人、朋\n友分享你在影片中看到的、聽到的，我們一起，可以把中國變成一個更好的國家。」\n\
  \n新唐人電視台記者任浩綜合報導\n\n\n\n--\n\n\n \n\n\n--"
