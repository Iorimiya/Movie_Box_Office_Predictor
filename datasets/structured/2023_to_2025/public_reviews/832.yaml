title: '[新聞] 播放紀錄片《國有器官》遭恐嚇！影城收'
content: '播放紀錄片《國有器官》遭恐嚇！影城收炸彈威脅　刑事局出手了


  記者 張貴翔 / 責任編輯 編輯組 報導

  發佈時間：2024/10/09 12:05

  最後更新時間：2024/10/09 12:15



  台灣多處影城收到死亡威脅，刑事局已展開追查。（圖／翻攝臉書《國有器官》）


  近日多家影城及媒體接獲網路恐嚇電子郵件，要求停止播映華裔導演所拍攝的紀錄片《國

  有器官》，否則將引爆炸彈或進行射殺。台中、高雄、屏東、宜蘭等地區電影院及台北媒

  體皆收到類似的恐嚇信件，手法相仿，嚴重危害社會治安。


  警政署刑事警察局表示，犯嫌使用VPN跳板程式，以多個不同電子郵件身分寄發恐嚇信件

  。警方已調閱電子郵件來源IP進行分析，將持續追查犯嫌下落。目前，警方在恐嚇信中提

  及遭放置炸彈的地點均未發現爆裂物及實際危害事件，呼籲民眾無需過度恐慌。警方已加

  強巡守及安全維護，並與業者建立聯繫管道，隨時掌握最新狀況。


  刑事警察局強調，近期發生的恐嚇放置炸彈案件，已由轄區警察局統籌積極偵辦中。寄發

  電子郵件恐嚇的行為已違反《刑法》第151條恐嚇公眾罪，呼籲有心人士勿以身試法。警

  方決不寬貸，不論犯罪者身分、型態為何，均會依法嚴辦到底，同時也請民眾或商家若收

  到此類郵件，立即向警方報案，警政署將全力偵辦，維護社會治安。





  --'
