url: https://www.ptt.cc/bbs/movie/M.1718957626.A.230.html
title: '[新聞] 獲獎片《國有器官》紐約上映 導演：制止罪'
content: "獲獎片《國有器官》紐約上映 導演：制止罪惡\n\n\n\n【新唐人2024年06月20日訊】歷時六年拍攝製作，曾獲得加拿大電影雄獅獎的紀錄片《國\n\
  有器官》週二（6月18日）晚，在曼哈頓影展上映。導演章勇進在放映後跟觀眾分享心得。\n來看報導。\n\n故事在一片陰森黑暗中展開，伴隨著一聲聲火車縈繞的聲音——仿佛是死亡的預兆。\n\
  \n加拿大導演章勇進週二晚上，攜帶歷經六年製作完成的紀錄片《國有器官》，在紐約與觀\n眾見面。\n\n《國有器官》導演章勇進：「這部電影是第一次從受害人的角度，來講述活摘器官這個歷\n\
  史的大事件。」\n\n影片描述了二十年前，兩個陽光的年輕人，在中共對法輪功的迫害中，被警察非法抓捕「\n失蹤」後，家人尋親之旅的經歷。\n\n章勇進：「我想只有把這份傷痛讓很多人知道，才能夠使這樣的悲劇不再重演。」\n\
  \n曼哈頓影展創辦人Philip Nelson：「在（中國）發生的活摘器官很可怕，同時很重要。\n目前沒有很多揭露（中共）器官摘取和販賣方面的內容。我們的影展至少可以幫助弱者發\n\
  聲，因為很少人談論（活摘器官），這是個重要議題。」\n\n影片通過大量第一手證詞和獨家採訪，展現中共以強制活摘器官的方式，對法輪功學員實\n施的群體滅絕罪，以及中國民眾在暴政下期盼信仰回歸的過程。\n\
  \n章勇進：「所以每個人如果能採取一點點行動，把今天你看到的和聽到的告訴您的親朋好\n友，我們就有可能使中國更加美好。」\n\n新唐人電視台實習記者懿馨、特約記者施萍、陳勝緒紐約採訪報導\n\
  \n\n\n--\n\n\n \n\n\n--"
