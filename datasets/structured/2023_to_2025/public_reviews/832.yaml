url: https://www.ptt.cc/bbs/movie/M.1728722350.A.665.html
title: '[新聞] 恐嚇完影城再恫嚇媒體！疑《國有器官》'
content: '恐嚇完影城再恫嚇媒體！疑《國有器官》太真實讓小粉紅心碎


  2024/10/12 08:06



  紀錄片《國有器官》藉由第一手證詞和獨家採訪，呈現中共強制摘取器官、對法輪功學員

  實施群體迫害。（取自臉書）


  首次上稿 10-11 22:36

  更新時間 10-12 08:06


  〔社會新聞中心／台北報導〕揭露中國強摘活人器官的紀錄片《國有器官》，在國內多家

  電影院上映後，收到「若不停播，就闖入戲院射殺所有人」恐嚇信件。目前，國內報導此

  新聞的重量級平面和電子媒體也收到恐嚇信，揚言若不刪除報導內容，便要在報社編輯部

  和社長室放置炸彈。警方懷疑是中國的小粉紅因「心碎」才出言恫嚇，現根據報案線索追

  查中。


  榮獲多項影展大獎的紀錄片《國有器官》（State Organs），內容揭露中共政府犯下人類

  史上重大邪惡罪行「活摘器官」，在多國首映後掀起話題，也引發許多關注人權議題的民

  眾觀看。


  然而，《國有器官》在今年10月全台上映後，陸續傳出多間電影院收到不明人士恐嚇信，

  寄件者還以台灣總統賴清德、第14世達賴喇嘛（                                  ，

  藏文）的名義寄出。揚言殺害觀影民眾，有電影院已經緊急取消放映場次，並報警處理。


  不料，自昨日起，國內許多家平面媒體和電子媒體，因為曾報導過揭露中國強摘活人器官

  的紀錄片「國有器官」的新聞，結果在公司的對外服務網頁上，紛紛接到恐嚇信件。


  寄件者是以台灣竹聯幫精神領袖「黃少岑」作署名，揚言若在24小時內不刪除相關報導，

  將在報社公司內四處置放炸彈。各家遭恐嚇的媒體也立即向警方報案，並由轄管警分局加

  強巡邏。


  刑事警察局科技犯罪中心分析認為，與近年鎖定來自中國陝西省西安市，針對我國藍綠立

  委、交通設施、政府機關及著名景點，寄發電子郵件或網路留言恐嚇放置炸彈、殺人預告

  等事件類似，不排除是同一人或一群人，意圖製造台灣社會動盪不安。


  ☆拒絕暴力，請撥打110☆




