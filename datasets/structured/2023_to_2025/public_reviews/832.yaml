title: '[新聞] 《國有器官》特映會 前中國軍醫鄭治訪台'
content: "《國有器官》特映會 前中國軍醫鄭治訪台\n\n\n2025年6月4日，親歷中共活摘器官的前中國軍醫鄭治（中）來台，於六四天安門事件36周\n年紀念日當晚，出席《國有器官》在台北喜樂時代影城放映會。（大紀元）\n\
  \n【新唐人2025年06月06日訊】加拿大紀錄片《國有器官》揭露中共活摘器官罪行，持續在\n全台發酵。在六四天安門事件36周年這一天，曾被迫參與活摘器官的前中國醫生鄭治，再\n\
  次踏上台灣土地，揭露共產黨的邪惡體制，並呼籲台灣人認清中共本質。\n\n前中國醫師鄭治：「我寧願走遍台灣每個地區，就是希望活摘器官，這個反人類罪惡，不\n要再傷害到台灣每個家庭、每個父母、每個孩子。」\n\
  \n\n圖為特映會大合影。（大紀元）\n\n數度哽咽落淚，曾被迫參與活摘器官現場，前中國醫生鄭治，再次踏上台灣土地，參加紀\n錄片《國有器官》特映會，揭露中共血腥活摘內幕，以及共產黨邪惡體制。\n\
  \n鄭治：「共產黨殺一個人太容易了，在活摘現場的時候，最大震驚就是它殺人太容易了，\n因為它不需要任何宣判，也不需要任何的什麼法律程序，因為沒有任何一個人敢去挑戰這\n\
  個共軍的這個單位，就是說它這是，它是一種按需殺人。」\n\n加拿大紀錄片《國有器官》：「我對面的醫生讓我去取眼球。當我望向他時，我看到他十\n分恐懼的眼睛。他的眼皮還在動，他是活的。」\n\
  \n前中國醫師鄭治曝光中共活摘惡行，加拿大紀錄片《國有器官》，在六四天安門36周年這\n天，在台北舉辦特映會，受到各界關注。\n\n\n2025年6月4日，《國有器官》在台北喜樂時代影城放映會。親歷中共活摘器官的前中國軍\n\
  醫鄭治（中）來台。（大紀元）\n\n立法委員許智傑：「中共真的是反人性，以及超出我們正常人的思維，能夠殘忍到這種程\n度，令人很不恥，令人很憤怒，我想我們希望說，能夠再幫忙多推廣這部電影，讓更多人\n\
  看得到。」\n\n台灣觀眾：「現在台灣人對民主、自由、法治，他就好像空氣一樣在吸收，我們覺得很自\n然，所以我們看到《國有器官》的時候，我們會覺得很訝異，共產黨不倒，世界不會好。\n\
  」\n\n\n2025年6月4日，親歷中共活摘器官的前中國軍醫鄭治（中）來台，於六四天安門事件36周\n年紀念日當晚，出席《國有器官》在台北喜樂時代影城放映會。（大紀元）\n\
  \n前中國醫師鄭治還指出，中共軍方早年的攻台報告提到，要將投降的台灣軍人，就地轉為\n血庫和器官庫。\n\n\n2025年6月4日，親歷中共活摘器官的前中國軍醫鄭治來台，於六四天安門事件36周年紀念\n\
  日當晚，出席《國有器官》在台北喜樂時代影城放映會。（大紀元）\n\n鄭治：「怎麼樣從他身上抽血，完了之後，如果有燒傷的共軍軍人，怎麼樣從（台灣）國\n軍身上，取一塊皮去移植。你們要認清共產黨是擊敗你的人性的認知，就是說你認為不可\n\
  能的時候，實際上中共的共軍，我不客氣講，已經站在中華民國台灣的土地上。」\n\n\n台大政治學系名譽教授明居正。（大紀元）\n\n\n\n血腥活摘罪行，仍在中國發生，《國有器官》紀錄片猶如震撼彈，持續在台灣、美國等全\n\
  球多地發酵。\n\n\n\n新唐人亞太電視黃亮戩、陳輝模、趙庭譽台北報導\n\n新聞網址：\n\n\n\n參考資料：\n\n\n\n\n《國有器官》全台無限期包場、加映。\n\
  放映場次： \n\n目前，紀錄片《國有器官》在各大串流平台都能觀看\n\n\n\n\n盼越來越多民眾藉此了解真相，喚起正義良知。\n\n\n--\n「川普總統天天看大紀元」\
  \ 獲讚賞\n\n川普接受大紀元專訪：美國強硬才能贏得\n\n大紀元記者手札：坐隨總統出行\n\n\n--"
