url: https://www.ptt.cc/bbs/movie/M.1749700539.A.333.html
title: '[新聞] 《國有器官》導演：用鏡頭揭開活摘黑幕'
content: "《國有器官》導演：用鏡頭揭開活摘黑幕\n\n【大紀元2025年06月10日訊】（大紀元記者安景韓國採訪報導）「我只是把事實真實、準\n確地呈現給觀眾，然後讓他們得出自己的結論。」這是紀錄片《國有器官》的導演章勇進\n\
  在接受採訪過程中反覆提及的一句話。\n\n5月30日，第五屆首爾翠雀花國際電影節上放映的開幕作品——紀錄片《國有器官》呈現\n了一個震撼世界的事實：中共政權長期系統性地活摘器官，並通過這條黑色產業鏈獲取暴\n\
  利。電影節期間，記者專訪了導演章勇進，聽他講述這部作品背後的故事，以及他本人、\n片中講述者和觀眾的心靈轉變。\n\n紀錄片不再只是冷冰冰的數字\n\n\n以「描繪自由」為主題的第5屆首爾翠雀花國際電影節5月30日開幕，揭示中共活摘器官罪\n\
  行的開幕作品《國有器官》震撼全場。（韓基民／大紀元）\n\n據章勇進介紹，《國有器官》是他拍攝的第四部作品。從2016年首次與主角之一鄭治醫師\n接觸，到2023年完成初剪，這部作品的製作時間跨越了七年。\n\
  \n章勇進特別強調《國有器官》這一片名背後的含義：「這部片子講的是活摘器官產業鏈和\n國家的關係。在其它國家和地區大多是個別的醫生犯罪或是犯罪團伙非法謀財害命。但在\n\
  中國發生的事情是以國家為背景的，包括軍隊警察和司法的一條龍產業鏈，其實是國家犯\n罪。」\n\n《國有器官》選擇了沒有旁白引導、通過受訪者的講述構建敘事邏輯的高度紀實方式，這\n\
  種做法意味著更高的拍攝和剪輯難度，但也極大程度保留了故事的真實性與力量。\n\n對此，章勇進引用了加拿大人權律師大衛‧麥塔斯觀影後的評價：「以前關於這一主題的\n\
  紀錄片，我看到的只是統計數字，而這次我看到的是鮮活的生命，以及兩個家庭的小人物\n在活摘器官這一歷史大事件當中的故事。」麥塔斯告訴章勇進，這部片子帶給他身臨其境\n\
  的感覺。\n\n這也正是章勇進的初衷——不只是讓觀眾「了解」問題，而是「親歷」與「共鳴」。「我\n覺得自己有責任，把中國25年來最重要的歷史客觀、真實、準確地記錄下來，然後傳遞給\n\
  觀眾，讓他們得出自己的結論。」\n\n受訪者與記錄者的雙重救贖\n\n\n加拿大紀錄片《國有器官》導演章勇進在韓國參加第五屆首爾翠雀花國際電影節期間接受\n採訪。（韓基民／大紀元）\n\
  \n鄭治是實名舉報中共活摘器官的中國大陸醫生，他逃到海外後曾隱姓埋名17年，承受巨大\n心理壓力。章勇進最初並不確定是否能成功採訪到他，但鄭治最終接受採訪，這個決定不\n\
  僅是影片的轉折點，也成為鄭治個人走向心靈重生的開始。\n\n「當我看到鄭治醫師的眼睛時，感受到非常複雜的情緒，裡面有恐懼、擔憂，但也有勇氣\n和決心，很難用語言來描述……受訪結束後，鄭治醫師的心靈發生了巨大的正向變化。」\n\
  \n章勇進回憶說，在結束和鄭治醫師的談話之後，鄭治醫師含著眼淚和他說，「我以前每天\n都生活在極具的恐怖當中，時時感覺被追殺、做噩夢，而受訪結束之後，我覺得這種無所\n\
  不在的壓力突然之間煙消雲散了，好像自己的生命得到了救贖……彷彿一束光射入了我身\n處的地獄。」\n\n然而，當時的章勇進並未理解鄭治醫師話中的含義。\n\n\n\
  2025年6月4日，《國有器官》在台北喜樂時代影城放映會。親歷中共活摘器官的前中國軍\n醫鄭治（中）來台。（宋碧龍／大紀元）\n\n章勇進生於中國大陸、出身軍人家庭，在海外生活二十多年。儘管遠離中共政權多年，但\n\
  他坦言，在拍攝這部紀錄片之前，自己對身上仍殘留的「黨文化」並未有清晰的認知。隨\n著影片製作的深入，他開始逐步覺察並剝離這些影響，也明白了鄭治醫師話中的深意。他\n\
  將這一過程稱為「對自己生命的救贖」，「這也是恢復對上天的正信的過程，隨著正信的\n加強，我也覺得時時得到了上天的眷顧和護佑」。\n\n「我發現從精神層面上離中共越遠，生活就越安全、越幸福。」章勇進強調，這部作品不\n\
  只是記錄他人，也是對他自己的審視與淨化。他把拍攝過程比作修行：「就像古人畫菩薩\n前要淨身拜佛，這是對上天的一種敬畏。創作者的心境決定了作品的能量，會使觀眾從中\n\
  受益，所以我在自己的修為上面也不敢放鬆。」\n\n觀眾的回饋：全民覺醒\n\n影片完成後，在美國電影市場吸引了六家發行公司的興趣，章勇進最終選擇了一家優秀的\n\
  發行商。一位製片人身分的觀眾參加洛杉磯首映式之後，再次見面時向章勇進表示，在觀\n看影片數月之後，他依舊無法忘懷片中的情節，無論去理髮還是購物，他都會向遇見的所\n\
  有人講述這個故事，希望引起社會關注。這也讓章勇進非常欣慰。\n\n\n2025年6月1日，「《國有器官》全球響（播）映活動」下午在台北西門町舉行，吸引許多\n\
  民眾駐足觀看。（宋碧龍／大紀元）\n\n在台灣，《國有器官》的放映引發了一場公民運動。影片因揭露中共活摘器官的真相，引\n起極大反響，甚至招致死亡威脅。上映後不久，新聞機構、政府、警署、文化部等處收到\n\
  百餘封恐嚇信，有的揚言炸翻劇院和議會，有的甚至揚言遠程射殺總統。\n\n面對威脅，台灣當局迅速加強安保，而最令人動容的是觀眾的選擇——儘管得知放映場所\n可能存在危險，但絕大多數觀眾仍選擇留下來看完影片。章勇進表示：「很多人正是因為\n\
  聽說這些死亡威脅，才更想知道：我們拍到了中共怎樣怕見光的真相？踩到了什麼紅線？\n」\n\n許多觀眾在看完影片後，對中共有了更深刻的認識，表達了要遠離中共、保護台灣的意願\n\
  。此後，台灣社會掀起一波「國有器官，真相護台灣」的公民運動。觀眾不再只是旁觀者\n，而成為行動者。一些觀眾舉起標語，一些記者深入報導，連小孩都舉著標語參與其中。\n\
  影片的發行商也表示：「這是用真相來保護台灣。」\n\n章勇進總結說，影片中的每一個人物——不論是受害者家屬、醫生、警察，還是他自己—\n—其實都處在覺醒的過程中。「中共最害怕的是民眾的覺醒。當人們都認清它的時候，大\n\
  家就會想要脫離它。」\n\n\n2025年6月7日下午，台南機車遊街快閃活動行進中的車隊。（賴友容／大紀元）\n\n在韓國，章勇進也觀察到類似的中共對文化滲透現象——很多電影、電視節目和新聞來自\n\
  中國大陸，雖然包裝精緻但內容卻帶有強烈的宣傳導向。他表示，希望《國有器官》也能\n在韓國引發正向的社會反思，給韓國帶來新的啟發和希望。\n\n上映的結束不是終點\
  \ 而是開端\n\n採訪最後，章勇進表示：「我做任何事情都比較隨緣，只希望我的影片能帶來一點點啟發\n，讓人們願意思考真相、追求正義。如果能夠做到這一點，那我已經很滿足了。」\n\
  \n對於未來，章勇進表示，由於他在中國大陸長大，對那片土地的情況較為熟悉，他接下來\n的作品將繼續聚焦這一地區。他希望繼續通過紀錄片揭示那些被掩蓋的歷史真相。他說：\n\
  「我希望觀眾看完後能受益，得出自己的結論。」\n\n責任編輯：林琮文#\n\n新聞網址：\n\n\n參考資料：\n\n\n\n\n\n放映場次： \n\n目前，紀錄片《國有器官》在各大串流平台都能觀看\n\
  \n\n\n\n盼越來越多民眾藉此了解真相，喚起正義良知。\n\n\n--\n「川普總統天天看大紀元」 獲讚賞\n\n川普接受大紀元專訪：美國強硬才能贏得\n\n\
  大紀元記者手札：坐隨總統出行\n\n\n--"
