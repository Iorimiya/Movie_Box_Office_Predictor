title: '[新聞] 西門町舉行「《國有器官》全球播映」活動'
content: "台北西門町舉行「《國有器官》全球播映」活動\n\n\n\n【大紀元2025年06月01日訊】（大紀元記者鍾元台北報導）「《國有器官》全球響（播）\n\
  映活動」6月1日下午在台北西門町舉行，包括遊行及戶外演講，主辦單位呼籲共同制止中\n共活摘器官，現場吸引許多民眾駐足觀看。\n\n\n2025年6月1日，「《國有器官》全球響（播）映活動」下午在台北西門町舉行，吸引許多\n\
  民眾駐足觀看。（林雨青／大紀元）\n\n\n2025年6月1日，「《國有器官》全球響（播）映活動」下午在台北西門町舉行，吸引許多\n民眾駐足觀看。（宋碧龍／大紀元）\n\
  \n《國有器官》台灣發行商雄獅影視負責人管建忠說，《國有器官》6月全球播映，包括在\n韓國、荷蘭、瑞典、法國、 加拿大卡加利首映。台灣則於6月4日至15日，在全台舉辦多\n\
  場《國有器官》放映，曾參與活摘器官手術的中國醫生鄭治醫師將來台與觀眾見面。《國\n有器官》持續在美國、澳洲、台灣、日本等多個城市上映。\n\n\n2025年6月1日，「《國有器官》全球響（播）映活動」下午在台北西門町舉行，吸引許多\n\
  民眾駐足觀看。（宋碧龍／大紀元）\n\n\n2025年6月1日，「《國有器官》全球響（播）映活動」下午在台北西門町舉行。（宋碧龍\n／大紀元）\n\n管建忠表示，《國有器官》在台灣自去年7月中開始上映以來，迄今已經放映超過700場。\n\
  從2024年十一國殤日《國有器官》在全台放映至今，已收到逾100件境外郵件或訊息恐嚇\n，甚至揚言要在劇院放置炸彈，這顯示出中共對活摘器官真相曝光的恐懼與打壓。\n\
  \n\n《國有器官》台灣發行商雄獅影視負責人管建忠致詞。（宋碧龍／大紀元）\n\n\n2025年6月1日，「《國有器官》全球響（播）映活動」下午在台北西門町舉行，吸引許多\n\
  民眾駐足觀看。（宋碧龍／大紀元）\n\n管建忠強調，台灣社會必須抵抗恐懼與中共的威脅，以維護台灣的言論自由及社會自由的\n體制。他提到，韓國的首爾翠雀花國際電影節，《國有器官》、《時代革命》等多部揭露\n\
  中共暴行的影片，接連遭院方取消放映。他希望韓國人勇敢地站出來，能學習台灣人抵抗\n中共威脅的精神，也呼籲大家關注人權問題。\n\n\n陳怡伸律師致詞。（宋碧龍／大紀元）\n\
  \n\n2025年6月1日，「《國有器官》全球響（播）映活動」下午在台北西門町舉行。（宋碧龍\n／大紀元）\n\n台灣律師、時事評論員陳怡伸表示，「我們難以想像一個政黨會做出活摘器官這種泯滅人\n\
  性的事情。而且中共把活摘器官當作一個事業在做，在中國有器官供應鏈的存在，這是一\n個賺盡大把缺德錢的事業，而且現在器官供體來源不只針對遭鎮壓的法輪功學員，一般中\n\
  國民眾也受害。」\n\n\n2025年6月1日，「《國有器官》全球響（播）映活動」下午在台北西門町舉行，吸引許多\n民眾駐足觀看。（宋碧龍／大紀元）\n\n5月30日，第五屆首爾翠雀花國際電影節在汝矣島KBS大廳開幕。《國有器官》作為開幕片\n\
  放映，撼動現場觀眾。關於多部揭露中國人權問題的作品，在上映前夕被指定影院單方面\n取消放映，陳怡伸表示，這背後一定是受到中共的壓力，因為《國有器官》述說了讓中共\n\
  最不堪的真相，所以韓國戲院全都取消放映場次。\n\n\n2025年6月1日，「《國有器官》全球響（播）映活動」下午在台北西門町舉行，吸引許多\n民眾駐足觀看。（王仁駿／大紀元）\n\
  \n陳怡伸強調，「面對這樣泯滅人性的（活摘器官）行為，我們必須支持《國有器官》在全\n世界播映，能夠讓更多人知道真相。」他提到，台灣從過去的威權體制到民主自由社會，\n\
  這是沒有暴力流血的和平演變。台灣民主經驗可以輸出讓中國人及全世界還受到專制政權\n脅迫下的人民，享有民主、自由、法治及人權保障。\n\n\n台灣營救受迫害法輪功學員協會理事長許凱雄致詞。（宋碧龍／大紀元）\n\
  \n台灣營救受迫害法輪功學員協會理事長許凱雄教授說，去年7月《國有器官》在台上映，\n最初觀眾數量不多，但到10月份有人給電影院寄恐嚇信威脅取消放映，背後當然是中共在\n\
  操控。這也使得《國有器官》受到關注，到現在應該有一半的台灣人都知道《國有器官》\n，有良知的台灣人站出來了，民眾防中共滲透意識逐漸提高。\n\n\n2025年6月1日，「《國有器官》全球響（播）映活動」下午在台北西門町舉行，吸引許多\n\
  民眾駐足觀看。（宋碧龍／大紀元）\n\n許凱雄指出，中共滲透全球其實不分地區，連最強大的美國也遭受到大規模滲透。「只有\n真相能讓中共邪惡無所遁形，才能讓全世界的人覺醒。」他呼籲，大家堅持將真相廣傳，\n\
  一直到中共倒台。\n\n\n2025年6月1日，「《國有器官》全球響（播）映活動」下午在台北西門町舉行，吸引許多\n民眾駐足觀看。（宋碧龍／大紀元）\n\n由皮博迪獎得主章勇進導演的大型紀錄片《國有器官》，歷經七年製作，以真實的證據呈\n\
  現中共活摘器官的罪惡，影片已榮獲2023年加拿大雄獅獎最佳導演、最佳音樂獎、2024年\n美國金勛章電影競賽獎、2024藝術電影精神獎、曼哈頓電影節最佳人權紀錄片獎、紐約\n\
  True Venture影展最佳紀錄片獎等多項殊榮，並提名參加2025奧斯卡最佳長紀錄片獎角逐\n。\n\n責任編輯：李宇圓#\n\n新聞網址：\n\n參考資料：\n\
