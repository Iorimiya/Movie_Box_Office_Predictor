url: https://www.ptt.cc/bbs/movie/M.1730127157.A.8B2.html
title: '[新聞] 放映《國有器官》遭恐嚇 彰化議員：對的'
content: '新聞網址：

  放映《國有器官》遭恐嚇 彰化議員：對的事持續做



  【新唐人亞太台 2024 年 10 月 28 日訊】歡迎回來。紀錄片《國有器官》揭露中共活摘

  黑幕，10月起在台灣上映，主辦單位、多個影城、政府機構、警方，陸續遭到疑似中共網

  軍電子郵件恐嚇。台灣警方追查、並協助確保放映安全。《國有器官》持續在台灣各地放

  映，迴響熱烈。彰化縣議員莊陞漢，近期籌辦在彰化放映，

  ，他說，這只會讓大家更想了解真相。




  《國有器官》預告片：「當我望向他時，我看到他十分恐懼的眼睛。」


  透過參與中共活摘的醫生、受害者家屬等證詞，紀錄片《國有器官》描述中共多年來，大

  量活摘人體器官，販售後謀取暴利。《國有器官》在台灣上映中，卻頻傳出影院遭到威脅

  消息，現在連地方議會、議員都有收到。


  彰化縣議員 莊陞漢：「那我在10月27號大概下午的時間，發了臉書的（放映會）一個活

  動通知之後，在晚上就收到一封，可能是假名的一個信箱的一個恐嚇信，它說意思要去攻

  擊我的服務處，希望我在今天下午2點之前，把臉書的訊息撤銷。」


  彰化縣議員莊陞漢打開信箱，秀出恐嚇信，上頭聲稱已經放置多顆爆炸物，要求刪除《國

  有器官》的信息。而不只莊陞漢，彰化縣議會發出新聞稿指出，議會也同樣收到恐嚇信，

  並立即通報警局啟動應變機制，表示對危害公共安全行為採取零容忍態度，配方警方追查

  幕後黑手，絕不寬貸。


  彰化分局副分局長 鐘振邦：「刑警大隊的科偵隊跟鑑識科等，前往我們縣議會的相關處

  所，進行安全檢查，目前均未發現可疑的事物。」


  彰化縣議員 莊陞漢：「透過一個紀錄片其實是把一些事實，公諸給全球的人知道，我覺

  得這是一個，受到各國都一個肯定的一個紀錄片，有心人士實在是不需要透過這樣的方式

  ，只是讓大家更想去了解《國有器官》的真相。我們絕對不會向這樣子的恐嚇來低頭，我

  們相信對的事，我們會持續來做。」


  警政署刑事局追查《國有器官》遭恐嚇案，先前研判是中共網軍慣用滋擾手法，刑事局日

  前也收到Email，對方聲稱在總統府放置炸彈，威脅要台灣政府撤銷對恐嚇案的追查。主

  辦單位向記者表示，會堅持放映《國有器官》紀錄片，各地觀眾反應熱烈，感謝多城市警

  方協助確保放映安全。並提到恐嚇信顯示中共害怕真相曝光，如果保持沉默，等同放任中

  共把壓迫言論自由、迫害法輪功的暴政，延伸到台灣。


  新唐人亞太電視 葉錫鴻 曾奕豪 曾馨旻 台灣彰化採訪報導


  --'
