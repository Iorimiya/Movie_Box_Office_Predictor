title: '[新聞] 《國有器官》在韓國影院首映 引觀眾共鳴'
content: "《國有器官》在韓國影院首映 引觀眾共鳴\n\n\n10月16日晚，揭露中共活摘器官罪行的電影《國有器官》首次在韓國京畿道龍仁市某劇院\n正式上映。（韓基民／大紀元）\n\
  \n【大紀元2025年10月17日訊】（大紀元記者鄭香梅韓國採訪報導）10月16日晚，揭露中共\n活摘器官罪行的電影《國有器官》首次在韓國京畿道龍仁市某劇院正式上映。韓國觀眾紛\n\
  紛表示，影片讓他們震驚，了解到中共對法輪功群體的活摘器官迫害仍在持續；許多人反\n思人權與良知的重要性，並呼籲更多人觀看影片、了解真相。\n\n影片《國有器官》歷經七年製作，通過追尋兩位失蹤青年的行跡揭露中國境內的活摘器官\n\
  問題，曾在美國、澳洲、加拿大、日本、台灣等地引發熱烈反響。\n\n今年5月末，該片被選為韓國第5屆首爾翠雀花國際電影節的開幕作品，並計劃在韓國影院\n上映。然而，原計劃上映該片及另幾部涉及中國人權電影的CGV影院以「可能影響中國市\n\
  場業務」為由，要求主辦方取消放映安排，主辦方臨時聯絡的另一家影院MEGABOX東大門\n分店也在開幕式前一天晚間突然無預告地單方面宣布取消上映，相關電影信息也已被全部\n\
  刪除。\n\n主辦方為此展開多次抗議活動，要求影院公開取消理由並致歉。《國有器官》一片也僅在\n電影節開幕式與教會及藝術中心的放映廳安排上映。\n\n10月16日，韓國民眾自發租用劇院場地，在京畿道龍仁市某劇院舉辦《國有器官》放映會\n\
  。鑒於此前劇場取消放映和拒絕租場地的情況，市民們請求記者不要公開劇院的具體資訊\n，以防受到干擾。\n\n觀眾被真相震撼 盼《國有器官》受廣傳\n\n居住在龍仁市的某教會執事在觀影後表示，他此前曾在地鐵站前看到身穿黃色服裝的法輪\n\
  功學員，那時他對法輪功有誤解，但在看電影《國有器官》的過程中，產生了一種「拼圖\n終於拼上了」的感覺，「原來他們一直受到這樣的迫害卻無法發聲，原來他們是在長年堅\n\
  持抗爭啊！我這才知道，當年我看到的那些場景——是他們在揭露『活摘器官』這件事。\n」\n\n他進一步談到，電影中描述的畫面令他毛骨悚然，「當時我全身起了雞皮疙瘩。腦中浮現\n\
  一個念頭：『他們在中國幹的事，難道將來也會發生在韓國？』\n\n「像我這樣的人，在韓國還有很多。」他說，「大家都在逐漸覺醒。那些原本以為『不可\n能吧』的人，看了電影後才意識到，這一切正在真實地發生。」\n\
  \n一位攜兒女前來觀影的父親表示，自己在韓國國會附近上班，午休時偶爾會看到有人舉著\n與中共活摘器官相關的標語，「我對此比較關心，自己也查過資料，當時還以為『這種鎮\n\
  壓應該都結束了吧』。但是看完電影《國有器官》我才發現，這並沒有結束，而是仍在繼\n續，這讓我非常震驚」。\n\n他就讀初中二年級的兒子說，「想到這樣的事未來可能也會發生在韓國，真的很可怕。」\n\
  \n這位父親還表示，「我希望這部電影能被更多人看到。我希望孩子們能了解這樣的現實，\n從小就具備分辨是非的眼光。」\n\n一位在朋友的推薦下前來觀看《國有器官》的職場女性眼眶濕潤，哽咽著表示，「我雖然\n\
  大致聽說過（中共活摘器官），但這次通過電影親眼看過後，真的非常心痛。」「其實我\n以前是刻意不去看這類內容的，但我現在覺得，直面現實也需要勇氣。」\n\n「我覺得這是一部所有韓國人都必須看的電影，因為這就是我們的現實。」她接著說，「\n\
  我意識到，必須把中共和中國人區分來看……如今據說中國有30萬人被關押、無名無權地\n消失了，朝鮮人民也正承受類似的苦難。」\n\n龍仁市某學校師生與校長一行21人共同觀影，校長表示，自己是在家長的介紹下才知道這\n\
  部電影的，「我以前聽過中國器官移植的傳聞，但沒想到問題竟如此嚴重。雖然影片中沒\n有血腥畫面，但光是呈現的內容就足以令人展開想像。」\n\n該校長還表示，「『沉默就是縱容』，我認為孩子們應具備看清時代的眼光。這樣的悲劇\n\
  絕不能重演。我希望更多人了解真相，也感謝製作團隊為我們帶來這樣一部電影。」\n\n同行的初一學生表示，「影片中最讓我震撼的是，中國共產黨一直以來完全無視人權，只\n\
  為自己的利益而剝奪他人的人權與器官。我希望更多人能知道這件事。」\n\n一名高二學生表示，「我原以為『活摘器官』只是某種惡劣的犯罪行為之一，但沒想到已\n有成千上萬的人因此犧牲。看到中共極力掩蓋事實的部分時，我真的很震驚。」\n\
  \n這名學生認為影片中最令人印象深刻的是，一名受害者家屬感嘆道：「感覺自己一個人在\n和全世界抗爭」。該學生表示，「我立志要成為一個有影響力的人，能夠去幫助這些受害\n\
  者。」\n\n一名正在就讀研究生的觀眾則表示，「這部影片沒有任何殘忍畫面，比較適合推廣，學生\n也能毫無負擔地觀看，但受害者家屬的證言能夠讓人感受到真相的分量。」\n\
  \n「以前我不明白為何有人提到『器官販賣』，現在才知道那並不是為了治病救人，而是被\n濫用於延壽或美容產業，已經形成了如同毒品卡特爾般龐大的器官黑市。」他說，「影片\n\
  讓我聯想到當今社會的氛圍——做什麼都被壓制，媒體則保持沉默。」\n\n這名觀眾還說，「通過這部電影，我多少理解了法輪功為何會遭受如此迫害……所以我認\n為，類似於這部紀錄片的真相之作，應該更多地上映，才能喚醒沉睡中的人們。」\n\
  \n責任編輯：林琮文#\n\n新聞網址：\n\n\n\n\n參考資料：\n\n\n\n\n\n\n\n放映場次： \n\n目前，紀錄片《國有器官》在各大串流平台都能觀看\n\
  \n\n\n盼越來越多民眾藉此了解真相，喚起正義良知。\n\n\n--\n「川普總統天天看大紀元」 獲讚賞      \n川普接受大紀元專訪：美國強硬才能贏得\
  \ \n大紀元記者手札：坐隨總統出行         \n讚大紀元新唐人是很棒的團體               \n川普次子讚大紀元 \n川普 新唐人記者講述經歷\
  \ 贏得全體內閣掌聲 \n\n--"
