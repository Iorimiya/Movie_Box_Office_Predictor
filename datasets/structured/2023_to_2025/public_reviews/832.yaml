title: '[新聞]《國有器官》參與角逐第97屆奧斯卡長紀錄片'
content: "《國有器官》參與角逐第97屆奧斯卡長紀錄片\n\n\n2024年9月4日，美國電影藝術與科學學會確認，《國有器官》進入第97屆奧斯卡（2025）\n\
  最佳長紀錄片角逐名單。（加拿大如意電影公司提供）\n\n【大紀元2024年09月05日訊】（大紀元記者楊欣文加拿大溫哥華報導）2024年9月4日，美\n國電影藝術與科學學會確認，加拿大如意電影公司製作的《國有器官》獲第97屆奧斯卡（\n\
  2025）最佳長紀錄片競賽資格，已進入奧斯卡評審階段。\n\n奧斯卡最佳長紀錄片獎是奧斯卡金像獎的其中一個獎項，每年由美國電影藝術與科學學會\n頒發給該年度最傑出的紀錄片。\n\
  \n《國有器官》由美國拱石娛樂全球發行，皮博迪獎得主章勇進導演執導。影片透過兩個家\n庭長達二十年的尋親歷程，以大量第一手證詞，層層揭開了中共最隱祕的國家犯罪——對\n\
  法輪功信仰群體實施的活摘器官。電影揭示了過去25年來中國社會最重要的一段歷史：法\n輪功因其迅速發展而遭江澤民集團嫉恨，從而遭受了前所未有的迫害，包括以國家機器進\n\
  行的活摘器官，並形成了龐大的商業化產業鏈。\n\n章勇進導演說：「鄭治醫生啟發了我拍攝這部電影。他是第一位親眼目睹活摘現場的（中\n國）軍醫，並勇敢站出來作證。他說活摘過程中甚至不使用麻醉藥。這一罪行的殘忍和他\n\
  的勇氣深深震撼了我。我希望盡我所能，幫助制止這一暴行。」\n\n《國有器官》自2024年起在美國、澳大利亞和台灣等地陸續上映，受到廣泛關注。\n\n澳大利亞新州上議員卡特（Susan\
  \ Carter）在觀看電影後表示：「這部獲獎影片所展示的\n問題是當今世界的一個現實問題。如果我們想看到改變，我們必須從了解這個問題開始。\n」\n\n在台灣上映期間，觀眾反響熱烈。台灣主流媒體給予高度關注，年代電視台《雅琴看世界\n\
  》；三立電視台《驚曝新聞線》《三立INews》；民視新聞台《台灣向前行》《台灣演義\n》；中華電視晚間新聞，以及寶島新聞等對製片團隊進行了專訪。公視新聞、自由時報、\n\
  台灣英語新聞、雅虎等多家新聞媒體給予了正面報導。\n\n製作團隊還受到了台灣陸委會主任委員邱垂正先生的特別接見。台灣國家人權委員田秋堇\n表示，這是一部所有台灣人都應該看的電影。\n\
  \n制止活摘罪行\n\n《國有器官》已榮獲加拿大電影雄獅獎最佳導演、最佳音樂獎、美國金勳章電影競賽獎、\n藝術電影精神獎、曼哈頓電影節最佳人權紀錄片獎等多項殊榮，並入圍蒙特利爾獨立電影\n\
  節和歐洲戲院電影節。\n\n紀錄片製作人宋美馨告訴《大紀元時報》記者，她希望美國人能夠觀看這部影片，了解中\n國普通家庭所面臨的苦難。她補充說，「讓我們一起努力阻止這種罪行。」\n\
  \n《國有器官》全台場次查詢：https://國有器官.tw\n\n\n\n\n--\n\n\n \n\n\n--"
