title: '[新聞]《國有器官》歐洲首映 影片揭中共活摘'
content: "新聞網址：\n\n\n《國有器官》歐洲首映 影片揭中共活摘黑幕\n\n\n《國有器官》影片真實又深入地揭露中共對法輪功的迫害以及活摘器官等罪行，引起世人\n\
  聚焦，潮湧的關注源源不斷。（加拿大如意電影公司提供）\n\n【大紀元2025年06月15日訊】（大紀元記者李明宇採訪報導）備受矚目的紀錄片《國有器\n官：揭露中國器官移植黑幕》（State\
  \ Organs: Unmasking Transplant Abuse in China\n）於週六（6月14日）在荷蘭烏特勒支Kinepolis影院舉行歐洲首映。\n\
  \n這部歷時七年製作的震撼之作，以確鑿證據揭露了中共系統性活摘器官的駭人罪行，引發\n國際社會對中國人權狀況的深切關注。\n\n一位在荷蘭醫療公司任職、與中國醫院保持直接商業合作的觀眾觀影後深受震撼，表示要\n\
  嚴肅審視其業務往來的倫理底線。與此同時，荷蘭人權專家發出強烈呼籲，敦促國際社會\n採取行動，徹底終結中共活摘器官這一突破人類文明底線的暴行。\n\n主辦方：七年血淚調查震撼全球\n\
  \n這部由加拿大華裔導演章勇進傾力打造的紀錄片歷時七年，通過大量第一手證詞、獨家深\n度採訪，全景式揭示了中共自1999年以來針對法輪功學員及其他良心犯群體實施的系統性\n\
  器官活摘暴行。\n\n《國有器官》紀錄片由民間慈善組織「Hello Taiwan」與荷蘭台灣專業青年協會（Taiwan\n Young Professionals\
  \ in the Netherlands）於烏特勒支共同主辦。此次放映會獲得荷\n蘭六六民主黨（Democraten 66）眾議院議員、對中政策跨國議會聯盟（IPAC）荷蘭共同\n\
  主席揚楣那蜈薸帕特諾特（Jan Maarten Paternotte）的出席與支持。\n\n荷蘭台灣專業青年協會會長Lily女士觀影後在接受大紀元採訪時表示，「首次完整觀看這\n\
  部影片時，我被深深震撼了。」\n\n「證人與倖存者的每一句敘述都直擊人性最深處的痛苦，特別是那位中國醫師以異常平靜\n的語調描述首次執行器官摘除命令的片段，那種『道德與人性的深刻撕裂』令人終生難忘\n\
  。」她說。\n\n影片以兩名年輕法輪功學員被強制抓捕後神祕失蹤為敘事主線，深度記錄了他們家人踏上\n尋親之路的艱難歷程。影片通過對眾多受害者、家屬及親歷者的深入採訪，以及史無前例\n\
  地公開了一名曾直接參與活摘器官的中國醫生的震撼證詞，撕開了中共系統性活摘良心犯\n器官的驚天黑幕。\n\n\n影片放映結束後，《國有器官》紀錄片主辦方及荷蘭台灣專業青年協會會長Lily女士與現\n\
  場觀眾進行交流。（李明宇／大紀元）\n\nLily並非法輪功修煉者，她認為，這部影片並非只是一部關於中國問題的紀錄片，而是關\n乎全球人權與醫療倫理的警世之作。她說：「這不僅是器官買賣，更是國家暴力機制以技\n\
  術語言掩蓋人道災難。」影片集中揭露了中共政權如何藉助國家機器與醫療系統，壓迫法\n輪功、維吾爾人、藏傳佛教徒及地下教會基督徒等群體，構成對生命、信仰與良知的三重\n\
  迫害。\n\n中共活摘器官的罪惡行徑最早於2006年被勇敢的舉報人在大紀元曝光，在國際社會引發持\n續而廣泛的關注。2019年6月，英國倫敦「中國法庭」經過嚴密調查後正式裁定：中共政\n\
  權大規模活摘良心犯器官，主要受害對象為法輪功學員，此行為構成反人類罪與酷刑罪。\n這是具有里程碑意義的判決。\n\n《國有器官》自問世以來，已在美國、澳洲、日本、台灣等國家和地區放映超過300場次\n\
  。此次在荷蘭播放的籌備過程中，主辦方遭遇了一系列可疑的騷擾活動，包括頻繁的無聲\n電話騷擾以及試圖索取參與學者名單的可疑私人信息。雖然這些行為並未構成實質性威脅\n\
  ，但顯示出即使在法治國家，揭露中國人權問題仍伴隨隱性壓力。在荷蘭警方的專業風險\n管控下，首映活動得以順利完成。\n\n主辦方強烈呼籲：自由社會的沉默等同於對暴行的縱容，我們期待歐洲乃至整個國際社會\n\
  攜手共同捍衛民主、人權與信仰自由的普世價值，也希望更多的人能夠觀看這部紀錄片，\n了解這些被掩蓋的真相。\n\nLily印象最為深刻的是現場一位觀眾的反應，她說：「一位在荷蘭醫療公司工作、與中國\n\
  醫院有直接業務往來的觀眾在觀影後深受觸動，開始認真反思其業務關係的道德合理性。\n這樣的覺醒正是我們希望看到的。」\n\n歐洲專業人士觀影後深感震驚\n多位歐洲觀眾分享了觀後感，對中共活摘器官深感震撼。\n\
  \n一位來自荷蘭的IT從業者表示：「我以前只是略有耳聞，但影片展現的系統性殺戮規模和\n殘酷程度令人難以置信。為了摘取器官而有組織地殺人，這幾乎超出想像。」\n\
  \n另一位來自前蘇聯加盟共和國、目前從事金融行業的觀眾深有感觸地說，該片還揭示了極\n權主義的本質及其對文化和個體的壓制。「如今中國（中共）政權的做法，是極權暴政的\n\
  延續。這讓我回想起蘇聯時期的經歷，連攜帶母語書籍都可能遭殃。」\n\n一位荷蘭觀眾表示，「作為醫生，本應救人，怎麼能參與這種非人行為？」另一位觀眾則\n指出：「一旦某個群體失去人性底線，一切暴行都變得可能。納粹、斯大林如此，現在，\n\
  顯然中共也是如此。」\n\n兩位觀眾還談及與威權國家建立經濟聯繫的道德代價，一位觀眾說：「我們每天的消費選\n擇，可能在無形中資助暴政。這促使我們必須重新審視與這樣的政權進行商業往來的倫理\n\
  底線。」\n\n荷蘭觀眾坦言：「我不一定相信宗教意義上的報應，但我相信你投向世界的善惡，最終會\n以某種方式回到你身上。如果你對殘暴保持沉默或默許，那你就成為了罪惡鏈條中的一環\n\
  。」\n\n兩人均表示，認同法輪功倡導的「真、善、忍」價值觀，這是任何正義社會都應當具備的\n核心價值。\n\n華人：點燃人權覺醒的希望之光\n\n旅居荷蘭近三十載的羅女士在觀看紀錄片《國有器官》後，分享了她對這部震撼之作的感\n\
  悟。「這不是一部供人『欣賞』的影片」，羅女士坦言，「而是一部讓人窒息、令人深思\n的紀錄片。它通過極其冷峻的鏡頭語言，無情揭示了中共治下系統性活摘器官的滔天罪行\n\
  ，徹底挑戰了人類道德文明的底線。」\n\n兩個場景在羅女士心中留下了深刻印象，一個場景是軍醫回憶親身經歷活摘器官手術時，\n被受害者眼中流露出的「極度恐懼神情」；另一個場景是開場宣傳海報中針頭直刺眼球、\n\
  瞳孔中映射出象徵中共的五星紅旗畫面。她認為，這深刻揭示了中共政權在這一駭人罪行\n中所扮演的核心角色。\n\n羅女士進一步表示，該片的意義遠不止於揭示中共的具體暴行，更重要的是直指共產主義\n\
  意識形態那種反人類的價值體系本質，這是「對生命神聖性的極端褻瀆」。\n\n\n《國有器官》紀錄片放映前，主辦方在現場進行準備工作。（李明宇／大紀元）\n\n紀錄片真實呈現法輪功學員遭遇的殘酷迫害\n\
  \n荷蘭法輪大法佛學會負責人王家恩女士在觀影後表示：「這部紀錄片具有震撼人心的力量\n，它以無可辯駁的真實性呈現了法輪功學員在中國大陸的悲慘遭遇。僅僅因為堅持『真、\n\
  善、忍』的純正信仰並努力成為更好的人，法輪功學員卻遭到中共政權最殘酷無情的迫害\n。」\n\n「無數法輪功學員被從家中強行帶走或直接綁架，他們的家人至今不知道親人的下落在何\n\
  方。有多少破碎的家庭仍在無盡的痛苦等待中，依然期盼著能與至愛親人重聚的那一天？\n」她說。\n\n王家恩說：「中共建立並系統性地實施所謂『按需殺戮』的恐怖機制，強行摘取法輪功學\n\
  員的器官，這種前所未有的罪行被國際社會定性為種族滅絕或冷酷的種族滅絕，堪稱人類\n歷史上前所未有的邪惡行徑。」她呼籲國際社會通過制定嚴厲的法律制裁措施與國際聲援\n\
  行動，徹底遏制活摘器官的反人類暴行。\n\n基金會創辦人呼籲：立法切斷非法器官交易供應鏈\n荷蘭教育機構MetaStory研究所基金會創辦人塔姆‧德‧勒爾（Tamme\
  \ de Leur），在觀影\n後對大紀元表示，這部紀錄片通過詳實記錄和案例，揭露了中共活摘器官的殘酷事實，「\n這些血淚見證本身就是最有力的證據」。\n\n\
  這位長期關注人口販運的人權專家強調，影片展現了法輪功學員因信仰遭受迫害的悲慘遭\n遇，以及他們面對暴行時展現的堅韌精神，令人震撼。\n\n塔姆認為，器官移植市場的全球化需求助長了這一罪行的持續發生。中共在器官移植問題\n\
  上的極度不透明，拒絕國際獨立調查，令人質疑。\n\n\n影片放映結束後，現場觀眾與嘉賓進行互動交流。參與對談的嘉賓從左至右：荷蘭教育機\n構MetaStory研究所基金會創辦人塔姆‧德‧勒爾（Tamme\
  \ de Leur）、《國有器官》紀錄\n片主辦方及荷蘭台灣專業青年協會會長Lily，以及「醫生反對活摘器官協會」（DAFOH）\n歐洲部副主任安德烈亞斯‧韋伯（Andreas\
  \ Weber）醫生。（李明宇／大紀元）\n\n塔姆進一步指出，中共的暴行不僅針對法輪功學員，還系統性地擴展至維吾爾族及其他無\n辜群體，構成「國家恐怖主義」。\n\
  \n他強烈呼籲國際社會支持相關立法行動，如美國推進的《法輪功保護法案》，並熱切希望\n荷蘭政府能夠效仿美國，制定類似的法案，切斷非法器官交易供應鏈。他表示，此暴行不\n\
  僅戕害受害者，還使不知情的移植患者無意中成為國家犯罪的共謀者。\n\n責任編輯：李宇圓\n\n\n--"
