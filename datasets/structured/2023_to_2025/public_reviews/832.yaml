url: https://www.ptt.cc/bbs/movie/M.1736490134.A.C70.html
title: '[新聞] 《國有器官》再獲多個獎項 影評：扣人心弦'
content: "《國有器官》再獲多個獎項 影評：扣人心弦\n\n圖：\n《國有器官》榮獲紐約國際電影獎（New York International Film\
  \ Awards）。\n（加拿大如意電影公司提供）\n\n【大紀元2025年01月09日訊】「《國有器官》是一部令人震驚、扣人心弦且引人入勝的人\n權紀錄片」，美國專業電影期刊《紐約電影大師》（New\
  \ York Movie Guru）在影評中讚\n賞道，「這是一部成功的作品。」\n\n深度揭露中共對法輪功的迫害以及活摘器官的電影紀錄片《國有器官》由加拿大華裔導演\n\
  章勇進（Raymond Zhang）執導，於2023年在加拿大製作完成，當年7月榮獲加拿大電影雄\n獅獎（Leo Awards）最佳音樂和最佳導演獎。繼2024年榮獲美國金勛章電影競賽獎、2024\n\
  藝術電影精神獎、曼哈頓電影節最佳人權紀錄片獎後，近日再榮獲多個國際獎項，並獲得\n影評人高度評價。\n\n《國有器官》最新獲得的獎項包括：\n\n‧ 紐約最佳導演獎紀錄片類金獎（Gold\
  \ Award for Best Director Awards New York）\n\n‧ 紐約奧倫諾（又譯奧尼羅）電影獎（Oniro Film Awards-\
  \ New York）\n\n‧ 紐約國際電影獎（New York International Film Awards）\n\n圖：\n《國有器官》榮獲紐約最佳導演獎紀錄片類金獎（Gold\
  \ Award for Best Director\nAwards New York）。（加拿大如意電影公司提供）\n\n圖：\n《國有器官》榮獲紐約奧倫諾電影獎（Oniro\
  \ Film Awards- New York）。\n（加拿大如意電影公司提供）\n\n此外，《國有器官》近期入選四個國際獎項：\n\n‧ 美國影響力紀錄片獎（Impact\
  \ Docs Awards）\n\n‧ 義大利羅馬稜鏡電影獎（Rome Prisma Film Awards）\n\n‧ 加拿大黃刀國際影展（Yellowknife\
  \ International Film Festival）\n\n‧ 美國獨立電影獎（The IndieFest Film Awards）\n\n導演章勇進表示：「能夠獲得這些獎項，我們心懷謙卑與感恩。特別感謝紐約最佳導演獎\n\
  、奧倫諾電影獎和紐約國際電影獎，也感謝美國、加拿大和義大利電影人對我們的支持。\n近來，中共試圖把對法輪功的迫害輸出到美國，特別是在紐約，在這樣一個背景下，能得\n\
  到這些獎項的肯定，這有助於幫助人們了解中共過去二十五年來對法輪功團體的迫害，幫\n助制止這一殘酷罪行，拯救生命。這些電影獎項的創立者，評委做了一件大好事。在不久\n\
  的將來，當自由回歸中華大地時，他們會因此刻的善良與勇敢，被人們記住。」\n\n電影同時獲得《紐約電影大師》、《亞洲電影脈博》等專業期刊影評人的高度評價。《紐\n\
  約電影大師》影評人稱讚該片「引人入勝」，「講述了中國法輪功修煉者如何被中國政府\n囚禁、折磨並進行器官摘取。讓人感到心碎、憤怒和不安。」\n\n《亞洲電影脈博》評價說：「《國有器官》講述了中國共產黨對其人民犯下的一樁最嚴重\n\
  的罪行，影片向我們介紹了兩個案件，這些案件揭示了整個事件的真相，並為此事提供了\n歷史視角。\n\n「影片展現的事實令人痛苦，它不僅揭示了一個獨裁政權的面貌，更深入探討了反人類的\n\
  黑暗深淵。\n\n「這個政權是如何向人民和媒體編造謊言，把法輪功及其成員貼上政府敵人的標籤，來掩\n蓋對他們的監禁與屠殺，這讓人大開眼界。」\n\n\n2024年7月15日晚，《國有器官》在台北光點華山電影館試映，台灣主流人士到場關注中\n\
  共活摘罪惡，資料照。（宋碧龍／大紀元）\n\n觀眾：如此地真實\n\n許多觀眾在社群媒體和電影相關網站上留言，表達他們對電影的支持。一位台灣觀眾在社\n交媒體Threads的留言中寫道：「這是我從小到大唯一看到感覺整個人快要窒息的電影。\n\
  雖然理智上知道我在一個安全的地方，看著一部紀錄片，但我的心跳還是不停加快；不是\n因為其中有任何過於驚悚的畫面，而是因為終於意識到這整件事情竟然是如此地真實，而\n\
  且規模如此龐大。回想起來，我認為那時自己的動物生存本能被觸發了，充滿恐懼，想要\n逃離，想要掙扎，想要反抗，不是對於電影，是對於中共。這個體驗最讓我震驚的地方在\n\
  於，我本以為反共是出於政治上的選擇，或者是出於人性的道德良知；但從未想過，原來\n可以僅僅是出於生物的本能，就不希望它存在。」\n\n2025年電影將在日本、韓國、以色列、新加坡、馬來西亞、法國、斯洛維尼亞等國公映。\n\
  \n更多詳情請登錄《國有器官》官網查詢：\n\n《國有器官》也可以在乾淨世界上租看。\n\n責任編輯：李盈#\n\n相關文章\n\n    《國有器官》遭炸彈恐嚇\
  \ 台灣不畏威脅如期播映圖 2024-12-06\n    《國有器官》角逐2025年奧斯卡長紀錄片獎圖 2024-12-11\n    《國有器官》台南議會放映\
  \ 助台人認清中共邪惡圖 2024-12-10\n    「每個人都應知道的真相」 《國有器官》花蓮首映迴響熱烈圖 2025-01-07\n\n\n新聞網址：\n\
  \n\n《國有器官》台灣放映場次：\n\n揭露中共高官延壽內幕\n\n第一位勇敢站出來作證目睹活摘現場的軍醫，\n\n鄭治：活摘過程中甚至不使用麻醉藥\n\n\n\
  --\n\n美國國會宣讀《大紀元》歷史 永錄國會記錄\n\n\n\n--"
