url: https://www.ptt.cc/bbs/movie/M.1739624191.A.E60.html
title: '[新聞] 《國有器官》再獲美國影響力紀錄片等獎項'
content: "《國有器官》再獲美國影響力紀錄片等獎項\n\n\n紀錄片《國有器官》榮獲美國獨立電影獎。（加拿大如意電影公司提供）\n\n【大紀元2025年02月15日訊】「這是一部必看的電影，不僅因為其引人入勝的敘事，更因\n\
  為該電影擁有激發變革的力量。」美國電影導演及作家Ian Kane在觀看紀錄片《國有器官\n》後讚賞道。\n\n紀錄片電影《國有器官》近日榮獲2025年度美國影響力紀錄片獎等多個國際獎項。該影片\n\
  由加拿大如意電影公司製作，華裔導演章勇進（Raymond Zhang）執導。\n\n美國影響力紀錄片的評委給予該影片高度評價，「皮博迪獎得主章導演的紀錄片追蹤了中\n\
  國家庭二十年來尋找失蹤親人的過程。他們揭開了一個可怕的國家運營的器官摘取，揭露\n了共產黨內部的腐敗與難以言喻的殘暴。這部強而有力的電影揭示了法輪功修煉者所遭受\n\
  的悲慘迫害及他們面臨的難以想像的暴行。」\n\n《國有器官》最新獲得的獎項包括：\n\n‧ 美國影響力紀錄片卓越獎（Impact Docs Awards of\
  \ Excellence）\n\n‧ 美國獨立電影獎戲劇影響力卓越獎（The IndieFest Film Awards: Awards of\nExcellence：Viewer\
  \ Impact）\n\n‧ 美國獨立電影獎觀眾影響力卓越獎（The IndieFest Film Awards: Award of\nExcellence:\
  \ Dramatic Impact）\n\n‧ 美國獨立電影獎卓越獎特別提名（The IndieFest Film Awards: Award of\nExcellence\
  \ Special Mention）\n\n‧ 曼谷電影獎（影評人協會獎）(Bangkok Movie Awards: Bangkok Society of Film\n\
  CRITICS’ Award)\n\n\n紀錄片《國有器官》榮獲曼谷電影獎（影評人協會獎）。（加拿大如意電影公司提供）\n\n此外，《國有器官》近期入選四個國際獎項：\n\
  \n‧ 倫敦導演獎 London Director Awards\n\n‧ 好萊塢發現獎 Hollywood Discovery Awards\n\n‧ 蒙特利爾女性電影節\
  \ Montreal Women Film Festival\n\n‧ 波士頓獨立電影節 Boston Indie Film Festival\n\n\n紀錄片《國有器官》獲波士頓獨立電影節提名。（加拿大如意電影公司提供圖片）\n\
  \n2025年以來，《國有器官》入圍義大利羅馬棱鏡獎、加拿大黃刀國際影展，並榮獲紐約國\n際電影獎、紐約最佳導演獎紀錄片類金獎、紐約奧尼羅電影獎。目前《國有器官》共獲得\n\
  12項提名及13個國際影展獎項。\n\n美國電影導演Kane説：「這是一部節奏緊湊的紀錄片，透過現實重現和引人入勝的訪談無\n縫融合，牢牢吸引觀眾的注意……既扣人心弦又充滿現實感……影片揭示了當代最黑暗的\n\
  人權侵害。」\n\n3月23日，《國有器官》將在卑詩省本拿比的Shadbolt Art Centre舉行首映會及映後影談\n。\n\n以下是購票鏈接，大紀元讀者可使用優惠代碼DJY25獲得優惠。\n\
  \n\n查看更多電影資訊，請瀏覽網站： ◇#\n\n\n2024年11月28日，中正大學演藝廳放映《國有器官》紀錄片，映後：目睹「活摘現場」的\n證人鄭治醫師、前國防部軍事法院檢察長李正雄（中）、雄獅影視負責人管建忠先生（左\n\
  ），進行與觀眾座談交流。（大紀元）\n\n責任編輯：李盈\n\n新聞網址：\n\n\n《國有器官》台灣放映時間表 \n\n\n--\n            \
  \      \n\n\n\n--"
