title: '[新聞] 《國有器官》曝光中共活摘惡行 議員包場籲'
content: '《國有器官》曝光中共活摘惡行 議員包場籲共同發聲



  8月30日晚間，新竹市議員楊玲宜服務處以包場形式邀民眾觀看《國有器官》，希望透過

  電影讓更多人關注中共活摘器官的人權議題。（林倩玉／大紀元）


  【大紀元2024年09月01日訊】（大紀元記者林倩玉新竹報導）歷時七年拍攝，榮獲加拿大

  「雄獅電影獎」、美國曼哈頓電影節「最佳人權紀錄獎」等多項國際獎項的大型紀錄片《

  國有器官》，8月30日晚間在新竹大遠百威秀影城放映。此場由新竹市議員楊玲宜服務處

  主辦，同時也在映後舉辦座談會。「《國有器官》揭露中共最怕曝光的活摘器官惡行！」

  楊玲宜表示，希望透過這部電影擴大影響力，讓更多人關注中共活摘器官的人權議題。




  映後座談會由楊玲宜擔任主持人，追查國際台灣分會祕書長管建忠、台灣器官移植關懷協

  會理事黃裕峰、前議員同時也是新竹信賴之友會祕書長李妍慧等人擔任與談人。


  《國有器官》揭露真實中共統治下的社會


  楊玲宜表示，數週前她曾觀看《國有器官》在新竹的首映，那一場映後的與談人之一鄭治

  醫師，也就是在電影中自述曾親歷中共軍隊活體摘除一位未滿十八歲的軍人腎臟及眼球特

  別行動的前瀋陽陸軍總院實習醫生，淚訴被迫參與活摘器官的過程，讓她非常震撼。


  楊玲宜說，生在自由民主法治的台灣，很難想像在海峽的另一頭，中共的政權正在殘酷的

  迫害、虐殺自己的人民。他們僅是與中共思想不同、宗教信仰不同就被抓捕，甚至未受到

  公平的審判就被關押到集中營，猶如進入屠宰場，任人宰割下他們的器官變成了商品。得

  知這樣的訊息，實在令她痛心。


  楊玲宜表示，藉由此次包場，希望邀請更多民眾觀看《國有器官》紀錄片，讓大家更清楚

  真實中共統治下的社會，並思考我們能做些什麼為受害者發聲。


  楊玲宜也透露，因報名人數實在太踴躍，不到一週將近有170位民眾報名，為了容納更多

  觀眾，臨時將租借的小廳館改成更大的廳館，但仍有許多民眾無法進場。後續她也會將《

  國有器官》放映訊息透過自己的臉書傳達，希望還未看過這部電影的民眾把握機會。



  新竹市議員楊玲宜表示，《國有器官》揭露中共最怕曝光的活摘器官惡行！希望透過這部

  電影擴大影響力，讓更多人關注中共活摘器官的人權議題。（林倩玉／大紀元）


  面對活摘器官 人人都是當事者


  管建忠是追查國際台灣分會祕書長，同時也是雄獅影視負責人。他提到將《國有器官》引

  進台灣的初衷時說，法輪功的議題加上活摘器官的真相，目前在市面上的影劇是看不到這

  樣的題材的，因此在美國受到片商很大的關注。


  《國有器官》透露的訊息豐富，包含呈現群體滅絕跟國家犯罪的議題。中共對法輪功的迫

  害定性在「亡黨亡國」，整個國家的運作就像為法輪功而存在，25年來對法輪功的群體滅

  絕，如同二戰時期希特勒對猶太人的種族清洗，但中共有過之而無不及。希特勒戰敗後，

  關押猶太人的集中營被打開，未見活人只見白骨的景象讓人不寒而慄，但中共除了摘器官

  ，連屍骨都運用了，在見不到白骨累累的景象下，很多人感受不到中共的殘酷，這非常可

  怕。


  管建忠接著說，許多國家的人不明真相，紛紛跑到中國換器官，加速法輪功學員被虐殺，

  中共甚至把活摘來的器官當成賄賂他國元首的工具。龐大的利益也讓活摘器官從中國內部

  蔓延到東南亞，非常邪惡。


  「《國有器官》就是來警醒世人的！」管建忠說，台灣離中國大陸這麼近，台灣人更應該

  知道在中國發生這麼殘酷的事情。雄獅影視將此片引進台灣，希望台灣人能明白，活摘器

  官不單單針對法輪功學員，而是影響著每個人。「人人都是當事者！」大屠殺就在我們的

  面前，每個生命面對這樣的議題都應該表態，趁現在還來得及都應該站出來制止。



  追查國際台灣分會祕書長管建忠表示，面對活摘器官，人人都是當事者。（林倩玉／大紀

  元）


  活摘器官慘絕人寰 不應在人類世界出現


  李妍慧表示，她對法輪功學員的遭遇有相當的了解，也相當支持法輪功。觀看《國有器官

  》時，她的心情非常沉重，相當痛苦。「如果連坐在電影院看這部紀錄片心情都如此，可

  想身為被迫害的法輪功學員家屬，或被活摘器官的當事人，在面臨這樣的酷刑時是多麼的

  恐懼。」「這樣慘絕人寰的景象不應在人類的世界出現！」


  李妍慧也分享說，今年八月她到英國旅遊時，在倫敦的中國城看到法輪功學員在靜坐，地

  上放著法輪功學員在中國被迫害的真相，吸引了許多人駐足觀看、了解。法輪功學員沒有

  放棄讓人了解真相的機會，非常可貴。



  8月30日晚間，《國有器官》在新竹大遠百威秀影城放映，映後座談會由楊玲宜（右1）擔

  任主持人，（左起）前議員李妍慧、追查國際台灣分會祕書長管建忠、台灣器官移植關懷

  協會理事黃裕峰擔任與談人。（林倩玉／大紀元）


  推動刑事專法 有效制止活摘器官


  全球普遍存在移植器官短缺的問題，台灣亦是如此。黃裕峰表示，追查國際台灣分會2006

  成立，在調查中發現，台灣從2002年起開始有大量的病患前往中國「買器官」，採用旅行

  社帶團方式成團成團帶過去「買肝」「買腎」，而且配對速度非常快，從提出需求到有器

  官可換，僅需一到二週的時間，最久不超過一個月。


  2015年6月12日，台立法院三讀通過《人體器官移植條例》修正案，同年7月1日修正公布

  新增第10條第4項規定，台灣人赴境外接受器官移植後，回台灣接受後續治療者，應提供

  移植之器官類目、所在國家、醫院及醫師等書面資料予醫院，醫院並應完成通報作業。


  黃裕峰說，此法案的公布實施，大幅降低台灣人赴境外換器官的數量，但為了更有效的制

  止活摘器官，台灣器官移植關懷協會自2023年起開始推動《反活摘器官法》刑事專法，規

  範對象包括台灣病患、仲介、醫師，同時也將禁止境外涉及活摘器官的相關人員進入台灣

  。


  黃裕峰也呼籲，民眾若聽到有親友想到中國換器官，一定要讓對方知道活摘器官的真相，

  以免成為活摘器官的幫凶。


  《國有器官》近期場次：


  新竹 9月14（六）下午2:50竹北享平方影城，網路訂票可上或

  電洽0922042675


  高雄 9月14（六）下午3:00高雄台鋁影城，購票可電洽0933059689


  《國有器官》全台場次查詢：https://國有器官.tw


  責任編輯：陳玟綺





