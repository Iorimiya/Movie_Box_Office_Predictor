title: '[新聞] 《國有器官》再獲獎 導演：只是告訴觀眾真'
content: "《國有器官》再獲獎 導演：只是告訴觀眾真實的故事\n\n\n4月19日，《國有器官》榮獲紐約True Venture電影節最佳記錄片獎。圖為紐約True\n\
  Venture電影節的總監朱利安．比巴（Julian Biba，左）和《國有器官》導演章勇進。（\n加拿大如意電影公司提供）\n\n獲得「紐約真實創作電影節」最佳紀錄片獎\n\
  以當事醫生第一手資料曝光中共活摘人體器官犯罪\n\n （在6分38秒）\n\n【大紀元2025年04月22日訊】（大紀元記者趙芬妮紐約報導）「我覺得我的角色就是把一\n\
  個真實的、準確的信息反映給大家，讓大家看完之後，每個人都自己來解讀這種真實的情\n況。」\n\n由皮博迪獎得主章勇進導演的大型紀錄片《國有器官》，4月18日晚在毗鄰時代廣場的\n\
  The Producers’Club放映，並於19日榮獲紐約True Venture影展最佳紀錄片獎，這也是\n該影片在紐約獲得的第五個獎項。之前，《國有器官》已榮獲2023年加拿大雄獅獎最佳導\n\
  演、最佳音樂獎、2024年美國金勛章電影競賽獎、2024藝術電影精神獎、曼哈頓電影節最\n佳人權紀錄片獎等多項殊榮，並角逐2025奧斯卡最佳長紀錄片獎。\n\n\
  《國有器官》歷經七年製作，以真實的證據和感人的方式呈現中共活摘器官的罪惡，影片\n聚焦於兩個家庭尋找失蹤親人的經歷，講述了發生在中國的真實故事。\n\n二十多年前，兩位善良的年輕人神秘失蹤，他們的親人為了尋找真相，踏上了一段艱難的\n\
  旅程……影片展現大量的第一手證詞，包括對參與活摘醫生的獨家採訪、受害人失蹤前的\n錄音、專業律師的解析、國際權威調查等，從受害者及其家人的角度，深刻曝光大陸發生\n\
  的人口失蹤的殘酷現實。\n\n主辦方：電影感人至深\n\n放映結束後，電影製片人、主辦方均表達了對中國大陸發生的活摘器官真相的震驚與關注\n，他們認為這部電影「感人至深」，「人們需要知道真相」。\n\
  \n紐約True Venture電影節的總監（主辦方）、同時也是編劇、導演、製片人、演員的朱利\n安·比巴（Julian Biba）介紹，這是一個國際電影節，今年是舉辦「紐約真實創作電影\n\
  節」（New York True Venture Film Festival，NYTVFF）的第六年，這樣的活動「非常\n成功」，「我對來這裡的電影質量非常滿意，我們最大的故事是記錄片，因為它們真的很\n\
  好，競爭也非常激烈。」\n\n\n紐約True Venture電影節的總監、同時也是編劇、導演、製片人、演員的朱利安·比巴（\nJulian Biba）。（趙芬妮／大紀元）\n\
  \n而對於此次展出的電影《國有器官》，比巴認為「非常感人，深深觸動我的內心」。比巴\n來自阿爾巴尼亞，他說自己在共產主義國家出生和長大，「當我看到這個故事時，我感到\n\
  心碎，也感到沮喪，因為它引發了我在共產國家生活的回憶，這部影片感人至深，希望有\n一天那裡能發生改變，讓每個人的生活變得更好。」\n\n比巴表示，他深刻理解影片所談到的「共產主義」是導致悲慘的根源，「我也經歷過，見\n\
  過，我能感受到，我知道這就是問題所在。」\n\n比巴說，他的國家現在已經是一個民主國家，雖然也有各種困難，「但作為一個民主國家\n，你有選擇宗教信仰的自由。」\n\
  \n電影製片人司科維爾（Robert Scoville）在當天觀看《國有器官》後表示，電影中展現\n的真實故事「令人震驚」，特別是海外的大法弟子發起的對中共活摘器官的抵制、抗議遊\n\
  行等的勇氣，讓他佩服：「大家已經這麼努力地在行動，光是這一點就非常令人感動。」\n\n司科維爾認為這種深入人心的運動是「非常必要的」，「要持續對抗政府、對抗那些沒有\n\
  正義的法律。這（活摘器官）是一種非法的統治方式，人們需要知道真相。」\n\n\n電影製片人司科維爾（Robert Scoville）。（趙芬妮／大紀元）\n\n\
  導演：整個過程也是自我救贖的過程\n\n談起拍攝電影的初衷，導演章勇進說，自己的使命就是傳播真實的現實，每個人在這個現\n實面前都會有自己的感受，從而做出選擇。\n\
  \n「今天我們還有時間來追查這個反人類罪的發生，還有機會改變正在發生的歷史。如果我\n們每個人能採取一點點行動，看到今天的片子，把了解到這些內容跟我們的親朋好友、議\n\
  員去講的話，就有可能幫助中國的百姓生活得更加安全。」\n\n歷經七年的創作歷程，章勇進接觸了許多受訪者，這些人從不同角度講述了各自真實的經\n歷，其中的故事也感動了他本人，他坦言製作影片的整個過程也是一個「自我救贖的過程\n\
  」。\n\n「我採訪完鄭醫師的採訪完之後，他含著眼淚跟我說，他以前每天擔驚受怕、被人追殺的\n恐怖無所不在，之後這種無所不在的壓力煙消雲散了，好像自己的生命得到了一種救贖。\n\
  」\n\n「其實當時我並不理解是什麼意思，但是我回過頭來再看我這個製作過程的話，我發現其\n實做這個片子的過程呢，其實也是一個對我的一個自我救贖的過程。\n\n\
  因為我本身是生長在中國大陸，而且是來自部隊的家庭，本身多多少少都有一些黨文化那\n一套思維留下的陰影，在製作影片的過程當中，我發現一個就去掉一個，整個這過程啊，\n\
  我就覺得是一個去掉黨文化的這麼一個過程，同時也是對這個恢復我自己的一個正信的一\n個過程。而正信的加強，我覺得時時刻刻都有這個上天的這個眷顧和護佑吧。」\n\n\
  「也就是說，離中共越遠，離神越近，那你的生活就更加幸福，也更加安全。」\n\n章勇進表示，作為導演，提升自己的修為對於提升影片的表現力起到重要作用。\n\n「就是中國人講，藝如其人，文如其人，表現出來的東西其實你是無法掩蓋的，它是一個\n\
  自然的內心的流露。」他說，「我自己的修為方面有所加強，有所提升，才有可能讓這個\n片子再發揮它更大的作用，這是我的一個比較深的感受。」\n\n責任編輯：陳玟綺\n\
  \n新聞網址：\n\n參考資料：\n\n\n\n\n\n\n《國有器官》全台放映場次 \n\n或可在「乾淨世界」網站搜尋國有器官線上購買收看\n\n\n--\n\
