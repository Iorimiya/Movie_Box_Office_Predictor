url: https://www.ptt.cc/bbs/movie/M.1745987208.A.B99.html
title: '[新聞] 專訪《國有器官》導演：我最震撼的瞬間'
content: "專訪《國有器官》導演：我最震撼的瞬間\n\n【新唐人2025年04月28日訊】最近，加拿大大型紀錄片《國有器官》在紐約市「真實創作\n電影節」上斬獲最佳紀錄片獎。我們專訪了電影導演章勇進。\n\
  \n原中國大陸醫師鄭治：「我對面的醫生讓我去取眼球。當我望向他時，我看到他十分恐懼\n的眼睛。他的眼皮還在動，他是活的。」\n\n大型紀錄片《國有器官》榮獲多個國際獎項，由皮博迪獎（Peabody\
  \ Award）得主、華裔\n導演章勇進（Raymond Zhang）執導。影片主要講述了1999年7月中共發動鎮壓法輪功後，\n兩名法輪功學員在中國失蹤。兩個家庭花了20年尋找親人，過程中也揭開了由中共國家支\n\
  持、以無辜人為目標的活摘器官的恐怖罪行。\n\n《國有器官》導演章勇進介紹，電影的源起是他2016年對鄭治醫師的採訪。鄭治醫師曾在\n中共軍隊醫院工作。他在瀋陽陸軍總院實習期間，被迫參與一起活摘器官行動。這給他留\n\
  下了難以磨滅的陰影。\n\n《國有器官》導演章勇進：「我第一次採訪鄭治醫師的時候，對我的震撼很大。鄭治醫師\n當時講，他感覺自己的靈魂又一次被放回了活摘的現場，重新經歷了整個過程，採訪也很\n\
  艱難。\n\n那麼第一天的時候，他就是由於精神上的崩潰吧，幾次就衝向了衛生間，然後我就聽到打\n開水龍頭，過了很長很長一段時間，我才聽到裡面有人在哭。那麼當時我知道只有鄭治醫\n\
  師一個人在洗手間裡面。那麼第一天採訪就被迫中斷，第二天我們接著做。\n\n那麼在採訪結束之後呢，鄭治醫師含著眼淚跟我說，以前他實際上每天都生活在極具的恐\n怖當中，時時都感覺有人追殺，做噩夢，幾乎每天都有。那麼在採訪結束之後呢，相反呢\n\
  ，他覺得這種無所不在的壓力和這種追殺的感覺突然之間煙消雲散了，好像自己的生命得\n到了一種救贖。」\n\n章勇進本身也出身部隊家庭，對於中共的殺人歷史，他其實早有了解。但看到在海外隱姓\n\
  埋名17年的鄭治醫師，第一次下定決心用真名真姓出來作證，他的使命感油然而生。二戰\n以後，所有人都希望反人類罪行不再發生，但中共不但犯下反人類的活摘罪行，還將這種\n\
  罪行發展成產業，至今從中攫取暴利。\n\n章勇進：「不同的是呢，今天我們還有時間來阻止這種反人類罪的發生，我們還有機會改\n變正在發生的這段歷史。截止今天呢，大概已經有超過4億中國民眾退出了中共的黨團隊\n\
  組織。如果每個人呢，大家能夠採取一點點行動，把在《國有器官》這個片子當中看到和\n聽到的真實的事件呢，能告訴周圍的親朋好友啊，還有眾議員啊，參議員啊，我們就有可\n\
  能使中國大陸民眾生活更加的安全，世界更加和平安定。這是我拍這個片子當時的一個初\n衷。」\n\n章勇進研究了當時他所能找到的所有關於活摘器官的報導、調查，從中發掘線索，拜訪超\n\
  過30位的參與人士與失蹤者家屬，一一的進行採訪。\n\n章勇進：「最終下來呢，就是可以使用的採訪的時間大概有100個小時吧。那麼就是\nB-roll啊，其他的一些素材呢，可能大概有1000多個小時。那麼最終呢，從2016年第一次\n\
  採訪鄭治醫師，直到2023年的時候呢，完成了第一個粗剪，大概有六七年的時間吧。」\n\n直到剪完《國有器官》紀錄片，章勇進才明白鄭治醫師最初接受完採訪時，為什麼會含著\n\
  淚說「生命獲得了救贖」。\n\n章勇進：「其實我當時並不理解是什麼意思，那麼當我在完成這部片子之後，回頭再看整\n個過程的時候，我就有了一個新的理解。因為我本身是來自中國大陸，而且是部隊家庭，\n\
  在海外雖然生活了一些時間，但是或多或少，在做片子過程當中，也能感受到自己身上的\n黨文化因素。在這個過程中，我就發現一個問題，我就去掉一個，發現一個問題，我就去\n\
  掉一個。整個過程對我來說，是一個像救自己的過程，所以我對這個過程也是非常珍惜。\n那麼在我不斷去除自己的黨文化過程當中，同時也是對上天恢復正信的過程，所以這種正\n\
  信的加強，也能感覺到自己時時也得到了上天的眷顧和護佑。所以中國人有句話叫做，『\n正氣存內，邪不可干』，可能也是說的這個意思吧。」\n\n章勇進表示，自己的責任是把事情真實和準確地呈現給觀眾，片中並沒有試圖給出結論，\n\
  而是讓觀眾得出自己的結論。\n\n編輯/尚燕 採訪/常春 後製/鐘元\n\n新聞網址：\n\n專訪章勇進：製片過程也是自我救贖的過程；我用兩個小人物的故事，透視近20年中國最\n\
  重要的一段歷史；這也是每位參與者和觀看者的自我救贖之路。\n\n參考資料：\n\n\n\n\n《國有器官》全台放映場次： \n\n或可在「乾淨世界」網站搜尋國有器官線上購買收看\n\
  \n\n--\n「川普總統天天看大紀元」 獲讚賞\n\n川普接受大紀元專訪：美國強硬才能贏得\n\n大紀元記者手札：坐隨總統出行\n\n\n--"
