url: https://www.ptt.cc/bbs/movie/M.1727849494.A.F4C.html
title: '[新聞] 揭中共暴行 《國有器官》十月全台放映'
content: "揭中共暴行 《國有器官》十月全台放映\n\n\n榮獲多個國際獎項的大型紀錄片《國有器官》揭中共暴行，2024年10月將在全台放映。\n（主辦單位提供）\n\
  \n【大紀元2024年10月01日訊】（大紀元記者鍾元台灣報導）中國的「十一國殤日」之際，\n榮獲多個國際獎項的大型紀錄片《國有器官》，揭露中共活摘人體器官的罪惡暴行，10月\n\
  將在全台的多個大城市戲院放映。\n\n「十一國殤日」期間 《國有器官》全台放映\n\n《國有器官》（State Organs）自7月15日在台灣首次試映以來，感動許多主流人士，也\n\
  受到台灣觀眾的熱烈歡迎，有許多民眾反映錯過觀影機會。主辦單位回應觀眾需求，因此\n在10月起將在宜蘭、台北、桃園、新竹、苗栗、台中、嘉義、台南、高雄、屏東、台東等\n\
  地加映，並且在10月1日，於台北、台中、高雄舉辦映前特別場。\n\n\n榮獲多個國際獎項的大型紀錄片《國有器官》揭中共暴行，2024年10月將在全台放映。\n\
  （主辦單位提供）\n\n在關注中國人權的「十一國殤日」期間，《國有器官》揭露被中共掩蓋最深的活摘器官黑\n幕、而一場大屠殺仍持續進行著。\n\n歷時近七年拍攝的《國有器官》，通過大量第一手證詞，包括曾參與活摘器官的醫生，從\n\
  受害者及其家人角度、目擊證人的採訪，揭開了在過去25年期間中國人體器官移植行業的\n飛速發展、失蹤人口的暴增與宗教迫害的祕密。\n\n《國有器官》也受到美國主流人士關注，正在紐約上州中城（Middletown）放映；同時於\n\
  9月30日開始在新澤西斯巴達（Sparta）一家電影院播放。\n\n《國有器官》已獲得多個獎項，包括加拿大雄獅電影獎長紀錄片最佳導演、最佳音樂獎、\n以及六項提名例如最佳長篇紀錄片與劇本；美國曼哈頓電影節「最佳人權紀錄片」獎；獲\n\
  得2024藝術電影精神獎；榮譽全球電影競賽卓越獎特別提名、並入圍蒙特婁獨立電影節、\n歐洲戲院電影節和曼哈頓電影節，並將角逐2025奧斯卡最佳長紀錄片。\n\n\
  \n2024年7月15日晚上，《國有器官》在台北光點華山電影館首映，台灣主流人士到場關注\n中共活摘罪惡。（宋碧龍／大紀元）\n\n7月15日台灣首映會感動主流人士\
  \ 國家人權委員：所有台灣人都應來看\n\n7月15日，《國有器官》電影在台灣首映會後，華裔導演章勇進、製片宋美馨、親歷活摘\n器官的醫師鄭治、美國「追查迫害法輪功國際組織」（簡稱「追查國際」）主席汪志遠現\n\
  身劇院，與觀眾們一起座談。\n\n「當我望向他（受害人）時，我看到了十分恐懼的眼神，他的眼皮還在動。」親歷活摘器\n官的醫師鄭治驚恐地說。\n\n\n圖為前中國醫師鄭治。（宋碧龍／大紀元）\n\
  \n皮博迪獎（Peabody Award）得主章勇進說，「這是一部關於尋找真相的電影，也是一個\n激勵幾億人的故事。」\n\n章勇進以執導《國有器官》獲得加拿大雄獅電影獎長紀錄片最佳導演。他表示，製作這部\n\
  電影的難度很大，《國有器官》向觀眾揭示了「中國近20年來最重要的一段歷史」，這是\n一場大屠殺，無論在規模和程度上都超過了第二次世界大戰納粹對猶太人的大屠殺，不同\n\
  的是，這是「一場正在進行的」大屠殺。\n\n二戰結束後，當世界知道納粹讓幾百萬猶太人喪生的「群體滅絕」罪行之後，曾誓言「永\n不再發生」（Never Again），很多人都想『我當時並不知道這個事情，如果知道，我一\n\
  定會做一點什麼』。但僅僅在幾十年之後，另一場人類對人類的大屠殺在中國再一次發生\n，這一次更加隱密、更加殘忍、更加普及，而又緩慢地、正在進行著。\n\n「如今當這種事情再次發生時，我覺得對所有人是一個機會。今天我們還有時間來阻止反\n\
  人類罪行，還有機會改變歷史。如果每個觀眾能把你看到、聽到的告訴你的親朋好友，也\n許我們就能做出一些改變。」章勇進說，「真相就是力量。」\n\n\n圖為華裔導演章勇進。（宋碧龍／大紀元）\n\
  \n《國有器官》已經在美國紐約、台灣台北、澳洲坎培拉等多國城市陸續首映。監察委員暨\n國家人權委員田秋堇出席7月15日台灣首映會後受訪表示，這是一部非常重要、「所有台\n\
  灣人都應該來看的電影」，\n\n「大家花了這麼大心力去揭露真相，令人非常感動，尤其前中國軍醫鄭治醫生不屈不撓冒\n著大風險現身說法，可歌可泣。」田秋堇希望台灣人覺醒，「台灣離這個黑暗勢力這麼近\n\
  ，卻不自知，甚至有人不相信，但這（電影）就是一個警告和預告，未來如果台灣在這樣\n的（中共）統治之下，會遭遇到什麼樣的事。」\n\n\n圖為監察委員田秋堇。（宋碧龍／大紀元）\n\
  \n資深媒體人暨台灣關懷中國人權聯盟創會理事長楊憲宏表示，中共利用錢、女人、器官賄\n賂國際的多國官員，導致這些官員在面對中共邪惡政權的時候（對惡行）視而不見，講出\n\
  許多違心之論。他知道在世界上有很多中共幫凶，他呼籲台灣人不要到中國大陸換器官，\n不要做中共的幫凶。\n\n\n圖為前監察委員張武修（左）、資深媒體人楊憲宏（右）。（宋碧龍／大紀元）\n\
  \n政治大學教授李酉潭表示，《國有器官》畫面拍得很寫實、但不血腥，清楚表達現在中國\n背後仍有殘忍事情發生；讓人理解到，在中國換器官可能是一命換一命，全世界都應關注\n\
  。中共極權迫害法輪功，犯罪延續至今，現在中共迫害維吾爾人、西藏人、香港人等，都\n已經浮出檯面，世界開始凝聚更多力量聲討中共。\n\n\n圖為政大教授李酉潭。（宋碧龍／大紀元）\n\
  \n作家馮光遠說，在獨裁政權國家，除非這個政權解體，否則不太可能發掘事情的真相，但\n是面對那麼多被殘酷對待的犧牲者，從人道立場上，希望真相能水落石出，否則每個人的\n\
  良心都會過不去。他指出，活摘器官是對人類的罪行，非常嚴肅的議題，牽扯的已經不只\n是法輪功，像發生在中國的許多年輕人失蹤，他們的器官一旦被配對成功，很可能成為活\n\
  摘器官受害者，真的荒謬到極點。\n\n\n觀看預告片：\n\n電影《國有器官》中文版 首映預告片 2.5分鐘\n\n\n\n《國有器官》十月全台各地放映資訊，請見官網：\n\
  \nhttps://國有器官.tw/\n\n\n\n\n雄獅影視文化公司 Email：Lion.movies88@gmail.com 聯絡人郭小姐\n\n責任編輯：葉紫微#\n\
  \n\n\n\n--\n\n\n \n\n\n--"
