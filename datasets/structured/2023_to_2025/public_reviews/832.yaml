url: https://www.ptt.cc/bbs/movie/M.1723648590.A.020.html
title: '[新聞] 《國有器官》8月27日北美各大媒體平台上架'
content: "《國有器官》8月27日北美各大媒體平台上架\n\n\n2024年7月15日晚上，《國有器官》在台北光點華山電影館首映，台灣主流人士到場關注\n\
  中共活摘罪惡。（大紀元）\n\n【大紀元2024年08月13日訊】8月12日，美國頂級發行商聯合娛樂旗下的發行方案宣布，\n紀錄片電影《國有器官》將於8月27日上架北美各大媒體平台。這部涉及中共活摘法輪功\n\
  學員器官題材的電影，第一次在美國的主要媒體平台全面上架。\n\n《國有器官》由美國拱石娛樂全球發行，皮博迪獎得主章勇進導演執導。影片透過兩個家\n庭長達二十年的尋親歷程，以大量第一手證詞，層層揭開了中共最隱祕的國家犯罪——對\n\
  法輪功信仰群體實施的活摘器官。電影揭示了過去二十五年來中國社會最重要的一段歷史\n：法輪功因其迅速發展而遭江澤民集團嫉恨，從而遭受了前所未有的迫害，包括以國家機\n\
  器進行的活摘器官，並形成了龐大的商業化產業鏈。\n\n章勇進導演說：「鄭治醫生啟發了我拍攝這部電影。他是第一位親眼目睹活摘現場的軍醫\n，並勇敢站出來作證。他說活摘過程中甚至不使用麻醉藥。這一罪行的殘忍和他的勇氣深\n\
  深震撼了我。我希望盡我所能，幫助制止這一暴行。」\n\n\n2024年7月15日，《國有器官》晚上在光點華山電影館首映，圖為華裔導演章勇進。\n\n今年6月25日，美國眾議院通過了《法輪功保護法案》。製片方如意影視公司表示：「紀\n\
  錄片《國有器官》的上映不僅及時，更顯得尤為重要。它將讓全球觀眾了解正在中國發生\n的這場慘絕人寰的罪行。」\n\n《國有器官》已榮獲加拿大電影雄獅獎最佳導演、最佳音樂獎、美國金勳章電影競賽獎、\n\
  藝術電影精神獎、曼哈頓電影節最佳人權紀錄片獎等多項殊榮，並入圍蒙特利爾獨立電影\n節和歐洲戲院電影節。\n\n《國有器官》自7月15日在台灣上映以來，受到台灣觀眾的熱烈歡迎，目前仍在戲院上映\n\
  ，場場滿座。\n\n台灣主流媒體高度關注，包括華視、公視、民視、年代、三立、寶島新聞、台灣英語新聞\n、《自由時報》、雅虎新聞等都做了大量的報導。超過200萬人次觀看了相關報導，幾乎\n\
  每十個台灣人就有一人了解到這部電影。\n\n從8月27日起，《國有器官》英文版可以在Google、Amazon、Apple、Microsoft、Dish、\n\
  InDemand、Vubiquity、Rogers、Bell、iTune、Amazon、Microsoft、Google、Hoopla等\n平台觀看。中文版和越南文版則可在乾淨世界影視觀看。\n\
  \n聯合娛樂是北美最大的內容聚合商，擁有48萬5000部的音樂、電影、遊戲庫存，57,300個\n獨家的光盤。發行方案是聯合娛樂旗下的一個分支，為北美所有零售商店和60多家線上平\n\
  台提供內容。合作夥伴包括迪士尼、獅門、AMC、標準收藏（Criterion）等。拱石娛樂則\n是一家位於美國加州的電影製作、發行公司，長年與業內的頂級商家合作。◇\n\
  \n\n（加拿大如意影視公司提供）\n\n台灣放映場次 \n\n責任編輯：李盈#\n\n\n\n\n--\n                  \n\n\n\n\
  --"
