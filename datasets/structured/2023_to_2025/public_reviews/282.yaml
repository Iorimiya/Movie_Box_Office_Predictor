title: '[好雷]《造山者－世紀的賭注》護國神山怎麼誕生'
content: '因為我不是科技產業，頂多就是做個ＵＩＵＸ

  所以只是大概說說我對這部紀錄片的感想心得

  －－－

















  台灣半導體傳奇，從被世界拋棄到世界無法忽視


  許多人常拿俗語「十年磨一劍」，來表達全心全意投入，只等準備好在舞台上等待敘述代

  發，但是後句「霜刃未曾試」看似刀刃劍氣寒光閃爍、鋒利無比，只差未試過，卻有一種

  矛盾與未知性。


  我們怎麼知道十年的辛苦是否真能刀劍出鞘，無人能敵？許多想法和常識也往往是一場博

  弈，有時候人需要努力也需要敢賭上的勇氣，一場勝敗可能不是努力解決非運氣，而是天

  時地利人和。但在成為世界之最中，經歷過什麼？又失去什麼？在這只注重結果的世代，

  鮮少會有人回頭望。


  《造山者－世紀的賭注》是首部以「台灣半導體」產業發展史為主題的紀錄片，跨過半世

  紀，從科技沙漠，到如今全球科技產業鏈無法忽略的一環，再到獨一無二高效率的晶片生

  產中心。台灣人人都知道的護國神山「台積電」，但從零到有，這場科技躍進怎麼來？一

  切還要從一次早餐會議、幾位年輕的美國留學生，開啟這場造山運動。









  《造山者－世紀的賭注》是什麼電影？


  在台灣千囍年時，如果你幸運的買了一張台積電的股票，可以說妥妥的經歷了一段台積電

  逐步攀升的高潮紅利。2000年的台積電一股為25塊，如今2025年台積電一股突破900元，

  可以說整整成長了30倍。這其中的成長並非偶然，而是世界趨勢所造就台積電的晶圓代工

  崛起，其中在21世紀後，個人電腦與蘋果智慧型手機的問世，有絕對的相關厲害關係，這

  也使台積電在短短二十年間水漲船高，霸佔世界晶圓代工龍頭地位許久。


  台灣的台積電有著全球最大與先進的晶圓代工技術，根據美國的資料，台積電的全球市佔

  率幾乎佔世界的六成，三星則佔一成。可以說國際大品牌公司如果無自己的晶圓廠，通常

  都依賴台積電的代工、製造。


  除了接單量大，良率也是台積電無法被取代的地位之一，台積電的代工製品良率遠高於其

  他國家代工廠的程度，並且研發的技術也領先許多同行，以中國和台灣為例，中國目前技

  術智能製成7奈米且良率偏低，但台灣目前主流量產是3奈米晶片，且可穩定供貨，具體來

  說兩方之間在晶電製成技術可能有10年的差距。








  台積電的巨大成功，這也讓很多人對台積電如何有著今天地位很有興趣，電視節目有著各

  種說法，其中最常分為兩派：一、歸於國民政府當年的遠見。二、美國的技術協力與地緣

  保護。是靠國民黨？還是靠美國？成為民嘴的角力，鮮少有人真的去實際考究一次關於台

  灣的半導體史，並內化成可以讓大眾了解的影視作品。故2025年上映的紀錄片《造山者－

  世紀的賭注》，就成為首部，也是重要的讓民眾了解台灣如何從科技沙漠變成如今世界瘋

  搶，甚至成為政治角力的台積電。


  過去拍攝台灣棒球《紅葉傳奇》、與台灣最後電氣化「南迴鐵路」史《南方寂寞鐵道》的

  導演－蕭菊貞，原先並無拍攝這部台灣科技產業紀錄片的意願，對於自己不熟悉與科技產

  業很難與人文連結在2017年拒絕。


  但在2019年當她參加「胡定華追思會」時，看見多位科技先驅前輩的真情流露的緬懷致詞

  ，讓她改觀，決定開始著手進行這項橫跨半世紀的台灣半導體史的紀錄片，並且從中發現

  許多台灣科技上的人文情懷與橫跨美國與台灣，這群背負國家期待，絕對不能失敗的科技

  人才故事。









  《造山者－世紀的賭注》分析與延伸：


  這部紀錄片證實了一些傳聞和故事的真實性，其中包含在科技業界的「台灣開始推動半導

  體是在早餐店」的傳聞。這件事發生於1974年某家台北的小間餐飲店。根據紀錄片導演蕭

  菊貞與多方人士的幫助調查下，發現這其實是一個算是半隱藏的早餐會報場所，一樓販賣

  豆漿油條，而二樓則是政府官員的早餐會報，並且聚會相當頻繁，連當時的將經國也有到

  訪過這間店，可以說是討論正事的早晨接待所，雖然具體來說時間不明，出席人數也不確

  定是否真為七人，但可以連結的是後來半導體計畫推動的兩位關鍵人物「孫運璿」與「李

  國鼎」都在其中。


  70年代遭遇到很大的挑戰，像是石油危機與退出聯合國，故為了台灣經濟的轉型，孫運璿

  提議與韓國政策雷同，推動「科技轉型」用政府資金來支援半官方機構工業技術，並用高

  薪將海外留學人才請回。但這個計畫等同於政府沒有直接管理權卻又要當最大出資方，讓

  許多政府官員反對。


  這其實來於許多國民政府的官員對於科技的認知不足，並且缺少工業與科技相關領域，重

  點是需要花費大額且不知有沒有成果的「研發」。最後同樣贊同孫運璿政策的李國鼎幫助

  下，讓國家同意撥款實行這項半導體開端的研發計畫，成立工研院。孫運璿也被稱為台灣

  的「工研院之父」。





  在初期其實最難找的不是怎麼學技術，而是相關人才，如同現在的新創公司容易失敗，在

  1970年代，就算學習理工的人的第一目標都是美商公司，而不太有人願意去一間政府實驗

  性質的研究單位。故這時代願意投身的除了對於台灣這片土地有很大的歸屬感與熱誠，再

  來就是政府的遊說與邀請有力人士進駐，讓人民加入此行業有信心。開拓台灣半導體先驅

  －胡定華，就是有著國族情懷的技術理想加入，而另外如張忠謀就是有厚實的IT工作經驗

  而被邀請。


  但當時美國並非所有公司都願意分享半導體技術，故RCA（美國無線電公司）是少數願意

  與台灣技術合作的公司，也成為台灣半導體的開端。再則RCA雖然技術並非頂端，但是當

  時可以迅速進入市場的產業，台灣團隊挑選了19位工程師到RCA受訓一年，後來也成為半

  導體開端的「RCA二十人」。


  有意思的是在台灣設廠完成RCA技術轉移後，就產生有趣的現象，當時RCA表示它們的成品

  良率大概是四成，而在台灣第一次接到訂單時，製品的良率卻高達了九成，並且快速的完

  成訂單需求，在短時間上軌道。可以看見當時台灣科技人的決心。









  《造山者－世紀的賭注》值得一看嗎？


  導演蕭菊貞在訪談中曾經說過，是追思會上那句「只許成功、不許失敗」的故事讓她動了

  想要拍攝這部紀錄片的理由，也在冰冷的科技裡，發現背後蘊藏著當年台灣從無到有，從

  基層的低階電子錶代工，到如今高科技產品不可取代的晶片製成，中間有著許多上億元的

  決策、失敗和危機需要克服。


  可以從《造山者－世紀的賭注》中看見，導演試圖不以造神、偉人傳記的敘事模式，只是

  平舖直述的讓每個當年的訪談者描述當年的奮鬥過程，雖然免不了有些訪談人會稍微神話

  或誇讚起自我的半導體成就，但整題來說並不是一部特地誇台灣的紀錄片。


  應該這樣說，台灣的半導體成就在今日是世界有目共睹，且連台灣一般民眾也有感的存在

  ，故《造山者－世紀的賭注》紀錄片重心放在是怎麼開始，因為有什麼人才讓台灣有半導

  體產業？有台積電？有如此強大的代工技術。敘述關於失敗和國際局勢下，為何台灣半導

  體變成大國角力，和被許多國家力求。可以說從台灣半導體開端就與政治和國際之間有著

  密不可分的關係，故在《造山者－世紀的賭注》電影中，並不是誰把科技變成政治博弈，

  而是打從一開始台灣的科技產業就是不能失敗的國際政治博弈。







  電影中，我認為導演還是保留她對台灣人文的關懷，讓觀眾去思考的一點，這點與之前《

  南方寂寞鐵道》紀錄片相同，電氣化後，雖然鐵路交通更加方便了，但同時在歷史與人文

  之中我們失去了什麼。在《造山者－世紀的賭注》也是如此，在台積電與台灣報導體成功

  中，那些被犧牲和利弊之間的抉擇。


  其中是設廠將新竹地方的客家文化與土地的逝去，是否有能兩全其美的方式，如同台積電

  近幾年在日本熊本設廠，對於當地環境和房價、物價的變動，是一種對環境文化的討論性

  ，其中另外一部分在電影中比較隱晦的，也就是關於勞工的勞動，從紀錄片中我們可以知

  道，且也是現實台灣許多勞動者有感的「半導體的成功仰賴於台灣勞工、工程師在廠房輪

  班24小時不間斷的付出」這點雖然有在電影倍敘述，但是否可以改善、或是符合勞動標準

  會被台灣半導體代工有何衝擊？


  整體而言，我認為《造山者－世紀的賭注》是一部可以稍稍了解台灣報導體產業，不是從

  經濟和賺錢的角度，而是從歷史人文的方向，並且提出關於失與得兩邊衡量，和如今台灣

  科技業與國際政治上，須站在何種角度。不誇張的歌功頌德，只談當年我們這群人如何達

  成了目標，並且認識失敗或對過去戰友的緬懷，同時又體現出多方面如地方文化、勞動工

  時、單一博弈的種種對答與疑問，讓這部片並不是單純的歷史片與炫耀故事，而是在天時

  地利人和的時候，台灣擁抱半導體，台灣有了台積電。




