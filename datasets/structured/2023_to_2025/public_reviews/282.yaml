title: '[好雷]造山者－世紀的賭注 '
content: '先前車禍肱骨骨折,手術後發現舉高就會痛,也無法拿重物.唉,現在的工作幾乎都要拿重物


  ,內勤也多半要女性,只能先繼續養病復健,再學技能,重新找不需要拿重物的工作了.順便


  一提,我看本片是在松仁威秀看,新影院但票價也更貴,今年過年在信義威秀看早場只要三


  百元,在松仁威秀看早場要三百三十元.美食街也是松仁威秀貴,所以我午餐去信義威秀那


  吃.



  台灣半導體的發展與美援終止與石油危機有關,當時的中華民國政府決定開始高科技轉型.


  當然有所謂的台派認為本片太吹捧國民黨政府官員,但筆者不這麼認為.畢竟所謂台派的反


  對觀點比較缺乏體系論述,我們就故意從大陸的觀點來看好了.



  大陸的觀點認為,美國把核心的研發留在本土,將比較辛苦且利潤比較少的製作封裝外包,


  這是美國全球化分工戰略的必然結果.美國是先轉移到日本,當日本經濟起飛,開始有了所


  謂日本第一,可能對美國造成威脅後就轉移到南韓.



  南韓在朴正熙獨裁統治下政治暫時穩定,開始想發展經濟,美國基於制衡日本的需要,把部


  份高科技轉移到南韓,加上朴正熙得扶持大企業發展策略下,才造成三星,lg,sk等南韓大企


  業的發展.



  在南韓崛起後,基於制衡日韓,與在東亞周邊扶植勢力對抗大陸的需要,美國最後才把半導


  體技術轉移到台灣.如果是大陸的解釋,他們會說為什麼只有日韓台接受美國技術轉移,那是


  因為他們剛好都在中國周邊,美國有扶植他們對抗中國的必要.



  由於所謂台派的反對比較缺乏理論體系,我們就從傳統說法與大陸說法作個小對比.若沒記


  錯,一批當時只有三十歲的工程師在1974年去美國學習半導體高科技.本片2025才拍成,這


  些人假設現在還在已經八十一歲,只能說本片拍得太晚.



  經查台積電2016年市值超越美國電子巨頭ibm,2017年台積電超越美國晶片巨頭英特爾,如


  果要拍一個成功者的故事,那最早2018開拍,若拍早點2019可拍成.經查本片拍了五年,若


  2018年拍則2023或2024可拍成.



  但一部電影得拍成,即使只是相對不需要特效等高成本的紀錄片,也需要很多投資甚至政府


  投資協助才能拍成,這部影片在2019至2025年間拍攝，如果要論政治立場,從本片的描述方


  式就能看出來了.



  本片描述方式偏向華山派的氣宗,筆者故意不用某黨來說是想做個比喻.光從貿易戰用美中


  貿易戰,不以中美貿易戰,以及多次出現氣宗人物,劍宗人物沒有幾個,就算有也都只在陳述


  中,只是所謂的台派嫌本片還不夠台派而已.


  註:所謂的台派經常是某派的代名詞,只是台派不願意承認他們是某派而已XD.



  本片說當年這些人1974年去美國學習當時得先進半導體技術,只有一家公司願意教他們.且


  他們一去才發現,那些操作先進半導體技術的人在美國都不是高學歷,都是國小國中學歷.


  如果這些人的說法對的話,那大陸的說法美國將比較辛苦且利潤比較少的製作封裝外包,這


  個說法是沒錯的.


  註:但只有日韓台被美國將比較辛苦且利潤比較少的製作封裝外包,是否出於扶植他們制衡


  中國的需要就不清楚了.



  但那家公司對這些人1974年去美國學習的態度非常震驚,他們的作業員說只要你們學成歸


  國,我們就要失業了.這種積極學習的態度其實在大陸也有類似的故事,1979年大陸與美國


  建交,大陸與美國曾經有蜜月期.



  某年大陸獲准參加美國的軍事演習,當時的美國有大陸那時沒有的航空母艦等先進軍事裝


  備,大陸某將軍還特別靠近去看美國的先進軍事裝備,可惜我是懶得找那張圖.這也證明不


  論是大陸或台灣,兩者在追趕先進科技的態度都是非常積極的.





  該紀錄片還用了1987年美國電影諷刺made in taiwan的橋段,這也代表可能當年台灣製造


  與現在made in china的部分廉價商品是同義詞,當然現在的made in china也並非都是廉


  價品,否則iphone與特斯拉等高價品一樣有made in china啊xd.



  回去後馬上開始有測試工廠,這家官民合辦公司就是聯電,聯電一開始作香港的某電子錶,


  後來轉向電話機的製造.測試工廠與聯電早期的成功,當年那個傳授技術給台灣工程師的公


  司想買下台灣的測試工廠,當然被拒絕了.



  之後張忠謀回台,又創設一家官民合辦公司就是台積電,飛利浦與台塑都有投資,當然政府


  也有出資,就有了台塑賣台積電股票太早的故事.但之後的說法似乎與網路說法相反,本片


  的說法是ibm一度想與台積電合作,但條件是要求台積電放棄研發.



  台積電當然不可能放棄研發,但本片說聯電與ibm合作,聯電與ibm合作是否有放棄研發則不


  得而知.本片宣稱台積電堅持研發,並設法突破傳統光刻機曝光方法的限制,突破摩爾定律.


  聯電最後競爭不過台積電的原因則沒有說,如果是網路說法是聯電不放棄研發,被國外打擊


  失敗,而台積電專心做代工,不知道哪個說法是對的.



  關於良率方面,本片自豪的是,別人良率通常一開始只有百分之四十,台灣良率一開始就超


  過九成,當然這個代價是二十四小時輪班技術員與二十四小時輪班工程師造就得.這種東西


  才是台灣真正的核心競爭力,是歐美學不來的,如果根據大陸說法叫低人權優勢XD.



  還有一段讓人印象深刻的是,外國廠商表示他們兩年才能做一代晶片,為什麼你們台灣廠商


  一年半或一年就做一代晶片?某人表示,美國如果半夜機器壞掉,工程師早上八點來,可能要


  中午十二點才修好.



  反觀台灣如果半夜十二點機器壞掉,大概一兩點就修好.且台灣機器是二十四小時不停,美


  國機器一天只動八小時,台灣工程師二十四小時隨叫隨到,即使颱風天也要來公司上班.就


  算美國人比我們聰明兩倍,也比不上台灣人得勤勞.



  且本片真正為尊者諱的地方是在台積電耗電量愈來愈大那邊,台灣最近為什麼經常停電?真


  的都是小動物造成的嗎?那怎麼以前就沒有那麼多小動物?答案很清楚,只是本片要為尊者


  諱,自然就不能說了XD.



  所以同樣是紀錄片,同樣有為尊者諱的嫌疑,造山者一片基本上比看不見的國家要好,看不


  見的國家聽說有國旗歌,不知道敢不敢播國歌呢?不過就算敢播國歌,也還是本片比看不見


  的國家更值得一看.




  --

  二戰後在德國納粹荼毒下倖存的牧師 Mantion Niemoller說：

  起初，他們捉共產黨員，我不說話，因為我不是共產黨員；

  後來，他們捉工會會員，我不說話，因為我沒有參加工會；

  後來，他們捉猶太人，  我不說話，因為我是日耳曼人；

  後來，他們捉天主教徒，我還是不說話，因為我是新教徒；

  最後，等到他們來捉我時，已經沒有人能為我說話了。


  --'
