url: https://www.ptt.cc/bbs/movie/M.1750144380.A.DF9.html
title: '[新聞]蕭菊貞紀錄片《造山者－世紀的賭注》揭開'
content: '新聞網址：



  金獎導演蕭菊貞紀錄片《造山者－世紀的賭注》，揭開台灣半導體傳奇誕生的世紀賭注


  金獎導演蕭菊貞紀錄片《造山者－世紀的賭注》於6月13日上映，揭示台灣半導體傳奇誕

  生的世紀豪賭。耗時五年打造，深入訪談逾80位關鍵人物，多角度呈現台灣半導體產業面

  對重重考驗的艱辛歷程。人人都是「造山者」，一起看見台灣人「同島一命」的奮鬥精神

  。




  繼《南方・寂寞鐵道》後，金獎導演蕭菊貞在眾所期待下推出最新紀錄片《造山者－世紀

  的賭注》，揭開台灣半世紀前一場攸關未來命運的孤注一擲。


  在片中，美國國家工程學院院士施敏直言：「當時面臨國大代表反對，財政部反對，就連

  經濟部也反對。」華邦電子前副董事長楊秉禾則回憶當時肩負的是「只許成功、不許失敗

  」的國家任務。


  這場高風險、無法短期獲利的長期賭注，在美援中止、退出聯合國和全球石油危機等多重

  考驗中誕生，由一群年輕工程師為台灣取回發展半導體的種子。導演蕭菊貞表示：「半世

  紀過去，當年的這場賭注為台灣創造了半導體傳奇，而如今我們也必須投入全島之力，面

  對一場更大的難題！」




  它不只是一段關於台灣半導體的故事，更是台灣這座島嶼面對生存，所走過的艱辛路徑。

  （圖片提供：牽猴子）


  在《造山者－世紀的賭注》五年的製作期間，故事成長的速度遠超乎蕭菊貞導演的預期和

  想像，她苦笑說，「沒想到片子一邊拍，故事也一邊長大」。


  幸好導演和兩位有科技背景的製片人陳添順、蔣顯斌，不斷調整拍攝視角，同時也不放棄

  探尋這段歷史，走訪超過八十位來自不同背景的受訪者，從年逾九十歲的前財經官員、第

  一代半導體工程師、聯電第一代作業員、科技廠CEO、決策者，再延伸到周邊廠商、大學

  生、年輕工程師，甚至是被遷移的客家聚落居民等等。


  蕭菊貞導演表示，對她而言「造山者」並非指一家企業、一個產業，或特定的一群人。「

  它更是台灣人同島一命，歷經半世紀的挑戰，所激發出的奮鬥精神，在島內拼搏，也向外

  爭取機會來守護這個島，這個家。」



  《造山者－世紀的賭注》6月13日正式上映。



  當年這群工程師都沒想到，一個小晶片竟然可以對未來產生這麼大的影響。


  導演蕭菊貞分享了一段幕後對話，她訪問工研院前院長史欽泰時，談到在風雨飄搖的七零

  年代，知識青年裡流傳的一句話「來來來，來台大；去去去，去美國！」許多出國深造的

  年輕人會選擇留在海外發展。導演好奇史欽泰院長為何毅然決定回台參與半導體計畫？沒

  想到史院長毫不猶豫地回答：


  「對我來說，出國就是為了回家，回家讓家鄉更好！這不需要理由。」


  此話至今仍在導演心中迴盪。蕭菊貞導演說：「我希望透過這一部紀錄片，也能讓我盡一

  份心力，為這努力求生存的島嶼留下珍貴的故事。」



  工研院前院長史欽泰（左）與台積電前副董事長曾繁城（右）都是台灣第一代半導體工程

  師，有著深厚的革命情感。


  包場突破兩百場 一起見證台灣奇蹟的發生

  《造山者－世紀的賭注》自預告曝光後話題不斷，未演先轟動，不僅電影公司包場電話被

  打爆，更讓人驚訝的是，上映前已接到超過兩百場包場，橫跨科技、金融、教育、藝文、

  校園師生等各界，看過電影的觀眾也紛紛踴躍在社群分享並響應接力包場，為該片掀起一

  波「搶先觀影」浪潮，導演蕭菊貞分享：「這部電影的旅程才剛開始，接下來還要繼續前

  行。這不僅是台灣半導體的故事，更是台灣人奮鬥求存的真實足跡。」



  《造山者－世紀的賭注》自預告曝光後話題不斷，未演先轟動，上映前已接到超過兩百場

  包場。


  導演蕭菊貞與製片人陳添順、蔣顯斌已奔走全台，參與近50場映後座談。


  許多觀眾看完後深受感動，驚訝原以為是冷冰冰的科技題材，竟能拍得如此細膩、溫暖且

  動人，不少人甚至在觀影中悄悄拭淚，蕭菊貞導演分享創作初衷：「我拍的題目總是『人

  』先打動我，不是在拍產業數據，而是在記錄那些努力為台灣開路的人。」


  她從歷史脈絡出發，更關注受訪者的內心處境：「有信念就不會累。我最大的希望，就是

  把這段故事交到年輕人手上，讓他們為台灣繼續創造歷史。」


  電影不僅包場詢問如雪片般飛來，來自各領域的觀眾也紛紛表示深受感動，雲門舞集創辦

  人林懷民憶起幾十年前帶著雲門舞者出國演出時正逢中美斷交，飛機上常遇到一群台灣人

  身穿西裝認真查字典的奇觀，他動容表示：「台灣被孤立卻有人一直在努力，沒有這些長

  輩的智慧與奮鬥，就沒有今天的台灣。每一個人都應該看這部電影！」


  金獎音樂製作人陳明章也說：「看年輕人齊心造起的山嶽，一山一嶺還在綿延著。」創作

  者敏迪則分享：「這是一種世代的呼喚，看見前輩的努力，我們這一代要思考如何接棒。

  台灣雖脆弱如雞蛋，但也能找到希望，甚至讓高牆需要我們。」



  雲門舞集創辦人林懷民表示：「沒有這些長輩的智慧與奮鬥，就沒有今天的台灣。每一個

  人都應該看這部電影！」


  電影《造山者－世紀的賭注》，台灣首部以半導體發展為主題的紀錄片，訪問超過80位見

  證台灣半導體產業發展的關鍵人物和相關參與、研究者。


  不只呈現半導體產業如何從無到有，成為推動全球科技發展的關鍵核心，也尋找出當年背

  負國家任務重擔的工程師與前輩們，他們不為人知的奮鬥故事。


  這份革命情感與拚搏精神，都在電影中和大家分享，將於5月12日起開放包場，並在6月13

  日全台戲院正式上映。更多電影資訊請至官方臉書：「造山者－世紀的賭注 A Chip Odys

  sey」



  導演蕭菊貞分享：「這不僅是台灣半導體的故事，更是台灣人奮鬥求存的真實足跡。」




  --

  PTT本來就會有插入廣告呀（？）'
