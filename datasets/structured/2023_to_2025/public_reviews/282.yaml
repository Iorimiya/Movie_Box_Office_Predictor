url: https://www.ptt.cc/bbs/movie/M.1750074468.A.DF7.html
title: '[新聞]《造山者－世紀的賭注》票房破500萬 台灣'
content: '新聞網址：



  《造山者－世紀的賭注》票房破500萬　台灣半導體奮鬥史感動全


  金獎導演蕭菊貞執導的《造山者－世紀的賭注》，用鏡頭記錄台灣半導體產業的誕生與崛

  起，開片首週末票房突破500萬元，口碑熱烈延燒至全台，吸引近300場企業與團體包場。


  這部紀錄片被觀眾譽為「台灣版《不可能的任務》」，不僅讓人重新認識台灣在全球科技

  產業的地位，更激發出強烈的情感共鳴。


  電影聚焦於1976年台灣半導體產業的起步，當時一群工程師肩負「只許成功，不許失敗」

  的重責，遠赴美國學習積體電路技術，為台灣奠定了科技產業的基石。


  片中受訪者回憶，當年看著美國的月亮，心中卻想著台灣的家，這段跨越半個世紀的奮鬥

  故事，不僅展現了早期工程師的堅韌與勇氣，也讓年輕一代觀眾直呼：「終於知道如何向

  外國人介紹台灣！」


  上週末於台北與新竹舉辦的特別放映場上，片中受訪者之一、聯電第一代技術員蔡淑芬分

  享，當年她們對未來毫無概念，只知道努力工作賺錢，連股票能換車都覺得不可思議。


  導演蕭菊貞感性表示，台灣的成功不僅是因為檯面上的大人物，而是所有默默付出的人共

  同努力的結果。

  她希望透過這部作品，讓更多人理解這段歷史，也鼓勵觀眾思考，是否有勇氣在逆境中守

  護台灣。


  《造山者－世紀的賭注》訪問超過80位見證台灣半導體發展的關鍵人物，從工研院到台積

  電、聯發科等企業，串聯起台灣科技產業的奮鬥史。導演蕭菊貞形容「造山者」不僅是一

  群人或一個產業，而是台灣人面對挑戰時展現的共同力量。電影現正全台熱映，更多資訊

  請至官方臉書。



  胡定華先生（左）與孫運璿先生（右），在半導體產業發展史上，他們皆是真實的存在，

  有其對國家與產業發展的貢獻。（牽猴子 提供）


  --'
