title: '[  雷] 《造山者－世紀的賭注》包場心得'
content: "雷文防雷資訊頁\n \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n \n\
  \ \n \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n今天有幸湊到人家包場的場次裡，搶在正式上映前看了《造山者－世紀的賭注》。\n\
  \n\n\n這部片主要是從台灣半導體產業草創開始講起，一路鋪陳到現在台積電變成世界焦點的過程\n。\n前半段我覺得超精彩，有點像在聽前輩說當年勇。講的是當年政府找來一群年輕人（真的年\n\
  輕，二三十歲吧），派去美國學技術，從零開始搞晶圓、搞製程，那種「我們一定要成功，\n失敗就全軍覆沒」的壓力感很重，但也很熱血。當時的人真的不是在拚KPI，每個人都很有使\n\
  命感感，像是背上扛著的國家的國旗，拚整個國家的未來。\n\n後半段就是比較多人熟悉的台積電篇，從創立開始，慢慢帶到中美角力、先進製程等議題。\n這部分如果你平常有在看新聞，可能不會太陌生，不過整個脈絡整理得還不錯。\n\
  \n其中有一段講到：「真正的愛台灣，是把技術做到最好，讓世界看到我們的實力。」\n老實說，我自己也在半導體產業鏈混口飯吃，本來每天就是上班下班而已，看完那一瞬間有\n\
  點小感動，突然覺得自己好像也應該背負某種程度的使命感當個螺絲（雖然明天上班可能還\n是會想請假）。\n\n整體來說，這部片有點像是「半導體界的台灣啟示錄」，幫這段歷史留下一個整理和見證。\n\
  如果你本身對產業沒那麼熟，也能看得懂，導演講故事的能力不錯，有做功課也有感情，不\n會很硬很學術。\n\n推薦給以下幾種人：\n-在園區工作的朋友們\n-對科技產業或歷史有興趣的人\n\
  -想知道「我們是怎麼走到今天」的普通人\n\n包場結束後，有導演和劇中大佬的談話，真的很敬佩這些偉大的前輩們。\n\n\n\n \n \n\n--"
