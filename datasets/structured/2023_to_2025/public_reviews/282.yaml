url: https://www.ptt.cc/bbs/movie/M.1750387577.A.47F.html
title: '[普好雷] 造山者-世紀的賭注'
content: '雖然是紀錄片不過好像還是防個雷好了(?)











  這部的題材是我有興趣的.


  但看完後作為一個紀錄片我認為這部有幾點很可惜:


  1. 時間線上不夠清晰


  片中時間跳躍太多次,

  像是TSMC的"我們會把研發留在台灣"先跳出來,

  之後過好一陣子才交代"要去美國投資1000億"

  之後再扣回"把研發留在台灣"


  如果你不是這個產業界的人,

  或是沒有注意相關產業的新聞,

  或是隔了20年再回來看可能都很難搞清楚.


  受訪者可以依照他們的記憶決定講的順序,

  身為紀錄片導演的責任則是把來龍去脈梳理好.


  比較妥當的作法是嚴格地依照年代排序,

  再把訪談內容與當年的新聞照順序放進去.


  這點我認為處理的沒有到非常完美.



  2. 如果可以的話, 應補充當時的背景環境


  當年RCA所處的半導體業界環境其實沒有什麼交代,

  IBM, DEC, TI, 西屋, GE等等當時在幹麻應該要稍微提過才比較完整.

  這樣才能說明當時決策有哪些考量.


  同樣的狀況也發生在介紹世界先進的困境時,

  如果沒有說明當時業界其他廠商的動作當然不能有效理解狀況.


  我認為這兩個部份在探討這個產業都是必須被提到的.



  3. 導演不是主角


  這也是我最不滿的點,

  我們觀眾想看的是這些前輩當年做了些什麼,

  造成什麼影響,

  而不是導演你為何要拍這部紀錄片.


  片中多次提到胡定華教授告別式是導演為何要拍這紀錄片的原因,

  說實話這根本不是該放進來的東西.

  你可以放告別式上面各前輩緬懷當年的同僚,

  但不應該在加註"我是因為這樣才想拍",

  我相信沒人想看這個(笑


  這是這群前輩與這個產業的紀錄,

  你要闡述你為何要拍可以放在花絮或是座談會,

  放進正片裡面我認為模糊焦點且不合適.



  整體來說本片是少數針對這段歷史有比較完整整理的紀錄片,

  雖作為紀錄片仍有進步空間.

  仍推薦對於這段歷史有興趣的觀眾去看,

  倒是看完之後可能還需補充一些資料才能有更全盤的理解.


  --


  我認為紀錄片在編選素材的時候就已經明確有導演的想法了,

  尤其這片引言就已經有說為何要拍了,

  後面還要在正片內塞這些真的就太過了.



  我覺得應該算有, 畢竟他們在這整個事件裡面是重要的

  有說孫當年去ITRI視察把貴賓的牌子拿掉:"我不是貴賓 這是我的計劃!" XD

  另外倒是連老黃都有篇幅就是了XD



  豆漿店追跡我覺得算重要的,

  畢竟是所有事情的原點.

  就跟當年Apple的車庫一樣具有特殊意義


  追思會本身也沒問題,

  但這邊導演補充了太多自己的心境,

  就陳述事實的紀錄片有失焦點.



  我也認為這部相對更聚焦事件本身,

  相關的第1手資料也是比較深入精確.



  這部份我倒是有不同的看法:


  首先時間順序的問題以現有素材稍加調整就不會那麼突兀,

  就是整理素材要下更多功夫,

  應不至於讓預算膨脹很多.


  補充其他廠商的狀況這點確實可能會需要更多預算,

  不過篇幅也不需要很多,

  畢竟不是主角.


  最後導演少提點主觀意見...這肯定能做的吧XD

  還能減少成本耶



  最終成品的比重我覺得這樣ok

  完全不提好像也有點不大完整(?)



  就因為有觀眾不是這產業的,

  第一個時間序列問題就應更細緻的處理比較好.

  這樣大家20年後來看這紀錄片還是可以立刻進入狀況,

  而不是還要去翻一堆參考資料XD


  導演挖掘鄉野傳奇(豆漿店)那段我也覺得不錯,

  不過如我上面說的,

  拍片動機這種不是主體的事情 開頭也講,

  正片也講,

  就真的有點失焦了相當可惜.'
