title: '[好雷] 造山者-世紀的賭注'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  以往我是不在電影院看紀錄片

  但是這一部講述台灣一群人

  奮鬥建立矽盾的歷史

  在上映之前就下定決心要來看


  看完了整部影片

  很感動


  對一個生活在台灣已經發展起來的人來說

  台灣有半導體的產業就像理所當然一樣

  但是這種理所當然

  是一群心在家國的政治家、科學家一起建造的

  孫運璿先生、胡定華先生、潘文淵先生

  還有一大群當時候的年輕人

  帶領著台灣的人民

  從只有勞力密集產業的台灣

  建造了全世界最重要的半導體聚落

  當時候派往美國RCA學習半導體技術的先進們

  連麥當勞都吃不起

  那時候的台灣是那麼的窮

  也是這種窮勁

  拼了命也要將技術帶回台灣

  將台灣的半導體從無到有建立起來


  影片的前半段

  我不知道有沒有人跟我一樣

  邊看邊哭

  哭的點

  不管是孫運璿先生力排眾議也要發展半導體

  還有潘文淵先生不為自己利益

  花了兩個禮拜將自己關在圓山大飯店

  就為了寫出影響台灣千萬人跨越世代的半導體計畫

  以及胡定華先生在台灣風雨飄搖的年代

  無畏地跳出來主導和聯絡起台灣各界學者

  實現技術復興的計畫



  這些政治家心心念念的都是台灣人民

  是真正無私的付出

  這些真心奉獻讓現在的你我

  擁有如此先進的台灣


  理所當然其實不理所當然

  看看眼前我們現在擁有的一切

  都是前人用心種下的

  我們手上的果實

  都是用他們的血淚所茁壯的


  而面對現今詭譎的政治

  我們要怎麼去面對未來的挑戰

  當年台灣面臨退出聯合國、台美斷交

  成為國際孤兒

  通膨飆漲又沒有技術

  也沒有礦產

  台灣就憑著一群愛國的政治家、科學家

  靠著技術復興突破困境

  帶來繁榮的台灣


  而現在我們又站在了政治變局的風口上了

  那這個時代還有當年那些心在家國的政治家嗎？


  這部影片讓人理解現在的台灣得來不易

  這也是我第一次看到國片

  竟然一堆人留下來聽完結尾曲

  看完電影團隊贊助單位名單才願意走

  或許

  影片結尾了也不算結尾

  因為台灣的歷史正由這個時代的你我續寫著









  --'
