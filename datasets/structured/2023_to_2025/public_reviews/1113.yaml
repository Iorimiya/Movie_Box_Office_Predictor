title: '[新聞] 《電影版 X光室的奇蹟》賣座10億日幣 金'
content: "新聞網址：\n\n以「一張照片就能找出病症的超能力者」放射科醫師與放射線技師為題材，熱銷超過270\n萬冊的醫療人氣漫畫《X光室的奇蹟》，改編成兩部電視劇接連拿下高收視率後，趁勝追\n\
  擊推出電影完結篇，精采程度更甚電視劇，票房更是賣座近10億日幣！《電影版 X光室的\n奇蹟》接續電視劇，由經典日劇《HERO》系列、《假面飯店》系列金獎導演鈴木雅之執導\n\
  ，《那個男人》窪田正孝飾演天才放射線技師「五十嵐唯織」；唯織的青梅竹馬同時也是\n放射科醫師的「甘春杏」由日本廣告女王本田翼飾演；同為放射線技師，並單相思著唯織\n\
  的廣瀨裕乃由近期因日劇《我的第二青春》再度引起關注的廣瀨愛麗絲飾演。此外，電視\n劇版熟悉的班底山口紗彌加、遠藤憲一、濱野謙太、丸山智己、鈴木伸之、和久井映見等\n\
  知名演員也再次齊聚，為系列劃下最精采完結篇！《電影版 X光室的奇蹟》將於2月2日（\n週五）在台上映，加入MAGIC HOUR Premium購買《電影版 X光室的奇蹟》電影票可享88元\n\
  ，更多詳情可見MAGIC HOUR官網或搜尋「88元電影票」。\n\n《X光室的奇蹟》系列作品主要描寫為了找尋病因而使用X光、CT電腦斷層，負責拍攝病變\n的放射線技師，以及透過照片診斷出病況的放射科醫師，因為較少和患者直接面對面，他\n\
  們就像是幕後人員一樣的存在。《電影版 X光室的奇蹟》則講述放射科醫師甘春杏（本田\n翼 飾）得知在沒有醫生的小島上為島民診治的父親病危，因而前往那座離島。陪父親走\n\
  完最後一程後，島上卻因原因不明的感染症及強颱襲擊，陷入危機。得知杏在島上孤軍奮\n戰的放射線技師五十嵐唯織（窪田正孝 飾），為了守護重要的夥伴，以及拯救受苦難的\n\
  島民，他做出了一個決定…。在經過兩部日劇及特別篇後，窪田正孝表示很高興能推出電\n影版：「老實說，聽到要拍成電影時我心想『這部作品要怎樣拍成電影啊』也有感到不安\n\
  的地方。因為我認為在《X光室的奇蹟》之中，有著電視劇獨有的優點。但是電視劇第一\n季結束後，過了兩年還能推出第二季，甚至能推出電影版，都是因為有各位觀眾的支持。\n\
  也抱著對觀眾們的感謝，比起不安更感到開心。」本田翼也表示：「如果沒有放射線技師\n或放射科醫師，很多病因可能就無法找出來，但是他們的存在也不太為人知，希望可以透\n\
  過作品讓更多人知道放射線技師及放射科醫師這些無名英雄。」\n\n甘春杏是本田翼的演藝生涯中，第一個醫師角色，回顧收到演出邀約時的心境，本田笑說\n：「我當時想著，終於來了！（笑）」她也表示：「醫療劇如想像中非常地辛苦，對我來\n\
  說是全新的挑戰。我完全沒有醫療相關的知識，所以作為準備，當時我到醫院參觀學習，\n還拜訪了放射科的醫生，能夠近距離看著每天面對性命的醫療相關人員，我很感動，得到\n\
  了很寶貴的經驗。在實際飾演後，我也感受到這是需要某種責任感的重要角色。」窪田正\n孝則透露電影題材受到新冠疫情影響：「這次電影版以『72小時的高牆』、『感染症』為\n\
  主題，在製作醫療題材的作品時，果然還是會聯想到新冠疫情。因為是2020年席捲全世界\n令人難忘的事，所以電影版還是將感染症當作其中一個主題。」精彩再升級的《電影版\
  \ X\n光室的奇蹟》，將於2月2日（週五）在台上映。\n\n全台最大電影社群平台「MAGIC HOUR」近期與7-11 ibon及全台戲院合作，特別限時推出\n\
  Premium方案，加入MAGIC HOUR Premium，全年購買電影票只要88元，全台上映戲院上映\n期間皆可使用，從台北到屏東，從台中到台東，都能享受全台最殺88元電影票優惠，更多\n\
  詳情可見MAGIC HOUR官網或搜尋「88元電影票」。\n\n--\n                                 01/23 21:03"
