title: '[討論] 懼裂激素的一些想法(有雷)'
content: '今天看完懼裂，蠻喜歡的，尤其對那個給藥方的(藥廠？)背後的設定很好奇


  比如說像接電話的男人，還有一開始幫忙物色的醫生(助理？)等等


  會很好奇他們的目的，以及這到底是不是他們的人體實驗之類


  不過雖然很好奇，但也覺得這部分大概只是一個劇本設定，沒有辦法深究探討


  只是後來我想到一個有點疑惑的地方

  就是為什麼他們提供藥的時候，第一次打的激素沒有精準控制好份量


  雖然有強烈的警告標語「用過即丟」

  但是相較之下，營養素就是精準的7＋7份量

  以及每天要施打的脊髓營養液也是格子都幫你安排好

  營養素應該是每14天就要親自去拿之類的？

  這些都提供的很精準但是唯獨第一個激素會剩不少，而這也是後來伊莉莎蘇誕生的關鍵


  這讓人感覺其實是有「惡意」存在在裡面的


  因為看的過程中會覺得電話裡的男人給人的印象是滿中立的，強調共同體，沒有什麼她跟我

  ，女主角要停止也算是蠻乾脆就寄停止的藥來


  ((當然了，激素廣告與卡片、電話男會強調共同體這件事，代表早就發生過無數次類似的事

  情了))


  不過就是回頭看激素那邊就覺得哪裡不對勁


  當然啦，也很有可能一切都是劇情方便而已

  畢竟整部片看起來也沒打算要解釋整套激素的來龍去脈


  不知道有沒有什麼是我沒注意或考慮到的角度/細節就是了






  --

  對對，完全沒有提到費用

  所以供藥方應該也不缺錢

  我看的時候想說果然還是人體實驗？

  但如果是實驗，供藥的也完全不關心實驗體就是了

  會滿好奇他們的目的到底是什麼

  難道只是純粹想做善事XD

  應該是

  仔細想想應該也是跟女主角一樣

  母體跟分身已經有點分歧了吧

  好像也是啦

  但激素殘劑份量真的好多'
