url: https://www.ptt.cc/bbs/movie/M.1765097442.A.85B.html
title: '[心得] 懼裂 前面還不錯看'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  這部一開始看到預告時，感覺應該是部恐怖片...

  結果後來發現比較像喜劇片ＸＤ

  劇情大致上是在講女主角，因為年紀的關係，本來是健身劇的主要領舞人，

  但被老闆嫌年紀大身材變形等原因、要被換掉，就要失去工作的她在回家的路上因此分神

  出了車禍，

  然後在住院時被一位醫護人員告知可以使用某個物質來回復年輕，

  但這藥有副作用就是只能保持年輕的狀態七天、在七天之後後會回復到原來的狀態七天，

  這樣重複循環，且必須靠她自己來控制這七天的循環，

  她在使用後因貪心不滿足於年輕的狀態只有短短的七天，

  於是不斷地在透支年老的她，直到後面的出現兩個她（年輕跟年老的她）同時存在，

  導致後面互相撕殺的悲劇...

  這部劇前面拍的真的還不錯，讓人有審思自己不要太過貪心，

  有些隱含的意思存在，

  但到後面的噴血劇情覺得有點太over，太狗血了...實在有點可惜


  --

  那是真的

  我也覺得收尾差了點意思'
