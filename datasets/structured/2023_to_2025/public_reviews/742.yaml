url: https://www.ptt.cc/bbs/movie/M.1729601846.A.ED5.html
title: '[好雷]懼裂 是曾經滄海難為水的痛'
content: '我知道，我知道

  這部片是在講女人的容貌焦慮，

  這部片裡的男性凝視充分的表達了主題，

  身為一個男性，對於老直男的行為再瞭解不過，

  私底下這些男人們怎麼看待女人，可以多噁心，男性怎麼會不曾想過呢



  不過身為男性，我依然覺得這部片是今年最恐怖，

  看得我覺得很痛，但不是脊椎在痛，

  有時候我們會問，「你有看懂這部片嗎？」

  指得不一定是你的腦袋是否可以理解它的劇情，

  而是你的心理是否可以體會其中角色的情緒



  有些人說這部片的結尾不需要噴血噴成這樣，

  這種B級風格讓水準盡失，

  有些人說這部片的劇情太好預期，沒甚麼爆點，相當普通，

  我覺得這些想法挺可惜的，

  這部片結局的怪物，肉體變異，爆血跟失控的舞台，

  是為了表現出女主角的一種痛苦，

  這種痛苦，簡單的說就是，



  「我知道最後會變成這樣，但是我寧願這樣，我也不要回去了」




  我寧願接受這種千篇一律講到掉爛的果報

  我寧願變成荒謬的斷頭爆血怪物整組爛掉

  都不要變成你各位台下那種普通平凡的人




  沒有美麗過的人，可以瞭解美麗帶來的矚目嗎？


  從來沒有上過舞台的人，可以瞭解失去舞台那一天的痛嗎？





  很多人會在社會新聞底下留言，

  「這個笨蛋，在公司被霸凌就去自殺，太傻了」

  「被家暴不會離婚嗎，為什麼還要忍耐然後做傻事」

  「有錢人怎麼可能會得憂鬱症，我有錢的話早就爽死才不會這麼蠢」


  這樣的你，

  是青春年華，一張白紙，無限可能的未來在等你，

  或是選擇了平凡幸福的一生，

  即使年華老去也可以開心地過著充實的生活



  但可能就是這樣，你看懂了劇情，卻沒有懂了這種走向自我毀滅的心情

  大家都知道，知足常樂，海闊天空，

  女主角E有窗戶大到爆的好萊屋豪宅，為什麼不退休度假多開心呢，

  為什麼還要去滿足那些臭噁男，

  恐怖的是，這一切都是自找的，是可以選擇的末路



  沒錯，從來沒有人反對，這總是自找的，

  曾經滄海再也難為水，比起容貌焦慮，或是男性壓迫，是一種更大的苦難，

  就是因為這一切是會上癮的，再也回不去



  當她曾經有上岸的機會，可以去找愛他的老同學停止這一切，

  這樣的出發點也是為了滿足自己受到關愛的慾望，

  為什麼不選擇好男人跟幸福人生，反而是跟一群噁心的傢伙前面爆死



  你可以不認同，你可以覺得這種情緒真是可笑，

  但是這才是電影要表達的重點阿，

  那個渴望就好像阿彌殼斷層，

  焦慮，滿滿的焦慮，但是又好想進去那個洞裡，要變成肉醬都可以



  美會過去，痛苦會留下

  噁心的男人噁心，但總有機會可以擊敗，

  現實的觀眾現實，但總有方法可以接受，

  唯獨衰老是無敵的，永遠無法擊敗，

  再厲害的人終究有一天要把辛苦一輩子的江山交出來

  現在面前有一管藥可以解決這個問題，

  要怎麼拒絕，怎麼捨得跟閃亮的自己道別



  小時候覺得恐怖很恐怖，

  長大後覺得，焦慮，寂寞，回不去，才是恐怖

  只想看怪物噴血，劇情扭轉，這種到處都看得到的東西，

  然後覺得劇情不難懂，

  畢竟是有些可惜啦





  --'
