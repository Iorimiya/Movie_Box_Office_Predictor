url: https://www.ptt.cc/bbs/movie/M.1729038013.A.E68.html
title: '[普好雷] 懼裂-基本上看5分鐘就知道後面發展了'
content: '防雷資訊頁








  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這部片的藝術鏡頭不少

  氣氛也有獨到之處


  比起以前的另一支片肌膚之侵拍得讓人看不懂

  這部則是淺顯易懂的多


  但基本上你看前面就知道後面會發生什麼事了

  劇情上完全沒有驚喜

  甚至說無聊


  我猜比起劇情他更重視故事的隱喻

  但對我來說比起隱喻我更想看的是有趣的故事


  另外我不太懂的地方是


  替換身體的時候

  意識到底有沒有被替換

  電影看起來應該是完全沒有


  不然就不會醒來發現另一個自己在那亂搞

  既然這樣


  長得不像你

  思想也不像你


  那到底為什麼要放不下


  "你們兩個是同一個人"


  這也只是人家跟你講的、會這樣一直強調好幾次

  八成是編劇也發現這裡不合理吧


  "我"自己本身

  完全享受不到轉換後的任何東西

  頂多就是電視上看到另一個自己過的多多采多姿


  就像幻想自己中了樂透後錢要怎麼花那樣

  完全就只是一個幻想、對我本身一點都沒有影響

  而中樂透這個幻想如果會影響到我本體的性命

  我鐵定會馬上停止啊


  因為那個就不是我


  比起說是自己

  分裂體比較像自己的小孩還比較說得過去


  後面玩開了變得像B級片我是沒甚麼意見

  無聊比較讓我坐不住


  但整體來說就是普通偏上吧

  鏡頭的藝術性還有角色加很多分


  看完後我跑去YT看了第六感生死戀時期的黛咪摩爾

  確實感受到，對人們而言

  最大的恐懼應該是來自逐漸老去的自己吧


  --'
