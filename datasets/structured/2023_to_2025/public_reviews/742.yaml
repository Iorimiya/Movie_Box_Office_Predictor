title: '[新聞] 金球獎黛咪摩兒「懼裂」封后 從影逾40年'
content: '新聞網址：


  金球獎黛咪摩兒「懼裂」封后 從影逾40年首獲獎：我還沒過氣[影]

  2025/1/6 12:23（1/6 12:35 更新）


  （中央社加州比佛利山5日綜合外電報導）黛咪摩兒（Demi Moore）憑藉肉體恐怖電影「

  懼裂」（The Substance）精湛演出，今天在金球獎頒獎典禮榮獲電影類別的音樂喜劇類

  最佳女主角獎。


  本屆與黛咪摩兒一同入圍這個獎項的還包括「夜母」（Nightbitch，暫譯）的艾美亞當斯

  （Amy Adams），「魔法壞女巫」（Wicked）的辛西婭艾利沃（Cynthia Erivo），「毒王

  女人夢」（Emilia Perez）的卡拉加斯康（Karla Sofia Gascon），「艾諾拉」（Anora

  ）的麥琪麥迪遜（Mikey Madison），以及「挑戰者」（Challengers）的辛蒂亞（Zenday

  a）。


  美國有線電視新聞網（CNN）報導，62歲的黛咪摩兒入行超過45年，她今天接過獎座時，

  特別提到好萊塢並非總是寬厚待她。


  她說：「30年前，有一位製片人告訴我，我是『爆米花女星』。當時我把它（這句話）解

  釋為這個（獎項）不是我能得的，意思是我可以拍很成功的電影，賺很多錢，但我（演技

  ）無法獲得肯定。而我真的信了。」


  黛咪摩兒今天在獲獎感言中還提到，「懼裂」向她展示出「宇宙告訴我，我還沒過氣」。

  （譯者：蔡佳敏/核稿：劉文瑜）1140106


  --'
