url: https://www.ptt.cc/bbs/movie/M.1729593530.A.E63.html
title: '[普大概無雷] 充滿冗贅的《懼裂》'
content: '首先，我覺得這個片名翻譯很爛，不知道有沒有人有同感？


  其次，過於聚焦於他人的凝視點上，既然已經知道導演想表達什麼的情況下，類似場景過於

  頻繁出現，那就只是冗贅


  最後，既然劇情都很容易猜中了，最後的20幾分鐘的場景幾乎可以說是毫無意義，反而模糊

  了前面的焦點，還拖長了無聊的時長，留白讓人有思考的空間，想像力發揮的時刻，這樣應

  該會是更好的處理方式



  ====防雷====



  人本來就有容貌焦慮，這片透過強烈的對比，彰顯出女主角更強的容貌焦慮問題，或許同時

  也有更年期症狀，這個我不是女性，我不懂

  但相同的是，我也曾經會對自己容貌感到十分擔憂，究竟要單身到什麼時候、是不是我太醜

  、是不是我有病……諸如此類的問題也發生過(現在沒發生，只是因為習慣了單身)

  這部作品或許會讓許多人重新審視自己，像是「更完美的自己」是有必要的嗎？

  這在電影中段表現的很完美，尤其是老年的自己和電視上年輕的自己產生衝突的那段，

  我相信這絕對是這部作品中的完美橋段，直到這邊都是上乘之作

  但到了結尾卻大灑狗血，甚至加入孩子被濺灑的場景，到這邊已經是毫無意義，浪費了前面

  的表現，這點也是我只能給到普的原因

  若能的話，斷在最後鏡子前的畫面就已足夠


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --



  手機選字= =

  本來就是門外漢，我又沒在拍電影：)'
