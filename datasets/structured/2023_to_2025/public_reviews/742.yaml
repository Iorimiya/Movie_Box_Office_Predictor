url: https://www.ptt.cc/bbs/movie/M.1729615366.A.0F4.html
title: '[好雷] 懼裂：簡單暴力的勸世片？'
content: '如標題，看完的第一個感想是，這部根本是叫大家不要因容貌而感到焦慮的勸世片吧


  雖然演出上很血腥，各種看了都會令人「Ouch」一下的尖銳刺痛感，但給人感覺更多的是精

  神恐怖與不安，過程中看得滿滿焦慮，對長相自卑的人更有共感


  本來以為只是賣弄視覺的獵奇片，但精神獵奇的部分做得很出色，深深讓人覺得視覺效果只

  是導演手法的補助罷了，到後來不論女主角變得多畸形，反而都見怪不怪了


  依靠極端的方式變成理想的自己，結果越走越偏，情況越來越糟糕，結果真的很令人唏噓




  我覺得片中「即使分成母體和分身，仍是共同體，並沒有所謂的你與他」的部分真的太有趣

  了，電話客服說的完全不知是真是假


  若為真，女主角自我矛盾會更有衝突性，畢竟人最大的敵人就是自己嘛

  若為假，雖然就沒那麼衝擊與衝突了，但會比較好解釋個體的差異與後續的分裂


  真要選答案的話我可能會選前者，不過我感覺也不必非得要有個正解，畢竟那客服感覺就不

  是很可靠，講的話也不見得就是正確的


  儘管以上帝視角來說，女主角會出錯完全是意料之內的事情，但換個角度想，客服要女主角

  遵守規則不就是以防出現料想不到的情況嗎，所以客服或許沒說謊，同時女主角的情況也是

  客服想不到的


  因此想來想去，個人覺得最能說服自己的說法是，女主角從最初到差點打下終止激素前，都

  的確只有一個自己，但會因為自己當下肉體的狀況而想法不同，後面因為虛榮貪婪，把情況

  搞到不可控，最終惹出了兩個意識的Bug




  片中分身想成為母體，誕生分分身的走向可能很好猜，但或許是剛下班腦袋太累，所以看的

  時候我沒想到，看到這走向有讓我驚訝到


  當下女主角的心理狀態也很明顯變得癲狂了，拿著自己曾厭惡的原始樣貌照片出門的反應，

  也是令人唏噓到不行，落魄到最後才發現最初的自己也很好（我承認有點被教育到...），

  但一切都太晚了


  雖然頂著照片進公司，還能騙過工作人員這很瞎，但荒謬到有讓我笑出來，之後的腥風血雨

  其實也滿多一回想就滿好笑的地方，只是看的當下真的笑不出來就是了...


  儘管分裂技術的部分沒有任何解釋，留白的部分可以再出個續集說明？但不說明其實也沒關

  係，單純聚焦在女主角走向自我滅亡的過程，這部電影的完成度已是相當高了


  不過電影滿滿的尖刺鏡頭，讓我有夠後悔進電影院大螢幕看，早知道就等上串流用小螢幕看

  ，還不會看得那麼痛苦XD


  --




  是啊這都不是重點，不過多少還是會好奇供應商到底是什麼來頭，但這個來源或許保持神秘

  才是最好的選擇



  女主角被列為503，男護理師200多號，就代表參與這實驗的人很多，男護理師甚至十分關注

  女主角的情況


  如果黑一點的話的確可以上演某人的分身壓榨完自己的母體，進而鎖定別人的穩定液這種戲

  碼，但這走向就偏離了這部的主軸了


  而且男護理師完全只是抱著看女主角戲的心態，完全沒有想從女主角身上得到什麼的樣子，

  要嘛是導演不想脫離主軸，要嘛是奪取他人穩定液的後果更加嚴重，男護理師才沒有作為吧


  或許這個答案可以續作演出來，又或者是石沉大海供人想像了哈哈哈



  互毆噴血的部分的確是很爽快，不過這部各種尖銳插管等令人不舒服的演出，以大銀幕方式

  播映，對本人來說不適感大增


  這算是褒義，但本人看的當下還是有點難受就是了，若是小螢幕觀看的話或許本人會更好入

  口XD



  簡單暴力的部份指的是結尾的腥風血雨，那段我能想得到的形容就簡單暴力了XD，其餘女主

  角自我掙扎矛盾的部分仍是相當有深度的




  就算不是照順序，那只是隨機安排的號碼，但至少也有客戶可能不只女主角和男護理師的跡

  象就是了，而且照男護理師指引女主角的舉動看來，女主角也許不是唯一一個被他引導的


  取貨處其他櫃子空白，或許是客戶像女主角出了意外而亡或選擇退出，號碼才被撤掉，因為

  沒有合作需求了不必留位置


  而且EKman的蝦皮自取店形容超傳神XD，或許也只是那個取貨處據點只有兩個客人而已，這

  個實驗規模可能非常大，每個區域都有據點也說不定'
