content: '互通的

  客服強調好幾遍

  「You are one」

  沒有必要騙女主（觀眾）


  那為什麼在不同的身體態度會不一樣？

  會嫌棄另一個身體的自己？

  其實這種狀況在一般人身上也很常見啊

  舉例來說

  一個酒駕慣犯喝酒後管不住自己硬要開車

  酒醒後自責罵自己為何又錯做事

  雖然酒駕前後態度不一

  但都是同一個人格啊


  也有聽說很多變裝皇后

  平時素人時是非常內向的

  變裝後就大膽開放

  但也都是同一個意識


  只是在電影裡因為身體的不同

  造成了這種態度前後落差被放大了

  甚至會讓人都誤以為是不同人

  連主角自己都迷惑了


  --'
