title: '[無雷] 懼裂 我只有變態可以形容'
content: '建議千萬不要帶吃的，尤其不要帶葷食


  對不起我還驚魂未定，接下講的話可能會有點破碎

  在我還沒看以前，我以為這是爆米花電影

  我以為只會沾邊講一些社會諷刺和審美觀念的扭曲

  但我錯了，我感覺我就像進到叢林的遊客一樣天真

  它很有深度，它在視覺特效和故事鋪陳上都很有深度

  隨著劇情推進和人物關係變化，恐懼開始往我身上爬

  鏡頭也慢慢越來越暴力，血腥畫面成份不斷飆高

  當下我都懷疑導演是不是有經歷過什麼，根本變態

  有好大一段我都要依賴「哇這真的太噁了到底會怎樣」

  的好奇心努力睜著眼睛看


  總之，我認為這部片是可以考慮進電影院欣賞的，很有趣

  但會排斥肉體疼痛或是把人把自己物化的，不推薦



  --

  就，也可以帶而不吃，看個人

  爛片(物理特效)

  哭悲也不錯'
