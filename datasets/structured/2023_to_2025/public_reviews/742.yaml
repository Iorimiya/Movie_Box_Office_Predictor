url: https://www.ptt.cc/bbs/movie/M.1728924239.A.C80.html
title: '[好雷]《懼裂》對鎂光燈的執拗，那才是我的血肉'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n看《懼裂》是我近期最不舒服的觀影體驗（好的那種）。\n\
  \n做為恐怖驚悚類型的電影，它充滿了噁心、腥臭，和導演在鏡頭上刻意的壓迫與逼近。但\n一切最讓人作嘔的，是整部片層層遞進，不斷切開又縫補而成的扭曲人性。\n\n\
  當你獲得重返往日榮耀的機會，願意用自己的靈魂交換嗎？值得注意的是，女主角伊莉莎\n白的決定並不是毫無猶豫。她先是好奇、反覆思量，又在外界否定的推動下選擇接受，這\n\
  樣的猶疑掙扎、拿起又放下的鋪陳，讓角色更加貼近觀眾的人生。\n\n沒有人天生不愛自己，直到在心中建構出比較的對象，可能是爸媽口中別人家的小孩、畢\n業海歸飛黃騰達的同學，或是根本沒聯絡，一切認識只建立在螢幕上的耀眼明星。我們怕\n\
  的不是不愛，而是不再被愛。\n\n交易完成後，金髮尤物蘇橫空出世，變成了伊莉莎白的優化形態、她愛的那個「自己」，\n讓伊莉莎白對母體的厭惡日漸增加。青春的肉體美豔動人，原本的自己更顯得衰老鬆弛。\n\
  於是她更加不愛惜健康，一開始只是當沙發馬鈴薯什麼都不做，接著狂吃垃圾食物，再到\n毀壞整個家的自暴自棄。\n\n唯有光明才能對比出黑暗。當我們羨慕起別人、懷念過去的成就，甚至幻想未來的美好，\n\
  現在的自己就只變得可憎、毫無價值。於是我們想把灰暗的自己，以及這樣不堪的念頭藏\n起來。先安好放在家中，接著躲進暗房，丟到不見天日的角落，直到有天我們下定決心，\n\
  殺死不夠好的自己，把所有自卑一起掩埋，心也因此不再跳動和歌唱。\n\n令人心臟顫動的音效、鏡頭裡黛咪摩爾的癲狂，映射出觀者隱藏的虛榮心。它就是要狠狠\n威逼你，直視那些不敢面對卻普世共有的偏執觀念。\n\
  \n\n現代人的社群，竟然跟以美貌身材為首的演藝世界如此相似。\n\n相比前人，我們看得更遠、想得更多，現在連坐在隔壁的同事同學，也是暗暗較勁社群按\n讚數的潛在敵人。放眼全球，人人皆是網紅。眾人盡力展演美好的自己，調整曝光度、修\n\
  飾臉型，甚至寫出違心的話、虛假的微笑，只為求得一篇火紅爆文。抽離觀影當下的驚懼\n不安，才突然發覺，也許我們對於成功的僵化信念和扭曲心態，一點都不亞於電影裡醜陋\n\
  變形的怪異皮囊。\n\n《懼裂》用最誇張、最衝擊的形式，嘗試警醒觀眾：當心靈雞湯文高唱愛自己，推薦購買\n更多美白保養品的同時，請好好安撫你內心的自卑、脆弱和不安。人人都愛「美」，但美\n\
  的角度不只男性凝視下的豐胸翹臀；人生劇本無法永遠定格美好，但每個人都可以試著放\n過自己、放下批判和執念，欣賞不同生命階段的別樣滋味。\n\n唯有接受與自戀相伴而生的自卑，才可能放下完美，慢慢走向自愛。\n\
  –\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n--\n想到美鳳姐代言的鳳凰電波。\n演藝人員等到巔峰期過去，很多都會力求轉型，而伊莉莎白卡在過去的輝煌裡。\n\
  她的生活裡沒有其他人生路徑可以參考，自然較難跳脫。\n嗯你點出我長久的問題哈哈哈\n我喜歡影評後面帶到現實生活意涵，但寫法可以再調整"
