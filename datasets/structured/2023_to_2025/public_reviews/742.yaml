url: https://www.ptt.cc/bbs/movie/M.1749589814.A.A09.html
title: '[好雷]  懼裂 比起恐怖更多的是難過'
content: '手機排版不好意思


  今天剛看完這部片

  老實說看的時候真的是很難過很壓抑

  其中最讓我能感同身受的一幕就是女主角本來跟老同學有一場約會

  但他不斷地把自己跟另一個他作比較，不斷地回到浴室檢查自己的外表檢查到最後甚至毁

  了自己的妝容

  這一段彷彿讓我看到了自己

  我這兩年來其實也有很嚴重的容貌焦慮 甚至還到整形板上面問說該不該整形，我曾也像

  他一樣出門之前不斷地照鏡子檢查自己的外表

  就算走在路上看到有鏡子我也會忍不住的看一下自己的臉，手機裡面有一半都是自己的自

  拍

  很多時候想要出去認識人，但內心都會有聲音告訴我會被拒絕會被無視不要去，所以就真

  的會像片中的女主角一樣把自己鎖在房間裡看電視吃垃圾食物。 上班的時候看到好看的

  客人也會難過到跑去廁所哭，覺得自己怎麼長這樣 我一輩子都不夠好。

  直到最近才有好轉慢慢的接受自己


  如果看到這裡你還沒看過這部片的話，我真的非常建議要做好心理準備，因為他讓人難過

  的鏡頭絕對比惡心恐怖的部分還要多得多。



  --'
