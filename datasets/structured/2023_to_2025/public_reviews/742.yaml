url: https://www.ptt.cc/bbs/movie/M.1730041664.A.A25.html
title: '[討論] ［好雷］懼裂—伊不悔之一個別出心裁的Ha'
content: '下午看完震撼到現在

  技術類關於鏡頭語言/音效的讚譽就不多提了

  奧斯卡技術類獎項提名應該只是最最基本

  非常推薦進戲院觀賞

  帶來的沈浸感相信絕對還是遠大於串流

  劇情方面想特別分享一點個人對結局的看法

  前面有人提到如果停在變成怪物就結尾就好 後面大爆噴其實是容易讓觀眾對於故事所要傳達的寓意失焦

  不可否認 把結尾停在這絕對是最保險的安全牌

  並不會減損它依舊是部好電影的客觀事實

  但個人認為 就是因為安全—所以顯得公式/教條

  變成怪物了 然後呢？ 就像鬼滅裡面上弦二一樣被自己醜死以後就結束了嗎？

  不 我認為導演大概也有意識到這樣結尾所帶給人的說教感

  如果只是告訴大家”人應知足/珍惜自己所有”、”要尊重平衡”、”這就是被慾望吞噬的人的下場”

  那這部片終究會被淹沒在大眾記憶之中

  但整部電影基調就從導演大膽描寫變成怪物以後的劇情開始急轉直下 徹底擺脫最後一絲說教感

  前面那篇曾經滄海難為水的心得寫得非常好

  就像所有屈服於慾望進而成癮的人一樣

  從看到自己那根發黑手指開始 她根本早知道最後結局走向大概會是如何（當然你也可以解讀成選擇性忽略）

  但給她選再多次都一樣 既然想要再次成為星光大道上那顆閃耀的明星

  To Elisabath/Sue, it’s never an option, it’s the ONLY WAY, it’s THE SUBSTANCE.

  看看Elisabeth 最後的笑容 多麼的完美啊 我在電影院也跟著她一起笑瘋了

  對於一個變成怪物以後還是勇於上台面對大眾

  堅持不懈追尋自己目標 最後某種意義上也確實圓夢的人來說

  伊不悔 真的只能RESPECT而已:)






  --

  Sent from nPTT on my iPhone 12 Pro Max


  --'
