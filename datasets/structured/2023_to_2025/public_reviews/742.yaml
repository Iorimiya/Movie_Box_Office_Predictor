url: https://www.ptt.cc/bbs/movie/M.1731240771.A.FE3.html
title: '[微好雷] 懼裂 雖很B級 但比小丑2好看 贏了'
content: '防雷資訊頁


  這部片的心得我分兩部份討論

  一個是電影本身

  一個是電影的意識型態

  這樣比較不會失焦













  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  首先是電影本身

  導演看得出來很有功力

  運鏡、節奏、剪接都很到位

  遠比小丑2的那隻拍得好

  但我自己認為還是有些缺憾

  中間有蠻多部份其實有點冗長

  懼裂的劇情非常簡單

  可以說從頭到尾都只是在講一件事

  那就是女主對於容貌非理性的追求最終毀了她

  幾乎沒有任何支線劇情

  所有其它橋段都是來輔助這個主線劇情的

  如此簡單易懂的劇情

  甚至我覺得電影接觸多一點的人看到女主剛拿到藥品時

  就差不多知道結局會發生什麼事了

  既然劇情是這樣單純

  片子也拍得很象徵性

  那很多中間的過程其實也可以再更精簡一點

  讓整部片更加的短小精悍

  維持那種極簡的優雅調性

  而很多人質疑背景設定上的合理性說不定也能不攻自破

  像我就舉蘇暴打伊莉沙白這段

  伊莉沙白已經快被吸乾又老又醜還健步如飛

  那如果暴打過程再簡約一些是不是就能解決這個問題？

  或至少把追打過程換成蘇單方面凌虐就好

  但這樣我也還是覺得太長了一點

  最後的噴汁我很喜歡

  就是要這樣惡搞才好玩

  但也是一樣噴有點太久

  在縮短個五到十分鐘會更好一些


  劇本沒什麼好說的就是上面提到過

  走一個極簡路線

  電影從頭到尾講的就只有一件事

  我認為也有好好傳達了

  而有些支微末節的小bug其實根本不用去計較

  因為那很明顯也不是電影的重點

  如果你很講求嚴謹電影世界觀那這片大概看了會頭很痛

  我會建議看這種片就放輕鬆去感受就好


  對電影本身我覺得不到神作

  算是還不錯的B級黑色喜劇片


  再來說說意識型態

  這裡很抱歉我無法茍同導演想暗示的訊息

  也就是女性的容貌焦慮

  男性凝視與社會壓力也是幫兇

  不好意思

  會有容貌焦慮

  100%是你自己的問題

  心理有病請求助專業醫師協助

  找偏方最後毀了自己

  You only have yourself to blame.

  電影看得出來有刻意在醜化老闆

  但老闆除了講話機掰了點

  完全就是在商言商

  沒有錯

  女明星年華老去就是不好賣

  就算是美鳳姐也還是有個極限在

  炒作一下美魔女議題接接秀場廣告業配還OK

  要當作賣美色的宣傳主力太勉強的

  這裡注意是賣美色

  不代表你不能賣演技或賣其它地方

  世界很大女人的價值也不是只有容貌

  自己走不出來不要怪東怪西

  這就跟現在外面很常在說的普信男Incel整天哭夭為何女人只愛高富帥

  認為外面女人全都是勢利眼一樣可悲

  不然反過來拍一部懼裂男性版

  找個矮窮醜的中老年禿頭肥仔打藥後變身天菜男神去應徵超級男模

  然後女老闆和一狗票女粉整天想要逆推

  把女性凝視特寫再特寫

  就像下面這樣



  我是覺得沒什麼意義

  男人就是愛火辣年輕正妹

  女人就是愛高富帥大肌肌

  世界就是這樣運轉的

  就跟老虎吃肉馬吃草一樣自然

  控訴什麼凝視的

  都馬是沒人凝視自己調適不良羨慕嫉妒恨

  或是凝視你的是你不喜歡的人不論男女

  不過電影裡是純聚焦在社會目光的凝視上

  而不是個人對個人的

  所以就別扯太遠


  總之意識型態這裡我是不吃這套啦

  不過政確歸政確

  電影歸電影

  導演也可以說我就是把老闆拍得好笑一點沒有說教也沒有醜化的意思

  大家不要會錯意

  那也OK囉


  --

  謝謝誇獎:)

  焦慮本來就是自然會發生的事

  遠古部落年代沒有商業行為

  你覺得人就沒有社會壓力不會焦慮？

  就連黑猩猩和狗狗貓貓都會因為爭寵討關注大打出手了'
