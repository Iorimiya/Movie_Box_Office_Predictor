url: https://www.ptt.cc/bbs/movie/M.1756896383.A.200.html
title: '[請益] 懼裂的一些問題（雷）'
content: '防雷。防雷。防雷





























  ----------------------以下有劇情雷------------------



  之前電影台播放跟著看完了這部

  後續又上串流重新看了一遍（怕電視上有剪片有些劇情會不完整）

  看完之後仍有幾點疑問



  1. 伊莉莎白怎麼不偷蘇的時間？

  7天交換是為了平衡。

  一開始是分裂體 蘇 打破這個平衡，造成母體 伊莉莎白 的手指老化，後續蘇打破平衡的

  情況越來越嚴重，才讓母體老化成那樣。

  伊莉莎白很生氣蘇打破平衡但又無法終止實驗。

  那伊莉莎白不是也能打破平衡嗎？蘇偷她多少時間她也能偷回來啊。

  母體又不需要分裂體提供什麼東西，伊莉莎白才是蘇能存在的原因。

  伊莉莎白不偷蘇的時間是因為她也很討厭自己所以想7天期限到趕快換一換？那蘇打破平

  衡她幹嘛生氣？



  2. 蘇為什麼要殺母體？

  她要維持蘇的生存及美貌要靠母體生出的穩定液。

  跨年晚會前一天，蘇一直不換導致母體無法提供穩定液，她才迫不得已換回來。

  那蘇怎麼還敢因為生氣母體要殺她而反殺掉母體？沒母體她頂多撐一天耶

  蘇總不會覺得她把伊莉莎白幹掉從此之後她就不需要穩定液了吧？

  我一直沒有很懂蘇到底殺伊莉莎白幹嘛，就因為生氣？？



  3. 伊莉莎白吃垃圾食物會怎樣嗎？

  電影裡蘇看起來很氣伊莉莎白7天都只是當廢物宅在沙發上看電視吃高熱量食物。

  不過伊莉莎白要幹什麼跟她有關係嗎？

  她自己也是找男人亂搞（還帶回家）伊莉莎白也沒介意她隨意跟人發生肉體關係啊（蘇也

  可能得病或緋聞導致事業不利啊）

  伊莉莎白7天只宅在家裡沒做其他事情反而對蘇來說還比較方便吧？就不用去擔心交換之

  後會有突然要面對的突發狀況，那她在不爽什麼？



  伊莉莎白的行為我比較能理解，

  但蘇的一些行為真的讓我很問號？？

  希望有人能幫我解答，謝謝



  --'
