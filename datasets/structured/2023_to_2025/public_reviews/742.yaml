url: https://www.ptt.cc/bbs/movie/M.1729915052.A.39A.html
title: '[普雷] 懼裂 感覺不算肉體恐懼最極限'
content: '以下有雷


  可能是我抱有錯誤的期待吧

  我是來看所謂肉體恐懼最極限的

  結果結局就只是個怪物對觀眾360度花式噴血

  一點都不可怕

  看男製作人吃蝦子還比較讓人坐立難安


  我覺得這部片最有趣的地方是 You are one 這句話

  你如何把另一個更加年輕貌美的人視為自己

  你該如何看待與這個自己的關係

  我會被這個自己吞噬嗎

  「自己」的概念到底是什麼

  你願意為了這個美麗的自己付出多少


  這個主題可以有很多令人不安的延伸


  舉例來說

  如果伊莉莎白最後選擇回去當母體

  讓美麗的蘇上台完成表演

  繼續維持這種扭曲的關係並放任自己的肉體變得更不堪入目


  或者蘇如果真的分裂出另一個美麗的自己

  自己最後也變成伊莉莎白的角色


  整部電影從開頭的雞蛋就在講分裂這件事

  他有機會擁有一個既扣題又真的非常扭曲的結局

  讓觀眾離開電影院都還頭皮發麻

  結果導演選擇讓怪物上台噴爛老白男

  這年頭針砭男性凝視的電影還會少嗎

  挺可惜的

  -----

  Sent from JPTT on my iPhone


  --'
