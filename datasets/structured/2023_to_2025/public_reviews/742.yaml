title: '[好雷] 創意滿分! 懼裂 '
content: "一樣有雷   未看過本片勿入\n\n\n強烈推薦\n\n沒想到居然有人敢拍出來\n\n就像<傲慢與偏見> 完全沒在遮掩 就是要告訴你\"女的要年輕要正\
  \ 男的要帥要有錢\"\n\n這片也沒在遮 就是要告訴你\"女的要年輕要正\" 價值觀強勢洗腦\n\n居然有人敢拍出來\n\n以下有雷\n\n\n\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n1.其實就跟<死亡筆記本>一樣\
  \  多一個發明 就足以支撐出一部作品\n\n2.前半段辛辣地諷刺老女主角  星星地板 餐廳吃蝦 廣告看板 尋人徵才啟事\n\n  把女主角逼到要去打藥\n\n\
  \  其實白居易也寫過嘛:\n\n  曲罷曾教善才服，妝成每被秋娘妒。\n  五陵年少爭纏頭，一曲紅綃不知數。\n  鈿頭銀篦擊節碎，血色羅裙翻酒污。\n\n\
  \  年輕有姿色的時候 琵琶女也是\"一曲紅綃不知數\"  後面老了\"暮去朝來顏色故。\"\n\n  那就只剩下\"夜深忽夢少年事，夢啼妝淚紅闌乾。\"  這故事我們高中就知道了\n\
  \n  \n\n3.伊莉莎白跟蘇難道不能雙贏嗎?\n\n  一開始按照規則來 七天七天輪換  保持平衡 是真的很難嗎?\n\n  還是跟葉大雄一樣 拿到道具一定要亂玩\
  \ 最後吃苦頭?\n\n4.看到蘇找理由 \"再一天就好\" \"沒辦法 再多用一天\"\n\n  非 常 有 感 觸\n\n  日常生活中也是經常 \"我再吃一塊就好\"\
  \ \"我還年輕 再熬夜一天沒關係\"\n\n  然後痛苦輪迴 下次遇到誘惑 仍然\"再吃一塊就好\"\n\n  \n\n\n5.我中間有中離一段  從第一次伊莉莎白變白髮老婦回call客服開始離開\n\
  \n  回來的時候看到蘇在上脫口秀  伊莉莎白在電視前酸她\n\n  不明白之前都是兩者無法共存 一定是A清醒B昏倒 或B清醒A昏倒\n\n  這邊怎麼兩具肉體可以同時清醒\
  \  徵求補完劇情 謝謝\n\n6.我聽過但不了解什麼叫\"男性凝視\"   這個名詞大概伴隨這部片被大量討論、引用吧\n\n7.高中同學段落是最可惜的\n\n\
  \  \n\n  兩個人約好晚上八點聚會\n\n  19:30伊莉莎白化妝  只要有一個機會 只要妳有打開門 走出去 跟高中同學聊天\n\n  一定會受到高中同學的追捧\
  \  女神重返風采\n\n  這部片馬上走向一改 變成\"老女人也有自己的價值\"\"年老，心不老\"\n\n  搭配前面的餐廳對話 我還一度以為能那樣挽救女主角\
  \  走向happy ending\n\n  最終伊莉莎白走不出門 決定困在自己的焦慮當中  Fred也救不了她 後面劇情也註定了\n\n\n8.如同許多心得文也提過的\
  \  我覺得收尾收在蘇分裂出怪物即可\n\n  \"一味追求年輕貌美 最終得出醜陋無比的怪物\" 警世意義就已經到位了\n\n  硬要讓怪物伊莉莎白蘇化妝 戴耳環\
  \ 出門 上舞台表演 大噴血 最後一堆血肉含笑而終\n\n  老實說 折磨觀眾而已............也許導演爽吧 何必呢\n\n\n  但是怪物在台上掉出一顆完整的乳房\
  \ 倒真的是神來之筆\n\n  \"男性觀眾想看奶 我給你看完整的奶\"   諷刺意味十足\n\n\n9.有人統計全片有幾次敲門 拍門嗎?\n\n\n10.整體來說是給4.5顆星的優秀作品。本片創意、設定、想法跟特效都很強大。推薦!\n\
  \n\n--\n\n穿黃大衣的人一直被暴打耶\n\n--"
