title: '[討論] ［好雷］懼裂全程無冷場'
content: '看版上很多人推薦

  今天就去看了


  個人覺得想出這劇情真的超屌的

  尤其是把那人性的貪婪跟醜陋詮釋的很到位

  當新分身連續抽滿3個月

  要交換的時候

  真的會覺得有點窒息的感覺

  因為很難想像本尊回來會變怎樣


  但結尾我是覺得有點搞笑

  像是跨年舞台上

  狂噴血真的很北七

  還有最後身體都碎裂

  只剩頭在那邊爬動

  我覺得很像史萊姆


  然後本尊決定停止又反悔那段

  兩個人的打鬥我也覺得很扯

  本尊不是已經很老了嗎

  還可以跑這麼快


  但瑕不掩瑜啦

  我覺得這齣真的很好看

  感覺場次好像都不多

  但今天很多人進場

  真的趁下檔前趕快看惹


  --

  Sent from nPTT on my iPhone 15 Pro


