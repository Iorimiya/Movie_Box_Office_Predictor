url: https://www.ptt.cc/bbs/movie/M.1738383512.A.2BA.html
title: '[新聞] 超狂！女導拒絕漫威只為專注《懼裂》 堅'
content: '超狂！女導拒絕漫威只為專注《懼裂》 堅持到底搶到奧斯卡門票


  2025/02/01

  自由時報

  記者許世穎


  法國導演柯洛里法吉特去年憑《懼裂》大獲成功，也讓黛咪摩兒重返榮耀，強勢入圍下個

  月將頒發的第97屆奧斯卡影后。她接受《綜藝》訪問時分享拍攝幕後面臨的諸多挑戰，報

  導中也意外揭露她曾獲邀執導漫威2021年的《黑寡婦》，但為了專心創作《懼裂》而放棄

  了高報酬的工作。


  《懼裂》全球票房高達7675萬美金（約台幣25.28億元），更入圍第97屆奧斯卡包括最佳

  影片、導演、女主角、原創劇本、妝髮共5項大獎。《綜藝》報導指出：「《懼裂》的故

  事對法吉特來說極具個人意義，以至於她願意為此做出巨大犧牲。她在撰寫劇本時一度身

  無分文，但堅持從頭到尾保有創作控制權。」更提到她拒絕了許多高薪邀約，甚至和漫威

  在《黑寡婦》初步討論時就已破局，「只為專注於這個計畫。」



  當時法吉特憑藉2017年的《浴血狂花》（Revenge）嶄露頭角，確立了自己在類型電影中

  的強大影響力，她對《綜藝》表示：「在電影製作過程以及艱難的後製階段，我一直緊抓

  著這部作品不放。當時每個人都希望我讓它變得『不那麼暴力、不那麼極端、不那麼血腥

  、不那麼直白』，但我堅持自己的想法。」而這部電影也讓她成為了第9位獲得奧斯卡最

  佳導演提名的女導演。


  《懼裂》目前正於全台戲院重映中，同時也於串流平台CATCHPLAY+獨家上架。第97屆奧斯

  卡將於台灣時間3月3日上午舉行。





  --'
