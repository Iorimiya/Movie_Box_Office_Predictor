url: https://www.ptt.cc/bbs/movie/M.1755745395.A.9E0.html
title: 'Re: [討論] 懼裂電影想表達什麼'
content: '並不是

  劇中出現你們是一體的回答多半是在專線電話

  而兩個自我都曾經打電話抱怨另一個自我

  這時才被回說你們是一體的


  其實兩個自我都享有分裂前的知識記憶

  （蘇記得怎麼去公司 舞怎麼跳）

  你們是一體真就是字面上的請你們不要分他我


  老的自己也是自己，所以用脊髓液要體貼有度

  年輕自己也是自己，所以不要忌妒她（吃炸雞

  兩個人原本可以每七天做到一個完美平衡

  然而是容貌焦慮這個心中的魔鬼吃掉一切



  首先Sparkle是有接受老化這件事的

  她仍然認真跳舞拋媚眼 出門裝扮好好的

  真正讓天秤失去平衡的是對外貌評論的焦慮

  以及對於被愛的渴望


  其次這部戲不是旨在討論資本家與女明星

  要知道手術房小哥並不是演藝人員

  但他也是Substance的用戶也遭受過自我吞噬

  劇本安排他出來破題說人會自我相食這件事



  劇中無佐證，純屬你的腦補



  因為這部戲不是在討論演員

  是在討論容貌焦慮+渴望被愛這件事

  你真的誤會了






  劇中第一個重點是容貌焦慮

  Sparkle即使老了也很認真跳舞展現風采

  她對自己是有一定程度的自信的

  而社會某種程度上仍然欣賞這樣的她

  所以節目仍然做的下去

  （只是比不上巔峰時期，但仍過得去）


  年輕時紅到貼上星光大道地磚

  中年後不那麼紅但仍然擁有節目

  這個人物的故事線其實兩種輝煌都經歷過


  真正壓垮信念的是他人對女人肉體的評論

  也就是社會大多數更期待的是吹彈可破的姿色


  原本兩個自我七天一循環是可行的平衡

  但這份焦慮

  1. 讓年輕的自己將老化自己當作電池

  2. 讓老化自己忌妒年輕自己並暴飲暴食


  年輕與年老原本各有各的風采

  破壞計劃的是內心的惡魔：容貌焦慮


  女性為了追求容貌焦慮的解脫

  不惜戕害身體、不惜將醫美前的自己棄如敝屣


  所以老了的手術室小哥才問

  is she start eating u?

  為了演繹容貌焦慮如何吃掉現代醫美男女

  具象化成劇中年輕自我把老年自我吃到變怪物






  本片第二個主題是討論現代人空虛缺愛


  老Sparkle其實是有老同學愛自己欣賞自己的

  而且同學是看過自己的興衰起伏

  所以講出妳如當年一樣美是有一定可信度的

  這份愛是真誠的


  但Sparkle焦慮到想在變身成年輕自己的重點

  在於她看到花束上的we love u

  即使殘廢她還是想不惜風險變回年輕自我


  也就是說她雖然肯珍惜老同學的真誠之愛

  但她也非常渴望那些根本不熟 根本不知道是誰

  來自群眾很膚淺隨意的一句love


  也就是說現代人對於鎂光燈對於流量關注

  儘管認知到這是虛無的這是經不起考驗的

  但仍如同飛蛾撲火般追求不止


  導演無數次運鏡強調那些匿名的we love u

  不是在跟你探討好萊塢

  而是在努力點題出這一則文明病



  --'
