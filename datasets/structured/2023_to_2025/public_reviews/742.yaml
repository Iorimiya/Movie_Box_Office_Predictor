content: '先不論台灣拍不拍得出這種作品


  以主要的三個角色


  伊莉莎白、蘇、哈維來說


  飾演伊莉莎白的人選，必須符合年華老去的美艷女星這個人設


  我第一個想到的是陳美鳳


  至於蘇的話，要符合年輕甜美，帶點嬌媚的特質


  以目前國片來說八成是找王淨


  最後是噁男製作人


  感覺夏靖庭、李鑼、吳宗憲都蠻適合的



  這是在threads上撿到的圖



  還有其他適合的選角嗎？







