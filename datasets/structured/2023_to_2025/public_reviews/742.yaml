url: https://www.ptt.cc/bbs/movie/M.1731254495.A.B00.html
title: '[討論] 懼裂電影想表達什麼'
content: '防雷













  電影一直在重複你們是一體

  可能是想表達要愛自己接受自己的衰老

  可是女主也並沒有不愛自己，相信她年輕時是很意氣風發，很愛自己的

  只是女星老了意味著在好萊塢失去了商業價值，失去了外表，那麼資本家對她的態度怎麼

  可能跟以前一樣


  她如果想要老了還被當作有價值的人，年輕時努力接戲被潛規則然後去當資本，之後就能

  同樣壓榨別人，潛規則年輕男演員，一樣能過上自己想要的人生


  一直努力要維持外貌，只是因為沒了外貌她就一無是處了不是嗎，所以創造除了外貌以外

  的其他價值才是外貌焦慮的人該有的覺悟，而不是告訴自己要愛自己接受自己變老


  總覺得身在好萊塢但是一直傳達外貌不重要、年齡不重要的這種思想真的很諷刺，外貌跟

  年齡就是演員的資源，到底為何要一直否認這個事實


  --'
