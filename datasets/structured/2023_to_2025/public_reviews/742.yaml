title: '[討論] 懼裂  某段音效的疑問'
content: '很喜歡這部，但想問大家在最後熱血跨年晚會那段音效也會極度不適嗎？

  那幾分鐘的音效真的大到覺得耳！膜！要！破！了！！

  加上它根本不算配樂像是廣播調到沒頻道的尖銳吵雜沙沙聲，真的第一次遇到電影音效是

  名副其實的‘’震耳欲聾‘’，一度懷疑是否戲院喇叭承受不了大到壞了、爆音了，後來

  開始有輕微心悸想吐的症狀，只好第一次摀著耳朵看電影（覺得有點蠢XD），過了那段就

  好了。

  想問大家那段有人也同樣感受嗎？還是真是戲院（京站）喇叭問題？

  如果真是導演設計的，真的覺得這段利用極大噪音造成生理不適影響觀看情緒的方式還滿

  沒意義的。



  --'
