title: 'Re: [討論雷] 關於懼裂女主角'
content: '我認為他們意識和記憶是共通的, 但不是很清晰, 而是模糊的狀態, 休眠是在深沉狀態,

  無法控制另一方的行為, 注意, 他們轉換時都是驚醒的

  E第一次換回前畫面是黑暗中的公路上一台機車迎面撞上

  S帶男人回家第一次超時, 換回前的畫面是男人拉下背後拉鍊, 內臟都掉出來, 這是噩夢

  幻覺, E清醒之後的第一個反應是看S的背後有沒有異狀

  我認為整段雞腿畫面都是S休眠狀態中, 隱約感受到E現實中暴飲暴食所產生的噩夢幻覺


  第三幕兩人同時清醒是在[注射終止激素後]

  推測激素會先把分身意識分割出來, 如果有完整注射完, 分身的肉體和意識都會死去

  正是因為意識是共通的, 若沒有先分割意識就終止的話, 母體的意識也會死



  --'
