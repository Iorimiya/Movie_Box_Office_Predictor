url: https://www.ptt.cc/bbs/movie/M.1729267842.A.46B.html
title: 《懼裂》的雛型《R+》圖解&導演CF傳教推廣
content: '目前完全心醉、著迷於導演Coralie Fargeat (法文念法聽起來是"柯哈莉·法佳", 語尾T

  不發音), 她不是學院派, 沒有正式上過電影學校, 而是決定直接投身現場, 從基層助理

  做起, 一邊做一邊學的實作派。

  以下是我收集整理的資料, 歡迎入教


  *目前觀察到導演的招牌元素

  高飽和色彩的影像風格

  少對白的沉浸式體驗說故事風格 (純粹看影像也可以保守理解個六、七成)

  加成體感效果的ASMR音效

  超特寫男人貪婪進食的嘴

  特寫蜜桃臀 (Queen of the butt shot)

  星星耳環

  血腥與肉體恐怖

  混搭類型的天才

  (模仿IMDb Director''s trademarks，排除最早期資源有限的兩部短片作品, 看看第三部

  長片會不會延續)


  *《懼裂》角色命名花絮

  製作人Harvey明確是在諷刺惡名昭彰的製片人哈維·溫斯坦

  Elisabeth Sparkle, Sparkle就是閃閃發亮的明星嘛, 導演訪談說過Elisabeth就是一個

  比較正統的英文名字, 巧的是前作Revenge三人組首領未露臉的老婆名字也叫Elisabeth

  而Sue蘇, 目前看到兩個非官方的粉絲理論, Sue是Use的排序字謎, 使用完美物質的產

  物, 與暗示可能的濫用, 另一個理論是說Sue的時候會呈現噘嘴待吻的狀態, 所以象徵性

  感尤物, 大家可以參考看看

  然後兩人加在一起剛好跟《遠離賭城》的伊麗莎白·蘇同名, 我認為是個巧合, 因為她的

  拼音是Shue(唸起來其實是"休"), 但是就看每個人各自解讀了


  *《懼裂》的雛型《REALITY+》

  發現導演在首部長片"Revenge"之前, 2014還真的拍過一部Black Mirror風格的科幻短片

  "REALITY+", 線上可免費觀看, 法語+英文字幕

  敘述近未來人們可以去"REALITY+"這個機構, 在腦中植入晶片, 可以設定選擇捏出自己想

  要的外型, 啟動後, 在其他有植入晶片的用戶眼中看到的你, 就會是你理想的樣子, 反之

  亦然, 但程序效果只限12小時, 之後必需要讓大腦休息12小時......

  這部短片基本上接近The Substance的雛型, 發想很有趣的作品, 說故事的節奏、拍攝的

  效果和品質也非常好, 但是這部故事的走向和結局我可以推測到, 比較中規中舉/正統,

  而The Substance是我完全無法預測的神經病破格天才之作, 10年來的成長驚人。

  *男主角Vincent Colombe幾乎演出了導演的所有作品，主演這短片，"Revenge"同夥之一

  的Stan，"The Substance"也客串了老闆哈維的跟班西裝男2號。


  以下是方便有語文障礙觀眾理解的有雷全片圖解敘述!! (強烈建議看完《懼裂》再回來看!)



  *Coralie Fargeat作品集

  2024 《The Substance 懼裂》

  2022 影集《The Sandman 睡魔》第一季第九集 "Collectors 收藏家"

  (唯一不是她自己編劇的作品，但非常適合她執導的一集)

  2017 《Revenge 浴血狂花》

  2014 《REALITY+ 進階現實》 (我自作主張翻的)

  2008 《Les Fées Cloches 貝爾仙子》

  (每集6分鐘的迷你喜劇系列, 2008~2014, 導演本人也有演出綠仙子Pata, 找到的這集故

  事是說紅仙子迷信13號星期五, 一直遇到一堆倒楣事, 綠仙子試著幫她轉運的喜劇小品)

  2003 《Le télégramme 電報》

  (12分鐘的短片, 敘述戰時鄉間兩位婦人推測今天的戰歿電報會是誰收到的懸疑小品, 光

  是首部短片作品, 節奏就掌握得非常好, 充滿潛力)


  *Coralie Fargeat的LetterBoxd最愛的四部電影

  星際大戰: 帝國大反擊 (Irvin Kershner)

  巴西 (Terry Gilliam)

  大獨裁者 (Charlie Chaplin)

  穆荷蘭大道 (David Lynch)

  是她以PA身份第一次去參加坎城影展看到的第一部電影




  --'
