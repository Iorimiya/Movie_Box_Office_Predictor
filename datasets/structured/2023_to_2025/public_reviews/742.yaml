url: https://www.ptt.cc/bbs/movie/M.1743066698.A.DE5.html
title: '[  雷] 懼裂'
content: '雷文防雷資訊頁







  前天在二輪戲院看的

  看完最大感受就是「我他媽到底看了什麼」

  全場其他觀眾也在結束後展現大概的情感。「還好沒帶東西吃。。。」

  當初首輪的時候早知道就選這部，比當時小丑2好看太多


  整部主題明確簡單：對於美貌的追求而打藥，最後卻過量使用而被反噬


  一開始訂下7天一定要交換的規矩，稍微想一下就會猜到，這個規矩絕對會被違反，嘛就像

  大雄每次都是違反規定那樣


  劇情前面看Margaret Qualley的翹臀越爽，後期就會感到越噁心

  算是用最直接的方式教育觀眾這種病態的美貌追求


  (啊對了小丑2也是要教育觀眾，只是沒人買帳)


  其實本片有探討到一個主題，就是這種一分二的人體，分出來的那個人，人格、意識跟原本

  那人是同一個嗎？


  頂尖對決討論過，當複製機打開後，落入水中死的人跟活著的人是不是同一個意識

  米奇17同樣討論這個問題


  我一開始也以為是同一個意識切換到不同肉體，看完覺得不是這樣。假如真的是同一意識，

  那sue就會遵守7天交換的規則了，最後兩人相殺的時候證實了我的猜想。不是同一個意識。



  片長真得有點太長了，要是少個20分鐘會更好，雖然達成首尾呼應，但是我覺得沒什麼必要

  。


  配樂插入《查拉圖斯特拉如是說》，稍微提升一點質感，就是不同於2001太空漫遊的經典感

  ，而是一種反差大的搞笑感


  我多期待真的有個路人觀眾掏出一把槍，直接斃了這個怪物。可是電影偏偏就是繼續演下去

  。


  最後那個大噴血，太久、看不下去，覺得很不合理。(後來想想，都能接受脊髓蹦出一個人

  了，怎麼不能接受噴出不合理量的血呢)




  不過我倒是有想過，如果是本體去吸年輕肉體的脊髓液，會怎麼樣呢？



  --'
