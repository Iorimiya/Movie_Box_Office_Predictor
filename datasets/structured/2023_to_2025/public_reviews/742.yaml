title: '[ 好雷] 懼裂'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  1.父權社會對女體的剝削與反抗

  -->決定什麼有價值、吹捧價值、眾人跟隨


  外貌不美的女性就沒價值--X

  外貌不美的女性就沒商業價值--O


  政治正確、DEI在人性面前猶如螳臂檔車

  扭曲事實同樣是-->決定什麼有價值、吹捧價值、眾人跟隨


  2.放縱與承擔後果--透支自己

  徹夜鬼混的自己 VS 睡眠不足恍神的自己

  縱酒狂歡的自己 VS 宿醉痛苦不已的自己

  年輕大吃大喝的自己 VS 老年中風、肝硬化的自己


  3.如何對抗慾望--夠了

  吞噬心智的不只有外貌的追求

  還有無限的維度


  社群軟體光鮮的生活--國外旅遊、美食、豪宅

  製造知識焦慮-->販賣課程

  製造健康焦慮-->販賣健身、保健品

  製造理財焦慮-->販賣投資商品、課程

  製造情緒焦慮-->販賣正向思考課程

  賣什麼，就用商業目的，人為製造的焦慮來包裝

  販賣不存在的痛點(人造虛擬痛點)


  4.如何面對衰老


  -----

  Sent from JPTT on my Xiaomi POCO F2 Pro.


  --'
