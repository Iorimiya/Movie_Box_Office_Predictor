url: https://www.ptt.cc/bbs/movie/M.1753720520.A.D3C.html
title: '[好雷] 懼裂 The Substance'
content: '雷文防雷資訊頁


  MOD上架影片


  懼裂

  The Substance

  2024美國電影


  看本片之前，早已得知是一部有瘋狂和噁爛元素的影片，結果看完，比我預期的更瘋狂更

  噁爛，但是真的有夠好看的，哈哈哈，個人滿意度85分。            大膽，瘋狂，噁爛

  ，堪稱精彩的邪典電影，未來可列入影史的邪典電影經典之一。


  這片的許多元素，會造成一些人觀影不適，所以不適合很多人看咧。但我對於這片的創作

  及產出，所有參與本片幕前幕後的人員，給予鼓掌，你們的創作，呈現出的劇情畫面，瘋

  狂，好笑又警世，好酷，令我拍案叫絕。



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  以下有劇透。



  1.這片演出的二位女主Demi Moore和Margaret Qualley，真的太佩服了，那麼犧牲色相，

  吃力不討好又人設不討喜的角色，那麼投入的表演，令人動容，呵呵呵。這片的結局前的

  橋段，是本片的最高潮，太瘋狂太噁爛了吧。


  2.收尾畫面，停在Elisabeth Sparkle的星光地磚，諷刺又幽默？這位Sparkle大明星，人

  如其名，一輩子努力要一輩子在眾人前Sparkle閃耀閃爍，燃燒至死方休。


  3.這部電影的每個場景，都讓我讚賞。選角、氣氛、視覺和音效設計、音樂，當然還有這

  一切的象徵意義。

  本片的主角二位對製作的投入和對導演的信任，讓我感同身受。她們的脆弱，讓這部電影

  成功上演，並催生出一個引人入勝的狂熱夢境。所有參與其中的人都應該為這部電影感到

  自豪。對我來說，這是一部未來的邪典經典。


  這是一部身體/心理恐怖片，本片意義遠不止於此。這片看到了人的執迷及痴狂，瘋狂怪

  異的情節畫面呈現，同時也引人低迴思惟。



  --'
