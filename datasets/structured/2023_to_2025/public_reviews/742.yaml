title: '[好雷]《A Different Man》－懼裂的姊妹篇'
content: "《A Different Man》★★★★★★★☆☆☆\n\n\n\n剛剛看了Sebastian Stan演的川普傳記片《The Apprentice》\n\
  想起他今年有奪下柏林影展最佳演員，\n好在加拿大還有上映這部《A Different Man》\n有幸能在這一週欣賞完Sebastian Stan在三大影展中的作品\n\
  有趣的是今年坎城影展主競賽的《懼裂》，談到演藝明星的女性容貌焦慮\n而《A Different Man》則是提到了在兩性關系中的男性容貌焦慮\n\n\n\n\n\
  \n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\n\n\
  《懼裂》是年老色衰的女星為了在演藝圈繼續生存\n使用藥物分裂出年輕肉體，在享受紅利時也被自己的貪婪吞噬\n而《A Different Man》是患有神經纖維瘤病的愛德華\n\
  為了接近喜歡的女孩英格麗而接受治療變成帥哥蓋伊(Guy)\n卻不知道英格麗就是有特別嗜好喜歡神經纖維瘤患者\n愛德華便一直在自我懷疑中不斷犯錯\n\n《A Different\
  \ Man》和《懼裂》的容貌焦慮\n都有加入「男性凝視」的因子\n《懼裂》是男性上級與觀眾的「他者」\n對女性容貌苛求產生的焦慮\n《A Different Man》則是愛德華的男性自我凝視\n\
  用社會期許的價值限制自我，而產生自卑與焦慮\n\n《A Different Man》和《懼裂》相同的是\n主角都在蛻變後，得反覆面對原本的「自我」\n《懼裂》需要每七天交換意識回老舊肉體\n\
  《A Different Man》則是女主英格麗的新歡\n另一個神經纖維瘤患者－奧斯華\n 奧斯華大方接受自己是神經纖維瘤病患者\n附庸風雅個性開朗，與愛德華之前的形象完全相反\n\
  如此的存在完全否定了愛德華接受治療的目的\n並了諷刺愛德華先前面對疾病時\n不積極面對人生只會自怨自艾\n\n面對更好的個體，引發自我存在危機，因而將其「他者」化\n\
  《A Different Man》和《懼裂》不同的是衝突後的處理\n《懼裂》的新肉體因貪婪，惹得舊肉體忌妒，雙方對立而毀滅\n《A Different Man》是愛德華和奧斯華衝突落敗後\n\
  臣服並認同 奧斯華，卻沒有將 奧斯華的信念內化實踐\n反而將認同形成新的執念，並犯下更大的錯。\n\n大概可以理解Sebastian Stan為何能奪下柏林最佳演員\n\
  他將愛德華蛻變後仍殘留的自卑和焦慮詮釋很到位\n讓人真的相信這個角色有經歷被人側目的歧視\n另外《A Different Man》和《懼裂》相同的地方是\n酷寒戰士Sebastian\
  \ Stan有全裸露三點演出！！！！\n\n--"
