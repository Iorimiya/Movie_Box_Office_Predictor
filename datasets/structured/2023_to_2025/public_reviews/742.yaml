url: https://www.ptt.cc/bbs/movie/M.1729601488.A.6A7.html
title: '[好雷]懼裂 / The Substance　(2024)(影仔)'
content: '影仔看電影 － 懼裂 / The Substance　(2024)




  內文含劇情雷


  內文含劇情雷


  內文含劇情雷




  　　感受到的，是「我沒有辦法接受我自己」的恐懼。



  　　很多人在討論兩個女人的思緒是否互通，我認為都是知情的。女主角害怕的不光是變

  老這件事，而是曾經受過萬般寵愛的歲月已成為過往；曾擁有的美好事物逝去，絕對比一

  無所有來得讓人心痛太多。分身「蘇」的確很美，美得過分～ 正因為蘇的內在是伊莉莎

  白，這種重新拾獲的美好才會讓她深深地無法自拔。她是沒辦法面對自己的瑕疵的.. 因

  此在還沒使用「完美物質」前，她就已經開始痛恨自己。而完美物質則將這種恨又化作了

  極端。



  　　其實都是我自己，沒有人格分裂。只是實在沒辦法面對自己的醜惡，貪的又太過美好

  。



  　　完美物質的使用說明一再強調，母體與分身都是自己，請正視這個現實。如果沒辦法

  永久成為更好的版本，那不代表著這是「永遠的折磨」嗎？ 我個人是程序控，實在無法

  理解怎能接受這規則。如果共存無法達到平衡，那不如不要，人總是要對自己誠實。



  　　選角太神了，黛咪摩爾與瑪格麗特庫利兩人戲裡戲外都能與故事呼應，讓戲劇效

  果最大化。這部電影刻意聚焦於女性的完美體態，講對年齡的恐懼。劇本的巧妙編寫去避

  開一些問題，使其可全力呈現這極端的故事。電影的節奏與音效都十分到位，描述精準，

  沒什麼多餘片段，是在看完後才發現電影其實很長。相同的題材其實看過不少次，但呈現

  得最好就是《懼裂》。



  　　我很喜歡最後那只剩下臉的畫面，思考著自己身而為人，最初與最後的知覺都是自己

  的面孔。當星星灑下，好像回到了最初，想起了自己最美好的一段時光，那萬人擁戴的星

  星。以及最後化為一攤血肉，是人生的終點。



  　　人生只能走一次，我們都要面對生而為人的週期；這是世界自然運行的道理，不容易

  去對抗的。平衡是過活，不平衡也能活，活得好看與難看的差別而已。一切都關乎於面對

  自己，學習一切共處，達到平衡狀態，與人生意義的尋找。



  影''s 2024 10 19　給分：9.2/10 分


  FB粉絲頁 - 影仔製造



  --'
