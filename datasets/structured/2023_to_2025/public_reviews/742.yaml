url: https://www.ptt.cc/bbs/movie/M.1729957452.A.DC7.html
title: '[新聞] 全球票房破10億！導演親曝《懼裂》3大核心象徵'
content: "全球票房破10億！導演親曝《懼裂》3大核心象徵\n\n03:45 2024/10/26 中時 杜欣穎\n\n\n《懼裂》導演透露，電影當中反覆出現巨大疤痕的脊椎是象徵電影的核心。\n\
  （圖／CATCHPLAY提供）\n\n全球票房飆破10億台幣、全台口碑炸裂的《懼裂》好評連連，導演柯洛里法吉特\n(Coralie Fargeat)和她的攝影師日前接受媒體訪問時提到，關於電影中一幕經典畫面是\n\
  黛咪摩爾(Demi Moore)飾演的過氣女星伊莉莎白施打「完美物質」後倒臥在浴室，一旁站\n著由瑪格麗特庫利(Margaret Qualley)飾演、穿著印有龍紋浴袍的分裂者蘇，該幕其實是\n\
  導演特別想要強調的心理空間，柯洛里也透露了電影當中有三大核心象徵。\n\n柯洛里說：「這部電影有三個非常強大的象徵，這些象徵是電影的核心。」她表示，首先\n是白色浴室，這個空間被設計為一個沒有家具的心理空間，充滿圖像化的元素。第二是貫\n\
  穿整部電影，反覆出現巨大疤痕的脊椎，服裝上的所有拉鍊、長袍上的龍、酒吧裡禮服上\n的背部深V，都能看到脊椎。第三個象徵是火龍，代表從灰燼中重生的鳳凰，準備好重生\n\
  。\n\n《懼裂》兩位女主角的精采轉折令觀眾看得目不轉睛，關於拍攝瑪格麗特庫利(Margaret\nQualley)飾演的分裂者蘇，導演坦言，在視覺上整體環境的呈現和伊莉莎白有所不同，柯\n\
  洛里說：「關於蘇一切都是飽滿、活潑與超現實的，也極度感官化。每一個她打開可樂、\n喝可樂的鏡頭都是一場感官盛宴。你會想成為她，因為她的生活看起來如此美好，彷彿你\n\
  整天都在一個夢幻的廣告中。」\n\n而當伊莉莎白開始崩潰時，她的場景變得更尖銳，蘇的場景則是流暢的，她強調：「由於\n這部電影的對白不多，影像和聲音真正成為了電影的語法，無論是服裝、場景佈置還是我\n\
  們精心構圖的鏡頭。」\n\n《懼裂》女主角黛咪摩爾(Demi Moore)極度容貌焦慮與情緒轉折的精湛演出，更被不少影\n評人譽為重返巔峰之作，許多影迷看完直接列入個人年度十大愛片，更直呼「《懼裂》重\n\
  現了《鬼店》帶來的恐懼」，而根據外媒「好萊塢報導」（The Hollywood Reporter）日\n前指出，《懼裂》將報名金球獎（Golden Globe\
  \ Awards）「音樂喜劇類」爭取獎項而非\n戲劇類，這除了讓黛咪摩爾更有機會獲最佳女主角提名，亦被外界視為她將走上奧斯卡影\n后提名之路。\n\n全球累計票房飆破10億台幣的《懼裂》，不僅諷刺外界對女性年輕美貌至上的審美標準，\n\
  還呈現十足肉體恐懼的震撼場面，爛番茄分數更高達91％，今年已接連奪下坎城影展「最\n佳劇本獎」與多倫多國際影展「觀眾票選首獎」肯定，台灣上映後成功引發不少話題，更\n\
  有恐怖類影迷更發現電影中部分人物、場景、橋段及拍攝手法，似乎隱含對10部經典恐怖\n電影的致敬與彩蛋引發熱烈討論，被提及的經典作品包括《黑天鵝》、《鬼店》、《錄影\n\
  帶謀殺案》、《象人》、《異形：聖約》、《變蠅人》、《魔女嘉莉》、《迷魂記》、《\n道林格雷的畫像》《金鋼》等等，令眾多影迷眼睛為之一亮、欲罷不能，甚至大讚「注定\n\
  被列入影史經典的邪典之作」，也有觀眾寫道：「就視覺奇觀及腦洞大開程度而言，這部\n絕對是一部值得大銀幕的爽片！」直呼週末要再衝戲院大銀幕二刷，仔細欣賞片中更多細\n\
  節。\n\n另外，片商CATCHPLAY特別於上映第二週加碼在國賓大戲院-鉅院廳舉辦「《懼裂》海報限\n定場」，凡購買此場次即可獲贈特別版A3海報，正式放映時間為10月27日下午16時50分，\n\
  歡迎觀眾前來體驗《懼裂》大銀幕的極致驚悚恐懼，本場次票券現正熱賣中。\n\n#懼裂 #票房 #瑪格麗特庫利 #黛咪摩爾 #柯洛里法吉特\n\n--\n\n 是菩薩成佛之道\n\
