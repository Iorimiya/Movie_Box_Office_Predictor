url: https://www.ptt.cc/bbs/movie/M.1742653488.A.0F2.html
title: '[好雷] 發人深省的《懼裂》'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  \n\n\n\n逼雷~\n\n\n\n\n\n\n\n\n逼雷阿~\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n\n我覺得《懼裂》這部真的拍得蠻好的!\n\n\n1.首先能夠看到黛咪摩爾美麗的酮體就值回票價了。\n\n\n2.雖然劇情簡單，但是鏡頭很棒，表情的特寫相當生動。\n\
  \n\n3. 化妝也很棒，不論是打針打到長膿、老摳摳、還是最後的阿基拉魔王，\n\n雖然知道是電影，但真的相當逼真!\n\n\n\n4. 我覺得隱喻的主題很多：\n\
  \n  a.虛榮：為了想讓別人覺得美麗(或衍伸到種種其他如財富、名望...) ，\n\n    而犧牲自己，是多麼愚蠢的一件事。尤其這些人可能只是愛你的\n\n\
  \    皮相，根本沒有真的關心你。\n\n    最後的大噴血應該就是主角的一種報復。\n\n\n  b. 犧牲：若要人前風光，必要人後受罪。\n\n\n \
  \ c. 自律與平衡：就好像今日徹夜狂歡，隔日必定精神不繼。\n\n      過度的逸樂，之後必會有報應。\n\n\n  d. 孝順：這樣講也許有點怪，但我覺得是有一點類比。細胞分裂其實跟繁殖\n\
  \n     某程度也是相近的。所以年輕女孩看到年老的自己又老又醜又討厭，\n\n     憤而將其踢死。這與年輕人不孝的行為蠻類似的，年輕的時候從父母身\n\n\
  \     上獲得養分，然後等父母老了就開始嫌棄。當然，父母也可能把自己的期待投注在\n\n     在下一代身上。總之這之間的關係，用若電影中的關係來聯想，也蠻微妙的\n\
  \n\n  e. 珍惜：人性有時候蠻愚蠢的，伊莉莎白本來應該可以去找高中同學，\n\n     但是不知道是太執著表面，還是他從來就只有虛榮而沒有對他人的情感。\n\
  \n\n\n\n\n最後我想說，\n\n\nDemi Moore, 我仍然愛你，對我來說你比年輕的那個更好。 ^_^\n\n\n\n--\n奧茲：你可以吃一堆香蕉！\n\
  芬利：哦，我懂了，就因為我是一隻猴子，所以我一定要喜歡香蕉！\n奧茲：你不喜歡香蕉嗎？\n芬利：別傻了！ 我當然喜歡香蕉，我可是一隻猴子！我只是不喜歡你的推論方式。\n\
  \n\n\n--"
