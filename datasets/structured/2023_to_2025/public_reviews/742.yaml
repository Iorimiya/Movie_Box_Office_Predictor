title: '[選片] 搭配“懼裂”的電影'
content: '看大家幾乎一致好評所以準備跑到台中看


  因為想在同一個影城加看其他電影，請大家給個意見


  已扣除看過的或時間跟不上的，選擇如下


  W影城：劊樂小丑3、懼裂、鬼禁地


  S影城：陰陽師0、懼裂、劊樂小丑3（or為我辦一場西式的喪禮）

