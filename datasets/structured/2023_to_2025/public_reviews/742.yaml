url: https://www.ptt.cc/bbs/movie/M.1729527899.A.70D.html
title: '[好雷]懼裂，感官刺激 & 反思兼具的好片'
content: "雷文防雷資訊頁\n\n防雷\n\n防雷\n\n防雷\n\n\n防雷\n\n\n防雷\n\n\n防雷\n\n\n防雷\n\n\n\n\n\n\n\
  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文\
  \ 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n關鍵字：老化、審美觀、複製人、賽局\n\n(一) 懼裂(The Substance)這部電影起初從預告片開始就讓我想到怪醫黑傑克漫畫其中一\n\
  話： <<大明星之死>>\n\n\n\n美女演員瑪麗蓮·史璜森年老色衰，為了重拾光彩，找上黑傑克動刀...\n\n本片女主角之一--伊莉莎白也是青春不再，不過他選擇的是神奇的藥劑注射\n\
  \n生物老化是必然，人都會老， 在科技足夠進步之前， \"好好地變老\" 我想是大家現今 或\n未來的必然課題。\n\n (二) 關於女主分裂而後7天輪流活動的過程，我一開始也以為意識都是同一人的or意識\n\
  共享， 但是後來看到女主角之二--蘇 對於女主一的反應，感覺他是另一獨立個體； 有\n看到版友提出 伊莉莎白稍微可接收 蘇的意識， 但是反之不然， 覺得這也是個有趣的想\n\
  法，再加上第三主角--伊莉莎白蘇(怪物)，情況又更複雜了。You are one. 各自獨立個\n體，卻又源自同一母體，如果能夠詢問導演意識獨立問題，我猜沒有標準答案XD\n\
  \n (三) 電影提到7天輪流互換且須遵守規則的部分，令我想到賽局理論， 但是二位基本上\n互利共生，基本上唯一的良好局面就是 女主雙方都遵守七天原則，按時給養分&互換，\n\
  沒有贏者獨拿的情況， 除非伊莉莎白甘願停損，但是後續發展證明了他做不到，她需要\n蘇的年輕美貌來重拾鎂光燈， 而蘇需要伊莉莎白的體液來維生，而平衡很快就因 蘇的超\n\
  時使用 而破局、惡性循環、最後滿盤皆輸。\n\n (四)小感想： 片尾噴血片段很浮誇，很有B級片之感，誠如其他版友談到，結尾段在怪\n物誕生在鏡中是一個選擇，但不免有種落入俗套、不意外的感覺。\
  \ 或許為了跳出框架，\n導演才設計了這麼誇張的橋段\n\n\n私自覺得這部音效與背景藝術搭配不錯，應該有機會拿獎\n\n\n\n\n\n\n\n--"
