url: https://www.ptt.cc/bbs/movie/M.1729786202.A.1F4.html
title: '[心得] 媽的多重宇宙和懼裂'
content: '大概看清這類電影的套路了

  故意用誇張的視覺效果和B級片的血漿

  包裝一個相對爆米花電影稍微深層一點的內核（真的就是好一點點）

  讓平常只看商業片的中低階觀影者有一個可以炫耀的談資

  普通人看到的是血漿是感官刺激而我看到的是那好有深度的內核

  我好棒棒我好文青

  所以只要有人說真的不是很好看的時候

  中低階觀影者會馬上激烈反駁

  其實不是真的這麼愛這兩部電影

  而是趕快反駁 Show Off 一下我看懂內核我比較有深度

  偏偏中低階觀影者又佔了 70% 的人口

  所以這種套路的電影變成不能批評的禁忌


  --'
