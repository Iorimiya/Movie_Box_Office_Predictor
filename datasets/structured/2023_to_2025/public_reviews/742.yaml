url: https://www.ptt.cc/bbs/movie/M.1729441800.A.34D.html
title: '[好雷] 懼裂   藝術跟科學觀點來看aging'
content: "雷文防雷資訊頁\n\n\n\n\n\n\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n1.黛咪摩爾保養得還不錯啊\n\
  \n2.視覺跟音效實在太屌了，個人認為應該可以入圍奧斯卡，有些畫面真的讓人，極端的不舒服，太屌了。\n\n3.第二女主角選角也很好，只是後面各種犧牲，慘\n\n\
  4.丹尼斯奎德要演猥瑣的資本主義化身也很到位嘛差點認不出來。\n\n4.大~~爆~~射~~\n\n\n心得:也許導演想告訴大家，最好還是乖乖地接受老化，多花心思只是得不償失\n\
  \n個人了解，目前科學上對表觀遺傳學跟老化的研究，是真的有可能打一針讓妳年輕四十歲這種事在幾年內出現。\n\n就像你看四十年前的科幻電影，一堆穿梭宇宙的太空船上的儀表板都還是指針跟數字跟手把開關。今天實際上載人太空的飛船更多的是數位化的液晶面板。這是人對科學的理解再往前推的極限。\n\
  \n屆時也可能看到周潤發跟邱淑貞繼續演賭神四，諸如此類。\n\n\n今年如果沒什麼拍太好的精神疾病的電影，我認為這部應該可以得幾座獎。\n\n--\n    \
