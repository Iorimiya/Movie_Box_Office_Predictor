url: https://www.ptt.cc/bbs/movie/M.1729569183.A.EF2.html
title: 'Re: [討論雷] 懼裂 主角意識問題和結局處理的看法'
content: '本片不合理之處太多了，但如果你知道導演Coralie Fargeat人生最愛的4部電影其中之一

  是David Lynch的《穆荷蘭大道》，你大概可以窺見一二了


  因此《懼裂》和David Lynch的電影一樣，整部片都可以解釋都是女主角做的夢

  但本片高竿之處就是仍舊保留娛樂性


  否則

  1.這種莫名的藥物，也沒有太多解釋，一般人怎麼敢注射

  2.客服就一個接線生?感覺24小時都是同一個，這點很像《穆荷蘭大道》

  3.到底分裂出來的蘇與伊莉莎白擁有多少共同記憶，導演也沒有規劃得很清楚

  這點也很像《穆荷蘭大道》演員概念

  4.最後一段「怪物伊莉莎蘇」很明顯都是幻覺了，觀眾看到台上怪物的反應，也太刻意的

  「奇怪」了


  如果說《噩夢輓歌》在講毒品，《懼裂》就是在講那些醫美藥品


  覺得導演厲害之處是，本片竟然可以拍的讓觀眾接受度很大

  這部篇藝術類型的電影，可以獲得主流觀眾的欣賞，實在強大


  --

  「MANSUN''s電影音樂清單」臉書粉絲團：



  --'
