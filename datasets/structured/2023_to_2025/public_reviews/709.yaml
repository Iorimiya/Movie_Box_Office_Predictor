title: '[微好雷] 紅色一號  美國賀歲片'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n衝著卡司跟想放鬆心情看片去的\n\n巨石  依舊很巨石   嚴肅的保鏢\n克里斯演這種小壞壞心地善良的蠻適合的\n\n我當賀歲片 搞笑片看待  我朋友說這部用打鬥宣傳欸XD\n\
  \n不過打鬥有些創意  讓巨石變大變小穿梭  不全靠蠻力\n克里斯凡人身軀沒什麼亮點  但是也很厲害了\n\n劇情簡單   笑點簡單   順順看完蠻容易的  不用煩惱什麼伏筆\n\
  \n聖誕老人被抓   順藤摸瓜找到兇手跟地點  不會有什麼黑幕  我還猜局長是不是黑幕之一  結果只有變形怪假扮夫人\n最後德國山羊怪心地還是不錯的\n\n\n\
  不過劇情沒解釋大人準備的禮物到底跟聖誕老人的禮物是不是一樣   平常小孩都會有兩份？？\n\n特效確實有些地方很破   走在北極有雪地方卻沒有腳印  他們在重訓那個槓鈴超級奇怪\
  \   我覺得用實物改造不就好了...\n北極熊當然戲份就不多了\n\n\n\n-----\nSent from JPTT on my Sony XQ-EC72.\n\
  \n--\n                                    11/16 21:07"
