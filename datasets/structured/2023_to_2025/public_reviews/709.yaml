url: https://www.ptt.cc/bbs/movie/M.1730824797.A.76B.html
title: '[好雷] 「紅色一號」意外好看的聖誕家庭電'
content: '「紅色一號」原本只是想在串流上線的電影，但忽然又改為返回全球大銀幕；加上稍微避

  掉了感恩節檔期的神鬼戰士2、魔法壞女巫、海洋奇緣2等大作；令人懷疑片商對於此片信

  心程度的多寡，本片高達2.5億美金的製作成本，的確在進入感恩、聖誕檔期後，後勢票

  房並不看好有機會回本；但是巨石與隊長的魅力，很難不讓這部回歸大銀幕，巨石與隊長

  在「紅色一號」的表現，雖不能算耳目一新，但確實有做到與以往角色風格的差異化，算

  是在觀眾對這兩位演員的既定印象中，有做出比較亮眼的看點；而選擇感恩節檔期上映，

  的確也是紅色一號在回歸大銀幕上映，最好也是唯一可能將票房最大化的選擇。




  全片在聖誕家庭片基底中，加入了奇幻、科技、神話元素，過程中一些小驚喜、小幽默不

  斷；巨石強森雖然還是飾演巨石強森，但在「紅色一號」裡，沒有繼續賣弄招牌微笑、大

  秀肌肉、噴發男性費洛蒙，而是稍微收斂了一點情緒，部份內心的感情戲及臉部表現，讓

  觀眾想起「熱血橄欖球隊」那塊還是會演點戲的石頭；而隊長在「紅色一號」的角色人設

  與戲外的逗趣形象，根本幾乎一致，還算是中規中矩的演出，也是全片喜劇的發動機；酷

  似「妙麗」的琪蘭席普卡算是本片顏值擔當，比起龍捲風暴的扮相及戲份都要好得多，資

  深演員寶妮杭特的演出，也算導過野蠻遊戲：瘋狂叢林的導演，對野蠻遊戲的一點小致敬

  ；當然備受矚目的還是第二次飾演聖誕老人的JK西蒙斯，這次他沒有笑出在蜘蛛人裡那個

  報社老闆的

  迷因笑容，而是位沉穩開朗的聖誕老人，如果想看到JK西蒙斯能否像前年暴戾夜的大衛哈

  伯版的動作型santa，可能要轉換一下心態，JK戲份並不算太多，但表現也還算可圈可點

  。





  聖誕家庭片雖然常常充滿了親情說教，但「紅色一號」並沒有在這個部分著墨太多，但在

  充滿娛樂的劇情中，還是有些許的深度令觀眾去思考其中意義；尤其後段的父子對談，對

  於所愛之人，要如何打破無法說出愛的圍籬，或是可以自己決定想成為怎麼樣的人，這樣

  自我認同反省的橋段；不必成為一個完美善良的人，只要做出一點改變，讓世界更美好一

  些，也許這才是彼此給彼此的最佳聖誕禮物。




  以一部聖誕家庭片來說，「紅色一號」是出乎我意料的佳作，節奏流暢輕鬆不拖沓，特效

  也算及格不廉價，角色群都有做好該做的劇情表現，劇情也具有該有的深度娛樂兼顧；但

  的確可能並不是能賣出高票房的電影，尤其在2.5億的製作成本下，要回本認為可能不是

  很樂觀，但卻是在神鬼戰士2上映前，一部可以優先選擇進場的娛樂電影，畢竟巨石與隊

  長的個人魅力，還是很難抵擋。





  --'
