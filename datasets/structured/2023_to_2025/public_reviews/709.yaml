url: https://www.ptt.cc/bbs/movie/M.1737623978.A.DF8.html
title: '[普雷] 紅色一號'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  電影開頭其實有點分心看不太懂

  一直到中間左右才知道原來紅色一號是聖誕老公公

  巨石強森是保護他的保安，然後他們是生活在另一個地方(北極)

  花一整年的時間在準備各國各地的聖誕節禮物

  在聖誕節那天由紅色一號坐的麋鹿的車在一夜之間發送完畢~

  然後這一切卻被一個黑客給害了

  他在聖誕前夕將紅色一號的位置洩漏給冬季女巫，聖誕老公公就被脅持了

  而巨石強森找到了那個黑客，跟他一起聯手將聖誕老公公找回來


  這段經歷很精采，也有挺好笑的地方


  如女巫派雪人來，被黑客(傑克)壓著頭下去烤那幕笑死

  聖誕老公公的弟弟坎卜斯後來出現來救人時卻被放大版的女巫揍


  女巫最後的結局居然是被關進去自己製造的雪球裡

  傑克跟兒子因這件事情其生疏的情感有了連結也很溫馨

  有歡笑有溫馨也有刺激感，但很快就會忘記這部片演了什麼


  --

  喝垮'
