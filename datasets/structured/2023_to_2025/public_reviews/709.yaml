url: https://www.ptt.cc/bbs/movie/M.1731911952.A.19C.html
title: '[新聞] 巨石強森發威！《紅色一號》北美上映登票'
content: '巨石強森發威！《紅色一號》北美上映登票房冠軍


  自由時報 2024/11/18

  記者許世穎




  由《野蠻遊戲》系列導演傑克卡斯丹執導，巨石強森、「美國隊長」克里斯伊凡攜手演出

  的動作喜劇《紅色一號》，上週末（11月15至17日）正式在北美上映，以3410萬美金（約

  台幣11.07億元）毫無懸念拿下首週票房冠軍。


  該片已搶先北美一週在包括台灣在內的海外市場上映，首週在台也以全台近台幣1600萬拿

  下票房冠軍，海外票房第二週末再度從75個市場收穫1470萬美金（約台幣4.77億元），目

  前全球票房累積票房已達8410萬美金（約台幣27.31億元），其中5000萬美金來自海外市

  場。《紅色一號》持續在台上映中，粗估全台票房已破台幣2700萬元。





  --'
