title: '[討論] 為你鍾琴 職人精神是否該存在？（雷）'
content: '首先先說這部”為你鍾琴“

  屬紀錄片模式紀錄製作小提琴的工匠職人







  -----------------------------有雷-----------------------







  每個職人都想在自己業界發光發熱

  加斯帕柏夏德算高齡職人在提琴界翹楚

  義大利克里蒙那（Cremona）

  每三年舉辦一次的國際製琴大賽—「CONCORSO  TRIENNALE」

  公認為是「提琴界的奧斯卡大獎」

  「提琴界的奧運賽」

  沒得獎也認知自己老了該讓賢給年輕人

  開始有想製作夢幻般的小提琴

  送給值得使用的音樂家提琴女神吉妮楊森


  尋找傳說以消失的虎紋楓木

  為了找樹木穿越地雷區

  人生不斷的打擊挑戰

  最後終究四年後找到適合的虎紋楓木

  無償送給吉尼楊森




  感覺跟製作武士刀的刀匠為了尋找

  適合使用武士做一把專屬個人的刀


  有時候覺得職人精神

  在這個變遷快速的世界完全不被認同

  開始要被要求斜槓 一人多才多藝


  --'
