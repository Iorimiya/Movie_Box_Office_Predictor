title: '[新聞] 《為你鍾琴》揭絕世樂器之謎'
content: '《為你鍾琴》揭絕世樂器之謎


  新聞網址：



  荷蘭頂尖小提琴家吉妮楊森也出現在電影裡頭，並演出「自己」。（海鵬提供）



  加斯帕柏夏德是提琴製造大師，電影鏡頭隨著他展開一趟尋琴冒險。 （海鵬提供）


  將在6月9日上映的紀錄電影《為你鍾琴》講述小提琴製造大師加斯帕柏夏德，為完成心儀

  的小提琴名家吉妮楊森的夢想，不惜歷經險境、穿越巴爾幹半島，尋找300年前曾經存在

  的一種虎紋楓木，來打造一把足可媲美史特拉第瓦里琴的絕世名琴。


  《為你鍾琴》不僅是一個關於夢想、膽識、勇氣及冒險的故事，更揭露史特拉第瓦里琴的

  重要及尊貴。史特拉第瓦里琴是指義大利史特拉第瓦里家族，尤其是樂器製造師安東尼奧

  史特拉第瓦里所製作的弦樂器，被公認為歷史上最好的弦樂器之一，具有高度的價值，其

  價格甚至還會隨著時間和曾經擁有及演奏過者的身分而上升。


  史特拉第瓦里名琴300多年來，一直是西洋文化中扮演重要的角色，這些名琴的價格，也

  被認為是藝術品與文化投資的重要指標。史氏名琴在19世紀末、20世紀早期就已經有很高

  的身價，雖然兩次世界大戰暫停了市場需求，不過很快地，歐洲的經濟復甦與亞洲新市場

  崛起，讓史氏名琴的需求量變多。


  例如2006年加州富商Jerry Kohl以800萬美金（約2億4千萬台幣）買入小提琴大師

  Milstein的史特拉第瓦里名琴。根據紀錄，2012年「Lady Blunt 1721」名琴更以1590萬

  美金，超過4.5億新台幣的身價賣出，總計在歷史上拍賣價格最高的樂器中，史特拉第瓦

  里琴便占據了前5名，而且都是經由佳士得來賣出。


  片中的主角加斯帕柏夏德，也確實是當今世上備受推崇的提琴製造大師，電影跟隨他的腳

  步，冒著生命危險遠赴戰火頻仍的「歐洲火藥庫」巴爾幹半島，尋找幾近消失的完美楓木

  料，一步步揭開史特拉第瓦里名琴的祕密。



  《為你鍾琴》預告



