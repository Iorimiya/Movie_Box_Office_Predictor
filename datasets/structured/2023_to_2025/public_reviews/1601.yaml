title: '[普雷]《為你鍾琴》打造匿跡三百年楓木琴身'
content: '無與倫比的美麗，打造職人夢想中的小提琴


  雖然現在時代裡流行斜槓，樣樣都會的員工在老闆眼中有一種聘一人當兩人用，還有各種

  附加價值，成為職場中炙手可熱的人才。但都通不見得精，在世界上有一種職人精神，必

  身專精一項專業，將此精益求精。


  而對於追求行業或興趣頂峰的人，心裡都會有想要達成的夢，而當夢想只差一步之遙卻又

  被推向遠處，來來回回是否可以耐心等待抓住機會的那一刻。


  挪威電影《為你鍾琴》是講述義大利中年製琴師想完成夢想，展開行動的故事。義大利製

  琴師加斯帕柏卡德過去曾見過用三百年獨特楓樹所製，有著絕佳外觀與動人琴聲的小提琴

  。中年後的他想完成用這種楓木製作琴身的夢想，四處打聽，卻發現這顆木頭遠在佈滿地

  雷的他國，其他商人也盯上了這種木料，讓完成夢想更加艱難。







  《為你鍾琴》是什麼電影？


  工作是為了什麼？可能許多人有不同的答案，有些是為了找個錢多事少離家近可以輕鬆賺

  錢養家、有些則是希望可以在退休無憂無慮快速的財富自由、而也有不少人是因為「興趣

  」最後成了自身的本業。


  過去唸書的人少，多半是繼承家業或是跟師父學習手藝與工藝求個溫飽，但久而久不管只

  是單純找事做或越做越有心得，成為一方職人，總有一個自己人生想達到的目標。


  這個目標為何？可能因人而異，有些人是希望有著更好的待遇或備受他人景仰，自己做老

  闆或早早退休做想做的事的人也不在少數。但也有非常理想與浪漫主義的工作者，例如許

  多文字創作者都希望自己有一天可以靠寫作維生，或是音樂家和運動員都有各自想站上國

  家或世界最高舞台的憧憬，對於工藝師或是設計師可能也有更多不同的夢想需要達成，但

  在與現實妥協間，夢想究竟只能是夢想或是真能有實現的一天？









  《為你鍾琴》是挪威與荷蘭聯手製作的仿記錄片式的劇情電影，敘述義大利提琴名匠加斯

  帕柏卡德，在與老婆製作小提琴多年，兩人看著後起之秀人才輩出，也感嘆新秀的創意與

  技藝，他們不得不服老。


  加斯帕柏卡德看著自己年紀思考著之後的目標，想起那在展示間看過的用三百年楓木製作

  出來舉世無雙的小提琴，他決定尋找這棵無人知曉的楓樹，並且尋找可以演奏小提琴的人

  。


  為了追求真實感《為你鍾琴》選在義大利小提琴製琴重鎮—克雷莫納拍攝，也保留製琴的

  過程，呈現出製琴工作室的風貌。另外也帶出在古典樂界史上拍賣價格最高價格，4500萬

  的「史特拉底瓦里名琴」。電影中將製琴師夢想定在如樂器製作知名家族中最受讚譽的大

  師同等的作品，如同將逝去的歷史經典再重新用自己的方式詮釋，已完成自己心裡從年輕

  到老那瘋狂一次的心願。










  《為你鍾琴》分析與延伸：


  現在小提琴的開端是從16世紀的義大利，早期的小提琴其實是由其他琴種所衍生改良後較

  為嬌小的樂器，這也讓小提琴制琴師這個專業從16世紀開始蓬勃發展。歷史記載中小提琴

  樂器的發明家是安德雷亞阿馬蒂，過去為製作魯特琴的工匠。


  後續安德雷亞阿馬蒂的孩子也成為小提琴製琴師，並且屆由文藝復興運動，他們傳承在孩

  子、學徒等工匠小提琴工藝，而讓整個小提琴製作從義大利拓展到整個歐洲各處。


  在當年代也有其他知名的製琴師，並且在當時同時是製琴師又是演奏者的小提琴製作者也

  相當普遍，例如Gasparo da Salò，家族歷代都是小提琴家，而他製作的琴也有在歷史文

  件中被記錄下來。而有意思的是在英語中，稱呼從事弦樂器製作和修理的制琴師為「

  Luthier」，這單字為魯特琴之意，可以看出魯特琴對於後來弦樂器製作的影響。










  而在弦樂器製作中分成兩種類型：「撥弦樂器」和「弓弦樂器」。撥弦樂器是用手指或物

  件撥弦發音的樂器，例如吉他。而弓弦樂器則就是現在古典樂團常見的提琴類，像是小提

  琴、中提琴、大提琴等，兩者在後來分門別類成不同的工匠派別，而弓弦樂器中操作樂器

  的琴弓，則是有額外專門製作琴弓的製作師來操刀。


  雖然在十九世紀後也開始有工業機器量產的小提琴，但是通常演奏家還是會發錢購買上好

  的手工樂器。目前這種製琴師的傳承還是透過學徒制或工作坊的授課來傳授製作方式。


  電影中出現被受讚譽的小提琴「史特拉第瓦里琴」，除了是歷史公認最貴、最好的弦樂器

  外，它也會隨著使用者的評價而調整這把小提琴整體的價值，也就是即便擁有絕世好琴如

  果演奏者不爭氣，史特拉第瓦里琴反而會掉價。2019年義大利的克雷莫納展開「史特拉第

  瓦里琴音庫錄音計畫」，透過提琴博物館錄製史特拉第瓦里琴的音色，並且用最高品質錄

  取聲音，讓來館參觀的人士可以聽到最動聽的弦樂之音。










  《為你鍾琴》值得一看嗎？


  電影除了有從原木板製作成小提琴的製琴過程外，在尋找百年楓木這邊用了紀錄片的手法

  去呈現，讓這部電影在製琴的浪漫間，添加了現實的打擊與難處。


  整體來說我覺得這部電影享受琴聲美妙之外，也看見製琴職人對於本身的工作態度和夢想

  的執著，想要努力接近或將自己畢生的技術做到完美，而來了一段追逐夢的旅程，雖然不

  免被現實打臉，但還是很努力地去完成自己長久的心願。


  雖然電影採用紀錄片的方式來拍攝製琴師一次次遠赴他鄉只為了找尋那塊傳說的楓木，但

  近期因為看了關於台灣發生移工深山林木盜伐的專題報導，在觀影時一直看主角跟接洽人

  員上山伐木，不免會聯想關於這樣私自上山伐木的合法性。當然電影中也給予許多獲得楓

  木的手段，最後算是比較能被接受的。但多次都以被動的方式等待楓木的主角雖然說很寫

  實，但也有點無趣。









  《為你鍾琴》展現出一位工藝師追求的是製作出一把上好的樂器，並且由他認可的人所擁

  有並演奏它，讓這把小提琴展現他的魅力所在，而不是單純的因為自己的名聲和稀有的用

  料，成為被收藏的收藏品。


  這也反應在故事的一段，和真實世界為何提琴博物館要那麼高規格的還原史特拉第瓦里琴

  聲被大眾所聽到，也就回到樂器的本質還是要演奏，而非只是無聲的展示。


  有時候追夢也需要一點運氣，而在等待機運到來時沈住氣和耐住性子成為了比本身專業更

  難熬的角力戰。中間製琴師有許多時刻可以得到、並且離夢後只差一步的距離，但卻不是

  時候而有擦肩而過。而當真正有了機會全力以赴完後的同時，製琴師是否獲得美譽留下名

  聲我們不得而知，但他絕對清楚這背後支持他的人是哪位。


  --

  個人Blog：

  小說連載頁：


  --'
