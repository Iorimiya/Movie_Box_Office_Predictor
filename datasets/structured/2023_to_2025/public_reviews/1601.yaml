url: https://www.ptt.cc/bbs/movie/M.1685955063.A.64C.html
title: '[好雷] 為你鍾琴'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  工欲善其事，必先利其器。現今世界上最名貴的小提琴就屬17至18世紀的兩大製琴師朱塞

  佩‧瓜奈里與安東尼奧·史特拉第瓦里所製作的琴，除了技藝高超之外，兩、三百年前遍

  地品質絕佳的木頭也造就他們作品獨特的音質與音色。義大利克雷莫納是小提琴的發源地

  之一，製琴名家加斯帕‧柏卡德傾盡一生希冀能製作出一把讓自己滿意的絕世名琴。為了

  追尋與史特拉第瓦里相同的木材，加斯帕踏上艱難又危險的冒險，紀錄片《為你鍾琴》不

  但紀錄下這段旅程，也刻畫出加斯帕的職人精神。



  在歐洲巴爾幹半島森林裡，除了知名的楓林外，這裡也潛藏著一棵能製出一把無價樂器的

  樹木，其品質與地位，甚至能比擬史特拉第瓦里小提琴。製琴師加斯帕接受一項新的挑戰

  ：要為小提琴名家吉妮‧楊森，製作出一把舉世無雙的小提琴…



  本片由挪威與荷蘭聯手拍攝，全片在義大利提琴重鎮克雷莫納（Cremona）及巴爾幹半島

  的波士尼亞進行拍攝。製琴大師加斯帕歷經百般波折，終為吉妮‧楊森打造出一把絕世好

  琴，其中的夢想、膽識、真情與勇氣都令人動容。



  雖說加斯帕的追尋進行四年之久，紀錄片當然不可能將所有的流水帳呈現給觀眾看。不到

  一個半小時的片長共節錄他四次接近「夢想之樹」：第一次深入地雷區，找到一棵大概只

  能留給三百年後製琴師的小樹；第二次與大盤商交涉，由於不經意透露小提琴市價而告吹

  ；第三次因為不捨砍倒一棵完美的樹而無功而返；最後才由於剛好有人清除地雷時砍倒一

  棵爛根的樹而如願以償。



  「只要你真心想要，全世界都會聯合起來幫你。」當一個人真心追尋某件事物，並且不是

  為了貪圖利益，不論經過多久，曾經聽聞過此事的人都會伸出援手。即便危險，還要用上

  製琴師平常不需要的談判技巧，甚至還得宣判某棵樹的生死，加斯帕的職人精神支持著他

  努力不懈地追尋「夢想之樹」。這還只是材料而已，找到之後，還得花費工藝與心力將其

  轉變成小提琴。進入波士尼亞與大盤商談價，加斯帕心裡也絕不會期待價格會多低，但價

  格談不攏頂多交易做不成，真正讓他感到不平的是，對方居然開口要求附贈一把小提琴。



  片中提到加斯帕的小提琴售價兩萬美元，但金額大小並不是重點，而是一名職人的心血不

  該變成「贈品」。紀錄片中也呈現出他當時是怎麼應對的，即使得知小提琴價格後大盤商

  獅子大開口，加斯帕也在簡訊當中提及自己接受對方的開價，但恕無法附贈小提琴，如果

  對方有需求或意願，歡迎向他訂購。這才是尊重專業的表現，不管大盤商拿到小提琴後是

  打算賣掉還是供奉在家做紀念都過於隨便。他並不是出於欣賞這把小提琴才購買或獲得它

  ，甚至還是用製琴師尋覓許久的虎紋楓木所製成，未免太過糟蹋樂器。



  雖然《為你鍾琴》是紀錄片，但因為其並非一般常見的闡釋型或參與型紀錄片，全片沒有

  對觀眾的解說也無被攝者與導演的互動，而是屬於「觀察型紀錄片」，導演是所謂「牆上

  的蒼蠅（fly on the wall）」視角，所以有些人看完之後認為片中情景都是安排好的。

  但其實只要稍微查找加斯帕的相關資料就會知道，劇組是聽聞他的追尋後覺得很有意思，

  才決定開始跟拍。紀錄片不就是如此嗎？發現一個有趣的題材，在根本不知道會不會有結

  果的情況下開拍，能不能拍到「完美大結局」沒人知道，但往往會獲得比劇情片更離奇的

  內容，這就是紀錄片的魔力。



  除了紀錄下加斯帕的追尋之外，大自然的美也在過程當中通通捕捉下來。小提琴重鎮克雷

  莫納給人一種歷史感，又帶有靜謐且優美的氣息；深入波士尼亞的森林後，好不容易找到

  夢想之樹的加斯帕感受到樹的美與生命力，說什麼也捨不得一聲令下斷送祂的生命。當時

  加斯帕三人望著遠方的山，感嘆戰火下的地雷反而成為這些樹的護身符，保護這些樹木免

  於遭砍伐的命運。



  要一名製琴師砍下一棵仍生長中的樹木未免太殘忍，不過，已經倒臥在地的木材那就另當

  別論。紀錄片最後，加斯帕找到虎紋楓木的關鍵是當年帶他上山的人發現，日前有人清除

  地雷時，順手砍倒一棵已經爛根的樹，但其餘部位都還健康完好，就像大自然贈與加斯帕

  的禮物一般，樹既已死去，將其製成小提琴便是一位製琴師所能回饋這棵楓樹的最佳贈禮

  ，讓這份大自然的美能夠以音樂的形式永存。



  其實，製琴師的工作本來就不僅侷限在工作坊內，加斯帕表示，他經常會與其他製琴師一

  同上山進入森林去尋找木材，只是他自己特別喜歡波士尼亞的楓樹，因此他常常到當地的

  一處鋸木廠去找素材。鋸木廠會為各地的製琴師備好小提琴須用的木材，但是，無論是波

  士尼亞的楓樹，還是其他的樹木，每一棵都獨一無二，所以當年加斯帕想要尋找與史特拉

  第瓦里相同條件的木材是非常困難的。



  世界各地的製琴師鍾愛虎紋楓木，不單是為了美麗的火焰紋路，更是由於其濕度比其他楓

  木少四分之一，而且隨著樹齡增長，質地會越來越堅硬，製成小提琴後便能賦予琴豐厚同

  時又含蓄的獨特音色。加斯帕平時也還是有使用虎紋楓木製琴，只是可能不像《為你鍾琴

  》裡尋找的是生長三百年，並在特定月相時砍伐，天時地利人和的完美木材。所以，並不

  是只要冠上「虎紋楓木」的名號，那把琴就特別貴，品牌與做工也是考量的關鍵。



  以提琴來說，製琴師就是品牌，加斯帕與妻子習慣使用史特拉第瓦里的模板，而他欣賞的

  小提琴名家吉妮‧楊森也特別鍾愛史特拉第瓦里的琴，因此，找尋與史特拉第瓦里相同的

  木材，為吉尼‧楊森製作一把小提琴極具意義。當然，特殊的木頭年份或種類當然也會影

  響到樂器的價值，像是以已經禁伐的品種製成，如：巴西玫瑰木，流通在市面上的作品自

  然也會比較昂貴。



  只能說，《為你鍾琴》全片都能感受到加斯帕對製琴與音樂的熱情。比較可惜的是，雖說

  從英文片名到劇情簡介都告訴觀眾，本部紀錄片的重點是這趟冒險，但既然片長不算太長

  ，也已紀錄加斯帕的旅程，不如完整紀錄製作一把小提琴的過程。片中呈現出打磨原木、

  描圖以及部分的塑型，但觀眾看完整部紀錄片之後，對於小提琴的f孔如何挖、琴頭、琴

  頸、腮托與音柱等琴身各部如何安裝，以及各片硬木切割完成後如何組裝都一無所知，稍

  嫌可惜，但仍無損觀眾欣賞這部歌頌職人精神的紀錄片時，所能體會到的感動。


  --

