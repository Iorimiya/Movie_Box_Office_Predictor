title: '[新聞] 東京旋律修復版首度登台 重現坂本龍一風'
content: '東京旋律修復版首度登台 重現坂本龍一風采



  2025/5/22 21:11（5/22 21:26 更新）


  （中央社記者趙靜瑜台北22日電）音樂紀錄片「坂本龍一：東京旋律」4K數位修復版本，

  6月首度在台灣大銀幕登場，此片由美國視覺藝術家伊莉莎白・藍納德執導，封存坂本龍

  一32歲時的絕代風華與前衛創作軌跡。


  「坂本龍一：東京旋律」（Tokyo Melody: A Film about Ryuichi Sakamoto）誕生於

  1984年，至今問世40週年，也是坂本龍一在世界舞台聲名大噪之際的珍貴紀錄。導演伊莉

  莎白・藍納德（Elizabeth Lennard）因在坎城影展觀賞大島渚「俘虜」一片，深受坂本

  龍一的音樂與銀幕魅力震撼，於是展開尋人之旅。


  根據佳映娛樂發布的新聞資料，當時坂本正在柏林錄音，藍納德帶著親手上色、曾於龐畢

  度中心展出的攝影作品前往拜會，成功說服坂本合作。


  藍納德認為，在尚未全球化的1980年代，坂本早已探索歐洲古典、日本傳統及現代電子樂

  ，展現驚人的文化深度與創作視野，「他的早熟與包容，讓人無比敬佩。」


  「坂本龍一：東京旋律」開場借用法國作曲家德布西（Claude Debussy）的名言，「我創

  作的是要讓20世紀之後，我們的子孫才能理解的作品。」這句話清楚點出坂本龍一突破時

  代、跨越文化的音樂精神。


  藍納德受限於預算，只花了7天拍攝，4天貼身記錄他的工作日常，2天深入錄音室，另2天

  則隨坂本漫步東京街頭，卻精準捕捉坂本創作時的種種神采。坂本在鏡頭前毫無架子，面

  對路人與鏡頭皆展現輕鬆自在的風采，甚至在地鐵站偶遇自己代言的廣告也笑容以對，展

  現真實無矯飾的親和力。


  「坂本龍一：東京旋律」從1985年在聖保羅影展首映後，原始膠捲便塵封在導演家中地下

  室數十年，直到坂本遺孀與經紀人共同推動修復工程，才於2023年重見天日。（編輯：吳

  素柔）1140522



