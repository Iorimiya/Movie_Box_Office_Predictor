title: '[新聞] 台美菲合製「折翼姊妹」，看見性取向信仰'
content: '新聞網址：


  台美菲合製「折翼姊妹」 看見性取向信仰掙扎


  2023/10/28 16:46


  （中央社記者王心妤台北28日電）電影「折翼姊妹」描述LGBTQ故事。美籍導演潘宇綱花6

  年拍攝，並從過程發現這群LGBTQ教徒雖然性取向不被認同，仍有面對困境的勇敢。


  根據電影發行公司海鵬電影新聞稿，台灣、美國和菲律賓合製電影「折翼姊妹」（

  Divine Factory）劇情描述馬尼拉一間工廠，一群LGBTQ（男女同性戀、雙性戀及跨性別

  者）生產天主教雕像的故事。他們原本經濟困頓，卻因為教宗分享「沉睡中的聖若瑟」塑

  像的靈驗，造成信徒搶購。


  潘宇鋼從這樣的背景中凸顯主角雀兒喜（Chelsea）、莎爾薇（Salvi）等LGBTQ人士，雖

  然在這間「造神」工廠獲得庇護，但他們的性取向卻不受到天主教認同與祝福，從片中能

  見他們的生活。


  導演潘宇綱分享，原本想拍一部劇情片，卻在勘景時發現了這間工廠，「他們的故事太豐

  富了，比編的劇本還精彩。」他最後耗時6年完成拍攝，期待電影11月3日在台灣上映後，

  觀眾能看見他們的故事。（編輯：李亨山）1121028



  --'
