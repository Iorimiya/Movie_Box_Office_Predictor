title: '[新聞] 《折翼姊妹》紀錄LGBTQ樂觀面對挫折'
content: "《折翼姊妹》紀錄LGBTQ樂觀面對挫折\n\n04:10  2023/10/03 中國時報 李承陽\n\n\n《折翼姊妹》描述一群LGBTQ埋首馬尼拉天主教雕像工廠生產神像的人生故事。\n\
  （海鵬提供）\n\n由台灣、美國和菲律賓聯合製作的紀錄電影《折翼姊妹》，1日晚在桃園電影節舉行首映\n，該片由菲律賓裔美國籍導演潘宇綱所執導，劇情描述一個座落於馬尼拉、如迷宮般的天\n\
  主教雕像工廠中，一群LGBTQ正埋首生產神像的人生故事。\n\n潘宇綱原先想拍攝一部劇情片，卻在勘景時意外發現這座同志桃花源，老闆和員工全都是\nLGBTQ，讓他直嘆：「他們的故事太豐富了，比編的劇本還精采。」決定直接取材，更費\n\
  時6年拍攝完成這部紀錄電影。電影以「神創造了他們、他們也創造了神」為主軸，不僅\n探詢電影之於宗教與性向的命題，也關心這群LGBTQ老闆及員工在疫情後的近況。\n\
  \n有趣的是，潘宇綱本身是虔誠的天主教徒，並畢業於天主教學校，他在籌拍《折翼姊妹》\n時，發現這些LGBTQ的天主教徒，即使性向、價值觀不被教會認同，卻依然從容面對挫折\n\
  和掙扎，秉持著樂觀、充滿活力的態度，持續對教會盡職盡責，讓他大感敬佩。\n\n#教會 #潘宇 #姊妹 #紀錄電影 #LGBTQ\n\n--\n佛教經典的\n是\
  \ 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
