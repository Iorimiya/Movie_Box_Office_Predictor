title: '[新聞] 動畫《擊浪青春》日本高中生投入划船競技'
content: "動畫《擊浪青春》日本高中生投入划船競技\n\n【大紀元2025年07月28日訊】（大紀元記者樂慧萱報導）日本同名暢銷小說改編的動畫片\n《擊浪青春》，由宮崎駿御用導演櫻木優平執導，講述一群全心投入划船競技的女高中生\n\
  們的青春故事，電影將於9月5日正式在台上映。\n\n本片講述耀眼的水花飛濺，那片無邊際的晴空，溫柔包覆著五位女孩的青春心願——三津\n東高中的二年級生村上悅子一直過著沒有目標、沒有方向的高中生活，直到某天，一位名\n\
  叫高橋梨衣奈的轉學生邀請她一同著手重建早已名存實亡的划船社。隨著同屆的兵頭妙子\n與井本真優美相繼入社，社員人數終於到齊，原本只是為了湊人數而加入的悅子，卻在與\n\
  夥伴們相處的過程中，漸漸對這個社團產生了真正的情感。\n\n首次正式比賽當天，理想與現實的巨大落差讓團隊心灰意冷，就在大家幾乎放棄抵達終點\n的那一刻——悅子重新握起船槳，說道：「我想變得更厲害一點。」這句話讓五人的心緊\n\
  緊相繫，重新團結為一。這是一段青春的航程，真摯的情感直抵人心，也將在不知不覺間\n輕輕推動你，鼓勵你向前邁進。\n\n此片主角群聲優陣容由多位高人氣星光配音員所組成，包含擔任《出租女友》「水原千鶴\n\
  」 一角的雨宮天，為本作女主角「 村上悅子」配音；《BanG Dream! 少女樂團派對》\n「 弦卷心」的聲優伊藤美來，本次則演出有著可愛外表的開朗少女「佐伯姬」\
  \ ，在《我\n推的孩子》擔任女主角「星野愛」 的聲優高橋李依，成為本作中充滿活力的轉學生「 高\n橋梨衣奈」。\n\n\n圖為日本動畫片《擊浪青春》正式海報。（希望影視行銷股份有限公司提供）\n\
  \n而在《鬼滅之刃》擔任關鍵角色「竈門禰豆子」的鬼頭明里，和在《孤獨搖滾！》聲演「\n喜多郁代」一角的長谷川育美，分別為《擊浪青春》中兩位不對盤的千金小姐「兵頭妙子\n\
  」與「井本真優美」 配音。另外，星達拓娛樂旗下的人氣偶像男團 Kis-My-Ft2 的成員\n宮田俊哉，也在本作的賽艇比賽裡，為賽事現場評論的學生驚喜獻聲。\n\
  \n《擊浪青春》找來宮崎駿御用 CG 導演櫻木優平執導。\n\n導演櫻木優平表示：『這是一部非常純粹、真誠的電影。我們盡可能細膩地描繪出原作小\n說中清新生動的人物，以及故事背景中迷人景色，並以現代動畫的方式呈現給更多觀眾。\n\
  為了不辜負這部作品，它並不是那種靠語言去傳達的作品，所以請一定要走進電影院，親\n身去感受。我相信，悅子她們雖然稚嫩，但全心投入的身影，一定能打動大家的心。』\n\
  \n責任編輯：蘇漾\n\n\n\n--\n                 \n   \n\n\n\n--"
