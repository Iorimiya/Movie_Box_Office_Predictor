url: https://www.ptt.cc/bbs/movie/M.1757670173.A.772.html
title: '[新聞] 日本動畫電影《一百公尺。》 展現對短跑的'
content: "日本動畫電影《一百公尺。》 展現對短跑的熱情\n\n【大紀元2025年09月11日訊】（大紀元記者樂慧萱報導）日本動畫電影《一百公尺。》改\n\
  編自漫畫家魚豐出道作，將於10月3日全台上映，由松坂桃李、染谷將太配音。原作在日\n本亞馬遜獲得4.9星好評，即使漫畫完結後人氣依舊，讀者稱前所未有的運動熱血。\n\
  \n魚豊以《地。─關於地球的運動─》榮獲「手塚治虫文化獎」大獎，創下最年輕得主紀錄\n。隨後，他的出道作品《一百公尺。》也將搬上大銀幕。這部風格迥異的作品深受讀者喜\n\
  愛，紛紛表示：「內心也跟著熱血沸騰起來了」、「我不曾在運動漫畫獲得這樣的感受」\n。\n\n漫畫《一百公尺。─100M─》自 2018 年開始在《Magazine\
  \ Pocket》連載以來便話題不\n斷，如今已完結。作品以「100公尺短跑」為主題，看似單純的青春競賽，卻在魚豊筆下\n展現出截然不同的深度。\n\n故事講述天賦異稟、以速度獲得容身之處的「天才型」少年富樫，在某次比賽中初嘗到失\n\
  敗，並與另一名瘋狂鍛鍊的「努力型」少年小宮相遇。短短十幾秒的100公尺賽道，卻蘊\n藏著足以賭上人生的「熱血」在其中。\n\n\n\n圖為日本動畫電影《一百公尺。》劇照。（車庫娛樂提供）\n\
  \n導演岩井澤健治曾執導漫改動畫電影的《搖滾吧！中二樂團》，憑藉該片榮獲「加拿大渥\n太華國際動畫影展」最佳動畫長片，並入圍「美國安妮獎」等多項國際影展大獎肯定，在\n\
  國際間嶄露頭角。值得一提的是，岩井澤導演並非動畫科班出身，而是向日本知名導演石\n井輝男學習電影拍攝手法，再自學的動畫技巧，才取得今日的成就。\n\n本次《一百公尺。─100M─》改編為動畫電影，岩井澤導演將以他獨特鏡頭語言和手繪質\n\
  感，並與曾參與多部《機動戰士鋼彈》系列電影、《東京復仇者》等作的編劇武藤康之聯\n手。\n\n電影《一百公尺。》在10月3日全台上映。\n\n責任編輯：蘇漾\n\
  \n\n\n--\n                 \n   \n\n\n\n--"
