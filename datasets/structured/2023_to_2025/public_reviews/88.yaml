url: https://www.ptt.cc/bbs/movie/M.1759495794.A.C70.html
title: '[好雷] 《ひゃくえむ。》(一百公尺。—100M—)'
content: '不同於之前看的 鬼滅無限城 & 鏈鋸人_蕾潔篇 窩是看過漫畫才去看電影(阿..鏈鋸是只看

  完第一步啦..),蝦哭咩斗是還沒看漫畫就去衝電影首日


  但是魚豐的《地。》畫風很潮! 窩很喜歡!


  然後 一百公尺 雖然沒什麼驚豔的聲光效果,卻是最接近那種..那種漫畫感轉成動感


  有種貼近原生漫畫的那種喜悅xd~


  西洽有先看過漫畫再看電影的哀低, 電影似乎跳掉太多劇情


  這樣的話,窩個人建議是還沒看過漫畫的觀眾,請先考慮來看電影版


  (防雷頁)




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  其實好像也沒啥好防雷的

  預告演的,已經可以猜出一切,兩人相遇 分別 再相遇 長大再終極(?)對決


  尼會感慨津田大叔講惹一堆很有道理的人生哲學..只要尼年紀夠大,看到夠多現實;

  然後トガシ跪地開始痛哭,就是預告跪地痛哭那位,嚇死我! 絕望可以讓人瞬間變老

  ..但是成功的人,會在懊悔後下定某種決心..


  最後一幕,小宮終於露出了笑顏,

  看著歌詞回顧劇情,第二滴眼淚順著第一滴的軌跡滑下來,


  這真的是給大人看的動畫電影,沒有什麼奇幻過程,尼在人生遇到的酸苦辣,就在一百公尺內


  最後,原本想聽出凹醬是配哪個女森,沒想到她是配國小的小宮? 她配小男森還蠻厲害的麻

  然後,種崎敦美,終於配惹個講話聽得懂的腳色了嗎XD


  --




  ..10多年後,孩子成了40多歲的大叔,開始稱

  養大他的Pr馬還在島上呢。


  --'
