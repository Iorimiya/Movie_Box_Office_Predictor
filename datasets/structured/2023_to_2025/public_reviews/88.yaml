url: https://www.ptt.cc/bbs/movie/M.1758423701.A.FD0.html
title: '[好雷] 《一百公尺。—100M—》（ひゃくえむ。)'
content: '上映時間 日本9/19 台灣10/3


  剛看完魚豐的漫畫出道作《一百公尺。—100M—》（ひゃくえむ。)改編的劇場版動畫。

  主題曲是 Official髭男dism 的〈らしさ〉，這首歌特別為原作量身打造，藤原聰把對競

  爭社會中奮鬥者的應援都寫進歌詞裡，搭配充滿疾走感的樂團音色，真的超契合。


  整部電影真的超好看！

  每個角色都有自己不同的目的、不同的想法去面對「奔跑」，而且每一種答案都成立，每

  個人都帥到不行。


  「努力」與「挫折」的真實感受，被濃縮在短短片長裡表現得很有張力。

  影像表現也相當精彩。


  之前就聽說這部作品充滿「名言」，果然一點都沒錯。不同背景的角色，展現他們對努力

  的態度與姿態，看得很有共鳴。


  最後的收尾也很喜歡，比起輸贏的結果，更重視走到那一步的過程，讓人深受啟發。作為

  一部電影，也保留了足夠的想像空間。


  看完只覺得——果然還是想要活得帥氣一點啊！




  --'
