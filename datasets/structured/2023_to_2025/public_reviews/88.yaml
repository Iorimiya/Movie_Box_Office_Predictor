url: https://www.ptt.cc/bbs/movie/M.1759329729.A.3B9.html
title: '[普好雷] 一百公尺。'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《 一百公尺 》 觀後感（無雷，不超過片介和預告）\n\
  \n1 不錯看的動畫片～\n2 簡單的故事說得精彩，至少前半部分有做到\n3 配樂和片尾曲非常值得期待（請片商提供歌單，謝謝\n4 海報很好看\n5 想到 驀然回首+黑子的籃球+閃電十一人\n\
  \n以下雷\n\n一部討論天賦和目標的電影。成功用「心流理論」完整論證「熱情」的概念。\n\n主角都是一群擁有一些天賦的人，所以想要打破現有的紀錄。這想法其實不難理解，因為\n\
  擁有天份跟一些過往的成績，自然想持續獲得正向回饋，保持一絲勝利的希望。\n\n天賦除了讓我們有挑戰的動力，更可能變成生活重心。例如小宮同學對生命感到虛無，於\n\
  是把跑步當做逃避現實的道路，甚至將生命都押在打破日本第一的短跑紀錄。\n\n小宮用跑步逃避現實，富樫同學則因為跑步而被需要。依靠跑步的才能，他變成田徑社瀕\n\
  臨廢社的依靠、眾人焦點，甚至後來以田徑為業。\n\n無論是挑戰紀錄，或仰賴才能在社會立足，都有明確的極限。當紀錄被打破沒有對手，或\n是不用盡全力就可以溫飽，那到底為何而跑？\n\
  \n一旦發現自己擁有才能，就會想要進步、想要知道自己的極限。擁有在賽道上比肩奔跑的\n對手，是非常幸福的事情，他們給我們持續比較的標的。\n\n倘若站在世界之巔，或是認清現實發現自己無法稱王，還是有燃燒生命去活的方式。\n\
  .\n若你有幸有一點才能、還有足夠的時間，不斷追趕想像和能力的差距，感受全力以赴的瞬\n間吧。\n\n直到再也跑不動的一天。\n\n片尾曲是 official鬍子男dism的＜個性＞\n\
  \n–\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n--\n我沒看漫畫～\n片尾神好聽"
