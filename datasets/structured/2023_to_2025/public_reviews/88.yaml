url: https://www.ptt.cc/bbs/movie/M.1760363924.A.E96.html
title: '[好雷] 《一百公尺。》跑出了侘寂'
content: '會去看這部動畫是因為導演岩井澤健治，之前是《搖滾吧！中二樂團》的導演（同樣也是

  漫畫改編）。同樣運用轉描機技術（Rotoscoping），這項其實已經不是什麼新技術了，

  但導演因為也喜歡畫畫，所以延續使用。


  《一百公尺。》因為我沒看過原著漫畫，看了一陣子才發現，完全不是那種熱血啊、同伴

  啊型態的熱血動畫，在《灌籃高手》裡的所有元素，動畫裡通通都沒有；但我很喜歡所傳

  達的內在核心精神。


  短跑是孤獨的，受傷風險也大，能夠稍微理解、互相傾訴的人，頂多同樣是跑短跑、實力

  接近的對手。


  這是一部「侘寂」（wabi-sabi）美學的動畫。


  推薦給大家。


  註：轉描機技術為先拍真人影像，最後以手繪方式去描這些影像來呈現動畫。


