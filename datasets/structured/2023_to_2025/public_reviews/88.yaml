url: https://www.ptt.cc/bbs/movie/M.1716543931.A.46F.html
title: '[情報] 《一百公尺。》改編動畫將由《中二樂團》導演執導！'
content: '根據日媒的報導，曾以《搖滾吧！中二樂團》打響知名度的新銳動畫導演「岩井澤健治」

  將執導動畫新片《一百公尺。》（ひゃくえむ。）。




  《一百公尺。》改編自漫畫家「魚豊」的同名作品。描寫男主角「富樫」天生就跑得比別

  人快，在小時候，他能輕易的以這樣的天賦獲勝。但在六年級時，他遇上了一位轉學生「

  小宮」，一位擁有決心但缺乏技術的男孩。在富樫教導小宮，他給了對方一個目標：那就

  是無論如何都要贏。經過數年之後，兩人再次在田徑場上相遇，並且將展現自我、一較高

  下。


  《一百公尺。》的角色設計和作畫監督由《轉生賢者的異世界生活～取得第二職業，成為

  世界最強～》的導演兼角色設「小嶋慶祐」擔當，他近期也擔任了人氣動畫《葬送的芙莉

  蓮》的演出和分鏡等工作。


  岩井澤健治以自主製作的首部動畫長片《搖滾吧！中二樂團》經驗影壇，在 2023 年帶著

  新片企劃《ひな》獲選為安錫動畫影展當年在坎城影展市場展上展示的重點作品之一，如

  今他又很快的將投入第三部電影的製作，也將是他第一部商業規格製作的動畫長片。




  《一百公尺。》動畫製作由岩井澤健治創立的工作室「ロックンロール・マウンテン」承

  包。其背後融資參與製作的公司則包括 PONY CANYON、Asmik Ace 和 TBS 在日本國內極

  具地位與知名度的娛樂公司。




  在《ひな》尚未問世前，《一百公尺。》這回也再度入選了安錫動畫影展的「WIP 單元」

  ，即將在六月開展的影展中展示製作中的片段吸引國際的買家以獲取資金。全片完全預計

  片長為 95 分鐘。




  --'
