url: https://www.ptt.cc/bbs/movie/M.1759820187.A.09C.html
title: '[好雷]《一百公尺。》：直視那份燃燒殆盡的純粹 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  真的，這部比我預期的還好看50倍。


  本來看到C洽版漫畫黨的負雷有點想放棄去電影，但看完走出戲院，

  心臟還在為了劇中人的拚搏而滾燙。

  《一百公尺。》根本是一部逼著你去思考天賦、挫折跟生命意義的電影。


  先說，我是原作漫畫黨，小學隧道裡那場對決，到現在還是我的最愛。

  所以，我完全可以理解漫畫黨會覺得，電影礙於篇幅刪減太多，角色鋪陳不夠可惜。

  這點絕對是改編的非戰之罪。


  但，我必須要說，動畫把所有的力量，全都灌注在「賽道上那十秒的純粹」了。


  那種透過作畫、撼動心臟的配樂、還有聲優急促的呼吸聲，把感官放大、時間凝結的瞬間

  …

  那個衝擊力，是只有大銀幕才有的魅力，也是我認為這部電影最成功的地方。


  電影最觸動我的，就是那種「天賦、勝利、低潮、挫折、再次挑戰」的循環。

  我們大多數人都不是富樫或小松，沒有那樣的天賦，或許也沒有那樣的執著。

  但我們都曾在人生的某個時刻，感受過那面名為「極限」的高牆。


  所以看到他們的故事，才會這麼激動，甚至想哭。

  我們羨慕的，從來不是冠軍，而是那種「可以為一件事物燃燒殆盡」的純粹。


  片中最核心的一句：「你為何而跑？」


  這句話，其實也在問我們每個觀眾：「你為何而活？」


  人生就這麼長，能在有限的時間裡，找到一件值得你拚盡全力的事，不管那件事多大多小

  ，本身就已經是天大的幸運。

  那種奮不顧身的姿態，真的耀眼的讓人流淚。


  電影用百米賽跑，講的其實是我們每個人的人生。

  我們可能一輩子都成不了天才，但這部電影會提醒你，找到自己的跑道，然後全力衝刺，

  那個過程本身就充滿了意義。


  推薦給所有曾經懷抱夢想、曾經感到挫折的你。

  看完電影，或許你也會想好好感受每一次心跳，每一次呼吸。


  因為，光是跑步之後的大口呼吸，就能讓我覺得活著真好。


  --

  無法光明地看待事物，不少時候是對黑暗的解釋出了問題。



  --'
