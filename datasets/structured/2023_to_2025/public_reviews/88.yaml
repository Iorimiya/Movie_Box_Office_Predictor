url: https://www.ptt.cc/bbs/movie/M.1752814192.A.5C6.html
title: '[情報] 《一百公尺。—100M—》動畫電影釋出正'
content: "《一百公尺。—100M—》動畫電影釋出正式預告 主題曲由 Official 髭男 dism 擔綱演\n唱\n\n\n\n由魚豊所著漫畫改編，預定將於今年\
  \ 9/19 在日本上映的動畫電影《一百公尺。\n—100M—》釋出了作品的正式預告宣傳影片以及主視覺圖，同時主題曲也確定由\n Official 髭男 dism\
  \ 擔綱創作與演唱，曲名為「らしさ」。\n\n\n\n《一百公尺。—100M—》故事描述天生跑得快的少年富樫，在一百公尺賽跑中位列全國第\n一。不管「朋友」或「容身之處」，他藉由「它」獲得了一切。但是在小六那年夏天，富\n\
  樫在有生以來初次的落敗中感受到了恐懼。與此同時體會到了認真的激昂與亢奮──一百\n公尺距離的全力快跑，換算成時間只要十幾秒。然而有著值得賭上人生的「熱血」在其中\n\
  。\n\n\n\n而在本次的預告影片中，也可以聽到主題曲「らしさ」。Official 髭男 dism 表示，本\n次的歌曲是成員們因深受原作感動而特別創作的歌曲：「這個世界充滿了絕對贏不了的對\n\
  手，以及會來妨礙自己的自我，這樣的強敵四處都是。即使如此，我們不願接受、也不願\n習慣這一切，這首歌便是為了所有奮戰、對抗這些『絕對』的人們所創作的讚歌。」\n\
  \n　　此外，由堤博明擔任配樂的《一百公尺。—100M—》雙 CD 版原聲帶將於 9/17 在日\n本發售，DISC1 將收錄全片以電影配樂手法製作的配樂，共計\
  \ 20 首。錄音地點遍及美國\n紐約、匈牙利布達佩斯以及東京三地，邀請到當地的知名音樂家們參與演奏。DISC2 則為\n「Extended Edition」，收錄了珍貴的配樂\
  \ Demo 版、加長版、運動訓練用版本等，共\n 12 首曲目。\n\n\n--"
