  例如:種崎敦美總算沒配像是芙莉蓮或聖亞,這種講話難懂的\n然後凹醬配小男森意外適合;\n\n以及聽芭樂吉面攤,不對,言攤講一些晦澀難懂的話XD\n然後杉田智和還是配這種不討喜的腳色,偏偏原著沒有出場XD||\n\
  \n然後這場坐後面的排,好像還看到有在運動的女森過來看 蠻感動的\n\n(防雷頁)\n\n\n\n\n1. Starts to Rain\n\n  影片主角右手拿的是什麼呢?\
  \  還有重要大賽下大雨,沒可能延期嗎?選手有可能滑倒耶\n\n2. 100 meters (For Workout)\n\n  這段沒有對白的過程,紀錄主角一些非比賽日常,\n\
  \n  注意均衡攝取營養對選手也很重要對嗎?  決賽日像日常上班一樣去賽場也是紀律嗎?\n\n3.\n  Official髭男dism「らしさ」✕ 劇場アニメ「ひゃくえむ。」コラボレーションMV\n\
  \  歌詞中\n 「因為開始得晚」「因為世界太大」「因為天才水平不一樣」「說到底你開心就好啦」\n\n  這些通常都是落後者安慰自己的話,也就是冨樫或海棠的心境嗎?\n\
  \n\n感謝觀看~\n\n\n--\n\n\n..10多年後,孩子成了40多歲的大叔,開始稱\n養大他的Pr馬還在島上呢。\n\n--"
