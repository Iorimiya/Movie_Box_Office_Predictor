url: https://www.ptt.cc/bbs/movie/M.1761575395.A.8E9.html
title: '[超好雷] 一百公尺。：今年最愛的日本動畫片'
content: '今年最打動我的日本動畫片，不是畫風華麗的《鬼滅之刃 無限城篇》、不是節奏炸裂的

  《鏈鋸人 蕾潔篇》、更不是年年例行的《名偵探柯南 獨眼的殘像》，而是《一百公尺。

  》。

  .

  對我這種喜歡跑步、也愛看賽事的人來說，很難不被這部片擊中。但《一百公尺。》的好

  ，在於導演以精準的節奏掌控，讓角色的每次起跑、跌倒與重新站起都緊繃又真實。人物

  塑造細膩，劇本結構緊湊，畫風靈動且充滿速度感，配樂更熱血得恰到好處。無論你是否

  擅長運動，只要曾為某件事拼盡全力，都能在這部片找到共鳴。

  .

  觀影過程彷彿在看一場跨越十多年的運動紀錄片：初出茅廬的傲氣、陷入瓶頸的焦慮、重

  新出發的決心，都點到為止又餘韻悠長。作畫偶爾甚至讓人錯覺自己也在跑道上與主角並

  肩奔馳，感受十秒間強風吹拂、百米內景色流動的剎那永恆。


  /


  兩個少年的相知相惜、亦敵亦友，是日本動畫常見的題材，而《一百公尺。》的富樫與小

  宮，正是在這樣的框架中長成的對照組。

  .

  富樫自小就展現過人的短跑天賦，是校內的明星，也是眾人仰望的焦點。對他而言，跑步

  象徵肯定與歸屬，「只要在一百公尺裡跑得比誰都快，所有問題就能迎刃而解。」然而升

  上中學後，他發現自己無法再突破紀錄，也不再是永遠的贏家。那份自信逐漸褪色，取而

  代之的是迷惘與倦怠。

  .

  小宮則是富樫的對立面，他資質平凡、以拼勁與苦練彌補技術上的不足。轉學初見富樫時

  ，他被對方的速度震懾，也在富樫的提醒下學會跑步的節奏。沒想到多年後兩人重逢，小

  宮早已脫胎換骨，從昔日的追趕者成為急速竄起的黑馬。對他而言，跑步不是舞台，而是

  一種逃避現實痛苦的方式。

  .

  《一百公尺。》的前半段讓我想到藤本樹的《驀然回首》，只不過「你為什麼畫漫畫」的

  大哉問，變成了「你為什麼跑步？」劇情沒有落入「努力就會成功」的熱血窠臼，而是回

  歸單純的提問：不是因為喜歡才開始跑的嗎？為什麼別人的幾句批評就讓你退卻、看到更

  快的跑者就自我否定？而跑步和作畫這兩件事意外地相似，多數時候都是孤獨的修行。

  .

  導演沒有刻意鋪陳複雜的人際關係，而是讓每位角色對於跑步的價值觀展示給觀眾，這些

  回應或許不同，卻都指向同個核心 — 當我們傾盡全力時，到底是在與他人競爭，還是在

  追尋自己存在的意義？

  .

  本片最動人的，在於對「時間」的掌握。從小學、中學到出社會，長達 15 年的跨度以輕

  描淡寫的轉場帶過；而一場不過十秒的百米衝刺，卻被描繪得深刻且完整。正如台詞所言

  ：「為了這十秒鐘，我們傾注了一生。」無論是富樫、小宮，或其他各有特色的跑者，他

  們相識於百米、成名於百米、迷失於百米，最後在百米的跑道上重逢與和解。那十秒的奔

  跑，承載著他們一生的希望、恐懼與執念。

  .

  或許有人會說，當嗜好變成職業，終究會燃盡熱愛。但《一百公尺。》提醒我們：若能在

  短暫的一生拿出所有本事、專注做好一件事，本身就是人生的意義。


  /


  《一百公尺。》原作漫畫連載於 2018 至 2019 年，是漫畫家魚豊的首部長篇作品。他曾

  在訪問中提到，創作靈感來自里約奧運的 100 公尺預賽，一名選手因起跑犯規被判失格

  。魚豊想到對這名選手而言，下一次機會也許得再等四年，甚至可能是他人生最後一次奧

  運。「比賽還沒開始就結束了。」那份殘酷與無常，啟發他創作出《一百公尺。》。

  .

  我雖然未看過原作，無法完全體會原作黨對電影改編的不滿。但就電影而言，的確更聚焦

  於富樫的起落，小宮則像富樫的影子：從追隨、並肩到超越，小宮的動機相較之下被淡化

  ：他的性格為何陰沉、又為何執著於紀錄，這些在原作有完整鋪陳。導演選擇讓主題聚焦

  「跑步的純粹」，但也讓小宮的成長曲線略顯突兀，或許正是原作黨最難釋懷的地方。

  .

  這也是導演岩井澤健治首部商業取向的動畫長片。他與團隊延續《搖滾吧！中二樂團》略

  顯粗糙的質樸線條，顛覆日本傳統動畫色彩飽滿、筆觸細膩的觀影體驗，反而讓觀眾耳目

  一新。尤其富樫與小宮中學時期的雨中對決，堪稱全片最動人的片段。

  .

  導演採用「轉描」技術 — 先以真人拍攝，再逐格轉換為手繪動畫 — 讓雨滴、汗水與肌

  肉的震動都真實可感。當他們衝刺時的「表情管理」也趣味又寫實，扭曲的五官、放大的

  雙眼不僅呈現速度感，更凸顯對勝利的渴望。那一刻，「你為什麼而跑」的答案似乎不言

  自明。

  .

  片尾由 Official 髭男 dism 演唱的〈らしさ〉畫龍點睛，「不被上天眷顧的才能／那份

  絕不平穩的性格／但我擁有描繪巨大夢想的堅強」，乍聽像是小宮的寫照，卻也貼合富樫

  的掙扎。比起場上的勝負，我更被電影後段刻畫的「運動員生涯」打動。

  .

  富樫不過 25 歲，已迎來運動員的「中年危機」：新星崛起、身體老化、成績停滯。曾經

  的獨行俠變得圓融，懂得對上司點頭哈腰，卻也被現實壓得喘不過氣，讓我想到無數運動

  員的身影 — 那些還沒發光就被淘汰的人，巔峰過後逐漸黯淡的人、仍在跑道上不肯停下

  的人。心中湧上的不只是感慨，而是一種深深的敬意。

  .

  此外，松坂桃李與染谷將太的配音表現堪稱亮眼。松坂以沉穩爽朗的聲線詮釋富樫的成長

  軌跡，從少年時的寡言酷勁到成年後的無奈與強顏歡笑都充滿表情；染谷則精準展現小宮

  的冷傲與孤僻（雖然成年後的蓄鬍造型一直讓我想到松山研一）。兩人聲線的對比與角色

  的張力相得益彰，即使與專業聲優同場也毫不遜色。

  .

  《一百公尺。》與魚豊後來的《地。—關於地球的運動—》有著相似的精神核心：人從自

  我懷疑出發，逐漸發現內心深處那股對某種事物的渴望，那是即使粉身碎骨也要實現的執

  念。正是這份原始而赤裸的執著，讓這部電影不僅關於「跑步」，更關於「存在」。


  更多影評推薦，歡迎按讚追蹤：

  NDF3eHF0aGUy


  --'
