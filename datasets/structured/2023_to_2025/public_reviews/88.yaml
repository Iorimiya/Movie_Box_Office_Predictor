title: '[情報] 魚豊《一百公尺。》前導特報'
content: "【】\n\n作者 的「」！\n\n\n\n《》\n\n10月3日(五) 全台上映\n\n  \n\n100公尺 ——\n\n值得賭上人生的「熱血」，激情與瘋狂交織的故事！\n\
  \n手塚治虫文化賞大賞史上最年輕得獎者 的連載出道作！\n\n改編自日本AMAZON 4.9顆星超高評價原作《一百公尺。—100M—》\n\n《》作者 的「」\n\
  \n改編為劇場版電影！\n\n《搖滾吧！中二樂團》導演 岩井澤健治 執導\n\nOfficial髭男dism深受原作感動打造電影主題曲\n\n松坂桃李、染谷將太\
  \ 注入靈魂獻聲配音\n\n\n天生跑得快的富樫，遇上為了逃避現實痛苦而拼命奔跑的轉學生小宮。\n\n在富樫的指導下，小宮找到了全心投入的目標，開始瘋狂追逐自己的紀錄。透過100公尺\n\
  短跑，他們不只成為競爭對手，更建立了如朋友般深厚的羈絆。\n\n數年後，已成為天才跑者的富樫，因必須持續勝利而感到迷惘與恐懼。\n\n就在此時，曾經一起奔跑的朋友，如今已是頂尖跑者之一的小宮，再度出現在他的面前…\n\
  …\n\n100公尺 ——\n\n把一切賭在瞬間的閃耀中，激情與瘋狂交織的熱血物語。\n\n--"
