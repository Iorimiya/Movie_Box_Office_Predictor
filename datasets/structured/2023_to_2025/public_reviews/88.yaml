title: '[ 好雷] 《一百公尺。——競技體育的薛西弗斯神'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  文學名著薛西弗斯神話中，卡繆筆下的薛西弗斯被眾神懲罰，必須將一塊巨石推上山頂，

  但石頭總會在抵達的瞬間滾回山下，他必須永恆地重複這個毫無意義的勞動。這是他無法

  逃脫的命運。


  而短跑選手的人生是由一場又一場的比賽構成的。他們為了「贏」而奔跑，但勝利是短暫

  的，榮耀會隨著下一場比賽的到來或失敗而褪色。


  「在一百公尺跑贏所得到的，也會在跑輸的時候失去。」

  對裡面的選手來說他所有的努力、汗水、掙扎，最終的結果是「零」。就像巨石回到原點

  ，他的勞動沒有產生任何實質的、永恆的價值。這凸顯了存在的荒謬——人類對意義的渴

  求，與世界沉默、無情的回應之間的矛盾。


  「世界上大部分的問題，只要一百公尺跑得夠快都能解決。」

  當富堅在高中成為日本第一的百米飛人，他贏得了鮮花、掌聲、名校的青睞與世人的期待

  。然而，這些東西是建立在「不敗」的基礎上。但沒有人是能真正保持不敗的，強如財津

  也有巔峰結束的一天，他一狀態下滑，受傷、或在更大的舞台上失敗，這些外在的榮耀便

  如潮水般退去，留下的是巨大的空虛與他人的質疑，他所說的那句話，也成了對他人生最

  大的打臉。世界上大部分的問題，只要一百公尺跑得夠快都能解決，反過來說，一旦他跑

  得不夠快了，他甚至解決不了任何問題。畢竟他只是因為自己跑很快而跑的人，他跑步的

  原因並不建立在跑步本身，僅是因為跑步對他來說是最好的選擇。


  而小宮象徵著一種純粹的、近乎哲學性的追求。對他而言，奔跑的意義不在於擊敗某個特

  定對手，而在於探索「人類速度的極限」。他的目標是超越紀錄，而非僅僅贏得比賽。這

  在某種程度上是對「勝負虛無」的一種超脫，他將意義內化為對「絕對速度」的追求。但

  他也在紀錄被海棠打破時，體會到了巨大的虛無與無力感。兩者的勝負對小宮來說不只是

  紀錄上的挫敗，更大意義是精神上的挫敗。因為恰巧海棠是個不在意紀錄的人，他所在意

  的僅是不再當萬年老二，對海棠來說現實即是他就是第二、第三，對他來說一直以來就是

  這樣，他所祈求僅是打破這個現實結果，創造出那唯一例外的可能性。


  《一百公尺。》的答案：在過程中確立自我

  富堅在經歷了巔峰與低谷後，被迫重新審視「自己為何而跑」。他必須意識到，將自我價

  值完全寄託於不穩定的外在成就，註定會導向虛無。這個「意識到」的過程，就如同薛西

  弗斯在下山時，清醒地認識到自己命運的荒謬。

  這也就是海棠所說的：「在逃避現實前，你必須清醒地面對現實。」


  當富堅最終放下對「不敗」的執念，小宮放下對紀錄的追求，轉而擁抱奔跑本身時，他們

  找到了真正的自由。他們奔跑的意義在於：

  在賽道上，與強大的對手互相激盪、彼此成就的瞬間，其價值超越了勝負的判決；投入所

  有自己的過去、與身體的物理法則競爭。「看看我究竟能跑多快」成為一個永恆的、屬於

  自己的命題


  總結：

  生命的終極意義，或許並不存在於某個遙遠的目標或結果，而是在於我們如何面對那充滿

  荒謬與虛無的「過程」。

  當薛西弗斯看著石頭滾下山，並毅然走下去再次推動它時，他是自由的。

  當短跑選手明知榮譽短暫、失敗常伴，卻依然在起跑架上蹲下，他是自由的。

  他們都在「無意義」的勞動與競爭中，通過全然的投入與清醒的意識，為自己創造了最深

  刻的意義。這是一種悲壯的，但也是充滿力量的人性光輝。


  勝利的榮耀確實短暫，失敗的苦楚也真實無比。這一切的確都可能歸於虛無。但是，一個

  選手的偉大，不在於他從未讓石頭滾落（勝利），而在於他每一次都清醒地、自覺地、充

  滿鬥志地走下山，再次將雙手放在巨石上，準備下一次的衝刺。




  --'
