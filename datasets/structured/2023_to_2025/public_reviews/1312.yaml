url: https://www.ptt.cc/bbs/movie/M.1698065985.A.A9B.html
title: '[新聞] 海景CP合演【日暮生死戀】雄影轟動好評！'
content: '新聞網址：



  泰國年度話題BL電影《日暮生死戀》，即將在11月17日於全台耽美上映。本片由曾主演人

  氣腐劇《甜心派》的知名BL劇搭檔「海景CP」李海海（Zee）、林景雲（NuNew）再度攜手

  演出，更是兩人的首部大銀幕共演之作，也讓本片未演先轟動，不僅受到本屆高雄電影節

  青睞，力邀成為「驚喜壓軸神秘場」，票券更在開賣後隨即秒殺。本片昨日（10/22）在

  高雄電影節首映後引爆轟動好評，也讓片商趁勢在今日加碼公佈兩大超值預售票組合──

  「極限量原版電影禮物袋」與「電影珍藏預售票組」，預計將在10月25日（三）中午

  12:00於博客來售票網開賣（

  ），數量有限，請務必把握搶購良機！





  《日暮生死戀》改編自CEO編撰、線上閱讀量超過百萬次的青少年同名小說，透過美麗的

  語言，創造出甜蜜又經典的耽美故事。故事描述帥氣莊園少爺試圖以一場假訂婚來躲避流

  年劫災，只是他的訂婚對象竟然是個美少年，也讓這兩人隨著相處日久生情，卻得同時面

  對縈繞在莊園內的女鬼糾纏。全片在BL情節大灑糖花之餘，更揉合驚悚、靈異情節，讓兩

  位男主角的戀愛之路產生不同以往的考驗，以不同類型混搭全新風貌，成為難得一見的耽

  美影視作品。



  尤其全片觸及BL、懸疑、驚悚、命定，甚至是先婚後愛情節，由曾主演人氣腐劇《甜心派

  》的泰國知名BL劇搭檔「海景CP」李海海、林景雲再度攜手演出，更是兩人的首部大銀幕

  共演作品，並由曾執導《水銀俠》、《愛4狂潮》，以及BL劇《我和我的太陽》的知名導

  演班第通迪（Bhandit Thongdee）執導，讓本片未演先轟動，引發熱烈討論。本片在泰國

  上映後票房不俗，光是上映首日就收穫2.74億泰銖，成為2023年泰國開片首日第四高的作

  品，並空降本土新片票房冠軍，更直奔年度最賣座BL電影，甚至還在泰國Twitter趨勢榜

  空降冠軍，還是全球趨勢榜的第五名，在在證明本片的超高人氣。





  不僅如此，《日暮生死戀》也獲得本屆高雄電影節青睞，成為電影節壓軸的神秘首映電影

  ，票券開賣隨即秒殺，成為人氣熱銷強片之一。本片昨日（10/22）在高雄電影節首映，

  隨即引爆轟動好評。搶先一睹「海景CP」大銀幕談情的觀眾紛紛表示：「跟滿場的大家一

  起姨母笑超歡樂！」「看完真的覺得非常甜！」「終於看到中字版本！能在台灣看到真是

  感動！」「演員的演技，不管是各階級之間的態度、害怕的神情、互相唱反調的反應、甜

  蜜蜜的粉紅泡泡，真的讓人有深入劇情的感覺！」更有許多觀眾直呼等本片在台正式上映

  後，還要繼續二刷、三刷！



  面對粉絲們的熱情呼喚，台灣片商也在今日（10/23）公開兩大超值預售票組合。從泰國

  原裝進口的「極限量原版電影禮物袋」售價520元，內含電影交換券一張、明信片四張、

  電影束口袋一個。此外，「電影珍藏預售票組」售價420元，內含電影交換券兩張、珍藏

  票卡兩張。兩大預售票組合預計將在10月25日（三）中午12:00於博客來售票網開賣（

  ），數量有限，請務必把握搶

  購良機！



  這部由《甜心派》「海景CP」李海海、林景雲首度大銀幕主演的年度BL話題電影《日暮生

  死戀》，即將在11月17日於全台耽美上映。本片劇情描述為了打破算命師口中的流年劫災

  ，並安撫憂心的家人，帥氣莊園少爺帕蓬（李海海飾演） 接受用一場假訂婚來躲避厄運

