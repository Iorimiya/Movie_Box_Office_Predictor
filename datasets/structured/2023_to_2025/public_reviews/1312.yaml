title: '[新聞] 【日暮生死戀】獻肉體磨蹭、濕吻纏綿精彩'
content: '新聞網址：



  泰國年度話題BL電影《日暮生死戀》，即將在11月17日於全台耽美上映。本片由人氣腐劇

  《甜心派》知名BL劇搭檔「海景CP」李海海（Zee）、林景雲（NuNew）再度攜手演出，更

  是兩人的首部大銀幕主演之作，兩人直呼拍電影比拍戲劇難度更高。不過兩人在片中的角

  色「命中注定要相愛」，緣份更從戲裡延伸到戲外，在本片之後，還要共演戲劇《穿越天

  際靠近你》，也讓李海海笑稱這真是「命中注定」。大小銀幕都是CP的兩人，也在各種場

  合大方放閃，當問林景雲要給大銀幕中的李海海，帥氣程度十分滿分打幾分時，他直呼：

  「滿分十分要給他一百分。」李海海也回說：「觀眾會在大銀幕上看到Nunew軟萌的臉龐

  ，我也給他一百分，他的可愛絕對會衝破大銀幕。」此外，由於本片在BL情節之外，也揉

  合驚悚靈異情節，讓兩位男主角的戀愛之路產生不同以往的考驗。當被問到本片有多恐怖

  時，在片中溫柔守護林景雲的李海海，也角色上身妙答：「我認為愛一定可以戰勝恐懼！

  」





  《日暮生死戀》描述帥氣莊園少爺試圖以一場假訂婚來躲避流年劫災，只是他的訂婚對象

  竟然是個美少年，也讓這兩人隨著相處日久生情，卻同時要開始面對縈繞在莊園內的女鬼

  糾纏。這是兩位男主角李海海、林景雲首度主演電影，兩人也直呼電影演出大不易，李海

  海表示：「演電影困難多了，剛開拍的時候，壓力很大，邊演邊努力調整去尋找角色。」

  林景雲也說：「之前演過戲劇，但沒有演過電影，剛開始覺得演電影應該不會有太大差別

  ，但等真正開始表演後，才知道跟自己想得並不一樣。尤其演電影是很細膩的事情，要比

  劇集更加真實。」不過兩人默契十足，尤其林景雲的第一部戲劇跟電影都是跟李海海合作

  ，讓李海海直呼這是「命中注定」，林景雲也說很開心能繼續跟他搭檔演出。



  兩人在本片當中，將上演同床共枕、肉體磨蹭、言語挑逗、公主抱、摸頭殺、濕吻纏綿等

  說不完的精彩情節，當問到林景雲要給大銀幕當中，李海海的帥氣程度十分滿分打幾分時

  ，他直呼：「滿分十分要給他一百分，因為他一直都很帥，看起來氣場很強大，狀態看起

  來也很好。」李海海也回應：「觀眾會在大銀幕中看到Nunew軟萌的臉龐，我也給他一百

  分，他的可愛絕對會衝破大銀幕。」





  不過除了浪漫的BL灑糖愛情之外，《日暮生死戀》也為觀眾獻上BL作品罕見的靈異驚悚橋

  段，安排縈繞在莊園中的女鬼去糾纏他們，讓兩人的愛情備受考驗。談到鬼怪話題，平常

  不看恐怖片的林景雲表示：「因為我怕鬼，現實生活當中，光是聽到奇怪的聲音就會讓我

  感到害怕。」李海海則說：「其實現階段不怕鬼，因為從來沒有遇到過，但如果真的撞見

  ，我應該還是會害怕吧。」當問及本片的恐怖程度有多高時，在片中溫柔守護林景雲的李

  海海則妙答：「我認為愛一定可以戰勝恐懼！」也期望喜愛兩位演員的粉絲們，可以戰勝

  害怕看恐怖片的心情，用愛踴躍進電影院支持兩人主演的這部好作品。



  這部由《甜心派》「海景CP」李海海、林景雲首度大銀幕主演的年度BL話題電影《日暮生

  死戀》，即將在11月17日於全台耽美上映。片商也順勢推出「戲院入場特典」（

  ），只要在上映期間至戲院購買本片電影票

  乙張，第一週（11/17-11/23）即贈「電影限定A5海報（拉威款/帕蓬款）」，第二週（

  11/24-11/30）即贈「電影限定膠捲卡（甜蜜灑糖款/我只要你款）」，恕無法跨週兌換，

  數量有限，送完為止。本片劇情描述為了打破算命師口中的流年劫災，並安撫憂心的家人

  ，帥氣莊園少爺帕蓬（李海海飾演） 接受用一場假訂婚來躲避厄運，只不過他的訂婚對

  象，竟然是個美少年拉威（林景雲飾演）。這段「姻緣」來得突然，一開始互看不順眼的

  兩人，同住在一個屋簷下，相約彼此只在家人面前裝恩愛，其餘時間井水不犯河水。然而

  隨著相處時間越長，少爺竟發現彼此的相伴，原來冥冥之中自有注定，愛慕之情也悄然發

  芽生根。只不過住進莊園的美少年，卻開始被夢境裡的女鬼糾纏，是否他們能守護彼此並

  化解災難呢？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
