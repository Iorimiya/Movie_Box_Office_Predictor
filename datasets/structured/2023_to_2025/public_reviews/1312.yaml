title: '[新聞] 【日暮生死戀】海景CP獨家問候只在正片前'
content: "新聞網址：\n\n\n泰國年度話題BL電影《日暮生死戀》，適逢本片將在本週五（11/17）於全台耽美上映，\n台灣片商也卯足全力宣傳，更千辛萬苦與泰國製作方來回接洽，終於邀請到兩位男主角李\n\
  海海（Zee）、林景雲（NuNew）在百忙之中，抽空錄製全球獨家、獨獻台灣觀眾的「台灣\n上映問候影片」，只限定在台灣上映時，於正片開始前播映。片商也呼籲觀眾務必準時入\n\
  場，觀賞兩人錄製給台灣粉絲的驚喜片段。此外，兩人還為本片獻唱傳情主題曲〈\nSaengrawee（命運）〉，透過綿密的唱腔表達衷情，更不約而同認為本片的「水中戲」讓\n\
  他們印象深刻。尤其這是李海海首度演出水中戲，也因為不太會游泳而感到深具挑戰性。\n不過林景雲反而直呼開心：「因為我喜歡水，也喜歡游泳，所以在劇本中看到有這場景的\n\
  時候，就很開心今天終於可以玩水了！」\n\n\n\n\n《日暮生死戀》由人氣腐劇《甜心派》知名BL劇搭檔「海景CP」李海海（Zee）、林景雲\n（NuNew）再度攜手演出，更是兩人的首部大銀幕主演之作。本片不僅邀請到泰國創作歌\n\
  手納帕特因傑爾（Gun）獻唱片尾曲之一的〈月亮〉，更讓他客串本片，一展演員跨界身\n手。此外，另一首片尾曲〈Saengrawee（命運）〉，也邀請到兩位男主角李海海（Zee）\n\
  、林景雲（NuNew）共同獻唱，一推出就在Twitter全球、泰國、馬來西亞、新加坡等地的\n趨勢榜奪冠，甚至在影音平台吸引超過280萬觀賞人次，也讓李海海表示：「對於大家都\n\
  喜歡這首歌感到開心又興奮，也讓我們著實鬆了一口氣。」尤其本片不只主題曲夯，就連\n本片在泰國正式上映之前，都持續在網路上引發熱議，甚至在全球Twitter上成為熱門話\n\
  題，未演先轟動，更在上映後成為今年泰國開片首日第四高的作品，並空降本土新片票房\n冠軍，更是年度最賣座BL電影。\n\n\n尤其本片劇情元素豐富，不只有浪漫唯美的BL情節，更有靈異甚至是懸疑元素，主演之一\n\
  的林景雲，光在預告當中就有落水、鬼附身、翻白眼等情節，角色表現難度極高，他對此\n透露：「開拍之前有一個研討會，我也把劇本讀了好幾遍。我知道在片中會撞鬼，就去看\n\
  看其他電影，當人被附身或撞鬼時，究竟會發生什麼事？而在演出之前，我也會詢問表演\n指導跟導演想要什麼樣的表現風格。劇情其實還有更多驚喜，等待大家進戲院發現。」對\n\
  於預告中有一幕他翻白眼的橋段，也讓林景雲笑稱：「這一定會被大家做成表情包吧？！\n」他進一步補充：「那場戲在讀劇本的時候，就覺得很難表演，因為沒有演過，但還好當\n\
  時拍攝一切順利，而我也已經全力以赴了。」導演班第通迪（Bhandit Thongdee）起初甚\n至認為他沒辦法做到：「因為他是擁有可愛臉龐的人，一開始以為他無法做到如此多的表\n\
  演，但最後他做到了，而且他對一切都很有決心。」\n\n\n\n\n不只如此，李海海與林景雲在《日暮生死戀》也有許多跟「水」相關的情節，兩人不僅要\n在湖畔浪漫划船談情，李海海更將在另一幕戲裡，跳入水中搶救落水的林景雲。尤其划船\n\
  戲讓兩人非常緊張，李海海透露：「第一次坐那種船就覺得很可怕，雖然當時有救生員待\n命，但這艘小船的船板很薄，在湖面上又晃來晃去，我就緊繃著身體坐著，想說如果翻船\n\
  了，救生員應該來不及救我們。」其實李海海的擔憂其來有自，主要因為他不太擅長游泳\n，以至於在拍另一幕落水戲時，也讓他直呼辛苦：「這是我第一次拍水中戲，我不是很會\n\
  游泳，而且還要在水裡睜著眼睛，對我來說充滿挑戰性。」不過這幕戲對林景雲反而輕鬆\n：「我喜歡水中的場景，當我在水中的時候，我覺得這並不困難，因為我喜歡水，也喜歡\n\
  游泳，所以在劇本中看到有這場景的時候，就很開心今天終於可以玩水了！」\n\n\n這部由《甜心派》「海景CP」李海海、林景雲首度大銀幕主演的年度BL話題電影《日暮生\n\
  死戀》，即將在本週五（11/17）於全台耽美上映。除了正片前將播放的男主角驚喜問候\n短片之外，片商也順勢推出「戲院入場特典」（\n），只要在上映期間至戲院購買本片電影票\n\
  乙張，第一週（11/17-11/23）即贈「電影限定A5海報（拉威款/帕蓬款）」，第二週（\n11/24-11/30）即贈「電影限定膠捲卡（甜蜜灑糖款/我只要你款）」，恕無法跨週兌換，\n\
  數量有限，送完為止。本片劇情描述為了打破算命師口中的流年劫災，並安撫憂心的家人\n，帥氣莊園少爺帕蓬（李海海飾演） 接受用一場假訂婚來躲避厄運，只不過他的訂婚對\n\
  象，竟然是個美少年拉威（林景雲飾演）。這段「姻緣」來得突然，一開始互看不順眼的\n兩人，同住在一個屋簷下，相約彼此只在家人面前裝恩愛，其餘時間井水不犯河水。然而\n\
  隨著相處時間越長，少爺竟發現彼此的相伴，原來冥冥之中自有注定，愛慕之情也悄然發\n芽生根。只不過住進莊園的美少年，卻開始被夢境裡的女鬼糾纏，是否他們能守護彼此並\n\
  化解災難呢？\n\n\n欲知本片最新消息，\n請上電影官方臉書粉絲團\n與Instagram專頁查詢。\n\n\n--\n                  \
  \                11/15 10:19"
