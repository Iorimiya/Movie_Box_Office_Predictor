url: https://www.ptt.cc/bbs/movie/M.1499355123.A.B03.html
title: '[討論] 關於《明月幾時有》的小小心得'
content: '開頭先開宗明義的說

  我真的超愛許鞍華的 ！！

  電影一開始本以為會走過去黃金時代的戲路或是另一種形式的精神延續


  隨著劇情的鋪陳

  加上許導卓越的敘事能力

  搭配選角們精湛到位的演技

  扎扎實實地演活了這齣戲（葉德嫻真的超棒！！）

  會發現儘管劇情同以對日抗戰的大時代為背景

  導演透過電影所要表達的內涵卻是截然不同的


  黃金時代 它是以人，也就是蕭紅她的生平與周圍男性的情愛作陪襯去設射整個戰亂時代

  的巔沛與人性的多元面貌，越是難堪的處境越能襯托蕭紅其人的不凡。

  視角是由個人到大環境；再從大環境反映出其人的傳奇性。


  明月幾時有 則告訴了我們

  當家國不在 包含你我在內的每一個人

  都只是敵人眼裡一隻微小的螻蟻

  我要你生 你就生 我賜你死 你卻不得不死

  覆巢之下無完卵


  一開始 方蘭只是位老師 是個承平時期稍有地位的職業

  然而無情的戰亂

  讓她所景仰的一代文豪茅盾必須漂洋過海地離開香港

  也讓她從此變成了什麼也不是


  既然已經沒有什麼能失去的

  那就沒什麼好怕了 不是嗎？

  此時 反倒會激起奮力一搏的企圖心

  試圖衝撞這個由外人佔據的體制


  當然 身為一介知識份子的她 因著以國家興亡為己任的心態 毅然決然投入了抗日游擊隊

  的陣營



  等等 那他仰慕的茅盾先生呢？？

  （對 他逃走了 跟著一票文人離開了）


  方蘭本來是為了救他離開 才會跟游擊隊搭上線


  現在茅盾、梁漱溟等享譽當代、聲名遠播的文人

  遇到戰亂不是留下來凝聚反抗的力量，一起對抗日軍

  反倒是靠著游擊隊的幫助 離開戰亂之地苟且偷生


  而留下來

  用肉身對抗日軍無情槍砲的

  卻是一群市井小民

  敘事中的他們  比那些外界號稱的大文豪要來得堅毅 勇敢多了


  想來還真是格外諷刺


  面對日軍 他們沒有逃避

  抱著必死 明知不可而為之的決心

  去做他們認為對的事情


  談到故事中最讓人驚心動魄的一幕是

  葉德嫻所飾的方母被槍決前的那一段


  她

  直到臨終前 她心心念念所想的都是

  「絕不能拖累任何人」


  你說死 她怕不怕

  當然怕啊 有人會不怕死嗎？

  可是她卻一次又一次幫女兒運送東西

  那是因為在她的心中

  有比死更重要的價值

  （她覺得幫助這個國家她也有責任）

  她可以死 但不可以死的沒有價值


  此外 在她知道女兒從事反共工作時

  只是出於擔心女兒安危念了她兩句

  完全沒有阻止她


  一來是因為她知道女兒的個性 無論她同不同意 她還是會去做


  其次是 她也認為女兒要做的事並沒有錯

  哪有阻止她的道理


  有時人做抉擇就是這樣，一但做了就難再回頭了


  雖然方蘭的媽死了 但「不想拖累任何人」的那份善良對照日人殘忍的槍殺了她形成一種

  強烈的對比


  最後的最後 不得不說這部戲隱約有點在歌頌共軍的味道XD


  它與黃金時代的共通點在於文人這個引子，刻劃出文人在危難時刻顯露出的醜陋人性，文

  采飛揚的他們，一遇到危險也只是會落跑而已。




  --'
