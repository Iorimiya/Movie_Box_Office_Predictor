title: '[好雷]明月幾時有：我們都身不由己'
content: "標題那句話是我看完的最大感想\n\n就如電影中彭于晏說的：「現在這個時候，理髮的沒了剃刀，\n炒菜的把鍋子摔破了。」人人身不由己。\n\n因為身不由己，所以方蘭不去救基本是她世上唯一的親人，任她母親\n\
  被拷問致死\n因為身不由己，所以李錦榮被迫假裝投敵，暗地裡輸送情報\n到最後事情敗露，甚至丟了性命\n因為身不由己，所以連十六七歲的小孩，都當了少年隊\n因為身不由己，所以米都灑不了\n\
  因為身不由己，所以連媒婆都差點找不到\n\n在那個年代，有多少人能做自己想要的事？\n\n我一直很喜歡周迅，我覺得她很適合演這樣聰明的角色\n比如許久以前的林徽音，到後來的黃蓉都是\n\
  \n這次演的角色也是這樣，聰明可愛\n也有那種「不自由，毋寧死」的拼勁，我更喜歡了XD\n她要加入東江縱隊時，母親怎麼樣都勸不回的那段\n更讓我想起了那句話\n\
  「誰能阻止得了 少年武士赴死呢？ 他們聽不到啊！」\n\n她的母親葉德嫻，我對她最大的印象真的是與龍共舞(掩面)\n桃姐到現在還沒完整看完，不過演技當然沒話說\n\
  \n兩人對手戲許多\n讓我好幾次差點在影廳裡面哭出來，幸好是早上去，只有我一個人\n特別是那段\n葉德嫻追出去，送金戒子跟傘給周迅餞行的\n一切盡在不言中，我真是拼了命才把眼淚忍住\n\
  \n另外就是李錦榮了\n作為一個學中文的，看到那幾句七秒詩的時候真的忍不住吐了兩句XD\n「請問先生，這是哪個調啊？又是哪門子的樂府詩啊？」\n不過如果是我在那種壓力下，估計也想不到什麼東西吧\n\
  然後，能夠在那樣的時候，忍辱負重，投入日本陣營而傳送情報\n這要多大的勇氣？\n還有他跟周迅的互動，那真是最純潔的愛情\n說實在，如果可以，他跟周迅可以一直在一起有多好？\n\
  \n最後，看到幕後名單才發現，這部片的音樂是杜篤之跟久石讓\n中日兩大神主牌，難怪那麼好聽\n\n--\n\"There is always some kid\
  \ who may be seeing me for the first or last\n time. I owe him my best.\"\n -Joe\
  \ DiMaggio\n\n--\n其實以這樣的電影來說，並不算慢"
