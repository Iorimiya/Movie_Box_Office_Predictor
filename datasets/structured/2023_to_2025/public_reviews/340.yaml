url: https://www.ptt.cc/bbs/movie/M.1500034201.A.6E5.html
title: '[好雷] 明月幾時有-小人物的生離死別'
content: '戰亂時，有一群人保持低調，一群人變節求榮，更有一群人甘願冒著生命危險，在底層維

  護著基本尊嚴而努力著。故事主要着墨於第三種人，他們沒什麼豐功偉業，但卻默默從事

  著幕後不起眼卻是行動得以成功的基礎；本來可以完全不關他們的事情，但生命卻給他們

  必須加入的理由，無論什麼，皆有所犧牲，有所放下。這般庶民力量與各自私人情感交織

  出，不需要波瀾壯闊的戰爭場面，卻仍蕩氣迴腸的感人故事。這是明月幾時有。









  (底下有雷)










  以一場解救文人的活動起手，將故事幾個重要的人物介紹出場，乾淨俐落地呈現人物

  關係，同時烘托出主角方姑與母親兩人從來不在反抗活動的計畫裡面，只是陰錯陽差，

  只是茅盾先生剛好向她們租屋，便得留名青史，且高招的是，藉著這幾場戲的幾個對談，

  將她們平素舉止寫進來，不僅將人物立體，且加入活動前後的些微反差感，營造出被順水

  推舟踏上了革命之船，卻仍勇於面對命運的狀態。




  於是看似一連串反抗行動建構出這部電影，彷彿說到最後革命終有結局，愛國終能如願，

  但實際上導演不過在說著以方姑為首的小人物，為了生活，為了所愛，所尊敬的人，這些

  絕對稱不上如為了國家此般冠冕堂皇的理由，說不定還帶點私心，而孜孜矻矻地，以他們

  可以做到的捍衛著家園。即使如劉黑仔的某幾個角色，並沒有特別提及其背景，但透過劇

  情裡對他們的刻畫，似乎也感受到一股篤定的力量，當和反抗日軍行動有關時。




  鄭家彬是讓核心靈魂昇華的人。這部電影並非單純平舖直述著當時的抗爭過程，而是藉由

  類紀錄片的訪談方式，以鄭家彬的遙想過去串場，觀影者直到中段才察覺鄭在其中所扮演

  的角色，而他對方老師的思念之情，感念其在抗爭期間的照顧，實在令人動容。那不僅僅

  是意識型態的傳承，一如茅盾先生與方姑之間的關係，尚有夥伴間感情的深刻羈絆。就算

  是為了自己也罷，更多是希望一起生活的各位，尤其是下一代，能過上好的生活，相對於

  那些為了賞金的背叛者，並和方姑母親照顧自己的女兒，照顧女兒夥伴的態度互通聲氣。




  不過感情得以烘托，來自於形勢危險的表現，方能淬鍊出其中真摯。故事以劉黑仔的周遭

  與李錦榮的周遭互文，一在明，一在暗，相互輝映。一場劉黑仔與夥伴運送軍火的戲碼，

  一場李錦榮與日本軍官荒謬的七步成詩......諜對諜的危險性，步履鋼索的千鈞一髮，觀

  者不禁想要為他們捏把冷汗，但時機不一定老是扮演好人，有時反倒是從事掠奪的流氓，

  生離死別就這樣躍然眼前。是保有一定決心赴死的，但真要面對真實情感時，仍令人肝腸

  寸斷，如方姑與其母親的天人永隔，如錦榮和信任他軍官的曖昧對質，驀然回首連開場沒

  多久的方姑和錦榮的分別也瀰漫著殊途同歸的遺憾氛圍。




  若以諜報電影的角度來看，故事裡所描繪的部分行動實在有點笨拙及魯莽，不過導演就是

  想表現一般庶民的粗糙，呈現出他們在面對生命變化時，因著自己的情感而產生的舉動，

  那是種區域型自成一格的生存活力，當政府無力阻止敵人入侵之時。此概念於劉黑仔被調

  離時和方姑話別，方姑特別提及其真實姓名的環節時，揮散達極致，連結至最後一幕，老

  年鄭家彬受訪結束後，開著自己的計程車，沒入香港的車水馬龍，色調從黑白轉彩色的場

  景，或許既有將自身經歷讓香港人耳濡目染之外，可能還隱含導演對香港此地方的政治意

  識也說不定。



  歡迎光臨:



  --'
