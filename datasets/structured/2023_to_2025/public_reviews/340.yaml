url: https://www.ptt.cc/bbs/movie/M.1500299556.A.37C.html
title: '[好雷]《明月幾時有》——文人氣息的戰爭片 '
content: '圖文連結：



  《明月幾時有》——文人氣息的戰爭片該是什麼型態



  繼《黃金時代》後為民國文人作傳，許鞍華再度選擇以1940年代在香港抗日的東江游擊隊為題材，這回的目光轉向非常時期的小人物身上。縱然因題材選擇不免被認為是向中國當局靠攏的主旋律片，但許鞍華畢竟是許鞍華，一貫的節制與從容，讓電影聚焦在底層人物在極端環境下的生活與搏鬥，像是一卷緩緩舒展開的長軸，繪製出一個明明不遙遠卻被徹底遺忘的時代。


  《明月幾時有》在中國的宣傳上出了點差池，也跟出品方博納影業有關。近年來博納影業推出的作品無論《智取威虎山》或是《湄公河行動》，皆屬結合商業價值與英雄美學下的主旋律片，因此在宣傳上，不免強調著這是「血性十足的許鞍華」，使懷此心情進影聽的人不免帶著疑惑走出來。


  許鞍華的好，肯定是好在她那乍看鬆散的敘事上。明明是演戰爭時期的游擊隊，中間鏡頭一轉卻跑去拍平民婚禮，但這婚禮戲卻拍的閃閃發亮，一來一往間，用「戰爭時期到底該不該結婚」與「拮据時期到底該不該遵循禮俗」兩個女人間的話題，充分展現出時代的艱難與角色的價值觀。


  周迅飾演的女主角方蘭，個性灑落，對事物的選擇與眾不同。大家都躲，她偏偏探頭；發傳單遇到盤查，反倒是軍人比她緊張。這種氣質的確挺適合周迅來扮演，但偏偏也是這樣的角色特性，使得方蘭下的每個決定都有點隱晦，我們並沒有辦法明確理解為何她突然就被說服加入游擊隊，是和彭于晏共食眉豆茶粿的情愫？或是在帶茅盾逃難時產生的英雄情結？難以明瞭。


  不過有些細小的地方很精彩，舉凡在碼頭送別文人後，背著斜陽轉身慢慢走離；還有決定顧全大局、放棄營救母親後，她走在密林中的小道，蹲下在地上低低的哭，鏡頭很遠很遠，都是明白再也不會見面了的別離，一個惆悵一個慘痛，情感十分節制卻又真實。


  相較之下，葉德嫻演的方母便好的讓人在最後挖墳的片段流淚不止。她的角色十分立體，拿糕點勸誘房客勿走時，拿出三個後斟酌一番又放一個回去，勸說失敗優雅地又把餅拿了回來，這種小氣讓人不免回想起《桃姐》開頭那段市場買菜的戲；然而在婚禮中，她卻不顧生活刻苦，堅持要遵守禮俗，這種矛盾但又真實的樣貌，實在是某種通俗母親的樣貌。


  因此，葉德嫻對於女兒的選擇，縱然一開始諸多埋怨，但最後為了分擔操勞，決定自己上前去送情報的轉折，更是讓人打從心裡的認同。也成為本片中最亮眼的角色。


  片中的腳步聲作為角色烘托的一環，更是格外讓人心折。葉德嫻揣著木頭拖鞋，噠噠的腳步聲總是響亮急促；周迅的腳步聲自信而穩定，無論走在碼頭或是木橋上，總是那個沈穩的周公子，唯有夜奔救母那段她匆匆的步伐聲才首次響起；蔣雯麗飾演的茅盾夫人，逃難時跟鞋跑在石板地上，明明急迫時刻，腳步卻邁不開似的，總有部分拖在地上；同樣是石板地，周迅和王菀之發完傳單後的腳步便是少女般的雀躍，雖然因為怕驚擾人所以聲音不大，但落下的聲響卻又像在跳。


  側面烘托的技法不只是人，許鞍華以細筆寫人、疏筆畫景，當文人躲在漁船逃難時，遠遠的拍起來卻是「野渡無人舟自橫」的浪漫。文人終於成功脫逃時，鏡頭卻拍著空空的密林，只讓歌頌勝利的軍歌填補電影。方伯母被槍斃後，她不拍方蘭的反應，反而拍著方家天臺上種來當備用食品的南瓜，和將落未落的夜色。這類手法，恰似中國水墨中強調的留白，看似鬆散，其實是為了累積情緒的鋪排，更能明白理解為何許鞍華被稱作文人導演，而這位文人導演也選擇以自己獨特的方式，去拍出一個與眾不同的戰爭電影。


  《明月幾時有》的確讓我們看見一個截然不同的許鞍華，然而在命題選材上所引起的爭議，甚至有點大過了電影本身。但是這樣的爭論在一次次的書寫與對話後，反倒能夠激盪出一番火花，也是電影之外的ㄧ番趣味。



  --'
