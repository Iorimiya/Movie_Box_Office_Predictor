url: https://www.ptt.cc/bbs/movie/M.1511627589.A.FA0.html
title: '[新聞] 相愛相親、明月幾時有大熱倒灶0獎項'
content: '【金馬獎2017】《相愛相親》、《明月幾時有》大熱倒灶 0 獎項


  撰文： 羅偉強


  發佈日期：2017-11-26 00:13


  最後更新日期：2017-11-26 00:13


  今年金馬獎的競爭一如以往地激烈，其中兩套合拍片《相愛相親》、《明月幾時有》事前

  均被視為大熱之選，分別獲提名6項及5項。然而，最後卻事與願違，兩套戲均大熱倒灶，

  並未獲得任何獎項。


  《相愛相親》今年有「最佳劇情片」、「最佳導演」、「最佳女主角」、「最佳女配角」

  、「最佳原著劇本」、「最佳原創電影歌曲獎」共6項提名。而《明月幾時有》則有「「

  最佳導演」、「最佳男配角」、「最佳女配角」、「最佳剪輯」及「最佳原創音樂」共5

  項提名。而事前，《相愛相親》張艾嘉被視為金馬影后的大熱之選，事關她自1986年後，

  連同今次提名共6次均失落。縱使張姐在《相愛相親》內的表演均被影評人盛讚，大家都

  認為她總可突破這31年來的缺口，多獲一次獎。另外，憑同一片獲提名「最佳女配角」的

  吳彥姝呼聲亦非常高，可惜亦敗給14歲的小妹妹文淇《血觀音》。


  許鞍華導演的《明月幾時有》本來呼聲也高，加上許導一直都是金馬常客，亦是目前為止

  ，獲獎次數最高的導演之一，所以外界不少人均看好她今年會再一下城。而女配角Deanie

  姐葉德嫻在戲中比主角周迅更亮眼搶鏡的表現，亦甚受人所讚譽。原創音樂更找來日本配

  樂大師久石讓主理。可惜這些獎項通通與自己擦身而過。今年最慘烈的兩套電影莫過於《

  相愛相親》及《明月幾時有》。


  相對之下，獲得5項獎項的《大佛普拉斯》以及獲得「最佳女主角」、「最佳女配角」及

  「最佳劇情片」三項大獎的《血觀音》，就成為了本屆大贏家。不過這兩套電影都是台灣

  本土電影，到底是否因《相愛相親》以及《明月幾時有》皆為合拍片而被看低一線呢？當

  中又有沒有本土意識在內呢？真的無從稽考。




  --'
