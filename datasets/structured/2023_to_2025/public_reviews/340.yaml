title: '[討論] 明月幾時有'
content: '看完本片, 心得就是蠻平舖直述的真人真事改編

  不過, 有幾個問題想請教大家或者討論



  想問一下, 片中那個跟日本人講英文的女生是何時被方媽牽連進來的?(查了一下她叫春夏)

  有點看不明白, 因為死前方媽說的那句話

  還是只是她一直覺得不管怎樣都不要拖累別人



  感情舖陳方面, 一開始以為霍是拋棄感情的人, 但其實他也是做抗日工作的

  而且後來方姑也是知道的, 但最後方和黑仔還是隱約有情愫在

  即然愛人還是一個愛國的熱血青年, 感情應該就不會變

  中間春夏也是主動向霍表達了一點情愫, 但霍拒絕了

  還是只是想表達戰爭時的感情都是稍縱即逝(英倫情人觀後感)



  結尾有點突兀也缺乏爆點, 美中不足



  這部片一開始只看到三個年輕主角的名字 周迅 彭于晏 霍建華

  和入圍的葉德嫻 梁家輝 許鞍華完全連不在一塊

  整部片梁家輝真的是最亮眼的 雖然很多人覺得他只是引言人

  但他真的就像民間口述歷史的見證人 完全不像演的

  反而是得獎常客葉德嫻 覺得她有時眼神太銳利

  不太像一個不識字 只是擔心女兒的鄉下媽

  僅管編劇在角色自私.貪小便宜個性上著墨不少

  租客不租房收回的糕餅 女兒當中隊長拿回的一袋米福利



  爬文看大家覺得霍建華演技不好 但我反而且覺得這個角色他還不錯

  相比彭于晏 我覺得彭把這個角色演得太輕鬆俏皮了

  雖然也許像他說的他進入抗日工作隊就沒想活著出去

  所以他可以輕鬆 但畢竟戰爭就是戰爭

  相對的 霍建華就有演出緊繃感

  也許他需要埋伏在日本人身邊 他的眼神表情都需要特別去針酌

  然後需要時他也有演出痞的那一面

  最後 在商量要犧牲方媽時 是周迅和彭于晏演得最好的一段



  王菀之的部份 不知是演技還是聲音的問題 我一直很想問她是不是有點笨笨的?

  然後帶出的問題就是吸收了有志之士 卻都沒有好好訓練

  全是憑著一腔熱血去送死 一個好心做壞事 全得送命

  不管是柔弱的方蘭 單純的阿四 只是小孩的阿彬 不識字的方媽

  全是讓日本人難以懷疑的身份

  這些在抗日戰爭不幸犧牲的人們 讓人不勝稀噓



  許鞍華想說的還是香港的未來吧

  如果每個人都只是想著自己 香港就永遠只是現在的香港



  --'
