url: https://www.ptt.cc/bbs/movie/M.1510671098.A.5EB.html
title: '[好雷] 明月幾時有-大時代中的小人物'
content: '這部片其實在上映時就有注意到，但好像沒多久就下檔了！？

  一直到這次金馬入圍名單公佈

  看到葉德嫻跟梁家輝都入圍，才在myvideo找來看完


  故事主軸雖然是講述香港在抗日時，地下小人物的拯救文化人運動

  但整部電影卻沒有什麼戰爭或衝突的大場面

  取而代之的是很多細節

  每一處都可以看到戰爭對百姓的殘酷

  所以仍然能感受到，在日軍高壓統治下的那種緊張氛圍


  一直都很喜歡周迅，喜歡她演這種聰明、堅毅的角色

  她演的方蘭，對於事物都有不同的選擇跟見解

  也有偉大的情操跟拼勁，一旦決定加入東江縱隊，便不回頭

  而雖然男女情愛完全不是這部戲的重點

  但芳蘭跟李錦榮、黑仔的互動依然很引人注目


  彭于晏演的劉黑仔，不甘於現狀、不向命運低頭

  且身手過人、性格灑脫，這種充滿英雄氣概的角色真的很適合彭XD


  最喜歡的就是葉德嫻，展現出母愛的偉大

  雖然不願女兒冒生命危險，但還是願意默默的支持、幫助方蘭

  最後方媽被捕、被拷問、最後被槍殺那段，眼淚真的再也止不住了……


  梁家輝也是一大亮點，角色樸素但意外驚豔，演技真的超強！


  整部片意境很深，演員表現也都在水準之上，真的值得一看！


  --'
