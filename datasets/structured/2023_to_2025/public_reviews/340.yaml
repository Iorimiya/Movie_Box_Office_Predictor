url: https://www.ptt.cc/bbs/movie/M.1500478745.A.20E.html
title: '[好雷] 明月幾時有  (賞香港的一記耳光)'
content: "原本想把雷往後面擺的，結果發現這樣太難寫了，只好摻著寫些\n然後另一個重點『政治』，沒有政治立場的話，「明月」只是普片\n不是要你現在用多憤慨的態度去看待以前的國仇家恨，而是踏著不會消失的歷史\n\
  我們能從中學到什麼，來對應目前我們遇到的困境嗎？\n還是只當飛鴻雪泥，等看電影節金馬獎的評比完，就該消失？\n\n本片時代背景是經濟拮据，民生凋敝的香港日佔時期\n\
  (\n\n一般顛沛時代的劇，少不了男女主角的愛情來為戲增色，然而在「明月」裡\n在國仇家難之下，愛情，甚至連湯裡的蔥花都不是...\n反倒像鹽，只是幫苦澀提了味，看不見也摸不著\n\
  \n片子開頭「拯救文化人」的任務都還沒開始，愛情戲就嘎然落幕了\n然而觀眾情緒還沒到位，還沒覺得惆悵，反倒是劉黑仔很搶戲的表現\n早早的宣示了自己是諜報動作片的最佳男主角\n\
  感情線只有多年後，壓抑萬語千言的一個匆匆擁抱\n\n整部片的軸心是抗日的地下運動，但卻只有文宣發送，情報交換，\n根本沒有跟日本人起衝突，或是攔截物資的情節，但這些真的都沒有發生嗎？\n\
  方媽一開始跟房客的錙銖必較，為了吃肉腦筋動到寵物兔身上，\n反對女兒從事地下活動之後，卻似乎在這困頓的年代少了一些柴米油鹽的擔憂\n更甚至，連金首飾都投資進去了...這蛛絲馬跡應該不代表抗日沒甜頭吧？\n\
  \n之所以沒有那些情節，我猜是導演也並沒有想要藉此宣揚對立對抗，\n反而是想宣揚\n『少我一個不少，多我一個不多，但如果人人都這樣想，勝利就更遠了』\n這種默默對抗強權的全民意識，堅持忍耐到勝利的那天\n\
  \n\n\n\n========政治線，以下僅代表個人的政治解讀，請自行斟酌閱讀=========\n\n\n\n\n\n\n\n\n\n再回來談談片頭的『拯救文化人』，其實這部分演的與史實有些出入\n\
  (  但在戲裡，我只直覺地想到現在的香港特首選舉\n\n香港特首選舉，由一千二百人組成的選舉委員會選出，\n選完再由中華人民共和國國務院總理簽署國務院令任命。\n\
  然後大家對這千餘位代表，心服口服嗎？\n\n像方蘭一開始仰慕茅盾先生的文采，但在這種抗戰年代\n『不知到什麼地方去過一次的風，忽然又回來了；這回是打著鼓似的：\n\
  勃侖侖， 勃侖侖！不，不單是風，有雷！風挾著雷聲！』\n這種作家是值得「還沒見面就殺人」來拯救的，你，心服嗎？\n\n然後眼睜睜看著偶像逃離，自己卻讓兩個糕餅收買成游擊隊，\n\
  而且第一次出任務，在文宣被攔下來的時候還是一臉雀躍？\n\n關於這段我真的完全沒辦法想像，所以我回來認真地挖了一下史實\n\n首先，這個拯救文化人的行動，是共產黨主辦的，救的我猜八成也是共黨人\n\
  片中文化人的名字，我記得不多，但除了鄒韜奮 1944年病逝\n梁漱溟比較風骨，1946年退出中國民主同盟，專注於講學和著述，\n此前比較像是國共之外的第三勢力。\n\
  \n茅盾這個人就很共黨了，1949-1965擔任文化部部長，1949-1981擔任中國作家協會主席。\nwiki茅盾：茅盾無疑仍是現代中國最偉大的共產作家\n\
  wiki代表作『子夜』：這是中國第一部寫實主義的成功的長篇小說\n農村三部曲之三『殘冬』：對通過勞動來改善生活不再抱有幻想，\n於是趁夜繳了三甲聯合隊的槍枝，走向了武裝鬥爭的道路。這夠『紅』了吧？\n\
  \n\n之所以會有營救行動，是因為當時這些文人撤到香港之後，\n香港出現一股蔚為大觀的文化風潮：范長江辦了《華商報》，\n鄒韜奮、茅盾、夏衍編輯了《大衆生活》，\n\
  喬冠華、鄭一聲主持了“香港中國通訊社”……他們繼續着抗日討頑的輿論戰。\n\n好！來....好樣的，讓我套句當代的語言來詮釋這件事情\n\n你大費周章的拯救了一批網軍寫手，而這些人在路途中得到粉絲的大力協助\n\
  然後你告訴我這個粉絲喜歡的是那些描寫『毛小孩』那種無關痛癢的廢文？\n(不知到什麼地方去過一次的風...  摘自茅盾 1934『黃昏』\n  )\n\n\n這茅盾實在描寫得好矛盾，這看似歌頌共產黨成功營救文化人的行動\n\
  又將上映選在最爭議的7/1香港回歸日，可是裡面對共黨的描述卻趨近於零，\n沒去挖根本在片中看不到任何蛛絲馬跡，片中只有塞滿了，愛國港人在權威之下的掙扎\n\n\
  所以我才要說這是賞給香港的一記耳光，刻意在共黨的勝利中，抹去共黨的痕跡，\n彷彿暗示著香港的現況，很隱諱的暗示要爭取真普選\n\n『少我一個不少，多我一個不多，但如果人人都這樣想，勝利就更遠了』\n\
  \n\n\n\n另外我還覺得矛盾，是找了久石讓來為這部抗日電影做配樂\n片段不多，也確實很悲壯的烘托出片中的情緒，但卻讓我好『出戲』\n因為我覺得好日式，典型的日本電影style，出現在抗日電影裡我真的好難理解\n\
  更難理解為什麼這日本人會接下這個案子\n\n--"
