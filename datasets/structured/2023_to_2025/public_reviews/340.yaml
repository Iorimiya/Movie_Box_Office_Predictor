url: https://www.ptt.cc/bbs/movie/M.1498659738.A.FBB.html
title: '[新聞] 周迅拍明月幾時有 聽見霍建華胸口聲音'
content: '（中央社記者江佩凌台北28日電）導演許鞍華新片「明月幾時有」昨天在北京舉行上映記

  者會，主角周迅、霍建華出席，周迅回憶與霍建華拍攝一場久別重逢的戲，兩人抱在一起

  時還能聽到彼此胸口的聲音。


  「明月幾時有」昨天在北京舉行上映記者會，主演的周迅、霍建華，以及導演許鞍華、編

  劇何冀平等人一同出席活動，無法從劇組抽身的彭于晏，由許鞍華代他多聊電影在武打戲

  上的嘗試。


  周迅日前錯失上海電影節影后，電影出品人于冬在記者會上為她抱不平，甚至直接對周迅

  說「對不起，周迅」，周迅倒是大方回應，「多少有些遺憾，得獎是非常主觀的事情，希

  望上映之後大家能喜歡。」


  戲中與周迅是青梅竹馬的霍建華由於較晚加入劇組，加上與許鞍華、周迅的合作，又是大

  銀幕演出，令霍建華非常緊張，但許鞍華表示，特別運用他剛到劇組的緊張感，帶到兩人

  第一場戲裡與周迅談分手，「我喜歡演員在戲裡面表達真正的自己與情緒」。


  霍建華回憶他與周迅第二場戲是久別重逢，兩人沒有什麼台詞，在小碼頭邊彼此見面後直

  接抱在一起。周迅還補充，這場戲連天氣都特別入戲，兩人抱在一起時還能聽到彼此胸口

  的聲音。


  許鞍華還提到，雖然彭于晏動作戲份了得，但他一場與周迅一刀未剪的戲，卻令許鞍華印

  象深刻。該場長達數分鐘一鏡到底的鏡頭，原本許鞍華還有些擔心，沒料到出來的效果非

  常好。


  「明月幾時有」將於7月7日全台上映。


  新聞網址：


  --'
