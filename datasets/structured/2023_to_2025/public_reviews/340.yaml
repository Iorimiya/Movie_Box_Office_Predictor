title: '[好雷] 明月幾時有，建華演攏無'
content: '有雷




  欸…為什麼臺灣進國語版…明明有粵語的拷貝，這是香港故事，本土角色講粵語才有醍醐

  味惹


  比黃金時代成功。主題明確，拍香港抗日。是說其實許導借主旋律題目，做想拍的香港歷

  史吧。群戲好，刻畫用心，人物戲少也能建立。絕對不是那種請明星來當擺設，演些不相

  關的，結果搞得角色沒意義。



  群戲唯一的缺陷就是霍建華。誰cue他一下啦，告訴他在裡面有多尷尬。他還是拍電視劇

  賺錢吧。他那被電視嚴重定型的表演，在大銀幕太尷尬了。連帶害他和永瀨正敏的戲就垮

  掉。

  是說那首歪詩？是唬爛日本人的嘛www



  彭于晏在特定戲路完成度ok。許鞍華放對他演劉黑仔，身手矯健，說得上心狠手辣，敢在

  滿室漢奸殺大頭。假辦喪事遇攔也是立馬殺死對方。輕鬆的一句「我們很快就見面了啊」

  ，他覺得自己隨時要死，所以怎樣幹一票都可以。但很諷刺，他竟然活過了抗日戰爭。卻

  在

  廣東死於接下來的國共內戰。27歲，這段電影沒演，應該是在主旋律中太不正向了



  周迅比較普通。跟湯唯在黃金時代發揮度差很大。最棒的還是演方母的葉德嫻啊啊啊！一

  定入圍今年金馬影后！


  小氣有小聰明的媽媽，人物鮮活。為女兒才參加了抗日地下活動。是說，她至死也不懂到

  底那些是啥。就想幫女兒，最後也是因為想順便去見女兒而被捕…


  當初方蘭要去參加游擊隊。她說妳那麼沒用，死不要緊，不要連累隊友啊，不要去啦不要

  去啦。這搞笑臺詞最後對應到方母被捕。讓我飆淚…


  用很多香港演員串場。認人大賽。老中青都有。吳岱融這種消失好久的都有（上次看到他

  好像是原振俠…）呂良偉隊長，李燦森漢奸，唐寧結婚表姐，鮑起靜阿姨，苑瓊丹媒婆等

  等等等。還有馮粹帆演村長！沒想到竟然出賣主角。牛頭帆！你竟然！！！盧巧音演沒名

  字的臥底職員。一場戲，比霍建華還好。


  梁家輝演游擊隊小孩的老年。後來做了計程車司機，蠻樸素的好演出



  --'
