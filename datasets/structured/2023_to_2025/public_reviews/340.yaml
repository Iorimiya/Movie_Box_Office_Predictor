title: '[台北電影節] 明月幾時有Our Time Will Come'
content: '心得






  無雷





  ***

  即將上映的許鞍華新片《明月幾時有》，有周迅、葉德嫻（其他的演員彭于晏、霍建華、

  郭濤、黃志忠、蔣雯麗、梁家輝、王菀之、呂良偉、鮑起靜、春夏等人也都是兩岸三地的

  一時之選），配樂好像還請到久石讓，陣容很強（光是這個陣容就值得一看）。


  電影可以說是別出心裁的傳記片，拍起來沒有那種歌功頌德的詭異感覺，從一個時代、一

  個地方、一個人三個面去呈現「方蘭」這位傳奇女性。雖然講述的是挺困難悲劇的一個時

  代，成果卻意外頗具娛樂性。穿插著梁家輝演出「偽紀錄片」與最後代入現代香港的畫面

  ，整部片定調不在於「還原歷史現場」，而是「回憶和追念」。


  比起幾年前《黃金時代》的「蕭紅」，我們對《明月幾時有》的主角「方蘭」更加陌生。

  電影從1941年香港淪陷之後，游擊隊奉命營救中國文化人士的場景開始，帶出原為小學教

  師的方蘭如何成為香港地方情報部成員的過程。接著便聚焦在方蘭與在香港地方活動的小

  人物，如何在抗戰幾年間，隱藏自己的姓名樣貌、離開自己的家，明裡暗裡地對抗日軍。


  朋友說她喜歡港味重些的許鞍華，不喜歡許鞍華近幾年拍的電影（朋友最喜歡的是《女人

  四十》）。確實我也覺得許鞍華最好的片是純香港味道的電影（我目前最喜歡還是《桃姐

  》和《天水圍的日與夜》），但許鞍華給我感覺很在時代浪上，近年拍的似乎都是中資片

  ，在規模、故事與呈現出來的味道，都與我們喜歡的那些電影很不一樣。但我也喜歡《黃

  金時代》，覺得那些實驗性的手法、那個時代與那些戲都拍得很好。也許那個味道不一定

  是合乎我心目中某些歷史人物的面貌，可許鞍華至今仍不斷變化的狀態，讓我作期待她拍

  的片，也希望她一直拍下去。


  《明月幾時有》是在《黃金時代》後的作品，一樣是回到過去、以女性角色為中心，只是

  方蘭畢竟不是像蕭紅一樣的文學家，留下的文獻沒有那麼豐富。從電影成果看，方蘭的故

  事一部分依附在大時代其他人的故事裡，一部分則是晚輩的回憶，其他空白的部分，只能

  像傳說一樣地、透過想像去補充。因此，對我來說，這電影有意思的地方，不在於它呈現

  了什麼真實的過去，而在於它為方蘭、劉黑仔等不是那麼偉大的人物，做了個紀念碑（也

  許是較為浪漫不真實，卻十分可愛的紀念碑）。



  比較可惜的是，台灣上映的似乎會是國語版本（想看粵語版本啊QQ）。



  --


  這裡是我的樂園:




