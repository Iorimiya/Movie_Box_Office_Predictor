content: '下周的主打星,很明顯應該是《敦克爾克》,


  所以其他同期影片,是否有可以推薦一看的呢?


  如上周《銀魂》就是意外的收穫 阿魯~


  本人喜好奇幻 冒險 動畫 動作 動腦



  《明月幾時有》


  40年代,二戰時期,日軍佔領香港的一段歷史故事 有興趣


  =

  《悟空傳》


  兩大男神重新詮釋老孫跟二郎神,會迸出什麼新火花(梗)?


  =

  《盜速飛車》


  飛車電影有點膩了,應該會等《玩命再劫》再去看


  =

  《模犯生》


  看預告還以為是日片的質感,結果是泰國片,說不定很有趣? 泰國票房冠軍



  版眾如果再中挑一部,


  會選哪部呢?


  --

  點之前你猜的到是誰嗎?



  --'
