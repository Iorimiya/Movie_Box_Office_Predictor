title: '[好雷] 明月幾時有'
content: "首先，雖然這是部中國拍的抗日片\n但要是為了看大場面戰爭進場\n會後悔的，因為片中武戲不多，\n就零星衝突，但是在皇軍高壓統治下\n整部片還是充滿緊張氣氛\n\
  所以兩個多小時 很快就過了\n\n如之前心得文有人說過\n這是部充滿小細節的片\n從一開始 香港從繁華到沒米沒水\n各處都可以感覺到 戰爭對百姓的殘酷\n理髮的把剃刀丟了\
  \ 炒菜的鍋鏟給砸了\n每個人都在心中，盼著勝利那天\n\n裡面有幾段情節印象深刻\n\n1.大佐前一秒還跟霍建華喝酒烤肉談文學\n   下一秒要他七秒成詩，不然就斃了他\n\
  \n2.房東太太前期對那兩塊糕餅的斤斤計較\n   到後期深明大義，捨生成仁\n\n3.彭于晏還是演那種角色\n   熱血、正義、一派輕鬆的模樣\n   但是在前半場來去自如、使命必達\n\
  \   最後，還是對於營救人質無能為力\n   要是最後真的來個大決戰就有點脫離現\n   實了\n\n4.周迅說 抗日工作，的確是少我一個不少\n   多我一個不多，但如果人人都這樣想\n\
  \   勝利就更遠了，因為戰爭苦難，更可看\n   出人性勇敢光輝，活脫又是個顧曉夢\n\n\n最後，從香港破敗的碼頭 ，鏡頭一路轉\n慢慢變成現代繁榮的香港\n\
  人民等到和平了，明月終究會來\n只是 但願人長久 千里共嬋娟 似乎已遙不可及\n\n最後想問：\n李錦榮最後有死嗎？\n那段看不太懂，大佐發現他是臥底\n砍了他兩刀，又很惜才地放他走\n\
  可是後來又有槍聲？\n\n然後支線有另外兩個女臥底幫日本人作事\n最後被槍決，也覺得可以再多描寫一點\n\n\n\n\n\n\n--"
