title: '[好雷] 黑白線人'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  韓國一向不怕拍攝針砭時事的電影，尤其是取材自真實事件的故事，像是以亞洲金融風暴

  時的應變為題的《分秒幣爭》與改編自朴正熙總統遇刺事件的李善均遺作《幸福國度》等

  ，都以非常犀利的角度切入。雖說《黑白線人》並非真實故事，但其中影射的社會議題，

  也很值得玩味。



  晦暗的韓國毒品犯罪市場中，一樁樁檢察官破案的背後，隱藏著在黑道與執法單位之間周

  旋的「線人」，專門向警方與檢察官提供毒品犯罪的機密情報。



  「警方抓的毒蟲這麼多，大韓民國卻連一間戒毒中心都沒有。」



  《黑白線人》不單單以毒品為故事主軸，更點出南韓的毒品問題。曾經被稱作「無毒國家

  」的南韓，近年來毒品與藥物濫用的情況日益嚴重，毒品犯罪人數也大幅成長。根據南韓

  警察廳在2023年的統計，20到29歲的毒品犯罪人數，從2018年不到1500人增加到2022年的

  4000人以上，大檢察廳毒品及組織犯罪部公布的《2023年毒品類犯罪白皮書》也顯示出女

  性與年輕人的毒品犯罪明顯增加。去年的統計更指出南韓國內平均每100名成年男女，就

  有3人曾經濫用或吸食毒品。



  不過，年輕人染毒不全然是涉世未深的結果，不少藥頭為了引人上鉤，使出各種花招，從

  罐裝咖啡、解酒湯，到聲稱能夠提升記憶力與專注力的能量飲料都有，讓涉毒人士的範圍

  擴及學生、政治人物與藝人。從片中李江秀第一次遭陷害便可得知，即便安分守己當個計

  程車司機，還是會由於遭到誣陷而碰觸到毒品。南韓警方2021年查獲的走私毒品高達1.3

  公噸，其中又以冰毒、大麻與古柯鹼為最大宗，專家更研判，大部分的毒品來自北韓，畢

  竟北韓在1980年代就是靠毒品賺取外匯，而《黑白線人》裡也提到毒品來自北韓與中國。



  除了毒品犯罪與氾濫問題之外，電影也點出南韓勒戒中心不足的問題。專家指出，戒毒過

  程需要充足的支持與資源，來面對成癮症狀，就像《黑白線人》中，李江秀被迫染毒後，

  即使擁有超強意志力，也得藉由被關在密室來強迫自己戒毒，讓朋友昌樂直呼開設戒毒中

  心肯定會是門好生意。其實，釜山監獄已在今年設立全國首間專門收容所，為有心遠離毒

  品的人提供戒斷治療。



  「大韓民國的檢察官可以成就總統，也能夠拉下總統。」



  除此之外，《黑白線人》還非常直接地諷刺政治人物的家族醜聞，片中的總統候選人之子

  趙勳漫無章紀，就算已經獲得事先警告，也毫不在意，仗著自己有檢察官當靠山，照樣在

  選前開毒趴。現實中，南韓總統或總統候選人的兒子出包也不是一天兩天的事，追溯到比

  較久遠的第14任總統金泳三，他的次子在其任內因貪汙遭首爾地方法院判刑，而當時批評

  此弊案的繼任總統金大中，卸任後三個兒子都曾因受賄被判刑。比較近期的則有已故前總

  統全斗煥的孫子全祐院在美國時涉嫌吸毒，以及總統候選人李在明的兒子，遭爆多次發表

  性騷擾言論並涉嫌賭博，但他最終還是成為現任總統。南韓國民可能長久以來都希望這些

  總統或總統候選人，可以為兒子的行為負責，才會讓《黑白線人》拍出趙勳導致父親敗選

  的內容。



  「你要不要正式當線人？」



  自從具檢察官發現李江秀的才能之後，他就再也回不去了，但事實上，曾因毒品犯罪入獄

  的他或許也沒有別的選擇。當線人必定有風險，不論是幫助毒梟談認罪協商從中抽成，深

  入毒窟彷彿進黑社會，龍蛇雜處，難保不能全身而退，還是為檢察官牽線，但線人在他們

  眼中就是毒蟲身分，難保隨時被切割。如同事業正要起飛的女明星嚴秀珍，即便自願轉汙

  點證人，協助警方辦案，但「人在江湖，身不由己」，最後又因為吳尚才刑警的案子遭具

  檢察官攔胡，而成為未獲保護的線人。



  嚴格來說，根本就沒有什麼「黑白線人」，畢竟他們本來就遊走在模糊邊緣，只是必須在

  保全自己人身安全與達成目的之間取得平衡。片中想以小蝦米打倒大鯨魚的四人組裡，除

  了後勤的昌樂之外，只有吳尚才刑警站在亮處。他原本就是正直不阿的形象，即使被發現

  與李江秀合作，也無法說服他人他已棄明投暗。但是，李江秀與嚴秀珍就一直都待在危險

  的最前線，除了必須直接與毒蟲交手之外，也必須一面暗中執行既定的計畫。李江秀被具

  檢察官處理掉的遭遇，以及昌樂與嚴秀珍在計劃成功之後，沒能回到安全的基地，就被趙

  勳發現而滅口，便是線人無可避免的風險。



  「讓我們來執行真正的線人計畫吧！」



  《黑白線人》最精彩之處在於其不斷翻轉的情節，李江秀與具檢察官原先稱兄道弟的關係

  ，面臨升遷的利益瞬間決裂，到此大概都還在觀眾的想像中。後續，不管是與嚴秀珍、吳

  尚才刑警的合作失敗，付出同伴的生命，讓全片進入「一切盡失（All is Lost）」的境

  地，還是與具檢察官談判破局，說要開始一波「神操作」，居然還是在他股掌間迎刃而解

  ，甚至最後出乎意料地來個絕地大反攻，將當初象徵兄弟情誼的打火機轉為揭露一切的關

  鍵，都讓觀眾就算猜中其一，也無法預測其二。就連最後片尾李江秀逗趣的窩裡反，都不

  忘強調吳尚才刑警的善惡分明，以喜劇的方式呈現出一部精采的犯罪動作片，極為有特色

  。



  最後，原文片名也很有意思。就像片中所說，這個警界術語是「線人」的意思，但漢字音「野黨」原意就

  是「在野黨」，如同《黑白線人》所演繹，要想當好線人，必須隨時站在反對面思考，而

  電影牽涉到政治，甚至扳倒一位呼聲極高的候選人，可能也與片名有關。可是，這個字一

  開始進入警界，反而是指扒手組織冒犯到其他人的地盤時，對方會報警舉報，代表「野黨

  」的衍申義「對面陣營」，後來才發展到毒品搜查的領域，也就是我們在片中所見的意思

  。



  據說這個術語在1960、1970年代相當流行，但由於警察與檢察官以《黑白線人》裡的方式

  查案已不合法，現在並不常見。用討人喜歡的亦正亦邪角色，講述韓國曾經或正在經歷的

  毒品與政治困境，加上輕鬆詼諧的調性，讓本片即便聚焦在嚴肅的議題，仍舊是一部適合

  闔家觀賞的作品。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
