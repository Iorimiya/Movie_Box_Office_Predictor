url: https://www.ptt.cc/bbs/movie/M.1750686423.A.E7F.html
title: '[負雷] 陰陽眼見子真人版電影隨筆'
content: '作者: mengskhitler (首領八奇) 看板: C_Chat

  標題: [心得] 陰陽眼見子真人版電影隨筆

  時間: Mon Jun 23 21:41:23 2025


  官網連結



  老實說，在決定進場看電影版之前，我猶豫了很久。從發布的預告片，再到電影原創角色

  的發表，再再都讓我的廉價爛片警報大響。可是我真的蠻喜歡陰陽眼見子這部作品，也實

  在很想知道在不同媒體上到底會如何表現。PTT上目前沒觀影心得，再說就算有那也是別

  人的感想，最終好奇心還是壓過了內心的不安，決定親眼看看。


  來張電影海報。即便6月6日才上映，現在大多影院已經只剩一天一兩場了。



  以下基本無劇情雷，但雷的定義每個人不太相同。真的一點點都無法接受的人，不妨回上

  一頁。


  先說結論：我無法推薦給別人看這部片。

  我可以理解媒體不同轉換上有差異；我可以理解電影的時間短短有限(本片為98分鐘)劇情

  需要濃縮修改；我可以理解人物關係需要適當調整。我不會要求一定要照原作，唯一的希

  望是能看到一部有趣的電影。然而哪怕我已經把標準調那麼低，電影整體水準還是連低空

  飛過都沒能辦到。


  最大的問題倒不是改了很多原作的東西……雖然這也是個嚴重的問題，我在劇情雷的部分

  會再稍微追述。電影保有了很多漫畫的情節，讀過漫畫的人看到後肯定會有「喔喔原來把

  這段拿去這裡用啊。」之類的感想，然而這也正是最大的問題。漫畫原作如果是份滿漢全

  席，那電影就是拿了一點美味的味噌，多汁的牛排，香濃的起司，回甘的紅茶……然後全

  部倒在同一個盤子裡。電影的主線是看得出來的，但編輯得實在支離破碎，造成很多部分

  場景轉得很生硬，我也因此覺得整個觀影體驗很有割裂感。演了一小時後我已經忍不住看

  手錶了，更別提翻了不知道多少次白眼。


  撇開上述缺點，鬼魂的CG極其廉價(當然，也有可能是為了很以方便分辨真人與鬼魂)、一

  些搞笑的場面不怎麼好笑、外景場景在群馬帝國郊區，導致整體環境氣氛都跟原作不太一

  樣等等，林林總總因素再再都讓我很難給予正面評價。我很努力去試著喜歡這部片，正如

  我喜歡原作漫畫那樣，可惜從電影開始都結束，我都沒有辦法說服我自己。


  不過原菜乃華所飾演的見子我倒是相當喜歡，越看越覺得喔，有像見子。如果是這位演員

  的粉絲，或許值得去看吧。


  喔對了，漫畫早期偶爾會出現的服務讀者場景砍得一乾二淨，見子98%時間都穿著制服，

  就不要去期待了。


  以下有劇情雷，介意的人請迴避。






















  -----------------------------------


  什麼？你說你已經等不及了，快點端上來吧？

  那以下就是電影主線。基本上就是到遠野善篇，然後拿掉同時發生的神社篇。


  見子有一天突然就能看到鬼，在錯誤嘗試後發現無視才是最好的。儘管幽里亞察覺到見子

  的能力而不斷引誘她承認，但見子依舊不為所動裝傻。然而隨著原本導師請產假，代理老

  師遠野善以及他背後的惡靈似乎讓見子不得不面對……


  聽起來跟原作很像是嗎？實際內容差多了。

  我在之前段落有提到修改了原作，若改的是角色設定之類也就罷了，但與原作嚴重的衝突

  是來自核心理念──「無視」這件事。是的，即便是原作，撇開被陰了的部分不說，見子

  也沒有真的無視到底：為了拯救善老師，她直接明白的對善的老媽惡靈說已經可以了吧，

  該放他自由了(這段電影有原封不動的照搬，帥氣。) 而見子也有跟神童羅母和神靈教母

  坦白自己看的見。可是整體而言，無視是最基本的態度。


  然而電影的講述方式，卻反而像是無視不能解決問題，要去面對。跟老爸吵架後無視他，

  最終再也沒有機會道歉。跟老媽吵架後無視她，就沒辦法修復關係。華被詛咒後若繼續無

  視，就只能眼睜睜看著她死去。是很正面啦，但跟原作的精神感覺就是差很多。雖然不能

  排除原作最終也會這樣發展，但目前當下兩邊帶給我的衝突感還是很明顯。就算當我是無

  法擺脫原作好了，電影自己的標語也寫著無論如何請無視下去的耶。


  再隨便聊聊角色好了。


  見子：整部戲真的靠她在撐。跟原作有一絲絲冰山美人的氣質比起來，更多了些楚楚可憐

  的味道。儘管因為劇本導致我覺得見子沒有很堅持無視這件事，不過已經算是很還原了。

  第一次看到鬼的經典公車站橋段拿掉真的很可惜，而在鬼屋的放聲吶喊也因為缺乏無視的

  壓抑而沒了那份重量。

  對了雖然跟電影一點關係都沒有但見子x未知瑠真的香貢貢貢貢香 (離題


  華：不是在說演員不好，但努力把二次元的表情跟情緒張力一模一樣的放在真人電影就是

  這樣的情況，誇張而且不自然。我一向不批評日本所謂舞台劇式的演出，都已經在看日片

  了還挑這個去嫌棄實在沒意思。不過要把漫畫的情緒在真人電影重現，我想肯定有值得調

  整之處。表演方法先不論，華這角色在電影中缺乏發揮，沒有展現出在見子身邊一直努力

  支持她，中後段更因為被善老師的老媽影響而衰弱住院少了一堆戲份，到頭來只記得她在

  吃吃吃。可惜了。


  幽里亞：與原作差不多的角色，會除靈但能力不夠，連躲在廁所吃便當都有還原出來。相

  較於漫畫是次於華的角色，電影大大的活躍，吸引目光的程度遠超過華，還多了穿上巫女

  服的段落，還能與見子談心。實質第二女主角。另外演員なえなの能駕馭雙馬尾我覺得超

  強，造型蠻好看的。


  権藤昭生：學生會長，是電影原創角色，算是融合了部分神童羅母和神靈教母，畢竟總是

  需要一位靈異知識豐富的解說役。來歷不難猜。雖然講話臭屁臭屁但我意外的並不會排斥

  這個原創角色，是我可以理解的改動。


  遠野善：角色裡跟原作差距最多的。角色背景設定相同，但個性上原作中對人毫無感情，

  性格冷酷，連自己班學生的名字都沒意願記，可是電影中卻搖身一變成為畏畏縮縮，缺乏

  自信的人，大概是為了反映出從小長期被媽媽情勒。也不是不行啦，也許拋開原作的束縛

  可以接受。但拿掉所有關於貓貓的部分我認為是可忍，孰不可忍。


  鬼：基本上就是人影做變色跟模糊處裡，沒了。什麼體型變大還長了一堆手腳，我們沒有

  這個預算。


  其他：沒有小老頭，沒有大蟒蛇穴熊。不過包包上的メメちゃん還有ラムダラビット有完

  整重現，好評。


  另外電影最後有揭露一個大爆點，不影響劇情但相當有趣，我當下真的有眼睛一亮。可惜

  這也大概是我唯一能稱讚的點。




















  (劇透結束)

  -----------------------------------


  當初發表真人化電影時我就不太看好，畢竟電影片長太短，而見子的遭遇還有壓力是需要

  時間去醞釀的。很遺憾我的擔心還是成真。


  不覺得台灣會上映，也許之後會上串流吧。

  雖然也不到大爛片，不過真的要觀看還是建議做好調適，也許還是能找出屬於真人版電影

  專屬的樂趣。








  --

  Hello Happy World!團練邊騎腳踏車邊演奏時，或許是過於疲憊，

  不幸追撞了黑色的高級車。

  對為了保護其他團員而擔下全部責任的美咲，車主——團長弦卷心

  所提出的和解條件是...


  --'
