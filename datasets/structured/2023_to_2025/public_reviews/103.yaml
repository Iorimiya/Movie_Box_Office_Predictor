url: https://www.ptt.cc/bbs/movie/M.1728512223.A.4B8.html
title: '[情報] 陰陽眼見子 真人電影化'
content: '人氣恐怖喜劇漫畫《陰陽眼見子》（原作：泉朝樹）確定將改編為真人電影，並將於2025

  年初夏上映。主演由原菜乃華擔任。


  泉朝樹先生在社交媒體上發布的第1話引起了廣泛關注，並於2018年開始在KADOKAWA旗下

  的《ComicWalker》（現稱「カドコミ」）連載的恐怖喜劇漫畫《陰陽眼見子》。該作品

  在カドコミ、ニコニコ漫畫和pixiv漫畫上的累計瀏覽次數已超過8500萬次，國內累計發

  行量突破300萬冊。這部被翻譯成13種語言、並受到全球眾多粉絲喜愛的人氣作品，將以

  真人電影的形式登上銀幕。


  原菜乃華擔任突然能看見幽靈，卻只能一再無視它們的高中生四谷見子的角色，這也是她

  首次單獨擔任主流電影的主演。原菜乃華表示：「這個設定實在是太新穎有趣了，一下子

  就讓我著迷了。雖然是恐怖片，但角色卻只是一味地無視那些幽靈，我在讀劇本時笑個不

  停。這是一部融合了青春、喜劇和人性劇的全新恐怖電影，希望大家能期待！」她對作品

  充滿了熱情，寄予厚望。


  負責編劇與導演的是鬼才中村義洋，曾打造多部熱門作品。他以《鬼水怪談》（2002年，

  編劇）和《殘穢：不能住的房間》（2016年）等作品中精湛的恐怖表現聞名。這次，中村

  將挑戰一部與傳統恐怖片不同，兼具緊張感與青春電影清新氛圍的全新娛樂作品。


  中村導演表示：「（原菜乃華）讓我驚訝的是，人的眼睛竟然可以瞪得這麼圓！這種眼神

  中帶來的恐懼感，給了我很大的壓力，因此全力投入拍攝。我相信這會是一部前所未見、

  質感極高的奇特電影。」從他的話語中可窺見對作品的自信與期待。


  原作者泉朝樹表示：「漫畫和真人電影在媒體形式和表現方式上都不同，所以一開始坦白

  說，我對這部作品的期待和不安各半。不過當聽說是由中村義洋導演執導後，我的期待瞬

  間大大提升了。我還記得當我在片場見到原菜乃華時，不由自主地脫口而出『啊，是見子

  ！』，她和見子的契合度非常高，這種感覺很奇妙。作為原作者，但同時也是一名恐怖電

  影迷，我非常期待這部作品以與《陰陽眼見子》原作不同的形式，帶來全新的驚喜。」他

  對真人電影的期待之情溢於言表。


  --'
