title: '[好雷]《邀阿公阿嬤拍B級殭屍片》'
content: '失智阿嬤也能當女明星，表現最超俗的失智症議題電影


  電影裡通常主角都是俊男美女，在影視裡一些長者的形象往往有著領導睿智，或是相反的

  手無縛雞之力，尤其在一些悲傷或回憶片段時更添上歲月的痕跡，可以說老人家有著生活

  多年的人生智慧與年歲經歷，成為有故事的活歷史。


  但是當故事變得支離破碎之後，忘卻珍貴記憶人事物總讓人感傷，但傷感不能解決問題，

  如何正視問題活得快樂也許才是一劑良藥。


  《邀阿公阿嬤拍B級殭屍片》是部很有意思的紀錄片，導演徐紫柔原本是想紀錄家族拍攝

  有趣的影片，意外捧紅94歲失智症的外婆成了高齡網紅，讓他們一家人有各式大型演出機

  會。想用表演與外婆保留更多回憶的徐紫柔，某天異想天開的想動員社區鄰里的大家，她

  決定替奶奶拍一部B級特攝片，內容是「金剛戰士大戰殭屍」。







  《邀阿公阿嬤拍B級殭屍片》是什麼電影：


  還記得學生時期曾看過一部非常賺人熱淚的韓國狗血愛情電影《腦海中的橡皮擦》，故事

  的主角的戀情除了遭受家長的反對之外還有著意外的相遇、跟無法治癒的絕症。可以說這

  部電影改編了日本原作韓劇，有著各式各樣我們所熟知亞洲影視很愛的套路，但也因為這

  樣讓人愛看又愛嫌的悲劇故事，劇中所說的阿茲海默症（失智症）也可以透過這些流行文

  化，進入婆婆媽媽等觀眾的視野。


  2006年日本電影《明日的記憶》就以倒敘法的方式敘述主角從悲痛到接收自己失憶症的事

  實，並細膩的描繪家人間的情感和記憶的珍貴。而阿茲海默症病患大國的中國也在2022年

  少見的拍攝以這類題材的電影故事《媽媽！》也敘述關於中國也繼日、韓等低生育國家的

  步伐逐步成為下個老齡化國家。


  台灣在2010年時也影人跟天主教失智老人基金會合作拍攝《被遺忘的時光》紀錄片，其他

  如《我想念我自己》、《父親》等，可以說這類型的電影每個都是相當嚴肅且令人沉重的

  故事。







  但就如同現在幾年開始有猶太裔的導演以較為黑色幽默的方式去拍攝二次大戰的題材，或

  是納粹喜劇。阿茲海默症這種疾病類的題材，有時候在後人的創意與巧思下，也許能擺脫

  太過沉重與說教式的電影類型。


  紀錄片《邀阿公阿嬤拍B級殭屍片》就是一個以失智症為主題，但卻充滿台灣風格、用幽

  默和樂觀的方式寫實記錄的家庭物語。試圖拍出在世界也難見到，以生活喜劇方式紀錄側

  寫關於老年人失智症，老人失智並不代表失能，反是凝聚一家人力量的核心。


  導演徐紫柔因為早期發現外婆有失智症狀，開設「決戰家族」的小粉絲團，拍攝一家人以

  外婆為核心的搞笑短片，甚至受邀去一些地方演出舞台劇，甚至還收穫一些粉絲。這時徐

  紫柔有了個突發奇想，她想拍一部「金剛戰士大戰殭屍」的特攝片，並且由失智的外婆擔

  當主角，也希望動員許多配角與找尋到演員。但是如此龐大的攝影計畫，除了面臨找無人

  的狀況，失智症的外婆要如何背起演出台詞和動作也成了這次電影能不能成功的大挑戰。










  《邀阿公阿嬤拍B級殭屍片》分析與延伸：


  阿茲海默症也背俗稱為老年痴呆、失智症，它是一種會隨時間慢慢神經退化產生障礙的慢

  性病。是大腦和脊髓細胞神經元因為退化所導致的病症，這種症狀通常有六成以上都會成

  為失智症。


  一般失智症最可怕與讓病患困擾的地方就是喪失短期記憶，除了會忘記日常大小事外，如

  果不治療延緩病症，還會導致語言喪失、方向感失去、情緒起伏不穩無法控制等等，目前

  失智症病因行程還沒有一個特定原因，每個人的病症出現速度都不相同，較為可能是跟遺

  傳有很大的關係。


  大腦退化、老化導致的失智症好發在高齡人士身上，台灣失智症協會表示因為台灣也逐漸

  步入高齡化社會，故屆時這樣持續下去到西元2032年全國失智人口恐達到46萬人，如果錯

  失治癒的黃金時間，對於醫療、照顧的時間金錢成本，對失智患者的家屬是相當龐大的負

  擔。而如今失智症狀在全球有提早的趨勢，主要在於現代人的社會壓力增加，無論是全球

  化或人口競爭力。且失智症並無藥可治只能延緩發作時間。







  故因為是一個可怕又令人惋惜的疾病，通常影視多用絕症或悲劇來處理阿茲海默症，但紀

  錄片《邀阿公阿嬤拍B級殭屍片》卻反轉，導演以自己失智症的外婆為主角拍攝打喪屍的

  特攝片，並且還請鄰里相好幫忙，且連同歡會婆婆媽媽大叔大伯都來參加演殭屍和配角。


  將原伴隨悲劇色彩的失智症，在這邊轉換用正面且搞笑有趣的角度去看待與了解病症。除

  了讓罹患失智的奶奶有一個永遠的影像記憶，也盼失智症不再是悲傷代名詞，及早發現與

  治療還是可以享受生活的每一天。


  一家人加上許多鄰居朋友和團體幫助開拍打殭屍戰隊《記憶戰隊》，故事就以被奪取記憶

  而變成行屍走肉的殭屍來襲，在過慣和平生活，金費不足且績效不佳的記憶戰隊一家人該

  怎麼守護大家的記憶。雖然電影沒有詳細的將《記憶戰隊》全片給放映出來，但透過紀錄

  片，導演拍攝這部片的目的很大的原因，還是希望一家人藉由拍攝趣味短片和電影來替失

  智的奶奶留下些什麼，也替自己在陪伴的這一路上回味起那些點滴。










  《邀阿公阿嬤拍B級殭屍片》值得一看嗎？


  這應該是首部幕後拍得比正片還要長的特攝片，正片《記憶戰隊》共拍了三集，免費在網

  路上放送，而幕後紀錄《邀阿公阿嬤拍B級殭屍片》卻要買票進場觀看，有點反過來的有

  趣安排。


  這部台灣紀錄片除了不再將失智症妖魔化或悲情化外，也可以看見很多台灣生活點滴的互

  動，可說是今年最具有台灣味的一部電影。整體看下來不能說《邀阿公阿嬤拍B級殭屍片

  》完全無缺點，例如出場的人物太多導致故事發散，並且前面還未進入正題的前言有點過

  長，還有鏡頭轉換和拍攝有時候會暴露出一點瑕疵。但還是一部相當有趣的良片。


  《邀阿公阿嬤拍B級殭屍片》除了用搞笑手法來敘述外婆的舉動和一家人的互動外，我覺

  得這部片讓我最喜歡的是在搞笑之餘，不會將原本想敘述關於失智症的主題變得像場兒戲

  。台灣電影和一些紀錄片導演有時候會為了效果而過度的去聚焦一些內容，而導致整部電

  影主題和視點有種人工上的用力，但這樣雖了解導演的賣力，但卻對於只是想看電影的人

  產生反效果。但《邀阿公阿嬤拍B級殭屍片》中素人的自然演出，並透過片場互動來帶出

  失智症狀與外婆會遭遇的困難，我認為很相當出色的地方。






  整體而言用《邀阿公阿嬤拍B級殭屍片》拍攝電影除了帶出失智症者日常上的困難外，也

  另外戴出關於台灣特有的人情味和家族情感，這種彼此之間小打小鬧的感覺是屬於台灣生

  活的人們，甚至在成品《記憶戰隊》中的各種居家和互動，也讓人可以享受故事裡所敘述

  關於台灣特有的梗與笑點，這不是在影片裡讓演員說台語、拿出客家花布、或特地拍攝原

  住民的祭典、外省眷村等硬塞入其中可以比美的。


  雖然常常有人說台灣無法拍出如美中大國的大特效，也不像日本有動畫大國，韓國利用明

  星優勢的流行地位。但在記錄片這一塊我是認真認為台灣的紀錄在許多方面是真誠且充滿

  創新的，雖然可能離主流有些距離。


  每次看台灣紀錄片都不斷反映出台灣小人物的生活價值，並帶觀眾看見被忽略的一角，不

  管觀點為如何。這部《邀阿公阿嬤拍B級殭屍片》用不再悲傷的方式說好失智症，什麼才

  是寓教於樂又不失尷尬，我想這部電影有了2023年台灣紀錄片更新的標竿。




  --

  個人Blog：

