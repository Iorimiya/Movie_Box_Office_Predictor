url: https://www.ptt.cc/bbs/movie/M.1698252089.A.C36.html
title: '[好雷]《邀阿公阿嬤拍B級殭屍片》(2023)電影心得'
content: "[好雷] 《邀阿公阿嬤拍B級殭屍片》(2023)電影心得\n.\n.\n\n.\n這片讓我笑出來的點有約十個左右，撇除我笑點可能比較低這點，\n\
  甚至讓人感覺不出來，這是一部失智症相關議題電影。\n.\n這片讓我想到公視的平民日常但溫馨有趣的實境節目《誰來晚餐》，\n不過這片算是超級加強版吧。\n為了讓輕微失智症的阿嬤像往常一樣，參與家族以好玩有趣為出發點的業餘戲劇演出，\n\
  孫女導演以自身業界經驗結合手上資源人脈，花費時間心力，\n認真規劃了一個電影等級的大企畫。並廣邀八十位以上的鄉親里民擔任臨演參與演出，\n這個大企劃到底能不能成功呢…？\n\
  .\n黑戰士在定裝時跟正式開演時兩度把戰士緊身服穿反、\n跟藍戰士因為穿緊身衣遮不住胯下一大包而覺得好難為情，這裡滿好笑的。\n.\n一邊看本片的時候，發覺除了拍攝片中片《記憶戰隊》以外，還有另一條線，\n\
  是紀錄幕後過程拍攝過程，也就是這部電影本身。\n自己覺得這部份很難拍，難在跟大批非專業業餘演員溝通協調，\n跟紀錄拍片過程流程的這條線都很繁雜。劇中導演也多說好幾次自己覺得快要放棄了。\n\
  光是在電影院大螢幕外的我，看的時候也有這種感覺。\n.\n阿嬤這家不是政商名流望族或醫生世家，只是一般平民百姓，阿嬤年輕時是個採茶的茶\n農，八十歲時依然可以每天搖兩百下呼拉圈。拍攝本片期間已逾九十多歲高齡，足見身\n\
  體健康硬朗。不少上一代的長輩會因為照顧責任分攤跟財務的不均，多少內心會有不滿\n與隔閡，但覺得阿嬤家族的凝聚力與支撐力非常強大穩固，令我很羨慕。\n.\n為了取得社區鄉親大家的信任、為電影尋找適合演員、跟烙更多人來參加臨演當殭屍，\n\
  孫女導演還下海去參加社區卡拉OK跟運動會等活動，來跟社區鄰里居民「搬撋」與交陪。\n這毅力令人欽佩。一般來說孫輩的晚輩，\n光是忙自己的學業課業工作人際關係…等種種生活瑣項，就已經忙不完了，\n\
  導演居然為了成就阿嬤的這部電影，參加卡拉OK比賽與下場跑到累個半死的運動項目，\n我想這是因為導演跟阿媽從小到大都有很長遠與強烈的愛與繫絆，才願意如此奮不顧身。\n\
  .\n我們都以為「記住」事情是件理所當然的事。對於公園那場戲，導演請阿媽走位，\n阿媽一直直接走人忘記轉彎、導致走位失敗重拍這點我很有感，\n我服務多年的一個失智長輩，長輩永遠記不起來他使用拐杖、健側患側的移動順序。\n\
  每天都有提醒、但隔天照樣忘記。\n永遠記不起來吃完飯後，要先去廚房漱口→去廁所尿尿→再去房間睡午覺的順序，\n而不是直接就走進房間睡覺。\n我也從不滿到不解，之後也慢慢習慣他的這種反應，定時定點的點醒他。\n\
  .\n片中開拍前一天，被導演抓來臨危上陣的鄭阿媽，因為「戲」胞已被打開，\n在殺青後戲癮難耐仍想追問導演，還有沒有演出機會，這點也很有趣。\n我觀察到長輩愛看的那些「天良電視台」、「信大電視台」頻道的鄉土素人歌唱節目，\n\
  以前自己總是覺得，這些表演跟自己心中理想的歌唱表演水準有不少差距，而覺得不解，\n很多長輩潛在的血液裡，可能有著我們與他們自己都的不知道的，\n表演因子表現慾與可能性，但或許前半身都忙於工作維持生計與照顧家人，\n\
  只到中老年退休後，他們卸下面對社會的面具後得以成為自己，\n那些人格特質才有機會顯露出來。\n.\n電影與影像的厲害之處：把瞬間保留與封存，可以保存五十到一百年。阿嬤、阿舅\n\
  與參與本片鄉里鄉民演員們，大家的努力、歡笑與付出，將永遠活在這些影像之中，\n而不是只剩下清明返鄉掃墓時的一罐石罈、一張照片、一個名字與一塊墓碑而已。\n.\n\
  身為長照工作者，我們被教育與訓練成，要把失智症當成問題及工作來對待與處理，\n但失智需要的除了是醫療介入、日常復健鍛鍊、固定回診以外，\n真正需要的是日常生活中更多的陪伴、陪她／他一起歡樂嬉鬧、玩「人生」這個遊戲，\n\
  多參與家裡或社區的群體與活動，更多的愛與包容。\n感謝導演與其團隊攝製紀錄了這麼一段歡樂溫馨，又貼近生活日常的非凡奇幻歷程。\n願粉紅戰士跟記憶戰隊任務完成不必再出勤，阿龜阿嬤平安健康呷百二。:D\n\
  .\n.\n.\n.\n。《邀阿公阿嬤拍B級殭屍片》電影預告片段\n\n.\n。《邀阿公阿嬤拍B級殭屍片》電影FB與近期上映戲院場次時段資訊：\n\n.\n。「決戰家族」的水管頻道影片列表，包含片中片《記憶戰隊》全片三段與其他舊片：\n\
  \n\n\n--\nＡＳＤＦＧＨＪＫＬ：\nＺＸＣＶＢＮＭ＜＞？ ▏\n □□□□□▎\n▁▏\n\n\n\n--\n\n--"
