title: '[好雷] 邀阿公阿嬤拍B級殭屍片'
content: '雷文防雷資訊頁



  當初是在電影版看到的預告，看了YouTube上一到三集的正片，覺得實在太鬧太有趣了



  因為媽媽在安養機構的工作經驗，加上離世的奶奶晚年也是失智症患者，決定秋日的午後，

  帶著媽媽一起進電影院看這部紀錄片。



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  ~~~~~~~~~~~~ 雷文 主文分隔線~~~~~



  不同於過去失智症作品的悲情路線，從中壢一朵花阿嬤開場，導演明快的說明影像創作的起

  心動念，從創立決戰家族粉絲團，以阿嬤為女主角一起拍的短片和影音，一起做道具的日常

  ，好像藝術治療般，將照顧這件事，對照顧者和被照顧者本身，賦予了新的樂趣，無心插柳

  的拍攝還捧紅了網紅阿嬤，凝聚了家人，然後有了B級殭屍片的大膽計劃



  整部片的結奏十分自然，

  整部片不時爽朗的笑聲渲染了觀眾，

  讓日常的照顧、失智症的議題，

  多了一個的緩衝，不再那麼沈重，

  一定是很有愛的家庭，

  才能完成這部片吧！

  這部片如果加入金馬奇幻影展的片單也不奇怪。



  九十幾歲的阿嬤雖被診斷輕微失智，

  卻十分上鏡，頗有大將之風。

  曾受日本教育的阿嬤唱起桃太郎兒歌時，想起了我跟奶奶的兒時紀憶，

  眼淚就流下來了。



  印象深刻的是導演在演員甄選的過程，許多人不是不好意思，就是覺得演員應該要年輕貌美

  ，無奈社區老人化，兒女兒孫都在外地工作，導演博感情跑了像是歌友會各種社團，像星探

  一樣，挖掘到了一群有舞台夢的長輩。



  並不會因為老了就沒有價值，

  我很喜歡導演連哄帶騙，

  挖掘長輩內心的小宇宙，

  將大家擺在最適合的位置，

  那些年輕時未完成的夢想，

  在這部片里，讓每個參與的素人，

  有機會展現出自己不同的樣貌，

  大概是這樣的魅力，

  才讓這部紀錄片格外精彩吧。



  雖然是喜劇片，

  但還是看的我笑淚交織，

  回程在台北市客家文化中心的展覽，

  很巧的看到了導演一家的故事。

  至於紀錄片更多彩蛋，

  推薦進戲院欣賞吧。


  ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  --

  Sent from nPTT on my iPhone XR


  --'
