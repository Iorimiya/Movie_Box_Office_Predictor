title: '[新聞] 爺爺奶奶vs殭屍 邀阿公阿嬤拍B級殭屍片'
content: '爺爺奶奶戰隊 vs 殭屍？紀錄片《邀阿公阿嬤拍 B 級殭屍片》: 就算失智奶奶只記得一

  點點，能跟著大家一起笑那就很棒了





  《邀阿公阿嬤拍 B 級殭屍片》是導演紫柔內心深埋已久的期望。早在多年前，看到日本

  攝影師淺田政志拍攝一系列別具特色的全家福照，其中有一張全家扮上金剛戰士作在地板

  吃麵包的照片，讓她大感興趣：


  「就算出任務也要有休息時間攤著吃飯，非常邋遢又自然，這完全就是我們家呀！」



  心裡便埋下遲早有一天也要這麼做的種子。於是，從事影片創作的紫柔拿起攝影機與家人

  拍攝短劇，也開設了臉書粉專「決戰家族」上傳影片成品讓大家聞香。沒想到一支把奶奶

  （實際上是外婆）打造成饒舌歌手的的饒舌短片「台北客家粄條」一夕爆紅，有了這些拍

  片經驗和家人培養默契，讓紫柔下定決心挑戰「記憶戰隊」B 級片！這次，她有更大的野

  心，就是

  ！





  導演徐紫柔以細膩觀察力來敘述、解讀複雜的故事


  導演徐紫柔為獨立影像工作者，參與過商業廣告、電影的拍攝與製作。近幾年多為紀錄片

  拍攝，以獨到女性細膩觀察力，用接地氣的敘述方式解讀複雜的故事，轉換為溫柔具有人

  文力量的影視作品。作品風格在幽默中帶著感動，或是叛逆中帶著溫暖。紀錄短片作品《

  家族的奇幻旅程》入選 2019 桃園市公民紀錄片獎。


  「，當社會討論到失智症時，多屬嚴肅

  或悲劇， 即使失智症是一種逐漸退化的疾病，但那些患者美好的依然存留，我們要看到

  依然存在的，不要只看到失去的。我們仍可以與失智症患者或是高齡長者一起歡笑、冒險

  、實現夢想！」




  原本是導演紀錄家族和 94 歲失智奶奶，一起拍攝趣味短片的生活，居然捧紅了奶奶？在

  鏡頭下變身爆笑諧星的奶奶開始上電台採訪，瞬間變成全台最高齡網紅，全家人還被邀請

  到大型慈善晚會表演！導演想用戲劇來活絡奶奶的記憶，異想天開動員社區鄰里，一起和

  奶奶拍一部金剛戰士大戰殭屍的 B 級電影。然而遇到找演員的困難，還有拍攝前期，手

  意外受傷的奶奶，接踵而來的狀況，面對已失去短期記憶的奶奶，導演和家族還有社區的

  鄰居們，究竟要如何完成這場拍攝呢？




  失智症為高齡社會重要議題。根據台灣失智症協會資料，民國 120 年失智人口逾 46 萬

  人，屆時每 100 位台灣人將有 2 位失智者。大眾常因不了解失智症而恐懼排斥，造成延

  遲就醫，錯失治療的黃金時間，只剩下長輩臥病在床，對照顧者來說，不論經濟、心靈或

  是體力，更是沉重的負荷。為此，導演徐紫柔期盼能透過這部幽默逗趣的紀錄片，讓大眾

  得以用正面的態度面對這項疾病，同時也為罹患失智症的奶奶留下一段深刻美好的回憶。



  導演徐紫柔表示，大約十幾年前，奶奶八十幾歲時，開始有失智症徵兆出現，當時家人就

  很快帶她去作失智症診斷，經過藥物治療和家人的陪伴，讓奶奶這十年來都維持在輕度失

  智，沒有惡化。她表示，


  「我們各自用每個人的方式，去陪伴奶奶，比方平時大舅家和奶奶可愛幽默的鬥嘴，還有

  照護她生活上的所需，我的話，就是用拍戲和奶奶一起創作！」






  桃園市失智症關懷協會的理事長也直言，失智症可以十年都維持輕症非常的難能可貴，及

  早發現、及早治療是關鍵，但是最重要的，還是家人滿滿的陪伴。


  導演徐紫柔慶幸自己能因此與奶奶共享更多時光，所以也想把這份幸運傳遞給社會上的每

  一個人，希望能更少一個人，因為不理解失智症，而讓家人快速惡化成重症；希望大家都

  能有意識，成為記憶戰隊的一份子，一同正面且積極地面對未來的高齡社會。


  《邀阿公阿嬤拍 B 級殭屍片》將於 10 月 13 日上映。



