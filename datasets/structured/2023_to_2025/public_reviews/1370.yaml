title: '[好雷] 邀阿公阿嬤拍B級殭屍片'
content: '雷文防雷資訊頁


  電影預告：





  圖文好讀版:






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  這是一部用片名說完劇情大綱的電影。


  在走進電影院前，我看著那張迷因風格的海報還有劇透一切的片名，滿腦子想的都是要多

  不正經才能拍出這樣的電影，但看完電影後，我想這得是在充滿愛的家族成長的人才能拍

  出這樣的紀錄片。



  【跟著導演一起拍電影】


  說是紀錄片，但更貼近地說應該是幕後花絮，一部用非常趣味的方式去說關於失智症的短

  片《記憶戰隊》的幕後花絮。


  所以在進場看電影開始前，為了更了解《記憶戰隊》的劇情跟演員，應該要先看過正片再

  進場看花絮。








  原則上應該要是這樣建議的啦！








  但身為直接進場看電影的我，反而更推薦把《記憶戰隊》留到電影結束後再來看，觀影視

  角會變成跟著導演從無到有一起完成電影拍攝。


  當最後在電影裡沒有看到《記憶戰隊》的完整版時，我心中出現了一股空虛，就跟殺青的

  孩子和鄰居一樣，是在熱血過後突然回歸日常的空虛感，如同電影的演員們也期待著正片

  的產出，我是帶著這樣的期待回到家才補上《記憶戰隊》。


  也因此當看著正片時，多了一種參與其中後看到成果的感動。



  記憶戰隊ep 1


  記憶戰隊ep 2


  記憶戰隊ep 3





  【拍B級殭屍片】


  恐怖片或是鬼怪系列的電影一直都不在我的清單裡，上一部進場的殭屍片是《一屍到底》

  ，還是在好評不斷且不只一篇評論保證不恐怖的狀態下，我才願意進電影院嘗試，即使這

  樣還是有幾個點嚇到我。


  當看到這個電影名稱時，非常直覺反應也是連結到《一屍到底》，兩部片的重點其實都不

  是B級殭屍片，而是「拍」這件事本身。

  忘不了當年驚豔於《一屍到底》用倒敘的方式，解開前面20分鐘觀眾眼中非常爛的殭屍片

  （甚至有人看了前15分鐘就受不了離場），在這一層一層解答的過程中，那些啊哈的瞬間

  成為了讓人難以忘懷的笑點。


  當年在那些讓人驚喜的笑點外，我看到更多是我們辦活動的不容易，活動往往沒有ＮＧ重

  來的機會，就跟一鏡到底的影片一樣，所以只能在每個出包的時候，團隊成員們互相補位

  去挽救錯誤，即使最後的成果看起來搬不上檯面，但背後的努力只有真正參與在其中，見

  證過混亂的人才能懂。


  而《邀阿公阿嬤拍Ｂ級殭屍片》所拍攝的《記憶戰隊》雖然不是一鏡到底，但難度完全不

  亞於一鏡到底的拍攝方式，因為94歲的女主角蔡鍾景妹在十多年前被診斷出失智症，而在

  《記憶戰隊》用殭屍片的方式來訴說守護記憶的故事。




  【邀阿公阿嬤】


  隨著步入高齡化社會，如何連結青銀創造更多不同可能成為許多人努力的目標。


  導演從帶著家人一起拍片開始，成功的連結了家族之間的情感，不同年齡層的親友都很享

  受在一起拍些有趣的影片以及表演中，所以當他們決定要拍《記憶戰隊》卻發現演員數不

  足時，導演進到社區廣邀阿公阿嬤們一起來演戲。


  招募演員的過程其實不順利，遇到許多覺得自己不會演戲，或是認為演戲只能是帥哥美女

  的鄰居們，連導演都有懷疑，自己家庭成員都享受在拍片，是不是真的和一搬家庭不一樣

  。


  但不放棄的導演找了里長和相關協會，甚至找到社區歌友會，在選角當天來了許多社區居

  民，甚至有陪老婆來卻被現場氛圍感染而參加試鏡意外成為主演的大哥，導演將每個人安

  排到最適合的角色，成功串連了整個社區。


  素人演員拍片過程也不順利，戲服永遠穿反的大哥、臨時不能來的演員、現場突然響起的

  手機鈴聲、演員們忘詞或是走位錯誤，更不用說失智症的蔡鍾景妹阿嬤要記住一些複雜的

  指令，還有在開拍前跌倒開刀。

  看著導演用不同方式引導這些非科班的演員，從覺得這一群人在做一件很鬧的事情，不知

  不覺被導演的恆心所感動。



  「蔡鍾景妹是我永遠的女主角，如果不是她就沒有意義。」


  耐心的引導和一次又一次重新拍攝，用自己的站位去引導阿嬤面對鏡頭的方向，一句又一

  句分段提醒台詞，無論重複多少次，導演專注的眼神裡一直閃閃發亮，面對這麼多艱鉅的

  挑戰，依然能一往直前的是對阿嬤最真摯的愛。




  【一封寫給高齡社會的浪漫情書】


  我想這是寫給失智症電影的情書。

  過去大家對失智症電影的印象，往往都是賺人熱淚的，無論是在悲傷中看見希望，或是在

  無限的嘗試後依然失望，帶給照顧者們共鳴。


  而一改過去失智症電影的風格，雖然女主角是失智症的阿嬤，但全片敘事方式幾乎都是用

  輕快的節奏，記錄了許多失智症者的可愛之處，而在這些歡笑中，依然有太多感動落淚的

  地方。




  這也是一封寫給正在陪伴失智症者的情書。


  對於陪伴失智症的家人，難過與失望應該是大部分人都繞不開的情緒，甚至因為照顧的壓

  力替整個家庭帶來了低氣壓。


  而《邀阿公阿嬤拍Ｂ級殭屍片》提供了不同的角度去找到更多可能，相信在電影之外仍然

  有許多我們沒看見的辛苦跟淚水，但在全家人相互支援以及支持下，感受到非常強韌的連

  結。




  這還是一封寫給地方創生的情書。


  當想投入社區的年輕人看到了與社區連結的突破口時，許多新穎又有趣的點子並不一定能

  這麼順利被接受，但堅定自己追尋的信念，看見對方的擔心跟需求，多方嘗試不同可能，

  總還是有機會找到通往共好的路。




  而這一定是一封寫給阿嬤的情書。


  被記得從來就不是理所當然，而是萬分珍貴。所以當導演決定把這一切用影像記錄下來，

  無論多短暫的瞬間，那一刻都成為了永恆。



