title: '[新聞] 《邀阿公阿嬤拍B級殭屍片》票房破百萬'
content: "《邀阿公阿嬤拍B級殭屍片》票房破百萬\n\n2023/11/02 05:30\n\n\n《邀阿公阿嬤拍B級殭屍片》找來阿公、阿嬤化身戰士，演出活潑可愛。\n\
  （天馬行空提供）\n\n〔記者鍾志均／台北報導〕紀錄片《邀阿公阿嬤拍B級殭屍片》記錄導演徐紫柔的奶奶、\n罹患輕度失智的蔡鍾景妹女士與家人之間的逗趣互動，全台票房正式突破100萬，徐紫柔\n\
  開心說：「幸福來得太突然！」迫不及待打電話向家人報喜，透露將籌備演員見面會。\n\n片中扮演「紅戰士」的大舅蔡瑞洲聞訊直呼：「好爽啊！」轉頭問「中壢一朵花」蔡鍾景\n\
  妹奶奶「有沒有爽？」奶奶立刻在電話那頭大喊：「爽！」謝謝觀眾支持。\n\n《邀阿公阿嬤拍B級殭屍片》自10月13日上映，對於短時間獲得票房佳績，徐紫柔感動說\n\
  ：「我希望透過紀錄片向觀眾傳達真實而感人的故事，大家能看到平凡的家族如何用愛和\n失智奶奶相處。」\n\n有觀眾在映後詢問導演續集進度，並自薦要演殭屍，讓徐紫柔驚喜說：「台灣原來那麼多\n\
  人喜歡演殭屍，太酷了！」\n\n--\n佛教經典的\n是 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
