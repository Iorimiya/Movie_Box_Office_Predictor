url: https://www.ptt.cc/bbs/movie/M.1728319484.A.ECF.html
title: '[好雷] 邀阿公阿嬤拍B級殭屍片 荷蘭場'
content: '推薦給誰來看這部片？

  1）遭遇家庭失和的人 （不必失智 失和就好）

  2）心中期待跟長輩良性互動的晚輩

  3）讓小人物在大銀幕發光發熱，如果是你喜歡的題材，那麼快去找這部片來看，讓自己

  開心一點！



  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這一家人怎麼能這麼歡樂地面對人生的挑戰？還願意把家裡的樣子公諸於世！這世間需要

  多一點這樣的畫面！


  因為我的原生家庭，我很羨慕這部片能把「家醜」用嶄新的方式呈現—戲服穿反、更衣過

  程、忘記台詞、照顧失智的家人，這些出糗或患病看診的場景，如果發生在自己家裡，肯

  定會被「審查」不可外揚！「不要在網路上告訴別人我們家的事！」


  （就是連分享家人愛審查內容這件事，要是被家人知道了，又會被罵大嘴巴）


  不需要住在豪宅、不需要攝影棚，不需要重金選角，也能拍出一部賺我熱淚的作品。


  紀錄片尾聲導演在成果發表會致詞哽咽是我的哭點（而本片我笑最大聲的笑點則是飯冰冰

  ）


  這部片能完成，需要多少次請求臨演加入，再被拒絕；需要重複引導多少次最愛的失智奶

  奶，才能得到滿意的鏡頭；多少次想放棄，卻又整理好心情，決定繼續撐下去。


  延伸閱讀-徐紫柔導演在荷蘭的第一次


  全文刊登於



  節錄


  「九十幾歲的奶奶（外婆）教會我的事裡面，最重要的就是不管年紀，天天都值得開心地

  過。對於年輕人邀約做些大膽的挑戰，例如拍攝電影，她樂於嘗試，還感恩年輕人看得起

  她。」


  徐紫柔導演在荷蘭鹿特丹的電影放映會後，如此回答觀眾問她的問題。每個人都值得開心

  過一天，是她跟長輩密集又長期相處的日子裡，學到最重要的一課。


  電影的女主角，紫柔的奶奶－－鍾景妹七十多歲尚未失智前，曾經陷入憂鬱，她從小的生

  活相當辛苦，長大後嫁給拈花惹草的俊俏外公，更多了感情上的困擾。得了失智症的奶奶

  ，笑起來反而比以前更真心開懷。雖然她想起外公時，還是會十分氣憤，但是忘記舊恨時

  刻的奶奶，倒是讓徐紫柔體會到，失去苦澀的記憶，其實可以是一件快樂的事。


  2024年10月2日，徐紫柔剛結束在英國獨立精神電影節的活動，風塵僕僕地背著一個大背

  包，搭乘廉價航空，來到荷蘭史基浦機場，準備參加晚上在鹿特丹的電影放映。


  能讓這部冷門的「長照主題」片上院線、甚至走出台灣，其實背後需要許多年的時間，加

  上果決的勇氣。


  首先，短片《記憶戰隊》花了四年的時間，於疫情前拍攝完畢，紀錄長片尾聲出現的成果

  發表會，恰好辦在台灣出現新冠病毒感染案例的第二天，所以觀眾會看到，發表會上有些

  人已經戴上口罩，還有紫柔導演在致詞時一度哽咽的感人場面。因為當時的她非常緊張新

  冠疫情下，這場成果發表會有可能無限延期，不知道參與的長輩們能不能撐過疫情等到上

  映，所幸最後圓滿完成。




  --'
