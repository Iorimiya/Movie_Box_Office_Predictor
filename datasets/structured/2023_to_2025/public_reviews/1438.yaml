url: https://www.ptt.cc/bbs/movie/M.1429361495.A.981.html
title: 'Re: [討論] 闇黑新世界 臥底好片(有雷)'
content: '我剛看完 從奇摩free movie看到的


  這部真的非常好看 有深度又緊湊 沒有任何冷場 我認為不輸給教父


  順便回答你的問題



  這部戲最重要的橋段就是鄭青在醫院快斷氣時 他跟子成講的一番話


  他看完駭客給的檔案後就知道子成也是警察 但是假裝不知道


  他也知道子成已經知道他知道子成是警察的事情


  (姜科長先告訴子成說鄭青已經知道你是警察,


  但是想不透為何不殺你 ,但這樣對警察這方有利,可先下手為強)


  所以在醫院時鄭青告訴子成


  "萬一我活下來了 你要怎麼對付我?"


  所以在子成想幫他戴回呼吸罩時 鄭青把他手撥開了


  "你一定要狠 才能活下去"


  讓子成了解到 因為鄭青不夠狠 所以讓姜科長有機可乘 挑撥李仲久 派人殺鄭青


  (鄭青火拼後血臥電梯內時 心裡就知道自己和集團都被姜科長玩了)


  也讓他體會 真正把自己當兄弟的是鄭青,


  姜科長 局長 金文二當家 都對他有目的


  所以也讓他轉念 與其當棋子 假裝當黑幫會長 警察的魁儡


  有一天姜科長一定也會犧牲我 還有自己的身分總是成為把柄


  不如...自己當真正的黑幫老大 才能活下去


  反正自己的身分只有三個人知道 那就把這三個人都殺了


  接下來的所有橋段 都呼應了鄭青告訴他的


  "你一定要狠 才能活下去"




  我也非常推薦這部



  --'
