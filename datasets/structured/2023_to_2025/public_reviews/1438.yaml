title: '[雷] 闇黑新世界：超級好看！'
content: '看到板上推薦


  真的超好看的！毫無冷場緊張到底！


  新世界是韓國的無間道


  是新的故事，跟無間道不完全一樣，雖然都是臥底為主軸




  我覺得拍得跟無間道1一樣好看，甚至劇情進展的節奏更精彩，中間完全讓人壓不過氣來，

  超緊張的


  劇情從黑幫的老大被暗殺，黑幫兩股勢力爭奪會長大位展開


  這部電影的男主角就是無間道的梁朝偉，但沒有劉德華那個角色


  電影最讓人欣賞的


  不是男主角（他演得過於狗血）


  而是飾演黑幫大哥的丁青 黃政民


  黃政民的演技真的讚爆了！


  電影板久聞其名今日終於見證


  這個8+9出身的老大臺詞就從一句英文 ，hey brother開始


  非常推薦大家去看這部闇黑新世界



  --'
