url: https://www.ptt.cc/bbs/movie/M.1415740848.A.D57.html
title: '[討論] 闇黑新世界 臥底好片(有雷)'
content: '之前有在電視轉到，不過是中文配音，最近找來看，真的是部好片!








  防雷


















  姜科長的計畫從一開始就是讓臥底李子成在這明爭暗鬥佔到好位置以利之後對集團的控制

  但隨著事情的進展，主角歷經兩次生命危險


  一次是丁青雇的駭客找出了李子成和其他警察臥底(他在主角面前處理兩個警察臥底的地

  方我看了兩次，丁青不想傷害情誼深厚的夥伴卻又很氣憤，主角慌張得直冒冷汗，配上緊

  張的音樂，很好看的一段!)


  第二次是張理事即將要被選為會長，而張理事為了防患未然，決定殺了主角，卻被主角反

  將一軍。


  想請問，姜科長應該也料到張理事選上了會埋掉李子成，為何還要把他推上懸崖邊，這不

  是在逼主角選擇黑幫嗎?若李子成死了，警方還能控制張理事領頭的金門嗎?還是他們有想

  好對策牽制張理事了?


  聲稱正義的警方不斷讓主角陷於險境，只像顆棋子。然而黑道卻和他稱兄道弟，關心他的

  死活。

  在腥風血雨之下主角老婆流產了，逼得他做出選擇。


  最後回憶的片段，大概是主角唯一笑的一次吧!被姜科長選上就是一條不歸路，讓我回憶起

  前陣子看的繡春刀，主角的無奈也無人可訴說。





  不得不說，配上韓文配音氣氛真的差很多!好的劇本，加上厲害的演員演出深刻的心境變

  化，推薦這部!


  --'
