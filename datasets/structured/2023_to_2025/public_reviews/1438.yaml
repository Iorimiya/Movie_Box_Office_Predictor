title: '[討論] 韓片闇黑新世界幾個問題'
content: "這部片是神作無庸置疑,但是看完有幾個問題找不出來\n\n1. 馬東石到底在哪出現的? 明明就在演員名單?\n\n2. 電影有兩部彩蛋(一是兩人去漁港砍人;\
  \ 另一就是一份錄音檔)\n\n   錄音檔網路上找不到討論,可能大家都沒有注意到\n\n   大意就是:\n\n   某人(聽不出來是誰)跑去某個小村莊找一個姜哲華刑警(柳承範飾)\n\
  \n   似乎是要埋什麼伏筆,但我也不知道柳承範飾演的姜刑警在哪裡出現過?\n\n3. 一開始的會長到底是誰殺的?\n\n\n拜託各位了\n\n尤其是前兩個問題,怎麼翻都找不到\n\
  \n--"
