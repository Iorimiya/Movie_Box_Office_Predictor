url: https://www.ptt.cc/bbs/movie/M.1599222122.A.E19.html
title: '[情報] 嚴泰九、車勝元主演《闇黑新世界》導演威尼斯新片前導預告'
content: "威尼斯已經正式開展進入第三日，來自世界的電影紛紛於麗都島上首映。\n\n其中今年入選競賽外展映單元的韓國電影《Night in Paradise》也在昨日進行了首映。不\n\
  過很可惜的是，今年非歐美國家的影人大多因為疫情的關係沒有辦法親身參加影展盛會，\n在昨日的映前記者會上，導演「朴勳正」透過視訊進行 QA 訪談。\n\n而在今日，電影也是出了首支前導預告。\n\
  \n\n不過說起導演朴勳正呢，他和威尼斯影展可真說是「對頭冤家」。事實上他在 2017 年推\n出的作品《V.I.P.》當年是有受到威尼斯的邀請的，但卻被韓國方面的製作公司給回絕了\n\
  。因為他們認為沒有辦法在 9 月初於威尼斯首映後才讓電影在韓國上映，他們已經排定了\n 8 月中的檔期。而今年導演的新片《Night in Paradise》終於順利入選了，但卻碰到疫\n\
  情而無法出席，讓他連續兩次和威尼斯失之交臂，導演也表示非常殘念。\n\n《Night in Paradise》是曾以《闇黑新世界》而打響知名的「朴勳正」的最新編導作品，\n\
  也是他繼《魔女首部曲：誕生》後睽違兩年的新片（看到大家都在敲碗先交出續集）。\n\n\n\n《Night in Paradise》的故事描述男主角 Tae-gu\
  \ 是一個由王先生所領導的黑幫中的箇中\n高手，但為了他生病的姐姐和侄子，Tae-gu 決定整頓他的生活。然而某日，Tae-gu 的姐\n姐與姪子在一場意外中被殺害，而犯人便是衝著他而來。震驚不已的\
  \ Tae-gu 決定尋求報\n復，他先是殺了另一個幫派的老大，並逃到濟州島上。Tae-gu 並不知道他已經被他的幫派\n所拋棄，在濟州島上他遇見了一位名叫 Kuto\
  \ 的男人和他的姪女 Jae-yeon。平時照料 Tae\n-gu 的 Jae-yeon 事實上因病纏身而失去求生意識，同時間 Tae-gu 也預感著有危險即將\n\
  到來。在事情變得越趨複雜之下，相互照應的兩人也因此開始對彼此產生了同情心。\n\n演員方面，由曾以當年同樣入選威尼斯影展的《密探》入圍韓國三大獎男配角的「嚴泰九\n\
  」飾演男主角。與他相照應的女主角則由以《女高校生死了以後》嶄露頭角的「全汝彬」\n演出。除此之外則還有《花遊記》知名男星「車勝元」和《機智牢房生活》男星「朴浩山\n\
  」也將在劇中扮演重要配角。\n\n\n\n《Night in Paradise》將由曾經發行過導演的《闇黑新世界》和《屍速列車》系列的 NEX\nT ENTERTAINMENT\
  \ WORLD 負責韓國國內的發行，其中《闇黑新世界》也是該公司有史以來\n票房第 11 高的韓國電影作品。\n\n《Night in Paradise》尚未排定韓國檔期，預計\
  \ 2021 年才會正式上映。\n\n---\n\n是說我看豆瓣的評價好像不太 OK，似乎劇本出了不少問題，有點可惜。\n\n但還是必須說今年韓國還是頗厲害，三大全都有片入選，柏林主競賽有最後拿了最佳導演\n\
  的《逃亡的女人》，非競賽也有《狩獵的時間》。坎城更不用說，包括《屍速列車：感染\n半導》和林常樹的新片《Heaven: To the Land of Happiness》兩片入選，如果影展照辦\n\
  的話林常樹那片八成也是回競賽。這次威尼斯雖然沒有進主競賽，但還是有這部《Night i\nn Paradise》選入非競賽。\n\n\n\n韓國現在就是就算那幾位大導演沒新片，但其他單元基本上一定會選個類型片來放，能讓\n\
  三大青睞到這樣著實不簡單。\n\n是說林常樹那片這次不是情慾片，走了一個寫實類型的感覺，其實覺得他可以不用丟坎城\n改來威尼斯啊，他畢竟也在威尼斯入過主競賽（《偷情男女》），投的話應該回主競賽機\n\
  率很高。\n\n\n\n--"
