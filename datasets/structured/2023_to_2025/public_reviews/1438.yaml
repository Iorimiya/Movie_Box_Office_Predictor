url: https://www.ptt.cc/bbs/movie/M.1717861423.A.8DC.html
title: '[討論] 韓國-闇黑新世界_副會長手下疑問'
content: '之前看到板上討論李政宰的文，下面推文推薦他演的新世界，

  於是今天就找來看，看完感想是真的好看！

  李政宰夾雜在黑白之間的掙扎和內心轉變，

  黃晸玟從剛出場的吊兒郎當，到後面的反制警方，電梯戰神，兄弟情深等等的

  展現，從肢體語言的小細節，都讓人喜愛他塑造的這個腳色。

  另外的姜課長和李仲久也都有不錯的腳色描寫和塑造。


  但我看完比較疑惑的是，最後李政宰黑化反殺一切的時候，

  副會長的人是如何被他策反的，這個我好像沒有看到明顯的劇情交代，

  因為這是他成為會長的最後一個險關，當然劇情上的翻轉，

  也襯托出他黑化之後，運籌帷幄，覆手翻雲的梟雄轉變，

  但這最重要的一步如何完成的，實在令我心癢好奇，

  想知道大家有沒有什麼樣的見解，感謝！



  -----

  Sent from MeowPtt on my SM-G9860



  --'
