title: '[新聞]  國片「白衣蒼狗」奪坎城金攝影獎'
content: '描述台非法移工處境 國片「白衣蒼狗」奪坎城金攝影獎



  2024年坎城影展頒獎典禮於台北時間5月25日舉行，導演尹又巧與曾威量共同執導的國片

  （Caméra d’

