title: '[好雷] 白衣蒼狗Mongrel'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  午後大雨中步行至華山光點，半身溼答答地趕上17:00場次。原本覺得是一個糟透的預兆

  ，沒想到卻讓這部電影由外而內地滲進我的世界。


  《白衣蒼狗》的光影與聲音是一種即將失傳的手工藝，它的內容直探台灣社會最底層也最

  黑暗的地方。議題性強且多，卻沒有任何令人感到不舒服的刻意。重要的戲，淡淡地說。

  山雲雨夜，悟姆的臉在各樣的光中變化，觀影的時候你看著他，他看著你。直至最後那一

  幕，那一幕你就知道，電影已到了尾聲。我幾乎是一種虔敬的心看完最後字幕。


  年輕的時候大量看過台灣電影（還有那幾年的新加坡、中國各地的藝術片），這幾年少看

  了很多。不是台灣電影少了（總數有沒有少我不確定），而是更主流的題材與拍攝，更多

  類型片的發展。雖然樂見其成，但時常想起的還是那些（當時沒有人看的）老片，像是有

  很多粉也有很多黑粉的楊德昌、早期的蔡明亮與中期的侯孝賢。在我心中《白衣蒼狗》加

  入了它們，那些屬於台灣特定時空下的電影，相信它會成為未來人回頭看我們這段時間的

  一個重要切片。


  場次有夠有夠少，想要看的人必須把握。





  ***


  這裡是我的樂園:





  --'
