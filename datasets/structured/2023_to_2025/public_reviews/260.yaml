title: '[雷] 白衣蒼狗：活在這樣的人間'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《白衣蒼狗》：活在這樣的人間\n\
  \n1 萬洛‧隆甘迦 演出了我很想看見的角色，不依靠言語，透過細微神情和動作說故事。\n\n悟姆就跟這部電影給人的感覺一樣，安靜深沉。\n\n2 這部片需要良好的精神觀看，適合大螢幕。故事本身非常壓抑，所以更需要仔細看導演\n\
  怎麼透過聲音串場，車聲、雨聲連結，用光影在灰暗的故事中增加適當的溫度，也有巧妙\n的轉場安排。\n\n3 全片最重要的象徵：畫面開始明亮的時機。\n\n全片前段畫面晦暗，移工們沒拿到薪水，只能徒勞的繼續工作；久病的病人等待醫治，接\n\
  受毫無生氣的未來。\n.\n明亮的光，在移工英德莉死後才出現在畫面中。\n\n死亡帶走了生命，但其他移工因此獲得更多工作機會。而阿輝抗拒進入療養院，阿姨也請\n\
  求悟姆幫助阿輝解脫。\n\n第一層涵義：當死亡成為選項，讓活在地獄人間的移工跟家屬看到了「希望」，解脫的希\n望。\n\n第二層，則是當悟姆意識到放棄的後果（死亡），所做出了更多努力與掙扎，比如教其他\n\
  移工接手照顧阿輝等。「死亡」讓「向生」有了意義，而不是苟延殘喘。\n\n白衣蒼狗，代表世事變化無常。悟姆透過死亡做出有意識的選擇，前方充滿了光亮；又在\n被同伴質疑發不出薪水時，意識到自己的被動和無能，再度躲回黑暗角落。\n\
  \n有意識的走向光明，無謂的在黑暗中掙扎爬行。他們就在明滅中，循環往復。\n\n4 一批又一批的移工帶著期盼到來，真的有翻身的希望嗎？\n\n《白衣蒼狗》在這樣的艱難處境中，透出一些人性光輝。像是悟姆對客戶的貼身照顧、雇\n\
  主對英德莉出自單純善意的問候，或是悟姆對已逝的英德莉的掛念。\n\n全片最有意義的鏡頭，就是這些角色互相凝視的長鏡頭。雖然不知道盡頭在哪、怎樣做才\n是真的善、真的解脫，但一切都被確實的看見、凝視。\n\
  –\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n\n--"
