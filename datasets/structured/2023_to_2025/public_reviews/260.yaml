url: https://www.ptt.cc/bbs/movie/M.1751696817.A.636.html
title: '[] ［好雷] 《白衣蒼狗》：國片單一定鏡的美學新'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  臉書原文轉載處：



  【《白衣蒼狗》：國片單一定鏡的美學新突破】


  如果講到單一機組的定鏡長鏡頭，很多人會想到沉悶的80、90年代國片。對，就是那個被稱為「台灣新電影浪潮」的國片時期。但在2024、2025年的今日，如果說時隔30、40年，《白衣蒼狗》還遙相呼應著「新電影浪潮」的美學，那麼它不僅是成功了，還更是超越了那個時代。在《白衣蒼狗》裡，許多定鏡長鏡頭，它美得像是在觀賞一幅油畫，而且完全不會讓你覺得沉悶，甚至淒美到令人在電影院裡為之動容，它很成功地用了過去新電影所沒有的技法，這是國片的一項突破。

  　

  這也難怪，即便在這個商業片流行、新電影浪潮已死的今日，《白衣蒼狗》仍然拿下了金馬最佳新導演獎，最佳攝影、最佳美術設計、最佳音效的提名，也拿下了坎城坎城金攝影機獎特別提及，以及亞太電影大獎的最佳攝影獎。



  《白衣蒼狗》講述的是一位在台從事看護的非法移工故事。因為是非法居留工作，他遭遇了許多難以想像的道德兩難，例如：

  　

  受照顧者病危了，你那是否要叫救護車送醫？叫了救護車，等於這群非法移工都有可能被政府發現，那移工夥伴的生計與他們在遠方的家人，又該怎麼辦？

  　

  當非法移工孤身一人，面對受照顧者臨終前生不如死的苦苦哀求，你身後沒有整個醫療看護體系的支撐，那你到底要不要接受協助其自殺的請求？

  　

  當非法聘僱的雇主已不時欠薪時，作為非法移工的你也無處可去，面對雇主要求你繼續安撫其他移工、甚至再要求你誘拐其他同鄉加入非法移工的行列，那你要保持著什麼樣的態度？



  諸如種種兩難，是我們一般人難以想像的生活，卻是他們日常工作所可能要面對的，非法移工是台灣底層人物的悲歌。導演之一的曾威量，是新加坡人，他卻花了好幾年的時間在台灣偏鄉地區進行田野，挖爬出這些悲劇，雖說是電影，不一定是真實，但可能故事的來源都皆有所本。

  　

  故事的主角由泰籍演員萬洛普‧隆甘迦（Wanlop Rungkumjad）飾演，他是歷經上述種種道德兩難的悲劇人物。萬洛普在戲中演得非常的好，人們說他是「泰國梁朝偉」，善於用表情說話。

  　

  在《白衣蒼狗》裡，全戲大多的場景都有他的存在，其角色身為社會最底層的卑微人物，萬洛普在片中絕大多數都是面無表情，因為一個低賤的人，在社會之中，是不被允許有太多的自我表達與存在感的。他們活著的每一刻，表情與情緒管理是生存之必要。萬洛普演得好就好在，即便全場面無表情，他也能夠透過臉上的細微之處，讓觀眾隱微地體察到他內心的起伏。

  　

  也就是這樣的面無表情，讓整部戲獲得了極大的悲劇襯托張力：在全戲之中，他只笑過一次，那是在什麼時刻？那是在雇主對他欠薪、還毆打他的這種不對等關係之下，他受雇主要求，在東南亞來的觀光團所下榻的飯店門口，他成功慫恿了一票同鄉脫團，上了非法招攬移工的車子。

  　

  當觀光團的導遊在後面追著他們，萬洛普成功把人帶上車、關上門、揚長而去，此時他開心地笑了，發自內心開懷地高興，這是他片中唯一的一次笑容。

  　

  他把劇中唯一的笑容，用在這種被人賣了，還幫賣你的人數錢時的開心。這個表情設計的安排，非常高明。彷彿所有面無表情的苦悶只為了全戲的這一刻：看看我們，活得多麼的低賤！



  《白衣蒼狗》的片名，也反映了這種低賤。據導演曾威量受訪時曾表示，劇名是來自於《老子‧第五章》：「天地不仁，以萬物為芻狗。」

  　

  而我自己是做《老子》研究的，聽到導演用這典故，覺得這用典很狠。古人祭祀時，「結芻為狗」，把草稈結成狗的形狀，放在祭台高高在上當作祭品，等到祭祀完了，就變回低賤的草稈編織物，丟得滿地都是，任人踐踏。

  　

  也許移工的存在，對於一個社會來說就是這樣。當人們需要他們時，社會求著他們來，等到不需要了、等到他返國歸期將至，這些人又被視作是毫無價值的存在。

  　

  而《白衣蒼狗》的英文片名又更狠：「Mongrel（雜種狗）。」這低賤的狗還被稱作「雜種」，非法移工他們明明也是社會的一份子，但卻礙於身份，他們既不屬於這裡，也不屬於他的家鄉，他們的身份成了一種「雜種」，不被兩邊所認同。



  《白衣蒼狗》大量使用的定鏡長鏡頭，我之所以認為是個美學突破，如果先撇開鏡頭語言的分析不談，我的理由很簡單：因為這部片，它一點都不無聊。即便是時間漫長的定鏡長鏡頭，也絲毫沒有讓人想要快轉的不耐。

  　

  我是一個90年代國片看很多的觀眾，會看很多的原因，不是因為它好看，我甚至時常受不了「台灣新電影浪潮」那時期的國片。

  　

  我之所以會看很多，是因為那時的同學、朋友們，常被挖去拍片；自己的高中作為藝術學校，也常有國片來取景；甚至學校老師也是某導演的御用演員，幾乎每部片都有他。我也因此就接觸了大量的國片，再加上國片場景多取材自台灣，也就更有份熟悉感（甚至有兩、三部國片的所有取景，我全都認得每一個場景在台灣的何處，剛好都是因為地緣關係，不是在我家周遭取景、就是在我高中及其周遭取景），但這不代表我覺得它們都是好看的電影。

  　

  以前國片的長鏡頭，實在是難以令我忍受。

  　

  不講片名，隨便舉個例來說，有部片，中間一段兩人對話的場景，突然話題沒了，主角便在房間內從屋內的一頭起身、走去屋內的另一頭倒水、再走回坐下。這段倒水、喝水的片段，在一般電影裡，就會用剪接的方式，幾個畫面，快速兩、三秒中結束，並且特寫演員的面部表情，以表達他去倒水緩解話題中斷的尷尬之情。但過去的國片就硬是不這樣做，一個長鏡頭花了十幾秒，也看不清楚演員表情，就真的只是放了個倒水、喝水的片段，完全不知道幹嘛，快轉過去也沒差。

  　

  縱使是經典名作的名場面也是如此，一個人最後要離鄉，長鏡頭就拉遠定鏡拍他從村口往外走，一直走、一直走，演員回頭看了一眼村子，但為了鏡頭能容得下這整個步出的畫面，鏡頭遠到你根本看不清楚離開對這角色的情感表達。於是這個長鏡頭就讓他這樣子一直走、一直走，本來幾個畫面剪接，半分鐘就完事的場景，以前的國片就硬是要拖了幾分鐘。

  　

  80、90年代國片之所以要用長鏡頭，除了經費不足，導致只能單機定鏡拍攝；再來就是為了加入WTO而開放國外電影，導致好萊塢商業片佔據市場，國片收入銳減；加之政府電影政策錯誤，輔導金只補助國際影展獲獎，致使那時的國片為了生存只能走向沉悶的藝術電影風格。這些幾乎都是電影教科書級常見的理由。

  　

  正是因為窮，經費不足到連剪接都沒有了，更不用說片中插入配樂、重新配音了，基本上都是現場收音，畫面裡充斥著現場的白噪音。這使得80、90年代的國片更顯得沉悶，長鏡頭過程中那些無意義畫面配上彷彿靜默般的白噪音，令觀眾置身在一種需要等待劇情發生的尷尬之中。



  但《白衣蒼狗》的厲害之處便在於，它把長鏡頭、白噪音、缺乏製作成本……，這些原本被視為國片劣勢的地方，都轉化成片中的優點，真是化腐朽為神奇。

  　

  首先，在定鏡單拍一人的畫面處理上，《白衣蒼狗》的長鏡頭常常是正面拍攝主要演員，畫面正中剛好對齊演員的鼻頭，讓整個畫面可以很清楚看見演員的細微表情，讓演員的「表情」得以成為敘事的利器。這避免了過去國片想要從遠距離把演員一連串動作都想納入在一個鏡頭裡的想法，過去的手法反而使得演員的演技難以被觀眾察覺。

  　

  並且在定鏡單拍一人時，《白衣蒼狗》常是讓畫面背景全是黑漆昏暗的，透過暗背景的明暗對置關係，把光線主要佈置在演員身上，使得許多畫面彷彿就像是在欣賞文藝復興時期的人像油畫，充滿著戲劇性的劇場效果。

  　

  對表情的細微觀察，再加上人像油畫般的美感，使得《白衣蒼狗》的長鏡頭令人怎麼看也看不膩，彷彿每一幀畫面都在欣賞藝術品似的。

  　

  這也大概能夠理解，導演為何會特地飛去泰國，以懇求萬洛普這位原本要放棄電影轉行當廚師的演員。《白衣蒼狗》在選角之初，主角便只選定萬洛普，他是唯一被面試的主角人選。大概可以想見，如果不是善於用表情說話的「泰國梁朝偉」，實在很難駕馭這種要長時間被鏡頭特寫上半身的畫面。



  再者，在定鏡拍攝多人場景時，導演往往很細心地佈置了遠景、中景、近景三個層次，讓即便是定鏡長鏡頭，也可以熱鬧非凡，每個畫面細節都有玩味之處。我印象最深刻的一個場景，是雇主招待移工去唱KTV喝酒時的畫面，因為KTV有陪酒的、喝酒的、唱歌的、招待的、被招待的種種互動關係要呈現，他就讓近景有人從畫面伸出手來進入鏡頭起舞揮動、中景是杯盤狼藉的桌面、遠景則是KTV沙發上坐著的主角與眾人之間的關係呈現：一個被欠薪的非法移工在慶功場合提不起勁的尷尬，台灣某些中小型企業雇主就這樣，寧可薪水先欠著，有賺來的錢也要先喝酒叫小姐大家爽一ꐊU。

  　

  使得這即便是定鏡拍攝，畫面也可以瞬間豐富了起來。整部戲可以有唯美的靜態一人特寫，也可以有著熱鬧而豐富的喧嘩感，如此場景隨著劇情交替，整部戲的氛圍也有起有落，而不落於煩悶。

  　

  遠中近三景在同一畫面的紛陳，不只需要導演的細緻安排，也更需要演員在表演時同時留心場景的Q點，甚至這Q點不只存在於地面，還更是要進入鏡頭畫面的立體結構當中去留意。

  　

  一幕玖壹壹春風所飾演的雇主毆打萬洛普的場景，導演把單方被虐的動作放至遠景，並用一扇門作為中景，使之框限於其中。那是一個狹小的視覺空間，演員受毆會跌落至框限之外，但又要讓動作很合理地再滾回框限之內，以避免動作的發生長時間在觀眾視覺以外發生。

  　

  我個人覺得把受虐放至到受框限的遠景之中，是很好的美學處理。畢竟拉近到近景，那就成了把頭破血流硬是擠到螢幕前的灑狗血了。一部好的傷痛美學不需要哭天喊地、不需要撕心裂肺，它光是在遠處，甚至不需要加之以言語指控，人們便會為之動容。因為真正的社會傷口，它不需要被說明、也不需要被凝視，我們光是一想見到此，就痛如己身、難以忍受。

  　

  所以，誰說拍電影，鏡頭要有所移動，要鏡頭有照到的才是敘事？《白衣蒼狗》它寧可讓一些事物、動作、人物發生在鏡頭之外，留給觀眾一些想像的空間。這也是為什麼這部片有時其他演員的入鏡很奇妙，是從畫面中間的正下方，突然冒出一顆頭，由近至遠地走入場景之中。這些畫面外的敘事與入鏡，反而更增添了許多驚喜與觀影後的討論空間。



  最後，則是白噪音，《白衣蒼狗》的白噪音用得太巧妙了。過去國片的白噪音，常常就真的只是無意義的背景聲而已。《白衣蒼狗》的出場人物裡，有著身心缺陷的殘疾人士、也有著臨終垂死的病患，當背景裡充斥著咿呀咿呀的呢喃聲，或是垂死時快慢不同的喘息聲時，畫面不需要拍攝到他們，觀眾也能從聲音獲得劇情轉折的暗示：在咿呀咿呀的呢喃聲裡，雖然沒有語言，但我們聽得出來身心障礙者在生理慾望上的渴求；在逐漸孱弱的喘息聲裡，不需要鏡頭畫面觸及，我們也能知道生命的告終。

  　

  而大雨，屋外淅瀝嘩啦的巨大白噪音，壟斷了屋內一切收音。這種干擾，在《白衣蒼狗》裡也巧妙的化為事件的告終與主角內心轉折的暗示。



  我對於《白衣蒼狗》的導演們仍大量使用定鏡長鏡頭，感到十分驚訝。在技術發達的今日，拍攝設備、剪輯軟體越來越易於取得和操作的情況之下，經費不足的這種理由已經不復存在了。甚至現在這個時代只要幾台手機，也可以做出多鏡頭的切換和剪輯，全片手機拍攝躍上電影螢幕的事，早已不是新鮮事。

  　

  在金馬的映後座談，我曾經問過導演曾威量：為何要採用定鏡長鏡頭？而鮮少進行剪接切換鏡頭？這有什麼美學考量嗎？我不相信如今的導演還像80、90年代一樣資源貧乏。

  　

  曾威量的回答很有趣，他說，他還真的是因為「窮」這個理由。他要我去看看他的履歷，就會發現他的電影作品是一年有、一年沒有，如此這般交替，這是為什麼？就是因為他窮到必須先去賺錢一整年，賺出來年拍片的錢。

  　

  也許今日國片導演的「窮」，早已跟80、90年代的「窮」也不一樣。曾威量也補充說，如果有多個拍攝機組，當那然也很好，但他寧可把這些錢省下來，把拍攝場地租久一點、讓演員多演幾回。他說他一個鏡頭通常會拍7個Take，前三回讓演員自由發揮、中間兩到三回他來做指導調整、最後幾回再讓自由發揮與演技指導自然融合，於是每一幕他需要把經費花在較長的拍攝時間之上。他也提及定鏡的理由，是為了讓他方便剪裁畫面，這樣在視覺設計上比較好掌控。



  《白衣蒼狗》是部沒有上院線的片，雖然影展加播了好幾次，而要買票現在都還有機會。曾威量看起來是一位將社會關懷的議題推動先於影片獲利之前的導演，他覺得沒上院線也很好，這樣每個場次就可以辦映後座談，像現在這樣大家來聊聊。正式的映後座談結束後，他還意猶未盡，在電影院外搬了凳子，大家站著圍著他和演員閒聊，一個映後座談他給額外延長聊到三個小時，比電影的128分鐘還長。即便他出生於新加坡，但他對於台灣社會議題的關注，溢於言表。

  　

  我個人反而是覺得沒上院線給更多的觀眾欣賞是很可惜的一件事。台灣政府在推動長照2.0，不乏外資長照集團帶著大量投資入台響應，甚至有的集團喊出最終要每個鄉、鎮、里都做到都有一間長照中心的野心，我認為要找贊助推廣此片，是很有機會的。

  　

  畢竟，看完《白衣蒼狗》，人生大概不會願意讓不專業的非法看護去照料你的臨終。他們背後沒有一個醫療看護體系的支撐，會讓你暴露在不專業看護的生命風險之下，不僅如此，要讓一個非法移工迫於生存窘境要去面對眾多的道德兩難，這反而是受照顧者讓照顧者陷於道德困境的「不仁」。

  　

  這種「不仁」、或者說是呼應《老子》的「天地不仁」，也是這部片對於萬洛普所飾演的主角精心的角色情境設計。在片中，也許每個人都有著他們的無奈，但就只有萬洛普是心地最好的「仁人」：非法移工夥伴患病了不能去就醫，只有他自願扛起對方的工作，並且不多拿一分；對方過世了，每個人都缺錢，但發下來的錢他沒私吞，他放到對方被草草埋葬的土堆前；許多夥伴做看護敷衍了事，甚至嫌棄受照顧者，但就只有他能夠體察受照顧者的內心需求，額外去做不在他本分裡的事情。

  　

  把這樣的一個仁人、好人，給放進眾多道德兩難的生存困境之中，是《白衣蒼狗》全片的最大張力，也是這個社會的殘忍之處。

  　

  看護事業要只憑一個人的仁心是不夠的，還需要專業體系的支撐。我想政府和長照集團，應該會很樂見《白衣蒼狗》這部片意外地提醒了大家，民眾支持長照政策並循合法看護的重要性。



  我相信《白衣蒼狗》應該是國片史上的美學新突破，也是台灣新電影浪潮的再次復辟；但我不相信的是，這樣的突破只是因為「窮」所產生的美學偶然。畢竟有訪談指出，在2014年金馬電影學院曾威量受指導時，剪接指導廖慶松廖桑建議他要影片剪接，但曾威量仍堅持「用一顆幾乎靜止的長鏡頭去呈現」他的電影。

  　

  曾威量在《白衣蒼狗》映後座談不知道是不是開玩笑，他說，他完全沒辦法手持拍攝的畫面，像婁燁的電影裡一堆手持，那個鏡頭之晃呀，會讓他感到頭暈，看婁燁的片他要吃暈車藥才能看完。他講這話時，全場哄堂大笑。

  　

  這反而是我比較願意相信的技藝敘事，誠如其他偉大的作品一樣，人要有異能，作品才會有異彩。

  　

  笛卡兒因為有失實症，才會去懷疑真實世界的存在，進而才有「我思故我在」的三段懷疑論證；邊沁因為有亞斯伯格症並且不近人情，才能夠思考出純粹功利計算的效益主義；竇加因為年輕便近視，讓他的畫風很自然地就進入了印象派的行列；梵谷因為黃視症，看什麼東西都有光暈，才造就了〈向日葵〉與〈星夜〉等名作。

  　

  我很喜歡看婁燁電影會頭暈的曾威量，如果不是因為他的頭暈，我們或許得不到《白衣蒼狗》這麼淒美的作品。


  --

  Sent from nPTT on my iPhone 11


  --'
