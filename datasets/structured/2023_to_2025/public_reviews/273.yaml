url: https://www.ptt.cc/bbs/movie/M.1750595454.A.F08.html
title: '[極糟雷] 儀弒'
content: '首先不得不吐槽的，就是導演頭到尾都在晃個不停的拍攝鏡頭。真的不知道他是想營造第

  一人稱視角的臨場感，還是純粹因為預算不足，場面粗糙、剪接也不夠細緻，只好靠這種

  偽紀錄片方式的手持攝影來掩飾製作上的拙劣。不過老實說，我覺得應該是後者啦。



  片中總共有六場驅魔儀式，到第二場神父對女孩念咒驅邪那段，我差點直接吐出來，我當

  下一度以為自己也被什麼東西附身，所以聽到神父在念咒驅魔時，我完全跟電影裡的女孩

  一樣痛苦掙扎，然後當下我蠻想跟我朋友說我身體不太對勁，畢竟整間影廳只有我們兩個

  ，變得更加詭異，但我還是硬著頭皮忍下來了。



  真的不誇張，整場下來搞得我眼壓跟腦壓都快爆炸，甚至到最後一場儀式可以說是你根本

  不用看，那個「震撼」的畫面我怕看完會走不出電影院，是真的很扯，我就問攝影師你的

  手是要多抖？而且我買的飲料（鮮奶茶）都完全喝不下，因為一喝就想吐，喝起來突然變

  超難喝的那種苦茶，大概從第二場我快吐那段開始我就不太能看畫面了，只要不是關鍵劇

  情我就閉目養神，或是只看字幕避開影像。



  劇情方面雖然算流暢，演員表現也都中規中矩，但整體故事跟角色描寫非常單薄，驅魔橋

  段也只是蜻蜓點水，缺乏層次、情緒堆疊與感染力，唯一能說的是演技還行。



  恐怖片最忌諱的就是只靠音效嚇人，而這部片不但成功踩雷，還加碼用令人想抓狂的拍攝

  手法加上過度誇張的高分貝音效，堪稱地獄級體驗。不誇張，明明沒什麼事、沒什麼劇情

  ，也要硬塞個可怕的音效來撐場，可見如果少了音效，劇情真的會無聊到睡著。



  只能說，就算再好的演員也救不回這糟透的拍攝手法，真心建議想看這部片的人要三思啊

  ！！別太衝動，除非你真的想體驗看看什麼是「4DX版中邪」






  救一個算一個




  原本要看28年毀滅倒數，但一面倒評所以換看儀弒，結果也是吐槽滿點





  D10


  --'
