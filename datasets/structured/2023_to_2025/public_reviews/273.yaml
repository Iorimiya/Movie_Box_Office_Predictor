title: '[  雷] 儀弒 XD'
content: "雷文防雷資訊頁\n \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n \n\
  \ \n \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n \n \n雷文防雷資訊頁\n\
  \ \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n \n \n \n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n \n \n\n觀影證明：\n \n\n前言：\n對帕西諾爺爺不熟，主要是想看野獸；一直覺得他有股渾然天成的邪氣可惜都沒有接到比較\n\
  強檔的院線，他是天生的反派、14年的神秘訪客雖然是小品但那真的給人印象深刻。\n\n劇情：\n正如板上第一篇心得驅魔儀式共六段，不過是好結局，前五段區到一半突然就安靜過場有點\n\
  白ㄘˉ看起來像是被人馬上澆冷水，只是這種片靈動特效一定要多一點不然真的難看，就算\n用不起綠幕好了，一些簡易的機關不會花太多錢吧？感覺有用到電腦特效的應該是最後一場\n\
  驅魔儀式惡靈被驅散女主身後冒黑煙大致上就這樣，好像有提到兩位惡靈的名字，不過這有\n需要聖經裡面幾十位天使的名字才能驅趕？然後竟然就冒個煙沒了實在傻眼，不過有喜歡的\n\
  明星即使演到爛劇本光看他表現也是OK的啦。\n\n結語：\n如果不是靠兩大男演正常發揮的演技，這部片台譯又J樣，花全票進場的朋友實在是財富自由\n不是小弟要說。\n\
  ----\nSent from  on my iPhone SE 3\n\n--"
