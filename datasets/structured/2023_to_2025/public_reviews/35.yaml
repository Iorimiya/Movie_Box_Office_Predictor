url: https://www.ptt.cc/bbs/movie/M.1761838433.A.977.html
title: '[好雷] 必須要看暴蜂尼亞'
content: '剛看了口碑場


  這部劇的劇情很簡單

  但是因為劇情太簡單了

  (中間我一度覺得這電影劇情進行不下去了)

  所以劇本對於演員的挑戰很大

  本片觀賞重點就是男女主角

  「一本正經講幹話」的能力

  真的是突破天際了，兩位都超會演


  無論如何很推薦大家在下個月上映時趕快去看

  因為到時候很可能會有很多負雷

  主因是導演個人風格問題

  尤格藍西莫就是會搞些小動作讓觀眾不悅

  比如說不悅的畫面和不悅的音效

  請大家不要被這類評論嚇到就不去看





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  結局出乎意料我很傻眼

  所以各位要盡早去看

  以免不小心被暴雷

  可能會失去一些觀影樂趣


  --

  很好懂

  有可能是導演目前最好懂的一部片，可以感覺到他有些新嘗試

  好懂到我中間一度覺得：所以你這部片還有什麼要講的？

  難道又要討論非普通教慾那種瘋子父母？

  結果沒有，然後結局超展開，我被啪啪打臉'
