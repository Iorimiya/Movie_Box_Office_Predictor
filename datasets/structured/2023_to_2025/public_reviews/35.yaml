title: '[好雷] 暴蜂尼亞'
content: "這部片被劇透會大幅影響觀影體驗。請先看完再往下拉\n \n雷文防雷資訊頁\n \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \ \n雷文防雷資訊頁\n \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n \n雷文防雷資訊頁\n\
  \ \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n \n雷文防雷資訊頁\n \n \n\
  \ \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n \n \n \n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n \n劇情雖然是改編但是維持尤格藍西莫一貫的腦洞大開風格\n一開始還以為只是兩個精神病人綁架大公司CEO而已\n\
  不過劇情怎麼可能這麼簡單呢\n \n但是電影前半就真的讓觀眾覺得，就是兩個精神病人綁架大公司CEO的簡單故事\n我看到一半甚至覺得小弟會放人走然後大哥被警察抓就結束\n\
  然後小弟飲彈自盡，大哥聽到槍聲直接放蜜蜂殺警察\n直到這邊雖然劇情高潮但是我都還覺得什麼外星人都是狗屎鬼扯\n \n然後CEO用冷凍劑調虎離山引大哥離開，打開地下室密室之後\n\
  襪靠，真的有外星人啊，還有解剖證據\n \n之後大哥跟CEO回到公司的時侯，看到用計算機敲密碼加上躲進衣櫃傳送，這真的太蠢，\n一點都不高科技，我忽然又不信外星人了。覺得只是拖時間引警方來逮補綁架犯的伎倆\n\
  \ \n然後大哥爆炸身亡之後，CEO跳出救護車回到案發現場，撿起計算機躲進衣櫃\n進行傳送。 欸幹真的是外星人欸\n \n頓時覺得自己像是被主創玩弄的牆頭草，也像股市中被大戶玩玩弄的散戶。總是看到一點\n\
  跡\n象就腦補全部，沒有堅定信仰\n \n最後女王戳破地球泡泡。人類滅亡。我以為是讓地球沒空氣，結果內燃機持續運作，狗貓\n也都還活著，或許不是讓地球沒空氣。而是只讓人類滅亡的招數\n\
  \ \n最後roll card只有鳥叫聲還有雨聲，完全沒有人類的地球。\n \n \n \n補充一下。這部片是使用vistavision拍攝 跟一戰再戰一樣\n\
  --\n\n\n我也是"
