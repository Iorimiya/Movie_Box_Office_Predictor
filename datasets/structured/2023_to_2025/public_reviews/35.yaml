title: '[好雷] 暴蜂尼亞'
content: '首先我要跟泰迪道歉

  在結局前我一直很瞧不起泰迪這個角色

  我以為他是個沒長大的精神病受虐小孩

  除了家庭問題還疑似被警察做過奇怪的事

  但想要透過暴力轉移他承受的種種

  並且妄圖獲得看似大公無私實際上是一己之私的好處


  可是我錯了

  他沒有背景、沒有知識、沒有資源

  靠著跌跌撞撞歪七扭八的方式一路努力至今

  他在自己的摸索之下發覺一般人根本不可能看透的事

  在實行計畫中也一直監守原則並保持最大的克制

  然而他沒有辦法兼顧一切秩序和平還能打破種族藩籬

  最後在對的方向上被自己錯誤的方法害死功虧一簣


  這部片除了女主角艾瑪史東的驚天演技

  幾乎所有情緒的堆疊都是傑西普萊蒙包辦

  當中泰迪的各種自我喊話、動搖、掙扎猶豫、不甘或決絕

  非常真實一度讓我感到坐立不安的難受

  回想起來很不可思議

  因為在謎底出來之前我真的真的覺得這個角色就是個

  無可救藥無法溝通的陰謀論者

  可是他的每個選擇和行動其實都是編劇不經意的伏筆

  真的好精彩


  我想我會再去二刷把細節再看得更清楚一點



  --

  而且泰迪還要養他表弟

  仔細想真的是被逼到角落的一個邊緣人

  好喜歡這種戲外故事 原來配樂師還有出現'
