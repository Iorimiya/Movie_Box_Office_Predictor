url: https://www.ptt.cc/bbs/movie/M.1762762829.A.BEF.html
title: '[好雷] 暴蜂尼亞'
content: "(written by KAI)\n\n\nIt’s really weird in a good way!\n\n我想要分三個部分來談關於這部電影我想說的，分別是劇情劇本本身、演員，以及導演和\n\
  他過去的歷作。\n\n繼《可憐的東西》、《憐憫的種類》後，Yorgos 再帶來了《暴蜂尼亞》，這部片改編自\n韓國 2003 年的《拯救綠色星球！》。全片以 VistaVision\
  \ 膠卷拍攝，非常喜歡畫面的\n質感。許多長廊的鏡頭也讓我想到《真寵》裡幾個穿梭於不同房間的走路戲，不過這次《\n暴蜂尼亞》大部分的戲都聚焦在一個建構出來的地下室空間中。我很喜歡全片張力都拉在\n\
  滿高強度的對質與互動之中，同時充斥著大量對話及知識層面的詰問，在主演的情緒刻畫\n下顯得更為荒誕。我認爲結局是 Yorgos 非常大膽的選擇（一如既往他總是這麼有才華、\n\
  與眾不同卻又危險地迷人），他知道這樣會讓影評喜好分明，不過正是如此才顯得他的眼\n光及審美獨樹一格。\n\n在觀影後我同樣找了許多演員採訪來補充，其中 Letterboxd\
  \ 的記者提到了一個我覺得很\n有趣的觀點，在《憐憫的種類》裡中間篇故事中，Daniel （由 Jesse 飾演）同樣不相信\n Liz（由 Emma 飾演）是真實的人類，因而進行一連串人體試驗來考證、刺激她的底線。\n\
  《暴蜂尼亞》中 Teddy 對於 Michelle 強烈認定她是外星人的事實也算是對前作的一個\n呼應與小彩蛋，這個連結對我來說挺逗趣的。另外，除了主演的 Jesse\
  \ Plemons 及 Emma\n Stone 在個人魅力的發揮下讓大量對話台詞顯得推進感強烈而不枯燥外，多場由平靜至\n暴怒的啟動的對手戲更甚是精彩。兩位演員的默契極佳，在採訪中\
  \ Jesse 和 Yorgos 分\n別提到，由於《可憐的東西》後期 VFX 花了蠻長制作時間（電影主要以 Kodak Vision\n底片拍攝），因此中間空檔他們拍了《憐憫的種類》，而這部《暴蜂尼亞》也是在同時期\n\
  完成拍攝的，因此 Jesse 說到與 Emma 的交手與互動都非常自然，也很令彼此興奮。\n\n另一個有趣的點是，片中飾演 Don 的 Aidan Delbis\
  \ 當時拍攝《暴蜂尼亞》時年僅 17\n歲，此前僅出演過一些校園演出作品，Jesse 提到他本人的個性和劇中 Don 有極大反差\n，私底下的非常有自信、也清楚知道自己熱愛表演等等，與片中強烈依賴\
  \ Teddy —— 甚\n至被強迫控制 —— 個性形成鮮明對比。Jesse 說他這麼年輕且第一部作品就與 Yorgos\n合作這麼精彩的劇本，他未來發展的可能性是指日可待。同時\
  \ Emma 也在採訪中提到，能\n看到 Teddy 及 Don 性格這麼反差的兩人，卻同時堅信著外星人定論，以及他們的作為是\n為拯救全人類的事實，從不同的角色節奏去推進故事，是一個很特別的呈現。\n\
  \n最後是導演 Yorgos Lanthimos 的部分。我會進影廳看這部就是因為這是他和 Emma Ston\ne 合作的第三部片，也是和 Jesse Plemons\
  \ 的第二部。與 Collider Interviews 的記者\n訪談裡，記者提出認為三年內 Yorgos 連續端出三部極為優秀的電影（意指《可憐的東西\n\
  》、《憐憫的種類》及《暴蜂尼亞》等），他究竟是怎麼做到的？Jesse 則回應 Yorgos\n從主演選角至所有工作人員的選擇都非常出色，從劇本、場景及道具設計與佈置、服裝、\n\
  音樂，以及攝影等皆是一時之選，加上他獨特的審美與創作色彩的展現，使得他的作品令\n人印象深刻。而這部《暴蜂尼亞》在黑色喜劇、科幻、驚悚懸疑中拿捏得宜，最後也帶來\n\
  了令人驚艷的轉折與瘋狂，我認為是繼《真寵》後我第二名喜歡的作品。（沒辦法，我太\n喜歡 Emma Stone 跟 Olivia Colman 這個組合了，實在很難超越）\n\
  \n雖然導演在訪談中提到在拍完這部後，可能需要暫時休息一陣子，我還是非常期待 Emma\nStone 未來再度和他合作的作品，也期待台灣上映《Eddington》（暫譯：瘋狂小鎮愛丁\n\
  頓），等著看 Emma Stone、Joaquin Rafael、Austin Butler 以及 Pedro Pascal 之間\n的化學效應！\n\n--"
