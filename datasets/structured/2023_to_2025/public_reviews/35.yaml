url: https://www.ptt.cc/bbs/movie/M.1762997915.A.ADB.html
title: '[好雷] 暴蜂尼亞Bugonia'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  沉澱了一天之後，覺得特別佩服的是劇本的改編。雖然看到許多人看過原版的人都認為沒

  有什麼改編且原版更好，但只看《暴蜂尼亞》的話，會特別感受到導演、編劇與演員在語

  言上的啄磨，使故事得以站在今日美國文化之中，展現出近幾年的極端分裂的階級結構與

  意識型態。


  艾瑪史東所演出的ceo展示出語言的軟性強制性，以及後續不斷改變方法的語言控制，真

  的會挑動在體制中受傷的現代心靈。


  傑西普萊蒙演出的外星人論者，奇妙切換於控制、瘋狂、憐憫、沮喪與憤怒等情緒中。神

  秘的是，他在完全瘋狂之中，仍可以在「人」面前「表演出一般人」的樣子。這一點，使

  得故事中兩人交鋒變得更加耐人尋味。


  以大場面在使用的原創音樂（交響樂團），配合畫面小而簡的場景，也是我在看這片的時

  候感覺最對的部分。與最後結局的華麗場景一樣，這配樂的方式展現了《暴蜂尼亞》的本

  質：極為精緻的小品，即使用很小的方式也可以講述，但若是規格大得如此，那每一個細

  節都能被更放大去感受。


  回頭看一些了負評，有人說尤格藍西莫拍太多而磨掉創造力。我反而是在《可憐的東西》

  出來之後，還能去做《憐憫的種類》、還能來拍《暴蜂尼亞》而驚喜。




  ***


  這裡是我的樂園:




  --'
