url: https://www.ptt.cc/bbs/movie/M.1763013585.A.D9D.html
title: '[好雷] 暴蜂尼亞  尤格藍西莫最大眾的一部'
content: '我說優格

  你真的有必要每次讓傑西普萊蒙騎腳踏車

  都配上超級大聲的交響樂嗎

  好聽是好聽啦

  但真的有必要嗎

  騎腳踏車真的有這麼精彩嗎



  先說對這部我是完全沒有半點準備

  預告片也沒看 就買好票了

  我知道優格沒有讓我失望過

  艾瑪俗投也是


  我也很慶幸我殺小都不知道

  知道任何東西我都沒有辦法這麼享受這部

  可能我會在好久以前就看了原作

  毀掉我全部的劇情體驗


  體感上大概是優格最大眾好看的一部也說不定

  沒有啥真的獵奇詭異血腥的段落

  也沒有甚麼沉悶詭異的性愛

  沒有藏的很深很詭異的社會議題或是諷刺

  也許是原作在那邊所以收斂了點

  我最近對他的印象停留在憐憫的種類

  看完後大概還在消化劇情

  結果石頭片尾跳舞 害我忘了全部劇情 媽的

  總之 優格的電影永遠都有個怪味

  這部怪味是最少的一部 主題最直白的吧


  其實我在主角開始說外星人的時候就在想

  這女的最後八成真的是外星人

  也只有這樣才能有轉折的力道


  BUT


  這部最精彩的就是

  你知道越多 真相就越模糊

  你想相信陰謀論

  又想相信外星人

  艾瑪石頭的軟弱和求饒

  傑西普萊蒙各種的過去 還有他老媽的實驗

  唐 他...他 ... 沒有 他就是個可憐人

  最後的翻轉翻轉再翻轉

  地下室的屍體 不知真假的故事

  超級白癡的計算機50幾位密碼

  超級好笑衣櫥

  然後最後的最後

  從飛船爬出來的那刻我才真的能確定

  精彩到不行 幾乎整部片都沒有冷場

  緊湊又精彩的節奏 各種藏在石頭身上的伏筆

  但又還是保有優格他擅長的冷酷又乾的定格鏡頭

  用極其沉重的語調 講在荒謬的世界觀下 人與人之間 乃至整個社會的病態


  總之好看

  優格已經掌握了他的電影不敗公式

  讓傑西普萊蒙跟艾瑪石頭瘋狂對話就完事了


  還有我很喜歡飛船 還有超好笑毛衣外星人

  片尾那個恐龍跟屍體的畫面很美

  尤其是中間黑白的飛行老媽 我超愛

  人類永遠不會記取教訓

  可悲可憐的猴子

  蟲鳴鳥叫比什麼人造音樂都美


  --'
