title: '[情報] 《喵喵博物館》全新冒險動畫8/11在台上映'
content: '改編自真實故事 守護藝術畫作的冬宮貓們《喵喵博物館》全新冒險動畫 8/11 在台上映


  動畫（GNN 記者 阿Lu 報導）2023-07-07 18:13:59


  由《冰原歷險記 2》的編劇與《寵物當家》的角色設計團隊攜手打造了一部全新的冒險動

  畫，《喵喵博物館（Cats In The Museum）》將於 8 月 11 日中英文版同步在台上映。




  《喵喵博物館》故事描述一隻名叫文森的流浪貓，在一場洪水災害後與老鼠莫瑞斯成為了

  最好的朋友。他們意外被運送到了艾米塔吉博物館，這個擁有珍貴館藏的博物館。文森在

  博物館中遇到了保護藝術品的冬宮貓小隊，這群貓多年來致力於保護博物館免受老鼠侵害

  。文森希望能擁有更多的貓朋友，但又不願失去他的老鼠朋友莫瑞斯，因此他暗中保護莫

  瑞斯，不讓他被抓住。


  然而，世界上最偉大的名畫「蒙娜麗莎」即將被送到博物館，莫瑞斯對此充滿了渴望。在

  守護「蒙娜麗莎」大作戰的前夕，這幅畫卻突然消失了。文森能否以他的智慧找到畫作的

  下落，維護博物館的聲譽，並同時贏得博物館中最美的埃及貓的芳心呢？




  電影改編自真實的發生的故事，在俄羅斯聖彼得堡的冬宮博物館中，飼養著一群特殊的貓

  咪，他們的任務是驅趕老鼠，以保護博物館中的藏品。據說，第一隻貓是由彼得一世親自

  帶進冬宮的，後來，伊麗莎白·彼得羅芙娜頒布了一項法令，禁止貓進入宮廷，但隨著鼠

  疫問題的加劇，貓們再次被招募到冬宮。葉卡捷琳娜二世授予它們“美術館衛士”的地位

  ，讓它們繼續守護著博物館的藝術品。


  這些冬宮貓多年來成為博物館的一大特色，吸引了不少愛貓人士的關注。博物館曾經飼養

  高達 300 隻冬宮貓，如今剩下約 50 隻。他們平時居住在博物館的地下室，有專人照料

  ，並擁有專屬的貓食堂和貓宿舍。夏天時，他們會在堤岸和廣場上活動。在過去，他們甚

  至可以在博物館的畫廊自由行動。自從 1998 年起，冬宮博物館每年都會舉辦與貓有關的

  活動，並將 4 月 6 日定為「貓日」，定期在每年的 3 月底和 4 月初間舉辦和貓有關的

  活動。2015 年，博物館還建立了專屬網站，讓人們有機會領養這些冬宮貓，並將他們帶

  回家。


  --'
