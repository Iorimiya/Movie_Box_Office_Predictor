  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  自從業火的向日葵後劇場版有越來越好的跡象


  直接一波谷底反彈


  今年直接衝著4DX去看


  結論：真的很爽


  不愧是每年暑期動作鉅片


  出場人物有夠多


  除了黑衣組織跟目暮警官那群


  幾乎都出現了


  原本還以為不會看到煩人的少年偵探團


  沒想到在最後給我出場


  園子因為有錢人的設定太好用所以常常出場


  今年更是連現身都不現了


  直接變擴充套件 遠方支援


  印象中這次應該是青子第一次出現遇到柯南並且對話


  柯南居然沒有想說這人怎那麼像小蘭



  沖田總司後面帶一個來支援的朋友


  這個我在原作就沒有追到他是哪位了


  一瞬間看到一個光頭這麼猛


  手起刀落手起刀落


  還以為是一拳超人




  劇中唯一比較有BUG的是


  柯南在講解的過程中直接把檔案傳送到壞人手機


  啊他是怎麼傳的


  AIRDROP好歹也要問一下對方名字


  還是其實他跟壞人私下是麻吉還會泡茶聊天


  最後的寶藏雖然有點小失望


  但也蠻符合邏輯跟現實


  破解密碼在當時背景確實能夠逆轉戰局


  虧我還期待是超越原子彈的黑科技


  最後的最後就是在幾個月前已經被暴雷的


  柯南基德是堂兄弟的事情


  結論


  讚的啦


  --'
