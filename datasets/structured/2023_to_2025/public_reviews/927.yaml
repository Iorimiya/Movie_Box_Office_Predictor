url: https://www.ptt.cc/bbs/movie/M.1719763844.A.0B0.html
title: '[普無雷] 名偵探柯南 100萬美元的五稜星'
content: "個人評分 7.5 / 10\n\n我已經不太確定這部《名偵探柯南：100萬美元的五稜星》是把它當成偵探片來看，還是要\n把它當成愛情動作喜劇了。\n\
  說這部是喜劇其實是在稱讚，但對於每年都會期待柯南電影的觀眾（不是說我自己）而\n言，應該不會預料到今年是這樣的路線吧？\n\n（比起前一部《黑鐵的魚影》我給 8.0\
  \ / 10，本部我給的評分低了一點，是因為這部少了\n一點對新觀眾的一些劇情解釋，雖不至於到看不懂，但非粉絲會錯過一些原本設計給粉絲\n的劇情彩蛋，這樣子很可惜。）\n\
  \n這部我是看了兩遍我才敢寫評論，因為這部的謎（懸疑）的設計稍微複雜了點，使得說我\n看一次時並沒有看懂整個謎在解什麼，以及所有關係人之間的關係。\n\n這部的尋寶謎其實有兩階段，片頭的有人被殺死，其中的兇手是誰反而不是重點（有在後\n\
  面公佈，但片子中間觀眾的嫌疑人都是意圖奪寶藏的人，誰殺的不重要，重點是寶藏）；\n一個階段完馬上就進入搶寶跟動作戲，然後快速到另一階段。我先提醒是因為你們看的時\n\
  候中間不會有休息。\n\n這部的反派其實算來有三「組」人，基德算第一，而有看過《柯南》或《魔術快斗》系列\n的觀眾都知道基德的設定沒有要真偷寶物；另外兩「組」反派則是這部電影原創，一組是\n\
  父子一家，另一組則是壞得很明顯會爆炸彈、會開槍射警察，又有很多手下的。（提示到\n這邊，我不想暴雷，所以請去電影院看吧。）\n\n剩下的部分我想其他影評應該也會提到：\n\
  * 這部超多北海道函館市的景點特寫，幾乎是個為觀光做的電影，但我自己是覺得是「多\n  到會討厭」。為觀光做片子並沒有不好，我並不希望改掉《柯南》近期電影這樣的推觀\n\
  \  光路線，但至少讓劇中人物為這吐槽一下（你到底是在觀光還是在破案啊，服部kun？）\n* 片子中間主角群跟反派一群人打鬥時出現的某位「神秘嘉賓」居然很多觀眾不認識，這\n\
  \  是一個彩蛋的 fail。那個「神秘嘉賓」沒追柯南漫畫的真的不知他曾經出現過，電影應\n  該要為他的出現做一點鋪陳。\n* 這部跟前作《黑鐵的魚影》也有一種「所有角色都要入鏡」的感覺，這也造成說「有些\n\
  \  原作的小角色在電影只入鏡了幾秒，其出現的時間跟理由很突兀」的問題。\n\n這部的喜劇笑點絕對足夠，但我不想評論這次所謂的「平和黨」（主角平次＆和葉）愛情\n\
  告白怎麼樣（留給粉絲自行判斷），只是說這在《柯南》系列已經是老哏了，未來還要再\n用嗎？\n\n--"
