url: https://www.ptt.cc/bbs/movie/M.1719563896.A.AC6.html
title: '[  雷] 名偵探柯南 100萬美元的五稜星'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  感覺好像提到北海道


  就要把各種元素


  像是新選組的土方歲三


  黃金神威的尋寶


  最著名的景點五稜郭、百萬夜景等等


  全部都放在一起大雜燴


  因為提到尋寶，


  就一定是要強調這次的主角其實是怪盜基德


  又說什麼基德從不偷珠寶以外的東西


  這次竟然會例外偷日本刀


  後來才解釋原來日本刀只是找到寶藏的線索，


  所以其實不算是基德真的要偷的東西。


  當然有怪盜基德，也會出現專門抓基德的中森警部


  只是這次很意外的是連中森警部的女兒，


  基德的青梅竹馬，長相跟毛利蘭有87%像的中森青子也出現


  簡直就是「神偷怪盜」系列全家到「名偵探柯南」系列大團圓。


  最後硬是要加個設定，圓這多年來的問題，


  原來柯南的爸爸工藤優作還真的跟基德的爸爸是雙胞胎兄弟


  所以柯南跟基德其實是堂兄弟。


  那難道中森警部跟毛利小五郎也是雙胞胎兄弟所以女兒才這麼像嗎？


  簡直就是亂搞


  最後補充一個就是從東京搭新幹線到北海道，


  根據時刻表最快也要4個小時，


  難怪灰原哀會說正常人只會想搭飛機。




  --'
