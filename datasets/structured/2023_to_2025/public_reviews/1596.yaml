title: '[新聞] <大愚樂家>鄭肯秀演技，雷李歐塔最後演出'
content: '新聞網址：



  好萊塢大牌雲集，共同演繹娛樂圈雙面秘辛的喜劇電影《大愚樂家》（Fool''s Paradise

  ），即將在本週五（6/16）於全台爆笑獻映。本片由知名男星查理戴（Charlie Day）身

  兼「編、導、演」三職，並找來好萊塢「最佳綠葉」鄭肯（Ken Jeong）詮釋超衰公關角

  色，不僅讓他過足戲癮，更讓他頻頻稱讚查理戴，讓他有了職業生涯中「最棒的表演」！

  同樣在本片展現高度喜劇天賦的，還有已故資深男星雷李歐塔（Ray Liotta），高產量的

  笑話時常被收錄在劇本當中，他對本片的熱衷投入與期待，更是讓劇組成員印象深刻，連

  查理戴都表示：「我很幸運能夠有他在這部電影當中」





  《大愚樂家》以光怪陸離的好萊塢作為故事背景，上演一場演藝圈幕前幕後大亂鬥。這回

  擔任關鍵人物的鄭肯，在本片詮釋陪伴藝名為「拿鐵快點」（查理戴飾演）的男主角，共

  同闖蕩銀河的超衰公關人員「列尼」。為了演出公關一角，鄭肯做足功課並分享：「我甚

  至安排時間採訪了我的公關人員們，訪問她們是如何將工作做得如此出色，也了解這份工

  作的基礎細節。壓力很大、非常辛苦，而且很多時候是被低估的，我認為能夠知道這些具

  體內容很有趣，這真的是很不可思議的困難工作！」



  為了更加凸顯角色的情感核心與重要性，導演查理戴在重拍過程中，甚至還擴增了他的戲

  份，讓鄭肯感到不可思議而驚訝地表示：「這是我職業生涯中從未碰過的事情！我真的不

  是那種會到處隨口說這次很棒、那次很棒的人，但這次真的讓我發揮出史上最棒的表演！

  」當被問到和查理戴合作的感想時，鄭肯也頻頻稱讚對方：「既會導又會演！」「他就是

  那麼棒！」「他的成果值得開花！」一連串的讚賞，連他自己都笑稱：「好玩的是，我在

  片中飾演他的公關，而我現在講這些話，就像是他真正的公關一樣！」





  在《大愚樂家》當中，同樣發揮天然喜劇魂的，還有已故資深男星雷李歐塔。他在本片飾

  演於街上發掘男主角的製作人。回憶起雷李歐塔的演出時，查理戴表示：「他在拍攝時玩

  得很開心，能展現喜劇面讓他感到舒適，看著也很有趣。大概每幾個月，他就會傳訊息問

  我電影進度，也總會來剪輯室幫忙，或毫不猶豫地接受重拍。」據悉，他也常在片場大講

  笑話，讓查理戴著手寫進劇本當中，也讓其他演員們紛紛讚譽，鄭肯便回憶：「他對喜劇

  如此敏銳，可以看見他的投入程度。我們在電影中一起交流了一些場景，我想我會用餘生

  去回首這些事情。」演出大牌女明星的凱特貝琴薩（Kate Beckinsale）也說道：「他是

  位傑出的戲劇演員，在喜劇方面有很棒的天賦，有時會坐在休息拖車外，邊記台詞邊沮喪

  說著『老天，我記不住啦！』真的是很可愛又親切！」談及此次合作，查理戴也感性透露

  ：「我最大的遺憾，是雷無法看到觀眾欣賞他的表演，他是個有動力、堅定又認真對待自

  己演出的人，我很幸運能夠有他在這部電影當中。」並期待觀眾能夠一起進戲院，欣賞他

  的精湛喜劇演出。



  這部集結豪華明星陣容，共同演繹諷刺好萊塢娛樂圈的喜劇強片《大愚樂家》，即將在本

  週五（6/16）於全台爆笑獻映。本片描述一位喪失說話能力，因此被精神病院踢出的男子

  （查理戴飾演），走在路上竟被製作人（雷李歐塔飾演）發掘。由於他跟拒絕演出的大牌

  演員長得一模一樣，讓他誤打誤撞頂替對方，成為開不了口、搞不清楚狀況，卻在超給力

  幕後團隊的精心打造下，成為空前絕後的頂級巨星！他不僅工作接到手軟，還迎娶了美嬌

  娘（凱特貝琴薩飾演），甚至成為模範市民。人生一帆風順到不能再順的他，卻在某次意

  外後，發現這個產業，似乎不如表面上那樣美好…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
