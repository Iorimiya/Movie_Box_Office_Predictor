title: '[新聞] 凱特貝琴薩【大愚樂家】脫衣施展美人計！'
content: '新聞網址：



  由好萊塢知名男星查理戴（Charlie Day）首度自編、自導、自演的爆笑喜劇《大愚樂家

  》（Fool’s Paradise），即將在6月16日於全台歡樂獻映。全片以好萊塢雙面秘辛為背

  景，集結「老周」鄭肯（Ken Jeong）、「奧斯卡影帝」安卓亞布洛迪（Adrien Brody）

  、「資深影星」雷李歐塔（Ray Liotta）等豪華卡司共同演出。尤其查理戴在演藝圈擁有

  絕佳人緣，也意外透過本片，促成《老闆不是人》（Horrible Bosses）三人組再度合體

  ，甚至連《決戰異世界》（Underworld）女星凱特貝琴薩（Kate Beckinsale），都衝著

  他本人一口答應合作，甚至還在片中小露香肩，施展「美人計」勾搭對方，一開口就是「

  跟我嘿咻」，勁爆情節直讓觀眾看得目瞪口呆。





  在《大愚樂家》首度擔綱「編、導、演」三項大任的查理戴，在演藝圈的好人緣，讓眾多

  好萊塢大咖影星都熱情加盟演出，打造出本片的超豪華卡司。尤其查理戴某天巧遇傑森貝

  特曼（Jason Bateman），意外讓《老闆不是人》三人班底再度合體！查理戴對此透露：

  「某天，我送孩子上學時，遇到了傑森貝特曼。當時已經進入拍攝階段，他問我進度如何

  ，我跟他提到隔天要跟傑森蘇戴西斯（Jason Sudeikis）拍攝，他就回我：『老兄！真希

  望我能軋一角！』於是我馬上答應，還通宵為他寫個角色，然後他就來拍了！」



  能夠再度看見好友同台，集體火力全開搞笑，他也大力稱讚：「電影真的很好笑，當你看

  到這『兩個傑森』在一起，基本上只要把鏡頭對準他們，就可以得到很棒的笑果了！」此

  外，本片連客串演員都驚喜連連，從演出過《厲陰宅》（The Conjuring）的史蒂夫寇特

  （Steve Coulter）、《女狼嗨到趴》（Rough Night）的吉莉恩貝爾（Jillian Bell）、

  《西方極樂園》（Westworld）的吉米辛普森（Jimmi Simpson）等人，以及查理戴創作的

  《酒吧五傑》（It''s Always Sunny in Philadelphia）一劇，其演員們與工作人員也都

  紛紛現身力挺，完全展現查理戴在演藝圈的好人緣！





  《大愚樂家》也是查理戴跟《決戰異世界》女星凱特貝琴薩的首度合作。查理戴觀察到以

  動作、劇情片出名的她，戲外經常展現風趣個性，讓他有感而發表示：「凱特是一位傑出

  的女主角，我仔細留意過她的職涯跟訪談，知道她是個有趣的人，可以演出喜劇，但未曾

  有人給她這樣的機會，讓我想要試試看。」所以她向凱特提出邀約，希望能將她的喜劇天

  賦搬上大銀幕。凱特接獲邀約後，也表示自己的女兒是查理的忠實粉絲：「大家都是查理

  粉，他創造一個完整的世界，有點超現實、有種時代感，整體非常有意思。而且這個產業

  對我們來說是熟悉的，有很多事情真的很有趣，特別是得知這是查理的作品後，就覺得一

  定要拍！」她在本片飾演當紅女星，更會一本正經地說出各種讓人噴飯的台詞。她在戲外

  宣傳也依舊展現幽默本色，當被問及與查理戴的合作心得時，她也玩笑說：「查理是本次

  導演，很有效率地指導大家，而且非常努力用他的『小短腿』們極力奔走。」戲裡戲外都

  見證她的幽默性格。



  這部豪華陣容雲集的好萊塢爆笑喜劇《大愚樂家》，即將在6月16日於全台歡樂獻映。本

  片描述一位喪失說話能力，因此被精神病院踢出的男子（查理戴飾演），走在路上竟被製

  作人（雷李歐塔飾演）發掘。由於他跟拒絕演出的大牌演員長得一模一樣，讓他誤打誤撞

  頂替對方，成為開不了口、搞不清楚狀況，卻在超給力幕後團隊的精心打造下，成為空前

  絕後的頂級巨星！他不僅工作接到手軟，還迎娶了美嬌娘（凱特貝琴薩飾演），甚至成為

  模範市民。人生一帆風順到不能再順的他，卻在某次意外後，發現這個產業，似乎不如表

  面上那樣美好…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
