title: '[新聞] 巨石強森「這原因」成【大愚樂家】靈感！'
content: '新聞網址：



  由好萊塢知名男星查理戴（Charlie Day）首度自編、自導、自演的電影《大愚樂家》（

  Fool''s Paradise），以無傷大雅的方式，幽默了好萊塢一系列光怪陸離的現象，即將在6

  月16日於全台爆笑獻映。本片從最初劇本規畫到最後正式上映，中間歷經新冠肺炎疫情讓

  拍攝停擺，還調整內容砸重金重拍，前後共耗費近10年才拍完，連查理戴自己都坦言：「

  時間長到難以忍受！」他除了感謝合作過《環太平洋》（Pacific Rim）的導演吉勒摩戴

  托羅（Guillermo del Toro），以及金主爸爸「激浪」（Mountain Dew），讓自己得以將

  重拍過的「升級版」作品推上大銀幕。值得一提的是，他透露好萊塢巨星「巨石強森」（

  The Rock），竟是他在撰寫劇本期間最重要的靈感來源，就連本片主角的名字「拿鐵快點

  」（Latte Pronto）都是因他而生！





  《大愚樂家》是查理戴在創作美國長壽喜劇《酒吧五傑》（It''s Always Sunny in

  Philadelphia）之後，獲得信心而決定提筆撰寫的第一部電影作品。從最初開始撰寫劇本

  到準備製作，中間已先花費近5年時間，直至2018年才進入真正的拍攝期；不料中間疫情

  來襲，他對初剪成品不甚滿意，手上還有《酒吧五傑》的工作得完成。歷經千辛萬苦，終

  於又在5年後才正式讓電影登上大銀幕。為了這部前後共耗費近10年的作品，就連他自己

  都坦言：「時間長到難以忍受！」



  不過能夠重新拍攝以得到更好的成果，他也歸功於自己的導演好友吉勒摩戴托羅，在調整

  劇本之際拉他一把，拯救了這部電影。同時在籌措重拍資金的部分，他也感謝金主爸爸「

  激浪」並表示：「我能夠為重新拍攝拿出重本，是因為我收到激浪大量的廣告拍攝邀請，

  而我答應了！這樣就可以支付演員和工作人員的費用，替每個人都加了點薪，讓他們能夠

  回來重拍。」雖然本片在調整過後，能在觀眾面前有更佳呈現，但回想起這段耗時良久的

  過程，查理戴也開玩笑直呼：「老天保佑！我希望我再也不會這麼做了，應該說，我絕對

  不會再這樣做！」





  查理戴不只為《大愚樂家》身兼編劇與導演重任，也在片中飾演主角「拿鐵快點」。當被

  問到為何取出如此「特別」的名字，他透露是「巨石強森」給的靈感！原來在劇本撰寫初

  期，他剛好翻到一篇關於巨石強森的文章，讓他不經思考：「這個名字是怎麼來的？」即

  使後來得知，此名源於他在摔角選手時期，但進入娛樂圈後仍繼續沿用，而且大眾似乎還

  習以為常，讓查理產生疑問：「巨石？他在街上走路時，人們會說『巨石』來了！我們居

  然會用無生命的東西來稱呼一個人？」他認為這樣的命名與身份形式，是個有點奇怪卻十

  分「有料」的故事，便在本片使用這個命名概念。雖然巨石強森沒有在本片軋上一角，但

  卻實質影響《大愚樂家》主角命名，並反映出電影所探討的娛樂圈光怪陸離之處。



  這部集結豪華明星陣容，共同演繹諷刺好萊塢娛樂圈的喜劇強片《大愚樂家》，即將在6

  月16日於全台爆笑上映。本片描述一位喪失說話能力，因此被精神病院踢出的男子（查理

  戴飾演），走在路上竟被製作人（雷李歐塔飾演）發掘。由於他跟拒絕演出的大牌演員長

  得一模一樣，讓他誤打誤撞頂替對方，成為開不了口、搞不清楚狀況，卻在超給力幕後團

  隊的精心打造下，成為空前絕後的頂級巨星！他不僅工作接到手軟，還迎娶了美嬌娘（凱

  特貝琴薩飾演），甚至成為模範市民。人生一帆風順到不能再順的他，卻在某次意外後，

  發現這個產業，似乎不如表面上那樣美好…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。




