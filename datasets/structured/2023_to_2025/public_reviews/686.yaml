url: https://www.ptt.cc/bbs/movie/M.1751037837.A.86B.html
title: '[新聞]亞曼達塞佛瑞爭取《魔法壞女巫》試鏡六次'
content: '好萊塢女星亞曼達塞佛瑞 (Amanda Seyfried) 近期在接受訪問時，


  透露她為了爭取《魔法壞女巫》電影版女主角葛琳達一角的驚人努力。


  這位曾以音樂劇《媽媽咪呀！》走紅的女星，在 Backstage「In the Envelope」


  Podcast 節目中坦承：


  「我為《魔法壞女巫》試鏡了大概六次。」




  為角色苦練多年，展現職業演員敬業精神


  談到這段試鏡經歷，塞佛瑞展現出專業演員的敬業態度。她表示：


  「因為那個角色必須要非常完美。我很喜歡這個角色。


  我很忙，幾乎沒時間去試鏡，但我還是設法安排了時間。


  我為了那些音樂拼命練習了好幾年。我很有競爭心


  但是以一種很健康的方式跟自己競爭。」


  對於試鏡這件事，塞佛瑞也分享了她的心得：


  「試鏡有某種很美好的地方。如果你真的有那個技能，無論如何你都會展現出來。


  走進去的時候會有種奇怪的恐懼感，覺得必須立刻留下印象，


  這確實需要，但唯一有用的印象就是做你自己。人們在緊張時的行


  為舉止可能會讓人反感。讓自己冷靜下來，


  說出你的真實感受，而不是一堆廢話，這樣比較有幫助。」



  亞莉安娜格蘭德勝出，塞佛瑞大度祝福


  最終，流行天后亞莉安娜格蘭德 (Ariana Grande) 獲得了葛琳達這個角色，


  並憑藉出色表現獲得奧斯卡最佳女配角提名。《魔法壞女巫》改編自經


  典百老匯音樂劇，分為上下兩集推出，《魔法壞女巫：第二部》預計今年 11 月上映。


  即使與角色擦身而過，塞佛瑞仍大方讚美首集電影的表現。她告訴《People》雜誌：


  「這是一場盛大的表演，這正是她（格蘭德）非常擅長的。而且我的孩子


  們一直在不停地播放原聲帶。一切都如其所應該的那樣，這是肯定的。」






















  全球票房高達 7.73 億美元，葛摩菈一角最終由柔伊莎達娜 (Zoe Saldaña) 飾演。





  --'
