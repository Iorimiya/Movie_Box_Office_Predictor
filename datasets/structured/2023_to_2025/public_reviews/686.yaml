title: '[新聞] 《魔法壞女巫2》褒貶不一 爛番茄評價出爐'
content: "《魔法壞女巫2》褒貶不一 爛番茄評價出爐\n\n\n《魔法壞女巫：第二部》（Wicked: For Good）劇照。（UIP提供）\n\n【大紀元2025年11月19日訊】（大紀元記者葉子杰編譯報導）當地18日，《魔法壞女巫：\n\
  第二部》（Wicked: For Good）爛番茄影評員及觀眾評價出爐，雖然主演陣容依然強大，\n但影評員給予續集的評價似乎未能達到第一部的高度，不過觀眾或許對故事感到滿意。\n\
  \n《魔法壞女巫：第二部》在11月21日美國上映前，媒體給予的評價褒貶不一，雖未能獲得\n影評員的青睞，但觀眾給予了高度評價。截至今日，在影評網站「爛番茄」上，影評員\n\
  102條評論中給予73%的新鮮度，低於前作的88%新鮮度評價。而超過2,500位觀眾給予97%\n新鮮度好評，高於前作95%的新鮮度評價。美國網路電影資料庫（IMDb）滿分為十分，獲\n\
  得觀眾7.3的佳評。\n\n《Screen Rant》影評員表示，如果你喜歡《魔法壞女巫》對原作的改編方式，那麼《魔\n法壞女巫：第二部》絕對符合你的期待。當第一首歌一響起，那股一直在你腦海深處的興\n\
  奮之情都會瞬間湧上心頭。\n\n\n《魔法壞女巫：第二部》（Wicked: For Good）劇照。（UIP提供）\n\n《好萊塢報導者》影評員表示，亞莉安娜（Ariana\
  \ Grande-Butera，美國女歌手）賦予角\n色滿滿的情感，讓角色變得更有人性、更立體，進而也讓整部電影更加精彩。\n\n《今日美國》影評員表示，雖然結局有點複雜過頭，角色發展上也有些小瑕疵，但你無法\n\
  要求更完美的《魔法壞女巫》結局了。\n\n《Variety》影評員表示，電影解決了舞台劇常被抱怨的問題，讓這對主角在最後階段有\n更多的場景（和歌曲）一起出現，現在感覺像是一個完整而又精彩的故事。\n\
  \n《Collider》影評員表示，《魔法壞女巫：第二部》不僅是忠實改編，還在第一部電影成\n功的基礎上做了加強，特別突顯了主角的表現。角色更加成熟且層次豐富，讓它成為第一\n\
  部電影當之無愧的續作。\n\n\n《魔法壞女巫：第二部》（Wicked: For Good）劇照。（UIP提供）\n\n《Deadline》評論員表示，視覺效果一流，整部電影版的音樂劇改編也非常精彩又有電影\n\
  感，兩部片加起來片長接近5個小時，只差兩分鐘。說實話，我還想看的更多。\n\n《泰晤士報》影評員表示，他們真的做到了。在活力、野心與情感衝擊上，這部音樂劇續\n\
  集的製作團隊交出了一部超越去年票房大賣的電影。\n\n《帝國》雜誌影評員表示，說不上真的是飛越彩虹，但也有足夠的色彩和真誠，勉強還過\n得去。\n\n《IndieWire》影評員表示，那些第一次沒達到效果的內容，嗯，至今依然如此。那些《\n\
  魔法壞女巫》裡有效果的元素呢？還是依然有效，但只比以前好一點點。\n\n《TheWrap》影評員表示，自從安迪‧馬希提（Andy Muschietti）執導的《牠：第二章》\n\
  （It Chapter Two，2017）以來，還沒有哪部預先規劃好的「第二部」像這部一樣令人失\n望。至少沒有人會隨著裘西‧紐頓（Juice Newton）的《晨間天使》（Angel\
  \ of the\nMorning）的音樂往傑夫‧高布倫（Jeff Goldblum）身上嘔吐。\n\n據《Deadline》報導，由朱浩偉執導的《魔法壞女巫：第二部》是美國最大的線上電影購\n\
  票網Fandango有史以來預售量最高的美國輔導級（PG）影片，超過了《美女與野獸》（\nBeauty and the Beast，2017）和《冰雪奇緣2》（Frozen\
  \ II，2019）。此外，它也是\n2025年所有影片中預售量最高的，預計該片北美首週末票房將達到1.1億美元。\n\n《魔法壞女巫：第二部》於2025年11月19日在台灣上映。\n\
  \n\n\n\n--\n\n                  \n\n\n\n--"
