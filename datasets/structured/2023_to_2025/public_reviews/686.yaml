title: '[討論] 魔法壞女巫2 成為今年首日預售最高電影'
content: '來源 : Broadwayworld




  還有一個多月即將上映的《魔法壞女巫2》日前開始預售，


  隨即成為Fandango平台2025年最佳首日預售電影。


  不僅如此，這成績還擠入了首日預售的歷史前十名，


  同時也是該平台PG級電影最高預售紀錄。



  第一集的預售數字為2024年第2名，僅次於《死侍與金鋼狼》。


  該作最終北美票房高達4.73億美元，全球7.56億美元，


  目前看來第2集應該能延續同樣氣勢。



  --'
