title: '[好雷] 魔法壞女巫'
content: "自從在百老匯看過魔法壞女巫劇情後\n\n\n一直深深被他們兩位的友誼感到感動\n\n在得知他要被電影化是非常開心的\n開頭的部分直接讓我潰堤\n\
  我是知道結局的\n在開頭就闡述了他們的結束\n\n希望再下一集的部分可以給我一個happy ending\n魔改不知道會不會被罵\n還是希望在OZ可以看到他們兩個攜手前行\n\
  \n在很多的討論中看到很多對於種族\n以及政治正確的議題，覺得荒謬\n畢竟有多少人沒有看過原著小說呢？\n\n又或者對於女主演們的膚色去下了評論\n拋開這些紛紛擾擾，這是一步非常好的電影\n\
  他很好的豐富了，百老匯沒有辦法做到的事情\n配角朋友增加\n讓整部電影時常兩小時40分鐘\n一點也沒讓你有空閒的時間\n\n另外再看到one short day\n\
  看到那兩位元老的百老匯演員\n也是一個很好哭的點 我完全沒預料到\n會看到他們\n\n整體的美學跟畫面的協調\n豐富度真的非常好 \n當初特地跑到桃園高鐵新光\n\
  \n另外昨天奧斯卡的表演中\n不知道大家有沒有發現？\n好女巫百老匯元老，他也曾經唱過\n新綠野仙蹤的home glee版本\n\n\n非常期待第二集的到來\n\
  \n但還是想要跟大家討論一下\n有沒有覺得 gravity 中的\n\nIt is me(高音）\n有點讓我抽離了一下\n\n\n\n\n\n\n\n-----\n\
  Sent from MeowPtt on my iPhone\n\n\n--"
