title: '[好雷] 魔法壞女巫 歌好聽'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  魔法壞女巫是以百老匯歌劇的方式敘述

  艾法巴跟格林達兩位本來是閨密好友


  格林達是個追求知名度且野心勃勃的閃亮亮女巫

  艾法巴則是為了忠於自己的本心

  於是兩人在經過了奧茲國大巫後便分道揚鑣~


  故事的一開始是格林達說著西方壞女巫已死，並回憶著她們之前的故事...


  其實覺得艾法巴只是之前不太能控制自己的法力關係

  還有膚色才導致一直被欺負，而格林達一開始也對艾法巴沒那麼好


  那是因為艾法巴幫她舉薦進魔法會

  她才羞愧不應該在舞會這麼對她才會對她好的

  之後雖然跟艾法巴一起但還是看得出她的野心

  不然也不會跟著一起跳上綠野仙蹤車了~


  這劇雖然一直穿插著歌劇，他們唱的真不錯聽，

  劇情也挺不錯看的，尤其是對人物情感的描述方面，挺期待第二集的~


  --

  看來是我沒搞清楚..

  原來如此..是我一開始沒搞清楚

  立馬去分清楚！'
