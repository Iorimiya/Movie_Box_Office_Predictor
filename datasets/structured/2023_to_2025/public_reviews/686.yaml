url: https://www.ptt.cc/bbs/movie/M.1763818630.A.4CA.html
title: '[好雷] 魔法壞女巫2'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  之前有在百老匯看過音樂劇了


  當時第一次聽 現場呈現只能用震撼人心來形容


  這次聽到改編 也是兩集都看了



  劇情上因為時間夠長加上電影能更好地切換場景和說故事


  故事的流暢度上我覺得比音樂劇的呈現來得讓人容易理解的多了


  但唱歌就比較可惜了


  (當然用百老匯現場的感受比電影是有點不太公平)


  只能說歌曲上大方向有把握到了 但要說直擊人心的震撼是弱了不少


  畢竟電影演員跟音樂劇演員的專業有落差 屬於可以理解的範圍



  不過畫面的呈現上是美麗夢幻的 把OZ呈現得很美也很假(誇獎的意思)


  看完出來後忍不住跟小孩說 好想再去聽一次現場喔




  --'
