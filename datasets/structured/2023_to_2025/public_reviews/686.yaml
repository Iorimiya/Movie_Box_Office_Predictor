url: https://www.ptt.cc/bbs/movie/M.1732179374.A.4C6.html
title: '[好雷] Wicked 魔法壞女巫'
content: '其實這算雷，所以還是分隔一下比較安心

















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  就跟蜘蛛人無家日一樣

  看之前被瞞得很徹底

  也沒有抱任何期待

  所以當前兩任蜘蛛人出來的時候

  真的有被驚喜到


  所以當這次看 Wicked

  兩位女主來到翡翠城時

  臨時加了戲，演繹偉大的奧茲國歷史時

  出現了百老匯原卡

  Idina Menzel 和 Kristin Chenoweth

  全場一片驚喜聲，拍手叫好

  建議不要知道再去看會比較有感


  Idina Menzel 高音很 Elsa

  Kristin Chenoweth 簡直完美的 Glinda

  兩位與現任女主的互動很有世代傳承的味道

  總之很讚就是了

  對音樂劇熟的人一定要看，會很感動


  再來說一些角色相關的

  原本我擔心 Cynthia Erivo 撐不起 Elphaba

  結果意外還不錯耶，

  之前實在被小木偶的光頭仙女嚇到


  Cynthia 詮釋的 Elphaba 眼神超有魅力

  各種喜怒哀樂都可以透過銀幕傳遞

  導演很愛由下往上拍她，其實這樣不好

  專注她眸光四射的眼睛就好，很震懾人


  髮際線有點假

  頭髮很像毛線

  看到有點出戲

  Cynthia 一開始的聲線很甜

  最後大爆發

  蛻變成了存在感強烈的西方女巫


  Ariana Grande 的 Glinda 既美又萌

  正如歌詞裡面形容的 She is winsome!

  目光會不由自主跟她走，演技不算特別突出

  但就是剛剛好，沒有過與不及，很舒服的南方女巫


  至於 Jonathan Stuart Bailey 的 Fiyero

  總有點休傑克曼上身的感覺

  跟 Glinda 的 chemistry 比 Elphaba 強烈

  救獅子那段情感交流莫名的尬

  以致於在唱 I am not that girl 時都無法帶入情緒

  有點擔心下半場的 As long as you are mine 了

  可能會尷尬到腳趾蜷曲吧


  然後楊紫瓊演的很好，從初期的慈愛關懷到末尾的野心陷害

  詮釋得層次分明，由她來說出 Wicked Witch 真的很帶感


  Jeffrey Goldblum 的奧茲，侏儸紀公園過去這麼多年

  狀態還是維持那麼好，Respect!


  以上只是一點淺見，有些橋段顯得冗長

  但不至於不耐，同場有聽到男生的打呼聲


  一開場音樂一下其實就感動到了

  如果音樂劇能來台灣演出就好了，沒來之前

  先看看電影解解饞也不錯喔！


  --


  第二集 Elphaba 主唱只有一首 No good deed

  應該會再加個幾首吧



  下半場必聽：

  As Long As You''re Mine

  No Good Deed

  For Good

  應該會聽到哭出一條河



  兩個元老互動超好笑的

  根本Elphaba 和 Glinda 附身了'
