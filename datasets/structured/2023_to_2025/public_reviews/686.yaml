title: '[新聞] 《魔法壞女巫2》票房近5億美元 12月底線上'
content: "《魔法壞女巫2》票房近5億美元 12月底線上發行\n\n\n《魔法壞女巫：第二部》劇照。（UIP提供）\n\n【大紀元2025年12月28日訊】（大紀元記者葉子杰編譯報導）當地27日，《魔法壞女巫：\n\
  第二部》在北美上映41天，全球票房收入超過4.9億美元，位列百老匯音樂劇改編電影票\n房榜第三名。該片將於12月底在美國線上發行，1月中旬實體發行。\n\n據《Deadline》《告示牌》報導，《魔法壞女巫：第二部》（Wicked:\
  \ For Good）及其前\n作《魔法壞女巫》（Wicked，2024）均改編自2003年的百老匯音樂劇《女巫前傳》（\nWicked）。《魔法壞女巫2》打破了前作的首映票房紀錄，成為百老匯音樂劇改編電影史\n\
  上首映票房最高的影片，北美首映票房高達1.47億美元和全球票首映票房達2.23億美元。\n該系列電影的累計票房目前已達12億美元。\n\n此前，《魔法壞女巫》於2024年11月22日上映，短短五週內，便超越《媽媽咪呀！》（\n\
  Mamma Mia!，2008）成為票房最高的百老匯音樂劇改編電影，還獲得10項奧斯卡提名，最\n終奪得最佳服裝設計和最佳藝術指導兩項大獎。《魔法壞女巫2》全球票房收入則緊隨《\n\
  媽媽咪呀！》之後，是排名第三高的電影。\n\n\n《魔法壞女巫：第二部》劇照。（UIP提供）\n\n在評分方面，美國網路電影資料庫（IMDb）和影評網站「爛番茄」（Rotten\
  \ Tomatoes）\n是評估電影好與不好的參考依據之一。IMDb滿分為十分，截至今日，《魔法壞女巫》第一\n、二部電影分別獲得觀眾7.3和6.9的評分；爛番茄影評員分別給予88%及67%的新鮮度，觀\n\
  眾分別給予95%及93%的新鮮度。\n\n據報導，《魔法壞女巫2》於12月31日可在北美「優質／高端隨選視訊」PVOD（Premium\nVideo on Demand）、Apple\
  \ TV、Fandango at Home、Prime video和YouTube Movies &\nTV等線上租借或購買影片。除線上發行外，環球影業將於2026年1月20日在北美發行4K超\n\
  高清、藍光和DVD版本。\n\n25日，環球影業釋出了一段《魔法壞女巫2》被刪除的兩分鐘完整蒙太奇片段（點這）。\n可以看到費耶羅、格琳達、艾法芭、涅莎蘿絲和博克，他們五個人四處奔跑、閒逛，並且\n\
  還是朋友。\n\n\n《魔法壞女巫：第二部》（Wicked: For Good）劇照。（UIP提供）\n\n責任編輯：茉莉\n\n\n\n--\n 神韻晚會觀眾反饋（2025）\n\
  \n--"
