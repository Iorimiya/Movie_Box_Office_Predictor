url: https://www.ptt.cc/bbs/movie/M.1732448708.A.EF0.html
title: '[普好雷] 魔法壞女巫'
content: '今天去看了早場


  我完全沒看過原劇也不知道劇情


  演員只認識楊紫瓊、Ariana Grande


  不是專業音樂劇粉


  是歌好聽就會看的那種


  現場只看過搖滾莫札特 其他劇看官攝


  對電影院的設備都不懂 都就近淡水國賓看一看


  也沒有什麼文學造詣


  是一個極為粗糙且普通的觀眾



  劇情：


  感覺原劇的故事應該是刻劃的很細膩的那種


  所以電影版想把所有的事情都交代清楚(？)


  但效果沒有很好 看一看會有「嗯？？？」的感覺


  不過...都拍到這個時間長度了 還分上下集


  劇本還這麼鬆散 令人驚訝



  大部分的劇情是能靠我自己的腦袋去補丁


  但有兩個部分不是很喜歡 也很莫名其妙



  1.葛琳達跟王子說圖書館裡有很多"古籍"


  然後過沒多久王子開始跳舞


  好 音樂劇 圖書館不用安靜


  但踩書丟書是怎麼回事...


  不覺得那樣很帥很浪漫很有趣



  2.王子帶大家去夜店(？)的那段無聲舞蹈


  我沒看過原劇 看這段真的很尬也很多問號


  不懂跳舞的意義 也不理解艾法芭在哭什麼




  畫面：


  感覺這個電影砸很多錢


  東西都有 還很豪華 但沒有融在一起


  有的人像童話裡的人 有的人像現代人


  劇情微妙割裂 畫面也是



  可能淡水國賓2廳有問題 還是片源有問題


  很多部份暗到不行 演員的臉都看不清楚


  還有蠻多特寫臉部鏡頭


  我坐正中間的位子 常常看到人臉糊掉


  片尾字幕的字也微糊




  演員部分：



  《艾法芭》


  因為我曾住在非洲五年 很習慣看非裔


  所以對於她的外貌我沒有特別的感覺


  演的好嗎？因為我不認識Cynthia


  但感覺得到她是一位有演技的演員


  希茲大學可能沒有限定入學年齡


  但大家都刻意表現的過於青春


  就會顯得學生都挺超齡的


  艾法芭一臉綠加一身暗+舊 更顯老了就很硬傷




  《葛琳達》


  以前只看過她唱歌


  沒想到演技還蠻好的 一點都不出戲


  可以透過她的眼睛感受到情緒


  蠻好的 蠻好的



  《王子》


  愛情來的太快就像龍捲風



  結論：


  會想去追原劇


  明年如果出下集會去看


  會想要換個觀影體驗好一點的電影院看


  大概這樣 謝謝大家



  --'
