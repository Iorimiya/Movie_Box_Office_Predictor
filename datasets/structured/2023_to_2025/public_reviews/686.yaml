url: https://www.ptt.cc/bbs/movie/M.1764065882.A.F6A.html
title: '[新聞] 《魔法壞女巫2》北美週末票房登冠 首映超'
content: '《魔法壞女巫2》北美週末票房登冠 首映超越前作


  【大紀元2025年11月25日訊】（大紀元記者葉子杰編譯報導）截至週日（23日），《魔法

  壞女巫：第二部》北美首週末票房收入達1.47億美元，超越前作。不僅登上北美週末票房

  冠軍寶座，也成為今年北美首映票房第二名的電影，僅次於《MINECRAFT麥塊電影》。


  據《Deadline》《Variety》報導，《魔法壞女巫》（Wicked，2024）及其續集《魔法壞

  女巫：第二部》（Wicked: For Good）兩部電影製作成本皆為1.5美元，總行銷費用約2.5

  億美元。《魔法壞女巫2》的北美首週末票房高達1.47億美元，超過前作的1.125億美元。

  全球票房2.23億美元，遠超前作的1.64億美元。



  《魔法壞女巫：第二部》（Wicked: For Good）劇照，導演朱浩偉（中）。（UIP提供）


  據報導，第二部電影不僅創下百老匯音樂劇改編的電影北美首日票房最高紀錄（高達

  6,890萬美元，超過前作的4,620萬美元），也創下了百老匯音樂劇改編的電影，北美預售

  票房最高紀錄（3,080萬美元）。


  《魔法壞女巫2》在2025年北美首映票房排名第二，超過《星際寶貝：史迪奇》（Lilo &

  Stitch）的1.46億美元，僅次於《MINECRAFT麥塊電影》（A Minecraft Movie）的1.627

  億美元。《魔法壞女巫2》也登上環球影業有史以來在北美首映票房第二高，僅次於《侏

  羅紀世界》（Jurassic World，2015）的2.088億美元。


  在北美票房，《魔法壞女巫2》登上音樂劇電影史上第三高的首周末票房，僅次於《獅子

  王》（The Lion King，2019）的1.917 億美元和《美女與野獸》（Beauty and the

  Beast，2017）的1.747 億美元，領先於《海洋奇緣2》（Moana 2，2024）。


  據悉，《魔法壞女巫2》本週一的北美票房預計將超過1,400萬美元（四天累計票房達1.61

  億美元），這會是2025年非假日週一票房最高的影片，超過了《超人》（Superman）的

  1,290萬美元。甚至也有可能會超過《不可能的任務：最終清算》（Mission: Impossible

  –The Final Reckoning）在陣亡將士紀念日的週一創下1,500萬美元票房紀錄。


  《魔法壞女巫2》在評分方面，美國網路電影資料庫（IMDb）滿分為十分，截至今日，獲

  得觀眾7.2的佳評，略低於前作的7.4；影評網站「爛番茄」影評員分別給予69%褒貶不一

  的新鮮度，略低於前作的88%。但觀眾給予95%的新鮮度好評，與前作95%相同。



  《魔法壞女巫：第二部》劇照，艾法芭（左）。（UIP提供）


  至於為何會分成兩部電影，導演朱浩偉（Jon M. Chu）在2022年時表示，決定拍兩部曲其

  實是出於創作上的必要，因為這個故事發生在《綠野仙蹤》的前、中、後各階段，太龐大

  了，兩個多小時根本裝不下，環球影業為了籌備這部片用了近20年時間。


  朱浩偉說：「把《魔法壞女巫》的故事塞進一部電影是不可能的，這樣會毀了它。」最後

  他們決定給自己更大的空間，不只拍一部，而是拍兩部。


  朱浩偉原本打算在第二部電影中詳細回顧第一部電影的劇情，以免觀眾忘記或沒看過。不

  過，朱浩偉最近向《娛樂週刊》表示，「我們原本放進去用來讓大家重新進入故事的那些

  鋪陳，全都改了，很明顯其實根本沒那個必要。」因為他意識到觀眾不僅願意接受艾法芭

  的轉變而且渴望看到角色成長。


  責任編輯：蘇漾




  --


  神韻晚會觀眾反饋（2025）


  --'
