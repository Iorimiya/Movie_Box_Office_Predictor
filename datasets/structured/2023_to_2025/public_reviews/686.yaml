title: '[普負雷] 魔法壞女巫：歡迎來到官爹的搞笑世界'
content: "《魔法壞女巫》 有雷短評：歡迎來到Ariana Grande的搞笑世界\n\n☆不是你想像中的童話故事\n\n《魔法壞女巫》整部電影聚焦綠女巫的轉變過程，以及他和格琳達之間的友誼，看似符合\n\
  童話的善惡互動架構，實際內涵卻沒那麼單純。\n\n細看綠女巫的融入和孤立，並不是透過善舉善念來驅動，而是（1）互惠：綠女巫幫葛琳\n達保留與大師學習的資格，給予實際好處。帶來（2）當權者的認可：葛琳達被感動後，\n\
  在舞會出手與綠女巫上演怪奇雙人舞，透過她的人氣聲望引導大家接納綠女巫。以及（3\n）煽動：群眾透過觀察名人權威的意向，順從並改變自己的行動（從眾）。\n\n這部簡單的歌舞劇電影，要帶給你的不是單純的善惡討論，而是包裝在甜美傳說裡的權力\n\
  結構，以及群眾心理效應。（一方面也是歌舞無法讓人沉醉其中，才開始在意其他故事細\n節）\n／／／\n☆其他小murmur：\n1. 歌舞部分運鏡不如 《大娛樂家》，缺少身歷其境的感覺。\n\
  2. 綠女巫 和 白馬王子 的 戀愛感真的很夠，初見面的眼神完全演出「他們一定有點什\n麼」。\n3. Ariana Grande明明沒什麼表情，怎麼可以那麼好笑（整部唯一笑點）。\n\
  \n-\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n#魚池  #電影 #影評 #魔法壞女巫 #有雷影評 de #電影短評\
  \ #院\n線電影\n\n--\n對，我大部分時間在恍神@@，但觀影沒覺得很漫長就是了\n官爹很好笑，但是整個電影還好\n的確，我完全不知道原作的脈絡\n就是很好笑的表子哈哈哈\n\
  耍賤部分很多真的很好笑\n期待以後更多類型的嘗試\n電影最前面節奏，我覺得很趕火車\n可能東西真的太多吧\n我非歌舞劇粉非官爹粉非原作粉\n跟朋友來看\n個人不特別推薦"
