title: '[好雷] 魔法壞女巫比神鬼2好看沒問題'
content: '不喜歡DEI選角

  也沒看過音樂劇

  甚至覺得歌普通


  但 即便如此

  Wicked整個娛樂度還是輾壓神鬼戰士沒問題


  原因1：亞莉安娜太討喜 不是什麼頂尖演技 但就是很有看頭


  2：整部片感覺沒什麼包袱很歡樂


  對他選角是隨性 但其他部分至少也是很有自信的貫徹這點到底 不會說用個大雜燴選角但片

  子又要正經八百

  就這兩點

  歌真的普 只是被亞莉安娜跟綠女主角唱得精彩而已


  整體來說我還是很尊敬雷利史考特拍歷史片的精神 但神鬼2 完全沒有任何點是贏過1的 就?

  什麼真實史詩感也是


  反觀朱浩偉看似亂搞 但真的有被他搞出點新意的感覺


  整個電影方向的世代交替感



  -----

  Sent from JPTT on my iPhone


  --'
