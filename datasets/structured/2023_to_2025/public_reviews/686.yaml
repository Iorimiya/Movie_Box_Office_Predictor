title: '[新聞] 《魔法壞女巫》將有衍生作 新綠野仙蹤創作'
content: '《魔法壞女巫》將有衍生作 新綠野仙蹤創作中



  《魔法壞女巫：第二部》（Wicked: For Good）劇照。（UIP提供）


  【大紀元2025年11月23日訊】（大紀元記者葉子杰編譯報導）《魔法壞女巫：第二部》的

  結尾似乎為第三部電影做了完美的鋪墊，但到目前為止還沒確定會拍續集。不過當地21日

  ，原作編劇史蒂芬‧施華茲透露，他們正在創作一部以綠野仙蹤故事中的奧茲國為背景的

  新項目。他說，這不是續集，而是衍生的故事。


  據《ComingSoon》報導，《女巫前傳》（Wicked）是一部2003年的音樂劇，由史蒂芬‧施

  華茲（Stephen Schwartz）和薇尼‧霍茲曼（Winnie Holzman）創作，改編自格萊葛利‧

  馬奎爾（Gregory Maguire）1995年的同名小說，而這部小說本身又是對《綠野仙蹤》的

  重新演繹。


  環球影業和導演朱浩偉將這部音樂劇《女巫前傳》改編成《魔法壞女巫》（Wicked）電影

  系列。第一部電影已於去年上映，史蒂芬和薇尼擔任編劇，史蒂芬配樂。其續集《魔法壞

  女巫：第二部》（Wicked: For Good），於21在美國上映。由薇尼與達娜‧福斯（Dana

  Fox）創作劇本，史蒂芬擔任作曲、作詞兼音樂製作人。


  關於第三部電影的構想，77歲的史蒂芬向《The Ankler》透露，他和薇尼已經在討論此事

  。史蒂芬說：「我可以透露的是，薇尼和我正在構思一些不是《魔法壞女巫》直接續集的

  構想。」


  史蒂芬繼續說：「因為我覺得格琳達和艾法芭的故事已經完整了——但還有其他面向可以

  深入挖掘。舉例來說，原作格萊葛利‧馬奎爾寫了好幾本《女巫前傳》系列的書。不過我

  和薇尼在討論另一個想法：不是續集，而是衍生的故事。」


  史蒂芬補充說：「當然，如果有人能想到一個延續的故事，理由不只是為了賺錢，那當然

  很好。但到目前為止，我還沒聽過有人提出過讓我覺得合理的構想。」


  目前該項目的更多細節尚未公布，似乎仍處於早期開發階段。《魔法壞女巫：第二部》在

  上映後獲得了影評人的褒貶不一的評價，但外媒預估該片將成為2025年票房最高的電影。

  史蒂芬表示《魔法壞女巫：第二部》並非續集電影，「這不是續集，這只是故事的第二部

  分。」



  《魔法壞女巫：第二部》（Wicked: For Good）劇照。（UIP提供）


  責任編輯：蘇漾




  --


  神韻晚會觀眾反饋（2025）


