title: '[討論] 魔法壞女巫真女主'
content: '在觀後感的沉思。

  1+2給我的感受都是很棒很美好。

  在整體上。


  雙女主中我覺得Glinda，

  更像是這一部戲的女主角。


  以下是我自己的感受:

  不論在百老匯以及電影版，

  能一直感覺到Glinda在轉變心態。


  當然不是Elphaba沒有轉變，

  而是故事走向讓我覺得

  他的轉變很合理，沒有驚豔。


  在整趟旅程中更多是Glinda的色彩。


  邀請E一起共舞，成為朋友。

  真心將他視為朋友

  跳上火車 對於動物最後還是改觀

  當大家都要抓他 他沒有放棄E

  (他對桃樂絲很壞

  當初自己搭火車

  叫桃樂絲用走的 還說 hurry up

  好mean)


  已經是既得利益者來說，他可以合理

  享受這一切帶來的好處。


  他也不是完美之人。


  愚蠢、虛榮心、氣頭上的凶狠。

  表露無遺


  到後面真心為E難過

  扛起E的PUA

  (只有你可以做到，所以你幫我)

  然後E去跟稻草人逍遙了。


  會覺得看到G滿滿的成長心境轉變。


  所以在E的新歌我真心無感甚至覺得

  沒有加分甚至是劇情上的扣分。


  G的新歌真的太融入了也合理解釋。


  很想二刷但覺得已經感動過了。

  不會再有當初百老匯看完的潰堤。


  我來提及幾個應該給我快轉的歌曲哈哈

  As Long As U r Mine(超尷尬...)


  No Place Like Home(我反而希望看到更多

  眾叛親離)


  我覺得Fight 那一段真的要有一首新歌

  或者再來一點上半場的 what is feeling那種調調。


  視覺化 我會給No Good Deed 120分

  Wonderful 100分。


  演唱部分我私心愛電影版，百老匯初版。

  我好想要用第一集遮住嘴巴那隻手，

  遮住二位的嘴哈哈。


  不知道為什麼我覺得電影版有種融合感，

  百老匯有種林鄒罵要贏過你感覺哈哈。

  -----

  Sent from JPTT on my iPhone


  --'
