title: '[負雷] 魔法壞女巫2'
content: '「兩個女同從吵架到心心相惜，但壞女巫還是跟草包男跑了」

  劇情極度破碎

  歌沒什麼記憶點


  壞女巫的決心反反覆覆：

  1、壞女巫第一集結尾決定要戳破大巫師

  2、這一集剛開始又差點被大巫師說服

  3、結果看到大巫師的地下室有好多動物（第一集的羊教授也被關起來）又爆氣

  4、王子逃婚格琳達，格琳達跟壞女巫一直what?what?

  王子跟壞女巫打炮（有演到在床上裸上身完事）壞女巫心情又好

  5、妹妹被奧茲宇宙的秀蓮施展龍捲風害死，壞女巫爆怒跟格琳達肉搏戰

  6、王子趕來救援，叫壞女巫快跑，壞女巫逃回城堡爆氣決定以後不當好人，

  順便施咒把快被衛兵打死的王子變成稻草人

  7、跟格琳達碰面又決定投降，假裝被桃樂絲潑水死，躲到結尾跟稻草人草包男私奔


  以上就是貫穿整部戲的立場反覆

  另外還有女巫妹妹希望戴克繼續愛他所以施咒把戴克變成鐵樵夫

  戴克變成鐵樵夫之後變超激昂而且唱歌還不錯聽

  大巫師的解法是格琳達跑來說壞巫女是你的女兒啊！大巫師就良心發現跑了

  奧茲宇宙的秀蓮明明超強但結尾突然被格琳達嗆兩句 猴子就架走她去關牢

  格琳達完全沒成長 繼續當一個假的好女巫

  戴克到結尾到底有沒有變回來？


  電影很長但劇情超混亂

  第一集給60分

  這一集應該給45分

  最有張力的一幕是壞女巫逃回城堡施咒把王子變成稻草人那一幕

  良心建議不用去看 一堆的海報也不用蒐集了


  如果中段的肉搏戰

  格琳達用玻璃狼牙棒肉搏戰準備打爆壞女巫

  壞女巫沒有被掃帚擋住 而是直接爆頭 全劇終

  本片應該可以逆轉評價為神作 但沒有這樣演



  -----

  Sent from MeowPtt on my iPhone



  --'
