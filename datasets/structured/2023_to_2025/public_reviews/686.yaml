url: https://www.ptt.cc/bbs/movie/M.1732645153.A.7B4.html
title: '[負雷] 魔法壞女巫- 看完氣到發抖= ='
content: '雷文防雷資訊頁


  魔法壞女巫



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  以下雷


  如題

  剛剛心血來潮看個午夜場

  挑了這部魔法壞女巫

  看之前僅有看過預告片

  被預告片畫風還有題材吸引去看的，我喜歡哈利波特



  先講好的部分

  這部片乍一看之下，似乎是被歐美政治正確裹挾的爛玩意（實際上也確實是）

  但我認為這部片完全沒有因為『政治正確』因素扣到分

  看了挺順的

  甚至我都懷疑在幫白富美女二翻轉刻板印象

  心地有夠善良，這種校園地位一般心眼都應該要演很壞的吧！？

  可能是普遍級所以不想展現人心險惡？


  然後女主角其實也沒硬要搞LGBTQIABCDNJCDKLCNDLKC&%#*@#...etc

  就只是搞個綠皮膚被歧視嘲笑

  女主角的位置完全可以是 胖女，醜女，邊緣女等等等

  讓觀眾很好帶入，其實兩個女主角的友情我滿喜歡的！



  整部敗點完全是在結尾

  笑死人，這種片居然還想出第二部XDDDD

  看到電影突然結束我真的傻豹眼

  心想：

  為何不把劇情濃縮在一部就好？？？？



  還有，重點是！


  結果女主角

  為啥啊？？？？？

  你完全可以救的啊！？？？？？？

  你都已經在那邊飛來飛去了，魔王都成形了

  你可千萬別說救不到欸ZZZZZ


  轉折有夠硬

  最後女主雙人組

  結果突然放生

  在接回前面劇情，


  啊乾

  太扯了吧！！！！完全毫無鋪墊啊！！！！！！！！


  氣死

  看完真的越想越氣

  我這場看完，也有好幾個人都在討論：啊！沒了喔？？？


  總結：

  沒有因為LGBTQICNSJCN扣分

  友情戲不錯

  出兩部撈錢失敗

  結尾超硬轉折失敗

  女主友情突然就撕裂，欺騙觀眾感情失敗

  女主放生白富美失敗

  突然電影就結束了失敗中的失敗




  --'
