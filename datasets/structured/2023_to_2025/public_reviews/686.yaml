url: https://www.ptt.cc/bbs/movie/M.1763698177.A.AB6.html
title: '[好雷] 魔法壞女巫2 音樂還是很不錯'
content: "先來防雷一下\n\n\n雖然劇情仍舊是8點檔\n\n\nXD\n\n\n\n\n\n\n\n\n===========================以下有雷==========================\n\
  \n寫在前面:\n\n個人認為音樂劇改編電影比較像是介於演唱會與劇情片之間的載體,\n單就劇情的流暢度通常都沒有純劇情片那麼好.\n主要看點在於電影有特效加持下,\n\
  同樣的歌曲是否能有不同於音樂劇的體驗.\n\n所以個人建議觀賞重點放在場景與歌舞 劇情其次,\n比較能夠好好享受這類電影.\n(就跟那個8點檔鳥劇情歌劇魅影一樣,\n\
  \ 唱得好音樂好比劇情好不好看更重要些,\n 畢竟你會去看首要享受就是音樂)\n\n首先這部P2(算下集 音樂劇的Act 2)劇情上沒有太大改動,\n該混亂的,\
  \ 該趕火車的原作缺點也順便搬過來了.\n純就劇情來講不是非常容易理解.\n如果怕會混亂的話建議去補一下綠野仙蹤XD\n\n就歌曲表現來說,\n\"No Good\
  \ Deed\"\n場景魄力很足夠,\n之前Cynthia唱\"Defying Gravity\"穿透性不太夠的問題反而不明顯了.\n而最後一個scene Elphy與飛行猴子那幕也只有電影才能呈現.\n\
  \n\"The Girl in the Bubble\"\n這首應該是電影裡面才有?\n場景處理與歌曲配合度很不錯,\n粉紅濾鏡(?)的使用做作又合理(笑\n\n\
  \"As Long as You're Mine\"\n這首Cynthia表現沒有問題,\n但我覺得Jonathan唱得有點勉強,\n相比第一部\"Dancing\
  \ Through Life\"的表現差了一些.\n\n\"For Good\"\n兩位女主角的情緒渲染很不錯,\n運鏡也很合理, 這段我有偷偷擦個鼻子.\n\
  最終兩位女主角互相告白完(無誤)隔著衣櫃一分為二的道別場景,\n正呼應第一部\"What Is This Feeling\"的分割畫面,\n只不過一個是相識,\
  \ 一個是離別.\n\n整個第二部兩位女主角間的化學效應很不錯,\n個人認為超越Elphaba <-> Fiyero這對.\n最後一幕在化外地那段,\n我甚至有種\
  \ \"好啦 沒法跟Glinda在一起那就你囉\" 這樣的感覺(笑\n\n\n其他一些小觀察:\n\nElphy這部的造型比上一集好多了,\n上集那個肩墊裝還有眼鏡搭配起來實在不太行,\n\
  這集女巫裝與髮型搭配好多了.\n\n整部唱功最差的大概是楊紫瓊,\n每次開口唱都有種說不出的尷尬(汗\n雖然開口的場景不多就是.\n(當然歌唱以外的場景表現都非常優秀)\n\
  然後那頭髮真的是有夠硬,\n暴風之下仍舊紋風不動XD\n\nGlinda選角相當合適,\nAriana似乎非常能夠駕馭這種很ㄎㄧㄤ的大小姐,\n每次看她甩頭髮都不自覺的嘴角上揚.\n\
  最好笑的橋段莫過於Glinda與Elphaba打架那段,\n甩頭髮與狼牙棒這些動作居然能這麼做作好笑卻又矛盾地很自然XD\n\n桃樂斯從頭到尾正片頭都是被切掉的沒入鏡,\n\
  (沒辦法, 又不是主角...)\n連被抓走也是第1人稱視角,\n這鏡頭抓法我還以為在看奇怪藍西莫的電影(X)\nU4DX/ScX似乎有一個scene有拍到大的正臉(只在左側邊畫面)\n\
  (剛從大巫師機械大臉室出來到街上那段)\n不過稍縱即逝, 我沒仔細看清楚XD\n\n另外最後Glinda上去那個塔再唱一次\"For Good\"時,\nGrimoire自動翻到的那頁\n\
  是上一部最後Elphaba要離開同個塔時 浮空術施術的那頁嗎?\n這個我還真的不是很有印象了XD\n\n\n總之 這部確實有達到把音樂劇搬上大螢幕的目標,\n\
  透過特效與運鏡,\n呈現不同於音樂劇的體驗.\n以音樂劇改編電影就算是任務達成了.\n再者兩位女主角的唱功也能駕馭這些歌曲,\n自然成品也不會太差.\n建議以欣賞歌曲的心態觀賞比較能夠享受這部帶來的樂趣XD\n\
  \n--\n她真的很會唱!\n\n咦 那是角色完全沒出現還是出現會帶面具之類的?XD\n\nDefying Gravity確實讚!\n\n第2部劇情就比較零碎\
  \ 沒辦法\n\n不過有幾段其實放到現實中也是諷刺滿點:\n\n\"我可以告訴民眾我說謊 但他們不會相信\n 一旦他們相信了你的鬼扯 就算事實放在眼前他們也不願相信\"\
  \n\n\"They need someone to be wicked, so that you can be good.\"\n\"必須要有人是壞的, 你才能繼續當個好的\"\
  \n\n音樂劇改編作常常劇情都有這樣的限制,\n美術跟歌曲反而是這類改編的強項..\n\n真的\n如果安插的好一點也許可以讓我花掉多幾張衛生紙QQ\n\n歌曲整體效果還是很不錯\
  \ 可以看大螢幕\n就是劇情跟原著一樣照搬比較沒辦法\n\n就當作是熱熱鬧鬧的特效歌舞電影反而能享受到音樂劇做不出來的效果XD\n\n阿..那應該是 \"The\
  \ Girl in The Bubble\"\n你這麼一說我才聯想到 確實是被困在粉紅泡泡的假象裡面!XD\n那段濾鏡色調調整得都很美!\n\n那電影鏡頭算超多了耶XDDDDD\n\
  \n就勉強了些 沒到不能接受但是就聽得出來\n\n跟斯巴達魅影一樣 經過顏值校正之後就ok了XD"
