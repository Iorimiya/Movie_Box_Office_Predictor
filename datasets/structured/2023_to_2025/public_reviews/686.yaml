  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~












  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  身為近來越少進電影的觀眾

  難得看到電影版一致好雷的評價

  對於女主角Ariana Grande也很喜歡她的歌就進場了


  對於一開場的文字敘述去講解背景是覺得整部片做的最差的一部分

