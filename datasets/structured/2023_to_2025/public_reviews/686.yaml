title: '[新聞] 魔法壞女巫女主將飾演耶穌'
content: '新聞網址：




  辛西亞·艾利沃（Cynthia Erivo）在好萊塢露天劇場（Hollywood Bowl）

  （Jesus Christ Superstar）中飾演耶穌。


  《Wicked》主演辛西雅·艾莉佛（Cynthia Erivo）將在好萊塢露天劇場（Hollywood

  Bowl）上演的經典音樂劇《耶穌基督超級巨星》（Jesus Christ Superstar）中擔任主角

  ，今年夏天隆重登場。


  該劇將於8月1日開始演出，並持續至8月3日。其他演員名單將於日後公佈。本次製作由塞

  爾希奧·特魯吉羅（Sergio Trujillo）擔任導演和編舞，並由史蒂芬·奧里姆斯（

  Stephen Oremus）擔任音樂總監及指揮。



  --'
