url: https://www.ptt.cc/bbs/movie/M.1732178100.A.65D.html
title: '[普雷] 無雷 Wicked 魔法壞女巫'
content: '對於一位聽原版音樂劇原聲帶好幾百遍的觀眾來說

  該是高潮的歌曲，情緒被拆的破碎

  尤其是結尾的經典曲，分拆到我真的想打人

  反而過場的歌曲，因為群舞跟合唱，讓人為之一亮


  場景部分十分華麗盛大，可圈可點

  但原本音樂劇Act I不到一個半小時的時長

  在電影版硬是要增加一倍

  劇情就顯得拖沓

  唱歌的密度也變低，變得不像音樂劇


  很害怕明年感恩節的「魔法壞女巫」下半集

  會讓我沒有動力想踏進電影院觀影


  --

  :)

  我的意思是，可以增加劇情細節，可能多半個多小時就足夠，而且應不失歌曲的完整性

  還有情感的延續，我沒有一次看音樂劇電影版如此如坐針氈

  我也是看早場一般的影院，只有五個人

  Wicked賣點之一就是Defying Gravity

  結果在歌曲的最高潮之前，又飛到雲裡

  還把畫面切到學校，然後再從雲裡飛出來繼續唱，是在哈囉？

  我嘴巴的歌詞就要唱出來了，然後再切歌= =

  我想國外論壇，尤其是熱愛Wicked音樂劇的劇迷，一定是罵聲一片


  至於認命，我不這麼認為

  Elphy自認只有自己有這個能力，所以她的傲氣還是在的

  只是多了一段被人散播抹黑的橋段，把無奈的臉演出來就是了

  沒錯

  可以再多看看其他人的心得再評估看看囉

  我個人是覺得Popular, I''m not That Girl, Defying Gravity比較不OK

  但One Short Day, What is This Feeling給予激賞

  No One Mourns the Wicked, Dancing through Life, The Wizard and I就OK

  畢竟是音樂劇，而且還是蠻多人喜歡的音樂劇，對歌曲的要求會比較高

  如果上下兩集時長分別都不超過二小時，我覺得應該會精采很多

  我個人是覺得差強人意再好一點

  撇除結尾歌曲高潮的處理我很生氣外，其實整部場景設計還蠻不錯的

  然後把動物跟人一起生活的元素加進來，對這部的劇情有一點亮點

  另外兩位主角在選角確定之時，我其實疑慮很深

  但後來看釋出的影片，聲線什麼的還頗吻合，違和感不大，算安心不少

  唱功就算一般般吧


  還是要稱讚一下One Short Day, What is This Feeling這兩段表演

  我好喜歡

  會不會是不喜歡音樂劇@@?

  真的...

  然後Galinda跟Glinda感覺沒有差別，不知道是不是也是偶包的關係

  所以One Short Day我很喜歡

  覺得沒斷的效果會好很多，音樂劇粉絲也會更喜歡

  電影拿音樂劇改編，畫面好看是基本啦

  難就難在怎麼把舞台獨有的哏，轉化到電影呈現了

  Defying Gravity是不是比原版多一次最後一句，聽下面的原聲帶就知道了

  後半段其實加了不少東西進去



  另外沒想到把我很喜歡的What is This Feeling片段放上網路了


  只能說劇情節奏太慢了，有些歌的BPM也調降很多

  如果明年的Act II電影時長也是這麼長，我真的會卻步

  沒錯沒錯

  音樂劇可能不好找，或是側錄畫質很差的

  我主要也只是聽音樂劇的原聲帶而已

  Wicked算是近期賣座且長青的音樂劇之一，可以理解Broadway不讓劇場上線的作法

  很可惜啊，如果把Defying Gravity這曲處理得再好一點，明年續看的人數一定更多的'
