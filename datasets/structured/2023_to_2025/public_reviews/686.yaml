url: https://www.ptt.cc/bbs/movie/M.1757259585.A.501.html
title: '[新聞] 《魔法壞女巫2》揭開兩主角友誼破裂後生活'
content: "《魔法壞女巫2》揭開兩主角友誼破裂後的生活\n\n\n《魔法壞女巫：第二部》（Wicked: For Good）劇照，格琳達。（UIP提供）\n\
  \n【大紀元2025年09月07日訊】（大紀元記者葉子杰綜合報導）最近，《魔法壞女巫：第二\n部》發布了全新預告片，揭露格琳達與艾法芭友誼破裂後的日常生活，片中包含一些全新\n\
  的歌曲片段，以及桃樂絲、稻草人、膽小獅和錫樵夫都出現在鏡頭前。\n\n當地3日，官方釋出的《魔法壞女巫：第二部》（Wicked: For Good）全新預告片（點這\n\
  裡看影片）中，飾演格琳達的32歲美國女歌手兼演員亞莉安娜（Ariana）唱著「好（good\n）、好、好」時，有輕微的音樂伴奏。辛西婭‧艾利沃（Cynthia\
  \ Erivo）飾演的「艾法\n芭」與格琳達在第一部電影結尾分開後，她們在新預告片中重逢。而格琳達和她的男朋友\n費耶羅之間也存在著一絲緊張關係。\n\n\n\
  劇中還有一段格琳達與費耶羅的激烈對話，費耶羅說她「無法抗拒」名利雙收的生活。當\n她反問誰能抗拒時，他直言：「妳心裡有數」，迫使兩人同時想起如今遭眾人唾棄的艾法\n\
  芭。這確實揭示了格琳達生活的兩面性：表面看似完美無瑕，但內心卻因被迫違背本心，\n而感受到的愧疚和痛苦。\n\n據《ScreenRant》報導，《魔法壞女巫》（2024）妙地改編了2003年音樂劇《女巫前傳》\n\
  的第一幕，以電影特有的視覺方式完整展現了奧茲國的世界。然而，第一部電影主要聚焦\n於艾法芭的背景故事以及她與格琳達逐漸萌芽的友誼。\n\n電影中包含對《綠野仙蹤》（The\
  \ Wizard of Oz）事件的參考，但它主要是綠野仙蹤故事\n的前傳，帶領觀眾回顧故事的起源。接下來第二幕的劇情與1939年電影《綠野仙蹤》有所\n接軌，揭開了桃樂絲（Dorothy）前往奧茲國拜訪大巫師期間正發生的事情。雖然桃樂絲\n\
  和她的朋友們在舞台音樂劇中鮮少出現，但劇情重點依然放在艾法芭身上。\n\n《魔法壞女巫：第二部》有可能探索桃樂絲故事的另一面，展現第一部電影事件如何影響\n她與稻草人、膽小獅和錫樵夫角色的互動和他們之間的關係。\n\
  \n在音樂劇中，這些角色都有獨特的詮釋，尤其是錫樵夫和稻草人，他們的真實身份分別是\n「博克」和「費耶羅」。第二幕中，博克想離開艾法芭的妹妹「涅莎蘿絲」，並在格琳達\n\
  嫁給費耶羅之前向她表白自己的愛意。涅莎蘿絲想對他施展愛情魔咒，但失敗了，導致博\n克的心臟萎縮。\n\n艾法芭唯一拯救了博克的辦法就是把他變成一個不需要心臟就能活下去的錫樵夫，艾法芭\n\
  最終救了他。而費耶羅變成稻草人也是艾法芭咒語的結果，因為那時費耶羅放走了艾法芭\n，卻被大巫師的衛兵抓獲並折磨。艾法芭以為他死了，便施咒救了他，結果讓他變成了稻\n\
  草人。\n\n\n《魔法壞女巫：第二部》（Wicked: For Good）劇照艾法芭與格琳達。（UIP提供）\n\n《魔法壞女巫：第二部》故事講述自從艾法芭與格琳達分道揚鑣、形同陌路之後，各自承\n\
  受她們做出的抉擇所帶來的後果。被冠上「西方壞女巫」惡名的艾法芭遭到放逐後，隱居\n在奧茲國樹林深處，但是卻仍然為被噤聲的動物爭取自由而奮鬥，並且迫切地想要揭露她\n\
  所知道關於奧茲國大巫師的真相。\n\n與此同時，格琳達已經成為奧茲國光鮮亮麗的良善象徵，她住在翡翠城皇宮中，享受她的\n響亮名聲和超高人氣所帶來的明星光環與特權。在莫里貝爾夫人的安排下，格琳達成為奧\n\
  茲國人民眼中充滿粉紅泡泡的安撫力量，並且讓他們相信奧茲國在大巫師的統治之下一切\n都很好。\n\n當格琳達的明星光環越來越閃亮，她也準備和費耶羅王子舉行一場盛大的婚禮，但是她卻\n\
  一直受到她和艾法芭分開後的陰影所糾纏。\n\n她試圖促成艾法芭與大巫師之間的和解，然而她所有的努力都以失敗告終，使得艾法芭和\n格琳達的關係越來越疏遠。她們的關係決裂所造成的影響，將徹底改變博克與費耶羅的命\n\
  運，也將威脅到艾法芭的妹妹涅莎蘿絲的安危，而一名來自堪薩斯州的少女也將闖入奧茲\n國，徹底翻轉他們的世界。\n\n當一群憤怒的民眾揭竿而起，打算對抗西方壞女巫，格琳達和艾法芭就必須最後一次攜手\n\
  合作。當她們的友情成為改變她們未來的關鍵，她們就必須以真心誠意和無比的同理心真\n正了解彼此，並且改變自己，也讓整個奧茲國變得更美好。\n\n《魔法壞女巫：第二部》將於2025年11月21日在全球上映。\n\
  \n責任編輯：蘇漾\n\n\n\n--\n                 \n   \n\n\n\n--"
