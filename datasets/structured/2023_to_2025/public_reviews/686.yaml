title: '[普雷] 魔法壞女巫2'
content: '作為一個百老匯迷

  關於part2 在百老匯就是這麼割裂


  電影版補足很多細節好好

  交代劇情


  但沒有魔改 所以很多人

  會覺得托很正常


  我思考的是 畢竟近百老匯第二票房高


  在美國人心中這一部份量蠻重


  朱我不清楚有沒有想要魔改他


  從第一集知道是沒有的

  （當初還希望他改一下結局）


  我自己的感受會覺得


  某些地方可以不要用那些畫面


  單純互表心意讓歌曲唱完

  就不太會有托的感覺


  新歌曲部分除了 小艾那段劇情我覺得

  剪輯得很…

  或者是搭配劇情不搭

  我覺得歌詞本身就是多意解釋

  你要說沒有地方比得上家

  你要說 沒有地方像我的家

  都可以


  Linda部份我超喜歡

  直接用一首歌補足這個角色

  背景 跟心路歷程


  最後foor good 大哭一下


  簡單的評價就是普

  有感受得出很認真在剪輯

  跟解決百老匯下半部問題


  百老匯大概50分

  電影70分


  更多是畫面超美

  演技


  另外板橋大遠百第三廳的喇叭


  不知道是怎樣


  我真的覺得我耳朵要炸開了..

  好大聲


  另外翻譯我覺得…有些地方歌詞

  翻出來就沒意思了


  還是很推薦百老匯迷進戲院

  -----

  Sent from JPTT on my iPhone


  --'
