url: https://www.ptt.cc/bbs/movie/M.1763695192.A.5E5.html
title: '[好雷] 魔法壞女巫2'
content: '底下有雷，記得兩集都要看～


















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  第一篇ptt 的文就決定獻給魔法壞女巫了！


  我是根本不知道這個歌劇，然後本來也不知道他有電影，直到有一次看電視，看到第一部

  的廣告，男友就跟我說「這好像是你喜歡的類型耶！」，我才發現「對耶！」


  結果一去看真的就超級大愛上！


  而且都沒有人提到他們的衣服，這次的服裝設計師真的超厲害，學校那個制服系列真的是

  可以走伸展台，超級好看！下集就比較還好，不過Galinda 的新禮服還是非常好看，而且

  打架的時候我還在細數那件禮服底下有幾層XD能做出又好看又能打架的衣服真的太厲害了

  ！然後我無時無刻都在觀察大家衣服的細節，黃磚路啟用典禮的時候，楊紫瓊那件黃金馬

  甲也超級好看。

  我決定把我喜歡的衣服都寫下來：

  1. Elphaba穿去開學的黑洋裝，那個手肘澎澎的設計、傘狀的袖口、胸前的皺摺，真的太

  美了！

  2. Elphaba上學的那個藍襯衫配有點像背心裙的設計，那個背心裙的版型超級好看！

  3. 同學的學校制服，可以看到所有人的制服都稍微有不同，而且誰會用深藍細條紋配彎

  彎曲曲的藍橘條紋！真的太俏皮可愛又好看了，各種背心、西裝、九分褲、不對稱百褶裙

  、藍橘花紋襪子，每一件都好好看！

  4. Galinda 第一集第一幕的粉紅禮服，去環球影城的時候我有看到這件禮服本人，他真

  的好多細節好美，有各種漂亮水鑽黏在不同深淺粉紅的裙擺上，好像真的是用魔法做出來

  的。

  5. Fiyero第二集的侍衛服，那個外套是披著一邊，另一邊用一個金繩子綁在身上（？反

  正看起來非常不舒服但是真的超級帥！特別又是給超帥的Jonathan Bailey穿。


  其實第二部看完不像第一部那樣很嗨，覺得心情悶悶的。而且本來我超級期待for good，

  因為我看完上集就超級期待下集，還跑去狂聽百老匯版的原聲帶（自己暴雷自己XD），然

  後下半場我最喜歡的就是for good ，不過不知道為什麼這首實際在電影院看沒有很打動

  我，反而在no good dead那裡很激動很想跟著唱（我覺得我需要卡啦ok版本的）。


  其實我也很想要更快樂一點的大結局，我就想說大巫師早點說地窖裡還有動物不就好了！

  然後也有點討厭Elphaba 最後決定跟Fiyero遠走高飛，可是可以理解他不想再跟任何事有

  關係。只是覺得Galinda很可憐也很孤單，可是他同時也被所有人愛戴著，或許就像他媽

  媽在生日宴會跟他說的一樣，這樣就足夠了。


  然後最後看到山羊教授回去教書害我快哭出來！我覺得動物的部分一直讓我很想哭，覺得

  他們超級可憐，而且裡面超多可愛又違和的動物，最後Galinda跟人民講話的時候地上有

  一隻無尾熊，我整個？？？沒看過無尾熊抱著一個東西以外的情況XD


  順便在這裡推薦一下第二部的宣傳電視節目，叫Wicked: one wonderful night，裡面超

  多搞笑的片段，而且每首歌都換一件禮服，真的超級美！可以在HBO max上看到～


  而且裡面我真的超想吐槽Boq和Nessa這一對，Boq怎麼看到Galinda要結婚還要去表白！而

  且明明是Nessa亂念咒語害他心臟不對勁，Elphaba 為了救他把他變錫樵夫，他還聽信Nes

  sa 的話，覺得是Elphaba 害他的，就很想跟他說你幹嘛相信Nessa阿！而且Nessa也有點

  黑化的太快，我很難接受，第一集還是期待上學的純真小女孩，第二集就變心機壞人，跟

  Boq說他可以走，又下命令說Munchkins不能旅行。（是說我現在才發現munchkins 是小矮

  人的意思嗎？這跟曼赤肯貓的字是同一個耶）


  最後還是要說一下我最喜歡的三首歌！

  1. For good

  2. Dancing through life

  3. Defying gravity


  歡迎大家在底下分享最喜歡哪件衣服還要哪首歌～～:D



  --

  沒錯！感謝糾正～'
