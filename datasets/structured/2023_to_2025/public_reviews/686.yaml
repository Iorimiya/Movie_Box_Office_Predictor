url: https://www.ptt.cc/bbs/movie/M.1743523577.A.BB8.html
title: '[新聞] 魔法壞女巫演員認為大家應該多用They'
content: '新聞網址：



  「魔法壞女巫」演員辛西婭艾莉沃：當人們不使用「他們/她們」代名詞時，「並

  不容易」


  在音樂劇《魔法壞女巫》（Wicked）中與亞莉安娜格蘭德（Ariana Grande）共同演出

  的女演員辛西婭艾莉沃（Cynthia Erivo），在GLAAD媒體獎頒獎典禮上發表演說時表示

  ，不被使用偏好代名詞「很難」。


  這位38歲的英國明星在上週比佛利希爾頓飯店舉行的頒獎典禮上發表了上述言論。她獲頒

  史蒂芬·F·科爾扎克獎（Stephen F. Kolzak award），該獎項頒發給「公開出櫃的娛樂

  或媒體界人士，表彰他們為消除恐同症所做的努力」。


  「這並不容易。一點都不容易。」這位葛萊美獎得主繼續說道，根據《今日美國》報導。

  「每天醒來，選擇做自己，在感覺不被歡迎時宣告一個空間屬於你，每天教導人們如何稱

  呼你，並處理重新教導人們一個自古以來就存在於人類詞彙中的詞語所帶來的挫敗感。」


  「他們、她們、它們。用於描述兩個或多個人，或詩意地描述一個單純地『更多』的人。

  」伊莉沃說。


  伊莉沃因為她的抱怨，以及她說任何使用新代名詞（通常是性別中立或「非二元性別」）

  的人都是「更多」而面臨了嚴重的反彈。


  --'
