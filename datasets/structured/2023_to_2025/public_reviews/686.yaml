url: https://www.ptt.cc/bbs/movie/M.1754323449.A.DD4.html
title: '[討論] 所以當初誰在吹魔法壞女巫女主的?'
content: '去年魔法壞女巫

  一堆人吹捧票房有多好

  先說朱浩偉的確很會執導設計場景服裝歌舞

  不過黑女主就有一種說不出來的傲慢感

  果然隔年2月就爆出她挺人稱代名詞被鄉民噓爆

  最近她演的耶穌舞台劇看起來像是異形


  坦白講第一次看到她只覺得唱歌很好聽

  根本不知道她腦袋裡想什麼

  不過某些肢體動作看起來就有一股說不出的傲慢感

  當初到底是誰在吹她的?


  --

  不是，像是她被霸凌那場戲，沒演出傷心的表情，反而一副你們都是低等人的傲慢感

  瑞秋麥亞當斯你這個白女閉嘴啦!'
