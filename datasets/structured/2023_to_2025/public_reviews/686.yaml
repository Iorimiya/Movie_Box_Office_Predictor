url: https://www.ptt.cc/bbs/movie/M.1733732635.A.7D5.html
title: '[好雷] +疑問 魔法壞女巫'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這部電影的髮妝造型場景很值得進戲院一看

  不過我覺得如果要達到好的觀影體驗

  看電影前先熟讀一遍綠野仙蹤是非常必要的

  這樣就能對很多橋段與設計有更深一層的認識


  (不過我也沒看很熟 可能還要再找比較原始的綠野仙蹤來惡補一下)


  電影劇情方面人物動機都有充分鋪陳

  比如綠女巫為何對動物有這麼深的執著

  這是因為她小時候就是熊褓姆照顧的關係

  本來動物職業隨處可見，之後越來越少看到

  這些設計我非常喜歡



  不過


  我想問的問題是

  女生的友誼，真的能在這種狀態下發展出來嗎？

  我真的很懷疑，因為葛琳達對艾法芭的好，有太多利益交換

  她到翡翠城以前，所有對於艾法芭的善意幾乎全部都另有所圖


  艾法芭方可看能事看的滿清楚的

  知道葛琳達不是真的為她好，只是想維持一個光鮮人設而已

  葛琳達這邊我覺得亞莉安娜實在很會演

  或者這個角色太適合她

  我都分不出來她演的是「有意識的另有所圖」 還是「無意識的表演型人格」

  所以翡翠城追逐戰我真的有被這個友誼小小感動到

  兩邊看起來都真情流露


  但回過神來又覺得不對，好像她們不太可能真的是朋友

  特別是最後楊紫瓊擁抱葛琳達那裏

  一般人會去擁抱發布追殺朋友命令的人嗎？

  所以葛琳達在翡翠城裡面都在演戲嗎？ 這劇情也太腹黑了吧

  還是說這個問題要等第二集揭曉答案呢？



  --'
