url: https://www.ptt.cc/bbs/movie/M.1732202203.A.4F3.html
title: '[普雷] 好雷加負雷等於普雷的魔法壞女巫Wicked'
content: '雷文防雷資訊頁



















  其實也不知道算不算雷但還是隔一下


  先說我沒看過原舞台劇或劇本


  從頭到尾我只知道Ariana Grande似乎投入很多心力在這部電影


  回到正題


  搭配個人觀感評分來描述我看完的心得



  特映票：九點九分


  好大一張而且很精美


  沒給滿分是因為


  進場竟然還是給我用打洞器在上面挖一個洞


  傻眼貓咪無法認同




  歌舞：九點九分


  純論歌舞我覺得看得很過癮、很喜歡


  場景、動作、過場、歌聲，各方面的編排都讓我看得不自覺微笑


  尤其是圖書館的部分實在很想進去轉


  沒有十分的原因是到後面開始有能不能放過我的心情


  有種不是歌舞過長就是想做的畫面過長


  導致互相拉扯感覺很奇怪


  情緒也有點搞斷檔





  畫面：九分


  妝髮、場景、運鏡之類的


  在我印象裡沒有一處是讓我覺得疑惑或尷尬的


  但沒有到讓我OH WOW的那種程度





  演員：八分


  尷尬疑惑度跟登場時間成反比


  登場時間久的我都覺得滿好的


  比如楊紫瓊、A. Grande、C. Erivo、J. Bailey




  劇情：三分


  到後面我是真的不明白...


  一些奇怪的動機...


  一些奇怪的轉折...


  突然弄丟的邏輯...


  還是本來角色就是這樣令人捉摸不定（？


  我跟我男友說


  就像是吃了一道很繽紛很澎湃帶我感官上山下海的料理


  結果定睛一看山上都是蟲子海裡都是油汙


  前半看得很快樂


  後半一直在看時間






  但整體還是覺得值得推薦！



  --'
