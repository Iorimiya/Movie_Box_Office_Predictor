  換個格式跟淡近淡出我是覺得會更讓人接受啦



  整體而言 故事性沒問題完全能吸引我去看續集

  音樂傳唱度就可惜了點 不會特別去找原曲來聽

  唱功方面兩位都極強撐得起這部戲


  跟大娛樂家相比覺得還是大娛樂家勝

  音樂耐聽跟傳唱度是大娛樂碾壓獲勝

  故事性見人見智 我是覺得娛樂家起承轉合一集內結束比較優

  但有人可能會說故事格局不一樣

  唱功方面是魔法勝


  --'
