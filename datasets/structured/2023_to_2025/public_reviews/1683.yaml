url: https://www.ptt.cc/bbs/movie/M.1684073154.A.917.html
title: '[好雷]梵蒂岡驅魔士-好看'
content: '#有雷

  #有雷

  #有雷


  -昨晚看了HBO的黑亞當發現DC的片子有進步欸

  -今天看驅魔士前的閃電俠預告又讓我對DC的印象加分

  -但我最期待的其實是沙丘2 :)


  ***


  I highly respect all forms of spirits.


  驅魔士的電影很多，故事大都是驅魔的過程，這部也不例外，但我好久沒在電影院看這種

  驅魔片，其他片子包場覺得開心，這部片子包場倒是真的讓我有點心驚驚，還好最後開演

  前，又有小貓2-3隻進場，讓我的恐懼感沒那麼大。


  羅素克洛的角色是一個看待萬物很輕鬆的首席驅魔士，跟我們平常認知的嚴肅形象不大一

  樣，但不代表他沒有專業。過程中他被安排到西班牙一個偏僻的修道院驅魔，而那個修道

  院正是梵蒂岡困住千年（？）邪靈之處。被梵蒂岡封印也就代表這邪靈力量和能力之大，

  而這也正是這部片子精彩所在。這個邪靈從過去一直以附身首席驅魔士來擾亂教會秩序為

  目標，而片中的邪靈正是因為無意間的修道院施工而被解放，進而又想故計重施再次附身

  驅魔士達到他擾亂進而毀掉教會的目的。


  片子最後兩大勢力的抵抗，讓我內心其實蠻緊張的，曾經的驅魔士不敵邪靈的力量，將自

  己和邪靈一起封印，而羅素克洛很幸運的是有一位年輕神父喚起內心的他，讓他抵抗邪靈

  ，最終將邪靈驅逐。


  故事很緊湊但羅素克洛演的驅魔士很不一般，特別是他有點玩世不恭的態度也許在正統教

  會中不一定受歡迎，而這也就是他的特色所在。看完之後我有兩個感想，一是要多講笑話

  ，because demons don’t like jokes，我聽到他講這句真的笑了出來，再來就是我曾經

  聽過父執輩提過遭遇重大災難仍存活下來的人，其實上天有賦予他使命的這件事，在這部

  片子中，也再次印證，而這也讓我思考，我們每天可以張開眼睛迎接新的一天，和自己家

  人相處、工作、生活，也許我們都該感謝上天給我們的福報!


  羅馬在片中還是一樣的美，羅素克洛騎法拉利（？）的偉士牌，顯得非常俏皮，跟他在片

  中的個性很合。劇中驅魔的過程讓我聯想到「康士坦丁」，些微提到教會的性醜聞，也讓

  我聯想到「驚爆焦點Spotlight」這部電影，還記得我看完驚爆焦點後，內心既生氣又難

  過，生氣的是讓人尊敬的形象怎麼會做出這種事，難過的點則是被害人這麼的多，而他們

  一直都不敢發聲。總之教會似乎是個很禁忌的組織，也難怪關於教會的電影雖然不多，但

  推出後總是有一定的聲量。


  --'
