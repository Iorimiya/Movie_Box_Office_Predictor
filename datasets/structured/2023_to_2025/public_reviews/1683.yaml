url: https://www.ptt.cc/bbs/movie/M.1683180262.A.924.html
title: '[好雷] 梵蒂岡驅魔士-驅魔皮，動作骨'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  《梵蒂岡驅魔士》(The Pope''s Exorcist)：

  .

  我算是還蠻喜歡看恐怖片的，但在恐怖片的各種子類型當中，驅魔片一直是我比較不感興

  趣的一種，一方面來講，我總覺得驅魔電影無論內容還是嚇人手法都蠻千篇一律的，我能

  從驅魔電影中得到的娛樂性一向不高，二來驅魔電影的恐怖某種程度上是建立在西方的宗

  教文化上，直接衝擊與挑釁基督信仰，而結局可能徹底擊碎或是重新肯定信仰的價值，這

  對沒有宗教信仰的我來說，更是少了一層恐懼體驗。

  .

  所以一般來說，除非評價高到不可思議的地步，不然我不太會主動去找驅魔電影來看，但

  這部《梵諦岡驅魔士》跟我們所習慣的驅魔電影有那麼點不一樣：它請來了羅素克洛來演

  出電影片名裡的那位驅魔士。

  .

  哇嗚！羅素克洛演驅魔士，光用想的就覺得刺激：他很可能拿出羅馬戰士劍直接把被附身

  的人劈成兩半、宣布驅魔成功但是受害者死了；也可能物理驅魔，開始海扁受害者，扁到

  他邪靈出竅；或者可能會使出詠唱，用他的歌聲逼出惡魔......不知道，我是不太懂驅魔

  啦。

  .

  不過僅是這點我就知道這片必看了。好啦，我承認我是有一點抱持著來看笑話的心態來看

  這部電影的，但羅素克洛就算演一些亂七八糟的電影也是有種莫名的舒壓感，例如之前的

  《超危險駕駛》就很有意思，明明是驚悚片，但我看預告的時候一直笑，而且是打從心底

  開心的那種笑，有些明星就是有這樣的魅力，就像不久前的凱吉之於《吸血鬼特助：雷菲

  爾》，這片自然也是光靠羅素克洛就增色了不少，而且我得說句認真，這片其實還不錯看

  。

  .

  事實上從片名跟選角就能看出點端倪，這片跟傳統的驅魔電影不太一樣，重點完全擺在羅

  素克洛演出的驅魔士上，根本沒人在乎被惡魔纏身的那家人，電影開頭確實埋下了家庭失

  和的引子，不過編導顯然沒有打算解決這個問題，我們只看到這家人的衝突，卻不見他們

  有所和解，觀眾根本還來不及跟這家人好好相處，小男孩就被附身了，而這也是我欣賞這

  部電影的地方：他們很清楚觀眾是來看羅素克洛的，他們不多花時間鋪陳一家人相處的快

  樂時光來製造後期愁雲慘澹的反差，也沒有去質疑惡魔附身的真假，畢竟趕快讓驅魔士登

  場才是要緊事，這家人不過是個讓他有事做的副本罷了，君不見羅素克洛出現之後大多數

  的時間媽媽跟姊姊就被晾在一旁了。

  .

  我們不妨可以這樣說，比起一部恐怖電影，這整部電影的文本架構更像是一部動作電影，

  而且還是為羅素克洛量身打造的系列電影，它骨子裡8、90年代流行的男子漢動作片，只

  不過套了驅魔片的皮，把電影的焦點擺在男主角身上也是因為，只要觀眾喜歡這個驅魔士

  、只要觀眾在票房上夠捧場，那麼拍個幾百套系列電影不是問題(最後羅素克洛九死一生

  後，教宗跟他說還有199個任務要他解決我快笑死，顯然勞基法不適用於驅魔士)。

  .

  事實上，光從電影的第一幕，我們就能感受到這部導演把這部電影當成動作片拍的用心：

  先讓英雄救貓咪，電影特地安排了一場跟主線毫無關聯的小型驅魔場面，我們的英雄羅素

  克洛颯爽登場，而最讓人震驚的是他完全不像你想像中的驅魔士那般莊嚴、政經、虔誠到

  近乎死板無趣，面對惡魔，他不是馬上引用聖經或是天父之名，他竟秀了一手嘴砲驅魔！

  .

  他一看到惡魔就馬上嗆聲：「你知道我是誰嗎？」，哇靠，簡直像個8+9一樣，然後還要

  使出激將法，開始嘲笑跟質疑惡魔的能力：「你真的那麼行？怎麼不附身個大人物？」。

  之後他做了什麼事我不能說，你們要親自去戲院看才行，我只能說我這輩子沒看過這麼爆

  笑的驅魔手段，雖然電影確實是保留了開頭那個惡魔附身為假的可能性，但我就是要當作

  是真的，因為這樣比較好笑。

  .

  這完全就是早期動作片男主角的風範：光是一身高超武藝(但用各種聖物來取代刀槍和拳

  腳)、還有面對危機時處變不驚的膽識還不夠，你還要能夠說得一口優秀的垃圾話，傳統

  動作片的男主角可以在槍林彈雨中來句俏皮話，而羅素克洛當然也要在驅魔之餘講些笑話

  才行。

  .

  電影裡甚至透過羅素克洛的台詞，告訴了我們先前任何驅魔片都沒有教過我們的重要知識

  ：「惡魔不喜歡笑話」。可惜了，要是當初《大法師》裡的神父願意在研讀聖經之餘撥點

  時間來學幾個笑話就好了，或許那片的結局就不會如此慘烈。但羅素克洛不一樣，他在電

  影中可是不斷抓住各種可以講垃圾話的機會。

  .

  而當你意識到原來這是一部動作片時，你就會對這片選角的疑慮一掃而空，羅素克洛直接

  成了這位驅魔士的絕佳代言人，這個角色當然需要威嚴，否則你要如何相信他能與惡魔對

  抗？羅素克洛巨大的身軀不怒自威，加上他長年的暴力史也讓這個人的氣質本身就充滿暴

  戾之氣，不必特別去演就已經自然有了威嚴。他有些創傷需要療癒與救贖，電影稍微觸及

  了一下但也沒有很深入，不過羅素克洛帶些滄桑的外型已經讓這個角色格外有說服力。

  .

  但這部電影同時也給了羅素克洛一個嶄新討喜的形象，作為隊友的羅素克洛一向讓人覺得

  有股安心感，但要說他讓人覺得親近又是另外一回事了，他總讓人覺得可靠、但不是很想

  跟他相處。然而這片卻把羅素克洛拍得討喜親人，彷彿一個，不說教也不倚老賣老、文武

  雙全又擁有大智慧的長輩一般，就連他的專屬載具都經過特別設計，如同巨樹一般高大挺

  拔的羅素克洛，騎著那台小摩托車反而讓他有股反差萌的可愛喜感，你很難將羅素克洛跟

  和藹可親這個詞聯想在一起，但這片還真的辦到了。

  .

  那麼最後我們稍微回到這部電影的恐怖元素上，這部電影恐怖嗎？老實說這點我就覺得蠻

  清淡的，我還記得羅素克洛對魔鬼叫囂的歡快場景，但完全想不起來電影裡有什麼嚇人的

  場面，有一些驅魔片必備的肉體扭曲跟血腥場面，不過口味並不重，當然這點見仁見智，

  我自己對於恐怖片的承受度算蠻高的，尤其對於驅魔電影更是幾乎免疫，但當天電影結束

  之後我確實也聽到了有觀眾在分享他被電影給嚇壞了，所以我說的不恐怖就...參考就好

  ，這就像你問嗜吃辣的朋友這菜會辣嗎？你也知道如果他說不會很辣的話聽聽就好。

  .

  總得來說，如果期待一部恐怖電影，我會覺得這片有些平淡無奇，但如果你喜歡羅素克洛

  ，那大可放心進場。這樣說好了：你對羅素克洛的喜愛度，會直接影響你對這片的觀感，

  當演到結局時換他被惡魔附身時，你甚至會懷疑他是不是其實蠻懷念之前演變身怪醫的日

  子，至少整部電影羅素克洛看起來玩得蠻開心的就是了。


  --

  歡快是指我看電影時的心情，不是指羅素克洛跟惡魔之間啦哈哈'
