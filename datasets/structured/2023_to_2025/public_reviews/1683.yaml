url: https://www.ptt.cc/bbs/movie/M.1683324304.A.EDF.html
title: '[大爛雷] 《梵蒂岡驅魔士》--我看了什麼鬼？'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  一直對驅魔題材有興趣，從小時候看的大法師，後來的the Excorcism of Emily Rose，

  到韓國的「黑祭司們」，只能說這種題材的片子要拍爛不容易。


  但沒想到由Russell Crowe主演的這部可以打破新的下限，讓我恨意無限...


  要恐怖沒恐怖，連起碼的jump shock都很少。

  也不是神怪特效片，雖然後來進了地底，但是那種牽強又爛的特效讓我無言，

  說真的，比起來二十年前港片「風雲」最後的雄霸vs.風雲的洞窟決戰還比較精彩。

  也不是動作片，Russell Crowe與他的快樂書生夥伴根本打不起來。

  也不是劇情片，兩個神父的角色平板，浪費了Russell Crowe的演技。

  受害母子三人不但角色平板，彼此的關係也建立得很牽強，讓人無法帶入情緒。

  也不是政治驚悚劇，描寫教廷內部的派系鬥爭幼稚有如小學生，

  我還寧可看「交響情人夢」裡面的白癡吵架還比較有意思。


  節奏控制爛。

  美術設計爛。

  配樂普。

  服裝普。


  連那個被附身的小男孩，我從頭到尾只想叫他去刷牙，牙垢有夠噁，演技尬到不行。


  靠邀我到底看了什麼。


  --'
