title: '[好雷] 梵蒂岡驅魔士-神父好忙'
content: "雷文防雷資訊頁\n \n \n \n \n預告片頗吸引我的，入場支持。\n以下多劇情雷，慎入。\nP.S.有關宗教觀點理性討論。\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \ \n \n \n \n \n\n補人權，這次的票是用累積了很久的點數兌換的。\n \n \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \ \n劇情大綱:羅馬教廷首席驅魔士奉命前往處理棘手的驅魔案件，\n         本以為又跟往常一樣只是遇到精神病患罷了，殊不知卻碰到了BOSS。\n  \
  \       一邊手把手帶著徒弟學習如何驅魔，一邊對抗自己的心魔，\n         最終成功驅魔，也成功獲得了剩下的199個驅魔任務。\n       \
  \  果然是績效良好的員工，能獲得更多的工作呢~\n \n與其說是隨著驅魔儀式帶動劇情，不如說藉由劇情發展，展露出教廷的黑暗面。\n \n先說嘈點的部分:\n\
  一、第一個CASE編劇自己就直接無情吐槽，家裡有電視，\n    所以是平常偷看偷學英文，然後裝瘋賣傻，可憐了無辜的豬豬。\n \n二、整修的施工工人也太沒有工安意識了吧?\n\
  \    老舊建築整修過程、地下室、密閉空間縫隙、信號彈?\n    沼氣、天然氣都好，沒聞到也該有意識不要亂點火吧?\n    這下真的物理巴比Q了。\n \n\
  三、前往第二案前，首席明明就有去館藏查找該修道院的資料，\n    但對比後段劇情教宗看的資訊，不知道是館藏有分一般閱覽用/教宗專用書，\n    (教宗看到最後有一小封蠟封信件)\n\
  \    還是純粹首席沒有好好看完，書本最後面重要訊息\"惡魔的名\"，\n    (首席自己也清楚知道要先知道惡魔的名，才能成功驅魔)。\n \n這點我有點不確定，還是首席在地下室中前任驅魔士日記才看到惡魔的名？\n\
  \ \n \n四、第二案從首席到現場後就入夜了，但整個驅魔儀式從頭到尾有彩繪玻璃\n    的地方都透出自然光?甚至玻璃爆光那幕也是亮的。\n \n五、師傅都跟你說不能中斷詠唱(祝禱文)、不能跟惡魔交談了，\n\
  \    徒弟你...(嘆)。\n \n六、恐怖片老梗，遇到問題的時候盡量大家分開行動沒關係。\n \n七、最後大戰的時候，如果那個聖印跟十字架直接放到額頭上就能物理驅魔了，\n\
  \    我就問一下...你們前面在瞎忙甚麼的?\n    阿，可能一開始就把十字架放男孩額頭上就全片終，會造成片長太短的問題。\n \n以上種種雖然滿滿嘈點，但是不得不說，整個驅魔儀式過程還是蠻不錯的。\n\
  該帥的有帥度、該露奶的給你一雙、該血腥的有爆漿、該燒毀的也連粉都不剩。\n \n再來提及一下信仰有關的部分:\n先打預防針，筆者本人從小是拿香的，家裡以前從事宗教書籍行業，\n\
  接觸過不同宗教人士，近2年又跟著女友周日上教會，不敢說有多麼中立\n但深知宗教本來的出發點都是好的，但往往掌握了越來越多的錢和權後，\n就會有了貪婪和腐敗的一面顯現出來。\n\
  畢竟台灣社會版面自宋七力、紫衫軍、、、等從不缺乏宗教負面新聞，\n但真正有在幫助地方弱勢的團體還是大有人在的。\n(筆者前陣子才受益)\n \n一、第一案結束到首席被訊問的過程就提及，\n\
  \    98%的案件都是精神疾病而已，真正需要驅魔的僅只有2%，\n    直接點出其實很多時候所謂的中邪、被附身(或其他同義詞)，\n    患者真正需要的是尋求醫療幫助而非宗教信仰，\n\
  \    第二案也快速帶出媽媽第一時間就將兒子帶去醫院做精密檢查，\n    但都查無病因，才轉而求助教會及教廷幫助。\n    (筆者本人小時也喝過不少次符水)\n\
  \ \n二、劇情中段提及該修道院被梵蒂岡教廷封印的主因，\n    帶出中世紀時期教廷黑歷史「異端審判所」，\n    雖然承認該行為，但後半卻又推辭說是因為當代的首席驅魔士被惡魔附身，\n\
  \    慫恿說服女王去成立「異端審判所」的。\n    不禁讓我想起好些新聞片段:\n    殺人犯A因精神疾病鑑定報告獲判無罪當庭釋放，大概是這種感覺。\n\
  \ \n三、關於告解的部分，透過將自己的罪過告知他人(神父)，\n    並經由他人與第三人(耶穌基督)的原諒(赦免)，來獲得抵抗心魔的成效，\n    且刻意讓師徒兩神父相互告解來表明人非聖賢，孰能無過的狀況。\n\
  \    還一併帶出教廷長久以來為人所詬病的性侵等醜聞。\n    搭配上驅魔過程不斷提及的「只有自己能打敗自己」，\n    反過來也能解釋為「只有自己能原諒自己」。\n\
  \ \n巴拉巴拉巴拉…以上純屬個人觀點，請鞭小力點，理性討論。\n個人還是覺得每周有固定運動的習慣，才是真正對身心都有舒壓的方式。\n信仰我把它視為只要心存善念，不管你信神還是佛，都是好的。\n\
  \ \n \n \n \n \n \n \n \n \n \n \n \n \n--\n帥度不下基奴李維\n人體爆漿那段只有輔15也蠻妙的\n嚴重外擴，差評。\n\
  \ 對，就是特地強調該惡魔強大到連放了500多年的信殘留的邪氣都能感染教宗等級的人（雖\n他是年老體衰了）。\n 純粹是讓徬徨無助的媽媽有個努力的方向，妙的點其實是母女兩在最後大戰時能幫忙背誦?\n\
  祈禱文，畢竟劇情上看來兩人平常是沒有上教會的。\n \n\n\n有時候面對壓力大的工作，還處理的案子本身精神不正常的人居多時，讓自己心態維持輕鬆\n，游刃有餘蠻重要的。\n\
  \n快去，絕對值回票價。\n恭喜歡度2小時\n \n神父原則上不能結婚，所以徒弟說他對神的愛勝過對女友的愛（不願為了結婚而不當神父）\n。推測女友可能因此自殺成了他的心魔。"
