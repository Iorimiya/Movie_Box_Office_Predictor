url: https://www.ptt.cc/bbs/movie/M.1682766001.A.3FC.html
title: '[好雷]【梵蒂岡驅魔士】人比鬼還兇'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  影片影評



  文字版

  對看慣歐美電影的觀眾們而言，【驅魔】一直都應該是他們不會太過陌生的題材，1973年

  的【大法師】應該是影響近代驅魔類型電影最大的，從日後的【鬼玩人】、【康斯坦丁：

  驅魔神探】、【最後大法師】（當然還有【驚聲尖笑2】）等片，幾乎每逢驅魔，就會看

  到著魔的人身形扭曲如同爬蟲，然後口中噴吐各式顏色的液體，然後口吐髒話，而驅魔的

  過程有些走寫實路線，有些則強調魔鬼的殘忍，較為魔幻的則會像【康斯坦丁：驅魔神探

  】那樣還會看到各種光影變化，甚至還有各種天使、魔鬼出現。


  就當我覺得好萊塢的驅魔題材已經沒啥可玩的時後，這時候，出現了這一部改編自真人真

  事的【梵蒂岡驅魔士】。


  一開始看到是羅素克洛主演，我就忍不住有興趣，眾所皆知，羅素克洛可是【神鬼戰士】

  的麥希穆斯、【鋼鐵之軀】裡頭超人的老爸，他甚至還是【超危險駕駛】裡頭那個只因為

  被按了喇叭把對方追到天涯海角的路怒狂人。可說是硬漢當中的硬漢。


  這種人來驅魔，電影根本就不會有什麼恐怖元素吧？我上次看到類似的角色設計，已經是

  1999年的【魔鬼末日】了。（不過當年那個設計更狠，阿諾史瓦辛格對上魔鬼？魔鬼根本

  用什麼幻覺都對阿諾無效，阿諾最後可是用火箭筒把魔鬼給炸爆了，逼得電影製作組都要

  幫魔鬼加一點物理攻擊設定，比如說魔鬼的尿可以當汽油點燃。）


  果不其然【梵蒂岡驅魔士】幾乎沒啥恐怖元素，打從開場，羅素克洛所飾演的阿摩特神父

  穿著黑色的長袍，帶著牧師帽，在有意無意地模仿著1973年【大法師】中神父下車準備驅

  魔的鏡頭下，羅素克洛在雨中緩緩走入民家裡頭，一進場就是個幽默對談，當阿摩特神父

  詢問農夫們著魔者有什麼異常時，歐洲的農夫們顫抖著說：


  "我家的孩子忽然講英文了。"


  這句話一開口就忍不住讓我莞爾，眾所皆知好萊塢電影的標準語言就是英文，就算電影當

  中一開始在非英語系的國家再怎麼講當地語言，最後也還是會為了讓觀眾舒服觀賞而切換

  回英文，所以就連【獵殺紅色十月】這種描繪蘇聯潛水艇故事的電影，史恩康納萊與山姆

  尼爾在講了幾句俄文之後還是會切換回英文。


  結果這場戲羅素克洛還真沒有用英文回應著魔的男孩，一路都用義大利語對答。而且驅魔

  的過程其實滿有趣的，原來一開始還要跟附身的鬼展開舌戰辯論。


  魔鬼一開始恐嚇羅素克洛，結果羅素克洛竟然開始跟鬼嗆聲，問鬼既然說自己是鬼，那怎

  麼不知道他大爺羅素克洛的來頭？而且怎麼不去附身在更位高權重的人身上偏偏要附身在

  鄉下小鎮一個男孩身上？鬼似乎很不服氣，說自己什麼人都可以附身，然後羅素克洛就要

  鬼證明他可以附身到旁邊的豬上頭。鬼就照辦了～

  一開場的鬼根本就8+9個性，超好騙的ＸＤ


  我都覺得羅素克洛一開場要跟鬼飆罵台語了：你甘知林北叫蝦咪名？哇西混梵蒂岡誒膩！


  光就這開場的戲碼，基本就已經訂立了全片的基調。


  阿摩特神父本人曾經這麼說過：

  "我害怕撒旦嗎？是他應該害怕我，我在世上是因著天主的聖名而行事，而他只不過是天

  主的猴子！"


  因此，當羅素克洛所飾演的阿摩特神父那壯碩的身軀，騎著一台小綿羊在義大利街頭穿梭

  時，那個畫面既可愛又令人安心。


  因此在接下來的驅魔任務當中，觀眾再也不需要害怕魔鬼的恐怖，這跟【鬼玩人：復活】

  裡頭那些無助的孩子與柔弱的單親媽媽們不同，羅素克洛甚至不需要散彈槍與鏈鋸來把著

  魔的人碎屍萬段，他靠的只有手上那個十字架，經文以及忽如其來的奇妙幽默感，每當魔

  鬼面目猙獰的恐嚇他的時候，羅素克洛往往會忽如其來的講一段笑話，把所有魔鬼的恐怖

  氣息一掃而空。


  當魔鬼獰笑著揚言要成為羅素克洛最大的噩夢時，羅素克洛的反應卻是嚴肅地說：


  "我最大的噩夢，是讓法國拿到世界杯的冠軍。"


  這叫魔鬼該怎麼感染恐懼呢？


  難怪羅素克洛會對片中的年輕神父說魔鬼不喜歡笑話了。


  有鑒於次，【梵蒂岡驅魔士】名為驅魔，實際上根本就不太像恐怖片，當然它一定會有驅

  魔類型當中一定擁有的扭曲肢體、突發驚嚇以及把人丟來丟去的奇妙力量，也會有利用驅

  魔的神父們內心罪惡感的幻覺的橋段。但是本質上來說，【梵蒂岡驅魔士】根本就是一部

  龐德電影：一個桀驁不馴又不受到行政單位欣賞的特派探員，受到元首（教宗若望保祿二

  世）親自委託，前往調查各地不明的事件，尋找魔鬼真正的企圖，揭發魔鬼的陰謀，然後

  復興教廷的威望。


  而且製作群甚至最後也懶得裝了，直接讓羅素克洛與他新收的年輕徒弟走進一間宛如龐德

  電影當中Q的武器實驗室般的大廳裡，在來回穿梭的研究者當中，明定出魔鬼針對叫教廷

  的攻擊目標，原來過去教會在中世紀時迫害異教徒的行為完全都是魔鬼的計畫，現在又要

  捲土重來，而且還有一張地圖顯示魔鬼們的計畫，兩個驅魔神父豪氣萬丈的要在這輩子把

  199名魔鬼解決掉。


  這哪是什麼恐怖片，片尾超級熱血的啊！


  總體而言，【梵蒂岡驅魔士】是一部相當療癒的奇幻冒險電影，他有著驅魔的題材，但是

  卻有比鬼還兇的神父，所以觀眾根本不用擔心片中的角色會遇到什麼問題，只要有阿摩特

  神父在場，鬼到最後根本就無力抵抗，看這部電影完完全全是精神上的爽片，如果你最近

  累積很多壓力，心情不好，進場看羅素克洛整鬼會是一個舒壓好選擇。


  --'
