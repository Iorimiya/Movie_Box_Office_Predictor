url: https://www.ptt.cc/bbs/movie/M.1682772093.A.299.html
title: '[普雷] 《梵蒂岡驅魔士》可愛的羅素克洛'
content: '這樣可愛的羅素克洛，惡靈你要如何抵抗？



  只差機車後面的行李沒有換成外送箱，

  不然就成為外送驅魔師XD


  本片是改編Gabriele Amorth兩本驅魔著作，

  以驅魔片來說，算是中規中矩，沒有太多驚

  艷的劇情橋段，恐怖及氣氛壓迫營造程度也

  是小兒科等級，如果是恐怖片愛好者，我想會

  是失望的，個人比較喜愛導演在2018的大君主行動。




  主要被附身者的妝容及演技表現，感受不到

  威迫感，全部都是很一般驅魔片中會有的橋

  段，劇情沒有太多轉折，缺乏突出的亮點。



  尤其一些邪靈表情橋段畫面，還以為在看日

  漫的驚訝張嘴表情XD



  認為還是主要靠羅素克洛在片中展現的魅力

  ，來撐起整部片，其它部分我是真的認為還

  滿普通的驅魔恐怖片。



  片中幾幕羅馬競技場，感覺是夢回麥希穆斯



  恐怖血腥程度都是遜於剛上映不久的鬼玩人：

  復活，但如果你是羅素克洛及愛好恐怖片的

  粉絲，是可以進場看看羅素克洛帶來的魅力

  。





  --'
