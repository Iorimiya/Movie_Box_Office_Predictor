url: https://www.ptt.cc/bbs/movie/M.1683818812.A.39C.html
title: '[普雷]梵蒂岡驅魔士-奇幻類驅魔電影'
content: '作為一位基督教傳道人（按立為，又曾買過阿摩特神父的兩本書， 在看完電影之後，想

  要澄清一些事情；

  但並非全部，因為基督教跟天主教在教會系統上仍然有許多不同之處。




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  以劇本來說，這幾乎算是一個原創劇本了， 有參考書籍的部分，是當時普世教會對於魔

  鬼的否定，還有一些附魔跡象的證據（例如吐出異物、說出異國語言）， 以及鬼附還有

  心理疾病的差異。至於那些梵蒂岡封印惡魔的修道院，則是書中從未出現過的事蹟，驅魔

  也不可能失敗，因為邪不勝正， 神永遠是得勝的一方。所以我認為「驅魔」題材應該從

  驚悚片當中另外被框架出來，因為這類電影並非是要驚嚇觀眾而拍攝，背後都有一些神學

  議題要伸張，若想看更典型的可以看Scott Derrickson的作品。

  不過對於異端裁判所負責人其實是被鬼附後產生瘋狂的屠殺舉動，

  倒是對於歷史事件提供一個充滿想像的討論空間。


  阿摩特神父的書籍中譯本共出版四本，筆者入手前三本，內容主要是講述他在服事的這些

  年日當中，從驅魔禮所得來的經驗。平鋪直述的內容卻相當寶貴、且實用；不過關於聖物

  的使用跟電影還是有些出入，至少手掌般大的那面銅牌我個人認為應該是電影當中虛構的

  物品，更別說後面產生雙瞳的彰顯跡象了。至於基督教則沒有那麼多聖物的使用，我們既

  沒有聖帶、也沒有聖水（要自己祝聖當然也行），大部分時候就單單憑著禱告的話語，也

  不會拿十字架比劃。因為天主教相信這些被聖人祝聖過的物品帶有能力，可以加乘效果，

  基督教則認為這些能力都透過禱告的話語使神的權柄與我們同在。


  來談談電影當中最後自殺的個案Rosaria，阿摩特神父的職位是驅魔師，並非駐堂神父，

  所以不負責牧養教會；但是他的工作就是巡迴各處，幫助被鬼附的人得醫治釋放。所以當

  他發現這名個案並非鬼附後就轉介，其實是正常程序。以筆者個人經驗來說，也是要配合

  心理諮商專業的人共同進行，才能找到問題癥結。至於發現跟教廷性侵有關的事情卻沒有

  處理，可能就是劇中神父心裡軟弱的部分，也因此被魔鬼利用罪惡感攻擊。影射羅馬教廷

  曾經的腐敗、還有神父守獨身戒律的無奈，算是相當寫實的呈現。


  哪者比較輕鬆？很難比較，不過驅魔師一定會受到魔鬼的攻擊，因為邪靈目前只能趕走不

  能殺，報復性的攻擊是難免；駐堂神職人員則是偶爾得承受來自惡魔利用人心的攻擊。


  至於魔鬼彰顯的行為，宿主力量會變大是確實的；但會不會爬到牆上，或者移動物品，至

  少個人還未曾遇過；但臉部變形眼神丕變則是真實現象，但不會像電影那麼誇張。其實我

  覺得大魔王找這個小男孩來演是有點勉強了，我看到後面不禁覺得很可愛。有一說是因為

  台灣這片土地歷史還算年輕，只會有一些無名的孤魂野鬼，道行還沒那麼高；但是歷史文

  化悠久的歐亞大陸，就會盤踞許多千年老妖，就是那些被神打入地獄的墮落天使、和那些

  有名字，其中最常出現的就是所羅門72柱魔神名單，而邪魔在靈界是有地域性的，在台灣

  並不太有機會遇到，這一類的魔鬼最好是以團體戰的方式應付，會比較安全。


  其實電影演到前段我就有點後悔進場了，還買了貴桑桑的餐食套票。整部電影雖然有創新

  之處，但不知道為何說故事的方式總難以讓人提起興趣，短短不到兩小時的片長，塞了一

  堆角色的戲路，顯得每一條都相當瑣碎又交代不清，實在很懷疑為何羅素克洛要接這電影

  啊或許是因為真實人物的事蹟使他敬佩吧？這電影若沒有羅素克洛，毫無可取之處。

  片尾有留下伏筆，但個人認為若要拍第二集還是把編導都換換吧，至少把被鬼附宿主的故

  事講得生動一點。


  --'
