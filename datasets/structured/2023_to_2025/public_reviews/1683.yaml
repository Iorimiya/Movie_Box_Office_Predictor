url: https://www.ptt.cc/bbs/movie/M.1683206940.A.B6D.html
title: 'Re: [好雷] 《梵蒂岡驅魔士》-驅魔皮，動作骨'
content: '我是不覺得這部有到動作片啦 但是羅素克洛的確有把神父霸氣演出來


  一開始的驅魔 也不是只是做一個對比 而是告訴你這個體系的宗教是怎樣驅魔

  約翰福音開篇就說：太初有話，話與神同在，話就是神

  這個話台灣原本是翻譯成道 可能是很容易跟道德經的道混淆

  後來直接就翻譯直白變成話 怎麼說呢？

  到創世紀去看上帝：

  神說：「要有光」，就有了光。

  神說：「諸水之間要有空氣，將水分為上下。」

  神說：「天下的水要聚在一處，使旱地露出來。」事就這樣成了。

  神說：「地要發生青草和結種子的菜蔬，並結果子的樹木，各從其類，果子都包著核。」

  事就這樣成了。


  基本上創世七天 就跟CHATGPT差不多，都是下指令就成了。

  這是什麼意思？就是跟咒術迴戰的狗卷一樣的言靈系統，不過上帝是最強的咒靈

  大概是這種概念


  所以在這個體系中，你知道魔鬼是誰，你就可以下指令控制他，這類型的驅魔片

  大概也都是以找出對方是誰為目標，比如基哥的驅魔神探。

  更早的起源，可能是埃及神話，伊西斯用拉的真名奪取太陽神的神力的故事。


  不過一開始的惡魔太小咖 或者不要浪費兩百個墮天使，所以是用耶穌驅鬼的典故

  讓鬼被騙到豬身上，然後幹掉，有點中國民間故事的FU。


  認真說，這部其實不太算恐怖片，至少我是覺得不恐怖啦，比較像是驚悚偵探片，

  不過我是覺得蠻好看的，可能也是因為我比較少看這類型片子的關係。

  我在神父身上，看到了靈幻先生裡面說的，正邪對立終生搏鬥的精神，很久沒看到

  這樣的片子，現在的鬼片似乎都是一面倒的被鬼虐，我不是太愛看。

  尤其是神父最後跟年輕神父告解的時候，我乾眼症的都要流下眼淚，明明就不是哭點

  真的是很奇怪


  不過這部還是有明顯的缺點啦，我認真覺得年輕神父看起來有股邪氣，我一開始看到以為

  他是要演反派。


  然後依照前方的言靈規則，理論上知道名字就可以控制惡魔了，結果最後搞到變成賣熱血

  我是覺得沒有驅魔神探處理得漂亮。


  然後總覺得劇情有點想幫宗教裁判所洗白啊。


  瑕不掩瑜，這部我是看得蠻開心的，前面幾篇有看到說比這部更好的片，都

  歡迎推薦給我啦。


  --

  我有看過中文版的書 其實跟電影沒什麼關係'
