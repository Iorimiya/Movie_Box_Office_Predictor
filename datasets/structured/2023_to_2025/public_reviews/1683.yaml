url: https://www.ptt.cc/bbs/movie/M.1684157285.A.F8C.html
title: '[普雷] 梵蒂岡驅魔士：各演各的'
content: '法國人表示不喜歡這部電影
























  一部很可惜的電影，可惜羅素克洛的影帝級演技，這部電影塞了太多元素，


  直到中間我還相信主角所說的，惡魔來自於內心的罪惡感。


  看完只覺得惡魔來自於好萊塢票房，為了符合好萊塢對驅魔片的胃口，


  歷史翻案、裸體+屍體、尬到不行的噴血，開頭找主角麻煩的主教就這樣掛了？


  他只是被教宗嘴砲一下(物理)啊，還以為教宗在玩越南大戰哩。


  結局主角帶新弟子去見教宗已經夠尬了，硬要多添一段還有199個惡魔等著拍續集。


  如果不是羅素克洛的幽默驅魔人形象演得好，我會給這部負雷。


  這劇本不如拿去出遊戲，尺度可以更高肯定賣爆。


  --'
