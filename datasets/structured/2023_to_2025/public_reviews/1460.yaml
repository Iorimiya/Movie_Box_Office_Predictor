url: https://www.ptt.cc/bbs/movie/M.1710303380.A.993.html
title: '[  雷] 私刑教育3'
content: '防雷




























































































  這個系列不知不覺也來到了這一步

  即使對這個ip,對勞勃麥考這個角色沒有特別感情

  跟見證他的起承轉合而感嘆還是不衝突

  在1的高評價之下,2的評價極其慘烈

  我也覺得2真的遜色了點(看那碎裂的故事線

  3終於扳回一城,好好講完了一段故事

  為勞勃麥考這個人的人生做一個不錯的收尾


  其實我看別人對這個系列的評價很有趣

  就是對於他是爽片還是劇情片感到猶疑

  他真的有多爽嗎？絕對沒有,頂多1還有溝到標準

  所以接下來的續集評價負面也有不夠爽的原因

  當然2把它當劇情片還是比較難給他好話

  總之我是把它當劇情片看了,動作戲就當bonus

  至少我很享受這個義大利小鎮的純樸風情

  也更能共情這一集的流血衝突

  可惜衝突的結尾收得差強人意了點,有點反高潮

  對於黑道的描寫前後有點矛盾

  達科塔芬妮的戲份也是可有可無,食之無味棄之可惜

  （但她漂亮的出場就夠了嘿嘿


  很難得丹佐華盛頓年紀一把還演這種電影

  雖然我說動作戲只是bonus,但絕對是super bonus

  光是開場的打戲就霸氣十足,之後也沒有手軟過

  也是勞勃麥考深植人心的一點

  老醫生問他是好人還是壞人也相當的審視這個角色


  而他回答不知道,大概是要觀眾自己定義吧

  他到底是好人還是壞人有很多種答案

  但勞勃麥考的確是個傳奇,而他現在終於有了歸宿

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  我們不應該流淚，那對內心來說，等於是身體的敗北。

  那只是證明了我們擁有心這件事根本就是多餘的


  --'
