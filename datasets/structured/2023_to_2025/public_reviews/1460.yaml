url: https://www.ptt.cc/bbs/movie/M.1693457107.A.0EA.html
title: '[普負雷]  私刑教育3'
content: "雷文防雷資訊頁\n\n\n\n~*\n-*\n~*\n-*\n~*\n-*\n~*\n-*\n~*\n-*\n~*\n-*\n~*\n-*\n\
  ~*\n-*\n~*\n-*\n~*\n-*\n~*\n-*\n~*\n-*\n~\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n 剛看完從電影院出場\n\n這系列就是要看丹佐打打殺殺\n\n結果整部片一小時49分鐘\n\n打鬥大概分三部分，前兩部份預告幾乎都演了。\n\n一開始酒莊後，前一小時都在鋪陳丹佐融入西西里\n\
  \n在接上預告的餐館手指按摩戲 最後只剩大決戰\n\n看完爽度真的比第二集還空虛….\n\n另外\n\n達珂塔芬妮 應是演第二集女同事的女兒？\n\n出場鏡頭兩隻手數得出來。\n\
  \n\n\n-----\nSent from JPTT on my iPhone\n\n--\n\n--\n預告前兩段打鬥幾乎都有告訴你了什麼時候會開始\n第一集真的經典\
  \ 這集算了吧...\n氣氛鋪成固然重要 但鋪成了將近70%真的太多\n預告也只剩最後打鬥沒告訴你 其他都演了 哈\n謝謝 已改正"
