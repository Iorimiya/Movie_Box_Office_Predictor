url: https://www.ptt.cc/bbs/movie/M.1642067066.A.1B6.html
title: '[情報] 丹佐華盛頓證實已排定演出《私刑教育3》'
content: 'BY VINNIE MANCUSO






  Director Antoine Fuqua''s The Equalizer and The Equalizer 2 both belong in the

  rare but hallowed subgenre of "Denzel Washington beating the shit out of

  people," so needless to say we''ve eagerly kept our ears to the ground for any

  news of a third entry. The trail has been cold for a few years now, with The

  Equalizer 2 hitting theaters in 2018, until Collider''s Steve Weintraub sat

  down with the Oscar-winner to discuss The Tragedy of Macbeth and learned, uh,

  The Equalizer 3 might be Washington''s very next film.










  Here''s exactly what the actor told us about his post-Macbeth plans for 2022:





  "They have written the third Equalizer, so I’m scheduled to do that. So I

  gotta get in shape and start beating people up again. I get to beat people up

  again. The tragedy of Macbeth and then going and beating some people up. Can’

  t get any better, right?"








  Additionally, sources have told Collider that Fuqua is currently in talks to

  direct the third film. Negotiations are ongoing, but we don''t expect there to

  be any hold-ups. We expect this to be his next film after working with Will

  Smith on Emancipation, which is being made for Apple TV+.









  消息來源：


  --



  私刑教育     2014.09.26    5500萬         1.92億

  私刑教育2    2018.07.20    6200萬-7900萬  1.9 億



  最強特力屋阿北!!!!


  --'
