url: https://www.ptt.cc/bbs/movie/M.1693481907.A.847.html
title: '[負雷] 私刑教育3  連癢處都沒有找到..'
content: '有人說第二集很差


  至少某爆的攻擊設計,還蠻新穎的


  但是這集..很難說達到前兩集水準


  有點像在某max電影台放映


  後來改到某森電影台那樣..


  (防雷) (還有部分第一滴血5的雷)




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  直接跳到老大氣pupu 殺到小鎮找人的環節好了 電影大概剩不到1/4


  當老大當眾崩了小隊長一槍,窩想說:喔~夠果斷 畢竟之前剁警察署長的手,都沒眨一下眼


  挨?結果沒死,打個耳朵? 窩都期待接下來要抓小隊長老婆,當下一個槍下人質了..


  這時勞勃的聲音出現了 這應該是喇叭擴音器之類的吧? 沒有!就這樣走出來


  老大又沒有即刻拿槍崩了勞勃 窩想:好,至少劇情上不能讓勞勃把兩把槍拿直,1分鐘內斃了

  在場所有人,變成七旬黑版姜維克..


  所以編劇選擇讓勞勃放下槍就逮,然後逮回老巢開始脫逃術+開殺嗎?


  結果也不是! Enzo突然開了一槍 再加上小鎮無以計數的手機 讓老大的智商瞬間/10 撤退


  而回去老巢的老大,去取更強大的武裝,再夜襲小鎮嗎?

  不是! 是 邊嗆窩要斃了那美國佬


  但是 是 挖賽..看到弟弟死狀之慘,尼居然覺得還有明天, 這時智商要√了..


  然後就真的去睡大覺了,還睡得很香甜, 剩下幹部分兩組,一組分散亂晃,一組在玩牌..



  再來就沒啥好說的惹


  幹部被各種秒殺,然後鏡頭超暗..烏漆抹黑的根本看不到華盛頓怎麼出手的?..


  還有老大被玩..


  看到這部分窩覺得 Enzo說的不盡然全對,這時候的勞勃比壞人還要壞


  但老實說,尼觀眾


  藍波不但殺進對方家斬首 還能另反殺過來的敵方,全數重陷阱被殲!


  只是 本片不敢讓達柯塔真的被炸死


  ..事實上 是麥考讓達柯塔陷入險境 而與第二集有親子關係只是免強想讓三部曲有相關的

  自圓其說..整個拍得很免強



  PS.飾演Enzo醫生的演員,也在《賽道狂人》飾演Enzo Ferrari,說不定有台Enzo Ferrari?


  PS2.老大好像看到Enzo露臉後,神態整個變了,看來Enzo絕不只是偏鄉的一名醫生呢~


  --




  。。10多年後，孩子成了40多歲的大叔，開始稱

  養大他的爸媽還在島上呢。


  --

  多少還是有


  畢竟這集一開始 麥考差點真的掛了,鬼門關都看到了,拄拐杖開始思考剩下人生


  所以魚販被打的一開始沒有出手(沒復原完全也是考量)



  最後才提出一開始討的 三十萬七千六百鎂 是一位乘客被駭走的退休金


  但這圓不回 第一集那種運匠暗中出手的原汁原味'
