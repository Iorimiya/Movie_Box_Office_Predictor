title: '[普無雷] 私刑教育3'
content: '整部片的賣點就是風景很漂亮

  拿掉那些打打殺殺劇情

  還以為丹佐在錄義大利旅遊節目

  .

  看來導演想拍出救贖、內心平靜的意境

  很多時間都在拍城鎮風景

  越看越覺得是不是有拿當地政府的旅遊宣傳費…而且拍的很棒…都想去義大利玩了…

  .

  如果只想看丹佐大殺四方

  片頭、片中、片尾都有

  過招精彩不拖泥帶水

  雖然城鎮樓梯很多

  但不會有一直滾不完樓梯的劇情（疑

  丹佐演技沒話說

  差在劇情很怪

  打殺不多都在拍丹佐逛小鎮

  嗯…

  這應該是旅遊宣傳片啦

  -----

  Sent from JPTT on my iPhone


  --'
