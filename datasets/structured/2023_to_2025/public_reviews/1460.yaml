title: '[  好無雷]  私刑教育3'
content: '這集看完心得

  雖然無法超越1，但真的比2好看太多了。

  畢竟在當時1的打鬥、節奏、人設都很吸引人，讓人有耳目一新的感覺。


  第3集故事劇情雖然老套好猜，但整體的運鏡、聲效都很棒，節奏流暢不拖泥帶水，很有

  第1集的風格。第2集劇情就真的拖到讓我忍不住哈欠連連….


  至於丹佐在戲中也依然表現出色，沈穩內斂眼神又帶著殺氣，已經70的他不知還能再拍幾

  部戲。


