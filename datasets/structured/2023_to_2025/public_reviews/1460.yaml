title: '[新聞]《私刑教育3》猛奪台美全球三冠王！海外創'
content: '新聞網址：


  《私刑教育3》猛奪台美全球三冠王！海外創系列最佳開片


  〔記者許世穎／綜合報導〕由影帝丹佐華盛頓和導演安東富夸合作的系列最終章《私刑教

  育3》，上映首週末（9月1至3日）初步統計以3450萬美金（約台幣10.99億元）登頂北美

  週末冠軍，北美以外的海外市場更創下系列最佳開片成績，全球首週也以6000萬美元（約

  台幣19.12億元）登上票房冠軍。




  北美適逢勞動節連假（美國9月第一個週一），4天票房預估將達4200萬美金（約台幣

  13.38億元），創下影史北美勞動節連假第二高的成績。丹佐5度和導演安東合作，並成為

  他合作過最多次的導演，先前受訪時大讚安東的才華和經驗無庸置疑，「我們就像兄弟一

  樣，我完全信任他，他也相信我，我對未來的合作感到興奮，當他走得越深，就會到達更

  高處，我指的不僅僅是電影。」


  該片在知名影評網站爛番茄評價也創下三部曲最高，在觀眾的爆米花指數更高達93%。電

  影上週四（8月31日）在台上映後，也殺出票房佳績，首日全台就突破台幣450萬元，榮登

  開片冠軍，預計也拿下週末票房冠軍，詳細票房數字下午揭曉。《私刑教育3》全台上映

  中。



  Denzel Washington Taiwan



  --

