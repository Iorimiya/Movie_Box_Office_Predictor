url: https://www.ptt.cc/bbs/movie/M.1695061484.A.49C.html
title: '[好雷] 私刑教育3'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~









  私刑教育3的劇情跟節奏挺喜歡的，

  雖然跟多數人一樣很愛私刑教育1、

  覺得2有點走鐘，

  但3在觀影時決定不帶太多預期，

  反倒是可以欣賞到該片的美感。


  一開始就有勞勃風格的酒莊案發現場，

  由一個原本以為只是個老頭，

  脫掉帽子後，

  氣勢跟風格都有西西里黑手黨味道開始浮現。


  整部片義式風格的味道很明顯，

  就像杯卡布奇諾一樣，

  跟著勞勃在南義濱海小鎮養傷與欣賞該地風光，

  與鎮民的互動往來，

  純樸的地方讓人不自覺地愛上。


  但在混混收取保護費魚肉日常往來的鄉民，

  小鎮鄉民們的氣憤但又無可奈何，

  顯示著黑手黨的陰影一直覆蓋在南義的每個地方

  沒有什麼黑幫浪漫，

  一切都是靠著壓榨與威脅市民與鄉民來牟利，

  勞勃心底的火也慢慢的累積著，等著宣洩出來


  與混混發生衝突後，也知道混混肯定報復，

  勞勃每次都走在對方前面，

  只後來對方老大直接殺到小鎮，

  囂張的要公開處刑，打個措手不及。

  沒想到黑手黨在南義就跟地下皇帝一樣

  囂張跋扈的行徑直逼墨西哥。


  與黑手黨的衝突也很快速，解決時也乾淨利落

  很符合勞勃的身分角色，不跟你拖泥帶水。

  給過機會沒把握，就是斬草除根與先發制人

  而不是像跟初出茅廬的角色一樣，

  放虎歸山後被狠狠毒打。


  雖然覺得很符合人射，不過確實有些不夠過癮。

  感覺有點像退休勇者，

  跑去新手村旁邊山寨打怪的感覺。


  整體來講，該片的風格很舒服，節奏慢慢的，

  但事件發生時又不拖泥帶水。

  濃厚的西西里風味的咖啡，

  帶來跟美式咖啡不太一樣的感受。

  看完後又挺喜歡這個導演的，

  一部同樣題材的故事

  可以拍出三種不同風味的感受。

  是說第二杯有點難喝就是了

  呸呸呸









  -----

  Sent from JPTT on my iPhone


  --'
