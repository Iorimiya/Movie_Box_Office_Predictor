url: https://www.ptt.cc/bbs/movie/M.1705633013.A.1E7.html
title: '[好雷] 私刑教育3 The Equalizer 3'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  感謝N台那麼快就上架《私刑教育3》，此前同室友看過第一和第二集。聽他說丹佐華盛頓

  本來是不拍續集的，《私刑教育2》是他第一次拍續集，而續集確實比第一集更好看。


  我對丹佐華盛頓不熟，也沒有去求證這些事，不過確實挺喜歡《私刑教育》前兩集，特別

  是主角利用場地優勢打爆所有敵人的特點—第一集的ＩＫＥＡ和第二集的老家，雖然主角

  超強到不合理，但對手也不弱，動作戲算得上給好給滿。


  《私刑教育3》基本上算好看，但可惜沒有延續到前兩集那種利用場地特性的設定，直接

  殺入別人地盤，而對手感覺比前兩集都還爛（室友評論如此，我同意）。


  全劇主力在描述主角退休之心，動作場片精簡，但仍算是有力。個人認為比較可惜的部分

  是全片動畫不太給力。因此整體而言，仍不如第一和二。只是相對於某些主張特技和動作

  場面的電影來說，這部第三集故事顯然還是動聽得多。



  ***


  這裡是我的樂園:




  --'
