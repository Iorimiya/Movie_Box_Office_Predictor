title: '[ 好無雷] 私刑教育3，不完美，但仍精彩。'
content: '剛看完，好看。雖然劇情很老套，文戲也有點多，但節奏抓得很好，不會覺得很拖戲。我

  覺得有90分。扣10分應該就是劇情沒新意，跟打戲不夠多吧。


  話說勞勃麥考（丹佐華盛頓）殺得比殺神基努李維還狠。這才是真的如鬼如魅讓人嚇破膽

  。還好他是好人。


  個人覺得好看程度，1 〉3 〉2。第一集還是經典。


  --'
