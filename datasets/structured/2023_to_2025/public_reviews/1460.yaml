title: '[好雷] 私刑教育3'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




















  我是能明白給負雷的想法啦

  打鬥戲除了最後大決戰，預告都雷完了


  但我覺得這集反而是勞勃三集來

  心境描寫最完整的

  第一集是一個可憐的小女孩

  第二集是為了朋友


  只有這集是真的愛上了一個地方，地方的每一個人


  那句你是好人還壞人的問答也是問到心坎裡



  唯一不滿的是大反派抓警長威脅時

  錄影就能讓他退縮?

  勞勃要賭大反派停手?

  這太賭命了啦


  不過大決戰真的超爽

  就想像是驚聲尖叫的正派版

  玩弄獵物，玩弄恐懼

  大快人心


  現實中如果有這樣的一個人

  就能不顧程序不顧法律不顧狡辯的替天行道





  --'
