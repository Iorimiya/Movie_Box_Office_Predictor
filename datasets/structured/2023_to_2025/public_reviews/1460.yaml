url: https://www.ptt.cc/bbs/movie/M.1692838593.A.C4D.html
title: '[新聞] 相隔20年聚首《私刑教育3》！達科塔芬妮一直跟丹佐華盛頓保持聯繫'
content: '新聞網址：


  原標題:



  2023-08-24



  達珂塔芬妮在 2004 年演出《火線救援》時，年紀還不到10歲，而她的對戲搭檔是當代好

  萊塢最頂尖的演員之一——丹佐華盛頓。儘管並非票房或口碑大熱門，他們在電影裡發展

  出的父女情還是令人動容，畢竟誰能不被鐵漢柔情的丹佐與可愛至極的達科塔所打動呢？




  《火線救援》



  時間快轉到20年後，《私刑教育3》成為他們再度聚首的作品。羅伯特麥柯爾是丹佐演藝

  生涯中最著名的角色、《私刑教育》也是他唯一的系列電影，而在這即將成為完結篇的第

  三集，找來達珂塔再度合作似乎是個圓滿的結局。



  達珂塔這次的角色為CIA的分析員艾瑪，在羅伯特對抗南義大利的犯罪組織時，是艾瑪主

  動與他聯繫合作，企圖扳倒當地黑幫勢力的控制。



  「很明顯地，我認識丹佐已經有很長的時間了，他其中一個女兒是我最要好的朋友之一，

  所以我一直都知道他們家的動態。」



  原來達珂塔是他女兒在紐約大學的朋友。


  她繼續說：「絕對沒有人比丹佐更適合跟我搭檔。」



  主動爭取演出機會






  《火線救援》劇照



  導演當然看過《火線救援》，對於當時年僅 9 歲的達珂塔能跟丹佐對戲印象深刻，也認

  為他們的化學效應很適合《私刑教育3》：


  「你看得出來她與當時已經多麼地不同，這是一件很迷人的事，尤其對於丹佐而言。」



  畢竟能跟堂堂丹佐華盛頓合作，是許多演員的夢想，說什麼也要爭取。而能夠在人生的不

  同階段跟他合作兩次，達珂塔肯定是最興奮的：


  「已經快 20 年了，《火線救援》的時候我還很小，但那是一段畢生難忘的經歷。這次我

  們是第二次合作，我的感覺跟多年前一樣——興奮、緊張、想盡可能做好所有準備。他絕

  對是讓你時刻警惕自己的前輩。」




  《私刑教育3》達珂塔芬妮



  現年將近 70 歲的丹佐幾乎可當達科塔的爺爺，又是自己女兒的摯友，因此不意外地在他

  眼裡，達珂塔永遠是以前那個小女孩。




  《私刑教育3》預告：




  是的，達科塔芬妮不只長大了，早就是在好萊塢獨當一面的成熟演員。



  除了丹佐華盛頓與達柯塔芬妮以外，《私刑教育 3》的卡司包含安德烈亞薩爾杜齊奧、大

  衛丹曼、索妮雅班阿瑪、雷莫吉隆，以及歐亨尼奧馬斯特蘭德，台灣8月31日提前美國上

  映。


  --


  原來是Pita主動聯繫的，暖~~~


  --'
