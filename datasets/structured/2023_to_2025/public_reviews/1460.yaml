url: https://www.ptt.cc/bbs/movie/M.1691061290.A.869.html
title: '[新聞] 超市戰神要退休了《私刑教育3》確認是結局'
content: '新聞網址：


  原標題:





  擁有「傢具超市、Uber」戰神美名的前 CIA 特工勞勃·麥考（Robert McCall）可說是近

  代最為人熟知的動作片主角之一，該角色由「影帝」丹佐·華盛頓（Denzel Washington

  ）飾演，在 2014 年、2018 年所推出的《私刑教育》1&2 都大獲好評，而《私刑教育3》

  也即將在本月上映，但製作團隊與主演都表示這次將會為故事畫上句點。



  《私刑教育》是改編自 1980 年代的一部電視劇《都市奇俠》，在當時，麥考是由愛德華

  ·伍德沃德（Edward Woodward）演出。



  兩部作品的故事都是同一個核心，勞勃·麥考是一位身懷絕技的退休特工，平時的他看起

  來就像個無害的老好人，但暗地裡他是個替被害者伸冤的私刑者。



  值得一提的是，英文片名中的「Equalizer」是另一名特工給麥考取的外號，Equalizer

  的意思有使人、事、物達到平等、平衡之意，而麥考在故事中動用私刑的行為正是如此，

  矯正一切壞事使之達到平衡。



  《私刑教育》三部曲皆是由安東尼·法奎（Antoine Fuqua）執導、丹佐·華盛頓主演，

  根據

  。



  對此導演也同意這個說法並表示：


  就是如此。大家的英雄勞勃·麥考將在某個時間點退休，麥考已盡力為他人伸張正義了，

  是時候換人接手。身處異國他鄉的麥考正努力地找尋一個家，找尋一個真正能讓他安頓下

  來的地方，對他來說這才是最重要的事。



  這邊再補充一個趣聞，那就是憑藉 2001 年電影《震撼教育》奪下奧斯卡影帝的





  。之後是《臥底》的製作團隊也有問起這件事，這就合理多了。」



  可惜最終《臥底》的續集沒有找回丹佐，該部電影續集原本也是要由第一部的導演史派克

  ·李（Spike Lee）執導，第一部的主要卡司也都確認回歸，只可惜最終沒有拍成。2019

  年《臥底》續集《臥底：頭號通緝》上映，但導演跟主演皆換人，並寫採用直接上串流的

  方式上映。



  《私刑教育3》劇情講述身手不凡的私刑者勞勃·麥考開始喜歡上自己義大利南部的新住

  處，但發現自己的朋友們生活在當地黑手黨的威脅之下，迫使他挺身而出，為保護朋友而

  戰。




  除了丹佐·華盛頓之外，新的卡司陣容包括達科塔·芬妮（Dakota Fanning）、大衛·丹

  曼（David Denman）、索妮雅·阿瑪（Sonia Ben Ammar）、雷莫·吉隆（Remo Girone）

  、安德烈亞·多德羅（Andrea Dodero）、歐亨尼奧·馬斯特蘭德（Eugenio Mastrandrea

  ）、安德烈亞·薩爾杜齊奧（Andrea Scarduzio）、薩爾瓦托雷·魯奧可（Salvatore

  Ruocco）、達尼埃萊·佩羅內（Daniele Perrone）、蓋亞·斯考達里奧（Gaia

  Scodellaro）。



