url: https://www.ptt.cc/bbs/movie/M.1693744354.A.7B8.html
title: '[好雷] 《私刑教育3》低調的正義使者最終章'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  圖文重點標示好讀版↓




  2023年8月22日是我去參加人生中報名費最貴考試的一天，由於提早到考場，就先去便利

  商店等，碰巧看到電視牆在播《私刑教育3》的預告片，當下就決定之後上映要去電影院

  看了，原因不外乎前兩集都有看，而且都還蠻滿意的，所以第三集也要看！

  《私刑教育3》的主角勞勃麥考，依舊是由丹佐華盛頓（Denzel Washington）所飾演，這

  位身手不凡的前中情局特工，如同前兩集，在第三集勞勃麥考依然是那個為弱勢者出頭的

  正義使者，第三集的劇情比較像是第一集，一人單挑整個黑幫，但跟前兩集不同的是，第

  三集勞勃麥考要解決黑幫頭目時，不同於過往採取簡潔有力的手段，反而是注射過量毒品

  至對方體內，並邊幸災樂禍的唱歌，邊看對方痛苦的迎接死亡到來，雖然這有點像是變態

  殺人魔才會用的鬼魅手法，但由勞勃麥考使用，不但不覺得有違和感，反而打從心底喝采

  ，因為勞勃麥考之所以要這樣做，想必不是因為有趣，而是要對方體會那些因毒品死去之

  人的感受！

  總之，我覺得《私刑教育3》是部好看的動作片，雖然跟前兩集會有一點點關聯，但即使

  沒看過前兩集，直接看第三集也影響不大！


  --

  我的FB專頁「阿培嘎嘎嘎」，歡迎大家按讚追蹤！



  --'
