title: '[討論] APPLE TV 特價 私刑教育3/之前的我們/靈'
content: '【2024/10/16 Apple TV 特價報】

  私刑教育 3 / 異形: 羅穆路斯／之前的我們 / 噬血芭蕾 / 蝙蝠：血色情慾／最佳閨蜜

  ／小王子／巴黎御膳房／尋找第5味／靈病／外星異種

  －

  丹佐回來了！不用多說《私刑教育 3》大片超低價！同樣有 4K 規格的大片還有《之前的

  我們》、《噬血芭蕾》。再來太空驚悚片《異形：羅穆路斯》終於上架，帶來 4K Dolby

  Vision 和 Dolby Atmos 雙杜比點燈規格，在家也能被四面八方音效嚇得嫑嫑。買原價最

  重要的是包含超誠意 iTunes Extras 幕後花絮，一共 11 分鐘刪除片段、45 分鐘幕後製

  作，一共 1 小時豐富內容。

  －

  其他片雖然沒有 4K HDR 等規格，但是 NT$70 - NT$90 超低價好片非常多， 朴贊郁經典

  異色作品《蝙蝠：血色情慾》睽違一年再次特價；號稱法國版無間道的《36總局》；同為

  太空驚悚、冷戰時期風格《外星異種》；單身就要變成狗的《單身動物園》。

  －

  溫馨作品也有，鷹眼接班人海莉史坦菲德成名作《最佳閨蜜》，爛番茄 94% 超推；由艾

  蜜莉的異想世界導演帶來《天才少年的奇妙旅程》，也是充滿笑淚跟成長。

  －

  動畫部分，《小王子》夠經典不用多說；由一群女學生組成的悅耳銅管合奏《上低音號》

  也有特別篇限時特價；蠟筆小新最近幾週都有個別特價，本週的《超級美味!B級美食大逃

  亡!!》也隔了 8 個月以上才再度特價，別錯過啦！電影迷必收《酷愛電影的龐波小姐》

  ，每次看每次感動。（小編當初買原價 NT$390，現在才 NT$90！）



  －

  搭一下「黑白大廚」熱潮，講述明星廚師搭配剩食主題的 100% 爛番茄好評紀錄片《五星

  級明日餐廳》，看了會餓；《餐廳失控夜》就像來到大熊餐廳；《巴黎御膳房》也是一堆

  總統等級料理；《大餓》把一個自我認同的故事講得很好，看了會滿足不會餓；《尋找第

  5味》和《醉後之旅》都是深陷 METOO 風暴的法國影帝傑哈德巴狄厄主演，演員私下作為

  該受公評，但優秀的電影是眾人的努力，該推還是推。

  －

  以上，這次片單相當豐富，祝大家看片愉快！

  －

