url: https://www.ptt.cc/bbs/movie/M.1690705193.A.63D.html
title: '[好雷] 惠子不能輸'
content: '在「芭本海默」和各種影展夾擊之下

  這部票房似乎受到了不小的影響



  但這部誠心推薦

  它是近期讓我感覺非常「純粹」的電影

  （上部應該是《夏日悄悄話》）



  所謂「純粹」是指

  它沒有跌宕起伏的故事情節、暗藏玄機的台詞、磅礡動人的配樂，

  或是精巧的構圖、繁複的意象、層層的暗示，

  而是自然地讓觀眾感受到，

  日常生活中人物細微的情感變化。



  當然這不意謂著導演沒有「用力」之處，

  好幾幕荒川、公寓、街道的取景都非常漂亮，

  只是一切都很自然地鑲嵌在主角行經的路途中，

  不會讓人覺得刻意。




  其次，我很喜歡這部的「顆粒感」，

  包含真實、日常、平凡的種種面向。



  十六釐米膠卷拍攝，擷自四面八方的環境音，

  都提供了一個令人平靜、沉澱的觀影氛圍。

  而生活中細瑣的小事，情緒上的小疙瘩、小彆扭，

  則勾勒出惠子身為一個聽障者、更是作為一個人的平實樣貌。



  導演以聽障者為主角，自然有異於聽人的生活方式和挑戰，

  但惠子又不是一個什麼克服先天劣勢、最終達成夢想的傳奇角色。

  與一般人相比，她有所不同，卻又極其相似。



  拳擊對她而言，

  與其說是夢想，不如說是生命的出口。

  她重歸屬感，因此拒絕轉移至新的拳擊館；

  她勤奮練習，卻也坦承自己容易懶散；

  她態度認真，但意志並不總是堅定，

  她也會怕痛、會退縮、會在比賽的時候被對手激怒。

  她最終輸了比賽，還要思考何去何從的問題。



  可是，就是這種平凡，令人產生了共感。





  我很喜歡電影的結尾，

  河邊的場景，惠子正坐著休息，

  先前打敗她的對手向前打了聲招呼，

  惠子又繼續跑了起來。



  大概就是這樣吧。

  這部片取作「惠子不能輸」，

  實際上，焦點並不在於場上的輸贏，

  我感受更多的是，

  面對環境的變化、生命的刁難，

  人還是被生活推著，勉力向前的狀態。




  真的是一部韻味深長的電影。




  --'
