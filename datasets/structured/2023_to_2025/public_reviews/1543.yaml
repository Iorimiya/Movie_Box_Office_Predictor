url: https://www.ptt.cc/bbs/movie/M.1689841549.A.78C.html
title: '[好雷] 惠子不能輸'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  改編自日本聽障職業拳擊手小笠原惠子的自傳《絕不能輸！》，《惠子不能輸》以勵志的

  虛構故事呈現職業選手的心境轉變與生命的意義。入選今年台北電影節的「作者視角」單

  元，由導演三宅唱出席映後，除了入選柏林影展與倫敦影展之外，也奪得日本電影學院獎

  最佳女主角。



  「我活在聽不見的無語世界裏頭，唯有全力一擊才不會退縮放棄」，天生聽障的職業女拳

  擊手惠子，對她而言，拳擊是她發洩的管道，身上的傷痕是她勝利的印記，而充滿溫暖的

  破舊拳擊館就像是她第二個家，雖說惠子屢屢在激烈比賽中獲勝，但她的身體殘缺下引發

  的心魔，卻越來越感到恐懼。



  現年31歲的演員岸井雪乃17歲時就出道，累積作品無數，近年較知名的如《神尋求回報》

  、Netflix自製電影《異變者》與《終將到達大海》等片。她在《惠子不能輸》裡，由於

  飾演聾人，全片無對話，單靠演技表達角色心境，也憑本片拿下不少獎項。其實，惠子有

  一句講兩次的台詞：「好」，單音、好理解，雖說惠子說出口時也不是非常肯定、有自信

  ，但就像說出這句話於她的困難與意義，這聲極為小聲的承諾相當有份量。不論是憤怒、

  快樂，還是傷心、懊惱，岸井雪乃都以面部表情與肢體語言所乘載的演技清楚表達，幾場

  眼淚在眼眶打轉卻遲遲沒有滴落的戲更是令人動容。



  「拳擊這種東西，必須要有鬥志才能上台，如果沒有鬥志，不但對手很失禮，還很危險。

  」



  原型角色152公分，岸井雪乃甚至更為嬌小，只有148.5公分，在片中打起拳擊來很是讓人

  疼惜。正因如此，會長口中那個「沒有臂展，動作又慢又小隻」的惠子十分不適合練拳擊

  ，再加上失聰的缺陷，聽不到教練與裁判的指令，對她來說很不利，但惠子的膽量與個性

  卻很適合。即便她說自己怕痛，讓教練大笑誰不是呢，但正是這樣的誠實與率真讓惠子能

  在運動場上發光發熱。電影當中所呈現的第一場賽事，觀眾看到她被打得很慘，但鏡頭僅

  特寫惠子，無從得知另一名選手的狀況。直到最後宣布她獲勝，而弟弟事後補充對手賽後

  馬上進醫院，觀眾才知道惠子的傷痕是勝利的印記。



  即使比賽接連獲勝，家人也都到場支持，但看到女兒被打得全身是傷，媽媽也心疼地關心

  惠子打算打拳擊到什麼時候，讓她心裡產生額外的壓力，也讓惠子一直不知道該如何向非

  常照顧自己的會長開口表示自己打算暫時休息。此時，又收到拳館即將歇業的消息，好不

  容易找到寄託之處的她心情五味雜陳。會長與教練為惠子奔走，希望找到願意收留她的拳

  館，但惠子卻因為離家太遠而拒絕，讓教練認為她不知感恩。種種原因讓惠子終於鼓起勇

  氣要將那封打退堂鼓的信投進拳館的信箱，沒想到卻讓她看見視力日漸退化的會長，正坐

  在電視機前看著自己的比賽，惠子這才想起那個純粹熱愛拳擊的自己。



  鏡子前，會長與惠子彷彿回到初相識的那天，快樂地練拳，不捨拳館即將關閉的她決定再

  努力拚搏一次。雖然這只是惠子的第三場職業賽而已，但都成為職業選手，自然不會不懂

  勝敗乃兵家常事的道理，但「士可殺，不可辱」，這場比賽她由於聽障的關係，屢屢被占

  便宜，還無法為自己發聲，讓惠子感到極為不公平，導致她輸掉這場比賽後灰心喪志。最

  後是因為在河邊發呆時，之前的對戰選手跑來跟惠子打招呼，讓她知道，一邊有著正職工

  作，一邊努力成為職業拳擊手的不是只有自己，不該如此自怨自艾，遂起身跑向雖不一定

  美好但充滿希望的未來。



  雖說這不是平常看到會讓人熱血沸騰的運動電影，但仍舊保有運動員充滿鬥志、遭遇挫折

  、東山再起的心境轉變，也相當符合日本電影溫溫的敘事口吻。《惠子不能輸》就結束在

  讓觀眾知道惠子繼續迎向充滿挑戰的未來，但實際上，原型人物小笠原惠子在吞下敗仗後

  相隔兩年沒有出賽，再回到拳擊場上就以第一回合30秒將對手TKO的姿態獲勝。雖然不知

  道為什麼小笠原惠子在那之後便沒有再出賽，但對30歲才成為職業選手的她來說，三勝一

  敗的職業賽成績已經是非常了不起的成就。



  既然故事主角是聾人，電影當然也表現出很多聽人所無法體會到的日常不便與瑣事。手語

  對話不用說一定有，雖然篇幅比想像中少許多，但台灣手語在日治時期受到日本手語影響

  ，懂手語的觀眾在觀影時還是會覺得極為親切。另外，也特別呈現出聾人如何使用電鈴與

  鬧鐘這些以聲音為提示的日常工具，不管是加裝閃光燈，還是設定電風扇定時開機，都是

  藉由電影讓聽人觀眾能夠更加貼近聾人生活的安排。雖說在日常生活裡，惠子仍然經常碰

  到便利商店店員甚至警察的不理解與誤會，但看到弟弟女友、同事與新拳館負責人都願意

  為了與她溝通而學習手語，便能感受到社會的溫暖。



  雖然《惠子不能輸》主要以原著為本，但導演似乎有別的話想藉由電影說出。比起惠子後

  來去參觀的拳館，老會長經營的「東京歷史最悠久」的拳館顯得相當破敗，片中也提到由

  於都更，必須另覓落腳之處，就連女主角岸井雪乃都在為台灣影迷錄製的影片內提及，本

  片是以16釐米底片拍攝，記錄下逐漸消失的老東京風情，全片懷舊感十足。鐵道迷在觀影

  過程中甚至可能會有更多感動，因為無論是平交道前、融入背景，還是從橋上呼嘯而過、

  遠景，火車的畫面還不少，而且白天夜晚都有，導演盡其所能捕捉下東京老城區各種各樣

  的風情。



  整部電影沒有太多配樂或歌曲，最明顯的便是弟弟為姊姊惠子演奏的一首曲子，這也是全

  片她笑容最多的一段。拿掉一般電影當中扮演重要情緒堆疊角色的配樂與歌曲，取而代之

  的是生活當中隨時可見，但聽人或許經常忽略的聲響。惠子的世界固然是全然寂靜，她踏

  進拳擊場時是各種意義上的「一個人的武林」，但觀眾在「試著」同感她的同時，進入近

  乎寂靜的拳擊世界時，還能靠著這些自然的節奏與聲響，從另一個角度感受世界的美，也

  珍惜這些出現在我們周圍的聲音。


  --

  Viola''s World：Screen Scream影迷尖叫屋


