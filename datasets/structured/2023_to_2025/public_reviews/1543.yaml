title: '[好雷] 惠子不能輸Small, Slow but Steady'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  想要在電影看到什麼特定議題的人會全然失望（還好這樣的人大概也不會看這片），

  但先知道這不是一部特別要說什麼的電影的人，看這部片卻像是什麼都看到了。


  像是我看到疫情期間種種規定，對於一般人而言可能是麻煩，對聽障人士而言卻是更加深

  原本的阻礙（口罩使不認識他們的人無法意識到他們看不見臉，無法辨識所說的話）。然

  而，這也只是看的過程想到的面向，實際上，聽障者生活困境無所不在，疫情或是正式比

  賽都只是原本困難以可以見到的方式呈現出來。


  可是要說這部電影在說聽障者的處境嗎？好像也不是。反而比較像是更純粹的層面：人與

  人之間的關係，人與身體的關係，人與群體的關係，人與自己內心的關係。


  朋友說濱口很推薦三宅唱，我看時只覺如果把台灣比較熟悉的楊德昌和侯孝賢作為一個認

  知光譜，濱口和三宅似乎剛好各偏一邊（不精確但希望有用的比較）。




  ***


  這裡是我的樂園:




  --

  真的是這樣子...'
