url: https://www.ptt.cc/bbs/movie/M.1690641425.A.D4C.html
title: '[好雷] 惠子不能輸-只是想找到歸宿 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  網頁好讀版：




  惠子第一場拳擊勝利的影片中，被對手狠狠揍了六次。拳擊館會長三浦說：「她沒有才華

  ，卻非常誠實，是個性跟毅力適合拳擊。」；她也承認自己怕痛，在接下來的練習中屢屢

  後退。




  於是我想著，挨揍六拳、聽不到任何教練指令跟時間倒數的她還會贏，一定是因為少了一

  個感官，反而不被打擾而進入心流的狀態才贏的吧。看到後來馬上對於身為一個聽人對於

  失聰者不理解的自以為感到羞愧不已。




  惠子為什麼會打拳擊呢？三浦會長說她曾被霸凌、她於疫情期間在飯店當房務，戴著口罩

  之下更無法讀唇語、連媽媽都希望她不要再打下去，弟弟也問她拳擊有什麼好玩。

  電影中有個畫面，是她回家時不小心撞到一名男子，男子有個東西掉下去摔壞了，那名男

  子大吼：妳給我撿起來！但惠子只是瞪著，閃人。



  她一輩子都在忍受這種無聲。她沒辦法跟聽人表達，也找不到自己能（真正想）做的事，

  那種壓抑、吞忍，是我們難以想像的。直到有天她到了拳館，那裡的教練跟館長全心接納

  她，是第一個願意讓她代表去比賽的拳館。



  我們每個人，多少都在社會中失語。面對誤會無法澄清、面對工作上司夾擊只能吞下去、

  面對感情難以解釋：在現代政經體系只在乎地位權勢金錢，但許多人們還是想要一個沒有

  利益衝突的所在，一個自己能夠好好做喜歡的事情、有人互相完成目標的地方。



  而惠子比我們更難找，只是剛好有個地方接納了她，她也打贏了一場比賽。那不是進入心

  流，是一種拼命也要留在這個地方的歸屬，讓她挨了扎實的六拳也要贏的原因，不是我這

  種聽人可以理解的壓力跟拼勁。所以她留在一個她有感情的地方，做著她能夠做的事情，

  打拳擊。



  可是拳館要關了。因為聽不到，其他感知更敏感的惠子，也能覺察拳館其他男性選手的排

  擠。拳館為了讓她能夠繼續比賽，拼命動用人脈拜託才找到一家女性開業的新拳館，惠子

  卻用：這裡離我家太遠了而拒絕。兩位教練氣到發瘋。



  一個每天跑十公里、打好幾套拳、跳繩、重訓的小女生，會用這種理由拒絕拳館嗎？在這

  裡我認為她不是老實，是已經知道這個「新」地方，不是那個以前包容接納讓她有歸屬感

  的拳館了，而男性聽人教練們並沒有發現她內心的掙扎。




  一晚，惠子也感受到種種壓力，拿著想要休息一陣子的紙條去了舊拳館，卻看到拳館老闆

  在看她勝利的比賽影片，馬上慌張退出門外，被老闆發現才又進去。



  兩人面對鏡子，一起開始慢慢打拳，岸丼雪乃笑著揮拳，偶爾稍微撇眼看看老闆，眼淚慢

  慢流下來。光是這個畫面，就讓我願意二刷這部電影。那是一種，我知道了，這裡要消失

  了，你也要走了，但我還能去哪裡呢？但對老闆來說何嘗不是呢？經營了一輩子的拳館，

  他自己身體健康大出問題，他對這個小女生寄與厚望，努力照顧，他不做拳館了，還能幹

  什麼呢？他們不曾筆談，卻是彼此的依靠。




  這部電影好看不在拳擊、不在真人真事為底（小笠原惠子自傳）大改編，而在於我們現代

  人誰沒有在找這樣的依靠跟歸宿呢。




  第二場比賽，惠子陷入苦戰，因為跌倒被判定倒數十秒，聽障的她暴怒，這裡是整部片她

  發出三次聲音的其中一次（另外兩次是回答：是）。無法跟裁判解釋那不是被打倒是跌倒

  了，也聽不懂裁判的指令，旁邊教練也無法給予任何幫助，情緒狂暴的她被對手ＫＯ了。

  而後她回到她每天早上練跑的河岸，一個女性工人突然跑過來，真誠的跟她說：我曾是妳

  的對手，謝謝妳，立刻跑走。

  惠子留下了微笑，這就是她能做的事情。拳館會長出現，給了她一頂帽子。

  也許仍然要持續在飯店打工，但我相信她會繼續做。



  女主角惠子是《不能相愛的兩個人》的女角岸丼雪乃，之前的形象難以想像她會出演這部

  戲。才150公分的她，看得出來為了戲增肌不少，手語只有學習劇中台詞，但整部只用身

  體跟表情的無聲戲，和那場邊微笑邊打拳邊流淚的場面，對我來說真的是大突破，也讓她

  贏得日本四座女主角大獎。

  推薦在生活中，尋尋覓覓歸屬感跟想要找到能做的事情的人。






  --'
