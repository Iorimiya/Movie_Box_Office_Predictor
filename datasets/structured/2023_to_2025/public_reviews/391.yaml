title: '[  雷] 取精急轉彎'
content: '(本片這幾天上坐率滿好的)


  在大約10年前，《腦筋急轉彎》結束的時候男孩腦中的片段，是幾個情緒直接亂闖然後Girl

  警報狂響

  就有人在想，要是《腦筋急轉彎》把色色拍出來會怎麼樣？

  於是《取精急轉彎》做到了，即使經費規模還有考據水準不在同一個水平上，至少還是做到

  了，滿足各位的想像。



  雷文防雷資訊頁





  雷文防雷資訊頁





  這部片就必須翻譯成《取精急轉彎》，應該沒有更好的名稱了，整個劇情就是《腦筋急轉彎

  》+《腸腸搞轟趴》。


  若說《腦筋急轉彎》是把情緒擬人化，《取精急轉彎》就是把精子擬人化。

  一樣有大腦控制台，一樣是人類視角還有內在視角的切換和影響。


  劇情方面，打砲、肛交、精子遇到屎通通有，最後電影不忘提醒小朋友記得避孕，尤其是還

  沒準備好有孩子的時候。


  字幕方面，這種片非常依靠字幕，看的出來譯者也是努力在地化、大眾化。剩下就是你隔壁

  的觀眾笑不笑了


  本片本質仍是性教育片，不會太過色情，露骨程度不到《熊麻吉》一半，然而精子大冒險仍

  是撐不起整個劇情，就算加了好幾首歌穿插唱，最終片長也只有80分鐘。(對戲院老闆很友

  好就是了，可以多排幾場)



  --'
