title: '[負雷] 取精急轉彎'
content: "雷文防雷資訊頁\n\n       關於這部電影我只想說，作為性教育片，頂多約略及格(畢竟有太多錯誤的生理學知識)，作為一般人期待的搞笑B級片(預告片的錯覺？)，基本上是沒有的，有很多穿插的歌舞甚至讓人覺得很膩(是真的會讓人想睡覺的那種)只能說，這部片大概比較適合配著彈幕看。\n\
  \n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n　　以下有大雷\n　　\n\n\n\n\n　　我一定要吐槽這部片一大堆的不合理之處，當下看到真的感覺要吐血了。\n\
  \n　　本片第一個不合理的地方，洨明洨美他們從肛門進入，在大腸遇到大腸桿菌，大腸桿菌的大小約0.5至3μm，精子的大小約50至60μm，但在本片他們一樣大，甚至還能接吻(？我記得那時大腸桿菌也唱了歌，內容有一段說到他具有感染能力，但一般大腸常在菌的E.coli通常是沒有致病性，有致病性通常是EPEC、EHEC(如O157:H7)，這些不會出現在人的大腸，通常在牛、羊的腸道和排泄物內。人因食入牲畜排泄物污染的食品而感染。接著精子們想去子宮，大腸桿菌幫他們吃掉排泄物開路(？轉瞬間他們就到了胃(所以我說那個十二指腸、空迴盲腸呢？)\n\
  \n　　最誇張的出現了，他們居然在胃裡找到一個可以直通尿道的通道(？？？雖然電影最後有說精子是不可能從肛門進入耐受胃酸跑到尿道，還是覺得非常瞎= =好反正他們最後順著尿液跑到了體外附著在陰毛上，靠盪的方式到了陰道。小小吐槽一下，從片中的對話感覺起來最後的精卵結合是在子宮，但實際上受精作用是發生在輸卵管，而片中女主角有吃事後避孕藥，照理來說高濃度的黃體素應該會抑制排卵，但總之還是成功受精了(其實我覺得這段根本恐怖片，片中小情侶有用保險套、女主角用了滅精膏、吃了事後避孕藥，居然還是中獎了(而且精子還是從肛門進去的))\n\
  \n　　最後的最後，作為性教育片，對於墮胎也太輕描淡寫了吧！給人一種「啊不小心中了，那就墮掉就好了」的感覺，完全沒有把這件事對女性身體的危害說出來(就算是藥流也很傷身啊)\n\
  \n　　這部片唯一比較值得嘉許的大概就是諧音梗的部分翻譯不錯，蠻在地化的，總之，只要放空大腦去看，應該會比較能接受(吧？！\n\n-----\nSent from\
  \ JPTT on my Xiaomi 2407FPN8EG.\n\n--"
