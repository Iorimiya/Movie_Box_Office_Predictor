url: https://www.ptt.cc/bbs/movie/M.1701830399.A.C13.html
title: '[好雷] 鬼夢遊 Sleep'
content: "雷文防雷資訊頁\n\n鬼夢遊\nSleep\n2023韓國電影\n\n\n\n\n賢秀（李善均 飾）和秀珍（鄭裕美 飾）原本是對幸福的新婚夫婦。某天，睡在身邊的賢\n\
  秀喃喃自語地說著：「有人進來了。」自那天起，每到深夜，賢秀就像變了個人般做出詭\n異的舉動，秀珍也因害怕賢秀睡著後會傷害剛出生的孩子，而難以入眠。隨著賢秀的怪異\n\
  行為愈發瘋狂，秀珍竭盡全力地揭開隱藏在入眠後的恐懼……\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n個人滿意度75分（滿分100）。\n\
  \n整部片的場景及角色很單調，但氣氛很詭異及令人不安。原本這部片是可看可不看的，但\n上個月舉行的韓國青龍獎最佳女主角是本片的女主鄭裕美，好奇她在本片的演出，是追看\n\
  本片的最大動力！\n\n《鬼夢遊》鄭裕美青龍影后的品格！面對惡意評論高EQ回應\n\n\n從頭到結局，你的感覺是？\n這片是簡單卻驚心的小品佳作。\n\n以下有劇透。\n\
  \n\n\n看到後段，是丈夫真的被附身了？或太太因故執迷瘋狂了？\n醫療無法解決的問題，造成另一另類救治的偏執？\n一般人，會像女主一樣那麼堅持，陪伴丈夫一起度過？\n\
  或是請丈夫自己面對夢遊症？在外租屋，等好了，再回家？或是自己和嬰孩回娘家住，丈\n夫自己住，等丈夫好了，再一起住？\n\n還是透過如本片女主的極端行為去面對及解決？\n\
  而丈夫最後是迫於局勢危急，演出一場戲，畢竟自己是有好演技的演員，令太太安心？或\n是真的因為太太的行為，把附身的鬼魂逼出來了？\n\n我想我是選擇後者的，呵呵，畢竟是恐怖片，符合中文片名，而且比較能夠接受如此的人\n\
  設劇設。\n\n否則女主瘋狂了，不OK...丈夫配合演戲，女主產後憂鬱加上丈夫生病，太太對神鬼解決\n之說，被洗腦而信了。\n\n這片的結局，就是開放式吧？觀眾各自解讀。\n\
  \n            本片不願意離世的鬼魂，真的難纏啊，而且本片衍生的警世點是：\n\n1.要敦親睦鄰。樓上樓下的彼此互動相處，要避免生怨？\n\n2.要好好悼念及超度已逝親人。尤其是掛念親人祭拜的人。\n\
  \n\n\n--\n\n開放式結局的安排，導演的用意是？\n\n我們是太太堅信那一方，必須極端行動如此才能夠得救？\n或丈夫自認痊癒那一方，要演戲如此才能夠擺脫困境？\n\
  \n\n\n\n\n我在中華電信MOD上架（12月1日）影片看的。其他串流平台也上架了。"
