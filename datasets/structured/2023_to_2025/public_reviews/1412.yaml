url: https://www.ptt.cc/bbs/movie/M.1704944944.A.578.html
title: '[普雷] 鬼夢遊心得'
content: '跨年前聽到李善均離世的消息

  真的有點難過QQ 畢竟他主演的作品都很經典 之後也打算用friday重溫幾部


  (以下心得微雷)



  整體來說沒有到很恐怖

  但營造的氣氛讓人很緊張不安的感覺 劇情也是分成3個章結來講述

  從醫學的角度講解老公的夢遊

  再到宗教方面解釋是被鬼附身

  搞到最後沒辦法分清楚

  到底是夢遊還是被鬼附身

  最後給出開放式結局 也很合理

  讓觀眾自己決定是相信醫學還是宗教

  當作恐怖片看可能會覺得中規中矩

  以驚悚片來說是很有巧思的設計


  最後就是演員含金量真的很高

  看板上心得才知道鄭裕美是青龍獎最佳女主角

  李善均則是演過很多韓劇

  所以本來就對他很有印象


  唉，熟悉的大叔永遠不在了......


  --'
