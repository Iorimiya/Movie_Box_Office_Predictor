title: '[討論] 鬼夢遊結局？'
content: '電影蠻快就進入開始驚悚跟嚇人的劇情


  剛開始還蠻後悔看的 有點太恐怖 看得很緊張

  （千萬別開門就很喜歡！）



  想討論結局的部分 防雷一下























  我覺得 從頭到尾 男主就只是生病而已（夢遊症）

  而爺爺的事情 跟 男主換藥痊癒 只是巧合

  最後把女主逼瘋（精心製作了PPT?)

  男主迫不得已 只好發揮他的演員專長

  最後演了一波被爺爺附身的戲碼

  而女主眼睛裡看到的，只是他想相信的，他覺得他的喔爸就是被附身了，才會有開窗往下

  跳的畫面

  最後男主說了一句 他離開了

  也代表從頭到尾他都是清醒的

  只是最後結局斷的有點突然

  可能是想表達之後的日子都風平浪靜了嗎



  --'
