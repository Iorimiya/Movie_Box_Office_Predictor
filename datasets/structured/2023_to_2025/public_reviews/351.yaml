title: '[負雷] 此刻的我們-A24翻車現場'
content: '有加菲貓跟二代黑寡婦


  能糟糕到哪去呢






  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~








  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  當初看到預告本來還蠻期待的

  結果本片有夠混亂


  首先是剪接手法

  過去跟現在切來切去

  你要非常努力才能釐清現在是甚麼時空背景


  多線敘事的電影我也是看了很多了

  第一次看到有這麼混亂的

  交往前、交往後、懷孕期、生小孩後、第一次發現癌症、癌症復發後

  這些場景切來切去的，後面把頭髮剃掉才可以簡單定錨是在罹癌化療後


  而且問題是你有必要多線敘事嗎?

  這種技法對詮釋故事完全沒有加分作用


  再來是劇情


  完全是莫名其妙的故事


  後面搞半天癌症復發是老公害的?

  第一次發現子宮癌的時候，醫生就問你要不要切掉了

  你為什麼不切?原因居然是因為想幫老公生小孩?

  但你前面交往前明明說過自己對生小孩沒興趣的啊


  然後重點是老公聽到你這樣的理由後

  他居然沉默???????????????????????????????????????????

  前面演的自己有多愛老婆

  但老婆得癌症後她說要為你生小孩所以要賭看看只拿掉一個卵巢

  你居然一點都沒有阻止的意圖?????


  啊，難怪你要切來切去

  不多線敘事把這段放在前面八成大家都看不下去了


  然後後面的高潮是什麼

  女主是廚師，所以瞞著老公去參加了機會難得的世界烹飪大賽

  但是練習到忘記去接小孩所以被老公發現

  兩人有了一段大吵一架的戲


  但這場戲居然是老公怪她參加大賽所以對她發脾氣????????????????????????

  人家都要死了她去做她想做的東西

  又不是去花天酒地、她是去追尋自己身為廚師的夢想

  你跟她發脾氣?????


  更莫名其妙的是甚麼你知道嗎


  最後參加大賽的環節，前面比賽都很順利

  老公跟小孩也到現場幫她加油

  但比賽到一半他決定不比了


  唉呀~還是老公小孩比較重要

  就走下台跟老公一起離開會場


  鏡頭完全沒帶教練跟他的參賽夥伴

  我都可以想像得出來他們是甚麼表情了

  有夠北七的橋段，你把比賽比完不行嗎?


  然後就一起快樂地去溜冰，然後揮手道別

  後面就爸爸帶小孩生活的畫面

  結束


  整部片完全沒有打動我的地方

  都是莫名其妙


  啊還有女主一開始邀請男主去他開的餐廳吃飯

  說至少這點是她還可以為他做的


  不是啊，陪人家醫藥費啊

  妳開車把人家撞成這樣欸

  可能有賠吧不知道反正完全不提

  好像撞完人家送他去醫院後大家就各自回家了


  第一次去餐廳然後說他離婚後兩個人晚上就幹上了

  啊????到底為啥


  這部就是捨棄掉一大堆細節

  只留下看起來漂亮的東西把觀眾當笨蛋的電影


  --'
