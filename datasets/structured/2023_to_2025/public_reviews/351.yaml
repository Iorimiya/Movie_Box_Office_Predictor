url: https://www.ptt.cc/bbs/movie/M.1747663302.A.1AC.html
title: '[好雷] 此刻的我們：沒有奇幻設定的真愛每一天'
content: '我喜歡愛情電影。

  .

  現實中要遇到百分百契合的伴侶太難，不是人海茫茫難以相遇，就是激情過後問題浮現。

  但愛情電影不一樣，它能放大曖昧的悸動、跳過生活的瑣碎，讓談情說愛、甚至婚姻育兒

  都變得夢幻而浪漫。

  .

  但這些年，好萊塢投資焦點轉向超級英雄或賣座續集等大 IP，票房天花板低、受眾侷限

  的愛情電影逐漸被邊緣化。不只片商興趣缺缺，連明星經紀人也認為愛情片對藝人沒加分

  ；而少了巨星魅力號召，愛情片就更難在院線翻身，只能到串流平台求生存。

  .

  正是如此，《此刻的我們》顯得格外珍貴：不僅找來安德魯加菲爾德、還有近年快速崛起

  的佛羅倫斯普伊，為瀕臨絕種的院線愛情片注入強心針，提醒觀眾即使超級英雄滿街跑，

  還是要相信愛情，也需要那些讓人相信的愛情電影。


  /


  電影開場，是艾咪特（佛羅倫斯普伊 飾）的日常：晨跑、打蛋、喚醒老公托比亞斯（安

  德魯加菲爾德 飾）。鏡頭一轉，他們卻坐在診間，醫生宣布艾咪特罹患癌症末期。她拒

  絕成效難測的化療，決定把剩餘的半年活得精彩。但接著畫風突變，艾咪特挺著孕肚跟托

  比亞斯待在廁所，然後兩人又像陌生人，直到艾咪特駕車撞上托比亞斯。

  .

  這些碎片化的愛情片段，讓人想起《真愛每一天》，也不禁期待有奇蹟出現。可惜這不是

  奇幻電影、托比也沒有穿越時空的能力。導演約翰克勞利透過非線性敘事，展現愛情裡的

  邂逅與告別都無法逆轉，無論美好還是遺憾，在生命與時間面前一律平等。

  .

  安德魯加菲爾德在首部擔綱作品《心靈鐵窗》就是與導演約翰克勞利合作，當時青澀的他

  飾演急欲重返社會的少年犯。十多年過去，他在《此刻的我們》仍保有那種敏感的破碎氣

  質，甚至隨著歲月流逝有增無減。面對艾咪特拒絕治療，他欲言又止雙眼卻已盈滿淚水，

  這不僅讓托比的脆弱令人心疼，也讓本片即使敘事內斂，愛與痛仍舊深刻。

  .

  然而，佛羅倫斯普伊才是這部片真正的靈魂。艾咪特的生命歷程才是本片重心，托比只是

  影響她人生選擇的變因。身為廚師的艾咪特一向灑脫，但遇見托比亞斯後，她改變對家庭

  與生子的態度。普伊的隨性氣質讓艾咪特的自由格外迷人，儘管她與加菲爾德的天雷勾動

  地火來得又快又急，但因為兩位演員的化學反應顯得理所當然，這正是愛情電影裡巨星不

  可取代的魔力。


  /


  《此刻的我們》趣味之一在於，它讓觀眾可以戴著粉紅濾鏡看角色戀愛，也能拿下濾鏡，

  對標自己與伴侶的感情觀。

  .

  托比登場時正在辦離婚，因為前妻在瑞典發展事業、聚少離多，婚姻失去共識因此分開。

  然而，這一切在遇上同樣熱愛工作的艾咪特後改變了嗎？其實沒有。在電影呈現的篇幅中

  ，艾咪特很少顧及托比的感受，甚至瞞著他參加烹飪大賽，放棄了兩人約定的婚禮日期。

  說到底，如果艾咪特的職場在國外，這段感情是否還是會以離婚收場？

  .

  這並沒有誰對誰錯，只是誰願意體諒對方多一點，而我想艾咪特是犧牲較多的那位。她有

  自己的事業與前程，在廚房裡料理的神情閃閃發光，不願輕易被婚約與母職綁住。但因為

  托比，她選擇妥協，甚至在面臨卵巢與子宮切除抉擇時，冒著高復發的風險決定保留一個

  卵巢，只為滿足托比對傳宗接代的執念。她的遭遇，只是又一次浪漫化女性為愛情與家庭

  的犧牲。

  .

  什麼是天生一對？我沒有答案。即便托比亞斯與艾咪特大部分的相處都是有趣而美好的，

  但兩人價值觀的裂痕始終存在。但因為是安德魯加菲爾德與佛羅倫斯普伊，化學反應就像

  一首言淺情深的短詩，清新得足以讓觀眾暫時忽視這一切，並且跟著他們迎接新生命時一

  起微笑、面臨離別時心碎流淚，這是我們始終無法抵抗愛情電影的原因。


  /


  電影裡有句台詞：「如果能接受養了多年的寵物去世，那就沒什麼可怕的了。」托比在片

  尾抱著女兒、身邊跟著一隻小狗，無需多說，這個畫面已交代角色的失去與延續。

  .

  寵物教會我們什麼是陪伴，也提醒我們活在當下。他們只專注於趴在地上曬太陽、嗅聞葉

  子的氣味。面對離別，沒有人能真正準備好。但如果像寵物專心享受每個平凡的此刻，或

  許在面對無常時，我們就能多一點勇敢與釋懷。


  更多影評推薦，歡迎按讚追蹤：

  MnBzbDJlcmhh


  --'
