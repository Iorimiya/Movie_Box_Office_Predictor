url: https://www.ptt.cc/bbs/movie/M.1747093811.A.0C1.html
title: '[好雷]《此刻的我們》感動好雷：無時無刻惦記你'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n 《此刻的我們》感動好雷影評：愛，是無時無刻惦記你\n\
  \n■ 無雷推薦語\n\n\n\n\n■ 愛與時間的恆久難題（有雷）\n\n托比亞斯是標準的Family Guy，渴望養育子女成立家庭；艾穆特則是重視工作的專業廚師\n\
  ，對家庭生活的想像還模糊未定。\n\n如果對未來的想像非常不同，你會且戰且走，還是及時止損？觀影當下筆者就想了一輪，\n覺得都沒有對錯，只是電影選擇讓兩個非常不同的人繼續攜手前進。\n\
  \n後來艾穆特轉換想法，決定與托比亞斯共同孕育新生。這次他們賭對了，愛和時間克服了\n差距。他們的未來磨合的更加一致，愛也日漸堅定。\n\n解完生不生這題，第二道限時問答馬上出現。癌症的噩耗讓一家人認知到生命短暫，\n\
  \n\n這次，艾穆特選擇了她自己。表面上順從丈夫接受化療和求婚，其實暗自準備世界烹飪比\n賽，也隱瞞婚宴跟比賽撞期。\n\n劇情選擇了艾穆特的勇敢堅毅（甚至可以說是固執），因為她已經為了父親放棄了溜冰，\n\
  她沒有第二次機會。也許同意與托比亞斯生下孩子，已經是她最大的愛與妥協。她為孩子\n立下不輕言放棄的典範，同時犧牲對丈夫的承諾與信任。\n\n我給《此刻的我們》下的標題是，無時無刻「惦記你」，而不是「選擇你」。\n\
  \n\n《此刻的我們》端出的人生難題十分經典，吵架鏡頭也非常真實。兩人都很理性論述分析\n想法，才發現彼此的需要如此不同，衝突難以解決。\n\n\n\n*我就是要寫得很愛情雞湯（笑\n\
  \n網頁好讀版>> \n\n–\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n--\n這部片的話談的不是自願犧牲自我（強迫犧牲？？？？？\n\
  講好聽一點是成全對方成為自己"
