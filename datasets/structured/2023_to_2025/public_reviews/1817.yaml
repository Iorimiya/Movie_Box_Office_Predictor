title: '[新聞] 《風再起時》因技術問題　取消港影兩場放映活動'
content: '新聞網址：


  今日「香港國際電影節」在Facebook貼出最新消息，指「應片方要求，《風再起時》因技

  術問題，原定於4月1日下午5時30分及4月4日下午2時30分於香港文化中心之放映場次取消

  。已購票的觀眾，可申請全額退票。」



  《風再起時》由翁子光負責執導兼編劇；並由郭富城、梁朝偉主演。電影以已故探長呂樂

  的事蹟改編而成，郭富城飾演的正是主角磊樂，年輕時來港受盡黑社會及貪警的刁難，一

  直對他們恨之入骨，於是決定考入學堂當個廉潔警察，可惜這種堅持遭到排擠。




  --'
