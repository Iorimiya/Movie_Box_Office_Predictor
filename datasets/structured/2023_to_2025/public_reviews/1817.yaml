url: https://www.ptt.cc/bbs/movie/M.1617150697.A.875.html
title: '[新聞] 郭富城梁朝偉「風再起時」臨遭取消上映 '
content: '新聞網址：


  郭富城梁朝偉「風再起時」臨遭取消上映 疑因題材敏感


  2021-03-30 18:10聯合報 記者陳建嘉／即時報導


  郭富城、梁朝偉合作「風再起時」，原本為香港國際電影節開幕片之一，卻在上映前3天取

  消放映，官方表明是「技術問題」，已購票的觀眾可以全額退費，但由於該片涉及警察貪

  污、黑社會題材，外傳可能是大陸電影局尚未過審，需要修改，才決定延後上片。


  「風再起時」早於2017年就開鏡，並於隔年拍攝完成，電影以香港60年代的最傳奇的4位探

  長雷洛、韓江、顏雄以及韓森為背景，講述他們如何縱橫黑白兩道，乘勢而起，卻又被歷

  史洪流給淹沒，由於該片找來郭富城、梁朝偉合演，再加上格局極大，但幾年下來，始終

  沒有確切上映日期，好不容易宣布電影將先在香港國際電影節首映，卻又不了了之，開幕

  片目前只剩下杜琪峰、許鞍華、徐克以及洪金寶等7位導演所拍的「七人樂隊」獨撐大局，

  主辦單位還未安排其他電影補上。


  奧斯卡金像獎受到新冠肺炎疫情衝擊，頒獎時間已經比往年延後一個多月，到台灣時間4月

  26日才舉行，不過香港TVB明珠台，29日證實因為今年TVB沒有轉播權，所以不會直播，創

  下香港52年來，首次中斷直播奧斯卡典禮的紀錄。由於其他頻道也沒有洽購頒獎典禮的播

  映權，所以今年極有可能香港地區沒有奧斯卡頒獎的轉播。


  會出現如此巨大的變化，外界推測可能和今年提及香港反送中的影片「不割席」入圍最佳

  紀錄短片有關。諷刺的是，代表香港的影片「少年的你」，今年殺進最佳國際電影入圍名

  單，香港觀眾卻無法透過電視螢幕，為自家電影打氣。




  --'
