url: https://www.ptt.cc/bbs/movie/M.1613633341.A.02B.html
title: '[討論] 翁子光談新片《風再起時》、演員春夏'
content: '《踏血尋梅》導演翁子光的新作品《風再起時》講述香港四大探長的故事，找了兩位影帝


  梁朝偉、郭富城分別飾演呂樂、藍剛，搭配譚耀文、郭文健飾演顏雄和韓森。除了四位主


  要演員外還有謝君豪、許冠文、艾迪、春夏、柯宇綸、太保、金燕玲也有參與演出。



  昨天看了一篇2019年底的訪談，內容有翁子光談《風再起時》外，還有談《踏血尋梅》的


  早期製作和春夏這名演員，也還有一些翁子光個人的觀點



  這篇我只放部分內容


  其他問答回應有興趣的版友可以點進原文看


  ------------------------------------------------------------------------------




  為《踏血尋梅》挑選女主角時，翁子光看了180多個女孩都不滿意，最後意外找到了春夏。


  《踏血尋梅》上映後，引發極大轟動。第一次擔任電影女主角的春夏，尤其受關注，當時

  只有22歲的她，大膽出演暴露鏡頭，表演真實動人。之後提名了金馬獎、金像獎的最佳新

  演員，並在金像獎上戰胜張艾嘉、湯唯，斬獲了最佳女演員獎，成為內地第6位獲此殊榮的

  女演員，也是金像獎史上的第一位90後影后。


  但《踏血尋梅》之後，春夏一直沒有能匹配自己影后身份的重要作品。


  為什麼？  翁子光說是為了還錢。


  “《踏血尋梅》之後春夏真的紅到爆炸，最高記錄一天有20多個片約。杜可風做導演，找

  春夏，但她真沒時間。杜可風生氣了，說我們都愛你，都為你服務，都拍你多好，你竟然

  不來我電影？


  當時春夏不喜歡經紀公司的很多安排，包括“中國第一個三級片影后”這種說法，她要脫

  離經紀公司，就把雙方的合約給買了。我們公司就當了春夏的臨時經紀人，墊了一些錢，

  春夏為了還錢就接了這些戲。


  《脫皮爸爸》，她演吳鎮宇的老婆，完全不適合。《脫單告急》本來找她演鍾楚曦的角色

  ，這個更適合她，她有逗逼的一面。但是她沒信心，而且對電影特別認真，演的時候就沒

  有喜劇的放鬆狀態。她寧可去選女二號。我覺得她心意裡面，就是“我要完成工作，還錢

  。


  她是為了擺脫自己舊的命運。


  演許鞍華的《明月幾時有》不是為還錢，她一直喜歡許鞍華。我不知道電影公司出什麼差

  錯，《明月》報金像獎，一沒梁家輝，二沒春夏。如果報了，說不好春夏可以提名女配。

  反正我都得罪人了，我覺得許鞍華的《第一爐香》最適合的就是春夏。如果我拍，一定用

  春夏。


  有人說，春夏《踏血尋梅》之後就沒有代表作。這不公平，因為很多電影沒出來，包括徐

  浩峰的《刀背藏身》，選片很好。我覺得，沒有同齡演員能跟她一樣能演出角色的那股勁

  。而且《刀背藏身》用了她快半年，春夏最好的地方是不軋戲（同一時間段，為兩個或多

  個劇組工作）。


  她簽壹心娛樂的時候，我很怕這個公司太商業了。但簽了之後，幫她接了《第十一回》（

  陳建斌）、《怪物先生》（黃智亨），跟張震演的《離我遠一點》，很重要的一個是《

  1980》（梅峰） ，後期已經做完了。


  這些戲如果一殺出來了，你看春夏還得了？她在等待第二次爆發。”





  “一般對稱的臉是最好看的，像吳彥祖。春夏的臉就沒那麼平衡，有一點點歪。她以前經歷

  過交通意外，我不知道有沒有關係。她的三七臉很好看，特別立體。我和杜可風當時研究

  ，偷偷拍。我們給春夏最好的，用光也是最好的。


  郭子健最近做監製，拍《怪物先生》，春夏有參演。郭子健說，春夏就像王菲一樣，老是

  覺得自己不好，但是她其實是最好的。如果有任何表演不好，永遠不會是她問題，永遠是

  導演的問題。這是對的。周迅沒拍過爛片嗎？湯唯沒拍過爛片嗎？鞏俐都拍過爛片，看你

  怎麼用她嘛。


  我拍《風再起時》，她來拍了三天，結果我剪出快20多分鐘戲。春夏就是春夏。當時我在A

  組拍她的時候，B組已經在叫她了。


  最後她去機場的路上，攝影師還讓她踩著單車跟著機器，用16毫米膠片拍她。《風再起時

  》我們用了少量16毫米膠片，來拍一些特殊時刻。春夏也覺得，翁子光，在你的片場我是

  最放鬆、最安全的。”





  《風再起時》是《踏血尋梅》之後，翁子光第一部自編自導的長片，由大地電影和美亞娛

  樂共同出品。


  影片以香港“四大探長”的真實故事為藍本，講述兩大探長磊樂（郭富城飾）與南江（梁

  朝偉飾）的事蹟，兩人領導香港過萬名警察並控制罪犯活動。但一山不容二虎，隨後廉政

  公署出現，衝擊二人的勢力和關係。


  此前的《跛豪》《五億探長雷洛傳》《追龍》都有涉及過這樁故事，翁子光為什麼又拍一

  遍？新在哪？


  “《海祭》沒做成，我馬上趕來做《風再起時》，整個事情來得很急。郭富城、梁朝偉都來

  了。許冠文本來是推的，我求他來的，因為我要做一個代表香港電影人的東西。《風再起

  時》預計下半年會上映，現在在收尾。因為是歷史，我希望透以前的香港，看未來怎麼展

  望香港，去討論這個。


  之前最主要的問題是我剪得太長了。第一版6個小時，第二版4個小時，一直到現在大概

  140分鐘以內。我覺得損失不大，因為選好的東西出來。


  很多人問我，為什麼想拍《風再起時》？


  兩個原因，一個是拍《踏血尋梅》時，我一直看郭富城的臉。這個男人的臉怎麼那麼精緻

  啊！很多人說他像小李子，我覺得真像。如果拍好萊塢人物傳奇電影，他特別有感覺。所

  以就想幫他拍一個老香港的黑幫電影。


  第二個原因，我很喜歡那個年代的跛豪、雷洛，就覺得要拍一個屬於我翁子光的。


  你看當年《五億探長雷洛傳》投資也不低，也有劉德華演，但現在進入合拍片年代，我感

  覺很多方面要進步，可以做得更細一點，還原度更高。


  現在不是有影城嗎，也可以在廣東找到一些景。《一代宗師》也去過，有一條街拍了梁朝

  偉跟章子怡的背影。另外一條周星弛看中了，想拍《功夫》，後來他改到上海搭景拍。我

  一去那，就感覺看到我小時候的香港了，因為這些感情，我就已經想拍了。


  我沒有覺得《風再起時》多好，但這是我給香港電影一個情書。我幾乎把自己推到了最後

  ，是唯一一次我給香港電影做了這個事情。


  接下來我要跟姚晨去拍戲了，三四個計劃裡都沒有香港的項目，所以我特別堅持。”





  “《風再起時》的命運怎麼樣，我真的不知道。最大的問題是《風再起時》既很傳統，也

  很新。有些人看了粗剪，怕三四線城市人看不明白。這是你說了算的嗎？為什麼要貶低觀

  眾？好的電影是帶著觀眾走的，這話必須要幫我記下來。


  《流浪地球》之前，觀眾對科幻有要求嗎？有理解嗎？我相信《星際效應》到三四線城市

  也賣不好。那怎麼了？


  我這回很堅持，有點自私的。


  拍《明媚時光》的時候，我已經有個很深的感受，觀眾不是看他們百分之百明白的東西，

  他們最後會問你問題。《明媚時光》在德國慕尼黑放映，觀眾第一個問題是，香港不是回

  歸了嗎，為什麼跟內地之間還有一個海關？


  這個問題問得很好啊，我常常說電影是為你帶來問題的。


  《風再起時》是這樣。《踏血尋梅》也是，它是非常不商業的電影，但是你看豆瓣有多少

  人看過這個電影？內地觀眾都怎麼看呢？下載。為什麼那麼多人去找下載來看這麼一個這

  樣不商業、沒有哄觀眾的電影呢？而且看完之後還很痛苦？


  因為，好的電影能留下來。我跟投資方說，我不能保五六七八線城市能看得懂，我只能保

  品質。但是我不知道《風再起時》能不能賣錢，它跟《追龍》《掃毒》《無雙》很不一樣

  。《追龍》不是已經有2了嗎？大家不需要去看這種東西的副產品。《風再起時》是新的。


  《風再起時》也不可能做得特別火爆，這不真實。《追龍》也不真實，能整個大廈都塌下

  來嗎？如果這樣的話，香港歷史沒有記載嗎？


  每開一槍到底那人有沒有死，我都要考慮的，我不會莫名其妙拍一個大場面。”





  “《踏血尋梅》之後，有人說春夏滾回內地，憑什麼來拿我們的影后？當然，也有人說春

  夏演得好，還是很持平。更大的原因，是他們知道我翁子光是非常持平的，我會相對綜合

  一點。但現在很多年輕人，不明白我。


  香港人來罵我說，你拿內地的錢來拍《風再起時》，你這個電影不會好！我是特別不服氣

  的。趁著《踏血尋梅》，我能拿到這個錢，用那麼大投資，拍一個關於香港的電影，你還

  來罵我，我覺得很無辜啊。沒這個錢，我請得起梁朝偉嗎？請得起郭富城嗎？請得動許冠

  文嗎？這個組合不用錢嗎，加起來已經是成本的一半了。搭景、美術呢？怎麼你就這樣去

  批評我？你不想看這個規模的電影嗎？


  現在一些小成本電影，很多導演在擔當啊。《一念無明》、《淪落人》不是很好嗎，為什

  麼翁子光還要拍呢？


  我當然會拍，我一定會回去拍的！〞





  拍《風再起時》，感覺我慢慢開始來內地發展了。很多時候我們要去找合拍片年代的平衡

  感。我覺得很多香港導演，真的是被合拍片所謂的宏大市場耽誤了。


  像《毒戰》，不管是商業上還是藝術上，沒有太多人覺得成功。我覺得這對杜琪峰來說也

  是一個打擊、一種困惑，他已經拍到這樣一個成色了。對我來說，《毒戰》精彩的地方，

  可能比《放逐》《黑社會》難度更高。但為什麼就沒有一種文化認同感？它在合拍片裡面

  勉強可以找到位置。但不像《黑社會》那麼神采飛揚，沒有當代性的感覺。我覺得《毒戰

  》真的是杜琪峰最後的代表作，他之後的作品都不太杜琪峰了。很多導演迷失過後，會真

  的不知道怎麼走。


  特別一些香港導演來內地一段時間後，滿口都是審查啊、過不過啊、觀眾喜歡看什麼啊，

  或者所謂的接地氣。接地氣是幫導演的東西，但是後來發現是害導演的東西。因為他為了

  接地氣，可能會做一些自己不相信的事情。


  我常常舉例說，香港導演來了內地，還是找茶餐廳吃飯。說接地氣，但他們沒有想生活在

  這裡。他們覺得我是香港人，來這裡搵食（賺錢）、幹活。但是沒有信任這個地方，沒融

  入。你說他們有沒有誠意？他們很誠懇，作為一個專業工作者來的。2000年之後，香港導

  演最自豪的是什麼呢？就是我們在香港拍的商業類型片牛X，我們來是出賣技術的。


  但他也覺得，在藝術層面，難道我們能跟張藝謀比嗎？能跟田壯壯比嗎？其實也有這種想

  法。很多導演，說難聽一點就是工匠，提供一個在形式上取悅觀眾的東西。


  --'
