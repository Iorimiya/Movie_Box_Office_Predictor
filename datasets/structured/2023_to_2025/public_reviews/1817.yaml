url: https://www.ptt.cc/bbs/movie/M.1676555604.A.56D.html
title: '[負雷] 《風再起時》伊託答辯？'
content: '「伊託答辯」是中國觀眾對本片的諧音

  評語，雖然我覺得沒有那麼爛，但雖不

  中亦不遠矣。


  被雪藏了3、4年，不知道是當時的香港

  黑警事件或是劇中出現我國國旗，甚至

  有提到陳水扁，而被技術性暫停上映，

  不得而知。


  風格是四大探長故事的文藝版，可以想

  像《甄子丹的葉問》跟梁朝偉的《一代

  宗師》之間的風格差異；追龍、華仔雷

  洛跟本片的風格差異也是如此。


  但是剪輯凌亂、節奏風格怪異，前半段

  有一個小橋段，居然變成歌舞風格，一

  些唯美文藝鏡頭，要不是有郭富城、梁

  朝偉氣場夠足，可以撐住，不然真的像

  中國觀眾戲稱的「低配版王家衛」。


  但優點還是有的，全片節奏雖緩慢偏沉悶

  ，與以往四大探長系列風格完全不同，但

  還是有將香港時代歲月感，用另一種韻味

  呈現。


  再來就是卡司夠強，除了郭、梁兩位影帝

  ，女主角杜鵑，更是表現亮眼，然後真的

  很有上海女人的韻味



  梁朝偉更不用說，他只要站著，就是一副

  美的文藝鏡頭。



  許冠文最後的理想闡述劇情，也真的很戲精。




  但就算卡司再麼強大，也頂多不讓這部電

  影完全崩壞，凌亂的敘述跟剪輯節奏，是

  非常大且易見的缺點。想看郭富城、梁朝

  偉對手戲演技，還是可以等串流上。



  -----

  Sent from JPTT on my Xiaomi 21091116UG.


  --'
