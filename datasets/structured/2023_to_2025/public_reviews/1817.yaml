url: https://www.ptt.cc/bbs/movie/M.1677035160.A.A92.html
title: '[好雷] 濃濃香港情懷，文藝片風格風再起時'
content: '~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~







  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  延宕五年的風再起時電影,有幸在上周看到搶先場，

  身為喜愛香港的人,對於這部片裡濃濃的舊時香港情

  懷感到非常懷念,在看電影之前就有聽說這是文藝片

  風格，所以調整好了自己的心態來看這部片。


  電影一開始講述了香港被各個國家割讓、佔領、

  爭奪之下，人民顯得不安及無所適從,為求生活安定

  ,因此都把行賄警察當成安定生活的方式，接著引導

  出兩大主角的背景及處事方式、個性的極端不同,但

  又同時愛上一個女人，南江也用自己的方式在愛著

  女主角,這角色真的非梁朝偉莫屬!


  片中還能看到導演致敬經典歌舞電影的片段,應該是

  想營造出當時磊樂他們的天真及兩小無猜，襯托後

  面磊樂心態轉變的兩極化,磊樂愛的到底是誰呢?


  片中兩位主角從年輕演到老年,歷經各種事件各自

  心態的轉變，我個人認為都是很精彩的看點,對這部

  電影最讓人驚訝的地方是:

  導演放進了國民黨及共產黨時期人民抗爭的橋段,

  讓人很驚呼導演的大膽!


  也終於了解為什麼這部電影五年前剛拍好不能上映

  (剛好當時過沒多久香港反送中抗爭又遇到疫情爆發

  )，電影主軸都是以香港當年的警察行賄風氣圍繞,

  許冠文扮演的角色對特首說出了香港人民的心聲，

  而在最後一幕結局帶出了磊樂晚年在電視上看到的

  那則新聞做結尾...

  真的真心佩服導演說故事的功力!







