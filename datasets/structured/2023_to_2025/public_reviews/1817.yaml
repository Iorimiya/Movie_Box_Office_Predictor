url: https://www.ptt.cc/bbs/movie/M.1687322566.A.DBB.html
title: '[好雷] 風再起時'
content: '這戲好像都是踏血尋梅的劇組

  這導演把郭富城捧成了金馬影帝

  原班人馬白只、春夏、郭富城

  翁子光這次找來了凱旋歸國的梁朝偉

  主要是博納于冬為這港片砸了大錢


  但聽說這片賠得很慘

  看維基說花了2億港幣

  回收不到1億人民幣

  這片還代表香港去參加奧斯卡

  這是很多港片迷都知道的故事

  劉德華演的雷洛傳

  跟向華強演的藍江傳

  還有反派秦沛演的顏同


  這次由郭富城演雷洛

  梁朝偉演藍江

  一直都演鱉三的譚耀文演顏同

  還有變胖的周文健演韓森

  查了維基原來四人本名叫 :

  呂樂、藍剛、顏雄、韓森


  這片又改名了雷洛改成磊樂

  原名藍剛的藍江又改成南江

  都是取諧音來命名


  郭富城以前雷洛2演過劉德華的兒子

  現在兒子變雷洛又來重演這齣經典

  以前張敏演劉德華的老婆

  現在找來超模演員杜鵑

  張敏的爸爸大撈家白飯魚找吳耀漢來演

  元配邱淑貞找來踏血尋梅的春夏客串

  又做了一些改編，但有拍到最後

  雷洛跟老婆逃到台灣

  藍江跟老婆逃到泰國


  他也沒說雷洛現在死了沒，生死未卜

  但最後一幕就是在陳水扁因為貪汙被捕

  這整片都在講反貪，公務員不能禮尚往來

  習近平說想當官就不要發財

  想發財就不要當官，就像馬英九一樣

  難怪他們兩個會在新加坡相見歡

  都是只愛權不愛錢的政客


  這片我覺得許冠文演的最好

  還都是用英文演說，把香港人的心聲說出來

  好戲值得狂背英文劇本，說英國人走了

  香港人97後該怎麼辦 ?

  就像國民黨逃去重慶，南京跟上海人怎麼辦?

  日本人走了，台灣人又該怎麼辦?


  可以說當年香港沒有英國人幫忙

  就不會有今天的東方好萊塢港片

  現在的韓國沒有美國好萊塢幫忙

  也不會有今天的韓片電影工業


  但願郭台強能買下

  華納、福斯、派拉蒙...

  才能真正超越韓國電影


  這片新雷洛藍江傳就非常好萊塢

  一整個很好萊塢式的復古風

  一看就知道花了不少錢找專家拍的

  就像史匹柏的慕尼黑一樣

  但還是加入港式的舞台劇歌舞

  就像印度片一樣都一定要跳舞


  最近梁朝偉拍完尚氣後都在拍華語片

  還以為他跟張曼玉一樣都沒戲拍了

  沒想到尚氣之後拚命拍中片

  看完了他演的色戒+無間道續集【無名】

  期待他的下一部片金手指

  就是港版的華爾街之狼


  看來中國華語片市場還是很誘人

  好萊塢片拍得再好也進不了中國市場

  但靠影帝梁朝偉、影后楊紫瓊就可以

  估計首位奧斯卡華人影帝應該會是梁朝偉拿吧


  至於走偶像派路線的四大天王郭富城

  這次跟梁朝偉合作應該能讓他演技提升不少

  梁朝偉又不會唱歌跳舞，長的也沒郭天王帥

  就只能靠坎城影帝的演技取勝

  但願這次合作能讓偶像舞王郭天王

  蹭點坎城影帝的熱度紅到歐美去


  --'
