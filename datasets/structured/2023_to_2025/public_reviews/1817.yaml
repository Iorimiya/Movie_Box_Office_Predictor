title: '[情報] 2023 香港奧斯卡代表：《風再起時》 '
content: '原文：


  由兩大影帝梁朝偉、郭富城主演的香港史詩式電影《風再起時》，繼早前成為第46屆香港

  國際電影節開幕電影後，今日（27/9）宣布將會代表香港角逐第95屆奧斯卡金像獎最佳國

  際影片。該獎項將會頒發予年度最佳非英語電影作品，而獎項則會由導演作為代表接受。

  過去香港作品曾經四度競逐該獎項，分別為張藝謀《大紅燈籠高高掛》、陳凱歌《霸王別

  姬》、王家衞《一代宗師》以及曾國祥《少年的你》，是次為第五次有香港電影參與競逐

  。




  《風再起時》今日透過社交媒體公布消息，指電影經香港電影製片家協會挑選及推薦下，

  代表香港角逐該獎項。電影由翁子光執導及編劇，由郭富城、梁朝偉、杜鵑領銜主演，譚

  耀文、周文健、何佩瑜、金燕玲、張繼聰等亦有參與演出。《風再起時》以著名的「四大

  探長」事跡為題材，由郭富城飾演磊樂探長、梁朝偉飾演南江，還原五六十年代的警匪雲

  年代。




  --'
