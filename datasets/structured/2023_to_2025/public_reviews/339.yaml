url: https://www.ptt.cc/bbs/movie/M.1748284036.A.99A.html
title: '[普雷] 搜查瑠公圳'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  基本上技術方面沒大問題，配角也都演的很不錯

  我甚至完全不介意男女主角的緋聞與青澀演出


  但本片犯了很嚴重的敘事結構錯誤



  一件事很簡單 懸疑片的重點就是懸疑



  聽起來好像很廢話，但本片就是想拿一些情感戲來填充


  重點是你一旦知道將軍是無辜的，懸疑感就全無了，我也根本不關心女的是誰分屍的


  一個合格的懸疑片就是至少要除主角外人人都是嫌疑犯才有趣


  所以前面根本不能讓將軍是毫無嫌疑的，你可以安排不知為何將軍經常出去（謎底是蒐集

  證據），也可以讓警總以更神秘的方式出現（阻止主角查案不報名號），把白色恐怖當煙

  霧彈，最後犯人殺人又確實跟部隊有關


  最不該的，就是一眼望去，誰是無辜誰是惡人一目了然


  普雷最主要還是其實其他部分表現可以，但並不建議大家去看


  --'
