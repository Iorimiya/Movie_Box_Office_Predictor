title: '[新聞]張世《搜查瑠公圳》蒙冤下場慘！將軍原型'
content: '新聞網址：



  張世《搜查瑠公圳》蒙冤下場慘！將軍原型竟是他 軍眷忍不住了



  張世於電影《搜查瑠公圳》中飾演趙志昇將軍。（伯樂影業提供）


  〔記者廖俐惠／台北報導〕張世為宣傳電影《搜查瑠公圳》特別返台一個禮拜，不僅創下

  7天跑30場的通告紀錄，勤跑映後的他更與角色「趙志昇」將軍的原型人物柳哲生家屬在

  後台相見歡。


  原來柳哲生家屬全家大小特別自世界各地齊聚台灣看電影一同緬懷逝去的親人，在觀影完

  後柳哲生將軍年邁的女兒在後台見到張世，不禁想起已逝的父親，不但緊緊盯着他，更像

  在尋找她父親的影子，而其他晚輩在旁則不斷提起張世真的長得像外公，讓張世感到相當

  欣慰，「


  」



  張世跑《搜查瑠公圳》映後與角色「趙志昇」將軍電影原形人物柳哲生一家人相見歡。（

  伯樂影業提供）


  提起電影中的原型人物柳哲生將軍，雖然在當年蒙受冤屈卻也展現軍人高風亮節的風骨，

  讓同樣出生於軍人世家，爸爸也是將軍的張世，相當清楚角色的重量，會點頭演出電影也

  是想要藉此緬懷父親。


  他也為了角色做足功課，「



  」



  張世於電影《搜查瑠公圳》展現一演入魂演技。（伯樂影業提供）


  張世和朱軒洋演繹父子之情，讓不少觀眾感動，其中一段血濃於水的真摯告白場景，更讓

  許多人在觀影時掉下眼淚。


  藉著演出這部電影回憶過世爸爸的張世特別在跑映後時與影迷分享記憶中父親，他表示：

  「」


  張世更自認若有兒女一定也和父親一樣是慈父，家中有毛小孩的他，笑認：「因爲我對牠

  非常寵愛。關於教育，其實都是我太太負責，似乎毛小孩不太聽我的，牠聽我太太，然後

  總是來我這邊要肉吃，找我玩。」電影在今天（22日）上映。


  --'
