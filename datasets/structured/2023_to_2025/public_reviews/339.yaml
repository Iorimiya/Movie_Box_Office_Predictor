url: https://www.ptt.cc/bbs/movie/M.1738758412.A.C0A.html
title: '[新聞] 搜查瑠公圳漫畫藏原創精神 導演盼造台灣福爾摩斯'
content: '新聞網址：



  搜查瑠公圳漫畫藏原創精神 導演盼造台灣福爾摩斯


  2025/2/5 14:44


  （中央社記者王心妤台北5日電）電影「搜查瑠公圳」導演賴俊羽今天在台北國際書展與

  作家盛浩偉對談，賴俊羽說，電影改編自凶殺案，最難的是讓環境、氛圍都回到1960年代

  ，也希望創造出類似台灣福爾摩斯的IP。


  文化部長李遠今天出席支持，他表示，賴俊羽某天主動找他表達想拍「搜查瑠公圳」的意

  願，而這部片花了近10年才拍成，很感動電影透過輔導金、民間贊助下完成，「我一直很

  感動台灣年輕導演可以鍥而不捨地去開發新的類型。」


  李遠提到，「搜查瑠公圳」故事背景的白色恐怖或許讓人覺得遙遠，但這並非只關乎一個

  族群或黨派，而是壓迫者和被壓迫者的問題。


  賴俊羽表示，改編電影最困難的部分是要透過田野調查，讓整部片的時空回到1960年代，

  而男主角設定成想找出真相的官二代，女主角則是一名記者，「英國有福爾摩斯、日本有

  柯南，但台灣好像沒有類似的IP，我想用這樣搭檔的方式帶出整個案件。」


  賴俊羽提到，之前的創作者談到白色恐怖或許有種悲情立場，但這次希望用更商業性的語

  言，分享這段沉重歷史，「讓人比較能吸收，也會去研究，而不是覺得是一個大道理。」


  對於「搜查瑠公圳」漫畫，賴俊羽表示，漫畫版創作時間比電影更早，而電影拍攝有所取

  捨，最完整的原創精神和元素都放在漫畫中。


  此片演員姚淳耀會後出席並帶來前導預告和海報，姚淳耀片中飾演反派，他表示，「我一

  直在想角色可以有多壞？人的黑暗面可以到這種程度嗎？」而他在片中要一直虐待別人，

  像是有賞巴掌、吐口水的戲，進去某些古蹟拍攝時，也有毛骨悚然的感覺。（編輯：張雅

  淨）1140205


  --'
