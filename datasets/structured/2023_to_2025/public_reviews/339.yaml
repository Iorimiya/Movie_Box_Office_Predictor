title: '[好雷] 搜查瑠公圳 其實根本沒扯到啥政治'
content: '滿滿都是阿湯哥

  發這可能有點逆風

  因為討厭劈腿女的人很多

  不過就純電影討論吧


  有稍微看了點前面的板友討論

  老實說 如果你主觀意識上

  看到白色恐怖字樣就會起尷尬癌

  →那千萬別看

  如果年代劇沒看到罵蔣或中國會不爽

  →那也別看 因為這部就真的沒講這些

  那種得去看零日攻擊


  如果這樣就排除掉99%民眾的話

  那只能說這導演選錯題目了QQ




  64年前的命案其實大部分人都沒記憶

  如果有先看維基百科再看會有更深一層認識

  看的話就是跟我一樣看完會有很多問號再去查

  不過也不會看不懂就是了


  一切故事都源自於情感

  所以常常故事很純粹 但故事說得好

  →就會是部好電影

  故事很複雜 又想摻一堆說理跟洗腦

  →那就會變得很難看

  米老鼠是這樣，很多國片也這樣

  也有ella一開口我就覺得很尬的案例

  所以這幾年看完國片幾乎都是翻白眼

  不過這就個人觀感 國片還是有粉沒錯

  理性勿戰




  以挑毛病的眼光來看

  瑠公圳這部沒有刻意的男上加男 加分

  沒有一定的外省殺本省

  或本省殺外省 加分


  道具水準：優質的不太適合邊吃邊看

  cg：有點穿但還能接受

  劇情：局部改編當年命案史實

  去帶當年的省籍衝突、父子之間的和解、以及當年無法可管的警總

  賴俊羽在這部電影中 塞入了滿滿沒有冷場的內容

  沒有像返校直接衝撞白色恐怖的歷史

  而是讓角色的人生 去推動戰後本省人、外省人、軍人、

  受害者等不同族群對家的無奈


  但又沒有太多解釋性的對白

  所以很滿但又看的很爽

  它是一部難得的台產改編刑偵電影

  也是一部看完會很想扁警總上校姚淳耀一頓的電影

  可能也會因為太滿有人看得很累

  看完會希望有續集 又擔心有續集拍糞=.=







  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  故事的軀幹是一段綠帽情殺事件，牽起的權力鬥爭，但因其中幾位反派表現太好

  ，尤其朱栢康、警總上校的顏藝，總是不斷的把人拖入思考誤區。

  1961年2月26日，瑠公圳流域陸續發現一具無名女屍的屍塊，受限當時刑事鑑定設備有限

  ，警方無法在第一時間判定死者身分，甚至使用將屍塊拼起來做成懸賞照片的方式，偵辦

  49天內，多達80位被列為嫌犯，且有一名即將升任參謀總長的軍隊英雄遭捲入，被人舉報

  為殺人分屍凶嫌。



  因為瘦子跟陳芳語

  一開始容易被演員名單誤導男女主角是重點

  但每個層次的壓迫感 其實都不在他們倆上面

  純純兩個推劇情npc

  所以介意劈腿的也看不到他們太多

  尤其女的 因為戲份就還好

  比陳零九的兵種還要還好

  有認真看的話會知道反派才是主角

  歪哥其實戲份也不多

  這部片並沒有過度疊尷尬笑料

  更多的是雜誌社老闆或警察隊長都為利是圖

  或者順應長官意見



  在小弟的視角

  有三個重點角色

  【趙將軍】


  「我沒死在戰場上，卻死在自己人手裡 ，這是父親唯一能為你做的了」

  生命中總有幾個人，是用生命逝去跟你和解的

  張世在劇中扮演的趙將軍是最傳統的那種父親，嚴肅並且講的都是最刻薄的話，

  但心中其實不想兒子跟自己一樣，希望子女活出自己的樣子就好，但到了面對槍

  口時才說得出口，永遠都是最沉重的，他每一段平淡講過的話也是在劇中頭尾呼

  應的重點之一。



  【老兵陸根生】

  男女主角的步伐只作為局部推動劇情的棋子，朱栢康的演出才是裡面最令人驚豔的，

  少數讓我覺得戴上眼鏡再換個神情，真的會跟克拉克肯特一樣認不出來的演員，平常對

  他的印象是好好先生，但他在回不了家的榮民、被背叛的丈夫、以及假冒的身份之間透

  過眼神、語氣不斷切換，回不了故鄉、娶妻生子卻求之不得幸福、又無法面對自己，但

  最後還是為親情低下頭，他壞，但他也受盡那個時代社會底層之苦。

  「憑什麼只有你們趙家獲得幸福？」



  【警總白上校】


  警總在故事中，透過各種抓人的跋扈行為，以及角色間耳語常讓人失蹤回不了家等，形

  塑台版KGB的感覺，姚淳耀飾的上校演譯方式也像蓋世太保，做為壞事推進器，他說著最

  尊敬的話，幹著最令人髮指的事，永遠帶著冷笑出現，每次講出『趙將軍~』，就跟惡鬼

  點名一樣要發生事情了，前面有板友說他一直捲舌很刻意，不過我覺得劇中廣播裡的好像

  刻意感比較嚴重，姚那個發音也很容易想到在演雨化田，總之討厭感是點滿了。



  這三個角色是全片吸引目光最長時間的人

  看完電影第一個反應是這部演反派的都會中

  而且劇本沒有很著重在一定要出現本土

  其實外國人不難看懂 也沒太多政治立場問題

  主觀上會覺得大家都是底層人

  要對抗的是時代 跟黨派沒關係、跟貪腐或是人性極度有關

  每一段都在告訴你 底層人只能順應規則

  是龍是虎都給我乖乖趴著


  1961年我連細胞核都還沒長出來

  道具除我覺得警察局那是否過新以外都很逼真

  場景雖然有CG痕跡但影響不大

  像周處一樣 國片真正的劇本其實就該如此

  每部都這樣就不用煩惱賣不賣得出去(?




  難得一部我全程都沒想睡

  只有旁邊觀眾一直莫名笑很煩

  好雷但盡量少雷了

  所有照片都是官方公布過的新聞照


  --'
