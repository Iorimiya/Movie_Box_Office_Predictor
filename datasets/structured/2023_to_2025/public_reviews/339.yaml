title: '[新聞] 專訪《搜查瑠公圳》張世遵循父親遺願！'
content: '新聞網址：



  （專訪）張世遵循父親遺願！每拍一部戲就住院：我問心無愧




  張世在《搜查瑠公圳》飾演父親，戲外則分享生命中「兩位重要的爸爸」。（記者王文麟

  攝）


  〔記者廖俐惠／專訪〕張世暌違多年再次受邀拍攝台灣電影，在《搜查瑠公圳》飾演高風

  亮節的將軍父親，戲外他接受本報專訪，提到生命中的兩位父親，一位是親生父親，臨終

  前仍心繫著他，叮囑要好好演戲；另一位則是乾爹王正方導演，當年力排眾議，邀請他擔

  任電影男主角，也影響他的演藝生涯。


  張世出身自國光藝校戲劇科，年少輕狂，將軍爸爸張羽軍叫他乾脆去演戲，沒想到這一拍

  就是將近45年，侯孝賢、王童等著名導演都是他人生中的貴人，不過他特別感謝王正方導

  演，因為王正方當年堅持邀請張世主演電影《第一次約會》，也因此被王童看中演出《香

  蕉天堂》，張世才有後來的金馬獎男配角。



  張世（左）、王正方戲裡戲外都像父子。（圓方影業提供）



  張世（左）、王正方導演（中）一同在紐約接受華府新聞採訪。（圓方影業提供）


  在王正方口中，張世就是個毛頭小子，他也大方承認，自己總是跟在他屁股後面跑，與他

  對戲一點都不緊張，反而樂在其中。張世直呼，當時能夠拍攝到王正方的電影，是多麼不

  可思議、震撼的事情，笑說：「我多牛逼啊。」


  後來張世跟隨王正方一起到美國見世面，「我跟著他到紐約演藝學院，我是如此被尊重，

  電影在全北美戲院上映，你知道我有多風光，30年前在HBO播欸，我牛逼到走路有風。」


  張世看著王正方一個華人透過自己的學識涵養，把美國人辯論到啞口無言，卻也在背後看

  到一位電影工作者的艱辛，當時還年輕的張世直呼「真的是最崇拜的偶像」，他也爆料連

  帶髒話也學了不少。




  張世拍攝電影《第一次約會》，被美國劇組班底嚇到，直呼「多牛逼啊」。（圓方影業提

  供）


  他坦言，當時覺得在台灣拍學生片已經飽和了，自己想要突破，才會想要轉往美國發展，

  同一時間的台灣，本土文化崛起，不會台語的他顯得格格不入。


  王正方推薦他到中國試試看，就這樣在25年前轉往中國發展，期間接到了《漢武大帝》、

  《福祿壽三星報喜》等中國戲劇，事業順風順水，沒想到接連遇上父親過世、母親生病的

  打擊，恰巧當年遇上2008北京奧運，他毅然決然放下事業，返回家鄉台灣專心照顧家人。



  張世（右）和父親張羽軍在上海黃埔江畔外灘一同合影。（圓方影業提供）


  張世的父親在2007年過世，張世當時還在北京工作，沒見到最後一面是一輩子的遺憾。他

  聽弟弟說，父親到臨終前都還念叨，希望張世要好好演戲，而張世也沒有違背父親的遺願

  ，「我有做到，每次演出我都盡所有能力，每次拍完一部戲一定會住院，我全心全意，但

  是我問心無愧！」


  每拍完一部戲就到醫院吊點滴，張世太太很是心疼，簡直是用生命在拍戲。不過張世認為

  ，這是他父親交代、師長給他的教育，不能辜負他們的期待，全力以赴才值得別人尊重。


  張世主演的電影《搜查瑠公圳》已在台上映。


  --'
