  我不能理解的是就那麼剛好都跟趙將軍有關？！

  還是警總有跟陸根生合作？

  我是漏看了哪個部分嗎？


  題外話

  年輕演員演這個時代的角色為什麼都要這樣怪腔怪調的 有點出戲之外

  整體來說我覺得蠻好看的

  會讓人想要知道真相是什麼

  我會給好雷就是了


  --'
