url: https://www.ptt.cc/bbs/movie/M.1748099248.A.B23.html
title: '[新聞] 張世一演入魂！《搜查瑠公圳》全台上映再'
content: '新聞網址：



  電影預告：



  張世一演入魂！《搜查瑠公圳》全台上映再現時代精神




  台灣首部結合時代氛圍與刑偵推理的電影《搜查瑠公圳》正式於全台93家影院上映，這部

  耗時7年籌備的IP大作不僅集結金獎導演賴俊羽與多位實力派演員聯手打造，更以1961年

  台灣首宗離奇女屍命案為背景，展現國片在美術、特效與故事深度上的全面突破。



  在片中飾演將軍趙志昇的張世，憑藉細膩的情感詮釋成為全片最大亮點。他特別為電影返

  台密集宣傳，創下短短一周跑30個通告的紀錄，並親自參與映後座談與影迷互動。


  趙志昇的原型人物柳哲生將軍一家也特地從世界各地齊聚台灣觀影，柳哲生的女兒在映後

  見到張世時，感嘆他彷彿讓父親的身影重現眼前，讓現場氣氛溫馨又感人。張世坦言，這

  樣的回饋已超越了角色本身，而是傳遞了一種時代精神。


  張世透露，為了詮釋這位高風亮節的軍人，他不僅深入研究角色背景，更努力帶領全片演

  員融入1960年代的時代氛圍。


  他認為，最大的挑戰在於讓所有人都能進入那個年代的情境，否則個人的表演再精準也會

  顯得突兀。片中，張世與金馬男配朱軒洋飾演的父子間矛盾與和解的情感張力，成為觀眾

  最為動容的部分，尤其一場真摯告白的戲碼更讓不少影迷淚灑影廳。


  張世在宣傳期間也分享了對父親的回憶，他形容父親雖是將軍，但在家中卻是慈祥又充滿

  智慧的角色。他笑稱，自己若有孩子，也會成為一位慈父，然而目前家中的毛小孩似乎更

  聽老婆的話，他則成了專門提供肉吃與陪玩的人物。


  這次宣傳行程中，張世還特別接受老友王偉忠的電台專訪，兩人久別重逢後大聊眷村生活

  ，王偉忠更盛讚張世的演技，讓張世直呼這是至高無上的榮譽。


  儘管多年未在台灣活躍，張世仍用角色與觀眾建立連結，他表示，只要觀眾能從他的演出

  中感同身受，他的工作便已圓滿。


  《搜查瑠公圳》不僅以精緻的佈景與特效重現1960年代的台灣，還匯集了朱軒洋、梁修身

  、姚淳耀、潘儀君等金獎級演員同台飆戲，並邀來新生代演員吳卓源首次挑戰大螢幕。


  這部電影不僅是一次視覺與情感的雙重饗宴，更是台灣電影實力的最佳展現。更多相關資

  訊，請關注伯樂影業官方平台。



  張世於電影《搜查瑠公圳》展現一演入魂演技。（伯樂影業提供）


  --'
