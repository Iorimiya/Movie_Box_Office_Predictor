title: '[新聞]《搜查瑠公圳》張世不忘侯孝賢教誨！暫時'
content: '新聞網址：



  張世不忘侯孝賢教誨！暫時不打算退休　看好朱軒洋、李雪



  ▲久違台灣的張世，近期在《搜查瑠公圳》演被冤枉為分屍案真兇的將軍，表現超搶眼。

  他坦言侯孝賢則說過「演員的生命在舞台上」，他永遠不會忘，目前也沒想退休，在新生

  代演員中覺得《搜》片中的朱軒洋、李雪都很不錯。（圖／記者蘇詠智攝）


  記者蘇詠智／台北報導-2025-06-16 01:25:08


  金馬獎得主張世，近期在《搜查瑠公圳》中扮演被被誣指為分屍案重要涉嫌者的將軍，演

  出十分搶眼，堪稱全片亮點。他近年來定居泰國，雖然滿意當地的生活，卻還是沒忘了有

  好的角色就返台拍戲，目前還沒有退休的想法，表示侯孝賢講過一句話他永遠不會忘：「

  演員的生命在舞台上面。」


  他除了演戲，也還有持續創作劇本，為當導演做準備，只要資金到位，馬上可以啟動。在

  年輕一輩演員中，他認為《搜查瑠公圳》朱軒洋、李雪都很不錯。



  ▲張世（中）在《搜查瑠公圳》扮演被誣指為分屍案真兇，遭到不幸的將軍，堪稱全片一

  大亮點。（圖／伯樂影業提供）



  張是沒忘侯孝賢教誨　演員生命在舞台上


  久久沒在台灣拍戲，張世在《搜查瑠公圳》展現老薑實力，也因為上片宣傳，有機會在台

  多待一些日子，參與映前、映後活動。他坦言現在都會把老朋友放在心上，不一定要見面

  ，畢竟大家都有自己的家庭與事情，硬湊不一定能湊得齊，形容：「得想辦法把頻率拉在

  一起。」他自我打趣：「我從小在電影圈長大，好像不拍電影都碰不到朋友，你們幫幫忙

  吧，幫忙多介紹一點電影給我拍。」


  昔日曾合作過《風櫃來的人》，導演侯孝賢講的那句：「演員的生命在舞台上面。」讓張

  世還沒有退休的想法，隨時會準備把自身的生活體驗、經驗，藉由肢體與情感傳達給觀眾

  ，問他是否想過一年設定拍幾部片，他笑著反問：「你排斥錢多嗎？」難道大家都來找就

  全都接下來？他又是一笑：「能的話我太太應該很高興。」



  ▲張世近年來定居在泰國，很習慣當地生活，覺得學藝術的人在那兒會很有收穫。（圖／

  記者蘇詠智攝）



  張世和泰國動作巨星交朋友　和爸爸的感情灌注角色中　


  經由與宗教團體結的緣，張世在泰國開始新生活，大讚學藝術的人在那裡應該會很有收穫

  ，要看畫，隨時走到哪裡都有畫展，要看漂亮的服裝，街上都是模特兒，十分賞心悅目。


  他從生活中慢慢把泰文練起來，笑言跟泰國動作巨星東尼嘉是朋友，原來兩人曾經透過《

  唐人街探案》系列的編導陳思誠認識，開始展開一些交流，反而是他沒有忘記教誨的侯孝

  賢，在《風櫃來的人》之後幾乎沒再合作，也失聯許久，他解釋：「侯導走他自己的路，

  我不是他那條路上應該要有想法的角色。」


  其實當初張世西進中國發展，也是因為台灣後來台語劇當道，他沒有生存空間。有時不是

  硬練台語就能練出來，而是自己的形象也不太合適台語劇，他解釋：「我的眷村形象太鮮

  明，就連以前拍些學生片，演的還是眷村子弟。」


  他的爸爸跟他在《搜查瑠公圳》扮演的角色很像，是個將軍，後來他在中國拍戲，爸爸在

  台灣生病，那時兩岸間的交通遠不如現在方便，網路也沒有今日發達，只能橫跨海峽兩岸

  互相思念，他也記得爸爸最後說的一句：「我真的很愛你。」把那種心情放進《搜查瑠公

  圳》的演出中，難怪格外感人。



  ▲朱軒洋（如圖）外型、實力在年輕小生中都屬一流，潛力也被前輩張世看好。（圖／伯

  樂影業提供）



  張世看好朱軒洋、李雪　有機會還想當導演


  片中演他兒子的朱軒洋，又已經是晚他好幾輩的年輕演員，由於他的戲份拍攝集中在兩個

  多禮拜內結束，彼此就算是演父子、對手戲也不少，相處的時間並不能算很多，他卻覺得

  自己的建議，朱軒洋都有聽進去，也認為朱軒洋有一種桀驁不馴、陽剛的特質，是蠻不錯

  的新秀。片子裡慘遭分屍的李雪，和他就沒對到戲，但他從大夥兒為了宣傳而相處在一起

  的感覺，認為李雪懂進退，懂禮節，整個人很大方、活潑，也很有潛力。


  11年前張世曾經演而優則導，拍了《活路：妒忌私家偵探社》這部電影，重用楊謹華與劉

  以豪擔任主角，兩年之後楊謹華就主演了《一把青》，再過兩年換成劉以豪憑《比悲傷更

  悲傷的故事》紅到韓國。張世還有想再導戲的計畫，這幾年都不停創作，努力準備，表示

  只要資金到位，馬上就能夠進行，期待早日遇上願意支持自己的伯樂。



  --'
