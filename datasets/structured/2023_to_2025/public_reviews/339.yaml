url: https://www.ptt.cc/bbs/movie/M.1748010452.A.907.html
title: '[好雷] 《搜查瑠公圳》，如果拍成電視劇是否能'
content: '部落格版：


  1961年2月，四名學生在臺灣大學旁的堀川發現一顆女性的頭顱與上半身屍體，消息傳開

  震驚整個社會，就連時任總統蔣中正都格外關注此事。為了儘快破案，國民黨文傳會破例

  核准各家報社能夠自由報導此案件，警政單位更祭出獎金給予提供線索之人，有名三輪車

  伕憶起曾經載過帶著包裹屍體的草蓆包的男子，後經追查警方曾一度鎖定名叫吳武英的男

  子為主要嫌疑人，不過後來又轉為懷疑空軍少校將柳哲生的司機與園丁所為，加上現場找

  到的線索更讓警方認為死者是死在柳宅中。然而在四十多天過後，經家屬與好友指認，證

  實無名女屍身份是年僅29歲且懷有身孕的陳富妹，並藉此查出其前夫盧家祥才是真正的兇

  手。主因為兩人為爭奪3歲女兒的撫養權發生爭執，而盧家祥更指責陳富妹不檢點，在與

  他離婚後與有婦之夫交往並且還懷上對方的孩子，因此動怒掐死陳富妹並將她分屍丟棄堀

  川。


  由於盧家祥與陳富妹家正好住在柳哲生家附近，於是盧家祥便將證物丟入柳哲生家中，意

  圖栽贓嫁禍給柳哲生。雖然盧家祥在隔年4月槍決伏法，也總算還給柳哲生清白，可當時

  媒體大肆報導此案件，讓柳哲生確實的「被成為」殺人兇手，造成其名譽嚴重受損，即使

  後來他控告數家報社毀謗，依然讓他失去錯過生任空軍總司令部的機會，黯然退役轉行改

  去經營冰店。這起轟動當年台灣社會的分屍案，因棄屍地點被錯認為瑠公圳，因此被媒體

  報導為「瑠公圳分屍案」，即使在陳富妹之前亦發生過兩起分屍命案，不過由於此案件在

  政府的核准下，經由報社不斷用大篇幅報導案情進展，還有國軍高階將領柳哲生牽涉其中

  ，讓柳公圳分屍案名氣與後續影響遠比前兩起分屍案都還來得高。而由導演賴俊羽所執導

  的《搜查瑠公圳》正是取材並改編這起瑠公圳分屍案，選擇從警察與記者的雙重視角出發

  ，從頭帶領觀眾再次認識台灣歷史首起女子分屍案。


  基本上《搜查瑠公圳》保留住了原來案件的主幹，導演賴俊羽相當忠實的把命案搬上大銀

  幕，連當年提供線索的三輪車伕林萬而都更名為萬二，繼續在電影中替警方提供線索。只

  是為了提高精彩度與增添更多懸疑感，從旁編寫出虛構的情節與支線，讓盧家祥在電影中

  的對應角色陸根生之所以栽贓給相當於柳哲生的劇中人物趙將軍，不單只是剛好住在附近

  而是有著其他怨恨他的動機。此外，當年礙於科技不夠進步，讓警方辦案過程困難重重，

  就連介入調查的臺灣警備總司令部都因破案壓力，於是多次抓錯人甚至對無辜者刑求逼供

  ，導演賴俊羽亦將這部分改寫為趙將軍正是那位遭到警總「抓錯」且進行「刑求逼供」的

  無辜者，不僅是讓趙將軍兒子、也就是主角趙子午有了誓言查出真相還給父親清白的動力

  ，更藉著劇情的編排讓趙將軍從無辜者成了政治迫害與利益關係下的受害者。



  在剛看完《搜查瑠公圳》的時候我一直覺得電影非常可惜，雖然因為藉由美術與特效重現

  舊時臺灣，整體氛圍亦營造的很好，但不知為什麼給我的歷史感很少。即使故事背景設定

  在1961年，卻絲毫感受不到多少戒嚴時期的壓抑與恐懼，就算電影中有出現警總白上校對

  趙將軍刑求逼供的畫面，但也僅僅像是一個過場，依然讓人進不去那個年代，認為《搜查

  瑠公圳》就像部把歷史的表層套在上頭的懸疑劇而已。而在事後閱讀了瑠公圳分屍案的相

  關文章，稍微理解了整起事件之後，明白原本案件確實就如電影發展的那樣，就是起普通

  的情殺案，而導演賴俊羽也將之改編的沒那麼單純，不過對電影的可惜也沒有因此變少。

  主要是我認為既然都特地編寫出虛構的情節與支線，讓瑠公圳分屍案不再看似只是一起單

  純情殺案，而是更多了檯面下不被民眾所知的複雜關係，但可惜的部分就在這裡。


  導演賴俊羽將趙將軍遭到栽贓的事情，扯出警總和綽號三爺的周永華有利益勾結，是周永

  華在背後設計陷害趙將軍，不僅是因為對方的勢頭正盛，更是因為愛黨愛國、為人正直充

  滿正義感的趙將軍，正在私下搜查許多官員的不法行為，其中正好包括自己。於是他勾結

  了即使是像趙將軍這樣的將領，也無法抵抗與質疑的戒嚴體制下成立的機構、臺灣警備總

  司令部，意圖合理的將他給除去，可是那然後呢？導演賴俊羽是將柳公圳分屍案改寫的很

  有意思，能讓幾個現實中顯然無關的人物，在來到電影中易名後有了關係上的糾葛，不過

  似乎也就僅此而已。主要是電影中對警總與三爺描寫太少，甚至從中段開始幾乎沒了戲份

  ，一路消失到最後再出場就是倉促的句點，更留下三爺遭到背叛的白上校槍斃這樣一個莫

  名的片尾彩蛋。我覺得與其寫的這麼表面與保守，讓警總這樣一個代表戒嚴時期政府無法

  撼動的體制與機構，被成為不過就是刻意要讓男主角與父親上演和解戲碼的功能性存在，

  不如更多時間去設計與編排電影重點的懸疑線。


  我很喜歡《搜查瑠公圳》裡的懸疑主線，後來的反轉雖是預想得到的部分，不過卻成功替

  原本的案件注入新意。瑠公圳分屍案之所以能讓警方與警總忙得焦頭爛額還遲遲抓不到兇

  手，是因為當時臺灣的科技不夠進步，但在《搜查瑠公圳》中卻是人爲所致。即便劇中陸

  根生與現實中盧家祥同樣將線索丟到陸將軍、柳哲生家中，更匿名舉報陸將軍就是分屍案

  兇手，讓陸將軍遭到警總帶走刑求，不過陸根生顯然更加聰明，僅僅一個動作便錯誤引導

  趙子午與秀秀追查的方向與認知，加上剛剛好警總的攪局與報社的誤報，讓電影確實的很

  有追查真相的懸疑感。此外，我喜歡導演賴俊羽在趙子午跟秀秀每追查到一個線索，便用

  實景還原當時的狀況，讓他們與過去發生過的事情位處同一個時空，製造出與之經歷的臨

  場感，儘管很多電影都有用過同樣的手法，但這依然是相當不錯的加分項。真的比起無感

  的警總與三爺這條支線，這條懸疑主線與從陸根生延伸出進去的支線更好。



  《搜查瑠公圳》中陸根生與阿美、黃永霖三人的愛恨糾葛寫得很有感覺，陸根生由愛生恨

  的扭曲感將「情殺」這個變調的動機強調顯出來。但除此之外，電影中其他的情感戲部分

  就顯得多餘且刻意，特別是趙子午與趙將軍兩人的父子情，我懂是為了讓電影在後來能有

  和解、還有為兒子認罪的動人橋段，與拉出自證清白選擇結束生命的悲壯感，可我認為部

  分放在這樣一部看起來很認真考究的歷史劇、時代劇裡，是很沒必要的矯情安排。畢竟我

  會想來看《搜查瑠公圳》是想更認識過去的臺灣歷史，我會更希望導演賴俊羽能夠增加警

  總與三爺、或是整個戒嚴時期的氛圍描寫，甚至能夠更誇張的還原這起案件在當時所引發

  的媒體亂象，反映出當時候的政治與社會局勢，而不是讓《搜查瑠公圳》成為一部不必在

  那個時代也能發生的通俗電影。


  《搜查瑠公圳》看得出其用心與野心，我個人也給予團隊高度肯定，只是我會想如果導演

  賴俊羽把這個故事拍成電視劇是不是會更好一點？能夠說的部分絕對更多，也有更多時間

  能把角色寫更好。最後我還想吐槽的，就是趙子午明明才剛從白上校手中順利脫逃，居然

  還大大方方出現在趙將軍被迫模擬棄屍的現場，而在他被發現後被秀秀拉著跑走，鏡頭明

  明帶到有兩個警總的人有所反應，加上我不認為白上校會放過趙子午，可警總卻沒有任何

  人追到、抓到趙子午與秀秀？而在往前推，秀秀居然會被白上校放過兩次，就當時的環境

  與警總掌握的權力來看，白上校絕對是可以隨便找個罪名逮捕甚至解決秀秀，畢竟歷史情

  況是當時柳哲生明知自己受到無辜牽連，也只敢控告報社誹謗而不敢去向警總討公道，就

  可知道警總的權力之大，在擺明就是要趙將軍認罪的情況下，儘管時任總統蔣中正給予報

  社相關程度的報導自由，我還是不認為白上校會三番兩次放過妨礙自己的秀秀。


  說到演員方面，姑且不論戲外朱軒洋與吳卓源的感情問題，朱軒洋還是非常適合趙子午這

  樣子的角色，而吳卓源的口音也因角色秀秀被設定為有著出國留學過的背景，很順理成章

  的合理化，所以整體而言並沒有任何問題。其實兩個人的演出沒有任何問題，我覺得就是

  很中規中矩的在詮釋趙子午與秀秀，畢竟也看過兩人之前的作品，就算沒有拿到滿分至少

  也在及格之上，只是可惜這部電影的每個配角全部都太強，飾演阿美的李雪、飾演趙將軍

  的張世、飾演陸根生的朱栢康、飾演白上校的姚淳耀，就連戲份不怎麼多的隊長馬利歐、

  趙將軍妻子潘儀君都端出金獎級的演技，特別是張世其氣場之強大，那場遭到刑求拔掉指

  甲的那場戲，隔著銀幕都能感受他無聲的痛楚，還有最後他在堀川旁的告白，那首我沒聽

  過的軍歌，看著兒子的眼神，不過幾分鐘已是千言萬語。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
