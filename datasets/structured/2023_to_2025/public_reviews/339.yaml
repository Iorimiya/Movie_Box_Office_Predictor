url: https://www.ptt.cc/bbs/movie/M.1748347614.A.DF5.html
title: '[新聞]《搜查瑠公圳》導演賴俊羽：不勇敢面對過'
content: '新聞網址：



  《搜查瑠公圳》導演賴俊羽：不勇敢面對過去就永遠無法放下，男孩必須摧毀父親才能成

  為男人




  2025 年 5 月 26 日


  2013年，賴俊羽執導的校園浪漫電影《愛情無全順》大受觀眾歡迎，劇情以一段辛亥革命

  時期的鄉野奇談作為背景，並加入許多懸疑元素，可以一窺他對文史改編創作及推理類型

  片的喜好，甚至投入七年光陰和熱情打磨一個故事，才拍出電影《搜查瑠公圳》，並將自

  己與父親之間的情感投射其中。


  台灣第一起女子分屍命案和媒體亂象


  《搜查瑠公圳》改編自戰後台灣第一起女子分屍命案「瑠公圳分屍案」，案發在1961年，

  當時引起社會譁然，連總統蔣介石都關心破案進度。


  明明正值白色恐怖的年代，言論受到政府管制，但這起案件不僅報社可以自由報導，還任

  由報紙捕風捉影、聳動下標，甚至直接刊登出女屍的容貌，賴俊羽說：「我認為這算是台

  灣第一次的媒體亂象。」




  在輿論壓力下，警方為了早日破案，宣布接受民眾舉報、提供線索，而民眾為了爭取高額

  獎金，爭先恐後提供消息，造成警局人滿為患、陰謀論四溢，「有人影射一位空軍英雄是

  兇手，他本來有機會成為總司令，結果因此辭職，最後去賣冰，我覺得很諷刺，因為他比

  較有名，所以被認為是兇手。」


  受盛名所累的不只空軍英雄，其實瑠公圳分屍案棄屍地點不在瑠公圳，而是在台北市新生

  南路旁的堀川，賴俊羽認為，這十分呼應被捲入的空軍英雄，《搜查瑠公圳》便以當年捲

  入的軍人家庭出發，講述軍二代警察趙子午（朱軒洋飾演）和女記者張秀秀（吳卓源飾演

  ），因緣際會組隊調查分屍案，不料他的將軍父親趙志昇（張世飾演）竟遭人指控為兇嫌

  而被逮捕刑求，也將趙子午逼入絕境。


  趙子午和張秀秀兩人宛如福爾摩斯和華生，一步步揭開謎題，帶領觀眾揭開兇案真相。





  從漫畫、桌遊到電影打造IP，角色鮮明找演員出奇順利


  六〇年代的辦案科技雖不如現代，但撲朔迷離的案情已戲劇性十足，加上白色恐怖時期下

  ，派系角力及思想壓迫的社會氛圍調劑，一場具有時代感的懸疑推理大戲，就在賴俊羽的

  電影腦裡盛大上演。


  2017 年他開始與數名編劇合作，將案情改編成電影劇本，並開始畫分鏡，但在尋找投資

  方時四處碰壁，「我突然有個想法，不如我把分鏡圖變成一本漫畫？」於是，他找來漫畫

  家林詩禮合作，有別於一般的漫畫分鏡，整本漫畫皆以 16:9 的電影分鏡構圖呈現， 《

  搜查瑠公圳》漫畫版就是電影版的分鏡腳本，讓讀者在閱讀過程就像看了一部推理懸疑電

  影。




  2022年《搜查瑠公圳》先以漫畫形式出版，緊接著出了桌遊，到了2025年電影才正式上映

  。「單單只是給劇本，每個人都會有各自對這個故事的想像空間， 一旦將它具象化之後

  ，在溝通上就會變得更精準。」


  或許就是經歷了不同媒介的打磨耕耘劇本，當賴俊羽真的要將《搜查瑠公圳》拍成電影時

  ，其中的角色已具備非常鮮明的輪廓，選角很順利，而演員也能專注在厚實故事人物的細

  節，並將其深化在表演之中，「劇本只是一張藍圖，反而都是他們（演員）在教我，賦予

  角色更多想像空間。」


  無名女屍及女記者、老兵及將軍，是時代壓迫下的對照組


  角色的設定及塑造，皆有其時代意義。賴俊羽說，分屍案在當年傳開後，引來很多丈夫前

  來認屍，想要確認是不是自己逃走離家的妻子，甚至刊登廣告警告或尋找逃妻，反映出當

  時女性權益普遍低落，以及隱藏在社會裡的家暴問題。


  電影中的無名女屍和女記者張秀秀，其實是一組相互呼應的角色，「她的真實身份是一個

  遭到家暴的女人，而秀秀則是在職場上受到男性打壓和歧視的女性，我想要隱喻她們相似

  的命運。」兩人都是在對女性壓迫的時代下追求自己想過的生活，卻得到截然不同的結局

  。




  女主角張秀秀的形塑，參考自當年真實人物，分別是攝影記者伊夢蘭以及文字記者楊千鶴

  ，她們都是台灣第一代的女性記者。


  兩位前輩記者的自傳寫道，當時只會被分配到婦女專欄或地方小吃這類軟性報導，在辦公

  室也常被當成小妹使喚，「她們個性都特別堅毅，妳必須要比男生還要男生，才有辦法證

  明自己。」


  賴俊羽在第一時間就鎖定歌手吳卓源來演出，「她是一個很有企圖心的女孩子，這點跟張

  秀秀很像，很勇於突破她的現狀。我面試她的時候，她絲毫沒有害怕或猶豫，非常願意嘗

  試。」




  老兵陸根生及將軍趙志昇，則是另一個對照組，他們象徵外省人不同的選擇，前者是想落

  地生根、但求而不可得的底層人物，後者是深信家在海的另一邊的權貴階級，在白色恐怖

  的年代，其實外省人也有被害者，「我在調查過程中，發現外省人殺害外省人的比例也不

  少，而且都是知識份子和高官，手段往往更激烈，因為他們非常瞭解彼此的惡。」於是在

  《搜查瑠公圳》中更，著重於描述外省人之間的糾葛。朱栢康和張世精準呈現角色樣貌，

  帶來超乎預期的演出，令觀眾印象深刻。


  賴俊羽說，找香港演員朱栢康來台灣演陸根生，一方面是角色的演技吃重，另一方面是想

  藉由台灣觀眾不熟悉的面孔，製造對角色陌生的感覺，沒料到《搜查瑠公圳》還未上映，

  朱栢康就先以《破・地獄》爆紅。


  賴俊羽說，朱栢康是一位藝術家，表演的每個轉折都很有層次，有一幕是陸根生撞見腐爛

  的遺體後，要跑到室外嘔吐，光是要「真吐」還是「乾嘔」就和賴俊羽有一番討論，「他

  認為乾嘔能展現這個角色的一絲人性。」




  至於趙志昇將軍的選角，打從一開始，賴俊羽就把演員張世納入口袋名單，但他長年在中

  國發展，原本不抱太大希望，「張世老師一看完劇本就答應要來演。」原來張世的爸爸就

  是一名貨真價實的將軍，他的童年就在真正的外省軍人家庭中生活長大，「他們更注重很

  多傳統的禮節，講究階級跟輩份，睡覺前和早上起來都要去請安。」也分享很多軍二代父

  子間會出現的矛盾經驗。




  背負龐大父權和威權的時代壓力，不面對過去就永遠無法放下


  朱軒洋則因為陽剛外型，頗符合角色特質，加上富有爆發力的演技，成為男主角趙子午的

  不二人選。趙子午出身自軍人家庭，有著小霸王性格，但在囂張背後總有個揮之不去的陰

  影，賴俊羽這樣形容趙子午的心境，「你永遠超越不了你爸，你做什麼都會被說沒出息。

  」


  他違背父親的期待去當警察，威權時代的陰霾還重壓在他身上，「但這也成為趙子午成長

  很重要的推進力。」瑠公圳分屍案就是趙家父子共同經歷最大的難關。




  賴俊羽坦言，「趙子午在一方面也是我自己的投射，我覺得每個男孩都會有一個父子情節

  。」他的語氣突然變得鏗鏘有力，「你必須要摧毀你爸，然後接受他，你才有辦法成為你

  自己。那是一種『父親的死亡』，這就是男孩子變成男人的一個過程。」他解釋「摧毀」

  不是指形式上的殺掉，而是透過溝通或瞭解，讓人生軌跡上的父親角色得以「死亡」。


  「男孩子都曾把父親當成英雄，但在成長過程中卻發現不是如此。」原來，在賴俊羽升學

  的時候，爸爸執意要他去能保障收入的軍校，但他偏偏就讀了個藝術大學，接著走上導演

  的路，不穩定的工作型態難免換來父親酸言酸語。


  後來賴俊羽在和父親的一次對話中，終於理解為什麼爸爸當年那麼執著要他考軍校。「戰

  後那一代，國家需要大量的公務員運作國家機器，所以對公務員會特別好，他們享有的權

  利也會特別大，成為軍人也有類似的意義。」


  因為了解時代脈絡造就的觀念差異，父子關係才漸漸和解，「不勇敢面對過去，就永遠沒

  辦法放下。」這也是賴俊羽創作《搜查瑠公圳》的初衷，即便面對傷口很令人恐懼，也很

  疼痛，但唯有正視過往，傷痕才有機會化作成長和癒合的養分，使傷害不再重蹈覆徹。





  --'
