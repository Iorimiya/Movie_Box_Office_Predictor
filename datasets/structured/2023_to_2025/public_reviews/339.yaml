content: '剛剛看完

  覺得電影完整度不錯

  血腥程度很高

  建議對屍體反感可能要注意一下

  電影特寫蠻多的

  可是喜歡的人就會很喜歡


  劇情編排還行

  但不太會當正史

  太戲劇化但我是蠻喜歡

  有一幕男主直接韓森上身


  有人說政治問題

  我是覺得一律當偽紀錄片就好

  覺得被黑的不舒服就當平行時空啊～


  反正人本來就是不能互相理解

  不然就不會引發那麼多戰爭


  這部估計上網飛會大紅


  -----

  Sent from  on my iPhone


  --


  神功護體



  --

  爛在那裡？

  道具劇情節奏都不錯啊'
