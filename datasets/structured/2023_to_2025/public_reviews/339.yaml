url: https://www.ptt.cc/bbs/movie/M.1748181895.A.C7E.html
title: '[新聞]打造台版福爾摩斯《搜查瑠公圳》還原台灣'
content: '新聞網址：



  打造台版福爾摩斯！《搜查瑠公圳》還原台灣第一起現象級刑案及媒體亂象


  作者：菜記士多



  朱軒洋主演《搜查瑠公圳》改編自台灣史上最著名的女性重大分屍刑案。（圖／伯樂影業

  提供）


  犯罪刑偵片在台灣商業電影市場作品不少，但幾乎很少出現以真實事件為本的改編電影，

  導演賴俊羽花了9年時間完成的《搜查瑠公圳》以台灣史上最著名的女性重大分屍刑案「

  瑠公圳分屍案」為本，請來朱軒洋及Julia吳卓源的新奇配搭擔綱主演，分別飾演軍二代

  警察趙子午以及熱血記者張秀秀。


  本來應該站在對立面的兩人，為了破案的共同目標一同攜手查案，電影也號稱是「台版福

  爾摩斯」，試圖打造台灣的懸疑推理新IP。


  《搜查瑠公圳》劇情及人物有部分虛構，但大部分案情架構相當忠於史實，也讓人驚訝早

  在1961年，距今將近70年前，就已經有如此誇張的案件及情節。



  《搜查瑠公圳》張世與兒子之間的父子情十分催淚。（圖／伯樂影業提供）


  這起發生在台北市瑠公圳（今新生南路）周邊的分屍棄屍案在當時震驚全台灣，由於當時

  的偵查科技相當有限，光是確認死者身份就費了九牛二虎之力，而因無法找到死者身份，

  鎖定嫌犯的過程更是曠日費時，警總介入調查，抓錯人、刑求逼供等等，媒體更是卯起來

  進行鋪天蓋地的報導，將事件相關的所有調查細節加油添醋，甚至捏造劇情，在短短時間

  內寫成將近上千則報導內容，讓分屍案聲名大噪，知名度甚至一路延續到今天，是反映當

  時台灣政治及社會情勢的獨特奇案。


  在整起案件偵辦將近兩個月的過程中，由於人證及物證都極難取得，在看見黑影就開槍的

  狀況下濫捕無辜，有將近80位無辜市民被列為嫌犯，被拘留調查的時間不等，也在調查結

  果未名的狀況下遭到媒體及輿論臆測審判，導致生活大受影響，其中最有名的受害者，就

  是當時的國軍高階將領，身為空軍英雄的空軍少將柳哲生。


  他原先是空軍總司令的下任接班熱門人選，但因家中司機及園丁被懷疑為嫌犯而拘捕，在

  事件中被媒體鋪天蓋地的臆測報導幾乎抄家，導致名譽嚴重受損，儘管案件在被害者身份

  確認之後很快水落石出，證明了他及家僕們的無辜，仍然申請提前退役，黯然離開崗位。



  朱軒洋在《搜查瑠公圳》為了洗清父親冤屈，努力找尋分屍案凶手。（圖／伯樂影業提供

  ）


  導演保留了大部分的案件主幹，再加上虛構的男女主角及旁枝人物和情節，就是《搜查瑠

  公圳》的主要劇情。


  但電影的難度除了考究當時史實、事件細節及事件發生的地理位置、犯案情況之外，還必

  須還原1960年代的台北市的環境及氛圍，也想用商業手法來處理白色恐怖時期的政治情勢

  及媒體亂象、媒體公審殺人等情況，在場景、美術、服裝、演員口音的考究及攝影部分都

  下了不少工夫。


  但《搜查瑠公圳》想講的並不只是搜查及探案的獵奇過程，更是一段父子和解之旅。


  嚴厲不善跟兒子互動的高階軍官父親，以及跟父親很像的警察兒子，不知道如何靠近對方

  ，不知如何說愛的兩人，在父親被當成嫌疑人逮捕之後，兒子才啟動了為父伸冤的調查之

  路。


  經歷了曲折的過程，兩人終於能夠當面對對方說出自己的愛及感謝，飾演父親的張世與朱

  軒洋都真情流露，父子訣別的場面，也是電影中最催人熱淚的一段。



  《搜查瑠公圳》是改編近70年前發生的命案，但故事情節卻極為當下。（圖／伯樂影業提

  供）


  奇特的是，儘管是將近70年前發生的事，但故事情節卻極為當下，與目前的時代氣氛有許

  多共振之處，令人充滿熟悉感。


  就案件本身來看，「瑠公圳分屍案」只是一起單純的情殺案，兇手與受害者是離婚夫妻，

  因無法接受前妻帶走小孩與別人共組家庭，憤而痛下殺手。


  但因為無法指認受害者身份，在一系列骨牌效應的互相影響下，無論是案件影響的層面、

  動員的調查規模、引發大眾的集體關注及媒體亂象來看，「瑠公圳分屍案」最終成為了今

  日回看，荒唐又現象級的大型社會事件。《搜查瑠公圳》現正上映中。





  --'
