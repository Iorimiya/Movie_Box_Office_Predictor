url: https://www.ptt.cc/bbs/movie/M.1749441757.A.6DA.html
title: 'Re: [無雷]搜查瑠公圳好看 '
content: '瑠公圳這這題材，緊湊可能不是最佳的表現方式。如果

  能改編成6-8集的影集好好鋪陳，可能效果會更好。


  在電影版中有幾個人物需要深度塑造：


  趙將軍父子、女記者、三爺、白上校、兇手。


  其次也需要有所型塑的人物是死者、主要報社同仁、主要警局同仁。


  人物有點多，109分鐘很難經營得起來，如果不是有所企圖，應該不必

  放這麼多主要角色進去。


  我想編導的企圖就是創造一個超越真實事件規模的故事吧，同時希望

  建立幾個角色可以延續到後面的故事裡出現。


  舉例而言，兇手的心理狀態源自於被國民黨拉伕的創傷，這是當年真實

  事件中沒有的橋段，必須給編導的創意鼓勵一下。但是這段情節如果要

  更有說服力，可能要弄一場兇手原本的唱戲生活，再一場大軍敗逃將他

  擄走的場面，這個就要花大錢了。


  也由於國民黨輸掉國共內戰，來到台灣之後陷入恐懼赤匪和力圖強化掌

  控社會的思維中，這是白上校這類角色得以恣意妄為的基礎。


  三爺這種墮落的黨政高層則是國民黨之所以會輸掉內戰的深層原因。


  其實編導的創意部分是環環相扣的，但這個真的很難用一部電影的長度來

  表現。


  至於真實事件本身的曲折離奇橋段，電影版也省略了不少，如果能有影集版

  的話，就有足夠空間來經營了。


  --'
