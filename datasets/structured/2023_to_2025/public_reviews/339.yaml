url: https://www.ptt.cc/bbs/movie/M.1748077654.A.7D9.html
title: '[好雷] 搜查瑠公圳：真實如何與改編交錯'
content: '好像是第一次看到這種比較認真辦案、不帶什麼搞笑成分的的台灣電影，整體的氛圍塑造

  、美術裝造都還不錯，演員的部分也選的蠻恰如其分的，也是可以理解在市場與預算的平

  衡下選擇Julia，雖然台詞略顯尷尬，一些劇情的安排為伏筆而伏筆，試圖首尾呼應、環

  環相扣，但整體有點坐過頭，但基本上瑕不掩瑜，推薦大家可以去戲院支持


  這次的改編基本上基於瑠公圳分屍案，但融合了一些李師科搶銀行案跟白色恐怖案件的影

  子。瑠公圳的部分算是80%依照事實，20%加了一些想像跟延伸了一些白色恐怖時期的氛圍

  及事件，可以看得出來劇組努力的在還原史事及創造戲劇性中取得平衡。


  比如瑠公圳分屍案中，確有三輪車伕向刑警大隊報案曾經載過一名男子身上帶著線索中的

  草蓆屍包，並以此確定犯案地點、案發後真兇也真的將證物丟入附近的少將家意圖栽贓、

  少將仕途也真的因為此案受影響，後最後退休改去賣冰（最後子午說跟媽媽去賣冰也呼應

  這段歷史）。而劇組以殺害多人及唱戲、從軍救援增加戲劇性，並給嫁禍一個理由（其實

  真實案件中嫁禍一般就真的是方便）


  李師科搶銀行案中的虛實交錯更加特別，當初警察以口音為由，因檢舉逮捕外型、口音皆

  相似的王迎先，王迎遭刑求後被迫認罪，在模擬犯案過程中跳河以明志，不幸身亡。劇組

  將口音作為這次案件破案的關鍵，以及讓將軍被檢舉、在模擬作案過程中下以死明志，頗

  有參考這段的意味在。


  我特別喜歡殺人的場景，片頭隱藏兇手的臉殺人場景很震撼、運鏡也很巧妙，片中揭露兇

  手的片段、以及片尾記者的想像交錯都做得很好。稍微覺得有點太多的是政治鬥爭這塊，

  好像可以處理得更簡單一些，但最後讓兇手跟將軍有私仇我認為是蠻好的安排，把誣陷為

  何可以這麼容易做個解釋


  演員MVP無疑是朱栢康，毫無瑕疵，可以讓人完全入戲。覺得也不錯的是李杏、張世（據

  傳真實事件中柳將軍的女兒驚呼彷彿看到父親），口音跟一些細節有點小可惜但瑕不掩瑜

  的是朱軒洋（老頭...）、姚淳燿（那個捲舌音），至於Julia就..長得好可愛^^


  --'
