title: '[請益] 不能流淚的悲傷 男女主角真的有兒子嗎？'
content: '大家晚安


  本日剛看完導演唐家輝執導的大陸電影《不能流淚的悲傷》


  有一個小問題想要請教大家  最後一幕……


  女主看到車窗上自己年老的面貌 想起原來鄰居大叔就是自己的戀人


  喚起記憶後男女主擁抱哭泣 這時候年輕的男主從副駕駛座出來


  老年男主與年輕男主 相視  互比了一個ok


  我想詢問這時的年輕男主是他們的兒子 還是女主記憶裡虛幻的男主？



  因為前面的劇情有畫面是男主女主結婚生子 兒子幫他們拍照全家福


  不過最後一幕我真的不知道這是幻想還是真實？


  如果最後一幕副駕駛座出來的是兒子  那駕駛座是誰？


  感覺不像兒子幫忙爸爸恢復媽媽的記憶


  想請教大家對這一幕的看法


  謝謝！



  --'
