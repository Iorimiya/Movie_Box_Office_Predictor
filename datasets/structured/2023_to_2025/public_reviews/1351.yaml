url: https://www.ptt.cc/bbs/movie/M.1495637679.A.08F.html
title: '[新聞] 坎城影展加持 韓電影惡女熱銷115國'
content: '（中央社記者姜遠珍首爾24日專電）南韓電影片商NEW今天表示，入圍第70屆法國坎城國

  際影展的南韓動作電影「惡女」，已預售至台灣、法國、德國、西班牙、義大利、澳洲以

  及菲律賓等115個國家和地區。


  南韓聯合新聞通訊社報導，負責「惡女」（TheVillainess）海外發行的Contents Panda

  公司表示，此片以女殺手和打鬥兩大題材獲得外國市場的關注，且娛樂性較高，因此不斷

  有外國發行商諮詢翻拍事宜。


  這部電影是以「我是殺人犯」和「我們是動作演員」等電影、在動作電影領域小有名氣的

  導演鄭秉吉新作，從製作階段開始就備受關注。


  電影「惡女」描述從小被訓練成殺手的「淑熙」（金玉彬飾）發現身世之謎後，展開復仇

  的故事。演技派演員申河均、盛駿、金瑞亨也參與了這部電影。


  據報導，在現實生活中擁有跆拳道及合氣道段位的女演員金玉彬的演出令人期待，電影「

  惡女」將於6月8日在南韓全國上映。


  新聞網址：


