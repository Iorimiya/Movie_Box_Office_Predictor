title: '[新聞] 《庫伊拉》真人版 艾瑪史東「惡女」造型'
content: '在今年上映的《阿拉丁》、《獅子王》創下好成績後，迪士尼接下來的真人版電影備受影

  迷期待，其中便包括由艾瑪史東（Emma Stone）主演的《庫伊拉》（Cruella），現在終

  於在迪士尼D23釋出首張劇照。


  照片中，艾瑪史東的頭髮一邊黑一邊白，誇張的紅唇、藍色眼影在白色臉龐下更為明顯，

  穿著皮衣而非原著中的毛皮大衣，牽著3隻大麥町犬，看起來頗有氣勢，也有些難搞刻薄

  的感覺，顛覆艾瑪史東一直以來的甜美形象。


  庫伊拉是動畫片《101忠狗》的反派，一心想抓到大麥町犬以製成狗皮大衣，本片之後還

  拍成真人版《101真狗》，相信是許多網友的童年回憶，當時飾演庫伊拉的演員為演技派

  女星葛倫克蘿絲（Glenn Close），至今仍深植人心。


  《庫伊拉》獨立電影囊括艾瑪史東、艾瑪湯普遜（Emma Thompson）、《老娘叫譚雅》保

  羅沃爾特豪澤爾（Paul Walter Hauser）、《靠譜歌王》喬爾弗（Joel Fry）等演員，由

  《老娘叫譚雅》Craig Gillespie執導。


  《庫伊拉》原訂於2020年的聖誕節檔期上映，前陣子宣布延遲到2021年5月28日上映。





  --'
