url: https://www.ptt.cc/bbs/movie/M.1497776302.A.AE0.html
title: '[普好雷] 動作戲很強的惡女'
content: '有雷
















  故事差不多就霹靂煞+追殺比爾

  女主選金玉彬，文戲普通，打鬥很拚，聽說幾乎都她自己上

  劇情有點弱，中間還跑出韓劇感情戲稍微出戲

  可能也是男二選得太奶油。算了不是重點

  因為作為爽片，動作戲非常強


  頭尾兩場超讚!


  開頭用第一人稱拍，用槍、刀、斧頭、雙刀、繩等一路殺

  有人問像超狂亨利嗎，欸，除了都第一人稱，動作編排比超狂亨利好看

  而且這種噱頭不需用整部。七分鐘夠了


  結局打鬥從室內打到室外，踩引擎蓋追車，狹窄巴士對砍

  女主角就是瘋了一樣打。發現打不贏BOSS，很爽快立馬把司機手砍了

  反正翻車大家一起死阿!!!


  作為爽片很合格，但結局意外超悲傷

  雖然女主角殺光仇人了，但什麼都沒有了

  丈夫孩子真愛仇人都死了。只剩下痛苦的她

  最後砍殺真愛兼仇人的大叔後，就整個壞掉了

  露出淒厲而空洞的扭曲笑容......





  --

  韓片現在真的不輸港片了'
