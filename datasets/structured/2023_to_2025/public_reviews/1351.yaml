url: https://www.ptt.cc/bbs/movie/M.1452261541.A.0A3.html
title: '[好雷] 惡女訂製服~就用高級訂製服決勝負吧!~ '
content: '<無音樂有圖好讀網誌版>




  訂製服的美麗真的是讓人難以拒絕，用其包裝的電影更是非常的有趣




  <無雷認真心得>





  高級訂製服與荒涼的小鎮這樣衝突的美感完整了整部電影，


  而用這有趣的反差與對比來包裝一個有點哀傷的故事，


  其實也做得蠻好的，個人很喜歡這部電影，


  不過應該會很多人覺得非常不合哩，


  但高級訂製服的華麗放在澳洲的荒野上本來就是不合理的事情呀!!!!


  所以就不要太計較一些細節，盡情享受那高級緞布展現出的華麗柔順感吧!


  這部電影中凱特溫絲蕾特的演出自然不在話下，雖然劇情有點莫名，


  但對我來說最值得一看的是那一套套美麗的服裝，


  還有費洛蒙滿到溢出來的連恩漢斯沃夫(認真)，


  而最後的結局覺得有點小小缺憾，但還是不錯，


  推薦給喜歡看美麗訂製服的各位!








  <有雷之我也想大改造心得>




  如果說在像是美國荒野中的場景，男人要決鬥是靠槍的話，


  那女人就用高級華麗的訂製服決勝負吧!


  女主角瑪朵緹莉鄧尼為了釐清當時的真相回到了在澳洲的家鄉鄧哥塔，


  不過不知道他是刻意遺忘還是年紀小根本不記得當初發生的事情，


  (個人覺得是刻意遺忘啦，畢竟男主角的弟弟巴尼都記得事情的經過，


  瑪朵自己會不記得?!)


  反正他回到了這個小鎮，


  而他帶來訂製服製作技巧也看似為這個小鎮上的女人得到了一些救贖與機會，


  像是葛楚改頭換面得到了威廉的愛，每個穿上他訂製服的女人都充滿著自信，


  我想這是訂製服本身就具備的魔力吧!


  雖然中間劇情有很多很莞爾的地方，但他一步一步的靠近了當時發生事情的真相，


  一個一個穿起訂製服的女人雖然多了自信，


  不過身上的訂製服彷彿只是為了遮掩他們內心的惡毒，


  他們有求於緹莉但其實心中是瞧不起緹莉，認定他就是個殺人犯，


  其實緹莉當時只是個無辜的孩子，因為沒有父親所以遭受霸凌，


  施暴者卻是為了用頭撞緹莉，但緹莉閃開然後自己撞牆而死(超蠢)，


  查明了真相，又得到了泰迪這位在這個小鎮裡有點帥過頭的愛人，


  本當應該很幸福，但泰迪因為自己的愚蠢而害死自己，


  讓緹莉更加相信他是被詛咒的人，此時緹莉的媽媽總算清醒了，


  為了女兒要挺身而出，決定用服裝一決勝負，可惜這中間他中風過世，


  (其實緹莉是真的被詛咒了吧?!)


  而緹莉了解了母親的想法，幫隔壁鎮做了一套服裝，讓這套服裝贏了鄧哥塔，


  (但我個人認為那套日本服裝好像並沒有像一開場那些衣服令人驚艷)


  緹莉以華麗之姿離開了鄧哥塔，也放了一把火燒了這個小鎮，


  得到了他所謂的勝利也釋放了他被困在過去的靈魂，


  這樣華麗的結局我很喜歡!!!!! (我也好愛他最後一套衣服!!!!)





  其實整部電影出現的服裝都好美好喜歡!!!!


  不管是誇張的還是緹莉身上穿較日常的衣服，我都好喜歡!!!!


  雖然已經是40歲的凱特，他全身散發出來的霸氣與氣質，


  真的是有皺紋又怎樣，好想成為這樣的女性呀!!!!!


  而整部電影中凱特與連恩漢斯沃夫的對手戲都讓人有戀愛的感覺，


  我只能說連恩漢斯沃夫你以後就留這樣的大鬍子好不好!!!!!


  這臉大鬍子讓你看起來根本費洛蒙爆表!!!!!!


  我才能好好的看著你那深情又湛藍的雙眼呀!!!!!!(你誰)


  身材什麼的!!!只是補助呀!!!!(屁)


  而雨果威明你真是太讓我驚喜，為何你演出熱愛時尚的警官會那麼適合!!!!


  好三八好喜歡怎麼會這樣!!!!!!


  總之我好喜歡這樣神經病又有強大反差的劇情跟他美麗的服裝還有優秀的演員，


  這部很值得一看呀!!!!!!


  以上~謝謝各位看完!


  --'
