url: https://www.ptt.cc/bbs/movie/M.1698513150.A.5DF.html
title: '[好無雷] "惡女"  有點意思'
content: '此篇絕對無雷 也絕對不是甚麼國片工讀生


  有幸觀賞到10/28京站威秀的導演場


  邵雨薇本人蠻美的，提到為戲減重到3X公斤，就為了女主的偏執


  導演是個可愛的女生，也很有想法，希望未來能看到多一點作品


  至於本片是導演參考日本某個社會新聞，所發想出來的劇情


  電影本身就類似那種大方向你都能猜到的互婊情節


  但你就是會把全片看完，並且看完之後會覺得 ~


  欸~還不錯~~!!


  最讓我意外的是演員的口條與台詞都沒有任何的違和跟尷尬


  林美秀 李天柱那種戲精完全不用擔心


  邵雨薇 曾少宗 還有我喜歡的鳳小岳


  甚至連那些素人演員，都演的很有水準(不敢說多好，但就是覺得很不錯)


  值得一提的大概就是邵雨薇表情，在某些動作畫面很有戲XD


  為了林襄去看的會失望，幾乎沒戲份


  最後個人覺得這片還是值得一看，起碼看完不會覺得浪費錢~~ 推薦一下


  主題曲 惡行 很好聽


  PS: 沒有血腥畫面，怕的人不用擔心


  --'
