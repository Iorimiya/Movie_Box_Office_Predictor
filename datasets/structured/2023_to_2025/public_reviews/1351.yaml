title: '[好雷] 惡女訂製服 (The Dressmaker, 2015)'
content: '在下女的誘惑之後我很久沒有這麼想要按鈕轉身給一部電影滿分了。


  又復古又假掰又風格化的表演完全對我胃口，但撇開增添不少觀影樂趣的台詞之外，主線

  的劇情（啊這便當是Sara Lynn之後讓我最傻眼的一個）、背後的深意、角色的設定和彼

  此的火花也完全沒讓人失望。凱特溫絲蕾和茱蒂戴維斯的每場對戲都精彩萬分。


  女主角緹莉在長大後成為一個品味好的服裝設計師，回到了成長的小鎮。

  然而，她心裡卻還是那個問著「為什麼他們要這樣對我？」，被霸凌、還被指控謀殺，帶

  著創傷被趕出小鎮的小女孩。

  她本來可以帶著才華去更好的地方發展，卻選擇了回到這個小鎮，表面上是復仇，但其實

  是找出當時的真相，告訴自己她並不是詛咒，然後，試著與自己和解。

  然而，事與願違。不願和解的並不是她自己，而是始終保持偏見的村民。

  一如她母親茉莉在悲劇過後跑去雜貨店和那群衣冠禽獸嗆聲的一樣，這些村民才是真正的

  詛咒，而這一切總該有人要出來停止—

  不計任何代價。

  雖然緹莉已經失去太多了。


  警長的角色特別吸睛，從開口第一句台詞就讓人笑出來，揭露了他的真面目，之後的成長

  也一直扣著這樣的性格發展。

  在這個世界裡想成為自己居然是如此困難，想變得美麗居然會是不被允許的事情，只因為

  他是個男人。警長在一個保守的小鎮裡一直壓抑著想穿華服的慾望，直到退場時才終於一

  圓夙願。

  他穿上了最喜歡的衣服、扛下了別人的罪名、承認自己就是個變態，大方謝幕。

  他跟緹莉說，對不起，當年沒能保護你。謝謝妳用這些迷人的衣服豐富我的生活。

  那一幕，他的善良和告解遠比他身上的衣服還要耀眼。


  美麗的衣服誰不喜歡呢？

  然而，相形之下，即使穿著高級訂製服也掩蓋不了村民的歧視與醜惡。

  幸好，緹莉不用再受制於他們，放完這一把火之後，她還是可以繼續創作出更美麗的衣服

  。

  這大概就是關於藝術，最好的地方吧。


  總之是超級迷人的一部電影。

  誠摯推薦給帶著創傷成長的孩子們，噢，也許還有護家盟。


  --


  鋪紅地毯深得我心，ㄎㄧㄤ死了。'
