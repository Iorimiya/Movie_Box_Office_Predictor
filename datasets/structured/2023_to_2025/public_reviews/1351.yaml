url: https://www.ptt.cc/bbs/movie/M.1515397992.A.7CF.html
title: '[討論] 凱特布蘭琪，不適合演惡女角色？'
content: '我對凱特布蘭琪的印象一直停留在魔戒哈比人6部曲的精靈女王，還有2部伊麗莎白女王。


  近期看了兩部凱特演的惡女角色


  覺得對她的演技感到失望，覺得她沒辦法詮釋惡女的角色，就是那種刻意演惡女卻不夠到味

  的感覺。


  一部是灰姑娘的後母


  一部是雷神3的希拉冥后


  凱特不蘭琪這兩個惡女角色，給我的感覺是


  華麗扮裝造型>>>>>>演技發揮


  灰姑娘的後母，跟動畫做比較，就是刻薄狠毒陰險都不夠徹底，演技也不自然，反而讓華麗

  服裝搶戲


  雷神3冥后


  覺得她演得很刻意，也可能缺乏她內心戲的近鏡頭，總之看到她在電影叫囂很出戲，他要軍

  隊效忠她的演講，也完全失去女王氣勢，好像就只是對白念很大聲而已


  總覺得，


  凱特布蘭琪還是演劇情片或聖女角色比較適合，她演這種商業片惡女角色，覺得怪怪的。


  --'
