title: '[好雷] 時尚惡女庫伊拉'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  女主角艾絲黛拉從小是個有自己想法的小孩

  因為屢屢在校園搗蛋，被校長開除

  她媽媽為了讓她能有地方念書，帶著她到城堡內找男爵夫人

  艾絲黛拉因闖入會場，被三隻忠狗追著跑，一路跑到了會場外的花圃

  結果卻意外目睹了忠狗把她母親推下懸涯的畫面

  這她一直以為是自己害死母親而內疚不已


  失去母親的艾絲黛拉一路流浪到倫敦，並在此遇上兩位好友

  靠著偷竊的技巧，也在倫敦混到成人

  而好友也在她生日那天幫她找到了在百貨公司當清潔工的工作

  並在一次喝醉擅自更改櫥窗的衣服樣式後受到男爵夫人的青睞

  並提拔他進入設計部


  本來以為一切會這樣順風順水

  結果卻意外讓他發現男爵夫人其實正是殺害自己母親的兇手

  這讓他整個人發生了變化，一邊繼續假裝是小員工

  另外一方面卻以「庫伊拉」的身份一次又一次的掀起對抗


  她整個大反派起來一邊裝著小員工

  一邊卻以庫伊拉的角色一次又一次的對抗



  看到這邊時真的挺興奮的

  艾瑪史東把女主在兩個情緒角色中演得非常的好

  小員工時的隱忍、庫伊拉的瘋狂和反派，還有對男爵夫人恨之入骨的情緒

  由此衍生的各種脫序行為，讓他與兩位好友漸行漸遠，甚至差點被燒死


  但後來揭曉男爵夫人其實是艾絲黛拉生母的時候其實是讓我稍微覺得可惜的

  感覺又沒有那麼意外。不果整體的結局我還是喜歡的就是了

  總結來說，這仍然是一部不錯的佳作，推薦有興趣的人可以撥空看看。


  --

  很期待第二集'
