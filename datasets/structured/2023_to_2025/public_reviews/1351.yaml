title: '[好雷] 時尚惡女庫依拉'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  覺得真的蠻好看的！

  這部片因為疫情沒在台灣上映，

  買了Disney+之後在家補完。

  本來只是想打發時間


  但是美術、劇情其實都很不錯。


  我覺得有屌打其他一些很奇怪的時尚片。


  中間一直很怕她會殺狗。

  但是庫依拉最後的結局我其實蠻開心的，

  我蠻喜歡艾瑪史東版本的詮釋。

  包括兩個小跟班都有解釋跟庫依拉的感情。

  裡面各種時尚秀，還有庫依拉跟死對頭的對決都很豪華撒錢。

  看了很爽快！

  是今年不容錯過的好片。


  在國外評分也是迪士尼所有真人版最高分

  我自己給它的評分也是，

  覺得小贏阿拉丁。

  大贏...Disney+看的另一部尚氣。


  --

  垃圾車那段真的很讚！超有創意！整部不期不待反而覺得蠻驚喜的'
