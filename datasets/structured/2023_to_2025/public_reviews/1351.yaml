url: https://www.ptt.cc/bbs/movie/M.1499789290.A.4DC.html
title: '[微好雷]惡女 刺激，劇情有深度 '
content: "電影一開始就帶給我很大的震撼，一場開無雙的大亂鬥揭開序幕\n\n罕見地使用第一人稱視角運鏡，非常有臨場感。(很像射擊遊戲XD)\n\n大亂鬥的末段，運鏡漸漸改為近身運鏡，讓我的眼睛稍微有喘息的機會。\n\
  \n\n故事用幾個不同的時間軸去描寫一個平凡少女為了復仇成為殺手的故事。\n\n女主角並不具有什麼殺人天賦，僅僅只是為了生存而殺人。\n\n很多時候，當她卸下心防就能看見柔弱女性的一面。\n\
  \n故事尾聲，女主角得知各種真相後，虐心啊...\n\n\n整部電影，劇情燒腦又很緊奏，2小時絕無冷場。\n\n不論是打鬥、槍戰的畫面呈現都非常寫實、刺激。\n\
  \n各種噴血、爆漿、衝撞..等血腥場面(不喜歡這類畫面，建議評估是否觀看)\n\n\n\n--\n        各種美食照，看起來好好吃\n        \n\
  \        作品分享，各種妹子照\n        \n\n--"
