title: '[新聞]《對面惡女看過來》三部續集全曝光！劇情'
content: '《對面惡女看過來》導演宣告一次籌拍三部續集、片名全曝光！劇情將向希斯萊傑致敬





  1999 年捧紅茱麗葉史提爾絲（Julia Stiles）、希斯萊傑（Heath Ledger）的校園愛情

  喜劇《對面惡女看過來》（10 Things I Hate About You）至今仍是影迷不斷回頭重溫的

  經典，然而該片已上映 26 年，萊傑也已過世 17 年，多數觀眾都不會指望這部電影還會

  再續攤，但導演-吉爾榮格（Gil Junger）今天突然向《時人》（People）雜誌透露了他

  的「續集三部曲」計劃。




  榮格表示，他目前正在和首集製片人安德魯拉札（Andrew Lazar）、新銳編劇-娜亞艾兒

  詹姆絲（Naya Elle James）合作籌拍三部續作，這三部按照順序分別是取名為：第二集

  《10 Things I Hate About Dating》、第三集《10 Things I Hate About Marriage》、

  第四集《10 Things I Hate About Kids》。雖然片廠尚未點頭准許開拍，但榮格很確定

  至少第二集絕對會實現。




  改編自《馴悍記》（The Taming of the Shrew）的《對面惡女看過來》雖然還沒拍過續

  集，但在 2009 年曾被改編成電視情境喜劇（但只播一季就遭腰斬），上個月還宣佈要推

  出百老匯音樂劇版。雖然萊傑是不可能在回歸演出，但榮格很樂意召回其他包括史提爾絲

  在內的原班人馬齊聚，至於萊傑，榮格也很想在電影裡安排向他致敬的橋段，「他值得被

  愛。」榮格說道。




  --'
