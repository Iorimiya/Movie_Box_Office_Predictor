url: https://www.ptt.cc/bbs/movie/M.1498838150.A.FD2.html
title: '[新聞] 惡女榮獲紐約亞洲影展最佳動作片獎'
content: '（中央社記者姜遠珍首爾30日專電）南韓電影製作兼發行商NEW今天表示，由女演員金玉

  彬主演韓片「惡女」榮獲第16屆紐約亞洲影展「最佳動作片獎」，同時還被遴選為影展閉

  幕片。


  南韓「亞洲經濟」今天指出，本屆紐約亞洲影展節目組執行總監傑米爾（Samuel Jamier

  ）評價，「惡女」（The Villainess）創造出復仇驚險片和動作片的新模式，在近期亮相

  的南韓動作片中最為突出。


  「惡女」還入圍將於10月舉行的第50屆西班牙錫切斯國際奇幻電影節的競爭單元，入選7

  月13日舉行的第21屆加拿大奇幻電影節的開幕片。


  奇幻電影節亞洲節目組總監對選擇「惡女」為開幕片的理由表示，演員金玉彬的精湛演技

  、令人聯想到韓片「老男孩」的導演鄭秉吉的執導技巧，以及迭宕的故事情節等，多個元

  素融為一體的「惡女」，是今年電影最津津有味和吸睛的一部作品。


  電影「惡女」講述從小被培養成殺手「淑熙」（金玉彬飾）的迭宕人生和報仇之旅。演技

  派演員申河均、盛駿、金瑞亨也參與這部電影。


  女演員金玉彬曾以電影「惡女」走過今年法國坎城影展的紅地毯，2009年曾以電影「蝙蝠

  」首度在坎城影展亮相。


  新聞網址：


  --'
