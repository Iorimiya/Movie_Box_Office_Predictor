title: '[好雷]《時尚惡女庫伊拉》正視本性的貪婪與瘋狂'
content: '《時尚惡女：庫伊拉》正視本性的貪婪與瘋狂


  圖文好讀：



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  從《黑魔女》之後，迪士尼的真人畫作品還沒有一部能讓我感到精彩又痛快，那些美好的

  童話故事，即便翻拍後，仍然帶有過多的美好色彩，總令我感到有點不構真實。


  但《時尚惡女：庫伊拉》真的是一步非典型的迪士尼作品，他是一部集合《穿著prada的

  惡魔》、《猛禽小隊：小丑女大解放》與許多諜報經典作品的集合體，在《時尚惡女：庫

  伊拉》中，你不僅能看到出色的時尚元素，甚至能在電影中感受到濃厚的龐克風格以及老

  倫敦的守舊與創新衝擊，他沒有將庫伊拉的瘋狂美化，而是給了他一個瘋狂的理由與本源

  ，讓庫伊拉的瘋狂與才華相互交映，放大了角色那令人著迷的特點。


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  【《時尚惡女：庫伊拉》中的艾瑪史東】


  艾瑪史東在電影中可說是將庫伊拉的瘋狂行動表現的張力十足，並將這個本來與社會格格

  不入的角色，賦予了獨特的生存定義。


  庫伊拉的不同，在於他人是為世界轉動，而世界，為庫伊拉轉動。


  從小時候成為孤兒，到從廁所女工闖入時尚圈，再到揭露自己的真實身世，以獨特的搖滾

  與創新靈魂，用現代化的龐克風格和大膽的配色去征服世界，艾瑪史東讓庫伊拉這個角色

  顯得瘋的合理，又獨一無二。


  無論是那讓整張臉的表情都特別具有說服力的煙燻妝，又或是那看似優雅，實則挑性意味

  十足的動作及言語，都讓人難以將目光從他身上移開。


  她並非善良、她一點也不純樸、她會奪得她應得的、更會掠奪她想要的！


  她，是庫伊拉。





  【《時尚惡女：庫伊拉》為何獨特？】


  《時尚惡女：庫伊拉》的時間點設定在1970年的英國倫敦，當時的倫敦處於石油危機與勞

  工革命中，當代的年經人眼中充斥著焦慮、憤怒與絕望，上一代的掌權者與權貴階級的餘

  毒還沒清除，年輕人每天活在灰色，毫無未來的大笨鐘下。


  在那個年代，流行主體正處於一種青黃不接的階段，而電影中艾瑪·湯普遜所飾演的男爵

  夫人，她的設計前衛，大膽，但也難以脫離60年代的摩登與龐克感！而艾瑪史東飾演的庫

  伊拉的風格則是更加狂放不羈，她丟去了典雅的服飾與貴族氣息十足的髮型，頂著誇張又

  吸人眼球的黑白兩色混搭的爆炸造型，穿著皮衣，網襪或是搭配面罩，頂著震耳欲聾的龐

  克搖滾，卯釘與金屬配件就如同她本人一樣強悍叛逆，這樣的流行衝擊，讓庫伊拉的時尚

  風格成為改變灰暗倫敦的一道時尚破壞炮，可以說在庫伊拉中，最吸引我的往往不是那有

  些老套的公式劇情，而是期待在下一個畫面中，庫伊拉能呈現怎麼樣的視覺震撼與爆破美

  學。




  【《時尚惡女：庫伊拉》值得一看嗎？】


  《時尚惡女：庫伊拉》放大了壞女孩的任性與叛逆，我不會用單純的好或壞來評斷這個角

  色，我認為這部電影突現了庫伊拉的純粹。


  純粹的叛逆、純粹的混亂與突破，以及純粹對於時尚的追！


  電影中讓庫伊拉與男爵夫人從相知相惜，到相愛相殺，其中的糾葛雖然不難推測，但仍是

  給庫伊拉的瘋狂與才華找到了根源。


  我很喜歡這部電影，即便這部電影實際上在劇情架構中有非常大的問題，包括容易被庫伊

  拉操控的每個人，以及除了庫伊拉與男爵夫人外的角色定位，當然還有哪隻可愛到幾乎只

  剩下賣萌功能的小狗，但我仍喜歡這部作品。


  對我來說，她的表現比《黑魔女》更加出色，也勝過過去所任何一部迪士尼翻拍的真人版

  作品，她就像是迪士尼中的叛逆分子，令人又愛又恨，以凡人之軀，炸出了如同魔法的時

  尚震撼彈。她甚至給了庫伊拉追求大麥町的出色詮釋！




  《時尚惡女：庫伊拉》8月17日起將登錄myVideo平台，有興趣的朋友我認為真的可以去看

  一看，透過這部片，我彷彿又愛上了艾瑪史東，拜託大家不要跟我搶。


  --'
