title: '[新聞] 邵雨薇床戲外加碼情欲自我安慰，《惡女》'
content: '防雷資訊頁


  防雷資訊頁


  防雷資訊頁








  防雷資訊頁


  防雷資訊頁


  防雷資訊頁







  新聞網址：


  邵雨薇床戲外加碼情欲自我安慰　《惡女》釋出思考「靠男人賺錢有甚麼不對」


  鏡新聞　2023.10.18 13:49


  記者　娛樂組


  電影《惡女》的關鍵場景，都圍繞著「性」。（Catchplay提供）


  「婊裡不一」的懸疑驚悚電影《惡女》今（18日）舉辦試片，邵雨薇有突破尺度的演出、

  林美秀從有未展現過的笑中藏刀演技，在幕後花絮惡女篇中，飾演蛇蠍女秀蘭的林美秀對

  邵雨薇飾演的主播立美說：「小美，對某些男人來說，性是很重要的…」暗示著電影的關

  鍵都將圍繞著「性」。邵雨薇表示，一開始接觸這個劇本的時候，沒有辦法馬上理解秀蘭

  「靠男人賺錢養活自己」的邏輯，但是在深入了解秀蘭的背景之後，就慢慢能理解她的想

  法了。而導演宋欣穎則說：「女性靠性賺取金錢，到底有哪裡不對？」除了這樣的兩性價

  值觀，在電影視覺上更是突破女主角邵雨薇的極限，除了與檢察官鳳小岳的激情床戲，更

  有自我安慰的情欲戲。


  除了床戲橋段，邵雨薇更在拍攝期間主動向導演提出加戲的要求，導演宋欣穎說：「那一

  場雨薇主動加的戲，是主播立美面對性愛，從嚴肅拘謹到激情放縱的關鍵轉折！」立美的

  蛻變，究竟是坦然面對自己對性也有渴望，還是吸收了秀蘭的觀念，利用「性」來達到她

  想要的目的？《惡女》可能刷新觀眾的道德底線，思考，到底「性」是手段？還是目的？


  電影《惡女》主播立美（邵雨薇飾）是媒體界的紅人，正忙於籌備與交往多年的男友大為

  （曾少宗飾）的婚禮，準備迎接幸福人生。然而，某天立美得知父親（李天柱飾）打算再

  婚，對象竟然是一位身世神祕的女人秀蘭（林美秀飾）。就在婚禮前夕，秀蘭突然成為謀

  殺嫌疑犯登上新聞頭條，而她的前男友們竟然都選擇了自殺，並在臨死前向秀蘭匯了巨款

  。為了保護父親，立美不惜代價避免媒體報導秀蘭與父親的關係，同時也與檢察官國倫（

  鳳小岳飾）展開調查。


  電影《惡女》將於10月27日上映。


  --'
