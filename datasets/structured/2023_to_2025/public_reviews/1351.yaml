url: https://www.ptt.cc/bbs/movie/M.1435504447.A.C32.html
title: '[普雷]《惡女夜遊》，女孩壞壞。 '
content: '部落格版：


  《惡女夜遊》將女性與男性地位翻轉徹底，女性不再是從前在夜店狂歡時，被動且矜持的等待被男性搭訕的角色，而是主動出擊尋找獵物的獵人。


  而本片用著更為暴力、血腥的畫面呈現女性在性愛歡愉上的強勢、訕笑以及無所畏懼。四個女孩讓男子誤以為獵物主動送上門，以言語、肢體調戲她們，殊不知自己才是被鎖定的獵物，可憐的男子被打昏帶回有錢女孩的家中，接著開始一連串的虐殺行為。



  絕大部分我們所認知曉的，幾乎都是男性侵犯女性居多，面對她們，總是展現自身獸性的一面，但當角色易位之後呢？


  透過劇情進行，我們看見四位女孩是如何對待著被綁著的男子，調戲他、強迫他赤裸著身子、餵他吃壯陽藥、羞辱著他的驕傲等等，讓男性以往的高高在上，狠狠的踩在腳邊嘲笑，接著從原本的言語羞辱，轉變成更激烈的手段，血淋淋的將其乳頭割下玩弄、甚至將獎座插進男子肛門，但女孩們的態度依舊瘋狂、同樣的輕鬆無所謂，導演讓我們看見女性更為暴力瘋狂的一個面向。


  最後將男子載至荒野任他奔跑，最後輪流用槍將其射殺，就像玩弄著一個不要的玩具一般，當一切結束，女孩們就像日常生活一樣，說著肚子餓、要吃些什麼...



  其實《惡女夜遊》是給我滿大震撼的，可惜鏡頭常常在一個場景定格很久， 有點單調無趣，不過更有問題的是，我覺得劇情部分稍嫌空洞，這樣的片長在看完電影之後，只會讓人覺得這部電影像是為了讓觀眾明白女性黑暗面而已，為了拍而拍，除了這點，沒有其他橋段輔佐，多少會覺得不是那麼的精彩。


  但還是很佩服導演能夠想出這樣讓男性害怕的電影。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
