title: '[情報] 《時尚惡女：庫伊拉》正式預告、海報'
content: '迪士尼《時尚惡女：庫伊拉》

  2021.5.28 華麗登場


  ★正式海報：




  ★正式預告：



  ★60秒精彩片段搶先看：





  # 迪士尼經典時尚大反派「庫伊拉」崛起故事 真人版搬上大銀幕


  # 奧斯卡兩大影后 艾瑪史東與艾瑪湯普遜同台飆戲


  #《瘋狂麥斯：憤怒道》兩屆金獎造型得主 傾力打造英倫龐克搖滾時尚風


  #《愛‧滿人間》、《玩命再劫》製作團隊強力聯手監製打造


  ▲導演: 《老娘叫譚雅》導演 克雷格格里斯佩


  ▲演員：


  《樂來越愛你》金獎影后　艾瑪史東

  金獎影后　艾瑪湯普遜

  《金牌特務》　馬克史壯

  《靠譜歌王》喬爾弗萊

  《李察朱威爾事件》保羅華特豪澤



  故事設定在1970年代倫敦正值龐克搖滾的革命時期，一位名叫艾絲黛拉的年輕惡女，想憑

  著她的才智在時尚界闖出自己的名號，她結識了兩位與她臭味相投的竊賊，以各種伎倆讓

  他們得以在倫敦風生水起；直到有天，艾絲黛拉的時尚才氣被時尚界天后－馮赫爾曼男爵

  夫人相中（金獎影后艾瑪湯普遜飾），兩人從相知相惜演變到反目成仇，更讓艾絲黛拉的

  黑暗面逐漸展露，成為了人見人怕的時尚惡女－庫依拉！



  --'
