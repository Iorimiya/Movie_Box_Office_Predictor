title: '[普雷] 時尚惡女:庫伊拉 冗長的時裝秀'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  時尚惡女:庫伊拉是很典型的迪士尼電影

  所有的角色幾乎都刻板到不行

  好像直接從卡通裡拿出來的

  期待庫伊拉黑化的要失望了

  甚至連狗狗的部分都有理由凹過去

  這是闔家觀賞的電影

  而且還很八點檔

  故事格局非常小

  拖到2個小時真的不簡單

  應該剪掉多一點東西

  比較好的部分是服裝設計

  艾瑪史東跟艾瑪湯普森演技沒話說

  可以接受這些的話可以看看


  --'
