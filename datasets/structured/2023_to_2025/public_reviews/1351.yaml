url: https://www.ptt.cc/bbs/movie/M.1707766153.A.15D.html
title: 'Re: [請益] netflix 惡女的幾個問題 (好看有雷)'
content: '今天有空來看了一下，

  老實說題材微妙，

  分不清主軸是惡女還是司法不公，

  或是暗諷政治黑暗，

  但以我對台灣導演的認知，

  九成是，

  全都要。


  整體太多線沒有收起來，

  以及台灣導演一貫拍太多不剪掉的問題，

  扣分不少。


  但這部主線有收起來，

  還是贏了不少台灣電影，

  屬於如果沒事做，

  可以放著看。



  女主就是現在很常見的事業為重，

  自己為主的獨立女性，

  跟重不重視女權沒關係，

  就是愛自己，

  這才是正確的觀念。


  她回收的原因就兩個，

  1. 錢

  2. 演戲


  後者很好懂，

  前者是暗示，

  在女主留職的日子裡，

  未婚夫還是提供了60萬讓她去上課，

  房子也是未婚夫父母提供頭期款，

  她們還要付貸款。


  這點其實是呼應了美秀的生涯，

  惡女就是自己有自己的生活，

  但還是吸取男人的生命。


  殺魚那段就是餐飲課的時候，

  同學說的，

  「有時候真的很想殺了那些男人。」


  這段同時在暗示，

  美秀雖然釋放，

  但不代表她真的無辜，

  因為前面一直在提，

  她拿到錢了，

  為什麼還要殺人？

  「因為為他們做牛做馬那麼久，

  有時候真的很想殺了那些男人。」


  惡女提供男性想要的溫柔跟性，

  願意為他們煮飯照顧生活，

  然後男性提供惡女要的東西。



  認真說應該是自殺，

  但不能說跟她沒關係，

  因為如果男人暈船到不行，

  她只要刺激下去，

  強硬的分手，

  男人自殺的機率也不低，

  但也因此美秀在法律上無辜。



  你是不是跳過一段了？

  女主在檢察官的電腦找到的資料證明，

  美秀真的有不在場證明，

  但他掩蓋了這個事實，

  然後總統府幕僚又直接指示，

  要檢察官找女主爸爸，

  先承認他們結婚了，

  引導女主拍那個指控影片，

  因此害女主父親自殺。



  是，

  但或許可以想成，

  每一個男人她都真心愛過，

  只是最後分手了，

  劇中有一任就有提到，

  他去報警的原因是美秀提分手。




  這段其實是呼應美秀說的，

  性也很重要，

  女主角一開始跟未婚夫的問題，

  就是打炮的時候太僵硬，

  看起來十分抗拒，

  又穿運動內衣，

  未婚夫才失去性致。

  （不過這點看人性癖）



  而女主後來對檢察官暈船，

  以對方作為性幻想的對象，

  放鬆了自己，

  也放開了限制，

  所以才想到了身邊唯一的性感成套內衣，

  然後塗強烈色調的指甲油，

  這段其實暗示的是，

  女主蛻變成了惡女。

  （如果有仔細看，

  女主一開始的指甲油很低調，

  偏粉色系。）


  -----

  Sent from JPTT on my Google Pixel 7 Pro.


  --'
