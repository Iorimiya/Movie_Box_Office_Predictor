url: https://www.ptt.cc/bbs/movie/M.1493734609.A.74F.html
title: '[新聞] 韓片惡女入圍坎城影展非競賽單元'
content: '（中央社記者姜遠珍首爾2日專電）南韓電影發行公司NEW消息人士透露，南韓動作片「惡

  女」入圍第70屆法國坎城國際影展非競賽單元「午夜放映」。金玉彬、盛駿等演員將出席

  影展紅地毯儀式等活動。


  南韓聯合新聞通訊社報導，女演員金玉彬曾於2009年憑藉朴贊郁執導的「蝙蝠」出席坎城

  影展，這將是她第2次在坎城亮相。


  金玉彬表示，「惡女」是一部動作片，拍攝過程十分艱難，很高興個人的努力換來回報。


  據報導，「惡女」由「我是殺人犯」導演鄭秉吉執導，金玉彬、申河均聯袂主演，講述被

  培養成頂級殺手的淑姬（金玉彬飾）復仇的故事。申河均因在拍攝新片的過程中腿部受傷

  ，將缺席坎城影展。


  「惡女」在坎城亮相後，預計6月初在南韓全國上映。


  新聞網址：


