  小妹想請問關於大麻蛋糕這個橋段


  有點看不太懂


  莫莉是故意放超量大麻的嗎？


  為的讓她的老朋友更好過？


  或是為了送老朋友上路，讓她不再痛苦？


  亦或是為了間接害死藥劑師？


