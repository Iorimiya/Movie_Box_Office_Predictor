title: '[情報] 《時尚惡女：庫伊拉》台灣上映檔期取消 '
content: '原訂將於 6 月初在台上映的迪士尼反派角色改編真人電影《時尚惡女：庫伊拉》，日前

  宣布因應中央流行疫情指揮中心防疫警戒公告將延期上映。而在今（24）日，官方則是正

  式宣布將取消上映檔期的消息。


  　　出自《101 忠狗》的反派角色，《時尚惡女：庫伊拉》故事設定在 1970 年代倫敦正

  值龐克搖滾的革命時期，一位名叫艾絲黛拉（艾瑪史東飾）的年輕惡女，想憑著她的才智

  在時尚界闖出自己的名號，她結識了兩位與她臭味相投的竊賊，以各種伎倆讓他們得以在

  倫敦風生水起；直到有天，艾絲黛拉的時尚才氣被時尚界天后－馮赫爾曼男爵夫人相中（

  艾瑪湯普遜飾），兩人從相知相惜演變到反目成仇，更讓艾絲黛拉的黑暗面逐漸展露，成

  為了人見人怕的時尚惡女－庫伊拉。




  --'
