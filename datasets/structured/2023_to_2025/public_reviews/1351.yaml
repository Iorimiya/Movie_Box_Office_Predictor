content: "#惡女訂製服 ker 2016/1/8\nIMDB:7.5/10\n\n前陣子重溫了凱特溫絲蕾和金凱瑞主演的王牌冤家，這次衝著凱特溫絲蕾獻給自己從影20\n\
  年的禮物,來看了the dressmaker。\n  故事以一句「我回來了，你們這些混蛋們。」做為這部片的開場，劇情主要描述五○年\n代巴黎時尚界闖出名堂的服裝設計師緹莉，毅然決然地帶著縫紉機回到澳洲小鎮。除了要\n\
  照料疑似失智、藉酒裝瘋的老母，她也決心調查出當年被遣送出境的真正原因。然而，人\n云亦云的小鎮愚民，面對緹莉的回鄉猶如驚弓之鳥，又愛又懼。女人們因她的巧手而脫胎\n\
  換骨、飛上枝頭；男人們則貪戀著她的美色。\n   整部片在我看來是想要傳達，人性的醜惡，是即使你的衣著再華美也無法掩蓋的。也\n就可以理解為何片名為the dressmaker。凱特溫絲蕾將緹莉這個角色詮釋得很好，美中不\n\
  足的是劇本想要傳達的東西很多，導致很多地方不夠細膩。最令我感受深刻的是威廉與緹\n莉在穀倉上調情，威廉為了證明緹莉不是詛咒與他對她真誠的愛，跳下穀倉摔死了。我想\n\
  這段想要告訴觀眾的是，再真誠的愛，在人心的醜惡面前也變得一文不值。\n  在片子的結尾，緹莉放火燒了整個村莊，突然的讓人有點措手不及，但這個結尾也不是\n不能理解，或許那些無法改變的事物，最終只能讓視而不見成為解決的辦法。\n\
  來源：\n8%\n\n\n--"
