url: https://www.ptt.cc/bbs/movie/M.1699189004.A.84B.html
title: '[好雷] 對於「惡女」的定義'
content: '衝著雨薇在上映前就打定主意去看了

  一方面也是支持一下國片

  本文不會有太多雷

  可以放心服用

  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  先說結論

  這是一部很不賴的電影

  小弟不是專業影評,單純就是喜歡電影然後分享一下

  更不用說邵雨薇是我最喜歡的台灣藝人之一(另一個是曉涵)

  邵雨薇在電影的每個扮相都很美

  甚至包括在鳳小岳面前裝柔弱頭髮炸亂的那一幕都很可愛

  喜歡她的人真的可以去支持一下


  另外想討論的點是

  對惡女的定義?

  劇中黃立美黑化很顯然就是惡女的表徵了

  因為她用實際行動去殺害人命

  但美秀姐從頭到尾(至少在劇中我們肉眼可及的部分)都沒有做過壞事


  舉個例子(可能角度不盡相同)

  A同學希望在我面前維持良好的形象

  但是在A同學對我以外的人都是第二人格

  所以大家就會跟我說A很假之類的

  但自始至終,A同學對我都是一樣的態度

  也從沒有背刺過我

  這樣A對我而言就算對別人再惡劣應該也不是壞人?

  劇中從頭carry到尾的美秀姐就完美演繹了我要的這種感覺

  (關於美秀姐的超強演技我就不再多贅述了)

  所以剛好想趁這部戲上映

  和大家探討一下

  就算事事如她所願

  但她從頭到尾做的都是所謂的好事

  「這樣秀蘭真的是惡女嗎」

  剛好探討的問題也是我很有興趣的話題(我沒做,只有想,最後如我所願?)

  所以想趁這次電影上映來請教一下看過電影,或是對這個淺薄問題有想法的人


  最後

  這部電影上映的廳數很少

  台南只有一間電影院上映

  所以希望躊躇不前的人可以一起支持一下國片

  然後美秀姐在裡面真的演得很棒

  起碼我到現在還在思考她真的是惡女嗎

  爬文前面幾篇的推薦文也都寫得很好,看完後更堅定我去看的決心(雖然本來就會去看)


  然後邵雨薇真的很美,口條也很好

  希望大家可以去支持一下

  謝謝



  --'
