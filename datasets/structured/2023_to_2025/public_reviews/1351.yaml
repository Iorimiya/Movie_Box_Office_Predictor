content: '【 iTunes 特價報】

  托爾金傳 / 惡女花魁 / 暫時停止呼吸


  好奇催生「中土世界」這電影世界觀的原作，到底經歷哪些嗎？一同從官方低

  價主打《托爾金傳》，享有 4K、HDR 的高規格畫面，清楚認識尚未熱衷奇幻

  文學創作的 JRR 托爾金，面對無情戰火，仍有周圍友人的支撐，賦予往後催

  生經典小說系列的動力。


  中價方面，漫改電影《惡女花魁》經攝影大師蜷川實花的亮麗視覺風，結合「

  蘋果女王」椎名林檎配樂創作，加上由土屋安娜飾演的遊女，表達對戀愛的期

  盼與失落，反映看盡人生百態的風俗從業者心聲。


  此外，論起香港驚悚經典，不得不提正好特價的《暫時停止呼吸》！不光製造

  殭屍隨時撲來的緊急氣氛，還幫林正英憑一身道士服，搭配對付妖怪的氣息，

  塑造難忘的伏魔英雄。


  新上架的戰爭片《1917》，在奧斯卡得獎攝影師羅傑狄金斯隨演員步伐，一路

  拍成的一鏡到底場面，感受傳口信要跨越敵區的士兵，奮力憑雙腳想完成任務

  的緊湊。


  以上，希望大家看片愉快！


  未特別註明 畫質皆為 HD

  4K = 4K 畫質

