title: '[新聞] 珊卓布拉克代言惡女 比裝乖爽多了'
content: '中國時報【許世穎╱綜合報導】


  影后珊卓布拉克在動畫《小小兵》為女魔頭「史嘉蕾」獻聲，提到成為無法無天女魔頭的

  「代言人」，她笑說：「飾演大壞蛋永遠都是最有趣的，使壞和耍賤比當個好好小姐爽多

  了！」


  珊卓在片中時而耍心機假溫柔，時而大吼，影后靠聲音也能展現演技，不過仍不敵片中又

  萌又可愛「小小兵」，就算亂搞一通也超級搶戲。她說在這部電影的工作，就是不斷使壞

  和被激怒，「史嘉蕾就像被寵壞的８歲小女孩，從小沒有獲得應有的關愛，所以才想篡位

  成為女王。」


  雖然小小兵說得像是外星語，珊卓仍明白他們想說什麼，「我喜歡小小兵的地方，正是你

  永遠無法摸透他們，但你絕對知道他們想表達什麼。他們所表達的情感太豐富，早已超越

  了語言的藩籬，我們之間存在著無法言傳的美好關係。」該片７月９日在台上映。


  新聞網址：


  --'
