title: '[新聞] 《辣妹過招》重製版9角色曝光！新惡女「'
content: '辣妹過招》重製版9角色曝光！新惡女「瑞吉娜」是她　兩元老演員回歸


  ETTODAY


  2023年12月11日 20:00


  文／妞新聞


  等了20年終於敲碗成功！美國青春喜劇電影《辣妹過招》自2004年上映以來為影壇貢獻了

  不少經典，每年聖誕節都會出現的辣妹熱舞片段、Y2K穿搭、超Mean台詞等仍時常在社群

  上瘋傳，而當中的靈魂人物凱蒂（Cady）與心機女瑞吉娜（Regina）及她的小跟班們「塑

  膠一族」（The Plastics）如今迎來第二代的好消息？現在就一起看下去吧！


  「On Wednesdays,we wear pink.」星期三我們穿粉紅色的辣妹午餐守則再現！官方最新

  宣傳照可見二代演員們無一例外，全部套上代表性的粉色為主題色，一字排開大方宣示經

  典電影的回歸，IG簡介短語更是不客氣的改編瑞吉娜的名句之一：「上車魯蛇，我們要去

  看電影！」


  經典電影《辣妹過招》重製版9角色照曝！新惡女「瑞吉娜」是她？全員粉色辣妹傳統上

  身


  ▲《辣妹過招》被冠上「無法超越的名作」。（圖／IMDb）


  自從《辣妹過招》被冠上「無法超越的名作」後，2011年上映的《辣妹過招2》可說是票

  房慘淡，由於劇情更改以及瑞秋麥亞當斯（Rachel McAdams）、琳賽蘿涵（Lindsay

  Lohan）、萊西察伯特（Lacey Chabert）、亞曼達塞佛瑞（Amanda Seyfried）4位主演皆

  未回歸而激怒鐵粉，甚至很多人不知道原來有出續集啊？


  編劇蒂娜費（Tina Fey）則將故事舞台轉往音樂劇發展，開始在百老匯巡演，因為其玩味

  性增加，獲得了不錯的評價，而本次電影續集是由音樂劇重新被改編回電影版本，也承諾

  影迷們會盡力保有原創性，在美國的名聲才稍稍回暖，問題是：《歌舞青春》版的《辣妹

  過招》妞妞們願意買單嗎？


  ▲2.0版本的「辣妹過招」。（圖／翻攝自IG@meangirls）


  23歲歌手芮妮瑞普（Reneé Rapp）從2018年就加入了《辣妹過招》音樂劇團隊，在此期

  間一直擔任著團體C位瑞吉娜的角色，惡女形象早已刻入骨裡，當官方公告由她來續演新

  版《辣妹過招》時獲得不少正評；曾參演過《蜘蛛人》系列電影的安格利萊斯（

  Angourie Rice）飾演新生凱蒂；眼睛圓圓大大的蓓蓓伍德（Bebe Wood）和艾凡蒂卡凡當

  娜普（Avantika Vandanapu）則將分別以凱倫、葛蕾琴亮相，以上4位就是2.0版本的高校

  辣妹！


  而造成凱蒂與瑞吉娜感情分裂的重要男人「Aaron」，由《夏日之戀》新生代演員克里斯

  多福布萊尼（Christopher Briney）擔綱演出，一雙綠色眼珠，像是彈珠裡藏著憂鬱森林

  般，眼底沒有盡頭的深情形象會跟兩位女孩擦出什麼火花著實令人期待！


  經典電影《辣妹過招》重製版9角色照曝！新惡女「瑞吉娜」是她？全員粉色辣妹傳統上

  身


  ▲（上）女教師蒂娜費、（下）校長提姆麥道斯。（圖／翻攝自IG@meangirls）


  大家最在意的問題：有沒有元老演員回歸呢？答案是有的，目前可知校長提姆麥道斯（

  Tim Meadows）以及被誣陷販毒辦離婚的女教師蒂娜費（Tina Fey）兩位將回籠復刻角色

  。


  目前已公開的片段中可知，不只畫面、語言尺寸變火辣，四人造成的校園鬧劇和時尚風格

  融入現代科技也再次升級，還好尚有保留寫滿壞話的「Burn Book」麻辣書！


  ▲《辣妹過招》四位辣妹始祖。（圖／IMDb）


  四位辣妹始祖都有公開表明過有意願參與續集的演出，但沒人鬆口透露有收到邀請，粉絲

  們都在猜會不會以驚喜客串方式出現呢，到底語帶保留是炒作還是真伏筆？也只能等電影

  播出後揭曉了，目前美國確定明年1月12日上映。




  --'
