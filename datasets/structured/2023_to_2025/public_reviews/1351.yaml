url: https://www.ptt.cc/bbs/movie/M.1492745359.A.85B.html
title: '[新聞] 坎城影展入選快報！《屍速列車》接棒之作《惡女》入選午夜'
content: '新聞網址：


  第70屆坎城影展昨（13日）公布入圍名單，電影發行公司車庫娛樂旗下新片《惡女》（英

  文片名：The Villainess），被視為《屍速列車》接棒之作，入選坎城午夜放映單元，電

  影預定於9月在台上映。《情陷高達》（暫譯）（英文片名：Redoubtable）則入選正式競

  賽片；而坎城影展70週年特別放映單元也將首映美國名導大衛林區執導的電視影集《雙峰

  》（英文片名：Twin Peaks）最新一季，車庫娛樂則將於近期重映當年影集的電影版《雙

  峰：與火同行》（英文片名Twin Peaks: Fire Walk with Me）全新數位修復版本。


  《惡女》由《屍速列車》原班人馬製作！堪稱《追殺比爾》結合《霹靂煞》

  以獲坎城評審團獎的《蝙蝠：血色情慾》展露頭角的韓國女演員金玉彬，今年以新作《惡

  女》於8年後再戰坎城，入圍坎城午夜放映單元。《惡女》由《屍速列車》同一製作團隊

  出品，被視為去年同樣入圍午夜單元的《屍速列車》接棒之作，電影堪稱是《追殺比爾》

  結合《霹靂煞》，前所未見的動作大片《惡女》即將引爆觀眾的視覺感官極限！


  在《惡女》坎城版海報中，金玉彬手持槍械的背影，充滿魅惑又冷血無情的殺氣，而金玉

  彬本身就是跆拳道與合氣道上段者，雖首次挑戰大量動作戲，卻難不倒功夫底子深厚的她

  ，金玉彬可望成為韓國新一代動作片女王。《惡女》由韓國新銳導演鄭秉吉（音譯）執導

  ，鄭秉吉上一部處女作《殺人告白》曾獲得百想藝術大賞最佳編劇、大鐘獎最佳新導演肯

  定，此次入選坎城影展午夜單元，鄭秉吉表示：「感謝坎城影展，我無法形容有多麼開心

  ，也感到十分榮幸。《惡女》是一部十分有快感的電影，也很感謝演員與工作人員們。

  」

  金玉彬在《惡女》中飾演本想為夫報仇的女殺手，卻被逼成為國家情報院的秘密殺人機器

  ，執行各種暗殺任務，雙手血腥的她想金盆洗手，卻再度接到刺殺密令。《惡女》結合了

  韓國實力與人氣一線演員，除了金玉彬，還有戲精申河均、人氣男模演員盛駿，還有以壞

  女人、惡角出名的金瑞亨，強烈的視覺效果與劇情已引發大眾強烈好奇心。《惡女》預定

  於9月在台上映。


  《大藝術家》奧斯卡金獎導演親自編導《情陷高達》 凱薩獎影帝詮釋電影大師的愛情歷

  程

  車庫娛樂旗下另一新片《情陷高達》（暫譯）（英文片名：Redoubtable）入圍正式競賽

  片，電影取材自法國女演員兼作家安娜維亞珊絲姬（Anne Wiazemsky）的自傳作品《Un

  An Après》，由《大藝術家》奧斯卡金獎導演米歇爾哈札納維西斯（Michel

  Hazanavicius）親自編導，攜手凱薩獎影帝性感男神路易卡瑞（Louis Garrel）詮釋當代

  電影大師尚盧．高達（Jean-Luc Godard）和安娜相識、結婚、最終分手的愛情歷程。


  影史上最具爭議的導演尚盧．高達，是法國新浪潮最具代表性的人物，其電影拍攝手法被

  視為挑戰和抗衡好萊塢電影的拍攝手法和敍事風格，他也把自己的政治思想和對電影發展

  史的豐富知識注入作品，因此在他的作品裡不難發現存在主義和馬克思主義哲學的影子，

  高達以銳氣十足的創作震驚了世界影壇。車庫娛樂將於近期獻映描述電影大師尚盧．高達

  奇幻愛情歷程的《情陷高達》。


  《雙峰》再創經典不敗！車庫娛樂重現《雙峰：與火同行》詭譎神秘的魔幻世界

  坎城影展70週年的特別放映單元將於影展期間首映美國名導大衛林區執導的電視影集《雙

  峰》（英文片名：Twin Peaks）最新一季，車庫娛樂則將於近期重映當年影集的電影版《

  雙峰：與火同行》（英文片名：Twin Peaks: Fire Walk with Me）全新數位修復版本。

  《雙峰：與火同行》1992年獲美國獨立精神獎最佳原創音樂獎，並於坎城影展提名金棕櫚

  獎，隔年再獲得美國科學奇幻驚悚電影獎最佳音樂，提名最佳驚悚電影、最佳女主角、最

  佳原創故事。《雙峰：與火同行》故事描述雙峰鎮的16歲少女蘿拉被人殺害事件的來龍去

  脈，以及在她死前撲朔迷離的內心世界；由於蘿拉童年被生父強姦，從此一直生活在惡魔

  父親的陰影下，雖看似是健康美麗的陽光少女，但其內心已被嚴重扭曲，充滿恐懼、幻影

  、夢魘。《雙峰：與火同行》以蘿拉的視角向觀眾展現詭譎迷離的魔幻世界，電影並揭露

  誰是兇手的真相。


  以怪異玄奇風格著稱的導演大衛．林奇，27年前曾以電視影集《雙峰》造成轟動，《雙峰

  ：與火同行》便是從此影集延伸出來的電影，而全片的映象設計十分突出，不少鏡頭具有

  一種迷幻般的色彩和構圖，相當配合這個神秘詭異的故事。


  ★ 入選2017坎城影展午夜單元

  ★《殺人告白》百想藝術最佳編劇、大鐘獎最佳新導演得主鄭秉吉，再度自編自導！

  ★ 繼《蝙蝠：血色情慾》《高地戰》後，金玉彬與申河均第三度合作

  ★ 《妻子的誘惑》《奇皇后》絕代壞女人代表 金瑞亨，再度挑戰迷人反派

  ★ 當《追殺比爾》結合《霹靂煞》，超刺激感官體驗媚煞2017影壇！


  被培養成殺手的淑熙（金玉彬 飾演），多年來內心只有一個念頭，就是對殺夫惡徒復仇

  ！一日她被誘拐到國家情報院，被要求成為機密特務，原本淑熙抵死不從，但是驚覺自己

  懷上身孕後，只好為了孩子接受國家安排。淑熙從此化名為「妍秀」，替國家情報院執行

  所有不可告人的殺人任務。雙手血腥的她從沒想過還能為人所愛，直到溫柔的賢修（盛

  駿 飾演）走進她的生命，兩人下定決心步入禮堂，沒想到就在在婚禮當中，妍秀再度接

  到了國家的殺人指令，這場任務將是她未曾面對過的凶險場面，只有依賴最極致的冷酷與

  野性，才有可能生存。


  ★ 2017坎城影展正式競賽片

  ★ 《大藝術家》奧斯卡金獎導演米歇爾哈札納維西斯最新力作

  ★ 凱薩獎影帝性感男神路易卡瑞，詮釋當代電影大師高達

  ★ 法國新浪潮大師高達的真實浪漫愛情故事


  高達在拍攝《中國姑娘》（La Chinoise）期間，愛上了當時只有 17 歲的安娜維亞珊絲

  姬，陷入熱戀的兩人很快結婚，其後也先後合作了《週末》（Week End）、《同情惡魔》

  （Sympathy For The Devil）等電影。但是1968年法國大規模學運「五月風暴」卻對兩人

  關係帶來巨大衝擊，高達埋首思索政治與社會問題同時，與安妮之間的衝突和誤解亦逐漸

  浮上檯面。


  ★1993美國科學奇幻驚悚電影獎獲最佳音樂，提名最佳驚悚電影、最佳女主角、最佳原創

  故事

  ★1992美國獨立精神獎獲最佳原創音樂

  ★1992坎城影展提名金棕櫚獎


  蘿拉在雙峰鎮上是個優秀的高中生，但夜裡她會變成一個古柯鹼癮君子和性狂亂者，去色

  情酒吧賣淫以換取買毒品的錢。而她的父親在她小時候就騷擾她，加速了蘿拉的毀滅。

  但當蘿拉意識到自己正在把最好的朋友引向同一條不平的道路時，良心受到衝擊。 蘿拉

  去參加一個在廢棄的火車車箱內的性亂聚會時，Leland跟蹤在後，他為強烈的佔有欲所驅

  使，最終給蘿拉和她的朋友帶來了悲劇性的結果。


  ---


  車庫真的有夠積極買片的，不過其中《惡女》算是滿早就買的，這次也入選坎城

  雖然有時候覺得他們有點再亂槍打鳥或是沒個理念，但有時候也的確滿厲害的啦 LOL


  --'
