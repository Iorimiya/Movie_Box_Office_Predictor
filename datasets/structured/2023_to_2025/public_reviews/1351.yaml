url: https://www.ptt.cc/bbs/movie/M.1709223439.A.8E4.html
title: '[好雷] 惡女：最佳自殺防治電影？ '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看完這齣，心中確實有某種揮之不去的陰影，

  好像寒流來襲時忍不住想用日本火鉢生個碳火取暖，

  卻又心生恐懼想說算了。

  也許這部是十足的最佳自殺防治電影？


  《惡女》是由獲得金馬獎最佳動畫長片《幸福路上》的導演宋欣穎自編自導的電影，怎麼

  看都跟幸福路上的ｔｏｎｅ調大相逕庭，只能說導演確實是大膽挑戰並突破自己了。而突

  破自己的，當然還有飾演女主角秀蘭的林美秀，因為一直以來對林美秀的印象就是個搞笑

  演員，沒想到也可以演得如此地自然如此地惡？


  但秀蘭真的是惡的嗎？這讓我想到這樣的事件曾幾何時常在社會新聞上演，例如就是億萬

  高中生的事件，甚至也可能發生在你我周遭，像我就聽過有朋友的年邁父親愛上了特種營

  業的女人，但最後發現那女的只是要他爸爸的錢，上網求救該怎麼辦才好。邵雨薇演的幹

  練主播黃立美自然而來接觸到秀蘭也是這樣的看法，而且秀蘭的各種行徑似乎也將觀眾導

  向「惡女」的既定印象，李天柱飾演的立美爸爸黃志德也看起來很容易受騙的樣子，但老

  實說，每次李天柱出現我就很出戲，大概跟他很刻意的演技有關係。


  講到惡女自然而然地就會想到《惡女花魁》，就像女主角清葉說的：「不知怎的，我就是

  會，我就是懂得怎麼看男人才會使他們興奮。」，秀蘭也是因職業進而本能地學到了如何

  讓男人傾心的絕技，就像她說的，知道男人要什麼就給他什麼，錯了嗎？甚至於連法庭上

  旁聽的民眾也都被說服，還覺得燒炭自殺的男人是咎由自取的。但惡女也會動了真心？這

  讓我重新思考《般若波羅蜜多心經》裏頭一段：「舍利子，是諸法空相。不生不滅。不垢

  不淨。不增不減。」，若美秀是空相，而為之傾心的男人則隨之生滅，是逃不出虛妄幻象

  的造化因果，而立美的父親也是伴隨著這因果而亡的。但立美的轉惡則不同，她垢了且善

  滅了，單純就覺得父親的死是因為國倫的關係而行惡，那麼這齣真正的惡女是誰呢？


