url: https://www.ptt.cc/bbs/movie/M.1714650046.A.6A0.html
title: '[爛雷] 找錯電影意外看到的惡女'
content: '前陣子不經意瞥見一部片的介紹

  關鍵字：台劇、殺人、灌水泥、台灣老派女星


  感覺題材很有趣

  在心心念念著想要看這部電影的情況下

  因為知道Netflix上一直掛著一部戲叫做「惡女」

  只知道是林美秀演的，加上戲名感覺是在演壞人

  想說應該是這部吧！

  剛好前幾天吃飯找不到劇看時就點開來看了



  結果點開來看不得了

  劇情毫無邏輯不符常人邏輯，各種貶低記者、檢察官、法官工作的劇情讓我看得有夠不舒服

  選角包括女主、男主、男配(牙醫) 都極度不適合

  台詞也非常生硬、演技差到不行


  女主刻意演出又哭又笑的樣子尬到不行

  用那種生硬的演技與台詞莫名其妙就做起愛來真的有夠難看讓我感到噁心


  男配那種臭奶呆感覺笨笨的蠢樣整天在家打電動耍廢，跟我說是牙醫是不是在開什麼國際玩笑


  男主當一個檢察官整天辦公室不開燈到底是想怎樣？

  更別說還能夠私藏證據，這些證據法官沒看見也應該會要求檢察官附上「真的沒有不在場證明」的證據吧？這樣子能夠判死刑？


  完全沒有辦法一次看完 還分成4天的吃飯時間來看

  讓我看完這部的動力是想看到底什麼時候才要灌水泥

  結果看完了還是沒有 上網查才知道我看錯片了


  編劇自以為可以寫一個轉折又轉折的片

  讓觀眾可以覺得 哇好好看原來我們都誤會林美秀了真正的惡女其實是女主角


  但NO， 沒有，我只有覺得這部片讓我覺得噁心又超難看

  氣死我了

  -----

  Sent from JPTT on my iPhone


