title: '[新聞] 艾瑪史東47套戲服拚小金人！《時尚惡女》'
content: "艾瑪史東47套戲服拚小金人！《時尚惡女》搶奧斯卡入圍門票\n\n\n 葛大維\n\n準備再度「衣」鳴驚人！美國影視媒體「綜藝報」（Variety）報導：艾瑪史東主演《時\n\
  尚惡女：庫伊拉》（以下簡稱《時尚惡女》）將是角逐明年奧斯卡最佳服裝設計的大熱門\n之一。\n\n據報導盤點：以1970年代為背景的《時尚惡女》，片中艾瑪史東的戲服多達47套，艾瑪湯\n\
  普遜的戲服沒艾瑪史東多但也有33套，非常吸睛，而且凸顯服裝設計團隊的才華，應該不\n會是明年奧斯卡入圍名單上的遺珠。\n\n不過「綜藝報」報導：和《時尚惡女》搶奧斯卡入圍門票的強片包括：甜茶的《沙丘》，\n\
  艾迪墨菲的《來去美國2》，DC《蜘蛛女》萊斯莉葛麗絲的《紐約高地》，《真寵》2019\n年奧斯卡影后奧莉薇亞柯曼和《王者之聲：宣戰時刻》2011年奧斯卡影帝柯林弗斯合演《\n\
  母親節幽會》（暫名），布萊德利庫柏主演《夜路》（暫名，前暫譯《玉面情魔》），布\n萊德利庫柏飾演芭芭拉史翠珊從美髮師變《超人》大製片鍾彼得斯的1970年代高中生電影\n\
  《甘草比薩》（暫名，前暫譯《里柯萊斯的披薩》），女神卡卡的《Gucci：豪門謀殺案\n》，潔西卡雀斯坦的《上帝之眼》（暫名，另有譯《她的雙眼》等，競爭激烈。\n\
  \n今年32歲的艾瑪史東，3月在《時尚惡女》上片前宣布喜獲千金，之後以捲長金髮和圓潤\n臉龐出席首映，雖然該片反應兩極，但外媒報導艾瑪史東將和迪士尼再合拍《時尚惡女2\n\
  》，如果入圍奧斯卡，無論得不得獎，都能大大提升《時尚惡女2》成局盡快拍攝的機率\n。\n\n艾瑪史東主演《樂來越愛你》讓她贏得2016年威尼斯影后，隔年入圍奧斯卡十四項（平了\n\
  《鐵達尼號》紀錄）並讓她贏得奧斯卡影后，可惜入圍服裝設計沒得獎。\n\n2018年《真寵》入圍隔年奧斯卡十項，奧莉薇亞柯曼封后，可惜入圍女配角的艾瑪史東和\n\
  入圍服裝設計都槓龜。\n\n如今《時尚惡女》為艾瑪史東量身打造47套戲服，能否再入圍奧斯卡？目前不知；但粉絲\n們應該都很期待看艾瑪史東美美現身明年奧斯卡頒獎典禮的星光大道。\n\
  \n2022年奧斯卡將於明年2月8日（台灣同日當晚）公布入圍名單，3月27日（台灣隔天上午\n）舉行頒獎典禮。（圖／美聯社）\n\n\n\n新聞網址：\n\n\n\
  \n--"
