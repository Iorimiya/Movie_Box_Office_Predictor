title: '[新聞] 林襄激烈床戰影片流出！【惡女】挺超巨 '
content: '新聞網址：



  CATCHPLAY電影《惡女》將於10月27日上映，由邵雨薇、林美秀聯手打造最「婊裡不一」

  的懸疑驚悚爽片，將刷新觀眾的三觀與道德底線，而片中的一大亮點，就是啦啦隊女神林

  襄的驚喜現身，將飾演邵雨薇和曾少宗夫妻間的小三，不僅穿著內衣入境，還有跨坐在曾

  少宗身上狂搖的火辣床戲，胸前雄偉佔滿螢幕，銀幕處女作可說是極有誠意。


  邵雨薇在片中飾演主播黃立美，和未婚夫曾少宗原本準備結婚，有天回家卻發現人去樓空

  ，才發現對方已經偷吃小三，小三正是林襄飾演，手機裡還藏有2人親密床照，超兇上圍

  幾乎「比臉還大」，令人驚訝不已；曾少宗表示：「電影《惡女》中的每一人都有秘密與

  謊言，揭發這些善與惡、真實與虛假是這部片最大的看點，觀眾可以透過電影得到感官的

  刺激與價值觀的反思，非常推薦給大家！」


  片中飾演檢察官李國倫的鳳小岳，與飾演主播立美的邵雨薇，為了「上位」相互聯手操弄

  輿論，進而影響辦案的法官心證，2人在合作「上位」過程中，也意外發展出的超乎尋常

  的關係，上演激情床戲ㄝ鳳小岳形容：「這部電影包含許多人性的面貌，觀眾可以藉由電

  影好好思考究竟什麼是正義，什麼又是偽善的正義？」，10月27日將在大銀幕揭曉。


  --'
