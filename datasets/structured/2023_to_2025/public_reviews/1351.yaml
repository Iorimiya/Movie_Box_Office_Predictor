url: https://www.ptt.cc/bbs/movie/M.1707794877.A.05D.html
title: '[新聞] 《惡女》傳捷報Netflix霸榜日韓　邵雨薇'
content: '新聞網址：





  2024/02/12 18:01


  【記者趙大智／台北報導】34歲女星邵雨薇出道邁入14年，從未放過長假，去年接拍電影

  《惡女》等作品，因太過投入走不出陰暗角色，身心靈都出狀況。《惡女》近期於

  Netflix播映，在韓、日、台、港都交出不錯成績之際，邵雨薇決定暫離台灣飛往日本，

  經紀人同意「沒有期限，想回來再回來」，至於男友吳慷仁，也很支持女友的決定。


  邵雨薇最近在《商魂》扮傅孟柏活潑靈動的妻子，老公忙於商戰，她為引起注意，故意說

  「找狗來當家教」，果然他完全沒發現，十分逗趣。劇中她裙子的皮帶竟然繫到腰後面，

  根本螞蟻腰，但這還不是最瘦，拍完《商魂》接下《惡女》，因為想達到導演要求的病態

  美，身高163公分、體重40公斤的她，展開人生第一次減重，硬是瘦到36公斤。


  當時邵雨薇把家裡客廳的沙發撤移，換上跑步機，每天不停跑下來讓體重往下降，當時更

  因過瘦，只好咬牙推掉3支廣告，以免看起來太憔悴。只是即便如願瘦到36公斤，仍沒有

  多少人看得出來，經紀人虧她不如先吃胖到55公斤再瘦，才有對比的落差。


  處女座的邵雨薇心思纖細敏感，她接下《惡女》後深陷其中，無法脫離角色，之後另一部

  影集也超負面，讓她狀況變得很差，才會下定決定暫時放下演藝工作，到日本念語言學校

  ，為此至少推掉10場活動，努力清空負面能量。


  《惡女》由《幸福路上》導演宋欣穎執導，邵雨薇、林美秀、鳳小岳主演，在Netflix全

  球播映反應不錯，連續3天登上韓國榜第5名，台灣曾衝上第1名，日本第3名，香港也在前

  10名，目前正籌備影集版。


  今年農曆年，邵雨薇分享高雄老家團圓飯的照片，身中除了有男友吳慷仁，還有温昇豪，

  3家人這是第1年合辦，之所以一塊團聚，主要是邵雨薇跟温昇豪是多年的隱形好友，比吳

  慷仁還要更熟，除了3人的地緣關係，也是高雄這家餐廳以難訂位聞名，要滿一定的桌數

  才給訂。



  --'
