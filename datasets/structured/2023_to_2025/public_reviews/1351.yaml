content: '惡女訂製服



  描繪澳洲鄉下小鎮的醜陋與悲哀，兒時被霸凌女主回來遭遇的一切




  台灣的翻譯很奇怪，因為這部女主並非“惡女”，不過中國的翻譯“裁縫”也不到味


