title: '[好雷] 惡女花魁'
content: "片 名：惡女花魁\n　　導 演：蜷川實花\n　　演 員：土屋安娜、椎名桔平、菅野美穗、\n　　　　　　安藤政信、木村佳乃、成宮寬貴\n　\n　\n\
  簡　介：\n\n　　天生反骨叛逆的女主角清葉在八歲時被賣入妓院玉菊屋，因為不\n想成為妓女而逃跑卻被抓回。在花魁妝日的激將法之下，決心成為花\n魁並依靠自己的力量離開玉菊屋。\n\
  　\n　　憑著天生的美貌，清葉日漸走紅，卻在此時愛上一名恩客，進而\n得罪有權有勢的大名恩客。看著心上人卻因為害怕而逃離的身影，清\n葉終於對男人死了心，逐將服待男人當成一門專業的技巧，重新擄獲\n\
  了眾多恩客的青睞。\n　\n　　某日，接替妝日太夫之後成為玉菊屋花魁的高尾太夫，因為對畫\n師的愛戀不果而對畫師動起殺意，兩人爭執之中畫師誤殺高尾太夫，\n清葉逐而接替高尾太夫成為玉菊屋新一代花魁，並更名為日幕太夫。\n\
  　\n　　清葉成為日幕太夫之後，得到將軍的喜愛，決心娶日幕為妻。早\n已對男人死了心的日幕明知吉原只有一顆不會開花的櫻花樹，卻對將\n軍提出了『若是櫻花綻放，便是我離開之日』的要求，沒想到隔日將\n\
  軍真的包下了妓院街，並移植來數量龐大的櫻花樹。\n　\n　　深受感動的日幕答應下嫁將軍，卻在下嫁前夕，發覺原來真在竟\n然就在身邊……\n\n\n心得：\n\n\
  　　其實在抱著濃濃的期待看完電影之後，自己有一種不確定感，因\n為故事本身有一點空洞、事件與事件的連接上疏離性稍強，再加上結\n局的轉折太大，有種刻意而為，卻明顯的刻意的感覺。這些都是身為\n\
  攝影師的蜷花導演轉戰電影時，於鋪陳技巧、剪接上需要再求進步的\n地方。\n\n　　但是這裡頭還是有許許多多可以討論的地方，一如諸篇影評所言。\n再加上我個人實在太愛土屋了，所以片子本身對我而言還是滿正面的。\n\
  \n　　另外配樂部分，在描寫古代的日本遊女這樣的背景下，Ｒinｇo\n大膽的用了現代元素豐富的音樂讓人不免有種違合感，(我深信絕對\n有許多人不太能接受這樣的編排方式)不過我本身覺得很不錯，因為\n\
  我認為清葉(女主角)本身擁有的態度，以及整個故事的呈現方式當\n相當有現代感，並且配樂在許多性愛部分中平緩了我對這種戲份的\n緊繃感，林擒三番兩次以戲虐的方法去平緩妓女交歡時的肉慾，進\n\
  而強調這樣的家常性。對於遊女而言這只是一種過程，以及事業表\n現。至少配樂這樣說服了我。\n\n　　當然對於不同的場合氣氛，林擒依舊做了不同的表達方式，有\n\
  幾次的性愛過程的畫面＋配樂，還是充滿慾望、澎拜並且唯美的，\n總之在這個部分我認為配樂很能突顯導演所要表達的東西，儘管方\n式有一點突兀或者誇張。\n\n　　不過除了以上兩篇所言是我所能感覺到的，導演的意圖之外，\n\
  這部片讓我最感動的其實是片子回歸到紀錄著遊女的簡單生活，\n就是最原始最簡單的，身為一個人，她們的生活依舊是有笑有淚，\n這部電影讓我對於這樣職業的人們有了一個改觀，並不能說我本\n\
  來認為妓女這職業是噁心糟糕的，而是我確實從來沒有將她們當\n作一般人去面對看待。但其實她們就只是一般人，在面對她們的\n生命時她們其實不是我們所想的那麼過分不堪、可憐、無助，當\n\
  然她們是不自由的，但是她們(或者女主角)卻在這樣的生命中找\n到了她自由的方式。\n\n　　而一反對於客人、男性買春者的刻板厭惡感，故事中也相繼\n出現讓人感覺到溫暖的男客，並不是因為他們真情流露、或者他\n\
  們對這群青樓妓女海誓山盟，(這種人通常才是魔鬼般的負心漢)\n而是他們將這群女人視為人，並且真心將玉菊院視為一個愉快美\n好的地方，把這群人當成他的知心，對她們真誠用心的說話，而\n\
  不單只是帶著滿身的慾望而來宣洩的男人。\n\n　　這故事中的老人常客就是最讓我印象深刻的一個，清葉的初\n夜雖然是被他買走的，但是一直以來他們倆的相處都像是親人一\n\
  般的相靠著，最後老人也安祥的死在清葉的腿上，在那之前對清\n葉說了如果能永遠不放棄那有多好，且又在最後留下一句───\n「永遠沒有不會開的櫻花」。\n\n\n\n\
  \n　　這一段雖然稍顯矯情，但是卻能讓人看出他們兩人在客妓、\n男女之外，還擁有的人性的情感。這對我而言反而是這部片最難\n仁可貴的地方。因為他切入了不同的角度去觀察一個被畫上標記\n\
  的人的一生。光就這一點而言，我認為她勝出藝妓回憶錄好幾倍。\n　　\n　　不過雖然電影使用金魚作為主線，不過我卻覺得蜷花在電影\n裡，利用金魚做的只有提升電影美感而已，幾乎忽略了金魚強烈\n\
  的隱喻，除了最後「女孩捧起跳出水缸的金魚說妳只能活在那裡\n面喔」這裡才稍作修飾！在整部片中反覆拍攝金魚雖然有種貫串\n的感覺，但卻讓人不免有種，「就只要一直拍金魚就可以充滿意\n\
  象性了阿。」的感覺。\n\n　　我還是要來講一講我對整部片的配樂最有Fe的地方，就是在\n清葉被拋棄，看著自己即將想要托付的人從另一間妓院走出來，\n並對她咧嘴一笑的那時，心裡os的「阿，魔鬼的笑容！」，\n\
  然後在大雨下轉身奔離當場。這一整段的音樂我超喜歡的，且畫\n面也一直令我念念不忘。\n\n　　我想導演可以再人性的細膩面裡頭多加詮釋思考，否則這部\n片如果少了綺麗的的畫面、林擒太過特殊的配樂之後，會變得比\n\
  較薄弱無力。\n\n\n　　但是還是我會覺得值得一看的片子。\n\n　　我也相信結局其實充滿無限的想像力，金魚只能活在魚缸裡，\n所以同情人私奔的清葉再也不是一隻美麗的金魚。\n\
  \n　　「但似乎比擁一切都來得有意思！」\n\n　　結局還是讓我在連接前面的鋪陳上有所感動，甚至小小的熱\n淚盈眶了一下，因為我覺得清葉好辛苦好辛苦，而也覺得這真是\n\
  那人卻在燈火闌珊處的該死。\n\n　　畫面是海洋一般綿延的櫻花還有草原。\n\n　　而裡頭滿滿都是少女的夢。\n\n\n　　雖然很拔臘但我依舊希望這世界能夠有人繼續相信一些美好\n\
  的存在，哪怕就只是一剎那，有時候對一生而言也是一種永恆。\n\n--\n\n\n                                       \
  \                      \n\n--\n◆ From: 123.194.152.115"
