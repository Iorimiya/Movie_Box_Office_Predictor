  然後她這個女主的演技也不到十分好，反倒是被超時空攔截的女主角和飾演她媽媽的兩個女

  演員比下去




  劇情:半


  美術:


  服裝:  很贊


  配樂:這部的靈魂 帶走劇情走


  整體:: 很推薦


  --



  這部會讓我以後會想重看的魔力


  OMG!!!!你說對了!!!!

  我也是心得不懂怎麼寫也不知寫什麼

  但就是很喜歡這部!'
