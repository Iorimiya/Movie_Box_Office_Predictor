title: '[新聞] 【末路雙嬌】韓韶禧、全鐘瑞打造惡女犯罪'
content: '新聞網址：



  南韓年度話題犯罪新片《末路雙嬌》，昨日（12/16）下午在首爾舉行盛大的製作發表會

  。導演李煥攜手主要演員韓韶禧、全鐘瑞，以及金新綠（網路又譯金信祿）、鄭英珠、李

  在均與女團OH MY GIRL成員YooA齊聚一堂，揭開這部風格強烈之作的神秘面紗。全片最大

  亮點莫過於韓韶禧與全鐘瑞兩位同世代演員的首度交鋒。導演直言兩人本身就具備極強的

  「角色象徵性」，不僅代表年輕世代的能量，也承載著不安與衝動，讓故事更具說服力與

  感染力。首度擔綱商業電影女主角的韓韶禧坦言，心情既緊張又期待，更讚美全鐘瑞對角

  色的高度投入，讓對手戲充滿爆發力與真實感。全鐘瑞也回應跟韓韶禧並肩作戰，是她在

  拍攝過程最大的力量來源。除了雙女主角強強聯手，其他卡司同樣話題十足。實力派演員

  金新綠透露自己曾一度婉拒演出，最終仍被作品的挑戰性與堅強陣容打動而加入；鄭英珠

  則為詮釋冷酷無情的解決者角色，不惜剃光頭上陣，以近乎極限的投入感，展現出角色的

  殘暴與壓迫；而YooA則突破形象，挑戰飾演賭場老闆的妻子，不僅是她首度詮釋人妻角色

  ，更將以充滿層次的「新鮮背叛感」，開啟演員生涯的嶄新面貌。《末路雙嬌》也確定由

  「采昌國際多媒體」引進台灣，將安排2026年1月30日於台灣正式上映。





  《末路雙嬌》描述兩位生活在繁華都市的好友，為了迎接更美好的未來，鋌而走險去竊取

  黑錢和金條，因此引來殺身危機。憑藉韓韶禧與全鐘瑞兩位演技與美貌兼具的選角，讓人

  翹首以盼她們將如何表現角色為了改變人生而奮不顧身的面貌。導演李煥在昨日的製作發

  表會上，提及兩人所具備的「角色象徵性」：「她們本身就很具標誌性，也象徵著年輕世

  代。若由她們來詮釋這兩個角色，故事能以更具說服力與感染力的方式傳遞給觀眾。」他

  補充：「她們在形象上都與角色非常契合，能藉此挑戰更嶄新的面貌。」尤其這是韓韶禧

  首度接演商業電影女主角，她表示：「每部作品對我來說都同樣珍貴，並沒有特別想區分

  什麼，但這畢竟是第一次演出商業電影，還是會感到緊張與顫抖，想到所有一切都將被裝

  進這部作品裡頭，也很好奇觀眾會如何看待。」



  此外，當被問到與同齡的全鐘瑞共同合作時，韓韶禧也分享：「她的角色帶有野性又粗獷

  的魅力，但鐘瑞本人其實皮膚白皙、身材纖瘦。我在片中幾乎看不到鐘瑞原本的模樣，這

  讓我覺得很棒，代表她真的大量吸收並消化了角色。」她並表示：「在人性層面上，她也

  有隨性、不做作的一面，這些地方都跟角色有相似之處，給人很好的感覺。」她也回憶：

  「她在演戲時對現場的投入度非常高，我反而從她身上得到很多幫助。」而一旁的全鐘瑞

  也回憶：「得知能跟韶禧一起演出，加上我很清楚和同齡演員一起拍攝這類型電影的機會

  並不多，所以立刻就決定參演。」她並大讚對方：「在拍攝現場，只要想到有能作為朋友

  、同事、也是一起完成相同作品的韶禧在身邊，就已經是很大的安慰與力量。」她接著說

  ：「因為這是一部充滿動感的電影，在寒冷的天氣下也有許多辛苦場面，需要投注大量能

  量拍攝，但她總是衝在前面、義無反顧地投入拍攝，這點讓我很意外，也非常佩服她。」

  同時她更笑說：「韶禧也是一個很有文化氣息的朋友，喜歡畫畫，更送了我幾幅畫。她擁

  有我所沒有的天賦，是一位非常特別的朋友。」





  除了韓韶禧與全鐘瑞雙女組合備受矚目，《末路雙嬌》更集結金新綠（網路又譯金信祿）

  、鄭英珠、李在均、YooA、金聖喆等實力與新鮮感兼具的演員共同演出，不論是實力派演

  員的極限挑戰，或是從偶像轉型的驚喜選角，都為全片注入更多張力。曾在《財閥家的小

  兒子》、《臥底高中》等劇展現不寒而慄演技的金新綠，坦言曾一度婉拒演出，原因是擔

  心自己能否在這個充滿慾望與背叛、情緒高度翻湧的世界中站穩腳步，體現出本片劇本的

  凶狠程度。不過當收到第二次邀約後，她選擇相信作品與演員陣容，尤其是韓韶禧與全鐘

  瑞的存在：「這是一部很具挑戰性的作品，所以抱持著『就試一次吧』的心情投入其中。

  」而在《社內相親》、《背著善宰跑》等愛情喜劇詮釋媽媽角色的鄭英珠，這回逆轉形象

  ，在片中飾演一旦鎖定目標就絕不失手的解決者。她更為了角色剃光頭演出，儘管造型與

  拍攝條件艱辛，她仍直言這是難能可貴的演出機會：「拍完後甚至覺得『剃得真好』。」

  至於在片中飾演追隨本能、為自身利益行動的李在均，也笑讚剃光頭的鄭英珠氣場驚人：

  「強大到讓人忍不住脫口對她說『對不起』、『是我錯了』。」



  至於女團OH MY GIRL成員暨演員YooA，則飾演反派角色之妻，同時也是握有足以顛覆所有

  局勢關鍵情報的人物。首度挑戰人妻角色的她，談到演出契機時，表示自己從媒體報導韓

  韶禧與全鐘瑞將演出時，就對本片產生好奇，沒想到真的迎來演出機會：「導演問我『需

  要一種新鮮的背叛感，妳覺得如何？』這句話點燃了我的挑戰慾望，所以決定演出。」對

  此，導演李煥坦言自己並不熟悉偶像圈，但在電視上看過YooA後留下深刻印象：「我希望

  這個角色能由一位帶來『好的背叛感』的演員來詮釋，所以抱著豁出去的心情向她提出邀

  請。把劇本寄給她後，我們聊了很多，幸好她非常喜歡，於是促成了這次合作，讓我既開

  心又榮幸。」



  這部由韓韶禧與全鐘瑞領銜主演的年度話題犯罪新片《末路雙嬌》，即將在2026年1月30

  日於台灣正式上映。本片劇情描述在華麗卻冰冷的都市裡，美善（韓韶禧飾演）白天是花

  店老闆，夜晚則化身聲色場所王牌。她原以為自己能邁向平凡而安穩的生活，卻因為一場

  詐騙而全數崩塌。走投無路的她，與同居如家人般親密的道京（全鐘瑞飾演）做出命運性

  的選擇。她們制定計畫，試圖從聲色圈大佬（金聖喆飾演）那裡竊取非法所得，藉此改變

  自己的人生。然而，他們卻在藏匿之處意外發現金條，導致事態急轉直下，兩人也因此被

  卷入無法回頭的危險漩渦。在這欲望、謊言與生存本能交織的黑暗世界當中，每一步都可

  能致命，當底線不斷被逼退，她們能否逃離這場被吞噬一切的命運風暴？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁及Threads專頁

  查詢。



  --'
