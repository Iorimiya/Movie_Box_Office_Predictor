url: https://www.ptt.cc/bbs/movie/M.1698481654.A.A9E.html
title: '[好無雷]'
content: '從《幸福路上》之後成為宋欣穎導演的粉絲ＸＤ

  導演的新作《惡女》真的是各方面顛覆我的想像，但真的很喜歡種種翻轉，無論是選角翻

  轉演員形象、角色翻轉刻板印象、劇情翻轉等，某種程度也翻轉我對國片的觀感ＸＤ很少

  國片能把女性的多面向呈現得如此貼切！

  看完真的是一吐怨氣ＸＤ


  好片不能只有我看到，真的很推薦大家可以看看！不過可能真的是女生看會爽，男生看會

  覺得氣或怒吧XD


  也整理一下網路上找到的推薦文，覺得很酷的地方是，終於不再是找影視圈自己人推來推

  去惹：


  「聽說這是一部心理驚悚片，我覺得，應該是對男人來說很驚悚，對女性來說則是啟發成

  長片。沒想到卲雨薇這麼會演，好看！」

  ～陳翠蓮（台大歷史系教授，《重探戰後台灣政治史》作者）


  「台灣少見的惡女文類，兼具社會性與娛樂性，令人驚艷。」

  ～黃長玲（台大政治系教授）


  「這是最近我看過最最好看的台灣片！」

  ～劉進興（國家人權委員會顧問）


  「這是一部向每一個台灣人發出挑戰書的電影！去翻弄你原本相信的價值、去戳破你對很

  多不同事物面向的價值觀，打破大家看事情（看電影）的慣性。看似題材很通俗，但敘事

  有趣、配樂驚艷、運鏡分明，而且細節非常飽滿，台詞異常精準，拳拳到肉。總之大家有

  空進戲院，沒空也進戲院，看過就知道了。」

  ～謝煜偉 （台大法律學院教授）


  「〈惡女〉和〈幸福路上〉完全不同風格！導演宋欣穎挑戰自我如此徹底，真是不容易。

  全片劇情有如波浪般一層一層的堆疊交錯而來，懸疑而緊湊。」

  ～莊豐嘉（華視前總經理）


  「我喜歡這部片的一個原因是，雖然有議題，但不說教。就是流暢、有邏輯、明快、還有

  娛樂感，演員演技自然，沒有奇怪的文青感，令人非常欣賞。」

  ～林蔚昀（作家）


  「〈惡女〉把檢察官跟媒體、政治掛勾、為了升遷不擇手段，詮釋得很深刻，劇情立體，

  令人想向導演致敬。」

  ～ 林孟皇（台灣高等法院法官、報導者「法律人追劇」專欄作者）


  「這部會紅！演得好看、故事緊湊、配樂又好聽。邵雨薇很會演，原來是高雄人呢！10月

  27日，請衝戲院。」

  ～ 邱毓斌（屏東大學社發系副教授，台灣人權促進會前會長）


  「宋導演再度說了一個超棒的故事，發揮電影綜合藝術的力量，從劇本、選角、對白、鏡

  頭、剪接、配樂到主題曲，都見用心而令人驚豔。」

  ～ 邵瓊慧（律師，前台北律師公會理事長，法律文學獎發起人）


  「《惡女》設定了一個很吸引人的主題：什麼是善，什麼是惡？整個電影一再顛覆觀影者

  的預想，戲劇性很強，高潮不斷，是一部流暢、精彩、有娛樂性也引人深思的好電影，別

  錯過了。」

  ～ 顧爾德（資深新聞工作者）


  「導演顯然不想被類型框限，小人物大敘事，權力鬥爭、輿論判案、爭名奪利，一點不想

  節儉，因為這些問題合起來才是人的境況。不過度，不受限，『幸福路上』的宋欣穎，還

  是『惡女』的宋欣穎，喜不喜歡之外，導演一直都以自在從容的姿態存在電影中。」

  ～ 鄭毓瑜（台大中文系教授）


  －－


  附上自己超喜歡的主題曲

  艾怡良-惡行


  看完片覺得這首歌真的寫得超好的啊！跟劇情真的超合的！而且放在片尾超舒壓！




  --'
