title: '[情報] 《惡女馬克白》導演將執導焦點影業出資黑幫電影《Body Cross》'
content: '英國男導演 William Oldroyd 於 2017 年帶來首部執導的長片電影《惡女馬克白》，這

  部改編自俄國文豪 Nikolai Leskov 筆下名著且間接受到莎翁鉅作《馬克白》影響的電影

  獲得了外界的高評價，與《春光之境》及《你才女巫，你全家都女巫》三片堪稱是在

  2017 年中最風光的英國獨立電影，且皆出自於新導演之手。


  《惡女馬克白》挾帶著高評價在各國的電影獎中皆有不小的斬獲，其中在母國的「英國奧

  斯卡」英國影藝學院電影獎中同時入圍「年度最佳英國電影」以及「最佳英國新編劇、導

  演及製片獎」，更在「英國獨立電影獎」中入圍高達 15 個獎項，而除了導演 William

  Oldroyd 過完了風風光光的一年之外，也將飾演女主角且交出精湛演技的英格蘭女演員

  Florence Pugh 給一手捧紅，在此之後接連參演了好幾部重量級的新片，包括《淑女鳥》

  奧斯卡入圍女導演 Greta Gerwig 執導的最新版《小婦人》改編電影以及《宿怨》導演

  Ari Aster 新片《Midsommar》等。


  而在《惡女馬克白》於 2016 年的多倫多影展中首映的兩年後，如今導演 William

  Oldroyd 也終於開始著手開始準備下一部新片，並在今日首度曝光了消息。


  新片名為《Body Cross》，將由曾經以《美麗壞東西》入圍奧斯卡編劇獎的英國男導演兼

  編劇 Steven Knight 執筆電影劇本。該片目前沒有釋出太多的電影細節，僅知劇情是聚

  焦在一對居住在英國倫敦中的移民兄弟身上，是一個以「黑手黨」為主軸的故事。


  《Body Cross》將由曾經以《贖罪》入圍奧斯卡最佳影片的王牌英國製片 Paul Webster

  擔任製作人，並由此製片與長期合作如《贖罪》與《傲慢與偏見》等片的英國導演 Joe

  Wright 共同創辦的電影公司 Shoebox 擔任此片的製作公司，而好萊塢電影大廠環球影業

  旗下的「焦點影業」則將為此片融資。


  《Body Cross》目前尚未公開任何演員、拍攝時間與上映日等資訊。



  --'
