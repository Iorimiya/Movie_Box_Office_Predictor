url: https://www.ptt.cc/bbs/movie/M.1700248185.A.C0C.html
title: '[雷]  惡女'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~








  本來以為會是美秀姐的角色當主角的

  後來才發現原來惡女另有其人


  蠻有趣的題材

  雖然沒有深入探討

  但也側面反映了很多值得探討的議題


  他人口中的真相真的是真相嗎？

  還是有人刻意為之操弄的結果呢？


  而大家刻板印象的

  不符合大眾審美的

  沒有光鮮亮麗的學經歷的

  為什麼就容易被當成惡人？


  反之為什麼

  美麗柔弱的人

  則能夠輕易的就能扮演好受害者

  擄獲大眾的同情心？


  而善與惡又是那麼的絕對嗎？


  劇情算是有些許的懸疑氛圍

  但是導演用很多詼諧的設計去製造衝突感

  像是美秀姐的超大畫作

  買木炭真的是為了做菜等等

  還蠻有娛樂性的


  那除了娛樂性之外

  裡面包裹的內核是什麼呢？


  「聰明女生 上位守則」

  這是海報上的標語


  但在故事裡頭誰上位了呢？


  美秀姐演的蛇蠍恐龍女

  鬧著自己的努力翻轉階級

  擁有華麗珠寶 住進大房子

  但故事裡能看見她上位的過程嗎？

  反而無辜遭受他人辱罵與牢獄之災


  而另一位聰明女生

  也就是邵所飾演的女主呢？

  比起故事開頭的她

  結局的她當然轉變很大

  可好像更不自由了

  為了愛情美滿

  她收斂起自己的鋒芒

  這樣是所謂的上位嗎？


  多少有點邏輯不自恰

  題材雖然很不錯

  但詮釋方式看了覺得還蠻可惜的


  最後誇一下美秀姐

  發揮的很棒

  真的把那種風情傳達得很好

  溫柔但不柔弱 相當有魅力


  邵整體而言演得不錯

  但是有點明顯的表演感

  作為核心角色 某些場景好像還是渲染力不足

  讓人難以被她的情緒感染








  --'
