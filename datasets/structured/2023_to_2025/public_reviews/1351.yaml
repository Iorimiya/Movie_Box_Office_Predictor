title: 'Re: [微好雷] 惡女+困獸'
content: '找老婆當然選林襄

  但看電影會選邵雨薇

  因為她是電影咖戲演得好

  還沒看過林襄演過甚麼好片


  昨天去二輪看的，一片55

  剛好也挑這兩部來看

  第一部先看惡女

  因為演日本廚藝老師是IG網友

  所以特別為了她去看這部片


  開演前一個男扮女裝的巨人大哥

  肚子很大穿長統靴黑絲襪熱褲

  突然一屁股坐到我旁邊來

  很想換位子，但嚇到動彈不得

  就像植物人一樣從頭看到尾

  看的過程中大哥一直拿腳蹭我

  又整個身體靠過來

  可能他腳長位子不好坐

  反正就是一個孤獨的變性人來找對象


  我覺得他的位子一定不是畫在我旁邊

  因為其實位子很多，整個廳大概20人

  而且還是最大的巨幕廳

  可能二輪戲院便宜，怪人才比較多吧?



  --'
