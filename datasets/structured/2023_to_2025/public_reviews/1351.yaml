url: https://www.ptt.cc/bbs/movie/M.1698683294.A.E31.html
title: '[好雷] 不懂惡女討論度不高 根本黑色幽默懸疑片'
content: '週日晚上看了朋友推薦的惡女，

  本來看名字覺得有點俗氣，海報有點韓風但又看不出到底要走什麼路線

  根本不知道會演什麼XD


  常常進戲院看國片都當支持產業，但惡女表現有讓我驚艷到，

  光台詞不會文謅謅、劇本不是小情小愛、節奏流暢我就非常推薦了!


  而且裡頭的善惡邏輯滿符合一般人的直覺，但順著直覺走卻又出現了矛盾之處，

  這種矛盾後的翻轉處理也很細膩，全劇無冷場、意料之內又有點小糾結跟亮點、

  導演氛圍營造的很好，完全對得起我花的電影票錢XD


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這部劇的靈感來源是日本2009年發生的真實事件「木嶋佳苗案」，

  簡單來說就是其貌不揚的女人為何可以擄獲無數孤單男子的心，

  甚至讓他們交出財產?


  總結一句邵雨薇內心os就是為何醜女有這麼多人愛?

  我爸愛她愛得死去活來一定是被洗腦

  她一定是為了錢跟我爸在一起



  邵雨薇演的美麗女主播，

  基本上以著正常人的直覺對要嫁給父親的美秀沒有好臉色。


  大家都不懂為何美秀其貌不揚但有這麼多男人迷戀他。

  尤其那些美秀交往過的男人都給過美秀大筆金錢最終死於燒炭自殺。


  我自己滿推這部劇是因為裡頭的善惡邏輯滿符合一般人的直覺，

  但順著直覺走又會發現矛盾之處，所以看下去不會覺得太無聊


  劇本寫的也很不錯，有很多組對映，讓人感到善惡幽微的一條線，

  一個翻轉就過去了。

  (開頭主播的婚禮到結尾的葬禮/主播身為美女被劈腿但醜女卻人人愛...

  檢察官看似愛女主卻利用他，牙醫男友看似劈腿卻說會保護女主，最後變成媽寶男

  本來尋求正義的主播卻成了他眼中的惡女...)



  這次惡女除了探討女性議題外，我覺得算是比較少數探討第二春的作品。


  第二春有多難得，難得到許多人飛蛾撲火，

  父母要追求第二春的時候，又有多少人認為不可能，一定是金錢的力量在作祟

  中年的真愛難尋，社會壓力不輸年輕人追愛，我們到底要如何看這整件事

  到底是像女主播用直覺保護父親(一定是女人貪圖錢?)、還是可以有其他可能。

  這點我一直覺得很少有電影願意去探討，

  但這次惡女算是比較勇敢去碰觸了這個部分。


  我覺得整部電影在得到一個好看的故事之餘，

  還可以對自己的心態面對不同議題(男女分工、第二春、正義...)有點反思

  而且不是以說教的方式，非常感恩XDD


  ===============


  總之算推這部電影啦!

  覺得是近年看到少數兼具商業價值跟議題性，而且不囉哩巴縮的國片XD


  而且都沒有會令我尷尬的台詞跟演員，覺得很值得去看看XDDDD




  --'
