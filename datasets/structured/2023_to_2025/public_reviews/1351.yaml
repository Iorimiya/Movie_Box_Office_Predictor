url: https://www.ptt.cc/bbs/movie/M.1506406821.A.606.html
title: '[微好雷] 惡女 '
content: '大家安安


  乳提


  最近發現自己會停下來按play的都是限制級電影


  惡女這名字夠中二直接煞氣
















  ==========雷雷=========


  開場就來個CS運鏡


  啪啪啪砍砍砍刺刺刺害我以為是追殺比爾


  女主一個人幹掉整個組織，怕.jpg


  後來被情報局抓去


  整形、接受各種訓練，最後用新身分替情報局出任務


  背負著替父親報仇跟10年的工作限期


  在一次任務中，她所要暗殺的目標竟然讓她震驚不已........


  =======================






  微心得


  一開始女主塑造成殺人能力很高的角色


  經過訓練後


  反而覺得打殺能力退步很多


  而最後的魔王也有點弱弱der


  劇情透過角色的肢體跟表情大概有猜到


  該爽的地方也有爽到


  這個女殺手


  勁!!


  韓國電影真的厲害


  --'
