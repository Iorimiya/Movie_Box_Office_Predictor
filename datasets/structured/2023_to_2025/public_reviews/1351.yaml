url: https://www.ptt.cc/bbs/movie/M.1700907215.A.6E9.html
title: '[可惜雷] 惡女，與她沒扔掉的老公'
content: '場次已經變成一天一場，趁著下檔前來看這部版上評價不錯但心得數不多的國片。


  以下有雷


  版上有篇心得說本片是女性爽片，故本來以為女主立美其實早就從頭掌控了局勢發展，操控周圍的男人幫忙把秀蘭關進監獄定罪，用素色內衣降低出軌未婚夫的性致，和政治幕僚學長喝小酒之際順便和鮮肉檢察官玩玩。


  殊不知立美真的一直被男人掌控於股掌之間，到爸爸燒炭自殺又接到編輯長的情報才發現自己被利用。


  她去看守所找秀蘭時我是期待她從秀蘭那邊取經兼合作把幕後黑手弄死的，可惜她只是去上了廚藝教室，然後從其他貴婦學員找到靈感下藥在料理中，把鮮肉檢查官迷暈後裝作燒炭自殺。


  兩年過去，立美當上主播，工作完回家後看到的是凌亂不堪的家和忙著打電動嘴上嚷著肚子餓的老公，面對這樣的老公，立美溫柔的笑著肢解鰹魚，沾滿鮮血的刀子和砧板是本部片唯一的血腥鏡頭


  撇開立美和檢察官大吵一架後隔天他就死掉然後警察沒從監視器畫面看到立美進出時間，遺書還是用電腦打出來的整個可疑到極點這些莫名其妙的問題，本片讓立美成功復仇卻讓她原諒出軌未婚夫還成為理想妻子讓我覺得本片的爽度打了折扣。


  也許有人認為立美已經是成功的惡女，最後砧板上的魚象徵她能隨意料理老公，但對於期待她甩掉軟爛未婚夫的我，這個結尾跟恐怖片一樣。


  未婚夫這個角色初看我是有點同情他的，隨意懶在沙發上結果丈人卻突然推門進來，像極了婚姻版常見老婆抱怨婆婆公公老是不請自來的抱怨文。

  工作忙到倒頭就睡，衣服只能仍在沙發上，想求歡但另一半性致缺缺，面對掌握主權的立美，未婚夫真的是個小委屈。


  然後他就不告而別了，這時候東西倒是很會收，在周圍都知道他和立美要結婚的情況下人間失聯，立美還是接到小三的挑釁電話才找到人。


  這裡有個點，一開始立美在床上詢問他是不是手術太累時我以為他是外科醫生，ok外科醫生忙到沒辦法打理家務很正常，但立美打電話到他的「牙醫診所」找人才得知他離職的消息


  好喔也許牙醫診所也是血汗工作要輪班值大夜還要隨扣隨到，但面對立美想要好好面對兩人問題時，未婚夫居然想用「是立美要忙事業所以婚禮要延期」當作理由和自己家人的解釋。


  哈囉？你這男人可以再軟爛一點沒關係啊，外遇有理都是立美不夠柔弱沒辦法讓你有保護欲，失去父親又學會做菜還穿性感內衣的立美就正中好球帶是嗎？


  比起設局背叛立美的學長和檢察官，未婚夫不但沒有認錯也沒有任何報應還爽爽打電動，真的火都起來了。


  可惜了結局不夠爽，衝著演員演技不會失望但結尾力道稍弱，本來要給好評的電影看完只能給普。


  個人評分75

  -----

  Sent from JPTT on my iPhone


