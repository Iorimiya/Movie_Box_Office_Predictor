url: https://www.ptt.cc/bbs/movie/M.1707620571.A.1F2.html
title: '[請益] netflix 惡女的幾個問題 (好看有雷)'
content: '好奇問一下


  Netflix 惡女


  有幾問題想請問


  1.

  她感覺是個滿重視女權的女生


  她為什麼要回收她未婚夫


  還每天煮飯給他吃


  這樣是為了什麼？


  最後那個殺魚 烤魚的畫面


  有啥暗示嗎？


  2.

  林美秀到底有沒有殺那些男人？


  還是那些男人愛不到她


  所以自殺


  真的跟她沒關係


  3.

  女主角為什麼要殺鳳小岳？


  是因為她覺得她父親是被鳳小岳害死的嗎？


  但不是因為她自己自認為要保護她父親


