url: https://www.ptt.cc/bbs/movie/M.1708077000.A.083.html
title: '[ 普負雷] 《惡女》劇情滿爛的懸疑片'
content: '如果是以電影院的標準，要花錢買票的話

  我給負雷


  因為是Netflix上看的

  所以給普雷

  無聊可以看一下



  劇情超級莫名奇妙

  轉的也很硬、又老梗


  莫名奇妙1：

  女主爸爸超級相信秀蘭


  假設1：爸爸知道秀蘭做了什麼

  那你幹嘛什麼都不講？趕快幫她澄清阿


  假設2：爸爸不知道秀蘭做了什麼，無條件相信她

  這個我就覺得更智障了

  突然發現一堆男的為了你的新女友自殺，完全都不懷疑嗎？都不覺得奇怪嗎？


  竟然還為了她自殺想翻轉案情......




  莫名奇妙2：

  女主殺人都沒留下蹤跡？


  檢察官燒炭那天，女主剛好從人家公寓出去

  一堆監視器怎麼可能沒拍到，都沒警察懷疑她真是厲害欸



  莫名其妙3：

  秀蘭的每個前男友都剛好是燒炭自殺


  被你霸凌又匯錢給你？

  被你霸凌就會自殺？

  自殺剛好都是燒炭？



  以上

  太多嘈點了

  簡而言之就是為了懸疑而懸疑，當搞笑片看還行







  最近聽說邵雨葳拍完戲後，入戲太深影響生活

  我真的快笑死，她再裝阿


  明明演得不怎麼樣，角色也沒什麼瘋癲的設定，最好是會入戲太深


  可憐哪



  --

  沒看過xd'
