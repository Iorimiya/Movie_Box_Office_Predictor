title: '[情報] 湯瑪遜麥肯錫、安海瑟薇將主演《惡女馬克白》導演新片'
content: '根據外媒的報導，《迷離夜蘇活》紐西蘭女演員 Thomasin McKenzie 與《女巫們》奧斯卡

  得主 Anne Hathaway 將共同主演新片《Eileen》。




  《Eileen》由曾以《惡女馬克白》闖出名堂的英國男導演 William Oldroyd 執導（該片曾

  經一手捧紅 Florence Pugh），是導演睽違六年的第二部長片。電影改編自美國女作家 Ot

  tessa Moshfegh 筆下的同名小說，由《怪咖情緣》和《列車上的女孩》的女編劇 Erin Cr

  essida Wilson 執筆劇本。




  故事背景設定在 1960 年代，一位名叫 Eileen Dunlop 的 24 歲女孩在一家只收男孩的私

  人少年管教所擔任秘書，逐漸發現這個「男孩監獄」真正意圖的他也在不知不覺中捲入了

  一場離奇的犯罪事件中。


  曾以《荒野之心》和《兔嘲男孩》等片展開知名度的紐西蘭女演員 Thomasin McKenzie 確

  定將在片中飾演女主角 Eileen，除此之外還有 Anne Hathaway 與電視劇《海濱帝國》男

  演員 Shea Whigham 演出未知的角色。


  此外，該片已確定將由近來以《犬山記》頻頻獲獎的攝影師 Ari Wegner 掌鏡。


  《Eileen》目前雖然尚未由任何公司官宣發布新聞，但已知是由探照燈影業所策畫的作品

  ，該片在 2016 年就曾被報導過《列車上的女孩》的女編劇 Erin Cressida Wilson 將著

  手進行改編的消息，如今才終於有了進一步的消息。


  該片已經於紐澤西的 Metuchen 中開拍，這個消息被市長 Jonathan Busch 發布在推特上

  ，也有現場側拍照可以看見演員們的身影。





  《Eileen》正式上映日期未定。



  --'
