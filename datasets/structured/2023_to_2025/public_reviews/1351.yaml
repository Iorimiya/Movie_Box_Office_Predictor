title: '[普雷] 惡女訂製服'
content: '雷文防雷資訊頁








  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~







  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  最近在飛機上看到這部電影

  一開始真的看不懂電影想表達的內容

  隨著緹莉回到家鄉照顧疑似失智的母親

  並挖掘過去被視為殺人兇手而被迫離開小鎮的線索，才慢慢看懂劇情

  裡面有幾幕讓我印象深刻


  其一

  劇中小鎮舉行球賽時

  劇中小鎮舉行球賽時

  緹莉一身華麗穿著和鎮上其他女人的儉樸呈現反差對比

  一個動作一個眼神都能讓球場上的男人失控，那段我快笑翻！！

  在一個枯燥乏味的小鎮裡，所有人事物都像既定公式一樣

  但緹莉的出現就代表打破一切的威脅！


  其二

  警長抽查緹莉包裹時，看到裡頭布料眼睛為之一亮

  不斷撫摸每塊布料，還拿在身上擺弄一番的眼神跟動作

  都讓人一目瞭然警長的秘密XD


  另外男主在電影裡真的是很養眼

  看到兩人繾綣後原以為順利收割男主

  然後男主就.....領便當了

  到後來母親的離開

  讓女主原本想重新融入鎮上的心態轉變

  即使衣服再華麗，人的內在醜陋仍無法改變

  看到結尾女主一把火燒了小鎮

  到鋪上紅毯離開那段的神情

  對比居民回到只剩灰燼的家園時

  臉上無比懊悔的表情就讓人解氣！


  --

  每個人看得不一樣嘛

  那段看了很舒服'
