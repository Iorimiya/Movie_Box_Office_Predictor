url: https://www.ptt.cc/bbs/movie/M.1708762509.A.5F5.html
title: 'Re: [ 普負雷] 《惡女》劇情滿爛的懸疑片'
content: "嚴格說來算是普雷，有好有壞吧，防雷頁\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n要說好雷的話，大概是林美秀演這個角色真的入木三分\n你會覺得「這樣子外表的女性能夠得到那麼多男性的歡心?」\n而且劇中林美秀的角色的名言幾乎沒有破綻\n\n\
  「我幫他作了那麼多，付出了那麼多，拿錢不應該嗎」\n(對啊，上班族不也是這樣)\n\n「我沒有殺人」\n\n她學習如何討好男性，取得他們的信任，並且對方願意給她錢。\n\
  \n當然本角色的原型來自木嶋佳苗，可是跟原型比起來\n\n她第一個沒有盜領對方戶頭錢財，所有的金錢都是對方主動匯進她戶頭的。\n\n再來，更重要的是，她告訴了小美「木炭的用途」\n\
  \n\n而且死者都有寫遺書。\n\n----------------\n\n林美秀把這個角色演的讓人牙癢癢的，十分厲害。\n\n---------------\n\
  \n\n缺點上，主要是在劇情結構跟描述上不太像是有深入了解台灣法治生態的劇本\n\n首先\n1、檢調不太可能在沒有直接證據證明她殺人的情況下就直接起訴\n  \
  \ 更何況是判定有罪。更更更何況是判死刑。\n\n   劇中檢察官的「唯一說詞」就是\n\n   「哪有那麼巧的事?」\n\n   嫌疑人的手法不明，沒有任何犯案的證據，甚至連動機都沒有\n\
  \n   「我錢都拿到了為什麼要殺人」這算是官方吐嘲??\n\n   檢察官要作的是去找證據證明她真的是實行犯。\n\n   講白一點，如果因為有人被分手自殺就要判有罪的話那還得了。\n\
  \n2、而且你還要證明她是因為想要對方財產才接近被害人。\n\n   不要說被害人死亡，檢察官甚至都無法證明她「騙人」\n\n   就連最初的被害者都無法證明她是騙錢的行為。\n\
  \n3、分手以後付錢給對方，我真想問這些男性到底是??\n\n\n然後女主角小美(這下不是亂取名)比較起來更糟糕\n\n演技生硬不說\n\n1、記者可以為了炒新聞私入民宅?(而且檢調沒帶走證據才妙)\n\
  \n2、劈腿劈的不亦樂乎\n\n3、因為發現自己被利用，然後就殺人? 汪洋大的殺意?\n\n\n然後新聞台的長官、下屬們的台詞簡直活像高中話劇\n\n\n-----\n\
  \n台劇不是沒有好看深入的，這幾年網飛的影集其實寫的都不錯\n\n沒有比較就沒有傷害，惡女這部作品就是很廉價的複製品而已\n\n\n--\n我國法律三審是法律審，原則上除非二審法條引用有誤。\n\
  但是現代法官要判人死刑要有200%的心證。\n比如「被告自陳+直接證據+間接證據」塞一大堆才有可能。\n\n這部從頭到尾既沒有突破被告心防，也沒有任何直接證據，甚至間接證據也沒有\n\
  超妙的"
