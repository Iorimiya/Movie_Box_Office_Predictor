url: https://www.ptt.cc/bbs/movie/M.1698674410.A.E56.html
title: '[好雷] 惡女 和預期不同但意外好看 '
content: '看預告以為這部是雙女主耍心機互鬥


  結果跟想像中差滿多，還滿新鮮的


  光看邵雨薇從頭到尾的角色變化之劇烈就很過癮


  整部片節奏很快，事件展開比想像中多很多


  看完有點像一口氣追完一整部劇的感覺……老實說有點累


  以下有雷












  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~



  整部片的劇情其實滿單純


  年輕女主角邵雨薇是漂亮能幹的女主播，還有一點戀父XD


  結果爸爸的新交往對象是外型不出色但有心機有手腕的惡女美秀姐


  邵雨薇想阻止兩人交往，深入調查美秀姐後發現越來越多不妙的事


  開始把爸爸、丈夫和檢查官等身邊的男人都牽扯進去


  自己也從完美模範生逐漸黑化成同樣為了目的不擇手段的惡女



  個人覺得最精彩的就是看兩個女主角吵架


  吵架不太算有來有往那種，通常是邵雨薇先開宮鬥模式話術挑釁


  然後在老江湖美秀姐一番太極回手後心態崩潰


  不得不說從邵雨薇從充滿餘裕到被戳中痛點破口大罵的演技真的很好看


  過年電視台有播很適合全家人一起配飯



  劇情最大的疑點就是美秀姐如何讓過去幾任男友都在匯錢給她後燒炭自殺


  這一點倒沒有抽絲剝繭的推理辦案


  至少在電影裡來看，美秀姐從頭到尾說的都是事實：因為他們愛我，他們自願的


  但這個事實實在太荒謬


  女主角不信、李檢不信、觀眾也不信


  所以劇情與其說在解這個懸疑


  不如說是女主角和檢查官兩個想辦死美秀姐的人利用自己的職權和對方合作


  再加入一點男女之間的情愛糾葛，讓礙眼的人退場，自己也得到最大利益


  每個角色的目標都很明確，行動也很合理


  雖然以現實層面來說應該是忽略了滿多細節……但電影演起來很順，我個人給過XD




  電影後段會發生什麼事其實都滿好猜的


  爸爸一看就會燒炭自殺，證明在獄中無法犯行的美秀姐是清白的


  李檢一副就是事情成功後會做出背叛行為和女主角分手


  但嚴重到隱藏關鍵證據被殺掉這點我倒沒想到


  劇情到這裡也有點像是「猜得到沒關係，我演出來看你怕不怕」


  老實說還真的有點怕


  因為電影裡沒出現什麼人性極端的黑暗面或是獵奇行為


  都是真的發生也不奇怪，但發生了還真不知道該怎麼辦的事


  以電影劇情的緊湊度來說，會連續做出好幾個錯誤決定導致最壞結果也滿可以接受



  個人還有一點很喜歡


  雖然電影沒有喜劇成份，但意外的有些地方滿黑色幽默


  有一幕女主角偷偷進美秀姐家，看到家裡有一幅超大的美秀姐全身肖像畫


  明明是很緊張的氣氛卻莫名好笑


  我看的那場有人直接笑出來XD


  買炭的原因真的是要做料理也莫名有種喜感


  期待推理解答的人大概會覺得被耍吧


  個人覺得荒謬感幫驚悚片加了一點醍醐味，還滿新鮮的


  --'
