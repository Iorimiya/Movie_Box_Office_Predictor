title: '[好無雷] 三張面孔'
content: '編導 賈法潘納希 在上一部《計程人生》透過影像捏造的虛實難辨與無處不在的監視，反

  映個人處境及社會問題，到了本片，同樣透過"偷拍(偽紀錄)"的表現手法與極簡的拍攝形

  式來完成，可是極高清的攝影畫面與四處遊走的鏡位，則成了強調攝影鏡頭的存在，又像

  在否定"偷拍(偽紀錄)"的真實性，相同於前一部的形式概念，卻有截然不同的隱含，前者

  意在抵抗，後者是對視而不見的表態。


  雖然等級落差上一部很多，但劇本還是是相當不錯，開頭自殺求救視頻大感驚豔，這並非

  那種峰迴路轉或是咄咄逼人的紮實劇本，反而像是沒有劇本般的，由散落的閒談間，挖掘

  潛藏在日常扯淡中的意識形態和對女性的刻板既定，藉由三位女性(不同面孔/身份)帶出

  伊朗女性的困境。

  收尾的最後一顆長定鏡非常厲害，在追逐自由的歧路上，不理會來往的幾聲喇叭(規則)，

  跨越過象徵傳統的牛隻，一顆鏡頭收攏了過去、現在、未來，三張面孔。


  可是最後還是要說，這些伎倆老前輩阿巴斯都玩過了，這部看來不免懷疑導演是否黔驢技

  窮了。


  --'
