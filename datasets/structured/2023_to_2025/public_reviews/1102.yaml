title: '[平雷] 北極百貨的秋乃小姐'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  \n\n\n\n\n\n－－－－－－－－－－閒聊當防雷－－－－－－－－－－－－\n\n原作為漫畫\n台版已出(兩冊全)　\n\n\n電影是到台北大直美麗華看的\n\
  \  \n\n選這家是因為廳最大!\n\n\n去美麗華意外的收獲是:『電影院位在裡，更貼近劇情了』\n包含那曲曲折折的上下行電扶梯 :P\n\n\n☂在雷到劇情之前，對正要去看片的人說一句無雷心得：\n\
  　不要預期太高，以「平常心」心態去看就好。\n\n☂如果是在[影展]看，可能我的心態就不一樣。[院線]買票比較肉疼XDDD\n\n\n\n\n\n馬齒徒增，我也老了。\n\
  感覺這部電影不是拍給中年人看的。\n\n這麼一想，\n70MIN的片長也有些蹊蹺。是不是為了年紀小的觀眾所以片長較短呢？\n\n\n\n主軸是女主角的「成長」，但又和好萊塢式不同，少了。\n\
  \n雖然有個臉長得像超人的監視者＆找碴客獸＝加勒比僧海豹，\n為女主角的職涯帶來大麻煩，\n但找碴的海豹如同原作漫畫、如同其他動物之戲份，在一個單元內解決。\n\
  \n\n接下來就有點茫然若失……  「嗄？沒了？」\n\n\n\n\n\n☑和巨大生物一起搭電梯，觀眾一定會想到吧！:D\n\n☂求婚時瞬間打聚光燈和深藍背景色，印象強烈。是黑白漫畫無法比的啊！\n\
  \n☑我也以為是企鵝。應該說我不知道有\"大海雀\"這種生物。\n\n☑企鵝的眼神和聲音都很棒…我是說大海雀。\n　動物們都很好。\n　猛瑪象講話慢配低沉聲音真棒。\n\
  　兩位人類前輩發揮的時間少，可惜。\n　東堂有點超越人類了XD\n\n☂一枚硬幣的購買力＝？\n　片中完全沒告知物價。是說光碟片也瀕臨絕種啦XD\n\n☑和漫畫不同，將所有滅絕生物集中一起介紹。改編合理，效果佳。\n\
  \n☂最後的森林好。雖然也沒能解釋世界觀。倒不如說更增加疑問了。\n\n\n\n\n☑獸化程度沒那麼高的作品我推薦，漫畫、動畫都有。\n\n\n\n\n特別推薦給喜歡(擬人化)的讀者～～在此就不爆雷了\n\
  \n\n\n☂看到還有《北極百貨的秋乃小姐》電影主題快閃店SOGO忠孝館一樓～3/20止\n呼~~幸好我看得早……\n\n\n☠不是作品問題，遺憾本肥不適合「日文敬語」和「法餐」這些高級品。\n\
  包含「百貨公司」也是。\n命也～～～\n\n宵夜就吃巷口還沒漲價的雞排吧……\n\n\n可愛動物不嫌多，雌雄老幼來百貨。\n不可say no何所止？待客之道更琢磨。\
  \  \n\n\n\n--\n                                       03/19 03:40"
