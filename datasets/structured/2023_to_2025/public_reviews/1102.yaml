title: '[普無雷] 北極百貨的秋乃小姐'
content: '#普無雷



  單純被畫風吸引去看這部


  結果繪本風格的作畫與色調真的是本部最大的優點了XD



  如果沒先了解這部的取向的話，看完會有點不明所以


  看簡介原本想說以滅絕生物為主體，會不會是另一部《動物朋友》!?


  不過事實上沒有燒腦的情節，這部只要平常心去看就好


  抱著太高期待，一直注意畫面是不是有伏筆


  或以為會像動朋那樣懸疑且令人深思的話


  看完這部應該會有點失望  <-- 這我(ry



  總之這部無論美術或劇情都是偏子供向的童話故事


  即使以平常心看待故事


  這種職場題材覺得還是前陣子的《駒田蒸餾所》好看多了


  這部的職場內容至少對本社畜而言沒有什麼討喜的部分 (汗



  以上






  --

  少女的，由我來保護







  --'
