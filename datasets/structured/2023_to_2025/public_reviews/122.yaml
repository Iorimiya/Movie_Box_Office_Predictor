title: '[問片] 有聽障和舞蹈劇情的電影'
content: '最近想到一部電影


  是國小五年級藝術人文課老師播的


  片名不太記得，劇情也只記得一部分


  只知道是關於一位聽障(或其他五官障礙)黑人女孩


  無法完成跳舞的夢想 只能透過震動來聽到聲音


  他的哥哥意外遇上主角並尋求協助


  以上是我僅有的片段拼湊出來的劇情><


  年代應該介於1995-2005之間，應該是2000年上下的片


  背景是發生在美國大城市(紐約那樣的城市~~~)


  Google關鍵字也找不到片名


  希望版上有人可提供解答~~~~~~


  --'
