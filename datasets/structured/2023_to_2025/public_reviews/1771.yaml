url: https://www.ptt.cc/bbs/movie/M.1679111456.A.1CD.html
title: '[好雷]《流水落花》，淡淡交會過，各不留下印，'
content: '部落格版：


  由香港政府支持成立的香港電影發展局所推行的「首部劇情電影計劃」自2013年首屆以來

  ，選出了不少優秀作品並給予了實質上的贊助，其中更有許多作品不論是在香港電影金像

  獎、香港電影評論學會大獎、香港電影導演會年度大獎，甚至是在台灣金馬獎上均有不少

  斬獲，例如首屆得獎者《一念無明》、《點五步》、《藍天白雲》，第三屆的《淪落人》

  、《G殺》等等，第四屆更有《手捲煙》在當年金馬獎獲得七項提名，另一部《金都》亦

  獲不少獎項提名肯定，而上述作品都曾在台灣影展或是院線放映過，到了今年一口氣還有

  《過時·過節》、《流水落花》與《燈火闌珊》三部反映香港現代社會的作品接續在台灣

  上映，真的只能說台灣影迷真的是幸福的，因為這些獲選作品最終成果質量都是好的，題

  材選擇上都很有意思，雖然可惜在去年金馬獎上僅有《燈火闌珊》入圍兩項，不過《過時

  ·過節》和《流水落花》都有被點出來是遺珠，尤其是後者的主演鄭秀文，其實很該入圍

  金馬獎最佳女主角的。


  鄭秀文在《流水落花》中繁花落盡，洗盡鉛華，以相當內斂的演技在詮釋失去兒子後內心

  變得空洞茫然的母親，和過去她所演出過的角色有著很大不同，徹底擺脫鄭秀文自己，將

  幾十年來的歷練內化而成新的、他人口中的天美姨姨，沒能獲得金馬獎提名實在可惜，導

  演賈勝楓同樣錯失最佳新導演入圍同樣也是我這裡的遺珠。不過雖然在金馬獎上失利，《

  流水落花》在香港卻有不少收穫，鄭秀文除了連續收下兩座影后獎座，同時更以本片得到

  第十個香港電影金像獎提名，即使屆時將對上憑《燈火闌珊》三封金馬影后的張艾嘉，且

  單評演技確實還是早已不是在表演的張艾嘉表現略勝一籌，但整個感覺上就和剛結束的奧

  斯卡很像，有種必須得是鄭秀文得獎的氛圍感，只是假使最後真由鄭秀文拿下最佳女主角

  ，以她在《流水落花》的表現真的也是實至名歸。


  近幾年的香港電影在題材的選擇上很多都傾向於放在當今香港社會問題，例如《麥路人》

  和《濁水漂流》分別以麥難民與街頭露宿者為關注對象，以婚姻來比喻與中國關係的《金

  都》，就連警匪片《智齒》都在關懷著在社會角落拼死求生的底層人們，而《流水落花》

  則是以需要更多人關注的寄養家庭數量日漸減少的問題為題材，並將之自然的延伸到夫妻

  、婚姻課題，讓觀眾在跟著知道香港寄養服務與寄養家長在生活與心理上的影響外，亦能

  同時看到存在於一對夫妻與一個家庭裡的情感流動與變化，而不論從哪種角度切入，都能

  讓人有所反思。



  「流水很清楚，惜花這個責任，真的身份不過送運，這趟旅行若算開心，亦是無負這一生

  。」


  陳奕迅一首《落花流水》唱的是與人之間的感情，以及那分與合的無常，但是否歌詞的意

  境放在了《流水落花》裡也能成立？「天下並非只是有這朵花，不用為故事下文牽掛，要

  是彼此都有些既定路程，學會灑脫好嗎？」，幾句歌詞像似在告訴擔任寄養家庭的天美，

  是該習慣與來這寄養的孩子們的離別，莫讓私人情感成了給孩子們一個家的阻礙，畢竟投

  身此業是她自己的選擇，「淡淡交會過，各不留下印，但是經歷過，最溫柔共震。」，如

  同電影的最後，七位在她這一生中照顧過的孩子們，用他們與她相遇時的年紀與樣貌，依

  序的回到曾與她相處過的這個家，一字排開的站在她眼前，那幾抹笑容與淚水不就是她與

  他們生命曾經交會、並且留下美好回憶足跡的證明？而同樣的，這首歌某方面不也能來形

  容天美姨姨與彬叔叔的婚姻狀態，「講分開，可否不再用憾事的口吻，習慣無常才會慶幸

  ，講真，天涯途上誰是客，散席時怎麼分。」，夫妻情感由濃轉淡或許自有原因，可若此

  因難解造成走到盡頭，即便分開亦是緣分。


  早從剛開始，看著天美首次擔任寄養家長，從她對待首個來到她家的寄養男孩文森與丈夫

  何彬的態度有異，便不難猜出或許兩人曾經有過孩子，而孩子不論什麼原因離開了他們，

  都讓他們之間自此開始有了距離。順著劇情發展，這項猜測確實得到了解答，兩人三歲的

  兒子因心臟問題不幸去世，而隨著兒子的離開，讓好不容易圓滿的家庭再度有了缺口，於

  是觀眾又能夠想像的，是天美是否是想藉著成為寄養家庭，來再次感受擁有孩子是什麼樣

  子的感覺？然後再跟著向下走，這個推論也有了八成的肯定，於是選擇寄養家庭、擔任寄

  養家長這個決定，可以說是天美在用著自己的方法，試著重新讓日子、這個家還有與何彬

  的關係回到往昔。因此從後半生開始的數段相遇與分離都是學習，學習如何再當母親、學

  習如何修補與丈夫間的裂痕、學習如何自我調適然後學習釋懷與放下，她看似在幫助這些

  孩子，其實是她也從這些過程得到幫助，鄭秀文為戲所唱的《我就這樣活了一天》，不如

  說成「我就這樣活完後半生」更為貼切。



  回到《流水落花》的題材上來看，導演賈勝楓在寄養兒童上的安排別有用心，不只有文森

  、包含後來來的菁菁、小花、明仔、家希與家朗姐弟還有最後的仲恆，他們各因不同的理

  由被安排到寄養家庭，等待回到原生家庭、甚至被領養的機會，說明了香港其實有越來越

  多個案等待被處理，但卻有著天美這樣一打七的情形存在，顯示著能夠提供協助的寄養家

  庭嚴重不足。而後面一場莫姑娘與天美的對話，其實也點出了寄養家庭若在未像社工這樣

  受過專業訓練，最怕的就是用了真心後卻動了真情，這會讓寄養家長離不開寄養兒童，相

  關機構也會難以辦事，加上後面當領養小花未成，天美對待小花的態度可以說是一百八十

  度大轉變，不過幾分鐘時間即讓觀眾認知到，要成為寄養家庭最重要的或許不是能否給予

  寄養兒童優渥的生活品質，而是在於能否有那個勇氣與準備去面對、接受每次的離別，成

  功完成「寄養」的使命。


  《流水落花》是部可用閑靜淡雅來形容的作品，沒有太多明顯的轉折，而是藉著某些小細

  節的安排、妝髮上的不同，來讓觀眾去感受電影裡頭時間的自然流動，還有這個家裡的氣

  氛轉變，當然還有天美自己的心境變化。導演賈勝楓對於敘事的掌握很好，雖然剪接上多

  少會造成觀影上的情緒中斷，但《流水落花》是部重在感受的作品，情感至少是能夠延續

  至最後、甚至在後來讓人有所感動。至於鄭秀文的演出已不用多說，飾演其丈夫的陸駿光

  表現亦恰如其分，將努力想要改善卻日漸無力、只能看著妻子離自己越來越遠，而自己也

  只能放任自己疲憊後出軌的丈夫詮釋的很有感覺，不過整部電影最讓人驚艷的，無疑就是

  七位小演員的演技整齊劃一，完全不見經驗不足的生澀，相當自然的和鄭秀文與陸駿光相

  處互動，其中最喜歡的就是飾演小花的吳祉嶠，那場家長運動上的無助模樣，真的讓人看

  了心疼不已。


  最後還是得說，鄭秀文該拿獎了。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
