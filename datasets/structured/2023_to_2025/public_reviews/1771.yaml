url: https://www.ptt.cc/bbs/movie/M.1679289120.A.FED.html
title: 'Fw: [好雷] 《流水落花》彼此皆為彼此的落花'
content: '作者: elvayanzimei (柏C) 看板: HK-movie

  標題: [心得] 《流水落花》彼此皆為彼此的落花

  時間: Mon Mar 20 13:11:06 2023


  雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  1.影片名稱：流水落花


  2.觀影時間：2023/03/20


  3.觀影地點：信義威秀

  （近期同場進場人數最多的港片！只是每次電影安靜下來的時候，就會感受到對面廳《沙

  贊》的轟炸R QQ）


  4.觀影方式：自行購票


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  部落格圖文版：


  接續著前兩個週末所看的《本日公休》與《過時．過節》，實在是不曾想過有這麼一天，

  我會連續三週都為了親情電影而進電影院。然而在這個親情電影輪番上陣的過程中，我心

  中對於這一部部以「家庭」為核心概念出發的作品，它們所能企及的範疇也不斷地在動態

  調整。


  從《過時．過節》對比《本日公休》，家庭成員間的齟齬，並非一定得導向某個共同的解

  答，但這兩者即便有著各自的面對之道，它們都還是基於我們一般認知中的家庭概念。因

  此，以寄養家庭為主軸的《流水落花》再次地拓展了我對「家庭」電影的想像：並非只能

  局限於固定的家庭成員，也並非一定要聚焦於單一事件。


  《流水落花》的故事主要以天美與何彬夫婦，和七個有著不同成長經驗與個性的孩子，彼

  此伴隨共度的六段歲月所組成。在不同的寄養歲月之間，電影以全黑轉場凸顯段落感，讓

  我直覺地將《流水落花》與前陣子的《緣路山旮旯》連結，《緣路》在兜兜轉轉間探討何

  謂愛情，《流水》則在時光流逝中，從不同面向將「家人」間的羈絆刻劃清晰。


  若單論概念，電影替每個段落所設定的主題其實並未有太多突破空間。以天美兩人最先照

  顧的兩個孩子森仔、菁菁為例，人與人究竟是因為血緣，抑或彼此關愛而成為家人，在影

  視作品中辯證的次數就已非老生常談所能形容。


  「剛剛只要你說一句，我就會為你出頭。」


  而在《流水落花》中，這些辯證幾乎全部內化成了角色之間的互動。天美與森仔從吃冰無

  語到破冰互信，因他和彬叔叔一起替自己慶生而喜，為他像「貨物」一樣必須緊急再安置

  而傷；她不因菁菁的挑食而放棄，而是一起探望菁菁外婆，回家再一起包著外婆所傳授的

  榨菜水餃。無須任何言語，天美兩人與孩子間的關係變化已在互動中展露無遺。這樣的「

  意會」也在莫姑娘初訪天美家時展現地淋漓盡致，談善言東摸一下傢具邊角，西搖一下鐵

  窗，就是為了確保孩子們有安全的環境。


  「不要亂叫，叫天美姨姨！」


  隨著一個個孩子的到來，「寄養」這種暫時的家人關係無可避免地受到挑戰，當付出了情

  感，又有誰能真的說放就放？面對兔唇女孩小花的離去，天美幾乎是把「鬧彆扭」三個字

  寫在臉上地替她收拾衣物，嘴裡更毫不示弱地指責她「不要亂叫！現在才那麼多麻煩。」


  「抬起頭，不用理會他人。向前跑，知道嗎！」


  為了小花，天美在運動會上賣命狂奔；想及小花，天美放下了就將點起的煙後更整包丟掉

  。《流水落花》刻劃兩人間羈絆的意會也並不僅止於行為，「空間」意味著歸屬，因此在

  小花把椅背貼滿貼紙時，天美其實早已接受了小花。而她為了幫小花跨過兔唇的坎，在鏡

  子貼上花朵時，更強化了這樣的象徵。


  「替她找到最適合的家，是一種祝福。」

  「我們真的有能力負擔她的醫療費用嗎？」


  天美並不是不理解莫姑娘與丈夫所言，是因為她真的很愛很愛小花，然而「寄養」終究是

  在孩子們被收養之前的一種過渡狀態。只是在孩子們離開的同時，難道彼此間的家人關係

  就再也不復存在嗎？


  《流水落花》在後三段歲月，從不同的視角看待著天美的不甘。


  體貼懂事，在莫姑娘來訪時，既焦急又冷靜地替天美兩人掩蓋照顧疏失的明仔，真的乖到

  連花姐客串的雜貨店老闆娘，都忍不住要塞糖果給他，可是明仔的角色其實是功能性的。

  對比天美在三人的圍爐中，刻意忽視出軌的何彬，她不只替明仔夾菜，更拉著他走到陽台

  上看煙火，這時何彬和她們之間就如同有道無形的牆。關係有了裂痕，好像就再也無法修

  補。


  直到家希、家朗兩姐弟的到來，他們的頑劣叛逆，真的讓我在銀幕外都替天美感到頭痛。

  又是搶零食又是摔東西挑釁天美，「你就被個腸仔包收買嗎？」就連她準備的早餐和腸仔

  包都被當作別有居心，只有彬叔叔能以孩子王的方式治住他們，但這對姐弟，卻成為了天

  美兩人關係修復的契機。在頂著暴雨上山帶回兩姐弟後，天美淡淡地說了句「沒事了。」

  ，與她這個時期不苟言笑的形象簡直天差地遠，蘊含的關愛卻真摯無比。


  「你（何彬）是我們遇過最好的大人，只輸我們的爸爸。」

  「天美姨是壞一點，但是是第二好的。」


  或許曾有芥蒂，或許有過遺憾，而不能成為彼此的最好。「你覺得滔仔是哪顆星星？」然

  而在認可對方的歲月中，彼此的家人關係，都是確實存在的。


  「你之後就會想搬出去啦！」

  「想回來吃飯喝湯，再打電話給我就好啦！」


  伴隨著一位位孩子，走過一段段歲月，《流水落花》在這些相處的時光中，分別從父母與

  孩子的角度出發，雙向地探討彼此對於家人的想像。最後一段寄養歲月裡，儘管孩子表達

  了受領養的意願，天美卻已不再執著於收養孩子，或許彼此不是名義上的家人，但早已是

  貨真價實的親人了。而鄭秀文對天美從徬徨到熾熱，再歸於釋懷的傳神詮釋，賦予了這六

  段歲月飽滿的層次。


  在電影的一開始，便帶出了流水與落花的意象：花落於水後，水卻不會為花而停留，如同

  這些孩子一般，終究會離開承載過他們的寄養家庭。《流水落花》中大量地運用了天美在

  橋上拖著菊花茶的重複鏡頭，好像她日復一日的做著同樣的事，唯一變化的只有旁邊的孩

  子。


  「滔仔他不斷以各種方式回到我的身邊。」


  然而在天美彌留之際，當她照顧過的孩子一個個從房內走出，共同歲月中的她，早已陪伴

  著這些孩子們不斷前行。而在她帶著滔仔的落花，將那份愛分享給一個又一個的孩子的同

  時，「我以為我們已經撐過去了。」每一個孩子的認可，其實也一次又一次的圓滿著她的

  遺憾。《流水落花》在最後又回到了橋下的流水與落花，這次我卻覺得，生命如同流水，

  而彼此皆為彼此的落花，在能一起的時光中，好好相伴對方向前漂流。


  --


  部落格：

  FB粉專：


  --'
