url: https://www.ptt.cc/bbs/movie/M.1699807231.A.44B.html
title: '[好雷]《流水落花》關於親情的冷門港片'
content: '《流水落花》是由鄭秀文所主演的親情電影

  內容主要在講親生兒子病逝的陳天美與丈夫何彬申請成為寄養家庭

  期間歷經了七位不同寄養小孩的故事



  ---------雷--------------------------------


















  何彬總是以孩子王的身份與孩子們相處

  而天美則有著直爽的性格，個性較為直接

  比起何彬，天美更像是家中那個辦黑臉的角色

  也因此與孩子之間的關係更難以親近




  這些孩子有的母親染毒、有的父母離婚被當人球踢

  有的患有罕疾、有的渴望家、有的對大人失去信任

  也有的是即將就讀大學的少年

  都是不得已被社會局安排至天美夫妻家中




  因為是寄養家庭，是找到收養父母之前的過渡站

  短暫的時光應當不會有親子之間的情感出現

  但是短短的時光中，天美與孩子之間確實出現親情

  原因正是天美為孩子著想的心隱約出現在每次的陪伴之中

  就算孩子再小再天真，真實的感情是不會騙人的


  在照顧孩子的期間天美與何彬的感情出現裂痕

  何彬是想要跟天美再生一次孩子的

  但是天美很害怕孩子會像第一個一樣早逝

  天美也早已再照顧寄養孩子的同時獲的家的感受

  因此完全忽略了何彬的想要的是什麼

  何彬甚至在外偷情，夫妻之間產生了裂痕

  當然出軌就是不對，但出軌得背後也有其因

  自開始做寄養家庭後，何彬也確實被天美忽略

  吵架時，天美甚至大罵何彬根本對第一個孩子的死沒那個在乎

  應證了兩人關係早已有裂痕以外

  更顯示了彼此已經很久不知道對方想要什麼




  但有誰真的會對孩子的死冷血，何彬只是不想顯於外表上

  因為若這時他放聲哭出來，那誰來安慰天美

  因此像很多家庭的爸爸一樣，獨自一人承受

  只是因為兩人的不理解，而使的裂痕越來越大

  直到收養了下一對調皮的姊弟，才真正的修復關係


  電影最後，收養了一位即將升大學的青少年仲恆

  仲恆主動的向天美表示想被收養

  但天美此時卻拒絕了，卻說上了一句

  「之後你就會想般出去啦！想回來吃飯喝湯，再打電話給我就好啦！」

  此時的天美，早已懂得什麼是家

  不是法定上的名義，也不是血緣上的羈絆

  如同電影的名字《流水落花》

  父母就像是流水推著花朵般的孩子前進

  落花總有一天會流向大海離開流水

  這並非不好，日復一日的推著生命前進

  孩子也可以是父母的流水，推著父母前進

  能再生命短暫的時光中能相互陪伴，這就是家的意義




  --'
