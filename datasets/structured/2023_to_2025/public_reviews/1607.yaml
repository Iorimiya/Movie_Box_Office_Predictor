url: https://www.ptt.cc/bbs/movie/M.1686499359.A.F81.html
title: '[ 負雷] 萬獸崛起之抓癢抓不到癢'
content: '我是變形金剛第一二集的超級粉絲，

  國中時還存錢蒐集整套正反派玩具。


  接著越來越受不了切很碎的戰鬥場面，

  完全記不住每隻機器人名字外表特色，

  我就放棄沒看後續的作品了。


  直到這次萬獸崛起直接讓我回味童年，

  小時候超愛看卡通版金剛王對恐龍王，

  尤其後來還有改型態電鍍版帥到爆炸。


  進去看萬獸崛起我期待的是雙方對壘大戰，

  結果搞半天怎麼又是柯博文大黃蜂汽車？

  根本搶走金剛王的戲份啊完全本末倒置，

  再來其他豹鷹犀牛都沒戲份打鬥也超少，

  老鼠直接神隱沒出現這是卡通重要角色！


  反派也很瞎恐龍王呢？其他恐龍呢？

  又出了免洗機器人當反派柯博文卻打不贏，

  是只有我期待的打鬥跟普羅大眾不一樣嗎？

  我只想看傳統動物金剛對恐龍金剛大戰欸，


  全程都感覺打架有點爽又不太爽，

  人類男主角耍腦邏輯死去的行為，

  還穿上幻影盔甲變洛克人射子彈，

  女主角也沒成功解除危機在幹嘛...


  回家只想重新回味卡通版比較過癮，

  這完全跟我想像的野獸大戰不一樣。



  --'
