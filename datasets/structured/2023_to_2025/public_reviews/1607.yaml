title: '[討論] 變形金剛 萬獸崛起 爛番茄 53 %'
content: '目前 爛番茄 53%


  66個評分 35個好評 31個差評


  這部我昨天去看過 , 給 7/10 算是好評


  我覺得評分是否太嚴格了


  整部片 算是緊湊 不拖泥帶水


  有人說最後的打鬥很好 , 我倒覺得處理的不夠細膩


  片名是萬獸崛起


  但我只看到幾隻獸


  我覺得應該把更多重點放在 主題 "萬獸"崛起



  基本上我覺得很是可以進場看 , 沒有爛番茄評分的那麼差




