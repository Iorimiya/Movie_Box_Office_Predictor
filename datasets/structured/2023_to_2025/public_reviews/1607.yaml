title: '[無雷] 小輸第一集的變形金剛萬獸崛起'
content: '直接講優點


  人類戲份偏少，找線索時間不常，過去跑過一堆爆炸還沒事加親來親去的蠢橋段幾乎沒有


  變形金剛又多又中二，打架畫面多，帥氣


  反派夠強，看了過癮


  很多風景很壯觀


  雙主角皮膚黑黑的，但不會覺得很刻意的選角



  缺點：


  變形的畫面偏快偏少


  反派金剛很強但不夠多，大抵就三支，沒有恐龍王與密卡登等好可惜






  萬獸崛起雖然輸變形金剛一，但絕對狂勝變二到變五，超棒的爆米花電影


  評分：8.1/10




  -----

  Sent from JPTT on my Google Pixel 6a.


  --'
