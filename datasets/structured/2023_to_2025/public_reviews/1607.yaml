url: https://www.ptt.cc/bbs/movie/M.1686146542.A.7E6.html
title: '[負雷] 變形金剛 萬獸崛起'
content: '原本想給普雷，但看完越想越不對勁還是給個負好了


  先講優點

  1.有麥可貝宇宙的配樂

  大概在快收尾的時候出現，沒聽錯的話應該是這兩首，我覺得使用的時間點不是很好




  2.狂派沒有出場

  小弟我狂派粉，看到這部慘烈的造型只能說還好狂派沒出現


  好了優點沒了，來講缺點


  1.柯博文人設崩壞

  這部的柯博文還滿像個老番癲，很沒有領導的感覺，跟以往的電影、動畫形象差滿多的，劇中有給解釋但說服力不高，看到一半反而會覺得為啥矩陣會選他當至尊


  2.野獸戲份很少

  除了神鷹跟金剛王，其他角色得戲份大概預告都演得差不多


  3.最後決戰的配樂

  前半都還好頂多沒記憶點，大黃蜂回歸登場放了一個風格差很多的配樂，而且滿難聽的


  4.反派

  這集的反派老實說沒什麼記憶點而且造型真的不好看，威脅性也不如第一集的密卡登跟天王

  BOSS旁邊那兩位收得滿草率的，有一位某方面來說應該是被BOSS自己幹掉的


  5.千斤頂一定得罪電影公司



  人類的部分我看滿多人講得就不提了，原本想噴那個鋼鐵人裝，但結尾看到G.I Joe似乎可以理解為啥設計那個橋段


  如果下一集狂派有回歸變主要反派我還是願意進場支持，沒有的話就只能串流見了



  -----

  Sent from JPTT on my Samsung SM-A528B.


  --'
