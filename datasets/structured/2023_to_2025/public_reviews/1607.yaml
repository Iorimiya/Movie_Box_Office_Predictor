title: '[負雷]  變形金剛7萬獸崛起：無腦看特效'
content: "雷文防雷資訊頁\n\n\n\n\n\n\n\n\n\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n乏善可陳的優點：\n\n1、終於帶入其他系列主角可以發展劇情\n      （+幻影取代大黃蜂）\n2、機器人變形過程大幅簡化\n      （個人觀點喜好）\n\
  3、人類世界比例大幅減少\n\n以下滿滿吐槽：\n\n1、布魯克林的黑人魯蛇，看不出來曾經是很厲害的通訊兵，沒有團隊意識的過往也交代\n不清，退伍後如何淪為布魯克林魯蛇只能自己腦補。\n\
  \n2、弟弟生病很可憐，但整個設定拿掉好像沒差。\n\n3、男女主角都是面癱沒有演技，表情眼神沒有層次，男主永遠衰臉，女主永遠傻臉。\n\n4、女主只靠幾頁筆記東畫西畫就能快速分析哪種文明哪種文字哪裡的古蹟，能力設定跟\n\
  她年輕面呆的外型實在不搭。\n\n5、整片裡飛車賊頭頭（演技/戲梗）真的很難笑。\n\n6、完全無法理解荷魯斯石像被3D掃描後立刻碎裂的物理機轉+鑰匙發光卻不燙手的設定。\n\
  \n7、博物館大戰，瘟疫抓住大黃蜂往胸口開砲就死了，男女主角被砲飛兩次+機械獸兩隻追\n殺卻只有小擦傷。\n\n8、博物館大戰，神鷹是正義方在場最強的，為什麼不變成人型跳下來打？\n\
  \n9、女主角演技奇差，眼神和ACG變形金剛的位置常常對不上，非常出戲。\n\n10、女主角經過連串驚嚇（外星機器人攻擊）+闖下大禍（博物館被毀、神像被毀）竟然\n\
  沒有想直接落慌而逃，還跟著繼續大冒險...\n\n11、兄弟告別片段，幻影踩爛汽車部分似乎在致敬第1集的大黃蜂（男主庭院被毀），但\n本集是公寓大樓間的巷道，巨大聲響竟然沒有驚擾到鄰居，唯一的作用是讓弟弟注意到外\n\
  頭有機器人...\n\n12、實在無法體會布魯克林魯蛇奮起想當救世英雄的心路轉折+男主持續面癱衰臉。\n\n13、古董運輸機的擬真特效非常差，跟其他變形金剛像是來自不同維度，好像宮崎駿天空\n\
  之城跑出來的。\n\n14、福斯麵包車，你的功能是掃描教堂底下有異常能量（=鑰匙）對吧？為什麼鑰匙真正\n的位置是隔了兩個山頭的原民部落裡？如果我是柯博文我一定先把你的頭拔下來。\n\
  \n15、換句話說，男女主角去找教堂密道+機械獸二度追殺整段都可以拿掉啊，裡面又沒東\n西，加了這一段是怕電影太短？\n\n16、再問一次，金剛王、花豹、犀牛帶著另一半鑰匙躲在秘魯森林的原民部落裏，為什麼\n\
  神鷹找了幾千年找不到？恐懼金剛卻1天就找到了？\n\n17、在博物館大戰被瘟疫壓在地上摩擦的柯博文，在天空之橋忽然開無雙硬是把瘟疫砍了\n，請問柯博文是吃了什麼藥？\n\
  \n18、反過來說，瘟疫讓神鷹中毒逼得金剛王將其反殺領便當，這段劇情的必要性？（反正\n會贏就是靠柯博文開無雙啊）\n\n19、掠奪金剛放出上千隻的雜魚就困住了博派和強大金剛...\n\
  \n20、大黃蜂死得稀鬆平常，劇尾復活也是莫名其妙，不知道他屍體所躺的能量石是如何在\n鑰匙歸位後被引導出能量可以讓他的？\n\n21、無法感受男主性命垂危時，被弟弟一通電話激發的小宇宙...（每個角色的演技情緒\n\
  都\n很扁平）\n\n22、已經被吐槽n次的廉價版鋼鐵人+科學小飛俠玻璃面罩，更莫名其妙的是男主穿著機器\n裝腦充單挑瘟疫，為什麼不趕快去救女主角來移除鑰匙？\n\
  \n23、女主角孤立無援遲遲無法接近鑰匙，三度被機械獸追殺...\n\n24、柯博文抓不住斷橋差點飛走，能拉住他的竟然是穿著機器人裝的男主...\n\n25、片尾柯博文獨白完（致敬1、2集），場景和音樂忽然硬切成主角獨白+兄弟和媽媽三\n\
  人擁抱，我覺得維持同一首歌觀眾情緒才不會斷掉吧...同首歌一直連到GIjoe彩蛋也好啊\n，有夠奇怪的剪接方式。\n\n==\n\n總評：\n變形金剛7傳承了\n\
  全系列都不能帶大腦去看的風格\n就是去看ACG和特效而已。\n\n--\n覺得發光跟燙手不該同時成立的\n智力比較堪慮\n換人類主角就叫系列重啟？\n那美隊4要不要改名叫黑美隊1？\n\
  \n劇組設定新的拉黑男主要演3部曲\n（如果沒有換角）\n新的三部曲是以博派主軸再拉進強大金剛\n時間點設定在變6（大黃蜂）與變1之間\n屬於同宇宙的另一段時間線\n\
  柯博文和大黃蜂只是改成符合年代的車款\n這叫做重啟？\n閣下物理奇才"
