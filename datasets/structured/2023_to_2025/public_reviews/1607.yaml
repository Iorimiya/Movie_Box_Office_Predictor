title: '[普雷] 變形金剛：萬獸崛起'
content: '沒有萬獸只有四聖獸

  東金剛 西神鷹 南犀牛 北黃豹

  這四隻而已...


  最後大戰中聖獸發揮很大作用打小兵

  印象比較深的是東金剛搶柯博文的對手後補刀

  還被柯博文小抱怨一下

  接下來對聖獸在大戰就沒印象了...


  男主在開頭有小秀一下維修技能

  想說之後看哪邊可以炫耀一下

  嗯 沒什麼地方發揮到

  男主的軍人身份也沒啥作用...


  女主就目前潮流的正常發揮

  沒啥好說的


  孩之寶這次應該是想推幻影的人形鋼鐵裝玩具吧

  這套鋼鐵裝沒啥特色的說，就平平的

  男主要換上鋼鐵裝時，幻影跟他講的台詞

  應該要翻成由你來駕駛，而不是翻由你來開車吧？！

  講完台詞後，還想說是準備把重傷的幻影變成汽車型態衝進戰場嗎？

  結果是變成鋼鐵裝給男主裝備來戰鬥


  這部的吉祥物改成幻影了

  一些笑點跟人類互動都是幻影來擔當


  前幾集的吉祥物大黃蜂

  在前期就下場休息了，直到最後大戰才出面一起作戰


  反應不錯的話，之後的吉祥物應該就變成幻影了...





  這部對某些人來看的話應該是很無聊的吧？

  看到文戲部分還可以拿手機起來滑

  越暗的地方你越亮



  --

  (=‵′=)


  親愛的再愛上我一次>\\\<


  --'
