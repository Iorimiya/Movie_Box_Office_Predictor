url: https://www.ptt.cc/bbs/movie/M.1685025878.A.44F.html
title: '[新聞]《變形金剛：萬獸崛起》好評如潮！外媒盛讚'
content: "《變形金剛：萬獸崛起》好評如潮！\n外媒盛讚：系列最佳、文戲紮實、插曲和動作戲讚嘆無比\n\nJoker 2023-05-25 21:56:23\n\
  \n\n（圖片來源：派拉蒙影業）\n\n《變形金剛》（Transformers）系列電影最新篇章《變形金剛：萬獸崛起》（\nTransformers：Rise\
  \ of the Beasts）今天終於解禁了首波媒體評價，這部由《金牌拳手\n：父仇》（Creed II）導演-小史蒂芬卡普爾（Steven Caple Jr.）執導的全新三部曲序\n\
  幕目前斬獲了頗為正面的好評，各方均普遍稱讚是本系列之中品質堅實的佳作，滿意度極\n高。\n\n\n\n「我可以高興地說《變形金剛：萬獸崛起》是系列最棒的一部之一，極富娛樂性，特效很\n\
  精緻，而且動作戲的編排不會很凌亂。我看的那場試映真的有人看到鼓掌，小孩也笑得很\n開心。」\n\n\n\n「《變形金剛：萬獸崛起》承襲《大黃蜂》所有優點，並加以放大！安東尼拉莫斯與多米\n\
  妮可菲許巴克貢獻了出色表演，彼得戴維森配音的幻影在他出現的每場戲都超搶鏡。身為\n卡通版和整個系列的粉絲，我真的很享受這部片！」\n\n\n\n「超愛《變形金剛：萬獸崛起》！中段有一些毛病，但開頭很精彩，而且穿插了很棒的九\n\
  零年代嘻哈樂，人類的戲份有適切發揮，第三幕更是大呼過癮，我差點要從椅子上跳起來\n。足以與麥可貝第一集和《大黃蜂》並駕齊驅。」\n\n\n\n「動作戲精彩到刷新鏡界！柯博文在一場野心勃勃的大亂鬥之中強勢回歸，滿場令人讚嘆\n\
  的動作戲絕對能滿足你的期待，娛樂性破表。這不只是一般的電影，這是史上最棒的《變\n形金剛》電影！它還已經為下集鋪好路了。」\n\n\n\n「最新一集的《變形金剛》很紮實！超愛他們以布魯克林為舞台的設計\
  \ — 強大金剛和災\n厄的登場帶來了新局勢。動作戲超讚，特別是紐約市那段。幻影搶盡鋒芒，但真正的亮點\n是列滿九零年代初期熱門嘻哈樂的超棒原聲帶，九零後的孩子絕對會看得超開心。」\n\
  \n\n\n「《變形金剛：萬獸崛起》超好看！《野獸戰爭》的角色終於在一部可以說是目前最棒的\n《變形金剛》電影裡登場了。全片充滿動人情感、幽默笑料、還有來自布魯克林的情懷，\n\
  這全都是為了造就這頓復古的爆米花饗宴。」\n\n\n\n「《變形金剛：萬獸崛起》妥善運用了動畫電影裡的故事線，並將強大金剛與恐懼金剛有\n效地整合在一起。劇情的賭注極高，災厄是個可怕且強大的惡棍，動作戲毫無冷場且情感\n\
  豐沛（雖然多少有一些老套的成份在裡頭）。」\n\n\n\n「《變形金剛：萬獸崛起》宛如一部最終極的週六晨間卡通。有不少超屌動作戲，安東尼\n拉莫斯和彼得戴維森的演出很棒，即使有些對白有點拙劣。這是一部簡潔俐落、娛樂性高\n\
  的電影，也是一篇會讓人興奮期待後續的紮實序章。」\n\n\n（圖片來源：派拉蒙影業）\n\n《萬獸崛起》配音卡司網羅：恐懼金剛「災厄」彼得汀克萊傑（Peter\
  \ Dinklage）、博派\n金剛「雅希」萊莎寇希（Liza Koshy）、博派金剛「雲霄」約翰迪馬吉歐（John\nDiMaggio）、分飾強大金剛「犀牛」和狂派金剛「圈套」的大衛索博洛夫（David\n\
  Sobolov）、恐懼金剛「夜鶯」米凱拉潔羅卓里奎茲（Michaela Jaé Rodriguez）、博派\n金剛「千斤頂」克里斯托費爾南德斯（Cristo Fernández）、「Reek」陶比紐維吉（\n\
  Tobe Nwigwe）、強大金剛「金剛王」朗帕爾曼（Ron Perlman）、博派金剛「幻影」彼特\n戴維森（Pete Davidson）、強大金剛「神鷹飛羅刹」楊紫瓊、以及長年固定為「柯博文\n\
  」獻聲的彼得庫倫（Peter Cullen）。\n\n真人卡司方面，則網羅了多米妮可菲許巴克（Dominique Fishback）、安東尼拉莫斯（\nAnthony\
  \ Ramos）、露娜勞倫維萊茲（Luna Lauren Vélez）等演員。北美預定 06 月 09\n 日上映，台灣則於 06 月 07 日搶先登場。\n\n\
  文：Joker\n\nSCREEN FANDOM - 歐美娛樂癮迷！\n\n\n--"
