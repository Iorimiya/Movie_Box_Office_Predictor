title: '[微負雷] 變形金剛 萬獸崛起 不推'
content: '週末和太座看電影


  一個想看犯罪都市3

  說評論很好笑很好看

  還說口碑不錯


  一個想看變形金剛

  評論說畫面很讚

  說該給的畫片都有給


  說服太座先看咻咻碰再看犯罪城市


  給太座的理由是

  電影畫片就該先震撼人心

  再看小品溫馨


  像吃完大餐後

  再吃小甜點墊墊胃這樣


  先看馬大哥打人再看變形金剛打架

  可能會覺得畫面由小變大

  吃完點心吃大餐

  太刺激了太刺激了

  （其實是男人就該先看變形金剛啊

  看他們嘎嘎碰碰噗噗碰的變形

  看他們咻咻啊咻咻啊的射來射去）



  But

  就是這個but


  以下有雷...

  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  萬獸崛起！

  萬獸？


  就猩猩、犀牛、豹、老鷹


  趴，沒了


  四隻哪來的萬獸，

  好好好，說是翻譯問題沒關係

  問題是這四隻一直不變形


  一直到最後幾分鐘

  才變那一下下


  壞人一開始強到爆，到後面突然越來越弱？！


  柯博文一直憨憨弱弱，整場被打假的，整場！打到最後一場突然喊一句「這就是我真正的

  力量」然後就贏了？？？？


  整部片

  7成時間都是人類，我忍

  劇情超拖超詭異，我忍

  政治正確硬放有色人種，我忍

  壞人認真算也只有四隻，我也忍


  但最後為什麼一個巨大能量傳送裝置

  要設「暫停密碼」


  而且！


  為什麼密碼還寫在「罐子」上

  （對，我簡稱那叫罐子）


  為什麼一個高文明進步的裝置之下

  要建立人類可以鑽進去的「下水道」



  為什麼平常咻咻咻不會痛，

  分解重組洛克人後咻咻咻就痛了？！


  原本


  原本是不打算發表負雷心得...


  真的


  想說就當看完一部機器人的爽片


  變形金剛每部都看


  但這部是第一次


  邊看邊打嗑睡


  還一直安慰自己

  至少是變形金剛是變形金剛


  直到

  剛剛看完太座想看的「犯罪都市3」


  幹，好看100倍！


  100倍！


  光一拳打飛壞人的爽度

  就比金剛好太多！


  真的齁齁齁齁齁


  氣到心得彈出來！





  近期想跟太座、朋友或自己

  來場送鬆無腦電影享受的大大們


  建議星際3、犯罪3、瑪利歐，

  這三個都很不錯。


  真心不騙






  好了，我要去跪算盤了


  被唸爆QQ


  氣死



  --'
