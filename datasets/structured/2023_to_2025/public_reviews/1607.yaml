url: https://www.ptt.cc/bbs/movie/M.1686153847.A.18C.html
title: '[ 好雷] 變形金剛-萬獸崛起'
content: '變形金剛全系列我都有看


  這部只輸第一集


  男女主角顏值問題沒有想像嚴重


  而且演的都還不錯


  而且人類一直不是變形金剛重點就是了


  比較可惜的點：


  強大獸（以前叫極限動物）


  種類不夠多


  老鼠、銀閃電、黑蜘蛛都沒有登場


  然後除了神鷹跟金剛王外其他都是打醬油的


  犀牛跟豹子根本沒講幾句話


  不過最後大戰開始變身還是挺燃的



  然後反派…不是說反派太弱


  但我還是想看到恐龍王


  好像有看到魔蠍不過一樣是醬油



  柯博文變老番癲我覺得挺不錯的


  之前沈穩的柯博文這次是由金剛王代替他的部分戲份



  如果強大獸多給一些描寫，反派出現恐龍王我就覺得完美了


  --'
