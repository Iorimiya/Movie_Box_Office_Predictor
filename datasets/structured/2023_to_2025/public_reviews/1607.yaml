url: https://www.ptt.cc/bbs/movie/M.1686148785.A.45B.html
title: '[大負雷] 變形金剛:萬獸崛起 滿滿吐槽的試水溫作'
content: "無雷勸退區\n\n\n如果你是超過10年的資深TF粉\n\n如果你對麥導版大所失望 期待能看到不一樣的TF電影\n\n如果你對2018年上映的大黃蜂充滿信心\
  \ 期待能在這次的續集看到有所突破\n\n恭喜你 你要失望了\n\n\n還記得2018年的大黃蜂電影開頭的賽博坦大戰嗎\n\n在機械城殘骸中 雙方殺的你死我活\
  \ 但博派節節敗退\n\n尤其看到狂派幹部們其出一堂 把大家逼入死角那種絕望感\n\n雖然只有短短的2分鐘 但相信光是能看到這一幕的人來說\n\n真心期待後續能有什麼新突破或者新畫面...抱歉\
  \ 都沒有\n\n對本次電影的失望感自然是不用多說\n\n最後勸退\n\n這部等下檔後的BD再看 或等串流就好\n\n本片真的沒有什麼值得進電影院觀看的地方\n\
  \n所有的精彩畫面 在預告中都有了 不用懷疑 尤其是最後大戰 真的會吐血\n\n\n\n防雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n剛出電影院 趁記憶猶新 真很想吐槽太多了\n\n劇情上有錯誤還請多指教\n\n這次字幕用的譯名好像不太一樣 就暫時用G1時期的譯名來稱呼\n\n故事開始\n\
  \n宇宙大帝（Unicron）正準備吞噬一顆路人行星前\n\n先派部下恐懼金剛們（Terrorcon）來地上看看\n\n註：Terrorcon在原作中是本來是狂派Decepticon被宇宙大帝吞噬後改造出來的手下\n\
  \n預算不足 只有3隻 分別是：\n\n瘟疫（Scourge）\n\n夜鶯（Nightbird）\n\n圈套（Battletrap）\n\n\n這時候 樹林中蹦出大家期待已久的強大獸（Maximals）們\n\
  \n但是卻是逃跑中\n\n看起來預算也是不夠 只有5隻 分別是：\n\n一隻沒有名字的前任金剛王（對 出來犧牲的）、\n\n新任接班的金剛王（Optimus Primal）、\n\
  \n豹頭（Cheetor）\n\n犀牛王（Rhinox）\n\n神鷹（Airrazor）\n\n\n這5位逃到一半的時候 前任金剛王將本電影的關鍵道具「超時空鑰匙」\n\
  \n交給新任金剛王後 決定留下來斷後\n\n其他4位搭太空船離開後 宰了一隻雜魚蠍子\n\n但瘟疫過來後 三兩下就把前任金剛王打趴在地\n\n躺在地上的金剛王說其實是陷阱(???)\
  \ (也沒說這陷阱的原理是什麼)\n\n總之就是把宇宙大帝困在這了 除非靠那把鑰匙不然不能離開（???）之後死去\n\n\n時間來到1994年的地球 美國 紐約\n\
  \n這裡的人類劇情 全部跳過也沒差 真的一點都不重要\n\n黑人男主角找保全工作碰壁 家裡有個弟弟\n\n得了不知道什麼病但演的一副很嚴重的樣子\n\n接著換黑人女主角\
  \ 在布魯克林的博物館當歷史研究助理\n\n順便演一下黑人職場受歧視的橋段\n\n然後無意間在一堆文物中發現\n\n有一個上面印著強大獸標誌的荷魯斯雕像 好奇心的驅使下\n\
  \n趁下班時間等上司離開後 拿她的卡進去研究室看看這個雕像有什麼不一樣的地方\n\n結果也不知道怎麼操作的只是拿燈掃一下 雕像就自己裂開\n\n噴出一道人類看不見的超粗光束(???)被博派成員們看到\
  \ 於是呼叫大家集合\n\n回到黑人男 因為面試失敗幾次後走投無路 只跟他朋友去偷車\n\n剛好就偷到了這次博派的主角幻影（Mirage）\n\n偷車被逮的逃亡過程\
  \ 預告片都演完了\n\n接著逃到一個倉庫 遇到了另外3位博派：\n\n柯博文（Optimus prime）\n\n大黃蜂（Bumblebee）\n\n雅希（Arcee）\n\
  \n這個超粗光束來源 是片頭的那個超時空鑰匙\n\n附帶的能量可以幫助博派回到賽博坦\n\n阿前作不是被狂派佔領了嗎 你們就4個人回去是要幹嘛..\n\n鑰匙定位到在黑人女的博物館\
  \ 討論後決定讓黑人男進去偷\n\n一群人就來到博物館 但這條只有外星人才能看到的超粗光束也被反派看到\n\n在博物館找到鑰匙的過程 瘟疫放了兩個小雜魚進去找人類\n\
  \n這邊來了一個根本沒意義的jump scare給觀眾\n\n兩人好不容易逃出來後\n\n兩邊人馬都到了 開始打了起來 其中柯博文被瘟疫按在地上磨擦\n\n還不忘嘲諷柯博文\
  \ 這樣也敢自稱Prime？ 根本丟光元始天尊的臉\n\n並說自己可是高等生物 看著低等生物想打贏自己的樣子真是可笑\n\n註：元始天尊（Primus）是變形金剛中\
  \ 光明面的創世神\n    黑暗面的創世神則是宇宙大帝\n\n\n眼看大哥要輸了 大黃蜂一個跳過去想救 結果被瘟疫空中攔截直接捅穿身體\n\n這裡預告片演過了\
  \ 接著被轟一砲死去 (但身形還很完整???)\n\n即將滅團之時 強大獸的神鷹跑來救場 到處噴火救了博派們 但鑰匙已被瘟疫搶走\n\n大家先撤退 之後躲到一個地方整理剛剛狀況\n\
  \n神鷹說強大獸只剩下自己了 鑰匙為了預防被搶走 很早就一分為二\n\n瘟疫只拿走一半根本沒用 但另外一半也不知道在哪\n\n果然瘟疫回去報喜 被只露一個鼻孔的宇宙大帝臭罵一頓\n\
  \n回到人類這 就這麼剛好 黑人女說我有研究(???)\n\n另外一半在祕魯 大家可以去那邊看看\n\n到這裡差不多一個小時了 劇情從這裡開始才有點感覺\n\n\
  隔天一大早 博派們搭乘平流層（Stratosphere）來到了祕魯\n\n平流層這個角色只有出場時搞笑一下 因為太老\n\n變形完後吐了一口機油跟零件就沒他的事了\n\
  \n搭乘時 黑人男整理完現在的狀況 跟黑人女說找到另一半鑰匙就當場破壞\n\n這樣雖然博派回不了家 但也可以避免宇宙大帝來到地球\n\n柯博文則是跟博派其他人說\
  \ 回到賽博坦後 可以用那裡的科技救回大黃蜂\n\n（大哥 賽博坦在前作就被狂派佔領了...你真的忘了嗎?）\n\n\n到達祕魯後 遇到輪傑（Wheeljack）\n\
  \n這裡還塞了一個尬到不行的南美洲種族口音玩笑 尬到不行\n\n此時當地人正在舉辦太陽神祭典 大家開始討論戰術 黑人女的研究顯示\n\n鑰匙藏在某個神殿地底下（是到底有沒有這麼順利???）兩人先去拿\n\
  \n拿到後交給博派 博派再搶走反派另外一半的鑰匙後 就撤離地球回到賽博坦\n\n並用那裡的科技復活大黃蜂 3個反派們剛好也來了 經過一番追逐戰\n\n兩人去地下洞穴打開石棺\
