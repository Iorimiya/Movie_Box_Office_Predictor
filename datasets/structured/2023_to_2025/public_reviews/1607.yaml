url: https://www.ptt.cc/bbs/movie/M.1686268781.A.FA5.html
title: '[爽雷]變形金鋼：萬獸崛起'
content: '這種片本來就不是看劇情的


  而是看特效爽不爽


  這部電影缺點不少，但特效還是誠意十足


  如果單純想看特效爽片，絕對值得進電影院看。


  講白了


  這部就是各種抄襲侏羅紀（博物館追逐），星戰（西斯大帝與弟子），金鋼骷髏島（機器金

  鋼），鋼鐵人（主角穿機器鎧甲）等


  最大的敗筆我覺得就是「萬獸」，因為只有四獸，野獸機器人戰鬥的特點也沒特別發揮，覺

  得很可惜，例如豹和犀牛畫面很少，看膩的金剛大猩猩反而最多。


  人類戲份還是算多，有點扣分


  至於被詬病的男主角變鋼鐵人，我反而覺得是神來一筆是大加分


  每部變形金鋼電影最尷尬就是人類在巨型機器人戰鬥中淪為跑來跑去的廢物，這次人類終於

  可以和變形金鋼一起戰鬥，發揮以小博大，靈活老鼠戰笨拙大象的優勢，


  我覺得人類變成鋼鐵人很成功化解了這系列的尷尬點，是不錯的突破。


  這次男主角的座車終於不是大黃蜂而是幻影，我覺得幻影真的蠻討喜的，蠻嘴的，最後幻影

  和男主角兄弟那段我也眼眶泛紅，幻影絕對是大加分本片的亮點。


  總之


  作為爽片，真的值得去看，很舒壓。


  --




  我也喜歡幻影

  沒錯近期最爽的爽片

  原來如此

  XDD'
