url: https://www.ptt.cc/bbs/movie/M.1690461830.A.4C4.html
title: '[好雷] 變形金剛：萬獸崛起'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  很驚訝這部的票房不好！難道變形金剛已經失去吸引力了嗎？


  我自己看這系列電影像看卡通一樣，不要太注重劇情邏輯，注重在美術及視覺感受上


  其實還是可以看得很享受


  這次強大金剛的出場當然是最讓人期待的部份


  雖然出場的角色不多而且戲份有點兒少，台詞也不多，很多時候甚至有點像背景


  豹豹跟犀牛的存在感有點低啊 .....


  博派這邊感覺很弱勢，柯博文好像變了個人，整個人就像個退休老人家番巔得要命


  不過幻影有稍微解釋這位老大哥為什麼個性大變的原因，最後好像有比較清醒一點了


  畢竟是博派領袖嘛


  幻影是本電影最大亮點，我最喜歡的角色，超嘴超中二的，一開口我們就笑個不停


  大黃蜂和雅希也很可愛，造型也很亮眼


  有一個老博派也很好笑，不過只出現一下下，幾乎就只剩下載具的功能


  我覺得博派是個很溫馨的團隊，團員雖然會互嘴但總是互相扶持，不離不棄


  反派也很棒，溫疫真的超級帥氣！雖然沒有密卡登那麼有個性，但還是超強超煞氣！


  中間有一段打趴主角們的橋段其實蠻嚇人的...


  故事內容已經簡化再簡化，沒有什麼複雜的劇情，


  還好人類的戲份也排得不多，出場的人類主要就男女主2位


  男主表現得中規中矩，有帶到他的家庭背景


  只是搞不懂男主通訊專業的設定是要幹麻，為了無線電通訊？電影裡好像都沒用到


  還有到秘魯的時候他吐槽人家口音這裡是在幹麻我也是滿頭問號


  男主的情緒和心境的轉折也很謎，一整個善變到不行，不過看得出來是個好人啦


  女主個性就蠻不討喜，但勉強還可以忍受


  最後大戰那邊很熱血，那個畫面色調那個角度跟動作很有復仇者聯盟的既視感



  最不滿的地方就是大黃蜂可以復活，神鷹為什麼不行？為什麼為什麼為什麼



  我一直以為神鷹會跟獵鷹一樣從金剛王左邊衝出來




  雖然很多地方可以吐槽沒錯，但以一部無腦爽片來說還可以了啦


  華麗的變形、刺激的打鬥、熱血的配樂、


  至少小朋友看了都覺得很開心，票房不佳真的令人訝異


  我覺得這部還比小美人魚好看些呢




  以上個人淺見請多包涵~


  --'
