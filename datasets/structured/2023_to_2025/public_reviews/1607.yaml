url: https://www.ptt.cc/bbs/movie/M.1686157385.A.EF8.html
title: '[微負雷] 變形金剛：萬獸崛起'
content: '小時候看過G1跟百變金剛


  對於麥可貝執導的真人系列以及金剛們的角色機械設計我是覺得還能接受的人


  麥卡貝的真人系列電影排列1>>>>3>2>>>4、5


  Bee開始軟重啟我就另外拉出來看了，但我個人覺得Bee是沒有3好


  這次萬獸整體格局縮很小，故事還算順順的講完


  人類戲部份都算是交代過場用的，但至少不會讓人翻白眼


  男主是越看越耐看型，而且他個人的戲份還都算討喜

  而且跟幻影開始開車逃跑這段真的蠻讚的


  女主則是最主要的劇情推動工具，幾乎是要靠它解謎才能推動故事。不過只要不特寫她就

  覺得演的還不錯，但一特寫就不知道為啥一副超尬的演技演出

  明明看到一半有入戲了，一特寫直接超尬演技讓你出戲




  這次博派、強大金剛跟恐懼金剛的出場時間真的很多，但並沒有讓我覺得整體而言有比較

  好…


  我個人是從第一集開始就從來沒覺得打鬥部分會讓我困擾的問題


  這次的萬獸確實很清楚，應該不少人可以看清楚倒底誰是誰在幹嘛

  但自己是覺得好像直接把動態模糊拿掉的感覺怪怪的


  打鬥設計不再是像以前主要著墨在柯博文跟大黃蜂上

  而是每個角色都有好好表現發揮，但是畫面呈現跟麥卡貝的比好像就是少了一種力度感


  當然可能也只有我個人會這樣覺得


  最後就是金剛王、豹頭、犀牛變形後的畫面真的好少

  幾乎沒什麼著墨在他們機器人型態上，更別說連神鷹的變形都沒看到



  這部的預算有2.5E，真的讓我非常懷疑到底花到哪裡去

  整體質感呈現上我覺得沒有比5的2.6E好….

  更別說第一集的預算只有1.5E還屌打萬獸的質感


  對了，如果我沒聽錯的話，最後是有用的第一集的Autobats 跟 Optimus這兩段配樂的各一

  小段


  是還蠻讓人感動的



  補充一點，這次看完最讓我驚艷的絕對是郎帕爾曼的配音


  他配的金剛王真的是有別於彼得庫倫的柯博文的另一種低音頻


  卻同樣能散發出一股威嚴、沈穩冷靜的強大氣場


  是會想繼續聽他配金剛王的


  但兩人的年紀都好高了…希望是還能多聽幾次兩人同場的配音演出



  -----

  Sent from JPTT on my iPhone


  --





  所以我才說我個人是從第一集就沒這困擾的人XDDD

  但這次有點過於清楚，清楚到我自己覺得很怪

  不過對於常常看到認不出扁誰的人是很友善的'
