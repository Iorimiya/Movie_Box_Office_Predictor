title: '[普雷] 《變形金剛：萬獸崛起》期望太高'
content: '雷文防雷資訊頁





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  缺點前幾篇負雷差不多

  但導演有在試著找回第一集的感動 還是給推

  然後這邊推一下國賓ATMOS 超級震的 很爽


  先說字幕完沒東西 可以去上廁所了

  第一段的片尾完就沒了


  優點

  1.變形是真的有第一集的感覺，變的很清楚


  2.第一集的經典配樂出現 電影院聽還是有點感覺


  3.柯博文不尾刀了


  好像沒了XD


  缺點

  1.人的戲還是有點臭


  2.有感覺在刻畫情感，兄弟情，保護兄弟，投射到柯博文，但是主角真的很無感導致沒有

  感動到..


  3.柯博文還是來亂的，不過跟4.5有差，至少是從頭就腦殘，不會說突然轉變得很突兀XD


  反派那個雙刀蠻帥的，結果也沒幹嘛就掰了，我以為大黃蜂要撿武器拿來帥一波，也沒有


  強大金剛畫面真的有點少 神鷹也沒變


  藏了一個人類裝備，我也還好..

  其實從那個手裝備就像致敬鋼鐵人


  原來這部2.5億

  應該都花在特效，金剛是真的畫的蠻精緻

  美軍還消失XDD 可能沒錢了

  也可能我期望太高

  一直以為要搞時空悖論，自己救自己的狗血展開XD我會喜歡

  而且台詞說了兩次「未來」

  恐龍王也沒有

  結果預告幾乎是沒藏


  片尾

  我以為名片是第七區

  結果是孩之寶大宇宙要來了？XDD



  --'
