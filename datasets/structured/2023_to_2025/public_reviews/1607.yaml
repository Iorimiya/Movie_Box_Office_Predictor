url: https://www.ptt.cc/bbs/movie/M.1684050495.A.ECC.html
title: 'Re: [討論] 變形金剛：萬獸崛起，最新預告'
content: "原文恕刪\n\n變形金剛這幾天在歐美又燒起來了，原因不意外又是「進步」的劇情\n\n但是這次真的太誇張，因為這次出爭議的是給小朋友看的卡通\n\n\
  \n受害者是 Transformers: EarthSpark\n\n這是一個目標客群為小朋友的變形金剛卡通\n\n直接上爭議片段\n\n\n\n\n\n影片中，女孩先是懼怕機器人\n\
  \n直到藍色機器人說自己的代稱(pronouns)是 They/Them 後\n\n女孩就突然不怕了(???)\n(暗示觀眾：會使用代稱的人是好人)\n\n接著女孩說自己代稱是\
  \ She/They\n\n女孩說這個世界\"很可怕\"，不知道誰是\"壞人\"\n\n但女孩能確定在朋友跟\"非二元性別\"的身邊是安全的\n(暗示觀眾：男性與女性是危險的，非二元性別是好人)\n\
  \n機器人問什麼是\"非二次元性別\"\n\n女孩回答\"不是男生也不是女生的人\"\n\n女孩道歉\"我不該假設(assume)你的性別\"\n\n機器人放鬆表示\"\
  我一直都知道我的代稱是正確的\"\n\n\n\n在這個短短一分鐘的影片片段，出現了\n\n- 代稱(pronouns)\n- 非二次元(non-binary)\n\
  - 假設性別(assume)\n- 受害者心態(victimhood)\n- 自我中心(egocentrism)\n\n完美呈現 WOKE 運動的標準 Narrative\
  \ 與 Political Agenda\n\n然後不要忘了，這是目標受眾為「小孩」的卡通\n\n\n\n\n這段影片兩天內已經有 1800 萬觀看\n\nElon\
  \ Musk 也親自回文吐嘈 \"Computers are literally binary lol\"\n\n許多網友懷疑這是不是編劇在反串或是偷酸\n\n\
  畢竟這段內容充滿外界對 SJW 的刻板印象\n\n\n\n但依照這幾年 WOKE 運動的尿性，編劇很可能是認真而不是反串..\n\n\n\n\n國外有影迷開始擔心萬獸崛起的劇情會不會也充滿WOKE元素\n\
  \n畢竟同屬變形金剛IP都敢這樣搞\n\n搞不好整個變形金剛IP都已經被進步主義者滲透\n\n\n\n補充:\n\n因為用錯代名詞而被糾正的柯博文..笑死\n\n\
  \n\n--\n  傻    ︱               \n爹會吃我嗎?孩怎  ︱ 大哥!    \n\\       子麼  ︱   \\      \
  \ \n/，可  ︱  `\"  ◥◤        \n能  ︱ ◥◤       \n！  ︱ ╰───╯      by menb \n\n--"
