title: '[小好雷]變形金剛萬獸崛起 '
content: '也沒什麼雷啦


  我覺得整體劇情蠻不錯的


  最後大戰場面也夠精彩


  只是毀掉鑰匙不是會引起大爆炸嗎


  但是沒有 這一點low掉了


  另外還是塞了政治正確的東西


  有色人種都被白人欺壓


  優秀黑人沒機會上大學醫生祿祿無為 懷才不遇


  真她馬的看個機器人英雄大片


  又要被政治教育


  最後本片給75分 但是女主角扣15分


  你要用黑人我沒意見


  但為何要用一個醜八怪


  黑人當中也一定有美女啊


  --'
