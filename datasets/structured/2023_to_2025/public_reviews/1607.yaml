url: https://www.ptt.cc/bbs/movie/M.1686847096.A.3E5.html
title: '[好雷] 變形金剛 萬獸崛起'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  大家好 本篇不大有雷

  純屬個人觀點

  喜不喜歡就因人而異

  （手機排版請見諒）


  我不是重度變形金剛迷

  但本身還是蠻喜歡變形金剛

  網上很多人都很不喜歡這一集

  覺得劇情不好 故事架構不完整

  很多分析 我都覺得很有道理

  不過 我對變形金剛

  就是愛瘋狂變形和大場面戰鬥

  以及不要太多人類來湊熱鬧

  這一集 基本上沒什麼人類和軍隊

  連主角最後都”變形”了

  真的就是名副其實的變形金剛

  我個人是覺得很喜歡


  故事是在1994年

  我覺得故事架構和內容

  就是回歸”老”這個字

  親情 友情羈絆的老梗

  故事性的老派

  我個人真的不會太計較這些

  劇情單純 反而更集中在變形和大亂鬥上


  我覺得最大的缺點

  就是大黃蜂復活那一段

  配上背景音樂讓我完全出戲

  幸好沒有拖太長


  我個人還是蠻推薦進電影院看的

  不要帶太複雜的大腦來看

  買好爆米花和飲料

  單純來看一場變形大亂鬥的電影

  我覺得是蠻享受的！


  --'
