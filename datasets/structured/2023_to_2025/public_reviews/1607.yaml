url: https://www.ptt.cc/bbs/movie/M.1686480776.A.E28.html
title: '[好雷] 變形金鋼萬獸崛起'
content: '變形金剛從第一集開始每集都有看

  這次重啟從外傳開始講大黃蜂再來本傳

  流暢度還不錯，人類的戲份變比較少


  片長兩個多小時很快就結束了

  算是一部還不錯的爽片


  但是再去找另外一半鑰匙的時候

  以為強大金剛會有整片的數量出來

  結果只有四隻而已

  我是不懂片商翻成萬獸是要幹嘛


  最後在打架的時候強大金剛變身

  突然覺得金剛王好像張飛

  黃豹好像趙雲（帥爆）

  可惜只有變這一小段有點不足


  主角跟幻影合體部分是直接傻眼

  這是三小？鋼鐵人？


  除了上面幾點外覺得這部片還是不錯



  --'
