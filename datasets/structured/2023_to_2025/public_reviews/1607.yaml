url: https://www.ptt.cc/bbs/movie/M.1669965374.A.7BE.html
title: 'Re: [討論] 《變形金剛：萬獸崛起》首支前導預告'
content: "的大型玩具廣告又又又回來啦！\n\n這裡用個人收藏的變形金剛們 來介紹這支預告目前露臉的角色\n\n\n以下依影片出場序：\n\n\n\n\n\
  其保時捷911的車型事實上一直是經典人氣角色的形象\n\n\n\n\n然而Jazz在麥可貝第一集電影就被密總撕成兩半壯烈成仁了\n\n這集可能是為了得到保時捷的贊助\
  \ 讓Mirage來飾演Jazz\n\n是說都軟重啟了 讓人家復活應該不算過分吧!?\n\n\n\n\n\n\n小隊的領袖\n\n在動畫裡的原設定是的後代\n\n\
  為了追捕由  率領的而穿越時空到史前地球\n\n\n\n\n\n\n大家都熟悉的柯博文就不多介紹了 左邊是這次的電影造型 右邊是經典造型\n\n\n\n\n\n\
  \n麥導版本的大黃蜂形象實在太深植人心了\n\n手上剛好沒復古肌肉車型態的蜂 用動畫版本\n\n的\"不小心練太壯\"蜂來暫代一下 這版本的BBB我覺得是最耐看的\n\
  \n\n\n\n\n\n\n年輕的強大獸成員 小隊之中速度最快 性格果敢而莽撞\n\n配色和角色定位都相近 所以劇組還特意安排了一個與大黃蜂並肩奔行的鏡頭XD\n\
  \n\n\n\n\n\n\n女性 由於她的偽裝型態 是強大獸重要的空中監視及偵查戰力\n\n個性冷靜而有自信\n\n\n\n\n\n\n這是漫畫造型 最新的電影版玩具面相我覺得有點嚇人所以沒收XD\n\
  \n女性 載具型態為摩托車\n\n\n\n\n這是領袖之證動畫版本的雅希 可視為同名的不同人物\n\n\n\n\n\n\n\n金剛王的副官 聰明穩重而力量強大\n\
  \n擁有足以擔當領袖的實力卻甘心擔任後勤的工作\n\n\n\n以下是遺珠篇\n\n這支預告內一位都沒有登場的成員們 是不是在藏?\n\n\n與他的快樂夥伴 他手下不是搞笑擔當就是背骨仔\n\
  \n我缺一隻火蟻至今沒到貨 熱門角有夠難買\n\n\n\n\n其他的成員 私心希望能看到出現QQ\n\n\n咦??是不是好像漏掉了一些人物??\n\n博派都找動物金剛外援了\
  \ 就你們反派(不是狂派)還在搞武裝卡車 一點長進都沒有\n\n懶得介紹(事實上是沒有收)\n\n--\n                          \
  \            12/02 15:16\n                                12/02 15:16\n跟變迷社團的神人們比只是滄海一粟\n\
  魔龍真男人\n有老柯有金剛王 搞不好真的會有\n第二季以後的角色介紹起來就太多了 而且我還在等復刻XD\n飛天猩猩\nYeeeeeeeeeeeeees!!\n\
  美式風格美學\n那集我印象超深刻 本以為他只是個憨大個子 沒想到那麼猛\n魔鬼魚和魔蟹玩具真的是小時候回憶 現在都很難找\n還記得不知道哪個角色吐槽他叫小飛狗\
  \ 超好笑\n小時候看也不知道 直到沉睡的柯博文出現才發現這紅色卡車人怎麼那麼眼熟\n神火金剛王和火龍王最近都有新版產品唷 個人覺得後者還滿值得收藏\n 盒背官方展示圖\n\
  虎鷹有夠~~~~~~帥\n能合體的野獸金剛在日版動畫BW2和BWN\n肯定不夠\n把Megatron想成不只是名字而是歷代首領相傳的稱號就懂了~\n 這隻的圖真的很多\n\
  有神物!!\n台灣翻譯神鷹沒錯 但飛箭這個譯名比較符合英文原意\n前幾年還有在老玩具店有看到 現在越來越稀有\n現在如果不是找二手就是等孩之寶出復刻版本\nMP級別就是精品的範疇了\
  \ 反而捨不得拿來常常玩~\n台譯把人家胡蜂叫成蒼蠅 不知道是不是故意惡搞XD\n\n  ( ￣□￣)/ <(￣ㄧ￣ ) <(￣ㄧ￣ ) <(￣ㄧ￣ )\n這是\"\
  1996年\"的全3D動畫\"影集\" 比不上玩具總動員的大製作 但在當時也是創舉了\n已羨慕\n\n \n  \n  \n\n\n其他眼拙看不出來了 但光這些全部都是市面上超稀有的神物了！！\n\
  保存良好的話大大您這箱的收藏價值超高！！\n我也是 小時候的願望太強烈 長大後現在櫃子裡一堆暴龍"
