url: https://www.ptt.cc/bbs/movie/M.1686394243.A.174.html
title: '[普雷]【變形金剛萬獸崛起】麥可貝元素剩三成 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  影片版



  【變形金剛：萬獸崛起】的開場延續了2007年版【變形金剛】的方式，讓百變金剛的「金

  剛王」的旁白解說當中介紹了宇宙大帝這個本片大反派，基本上宇宙大帝是個吃行星的巨

  大生命體，可是很奇妙的是他在吞食生命體之前還要派手下恐懼金剛去搶奪本片新種族強

  大金剛守護的秘寶「跨時空鑰匙」，而強大金剛的首領金剛王帶著跨時空鑰匙逃到了地球

  。而這一躲就過了幾千年，等到女主角愛蓮娜在博物館裡頭因為分析古文物而意外觸發跨

  時空鑰匙時，已經是西元1994年了，這個時候，柯博文與博派金剛們也已經從賽博坦星抵

  達地球七年，而柯博文希望能得到跨時空鑰匙好返回賽博坦星，因而與趕到現場試圖搶奪

  的恐懼金剛大戰了一場，而相當令人意外的是柯博文竟然有點打不過恐懼金剛的頭頭瘟疫

  ，就在博派金剛快要敗陣的時候，強大金剛的獵鷹忽然殺到，兩方主角才終於會面，而接

  下來的冒險也讓金剛王等其他動物造型的強大金剛登場，最後理所當然地展開了一場正邪

  大戰。




  基本上，【變形金剛：萬獸崛起】的故事基礎算是把2007年版的【變形金剛】的故事結構

  稍加改變之後重新講了一次，只是這一次添加了強大金剛這個可以從動物變成機器人的族

  群，但是雖然故事結構大同小異，角色的個性卻又有所調整，2023年的柯博文與2007年相

  較，顯得更偏執、更凶暴也更不相信人類，這個時期的博派金剛也都還沒有跟人類合作，

  只有新登場的幻影與大黃蜂對人類有好感。




  人類陣營的角色設定也很明顯的有別於麥可貝版，男主角諾亞雖然擁有退役軍人的身份，

  但是卻找不到工作，家裡又有生病的弟弟，完全是個社會邊緣人，這與麥可貝版的山姆（

  中產階級下的幸福青少年）與凱德（怪咖發明家）。而女主角艾蓮娜則是一個在博物館工

  作的實習生，他的主管明顯的完全不了解考古，只會把工作丟給他做，自己則去參加光鮮

  亮麗的募款餐會。她的外型與人設也更是跟麥可貝版差得非常多。此次電影的新角色幻影

  與諾亞的認識過程與互動算得上是全片最可愛的部分，幻影這個角色的造型與個性很有

  2007年版的爵士的味道，是個很幽默又開朗的角色，跟諾亞的弟弟也有可愛的互動，這一

  點是【萬獸崛起】有別於前做的設計，觀眾終於不再只能關注柯博文與大黃蜂了。而人氣

  最高，到目前為止唯一擁有個人電影的大黃蜂呢還是非常有魅力，這部電影延續了2007版

  總是只能用收音機來發音的梗，讓大黃蜂成為一個喜愛看地球人電影的變形金剛，於是在

  片中他成了一個老是講電影經典梗台詞的角色。每次他開口都特別有梗。




  至於本片最大噱頭，強大金剛們呢？其實我個人一直覺得兩位主要角色金剛王還是神鷹其

  實個性都偏向扁平，金剛王就是個跟柯博文立場相近，想要保護自己的族人因此不願相信

  其他陣營的角色，而神鷹則是對博派金剛與人類陣營角色相對友善的好朋友，但是除此之

  外其實很難得到太多關於他們個性的細節描繪，頂多就是述說了祕魯的當地原居民與強大

  金剛們建立了共生關係，共同守護「寶器」，至於其他強大金剛如犀牛、黃豹更是幾乎沒

  有台詞的背景角色。而盟友角色都如此邊緣了，反派角色當然就更扁平，無論是宇宙大帝

  、恐懼金剛的瘟疫、圈套、夜鶯幾乎都只是展現邪惡的壞人。




  講完了角色，接著講場面與視覺效果吧，如果單單以視覺打鬥場面來論的話【變形金剛：

  萬獸崛起】是絕對比不上麥可貝版本的，但是問題就出在麥可貝在最後幾集的【變形金剛

  】已經把電影拍到場面越來越大、越來越閃，而敘事邏輯與故事都七零八落的狀態，在這

  種情況底下，我個人看到第五集的時候，基本上已經完全無法集中精神看電影了，相較之

  下，【萬獸崛起】的畫面沒有那麼激烈與複雜，反而在敘事上變得比較舒服，雖然有的時

  候，明顯可以發現【萬獸崛起】與前做相較，視覺表現上較為缺乏原創性，人類角色的文

  戲與動作戲都變得更多，有的時候這些片段有不錯的幽默感，像是配著嘻哈音樂偷車的片

  段就挺可愛的，有的時候則是會看到【博物館驚魂夜】與【印第安納瓊斯】的影子。而最

  後的機器人大戰，有幾個片段更是讓人覺得是直接把【一級玩家】與【鋼鐵人】的畫面構

  圖拿來沿用。然而即使是這樣，當片尾我看到柯博文與金剛王，分別變形成卡車與金剛逃

  離爆炸，然後搭配著2007年由史蒂夫喬柏斯基作曲的【變形金剛】主題音樂的時候，仍舊

  還是頗為感動。哎啊沒辦法，身為機器人迷，我還是很喜歡看機器人打架啊。




  總體而言，【變形金剛：萬獸崛起】的故事簡單，角色可愛，視覺場面雖比上一代的麥可

  貝版本簡化了許多，但是故事卻講的比較順暢也更好瞭解，對一般普羅大眾而言，我個人

  覺得這一點是加分項目，畢竟現在的麥可貝電影，恐怕只有很核心的動作電影影迷才比較

  吃得下去了，距離2007年版的【變形金剛】也已經過了16年了，【萬獸崛起】的重開機，

  是一個重新對觀眾介紹【變形金剛】的開始，這個版本比起上一代，相對較樸拙，角色也

  較為回歸原始的卡通造型，雖然這也顯得故事在一些小設定上欠缺邏輯合理性，像是在【

  大黃蜂】裡頭在賽博坦星上就已經是卡車與跑車造型的各種變形金剛，以及本次登場的強

  大金剛為何身為動物的造型都以欠缺了邏輯解釋，但整體而言，觀賞【萬獸崛起】仍擁有

  娛樂大片的氣勢。而對於我這個愛看機器人大戰的觀眾而言，【萬獸崛起】絕對還是本年

  度最該觀賞的電影，畢竟在這個充滿了超人電影的年代，現在要看機器人大戰的機會可不

  多，期望以後能越來越多啦，像是鋼彈...。




  這部電影有個隱藏片尾，釋出了一個我覺得他們早就該做的IP結合，這其實一點也不令人

  意外，很多年前派拉蒙就打算讓這兩個類別結合了，而且我個人也一直覺得麥可貝版本【

  變形金剛】的人類陣營即使有美軍支援，戰力總是跟變形金剛有落差，這個IP的結合總算

  讓人類陣營的戰力有所提升了，不過某種程度來說，這應該也代表了美軍以後應該就不會

  再出現在【變形金剛】的電影系列當中了吧。


  --'
