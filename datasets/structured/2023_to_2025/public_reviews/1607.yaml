url: https://www.ptt.cc/bbs/movie/M.1686544973.A.74F.html
title: '[討論] 變形金剛萬獸崛起的亮點與疑問'
content: '防雷
















  1.其實這次武打場面相當好，各角色的強項有刻畫出來，不是一昧的砲火亂射


  柯博文看的出來是拼命砍但砍不到對方，瘟疫戰技高超而且速度快，雅希靈巧但火力不足；上一次有這種感覺是變2大黃蜂在埃及對戰狂派時有閃躲與反擊



  2.最後決戰大黃蜂有說「Say hello to my little friend」，是Scarface裡面Tony的經典台詞



  3.變形金剛對大小不應該是固定的，怎麼幻影可以變成大兩倍的垃圾車？


  我記得小時候卡通幻影是一台方程式賽車，這次以964 Turbo為範本，對老保時捷迷來說應該是完美的造型



  4.反派其中一個是爆改GTR，不過這台東瀛戰神在秘魯山路居然跑在大拖車後面有點好笑，不能搶了瘟疫的風頭



  5.幻影怎麼用地球的材料修一修就復活了，我記得變形金剛設定上是生物，能用普通材料維修？


  還是幻影沒死，覆在主角身上的動力服就是本體，只是精疲力盡所以要人類操縱



  6.大黃蜂這次有變形成拉力賽車版Camaro，以往都是一個車型打天下，除了變三有稍微變形邊開車邊開炮；這次根據越野環境調整裝備的細節很酷


  --'
