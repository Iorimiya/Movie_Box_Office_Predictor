url: https://www.ptt.cc/bbs/movie/M.1686210693.A.627.html
title: '[ 負雷] 變形金剛 萬獸崛起'
content: '麥可貝版只看舊男主的集數


  換新男主的就沒看了


  也沒看大黃蜂




  這部個人覺得頗難看


  大家好像對於麥可貝版的劇情有不少的批評


  可是我覺得這部的劇情跟麥可貝版差不多


  甚至更差...




  應該說劇情非常普通


  但是細節處處理的很爛


  特別是人類這邊完全扣分


  讓整部的評價變的很低


  金鋼這邊就一如往常無聊


  反派要幹爆地球


  正派要守護地球還想回家





  有些地方你知道這時該熱血或是該感動


  但就是完全沒有那個情緒


  顯得超級出戲




  打鬥的部分就還行


  不好也不壞










  防雷


















  一個家庭貧困需要穩定工作的待業男主


  一個普通職員女主


  突然間莫名其妙就要願意豁出性命拯救世界


  ？？？？？


  有人可能會說男主是為了事成後


  能賣車賺錢才答應合作


  可是看下來明顯就能瞭解


  主要驅使男主行為的動機


  是他想拯救世界





  最後還搞一個破產版的鋼鐵人？


  到底是三小...





  最後柯想犧牲自己的時候


  女主還有一個特別的鏡頭說我們不能丟下柯


  然後眾人酸


  最後就在柯要被吸走的時候


  男主不顧危險留下救柯...




  這部最大的敗筆就是



  人類跟金剛之間的情感的營造非常薄弱


  但是劇情上又很多重點橋段


  想凸顯雙方多深厚的情誼







  -----

  Sent from JPTT on my Samsung SM-G9910.


  --'
