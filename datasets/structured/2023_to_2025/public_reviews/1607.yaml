url: https://www.ptt.cc/bbs/movie/M.1690437747.A.A0C.html
title: '[新聞] 派拉蒙坦承"變形金剛萬獸崛起"票房不理想'
content: '新聞網址：


  原標題:



  2023-07-27 12:55:42




  ，這和麥可貝（Michael Bay）過去執導的第三、第四

  集動輒就是破十億美元的巔峰盛況完全無法相比擬，這個數字甚至還遜過外傳《大黃蜂》

  （Bumblebee）的 4.67 億美元， 就連麥可貝執導的五部之中票房最差的《變形金剛 5：

  最終騎士》（Transformers：The Last Knight），當時至少都還有 6 億美元出頭的成績

  。


  而在《綜藝》（Variety）雜誌的最新專訪中，




  ，而故事又會如何統整這兩套系列。不過羅

  賓斯（下圖）透露，依然有以製片人身份參與製作的麥可貝最初並不想讓這兩個 IP 合併

  。



  羅賓斯回憶，這項合併計劃必須說服很多人，包括擁有這大 IP 的孩之寶、以及身為《變

  形金剛》系列監製的史蒂芬史匹柏（Steven Spielberg）和麥可貝，而麥可貝是特別不易

  說服的對象，因為他擔心若和《特種部隊》合併，會使《變形金剛》「掉價」。羅賓斯描

  述：「我打給他五十多通電話，我絕不讓他迴避我，而當他終於不再拒接我的電話後，我

  們才總算讓他簽字答應。」



  ，但由於近期演員工會、編劇工會

  罷工，他們的籌備進度也跟著卡關。同時身兼《特種部隊》和《變形金剛》 系列監製的

  羅倫佐迪波納文圖拉（Lorenzo di Bonaventura）最近接受《Sci-Fi and Fantasy

  Gazette》採訪時預估，他們希望《萬獸崛起》續集能在 2025 年上映，但如果罷工時間

  拖得愈久，就可能延期到 2026 年。



  至於《萬獸崛起》未來究竟是會和過去的《特種部隊》電影連結、還是直接重啟推出新版

  的角色和劇情，迪波納文圖拉則表示他們自己也不確定，他們目前還沒有規劃到那麼遠。



  --'
