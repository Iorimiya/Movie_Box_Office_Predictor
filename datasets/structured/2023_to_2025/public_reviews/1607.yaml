url: https://www.ptt.cc/bbs/movie/M.1645247030.A.D34.html
title: '[新聞] 派拉蒙:變形金剛萬獸崛起將開啟全新三部曲'
content: '新聞網址：



  Yahoo奇摩電影編輯部

  2022年02月18日



  【文／血紅蘭姆】派拉蒙如今證實，《變形金剛：萬獸崛起》將開啟全新的三部曲電影。



  從2007年一路演至2017年，由麥可貝操刀的《變形金剛》五部曲總共抱回了近四十四億美

  金，然而



  在崔維斯奈特執導、海莉史坦菲德主演的《大黃蜂》中，聚焦於八零年代一名少女的青春

  成長故事。



  雖然近四億七千萬美金的票房不如前五部曲那麼驚人，不過片中主打少女和大黃蜂之間的

  私密情感連結，卻反倒令觀眾耳目一新，製作成本更比前五部曲都來得低廉，也成功為《

  變形金剛》重新開機。



  在《大黃蜂》打響了第一砲之下，





  派拉蒙日前在投資人日上宣佈，

  。除此之外，《變形金剛》今年秋季也會在尼克兒童頻道上推出一齣全

  新動畫影集，更有一部電腦動畫電影將於2024年問世。



  本片將由《金牌拳手：父仇》導演小史蒂芬卡普爾執導，片中卡司陣容也煥然一新，包括

  了《漢密爾頓》男星安東尼拉莫斯、《猶大與黑色彌賽亞》女星多米妮可斐許巴克、「夢

  魘殺魔」女星露娜羅倫維萊斯。



  有別於前五部曲都著重在博派金剛和狂派金剛之間的衝突對立，


  。《變形金剛：萬獸崛起》將於2023年6月9日上映

  。


  --


  變形金剛宇宙來啦!!!!!


  --'
