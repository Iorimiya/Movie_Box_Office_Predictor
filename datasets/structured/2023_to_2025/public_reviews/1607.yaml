url: https://www.ptt.cc/bbs/movie/M.1686129988.A.086.html
title: '[好雷] 變形金剛 萬獸崛起'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  條列一下優缺


  缺

  1.強大獸除了金剛王與神鷹之外都打醬油

  2.劇情超簡單 直白到幾乎沒有

  3.柯博文有點老番癲

  4.機器人登場的角色還真的沒藏.  就預告那幾隻

  5.楊紫瓊怎沒變形



  優

  1.機器人戲份很多. 終於不再是美軍金剛了. 而且也不拖戲.

  2.每一方的機體設計都蠻好看. 這點應該是延續上一集大黃蜂的風格

  3.幻影的個性蠻討喜. 還有大黃蜂戲份終於大減

  4.有一些致敬的部分. 比如最後男主的動力服. 或是台詞 till all are one

  5.看到強大獸在大螢幕變形真的百感交集. 以前看百變金剛的回憶都來了. 可惜沒老鼠

  6.動作場面超多. 有幾個很燃的鏡頭. 譬如大黃蜂跳機前的背影

  7.雖然麥可貝後來越拍越鳥. 但最後之前的主題曲出來還是有點感動.


  這部不意外評價會很兩極

  覺得整部節奏很像在看王道動畫

  捨棄掉劇情加上機器人打架的戲份很多

  節奏很快. 動作設計也不會像麥可貝這樣不知道在打什麼

  但還是輸上一集的大黃蜂一點

  這集動作又變得大開大合. 上一集大黃蜂有各種體技與寢技的運用. 武戲編排比較精緻

  人類戲份也不會到很煩躁. 但女主真的有點醜 (沒辦法我就外貿協會)

  可能不要有錯誤的期待才會覺得好看


  好比你問我七龍珠超:布羅利劇情如何? 超爛的阿

  但是好看嗎? 超爽的阿!!


  另外看有人說比變五爛真的太扯

  變五整片又臭又長. 人類每個都躁鬱症戲份又多

  變五機器人的打戲跟本幾乎沒有.

  都是一些人類美軍在那邊亂. 機器人只在背景不知幹嘛

  判官開車到一半被大黃蜂幹拐子. 連變形都來不及就顧路

  密卡登最後還莫名其妙被柯博文一腳斯巴達踢給踢飛出去

  柯博文連變形畫面都沒有. 整個搞笑


  --

  真的 麥可貝版的機體都一堆虎背熊腰加逆足. 沒有難看但就覺得怪怪的

  可惜都已經重啟了 大黃蜂還是那個奶嘴臉'
