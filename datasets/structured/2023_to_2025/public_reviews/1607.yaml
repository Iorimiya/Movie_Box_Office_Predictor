  \ 只吐火沒變形 講一堆廢話\n全隊來地球 其他人都有聯絡 就她一個人被排擠\n還被小boss一發感染 黑化\n\n反派人物真的少得可憐\n都雜魚小兵 博派還可以打成這樣\n\
  我說你們強大金剛跟博派\n與其在那吹對面多強 不如多試幾次切他中路好嗎\n\n\n這邊應該是編劇政治正確發病\n明明就是黑人女 要去證明自己比老闆強\n才觸發鑰匙噴出能量\n\
