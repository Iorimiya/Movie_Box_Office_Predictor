url: https://www.ptt.cc/bbs/movie/M.1687072760.A.D9C.html
title: '[普雷]變形金剛之萬獸崛起 '
content: '雷文防雷資訊頁


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  應該叫賽博坦之國家寶藏

  還好這類特效片看之前我早就把邏輯鎖在房間裡


  主角群很政確的選了兩位有色人種


  正當我為了亞洲人打抱不平的時候,聽到了神雕發出了楊紫瓊的聲音

  怪怪的但還可以接受



  一如往常的套路 柯博文又發現了在地球的好東西

  自不量力的去找 大黃蜂順便領了便當

  卻沒有絲毫的感動 反正後面一定有什麼賽博坦科技狠活之類的救活

  (這片能量晶體)


  接著上演了一場有禮貌運動的禮貌之戰


  先是野生金剛把密碼刻在外面,不過這很人性化

  我怕忘記密碼也是把密碼用便利貼貼在螢幕旁邊


  然後反派瘟疫很貼心地製作了一個適合人類大小的操作台

  還有一條適合人類大小鑽入的管道讓女主背刺

  兩邊人馬各種禮讓


  可能怕觀眾覺得不夠刺激再加入鋼鐵人的戲碼


  不知道是不是覺得金剛大戰哥吉拉有搞頭 弄了一個G I Joe的彩蛋

  看完呵欠連連 目油流了不少



  --'
