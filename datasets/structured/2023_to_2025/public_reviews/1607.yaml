url: https://www.ptt.cc/bbs/movie/M.1686158005.A.D7B.html
title: '[極好雷] 變形金剛  萬獸崛起 史上最好的改編'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~






















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  身為一個出生就是變形金剛粉絲


  愛到現在也37歲的中年大叔來說


  這次的改編真的非常好


  我認為是七集變形金剛裡面最好看的一集


  甚至覺得是所有真人化卡通作品裡裡改編得最好的一部





  變形金剛真人版電影，每一集都是改編作品


  跟卡通都存在很大差異


  他不像漫威英雄系列是小改小修


  主線相同，魔王、角色背景，故事劇情大致都相同80%以上


  變形金剛電影版基本上就是外傳，跟卡通雷同度大概20%~40%


  保留一些變形金剛的特性、性格、能力、名稱


  但出現的背景時空、劇情、出現方式基本上全魔改




  以下先聊聊這次電影版的幾點不同



  1.密卡登戲份完全刪除


  在1986變形金剛大電影卡通版本裡面


  尤尼克隆是一個大魔王


  他將密卡登改造成格威龍搭配這次的瘟疫成為他的手下


  但....你知道的電影版格威龍已經在第4集裡面出現過...還是人類改的


  另外，卡通版電影柯博文戰死，臨死時將能源矩陣交給馬格斯，


  結果不小心掉落被洛迪文撿走，洛迪文成為至尊首領帶領博派金剛

  (電影版第5集登場，但戲份就是跟大黃蜂情同手足的金剛，不是領袖也沒帶領博派)





  2.強大獸是博派的後代且發生了穿越


  卡通版金剛王是獨一無二，但片頭出現兩個金剛王


  一個留下戰死爭取時間讓其他強大獸上太空艇穿越


  這裡就是電影版魔改


  可以看成同一種金剛可以出現複數


  像後來金剛王問神鷹:其他人呢，他也回答只剩下我了


  可以理解是同一種類的百變金剛只剩下她了



  強大獸是博派的後代


  時間線來說強大獸從地球遠古時候就在了(上飛船後過來地球)


  柯博文他們才來七年


  金剛王看到柯博文時候還很失望


  覺得這不是他心中領袖該有的樣子


  但這是當然的，因為這時候的柯博文的確還不成熟


  還沒走出自責的心魔，一心只想回家



  3.片尾主角跟幻影合體


  這在卡通中是Transformers: Super God Masterforce裡的戲分


  人類少年可以穿上動力裝甲跟變形金剛合體


  這部分改得很好，也很感人


  卡通版本裡幻影戲份並不多，甚至也不算常出現的角色


  這次電影導演把他發揮得非常好


  從頭到尾取代大黃蜂的戲份，讓大家換換口味


  畢竟大黃蜂看了這麼多集，是時候換換人


  且幻影有情有義技能又炫，是個很討喜的角色




  4.掠奪獸戲份0


  博派對立面是狂派


  強大獸對手是掠奪獸


  不僅恐龍王、蠍子、毒蜂、翼龍戲份全無


  甚至強大獸的白虎、老鼠、魔龍也都沒戲份


  但這次會是三部曲


  後面的兩集應該會登場






  哈，聊得有點太多



  來說說為何這次的版本


  為何很多卡通版變形金剛、百變金剛的粉絲一致狂吹




  電影的好與壞是非常主觀的


  但一個好的作品


  絕對是非常讓人有帶入感且流暢地說完一個完整的故事




  這次劇情非常緊湊不脫戲


  短短的幾個場景就讓人知道主角跟弟弟的兄弟之情


  也因為這樣讓幻影捨身保護主角，因為幻影答應過要罩他



  配樂也恰到好處


  主角偷車、女主角做研究時的配樂讓人很有緊張感同時又很有趣


  飛車追逐時充分展現幻影的能力


  給看過幾百次飛車追逐的觀眾帶來新鮮感



  最激賞的是這次的武打戲


  這是七集變形金剛裡面打鬥最多最流暢的一次


  不得不說，動物金剛的打鬥做的真得很好


  這種夢幻聯動在卡通版是不可能出現的


  簡單的說就是張飛岳飛一起去無雙世界殺敵


  而且這次作品不像以前為了賣玩具


  登場了一堆金剛但都沒啥戲份


  幾乎都有發揮到



  不少感動的地方


  首先這集的柯博文並不喜歡人類，不希望人類插手


  有別以往的柯博文


  這次的柯博文並不是個成熟的領袖


  讓粉絲看到他不同的面相以及成長的過程


  這次也終於讓壞人方大展拳腳


  之前的幾集都是一堆壞人圍攻主角


  這次反而就三個壞人把好人虐歪



  這次的電影真的看得非常滿足


  期待接下來的兩集


  換新導演真的是正確的


  可以拍出不同感覺，也將一個好的IP換換口味重啟






  --

  哥，說被撿走不都是粉絲間的玩笑話嗎??

  認真回，完全不用補，電影版都是獨立故事

  但真的想補的話，百變金剛的1~3季很好看，美配yt上好像有全集

  好懷念民視的台灣配音版本，小時候安親班都會給看，

  一堆小男生在安親班看的很過癮

  台配版本怎麼找都找不到，網路上大多是美配或是陸配

  因為粉絲時間軸的不同，現在30~40歲的是看變形金剛卡通長大，

  看的電影版都是回味童年故事，就像隔壁的小美人魚，父母輩都是看過長大

  所以大多覺得不喜歡

  但如果是看電影版才入坑的粉絲，這集就不會覺得多好

  動畫檔的大人之所以覺得好，是因為他終於改編出一個像樣的故事

  外加可以看到祖先+後代一起打壞人，打鬥的運鏡也不是麥可貝時代的

  兩個機器人站一起互尻，而是有配合技加上更加合理的真實打法

  還有許多細膩的動作表現(雅希閃子彈)

  當然不是的，他有說他的名字"同溫層"

  卡通角色超多龍套角色

  光天王星的樣子改個顏色就有十幾位

  天火已死於第二集電影版，說到這，

  新版本(大黃蜂+萬獸)網路上說這兩集類似軟性重啟

  目前還不確定是不是跟麥可貝同一個宇宙，雖然時間軸是對的上的

  (大黃蜂+萬獸早於麥可貝)

  但會變成博派來地球兩次...

  目前個人想法會覺得變形金剛1~5是一個系列

  大黃蜂、萬獸是一個系列

  就看之後的電影版有沒辦法銜接了

  影評那些都參考看看就好，最終論英雄的肯定還是票房

  真的，跟老婆看了好幾集，電影版柯博文真的很囉嗦....

  我覺得這次的好一點，BBB真的有點膩

  可惜的是沒有掠奪獸，恐龍王陣營有很多角色刻劃的不錯

  絕對忠誠的螞蟻&蠍子、耍寶的毒蜂、背刺的紅蜘蛛、黑蜘蛛

  每天YES~~~YES~~~的恐龍王

  下面有人解了，當年音速小子很紅

  正解，另外補幾個小彩蛋，

  弟弟剛登場穿的T是金剛戰士

  玩的GAMEBOY是馬利歐

  無線電通訊在那個年代很常用來陌生人交友或是通訊

  還有BB摳機....都是一些年代的回憶

  至於G.I.JOE 特種部隊埋下的伏筆，看來可能會讓人類有機會跟變形金剛更多的合體

  實體玩具有一起發售的產品，之前孩之寶就有說過要讓兩部聯動

  看來人類戲份又要增加了阿.....'
