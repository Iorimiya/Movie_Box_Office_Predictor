title: '[好雷] 變形金剛：萬獸崛起'
content: "雷文防雷資訊頁\n \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n \n\
  \ \n \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n \n剛看完了，熱騰騰的心得\n\
  \ \n覺得這部有點王道，甚至中二\n \n且讓幻影當以前大黃蜂的角色有不錯的效果\n \n仍舊是值得進電影院看的\n \n而且那麼多年沒出了（大黃蜂算前傳的話\n\
  \ \n_________________________________\n \n簡單講一下劇情\n \n開頭帶到為何Maximals會來到地球\n \n以及介紹本部最重要的東西「超時空鑰匙」\n\
  \ \n再來到1994人類世界\n \n男主為了求生不得不行偷竊之事\n \n輾轉遇到了幻影與博派們以及獵鷹\n \n女主則是在考古工作中發現了一部分超時空鑰匙\n\
  \ \n引來了瘟疫等反派，並與博派發生第一次戰鬥\n \n再來一行人為尋找另一部分的鑰匙而來到祕魯\n \n找著找著反派又來攪局，發生第二次打鬥\n \n而為了找尋鑰匙遇到了金剛王等\n\
  \ \n最後鑰匙仍失守，引發了最終大戰\n \n________________________________________________\n \n再來講講優缺點\n\
  \ \n優點：\n \n1. 劇情雖然平，但安排算是緊湊，不會拖\n \n2. 打戲的分鏡都很棒，不會看不懂，反而蠻爽的\n \n3. 前面有成功營造出瘟疫的強，確實是個大Boss\n\
  \ \n4. 尾段配樂給了麥版第一集的交響樂，有感動到\n \n5. 幻影的表現讓整部變得幽默，且富感情\n \n缺點：\n \n1. 電影名叫做Rise of\
  \ The Beast，但除了獵鷹跟金剛王其他戲份偏少（豹子還是挺帥啦\n \n2. 讓男主穿上幻影有點傻眼，還是這次目標是日本票房？\n \n3. 雖然是90年代，但嘻哈元素不夠多（個人認為）\n\
  \ \n最後講講其他\n \n柯博文從一開始有點自私，到後來願意為地球奮戰，情感上的轉變是描述到位\n \n而且那句「給你看看真正至尊的力量」很中二XD\n \n\
  最後彩蛋看到GIJOE笑出來，但還是期待孩之寶要怎搞了\n \n然後我認為後半段一直有提到Energon 也許之後會有Predacons的角色出現（？\n \n\
  以上 認為這部還是偏好啦\n \n \n--\n\n\n個人認為這才算重啟第二部而已就要跨到GI有點太早了"
