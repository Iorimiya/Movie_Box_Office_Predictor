url: https://www.ptt.cc/bbs/movie/M.1686412995.A.0E3.html
title: '[普好雷]變形金剛：萬獸崛起'
content: '前陣子才終於看了大黃蜂，

  雖然對於整個家庭的敘事和軍方描寫，

  覺得完全搔不到癢處超不滿意，

  但是設定女主角和大黃蜂的關係，

  以及音樂的部分真的很不錯。

  有一種一如繼往的可愛。



  本次承接大黃蜂，算是半重開機，

  在人類敘事上雖說不特別，

  但我覺得「設定上」樸實的很不錯，

  簡單交代他們的社會地位背景，

  比起前五部以及大黃蜂的主角，

  都是更底層更渴望力爭上游的人。


  然而，這也帶出一股微妙感，

  女主角或許是意識到考古可能的發現，

  才義不容辭出發；

  但男主角會讓我覺得：

  蛤我都為了弟弟為了家，

  被美軍被社會踢出來，我還要救地球？

  這未免也太大愛了吧XD

  沒有長出反派人格，真的是很了不起。


  我感覺刻意安插弟弟說超人的那段，

  算是努力在合理他決定參與的原因，

  但是為了弟弟這點沒有被很好的敘事。

  但一方面也覺得，

  最後的收穫是意外這點，還挺不錯的。

  他真的是為了各種很單純的理由決定參與。


  整部讓我情感比較有波動的，

  是幻影捨身保護男主角的地方，

  幹好帥。


  帥到讓人覺得搞屁啊柯博文。


  明明大黃蜂死了我也超難過，

  但來得太快，

  柯博文又怪在男主身上害我超出戲。

  （想說是甘他屁事XDDD）


  其實整部的幻影都好讚，

  雖說人類男主角是諾亞，

  但真真正正的男主角毫無疑問是幻影吧。

  真的好帥。


  戰鬥變形的地方，

  雖沒太多看點，

  但是音樂搭配hiphop？以及其方式，

  讓我覺得很有新意！

  我會蠻想重看最後那些片段的。


  其他各種槽點當下覺得蛤，

  事後回想覺得好像也不太重要。


  看電影看到現在第一次很想補transformers整個系列認識各種角色，

  雖然不知從何開始，畢竟不是我童年。

  我看別人說這部的幻影個性改過，

  很像混入了其他人，

  但我覺得這版的真的很不錯^^b


  總之喜歡很痞又帥的外星機器人的，

  我非常推薦。幻影好帥。

  大黃蜂也是一如繼往的可愛。

  柯博文照樣總在很爛的時機點出場。


  --

  聽起來這個爵士很紳士耶

  真的不太行

  不過打架畫面和音樂搭起來還是蠻嗨的

  我覺得博派都有表現到這點其實蠻厲害的啦

  右肩的砲很顯眼，現在這個版本

  身體中間的轉輪？比較顯眼

  帥比較重要

  （其實我不知道誰強度比較強欸？

  看不出來，只感覺柯博文強度成謎）'
