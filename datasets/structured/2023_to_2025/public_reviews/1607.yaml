url: https://www.ptt.cc/bbs/movie/M.1644983757.A.CE7.html
title: '[新聞] 變形金剛第七部《萬獸崛起》2023暑假登場'
content: '新聞網址：


  原標題：


  2022-02-16 10:25:50



  《金牌拳手：父仇》（Creed II）導演小史蒂芬卡普爾（Steven Caple Jr.）執導的第七

  部《變形金剛》（Transformers）真人電影，在去年大動作宣佈定名為《變形金剛：萬獸

  崛起》（Transformers：Rise of the Beasts），當時外界普遍猜測，《變形金剛》的電

  影宇宙未來會以《百變金剛》（Beast Wars： Transformers）故事線發展多部續集，而

  派拉蒙影業今日也在維亞康姆 CBS 集團的投資者大會上公告，




  《萬獸崛起》由多米妮可菲許巴克（Dominique Fishback）、安東尼拉莫斯 （Anthony

  Ramos）兩人主演，前者飾演博物館的文物研究員艾蓮娜，後者則飾演退伍軍人諾亞，朗

  帕爾曼（Ron Perlman）配音「金剛王（Optimus Primal）」一角，彼得庫倫（Peter

  Cullen）則回鍋獻聲「柯博文」。




  ，主軸將跳脫以往博派與狂派的鬥爭，著重於呈現更多元的派系衝突，具有動物

  型態變形能力的「極限金剛」和「掠奪金剛」皆會登場。



  ，本集由達奈爾麥塔耶（Darnell Metayer

  ）與喬許彼得斯（Josh Peters）擔任編劇，並根據《活屍大軍》（Army of the Dead）

  編劇之一的喬比哈洛（Joby Harold）、《變形金剛 5：最終騎士》（Transformers：

  The Last Knight）編劇之一的麥特哈洛威（Matt Holloway）先前所撰的幾版劇本初稿進

  行改寫。



  除了已殺青的《萬獸崛起》，現正籌備中的《變形金剛》電影還包括 DC《藍甲蟲》（

  Blue Beetle）導演安吉爾曼努埃爾索托（Angel Manuel Soto）執導的未定名新作，以及

  《玩具總動員 4》（Toy Story 4）導演喬許庫利（Josh Cooley）執導的前傳動畫電影，

  後者預計 2024 年 07 月 19 日上映。



  --


  麥可貝從導演變成監製....


  --'
