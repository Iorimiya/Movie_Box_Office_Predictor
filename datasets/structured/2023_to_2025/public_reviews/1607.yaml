url: https://www.ptt.cc/bbs/movie/M.1686493689.A.110.html
title: '[負雷] 變形金剛：萬獸崛起'
content: '雷文防雷資訊頁





  今天因為下午大雨，不幸被困在百貨公司中，心想那就看個電影打發時間吧，於是買了五分鐘後就開演的變形金剛：萬獸崛起。


  本來也沒抱任何期待，但越看越崩潰，看完雨沒停，心裡難受的感覺也停不下來。


  我先講結論，不要浪費錢去看






  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看完吐槽點真的太多了，想到什麼打什麼


  1. 男主角諾亞的人設跟劇情發展沒有什麼關聯，也沒什麼意義。

  他出場的第一場戲就看到他在修復一個科技產品，並藉這個賺錢。結果後面完全沒有任何相關的發揮。

  設定上有個生病的弟弟，兩人感情很好，但就僅此而已，沒有因為弟弟讓他下定決心或領悟什麼道理，純粹是偶爾跟弟弟無線電一下。

  去面試被不會團隊合作的原因打槍，後面也沒看到他不會團隊合作的行為，好歹設定一些他不懂得團隊合作一意孤行害到隊友的行徑，但什麼都沒有。

  前軍人的設定也沒有什麼表現，沒有什麼打鬥，甚至連開槍都沒有，至少遇到這種大事情該找前隊友來幫忙，或是弄把槍吧？

  這些人設對劇情都沒啥關聯，隨便放個路人大學生都可以。


  2. 女主角艾連娜看起來是智力擔當，但仔細想想每個情節都是湊巧，湊巧他主管把自己的員工證別在衣服上丟給他讓他可以偷偷去研究古文物，湊巧他用的儀器會激發能量，湊巧他抄下來的文字是密碼（誰會把密碼寫在物件外面？）


  3. 開場直接一個旁白講前情提要，把所有懸念都講完了，為什麼大家要搶那個傳送器？因為反派要。為什麼反派要？因為他要靠那個到處亂吃星球。這集會有那些新金剛來幫柯博文？就這些機器動物。其實這些橋段把他放到後面搭配金剛王或神鷹出場時帶出這些故事不是更好？先講完了我看到博物館打鬥時也不會有瘟疫超爆強的那種無力感，金剛王跟柯博文對峙的時候也沒有緊張感。因為後面大家都知道這些角色會出來幫博派。


  4. 故事像是山寨 B 級片一樣，好多場戲都有別的電影的影子，

  女主角出場的戲跟跟神力女超人 1984 裡芭芭拉剛出現的時候超像。

  幻影載著諾亞在路上狂奔死不講話就像大黃蜂，我還以為他也是啞巴，結果根本是碎嘴王

  後面兩軍大戰的鏡頭跟復仇者聯盟四最後大戰幾乎是差不多的運鏡跟氛圍營造，但感覺天差地遠

  彩蛋諾亞面試後，面試官打開暗門的畫面又很像星際戰警


  5. 一大堆前後不連貫的設定，像是強大金剛到其實也會變形人人形，但前面都用動物形態打鬥，那如果人形比較強，開場那場戲幹嘛不用人形打瘟疫？

  瘟疫那個感染武器那麼強，神鷹被打一下就被控制，前面他多的是機會用這個武器對每個博派跟強大金剛來一發，卻都不用？

  幻影可以變成人的裝甲，那一開始諾亞要潛入博物館、去秘魯時為什麼都不給他？去秘魯還只給他一個手套，然後也不跟他講這手套可以攻擊

  柯博文一開始超不信任人類，但不知道為什麼突然又很信任諾亞，尤其是諾亞要破壞超時空鑰匙時還在那邊賣慘。


  6. 宇宙大帝這個反派設定有夠無聊，從頭到尾就只是一個一直喊著肚子餓的巨大機械屁眼。


  7. 弟弟的病情其實一點都不重要，不但不影響主角要不要參與到主線劇情，甚至弟弟還可以狂打電動打到拿不了叉子。


  8. GI GOE 從頭到尾都在監控諾亞，然後完全毫無反應？


  9. 秘魯那個地板存在那麼多年，就只有女主角一個人發現可以轉？


  10. 我最難受的就是那個洛克人裝甲，看起來有夠 B 級片，完全就是那種山寨幹片會出現的設計跟特效。


  11. 前面說破壞掉超時空鑰匙會有超新星等級的爆炸，結果爆炸時連柯博文就只是被炸飛。


  12. 柯博文要被吸進爆炸漩渦裡時自己抓都抓不住，然後洛克人諾亞卻抓住他自己不會被吸走，金剛王跑來幫抓自己也不會被吸走？


  13. 前面大家一直嫌棄幻影愛出風頭會壞事，但整場下來幻影也沒壞什麼事。


  14. 在秘魯小村莊的早晨，大家在那邊說瘟疫要來要戒備，然後所有人帥帥的擺陣型眼觀四面耳聽八方，下一秒直接被撞飛，我差點笑出聲。


  15. 男主角最後面試的時候死不肯講變形金剛的事情，然後在車庫裡直接叫幻影變形給丟下他自己烙跑的盜仔看？


  16. 主角團沒犯什麼蠢，反派那邊也沒有多高明，劇情上都是主角團們有一個進展，反派馬上就追來暴打他們一頓得手，然後主角他們又找到下一個方法，一執行就被反派追上來暴打。


  17. 故事本身營造不出絕望感，每次好像怎麼樣完蛋了就會有人說喔沒事啦還有別招。

  比方說去博物館搶鑰匙，瘟疫也來，暴打一頓把鑰匙帶走，神鷹就說喔沒事啦還有半個鑰匙。

  去秘魯拿另外半把鑰匙，瘟疫也來，控制神鷹後把鑰匙帶走，金剛王就說喔沒事啦還有暫停密碼。

  大決戰密碼輸入到一半被瘟疫轟掉控制台，柯博文就說喔沒事啦我犧牲自己破壞鑰匙就好

  你們每個人都留後手幹嘛啦，既然有那麼多招為什麼不一開始跟大家講清楚有哪些方法，制定好作戰策略？


  19. 特效時好時壞，壞的就是在幻影給諾亞超能手套跟洛克人裝甲的時候，看起來突然變五毛特效有夠出戲


  20. 福斯小巴是來幹嘛的？除了開點口音玩笑（而且不好笑）之外，就只是摩托車的駝獸而已


  21. 萬獸崛起根本沒萬壽也沒崛起，總共才出現五隻強大金剛，開頭死一隻，末段再死一次，五萬變三萬，博派隨便撈都比你多，乾脆叫億博崛起



  雖然不是變形金剛迷，也沒抱任何期待去看，但看完真的很痛苦，沒有愛的人真的不要輕易嘗試，我甚至寧可再去看一次鄧不利多的秘密


  --


  --'
