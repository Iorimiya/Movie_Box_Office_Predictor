title: 'Re: [討論] 變形金剛 萬獸崛起 '
content: '昨天看完真的讓人出戲

  1.首先是柯博文跟博派金剛ㄧ開始就被屌打，各種火力攻擊武器攻擊都傷不了反派三隻。

  整個過程也不見他們有任何升級，突然就打贏了


  2.柯博文變得好多愁善感自怨自艾，跟前幾集那個正面陽剛的博派首領完全像兩個人


  3.柯博文拼了老命都砍不進去的瘟疫竟然被幻影鋼鐵人ㄧ隻小刀插進腳踝開始居於弱勢


  4.整個世界只有四隻博派三隻反派跟兩個人類在躲貓貓


  --'
