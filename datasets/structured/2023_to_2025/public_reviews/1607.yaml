url: https://www.ptt.cc/bbs/movie/M.1686580336.A.4B8.html
title: '[普雷] 變形金剛：萬獸崛起-靠最後大戰拉尾盤'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  要為《變形金剛》系列作個排名還真有點困難，要找出最好看的不難，我會排個《大黃蜂

  》大於等於第一集>二到四集>第五集，第五集墊底無庸置疑，那集爛到人神共憤、爛到一

  無是處、爛到你會懷疑麥可貝到底多想被開除才會拍出這種東西，只要有它在，之後的電

  影怎麼拍都很難會是這系列最爛。但二到四倒是比較尷尬，它們各自有各自的爛，但同樣

  也都有一些很不錯的、值得一看的點─老實說第四集我完全忘記在演什麼，我只是憑印象

  覺得當時的觀感不差就是了。

  .

  而這系列的第七部電影：《變形金剛：萬獸崛起》我會排在什麼地方？大概也是一樣丟在

  二到四那個我自己也不清楚到底誰比較好的區間裡面吧。

  .

  先說很差的地方，這集的劇情雖然稍微改善了麥可貝那幾部到後期過度依賴美軍而壓縮變

  形金剛表現機會的問題，但並不代表這集的劇情有比較突出或優秀，我還覺得前兩幕的敘

  事蠻爛的，是非常無趣又乏味的麥高芬應用，基本上就是低配版的《國家寶藏》或是真人

  版的《愛探險的朵拉》─後者的真人電影可能還比這片的前兩幕要好看點。

  .

  我知道沒有人來看這系列會真的多在乎劇情，但這片的片長都已經夠短了，劇情還能讓人

  感到幼稚無聊也是真的不應該，看到一個擺在公共場所、人人都可以去碰的遺跡被主角們

  轉一轉就打開了我更覺得我的智商被侮辱了，劇情不重要是一回事，但我總是很討厭編劇

  把觀眾當白痴的那種感覺。

  .

  甚至連這片在前兩幕的動作戲我都覺得是有經過精心安排的，我並不是說動作的編排有多

  精彩，而是置入動作戲的時機，幾乎都是在我準備要失去耐心的時候就趕快打一場轉移我

  的注意力，但就連動作戲都只是在還行的水準上搖擺而已。

  .

  小史蒂芬卡普爾拍起大型動作場面，調度能力其實還是不如麥可貝的，連崔維斯奈特都比

  不上，事實上，我一直覺得《大黃蜂》有整個系列最好看的動作戲，動作設計其實相當暴

  力，但因為是機器人打架所以這點總是被忽略掉，而且比起其他集的群戲戰鬥，《大黃蜂

  》更多的是一對一的戰鬥場面，奇想外星生物也不必像《環太平洋》裡的機甲獵人那樣笨

  重緩慢，有許多靈活的纏鬥扭打，非常精彩。

  .

  話說，這片的預告片裡有一段戰場上的長鏡頭原本挺讓人期待，但沒想到那竟然已經把整

  組鏡頭完整的播完了，而且還是整部電影最精彩的鏡頭設計了。

  .

  光看前兩幕，我還以為這部電影要死了，彼得戴維森配音的幻影是個亮點，但還沒辦法一

  肩扛起整部電影，不過到了第三幕的結尾大戰，就把這部電影給救回來了，就像我在一開

  始說的，這系列其他部分再怎麼不堪，都有令人眼睛一亮的動作場面，例如第二集柯博文

  在叢林裡的一對多或是第三集柯博文跟御天至尊的對打都是我時常會回顧的動作，《萬獸

  崛起》中最具代表性的場面，必定就是最後一整段的長篇戰鬥了。

  .

  雖然正反派的變形金剛其實都沒幾隻，號稱萬獸崛起，但強大金剛根本只有五隻，而且戲

  分際不多也不關鍵。但這也不重要，反正單論戰鬥規模，這片的戰爭戲應該是全系列最龐

  大的一段，大家一直期待看到的史詩級的大場面演了七集的電影終於給你看了，而那段真

  的就是屬於大螢幕的奇觀，我不確定如果未來用小螢幕來看會怎麼樣，或許會覺得相當混

  亂也不一定，不過我當時在IMAX大螢幕看那整段戲時，我一方面覺得明明這部電影缺點很

  多、我好像不該這麼享受這部電影，但另一方面，我又不能否認我是看得真的很開心很過

  癮。

  .

  在此我簡單為這片下個結論好了，它並不是一部非看不可的電影，如果你期待《變形金剛

  》系列能夠靠著這片再創高峰，你可能會失望，但如果你想看的話，那必定得進電影院看

  才行。

  .

  至於人類的戲分倒還算安排的恰到好處，男主角安東尼拉莫斯蠻不錯的，一開始魯魯的樣

  子確實讓人感受不太到這個男人的魅力，但隨著劇情發展到後期開始認真起來時，反而讓

  人覺得他越看越帥，氣質真的可以改變一個人的帥度，至少不會有西亞里畢福的那種煩躁

  感，或是馬克華伯格那種「你在這裡幹什麼？」的突兀錯愕感。

  .

  而結局放了一個大驚喜也還真的會讓人想看到續集，原本看到男主角跟幻影合體的裝甲有

  點詭異，但看到最後那張名片出現時，又突然覺得好像合理了。不過這個對續集的期待，

  說穿了其實更像是一種想看看他們會搞出什麼名堂的好奇心，反倒是像第一集結尾時，那

  種真心想要再看一部的興奮感跟驚豔感已經沒了，或許這系列也是真的發展到了極限了吧

  。


  --'
