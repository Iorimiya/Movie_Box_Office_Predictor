url: https://www.ptt.cc/bbs/movie/M.1687014934.A.CA2.html
title: '[普雷] 變形金剛：萬獸崛起 -音樂救了這部電影'
content: '剛看完電影

  無雷簡單心得分享


  1.音樂很好聽  這是我看完的最大感想和收穫

  我待會要去搜尋有哪些歌

  要加入我的歌單



  2.笑點有點少

  但還好有這些簡單的笑點

  不然我覺得好悶



  3.我在想

  其實這部片比較適合沒看過變形金剛系列的人

  會比較有新鮮感


  我自己是只喜歡前2集

  這部片很多劇情我都猜的到

  所以沒什麼驚喜感


  動物機器人們也沒讓我覺得興奮或特別喜歡

  我只喜歡嚇尿哪一段XDXD



  4.選角

  男主跟弟弟的年紀感覺像父子

  一直讓我有點出戲


  是男主太老

  或小孩應該再大一些？


  女主有點路人...



  5.種族歧視 或膚色相關的議題，點到為止

  這點給讚




  綜上所述 給普雷




  懷念一下聯合公園QQ


  --'
