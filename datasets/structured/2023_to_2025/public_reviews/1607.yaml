title: '[好雷]變形金剛：萬獸崛起'
content: '也許是太久沒看電影(上一部水之道)


  也許是觀看之前版上的負雷太多


  所以沒抱很高的期待感


  但看完之後竟意外覺得還不錯看!


  我是在週六下午時段看3D版本的


  但看變形金剛的人潮竟然還好


  反而小美人魚一堆人排隊





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  我覺得本次故事線敘述還算單純好懂


  不會像之前幾部切割太破碎看得比較疲乏(印象)


  也許是看3D版本的關係...聲光特效的呈現還算有層次


  變形畫面也比想像中的還多...柯博文就變了不少次


  其他大黃蜂、幻影、機車、航運機、福斯車、金剛王、犀牛、獵豹、壞人等都有變身畫面


  反而是神鷹好像沒變身...(獵豹竟然是男聲)


  幾個場景也讓人印象深刻...宇宙大帝吞噬星球、幻影警匪追逐、博物館混戰、


  祕魯類馬丘比丘混戰等


  尤其最後大戰博派跟強大金剛一起喊話出動再搭上那個配樂


  個個像無雙般變形再大殺四方...讓人看得熱血沸騰啊!


  還有大黃蜂滿血復活空降咻咻碰!


  以及幾個處決畫面(柯博文金剛王聯手處決鏈球機器人、柯博文處決瘟疫)也是誠意滿滿


  另外男主與幻影的鋼鐵人合體也是出奇一手


  感情線有提到男主、弟弟與幻影的兄弟情有被感動到


  以及男主透過與金剛們磨合意識到合作的重要


  而柯博文因無法讓博派金剛們回到母星而自責


  在背負博派領袖的壓力下...想盡辦法要拿到鑰匙回母星


  並在與人類、強大金剛接觸後...


  從不信任人類到開始與人類合作


  從只為自己星球到保護他人星球


  透過這些畫面有刻劃出柯博文的心境轉變


  整體來說...劇情緊湊流暢...是可進電影院欣賞聲光效果的無腦爽片


  至於邏輯性就不要太苛求了...況且看下來也沒有很嚴重不符邏輯的地方


  一些小地方就不用刻意去思考了!


  另外有人吐槽萬獸崛起圖文不符，我是覺得用原文翻野獸崛起就可以了!


  因為至少出了四隻野獸


  若硬要扯的話...最後大混戰的確是空降了不少外星獸!XD


  片尾彩蛋竟然帶入G.I.JOE...真好奇下一步怎麼演!


  --

  看電影的的時候我還蠻有感覺的耶!尤其是一家之主面對的壓力與抉擇...

  謝謝!

  這大於好多啊!XD

  我知道吳奇隆是誰...但那個梗我也沒看懂@@

  幫你謝謝1F!

  他後來有道歉啦!

  幫你謝謝T大!

  這片武打戲真的不錯啊!我看得很過癮呢!

  也沒到一秒那麼快啦!至少有經過一番猶豫跟抉擇啦!

  一開始博派是想保留鑰匙的啊!是真的不行才毀滅他的...

  真的!

  有耶!我還是隊伍尾巴問這是排啥

