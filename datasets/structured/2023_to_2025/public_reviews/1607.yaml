url: https://www.ptt.cc/bbs/movie/M.1686570059.A.DCC.html
title: '[討論] 變形金剛萬獸崛起的幾點疑問'
content: '防雷





























  這部電影的亮點前面大家也有提過，這邊就不贅述，不過打鬥的場面跟出場的機器人還是有一些特色


  但有幾點也是有點疑問

  1.神鷹在博物館時期的參與打鬥，這邊大家都知道瘟疫不好打，但是看到柯博文跟博派都打不贏時，結果是看鑰匙被對方搶走?

  2.有關毀掉鑰匙的觀點，原本男主角在一開始就要毀掉鑰匙，結果柯博文似乎想賽博坦就阻止，結果在無法關機的情況下又毀掉鑰匙，當初電影設定會將火種源放到體內犧牲自己的柯博文，跟想回家的似乎是不同位?

  3.對於宇宙大帝來說，鑰匙到底重要還不重要啊，如果重要，結果就派三位恐懼金剛就要拿回來，宇宙大帝應該有更多非小兵等級的幫手吧?

  4.神鷹為何不能復活但是大黃蜂可以，因為不是都有晶礦?

  5.瘟疫有控制能力，為何就控制一位，如果控制多位不是更好?

  6.柯博文的定位，要懷疑人類也不是不行，但是到底要扮演那位為了長遠自己跟團體都能犧牲的領導者，還是要當擔心團體大家安危的大哥，如果要當後者，似乎也不用一直留在地球?

  7.如果鑰匙真的這麼重要，在這麼多年以來都沒被恐懼金剛發現，為何另一半鑰匙被發現就覺得恐懼金剛就會知道要去哪裡找?

  8.人類在第五集都知道透過輻射指數知道金剛的下落，恐懼金剛連博物館的鑰匙都能偵測到，結果強大金剛在地球這麼多年都找不到?


  以上，也先謝謝大家的說明




  -----

  Sent from JPTT on my Samsung SM-A7050.


  --'
