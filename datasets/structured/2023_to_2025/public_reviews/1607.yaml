url: https://www.ptt.cc/bbs/movie/M.1686123225.A.741.html
title: '[負雷] 變形金剛:萬獸崛起'
content: "1. 女主角實在是...\n   就不多批評了, 但讓人不能忍受的是\n   明明拍男主角的鏡頭就多半是拍整個上半身或是全身\n   偏偏女主角一定要一直讓整個臉塞滿大螢幕是怎樣\n\
  \   ?????\n   到底是怎樣, 還嫌我們不夠10/10\n   現在是把我們店家都當王八蛋久丟啊?\n\n2. 人類戲份無聊且老梗(戲份也很多)\n\
  \   不過電影終究還是要講故事的, 非戰之罪\n\n3. 既然片名叫萬獸崛起\n   想必會給我們滿滿的百變金剛吧, 給我們滿滿的兒時回憶\n   沒有！\n\
  \n   犀牛: 0台詞, 根本沒看到變形\n   豹子: 1台詞, 還是說「抱歉 我剛剛嚇到你了」這種糞到起飛的台詞\n         變形畫面含糊帶過,\
  \ 不到一兩秒,\n         看他丟個標槍就沒了, 根本看不清楚長怎樣\n         就算你要賣玩具也有誠意點吧!\n   神鷹: 很多台詞, 沒變形\n\
  \   金剛王: 只有他有稍微穩定一點的人型畫面, 還特寫在臉部\n\n4. 瘟疫的臉很像閃靈悍將\n\n5. 博派火力很弱, 像是一直在射橡皮筋\n   但最後大黃蜂火力突然變強,\
  \ 是要收尾了是吧\n\n6. 比第二集女大學生變形金剛更尷尬的\n   變形金剛鋼鐵人裝!\n   尬到最高點, 真是想到就想撕電影票\n\n7. 最後原本想說是本斥但多的結局\n\
  \   結果冒出個GIJOE, 更是讓人怒到極點!\n   我是知道GIJOE有連動變形金剛\n   也不能這樣亂搞電影!\n   還是1-3集變形金剛OG好看!\
  \ 麥可貝現在一定在嘻嘻\n\n--\n豹子變人形那個唯一畫面就在預告 就是那麼短!\n抱歉 想必是短到根本沒印象惹!\n第一點真的是讓我最怒的\n我一直閉上眼想說我幹嘛花錢來看這個...\n\
  5至少女主角漂亮吧\nIsabela Merced可愛啊 這回...\n伍歹誌企法院共, 哇奉陪告底!\n我明明打1-3 是在那邊??"
