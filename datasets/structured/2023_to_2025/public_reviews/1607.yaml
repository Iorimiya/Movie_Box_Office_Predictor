url: https://www.ptt.cc/bbs/movie/M.1688048983.A.829.html
title: '[普雷] 變形金剛 萬獸崛起觀後感'
content: '整體分數10分我會給7分 (包含情懷分數)

  這個軟重啟基本上我會當成和麥可貝系列完全無關來看比較合理


  主角們的打戲和鏡頭以量來說看起來算是充足了

  這次把大黃蜂轉成配角改讓幻影當第一男主我覺得是好的選擇

  因為大黃蜂已經累積太多戲了你不換人都看膩了

  雖然劇本走向還是抄了大黃蜂和人類互動的部份啦...


  對你沒看錯 幻影才是這次的第一男主


  柯粉 我是說柯博文粉大概不會看得很開心吧

  這次他與其說是領袖 不如說是一個有PTSD的戰後老兵 滿滿的挫折感跟焦慮感

  可以理解很多人不喜歡這種劇本 覺得老柯又發病了

  可能導演們覺得演出一個完美無瑕的領袖金剛不有趣吧


  然而強大獸的金剛王更慘 他直到後半段才出場 最高光時刻居然是撿尾刀

  和祖先柯博文互嘴...從影片中看的出他拿的是戰槌

  本來應該也可以安排很好的打戲 但是就沒給 真的可惜


  而天災(瘟疫)是設計真的蠻強的 本來我以為他只是先遣隊長小boss

  結果想不到他是卡密卡登的缺 戰績輝煌

  博物館就打爆博派 然後收掉大黃蜂 祕魯戰還能感染飛箭直接收掉對面一個幫手

  老實講最後根本也是劇情要他輸他才輸的 不然前半段演出

  老柯要反殺他看不太出什麼合理性 畢竟博物館那裡太輾壓了

  也沒有埋什麼伏筆給老柯逆轉 就只是時間到了你該輸了


  接下來就要講到打戲的安排了 這次的打戲老實說 是重量不重質

  沒看到像變一那樣有非常完整的長鏡頭的對戲

  大混戰的部份一直很刻意的移動鏡頭 我們都知道鏡頭越晃就是越混...

  但是至少出場的金剛們數量上是有的

  頂多是最後的老柯和瘟疫?我不知道台灣翻譯是叫什麼 國外華文翻譯叫天災

  最終的塔頂互P才有一點像樣的固定鏡頭


  真應該多給一點戲讓強大獸們用 這次還是很偏autobot


  人類戲份 這次還是沒辦法的必須要有 但是基本上看的出導演盡量塞在前面

  然後把主角們對打的戲分放到後面了


  整個劇本毫不掩飾的御都合主義非常重 女主角(姑且這樣叫)根本萬能

  光靠她的考古知識就carry全場 不知道該說是好還是壞


  然後劇情邏輯上以大人來說很多地方會看了覺得不合理的

  如果你不是系列粉絲 老實說我不推薦去看

  整體分數 變一還是在這次的萬獸崛起前面 希望後續有續集的話

  強大獸們可以有一些其他的安排 包含兩群金剛們之間的關聯性 祖先與後代

  還有為什麼雙方會穿越時空相會 原本金剛王守護的星球到底是不是未來的地球?

  這些我覺得都還能講故事 只是我不太看好導演會想演這個部份


  或許他們這次看票房不出色 就放棄強大獸了 誰知道呢?


  --




  --'
