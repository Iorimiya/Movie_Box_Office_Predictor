url: https://www.ptt.cc/bbs/movie/M.1683719158.A.283.html
title: '[新聞]變形金剛：萬獸崛起片長曝光！創《變形金'
content: "《變形金剛：萬獸崛起》片長曝光！創《變形金剛》全系列電影歷來「第二短」\n\n\n《變形金剛》（Transformers）系列電影不僅格局史詩，片長往往也「很史詩」，由麥可\n\
  貝（Michael Bay）執導的前五集，其片長一律都至少 140 分鐘起跳，《變形金剛 4：絕\n跡重生》（Transformers：Age of Extinction）更是長達\
  \ 165 分鐘，然而最新一部的《\n變形金剛：萬獸崛起》（Transformers：Rise of the Beasts）卻是一反常態。\n\n外媒《Collider》獨家披露，這次《萬獸崛起》的片長僅有\
  \ 117 分鐘，只比外傳《大黃\n蜂》（Bumblebee）長個三分鐘左右。由於《萬獸崛起》出場的角色眾多，故事格局相當\n龐大，作為新三部曲的第一部，它更必須花時間替後兩集的劇情鋪路，因此片長竟不到兩\n\
  小時，難免讓人有些意外。\n\n《萬獸崛起》由《金牌拳手：父仇》（Creed II）導演-小史蒂芬卡普爾（Steven Caple\nJr.）執導，該片劇情接續《大黃蜂》（Bomblebee），時空設定在\
  \ 1994 年，主軸跳脫以\n往博派與狂派的鬥爭，著重呈現更多元的派系衝突。\n\n《萬獸崛起》配音卡司網羅：恐懼金剛「災厄」彼得汀克萊傑（Peter Dinklage）、博派\n\
  金剛「雅希」萊莎寇希（Liza Koshy）、博派金剛「雲霄」約翰迪馬吉歐（John\nDiMaggio）、分飾強大金剛「犀牛」和狂派金剛「圈套」的大衛索博洛夫（David\n\
  Sobolov）、恐懼金剛「夜鶯」米凱拉潔羅卓裡奎茲（Michaela Jaé Rodriguez）、博派\n金剛「千斤頂」克里斯托費爾南德斯（Cristo Fernández）、「Reek」陶比紐維吉（\n\
  Tobe Nwigwe）、強大金剛「金剛王」朗帕爾曼（Ron Perlman）、博派金剛「幻影」彼特\n戴維森（Pete Davidson）、強大金剛「神鷹飛羅剎」楊紫瓊、以及長年固定為「柯博文\n\
  」獻聲的彼得庫倫（Peter Cullen）。\n\n真人卡司方面，則網羅了多米妮可菲許巴克（Dominique Fishback）、安東尼拉莫斯 （\nAnthony\
  \ Ramos）、露娜勞倫維萊茲（Luna Lauren Vélez）等演員。北美預定 06 月\n 09 日上映，台灣則於 06 月 07 日搶先登場。\n\n\
  \n\n\n新聞網址：\n\n\n\n===========\n在拍爛應該就沒下一部了吧\n\n--"
