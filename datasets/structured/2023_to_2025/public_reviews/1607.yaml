title: '[討論] 變形金剛:萬獸崛起的票房表現是否亮眼？'
content: '美國在06/09週五上映變6萬獸崛起，首日票房為3440萬美金，在全美3678家戲院上映，平均

  每一家貢獻9352元美金，這樣的表現來對比2007年變1首週五票房2265萬美元(4011家戲院)

  ，平均

  每家貢獻4781美元，真的算是亮眼。


  這裡需要說明的是變1是在2007年7月2日(週一)上映，一開始只有3050家戲院，美國國內票

  房為880萬美元，在次日才達到4011家戲院播放。當時美國獨立紀念日的單日票房為6572萬

  美元，平均每家貢獻7248美元。


  由以上客觀票房數字來觀察，變6導演小史蒂芬‧卡普爾交出的成績單，讓派拉蒙吃下一顆

  定心丸，新變形金剛三部曲已經可以繼續作業了！


  參考資料:

  mojo box office website

  Transformers: Rise of the beasts (2023)





  --

  阿姆斯壯 巴霍巴利 (Armstrong Baahubali)

  =======================================================================

  鋒芒、自負、輕率，是年輕人的三大病，去之則成功，不去之則失敗！

  珍惜光陰不秒輕，一生樂學理求明，不求多少功傳世，老馬長途盡力行！

  心本絕塵何用洗，身心無病豈求醫，遙知是佛非身處，明鏡高懸未照時！

  =======================================================================


  --'
