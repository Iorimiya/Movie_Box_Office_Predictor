url: https://www.ptt.cc/bbs/movie/M.1687707197.A.240.html
title: '[好雷] 變形金剛：萬獸崛起 Transformers:Rise of the Beasts (2023'
content: '孩子考完期末考大獎賞一個週末看兩片，第一天看完《超級瑪利歐兄弟電影版》第二天來看《變形金剛：萬獸崛起》！話說我們家看此系列的入坑背景也不同：媽媽是看《變形金剛》第一集
  (2007) 跟著西亞李畢福與大黃蜂長大的，爸爸我則從第三集《變形金剛 3》開始跟看、覺得貝炸流又多又爽但劇情喜歡白爛搞笑角色喜歡插科打渾，孩子則是跟著其他小孩從爸媽沒看的動畫看起、另外以前有買些變形玩具在玩中長大...
  以這幾種不同角度來看這集《萬獸崛起》算是達成我們一家三口都還頗滿意的平衡。




  首先，從《大黃蜂》開始導演都已不再是麥可貝，上次看《大黃蜂》那小鄉小家小友情故事本來就和全系列調性不太一樣，這次《萬獸崛起》重回大堆頭金剛對決戲路就可看出「有沒有麥可貝」果然大不同：以前最愛麥可貝的金剛變化慢動作、那機械齒輪火花鏗鏘的細節令人看了驚懼吒舌、雖然往往跟著被捲破爛的大樓水泥玻璃混作一團但有時真是越混越爽快
  XD 而今《萬獸崛起》導演並不繼續玩這套：金剛們不論巨獸系還是車輛系，變形就是快速變形不會再去秀機械的聲光細節，雖然那鏗鏘有力的機械美術打了一大折，但對戰陣場合與劇情狀況的理解容易多了。


  其次，關於麥可貝很愛的「美軍」，以前變形金剛系列好像一定要有一堆美軍出來秀他們最新軍武的肌肉！一定有喬許杜哈莫演美軍硬漢帶美軍弟兄縱以卵擊石也要努力一回！然後變形金剛當然會狠狠砸爛美國城市搞得天崩地裂、然後在人們逃竄與幾位配角的伸手互助中看見「人類的希望」作為柯博文片末演講題材
  XD 就這點來說《萬獸崛起》去的秘魯庫斯科雖然是高山古城但也是幾十萬人的大城！只是本片並沒要讓金剛們與人類正面相遇、當然也沒有秘魯軍武或南美游擊隊來威武不屈秀秀肌肉的空間
  XD 可以說除了人類雙主角來參一咖外這整戰都在金剛們自己之間。




  倒是「變形金剛與人們」這個議題，本片雖然在整個角色格局上看似整個跳過了，但也許正有意地從頭談起：回想前片《大黃蜂》談 Bumblebee掉落在 1987 年冷戰時期美國農家邂逅美國少女、這次《萬獸崛起》則談「幻影」Mirage與一個布魯克林拉美裔退役通訊小兵的相遇故事...
  看來兩部新片都是過去五片的「前傳」故事、兩位小金剛要先練習「與人類交流」才能激勵老大柯博文未來「與人類合作」！於是在前傳中終於正式登場的柯博文在此不可避免地有點血氣方剛：他只想著要帶博派金剛們回家、他不信任任何其他人、尤其人類歷年自相殘殺勾心鬥角絕不可信任！


  本片關鍵寶物「時空之鑰」可開啟「時空之門」，既能帶來「毀滅金剛」巨怪主人 Unicron吞噬地球、亦能讓柯博文帶「博派金剛」們回到家鄉薩博坦，對人類主角 Noah
  & Elena 來說是個異世魔器為了地球長治久安必須要摧毀、對這集新的動物型角色「強力金剛」們來說則宛如神器般不可毀滅而須高規格守護... 可說儘管正邪對立格局是三打一、但三群正派主角各懷異心就是一般散沙！唯有居中苦口婆心串聯三方的神鷹
  Airazor壯烈犧牲能喚醒大家團結。看來這集就要讓剛來地球還很自我中心的柯博文學習未來與人類合作，只是「合作」這事在人類社會有何典範可參考？




  這典範，大概就是「前哥倫布時代」的秘魯印加帝國原住民吧？看一隻巨大猩猩也能與南美遺民真誠交心世代守約，儼然暗示未來歐洲殖民者們席捲全球的「後哥倫布時代」已人心不古失去了對天外未知的虔敬之心。本片這次選擇秘魯拍攝遍訪印加帝國世界遺產、金剛們集結在「馬丘比丘」一個電眼穿越群山直視「庫斯科」、考古學家與南美愛好者一眼就知「聖多明哥修道院」Convento
  de Santo Domingo 強勢掩蓋的「太陽神殿」Coricancha地下遺址！總之本片如系列多片煞有其事再次選了古文明遺址聲稱「金剛們早已到來」，這回應是要映襯當代社會的人心不古。


  看看 1994 年當代社會人們過著什麼生活？女主角 Elena是真材實料考古實習生、結果都在為毫無專業專搞公關的考古上司當百科全書還被搶功勞，男主角 Noah
  則雖有才能卻已胸無大志隨波逐流有什麼錢他都願意賺、只因自己弟弟患了罕病而這醫療與社會體制也沒能接住他們... 渺小人們生活在這樣隨人顧命的功利社會很快就將喪失理想隨波逐流！兩位人類主角儘管從
  Mirage 開始與變形金剛們相識一回，但仍然心懷部落心態一切為己，還要這趟安地斯之旅「禮失求諸野」見識一種前哥倫布時期的天人合一。這些人類與變形金剛的早期磨合將在未來
  Sam身上開花結果嗎？




  一想到 Sam我不禁回想西亞李畢福焦慮碎念的神經質演技、還有麥可貝儘管動作爆破與聲光特效做再精彩都無日或忘的白爛搞笑插科打諢 XD 想到這裡就覺得如今《大黃蜂》與《萬獸崛起》年輕新導說起故事相較之下還真是清流！當然金剛們個性鮮明形象獨特變形俐落戰鬥清楚，這樣讓給孩子們看不但眼耳舒服故事也更入口即化，雖然有些折磨眼耳的老貝風格機械質感也是令人懷念的重口味饗宴...
  話說前陣子有版友問到近期商業爽片哪部最推薦？相較於那些有認真劇情甚至深刻成長或道德辯論的嚴肅商業片，我猜也許《變形金剛：萬獸崛起》故事簡單更能放鬆享受呢？



  --

  喔對，孩子回家說想看變形金剛一，我倒還沒想起梅根福克斯有多兒童不宜，光是想起西亞李畢福就不太想找出來複習 XD'
