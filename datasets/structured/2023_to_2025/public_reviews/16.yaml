content: "#上映戲院列表來了\n\n\n\n 「有趣，窒息到令人感覺麻痺！」\n\n驚悚懸疑鉅獻《嚇午4點》\n\n11月14日(五) 全台上映\n\n\
  \  \n\n完美的日常生活\n\n直到…噩夢找上門\n\n\n第42屆比利時布魯塞爾國際奇幻影展 正式入選\n\n第28屆加拿大奇幻電影節 正式入選\n\n\
  第28屆義大利卡普里好萊塢國際電影節 正式入選\n\n第26屆荷蘭海邊電影節 正式入選\n\n《惡鄰布局》製作團隊精心打造！\n\n《與神同行》吳達洙ｘ《未知的首爾》張榮男ｘ《來自地獄的法官》金弘波\
  \ 精彩共演！\n\n正仁（吳達洙 飾）和妻子賢淑（張榮男 飾）夢想過著安穩的田園生活，但每天下午4點\n，住在新家對面的鄰居昱南（金弘波 飾）都會到家裡拜訪他們夫妻倆，但昱南始終沉默\n\
  不語，這讓夫妻倆感到毛骨悚然……\n\n--"
