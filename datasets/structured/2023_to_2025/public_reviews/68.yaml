title: '[選片] 國寶風暴 or 闇黑電話 or 乖狗狗'
content: '這幾部的時段很差


  想趁這週末選一部來看


  狗狗長度太短想下檔再看


  但評價不錯且恐怖片還是想在戲院看


  闇黑看過第一集覺得不錯所以想看第二集


  國寶則是想看柳海真




  先看哪部好？







  --'
