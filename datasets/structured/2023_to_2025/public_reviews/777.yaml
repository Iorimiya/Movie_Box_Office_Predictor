url: https://www.ptt.cc/bbs/movie/M.1727616633.A.C00.html
title: '[好雷] 千萬別放手 是恐怖片而且蠻黑暗'
content: '標題是回應有人說這不是恐怖片的


  這部百分之百就是恐怖片  而且邪惡


  包含弒親  小孩殺人 這些重口味東西 （只是沒特別血腥）


  前半段是真的蠻爛不否認 但後半出乎意料出色


  所以綜合起來我不會說亞歷山大阿甲失手  但就是前後落差


  高機率跟荷莉貝瑞也參與製片有關係我猜 大概就是有些地方有妥協

  -----

  Sent from JPTT on my iPhone


  --'
