title: '[好無雷]萬惡世代'
content: "第一次看立陶宛的電影，主因是對臉書上的劇情簡介很有興趣跟IMDB上的7.9分評分，對這國家薄弱的印象只有地理課背誦過的波羅的海三小國-愛沙尼亞、拉脫維亞和立陶宛，然後大概知道因為地緣因素這三國與俄羅斯或是蘇聯有著錯綜複雜的關係。\n\
  電影以現在跟過去雙線交錯敘述，現在線以即將退休的警察局長金塔斯在生日會準備宣布參選市長開始，此時檢察官卻突然身亡，看似自殺的案件卻在調查後演變為連續殺人事件，而這一切的根源來自於1900年立陶宛獨立運動時，蘇聯KGB在當地的機構發生的5位間諜名冊外流事件。\n\
  這部電影有點類似《火線追緝令》(Se7en)的形式，每具屍體的殘忍死法都有各自的含義，屬於推理作品中的比擬殺人，好萊塢好像已經有段時間沒有拍這類型的獵奇驚悚電影了。我覺得這是部很精彩的懸疑驚悚片，不僅劇情充滿張力，在查案過程也是很多轉折，用一些暗示的鏡頭讓觀眾對主角身邊的人產生懷疑，最後再以想不到的方式揭露真相。但要注意這部被列為18禁除了有歐洲電影常見的裸露片段外，對於驗屍間屍體的場景也是毫不避諱，臟器跟斷面都挺寫實的。\n\
  片商原創娛樂還滿常代理一些比較少在台灣看到的外國好電影，去年過年看的芬蘭電影《反恐行動：獨立日》(Omerta 6/12)也滿精彩的，可惜這次《萬惡世代》的場次真的很少，南部只有一天一場，如果要看真的要把握時間。\n\
  --\n\nSent from \n\n--"
