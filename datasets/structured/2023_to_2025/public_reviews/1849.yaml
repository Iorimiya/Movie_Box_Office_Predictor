title: '[討論] 萬惡世代(2021)其中一個角色'
content: '防雷



















  以下有雷











  瞎眼老太婆跟劇中角色是什麼關係啊？


  檢察官為什麼特別是去找老太婆要毒蛇？


  唯獨這邊看不懂@@


  印象中神父被幹掉的時候老太婆站在教堂門口


  後來局長也去找了老太婆


  感覺老太婆也曾經是KGB一員？




  版上好少這部片的討論


  個人覺得滿好看的欸


  除了某些地方配樂插得有點突兀


  應該有值8-9分/10分


