content: '新聞網址：


  ！ 《但願人長久》奪香港影帝




  圖文／CTWANT


  香港電影評論學會今（15）日公布

  而影后方面

  余香凝以《白日之下》封后。


  香港電影評論學會於2024年1月14日選出第三十屆「香港電影評論學會大獎」的五個獎項

  及八部推薦電影。今屆經歷了十小時激烈討論及三輪投票，最終公布得獎名單，吳慷仁以

  香港電影《但願人長久》奪下影帝，

  這次更





  影后部分余香凝則以《白日之下》封后，先前她在金馬獎輸給《小曉》的林品彤。余香凝

  在《白日之下》中，劇情議題也讓人關

  心。


  「香港電影評論學會大獎」得獎名單如下：


  最佳電影：《命案》


  最佳導演：李子俊（《第八個嫌疑人》）


  最佳編劇：祝紫嫣（《但願人長久》）




  最佳女演員：余香凝（《白日之下》）


  推薦電影八部：


  《第八個嫌疑人》


  《年少日記》


  《尚未完場》


  《但願人長久》


  《白日之下》


  《詩》


  《金手指》


  《填詞L》




  -----

  Sent from  on my iPhone


  --'
