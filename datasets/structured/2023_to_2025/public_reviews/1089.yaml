url: https://www.ptt.cc/bbs/movie/M.1726300568.A.C71.html
title: 'Re: [好雷]《但願人長久》父女之間的變與不變'
content: '剛看完，超好看超感人

  我實在很不喜歡吳康仁

  從他第一部片當愛來的時候就不喜歡

  但堅持拍了那麼久總會有佳作出現

  這片就是很棒的佳作，看來女人都愛他

  這片是就是女導演自編自導自演的作品


  會讓我看下去的原因是配樂很棒

  還有看到監製是香港大導演關錦鵬

  有他掛監製應該誰來導都好看

  沒想到最後一段導演還自己下來演

  演的比專業的演員更好，應該就是演她自己

  我覺得整片演得最好的就是這位祝導演了

  絲絲入扣扣人心懸


  沒看過的可以找來看一下，真的很感人

  看得我痛哭流涕，關錦鵬不愧是大導演


  PS:

  看到一半裡面還突然跑出巫建和

  嚇我一大跳，台灣兩大男星都去香港深造了

  這片真的比富都青年好看太多太多了

  以後吳康仁可以多跟關導祝導多合作

  才能拍出更多更感人的得獎作品


  這片的電影配樂真的超棒




  --'
