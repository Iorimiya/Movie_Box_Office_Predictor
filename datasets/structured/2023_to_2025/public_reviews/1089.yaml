url: https://www.ptt.cc/bbs/movie/M.1726450381.A.F57.html
title: '[請益] 但願人長久劇情問題'
content: '因為是問劇情


  所以肯定有雷


  先說一下感想防雷


  這部剛從Hamivideo看完


  雖然討論度不高 但卻是小弟這幾年看得最有感覺的香港電影


  主要是配樂非常搭配劇情氛圍


  演員尤其是吳慷仁 演得非常好


  完全把一個沒有盡到父親責任 卻無法真的討厭的角色演活


  台詞也沒有過多生硬狗血的部分


  最後有幾點疑問 想請教有觀賞過此片的前輩


  1.林覺民最後怎麼突然死了?


  他的最後一幕是從枕頭裡拿東西 按照前面女兒曾從他枕頭中搜出毒品


  個人腦補是他又吃毒掛了 但疑問的是他當下看來沒有毒癮


  而且準備回老家 又剛跟女兒修補了關係 為何會在那時吃毒?


  2.妹妹是犯了什麼罪?


  劇情暗示妹妹準備要出庭 就她問父親第一次坐牢是幾歲 暗示甚至有可能坐牢


  個人感覺可能是暗示以妹妹的單純的個性 被捲入某些政治抗議活動?


  請前輩賜教


  --'
