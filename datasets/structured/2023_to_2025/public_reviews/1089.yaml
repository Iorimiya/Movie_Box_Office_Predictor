content: '嗯


  不用被但願人長久，fly me to the moon騙了

  不是浪漫，也沒熱血立志，更不是法蘭克辛納屈


  這是一個父親對女兒影響有多大的故事

  拍的感覺讓人覺得導演大概在拍自己的故事吧？


  很平很淡...然後硬要加了惆悵，劇情不狗血，但是又莫名矯情...


  故事發生在97年香港，從中國偷渡來香港的林覺民(吳慷仁)是一個進出監獄的吸毒慣犯跨度

  20年，害得兩個女兒被其影響


  一個一輩子只能找炮友，怕男人都像他老爸一樣


  一個一輩子因為自卑犯了罪，葬送大好前程(在香港讀到大學)


  然後覺民老了，真的與妻訣別，又吸毒死了


  大女兒回去中國安葬老爸


  結束，真的沒了


  真的真的就這樣


  很好睡


  馬的大爛片




  哈哈哈哈哈哈哈哈




