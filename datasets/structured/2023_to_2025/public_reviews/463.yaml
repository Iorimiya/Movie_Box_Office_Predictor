title: '[負雷] 大力水手：血腥菠菜'
content: '#無雷心得



  出自卡通人物，將其塑造成一隻怪物，並加入一些科幻和搞笑元素的B級恐怖喜劇。只是

  很可惜一個簡單的故事架構，在劇情編排上還有很多的修繕空間，整部片大概就著重在每

  個角色各種無意義的話癆以及很低俗的撩妹戲碼，而且最重要的大力水手之謎與女主角間

  的情感鋪陳也非常隨意的帶過，幾乎無法讓觀眾產生共感。



  而對比前半能夠隱形、瞬移又或是目標身上像被裝了追蹤器一樣，無論怎麼逃終究慘死於

  擁有惡魔般超能力值的大力水手中，到後半則在被男女主角光環大肆照射下的大幅弱化也

  顯些荒謬！



  除了敘事差、劇情平淡無趣、角色無厘頭的行徑，連眾所期待的虐殺橋段也蠻令人失望的

  ，每個爆頭、斷臂或撕頭皮的分解畫面都呈現的非常簡陋，而且也很容易預料且無趣的死

  法，雖然裡頭堅持不使用CGI，但還是有種很怕被人看出破綻的感覺，發了這麼多便當居

  然連要給觀眾一顆視覺衝擊的特寫鏡頭都沒有，甚至整部片大多時候也呈現烏漆嘛黑的畫

  面。



  原本想說片長只有87分鐘，劇情應該有濃縮修飾到不至於太差，不過很遺憾依舊是歹戲拖

  棚，看完甚至還會嫌它太長，而且恐怖和血腥暴力程度也不足，真心不推！









  --

  有恐怖片會加減看XD

  我習慣電影院

  雷是居多 但他們家進的電影量也很多'
