url: https://www.ptt.cc/bbs/movie/M.1742658745.A.3EC.html
title: '[瞎雷] 大力水手:血腥菠菜 童年崩壞'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  大力水手:血腥菠菜是一部很有自知之明的瞎片，從頭瞎到尾，毫無腦袋毫無邏輯

  講述大力水手在一個廢棄的房子殺人，一群學生想過去調查真相，然後其中一個

  學生叫做奧莉薇這樣


  說是砍殺片但感覺演員的表情不到位，沒有被嚇到的樣子，音效也做得不太好，肢體

  被砍下來或爆頭都沒有很清脆的聲音，真的是要搞砍殺片嗎?


  劇情倒是無腦的很徹底，結果奧莉薇竟然是大力水手的女兒，大力水手是吃了太多受

  到汙染的菠菜所以才會那麼暴力，恐怕連科幻小說家都不敢採用這麼誇張的設定


  總之大力水手:血腥菠菜不適合去大銀幕看，在家看就夠了


  --

  美國限定戲院上映'
