title: '[好雷] 亡者所往：《幸福的所在》'
content: "內文有雷且具個人觀點，推薦觀影後再讀。\n\n　　　　本片場次有限，有意請把握。\n\n\n\n　　　　網頁完整版：\n\n　　　　\n\n\n\
  　　　　預告片：\n\n　　　　\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\n\
  亡者所往：《幸福的所在》\n\n\n\n　　奧斯卡最佳國際影片克羅埃西亞代表《幸福的所在（Safe Place）》改\n\n編自導演尤拉伊勒羅蒂奇的真實經歷，以極簡的敘事反覆呈現「過不去」的\n\
  \n徒勞：一扇又一扇的門，一道又一道的牆，一項又一項的規定，和被疾病隔\n\n開的意識與心靈。布魯諾穿過重重阻隔試圖救回試圖自殺的弟弟達米爾，之\n\n後要離開醫院解釋破門的理由；理應成為溝通橋梁的精神科醫生，理應協助\n\
  \n救人的警察，都增加布魯諾和母親與達米爾之間難以越過的障礙。無法平復\n\n的焦慮，推不倒的框與牆，都讓說著「對不起，我放棄了」的達米爾在徬徨\n\n罪疚當中，投往認知裡的安全之地（Safe\
  \ Place）。\n\n\n\n　　電影開頭遠景看著布魯諾撞門衝上樓梯的腳步聲，撞開門猶如撕裂的黑\n\n暗，就宣示了要救一個人，首先要能抵達。然而布魯諾對著病床上的弟弟討\n\
  \n論著葬禮與拍這部電影的理由，傾訴著事發後的感受，「你知道我會說什麼」\n\n所以只能傾聽；以及為了找回離家的弟弟在眾多樓層間穿梭，都呈顯兩人之\n\n間難以拉近的距離──以為是煙，要如何能不引火把實則焚身的他拉出來？\n\
  \n更刺心的是布魯諾與母親極力想要冷靜，仍是不停地撥電話，不停地變換形\n\n式問「為什麼」和尋求保證──身心病患無法自制的行動，難以符合「正常」\n\n「標準」的「理性」與「選擇」，畢竟心靈已然覆上繁複細密、通著電流的\n\
  \n網，吸附著醫生話裡隱含的指責，和親人關懷裡的苦惱（誰又知道警察把他\n\n從海邊帶回來的路上說了什麼？），一一吞噬，反覆咀嚼；倘若試著伸手，\n\n必得電傷皮肉，再次循環的痛除了轉向身體，又要如何找到出口？連傷害了\n\
  \n自己，都還想到把血擦掉；明明該求助，還得說出心理師想聽的話好證明\n\n「進步」，面對這一切只能回答「還好」、「她人很好」；終於有人徵詢他\n\n的意見，卻已經過度負荷，痛到退縮在自己的世界裡無法意識──醫者的傲\n\
  \n慢和警方的顢頇，更加深了病患與照護者之間無法相會扶持擁抱的無能為力。\n\n最後那一張屢次被拿出來的照片背景，達米爾遲來的笑容後方，那些小孩接\n\n二連三地張開雙手，躍下牆後的海洋──那不僅是預示，彼方與鏡頭之間更\n\
  \n是現實與影像、與幻想的距離，一如《日麗》的回顧，只是《日麗》是選擇\n\n在記憶裡接近、共舞與擁抱，《幸福的所在》則是自編自導自演的男主角藉\n\n由電影取暖與祈願，極力接近了亡者所往，那無法到臨的遠方。\n\
  \n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\n                \
  \                  陳斐雯  貓蚤札（其三）\n\n--"
