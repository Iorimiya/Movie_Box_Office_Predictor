title: '[微好雷] 絕地戰警：生死與共'
content: '沒想到這系列還有續集…

  （下面有微雷）

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  劇情延續第3集角色…對 我就是說那狗血劇情的兒子

  可能威爾跟馬丁兩位上了年紀

  裡面不少動作戲都是…對 就是他兒子…這部就是為了幫他洗白，雖然他台詞不多 但片段卻

  到頭來兩位主角變成嘴砲擔當

  有幾個場面拍的不錯，像直升機那段

  後面爆破跟槍戰也不差

  最後字幕還是有跑出麥可貝名字（感謝2樓告知是片裡的駕駛演員）

  .

  至於這次劇情是略帶懸疑

  因為我們之中有內鬼！

  然後鏡頭不時就帶到一些配角

  但最後揭曉答案…只能說…導演你他媽之前是用什麼鬼運境，但後來想想也許還有伏筆…

  因為最後結局就像要拍第五集…天啊 居然還想繼續拍！

  .

  但整部片不會難看啦

  聲光效果不錯

  串場角色也有趣，像海陸殺人魔女婿跟…面癱哥（就一幕XD）

  還有威爾被狂打巴掌XDD

  至少比3好看多了

  而且好萊塢這類型警探片越來越少

  有對到口味還是值得一看

  -----

  Sent from JPTT on my iPhone


  --

