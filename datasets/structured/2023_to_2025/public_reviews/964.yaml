url: https://www.ptt.cc/bbs/movie/M.1758194093.A.2CF.html
title: '[  普雷] 絕地戰警 生死與共 情懷搞笑'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  其實這部片不能單純當作軍警片來看，比較像是情懷片＋搞笑片的混合體。不過有一半左

  右的笑點真的不好笑，甚至有點尷尬，完全不及上一集自然好笑的程度。


  整體看下來，最大的感受是——兩個年輕 BOY 已經成了老 MAN，多少有點另類的感動。

  動作場面雖然不如以往流暢，反而帶點滑稽。但最讓人困惑的是：為什麼一定要讓馬克思

  一直狂嗑甜食？連在槍戰當中都要喝糖漿，真的是滿搞的 XD。反派 BOSS 也偏弱，三槍

  就倒(x，完全沒存在感。


  整片的記憶點大概只有：


  馬克思超愛吃甜的


  麥克有恐慌（但不知道為什麼）


  雷吉一口氣幹掉 15 個敵人超帥


  麥克跟兒子的親子戲卻意外偏弱


  總結來說，只能算是一部中規中矩的搞笑軍警片，應該也差不多算是系列收尾了吧。雖然

  有點差強人意，但還是要給兩位中年 MAN 努力演出的誠意鼓勵一下。當初我看完最大的

  感想，就像馬克思堅持自己不會被車流撞上一樣——硬撐 XD。


  要看系列的話，還是比較推薦 2020 年的《絕地戰警》或更早期的經典。


  --'
