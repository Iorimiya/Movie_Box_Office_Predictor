title: '[好無雷] 絕地戰警四 BadBoys4 生死與共 Ride or Die'
content: '有幸參與 絕地戰警  BadBoys4 Ride or Die

  搶先全球 IMAX 特映會。

  （看完、發完限動才發現，威爾史密斯他們才正駕著名車準備入場美國的特映會 哈哈）


  影片細膩豐富、高潮迭起、笑料不斷，誠意滿滿。

  喜歡導演 阿迪爾·艾爾·阿比 與 畢拉爾·法拉 細膩的鋪陳與運鏡，

  （一、二集導演導演 麥可·貝，也有在片中客串客串出鏡。）

  讓原本只是想看兩位大佬嘴砲足矣的我，大感驚喜，推薦給大家。



  這次在美麗華IMAX參與特映，主辦單位很有心，

  帶來電影中的 Porsche，



  並特別邀請刑事局除暴特勤隊到場，CS Counter-Strike玩了這麼多年，

  第一次拿到真的反恐盾牌，

  刑警大哥說這是最新型號配LED燈。




  反恐英雄，讚。




  剛看完電影就看到全副武裝的特勤刑警，相當有感。

  同時為刑事局推廣：165反詐騙 Don''t be scammed.

  (去年看企鵝妹徒步台灣學會的英文XD)



