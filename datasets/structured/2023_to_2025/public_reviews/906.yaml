url: https://www.ptt.cc/bbs/movie/M.1717575777.A.F25.html
title: '[情報]7/12哆啦A夢：大雄的地球交響樂全球捷報'
content: '哆啦A夢系列電影最高票房導演今井一曉回歸執導《電影哆啦A夢：大雄的地球交響樂》

  7/12 (五) 國語、日語版全台同步上映!


  (相關資料引述自哆啦A夢中文網)



  ●日本票房冠軍，動員337萬人次，賣座超過42億

  ●《哆啦A夢》第43部長篇劇場版系列作品

  ●原作者 藤子·F·不二雄誕生90周年紀念作品

  ●日本新一代「國民女演員」芳根京子獻聲演出

  ●《藥師少女的獨語》實力派聲優悠木碧再度參演

  ●人氣動畫歌手天月特別獻聲演出

  ●創作鬼才Vaundy獻唱主題曲

  〈Time Paradox〉


  (以下是官方日語配音中文字幕預告影片，本應該要先發前導，再發完整預告，慢慢導引觀

  眾，但怕占版面，通通整理在這篇)

  【前導預告】

  1.如果有一天，音樂從地球上消失……？


  2.身為音癡的大雄，能夠完成拯救地球的演奏嗎？


  【正式預告】



  《電影哆啦A夢：大雄的地球交響樂》世界上映情況+目前捷報

  1.日本：3/1(五)危險上映，在排球少年劇場版和真人電影奇怪的家夾殺中，仍保有上半年

  度票房第五名的位置，目前票房近逼43億。

  2.越南：5/24(五)強勢上映，未演先轟動，造成日本NHK新聞也轉播宣傳，正式上映以來，

  已連續兩周票房冠軍(如包含試映會則為三周冠軍)，不僅大勝輾壓同期的排球少年和加菲貓

  等兒少動畫電影，更超越 《名偵探柯南：黑鐵的魚影》960億越南盾紀錄，成為越南影史最

  賣座的日本動畫電影！

  3.中國(不含港澳)：5/31(五)兒童節前上映，首周票房擠下加菲貓，以8959萬人民幣奪冠，

  破億在即，有望打破去年《電影哆啦A夢：大雄與天空的理想鄉》紀錄。

  4.紐西蘭、澳洲：7/11(四)搶先台灣上映，電影將以日語配音、英文字幕方式上映，是《哆

  啦A夢》系列電影首度在澳洲與紐西蘭躍上大螢幕上映。

  5.台灣：7/12(五)上映，系列活動不明朗，期許發行商務必要舉辦人偶活動，以及相關宣傳

  (像是捷運、輕軌等彩繪列車)，同時搭配異業合作，來吸引可愛小朋友~懷舊大人族群進電

  影院看電影，並且杜絕盜版，也希望透過打破紀錄、創下佳績來爭取更多活動舉辦，否則都

  只能乾瞪眼看著其他國家有一堆活動，連越南和中國都比不上了。

  6.南韓：7月上映(日期未公布)。

  7.香港：8/1(四)上映，搭配「100%多啦A夢&FRIENDS」巡迴特展的加持下

  （已羨慕到想在台灣看完首日電影後怒衝香港），相信此次電影將會在港澳造成轟動。


  更多詳細資訊，可到哆啦A夢中文網查看



  最後，純粹喜歡哆啦A夢的我想用幾句話來推薦大家都能進電影院觀看這部「音色」大冒險作品

  〝近日以來，社會紛爭、衝突不斷，也可能有些許的不平靜，在煩躁的氣氛中瀰漫著許多的

  惴惴不安，就讓我們一同進電影院來看看哆啦A夢等五人組如何運用各自的專長，來拯救地

  球、幫助台灣，用最溫柔的地球交響樂來撫平大家心中的脆弱吧！〞


  --'
