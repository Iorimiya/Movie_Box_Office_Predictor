url: https://www.ptt.cc/bbs/movie/M.1720598925.A.4C6.html
title: '[分享] 電影哆啦A夢：大雄的地球交響樂周邊分享'
content: '哆啦A夢電影在台灣快上映了，之前因為有特別安排在日本上映時去玩和看電影，不過因為

  聽不懂日文也沒字幕，心得就等進電影院看完再分享了。由於日本上映時，電影周邊和活動

  實在太多，全部寫完大家也不會看，所以只分享兩個重要的就好。


  首先，哆啦A夢在電影裡，為了避免光溜溜被檢舉(誤~重來～

  是為了增加討論度，每年官方推出的電影造型公仔絕對是超級搶手，不到半個月就斷貨。趁

  著參訪藤子‧F‧不二雄博物館時，在紀念品店就買了，和以往相比有漲價，但還是敵不過

  大家的手速。結帳時因為拿了兩隻，有被店員關心詢問一下。還順便買了新‧大雄的恐龍博

  物館限定款。(進店要特別注意守住錢包呀)



  再來就是離開日本前一晚才想到的造型爆米花桶，以往日本沒像威秀影城一樣有造型爆米花

  桶和飲料杯，這次HUMAX影城剛好有，就一起買回來了。


  (燕尾服+音樂家假髮的指揮家造型爆米花桶)


  很多人在問威秀這次有沒有電影造型周邊，就一併分享，有興趣的可以去威秀關注。




  最後，還是要不免俗說一下。日本三大動畫電影中，柯南已取得優異開票；接續則是在日本

  票房近43億（同期的藍色監獄17億），連海外的越南和中國都賣得嚇嚇叫的哆啦A夢要強勢

  登台了。近年來的題材已經不再是單純子供向(兒童)電影，內容和製作方向摻雜了許多的創

  新嘗試，以及社會議題的討論，都可以提供給無上限年齡的大小孩觀看，尤其今年恰逢藤子

  ‧F‧不二雄90周年冥誕，意義更重大。

  大家，走吧！一起進電影院觀看，透過地球交響樂來拯救地球，讓台灣擺脫近日的紛擾，同

  時也集結大眾及粉絲的力量，用票房數據讓日方看到台灣非常渴望目前在香港的哆啦A夢無

  人機燈光秀，看看能不能儘早在台灣舉辦，不要只獨厚香港而遺忘台灣，不然活動好少喔！



  --'
