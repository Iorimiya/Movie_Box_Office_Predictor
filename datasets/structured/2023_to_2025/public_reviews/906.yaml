title: '[好雷]哆啦a夢 大雄的地球交響樂 '
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n部落格有少少的圖\n\
  \n\n\n 繼去年的大雄與天空的理想鄉\n\n今年的大雄的地球交響樂表現得也不錯\n\n\n 如果世界上，再也沒有音樂，會發生什麼事情呢？\n\n 2024年的Doraemon劇場版\"\
  大雄的地球交響曲\"\n\n描寫著大雄因為笛子吹得很爛\n\n(「Do Re Mi Fa Sol Ra Si… No?」)\n\n便使用了\"事前日記\"，想規避掉音樂課的練習\n\
  \n他在\"事前日記\"上寫了\"沒有音樂\"\n\n結果，地球上的音樂完全無法撥放\n\n這短短的時間內...卻造成了恐怖的影響...\n\n(觀眾會以為是沒音樂的影響....\
  \  但實際上...  這可是會影響地球存亡的舉動阿！)\n\n\n此時出現的神祕少女Mikka\n\n\n喜愛大雄的笛音\n\n更認為他們五個人，正是能喚醒\"\
  泛籟殿堂\"的關鍵\n\n用音樂拯救地球，就是這次他們的任務！\n\n\n\n ****************\n\n這是一部很適合進電影院看的片\n\n因為音樂的表現，透過強烈的環繞音響撥放\n\
  \n更能打動觀眾的心\n\n不過片長長達兩個小時，如果對Doraemon的節奏比較不適應\n\n可能會不小心在中間較為平淡的片段恍神...\n\n(我前面的人看到打呼....)\n\
  \n\n\n大雄的直笛雖然吹得很差\n\n可是他從一開始的逃避練習\n\n到後來，希望跟大家一起演奏，慢慢的加強技巧\n\n跟大家一起彈奏，救回Doraemon那一段真的讓我爆淚\n\
  \n而這次道具的使用也很有巧思\n\n不得不說，導演今井一曉\n\n導的三部\"大雄的金銀島\" \"大雄的新恐龍\" \"大雄的地球交響樂\"\n\n都非常棒，畫面與劇情的張力很強阿\n\
  \n配上壯闊的音樂\n\n有那種悟空請地球上的人們舉起手分元氣的熱血感\n\n\n\n最近的原創，都表現得不錯\n\n反而比上次復刻的2021年的大雄新宇宙小戰爭好\n\
  \n(雖然我看了之後，很想吐槽那個四萬年的笛子....  竟然可以留存這麼久，實在太誇張\n了)\n\n該有的道具功能伏筆，都有好好的利用，實在是很棒的故事\n\
  \n我非常喜歡這部電影，推薦給大家\n\n (配樂是服部隆之大師製作的~~真的很好聽感人!!)\n\n\n--\n親子桌遊心得與介紹! \n\n--"
