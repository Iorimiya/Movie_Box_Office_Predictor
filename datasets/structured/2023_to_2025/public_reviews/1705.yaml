title: '[好雷] 月之圓缺'
content: '這片是我最愛的松竹電影公司出品


  大泉洋

  有村架純

  柴崎幸

  目黑蓮


  值木賞文選獎拍成電影


  雷


  演爸爸的大泉洋

  大學娶到演媽媽的柴崎幸

  兩人生了個女兒叫琉璃

  爸爸在建設公司工作養家

  一天母女突然車禍身亡

  爸爸崩潰後離職回鄉下賣魚


  鏡頭轉到80年代的東京

  一個有夫之婦琉璃在街頭搭訕帥哥

  兩人一拍即合就回家發生一夜情

  在帥哥租的宿舍裡，帶女人回家


  但有夫之婦很神祕

  讓帥哥不知道她的背景

  上完床就馬上快閃也沒有聯繫方式

  也不知道她是已婚婦女


  鏡頭又轉到有夫之婦結婚前

  在一家高級精品菸具店當專櫃小姐

  後來被爸爸的老闆，建築公司的少東求婚

  馬上麻雀變鳳凰嫁入豪門


  但嫁入豪門幾年後發現不能生育

  家裡就出現低氣壓跟家暴

  企業家不能離婚但家也沒了愛

  所以就在街上找帥哥發洩情慾

  但在兩難之際，因為家暴要逃家

  被老公追趕結果發生意外被火車撞死


  這就是第一代的琉璃

  第二代琉璃則是開頭車禍身亡的母女

  女兒7歲大病一場，從此就被第一代琉璃上身

  就像借屍還魂一樣，開始會去找以前那位帥哥

  希望長大後就能再跟帥哥名正言順的再一起


  好不容易高中快畢業可以談戀愛時

  爸爸帶女兒去建設公司遇到他老闆

  老闆一聽二代琉璃一唱歌就認出自己老婆

  馬上糾纏到學校去說她就是他老婆琉璃

  當然一開始否認，但最後劉宜還是露餡

  說家暴男一點都沒變，讓她老公更確定是她


  結果二代琉璃上了媽媽的車逃走

  說有高中生癡漢變態窮追不捨

  家暴男老闆就開車賓利苦苦追趕

  結果就發生了母女雙亡的車禍悲劇

  苦命的輪迴，都是被同一個

  恐怖情人追到車禍身亡


  感覺完全第一代琉璃的女鬼纏上帝二代琉璃

  才讓第二代也出車禍悲劇收場

  相同的命運為情而死

  竟然還有第三代的琉璃

  又跑去找第二代琉璃死黨同學的女兒

  也是7歲後生場大病後

  就琉璃靈童活佛轉世鬼上身了


  以靈幻先生茅山術的說法

  人鬼殊徒，女鬼為情糾纏三世

  連累人家母女意外車禍身亡


  我看第三代應該也是被老闆追到被車撞死

  主要是富二代應該會一直糾纏下去

  那正好可以再拍第二集了


  這齣戲在去年電影學院獎入圍11項

  結果全部共姑，因為碰到了那個男人

  對手太強所以完全沒機會得獎

  主要還是導演跟男主角不太好

  導演是解憂雜貨店的導演

  一聽就涼了半截，難怪不會得獎

  男主角更是不適合當男主角

  可能是他自己找到錢當監製拍的片吧?


  像爸爸妻女雙亡時哭的實在是不好

  應該直接兩眼無神的昏倒會比較好

  這也因此沒拿獎敗給帥哥妻夫木聰


  總之這片除了導演跟男主角

  每個角色都很棒，但有村怎麼都演那麼的角色

  這片目前最有人氣的應該就是她

  再來就是演媽媽的柴崎幸

  演小王的小鮮肉目黑也有很多女粉絲

  我想二代琉璃的女兒應該也是新生代偶像吧


  這片有2小時，加減看還行，比那個男人好看一點

  多少有美女有帥哥有80年代的復古風街景跟古董車

  我想這片的1980年代的復古風街景應該花了不少錢


  個人覺得她會三代琉璃都愛著那個帥哥

  是因為他們都只是萍水相逢，沒住在一起

  一結婚住在一起可能帥哥也變恐怖情人鬧翻了

  倒是柴崎幸跟大泉洋的家庭倒是蠻幸福的



  2023第46回日本電影學院獎




  --'
