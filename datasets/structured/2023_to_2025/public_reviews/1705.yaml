  \n-\n\n$90 火線赤子情 : \n\n傑克葛倫霍．麥可潘納．安娜坎卓克主演。爛蕃茄85%，有點紀錄片形式的警匪動作片，\n槍戰真實感很強，私心大推，片尾哭慘。\n\
  \n-\n\n$80 幼女戰記 劇場版 : \n\n延續主劇情拉開新戰線，超人氣動漫首部劇場版。\n\n-\n\n$80 在咖啡冷掉之前 : \n\n有村架純主演，超人氣治癒型小說改編。\n\
  \n-\n\n$80 烈愛灼身 : \n\n【教會】導演.【莎翁情史】金獎編劇，鄔瑪蘇嫚 古裝奇情經典數位修復。\n\n-\n\n$90 輕蔑 : \n\n高達\
