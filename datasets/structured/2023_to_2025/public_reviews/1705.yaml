url: https://www.ptt.cc/bbs/movie/M.1682301771.A.90A.html
title: '[普雷] 《月之圓缺》'
content: '假日去看了整部卡司很華麗的《月之圓缺》

  進場前看到好幾位女性觀眾在拍廳外目黑蓮新片《我的幸福婚約》的燈箱

  後來發現廳內九成都是女性觀眾，感覺就是粉多粉絲哈！


  先說我喜歡的部分：

  1. 大泉洋哭戲太厲害！超有感染力

  2. 有村架純很美，完全有把極具魅力的女人形象演出來

  3. 柴崎幸雖然戲分偏少，但她的每場戲都很有記憶點跟亮點


  再來說我個人不愛的點：（***有雷***）

  1. 有村架純跟目黑蓮火花不足

  雖然是俊男美女站在一起，但可能礙於電影篇幅的關係

  兩人互動沒到很夠，以至於最後一場雨中重逢的戲沒有很被打動


  2. 投胎轉世的梗用太多次

  覺得從有村的琉璃到大泉洋的女兒琉璃就很剛好

  但又到伊藤莎莉的女兒，好像有點太多

  最後又來個看護女兒的驚喜，其實已經有點疲乏，沒有很震撼或驚訝


  3. 田中圭發現妻子投胎轉世有點沒說服力

  只憑聽到女高中生唱著同樣的歌

  以及錄音機和筆記本的蛛絲馬跡來判斷，覺得有點太牽強


  整體來說有感受到電影濃烈的情感層面，演員也都很棒

  但故事的設定還是覺得有點卡

  （或許原著就是這麼寫？）


  --'
