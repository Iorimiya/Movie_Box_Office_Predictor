title: '[新聞]目黑蓮<月之圓缺>感動爆哭,大泉洋食不下咽'
content: '新聞網址：



  在日本上映三天勇破3.5億日圓票房，並強勢榮獲日本奧斯卡11項優秀大獎肯定的直木賞

  小說改編電影《月之圓缺》，即將在4月21日於台灣浪漫獻映。本片完美復刻1980年代場

  景，打造出情感交織的跨時空刻骨銘心愛戀，虐心程度甚至讓參與演出的傑尼斯夯團「

  Snow Man」成員目黑蓮，從初讀劇本到拍片現場都數度淚崩，甚至還跟同團成員Raul在試

  映會上一起爆哭。此外，拍攝本片同樣大喊痛苦的，還有飾演男主角「小山內堅」的演技

  派男星大泉洋，為了呈現失去妻小的淒慘模樣，還自主減重，甚至憔悴到連工作人員都驚

  呼：「大泉先生，你老了！」雖然製作過程十分艱苦，但兩人在後續的宣傳期間，可說是

  爆笑不間斷，不僅大泉洋以吐槽目黑蓮為樂，兩人甚至展現高度默契自組搞笑團體，讓大

  泉洋笑嘆：「一想到結束後，就再也見不到目黑蓮，很難過啊！我還想把他培育成綜藝人

  才呢！」





  被《月之圓缺》製作人一眼相中，進而飾演「三角哲彥」的目黑蓮，坦言從初讀劇本時就

  已經熱淚盈眶：「因為我所珍視的價值觀，就在這個故事當中，所以很能產生共鳴，也為

  了有角色會突然消失這點而哭泣，因為我覺得這是很有可能發生的事情。一邊想著如果能

  珍惜和他人相處的時間該有多好，一邊就哭了起來。」等正式開拍後，當遇到沉重的演出

  場面時，他也同樣哭到停不下來。目黑蓮對此透露：「我無法在喊開拍時就馬上哭泣，拍

  攝這種情緒起伏比較大的戲時，我會從前一晚就開始整理情緒，如果拍攝一早沒有保持住

  那種心情，就會切換不過來，所以在去片場的車程裡哭了很久。」他並表示如果碰到太痛

  苦的場面，甚至有時還會默默躲到角落偷哭。等拍攝完畢後的試映會，他與同為「Snow

  Man」成員的人氣男星Raul一同觀賞，更自爆兩人哭超慘：「我真的哭得很厲害，哭到臉

  都腫腫的，即使結束後亮燈也都還在哭，甚至無法馬上起身。不過當觀賞時，聽到隔壁

  Raul傳來哭聲時，我很高興能感受到自己這麼努力的成果。」



  同時，為了拍攝本片大喊痛苦的，還有男主角大泉洋。他在片中所詮釋的「小山內堅」，

  將從美滿家庭到失去妻小，前面越是幸福耀眼，後面就越是紮心悲傷。為了詮釋極致反差

  感，大泉洋不只情緒到位，甚至連外貌都下足功夫：「前半段快樂的場景時，我想要胖一

  些，所以私下也一直在吃東西；但後半段失去妻女的拍攝前，我放了幾天假，將自己減重

  到憔悴的樣子，但其實心情上也沒什麼胃口、吃不太下，是很辛苦的拍攝。」短時間內的

  消瘦，也讓大泉洋連背影都散發出無法抑制的惆悵，加上妝髮的調整，跟先前相比簡直判

  若兩人。對此，大泉洋也一展樂天性格笑說：「通常我被說看起來老了並不會開心，但這

  次工作人員對我說：『大泉先生，你老了！』我反而很高興呢！」





  在《月之圓缺》都有極度重要戲份的大泉洋與目黑蓮，實際上僅有一天的時間會對到戲，

  但兩人卻在後續宣傳活動上感情升溫，展現出高度默契。大泉洋以吐槽目黑蓮為樂，在記

  者會上穿起超高厚底鞋，和身高185公分的目黑蓮比拚，逗得目黑蓮爆笑到說不出話。對

  於如此惡趣味的自己，大泉洋不僅不反省，更喜孜孜表示：「當目黑蓮在我身邊時，我的

  吐槽就永遠不會停止，想一個接一個講下去。從見到他那天起，我便感覺到神清氣爽，能

  有人完全接受我的毒舌言論，還真是新鮮。我覺得我們創造了一個不錯的搞笑團體，希望

  未來還能夠以『小洋＆目目』的身份繼續合作。」



  看似砲火猛烈又不正經的兩人，實際上在訪談時都對彼此讚譽有加。目黑蓮表示自己十分

  尊敬大泉洋：「他人很好，從一早梳化時就很友善地跟我討論各種事情，以試圖緩解我的

  緊張情緒，真的很帥氣，讓我學到很多！」大泉洋也回敬：「他真的很帥，是個偶像，而

  且演技真的很好…。不過這讓我有點失望耶（笑），我是希望他至少在演技方面可以搞砸

  啦，結果他的表現都真的是非常精彩。」他並帶點感傷地笑嘆：「一想到結束後，就再也

  見不到目黑蓮，很難過啊！我還想把他培育成綜藝人才呢！」



  這部由直木賞小說改編，並強勢榮獲日本奧斯卡11項優秀大獎肯定的《月之圓缺》，即將

  在4月21日於台灣浪漫獻映。珍藏電影預售票目前正在博客來售票網熱賣中（

  ），數量有限，售完為止。本

  片劇情描述小山內堅（大泉洋飾演）與愛妻梢（柴崎幸飾演）和女兒琉璃，三人過著平靜

  且幸福的人生，卻因為一場突如其來的交通事故，讓小山內同時失去妻女。多年後，一位

  自稱三角哲彥（目黑蓮飾演）的神秘男子，主動找上仍沉浸在悲痛之中的小山內，並透露

  一位名叫琉璃的女性，曾在意外當天聯絡上素未謀面的他。就在小山內感到震驚的當下，

  三角娓娓道出另一位同名為瑠璃，也是他所愛之人的故事…。這幾位同名為琉璃的女子，

  誰是死去的女兒？誰是死去的妻子？誰又是死去的戀人？她們看似毫無關係、彼此相異，

  卻又如此相似。一段跨越數十年，稍縱即逝卻不被世間允許的愛戀，即將真相大白…。



