  主演，蠻希區考克古典懸疑氛圍的電影。\n\n-\n\n$90 Re:從零開始的異世界生活  Memory Snow : \n\n$90 Re:從零開始的異世界生活\
  \  冰結之絆 : \n\n日本暢銷輕小說改編動畫劇場版。\n\n-\n\n$90 命運:停駐之夜劇場版 : \n\n面對聖杯的宿命之戰，接續Fate Zero劇情，延續FATE宇宙正傳劇場版。\n\
