url: https://www.ptt.cc/bbs/movie/M.1681820098.A.6EE.html
title: '[新聞] 有村架純【月之圓缺】大談不倫戀直乎困難'
content: '新聞網址：



  強勢榮獲日本奧斯卡11項優秀大獎肯定的直木賞小說改編電影《月之圓缺》，即將在本週

  五（4/21）於台灣浪漫獻映。本片為《解憂雜貨店》廣木隆一的全新導演力作，並集結大

  泉洋、有村架純、目黑蓮、柴崎幸等人豪華演出。有村架純更在片中化身氣質人妻，並挑

  戰自己的演出尺度，與目黑蓮飾演的大學生發生禁忌不倫之戀。同樣突破自我的，還有因

  為戲劇《大叔之愛》廣為人知的田中圭。有別於過去的搞笑形象，這回他竟變身成為道貌

  岸然的家暴渣男，黑化模樣就連他本人都看不下去，還親自道歉：「實在是很抱歉，在片

  中做出這麼殘忍的事情。」





  以《花束般的戀愛》勇奪日本奧斯卡影后殊榮的「國民女神」有村架純，繼《閃爍的愛情

  》、《夏美的螢火蟲》之後，第三度與廣木隆一導演合作《月之圓缺》，就在選角階段被

  指定為本片的關鍵人物「琉璃」。片中，她為了躲避充滿言語貶低、肢體暴力的婚姻關係

  ，與還是大學生的「三角哲彥」（目黑蓮飾演）意外相遇，並在多次的巧合偶遇下拉近距

  離，讓即使有人妻身份的她，情不自禁決定跟對方展開這段不被允許的禁忌愛戀。



  面對要演出身處抑鬱環境又情緒複雜的角色形象，有村表示：「我認為這是非常困難的角

  色，閱讀原著時，覺得琉璃是個沒什麼情緒起伏的人物，好像看透一切而感到放棄。所以

  演出時，我覺得最好不要為每一幕賦予太多意義，以免變得太過陰鬱。」尤其她在片中面

  臨兩段感情關係，她也對此表示：「我很喜歡跟三角在一起時的氛圍，可以感受到純粹的

  治癒，同理來說，也讓我知道當我跟丈夫在一起時，面部表情會呈現出什麼樣的對比，這

  是很重要的事情。」尤其她跟目黑蓮在片中有大量對手戲，目黑蓮也對她深表感謝：「她

  在最一開始時，就對我說：『我必須在極短時間內，透過角色跟你建立信任關係，還請多

  多指教！』這讓我印象非常深刻，而且她還引導了我很多，讓我覺得得救了。作為演員，

  我每天都被這些無數的引導給驚豔到。」不論戲裡戲外，兩人都有著深厚交流，花費許多

  心力，將角色之間刻骨銘心的感動之情傳遞給觀眾，值得觀眾進戲院細細品味。





  在《月之圓缺》擁有突破性演出的，除了有村架純，還有因為《大叔之愛》廣為觀眾所知

  的田中圭。他在片中飾演與琉璃（有村架純飾演）結婚的老公，起初帶著愛關注琉璃，卻

  隨著故事推進逐漸黑化，成為句句嘲諷、瘋狂貶低，甚至暴力出手的「家暴渣男」。破格

  演出讓他被觀眾們罵翻：「有夠可怕！」「太過分了！」「請大家小心田中圭！」「這是

  他史上最恐怖的角色！」就連同劇組的大泉洋也表示：「這是我從來都沒看過的田中圭，

  很可怕耶！」不過大泉洋也盛讚他這次的表現實在讓人印象深刻，這也讓田中圭逐漸恢復

  信心。面對這次「負評連連」的角色，田中圭自己都說看了很生氣，甚至還親自道歉：「

  我所飾演的角色很不討喜，總是讓我想著『這臭小子…！』但我還是很高興導演邀我來演

  出。這是我第一次跟有村小姐共事，她真的和想像中一樣出色，我也實在是很抱歉，要在

  片中做出這麼殘忍的事情。」他也向觀眾喊話：「請大家務必去戲院見證這個角色做了什

  麼，並一起為此發脾氣！拜託大家了！」



  這部由直木賞小說改編，並強勢榮獲日本奧斯卡11項優秀大獎肯定的《月之圓缺》，即將

  在本週五（4/21）於台灣浪漫獻映。本片不僅勇奪Yahoo!電影戲劇「網友期待榜」冠軍，

  珍藏電影預售票目前更在博客來售票網熱賣當中（

  ）。本片劇情描述小山內堅（

  大泉洋飾演）與愛妻梢（柴崎幸飾演）和女兒琉璃，三人過著平靜且幸福的人生，卻因為

  一場突如其來的交通事故，讓小山內同時失去妻女。多年後，一位自稱三角哲彥（目黑蓮

  飾演）的神秘男子，主動找上仍沉浸在悲痛之中的小山內，並透露一位名叫琉璃的女性，

  曾在意外當天聯絡上素未謀面的他。就在小山內感到震驚的當下，三角娓娓道出另一位同

  名為瑠璃，也是他所愛之人的故事…。這幾位同名為琉璃的女子，誰是死去的女兒？誰是

  死去的妻子？誰又是死去的戀人？她們看似毫無關係、彼此相異，卻又如此相似。一段跨

  越數十年，稍縱即逝卻不被世間允許的愛戀，即將真相大白…。



