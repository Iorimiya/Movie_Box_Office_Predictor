url: https://www.ptt.cc/bbs/movie/M.1688582709.A.6C3.html
title: '[好雷]陪爸爸一起見證當年的英雄 印第安納瓊斯 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  早在幾十年前，在我還沒出生老爸還很年輕的時候，印第安納瓊斯就已經是個家喻戶曉的

  人物了

  我依稀記得十幾年前的水晶骷髏王國就是老爸帶著家人一起去看的

  當時只覺得是看一部蠻有趣的探險電影，但卻不知道印第安納瓊斯是多麽的具有歷史意義



  十多年過去了，最近看到印第安納瓊斯最終章，總覺得對這個名字特別熟悉

  問老爸要不要一起去看，他很驚訝印第安納瓊斯居然還能拍，說他很有興趣想去看看

  所以我和爸媽很難得的一起去了晚場的電影院，一起見證這位橫跨兩個時代的英雄最終章



  其實我對於印第安納瓊斯的印象並不深，所以印第安納瓊斯---命運輪牌對我來說就是一

  部闔家觀賞的探險電影，趣味性十足

  但是爸媽非常有感觸，不停告訴我哈里遜福特以前多帥，現在那麼老了還願意出來拍電影

  真的很敬業

  而他們也覺得這部最終章很好看，讓年輕時的回憶有個完美的Ending。



  印第真的是我爸很愛的角色，他可以很順暢的告訴我從以前到現在，印第安納瓊斯他最經

  典的一些武器或是動作

  甚至早期的那幾部在演什麼的大綱都說得出來，之前問他玩命關頭在演什麼他都說就一堆

  車子跑來跑去...

  我想印第安納瓊斯就有點類似我們這個時代的鋼鐵人，或是其他漫威電影，陪伴年輕人一

  起長大。


  也難怪在我説覺得穿越有點離譜的時候，他們還很激動的說印第安納瓊斯就是要有點浮誇

  才對味...


  --'
