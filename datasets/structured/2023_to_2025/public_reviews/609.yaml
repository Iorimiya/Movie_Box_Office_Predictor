url: https://www.ptt.cc/bbs/movie/M.1548251867.A.0CB.html
title: '[好雷] 《兩個爸爸》(Ideal Home) '
content: "雷文防雷資訊頁\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n1.影片名稱\
  \ : 兩個爸爸\n\n2.觀影時間 : 2018.10.1\n\n3.觀影地點 : 信義威秀\n\n4.觀影方式 : 片商邀約\n\n§其他防雷說明(非必要)\
  \ : n刷等其他說明請於此區說明....可留空\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n《兩個爸爸》(Ideal\
  \ Home) - 保羅路德與史帝夫庫根鬥嘴超精彩\n\n圖文完整版：\n\n喜劇演員保羅路德與史帝夫庫根要來一起搞笑了，兩位都是我很欣賞的\n演員，觀賞《兩個爸爸》之前就對這組合相當期待，看完也沒失望，雖\n\
  然是令人興奮的喜劇組合，但本片出乎意料的是它不只是想靠兩人弄出\n一堆荒謬情境與尺度超大的黃色笑話來搞笑，它還很溫馨動人，情感誠\n懇真摯，而幽默好笑的部分則讓它背後想傳達的正面訊息不流於說教。\n\
  \nErasmus（史帝夫庫根）是美食節目主持人，Paul（保羅路德）是製作\n人，兩人是住在新墨西哥州聖塔菲的一對同志情侶。有天晚上，某位10\n歲小男孩找上門，Erasmus才知這男孩是他的孫子，由於老爸去坐牢，\n\
  走投無路的男孩只好來找祖父。Erasmus與Paul被迫扛下育兒重擔，突\n如其來的重責大任令兩人關係長久以來一直存在的裂痕與怨懟越來越明\n顯、越來越難忍......這個新家庭能度過難關嗎？\n\
  \n這對情侶的個性幾乎完全相反，Erasmus是個天后型的人，Paul老是得\n跟在身邊收爛攤或是被看扁；Erasmus泰然自若、天塌下來有其他人頂\n，Paul則情緒緊繃而神經質，這些對比製造出許多笑料。而保羅路德與\n\
  史帝夫庫根的喜感，以及讓觀眾喜愛的特質，是本片最大功臣，尤其保\n羅路德眼睛迷人、感情真摯，史帝夫庫根則越來越有Bill Nighy般的魅\n力，搭配上劇本的好笑對話與互虧，互動充滿動人感情與默契。\n\
  \nPaul向人解釋為何還沒離開Erasmus時，回答說「一部分的自己想離開\n，但另一部分卻想留下來看Erasmus死掉」，這背後多少愛恨交織，只\n有深愛過又在一起很久的伴侶才會懂。\n\
  \n導演兼編劇Andrew Fleming本人是同性戀，《兩個爸爸》是根據他與伴\n侶養育孩子的經驗為靈感，我猜Paul這個角色應該是Fleming的自我投\n\
  射，關於他的戲都特別細膩動人。Fleming先前與庫根曾合作過評價不\n好但我很喜歡的《續寫哈姆雷特》(Hamlet 2)，此次兩人二度合作，依\n舊很對我胃口。\n\
  \n《兩個爸爸》在輕鬆氣氛下，將一段同志育兒經驗「中立化」，「同志\n」這件事並非主題，只是很自然的某個背景狀態，「育兒」才是重點，\n並藉此挖掘一段長期關係下面的坑坑疤疤的問題，這強調了不論是同志\n\
  與否，家庭與愛的本質並沒有什麼不同。不過畢竟是輕鬆喜劇，在嚴肅\n的問題方面只有點到為止，稍嫌可惜。總之《兩個爸爸》不算很有深度\n的片，但可以讓觀眾笑開懷，尤其是保羅路德的影迷絕對會看得相當開\n\
  心，迷失在他溫柔多情的眼神裡。\n\n\n\n\n--\n\n我的部落格 \nFB粉絲團  \n\n--"
