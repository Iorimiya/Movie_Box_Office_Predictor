url: https://www.ptt.cc/bbs/movie/M.1519017499.A.9A2.html
title: '[好雷] 花甲大人轉男孩 爸爸們的各種面相'
content: '版上很多討論花甲電影的優點和缺點

  有人很喜歡有人很不喜歡，我是覺得沒有那麼嚴肅

  這就是一個不一樣的溫馨好笑賀歲片

  至少我覺得比之前幾年純惡趣味搞笑的電影好太多了



  我是沒有看過電視版的觀眾，嚴格來說只有看過一鏡到底

  大概看過新聞知道故事說些什麼

  所以用一種單純的眼光去看電影

  或許正好可以避免糾結在劇情和電視版的連結與否

  另外單純地觀看，我看到了電影中各種父親的樣子


  花甲爸看似糟糕，但他心中卻存在著該對家負責任的使命感，只是選錯方法。


  議員二叔中風倒下的戲，看似阿公冤魂害的，篇幅不多

  但我卻看到最後婚禮他老婆說的，他很少這樣一直笑

  所以這樣中風，好像也是一種休息

  尤其片尾議員二叔在孩子小時候抱著孩子搖

  立刻接長大的孩子靠到他身上，那個應該是老二？

  這種父親的一生，短短幾個鏡頭我就猜到他的一生勞碌


  三叔康康著墨比較在過去，像是告訴我們男人總是很在乎成就？

  帥哥四叔因為喪子走不出來，卻因為一段有點跨時空的愛情得到救贖

  我自己覺得男人其實比較草莓，遇到挫折有誇大受傷的感覺


  再來當然就是方爸和阿瑋的片段了，感覺上方爸和瑋琪的對話

  方爸應該是個管很多的人，甚至刻板不通情理，有點大男人

  我其實一開始很討厭方爸，但是後來，當他出現在偷看阿瑋看信

  我就在想，這個老爸到底想幹什麼？

  本來有點氣，但是想想，這真的太像全天下的老爸了

  威權、霸道、無理，但是當金老師說出你長大了，好殘忍

  瞬間讓人淚崩，好像是在告訴所有子女，對！

  每個很過分嚴苛的老爸，當有一天不嚴苛時

  反而是他老了，管不動了，讓人心疼的時刻。


  還有阿公，他的穿越似乎在告訴著花甲要來得及珍惜

  不管在什麼時候，要把心愛的人放在心上

  這不就是一個男人最該做的嗎？


  我也很喜歡花甲爸接棒球的片段，那種傻傻的爸爸

  好像常常出現在我們身邊，只是我們沒有多看幾眼而已。


  看完這些 也一邊比對我自己的父親

  他是很拚工作的人，回到家就是大老爺，從來不幫家裡做家事

  永遠躺在沙發上要別人服侍，我其實常常看不下去，討厭這種大男人但是電影卻透過了用

  不同方式去解讀父親這個角色的可能

  也讓我重新檢視了和自己父親的關係

  我想這也是導演想透過花甲傳達給觀眾的

  關於家人這件事的更多面相吧

  電影版的花甲我是蠻喜歡的 過年剛好可以把連續劇也一起追了!





  --'
