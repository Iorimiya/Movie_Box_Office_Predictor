url: https://www.ptt.cc/bbs/movie/M.1472218943.A.691.html
title: '[問片] 一部爸爸是警察，兒子是毒販的電影'
content: '這部片是小時候看的，大約在2000年之後。主要就是有個爸爸是警察，但是他兒子當毒販

  。


  有一次爸爸去抓人，在樓梯上。兒子不知道，以為是要來買毒的，就問說：「你要大麻，

  還是白粉。」


  後來還記得是爸爸用外套包住拳頭，打破兒子家的玻璃，潛進去。然後警察都要抓他兒子

  ，爸爸就勸兒子投降，叫警察別開槍。


  最後一幕是，警察爸爸和孫子在海灘上...


  請問有神人知道這部片嗎？我印象深刻。


  --

  樓上真幽默~

  感謝樓上大大！

  不是一夜狂奔，也不是新警察故事喔！(以上兩部我都看過很多遍~~)'
