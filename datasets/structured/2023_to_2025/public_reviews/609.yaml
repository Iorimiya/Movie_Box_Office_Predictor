url: https://www.ptt.cc/bbs/movie/M.1609260769.A.658.html
title: '[ 好雷] 適合爸爸看的 WW84 '
content: '這部我是和小朋友一起在HBO上看的


  所以沒有值不值得買票進場看的考量


  當然聲光效果是打折扣的


  這部的吐槽點顯而易見 爬文也有諸多討論了


  連我二年級的女兒也抱怨沒第一集好看因爲都是Diana很少Wonder Woman (文戲多武戲少

  ）


  打鬥特效有部分也爛到傻眼有點出戲 邏輯崩壞也處處可見


  但我覺得整體來說是很適合闔家觀賞的聖誕節電影


  (Barbara 和Maxwell辦公室那段跟一二年級小朋友一起看我捏把冷汗)


  我最喜歡的是兩段灑狗血的哭點 打到我這33歲的大叔


  第一段是Steve告別前的話 原文字句忘了


  大意是 知道幾十年後的世界這麼美好 我也有幸能窺視一二 就值得了


  可以感受到生在一戰時代看盡人類自相殘殺醜態的他 看到未來是這麼美好的感動


  另外 願意再一次犧牲自己 只為了讓自己的女神恢復神力 拯救世界


  還勸她世界很大 可以忘了他另覓良緣 我他媽是一定辦不到的


  第二段是野心極大的Maxwell在掌控全世界後 願意為了子女放棄一切


  他兒子也在相擁後 跟他說他會永遠愛他 因為他是他爸爸


  兩邊的出發點都是那麼的真實


  身為人父 對孩子的愛護那段我能感同身受


  並且能深切體會到 爸爸想成為兒女的驕傲楷模的那股壓力


  我覺得這部分闡述得十分貼切


  因為近年優秀的超英片太多了 大家的期待都很高


  但這部確實是適合闔家觀賞的 真人版卡通


  而且少有的電影是著重在父愛的









  --'
