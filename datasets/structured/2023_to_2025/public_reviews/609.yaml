url: https://www.ptt.cc/bbs/movie/M.1473554008.A.303.html
title: '[ 普雷] 同樣是爸爸，同樣會這樣做的屍速列車'
content: '版上的雷文一堆，這篇已經算是很晚的文章了

  因為好評不斷，於是也去看了這部電影

  就創新度跟過程，我覺得是很棒的一部戲

  (兩小時的戲可以都在火車內完成，要安排的很好也是有難度的)

  喪屍的表現覺得還好，其實目前看過覺得最恐怖

  的喪屍是活人生吃裡面的殭屍們，

  就像女主角老公被咬了之後的那個表情

  真的就像是要吃了人一樣

  還有最後的結尾，那才是真正的絕望感


  戲裡面最吃重的兩位角色剛好都是父親

  這部戲其實我在觀賞的時候，我是用

  "如果是我在這樣的情況下的話,我會怎麼做？"

  的想法在看這部電影

  所以除了男主角開始時的自私心態外

  其餘的每個場景，我都會在心中浮現

  "換成是我一定也會這樣"的想法

  其餘一些如營運長的自私，沒主見的人的附議等

  不用等遇到危機，其實職場上這樣的人就很多了


  說回正題

  戲中的大叔角色點出了一句話是最讓我有共鳴的

  "當爸爸的人總是會比較吃虧"

  其實那不是吃虧，那是一種為自己愛的人的付出

  為了自己最愛的人(通常成家的人，這樣的對象都會是自己的小孩跟伴侶)

  犧牲自己不是什麼大不了的事，對一個爸爸來說

  那是很正常的，所以反而很多人感動的點

  對我來說倒像是看到自己如果遇到危機時

  會做出的事情一樣


  我覺得電影是一部分

  另一個部分是，讓自己檢視一下自己的心情

  如果你覺得裡面的爸爸們的表現讓你(妳)感動

  那那個或許對你來說沉默寡言，有代溝的

  現實生活中的親爸爸

  你也要體會到，如果今天發生同樣的事

  相信我，他們會做的事，就跟電影裡的爸爸一樣


  若你(妳)覺得電影中這樣的爸爸像英雄一樣

  那你(妳)的英雄，其實一直就在你(妳)的身邊


  --'
