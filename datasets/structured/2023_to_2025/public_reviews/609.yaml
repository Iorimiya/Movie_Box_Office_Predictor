url: https://www.ptt.cc/bbs/movie/M.1700068464.A.9A7.html
title: '[普雷]《尋父冒險記》腦海中那厲害爸爸'
content: '說散就散，你的人生我的旅程


  對於某些人因為一些人生事件，父母的記憶可能只停留在小時候、或是並沒有參與太多，

  當逐步有了自己生活時，對於長期缺席或去過去消失並未盡到父母責任的親人，你的記憶

  會是以何種形式去創造那位至親的樣貌，是厭惡的陌生人，還是一個英雄與成功人士的虛

  構樣貌，對這個模糊身影有著既期待又受傷害在兩種情緒之間游移。


  烏克蘭電影《尋父冒險記》是一部帶著國內政治黑色幽默的喜劇，故事敘述雙胞胎兄弟科

  拉與瓦沙小時經歷過父親拋棄家庭，成年後科拉成為喜愛作奸犯科的痞子，但瓦沙則當上

  了警察。某天科拉接到父親在盧森堡病逝的消息，從小對父親有所好感的他有想去找父親

  的念頭，但瓦沙卻持反對意見，他認真的說當科拉看見父親一定會後悔。









  《尋父冒險記》是什麼電影：


  2022年，俄羅斯對烏克蘭發動入侵，這場戰爭在2023年底還未停歇，雖然各國都對俄羅斯

  因為自身利益問題主動挑起戰爭感到反感，甚至聯合制裁，但實際上仍然無法阻止這種兩

  國之間的戰爭延續。這之中也讓烏克蘭與俄羅斯兩國人民對於相護的立場有了許多微妙的

  變化，俄羅斯有許多人認為這並非入侵，而是解放烏克蘭的戰爭，但烏克蘭人則不這麼認

  為，本來關係密切鄰近的兩國之間對彼此的定位產生變化。


  有人常說電影即是政治，在許多時候電影創作是一種國家工具也是人民發聲的管道，例如

  在日本二戰時期的軍國主義就用了許多愛國電影加強人民效忠天皇，共創大東亞共同圈的

  野望。


  中國共產黨與過去國民黨專制時帶也常會拍攝愛國電影讓激發人民對於國家的向心力。但

  反過來也有許多電影人、人民利用電影創作來敘述自己的理念，不管是像紀錄片《查克諾

  里斯對抗共產主義》，敘述人們如何傳閱禁片來看見外面的娛樂世界，或經典電影《再見

  列寧》下，對於東西德的黑色幽默。







  烏克蘭電影《尋父冒險記》也是以一種以國家和政治意涵為主題的幽默電影，導演安東尼

  奧盧基奇以自身父親長期缺席的經驗為發想，而將其拍攝成一部貼近烏俄戰爭前系的政治

  樣貌。


  導演從學生時代開始就攻讀電影、導演相關的課程，並且因為電影常刻畫出烏克蘭的問題

  與樣貌，也被政府獲頒烏克蘭功勳藝術家獎國家榮譽勳章，這勳章代表著他對國家的藝術

  有著相當大的貢獻。


  2019年導演拍攝《樂咖浮生錄》以母子之間那尷尬又靠近的親情為出發點，外國的月亮總

  是比較圓？想離開什麼但又不想離開什麼，烏克蘭人對於自己心裡那矛盾情感。這次2023

  年的《尋父冒險記》則以雙胞胎兄弟與在成長路上缺席的父親的父子之間為電影的核心。

  討厭父親的瓦沙；崇拜父親的科拉，在接到國外父親病危消息後，對於是否要見父親有了

  歧見，也讓彼此對於自己的人生有了不同轉捩點。










  《尋父冒險記》分析與延伸：


  這部電影是一部很有意思關於烏克蘭的寓意，藉由那個活在記憶裡印象的父親和兩個孩子

  不同的印象來詮釋，如果我們以表象的故事情節來說，兩個孩子雖然勉強有優劣。


  像是當上警察生為哥哥的瓦沙，公車司機餬口飯吃卻老愛惹事生非的弟弟科拉，兩人都是

  一般底層百姓，但卻對「父親」有著兩極的想法，崇拜與厭惡之間，但同時他們也都有想

  像過關於如果父親還在的樣貌。


  而在電影的開頭，其實導演就透露出這部電影的政治意涵，像是主角父母相遇是在共產政

  權解體之後，也塑造出父母之間的差異人設，還有雙胞胎兄弟的差異，而全片主要是以小

  混混科拉的視角為出發點，同時以警察哥哥瓦沙的視角作為結束，其實都寓意著烏克蘭這

  個國家，而父親的存在是什麼？是一家之主、威權、或是絕對的存在，具象一點是曾經與

  烏克蘭有過一段的俄羅斯？還是俄國爸爸帶來的「共產主義」。









  在2022年以前全世界許多人對於烏克蘭不熟悉，甚至不知道它在何處，但在俄羅斯入侵後

  ，現在幾乎每個人都知道烏克蘭與俄羅斯甚至整個歐洲之間三邊的矛盾，甚至還有白俄羅

  斯摻上一腳。烏克蘭導演透過《尋父冒險記》很簡單的說了這個土地的故事，俄國爸爸走

  了，留下來的人民是想當年那構建出來爸爸的美好，或是害怕再一次見到他那未知數，這

  一點在電影中有著幽默又諷刺地敘述，值得讓人思考。


  雖然說很多影評對於《尋父冒險記》影射俄羅斯對烏克蘭的關係，也是對於共產主義的一

  些批判和暗喻諷刺，但如果我們純粹的將科拉對於早年父親離開時虛幻的崇拜，還有對於

  總是比自己優秀正確的哥哥瓦沙。


  在這樣的童年下是否幻想著父親的樣模與想見父親的衝動，是否有一點是為了想確認與對

  無法放下的自己帶來點希望，尋求一個強者可以改變自己目前的生活，這種事情就如同過

  去女性將自己的未來托付給高富帥的男人般，是一種對於自身翻轉還剩下的那丁點希望。










  《尋父冒險記》值得一看嗎？


  雖然這部電影定調成是一部公路電影，但我覺得不太像，老實說《尋父冒險記》的兄弟尋

  父之旅只占整部電影的一小部分。許多時間點我覺得在讓觀眾看見科拉這個人，他可能個

  性不好、也非是什麼好人，但他還是有著他自己可愛與負責的地方，例如努力耍帥討好女

  友、或是對於受傷老婆婆去負自己該有的責任等。會覺得科拉其實是一個雖有小奸小惡但

  並不是十惡不赦的壞人，但站在因為雙胞胎弟弟各種的作為影響到自己的哥哥瓦沙就不是

  這樣認為。


  瓦沙與弟弟科拉，他有自己的家庭也有一份體面的工作，但卻總有擔心他弟弟什麼時後又

  惹事生非，而這些事情是否又會算在他這位做哥哥的警察頭上。一直不斷容忍與退讓，只

  因為他們是兄弟。


  在過去濾鏡下混黑幫的父親有錢有勢，一人恐懼一人崇拜，一人想掙脫過去的枷鎖一人則

  想找回過去，加上烏克蘭與俄羅斯之間的關係，親俄與厭俄，難怪會有許多觀眾認為這部

  作品相當具有政治意味，在拍攝當下的烏俄現狀幾乎是一種預言與現世報。







  《尋父冒險記》的電影原名為《盧森堡、盧森堡》，有許多觀眾猜測與推敲為何導演會將

  電影命名為這種名稱，比較多的想法為盧森堡是和烏克蘭一樣的內陸國家，而且是全球最

  安全也是歐洲最有錢的國家，與烏克蘭不同盧森堡是一個小國，並驅車一天左右就可抵達

  之地。


  故也許父親在有錢又安全且可以驅車抵達的盧森堡定居是科拉一種美化的幻想或真實？故

  有許多人推敲這兩個盧森堡是科拉想像的盧森堡與真實的盧森堡，表示這想法的正反面，

  正好體現在雙胞胎兄弟身上。


  以俄羅斯和烏克蘭之間的政治角度來看，雙胞胎如是代表對俄羅斯爸爸的崇拜與厭惡兩種

  極端，而也因為兩種樣貌都有，導致一個家庭的分裂。由政治的觀點看來倒是相當符合台

  灣如今的狀況，在面對中國與美國兩大國家的政治博弈與拔河，甚至一個家裡也有著台灣

  價值與中國本位的兩極觀點的拉扯。而導演如是真想隱喻政治的黑色幽默，那這部電影可

  以很清楚的表達出他的立場與站位，但也許一切只是導演從兒時回憶下突發奇想的一場烏

  克蘭人的黑色幽默。




  --

