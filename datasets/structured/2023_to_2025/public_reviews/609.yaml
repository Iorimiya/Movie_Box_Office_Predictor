url: https://www.ptt.cc/bbs/movie/M.1643650614.A.F0A.html
title: '[好雷] 爸爸的小提琴'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  首po請見諒！

  前幾天在家陪老媽用Netflix看片，老媽挑了一部土耳其片-爸爸的小提琴

  但搜尋後沒看到版上有任何分享，於是想跟大家分享這部好片


  奧茲蘭從小跟爸爸相依為命，爸爸教她拉小提琴，兩人一起街頭賣藝

  但爸爸重病即將死亡，只好找上久未見面現在是小提琴巨匠的叔叔

  感覺的出來叔叔對爸爸有很深的恨意，指責爸爸是逃跑的人，不歡而散

  爸爸過世後，社會局介入，爸爸那群街頭賣藝的朋友無法收養奧茲蘭

  於是跟叔叔講好由叔叔辦理收養後把奧茲蘭交給他們照顧

  殊不知社會局表示將不定時查訪奧茲蘭跟叔叔嬸嬸生活的狀況

  因此奧茲蘭開始了在叔叔家生活的日子

  跟叔叔的關係慢慢的昇華，最終解開了叔叔對爸爸的誤會

  原來當年還小的兩人被繼父家暴，生母選擇酗酒逃避這一切

  爸爸答應會帶叔叔離開，卻在送叔叔上了去義大利的船之後自己轉身離開

  叔叔一直以為自己被拋棄

  實情是爸爸只有存到買一張船票的錢

  所以讓叔叔逃去義大利（過程沒有拍出來）

  自己應該是不得不回到那個充滿暴力的家


  很喜歡最後奧茲蘭跟叔叔一起在音樂會上盡情演奏的橋段

  從一開始叔叔嚴肅帶有悲傷的表情到最後充滿笑容與幸福

  真的是不少橋段都讓人鼻酸

  大推這部！


  --'
