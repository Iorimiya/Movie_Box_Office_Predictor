url: https://www.ptt.cc/bbs/movie/M.1449062697.A.AC1.html
title: '[新聞] 柴智屏沮喪坦承　王大陸派爸爸去解約'
content: '新聞網址：



  2015年12月02日19:17


  24歲的王大陸因全球熱賣17億台幣《我的少女時代》暴紅後，一心想再前往中國發展，近

  日傳出他想脫離還有3年多合約的柴智屏，想轉而簽給把他捧紅的導演陳玉珊，據悉，陳

  玉珊在中國已有不少案子正進行，能助他開拓中國市場，二來，外傳他擔心柴智屏先前曾

  被扯入央視弊案會阻礙他前進中國，於是鐵了心解約，還請爸爸出動去找柴智屏談。


  據悉，王大陸覺得這麼多年待在柴姊的公司，底下員工並沒有好好經營他，甚至有些管理

  問題讓他不開心，他只能吞忍。直到這部電影，他才因為時運而走紅，平時他就已覺得不

  開心，才選在這個有利他的時機想出去，外界雖然覺得陳玉珊大頭症，但他認為陳玉珊確

  實教他很多，也幫他搏得人氣。


  柴智屏的公司剛坦承：「王爸爸確實來談過解約事宜，柴姐很難過，也想了解其中是否有

  所誤解，目前藝人工作照常安排，公司法務部門也正在了解處理中。」至於目前傾向讓王

  大陸離開？或者再說服他留下？柴智屏說：「這不是二選一的問題，現在還在了解對方的

  想法的階段。」王大陸人目前仍在中國宣傳《少女》，預計6日會在台北出席寫真集的記

  者會。（張哲鳴／台北報導）



  柴智屏（左起）旗下現有柯震東、王大陸和劉奕兒等人。資料照片


  --

  王大陸竄紅以後就打算脫離老東家 還真是利益擺第一 不過也並無不妥啦


  --'
