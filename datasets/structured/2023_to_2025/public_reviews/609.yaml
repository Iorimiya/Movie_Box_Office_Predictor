url: https://www.ptt.cc/bbs/movie/M.1675300679.A.9C3.html
title: '[鳥雷] 小爸爸的天空'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  爛到我不知道該說什麼


  上面寫什麼侯孝賢 吳念真 朱天心 還以為是什麼經典


  轉折生硬 而且看不出人物的難處在哪


  好像想講什麼就講什麼


  女主突然消失 之後男女相遇 男主沒有一點驚訝衝突


  很快就猜想女主的小孩就是自己的


  然後還很天真的在想 養小孩沒什麼


  但整片就是一直有這種想法 沒有實際遭遇所謂小爸爸的難處


  然後女主又要把小孩帶出國 但又沒講清楚她的家庭是在反對什麼


  然後男主也沒什麼掙扎 好像隨便你來 也隨便你走


  馬的一堆行屍走肉 到底在演什麼


  鳥雷


  還浪費我時間回顧打字


  --'
