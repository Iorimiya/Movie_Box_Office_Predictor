url: https://www.ptt.cc/bbs/movie/M.1473189977.A.934.html
title: '[好雷] 我的意外爸爸'
content: '終於排出時間要去看是枝裕和導演的新片<比海還深>，

  想說去看之前要複習一下導演的作品，

  就選了第一部接觸的是枝裕和的作品，

  但看的時候沒什麼感覺的<我的意外爸爸>。

  第一次看這部片是剛上映，

  衝著福山雅治而去的（？

  老實說看完只有一種失落感，

  好像沒有想像中那麼好看，

  可能是當時還是高中生，

  習慣的都是好萊塢爽片之類的，

  很少看這種親情以及生活取向的片，

  讓我沒什麼共鳴。


  昨天重看了一遍，

  結果跟我預期的差太多了，

  我竟然看完後是哭著睡著的......。


  劇情內容很簡單，野野宮一家就是標準的「都會模範家庭」，爸爸良多（福山雅治）是一

  流企業的重要幹部，媽媽綠（尾野真千子）是個愛家愛小孩的標準日本主婦，小孩慶多（

  二宮慶多）是個從小學鋼琴、上補習班，順利考進日本私立小學的孩子。結果某天醫院打

  來，說當初生產時抱錯小孩，慶多其實是另一個人家的小孩。


  老實說這個故事其實很像台灣的八點檔XD，但是是枝裕和先生很多巧妙的安排卻讓故事裡

  的人物很真實、很有溫度。很多地方也用非常小的橋段安排，讓故事錯落在不同角色的

  情緒以及反應中。


  好比說良多在看到自己真的小孩齋木琉晴（黃升炫）跟他假的爸爸齋木雄大（Lily

  Franky）一樣都會咬吸管，從此之後就把這個很小的事情當作兩人之間的連結，而在琉晴

  被接回家之後寫了一張規定，其中一條就是「不可以咬吸管」。顯示出良多希望可以趕快

  從琉晴身上把雄大的影子消除，成為他真正的小孩，也有點小心眼的個性。


  又或者是彈鋼琴這件事，整部戲從頭到尾我只聽到慶多彈了兩首歌，其中一首還林林落

  落XD。但是在綠接慶多回家時，跟他說如果不彈琴也不用勉強，慶多卻說：「可是爸爸會

  稱讚我。」因為想得到父親的認同而希望繼續練習。但良多卻在一次回家看爸媽的時候

  ，爸爸隨口抱怨一句練琴的鄰居：「練了三年還是只有這首歌。」後來在發表會看到慶多

  還是只有<瑪莉有隻小綿羊>，而覺得他因為沒有自己優秀的「基因」，而選擇交換小孩。


  很多橋段導演都很細心的為整個故事埋伏筆，這應該是是枝裕和最厲害的地方了。好像

  只是一部小品，但是若用心看就會看到很多相關聯的部分。


  其中當然有很多讓人動容的橋段，例如正式交換小孩的那天，良多蹲在河畔與慶多聊天，

  良多告訴他：「叔叔阿姨會很愛你。」慶多問了一句：「比爸爸還愛嗎？」量多思考了很

  久，說了：「恩，比爸爸還愛你。」要從一個爸爸口中說出「別人比我還愛你」，想必

  對兩方都很受傷，但是為了不讓慶多在交換之後還思念著自己，只能痛心給出這種殘忍

  當作最後的溫柔。


  其中我最喜歡的段落應該是最後野野宮家反悔，希望把小孩換回來而前往齋木家，但慶多

  一看到爸爸就立刻逃跑。良多追了上去，跟著慶多走了好長一段路，最後終於開始對話的

  時候，導演卻安排了一段岔路，兩人各走在一端，交談著，最後和好時又回到一條路上。

  我覺得這也是在暗示著這對父子關係雖然曾有了分歧，但在最後還是和好的意思，透過一

  條路，也能感受到其暗示。


  整體來說我覺得這是一部需要用心去咀嚼才能夠真正理解的片子，因為裡面有太多的鋪陳

  以及暗示，可能剛開始看不會很理解，但到劇情往後發展才會突然恍然大悟「啊！怪不得

  他這樣說、這樣做。」期待明天去看<比海還深>不要哭這麼慘而漏掉什麼劇情才好XD


  --

  我倒覺得40年反而好些，

  畢竟也都是成人了，

  對這種事情可以自己做出選擇。

  但若像故事只是6歲小孩，

  就完全被父母左右著未來。

  對啊，喜歡是枝裕和導演就是這些小巧思。

  Lily Franky真的太厲害了，

  福山算四平八穩，

  但真的遇到這樣的演員就略顯遜色。

  我覺得這也是本片一開始讓我錯愕的地方，

  第二次看思考了一下，

  我認為他是一個開放的結局，

  可以換也可以不換，

  但不可否認的是良多的確不可能再像一開始，

  要求妻子不能與慶多通電話、要求琉晴一定要改變。

  這段真的很棒，

  尤其剛上映時是2013，

  剛好是<破案天才伽利略2>的時候，

  大家都習慣那個幾乎是木頭的湯川學XD


  不過這一段我特別想講慶多，

  當初良多要把相機送給他的時候，

  慶多拒絕了。

  我猜就是因為裡面有很多他幫他最尊敬的爸爸所照的照片，

  以及爸爸幫他照的照片，

  而決定留給良多當禮物。

  算是慶多這孩子的體貼吧。

  這段真的很有趣，

  尤其在前一次，

  是良多高高在上的希望用錢，

  把兩個孩子都留給自己。

  結果後來竟然無法留住琉晴的心，

  讓他偷偷跑回家，

  換齋木問：「要不兩個孩子都交給我們吧。」

  顯示出良多難得的失敗，

  也發現當初自己這樣問的時候是多麼失禮，聽得人心裡會多不舒服。

  對的，是枝導演最厲害就是這種淡淡的片XD

  雖說淡，但最厲害的是其中的小巧思而非整個故事的劇情。

  好比說良多心境的轉折（發現孩子不是親生->掙扎->因為基因論決定交換->看到照片後悔)

  裡面的每個階段都有一些細節可以找出端倪，

  不管是台詞，演員的小動作或是物品、環境，

  看完是枝導演的作品不會有什麼大徹大悟或熱血沸騰之類的，

  都是淡淡的。'
