title: '[問片]十幾年前的外語片 一對姊妹想爸爸掉進沼澤'
content: '如題

  是我小學時看的電影,大概是10多年前的電影

  我記得片名應該是叫做"我好想你"

  但是搜尋後都找不到,可能是我記錯了


  故事描述一對貧窮小姊妹思念爸爸

  媽媽好像在學校當清潔工?

  只記得很催淚

  然後最後有妹妹掉進沼澤裡的片段


