title: '[問片] 一套去打扙的爸爸努力想回家的電影(雷)'
content: '很小時侯有看過一部電影, 關於戰爭的

  忘了是國片還是大陸片....

  故事是這樣的~~~~


  爸爸被召去打扙...

  在森林裡, 爸爸受了重傷, 遇到一條蛇

  由於太過想念家人, 結果戰勝了那條蛇, 把它給殺了

  還喝它的血, 吃蛇膽補身體

  補完身體終於回到家, 結果發現兒子為了等爸爸回來

  爬到樹上等, 結果被雷劈死


  請問有人知道那是什麼片子嘛?謝謝


  --'
