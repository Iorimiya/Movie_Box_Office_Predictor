url: https://www.ptt.cc/bbs/movie/M.1652089740.A.BA4.html
title: '[問片] 爸爸為女兒報仇的西班牙片（有雷）'
content: '以前上西班牙語課時老師放給我們看的，

  是讓我認知到西班牙電影都很有病的一部片


  影片大綱是有個單親爸爸有個高中生女兒，

  有天女兒去男朋友家裡參加派對，

  因為喝醉加上男友慫恿，被男友騙上床。

  結果上床過程被人偷拍影片還被外流，

  導致學校同學看到女兒都紛紛嘲笑她是公車

  遇到她就問可不可以上妳，還差點被強暴。

  而男朋友對此事卻不以為意，

  還認為自己是個明星。

  女兒壓力很大，甚至把留很久的長髮剪掉，

  爸爸也有注意到女兒的異狀，

  但女兒始終沒跟爸爸說清楚。

  直到有一天女兒突然消失，

  焦急的爸爸以為女兒跑去自我了斷，

  氣急敗壞之下跑去逼問所有女兒的同學，

  得知影片的事情後直接找到男朋友並綁架他

  塞進一口箱子後丟進海裡。

  但實際上女兒沒有自殺，

  她只是默默地離開小鎮，

  躲到一個沒有人認識她的地方，

  用她不多的錢財開了一間房間買了點零食，

  在這個屬於自己的空間裡享受難得的寧靜。

  結局畫面便是爸爸一邊哭一邊開車回家，

  認為自己終於幫女兒報仇，一命償一命；

  另一邊則是女兒在長久的壓力下獲得了安寧

  平靜地在旅館床上熟睡，

  如此的對比畫面看來既悲哀又諷刺。

  此片大大地顛覆了以往的復仇電影，

  看完只有滿滿的空虛感，典型的西班牙電影

  不曉得有沒有看過此片的版友記得片名？



  -----

  Sent from JPTT on my iPhone


  --'
