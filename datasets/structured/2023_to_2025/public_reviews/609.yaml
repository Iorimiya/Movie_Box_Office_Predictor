url: https://www.ptt.cc/bbs/movie/M.1448156711.A.728.html
title: '[微好雷] 爸爸終於派上用場的《邪尋》'
content: '因為熱愛看鬼片，但碟仙碟仙感覺評價不佳，雖然對凱吉抱持著一絲疑慮，依舊帶著不期

  不待的心情乖乖買了票去看，卻意外地比想像中好看。


  劇情節奏明快緊湊，無冷場，簡單交代主角的家庭生活後，便帶兒子去萬聖節的晚會，並

  且開始一連串的尋找過程，讓人很自然地融入劇情，不會覺得無聊或放空。


  個人覺得比較特別的是，當主角覺得兒子的失蹤和靈異事件有關時，夫妻倆也求助了靈媒

  ，讓我想到陰兒房，只是在邪尋裡主角終究還是不假他人之手，靠自己拯救了小孩。


  凱吉在找小孩時的著急和焦慮表現的就比演媽媽的還要好得多。媽媽就只是一直在怪東怪

  西跟逃避已經發生了的現實，給人感覺超煩，這也是不同於一般鬼片的地方，我很喜歡的

  部分。


  許多鬼片或驚悚片都讓爸爸一下就葛屁，讓弱女子單打獨鬥，像孤兒怨那樣。男性在這類

  片型裡總是後知後覺，等到發現時就死定了，邪尋在這個設定上是較特別，也相對合理的

  。


  整部看完之後我覺得是凱吉近期裡的佳作，雖然不會想特別再回頭重看八百遍，但當下的

  緊張刺激也是滿過癮的。


  --'
