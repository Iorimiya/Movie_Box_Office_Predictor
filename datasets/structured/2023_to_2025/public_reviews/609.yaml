url: https://www.ptt.cc/bbs/movie/M.1420022262.A.4BA.html
title: '[請益] 看不懂大法官的爸爸的做法?(有雷)'
content: '版上對於鋼鐵人演的大法官這一部電影幾乎可以說是一面倒的好評


  我也是因為這樣才去看這部電影


  不然我向來對這種題材有關法律的電影是敬謝不敏


  因為我都覺得劇情步調可能太快，內容可能太深會看不懂


  不過這一次大法官這部電影讓我看不懂得倒不是劇情


  而是我對電影中鋼鐵人的爸爸，看不懂這號人物心裡到想甚麼


  我不懂他為何一直有很想要進監牢的表現


  然後其言行一直在配合對方的律師


  對於幫自己辯護的律師兒子的詢問，反而極度不配合，然後看了有那種扯後腿的感覺


  甚至鋼鐵人要為他找有利於他的觀點時，他還不配合說要換律師


  他真的這麼希望被判重刑嗎???


  這跟一般人犯罪後就算受不了良心譴責願意接受法律制裁


  可是也通常會希望刑責可以輕一些，可是鋼鐵人爸爸卻完全相反


  如果覺得活的沒意思想要死，他既然不怕刑責，那大可以用快速的方式自殺說


  又如果因為活的痛苦不敢自殺又想要死，其實他可以不要去接受癌症的治療呀


  可是他也去接受癌症治療.....


  最主要是這一段實在讓我看不懂劇情到底是要表達甚麼??


  我覺得這一部電影有好幾度讓我真的都看不下去....奇怪怎麼大家都說這部電影很精采


  所以我才想如果大家都是好評，那應該就是我的問題吧


  反正如果不是因為版上的眾多好評....我應該是不會看完也不會來問這問題了


  希望有看懂理解劇情的板友可以用簡單易懂的方式解釋給我聽


  先感謝了......


  --'
