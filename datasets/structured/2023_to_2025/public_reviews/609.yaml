title: '[問片] 一部女兒喜歡爸爸的片'
content: '大家好

  忽然想起小時候看到的兩幕劇情

  很想知道是哪一部

  請求各路大神來幫忙


  1.

  爸爸親一下自己的女兒的嘴巴（發揮父愛那種）

  結果女兒非常認真的親回去

  是到男女朋友舌吻的那種程度

  爸爸嚇到

  媽媽在旁邊也傻眼


  2.

  女兒的畫作內容是自己跟爸爸在一起

  媽媽畫怎樣我忘記了

  應該是把媽媽畫得很爛 亂塗這樣


  女兒年紀很小

  我記得是韓國片


  真的只記得一點點，線索不多......

  還請大家幫忙了

  謝謝！


  --



  對！剛剛孤狗了一下，就是這部沒錯！



  謝謝各位大神熱心幫忙幫忙！！

  已經找到答案是《鬼鈴》，

  沒想到已經是這麼久以前的電影了.........'
