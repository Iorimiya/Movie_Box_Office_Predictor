url: https://www.ptt.cc/bbs/movie/M.1765271988.A.1E0.html
title: '[討論] 日麗 怎麼解讀爸爸的憂傷'
content: '故事紀錄了一段父女在土耳其度假的時光，節奏雖緩慢

  卻透過很多瑣碎的片段與對話，堆疊出兩人之間的關係與在乎

  但爸爸卡倫的狀態一直讓人在意

  有的時候沉默發呆，有的時候看起來很努力維持平靜

  卻又不時透露出一種說不出的憂傷

  導演也幾乎沒給出明確交代，留下了很多想像空間


  很多人說這部片後勁很強

  但我自己看完好像不太理解，還在摸索是哪方面是因為父女關係的真實，還是成年後回頭看爸爸的無力感？

  好奇大家怎麼解讀爸爸的憂傷



  --'
