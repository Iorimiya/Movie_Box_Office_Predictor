content: '跟朋友聊起，有哪些突然有小孩跑來認爸爸的電影，


  除了火柴人、重點是我愛你，


  印象中有一部外國電影，小孩是來自未來，


  爸爸一開始不信，但是小孩跟爸爸很有默契，了解爸爸的喜惡，


  小孩身體不好，一心想彌補親情的遺憾（好像是修復爸媽情感之類的）



  不好意思，記不得具體情節，很怕是把幾部電影混為一談，


  有大神知道類似的片，還請提醒我！感謝！



