title: '[好雷] 尚氣 之爸爸好帥'
content: '梁朝偉好帥

  梁朝偉好帥

  梁朝偉好帥


  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  總評分: 8.7不能再高

  梁朝偉: 10

  陳法拉: 9

  劉Simu: 7

  莫里斯: 9

  中文: 8

  特效: 9


  很難得可以"聽"到這麼舒服的中文語調 而不是那種硬要講的老外中文


  武打也是不錯 畢竟武術指導是成家班的


  梁朝偉很帥的貫穿整片 就算片名不叫尚氣也是沒有問題的


  以漫威宇宙來看 黑寡婦的確不像第四階段第一部反而很像是第三階段的最後


  所以如果把尚氣放在第四階段的開始 我認為是非常棒的選擇


  不過尚氣真正的故事應該是他得到十環之後該怎麼去發揮


  所以這部的劇情也不太需要多討論 就是幾個伏筆看後續怎麼用


  --

  小投資者的股市紀錄



  --'
