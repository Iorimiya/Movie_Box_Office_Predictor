url: https://www.ptt.cc/bbs/movie/M.1504330215.A.651.html
title: '[負雷] 想問爸爸去哪裡？的紅衣小女孩2'
content: "雖然中途尖叫了幾次，女性演員演技各種爆發、\n也加入考究過的民俗元素使劇本魅力大增...\n\n......但\n\n劇本所呈現的傳統性別價值\n\
  讓人看完還是森77啦!!!\n\n（至於會不會是導演的反諷呢？我是看不出來啦）\n\n--------- 防雷 ----------------------------------\n\
  \n對，動畫很差或劇情支離破碎\n其實都是本片瑕不掩瑜之處\n不過導演到2017年\n還在用宗教迷信威脅女性身體自主權、\n妖魔化墮胎手術、\n以及用愛不愛小孩來區分「好女人」與「壞女人」就很難接受。\n\
  \n\n全片就看三個墮過胎/想墮胎(殺死小孩)*的女人\n活在自責、想贖罪的憂鬱症中，\n然後糞劇情一定要在結局開「愛能解決一切」\n的超老套大絕：\n\n「妹妹你出來啊!!!!!!!媽媽陪你!!!!!!!!!!」\n\
  \          當初復活我又三次想殺我所以去死吧\n                                   by 紅衣\n片中的林美華即使展現誠意卻還是落得七孔流血的下場\n\
  就是因為他依然是片中\n「意圖殺死孩子」次數最多的壞女人\n（楊承琳只是想拿掉他女兒的孩子）\n\n最後結局再讓二女兒不斷強調：\n「媽媽其實很愛你啦真的啦！」\n\
  來感化妖魔。\n\n那個，\n不好意思\n所以剛剛林美華在你面前\n把符咒刺青都破壞你是沒看見嗎？\n就是個被寵壞的中二妹啊你去賣手工薯條吧你!!!\n\n/\n\
  \n雖然劇本安排本身有許多精采之處\n但所有藝術文本都在反映一個社會的內在價值選擇\n\n我也很喜歡劇本「安排」\n但對於劇本價值觀則是完全不能苟同~\n\n\
  虎爺這個角色我也覺得很帥\n人物個性卻超。扁。平。\n\n他明明就是整個「未婚生子」議題的主角，\n然後導演一點要處理這個議題的意思都沒有，\n因為楊承琳很篤定要拿掉小孩\n\
  所以不打算追究跟告知實情？\n\n然後結局直接跳到小孩生出來\n他就直接變成一個看起來準備好負責的父親了\nreally？\n\n所以法律問題不用管（你一開始不是要告人家？）\n\
  養不養得起孩子不用管、\n兩位小爸媽往後的人生不用管、\n\n只要你們願意把小孩生出來，就都OK喔！\n真的是這樣嗎？\n\n作為結局\n如果這確實是導演希望傳遞的給觀眾的感受，\n\
  真的是太不高明也太保守了吧！\n\n完全就是呈現了\n當代男性跟女性生產過度異化和抽離的醜態。\n反正父親只要可以「照顧（保護）家人」\n就可以在經營親子關係的義務中得到豁免權，\n\
  難怪一堆爸爸覺得自己只要有賺錢回家、\n跟小孩不熟也沒關係。\n\n↗ 補充：\n男性在父權社會中\n也是傳統對性別職務期待與分配的受害者\n讓想經營親子關係的男性往往也不知道從何下手\n\
  加上擔負主要的經濟來源、也不一定有時間可以經營\n\n\n作為影視從業人員，\n我當然也懂時下的民俗信仰、社會價值觀就是如此\n依然覺得墮胎是女人要背負一輩子的原罪\n\
  \n但作為對社會最有力的回應方式之一，\n電影直接原封不動的把這種價值觀放進劇本並大力推廣\n我覺得不行。\n\n除此之外，\n在演員演技、民俗信仰考究上，依然給予高度的肯定啦！\n\
  衝著這兩點還是有其可看之處\n\n/\n\n然後虎爺你有阻止乩身無套內射嗎？\n那難怪你找紅衣小女孩談判人家不理你。\n\n/\n\n--\n--\n\n\n\
  補充：\n林基本上將遊樂園意外視為自己的責任\n在小女孩復生後更是數次想要殺他\n所以抽象來說她依然是想殺小孩的女人\n從紅衣的角度看起來也是如此，不然不會殺他\n\
  （紅衣到結局之前並不覺得媽媽愛他）\n\n同意。\n\n\n電影的確沒有提倡多元性別觀點的義務\n對我來說\n單單只是觀察創作者怎麼回應社會的途徑而已。\n\n\
  我的批評主要在於，\n創作者本身也沒有覺得這一切有問題。\n\n女人一定要愛小孩嗎？\n家長一定要愛小孩嗎？\n\n\n女兒在幻覺中沒來由的大喊\n「我想要這個小孩!!!!」\n\
  只是因為不想要被媽媽決定人生\n還是有其他深刻的理由？\n還是大家覺得：\n\n「啊媽媽一定會愛小孩啊！」（白眼）\n\n他兩週不跟俊凱聯絡、也沒有讓俊凱知情\n\
  顯然懷孕對她來說是非常困擾而且無助的\n在這個心情沒有被解決的情況下\n把決定生出小孩作為美滿結局\n非常不可以啊\n（當下完全不覺得溫馨）\n\n我一直在思考紅衣跟虎爺的物理移動距離功力\n\
  是不是有落差......\n\n\n啊這部分是文字筆誤已修正\n我是要寫「復活我」XD\n\n本片對紅衣的設定只有提到人性與魔性兼具\n沒有明確指出大詠晴和魔兩者為不同個體\n\
  個人認為是同一個啦\n不然紅衣最後不會在那邊喃喃自語啊\n\n所以就紅衣角度來說\n美華還是想殺掉他的\n（意同墮胎）\n\n\n完全忘記吐這點!!!!!!!!!!!!\n\
  雖然要不要生、能不能生都是回歸當事人心理狀態\n但用\n「反正媽媽愛你啦不管你怎麼來的！」\n包裝這件事情就是很噁心RRRR\n\n「雖然是被強暴的，但畢竟孩子是無辜的啊」\n\
  By 長輩們\n\nwuyd 我們對於找老爸沒興趣好嗎\n\n但如果嬰靈們是設定成\n會去找附身在生父身上狂幹削鉛筆機\n\nImdb分數肯定可以衝上9\n（而且更可怕呢）\n\
  \n這的確是我的超譯\n但你知道小帥虎就算未成年\n只要楊丞琳堅持不合意一樣刑法伺候嗎？\n已成年的話更不用說\n再參照被強暴的經驗\n應該很難不告吧\n\n\
  跟心得主旨無關的確不用wwww\n\n\n好笑\n它就是反墮胎才像社教片好嗎!!!!\n\n冤枉RRRR MO PTT編輯的關係吧囧\n我等等都用推文的好啦\n\
  \n我懂作者已死&藍色窗簾，但也想丟出\n《意志的勝利》以及《永遠的0》來討論，\n兩者都偷渡了右翼對軍國主義的幻想，\n也反映了亟欲再次強大的民族情緒，\n\
  當時也都取得強大的票房和口碑，\n\n後來\n希特勒屠殺了600萬猶太人，\n《永》片的導演則說慰安婦各國都有\n以及南京大屠殺不存在的言論，\n在日本社會引起譁然招致廣大批評。\n\
  \n《意》雖並未造就希特勒\n但它的社會影響力還是在戰後成為禁片\n怎麼不去笑德國人小題大作？\n只是電影內！\n高中生扮納粹也只是好玩內！\n\n電影是傳播性極高的媒體\n\
  而本片拿了你我的稅金補助\n批判它可能帶有的意識或價值是應當的吧？\n至於有無道理就讓觀眾交流討論啊\n又不是我說了算\n\n某回文用滷肉飯詭異比喻對電影要求太多\n\
  邏輯我是沒有聽懂啦\n\n但本來就沒有人訴求這麼片該長什麼樣子啊\n單純它此刻的樣子吐點滿滿而已。\n\n拒絕承認電影有其意識形態\n對你我、整個社會都沒有好處。"
