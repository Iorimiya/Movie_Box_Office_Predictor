url: https://www.ptt.cc/bbs/movie/M.1634186319.A.180.html
title: '[好雷] 《不容易的爸爸》只是想自在地活著而已'
content: '你是否也有過這樣的時刻呢？突然在某刻，覺得即使自己再怎麼努力，人生也沒辦法有所

  突破了。



  人生裡，每一次的經歷都是在做中學、學中做的，即使有人告訴你他的經驗，你也無法完

  全理解自己即將面對的可能是怎樣的未來，這樣的未來究竟適不適合自己。



  秋田縣男鹿半島出生的男主角阿佑，就像是我們成長過程中一定會遇到的那一位朋友吧！

  內向、靦腆、不好意思拒絕他人；只是想好好地過著自己的日子，但不知道為什麼總是會

  有麻煩找上自己，遇到麻煩也不知道如何是好只能傻笑。阿佑就是這樣一個與世無爭、想

  法不多的青年。



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*


  以下文章為高雄電影誌誌友投稿，代為轉發，更多在地電影相關訊息可參考粉專：



  ~~~~~~~~~ 雷文 主文分隔線~~~~~~~~~



  大家都是會害怕寂寞的吧？會是想被愛、會是想和喜愛的人談戀愛的吧？但隱藏在甜蜜愛

  情下的，又是什麼樣的道路呢？相識、相愛、也會有相爭、相合，然後或許的步入婚姻，

  組織自己的家庭，擁有了小孩，成為了父親，背負了責任；但這一切談戀愛後會有的公式

  道路，每個人在做這件事時都已經想過、準備好了嗎？也認為自己未來能成為個及格的丈

  夫、及格的爸爸、能夠為自己人生負責了嗎？



  我們只是想自在地活著而已啊！



  即使知道自己或許不能成為個好男友、好丈夫、好爸爸，還是會想和其他人一樣，體驗愛

  情和人生中總總的美好的呀！為何要成為成功的大人，就得活在他人的期望裡，成為社會

  要求我們成為的模樣呢？如果不這樣，是否就沒有了資格和他人享受一樣美好的人生呢？

  難道人生就只能這樣不斷重複和他人相同的模式了嗎？



  就只是想要也有尊嚴的，活的像自己般，活出自由自在的生活。即使再怎樣努力，也無法

  融入社會主流的生活模式，就好像自己這一輩子最多就這樣，已經活到了極限的感覺。



  ——————————————————————————



  我是受朋友的邀請而看了這部片，且在觀影後才知道這部電影是是枝裕合攜手新銳導演—

  —佐藤快磨一起合作出的電影。觀影過程中，在男主角日常平淡無華的生活中，不斷的能

  感受到導演想傳達給觀眾，那種在現代社會中，被各種生活中措手不及的課題給壓迫著的

  平凡人生，真的是部很是枝裕和的電影。



  各種或長或短，角色間的沉默，常發生在這部電影中，每當這樣的畫面映入眼簾，總會覺

  得彷彿自己也成為了男主角阿佑，能同理到他內心的掙扎和不知所措；和那掙扎後做出的

  選擇，卻讓事態推向了另一個更糟的痛苦的處境。同理男主角的同時，也不斷的替他煩惱

  著該怎麼辦才好，但阿佑畢竟還是阿佑，即使他一遍遍的道歉著，一遍遍的想著要改變自

  己，成為更好更負責的人，阿佑依然沒有在這部電影中出現任何一絲的改變。



  ——————————————————————————



  剛開始的我，覺得阿佑是個說話不算話、一點也不負責任的爸爸，但隨著對阿佑持續的瞭

  解，開始覺得阿佑何嘗不是你、我和身邊的那位朋友呢？我們也都曾在那些找上自己，但

  自己卻還沒有準備好的事上徬徨著，年紀推動著我們，我們卻越來越追不上自己的年紀了

  ，到最後只剩下好好活著的盼望，但卻發現，連這樣的盼望都成為了奢侈......



  阿佑不是個壞人，但也稱不上是好人；看得出來他會想成為他人期待的好人，但直到最後

  一幕阿佑都沒有成功。



  這是一部沉重的電影，之所以沉重，是因為我們都能理解阿佑的掙扎和盼望，大螢幕更是

  讓演員們刻畫出的角色細節更加的清楚、更能融入氣氛當中。



  你是否也覺得自己和世界格格不入？又或你身邊也有像阿佑一樣的朋友？大家不彷進電影

  院看看阿佑的人生，或許能體悟到人生中，對你來說重要的到底是什麼，究竟自己想怎樣

  的活著。



  同時也是部很符合秋田男鹿市的觀光片，若想了解該市的文化傳統，歡迎進戲院觀賞本片

  。



  --'
