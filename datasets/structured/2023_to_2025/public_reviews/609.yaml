url: https://www.ptt.cc/bbs/movie/M.1443556338.A.7DA.html
title: ' [好雷] 《護家魔》爸爸強暴了我，但媽媽卻無視'
content: "-------------------------------------------------------\n父親侵犯了我，\n但是，母親、妹妹、親戚卻沒有人願意相信我。\n\
  -------------------------------------------------------\n\n有預告跟劇照的上色網誌版： \n\n-------------------------------------------------------\n\
  \n《護家魔》為講述一名少女「海豚」遭受親生父親性侵的紀錄片。和其他社會事件不同在\n於，海豚的母親、兩位妹妹、姑姑、舅舅、外婆等所有親人，沒有一人願意相信她。面對\n\
  如此情況，少女選擇獨自離家，來到「庇護所」，為了保護自己與妹妹，與獸父對簿公堂\n尋求「正義」之判。\n\n\n\n\n\n化名「海豚」的少女，1989年出生，就讀南韓某大學產經系二年級。偶然間，她發現自己\n\
  竟然長期遭到洗腦，渾然不知，就如「北韓人」一般。原來，父親從七歲開始對自己做的\n事叫作「性侵」，而且，她可以對這樣不舒服的行為說「不」。於是，海豚鼓起勇氣打電\n\
  話到性侵防治熱線。接著，她將事實告訴母親，沒想到迎面而來的反應，竟是比性侵更可\n怕的恐怖巨獸。\n\n在講述《護家魔》這齣紀錄片的劇情前，我想先談談導演在劇中幾個象徵畫面。例如紀錄\n\
  片主角「海豚」穿著紅色外套在雪山中行走，彷彿〈小紅帽〉一般。這個象徵暗示著海豚\n的「弱小」將遭到成人、司法體系的傷害，同時著也隱喻著本片的「性侵」主軸。因為某\n\
  些精神分析看待〈小紅帽〉，的確有將大野狼吃掉小紅帽一事解讀為「性侵」。因此導演\n特地將此畫面置於片頭，是有些意識要傳達的。\n\n另外，《護家魔》有一個不斷出現的廢墟空屋畫面。那象徵的，正是海豚的「家」。然而\n\
  導演卻用黑色蠟筆將這個家塗滿遮掩，也代表著，家對於海豚的變質：父親對自己的侵害\n、母親妹妹對自己的不信任、一個長期住居所卻無法容納自己等等。也許，在海豚的心中\n\
  ，這個家，早已被「塗掉了」。\n\n\n\n\n導演Aori起初原本著手拍攝一部關於性暴力的電影，但因故停擺。不久後，化名「海豚」\n的少女偶然得知此事，於是主動跑去找導演，告訴她，己身遭受父親性侵。希望導演幫助\n\
  她，拍攝她，進而讓更多人知道。\n\n\n在這場訪談過中，導演逐漸欣賞這名女孩的勇氣，所以答應拍攝。就這麼，從刑事案件的\n起訴，到二審的宣判，一路陪伴著女孩，記錄司法體制如何處理此事。並且記錄了海豚的\n\
  面對體制不公、家人無情的心路歷程。\n\n\n《護家魔》就這麼以順敘法報導事件起訴的過程。最特別也讓我捏一把冷汗的是，導演竟\n然在法庭偷偷錄音，因此法官與被告(父親)、證人們的審問對話亦出現在電影中。此舉在\n\
  台灣是違法的，我想，韓國應該也是。但透過這樣的錄音，也還原了司法體系如何對待這\n件性侵案。\n\n\n\n\n\n\n\n《護家魔》完整紀實了整段海豚對父親提起訴訟過程。從找導演拍攝緣由、訪談事發心情\n\
  、家人反應至提起訴訟，判決定讞。而當中，最震撼我的，莫過於海豚吐露她第一次向母\n親告知自己被爸爸性侵的對話。\n\n\n「當我告訴媽媽，父親如何性侵我時，\n\
  \n她面無表情地聽完。接著，她對我說：\n\n\n『妳很享受嗎？是妳勾引她吧？』\n\n\n『原諒他吧！熬了這些年，總算快樂了。所以，原諒他吧。』\n\n\n\
  『畢竟我都嫁給他這麼多年了。』」\n\n\n\n\n這段是《護家魔》最令我毛骨悚然的對話。導演以旁白問著觀眾，天底下怎麼會有母親不\n保護女兒呢？接著，海豚便吐露她鼓起勇氣告訴母親事實時得到的反應。\n\
  \n\n在《護家魔》訪談過程中，多次令海豚哭泣的，並非重述父親對於她施展的性暴力情境；\n全部家人不願相信她，才是令她最受傷的。海豚說，她曾經想過謀殺父親、母親。可是她\n\
  後來覺得，其實母親同樣也是受害者。\n\n畢竟海豚母親被困在韓國國族的「家庭」當中，假若她坦承事實，便會成為「沒有丈夫的\n女人」、「縱容丈夫性侵女兒的惡魔」、「沒有發現女兒異狀的蠢婦」、「獨力撫養三名\n\
  女兒的單親女性」。想想，在性侵之後，韓國社會會對平等看待這四種身分的「女性」嗎\n？\n\n我認為不會。這也想必是海豚母親不願承認、不願離開這個「家」的原因。\n\
  \n\n\n\n\n\n\n\n在海豚發現自己遭到性侵之初，她有一位男朋友。海豚正是因為與男友對談才發現自己長\n期遭到性侵。而後才聽取建議，偶然在圖書館看了一本關於性侵的繪本，閱畢後撥打電話\n\
  至性侵防治熱線。在這個事件中，男朋友，是首位得知性侵的非當事人。第一時間內，他\n很生氣，打算提告。所以倆人隨後討論，打算告訴可以幫忙的大人，男友的母親。\n\n\
  但這位母親的舉動，又是本片的另外一個驚悚點。\n\n\n她聽完竟然說：「不要再說了！尤其不要跟以後要結婚的人說！」\n\n隨後，她更私底下要要兒子與海豚停止深交，不要再跟這種人交往。\n\
  \n可能是母親大人的話總是很中聽，男友接下來再也沒有和海豚往來，並且以自己要\n報考職業軍人可能受到影響為由拒絕當證人出庭。\n\n\n這樣的舉止，我兩點想說。\n\
  \n\n\n\n第一是，男友母親的反應，能不惹事就不要惹事，不要插手管別人家的事。自己的兒子能\n夠不受牽連最要好。這的確是某些家長會有的反應，我孩子的「安全」、「前途」才是首\n\
  要的。別人家的孩子跟我就是沒關係。類似的反應在一部真人真事改編的韓國電影《青春\n勿語》也能看到。當女主角遭到十幾名男同學輪姦時，一名男同學的家長出現了，但他沒\n\
  有報警，沒有阻止，而是將自己孩子拉開，接著轉身離開。\n\n或許，因為某些少數社會事件讓人群眾失去了同理心，進而冷漠。但這種冷漠卻也導致了\n某些憾事辦案更加困難、更加不能提早解決。\n\
  \n第二點是，男友母親要兒子遠離。雖然沒有明說，也可能是我刻意偏頗的解讀。我感覺到\n男友母親對「被性侵過的」海豚存有敵意，認為兒子不該跟這樣的女孩交往，更不能娶進\n\
  門。或許就是家長對於子女結婚的想像，當「年紀」「貞操」、「外表」、「工作」不符\n合，便反對阻止。我最近看過的電影《廢青同盟》有一段情節，男孩與身障的女主角發生\n\
  性行為，結果事都還沒做到一半，男孩媽媽就闖入。看到女主角必須使用輪椅，她大罵兒\n子「好好的女孩子不交往，為何挑這種！」\n\n為了子女，父母總是幻想出他們認為是「好」的「幸福」。但這樣的美好想像，是否存在\n\
  著惡意歧視呢？或者這更是種「變質的體貼」，知道己身觀念帶有歧視，但為了讓孩子「\n更方便、更順遂、更快樂」，我的歧視是必須的。\n\n而當這種歧視成為了「必須的」，被歧視的族群們，該去哪呢？\n\
  \n\n\n去死嗎？也許言重了，但我也不知道。\n\n\n因為這些帶有歧視的人，眼中的世界根本沒有這些人，\n\n\n「我好就好，我子女好就好，所以請你不要來干擾，謝謝」。\n\
  \n為了成就己身的幸福，別人的幸福，我管不著。\n\n我不知道海豚男友媽媽這種是多數人還是少數，\n\n\n但無關數量，我都覺得，好可怕。\n\n\n\n\n\n\
  \n在台灣，報章新聞媒體中的「法律人」往往扮演令人失望、義憤的角色。尤其每當有不公\n義的判決一出，「未看判決書」的社會大眾就立刻惱火謾罵恐龍法官，不知民間疾苦。在\n\
  公民眼中，法律人手持著「正義」之劍，必須制裁著「所有的」不公不義。而在韓國這部\n《護家魔》中，亦出現「法律人」這樣的角色，決定著性侵案件是否成立。有趣的是，本\n\
  片出現了兩位截然不同的對比。\n\n第一位，是被告律師。也就是海豚父親的辯護律師，幫助其不被定罪。想當然爾，在《護\n家魔》，此人完全被導演「塑造」成反派角色，邪惡的代表，讓性侵者不受罰的壞蛋。在\n\
  劇中，一次開庭前，導演與一名證人正在等待。（海豚此次沒有出席）沒想到，被告律師\n就主動上前「攀談」，而恰巧地，又被導演偷錄音到。該名證人正準備報考軍校，之前不\n\
  願出面作證，因為怕影響到錄取。直到導演親自打電話，查過資料說過作證絕對不會影響\n考試，此次才願意出席。（這名證人就是海豚前男友）\n\n沒想到，被告律師，主動過來「閒聊」證人報考軍校一事，「聽說你要考軍校」、「你知\n\
  道亂說話會影響判決嗎」，似乎企圖影響證人。導演在旁見狀不停阻止對話進行，但海豚\n母親卻怒斥要她別插手，律師也強調自己只是在「聊天」。\n\n在此，觀眾在導演「捕捉下」看見了法律的黑暗面。\n\
  \n\n\n第二位，則是二審的法官。他在審問結束後，特別對海豚說一句話：「我能做的很有限，\n但這世界還是有值得相信的人，就像你身旁的兩個。（本片導演與庇護所所長）我問你，\n\
  假如人出車禍，手扭傷要去哪？（海豚小聲回答說．．．醫院？）沒有錯。那麼，心受傷\n也是一樣。」加上之前有位記者其實也私底下問到一審法官，其實也是支持海豚。但基於\n\
  罪刑法定原則，在刑事案件中，必須推定被告為無罪，而本案確確實實除了原告外缺乏任\n何佐證，使得法官要判被告案件成立的可能性很低。\n\n從此這兩位法官的、檢察官的努力，都看出法律的光明面。依然有一群人公理正義而努力\n\
  。\n\n但講到這，我想平衡一些價值觀上的思辨。無疑地，從頭看到這的觀眾，會認為被告律師\n是邪惡而二審法官、上訴檢察官代表正義。可是，被告律師的所作為，並沒有違法。（別\n\
  忘了，我們的社會很愛用違不違法判斷一件事的對錯，這是否又是一種盲點？）或者律師\n始終相信著被告無罪。因此，當你認為他是「錯的」、「壞的」時，是否把某種價值觀或\n\
  是情感投射了？\n\n\n\n\n\n\n\n\n我們從另外一部電影《謊言的烙印》，也可以知道性犯罪訴訟的可怕。該片講述一個沒有\n犯罪行為的幼教園員工，因為小女孩的無心玩笑，遭到解職與刑事訴訟，更被全村視為敗\n\
  類。雖然這樣說，很沒人性，但看著銀幕的你怎知道海豚訴說為真呢？\n\n在沒有任何物證與旁觀者的案件中，法官要如何中正地判決呢？因為是常被視為「老弱婦\n孺」、「女性」的「弱者」，所以被害人說的就一定為真？因為性侵是最可怕的暴力，對\n\
  女兒對小孩更是可怕中之可怕，絕對不可能有人會拿這個開玩笑，所以提告的人就一定說\n實話？假如今天紀錄片主角變成海豚爸爸哭訴著因為離家女兒躲避挨罵，講了一個謊害他\n\
  妻離子散，看著他哭訴60分鐘而被沒有聽女兒說法的你，是否還會站在同樣立場呢？\n\n\n當你陷入某種立場「同情」之時，是否就忘記中立的思考，而被引導了呢？\n\n\
  \n我沒有答案，只是表達另外一種視角。\n\n\n\n在2012年的2月16日，二審判決出爐。法官認為，由於海豚的證詞詳細具體並保有一貫性\n，不像是誣陷父親而捏造。而被告(父親)明顯有雙重人格，沒有前科，為人老實，另一方\n\
  面卻持續灌輸扭曲的性觀念，並滿足其慾望。故撤銷一審判決，此次判決被告七年徒刑，\n當庭收押。\n\n\n（其實這段我很想像妙麗舉手發問，所以看起來老實沒犯過罪的人就不會性侵？天底下每\n\
  個媽媽上新聞都說孩子本來很乖啊啊啊啊！）\n\n\n海豚母親聽完判決立刻哀號「法官不能這樣…」。原以為判決成立，海豚會歡呼，沒想到\n她竟然坐在法院椅子哭了起來，「媽媽好可憐」。她從沒想過傷害任何人，只是想尋求一\n\
  個保護，但是，周遭的人還是受到了影響。\n\n\n7月26日，最高法院駁回了被告上訴。海豚父親被移送監獄服刑。\n\n\n\n\n\n\n而韓國同樣有中秋節，亦是個家人團聚的日子。為了見母親與妹妹一面，海豚在事件後首\n\
  度返家。（在告知性侵事實後，由於全家的不相信，海豚隻身一人離家逃到庇護所生活）\n海豚買了海苔禮盒，在抵達家裡附近時，滿心期待地打電話給母親。\n\n\n母：「妳怎麼不早點在車站時就打給我？」\n\
  \n海：「我以為媽媽會討厭我，不想見我」\n\n母：「怎麼會。妳為了什麼事回來嗎？」\n\n海：「沒甚麼特別．．．就見見朋友，還有中秋．．．」\n\n\n之後，母親說要來接海豚。海豚就這麼等著。畫面上，白天轉為了黑夜。海豚依舊等著，\n\
  母親並沒有出現．．．。就這麼，她沒有踏入家門，而是回去了庇護所。\n\n事後海豚打電話才知道，其實媽媽是想見海豚的，但卻被兩位妹妹阻止。或許，她們認為\n，姊姊害她們失去了父親（父親只有性侵海豚一人而已），姊姊毀了這個家，因此不原諒\n\
  她，不能讓她回家，不能讓母親與她見面。\n\n\n\n看到這邊，我莫名很絕望。\n\n這個案件，海豚真的贏了嗎？她或許真的贏得了「司法正義」，讓犯罪的父親受罰入監，\n\
  \n讓自己不用再提心吊膽害怕在街上遇見他。\n\n但她卻失去了「家」，失去了過往她待二十年的住居所，\n失去了留有同樣血液的「親人」。\n\n她贏了，卻失去了，好多。\n\
  \n還是說，她應該隱忍，就能繼續擁有著「幸福快樂的家庭」嗎？\n\n電影在這邊就結束了。但我的絕望並沒有，我想，海豚的也是。\n\n字幕上打著；海豚總共待了兩年庇護所，她已能獨立生活。\n\
  \n不知道為什麼，這個「已能」、這個「獨立」、這個「生活」，讓我看得，好絕望。\n\n\n\n如同海豚的訪談，《護家魔》讓我印象深刻並非父親的性暴力，\n\n\
  而是親人對此事的冷漠忽視。\n\n究竟，一個溫暖幸福家，如何在一刻瞬間瓦解呢？在我眼裡看來，真的好殘酷。\n\n\n本片將於第２２屆女性影展放映，關心此事或有興趣的朋友，可以去影展看看這部電影。\n\
  \n\n--\n是個愛看電影的鍵人。\n\nmovie板：z-6-5\n\n--"
