url: https://www.ptt.cc/bbs/movie/M.1483086802.A.1DA.html
title: '[討論] 屍速列車以為爸爸會開外掛'
content: '就是還以為爸爸會開外掛


  屍速爸爸被壞人咬手之後

  他帶女兒和孕婦進車裡


  和女兒講話  有人注意到 鏡頭拍到爸爸靠在女兒身上受傷的手


  然後女兒哭著講話 眼淚還掉出來 好像到有點滴到爸的手


  然後爸爸出去要自殺時候 想著女兒出生時笑著 眼睛也變了顏色


  以為會恢復成人 但想想不可能


  因為兩姊妹的姊姊 雖然成為喪屍沒有攻擊人

  胖大叔也是因為堅強想保護妻女的心 而再變成喪屍仍抵擋喪屍群

  但他們眼睛都變色了 還是逃不了成為喪屍

  所以男主角不可能因為 腦中想到對女兒的愛 而復原

  頂多一樣是延緩 喪屍的魔性


  "因為愛"是電影常開外掛的感覺

  不過

  還以為 會因為 原來"人類情感的眼淚可治癒傷口"


  主角在要自殺時 還以為就突然變回人類 意識到眼淚可治療

  然後釜山不是成功抵擋暴動了嗎

  然後他們到釜山時候 就會遇到軍隊 和一批治療師拿著針到處幫人施打之類

  最後 主角他們會回到原本首爾 幫胖大叔等人施打眼淚針 復活

  這是我幻想的結局= =


  因為我覺得喪屍真的太多太失控了

  遲早釜山因為外面地區湧來的喪失也會淪陷的感覺


  以上


  --'
