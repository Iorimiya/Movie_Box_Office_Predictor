url: https://www.ptt.cc/bbs/movie/M.1513769885.A.4D3.html
title: '[極好雷]帶爸爸媽媽去看星際大戰8吧'
content: '我不是星際大戰的一代，九零年代和爸爸在客廳看電視台撥四五六星際大戰

  然後是大學時代每年跟著看一二三。星際大戰對我來說是上一輩的夢，是過去的童話。

  可是看到第八集，真的激動了。

  這是星際大戰上一代故事的尾聲了。是上一代的故事。

  但卻也是我們這一代的故事了。


  星際大戰七八九作為一個新世代的開啟，

  最讓我好奇的是，怎樣給舊主角一個結局？

  那問題放到現實中，就是，怎樣給我爸爸一個結局？

  給一個我們的上一代結局？

  星際大戰八給了我們答案：一個糟老頭。

  老三集的主人翁路克天行者終於出來了，每場戲都在跌股，都在讓人打臉，會隱瞞，

  最會逃，和破壞之王的鬼王達一樣，鬼王達「根據資料顯示，他除了泡紅茶了得外，

  根本沒學過什麼功夫」，而老路克除了露了一手徒手叉魚的功夫，電影的三分之二，

  我們完全不知道他老兄在幹嘛。


  就像不知道我們的爸爸媽媽在幹嘛。

  他們都老去了。很多神話，現在變得寫實。以前要仰頭看的，現在慢慢知道越過他的

  頭還有。


  拜託電影裡人人都叫路克是「大師」呢！

  但為什麼大師就不會犯錯呢？

  「人不是看成功的方法，是看失敗的退場。」村上春樹引海明威小說這樣說

  路克是不是拯救銀河的天選之子我不知道，

  但路克確實是整個電影工業所熱愛的孩子。

  他帶起了七八零年代電影的又一波高潮。

  而他的結尾，或說他的人生，完美體現了好萊塢重要的還原三幕劇的形式。

  你一定不喜歡完人。沒人喜歡完美的英雄。

  星際大戰八最重要的就是，把路克變成人。

  這個大師跟我們，或我們的爸媽一樣失敗，糟老頭成為絕地大師。他還是在犯錯。還

  犯了天大的錯。電影裡甚至告訴你是他一手弄出出宇宙魔頭。

  這時候，你開始同情他了。

  這就是電影角色的魅力。易智言老師跟我講三幕劇的人物創造，

  在第一幕和第二幕之間，務必讓觀眾比角色看得遠，站的位階比角色高，預先知道了

  角色的悲劇，也就同情了他。這就是路克在星際大戰八的開始，無論外型、作為，觀

  眾從一開始的不解，但知道他試圖殺死自己侄子，卻造成又一個惡魔的誕生，他萬分

  後悔，無比失敗，這時你開始同情他。


  而根據三幕劇規則，在第二幕到第三幕之間，角色會逐漸領悟和知道觀眾所領悟所知

  道的，兩者位階平行了。這時觀眾對角色的情緒由同情到同理。「拍拍，我懂得喔。」

  你看到路克的懊悔，也藉由尤達大師的開導，看到他的解脫。和他一起上了一課。


  然後是第三幕，天行者做出他的選擇。就是電影裡壯烈的對決。（對了，易智言老師

  喜歡把第三幕前的轉折稱為「I’M sorry」，角色一定會明白自己錯了，他想轉變。

  而路克還真的喊出i am sorry。對著他的侄子），，你不知道他會怎麼做，可是，他

  做出他的選擇和行動會讓你大吃一驚。這時候，角色比觀眾高出一階了。那就是你開

  始喜歡這角色的開始。


  路克的死是三幕劇的完美體現。他真的是這個年代電影工業的孩子。

  路克失敗了。路克死去了。

  但他也成功了。完成所謂「絕代大師」的職責。傳承與守護。在電影中，他保留了反

  抗的火種。


  美漫X-man的黑鳳凰傳奇裡，琴葛雷最後選擇死去，漫畫裡的觀察者說到：「他可以

  變成神，可是他選擇作為一個人死去。」


  我想編劇完全可以讓路克當一個無聊的大師然後樣板的死去，但他成為飽滿血肉的一

  個人，有過光榮，也犯了錯，最後在和自己的奮鬥中死去。


  易智言老師說，三幕劇的說故事方法，就是美國夢的表達。在啟動故事的同時，也暗

  含背後的價值觀。

  那路克就是這套價值觀的體現，一個人的誕生，奮鬥過，然後像個人一般的死去。



  這其中的鋪陳都很棒啊。

  當然尤達出現也是驚奇，尤達跟他說，年輕的天行者啊，這樣那樣，

  然後他們一起燒掉初始的大樹。

  這個橋段，就是功夫熊貓裡，烏龜大師出現教訓老鼠師父吧。

  好希望帶我爸爸去看。

  想握著他的手，以前覺得爸爸媽媽知道世界上所有的事情，可是現在發現了，爸爸不

  會用平板，媽媽對WIN 7系統一臉困惑，現代世界把他們遠遠拋在後面，他們努力了，

  但又不好意思問，經常讓你搖頭。那就帶他們去看星際大戰八吧。

  跟爸爸媽媽說，星際大戰是你們的電影，這部電影，你們應該去看啊。

  看你們年少時候的英雄，變老了。

  可是電影裡還有更多年少的英雄出現，他們還是很衝的，

  像年少時候的你，

  像年少時候的你看的電影裡主角一樣衝，

  個人主義、浪漫派;想犧牲、覺得一己之力可以改變一切

  但是星際大戰八裡不一樣，年輕人那麼衝，結果都在失敗，以為一個人可以扭轉戰局，

  犧牲就可以改變戰況，結果都是失敗吃土，

  看到這些情節，你們老可解氣了吧

  「叫你們不要衝」、「年輕人就是太衝動。」

  可這不是讓老混蛋開心的電影啊

  星際大戰八裡，老人也在衝。

  尤達這樣對天行者說，「失敗就是我們的老師」「我們可以成為失敗的楷模」

  所以電影裡頭的老太太們一個比一個誇張，

  用他們的方式，穿著露肩禮服，燙波浪捲，留很高貴的紫髮金髮，

  開星艦像開砂石車一樣，漂亮的切開星空，把太空船當光劍那樣用，用他們方式死去。

  比年輕人還衝。

  可為什麼我流下眼淚


  帶爸爸媽媽去看星際大戰八吧。

  故事到結尾了。這次，真的，主角都老了，都死去了。路克在電影尾聲化為煙塵，莉

  亞公主在電影之外離開去遙遠的星空。

  可是看完電影的我很激動啊，

  會想帶爸爸媽媽去看電影，

  那就是最好的禮物，

  去理解另一個人，

  把智慧和經驗確實的傳承和給予。

  但我們比電影多了一個機會，

  把感謝表達。用陪他們走一段的方式，

  帶他們去看電影，然後一起走出電影院，仰頭看看壯麗的星空，

  也許不用說，但爸爸媽媽很自然會告訴你

  接下來，就是你們的時代了。



  --

  恩人！

  怎麼辦看了大家的推文，到底該不該跟爸爸去看呢

  但我有跟我爸去看第七集

  爸爸只是說，這些真的是他們嘛？怎麼大家都好老了

  我想他沒說的是，我也變老了吧。

  不知道爸爸看完這集會說什麼！

  對啊，我爸爸後來都不愛去看電影了

  如果因為星際大戰讓他進電影院也很棒


  之前帶我爸媽去看侏羅紀公園也是這樣欸。

  明明第一集是小時候他們帶我去看的

  結果看最新一集

  我媽只覺得音效好吵，他受不了了


  我爸也這樣（握手）

  所以如果他是硬派星戰迷，

  激動一下搞不好反而好？！


  快帶爸媽去！


  也可以跟爸媽說，你們帶我去看吧（省個票錢！）


  因為原po真心熱愛著他們！？



  天啊是我偶像王王冷啊！此篇已無憾'
