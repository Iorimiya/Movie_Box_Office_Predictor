url: https://www.ptt.cc/bbs/movie/M.1452244891.A.DD5.html
title: '[負雷] 《他媽媽的藏寶圖》，我還我爸爸的煙灰缸勒！'
content: '部落格版：


  （手機排版抱歉）


  我想起去年國片最爛首選《舞鬥》，綜觀整個2015年無人能出其右，結果2016年剛到，立

  刻出現可以匹敵的狠角色，《他媽媽的藏寶圖》，還真是他媽的莫名其妙（sorry原諒我

  爆粗口）。


  我們先來看看電影怎麼說：「集合魔術、腹語、尋寶及溫馨的奇幻作品」，恩，要魔術大

  概沒出現幾個，要腹語有腹語但完全不需要，尋寶？TMD在哪裡？溫馨？噢No，奇幻？改

  成莫名其妙比較可以。總的來說，本片再次突破國片究竟能多糟糕的下限。



  《他媽媽的藏寶圖》最大問題就是通通都有問題，劇情莫名其妙，角色關係錯亂，剪接亂

  七八糟，最可怕莫過於那些無意義的腦弱幻想，徹底把全片所有演員弄成神經衰弱的角色

  ，唐振剛好帥，但他被設定成一個喜憨兒（抱歉我掌嘴）。


  我實在很佩服導演功力跟編劇，到底要如何惡整才能搞成這樣，幾乎全部，注意喔，是全

  部，劇情跳躍式進行，完全不明白到底在幹嘛，結果就跳下一段，然後靠演員說台詞帶過

  ，例如我們根本沒看到Mandy在病房動手腳，下一秒張永昌就發飆說任務失敗，還有，吳

  采妮突然出現下一秒就突然跟代哥合作，到底哪來的神邏輯覺得省略橋段讓演員告訴觀眾

  ：噢剛剛發生了什麼事情吧啦吧啦的是件好事？



  本片的Bug到處都是，如李寶龍唸啟聰學校是因為不會講話（不然怎麼凸顯他會說腹語）

  ，可是他明明會說話啊！還是因為他智商不足？也不是啊他看起來就很正常（雖然演出像

  被車撞到，但我很清楚他很正常），那到底幹嘛唸啟聰學校！


  還有曉巧不是截肢嗎？怎麼最後有兩隻腳？不要跟我說裝義肢喔她明明拒絕再婚哪有錢裝

  義肢！還是她打了什麼激素或藥物讓她重新長腳？例如某種高科技之類的。


  當然最後疑問就是，本片到底跟藏寶圖屁事！把藏寶圖換成別的也可以，例如曉巧是做煙

  灰缸的，她做了一個黃金煙灰缸要寶龍去找出來，然後本片改成他媽媽的煙灰缸，其他像

  是什麼衣服鞋子褲子襪子都可以套用同等公式，反正這只是名義啊全片根本沒在尋寶，如

  果你要說拍那幾幕疑似尋寶的畫面也算的話我就認了。



  《他媽媽的藏寶圖》硬要找個亮點就是阿喜扮醜很犧牲，就這樣，沒了。那演技呢？嗯妝

  容很像老人但聲音完全就是硬要裝出來結果很失敗。


  好險我前幾天看了《瞎趴姊妹》，不然我新年第一部看這個會讓我覺得今年會很不順。


  --

  開心爆了!!!

  我沒看到尬陶!!!!

  買票...'
