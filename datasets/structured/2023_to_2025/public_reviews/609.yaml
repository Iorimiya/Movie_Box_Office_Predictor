title: '[新聞] 恭喜！「小鬼當家」麥考利克金當爸爸 40'
content: '恭喜！「小鬼當家」麥考利克金當爸爸 40歲添丁



  2021-04-13 10:32聯合報 記者蘇詠智/即時報導


  曾是全球影壇最紅、片酬最高童星的麥考利克金，終於在40歲當上爸爸，和另一半布蘭達

  宋在美國時間本月5日一起迎接兒子達柯塔宋克金的誕生，兩人在聲明中表示彼此都開心

  至極，一家3口狀況都很好，小寶寶的名字也有個溫馨的由來。


  原來麥考利的姊姊達柯塔在2008年底因車禍去世，才29歲，他讓兒子傳承已故姑姑的名字

  做為紀念，小寶寶生下來有3118公克，麥考利和布蘭達都是首度為人父母。


  麥考利和布蘭達是幾年前一同在泰國拍片結緣，此後兩人就一直交往至今，由於布蘭達也

  曾是迪士尼頻道捧出的少女偶像，有歐美網友不敢相信小時候看的影片主角居然在一起，

  還當爸媽了。



  新聞網址：





  --'
