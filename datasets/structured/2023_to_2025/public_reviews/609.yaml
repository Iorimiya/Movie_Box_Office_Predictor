url: https://www.ptt.cc/bbs/movie/M.1589094553.A.FD7.html
title: '[好雷] 哭聲：別裝了爸爸，你也想幹我吧！'
content: '《哭聲》上映至今，仍被到處幹譙中，主要是劇情邏輯混雜，剪接到處嫁接，那個鬼一會

  是人，人一會是鬼的，很難梳理正確的真相出來，劇情轉轉轉，頭暈放棄的大有人在，也

  有的像我一樣，看得津津有味，捧在手心奉為神片。



  這次我們就來探究，怪力亂神下猛藥的《哭聲》，到底是在哭什麼？



  想看有圖的網誌板在這：




  《哭聲》的故事發生在韓國谷城（音近哭聲），ㄧ處偏僻小村落，題材卻是龐大且紛雜，

  牽涉了日本殖民歷史、薩滿巫教儀式、引述基督聖經章節，通通都有野心不小，但導演的

  手術刀未必精準，切的歪歪斜斜，讓我一度懷疑，導演是不是根本不知道自己要講什麼，

  故弄玄虛亂了套。



  反覆看了很多次《哭聲》後，終於發現導演不可告人的秘辛，這個祕密是被藏起來的彩蛋

  ，那就是「亂倫」。



  《哭聲》真正的驚悚，在暗示人類經常發生精神性亂倫。雖然不一定實際去做，卻藏在意

  淫之中，這是怎麼一回事呢？



  2場戲告訴你：



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  01 魚餌。潛意識



  車子不斷搖晃，女人呻吟從後座傳出，伴隨鐘九最後低沉吼叫，結束時間很短的性愛。


  「你可真重，」鐘九太太說：「到一半就結束，聽別人說他們老公這方面都很厲害的。」


  「要不然你給我買個補藥什麼的嘛......」

  鐘九低聲咕噥，突然腦後車窗被大力拍打，嚇得他大叫。



  「你們在裡面幹什麼呢？」女兒孝真在外面敲打玻璃，敲不停還一邊窺探。


  「你幹什麼，趕緊走開啊！」鐘九氣急敗壞，狼狽的拉上褲子：「別打開車門，你在做什

  麼啊？這ㄚ頭真是的！」



  發生糗事後，鐘九帶孝真到商店，給女兒買些禮物開心一下，待會再問她剛剛的事。


  「爸爸，你看怎麼樣？」孝真挑了粉色的髮夾，夾在耳邊，開心和爸爸分享。


  「很漂亮，真的很好看。」鐘九端詳自己的女兒，越來越覺得有女人的韻味。



  帶著買好禮物的女兒，到河邊草地，挑一處樹蔭休息，孝真愉快的喝起飲料。


  「說吧，你什麼時候開始看的？都看到些什麼了？」

  「放心吧，我不會告訴別人。」孝真大力吸吮吸管，自在回答。

  「看來你都看到了。」

  「放心吧，又不是第一次了。」



  鐘九聽見女兒這句話，幽幽嘆了一口氣。



  「給你，沒事的喝吧。」孝真遞上飲料，鐘九望自己女兒出神，簡直像個女人似的，不自

  覺臉上泛起了笑意。



  這時河岸不遠處，一位日本漁人，正悄悄釣魚。



  --



  這場戲，直接牽涉到女兒孝真為什麼會著魔？還有爸爸鐘九，想破頭也想不出災厄為何降

  臨，都給出了耐人尋味的答案。



  先從爸爸說起：



  我們知道人有意識和潛意識，鐘九對自己女兒的情慾，在這階段屬於潛意識未上岸，也就

  是他壓根不會自覺承認，對女兒有什麼情慾。



  「他是我女兒」就是爸爸明確的意識，看女兒戴上漂亮髮飾，喝女兒悉心照顧自己的飲料

  ，覺得貼心和感謝外，表面看不出有任何多餘的遐想，可是鏡頭卻拍出了鐘九潛意識的狀

  態。



  戲中的「髮飾」和「飲料」，導演有刻意多留給鐘九曖昧凝視的鏡頭，暗示對女兒的情慾

  ，偷偷遁入鐘九腦海裡的潛意識。



  「自己的女兒真有女人味」這念頭在這場戲裡，意識和潛意識層次，鍾九出現不一樣的「

  作祟」，正常倫理接受的意識是「爸爸看到女兒長大了」覺得欣慰，潛意識卻純粹作為男

  性生理，面對「女孩-女人」變化起的情慾反射。



  我在這裡先聲明，潛意識是「你無法知道和決定自己在想什麼」，所以不用覺得爸爸對女

  兒有情慾，就是非常噁心和不對的一件事，因為這道題沒有進入倫理的實踐，所以不要先

  急著罵。



  「爸爸對女兒產生情慾」硬要歸罪，反倒像是原罪了。



  人吃了善惡果後，有了是非判斷，誕生出自我意識，我們才能坐下來討論倫理道德的對與

  錯，「爸爸對女兒產生情慾」才有可能搖身一變，變成了人的意識當中要抗拒的誘惑，不

  去做不應該做的事。



  看過《哭聲》的我們知道，河岸對面在釣魚的日本老翁，其實就是魔鬼，正在那邊放長線

  ，準備釣大魚，釣的就是鐘九對女兒反射情慾的潛意識。



  無法控制的潛意識很可怕對吧！這也是魔鬼無所遁形的原因。



  爸爸自己對女兒的感情有沒有越界，不是自我感覺良好說「沒有」就能明示，魔鬼在釣魚

  ，連魔鬼都不知道什麼東西會上鉤，更何況是人類的自我感覺，哪有什麼代表性呢？



  接著我們來看女兒：



  女兒孝真跟日本漁翁有染，會在待會第二場戲，有直截了當的鞋子證據。



  在第一場戲，孝真透過車窗窺見父母做愛，是對情慾感到好奇的導引，加上她跟爸爸坦承

  不只看見一次，代表孝真對男歡女愛，真槍實彈的操演，不陌生且更感好奇。



  所以魔鬼化身的日本老漁翁，不只在垂釣鐘九對女兒的情慾，也意外釣上孝真的性啟蒙，

  一魚雙吃，這就是為什麼這家人天降橫禍的原因了。





  02　鞋子。意識



  鐘九從日本人那拿到了女兒的鞋子，事情整個很不對勁，回家趕緊打開孝真的房間，孝真

  趴在電視前，兩腿搖啊搖，在看電視。



  「孝真，你是不是丟了一隻鞋子。」

  「沒有，你在說什麼？」

  「那這是什麼？」鐘九把鞋子遞上女兒眼前。

  「那不是我的。」孝真瞅了鞋子一眼。

  「這不是你的？」鐘九把寫上孝真名字的內側給翻出來。

  「不是我的。」孝真依然冷冷回答。



  「你知道村子裡有個日本人吧。趕緊回答，你認識他吧！」

  孝真聽了點點頭。



  「你見過他吧。」

  孝真不加理睬。



  「爸爸是警察，你就是說謊我也知道。你見過他是不是?」

  孝真又點了頭。



  鐘九：「說說看吧。」

  孝真：「說什麼？」

  鐘九：「所有的一切。在那兒見過？都做些什麼？」

  孝真：「我為什麼要告訴你？」

  鐘九：「因為這件事很重要！」

  孝真：「什麼是重要的？」

  鐘九：「妳怎麼那麼不聽話呢？」



  這時，孝真轉過頭來，眼睛瞪大大的看著鐘九，說：「什麼是重要的？」


  望著女兒的眼神，鐘九意識到眼前的這位，已經不是自己的女兒，她變成了另一個人。




  「到底重要的是什麼？」孝真把問題複述一遍，語氣越發高亢：「是什麼？是什麼！」她

  尖喊：「不過是一句證詞！」



  整張臉氣鼓鼓的孝真，直視鐘九說：「你連重要的是什麼都不知道，還問個沒完沒了

  ......」說完直接出房，留下悵然若失的鐘九。




  夜深後，鐘九帶著手電筒，摸進女兒房間，她正在熟睡。



  鐘九在房間東翻西找，希望可以找到些蛛絲馬跡，解決女兒像是著魔一樣的謎團。



  他翻到了一本作業簿，裡面畫了很多東西，有自己女兒下體出血的裸體自畫像、魔鬼的臉

  孔和怪物匍匐的身軀，上面有一個洞一個洞燒過的痕跡。



  鐘九開始焦慮，翻開女兒的棉被，從她的小腿開始檢查，手電筒的光線隨鐘九視線，緩緩

  往上，掀開她的裙子，在白色內褲的外緣，女兒的皮膚出現一大片的紅腫，鐘九繼續往上

  窺探，正要查看女兒的乳房時，女兒出聲：



  「他媽的，你現在在做什麼？」



  鐘九趕緊用手電筒照女兒的臉，原來她清醒的很。


  「我...以為你已經睡了。」


  「你在幹什麼？」孝真輕蔑道：「大半夜把女兒的裙子撩起來，你想幹什麼？」



  又來了，女兒那個神情。



  坐起身，孝真臉貼鐘九很近：「你怎麼不說話？你給說話啊混蛋！給我說阿你他媽的混蛋

  ！」聲嘶力竭的瘋喊，孝真大聲尖叫，把屋子其他人也都吵醒了。



  孝真：「他媽的，我要殺了你！」




  --



  王爾德曾說：「所有事物都跟性有關，除了性本身。性，是跟權力有關。」



  在這場戲，就上演了一齣性與權力的精彩辯證。



  首先，鐘九從日本人那，也是他認為一切事情的禍端那邊，撿到了女兒的鞋子，不難理解

  鐘九為何急著對女兒興師問罪，因為身為人父很擔心自己女兒，和日本人不知道在一起做

  了什麼鬼事。



  此時孝真早已入魔，自然對人性洞悉明辨，很清楚知道眼前這位父親，焦急想問什麼事。

  因此反問鐘九「我為什麼要告訴你？」、「什麼是重要的？」



  讓入魔孝真嗤之以鼻的，是這位仗著自己之所以是父親，而擺出鴨霸氣勢的男人，居然吞

  吞吐吐不敢直言想問的問題。



  這個重要的問題是什麼呢？那就是女兒到底有沒有和日本人有染？

  但爸爸不敢直問，其實說穿了，是不敢面對。



  因爲鞋子作為女兒和日本人接觸過的證據，不言自明，鐵證如山。

  爸爸只能發脾氣。



  我們現在先來反問，爸爸鐘九真的有要侵犯女兒嗎？



  我們從第二場戲看到，爸爸之所以跑到房間掀女兒衣服，本意是出於擔心，才會仔細檢查

  女兒的身體，其實是有因果可循，頂多抱歉在忽略了女兒已經長大成熟，成為女人，沒尊

  重到她的身體自主權，該說是場誤會嗎？



  真相其實只有入魔孝真和爸爸鍾九知道，更精確說，是前者提醒了鍾九知道，一個人的「

  潛意識」如何可能成為「意識」？



  需要的是被揭弊彰顯出來，在這裡就是被孝真「大半夜把女兒的裙子撩起來，你想幹什麼？

  」給一語點破，潛意識被迫現形，原本精神性的東西，因此有了命題，成為直球對決的問

  題意識，不再只是暗潮洶湧的潛意識。



  這時候入魔的孝真，不再單純作為一位爸爸的乖巧女兒，她不是人類，是一種寄生在肉體

  存在的怨靈，能更直接感受到人類這種生物的心靈與意想。

  當然只有壞的，她可是怨靈。



  所以鍾九對女兒身體反射出來潛意識的慾念，直截了當逃不過法眼，揭露在入魔孝真那對

  炯炯有神的眼裡。



  怨靈可不是吃素的，修煉千百歲，一眼抓到這位父親底下，那股蠢蠢欲動的不安份，是鍾

  九最深層次的起心動念，潛意識純粹作為男性生理，面對女性身體起的情慾反應。




  那個夜晚，面對鍾九的意淫，入魔孝真不可能被任何的理由和辯解蒙蔽，直接大發雷霆，

  大罵想殺了這個混蛋，就算鍾九什麼都沒有做。



  在戲中被入魔孝真質問的那一刻，爸爸幾乎無言以對，也不知道該怎麼辦......



  對女兒身體產生情慾的想法，正式從「潛意識」升到了「意識」，就是被怨靈給說破造成

  的，這種內心裡面複雜的情慾流動，躍然紙上成為命題的扣問。




  總結：




  孝真身上的這個魔，是孝真和日本漁翁，也就是魔鬼化身，搞上有染後，給附在身上的女

  怨靈，屬性與性愛有關，女怨靈鳩佔鵲巢了肉身後，開始和父親對立，腥風血雨一觸即發

  。


  女怨靈的身世又是什麼呢？



  女怨靈，招自日本侵略朝鮮時期，是被日本人性污衊，積怨已久的女亡靈，鍾九的本性，

  在怨靈眼裡，就是那種有色無膽，沒用又愛吱吱叫的男人，最瞧不起了。



  自古以來，男尊女卑的權勢，不是因爲男性實質上多了不起，只是因爲喜用暴力加上愛面

  子，強加女性身體上，烙下的污辱踐踏（言語和肢體都有），強硬奪來的表面勝利風光。

  怨靈對現實既痛苦又無奈，永劫恨世，無法超脱。



  在第二場戲中，入魔孝真打從心裡看不起眼前這位父親：「你連重要的是什麼都不知道，

  還問個沒完沒了......」



  導演安排了整天混吃混喝的警察，同時是一位無碌用的父親當作男主角，深意就在這，針

  砭控訴那一貫高傲掌權，卻沒啥用處的大男人姿態。




  《哭聲》骨子裡就是一部女權電影。




  空有架式的鐘九，永遠只出一張嘴，仗著自己是父親也是警察的權勢問話，但讓入魔孝真

  想殺了鍾九的最大引爆點，是鐘九在三更半夜闖進房間，掀自己的裙子偷看，這樣你可以

  理解入魔孝真的視角，為什麼三字經一堆，誓言要殺了鐘九了吧！



  我們下次見。



