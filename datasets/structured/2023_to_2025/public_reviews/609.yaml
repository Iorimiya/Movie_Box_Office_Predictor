url: https://www.ptt.cc/bbs/movie/M.1653400925.A.64E.html
title: '[新聞] 紐西蘭爸爸越洋尋子 紀錄片見台灣最美人情味'
content: '紐西蘭爸爸越洋尋子 紀錄片見台灣最美人情味


  2022/5/24 15:47（5/24 18:58 更新）



  紀錄片「費爾的旅程」主角、紐西蘭人費爾（Phil Tchernegovski）（右），至今仍相當

  感謝當年原住民好友協助深山尋子。（瀚草文創提供）中央社記者葉冠吟傳真 111年5月

  24日


  （中央社記者葉冠吟台北24日電）24年前一名紐西蘭爸爸越洋來台，尋找登山失蹤兒子故

  事感動全台。雖然兒子最終沉眠森林深處，卻讓爸爸與台灣結下不解緣分，這段動人的療

  傷旅程，被拍成紀錄片「費爾的旅程」。


  「費爾的旅程」由導演陳勇瑞執導，電影從遇難大學生魯本的家鄉紐西蘭開始，主角、魯

  本的父親費爾 （Phil Tchernegovski）在家中回憶兒子成長過程。過去他常和兒子一起

  走進森林認識大自然，未料1998年底，兒子到台灣登山後失去音訊。為了尋子，不會中文

  的費爾獨自越洋來台，甚至到總統府前請求幫忙，當年的新聞畫面至今仍能找到。


  在台灣官方及民間協助下，費爾走入阿里山尋找兒子，一路上有許多人對他大喊：「加油

  。」當地鄒族人更深入險境協助尋人，費爾漸漸和當地部落朋友，超越語言隔閡結為摯友

  ，埔里教會還有不少民眾捐錢力挺。費爾說，快要花完錢時，突然收到大家遞來的粉紅袋

  子，他原以為是鼓勵卡片，結果「打開來才知道都是錢」，才得以讓搜救活動持續更久。


  雖然費爾最終沒有找到孩子的屍骨，但鄒族摯友武勝山告訴他，孩子掉進的洞裡，鳥兒叼

  的種子掉下後，孩子化成了樹，接著又有更多的鳥來吃果實並落下種子，他相信「魯本化

  為一座森林了」。


  在紀錄片中，導演訪問逾20名費爾多年來在台灣結交的好友，雖然彼此不常見面，但費爾

  未曾忘記台灣人給他的幫助。費爾認為，是兒子魯本引領自己認識台灣，即便得面對與兒

  子道別的痛苦，但偉大的愛、善良與友情平衡了這些悲傷，「我在生命中得到了奇妙的平

  衡，失去兒子但得到2300萬個朋友。」


  後來費爾也隨時把握機會幫助台灣，在921大地震發生時，他二話不說飛過來當義工、協

  助蓋房。近年來，費爾也常到台灣探望老朋友，陪伴偏鄉孩子、老人進行藝術創作，也會

  探望兒子化作的森林，「我知道魯本不只被祖先懷抱，同時身邊還有很多美好的人民，我

  回去那裡跟他打招呼，我知道他是快樂的！」


  「費爾的旅程」27日全台上映。（編輯：張雅淨）1110524





  紀錄片「費爾的旅程」主角費爾（Phil Tchernegovski）（中）因拍攝再次來到台灣，想

  起剛來台時的無助感，如今再踏上這塊土地，他的感受已截然不同。（瀚草文創提供）中

  央社記者葉冠吟傳真 111年5月24日



  --'
