url: https://www.ptt.cc/bbs/movie/M.1737338499.A.ED2.html
title: '[好雷]《爸爸》：說與不說之間，答案盡在無聲中'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《爸爸》：說與不說之間，答案盡在無聲中\n\
  \n明明最大賣點就是駭人弒親案 ，影評卻對案情隻字未提？沒錯！因為《爸爸》這部片最\n迷人的，是生活感的營造與設計，而不是令人心碎的惡行，是看似平淡卻帶有深意的佳片\n\
  。\n\n●最大亮點：巧用環境音\n\n《爸爸》整部片的調性與情緒偏沉悶，用不同時期的生活碎片，跳轉拼湊成一個完整故事\n。沉重、讓人心頭悶痛的情節，要如何帶觀眾順利穿越？我會說是從環境音細節帶出的沉\n\
  浸感。市場攤販叫賣聲、香港路邊的車聲人聲，連爸爸在逛相機店，也刻意把門開著，讓\n耳邊充滿細碎的嘈雜。你彷彿真的置身香港市區，與主角一起經歷他的人生。\n\n\n\
  \n\n●爸爸：肩上的重量，以及父親之所以成為父親\n\n阮永\n年在事發後，多數時間都面無表情、充滿理性，他照常料理留下的家務、處理母女的身後\n事，並面對兒子的案件偵查。片中對父愛的描寫，常是具體的行動和付出，而不擅長用漂\n\
  亮詞彙表達，這也是許多人對於父親的典型印象。\n\n看到一半，你一定會想問：阮永年都不會難過？不會痛嗎？片中用了很多劉青雲的細膩表\n情來回答，但其中最讓我印象深刻，是阮永年被傳播妹騙錢，生氣之下爆砸客廳的橋段。\n\
  性慾是非常誠實的空洞，無法填充的慾望不僅指向當下的不滿及空虛，更讓人想念與金燕\n纏綿雲雨的回憶。\n\n人生的長河裡，他的愛恨大部分都是壓抑的。可能是來自於社會對於男性陽剛形象的期待\n\
  ，也可能自小缺少情感表達的經驗和引導。\n\n\n●原諒與寬恕：一個困難卻動人的選擇\n\n當你跟隨導演，時空穿越到永年成為父親前的生活，甜美愛情、成家立業、全家團圓的和\n\
  樂，過往記憶疊加鋪墊，越來越深刻，心中的疑問也逐漸擴大：「為什麼？」，以及隨之\n而來的：「為何他不再追問？」\n\n「要答案的是你，不是我。」厚明曾說過這樣的話，向父親和治療師拒答犯案的動機。一\n\
  方面犯案的動機本就複雜，一方面厚明並不習慣表達自己，甚至可以說是固執封閉。\n\n\n\n片中有許多的暗示，永年可能有與厚明相似的問題（可能是精神疾病，亦或是壓抑情緒的\n\
  固定模式），他們都不擅長說，都慣於將不滿的情緒壓抑。所以當永年問厚明「為什麼不\n說？」其實也是向過去的自己提問。在想念過去的無盡長廊裡，他漸漸看懂了自己，也理\n\
  解兒子，從中尋回身為父親的初衷。\n\n\n-\nIG：Fishpond_like \n\n臉書：魚池 FishPond \n\n個人網站：\n\n--"
