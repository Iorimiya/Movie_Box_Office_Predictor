url: https://www.ptt.cc/bbs/movie/M.1486845155.A.59F.html
title: '[問片] [有雷] 問一部拯救爸爸的噁心片(?)'
content: '國中時去電影院看的，


  一開始就是一個軍隊要去某個地區的封鎖實驗區，


  軍隊裡有個女醫生(?)，她的爸爸似乎在此實驗區，


  為了救爸爸才跟著軍隊來的吧?


  劇中好像是人類會出現幻覺，開始自殘，


  有一幕是某個角色背部脊椎的肉全都被挖光，露出脊椎骨頭，


  那個博士爸爸早就死亡，


  其目的是引誘他們來到此區，將他們作為實驗品?



  我對電影的印象其實很確定的就只有脊椎那一幕XD


  其他就是大概而已，而那部片當時很冷門，後來電影台有播過，


  依稀記得當時看過的都說爛QQ


  但後來想起覺得滿奇特的，就是忘記片名~~


  求大家幫忙想想!  感謝~~


  --


  後來女主角好像被爸爸誘惑在最後背叛他們，所以才全死，


  印象中劇中我應該沒看到阿諾才對~


  這部片真的很冷門!!




  也不是毀滅戰士，劇中沒有怪物，但是人有點像是被控制，


  出現幻覺，像是被控制然後自殘也會傷害人，


  另外露出脊椎沒有肉那幕的是女生，記得好像有個男生看到這幕後來也跟著死。


  google一下，感覺滿像的，時間也差不多是我國中時，

  不過似乎是劇情差不多，但不是這部，

  記得還有個女博士，才是原本實驗區的博士女兒，

  而後面是女博士想讓他們困在實驗區，所以最後死亡，

  我是在威秀電影院看過的，好萊塢後來好萊電影台曾經播過，


  不過這部好像有好幾集，找個時間來看看!!

  感謝ZaHa大大，太神啦'
