url: https://www.ptt.cc/bbs/movie/M.1474444616.A.9CE.html
title: '[ 好雷] 屍速列車之爸爸真偉大？'
content: '不知道是不是個人感覺


  感覺編劇刻意要把男生演得很苦命


  例如男主角，做著錢多但是社會觀感不好的工作，其實也是為了養家活口


  回家之後還要面對離婚官司，小孩的各種不諒解，老媽的嘮叨


  就跟孕婦的老公說的一樣


  丈夫這輩子注定要犧牲跟吃悶虧，也是要為了家人拼


  男主角連最後自己決定要死了，都還在想著她女兒後面的安危


  最後要跳車的時候，看到男主角跟他女兒剛出生的畫面，整個淚崩


  覺得每個小孩出生的時候，爸爸都是這麼的呵護跟驚喜，然後越長越大，因為缺少陪伴跟

  互動，距離越來越遠，彼此像是陌生人一樣，就跟片中的父女一樣


  更幹的是每天賺錢養家，結果小孩都比較愛自己老婆XD


  片中把兩個爸爸都演的很偉大，應該就是所謂的責任感吧，還殺過四個車廂去救人


  其他部分倒是沒有特別的感觸


  節奏太快，來不及思考有無bug


  只是覺得都滿合理的


  自私大叔，這在很多災難片都有這種角色


  要說一群人面對恐懼的刻畫，我還是比較推史蒂芬金的迷霧驚魂，那部片看完真的五味雜

  陳


  另外大家講的好人壞人之分，我也覺得還好


  男主角一開始也是那個狠心關門的角色


  後來反而變成幫助別人


  另外個人覺得最勇敢的是列車長，還很認真的一個人跑出去找車，看到那幕我都笑了，哈

  哈


  高中生殉情那段比較無法接受，他們敲玻璃的時候是不會先關門膩...


  一些些感想


  寫得很凌亂，還有手機排版，請大家見諒



  --'
