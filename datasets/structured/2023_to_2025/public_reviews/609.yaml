url: https://www.ptt.cc/bbs/movie/M.1477929806.A.55C.html
title: '[討論] 你的名字 瀧與三葉爸爸'
content: '有雷


  我先承認我沒有看過小說

  不知道小說裡面的安排是怎麼樣

  　

  有些人有提到

  關於男女主角彼此喜歡上對方的理由好像有點牽強

  　

  其實他們每天都交換彼此的生活

  利用對方身邊朋友們相處的模式等等

  其實應該能多多少少能了解彼此的個性

  　

  如果在瀧(in三葉)去找爸爸求助

  希望爸爸能派出消防隊那一場戲

  　

  如果瀧能藉由那場戲

  說出瀧自己對於三葉處境的看法（政治人物女兒的閒言閒語）

  說不定能更有張力

  　

  因為我個人認為

  三葉的處境其實有滿多東西可以發揮的

  政治人物的女兒

  還有出生在比較傳統鄉村與家庭

  還有對於大都市的嚮往

  　

  而這些處境跟本身就處於大都市出生的瀧

  之間的連結好像並沒有非常多

  總覺得有點可惜了


