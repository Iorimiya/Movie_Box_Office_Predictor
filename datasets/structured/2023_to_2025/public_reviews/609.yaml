title: '[負雷] 古墓奇兵-自投羅網的爸爸(大爆雷'
content: '我不算古墓奇兵腦粉。


  但是也玩過卑彌呼女王(古墓奇兵9)版本跟尋找生命之源(古墓奇兵：崛起)版本


  我只能說這預告剪的太好了。









  ============================(防雷頁)==========================================


































































  提到聖三一，就讓我以為這部電影是要演「崛起」的版本。


  因為我記得很清楚，古墓奇兵9沒有聖三一。


  後來看到正片才知道...


  我被騙了，Fuck!!!



  而且為了要不讓蘿拉太孤單，還要安排一個吳彥祖客串演出。


  吳彥祖說邪馬台在惡魔海中間，說去那邊必死無疑。


  結果蘿拉拿錢出來他又笑了，說拿錢是要買棺材嗎? 然後又答應要載他去


  到底是要載還是不要載? 到底是買棺材還是不買棺材? 師爺你給我翻譯翻譯



  接著等蘿拉上岸了，被聖三一的人抓走之後。


  蘿拉問他「我爸爸在哪裡」


  對方開口直接講出一句「他與主同在」他死了。


  靠！這是日本阿大哥!!!!!!! 而且你不該在這裡出現的，你是要在基特城婊耶穌的阿!



  這當中很多地方都是很刻意，例如說船撞礁石結果蘿拉要利用船上的梯子過去船頭


  還有被聖三一抓走了，跳到河流裡面最後在運輸機上險象環生的情節。


  非常非常刻意，刻意到一種，根本不像是在還原遊戲情節。




  最後蘿拉找到她爸爸了，她爸爸也知道聖三一發現入口了，但是不知道密碼!


  蘿拉就拿著弓箭殺壞人，吳彥祖當輔助幫忙。


  這個時候蘿拉的爸爸居然直接露臉。


  自己跑去入口，一臉讚嘆的說「哇~」



  哇個屁阿哇... 老爹！你知道你自投羅網了嗎?


  結果聖三一的人就「非常」順手的抓住他爸要求蘿拉開門。


  結果壞人槍還沒上膛，蘿拉居然不射他，還等他上膛。


  等到人家上膛了的時候蘿拉只好順理成章的放下弓箭然後開門。



  一路上機關重重，沿途解謎到了卑爾呼女王棺前。


  我還以為，卑彌呼女王會突然爆發一波，把她的軍團叫醒。


  就跟遊戲一樣，晚上他們還是會敬拜女王期待她復活什麼的。



  沒有!!! 沒有!!!! 沒有!!!!!!!


  就看到一個機關突然把女王屍身彈起來，然後大家嚇到，就這樣!!!!



  你到底把卑彌呼女王那些法術放哪裡去拉!!!!!



  那些暴風雪、那些閃電、那些身高五呎七吋拿大斧頭的護衛、那些拿長槍的古代兵團呢?


  那個在十級強颱外加暴風雪，還能拿弓箭秒殺邪惡兵團的蘿拉呢?



  沒有!!!!!!  只有聖三一摸到屍身，然後中毒這樣!!!!



  這時候蘿拉才發現女王並不是壞人而是得病死的，而且那個病是足以毀滅人類的。


  這個時候摸到毒的聖三一教眾突然爬起來，然後蘿拉他爸摸到毒，直接收掉這隻角色



  然後蘿拉就對決大魔王，蘿拉最有名的那副金鋼不壞登山斧也在逃脫的時候才有用處。


  他沒有拿登山斧連續技砍大魔王，而是跟他打肉搏最後才用登山斧逃脫。



  最後蘿拉也傻傻的簽了名子，讓安娜當委託人，片尾買槍那邊應該是遇到下次的魔王

  會是安娜。



  然後應該就是去基特城婊耶穌了。




  總之我是個玩過遊戲的玩家，我對這部片的劇情安排完全無法接受就是了。


  因為卑彌呼女王這版本是我很喜歡很喜歡的版本。



  尤其是蘿拉拿弓箭意氣風發的樣子。


  我無法接受我的蘿拉變成這樣。




  最後不負責的亂扣分。


  蘿拉奶子不大，扣二十分。(遊戲中的蘿拉身材很好的)


  老爹送頭，再扣二十分


  聖三一亂入，再扣二十分。


  卑爾呼女王只是門神角，再扣二十分。


  劇情失敗，在扣二十分。



  總分一百，就這樣被扣光光了...


  好啦 扣除第一樣 給20分~






  --



  --

  沒差，玩過遊戲真的在看到電影會覺得很吐血。

  笑死 這樣也能崩潰。

  其實遊戲中的蘿拉在這個版本裡面是沒有對抗聖三一的

  而是她對抗一整個卑彌呼的邪惡軍團 算是我最喜歡的一個版本吧。

  而且登山斧出神入化的，強翻惹~

  已改過

  再三小拉!

  只能說劇情上很多不合理的互串看得很彆扭 適合給不是玩家的人看吧

  而且我也說了，我其實是為了遊戲才去看的...

  所以那是我的問題嗎? 我打文章本來就不是為了要討好別人的。

  我只是以一個玩過遊戲的玩家來看待這部電影罷了。

  如果發文什麼的只是為了討好別人然後讓一些人有機會蓋文章，那我覺得其實也沒意義。

  我也是這樣覺得，因為最後那邊蘿拉她潛入女王的祭壇那邊其實很壯觀的。

  應該會有一場大戰的，蘿拉拿弓箭跑跳然後射殺邪惡兵團這些橋段。

  結果沒有，這點我就挺失望的因為那橋段讓我印象很深刻。


  或許把超自然抽掉的結果就是如此吧，就看看下一個版本是不是去基特城囉。

  如果是基特城應該會更難拍吧。'
