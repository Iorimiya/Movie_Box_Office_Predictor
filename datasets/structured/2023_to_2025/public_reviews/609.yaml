url: https://www.ptt.cc/bbs/movie/M.1545144032.A.747.html
title: '[新聞] 棚橋弘至主演「我的爸爸是壞蛋冠軍」 七'
content: "新聞網址：\n\n被譽為摔角界「百年難得一見的逸才」、拿過新日本IWGP重量級王座七次的紀錄保持人，\n棚橋弘至首次挑大樑主演【我的爸爸是壞蛋冠軍】，在摔角迷瘋狂敲碗下，伴隨著熱血的\n\
  汗水與感動的淚水，終於要登上台灣大銀幕。本片改編自日本暢銷兒童繪本，書中的英雄\n角色「飛龍喬治」正是以棚橋弘至為原型繪製，而他也笑說其實在收到角色邀約時非常驚\n\
  訝，「因為我一直以為會找我來演超級英雄的角色」。【我的爸爸是壞蛋冠軍】完全顛覆\n棚橋弘至現實中的爽朗形象，在片中飾演一名因負傷而暫時引退的王牌摔角手大村孝志，\n\
  但一心只想重回擂台的他，選擇戴上壞蛋的面具，成為朝對手噴辣椒水、無惡不作的「蟑\n螂假面」。然而最痛苦的並不是觀眾的噓聲，而是無法向兒子祥太坦承自己的職業，同時\n\
  還要面對膝蓋舊傷的復發──棚橋弘至完美地演繹了遊走於家人與工作之間的衝突與抉擇\n，令觀眾直呼「根本是日本版巨石強森」。\n\n\n\n這次，兒童繪本能被相中改編成電影，最大的功臣其實是棚橋弘至。當導演向摔角雜誌取\n\
  材時，聽說棚橋弘至私底下曾多次到自己孩子的學校，唸繪本給小朋友聽，而此書正是《\n我的爸爸是壞蛋冠軍》，製片也在閱讀後認為男人奮鬥的物語加上家庭題材的故事，「會\n\
  中！」而後不僅順利取得翻拍權，上映後更是佳評如潮，觀眾被父子之間的親情戳中淚點\n，更大讚為了夢想越挫越勇的棚橋弘至實在「帥度破表」。而棚橋弘至第一次發現這本書\n\
  時，便認為「故事處處充滿共鳴，對於完全不認識摔角的人來說，這正是讓他們對摔角產\n生興趣的好機會。」他也從現實中唸繪本的爸爸，一躍成為故事中的主角，與實力派女演\n\
  員木村佳乃飾演夫婦，加上天才童星寺田心助陣，【我的爸爸是壞蛋冠軍】將於1/18在台\n上映。\n\n\n【我的爸爸是壞蛋冠軍】描述曾經在擂台上大放異彩的王牌摔角選手大村孝志（棚橋弘\n\
  至 飾），因負傷而消聲匿跡。一直衷情摔角運動的他，選擇戴上壞蛋面具，以「蟑螂假\n面」身份重出江湖，就算與對手死纏爛打，被觀眾們的噓聲嘲弄，打死也不離開他最熱愛\n\
  的摔角擂台。面對兒子祥太（寺田心 飾）追問起自己的職業，孝志對於自己「蟑螂假面\n」的稱號實在難以啟齒，而祥太卻在此時意外發現爸爸竟然是摔角擂台上無惡不作的壞蛋\n\
  ！更糟糕的是，同學們居然誤會祥太的爸爸是人氣摔角冠軍「飛龍喬治」，紛紛向祥太索\n取爸爸的簽名，一連串意想不到的笑料就此展開。此時，孝志的膝傷再度復發，醫生告誡\n\
  他萬萬不能使出「必殺技」，但是大村已經下定決心用他的人生毅力教會祥太──勝利不\n是最重要的事……超值電影預售票即將於博客來售票網開賣，凡購買雙人套票即贈撒隆巴\n\
  斯提供之「益 噴劑」乙罐，贈品數量有限、送完為止；憑電影票根，就有機會抽中尖端\n出版提供之「同名原著繪本」壹本。贈品以實物為準，詳情請見戲院現場公告及天馬行空\n\
  粉絲團。\n\n--\n                                 12/18 22:40"
