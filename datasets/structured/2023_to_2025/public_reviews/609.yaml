url: https://www.ptt.cc/bbs/movie/M.1562036136.A.FBA.html
title: '[討論] 誰最會演爸爸??'
content: '我認為銀幕上父親的典型有三種

  好爸爸

  大眾型爸爸

  跟混蛋老爸


  其中大眾型爸爸就不討論了

  另兩類，拍過一片以上有名老爸電影的，我就認為他很會演老爸，就列一下







  =============以下有李安父親三部曲 綠巨人系列 勇者無敵 變人雷=========










  好爸爸系列：


  郎雄

  《李安父親三部曲》

  囍宴裡最精彩的

  就是郎雄最後跟"老外媳婦"坦承他其實聽得懂英語，三人的關係他也明瞭

  這邊真的是演技大爆發

  後來本片也走向某種妥協版的happy ending

  有人說片尾郎雄在機場受檢時高舉雙手就象徵著投降跟妥協XD


  飲食男女也是

  片尾郎雄一樣引爆演技

  原來他想娶的

  不是歸亞蕾而是張艾嘉XD



  推手老實說我沒看完XD



  郎雄的父親形象

  就是新時代下傳統型嚴肅父親

  大家老爸多少都有點感覺

  如果你很年輕的話，就把郎雄帶入成你爺爺好了XD


  所以說他是國人眼中最經典的螢幕父親實在不為過




  山姆尼爾

  《變人》

  片中他有兩個女兒

  也就是機器人安德魯口中的大小姐跟二小姐

  我一直覺得山姆帶著兩個女兒的畫面實在很賞心悅目

  因為他長得很體面XDD  溫文儒雅

  有把家境維持在小康跟富裕之間

  也有充分的時間陪家人(教父電影最強調的XD)

  好像有點寵女兒

  所以我認為這應該是女生很欣賞的老爸類型

  (當然是自己老爸最好啦，不過看電影帶入一下沒差)



  但是安德魯跟他其實也是有著接近父子的關係

  除了教導工藝技術以及人類的思想外

  從安德魯贖了自己身反而被趕出家裡

  以及山姆臨終前還召喚了安德魯這邊可以看的出來


  後來安德魯慢慢變成人類時

  在心情不好的時候

  也曾幻想山姆尼爾還坐在他身旁跟他徹夜長談

  的確是有把山姆當成老爸



  註：其實山姆尼爾我只舉出一部，應該是不太好打進本名單的

  但不知為何我對變人裡他演的老爸印象非常深刻

  加上他在侏儸紀系列也有照顧小孩的形象

  姑且就列一下XD






  混蛋老爸系列：

  Nick Nolte


  《綠巨人浩克》2003

  Nick Nolte演浩克的爸爸

  超欠打XDD

  他變成瘋狂科學家後

  讓班納家庭整個變調

  也埋下了布魯斯最後變為浩克的因素

  最後又陰魂不散的回到布魯斯的生活

  而對面的貝蒂羅斯的爸爸也是欠打到不行


  寫到這邊才想起來

  剛好又是李安的片

  李安拍老爸主題真的超強


  可惜03跟08版的羅斯將軍是不同人演

  不然就可以列在本表了




  《勇者無敵》

  兄弟倆為了種種原因

  在擂台上相見了

  中間還夾了一個混蛋老爸XD

  其實這老爸也沒那麼混蛋

  應該說這父子三人本來就毛很多

  而這部片也就是看這父子三人間的愛恨



  Nick Nolte生來就一副頑固老頭樣

  演混蛋老爸真的是非常適合

  不過他有演羅倫佐的油裡的好老爸XD




  以上


  前輩們有沒有推薦的其他螢幕老爸??

  我本來想打星際效應的庫柏，但只有一片的關係就不好列上去了

  梅崗城故事的老爸也是超有名

  AFI百大英雄榜首耶



  另外補列個第四型

  以暴制暴型老爸

  你敢動我家人我就滅了你


  也就是終極警探系列跟即刻救援系列


  真想看兩邊crossover

  就演某組織設計讓老布跟連恩尼遜都以為對方綁架自己女兒就好

  最後誤會化解，兩人聯手滅了組織


  --'
