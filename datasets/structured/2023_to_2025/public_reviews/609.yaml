title: '[微負雷]《牠 第二章》，你還是爸爸的小女孩?'
content: '部落格版：



  2017年上映的《牠》我非常喜歡，對於沒有看過原著還有舊版的我來說，《牠》確實給了

  我於視覺與聽覺上的雙重享受，整體氛圍營造給人很重的壓迫感，比爾史柯斯嘉所飾演的

  潘尼懷斯詭譎到使人毛骨悚然，魯蛇俱樂部從結盟到爭執分裂、再到最後的通力合作，為

  了友情、為了長大、為了擺脫心底夢魘，他們急速成長好掙脫潘尼懷斯的追逐。童年不是

  只有美好，有時候惡夢會如影隨形的糾纏著你，不似其他鬼片或者恐怖電影是有著一個確

  定的「目標」，《牠》以「每個人所畏懼的存在」來侵襲著魯蛇們以及我們每個人，小丑

  潘尼懷斯只不過是一個形象軀殼罷了，正因為未知、正因為牠可以是你所畏懼的任何人與

  物，所以我們每個人都是牠的獵物，所以才會打從心底害怕並感到恐懼。




  首集的《牠》以最容易將恐懼事物加倍放大的孩童為目標，整體向就是有些惡童趣的路線

  ，不論是魯蛇俱樂部或是身為觀眾的我們，對於潘尼懷斯都不了解，因此每次嘗試都是第

  一次，和牠的對抗也是，新鮮二字成了首集最成功也最吸引人的關鍵。而這股新鮮感能否

  延續到第二集是滿重要的，但在我眼裡看來顯然沒有，《牠 第二章》就好像是《牠》的

  加強版，不論從哪方面來看都是以首集為基礎然後再往上增添些什麼，太多地方有著首集

  的影子，整個劇情走向與發展套路就好似複製貼上，就連最後魯蛇俱樂部齊聚對抗潘尼懷

  斯招數也都相同，只不過是從首集的「用不害怕來消弭潘尼懷斯的力量」到這集的「靠讓

  牠相信自己很弱小來消滅牠」，看上去有所不同，可實際上走的是同條老路，也許問個直

  接點的問題，27年的時間說長不長說短不短，外表是變老了、心智貌似成熟了，但《牠

  第二章》所呈現出來的是「面對恐懼」到「面對過去的恐懼」，多了過去兩個字就算是長

  大了嗎？


  從1989年到2016年，27年的漫長時間不只讓魯蛇俱樂部的成員長大，連潘尼懷斯明顯也有

  所變化，從過去目標專找孩童，到這集首位犧牲者是名成年男性，就可以看出牠其實因為

  27年前被打敗而變得不同了，不單是魯蛇俱樂部的成員學會面對恐懼，潘尼懷斯何嘗不也

  是體會到何謂恐懼？以此在27年的一次循環後，牠的目標也從孩童變成跟長大後的魯蛇俱

  樂部成員差不多年紀的人（當然電影中最兇殘的畫面還是給了新的孩童），似想以行動證

  明自己不再畏懼恐懼，然最終牠還是再敗給了魯蛇俱樂部一次。《牠 第二章》最為可惜

  的部分是，電影花了不少時間在醞釀、在鋪陳幾條感情線，卻忽略掉了其實也是很重要的

  恐懼源頭潘尼懷斯，觀眾對於牠的變化感受不到，雖然明白了牠的起源，可就會難免認為

  從古至今就始終無敵的牠、經一次失敗後是否就只會再重蹈覆徹？至少從首集到這集是這

  樣子的，兩集下來不過就是「牠對抗孩童時的魯蛇們」與「牠對抗長大後的魯蛇們」之差

  別而已。




  其實在看完《牠 第二章》有回家稍微查了一下資料，畢竟對史蒂芬金所寫的故事所知甚

  少，認為有些資訊還是必須了解。原著的《牠》似乎是和他筆下另一部經典作品《黑塔》

  有所連結，在首集最後魯蛇俱樂部在對抗潘尼懷斯時，於《黑塔》裡力量最為強大的光束

  支撐者之一的守護者烏龜出現在靈魂出竅的比利意識中，向他透露著潘尼懷斯的來歷，進

  而協助他們靠意志力與想像力擊敗牠，不過電影版卻省去這段，讓《牠》個別獨立出來，

  成為一個即便沒看過原著和其他作品的觀眾也能夠觀賞的作品，但安迪馬希堤導演還是多

  少有些暗示兩者之間的關聯（例如烏龜雕像或是烏龜樂高），只不過就算沒注意到也影響

  不大。另外原本負責帶出潘尼懷斯和德利鎮的關聯與歷史的麥可，在《牠》裡把這項工作

  交給了班，但到了這次的《牠 第二章》裡他就接了回來，像原著一樣長大後留在了德利

  鎮，在圖書館工作、將長大後的魯蛇俱樂部成員集結起來，守住承諾再一次面對潘尼懷斯

  。


  「只要你相信就可以。」


  講到這邊就先進入到高潮部分、也就是結尾的地方。《牠 第二章》補充了許多首集尚未

  說清的空白，替觀眾解了不少惑，尤其是最讓人好奇的潘尼懷斯的來歷，在原著小說裡提

  到潘尼懷斯是從存在於我們宇宙以外的虛無次元，或者稱為死光的異域，牠的原型是光的

  綜合體，從數百萬年前就因偶發事件來到地球沉睡於地下水道，此後每27年甦醒一次，花

  費數月時間補食小孩後再度沉睡，這些都是小說裡提到的、魯蛇俱樂部成員透過古老族群

  的儀式所知道的關於牠的事，這儀式也是他們擊敗牠的關鍵，據悉牠的天敵烏龜（也就是

  進到比利意識中的那隻）就是在這儀式中出現的。而這些情節部分除了烏龜之外，在電影

  中以有限的篇幅交代了，做為唯一留在德利鎮的人，麥可發現了許多事情，更意外知曉過

  去曾有一支古老族群進行過一場儀式封印了潘尼懷斯，他告訴眾人這件事情，讓他們深信

  他們也可以如法炮製擊敗牠，當然後來事實證明他為了讓眾人留下來隱藏了最重要的儀式

  結果，然有了此設定安排，「相信」二字就起了更大的作用，給予觀眾的感受（說服力）

  更強烈。




  《牠 第二章》最好看的部分就在於孩童時期的魯蛇們與長大後的魯蛇們跨時空的對手戲

  ，兩時空的相互穿插行進劇情能同時讓人回味過去與體驗現在，也讓這些經過兩年時間快

  被忘記的魯蛇們的樣子再度鮮明且深刻了起來，在首集中正處曖昧的感情線也在這集中有

  了結果，貝芙莉情歸何處不算意外，但最驚訝的就是首集沒有太多著墨與線索的瑞奇，他

  不只是同性戀者，更從孩童時期就暗戀著艾迪，這點倒是讓我滿意外的。回到前面講的，

  兩時空相互穿插的方式固然增添了可看性與豐富度，卻因為導演花了不少在做鋪陳，幾乎

  每位魯蛇們都分到了十至十五分鐘的時間，一連多位看下來難免有些麻木疲乏，你說首集

  不也是有拍出潘尼懷斯襲擊每個人的部分？可這次在處理上就沒有首集來得嚇人，反而還

  有點溫和，當然因為這次著重在於情感描繪，嚇人力道減輕有所難免，孩童時期與長大後

  害怕的恐懼不同之變化也是有趣，只是當節奏沒有那麼緊湊的時候，於觀影上就成了一種

  視覺疲勞。


  至於最嚇人的片段我認為是落在於鏡迷宮內，潘尼懷斯不停用頭撞著鏡子，一直撞一直撞

  一直撞，接著撞破之後直接一口咬爆小男孩的這場戲，排在這後面的是最前面小女孩的部

  分，牠數了一二後彷彿被按下暫停鍵，直到小女孩開口說了三才繼續播放，看著牠隨著數

  數頭部逐漸變大、面部歪曲，整體感還滿駭人的。而被拿在預告片使用的裸體奶奶，放到

  了正片反而沒那麼嚇人，簡之我自己認為《牠 第二章》是沒有比《牠》來得驚悚嚇人，

  整體而言就像前面提到的，新鮮感沒有從首集延續下來，很多首集的影子（招數）於其中

  ，加上前半段近一小時時間節奏拖沓使人倦，效果與力度很自然的就會減低。


  另外一點是，跟著魯蛇們還有潘尼懷斯回來的，還有首集那位霸凌者、也就是殺掉自己父

  親、被潘尼懷斯控制住的鮑爾，在這集裡他像是又被潘尼懷斯操弄著，要他回去尋找魯蛇

  們復仇，說實在話我不認為他有回歸的必要，至少就電影版本來看的話，他在這集的表現

  裡來看是可有可無的，就似個意外插曲，若沒發生也不會影響劇情發展，甚至說他也沒有

  幫到潘尼懷斯什麼忙，跟首集的他相比，這集的他比較像是跑龍套的存在。


  儘管《牠 第二章》在我這邊沒有超過首集，但還是得肯定演員們的表現，飾演潘尼懷斯

  的比爾史柯斯嘉再度帶給觀眾扭曲般的不協調感，從他身上散發危險又有趣的氣味，非常

  吸引人的演出。魯蛇俱樂部不管是孩童時期或是長大後的演員都是實力派，要同時展現並

  保留著自己與對方年紀的樣子，又不能有太過明顯的模仿，於這點上是很不容易的。


  在正片前有播放一段《安眠醫生》的預告，看完《牠》和《牠 第二章》後對於史蒂芬金

  創作功力深感佩服，會對他的文字世界感到好奇與著迷，很想一窺究竟他所說的故事，滿

  期待《安眠醫生》能像《牠》一樣精彩。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
