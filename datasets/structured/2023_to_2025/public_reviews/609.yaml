title: '[問片] 找爸爸還有黑魔法的女巫（有雷）'
content: '排班很怪請見諒

  是在飛機上看的，當時因為很累，所以只有看到片段

  是西洋片，沒有記錯的話是說英文


  女主角跟媽媽感情不好，一直記著她離家出走的爸爸

  後來決定要去找她爸爸

  就尋線找到一個很像日本的地方

  （很東方的風格）

  找到一個男人（亞洲人演的）

  拜託他開船去一個小島找她爸

  一開始東方男人拒絕，後來看到女主角要給他錢就答應了

  不幸路上遇到大雷雨

  後來女主角醒來就到島上了

  但是被當成奴隸

  之後女主角逃脫遇到她老爸

  結果後來還是被找到然後被威脅要去開一個機關好像是一個墓

  （只有女主角和她爸會開）

  裡面有一個女巫的棺材

  傳聞是會黑魔法的女巫

  女主角發現女巫應該是有傳染病的抗原

  而以前的村民沒有抗體，所以才把自己關進那個墓救大家

  然後之後不知道為甚麼展開了廝殺

  之後女主角老爸把墓給炸了


  我只記得這些片段，有沒有哪位有看過的人可以告訴我這是哪一部片？


  --'
