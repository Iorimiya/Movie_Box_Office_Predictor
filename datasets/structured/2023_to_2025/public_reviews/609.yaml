url: https://www.ptt.cc/bbs/movie/M.1483720829.A.5D8.html
title: '[好雷] 顛父人生：喜歡嗎？爸爸買給妳 '
content: '網誌版：



  想不想要名利雙收的機會？八面玲瓏的能力？或者累積可觀的財富？

  這些……我都買不起，但我能陪妳一段。










  (底下有雷)

  《即刻救援》地表最強老爸使出渾身解數，以其人之道還治其人之身，一路追緝歹徒，只

  為救出心愛的女兒。


  《顛父人生》父親溫弗瑞，是一位退休的鋼琴教師，副業喬裝易容是他的拿手好戲，逗弄

  大家，赤子之心展露無遺。然而面對愛犬一聲不響的驟逝，剩他一人蜷曲倒頭就睡的身影

  ，格外落寞，這時他才明白，在生命沙漏滴盡以前，愛要及時把握陪伴。


  女兒伊內絲，遠到羅馬尼亞工作，穿梭都會叢林，熟稔商場文化，力保工作飯碗，全天候

  盲目空轉，在人前豎立一座冰山，一板一眼，少了些人性的溫暖。


  快節奏緊繃如弦的生活，吞噬著父女相處的寶貴時間。

  因為心疼，他決定顛覆她的人生。


  伊內絲蠟燭雙頭燒，天秤的兩端一邊是神奇老爸，一邊是惱人工作，取得平衡談何容易。


  他出其不意造訪女兒日常，送上生日祝福，但伊內絲不太領情。

  他躋身名流聚會，只能一旁枯坐乾等，這是世間上最遙遠的距離。

  他改名「東尼‧厄德曼」佯裝身分是心靈導師，卻對自己親子關係漸行漸遠，有時感到失

  措無力。


  屢屢喚起女兒注意，過度關懷、玩笑開過了頭，弄巧成拙，凸顯父女情感間的掙扎與矛盾

  。然而父親這一切的付出，伊內絲都看在眼裡：


  離開時，他不忘關心腳趾的傷勢

  受到職場霸凌，他連聲放屁表示抗議

  裝扮保加利亞大毛怪造型，驅除內心惡靈，在裸體派對送上祝福


  原來這位不速之客已悄悄進駐在伊內絲的心裡。


  伊內絲由於父親的介入，她重新思考要什麼樣的生活，衣著上反映個性的延伸，過去服膺

  外在世俗的原則，注重體面重重束縛，到最後一絲不掛，豁出去勇於做自己。


  或許可以說《顛父人生》以家庭風暴來包裝，其實更藉由父女的衝突，交錯辯證，直探生

  活本質的意義。這趟旅途，以父之名溫弗瑞為她親身示範，彈奏生命的另一種可能，人生

  何其廣大，顛簸走著，無法昂然挺胸時，何不放緩腳步？結尾畫面伊內絲選擇裝戴假牙，

  重新拾起那純真的一抹微笑。


  喜歡嗎？爸爸無價買給妳，另一種玩味人生的情調。

  不管妳變成什麼模樣，家唯獨在妳身邊。


  《顛父人生》有幾幕真的很美：

  一幕是在祥和溫馨的復活節聚會，父女聯袂，一彈一唱，演繹Whitney Houston〈

  Greatest Love Of All〉，寄託普世父母對子女的一往情深，以及伊內絲壓抑許久的心聲

  ；另一幕是父女公園相擁之後，累癱的父親倒在地上，也許大毛怪面具底下，汗水以外，

  更多的是因愛而生的淚水。


  --'
