url: https://www.ptt.cc/bbs/movie/M.1533410964.A.EAB.html
title: '[好雷] (泰)兩個爸爸：正能量的全攻略 '
content: '圖文版 (附攻略解答)




  看完2016年泰國電影兩個爸爸後，悟淨真的

  只有下跪，簡直多元成家的全攻略。導演在

  劇中針對同志小孩的處境，提出了三大問：

  １．爸爸和媽媽有什麼不同；２．爹地和爸

  比是什麼關係；３．你們希望小孩也變成同

  志嗎？三個問題表面上看似在反同，但其實

  不然。看完這部電影，其中正能量滿滿滿，

  悟淨已經準備好隨時當爸了，哈哈哈。


  劇情主軸很簡單，就是一對同志戀人潘和裕

  克，領養了被生母拋棄的孤兒阿布。有一天

  也是孤兒出身的社工師登門拜訪，協助生母

  出現，引爆了潘內心最深的恐懼。後來，阿

  布回去跟母親同住一週，最終在學校父親節

  的慶祝會上，父子三人終於破鏡重圓。


  我覺得泰國文化真的非常有魅力，電影有衝

  突，但卻沒有壞人，光是這一點就制霸全亞

  洲了。兩個爸爸最大的衝突，就是阿布想要

  媽媽，這是阿布親口說的，儘管也有可能是

  隨口說的。但社工師說得很好：「或許他（

  阿布）不想當個特別的孩子？」


  只要是生不出來的，領養孩子的父母，都會

  面對這個問題。這考驗父母對小孩的愛是否

  為真。所以社工師既然幫忙找到了生母，讓

  阿布回去跟生母相處一兩個禮拜，像做實驗

  那樣，是讓小孩自我成長的一個重要經驗。


  但是這部戲最可愛的地方，就在於每個角色

  也都有他致命的弱點。以社工師來說，裕克

  無禮地跑到人家辦公室，罵她的話即為佐證

  ：「你想成為映照出別人痛苦的鏡子，卻沒

  照照愛管閒事的自己！」第一句正中紅心，

  第二句則為謾罵。


  編劇用極其犀利的筆鋒，寫出了無關挺同反

  同的人性共通點。至理名言，每個人都有痛

  苦，但沒有人會喜歡被映照出來。然而，潘

  和裕克偉大的地方在於，有辦法接受自己的

  錯誤：剝奪了阿布擁有媽媽的機會。這是阿

  布能不能充滿善良和愛長大的重要關鍵。


  當然，電影是電影，現實是現實。一旦同志

  小孩被生母帶回，這個社會會如何剝奪同志

  家長的權益，我們可想而知；但是同志家長

  們也不要失去信心，因為決勝負的關鍵從來

  就是真愛，而真愛無關乎性別。


  兩個爸爸的另一個精彩之處，是對社會無處

  不在的恐同(homophibia)，做出溫柔而深刻

  的價值判斷，卻沒有多餘的是是非非，這點

  非常高竿。顯而易見的像是一開始胖弟父子

  檔，成天就罵是人家帥哥夫夫是變態，簡直

  歧視加歹家教。其二是阿布去跟媽媽試住後

  ，因為好奇掀女老師裙子，結果媽媽的老公

  就說，真不知道那對同性戀是怎麼教的。但

  最深刻的是潘，在生母出現之後，完全陷入

  了自我懷疑，最終導致家庭瀕臨崩潰。再再

  都說明恐同一日不除，社會一日不安。所以

  ，婚姻平權真的要快點通過。因為法律與社

  會本是互相形塑的。


  Gagagoolala的字幕翻譯組把社工師的服務

  單位翻譯成「守護下一代幸福聯盟」其實是

  一步險棋。因為社工師的表現出人意表，但

  據我所知，台灣的好像不是這樣。所以，建

  議下次翻譯組可以照原文翻，也讓我們更了

  解泰國社會的現況。


  最後我還是想說說這部片的侷限。結婚養育

  小孩如果是人權，當然不該分性別。可是電

  影中的同志家長都超帥的，也算有錢，所以

  說服力真的強了很多。但如果是中低階層的

  一般同志家長，或許會犯下更多顯而易見的

  錯，但悟淨希望這個社會終有一天，會知道

  如何傾全部的力量，幫助他們變得更好，一

  如我們給予異性戀父母的那樣。



  --'
