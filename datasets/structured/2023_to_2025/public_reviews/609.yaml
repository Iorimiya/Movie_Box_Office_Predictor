url: https://www.ptt.cc/bbs/movie/M.1756729618.A.7EB.html
title: '[普雷] 我的殺手爸爸'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~














  she rides shotgun又翻成我的殺手爸爸

  實際上小女孩爸爸就不是殺手...


  shotgun還有副駕駛座的意思 (shotgun seat)

  我個人還是不喜歡這種片名翻譯


  再來前中段

  爸爸與小女孩的情緣跟互動還蠻不錯的


  只是中後段警察內部矛盾跟後來的槍戰

  我真的就沒有認真看了 感覺拖戲











  前段逃亡時搭配denver luna真的很有fu



  我是很希望這是一部好看的公路片

  但是導演整個又要添加些警匪內容


  說真的 如果沒有槍戰也沒差啊

  整部片就是在看父女倆人的演技以及互動而已


  後來的劇本橋段真的有夠好猜

  但是後面硬扯要拖的支線

  就感覺很無意義


  說真的 就跟小女孩無關啊

  不然前中段兩人逃亡的部分真的還不錯






















  --





  --'
