url: https://www.ptt.cc/bbs/movie/M.1565371391.A.236.html
title: 'Re: [討論] 寄生上流爸爸疑問？（雷）'
content: "爸爸不出來這件事這個劇情\n其實是一個象徵 你不能用邏輯性的想法去檢視他\n\n地下室跟住在地下室那種蟑螂般的生活環境\n其實就是象徵社會低下階級與其生活方式\n\
  \n而爸爸不出來\n也就是在象徵低下階級的人 即使用盡心機想往上爬\n骨子裡也從來不被真正的上流階級當人看\n\n而在被整個階級拒絕後\n引發的憤怒(拿刀殺了老闆)及\n\
  對階級的拒絕和自我放棄\n(同樣是地下室 卻放棄了能夠掌握自我主體性的家 卻選擇寄生在地下室不出來)\n\n\n這其實前面就有鋪陳\n一家人的心態裡 就只有爸爸的最隨遇而安\n\
  (可能是幾次人生計劃都失敗後看開了 不這樣活不下去)\n\n這樣的心態其實就是面對失敗的某種自我防禦機制\n最後會走到這種自我放棄的結果並不太意外\n\n\n\
  看了版上心得文 有人抱怨這部片對單一角色的內部刻劃偏少\n\n其實與其說是導演營造角色能力不佳\n倒不如說導演本來就選擇要用象徵的方式營造角色 去隱喻整個制度上的問題\n\
  這部視為劇情更貼近現實版的末日列車 亦無不可\n\n真的想看導演營造角色的能力\n可以去看隱喻最少的殺人回憶 並沒有差到哪去的\n\n\n\n說來感慨\n即使就算是寄生上流\
  \ 片子前期的種種機關算盡\n也算是某種意圖上進奮發的作為\n\n幾十年前 社會上的普遍價值觀 還是\"我們窮要窮得有骨氣!\"\n\n隨著經濟發展 貧富差距拉大\n\
  寄生上流的這種價值觀 也漸漸作為一種無奈的現實被普羅大眾所接受了\n\n同樣都是寫底層階級\n\n大佛寫的\n是無力亦無知的識盲 訴諸於情感指控與對人性的凜然諷刺\n\
  \n寄生寫的\n卻是有能力卻苦於身分環境的階級受害者\n檢討的是制度面的東西\n\n兩者參照來看 別有一番趣味\n\n\n--\n  可是哈卜拉姆再聰明、再有學問，有一件事卻是他不能解答的，因為包羅萬有的「可蘭\n\
  經」上也沒有答案；如果你深深愛著的人，卻深深的愛上了別人，有甚麼法子？\n  白馬帶著她一步步的回到中原。白馬已經老了，只能慢慢的走，但終是能回到中原的。\n\
  江南有楊柳、桃花，有燕子、金魚……漢人中有的是英俊勇武的少年，倜儻瀟灑的少年…\n 但這個美麗的姑娘就像古高昌國人那樣固執：「那都是很好很好的，可是我偏不喜歡。」\n\
  \                                                         金庸<白馬嘯西風>(完)\n\n--\n\n\
  原來捏著鼻子嫌人家身上有股味道是就事論事啊 (笑\n\n\n這家人有的能力很多啊\n\n爸爸開車能力長年累積下來一流 高速轉彎穩定到水不會灑出來\n媽媽比較少描述到\n\
  兒子教人英文一開始就教你應考方式 算是因材施教\n女兒藝術天分有強 偽造文書OK 帶小孩也有一套\n\n問題是他們明明這麼有才\n(比起來 貴婦太太有甚麼能力嗎?)\n\
  卻因為制度缺陷 而導致必須要陷害欺騙才能過上比較像話的日子\n\n\n\n這跟加班費增不增加有甚麼關係?"
