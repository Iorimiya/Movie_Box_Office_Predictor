url: https://www.ptt.cc/bbs/movie/M.1565433204.A.E69.html
title: 'Re: [討論] 寄生上流爸爸疑問？（雷）'
content: '很簡單啊，我講我對人物的理解給你聽


  爸爸個性上毫無計畫性、遇事情優先逃避而且優柔寡斷、自尊很高


  他越靠近社長一家，就自以為他不一樣了。最讓我覺得可疑的就是


  為何舉發前管家，安慰社長夫人是握人家手???


  那個起手式怎麼看都不是想後來那樣發展吧


  一看就知道兒子有真傳，都從手開始


  還整天問社長是不是很愛他老婆，這個問題問兩次。


  社長跟老婆客廳恩愛，還給爸爸臉特寫呢!


  我覺得爸爸想要的是當社長那個位置，連老婆都換了。




  你不能被電影宣傳廣告給騙了，先入為主認定這是貧富差距之類的，


  在我看來這是一個靠詐騙跟陷害的家庭，最終受到報應。


  爸爸呢，如上述；


  兒子則是好友一方面想鞏固自己愛情一方面帶一下自己朋友，結果搶朋友地


  女兒就做事霸道點，連爸爸問問題都還是務實的回答，整體最有用


  媽媽就普通人，只略輸女兒，畢竟不會P圖


  一家人整天想發財，用人家家裡來享受，人家大學生都知道先留學再把妹好嗎。


  網友最常講的住半地下室阿，我可以理解為何不用河邊遊民家庭，這樣電影下雨就沒了。


  只是半地下室會跟住山上豪宅的人做比較，沒說服力。君不見下雨時，住平地鄰居也勺水


  最後捅社長我也是千萬個不解，一台車能救女兒+社長兒子，捅人是獻祭求上蒼保佑嗎?


  自己女兒猛出血，兒子有情人背就算了，遽然最氣社長嫌棄地下室味道?!


  媽媽都狂戰士化親手了結對手，爸爸遽然放下滿身血的女兒，去為自己的自尊一搏。


  好片阿，配上南投8+9開槍射人還PO IG嗆人作怪遲早吃一顆，生活就在電影身邊，嘖嘖。


  --'
