url: https://www.ptt.cc/bbs/movie/M.1568779311.A.55B.html
title: '[好雷] 《小島來了陌生爸爸》重新發現勇氣的重要'
content: '【影評】《小島來了陌生爸爸》重新發現勇氣的重要，孩子們的夏天奇幻之旅


  來自荷蘭的《小島來了陌生爸爸》(My Extraordinary Summer with Tess)，改編自全球

  知名暢銷童書，今年於柏林影展大獲好評，奪下「新生代單元」國際評審團傑出獎、紐約

  國際兒童電影節最佳長片！電影從孩子的視角出發，聚焦在山姆與泰絲兩人身上。



  「你覺得最後一隻恐龍滅亡時，知道自己是最後一隻嗎？」




  10 歲的山姆總喜歡問些沒有答案的問題，大人眼中看來無厘頭，對他卻是天大的事。身

  為家中年紀最小的成員，山姆認為等其他人都過世了，他一定會被留下，成為最後一隻「

  恐龍」！為了避免未來獨自一人的孤單，他開始「獨處訓練」，相信熟能生巧，最後一定

  能習慣面對孤獨。


  一家人來到荷蘭北方小島度假，山姆因緣際會認識了泰絲。泰絲的煩惱是沒有見過爸爸，

  為了與父親相認她找出媽媽剪貼簿上的名字，上臉書一個一個搜尋，並以「抽中免費民宿

  」的名義把從不知道自己存在的爸爸拐來小島，但爸爸居然已經有了一個女友？泰絲要求

  山姆幫助，一步一步認識自己的父親。


  兩個 10 歲出頭的孩子、兩個連大人都嫌困難的問題，他們要花暑假一個禮拜，在這小島

  上完美解決！正是從小孩的觀點切入，他們不明白「艱難」是什麼，相信只要去做就能辦

  到，義無反顧地勇往直前，比許多成年人都更無畏，故事才有了轉機。


  山姆的獨處練習時間越來越長，四個小時、六個小時不停地進行，為此他拒絕了與家人去

  打保齡球、泰絲的邀約，就為了練習孤單。一次海灘驚險，身旁無人可求援，山姆驚覺雖

  然我是年紀最小的，但該不會是最早死的吧？所幸被獨居的拾荒老人救起，老人自從喪妻

  後就一個人住在海邊小屋。山姆問：你怎麼能撐過這麼長、被遺留下來的日子？老人笑了

  ，回答他：因為我有回憶陪伴。



  「你必須盡可能地收集回憶，越多越好。」


  如果把所有時間都拿來練習孤獨，那等到只剩下一個人的時候，還有什麼留下、支持我們

  度過漫漫長日？就算對孤單的生活習以為常，也是空洞無物。山姆終於瞭解，珍惜現在的

  日子、陪伴家人朋友，把眼前的一切記在腦中，留下美好的回憶才能真正面對孤獨。


  泰絲恐懼自己的爸爸知道真相後會不想要他，也害怕他其實不如自己想像的一樣好。她準

  備了野餐、尋寶活動來親近爸爸，隨著相處時間增長，離別的時刻也悄悄到來，泰絲終於

  下定決心要告訴爸爸事實，但他一句玩笑話：「還好我沒有小孩」卻狠狠傷了泰絲的心，

  證實她最深的恐懼。難過之下泰絲決定不與父親相認，山姆為了不讓她後悔、失去留下「

  回憶」的機會衝去找泰絲的爸爸解釋。


  「爸爸該長什麼樣子？」山姆看著自己的爸爸，思考如果我從不曾見過他，那是什麼感覺

  ？泰絲既害怕認清父親的樣貌會破壞想像，更害怕爸爸不肯接受她，雖然抱持滿滿不安，

  她還是努力地調查資料、安排計畫去踏出第一步。「如果只剩我一個人該怎辦？」山姆擔

  心家人都死了，被遺留的自己無法適應接下來的生活，於是他絞盡腦汁想出「獨處訓練」

  。兩個孩子面對生命中的難題不是逃避、得過且過，而是用盡全力想方設法面對，充滿童

  趣的舉動，展現最真誠的勇敢。


  導演史帝芬沃特路德 (Steven Wouterlood) 不僅入選 2019《VARIETY》歐洲十大焦點影

  人，更曾拍攝過許多兒童短片，首部長片主題依舊選擇從小孩出發，透過兩個大人眼中的

  「怪」小孩，帶領我們理解小孩不怪，他們其實更認真地面對這個世界，也再一次發現了

  勇氣的重要。


  轉載來源：

  －－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－

  心得：看完後會很想去荷蘭觀光，而陌生老人與山姆的爸爸兩者對比也蠻有意思的！


  作者粉專,寫些電影書籍等生活：



  --


  可能因為有先出書,很多親子專家等去看特映

  大大的文也很詳細!!'
