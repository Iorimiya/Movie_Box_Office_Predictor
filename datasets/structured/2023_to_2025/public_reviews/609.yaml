title: '[問片] 一個爸爸大約3-5歲兒子生病送醫後死亡'
content: '如題，然後這爸爸因為怨恨而有計劃的殺了相關的醫生等等的人。


  我媽現在在看「進擊的鼓手」，他說J.K.西蒙斯都演偏激類型，她看過一部片；


  就是本文想請教的內容，說是西蒙斯大叔演的。


  我聽了有點興趣，於是查了該演員的作品。


  但目前我找不太到，沒有符合的




  有可能是我媽認錯人或是劇情有落差（我媽就是一般婦人，講話常憑印象會誇大加油添醋

  的那種，但某些點記憶力強）


  不過還是想問問有無接近的片子，謝謝。



  --'
