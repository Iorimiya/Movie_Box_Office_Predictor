title: '[問片] 一部爸爸與學校老師外遇的電影(有雷)'
content: '劇情敘述：爸爸原本是不修邊幅，隨性自在的人。但在外遇後，整天都很在意自己的打扮

  ，媽媽傻乎乎的只是覺得奇怪，沒發現老公其實已經跟學校女老師有外遇，而發現外遇的

  人是他們的女兒，女兒某天去學校拿東西發現…


  電影的剛開始是個完美家庭，爸爸原先計劃全家乘一艘帆船出遊，但外遇之後就擱置不理

  …結局是：一陣突如其來的大風將帆船吹毀…也好像有人趁機放火把它燒了(因為有點久

