title: '[好雷] 一首搖滾上月球－罕病兒爸爸們的ROCK!'
content: '很久前就想分享的紀錄片，

  很值得對生活感到缺乏熱情的人觀賞。



  無音樂好讀圖文版



  六位家有罕病兒的爸爸們組成的睏熊霸樂團，

  締造令人感動的佳績！

  片長：115分（上映時間：2013/10）


  《一首搖滾上月球》是部非常特別的紀錄片，

  ２０１３年上映後，吸引了不少影友一再入場觀賞，

  迄今仍在部分二輪電影院播放，並不時有企業包場觀賞，足見其感動廣大影迷之深。




  本片由台北電影獎最佳紀錄片導演黃嘉俊（黑糖導演）

  以近六年的時間拍攝完成，

  獲得2013年台北電影節的觀眾票選獎。

  本片記錄的是六位家有罕見疾病孩子的父親：

  鼓手「勇爸」、Keyboard手「巫爸」、吉他手「李爸」、貝斯手「鄭爸」、

  薩克斯風手「潘爸」及主唱「歐陽爸」，所組成的一支業餘搖滾樂團「睏熊霸」

  －－以臺語發音的逗趣團名，

  傳遞的卻是他們對睡眠極度缺乏、事實上怎麼也睡不飽的自嘲。

  六位老爸的背景經歷、身分職業截然不同，

  唯一共同點是家中都有罕見疾病的孩子，永遠吃不飽的小胖威利症、

  尼曼匹克症Ｃ型、結節硬化症、腎上腺腦白質失養症、平腦症、血小板無力症－－

  幾乎都是你我不曾聽聞過的稀罕疾病，治療與復健困難重重，

  甚至只能延緩而無從治癒……


  紀錄片裡忠實地呈現了罕病兒漸漸退化的過程、無法自理生活的失能狀態，

  身為家人，日日夜夜重覆著提供一切協助是必須的；

  面對那些生命的艱鉅考驗，光是看著就鼻酸，

  更遑論想像若是自己的家人，你能為他們付出多少？

  看不見的社會邊緣有多少人因此拋棄家庭、躲開負荷，甚至不堪承受而走上絕路，

  看過這部電影，你一定能對這些特殊家庭更體諒、更溫柔一點。



  這部紀錄片出於黑糖導演在罕見疾病基金會的義工經驗，

  及其後得知一位罕病兒父親在兒一死一病危時選擇了自殺，大大撼動了他。

  父系社會向來不允許男人軟弱，身為一家之主不能喊累，

  更必須擔起所有的苦翼護家人；六位老爸背負著甜蜜卻極其巨大的負荷，

  非得聚在一起藉由音樂這個出口宣洩情緒、出走到月球，以防崩潰。


  黑糖導演邀請到「四分衛」樂團主唱陳如山（阿山）擔任指導，

  帶著這群平均年齡超過五十的老爸們每週撥出兩小時一起練團；

  搖滾樂的熱情奔放引領他們短暫逃離現實，

  大大喘口氣的同時，也試圖挑戰2012年海洋音樂祭以圓老爸們年少時的樂團夢。




  乍聽之下，每週練團一次且僅是短短兩個小時似乎沒什麼，

  然這六位老爸裡，有的得身兼母職、有的家裡不止一個罕病兒，

  練團的時光是多麼奢侈－－這表示其他家人必須扛下他負責的那一份工作，

  因此，沒有家人的愛與包容、支持，樂團夢絕對無法完成。

  紀錄片中關注的是老爸們，也是罕病兒家人們的互動，煎熬與辛苦都由全家人共同承擔，

  陪伴者的堅強與韌性非得更加倍，才足以支撐罕病的孩子。

  特別令人感動的是，黑糖導演在拍攝過程中儼然已融入每個家庭成為一份子，

  在緊急狀態中，罕病家庭對他的信任與他及時的回應、支援，

  在在顯示導演對本片最真誠的看重。


  雖然本片承載的是沉重的生命課題，令你不得不消耗大量面紙藏匿眼淚，

  導演卻也拍出了老爸們用他們的生命態度傳遞正向能量，

  讓人為他們的親情動容，也看見父母的無私與犧牲可以多麼沒有極限；

  在那之後，更不禁深思關於人生重要的事、對孩子的期望，

  不再是好的學校、好的成績或成就，

  珍惜擁有、讓心柔軟，「身體健康」的小小心願原來竟一點也不平凡。


  《一首搖滾上月球》藉由音樂、藉由支持團體，

  讓人從絕望中仍看見盼望的光，以愛譜出最美的生命樂章，值得影友們細細品味。


  --

  每天都要在心裡放一首歌，

  很老的也沒關係，因為音符，永遠年輕；



  --'
