title: '[問片] 聖誕節 黑人爸爸 紐約'
content: '請問一部美國電影，應該是2000年後拍的戀愛電影


  劇情是一個黑人單親爸爸跟女生約會的電影（女生不是紐約人，忘記是外國還是美國其他

  城市的人）


  有一幕是晚上單親爸爸在他紐約家的窗戶前（窗外好像是紐約的大聖誕樹），抱著他女兒

  唱著”can’t take my eyes off you”( I love you baby,and if it’s quite all ri

  ght,I need you baby…)


  結局是後來那個女生搬過來紐約跟單親爸爸住，從此過著幸福快樂的日子



  請問廣大鄉民知道這是什麼電影嗎？


