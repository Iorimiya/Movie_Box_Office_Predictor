url: https://www.ptt.cc/bbs/movie/M.1565362514.A.6B8.html
title: '[討論] 寄生上流爸爸一定出不來嗎？（雷）'
content: '以下有內容
































  覺的出不來很弔詭，

  1.爸爸可以趁人都出去了，偷躲躲過保全跑出來不行嗎？比如媽媽已出國，主角等爸爸一

  起偷渡出國

  2.坐牢比躲在裡面好吧，有飯吃，無期也能假釋提前會被判死刑嗎？或設法裝病逃獄？

  3.主角可以裝是宗教驅魔，必須關燈和監視器

  4.調查在那個宅子的管家人員，威脅脅迫他協助偷渡出來


  感覺有很多方式阿，爸爸不需要一定在地下室活著


  --

  如果爸爸出來

  是不是就也沒那麼戲劇張力性

  不會欸

  這種貴婦我真的有認識這種人

