url: https://www.ptt.cc/bbs/movie/M.1552276292.A.415.html
title: '[ 好雷] 惹惱地方爸爸沒有好下場-酷寒殺手'
content: '或許是前一天晚上被罵到很厭世，


  心情不理想又影響到隔天，


  只好臨時在威秀找了部爽片看看，


  於是挑上了酷寒殺手，


  希望會有好心情。






  —————防雷線—————-



  這部真令我笑開懷的爽片，在暴力充斥下，我心中壓力被舒壓，尤其是丟屍體在河邊那邊

  ，放這麼輕鬆和諧音樂，這麼反差萌，是要逼死誰；還有愛斯基摩為什麼是黑人；以及他

  弟弟的老婆，這些都是讓我現在想到還是會發笑的點。





  電影裡頭場景真的讓我很驚艷，雪山景色真的好漂亮，想起我去美國優勝美地國家公園的

  美景，真的會讓人心動想去朝聖看看。

  而配樂，我也很喜歡，雖然我分不出什麼什麼古典樂，但我聽起來蠻舒服的，有助於我舒

  壓效果？





  其實也別小看這電影，裡頭也有強調同志議題，也別讓同志朋友不開心，以免被出賣？再

  來就是小孩教育的問題，我真的覺得維京他把小孩教很好，才會如此優秀，且對於小孩教

  育真的很講究，相較台灣....





  然而令我印象深刻的點，是一群印地安人在飯店旅客的反應，不知道大家有沒有注意到有

  一個人，戴著口罩拿紅酒杯喝酒，雖然只有一瞬間，但我在想著怎麼這麼惡趣味XD






  對了！影片最後運用名字消去方式，來表達死亡順序，蠻有趣的，而最後那一個人死的怎

  麼這麼母湯XD


  --'
