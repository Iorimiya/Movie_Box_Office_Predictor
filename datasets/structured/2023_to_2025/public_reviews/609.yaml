url: https://www.ptt.cc/bbs/movie/M.1470636745.A.464.html
title: '[片單] 父親節片單-5位好爸爸讓您安心入睡'
content: "網頁版文章：\n\n\n\n\n\n生命因你而精采！五部沒有你萬萬不能的偉大父愛電影\n\n撰稿者：PONY WORLD\n\n\n\n愛，無遠弗屆，也沒有任何限制。有時只要一個輕微舉動，一個眼神交流，這份愛變能傳\n\
  \n遞。而愛，也不只留在僅講述溫情的電影之中，它可以藏於外表剛強之中，進而成為調劑\n\n電影的柔情潤滑劑。以下，介紹五部不同類型電影裡所蘊含的偉大父愛：\n\n\
  \n\n\n\n《即刻救援》系列 （Taken, 2008 - 2014）\n類型：動作、驚悚\n\n\n\n好爸爸代表：連恩‧尼遜 Liam Nesson\n\
  \n\n\n不管你受到如此對待，總有一位爸爸願意為你飛天遁地、上天下海，那就是「地表最強老\n\n爸」布萊恩·米爾斯（連恩‧尼遜飾）。在《即刻救援》系列三部曲中，連恩尼遜總用般\n\
  \n鋼鐵般的意志，不苟言笑的面容，單單以他193公分高的身長與身手，一路過關斬將，只\n\n為見到他心愛的妻女。從巴黎、伊斯坦堡到洛杉磯，這位地表最強老爸彷若吃了超能丸讓\n\
  \n自己能量爆發，但他卻什麼都沒吃，而這能量反而是因為親情推進著他向前。不論自己會\n\n如何，也要親手緊緊擁抱著身邊唯一的親人們，而這，就是偉大的父愛。\n\n\
  \n\n\n\n\n\n\n\n《世界末日》（Armageddon, 1998）\n\n類型：動作、冒險、科幻\n\n\n\n好爸爸代表：布魯斯‧威利 Bruce\
  \ Willis\n\n\n\n世界末日將至，身為太空人的哈利·史坦伯（布魯斯‧威利飾）需要帶著他的團隊與夥伴\n\n，去解救地球存亡的危機，然而在看似末日宇宙題材的電影下，《世界末日》卻滿溢著濃\n\
  \n厚的情感，關乎手足的失去、親人的聚少離多，而時間也正慢慢不停流逝。直至面對關鍵\n\n抉擇時，這位老爸除了願為女兒的終身幸福而犧牲，也不捨兄弟手足再次失去，更願意為\n\
  \n這顆地球留下值得延續的生命。而他的作為不再只是屬於一人的父親，而是為了在地球上\n\n的所有生命，說他是地球之父一點也不為過。\n\n\n\n此刻，手一推，門一闔，潸然淚下。這份愛，雖僅一牆之隔，但卻重如泰山。\n\
  \n\n\n\n\n\n\n\n\n《鋼鐵擂台》（Real Steel, 2011）\n\n類型：動作、劇情、科幻\n\n\n\n好爸爸代表：休‧傑克曼 Hugh\
  \ Jackman\n\n\n\n\n\n2020年，機器人拳擊當道，身為前拳擊運動員的父親，因人類逐漸被機器取代，加上自身\n\n好勝爛賭的個性，而負債累累。在金錢困乏、維生工具被拆解之下，父親不得已從貪念之\n\
  \n始來換取照顧兒子三個月，而一場父子之旅也正式展開。\n\n\n\n在幾經波折與名聲讚譽後，兩人如願進職業聯盟與宙斯爭鬥。賽後兒子和亞當雖然輸了比\n\n賽，但父親最想要教導兒子的是，勝負不是一切，最重要的是過程。就像這台舊款機器人\n\
  \n，在還沒實戰下不知道它的潛能，透過模仿、磨合與學習，亞當逐漸地成為一台具有性能\n\n的機器人；而父親也不知道除了自身實戰下，自己也有另一條出路，更慢慢學會如何成為\n\
  \n一位好父親，兒子更在當中享受到付出的樂趣與父親的關愛。也正如最後的結果，雖輸了\n\n比賽，但亞當卻贏得了尊嚴與名聲，也成為為人推崇的「全民冠軍」！\n\n\
  \n\n兩父子的《鋼鐵擂台》也不再只有拳擊與輸贏，而是透過互動與了解，擦出不一樣的親情\n\n火花。\n\n\n\n\n\n\n\n\n\n《明天過後》（The\
  \ Day After Tomorrow, 2004）\n\n類型：動作、冒險、科幻\n\n\n\n好爸爸代表：丹尼斯‧奎德 Dennis Quaid\n\n\n\
  \n當冰雪風暴來襲，世界末日將至，生命可能將面臨結束的一刻，卻被困在原處不能與最親\n\n愛的家人相聚，亦不能修補災難前的冰雪僵持，卻希望用這微薄的愛融化世界苦難與父子\n\
  \n冰山。說起近年災難片代表，《明天過後》可以是會被影迷所提及的一部，它探討著地球\n\n暖化問題，但也深及人情層面的暖情，當一人能力有限之下，如何發揮最大力量拯救一個\n\
  \n關乎全體性命的地球。在風暴過後，父子心中的冰山也慢慢如大氣層一般逐漸清澈，被親\n\n情融化成水流淌於心中，彼此不再有隔閡，等待他們的正是未來美好的生活。\n\
  \n\n\n《明天過後》是新地球重生的一天，也是父子倆重新認識的起點。今天開始，這份愛也將\n\n更加緊密契合。\n\n\n\n\n\n\n\n\n\n《大智若魚》（Big\
  \ Fish, 2003）\n\n類型：冒險、劇情、奇幻\n\n\n\n好爸爸代表：伊旺‧麥奎格Ewan McGregor (青年)、亞伯特‧芬尼Albert\
  \ Finney (老年)\n\n\n\n「這個小鎮容不下我的雄心壯志」\n\n\n\n當一次又一次的故事層遞，原以為是父親的誇大其口，到頭來卻是一個真實的世界，從童\n\
  \n話故事的背後進而隱喻親情，也從世界的千奇百怪，都本是大眾難以相信之事，但親眼目\n\n睹這一切，回到自己身上時，卻是一種單純的美好。\n\n\n\n父親對兒子說：「如果原本無聊的事，不經過包裝，你會聽嗎？」\n\
  \n\n\n往往的一切雖不真實，但也往往是最意義深遠的。從故事開始，到自己成為故事的一部分\n\n，從一條大魚，到最後自己成為那一條魚。再多浮誇虛榮的背後只是讓生命更為精彩，何\n\
  \n況所有就是真實發生的，而孩子從中更能體會父親的教誨，不要拘泥安逸，勇敢地邁向挑\n\n戰，放眼世界。\n\n\n\n「這是我的生命故事，因它們而精彩」\n\n\
  \n\n最終，電影回到了反思的源頭，人生就像冒險也像童話，最後變回了一條大魚，永存於故\n\n事中，靈魂也永不死。\n\n\n\n\n\n或許有時他們不擅長言詞，但卻往往一舉一動都是為了身邊愛人所做，這份愛不多不少，\n\
  \n就是這麼的剛剛好，滿足且溫暖！\n\n\n\n\n\n\n--\n\n===================== power by =====================\n\
  \           幕迷影評 \n    臉書粉絲頁 \n====================================================\n\
  \n--"
