url: https://www.ptt.cc/bbs/movie/M.1636575616.A.71D.html
title: '[普好雷] 人肉搜索 - 我是你爸爸'
content: '大家好

  我是專看恐怖片的LittleDiDi

  今天要來聊的是被蠻多人推爆的《人肉搜索》

  電影客觀而言確實是不錯

  只是我比較無感

  看電影本來就是很主觀的


  Blog圖文版會更精彩




  年份：2018


  語系：English


  類型：劇情、懸疑、推理


  導演：Aneesh Chaganty


  [劇情簡介]


  電影描述，一名父親(周約翰 飾演)在其16歲女兒離奇失蹤後，登入女兒的電腦試圖透過

  臉書、Instagram與信箱等記錄的蛛絲馬跡來拼湊真相。沒想到在搜尋的過程他卻意外發

  現許多女兒不為人知的一面，這才驚覺她早已和自己所認知的模樣相差甚遠，整體失蹤案

  件亦曝光在社會及社群的高度關注中…然而就在警方調查毫無進展、看似走投無路之際，

  傷心欲絕的父親也發現越來越多可疑證據，他該如何才能憑藉網路科技的力量找出真兇、

  挽救即將失去的一切呢？


  (以上引用自開眼電影網)


  --


  趁著週末找了這部蠻多人推薦的《人肉搜索》來看看，就內容來說確實是不錯，特殊的拍

  攝手法，有細節的鋪陳與扎實的推理，還能參雜點親情方面的營造與網路亂象的批判等，

  結局意外性也還行，在同類型的電影來說，確實是無可挑剔的傑作。


  不過，也正如我剛所說的，同類型無對手，但要迎合所有觀眾就不好說了，如果不能接受

  全程看著畫面照著電腦螢幕，那可能就會覺得很無聊，況且對我一個恐怖片看太多的人來

  說，本片確實是清淡了點。


  --


  簡單描述劇情，是說大衛一家三口原本幸福和樂，奈何妻子卻因病驟然離世，大衛只好身

  兼母職，對女兒的照顧也算是無微不至。但隨著女兒越來越長大，大衛跟女兒的的相處似

  乎也越來越有隔閡。


  某天，女兒突然無預警失蹤，儘管警方派出一名經驗豐富的警官負責偵辦，但坐在家裡枯

  等對大衛來說一樣是種煎熬。透過對話紀錄，他發現女兒的電腦就在家中，於是他決定，

  先從女兒的電腦下手，或許可以從中找到女兒失蹤的蛛絲馬跡。


  --


  本片大抵上有兩個地方值得一談，一是媲美本格推理的扎實劇情，二是極特殊的表現手法

  。由於前者能講的東西太多，所以我們先從相對單純的後者說起好了。


  如果各位還記得我先前聊過的《弒訊2：暗網》，姑且不論優劣，至少肯定對其全程聚焦

  在電腦螢幕上的表現手法印象深刻，這樣的表現手法跟第一人稱視角偽紀錄片都有相同的

  效果，那就是寫實。


  然而，卻也都有相同的罩門，那就是難以規避刻意賣弄手法之嫌，完全無法說服我，死到

  臨頭還不放下V8(離開電腦桌前)的理由。


  --


  然而，或許是劇情安排有特意規避，也可能是導演知道這樣演不好，本片幾乎沒有踩到這

  樣的地雷，基本上主角大衛在電腦前的所有行為都頗為合理，且有目的性，視角也很固定

  ，不會讓你有在《弒訊2：暗網》一下這個人用電腦、一下那個人用電腦，很混亂的感覺

  。


  當然，電影還是要有一些衝突的鏡頭，安排得也很合理，有的是為了保全證據的監控，有

  的是路人的側錄，有的是新聞畫面，也都還算置入得很合理。


  --


  接著說另外一點，也是本片的重頭戲， 那就是劇情。


  電影從大衛的女兒無預警的消失作為起點，正如片名「Searching」，描述的是他如何透

  過自身所長尋人的功夫，告訴我們原來搜尋引擎還能這樣用，直呼大開眼界，重要的是不

  像柯南神來一筆的突破盲點，而是從無到有，讓觀眾站在跟大衛一樣的立足點，慢慢地推

  理出真相，可以說是動腦版的《即刻救援》。


  相關過程我最不贅述了，其次，電影的重要線索遍布可見，彩蛋也是多不勝數，有些關鍵

  資訊其實早早就呈現在觀眾眼前，只是缺了塊拼圖，隨著大衛的挖掘，拼湊出真相，其嚴

  謹的過程確實頗有媲美本格推理的水準，若是以推理小說的方式呈現，應該也會是一部佳

  作。


  --


  好了，以上是我對這部片的優點做客觀分析，不過畢竟電影是我在看，我覺得還是要講一

  些比較屬於我個人的主觀看法。


  第一點，誠如開頭所言，對於這種聚焦於電腦螢幕的拍攝手法，它終究還是有所侷限，那

  就是沒辦法表現出傳統的電影，有所謂的精彩鏡頭剪輯。說到這可能就有人要槓我了，人

  家可是花了兩年剪輯，這點我等會在說，我所謂的鏡頭剪輯，是說有所謂的慢動作、拉近

  拉遠等重點式的鏡頭呈現，我不是電影專長，恕我不知道可以用什麼更精準的詞彙表達，

  但知道的人大概就懂我的意思。


  不過我還是得再次強調，就類似的表現手法，本片絕對是經典之作，但奈何我就是進入不

  了，就比如我是聽慣了Hip-Hop的人，你跟我說誰誰的抒情歌很好聽，沒說它難聽啦，但

  我就是聽不太下去而已，大概是這樣的意思。


  --


  說到剪輯，有說這部片子只拍13天但花了兩年剪輯，這種電影公關宣傳，我通常是覺得聽

  聽就好，不是要去懷疑他的真實性，但也確實沒有人會去求證。如果有人要跟我槓說，人

  家拍13天就有這樣這樣的效果，要是能拍130天那豈不就有你要的鏡頭剪輯，是啦，那等

  你哪天拍130天花十年剪輯再告訴我唄。


  於是，看這部片我就比較像是在看長一點的youtube短片的感覺，儘管大衛秀了一手強爆

  了的搜尋引擎使用功力，但少了點畫面的衝擊，我就也只能在旁邊說，「哇，好強好強」

  ，但然後呢？So What？


  --


  於是這就牽涉到我要說的第二點了，電影的題材缺乏了點強烈吸引我看下去的懸疑性。


  從開頭其實不難聯想大衛女兒的失蹤原因，但在揭發真相之前，我們可以有幾種猜測，一

  是女兒因為某種理由離家出走，二是遇到困難不得不跑路，三是最恐怖的，那就是遭人所

  害。


  以上三點都有可能是本片發展的後續之一，然而，前兩點都是小打小鬧，僅有第三點才有

  一點抓人眼球的嚴重性。我必須得承認說，看任何比較帶黑暗元素的題材，在沒有真正的

  出現屍體之前，這個世界都是不值得留戀的，同理這部電影。


  其實我很早就認定這部片大概會是小打小鬧而興致缺缺，還有兩點原因，本片選擇找華裔

  家庭作為事件核心，便已註定大概不會有什麼太過激的事情，因為一旦起爭議，就涉及辱

  華、種族歧視，何必呢？其二就是，電影其實有些明顯的暗示(就是明示)，這部片子大概

  跟親子關係有關，既然如此，那事件的真相也大概不難猜測了。


  好啦，講那麼多，其實就是女主角不夠好看，不夠讓我擔心她的安危，就這麼簡單的道理

  而已。


  --


  以上，我不否認這是一部傑作，你也可以說我不懂欣賞，看電影是主觀的，如此而已。



  即刻短評(滿分5)


  劇情： 4     >>鋪陳跟細節沒話說，可惜差了點激情、聳動

  結局： 3     >>兇手跟動機好像有點好猜

  氣氛： 2     >>這種拍攝手法恕我無感

  血腥： 1     >>沒有

  推薦： 3.5   >>自己極主觀給分，不用太當作一回事


  --

  樓上兩位看得可真細節


  問題是我就欣賞不來'
