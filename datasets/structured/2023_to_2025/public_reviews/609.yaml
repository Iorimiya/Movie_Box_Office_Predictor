content: '影片有《復仇者聯盟：無限之戰》的劇情雷，請先看過電影再看這部影片




  《復仇者聯盟：無限之戰》在上個禮拜正式上映

  也不斷刷新全球票房開票紀錄


  在薩諾斯恐怖的威嚴之下，復仇者聯盟面臨了前所未有的危機

  而是什麼讓薩諾斯免於成為漫威眾多免洗反派之一的命運？

  又有什麼因素讓薩諾斯成為MCU目前為止最獨特的反派？


  由Just write的這部影片來解析


  註：

  電車難題

  假設你看到一輛剎車壞了的有軌電車，即將撞上前方軌道上的五個人，而旁邊的備用軌道上只有一個人，如果你什麼都不做，五個人會被撞死。你手邊有一個按鈕，按下按鈕，車會駛入備用軌道，只撞死一個人。你是否應該犧牲這一個人的生命而拯救另外五個人？




