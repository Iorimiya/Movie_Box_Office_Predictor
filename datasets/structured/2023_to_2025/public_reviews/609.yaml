title: 'Re: [負雷] 想問爸爸去哪裡？的紅衣小女孩2'
content: '看完這篇文，每個人都有表達意見的權利，


  你當然有覺得不好看的自由，


  只是我覺得理由實在是糟糕透了。





  看到這句我就無言，又是一個女權主義裡的被害妄想症患者。


  對這部電影而言，紅衣小女孩就是「魔神仔混嬰靈」故事的集合體，


  今天我要寫一篇嬰靈的故事，不從墮胎下手，你教我怎麼編？


  你罵這篇故事「用宗教迷信威脅女性身體自主權」


  就好比：


  「西遊記怪力亂神。」


  「玩命關頭色情又暴力。」


  「妖怪手錶劇場版幼稚。」


  完全是莫名其妙地罵法。




  愛不愛小孩區分好女人壞女人，怎麼了嗎=   =？


  所以說哪個文明世界的價值觀是墮胎=好女人？


  我知道你又會搬出一套「墮胎是女性身體自主權blabla」的理論來反擊，


  但「愛小孩」永遠是一項光明良性的美德類行為。


  不然這樣好了，你有沒有看過哪部影視作品，


  裏頭主角很討厭小孩，而且還將之視為好人的？



  這邊先分兩部分討論：


  「一，愛是否能解決一切？」

  「二，這是不是糞劇情？」


  先說一吧，既然你也認為劇中人物得到憂鬱症，憂鬱症除了吃藥、規律作息以外，他人的

  關懷與陪伴一直都佔有相當重要的位置，所以愛能解決憂鬱症這件事你還真不能說他錯，

  劇中人物無論有沒有遇到鬼，最大的困境都是心魔，心魔不靠別人點醒你走出來，還有其

  他方法嗎？


  再說二，我覺得你有認為劇情糞的自由，但我自己覺得還好，或許是你不明白單親小孩的

  無奈，但我懂，所以完全可以理解。



  我覺得不是，之所以她得死，是因為她的執念製造出惡魔，


  許多無辜罹難者的性命都得怪到她頭上，


  黃河不是孩子、第一集的阿嬤也不是孩子，


  只看到她害死「孩子」，忽略其他間接殺死的人，這算是一個錯誤結論。



  同樣的話不同的人說會有不同的效果，


  這不是很正常的嗎？


  所有人的一生都有類似經歷吧？




  首先，劇情裡沒有明確說虎爺究竟成年與否，


  我們假設虎爺也未成年，這對小朋友的戀情就符合「兩小無猜條款」


  法律問題就會變成告訴乃論，


  換言之，楊丞琳可以選擇告也可以選擇不告，


  既然兩家都欣然接受成為親家了，還告個屁喔！





  虎爺家怎麼看都沒有經濟問題，


  只要繼承乩童事業就好。這個保證很賺，


  許多地方的寺廟人員甚至人脈很好，虎爺未來還可能投身選戰，成為民意代表。



  這裡就是我覺得你最莫名其妙的地方。


  人家小爸媽選擇自己的人生就是要養這個小孩，


  難道愛自己小孩，願意撫養錯了嗎？還是人家是小爸媽，所以沒有養小孩的自由？


  我覺得你價值觀裡的迂腐，比你開頭講得一堆「女性blabla」的父權主義者還嚴重。



  腦補出一個很壞的結局，所以推廣出一個很壞的結論，


  這段跟中時在打柯p有87%像。






  我覺得你這篇文最噁心的一點就是，


  表面上既要「宣揚女性自主權」


  實際上仍然是一篇舊時代觀念的集合體，



  你看看你最後兩行在寫三小？


  我就問一件事，今天兩個未成年人談戀愛無套內射，


  關虎爺屁事啦！



  題外話，


  我在看完這部電影的時候，


  心想，如果墮胎過的女子看這部不知道有什麼感覺，


  肯定會一直跳出來攻擊這部電影的價值觀吧。



  --


  +1


  我也是說我這篇



  走到電影院


  買了一張紅衣小女孩門票，


  看完走出電影院，


  這部電影居然沒有利用這兩小時充分的闡述關於墮胎、道德、哲學、兩性的相關議題，


  真的是氣死我了，爛片！




  走到路邊攤


  買了一碗35元的滷肉飯，


  吃完走出路邊攤，


  這碗滷肉飯居然沒有利用這35元製造出營養、美味、健康、色香味俱全的滿漢全席，


  真的氣死我了，糞店！'
