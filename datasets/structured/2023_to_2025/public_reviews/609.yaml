url: https://www.ptt.cc/bbs/movie/M.1735917940.A.7D4.html
title: '[好雷] 【爸爸PAPA】既是親人也是仇人'
content: "‧\n是不是像行銷宣傳那樣，【爸爸PAPA】是劉青雲從影以來最揪心演出，我不敢確定；但可\n以肯定的是，劉青雲將劇中角色「阮永年」心中的內藏情緒，無論是悲或是恨，都隱含在\n\
  他長達2小時多的面無表情，而在這張充滿滄桑的臉之下，又是多麼的無助、悲傷、氣憤\n以及自責。\n\n也許我們喜歡看到的是，父子之間狗血誇張的愛恨情節，也或許是充滿動機、仇恨及大篇\n\
  幅的殺人橋段，但翁子光導演並不這麼做，更多的是以傳統家庭中的「爸爸」角色視角做\n為出發，講求一段被至親之人毀滅後的家庭，該如何重新修復與兒子之間的關係、該如何\n\
  面對兒子殺害妻子女兒的仇恨、該如何讓彼此知道如何珍惜眼前之人。\n\n\n‧\n【爸爸PAPA】用著倒敘及時間跳接劇情，來展現阮永年對於失去的後悔，家中的愛貓偷跑\n\
  、妻子要他買的濾網，都在事件發生後，才逐漸完成，做這些也許不是基於承諾，而是永\n年可能用一般的家人日常生活、習慣性的喊著女兒名字來解決電腦問題，來填補不願意面\n\
  對的事實；原本是一家有著正常生活平靜的家庭，誰都想不到會有如此的慘事，就連永年\n自己都不相信。\n\n劇情充斥著永年的過去及回憶，也代表著回顧永年這位傳統型丈夫及爸爸的優缺點，觀眾\n\
  可以看到永年與兒子之間缺乏了細膩的溝通，永年雖然嚴厲，但在那不夠細膩的心底下，\n卻也是愛護兒子，如同要買生日禮物時，雖然兒子選了較大台、不符身形的腳踏車，但為\n\
  了不讓兒子失望，加上彌補沒有在生日當天贈送的原因，決定還是買了下來；但另一個時\n間段，兒子想買照相功能的手機，永年卻不懂，如果需要照相，為何不買相機就好，這邊\n\
  完全充分的展現出父子間缺乏有效的表達，以及一位傳統、神經大條的爸爸所無法理解的\n青少年想法；這2個事件展現了一個深愛自己小孩，但卻無法像妻子一樣，用愛與細膩來\n\
  對待孩子的爸爸。\n\n\n‧\n\n而劇情越回顧永年曾經的幸福，就越讓觀眾覺得人世間之無常，而且可能是個沒有答案的\n無常；也越讓永年思考到底是哪裡出了問題，真的是兒子病了？還是因為兒子與妹妹爭寵\n\
  ？還是因為與妻子24小時輪班經營餐廳，錯失了與兒子的成長溝通？還是學校霸凌產生的\n反社會人格？【爸爸PAPA】充滿了沒有答案的為什麼，但不對其某個原因深究，因為人生\n\
  有時就是這麼荒謬無常的發生一些事。\n\n\n也因如此，永年對於悲痛仇恨麻木了，他找不到一個能夠宣洩或仇恨的抒發點，直至因想\n抒發情緒的性需求，而被詐騙的時機，他才能真正有個能讓他大罵發洩的契機，也是全片\n\
  少數可以看到劉青雲較激動的演技。\n\n\n‧\n\n當然必須讚賞此部的場景運鏡，尤其最後的會面戲，利用光影重疊來表示父子真正的交心\n時刻，也證明了書信的重要性，如同永年不斷用笨拙的電腦打字，寫信述說給妻子的日常\n\
  瑣事，那些說不出口的話，用著書信來正確的表達內心及情緒，兒子也是在療養院中利用\n了書信，來正確的表達自己的情感，才有了這次互相理解的會面。\n\n【爸爸PAPA】是部不易消化的電影，雖然講了很多東西，但都並不深入的探討，因為這些\n\
  事情不會有一個正確解答，即使在劇情最後一秒，永年都不知道為什麼他的人生會經歷這\n些、厚明永遠不知道他為何會這樣殺了媽媽妹妹、金燕和厚恩也不知為什麼平常溫順的厚\n\
  明會痛下殺手，那個尊重生命、愛護貓咪的男孩，為什麼會如此？也許只剩下那遼闊的海\n南島之海，聽著海浪聲，讓自己的心，海闊天空的飛過，至少那天在海南島的沙灘，是全\n\
  家最快樂的日子；如同不斷出現的木棉花花語一樣，請在此時此刻刻「珍惜眼前的人」。\n\n\n‧\n\n\n‧ \n\n\n‧ 電影資訊\n\n| 發行片商 ：#甲上娛樂\n\
  | 主要演員 ：#劉青雲 | #古祖琳 | #小花（貓）\n| 上映日期 ：2025/01/03\n\n\n--"
