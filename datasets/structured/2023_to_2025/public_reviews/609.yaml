url: https://www.ptt.cc/bbs/movie/M.1524120138.A.1D2.html
title: '[有雷] 柳暗花明又一村《我的美麗爸爸》'
content: '圖文請於連結：


  就算捨去男兒身，我的愛卻永不變

  電影英文名：ola Pater

  性別議題是很多電影的主軸，而尊重多元的選擇有時獲得別人認同雖然感到欣慰，但最難

  的還是自己與家人這道關卡，選擇走對得起自己的路代價有多難，而改變自己往後的人生

  也會得到什麼？同時又失去了什麼，永遠無法兩全其美。相當詩藝的故事《我的美麗爸爸

  》是一部非常可愛同時又相當精彩的文藝電影。故事敘述在母親去世後，調音師的李諾去

  找尋當年離開自己的父親，靠著律師地址找到父親的住所，卻只見著教跳舞的女老師蘿拉

  。而美豔的蘿拉正是李諾的父親，在看見自己當年的孩子已長大成人，不知道該用何種模

  樣表露自己身分的蘿拉，決定自己前往巴黎，將全新的自己重新一次介紹給兒子。









  《我的美麗爸爸》算是一個比較像事後談的故事，當變性的焦慮和衝動年少過後的多年，

  一位已經被周遭人接受身分和性向的變性女士蘿拉，要怎麼重拾自我，和面對自己那段為

  人父的過去，和兒子季諾之間那若即若離的感情和無法說出口的感傷和喜悅？是本片相當

  引人入勝之處。在這場對手戲中，熟成的韻味中帶點任性的主角蘿拉，演出相當精湛，女

  演員演出男變女這點的內心戲不只演出成熟的神韻，也演出變性者的心裡細膩的變化。


  其中電影較為有趣的是宗教信仰的設定，電影中蘿拉的家庭是信奉伊斯蘭教，也是移居法

  國的新移民，在許多伊斯蘭國家變性是違法的，故以宗教信仰為背景詮釋變性議題，不知

  是否為導演的別有用心？而雖然伊斯蘭許多國家對於同性戀和變性議題不接受，但有趣的

  是伊朗卻是唯一認可變性權利的伊斯蘭國家，但同時社會也帶來莫大的歧視，這一點仍然

  是讓人可惜之處。












  而《我的美麗爸爸》將主題聚焦於父子兩人之間多年後的告白與再遇見，固然電影許多方

  面是以蘿拉的角度詮釋，或是寫照出她的心情面相。但在兒子李諾的刻劃上卻也沒有少過

  ，從父子面對問題的態度看來，如果仔細一瞧會發現兩人對於感情的表達如此的笨拙，但

  又如此的相似，證明兩人之間那斷不了的血緣和牽絆。就某方面《我的美麗爸爸》與《雙

  面勞倫斯》兩者有著近乎相似的情節，拋開過去的自己去追尋全新的自我，但不同的是《

  我的美麗爸爸》避開了煎熬的難題，給了一個「美麗」的詮釋。


  多年後對自己兒子坦承過去比較困難？還是多年後知道父親以成了女人較讓人困擾？其實

  在電影裡可以看到不管何種都是無法去比較的重擔。也可以見著即使周遭人都認同全新的

  自己，也比不過家人的一句話左右心思。只能說這部節奏和情節都單純的電影，因為演員

  們的詮釋加深了可看性和深度，讓人物的一舉一動都如此吸睛。《我的美麗爸爸》終究是

  一場美麗的詮釋，而如對比台灣電影《阿莉芙》中雪莉和老吳的樣模實在讓人又憶起傷感

  。


  換得了性別，換不了身份。不面對事物並不會隨著時間停留在原處，坦然面對的代價是血

  淋淋的讓人痛心，卻又如此忠於自我。《我的美麗爸爸》畢竟是段美麗的成人童話，而童

  話後現實的世界會繼續美麗或則只是吹膨的彩虹泡泡呢？


  --'
