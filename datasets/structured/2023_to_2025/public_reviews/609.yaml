url: https://www.ptt.cc/bbs/movie/M.1493907082.A.9C2.html
title: '[普好雷]《我的海星爸爸》，好想抱抱你。'
content: '部落格版：


  原先我預期看《我的海星爸爸》會哭得唏嚦嘩啦，但結果卻沒有。電影是感動的、勵志的

  ，幾乎可以說能夠逼哭觀眾的元素都擁有，事後想想也許是因為電影多了幾分殘酷，過往

  此類型電影多半會盡量能給多少正能量就給多少，可本片導演卻不是，反而不停從多面向

  去挖掘殘忍事實，企圖逼迫觀眾去投入電影裡、進入角色裡，去體會病患與家屬的苦痛與

  難熬，以及那些得面臨的種種。以敗血症（Sepsis）為主體，從中去延伸許多家庭課題，

  當角色們在成長的同時，觀眾也能獲得不少反思。


  湯姆某日半夜突然全身劇烈疼痛，本以為是因吃了過期香腸導致的食物中毒，直至他痛到

  站不起來、整張臉刷白、冒冷汗，他與妻子妮可拉才驚覺嚴重性，立刻趕緊叫救護車送急

  診，未料他們在病床上等待許久卻無人上前協助，當醫護人員終於察覺湯姆病情不單純而

  將他送至診間檢查時早已來不及，錯過黃金救援期的湯姆，身體內遭病菌感染，因血液供

  給不足導致不少器官衰竭，不得不割除大部分器官避免感染擴散，咬牙簽字的妮可拉，在

  不久後又被告知病毒持續擴散，湯姆臉部肌肉壞死，須割除以續命，而當術後不久，妮可

  拉也生下了第二個孩子佛萊迪，雖然醫生告知他們會安排時間做重建手術，但卻再也無法

  回復到過去樣貌了，不只湯姆無法接受，女兒格蕾絲更不厭承認全身纏滿繃帶的男人是她

  「爸爸」...


  生活突逢巨變的湯姆與妮可拉，各自因這場大病身心俱疲，湯姆面對的是因容貌的改變所

  帶來的強烈自卑，以及四肢遭切除後的行動不便與不安全感，加上過去父親離家帶給自己

  的影響、壓力，讓他從前許下的「不要成為像父親那樣的父親」的願望被擊碎，此外，更

  是剝奪了他身為男人、身為一家之主的驕傲。而妮可拉則必須同時照顧湯姆還有兩個孩子

  ，得做到不讓湯姆自卑、不讓孩子恐懼父親，同時又得被湯姆母親的咄咄逼人、經濟上的

  壓力，令妮可拉如同站在鋼索上命懸一線，只差再一擊便能將她擊落、讓她徹底崩潰。當

  兩人心中壓抑許久的不滿、憤世累積到頂，一口氣爆發的宣洩指責方成了本片的最高潮，

  也直點出病患與家屬所看的、所想的、所期待的差距到底有多大。



  「你只看見這病痛帶給你什麼影響，卻沒注意到這帶給周遭的人多少苦痛！」


  當湯姆把發生在自己身上的不幸拼命的怪罪到他人身上，終於讓妮可拉承受不住，她的一

  句話未能打醒湯姆，反而讓對方更加困惑。是啊，要是這件事發生在我身上，我真有辦法

  保持樂觀向上，把一切視為給我的考驗？「湯姆」的念頭與作法其實就是絕大多數病患患

  病後所會有的反應，他們的自尊心不容許再受到打擊，可偏偏周遭的人往往卻在有意無意

  中，朝著自己投射同情的目光，即便是自己最親的親人都是，「在他眼前拼命隱藏什麼（

  如生活現況...）」的舉動都像是把利刃狠狠的刺割著自己。


  妮可拉告訴湯姆，她拼了死命想著要如何讓生活繼續向前，但湯姆卻始終執著在於要如何

  回到過去，未來與過去勢必無法同行，她明白湯姆對過去的眷戀，只是日子終究得過，她

  不能再忍受湯姆的任性，一場用餐戲碼，湯姆推著酒杯向前，要妮可拉在幫她倒一杯，妮

  可拉只是斟酌著酒量倒了四分之一杯，湯姆看見直酸「我們家伙食費不足了嗎」等諸如此

  類的話語，妮可拉百般無奈只好多倒一點。雖然這無法代表湯姆眷戀著過去，但依舊可以

  從中查覺，湯姆不覺得自己的病給這個家造成了什麼影響，他認為一切還是像過去一樣，

  或者說，只要他的臉、四肢能夠回復到健全狀態，一切就都可以跟過去一樣了。但對妮可

  拉來講，日子早就不可能一樣了，她能做的就是如何能將她們送往朝向未來的常軌上。


  「你還不明白嗎？我們會一直守在你身邊。」


  說到底湯姆還是不知道自己的自怨自艾帶給了周遭的人多少麻煩，只會一昧的懇求她們不

  要離開他，妮可拉似乎也放棄勸說或解釋，僅是溫柔的說著，告訴湯姆她從一而終的堅定

  決定，那就是陪著他以這個樣子，牽著格蕾絲、佛萊迪繼續走下去。



  《我的海星爸爸》殘酷的說著一個溫柔的故事，有點不忍的、有點溫馨的，說穿了故事想

  講的不就是那麼回事，找到勇氣面對未來、走下去，你可能會忘記電影前面演歇什麼，但

  沒關係，你只要記住妮可拉與湯姆最後的爭吵，以及最後湯姆奮力架著梯子爬上屋頂，替

  隔壁鄰居小男孩撿掉在另一邊的足球的身影就好了。


  對我來講《我的海星爸爸》有點可惜，它的時間跳躍的有些快速，又沒有靠任何東西銜接

  ，有時候會有「什麼時候發生」的念頭出現。此外電影塞了很多東西當輔佐，卻沒辦法面

  面俱到，如湯姆與他的父親以及母親之間的事，本以為他的父母親會成為他可能走出來或

  是什麼的契機，結果卻沒有，僅是淺談帶過，甚至湯姆的母親在盪鞦韆後便沒再出現了。

  再來，雖然片名是《我的海星爸爸》，可是大部分時間都放在湯姆與妮可拉這對夫妻上面

  （妮可拉佔更多），談到父女情的其實很少，也沒有讓人印象深刻的地方，不如改名為《

  我的海星丈夫》還比較貼切點。


  說個結論，我認為如果你淚腺較發達，是可以進電影院看場《我的海星爸爸》哭個一場，

  但如果你像我一樣比較沒血淚，就當作進戲院看一場屬於湯姆與妮可拉的人生故事吧，至

  少你能稍微知道，他（病患）與她（家屬）彼此究竟在想什麼，去稍微感受導演所給予這

  部電影的真實，而非拼命的去吸收勵志過頭的正能量。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
