url: https://www.ptt.cc/bbs/movie/M.1752863549.A.A1D.html
title: '[問片] 爸爸癌末 安寧病房推薦片單'
content: '從4月和信醫院多次看診檢查 癌末83歲老爸拒絕開刀

  5月在家休養 居家醫療

  6月急診 我跟著在醫院健保房陪病一個月

  5-6月都是一週進公司1-2天 其餘居家工作

  7月轉安寧病房 早在和信醫院預約正子掃描的時候 我說「不論開刀還是安寧療法 我都非常不捨」

  雖然心裡有底 我們依然心情矛盾拉扯 生命鬥士與放手了無苦難


  求推薦片單 謝謝

  經常聽心經 這部是我在台鐵在公司 在父親突然譫妄說歹命死一死的時候 我都在聽的歌曲




  --

  Sent from nPTT on my iPhone 8 Plus


  --'
