url: https://www.ptt.cc/bbs/movie/M.1470141630.A.2B1.html
title: '[好雷]父親節準備來惹爸爸哭~《超級狐狸先生》~'
content: "父親節要到了，來說說爸爸這件事吧！\n\n\n網誌走這邊：\n\n臉書連結：\n\n\n\n因為自己小說題材的緣故，\n曾有一小段時間專注的書籍和電影都是父親這個題材，\n\
  也因為如此，才發現小時候讀過的童書《狐狸爸爸萬歲！》\n居然曾被大導演魏斯‧安德森改編成動畫電影！   <嚇到從椅子上跌下來.>\n\n\n話說原著羅傑‧達爾，向來以充滿黑色幽默，又帶著童趣的筆法，\n\
  創作了不少經典的兒童文學，巧克力工廠、飛天巨桃、女巫……等等，\n這些傑作都是出自於他的妙筆之下。\n魏斯‧安德森也是非常不得了，《天才一族》替他贏回了奧斯卡原創劇本後，\n\
  不少大明星不惜降價，也要在這個導演的電影中尬上一角。\n2014年《歡迎來到布達佩斯大飯店》更得到9項提名，創下導演生涯高峰。\n兩個如此特別的創作者碰在一起，究竟能激盪出什麼火花，\n\
  在下電影還沒看，內心已經尖叫不知道幾輪啦！\n趁著父親節前夕，特別來和各位分享一下這部絕妙的動畫《超級狐狸先生》\n\n\n\n所以，一隻浪蕩的野狼有沒有可能變成顧家的忠犬？\n\
  這是原著中沒有特別提及，卻在動畫電影裡出現的大哉問。\n狐狸先生是個浪蕩子，和狐狸太太一起偷遍了大小農莊，\n但一次大意失風落入陷阱之後，狐狸太太到狐狸先生發誓，\n\
  如果逃過一劫，為了未出世的寶寶，一定要金盆洗手，找一份沒有風險的工作！\n狐狸先生答應了，故事由此開始。\n\n\n逗趣的開頭，讓我們把狐狸先生的性格看個透徹。\n\
  除了浪漫深情之外，他還是一個浪蕩子，\n偷人類東西不只是維生手段，更是他的榮耀成就。\n無奈為了妻兒離開危險的生活，被迫窩在狹小的地洞裡，\n狐狸先生也不禁自問，他和他的父親究竟有何不同？\n\
  所以當一個景觀超棒，與三個惡劣農夫比鄰的大樹豪宅出現時，\n狐狸先生決定瞞著太座，再次走上大盜之路……\n\n\n這一段雖然乍看之下相當隱晦，\n但如果等加上狐小孩艾許，和外甥克里斯多佛森，\n\
  突然間就會變得非常微妙，看得我們這些人類會心一笑。\n狐狸先生究竟是想比爸爸優秀？還是不想和爸爸一樣平庸？\n也許這問題的答案我們能從崇拜的父親的艾許身上找到答案。\n\
  男孩長成男人需要一個英雄，狐狸先生想成為一個英雄，\n卻沒發現自己在兒子心中就是英雄。\n運動細胞不算傑出的艾許，一心想成為像父親一樣的英雄，\n無所不用其極想學習父親的典範，可惜時常畫虎不成反類犬。\n\
  加上傑出的表弟克里斯多佛森出現，無形間更加重了艾許遭到威脅的感覺，\n於是，艾許想成為狐狸先生，狐狸先生想超越父親，\n男人與男孩互相追逐背影，取代了農夫和狐狸的戰爭，\n\
  成了《超級狐狸先生》故事的全新主軸。\n\n\n\n說起來這是一部怎樣的電影？其實就是狐狸先生的中年危機.XD！\n和妻兒生活在地洞裡，狐狸先生不只是要給他們更好的生活，\n\
  也想再一次肯定自己的存在與能力，找回過去浪蕩的刺激與快樂。\n狐狸先生天不怕地不怕，卻怕狼怕得要死，由此可見端倪。\n對狐狸先生來說，狼是純粹野性的動物，是他想追求卻不能為之的目標。\n\
  他深愛妻子和小孩，於是努力守著家庭，卻又不時聽見野性的呼喚。\n怕狼不是怕死，而是怕自己走回放蕩的老路，一去就不能回頭。\n這是屬於狐狸先生的兩難。他害怕自己成為野獸，又渴望更好的生活，\n\
  不想永遠困在樹洞裡寫沒人看的專欄，想讓全世界讚頌他的功績。\n就像有句傳說名言，好漢總提當年勇。\n他懷念以前有著響亮名聲的生活，就算敵手是三個名聞遐邇的恐怖農夫也無所謂。\n\
  事實上，以狐狸先生當下的心境來看，\n說不定正因為對手惡名昭彰，他才更加心癢難耐也說不定. <笑>\n\n\n不過出來混的總是要還。\n狐狸先生的犯行終於引來三個農夫集體報復，波及了無辜的鄰居。\n\
  狐狸先生不只要面對自己的犯行的後果，還要想辦法拯救因他受難的親朋好友。\n幻滅是成長的第一步，經歷大小事件打擊的狐狸先生，\n最後也不得不像諸多英雄一樣，面對自己無能為力的事實。\n\
  好在有狐狸太太不離不棄，以及一個及時送到的訊息，\n狐狸先生及時轉換目標，把自殺任務換成救援行動。\n\n\n\n等等！這救援是怎麼來的？\n\n原來是崇拜父親的艾許，害得表弟克里斯多佛森落入農夫手裡。\n\
  艾許和和克里斯多佛森是這部電影的另外一個面向。\n我想各位也許都不陌生，從小到大的成長經驗裡，\n成年人難免比較心態，拿孩子和其他小朋友互相比較。\n贏了沾沾自喜，要是輸了難看的卻是我們這些受害者.QQ\n\
  艾許也是如此，他有父親的陰影，\n連球隊教練都以難度太高為由，叫他放棄以自己父親為榜樣。\n而莫名其妙住進家裡的表弟又處處比他優秀，\n連出門偷東西都是表弟出馬，艾許只能上床睡覺。\n\
  艾許是個急於證明自己的孩子，不懂自己成長尚未完全，\n不可能跟上父親或是發育良好的表弟。\n\n雖然有機會和克里斯多佛森建立起友誼，卻因為得意忘形害他陷入危險。\n\
  一向忽視兒子的狐狸先生，氣得質問兒子為什麼帶表弟冒險時，\n聽見艾許囁嚅地承認他只是想拿回父親失去的尾巴，\n才終於驚覺自己在兒子心中的地位有多大的份量，\n\
  知道自己這段重拾舊業的日子有多荒唐，讓這麼多愛他的人曝露在風險中。\n\n\n\n這一段是父子一同成長的關鍵。\n他們共同體會到形勢比人強，為了克里斯多佛森，\n\
  父子倆人都得放下驕傲，面對成長的難關，才能拯救無辜的親人。\n於是乎比起和農夫的戰爭大獲全勝，狐狸先生在末段與不會說話的狼揮手告別，\n私以為才是整部電影的高潮所在，更是導演精妙的手筆。\n\
  他揮別的不只是一頭美麗的動物，還有他的夢想、美好的過去、對野性的渴望。\n狐狸先生要成為超級狐狸先生，就和超人特攻隊的超能先生一樣，\n要做的遠遠超出 Incredible或Fantastic這些帶著幻想的字眼。\n\
  \n\n\n所以樂觀堅強如狐狸先生，也不禁流下了男兒淚。\n\n\n\n如果陪小朋友看這部電影，看到這一段，\n也許哭的不會是小朋友，而是感同身受的爸爸們也說不定。\n\
  \n\n好在種種代價是值得的，\n艾許在救援中大幅成長，獲得父親的肯定，\n克里斯多佛森成功脫離險境，準備和自己的父親團圓，\n狐狸先生終於在農夫們圍堵的中找到一個秘密基地，可以供大家衣食無缺，\n\
  甚至連狐狸太太，都有了好消息要和大家分享。\n正如原著的歡樂大結局，除了三個壞農夫之外，所有人都找了幸福\n真是可喜可賀、可喜可賀.~ΘwΘ~\n\n\n\n\
  除了劇情之外，導演在畫面上也動了不少巧思。\n橫向畫面讓狐狸先生的冒險，活像古早的馬力歐遊戲一樣，\n帶著觀眾穿梭在大小不同的難關、障礙賽之中，\n片中不少笑點也是藉著這種特殊的畫面編排出來。\n\
  \n而每個人物也是各有巧思，狐狸先生和艾許暫且不表，\n誰想得到西裝鼻挺的獾律師興趣是放火爆破，\n看起來賢慧居家的狐狸太太，當年是傳說中的美豔鎮公車，\n連管家凱利都有一個超大秘密.XD！\n\
  還有自甘墮落成為人類走狗的老鼠追求什麼？\n編導們把這些巧思穿插在故事裡，\n連歌頌狐狸先生的狐狸歌和三個農夫之歌都和劇情緊貼，在在令人莞爾。\n\n當然說到魏斯安德森，不能少的還有他的畫面強迫症\n\
  各位可以看一下國外的網友製作的短片，就可以發現他的畫面藏著怎樣的秘密。\nWes Anderson // Centered：\n\n\n\n以上，推薦給各位的父親節電影，\n\
  \n下禮拜找老爸好好哭一場，或是大笑九十分鐘吧~\n\n\n\n\n--\n                                     08/02\
  \ 20:47"
