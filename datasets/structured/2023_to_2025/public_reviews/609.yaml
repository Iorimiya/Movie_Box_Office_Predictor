title: '[新聞] 劉德華扮演「最壞爸爸」 嚇壞小女生'
content: '劉德華在新片《特工爺爺》，突破以往好好先生的形象，飾演「混混父親」，總是對女兒

  很兇，皺著眉頭、臭著一張臉面對女兒，展現不同以往的演技。


  《特工爺爺》是由洪金寶飾演的退休軍官老丁，因健忘症弄丟孫女，而後在與鄰居小女孩

  春花的相處中，獲得親情的慰藉。


  但是，劉德華飾演的春花父親，無意中卻捲入中俄邊境的幫派鬥爭，陷春花於危險之中，

  此時老丁挺身而出，幸虧最終，「混混父親」也在經歷了幫派鬥爭後醒悟。


  此外，劉德華還為電影寫下主題曲「原諒我」，貫穿整部電影，尤其當洪金寶與小女孩春

  花互動時，深厚的祖孫情在劉德華演唱的《原諒我》伴奏下，更加催人淚下。


  新聞網址：


  --'
