url: https://www.ptt.cc/bbs/movie/M.1491638244.A.621.html
title: '[普雷] "他不笨，他是我爸爸"溫馨老片'
content: "-小女孩好可愛-\n\n這部是一部很久的片惹，\n\n主打溫馨市場\n\n故事中一個弱智爸爸為了女兒的撫養權以免費律師麗塔，女兒露西，爸爸山姆為主角發生\n\
  \n\n--------------------\n\n\n\n\n一開始我真的嚇到了\n\n\n2001年的片居然拍的還不錯??(只是光線有點強，導致人物感覺很亮)\n\
  \n感覺手法都很前衛，居然和15年後的今天沒有太多差別!\n\n\n我認為1995以來的美國老片都拍的很有帝國大廈的感覺，像是楚門的世界，王牌天神，男人百分百。\n\
  \n\n\n\n山姆弱智演的太像了...講話和肢體都有一種\"這是智障\"的感覺\n\n他的快樂夥伴也演的好像\n(後來才知道其中真的有兩個弱智)\n\n天哪\n\
  \n\n女主角律師，男主角，女主角小孩都選的很棒\n\n看來導演選擇角色很用心喔!\n\n\n-小女孩好可愛-\n\n\n其實我覺得整部片下來整體是不錯的\n\n\
  \n只是有點爛尾\n\n讓人覺得黑人問號\n\n\n從司法攻防上來看，家扶律師一直使用\"引導式問話\"讓小弟我看的滿頭問號\n\n問的問題好像也不太是重點\n\
  \n反而一直攻擊證人\n\n反而是劇情上起起伏伏一直沒有目標的感覺\n\n雖然最後山姆打輸官司之後還是一直去探望孩子露西\n\n感覺父女倆個感情又更好了\n\n\
  \n山姆更是不惜一切搬到露西寄養家庭附近(山姆連替露西買鞋子都要合資了，答錄機也只用的起二手，卻能在高級住宅區租房子???)\n\n\n山姆搬過去後卻使得露西經常性的翹家跑去找爸爸山姆\n\
  \n寄養家庭的媽媽看不下去，終於妥協\n\n跑去和山姆道歉:對不起我不該拆散你們\n\n故事就結束了\n\n\n\n-小女孩好可愛-\n\n\n\n看到這裡我真的滿頭問號\n\
  \n山姆失去露西是因為兒扶介入的關係，目的是使露西有個正常長大的環境，結果寄養家庭說不要就能讓小孩回爸爸身邊??\n\n\n一開始慶生會上無理取鬧的小男孩和他老爸，一開始扮個黑臉就不見惹\n\
  \n\n似黑似白的安娜\n其實我看不懂他的定位\n\n要幫不幫的感覺就是一個剛好住附近的怪人\n\n最後的女律師帶著她自己的小孩威利跑去找山姆說:我老公搬離我們惹\n\
  \n這種臆測的感覺就是女律師和山姆在一起了\n\n\n\n-小女孩好可愛-\n\n            ---推測---\n\n\n\n\n雖然結局沒提到\n\
  \n不過我認為 山姆應該真的和女律師結婚了\n\n\n因為有一個女律師當繼母的關係，露西才能夠回到父親山姆的身邊\n\n在最後足球場上，女律師還帶著兒子到場外加油\n\
  \n\n\n\n-小女孩好可愛-\n\n小女孩真的好可愛\n淡藍色的眼睛\n\n超可愛的\n\n給大家看看劇照\n\n\n\n\n\n\n\n\n--\n裡面還有711呢"
