url: https://www.ptt.cc/bbs/movie/M.1209360584.A.7A9.html
title: '[好雷]戲謔卻略帶沉重的祕密：一個好爸爸'
content: '正如李天恩在跳下海的那刻所說的自白般，從喜兒出生的那一刻起，李天恩的大半輩

  子都很「努力」在離開江湖這件事。


  　　電影一開始就是李天恩的喪禮，旁白的李天恩戲謔似的訴說著自己的一生。接著，

  走馬燈似的交待了李天恩從小到進入江湖，並認識美寶的種種過程。


  　　帶著戲謔及快節奏的畫面，加上輕快的配樂，不知為何，讓我聯想到「令人討厭的松子

  的一生」，尤其是初登場的美寶，劉若英那故作天真、面對鏡頭微笑猛眨眼的特寫畫面，彷

  彿中谷美紀似的誇張演出，令在場觀眾忍不住哄堂大笑。


  　　喜兒出生後，李天恩不想讓她知道自己是黑幫老大，於是，這個不合格的兒子、丈夫，

  用盡各種方法想要脫離黑道，只為了。然後，喜兒究竟知不知道這個老爸用了大半輩子隱瞞

  的秘密？當正值荳蔻年華的喜兒聽到男朋友說自己最討厭黑道時，突如其來的打嗝，觀眾與

  她分享了這個彼此心照不宣的秘密。



  　　相較於「生日快樂」的沉重，「一個好爸爸」裡的愛情成分，以極為輕鬆、誇張的方式

  帶過。


  　　而美寶與美寶爸、天恩與喜兒、天恩與天恩媽的親情互動，卻讓觀眾不時隨著劇中人又

  哭又笑。


  　　美寶帶著尚在襁褓中的喜兒回家時，負氣的父親立刻將自己隔離，卻又專注於外面的動

  靜，那落寞的神氣將觀眾的心揪在一起，但當他聽到小孩尚未取名時，立刻在紙上龍飛色舞

  的寫著「喜兒」的得意表情，讓人發現「老爸」真的很好搞定。


  　　天恩為喜兒所作的種種，或許比他為美寶付出的還要多許多。對天恩來說，喜兒是他的

  一切，是他願用盡一輩子力量呵護的寶貝（因為情節多所著墨，我就不再多舉例了）。


  　　同樣口是心非的天恩與天恩媽，似乎是大部分親子間的寫照。我們時常將自己的想法套

  在親人的身上，自以為自己了解他們，卻不知道這樣的自以為是親子間交流的最大阻礙。「

  你就是這樣不受教」這類的話語成了父母最常對兒女說的指責，而兒女們也理所當然的認為

  父母只會以「別人家的小孩比較乖」的想法對待自己。然而，我相信絕大部分的親子，總是

  把彼此當成自己最大的驕傲。



  　　首先，請原諒不是基督徒的我，沒有辦法完整的背出這幾句台詞。陷入困境的天恩，終

  於走向告解室，對於「眼前條條都是死路」的天恩，神父沒有給他任何答案，只是說了幾段

  聖經裡的話語。


  　　被迫到碼頭接貨的天恩中了警方的埋伏，以為自己好運氣用盡的天恩，突然想起母親的

  咒罵：「我會死在街上，而不是海上。」於是，他縱身跳下海裡，卻很衰的中了一槍。


  　　對於天恩來說，他終於成功的脫離黑社會了。而對於美寶與喜兒來說，這或許也是新生

  活的開始。


  　　當幸福的喜兒與未來夫婿走向紅毯時，我腦海裡想著的是：這一家子裡，究竟誰是誰該

  砍去的手腳？或許，天恩、美寶、喜兒都找到了屬於自己的歸宿與幸福，無論這是不是觀眾

  所能認同的結局。



  　　說到結局，本片故弄玄虛的結局似乎是觀眾早已猜想到的一步，雖然我早已隱約猜到會

  是這種結局，但還是在心裡著實嘀咕了一番，至於是怎樣的結局，我就不在此說了，有興趣

  的人自己去電影院看吧！


  　　另一個題外話，雖然拿到了二張特映會的票，卻很沒人緣的找不到人一起看。當劃位那

  位先生很狐疑的問我：「一個人嗎？」我突然很想在路邊隨便拉個人充數。


  　　看樣子，一個人看電影這件事，還是得練習很久，才會自然。還有，一個人看電影時，

  千萬別太早入場，否則，看著所有的觀眾幾乎是一對對的就座，還真是怪寂寞的。


  --

  ◆ From: 59.120.44.19'
