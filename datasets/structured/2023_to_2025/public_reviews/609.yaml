title: '[問片］主角爸爸的好友是壞人的外國電影'
content: '手機排版加上敘述流水帳，傷眼見諒


  很久以前在電視上看到的一部外國電影，當時沒看完總覺得心癢癢的，


  印象中的劇情是，主角（姐弟）是富家子弟，某天父母外出卻發生車禍意外死亡，叔叔（

  還是舅舅？）收養姐弟，但其實是為了圖謀她們的家產，所幸父親的好友，一名律師，出

  手相助


  但是，其實這個律師也是叔叔的同夥，他只是為了博取姐弟的信任才假裝幫助她們，主角

  爸媽的意外也是他們策劃的..


  好想知道是哪部片啊，拜託大家了～



  --

  確定不是波特萊爾，剛剛去找了玻璃屋來看，也不是耶...謝謝樓上幾位的回覆，繼續召

  喚小精靈m(_ _)m'
