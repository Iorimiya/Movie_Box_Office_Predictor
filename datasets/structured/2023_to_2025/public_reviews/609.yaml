url: https://www.ptt.cc/bbs/movie/M.1640212851.A.4BC.html
title: '[問片] 問一部年輕褓母勾引爸爸的電影'
content: "如題  這應該是90年代的片子\n\n    我好像是以前在東森洋片還是HBO看到的\n\n    印象很淡  但我記得這部片應該不是什麼有劇情的\n\
  \n    好像純粹就是給女主角賣風騷的題材\n\n    應該就是那種  專為女星量身打造的東西  像是梅根福克斯的\"辣得要命\"的那種\n\n    劇情好像就是念高中還是大學的女主去一個家庭當臨時保母\n\
  \n    這個家庭的夫妻晚上要出去還是幹嘛的  我也不記得只是一晚還是好幾次\n\n    總之就是這個女主天生自帶妲己狐狸精效果  可能還有天子傳奇的天仙銷魂術吧\n\
  \n    我覺得她給我的印象好像是美國心玫瑰情裡面那個金髮女孩\n\n    就是那種懵懂無知的高中妹    自己也不知道自己的行為其實是一直在勾引男生\n\n\
  \    我記得劇情設定是她不是真的跟男人亂搞的  就是個不自覺放電正妹\n\n    然後劇中所有男人都直接被她魅惑\n\n    連那個家庭的男主人  一看到這個年輕小保母\
  \  根本完全失控  一直偷瞄\n\n    好像已經跟太太都出門了  到了朋友聚會場所  又藉口什麼東西忘了拿\n\n    然後想盡辦法跑回來  反正他就是忍不住想跟女主發生關係\n\
  \n    女主好像也有叫朋友來那個家裡陪她  反正當保母沒事做\n\n    然後來的同學好像也想上她\n\n    最後疑似(我不確定)男主人都快跟男同學開打了\n\
  \n    -----------------\n    但我好像記得這部片有個驚悚的結局\n\n    就是男同學好像受了不小的傷  然後這個家的男主人跑到路上被車給撞了\n\
  \n    死了沒我不知道  但是我記得片中給我的感覺是  那車子一撞下去是很嚴重的\n\n    反正最後女主就尖叫\n\n    片尾好像是警察有來  女主驚魂未定吧\n\
  \n    反正整部片女主應該沒跟任何人睡到\n\n    但最後那個結局很警世意味   就是\n\n    色字頭上一把刀\n\n    女主自己也不應該 \
  \ 她覺得勾引男人很好玩  男人就是那個色狼樣\n\n    為了一親芳澤什麼都做  但最後終於害死人  她也留下受創的心靈\n\n    --------------------\n\
  \    我想這部片應該是90年代當時的年輕女明星出演的  應該也是受到力捧的新人吧\n\n    那個時期的話  可能20多歲吧\n\n    可是我一直想不起來她是誰\
  \  如果知道女主的名字就可以查片名了\n\n    請問有人知道我在說哪部片可以告訴我片名嗎??\n\n    謝謝\n\n\n\n\n\n--"
