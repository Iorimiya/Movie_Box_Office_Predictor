url: https://www.ptt.cc/bbs/movie/M.1630759413.A.114.html
title: '[普雷] 尚氣，爸爸忘了把眼神傳給你'
content: '梁朝偉有多強？

  從征戰到鍾情、從喪妻之痛到坦然赴死

  整部就像武打只動一隻右手那樣

  靠眼神就演出了各種情緒。




  其實尚氣的設定也不是沒有厚度

  光是兒時喪母時只敢在旁邊看著，就已經自帶一身悲劇色彩

  通常不是怪罪爸爸的過往，就是厭惡自己的懦弱。


  然而不知道是劉思慕演不出來

  還是梁朝偉的戲份導演捨不得剪太多

  完全看不出尚氣在美國躲了六年

  不得不使出好身手後的心理轉變

  不管是當泊車小弟、跟妹妹重逢

  被爸爸逼回家、想媽媽、跟爸爸搶十環

  全都是都是這個表情：




  （妹妹都比他有感情）


  但基於大羅那忠於山海經的美術表現

  我還是給個普雷

  而且莫里斯實在太可愛了

  希望以後能有跟 Goose 同台的機會



  -----

  Sent from JPTT on my iPhone


  --

  坐等出莫里斯娃娃


  可惜新復仇者要的是年輕人（和便宜的演員）

  其實尚氣的設定只要稍微有點演技

  就算長相不合華人審美還是勉強給過

  然而（略）

  光是墜入愛河跟思念老婆眼中帶淚就很有戲了好嗎

  而且看得出他沒有拿出全力在演，很收斂

  不然在超英片裡會更突兀

  被搞混了

  所以妹妹花了四年就建了一處自己的地盤


  那個跟媽媽交手的眼神根本在放電


  在歐美人眼裡華人上了三十還是童顏


  真沒辦法

  莫里斯裝死的演技都比尚氣強


  武打是真的厲害

  但之後有了十環好像就不是很需要武打

  如果之後打起來都跟最後放大招一樣，會很尷尬


  其實他笑起來還蠻帥

  但礙於家庭問題不能太常笑

  結果變面癱


  這麼毛茸茸的當然要出娃娃ㄚ


  爸爸就是靠這個眼神追到媽媽的


  沒有梁朝偉我無法想像這部會有多慘


  有人說影集《金家便利商店》裡他表現就挺好的

  可能比較適合《蟻人》類型的喜劇片

  苦大仇深身世複雜的超級英雄對他來說太難


  至少情緒轉折觀眾感受得到

  要是我看到失聯十年的哥哥反應竟然是面癱

  我也會往他下體踹過去


  就是山海經裡的帝江 aka 混沌

  大羅裡的神獸都是從山海經來的


  超英片我已經放低很多期待了

  但他真的是面癱到我無法不在意

  以 MCU 的新面孔來說，《黑寡婦》的佛羅倫斯就演技爆表


  到底哪裡像！！


  我覺得彭也撐不起超英的氣場

  但可能年輕+便宜+身手矯健來說

  他就比較帥這樣...


  看到了，官網價 $39.99

  翅膀還可以動，超想要


  他就不適合太複雜的角色

  偏偏尚氣的人設其實層次很多

  懦弱、憤恨、復仇、逃避、最後和解

  但以上的呈現結果只有面癱

  認真的嗎


  可惜尚氣不是喜劇路線

  也靜看他的演藝發展


  徐家四人裡他真的是最不像的


  我比較好奇這部片有哪裡可以看不懂


  值得，說他是真男主不是開玩笑

  光是能看到他和好萊塢級特效演出就很難得'
