title: '[新聞] 稱王世堅爸爸為《返校》主角原形　王浩宇'
content: '稱王世堅爸爸為《返校》主角原形　王浩宇：出賣同學飛黃騰達

  2023.01.15 11:12

  文/謝文哲攝影/王漢順 翁睿坤



  去年底地方選戰高票連任的民進黨台北市議員王世堅，將綠營大敗矛頭指向網軍側翼，頻

  頻在鏡頭前大罵同黨王浩宇是「太監」，王浩宇也不甘示弱在臉書回嗆，雙方數度隔空交

  火。王浩宇昨晚（14日）在臉書宣稱，電玩改編國片《返校》的故事原形中，王世堅父親

  正是出賣地下讀書會、害死同學的人。


  「《返校》故事的原形，其實是王世堅的爸爸。」王浩宇引述維基百科資料PO文，指出王

  世堅的父親王明德就讀台灣大學期間，參與「讀書會」，為了追女生將「禁書」送給女孩

  建立英雄形象，結果女孩不領情將《光明報》刊物隨意亂丟被查獲，導致地下組織線索洩

  漏。「王明德被捕後咬出所有同學、謝雪紅等人。」


  王浩宇宣稱，當時因為王明德的背叛，組織內的同學多遭判處死刑，可最後只有咬出同學

  的王明德為黨國立大功，僅輕判感化教育。「最後同學都死了，只有出賣大家的飛黃騰達

  。」


  針對性如此強烈的貼文引起討論，不少網友諷刺「原來背骨也會遺傳！」但部分綠營支持

  者看不下去，認為王浩宇才說不在乎被罵太監，結果現在直接把人家父母抓出來批鬥。


  不過王浩宇自認只是在還原事實罷了，「有人說我這邊發文很過分，還原事實哪裡過份？

  我覺得太監、草包比較過分吧？」顯然對王世堅的批評耿耿於懷。



  --

  哪邊有一堆新聞？我搜尋返校都沒看到耶

  原來如此，感謝說明！'
