title: '[片單] 想和爸爸一起看的十部電影'
content: '今年父親節剛好又遭遇颱風，風強雨急的

  這個週末如果不便出門，不妨租片 DVD，

  在家和爸爸看部好電影，把難為情說出口的情感化做影像，替你述說吧！



  關於父親的片單在網路上應該可以找得到許多，

  因此我就不再陳腔濫調，再提那些眾所皆知的爸爸電影。 　


  挑了十部，前五部是我覺得經典值得一看再看，

  或者比較沒有這麼熱門的好電影，後五部則是近幾年來的新片，

  都是我喜歡的、又是描寫父親的片型，看看你們能不能猜中幾部！ 　



  圖文好讀版



  --

  分享喜歡的穿搭


  冥王星電台



  --

  好唷 只是我覺得圖文比較好看


  1 最後的嬉皮

  2 末路浩劫

  3 美麗人生

  4 不能沒有你

  5 爸你好嗎

  6 老爸一直都在

  7 星際效應

  8 大法官

  9 內布拉斯加

  10 一首搖滾上月球

  真愛每一天的爸爸總是讓我想到海盜電台的跳舞模樣'
