content: '電影最後一段

  金爸載朴夫人

  買派對食物回程的路上

  朴夫人脫了鞋子

  光腳翹在副駕駛座的椅背上


  金爸因為是司機

  必須忍耐夫人的不禮貌跟腳臭

  卻又同時被夫人嫌棄自己身上臭


  簡單的片段就顯示貧富階級間的

  不平等

  不知道大家有沒有注意到這一幕？



  -----

  Sent from JPTT on my Samsung SM-J330G.


