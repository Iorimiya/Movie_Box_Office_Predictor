url: https://www.ptt.cc/bbs/movie/M.1518923091.A.AD9.html
title: '[好雷]爸爸媽媽看的都開心的西遊記女兒國 '
content: '除夕當天下午全家一起去看西遊記女兒國，電影的表現超過的我的預期。




  劇情沒有拖泥帶水的地方。


  電影也完整了女兒國的這場情關，


  趙麗穎與馮紹峰的一舉一動，每個表情都拿捏的很到位，


  他們的演繹在這場最後只能成全的感情裡都恰到其份。




  也許每個人一生都會遇見只能祝福、放下的人，


  放的下，不代表不在乎，愛是成全。





  電影裡面有很多值得深究的台詞與心情，


  像是：


  「我做了一個夢，你蓄起了長髮，和我一起慢慢變老，但是，你不快樂」


  我們時常都在想改變別人，爸媽想改變小孩，情侶改變彼此。


  卻忘了愛一個人就應該要讓他活成他想要的樣子。





  不過總而言之，這是一部簡單動人的電影，景色優美，笑點不少，也不會太悲催，


  很適合過年期間全家觀賞，爸爸媽媽都看得很開心～～～～






  主題曲連結：








  --'
