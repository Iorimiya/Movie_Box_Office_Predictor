url: https://www.ptt.cc/bbs/movie/M.1565967526.A.6BC.html
title: '[請益] 《寄生上流》二刷，關於爸爸的疑問..'
content: '這部片讓人讚嘆是如影隨形的對比與暗喻


  不是深藏又難懂的對比


  而是能雅俗共賞，普羅大眾都能理解的各種諷諭



  小弟初次觀看時雖對此橋段沒疑問


  但看了各種文章與影評後，二刷時卻突然又有了點疑問


  就是金家爸爸對社長說的一句話




  第一次在賓士車上


  第二次在片末段、要假扮成印地安人那段


  ---


  我初次看時覺得沒有疑問


  是這樣解讀：




  類似我跟你不熟卻問你家住址、感情狀況等等


  或是過年吃飯被問什麼時候結婚，這種讓人難以輕鬆應答的問題




  社長愛兒子但不見得愛太太，他可能是需要一個漂亮聽話、能紓解慾望的對象




  地位卑微的老司機，居然在問愛太太這種事，該不會你覺得他很漂亮


  是你的話，你也會愛他???


  -----


  後來因為看了一些影評


  有一種說法是，這種問話和"韓語的用字方式"


  讓社長覺得之感


  所以感到自尊不舒服



  不舒服到、第二次被問時就變臉、嚴肅了起來?(超尷尬的啊啊啊啊啊)


  不知這個點


  大家是否有其他的解讀方式或發現呢？?


  總覺得自己受限於觀影經驗和對韓國文化的認知


  很多橋段的暗喻都需要別人的指點啊


  請指教了~謝謝


  --'
