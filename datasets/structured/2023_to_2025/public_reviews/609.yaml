url: https://www.ptt.cc/bbs/movie/M.1512570893.A.431.html
title: '[好雷] 極地追擊裡的 Natalie 爸爸是台灣人!?'
content: '18歲的印地安辣妹 Natalie

  現實生活是 26歲美國人 Kelsey Chow

  父親來自台灣

  母親是美國人(看名字是美籍華裔?)

  不過 Kelsey Chow 的長相不講我根本不會猜華裔

  更不要說一半台灣血統


  話說這批私人保全的火力未免太強大了點

  警察的火力又太弱了點

  而且警察不是有避彈衣嗎

  居然近距離槍戰還打輸私人公司保全

  最後要靠前狙擊手獵人來收拾殘局


  補充一點

  我覺得這批保全犯人的行為很不合邏輯

  逃跑應該比較合理吧

  而不是設埋伏想把警察全部幹掉


  死一個印第安小妞來一個菜菜的FBI小姐

  但是如果死一堆警察和一個FBI

  那是另一回事

  本來還有可能逃掉死刑

  這下鐵定非死不可

  總之這批人從頭到尾行為就很怪

  只能說是劇情需要


  --

