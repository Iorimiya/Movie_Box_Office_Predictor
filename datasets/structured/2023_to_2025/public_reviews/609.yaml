title: 'Re: [討論] 第四台很久沒演 他不笨他是我爸爸了嗎？'
content: '這部片真的很厲害！



  不論是西恩潘或達珂塔芬妮，或是飾演律師的蜜雪兒菲佛

  對於這三位演員來說，本片都堪稱是他們的代表作！


  片中飾演收養母親的蘿拉鄧，在這部片中流下的眼淚

  也相當動人，一開始還以為她算是片中的反派呢！

  蘿拉鄧最近剛好有不錯的收穫，滿為相對較沉寂的她感到高興

  也非常期待蘿拉鄧回歸到侏儸紀世界系列！



  由於西恩潘是我看過的演員

  因此沒有誤會他本人是不是真的身心障礙者

  看本片時只有讚歎與佩服


  但，我真的很好奇片中飾演西恩潘定期聚會的朋友們的那幾位

  他們也是演員演出來的嗎？還是真的是？

  有沒有達人可以告訴我答案？

  如果這幾位也是演員表演出來的

  必須說他們都很厲害！


  （不過其中一位我好像有看過他演過別的片

  　但印象模糊、不敢確定~~）



  然後聯想到最近的《花生醬獵鷹的願望》~~







  　　　　　　　　


  --'
