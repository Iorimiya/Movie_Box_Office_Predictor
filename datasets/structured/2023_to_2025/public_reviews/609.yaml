  內容是

  女兒小時候放學回家爸爸在上廁所 女兒進廁所洗頭，自己不好洗 爸爸順便幫她洗

  然後女兒長大後好像是喝醉回家躺了就睡

  爸爸就睡在她旁邊 醒來後被媽媽發現

  然後爸爸還要幫她拉沒穿好的牛仔褲拉鍊

  媽媽很生氣 以為爸爸睡了女兒

  場景大概是這樣 想知道這部片名




