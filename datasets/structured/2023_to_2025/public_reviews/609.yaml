title: '[討論] 阿凡達 義女的爸爸不是實驗員'
content: '原來我看的網路上 阿凡達電影第一集延長版


  還是有剪掉的非後製版


  裡面有說到實驗員與直升機女是一對的


  這樣才合理解釋直升機女跑來救關起來的大家


  要不根本就是一個過場角色


  也解釋了主角為啥要幫忙結束掉原本的首領兒子


  好像是說他的連結頭髮被士兵割掉了


  想起來阿凡達2裡面主角的孩子被抓頭髮


  就類似小貓咪被抓後頸一樣


  被割掉應該是沒救了


  後面還有女主角懷孕的非後製片段


  也就是說


  第一集就決定了女角會懷孕生小孩惹


  唉 第二集肯定有很多轉換場景的時候


  被砍掉一大堆的合理劇情 後勁十足啊


  最討厭這種有續集的了 要等多久啊？


  十年前就決定女角會懷孕生小孩了


  然後第二集十年才拍出來 現在想想未免太扯


  阿既然阿凡達2裡面蜘蛛他們小孩聊天的時候


  說什麼女實驗員和男實驗員搞在一起 才生下義女


  並不是真的 第一集刪減片段中


  是實驗室男和直升機女在一起


  那實驗室女到底是怎麼懷孕生下這個義女的？


  這劇情為什麼會不合理


  就是因為一大堆都很扯啊


  第一集他們全部搬出來小貨櫃


  難不成是男主和實驗室女的？


  腳踏兩條船？



  --'
