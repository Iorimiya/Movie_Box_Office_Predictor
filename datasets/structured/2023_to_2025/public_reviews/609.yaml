url: https://www.ptt.cc/bbs/movie/M.1473228331.A.699.html
title: '[新聞]《屍速列車》7大哭點！最後一幕「給爸爸'
content: '新聞網址：



  《屍速列車》7大哭點！最後一幕「給爸爸的歌」有洋蔥


  記者華少甫／台北報導


  電影《屍速列車》上映以來，3天便突破1億元大關，被看好有望突破3億元關卡，獲得許

  多粉絲跟影迷好評，裡面除了對於人性刻畫描寫到位之外，也有許多感人肺腑、讓人想大

  哭的地方，《ET看電影》特別整理了7大哭點，讓你再一次回味這部經典電影。


  7.孔劉跟媽媽告別

  男主角孔劉（前譯孔侑）在這部電影中，飾演深愛家人的爸爸徐錫宇，除了跟女兒有很多

  對手戲之外，他在列車上，接到母親打來的電話時，電話那頭傳出：「我好愛秀安！但她

  只想著她媽媽！」這句話時，讓許多人內心都起了不少漣漪，是否我們有時都忘記了，最

  在乎、最珍惜我們的，就是家中那位老人呢？


  6.孔劉跟員工對話

  孔劉發現車上有許多屍變的人，並接獲了自己的部屬金主任的電話，得知此次事件全都是

  他們的基金公司救活了某間生技公司所引起，金主任相當自責地問：「徐經理，我們只是

  聽命於人而已，這次的事件不是我們的錯吧？」讓人聽了狂起雞皮疙瘩。



  5.馬東錫、鄭有美生死離別

  馬東錫一夥人，歷經了千辛萬苦，終於到了第15節車廂，卻因為另一頭的生還者不肯開門

  ，與第13節車廂追來的活屍短兵交接，他更因此被咬了一口，眼看屍變在即，他對著孔劉

  說：「我家成景就拜託你了！」並對著成景大喊出自己女兒的名字，許多觀眾看到這裡時

  ，都被這段至死不渝的愛情，感動的潸然淚下。


  4.老奶奶的姊妹之情

  在電影中，有一對老奶奶姊妹，在中繼站時因逃亡而分離，姐姐跟著成景、徐秀安及飾演

  流浪漢的崔貴華待在第13節車廂的廁所中；妹妹則跟著只在乎自己的反派金義成及其他的

  生還者在第15節車廂內，當妹妹看到她以為已經死掉的姐姐來到第15節車廂門前，卻因為

  身邊的人不肯開門，姊姊也變成活屍，氣得直接把門給打開：「一群人渣！」第15節車廂

  也轉眼變成人間煉獄，看著這對雙雙變成活屍的姊妹，你是否也難過地哭了呢？



  3.崔宇植、安昭熙之死

  男星崔宇植飾演的閔英國，跟前wonder girls的安昭熙飾演的金珍熙，在電影中有不少對

  手戲，他們經歷了生離死別，逃下車後，原本以為終於安全了，她卻被從另一邊的車逃上

  來的金義成反推下車，被活屍咬了一口，崔宇植悲憤地抱著她大哭，兩人最後也雙雙成為

  行屍走肉，不勝唏噓。



  2.孔劉之死

  孔劉在擺脫了「活屍洪流」之後，與鄭有美、金秀安在火車上歇了一口氣，卻發現金義成

  也變成活屍，孔劉最後也被金咬了一口，屍變在即，想起了昔日金秀安剛剛出生、還在襁

  褓之中的模樣，超級感人；此外，她在火車上大喊：「爸爸！不要走！」他跌下火車的那

  一幕，也都讓許多觀眾大噴淚。



  1.金秀安在山洞中唱給爸爸的歌

  最終，鄭有美跟金秀安活著來到了釜山，走出山洞前，卻險些被射殺，幸好金秀安唱出當

  時要唱給爸爸聽的歌，才被認定為是生還者，但歌詞卻相當催淚，「我們來世還會再相見

  ….」堪稱本片的最大哭點，電影也在此時畫下句點，留給觀眾無限想像。


  --'
