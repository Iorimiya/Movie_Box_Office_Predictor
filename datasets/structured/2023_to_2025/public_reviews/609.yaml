  因為爸爸超愛布袋戲 (霹靂布袋戲)


  所以想帶爸爸去看


  但我跟妹妹兩個女孩子對布袋戲沒興趣


  每次爸爸在看我們都會做自己事情


  小時候會跟著看 但看不懂XD


  不曉得對我們兩個會不會看到無聊睡著呢?


  另外爸爸年紀大了 如果太複雜的劇情 或是畫面一直跳動閃爍也會很吃力


  所以想問問大家意見~ (但我個人是覺得霹靂布袋戲也很閃爍拉XD)


  謝謝~~


  --'
