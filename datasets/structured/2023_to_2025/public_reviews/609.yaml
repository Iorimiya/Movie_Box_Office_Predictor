url: https://www.ptt.cc/bbs/movie/M.1512613111.A.D69.html
title: 'Re: [好雷] 極地追擊裡的 Natalie 爸爸是台灣人!?'
content: "節錄自IMDB:\n\nKelsey's father was born in Taiwan and raised in Africa. Kelsey's\
  \ paternal\ngrandparents moved from Mainland China to the Island of Taiwan in 1948.\n\
  Kelsey's mother is a white American, of English and German descent.\n\n她爺爺1948從大陸到台灣，估計就是撤退的那群。她老爸是出生在台灣，\n\
  但是在非洲被養大@@。媽媽則是美國白人，是英國與德國的後裔。\n\n這樣混出來可以像印地安人也是很奇妙....\n\n其實警察會打輸保全真的不用太意外:\n1.\
  \ 那種地方的警察本來就不是專業的特種單位，\n   但是很多私人保全反而都是特種單位退役的。\n   光看兩方使用的槍枝差異你就可以看的出來了。\n\n2.\
  \ 警方明顯無戒心，你看他們很晚才發現私人保全圍住他們(flanking)\n   私人保全早已經有交戰觀念了。\n\n3. 不全滅怎麼顯出鷹眼的厲害，人家給弓箭都可以殺外星人了，\n\
  \   你給他獵槍還不飛上天。明年人家還要準備打薩諾斯了呢。\n\n4. 女巫是因為女主角威能，不然她肯定死，\n   對方用的槍在近距離防彈背心應該還是會擊穿。\n\
  \   後來被發現沒死，人家也沒有當頭再補一槍。\n\n5. 是說這些私人保安這麼囂張也不意外，那邊荒郊野嶺的，\n   他們搞不好又是紀律很差被退出特種單位的那種人，\n\
  \   可能根本就不是第一次強姦殺人了，殺警察也不意外。\n   看現實生活的影片，歹徒對美國的警察基本上也沒有在客氣的。\n\n\n--\n一般FBI公發的防彈背心軟式的大概只有II,IIIA的水準。\
  \ III以上的是有防彈插板，\n女主角穿的看起來只是軟質的(II,IIIA)，這種近距離初速超過500m/s大概就黨不住了。\n我是沒印象保安用哪種步槍，但是如果是類似AR15或是M4系列的步槍，\n\
  初速幾乎都超過800以上的，這種除非硬質有防彈插板的防彈背心，不然都一定穿。\n\n拖上去就好了，人家鷹眼耶...\n\n最常見都是海陸或是三角洲退下來的，普通警察碰到大概都會死傷慘重。"
