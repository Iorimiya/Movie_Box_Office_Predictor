url: https://www.ptt.cc/bbs/movie/M.1422069535.A.FEA.html
title: '[問片] 爸爸以及女兒'
content: '這部可能有點久了，西洋片


  沒看到最後，內容是父親好像是警察還是CIA什麼的~身手很好


  跟女兒感情有隔閡，片段記憶是有次女兒去PUB玩，


  被搭訕在廁所被圍住的時候爸爸前面詢著線索找到把他女兒帶出來，


  還揍了搭訕女兒的人，此次英雄救美後女兒才承認爸爸，


  爸爸好像會騎怪怪顏色的單車載他上學還是接她放學忘記，


  記得出任務常常會把敵人綁回家拷問和逼迫問出線索，


  其中有個被主角逼迫的人，也是有家人，有一對超正雙胞胎女兒，印象深刻!


  主角父親有衝去他家問事情~片中很多地方很搞笑


  記得主角父親家裡有被陌生人住，


  主角父親家裡有藏很多槍枝武器，


  不是即刻救援~



  --'
