title: '[問片] 爸爸爸小女孩丟在樹林裡'
content: '忘記開頭跟結局了


  記得的片段是

  一開始爸爸跟女兒都在樹林裡露營

  女兒好像穿童軍衣服又好像不是

  然後隔天早上女兒醒來發現他爸消失了

  只看到他爸留了東西在小女孩睡醒的旁邊

  印象中是一根針 有沒有水壺我忘了


  然後接下來的劇情就是女孩自己走出那片森林

  好像有小女孩自己走穿過河之類的


  我印象真的很薄弱嗚嗚嗚 我也忘記他最後到底有沒有走出去了


  --

