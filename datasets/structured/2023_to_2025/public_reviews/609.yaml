title: '[新聞] 侏羅紀世界克里斯帕特悔:來不及見爸爸'
content: '好萊塢影星克里斯帕克曾以「星爵」一角竄紅演藝圈，後來接演《侏羅紀世界》再度翻紅

  ，成為媒體關注的新寵兒。日前他接受訪問，坦承在拍攝《侏羅紀》時為了不耽誤拍攝進

  度沒能見父親最後一面，為此感到相當懊悔，消息讓網友得知後都替他難過。


  克里斯帕特面對父親過世消息，選擇不打擾其它人獨自面對，不影響劇組拍攝。（圖／翻

  攝自Youtube、取自克里斯帕特臉書）

  克里斯派特不僅在片場是逗樂劇組的開心果，先前在節目上還穿著高跟鞋模仿女人走路，

  幽默風趣的談話內容深受許多觀眾喜愛。日前他接受媒體訪問時透露一件難過的事，在拍

  《侏儸紀》期間得知父親驟然過世的消息，但他覺得當一個電影的主角應該要展現負責的

  態度，不能耽誤劇組拍攝，在拍戲空檔時把自己關在房間裡獨自傷心、發洩情緒，還曾動

  起吸毒的念頭。


  事實上，克里斯派特在20歲時就得知爸爸罹患神經系統失調的疾病，父親為了不干擾母親

  的生活選擇分開，搬到療養院居住。而當他面對父親去世的消息時，不僅不打擾其他人、

  不耽誤劇組拍攝進度，選擇獨自面對難題，讓許多得知消息的網友都替他心疼難過。


  --'
