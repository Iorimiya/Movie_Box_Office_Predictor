content: "「阿爾法爸爸」(Alan Partridge: Alpha Papa) - 溫馨鬧劇\n\n圖文完整版： \n\n廣播電臺的資深DJ：Alan\
  \ Partridge﹝Steve Coogan﹞，他的公司被買走了，新\n老闆裁掉另一名跟Alan差不多老的主持人Pat﹝Colm Meaney﹞。無法接受事實的\n\
  Pat，乾脆持槍挾持一群前同事，而Alan被警方請去解除人質危機，沒想到Alan\n把這當成曝光好機會，總是在算計如何從中獲得好處...\n\n\"Alan Patridge\"\
  是由Coogan扮演了近二十年的虛構角色，之前主要出現在廣播\n與電視節目裡，以及網路節目，甚至還出了假自傳，「阿爾法爸爸」是此角色的\n第一部電影。某些層面上，可以說Alan\
  \ Patridge是威爾法洛的Ron Burgundy﹝\n電影「銀幕大角頭」﹞及Ricky Gervais的David Brent﹝影集「辦公室風雲」﹞\n\
  的原型／祖師爺。長期與Coogan合作Alan Patridge系列的製作人Armando\nIannucci，也是HBO的影集「副人之仁」(Veep)與英國政治諷刺片「人人有份」\n\
  (In the Loop)的編劇。\n\n不過，不熟悉Alan Patridge這角色的朋友不用擔心，本片在開頭很快地就讓觀\n眾進入狀況，了解Alan的諸多特質。Alan這角色的自我大得不得了，對自己感覺\n\
  非常良好，又非常重視私利，也因此特別可笑。他眼中的自己，與他人眼中對他\n的看法，兩者差距非常大。但是不管他怎麼糟糕，這人就跟蟑螂一樣，很會生存\n，他的人生哲學就是他在片中的一句話：\"\
  What do you do with bullies? You\nmake friends with them so they bully someone else.\"\
  \n\n喜歡英式幽默的朋友很適合看「阿爾法爸爸」。有不少笑點真的頗讚，例如，\nAlan原本受託去董事會替Pat求情不要裁員，但偷偷發現董事們認為不是Pat走就\n\
  是Alan走時，Alan馬上開始很明顯地暗示Pat的缺點──熱心參與工會活動以及\n是個愛爾蘭人。Alan跟助理坦承此事時，又為自己辯解：「這不能算協助自殺，\n\
  我只是帶他飛去瑞士並且填幾張表格罷了」。其他還有婚姻笑話、育兒笑話、回\n教基督教猶太教的笑話，還有一段提到\"Shitshank Redemption\"的真是笑死我...\n\
  這些就留待各位自行發現了。另外，英式喜劇最擅長的，就是能很成功地在悲傷\n中找到幽默，能夠勝任這種以尷尬、「不蘇湖」情境為主題的喜劇。本片步調很\n快，最慢的時候是警車追嫌犯的時候﹝這也是一個好笑的笑點﹞，所以就算第一\n\
  個笑話不好笑，很快就會有第二個、第三個、第四個，再加上整部片只有精簡的\n一個半小時，因此不會讓人感覺無聊。\n\n看「阿爾法爸爸」前段劇情的時候，主要是看Coogan扯一堆搞笑屁話，但越到後\n\
  面，就越接近本片的溫暖核心，站在小人物立場來看世界的時代變遷，搭配上\nJohn Franham的\"You're the Voice\"，雖然很夢幻、不太實際，但倒是能給人溫\n\
  馨快樂的心情。「阿爾法爸爸」就是一部充滿英式搞笑、劇情讓人暫時逃避現實\n的喜劇，適合想要放鬆心情的朋友觀賞。\n\n--\n\n我的部落格 \nFB粉絲團 \
  \ \n\n--"
