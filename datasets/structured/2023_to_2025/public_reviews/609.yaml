title: '[問片] 1.韓國爸爸得癌症2.英國媽媽生氣'
content: '想問兩部片的片名，

  第一部是韓國片，家庭成員有爸爸媽媽哥哥姊姊妹妹，記得妹妹名字好像叫星兒，姊姊叫

  月兒，描述爸爸擔心自己得癌症的故事。他們家是基督徒有去教會的劇情。姊姊喜歡街頭

  表演。


  第二部是英國片，

  劇情開頭是AB兩對夫妻在吃晚餐，原本氣氛很和諧，AB是閨蜜，但A的先生突然暴氣讓A很

  尷尬，A後來因為生氣又做了很多事。AB兩對夫妻都有小孩，A外型是深棕色長髮的白人媽

  媽。B是精明能幹的暗金髮媽媽，電影氣氛有點緩慢。


  這兩部都是我在飛機上看的，所以片名真的記不得，第一部中文可能是最後的道別，但不

  是我Google到的那部，第二部可能跟罪咎之類的有關，但也不記得了QQ


  --


  沒錯就是這部，太感謝您了！英文是My last love, 也有翻成 剩餘的愛。


  看了並不是...是跟外遇的議題有關的片>”< 但還是謝謝您回答'
