url: https://www.ptt.cc/bbs/movie/M.1500735072.A.BA6.html
title: '[新聞] 遺憾！《小鬼當家》 爸爸陳屍飯店房間　'
content: '遺憾！《小鬼當家》 爸爸陳屍飯店房間　享壽72歲


  美國男星約翰赫德（John Heard）在1990《小鬼當家》系列電影中飾演男主角麥考利克金

  的爸爸，今卻傳出他陳屍在飯店房間，被飯店清潔工發現後報案，警方宣判已當場死亡，

  享壽72歲。


  約翰赫德活躍於80、90年代，大小銀幕作品眾多，包含《飛進未來》、《神鬼拳王》、《

  小姐好白》尤以《小鬼當家》最為知名。1999年以影集《黑道家族》入圍艾美獎最佳客串

  演員獎。


  美國TMZ網站報導，消息人士透露赫德是被飯店員工發現陳屍房間內，警方接獲飯店報案

  後到場急救，但隨即宣告死亡。驗屍官仍在調查確切死因，尚待驗屍報告出爐。根據赫德

  的發言人，他周三在史丹佛醫學中心接手小型背部手術，他入住飯店是為了安心休養，沒

  想到卻發生憾事。（謝宛儒／綜合報導）





  --'
