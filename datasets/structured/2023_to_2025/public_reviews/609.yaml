url: https://www.ptt.cc/bbs/movie/M.1626186569.A.151.html
title: '[新聞] 【踏遍50萬里路】 電影《失孤》真實爸爸2'
content: "新聞網址：\n\n\n流行 上戲 【踏遍50萬里路】 電影《失孤》真實爸爸24年後終於找到兒子　\n劉德華感動：佩服你的堅持\n\n上報流行 2021年07月13日\
  \ 17:30:00\n\n2015年由劉德華主演的電影《失孤》，改編自真人真事，\n講述一名農民花了15年尋找失蹤的兒子，無論歷經任何辛苦都不曾放棄過，\n\
  但電影結局這位農民並沒有尋獲兒子。\n\n但近日卻傳來好消息，故事中的角色原型郭剛堂證實已找回失蹤24年的兒子郭新振，\n劉德華聞訊也透過影片開心送上祝福，「佩服你的堅持」！\n\
  \n郭新振2歲時被人拐走，當年27歲的郭剛堂從此展開尋子的漫漫長路，\n一共走了50萬公里，踏破了10輛機車，不管再辛苦都不曾放棄，\n他曾說：「只有在路上，才覺得對得起兒子。」他尋子故事拍成電影《失孤》\n\
  後引起高度關注，但郭剛堂仍沒有兒子的消息。\n\n\n今年2月，郭剛堂透過用抖音拍攝短片，除了持續尋找兒子下落，\n也分享拐帶兒童的安全訊息。皇天不負苦心人，他終於找到現年26歲的兒子郭新振，\n\
  並透過DNA驗證確實為親生父子，結束24年漫長的尋子之路\n\n《失孤》導演彭三源也透露住在河南的郭振，一直生活在距離郭剛堂不遠的地方，\n「慶幸的是，（郭剛堂的）兒子成長得很好。願天下再沒有這樣的悲劇，願人間美好。」\n\
  日前郭剛堂與妻子張文革與兒子郭振經安排之下認親相見，妻子張文革激動地說：\n「我的寶貝找回來了！我的兒啊！」而郭剛堂抱著兒子一度激動到泣不成聲，\n場面動人，惹哭不少網友。\n\
  \n 劉德華得知好消息後，立刻錄製影片祝賀，「因為一部電影《失孤》，\n我認識了郭大哥（郭剛堂），今天我感到非常開心也非常振奮，\n因為郭大哥被拐24年的兒子，在公安機關的努力下，終於跟家人團圓。」\n\
  並表示非常佩服郭剛堂的堅持。\n\n\n美彩蛋！劉德華賀《失孤》原型找回兒 歷24年50萬公里終團圓｜鏡週刊\n2021年7月13日\n\n\n==\n@@\n\
  \n真的找到了…，隔了24年，找回26歲的兒子，\n\n滿感動的，也希望這種結局能更多一點，\n\n希望天下破碎的家庭都能團圓。\n\n\n\n\n--"
