title: '[問片] 為了一把雷射槍去救被綁架的爸爸(有雷)'
content: '各位電影版的大大好：


  很久以前看過的一部西洋片

  劇情大致上都還記得

  就是片名想不起來

  用google關鍵字也找不到TT

  麻煩大家幫忙找片名了


  1.最一開始是一個男主角偽裝(貼假鬍子)混入一個由壞人舉辦的雷射槍發表會，之後把槍

  偷走


  2.男主角開玩具店、家裡的庭院有一個紅鶴的裝飾，下面是他兒子和他朋友的秘密基地


  3.壞人為了奪回雷射槍綁架男主角，因為男主角一直不肯說出雷射槍在哪裡，壞人準備要

  對他做開腦手術，直接讀取雷射槍的下落


  4.壞人是一男一女，男的有一隻腳是機械義肢


  4.男主角的兒子和他的朋友利用玩具店裡的道具，闖入基地，救出男主角


  5.結局是小孩子們和男主一起利用一塊塑膠布上面用水槍噴濕後，從基地的圍欄下滑出去

  ，雷射槍最後爆炸，男壞人的義肢被炸到飛出來


  麻煩大家幫忙了m(><)m

  -----------

  已經找到片名囉！

  片名是：戰略突擊手(1996)


  --

  因為那個雷射槍的發表會是壞人舉辦的（我補充上去）'
