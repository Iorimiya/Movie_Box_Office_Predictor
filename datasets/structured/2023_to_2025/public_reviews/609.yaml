title: '[微好雷]我的爸爸是壞蛋冠軍 '
content: "雷文防雷資訊頁\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n1.影片名稱\
  \ :我的爸爸是壞蛋冠軍\n\n2.觀影時間 : 拒答\n\n3.觀影地點 : 拒答\n\n4.觀影方式 : 自行購票\n\n§其他防雷說明(非必要) : n刷等其他說明請於此區說明....可留空\n\
  \n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n此區為發文防雷頁\n可選擇性提供上列 1~4\
  \ 資訊  或不提供亦可\n觀影心得於分隔線下方發布即可\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n圖文網誌版:\n\n身為摔角迷&日劇迷，此部我的爸爸是壞蛋冠軍列為今年我第一部看的電影\n\n劇情架構很單純的描述親子關係，身為摔角迷很快的就能進入劇情的狀況\n\
  \n\n這部不需要再去討論職業摔角的真假，而是很開門見山的就說\n\n[職業摔角需要正派與反派，來娛樂大家，光是只有英雄，那多無聊啊!!]\n\n若還是想要了解摔角的電影，可以找找之前米基洛克的-力挽狂瀾，或是台灣的摔角紀錄片-正面迎擊。\n\
  \n劇中裡的反派?!擂台上的大正派-岡田和睦飾演的飛龍喬治\n\n出場時的姿勢也讓我笑到噴飯\n\n\n在原作繪本裡，飛龍喬治比較像早期的棚橋弘至\n\n留著短髮，挑染金色的造型。\n\
  \n\n其他演員裡面，仲里依紗飾演的女編輯兼摔角鐵粉最讓我吸睛\n\n更勝木村佳乃所扮演的媽媽角色。\n\n摔角迷演的很道地，職業摔角在粉絲裡面猶如神聖一般的存在，不容絲許的汙衊。\n\
  \n大泉洋演的是機車上司，但戲份並沒有很多，讓電影看起來稍微有點日劇風這樣。\n\n\n說到摔角手的部分，就是田口隆祐扮演的蒼蠅哥，不愧是演技派啊。\n\n尤其不斷搓手那部分，真的很像蒼蠅啊XDDDDD\n\
  \n\n身為溫馨小品的電影，全台上映的戲院不多，但很值得推薦有小孩的爸爸媽媽來看這部。\n\n教導孩子爸爸媽媽工作的多元性，即使是做工、黑手、甚至是檳榔西施等\n\
  \n都是努力辛苦工作來成就這個家庭的。\n\n最後，好想買個飛龍喬治的糖果啊~\n\nXD\n\n\n\n\n\n\n\n\n\n\n\n--\n§§§§§§§\
  \ 霹 靂 ／ 佛劍分說武戲 (往生咒) 曲：阿輪  §§§§§§§\n\n          南無  阿彌多婆夜  哆他伽多夜  哆地夜他\n  ◎◎◎  namo\
  \  amitabaya   datagadaya  dayata om               ◎◎◎\n ◎◎◎◎                  \
  \                                    ◎◎◎◎\n  ╲˙╱  阿彌利都婆毗  阿彌利哆  悉耽婆毗  阿彌唎哆  毗迦蘭帝\
  \  ˍ˙ˍ\n\n--"
