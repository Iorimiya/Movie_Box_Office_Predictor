url: https://www.ptt.cc/bbs/movie/M.1465825002.A.71C.html
title: '[討論] 他不笨，他是我爸爸(I Am Sam)觀後感嘆'
content: '文中只有微微雷




















  看完這部感人的電影後，腦中浮現幾個議題想和各位討論，

  其中如有錯誤或可以加以討論的地方敬請指教。



  1.現今電影議題類型的多寡是否變少了？


  其實這個問題應該是針對美國電影問的，是因為題材真的都寫光了，編劇想不出

  新梗了嗎？還是是台灣代理的電影種類變少了(因為台灣人的口味所致)？


  像I Am Sam這種沒有大起大落，沒有華麗CGI，但是卻樸實、令人感動、且會讓人進一步

  和自己對話的電影就我自己的感覺這幾年來比較少出現(如果有的話再請版有推薦)


  現在變成只好開始往回以前的年代找電影來看了




  2.說到以前的年代...


  其實我也在想，會不會是現在科技社會環境的變遷，也會影響電影的編劇，甚至是

  觸動情感的程度呢？

  舉例來說，電影中當Sam被法院裁示必須跟女兒分開且只能偶而探望時，就是一段

  扣人心弦的，彰顯出女兒對爸爸之愛的過程---爸爸默默搬到附近，女兒深夜偷溜出去，

  到寄養家庭的媽媽發現他給不了和Sam一樣的愛的過程。


  如果是現代呢？


  晚上女兒就會拿著iPAD跟他老爸Facetime、SKYPE，然後平時也會Whatsapp, Snapchat，

  然後西恩·潘就會用他那精湛的演技再在各種社群媒體上製造笑果...FU就沒了...



  我想最觸動人心的是分離、離別、可能再也見不到，這在以前很容易塑造，現在科技加

  持下則否，也無怪乎現在也常見許多電影乾脆特地最年代設定，設定在智慧型手機出現

  以前的時間。




  3.電影(主要是美國)的下一步是什麼？


  難道只能回頭往以前找電影來看了嗎？

  其實，我猜想或許電影的題材、種類的重心集中在哪Maybe就像鐘擺吧，當某一類型

  真的一直出現後，觀眾也會看膩，市場自然就會篩選，盪向另一邊了。又或許大家常常

  特別獨鍾伴隨著自己成長的電影，把他們視為標竿，或是重要的(畢竟是自己第一次看的

  各種類型)，所以當隨著年紀增長後出現的類似題材、類似劇情，都會覺得沒那麼

  有「感」了。




  以上，抱歉語句可能有點雜亂，不通順之處請多多包涵！



  --'
