url: https://www.ptt.cc/bbs/movie/M.1448177839.A.7AA.html
title: '[問片] 小氣爸爸帶全家人去希臘旅行的電影'
content: '如題

  劇情是有一個非常小氣的爸爸原本以為要出差去希臘，想說可以帶全家人去旅行

  結果臨時又被告知不用去了，但怕家人失望就自己花錢帶全家人去

  去到飯店後吝嗇的個性一覽無遺

  要求全家大小一定要利用到飯店設施回本

  還會記在小本子裡今天賺了多少錢

  電影裡還有一個很倒楣的女生一直跌倒受傷，最後發現是爸爸主管的女兒

  算是蠻輕鬆愉快的喜劇片

  但我Google了希臘/小氣/全家旅行/爸爸 關鍵字都找不到

  想請大家幫幫忙，想不起來好痛苦噢!


  --

  對啦!!!謝謝m大!'
