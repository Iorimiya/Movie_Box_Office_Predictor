title: '[問片] 爸爸尋找女兒的電影'
content: '如題，這是部老片，記得當時超想看的但快段考了就沒辦法看了…。距今約1x年前。


  影片大至內容是，父親要尋找消失的女兒，最後好像是在一個不存在的房間找到的，而這部片特別的點是，影片中，好像有4～6種的★神幻道具★(忘記到底有幾樣了，抱歉)。


  而父親拿的道具是，一把能開任何門的鑰匙，同時，被開的門成了任意門。


  另項，我記得的道具是梳子，用此梳，梳頭髮的人，能使周圍時空靜止，但是不能夠改變靜止物體的位置，但可以在裡面亂跑，而其他人會覺得用梳子的人，有瞬間移動的能力………。


  大至上，我記得的電影內容是這樣，可能有點少，抱歉了,


  但我真的很想知道片名是什麼～


  謝謝～


  --'
