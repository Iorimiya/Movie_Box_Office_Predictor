url: https://www.ptt.cc/bbs/movie/M.1522500309.A.69A.html
title: '[問片] 兒子與爸爸(捐精者)交往的西洋片(雷)'
content: '抱歉標題可能聳動了點



  故事劇情是這樣的，男一和男二是從大學就認識的好基友(兩人目前都是熟齡大叔)


  兩人會固定時間一起看球賽維持友誼和默契


  彼此都知道對方是甲甲，但兩人沒有超過友情之外的舉動，算是友達以上戀人未滿的關係


  男一是新聞台主播(或是主管?有點忘了)，男一比較屬於夜店咖，常常換男朋友


  男二的職業我忘了不過男二比較宅，交過的男朋友比較少


  但兩人各自的感情狀況都不會影響到彼此之間的友情


  直到某一天男一的公司來了個剛畢業的實習小弟


  因為小弟弟對男一有意思，而男一也有查覺到，兩人就自然而然就交往了


  不過可能是因為小鮮肉的關係，男一跟以往態度不太一樣


  甚至影響到了男一與男二之間固定的球賽時間，惹得男二很不爽


  結果是那位實習小弟是男一年輕時捐贈的精子所生下的


  因小弟弟很想知道自己的親生父親是誰，所以透過各種辦法查到了自己的親生父親


  又得知親生父親(男一)是在該領域蠻有名的人，產生了崇拜進而想更了解男一


  殊不知當他接近男一後被他的魅力所吸引也不管亂不亂倫地就這麼交往了


  男一知道後也相當崩潰，男二也在旁開導和勸分，不過之後結局如何收尾我就忘了....



  昨天看完handsome devil後讓我想到這部之前在MOD看到的片


  有點想再看一遍男一和男二之間的互動，但是我找了好久都找不到


  去翻MOD的網頁也沒辦法看到完整的片單，也有可能已經下檔了


  求求有沒有大神知道這部片的片名好讓我去重溫一下劇情，拜託大家惹感恩



  --'
