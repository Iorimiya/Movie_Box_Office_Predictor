url: https://www.ptt.cc/bbs/movie/M.1462199243.A.7B5.html
title: '[好雷]美國隊長3之有個富爸爸'
content: '以下是個人心得，如果戳中你是靠爸族請左轉跳出

  防爸頁
















  先講結論:最後是鋼鐵人贏了，

  因為它有個有錢爸爸送美國隊長盾牌，

  鋼鐵人說:那是我老爸打造給你的

  於是美國隊長把它丟給鋼鐵人，

  就等於沒了手腳一樣，

  有爸靠就贏了一切.



  劇透關點:

  只能說有個富爸爸靠在美國隊長3看得到，

  先說一開始鋼鐵人連打擊犯罪救人之類的的事都沒出現，

  因為美國隊長沒人靠做的事情都是錯的，

  救自己朋友巴奇錯了嗎?

  聯合國要約束人，鋼鐵人就開始想巴結長官，

  就因為有錢要大家簽，又沒出陣去救人就開始命令別人，

  然後就開始搞獨立要分裂~


  中間因為巴奇有美國隊長靠，因為美國隊長夠力，夠義氣，夠朋友，

  才能幫巴奇度過很多難關，

  鋼鐵人因為老爸很威很有錢，中間丟了一組古董超貴的鋼筆給美國隊長簽，

  美國隊長因為被爸氣所怒，所以始終都沒簽約合同~


  中後開始集結英雄稿內戰，

  鋼鐵人因為有錢找到蜘蛛人幫忙，

  中間談的過程免不了錢來錢去，

  而美國隊長因為夠義氣夠朋友，

  靠自己沒錢也找到夠挺的蟻人和其他兄弟幫忙，

  內戰後黑寡婦最後也幫忙美國隊長，

  不是因為美國隊長很有錢，

  而是那銅臭的黑豹根鋼鐵人一樣，有著靠爸的氣息，

  黑豹出場就說:我有個有權利有勢力最重要有錢的老爸的~

  可見黑寡婦不是那種見錢眼開的女人，


  最後近到九頭龍蛇的基地，

  開始一連串的內戰，

  就因為鋼鐵人富爸爸掰了，是沒錢沒勢力的巴奇幹的，

  鋼鐵人一直問美國隊長說:你知不知道我老爸是誰?你知不知道我老爸是誰?

  開始啟動爸爸我不能沒有你的攻擊模式攻打巴奇，

  當然美國隊長勢必要阻止這場惡戰，

  打敗到巴奇少一條手，美國隊長失去盾牌才甘願!!


  最後因為美國隊長自知沒富爸爸真的很難過，

  於是給隻智障型手機給鋼鐵人可以聯絡給鋼鐵人靠，

  想當然鋼鐵人都是高科技鋼鐵人自製手機，

  怎會瞧得起美國隊長這又窮又復古的智障型手機呢?


  所以電影內涵就是:美國隊長醒醒吧~你不是個有錢的富爸爸


  番外篇:

  鋼鐵人有錢可以幫朋友上校打造鋼鐵義肢，死馬都能當活馬!!

  美國隊長沒錢，只能送朋友一付棺材冬眠，而且也沒有義肢，繼續斷手!!







  鋼鐵人一出場就說我很有錢來吧，大家都要聽我的，

  合約大家都簽就美國隊長沒簽就錯了，

  因為美國隊長沒有人靠還在那使喚別人，
















  --

  不能爆雷給1F

  商業片跟什麼有關？

  那黑豹的成就靠誰？

  那時候沒有現代高科技...

  真的

  心得文你也可以分享你的

  你給我100分我也沒爸靠

  哈 實在

  你說的算

  講錢不好

  沒關係 請分享心得給別人

  時勢造英雄 英雄造時勢 剛好時勢很靠爸

  很難判定 但都爸靠是真的

  只是靠爸 哈'
