url: https://www.ptt.cc/bbs/movie/M.1472994322.A.879.html
title: 'Re: [超好雷]屍速列車-爸爸們本來就比較吃虧 '
content: '原PO寫好好。


  想回的只是小點，但怕推文太長，不好意思直接回文了。






  看完這篇，兩組人馬的對比變得好清楚


  站務員完全是13車廂邪惡質變沒法回頭的代表。


  但我的感覺是，13車廂的人並不是不確定主角群是否感染才趕他們出去，


  他們其實知道最後跑進車廂的人並沒被傳染，


  但主角群的存在提醒他們曾經做過如此生不如人的決定(就像剛開始的男主)，


  只是當下的他們過於軟弱去承認錯誤，


  壞大叔很明白，也利用這點(他的理想是盡可能不被任何不聽話的人拖累)，


  當他被男主揍罵，立刻以這些人可能感染活屍來反擊，大家才一呼而應，


  如果他們真覺得主角群被感染，恐懼杜絕早來不及，哪有空叫囂，


  他們喊著快走的眼神滿是心虛，那眼神與活屍相比真是悲哀的相似




  哈哈哈我倒是覺得他前面把一般人不自覺的冷漠感詮釋得很好，


  自私不那麼根深蒂固的存在這些人身上，


  而是因為工作的追求與生活的磨難，由越來越多不耐累積而成，


  跟女兒告別那邊，孔劉把身為一個爸爸不甘、軟弱、捨不得與愛演得好好（哭）


  那個形象與馬大叔勇猛的形象不太一樣，


  反而讓我很驚豔，他還不沒當爸爸啊




  嗚，做為不太看喪屍片的觀眾，


  這齣喪屍讓我感到害怕的原因正是他們還有「人味」，


  前半場被嚇到崩潰的點也在於要在那麼短的時間內判斷對方是人是喪屍，


  太難接受，太無助了


  尤其是先屍變的奶奶，被夾在車窗前還是那樣善良無知的樣子，


  清醒的人在生死危機之間很難不徬徨。（棒球隊的年輕孩子也因此崩潰）



  一直很好奇，屍變前一刻展現的是那個人的什麼？


  第一個跳上列車的人不停說他錯了對不起、對不起，


  男主的媽媽是交代他要對女兒好一些，還有她對她那麼好結果她只想找媽媽，


  壞大叔拜託男主帶他回家，他媽媽在釜山的家中等他


  男主是女兒出生抱著她的畫面。



  大家都說，釜山行真正可怕的不是喪屍，而是人性。


  其實，喪屍＋列車不過是把生死壓到極限的考驗，


  回頭看，似乎每種選擇都情有可原，


  也因此，看完後勁特別強烈吧。



  --'
