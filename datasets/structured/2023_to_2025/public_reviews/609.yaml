title: 'Re: [負雷] 想問爸爸去哪裡？的紅衣小女孩2'
content: '雖然我對這部片整體是給正面評價

  大推演員的表現

  楊丞琳由內而外的勇敢堅毅、許瑋甯非人類演出

  甚至很多人在鞭虎爺和魔神仔的特效方面我也給正評

  但是原原po所講的理由非常充分


  你說故事情節非得從墮胎下手或許是真的

  但是一個故事有百百款詮釋的方式

  可以同時將墮胎和不墮胎的難處呈現

  可以呈現社會壓力之下的女性處境

  還有面臨未婚懷孕的身心掙扎

  這些詮釋角度其實並不會讓恐怖片失色

  然而這部片幾乎沒有著墨，有也是輕描淡寫

  選擇的就是一個最廉價的方式：讓「母親」承受所有的責難和責任


  反諷的話，我想到的是另一部《健忘村》

  對於女性理所當然地對待，那個才真的叫人從骨子裡發寒


  母愛偉大的這種劇情其實2002年的《鬼水怪譚》（仄暗い水の底から）就有

  當年看我也是感動到一把鼻涕一把眼淚的，但回過頭來看也真的充滿刻板印象啊


  劇情的轉折本身是不足的，但主要還是因為演員演得滿有說服力的所以可以接受


  而且角色本身自己積的陰德值也滿夠的

  例如：

  身為社工的李淑芬在前往救援受虐兒時，一股無畏的正氣

  林美華託孤給沈怡君，沈怡君也是義不容辭地保護小詠晴

  這是她們在身為母親的身份之外的無私之舉，給角色加了不少分

  小帥虎至少也是擔心女友，為了女友失蹤兩肋插刀（其實只有一邊），而非射後不理


  「好人」之所以是「好人」，是因為這些人做了無私的義舉

  當然也可能做了錯事

  但至少看起來會是有缺點的好人，或是做了錯誤決定的好人

  而不是用單一的價值觀來捆綁「好女人就不該墮胎」

  更何況如果是美德的話應該男女都適用啊







  --

  So "Shame" is autobiography?


  --'
