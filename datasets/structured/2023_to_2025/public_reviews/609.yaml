url: https://www.ptt.cc/bbs/movie/M.1413379523.A.212.html
title: '[好雷] 我的意外爸爸'
content: '一直都很喜歡日本電影平淡卻細膩的敘述手法

  看似平靜的表面下卻牽扯著不同角色的矛盾心情

  讓人就算看完了思緒卻仍然停留在電影當中


  －－－


  《我的意外爸爸》的英文片名《Like Father, Like Son》(有其父必有其子)

  我認為似乎更貼近電影中的矛盾情節

  畢竟比較意外的似乎也是父母XD


  血緣是永遠無法改變的事實，6年來的點點滴滴更是無法取代

  野野宮家的外婆說了一句:「生育之恩還是比不過養育之情」

  這句話在觀眾眼中可說是一語道破眼前的矛盾

  不過當局者迷啊~

  「慶多會越來越像齋木家的人；琉晴會越來越像野野宮家的人」

  所謂的「像」除了「外表」還有「習性」

  良多卻只看到了前者「外表」

  加上看見小慶多在鋼琴發表會的表現，越來越覺得小慶多不像自己

  不止沒有和自己相似的外表，更沒有複製到自己的成功

  「難怪會是這樣...」


  「親情是可以培養的。就像夫妻那樣」

  看的當想真的覺得這個例子舉的很不錯


  看似幸福美滿又富有的家庭卻總是少了什麼

  雄大說：「時間才是一切。」和家人相處的時間才是最寶貴的

  他們沒有像飯店一般的房子，沒有舒適的轎車，卻總是洋溢著歡樂的氣氛

  相對地，野野宮家的外婆和琉晴都曾說過野野宮家就像是「飯店」一樣

  空間寬敞、裝潢講究且整齊，同時也道出這個「家」少了一種「歸屬感」


  金錢固然重要，但不是萬能

  「沒輸過的人不會懂什麼是同理心」

  一個看似人生勝利組的良多想必是經過一系列的競爭，才能達到現在的成就

  導致眼前只有成敗輸贏忽略了同理心

  雖然剛開始他對雄大對於醫院賠償金的計較感到不屑，並認為真相更為重要

  但是當他說出願意付出高額補償金來領養兩個小孩時，自己才是用金錢衡量的人

  雄大也提出了疑惑：難道是用錢買孩子嗎？

  當然，這也重申了金錢並非萬能


  良多：「每個家庭的相處方式不同」

  很明顯地，野野宮家跟齋木家的氣氛幾乎完全不同，不過一旦交換了，孩子該怎麼適應？

  這個問題在考慮要不要交換時，卻沒有被正視

  在野野宮家，爸爸良多是最大的。

  當慶多說想繼續練鋼琴是因為「爸爸會很開心」時，我覺得很沈重

  一個才剛要升小學的小男孩不是為了自己，而是為了爸爸的開心而練琴

  一個才剛要升小學的小男孩卻必須強迫自己成長

  其實問題不是在於孩子而是爸爸啊!

  在齋木家,爸爸反而是跟孩子一樣XD

  齋木家的孩子也比較有小孩應有的朝氣，孩子不必為了討好大人的臉色而戰戰兢兢的生活

  也難怪琉晴敢在野野宮家表達自己的情緒


  －－－


  其實很多想法想分享，但怕永遠沒有打完的一天

  總而言之，我很推薦這部電影，無論是為人父母的還是做人子女的

  家庭中最重要的是什麼？我想每個人心中的答案未必相同

  但至少我想「血緣」不會是最重要的元素。













  --'
