url: https://www.ptt.cc/bbs/movie/M.1570725526.A.C15.html
title: '[普雷] 厭世媽咪日記 最該看電影的 應該是爸爸'
content: "雷文防雷資訊頁\n\nmod看到的 雖然被歸類為喜劇 可是我喜不起來\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n圖文網誌：\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\
  簡評：嚴格來說，如果想看一部搞笑片，這部不是，\n但是這一部很適合決定結婚生小孩的男女一起看。\n\n看完可以雙方好好討論 以後家務事要怎麼分配\n很認真決定要不要攜手走入婚姻這個墳墓\n\
  \n我想導演的主要用意，就是拯救喪偶式育兒的女性。\n讓男人稍微體貼一點點。\n身體力行的那種體貼，而不是嘴巴講講的那種體貼。\n\n\n    在維基百科，這部電影被歸類為劇情推理\n\
  劇情不是走脫俗搞笑的戲劇，\n\n實際上看下來，很容易為女主角的育兒日常感到心疼，\n這個媽媽早晚會逼自己走上絕路吧。\n\n以下這三行複製貼上維基百科：\n\
  《厭世媽咪日記》是一部於2018年上映的美國喜劇勵志劇情片，由傑森·瑞特曼執導、迪\n亞布羅·科蒂編劇，並由莎莉·賽隆、麥坎西·黛維斯、馬克·杜普拉斯和榮·利文斯通\n\
  主演。\n\n\n他在歸類上是勵志+喜劇片，雖然結尾勉強接近我喜歡的安排\n老公改頭換面 一起照顧小孩  在充滿陽光與音樂之下 故事落幕了。\n\n電影評分算高，7.2分，在電影版\
  \ 目前看到的皆好評\n\n但觀看影片的過程，我動了X4。\n必須說看了這些年，看了蠻多完全不會覺得欣喜的喜劇，\n{感受上覺得很悲情，卻被歸類為喜劇的電影還真的不少}\n\
  這部厭世媽咪更是其一。\n\n用難看形容也不對，他是屬於看得當下不是很開心，可是很多情節，\n會在看完，靜下來想一想。\n思索婚姻的價值是甚麼，\n為了婚姻失去的生活，值不值得？\n\
  \n前半部，與其說是看電影，\n倒不如說是看一位特殊兒媽咪照顧孩子的紀錄片。\n莎莉賽隆飾演的瑪蘿Marlo，在電影一開始就進入兵荒馬亂的日常，\n開車接送小孩上學的她，在下著大雨的日子，忍耐著兒子不斷地踢自己的椅背，\n\
  同時還要安撫不耐煩的女兒，偏偏這時候固定停車的停車場位子滿了，\n而有偏執執念的兒子，\n無法接受媽媽換停車場，整個過程就是聽一個崩潰的孩子不斷大哭。\n\n\
  等搞定一切，送孩子上學時，已經大遲到的她，必須耐著性子陪笑，\n聆聽校長委婉地建議有情緒障礙的兒子孩子轉學。\n\n忍耐著孩子將被退貨的壓力，離開校園，瑪蘿Marlo想到讓自己好過一點的方法是\n\
  到咖啡店點一杯無咖啡因咖啡，這時候還必須接受路人的良心建議，\n懷孕別喝咖啡。\n\n這樣子的瑪蘿Marlo，雙寶生活已經讓人感受到身處育兒地獄。\n更讓人困惑，兩個孩子已經讓他焦頭爛額了，真的有辦法再來第三個嗎？\n\
  \n\n雖然分身乏術，但是瑪蘿Marlo還是努力參與家族聚會，\n劇中在這個片段解釋了原來老三是意外懷孕\n婚姻生活 除了 孩子 老公 還要維持家族的情感\n\
  跟生活富裕的弟弟對比，自己的老公好像就遜了點，還必須跟老公心理建設一下才行。\n\n看得當下，會覺得心疼。\n一個希望讓老公專心在自己事業的女人，\n能做的選擇就是把孩子的事，全部接手下來。\n\
  \n劇中的她ㄍㄧㄥ著自己來，這樣強撐的後果，就是明眼人都開始擔心瑪羅還好嗎？\n有趣的是，雖然老公這角色知道太太育兒狀況顯然很疲憊，\n\n但從頭到尾還是死守在床上打電動\n\
  身為太太的瑪羅，也很自然的接受男人下班後的悠閒時光。\n完全沒演出用腳踹先生下床的畫面，讓媽咪很一口氣梗在喉嚨阿。\n\n厭世媽咪不算是白爛喜劇片，裏頭有不少隱喻在其中\n\
  {夢中的美人魚 以及創造出來拯救自我的角色}\n\n\n上一部觀看莎莉賽隆的電影是「老闆不是人」風格是無腦搞笑類型，\n差點忘記塞莉賽隆可是有拿下奧斯卡影后的演技派明星。\n\
  \n這一部電影，她犧牲不少，不但需要增肥，還必須演出乳汁脹滿，\n想辦法在廁所把乳汁擠出來，讓漲乳難受的她得以解脫。\n\n其中一幕演出羊水破了的畫面，更是邊走邊從褲底滲出水。\n\
  想來這個角色還真的讓她吃足苦頭。\n\n老三報到後，更是看的到瑪蘿Marlo陷入更讓人崩潰了三寶生活\n而老公回家後，能做的事情就是戴上耳機打電動。\n\n\n\
  這樣子的她，讓瑪蘿Marlo決定聽從弟弟的建議，為自己找了一個夜間保母。\n夜間保母這樣的角色，第一時間，我推測會不會演出老公外遇的戲碼。\n\n外型已經很癡肥的女主角，碰上年輕美麗貼心又溫柔的TULLY，成為鮮明的對比。\n\
  電影末段的確出現類似的畫面，但完全不是你猜測的那樣，\n\n甚至氣氛變得有些驚悚，然則我實在不理解為何老公從來沒有接觸夜間保母。\n正常人，知道有個保母以後會來照顧寶寶，多少會打聲招呼吧。\n\
  即便劇情刻意塑造先生很失職，\n但我以為要從頭到尾都沒有跟夜間保母打招呼問個好也太不合理了。\n\n{但電影的設定就是除了瑪羅，沒有人真的看到夜間保母，畢竟她都是怪時間出現阿。}\n\
  \n\n更何況劇情中，還有兩人親密互動的鏡頭。\n同樣討論母親這個主題的電影，我更激賞由凱特溫斯雷主演的身為人母。\n同樣被束縛在母親這個角色中，但是劇情除了看到凱特溫斯雷所飾演的人母，\n\
  裏頭還有各種不同型式的母親，在母親這個框架中，展現的多樣化面貌。\n\n至於厭世媽咪日記，如果你是育兒很辛勞的媽咪，\n想看一部類似宅女小紅幹絞老公的喜劇，\n\
  這部片完全不是那種風格。\n\n如果你是育兒很辛勞的媽咪，純粹想被人同理，我想這部電影會喜歡。\n\n畢竟厭世媽咪的編劇 正是三寶媽 劇中的片段 多多少少參考真實她育兒的片段\n\
  媽咪門打開來看 應該很有同感吧\n\n\n--\n\n\n\n  木子米米食遊記\n  \n\n--\n 看到你這麼說 我覺得有機會應該要認真看一次\n我明白\
  \  我想表達的是 從來沒真實存在過的保母 她老公竟然一直沒沒發現\n顯然是我記錯了 糗\n 只能說我以看白爛喜劇的心態電影看這一部 沒想到她的深度是另一種層次\n\
  \ 以後不幸結婚{？}記得好好愛護太太阿\n我明白先生跟一個不存在的人打招呼很不合理 但知道太太請了一個夜間保母\n從頭到尾都沒看過 也沒起疑 其實也很不合理\n\
  不過因為劇情的設定 就是老公很失職 這個設定 讓一切都合理了\n 不過我覺得真實的婚姻 如果遇到喪偶式伴侶時 想像力很重要 我想編劇有三個孩子\n她應該有將自己的人生感受也寫進去"
