title: '[問片]遺傳爸爸暴力傾向的片'
content: '印象中好像是韓國還是日本的片


  劇情是爸爸有暴力傾向還會強暴女人


  還把男主角的女友強暴了


  然後主角女友就離開了


  主角好像遺傳了爸爸的暴力傾向


  然後好像主角有跟繼母睡了


  結局是多年後女友回來找主角


  他們親熱的時候主角想學他爸爸用暴力掐脖子打女友


  女友不讓，然後主角自己把雙手綁起來




  多年前看的，劇情大概就這樣，但是餵狗都查不到片名，有沒有大神能夠提供一下名字？

