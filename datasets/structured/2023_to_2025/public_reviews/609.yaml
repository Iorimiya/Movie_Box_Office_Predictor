title: '[討論] 《孤味》爸爸給的糕點是茯苓糕？'
content: '是醬

  昨天小魯和女友在萬代福看了《孤味》

  除了替它錯過金馬最佳劇本扼腕以外

  其餘我們討論的

  是龍邵華給佳佳的糕點


  小魯曾經吃過這個東西但不記得名稱

  去菜市場看了很像茯苓糕

  但女友堅持說不是


  哪尼？！

  究竟是茯苓糕，還是不是茯苓糕呢？


  對不起了

  現在我真的需要認識那個很酷的東西



  --

  ㄟ沒想到是個完全沒聽過的東西~！！

  謝謝大家推薦，一定找來吃看看


  買到了，謝謝大家！'
