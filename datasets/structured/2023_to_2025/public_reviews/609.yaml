url: https://www.ptt.cc/bbs/movie/M.1470862920.A.4A5.html
title: '[問片] 尋找爸爸跟哥哥的電影 有雷'
content: '電影開頭是說女主角找到媽媽留的一封信

  信中叫她去找她哥哥和爸爸

  但她從沒見過她爸爸 甚至不知道她有個哥哥

  因為沒有線索 所以她直接從媽媽出生的村莊開始找

  有幾個關鍵點


  1.哥哥從小就跟媽媽分開

  2.媽媽進過監獄

  3.媽媽在監獄裡遭獄卒強暴並且懷孕 進而在監獄裡產下龍鳳胎(女主角跟她弟弟)

  4.強暴媽媽的獄卒是她哥哥

  5.媽媽後來藉由身體特徵有認出哥哥


  有幾幕印象很深刻

  有一幕是女主角要去搭公車

  但因為當地的宗教衝突很嚴重

  所以她取下身上的十字架項鍊 並且偽裝成回教徒

  結果剛好遇上基督教的人過來尋仇...

  她因為身上的項鍊而撿回一命

  但公車上的其他人都被射成蜂窩 還被澆汽油燒掉QQ


  另外女主角得知真相時

  那震驚和心碎的表情 演的真的很好


  最近想向朋友推薦這部電影

  但一直想不起來片名...

  沒片名推薦起來很不方便阿


  --'
