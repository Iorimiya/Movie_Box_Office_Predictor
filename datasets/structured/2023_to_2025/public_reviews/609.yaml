title: '[新聞] 史丹李女兒「迪士尼從未尊重爸爸」'
content: '新聞網址：




  【蜘蛛人退出MCU】史丹李女兒挺索尼！　轟「迪士尼從未尊重爸爸」揭內幕


  記者傅家妤／綜合報導


  迪士尼與索尼影業21日協商破局，導致《蜘蛛人》未來不會再出現在漫威電影宇宙，此事

  掀起大批影迷反彈，矛頭都指向索尼。不過已故「漫威之父」史丹李的女兒J.C. Lee持相

  反意見，跳出力挺索尼並直批迪士尼及漫威從未尊重過父親。


  迪士尼與索尼因電影票房的分帳談不攏，雙方合作破局，索尼也證實了未來《蜘蛛人》的

  下一部電影，將不再由漫威工作室製作，未來也很有可能不會再回歸MCU ，大批粉絲對此

  感到非常不滿，一面倒地砲轟索尼，甚至還有網友發動起「man」、「#Boyco

  ttSony」抵制索尼影業。


  不過，已故「漫威之父」史丹李的女兒J.C. Lee日前卻高調跳出力挺索尼，她在接受外媒

  《TMZ》 採訪時，提及索尼對父親的創作一直都非常尊重，而且索尼的出現，也可以分攤

  漫威及迪士尼對史丹李所有創作的掌控權，達到一種平衡。


  此外，J.C. Lee還砲轟迪士尼及漫威從未尊重過自己父親的作品：


  「當我爸爸死的時候，漫威及迪士尼都沒有來找過我，從第一天開始，他們就一直把我父

  親的作品當成商品在賣，從來沒有對他或是他的經典作品示出該有的尊重及敬意。」




  最後她也指出無論索尼或其他人，對於延續史丹李的創作，都需要接受一些不同的看法及

  意見。


  附上TMZ原文報導：



  “When my father died, no one from Marvel or Disney reached out to me. From da

  y one, they have commoditized my father’s work and never shown him or his leg

  acy any respect or decency.”


  感想：

  想到之前別家緬懷一下史丹李就被粉絲罵消費，原來只准某一家緬懷，注意是緬懷喔！絕

  對不是消費喔！'
