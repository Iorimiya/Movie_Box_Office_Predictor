url: https://www.ptt.cc/bbs/movie/M.1681862998.A.6D3.html
title: '[好雷] 不跟爸爸說再見 Pink Moon'
content: '雷文防雷資訊頁


  不跟爸爸說再見

  Pink Moon

  2022荷蘭電影




  當74歲的父親突然告知女兒愛麗絲，他想結束生命時，愛麗絲不得不面對這個荒謬的窘境

  。隨著父親設定的死期越來越近，愛麗絲決定忽略哥哥為成全父親而設計的縝密計畫，以

  強制的手段逼問父親，不想活的原因為何，無奈愛麗絲並沒有得到滿意的答案。於是她開

  始想方法來應對父親想死的心願…




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  這部片的劇情設定吸引住我的注意，決定追看完畢。本片涉及安樂死的議題，身體健康但

  想死的老人，為何如此想死？哀莫大於心死？顛覆了好死不如賴活著的通俗想法。本片用

  雲淡風輕的氛圍述說這個故事，但有著悲涼的核心議題，令人低迴深思。


  個人滿意度70分（滿分100）。


  以下有劇透。



  1.我們一般人對於死亡的看法是：好死不如賴活著。所以，本片的主要角色，我們難以理

  解：一個75歲的老人，健健康康的，還擁有內部裝潢精美且有秋千的美麗庭院的大房子，

  兒女雙全且時常來探望，含飴弄孫中…這是理想的老年生活啊。但是這個荷蘭老人-父親-

  祖父卻做了一個決定，他決定要在76歲生日那天，結束自己的生命。為什麼決心想死？最

  後能完成安樂死嗎？...帶著這些疑問，看下去...


  2.在經過最初的爭執後，兒子一家人，首先接受了父親的決定，但女兒依然不能釋懷，她

  搬回父親的家，和父親一起生活，她努力想要打消父親的念頭。但即使這樣，她和哥哥依

  然幫著父親進行賣房，死亡前生日會的計劃，及葬禮的準備。


  3.在一個雨天，一個平常陪父親去超市購買日常用品的日子，女兒任性地開車帶父親去了

  國外遠處的雪山，原來這是多年前，在她的母親生重病前，父親計劃出遊的地方，還沒來

  得及執行，母親就重病了。在這地方，父女達成了和解。父親在這個沒有母親的世界感到

  很孤獨，他雖然無法一定能夠去到有母親的世界，但是他能確定的是這個世界沒有母親，

  不值得繼續活下去了。儘管有深愛他以及他深愛著的子女，但子女的羈絆，依然擋不住他

  離去的腳步。沒有什麼支撐他活下去的欲望，他想在健康時赴死，生無可戀的狀態。

  這片有個橋段，父親赤身裸體在雪山上用雪擦拭自己的全身，因為他認為能夠促進血液循

  環。一個決定去死的人，依然追求生命的品質！

  人們都想要有好品質的生命，但仍然可以接受品質低落，一般人只要一息尚存，就願意茍

  延殘喘，加上宗教及傳統觀念，自殺是禁忌啊。


  4.本片涉及安樂死的議題，本片劇設人設使然，重點放在作為女兒的主角，想要改變父親

  赴死的意願，顯得任性不尊重父親，進行自我的情緒宣泄，而忽略了決心進行死去的父親

  角色，其內心及形象顯得很模糊。女兒相當做自己，忽略了父親最後的意願？只是想令自

  己内心平靜。最後任性帶父親出遊，也只是為滿足少女時期未完成的心願。就如同影片中

  的父親所說，你怎麼就不能從我的角度想想呢？


  5.本片女主Iris對父親抱怨說：“你想做什麼就做什麼，完全不顧其他人。”父親埋怨她

  ：“我們無法用彼此的角度看事情。”父親同樣地絲毫沒有站在Iris的角度去思考？父親

  的決定安樂死離去，會給兒子女兒帶來什麼？會給這個原本溫馨的家庭帶來什麼？除掉考

  慮一般人常有的面子問題，父親以這種決絕方式離去，父親並不是通常的自然死亡，而是

  刻意的自我了斷，是否會給兒女的内心刻上永久的傷痕？兒女會產生深深的不安和歉疚嗎

  ？為何無能為力讓健康的父親願意更多活一些時日？這想法會跟隨兒女一輩子嗎？從這角

  度而言，父親也是任性的。自己決定生死，無關對錯？


  6.影片最後橋段：在眾人為老人祝壽之後，Iris和父親默默的跳了一段舞，一切盡在不言

  中。到了老人決定結束生命的時刻，他兒子Ivan對Iris說：“我做不到。”無奈之下，Ir

  is只好陪伴父親這最後的時光。父親調好了藥，放在桌上，他緩緩的坐在沙發上，從容鎮

  定。Iris強忍悲傷，慢慢地走過父親身邊，將窗簾拉上，坐在窗邊的椅子上。這時，鏡頭

  對向Iris，她的雙眼盯住鏡頭外的父親，悲傷且無助。此時我們聽到湯匙攪拌杯子內的藥

  之聲音，藥水送入口中的聲音，接著是父親的喘氣聲，先是緩慢，接著喘氣聲越來越急促

  ，直到Iris站起來，向父親方向奔去。如此的結局畫面！令我沈默-低迴-感傷。


  不跟爸爸說再見

  PinkMoon

  荷蘭電影

  安樂死




  謝謝樓上留言。你推的天堂計畫，列入追看片單，thanks.



  To 樓上網友Jochum，我已經在MOD看完你推薦的影片：天堂計劃，已經貼文，和你交流分

  享。Thank you.




  本片上串流平台後，上院線的可能性就很低了？'
