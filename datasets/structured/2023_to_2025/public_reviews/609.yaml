url: https://www.ptt.cc/bbs/movie/M.1563474862.A.81D.html
title: 'Re: [請益] 獅子王裡女主角的爸爸是誰？'
content: '其實硬要避開亂倫又相對合理的說法也是有，只是有點長、有點腦補。



  1. 木法沙打下榮耀石成為獅王時，他的戰友公獅應該不是只有刀疤一隻。


  會這樣推測的原因是，原作刀疤就自嘲他沒有打架的天份，光靠木法沙一隻戰力可以打贏

  前任公獅戰隊嗎？


  從獅王之路裡我看到公獅的習性是判斷有優勢才會打，覺得打不贏就拉掉。所以來挑戰的

  流浪公獅不會傻傻的來跟現任獅王一挑一，很常gank落單的獅群公獅來製造優勢。因為輸

  了真的可能直接GG，沒有溫泉可以給他們復活。


  所以合理懷疑木法沙當上獅王時，他的幫手應該還有其他公獅。有可能後來在巡邏守衛地

  盤時，被流浪公獅gank而去世。


  所以可以解釋為，娜娜是這些因公殉職的公獅後代。




  2. 木法沙戰隊公獅成員之組成


  可能性ㄧ，木法沙、刀疤、木法沙其他的親兄弟。

  可能性二，木法沙、刀疤、木法沙叔叔伯伯的兒子，簡稱堂兄弟。

  可能性三，木法沙、刀疤、流浪時在路上遇到的8+9 = 結拜兄弟。


  娜娜如果是這三種可能性的後代，基本上辛巴跟娜娜都是四等親以上的關係了。



  以上純屬喇賽腦補，不要鞭我。


  --'
