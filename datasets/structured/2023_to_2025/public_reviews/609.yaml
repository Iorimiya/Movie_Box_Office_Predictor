title: '[問片] 戰爭中爸爸還能帶給兒子歡樂的電影'
content: '感謝大家

  終於找到了


  本來以為線索很少沒什麼希望

  而且經過網路搜尋

  這部不像我提問時說的「戰爭片」


  再次感謝大家


  沒想到男主角是導演

  而且劇情來自他自己的人生經歷QQ



  -----------------------

  日前聽家人在聊一部電影

  內容大概是……


  故事大概的內容好像是


  在某個戰爭中

  一個爸爸用機智有趣的方式

  在殘酷的戰爭生活給自己的小孩帶來樂趣，不讓小孩子感受到恐懼


  後來那個爸爸被拖去處決離開人世了




  以上是聽家人說的內容

  但是沒人能想起片名

  去搜尋戰爭片找到的也看不出來什麼頭緒



  不然只有上述的內容能否找到這部片，可以在農曆過年期間觀看



  以上先謝謝大家了～


  --'
