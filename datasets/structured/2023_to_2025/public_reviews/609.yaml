url: https://www.ptt.cc/bbs/movie/M.1585470953.A.164.html
title: '[壞雷] 陽光普照 - 關於爸爸'
content: '陽光普照因為有上Netflix

  想說最近下大雨又有疫情

  身為陽光宅男看一下陽光普照之類的片子也還行

  防雷一下好了


  ~~


  故事是以一個家庭開始

  這個爸爸怎麽看都有問題

  一副義正嚴詞的樣子

  教出上少年感化院的小兒子

  又害大兒子自殺

  這些我都忍了

  最後還去殺了個人


  然後呢? 電影沒交代估計還是繼續上班

  我看完還以為他是吉良吉影化身

  果然媽媽也有這種感覺

  狠狠的用歐拉歐拉歐拉修理了爸爸一頓


  但是


  美中不足的地方出現了

  爸爸受到的懲罰就只有這樣？?? wtf

  他根本不痛不癢，影片就結束了


  卅小，  陽光在哪?  因為媽媽跟小兒子還茍且偷生所以陽光普照嗎


  這個一定給負雷，我說的



  --'
