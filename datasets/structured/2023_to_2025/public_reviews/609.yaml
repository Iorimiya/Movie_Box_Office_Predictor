url: https://www.ptt.cc/bbs/movie/M.1419566092.A.D2F.html
title: '[普雷]韓影 我是爸爸 '
content: '這部金賽綸都在生病，沒什麼表現機會。


  金承佑則是跟不知道哪一部港影裡的甄子丹感覺一模一樣。


  有時候看電影，就會覺得社會到底是不是這麼糟? 還是現實再跟糟糕一點?





  網誌圖文版：


  我是爸爸，以電影名來看，導演或許是想表達一個關於父親的心情，無論是身為魔術師或

  是警察，對於保護子女的心情都是一樣的。但我在這電影裡卻主要看到的是關於警察與幫

  派勾結，徇私吃案的社會殘酷面，在父親這部分反而少有感觸。父親，作為人父會是怎麼

  樣的心情呢? 沒有小孩實在很難想像，看著社會新聞的慈父與獸父，對於虎毒不食兒這句

  話也是半信半疑，不過回頭看看父親對待自己的照顧，倒是由衷的充滿感謝。


  男主角金承佑在劇中演出一個脾氣暴躁的警察，戴上墨鏡粗獷的身材，加上叼著菸一句一

  句的西八(韓語髒話)，看起來氣勢十足，跟香港電影裡的甄子丹十分相像。而這樣一個警

  察卻因為女兒的病情與黑幫勾結，讓許多善良的老百姓冤獄入獄。想要的就去搶，不喜歡

  的就踩在腳底下，這是韓鐘植警察的待人處事座右銘，為了女兒他管不了這麼多，可是就

  我一個旁觀者而言，看法是與裡面的警長前輩一樣，他做的事情，找替死鬼、讓人冤獄，

  間接造成人命死傷與殘疾，已經不是情有可原而是令人髮指的事情了。


  如果說韓鐘植代表了社會上有本錢的人，那羅尚萬就是社會上的另一種典型，儘管女兒妻

  子都被韓鐘植間接害死，自己也啷噹入獄，到頭來卻仍連手指動一下開槍都做不到。或許

  從某方面來看這是人性本善，殺不了人；但從另一個角度來看，大概就是懦弱兩個字。老

  警長、羅尚萬在獄中認識同樣被誣陷的獄友，則是介於兩者之間的另外一型。擁有殘暴冷

  酷的韓鐘植，無能為力的羅尚萬，兩種截然不同的類型，都讓我看了覺得心寒與悲傷。


  電影的最後，羅尚萬選擇了以他最擅長的魔術來表演，天台上一架架幻化出來的紙飛機，

  金賽綸的淡淡笑容，韓鐘植說出一聲我是爸爸啊然後倒下，這一切都讓人覺得虛假，儘管

  結局在怎麼粉飾，都無法掩蓋前一段的骯髒。原本我是相信因果的，因為若不相信因果，

  這世界的一切該如何來制衡? 但隨著年紀閱歷增加，因果這事實在也很難讓人相信，更遑

  論各式宗教，敬羅尚萬過世的妻子與女兒，人生難免有無妄之災，我們雖然放不下，但也

  只能無可奈何的接受。


  父親一職，可以很隨便的做，也可以戰戰兢兢地做。希望未來若我有機會擁有子女，能讓

  他們覺得幸福，並以我為榮。


  --'
