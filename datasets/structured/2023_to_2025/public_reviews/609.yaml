title: '[討論] 奇蹟男孩 禮物'
content: '昨天去二輪看了奇蹟男孩


  覺得撒的線有點多，雖然都有填坑


  但就會覺得某些部分比較單薄


  算不好不壞的普雷吧








  以下有雷







  --------------------------------------------





  想詢問一下



  昨天有一幕


  姊姊和弟弟各自去戶外教學的時候


  媽媽和爸爸兩個在家喝紅酒


  媽媽拿出論文給爸爸看


  爸爸也拿出一盒包裝精美的禮物送給媽媽


  爸爸問說這個值不值得兩個吻


  有點好奇爸爸到底送了甚麼


  在猜測可能是夫妻情趣之類的禮物吧 (?)



  --'
