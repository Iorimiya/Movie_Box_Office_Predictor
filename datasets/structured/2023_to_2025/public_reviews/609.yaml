title: '[新聞] 《神隱少女》千尋爸爸一口吞的不是肉圓！19年謎團原畫師說出'
content: '記者陳芊秀／綜合報導


  日本動畫大師宮崎駿執導《神隱少女》於2001年7月上映，締造308億日幣的票房，片中女

  主角千尋的爸爸和媽媽，因為吃了神秘的食物而變成豬，為了解救雙親脫離詛咒，展開一

  連串故事。

  。



  ▲《神隱少女》片中千尋爸爸吃的軟Q食物是什麼，一直是網路討論話題。（圖／翻攝電

  視畫面）


  米林宏昌在推特分享創作秘辛，回憶當年在吉卜力自由創作，首度擔任長篇動畫的原畫師

  ，心情很緊張，一邊研究一邊繪畫，例如白龍吃河神丸子，就是參考大型犬的動作來畫。

  而，，

  。



  ▲擔任《神隱》原畫的米林宏昌揭曉答案，其實是腔棘魚的胃袋。（圖／翻攝自推特／米

  林宏昌）


  這段秘辛曝光，火速登上日本推特熱門趨勢冠軍，網友紛紛表示「長久以來的謎團終於解

  開啦」、「真相大白了」、「原來是腔棘魚的胃」。



  ▲謎樣食物是腔棘魚的胃袋，而且實際動畫畫面比原畫更軟嫩3倍。（圖／翻攝自推特／

  米林宏昌）



  ▲網友驚呼真相大白，也有人PO照「以為是台灣肉圓。」（圖／翻攝自推特／米林宏昌）


  腔棘魚人稱活生生的活化石，存活了3億5千萬年，外觀非常巨大，不只會游還會走，腔棘

  魚的冷凍標本在全世界只有一處，正是日本的「沼津港深海魚水族館」。



  ▲腔棘魚是活生生的活化石。（圖／翻攝自臉書／沼津港深海魚水族館）




  --'
