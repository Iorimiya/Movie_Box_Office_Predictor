url: https://www.ptt.cc/bbs/movie/M.1511089808.A.A7D.html
title: '[請益] 他不笨 他是我爸爸'
content: '他不笨他是我爸爸(2001年)


  要防雷嗎？ 防一下好了

















  --------------------------------


  西恩潘在裡面有一群跟他一樣"特別"的朋友，相當挺他


  成員有唐氏症，被害妄想症...等，有一個讓我印象最深刻的電影狂人


  他似乎有一點強迫症，每一句對白都離不開電影名句，


  無論是電影發行的年份，劇情，或是台詞都清清楚楚的用最快語速講出來



  也是因為他，我才知道"克拉瑪對克拉瑪"這作品，經典哪!


  請問各位高手，還記得他有提到哪些電影嗎


  ps很難想像這位電影狂人後來在綠色奇蹟裡演的是一個機掰人







  很棒的舊片，每次看完都會流眼淚


  即便知道西恩潘本人形象壞壞的，看到他的表演還是會誤以為他是弱智......






  --'
