title: '[問片] 國片有關爸爸生殖器放學校作教學研究'
content: '記得是我小時候在第四台看到的國片

  應該是民國70幾或80幾年的片

  記得片中有個爸爸的生殖器有什麼病的關係需要切除

  被切除的生殖器放在一所高中或大學作教學研究

  但家中的兒子不曉得爸爸的生殖器沒了

  後來兒子長大在高中或大學念書

  在學校實驗室看到浸泡保存的一些標本中

  其中有一個生殖器寫著爸爸的名字

  大為震驚，好像還很生氣

  不敢跟同學承認那是自己爸爸的

  後面的劇情我忘了

  請問有人知道片名嗎？


  --'
