title: '[請益] 星際效應 之爸爸愛種田?'
content: "爬了很久的文~~ 仍然找不到有人提問過\n如果有人已經解答過再自刪^^\"\n\n\n就是片尾 Cooper參觀移到太空站的老家紀念館時~XD\n\
  導覽員說 他做過Cooper的專題  所以很了解Cooper\n接著說 他知道Cooper喜歡種田\n並強調 Murphy本人也證實了這點\n\n這兩句台詞 對我來說很突兀\
  \ (尤其是強調有跟Murphy求證過這句)\n當然也跟Cooper聽到時 一樣充滿疑惑\n\n因此 當Cooper終於見到久違的女兒之後\n先是相互凝視久久不語...(這一幕很感人\
  \ 千言萬語盡在不言中啊!!!)\n\n接著 依照慣例 西方人總會讓他們感到感傷或尷尬時\n說些自嘲或幽默的對話開啟話題 活絡氣氛\nCooper開口的第一句對話\
  \ 結果就是不可思議(但當然仍然充滿父愛)的問：\n\"妳跟他們說我喜歡種田!??\"\n\nMurphy笑了出來\n那樣的笑容不是調皮惡作劇般的笑容 也不是無奈\n\
  就只是輕聲笑了幾下 沒有解釋也沒有說明\n\n因為知道每幕畫面跟每句台詞 都一定有其意義\n所以我印象特別深刻 但一直不知道這裡的用意是什麼?\n\n而且Murphy為什麼要讓\
  \ 明明很聰明 也真的是她解題關鍵的爸爸\n在歷史上留名時 成為一個很愛種田的農夫?\n世人已經夠不相信Murphy的成就 一部份來自於爸爸了\n她這樣承認不是讓人更混淆嗎?\n\
  \n\n我想了很久 不知道這段\n是不是Murphy為了想諷刺那些 曾經被全盤改寫的阿波羅歷史?\n\n(記得學校的女老師是不是也有強調自己做過報告~~\n 那些自以為深入鑽研過\
  \ 所以一定不會搞錯的自信\n 才能讓真相與意識形態之間的對比 顯得荒謬)\n\n\n\n\n\n--"
