title: '[新聞] 劉青雲《爸爸》入魂 哀痛愛子弒妻女'
content: "劉青雲《爸爸》入魂 哀痛愛子弒妻女\n\n2024/12/24 05:30\n\n\n《爸爸》導演翁子光（左）、劉青雲一同接受台灣媒體訪問，侃侃而談。\n\
  （甲上娛樂提供）\n\n〔記者廖俐惠／台北－香港連線報導〕港片《爸爸》改編自2010年震驚社會的「荃灣享和\n街弒母殺妹案」，劉青雲飾演的「永年」，故事原型正是妻女遭兒子殺害的「簡先生」。\n\
  戲外是個頂客族的劉青雲，透露自己邊拍邊學習當一名父親，逐漸與飾演兒女的新演員建\n立如親子般的關係。\n\n\n劉青雲（後排左起）、蘇文濤、谷祖琳和熊諾頤（前排）在《爸爸》中飾演一家人，蘇文\n\
  濤在片中殺害了母親及妹妹。（甲上娛樂提供）\n\n劉青雲、導演翁子光一同受訪，劉青雲透露當初對劇本很感興趣，卻擔心無法承受如此悲\n傷的角色，「為什麼要殺了我的小孩？我這個年紀，你還要殺了我的寶貝！」但最後還是\n\
  不願錯過這個角色，才確定接演，直呼這個決定相當困難。\n\n儘管接演前滿是擔憂，不過劉青雲的表現被大讚是從影最佳演出，翁子光更透露劉青雲已\n經不是在演戲，而是成為了「永年」。翁子光透露，劉青雲當時被問到飾演永年時，對兒\n\
  子是否有恨？劉青雲回應：「什麼是恨？什麼是原諒？在這個爸爸身上都沒有這些概念。\n」沒想到這些話都是簡先生說過的話，讓翁子光大為感動。\n\n電影獲得簡先生的支持，翁子光透露，最初簡先生對他很是防備，後來雙方在交流的過程\n\
  中逐漸產生信任，更成為了朋友。如今親身經歷被拍成電影，簡先生雖然沒有看電影，不\n過稱事情經過了十幾年，已經走了出來，心情也變好，讓翁子光相當安慰。《爸爸》將於\n\
  1月3日在全台上映。\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
