url: https://www.ptt.cc/bbs/movie/M.1436241189.A.22E.html
title: '[好雷] 家的解離：紀子出租中、把爸爸借給你'
content: '部落格圖文版：




  不斷解離的現代家庭：《紀子出租中》與《把爸爸借給你》



  [心結]：這樣的家，毀掉算了！


  § 家庭照

  愛子（假名）的臉書上，全是一家四口的家庭照。他們經常出遊，照片上的他們笑得那麼

  開心。在別人眼中，他們是模範家庭。但我知道，愛子的丈夫好久沒碰他了，一兩個月才

  行房一次。愛子的丈夫會跟一些哥兒們偶爾去越南店找女人，他的說法是抒壓。愛子在結

  婚之前就察覺到丈夫的習慣，只是無法肯定。終於，有天愛子再也無法忍受，可是當她鼓

  起勇氣跟丈夫攤牌，丈夫反過來指責妻子的不是，沒有按照他的要求早起、在孩子面前隨

  時保持良好形象，像是在孩子面前絕不滑手機。他跟妻子抱怨自己壓力很大，並且發誓自

  己絕對沒有做對不起家庭的事。


  我請她列一張清單，列出家庭中各個要素對自己的重要性，排在愛子心中第一位的是「孩

  子」。但一切都沒變，愛子為丈夫找了許多理由，讓眼前一切合理化，她打算暫時就這麼

  下去。



  § 不斷變形的家庭

  家庭於現代社會，是一個彷彿在我們意識到它的意義之前，就已經存在的社群單位。然而

  ，家庭成員的組成分子在變化，角色的內涵也在變化。三代同堂、到小家庭，一父一母到

  單親家庭，又到同性婚姻組成的家長與子女關係。家庭仍然存在，但我們已經無法再用過

  去對家庭的認知去看待一個家，當多元成家的議題發酵之時，彷彿一個未來的，同時也是

  未知的家庭輪廓，有待我們與未來的國民去開創。


  這一本重新書寫，開放性的家庭手冊，讓我想起薩提爾（Virginia Satir）在家族治療中

  強調的目標，「整合每個家庭的需要」。更仔細的加以說明，就是整合家庭成員彼此之間

  的內在與關係上的需要。薩提爾形容是一個「從舊夢中甦醒，創造新的夢」的歷程。


  我想起幾個個案，他們面對家庭成員中的失序、失信與投以他人的負面影響，有的來談者

  選擇無動於衷，假裝一切如昔；有的來談者激烈的反抗，用自己的本位主義去對抗其他成

  員的本位主義；有的家庭成員放棄改變的可能，他選擇離開，一去不回頭。


  所有的變與不變，都在探尋一個可能，對於理想家庭的嚮往與實驗性的假說。好比橫跨十

  年的兩部電影：


  ◎  2005年，日本導演園子溫拍攝了《紀子出租中》一片，描述高中生紀子由於在家庭中

  感受不到存在的價值，對父母、親子之間的僵化與麻木，種種看不見前景的未來圖像，謀

  求產生劇烈改變的可能性。她逃家，一個人來到東京，加入網友久美子打工的家庭出租公

  司。紀子和其他雇員，學會按照客戶的要求扮演不同的家庭成員。各種理想的家庭面貌，

  在金錢的交易中實現為一齣齣如童話故事般的美麗幻影。


  ◎  2014年，對比《紀子出租中》的灰暗與悲劇性，韓國電影《把爸爸借給你》用詼諧的

  語法訴說小學生雅英，通過班級交換禮物的靈感，把首爾大學畢業，卻在家待業多年的父

  親泰名推上自製的「出租爸爸」網頁，成了需要爸爸的人花錢即可雇來的替代品。當自己

  的父親把越來越多的時間花在其他家庭身上，雅英和泰名的妻子重拾對於泰名在家庭中的

  存在價值，泰名也通過這份出租爸爸的工作，了解現代人們在家庭失去父親等重要的家庭

  成員下，有多少人因此過得痛苦不堪，領域家庭關係中無可取代的價值。



  § 原生的家庭，原生的痛苦？

  過去，面對家庭問題，經常聽到聲聲無奈的抱怨，「我們沒有辦法選擇我們的家庭」。如

  今，脫離原生家庭看似越來越容易，但在華人世界，至少在我的觀察中，年輕子女並沒有

  因為時代更迭獲得更大的自由。


  隨著家庭條件的相對提昇，年輕人更容易爭取所謂的自主性與自由，但是他們與家庭之間

  的牽連還是很深。父母，乃至祖父母輩依舊熟悉傳統的家庭價值觀，在中國，多少年輕男

  性的家長為了兒子結婚所需要的婚房，女兒所需的嫁妝，必須將忙碌一輩子的所得用在孩

  子身上，而子女卻將父母的付出視為理所當然，毋寧說，子女成家的現實焦慮和父母對孩

  子的情感連結在一起，構築成一種以親情為道德訴求的情感勒索。


  在台灣，因為摸不清楚未來而繼續踏入高等教育，乃至研究所的年輕人，還有茫然走出社

  會，面對22K的畢業生，他們還沒有足夠豐厚的羽翼拒絕父母在生活支持方面的好意。有

  些人感到有些羞恥的接受了，同時還得承受父母對子女期望落空的指責和壓力。有些人則

  是毫不介意的繼續享受家裡的資源，讓年過半百的父母負擔自己的各項生活開支。


  個體與家庭的關係，變得各種花式咖啡，許多人不滿於當前的家庭，發揮各種創意，結果

  卻忘了一杯好咖啡的本質還是在咖啡豆自身。種種花招，遠離了咖啡的本質，讓情感嗅覺

  疲勞於豐富、多變，卻脫離本質的家庭活動：


  純粹且誠摯的愛，和諧的相處與溝通，彼此學習如何扮演好自己的角色，在承先啟後的成

  長歷程中，看透人間四季的不同美景。



  § 探尋，或索取？

  我經常發現我的來談者是飢餓的，他們渴望成長，就像孱弱的小動物。他們渴望很多很多

  的愛，卻苦於找不到一個相應的方法。因為一個家庭的問題，往往需要整個家庭成員共同

  面對，無法只通過自己一個人處理。


  無可否認，家庭問題也有嚴重到難以處理的時候。但在真正面對自己在當前家庭中的挫敗

  之前，所有為了滿足飢餓而做的處置，很可能都是將自身的痛苦，轉嫁在他人身上，然後

  不斷的重複輪迴，為愛痛苦，為獲得愛的渴望痛苦，卻又為了證明某人無私的愛，給予自

  己考驗，也給予對方考驗，然後抱著對壞結果的預期，證明這個世界待我如此無情，卻不

  知正是在證明悲劇性的存在，而不是希望的存在，以至於我們花了太多時間走向黑暗，而

  不是光明。


  Janelle Barlow曾經這麼形容這種為愛的失控與衝撞，「當你餵食某人的時候，你利用的

  只是他的飢餓。」


  如果變形的家庭實驗，追求的是自我滿足，而無法同時去認知、了解與體察家庭中其他角

  色的需要和彼此間的差異，這場實驗的目的到底是為了家庭？還是為了滿足一己私慾？

  創造性的生活需要想像，但家庭需要的不是製造故事，而是經營。


  舉例來說，家庭中的男性成員因為生理限制，無法真正的經驗到女性懷孕與生產的母親角

  色，但男性依舊可以盡可能去體恤家庭中的女性成員。


  當我面對來談者或一般民眾探討家庭議題，無論態度宛如人權鬥士，或喪氣失志，他冠冕

  堂皇的話語背後，是將家庭視為「索取的提款機」、「付出的無底洞」，或者「共同構築

  的合作社」，那些隱而未發的意識形態與情緒，才是這個人如何經營家庭的思路。



  § 解離的個體

  《把爸爸借給你》裡頭，泰名的工作就是滿足不同個案的對於父親角色的需求，餵食愛的

  背後是對愛的一種利用。《紀子出租中》的敘事不將這種商業行為過度美化，當我們扮演

  某種角色，我們可以委屈自己，因為在扮演之中，我們將自身抽離出現實世界，就像許多

  人在攝影鏡頭前面莫名的變成另外一個人，又在鏡頭轉移開來之後，突然從鬼附身一般的

  催眠情境中甦醒。


  兩部戲中的人物，他們與家庭的疏離之前，他們自身與自身早已分崩離析。韓國最高學府

  畢業的高材生，卻是無業遊民，靠貪一些小便宜過日子，在家裡得不到女兒的敬意，妻子

  還開玩笑說他是沒用的存在。


  紀子內向、膽怯，她就像許多青少年時期的孩子，對自己的存在價值充滿懷疑，但又隱約

  察覺到父母之間的貌合神離，以至於她在尋求自我卻又一時找不到幫助的情況下，將意識

  棲身於網路，試圖通過虛擬世界尋找一條通向真實自我的道路。最終紀子和尋找她的父親

  ，追隨她的妹妹共處一室，他們在一個陌生的屋子裡，摸索著彼此的定位。


  「主動的互相體恤，而非消極所求，能夠讓一個家庭黏合為一個整體。」人是否需要組織

  家庭，至今沒有一個絕對必然的觀點。盡管如此，我讀過的心理學家和諮商師均在著作中

  同意一點，「經營好自己和自己的關系，才能經營好自己和他人的關系。」


  鏡頭真的讓我們變得不像自己？還是通過鏡頭，通過角色扮演，我們得以用滿足自身對於

  理想家庭的想像。也許桃花源永遠不存在，理想家庭永遠不是現實，而是逐漸失控的個體

  ，試圖重拾幸福的掙扎與想像。



  [解語]：每個人都是一小片拼圖，當我們抱怨找不到其他相合的斷片，很可能是因為我們

  自己這片拼圖有些碎裂，以至於失去和其他拼圖相合的能力。



  部落格圖文版



  --'
