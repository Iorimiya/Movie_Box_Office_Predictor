url: https://www.ptt.cc/bbs/movie/M.1492158708.A.5FD.html
title: '[新聞] 爸爸是台大校友 這樣養成《異星入境》作'
content: "爸爸是台大傑出校友　這樣養成《異星入境》原著作者\n\n文｜翁瑞怡\n\n《異星入境》讓原著作者姜峰楠成為好萊塢熱捧作家，但住在西雅圖的他仍然遠離鎂光燈\n\
  ，保持低調的生活。這次鏡週刊特別訪問到他定居紐約的父親姜復本，曾在台大土木工程\n系度過四年大學時光的姜教授，今年高齡81。講到四個孩子中長子的姜峰楠，滿滿的都是\n\
  驕傲。\n\n鏡週刊：有讀過兒子的短篇故事嗎？覺得如何？有哪一個故事是你特別喜歡或印象深刻的\n嗎？\n\n姜教授：有，但沒全部都看過。我不是科幻小說迷，很少看這類的著作。\n\
  \n姜峰楠第一部短篇就獲得星雲獎，有沒有讓您很驚訝？\n\n完全不驚訝。他從小就愛看書，比同齡小孩看的都多，高中就在校刊寫如何使用電腦的專\n欄（非常早期的電腦）。申請布朗大學時，也帶自己的中篇小說去面試，且只申請耶魯、\n\
  普林斯頓和布朗，三所大學都錄取。\n\n他在布朗大學雙主修，唸天文物理和資訊工程。我一直以為他會做科學相關的工作，所以\n當他成為名作家時，的確讓我有點意外。\n\
  \n從小姜峰楠就展現出豐富的想像力嗎？有沒有什麼讓您覺得印象特別深刻的故事或特別厲\n害的想法？\n\n小時候我每天都會讀床邊故事給他聽。他對自然和生物的主題特別有興趣，有次我買了一\n\
  本很厚、關於鯨魚的書給他，他愛到好長一段時間每天都抱在手上。他也對天文物理學非\n常有興趣，這也為他之後的科幻小說寫作打好基礎。我很快就發現他懂的比我還多，可以\n\
  當我老師了。\n\n在一篇訪問中他提到小時候家人都會一起過聖誕節。有什麼特別的回憶嗎？\n\n小時候的確我們全家會一起過聖誕，只是因假期的關係，和宗教無關。因為我常常出差，\n\
  總是會帶禮物回來給孩子們，有些禮物會刻意留到聖誕節才送。有一次我送他一條阿拉斯\n加海豹皮做的皮帶，結果他一看到就哭了，因為他超愛動物的。\n\n有看過《異星入境》這部電影了嗎？覺得如何？\n\
  \n我看了電影，但我不確定我完全瞭解它想說什麼。我們有個鄰居，他也是作家，他跟我說\n他覺得書比電影好太多了。\n\n教授近年有回台灣一些大學演講。台灣對您來說是個什麼樣的回憶呢？有沒有帶家人回來\n\
  過？\n\n最近幾年我真的常回台灣。台灣和我當年唸書的時候比起來真的進步很多。台灣人都很滿\n足和快樂。犯罪率也非常低。街道非常乾淨。人也都很友善，即使陌生人也願意伸出援手\n\
  ，這些都讓我印象深刻。在台灣大學唸書的四年，是我人生中最棒的時光。\n\n\n\n--\n                                  \
  \       04/14 16:34\n                                       04/14 17:20\n      \
  \                                  04/14 17:20"
