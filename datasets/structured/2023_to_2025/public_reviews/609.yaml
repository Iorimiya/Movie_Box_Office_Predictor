url: https://www.ptt.cc/bbs/movie/M.1511542974.A.EA9.html
title: '[問片] 一部日片 兒子跟不合的爸爸帶著癌末的媽媽找旅館'
content: '劇情的開頭跟結尾我已經忘記了


  我只記得男主角跟父親很不合

  父親是那種個性有點日本傳統關白亭主類的大男人


  主角母親罹癌後，父親才注意到母親的重要


  有個詳細狀況我忘記，但大意上我記得是這樣的橋段：

  主角母親死前的最後一個心願

  是能夠全家一起去一個地方旅遊（好像是溫泉勝地）


  但是最後去到那邊才發現住宿都客滿了

  男主父親好像咕噥、埋怨了幾句

  母親則是很歉疚的說造成大家麻煩


  男主就爆發了：

  這個女人替你操持家務、鞠躬盡瘁一輩子

  你連她死前想全家團團氣氣旅遊一下都不行？

  然後一邊哭著跑出去

  大街小巷想要找到一間可以下榻的旅社


  = = = = = =


  雖然不成敬意，但我願意支付300p（稅前）

  給第一位提供確切片名的大大m(_ _)m


  --

  Linux is the bone of my world.

  Kernel is mybody, and initramfs is myblood,

  have created over a thousand Distros.


  Unknown to impossibility.

  Nor known to limitation.


  --

  thx guise :-)'
