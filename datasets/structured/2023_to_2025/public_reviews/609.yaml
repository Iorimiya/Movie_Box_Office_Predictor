title: '[問片] 外遇爸爸與學校老師以及一艘帆船的電影'
content: '這部片是很久以前在春暉電影台看到的…


  劇情敘述：不修邊幅，隨性自在的爸爸。外遇後，非常在意自己的打扮與言行舉止

  ，媽媽只是覺得奇怪，沒發現老公已經跟學校女老師有外遇。發現外遇的是他們的女兒

  ，因為女兒某天回學校拿東西發現的…


  最初的完美家庭，爸爸原先計劃全家乘一艘帆船出遊，但外遇之後就擱置不理，整天只

  想跟老師約會。


  結局：一陣突如其來的大風將帆船燒毀…因為有人趁機放火把它燒了，請幫我找找這部

  片名囉，謝謝。



