url: https://www.ptt.cc/bbs/movie/M.1458563308.A.611.html
title: '[新聞] 《特工爺爺》華仔扮壞爸爸唱〈原諒我〉'
content: '中國時報【（鍾志均）】


  動作強片《特工爺爺》由洪金寶自導自演，江志強及劉德華（華仔）共同監製。華仔此次

  不僅身兼投資、監製及演員，更為主題曲填詞、演唱，以４種身分力挺洪金寶。該片21日

  中午公布主題曲〈原諒我〉MV，透過歌詞，將人們對親人的離開感到愧疚與無奈娓娓道來

  。


  華仔自2010年推出《Unforgetable》專輯後，已６年沒有發片，僅有和電影合作主題曲，

  包括電影《失孤》及《賭城風雲Ⅲ》等，同樣親自填寫及演唱主題曲。此次他在〈原諒我

  〉中，意圖傳達出「人人都需要被原諒的」一種心情，訴說內心不捨與惋惜之情。


  此次MV中，他更突破以往成熟睿智的形象，飾演一名「混混父親」，人物性格十分鮮明，

  總是對女兒很凶。最終「混混父親」在經歷幫派鬥爭後省悟，人物性格的反差也凸顯出他

  的精湛演技。《特工爺爺》４月１日上映。


  新聞網址：


  --'
