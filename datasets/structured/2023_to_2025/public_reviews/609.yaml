url: https://www.ptt.cc/bbs/movie/M.1209192872.A.03D.html
title: '[影評] 門裡與門外：評《一個好爸爸》'
content: "網誌版：\n\n\n\n    張艾嘉說起故事來總有一種獨特的溫柔，就好像床邊故事那樣的婉約。這次執導《一\n個好爸爸》，拉來得意門生劉若英助陣，並由古天樂挑起大樑，試圖由這一對才在2007年\n\
  以《生日快樂》廣受好評的組合，要再次在螢幕上擦出火花。整部電影果然仍是濃濃的張\n艾嘉特有風格，在簡約的敘事技巧裡展現出一股溫馨的力量。\n\n    《一個好爸爸》將故事拆出兩個截然不同的世界，就以「家」的大門做為分隔。家門\n\
  以外，李天恩(古天樂飾)是逞兇鬥狠的黑社會角頭；家門之內，卻是為女兒做牛做馬的慈\n父。兩個世界在李天恩的悉心隔離之下，似乎就這麼精確的以隱形的家門為界，彼此井水\n\
  不犯河水。然而，這種表象的和諧終究不能永久的維持；大人刻意隱瞞、孩子不願面對的\n壓力鍋終究引爆，成為電影衝突的高點。\n\n    張艾嘉在本片中應用了相當多門裡／門外這樣的元素，將情感的對比透過門的隔離加\n\
  以強化出來。天恩與美寶(劉若英飾)第一次的邂逅，就是透過「打開警局訊問室的門」做\n為巧妙的暗喻；之後，美寶的父親在小孫女第一次進家門時，也拉上了門展現他的憤怒，\n\
  但是父女之間捨不掉的情感，終究透過若隱若現的毛玻璃穿透出去；喜兒在幼稚園替慶祝\n父親節進行演出，一邊是在台後等待開門奔向父親的天真童心，另一邊則是被牢門禁閉的\n\
  絕望懊悔，潔淨的玻璃門與沉重的牢門成為孩子／成人的最好對照；苗可秀與古天樂在醫\n院隔著廁所門的精彩對手戲，則貼切地展現了母子之間既貼近又隔閡的尷尬；李天恩與喜\n\
  兒男友彼得(譚俊彥飾)的兩代互動結束在電梯門的夾縫之中，取而代之的是警官父親與黑\n道老爸同輩間的對立與和解。\n\n    從種種門的意象來看，也就不妨將在電影中加道門。因為這道門的存在，門裡／門外\n\
  的世界可以簡單的被區隔開來；但是也因為有門的存在，使得兩個世界之間還有往來的空\n間，不至淪入極端的二元對立上。\n\n    回到本文開頭所提示的，《一個好爸爸》的門裡是家庭，門外就是江湖。在黑道江湖\n\
  這一面的刻劃其實是過度浪漫的。香港電影在黑幫題材上已經累積了不少的成就，無論是\n描寫英雄化後的兄弟情義，或是黑吃黑的險惡算計，都早有可觀的作品問世。張艾嘉在處\n\
  理黑道江湖的世界時，卻顯然沒有採用這些已成的套路，無論是與警察頭子交手的過程，\n或是與陳果、莫少聰兩個跟班鬼混的戲碼，其實都還是在強化李天恩心繫家中的好父親形\n\
  象，所以才有砍人尋仇之前，在電話中逗弄女兒的有趣場景。\n\n    然而，這樣的視角雖然十分別開生面，也可以製造前述場景中的對比趣味，但是因為\n全片只用這樣的角度去看門外的世界，所以效果是相當不彰的。李天恩在戲中是唯一要在\n\
  這道門之間來去的，我們也只能透過李天恩的面貌來感受門裡／門外的不同。然而，劇本\n卻讓古天樂的演出只流於慈祥父親的一面，而不能像《殺破狼》中的洪金寶一樣，展現兩\n\
  種面向的衝突，於是李天恩的角色也就跟著單一、平面了起來。畢竟，如果要將李天恩的\n黑道背景隱去，故事中的好爸爸就幾乎變成一個尋常角色，失去了特殊的賣點。觀眾看到\n\
  李天恩努力漂白的過程，以及人在江湖的無奈，所以對於來自母親、妻子的壓力，或許還\n能寄予同情；但是他在外混得過於溫文儒雅，讓這些女人們給予壓力的強度上，卻有反應\n\
  過度之嫌。\n\n    當然，大部分的導演都會有自己擅長與不擅長的題材，張艾嘉在處理門裡的世界：家\n庭分子間情感交流時，就展現其十分優異的氣氛營造能力。可以自然得如同李天恩第一次\n\
  抱起女兒的模樣、也可以喜劇式的處理美寶與天恩交往的流程；或者像是天恩與母親的絆\n嘴，展現了極高的戲劇張力。無論是靜是動、是急是緩、是喜是悲，都拿捏得恰到好處。\n\
  \n    這些優秀的情感刻劃撐起了這部電影，然而，若是一道門只有門裡而沒有門外，這道\n門就失去了存在的意義。《一個好爸爸》儘管只是部溫馨小品，但卻也顯得有些過分沉溺\n\
  在家庭的溫馨之中，沒有辦法展現其中人與環境拉扯的勇氣與徬徨。鏡頭沒能夠打開門，\n多拍下一些外面的世界，是至為可惜的。\n\n--\n            \
  \                           \n‧ \n\n--\n◆ From: 61.64.65.129"
