title: 'Re: [討論] 誰最會演爸爸??'
content: '不知為何，看到這標題第一個想到的並不是原文底下留言的那些演員，而是在鋼鐵英雄裡

  飾演主角爸爸的 雨果威明


  其中有兩個部分最讓人為之動容吧，第一個是主角在餐桌上表明想要從軍的時候，爸爸的

  反應，第二個則是爸爸在昔日戰友的墳墓前，跟兒子述說著戰友的過去以及不捨


  看完這部電影之後，改變我對「將心比心」一詞的看法，曾經我認為，是不是站在對方的

  立場想，就能理解對方當時的心境，但我錯了，對於一個退伍的老兵來說在戰場上奮戰的

  隊友們在自己的眼前一一死去，如今活著的只有自己，有誰能夠理解自己心中的掙扎？又

  有誰能夠理解自己即將面對每一個不安的夜晚？


  如今這一詞在雨果威明的眼中，只剩諷刺


  而雨果威明把這些心境很完整的表達給觀眾，雖然他在這部電影裡的戲份不算多，但卻在

  我心中留下深刻的印象，讓我重新愛上了這位在影壇打滾多年的老演員


  如果還有機會讓他再演一部親情戲，我心目中最好的選角就是他


  --'
