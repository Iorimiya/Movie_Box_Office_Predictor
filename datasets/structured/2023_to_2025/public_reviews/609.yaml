title: '[新聞] 喜獲千金！「榮恩」當爸爸了'
content: '喜獲千金！「榮恩」當爸爸了



  葛大維


  兩人透過公關發言人表示：「女兒在5月7日（英國時間）誕生，不過值此重要時刻，請大

  家尊重我們的隱私。」




  所以包括女兒的名字、體重、母親的現況等其他細節，至截稿前一概欠奉。




  猶記魯伯特之前受訪曾半認真半開玩笑說：「我真的很想當爸爸，如果先生男孩，我一定

  要替他取名『榮恩』。」




  可惜魯伯特的心願「暫時」實現了一半，先生了女兒，不知道會不會取名「妙麗」；但顯

  然「榮恩」這個名字，有待他再拚第2胎生兒子時再用了。




  在電影《哈利波特》系列演「榮恩」揚名的魯伯特葛林，2011年和女演員喬琪娜格魯梅定

  情，今年4月證實懷孕，沒想到這麼快就生了baby。




  有外媒報導，魯伯特和喬琪娜已「秘婚」，只是沒公開；但大多數外媒仍以「女友」來稱

  呼喬琪娜，顯示兩人似乎仍未婚。




  但結不結婚有那麼重要嗎？如今兩人喜獲千金，升格當爸媽，責任更大，且攜手邁向人生

  新里程，那才是最重要的。





  新聞網址：




  --'
