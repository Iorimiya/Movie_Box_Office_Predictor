url: https://www.ptt.cc/bbs/movie/M.1433007259.A.076.html
title: '[好雷]加州大地震-爸爸真的很重要'
content: '本來想趁大考前休息放鬆一下

  於是挑了最愛的災難片-加州大地震

  然後很快就後悔了…

  由於坐很前排

  地震和溺水又是死穴

  看完壓力更大了…

  全身從頭僵硬到尾

  每一次大震動的畫面我都快崩潰了…

  落山機舊金山和胡佛水霸又都去過

  是有沒有這麼身歷其境

  不蘇胡到覺得吸不到空氣

  下樓的時候腿軟軟覺得整個樓都快塌了@  @





  ================這是防雷線================



  本來是抱著看2012這類爽片心情進電影院

  覺得應該會很輕鬆悠閒

  整個劇情主軸架構場景特效真的也跟這類災難片差不多

  老梗到一個不行

  但跟2012比起來就是很不一樣

  大概是因為哈伯斯帥很多降子(誤)

  可以不用再看他一直用45度揚角下巴看人滿好的

  很多段文戲的內心戲還滿有感情的



  2012雖然也是追著主角一家為主線跑

  但是覺得這家人整個都很開外掛

  老爸看起來也廢廢DER

  只要會開車就好飛機別人會幫他開

  家人間也都沒有真正經歷什麼天災下的掙扎求存

  (除了最後在方舟上給人家出包要想辦法關水門)

  整個就讓觀眾很出戲

  彷彿整場天災跟觀者的角度無關



  加州其實也差不多

  一開頭就知道想在這種毀滅式災難下存活

  首先最重要的先決條件就是"老爸"他很重要

  要不就要是美國政府氣候學家

  不然就是要有幫大老闆開車司機這種工作

  再不然就是要像我們哈伯斯這類職業救難隊員

  有上百次成功救援資歷

  要會開飛機跳傘飛車飛艇還要會扁人


  想當然爾身為美國片男主角一定要有的公式身家背景

  首先通常都會受過一些特種訓練身懷一些特殊技能

  然後一定要有個女兒(←身材不好不能當他們家小孩呦)

  再來 一定要跟老婆分居不然就離婚

  (絕對不能家庭幸福美滿喔)

  然後老婆一定都有個滿厲害的小王

  用以突顯男主角即使再身懷絕技當站在多金小王身邊

  一變得一敗塗地的盧蛇…

  然後就是如果你剛好是亞洲人或韓國臉

  不好意思你就是要第一個先領便當….


  話說本片的小王還是驚奇四超人耶

  本來還在腦補等下大地震時他會不會使出橡皮人的大絕來拯救大家(誤)


  不過加州在災難劇情上比較要大推的地方在於

  主軸清晰明確

  雖然格局不大

  但不會犯了支線放太多反而讓劇情支離破碎的大忌

  讓觀眾全程都可以跟著這家人努力求生團圓的線去跑

  分別落單的家人也各自努力熬過每一次大毀滅的時刻

  想盡各種辦法求生重逢

  無論如何都相信老爸一定會來救他們

  這點和明天過後一樣

  所以對於看完片子的後勁體驗會相對深刻



  在進行完救援任務後

  哈伯斯(拍謝我完全忘記他在片中叫什麼名字)

  發現老婆要跟自己離婚

  帶著女兒跟小王準備開始同居生活

  很孤單的一個人開著故障的直升機要去修理時


  收到老婆和女兒的求救

  兩人分別受困於不同兩地


  就那麼剛好威能老爸可以開著直升機即刻救援

  很驚險的救到威能媽媽

  樓都塌了還沒受重傷

  還可以輕巧的飛撲直升機

  (不太清楚和媽媽約在餐廳談話的那位看起來尖酸刻薄的太太是誰???

  話都還來不急聽清楚就掛了)


  然後受困在地下室車上的女兒即時被才剛認識沒聊幾句的英國男救了

  這段劇情實在是覺得很不符合邏輯…

  完全推測不出是什麼樣的電力讓英國男可以帶著小弟弟衝到那麼危險的地方救一個不見得救得到的女孩ㄦ…

  算了編劇一定要這樣安排一下


  反倒是繼父小王拋下她

  我認為比較符合大災難下人性的正常反應

  但好來屋一直以來都對繼父很不友善

  一定要這樣醜化他….

  實在覺得滿不公平的…


  但倒也讓人有了另種層面的反思

  當他掉了一隻鞋子和災民一起恍惚的不知該往何處前進

  在那一刻

  即便是家財萬貫擁有一棟棟高樓大廈像趙騰雄或虛虛東這些大老闆

  如果有那麼一天面對天崩地裂一切都灰飛煙滅的災難

  在那一夕之間

  人和人之間的生命似乎又變得平等了

  大家都一樣一無所有

  沒有誰的命比較值錢

  彼此間能夠依偎給予支撐活下去的

  只剩下愛了…

  這也是這部片一直緊扣的主軸


  至於哈伯斯那邊

  維持從玩命6以來的技能

  就是無論何時他需要任何一種交通工具

  都一定可以輕易弄到手

  而且絕不是普通等級的

  一定是改裝過的

  例如說還沒修好還可以開很久在功成身退的直升機

  從強盜那邊搶來的車車…

  (想跟哈伯斯搶車你沒事吧大哥….

  即使拿槍抵著你的頭也照樣秒殺KO你…)

  或是馬力超給力可以爬過大海嘯順便再撞破大樓的小艇

  (明明鏡頭才拍到只是個很普通的小馬達啊…可能機體裡真的有改裝過吧…)


  跟太太在這一路上慢慢的解開很多當年大女兒意外死亡的心結

  滿喜歡他們在小飛機上等加油的那段內心戲

  要一個這樣子硬漢的老爸坦白面對那種無法自拔的內疚自責的痛

  詮釋的還不錯到位...雖然演技還可以再磨一磨

  但比起玩命裡ALWAYS的脖子落枕肌肉僵硬已經超有FU了

  這場災難巨變的歷程其實也是這個家庭的療癒之旅

  唯有面對死亡無常的當下

  人才多多少少願意去把自己的防衛放下

  攤開自己最脆弱的那面給對方看見

  不用再繼續ㄍ一ㄥ下去….

  承認自己的失敗和心碎

  祈求原諒和寬恕


  另一頭…要當哈伯斯的女兒也很不簡單

  努力帶著兩個英國一大一小撲龍共

  (他們兩從用完千斤頂救完女主角後就沒有什麼太實質的技能了

  看起來就像認定跟著女主角跑就一定可以活命的FU

  因為她有個會開飛機來救援的老爸降子)

  不單要想A計劃還要想B計劃

  溺水後不忘SHOW身材

  不過就是男友的等級還太嫩

  當然最後還是要靠威能老爸出面


  雖然你都知道人一定會救得活

  但那個過程還是很揪心

  眼睜睜看著二女兒也差點在他面前走掉

  而這一回無論如何都不肯放棄的那種執著

  真的很有力量

  讓人想到復航空難拼死救回懷中北鼻的爸爸

  那種為人父母的本能真的是這種感覺....




  總而言之

  看完這部片得到一個結論

  就是如果遇上九級以上的強震

  加州理工學院會是你最好的選擇…

  那裡真的很安全說….


  P.S 我覺得最後女記者好像會跟羅倫斯教授在一起…(疑?)





  --'
