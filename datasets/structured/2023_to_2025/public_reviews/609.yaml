url: https://www.ptt.cc/bbs/movie/M.1597254728.A.840.html
title: '[情報] 美國翻拍版《我的意外爸爸》將由《別告訴她》導演執導'
content: '根據 Observer 的最新獨家報導指出，去年以《別告訴她》享譽影壇的中國裔美國女導演

  「王子逸（Lulu Wang）」將執導美國翻拍版的《我的意外爸爸》。




  《我的意外爸爸》為日本金棕櫚名導是枝裕和在 2013 年推出的作品，當年該片入選坎城

  影展主競賽單元並且從巨匠 Steven Spielberg 領導的評審團中抱回評審團獎（該屆評審

  還有李安），也是是枝裕和首次在坎城影展以個人名義拿下大獎（《無人知曉的夏日清晨

  》的最佳男演員為頒予柳樂優彌）。


  《我的意外爸爸》由福山雅治和 Lily Franky 等人主演，描述兩個原本看似幸福平凡的家

  庭在一日接到來自醫院的通知，表示當年兩家同日出生的兒子因疏失而被調亂了。兩個毫

  無相干的家庭因而陷入煎熬，並開始嘗試讓彼此的兒子到對方的家庭中生活。




  其實早在 2013 年時 Steven Spielberg 就和夢工廠買下了《我的意外爸爸》的翻拍權，

  當時原本預計由《美國派》和《非關男孩》的兄弟檔導演 Paul Weitz 與 Chris Weitz 來

  執導，但最後這項計畫並沒有實行，如今則輾轉到了環球影業旗下的藝術和獨立電影品牌

  「焦點影業」手上。


  美國翻拍版的《我的意外爸爸》並不會由王子逸親自編寫劇本，而將會交由曾經入圍過東

  尼獎和普立茲戲劇獎的女劇作家 Sarah Ruhl 來執筆，他在今年也有一部首次編寫的電影

  劇本作品《The Glorias》在日舞影展首映，為知名女性權主義記者 Gloria Steinem 的傳

  記電影，並由《我想念我自己》大滿貫影后 Julianne Moore 主演。


  王子逸將會親自擔任翻拍版《我的意外爸爸》的製片，此外則還有《深情交談》的製片 Jo

  sh McLaughlin 將透過他的電影公司來製作此片。




  翻拍版《我的意外爸爸》目前尚未有製作時程與上映檔期。


  王子逸手上還有兩部作品正在製作當中，包括 Amazon 製作的電視劇《The Expatriates》

  ，改編自韓裔美國女作家「李倫京」同名小說的此劇描述身處異地香港的三名美籍女性的

  母女關係、婚姻以及友誼（取自誠品書局）。據悉該劇會真實前往香港取景，且王子逸先

  前透露 Nicole Kidman 主動找上門希望能夠演出此劇。


  此外王子逸則將會和負責《別告訴她》美國發行的 A24 再度攜手合作新片《Children of

  the New World》，改編自美國男作家 Alexander Weinstein 筆下的同名科幻短篇小說。

  不過目前該片尚無任何新訊息。





  --'
