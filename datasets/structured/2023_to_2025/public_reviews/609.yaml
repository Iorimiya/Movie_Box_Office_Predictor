title: '[請益] 關於爸爸、丈夫會被懷疑的設定'
content: '自己看過的三部西洋電影

  (雪地迷蹤、控制、人肉搜索)

  都出現當太太、女兒失蹤了，

  著急萬分的先生、爸爸，

  反而會被懷疑

  其實是自導自演的幕後黑手，

  請問這樣的設定是怎麼出現的?

  例如是來自哪一起真實犯罪事件嗎?

  最早出現在哪一部電影呢?

  蠻好奇的，謝謝。


  三部電影的樣本數的確超低，

  但就足以讓我有這樣的疑問，

  所以想請問看看。




  --

  原來做丈夫的這麼惡名昭彰><

  請問我哪裡有說我見識廣了?您閱讀能力有待加強?'
