title: '[ 神好雷] 他不笨，他是我爸爸'
content: '這部上映於2001的優質電影

  展現了至今同類型電影的帝王風範

  目前為仍只能期待未來能有超過這部的同類型電影


  劇情感人肺腑，撼動人心結局溫馨無比

  演技更是無話可說

  女兒小小年紀，超齡演技

  男主神演技，勇奪影帝


  但更神奇的是，連其他配角的演技也是無可挑剔


  拍攝手法穩固紮實，運鏡流暢，完美帶觀眾深入其境，劇情不矯情，激發觀眾不只同情更

  是同理心


  這部100分


  男主角如何順利跟妹子上床的

  劇情也很引人遐想，這點不扣分也不加分


  畢竟重點是，生女兒真好~








  --'
