url: https://www.ptt.cc/bbs/movie/M.1688306857.A.ED4.html
title: '[問片] 女科學家遇到裝扮爸爸的外星人（有雷'
content: '最近一直想到某一部戲，可是年代大概多久也不確定，應是講英語的沒錯。


  電影的女主角是科學家，然後有個富翁有一天宣布願意提供一個外星人發送過來的太空船

  設計圖，可以讓女主角他們見到外星人。


  發生一堆事情之後，女主角終於見到外星人了，但外星人是擬態成她爸爸的模樣，大概講

  了幾句話之後就送外星人回地球。


  太空船像一顆球，傳送器基本就是一個籃框，等她回到地球時，地球上的人都說「沒有喔

  當時就是太空船掉進籃框，然後掉進海裡，一瞬間的事，任務失敗了」沒人相信她見到外

  星人。


  記憶很片段，可是問了好多朋友都不知道這部，想問問有沒有人能幫忙。


  --'
