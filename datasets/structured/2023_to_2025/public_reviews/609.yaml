title: '[問片] 一部小男孩被爸爸殺死埋起來的驚悚/鬼片'
content: '好幾年前看過  只記得一些片段 是一部外國片


  好像是主角(一個家庭，有大人跟小孩)搬家到一棟房子


  房子很大


  但搬進去後總感覺這房子有問題


  有一次主角(可能是男的)發現從房子外面看窗戶的數量跟在內部的窗戶數量不一樣


  房子外面窗戶數量比內部多一扇


  後來去尋找


  發現有隱藏房間


  --------------------


  再來就不記得順序了


  後來就是知道隱藏房間的主人是一個小男孩


  小男孩是被他爸爸殺死後 埋在一個地方


  主角好像還有挖到 獎牌 的樣子


  還有一個片段是


  皮球怪怪的(?)  主角拿去丟掉(水里)


  結果丟完回家發現濕漉漉的皮球從樓梯上滾落....(抖)


  ----------------------------------


  我家人說那小男孩的名字好像是喬瑟夫(我不確定)


  有點怕  ... 可是劇情好像不錯


  搜尋關鍵字都找不到


  有板上大大知道這部片嗎??


  先謝謝你們了~~~


  --'
