title: '[問片] 金髮女生誘惑有錢朋友的爸爸'
content: '是小時候在電視上看到的電影，感覺有點年代了


  故事在說一個有錢但有點書呆的女生A交了一個金髮美女朋友B

  B會帶A做一些叛逆的事情（印象中有刺青）

  後來B不知道怎麼跟A的爸爸搭上線

  兩人有一些踰矩的互動，但我忘記到什麼程度，只記得有開跑車出去兜風，好像還出了車禍

  另外A的媽媽好像本來就有心理疾病，最後從房間窗戶跳樓的樣子（不知道想跳有沒有跳成）


  還有一段是

  A他們家有舉辦派對或宴會之類的

  A的媽媽因為生病所以沒有露面（或只露面一下下）

  而B則是穿得很漂亮也很性感

  讓A的爸爸受到更大的誘惑


  只記得這樣QQ

  麻煩大家幫我解惑，謝謝～


  -----

  Sent from JPTT on my iPhone


  --

  我沒有看過美國心玫瑰情

  但我剛剛看劇情簡介覺得好像有點不太一樣（但美女跟普女當朋友的設定一樣XDD）

  我在內文已補充其他瑣碎的劇情

  再麻煩大家了QQ


  正解！！！w大太強了！！！

  我上網用關鍵字搜都只找得到成人片orz

  btw小時候不知道女主角是Drew，她真的好正～～～'
