title: '[請益] 威利旺卡的爸爸到底怎麼了?'
content: '如題，提姆波頓版的巧克力冒險工廠中，

  威利旺卡的回憶中演到小時候一次憤而離家出走，

  但回家後卻發現一排公寓中只有自己家整個不見。

  多年後回去找爸爸時，那棟公寓又在大雪紛飛的荒原中。


  所以他爸爸到底怎麼了?

  一直很喜歡這部片，看了很多次這個地方卻一直不解。

  是原作裡的情節嗎?

  還是什麼象徵隱喻?

  先謝謝大家了。



  --'
