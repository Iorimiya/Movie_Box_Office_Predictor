title: '[新聞] 梅拉爸爸不開心！安柏赫德水行俠2戲分'
content: '梅拉爸爸不開心！安柏赫德《水行俠2》戲分遭刪...杜夫朗格吐遺憾


  Yahoo奇摩新聞


  2024年1月17日 週三 下午9:10




  安柏赫德在《水行俠 失落王國》飾演梅拉，畫面卻不多。（圖／翻攝自預告）


  記者許瑞麟／綜合報導


  動作巨星杜夫朗格（Dolph Lundgren）在DC電影《》中飾演「梅拉」（Am

  ber Heard）的父親「涅羅斯」，近來他受訪時表示，他和安柏赫德《》

  在補拍階段的戲被刪減許多，讓他有些遺憾。


  安柏赫德先前因為和強尼戴普的官司，讓不少影迷連署不想在《水行俠 失落王國》看到

  她，雖然一度有傳言她的畫面因此遭刪減，但導演溫子仁解釋該集聚焦在「水行俠」亞瑟

  和弟弟歐姆的兄弟情，本來就不會有太多梅拉的戲分。




  杜夫朗格飾演梅拉的父親。（圖／翻攝自預告）


  但杜夫朗格向《comicbook.com》表示，他在最初的劇本中扮演了更重要的角色，安柏赫

  德也是如此，而他的戲分遭刪減和安柏赫德有直接相關，畢竟兩人飾演父女，「

  。」


  他為電影觀眾感到惋惜，「因為我認為最初的劇本很棒，我看了一點最初的剪輯，它真的

  很棒，所以我沒有看到任何得重新拍攝和重塑故事的理由，不僅僅是我，最後顯然也讓很

  多觀眾感到失望。」


  新聞網址：




  --'
