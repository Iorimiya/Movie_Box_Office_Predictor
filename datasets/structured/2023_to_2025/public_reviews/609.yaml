url: https://www.ptt.cc/bbs/movie/M.1557411091.A.E26.html
title: '[普雷] 名偵探皮卡丘-爸爸去哪兒'
content: '1.影片名稱 : 名偵探皮卡丘


  2.觀影時間 : 19:00


  3.觀影地點 : 拒答


  4.觀影方式 : 自行購票






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  看完真的好想養一隻皮卡丘




  劇情方面有點微妙


  前期的劇情主要是講述人類與神奇寶貝的相處模式


  接著就像rpg到處觸發事件蒐集線索以及聽皮卡丘嘴砲


  老實說我有點昏昏欲睡


  主要是因為雷恩萊諾斯見縫插針的碎碎念讓我有點疲乏


  我喜歡看人嘴砲 但是對於這種過於密集的吐槽讓我這種非母語人士聽來


  其實頗妨礙觀看劇情對話 當時我看死侍的時候也是有這種感覺




  但裡面也有不少有趣的亮點


  競技場的吼爆蛋重低音音響 吸盤魔偶的雙人默劇也超可愛


  神奇寶貝的造型設計也看得出製作組的用心


  雖然限於神奇寶貝本身的人設屬於日式可愛風格


  真人化後那種萌系大眼有點難容於真實世界


  但電影給予每個真人化的神奇寶貝一個合理的外型


  黏膩的大舌頭 橘皮的噴火龍 草木為衣的土台龜


  看到真的是眼睛一亮


  (雖然我覺得皮卡丘的毛應該要服貼一點~)




  後期劇情揭開謎底的的時候倒是還蠻精彩的


  雖然用於乘載世界觀的劇情有點弱


  看到人變成了神奇寶貝讓我有種莫名的驚悚感


  反派更是個智障


  但看皮神放大招就是爽


  變形怪的臉也異常的還原


  看到雷恩萊諾斯真的出演爸爸更是讓全影院笑出聲來


  我無法相信會有散發愛的光環的死侍!!






  整體來說 這部算是輕鬆看


  我在電影院中看到有不少是大人帶小孩來看的


  觀影體驗還不錯 小孩子們乖乖看電影 反倒比周圍的大人還安靜


  前半場有些成人觀眾常在我覺得很正常的地方笑出聲來


  真的是每分鐘就笑一次 不誇張


  但後續大家都安靜看電影 也就沒什麼好抱怨的了




  至於片尾的動畫 是以2d版本的方式來呈現


  裡面還有把主角群的造型改為動畫版本


  搭配好萊塢式的神奇寶貝主題曲 建議大家可以留下來仔細看完喔


  --

  這方面真的硬傷 看字幕與看畫面真的無法兼得'
