title: '[好雷] 小島來了陌生爸爸(2019尼德蘭)'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  小島來了陌生爸爸 My Extraordinary Summer with Tess(2019尼德蘭電影Mijn bijzonde

  r rare week met Tess)


  荷蘭->尼德蘭


  ml




  中文片名不可取！破梗了。原片名: 我與黛絲的超怪一週，比較切題！

  這部以小男孩Sam為主角，暑假期間和家人們一起到小島度假，認識小女孩Tess後，所經

  歷的一週的故事……


  我很喜歡這片，觀影過程中是輕鬆開心的，而度假場景的樸實自然鄉野及海邊，感覺悠閒

  ！本片的故事情節、人物角色設定、演員表現……完全合乎我胃口，很滿意！怪怪卻可愛

  的男孩女孩，二人相遇、互動、創造了很有意思、奇妙的一週經驗及回憶！

  主演的男孩、女孩的片中對話、怪怪的想法及常識分享，令我會心一笑！二人自然討喜的

  演技，和這片親子暑假電影氛圍，相得益彰，太搭配了！其他的角色及情節，都令我看得

  歡喜。這片有淡淡地涉及的獨處、家人生死順序、收集回憶……等議題，令我很有感！是

  具有寓意又好看的影片。

  這片給我的歡欣、驚喜感，令我聯想到多年前，接觸歐洲兒童電影<冰淇淋的滋味> Annal

  uise and Anton(1999德國電影)


  是小男孩小女孩的友誼故事，

  看完也是大呼Bravo.

  這二片都是心頭大愛！


  本片很棒，記錄下看完本片的心情。


  中華電信MOD電影199

  小島來了陌生爸爸 My Extraordinary Summer with Tess

  Mijn bijzonder rare week met Tess

  Steven Wouterlood director

  Sonny Coops Van Utteren as Sam

  Josephine Arendsen as Tess

  Tjebbo Gerritsma as father Sam

  Jennifer Hoffman as mother Tess

  冰淇淋的滋味 Annaluise and Anton

  親子電影

  兒童電影

  尼德蘭

  荷蘭

  Waddeneilanden 瓦登列島


  --'
