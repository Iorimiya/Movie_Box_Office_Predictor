url: https://www.ptt.cc/bbs/movie/M.1504344260.A.CE8.html
title: 'Re: [負雷] 想問爸爸去哪裡？的紅衣小女孩2'
content: "傳統性別價值？\n還是道德價值？\n\n\n\n\n 雖然我也不喜歡這結局，\n但電影中的紅衣真正成魔的原因，\n不是被復活，\n而是覺得被「最愛」的人「遺棄」了，\n\
  所以最後被小女兒用愛感動，\n破解誤會跟冤念沒了，\n昇天了也是合理啦，\n恨意已經沒了。\n\n\n\n\n林美華真正的死因是太愛孩子了，\n所以紅衣一死掉她就拼命想讓祂復活，\n\
  就算被外表嚇到，\n她在紅衣走上歪路殺人的時候，\n也只是選擇「封印」祂而已。\n\n\n林美華說過幾次，\n一次是說一年前有人破壞了「封印」，\n一次是說要去「封印」祂的地方，\n\
  所以是封印紅衣，\n不是解決紅衣。\n\n\n為什麼？\n因為紅衣是妹妹啊，\n是就算成魔了，\n聽到媽媽的呼喚，\n還是會不懷疑的走向媽媽的妹妹啊，\n所以林美華下不了手，\n\
  但又不想祂走上歪路，\n最後死在紅衣對她的恨意上面。\n\n\n而劃掉符咒的部分，\n我來講個例子。\n\n\n今天你的另一半突然開始躲你，\n然後拿刀捅你好幾次，\n\
  最後在妳面前把刀丟掉說：\n「我還是很愛你的。」\n\n\n你當下會相信？\n是我我一定不信啦，\n而且被附身的怡君有說出一句話：\n「媽媽被祂們殺死了。」\n\
  \n\n所以我一直在懷疑到底是紅衣殺了林美華，\n還是其他魔神仔殺的。\n\n\n回到主軸，\n既然林美華是愛著紅衣，\n那又怎麼會是「意圖殺死孩子」的女人？\n\
  \n\n\n\n這個我同意，\n完全無法從電影中看出他的個性，\n唯一可以知道的，\n是他很保護人，\n這點我後面說。\n\n\n林淑芬的腳色是學生時期被強暴，\n\
  後來當社工的年輕媽媽，\n很明顯她一開始是要追究的，\n當雅婷失蹤後她可是一路追殺到廟裡，\n當發現雅婷是真的失蹤，\n她的重心就轉移到找雅婷了。\n\n\n\
  而先不論Line對話中乩身對雅婷的勸導，\n跟後來為了尋找雅婷的努力，\n在最後卡多里樂園退駕被包圍的時候，\n他一路退後，\n第一個動作卻是雙手往後護住林淑芬跟林雅婷，\n\
  這點還不夠成為一個稱職的愛人嗎？\n\n\n\n\n法律的問題在於，\n今天乩身是不是成年了，\n如果成年就是法律，\n如果沒有成年就是家屬提告才算，\n今天經過那麼多事件，\n\
  林淑芬認定他可以當雅婷的老公，\n雅婷也愛著她，\n這哪裡有問題？\n\n\n在醫院的幻境中，\n林淑芬想起了當初生雅婷的決定，\n也對於逼雅婷墮胎感到愧疚，\n\
  所以才會對雅婷說她都動，\n她會陪著她不是嗎？\n\n\n往後的人生是他們自己的，\n小父母跟岳母，\n可能阿公都同意把小孩生下來，\n哪還有什麼不Ok？\n\n\
  \n講白了整個宮廟都是他們家的，\n養不養的起？\n搞不好都比工程師有錢好嘛啊！\n\n\n\n\n依照藍色窗簾理論，\n作者的作品是被各自解讀的，\n我看到的是母親對孩子奉獻的愛，\n\
  對於小孩的愧疚，\n還有臺灣電影特效的......\n\n\n套一句電影沉默之丘說的：\n「母親是孩子的上帝。」\n紅衣因為媽媽的執念與遺棄跟攻擊而成魔，\n\
  怡君的小孩為了保護媽媽而死去，\n虎爺對付不了的被附身的雅婷，\n被淑芬真情的呼喚搞定了。\n\n\n說性別價值觀，\n是要跟我說母親對小孩的影響力有多大嗎？\n\
  \n\n\n\n所以電影中有哪一位男性這樣嗎？\n\n\n\n\n啥原罪？\n帶著藍色眼睛，\n這世界就是藍色的。\n\n\n這部說的不是墮胎造成這些悲劇，\n\
  而是這些過度執著的行為引發的悲劇。\n\n\n而且紅衣也不是墮胎出來的，\n是因為過度的愛所造成的恨，\n究竟是哪裡跟好女人壞女人有關係了？\n\n\n以為乩身是人柱力，\n\
  虎爺都是乩身身體裡面喔？\n\n\n無套內射搞不好是雙方合意，\n這點跟性別觀點完全沒有關聯，\n跟臺灣的垃圾性教育有關啦。\n\n\n還在肚子裡面的小孩也是條生命，\n\
  今天一對情侶無論為了什麼原因不作保護，\n結果卻要殺死無辜還沒看過世界的生命，\n這是道德觀念的問題好嘛。\n\n\n李淑芬被強暴後懷孕，\n她「自己」決定要生下這小孩，\n\
  是跟父權有什麼關聯？\n做下這個決定的不正是後來表現出母愛的媽媽嗎？\n\n\n-----------------------------------------------------\n\
  題外話，\n我一直覺得如果最後在卡多禮樂園，\n看起來已經無望的時候，\n如果是阿公帶著轎班，\n一路放鞭炮衝進來救人，\n感覺會是一個很厲害的畫面！\n\n\
