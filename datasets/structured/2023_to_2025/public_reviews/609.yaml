url: https://www.ptt.cc/bbs/movie/M.1472975887.A.8A4.html
title: '[超好雷]屍速列車-爸爸們本來就比較吃虧'
content: 'IMDB: 8.0/10.0 (連結)


  Rotten Tomatoes: 93% (連結)


  可看度: 總之就是要去電影院看，二刷也OK的程度!



  在被演爛了的喪屍電影中另闢蹊徑，在一個有限的空間與時間中創造出一段人性光明與黑

  暗的寫實故事；刺激感高、寓意多、催淚性十足，可以挑剔的地方幾乎是零(不是沒有)。

  2016年不看不行的片!




  ===========================================================



  [喪屍電影還不夠多嗎?這次在車上也太北七了吧，要怎麼演兩小時?]



  老實說這是我第一次看到<屍速列車>時貨真價實地的想法。


  說到喪屍，最經典的已經有<活人生吃 Dawn of the Dead>，該有的人性刻畫一應俱全，

  堪稱典範。


  而要看對科技的批判加末日般的預言景象就是<28天毀滅倒數 28 Days Later>。


  動作片也已經有<惡靈古堡系列 Biohazard>，主角身材好正翻天，還附帶無敵威能，爽片

  百分百。


  要Cult送你一部血漿不用錢的<新空房禁地 Braindead>。


  要Kuso則屬近年再也無法被超越的<活人牲吃 Shaun of the Dead>。



  而我個人最喜歡的則是較為特殊的描寫孤獨求生以及人類意志展現的<我是傳奇I am

  Legend>(雖然小說比電影更好)。



  [以上的片的確都獨樹一格，但<屍速列車>還能硬生生開拓出另一片境地實屬難得。]



  而我覺得是因為編劇在這裡展現了神一般的功力。


  第一，這劇情非常單純線性。


  眾所周知，用多線劇情比起用單線劇情更容易操縱觀眾並藉由炫技得到好評，但此片反其

  道而行，最有力的地方卻是像韓文片名<釜山行>寫得，這只是從首爾到釜山一段旅程中發

  生的故事而已。線路都畫好給你了，童叟無欺。



  而這趟車程也不過就是兩到三個小時。因此除了一開始有些背景介紹之外，所有的事件都

  被蓄力、濃縮，然後一一爆發在這兩點之間，產生了情節緊湊並且連綿不絕的效果。在中

  間很多次我覺得故事真的說到一個份上該暫停一下，但是還沒喘過氣下一幕又已經開始，

  頗有被追逼得意味，畢竟，在到達終點之前這一切都不算結束。


  從這角度來說，觀影者也像是被迫搭上一班沒有停靠站的高速列車，並強行維持著時速

  300公里從頭衝到尾。


  (所以說起來，我覺得中文片名雖然有新意但是沒有傳達到重點，這部片根本不是以喪屍

  為主體的片，取這種名字完全只是商業考量)


  第二，這空間非常有限。


  雖然不知道韓國高鐵有多長，但了不起就10幾節車廂；中後段劇情更是只侷限在9到13號

  車廂間(雖然後面跑出去了但是已經接近尾聲)。


  當然在有限的立體框架中說故事的例子還是很多的，像是<戰慄空間 The Panic Room>或

  是更極端的像是<失控 Locke>。


  但要在這樣的局限中說好故事就不容易了。更不要說喪屍爆發，空間又不足的情況下，如

  何在人被通通殺光之前把故事說完就已經很困難。



  而編劇很巧妙的藉由中間停靠大田站做了一次劇情補給(後述)，順便將主角群與其他眾人

  隔開好為後段的最終高潮做鋪陳。


  在整個過程中不會讓觀眾覺得失去新鮮感，又維持了劇情的完整度，還增加了更多刺激性

  ，真的是到了必須要起立為這個編劇鼓掌的程度。


  停靠大田站就此在整部片中起到一個重要轉捩點的效果，甚至可以說如果沒有停靠大田站

  ，那這部片就可以直接end了。


  原因是，人性從此點開始分歧。



  [如果說邪惡會傳染，那善良可能也會]



  男主角帥爸(孔劉)身為基金經理人，凡事只顧自己也是很合情合理的(基金經理人是否該

  考慮也上街去汙名化一下)。


  從序幕指導下屬:你是為那些散戶工作嗎? 到車上喪屍剛爆發時只猶豫兩秒鐘就把胖爸(馬

  東錫)還有漂亮孕婦(鄭有美)關在外面，自私的人性表露無遺。而這一切都從他口中親自

  得到證實，在女兒(金秀安)讓位給老婆婆後，帥爸直接說了:這個時候妳只要考慮好自己

  的事情就好了。


  到此為止都是最基本不過，畢竟他本來就是身處在人吃人的環境。


  但在大田站發生了兩件事讓他改變了，第一就是當他們要繞道逃避隔離時，小女孩說:你

  就是都只顧你自己所以媽媽才會離開你(QQ)。另外就是當小孩孩即將被喪屍攻擊的時候衝

  回來的胖爸猛力一擊將喪屍打退(帥爆了)。


  這之後很明顯的帥爸就變了。


  首先逃進玻璃門後拼命擋著門，要知道如果是之前的帥爸，肯定是放著胖爸還有棒球男孩

  們獨自逃下去趕車的，畢竟他很清楚這些人即使在他落跑了也還會、還能撐一陣子。


  第二個更重要的是當帥爸上車後對胖爸伸出了援手要拉他上來。


  當然以上兩件事情都可以說是帥爸知道要有人幫助才能渡過險境，所以他其實還是有在算

  計。不可否認有這樣的可能性。


  胖爸當然有把一切都看在眼裡，所以一開始還酸小女孩說:他真的是你爸爸? 到大田站再

  次上車後叫帥爸殿後時說:這不是你們基金經理人最會的過河拆橋嗎?(這裡除了說笑話緩

  和氣氛之外，可能也表達出他還沒完全相信帥爸所以趁機酸一下)



  但之後帥爸徹底證明自己的轉變，就是當流浪漢耍笨從行李架上下來踩空沒跟上大家時，

  帥爸衝回去救他。這裡就完全沒有算計的可能，因為多一個行動不是很靈敏又笨又打不了

  架的拖油瓶，絕對對生存沒有幫助。


  也因此，當情況越演越烈越失控，到了13節車廂卻進不去(因為那邊正在發生跟這邊完全

  相反的事情)，胖爸死守卻被反咬一口時，胖爸選擇將孕婦託付給帥爸。


  這顯示出經過這麼多共患難的艱困時刻，胖爸已經相信帥爸並把他當作是自己人了。


  而帥爸的反應是說一句， 對不起...。這時候真的滿讓人動容。


  個人認為這句對不起有兩種意思，一是最簡單的，不能跟戰友一起走下去，要拋下你真的

  很對不起。另外一種是我腦補，帥爸已經完全徹底認同了胖爸的這種利他主義，而這樣的

  人卻即將要死了，我這種原本相信利己主義的人卻活下來，對這種不公平說對不起。


  在當下被這種自我犧牲的氛圍感染的不只一人，在列車翻覆後，流浪漢義無反顧的擋住喪

  屍們的攻擊讓小女孩還有孕婦逃走，這幕有強烈的既視感，跟胖爸在車廂上一夫當關檔喪

  屍時如出一轍。流浪漢在一開始也是完全只顧自己逃命的那種，大田站時不僅威脅帥爸還

  跑在他前面呢。這樣一想，胖爸這種笨蛋病毒的傳染性真的很強(笑)。


  之後就是全劇最讓人淚崩的，帥爸被咬然後選擇跳車。


  他們全部都開始相信，可以的話大家一起活著離開，真的不行的話，你們活下去吧。


  所以，善良會傳染。




  而剛剛提到，另一邊廂正發生完全相反的事。


  一開始還會幫助別人逃上車的站務員被自私胖子一罵，漸漸地開始無法堅持自己的立場。

  而天平開始傾斜就停不下來，從不幫女學生講話，到後來直接把女學生的嘴摀住，更甚者

  把好不容易到達的大家趕到另一個車廂。


  這裡的對比很鮮明:


  胖爸<=>自私胖子

  帥爸<=>站務員


  只是站務員不是主角，所以描寫較少，而且導演很明顯地是想要演出光明的一面，所以對

  於邪惡會傳染這件事沒有著墨的這麼多(覺得好可惜啊~~~((被毆)))。


  這裡說會傳染是真真切切的，導演巧妙地放了一個對照組，就是完全沒跟大家接觸的列車

  司機。在看到自私胖子跌倒時司機還去扶他。表示他在上車之後到最後都還保持著幫助別

  人的本性。




  [好了，以上都很淺顯易見，但從我的角度是這樣的]



  首先，九把刀說的邪惡(或我說的善良)會傳染大多數情況是指一對一的關係，但這次是在

  一種群眾恐慌的環境底下，說是邪惡/善良的傳染，應該說是從眾效應的擴大與渲染。


  人都有被孤立的恐懼。因為人是群聚的生物，對於來自團體的壓力特別敏感。


  而這樣的恐懼如果跟能否生存下去的疑問做連結，效果是數倍。即是說，在這時刻更無法

  思考更不想動腦，"總之大家說的總不會錯吧"這樣的心態會更明顯。


  所以站務員在車廂中面對自私胖子以及女學生的質問，他最終的選擇可能不是被傳染的，

  而是被從眾的本能壓迫的。想想阿希的從眾實驗吧(WIKI連結)，誰敢說自己在當下能夠說

  出心中真正的看法?


  但也會有人質疑，在這之後站務員摀住女學生嘴巴可是他自己要做的沒人逼他。是的，因

  為這時候已經不需要逼他了，他自己會遵從自我一致性的暗示(即是，我沒有錯/我不能承

  認我有錯)，為了維護人格的完整避免產生認知失調而繼續往死裡幹，甚至要說這時候做

  得越過分越能(對自己)證明他沒有選錯路。


  相反的，能夠承認錯誤並坦率改過的人無疑是特殊的。這種人必須具備強烈的自信心、優

  秀的邏輯思考能力、良好的審時度勢能力、迅速的決斷力，還有超群的執行力。


  疑?這些豈不是剛好是成功的基金經理人該具備的嗎XDDD


  所以帥爸根本天生英雄命啊XDDDD(這我亂扯的)



  第二，真的要說這並不是善良對邪惡，只是利他與利己的差別而已。而應該滿多人會說遇

  到這種情況的時候真的很難保持助人的本性，所以這沒有對錯。


  但，真的是這樣嗎?


  在<隱藏的邏輯>一書中有提到，具有較高利他主義成分的群體比起較高利己主義的群體，

  在競爭中更容易生存下來。



  所以也許這件事情本身沒有對錯，但是在物競天擇的法則底下，利己主義者(們)就是容易

  被自然界淘汰。更進一步說，這類人對於物種的演化沒有幫助，所以較容易被篩選出來然

  後留在過去。


  我覺得這部片還滿寫實的就是因為這樣。也許觀眾會覺得特意營造出對未來的希望(最後

  倖存的是小女孩以及孕婦，表示下一代被保住了。而且大家所認知的"壞人"都死光了，倡

  導了正義必勝)，但實際威脅物種生存的狀況發生時，可能真的是利他主義的群體有較大

  機會留下它們的基因。


  真是具有教育意義啊(笑)




  [最後要說的是...一點點缺點]



  孔劉演帥氣老爸很適合，但是他本人就是給人正義良善的感覺，像是<熔爐>裡面的熱血老

  師。所以反而覺得他演壞角不是很有感，因為就是不適合。也許這也是他自己的包袱吧，

  我想觀眾們也不想要他去演壞角就是了(而且臉盲如我一直覺得他很像年輕版的大澤隆夫

  ，兩個都是好人臉啊)。所以一開始自私的基金經理人的角色帶入感不足，說服力其實不

  是很夠。


  然後，我覺得本片的喪屍還是讓我有點出戲。



  不知道是歐美的喪屍已經做到完全仿真的程度(請問真的在哪裡)，還是裡面演技不到，就

  覺得本片的喪屍還是有點"人味"。


  不過到後期喪屍一多之後，這樣的感覺就比較淡了。


  另外劇情稍微有違和感的地方我覺得有兩處，第一就是明明手機引誘黑暗中的僵屍這招很

  有效，為什麼不再次使用?明明後來跟孕婦們會合後就有新的手機啦?去爬行李架時間哪裡

  夠啊?


  第二是女友問我的，最後自私胖子已經快轉化成喪屍了，為什麼帥爸不直接一腳把他踹下

  去火車呢?


  這個我個人認為可能還是因為帥爸已經受感召，不再是一心為己的人，所以還是會覺得能

  救幾個就救幾個。另外觀眾是用上帝視角所以很明顯知道自私胖子死定了，但是從主角群

  的角度來看其實很難知道被感染的人具體症狀如何，因此不好馬上做出判斷把自私胖子丟

  下去(這也是為什麼主角群到達13節車廂，大家起鬨要把他們趕到外面去時，沒人能為自

  己說話，因為他們也不知道自己是不是受感染了)。


  女友也問我為什麼病毒的感染有些人快有些人慢，以一個學病毒的角度來看主要原因有三

  種，第一個就是個人體質不同。像是<我是傳奇>裡威爾史密斯有抗體所以完全沒事，或是

  <28周毀滅倒數>裡，有特殊基因的人只會有眼睛出血症狀但意志清醒等(但會變成帶原者)

  。



  第二就是致病機轉，基本上喪屍病毒一般設定就是血液/體液傳染然後病毒感染到腦部，

  因此也許跟被咬到的地方有關，比如被咬到脖子跟被咬到手，變化速度可能不同。


  第三就是意志力強弱。這個比較玄，但是可以看到胖爸擋住群屍的時候曾經一度要變化，

  但是又硬生生活回來再檔個一陣。然後自私胖子也是，拖了超久還能夠跟主角對話，雖然

  智力有點退化。最後帥爸也是還能夠跟女兒道別再好好回憶一下女兒出生場景，感覺都跟

  意志力有關係(不能馬上變化，該做的事情還沒做完)。


  然後，本片頗有南韓大男人主義的意味，如果是歐美，女主角們一定也很猛甚至連小女孩

  都會很機靈。不像本片就是一個老弱婦孺要被保護的概念(雖然孕婦最後有擊打自私胖子

  一下，不過感覺還是很弱)。



  [最後的最後]



  如果依照韓片的邏輯，通常最後是要兩發子彈結束的。雖然依照這個導演跟編劇在前面打

  造的氛圍來看他們應該是不會這麼做，不過真的好想看看如果結局是這樣的話觀眾會是甚

  麼樣的反應呢~~(壞心)。不過個人認為這樣會造成前後調性不一，變成糞作的機率比較大

  就是了。



  --

  這篇怎麼寫這麼久...




  --


  這個我在看電影的時候就有想過喔，看到後面柵欄有一部份是空的

  (如果我沒看錯的話) 就是最後把自私胖子弄下去的地方。


  其實我也想不出更好的，只好說<釜山行>...Orz

  但是這樣就沒那麼高吸引力了也是事實



  抱歉啦我真的寫太多了所以棒球小子跟歐巴桑部分就割愛了。


  至於敲破門我覺得自私胖子應該是判斷真的會變喪屍就不會敲了，

  不過保險起見他還是叫人把門綁起來免得變喪屍之前還強行闖入(所以是有所提防的)



  樓上幾樓都有提到同樣觀點，這真的是很好的連結抱歉我沒注意到~'
