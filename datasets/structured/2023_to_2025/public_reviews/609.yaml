url: https://www.ptt.cc/bbs/movie/M.1413126456.A.D3C.html
title: '[好雷] 我的意外爸爸 '
content: '我本來就很愛是枝

  這部電影屬於越看越能有感觸的電影阿

  非常細膩 非常寫實

  可以說是近5年來日本最佳的電影阿，跟橫山家之味可打成平手


  一部爸爸的真實血淚成長史

  良多是個因母親早逝而封閉自己，對父親與養母不慎親近甚至有點厭惡

  對自己與孩子都很嚴苛，個性自私又自我

  是一個看似帥氣又成功，但實際上是個中二角色


  這樣的人日本想必多得滿出來

  現年40歲的日本男性剛好成長時代是最富裕的泡沫時代的人

  而他們長大後面對家庭壓力與日本經濟衰落

  一定會非常中二，所以也中二地把自己的兒子推開


  良多終於想通要做個好爸爸，要卸下自己的心防，開始更成熟地面對他所愛的人

  發現花的殘骸、看了相機中的照片，他才知道慶多對他這個爸爸的愛有多深


  是枝用Lily Frank作了一個對比，我是覺得太過老套

  不過瑕不掩瑜，是枝在良多這角色的刻畫上太過成功

  是枝拍攝手法很有力量，像是良多去找琉晴時，並不拍福山雅治的臉

  而是拍慶多因為難過躲進放棉被的櫃子中，讓觀眾多麼心碎的畫面


  這是一個極為自省的電影，讓人警惕自己，非常細膩動人，一流的電影


  --'
