title: '[超好雷] 青春末世物語 HAPPYEND'
content: '雷文防雷資訊頁






  導演空音央的首部劇情長片《青春末世物語》(HAPPYEND)，

  以近未來日本為背景，鏡頭聚焦於一群高中畢業在即的青少年。










  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  人臉識別系統、校園監視系統，一切看來離我們不近卻也不遠。


  我很喜歡導演在劇情中揉合日本地震的元素，同時也溫柔地沒有讓地震帶走生命。

  可即便如此，頻繁的地震以及隨之而來的壓抑卻是實實在在地影響著他們的生活。


  多元的移民社會，有人存在著國籍身份認同問題，有人為親子間的語言溝通藩籬而苦惱。

  上位者濫用權力，警察保護的是官僚與富者，教育體系扼殺學生的自由。

  校園內外，眾人對於統治者的不滿逐漸高漲，促成一次次的示威行動。

  一群不被信任、不被看好的年輕學子，可他們面對的未來究竟如何？


  成長環境、身份差異對一個人的影響從片頭就可見一斑。


  為了變革走上街頭，直面當局現況，固然是一種選擇。

  而選擇擁抱過去的美好，對未來不再保持期待，只想活在當下，又何嘗不是？


  印象特別深刻的一場戲，以悠多與小幸兩人的影子搭配對話互訴自身立場。


  而頭尾兩次的天橋，從纏著對方想跟他一起回家，到看破不說破，已然走上不同道路..


  《青春末世物語》反映青春的不安，用高壓的環境塑造出青春的多種模樣。

  它同時也是一篇政治寓言，真實且殘酷。

  配樂與攝影也相當出色，我今年目前最愛的電影。


  感謝好威代理，沒有錯過這部真是太好了。


  現在買票有送海報喔！超美～




  --'
