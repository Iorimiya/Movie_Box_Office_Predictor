  雖然一定是set好的











  影片並沒有所謂統一的主旨

  畢竟是圍繞著幾位年輕人的周遭去發展的


  真要說的話，就是對抗體制

  本來以為校長可以更開明一點，我錯了啊!


  身為既得利益者

  怎麼可能會忍受下位者對於自身的批評呢


  最後兩位男主角的友誼有沒有持續下去呢


  人生就是多了那一點不確定性

  所以導演才把畫面留在最後的長鏡頭裡面吧






