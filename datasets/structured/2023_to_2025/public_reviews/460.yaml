content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~













  先說一下 片頭那位DJ叫做￥ØU$UK€ ￥UK1MAT$U

  是個這幾年很夯的一位日本DJ喔!


  因為他放的曲子完全沒有固定的曲風跟模式


  再來，沒想到片中的主角們喜歡的音樂曲風居然是techno!!!


