url: https://www.ptt.cc/bbs/movie/M.1743668209.A.D85.html
title: '[普好雷]青春末世物語：沒在開玩笑的話唬爛大賽'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《青春末世物語》普好雷影評：「沒有用的年輕人」的啟蒙之旅\n\
  \n○ 看待不公的兩種態度\n\n先從本片核心人物悠多和小幸談起。同樣熱愛音樂的狂放少年，片中兩次出現他們的剪影\n，第一次是在音樂派對，第二次在巷弄中玩音樂。兩人同樣身處音樂中，悠多活在當下盡\n\
  情享受，小幸則保持對體制壓迫的覺知(第一次是警察盤查、第二次是試圖喚起朋友對不\n公的關注)。\n\n體制腐化、社會腐敗，難道你什麼都不做？悠多選擇躺平、當作沒看到，小幸則開始有了\n\
  反抗意識。\n\n○ 聯想力與革命\n\n《青春末世物語》中從富美口中說出兩次「聯想力」，在這部片中至關重要。\n\n\n\n富美曾大肆批判他們這個世代已沒有希望，因為大多數人如悠多一樣對不公無動於衷。我\n\
  不只會解讀成聯想力的缺失，更要看到思想層次差異的來源。\n\n片中具有反抗意識和行動的少年，分別有小幸、富美，還有被自衛隊宣導冒犯的同學們。\n他們為何能具有反抗體制的勇氣與覺醒，有三個不同要素：小幸擁有留日韓國人的特殊身\n\
  分，飽受歧視與排擠所苦、富美接觸公民團體熟悉思潮，其他同學則是因為共同利益遭受\n侵害，所以才選擇站在一起對抗校長。\n\n校長為\n了維護自己的跑車，可以以安全為由安裝監視器；為了避免校園被政治紛擾，能隨意收回\n\
  給小幸的獎助學金。甚至為了讓靜坐抗議的同學閉嘴放棄申訴，拿勒令退學作要脅。\n\n校長懂得從學生最\n在乎的利益攻破(家境貧寒、肚子餓、退學壓力)，甚至也提出「畢業的你們根本無法獲得\n\
  回報」的強力論點。相較之下，富美只能從道德邏輯層面，強調「這是不對的、我們不能\n上他的當」。最後在彩排中說出：「這些在乎規則的人，戰場上一定能毫不猶豫的聽令殺\n\
  人。」也是一個不太入耳的類比。\n\n慘忍的說，當籌碼金額懸殊過大，本多的一方終將勝利。都是垂死掙扎。\n\n後來小幸打破沉默(可以注意一下，他後來大多時間都在沉思靜默)，頭戴安全帽為同學送\n\
  韓式飯糰，帶頭吟唱代表反抗意識的歌曲。他終於可以站在示威者的角度思考，用自己的\n力量給予支援，卻無法表示自己的身份。因為他無法承擔退學的風險。\n\n他很想實踐理想，但承擔不起。最底層的人無力反抗，它們的生活以如履薄冰、自顧不暇\n\
  ，只能讓社會階層上佔優的群體代為發聲。\n\n○ 巨大改變的「震源」絕非地震，而是微小的覺察與推動\n\n小幸和悠多，並非一開始就走向分歧，而是在對環境的微小觀察、相關思潮份子的鼓動，\n\
  一點一點的讓差異逐步擴大。\n\n他們走向不同的方向，不代表他們互不理解。悠多也了解校園監控系統缺乏善惡灰色地帶\n的荒謬之處，不然就不會有那些取巧的行為(陷害棒球隊長、小聰明偷樂器)。\n\
  \n\n\n抵抗校園的不公，犧牲的代價最壞是退學，也有反抗的期限。但出社會的我們，該怎麼面\n對國家、社會乃至階級的種種壓迫呢？\n：\n\n\n\n\n\n\n\
  \n\n\n\n\n歌曲連結：\n\n網頁好讀版：\n\n-\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n脆：\n\n\
  --\n自己是看到的重點是：小幸在政治思想（參與社運）上的啟蒙過程\n當然也有大家談到最多的，往日友情的變質與分離\n\n五人組各自的任務設計（想要表達的事情）還蠻明顯的，但未必足夠立體"
