url: https://www.ptt.cc/bbs/movie/M.1747923837.A.919.html
title: '[普雷] 《青春末世物語》Happyend '
content: '之前上映好像引起小小熱潮，因為太忙沒跟到



  看完覺得還好 （以下請參考）





  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  除了基本設定並在影像上有別於寫實的末世未來感，《青春末世物語》與眾多描述青少年

  成長的電影並沒有任何新意，至於亮點則是偶爾出現的一些突然輕鬆幽默的vibe悄悄鬆動

  在劇本上便宜行事的邊緣（學生、抗爭民眾）與中心 （校方、政府）的對立陣營。



  就算自己以前身為高中生是一個不會去違抗校規的人，我也「不會認為」 就算違抗校規

  作為抗爭的啟蒙。難道出社會還要繼續反社會，或是被收編這樣現實歷歷在目的，抵抗無

  用的消極說詞。



  而是在電影（劇本）美學上千萬要注意看似涇渭分明的正反之力會變成一種政治上的力，

  於是不管傾向哪邊，都可能讓影像變成一種「政治宣傳」，一如《青春末世物語》像是一

  種「青春反叛」的樣板式宣傳。故劇本美學最難的，往往是現實中看似正反黑白容易判斷

  的對錯中模糊、兩難甚至矛盾之處。（在此可參考比利時導演 達頓兄弟的作品）



  也因此毫不意外電影中的老大哥（big brother）（或大他者幻影）與近年來西方國家因

  為戰亂導致移民問題使得右派崛起，在電影裡訴諸為日本傳統保守的民粹。甚至另外有些

  「心動」的是，以抽菸作為監測信號的玩笑，嫁禍給被當作保守國族主義的棒球選手。在

  此會想到《可憐的東西》的人羊移植的惡趣味，這裡想問的是：羊怎麼了嗎？羊比較低賤

  ？就該被嘲笑？




  （註）心動的意思是，棒球選手作為相對主角不太搭嘎的族群，但沒想到出來是被當作笑

  話處理。（心情有些複雜）



  --


  拉特飯 - 以商業力量進入獨立市場


  --'
date: 2025-05-22
