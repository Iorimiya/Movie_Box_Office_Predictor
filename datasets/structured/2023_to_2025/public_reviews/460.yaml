content: '我腦袋都是乒乓


  我很喜歡那句

  你第一次看到海是跟我

  你第一次打手槍也是跟我


  甲到靠北 愛死


  青春末世物語

  我的第一個直接是青春電幻物語

  我不知道翻的人是不是同一個

  但我就是覺得 這兩部說不定同個類型的東西

  本來要去電影院

  結果放著放著就懶了

  然後就下檔了


  我很喜歡這種國高中生面對整個世界的憂鬱

  這類型的故事

  這部放大了很多對於社會歧視雜七雜八的批判

  我是覺得可以少一點

  但那個最後的 定格 聚焦回的兩人關係

