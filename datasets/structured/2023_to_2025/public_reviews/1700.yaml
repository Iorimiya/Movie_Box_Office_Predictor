url: https://www.ptt.cc/bbs/movie/M.1682955349.A.83B.html
title: 'Re: [ 普雷] 絕地營救 美軍無情人有情？'
content: '部份43



  約翰跟阿邁德之間沒有到兄弟情誼那樣的深？

  覺得不如說這種情況下，該稱為「袍澤之情」

  ，在戰場上生死與共的患難之情，因為雙方都

  要在其信任之下，才能在戰場上互助存活。


  所以約翰跟阿邁德的情誼建立，除了是戰場袍

  澤情，最重要的是本片靈魂主旨


  「 The Covenant」盟約

  雙方在互信基礎下的袍澤之情







  美國就是一個極具維護自己利益國家，口譯員

  就是他們在戰場上利用的一環，利用完就被當

  成棄子，撤離順位永遠排不到，畢竟包含其他

  難民，數萬人的移民，要考慮到的事情很多，

  當然...美國出爾反爾的事情也不止這一次了

  ....






  不能說這是超死板，而是軍隊中的服從、照規

  矩來的思想，軍中系統要是大家都不服從、不

  照規矩，那軍中會大亂，沒人會聽令。不救阿

  邁德覺得不至於會覺得理念崩潰，而是PTSD

  及對約定之事，造成一生良心上的不安





  --'
