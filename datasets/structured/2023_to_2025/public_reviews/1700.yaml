url: https://www.ptt.cc/bbs/movie/M.1685114299.A.FD4.html
title: '[普雷]《坎達哈行動》（內有與絕地營救的比較）'
content: '以下有雷





  如果看過絕地營救的人，可能看這部片會有種「嗯.......？？」的感覺，

  因為我就是這樣，但如果不這麼覺得也沒關係，這只是個人主觀想法。



  以下是個人主觀看法，有普雷



  以下是個人主觀看法，有普雷



  以下是個人主觀看法，有普雷







  簡單說這是一部特工在阿富汗身份暴露後，必須帶著口譯人員逃到約定地點的過程。

  聽起來好像很驚險，但是我覺得整個過程就是看傑瑞德帶著一位原本想回來找人，所

  以接下嚮導和口譯工作被無辜捲入的老人家在開車，後面一堆人在找他們啊最後不是

  失敗就是失敗GG。



  我先承認我看過絕地營救，而且不止一次，然後我個人主觀認為蓋導的絕地營就是

  我目前看到2023年  運鏡、故事節奏和配樂最渾然一體的作品，而且裡面好看的片段

  真的是........就是好看，衝擊很大，印象深刻，跟約翰的藍眼睛一樣的印象深刻。

  蓋導在說這個故事時，故事線非常簡單，我覺得其實以電影來說也應該這樣，

  導演要非常清楚自己要說的是什麼，盡量在鏡頭下表現出來，而不是一直刻意要加入台詞

  表達對戰爭的反省啦對於人們受到的傷害啦


  絕地營救過程就是約翰認識阿邁德--進行任務--任務失敗--約翰和阿邁德逃命約翰受傷--

  阿邁德拖著約翰直到回到基地附近-- 約翰陷於內咎與崩潰--約翰採取行動--

  約翰找到阿邁德--約翰帶著阿邁德一家走上運輸機，結束。


  看似直線，但是裡面比如在抓法拉傑後，約翰問部下才知道阿邁德的過去，以及為什

  麼阿邁德為美國人工作的原因，光是這樣其實觀眾接收到的訊息量就很大了。


  所以今天跑去看傑瑞德巴德勒的這部片，只能說各種表現實在是很普，他裡面至少匯集了

  3支不同的敵人（ISIS、塔利班、地方軍閥），友方美國CIA本部，羅曼，還有英國記者這裡。

  看似是要主角湯姆的逃亡過程危機重重，事實上以觀眾看起來就是*__*好、好亂。


  總之在開頭的報搾行動成功後，主角湯姆又接下一個任務，但是沒想到有個英國記

  者接受到五角大廈的情報，然後被聖城軍截獲綁架了女記者試圖問出他們的身份，

  這地方我真的整個問號說到底他們要幹嘛，線人說是愛國，女記者說想暴露中情局的

  虛偽，我看到一臉「？？？？」可能是我對整個情勢體悟比較慢，搞不清楚在這個地方

  到底是要揭開什麼黑幕，然後最後就是自己被綁架媒體公布湯姆照片，湯姆得逃命。


  然後逃命過程坦白說，即便是帶上口譯的老人家阿穆，感覺讓實在......沒啥緊張感。

  之前我看傑瑞德的全面攻佔系列，誇張雖抓張，但是傑瑞德在裡面的動作是很俐落的

  節奏也抓得很好，但是這部片我就有種「你們怎麼換輪胎還要吵？」

  「沒事引爆土炸彈後面追兵沒看到嗎」、「那個一直在騎摩托車追他們的小哥是

  很帥但是騎到一半沒油也太掉漆了吧」總之我就是各種問號。


  總之最後他們順力逃到接走他們的飛機那裡上了飛機，然後騎車追他們的特工還特地

  騎車過去要追捕他們（然後中槍），美國用無人機（應該是？）轟擊追捕的塔利班

  讓湯姆和阿穆及時逃進基地去搭飛機，故事結束。



  然後我就不提鏡頭了，跟蓋導這次的作品比玩鏡頭我感覺有點...輸，配樂的歌曲

  卡進去的時機，也沒有像絕地營救表現得那麼好，或者令人印象深刻。


  最後說到主角表現，總之蓋導找傑克葛倫霍來演約翰金利，約翰金利飾演的美國士官

  不僅非常勇敢、善戰，全副武裝的樣子超帥，蓋導還極盡所能地把「約翰的美麗藍

  眼睛」利用到極致，那怕他在電影裡面也是一臉毛茸茸像顆奇異果，蓋導就是能拍成

  一顆絕世美果<---我想不到其他形容詞總之就是這樣。


  絕地營救就是這麼好片，帶給觀眾的衝擊夠深夠強，其他片除非真的超級突出不然

  很難取代這部說是戰爭片但是充滿如詩美感的電影。


  總之，2023年蓋導真的應該以這部片去競爭電影配樂或鏡頭的入圍名單，甚至得獎。




  相對之下，我真的覺得傑瑞德這次就是.....被太多支線分走能表現的劇情了，非常可惜。



  --


  室友A：火星人趕快回火星去吧！地球不是個好地方啊\____/


  我：*^^*危險的火星人都到地球來了，現在火星才安全呢！


  往火星的機票買一送一買商務艙送頭等艙哦～


  --

  感謝幽靈砲艇來友情力挺，不然約翰和阿邁德一家還有普耶真的要GG惹Q口Q

  因為題材幾乎是一樣的，很難不比較，而且絕地營救表現太好（個人主觀）

  實在很難今天看完坎達哈後拿出來比較，今天也是想給蓋導點奶茶的一天'
