title: '[  雷] 絕地營救'
content: '防雷
























































  當初看這物被大力推崇就有留意一下

  傑克葛倫霍的片我也沒啥踩雷過的

  昨天看完終於懂他的價值所在於

  片名普通仍然掩蓋不住其光芒(票房就慘了沒錯

  說真的我對蓋瑞奇都還好,兩根槍管以前甚至看不下去

  沒想到這部電影該有的不只都有,情感上還大幅增強

  每個慘烈的場景頓時也不違和的感性起來

  兩人返回基地的過程更是增添許多心靈上的重量

  如此優秀至極的調度讓他不只是軍事片

  而是昇華成大場面和人物高度描寫的電影

  再來對比2年多前美軍撤出阿富汗

  一切的犧牲幾乎白費真是不含唏噓

  劇情也許圓滿,現實卻有更多悲劇

  然後最後那個空軍派出來的武器也太帥了吧!

  跟變形金剛1打爆那隻蠍子的是同一台嗎?

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  會拿美麗比喻成愛的人，都是不知愛情真相的人

  會把醜陋比喻成愛的人，都是熟知愛的驕傲者


  --'
