url: https://www.ptt.cc/bbs/movie/M.1683567886.A.292.html
title: '[好無雷]《絕地營救》不要看預告片啦！'
content: '《絕地營救》不要看預告片啦！ 7/10分

  　

  原本看預告以為又是一部平庸的片

  但發現網路上其實一片好評？

  只好親身進戲院見證了

  　

  看完我只能說預告實在是剪爛了

  而且預告爆的雷太多！

  大大削弱了觀影體驗

  　

  預告剪得像是兄弟情誼之類的劇情為主

  槍戰為輔

  但其實片中許多劍拔弩張的緊張橋段滿多的

  有點像是《亞果出任務》的那種緊張感

  或是《火線赤子情》一觸即發的壓迫感

  這次蓋瑞奇拍的都很到位

  情誼戲甚至拍到有點太男男了（？


  另外想特別提到的是

  片中的槍聲特別的逼真欸

  真的是聽得很爽

  上一次聽到槍聲這麼有感的

  應該是《落日殺神》了吧

  這點加分很多

  　

  整部片除了中間一小段覺得有點拖之外

  節奏都滿順的 也有一直讓人想看下去的動力

  如果你沒看過預告 還會有更多的驚喜感


  特別喜歡導演把塔利班那種瘋狗特質拍得很到位

  各種天羅地網 追殺到天涯海角的氛圍

  還有主角躲避追捕的諜對諜、心理攻防

  都看得很過癮

  讓我不禁想起湯姆克魯斯演的《行動代號：華爾奇麗雅》

  拿起話筒叫看門的小兵聽電話那段

  氣氛營造超讚


  唯一的缺點就是

  整部片看完少了一個最令人印象深刻的橋段

  當然確實每一段都很不錯

  但就沒有像《火線赤子情》《行動代號：華爾奇麗雅》等這些片

  即使過了那麼久

  還是有一兩個橋段烙印在腦海裡


  總結

  《絕地營救》片名是取的滿爛的

  但在劇情設計上算是好萊塢中比較少見的類型

  尤其傑克葛倫霍有幾幕演得超棒

  喜歡葛倫霍或是軍事片、同袍片的

  都推薦給你


  --


  無雷 電影/影集短評IG：




  --

  　

  就真的差啊 事實不能講？'
