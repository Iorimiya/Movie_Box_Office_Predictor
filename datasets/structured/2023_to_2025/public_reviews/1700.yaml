title: '[普雷]《坎達哈行動》(有《絕地營救》雷)'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  防


  防


  防


  雷


  雷


  雷






  先說結論，《坎達哈行動》故事流暢，有時間可以看看，但沒看也沒什麼損失。


  劇情上跟《絕地營救》雖著重在不同地方但主軸幾乎一致，只是後勁差很多，一部內斂中帶

  著控訴，一部中規中矩，這莫非是導演與編劇實力的差距？


  《絕地營救》主角是在阿富汗搜索塔利班炸彈工廠的美軍，《坎達哈行動》是在伊朗進行情

  報與破壞的中情局探員。前者小隊被埋伏只剩他與翻譯倖存，後者情報被洩漏與從美國來協

  助他的翻譯遭到追殺，但《絕地營救》從原文名The Covenent (原諒我把Guy Ritchie''s刪

  掉) 就將意境上升到了精神層面，所謂 「盟約」不只美軍承諾要帶這些協助過他們的阿富

  汗人離開美國，更有當那名翻譯與他拯救的美軍兩個人從此被恩情（或良知）就此綁定。他

  們不欠對方任何東西，大概也不會有什麼到美國從此保持聯絡的狗血劇情(也許會有，誰知

  道呢)，他們只是生命中的一部分記憶永遠與對方相連。


  《坎達哈行動》沒有這樣的高度，該有的老梗劇本就原封不動放進去，聽說編劇本人曾經是

  情報官，於是《坎達哈行動》成為一部呈現了中東混亂情勢的同時帶著點電影娛樂性的作品

  。在這部電影裡各方勢力匯聚伊朗、阿富汗、巴基斯坦邊界，塔利班、當地政府、西方勢力

  、軍閥、伊斯蘭國互相牽制，但這最終是一部爽片(?)而不是諜報片，所以大部分勢力只有

  個名字，出來妨礙一下別人抓主角，接著就會被打成砲灰。誰叫主角是Gerard Butler，大

  家都知道就算所有勢力都在找他，他依然可以全身而退，差別只是爽不爽。個人是認為《坎

  達哈行動》稱不上很爽，就是看主角賣賣帥。


  說到賣帥，《坎達哈行動》裡有意外驚喜，原來《維京傳奇》的Travis Fimmel也有參與，

  不過他的角色是個謎團，到最後沒能將他的背景解釋清楚，也沒太多能給他發揮的地方有點

  可惜。還有擔任不知何方勢力的帥探員Kahil(似乎是塔利班的探員?抱歉電影裡勢力太多我

  已經搞混了)，由Ali Fazal飾演，但與其一直拍他騎車以及颯爽穿脫安全帽的畫面，不如給

  他一個更聰明的結局。


  總之，或許受限時間，或許導演想要講得很多，《坎達哈行動》可能更適合寫成細節完整的

  小說，拍成電影不功不過，Gerard Butler的影迷、Travis Fimmel的影迷可以看看。




  --'
