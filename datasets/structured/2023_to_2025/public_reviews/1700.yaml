title: '[好雷] 《絕地營救》戰場一諾　重逾千斤'
content: '圖文好讀：


  《絕地營救（The Covenant）》是台灣片商「絕地」系列的最新目標，此系列

  包括絕地戰警、絕地救援、絕地重生、絕地迫降、絕地武士（？）等等等等；

  雖然這片名不能說跟本片內容沒有關係，但恐怕許多只看中文片名的觀眾會對

  片尾上的大字幕解釋一頭霧水：「Covenant，盟約、誓約、聖約，遵從一開始

  的約定直到最後。」


  這詞就是《異形：聖約》的那個聖約，也就是舊約聖經和新約聖經的那個「約

  」；用於美軍（基督徒）與阿富汗口譯員（穆斯林）這兩個世界最大的一神教

  徒之間的「約定（交易）」，真是再適合不過了。



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  本片時間點設置在美國即將從阿富汗全面撤軍的前夕，美軍已經在阿富汗與塔

  利班游擊隊打了20年的爛仗，許多人都失去過軍中兄弟，更多人對自己的存在

  意義感到質疑。


  體現在電影中，就是基地少人少槍，去突擊一個塔利班炸彈工廠居然只能派一

  支不到十人的小隊去執行，還要開三個小時的車，甚至只有在小隊目擊到確鑿

  證據後才能派出要飛半小時的空中支援……這對於一向以後備精良、支援不斷

  而自傲的美軍來說，實是諷刺。


  就像其中一個小隊員說的：「就算真的找到了殺害同袍的兇手，難道同袍就能

  活過來嗎？」不幸的是，雖然小隊的確找到兇手並報了仇，但旋即遭到塔利班

  的還擊。儘管隊員各個勇猛善戰、熟習戰術，在絕對優勢的人海戰術面前只能

  一個又一個的倒下，最終只剩下士官長約翰與當地人口譯員阿邁德突圍而出。


  之後兩人遇到車輛爆胎、約翰重傷、落入塔利班重重包圍的絕地中，只剩下阿

  邁德一人，拖著動彈不得且神智不清的約翰，一路上山下山，與塔利班鬥智鬥

  勇，與鄉民交易換物，好著歹著總算把約翰帶回到美軍基地中，完成了他對美

  軍的「盟約」：帶人出去，帶人回家。


  然而當約翰被後送美國本土、傷勢痊癒後，卻發現美軍還沒有完成對阿邁德的

  承諾：一紙美國簽證，那是阿邁德為了他的妻子與未出世的小孩，作為阿富汗

  當地人，卻願意協助美軍對抗塔利班的唯一理由。



  本片最大反派：美國移民局（誤）


  於是約翰用盡手段，找軍中上司討人情、找「萬事通」好友討門路，總算又回

  到阿富汗，找到了因協助美軍聲名大噪而被塔利班重金懸賞的阿邁德一家；並

  由於此時兩人已是「英雄人物」，值得當地美軍出動重型支援，最終有驚無險

  地突破塔利班包圍，一起去到了美國，完成了美軍對阿邁德的「盟約」。


  本片做為戰爭動作片，大場面絕對不少，無論是訓練精良的美軍小隊展現出來

  的戰術穿插、交互支援，還是塔利班游擊隊展現出來的悍不畏死、前仆後繼，

  抑或美軍空中砲塔與塔利班土製迫擊砲的使用，其畫面絕對不愧於戰爭片之名。


  但真正讓本片卓爾不凡的，應屬主演傑克葛倫霍（士官長約翰）與達爾薩利姆

  （口譯阿邁德）的動人演技。在小隊全軍覆沒、兩人衝出包圍暫時安全後，腎

  上腺素帶來的激情消褪，約翰正視到自己為了幫同僚復仇卻導致全部同僚戰死

  的殘酷現實，無助且無言地遠眺阿富汗那壯麗無限的山野。而阿邁德望著心如

  死灰的約翰，明明身為能說善道的口譯，幾次想開口安慰卻找不出詞語，那欲

  說還休的表情如此心痛。


  緊接著約翰重傷，阿邁德為約翰搭建簡易擔架、餵水餵食，用錢跟村民買來發

  財車代步，又用發財車跟遊牧民交易食物、藥品與手推車走山路──如此智勇

  兼備、堪稱阿富汗趙子龍的人物，卻在手推車卡在上山路的一個小坑上時徹底

  崩潰，一屁股坐在山崖邊，一把鼻涕一把淚的遠眺故鄉那看膩的風景。


  阿邁德是否曾有質疑，自己為何要冒著生命危險，帶著一個垂死的異教徒，幾

  近赤手空拳地跋山涉水，就為了一紙苦等不到的簽證？總之，他還是迅速收拾

  情緒，一聲聲戰吼把約翰推回了基地──而這一切約翰都看在眼裡，他可能因

  重傷而無法清晰地記憶，但還是真切地刻在了心底。


  ──這裡必須要提一下美軍的裝備確實精良，隨身帶著大把美鈔不談，還有止

  血繃帶、消毒酒精、抗生素與強心針，當真死人都能救回來。那些塔利班游擊

  隊就沒那麼好命，一發子彈就去找72處女了。


  本片也展現了阿富汗當地的複雜性與多面性，鄉民閒聊的話題是誰誰誰的兒子

  加入了塔利班，美軍卻往往只能找到錯誤的情資；塔利班為了活捉約翰達成政

  治效果而到處對不配合圍捕的村落殺雞儆猴「吊路樹」，卻引起部分當地人反

  感轉而幫助阿邁德；當地大毒梟兼塔利班長期合作夥伴，因為兄弟之情而持續

  藏匿、轉移深深得罪塔利班的阿邁德，最終也協助身為反塔利班英雄的約翰幫

  阿邁德逃出故土。


  在這個俄烏戰爭持續影響全球局勢的今天，美軍的阿富汗戰場終究成為過去，

  坦利班重奪政權，持續清算曾幫助先知之敵的同胞；誰又能保證這一切不會發

  生在有生之年、發生在我們身邊？子彈不分善惡，戰爭容不下天真，但也正因

  如此，戰場上的信諾所閃耀的光輝就無比燦爛。


  --


  --

  感謝補充背景知識!'
