url: https://www.ptt.cc/bbs/movie/M.1682784248.A.301.html
title: '[好雷] 絕地營救  這份人情看不見，它卻一直都在'
content: '雷文防雷資訊頁




  個人認為是蓋瑞奇最佳電影，二刷之後慢慢感受對話、畫面


  、音樂之後更細歡這部，看似戰爭動作片，實際上是感情堆


  疊的劇情片。



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  衝著傑克葛倫霍進場的，近幾年沒看過這種優質電影了，音樂


  加了超多分，晚上去街頭找線人的配樂就有緊張的氛圍，最喜


  歡配樂片段是發現炸彈工廠小隊被殲滅的提琴聲，無情的子彈


  與隊友接連的倒下，音樂讓你沉浸在悲壯感裡面。




  蓋瑞奇用畫面來說話，明明是戰爭片，許多畫面鏡頭拍得很唯美


  ，最後被塔利班火力集結困在水壩，彼此沒有講話互相看一眼，


  動作與神情好像約翰說出：「抱歉沒能把你救出來」，回美國在


  軍機上彼此互看點頭表達謝意，約翰頭往後仰終於填補上心中的


  內疚，沒有太多的對話卻能感受到心意。




  阿邁德與約翰對白都很有意思，阿邁德糾正叫錯他的名字，約翰


  馬上反過來糾正是sergeant 士官長，不是sir 長官，阿邁德發現


  埋伏橋段，約翰說「所以這是你的假設assumption」阿邁德回嘴


  「是推論deduction不是假設assumption」



  整部精華片段就是平常連能正常走路都崎嶇的山路、阿邁德照顧


  約翰的點滴：喝水、吃水果、傷痛、寒冷的夜晚，最難爬的上坡


  爬到一半爬不動了，阿邁德坐在旁邊痛哭，一股疲倦、心累的情


  續都湧上來，哭夠了擦乾眼淚繼續推，在戲院都看到泛淚。




  二刷發現的小細節，找線人之前約翰去找在修車的阿邁德，擦手


  看了一下文件，套完線人話說「這裡的狗真多」，最後找到阿邁


  德也在修車，約翰講完「這裡的狗真多」，阿邁德抬頭看了約翰


  擦乾淨手。




  想說救援的片段也太少，出發時候就只剩下30分鐘，但沒有前面


  花時間描述塔利班的追殺，還有大把時間去堆疊阿邁德推約翰的


  辛苦，後面打給移民局後用約翰視角回憶也不會這麼感人引發觀


  感同內疚與牽掛的人，也算是合理的時間分配。




  連假有空可以看一下這部"絕地營救"，大力推荐，劇情雖然簡單


  卻動人，配樂好聽，拍攝運鏡，感覺照翻成盟約比較好，電影想


  表達如同電影最後對Covenant的解釋




  一種羈絆、一種誓言、一種承諾。







  --'
