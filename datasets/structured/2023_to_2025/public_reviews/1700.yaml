title: '[  普雷] 絕地營救 美軍無情人有情？'
content: '雷----------------













  我天資駑鈍是真的看不出好看在哪




  片尾字幕指出


  美軍撤離後三百多位口譯拿不到護照


  與其家人共有數千人遭塔利班追殺


  這段應該是我最難過的點


  或許也是導演編劇想點出的重點





  回到劇情 整部片看下來


  我一直搞不懂光頭口譯救男主的動機


  是為了護照？


  還是為了兄弟情誼？


  還有


  如果是男主老婆提出抵押房子去營救


  至少感激一下吧


  離別時還大男人的要老婆靠過來親


  跟孩子也一副不親的樣子


  看不懂導演要表達什麼？





  最後


  護國超人壓線救援


  那個飛機拍的有點弱


  認出男主是約翰金利時


  說免費服務都沒問題


  但卻感受不出尊敬跟惺惺相惜


  覺得小可惜




  戰爭場面偏普


  劇情就見仁見智吧


  至少我個人覺得情緒無法連貫


  但如果整片是要反諷美帝的無情


  我可以再加20分





  --

  是啊這不是很諷刺 拼命救回士官長才得到活命機會。

  至於前面兄弟情誼建立我是真的看不出來，我只看到士官長不信任他，而光頭卻屢次建功

  罩了全隊。

  能懂'
