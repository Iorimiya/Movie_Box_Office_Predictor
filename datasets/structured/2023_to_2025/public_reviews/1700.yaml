url: https://www.ptt.cc/bbs/movie/M.1682886354.A.6AF.html
title: 'Re: [ 普雷] 絕地營救 美軍無情人有情？'
content: '我也看不懂什麼電影裡有兄弟情誼，就算阿邁德救了一整隊八人，電影裡也沒有演他們變成

  有過命的交情。


  再打這段文章查名字的時候發現演員認證他們劇情上真的不喜歡彼此。




  所以前面一堆人說啥情誼多深厚的都是版友自己腦補啦。


  後來趨駛約翰的應該是美軍訓練形成的一種榮耀感才對，美軍有答應要給口譯Visa庇護，就

  是所謂的The Covenant，結果上層拖超久，形勢迫在眉睫，才讓他抓狂。


  他小小的心靈沒辦法接受他認知的美軍，不...該說美國整個體系都在踢皮球。


  因為約翰是個超死板的人，從他兩次判斷錯誤還是要阿邁德要注意指揮體系就知道，就算阿

  邁德是對的也要他士官長親自說得算。所以他只好自己救，不救的話他自己受訓一輩子的理

  念就土崩瓦解，所以他夜不成眠已經接近崩潰。


  如果電影沒有最後沒放那堆照片我覺得電影拍得不錯，問題是透過照片你可以發現真實的那

  些人感情很好，沒看那些人合照笑的多真誠？結果你蓋瑞奇把人家拍成，和現實差那麼多，

  無言。







  --





  約翰重視的根本不是報恩。他也和口譯根本沒有承諾，他在意的是美軍答應要給口譯全家提

  供Visa的承諾。還看不懂？

  再說兩個地方，他回到阿富汗之後傭兵頭帕克遇到緊急狀況，和他說等三天救出的機會比較

  高，他也根本不鳥，強調了好幾次合約！合約！然後一個人單槍匹馬出發，也不管他一個人

  行動會不會失敗。

  最後彈盡糧決之際，帕克緊急救命，他開頭第一句話也是對帕克說他履行了承諾。對他那個

  腦袋來說，沒什麼事比履約更重要了，沒有回去救人前出現PTSD也演出來了。'
