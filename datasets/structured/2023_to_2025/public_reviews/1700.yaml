url: https://www.ptt.cc/bbs/movie/M.1682183735.A.AC5.html
title: '[ 好雷] 絕地營救 有優秀動作場面的感人故事'
content: '先講無雷感想:


  這部類型上可以歸類在戰爭片，槍戰動作場面等非常優秀(蓋導的動作戲都是品質保證阿)，

  整體劇情起承轉合流暢完整，緊張刺激的氣氛也塑造很到位。但是我覺得這部片最打動人的

  是他的核心主題講的是人的道義，誠信，責任感等人性最良善的一面。


  感覺大多數人看到蓋瑞奇都會想到他標誌性的黑幫喜劇片和風格強烈的敘事剪輯手法，但是

  身為看過他幾乎所有電影的粉絲，我覺得他對於角色刻劃也是非非常優秀的，在他電影中不

  管是主角還是反派都很有魅力和討喜。這部片是是他少數比較嚴肅的電影，故事重點也是兩

  位主角的羈絆，我覺得這點就很突出，是他所有電影中情感鋪陳最細膩的一次，主演的兩位

  也都把角色詮釋得超好~



  噢對了，如果是傑克葛倫霍的粉絲這部更是值得多刷，本片他又濃又密又長的睫毛和漂亮藍

  眼睛的特寫鏡頭大放送，超級賞心悅目XDD對於怎麼把演員拍得好看蓋瑞奇可是有異於常人

  的天賦，每個在他鏡頭下的人帥度都會提升一個檔次ww
















  以下有雷




  這部片故事其實很單純，傑克葛倫霍演一個駐紮在阿富汗的美軍約翰金利，在出任務過程中

  遇到塔利班襲擊小隊被全滅，只有他被當地跟他們合作的口譯員阿邁德救了下來。因為受了

  傷無法走動，阿邁德拖著他千辛萬苦跋涉了超越100公里把他帶回美軍基地。之後約翰回到

  美國養傷後得知阿邁德還留在阿富汗，並且因為救下他被塔利班通緝身陷險境，於是決定親

  自回去把他救出來。



  我覺得本片很優秀的地方是他透過短短幾幕對白和動作就把角色形象和關係建立起來。比如

  說約翰的小隊成員們其實鏡頭根本沒幾幕，但是出任務中幾句閒聊幹話就讓人感受到他們感

  情很好，也讓觀眾和他暪有了情感連結，之後他們一個個領便當就讓人非常心痛。約翰講話

  的感覺就是一個比較冷淡嚴肅的長官，但是在出任務的空檔讓大家烤肉喝啤酒，致意逝去的

  同伴等就可以得知他其實很重視同袍。


  阿邁德的角色也是超級優秀，從他口譯時圓滑的說話方式，還有簡單幾句對話就得知對方的

  意圖和是不是在說謊，就可以知道他實在非常聰明和老江湖。


  整個故事的核心就是聚焦在約翰和阿邁德的關係還有他們對彼此無私付出的那種情義，其實

  這種情節要拍得煽情灑狗血很容易，但是他們沒有，全片他們直到最後都沒有說甚麼煽情的

  台詞，沒有擁抱，連握手都沒有，約翰重返阿富汗經歷千辛萬苦見到阿邁德後講得也只是些

  漫無邊際的閒話，但是其實他們都為了救對方出生入死了XD我還滿喜歡這種內斂隱晦的情感

  表達方式。


  我全片最喜歡的一幕就是在約翰失去了所有小隊員，和阿邁德逃到安全的地方後頹然坐倒在

  地上。約翰除了很理性的一句應該安全了在這邊過夜，沒有說其他的話，但是他的表情動作

  把那種超級隱忍內斂的悲傷充分的傳達出來，然後阿邁德的欲言又止，想說點安慰的話又不

  知該說甚麼的表情，整個無聲勝有聲把情感傳達的超好，兩位主演都演技大爆發阿~


  另外還有一個我很喜歡的小細節，在第一次找炸藥工廠任務時他們之間還是充滿不信任，阿

  邁德揪住內奸按在地上時氣氛劍拔弩張，約翰拔出他的手槍就要對準他。但是在之後他們一

  起逃亡途中阿邁德意外失去他的槍，約翰毫不猶豫就把那把原本要瞄準他的手槍給了他，我

  不知道這是刻意安排還是無意，但是這種前後轉變的呼應超棒的。


  看到滿多演員和導演訪談他們都有強調這兩個角色其實是都沒有很喜歡對方的，瑞奇也有注

  意不想讓他們顯得感情多好(雖然覺得滿沒說服力的，看看他拍阿邁德在把約翰拖回基地那

  無微不至的照顧吼誰會相信)，這部片想呈現的就是他們重情重義的善良和無私─ 喜不喜歡

  對方不是重點，救人是對的事，他們就是會去做，我覺得這樣的人性光輝很動人。



  --'
