url: https://www.ptt.cc/bbs/movie/M.1682302885.A.DBC.html
title: '[好雷] 絕地營救-近年最好軍事片之一'
content: '其實看完我還特別回去確認一次 真的是蓋瑞奇的片

  除了吉倫霍回憶跟配樂之外 這部片其實穩健踏實到很不像蓋的片


  如之前許多版友的分享文 這部進去時不期不待

  看完前1/3卻就已經訝異居然這麼精彩


  小缺點大概就是中間有情有義.最強口譯殺神爬山逃跑

  這段很必要 但久了多少有點彈性疲乏

  還有實在很難置信現實中不過就幾天的雇主

  居然可以讓口譯儼然化身義無反顧常山趙子龍

  拖了整整120公里 也要Uber Heal...冒著生命跟死全家危險就一個美國佬


  但 其他真的很不錯


  雖然有人說劇情不難猜 但如果以四幕劇形式 每幕的轉折

  如果不事先看相關資訊 真的很難猜


  誰能料到出擊後不到半小時 全隊死光光

  然後以為主線就在逃跑 還想說不會就這樣爬山爬到片尾終於回營區吧有點無聊

  結果是一半就完成了~ 後面反過來換前面泰半時間躺著賺的吉倫霍報恩 真正的絕地營救


  每一個大章節 都有很精彩的主線主題


  更精采的還有戰爭場面跟當地的氛圍

  戰鬥真的很精彩 很有臨場緊張感 整個塔利班風聲鶴唳追捕的氛圍

  加上漂亮的當地風景 也真的很有臨場感~ 而且該殺就殺該血腥就血腥該死就死不跟你遮掩


  然後最後一場戲 根本就是美國國防部贊助-美國大兵之絕地營救

  整個緊張絕望一瞬間被釋放 就看塔利班一分鐘內被轟爛


  總之 這部想看大場面戰鬥有 細膩的情感戲有 緊張劇情有 看電影美學也很不錯

  蠻推薦去看的~然後吉倫霍現在能常演這麼Man的角色真的是很厲害呀


  --'
