title: '[雷] 《絕地營救》決定了就出發營救'
content: '首先要分享的是，我要打這篇的片名還要去反覆確認一下這片名叫什麼..


  絕命營救..？驚天營救..？絕地救援？絕命救援？


  (x




  P.S . 驚天營救要出2了，很是期待啊


  ——————



  以下有雷



  ——————



  劇情簡單來說在談一位士官John Kinley，在一次任務失去了他的手下和口譯官後，補上了

  新來的口譯官Ahmed。


  在一次掃蕩任務，John的小隊全隊覆沒，只剩他和口譯官，逃脫過程負傷被俘，Ahmed大殺

  四方後便帶著John踏上一段艱苦漫長的路程，回到美軍基地。


  John回家後驚覺他已經到家了


  等等，那Ahmed呢？


  一番官僚周旋及與合約商簽約合作後，John回到阿富汗帶著Ahmed一家人逃出塔利班的勢力

  範圍。


  *為方便閱讀以下簡稱約翰和阿邁德



  ——————


  細節恕不贅述，很多板友都講得挺好的，來分享一下看完影片的一些感想，拋磚引玉盼大家

  不吝賜教：


  1.敵人或朋友


  在一開始看到口譯官陣亡後，還有一群口譯員迅速補上任君挑選時，腦中不禁會思考：


  是怎樣的想法或需求，讓這群人甘願冒著家人的危險，夾在塔利班與美軍之間？


  隊伍中一名阿富汗軍人因為家庭被塔利班箝制而選擇背棄盟友；阿邁德因為兒子被塔利班殺

  害而堅決站在對立面。


  這一切都是實際發生在中東戰場上的情況：

  派系、宗教、利益和文化衝突，讓盟友和敵人的界線模糊掉了。


  從蘇阿戰爭，到美軍在阿富汗的作戰過程，阿富汗一直給人的感覺就是隨時會被背刺。


  在阿邁德和一群人換取推車和大麻煙時，老者看了一下推車上的阿邁德，說了一句：「我不

  喜歡塔利班，所以我決定幫助你們。」


  我突然有一種「賓果、阿斯、BRAVO！！」的感覺。


  2.盟約，合約


  原文名作《The Covenant》，盟約，我也傾向這可以談到「合約」（contract）。


  美軍是一個很要求「合約」的部隊，日常生活要有合約、聘僱人員要有合約、訓練要有合約

  ，甚至作戰也會有很多很多的合約。


  （今日複雜的戰場環境，甚或不同軍種協同作戰，要使各部門完全契合運轉這個戰爭機器，

  需要很多的‘’contract‘’並且確保他們都有遵守）


  他們就是一種契約精神，什麼都要談白紙黑字。所以我相信約翰一開始對於阿邁德的情感，

  是建立於合約之上（contract）


  這個合約就是：你幫我打仗，我保障你當下的人身安全、以及之後能帶家人的美國生活，脫

  離被秋後算賬的陰霾。


  約翰看口譯員一開始是合作夥伴的關係，甚至片頭口譯員的死完全沒有著墨，也許就按合約

  該給多少撫卹給他家人，就能了事。


  而阿邁德對於約翰，甚或是美軍，則參了些個人的情感在裡頭：他恨透了塔利班。


  所以他發揮自己的才能，套取情報、協助美軍，甚至帶著約翰翻山越嶺。


  也許阿邁德對約翰負傷的照顧，也有昇華自他倆人初始結伴奔走，並合作無間地潛行的那幾

  天。


  但最原始最深層驅動著的，我想是他對家人的愛，轉變成對塔利班的恨意。


  ———「你來和塔利班打仗是因為你們的利益，我是因為我恨他們；你把槍交給我是因為你

  信任我，而我要報償你的這份信任，我並不只是一紙合約。」———


  另一方面，我則在想，約翰對阿邁德的些微轉變，是在隊友轉述阿邁德因家人被塔利班殺害

  而協助美軍時，所表露：「你怎麼沒跟我說！」的當下。


  這是一種從冰冷的合約進展到「人」的層面。


  而阿邁德帶著約翰回家，更讓約翰對阿邁德的情感更加昇華，在返國後一次酒醉時，激情油

  然而生（x


  赫然意識到：


  「上次你帶我回家，而這次該我來帶你回家了！」


  3.沒有老婆的准許，臭男人連家門都別想出去（x


  約翰老婆的一段話讓我印象深刻，大意是這樣：「得知你陣亡後，我們煎熬了一段日子，如

  今你能在這邊和我對話，全家人都欠他一個人情。」


  這句話我覺得是個畫龍點睛的所在，最近剛讀完者亞歷塞維奇（SvetlanaAlexievich）的《

  鋅皮娃娃兵》，家眷收到親人在千里之外陣亡的消息，徬徨感和對未來的不確定、直至接受

  （甚至一輩子都沒辦法真正的接受），心路歷程是非常痛苦而煎熬的。


  這句話背後的情緒讓妻子支持男主角前去救出他的恩人，顯得合理。


  「當我們知道你陣亡時，世界正在崩解分離。有一天，他將你送了回來，彷彿造物主般重新

  給了我和孩子這黯淡世界的一線光芒。」


  當約翰走入他和老婆的工作場所，那一段我觀察著他老婆的神情，很明顯是：「我知道你要

  做什麼，我並不喜歡。」但她沒有說出來，也沒有歇斯底里，反而是在辦公室和約翰表露他

  的支持。


  約翰的反應也很微妙，聽話的過程先是略顯不耐煩，卻突然懵了：「我剛有聽錯嗎？妳竟然

  支持我內心的決定。」


  戰場生還的將士返國後會有種「倖存者內疚」，這在很多海外作戰的國家，是存在於PTSD症

  狀的其中一個心理徵候。


  彷彿原本的世界已經容不下自己，唯一能做的只有回到戰場。


  而對於一位軍人來說，投身戰場是義無反顧且可以隨時起身，但最大的猶豫與疙瘩是他的家

  人。


  「你不是休假嗎為什麼今天又要回部隊去了！」


  我懂，我真的懂你，約翰 （x


  4.最後的結尾，當約翰一行人子彈打完、毒梟委派的司機一陣壓槍掃射後負傷，那一幕的慢

  動作與畫面..


  讓我想到湯姆連長用45手槍打爆坦克車的那幕






  劇末的空中支援實在讓人振奮啊啊啊吼吼吼


  AC130上大大的AIR FORCE讓我笑出來

  這一次空軍又得一分







  ——————



  總的來說，這部片節奏鮮明，細究雖會覺得流水，但瑕不掩瑜。看完心情會蠻好的。


  其中很多人物的情感、和個人心態細節呈現是很棒的。


  但它背後談的話題卻也很深沈。


  今天電影裡是一紙合約的兌現、兩邦盟約的展露，但在現實生活中：


  美軍撤離阿富汗，又有多少紙合約被拋諸腦後？


  多少個約翰酒後痛哭著吐露出心中最大的遺憾


  又多少位阿邁德和他們的家人，命喪塔利班秋後整肅的槍下


  跑字幕時的一張張照片過目，合約商、口譯員、美軍，他們的情感又怎麼是「contract」所

  能一字帶過的呢？


  遑論這一張張合約履行了，還是埋沒在歷史的洪流之中。




  ** 亞歷塞維奇（SvetlanaAlexievich）的《鋅皮娃娃兵》談的是蘇聯在阿富汗戰爭中，所

  經歷的一切小事。


  讓我感觸的，是書中許多角度從女性出發：愛人、妻子、母親。


  大部分的故事是從戰場生還的官兵們，有些身上帶著殘疾、有些幸運地毫髮無傷，但每位經

  歷過戰場的軍人，心都是殘缺不全的。


  **這部電影，實不相瞞我自己的第一感受，是在一片浪漫圓滿的結局下，對阿富汗戰局及「

  盟約」的一種口誅筆伐，或說是一齣輓歌。


  **最後一幕飛機上，約翰和阿邁德的相視、點頭、含情脈脈，我突然有種..母湯的感覺


  （我似乎下載到了錯誤的黑豹.jpg）


  ….達美！


  **看到有篇文在討論什麼標題更適合這部電影，整串笑歪，而我願投《搶救口譯大兵》一票

  。


  --'
