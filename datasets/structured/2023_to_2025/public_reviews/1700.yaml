url: https://www.ptt.cc/bbs/movie/M.1682434462.A.BA9.html
title: '[好雷] 絕地營救-片中有小彩蛋 '
content: "絕地營救片名應該是要致敬絕地任務\n主軸很明顯\n但是也有很多大家不知道的彩蛋\n以下有雷!!\n\n\n\n\n\n\n\n\n\n雷文防雷資訊頁\n\
