url: https://www.ptt.cc/bbs/movie/M.1682478563.A.1F0.html
title: '[好雷] 絕地營救 There Is A Hook In Me'
content: "雷文防雷資訊頁\n\n\n1.風景很漂亮\n\n2.配樂很到位\n\n3.動作片段很精實,不會有那種打了五分鐘都沒死人的大場面,\n  在戰場上更多時候是不知道危機在哪,下一秒莫名奇妙的就死了\n\
  \n4.兩個男主角的演技超好,對我而這,這是一個帶有軍事片段的劇情片,\n  你很難再找到有現代軍事片段的電影有這麼深沉而內斂的情感表達了\n\n5.Jake\
  \ Gyllenhaal 我之前從沒注意過他漂亮的 Blue Eyes,\n  Guy Ritchie 完美的呈現了它\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n我很喜歡\
  \ Jake Gyllenhaal ,演技好,也很會選片,衝著他主演我就進電影院了\n\n一開始我還以為是軍事大片,但隨著劇情的推展,我才意識到這是劇情大片\n\
  \n軍事只是為了讓你能理解人生的無奈,生存的艱辛,承諾的重要\n\n\n這部電影讓我印象最深刻的一幕不是在戰場上,\n\n而是在美國的軍事基地的一個小房間裡\n\
  \nJake Gyllenhaal那1分鐘的表演完全把你拖進深淵\n\n這是那一段深淵的片段,還沒看過正片的人小心使用\n\n\n\nJake Gyllenhaal\
  \ 的演技又上了一個層次\n\n這一段的演出,沒有撕心裂肺的怒吼,沒有過度悲憤的用力\n\n他就是一個心已經死掉的死人,眼神充滿哀傷與無力\n\n淡淡的講出最沉重的語言\
  \ There Is A Hook In Me\n\n深沉又內斂的一場戲\n\n完全會讓你覺得他就是在戰場上 PTSD(創傷後壓力症候群) 一個月都睡不著的那個士官長\n\
  \n你完全可以為了這一場戲付錢進戲院去感受這種頂尖層次的演出\n\n因為你很大的概率在有生之年看不到軍事片堆疊出來的情感由一個好演員以這種方式呈覝\n\n它的後勁很強,那是一個活著下過地獄的人在深層的深淵裡茫然無助的喃喃自語\n\
  \n\n\n另一個令人動容的一段戲\n\n是翻譯在士官場受傷後,不顧一切的把他帶回100公里外的美軍基地\n\n在列日下,推著木車爬山時,被卡住過不去,在路邊悲痛的哭吼著\n\
  \n滿是荒煙漫草的山地,不知道何時會出現的塔利班,再也拖不動的美軍傷患\n\n成年男人的崩潰,有時候來得很快,就在那一瞬間\n\n因為真的絕望了\n\n\n\n\
  英文片名 The Covenant\n\n翻譯在絕望時依然撐了下去,他隨時可以選擇逃走,沒人會怪他,也沒人會知道\n\n他也沒有義務要冒生命危險救士官長\n\n\
  就像士官長回美國後可以選擇安全的生活,不回阿富汗去找翻譯,沒人會怪他\n\n他也沒有義務要冒生命危險救翻譯\n\n甚至,這兩個為了對方干冒生命危機的人,彼此間連個口頭約定都沒有\n\
  \n正片中一次也沒有提到 The Covenant 這樣子的承諾\n\n但是他們都選擇了良善的選擇,並為了做對的事永不放棄\n\n用付出生命的風險代價,為了一個任務上萍水相逢的外國人而實現從未說出口的承諾\n\
  \n生命的重量,盟約的重量,善良的重量,都在最後一幕的相視之下,有了好的結局\n\n\n--"
