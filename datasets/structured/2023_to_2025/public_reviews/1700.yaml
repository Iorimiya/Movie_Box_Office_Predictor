url: https://www.ptt.cc/bbs/movie/M.1682226913.A.465.html
title: '[好雷]大推絕地營救 之男人的義氣 '
content: '很少寫心得文，如果排版傷眼或內容不夠有深度請見諒。

  因為覺得很好看，不忍心票房太差，所以忍不住跑來推薦了。


  劇情不刻意說明了，預告也讓人一目了然知道劇情會怎麼演。

  出色的是過程，兩名主要演員演的很好，雙方演技都在線之外，兩人的互動很有火花。

  除了主角，沒有扯後腿的配角，軍隊隊員只有幾個鏡頭跟幾句對白，也不會讓人覺得是雜

  魚。那些中東演員們也是演的就像是真實的塔利班或居民。


  講到導演蓋瑞奇，馬上聯想到嘴賤連珠砲的英國紳士黑幫，

  好喜歡他的兩根槍管跟偷拐強騙。

  看這部之前忍不住胡思亂想這部電影會怎樣「蓋瑞奇」呢？

  結果就是想太多了，

  事實上看預告就知道這是一部很典型的戰爭片，但是沒想到這麼好看！

  我本身是不愛看戰爭片的，但這部好看到我會想去二刷。






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  以下是個人喜歡的點：

  1.槍戰很真實，但不至於讓人覺得殘忍。

  好啦有一點覺得不真實，阿邁德的槍法也太準了吧，雖然以前有販賣海洛英的背景，但感

  覺比美軍還準啊。

  2.景色壯闊，攝影角度以及剪接讓人看得很舒服。

  3.在幾場大型槍戰中，搭配的是很溫柔的配樂，可能我戰爭片看的少，覺得挺稀奇的。

  音樂本身我沒有感覺特動聽，但是畫面跟音樂搭的不錯，而且配樂聽似溫柔，但不減劇情

  當下的緊張。

  4.劇情動人心弦，主角兩人在躲避塔利班追擊時，讓人都跟著緊張不已（雖然明明知道一

  定會成功逃脫喔）。

  阿邁德在扛約翰的過程中，讓人都感受到他的無力、疲倦，好幾次他遇到困難或停頓，都

  好怕他會放棄（雖然明明知道他一定會堅持到底）。


  好愛傑克葛倫霍，他的氣質他的演技以及他漂亮的藍色眼睛（劇情中阿邁德的兄弟阿里特

  地提到這點），傑克葛倫霍的表情讓我以為他害羞了一下（誤）。但看他演歇斯底里演的

  有點膩啊（雖然每部電影的歇斯底里都有層次的不同），想看看他接其他類型的戲，許願

  好久不見的浪漫喜劇。


  飾演口譯員阿邁德的達爾薩利我沒看過他其他作品，覺得他演的很好耶，感覺這個人是活

  生生的有血有肉。

  約翰回去找到他的時候，說：「狗叫聲也太多了。」那幕，他看似面無表情，但情緒好滿

  好滿。


  片長兩個小時多一點，全程都好看讓人不覺時間的流逝，

  因為劇名是「絕地營救」，我以為劇情重點會在後半段營救，等約翰飛回阿富汗時，我偷

  看一下時間，怎麼只剩半小時？

  後來看到英文片名The Covenant，才了解自己是看到中文片名自以為營救是重點。


  最後半小時營救的過程中，節奏很快，

  最後脫困的方法是靠美軍軍機掃射，老實說當下有點失望：「啊？原來這樣喔。」

  但想想如果不這樣，好像也不知道怎麼演了，更何況這是真實故事改編，如果搞的像玩命

  關頭那樣扯我才會昏倒。


  最後小抱怨，這片名很容易讓人搞混，跟朋友推薦這片，朋友一直搞錯以為是麥特·戴蒙

  在火星的那部絕地救援。





  --'
