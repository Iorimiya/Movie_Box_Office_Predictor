title: '[討論] 絕地營救是不是沒有發行原聲帶？'
content: '今天剛去看絕地營救


  對於配樂的印象挺深刻


  尤其是第一場大型戰鬥收尾的時候


  不論是旋律或是錄混音都覺得很讚


  但走出電影院一查


  看起來完全沒有官方串流


  而且不要說串流


  好像連CD都沒有


  不知道這部是不是真的沒發行OST？


  沒發的話真的挺可惜的





  --

  水星の魔女絶賛放送中



  --



  喔喔 想說歐美電影OST好像都是同步發行的


  會發就安心了 讚讚讚'
