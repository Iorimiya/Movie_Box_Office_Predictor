url: https://www.ptt.cc/bbs/movie/M.1682150173.A.02E.html
title: '[好雷] 絕地營救的一切怎麼可以那麼傳神'
content: '以下討論會有雷 請斟酌

































  以往在電影中雖然中東人都有既定形象

  打扮也差不多那樣

  可是絕地營救的當地人和反派塔利班真的有嚇到我

  那是一種超越化妝的感覺

  簡直就像真正的居民和恐怖分子在演戲

  那種肢體表現和文化感到底怎麼做到的 @@

  尤其口譯大叔感覺更是切換自然

  完全有演出遊走在西方和中東世界之間的生存感

  而且當兩人翻閱山嶺時

  那個自然景觀和日夜切換的時間流逝感更是一絕

  還有最後美軍運輸機艙內透出的冷硬感

  這一切到底怎麼做到的？

  絕地營救也太神了吧



  --

  配樂很厲害 會故意停下來 XD 讓我好緊張可惡

  確實 我也有看蟻人最新一集的說

  我完全看不出來 XDD

  What

  超緊湊完全沒有可以料料的空檔'
