url: https://www.ptt.cc/bbs/movie/M.1709375163.A.9BF.html
title: '[情報] 《絕地營救》卡司宣傳之趣味猜猜樂'
content: "(本文有30%電影雷，但不影響觀影)\n\n\n標題是暫時取的，板友有想到更適合的標題可以提出來喔。\n\n這是之前《絕地營救》（GUY RITCHIE’S\
  \ THE COVENANT）兩位男主角\n\n上節目宣傳行程中我覺得最好笑的，因為平常沒在特別追演員宣傳，\n\n除非是很好看的電影才會吸引我追下去，\n\n\
  兩位就是在互相調情，連Salim脫個衣服Jake也可以在一旁興奮鼓譟，\n\n難怪片中如此基情好好笑。\n\n\n今天Dar Salim才確定演出也同樣是戰爭懸疑題材的《終極名單》前傳。\n\
  \n\nTHE COVENANT | Interpret This with Jake Gyllenhaal and Dar Salim\n\n\n兩位的畫技非常不好但很好笑XDDDD\
  \  總之好哥兒們看得出來在畫什麼就夠了XDD\n\n裡面有說蓋瑞奇喜歡有自己的帳篷，還會邀大家陪他喝飲料。\n\n\n兩人也承認就是Bromance XDDD\
  \ 兩位主演剃掉大鬍子加上打光整個減齡一輪。\n\n\n\n\n中文預告，板上很多好評就不重複佔版面了，總之是爆米花度很足的一部電影。\n\n\n\n正經一點的訪談\
  \ \n--\n\n幻想●---------------☆\n/﹀\n/\\ \n\n按a加入最愛\n\n--"
