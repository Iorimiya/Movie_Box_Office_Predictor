title: '[好雷] 《若愛重來》，二次機會該給愛情，還是留'
content: '部落格版：


  2016年上映的義大利電影《完美陌生人》直至今日仍是我心目中最佳電影之一，導演保羅

  傑諾維西之後的《願望咖啡館》雖然還好，但在下一部的《真愛超能力》我就很喜歡。後

  來發現《真愛超能力》編劇之一保羅克斯泰拉也是《完美陌生人》其中一位編劇，而另一

  部義大利電影《當我們困在一起》劇本也是出自他手，結果到頭來才發現原來我喜歡的是

  保羅克斯泰拉？不過當然劇本再好，如果沒有好的執行力也沒用，於是或許可以說是「導

  演保羅傑諾維西加上編劇保羅克斯泰拉」這個組合才是我最喜歡的。由於兩人合作的成品

  都很令人滿意，所以滿期待兩人下部作品《Il primo giorno della mia vita》，希望會

  有台灣片商願意引進這部。而在此之前，同樣身為導演的保羅克斯泰拉則先帶來了執導新

  作《若愛重來》，有趣的是保羅傑諾維西也是他的共同編劇之一，和《真愛超能力》在義

  大利僅差一個月上映，真的只能說這兩位絕對是我現在最欣賞的義大利組合。


  從《完美陌生人》到《當我們困在一起》接著再看《若愛重來》，不難發現導演保羅克斯

  泰拉十分擅長描寫多線敘事，過去有太多實例是當登場角色或者是發展的故事線太多，問

  題自然也就跟著變多，然而在他的筆下一切是井然有序，這些故事線就像是根據其所想講

  的議題而延伸的各種情境假設，讓觀眾在各個角色的故事裡走過一遍之後，最後都能跟著

  結果來進行反思，特別是在這次的《若愛重來》更為明顯，八個角色三條故事線都圍繞著

  「若愛能夠重來，你或妳會如何選擇？」的提問轉，但每條故事線、甚至八個人都有不同

  的結局和選擇，不以絕對的結果強迫觀眾接受他的想法與論點，而是藉由充滿各種可能的

  開放式結局來給予你我和角色面對同個問題的思考空間，同時也順勢增加了觀眾的議題參

  與感。



  如果有各種原因會讓人選擇走入婚姻，那也就會有各種理由讓人想要結束關係，有可能是

  因為愛到最後不愛了，例如薩拉與維多；或是愛上了別人，例如愛德；也有可能是婚後才

  意識到這原來並不是自己想過的生活，例如寶拉；更有可能的是早在剛開始就是不得已才

  結婚，只是不論如何我想，每個經歷過婚姻或是正處在婚姻裡的人都需要可以重來的機會

  、一個可以看清自己真正想要的是什麼的機會。對我而言，《若愛重來》就像是「若愛重

  來」這四字假設的影像化展現，導演保羅克斯泰拉以「冒牌牧師證婚的婚姻全部無效」這

  個看似荒謬卻意外很有說服力的設定來讓「若愛重來」機會成真。


  「我們幹嘛還要再結婚呢？」


  在「如果愛能重來」這個假設後的，是對自己的提問，「為什麼要結婚？」、「為什麼要

  再結婚？」又「為了什麼而結婚？」，是因為真的愛嗎？還是只是習慣了有對方的陪伴？

  雖然在這些故事線裡，導演保羅克斯泰拉利用各種現實問題，從要不要生孩子、事業和家

  庭的取捨到另一半偷吃是要原諒還是放手...，來打擊並考驗著這幾對夫妻，可是最後能

  夠給出答案的，終究還是只有自己。因此在我這裡看來，《若愛重來》更像是屬於「個人

  」的故事，如同在電影中寶拉的婆婆告訴她的那番話，沒有人能夠勉強她要生孩子，就算

  丈夫安德利亞無法諒解她的決定，導致兩人最終無法再次成為夫妻又何妨？婚姻不該是委

  屈妥協，應是討論後的共識，要是有一方無法接受，那就乾脆還給彼此自由，不也是某種

  圓滿的結局？若愛重來不是要我們只愛自己，而是鼓勵自己勇敢去正視自己的內心，要人

  看清也要人想清，然後再在決定第二次機會該給愛情，還是留給自己。



  很喜歡電影的最後，放上了這四對夫妻當年結婚的紀錄影像，用已成過去的美好來回望現

  在兩人的狀況，有些諷刺也有些苦澀，曾經許下的誓言就像那位替他們證婚的牧師，怎麼

  都是假的。至於這些影像會是這四對夫妻後來的再次牽手或是終成追憶，導演保羅克斯泰

  拉沒有給出肯定的答案，他留了空間好讓觀眾在電影之後繼續對他們的想像，雖然片尾放

  了美秀集團輕快爽朗的《戀人》，但看著這些影像再想著後來可能的發展，我更直接想起

  黃小琥的《重來》，歌詞寫道「如果能重來，誠實的去對待，彼此都沒疑猜，就沒有理由

  分開；如果能重來，回憶當作塵埃，心不曾被傷害，就能無瑕疵地愛。但是重來卻不能保

  證愛的成功或失敗，要重來多少次後才會明白？」，《重來》的歌詞更為貼近電影，也許

  在看完《若愛重來》之後可以聽這首歌，會比《戀人》來得更有畫面感。


  --'
