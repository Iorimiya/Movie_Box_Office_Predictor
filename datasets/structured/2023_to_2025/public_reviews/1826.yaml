title: 'Re: [新聞] 梁朝偉以影會友 挺《悲情城市》低調來台'
content: "沒想到當代綜藝天王\n唐綺陽跟邰智源有演悲情城市！\n他們還23歲同年，真是經過大風大浪\n照片轉載自牽猴子電影公司臉書\n\n\n\n\n\n\
  \n梁朝偉以影會友 挺《悲情城市》低調來台\n\n2023/02/14 05:30\n\n\n梁朝偉演出的《悲情城市》33週年4K全新數位版即將登上大銀幕。（牽猴子提供）\n\
  \n〔記者廖俐惠／台北報導〕香港巨星梁朝偉暌違10年來台，據悉是為了宣傳電影《悲情城\n市》33週年4K全新數位版，將出席今天的首映會，並與老友敘舊。梁朝偉上次在台灣公開\n\
  亮相已經是2013年的第50屆金馬獎，此次來台片商低調證實，梁朝偉確實因個人行程來台\n。\n\n\n梁朝偉（右）在《悲情城市》中一句「我是台灣人」逼哭許多觀眾。\
  \ （牽猴子提供）\n\n《悲情城市》編劇吳念真是梁朝偉多年好友，昨天在電影《本日公休》記者會上透露，前\n幾天有收到與梁朝偉聚會的邀請，不過自己因為有事無法出席，被問到會送什麼伴手禮給\n\
  梁朝偉？吳念真笑說：「都幾歲了還伴手禮。」同片演員高捷也發文：「期待和老友相聚\n吃飯。」\n\n\n26歲的梁朝偉（右）與23歲的辛樹芬，在《悲情城市》電影中紮紮實實跪拜到九叩首。\n\
  （牽猴子提供）\n\n60歲的梁朝偉出道近40年，曾憑藉著電影《花樣年華》獲得第53屆坎城影帝的殊榮，也多\n次奪下台灣金馬獎、香港金像獎最佳男主角，在影壇有著舉足輕重的地位。近年梁朝偉進\n\
  軍國際，演出漫威電影《尚氣與十環傳奇》獲得關注，今年還接連推出《無名》、《風再\n起時》兩部電影，前者與中國男星王一博合作，後者則是好友郭富城攜手。\n\n梁朝偉最近進軍抖音平台，推出出道40週年特別節目分享人生觀，「有人說看一座山最好\n\
  的角度是從山頂，但對我來說，登山的意義不在於征服，就要享受過程。好好地走好每一\n步，像演戲一樣，不管角色是什麼、戲份有多少，哪怕只有1秒鐘，我會踏實地把它做好\n\
  。」梁朝偉自認入行40年還只是在半山腰，要繼續往山頂出發。\n\n--\n佛教經典的\n是是菩薩成佛之道\n        是 佛經\n  是 佛      是\
  \ 菩薩\n\n\n--\n\n--"
