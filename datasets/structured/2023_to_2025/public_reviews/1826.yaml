title: '[新聞] 《悲情城市》闊別33年！重返香港大銀幕　'
content: '《悲情城市》闊別33年！重返香港大銀幕　「千人座席」影廳上映秒殺


  ETTODAY


  2023年04月01日 21:51


  記者蕭采薇／綜合報導


  全新4K數位版《悲情城市》2月底全台上映，引起話題熱議、票房口碑持續不墜後，該片

  也將闊別33年後，再度重返香港影院大銀幕，由於故事內容敏感，消息一出，早已備受香

  港影迷關注期待，開賣當天即成為本屆影展最熱門的秒殺售罄電影。




  ▲《悲情城市》闊別33年後再度重返香港影院大銀幕。（圖／牽猴子提供）


  第47屆香港電影節安排放映兩場《悲情城市》，闊別香港33年後的首場公映，更會擁有千

  人座席的香港文化中心大劇院映演。這也是全新4K數位版《悲情城市》繼台灣上映後，首

  次在海外亮相。


  電影出品人邱復生日前表示，為尊重電影於戲院映演質感和時代情懷，未來三年內《悲情

  城市》不會上串流平台，只在戲院大銀幕放映，使得這兩場電影節映演，更受矚目。片商

  感謝在清明連假仍持續排片映演戲院的大力支持，並呼籲影迷把握在戲院大銀幕觀影機會

  。




