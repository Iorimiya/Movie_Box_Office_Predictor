url: https://www.ptt.cc/bbs/movie/M.1680183943.A.61A.html
title: '[新聞] 中山73推雙影展 《再見列寧》、《悲情城市》喜悲登場'
content: "中山73推雙影展 《再見列寧》、《悲情城市》喜悲登場\n\n16:37 2023/03/30 中時 李承陽\n\n\n梁朝偉因為演出《悲情城市》開創日後不凡的演藝成就。（海鵬影業提供）\n\
  \n\n《再見列寧》當年上映時，創下許多傲人的電影紀錄。（海鵬影業提供）\n\n作為中部唯一藝術電影院放映空間，台中中山73四月份焦點主題，將推出「再見悲情」影\n\
  展，結合《再見列寧》與《悲情城市》兩部數位修復電影，反映出大時代關鍵時刻下、人\n民的悲喜與命運。\n\n「再見悲情」影展將兩部獲獎無數、在歷史及影史都堪稱地位非凡的數位修復片《悲情城\n\
  市》與《再見列寧》結合放映。兩位影帝梁朝偉及丹尼爾布爾，也因為演出這兩部電影而\n開創日後不凡的演藝成就，前者甫獲威尼斯影展終身成就獎，為華人演員第一人；後者更\n\
  受封歐洲電影獎等3座影帝大。\n\n四月份的另一個焦點主題則為新鮮逗趣的「法國喜劇展」，一口氣囊括總票房超過25億台\n幣的《三小一家人》、《金金計較》、《退休大贏家》和《出發吧！我的脫單假期》等4\n\
  部票房冠軍喜劇，獻給觀眾別開生面的浪漫春天。\n\n法國被封為浪漫之都，票房奇蹟卻常是喜劇電影，「法國喜劇展」囊括總票房超過25億台\n幣的《三小一家人》、《金金計較》、《退休大贏家》和《出發吧！我的脫單假期》等4\n\
  部票房冠軍喜劇，前兩部就由法國當前最紅喜劇巨星丹尼伯恩所主演，他曾以賣座喜劇《\n歡迎來到北方》在法國創下1800萬人次，票房僅次於《鐵達尼號》、列居影史第二，並以\n\
  片酬2600萬歐元（約台幣12億7千萬），位居歐洲影壇最「高貴」男星。\n\n#喜劇 #再見 #法國 #影展 #列寧\n\n--\n佛教經典的\n是 是菩薩成佛之道\n\
  \        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
