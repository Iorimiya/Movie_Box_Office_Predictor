title: '[討論] 悲情城市的紅猴'
content: '最近重溫悲情城市，裡面有個叫紅猴的角色


  他將阿嘉帶到外面，拿張日幣，說只要蓋印章，就可以拿去買東西


  之後紅猴在晚上突然被特務抓走，隔天被發現被殺


  為什麼紅猴會被殺呢?


  文良發現那女配角，為什麼會向他要錢?甚至最後得罪上海人被告密是漢奸


  當初在那時代，應該有人私濫印鈔票導致通貨膨脹!


  另外，文雄發現文良私運什麼(米糖嗎?)，大罵阿嘉這事爆開很多人會死?


  我一開始以為是毒品?  但跟劇情連不太上來。


  --

  And I do not have to apologize for being a Taiwanese


  我不需要因為身為台灣人而向任何人道歉


  --'
