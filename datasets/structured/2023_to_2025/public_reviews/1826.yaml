content: '島國拾影 昨天有貼一篇


  舞獅放鞭炮還有幹架的那個廣場


  說是在仙洞巖





  仙洞巖位於基隆港西北岸的山崖下，這座海蝕洞穴從清同治年間就有築佛寺，日治時期即

  名列基隆八景之一，百年來一向是著名觀光名勝。緊鄰仙洞巖的仙洞聚落為一仰賴捕魚為

  主的村莊，依山而建的氛圍，有點像迷你版九份。如今聚落附近已成為貨櫃港埠，與這座

  古老漁村形成鮮明對比。


  --'
