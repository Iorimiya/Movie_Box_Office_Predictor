url: https://www.ptt.cc/bbs/movie/M.1677596124.A.C6A.html
title: '[請益] 悲情城市 片中幾點疑問 (有雷)'
content: "我原本不太習慣悲情城市的長鏡頭敘事方式\n但是看完整部片之後 發現片中好多畫面會縈繞心頭\n再搭配wiki上的劇情簡介跟版上幾篇網友的分享\n\
  慢慢發現這部片的後勁很強\n值得細細回味\n\n但還是有幾幕我實在想不通導演想要呈現/表達什麼：\n\n1.舞龍舞獅：那麼久是要幹嘛?\n\n2.林文雄半夜睡不著起來泡茶，說他小時候跟爸爸一起出門綁被在電線桿上的故事\n\
  \n3.林文雄賭博，鏡頭拍他的表情拍好久，而且整部片為什麼那麼多賭博的鏡頭？\n  是否在對比上海人賭博的悠哉跟苦命台灣人賭博是在紓壓?\n\n4.前半段有一幕在帷幕裡一男一女，男的似乎想上但被女生推開，最後被蓋布袋帶走。\n\
  這段前因後果是啥？我一頭霧水。\n\n有請達人解惑，先謝謝了！\n\n--\n喔喔 原來如此\n了解 怎麼看得出是紅猴 也太厲害 不過很合理\n我也忘了是在哪一段之後\
  \ 印象中是 中間...\n感謝眾達人回覆。剛開始被人物搞得太亂，再看一次應該會很有幫助\n恩恩 有感覺到上海人賭博時的嘴臉 實在太會演"
