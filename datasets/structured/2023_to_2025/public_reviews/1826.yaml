url: https://www.ptt.cc/bbs/movie/M.1678090163.A.778.html
title: '[新聞] 《悲情城市》3年不上串流！陳松勇狂飆三'
content: '新聞網址：


  《悲情城市》3年不上串流！陳松勇狂飆三字經 受封「台灣訐譙最霸氣的男人」

  〔記者廖俐惠／綜合報導〕


  33年前經典國片《悲情城市》以全新4K數位版重返大銀幕，在上映九天後，於上週六全台

  票房破千萬，甚至海外方面，。。


  4K數位版《悲情城市》上映後，引起影迷紛紛在社群媒體貼文迴響，特別是以本片榮獲金

  馬影帝的「勇哥」陳松勇，已成絕響的真性情演出令人無限懷念，片中他正港又直白的台

  語，更是深獲共鳴，尤其一句「咱本島人最可憐，一下日本人、一下中國人，眾人吃、眾

  人騎，沒人疼！」的經典台詞，已成社群發文中，最被引述的金句。


  陳松勇生前曾被封為「全台灣罵三字經最霸氣的男人」，影迷這次在《悲情城市》中，終

  於可以領教「勇哥」句句淋暢快漓盡的「問候語」。從電影開場兩分多鐘他罵了一句：「

  Ｘ！電現在才來！」演到2小時14分鐘後他中彈倒地，前後保守估計共說了30多句台味十

  足的「問候語」，草莽霸氣的豪邁口氣，讓影迷嘆服不已。


  片中飾演陳松勇大老婆的金馬影后陳淑芳，更特別推薦大家來「看陳松勇學正港台灣話」

  。陳淑芳笑說：「阿勇真是個奇葩！他的『口頭禪』很多，有三字、五字、七字，但句句

  都是有所本，他小時唸過一年漢文私塾，當年還出書教人如何講台灣俚語。」


  陳淑芳邀請觀眾再次進戲院，回味陳松勇最有氣口、最正港的台灣話。她透露：「阿勇沒

  學過演戲，也沒有很高學歷，但不只寫了一手好字，也懂很多台語典故，聽不懂的人可能

  覺得他是在罵人，但其實那都是台灣話，也是他的口頭禪。」陳松勇曾出過「陳松勇訐譙

  」、「陳松勇新訐譙」，兩本書，教人品味台灣俚語之美，書中還強調「訐譙」（音kà

  n-kiāu）一詞意指大聲罵人，未必是髒話。


  合作過多次的兩人，在《悲情城市》中演夫妻可說是得心應手，一來一往全靠默契，陳淑

  芳回憶說：「我們的台詞沒照著劇本走，都是即興發揮。」她也分享當時拍戲空檔，陳松

  勇會一手拿菜籃，一手牽著她的手去菜市場買菜，然後很自然地跟攤販說：「這是阮水某

  啦！」讓她又好氣又好笑。「外表看似粗魯，但粗中帶細，兇狠之中也有溫柔的一面，這

  就是阿勇…。」陳淑芳擦著眼角的淚水笑說。


  《悲情城市》 4K數位調光版本，全台熱映中。


  ------


  滿能理解邱復生的想法

  畢竟這部過往在網路有太多非正式管道的舊版本

  如果新版本一上串流又會馬上在網路盜版流傳


  這次能讓國家影視聽中心進行數位調光

  好像也是跟邱復生溝通很久才拿到原始底片


