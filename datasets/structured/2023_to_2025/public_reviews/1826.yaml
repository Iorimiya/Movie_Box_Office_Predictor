title: '[新聞] 梁朝偉憶《悲情城市》 拍藝術片的起點'
content: "梁朝偉憶《悲情城市》 拍藝術片的起點\n\n04:10 2023/10/27 中國時報 孫伊萱\n\n\n梁朝偉26日出席東京影展舉辦的大師講座，開心與日本影迷打招呼。\n\
  （摘自影展官方推特）\n\n名導侯孝賢因罹患失智症宣布退休，曾參演他代表作《悲情城市》的影帝梁朝偉，26日出\n席在東京影展舉辦的大師講座時，開心分享當年拍攝的點點滴滴，他直呼：「這可說是我\n\
  工作正式開始的地方，第一次親身看到藝術片是如何拍攝的。」\n\n提及侯孝賢，梁朝偉分享因為自己不會說閩南語，所以侯導就把他的角色設定為聾啞人士\n，「侯導當時要做的事太多了，所以他沒有空理我，都是讓我自己發揮，所以一開始我真\n\
  的很迷惘，我盡可能讓自己在孤獨的環境下生活，躲在飯店裡閱讀」並稱，因為對台灣歷\n史不熟悉，「侯導就給了我非常多書，也讓我因此愛上文學，對文學和藝術領域變得比以\n\
  前有更深入的認識。」\n\n活動上，梁朝偉還提起老搭檔王家衛，坦言當年是在很迷失、覺得在表演上無法進步時遇\n到了對方，2人第一部合作的電影是《阿飛正傳》，「當時是和張曼玉合作，她很多時候\n\
  演2、3遍就過了，我要拍10幾遍，甚至最多26遍」，讓他相當挫敗。\n\n不過王家衛暖心告訴他，不需要太多演技，「他想把我的演技都拆下來，讓我由心出發去\n發揮角色，我發現這個導演很會調教演員，把演員的優點發揮出來，我想跟他合作，於是\n\
  一合作就是20年」，但不忘調侃「我覺得王家衛有劇本，只是不給我們看」。\n\n#王家衛 #藝術片 #演技 #梁朝偉 #悲情城市\n\n--\n佛教經典的\n是\
  \ 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
