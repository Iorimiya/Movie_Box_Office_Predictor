title: '[討論] 哪些電影院會上映4K的悲情城市？'
content: '這次重新上映的「悲情城市」


  片商打廣告說是4K數位版。


  但目前所知，台灣有4K影廳的商業電影院比例仍然不多，


  即使有也可能只有其中一廳，


  就連台北市也可能不是全部都有，


  只有台北松仁威秀是說全部影廳都是4K放映機。


  如果一間電影院只有一廳是4K放映機，


  通常比較高的機會是上映最有機會熱賣的，


  例如漫威電影。


  雖然這次蟻人3好像沒說是不是4K，


  不過4K放映機應該還是可以向下支援。


  究竟哪些電影院真的有辦法上映4K的悲情城市？



  --'
