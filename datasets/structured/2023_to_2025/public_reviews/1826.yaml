title: 'Re: [討論] 悲情城市中高捷飾演的文良一角（雷）'
content: '侯導應該是用二哥 三哥

  來帶出台灣當時很重要的一個存在的狀況


  台籍日本兵




  二哥代表了一去不回的戰死台灣人


  而三哥文良代表了倖存回台的台灣人


  而回得來的就算身體無傷的 心裡也受極大創傷


  從在醫院連老婆都要直接勒斃的反應


  應該就是還在戰鬥狀態 走不出來


  然後就算康復了


  還會被人當漢奸 因為戰時幫了很多日本人


  只用一個二哥 說了台籍日本兵 只能帶出戰死的悲


  多一個活著回來的三哥


  可以講述更多台籍日本兵的狀況






  --'
