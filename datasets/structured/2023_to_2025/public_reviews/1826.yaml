url: https://www.ptt.cc/bbs/movie/M.1677593761.A.E84.html
title: '[好雷] 末代皇帝與悲情城市'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這個月看了兩場老電影 末代皇帝與悲情城市


  末代皇帝 是因為胥渡吧清朝帝王群聊的溥儀實在太醒目所以才動念來看


  電影一開始，是神似東方三俠老太監的慈禧，在最後一口氣前，傳位給還依靠乳母的小小

  溥儀，然後坐位死亡，一旁的太監馬上在老佛爺的嘴裡塞入大黑玉珠，溥儀也成了新的皇

  帝。


  但是溥儀還沒來的及真的掌控局面，大清就亡了，實際上他到成年前，都只是在紫禁城這

  座大鳥籠子內的鳥，有皇帝之名，無皇帝之實，令不出宮門，甚至連保住乳母都辦不到。


  電影裡沒有演張勳復辟，就直接跳到英國老師莊士敦來紫禁城教學，開啟溥儀眼界，也讓

  他戴上眼鏡，治療近視，開啟溥儀眼界，也成為亦師亦友的存在。


  在這段時期，溥儀也娶妻婉容與文繡，其中婉容也是有類似莊士敦的老師，因此與溥儀有

  辦法聊天，顯然也更為親暱，文繡則只是陪侍的感覺，因此當溥儀被馮玉祥逐出紫禁城時

  ，在租界靠著祖蔭過活的二皇后，在一夫一妻制的環境加上被溥儀冷落，終於也是離婚逃

  離。


  溥儀為此遷怒婉容，結果被冷落的婉容反而被一飛行員裝女性誘導吸鴉片，後來查發現他

  是川島芳子。川島背後顯然有日本勢力存在，而後溥儀也果然受邀到東北復辟，而不是接

  受莊士敦建議到英國接受庇護，不出婉容的意料，溥儀成為了日軍侵略的傀儡，婉容也在

  失去溥儀關注時與車伕私通產子，被日軍弄死孩子，憤而離開。


  但日軍大東亞共榮圈的目標終究是失敗了，溥儀等到婉容的人，但已失去她的心，想向美

  國人投降，最終還是落入蘇聯人的手裡，後來成為中共的戰俘，在撫順戰犯管理所接受改

  造。


  被改造完成的溥儀，成為一般的北京市民，走在街頭，卻發現在戰犯管理所對他改造的老

  師，卻成為被紅衛兵批鬥的對象，在街上被遊街示眾，紅衛兵的出場，明示著中國的苦難

  尚未止息，中國帝制仍有餘韻。


  最後溥儀買票進入紫禁城，在以往自己寶座處消失無蹤，作為戲劇化的收尾。


  作為大時代的悲劇，溥儀至少不至於毫無選擇，只是以後見之明來說，每一步選擇都錯，

  成為帝王並非自己的選擇，但不再成為帝王卻是一種選項，只是或許這個選擇對每個帝冑

  都太難，慕容復如是，溥儀亦如是，如果他能接受莊士敦建議，或許還能是個流亡貴族，

  而利益產生蒙昧，被日本把持住，便沒有後路了。







  悲情城市是從日本天皇玉音放送戰敗消息開始，陳松勇在照顧正在生產的老婆，原本我以

  為這個孩子會是重要腳色，不過好像還好。


  陳松勇扮演地方望族林氏家族老大，其下有三個弟弟，老二在太平洋戰爭出去沒有回來，

  老三在戰時當日本翻譯，被當作漢奸處理到精神異常，回鄉休養，老四從小失聰，安安分

  分地當攝影師，但好友寬榮卻是個記者的樣子。


  透過寬榮與好友林老師等人餐敘，合唱九一八歌曲，可以想見一開始台灣人對回歸祖國並

  沒有很排斥，但是隨著吳念真說的物價飆漲五十二倍，薪水卻沒漲，以及知識份子與回國

  軍人沒工作，米糖在戰時還有配給，現在是都被拿到大陸等片段，可以說台灣人對陳儀統

  制愈來愈不滿，甚至以台灣人都被日本奴化為名，合理排除法院台灣人，讓外省法官塞入

  自己親戚，成為自己開的法院，這大概是後來說法院是政黨開的濫觴。


  果不其然，後來就出現販賣私菸被警察打的騷動，片中明白指出，當時能走私菸的多半也

  是政府有力人士，不過當時老四梁朝偉與寬榮前往台北，企圖要用日殖時期的爭取方式，

  開人民議會與政府對話，但正如寬榮說的，陳儀就是土匪，怎麼可能會那麼乖，後來的歷

  史我們都知道了，緩兵之計等待老蔣派兵後，接下來就是清剿，一開始我看到寬榮的傷，






  悲情城市是從日本天皇玉音放送戰敗消息開始，陳松勇在照顧正在生產的老婆，原本我以

  為這個孩子會是重要腳色，不過好像還好。


  陳松勇扮演地方望族林氏家族老大，其下有三個弟弟，老二在太平洋戰爭出去沒有回來，

  老三在戰時當日本翻譯，被當作漢奸處理到精神異常，回鄉休養，老四從小失聰，安安分

  分地當攝影師，但好友寬榮卻是個記者的樣子。


  透過寬榮與好友林老師等人餐敘，合唱九一八歌曲，可以想見一開始台灣人對回歸祖國並

  沒有很排斥，但是隨著吳念真說的物價飆漲五十二倍，薪水卻沒漲，以及知識份子與回國

  軍人沒工作，米糖在戰時還有配給，現在是都被拿到大陸等片段，可以說台灣人對陳儀統

  制愈來愈不滿，甚至以台灣人都被日本奴化為名，合理排除法院台灣人，讓外省法官塞入

  自己親戚，成為自己開的法院，這大概是後來說法院是政黨開的濫觴。


  果不其然，後來就出現販賣私菸被警察打的騷動，片中明白指出，當時能走私菸的多半也

  是政府有力人士，不過當時老四梁朝偉與寬榮前往台北，企圖要用日殖時期的爭取方式，

  開人民議會與政府對話，但正如寬榮說的，陳儀就是土匪，怎麼可能會那麼乖，後來的歷

  史我們都知道了，緩兵之計等待老蔣派兵後，接下來就是清剿，一開始我看到寬榮的傷，

  還以為他是雙手被穿鐵絲，還好沒有那麼殘忍。


  但情勢已經對台灣人絕對不利，寬榮也退居地下化，成為異議份子，從老四文清的馬克思

  來看，大概不免是左派路線。由文清與寬榮的妹妹-後來文清的老婆寬美資助。


  另一條家族線，是老三林文良結識的上海幫，企圖透過林家的船隻，走私米糖到上海發橫

  財，又陳松勇的小弟阿嘉朋友紅猴因捲入盜印日幣被殺，後來與上海幫決裂，被檢肅漢奸

  罪犯條例構陷入獄，成了瘋子。


  老大陳松勇也因為阿嘉被追殺參戰，被上海幫槍殺。老四梁朝偉文清，也只能從一介攝影

  師一間扛起林家，但最終還是因資助寬榮而被捕。當時中華民國轉進台灣，遷都台北。


  我是覺得這部片用了太多倒敘，很多人的背景都用回想的，導致有些地方看不太懂，尤其

  這是群像劇，每個人都有故事，角色太多，但是這部仍然是很棒的片，他並沒有描寫很多

  國民政府的殘暴，卻可以把對岸與台灣連結的那四年變化表現的很生動，，像是梁朝偉演

  出的聾子，因為講話口音，在講出我是台灣人的時候仍被當作外省人被攻擊，可以想見，

  當時情況，可能跟李敖講的一樣，很多無辜的人，不分本省外省，都有可能遭殃。


  另外就是從片子一開頭的跑馬燈，到最後的演員列表，發現一大堆台灣當代的大咖，可以

  說是眾星雲集的片，另外，九份也是因為這部片再次崛起，雖然片中蠻多是金瓜石的景的

  ，物換星移，有些古早景色現在都沒有了，想要體會老台灣的真的蠻值得看的。


  最後要說，寬美的美很古典，很有味道呀，跟現代的美的方向很不一樣啊。


  --

  蠻多回想的 我覺得有點複雜

  原來如此

  啊 我記錯了嗎

  老師大古板'
