  如果近期有在關注國家影視廳中心董事長 藍祖蔚老師的臉書

  可以看到他於威尼斯影展期間開始回顧當年《悲情城市》參展的一些往事


  而於昨日【張大春泡新聞】的專訪也證實了

  《悲情城市》將於今年映演33週年數位版




  訪談內容有提到此次《悲情城市》的數位版

  為直接與出品人邱復生拿到當時的電影底片


  而底片保存狀況良好，是從原本底片直接數位化，再重新調光

  聲音也維持原本MONO聲道，無另外修復


  9/15今日也將邀請許多電影人到國影中心先行觀賞此次數位版放映

  未來也將有可能進行商業排片映演


  另外也提到了於今年世界影音遺產日10/27 將放映《油麻菜籽》

  明年也將會放映曾壯祥的《殺夫》


