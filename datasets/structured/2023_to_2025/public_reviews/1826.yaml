url: https://www.ptt.cc/bbs/movie/M.1646033583.A.DF3.html
title: '[討論] 年代電視台今天應該也會播悲情城市吧？'
content: "同樣是日本人做的配樂\n我喜歡悲情城市大於末代皇帝\n\n雖然陳懷恩大師的攝影比起李屏賓大師 比較中規中矩\n但還是跟侯導一起平靜又誠實的說了一個關於台灣自己的故事\n\
  \n每次看到這幕\n\n都會讓我想到萬仁導演“超級大國民“的這幕\n\n然後熱淚盈眶\n\n和平東路一直往東走 上了山\n在一個小小的岔路斜坡旁 寫著：\n白色恐怖紀念園區\n\
  \n是我大學時常常會去的地方\n\n當朋友跟我說 地上遍佈的小小石柱 是無名塚時\n我心中震驚不已\n\n超級大國民的年邁主角\n在那一片無言的墓地上 點滿懺悔的燭光\n\
  令人心疼\n\n好好安睡吧 英雄們\n不論在戰爭中 有沒有站立到最後一刻\n你們永遠是台灣的英雄。\n\n--\n                      \
  \                    02/28 19:48\n謝啦"
