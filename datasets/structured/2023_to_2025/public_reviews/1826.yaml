url: https://www.ptt.cc/bbs/movie/M.1678664691.A.874.html
title: '[ 好雷] 悲情城市特別場'
content: "其實就是多發了張海報，有看到觀眾小心地帶著A3資料夾坐在地上收拾好。\n\n覺得自己也想要這樣子學起來。\n\n\n\n我並不知道這是臺灣第一部跟228有關的戲劇，\n\
  \n這次會看也是因為我一直覺得很迷人的梁朝偉提到說他很期待這部片重映，\n\n然後說也奇怪就重映了，\n\n不知道是人家順了他的意還是他也接業配就是了。\n\n\
  反正就在這什麼都不知道的情況下開始看起。\n\n對了我甚至在觀看之前買了劇本書，\n\n明知道是被盤但還是被盤得很高興的狀況。\n\n所以看之前的印象就只有梁朝偉、高捷、陳松勇的幹你娘很好聽？\n\
  \n大概就是這樣吧。\n\n\n可以理解看完以後聽說被當時覺青覺得拍得太隱晦了，\n\n從現在我看的角度就覺得有些地方沒拍好，\n\n像是松勇伯到底是被哪個方向開槍的我聽到槍聲找了一陣子才發現哪裡有人拿槍；\n\
  \n高捷在車上震一震就七孔流血也是暗示我們以前打人都墊著厚厚的書在打才會有這種效果。\n\n\n\n甚至劇情也隱晦到我看了大概前面半小時才大概了解劇情的方向，\n\
  \n再用後面的劇情走向與前面的劇情連結。\n\n然後也才知道原來梁朝偉戲中的小舅子現在是大名鼎鼎的舞蹈家吳義芳；\n\n才知道女主角一家子在車站的畫面美的像一幅畫，但女演員如此優秀卻有如小龍女般隱藏於人間不再出現；\n\
  \n\n高捷在戲中是個了尾仔但是看他前段超帥後段超會演真的非常了不起。\n\n對了還有國寶李天祿，其實我不google也不太記得這位國寶做了什麼事情變成國寶，卻看到他的臉就認出他來。\n\
  \n然後中後段有一幕長鏡頭出現了邰哥的臉，這才發現原來他有演，\n\n至於那位被戲稱國師的肥胖美女，我就真的沒有在戲中有見到她的感覺。\n\n\n有很多部分拍得很美，美到我搞不清楚這一段到底要表達什麼，\n\
  \n像是男女主角在鐵軌旁的畫面，\n\n明明旁邊有女主角的旁白說不知道要逃到哪裡，\n\n但我整個人就被那個畫面吸引，\n\n後來看了劇本書以後才慢慢產生連結，\n\
  \n原來他們在火車站是真的想要走。\n\n\n228事件每年都會被吵一次，\n\n但是真正知道事件全貌的人又有多少？\n\n我本來也自以為家裡翻翻228口述史就知道很多事，\n\
  \n但電影都那麼久了我也是到2023年才聽到陳儀的廣播，\n\n很可惜事情的走向不像陳儀在廣播中說得那麼有誠意，\n\n當初大家是帶著什麼心情北上調解、\n\n\
  又是怎麼樣莫名地變成屍體回來這些可能永遠沒人知道全貌。\n\n人們就這樣看著各方歷史拼湊，\n\n並加入自己的想法，\n\n然後過了幾十年不同立場的人做出不同的行為。\n\
  \n家裡沒有受害者的後代覺得自己是受害人，\n\n家裡不知道有沒有加害者的後代被當成兇手要人下跪。\n\n--\n \n\n\n\n\n\n-----\nSent\
  \ from JPTT on my Sony J9110.\n\n--"
