title: '[新聞] 釜山電影節亞洲百大佳片 侯孝賢悲情城市'
content: '新聞網址：



  釜山電影節亞洲百大佳片 侯孝賢悲情城市摘首位



  釜山電影節選出亞洲百大佳片，台灣名導侯孝賢的「悲情城市」摘下首位，已逝導演楊德

  昌「牯嶺街少年殺人事件」獲第3名，「一一」則排行第10。


  侯孝賢1989年執導的「悲情城市」以二二八事件為背景，挑戰當時禁忌話題。此片拿下第

  46屆義大利威尼斯影展 「金獅獎」，成為首部在國際三大影展掄元的台灣電影。


  「悲情城市」同時也獲聯合國教科文組織「人道精神特別獎」及「金拍板獎」。侯孝賢並

  以此拿下第26屆金馬獎「最佳導演」，也讓演員陳松勇拿下最佳男主角獎。


  楊德昌執導的「牯嶺街少年殺人事件」1991年在台灣上映，全片改編自1961年發生在台北

  市牯嶺街的真實青少年殺人事件。


  「牯嶺街少年殺人事件」因選角、製作技術繁雜及資金問題，歷時110個工作天才拍攝完

  成。片中帶出戒嚴時期白色恐怖對身心靈的禁錮，當年也衝擊剛解嚴的社會。


  「牯嶺街少年殺人事件」獲得金馬獎最佳劇情片獎、最佳原著劇本、亞太影展最佳影片、

  東京影展評審團特別大獎、國際影評人費比西獎。


  「一一」則拍出家庭、愛情、親情及生命等人生課題，此部片也讓楊德昌摘下坎城影展最

  佳導演獎，成為台灣首名獲此獎導演。


  「一一」同時也摘下紐約影評人協會、洛杉磯影評人協會最佳外語片，2016年更被英國廣

  播公司BBC評選為「21世紀最偉大的100部電影」第8名。



  --'
