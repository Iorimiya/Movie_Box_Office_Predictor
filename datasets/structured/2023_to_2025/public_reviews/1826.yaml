url: https://www.ptt.cc/bbs/movie/M.1677558116.A.E0F.html
title: '[討論] 悲情城市中高捷飾演的文良一角（雷）'
content: '如題


  個人不太確定是侯孝賢導演的刻意安排


  或是其他原因


  高捷飾演的文良到上海工作


  因為被當漢奸逃跑到台灣精神變成異常


  事後又跟上海有走私毒品交易但又被黑吃黑陷害


  被軍隊抓回後精神又失常


  個人可能認為一開始文良在醫院發瘋的情景


  對照文良事後跟上海幫討論走私案的情景


  讓個人心中有點矛盾


  不知道這角色設定是否只是為了凸顯電影主題


  不然個人認為一開始的發瘋並非必要


  再說如果以原本這個角色來看的話


  此角色人物設定真的難度太高


  高捷在本劇中真的沒辦法盡情發揮他兇狠的演技


  可能發瘋的角色對他來說真的不適合吧？


  各位認為呢？


  --'
