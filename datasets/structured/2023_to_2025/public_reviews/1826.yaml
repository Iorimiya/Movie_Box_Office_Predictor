title: '[新聞] 國影慶40週年《悲情城市》30週年特別放映'
content: '國影慶40周年 紀錄片《大甲媽祖回娘家》數位修復版10/25特映




  記者王丹荷／臺北報導


  　國家電影中心自2012年展開首波數位修復計畫至今，近日以自製紀錄片《數電影的人》

  呈現典藏與修復人員如何面對與感受時間的迷人與無情，今年度並將以1970年代黃春明導

  演紀錄片《大甲媽祖回娘家》的數位修復版本響應「聯合國世界影音遺產日」、於25日舉

  辦特映讓國人搶先觀賞，另1989年臺灣第一部在威尼斯影展勇奪金獅獎的《悲情城市》也

  將於26日舉辦特別放映。




  　聯合國教科文組織（UNESCO）訂每年10月27日為「世界影音遺產日」，旨在呼籲世人重

  視影音資料保存之急迫與重要性，今（2019）年恰逢國影中心成立40周年，規劃紀錄片《

  數電影的人》、最新數位修復紀錄片《大甲媽祖回娘家》，及典藏之寶35mm膠卷《悲情城

  市》3場特別放映會，邀請觀眾見證國影中心在典藏與數位修復的成果。


  　《數電影的人》一揭典藏中心神祕面紗，把膠卷、影帶等影音資料這些年來到中心是怎

  麼被保存與典藏的真實呈現在國人面前，也紀錄同仁在典藏及修復膠卷的工作點滴，期望

  喚起眾人對影像資產保存的重視，並再次感謝所有資產保存工作者的辛苦與熱情。例如國

  影中心典藏之寶《悲情城市》35mm膠卷也將在榮獲威尼斯影展金獅獎30年後的今年舉辦膠

  卷特映會，呼應今年聯合國世界影音遺產日之口號「透過聲音與影像認識歷史」（

  Engage the Past Through Sound and Images）。




  　最新數位修復紀錄片《大甲媽祖回娘家》則是1974年由文學家黃春明導演與攝影師張照

  堂以16mm膠卷拍攝而成，忠實記錄當年大甲媽祖遶境時眾人虔誠敬拜、路人宴請信眾、警

  察維護執勤、神明上身的乩童與還願的報馬仔等信眾模樣，也是臺灣1970年代電視紀錄片

  「芬芳寶島」系列首作。當時因應電視政策須以國語旁白播出，本次則修復「臺語」原版

  拷貝，將與《數電影的人》於25日世界影音遺產日活動做首度公映。


  　《大甲媽祖回娘家》將於25日下午3點半放映，緊接著晚間7點半放映40周年紀錄片《數

  電影的人》；《悲情城市》35mm膠卷特映會則將在26日下午1點放映，放映地點皆為光點

  華山電影館，3場特映會自17日10點起、每天上午10點至下午5點半開放索票，可於國影中

  心4樓櫃檯免費索取，票券數量有限、索完為止。放映當日劃位入座，座位有限額滿即止

  。


  閒聊：


  1989年侯孝賢導演執導的《悲情城市》，電影反映台灣歷史爭議「二二八事件」，並一舉

  榮獲該年威尼斯影展最高榮譽金獅獎，也是台灣首部在世界級三大影展內榮獲首獎的電影

  。沒想到轉眼間已經過了30年，好在有這個活動，可以讓《悲情城市》在30週年的這天，

  有機會作特別放映，讓大家不要忘記這部電影。


  這部可以看到年輕的梁朝偉，也是辛樹芬的息影之作。還滿希望《悲情城市》未來可以作

  數位修復並登上大螢幕，像《霸王別姬》25週年重映那樣，錯失這次的30週年，感覺還有

  得等了，真的滿想在大螢幕看一次這部台灣經典的電影，然後希望侯孝賢導演還可以推出

  新作，好想也希望看到他摘下金棕櫚，畢竟他入圍好多次QQ


  --'
