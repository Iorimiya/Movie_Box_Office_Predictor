title: '[新聞] 《悲情城市》經典重現 梁朝偉催出網路聲量'
content: "《悲情城市》經典重現 梁朝偉催出網路聲量\n\n2023/02/22 05:30\n\n\n《悲情城市》在梁朝偉訪台後網路聲量飆升，已成近年國片最受熱議的文化現象。\n\
  （牽猴子提供）\n\n〔記者許世穎／台北報導〕由導演侯孝賢執導的電影《悲情城市》，以全新4K數位版重返\n大銀幕，國際巨星梁朝偉上週特地飛來台灣看首映，深情感言掀起熱烈迴響，更讓該片網\n\
  路聲量與梁朝偉本人的好感度飆升。\n\n電影將於24日上映，相關書籍、限量款經典海報，近日盤踞各大熱銷排行榜首，加上各界\n包場支持，使得這部33年前出品的歷久彌新經典，儼然已成近年國片最受熱議的文化現象\n\
  。\n\n而梁朝偉除了描述台灣歷史的《悲情城市》，還有描述香港歷史的《風再起時》同日在台\n上映，片中他除了施展電眼演技，更扮起「神槍手」上演槍戰。他表示：「我們香港8、\n\
  90年代拍電影的，基本上什麼動作、什麼槍啊、子彈！各種動作都經歷過。」他認為最大\n的挑戰還是彈鋼琴：「練習的過程非常痛苦，練到我真的想跳樓。」\n\n--\n\
  佛教經典的\n是 是菩薩成佛之道\n        是 佛經\n  是 佛      是 菩薩\n\n\n\n--"
