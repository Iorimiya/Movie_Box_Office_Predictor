title: '[無雷]再刷悲情城市 '
content: "整理了二度重看悲情城市觀影重點。\n\n一段1945~1949年林氏家族的故事，始於日本投降，終於國民政府正式遷台。\n\n二次唱悲歌：蔡秋鳳+蔡振南，都有二胡伴樂。\n\
  \n二次擦地板鏡頭：一次是酒家，一人跪地擦地板，一次是醫院，一人用拖把擦地板。\n\n三段廣播：一段是日本天皇御音，另二段是陳儀因228事件，二度廣播放送安撫人心。\n\
  \n侯導喜歡拍的場景：\n一，九份俯瞰漁港。\n\n二、九份（實則是金瓜石）山路，寬美文清上山、寬美寬榮下山。文清上山找寬榮，有看\n    到廢煙管。\n\n\
  三、飯廳畫面，二次伴著炒菜的聲音，只有家裡男人才能上桌吃飯。一次是寬美挑著菜\n    等文清歸來。至少二次文良搖著頭吃餅當飯廳背景。\n\n四、灶腳：林家大哥八斗子女人生產時、林家大哥泡茶、二嫂炒菜。\n\
  \n五、礦工醫院門口：靜子告別、上海佬尋文良、文良送禮、228事件鬥毆、文清台北返回\n    找寬美、文清帶寬美生產。\n\n六、八角亭旁的菜市場小路，寬榮帶朋友到文清工作室、林家大哥到文清工作室、寬美買\n\
  \    菜。\n\n有看漏的地方，請大家包涵啊。\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n\n--"
