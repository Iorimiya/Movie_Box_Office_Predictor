url: https://www.ptt.cc/bbs/movie/M.1445570703.A.B82.html
title: '[新聞] 《悲情城市》編劇待遇 朱天文吳念真編劇'
content: '新聞網址：



  《悲情城市》編劇待遇 朱天文吳念真編劇四六拆帳


  2015年10月22日 14:37

  (印刻提供)


  朱天心新書《三十三年夢》計三十一章回，回回皆是京都遊記。遊記始於一九七九年五月

  ，二零一五年五月停筆，三十餘年，年年京都，她寫旅途種種見聞，哪裡麵包好吃，哪個

  小路櫻花開得極好，也寫同行人的情誼和互動，「不夠熟的人，不夠喜歡的人，是不會與

  之一起同遊京都的」，朱西寧朱天文胡蘭成詹宏志王宣一駱以軍張大春林俊頴尹乃菁鄭麗

  文，還有無所不在的侯孝賢，是家人了，幾乎。



  《三十三年夢》可當另外一冊《京都的門外漢》來看待，也可當三三期刊結束，她大半生

  一番夢幻經歷，如何將真事掀開去了。



  書中交代自己傾慕的人，也寫生命裡那些錯過的人，如楊德昌。

  朱家與楊家本來交好，然而楊德昌與陳國富組電影合作社，「長期以來好事之徒所想像的

  瑜亮之爭並見縫插針之撥弄之……」楊想拍《紅樓夢》找她寫劇本盧了一整晚她不肯，楊

  便對因秀場下班晚到的蔡琴說：「他們還是選了孝賢。」




  寫蔣勳少年其實旁聽胡蘭成課，撇清之後，又來沾光。




  寫李昂早年投書數落她是國民黨打手，後來李沾惹亂插香爐一臉土灰，她便將該書評回寄

  李昂，結果兩人竟在某日本台灣研討會陰錯陽差成了室友。




  還有，吳念真。




  「礦工之子與天文同掛編劇，實則工作狀態是天文與侯子日日談劇本一整年，最後一星期

  交給礦子填上生動口語之閩南語，侯子疼愛礦子，且一直以為礦子真像他自己愛說的那樣

  窮窘，便將劇本費四六分(女生不需養家故少些)，兩人合掛名。是故我每見礦子記者會或

  訪談中大談「我當初構想……」「我的理念……」「我覺得台灣人……」我覺得他真好意

  思……礦子早就不是礦工後代的生活了，就像我們後來老愛把三級貧戶之子掛口上的另一

  名台灣之子，他們都不窮很久了，那之前一年，我們同行去義大利貝沙洛影展時，一路上

  我已深深見識他對名牌的嫻熟與不手軟。



  ----------------------

  原來悲情城市劇本錢是這樣拆的，還有該說這家子人不意外嗎?


  --'
