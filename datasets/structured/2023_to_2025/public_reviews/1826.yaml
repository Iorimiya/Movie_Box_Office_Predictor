url: https://www.ptt.cc/bbs/movie/M.1675345577.A.C9F.html
title: '[新聞]一生必看的電影《悲情城市》經典重映'
content: "新聞網址：\n\n侯孝賢執導的經典史詩鉅作《悲情城市》時隔33年後，即將以全新4K數位版全台上映。該\n片是台灣政治解嚴之初，電影創作上首部直接挑戰政治禁忌話題和電檢尺度的作品。尤其\n\
  飾演失聰人士的梁朝偉，在片尾吃力說出「我…台灣人」的經典台詞，一句話道盡身為台\n灣人無奈，強大的感染力道，深深打動人心。\n\n《悲情城市》以228事件為背景，透過一個台灣基隆家族興衰，帶出封塵禁錮歷史。當年\n\
  一舉奪下威尼斯影展最佳影片金獅獎，成為首部於世界三大影展掄元的國片，不但鼓舞了\n台灣電影創作者，開啟國片在全球各大影展引領風騷的美好年代。\n\n經典重映的全新彩色款主視覺海報的中文文案只有一句：「身為台灣人，一生必看的電影\n\
  」，相對於當年《悲情城市》上映時的宣傳文案：「在今天以前，這個故事，你聽不到，\n也不能講…。」正好反映出時代的變遷，33年過去了，如今的台灣已是人人暢所欲言，不\n\
  再噤聲的開放國度。\n\n「沒有陰影，只有驕傲…」預告開頭呈現的令人深思文字，則是1989年9月6日《悲情城市\n》代表台灣電影出征威尼斯影展那天，大氣刊登於中國時報的半版廣告文案標題，內文是\n\
  ：「一個繁榮富裕的國家，才有自信去緬懷過去的貧窮憂患。一個民主自由的國家，才有\n自信去省視過往的歷史。」時隔三分之一世紀再回頭看，竟然毫無違和感。\n\n 預告中最令人動容的一段，是片尾梁朝偉在火車上被用台語、日語問及「你是哪裡人？\n\
  」眼神雖流露不安與膽怯，但失聰瘖啞的他，卻仍大聲回答「我…台灣人。」反映出228\n事件省籍衝突的動亂與無奈。\n\n導演侯孝賢表示，一開始會選擇梁朝偉出演，就是因為他的神情與眼睛很好，再設定他演\n\
  出的角色為失聰人士，不但克服了他不會說台語的缺點，更突顯他那雙會演戲的眼睛。梁\n朝偉去年在釜山影展記者會上提及，最想讓新一代觀眾欣賞的作品，就是他來台拍攝的《\n\
  悲情城市》。\n\n曾因淘金客湧入而繁華一時的黃金山城「九份」，褪色沒落多年後，也因《悲情城市》取\n景而重生，成為國際知名觀光景點。演員高捷及太保日昨回到九份重遊當年的拍攝場景，\n\
  吸引許多遊客圍觀，更有日本、香港、泰國、澳洲等各國觀光客爭相合照，還有韓國人看\n了海報興奮直呼「是侯孝賢導演！」\n\n高捷和太保才一踏進九份老街便回憶湧上，太保說：「我最記得拍戲時，我們從石板階梯\n\
  走上來，一眼就看到兩旁搭出的酒家門外，站了一堆扮成酒家女的臨演。」高捷也補充：\n「因為日治時代九份很多礦工，挖了金礦有錢了，所以有很多小姐服務，他們一天勞累的\n\
  工作之後就來找樂子，那時候九份也被稱為小上海，很熱鬧的啦！」\n\n\n--"
