url: https://www.ptt.cc/bbs/movie/M.1675093598.A.14B.html
title: '[新聞] 梁朝偉《悲情城市》婚禮 著實跪拜九叩首'
content: "梁朝偉《悲情城市》婚禮 著實跪拜九叩首\n\n04:10 2023/01/30 中國時報 李承陽\n\n\n26歲的梁朝偉（右）與23歲的辛樹芬，在《悲情城市》中扎扎實實跪拜到九叩首。\n\
  （牽猴子提供）\n\n\n迎親戲中新娘辛樹芬（右）身著典雅過膝洋裝，新郎梁朝偉則是三件式直條紋西裝。\n（牽猴子提供）\n\n影帝梁朝偉去年在韓國釜山影展記者會上提及，最想讓新一代觀眾欣賞的作品，是他33年\n\
  前來台拍攝的《悲情城市》，這部台灣影史首部榮獲威尼斯影展金獅獎的巨作，將以4K數\n位調光版本重映。電影開拍前3年，劇組對1947年故事發生的歷史背景深入研究，對當時\n\
  食衣住行等民間事物的考據，更是花了一番工夫。\n\n尤其梁朝偉首次在銀幕上如此巨細靡遺、行禮如儀拍完結婚大禮的戲，讓他至今仍帶著滿\n滿回憶。當年26歲的梁朝偉與23歲的辛樹芬，穿著西式禮服婚紗，新娘身著典雅過膝洋裝\n\
  ，頭戴直直垂地鏤花白紗，手執長長緞帶捧花；新郎則是三件式直條紋西裝，右手拿黑色\n禮帽、左手握白色手套，時髦的款式都經過劇組考據。\n\n另飾演媒婆的演員，是當時童星顏正國的媽媽，因為兒子從小就和導演侯孝賢合作，所以\n\
  也跟班底十分熟悉，加上長期在片場陪兒子拍戲，客串起來得心應手。但也苦了梁朝偉、\n辛樹芬這對新人，兩人在顏媽媽口令下，從一叩首開始，扎扎實實跪拜到九叩首，若再加\n\
  上當天的NG鏡頭，兩人就這樣彎腰跪拜了大半天，吃足苦頭。\n\n#考據 #辛樹芬 #梁朝偉 #悲情城市 #兩人\n\n--\n佛教經典的\n是 是菩薩成佛之道\n\
  \        是 佛經\n  是 佛      是 菩薩\n\n\n\n--"
