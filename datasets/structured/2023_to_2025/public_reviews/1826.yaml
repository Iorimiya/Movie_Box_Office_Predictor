title: 'Re: [ 好雷] 悲情城市特別場'
content: '這部所代表是歷史轉捩點

  沒有悲情城市 228事件

  不會這麼早在大眾面前解密



  悲情城市上映的年代1989年

  台灣有警總負責思想審查

  有新聞局負責媒體審查


  雖然民間有零星228記念平反活動

  當時沒有手機 台灣電視台只有老三台 黨報

  書籍上架書店販售前 也要新聞局先做過審查


  228相關事件發生40多年來

  從未經由媒體或報紙報導過

  書本不可能找到228事件介紹

  228事件詳細內容被

  多數台灣人不知道228代表什麼

  悲情城市是第一部把228事件帶進大眾視野


  拍的隱晦很正常 不知道拍完不知道會有什麼下場

  演員未來演藝之路可能被封殺


  當時台灣人不知道悲情城市這部電影

  台灣的電影要上映前 需經審查

  預估那幾段隱晦228會被剪掉

  猜測導演有多方評估過 才會拍出影射228 卻不多做解釋


  悲情城市先去國外放映

  得威尼斯影展金獅獎

  消息傳回台灣 電視台 報紙大幅報導

  228事件徹底在台灣大眾面前掀出來

  台灣多數民眾是透過悲情城市才知道台灣曾經發生過228事件

  學生問悲情城市拍什麼

  老師回答不出來 有年長的人可以回答出來 也無法講清楚始末

  很多台灣人不知道什麼是228

  228發生那些事情


  隔年政府宣佈解密228事件





  果



  --'
