url: https://www.ptt.cc/bbs/movie/M.1746796960.A.95C.html
title: 'Fw: [普雷] 《看我今天怎麼說》角色成長大於議題表達'
content: '作者: elvayanzimei (柏C) 看板: HK-movie

  標題: [心得] 《看我今天怎麼說》角色成長大於議題表達

  時間: Fri May  9 21:22:15 2025


  部落格圖文版：


  無論是突然感受到素恩即便已經做了人工耳蝸手術，聽到的世界仍然充滿雜訊所帶來的衝

  擊；飾演童年子信、Alan 的兩位小演員真誠，讓人為這段友情心裡一暖的演出（加上和

  青年版的兩位演員神韻真的好像）；還是素恩選擇接受那個努力，但可能仍未達到世界要

  求的自己的委屈與釋懷。


  在看《看我今天怎麼說》的過程中，總會有某一幕、某個情節使我們產生共鳴。


  電影的主軸聚焦於當社會鼓勵大家克服自身的不同，融入群體時，「手語」作為一種表達

  自己的方式是不是因此受到忽視，甚至抵制。但在敘事脈絡上，不論已成歷史的「口語學

  校」，就片中那些手語與口語仿佛是二元對立，一定要做出抉擇的時刻，也很難不讓我對

  應到台灣「國語運動」下的台語和中文。


  由發自內心希望世上不再有聾人的「人工耳蝸大使」，到認為打手語是真正在表達自己，

  素恩跟母親確實在這個理解、喜歡真正的素恩的過程中贏回了彼此。然而這樣的理解沒有

  被更廣泛地建立，因為驅動素恩覺察自我的，正是在職場上的格格不入，還一度造成了她

  與 Alan 的對立。


  必須說《看我今天怎麼說》最大的問題，是素恩人設的矛盾。明明是以精算師為志向的高

  材生，卻對在面試時就被問到會不會手語的自己，最後被當成「吉祥物」這件事違背常理

  的後知後覺。在主線劇情張力不足的同時，也壓縮了以聾人、手語為榮的子信，以及適應

  得最好的 Alan，他們更立體地去訴說自己為何這樣選擇的機會。


  我還是很喜歡鍾雪瑩在面對已經「加倍努力」，但還是沒有成為理想中的自己時，對關心

  她的 Alan 動怒、宣洩壓力的那場戲。當她決定接納自己時，或許你我都曾有過，儘管盡

  力了卻感覺仍差一點、不夠好的委屈和不甘心好像都被理解了（加上「What If」的前奏

  ，真的瞬間有點想哭><）。


  因此，若把觀影重點放在角色的覺醒，可能也就不會因為電影對於手語、口語議題的單一

  答案，而感到有點可惜了吧。


