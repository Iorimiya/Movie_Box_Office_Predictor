title: '[好雷] 看我今天怎麼說'
content: "記 《看我今天怎麼說》\n\n青春、可愛，通俗而工整，剛好在今天觀看別具意義。\n.\n語言不只有溝通功能，也傳承文化、代表身份認同。\n\n\
  如果單就溝通角度，一定是叫大家都學官方語言，統一溝通方式CP值最高。\n\n但學習語言的過程不是這樣，不是流水線生產罐頭。我們跟家人吃飯、跟朋友打屁聊天，\n\
  在生活中形成一種自然而然、約定成俗。\n\n《看我今天怎麼說》打破了文化本位思想，輕鬆讓觀眾體會沒有所謂的理所當然，沒有所\n謂「正常」該怎麼溝通、說什麼話。\n\
  \n看清楚文化傳遞的過程，才會意識到不自覺對他人投注的，「弱」的眼光。\n.\n之後聽長輩講台語聽不懂，除了請他們講中文，會開始跟他們學台語怎麼講。\n\n記得這份互相的心情。\n\
  \n–\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n--\nHami video有"
