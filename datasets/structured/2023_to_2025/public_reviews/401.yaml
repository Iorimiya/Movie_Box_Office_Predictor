url: https://www.ptt.cc/bbs/movie/M.1746290228.A.2D8.html
title: '[好微雷] 看我今天怎麼說，真的很會說。 '
content: '事不宜遲，來聊聊《看我今天怎麼說》吧。

  我對鍾雪瑩的認識最初是在編劇會議裡面偶爾會聽到Norris提及，

  首次看到她的表演是在《填詞L》，驚為天人，那種化為質樸的演繹方式，

  常常會讓我想起尾野真千子，拿到最佳女主角獎時，有種毫不意外的感覺。

  親自到戲院觀賞果然嘆為觀止，她肩負了最具衝突與掙扎的角色，

  也是立場光譜上移動最多的人，從壓抑到想望、努力與幻滅、猶疑到誠實，

  都用她毫無斧鑿痕跡的自然態度帶著觀眾的心情起落，

  說到這邊，還沒提及她去成為一個做了人工耳蝸手術，稍微能夠說話又不精準，

  聽得見卻不清楚，被教育與社會期待逼迫，依舊不斷鼓起勇氣向前的聾人。

  可以用一道從外觀到層次，香氣到調味無不恰到好處的料理來比擬的演出。


  放完馬後炮，來講私心最喜歡的小演員鄭進希，

  他那個臭屁難馴的嘴臉到底是不是演出來的？

  讓大人看到氣得牙癢癢，但又不可能不覺得他真可愛。

  他打起手語的那種自然、自信和自傲，除了吸引觀眾目光之外，

  還能幫到故事，很快的就確立了全片的價值對抗所在。


  第三件得趕快提及的是，雖然本片有戀愛成分，

  為了看鍾雪瑩而進戲院的我，完全沒料到有兩對不亞於《怪物》的CP，

  我嗑得猝不及防，國小生的BL可以淺嚐輒止，

  而負責賣黑肉的游學修跟長得像姚淳耀跟林柏宏生的小孩的素人吳祉昊，

  文武動靜分配得剛剛好，結局和《青春末世物語》異曲同工之妙，

  「男孩子就是要喜歡陽剛的東西，例如男孩子。」簡直是當代電影箴言。


  回說故事，黃修平加入朋友的殘障人士電影企劃，花了四年詳實田調選材，

  最終定錨的核心為「不同而非不足。」

  雖然有點理想化，但全片使用的溫情恰到好處，那些障礙和目光一直都在，

  而如何去克服他，或者無法克服而去面對他，

  其實不僅止於聾人會遇到這些生活挑戰。

  因為時代的錯誤認知，他們成長於禁打手語的年代，

  這對曾經校園禁說台語的台灣一點也不陌生。

  直到人工耳蝸植入手術普及，聾人卻因為理念與經濟狀況被分了階級，

  《悲情城市》問：「你是哪一種台灣人？」

  《帝國浩劫》問：「你是哪一種美國人？」

  《看我今天怎麼說》：「你是哪一種聾人？」

  明明可想而知，我們卻被提醒了在聾人的世界裡面，

  同樣有身分認同與話語群矛盾。


  角色從兩個男孩開始，在故事進行到中段時，主敘事卻落到了女孩身上，

  這或許是在編劇教科書或同業眼中認為是大忌的處理方式，

  而當觀眾已經身不由己地進入世界觀，關心題目、關心角色時，

  也正是公式被打破之日。

  當他們練習手語時翻飛的手掌，搖曳的身形，靈活的表情，種種美好姿態，

  讓觀眾不由得更加傾向角色，同時也是作者選擇的立場，手語何罪之有？

  再加上聾人潛水教練的設計，帶領鏡頭進入湛藍的海底世界，

  此岸被鬱悶和壓迫所包圍，意欲遁逃到自由的彼岸，

  為寫實的電影和沉重的生活注入了無盡浪漫的氧氣。


  音效設計就不講了，自己進場去聽吧，

  劇本寫作原來就應該意識著每一場每一人的色聲香味觸法，

  而這部講述聽覺的電影，更是用專屬電影的魔力讓你理解聾人的世界，

  4/30看完就很想趕快寫推薦文，想必在戲院碰上漫威跟阿湯哥，遠景不佳，

  但這同時也是一部專屬於戲院的電影，大片可以等，跑不掉的。


  如果台灣影視終究要走進幾年的寒冬，

  很希望我們可以把這幾年的香港獨立電影當作範本，

  好好的寫簡單的劇本，拍出看過的人都能被打動的故事。



  --'
