title: '[雷] 繼承風暴、喵、猴子、火線追緝令'
content: '繼承風暴：

  Not my type，以為會是那種燒腦類型，但是看完去之後去聽別人討論，是演技帶來的壓

  抑，仔細想想確實，就以只靠男主演技營造出那種複雜氣氛，看了會很想扁人，但仔細想

  想如果是自己遇到片中的事，可能也不會有他處理的好吧。


  喵的奇幻漂流：

  貓奴可以無腦入，用大螢幕大音響看貓貓呼嚕就值回票價，二刷去看一些別人講的東西，

  確實有很多小細節在第一次看的時候只注焦在可愛貓貓上而沒看到，下週特典再換的話還

  會去看可愛貓貓。比起第一週，第二周+連假多了很多小觀眾，但整體觀影體驗沒有受到

  影響，真的感謝辛苦爸拔馬麻和能乖乖坐那麼久的小朋友。


  史蒂芬金之猴子：

  隨便塞進排程的一部，但確實就很「絕命終結站」，如果有下一部請製片組血漿再買多一

  點，謝謝。沒有jump scared ，美式笑點，中規中矩的B級片。


  火線追緝令：

  高中時看的，現在能在IMAX看到還是印象深刻，大螢幕看真的很過癮，就算劇情大概都還

  記得，觀影體驗依舊精彩，沒看過的一定把握時間去看，有看過串流也能去體驗大螢幕帶

  來的細節魅力。




  嗚嗚，看到討論說重映會擠壓其他新片的空間，但覺得有時候真的好想去電影院看以前經

  典的老電影。BTW 如果影城能把電影票做的漂亮一點應該會更吸引人到院線支持吧…至少

  不要熱感應紙嘛～QQ


  --'
