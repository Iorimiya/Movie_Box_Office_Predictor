title: '[好普微雷] 玩命特攻：武演行動-有頭髮的更帥'
content: '今年春節相對沒有什麼巨片 水之道跟灌籃高手看過後

  大概最大卡司的就是這部~ 整體而言是部及格以上的娛樂片

  但或許對蓋瑞奇有期待的版友來說 會覺得小失望吧


  普的部分

  1.蓋瑞奇風格不多 除了部分的音樂剪接 部分的第二人稱視角鏡頭 確實很難猜出是他作品

  2.奧布瑞.普拉扎演的不錯 但以女主角的人設來說 是沒有到那麼傾城傾國的說服力

  3.主角身為特務實在有點太容易露臉 所以各種替他捏把冷汗...=.=

  4.我到現在還是不太能理解為啥矽谷雙傻 明明找了一批人去取貨

  就算要再找批人保險 也應該是支援用而不需要把最早找的那批全XX吧


  好的部分

  1.其實整個小組越久越有化學效應 如果票房OK也許可以再出第二組任務

  2.壞蛋的目的有點驚喜感 不是一般的我要控制武器統治世界

  3.主要演員都算中規中矩 傑森史塔森依舊在演自己但這角色就是需要這樣

  但真正令人驚艷的是兩個有頭髮的-休葛蘭跟喬許哈奈特 兩人的角色有意思多了


  特別是休葛蘭 最後那一段獨白的戲霸氣外露 幹真的有夠帥有夠殺!

  光是看他演這一段 我就覺得要給好雷了 跟他過去角色意外的反差感!!


  其他有這個光頭該打的一定有 該轟炸的也不在話下

  鬥智的部分也算是有腦有點轉折 過年期間找娛樂片確實是個選擇囉!


  --'
