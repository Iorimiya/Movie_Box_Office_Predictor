url: https://www.ptt.cc/bbs/movie/M.1675250161.A.927.html
title: '[好雷] 娛樂為王《玩命特攻：武演行動》'
content: '娛樂為王《玩命特攻：武演行動》


  圖文好讀：


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  如果問我最喜歡的導演是誰，蓋瑞奇永遠是會是榜上有名的那位，作為一部娛樂性質為主

  軸的年節動作片，《玩命特攻：武演行動》可以用四個字總結－爽就完事。



  【114分鐘的娛樂饗宴】


  《玩命特攻：武演行動》的劇情特別簡單，國家想追查高機密性的高殺傷性武器，這時你

  腦海裡肯定會閃過幾個適合的人選，連恩尼遜、湯姆克魯斯、當然還有本片主角傑森史塔

  森。


  對，《玩命特攻：武演行動》的劇情就是這麼單純，傑森史塔森領著幾個小特務給美國政

  府出任務，你可以想像傑森史坦森那一貫的狠勁、難以控制的派頭、總是失控的情況以及

  永遠不缺的爆破場面和帥氣的收尾。


  你要說整部片有什麼大道理嗎？完全沒有。蓋瑞奇毫不掩蓋自己想拍部B級爽片的決心，

  從頭到尾不跟你講什麼大道理，背後沒有什麼動人的故事，子彈跟炸藥像不要錢的撒，能

  炸直升機絕不炸小飛機，能發一打便當絕不會只發一手啤酒，儘管把腦子放空，享受整場

  蓋瑞奇標誌性的快節奏轉場與傑森史塔森的俐落身手，順便抽空欣賞一下休葛蘭的角色魅

  力，度過兩個小時就是那麼輕鬆舒暢。



  【最佳搭檔，從不失望】


  對我自己來說，有些人只要一合作，成果幾乎很少令人失望，譬如凱文哈特與巨石強森，

  又或是傑森史塔森與蓋瑞奇，《玩命特攻：武演行動》是兩人的五度合作，同時也是蓋瑞

  奇與休葛蘭的第三次合作。


  蓋瑞奇還是那個蓋瑞奇，《玩命特攻：武演行動》收斂了一些蓋瑞奇的特色，多線劇情的

  發展方式在《玩命特攻：武演行動》幾乎看不到，但標誌性的緊湊風格一點不少，男性間

  的唇槍舌戰也是毫不遜色，即便我們在這次較沒辦法見識休葛蘭與傑森史塔森的交鋒，但

  兩人各自展現了令人印象深刻的表演，英國導演非常擅長將男性間的粗鄙與紳士交疊出微

  妙的平衡，上一秒還在互相嘴砲，下一秒就槍林彈雨。



  【令人滿意的選角】


  除了老朋友傑森史塔森與休葛蘭外，這次電影最令我訝異的是女主角奧布瑞普拉薩的表現

  ，我只能說，蓋瑞奇終於找一位適合他風格的女性。


  老實說蓋瑞奇的作品很多時候會放大男性的粗鄙與豪邁特質，以及加上些許的厭世，這些

  特色較少有女性能駕馭有佳，但奧布瑞普拉薩的表現出乎意料，葷段子張口就來，與傑森

  史塔森的對戲也能懟的光頭壯漢一臉厭世，尤其聰明的將兩人分開，讓觀眾盡情欣賞傑森

  史塔森開槍的同時，也不會遺漏奧布瑞普拉薩與休葛蘭的出色對戲，偶爾傻妞一下，更加

  提升了她的討喜程度，數段嘴唇特寫更保留了女性的性感元素，有別於過去在這類作品中

  女性的要強與或是傻妞形象，可說是動靜得宜，完全開闢了一片屬於她發揮舞台。



  作為一部動作爽片，《玩命特攻：武演行動》給了你最好的娛樂體驗，整部作品像是抽掉

  了預言與故事性的《子彈列車》，但塞進了更多的子彈與髒話，在你還在為上一刻的笑點

  回味時，立刻抓著你進入下一幕爆破硝煙，可說是娛樂爽片的最佳表現，滿滿的蓋瑞奇風

  格幽默爽片，絕對是你放鬆心情的最佳選擇。


  --'
