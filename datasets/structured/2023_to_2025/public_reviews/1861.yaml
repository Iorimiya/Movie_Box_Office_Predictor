url: https://www.ptt.cc/bbs/movie/M.1674124839.A.C4B.html
title: '[普雷] 玩命特攻：武演行動'
content: '(防雷)





















  原本看之前IMDB只有6.7不太相信


  想說蓋瑞奇+傑森史塔森怎樣都不該是這個分數


  但看完後心得........「6.7真的完全正確」





  因此派了大富豪最愛的大明星去情報


  然後解救世界的故事


  整部片大概就是低配版的不可能任務+紳士密令


  尤其前隊雙重小隊的互相互雷


  以及完成任務後交接行李箱的片段


  紳士密令味道超重的




  優點：


  1.女主超正


  2.一開始雙重小隊蠻有趣的，後面整個拉垮


  3.片尾超級亮點



  缺點：


  推測應該是烏俄戰爭因素，


  反派跟烏克蘭人的設定被弄得很卡


  整部片節奏詭異，


  中間打鬥跟槍戰以及飛車還算精彩


  但是最後反派設定缺乏說服力


  很多地方以為在鋪陳埋梗，


  但其實最後什麼也都沒有發生



  簡單來講就是一部你不會說難看，


  但是也不會覺得有多好看的電影


  大概就是過年期間無聊可以去電影院看一下


  或者直接等串流或電視，


  但沒必要特地去看的程度






  --'
