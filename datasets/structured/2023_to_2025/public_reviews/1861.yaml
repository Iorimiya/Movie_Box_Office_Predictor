url: https://www.ptt.cc/bbs/movie/M.1706885937.A.2AE.html
title: '[討論] 玩命特攻武演行動票房為啥不好？'
content: 'HBO剛剛播映完畢

  我之前也進電影院看

  這部上映前改了幾次中文片名

  記得有叫五眼聯盟五眼特攻的

  但應該是也頂多台北（台灣）票房不好


  這部蓋瑞奇導演的

  呈現一貫流暢風格

  劇本雖然不是什麼史詩神作

  但跟玩命關頭後來劇情比

  整體合理性強多了

  要求高薪高福利的特別情報員

  受歡迎但有點膽怯的偶像演員

  販賣戰爭又資助戰爭孤兒的億萬富翁

  角色特點形象也都做的不錯


  我在戲院看完

  是滿喜歡這樣流暢風格動作片

  但我剛看完查全球票房也才4910萬鎂

  總預算就宣稱五千萬了

  這樣打平代表是賠錢

  也就沒有續集

  蜂刑者也沒啥劇情

  目前全球票房似乎不差已經突破一億鎂

  所以是真的大家覺得不好看嘛？


  -----

  Sent from JPTT on my Xiaomi 22111317G.


  --'
