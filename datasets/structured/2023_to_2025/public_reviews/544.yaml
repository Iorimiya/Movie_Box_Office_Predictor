url: https://www.ptt.cc/bbs/movie/M.1330944822.A.A92.html
title: '[好雷]女人的宿命──嘆伊朗電影《生命的圓圈》'
content: '網誌：


  標題：女人的宿命──嘆伊朗電影《生命的圓圈》


  內文：



  自從伊朗大導演阿巴斯以極其質樸的影像風靡世界影壇後，


  我們逐漸有機會觀賞到其他伊朗導演所拍攝的電影，


  進一步了解伊朗獨特的社會文化，從而認識其人民內在的心靈。



  曾任阿巴斯副導的賈法‧潘納希，


  其《生命的圓圈》（THE CIRCLE）榮獲2000年威尼斯影展金獅獎最佳影片，


  打破了伊朗電影向來以兒童題材見長的刻板印象，轉而探究弱勢婦女所遭遇的困境，


  這樣的內容以及簡樸的拍攝手法，令人耳目一新，


  訝異於「樸素」竟可以如此之感人，


  同時也讓我們為片中擺脫不了男性沙文主義的欺凌，找不到天堂的女性們，而深深喟嘆。


  可惜的是，本片在臺灣上映時，竟也備受冷落，


  結果只好草草下片，不免讓人為臺灣藝術電影市場的萎縮而憂心。



  《生命的圓圈》一連串的小故事所呈現的女性困境，


  有些是我們似曾相識的，更多則教人匪夷所思，


  不禁會想：伊朗的女人實在太可憐了！


  一位孕婦產下女嬰（原本照超音波顯示為男生），娘家的外祖母不肯相信，


  一再地向護士查詢，確認為女嬰之後，


  外祖母絕望地喃喃自語：「婆家的人一定氣壞了，怎麼辦？」


  這樣的女嬰註定得不到祝福。



  另一個單親媽媽，為了讓年幼的女兒被有錢人家認養，有個美好的「未來」，


  竟三番兩次地忍痛將女兒棄置街頭，怎不令人心酸！


  偏偏她又再一次地遭受失敗，還差點成了警方取締的流鶯。



  還有，未婚懷孕的女逃犯，為了墮胎，卻因女友怕惹禍上身，不敢伸出援手，


  加以醫院嚴格執行墮胎的規定，沒有丈夫陪同或雙方家長同意，


  根本不可能有醫生會答應做這樣的手術。


  更慘的是，她又被家人趕出來，不被接納。


  走投無門的她，天黑後，由於沒有男人作陪，連投宿旅館都難如登天。



  兩個甫出獄的女子，為了找尋嚮往的女性天堂，千辛萬苦，四處籌錢，


  好不容易籌到旅費了，其中一位卻又怕再一次面對希望的幻滅而臨時退縮。


  較年輕的一位仍照原訂計劃回去


  如同梵谷油畫般的家鄉（恐怕也只是生命圓圈外的一個幻影），


  但她在購買長途巴士車票時就遇到困難了，


  因為按伊朗法律，女子不准單獨搭車，


  除非有學生證。


  經過她苦苦懇求才買到了車票。


  等她買妥送給故鄉男友的禮物，


  搭車前，突然發現有軍警逐一盤查乘客，嚇得她落荒而逃！



  片中一位阻街流鶯被送上囚車，她想抽煙解悶，立刻被員警制止，


  然而才不久，囚車上的男人們就開始抽起煙來，


  這個「不甘心」的流鶯終於有了抽煙的機會。



  此外，進到醫院，女人一律須披上頭巾遮臉，否則將會被拒絕探訪，


  伊朗社會這種保守的程度，我們實在無法想像。




  《生命的圓圈》強烈展現編導對於女性與社會議題的關切，


  以及對電影藝術的追求，


  絕不為了媚俗而去討好觀眾。


  到了最後，這些在男人操控的社會裡跌跌撞撞的女子，


  又都回到陰暗、沉悶的監牢，而她們這時也更加沉默無語了，


  似乎是在表達內心深沉的抗議吧！


  透過賈法‧潘納希的逼視，


  我們可以清楚感受到片中弱勢女子所承受的社會壓力，


  難道這是回教世界身為女人的宿命？


  要到哪一天，她們才能夠走出生命的圓圈，


  擺脫社會加在身上的諸多不合理的束縛呢？※



  --


  春衫猶是

  小蠻針線

  曾濕西湖雨




  --

  ◆ From: 125.225.133.7'
