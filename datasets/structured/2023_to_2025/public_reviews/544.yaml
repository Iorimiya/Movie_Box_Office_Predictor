title: '[普雷] 圓圈 (荻上直子導演)'
content: '在台中廣三sogo百貨的王牌映画看的

  好像是日本品牌的連鎖電影院

  整個影城還有員工訓練都像在日本看電影

  影廳也很有日本味，跟台式跟美式風格很不一樣


  從海鷗食堂後就一直很喜歡荻上直子

  但感覺海鷗食堂是她人生影史的巔峰

  就像海角是魏導人生的巔峰之作一樣


  最近補看了荻上一大堆片

  從樂活俱樂部、日式廁所、吉貓出租

  當他們認真編織時、河畔小日子、波紋

  其他的吉野理髮之家跟戀上五七五找不到


  她說圓圈是她人生第十部作品

  從2004年開始拍了20年的電影人生

  這次預算比較多，就要求用底片來拍


  這片跟當他們認真編織時都是比較嚴肅的風格

  可以看出日本現在的情況感覺跟香港差不多

  看出20年前後經濟情況國力的差別


  這片在講堂本剛是美術系畢業的

  在美術大師門下當助理幹了四年

  在大師手下當工匠領著微薄的薪水

  他的學弟妹們都在抱怨薪水少被剝削

  都很為他打抱不平能在這裡待四年

  去便利商店打工可能還賺的多一點

  但因為都念到研究所所以拉不下臉


  一天被學妹抱怨訴苦後回家就出了車禍

  手斷了包了石膏，就被大師開除了

  他回到租屋處後開始煩惱生計

  就打開畫紙看到一隻螞蟻

  就拿刷子畫了一個圓圈圈住那隻螞蟻

  一連畫了好幾個圈，就順手拿去藝品店賣


  藝品店收了請他簽個名如果有人買

  再給他酬勞，沒多久就有畫商找上門來

  說希望他再多畫幾張圓，願意出100萬買


  他一頭霧水，結果走在街上看到一間畫廊

  門口展出他的圓，他下了一跳，但畫廊沒開

  再次經過時畫廊開了，但圓已經不見了

  他進畫廊問圓跑那去時，老闆娘說被買走了

  現在在現代美術館展出，賣了250萬


  他說他是圓的作者，老闆娘不信

  他拿出畫商的名片，老闆娘馬上請他進貴賓室

  原來藝廊跟名牌店一樣都有這種富麗堂皇的貴賓室

  老闆娘是海鷗食堂的老闆娘小林聰美演的

  造型打扮得像伊丹十三的老婆宮本信子一樣


  跟他說這畫現在突然大紅，價格還在持續漲

  就給了他訂金，又去藝品店也給了他三萬

  他之前因為失業先去便利商店打工

  店長是個緬甸僑生，在日本當移工努力打拼

  因為口音常被日本客人笑要好好學日語


  堂本隔壁住了一個怪房客綾野剛

  是個漫畫家，但畫的漫畫不被採納

  所以也跟堂本住在鐵皮屋工寮的租屋處

  他們這代共同的夢想就是想吃頓昂貴的壽司

  但薪水付完開銷可能連壽司郎都吃不起吧

  每天可能有一頓沒一頓只能自己煮不外食


  當大家知道他畫了個圓就大紅了之後

  每個人都來找他畫圓想藉此脫貧轉富

  但他貧窮的鄙視態度也不一樣了

  同學嫌他在便利商店打工沒出息

  看他紅了就想來當他的經紀人

  女學生也跑來便利商店找他合照

  房東也請他畫個圓因為家裡有人罹癌需要錢

  隔壁鄰居更是到處假冒圓是他畫的，到處畫圓

  開除他的大師更說他的畫都是他教的


  最後畫商跟畫廊老闆娘幫他辦了個畫展

  但她的學妹帶人來砸場，控訴社會不公平

  但他的畫，不管怎麼亂畫一通還是紅到法國去

  甚至還在畫上用拳頭打破一個大洞照紅不誤


  他也因此財富自由的搬去鄉下當閒雲野鶴

  不用在都市為五斗米打拼可以靠畫圓發財

  這一切可能都因為碰到了一個神祕的老人


  他手斷後去池塘看魚，旁邊做一個老人柄本明

  我現在只要有他的演的戲都會想看

  他現在好像在電影圈資歷很高的樣子

  連安藤櫻都是他媳婦，還紅到去拍法國片

  以前都看他在跟志村演爆笑短劇

  沒想到變日本電影國寶


  堂本跟他一起餵魚

  然後就坐大轎車走了

  沒多久他的畫就被人買了

  然後大紅大紫，大概跟他有關吧

  可能他派人買了他的畫再把他給炒熱了

  所以所有的藝術品都需要政商界的人幫推

  才能大紅大紫，電影大概也是一樣


  這片讓我看到他們這代導演的心態

  像鍾孟宏、楊德昌、荻上、是枝裕和、侯孝賢等

  他們這些藝術導演應該都是不太賺錢的一部部拍

  都像隔壁那個漫畫家一樣過得很苦想吃壽司

  只希望有一天能像堂本一樣畫個圓就發大財

  不會像漫畫家一樣漫畫那麼厲害還窮得要死


  堂本剛感覺應該是他10部片裡面最有錢的偶像

  所以這片預算才比較高一點，就是堂本剛出錢

  他身兼偶像劇演員歌手綜藝節目主持人跟偶像

  步入中年胖成這樣，已經很久沒見過他了

  大概砸了一筆錢想進國際影壇

  片尾還放他的唱的歌，那就很明顯了


  但這片跟海鷗比真是差強人意

  應該算是我認為最差的作品

  第二差的是當他們認真編織時

  主要是他擅長的喜劇風格消失了

  大家就想去看他平淡幽默的喜劇


  就像他說大家看堂本就是想看他的圓

  每個作家都有他的風格，畫別的就沒人想看了

  感覺他拍這片好像要退休改行的感覺

  他們這些大概都希望像卡麥隆一樣

  導一部鐵達尼跟阿凡達就能退休10年都不拍片吧

  當導演真的蠻辛苦的，尤其像荻上導演像魏導一樣

  拍了海角跟海鷗就大賣後就拍個沒完，但應該都

  沒有像海角跟海鷗一樣畫個圓圈就再次大賣了


  上一部的波紋還有點荻上的喜劇風格

  所以才會想花250買票去看這部首輪

  他的演員也越來越大咖，可能他常去柏林吧

  威尼斯捧紅了北野武、柏林捧紅了荻上

  演員都希望演他的片去拿柏林影帝影后


  以往都是以女性觀點來敘事

  最近幾部片都以男性的觀點來拍

  看來他的片還是以女人當主角的片會比較好看一點


  還有荻上的造型蠻像陸弈靜的

  不知道陸弈靜未來會不會也

  演而優則導跑去當國片導演

  看面相很期待陸弈靜也能出來當導演


  --'
