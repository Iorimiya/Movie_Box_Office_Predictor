url: https://www.ptt.cc/bbs/movie/M.1713764641.A.5EB.html
title: '[好雷] 12.12：首爾之春觀看心得'
content: '最近看到韓國百想藝術大賞

  很多入圍的電影都實至名歸

  但我最喜歡的還是首爾之春

  劇情的節奏很緊湊 讓人身在其中

  加上演員都是熟悉的面孔

  平時不愛看政治、歷史片的家人

  也能直接從頭到尾看完整部電影


  最精彩的地方還是雙十二政變

  路上都是軍人跟裝甲車還有一堆路障

  那個畫面很壯觀 感覺下秒就要開打了

  接著就是一堆人打電話、吵架、交戰

  讓整部劇處於很慌張、混亂的局勢


  最後如果滿分是10分的話

  我給這部片9.2分

  節奏很剛好 配樂也配得不錯

  演員的演技讓整部劇錦上添花

  很適合在歷史課的時候給學生看


  也想問一下大家還有沒有推薦的韓影


  --'
