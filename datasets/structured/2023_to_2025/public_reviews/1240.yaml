url: https://www.ptt.cc/bbs/movie/M.1703003665.A.781.html
title: '[新聞] 《首爾之春》賣破21億奪冠！黃晸珉壞到'
content: "《首爾之春》賣破21億奪冠！黃晸珉壞到犯眾怒　戲院搬這台供洩憤\n\n【記者陳薇安／綜合報導】\n\n集結黃晸珉、李星民、鄭雨盛3大影帝的新片《12.12：首爾之春》，11月22日在韓上映後\n\
  討論度爆表，蟬聯25天票房冠軍，累積849.5萬觀影人次，熱賣820億韓元（約21.4億元台\n幣），登基年度票房亞軍，突破千萬觀影大關指日可待。\n\n黃晸珉演活被權利蒙蔽的韓國前總統全斗煥，不僅每次要花4小時梳化套禿頭假髮，鼻翼\n\
  也黏上矽膠刻意變寬，精湛演技讓觀眾氣得牙癢癢，就連鄭雨盛也讚嘆：「真的看起來很\n討厭！」\n\n\n\n黃晸珉（左圖）在《12.12：首爾之春》扮演前總統全斗煥，壞到令人髮指，戲特地院準\n\
  備打地鼠機讓觀眾洩憤。翻攝Plus M、論壇\n\n改編自韓國史實「雙十二政變」的《12.12：首爾之春》斥資270億韓元（約7.1億元台幣\n）製作，由《阿修羅：正邪頑殺》導演金性洙執導。\n\
  \n劇情描述1979年10月26日總統朴正熙遇刺事件後，首爾迎來新氣象，但黃晸珉飾演的保安\n司令官「全斗光」，不滿李星民所飾的陸軍參謀總長「鄭相鎬」，號召軍隊私人組織「壹\n\
  心會」強行擄人，不惜動員各方部隊在12月12日發起政變。\n\n鄭雨盛詮釋首都警備司令官「李泰信」，帶領非壹心會的部隊對抗全斗光，兩大勢力在首\n爾交戰，9個小時的對峙一觸即發。\n\
  \n\n\n首爾的電影院搬來打地鼠機，讓看完《12.12：首爾之春》太入戲的影迷紓壓。翻攝論壇\n\n黃晸珉把角色原型—前總統全斗煥野心勃勃、目中無人的個性演得絲絲入扣，為了自己的\n\
  慾望，慫恿各個軍隊發動武裝政變，利慾薰心的模樣讓觀眾看了超怒。\n\n黃晸珉跑戲院映後打招呼第一句話就是先說「對不起」滅火，首爾COEX的電影院MegaBox\n\
  還搬來打地鼠機器供影迷洩憤，逗趣寫下：「太入戲積壓，請免費打完再離開！！」令人\n會心一笑。\n\n\n\n黃晸珉演活以全斗煥為原型的保安司令官，不只帶禿頭假髮，還鼻翼刻意加寬。翻攝Plus\n\
  \ M\n\n鄭雨盛的原型是前陸軍少將張泰  ，繼《阿修羅：正邪頑殺》後，2度與黃晸珉合作，直\n呼他的禿頭「太犯規」。\n\n鄭雨盛接受韓媒訪問時表示：「當我看到黃晸珉以『全斗光』的模樣出現時，真的看起來\n\
  很討厭，也很不想面對他強烈的氣勢。」\n\n形容黃晸珉的演技如火般炙熱，自己得化為水才不會被燒死。\n\n鄭雨盛片中髮型白髮蒼蒼，他表示平時不太長白髮，但拍攝後期壓力大到突然冒出白髮，\n\
  笑說：「這就是金性洙導演的力量啊！」\n\n\n\n鄭雨盛（中）片中是正義的化身，刻意挑染白髮，他開玩笑說導演給的壓力太大，拍攝後\n期自然冒出白髮。車庫娛樂提供\n\
  \n該片卡司陣容堅強，除了3大影帝同台，還有《請回答1988》金成均、《夫婦的世界》朴\n海俊、《屍速列車》金義聖等人演出。\n\n多次扮演軍人的丁海寅曾說演完《D.P：逃兵追緝令》不想再穿軍服，但他還是義不容辭\n\
  演出，客串特戰司令官專屬副官少校「吳振浩」，《犯罪都市3》反派李浚赫飾演陸軍參\n謀總長的護衛軍官「權中尉」，2人片中搏命保護自己長官的模樣，令觀眾動容。\n\n\
  《12.12：首爾之春》已在台上映。\n\n\n\n丁海寅再度穿上軍服，客串忠心的特戰司令官專屬副官。車庫娛樂提供\n\n新聞網址：\n\n\n\n\n\n昨晚剛看完，真的蠻精彩的，個人覺得應該是今年最好看的韓國片。\n\
  \n\n\n\n\n--\n未看先猜某人回：韓國電影不推吧"
