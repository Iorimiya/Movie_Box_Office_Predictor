url: https://www.ptt.cc/bbs/movie/M.1708780082.A.04D.html
title: '[請益] 「首爾之春」相關電影的觀看順序？'
content: '最近看了首爾之春，真是有夠好看。後來爬推文才知道：


  1.南山的部長們


  2.首爾之春


  3.華麗的假期


  4.我只是個計程車司機


  5.獵首密令


  以上好像是相關電影，所以想請問


  這五部依照事件發展時間的觀看順序應該是？


  謝謝。



  ================以下有雷騙P幣===============




  其實更早就有聽聞「南山的部長們」不錯，


  但第一次看只看了10分鐘覺得看不懂又無聊就關掉了；


  後來才知道原來是首爾之春的前傳，於是看了第二次


  天啊！原來演到最後接首爾之春開頭是那麼的天衣無縫


  我懂了為什麼總統會被殺身亡、


  我懂了為什麼中情部部長會被刑求逼供"是為了奪權才政變"


  懂了為什麼參謀總長在這次事件是無辜的


  有補完前傳真是太值得了!


  希望還沒看的其他幾部也能一樣好看~~


  --

  非常感謝! 沒有板友們的推文討論我根本不會知道

  推  02/24 21:13

  嗯嗯 我還是改一下好了

  →  02/24 21:13

  好期待! 似乎先補完3(看過4也好看)再接著看會更順

  推  02/24 21:18

  看到那邊的時候我超想砸電視阿幹

  推  02/24 21:48

  看來那張圖片就是詳解!太厲害了~ 以我提的那五部順序應該是：


  1 → 2 → 3 = 4 → 5


  剩下還有13部^^" 看海報好像有些有看過


  但連海報都沒印象的只能以圖搜圖去找片名了@@

  推  02/24 21:58

  沒錯! 感覺這事件影響韓國很深遠

  名字有聽過但忘記有沒看過了> < 無論如何都得複習

  →  02/24 22:17

  感謝!! 第一張圖的"支持者"，跟第二張圖的"法律顧問"&"閃避"

  忘記台灣翻成什麼片名了QQ

  推  02/24 22:27

  與您和上面的Kai大一樣，

  但很神奇的看完首爾之春後第二次就看的下去了

  自問自答 找了一下原來"支持者"就是「王者製造」

  它居然是史實!!!

  "法律顧問"是「正義辯護人」

  "閃避"是「金權性內幕」竟然也是真的...

  所以主角最後到底有沒有當選阿?! (這部也很好看)'
