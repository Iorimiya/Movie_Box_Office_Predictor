url: https://www.ptt.cc/bbs/movie/M.1708837585.A.F0D.html
title: '[請益] 關於首爾之春首都警備司令官的問題'
content: '相信大家看完這部片都會對主角之一的首都警備司令官李泰臣印象深刻，似乎真實人物的

  評價也很受到推崇。


  但我看完反而有一個疑問，在全斗煥之前的朴正熙也是政變的軍事獨裁政權不是嗎？那那

  李泰臣也是這個不義政權的一分子啊，甚至還是高階軍官，但為什麼大家對他的評價這麼

  高，甚至電影還把他形塑成國家英雄呢？


  對於韓國的歷史只有幾堂通識課等級的基本了解，想請問有沒有熟悉韓國歷史跟社會的大

  大可以給予解答，非常感謝～


  --'
