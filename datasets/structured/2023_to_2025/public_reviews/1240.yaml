url: https://www.ptt.cc/bbs/movie/M.1708784618.A.4C3.html
title: 'Re: [請益] 「首爾之春」相關電影的觀看順序？'
content: '自己看過電影的時間排序:


  1.王者製造

  薛景求飾演的主角金澐範，是改編自金大中(韓國民主化之後的民選總統)

  從1960年代朴正熙專政時代，參加民主選舉


  2.南山的部長們

  改編自1979年10月26日，中央情報部部長-金載圭刺殺總統朴正熙事件

  李炳憲飾演部長金載圭，李聖旻飾演總統朴正熙，金珉賞飾演參謀總長鄭昇和，

  徐賢宇飾演全斗煥


  3.12.12:首爾之春

  改編自1979年12月12日，全斗煥發動軍事政變，綁架參謀總長鄭昇和

  黃晸珉飾演全斗煥，李聖旻飾演鄭昇和，鄭雨盛飾演首都警備司令


  4.華麗的假期

  講述1980年光州事件，一對兄弟在政府鎮壓時的遭遇

  安聖基在此片中飾演一位退伍上校


  5.薄荷糖

  薛景求飾演一位在1980年光州事件開槍誤殺女子的阿兵哥，從此走上殘暴毀滅的人生


  6.我只是個計程車司機

  宋康昊飾演一位在1980年光州事件載著外國記者，深入光州採訪的計程車司機


  7.正義辯護人

  宋康昊飾演一位在1981年釜林事件為學生辯護的律師，原型是已故韓國總統盧武鉉

  片尾最後有帶到1987年的韓國民主化運動


  8.1987:黎明到來的那一天

  描述1987年1月韓國大學生朴鍾哲被警察刑求至死，在檢察官及許多記者努力下，

  揭開真相，引發1987年韓國六月民主運動

  河正宇在片中飾演有正義感的檢察官，薛景求在片中客串反對黨領袖


  --'
