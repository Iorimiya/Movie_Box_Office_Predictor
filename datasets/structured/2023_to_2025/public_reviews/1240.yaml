url: https://www.ptt.cc/bbs/movie/M.1702818078.A.946.html
title: '[好雷]  首爾之春'
content: "雷文防雷資訊頁\n\n\n\n\n\n想到哪邊打到哪邊，有脫落錯誤還請指教。\n\n\n\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n   \
  \ 就算不懂這個事件的人應該也能融入到電影，並且把這個事件完整的講完，真不錯\n全斗光(史實的全斗煥)的演員黃晸玟演的有張力，而鄭雨盛的角色李泰信(史實的張泰玩\n\
  ，因為最後一字的\"王完\"打不出來所以改用玩字)則是有點太帥了，但演技上絲毫不落下\n風，並且在軍事調動上配合地圖和動畫也讓觀眾比較容易了解首爾周圍動向。\n\
  \n    時間點接在電影南山的部長後，但不影響理解劇情，如果有看過電視劇第五共和國\n的人會得到更多的樂趣，但也不影響觀影，只是翻譯關於一心會的翻譯用了壹會，不知何\n\
  解?中文圈比較常見的是一心會。\n\n    片尾提到了參與政變的一心會成員升官發財，卻沒有提到確實忠於國家的參謀總長和\n首警司司令的後續，尤其後者可能是怕觀眾看了會更難過吧。\n\
  \n    想知道更多相關背景的資料，除了上述電影:南山的部長們和電視劇:第五共和國外，\nYTER胃酸人也做了相關的解說影片可以參考。\n\n    有心報國，無力回天，這是我看到最後的想法。\n\
  \n~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\
  \n\n\n\n--"
