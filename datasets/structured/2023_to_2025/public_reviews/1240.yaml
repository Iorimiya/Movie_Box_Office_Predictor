url: https://www.ptt.cc/bbs/movie/M.1702652202.A.9E2.html
title: '[好雷]首爾之春 真的有如臨現場的感覺！！大推'
content: '雷文防雷資訊頁




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這部在韓國票房爆炸好

  一來是電影拍的是韓國人很熟悉的名人和事件

  二是導演有想把故事拍得好看、演員也決心要把角色演好

  單純從電影角度看也是非常棒的作品！


  電影裡角色清一色是軍人

  很多男星身上都帶著至少一部人生作品而來

  眾星拱著太陽和月亮：黃晸珉和鄭雨盛

  黃晸珉演全斗光，原型是非常有爭議的前總統全斗煥

  鄭雨盛飾演的李泰信，原型也是真有其人


  黃晸珉在裡頭的能量真的超強

  兩段在廁所中的戲，還有像是摸自己光頭等小設計

  表現出猖狂、聰明、陰險、自信的形象

  讓觀眾厭惡又挪不開眼，看一看真的很怕帥哥鄭雨盛會被吞掉


  還好，雨盛也真的很適合演這種正氣凜然的角色

  角色冷靜又有決斷力，讓觀眾相信如果他不只是首都警備司令官

  而是副參謀長或國防部長，局勢就不會變成我們知道的那樣


  也幸好，結尾並沒有打煽情牌

  適可而止的畫下一個乾脆俐落的句點

  成就我心目中今年最好的韓片！


  建議看之前可稍微了解一下背景，更能投入劇情

  故事基本上就是韓國總統遇刺身亡後

  負責調查此案而且在軍中人脈可觀的黃晸珉

  無法接受將被調職架空的命運

  於是一不做二不休直接綁架戒嚴司令官(李星民)發起軍事政變

  而鄭雨盛是整個事件中唯一”有效”抵抗叛軍的角色


  前面有網友提到的最後一幕我個人也很喜歡

  一一定格說明這群叛變者後來的職位

  雖然是高升，卻拍的像判刑，一切的控訴就在不言中


  在當下也許是「成者為王，敗者為寇」，但後世會有自己的判斷


  很久沒有這種演技、節奏都很精彩的好片了

  認真推一個！！！



  --'
