url: https://www.ptt.cc/bbs/movie/M.1709199817.A.22C.html
title: '[好雷] 南山的部長們+首爾之春 兩部曲真是精采 '
content: '昨天放假剛好看到Hami video上線評價不錯的"首爾之春"


  感覺韓國拍這種歷史片真的非常精采 除去劇情本身外 演員真的很強


  之前"南山的部長們"就非常精彩


  將金規泙從原本忠心耿耿 到中後段內心掙扎 政治角力 最後一口氣爆發


  揣摩的相當細膩 不只是讓這個人單純的忠奸善惡而已


  整個局勢氛圍 還有李秉憲的演技都極說服我


  首爾之春更是緊湊 幾乎整部沒什麼喘息的空間


  黃政閔的演技不用說 依舊是整部亮點


  鄭雨盛也絲毫不落下風 之前就看過他與李政宰飆戲的"獵首密令"


  完全不是當初"腦海中的橡皮擦"的模樣


  個人相當推薦這兩部可以一起看 把在1979年改變南韓的幾個重大事件


  赤裸裸的直接演出 相當過癮


  看完若有興趣 可以接"1987黎明來臨的那一天"當成三部曲結尾來看


  比較不會那麼鬱悶


  當然像"北風" "密探" "我只是個計程車司機"也很精采


  可是個人還是更愛這種直接以歷史主角為背景的歷史片


  推薦給喜歡看歷史大事件的板友們


  --'
