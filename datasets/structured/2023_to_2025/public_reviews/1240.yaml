content: '電影院沒看到就在Friday 上面看


  真的是拍得相當緊湊又刺激，讓人一直期待什麼時候會有逆轉，可惜基於現實改編，

  很多事情就這樣結束成定局，看到一堆老中青三代戲骨輪流飆戲也已經很過癮，

  導演把1212政變加上了自己的一些詮釋後變得一個更加完整的故事

  看到一堆拖油瓶不做事只搞事真的氣到不行，真的會很難再看第二次的片



  最後上網查了一下後續真是不勝唏噓

  全斗煥也沒有收到什麼嚴厲的懲罰還能活到90幾歲

  真的是QQ


  --'
