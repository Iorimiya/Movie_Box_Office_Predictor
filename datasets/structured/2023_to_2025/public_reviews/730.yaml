title: '[普雷]《為我辦一場西式的喪禮》我想見你'
content: '來不及說的我全都記得，屬於你我的告別式


  人生總是世事難料，有些驚喜來得突然，有些傷悲也突如其來，甚至讓人難以承受。沒有

  人生活總能順遂，一些遭遇可能迫使讓人想逃避，也讓我們不得不一夜長大。


  其中人有悲歡離合，在遇到家人或重要之人的離世和離開，往往是最讓人苦悶之事，並隨

  著年紀增長後，這樣的離別似乎只會越來越多，往後的人生有個認識或曾經一起笑的人從

  此缺席，那被留下的人又該如何是好？


  《為我辦一場西式的喪禮》，探討青少年面對生死離別的議題。學生賴健祐最好的朋友釘

  仔跳海了，但他卻看見釘仔好端端在他面前跟他比手語，賴健祐無法理解釘仔為什麼跟著

  他？為什麼不說話？是不是鬼？他只知道因為只有他看得見，他被其他人當成神經病。但

  越來越了解釘仔的事，賴健祐也在想釘仔是不是有什麼事想告訴他？







  《為我辦一場西式的喪禮》是什麼電影：


  2011年日本動畫《我們仍未知道那天所看見的花名。》（簡稱：未聞花名），以五位青梅

  竹馬在童年發生朋友死去的憾事，而在多年後重聚，主角仁太因為當時的打擊而避不出戶

  ，但很奇特的是只有他看見當時意外死去芽衣子的幽靈。


  除了描繪對於青少年的內心世界外，不同朋友在面對與死者告別的想法，和彼此之間的關

  係，都讓這部動畫受到許多人討論與熱議。動畫片尾曲也是重新翻唱於日本女子團體ZONE

  ，在2001年的經典歌曲《secret base～君がくれたもの～》，也有著濃厚的復古風情。


  在這個與死者道別，甚至當過去認識的好友與親人從此退出舞台，難免有著讓人感傷與不

  捨。而有時候被留下來的人，該如何排解這個熟識的身影不在的事實，也是一種在持續往

  前人生的練習題，而且是完全無法習慣的越來越沉重的作業。2020年，知名華語歌手萬芳

  歌曲《阿峰今天沒有來》歌詞唱到「阿峰再也不會來，我們如何，承受誰的離開？」歌曲

  敘述著，或許一開始的見面，我們就學著如何道別彼此的離開，分手需要練習，尤其當另

  一個人謝幕下台。







  與死者告別的議題一直以來都沉重，隨著年紀變大可能越來越接觸到這樣的議題，但有些

  人卻因為一些憾事，而提早學著面對生活中那熟悉身影的消逝。《為我辦一場西式的喪禮

  》描繪著青少年第一次從出生時面對到重要人的死亡，探討著青少年的心境那些往往被忽

  略的心理變化。釘仔跳海生死未卜的事情，讓賴健祐在意，但釘仔人卻不斷的出現在自己

  身邊，並用手語述說他的心事，這讓賴健祐很不能適應，但也喜歡自己的好友一直在自己

  身邊。


  但隨著時間一天天過，賴健祐好像開始看見自己不了解的釘仔，包含釘仔跟誰說過的秘密

  、與釘仔的家庭、甚至釘仔跳海的原因。越來越知道這些事情，都讓賴健祐害怕釘仔某天

  突然消失。而他也越來越想知道釘仔為何用手語跟他比劃出那句：「為我辦一場西式的喪

  禮」，背後的原因。












  《為我辦一場西式的喪禮》分析與延伸：


  《為我辦一場西式喪禮》電影改編游善鈞編寫的同名小說，小說以第一人稱敘述賴健祐面

  對釘仔離世與只有自己所看得見的釘仔。這部小說改編劇本，也獲得第 43 屆優良電影劇

  本獎首獎。與原作小說不同，電影加入了許多寓意的畫面與圖像，補足與文字不同的想像

  和更多的想像空間，其中不同於原作定義的「同志」電影的表現，反而更著重在一個親密

  身邊人的離開，作為一個還沒成熟的孩子，該如何看待死亡這點。


  衛福部在2024年，公布2023年最新國人十大死因，其中青少年自殺死亡率有逐年攀升的趨

  勢，雖然這個趨勢有逐步趨緩，但從2017年到2024年，青少年自殺率還是上升了3％。


  這其中跟手機與網路的普及有關係，各種焦慮與比較，甚至社群媒體的使用，有時候造成

  的壓力與過曝，世界並不如你想像那樣，對於不知如何適應壓力和情緒出口，很容易讓青

  少年的心理健康造成問題，甚至如果只將青少年心理問題丟於政府和學校，所得到的幫助

  其實是有限的，而最主要的還是對於當遇到低潮、憂鬱等問題，青少年本身要懂得尋求幫

  助，或自我調適。







  「我要讓他們後悔一輩子。」在青少年自殺之中，有很多狀況是一種報復心理，而根據輔

  導人員表示，這樣的狀況其實更能顯示出青少年除了偏激的手段之外，以他目前年紀和想

  法無法應付自身的狀況。


  有時候許多自殺的人外表與作息是看不出來的，就像憂鬱症患者，有時候狀況並不會顯現

  在外在上，往往很多自殺心理是累積出來的，甚至急於找尋一種「解脫」，並認為自身毫

  無價值，故用極端的方式讓人後悔，是一種最後的手段。


  而《為我辦一場西式的喪禮》則是回到在逝去之後，被留下來的人。在同樣也是未成年或

  年輕人間，但在自身生活中或陪伴裡突然缺席的人，該如何面對，這樣的狀況不亞於自殺

  者。通常在自殺者解脫之後，往往接著出問題的就是在乎自殺者的人。在敏感的年紀，不

  只有青少年會詢問「為什麼？」有時候家人、另一半也有這樣的疑問，甚至自責自我沒有

  提早發現，但有時候自殺並不是單方問題，甚至不是雙方，而是更多面向的心理層面的爆

  發，故在最糟糕的事情已經發生，怎麼讓自己不要陷入自責漩渦中，也是一件需要調適和

  學習之事。








  《為我辦一場西式的喪禮》值得一看嗎：


  賴健祐看見死去的好友釘仔，這是真的見鬼？還是只是一種為了環節自我傷痛的機制作用

  ？這點在《為我辦一場西式的喪禮》電影裡我覺得很有趣的一環，對於釘仔、健祐、甚至

  兩人的學長三人之間，有一種不可言喻的奇怪氛圍，但我覺得電影好在沒有了當地說穿一

  切的關係，並將重點放在賴健祐對於釘仔各種想法和去做的事，包含去了釘仔的家，都可

  以展現出賴健祐其實正在用自己的方式去消化釘仔不在的事實。


  只有我看得見釘仔，這像是賴健祐自我對於這位好友的獨佔性，只有我了解他、因為跟他

  最好的人是我，故在《為我辦一場西式的喪禮》電影中賴健祐所見到釘仔用手語要求他做

  的每件事，是賴健祐當下看見才知道，還是那些語言早就刻在他心裡？


  例如：賴健祐其實早就知道釘仔的那些事，但這些事情越是知道，是否就代表他越可以明

  白釘仔自殺的原因。那是不是不知道會比較好，這樣他知道的那個釘仔就永遠留下來，不

  會消失。








  當然也有可能賴健祐真的見了釘仔的鬼魂，而逐步看見他所不知道好友的另一面，透過釘

  仔鬼魂的牽引，到最後才理解他的好朋友釘仔，是一個什麼樣的人，而自己對於釘仔的感

  覺又是怎麼一回事。


  不過以鬼魂和心理兩種解讀，我會傾向於賴健祐在心裡建構出他的釘仔，那些釘仔想做和

  最想要的事，他早就清楚知道，故當他看見意外現場的第一瞬間，釘仔對他表示的是：「

  為我辦一場西式的喪禮。」從不知道釘仔在幹麼，到我現在看得懂釘仔任何事，到最後超

  出我理解的事，電影中的賴健祐可能靠著自己去消化他的好友的離世。


  在《為我辦一場西式的喪禮》不清楚是刻意安排，還是故是只著墨在賴健祐身上，在電影

  裡不斷看到在青少年之外失職的大人，與對於孩子心理忽略的情感。如同輔導老師與賴健

  祐的溝通無果，是一個有意思的部分，青少年不想說出自己對於重要的人其實有著羞澀的

  情感，不管是友情還是愛，而他會用自己的方式去接收自己失去對方的現實，在那一刻不

  只是接受，賴健祐在這裡跟因釘仔自責的自己做出和解。




  --

  個人Blog：

