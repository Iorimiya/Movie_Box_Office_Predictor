url: https://www.ptt.cc/bbs/movie/M.1448641785.A.7A6.html
title: '[普好雷] 飢餓遊戲：自由幻夢 終結戰 '
content: "文長圖多之部落格原文網址 \n\n備份縮網址 \n\n\n(圖)\n我是《飢餓遊戲》的非忠實觀眾/讀者，「非忠實」的定義為：在書店翻完原著(被作者、\n\
  出版社和書店店員巴頭)，改編電影亦無一錯過。\n\n不過在這裡，我視改編電影為獨立個體，不與原著做詳細比較。為什麼呢？因為第一點，\n個人認為改編電影脫離文字後，無論它綻放的美麗或腐敗、讀者不滿或鍾愛，電影都產生\n\
  了自我生命。\n\n第二點，其實......原著細節我差不多都忘記了(這才是真正的理由吧吧吧)......\n\n\n(圖)\n本文分三部分：無雷心得、少許觀影前注意事項，和有雷吐槽。雷文前會以紅字警示。\n\
  \n兩年前，我寫過《飢餓遊戲》首集心得，那時我對三部曲《自由幻夢》的小說架構表示擔\n憂。不幸的是，這個噩夢成真了，它應驗在電影第三集《飢餓遊戲：自由幻夢I》(The\n\
  Hunger Games: Mockingjay - Part 1)上。\n\n小說《自由幻夢》的內容原不足以支撐上下兩集，四個多小時的內容，分成兩部播出，強\n\
  化了上集夢囈般之空乏無趣。\n\n而作為一部商業作品，下集的精彩刺激和上集形成強烈對比，在我心中，《飢餓遊戲：自\n由幻夢 終結戰》超越第二集，為系列作畫下一個足堪欣慰的句點。\n\
  \n若要為系列作排序，個人排名是1>4>2>>>>>>>>3。\n\n\n(圖)\n《飢餓遊戲》、《移動迷宮》、《分歧者》巴啦巴啦巴啦，這一連串反烏托邦青少年科幻\n\
  電影，最神奇的地方在於，由一群偽青少年飾演青少年，並用資本主義的生產模式和商業\n行銷大書特書淺碟式反烏托邦理念，憑藉一集又一集的續集電影錢滾錢。所以對於柯茵對\n\
  照史諾等可預期反諷情節，我無法產生強烈感動，因為電影本身正是最大的諷刺。\n\n\n(圖)\n然回歸娛樂層面，第四集是一部有趣的商業娛樂電影，重拾一、二集的「真人大逃殺」元\n\
  素，政府軍與反抗軍的對戰，讓首都化身大型遊戲捕獵場，下水道之戰甚至帶有幾分恐怖\n片氛圍。\n\n\n(圖)\n相較前三集的單一走向劇情，第四集在劇本上做了更多堆疊，融合戰爭、動作、爆破場面\n\
  ，文戲與武戲兼具，豐富了原著過於單薄之骨架，結尾的政治寓言則讓觀眾覺得：「喔天\n哪~我不只看了一部爆米花電影，我的心靈好像還獲得了什麼！？雖然這個什麼什麼我也\n\
  說不出什麼！！」總之能讓觀眾自我感覺良好一陣子(大概十分鐘)就對了。\n\n\n(圖)\n演員出色的演出亦然，如果你受夠了凱妮絲、比德和蓋爾糾纏的三角戀，抱歉，你依然得\n\
  繼續忍受(咦)，不過至少等到結果了謝天謝地。\n\n\n(圖)\n除卻年輕演員的情愛糾葛，第四集讓重磅老牌演員有較多發揮空間，例如茱莉安摩爾、唐\n納蘇德蘭、菲力普西蒙霍夫曼等等。在本集都「比較」不像虛設之人形立牌，擁有些許發\n\
  光發熱的亮點與片段。\n\n\n\n觀影前注意事項無他，即便到最後一集，還是有人會問：「我沒過看前三集也沒看過小說\n，請問這樣能看懂最後一......」\n\n\
  廢話！！！！都最後一集了，沒看過前面還看得懂是有天眼通逆！！！！(拍謝失態了)\n\n至於有沒有看過第三集似乎無關緊要，因為我媽沒看過第三集，依然能吳鳳接軌。\n\
  \n\n\n\n\n以下為有劇情雷吐槽！！\n\n以下為有劇情雷吐槽！！\n\n以下為有劇情雷吐槽！！\n\n以下為有劇情雷吐槽！！\n\n以下為有劇情雷吐槽！！\n\
  \n\n\n\n\n個人非常受不了凱妮斯在彼得與蓋爾間搖擺不定的劇情，仔細留意一下，「通常」，通常\n青少年小說裡描述一位堅強勇敢，個性與眾不同，相貌並非特別美麗，平凡中卻擁有難以\n\
  言說的魅力，深深吸引著周遭的狂蜂浪蝶，讓男一、男二，甚或男三四五六情不自禁、難\n以自拔的黑/褐/深棕髮女主角之劇情設定，「通常」出自女性作者筆下，帶有強烈的作者\n\
  自我投射，也為女性讀者提供投射空間。不嚴謹的往前追溯，可謂古早言情小說或\nYA(Young Adult)電影的變形體。\n\n\n(圖一)\n(圖二)\n如果這類女主角上PTT\
  \ Boy-Girl版發表擇偶文，例如：\n\n各位大大安安，小妹在這裡有個問題想請教大家，現在有兩個男人(以下簡稱A男和B男)和\n小妹處於曖昧期，小妹不知道該如何抉擇，請各位大大幫忙決定。\n\
  \nA男\n\n01.身高190，長相英俊高大，個性頑強、憤世嫉俗\n\n02.現職獵人，家裡有房貸和一堆兄弟姊妹要養\n\n03.和小妹我是青梅竹馬，很照顧小妹的家人\n\
  \n04.哥哥是雷神索爾\n\n\n\nB男\n\n01.身高158(大誤)，有點帥又不會太帥，性格溫和順從\n\n02.職業麵包師，吳寶春接班人\n\n03.他暗戀小妹很久了，為小妹犧牲奉獻在所不惜\n\
  \n04.最近精神狀況不太穩定\n\n\n\n為了試味道，兩個男人我都親過不只一次，而且兩個人都很好使喚，請問我該選誰呢？人\n家好煩惱喔~~~大家能給我一點建議嗎，謝謝？\n\
  \n\n\n這種問題在現實生活中，應該會被罵到翻、噓到X10後自刪吧，噓文裡則出現：\n\n「紅的明顯，拜託不要染指芬尼克。」\n\n「選黑密契啦！禿頭大叔戴假髮臭了嗎？」\n\
  \n「我是第七區參賽者喬安娜，我好像認識原PO和文中的AB男科科科~」\n\n\n\n(圖)\nBut她是人民的偶像凱妮絲！她是好萊塢的巨星珍妮佛勞倫斯！所以我們只能默默忍受凱\n\
  妮斯、彼得和蓋爾，三人一再於狹小空間談情說愛、明爭暗鬥，讓游擊小隊成員一再被他\n們的夜半無人(?)私語時吵醒而睡眠不足；讓觀眾如我尷尬症大發作，心想：「與其看他\n\
  們談戀愛，不如看芬尼克再被怪物咬死一次」之哀桑念頭。\n\n\n(圖)\n姑且不論蓋爾工具人(彼得最後至少收成了)，《飢餓遊戲：自由幻夢 終結戰》提醒大家\n\
  ：認清自己的配角地位，不要跟隨主角盲目行事。\n\n從結果論來看，柯茵總統布局已成，無論凱妮絲小隊行動與否，史諾政權必定傾覆，凱妮\n絲這個精神領導已完成其階段性任務。\n\
  \n所以那些被炸死的、被怪物咬死的、變成石油王而死等小隊成員，死的根本毫無價值啊啊\n啊啊~~~死有重如泰山、輕如鴻毛，而小隊成員之死等同腳毛。\n\n當凱妮絲哭泣道：「嗚嗚嗚對不起我害死大家，我並不想造成這一切巴拉巴拉~」時，我\n\
  心想：「嗯這是我目前為止聽過最有道理的話。」\n\n\n(圖)\n毫無意外的，黑人必定先死，當小隊中唯有你一個有色人種，就要有被犧牲的覺悟。\n\n\n(圖)\n\
  演什麼角色最安全呢？寵物。\n\n在好萊塢電影中，寵物永遠能活到最後，即便寵物身陷危難，也有不怕死的配角去救它，\n連意外險都不用保。\n\n\n(圖)\n反叛軍的前線防守簡陋，凱妮絲輕輕鬆鬆就混進去。但更簡陋的是凱妮絲和蓋爾的變裝。\n\
  \n明明要去刺殺總統，明明借住在行頭琳瑯滿目之造型師住處，結果凱妮絲和蓋爾只穿件斗\n篷斗篷斗篷(回音)便上路了，你們以為自己是去森林拜訪奶奶的小紅帽嗎？好歹戴個口罩\n\
  或墨鏡吧(結果看起來更可疑)？不然隨手抓把泥土抹在臉上也可以啊！！我的要求真的不\n多！！\n\n\n(圖)\n最後結局會發現女總統柯茵人緣奇差無比，平日大概常常被已讀不回。\n\
  \n凱妮絲在大庭廣眾下一箭射殺柯茵，柯茵身邊卻沒有半個人興師問罪、或聊表舊日革命情\n誼之類。凱妮絲被形式性的關禁閉半天就被放走了，真是我為柯茵悲(抹淚)。\n\
  \n\n(圖)\n題外話是，原本第二區指揮官Lyme是由曾演出《美國恐怖故事》(American Horror\nStory)的莉莉拉貝(Lily Rabe)飾演，礙於時間衝突，改由《冰與火之歌》(Game\
  \ of\nThrones)的美人姐(Gwendoline Christie)演出，雖然只出現零星幾幕。\n\n\n(圖)\n另一位有演出《冰與火之歌》的演員，則是飾演電影導演Cressida的Natalie\
  \ Dormer。\n\n\n《飢餓遊戲》的美術設計向來一流，下列為個人覺得滿有意思的電影海報：(多圖)\n\n\n--\n\n狡螺三窟\n\n\n\n\n\n\
  --"
