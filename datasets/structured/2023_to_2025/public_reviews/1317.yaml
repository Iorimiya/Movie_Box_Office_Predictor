title: '[好雷] 飢餓遊戲：自由幻夢 終結戰'
content: '大家好


















  首先 我是彼得 最後凱妮絲選了我

  我好興奮啊～～～

  (其實拼音好像不一樣啦XDD)


  女主角不選高帥男 非常激勵人心(大誤)

  真是給人正向的能量～^_^


  基本上很少邏輯不通的片段


  人物的部分因為都最後一部了也沒啥好說


  是說最近殭屍很夯 也跑到這玩了


  第一次爆出來的那段還是被嚇到 蠻靠北的XD


  直接把人燒成碳的光束還蠻兇的


  群眾舉起三指的手勢再次勾起一股感動

  也為最後的攻擊拉開序幕


  看到''臨時總統''這個詞也讓我噗嗤一笑

  最後凱妮絲的那一箭也在意料之中


  他們的民主世界 終於來臨


  整體就是不錯的一部片 不失期待


  --'
