title: '[選片] 泥娃娃 咒你'
content: '本身是恐怖片愛好者  尤其是氣氛好到會毛起來的那種特愛

  但愛看恐怖片的宿命就是大概10部片會有8部是雷

  常常掃雷掃到覺得到底為什麼要浪費生命看一堆不恐怖的片...


  今晚想從泥娃娃跟咒你兩部挑一片

  咒你目前沒看到有心得  希望有看過版友可以分享一下

  如果都沒有大概就是選泥娃娃了

  謝謝大家


  --'
