title: '[好雷] 打破樊籬，無邊無際：《雙手的溫柔》'
content: "本文涉及劇情，且具個人觀點，推薦觀影後再讀。\n\n\n　　　　本片已上映第二週，有意者請把握本週時間。\n\n\n　　　　圖文網頁版：\n\n\
  　　　　\n\n\n　　　　預告片：\n\n　　　　\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n打破樊籬，無邊無際：《雙手的溫柔》\n\n\n\n　　《雙手的溫柔》（The Blue Caftan） 是摩洛哥導演瑪莉安圖澤尼第二\n\n部劇情長片，奪下坎城影展「一種注目」單元的國際影評人費比西獎，亦代\n\
  \n表摩洛哥角逐2023奧斯卡國際影片入選前15強。這是個悲傷中有溫柔，溫柔\n\n裡有悲傷的故事：米娜（魯比娜阿扎巴爾飾）和丈夫哈林（薩萊赫巴克里飾）\n\n\
  共同經營傳統裁縫店，哈林手藝高超堪為大師，但在手工逐漸被機器取代市\n\n場供需後，技藝也隨之沒落不受重視，甚至收不到學徒；米娜負責接待客人\n\n和維護丈夫的專業，但罹癌復發，健康堪虞。二人相依為命，尤瑟夫（阿尤\n\
  \n布密蘇伊飾）來應徵學徒，原本以為到處學藝的他應難久留，不料卻讓夫妻\n\n之間的關係起了漣漪。\n\n\n\n　　說是漣漪，乃因米娜與哈林相知扶持之深，作為伴侶，唯一不可跨越的\n\
  \n只是先天的性傾向而已。摩洛哥高達99% 的人口信仰伊斯蘭教，對同志的立\n\n場保守，同性性行為可處三年以下有期徒刑，故而哈林每次去澡堂洗浴，只\n\n能隨機尋找對象發洩性欲。米娜緘默心知，察覺哈林與尤瑟夫彼此吸引也不\n\
  \n免嫉妒，主動求歡時哈林雖極力配合，溫差卻甚為明顯，深愛丈夫的米娜甚\n\n至因遺失粉紅緞向尤瑟夫發難，使受到冤枉的尤瑟夫一度憤而離開。\n\n\n\n　　慶幸的是，米娜與哈林相濡以沫，用溫柔擴展彼此的自由，讓愛圓滿原\n\
  \n本無法給予的空缺。哈林是拐杖，細心照顧米娜的病弱；米娜的堅韌則是藥\n\n劑，療癒哈林「不配為人」的傷口和自覺異常的自卑。米娜的幽默、正直，\n\n享受生活樂趣的達觀，以及兩人之間長時間相伴累積的理解，既讓米娜感受\n\
  \n到哈林對她的愛與重視，也讓她從緘默心知到積極成全，催促哈林和尤瑟夫\n\n一起去澡堂。哈林為自己的性傾向感到罪惡，自小被父親厭憎，在米娜的支\n\n持下相偕私奔，感激之餘對她有求必應，米娜病後更悉心照顧，儘管對尤瑟\n\
  \n夫產生好感，卻不願傷害妻子，直到愧疚傾訴他會為米娜帶來恥辱時，米娜\n\n告訴哈林「要及時去愛」。尤瑟夫八歲即父母雙亡，到處流浪的他在這間小\n\n店認真學藝與工作，他的才華與努力使哈林的技藝有傳承的可能，他的俊美\n\
  \n與積極更讓哈林內心掀起波瀾。但被米娜冤枉時不卑不亢的自陳清白，又向\n\n哈林示愛被拒後，尤瑟夫原可一走了之，卻又能不計前嫌，回來與哈林一起\n\n照顧米娜與店裡。三人以各自的體貼互為支持，就像那場熱情的三人共舞，\n\
  \n維持奇妙的平衡，建立成一個非典型的「家」，源於純粹的、對愛的渴求與\n\n付出。\n\n\n\n　　片名譯為《雙手的溫柔》，電影裡顯性的有哈林大量手的特寫，包含在\n\
  \n細緻的布料間裁縫編織、手把手教尤瑟夫技藝，剝米娜最愛吃的橘子、為已\n\n病弱無力的她換衣服，以及撫摸她胸乳開過刀的傷疤；米娜則是隱性的，不\n\n僅在客人面前護衛哈林大師級的技藝，更是推進他與尤瑟夫關係的推手。位\n\
  \n於北非的摩洛哥是阿拉伯國家，崇尚「厚養薄葬」的習俗，不論貧富死後均\n\n一切從簡，幾尺裹屍布，一段簡短的宗教儀式，葬禮即告結束。米娜死後依\n\n俗原本已裹好了白布，哈林卻親手為米娜換上最後完成的油藍色禮服，正是\n\
  \n原片名 《The Blue Caftan》，他多年技藝最純熟的作品，既是補償兩人當\n\n年未及穿上禮服、甚至可能沒有公證而結合的伴侶關係，接著與尤瑟夫一前\n\
  \n一後抬著米娜至墳場送葬，走完人生的最後一程，更是向來畏懼世人眼光的\n\n哈林，卸除傳統的限制，最勇敢的示愛。墳場面朝大海，不遠處則有遊客與\n\n當地人的娛樂活動，他們同居時只能聞到的海潮氣息，如今一起與米娜為伴，\n\
  \n喜愛熱鬧的她，穿著哈林親手縫製的禮袍，應能安眠於此吧。\n\n\n\n　　對於愛情，彷彿總是從吸引開始，用激情延續，再占有確認，直至延續\n\n或毀棄承諾；過去男導演作品裡的同妻，往往悲情、冷漠、憤怒，僅是「真\n\
  \n愛」的配飾或障礙。《雙手的溫柔》卻著重米娜與哈林之間愛的真實存在，\n\n是一起努力的相依相護，是時間點滴累積的珍惜，是打破樊籬、無邊無際的\n\n海洋。即使米娜離開了人世，過往記憶仍會穿針引線，縫進彼此的生命──\n\
  \n那是愛細緻溫柔的極致，看似平淡，實則柔軟如油藍，浸潤如甘霖，無處不\n\n在。\n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n\
  有時候，眼睛只肯告訴我這麼多。\n\n                                  陳斐雯  貓蚤札（其三）\n\n--"
