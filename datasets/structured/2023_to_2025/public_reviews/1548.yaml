title: 'Re: [新聞] 琥碧戈柏認為《Barbie芭比》並非遺珠'
content: '琥碧大姊其實很有資格說這句話，

  當年她以"紫色姐妹花"(初版)入圍奧斯卡最佳女主角，全片提名十一項，

  結果開獎出來...掛零，是奧斯卡史上最慘紀錄之一。


  之後琥碧大姐改變戲路，終於以"鬼"(第六感生死戀)裡三八兮兮的神棍歐達梅

  大受好評，只是那個十一項提名掛蛋，大概多少還是有點心理陰影吧?


  --'
