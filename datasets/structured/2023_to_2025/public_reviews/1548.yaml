title: '[普好雷]《Barbie芭比》超脫「芭比娃娃」，然而神作未滿'
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  1.影片名稱：Barbie芭比


  2.觀影時間：2023/08/20


  3.觀影地點：信義威秀


  4.觀影方式：片商交換券


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  部落格圖文版：


  從和風格截然不同的《奧本海默》同檔競爭，因而意外地在社群媒體上引領風潮的「芭本

  海默」（Barbenheimer）迷因，到以「芭比娃娃」為原型的電影本身，「衝突感」絕對是

  最能夠解釋這種種一切的理由與事實。


  不管是抑鬱的席尼墨菲夢幻聯動（？）粉彩逼人的瑪格羅比的迷因海報也好，又或是《

  Barbie芭比》首周末完全不落《奧本海默》之後，一篇接著一篇的好評也好，都讓我原先

  的不期不待，漸漸地被好奇取而代之。


  然而「好奇」，某種程度上正是最破壞《芭比》觀影體驗的一種期待心理－因為電影最大

  的驚喜，其實就是「驚喜本身」。


  「嗨！芭比！」


  「…嗨！芭比！」


  在芭比樂園中，芭比們洗得、喝得、吃得一切通通都是空氣，就連要出門，都是直接從屋

  頂飛到駕駛座上－畢竟在真實世界中，可沒有人會讓自己的芭比娃娃在路上走。而不只生

  活超脫現實，日常也是日復一日－白天工作晚上狂歡，而且每晚都是淑女之夜，直到永遠

  （然後有「去海灘」、「在海灘」之類的超廢工作XD）。


  這些自成一格的烏托邦設定，幾乎是明示著接下來的「夢醒時分」－芭比必須前往真實世

  界，和「小女孩」一起修補兩個世界的裂縫。


  「…妳很美。」


  「我知道！」


  當芭比從以芭比們為中心的芭比樂園，來到董事會成員清一色都是男性，女性要不是選美

  小姐，就是坐櫃台的洛杉磯時，芭比與肯尼分別接受了父權的衝擊。從鐫刻在玩具上，世

  人對於「女性」的想像反推至女權問題，甚至進一步地探討「美」是否有固定定義，將自

  己理想中的樣子寄情於芭比娃娃之上，又是否是少女專利。《芭比》順水推舟地開展議題

  ，且議題的廣度十足令人驚喜。


  但電影對於議題的處理，並無法進一步地延續這股驚喜。「媽媽」葛洛莉「罵醒」被洗腦

  芭比的方式真的既突然又說教感十足，而當芭比樂園又變回了和真實世界相反的「女權社

  會」，芭比是告訴肯尼應該要成為自己的肯尼，不是「芭比與肯尼」的肯尼，然而要怎麼

  將女權社會下的男權連結到真實世界？怎麼樣算是「Kenough」了？《芭比》並沒有給出

  任何具體答案。


  「可以出素人芭比嗎？」


  「不…」


  「…這有賺頭。」


  「當然可以！」


  反而是媽媽最後許願的「素人芭比」，不只意味著上班族、家庭主婦等各種形象都可以是

  女性的理想生活選項，更進一步和芭比娃娃結合，絕對是電影中最有趣的答案。


  而《芭比》中還有一件超級有趣的事－就是電影中不時可見的致敬和後設手法。高跟、勃

  肯鞋對應著紅藍藥丸，美泰兒總部辦公室、創辦人客廳之間的無縫接軌也像極了《駭客任

  務》。另外肯尼一用父權翻轉芭比樂園的權力結構，華納兄弟就立刻要洽談電影版權，還

  有用「查克史奈德的《正義聯盟》」形容父權，芭比公司創辦人自嘲逃漏稅的種種情節，

  更都有戳中笑點。


  《芭比》確實突破了我對於「芭比娃娃」題材的想像－無論是議題的豐富度，還是笑話的

  粗暴程度。粉爆、就連怪芭比的住處都夢幻到不行的芭比樂園，以及電影中的幾段歌舞真

  的儀式感點滿。然而扣除「芭比居然能這樣拍」的新鮮感，在議題的詮釋上還是少了點新

  意。Btw，一直以為最後應該來段歡樂到爆的歌舞的說…（？）


  --


  部落格：

  FB粉專：


  --'
