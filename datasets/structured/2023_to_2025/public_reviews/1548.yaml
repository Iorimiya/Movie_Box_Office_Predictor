title: '[新聞] 真人版Barbie芭比開趴了！瑪格羅比「芭比'
content: '新聞網址：


  真人版《Barbie芭比》開趴了！瑪格羅比「芭比腳變扁平足」秒崩潰


  NOWnews今日新聞 2023-05-26 記者 黃雅琪


  由導演葛莉塔潔薇執導、「小丑女」瑪格羅比及萊恩葛斯林主演的真人版《Barbie芭比》

  ，今（26）日曝光主預告，預告中可以看到粉紅的芭比樂園、超級歡樂的派對、華麗的音

  樂排舞，以及進入真實世界後的旅程，幽默的互動與行徑也笑翻不少粉絲。


  芭比（瑪格羅比飾演）在一個完美的地方過著完美的人生，會舉辦超級盛大的派對，有華

  麗音樂及排舞，每天都過著很棒的日子！但有一天怪事開始發生在芭比身上，她的洗澡水

  不熱、會從屋頂跌落，甚至發現她的腳跟竟然貼地了，變成扁平足，之後她決定與肯尼（

  萊恩葛斯林飾演）進入真實世界，去探索事情的真相，因而引發一連串的意外事件。


  瑪格羅比同時身兼《Barbie芭比》的製片，她除了看到芭比娃娃IP的廣大潛力及粉絲，也

  知道許多人不是芭比娃娃的粉絲，不僅對芭比娃娃無感，甚至非常討厭芭比娃娃，希望能

  藉著《Barbie芭比》讓觀眾有不一樣的感受。


  《Barbie芭比》卡司陣容堅強，艾美莉卡弗瑞娜、凱特麥金儂、伊莎蕾、李察皮爾蒙、威

  爾法洛、麥可塞拉、雅瑞安娜葛林布雷、安娜克魯茲凱恩、哈莉尼夫、雅莉珊卓希普、金

  斯利本阿迪爾、劉思慕、舒提加特瓦、史考特伊凡、傑米德梅特里尤、康納斯溫德爾、莎

  朗魯妮、尼古拉考夫蘭、瑞圖艾莉亞、葛萊美得獎歌手杜娃黎波，以及奧斯卡金像獎影后

  海倫米蘭。《Barbie芭比》7月20日在台上映。


  --'
