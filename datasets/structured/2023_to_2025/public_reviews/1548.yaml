title: '[無雷] Barbie芭比-真的好無聊好想睡'
content: '芭比


  大概是我今年看過  期望跟落差最大的電影XDD

  想說賣了十億 應該不會爛到哪裡去


  但昨天晚上看了 我真的是幾乎要睡著

  很希望身邊有護理師可以幫忙打腎上腺素

  到最後只希望電影趕快結束我可以回家


  講認真的你要講男權女權 存在主義 都沒關係 我給你說教


  但你要說教 也不是用這種全部"講"出來的方法吧

  劇情走向有夠無聊  看完只覺得芭比還真是無腦到不行

  人類世界也是各種腦殘


  娛樂性也有夠低  很難想像芭比整片都粉紅色

  會比一堆黑白畫面的奧本海默的娛樂性還低


  大概就靠幾個爛笑點還有肯尼的表演撐娛樂度


  瑪格羅比的表現有夠花瓶(可能芭比本身就是個花瓶的玩具)

  跟巴比倫比真是天差地遠

  巴比倫隨便一場戲都屌打她在芭比的演出


  我覺得電影這樣拍 一點都不高明


  先想辦法拍得有趣  讓人想看 再從中帶出你要講的議題


  而不是你一直在對話裡面塞你想講的東西


  我隨便去上個一小時的性平演講可能都比芭比有趣


  只能說非常失望


  大概以上    覺得這片超有深度的可以噓我了


  我只覺得拍得又無聊   想表達的東西又表達得很爛



  --'
