title: 'Re: [新聞]《Barbie芭比》女性主義惹怒酸民？電影在'
content: '今天也看完芭比


  相信我 極端女權在這部根本也被狠甩了一巴掌好嗎!!


  <防雷>


  <防雷>


  <防雷>











  1. 極端女權世界

  別以為芭比樂園只是個讓女性享受的遊樂場，實際上就是個女權主義者的春夢

  什麼事情 各行各業都要由女性擔任 男生呢?就是個背景舞者


  2. 極端女權撞牆、現實世界的嘲諷

  某一天 芭比突然開始會變老 變扁平足 甚至吃了重力直接摔在地

  而後來到了現實世界, 由於那套鮮豔滑稽的服裝被路人嘲笑

  聽起來很熟悉嗎?這就是在暗諷極端女權主義正在顯現出一些滑稽的東西

  甚至我們也跟世界其他人一起指著這種滑稽的事情大笑

  而當芭比期待著工地應該全是女工人的時候, 又被現實打破幻想(全是男人


  而芭比被摸屁股反揍對方, 以及偷衣服那邊都吃癟被逮捕

  換作在其他女權電影可能沒事, 但在真實世界

  ,就算是女人做壞事也要付出代價的 (看安柏就知道了


  4. 女權納粹

  後來到了芭比前往國中見她主人的女兒那段,本來以為小女孩會喜歡她

  結果反過來被嗆"你讓女權運動倒退了50年!"還被嗆為法西斯

  而後來這個小女孩還在車上說"算了吧,每個人都討厭女人

  ,男人討厭女人,女人也討厭女人,這是我們所有人都認同的一點"

  這句話顯示了每個人對這種極端女權主義的看法:

  我們從骨子裡討厭它!


  有看電影就知道 甩完女權巴掌後就是甩男權巴掌了


  5. 最後的場景

  肯在反思並想弄清楚自己是誰 芭比世界變回原貌

  而芭比與她的創作者對話台詞

  芭比:「我不覺得我有結局」

  創作者: 「我沒有設計你有結局」

  這真的很妙,基本上是在說女權主義並非終極目標

  它只是一種推動事物前進的工具

  最後芭比選擇離開樂園,就是在暗示極端女權這種狗屁只是一種夢幻國土

  是時候該醒過來了!



  大概這樣

  如果只看到反父權那真的很可惜

  在我看來這部diss女權的部分多太多啦


  --'
