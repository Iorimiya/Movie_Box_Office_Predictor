title: '[新聞]Barbie芭比打動人心引起共鳴，台灣首週票房破2,300萬台幣'
content: '《Barbie芭比》打動人心引起共鳴，台灣首週票房破2,300萬台幣


  由鬼才導演葛莉塔潔薇執導、瑪格羅比及萊恩葛斯林主演的《Barbie芭比》自上映以來好

  評不斷，獲爛番茄90%新鮮認證、CinemaScore「A」的觀眾超高評分，觀眾表示在歡樂的

  粉紅派對之下，片中「不乏幽默機智的對白，卻又能在幾個瞬間一秒令人紅了眼眶」、「

  幽默感人，又偷塞人生道理」，成功述說一個層次豐富又富有人性及意義的故事。


  《Barbie芭比》首週也達成現象級的票房表現，北美票房破1.55億美元（約48.6億台幣）

  、台灣票房破2,300萬台幣、全球票房累積破3.37億美元（約105億台幣）。


  《Barbie芭比》在北美地區打破多項票房紀錄，包含今年最高首週票房、今年最高單日票

  房、女性導演執導電影最高開片紀錄；在全球也創下導演葛莉塔潔薇、主演瑪格羅比、萊

  恩葛斯林，以及片中其他演員的最高開片紀錄，同時也是玩具改編電影的最高開片紀錄。


  《Barbie芭比》不僅在世界各地掀起粉紅浪潮，也帶來了觀眾一直渴望的那種有趣的觀影

  體驗，這不僅證明了導演葛莉塔潔薇的獨特願景，也證明了芭比在全世界有著跨世代的影

  響力。


  《Barbie芭比》台灣首週票房破2,300萬台幣，近日全台戲院多處同樣可見到民眾主動以

  粉紅、芭比主題扮裝看電影，粉紅現象不輸全球。電影中的豐富面向，包含從粉紅派對、

  音樂歌舞、幽默搞笑，到溫暖的樂觀主義、人生哲理，都以強而有力的方式吸引著各年齡

  層的觀眾，打動人心並引起廣大的共鳴。



  新聞網址：



  ==========

  沒想到這麼紅,很多女孩兒去看的嗎


  --'
