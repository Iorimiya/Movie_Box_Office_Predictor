url: https://www.ptt.cc/bbs/movie/M.1687775615.A.A9A.html
title: '[新聞] 瑪格羅比《Barbie芭比》電影宣傳開跑！'
content: '瑪格羅比《Barbie芭比》電影宣傳開跑！

  最新華麗芭比造型曝光，從螢幕上美到現實世界


  瑪格羅比開始跑電影《Barbie芭比》宣傳了，將會以華麗的芭比風格造型陸續現身，先來

  看看最新亮相的2套穿搭有多漂亮！關於瑪格羅比的宣傳造型美麗佳人將持續為你跟進。


  by jessie - 2023/06/26 更新

  Photo／Getty、Instagram




  瑪格羅比（Margot Robbie）與萊恩葛斯林（Ryan Gosling）主演真人版芭比電影《

  Barbie芭比》即將於7月20日上映，一起看看瑪格羅比如何在電影中詮釋真人版芭比，又

  是如何把芭比的風格穿到現實世界？


  瑪格羅比電影《Barbie芭比》宣傳造型


  粉色背心+百褶裙套裝


  瑪格羅比穿著全身Bottega Veneta訂製的絲質百褶裙及背心胸衣套裝，與她的粉色芭比車

  在陽光下拍照，手上同樣是來自Bottega Veneta的粉色 Cabat手提包，亮麗造型讓這條椰

  林大道瞬間也變成了芭比的電影場景。





  粉色波點中空洋裝


  瑪格羅比於洛杉磯的電影發布會上，穿著一身Valentino為她訂製的粉色波點洋裝登場，

  搭配Manolo Blahnik的高跟鞋和黃色包包，穿搭100%還原芭比娃娃。


  裙子中空的設計很是性感，造型師Andrew Mukamal在社群上分享，這件裙子出自

  Valentino過往的設計，只不過改以芭比招牌的亮粉色重新演繹，標籤上還有Margot X

  Barbie的字樣，特別可愛吧！瑪格羅比無違和的把芭比的風格帶進現實世界，不禁要懷疑

  她整個人真的快要變成芭比了吧。






  美麗佳人



  --'
