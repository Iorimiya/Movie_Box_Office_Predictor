title: '[新聞]《Barbie芭比》女性主義惹怒酸民？電影在影評網「爛番茄」遭受到「負評'
content: '新聞網址：



  Yahoo奇摩電影戲劇編輯部

  2023年07月29日



  【文／克里斯蒂】好萊塢男星雷恩葛斯林（Ryan Gosling）與瑪格羅比（Margot Robbie

  ）主演的《Barbie芭比》真人版電影，在全球上映後獲得眾多影評盛讚，票房也開出亮眼

  紅盤，但電影中講述芭比與肯尼尋找自我之旅的劇情，帶有女性主義和諷刺父權社會的意

  味，似乎在觀眾間掀起兩極評價。





  影評網站「爛番茄」評價機制，除了有影評人給予的「爛番茄新鮮度」，也有開放一般觀

  眾給予評價的觀眾評分「爆米花指數」，而該評分需要通過購票驗證，才會採計評分；不

  過若無驗證購票，仍可以給予評論，但不會採納進「爆米花指數」。「爛番茄」之所以會

  實施購票驗證機制，也是為防堵網友針對特定電影做惡意評價洗版攻擊。




  ，這樣的情況並非首次出現，在


  」；另外，HBO人氣影集《最後生還者》第三集也因為劇情涉及男同志戀情，遇到大量惡

  意差評。



  不過，《Barbie芭比》雖遭遇到部分網友的惡意攻擊，但綜觀來說，該片上映後取得眾多

  好評，除了獲「爛番茄」90%新鮮認證，在影院評分「CinemaScore」也拿到「A」超高好

  評，這對導演葛莉塔潔薇（Greta Gerwig）和《Barbie芭比》所有工作人員來說，是一次

  巨大的成功。



  --'
