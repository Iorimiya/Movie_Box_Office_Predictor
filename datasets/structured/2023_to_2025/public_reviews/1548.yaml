title: '[新聞] 「Barbie芭比」全球票房將破10億 美泰兒'
content: '新聞網址：


  「Barbie芭比」全球票房將破10億 美泰兒總裁想拍續集


  2023-08-01 聯合報 記者 陳建嘉 即時報導


  瑪格蘿比、萊恩葛斯林主演奇幻浪漫喜劇「Barbie芭比」全球狂賣，全球累積票房已高達

  7.74億美金（約台幣235.06億元），擠進今年目前全球票房第3名，僅次於「超級瑪利歐

  兄弟電影版」、「星際異攻隊3」，預計本週將加入10億美金（約台幣303.7億元）俱樂部

  ，近期美泰兒總裁伊農克瑞茲受訪，提到想要打造一整個玩偶品牌的宇宙，更不諱言想拍

  續集。


  伊農接受「綜藝報」訪問，提到「芭比娃娃作為一個品牌，有非常多帶，也是非常廣泛的

  品牌」，並提到還有很多「芭比」的元素等待一一去挖掘，「一開始我們並沒有想說，好

  吧，讓我們考慮第二部或是第三部電影，讓我們先把第一部拍好」，並坦言如果第一部電

  影成功躍上大銀幕，那麼機會很快就會再度出現，暗示自己想拍續集。


  不過導演葛莉塔潔薇目前的興趣確實不高，她接受「紐約時報」訪問時，被問是否能執導

  續集，她則沒有太多想法，「此時此刻就是我擁有的一切，其實每次拍完電影，我都會有

  這種感覺，像是永遠不會拍另一部，因為我想做的一切都做到了」，葛莉塔並說她不想粉

  碎任何人的希望，但在這當下，她拍攝續集的機會完全是零。


  在全球票房亮眼，北美也創下佳績，北美上週末預計再收9300萬美金（約台幣28.24億元

  ），上映10天累積票房已高達累3.51億美金（約台幣106.6億元），已是年度第4名。全台

  票房也同樣亮眼，目前已經6千9百萬，並在「不可能的任務：致命清算 第一章」、「奧

  本海默」等強敵環伺之下，穩穩向億萬大關邁進。


  --'
