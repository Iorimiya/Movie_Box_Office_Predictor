url: https://www.ptt.cc/bbs/movie/M.1706254216.A.63F.html
title: '[新聞] 琥碧戈柏認為《Barbie芭比》並非遺珠'
content: "琥碧戈柏認為《Barbie芭比》葛莉塔潔薇及瑪格羅比並非遺珠，「這是主觀的，並不是人\n人都可以拿獎」\n\n2024-01-26電影神搜\n\n\
  \n\n奧斯卡金像獎入圍名單公開後，許多人都對《》導演以及\n沒有入圍最佳導演、最佳女主角感到驚訝。\n\n而近日以《第六感生死戀》榮獲奧斯卡最佳女配角的演員，被詢問到《\n\
  》成為遺珠的看法時，表示所謂的「」根本不存在。\n\n\n\n《》於今年奧斯卡共入圍最佳影片、最佳改編劇本、最佳男配角和原創歌曲等\n 8 項大獎，但許多人仍為和感到可惜。\n\
  \n近期在《The View》節目上接受主持人莎拉海因斯的訪問，被問到對於《\n》成為遺珠的看法，對此，她表示所謂的「」並不存在，因為「\n」。\n\n「\n\
  」\n\n《》2023 年以 14.46 億票房的好成績，坐上全球票房之冠，加上電影本身評\n價優異，入圍金球獎、導演工會、演員工會等獎，許多都認為葛莉塔潔薇和瑪格羅比勢必\n\
  會在奧斯卡入圍有所斬獲，沒想到卻出乎意料。\n\n\n\n而入圍最佳男配角獎的萊恩葛斯林，也在近期為兩人抱不平，\n\n「沒有她們的才華、毅力與天才，任何參與電影的人員都不可能獲得這樣的肯定。我無法\n\
  言喻自己對於她們最終沒有入圍對應的獎項感到有多失望。他們的努力應該要與其他入圍\n者一起受到肯定。話雖如此，我仍非常開心艾美莉卡弗瑞娜以及其他不可思議的藝術家們\n\
  ，能夠為這部劃世代的電影貢獻才華。」\n\n以《Barbie芭比》葛洛莉亞一角入圍最佳女配角的艾美莉卡弗瑞娜，在接受《綜藝報》的\n訪談時，也對於兩人沒有入圍感到有些失望，\n\
  \n「葛莉塔潔薇盡了身為一位導演該盡的所有責任，她確實值得入圍。創造出這個世界，讓\n一個對大部分的人來說都沒有內在價值的事物搖身一變成了全球現象。她沒有出現在入圍\n\
  名單上確實令人深感失望。」\n\n\n\n就連也出面發表看法，在 X (原推特) 平台上寫道：\n\n「雖然電影在票房上獲得勝利，但無法抱回金獎，你們的百萬粉絲們愛你們。你們兩個都\n\
  不僅僅只有 Kenough 而已。」\n\n2024 奧斯卡金像獎將於 3 月 10 日舉行頒獎典禮\n\n新聞網址：\n\n\n\n\n\n--"
