url: https://www.ptt.cc/bbs/movie/M.1690794738.A.425.html
title: '[新聞] 《Barbie芭比》全球近8億逼近「瑪利歐」、《奧本海默》破4億創R級'
content: '新聞網址：


  新聞標題：




  新聞內容：


  今（2023）年暑期由《Barbie芭比》、《奧本海默》引發的「芭本海默」（Barbenheimer

  ）觀影風潮，造成北美等地的票房大熱，兩片在北美盛大上映之後，上週過完第二個週末

  ，成績仍舊亮眼。


  ，北美的海外市場則到了4.23億美元，總計；，北美的海外市場則到了2.26億

  美元，總計



  首先是華納的《Barbie芭比》，首週末北美拿下1.62億美元，超越《超級瑪利歐兄弟電影

  版》首週末的1.46億美元，寫下今年北美首週末最高票房紀錄。而1.62億美元的北美首週

  票房，也讓導演葛莉塔潔薇（Greta Gerwig）成為影史首週末票房最高紀錄的女性導演，

  締造歷史。


  《Barbie芭比》進入第二個週末，在北美的4337間電影院中，週五收進2900萬美元、週六

  收進3460萬美元、週日則是2940萬美元，第二個週末的三天，週五至週日的票房收進9300

  萬美元的數字，與首週末相比跌幅42.6%，而第二個週末，三天的總票房成績，足以成為

  北美影史第7高。


  第二個週末的票房，排在《Barbie芭比》前面的電影為，《STAR WARS：原力覺醒》（

  1.49億美元）、《復仇者聯盟：終局之戰》（1.47億美元）、《復仇者聯盟：無限之戰》

  （1.14億美元）、《黑豹》（1.11億美元）、《侏羅紀世界》（1.06億美元）、《復仇者

  聯盟》（1.03億美元）。


  值得一提的是，排在《Barbie芭比》的前6部電影，多數來自於迪士尼，僅有《侏羅紀世

  界》出自環球影業，而特別的是，此6部電影，都可看作延續性的系列的大作，《Barbie

  芭比》則為單一原創電影。




  至於這一週，，已經成為今年度北

  美第4名的電影，排在前面的分別是，《超級瑪利歐兄弟電影版》（5.74億美元）、《蜘

  蛛人：穿越新宇宙》（3.78億美元）以及《星際異攻隊3》（3.58億美元）。依照目前的

  熱度以及口碑來看，，但能否突破《超級瑪利歐兄弟電影版》的數字則還得持續觀察。


  而，則排在今年度全球第3名的位置，排在前

  面的分別是，《超級瑪利歐兄弟電影版》（13.50億美元）以及《星際異攻隊3》（8.44億

  美元），依照目前的熱度以及口碑來看，，但能否突破《超級瑪利歐兄弟電影版》的數字則還得持續觀察。




  再來是環球影業的《奧本海默》。《奧本海默》在北美首週末收下8245萬美元的票房、北

  美之外的國際市場獲得9365萬美元，全球總計1.74億美元，高於原先預期，對於一部限制

  級，且片長3小時的歷史電影而言，這是難得的數字。


  而《奧本海默》也成為導演諾蘭（Christopher Nolan）生涯中，北美首週末票房第3名的

  作品，僅次於《黑暗騎士：黎明昇起》的1.60億美元和《黑暗騎士》的1.58億美元。而且

  ，《奧本海默》並非「蝙蝠俠」這類型的知名IP，有此成績更可貴。




  《奧本海默》進入第二個週末，在北美的3647間電影院中，週五收進1343萬美元、週六收

  進1821萬美元、週日則是1456萬美元，第二個週末的三天，週五至週日的票房收進4660萬

  美元的數字，與首週末相比跌幅44%，其實跌幅與《Barbie芭比》相去不遠。而


  至於這一週，，此成績在全球票房方面，以諾蘭的作品而言，也經超越《天能》的（3.65億美

  元）以及《蝙蝠俠：開戰時刻》（3.73億美元）。


  最後，根據《綜藝報》指出，Comscore的高級分析師Paul Dergarabedian表示：「來到第

  二週末證明了，一周前人們對於《Barbie芭比》和《奧本海默》的濃厚興趣並非偶然。，首週末的成績顯然可

  靠的。」




  ===========


  附註：


  相較於台灣對阿湯哥的熱愛，「芭本海默」現象則是持續席捲全球


  芭比超越《星際異攻隊3》只是時間問題，目前更直衝瑪利歐而去，上看15億美元大關


  奧本海默則是創下了 R 級電影的紀錄，連續 10 天北美票房都破千萬


  在八月沒有大片的情況下，雙強橫掃全球票房的狀況應該會持續下去


  --'
