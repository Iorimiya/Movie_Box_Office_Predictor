title: '[新聞] 導演製作《Barbie芭比》聘用6千名臨演　'
content: '導演製作《Barbie芭比》聘用6千名臨演　為英國經濟帶來１億美元貢獻




  原文：

  電影《Barbie芭比》以驚人的14.3億票房成績獲得今年的票房冠軍，並將爭奪奧斯卡最佳原

  創劇本獎。這部電影的大部分場景都在英國倫敦的華納兄弟利維斯登工作室拍攝，據悉該片

  為英國帶來了龐大的經濟效益。導演在當地聘用了超過6千名臨演，創造了685個就業機會，

  並贊助750多家當地企業。不僅推動了當地經濟的發展，還為英國的影視產業帶來了可觀的

  貢獻。



  《Barbie芭比》上映後不僅影響全球文化，更引進一波時尚新潮，甚至連拍攝時都能帶動當

  地經濟效益，芭比成為對英國當地經濟做出近1億美元貢獻的IP，製片公司華納兄弟發現，

  他們在英國倫敦拍攝時，雇用了6千名臨演，提供大量的工作機會，支付了4,000萬英鎊的工

  資，成為當地經濟成長的一大助力。



  而這部電影也在英國獲得超過1億美元的票房成績，相當於全球收入的十四分之一，得到不

  小的貢獻。華納也計劃擴建利維斯登工作室，增加11個新攝影棚，將其打造為DC 影業所有

  項目的重要場地。該公司表示，這次擴建將使影城容量增加50％，創造4,000個新工作崗位

  ，並對當地經濟做出超過2億英鎊的貢獻。


  --'
