url: https://www.ptt.cc/bbs/movie/M.1763568833.A.537.html
title: '[新聞] 【誰想當老大】笑爆南韓年度票房前5名!'
content: '新聞網址：



  爆笑指數全面升級，比《雞不可失》更瘋、更狂的黑幫動作喜劇神片《誰想當老大》，即

  將在本週五（11/21）於台灣歡樂獻映！本片以腦洞大開的劇情、鮮活俐落的角色魅力，

  徹底打破傳統喜劇框架，讓觀眾在毫無防備下被笑點與驚喜連番轟炸，也讓本片在上映後

  橫掃全韓票房，強勢擠進南韓年度票房前五名，口碑更從戲院一路炸到網路社群。導演羅

  熙燦透露，本片劇情概念來自製作公司高層的天馬行空點子，讓他當場笑到停不下來：「

  我嘗試在突出喜劇元素的同時，融入動作戲元素，力求將它們和諧地融合在動作喜劇類型

  當中。」而本片在第一場媒體試映後就引爆口碑，獲得媒體與影評一致盛讚；之後更在

  VIP首映會上吸引玄彬、李棟旭、柳演錫、張東健、禹棹煥、朴炯植、朴荷娜、韓孝周、

  蔡時那、韓善化等重量級韓流男神女神到場力挺。眾星看完後更不約而同給出「今年必看

  」的超高評價，絕對是今年最笑到噴淚、爽度爆表、錯過會後悔的動作喜劇傑作！





  《誰想當老大》南韓一上映便勢如破竹，憑靠趙宇鎮、鄭敬淏、朴智煥、李奎炯四位演技

  派男神的「黃金級默契」火速攻佔票房冠軍。而黃雨瑟惠、鄭釉珍、高昌錫、李星民等實

  力派影星的加盟，更是讓全片火花四射、魅力翻倍；搭配「黑幫搶著不當老大」這個腦洞

  大開的劇情設定，讓觀眾一踏進戲院就笑到欲罷不能。這也讓本片在韓上映短短五天，就

  迅速突破百萬觀影人次，接著更以驚人速度突破兩百萬人次，成為自2020年疫情以來，十

  月檔最猛、衝最快的票房黑馬。累計高達243萬人次佳績，不僅刷新疫情後十月上映電影

  的最高票房紀錄，更穩坐2025年度票房前五名，堪稱今年最「笑」傲影壇的話題之作。



  導演羅熙燦透露，他的創作目標不只是拍一部「好笑的電影」，更要把喜劇與動作揉合成

  一種全新的觀影體驗：「我運用動作元素，同時也融入喜劇元素，我從一開始就努力營造

  那種電影感，讓兩者完美融合，這也讓本片不僅是一部動作喜劇。」而全片「黑幫成員拼

  命逃避當老大」這個最令人拍案叫絕的核心設定，其實就來自製作公司高層的天馬行空點

  子。導演回憶：「如果黑幫成員互相爭著不當老大會怎樣？這個想法讓我不由自主地笑了

  出來。就這樣，故事開始從固定模式中扭轉。」導演也進一步分享，他在創作過程中花費

  大量心思，讓每個角色都有獨特的心境與願望：「雖然劇情曾有『成為老大是一種浪漫和

  夢想』的設定，但本片的核心概念是不想當老大的人，因此，我們必須探討這些角色是如

  何從過去轉變，而他們現在的願望又有哪邊不同。過程中，我認為每個角色的情境和想法

  都必須有所差異，這樣才能讓故事更加有趣。」





  《誰想當老大》在南韓締造驚人票房，不僅因為卡司精湛演出，更因為從媒體試映會起，

  就陸續獲得的爆棚級口碑狂推。媒體如Star News大讚：「每逢節日就會想看的喜劇電影

  ！」《每日經濟》稱其為「輕鬆愉快的爆米花電影！」《日刊體育》更誇讚是「三代同堂

  都會喜歡的開胃喜劇！」讓本片在熱烈好評當中，穩坐今年最具代表性的喜劇之位。不只

  媒體瘋狂按讚，就連南韓群星也在VIP首映會上笑到招架不住，紛紛成為推廣大使。禹棹

  煥大笑：「真的太有趣了！」柳演錫表示：「一定會為大家帶來笑聲！」張東健提醒：「

  千萬別掉以輕心！原以為平淡無奇的劇情，會突然讓你笑到不行！」朴炯植更直呼：「這

  是今年第一部讓我笑到捧肚子的電影！」尹敬浩也笑稱：「一直想到中華料理！這麼好笑

  是可以的嗎？」朴荷娜說自己被逗到「臉都痛了！」韓孝周則形容：「能消除壓力的笑聲

  ！一定要看！」金赫拉也透露自己「笑到電影結束！」韓志恩則盛讚：「痛快、爆笑又有

  趣，什麼都有！」蔡時那也大呼：「李奎炯的笑點太絕了！」韓善化則讚嘆：「能欣賞到

  前輩們華麗又精緻的演技！」如此瘋狂的口碑熱度與明星力挺，無疑證明本片就是今年必

  看的爆笑喜劇傑作。



  這部動作、喜劇、演技一次滿足，節奏緊湊、笑彈連發，以黑馬之姿創下票房佳績、爆笑

  更勝《雞不可失》的南韓黑幫動作喜劇《誰想當老大》，即將在本週五（11/21）於台灣

  歡樂獻映。本片劇情描述黑幫老大突然過世，組織急欲選出新任接班人，沒想到這場繼位

  之戰，竟演變成一場「沒人想當老大」的荒謬鬧劇！呼聲最高的二把手純泰（趙宇鎮飾演

  ），一心只想當中華料理餐廳主廚，與家人平凡度日。曾是組織中的狠角色強表（鄭敬淏

  飾演），如今出獄後只想跳探戈、遠離江湖。兩位最有機會的接班人都想落跑，偏偏唯一

  真正想當老大的三把手板虎（朴智煥飾演），卻沒人把他當一回事。為了實現自己的理想

  ，三人都各出奇招，就在組織混亂失控之際，臥底警察泰奎（李奎炯飾演）潛入純泰的餐

  廳，讓情況再度急轉直下…。究竟這場失控的接班人大戰，誰會成為老大？誰又能全身而

  退呢？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁

  及Threads專頁查詢。




  --'
