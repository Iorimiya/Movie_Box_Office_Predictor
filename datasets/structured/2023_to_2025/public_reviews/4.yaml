url: https://www.ptt.cc/bbs/movie/M.1763466637.A.B84.html
title: '[普雷]《誰想當老大》人各有志，你行你上！'
content: '攸關前途大佬不易，親兄弟也要明算帳


  親兄弟也要明算帳，不只是在血緣關係有時候在江湖上更是如此，俗話說的好：出來混總

  要還，一個不好就是賠上生命的無期徒刑，但也有可能運氣好一點，混出名堂受上面賞識

  ，或成為有頭有臉的大哥。


  但成為有身分的大哥，這也代表此後一幫兄弟都要靠你來養，也將樹敵更多裡外，那當上

  大哥這位置到底好？還是不好？雖然人人想要，但當這個驚喜突然出現在你人生沒有計畫

  的行程裡，當大哥的驚喜，恐怕變成了驚嚇。


  《誰想當老大》是韓國2025賣座的幽默喜劇。故事敘述黑幫老大的突然過世，迫使組織必

  須選出接班人，但組織二把手純泰因為夢想開中餐廳而百般拒絕、出獄後的原接班人強表

  ，因為迷上國標舞完全不想當老大、最想當老大的板虎，卻百般被組織決策團拒絕。在組

  織雞飛狗跳之時，一位臥底警察潛入組織，準備將這群人一網打盡。






  《誰想當老大》是什麼電影？


  曾有這樣的觀點，可以從各國的愛情電影中看見各國在男女平等上，還有感情的價值觀念

  為何？即便過去多年有些變化，能就可以看到該國在詮釋感情上的核心價值。例如日本或

  台灣過往的愛情電影，往往以男女兩方抑制的情感來營造浪漫氛圍，歐美則偏向於將情感

  外放主動出擊來表達男女情愫。雖說不是絕對，但可以說有時候一個電影主題，可以讓人

  看見不一樣的地方、看待同一件事情的角度，往往反映在該地的社會人文上。以這角度，

  通常描繪社會底層的黑道電影，也是很好看見該國家「表」與「裏」，另一種窺看社會文

  化的窗口。


  這也讓黑道電影，其實某方面是一種了解和看到時代變遷有趣的角度，例如從嚴肅的美國

  黑幫電影《教父》（1972）的黑道家族，黑手黨、家族榮耀等傳統文化，被美化成一種黑

  色美學，經典的《四海兄弟》（1984），也是如此，強化陽剛的男性美學，但在90年代後

  ，社會運動、女性主義和後現代主義的美學浪潮，黑道文化不再只是單一面向。


  電視劇《黑道家族》（1999）就開始描繪黑道在逞凶鬥狠之外，日常生活、小孩教養、與

  另一半的感情問題，這種弱化原本黑道的英雄氣質的內容，意外的讓黑道人物有一種，更

  貼近現實，幽默的角色定位，也是黑道電影在悲愴之外，以喜劇故事出現在大眾面前，屬

  於後現代才有的產物。





  有趣的是比起歐美的黑道喜劇，亞洲則是更早就將黑道的幽默與暴力等元素，同時呈現在

  電影之中，這之中香港電影更是佼佼者，將香港黑幫、酒樓、賭場文化融入在電影的香港

  風景中。例如現在還是不斷在電視上重播，連台灣觀眾都已經會背上台詞的經典電影《賭

  神》（1989年，後續90年代依序推出《賭聖》、《賭俠》等後續電影）系列，就是將黑道

  的荒謬與胡鬧展現，而2025年韓國的五大賣座片《誰想當老大》的黑道電影，某方面也致

  敬了香港黑道片中「胡鬧」風格的喜劇元素。


  《誰想當老大》的故事原型，是翻拍香港的黑道喜劇片《飛砂風中轉》（2010），但整體

  呈現的故事重點不大相同。《飛砂風中轉》整體的風格很像港劇八點檔或台灣鄉土劇的呈

  現方式，主要在角色針鋒相對的唇槍舌戰、鬥狠的衝突上。


  《誰想當老大》則是加強的動作場面和誇張化整體黑道們互相陷害、扯後腿百般想讓對方

  當上新任老大的局面，並且在故事的緊湊度和戲劇化也做出更動，可以說跟改編原案的香

  港片，除了題材類似，基本是完全不太一樣的電影故事。










  《誰想當老大》分析與延伸：


  雖然Hive Media Corp公司在2020年時就已經決定要拍《誰想當老大》，並且具體也說電

  影的概念和想法是翻拍韓國版的《飛砂風中轉》。但具體來說，導演－羅熙燦並沒影提到

  翻拍這件事，有可能是作為電影最初原型的大部參考元素。在韓國時報（2025.09）的記

  者會報導上採訪導演羅熙燦的說法為：他覺得這樣不想接老大的反轉構思很有趣、也很另

  類。並沒有提及、也沒否認電影公司參考香港電影《飛砂風中轉》的狀況，但根據一個過

  去既有的原案做改編，在韓國、或是世界的影視圈也並不是甚麼特別的事情。


  韓國電影的黑幫電影原則上是在1987年後解嚴才能有的分類，雖然在50、60年代就有黑道

  相關電影，但明訂上的內容都需要依據官方指導做出修正，這點與台灣可以說是非常類似

  。在全球學術研究分享平台Academia.edu中，根據《小丑、犯罪與資本：後危機時代韓國

  的流行犯罪喜劇》（2009）文章中表示，韓國黑幫電影喜劇化主要的轉則在1997年。


  這年上映的韓國黑道電影《3》很具代表性，故事敘述一個偶然救了黑道大哥的小混

  混，一戰成名後被提升為組織三把手，而捲入爭奪老大席位的混戰之中，雖然不能說是完

  全的喜劇，但在這部片中，韓國導演－宋能漢，與香港黑道片一樣用了「胡鬧」和「亂鬥

  」等元素，讓《3》整體呈現出一種韓國少有的黑道幽默。






  在2000年後，喜劇感較重的韓國黑道片，才一部部出現。搞笑黑道校園電影的《野蠻師生

  》（2001）、《我的老婆是老大》系列（2001）等，但在2010年後因為過度的採用黑道搞

  笑的元素，以略顯老氣，在之後才有比較變體或更有深度的搞笑黑道片出現，像是《老大

  靈不靈》（2013）為了逃過死亡必須當靈媒的黑道大哥、《我裡面的那傢伙》（2019）就

  以黑道大哥與高中生靈魂互換的搞笑題材為主。可以說韓國關於搞笑黑道題材的電影，雖

  然疲乏但從未間斷過，投資方對於黑道題材再登上大螢幕電影缺乏信心，《誰想當老大》

  的電影算是黑道喜劇於韓國再一次登上大螢幕，獲得好票房的新一種黑道喜劇電影。


  有趣的是《誰想當老大》其實算是韓國新舊黑道喜劇的結合體。參考的原港片《飛砂風中

  轉》，本身就是以混亂中帶喜感、外加黑色幽默，讓《誰想當老大》本身就自帶黑道笑料

  中混戰與亂七八糟的有趣風格。


  在2010年偏重故事情節發展，和情感交流的黑道搞笑片，《誰想當老大》除了搞笑之外，

  也比原本《飛砂風中轉》延伸更多角色的細節，讓故事變得比較像是過去的警匪王道電影

  （警察最後與黑道熱戰）這樣的場面，某方面頗有致敬過去被港片影響，韓國高度發展影

  視，推出各種警匪槍戰動作片的90年代風情。








  《誰想當老大》值得一看嗎：


  其實以我來講韓國電影的故事節奏、情節安排，都不太是我喜歡的和風格。韓國電影在網

  路影視媒體剛起步的年代，就往往會有層層疊加、沒完沒了的問題，這點與美劇倒是有點

  類似，如同日本動畫，勇者終於打敗最後的魔王，遠方傳來笑聲，才發現有隱藏的最終幕

  後黑手，黑手可能還是勇者的熟人，讓劇情反轉。


  韓國往往一反轉、再反轉、又再反轉，到讓我覺得沒完沒了。但好在這次《誰想當老大》

  電影並沒有多高潮之處又反轉，整體而言比較是正統，沒有留下懸念的黑道喜劇電影。


  《誰想當老大》給了飾演主要角色的人，很大程度的表現空間，很多時候笑點雖然有點老

  梗，但能笑出來很歸功於演員的顏藝，和誇張的肢體語言，而就像剛剛所分析的，這部電

  影因為原案是港片，所以有一些元素雖然經過改編，但感覺導演有刻意保留一點香港風格

  ，像是在打鬥的時候，一群人大混戰的無差別攻擊，就很有香港黑道片過去的風情，加上

  裡面的主角純泰，一開始賣韓國榨醬麵、後來開上中式餐廳，整個風格又更添港味。









  不過《誰想當老大》主題其實在後期有點跑偏，在電影最開始先是交代人物之間的關係，

  之後才開始進入到黑道大哥死亡，進入接班人的環節，在這裡誰都不想接任黑道大哥，主

  角屢次差點當上，驚險的又逃過一劫，又試圖讓自己用各種方法不要當上老大，而做出各

  種荒唐的行徑，卻帶來反效果。這讓我想到2019年的韓國片《雞不可失》的有趣套路，越

  是故意做歹反而越發成功。導演羅喜燦也說是因為對「打破黑幫片的反套路」很感興趣，

  但是在收尾的劇情，我認為如果也可以維持在不做黑道的智鬥幽默，加上動作戲，會讓電

  影更有意思。


  可以說電影前半段，每個仁互相在推託、逃避成為老大的情節，是我比較喜歡有點黑色幽

  默的內容，比起後面雖然有很多動作戲和胡鬧瘋狂輸出，我反而比較希望電影維持前面的

  風格，只能說《誰想當老大》有一個很王道的結束，但並不是我所料想的。


  像是一直想當老大就沒人理他的板虎，在後期設定有點不出採，就讓人覺得有點可惜，感

  覺應該可以在玩出更多有趣的花樣，但很顯然在這個地方導演選擇與《飛砂風中轉》近乎

  類似的結局安排，如果有一個頗有意思的原創結尾，也許這部片會讓較少看韓國電影的我

  ，更有新鮮感吧。




  --

  個人Blog：

  小說連載頁：


  --'
