title: '[新聞] 【誰想當老大】寫下南韓疫後最強票房奇蹟'
content: '新聞網址：



  爆笑更勝《雞不可失》的南韓黑幫動作喜劇《誰想當老大》，即將在11月21日於台灣歡樂

  獻映。本片由曾打造《魔鬼對決》、《南山的部長們》、《哈爾濱》、《12.12：首爾之

  春》、《找死兇宅》等兼具藝術性與票房號召力的金牌製作公司操刀，以獨特喜劇題材強

  勢回歸，更添製作品質的信賴感。透過一場誰都不想當老大的爆笑「讓位大亂鬥」，以荒

  謬又寫實的情境製造滿滿笑果，更呼應當代Z世代對「個人價值」、「自我實現」、「生

  活與工作平衡」的嚮往，也對傳統成功定義提出一種輕盈反思。全片不但集結趙宇鎮、鄭

  敬淏、朴智煥、李奎炯等實力派演員領銜主演，更有李星民、黃雨瑟惠、鄭柔美、吳達秀

  、高昌錫等黃金綠葉鼎力助陣，加上釜山國際影展首映後的口碑加持，讓本片票房一飛衝

  天，不僅連續八天穩坐南韓票房冠軍，更在八天內突破200萬觀影人次，寫下新冠疫情之

  後，南韓10月份最快突破200萬人次的驚人票房佳績。





  《誰想當老大》故事圍繞一位黑幫老大驟然去世，引爆接班人選的繼任風暴。有別於像《

  朋友》、《闇黑新世界》等傳統黑幫電影的爭權奪位血腥激戰，本片候選人們竟為了追逐

  各自夢想，反而拼命互相讓位——這場誰都不想當老大的爆笑大亂鬥，以荒謬又寫實的情

  境製造滿滿笑果。尤其當黑幫爭權搖身成為「讓位鬥爭」，逆向設定所營造出的驚喜與趣

  味，勢必刷新觀眾對這類黑幫喜劇的想像。而為這個新穎劇情設定更添看頭的，正是全片

  活潑有趣的多元角色－－從實則是黑幫組織二把手、卻立志經營最強中餐館「美味樓」的

  主廚「順泰」，到正統繼承者卻夢想成為頂級探戈舞者的「姜標」，再到唯一真心想當老

  大卻總被忽視的「判浩」，以及中餐廳外送員、實則身分神秘的「泰圭」，每位角色都擁

  有「本業」與「副業」的強烈對比。



  尤其當我們身處在一個被「成功」二字逼得喘不過氣的時代，本片卻反其道而行，以一場

  「老大讓位戰」去幽默反思：「你可以選擇不當老大，只要你清楚自己真正想成為誰。」

  透過這場荒誕卻帶有真實感的讓位喜劇，呼應Z世代對「個人價值」、「自我實現」、「

  生活與工作平衡」的嚮往，也對傳統成功定義提出一種輕盈反思。本片所描繪的，不再是

  爭權奪利的老套路線，而是每個人努力成為理想中的自己－－有人想開餐廳、有人想跳探

  戈、有人想守住自己的崗位，不被現實定義、不為社會內卷所困。在這一切荒謬與夢想的

  交錯中，正好展現當代年輕人「拒絕被定義、活出真我」的主流文化脈動，並透過角色「

  本業」與「副業」之間的巨大落差，創造強烈喜感與共鳴。導演羅熙燦形容這群角色如同

  「脫韁野馬」，充滿不可預測的喜感魅力：「雖然是黑幫題材，但我們不強調義氣，而是

  聚焦角色追尋自我與夢想的過程。」並補充：「要將『不想當老大』的設定，透過喜劇呈

  現必須具備說服力，我們透過黑幫成員追求夢想所面臨的兩難，深入挖掘喜劇張力」。





  值得一提的是，《誰想當老大》在正式上映前，就獲選釜山國際影展「今日韓國電影—特

  別首映」單元，進一步證明其完成度與國際潛力。尤其該單元精選兼具娛樂性與藝術價值

  的當代南韓商業大片進行首映，賦予本片高度肯定與別具意義的起點。影展方並盛讚本片

  ：「這是一部令人耳目一新的動作喜劇電影，它以令人熱血沸騰、神經緊繃的『老大讓位

  戰』為背景，充滿了高度笑料。演員們的表演妙趣橫生，再搭配獨特的動作場面，進一步

  提升娛樂性，引發陣陣笑聲。全片節奏明快、結構紮實、喜劇元素濃烈，是一部令人回味

  無窮的動作喜劇。」



  延續影展口碑效應，本片尚未上映就空降預售票房冠軍，觀眾熱度爆棚。上映後更勢如破

  竹，口碑與票房齊飛！不僅在各大電影網站奪得近滿分好評，橫掃各年齡層觀眾心目中的

  年度喜劇寶座，更連續八天穩坐南韓票房冠軍，並僅用八天時間就突破200萬觀影人次，

  寫下新冠疫情之後，10月最快突破200萬票房的驚人成績，並穩居年度本土電影票房前五

  名，也讓這部節奏明快、笑彈連連、全程無冷場的爆笑神作，勢必在台灣掀起觀眾話題，

  再度引爆一波瘋狂喜劇旋風！



  這部動作、喜劇、演技一次滿足，節奏緊湊、笑彈連發，以黑馬之姿創下票房佳績、爆笑

  更勝《雞不可失》的南韓黑幫動作喜劇《誰想當老大》，即將在11月21日於台灣歡樂獻映

  。本片劇情描述黑幫老大突然過世，組織急欲選出新任接班人，沒想到這場繼位之戰，竟

  演變成一場「沒人想當老大」的荒謬鬧劇！呼聲最高的二把手純泰（趙宇振飾演），一心

  只想當中華料理餐廳主廚，與家人平凡度日。曾是組織中的狠角色強表（鄭敬淏飾演），

  如今出獄後只想跳探戈、遠離江湖。兩位最有機會的接班人都想落跑，偏偏唯一真正想當

  老大的三把手板虎（朴智煥飾演），卻沒人把他當一回事。為了實現自己的理想，三人都

  各出奇招，就在組織混亂失控之際，臥底警察泰奎（李奎炯飾演）潛入純泰的餐廳，讓情

  況再度急轉直下…。究竟這場失控的接班人大戰，誰會成為老大？誰又能全身而退呢？



