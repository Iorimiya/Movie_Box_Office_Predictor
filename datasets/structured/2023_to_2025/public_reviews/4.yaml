url: https://www.ptt.cc/bbs/movie/M.1762432871.A.392.html
title: '[新聞] 鄭敬淏【誰想當老大】苦練探戈到指甲脫落'
content: '新聞網址：



  爆笑更勝《雞不可失》的南韓黑幫動作喜劇《誰想當老大》，即將在11月21日於台灣歡樂

  獻映。本片自南韓上映以來，票房氣勢如虹，短短五天就突破百萬觀賞人次，更成為疫情

  後10月上映作品中最快衝破200萬觀眾的電影。截至昨日（11/5）吸引超過242萬名觀眾進

  場，穩坐2025南韓電影年度票房第五名寶座，可說是話題與人氣兼具。主演之一的鄭敬淏

  ，以「顛覆自我」之姿，睽違三年華麗回歸大銀幕，不僅在片中頂著金黃色髮型、露出帥

  氣刺青，化身酷勁十足卻意外愛上探戈的黑幫成員。為了詮釋這個既優雅又危險的角色，

  他不僅親自演出所有動作戲，以俐落的木劍決鬥展現凌厲氣勢，更花費三、四個月苦練探

  戈舞蹈，全程零替身親自上陣，還一度練舞練到指甲脫落，用行動證明他對角色的投入與

  熱情。當被問到是否請教交往13年的戀人、女團「少女時代」成員秀英幫忙指導舞步時，

  鄭敬淏笑說：「我哪敢啊！關於跳舞的事，我根本不敢問她！」幽默回應不僅閃光滿點，

  更讓粉絲見識到他真摯又可愛的一面。





  別出心裁的黑幫動作喜劇《誰想當老大》，講述黑幫老大突然逝世，組織裡的兩位二把手

  因此成為繼任的理想人選。然而，一個拒絕當老大，夢想成為中華料理主廚，一個則夢想

  成為探戈舞者，兩人因此展開一場「不想當老大」的激烈較量，而鄭敬淏便在片中飾演已

  經是黑幫合法繼承人，卻因為沉迷探戈，以至於要擺脫當老大的「強表」。鄭敬淏這回也

  將成為全片的「視覺擔當」，以他獨特的傲嬌魅力、時尚品味，以及超出預期的舞蹈實力

  ，展現全新面貌與精緻的喜劇感。當被問到片中的西裝造型時，他靦腆笑稱：「只要穿上

  西裝，任誰看起來都會很帥吧。」接著又表示：「其實我對西裝版型很挑剔，試穿了很多

  次，特別是在跳探戈的時候更是如此。不僅是整體的合身度，就連跳舞時若隱若現露出的

  手部線條也要好看，為此我還特地加上刺青造型，為的就是要讓角色在視覺上更具說服力

  ，我對此煞費不少苦心。」



  尤其他在片中的身形相當纖瘦，他也坦言：「不只是這部電影中的角色，我目前正在拍攝

  的電視劇《Pro Bono》中的角色設定也是非常瘦，不過我並沒有特別要去減重或增重。畢

  竟我現在已經四十多歲了，也該考慮稍微增點肉。等電視劇結束後，我打算正式開始運動

  ，試著讓身體結實一點。」他更放話：「是時候該跟『骨感男』這個稱號說再見了。」





  據悉，原本「強表」在《誰想當老大》的角色設定，是位沉迷於鋼琴的人物，但考量短時

  間內學好鋼琴並非簡單之事，便將設定改成迷戀於探戈舞蹈。鄭敬淏也因此全心投入練習

  ，一練就是三、四個月，他表示：「某次偶然跟導演一起去探戈酒吧，當時導演正在上探

  戈課，於是我就提議『讓強表跳探戈怎麼樣？』，後來從劇本閱讀會開始，我就專注在舞

  蹈上面了。」他補充：「實際學習探戈之後，發現真的相當有魅力呢，我甚至還推薦給我

  的父母一起學習。那是一個與演戲完全不同的新世界，若想展開那樣的新世界，就必須真

  正去學習，我最近也一直在和身邊的人大力推薦探戈。」



  尤其探戈是所有舞蹈中難度最高的一種，非常消耗體力，動作可以抒情，也可以充滿張力

  ，鄭敬淏為此付出很多努力，甚至花費一個月時間只練步伐，並一度在練習過程中練到指

  甲脫落。雖然他坦言對自己的舞蹈動作有些遺憾，但所有舞蹈場面都是由他親自上陣，沒

  有使用替身。從他親自完成所有表演的事實中，仍能清楚看出他對本片傾注的努力與熱愛

  。當被問到是否請教交往13年的戀人、女團「少女時代」成員秀英幫忙指導舞步時，鄭敬

  淏笑說：「我哪敢啊！關於跳舞的事，我根本不敢問她！她大概只會覺得『啊，他就那樣

  吧』而已，我們平時也不太會彼此討論演戲的事情。」最後，他強調本片是一部「非常適

  合與家人朋友一起觀賞的電影」：「它非常適合大家一起在電影院觀賞，一起歡笑、一起

  享受樂趣，這才是本片的真正魅力所在。」



  這部動作、喜劇、演技一次滿足，節奏緊湊、笑彈連發，以黑馬之姿創下票房佳績、爆笑

  更勝《雞不可失》的南韓黑幫動作喜劇《誰想當老大》，即將在11月21日於台灣歡樂獻映

  。本片劇情描述黑幫老大突然過世，組織急欲選出新任接班人，沒想到這場繼位之戰，竟

  演變成一場「沒人想當老大」的荒謬鬧劇！呼聲最高的二把手純泰（趙宇振飾演），一心

  只想當中華料理餐廳主廚，與家人平凡度日。曾是組織中的狠角色強表（鄭敬淏飾演），

  如今出獄後只想跳探戈、遠離江湖。兩位最有機會的接班人都想落跑，偏偏唯一真正想當

  老大的三把手板虎（朴智煥飾演），卻沒人把他當一回事。為了實現自己的理想，三人都

  各出奇招，就在組織混亂失控之際，臥底警察泰奎（李奎炯飾演）潛入純泰的餐廳，讓情

  況再度急轉直下…。究竟這場失控的接班人大戰，誰會成為老大？誰又能全身而退呢？



