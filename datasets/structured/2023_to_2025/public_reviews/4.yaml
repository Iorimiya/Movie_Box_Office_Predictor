url: https://www.ptt.cc/bbs/movie/M.1764147683.A.3B5.html
title: '[ 好無雷] 韓國新映喜劇 誰想當老大 反轉題材'
content: '昨天難得提早下班真的腦袋放空，不想想太多

  跟朋友一起選了部輕鬆的韓國喜劇《誰想當老大》竟然出乎意料地好笑

  而且還看到一堆周星馳電影的影子有夠懷念 XD



  以前就覺得《雞不可失》《樂透大作戰》都很好笑

  尤其電視每次重播我還是會看一下，有沒有人跟我一樣超過五刷的XD

  這次居然又讓我在韓國電影裡體驗到那種熟悉的港式無厘頭 vibe，很中二但有趣


  裡面很多橋段真的超像在致敬星爺，不爆雷但舉幾個元素：

  像是一本正經的胡說八道肯定要有、角色用奇怪招式互尬、突然轉超誇張慢動作、以及莫

  名其妙的中華料理武功跟斧頭（？）

  真的會讓人瞬間想到《功夫》《食神》《破壞之王》那味道，看來韓國人也是深受周星馳

  影響


  另外演員反差也挺大

  幾個主演趙宇鎮、鄭敬淏、李星民、高昌錫、朴智煥這些平常都演比較嚴肅、硬派角色的

  人

  這次全部放飛自我，搞笑起來毫無包袱，尤其是幾幕誇張反應真的笑到我差點噴飲料

  趙宇鎮上一部還狠到要殺人，這部直接變中華一番小當家還超怕老婆，反差超級大

  鄭敬淏在《機智醫生》刀子嘴豆腐心，這部竟然用國標舞打架，白癡又好笑


  你平常看到他們演黑幫大哥、刑警、老爸那種角色

  在這部片你會看到180度完全反差的形象


  整部片節奏很輕鬆，不需要動腦，有笑點、有黑道題材、有中華料理元素

  看完心情就是好

  如果你最近不想看太沉重的片，或者只想找一部穩穩放鬆、會心一笑的喜劇

  推這部可以安心踏進電影院

  預告也不用先看才去，因為劇情很容易理解


  給個分數：8.3/10

  推薦給喜歡韓國喜劇、星爺風格、或是單純想放鬆的～


  --

  我是滑IG看到的廣告 應該是打網路廣告而已

  沒錯 只可復刻再模仿 看能不能有新生代星爺出現

  黑道題材可血腥可搞笑

  他是唯一符合這部片片名 真心想當老大的人XD

  難怪他們也愛拍這樣風格的電影'
