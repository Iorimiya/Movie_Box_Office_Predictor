url: https://www.ptt.cc/bbs/movie/M.1702309375.A.5B9.html
title: '[新聞] 黃鐙輝拍《BIG》自爆無照駕駛'
content: "黃鐙輝拍《BIG》自爆無照駕駛\n\n04:10 2023/12/11 中國時報 李承陽\n\n\n黃鐙輝在電影《BIG》中飾演遊覽車司機。（米倉影業提供）\n\
  \n\n黃鐙輝成功考取大客車駕駛執照。（摘自臉書）\n\n導演魏德聖最新電影《BIG》現正熱映中，主演之一的黃鐙輝9日赴高雄參與北高雄家扶中\n心電影包場的映後活動，與觀眾近距離互動、分享電影拍攝點滴，在《BIG》中，黃鐙輝\n\
  飾演1名遊覽車司機，時常出現他開著遊覽車到處跑的劇情畫面。\n\n後來在電影殺青後黃鐙輝也報名了大客車訓練課程，並成功考取執照，在臉書發文曬出駕\n照，更自曝在拍攝時是「無照駕駛」，不過他解釋是在有管制的安全環境裡，由專業人員\n\
  指導下完成拍攝，請大家不用擔心。\n\n黃鐙輝感性表示，兒時記憶中的父親也像他在《BIG》裡飾演的司機一樣，「為了養活一\n家人四處奔走做生意，1個禮拜只回來1、2天，沒日沒夜地工作只為了養活一家人。」他\n\
  十分感念父親的辛勞，字裡行間真情流露。廳內活動結束後黃鐙輝開臉書直播，帶觀眾搭\n上耶誕燈裝飾遊覽車，還原電影經典場景，與北高雄家扶的觀眾留下難忘回憶。\n\n\
  #big #遊覽車 #養活 #父親 #觀眾\n\n--\n佛法的\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\
  \n--"
