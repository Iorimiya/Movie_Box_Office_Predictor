content: '二十幾年前，導演還不是「魏導」的時候，因工作採訪了兒癌病房的大孩子，原本以為只是

  一段普通的影像採訪，沒料到孩子說出一句「雖然治療的時候很痛苦，但在這裡沒看過不想

  活的小孩」，這句話印在導演腦海中揮之不去，看著眼前這位過早體會人生無常，卻更活出

  生命熱忱的孩童，就像上了一課震撼的生命教育，導演在心中默默種下了一顆種子


  從去年的最低谷到重生，2022年4月導演決定要拍將這個劇本付諸實現，希望能在這個社會負

  能量過多的後疫情時代，傳遞溫暖正能量，給大家，也給自己。

  《BIG》即將開拍，2023聖誕節，讓孩子拯救世界！


  #年度強檔 #不是史詩片 #是兒童電影

  #BIG #即將開拍

  #後疫情時代的暖心正能量

  #2023聖誕節 #讓孩子拯救世界！


  #臺灣三部曲動畫持續製作中


  ——

  會加入魏式笑點嗎

