url: https://www.ptt.cc/bbs/movie/M.1463920311.A.DB4.html
title: '[Live] 局長的總統遊戲       星星台21:00'
content: '總統遊戲 Big game


  Star movies

  21:00 ～ 22:50


  局長沒有演美國隊長3, 因為跑去當總統後,又被Hydra襲擊困在山上

  結果遇到一個小小Avenger...

  --------------------------------------------------------------------------------

  節目介紹

  本片是《聖誕壞樂》導演賈馬里赫蘭德最新作品，片中顛覆了小孩與大人在真實社會中的

  定位，使用了不少特別的慢動作剪接手法，影片在芬蘭雪景實地拍攝。


  美國總統座機「空軍1號」遭遇恐怖份子襲擊，墜落於芬蘭雪地上；孤立無援的美國總統

  幸得一位13歲小獵人的協助才躲過獵殺，兩人首先要面對的是如何在充滿兇禽猛獸的荒山

  野嶺中度過一晚，更要查出到底誰才是暗殺總統的幕後主謀；與落難總統相遇的青少年，

  不僅要挺身相救保護他免於追殺和挾持，更希望以此證明自己的能力。


  出身於芬蘭的歐斯卡里必須像祖先、爸爸及其他男孩一樣，以在諾大的芬蘭森林中平安地

  度過一天一夜的方式，接受成年禮的洗滌，並帶回自己的狩獵品當作已成年的證明。但是

  在命運巧妙的安排下，他卻遇上了美國總統的座機「空軍一號」遭擊落，青少年與美國總

  統這兩人不僅要在險惡的環境下攜手合作共同生存，更要躲避恐怖份子的追殺並且尋求協

  助，安然地度過這驚險的24小時。


  --'
