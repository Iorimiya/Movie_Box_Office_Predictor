title: '[好評無雷] big hero 6 大英雄天團 '
content: "(無雷感想)\n\n如果說去年的Frozen是讓全世界的小女孩們都瘋狂的作品，\n那麼Disney今年的Big Hero 6\n就是讓全世界喜歡機器人的小男孩(以及日本人)瘋狂的作品了。\n\
  \n故事流暢明快，\n甚至有點太明快了以至於某些地方情緒醞釀的時間不太夠XD ( 但我還是哭了兩次... )\n不錯看，雖然這個班底的作品我還是比較喜歡\"無敵破壞王\"\
  。\n\n話說本片真的不是Pixar的嗎???\n裡面沒有公主啊!!!! 這不Disney啊!!!!!\n\n然後抱怨一下不管是Frozen還是本片，原版的預告都超差的，完全不吸引人\
  \ = =\n( 我指的是Frozen最先推出雪寶和麋鹿在冰上搶紅蘿蔔 &\n  Big Hero 6 男主角改造機器人幫它穿盔甲然後盔甲一直彈開這兩個預告\n\
  \  因為我在戲院是看到這兩個  看完後對電影一點期待感都沒有XDDDD )\n反倒日本版的預告雖然爆雷不斷但很感人!!!\n( 這片日本居然比台灣還早上映，嚇死我了...\n\
  \  <-- 日本的好萊塢電影大多比台灣晚4~6個月上映 )\n\n日本的預告完全走催淚風\n\n\n美國則是...冒險風?\n\n\n\n對了，本片片尾有不算短的彩蛋毆!!!\n\
  ( 聽說出場的是個大咖人，但我不知道是誰耶XDDD )\n\n\n\n\n--"
