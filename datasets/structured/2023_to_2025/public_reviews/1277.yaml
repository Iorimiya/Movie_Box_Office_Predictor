url: https://www.ptt.cc/bbs/movie/M.1424013009.A.9EC.html
title: '[普雷] Big Hero 6 - 大英雄天團'
content: '網誌圖文版



  =======


  好看，但也就是一部好看的商業片罷了。


  這部片是由漫畫改編而來，

  劇情描述的是天才少年阿廣與去世哥哥阿正發明的醫療機器人杯麵一起維護和平。

  喔，還有哥哥的大學同學們，但這些同學們在電影裡是實實在在的配角，

  雖然他們的特殊能力和三太子哪吒以及星海中的狂戰士重疊了，

  但我還是很希望他們的戲份能多一點。


  雖然出場人物不少，但整部戲的靈魂人物就只有三位(或者說兩位)，

  阿正、阿廣與杯麵。而劇情主軸也圍繞著這三位人物而展開，

  阿正從對於哥哥的去世無法忘懷，到在杯麵身上找到救贖。

  對於這樣的一點都不創新的劇情，我很想說本部片處理的恰如其分，

  但我發現我做不到，我無法忽視節奏過快這顯而易見的缺點。


  這是唯一的缺點，但對我而言很致命。

  阿正的大學同學除了噴火蜥蜴費吉拉之外，其餘的人可說毫無存在感。

  且為了讓觀眾迅速與杯麵建立感情連結，前半部的劇情推進非常快速，

  甚至可說是草率，讓人覺得十分可惜。

  類似的劇情，長達27話的日本動畫「天元突破」就帶給我更大的感動，

  我相信如果能給這部電影更長的時間，感情的帶入感會更深刻。


  除了劇情進展過快這個缺點，我也想不到其他可挑剔之處了。

  動畫夠絢麗，觀眾也看得到阿正的成長，

  但就像是毫無感情的鋼琴手所演奏的樂曲一樣，沒辦法讓我印象深刻。

  這部片好看嗎?當然好看；但我不會說它是上乘之作，

  因為片中的一切都太公式化，完全能猜出接下來會怎麼演。


  或許是因為我看到太多人說這部片好看，所以我的期望很高，相對的失落感也較重。

  但如果你是想放鬆心情看一部商業片，或不知道要挑一部電影給孩子們，

  這部「大英雄天團」會是非常好的選擇，

  但不用太期望此片會帶給你多大的感動或深刻的反思。


  最後附上本片主題曲，是首好聽的歌，但也就是一般的好聽，就跟這部片子一樣。



  --



  --

  的確給小朋友看的片子不用拍得太深入，

  只是太多的好評讓我期待過罷了，

  但仍然是部好看的電影'
