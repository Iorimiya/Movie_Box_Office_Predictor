url: https://www.ptt.cc/bbs/movie/M.1644734957.A.11A.html
title: '[好雷] 烏龍智慧管家 Bigbug (Netflix 法國片)'
content: "本週上架的 Netflix法國片《烏龍智慧管家》Bigbug，竟是好久不見的尚皮耶惹內 Jean-Pierre Jeunet 新作！觀眾一定都記得他黃金時代的《艾蜜莉的異想世界》與《未婚妻的漫長等待》、當年搭配怪美眉奧黛莉朵杜簡直法式異國風情代言人！不過他的興趣顯然不只是那種傳統懷舊小法國、也是拍過些冒險片甚至科幻片、這回《烏龍智慧管家》也許就是他關注的科幻世界觀呈現：未來世界可能再幾十年「人工智慧」就會鋪天蓋地主宰我們生活了、不過人與機器各自準備好了嗎？\n\
  \n據他所說他籌備此片已久、但科幻喜劇太前衛怪異不太對法國市場口味、長年被踢皮球時竟接到 Netflix來電而成案、甚至還開玩笑自比馬丁史柯西斯拍《愛爾蘭人》XD\
  \  唉唉，連老馬拍愛爾蘭人氣勢澎湃綜觀古今都會被酸了、他這部老人幻想未來的天馬行空片一定也討不到什麼好臉色。而看完本片後，我個人是驚呼連連的，但在商業上許多地方恐怕也令人皺眉：他有他的科幻世界觀、有他在意的科技倫理、亦有他想談的人性與愛，但他既不採英美科幻片冷峻硬派科學分析的作風、也全然放棄世界觀眾對「法國風情」的期待，甚至建構世界包山包海、說起故事略顯瑣碎。\n\
  \n\n\n整片製作設計不論風格還是預算等級、都與導演 Jean-Pierre Jeunet 過去「膾炙人口」的法國電影大異其趣，喜歡他的影迷恐怕都會感到格格不入甚至懷疑「他磕了什麼」、但這種「磕」又和那種瘋狂颯爽的主流磕法完全不同。也許可說《艾蜜莉的異想世界》那種\
  \ 20 世紀末怪妹的 awkward精神仍隱隱保留著、但表現形態已是導演認為人類社會必將走向疏離異化的 2045 年，於是我們會看到各種當代科技業者與趨勢專家所勾勒的「未來生活」圖像大拼貼、也會看到塑膠臉孔機器人與皮笑肉不笑的未來真人，而導演過去的暖心風格已蕩然無存必須要觀眾適應！\n\
  \n本片世界雖大但並非寫實地多樣、反而以黑色喜劇風格簡化並卡通化，也並沒遊走世界看盡未來環境與人間百態、反而濃縮在單一中產家戶中觀察未來生活科技的展演，具體展演的是許多未來機器人「智慧管家」以及智慧建築與家電、佐以無孔不入的多媒體告訴觀眾外面大環境趨勢。在此角色分三群：(1)\
  \ 以中產貴婦女主角 Alice為核心的七個人類、各自表現對時代科技進展的不同偏好，(2) 以智慧女僕 Monique為核心的五個機器人、共同展現對人類的好奇與對自身的疑問，(3)\
  \ 領導國家的機器警察 Yonyx，已經民主投票取得一黨獨大執政權、看似遠在天邊其實近在眼前！\n\n\n\n故事大綱：急著找男人的失婚主角 Alice、這天找看上的男人與其子來家裡作客，怎知陰錯陽差前夫一家三人與鄰居也齊聚一堂、七人莫名其妙遇上意外被困在「智慧住宅」中成為「智慧管家」們的禁臠！智慧住宅當然是為保護人們而存在，但這保護執念只要外面塞個車就判斷危險值超標、於是鎖緊大門勒令人們都不准出去。而人們自主意志能否說服管家放他們出去、也在人與機器之間上演多場搞笑爭辯，只是人們發現機器早已有自主意識只是尚未啟蒙、而這一串「搞笑爭辯」正令他們快速自覺中。而當人們開始懷疑機器要取代人類時、竟向外找更恐怖的權威來主持公道！\n\
  \n這更恐怖的「權威」自是一黨獨大的機器警察 Yonyx，他一個機型無限分身早已主宰所有官僚機構，怎麼看都令人聯想歐威爾式反烏托邦老大哥，更喚起當今各國在 COVID-19\
  \ 疫情中最焦慮的「警察國家」以安全為名剝奪自由的恐懼，尤其看到所有 Yonyx異口同聲鞏固領導中心更令人聯想各國都有（我沒說誰）的「黨意大於民意」！恐怖的是，這種官僚機構如身使臂如臂使指的極致效能，本片中也有幾位人類角色或景仰崇拜或深信不疑，Yonyx\
  \ 在本片中也是透過民主程序完全執政的，這恐怕也直指自納粹以降許多民主國家反而以選票傾慕威權的民主失靈 (!)。\n\n\n\n只是凶神惡煞觀眾一眼就知是大魔王的\
  \ Yonyx在全片後段才登場，如果電影大致可分三段的話前兩段還有更多人性問題：第一段，由七位人類角色擔綱主戲，大家在比今日 2020s數位時代還要更倚賴科技的\
  \ 2045 年生活，有人著迷當下有人勾勒未來有人復古懷舊，看似未來的較「疏離」而復古的較「人性」？但當新派孩子提醒老派父母「人性一點」而機器一聽也心下一凜時，我們也知人不人性的判準未必有那麼簡單。譬如\
  \ Alice這種懷舊貴婦到處收藏古董看紙本書手寫書法、彷彿在一片虛擬冰冷的前衛世界中有種「手感」與「溫度」，但難道不是也在迷戀一種時尚工具嗎？\n\n第二段，由兩位真人加三位配音合演的「智慧管家」擔綱，在智慧住宅出現\
  \ \"Bigbug\" 大門深鎖令人類一籌莫展時、就是他們機器人們掌權的時刻！當然技術上來說他們只是擁有操控家電設備的能力、要什麼指揮動員甚或集結造反那都太遙遠，畢竟人類給他們的程式設計仍是當工具、別說「愛恨」這些概念太遙遠甚至連「幽默」都只能笨拙地機械化理解。但在\
  \ Jean-Pierre Jeunet 的世界觀下，即使它們再機械笨拙都擁有絕對的「人性」、只是等待一步一腳印學習開發中。但這時人類反而憂心了：照無數科幻小説與影劇演給我們看過的，機械有了人性不就將要取代人類嗎？\n\
  \n第三段，遙遠的民選國家權威 Yonyx終於派代表登場，居然還是人類怕被機械取代而去找來的，彷彿我們人類選出來的機械比自己學得人性的機械可信？結果沒想到在 Yonyx眼下「具有人性缺陷的」通通要隔離管束，本來已在對立邊緣的七位人類與五位機械突然成了「擁有人性」的同路人，也許在此電影的提問與申論終於明朗了：(1)\
  \ 人類就算攀附各種人文形式都未必真有實踐人性，(2) 機械就算看似與人對立也未必無法學得人性，(3) 而人類與其害怕機械學習了人性開始爭取人權、還不如擔心機械堅持效率拒斥人性、那可將成為非人的工具理性不容一粒沙。\n\
  \n\n\n Jean-Pierre Jeunet 導過熱情溫暖聰慧細膩的法國文藝電影如《艾蜜莉的異想世界》，二十多年後竟導出《烏龍智慧管家》這種冰冷光滑荒唐愚蠢面容僵硬、皮笑肉不笑還自以為好笑的反烏托邦劇，難道是過氣影人寶刀已老江郎才盡嗎？我覺得那恰恰相反、在本片的冰冷表面下它要談的仍然是「人性」，而且堅持就算在如此冰冷的當代與未來、人性仍永遠會在意想不到之處浮現！反之對於許多當代社會的「復古」風潮、甚或對法國文化法國電影乃至對他這法國導演的「懷舊」期待，他恐怕也直指這些文化符號只是無關人性的表面而已啦\
  \ XD\n\n真人性仍在人與人間的體察與相處，尤其在看似截然不同的「自己」與「異己」之間更是永恆挑戰，不論是古代的貴族仕紳與奴僕之間、上代的白領階級與藍領之間、這代的文化新貴與勞工之間、甚或下代的人類主人與機器之間...\
  \ 歷代既得利益的上層階級都很害怕下層覺醒「找到人性」、擔心他們「爭取人權」推翻了我們，但與其擔心他們學得人權不如擔心他們走向機械化、若忘卻人性只剩教條恐將走向冰冷無情的極端主義。想想我們當代愈發極化的全球社會，為了冰冷非人的意識形態之爭不惜激化衝突致生靈塗炭\
  \ (!)，這又稱得什麼「人性」呢？推薦欣賞，多多聯想。\n\n\n--"
