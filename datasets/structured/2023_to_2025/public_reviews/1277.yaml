title: '[超好雷] 飛進未來/Big 大推讚讚'
content: '雷文防雷資訊頁




  圖片取自網路

  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  防雷

  防雷

  防雷

  防雷

  防雷

  防雷

  防雷

  防雷

  防雷

  陳雷

  防雷

  防雷

  防雷

  防雷

  防雷

  防雷

  防雷

  防雷

  防雷


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  有幸在30歲的這年可以看到這部這麼有感觸的電影，謝謝湯姆漢克，然後女主角好像怪奇

  物語的Eleven！讓我看得目不轉睛的！

  還有一開始以為是回到未來的系列作之類的，沒想到根本無關哈哈哈


  一開始小男主喜歡的那個朋友姊姊，以為他長大後會去找那個朋友姊姊，結果是自己開了

  一條新支線XD

  雖然一開始很驚訝喬許居然可以在公司上班又當上副總，但想想是一間玩具公司，他的工

  作又是負責玩玩具，又突然可以接受了XD

  不過中間喬許因為樂於工作一度忽略他童年的好朋友也有點感傷，原來在汲汲營營的世界

  裡有些人真的容易被忽視QQ在此呼籲大家在這世界的洪流中還是要珍惜身邊的人><


  很喜歡看到保有赤子之心的大人，以前我也是這樣的人，但或許出社會四五年之後也被社

  會洗禮了，沒辦法像以前那樣整天像個小孩子天馬行空了，就像喬許最後找女主一起回到

  童年的時候，女主也說了自己回不去，因為人生已經經歷到實際的30歲了，就算身體回到

  小時候，腦袋也不是13歲的腦袋了，完全可以理解._.


  最後是一直以為這部會跟童夢奇緣（劉德華演的）一樣一直變老而且回不去，但最後喬許

  還能許願回到小時候真的很羨慕，很多時候我也想回到小時候…想去找祖塔許願機了


  推薦沒看過的版友們可以去看看！！！



  --'
