title: '[新聞] 魏德聖《BIG》上映三週仍後勁十足 口碑'
content: '魏德聖《BIG》上映三週仍後勁十足 口碑爆棚 好評聲浪不斷

  by 威傳媒Max | 12 月 22, 2023 | 娛樂


  【威傳媒記者林志毅報導】


  　　魏德聖編導最新電影作品《BIG》現正於全台戲院熱映中，電影《BIG》以兒童癌症病

  房為故事背景，講述六個來自不同社會階層的家庭，從彼此衝突到互相扶持的溫馨故事。

  疾管署副署長羅一鈞也大讚電影笑中帶淚、淚中帶笑。國健署署長吳昭軍看完電影也

  感動地表示「我們活著要有更大的意義，來做更多的事情」。導演魏德聖也希望大家能走

  進戲院觀賞《BIG》，呼籲「沒有生死離別，哪來珍惜生命，活著就有希望，帶來正面力

  量，816 的孩子們抹去眼淚和嘆息，用歡笑和勇敢來面對這麼大的生命課題」。



  　　，藝人也紛紛在社群上分享心得：歌手梁文音表示「

  太喜歡的一組演員陣容，也有好多的意想不到」，林佩瑤看完後發文自嘲「又笑又哭，嘎

  吶蕭婆」。知名編劇吳洛纓臉書直言「不濫情、不做作、非常直接」，資深影評人鄭秉泓

  大讚魏德聖「」。歌手鄭怡在臉書貼文

  給予曾沛慈和鄭又菲正面評價「很喜歡曾沛慈媽媽的角色，和堅強血癌的女兒源源是最強

  母女」，藝人丁寧在社群表示「BIG 讓你重新看到生命的價值」，何如芸也分享觀後感「

  不是要闡述人生有多悲傷，而是要表達生命有多值得珍惜」。孫協志除了包場支持電影，

  更大方發文「」，宏都拉斯也二刷推薦「那

  種感覺更深刻，會讓你更深愛著你的家人」。資深演員陳仙梅在映後與魏德聖合影留念，

  並上傳臉書寫道「相信我，看了你絕對會愛死」。



  　　導演魏德聖也分享了電影《BIG》創作的理念，因為在醫院裡接受治療的孩子不能隨

  意離開病房，到動物園玩更是不可能的戶外活動，因此特別在劇情裡加入一段參觀動物園

  的劇情，藉此呈現角色們不同的心境變化，同時也打破大眾對於兒童癌症病房嚴肅、冰冷

  的刻板印象，以明亮的畫面、輕鬆的劇情和生動的動畫片段，帶領觀眾重新感受生命意義

  。


  　　國內知名的薩提爾教養專家李儀婷老師，更在其臉書粉專「李儀婷的薩提爾教養」中

  撰寫長文推薦，李儀婷老師表示：「看完電影後，我淚流不止，不是悲傷，而是充滿希望

  的流淚，因為生命本就是如此，誕生後品嚐人間困頓情暖，離開後相互道別，希望有機會

  能再度相見，生命於是禮成。這部「BIG」真的是一部，娛

  樂效果高，故事張力強，非常能帶動歡樂氣氛，帶給觀影者歡樂」。



  　　但是，李儀婷老師也驚訝於一部查看全台的戲院，，她呼籲大眾給電影BIG

  一次打動你的機會，進電影院去看BIG，去體驗魏德聖導演說的「只要進電影就能打動觀

  眾」是不是真的，去開放自己的體感，讓自己有機會參與的行列，讓它有機

  會在台灣的戲院裡能繼續呼吸！






  備註：

  新聞寫好評不斷，

  又寫但是遭到負評海嘯淹沒？


  臉書IG好評不斷，

  上映場次卻銳減到一場的原因是？


  --'
