url: https://www.ptt.cc/bbs/movie/M.1417762976.A.FDA.html
title: '[好雷]迪士尼動畫 / 大英雄天團 Big Hero 6'
content: "圖文網誌\n\n\n文字網誌\nBig Hero 6\n\n\n\n\n昨天到京華城去看 大英雄天團 Big Hero 6 的試映會  ♥\n\
  沒想到看個卡通電影會讓我這麼感動阿\n而且試映會的票超級無敵可愛，是杯麵耶！而且還可以翻開，我要收藏\n\n\n\n這是一部美國的3D電腦動畫超級英雄喜劇電影，\n\
  由華特迪士尼動畫工作室製作、華特迪士尼影業發行。\n而《大英雄天團》也是第一部以漫威漫畫角色為主的動畫電影\n\n\n2014年10月23日在東京國際影展首映，2014年10月31日在阿布達比影展以3D上映。\n\
  2014年11月7日於全美上映。2014年12月31日在台灣上映\n\n\n話說一開始我還很不解，為什麼主要的場景跟一些人名幾乎都是以日文在命名\n不過背景設定是以舊金山跟日本結合的\"\
  San Fransokyo\"\n\n\n故事也從本來利用超能力打擊犯罪的成員，改成各個成員發揮自己的能力\n迪士尼把裡面的人物與角色，重新包裝之後變的很可愛\n\
  \n\n\n\n原本漫畫裡的角色設，長的不是很可愛哈哈\n這個好日本動漫風喔，我比較喜歡迪士尼改編之後的版本:D\n\n\n\n\n(((以下有雷)))==========\n\
  \n\n男主角Hiro是中間這一位，他是一個天才\n也是機器人的狂熱分子，熱衷於參加各個大大小小的機器人賭博比賽\n\n\n\n\n他有一位好哥哥濱田正(Tadashi)，總是在一旁鼓勵著弟弟\n\
  甚至還帶他去自己的實驗室，讓弟弟埋下了想進大學繼續學以致用，把機器人發揚光大\n這也是杯麵(Baymax)第一次的出場\n他其實長的很簡單哈哈，是一個充氣娃娃，不過卻是個保健小幫手\n\
  \n\n\n\n我喜歡他肥肥的肚子XD\n整部電影因為看起來憨憨的杯麵所以加了很多分哈哈\n\n\n\n\nHiro受到了哥哥的鼓舞，做出了一堆能夠感應的微型機器人\n\
  這些微型機器人可以根據他的想法變化，像是建築或者是橋梁之類的(超酷)\n也讓Hiro順利地拿到教授發給他的了入學申請\n只是那一晚，發表會現場大火，正義的哥哥為了救在火海裡的教授，也命喪火海\n\
  \n\n\n\n之後Hiro消沉了很久，因為撞到東西，喊了一句好痛\n哥哥的遺作機器人杯麵就被呼喚出來，一度因為他太胖而卡住哈哈\n我覺得他每次會跳出這個選擇痛苦的是窗框很可愛XD\n\
  \n\n\n\n\n杯麵覺得Hiro失去哥哥之後很難過，所以會給他愛的抱抱\n\n\n\n\n因為杯麵的好奇心，跟著Hiro的小機器人到了一個空曠的大工廠\n\
  才發現有人在量產Hiro的小機器人\n而面具怪人正操控的小機器人攻擊他們阿>\"<\n在被小機器人攻擊之後，他們跳出窗外，杯麵是個安全氣墊，就方便！\n\n\n\
  \n\n而男主角認為哥哥的死因不單純\n因此打算要打敗被控制小機器人的蒙面人，決定要來改造我們可愛的杯麵\n堅持自己是個保健小幫手的杯麵一開始還不想學空手道XD\n\
  \n\n\n\n\n接著Hiro把哥哥實驗室的夥伴們的裝備都進化\n而且大家還特訓如何打敗面具壞人\n\n\n\n\n不得不說所有裡面的裝備，我很喜歡這個:p\n\
  \ GoGo Tomago的身手也很矯健，他在溜來溜去的時候，真的把小機器人甩得遠遠的\n\n\n\n\nHoney Lemon是化學狂熱分子\nhiro把他的裝備變的可以隨身攜帶，一開始覺得她的功能很弱\n\
  但最後覺得其實化學這玩意會爆炸挺威的\n\n\n\n\n\n杯麵肥肥的肚子總是會讓我嘴角一抹微笑啊哈\n\n\n\n\n\nWasabi的手刀可以切割很威，但是只有手厲害他的腳沒辦法跟著移動就輸了｡ﾟ(ﾟ′Д\n\
  ‵ﾟ)゜｡\nFred就是噴火感覺有點弱哈哈，但是他很有錢所以贏惹\n\n\n\n\n\n總之最後反派公布讓我嚇了一跳\n但朋友們紛紛表示不意外，反派往往就是爆冷門\n\
  \n但是Hiro已經被復仇之心淹沒，所以下指令要杯麵殺了反派\n甚至把他的保健小晶片取出來ˊ_ˋ\n後來因為夥伴們的阻止，Hiro一行人又重新調整腳步，也知道大反派下一步要做什麼\n\
  \n\n\n題外話！我很喜歡哥哥在杯麵身上錄的那一段影片\n一個成功的作品，中間是經歷過多少次失敗，而且哥哥在做這個機器人的時候\n想的是完全之後就可以幫助很多人(哥哥完全好人一枚\n\
  覺得哥哥如果繼續活著應該就會創造出更多更優秀的機器人，讓生活更好\n\n\n\n\n\n\n而反派也是有一個悲慘的小故事，當然最後大英雄天團拯救了世界♥\n\n\
  \n\n\n\n一開始我對於杯麵的犧牲非常的傷心，我甚至還在電影院啜泣\n因為他是哥哥的遺作耶！\n\n對Hiro來說，杯麵不只是一個機器人，已經有深厚的感情了\n\
  總之最後杯麵留了那麼一手，讓我覺得迪士尼電影果然是會維持一貫的happy ending\n不然小孩子看了會傷心，那還叫迪士尼電影嗎:)\n\n\n喔對了！雖然我看的是三D電影\n\
  但我覺得似乎也沒有這個必要耶哈哈，看一般數位的其實也可以\n\n就劇情跟感人度上來說，我給他的分數有四點五顆星\n畢竟冰雪奇緣是靠個主題曲加分\n但大英雄天團是靠劇情劇情出線，又是部闔家歡樂的電影=D\n\
  杯麵超級萌，而且十二月中好像要開賣周邊\n\n--\n\n什麼樣的你，就會引來什麼樣的人！\n而你的人生，會自動幫你過濾那些，不屬於你的人。\n\nBLOG＊\n\
