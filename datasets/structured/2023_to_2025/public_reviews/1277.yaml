url: https://www.ptt.cc/bbs/movie/M.1606341416.A.561.html
title: '[好雷]孤味Little Big Women：女人們的海海人生 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  改編自導演許承傑過世阿嬤的親身經歷，描述獨自撫養三個小孩長大的單親媽媽，在接到

  一通電話後，發現她不但得面對自己內心多年來的怨懟，也在處理和三個女兒關係的難題

  。由曾獲得國家文藝獎、金馬獎特別貢獻獎的剪接大師廖慶松與演員徐若瑄合力監製，改

  編自導演許承傑同名短片的電影《孤味》。



  孤味講得是女人們的故事，尤其以林秀英(陳淑芬 飾)的長久以來辛酸撐持家庭為中心，

  擴散到女兒們所面對各自的課題。但主線還是秀英的老公與離家的浪子阿爸(龍劭華 飾)

  的關係；偏偏在秀英七十大壽要大肆慶祝時，有其他女人並跑到台北發展的丈夫，居然回

  來死在故鄉台南，身為早已疏離家屬的他們，還得應付這麻煩事。秀英尤其心理不平衡，

  做牛做馬一輩子，最後還得為消失已久的丈夫收拾殘局，而且還出現了一位陪他走過下半

  生的女人(丁寧 飾)，心裡更是不爽。



  大姊(謝盈萱 飾)是國際舞者，卻有顆自由的心，最像阿爸，雖然有丈夫，卻四處留情，

  目前也已丈夫分居，癌症復發不敢跟家裡人說，遇見幼時同學又產生曖昧情愫，但丈夫偏

  偏不簽離婚協議書，死纏爛打，她本身看似瀟灑大氣但內心其實十分恐懼又矛盾。二姊(

  徐若瑄 飾)從小就是個高材生，讀書讀第一名是因為只要考得好，阿爸就會回來看她，十

  分渴望父愛。小妹(孫可芳 飾)當年記憶模糊，約只記得父親常給的軟糖，不過家裡的餐

  廳已經讓她接手獨當一面，雖然有時母親秀英還是會下指導棋，讓她不高興。她在片中是

  最不清楚家裡糾葛的一位，而儘管戲份也不少，但演技尚可還有發揮進步的空間。



  雖然講的是女人的辛酸往事，同時也講無論發生在秀英或女兒身上的現在進行式，兩者彼

  此交織，難以分離。當年父親拋家棄子，無論對妻子或女兒都造成重大的心痛刻痕，甚至

  在經濟條件不好下，養不活這麼多孩子，還得把老三(張鈞甯 飾)分送給人養，讓人多麼

  不捨。話說當年，我的母親也是因為家裡太多孩子而被送養，還取了招弟的小名。這些上

  一輩的生活其實是很貼近現實，家家有本難念的經，有所同有所不同。



  透過演員收放自如，超自然的演技，飾演秀英的陳淑芬也因為精湛的演技拿到金馬獎女主

  角獎，而今年的女配角獎也是由他以親愛的房客拿下，身騎兩匹馬，實至名歸。另外入圍

  女配角的謝盈萱同樣表現亮眼，每次有她的鏡頭，演技都很地道，十分吸睛，讓人融入將

  自己投射入劇情內。ViVian徐若瑄也尬了二姊一腳，不過更重要的是她跟剪接大師廖慶松

  是本片的製作人，眼光獨到，成就了這部好戲，第一次跨足幕後就有如此成功亮眼的表現

  。陳妍霏飾演外孫女，還是有演出活潑靈動天真的一面的少女特質。



  光憑著獲得第57屆金馬獎最佳女主角的陳淑芬，就值得進戲院一看，況且還有入圍女配去

  年最佳女主角謝盈萱的演技加持，以及家族裡眾多大小美女，也很賞心悅目。這部電影心

  酸中帶有溫暖，不流於濫情，但該有的都有，點得恰到好處，是部值得進戲院支持的片子

  。


  原始出處：



  --

  有閒來坐:D


  ~ 卵生水筆仔 ~



  --'
