url: https://www.ptt.cc/bbs/movie/M.1611213674.A.11B.html
title: '[好雷] 大眼睛 Big Eyes'
content: '雷文防雷資訊頁














  由提姆波頓執導的真人真事改編電影《大眼睛》主要描述活躍於1950、1960年代的美國畫

  家瑪格麗特基恩，面對第二段婚姻時，與丈夫華特基恩發生的故事。瑪格麗特擅長繪製女

  人與小孩的人物肖像，畫作中最具代表性的符號就是又大又深邃的眼睛。


  當時的時代氛圍下，女性意識尚未抬頭，男性普遍都瞧不起女性，使得她們的社會地位相

  當低落。當時的瑪格麗特只能在街道上邊畫邊販售自己的畫作，儘管價格低廉，還是會遇

  到民眾殺價。她在市集認識了以景物畫家自稱的華特基恩，兩人相識、相戀，最後步入婚

  姻。儘管瑪格麗特充滿才華，深愛華特的她相信了對方不斷灌輸的「女性的畫作不值錢」

  這種觀念，於是答應丈夫，在自己的畫作上落款寫下「基恩」的姓氏。在華特浮誇的話術

  宣傳及陰錯陽差之下，讓瑪格麗特的「大眼睛」系列畫作一夕成名，價值水漲船高，但成

  名的卻不是辛苦在畫室創作的瑪格麗特基恩，而是剽竊其作品的華特基恩。


  隨著華特的知名度遠播，大眼睛畫作並非人人買得起，為了賺進更多鈔票，於是華特想到

  了新點子：將這些畫作再製成海報、明信片等周邊商品，開拓那些買不起畫作又想參與藝

  術活動的百姓的市場。


  隨著時間推移，華特越陷越深，除了著迷於財富外，更打從心底認為那些受歡迎的畫作都

  是出於自身之手，而同時仍埋頭創作的瑪格麗特愈來愈感受不到丈夫的愛以及對其作品的

  尊重，甚至出言恐嚇她，因此她決定將她的畫作重新寫上自己的名字，並且不惜採取法律

  途徑，揭發華特這段時間以來對她、對社會的騙局。


  提姆波頓褪去他以往黑暗怪異的影像風格，專心訴說一個歷史上震驚藝術界的醜聞與騙局

  ，片中只有短短一幕魔幻寫實的影像作為他的作品標記。


  事實上提姆波頓本身就是現實中瑪格麗特基恩的粉絲，也收藏了不少她的畫作。提姆波頓

  帶入這位畫家的角度，描繪出她對於作品的愛以及人生態度，更讓觀眾看到了當時美國的

  藝術環境，以及在性別不平等的時空背景下，像瑪格麗特這樣的女性藝術家也抱持著保守

  的思想與行為，例如帶著小孩在市集作畫、必須忍受民眾殺價，進入婚姻後凡是都聽從丈

  夫的，有苦難言的她只能將情感及委屈化為一幅幅的大眼睛人物，從人像中透露出她的哀

  愁；這些代表她私密情感的畫作卻成為丈夫華特追求名利與財富的工具，自己則被關在畫

  室中「生產」作品，更顯得諷刺。


  --'
