  台灣    大英雄天團


  電影除借用了日本要素，角色的姓名、經歷、特殊能力，以及共同打擊敵人之外，基本上

  與原作漫畫《大英雄天團》有極大差異，包含角色在內，都被電影進行大幅改編。2009年

  迪士尼收購了漫威娛樂，並同時開始尋找漫威漫畫中適合改編為電影的作品，導演唐·霍

  爾因而從資料庫中找到這部作品[7][8]。不過《大英雄天團》在連載時人氣並不高，連漫

  威娛樂的工作人員也沒想到這部作品會出線。霍爾第一次知道這部漫畫後，被其標題及日

  本要素深深吸引[9]，與製作人約翰·拉薩特討論後，決定為了符合迪士尼動畫要求進行

  內容的變更以及劇本的創作。原作中的團隊成員Sunfire與Silver Samurai，因為版權為

  製作《X戰警》的二十世紀福斯所持有，因此無法使用[10]。原作中是6個日本人主角以日

  本為舞台發生戰鬥，電影版則改成多民族混成的隊伍，包含機器人杯麵，也被從原作中有

  怪獸樣貌的角色，變身成為一種超級力量，在電影中變成會讓人不禁聯想起龍貓的圓胖身

  體、親切姿態的容貌[11]。故事也從本來英雄們利用超能力打擊犯罪，改成成員們各自發

  揮自己的能力合作禦敵的形象[12]。


  漫畫原著的編劇和繪畫師Duncan Rouleau和Steven T. Seagle，就是後來動畫工作室Man

  of Action的骨幹成員之二，其代表作就是在卡通頻道著名的Ben 10系列；而Man of

  Action便負責本電影的人物設計。


  趣事[編輯]

  在舊京山中高樓群中，出現了《無敵破壞王》和《四眼雞丁》的遊戲畫面。

  片中警察局裡貼了張通緝圖，通緝人物為《冰雪奇緣》中的漢斯王子，而且在費吉拉家的

  後花園也出現了漢斯王子的雕像，但因杯麵的失誤而被粉碎。

  片中警察局亦出現了《雷霆戰狗》中的女警察和零零狗波特的照片。

  片中警察局中除了漢斯王子被通緝外，《魔髮奇緣》的製片人也成了通緝要犯。

  按照漫威電影慣例，漫畫原作者斯坦·李也客串了本片，而他是費吉拉的爸爸，一位已退

  休的超級英雄。

  在主角濱田廣的房間裏也出現了《無敵破壞王》中的破壞王玩具。

  在費吉拉的房間裏充滿了多個漫威漫畫中的英雄模型，例如Grogg丶Doom丶Black Talon

  等等，而《超人特攻隊》裏的彈弓女俠也出現了。在床上，亦可發現《星際寶貝》中史迪

  奇的枕頭。

  片中亦出現了皮克斯動畫工作室最愛的A113符號，就在阿廣幫杯麵設計手臂盔甲的螢幕上

  。

  音樂[編輯]

  《大英雄天團》的主題曲是來自美國朋克樂團打倒男孩的《Immortals》，而另一個主題

  曲選用在2005年日本發售的《Story》，而且是由原唱者AI改編的英文版。影片配樂由英

  國編曲人亨利·傑克曼操刀製作，他之前曾為迪士尼之前的動畫電影《無敵破壞王》製作

  編曲。


  --'
