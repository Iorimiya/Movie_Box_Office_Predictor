url: https://www.ptt.cc/bbs/movie/M.1700835410.A.3B3.html
title: '[新聞] 築間董座林楷傑出資力挺國片816「BIG」'
content: "築間董座林楷傑出資力挺國片816「BIG」支持魏德聖完成新作\n\n導演魏德聖新片來了！台灣首部結合動畫的醫療主題電影、魏德聖新片《BIG》搶攻年底\n\
  大檔期，溫馨的親子題材成為聖誕、跨年強片。由於電影題材和導演魏德聖的才華打動了\n築間餐飲集團董事長林楷傑，決定出資力挺魏德聖完成816「BIG」拍攝。\n\n\
  電影故事源起是多年前魏德聖在電視紀錄片中訪談一位已截肢康復的癌童，這位女孩樂觀\n的態度，給了他相當大的震撼與啟發，故決定將這齣埋藏許久的劇本付諸實現。\n\n\
  電影中描述著 6 個來自不同社會階層、不同面向的家庭，因故搬到同一間兒童癌症病房\n，從彼此衝突到最後相互扶持的溫馨故事。導演魏德聖首次嘗試溫馨的家庭題材，多達\n\
  \ 21 位的主演群堪稱台灣電影之最，更挑戰將動畫結合真人實拍的電影。\n\n築間餐飲集團董事長林楷傑提到：「過往做過比較多商業的事，這次我想成就更有意義的\n\
  事，支持台灣電影、支持魏德聖導演，因為有著振奮人心的題材！」\n\n築間餐飲集團繼11月9日以包場方式邀請集團員工前往影城觀賞816「BIG」後，今（24）\n\
  日再次包下影廳招待原聲合唱團的小朋友欣賞816「BIG」。原聲合唱團小朋友除了演出之\n外，平時很少有機會可以進影廳欣賞電影。這次築間餐飲集團以包車、專車方式前往南投\n\
  縣信義鄉將原聲合唱團小朋友接送至台中市欣賞816「BIG」。\n\n電影播放前，原聲合唱團小朋友為了謝謝魏德聖導演及築間餐飲集團，在影廳現場演出人\n氣招牌曲「拍手歌」。電影播放過程中，魏德聖親切的在座位區陪著原聲合唱團一起欣賞\n\
  新作，更在會後與原聲合唱團小朋友們分享及互動新作816「BIG」拍攝過程中的點點滴滴\n，以及電影帶給社會的啟發，同時鼓勵每一位小朋友學會珍惜、愛身邊所有的人和事。\n\
  \n\n\n--"
