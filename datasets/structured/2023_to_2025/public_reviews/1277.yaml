title: '[新聞] 魏德聖《BIG》洛杉磯首映 觀眾笑淚交織'
content: "魏德聖《BIG》洛杉磯首映 觀眾笑淚交織\n\n更新 2024-03-11 10:50 AM\n\n\n【大紀元2024年03月11日訊】（大紀元記者徐曼沅洛杉磯報導）\n\
  \n曾執導電影《賽德克・巴萊》、《海角七號》等片的導演魏德聖3月9日（週六），該片在洛杉磯縣蒙\n羅維亞市（Monrovia）的Look影院放映，150張預售票告罄後又追加座位，逾200名觀眾入\n\
  場欣賞，時而哄堂大笑，時而淚濕眼眶啜泣。\n\n\n\n儘管遭遇官司以及拍攝「台灣三部曲」電影計劃延遲等挫折，但魏德聖仍堅信說出好故事\n、拍出好電影就能吸引觀眾回到電影院\e\
  [1;32m《BIG》在台灣上映，且迄今仍不斷有醫療、體育、教育、宗教等團\n體包場觀影。\n\n魏德聖表示，《BIG》希望傳遞「Being Is Gift」（活著就是禮物）的概念，也就是人人\n\
  都是「大人物」。片中六位罹癌孩童與家人各有不同的生命難題，魏德聖用詼諧的方式處\n理生命教育議題，也帶領觀眾思考，如何向孩童講述生死課題。\n\n《BIG》應用了動畫取代冰冷血腥的手術場面，因為魏德聖希望以動畫呈現癌症病童對抗\n\
  病痛，這些「癌童不是被治療的患者，而是被選出來打仗的孩子」。導演藉由小孩的視角\n去討論活著的意義，而每位病童都是戰士。\n\n在影片放映前，魏德聖接受了洛杉磯當地Unistar基金會的小小記者採訪。魏德聖和小朋\n\
  友分享，拍攝《BIG》時，為了照顧兒童演員，他從業三十多年來第一次這麼溫和，在片\n場不能發脾氣、不能罵人，甚至還安排午覺休息時間。他也建議喜歡演戲的小朋友，暫時\n\
  不要將演戲當作職業，而當作一種課餘遊戲：「不要為了拍戲，忘了自己還是學生，小朋\n友可以將演戲當作玩票興趣，但不是工作。」\n\n\n\n拍攝《BIG》期間，許多工作人員邊拍邊哭，魏德聖也多次拍到鼻酸落淚。他希望大家敬\n\
  入電影院感受《BIG》，因為這不只是看一部電影，也是一種情緒的釋放。他笑說：「大\n家需要哭一哭、笑一笑，釋放生活的壓力。」\n\n《BIG》雖未完全回收成本，但魏德聖很有信心，目前該片正在北美參與巡迴展，他也積極與台灣電影院協商，希望在，讓更多台灣觀眾有機會在電影院看片。\n\
  \n《BIG》主要演員包括曾沛慈、馬志翔、鄭人碩、田中千繪與范逸臣等，但最亮眼的演技\n生動自然的小朋友們。魏德聖認為，孩子們自然的反應和本色演出讓劇情更加有趣，他很\n\
  滿意拍攝成果，未來也考慮讓《BIG》在串流平台上映。\n\n\n2024年3月9日，大洛杉磯台灣會館董事長陳柏宇（右）、優社社長潘掬慧推薦闔家觀賞《\nBIG》。（徐曼沅／大紀元）\n\
  不少觀眾映後都購買了印有「816『BIG』」字樣的T恤、海報和餅乾等紀念品，並與魏德\n聖合影留念。大洛杉磯台灣會館董事長陳柏宇、優社社長潘掬慧推薦闔家觀賞《BIG》；\n\
  全美台灣人權會聯合會會長李賢群認為《BIG》引起觀眾許多共鳴，呼籲在美國的僑胞們\n把握巡迴放映的機會前往欣賞；中華民國行政院政務顧問林榮松也大力推薦《BIG》，他\n\
  認為魏德聖的電影探索了台灣社會許多被忽略的面向，透過魏導的電影，可以讓外國人認\n識台灣、讓台灣人更珍惜自己的家園。「北美台灣電影巡迴影展」預計4月14日在舊金山\n\
  灣區落幕，影展期間還有二十多個場次，歡迎民眾前往觀影。◇\n\n責任編輯：嘉蓮\n\n\n\n--"
