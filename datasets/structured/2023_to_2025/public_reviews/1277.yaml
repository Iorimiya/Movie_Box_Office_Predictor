title: '[新聞] 魏德聖導演《BIG》逆轉勝：2000場包場'
content: '魏德聖導演《BIG》逆轉勝：2000場包場打破台灣電影紀錄


  by 威傳媒Max | Sat,17 Aug 2024 21:08 | 娛樂, 編輯推薦


  2024年對魏德聖導演來說，是充滿挑戰與轉機的一年。他的最新電影《BIG》於去年12月

  上映，因來不及報名第60屆金馬獎，



  【威傳媒記者林志毅報導】


  　　2024年對魏德聖導演來說，是充滿挑戰與轉機的一年。他的最新電影《BIG》於去年1

  2月上映，因來不及報名第60屆金馬獎，初期在媒體曝光度不足，票房表現未如預期，上

  映不到一個月即面臨下檔危機。


  　　不過，命運開始轉變。魏德聖導演在宣傳《BIG》時，曾發表言論，指責政府將資源

  過度集中於台積電等高科技產業，導致電影產業難以像韓國一樣成為文化外交的強力工具

  。此言一出，隨即引發大批網民抨擊。然而，幾天後，實際上他並無意針對台積電表達不滿。隨著影片的釋出，


  　　《BIG》的命運也隨之轉變。雖然起初票房不佳，但影片感人至深的劇情讓觀眾們在

  絕望中找到希望，開始引發熱烈的口碑效應。包括新任文化部部長李遠（作家小野）及教

  育部政務次長葉丙成等人，紛紛公開支持並推廣《BIG》。隨後，親子教育專家李儀婷及

  其夫婿華語首席故事教練許榮哲，號召全台觀眾發動大規模包場活動，最終創下台灣電影

  史上最高包場紀錄。


  　　截至8月16日，《BIG》


  　　而在此同時，魏德聖導演也在與投資人郭台強的紛爭中取得意外轉機。此前，因《賽

