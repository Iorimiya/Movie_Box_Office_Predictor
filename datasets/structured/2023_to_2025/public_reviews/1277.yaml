url: https://www.ptt.cc/bbs/movie/M.1535284870.A.897.html
title: '[心得] 大師兄 Big Brother'
content: '殷海光《人生的意義》最後一段：「在各位現在這種年齡大家都有夢。胡適說

  ，人生應該有夢，否則人生不是太不豐富嗎？現在你們都有理想，但出了社會便

  可能不同了。那時各奔前程，各種打擊，各種現實的考慮，都可能使得你把崇高

  的理想收歛起來。這就是現實在考驗我們的道德力，我們的理想性，我們對真對

  善對美的追求是否迫切。在世界上每一個角落都是如此的。我們是否能撐得住，

  就在這個關頭。現在是考驗我們的時候了。」


  校園勵志片通常有一個萬年不變的公式：熱血教師+放牛班+問題學生，師生共

  同努力，中間出現危機，師/生同舟共濟，力挽狂瀾，終究讓大家刮目相看，甄

  子丹主演的《大師兄》自然也不例外。


  當初看預告片就很吸引我，沒想到正片更是處處出彩。我必須說甄子丹的確是個

  了不起的演員，一支粉筆就能擊發教室天花板的灑水系統，更衣室裡與MMA

  選手的格鬥以及多場近身搏鬥更是精彩可期。


  你以為甄子丹只有這樣？錯錯錯，在縫合問題學生與原生家庭間的不良關係上，

  他也使盡全力，如此良師益友，說實在打著燈籠都找不到！


  關於這位神秘老師的過去，我特別喜歡導演以壯闊的場景交代陳 sir 壯遊的經過

  ，一隻自由翱翔的老鷹最後還是會回到自己熟悉的巢穴之中。


  只有105分鐘的《大師兄》節奏明快，毫不拖泥帶水，主要人物的故事交代的

  一清二楚，年輕演員選角恰如其分，觀眾無須燒腦，有歡笑，也有淚水。


  本片結尾以殷海光《人生的意義》最後一段作為結尾（見本文第一段），不禁讓

  我想起《春風化雨》中羅賓威廉斯引用美國詩人惠特曼的「O，Captain，

  my captain！」同樣是老師，一個是掌舵人，一個是教你如何開拓人

  生的探

  險家！




  --'
