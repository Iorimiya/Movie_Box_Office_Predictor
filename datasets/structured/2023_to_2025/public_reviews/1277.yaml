url: https://www.ptt.cc/bbs/movie/M.1419667618.A.481.html
title: '[口碑場超好雷] Big Hero 6 我永遠都會在你心中'
content: '迪士尼繼去年紅翻全世界的冰雪奇緣後，今年又推出了和Marvel合作的全新動畫"大英雄

  天團"Big Hero 6


  先說我覺得我非常的幸運，我第一部喜歡上的動畫剛好是迪士尼"第二次文藝復興"時期的

  第一部動畫 "魔髮奇緣"

  就是這部讓我開始喜歡並開始接觸迪士尼系列的動畫，而之後推出的"無敵破壞王"和"冰

  雪奇緣"我也都沒錯過，也都讓我一次又一次的驚訝以及佩服迪士尼的能耐和創意，這三

  部可說是近年來迪士尼又再度復興的最好證明!


  而這次的"大英雄天團",我也是抱著非常的期待和期望去看的，看完後真的我覺得-----

  迪士尼這次又沒有讓我失望，又讓我欣賞了一部有創意,更有著感動(有洋蔥啊XD)的好作

  品!!!!



  以上廢話完.........以下有雷喔！

  還沒看過的請克制自己的好奇心，請按上一頁~~










  -----------------我是分隔線---------------------








  基本上故事是描述一個天才14歲的少年"阿廣",和哥哥"阿正"的(遺產)發明--杯麵的(感情

  ?)故事


  在一場意外中阿廣失去了最親愛的哥哥阿正，而阿正留下了的希望能夠造福全世界的發明

  --杯麵(杯麵真的好卡哇伊的，雖然有時候講話和動作有點天真(白目XD?)

  而阿廣後來發現其實哥哥的死因並不單純，跟一位戴著面具的面具男有關係，決定和杯麵

  以及夥伴們調查究竟這位面具男是誰？有什麼企圖?而阿廣就在之中培養了和杯麵的美好

  友情~~~


  中間的劇情就不詳細說了，來講最後讓我差點淚崩的點


  當最後杯麵決定犧牲自己來救阿廣時，阿廣說"我不想再一次的失去你"

  而杯麵也叫阿廣不要傷心，說了那句讓我最感動的話"我永遠都會在你心中"

  而阿廣也擁抱了杯麵，說了I''m satisfied with your care.

  看到這讓我覺得身旁不知道是誰端來了一整盤的洋蔥，眼淚就差點奪洭而出


  沒錯，或許生命的消失是我們改變不了也無法挽回的事實，也許失去的是你最心愛或是最

  親近的人，可是重要的還是他們跟我們相處那最歡樂也最美好的時光，只要謹記著這點，

  他們便會永遠存在在我們的心中，永遠地陪伴著我們度過未來的日子。


  而杯麵看起來只是像是機器人般只會機械式的回答和講句子，可是其實我覺得，在他那片

  寫著阿廣名字的晶片裡，還加入了阿正那對弟弟無悔的愛和付出，在杯麵的動作和表現上

  展露無疑，印證了其實杯麵就像是哥哥阿正在世上對弟弟愛的延續啊！


  最後還好杯麵其實把身上的綠色晶片取下來和他那鐵拳之手一起運了出來，才讓杯麵能夠

  再次復活，是一個很迪士尼經典的完美結局









  ----------------------雷完--------------------



  好吧，想講的點太多了文筆不好講不完，像是其他角色的表現還有之中的細節

  剩下的就留給大家自己去戲院品嚐，請大家一定要支持Big Hero 6喔！

  我相信他不會讓大家失望的!


  題外話:我還買了一杯很可愛的杯麵造型杯XD!



  --

  Sent from my Android


  --'
