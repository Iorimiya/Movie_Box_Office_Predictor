title: '[好無雷]《愛情昏迷中》The Big Sick'
content: '很高興能在七夕看這部的特映會，本身很喜歡女主角Zoe Kazan在《客製化女神》跟《好

  友

  戀習簿》的演出。



  故事改編自男主角演員Kumail Nanjiani的真人真事。男主角Kumail雖然全家已經移民到

  美

  國，但他的父母仍恪遵巴基斯坦傳統的相親婚制，而他的哥哥也是這樣跟他的大嫂成婚。

  但在一次的一夜情中他跟白人碩士生Emily相識，進而相愛。但因為家庭的束縛，Kumail

  也

  陷入掙扎之中。就在他無法在親情與愛情中做出選擇時，Emily因肺部原因感染而進行

  醫療誘導昏迷，Kumail也在照護女主角的過程中結識Emily的父母。




  整部電影在愛情部分很可愛很輕巧，又非常寫實。從炮友到熱戀情人最後出現認知差異的

  過程很流暢。

  而異國戀情帶出的價值觀、文化差異，很發人深省。在觀影的感受跟《真愛每一天》蠻相

  似的，有讓人會心一笑的互動還有感人的親情。


  配樂很好聽，主配角演技很棒．笑點都挺自然的。不過處理嚴肅議題的手法比較老梗，但

  男主角的作為真的蠻感人的！



  電影版首PO，純粹推薦大家去看。


  附上預告片：



  還有真人訪談：



  Zoe跟真人Emily真的有像！


  --'
