title: '[普好雷] 大賣空 The Big Short'
content: '曾經看過版上一則電影歷史準確度的分析新聞


  而大賣空居然高達91.4%(意即對事件的還原度)


  不免讓人為金融界金錢至上的腐敗道德觀感到一陣惡寒


  全片透過三條主線描述2008年美國房市崩盤進而造成全球性金融海嘯的始末


  揭露華爾街貪婪所導致的一連串骨牌效應




  當然，這類金融題材不免有許多艱深難懂的詞彙


  所幸片中都有透過突破第四道牆的方式做些基礎解釋


  但這也顯示出對有心人來說


  只要把規則訂的複雜一點


  名稱取得難記一點


  就可以輕易地把普通的老百姓耍的團團轉


  而從中獲取利益




  結尾時，導演告訴觀眾這一次的事件中所有應負責的人都受到了懲罰


  接著卻說「都是騙你的！」


  而事實是幾乎沒有人得到應得的審判


  這樣的結果荒謬的令人說不出話來


  原來律法終究是敵不過金錢


  即使導致數以萬計員工的失業


  仍然撼動不了這糟糕又病態的體系




  這些東西似乎離我們很遙遠


  但實際上它卻實實在在的影響著我們的生活


  物價、失業率、薪水等等


  真心的推薦這部電影


  不需要真的去明白金融業的運作原理


  但至少要知道是什麼樣的一隻手在操縱著我們的一切


  --'
