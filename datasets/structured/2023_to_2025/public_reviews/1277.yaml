url: https://www.ptt.cc/bbs/movie/M.1416644344.A.238.html
title: 'Re: [  雷] BIG HERO 6 大英雄天團'
content: '有雷




  以下主角名稱以"英雄"非阿正


  雖然聽起來有點像痞子英雄





  基本上故事的呈現也是很傳統的前後呼應


  起初在地下機器人競技場的橋段


  看預告都一直以為是英雄跟女rocker在對決


  結果正片是黑道老大先虐了女rocker


  英雄才跳出來跟老大的機器人對決


  預告根本神剪輯(￣▽￣＃)﹏﹏



  然後被黑道追殺和哥哥出場後  以及哥哥的同事們相聚後


  參加了科展  量產出無敵多的微小機器人


  引發兩個反派嫌疑人的興趣


  因為不賣專利導致結下樑子(科展會場被燒毀...)


  充滿正義的哥哥為了衝入火災的科展會場就壯烈犧牲了


  (哥哥的喪禮畫面讓我想到蜘蛛人)


  後來主角發現科展會場遺失的微小機器人又被大量生產


  然後被攻擊


  然後為了復仇  英雄寫了一張格鬥版的baymax程式卡


  讓原本醫療用途的baymax可以開啟葉問模式


  結果還是敵不過自己發明的微小機器人....(不是你發明的嗎)


  然後就和哥哥的同事們以及史坦李的兒子(?)


  自行組成超級英雄團體直搗黃龍



  結果殺到boss家卻發現boss真的是自己的boss


  但殺紅眼的英雄還是替baymax換上葉問模式


  但哥哥的同事們無法下手  使英雄非常不爽


  於是鬧脾氣回家(疑?)


  而且baymax也不讓他再裝格鬥模式




  最後發現boss是為了救她被吸進蟲洞的女兒(星際效應?)


  然後boss就去找害她女兒被吸進蟲洞的研發公司算帳


  掌握了情資的英雄團體又再度出動


  讓大量被量產的微小機器人都被吸進蟲洞後打敗boss


  但baymax發現蟲洞裡有生命跡象決定去救人


  (完全跟他哥一模一樣阿)


  然後大概就像復仇者聯盟1一樣鋼鐵人差點回不來


  最後  英雄救出boss他女兒  baymax犧牲


  但baymax留下了他原始的程式卡


  英雄就可以再做一隻baymax


  英雄團體永存


  over



  ==



  片長大概90分鐘  很短


  喜歡機器人會滿熱血的


  中間配上FOB那段也很棒


  但不是真的一部歷久不衰的片


  今年感恩檔期  迪士尼並沒有超越冰雪


  大概就是無敵破壞王等級吧


  評價：7.5顆星






  --'
