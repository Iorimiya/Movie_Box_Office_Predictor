url: https://www.ptt.cc/bbs/movie/M.1169744846.A.A26.html
title: '[好評] 大智若魚 (Big Fish) -- 夢想的桃花源'
content: "【方便閱讀blog版】\n\n歡迎大家回覆討論^^\n\n\n\n-----------------------------------------------------------------\n\
  \n【前言】\n我強烈地懷疑是東森洋片台畫質不好的關係\n把Tim Burton的瑰麗呈現得有些失色\n\n一直久仰的片名卻不知道他究竟在演什麼\n直到今天東森洋片台的預告才吸引了我的目光\n\
  導演是那總愛玩弄色彩遊戲和說故事的Tim Burton\n也是巧克力冒險工廠的大推手\n只看過《斷頭谷》和《巧克力冒險工廠》的我看來遲了幾步當他的粉斯\n\n\
  【一】\n如果能預知死亡的方式\n會開始焦躁\n或是放膽去嘗試所有能接近死亡的挑戰？\n主角想當然要有著獨特的性格和想法\n但抽開故事\n現實生活中我們卻很難在面對一個既定結果時\n\
  變換角度樂觀面對\n也許這是因為我們只是平凡人吧\n\n「It's better to be a fake somebody than a real nobody.」－－《天才雷普利》\n\
  \n【二】\n最有童話效果的一個段落\n『勇氣』總是童話主人翁的老梗\n在他冒險走舊路只為了展現他異於常人的雄心壯志時\n途中想當然爾必經坎坷\n最後柳暗花明走到了桃花源\n\
  其中卻賣了Tim式黑色幽默\n放了個知名詩人在此流連忘返\n怎料這夢話逸境卻只是讓自己畫地自限的小地方\n詩人寫出來的東西乏善可陳平庸至極\n而後面的發展更是讓人surprise\n\
  \n【三】\n「他最擅長的就是與人交際」是人們給父親的評價\n但卻沒辦法把真正的自己傳達給最親的兒子\n是兒子抗議的：父親不願意說真實的故事\n還是兒子不願意相信不願意了解呢？\n\
  想來很諷刺\n\n真正的幸福是什麼？\n單純的相信以及互信可以編織許多羅曼\n童話故事聽似虛假\n也許只是端看聽者有心無意而已\n\n父親最後的死法相當夢幻\n\
  催我淚的總是親人的生離死別\n而父親最終能在兒子與自己心意相通\n親朋好友也笑著與自己道別\n這是我們夢寐以求吧\n\n這邊什麼親情的就不多贅述\n大家應該都體會的出來\n\
  \n【四】\n很多時候事情是沒有最好的答案的\n電影是導演說的故事\n我們不需要知道電影中的故事是真是假\n不見得要有個Happily ever after才是圓滿\n\
  或許導演也沒打算讓我們知道答案\n真相就像《隱匿》中的藏鏡人一樣\n幸福不會因為有結局而變得更幸福\n我們的人生也不會因為故事沒了結局而變得慘澹\n\n【後記】\n\
  我不知道片名原文有沒有其他意思\n但中譯卻是絕妙\n大智若愚的是父親？\n還是夫妻的處世哲學？\n或者是導演要我們看片的態度？\n而愚與魚的雙關\n喜歡喝水的父親\n\
  愛好自由的父親\n夢想幻化作魚的死亡方式\n片名也詮釋地恰到好處\n\n總之\n催淚好片推一個\n\n\n--\n         <(￣︶￣)>\n    \
  \       \n\n有　有　有　還有\n\n--\n◆ From: 60.249.11.76"
