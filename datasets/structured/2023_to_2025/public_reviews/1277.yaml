title: '[新聞] 魏德聖「堅持跑到最後一刻」《BIG》包廳'
content: '魏德聖「堅持跑到最後一刻」《BIG》包廳逾 600 場破紀錄

  14:372023/12/30 中時 翁紫曦




  電影《BIG》為魏德聖初次挑戰之暖心家庭題材電影，笑中帶淚的劇情風格在上映後引發

  網路熱烈討論，強大的口碑效應持續延燒，副總統候選人趙少康也在大選前繁忙的競選期

  間，特別抽空進到戲院支持電影《BIG》，並在映後訪問中表示「身體健康的我們，真應

  該努力奮鬥每一天，沒有悲觀的理由」。並在 IG 上傳短影音分享觀後心得「得了病的孩

  子與家人都這樣努力，為生命來奮鬥，我覺得他是有多重意義的」，支持魏德聖導演，同

  時也把人性的光輝、醫療的故事宣導出去，更呼籲健康的人應該要珍惜自己的生命，好好

  地發揮生命的光輝，可見電影的影響力相當驚人。


  《BIG》也在 11 月起在醫療界引起一陣必看的風潮，從病童、照護者家屬到醫療院所的

  醫師、護理人員，現在更擴散到衛生福利部、疾管署，觀眾在看完電影之後皆大受感動，

  紛紛發起包場活動支持，衛福部政務次長王必勝在看完電影後表示「即使我是一個非常有

  經驗的臨床醫師，經歷過很多生離死別，可是我還是非常感動，哭了好幾次」，疾管署副

  署長羅一鈞也大讚電影笑中帶淚、淚中帶笑。如今電影口碑更擴及體育界、教會團體、學

  校單位，感動超過萬人。導演魏德聖和電影主要演員范逸臣、田中千繪、曾沛慈、賴銘偉

  等演員也不辭奔波的勞苦，除了自掏腰包舉辦包場邀請演藝圈親朋好友觀賞電影，自 11

  月起更每天配合全台包場觀眾的邀請南北奔波，在電影映前後出席分享座談，盼透過電影

  把溫暖的正能量帶給觀眾，進而透過社會大眾的資源與力量，擴散到社會的每一個角落。

  魏德聖表示只要有人願意支持電影，他就會盡可能配合出席的邀請、堅持跑到最後一刻，

  讓觀眾感受到他滿滿的誠意。


  電影映期間適逢聖誕節、跨年檔期，好萊塢大片連續上映，導致《BIG》的播映場次、上

  映廳數屢屢受到壓縮，即便如此電影還是能維持八成的滿座率、票房排行榜上維持前五名

  的水準，同時各地區電影院仍持續收到觀眾的包場訂單，使得原本計畫減少播映場次的戲

  院又重新加開，《BIG》魅力不減、並且口碑效力持續燃燒。根據電影公司統計《BIG》上

  映至今已有接近 600 場包場，打破台灣電影紀錄，並且持續增加中。電影主要演員曾沛

  慈、賴銘偉、夏宇童、范逸臣、田中千繪、黃鐙輝、鄭又菲、努拉、謝以樂、滕韋煦等演

  員除了包場邀請親友看片，更自主號召身邊的演藝圈好友、企業主、網紅等人舉辦包場，

  不俗的口碑也讓藝人、歌手及網紅 KOL 不斷在網路社群分享觀影心得，發起揪團看電影

  的活動，以不同的管道、不同的活動形式持續應援《BIG》，期望這部難得的電影能夠繼

  續上映。





  備註：

  大破紀錄，鄉民又翻車了?


  --'
