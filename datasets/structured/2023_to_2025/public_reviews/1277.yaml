  指數是多少？」



  「我沒有受傷，杯麵，我只是做了惡夢。」他坐了起來，平復著自己的呼吸，「也不是全


  都是惡夢……只有一些是。」



  他拿起床頭放著的音樂盒，上緊了發條，沒合上拍的搭啦啦聲便從裡頭清晰緩慢地傳出。



  杯麵的系統自動擷取到這段聲波訊號，並立即得到了比對後的結果，「這是阿正的聲音。

  」



  「是啊，這是阿正的聲音。」他聽見自己說，「我有他的聲音，還有他走路的樣子，我還


  有你。」



  他靠在床頭又聽了會，上頭的阿正小人已經很舊了，但他沒想過要換一個。



  「……小廣，你該睡了。」機器人慢慢地走回到它的紅箱子前。



  他又旋緊了一次發條，將音樂盒擺回床頭上，阿正重新唱了一次歌。「晚安，杯麵。」



  「晚安，小廣。」




  完。





  * Theo Jansen Strandbeest：由荷蘭藝術家泰奧揚森利用塑膠、木頭等常見的無生物物

  體所創造，藉由力學的原理和風力的推動，可以做出一些仿生物的動作，甚至可以自行躲

  避障礙物。




  **Difference Engine：是巴貝奇畢生的研究，巴貝奇的機器是一台「多項式求值機」，

  只要將欲求值的一元多次方程式輸入到機器裡，機器每運轉一輪，就能產生出一個值來。


  ***Rube Goldberg machine：一種被設計得非常複雜的機械組合，以迂迴曲折的方法完成

  一些其實是非常簡單的工作，若是其中的環節有些許誤差，便會無法達成原定的任務。





  --


  嗯，我也是為了要用各種方法把阿正留下來才寫了這篇> <



  大暖男QUQ



  是說我有看到有人畫哥哥受傷後的設定，帥到腿軟。



  我超級喜歡那段，在電影院裡又哭又笑像神經病一樣......



  Hug)))


  推你去看哥哥的配音員 Daniel Henney 超帥 >/////< 簡直是三次元的Tadashi'
