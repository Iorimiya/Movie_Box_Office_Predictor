title: '[好雷] 孤味Little Big Women'
content: '這部戲未上映前看到預告就想去了，想了兩週了，決定在金馬獎頒獎前進入觀看，


  需要一點年紀，一點背景才懂得日常。。。。


  我跟朋友說這部戲需要符合兩大環境因素才能懂得:


  1. 鄉下長大的孩子


  2. 30歲以上的人


  台南的女兒看這齣戲最能體會，雖然這不是我家裡的題材，但在阿嬤輩媽媽輩裡很常聽見

  這類故事。。。。。。以下有雷，請斟酌觀看，還沒看過的，希望您可以帶媽媽或是阿嬤

  進戲院支持唷!


  主要是想集氣!希望抱回最佳女主角/最佳女配角獎，淑芳阿嬤跟謝盈萱演得真得很好!!


  (文長慎入~~~有雷)


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  孤單的滋味:


  生活雖苦嚐點甜的就會感到幸福 (ps: 陳伯昌買白糖粿給女兒吃那段)


  片頭剛開始是女主角秀英(陳淑芳飾演)搭上計程車為了70壽宴練歌的情形，壽宴本是應該

  開心的事，一生努力打拼只為了拉拔女兒長大，好不容易做出成績，從路邊攤賣蝦捲賣到

  開餐廳退休可享清福，卻在這一天接到失聯十幾年的老公回台南且病逝消息

  ........................


  我提幾個我覺得拍得很好的地方，有寓意的地方(沒有按照電影順序唷)


  場景一:


  秀英到市場買貨，大家稱她為林小姐而非陳太太，更換食材與買賣間的手段，

  可見她在職場上是女強人，當地是受到尊重的。故事後段可知林秀英小時候家境不錯，

  陳伯昌(楊一展/龍劭華飾演)娶了她在當時自然會被冠上林家女婿，陳伯昌職業是警察，

  早期警察門檻比較低只要想當基本門檻過了就可以了，但是薪水很低

  (請將年代到轉到民國30-40年代)，一個有理想的男人是無法忍受這樣不平等對待，

  為了能養活更多家人所以辭去只為了做大事業(早期覺得去台北闖天下很厲害)，

  當然個性漂泊無定也是原因之一。


  場景二:


  壽宴上原本要唱孤味這首歌，臨時換了再會啦無緣的人，可見秀英的心裡除了怨懟，

  依然有愛。


  場景三:


  老三阿眉(張鈞甯飾演)到現場拜拜捻香，雖然鏡頭不多，但那一幕盡是心疼，

  秀英問她在新加坡好不好?為什麼要回來?阿眉說: 我回來看妳啊，

  一句簡單的話，那個眼色與張力讓人感受到千萬個不得已與不捨，秀英問阿眉有沒有小孩，

  阿眉告訴她已經有了(在肚子裡)，(ps:習俗懷孕不得見喪事，非必要能避免盡量避免)

  秀英拿著紅線綁在阿眉肚子裡，一來是傳統觀念紅擋煞，二來是希望用紅線綁阿眉跟小孩

  綁在一起不分離的意思。我覺得這邊橋段只有2-3分鐘，張力情感很夠，滿催淚的。

  ps:阿眉是老三因出生養不起當時分出去給親友的。


  場景四:


  殯儀館橋上秀英對著已經往橋下走的女生叫聲蔡小姐(小三，丁寧飾演) 橋暗藏意思是奈

  何橋，女生的直覺很強的，可以隱約知道小三是哪位，那種不需言語眼神交流，同時可開

  啟探索空白這十幾年過去的想法。


  場景五:


  秀英告訴阿青"她從來沒跟她說聲謝謝"........阿青回嘴:他的報應很快就來了，

  阿瑜說出阿青癌症復發的場景，秀英震驚也心痛，或許看到阿青就一直讓她想起對丈夫的

  怨懟(阿青個性比較像陳伯昌)，但那一刻，她認真的正視親子間關係問題。


  場景六:


  秀英跟蔡小姐在媽祖廟的對話，兩人彼此都是真心為同一個男人祈福，那是一種了解一種

  釋懷，從小三口中得知老公是怎麼看待自己的，漸漸將執念放下，於是她簽了離婚協議書

  請小澄帶去燒掉，放下執念也自由了。


  場景七:


  要前往喪禮現場，摘下家門口的九重葛，九重葛是三片組成，有著三角戀的含意，其花語

  是有沒有真愛是種悲傷，她摘下了表示放下多年怨懟了，結束了不必要的三角戀，她搭計

  程車去接蔡小姐到會場，並讓她以未亡人身分列席，自己在計程車上唱歌( 呼應影片一開

  始，一樣過自己的人生) 場景的最後，秀英來到的靈前，面對了也放下了。


  這部戲當然不只這些，淑芳阿嬤，盈萱，vivian，小澄等人演技與眼神非常到位，

  片長2小時無冷場，時間很快就過去了，戲院裡滿多長輩來看的，或許那曾經是她們的

  故事。這是許導演自己外婆的故事，雖然很八點檔，很平常素材，但是他用單機結合

  眾多實力派演員，以平述及眼神讓人感受張力，我覺得是滿推薦的一部電影，

  沒有人可以要求另一個人真正的放下，唯有自己解開心結才能放下執念。


  家家都有一本難念的經，不去正視的問題不代表不存在，唯有愛才能解開心鎖。

  你不必很富有，只需把握擁有的。




  --'
