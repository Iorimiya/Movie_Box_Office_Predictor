url: https://www.ptt.cc/bbs/movie/M.1765965516.A.9F0.html
title: '[討論] 為什麼復仇者聯盟沒有Big4 只有Big3？'
content: '如題　後期的復仇者聯盟戰力通膨


  一堆怪物角


  比方女權隊長、女巫汪達　等等


  但Big 3  一直被認為是　隊長、東尼、索爾　　


  這3人各自有各自的高光時刻


  好比隊長舉起雷神之槌一個Carry全部　東尼更別說了　


  最後一集從頭Carry到他打響指那一刻　


  索爾的話　我個人覺得他巔峰時期就帶著暴風斧如天神般回到瓦甘達那時....沒了


  然而　綠巨人浩克的地位　我認為他是被犧牲的


  他早期也是有個人電影 (李安不算的話有1部 Big3各有三部　終局之戰後雷神還追加一部)


  按照道理講浩克的戲份應該很吃重


  後期卻完全被邊緣　無限之戰開頭就被痛扁　


  直到最後也沒恢復英勇姿態　廢了一隻手變成類似打醬油的存在



  這情況有點像網壇男子的Big 3 - 費德勒、小丑、達爾　


  本來號稱 Big 4 還加上穆雷　


  可是穆雷太廢了　後面被拿掉　變成大家只討論Big 3



  然而浩克被犧牲　我覺得完全沒道理　


  他的支持群應該很強的吧？


  --'
