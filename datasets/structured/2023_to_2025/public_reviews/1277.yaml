url: https://www.ptt.cc/bbs/movie/M.1453364013.A.950.html
title: '[好無雷] 發財夢——【大賣空 / The Big Short】'
content: '【大賣空】是一部相當酷的電影，它描繪了美國次級房貸與銀行騙局給經濟帶來的影響，

  而且一切是真人實事改編，加上節奏異常的快速，邊看這部電影時，我覺得那些熱錢的金

  額與投資的風險，刺激到我心臟都快跳出來。


  整部電影的卡司陣容堅強，但事實上，觀眾會非常專注於他們所提及的金融問題，以及隨

  之而來的風暴，演員的表現反而是錦上添花，更增加這部電影的可看性。而且我也第一次

  了解房貸債券的組成，雖然是美國的形式，透過電影能把這麼複雜的金融產品搞清楚，覺

  得很有成就感，而且我本來就對這些東西有點興趣。


  能把這類型作品拍得好不是件容易的事情，一方面必須交待當時的時代背景，還有許多嚇

  跑觀眾的經濟名詞，更重要的是報表上的數字觀眾可能一點也不瞭解其意義。不過電影中

  找了許多有趣的人物串場，也以各種趣味的比喻方式來敘述這些名詞的組成，例如找來主

  廚用烹調觀念講房貸債券的組成等等。


  看這部電影會有種金融夢大爆發，以及夢醒夢碎的心情。然而世界還在不斷地往前走，經

  濟一直是流動的，即使現在呈現這樣的狀態，誰也不能保證未來五年十年會發生什麼事情

  。因此能夠先馳得點的基金管理人或操盤手，才會這麼炙手可熱。我挺喜歡這整部電影的

  拍攝方式，很值得一看。


  --'
