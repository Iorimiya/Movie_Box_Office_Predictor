url: https://www.ptt.cc/bbs/movie/M.1700381462.A.0E9.html
title: '[ 好雷] BIG活著最大！'
content: '昨天去看了電影《BIG》口碑場，心得：大爆哭

  雖然在觀影之前就是知道這種醫護題材會是感人的路線

  但我真的沒有想到會是這麼感人！




  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  雖然已經防雷，但電影正式上映是12/1，我就還是小小保留劇情了，純分享自己的心得感

  受跟預告片有釋出的內容




  這是一部以抗癌兒童為主題，描述集結來自不同社會階層、不同面向的6組家庭，彼此從

  衝突到最後相互支持的故事。

  整部片的色調跟氣氛是明亮、開心、充滿希望的，並不是溫馨悲情的路線，但卻又處處充

  滿了賺人熱淚的哭點，劇情上也是用輕鬆的節奏來推進故事進行，可以看到病童們從起初

  的無知、逃避，到後來勇於面對自己的恐懼、勇敢挑戰病魔！

  影片前期，喬喬飾演的珈農看起來是個叛逆的小女生，面對爸媽冷漠，把自己的生死講的

  很隨便，讓我忍不住想，是什麼樣的心情會讓他這樣年紀的女孩有這種死了也沒差的想法

  ？

  影片中段算片中比較催淚的橋段之一，老實說整部真的很多哭點啦哈哈，這裡的敘事方式

  讓人更珍惜自己的生命跟家人之間的感情，雖然我還沒有生小孩，但透過演員的演技，也

  可以感受到片中父母們對於孩子的治療所抱持期待跟害怕。

  全片不論是大人還是小孩，我覺得演的都很好，感情跟情緒都拉滿到位，真的很推薦這部

  大家跟家人一起去看，很溫馨也很感人。


  提醒大家一定務必要帶衛生紙，我哭到眼妝都沒了XD


  --'
