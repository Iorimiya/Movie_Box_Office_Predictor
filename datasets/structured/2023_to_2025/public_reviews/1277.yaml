  Yahoo奇摩電影戲劇

  更新時間： 2024年9月10日 週二 上午12:06

  魏德聖導演電影《BIG》上映以來，在各大教養領域掀起一股必看風潮，自2023年底映演

  至今已邁入第十個月，包場數字已突破2000場，創下台灣電影史上映演最久、包場最多之

  紀錄。


  華語首席教練許榮哲：「我發下豪語，覺得不好看的人，都可以向我退電影票。」高雄在

  地實業家姚少洋更親力親為不斷包場，帶了數千名公益觀眾進戲院觀影，有感而發地說：

  「是什麼樣的電影可以讓人看了以後，願意跳出來自發性包場讓更多人看到，並且在8個

  月包了60場？我想此生只有魏德聖導演的BIG，能讓我如此瘋狂吧。」


  這部電影集結了童趣、感動、重生等元素，笑中有淚、淚中有希望。真實地描繪了人生周

  遭可能發生的挑戰與考驗，讓人體悟到生命的美好，無論是在快樂或是困難的時刻，都可

  以成為你我心靈的良藥與支持。親子專家們更呼籲提倡該片作為生命教育重要題材。薩提

  爾教養專家李儀婷老師：「電影道出三道生命的重要層次。第一個是小杰的逝去，表達了

  「道別」的層次。第二個是是延的離開，表達了「道愛」的重要。第三個源源的殞落，表

  達了「道謝」背後，活著的價值與生命意義。在生命面前，沒有人能避開死亡，所有人都

  終須一死。BIG是我所見過最能表達生命力之美的電影，太棒的生命教育。」知名作家愛

  瑞克：「與其對孩子說教（沒用啦），不如用兩個半小時一起欣賞一部好電影，我們做不

  到的教育，魏德聖導演做到了！」


  電影《BIG》在9月9日重磅推出電影本片隨身碟「希望之鑰」超早鳥預購，同步推出「家

  用版」與「公播版」兩種預購專案。搶先購買不僅享有多種優惠，還可獲得限量好禮。家

  用版將收錄最精華的電影幕後紀實，讓親朋好友一起共享感動與歡笑；公播版則將置入「

  口述版本」，帶領視障朋友一同進入BIG世界，聆聽滿滿的感動。趕快把握這次難得的機

  會，讓希望之鑰成為您的必備寶藏，在入冬之際，與家人一同進入希望與感動的世界吧！




  備註：不好看可以退費欸! 真心愛這片土地的人都應該要看吧!!!




  --'
