url: https://www.ptt.cc/bbs/movie/M.1709221419.A.FBF.html
title: '[新聞] 温嵐挺魏德聖《BIG》 掏20萬請偏鄉童看片'
content: "温嵐挺魏德聖《BIG》 掏20萬請偏鄉童看片\n\n電影打破包場紀錄 上映3個月首輪仍有場次\n\n04:10 2024/02/29 中國時報\
  \ 黃雯犀 、 李承陽\n\n\n温嵐（中）日前觀賞《BIG》深受感動，左起魏德聖、范逸臣、廖慧珍、賴銘偉。\n（摘自賴銘偉臉書）\n\n\n温嵐27日包場請尖石國中全校學生觀賞電影《BIG》。（摘自賴銘偉臉書）\n\
  \n温嵐27日包場請新竹尖石國中全校同學共227人，觀賞由魏德聖執導的電影《BIG》，校長\n彭清宏也一同出席觀看。據悉，温嵐自掏腰包近20萬元，包租了5輛遊覽車，帶山上的孩\n\
  子到市區觀看電影，並請大家吃午餐。她覺得可以為山上的孩子盡一份心力，非常有意義\n。\n\n温嵐因演出魏德聖執導的電影《賽德克．巴萊》，兩人進而熟識，日前受邀觀影，3小時\n\
  電影有笑有淚又勵志，「觀後就跟導演說不要太早下片，我要招待部落的尖石國中所有同\n學去看，畢竟山上的孩子們平常就比較少有機會去電影院，而且這麼勵志讓人很有勇氣的\n\
  電影，非常適合大家去看。」\n\n温嵐老家在新竹尖石鄉，表弟妹都就讀尖石國中，這次招待該校同學觀影，她也跟著二刷\n，她稱讚賴銘偉演技很好，還說看完電影讓人有股勇敢的力量去面對更難的挑戰。而她目\n\
  前正在收歌，希望今年推出新作品。\n\n《BIG》獲各界廣大回響\n\n電影《BIG》票房甫突破4000萬，創下全台包廳逾千場的數字，打破台灣包場紀錄，魏德\n\
  聖坦言剛開始推廣電影時並沒有像計畫中的順利，甚至遭遇惡評，但因癌童抗病的溫馨題\n材，讓觀眾年齡可以從2歲擴及到80歲，受眾廣泛，並獲得醫療界、體育界、教育界、宗\n\
  教團體、金融保險業等回響。\n\n《BIG》透過海量的包場延續上映場次，從去年12月1日上映至今，在首輪戲院播放長達3\n個月之久，同檔期上映的夢工廠動畫《魔髮精靈：樂團在一起》、早1周上映的史詩鉅作\n\
  《拿破崙》等片，都已排進二輪戲院，甚至上架網路串流平台，惟《BIG》仍在院線有場\n次。\n\n#尖石國中 #big #魏德聖 #上映 #山上的孩子\n\n--\n\
  佛法\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
