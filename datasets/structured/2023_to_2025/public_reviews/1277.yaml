url: https://www.ptt.cc/bbs/movie/M.1427725959.A.0BF.html
title: '[普雷] 大英雄天團Big Hero 6 '
content: "這部電影受到很多人的推薦，所以獲得機會我就毫不猶豫地看了，結果氛圍的營造走\n向完全就不是我原本想像的啊! 整部97分鐘的電影，我大概有30分鐘的時間都在大哭。\n\
  \n    如果「冰雪奇緣」是拍攝給小女孩看的，那「大英雄天團」毫無疑問的就是拍攝給小\n男孩看的，這是個關於小男孩學會獨立、青少年成長的故事。\n\n   \
  \ 但建構在這樣的出發點上，我就覺得這部電影企圖包含的元素太廣，最終，顯得零散\n而沒有一處能特別突出。\n\n    首先，因為想要吸引小男孩的目光，所以無論是英文片名「Big\
  \ Hero 6」和中文片名\n「大英雄天團」，都強調了「英雄」這個元素，在電影中機器人格鬥、乘著Baymax光速翱\n翔、酷炫的作戰、最終弱小男孩戰勝邪惡大叔，無一不是英雄電影最常出現的場景，我想\n\
  ，小男孩一定會為之瘋狂。\n\n    但是，電影設定的核心人物Baymax，卻是個軟綿綿，像是個大棉花糖的溫暖大傢伙，\n這分明就是要讓少女們融化：當遇到傷心難過的事時，能有Baymax溫情的問候，緊緊地摟\n\
  你入懷，我想再也沒有比這個更療癒的了，所以日文片名就直接取此為主題，將Baymax直\n翻成片名「ベイマックス」。當然，我也不是認為Baymax是個失敗的人物設定，Baymax的\n\
  可愛形象勢必也會深植小朋友的心，但這似乎偏離了青少年成長的故事主軸，會讓我邪惡\n地認為這是不是只是想要賣出更多周邊商品的人物設定罷了。\n\n    談到劇情，我認為是中規中矩沒有讓人特別意外的地發展(我想應該很多人電影看到\n\
  一半就猜想到幕後大魔頭是誰了)，但是劇情推展順暢，也絕對是毫無冷場讓人眼睛都捨\n不得多眨一下；尤其是氛圍的營造非常成功，不著痕跡地渲染了觀眾的情緒，這也是讓我\n\
  很驚奇的部分，原本以為影片走向會是幽默輕鬆而結局是皆大歡喜；但殊不知他卻披露了\n現實的殘酷和成長當中所會面臨的無奈和孤獨，讓我特別有共鳴。\n\n    因而我不得不提讓我哭得肝腸寸斷的哥哥-Tadashi。Tadashi儼然是完美的哥哥，挺\n\
  拔、帥氣、善良、溫柔且聰明，雖然總是喜歡欺負弟弟Hiro，但是當弟弟遇到難關時總是\n挺身而出，設法幫弟弟指引明路，並且永遠以弟弟為榮；而他希望可以幫助世界上更多的\n\
  人，經歷了84次的失敗，終於創造了醫療機器人Baymax，但因為場大火，幸福快樂的故事\n瞬間天崩地裂。\n\n    Baymax就這樣繼承了Tadashi的意志繼續守護著Hiro，陪伴著Hiro成長，讓Hiro知道\n\
  他其實不孤單，他身旁總是有大哥哥大姊姊在幫助他，而Tadashi的意念也因為保留在\nBaymax的晶片中而不曾離開。最終Baymax為了救Hiro而犧牲，Hiro不再是那個自負、沒有\n\
  目標、一心只想復仇了小男孩了，他延續了Tadashi的理想，然後自信的走屬於他自己的\n道路。\n\n\n                          \
  \ \n\n\n    感動是非常感動，但假設這部影片想要以此教導青少年成長，似乎又太過於拐彎抹角\n而難度太高，也無法讓孩子設身處地地把自己投射在主角身上，我就覺得成效打了折扣；\n\
  而電影也試圖表達失去之至親的哀働，教導小朋友該怎麼面對與放下，但我覺得深度好像\n也不夠深，我覺得有些可惜。\n\n\n    就感覺，「大英雄天團」是盤，大家可以挑自己愛吃的菜去吃，但是每個\n\
  人都。\n\n\n    不過，整體來說，我覺得其實「大英雄天團」還是部非常好看的電影，富含商業價值\n，同時又顧及各個年齡層的觀眾；尤其創造出Sanfrantokyo這個城市美到讓我驚嘆，結合\n\
  了這兩個城市最璀璨的精華，卻完全不會讓人覺得突兀，反而會期待主角到底會帶你到這\n個城市的何處探險。不過，也是如前文所提到的，也許我對他的期待太高，最終，讓我對\n\
  他的評價，並不是那樣的慷慨，真的覺得很可惜。\n\n\n--"
