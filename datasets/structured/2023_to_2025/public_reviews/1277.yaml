title: '[新聞] 民團辦魏德聖BIG特映會 鼓勵花蓮災民振作'
content: '新聞網址：



  0403地震對花蓮居民的影響深遠，




  花蓮0403強震重創當地產業，除了許多受災戶受到財產損失外，


  當地居民的心靈創傷也需要時間來癒合。


  基督教救助協會今天發布新聞稿指出，


  救助協會在地震後除了等措施外，



  電影「BIG」是一部以「816」兒童癌症病房為背景的影片，


  魏德聖指出，電影主要描述孩子變身成戰士的故事，


  病房裡的每個孩子都在面對挑戰，但也都在正面迎擊，


  「他們就是因為夠勇敢，才會被派來作戰，



  魏德聖也分享自己過去的低潮經驗，


  3年前因為疫情嚴重，他停止籌備已久的電影拍攝，


  不僅

  後來他靠著撰寫「BIG」的劇本，內心的傷漸被療癒，


  「既然光寫劇本就療癒了自己，那拍出來給更多人看，一定可以帶給更多人慰藉」，



  魏德聖鼓勵在0403震災受創的人，




  就能創造奇蹟，就有正面團結的機會，


  你們都是勇士」。


  基督教救助協會秘書長夏忠堅表示，


  「BIG」的敘事手法感人，透過癌童對抗病魔的過程，


  ，


  希望藉此也能鼓勵花蓮的受助家庭，勇敢走出傷痛，


  重新站起，只要不放棄、相互扶持，


  世上沒有解決不了的問題。


  ----


  只要不放棄 不管環境多惡劣都有贏的機會！


  魏導講給自己聽也講給災民聽


  電影贏！ 魏導贏！災民贏！三贏！


  --'
