url: https://www.ptt.cc/bbs/movie/M.1434358812.A.65A.html
title: '[普雷] 「大眼睛」(Big Eyes) - 大騙局'
content: "圖文完整版： \n\n「大眼睛」雖是提姆波頓導的，但他大部分作品裡的詭譎黑暗風格，並未在此\n出現。這算是波頓作品中少數比較像在真實世界裡發生的片。\n\
  \n50年代，Margaret﹝艾美亞當絲﹞是一位畫家，帶著女兒逃離上一段婚姻之後\n，與另一位畫家Walter Keane﹝克里斯多夫沃茲﹞結婚，後來Margaret的畫作\n\
  卻被丈夫佔為己有，以Walter的名義展出與出售，Margaret也越來越像被禁錮\n的囚鳥......\n\nMargaret的作品算不算藝術、有沒有藝術價值，依舊有爭議，不過本片並不想\n\
  加入戰局，Margaret的夫妻關係以及Walter的騙局才是重點。但觀察片中對於\nMargaret角色的關愛與同情、電影開頭引用安迪沃荷的言論(\"I think\
  \ what\nWalter Keane has done is just terrific. It has to be good. If it\nwere bad,\
  \ so many people wouldn’t like it.\")、以及提姆波頓有收\n藏Margaret畫作的事實，或許提姆波頓想簡單表達的是，這些藝術家都是真誠\n\
  表達他們心中的想法，無論如何他們的努力都值得認可。\n\n但老實說，我會想在片中看見更多這方面的探究，或至少呈現一下，Margaret\n對自己作品被大眾喜歡卻被評論家批評甚至唾棄是什麼感覺？這點甚至導演提\n\
  姆波頓恐怕也常親身體驗。當我看到片中的Walter問出\"Just because people\nlike my work, does that make it\
  \ bad?\"時，我彷彿看見波頓在問同一個問\n題。\n\n不過，既然Margaret的藝術本身不算本片主題，焦點就變成了她的生平。在她\n生長的年代，女人離性別平等還相當遙遠，連離個婚都算是醜聞。當時的單親\n\
  媽媽處境極為艱難，Margaret為了生存考量，倉促找人結婚，期待被拯救，對\n很多事情不敢違逆，也是情有可原。後來因為謊已經起了頭，她缺乏自信、需\n要錢、又已是共犯，只好配合丈夫說謊，佯裝那些畫作是老公畫的。諷刺的是\n\
  ，當她的畫作越成功，她的日子卻沒變好，反而越悲慘，簡直跟地下工廠生產\n線的女工沒兩樣，她得無時無刻趕工，沒時間陪女兒，還得向女兒隱瞞，兩人\n的距離越來越大，知心好友也漸行漸遠。我最喜歡的一幕是Margaret在超市時\n\
  ，她的畫作與康寶濃湯的相映，這幕沒有一句話，卻彷彿承載了千言萬語，鎮\n日趕作品的Margaret看起來失魂落魄，她的心血結晶跟平價速食一樣在超市擺\n得滿坑滿谷，而她一身樸素主婦樣走在那兒沒人知道這人就是當紅畫作作者，\n\
  漸漸地她彷彿看見每個人都有著她作品中的大眼睛......多少諷刺、無奈就藏\n在如此簡單的畫面中。\n\n這樣的背景與處境，讓人很同情Margaret，但可惜的是，我會希望看到夫妻之\n\
  間相處細節與互動模式的更多面向，而非只從惡霸與受害者的角度來切入。或\n者可藉由更多Margaret與好友DeAnn或女兒的交談及相處，來表現更多\nMargaret的想法、掙扎、擔憂與折磨，以及後來信仰如何影響她等等，而不是\n\
  如本片這般幾乎只看Walter耍花招，其他就快速掃過。\n\n當然，Walter是個很有趣的人物，他非常複雜，結合許多特質於一身，他知道\n如何討好別人、說服別人，同時又有可怕陰暗的一面，甚至觀眾會開始懷疑他\n\
  到底是自信過頭，還是有妄想症。可是，畢竟本片的故事主幹是Margaret，從\n頭到尾貫穿的是她的成長改變與領悟，而她與Walter的婚姻與合夥關係，是促\n\
  成這項改變最重要的因素，可惜整部片看下來，Walter這角色實在太搶戲，\nMargaret的著墨反而相對不足，連讓她真正下定決心澄清真相的宗教影響都只\n是簡單帶過，因此最後一幕原本應是全片高潮，我感受到的情緒卻不是很強。\n\
  或者，若乾脆把故事變成Walter的，結尾也以Walter為主，搞不好也會很有趣\n。畢竟，Walter也不是完全一無是處，若不是他的行銷長才，或許Margaret永\n\
  遠沒機會讓人看見她作品、或是被稱為畫家，甚至難以養大她女兒，Walter這\n樣的怪胎搞不好也是很精彩的電影主題（Walter本人於2000年過世，到死前他\n\
  都還堅持那些畫是他畫的，我是真的很想再多了解這個人到底怎麼回事）。\n\n還有個大問題是克里斯多夫沃茲實在演得太超過了，腔調也完全不對（Walter\nKeane是美國內布拉斯加州人，片中的他卻帶了點歐洲腔），他簡直像卡通裡\n\
  面的老巫婆，或像個跳樑小丑版本的精神病患，尤其法庭戲那兒Walter簡直成\n了詭異鬧劇，跟整部片完全不搭，即使Walter對Margaret的身心是很大的威脅\n\
  ，卻因克里斯多夫沃茲卡通般的詮釋，削弱了力道。我感覺Walter跟Margaret\n不像在同一個次元空間的人，或者，Margaret是真人而Walter是卡通。所以即\n\
  使艾美亞當絲演得非常精采內斂，從退縮到自信都絲絲入扣，我卻感覺男女主\n角好像在各演各的搭不起來。其他配角如Krysten Ritter、Jason\nSchwartzman與Terence\
  \ Stamp，戲份雖少但都還不錯，唯有旁白顯得莫名其妙\n了些，本片旁白的設定是一名記者，他當年的文章捧紅了Walter Keane，這名\n角色展現了媒體、輿論、名流是如何操縱流行，是很好的安排，但由他誦讀的\n\
  落落長旁白卻顯得突兀，這不是演員而是劇本的問題。\n\n「大眼睛」是提姆波頓再度與「艾德伍德」(Ed Wood)編劇Scott Alexander與\nLarry\
  \ Karaszewski合作的作品，不過個人認為「艾德伍德」好看得多，有興\n趣的朋友可以找這部1994年的片來看。\n\n--\n\n我的部落格 \nFB粉絲團\
  \  \n\n--"
