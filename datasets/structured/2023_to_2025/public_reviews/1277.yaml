url: https://www.ptt.cc/bbs/movie/M.1421395660.A.41B.html
title: '[創作] [Big Hero 6] 四次阿正留下了什麼，一次'
content: '作者: IneVan (不如這樣吧) 看板: BB-Love

  標題: [衍生] [Big Hero 6] 四次阿正留下了什麼，一次

  時間: Wed Jan 14 17:14:24 2015




  篇名：四次阿正留下了什麼，一次沒有


  配對：Tadashi Hamada/Hiro Hamada (無差)


  等級：G


  聲明：I own nothing.




  BH6 超級好看！！超級！！QuQ


  字彙貧瘠的我只能擠出這樣程度的感想 (大哭)


  真的好喜歡塔打西喔 (′‧ω‧` )


  1、


  照料小孩永遠不是件簡單的事，尤其在對象還是個天才兒童的情況下，這任務更顯得艱難


  無比。



  小廣四歲的時候已經能認得許多的單字，甚至一些艱澀的片語和名句也都能如數道來，他


  的閱讀範圍很廣，只要書是放在他的身高能搆得著的地方，大多都已被翻閱過了，舊家書


  房裡書架上的書都被阿正拿到較低的小桌或地板上，好讓小廣能輕鬆取閱，他一整天都能


  耗在這些木質纖維堆成的東西上頭，直到阿正把他從書堆裡拽出來為止。



  那時家裡沒什麼人，總是很安靜，爸媽走了以後，他們還在等待最後的收養結果出來，阿


  正仍然得去學校，每天早上他會把小廣帶去隔壁潔西奶奶那兒，放學回來後再接他回家。



  大量的閱讀帶來許多好處，小廣從沒有想表達些什麼卻找不到適當字詞的時候，也從不缺


  乏學習的動機和熱情，知道得越多，未知之處便越多，這世界對他來說就是本巨大的、攤


  開的書冊，任人隨意翻閱遊歷。



  阿正當時正在準備畢業考，準備跳級升上七年級，他比同年齡的人還要聰穎一些，對科學


  ，尤其是和人體有關的部分，懷有極大的興趣，周圍的人都說阿正以後會是個傑出的科學


  研究者，但他心裡曉得，他的小弟弟才是個真正的天才。



  他知道小廣早晚有一天會成為真正的發明家，所以從未想過要限制他吞食知識的速度，阿


  正一直覺得那就是小廣想要的，並且也是他所需要的，那時他甚至以有這樣的弟弟而自豪


