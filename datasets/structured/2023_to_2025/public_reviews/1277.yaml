title: '[討論] Abigail Breslin 好像有點長歪?'
content: '她小時候超可愛的

  有種古靈精怪的感覺

  My Sister''s Keeper、Definitely, Maybe、No Reservations

  那時候超棒的


  沒想到最近偶然看到她的新聞

  才發現她已經20歲了

  變得有點普 =_=

  好像吃太多所以有點像常見的發福美國妞

  而且她又不高才1.55

  可愛系的童星長大如果沒長高

  通常發展都很受限


  比她大一點型類似的 AnnaSophia Robb (1.52)

  發展就普普

  不過 AnnaSophia Robb 的身材和外型可比Abigail 維持得好多了....


  童星還是要像 Elle Fanning (1.75)這種抽高一點比要有搞頭

  或是像 scarlett johansson/natalie portman 臉可以直接長大不奇怪的


  --

  超殺女沒她肉而且還比她高(1.63)

  她有小時候好像就是肉肉的

  可能是易胖體質吧

  臉好像有瘦但是身材這樣看不到吧

  最近好像和貝克漢兒子分手，說不定會奮發圖強變瘦xdd

  其實我要說的是她這一型的童星長大後

  表現通常不如童星時期'
