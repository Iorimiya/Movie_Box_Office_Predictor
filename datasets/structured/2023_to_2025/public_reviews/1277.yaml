url: https://www.ptt.cc/bbs/movie/M.1711887520.A.504.html
title: '[新聞] BIG航向世界—魏德聖導演手記'
content: '魏德聖／BIG航向世界——魏德聖導演手記


  美國真的就是一個造夢的地方，特別是我們這個行業的電影夢，從製片廠的攝影棚開始，創

  造出一整個美國的電影工業，然後延伸出明星產業，再延伸出娛樂產業，甚至因為電影而產

  生的新科技！北美行程雖然是一趟《BIG》的巡迴放映旅程，也是我重新親近自己的電影初

  衷，重新釐清自己到底想要追求的是什麼？


  亞特蘭大是目前美國電影新的發展重鎮，許多電影製作都慢慢從紐約、洛杉磯移往了亞特蘭

  大。當我們在當地放映《BIG》的空檔，當地同鄉會會長透過關係，讓我們參觀了目前還在

  建造，還未開始營運的全新製片廠。當被他們介紹，說我是台灣很有名的導演的時候，我真

  的好心虛，在規模這麼龐大的製片廠裡覺得自己好渺小。參觀了他們所有的攝影棚、實景搭

  設的街道、以及高規格的明星休息梳化空間，還有讓我扼腕沒有辦法實拍的台灣三部曲所心

  心念念的大水池，眼睛看到全部都是錢，不只造價昂貴，也是只能看，卻一輩子也用不起的

  攝影棚。


  以前年輕，當我還不知道世界有多大，自己有多小，那個時候什麼夢都敢做，什麼都不怕！

  每次因為電影的緣故到海外去參觀或是參加影展，只要看到什麼別人有，我們沒有的，我都

  會想這個還好，我們台灣應該可以自己來；這個想法很棒，我們只要稍做修改，就可以做出

  符合台灣需求的樣子。但是現在我知道世界有多大了，我也知道自己有多小了，看得愈多，

  愈覺得我們做不到！然後也不是很想去試了。


  想想我為了台灣三部曲造了一個那麼大的夢，。想想我們拍《BIG

  》的時候，只是為了一個不可能進去拍的病房，而重新搭景，嘗試用動畫製作來滿足孩子幻

  想的戰鬥，。但是我在這裡看到的每一項，都超過我們預算的十倍以上，我真

  的不應該來看這個片場的，！


  好萊塢有夢工廠，包容並且創造一切的夢，但我們真的不能讓台灣也成為新的夢想之地嗎？

  或者，


  在北美巡迴放映期間，偶爾會在一些很古老的戲院放映，我很喜歡在這些老戲院裡面逛，仔

  細看著每一張老海報，以及好多永遠停留在年輕時期的老演員照片。


  其實我人生最後的夢想，就是可以開一家屬於自己的小電影院，最好可以復古如這種老戲院

  的裝潢風格，除了放一些比較小眾的電影之外，偶爾也放自己的電影，或為自己喜歡的電影

  辦小影展，也不用太多員工，一個我、一個放映師，再加上一個在販賣部的員工，三個人就

  可兼顧所有業務的小小電影院！之所以會有這種想法，是我在好久好久以前曾經在德國的一

  家老電影院裡面放過電影，那是我見過最漂亮最舒服的電影院。除了保持老式風格的裝潢之

  外，讓我覺得最有趣的就是那個販賣部，賣門票的老太太是老闆的妻子，賣完門票之後直接

  走到後面打開後方櫃檯半截的鐵門，就是一個完美的販賣部，除了爆米花、可樂之外還有好

  多的零食，最有趣的是還賣小瓶的紅酒，好多客人很習慣地直接買了小紅酒，在一旁的高檯

  桌上喝了起來，邊和招呼的老老闆談笑！老放映師確認放映沒問題之後，也出來和老闆和客

  人們閒話家常，就三個老人包辦一家戲院的所有業務。好想過過這種生活……


  當然在我夢想中的老戲院裡，《BIG》是一定要放映的，因為這是我最愛的一部電影，在美

  國放映的行程裡，我每一次都站在影廳的最後面，從頭看到尾，每一次每一次，即使我已經

  看超過兩百遍了，我還是不會覺得膩，我還是覺得非常好看，真的真的非常好看！


  我喜歡看著小小的孩子們來看電影《BIG》時的反應跟專注的眼神，雖然很多時候很難從問

  話當中知道他們心裡想什麼，但是我總覺得應該有什麼留在他們心裡吧？


  這次來到北美巡迴《BIG》電影，可能也受到台灣觀眾的回饋影響，一樣都是扶老攜幼地來

  看電影，基本上反應和台灣孩子們一樣，也有孩子看到後面一直哭，對我非常不能諒解，為

  什麼我最後要讓源源離開？


  「不過還好你最後有讓他們變成用力唱歌跳舞的戰士，所以我原諒你！」


  很高興大部分的孩子都有很強的感受力，我認真地確定這些孩子們即使有一天老了，也會記

  得《BIG》電影裡面的故事，或是某一個畫面！


  我記得我童年的時候，外曾祖母還在，每次回外婆家，媽媽都會要我們去外曾祖母身邊，讓

  已經眼盲的她可以摸摸抱抱我們這些小小曾孫的嫩肉。每次當家常的閒話說完之後，就會有

  一陣好長的安靜，然後外曾祖母都會叫我們趕快出去玩，但媽媽總是比畫著，要我們不准離

  開。這時候外曾祖母就會開始說她童年去村裡看皮影戲的故事，她會詳細地描述著是跟誰一

  起去看的，也會更深入地描述那皮影戲裡的姊妹受到的艱苦遭遇。說著說著，她已經看不見

  的眼睛還是會流眼淚，或許她已經瞎了的雙眼，還能看見童年的皮影戲！


  會想到這個故事，主要是我也在想著，《BIG》這部電影能夠留給這些孩子什麼樣的畫面？

  什麼樣的感情？在六十年後、七十年後，當他們有機會和他們自己的孫子說故事的時候，他

  們會不會提到這部電影？


  「以前我小時候啊，有一次我的爸爸媽媽帶我去電影院看一部電影，叫做《BIG》。裡面有

  七個好勇敢的小孩子，他們勇敢地在對抗著最強大的魔王軍團……」


  .


  不知道魏導是想要怎樣的水池？

  台中拍過少年pi 跟沈默的那座還不夠他用嗎？

  然後他有必要每拍一部片就想著要名留青史嗎？


  --'
