title: '[好雷] 好哭的國片BIG'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  *手機發文排版不佳請見諒*


  12/1 中午滑 IG (我是努拉粉～)看到喜滿客高雄總圖下午的場次有映後就決定去看，因

  為是平日所以觀眾不多，大概跟出席的演員差不多，工作人員甚至更多XD


  *以下有雷請注意*


  第一個讓我紅眼眶的是兩個媽媽假抽煙互相鼓勵的場景，有點忘記第一個掉淚的是哪一幕

  ，但印象最深刻的三個地方是：


  1.是延爸媽收拾病房後走出去時，彩色筆掉了滿地。


  2.是延手術失敗的隔天，溫暖醫生睡在屋頂上被蝴蝶喚醒，感覺蝴蝶象徵是延，光線很美

  。


  3.光頭父子(忘記名字)的畫面(不知道怎麼稱呼)很有莊嚴感，東方與西方宗教文化合作，

  共同目的都是祈禱孩子能健康。


  也很喜歡童言童語的部分，像是冰淇淋燒掉變奶昔有戳中我笑點。


  另外影片一開始是動畫呈現，我疑惑了一下該不會走錯廳，還拿出票根仔細看，後來才知

  道動畫是象徵小朋友們對抗癌症的過程。


  我覺得表現最好的演員應該是曾沛慈飾演的源源媽，其他演員偶爾或一兩次都有點讓我微

  出戲，但整體而言不影響觀看體驗。


  p.s.看到田中千繪和范逸臣睽違多年再次搭檔有種懷舊感，也驚覺“阿～海角七號那麼多

  年了啊～”





  --'
