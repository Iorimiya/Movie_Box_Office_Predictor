url: https://www.ptt.cc/bbs/movie/M.1420302528.A.C01.html
title: '[普雷] 大英雄天團 (Big Hero 6)'
content: '剛看完回來，微風國賓2D英文


  原po年約30男性，會逛電影板 但有預備要去看的電影只看標題





  個人很喜歡迪士尼近年片頭的前導短片


  沒有對白卻令人印象深刻且覺得意猶未盡的小品


  這次的也不失水準，用一隻小狗的視角來敘述一段愛情故事


  特別的是圍繞在狗食上，從狗食的變化可以看出


  途中主人和一位素食主義的女生交往，經歷過熱戀~吵架~復合~結婚~生子~


  大部分都用狗食的變化來呈現，相當有趣的小品。







  正片一開場有種在看鋼鐵擂台的錯覺  XD


  主角一開始使用的機器人之後都沒再用到了


  個人覺得有點可惜~ 還蠻有喜感的變臉機器人




  科展的部分，主角上台前的不安與沒自信... 跟他呈現的作品....


  雖然是戲劇效果...但這根本就是跨世代突破性的大發明吧！ 他不需要這樣子才對 XD




  接下來談談杯麵這個角色~ 算是天然呆~憨憨的機器人


  再用上它渾圓的外表來製造笑點


  現場的小朋友是笑的很開心啦.. 但我是都沒被戳中笑點..頂多讓我面露微笑而已 XD




  中間主要劇情給我的感想就是有點動畫版復仇者聯盟的感覺 XD




  然後是兄弟情的部分....


  我覺得刻劃的還不夠，再多點篇幅會好一點


  幾個明顯是要製造哭點的部分...都沒有讓我有熱淚盈眶的感覺  相當可惜~



  (隨便舉幾個最近的例子：哈比人3五軍之戰，索林清醒衝出去的那段


  因為前面整個舖陳足夠，又有點蝙蝠俠黎明升起的感覺，讓我十分感動！


  還有最近看了一部經典：十月的天空，雖然老梗但洋蔥味十足！)


  啊！離題了~ 但我想表達的是，這部親情戲醞釀的還不夠深刻...





  當然還是有蠻多優點的~例如背景出現的一些小彩蛋


  還有融和舊金山與東京的城市，而且這部片有幾幕場景細膩到我以為是實景拍攝...


  但我看動畫是想看脫離現實的奇幻世界啊~ XD



  還有台詞前後呼應的部分的這點也覺得很不錯~


  但我對於  先營造一個壞蛋形象的角色  再讓你有點出乎意料的揭曉


  然後再來補足動機的橋段好像有點膩了....





  總之就是雖然不難看~但有種隔靴搔癢的感覺...


  只是想說板上一片好雷，打一點心得來均衡一下  XD





  以下有幾個吐槽跟疑問


  雖然我對看電影還要找bug、雞蛋裡挑骨頭的有點反感 XD


  但就是想瞎問一下 :P


  1.一般火災現場不是至少都會確認遺體有幾具嗎？


  還是裡面太多化學機械類的材料全部燒成灰了..



  2.從背景設定看來~機器人科技已經如此發達了


  為何測試一項物質轉換機還需要一位人類駕駛？ XD



  3.杯麵是何時拔出他的保健晶片？


  本來我以為是被壓在磚頭下準備要絕地大反擊的時候..


  但後來拳頭到壞蛋臉前停了下來又否定掉這個想法..



  --'
