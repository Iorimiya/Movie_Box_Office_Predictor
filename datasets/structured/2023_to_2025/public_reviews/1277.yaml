url: https://www.ptt.cc/bbs/movie/M.1752462999.A.9E4.html
title: '[好雷] 侏儸紀世界：重生 ~ 及格的Big Dumb Dinasour Movie'
content: '我對這部片沒有任何期待，原本也沒打算要看

  但週末臨時有個時間空檔

  就決定進戲院吹冷氣嗑爆米花了


  跟前幾天看超人時相比，影廳裡坐得滿滿的

  有大齡觀眾，也有全家大小一起出動的

  週末的下午，票賣到剩前三排是空的

  這個景象在過去只是正常發揮

  現在卻感到好久不見了，不免有點令人感嘆...











  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  侏儸紀世界：重生作為系列的第7部作品

  觀眾難免都會懷疑它還能帶來甚麼新意

  老實說它也沒啥新意，整體來說就像侏儸紀公園3新改編版


  但或許恐龍電影也不需要刻意添加甚麼新意了

  (侏儸紀世界3把問題變成基改蝗蟲還不夠有新意嗎?

  但有新意就代表好看嗎?)


  觀眾進戲院就是想要看電影魔法重現活生生的恐龍

  如果這點有做到就60分及格了


  所以先講結論：重生是一部及格的暑期爆米花電影


  講完結論再講講主要缺點：人類角色太路人、缺乏辨識度


  侏儸紀系列裡從來不缺人類角色

  (畢竟觀眾需要感情投射的對象)

  但以前的作品裡不管是反派還是主角群

  個性通常都很鮮明，演員也夠知名

  讓你能很快地進入劇情裡

  同時對於主角，也會有幾個重要的段落

  去刻劃角色的特別之處


  葛蘭特博士趴在三角龍身上，感受活生生的奇蹟

  麥康姆把水滴在女主角手上，講述著生命會找到出路

  歐文肉身面對四隻迅猛龍，謹慎但又沉著冷靜


  幾乎過去每部侏儸紀的主角都會有些名場面、名言

  但重生看完我真的找不太出來


  博士就是個恐龍宅，還是葛蘭特的弟子

  但或許是鬍子的關係，很多時候我接收不到他的感動

  (他在魔法壞女巫裡的表現我覺得是有演技的)


  佐拉為首的傭兵集團大多數都沒個性，出來只為了領便當

  佐拉跟鄧肯這兩個稍微有點人味的的腳色

  人物塑造又只散布在幾句對話裡，然後就沒了

  我們只知道他們是能力不錯的傭兵，但是又有良知

  (所以我們就該喜歡他們嗎?)

  做為主角來說，他們的背景實在有點白開水


  "反派"也有點空，他全片做的最壞的事情就是對少女見死不救

  要恨好像也恨不起來?


  總之所有角色的輪廓都很模糊，讓觀眾不太知道該把自己投射到誰身上

  (落難那家人我真的是一言難盡，就表過不提了)


  彷彿編劇在說"嘿，我們知道你們是來看恐龍的，所以那些不重要"


  所以對人物鞭了那麼多，為什麼我給好雷?

  .

  .

  .

  因為我是來看Big Dumb Dinasour Movie的啊

  前面就說過有恐龍60分了嘛XD


  本集的劇情設定讓主角們必須找到陸海空三種大型恐龍

  第一個出場的滄龍，可以說是世界系列最具代表性的恐龍了

  (公園系列的代表恐龍無庸置疑的是暴龍)

  但這次登場的威壓感應該是最大的，出場時間也是最多的

  從開場襲擊平民的帆船，接來來主角們的追逐戰

  以及最後的滄龍反過來追逐主角們(還加碼棘龍互利共生)

  彷彿在對人類說：你們才是挑戰者喔(誤)


  我唯一比較遺憾的只有，劇情沒有首尾呼應的

  讓滄龍在主角們最後海路逃離時再秀一次

  重現類似侏儸紀公園片尾暴龍的吼叫畫面


  總之陸海空的海這邊絕對是得分了


  陸的泰坦巨龍在劇情裡被敘述為地表最巨大的恐龍

  不過個人對牠是比較陌生的

  查資料時也發現牠的化石數量較少，分類上存在歧異

  個人覺得牠們的登場是在致敬侏儸紀公園的腕龍場景

  也是主角追尋陸海空恐龍時難得的平靜時刻

  (個人是對那條鞭子一般細長的尾巴感到好神奇)


  空的風神翼龍場景，相對就比較弱

  主角們沒能力抓到牠所以直接變成偷蛋

  而風神翼龍的襲擊幾乎都是用爬行得

  沒有展現牠空中霸主的一面

  (侏儸紀公園3至少還有降落傘男被翼龍抓走飛行一段的橋段)


  至於非主線部分，暴龍照慣例的還是要出來露露臉

  而落難的一家人就成了被追逐的肥羊

  好在這隻暴龍只是睡醒了有起床氣，不是真餓了

  所以有活動到筋骨就悻悻然撤退了lol

  (由於棘龍跟暴龍沒有碰到面，所以本片沒有任何暴龍受到傷害)


  至於其他的異形就一言難盡了...

  雖然都是基因改造出來的生物

  但過去的恐龍外型都是依照人類的模擬想像去打造

  樣貌我們也都習慣了，會把牠們當成生物看待


  但這集新出來的這些異形擺明就是要來噁心人的

  告訴我們"基因改造不好，不要基因改造"


  迅翼龍看名字就是迅猛龍加翼龍混出來的

  但長得真的是很醜陋不討喜


  雖然牠對位的侏儸紀公園的迅猛龍也是把觀眾嚇到心驚膽戰

  不過我相信會有小朋友會想要迅猛龍的玩具

  但收到迅翼龍玩家的小朋友會生氣(前提是玩具商真的敢出的話...)


  至於大魔王D-REX雖然開頭就有驚鴻一撇

  但後面登場的時間實在是太短，戲份上也沒太多表現

  就只是追追人類這種毫無反擊能力的存在而已

  難以表現牠有多強大


  新恐龍要立威當然要手撕其他恐龍才夠震撼力啊

  我就是那麼膚淺想看恐龍打架不行嗎?

  看看侏儸紀世界片尾的大戰多麼令人印象深刻


  相比之下，重生的收尾就像導演看看時間說：

  "片長差不多了，特效也燒得差不多了，大家見好就收吧"的戛然而止


  負責引走D-Rex的鄧肯還全身而退

  (雖然我想像的出他奮力丟出燃燒棒，然後反方向脫身的樣子)

  所以有良知心疼小孩，你就不會領便當

  這結尾真的是很有教育意義(?)


  總之這是一部熱鬧，特效還不差，驚悚場景也有做到位的恐龍電影

  雖然劇情細節上有些禁不起推敲

  (博士跟鄧肯從室外一個推門就來到關D-REX的圍阻體內了，WTF?)

  人類腳色也不太有吸引力(從預告就有這樣的感覺)


  但如果你的期望就只是Big Dumb Dinasour Movie

  那你可以得到你想要的


  以上


  --

  我講得"恐龍"只是一個一般人都能理解得稱呼

  如果打"蜥形綱"動物恐怕沒幾個人能有畫面'
