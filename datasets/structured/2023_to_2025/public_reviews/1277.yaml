title: '[  雷] BIG HERO 6 大英雄天團'
content: '抱著有點遺憾的心情來分享。


  從看到預告片開始，真的被那個充氣機器人萌到了，所以一直一直在（超）期待這部片的

  上映。


  可能期待越大失望也越大，不曉得為什麼有一種違和感，讓我一直沒辦法入戲。



  機器人很可愛，但是有些部分的營造，有點做作。


  故事內容沒什麼驚喜，壞人也很好猜，緊湊度也還好，


  不差，但是也沒有說好看得令人難忘，就......一部不錯但是也容易被取代的動畫。



  我心目中的第一名經典還是馴龍1，FROZEN的記憶點也比BIG HERO 6強，


  覺得不夠過癮，太可惜了，預告做得這麼棒。


  --'
