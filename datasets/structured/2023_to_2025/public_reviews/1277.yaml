url: https://www.ptt.cc/bbs/movie/M.1554641915.A.DFA.html
title: '[普好雷]星際黑洞 the big everything(2015法國)'
content: "雷文防雷資訊頁\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n1.影片名稱\
  \ :\n星際黑洞 the big everything(2015 法國電影Le grand tout)\n\n\n2.觀影時間 : 2019.4月\n\n3.觀影地點\
  \ : 住家網路\n\n4.觀影方式 : 中華電信MOD電影199\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  此區為發文防雷頁\n可選擇性提供上列 1~4 資訊  或不提供亦可\n觀影心得於分隔線下方發布即可\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線\
  \ ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n星際黑洞 the big everything(2015 法國電影Le grand\
  \ tout)\n\n…………………………………………………………\n\n中華電信MOD電影199,\n4/11下片。\n\n…………………………………………………………\n\
  \n以下劇情介紹，轉貼自:\n\n\n單純的宇宙研究之旅卻成意外的時光旅行。\n他們要如何面對消失的家園，展開新生活…\nGlaz TN1任務及其五名船員，飛往距離地球50光年的地方研究宇宙的支柱：靠近光速的黑\n\
  洞，這是個6週的往返行程...但是時間有自己的規則。當他們回到地球，100年過去了。\n不過6個星期卻已經過100年...身為精神科醫生的船員幫助飛行員和船上的3名科學家面對\n\
  這種雙重現實，並取得了一些成功，直到事件發生。\n藉由黑洞進入一萬光年的空間，就會變成兩萬年後的地球，他們必須重建自己，同時探索\n一個美麗的宇宙、成熟的顏色、不一樣的地方...或許還有其它意義…\n\
  \n……………………………………………………………………\n\n看片當中，對於劇中人對話有關宇宙天文、太空船和地球時間的差異、黑洞……等議題，\n完全狀況外，無法充份理解……\n\
  只能把全片當成太空船内的五個成員，在太空船内的一天時間，就是地球的一年時間，但\n探險過程中，遇到了意想不到的狀況，原本預定回地球是地球時間的一百年後，結果變成\n\
  ？萬年後……\n\n地球的家，太遠了……\n因此要尋覓另一個可居住的星球……雖然回地球已經遥遥無期，但其實太空船内時間只有\n幾週的時間...\n\n以下有劇透，請慎入！\n\
  ………………………………………………………………………………………………………\n………………………………………………………………………………………………………\n\
  ……\n\n一心想了解上帝存在否、黑洞……，因多年前在地球發生意外，而身心受創，略有厭世傾\n向的天體物理學家Sam, 選擇了身心隨同黑洞而蒸發一瞬間……\n\
  其他四人，修理太空船之達人Niels、女科學家Ariane, 基因學專家Lucie, 船長兼心理學\n家Harry落\n腳在適合他們居住的星球之原始年代，地球是此星球之遥遠一顆星，其實他們才在一起二\n\
  個月時間，地球已經過N萬年，他們在海邊吃著，喝著此星球的好喝的水，舉杯遥敬地球\n、宇宙、他們自己及消逝的Sam！\nThe End.\n\n轉貼imdb的觀眾的好評之評論如下……\n\
  \nfrom:\n\n\n26 November 2015 | florimonrousseau\n\n 8\n\n | So fresh !\n\nI saw\
  \ it a couple weeks ago in Paris, and it was very cool. Far away from supe\nr heroes\
  \ and their ego crisis, we have a real science-fiction movie, with beau\ntiful space\
  \ vistas. Anyone who appreciates those gorgeous NASA images will be\nfond of the\
  \ visual effects work. Characters are quite funny too, and just... r\neal. I love\
  \ Niels, pilot of the ship and the hero of the movie. He has charism\na, humor and\
  \ just acts like we'd all do in the same situation. His friendship\nwith Sam, the\
  \ astrophysicist with a twist, is brilliant. It just works, charac\nters are well\
  \ defined and it's unexpectedly easy to identify with their incred\nible situation.\
  \ We don't see that often. Scratch that, I can't remember when I\n felt that. Two\
  \ thumbs up.\n\n自行中文翻譯如下:\n\n2015.11.26\n8/10分\n如此新鮮。\n幾週前在巴黎看此片。這片很酷。完全不同於超能英雄及他們自我危機的影片，我們有真\n\
  實的科幻小說電影，有著美麗的太空壯觀景色。任何欣賞極美的NASA影像的人將喜歡這片\n的視效成果。劇中角色也相當有趣，就是真實。我愛Niels，太空船飛行員之一，本片主\n\
  角。他有魅力、幽默，以及就如同我們遇到此狀況會做出同樣的事。他和天體物理學家Sa\nm(有轉折橋段)的友誼很棒。角色設定佳、想不到如此容易鑑別出他們所處之不可思議的\n\
  狀況，這些都處理地好。我們不常看到這。忘了吧，我不記得了當時感受到的了。太棒了\n(二大姆指比讚)。\n\n………………………………………………………………………\n\
  \n中華電信MOD電影199\n星際黑洞 the big everything\nNicolas Bazz director\nJauris Casanova\
  \ : Niels\nHelene Seuzaret : Ariane\nBenjamin Boyer : Sam\nLaure Gouget : Lucie\n\
  Pierre-Alain de Garrigues : Harry\n\n\n\n\n\n\n\n\n\n\n--\n\n謝謝樓上留言指教，已經修改。\nThank\
  \ you.\n\n\n就我觀點而言，滿意度100分滿分的話，星際效應90分，\n這片65分，因為成本低很多，角色演員很少，且故事較不如星際效應那樣動人，雖然有其\n\
  要表達之主題的特色。"
