url: https://www.ptt.cc/bbs/movie/M.1700210943.A.47B.html
title: '[微好無雷] 魏德聖新作《BIG》'
content: '從美麗佳人抓的海報


  魏德聖的新片

  原本是要看《五月的你十二月的她》結果睡過頭

  想說改去看《車頂上的玄天上帝》結果停車場爆滿

  最後一個鬼轉跑去看了《BIG》口碑場

  這是一部結合動畫的真人電影，算是滿罕見的片型吧



  =====以下心得=====


  導演魏德聖表示：「因為現實世界的病童無法自由地活動，但在動畫的世界他們擁有無限的

  可能性，所以這次決定使用動畫的形式，將七位病童化身小勇士奮力對抗惡魔軍團。」


  這是報導提到的，不是我爆雷的

  其實這部也沒什麼雷可以爆，畢竟是溫馨感人的電影，不是什麼劇情大作之類的


  會特別提到這個，就是因為插入了動畫的創造想像世界，讓電影整體變得太過漫長，節奏有

  點過慢

  當然在溫馨類的電影上節奏慢並不是一件壞事，但是導演需要掌控好整體的舒適度，也就是

  不要讓觀眾覺得有些片段太過多餘，可能變得想打瞌睡，或是覺得太破碎


  劇情方面

  整體而言沒什麼太大的問題，主要問題都在上面說了

  這次挑的題材是癌童，而且一次跨足整間六人房的病房，除了主要都圍繞在六位癌童本身外

  ，還有一些家長的故事，不過沒有造成失焦，這點對於故事的發展很有幫助，至少在這部分

  沒有冗餘的問題

  有些地方有點牽強就是了，不過電影就算了


  角色方面

  童星的表現都很不錯，當然大人的部分也是，可惜動畫裡的角色塑造有一點點問題，個性那

  些的，完全沒有真人的部分那麼鮮明，失去個人特色的角色，讓人難以代入真人到動畫的角

  色之中

  不過還有一個問題，就是童星唸台詞的時候，沒有辦法像是大人那樣順過好幾次，有些死板

  的感覺，但小孩子演戲就是這樣，或是我已經離開小孩子的年紀太久了

  至少結尾可以聽到他們是有在順台詞的，不像有些導演，非得要演員完全照著台本唸一樣



  =====大概就是這樣=====



  結局算是滿意外的

  整個故事也是有著驚奇也有著無趣

  嘛，至少算是合格作品吧


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --



  我補上好了'
