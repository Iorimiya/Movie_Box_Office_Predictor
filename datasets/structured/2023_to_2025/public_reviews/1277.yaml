url: https://www.ptt.cc/bbs/movie/M.1415781992.A.1BA.html
title: '[好雷] big hero 6 大英雄軍團 '
content: '無雷心得


  雖然離台灣上映還有點久

  還是先來幫大家評價一下



  剛剛去看完了big hero 6

  趁我還沒忘記趕快po一下心得



  -今天是國定假日+禮拜二半價 晚上10點的場還是滿場


  -片頭附贈的動畫很溫馨可愛


  -應有盡有 有笑有淚有武打有英雄 大概就是沒愛情而已


  -Baymax超萌!!!!!


  -背景畫的超美 融合舊金山+日本的文化


  -很溫馨 蠻多人哭的 但全場笑聲不斷 結束還有人自發性拍手


  其實我覺得後半段有點展開XD

  可能是因為我本身對英雄片沒興趣的關係

  然後片尾是有彩蛋的請大家要留下來

  我就是那個沒看到的可憐人Q_Q



  如果跟前陣子很紅的Frozen做比較的話

  我個人其實還是比較愛frozen (本身就不愛marvel系XD)

  但是意義上很像bh6更豐富一點

  配樂的話也是f>>>>b



  給剛好到英語系國家想先看的人:

  我個人是 星際效應聽得懂 40% Maze runner 75% Frozen 95%up

  這齣大概是和Frozen差不多


  如果是和我差不多的人 看這齣是OK的XD

  上個禮拜看星際真的是腦袋一片空白


  基本上這齣還蠻值得進電影院看的 推!!!


  --'
