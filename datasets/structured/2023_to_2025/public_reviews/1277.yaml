url: https://www.ptt.cc/bbs/movie/M.1423322743.A.FF9.html
title: '[好雷]大英雄天團 Big Hero Six  '
content: '部落格圖文版:





  片頭的迪士尼小短片《Feast》滿有趣


  整片聚焦在狗狗Winston身上，


  從只在乎自己能否吃到速食(Junk food)


  到幫男女主人重新牽起線


  短短幾分鐘，讓我們瞭解寵物給我們的影響力多大



  從沒看過Marvel出過動畫片


  這次由迪士尼來操刀，主要目的自然是拉向闔家觀賞


  內容有小朋友喜歡的英雄對抗惡棍


  也有吸引成年人「這是改編英雄漫畫喔」的噱頭




  然而，我看到的是，東西合璧在動畫上的呈現



  單從海報就可窺知，雖然背景看似在舊金山


  這時你會問: 咦?看似?這是名符其實的舊金山呀


  你看看那置身雲端的亮麗金門大橋


  你看看那歪來歪去的九曲花街


  還有電車


  你跟我說這「看似」舊金山是什麼意思?




  仔細看看四周吧，有沒有看到那整排精美的紅色燈籠?


  有沒有看到招財貓、還有日文看板?


  再來，片中主角阿廣的哥哥濱田正，葬禮時還幫他上香


  不是只幫他取個日文名字就算了呢！




  在我看來，本片做得最好的地方就是東西融合


  日本的風格搭配上舊金山而成的 「San Fransokyo」


  東京與舊金山，原來可以融合得這麼美麗



  片中也迎合了一般觀眾對於科學家的定義:Nerd


  主角哥哥的實驗室就直接叫:Nerd''s lab



  主角是個很聰明的人，沒進大學就是發明王


  只是都用在違法的機器格鬥上


  哥哥為了改變他，而假裝不經意地帶他來到他的Nerd''s lab


  讓他知道，世界之大



  不過這很快就被主角推翻了


  為了申請入學，被教授看好


  主角看似才苦惱了些，僅僅聽著哥哥建議「換個角度看」


  就發明了能隨著自己意識操控型態的微型機器人


  這.....真讓人看了好氣又嫉妒啊~~




  在面具人出場時，我一直在猜是否是主角的哥哥


  其實並未在爆炸中身亡，而是被邪惡機構救活


  操控成邪惡大壞蛋


  結果.......請自行去看啦！



  記得養成Marvel的片要看完字幕喔


  你會發現Stanley老頭又出現啦~~


  --'
