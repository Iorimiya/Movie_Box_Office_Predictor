title: '[新聞] 魏德聖新片BIG，田中千繪范逸臣演戲不需'
content: '新聞網址：


  魏德聖新片BIG 田中千繪范逸臣演戲不需培養默契


  2023/10/28 18:21（10/28 18:41 更新）


  （中央社記者王心妤台北28日電）導演魏德聖的新片BIG贊助公司沛爾生醫今天舉辦包場

  。女主角田中千繪映後表示，跟范逸臣飾演夫妻不需要額外培養默契。導演魏德聖對於資

  產遭查封案則希望改日再提。


  BIG導演魏德聖、演員范逸臣、田中千繪、童星郭大睿今天出席包場活動。


  田中千繪映後受訪表示，很早就聽過魏德聖分享BIG的故事大綱，片中要跟范逸臣飾演夫

  妻，兩人事前不需要練習，該有的情緒都很到位，是種很特別的氛圍，「因為是跟小范（

  范逸臣），所以反而很自然。」田中千繪也說，片中要離婚的情節比較難詮釋，因為兩人

  私下感情好，是種難想像又說不上來的情緒。


  沛爾生醫董事長林成龍表示，有感於這部電影傳達的精神，也佩服魏德聖對台灣的熱愛，

  希望藉此鼓勵台灣優秀藝術家繼續創作。


  另外，中影、鑫鴻國際投資董事長郭台強曾出資替魏德聖拍攝「賽德克．巴萊」，他指控

  魏德聖欠款新台幣4500萬元未還，持本票向北院聲請強制執行獲准。魏德聖否認雙方有債

  務關係，二度抗告均被駁回，北院今年7月發出查封命令。


  對於和郭台強之間的糾紛，魏德聖表示，今天是個開心的日子，希望先不談這件事。（編

  輯：李亨山）1121028



  --'
