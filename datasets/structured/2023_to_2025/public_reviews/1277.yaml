title: '[選片] 下一球勝利還是BIG?'
content: '拿破崙跟飢餓遊戲兩部已經完食


  兩部都覺得還好XDD


  近期還有上檔的還有下一球勝利跟BIG


  預告看完都滿感興趣(片名都很迷就是)


  下一球勝利導演比較有印象是兔嘲男孩


  演員有很久沒看到的法鯊Michael Fassbender (我 超 愛 他)


  終於不開賽車回來演戲了嗎？


  這部整體好像都是好雷，大多說看完療癒、好笑還很感人


  另一部是BIG，魏導的新片，好像是抗癌兒童相關題材


  看來也是走溫馨路線，不過看了一下演員 范逸臣、田中千繪


  有一種在賣海角七號情懷的感覺＠＠？


  兩部求大家推薦了



  --'
