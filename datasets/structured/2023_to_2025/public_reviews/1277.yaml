title: '[好雷] BIG (2023年臺灣電影)'
content: '雷文防雷資訊頁


  《BIG》是一部2023年上映的臺灣兒童電影，由魏德聖執導

  該電影於2023年12月1日在臺灣上映。


  上映日期 2023年12月1日（臺灣）

  發行商 希望影視行銷有限公司

  預算 新台幣1億元

  票房 新台幣5634萬元


  以下有雷，尚未觀賞的，慎入




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  趁還有記憶趕快來寫感想


  本片以抗癌兒童為主題，

  描述集結來自不同社會階層、

  不同面向的6組家庭，

  彼此從衝突到最後相互支持的故事。

  片長達2小時38分，膀胱要加油一下


  台灣大概會有450～500位/每年新發生的兒童癌症病人

  其中以兒童白血病佔30～40％是最常見的兒童癌症。

  白血病是因為血液裡的白血球惡性增生所導致，也就是我們俗稱的「血癌」。


  本片用動畫及實拍穿插，一開始不太適應

  但後來想想，確實也符合病童的想像

  816病房的六組病童及家庭在電影的刻畫下

  雖有意表達出社經地位、家庭組成、面對病情的態度不同

  但是畢竟是電影，定位也是闔家觀賞的層級

  並看不出真實面對病況的如經濟、照護困境

  為了滿足觀賞動物園紅毛猩猩生產

  帶著病童到壽山動物園觀賞的橋段

  有讓我暫時登出的感覺

  （38歲的紅毛猩猩咪咪也於日前壽終正寢，R.I.P.)

  登出點：

  病童是血癌不是安寧療護餒，

  尤其其中一個動物園阿姨沒帶口罩給我去摸源源（鄭又菲 飾）的背

  會不會是後來她過世的原因之一呀


  片中成人演員對台灣群眾都滿熟悉的

  所扮演的角色也恰如其分，片尾王醫師的扮演者也是彩蛋


  兒童演員除了珈農（于卉喬 飾）、源源外也都是小童星

  演的很好，值得鼓勵


  演員有名的情況下，拍片成本無怪乎也高

  要回收成本基本上不太可能


  整體而言是部不錯的生命教育的片子，

  有傳遞出 HOPE IS BIG

  珍惜生命，好好活著，畢竟有人想活而不可得

  適合學校、社團觀賞

  但是可能要先了解台灣兒童癌症的概況

  或事後分享，本片對死亡的失落感或家屬悲傷五階段並沒有著墨太深

  可能也是為了顧及觀眾群


  隔壁媽媽哭慘了，

  但是小孩好像看不懂一直再問為什麼要開刀

  是延（謝以樂 飾）去哪裡了




  -----

  Sent from MeowPtt on my iPhone



  --'
