url: https://www.ptt.cc/bbs/movie/M.1701416737.A.1F4.html
title: '[好雷] BIG哭一場'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這段無雷：


  電影不只是獻給患者，也是獻給家屬


  大家「熱烈」（？）討論的動畫


  其實細細咀嚼後可以感受到想要傳達、鼓勵的訊息


  雖然說電影因為導演最近的新聞，可能會有諸多爭議與疑慮


  但是讓我們法院歸法院、電影歸電影


  裡面不管是多位小童星、或是大人們，都有刻劃到位的演出


  小朋友們或許有些台詞略顯生硬，但是並不影響閱聽人（至少是我）的代入感


  ～～～～～～～～～～～～～～～～～～


  以下部分有雷：


  題材、音樂、幾組家庭的塑造，整體來說我願意給這部電影好雷


  不過還是說一下自己印象比較深刻，然後也有小小槽點的段落


  影片中後段，大家去到動物園看紅毛猩猩生小孩

  （也是吐槽的地方，可以這樣說溜就溜的嗎XD）


  在一群不知道有沒有明天的孩子面前，看到新生命的誕生


  會有一種被激發到要努力活下去的POWER


  這種一生一死（快死）的反差，也呼應電影副標「活著最大」


  然後在節奏上，雖然是部長片沒錯，但整體的鋪陳並不會讓我覺得過於冗長


  其中小朋友們在進手術室前與爸媽的對話


  都滿讓人揪心的，不知道究竟導演會「賜死」哪一組


  如果最近壓力很大想要接受刺激哭一哭，我覺得很適合來看


  如果家裡有病人，相信也更能共情


  拋開那些爭議等等的，就單純來欣賞一部電影這樣


  強烈建議攜帶足夠的面紙、衛生紙，我看的時候有大量吸鼻子的聲音


  判斷是衛生紙用完了


  --

  我只是分享心得，導演我也是有嘴一下R


  純推好看，其他的不予置評


  以前心得應該好好寫，現在可能會寫的好一點XD'
