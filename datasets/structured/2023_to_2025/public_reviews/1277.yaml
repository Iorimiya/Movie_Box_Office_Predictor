url: https://www.ptt.cc/bbs/movie/M.1700580203.A.F5D.html
title: '[新聞] 魏德聖力作816《BIG》汎武力挺包場公益'
content: '魏德聖力作816《BIG》汎武力挺包場公益贊助


  經濟日報 黃逢森


  以熱心公益聞名的高雄在地企業-汎武電機工業，近日再度展現對社會的關懷，特別贊助

  了魏德聖導演最新力作《BIG》的公益電影欣賞活動。這部影片被譽為導演至暖心的作品

  ，於11月17日在岡山秀泰影城舉行的包場活動中搶先首映，魏德聖導演和團隊當天也現身

  與影迷互動。


  名導演魏德聖根據兒童癌症病房816號的動人故事，所拍攝的台灣首部結合動畫之醫療主

  題電影《BIG》，於12月1日隆重上映。電影展現生命的力量，傳達每個人都是勇者的信息

  ，號召大家一起追逐心中的夢想。在最小的病童身上看到他們在水深火熱、生死患難中，

  仍保有一顆勇敢、喜樂、感恩的心，宛如一道生命的曙光照耀著一旁的家人和幫助者，就

  算身體未癒，但內心可以「選擇」不被病魔綑綁，得著真正的自由。


  長期關心社會公益的汎武特別包場力挺，並邀請家扶小朋友和家長共同來欣賞這部充滿愛

  心和正能量的電影，共同感受《BIG》所帶來的溫暖和啟發。汎武長期支持家扶和社福機

  構-聖淵啟仁中心，尤其致力於腦麻兒童的療育和照護，展現對公益的不懈奉獻。此次活

  動是汎武對國產電影的支持，對導演拍攝理念的認同，能在兒童成長過程中為他們提供助

  力，成為生命的勇士，繼續前行，汎武與有榮焉；也是汎武長期推動提升社會正面向上力

  量的一個具體實踐。




  --'
