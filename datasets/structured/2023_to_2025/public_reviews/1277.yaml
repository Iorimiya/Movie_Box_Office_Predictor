url: https://www.ptt.cc/bbs/movie/M.1708949426.A.C57.html
title: '[新聞] 魏德聖認遭惡評攻擊 《BIG》苦撐創包廳歷史紀錄'
content: "魏德聖認遭惡評攻擊 《BIG》苦撐創包廳歷史紀錄\n\n13:25 2024/02/26 中時 李承陽\n\n\n魏德聖跑包場不遺餘力，與包場的觀眾們分享創作理念。（米倉影業提供）\n\
  \n由魏德聖編導，演員曾沛慈、馬志翔、范逸臣、田中千繪、夏宇童、周厚安、黃鐙輝等21\n位演員主演的電影《BIG》，票房26日正式突破4千萬，所累計的包廳已經超過千場，突破\n\
  包廳歷史紀錄，從未有過1部電影作品的觀眾年齡可以擴及2歲到80歲。\n\n魏德聖坦言剛開始推廣這部電影時並沒有像計劃中的順利，觀眾對於兒童、癌症議題難免\n有沈重的第一印象，還有幾篇強勢惡意的評論攻擊，又逢年底新片連連，上映廳數和場次\n\
  不斷壓縮，不過他非常感激每1位觀眾在看完電影之後，願意主動在網路社群上分享心得\n文，透過自身的影響力挺身而出宣傳電影、號召包場。\n\n魏德聖表示：「電影不應該只是傳遞1個故事或美學，他還可以有更多深厚的影響力。」\n\
  透過電影的創作，將劇本文字化作影像，再結合魏德聖一貫擅長的幽默形式為劇情畫龍點\n睛，讓每1位觀眾在觀賞的過程，同時得到歡樂與感動。\n\n魏德聖上周收到通知即將獲頒第11屆楊士琪紀念獎，主委胡幼鳳及副主委林文淇公開評審\n\
  團提名的理由是魏德聖一直努力開拓新疆界，創造台灣電影的諸多可能，且具有夢幻騎士\n的強大企圖心，以大膽的衝勁和不算計未來的魄力，來實踐電影夢想，值得敬佩。魏德聖\n\
  也在獲獎後也開心表示自己很久沒有得獎了，坦言：「雖然一直受到惡意的評論攻擊，在\n業界備感孤軍奮戰的情況下，仍覺得拍攝《BIG》是一件非常有意義的事，在這個時刻獲\n\
  獎感到非常溫暖。」\n\n#魏德聖 #電影 #BIG #曾沛慈 #馬志翔\n\n--\n佛法\n 是菩薩成佛之道\n        是 佛經\n  是 佛  \
  \      是 菩薩\n\n\n\n--"
