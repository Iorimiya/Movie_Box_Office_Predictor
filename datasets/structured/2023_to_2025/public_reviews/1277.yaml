title: '[好雷] 孤味 Little Big Woman'
content: '在上映一週後，終於蹭完《孤味》，早上 10:25 的台南新光第五廳，本來以為我

  可以一個人包場，沒想到觀影人數比預期還多。


  身為台南人，對於片中入鏡的安平港、漁會市場、四草大橋、鹽水溪出海口南

  側堤防、府城食府、台南車站、321巷藝術聚落（原日本步兵第二聯隊官舍）、

  蕭氏節孝坊、鹿耳門天后宮、台南殯儀館（景行廳 ）等景點可以說是如數家珍

  （新樓麻豆、U.I.J Hostel 沒去過）。不過我很好奇陳伯昌暫厝的靈堂是在

  哪裡拍的，板上有神人願意解惑嗎？


  靈堂上的幾場戲，從免跪、母舅被二姐 diss、佛道儀式 battle、頭七蟑螂被踩死

  、摺紙蓮花/元寶、討論離婚協議書、解釋風箏跟陳昇，我在忍不住噴笑的同

  時，內心其實是百感交集的。


  陳淑芳、謝盈萱、徐若瑄、孫可芳、陳妍霏、張鈞甯，加上丁寧 、Aiko 與好友

  ，以及于子育，不禁讓我想起王穎在電影《喜福會》中也曾啟用過大批亞裔女性

  演員，雖然兩部電影的時空背景大不相同，演出卻都同樣精彩，無懈可擊。如

  果金馬獎有最佳群體演出這個獎項，

  我想今年的《孤味》跟《同學麥娜絲》彼

  此會是勁敵。


  「見山是山，見山不是山，見山還是山」，阿嬤念念叨叨的歡喜冤家，在告別式

  當天終將化為灰燼，摘下九重葛，放下九重葛，隨後雙鯉探頭，就讓思念化作千

  風，永駐心頭！


  --





  謝謝樓上解惑'
