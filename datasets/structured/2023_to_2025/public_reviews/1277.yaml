title: '[討論] 【影評】《BIG》：魏德聖找來足以打造'
content: '【影評】《BIG》：魏德聖找來足以打造台灣三部曲的團隊，卻拍出一部流水帳電影

  撰文：今敏木木


  魏德聖電影新作《BIG》描述六位癌末病童在 816 病房共同對抗病魔，見證聖誕節奇蹟的

  故事，邀請了六位童星主演，並找來曾沛慈、范逸臣、田中千繪、夏宇童、黃鐙輝等演員

  加盟演出孩童的爸媽，幕後團隊則邀來



  儘管邀來頂尖的幕後團隊，，電影也沒有完整地述說六位癌末

  病童與他們家人的故事。但六位童星真摯自然的表演，加上煽情的配樂與劇情，仍讓觀眾

  無法抵擋眼淚從眼眶中流出。



  六組癌末家庭的故事，終究塞不下一部電影


  《BIG》編寫了六組不同家庭狀況的癌末家庭，有剛離婚的、新婚夫婦、單親媽媽、面臨

  夫妻失和、以及兩足受傷需坐輪椅的不同樣貌；每位病童年紀與個性也不同，包含了開朗

  樂觀、成熟穩重、害羞冷淡以及對生命失望想死的孩子。


  光是要在開頭吸收所有角色性格與背景，對觀眾來說就是一道難題。所幸《BIG》編導找

  來了 21 位樣貌、風格大相逕庭的演員，以可愛逗趣的群戲賦予每個角色鮮明的性格。


  然而隨著故事持續推展，電影就逐漸失控，為了細講每個家庭遇到的難題，以及不要讓電

  影太過悲傷，《BIG》在個人戲與群戲中徘徊，的病童身亡戲後，《BIG》才終於回頭聚焦在這

  些病童身上。卻也消磨了觀眾的耐心。


  筆

  者不禁想像如果《BIG》是一部電視劇，就可以有更多時長鋪陳每位家庭的狀況，甚至將

  不想活的病童心境刻畫地完整，而不是像《BIG》這樣徒留概念，卻沒有深刻的轉變。


  《BIG》最大的亮點之一，是魏德聖邀請了新海誠御用美術導演——丹治匠帶領的日義動

  畫團隊，共同打造對抗病魔的幻想畫面。



  更大的突兀感也在於，從真人接到動畫的剪輯沒有什麼太大關連，沒有邏輯地亂塞，直到

  關鍵的病童身亡戲後，才看到動畫真的發揮它的效果，透過幻想畫面述說孩童面臨生死離

  別的挫敗與感傷。第三點，動畫採用古羅馬作為角色造型設計，跟本片真人實拍的劇本與

  美術風格有點不搭。


  當然，幻想畫面可以採用任何風格設計，但如果《BIG》前段鋪陳了孩童都喜歡某個古羅

  馬時代繪本的情節，會讓古羅馬的造型設計更有說服力。



  儘管筆者對於動畫是否有助於敘事感到不解，但《BIG》動畫製作非常不錯，角色設計非

  常符合六位主演，強大的分鏡魄力掩蓋了動作的流暢度與細緻度，魏德聖或許證明了自己

  已建立了足以製作台灣三部曲的動畫團隊。希望他能順利解決近期的官司，推出他籌備已

  久，格局龐大、富有意義且敘事與故事皆精采的作品。







  備註：

  網上搜到的兩個影評都是負評，

  板上卻一致好評...






  另一篇



  【影評】《BIG》：魏德聖的新作就像是廉價電視劇——技術粗糙呆板、劇本也非常破




  --'
