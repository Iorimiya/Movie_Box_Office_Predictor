title: '[好雷]孤味 Little Big Women'
content: "當聽到陳淑芳阿姨所飾演的林秀英，\n在計程車上唱著孤味，眼淚瞬間掉了下來，可惜的是電影描寫可以更故事性，更細膩描述\n這一個家的概念，雖然有點遺憾，但是這是一部拍得\n\
  很好的國片，值得你我都進戲院支持。\n\n~~~~~~~~~~~~~ 雷文 主文分隔線~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\
  \   以下包含自己的主觀心得與劇透，在意的人趕快往左!!\n\n   曾經聽過有人對我說「女人是油麻菜籽命，落到哪裡就長到哪裡。」就從林秀英這角\n色充分展現女人的堅毅，七十歲的那天在自己打拼的餐廳辦起壽宴，自己一手打拼的路邊\n\
  攤到有個餐廳，從無到有，卻傳來十幾年未見面的丈夫在醫院病逝的消息，對她來說似乎\n早已與這人無關，內心卻還是認為己是陳家女主人，自己永遠扮演著強勢的角色，分配著\n\
  自己對家人的愛，因為「這是為你好」的觀念強壓在每個家人身上，包含著濃濃的愛，丈\n夫這角色對她來說只是個不負責任，這天的喪禮跟夫婿十多年的女朋友蔡小姐請來的誦經\n\
  團，似乎讓這女主人的角色動搖，讓他也請來道教的師公來尬場，這是一種佔有的愛，如\n果要拚場我這女主人怎麼會輸外來的小三呢??\n\n\n\n   當女兒們都用自己的方式來表達對這「家」的愛，大女兒可能是最知道爸媽們的事情\n\
  ，選擇不跟自己姊妹說真相，到台北新生活給自己喘口氣，菸抽的不是菸，是寂寞的。因\n為知道爸媽的婚姻，所以當他面臨到自己婚姻問題與身體異狀時，想必痛苦參雜。二女兒\n\
  從小就課業優異，讓自己跟父親得到連結，她要的爸爸肯定隨著時間逐漸落空。他的優異\n表現讓林秀英可拿來當驕傲的事情，與娘家做連結。同樣的想法也這樣對她的女兒，期待\n\
  她女兒去美國。三女兒是受爸媽最保護的一位，因為還小所以什麼都沒被告知，記憶中的\n那俄羅斯軟糖是她跟爸爸的連結，知道爸爸有個叫蔡小姐的女朋友，這是一個讓她爸爸有\n\
  依靠的女人，對她來說也是跟林秀英所扮演角色一樣的重要。\n\n\n\n   林秀英對於婚姻的忠貞與堅持，是台灣傳統女性的奧妙與美，由一個家裡開診所的原\n生家庭，嫁到一個浪子般的老公，是多麼需要調適的，自己\n\
  卻永遠像山一般愛著她的老公，向自己娘家冒名借錢，揹著娘家的不諒解，無法送自己老\n爸最後一程的苦痛，年輕抓姦企圖挽回婚姻，她都忍過來了，\n蔡小姐對她而言早已放下，放不下的是那張離婚證書，傳統祖宗觀念自己若不是陳家人，\n\
  自己又誰呢??尋覓一個答案「我要見蔡小姐」。導演安排\n在台南媽祖廟很有意思，雖然台灣傳統辦喪事期間是不會去廟的，但是同為女人的神媽祖\n讓蔡小姐跟林秀英見面，蔡小姐言談中過去往事不斷被挑起，\n\
  真相的曝光讓他選擇放手。夫婿最愛去拜的月老，月老安排誰，並非執著著感情強求可得\n。林秀英在先生出殯當天簽下離婚證書，燒給她的先生。也似\n乎跟先生與歷代祖宗說我再也不欠陳家人。\n\
  \n\n    最後一幕，唱著歌的林秀英，搭著計程車沒有出席喪禮，選擇通知蔡小姐陪著她愛的\n男人，送她最後一程。女人的愛蔓延著電影院，包容著過去種\n種，那句「人真的很奇怪，明明知道是有害的，還是繼續去作。」，其實是因為「愛」。\n\
  \n\n最後徐若瑄唱得別人的歌詞，道盡這一切\n車直直開 未來置叨位\n我不願 你看見阮的面\n你講人攏會分開 早晚的代誌\n惦惦流目屎的阮 不甘你\n\n\n\
  \     值得思考的好戲!!  值得進場支持這部國片~~\n\n--"
