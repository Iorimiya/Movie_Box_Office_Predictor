url: https://www.ptt.cc/bbs/movie/M.1709180661.A.A23.html
title: 'Re: [討論] 魏德聖的BIG票房 三千八百萬'
content: '昨天也去看了這部，還想說為何名字是BIG，原來是這意思啊，這部還配合著動畫與現實

  一起進行感覺是蠻特別的方式，讓幼孩也能看得懂，直接跟小孩解釋與病毒的對抗。


  整部還帶著一些搞笑的片段，不至於讓人覺得沈悶，但還是有幾幕催淚的若是認真看還是

  會不自覺的代入流淚，尤其自家小孩也曾經四處求醫的經歷，結果好在只是先天近視～咁

  ！白擔心了


  尤其粉絲頁還有不少刪減片段，我自己是覺得這部

  拍的不錯，所以上網看似乎還有三部曲在籌劃？

  看介紹似乎是用動畫描繪台灣歷史的，我是還蠻期待的


  --

  我是覺得它BIG人物動畫還蠻可愛的耶XDD只是那獸人感覺很熟悉的樣子

  大燒錢

  這就不是小孩可以看的了!!

  魏導個人我是不在意，我喜歡的是這部戲內容，尤其是源源生病依舊在練舞，而且她表現

  在劇中都是開朗有活力的模樣以及後來珈農說的那句「笨蛋我想要活著啊」，我都跟我大

  女兒說妳看人家生病了也是很努力的活著，妳身體這樣健康還有什麼做不到（她對自己很

  沒信心）'
