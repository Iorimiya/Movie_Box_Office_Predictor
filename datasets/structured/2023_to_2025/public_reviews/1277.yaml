title: '[無雷] 鯨奇之旅 Big Miracle'
content: "1988 年，原本要洄游至南加州海域的三隻灰鯨被困在阿拉斯加巴羅鎮附近的海冰\n下。由於天氣逐漸嚴寒，海面冰封範圍擴大，無計可施的灰鯨家族只得靠人類伸出\n\
  援手，這條不起眼的地方新聞，透過駐地記者報導，一躍成為全國頭條，引發各界\n關注。\n\n在綠色和平組織、白宮、國民防衛隊、石油公司、當地居民和蘇聯破冰船合作\n\
  下，成年灰鯨終於突破萬難重回海洋的懷抱，可惜的是幼鯨卻因體力不支，撒手\n人寰。\n\n除了茱兒芭莉摩飾演的綠色和平組織工作人員，和接獲戈巴契夫通知前來援助的蘇\n\
  聯破冰船外，大家在看到這篇報導後的第一個反應多半是事不關己。\n\n阿拉斯加州長甚至當面表示拯救行動並非有燃眉之急，接下來，每個人都在盤算如\n何從這次的救援行動獲得最大的好處：白宮想替接下來的選戰營造正面形象、石油\n\
  公司大亨藉此降低民眾反感、芭比記者打算利用這次機會當作跳板、因紐特人則顧\n慮殺戮招致的後果，他們真的打自心底憐惜灰鯨的性命？嗯嗯！我可不以為然～\n\n當鯨魚救援行動變成全國頭條，電視台轉來轉去，怎麼播都還是這則新聞，連課堂\n\
  上的文章分享也都以此為題，小鎮居民也藉此大發鯨魚財。難怪女記者會說「此時\n全世界大概有三十場戰爭，電視台卻只播這條新聞！」\n\n這種新聞媒體蹭時事熱度的現象是不是頗有既視感？\n\
  \n附註\n\n本片全景都在美國阿拉斯加州的巴羅、安哥拉治與史華德市拍攝，其中 Barrow \n現已更名為 Utqiavik（因紐皮雅特語），是美國最北的小鎮。\n\
  \n\n\n--"
