url: https://www.ptt.cc/bbs/movie/M.1711532291.A.4CF.html
title: '[討論]對〈BIG〉的影評是惡意攻擊?'
content: '#關於BIG影評被認為是惡意帶風向一事說明


  大家好，我是佑德，今天從 許榮哲先生那邊得知，魏德聖導演與很多人認為我的影評是

  惡意影評，並讓他內心受傷。還有一說法是我跟關鍵評論網集團聯手炒作一事，在此跟魏

  德聖導演與其他受傷的人對話。（沒想到我有一天能跟入選奧斯卡短名單的國際名導演對

  話），也沒想到長片剛開拍就遇到這件事情，現在才有空說明。


  首先我想說我個人非常喜歡《七月天》跟魏德聖導演策劃兼任副導的《雙瞳》，以及對台

  灣產業具有意義的《賽德克巴萊》以及監製的《KANO》。而我必須承認因為我認為魏德聖

  是國際名導，因此我能夠嚴格標準看待。我是真的喜歡過魏德聖的作品過，對他是高度期

  待，也是高度標準。如果是爛導演跟爛電影我一句話都不太想說。其實我有另外一篇文章

  也被鄉民公審，那篇其實是明貶暗褒，有些人認為我不該為魏德聖說話。我也希望客觀理

  性地說出產業問題，我認為有些事情不可行。


  殊不知我言詞太過苛刻而讓魏德聖導演跟很多人受傷，這點我向魏導跟很多人說聲抱歉。

  就以魏德聖的才華《BIG》應該能呈現的更好，但這點是我個人看法，所以我認為跟魏德

  聖自己比，我會期待他更多。因為這是魏德聖導演的心血，身為製作我完全能理解，拍片

  都是辛苦的。


  而我並非全然地批評且有意圖號召大家不要看，比如我認為在演員表現如曾沛慈其實值得

  金馬入圍、賴銘偉的演出也非常具有記憶點，在選角上也表現得很好，演員表現跟兒童演

  員調整得非常好，這點魏導還是厲害。我個人不太接受的是攝影跟結尾的轉折，但這是我

  認人看法。


  而如果我一個人能夠讓一部電影慘賠或穩賺，那真的太看得起我，那台灣片商應該找我業

  配（不過我評論不業配），或給我封口費。這篇影評已經收到太多人罵我，如許榮哲先生

  口中的「王九蛋」云云（但後來是善意訊息我，後續也道歉）。而作為業內人士且希望影

  視產業茁壯，近期《BIG》又要上映之時，我已無意再爭論技術端的問題，評論已經出去

  ，而我認為這是我個人的言論自由。作為媒體人，我個人捍衛言論及新聞自由，我不希望

  有過多臆測。


  以及這篇刊出後不管業內業外都有人勸我不要再發負評了，一直以來我喜歡的電影沒有少

  幫，後來我不喜歡的電影我也謹慎措辭了，如果我個人影響力有大到如此，讓大家不想去

  看甚至可以影響票房，我真的很意外。我當然理解片商跟製作方的壓力，因此好話一定說

  在前，壞話我上映後再說，這篇上映後四天後才刊出。然後批評大導演的作品私以為是.

  .....我在台灣罵國際導演的概念（？），我也罵過《嬰兒轉運站》 就會有種也還好，有

  給空間。那讓自己在業內的空間更壓縮，這件事情還真白痴就是了。當然我希望業內還是

  能保持「針貶」的空間。


  此文在關鍵評論網出刊，我的編輯非常信任我的文章，他沒有為我下任何指導棋，也沒有

  任何人雇用我惡意攻擊魏德聖導演。從頭到尾就是，我買了電影票去看電影，然後寫了評

  論，關鍵給我稿費。至於標題跟前面的說明，那是編輯檯的自由，而關鍵評論網是付費才

  能觀看全文，因此如何導流是他們編輯以及新聞自由。至於為何SEO這麼前面（簡單說是

  google排名） ，只能說Google認定他是有效文章，而關鍵評論網的後台工程非常給力，

  他是純自然排名，所以買也買不到（是可以下特別推薦啦，但也會揭露）。我也不知道一

  查他就在前面啊，帶來大家這麼多困擾！其實以搜尋「BIG 評價」其實好評負評都有。既

  然包場這麼多且口碑如新聞稿說的一樣熱烈，那麼就讓好事發生。


