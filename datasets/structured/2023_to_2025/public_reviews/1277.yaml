url: https://www.ptt.cc/bbs/movie/M.1699951136.A.9B3.html
title: '[新聞] 魏德聖新片《BIG》傳遞親情 新竹包場感'
content: '魏德聖新片《BIG》傳遞親情 新竹包場感動企業

  更新時間：2023-11-14 08:04:23



  【新唐人亞太台 2023 年 11 月 14 日訊】由。這部以溫馨的家庭題材，結合動畫的醫療主題電影，在新竹舉辦電

  影包場首映會，導演魏德聖親自出席和觀眾合影留念。


  首度結合動畫醫療主題電影《BIG》，病童挑戰病魔的動畫，刻劃出816癌症病房裡，病童

  和死神搏鬥的驚險，但是他們卻用相互擁抱、關懷，傳遞溫暖和歡笑，告訴自己好好活著

  就是BIG。


  導演 魏德聖：「希望透過對由孩子來拯救世界，讓孩子來拯救世界，讓孩子來安撫更多

  更多，讓那些最小最弱，並且病得最嚴重的這些最弱小的，讓他們來拯救這個世界，所以

  我們希望這個電影可以扮演這個力量，讓這個世界可以往更正面的方向前進這樣子。」


  描述6個來自不同社會階層的家庭，因故搬到同一間兒童癌症病房，彼此從陌生到相互扶

  持的暖心故事，感動科技公司董事長再次包場。


  ，所以當然我也很願意說，

  可以跟他共同來，我們小小的力量，來在新竹幫他再辦一場新竹的首映會。」


  新竹包場首映會後，魏德聖導演與觀眾合影留念，他說，好久以前就希望以兒童癌症病房

  為背景，來寫一部關於親情的電影。這幾年疫情、戰爭、政治等等因素，很多負面能量衝

  擊，終於他付諸實現，希望《BIG》這部新片，能為觀眾注入正向能量。


  健康診所院長夫人 呂太太：「散播這個善念的這個動機上面，我覺得魏導真的拍得太傳

  神了。」


  健康診所院長 呂紹達：「他可以把這病人整個，病人家屬的那種感覺，弄得讓我們自己

  都覺得很感動，真的很感動，非常棒。」


  觀眾 葉先生：「透過電影這種素材，這種故事，來觸動我們的內心，其實我覺得是一個

  ，一件很棒的事情。」


  《BIG》電影包場，在全台已超過300場。新竹包場與眾不同的，是和新興的無色情、無暴

  力、無毒害的網路平台--乾淨世界做連結，期許一起用善念點亮台灣。


  新唐人亞太電視 佘志誠 林秋霞 台灣新竹採訪報導







  心得：

  支持看電影愛台灣


  --'
