title: '[情報] 空之境界劇場版第一章 俯瞰風景 上映戲院'
content: '來了




  TYPE-MOON       經典神作


  《」》


  11月21日(五) 全台大銀幕首度上映




  獨家電影套票 內含電影票


  及特殊工藝雷射炫光海報！


  限量熱售中




  連接生與死、現實與虛無的邊界，


  一場凝視靈魂的飛行。




  TYPE-MOON 經典作品改編，


  展開「」劇場七部曲序章


  「」打造極致視覺美學，


  融合寫實與詩意的壓倒性映像


  《》動畫導演 青木英 執導


  《魔法少女小圓》、《》神級大師操刀配樂


  日本知名音樂團體 Kalafina 演唱片尾主題神曲「oblivious」


  集結 坂本真綾ｘ鈴村健一ｘ本田貴子ｘ藤村步ｘ田中理惠 等豪華聲優陣容


  直死之魔眼ｘ墜落事件 ——


  少女凝視死亡的都市懸案


  探問生命、孤獨與存在的本質，構築動畫史上最獨特世界觀


  經典首度登台大銀幕，體驗死亡與存在交錯的深層震撼！


  連續多名少女從廢棄大樓頂樓墜落身亡，遺體遍布曾為城市地標的巫條大樓。


  傳言中，屋頂上浮現著名為「霧繪」的神祕少女身影。


  當墜樓事件達到第五起，擁有「直死之魔眼」的兩儀式，終於踏入謎團的核心──


  看見萬物死之輪廓的她，將直面一場生命與意識交錯的深層真相。


  --'
