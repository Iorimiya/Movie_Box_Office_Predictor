url: https://www.ptt.cc/bbs/movie/M.1721766771.A.CDC.html
title: '[新聞] 螢火蟲電影院下鄉 27日嘉義鹿草放映《老'
content: '新聞網址：

  螢火蟲電影院下鄉 27日嘉義鹿草放映《老狐狸》


  中華民國國防部青年日報社 記者黃朝琴／臺北報導


  　國立臺南生活美學館「2024螢火蟲電影院」將於27日晚上7時，在嘉義鹿草聖家醫院播

  映優質國片《老狐狸》，同時安排映後座談，邀請國立中正大學傳播學系管中祥教授擔綱

  主持人，與民眾雙向互動，活動免費，歡迎闔家欣賞，用行動支持國片。


  　文化部表示，「2024電影藝術分享計畫-螢火蟲電影院」為文化部影視及流行音樂產業

  局年度計畫，透過該計畫將優質國片推廣至南部各地區，挑選適合社區文化氛圍及議題的

  影片，提供當地民眾美學的感動，除培養國片觀影人口，讓民眾有機會接觸電影美學。


  　《老狐狸》這部電影由蕭雅全導演，並在第60屆金馬獎中獲得了最佳導演、男配角、原

  創電影音樂及造型設計獎，不僅在臺灣獲得讚譽，國際也獲得認可，並在東京影展進行世

  界首映。


  　《老狐狸》的故事背景設定在1989年，講述一對處於社會弱勢的父子如何面對一位狡猾

  的商場鉅亨，電影中的角色和情節反映了當時臺灣社會的現實，觀眾可以從中感受到那個

  時代的氛圍與挑戰。



  --




  --'
