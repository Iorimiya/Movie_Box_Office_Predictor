url: https://www.ptt.cc/bbs/movie/M.1756244885.A.5E7.html
title: '[新聞] 岡恩證實《藍甲蟲》角色順利融入DCU 有'
content: '岡恩證實《藍甲蟲》角色順利融入DCU、有望加入「這個團隊」　僅需小幅調整設定即可

  銜接


  Min-El


  DC 工作室（DC Studios）聯合執行長暨《超人》（Superman）導演（James

  Gunn）近日在受訪時，明確指出由（Xolo Mariduena）飾演的海梅 雷耶斯

  ／藍甲蟲，將以「」的方式加入新DCU 宇宙，並與《》（Peacemaker）

  一樣，幾乎不需大幅修改即可延續出場。




  岡恩接受《爛番茄》（Rotten Tomatoes）訪問時解釋，《》原本就存在於一個

  「」，雖與 DCEU 有所連結，卻缺乏整體規劃，因此劇情能夠相對獨立發展。


  他坦言雖然該劇結尾非常大膽，但確實不完全符合 DCU 的走向。


  不過，這反而讓角色得以更輕鬆地過渡。


  「《》幾乎不用改什麼就能順利融入，同樣的，《》也能自然契合，只是

  我們可能需要小幅度的設定調整。」岡恩說。




  儘管《》在全球票房表現未能突破紀錄，但其實用特效、家庭互動和充滿幽默感的

  風格，仍獲不少觀眾讚譽，被視為舊時代 DC 作品中表現最佳的電影之一。


  許多影迷對藍甲蟲角色的延續深表期待，認為這將有助於 DCU 的多樣化發展。


  值得一提的是，《》的角色定位與岡恩致力打造的宇宙藍圖也高度契合。


  岡恩的 DCU 在基調上，與漫畫《國際正義聯盟》（Justice League International）時

  期有諸多相似之處，而二代藍甲蟲「（Ted Kord）」，正是該團隊的核心人

  物。


  這意味著海梅 雷耶斯的加入，或將替團隊鋪設出更多延展性的故事線。




  另一方面，本人也曾暗示，《》續集或已在規劃之中。


  確定的是，他將於一部尚未命名的動畫影集中，以配音形式再次詮釋這位年輕超級英雄。


  雖然具體細節仍待官方揭曉，但藍甲蟲的「」顯然已成定局。


  對影迷而言，這不僅是角色的延續，也象徵著新 DC 宇宙將以更穩健的方式吸納前作精華

  ，朝著完整連貫的藍圖邁進。


  新聞網址：




  --'
