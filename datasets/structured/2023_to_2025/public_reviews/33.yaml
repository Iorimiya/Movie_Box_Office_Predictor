url: https://www.ptt.cc/bbs/movie/M.1454990787.A.172.html
title: '[討論] 最近看了螢火蟲之墓 看到一肚子火'
content: "最近看了這部動畫片 看到一肚子氣\n是看電影版的 整部最錯的就是媽媽死太早\n沒教好他兩兄妹 妹妹年紀小不懂事就算了\n那死中二主角 去人家裡寄住\
  \ 還不幫忙做事\n整天跟妹妹玩 遊手好閒 都有力氣去埋東西地方搬一堆東西\n\n跟我說沒勞動力? 阿姨也是嘴巴壞了一點 但是看起來心地不壞\n你自己想想 有親戚來你家寄住\
  \ 整天不工作 在那玩耍\n你會不會不爽去念他 一定會的阿 在說那是戰爭時代\n生活物資更是缺乏 妹妹年紀小不工作是可原諒\n阿姨也沒叫他妹去工作 就你這死中二\
  \ 阿姨點你幾句\n就在那不爽? 他自己家裡的女兒也才高中吧 都會出去工作了\n他女兒跟老公工作忙就算了 阿姨整天在家看這兩兄妹在那玩\n念幾句是正常的吧?\n\
  \n\n 拿主角媽衣服去換米 本就是應該的\n他也趁妹妹睡著才去拿 誰知道節子忽然醒了才在那鬧\n不給吃白飯給兩兄妹吃鹹稀飯至少基本營養有 阿姨也有分一半米給兩兄妹\n\
  他們兄妹後面還自己買沙鍋煮飯 然後吃完都不洗碗?\n還耍中二帶妹妹搬出去間接害妹妹營養不良被活活餓死?\n他們要搬出去時阿姨還很驚訝 還問說你們找到地方住了?\n\
  作者要表達戰爭的悲哀 但也不要這種表達法吧\n\n\n搞得最後主角兄妹是自己找死 不是因為戰爭的殘酷不得已才死\n整部片最可惡的是把妹妹畫的那麼可愛 死小蘿莉是讓我最憤怒的\n\
  那中二主角死了我還會笑勒 可憐的妹妹 不懂事活活餓死 餓死是很痛苦的.\n\n\n--"
