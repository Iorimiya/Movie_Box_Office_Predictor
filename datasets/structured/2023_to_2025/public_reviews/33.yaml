url: https://www.ptt.cc/bbs/movie/M.1659332564.A.672.html
title: '[新聞] 《洛基》將發展外傳電影 史特龍痛批'
content: '新聞網址：


  《洛基》系列將發展外傳電影《Drago》，席維斯史特龍痛批：從來不希望這些角色被寄

  生蟲剝削




  席維斯史特龍最近披露，他對《洛基》系列外傳《Drago》相關消息相當不滿。席維斯史

  特龍主演並編劇了 1976 年上映的首部《洛基》電影，並且成為了當年度票房成長速度最

  快的作品，同時還拿下了奧斯卡最佳影片，之後更發展出一個龐大的系列。


  除了《洛基》系列之外，史特龍也於 2015 年推出的續篇《金牌拳手》中再次回歸，最終

  也讓他入圍了一項奧斯卡最佳男配角獎。


  然而，史特龍並不會在即將推出的《金牌拳手 3》中回歸飾演這位義大利種馬。就在最近

  ，，這也是導致他決定

  退出這個由他創立的經典系列的一大主因。


  在那之後，相關消息指出了米高梅正在計畫一部以《洛基 4》反派角色伊凡德拉戈和兒子

  維克特德拉戈為主角的外傳電影，後者已經在《金牌拳手：父仇》中首度登場，而伊萬也

  在那部電影中再次回歸。




  雖然許多喜愛《洛基》的粉絲們都對於這項消息感到興奮，但史特龍本人顯然不是其中之

  一，並在個人 Instagram 上公開批評了這部外傳電影，甚至還直接向製片艾文溫克勒以

  及他的兩個兒子大衛和查理溫克勒開嗆，他們兄弟兩人也都擔任了《金牌拳手》系列的監

  製。


  此外，雖然他強調自己仍尊重即將回歸演出伊凡的杜夫朗格，但依然批評了這位演員沒有

  事前告知他相關的計畫細節。


  史特龍寫下：


  「另一個讓人傷心的消息，我剛剛再次得知了


  。我必須向粉絲們致歉，



  順帶一提，我一直都很尊重杜夫朗格，但他從來都沒告知我那些人背著我把我為他創作的

  角色拿去做什麼事了！真朋友可說是比黃金還貴重啊。」




  當多部來自 1970 至 1980 年代的電影系列都因為旗下角色的版權而展開一場又一場的法

  律衝突時，史特龍也開始批評艾文溫克勒對於《洛基》系列的掌控。其他像是《13 號星

  期五》系列的版權據傳已經回到了原創編劇維克特米勒的手中，然而，在 1987 年一同創

  作《終極戰士》電影的編劇搭檔據傳也曾一度試圖與迪士尼對簿公堂，而當雙方達成了共

  識後，這個系列也藉著將於 8 月 5 日推出的最新前傳《終極戰士：獸獵者》繼續發展下

  去。




  另一方面，溫克勒一家決定要繼續拓展《洛基》系列的決定也有著一個相當微妙的時機。

  《洛基》系列片商米高梅最近受到了亞馬遜公司的收購，而《洛基》當然也成為了一個讓

  他們希望能夠繼續發展下去的重要 IP。這個系列本身也已經藉由《金牌拳手》證明了持

  續拓展的潛力，同時也能在不只仰賴一位演員的情況下帶來多樣化的發展。


  此外，他們最近也宣布了《金牌拳手 3》將會延期至 2023 年 3 月的消息，也就是漫威

  電影《蟻人與黃蜂女：量子狂熱》上映的一個月後。至於《Drago》目前還要等待多久的

  時間才會進入拍攝階段，以及史特龍的批評是否將會對其造成影響，目前都依然是個未知

  數。




  --'
