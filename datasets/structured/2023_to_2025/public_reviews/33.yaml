url: https://www.ptt.cc/bbs/movie/M.1572941734.A.48B.html
title: '[新聞]一天一餐 原騰暴瘦7公斤模擬毒蟲入圍金馬 '
content: '新聞網址：


  大馬男星原騰入行一年半，在《樂園》首度接演劇情長片，靠著飾演染上毒癮的勒戒少年

  鼠仔，以張狂外放、不可一世、沒有明天但卻渴求一線生機的驚人演技，獲得本屆金馬獎

  最佳新人獎提名肯定。其實他為了角色，以熬夜、一天只吃一餐等的激烈方式在短時間暴

  瘦7公斤，吃足苦頭。


  原騰在《樂園》演出既要面對女朋友跟兄弟的背叛，還要力抗毒癮發作的悲劇人物，眼神

  時而凶狠、時而脆弱，情緒轉換流暢自然。他說：「我的世界都倒了，毒癮還發作，我想

  忍住，但最後還是哭了出來。」他在這場戲拍完後他依舊止不住淚水，那時他才知道一個

  角色對演員真實情緒的影響。


  此次入圍金馬獎最佳新人，原騰除了對評審的肯定表示感謝外，他也坦言為進入角色付出

  相當大的心力，除了在開拍前就進到農場與更生人共同生活，更是以熬夜、一天只吃一餐

  等的激烈方式在短時間暴瘦7公斤，他說：「我本身個性比較愛玩鬧，所以我必須要用這

  些方式讓自己處於暴躁且恍神的狀態，我甚至要家人暫時不要聯絡我，讓我可以更貼近角

  色的孤僻特質。」


  下戲之後，為維持電影中獨行俠個性，原騰更盡量不與劇組演員互動，他笑說：「看其他

  演員打鬧心中還是很羨慕，但我不敢跟他們有太多互動，怕會破壞角色情緒。還好這齣戲

  沒拍太久，不然真的很痛苦。」


  《樂園》將於11月8日在台上映。




  原文網址: 熬夜、一天只吃一餐！原騰暴瘦7公斤「模擬毒蟲恍神」入圍金馬獎 |

  ETtoday星光雲 | ETtoday新聞雲


  Follow us: @ETtodaynet on Twitter | ETtoday on Facebook


  --'
