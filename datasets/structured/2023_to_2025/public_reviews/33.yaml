url: https://www.ptt.cc/bbs/movie/M.1658047954.A.439.html
title: 'Re: [好雷] 螢火蟲之墓 軍國主義下的悲劇'
content: '小時候看這部電影覺得很可憐


  鼻涕 眼淚一把接著一把


  哭到泣不成聲




  結果長大才知道日本是侵略別人國家的人



  日本犯下的戰爭罪行多到數不清





  台灣剛好當時被日本殖民


  免於受到戰爭的摧殘



  其他國家絕對比你看到的螢火蟲之墓裡面的劇情還要淒慘十幾倍以上



  仇恨可以化解 台日可以友好



  但二戰下中華民國的罹難者及士兵我們永遠不能忘記



  他們永遠是保衛國家的英雄






  --'
