title: '[  雷] 藍甲蟲'
content: '1.

  首先我真的覺得不差

  中規中矩的

  個人覺得比黑亞當討喜一點

  當然後面還是會吐槽一下電影的部分


  至少看完後

  對於花的票錢沒有覺得很幹

  畢竟對DC電影也是有點PTSD了

  雖然我還是衝了首日

  不是我M

  我只是剛好今天有空而已

  但閃電俠我連預告都沒看就去看了

  好吧我真的有點M


  2.

  蘇珊莎蘭登真是這種角色的專業戶

  她近10幾年常客串演這種角色

  大概也是因為她氣場很夠吧

  無論是當正反派


  3.

  我覺得對這部片的拉丁家庭有愛

  很多片段就可以帶著愛的濾鏡看


  但相反的如果你覺得這一家人很吵

  那可能你觀影感受也會蠻差的

  畢竟他們戲份很多


  4.

  許多人說劇情老套

  其實是因為大家看得電影夠多了

  英雄的旅程套路就那樣嘛


  只是同樣的菜怎麼炒

  怎麼呈現還是有差


  我覺得主角遇到的第一個危機時

  那段呈現的有點混亂

  不夠有那個悲傷的張力


  主角被抓後遇到的生死困境那邊的呈現

  也是力道很不夠

  前面感受不到那種瀕臨生死的緊張感

  後面得到情感召喚感動度就也還好


  今年剛好也有部電影可以拿來類比

  就是星際異攻隊3


  但藍甲蟲的這個片段呈現該怎麼說呢

  很微妙

  不知道為何會是這樣呈現還有那樣的背景畫面

  是因為不懂拉丁文化的差異嗎?

  總之這段有種看賽德克巴萊最後戰士們過彩虹橋的尷尬感


  還有最後的覺醒

  也不夠熱血


  4.

  反派的公司前面被營造的很強勢的樣子


  但這間公司的保安真的爛


  關係整間公司軍火發展最重要的聖甲蟲放置的地方

  一點守衛都沒有


  女主角不知道哪裡學來的偷證件技巧

  總之就是輕鬆偷到證件

  輕輕鬆鬆就走進放聖甲蟲的地方把東西幹走了


  然後東西拿走也沒有任何警報器會響

  好像走進里長服務處幹走一支原子筆一樣


  之後劇情為了想幫助男主角脫離聖甲蟲

  女主角說她想到有個東西可能可以幫忙

  但是東西放在集團裡


  對話還帶到女主角說

  上次她偷走聖甲蟲現在那邊守備一定更嚴了


  確實如她所說的守備更嚴了


  大概就是從里長服務處升級成戶政事務所的等級


  你們知道這兩個的差別嗎？


  就是戶政事務所門口多了志工會問你要幹嘛的差別


  沒錯！守備更森嚴的集團

  要進去也是沒啥困難

  雖然是需要出動一些道具幫忙


  但是U KNOW 觀眾經歷各種商業電影的洗禮後

  這種等級的侵入

  大家一定會覺得這間集團真的很好闖入

  只差沒人在門口說歡迎光臨而已


  然後男主角剛好開車遇到女主角被守衛追殺

  也是3-4個守衛開個幾槍意思意思有追殺一下

  就進入下一個劇情了


  這樣的優點是劇情推進快、節奏快

  缺點就是營造不出那個危機感

  和那種這個集團的影響力對當地人來說很絕望的感覺


  當然可以想像可能是拍片時預算不高

  省掉這些場面了

  預算可能都拿來做特效和付蘇珊莎蘭登的片酬了吧


  5.

  然後轉移聖甲蟲的程式碼出來感覺這麼浩大的工程

  從頭到尾只有那個肥宅工程師一個人在做

  轉移過程男主角的身體出狀況

  竟然還要被老闆叫去carry

  難怪這角色最後做一個莫名其妙的反轉

  就是薪水太低要做的事太多了


  6.

  電影看完後老實說

  我還是不了解聖甲蟲是怎樣的一個東西

  只知道他是從外星來的


  然後他會選宿主

  但是男主角有何特質被選上我也不是很明白


  我真的沒睡著啊


  --

  身為英雄起源電影

  大家看的電影都夠多

  知道套路是什麼


  勢必有挫折、有抗拒、有成長


  想的到的都有

  只是怎麼去說、怎麼去呈現的差別


  我覺得他就是規規矩矩把故事順順講完

  沒啥特別突出的點

  有些缺點

  但也沒爛到會覺得三小啊的程度

  反正那些缺點在很多商業片也常見



  我覺得故事有可以著墨的點

  但可惜沒去好好講這部分


  例如聖甲蟲到底是怎樣的存在

  為何挑這個主角成為宿主


  一開始是聖甲蟲的操控意識大於主角

  之後聖甲蟲也接受了主角「不殺人」的想法


  我會覺得這是一個可以著墨的點

  在最後讓觀眾明白

  主角有哪個特質可以被選上

  並且讓聖甲蟲願意接受他的想法

  主角也找到使命


  兩邊正式可以共存

  然後整體有所提升成長

  最後翻轉戰局

  好好鋪陳就可以是後面讓觀眾對劇情的一個燃點

  可惜這部分我自己看完是一頭霧水


  主角有不殺人的理念

  然後來自一個充滿愛且知足的家庭

  這是劇情有提到的點

  但卻沒去擴大這個點

  去說服觀眾

  他是那個獨一無二被聖甲蟲選上的宿主




  ＢＴＷ可以講一個缺點就是主角有時一些對白

  很很讓人不耐煩


  例如和女主角從集團偷東西要出來

  遇到反派手下

  男主角的台詞竟然是對女主角說

  ＂他怎麼會在這裡？＂


  或是他被抓的時候

  和別人講＂放開我＂＂幫我鬆綁拜託＂

  工程肥宅和他說＂I am sorry＂

  他回"What do you mean you are sorry"

  這類沒意義的對白真的可以不要講

  拜託'
