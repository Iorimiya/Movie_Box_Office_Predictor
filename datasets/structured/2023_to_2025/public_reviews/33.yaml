title: '[新聞] 「螢火蟲電影院」牡丹、恆春、小琉球 接力放送'
content: "「螢火蟲電影院」牡丹、恆春、小琉球 接力放送\n\n2021/9/2 16:46（9/2 18:21 更新）\n\n\n由文化部與國立台南生活美學館共同舉辦的「電影藝術分享計畫-螢火蟲電影院」，10日\n\
  、11日將在屏東牡丹鄉高士部落和恆春農會放映金馬最佳影片。（三餘書店提供）中央社\n記者郭芷瑄傳真 110年9月2日\n\n（中央社記者郭芷瑄屏東縣2日電）由文化部與國立台南生活美學館共同舉辦的「電影藝\n\
  術分享計畫-螢火蟲電影院」，搶搭公視戲劇「斯卡羅」風潮，10日、11日在屏東牡丹鄉\n高士部落和恆春農會放映金馬最佳影片。\n\n放映的2部金馬影片為「消失的情人節」與「野雀之詩」，10月2日將跨海至小琉球，配合\n\
  當地王船祭的前期準備時間，放映「消失的情人節」，讓民眾觀賞精彩的海洋文化故事。\n\n主辦單位表示，「螢火蟲電影院」為文化部年度性計畫，每年透過下鄉舉辦免費電影欣賞\n\
  活動，將優質國片分享給在地民眾，今年「屏東場」選錄「野雀之詩」、「消失的情人節\n」，在牡丹高士社區集會所、恆春鎮農會及小琉球咾咕嶼協會放映。\n\n小琉球場次特別邀請獨立書店「小島停琉」店主陳芃諭，進行映後座談，與民眾分享電影\n\
  故事、好書閱讀推薦。\n\n「屏東場」3場活動，每場將贈送民眾「三餘書店」的社區選書，每場送出5本精選好書，\n完整活動資訊及報名方式，請至「螢火蟲電影院」臉書粉絲團查詢\n\
  \ 。（編輯：黃世雅）1100902\n\n\n--"
