title: 'Re: [討論] 今天是螢火蟲之墓清太在車站掛的日子'
content: '我覺得我們要考慮到厄本效應


  早年大家在談到《搶救雷恩大兵》裡的厄本時

  大多會罵他是大孬種


  但近年網路上的風向就轉變了

  大家開始正視到，自己面對同樣情況下，很有可能也會是厄本

  (人人都想當片中的超帥狙擊手，但其實大家87%會是厄本啊XD)



  同樣的，大家都有可能像《螢火蟲之墓》中的阿姨跟哥哥那樣


  話是這樣說

  但我儘量設身處地的幫片中哥哥想之後

  還是覺得，我應該很難像他那麼雷


  片中他的各項操作真的奇葩到一個難以想像的地步了，簡直極品XD



  阿姨就比較寫實一點了

  我覺得我如果是那阿姨

  應該也不會對清太有什麼好臉色





  至於片中有什麼影射?


  我覺得清太就是日軍

  妹妹就是日本人民


  日軍口口聲聲說是為人民好

  說什麼老美如果登陸一定會虐殺平民之類

  打死不投降，還要人民玉碎

  其實就是為了面子不肯妥協，而一直拖人民受苦



  現實中美國丟了兩顆原子彈

  剛好給了日本軍方一個很好的台階下


  但清太沒遇到這種契機(或是錯過了)

  於是妹妹餓死



  以上是我的版本的藍色窗簾





  另外，我對於中文WIKI上一段高畑勳的話不太認同



  但我這樣說也很奇怪

  彷彿是在玩"高畑勳懂個屁螢火蟲之墓"的MEME XD



  總之我覺得他的這種說法跟片中要呈現給我們的

  實在有點對不上

  但會不會是WIKI翻譯問題?

  還是因為是擷錄，前後文被喀掉，所以無法得知完整想法脈絡，

  就像我這篇文如果只截第一段，就好是像要替清太護航


  是高畑勳口是心非嗎?

  還是功力不夠，執行起來力不從心?


  我現在還是想不透

  不知道大家怎麼看XD




  講了那麼多，我的結論還是



  欸這哥哥真的超雷





  --'
