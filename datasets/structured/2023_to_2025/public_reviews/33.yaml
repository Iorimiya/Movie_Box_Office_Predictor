title: '[負無雷] 《藍甲蟲》有續集的話，麻煩劇本給岡'
content: '聽說是DCU第一個超級英雄

  拜託

  這種劇本根本端不上桌吧

  而且還埋有伏筆？？？

  麻煩有續集的話

  還是原編劇的話

  劇本先給岡恩過一眼

  感謝


  特效差

  節奏差

  劇情差

  唯一好看的居然是後面家人胡鬧的戲碼？


  這部劇情衝太快了

  根本沒有什麼鋪墊

  我可以接受你拉長一點來加以鋪設感情戲

  但是你聚焦太多在主角和藍甲蟲的對話上

  又把打鬥場面讓卡基達一直插嘴

  這 根 本 不 重 要 啊

  你又不是鋼鐵人

  需要一直跟AI溝通

  打架就好好打不行嗎？

  硬要尬聊


  剪輯也很神

  我簡直就像在看驚奇隊長2一樣

  多元選角

  飛天遁地

  家庭故事

  無法控制


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
