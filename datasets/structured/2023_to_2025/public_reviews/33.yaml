url: https://www.ptt.cc/bbs/movie/M.1463599841.A.5FB.html
title: '[討論] 螢火蟲之墓 動畫心得'
content: '手賤點來看，剛開演三分鐘就爆淚啊...

  分享一些心得




  ［亮點：兄妹情］


  很喜歡愛護妹妹的哥哥

  這樣的哥哥哪裡才有賣呢！！


  雖然是個寧可偷東西被痛毆也不領錢買食物的豬隊友（你妹快餓死了啊！忘了自己有錢逆

  ！），還是不能抹滅他身為妹控的事實！




  ［亮點：阿姨］


  淑惠阿姨．．．不對，清太的阿姨

  強調


  給沒拿錢回家的跟吃鹹稀飯，

  給有賺錢的跟吃白米飯

  (綠色是稀飯組，藍色是米飯組)


  由於的緣故未特別愛護清太跟節子，清太也無意繼續攻略阿姨．．．不，是無

  意繼續住在阿姨家


  選擇節子線，獲得Bad Ending，能被親愛的妹妹感謝(告白)，ＢＥ也甘願！




  ［其他：防空洞］


  搬出去後住在洞裡的清太

  在空襲開始人人避難的時候反而跑出防空洞，到空屋裡行竊


  支撐他鋌而走險的動力便是，如果從軍便無法看到妹妹了，這等妹控！



  結局時以悲傷的形式和妹妹永遠在一起，這下連死亡也不能將他們分開了




  觀看時心情一直很沈重


  這對年齡加起來不到20歲的兄妹確實不夠成熟懂事，若沒有戰爭，他們會有機會成長，可

  惜再也不可能了


  一開始會哭鬧著要找媽媽的節子，知道事實後變得安靜許多，卻讓人更加心疼她


  如果哥哥早知道離開阿姨家會招致死亡，他必不會選擇這條路


  人生就是賭一個未知的希望，失敗就是死

  可惜Game over之後不能重來


  可恨的戰爭，自私又虛榮的人類為何總是不知足呢？最可惡的就是發動戰爭的人了，為了

  私欲強迫他人喪命，泯滅人性


  希望大家都能永遠保持和平理性，勿噓，勿戰，讓ptt成為和樂的淨土...離題了


  真心希望以後不要再有戰爭...




  --




  發動戰爭的不只日本，只是剛好作者是日本人

  其他國家的人民也是苦


  的確~~


  對哦！節子那麼小怎麼工作啦！


  小時候被這幕嚇到...


  我大概十年沒看了XD


  不是我要悲，這部真的讓人笑不出來



  眼淚不需賣弄，生活自然會強x到你哭出來



  不把立場抽離很難看下去XD

  電影跟小說不一樣情節嗎？


  嗚嗚'
