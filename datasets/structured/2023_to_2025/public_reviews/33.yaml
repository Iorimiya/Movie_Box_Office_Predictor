url: https://www.ptt.cc/bbs/movie/M.1740723556.A.753.html
title: '[新聞] 蟲族再度來襲 索尼影業正在籌拍科幻經典'
content: '蟲族再度來襲！索尼影業正在籌拍科幻經典《星艦戰將》系列全新「重啟版」電影






  荷蘭名導-保羅范赫文（Paul Verhoeven）多年前闖蕩好萊塢時，締造了《機器戰警》（

  RoboCop）、《攔截記憶碼》（Total Recall）和《星艦戰將》（Starship Troopers）等

  不少科幻經典，改編自小說的《星艦戰將》則是其中衍生出最多續集、動畫、電玩和外傳

  作品的一部，直到 2017 年都還有新作推出。不過現在，光拍續集已經不夠看了，好萊塢

  似乎還打算從頭來過，吸引新客群。






  外媒《Screen Geek》，索尼影業正在策劃重啟《星艦戰將》，並寄望新版電影能取得比

  原版電影更巨大的票房成功。這不是《星艦戰將》首次傳出重啟計劃，早在 2010 年，就

  有消息指稱，索尼想要製作更貼近原著的版本，2021 年時，該系列的主角-卡斯柏范戴恩

  （Casper Van Dien）更透露，索尼電視部門有想製播新的影集版，但這計劃卻因為碰上

  新冠疫情攪局而中止了。此次索尼又想回頭催生新版電影，究竟能否順利推行，還得再多

  觀望。






  這部真的經典


  --'
