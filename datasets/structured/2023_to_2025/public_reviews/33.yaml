url: https://www.ptt.cc/bbs/movie/M.1583166689.A.D37.html
title: '[討論] 從Judy到Joker到寄生蟲的悲哀共性'
content: '從今年最大贏家的「寄生上流」、「小丑」到略顯暗淡的「茱蒂Judy」，我發現他們間有

  著難以言喻的共通點：


  先從Judy，總的來說，這部片很普通，唯一能讓影片有可看性的，就是女主角的演繹。


  觀影前我沒有做太多功課，只知這是今年奧斯卡女主角得主影片，已及簡單的google女主

  角身世。


  Judy因藥物、睡眠、酗酒、情緒問題、人格問題...導致她在社會與人際上的武裝、孤獨

  感、受虐感、脫序行為...等等，一切的表現，令我窒息。


  芮妮齊薇格很了不起，她讓我完全產生了帶入感，同理Judy的所有痛苦（除了母親這部分

  ），看到一半我完全知道結局為何，也看不下去了。


  比起她在頒獎殿堂隔壁的Joker，Judy顯得更無力、悲傷、黑暗、窒息；也因為她更真實

  ，更常見，所以更恐怖。


  Joker的病狀和痛苦很不一般，很難產生帶入感；然身處社會底層、既得利益者的敵人們

  ，以及我們說的「魯蛇」（我本人），是完全可以突破道德束縛，擁戴這樣的反社會天王

  ，為人出一口惡氣！


  最佳男女主角給我們直接的精神病態式的刺激，控訴社會結構是如何是如何「生產」和「

  欺壓」這樣的精神患者，令觀眾游移在道德灰色區塊中激烈交辯。


  寄生上流則是用「自嘲」的方式，笑淚交織兩場戰鬥：窮富鬥爭和兩窮相殘，顯示出在資

  源分配不公的社會中，底層小人物們為了生存不顧一切也要活下去、拼上去的變態精神。



  我不是專業影評人，更不是奧斯卡專家，我身為一個卑微的社會底層魯蛇觀察家，看今年

  大贏家：「小丑」、「茱蒂」到「寄生上流」的共通點，就是「結構吃人」，




  --

  光一個Judy就讓我憂鬱好幾天，我蠻慶幸Joker對我而言比較難帶入。思覺失調是很恐怖

  的精神疾病啊啊啊...怕

  所以才更顯悲哀啊......

  用創傷童年換來的舞台光芒，我相信她一點也不想要。'
