title: '[討論] 螢火蟲之墓的一個疑問'
content: '坦白說這部真的是神作


  我看完後沒有哭


  但是喝了好幾杯酒


  其實如果把一開始清太在火車站過世


  清潔人員把糖罐子踢到草地上


  之後出現節子的靈魂這段放在最後會更好


  不過有一個疑問


  清太和節子本身跟爸爸媽媽關係不錯


  當他們的父母往生後也十分傷心難過


  但是最後當清太餓死之後


  為什麼只有妹妹陪在身邊


  爸爸媽媽卻不在一起呢


