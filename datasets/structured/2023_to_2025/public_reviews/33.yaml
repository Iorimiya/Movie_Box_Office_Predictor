title: 'Re: [討論] 岡恩表示藍甲蟲將是DCU首個登場角色'
content: '華納探索洽談岡恩接班 DC前

  哈媽打還在DC影業有發展一個專案

  當時就預期可能終結DCEU正義聯盟系列

  但還是想搞大堆頭

  影集“箭宇宙”的無限地球危機經驗

  複製發展成新電影宇宙


  沒多久岡恩就跟薩法蘭同任聯席總裁

  這專案雖然沒進度但也沒被推翻

  哈媽打其實也是續約總監到今年初

  所以不能確認這專案會不會終止


  閃電俠因為才將上映

  DC現在不想重蹈覆轍炸掉閃電俠電影

  現在並沒有說死以撒版閃電俠去留

  但基頓版蝙蝠俠DC也討論過拍攝專屬電影

  加上莎夏的“女超人”風評一樣也不差

  可能看閃電俠電影表現

  分化出“閃點世界”

  舊的DCEU的影集在HBO系統表現不錯

  自殺小隊衍生影集基本上還會繼續


  而新主打的強檔改成DCU世界


  獨立故事篇章的“異世界”

  也許也可能進入未推動的“閃點多元宇宙”

  當然完全獨立的Elseworld

  也許對電影發展更好

  不用顧慮非要搞大事件





  -----

  Sent from JPTT on my Xiaomi 21091116AG.


  --


  其實會談當天DC兩個聯席總裁都在

  不是只有岡恩也有薩法蘭

  華納探索總裁肯定也是對發展知情

  岡恩只是愛說話被針對'
