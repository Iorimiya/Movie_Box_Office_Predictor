title: '[新聞] 華納：颶風嚴重影響《藍甲蟲》北美票房'
content: '華納探索：颶風嚴重影響《藍甲蟲》北美票房收入


  原文標題：Warner Bros. Blames Hurricane Hilary for Blue Beetle’s Low Box Offi

  ce




  縮址：


  華納探索表示，84年來首次襲擊南加州的颶風希拉里（Hilary）嚴重影響了《藍甲蟲》在

  北美首週末的票房表現。


  華納探索告訴商展關係公司（Exhibitor Relations Co.），颶風對《藍甲蟲》的票房影

  響相當巨大，尤其是在南加州地區。


  在電影上映首週，洛杉磯市區以及與舊金山是《藍甲蟲》的前十大市場，但根據美國國家

  氣象局洛杉磯辦事處的資料，這地區遭受了暴雨、洪水、土石流等影響。


  最終《藍甲蟲》北美首週共獲得2500萬美元的票房。






  --'
