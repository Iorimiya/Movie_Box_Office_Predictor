url: https://www.ptt.cc/bbs/movie/M.1504613456.A.456.html
title: '[問片] 一部肚子寄生蟲的片'
content: '2年前問過一次但沒問到答案QQ

  這次大家都在問一些獵奇的片又勾起回憶XD



  應該是國小時候看過的片

  還記得是下午不小心轉到的 應該是cinemax

  劇情不記得了 只是剛好轉到

  只記得有寄生蟲好像會吃人的肚子 慢慢啃咬他的體肉

  被寄生的人只能越來越虛弱慢慢等死 蟲也會變大?

  人死之後 蟲好像會趁著人睡覺或不注意又寄生下一個人類

  那時候好像有一群人 帶得被寄生的同伴 要找方法除掉 卻慢慢一個一個掛掉

  好像無法用一般武器殺死? 人也會跟著掛掉之類

  最後面好像是用一種類似聲坡或超音波的武器讓蟲震爆

  因為是斷斷續續看的 只能依稀記得一些特徵或片段

  就只看過那一次 後來長大要再找找不到了

  真的有被嚇到整整2.3個月都在擔心被寄生蟲寄生不敢睡

  很怕睡著醒來中獎 (不是SOD)

  所以印象深刻


  希望有人能幫忙解答這部讓我惡夢連連的片

  感激不盡


  --'
