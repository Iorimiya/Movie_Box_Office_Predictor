  元！透過寄生蟲入侵人類腦部引發一批受害者跳河告別世間，造成蟲子水\n中繁衍提高風險，迫使就職製藥公司的影帝金明民為了救起家人積極求解\n藥的調查中，藉挖掘線索看出這回事件的異常。\n\
