url: https://www.ptt.cc/bbs/movie/M.1710203163.A.CB5.html
title: '[討論] 沙丘電影裡的沙蟲（當然有1+2的雷）'
content: '很小很小的時候有看過台視超級電影院之類的時段播過沙丘魔堡

  但那完全沒記憶了，只記得「有個沙漠行星，然後有很可怕、會吃人的沙蟲」


  電影1也是為了跟風看2才去netflix補完，要是沒同時上我應該也不會看2

  小說完全沒看


  好了，簡單的背景介紹完畢


  在看電影之前我一直以為沙蟲是像「從地心竄出」裡面的怪物一樣

  會隨時冒出來吃人，而且速度超快根本防不勝防，一有不注意就會被吞掉


  看完電影後卻覺得「沙蟲怎麼沒啥威脅性」

  佛瑞曼會沙步、哈肯能有飛行器，香料採掘車也有斥侯機、萬全的撤退計畫

  就算用沙槌call沙蟲過來，看到遠方揚起沙塵，甚至地上沙子開始波動再跑都來得及

  保羅和葛尼就是這樣躲過一次，哈肯能士兵更是沒有武德直接飛高高


  沒啥威脅性也就算了，還被佛瑞曼人拿來當作垃圾處理機、搬家工、Uber

  甚至幼崽還被養來溺死榨汁開天眼，最終大戰被引來當衝車撞翻帝國軍

  喔對，保羅更是拿他們當氣勢+100的背景板


  沙蟲：我是什麼很賤的人嗎


  想請問一下小說裡面的沙蟲也是這種可愛又迷人的反派生物嗎


  --'
