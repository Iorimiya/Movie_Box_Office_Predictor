url: https://www.ptt.cc/bbs/movie/M.1679690992.A.FF5.html
title: '[新聞] 《藍甲蟲》首支預告要來了！電影暫不屬'
content: "《藍甲蟲》首支預告要來了！電影暫不屬於任何宇宙\n\n今年的四部電影，《》與《》備受期待但因使得電影備受玩味，\n而《》內部試映糟糕惹得粉絲焦慮，現在唯獨一部《》遲遲沒有動靜，但\n\
  好消息是，今天最新消息表示，《》的首支預告將在下個月放出，而且電影的宣傳\n物料也被曝光！\n\n\n\n根據多家外媒爆料，新作《》電影的首支預告將在4月初放出，電影檔期在\n\
  ，提前4月放出預告確實也符合電影的一般營銷規律。\n\n\n\n並且今天電影的宣傳海報和其他物料也被爆出，可以看出渲染過後的藍甲蟲盔甲是真的挺\n帥的，雖然在片場照片曝光的時候，藍甲蟲的盔甲做工真的很還原。\n\
  \n\n\n但從新曝光的物料海報來看，後期明顯進行了縮小，看起來就協調許多了，沒有想到查克\n 史奈德之後看得最順眼的居然是藍甲蟲……\n\n\n\n而且據悉，《》不屬於DCEU或者DCU，目前只是掛著的世界觀，但後續是否進入\n\
  岡恩的DCU，還要看電影的票房和口碑了，只能說可以理解吧，始終也算是岡恩接受前的\n爛攤子之一，如果真的不行，換成誰也不想背鍋。\n\n新聞網址：\n\n\n\n\
