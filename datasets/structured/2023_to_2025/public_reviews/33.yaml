content: '呃...我其實忘記是電影還是影集XD



  記得有一個舅舅之類的男性尊親屬，


  開車帶著一個他懷疑有在吸毒的小男孩去毒窟，


  但小男孩其實沒有吸毒。


  舅舅把車停在路邊，


  拿錢叫住一個吸毒嚴重的女生，


  那個女生因為缺錢吸毒，明顯有在賣身，


  所以她以為舅舅要買春靠過來，


  但舅舅喝斥她露出牙齒給小男孩看，


  說這是吸毒的下場，


  後來女生就悻悻然的走了。




  因為這個橋段一直浮現在我腦海裡XD


  拜託大家告訴我了！


  --

  哈哈哈哈抱歉，原來真的不是電影。

  謝謝兩位！

  前陣子看了絕命毒師後來沒追完，看來要開始追了XD'
