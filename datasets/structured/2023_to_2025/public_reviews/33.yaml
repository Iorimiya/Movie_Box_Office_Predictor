url: https://www.ptt.cc/bbs/movie/M.1503763114.A.2B9.html
title: '[好雷]《真愛LINE著你》，毛蟲與蝴蝶。 '
content: '部落格版：


  由於下班時間的關係，昨晚在選片的時候選定了《初戀上女孩》，但下班時才發現場次時

  間有點晚，可又不到無法接受的地步，不過又不想要兩小時沒事做（真難搞），臨時點開

  《真愛LINE著你》的預告來看，看完以後立刻決定轉看這部，直衝真善美戲院買了一張票

  ，進場後發現幾乎坐滿一半，算是有點出乎我意料的多，在看完電影後，深深覺得自己做

  對了決定，我太喜歡這部電影了。我很常看文藝愛情片，因為那可以補足許多我自己對於

  愛情的想像，各種不同劇本使我看見不同的愛情面貌，儘管大多數終其一生都未必能遇到

  ，但說實在話我很怕太過黏膩的愛情，許多愛情片總喜歡過度浪漫，使整部電影走味，不

  過《真愛LINE著你》卻沒有這個問題，酸甜度適中，當甜度快要超過比例時，就會適時放

  進些其他調味去中和彼此，讓整部電影有笑有淚有酸楚有哀傷，時而捧腹大笑、時而感到

  一陣鼻酸。


  孫燕姿唱過《眼淚成詩》，苦唱到「分手傷了誰，誰把它變美，我的眼淚寫成了詩一首，

  無所謂。」，郭美美把「我曾經尋尋覓覓，想在文字裡尋找愛情，才發現最美的詩句，原

  來都在你眸裡。」唱進了《愛是你眼裡的一首情歌》裡，心碎是詩，心動是歌，或許相反

  。可不論是詩還是歌，人們總是想方設法把對愛情的體悟化做文字，或唱、或唸、或集成

  冊出版。因為一首歌愛上一個歌手；因為一首歌的詞愛上一個作詞人是常有的事，《真愛

  LINE著你》裡的男主角馬克同樣如此，一天天讀著陌生女孩的簡訊文字不自覺得愛上她，

  而傳簡訊的女孩克拉拉，則是把她失去未婚夫的苦痛與思念，透過敲敲打打將所有傳送出

  去，也不管會傳送到哪，她只是想說說話而已。


  暢銷童書作家克拉拉，兩年前看著未婚夫班在自己面前遭車撞死，兩年來始終走不出來，

  過去帶給小孩歡樂的她不見了，怎麼畫都是悲傷的插圖，為了找靈感也為了找回自己，克

  拉拉決定搬回曾和班住過的城鎮，暫住在閨蜜卡嘉家裡，有了卡嘉的相伴，克拉拉儘管看

  著班的遺物仍會落淚、仍不敢到墓園看他，但她總算是有了走出的跡象，不過就像她在報

  紙上讀到的詩句「愛情太短暫，遺忘太漫長」一樣，說忘談何容易？聽從常去的餐廳老闆

  的建議，她開始拿起手機，把想說的話打成簡訊，傳送給班的舊手機號碼，假裝他回到了

  她的生活，只是沒想到這些簡訊卻通通傳到了記者馬克的手機裡。




  馬克看似愛情事業兩得意，實際上卻不是那麼一回事，無法做他想做的專題新聞，又總和

  女朋友不在同一個頻率上，人生前進的不踏實，卻也不知道問題到底出在哪。直到他開始

  接收到陌生簡訊，他從最初的疑惑，到後來讀著讀著一頭栽進文字河流裡，成為了這些簡

  訊、這位陌生女孩的俘虜，算是體會到了同事口中所謂的「愛情高潮」，從女朋友身上沒

  有感受到的怦然心動，卻在此時流竄全身，身旁的同事笑他瘋了，竟然愛上了一個陌生人

  。不過馬克決定順從自己的感覺，選擇和女朋友分開，並循著簡訊找到了克拉拉，想要認

  識她更多、想要和她在一起，對克拉拉來說馬克就像個陌生人，但對馬克來講克拉拉早已

  佔據了他心裡的一塊，現在能做的，就是如何讓克拉拉走出來而已。


  「這需要好一陣子才能撫平。」


  「不知道我的好一陣子是多久？」


  克拉拉不知道自己要花多久走出，或許她認為只要班的手機號碼還在、班的婚戒、班的卡

  車還在，班就還存在著，於是她下意識地停在原地，就像她筆下的毛蟲蕾珂，不管她以牠

  為童書主角幾年，蕾珂始終是隻毛蟲，克拉拉說，蕾珂只是想證明自己，即便自己是醜陋

  的毛蟲，仍有辦法找到真愛、活出一片天，毛蟲蕾珂應當是克拉拉的自我投射，過去她有

  班所以安於現狀，現在她失去了班仍只想做隻毛蟲，因她不想讓班「誤以為她不在了」，

  可直到她遇見了馬克，曾有人對她提過的「讓毛蟲蕾珂變成蝴蝶吧」的提議有了實現的可

  能，蝴蝶象徵著重生，她知道可是她害怕，當她筆下的蕾珂終於化蛹成蝶時，就是她走出

  來的時候。




  我很喜歡《真愛LINE著你》裡頭的詩句與歌詞，準確地運用在各個地方，代替台詞道出每

  位角色當下的心聲，例如「我知道我腳下有裂縫，但我卻忘了怎麼跳過去」、「愛情決不

  會說我不知道」等等，優美的用字遣詞使之和其他同類型電影做出區隔。此外，還有電影

  利用「毛蟲破蛹成蝶」的意象去形容一個人在愛情裡的必經過程，女主角克拉拉最擅長的

  毛蟲蕾珂，看到最後便會發現是有其用意的，破繭重生，克拉拉就像毛蟲，必須衝破沉重

  的繭，方有可能飛向更寬廣的藍天，找到下一個屬於她的春天。


  電影有哭有笑，配角群相當搶戲，卡嘉、大衛、布特、妮基、甚至克拉拉出版社老闆，每

  位都非常的有特色，自然生動的幽默風趣，讓觀眾在看《真愛LINE著你》時能適度地緩和

  情緒，同時又不會過分刻意的拋出笑點要觀眾去接，一切的喜怒哀樂都如此流暢的被安排

  進劇本裡，像在感受著愛情的苦辣酸甜一樣。


  在看主角們的演藝經歷時，才發現原來導演、飾演克拉拉的卡洛琳荷芙絲曾演過《不良鮮

  師》（飾演歌手的卡嘉瑞曼也有演），兩部片風格截然不同，卡洛琳荷芙絲也呈現兩種面

  貌，根本不會發現她就是那位乖乖女教師，現在她從演員升格成導演，執導第一部片就有

  如此表現，讓人相當期待她的後續發展，而卡洛琳荷芙絲也成了我喜歡的女演員之一。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
