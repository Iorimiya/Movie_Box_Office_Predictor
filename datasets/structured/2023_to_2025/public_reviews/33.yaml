url: https://www.ptt.cc/bbs/movie/M.1715651667.A.7FC.html
title: '[新聞] 「蟲」入圍坎城影評人週 拍出台灣青年失'
content: '「蟲」入圍坎城影評人週 拍出台灣青年失語青春



  2024/5/13 14:42（5/13 15:51 更新）


  （中央社記者洪素津台北13日電）新銳導演王凱民執導新片「蟲」，男主角劉韋辰全片不

  曾開口說話，卻以遊走在壓抑與暴戾間的演出，道出了台灣當下青年失語的青春，本片獲

  選入圍坎城「國際影評人週」競賽。


  導演王凱民兒時在台灣和香港長大，10歲移民美國，跨國的成長生活背景，讓他對於台灣

  現況有著與多數台灣導演不同的視角。


  「蟲」的故事背景正是2019年，許多香港青年奮不顧身地投入反送中抗爭，王凱民在日夜

  關注局勢的同時，卻發現多數台灣人彷彿事不關己，為此他一度感到憤慨，但隨著他搬回

  台灣居住，才漸漸理解台灣人在面對當下局勢時，從無力無奈轉為把握眼前小確幸的複雜

  心態。


  「蟲」的片名透過三個「虫」字的結合，象徵主導台灣社會的3個腐敗勢力來源，就是政

  府、財團、黑道。王凱民認為，台灣人在國內貧富差距下只夠時間思考如何維持生存，已

  沒有多餘力氣去關注國際新聞，加上在國際舞台上無法正式出聲，無力感和無奈感正是由

  此而來。


  入選坎城國際影評人週單元的「蟲」，將於5月16日在坎城影展全球首映。同時本片也將

  角逐首部劇情長片的金攝影機獎。


  「蟲」中拍出不同世代的台灣人在如影隨形的侵略陰影下，面對生活與未來的態度。這些

  新世代導演從上個世紀前輩大師的巨大身影中走出自己的路，不僅堅持以自己的角度拍出

  當下的台灣，也因此更讓國際影壇期待透過這些作品了解台灣。


  「蟲」的角色在生活壓力下被激發出如蝗蟲般生存的赤裸本能，男主角劉韋辰曾以BL偶像

  劇「HIStory 3：那一天」入圍金鐘獎戲劇節目最具潛力新人獎。李夢苡樺曾以「一家子

  兒咕咕叫」入圍金馬獎最佳女配角。潘綱大則以「該死的阿修羅」入圍金馬獎最佳新演員

  ，3人都是新生代最受矚目的演技實力代表，更可望透過「蟲」在坎城影展的曝光，獲得

  更多國際矚目。（編輯：李亨山）1130513



  新聞網址：



  --'
