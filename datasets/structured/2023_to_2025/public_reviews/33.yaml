url: https://www.ptt.cc/bbs/movie/M.1693131963.A.D41.html
title: '[新聞] DC《藍甲蟲》女主角超辣！竟是內馬爾前'
content: 'DC《藍甲蟲》女主角超辣！竟是內馬爾前女友擁4000萬追蹤


  2023/08/26 07:15




  布魯娜馬爾科辛曾經與內馬爾交往過，兩人分分合合，最後還是分手收場。（翻攝自IG）


  〔記者廖俐惠／綜合報導〕


  DC超級英雄電影《藍甲蟲》（Blue Beetle）找來22歲的新生代男星索洛馬里達那主演男

  主角海梅，不過更引人注意的卻是電影女主角布魯娜馬爾科辛（Bruna Marquezine），其

  九頭身的驚人美貌讓人為之一亮，其IG追蹤人數竟超過4400萬人。




  布魯娜馬爾科辛姣好臉蛋，吸引許多人關注。（翻攝自IG）


  現年28歲的布魯娜馬爾科辛來自巴西，童星出身的她在當地早就極具知名度，她也演出過

  許多膾炙人口的作品，近年比較為人所知的應該是她主演的劇集《馬諦瓦公寓》，現在在

  Netflix也看得到。


  不過比起她的工作，布魯娜馬爾科辛的戀情或許更引人注意。




  布魯娜馬爾科辛身材好到讓人忌妒。（翻攝自IG）




  布魯娜馬爾科辛曾與內馬爾交往，愛得轟轟烈烈。（翻攝自IG）


  布魯娜馬爾科辛過去曾與足球選手內馬爾交往，兩人在2012年認識後陷入熱戀，愛得高調

  ，不時透過社群平台放閃，甚至一同出席公開場合，在內馬爾比賽時，布魯娜馬爾科辛也

  會穿著巴西隊的黃綠色服裝在場邊打氣，更被稱為是「最美大嫂」。


  不僅如此，內馬爾2018年年初因傷開刀時，布魯娜馬爾科辛也緊隨在身旁，當時內馬爾還

  PO出兩人牽手的照片，閃瞎眾人。




  布魯娜馬爾科辛超級正又非常辣，身材練得相當好。（翻攝自IG）




  布魯娜馬爾科辛IG追蹤多達4000多萬，相當驚人。（翻攝自IG）


  只是兩人分分合合，最後在2018年10月結束這段長達6年的愛恨糾葛，據傳這也是內馬爾

  最長的一段戀情。


  當時外界猜測兩人分手的導火線很可能是政治立場，不過遭到布魯娜馬爾科辛否認，並表

  示：「我們已經結束了！」



  新聞網址：







  --'
