url: https://www.ptt.cc/bbs/movie/M.1621167818.A.FB0.html
title: '[新聞] 流感、鐵線蟲還有活屍！5韓片疫情警世 耍廢在家追起來'
content: '新聞網址：



  記者吳孟庭／綜合報導


  台灣疫情持續緊張，團結起來「在家耍廢抗疫」也成為口號，不少人開始挖出塵封已久的

  片單，其中南韓就曾推出許多講述傳染病的電影，此刻看來超級有現實生活的即視感！大

  家不妨挖出來重溫，不但能在家殺時間，還能互相警惕！





  由張赫、秀愛、柳海真主演的災難片，曾於去年4月再度於台灣上映，警世意味濃厚。講

  述人蛇集團將一群來自東南亞的偷渡客，以貨櫃把人從香港偷運至南韓時全死亡，只有一

  名倖存者卻讓對方給跑了。後來有人開始咳嗽並引發多重器官衰竭身亡，致命流感開始在

  南韓四處流竄。目前於愛奇藝國際站、friday影音上架。






  一樣曾於去年再度於台灣上映的《鐵線蟲入侵》，講述漢江突然有大量支離破碎的浮屍，

  一追查才發現是一種變形蟲類寄生於人類後，操控大腦讓他們跳河自盡，是南韓首部涉及

  生態、反映傳染病的災難電影，由金明民、文晶熙、金烔完、李荷妮主演，同樣在愛奇藝

  國際站、friday影音看得到。







  相信大家對於《屍速列車》劇情還是相當熟悉，由孔劉、馬東石、鄭有美等人主演，講述

  孔劉與女兒搭火車到釜山的同時，一個神祕病毒開始侵襲首爾，人傳人後會將人類變成恐

  怖喪屍，讓南韓在一天內全部淪陷！目前於friday影音上架，續集《屍速列車：感染半島

  》也同樣看得到，愛奇藝國際站也有上架《屍速列車特別版》。






  同樣喜歡活屍題材，就不能錯過《屍戰朝鮮》！以朝鮮時代為背景而架空的古裝劇，講述

  一場可疑的瘟疫入侵，不但一國之王成為行屍走肉，百姓染疫後成為活屍肆虐全國，除了

  喪屍，宮中權鬥也相當精采，由朱智勛、裴斗娜、柳承龍等人主演。預計今年推出《屍戰

  朝鮮：信雅篇》之前，大家可以先回顧一下。全兩季目前已在Netflix上架。






  由影帝劉亞仁、朴信惠所主演最新活屍片，敘述首爾突然有不明病毒快速傳播，感染者全

  都化為吃人喪屍，而以為孤立無援的兩人發現彼此，攜手努力逃脫宛如地獄的「喪屍公寓

  」。末日感超級真實，目前也在Netflix上架。



  --'
