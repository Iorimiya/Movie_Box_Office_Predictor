url: https://www.ptt.cc/bbs/movie/M.1716747248.A.3F0.html
title: 'Re: [討論] 星際效應--未來人為何不直接把蟲洞開好'
content: '因為一切都要人類親身去經驗才能成長

  而開蟲洞是最小的干涉(有待商榷)


  有宇宙探險才有航天技術成長

  為之後星際移民打下基礎


  庫柏飛出去 長期回不了家

  女兒方能獨立

  成為數學家 科學家


  爸爸願意犧牲

  奇異點數據才能傳遞

  布蘭德當上新星保姆


  或許要經歷苦難

  才能展現愛的可貴


  也或許只有愛才能經得起時間的考驗


  致敬TARS


  如果蟲洞直接開到新星旁

  估計還沒飛出去

  人類就先自相殘殺 爾虞我詐 直至毀滅



  從科學角度來看

  離黑洞蟲洞太近的星球

  是不是壽命容易短

  或是環境偏不穩定之類

  如果是這樣

  離出口有點距離似乎也蠻合理











  -----

  Sent from JPTT on my Samsung SM-A5460.


  --

  節點也具可變性，宇宙多元派

  蟲洞引力理論上會影響周邊環境

  有道理，就像跟螞蟻講英文沒用，要用螞蟻的方式讓他們自己成長'
