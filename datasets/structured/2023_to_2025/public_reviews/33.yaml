url: https://www.ptt.cc/bbs/movie/M.1583781973.A.9B1.html
title: '[心得] 螢火蟲之墓，三刷於18年後'
content: '昨天打開網飛亂逛


  明明這麼多好看精彩的影集和電影等著我去看


  結果不知哪根筋不對，點到這部就不小心點開來看完了


  第一次看這部是小五，那時候看完只覺得很悲慘，又飽受驚嚇。媽媽裹著繃帶的屍體爬滿蛆那一幕，害我好一陣子不敢一個人待在黑暗的地方，覺得她會突然出現。


  第二次看是大學時，某個夜深人靜的夜晚，看完後覺得戰爭很可怕，戰爭沒有贏家。剛好那陣子看了不少二戰間和戰後故事的德國電影，也默默想著德國和日本處理戰後轉型正義態度的大不同。覺得與德國誠心反省當初的錯誤並努力彌補傷害比起來，日本卻不願意多談自己發起侵略的現實，相關影視作品多著重描寫日本本土和人民在戰爭中遭受的痛苦，心裡的感受很複雜。但人民是戰爭唯一的輸家，不管是戰勝國或是戰敗國都一樣，這點我是同意的。


  第三次看這部的時候，也就是現在，已經出社會一陣子，第一次覺得阿姨雖然對待主角兄妹不友善，她的反應卻很可能是那個環境下最正常的(我不知道為什麼以前一直有錯誤的印象，阿姨是主角媽媽生前的好朋友。想說阿姨未免太涼薄，人死了就翻臉不認人，故意把兄妹倆趕出去)。


  可是現在在台北工作，台北的房價已經高到一般人很難買得起了，而上一代高度發展的台灣經濟在這一代減速前進，年輕人生活在繁華的首都，面對低薪的困境和資源多被上一代佔據的局面。

  看片時時竟然有種要是台北也這樣被炸爛，房價應該就會大跌了吧？年輕人最大的資本就是年輕，最混亂、破敗的局面也是機會最多的時候。戰後的西德和日本，雖然經濟面臨崩潰，國內一片廢墟，可是生命會自己找到出路，許多現在的大企業都是在那個最壞的年代發跡，然後成長茁壯。

  看片時一直覺得，主角若是想要打拼餬口，養活自己和妹妹，怎麼可能沒有機會？雖然在高階軍官家庭長大，可能一時不習慣，可是現在很多人不就是慢慢習慣了，然後重新站起來了嗎？


  最後的結局很悲傷，令人惋惜，其實在他帶著妹妹跑到海邊玩、彈琴唱歌時我都覺得怪怪的，是沒有危機意識還是天真的以為好日子可以一直這樣下去？雖然阿姨很刻薄，舀給自己家人鍋底的米飯，卻只舀給他們稀飯湯(我這次看才發現這個細節)，可是為了生存，有時低聲下氣一點也是必須的，何況我覺得，站在阿姨的角度來看，這種態度和行為絕對是合情合理(說要自己煮飯結果兄妹吃完碗盤還不自己洗)。兄妹過慣舒服日子，個性使然可以理解，可是在這種環境下，沒辦法生存下來也是一定的。


  我自己的感覺，依照日本人的民族性，阿姨對他們再怎麼刻薄，總不可能任由他們餓死或是真的開口趕他們出去。可是既不願意貢獻勞力，又要像軍人一樣腰桿子硬挺，那也是沒辦法了。這種世道，能屈能伸，有堅韌意志和聰明的頭腦才能好好的活下去。


  爬了一些資料，這部原著小說的作者，年輕時似乎也像片中的哥哥一樣中二，還好他不但活了下來，而且還活的很好。我想對於在社會上打拼的青年，再度觀賞這部片，心情或許就是這樣複雜。


  沒有，我當然不希望台灣發生戰爭，好好活下去比什麼都重要。而且和平時期活不好的人，戰爭一來肯定活不下去。希望永遠活在和平的世界，卻能用面對戰後家園的心情努力開創出自己的一條路。


  11、20、29，三種歲數，三種心情。


