title: '[討論] 還有什麼動物或昆蟲可成為電影英雄?'
content: '在這裡討論的是真人所飾演的角色

  像漫威或DC漫畫衍生而出的英雄

  但不包括動畫電影

  因為動畫裡動物或昆蟲幾乎全包了

  所以不在這個範圍


  蜘蛛，蝙蝠，螞蟻，狼，烏龜

  貓，豹，鷹，浣熊


  還有什麼動物或昆蟲適合成為電影英雄人物?


  --

  功夫熊貓印象太深

  我有打囉

  老鼠是烏龜的濕父記得嗎'
