url: https://www.ptt.cc/bbs/movie/M.1467309567.A.490.html
title: '[好爽雷] ID4 欣伎蟲聲'
content: '我是鼓勵大家看的，

  畢竟本來鬱卒的上班生活，看完之後變得很開心~


  其實要打贏外星人本來就是不可能的事，

  所以若要以打敗外星人為結局，一開始就要認知到他是一部很扯的片。

  其他戰勝外星人的電影不也都在比扯而已?


  ID4 第一集本來也是扯，所以會回來續看第二集，

  心態本來就要正確:


  "我們是來看外星人如何愚蠢的領便當的!!!"


  整齣劇，最令我不自在的其實是angelababy的畫面，

  帶妝上陣就算了，還夾睫毛?

  還有不管什麼時候都是瞪大眼睛，完全無法融入劇情，

  對我來說她連花瓶都不算，算是一朵仙人掌吧!?


  整部片還是有可取之處，

  高層決策不拖泥帶水，沒有讓他們演出震驚表情的時間，

  我認為這樣很好，我相信真正的領導人是不會對著鏡頭擺出一副我到底看到了什麼的表情

  。

  比方說，當一個副官跟主官說火星(還是哪顆?忘記了)被吃掉了時，主官只是愣了半晌，

  隨即下令警戒，

  如果是假掰劇(日本很多這種)，大概會給他一個特寫，然後做出邊便祕邊下決定的表情。

  (山本五十六:我擔心我們已經叫醒了沉睡的巨人(便秘便祕))


  總之，劇情扯歸扯，但是畫面倒也沒有太離奇，

  至少沒有讓我看到機器人還留鬍子、戴頭巾的畫面。




  --'
