title: '[請益] 星際效應裡放蟲洞的?'
content: '有雷













  小弟覺得很奇怪，為何主角會認為放蟲洞

  和四次元圖書館的是未來的人類?

  本來的時間軸應該是人類在地球上滅亡，

  但因為蟲洞改變一切，

  我記得電影裡面好像有提到，

  時間可以壓縮折疊，可以拉長，

  但歷史不可能被改變，

  沒有蟲洞，未來不可能還有人類，

  有人類的話，他們不可能回到過去改變歷史。

  所以一定是某個高等文明要救人類而放置蟲洞才對，

  這樣的理解是正確的嗎？


  -----

  Sent from JPTT on my Asus ASUS_Z012DA.


  --'
