url: https://www.ptt.cc/bbs/movie/M.1692367560.A.79F.html
title: '[普雷] 藍甲蟲'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  最大的問題出在平庸的劇本架構

  “超級英雄起源都一樣”這個說法

  無法解釋本片沒有任何一句印象深刻的臺詞

  還有樣版的角色刻劃

  角色完全為了劇情推進而服務

  大半都是解釋性對話+拉丁家庭的碎嘴

  （結果連藍甲蟲的起源都沒有解釋到）

  明明充滿許多值得深入刻劃的情感元素

  但不論是女主角對其父親的追憶

  反派將軍的背景

  甚至做為推動主角覺醒的父親

  都沒有任何代表性的台詞跟情節鋪墊

  整片演完我甚至摸不清主角的個性到底是什麼

  對主角父親的離去也沒有共感

  一部超英電影卻沒有立體的個人形象是極其詭異的事情


  再來是本片價值觀的矛盾

  主角保持不殺的立場直到親人離世差點開殺

  雖是老梗還可以理解

  但對比另一邊開著蟲機一腳戳一隻的叔叔

  還有持槍颯爽開虐的奶奶

  這顯得在屍橫遍佈的戰場上還糾結不殺的主角格外諷刺

  更矛盾的還有開頭鼓勵主角要消滅威脅

  卻在最後關頭又阻止宿主消滅的藍甲蟲本身

  儘管這可以用與主角完美融合而被其人格影響

  勉強腦補 終究是電影鋪墊不夠的結果


  正因為劇本老套，電影的可看性就落在畫面上

  我對導演Angel Manuel Soto不熟

  但這部整體運鏡節奏流暢，沒有跳躍的剪接

  本以為串流電影的原罪會讓特效充滿瑕疵

  但意外在畫面上沒有太出戲的地方

  三場戰鬥表現中規中矩，最終戰也有做出張力

  整體來說，導演的表現很大部分受限於劇本

  我原來期待本片能再“特別一點”

  但放到充滿無數製作精良的超英電影的現在

  觀眾還能否對一部中庸的作品抱持寬容？


  窩不知道


  --'
