url: https://www.ptt.cc/bbs/movie/M.1522982649.A.28C.html
title: '[新聞] 螢火蟲之墓導演高畑勳辭世 享壽82歲'
content: '螢火蟲之墓導演高畑勳辭世 享壽82歲


  （中央社記者黃名璽東京6日專電）日本放送協會（NHK）報導，與動畫導演宮崎駿齊名的

  日本動畫界大師高畑勳，5日在東京都內醫院過世，享壽82歲。高畑勳曾執導「螢火蟲之

  墓」等動畫聞名。


  高畑勳1935年10月29日出生日本三重縣，1959年進入東映動畫；1968年首度執導動畫片「

  太陽王子霍爾斯的大冒險」，備受矚目。


  1971年跟後輩宮崎駿一起離開東映動畫，並參與製作電視動畫「魯邦三世」、「尋母三千

  里」、「清秀佳人」等。


  宮崎駿執導的動畫「風之谷」，高畑勳以製作人身分參與，這部動畫描寫人類與大自然的

  關係，獲得高度評價。


  高畑勳1985年與宮崎駿共同創設吉卜力工作室，執導的動畫螢火蟲之墓於1988年上映，描

  述一對兄妹飽受戰火摧殘，獲莫斯科兒童青少年電影節大獎。


  高畑勳生平獲獎無數，2015年還獲法國藝術文化勳章。（編輯:紀錦玲）1070406



  螢火蟲之墓導演高畑勳過世 與宮崎駿亦敵亦友合作多年


  （中央社東京6日綜合外電報導）吉卜力工作室今天證實，曾獲奧斯卡獎提名的日本動畫

  電影導演高畑勳辭世，享壽82歲。高畑勳是吉卜力工作室共同創辦人，最知名的動畫電影

  作品是「螢火蟲之墓」。


  吉卜力工作室發言人告訴法新社：「（高畑勳逝世）是真的，但我們還在求證一些相關事

  實，無法進一步評論」。


  日本放送協會（NHK）稍早引述與他有關的不具名消息人士報導，高畑勳近來健康狀況不

  佳，昨天在東京的醫院過世。


  高畑勳最近一部執導的作品「輝耀姬物語」（The Tale of Princess Kaguya），讓他在

  2014年入圍奧斯卡最佳動畫片。


  此片當年也在坎城影展主競賽之外的平行單元「導演雙週」（Directors'' Fortnight）入

  選。


  然而描述二戰期間一對孤兒兄妹故事的1988年動畫片「螢火蟲之墓」賺人熱淚，被外界視

  為高畑勳的最佳作品。


  高畑勳在日本中部三重縣出生，1959年進入東映動畫工作，展開動畫生涯，他也是在這裡

  認識宮崎駿，之後在1985年共同成立吉卜力工作室，打造出多部賣座動畫片。


  兩人亦友亦敵的夥伴關係，時常被媒體形容有瑜亮情節。


  在漫長且傑出的動畫生涯中，高畑勳製作出大約20部影片，包括1991年「兒時的點點滴滴

  」（Only Yesterday）及1994年「平成狸合戰」（Pom Poko）。


  他也參與製作由宮崎駿執導的1984年動畫「風之谷」（Kaze no Tani no Naushika），描

  述一個探討人類與大自然關係的科幻冒險故事。


  他也以電視動畫「阿爾卑斯少女小天使」（Heidi a Girl of the Alps）和「魯邦三世」

  （Lupin the Third）聞名。


  高畑勳也關心政治議題，2013年與大約250名電影名人連署請願，反對具有爭議的國家機

  密法。（譯者：盧映孜/核稿：張曉雯）


  --

  這篇較完整整理高畑勳在台灣熟為人知的電視動畫及電影作品


  --'
