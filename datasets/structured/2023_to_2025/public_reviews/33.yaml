url: https://www.ptt.cc/bbs/movie/M.1690205292.A.CBB.html
title: '[華納] 華納頭痛了！DC 電影《藍甲蟲》首週預估 '
content: "華納頭痛了！DC 電影《藍甲蟲》首週預估票房僅有慘烈的 1,200 萬美元\n\n\n\n2023 年 DC 電影試圖在影壇帶來些許影響力的掙扎，可能正因為《藍甲蟲》的到來而深\n\
  陷馬里亞納海溝。根據預測，《藍甲蟲》的首週末開畫票房可能只有低到驚人的 1,200\n萬至 1,700 萬美元。\n\n詹姆斯岡恩已經盡其所能激發人們對《藍甲蟲》的興趣，他確保所有人都知道傑米雷耶斯\n\
  的角色將在新的 DC 宇宙中延續，但即使如此，似乎也無法吸引人們進電影院觀看 DC 電\n影。\n\n如果 Box Office Pro 的預測結果準確，那麼《藍甲蟲》不僅將是近期\
  \ DC 電影中最糟糕\n的開畫成績（不考慮在疫情期間上映的《神力女超人 1984》，當時僅收入 1,670 萬美元\n），而且《藍甲蟲》預計在北美票房總收入也只有\
  \ 5,500 萬美元。\n\n考慮到《藍甲蟲》製作預算達到 1.2 億美元，這樣的結果對於華納兄弟探索公司來說無\n疑是另一場災難。\n\n對《藍甲蟲》的票房雪上加霜的是，由於正在進行的好萊塢大罷工，《藍甲蟲》主演將無\n\
  法出面推廣這部電影，更進一步阻礙華納激發觀眾對電影的興趣。原先《藍甲蟲》可能根\n本不會上映，這原本是計畫和《蝙蝠女孩》一起成為串流平台 Max 獨家電影。\n\
  \n《蝙蝠女孩》整部遭砍後，雖然《藍甲蟲》得以倖存，但現在看來，這將比《蝙蝠女孩》\n的上映可能帶來的損失還要大。\n\n雖然的確曾有許多「不知名」的超級英雄在電影中獲得巨大的成功，但對於\
  \ DC 系列來說\n，即使是最知名的英雄都未必能有好成績，這幾乎就確立了《藍甲蟲》的失敗。\n\n很快，我們將會知道《藍甲蟲》院線上映是否會是糟糕的財務決策，這部電影將於\
  \ 8 月\n 18 日上映，成為 2023 年 DC 電影的倒數第二部。\n\n\n\n--"
