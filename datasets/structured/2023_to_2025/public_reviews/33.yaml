url: https://www.ptt.cc/bbs/movie/M.1498229796.A.A02.html
title: '[問片] 大約十五年前有橘色外星蟲(人)的片'
content: '大家好，小弟已經想很久想不起來，也以各種「外星」「橘色」「外星人」關鍵字找了許

  久，但還是找不到，因此上來詢問。


  回到正題，

  大概十五年前有看過一部電影，但是對中間的情節已經沒什麼印象，只記得片中有橘色半

  透明狀的外星「蟲」（或人，我不太知道要怎麼形容他哈哈），會刺穿人體寄生在身上，

  人類主角們可以拿槍殺死外星蟲。

  印象最深刻的就是在片尾的地方，一群主角們本來要上太空船，但其中有一個人被外星蟲

  刺穿寄生，其他人來不及拿槍殺死外星蟲，他們只好忍痛自己上船。


  希望各位神人大大能幫助我QQ，雖然我知道這樣的條件很模糊，但真的年代久遠又是小時

  候看的，所以只記得這些，謝謝各位大大。


  --'
