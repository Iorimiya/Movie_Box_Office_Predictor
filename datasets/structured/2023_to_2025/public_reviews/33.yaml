url: https://www.ptt.cc/bbs/movie/M.1709992745.A.6A0.html
title: 'Re: [請益] 問沙蟲一個設定問題（有沙丘二雷）'
content: '沙蟲小時候叫做沙鱒 小小隻的骨溜骨溜


  會瘋狂吸水  厄拉科斯原先是充滿水的世界 也是沙鱒太多


  把水吸光光 導致氣候變化變成沙漠


  但沙鱒長大後變成沙蟲 反而變得怕水  一碰水即死亡分裂成沙鱒


  沙蟲在厄拉克斯是很重要的生態 巨大的沙蟲會在體內產生氧氣供給


  也是該星球的氧氣重要來源


  --'
