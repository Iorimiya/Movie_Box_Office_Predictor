url: https://www.ptt.cc/bbs/movie/M.1692248752.A.FFF.html
title: '[負雷] 藍甲蟲'
content: '今天早上去看10點的首場



  簡易心得就是


  要說難看好像不太對


  應該說無聊吧


  我看到有點想睡就是了


  打戲不算多也不是說很爽









  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  其實也沒甚麼好雷


  因為劇情真的太簡單


  男角是個平凡男孩


  女主是反派企業的人


  男主意外相識女主


  女主要叛逃反派企業


  應該說一開始就不是站同邊的人


  男主意外被聖甲蟲選定


  然後被反派企業抓走要拿取回聖甲蟲


  最後男主家人跟女主一起去救男主


  打敗反派BOSS


  就這樣



  雖然說英雄電影的劇情本來就不會太要求


  但這劇本也太過於制式了吧?


  制式也就算了


  演出也不太行




  家人的部分我很無感


  甚至我不太喜歡 特別是男主老妹...


  女主也莫名奇妙喜歡上男主


  反派BOSS營造的也不好


  就比較強的一個路人




  最讓我覺得出戲兩個地方是



  那個研究員到底?


  露幾臉講幾句話而已


  為什麼最後願意犧牲性命幫男主脫逃




  反派BOSS到底?


  打輸男主後


  被男主嘴家人是最重要的^$&$#^@&%$#&$


