title: '[普雷] 獻王蟲谷 霸王蠑螈很可愛'
content: '雷文防雷資訊頁








  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~








  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  一直都是鬼吹燈的小粉

  很喜歡潘粵明演的那個版本

  追了好幾部，最近看到有新的鬼吹燈是電影版

  想說來看看跟影劇版的有沒有差

  畢竟不同導演、演的場景人物啥的應該都不一樣。


  看了這部獻王蟲谷，第一個想法是

  不管哪個版的阿金是不是都長同一個樣?

  紅色外套、金色鋼牙、油頭....看到阿金就一整個笑了XD


  這部的內容有點可惜節奏太快了，其中有一點點在分心

  沒專注在看，但到後來進獻王墓那邊就比較好看一些

  打鬥(限主角、配角有點肉)跟場景做得有聲有色

  巨大榮嫄做得有點可愛，無法想像是怪物QQ


  還是有看完到最後，感覺得出來這一部的用心

  至少在場景之上有做到驚嚇我的感覺XD


  --

  確實劇情差了那麼一點點'
