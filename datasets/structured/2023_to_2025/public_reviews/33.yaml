url: https://www.ptt.cc/bbs/movie/M.1688544034.A.5C7.html
title: '[新聞] 《藍甲蟲》導演透露想將本片拍成三部曲'
content: '新聞網址：


  tor-teases-community-focused-heroics/




  《藍甲蟲》導演Angel Manuel Soto 近期受訪時，談到了自己對於《藍甲蟲》未來的願景

  ，並表示希望能將《藍甲蟲》拍成三部曲。


  「我們的想法是，首部電影我們要保持比較真實的感覺，因為我們希望在他成為全世界的

  英雄之前，得先成為他的家庭和社區的英雄。在第一部電影中，我們不希望他從外星人的

  侵略中拯救地球。」




  他表示：「我們第一部《藍甲蟲》的製作，一開始就是帶著我們至少要拍兩部續集的心態

  來進行的。我們採用了故事傳統的三幕結構，我們希望我們的第一部電影實際上就是一個

  傳奇的第一幕。」




  「我們是（岡恩的）DC宇宙未來計劃中的一部分，」Soto補充道：「而我們並未被過去的

  電影所束縛。是的，我們的電影設定於超級英雄存在的世界觀中，但這並不意味著特定的

  事件、特定的聯盟或者過去的某些事情會決定我們的電影走向。」



  /


  是說下個月就要上了，這片的存在感還是頗低


  感覺華納把宣傳經費押在《閃電俠》上了


  --'
