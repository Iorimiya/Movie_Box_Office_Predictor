title: '[片單] 昆蟲或外星寄生導致外觀改變'
content: "1. 請描述欲尋找電影的類型或特徵（請盡量描述清楚）\n\n戲裡的角色被昆蟲或是外星生物寄生感染\n\n外表改變變得噁心畸形 半人半怪物\n\n\
  或是寄生物附著在他人身上像腫瘤一樣\n\n很喜歡那種噁心的氛圍…\n\n\n2. 已知符合需求的電影或偏好的電影類型（為避免重複推文，請至少列舉一部）\n\n\
  蜂狂 （特效很好劇情很爛）\n\npuppet master (以前HBO常播 小時候超愛)\n\nthe thing（經典）\n\n極地詭變\n\n老師不是人（後段）\n\
  \n撕裂人（超愛）\n\n變蠅人\n\n變形蜘蛛人（非蜘蛛人 片名很爛但特效不錯）\n\n狸老屍卡好？（後面的海狸人勉強算是）\n\n\n異形那種蹦出來宿主就死了不算\n\
