url: https://www.ptt.cc/bbs/movie/M.1628612147.A.AB1.html
title: '[新聞] 甜茶《沙丘》巨型沙蟲來襲 水行俠敲碗'
content: '甜茶《沙丘》巨型沙蟲來襲感受命定衝擊　水行俠敲碗6小時導演版




  提摩西夏勒梅(右)在《沙丘》中有不少驚險動作場面。華納兄弟影業提供

  圖片來源 : 蘋果新聞網


  《異星入境》名導丹尼維勒納夫執導的史詩鉅片《沙丘》（Dune）因疫情延到今年10月才

  上映，今舉行IMAX片段搶先看放映，讓媒體先「聞香」前10分鐘，以及男主角「甜茶」提

  摩西夏勒梅首度飛越厄拉科斯星球的沙漠，了解眾人搶奪的珍貴香料與其採集過程，也首

  度感受到巨型沙蟲可怕威脅的一場戲。維勒納夫鏡頭下的世界絕美壯闊，飾演「鄧肯艾德

  侯」的「水行俠」傑森摩莫亞甚至「敲碗」說：「我不希望電影被刪減，我要看6小時的

  導演版！」




  提摩西(左)與蕾貝卡弗格森飾演母子。華納兄弟影業提供

  圖片來源 : 蘋果新聞網


  《沙丘》改編自法蘭克赫伯特的同名小說，系列小說共有六部曲，不僅被譽為世上最偉大

  的科幻文學之一，地位媲美《魔戒》在奇幻文學中的地位，更是啟發《星際大戰》、《駭

  客任務》等一系列科幻電影，影響無數大眾娛樂作品。


  六部曲小說也將在台灣完整上市。


  鬼才導演大衛林區（David Lynch）曾在1984年改編搬上大銀幕拍成《沙丘魔堡》，當時

  評價與票房都不盡理想，但近年來在影迷心中竄升為「邪典片」地位。


  電影前10分鐘，由「蜘蛛女」贊妲雅所飾的荃妮描述厄拉科斯沙漠星球的美麗景色，讓觀

  眾快速了解這片土地、居住於此的弗瑞曼人，以及神祕稀有的香料對星際旅行的重要性；

  厄拉科斯因盛產香料而受到各方勢力爭奪，尤其是殘忍無情的哈肯能家族，但皇帝突然宣

  布讓亞崔迪家族接管，前往厄拉科斯重塑和平。


  「甜茶」夏勒梅飾演的保羅亞崔迪的第一場戲，則是從睡夢中醒來，與母親潔西嘉共進早

  餐，但潔西嘉一開始就要他練習「魅音」，展現出保羅和母親一樣具有控制身體與心靈的

  特殊能力。


  導演維勒納夫表示，片中他最喜歡的片段，即是巨型沙蟲現身的浩大場面，那場戲中雷托

  公爵（奧斯卡伊薩克飾）、保羅亞崔迪、葛尼（喬許布洛林飾），以及列特凱恩斯（莎朗

  鄧肯布魯斯特 飾演）飛過厄拉科斯的沙漠，了解香料及採集的過程，之後親身體驗到潛

  伏在地下的可怕沙蟲，會不時出現並吞噬沙漠中的一切。維勒納夫表示，保羅在那一場戲

  首度產生一種命定的歸屬感。




  「水行俠」傑森摩莫亞還沒看到成品，已經對導演丹尼維勒納夫拜服不已。

  圖片來源 : 蘋果新聞網


  該片預定拍成兩部曲，片中也演出一角的傑森摩莫亞，最近接受《紐約時報》訪問表示，

  「這是部很酷的電影。你知道他們需要做什麼嗎？他們需要製作出4到6小時的第一部曲，

  我想要看到丹尼的完整創見，我不希望它們被刪減」。


  該片被選為威尼斯影展觀摩片，將於下月3日在當地舉行世界首映。台灣定於10月14日上

  映。（李子凡／綜合報導）



  新聞網址：


  --'
