url: https://www.ptt.cc/bbs/movie/M.1489040611.A.E16.html
title: '[好雷] 上班一條蟲 '
content: '網誌好讀版：




  Office Space (1999)


  上班族必看的老片，是一部還滿惡搞的美式作品，


  這部片沒有啥卡司，


  至多是女神珍妮佛安妮斯頓比較算熟面孔，


  片中講了許多大企業上班族會發生的現象，覺得滿有感覺的。



  例如：通勤塞車怕遲到、靠北的同事、卡紙的影印機、機車的主管、


  黑洞的人資管理，上班時間幾乎都在打茫 ...等，


  主角還道出一般上班族的心聲：


  「我替公司賺錢並不會多分我一點，


  但我出錯，卻會有八個主管來定我，要不然就是擔心被解僱，


  促使我工作的動力，只是避免被解雇而已。」



  故事是說軟體工程師三人組，


  雖然很討厭自己的工作、也都覺得很無聊，


  但還是不情願地繼續待在公司工作，


  主角3人們都是不敢表現真正自我的人，


  即使心裡有幹話，但在權勢面前還是裝乖到不行，


  就連等紅綠燈遇到賣雜誌的，都會默默地把車門鎖起來，


  收起自己剛才在車內大聲唱歌的樣子。



  有天公司來了一個顧問，他要負責檢查每個人在幹嘛，


  找出每天來上班卻不做事的薪水小偷並裁員，減少公司開支，


  主角在一次催眠中突然頓悟了生命的意義，


  覺得人生不該浪費時間在這種爛工作身上，就沒去上班，


  但靠北的事情是，同事被裁員，自己卻反而升官，


  主角覺得這樣不行、不公平啊！



  同事為了發洩自己被裁員，終於把那台常卡紙的影印機偷出砸爛，


  堪稱為本片的經典場面...


  3人於是就想用搞內鬼的方式植入病毒，


  從支援銀行的軟體系統偷小錢出來給自己花用，


  結果沒想到病毒寫太強，一次偷超多錢，


  這下一定會被發現，只好研究怎麼處理，


  某同夥就說可以洗錢，但因為平常太乖了，


  不知道那到底是指甚麼意思，就拿字典出來查XD


  混亂越來越多，主角追到的珍妮佛安妮斯頓，


  也因為前男友跟主角的主管同名而造成誤會，兩人大吵一場，


  讓主角還做惡夢，夢到主管在一邊在上自己女友珍妮佛，


  還一邊用上班的機車口氣指使他，真的是還滿靠北的，



  後半段有點難以收尾，就用混亂收場，


  其實整部片的轉折作的滿像喜劇片的無厘頭亂搞，


  結束主角們搞出來的麻煩之後，後來像是輪迴似的，


  其他同夥們雖然還是抱怨、但還是乖乖去另一家公司上班，


  回歸社畜之路，繼續工作的輪迴，繼續選擇平庸。


  主角則是改在工地打工，


  但覺得現在的狀態真的是Fucking "A"的好！


  實在是太人性的結尾，


  看得有點悲傷，我想永遠壓抑真正自己想做的事情，


  而甘願做一些不太喜歡的事情，才是人性吧...嗎？


  還是鬼島人性哩ＱＱ？


  粉絲專頁：



  --'
