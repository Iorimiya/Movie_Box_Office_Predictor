url: https://www.ptt.cc/bbs/movie/M.1628590309.A.A3B.html
title: '[新聞] 《沙丘》巨型沙蟲震撼現身 漢斯季默配樂'
content: "《沙丘》巨型沙蟲震撼現身 漢斯季默配樂建構新世界\n\n\n\n由導演丹尼維勒納夫(Denis Villeneuve)執導的史詩巨片《沙丘》即將於10月14日（週四\n\
  ）全台上映，故事描述一位聰明又富有天賦的年輕人保羅亞崔迪，肩負著超越自己能理解\n的偉大天命，必須遠行至宇宙中最危險的星球，以確保家族未來的延續。華納兄弟今舉行\n\
  《沙丘》IMAX精彩片段搶先看觀賞會，透過大銀幕體驗這個波瀾壯闊、嘆為觀止的冒險旅\n程。\n\n\n《沙丘》改編自法蘭克赫伯特的同名小說，系列小說共有六部曲，不僅被譽為世上最偉大\n\
  的科幻文學之一，地位媲美《魔戒》在奇幻文學中的地位，更是啟發《星際大戰》、《駭\n客任務》等一系列科幻電影，影響無數大眾娛樂作品，小說六部曲也將首度完整在台灣上\n\
  市。\n\n\n電影一開始由荃妮（辛蒂亞飾演）描述厄拉科斯沙漠星球的美麗景色，讓觀眾可以快速了\n解這片土地、居住於此的弗瑞曼人，以及神祕稀有的香料；厄拉科斯也因為盛產香料而受\n\
  到各方勢力爭奪，尤其是殘忍無情的哈肯能家族。接著透過夢境，暗示故事主角保羅亞崔\n迪（提摩西夏勒梅飾演）有著不同凡人的特殊能力，他的母親潔西嘉女士（蕾貝卡弗格森\n\
  飾演），作為女性組織貝尼潔瑟睿德的成員之一，也具有控制身體和心靈的能力。亞崔迪\n家族很快接下皇帝的詔命，前往厄拉科斯重塑和平，成員包含保羅的父親雷托公爵（奧斯\n\
  卡伊薩克飾演）、鄧肯艾德侯（傑森摩莫亞飾演）、葛尼（喬許布洛林飾演）。\n\n\n\n導演丹尼維勒納夫也分享電影中他最喜歡的片段，即是巨型沙蟲現身的浩大場面。雷托公\n\
  爵、保羅亞崔迪、葛尼，以及列特凱恩斯（莎朗鄧肯布魯斯特飾演）當時正飛過厄拉科斯\n的沙漠，了解香料及採集的過程，之後親身體驗到潛伏在地下的可怕沙蟲，會不時出現並\n\
  吞噬沙漠中的一切。\n\n\n《沙丘》的配樂則是由漢斯季默負責，他跟導演丹尼維勒納夫一樣，也是原著小說的超級\n書迷。為了符合故事背景，漢斯季默捨棄現有的管弦樂器，創造新的樂器並運用不同表演\n\
  者的發聲，來呈現不屬於這個世界的聲音。兩首電影配樂〈Paul’s Dream〉及〈Ripples\n in the Sand〉日前也正式釋出，帶領觀眾進入《沙丘》的世界。\n\
  \n\n\n\n--"
