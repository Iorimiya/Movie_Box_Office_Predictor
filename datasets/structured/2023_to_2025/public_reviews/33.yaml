url: https://www.ptt.cc/bbs/movie/M.1516642052.A.4F8.html
title: '[問片] 一部女角色拿鏟子壓爆蟲的老電影'
content: '這部片是我十幾年前在電視上看到的

  (時間可能是2000年前後，但不確定)

  應該是美國電影


  只記得有一個中年的白人女性，

  一邊拿著小鏟子整理盆栽，一邊跟一個白人男性說話。

  然後她發現土裡有一隻雞母蟲(那種黑色頭、身體白白肥肥的蟲)

  便用鏟子直接把蟲壓爛。


  印象中這個舉動是作為隱喻，想向男人講述一些事情，

  男人有錯愕了一下。

  而女人給人的印象是非常冷靜、聰明，但卻很邪惡、變態。



  當時看到這幕年紀很小，被嚇到，於是就轉台了(XD)

  現在很想看這部片到底在演什麼

  但記得的就只有這些

  因此想求助版上的神人們，感謝~~


  --'
