title: 'Re: [討論] 今天是螢火蟲之墓清太在車站掛的日子'
content: '來幫你收收眼淚。


  螢火蟲之墓這小說，是作者野坂昭自己親身經歷改編而來的。


  意即現實中的清太，活好好的，還當過日本議員。




  上面寫法，是他這妹妹，其實和自己沒血緣關系，所以也沒有好好照顧，

  有食物也是自己先吃，也覺得少了妹妹這拖油瓶，他人生會輕鬆很多。



  結論是，要看同樣催淚，又在講述日本戰後的殘酷，我還是去看 哥吉拉 minus one好了


  --'
