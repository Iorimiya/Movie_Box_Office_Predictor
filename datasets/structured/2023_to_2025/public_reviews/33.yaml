title: '[討論] 戒護所風雲/鐵線蟲入侵 iTunes NT$80起'
content: "《戒護所風雲》\niTunes NT$80\n>> \n\n《拆彈少年》潛力新星路易霍夫曼主演史實改編控訴主題片！舞台為 1960\n 年代晚期德國，給少數崇拜舊時代領袖的強權份子把持，氣氛維持封閉局\n\
  勢。任路易被迫送入輔導問題孩童的寄宿學校，卻驚覺校內實質進行思想\n控制，使他開始爭取僅有的尊嚴、人性及自由。\n\n《噪音》\niTunes NT$90\n\
  >> \n\n《月之圓缺》日本金像獎提名名導廣木隆一改編筒井哲也同名漫畫，拍起\n孤島騷動！由藤原龍也扮年輕果農左右島嶼氛圍，從原先種果有成幫家鄉\n喚起生機的希望，受渡邊大知可疑舉動釀成和老友失手奪命的悲劇，演變\n\
