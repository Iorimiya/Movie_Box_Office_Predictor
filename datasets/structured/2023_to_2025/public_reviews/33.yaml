url: https://www.ptt.cc/bbs/movie/M.1693021371.A.1C7.html
title: '[新聞] DC《藍甲蟲》乾脆不上映？韓媒揭關鍵 '
content: 'DC《藍甲蟲》乾脆不上映？韓媒揭關鍵



  由克里斯多夫諾蘭執導的電影《奧本海默》在南韓上映大賣，連續10天穩坐票房冠軍。相

  較於《奧本海默》的票房強勁，另一部強檔新片《藍甲蟲》據傳不在南韓戲院上映，直接

  以OTT串流平台的方式播出。


  根據《韓聯社》報導，《藍甲蟲》北美首周票房破8億台幣（約2540萬美金），不過南韓

  電影界消息透露，華納兄弟不打算讓《藍甲蟲》在南韓戲院上映，事實上DC英雄電影在南

  韓似乎不怎麼吃香，像是《猛禽小隊：小丑女大解放》、《神力女超人1984》、《自殺突

  擊隊：集結》、《黑亞當》等片，觀影人數都沒有超過100萬，年初的《沙贊！眾神之怒

  》也只有7萬8000人。伊薩米勒主演的《閃電俠》雖然頗受好評，但也只有63萬人。


  部分人士推測，DC在南韓票房接連失敗，可能就是導致《藍甲蟲》不在戲院上映的原因。

  比起在戲院上映，或許在OTT上線的收益還比較好。電影相關人士指出，如果要在電影院

  上映的話，還需要投入宣傳等費用，「從DC的成績來看，《藍甲蟲》是否大賣還是未知數

  ，如果直接去OTT平台的話，就算沒有很大的收益，但至少穩定。」






  --'
