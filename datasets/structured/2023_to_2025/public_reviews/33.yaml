url: https://www.ptt.cc/bbs/movie/M.1692512588.A.443.html
title: '[負雷] 藍甲蟲'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  滿分100分的話 這片我給40分


  加分項目

  家庭 家人的互動還不錯

  有把"平常很煩 但是還是最親愛的家人"那種微妙的親情互動拍出來


  扣分項目

  教人原諒的教育大戲 (大大大大大大大大大扣分 沒這個的話這片可以給60分的程度)



  我完全沒有事先查過任何資訊 完全白的狀況下去看電影的


  整片其實就是中規中矩(有點偏無聊)


  中間劇情也沒啥需要提出來的


  但是在最後面轉折的劇情


  主角因為壞人死了爸爸 壞人還當著主角的面拿火箭筒轟他叔叔


  主角怒了 把壞人打倒在地


  但是最後要對著壞人下殺手的時候卻被裝甲上的另一個意識"卡基"教育了


  說是啥麼? 她回復的壞人的記憶 讓主角看一下 這個壞人也很可憐 其實是被黑幕利用


  然後主角就放揮刀下去戳壞人旁邊的地板 原諒他了


  原諒了!? 看了這邊我突然後面的劇情都忘光光了


  為啥麼我要來看這種原諒大戲


  殺人不好? 中間的叔叔開甲蟲踩死小兵 阿罵拿機關槍打死好多小兵 都沒有手軟


  這個實質上的父親的仇人 還有叔叔的仇人(當下的認知)


  你就這樣原諒他了!?


  越打越生氣 我覺得這段可以扣100分下去 完全不爽快的感覺


  如果不是很在意這種原諒教育大戲的話 這片還是有60分可以看 就是中規中矩的起源片


  --'
