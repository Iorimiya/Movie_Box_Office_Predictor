url: https://www.ptt.cc/bbs/movie/M.1560876395.A.B62.html
title: '[新聞] 螢火蟲電影院開跑 12部優質電影免費看'
content: "新聞網址：\n\n\n螢火蟲電影院開跑 12部優質電影免費看\n\n夏日炎炎何去處？不如來場夜間電影吧！2019螢火蟲電影院開跑，桃竹苗與新北場次於6\n\
  月下旬至8月上旬播映，首場於6月21日在新竹縣竹東鎮熱鬧登場，共計放映12場次的優質\n電影。\n\n國立新竹生活美學館與文化部影視及流行音樂產業局合辦「電影藝術分享計畫─螢火蟲電\n\
  影院」，為落實文化部推廣國片、電影下鄉，螢火蟲電影院前進校園、尋訪原鄉、深入社\n區等，將分別走進新北市中和區、土城區、樹林區，桃園市復興區、楊梅區、新竹市香山\n\
  區、新竹縣五峰鄉、竹東鎮、寶山鄉，苗栗縣南庄鄉、後龍鎮、苑裡鎮等鄉鎮。\n\n今年規畫3個主題，包含「我們的島」、「我們的家」及「我們的愛」，「我們的島」將\n\
  播映關心在地環境生態議題的《山的那一邊》、《只有大海知道》以及真實故事改編的《\n老師你會不會回來》，讓觀眾在觀影中，同時能夠省思環境保育、水資源、地震或風災後\n\
  重建等課題。\n\n主題「我們的家」將播映以親情為題的《憨嘉》、《上岸的魚》，網紅奶奶與寂寞男孩成\n為忘年之交的《生生》，還有去年拿下金鐘影帝盧廣仲主演的《花甲大人轉男孩》，挑選\n\
  放映家庭親情、老人長照、隔代教養相關的電影，能夠試著去正視現今臺灣家庭面對的難\n題，思考如何面對長輩老去、與家人共同生活、下一代教育、價值觀的衝突，進而對家人\n\
  付出關愛。\n\n「我們的愛」則挑選去年引起廣大迴響的催淚電影《比悲傷更悲傷的故事》以及談論父子\n之情的《范保德》，愛的模樣存在著太多想像，電影裡總有那麼一個片段，觸動人們內心\n\
  深處的故事，這一次跟著螢火蟲走出家門、走進夜裡聚在一起，等待一部好電影，創造你\n我的故事。\n\n另外，為了能夠讓民眾更認識電影幕後的過程，還有國內電影界知名人士參與映後座談，\n\
  包含《只有大海知道》導演崔永徽，《山的那一邊》導演，同時也是知名演員的陳道南，\n金鐘製作人陳南宏及知名演員、導演陳文彬，來分享他們的創作經驗，詳細資訊可至「螢\n\
  火蟲電影院」臉書粉絲頁查詢。\n\n\n\n心得:\n\n好懷念小時候的大布幕電影喔~\n\n\n--\n：　\n台灣就真的變畸形兒鬼島了： \n\n福島核能爆炸全錄像：\n\
  更多車諾比核災的畸形兒：\n\n\n--"
