url: https://www.ptt.cc/bbs/movie/M.1692288641.A.C83.html
title: '[普好雷] 其實蠻可愛的藍甲蟲'
content: '今晚看之前看到版上幾乎都是負雷

  自己忐忑的去看完 出來發現還是幾乎都負雷


  坦白說我真的覺得有點訝異跟荒謬了

  在想是單純要臭DC或者超英? 因為就成品來說真的像前前篇說的沒那麼差

  至少在超英電影的起源電影中 算是中上

  單純論跟首集大頭目對決的終結戰 更可以算前面了


  大家不會因為懷念的美好 忘記其實鋼鐵人本傳打的都不怎樣

  美隊第一集九頭蛇犬死 驚隊第一集裘德洛超弱吧? 更別說猛毒真的蠻鳥了

  就我個人而言 他做為起源Bug也沒有尚氣多 更比黑豹流暢合理


  就我看來 真的能給他負雷的充分理由

  真的就是有太多超英英雄 所以覺得起源無法突破窠臼

  但..........超英片有翻美漫就知道 大概也只能這樣演呀

  何況其實他已經跟一般的超英片 特別用不同手法了(下面會提到)


  或者就是超英片的審美疲勞 亦或者因為這個超英太小咖?

  但 這些跟他本身做為一部娛樂片的"結果"無關吧?

  至少我今晚在大遠百看imax 音效不錯 全場票房不錯 大家也都笑的很開心


  輕鬆 好笑 有大場面 這不就才是評論一部娛樂片該聊的東西?


  來提提它在我眼中的優點


  -基本上就算前面負雷的也有人提到 他其實就非常穩定且流暢的演完一部電影

  但抱歉~ 從漫威第四階段 到DC最近黑亞當與沙讚 更別說Sony那邊的

  其實光要流暢順暢的講完一部片 還不會被人覺得太硬湊 時間太像在趕場 節奏混亂


  這就已經不是一件易事了(大家閉上眼睛自己去回想一下)


  -不要帶入太多sjw的情緒 或者對標榜拉丁有太過份的聯想或反感

  這部片真的很把拉丁家族的氛圍拍的很好 你簡直是在看另外一部肥牡蠣

  不是說那種硬要大家都變家人的部分 而是他營造了很可愛很溫馨的拉丁家族風族

  我現在可以理解很多人對他拉丁部分的稱讚 不是那種黑人一定要挺黑人

  是他真的把拉丁元素 拉丁人的那種家庭喜感跟重視家庭 拍的很到位也溫馨


  -所以我是很喜歡很吵的這家人的 一直碎嘴一直碎嘴 但每個人都很有存在感

  老好人爸爸 超殺的阿嬤 惹事吐槽但有愛的妹妹 怪人叔叔 媽媽...就是媽媽囉(戲份較少)

  這也是為什麼這部超英 幾乎透過氛圍就可以自帶喜感跟溫馨 這部份真的不錯


  -演員群其實很多也演得不錯 男主角碎念但其實意外演的稱職不慎尷尬

  以前從沒看過他的作品(?) 但也長的蠻帥的身材很好 妹妹雖然人設很屁

  但演員其實演的很不錯~ 女主角前面也有人提 真的蠻正的

  就我看來 很像拉丁版本的妙麗or富人版的蜜雅!?


  -其實結尾的安排不錯~ 反而是被上身的鬼阻止 壞人也換了個方式

  另外就是最後的彩蛋... 有版友批評起源沒解釋清楚 問題如果解釋不就更老梗?

  明明電影中就很清楚交待來自外星 然後大家都還不知道

  彩蛋也就明確表示 要等到第一代藍甲蟲登場才會解釋 我反而喜歡這次倒過來的安排


  而且就擺明要當續集揭曉的賣點 批評沒說清楚起源蠻奇怪的吧?


  -回到藍甲蟲本身............. 其實這個超英我以前真的不熟

  這次也刻意不先做功課~ 結果電影中呈現的比我想像中有趣跟強很多


  大體上大概就是前面有人提到的蜘蛛人(甲蟲) 鋼鐵人(雷同鋼鐵裝?) 死侍(主角吐槽役)

  我個人會再加上猛毒(共生體)黑豹(進入哈門世界)

  (一代則是貧窮下位版的蝙蝠俠(有錢有基地自組裝備))

  然後我也如前面板友提到 有想到強殖裝甲 只是他又不是那種生體型態

  事實上他也不那麼接近鋼鐵人 機體讓我更想到的是..... 超時空要塞 更具未來科幻感


  再加上他的能力之一 有點接近綠燈俠又不完全一樣:

  主角想像得到的武器大概都能出來


  所以實際打起來其實意外的蠻爽的 大概像是能格鬥的鋼鐵人 氣砲又有洛克人的味道

  但某程度又像特攝片可以拿武器亂砍爽砍(那把預告有的很像凱茲大劍)


  再加上改良了以前漫威體系 機器人幹架大多蠻弱不夠爽(包括奧創)的部分

  就我個人而言 視覺體感比鋼骨強多了也爽多了

  也真的要拜反派也屌打絕大多數以前出現的鋼鐵/機器人型反派

  他不是只是單純在那裡轟呀炸呀 是結合這些再加上肉搏跟武器近身戰


  當然 有些版友會覺得怎麼像是其他英雄的影子 不過超英越多不就篤定這樣?

  事實上換個角度 他變成像是集很多英雄能力為一體 當然也能視作結合而打的更多元


  另外... 蟲艦也是我個人看了也是蠻喜歡的設定 是電腦時期很前期的產物

  所以非常Cyberpunk... 反而有種童真的浪漫情懷~


  劇情大綱主軸雖然就很王道 不過我看到的是以上其它讓他有所差異的優點

  要不是真的這超英太小咖 以及DC重組 如果票房還過得去

  願意把彩蛋實現為下一部... 我個人是真的會期待第二集的



  不過說完好處 還是要提缺點 這是我同時給他半普的原因


  雖然主軸推進流暢也合理 不會一直像近年漫威走火入魔的都合主義先射箭再畫靶

  但在細節設定上 真的有蠻多不嚴謹會讓人吐槽的部分

  (簡單說就是只是拿來推進劇情的橋段 往往就編的漏洞很多)


  隨便舉例(前面也有人提到)

  -女主角偷走藍甲蟲靠的是幹科學家的證件...等等 那科學家之後怎麼進實驗室的?

  -女主角大樓管制了 結果根本沒鎖門...男主角大刺刺跑出去 這部份真的會讓人狂吐槽

  -後面再一次我能接受駭入監視器 但離開從大門大刺刺這我也不太能忍翻了幾次白眼

  -最後女主角明明就也變肥牡蠣了~ 叔叔還要嗆她們家 粗暴Duck不必


  就其實都是些過場小地方 擺明就是隨便帶過省時間 但我個人認為可以做得更好

  細節不夠精緻~ 希望如果有機會有第二集 多注意一點啦


  --

  至於武器 男主角唸法律的又還只是個學生 姑且就當他想像力不足吧~


  --'
