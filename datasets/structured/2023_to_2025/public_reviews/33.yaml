title: '[大負雷] 螢火蟲之墓'
content: '沒看過這麼噁心的電影


  把日本偽裝的好像受害者一樣


  笑死 二戰時在其他國家燒殺擄掠不敢說


  被美國轟炸還敢拍成電影裝可憐


  東京大轟炸跟兩顆核彈就是日本應得的


  二戰日本多噁心 到處搞屠殺


  731人體實驗 慰安婦


  美軍根本就幫當時被侵略的國家出了一口惡氣


  我是真沒想到日本有臉拍這種洗白片


  查了一下原作者更爛 卦一堆


  也是啦


  一個到現在還把侵略戰犯放在神社給人拜的國家


  根本就沒反省過


  難怪韓國整天吵慰安婦


  日本就只會打模糊仗 不承認自己罪行


  韓國有骨氣多了 反觀某個島


  我阿嬤自願的 笑死 有夠賤


  這種噁爛的片子真有人看到哭


  只能說連點基本思考能力都沒有


  容易被帶風向洗腦


  真的快吐了 後悔看這片



  -----

  Sent from JPTT on my iPhone


  --

  ？

  日本談反戰 笑死人 先把靖國神社拆了再說吧'
