title: '[贈票] 【藍甲蟲】特映會搶先看 '
content: "海梅雷耶斯剛從大學畢業回到家鄉，對未來滿懷抱負，但卻發現他的家已經跟以前不一樣\n了。他開始尋找自己在這個世界上的目標，此時命運來敲門，海梅意外尋獲一個外星生物\n\
  科技的古遺物—聖甲蟲。這隻聖甲蟲忽然選擇海梅成為其共生宿主，使海梅獲得一套神奇\n的盔甲，並被賦予出乎意料的超能力。這永遠改變海梅的命運，從此變成超級英雄藍甲蟲\n\
  。\n\n《抽獎方式》\n8月12日 (週六) 23:59 前，推文留言你想要參加【藍甲蟲】的〈場次〉與〈原因〉，就\n有機會搶先看電影！\n（如：高雄場，我想變成超級英雄藍甲蟲！）\n\
  \n《獎項內容》\n【藍甲蟲】電影試映券（一組2張）\n\n《特映會場次》\n台中場：8/16 (三) 19:00 台中大遠百威秀 15組 （一組2張）\n高雄場：8/16\
  \ (三) 19:00 高雄大遠百威秀 15組 （一組2張）\n\n《中獎通知》\n8月13日 (週日) 15:00前，公布中獎者於回文內，並寄站內信通知得獎者得獎事宜。\n\
  8月14日 (週一) 12:00前，請各位中獎人務必回覆領獎資訊，恕不接受逾期回覆。\n\n《注意事項》\n1.試映券為非賣品，嚴禁兜售等圖利行為。\n2.票券尚未劃位，請於開演前60分鐘自行劃位，座位劃滿即不受理。\n\
  3.請準時入場觀賞，電影開演後10分鐘戲院與主辦單位有權謝絕入場。\n4.因應疫情期間，請民眾中央流行疫情指揮中心發布之防疫規範，持續配合防疫措施，守\n護彼此健康。\n\
  5.如本活動因不可抗拒之特殊原因無法執行時，主辦單位有權決定取消、終止、修改或暫\n停本活動與延遲得獎公告。\n更多電影資訊：華納兄弟台灣粉絲團 \n\n--"
