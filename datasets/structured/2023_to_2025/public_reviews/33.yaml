url: https://www.ptt.cc/bbs/movie/M.1536550912.A.B83.html
title: '[問片] 一部吸腦汁的怪蟲電影(有雷)'
content: '這是一部滿久以前的電影，估計是1980年代的歐美恐怖片


  印象中記得的部分如下


  1.主角是一位年輕男孩(大約18歲)，在他住的地方遇到一隻會吸人腦汁的蟲


  2.吸人腦汁的蟲會講人話，大小類似一個小寶特瓶，整隻大概是紫黑色的


  3.主角跟吸腦蟲似乎維持一定的共生關係


  4.一部分的結局是，最後有一名警探鎖定主角，發現他與多起死亡案有關，在一間公廁


  要搜查男主角(或是只是盤查?)的時候，吸腦蟲突然跳到警探頭上吸他的腦汁，男主角要


  吸腦蟲跟他趕快走，吸腦蟲回答說他還沒吸乾淨，但還是準備走，最後警探忽然迴光返照


  跳起來用手握死吸腦蟲


  以上對這部電影的印象，還請各版友幫忙回想一下是否有記得這部片的，感謝


  --'
