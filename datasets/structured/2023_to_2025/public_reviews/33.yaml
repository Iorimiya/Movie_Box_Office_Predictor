title: '[問片] 超大型昆蟲或蜘蛛之類的東西'
content: '國小上自然課時播的片，小時候沒看完長大很好奇結局，至少2010年以前的片，內容是主

  角一群人被困在大樓內，外面的世界完全找不到人，只看到四處有超級大隻的昆蟲還是蜘

  蛛之類的東西，如果人被大型昆蟲抓到的話，昆蟲會吐絲把人類包起來變成蛹或繭。他也

  有可能是某個系列電影的其中一集也不一定，只要有類似劇情的電影名稱都可以說一下，

  我找了好久都找不到，希望大家可以幫幫忙的，感謝...


  --'
