url: https://www.ptt.cc/bbs/movie/M.1473693761.A.08C.html
title: '[討論] 鐵線蟲入侵/流感/屍速列車排名'
content: '這三部片是我唯三看的韓國電影，也都是災難片


  劇情刻劃也是相當細膩，人性描繪相當的扣人心弦


  不得不說韓國災難電影真的好猛...不知道鄉民們心目中排名如何呢


  1.鐵線蟲入侵


  2.流感(帥大叔有演喔)


  3.屍速列車


  4.其他(駭人怪物、恐怖直播)


  個人是1>3>2，鐵線蟲入侵第一次看到真的是超級震撼..後勁十足久久不能自己


  如果沒看過的人可以趁這機會惡補惡補，保證不比屍速列車差


  --

  個人覺得總統的掙扎是亮點

  鐵線蟲是題材新穎...大財團的刻畫也是社會寫照...黑啊!

  漢江怪物跟駭人怪物一樣嗎

  流感小妹妹>>屍速小妹妹XD

  應該說跟官員間的戲份拉，小心不要暴雷!

  個人覺得三部都蠻緊張的XD

  恩...這三部 鐵線蟲是我覺得最貼近現實面的災難片

  幫QQ넛[33s

  1;37m推  09/12 23:47

  準備打碼了說'
