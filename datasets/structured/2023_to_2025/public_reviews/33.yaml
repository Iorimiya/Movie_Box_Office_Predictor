url: https://www.ptt.cc/bbs/movie/M.1445609926.A.3AD.html
title: '[新聞] 紅衣小女孩 許瑋甯自虐聞蟲想吐'
content: '（中央社台北23日電）紅衣小女孩是台灣人心中聞之色變的靈異傳說，因此電影自開拍引

  發高度熱議，日前公布電影正式預告及海報，為這個恐怖傳說揭開序幕。


  傳說中紅衣小女孩會迷惑人心智，電影中特別安排一個橋段，讓遭迷惑中邪的黃河品嚐了

  一頓恐怖的蟲蟲大餐，面對滿桌活生生蠕動的蟲，黃河必須吃的津津有味，滿桌濃郁的蟲

  味和土味卻令他崩潰，「最後每次CUT的時候我都是狂嘔，把所有東西吐出來。」


  而和他演對手戲的許瑋甯為了演出真實噁心反應，自告奮勇地去昆蟲大餐桌前狂吸蟲氣，

  「開拍前特地去深吸一口氣後憋著，讓味道停留，到現在想起還是很噁心。」兩人的敬業

  與精湛演技也讓導演程偉豪再度給予高度讚賞。


  電影「紅衣小女孩」取材自真實靈異事件，17年來這個扎根於台灣人心中的恐怖傳說，讓

  觀眾更加好奇。


  傳說中紅衣小女孩的習性就是抓交替，還喜歡惡作劇，讓失蹤者吃下樹葉昆蟲等食物而渾

  然不覺，而電影「紅衣小女孩」也安排了類似的橋段，讓男主角黃河品嚐了一頓恐怖的蟲

  蟲大餐。


  對於這場戲，導演程偉豪對黃河表現給予高度讚賞，表示「這場戲他真的很辛苦，雖然他

  吃的是假的道具但所有真實的那些包括蛆、麵包蟲 蚯蚓、等等，都是實際在他面前的，

  他要從活生生的蟲旁邊夾起道具蟲放進嘴裡，還要裝作一副吃的津津有味的樣子。」儘管

  一共拍了十多次，黃河還是敬業地邊吐邊吃將它拍完。


  然而，另一個蟲蟲大餐受害者則是對手戲的許瑋甯，想起那場戲她回憶道：「一整天廚房

  都超臭，都是餿掉、腐敗的味道。」那場戲許瑋甯必須演出被驚嚇且噁心想吐的表情，為

  了這場戲她表示簡直是豁出去了，「為了讓自己可以即時演出噁心的感覺，開拍前特地去

  深吸一口氣後，走到旁邊去憋著，讓味道整個停留很久，到現在想起還是很噁心。」


  「紅衣小女孩」電影描述阿偉（黃河 飾）是一個房地產經紀人，與奶奶（劉引商 飾）相

  依為命，每天超時工作賣房子，夢想早日與女友ＤＪ怡君（許瑋甯飾）結婚。有一天，奶

  奶卻離奇失蹤了，詭異的是，家裡打掃過了衣服也洗好了，還替阿偉煮了早餐，但就是不

  見奶奶的蹤影，當奶奶終於尋獲時卻換阿偉失蹤了。


  怡君發現這一切的謎團，都和流傳多時的異傳說「紅衣小女孩」有關。為了尋找男友，怡

  君與搜救隊前往山林，卻發現了最恐怖的真相。


  新聞網址：


  --'
