url: https://www.ptt.cc/bbs/movie/M.1687512912.A.14C.html
title: '[新聞] 閃電俠票房跌破華納眼鏡 藍甲蟲水行俠2'
content: 'DC宇宙集結的《閃電俠》票房跌破華納眼鏡，接下來《藍甲蟲》、《水行俠2》還要比慘

  ？



  今年發行四部漫改片，《》虧損已成定局，《》甚至虧得更多

  。


  而接下來的《》與《》定於8月及12月上映，恐怕也只能「」，就算

  是有奇蹟發生，也無法填補前兩部電影造成的巨大虧空。


  《》全球票房僅1.33億美元，《》只拿到5500萬美元北美首週票房

  ，這種體量的影片要達到1.2億美元首週成績才算正常，更別提迄今只拿到1.357億美元全

  球票房，堪稱災難。


  由於主演因法律糾紛與行為不當指控無法拋頭露面參與影片宣發，為扭轉困境

  華納在NBA總決賽期間花巨資投放廣告，動員各方人馬大力宣傳，從DC新掌門人

  到華納大老闆均將該片稱為最好的超級英雄電影。




  DC與漫威或許都漸漸發現自己面臨一個困境：觀眾似乎對所謂「」的電影不感興趣

  了。


  漫威今年以來推出的超級英雄電影票房與口碑都遠遠不及「」輝煌時期的氣勢

  。


  漫威影集的內容似乎也不再吸引觀眾。


  而華納這邊問題更大，觀眾似乎也懶得費腦子回憶過去的影片與角色。


  與DC宇宙扯不上關係的《》與《》獨立故事影片分別獲得9600萬美元與1.34億

  美元首週票房，而《》所埋設的梗與彩蛋之密集，要求觀影者熟知近20年來華納每

  一部相關影片。


  好在《》是初登銀幕的DC宇宙元老級角色，觀影門檻較低。


  但是為舊DC宇宙劃上句號的《》就沒那份運氣了，很難說有多少粉絲會對這部未

  上映便過氣的續作感興趣。




  第三方分析機構估計華納已為今年這四部影片投入11至12億美元製作及宣發費用，讓人最

  難受的地方在於這四部影片其實與DC未來十年關係不大，但公司仍要裝出很努力的樣子推

  廣它們，畢竟大把鈔票已經砸進去了，就看觀眾是否有耐心在電影院裡花兩個多小時觀賞

  這些已經「」的角色。



  新聞網址：




  --'
