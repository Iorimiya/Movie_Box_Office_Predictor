title: '[新聞] 布蘭登費雪加入《蝙蝠女孩》飾演螢火蟲'
content: '新聞網址：


  布蘭登費雪繼《末日巡邏隊》後再接 DC 宇宙新片！加入《蝙蝠女孩》電影擔綱大反派


  近日不斷有選角消息傳出的 DC 電影《蝙蝠女孩》（Bat Girl）今日再有新卡司加入，繼

  女主角「芭芭拉高登」確定由拉丁歌手萊絲莉葛蕾絲（Leslie Grace）出任、J.K. 西蒙

  斯（J.K. Simmons）確定回歸飾演高登局長後，有望成為此片反派的布蘭登費雪（Brenda

  n Fraser）也傳將進組。


  據《Deadline》獨家報導，布蘭登費雪很可能將在《蝙蝠女孩》裡飾演 DC 反派「螢火蟲

  」。若消息屬實，這會是費雪近年出演的第二部 DC 作品，因為費雪同時也是 DC 影集《

  末日巡邏隊》（Doom Patrol）的固定班底，他在該劇飾演「機甲人」克里夫。




  《蝙蝠女孩》由《絕地戰警 FOR LIFE》（Bad Boys for Life）導演檔阿迪爾艾爾阿比（

  Adil El Arbi）、畢拉爾法拉（Bilall Fallah）執導，《：小丑女大解放》（B

  irds of Prey (and the Fantabulous Emancipation of One Harley Quinn)）編劇克莉

  絲汀哈德森（Christina Hodson）執筆劇本，《時尚惡女：庫伊拉》（Cruella）製片克

  莉絲汀柏爾（Kristin Burr）則擔綱監製。


  此外，與導演檔合作過《絕地戰警 FOR LIFE》的英國男星雅各布西皮奧（Jacob Scipio

  ）前陣子也加入了演出陣容。本片預計於 HBO Max 獨家上線。


  //


  除了J.K. 西蒙斯外，導演先前受訪也證實電影裡會有蝙蝠俠，但電影公司還沒批准他們

  公佈是哪一個演員的版本。只能保證他是「真正的」蝙蝠俠。




  --'
