url: https://www.ptt.cc/bbs/movie/M.1473695900.A.3AB.html
title: 'Re: [討論] 鐵線蟲入侵/流感/屍速列車排名'
content: "屍速 鐵線蟲 流感 剛好都有看過 各有優劣\n\n1.屍速 雖然疾病的機制 原因都不是很清楚(雖然不是很重要)\n\n       但跟著主角群們一起前進車廂\
  \ 很有臨場感 會替他們緊張 殭屍海也很有趣\n\n\n2.流感 其實我焦點就放在小羅莉身上 超會演 最後跑出來超催淚的\n\n       劇情其實就還好\n\
  \n3.鐵線蟲 真的覺得拍很好 不管是政府處理態度還有流程 如警察>疾管局>衛生署>\n\n         中央 然後醫院如何處理等等 都很真實\n\n  \
  \       讓觀賞者有恐慌感   也清楚講了一些機制 原因等等\n\n         只是結局有點草率就是了 看完都很怕自己口渴XD\n\n評價跟原PO一樣\
  \ 也是 鐵線蟲>屍速>流感\n\n說真的台灣也不是沒題材 拍個SARS災難片應該不難 但不要拍成白色巨塔就好\n\n--"
