url: https://www.ptt.cc/bbs/movie/M.1527154743.A.A20.html
title: '[新聞] 台灣螢火蟲復育紀錄片 獲休士頓影展金獎'
content: '台灣螢火蟲復育紀錄片 獲休士頓影展金獎



  紀錄片影片截圖。 (影片截圖)


  【大紀元2018年05月24日訊】（大紀元記者張原彰台北報導）台灣之光！台灣的螢火蟲復

  育紀錄片「點亮台灣之光，螢火蟲飛吧」贏得2018休士頓國際影展最佳生態紀錄片金獎，

  全世界都看見台灣保育螢火蟲的努力，同時讓保育人員獲得全球肯定。


  「點亮台灣之光，螢火蟲飛吧」由「MIT台灣誌」導演麥覺明所拍攝，大安森林公園之友

  基金會經費贊助，影片內容記錄大安森林公園2012開始復育螢火蟲，至2017年間的完整心

  路歷程。


  當第一隻螢火蟲於2016年出現在大安森林公園時，讓螢火蟲團隊興奮不已，教授楊平世表

  示，曾經居住在大安森林公園原址的眷村的朋友，聽聞螢火蟲回到大安森林公園時，好奇

  又高興地帶領著全家人一起來生態池賞螢，在月光下回想過去螢光飛舞的記憶，令工作團

  隊受到極大鼓舞。


  大安森林公園之友基金會表示，螢火蟲是生態重要的指標，對環境是非常挑剔的，「這大

  大地鼓舞了我們，也驅使著我們為下一代的自然永續貢獻心力。」


  北市工務局公園處表示，這場公園生態復育計劃以螢火蟲作為號召，螢火蟲的出現意味著

  現場環境具備乾淨的水流、沒有強烈燈光的干擾、具不同型態的水生植物供其休息等條件

  。螢火蟲逐漸回歸公園，象徵著台北市朝向公園生態化的目標踏出重要的一步。◇#


  觀看完整影片




  --'
