url: https://www.ptt.cc/bbs/movie/M.1725662005.A.B1D.html
title: '[普雷] 陰間大法師2：工具人甲蟲汁'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  我來到外國之後才發現外國人超愛陰間大法師


  特別是那首大家一起跳Day-O 一幕


  所以我被我外國朋友拖去看


  簡單來說，喜歡第一部的可以去回顧一下


  但沒看過一的可能會覺得很浪費時間



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  故事發生在第一部之後36年，少女莉蒂亞已經長大成為青少女的母親


  並且在主持陰陽眼的節目，有一個渣男治療師男友


  後媽德莉雅還是一樣在當藝術家，與莉蒂亞的關係已經變得很好


  莉蒂亞女兒艾斯卓就跟當年的她一樣在叛逆期


  故事在莉蒂亞爸爸遇到空難結果被鯊魚咬死，大家回去冬湖的舊家舉行葬禮開始


  （父親之死僅以動畫帶過）



  除了莉蒂亞在陽間出現變化以外，陰間的世界也出現變化


  突然蹦出一個甲蟲汁大師的前妻、一個有吸魂能力的厲鬼桃樂絲要來找甲蟲汁


  除此之外，艾斯卓意外邂逅鬼男孩傑洛米，被騙去交換生死


  所以莉蒂亞為了救女兒重新召喚甲蟲汁大師並答應跟他結婚


  以上就是本部適合用邏輯思考的段落


  之後就是瘋狂的地獄世界腦洞大開


  只是故事演到最後，超邪惡傑洛米被甲蟲汁大師拉個拉桿被打入地獄


  甲蟲汁的前妻追到甲蟲汁大師，然後跟著莉蒂亞的渣男男友被土星衛星怪蟲吞掉（第一季梗


  然後莉蒂亞就唸三次甲蟲汁的名字把他炸了（沒印象第一部有唸三次甲蟲汁會爆炸的設定



  其實這部本來就是無厘頭風格


  所以故事劇情邏輯大家也不會太在意


  只是設定了好多新角色，結果要不是對劇情影響甚微就是收得很隨便


  不過我其實還是有點同情甲蟲汁大師就是了


  他上一次幫忙救麥迪蘭夫婦、這次明明就幫莉蒂亞救回女兒


  結果莉蒂亞反悔不嫁就算了，還把人給炸了


  真是沒良心極致


  甲蟲汁大師整個工具人化



  這部戲告訴我們，噁男還是不要去碰蘿莉


  就算蘿莉變大嬸她還是不會嫁你的

  -----

  Sent from JPTT on my iPhone


  --'
