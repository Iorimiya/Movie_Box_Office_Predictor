title: '[片單] 以叢草為林、蟲蟻為獸的推薦動畫'
content: '1. 請描述欲尋找電影的類型或特徵（請盡量描述清楚）


  最近在上〈兒時記趣〉一課，但現在學生普遍比較缺乏這部分的童年經驗

  特別是「以叢草為林、蟲蟻為獸」，

  或是描寫癩蝦蟆時運用了「拔山倒樹而來」的句子，

  因此想剪一些五分鐘內的動畫片段給學生看。


  2. 已知符合需求的電影或偏好的電影類型（為避免重複推文，請至少列舉一部）


  印象中滿多動畫片以昆蟲為題材，但我目前真的是想不到QQ

  只記得前幾年有部上映的動畫是有個小男孩平常欺負螞蟻，

  後來忘記是何原因變小了，於是也慘遭螞蟻欺負。

  只要是從昆蟲視角來拍的動畫電影都可以~



  3. 不喜歡的電影類型            （不需要板友推薦的電影，可填刺陵）


  請以老少咸宜的動畫為主，在此先感謝各位板友~~~


  --

  這兩個我有嘗試在水管找但找不太到，大概要去租了XD

  飛天巨桃感覺很可愛~~~~

  剛剛在搜尋前者的時候還找到了〈昆蟲LIFE秀〉，看來也是很厲害

  推  06/04 10:58

  實在非常感謝推文的板友~我會一部一部找來看

  大家記憶力真的超好的!!!!

  對！！！就是它！你好厲害喔

  居然是2006的片了，時間也過太快了吧

  感謝板友推薦！'
