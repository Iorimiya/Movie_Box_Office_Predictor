url: https://www.ptt.cc/bbs/movie/M.1738635752.A.BDB.html
title: '[新聞] DC英雄《藍甲蟲》預計明年推出新作！'
content: '新聞網址：



  Joker 2025-02-04 09:30:41




  ，但 DC 影業總裁-詹姆士岡恩（James Gunn

  ）早就保證《藍甲蟲》會納入新 DC 宇宙，找回原班卡司配音的動畫影集也在製作中，基

  本上不怕未來沒《藍甲蟲》的續作可看。而飾演藍甲蟲「海梅」的索洛馬里達納（Xolo

  Maridueña），最近接受《The Direct》時也透露了動畫影集大約何時問世。




  至於真人演出方面，馬里達納則不清楚他下次會是何

  時登場：「聽著，他（意指岡恩）正在廚房裡忙著燒菜，而我不想走進廚房打擾正在忙碌

  的大廚，一旦他們先把開胃菜、、主菜、甜點都上齊了，我就準備好回歸了。」



  馬里達納也回應了某些網友總是喜歡質疑岡恩說謊的現象：「我沒有理由去相信他在撒謊

  ，我們都是成人了，大家都能暢所欲言（笑）。我們只是很高興我拍了第一集，然後正當

  第二集在起草劇本的時候，繼續推廣它。」



  --'
