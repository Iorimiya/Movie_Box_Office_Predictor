title: '[新聞] 威爾勾李安鬥蟲蟲 戴蚊帳帽超呆萌'
content: '新聞網址：


  威爾勾李安鬥蟲蟲 戴蚊帳帽超呆萌


  【林慧娟╱綜合報導】「台灣之光」李安執導的新片《雙子殺手》（Gemini Man，前譯雙

  子男）日前在美國喬治亞州開鏡，男主角威爾史密斯昨在IG上傳他和李安合照，2人戴著

  防蚊罩自拍，他寫道：「新片開工第1周，李安讓我出去對抗野生動物。」


  喬治亞州拍新片

  威爾還po了一段影片，表示：「開拍第一天，我愛喬治亞州，這裡很美，但我得想辦法對

  抗昆蟲，我得戴著這玩意才能走到戶外。」畫面接著拍到密密麻麻的飛蟲，十分嚇人，他

  說噴了各種防蟲液，但蟲蟲還是像聞到蜂蜜一樣黏上來，劇組得盡快設法解決。

  他在《雙》片飾演即將退休的殺手，被迫和複製人──年輕版的自己交手，其他卡司還包

  括克里夫歐文、瑪麗伊莉莎白文斯蒂德，預計明年10月4日在台、美同步上映。


  --

  我是男生，只愛男人。我是純真、開朗的0號男同性戀。希望將來能和彼此相愛的男人結婚


  喜歡和不同國籍、類型的帥哥猛男型男交友約會。已記不得、數不清和多少男人交往過了


  --'
