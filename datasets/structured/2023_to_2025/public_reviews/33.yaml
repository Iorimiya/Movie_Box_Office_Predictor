url: https://www.ptt.cc/bbs/movie/M.1727451273.A.975.html
title: '[討論] 螢火蟲之墓原著'
content: '螢火蟲之墓因為Netflix 上映所以我鼓起勇氣再看一次，年紀變大了看的東西不同了。我

  當然還是最討厭寄人籬下那段，但當然現在的年紀也可以了解阿姨的立場。


  然後剛剛爬文也看到有人拿出三立的新聞寫哥哥虐待妹妹，還附上日本網頁佐證。不過我

  並不覺得他是在消費已逝的妹妹。因為文章有說，直到他第一個女兒出生，看起來瘦瘦小

  小營養不良的樣子，突然想起那位妹妹死前的樣子，彷彿被電到一樣，開始感到愧疚，我

  完全可以體會這樣的心情。


  我在圖書館借了他的那本書，剛剛看完了螢火蟲之墓那一篇，我其實比較衝擊的是這段



  我知道作者只是想表達14歲的少年就是有反應，但因為多了這段描述我還是覺得衝擊。另

  外，因為上週才看完螢火蟲之墓，所以我記得很清楚其實也有畫出清太在洞穴抱著妹妹睡

  覺但妹妹推開說好熱還怎樣的，但把前因刪除了XD



  另外我看到很多新聞說螢火蟲之墓的台灣版海報跟日本版海報不同，日本版上方其實有戰

  鬥機，更具體來說那個黃色一點一點其實不是螢火蟲而是戰火。甚至說台灣版的沒飛機可

  是只要調亮後飛機就出現了，但我剛剛用photoshop調亮也沒看到也，是新都市傳說嗎？


  最後，雖然實際原版故事沒有電影這麼美好的兄妹情，但想到節子一顰一笑，即便過了一

  週還是讓人想哭呢！




  --'
