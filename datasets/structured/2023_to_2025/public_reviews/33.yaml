url: https://www.ptt.cc/bbs/movie/M.1709989301.A.60E.html
title: 'Re: [請益] 問沙蟲一個設定問題（有沙丘二雷）'
content: '今天去看第二集了


  也想知道每隻長成超巨大沙蟲們


  小沙蟲時是不是都被佛瑞曼強迫灌水灌到吐


  為了取得藍色的生命之水


  然後長大不可愛了被放生


