title: '[好雷]《寄生上流》大雨過後，蟲子就出來了'
content: '起初注意到這部電影並不是因為口碑，而是因為導演奉俊昊正是《玉子》的導演。當初看

  完《玉子》心情十分沈重，這次看完《寄生上流》也是。玉子被成功贖回，但圍欄中的豬

  隻的命運依舊不變；金家人的生活彷彿有了改變，但階級的壓力仍無法翻轉。電影演出現

  況、帶出可能的機會，卻又硬生生把你帶回現實，大概既是這種的無力感。









  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~








  《寄生上流》原來的片名是 Parasite，直接將主角一家的行為喻為寄生蟲，也呼應了他們

  在黑暗中求生、如蟲子般逃竄的荒誕模樣。電影前半段以喜劇的方式把金家人一個個安排

  到朴家，儘管我不太認同換掉司機和前管家的念頭，甚至覺得對付後者的手段有些惡劣，

  但快節奏的安排還是讓觀眾滿沈浸在這家人合作無間的計畫中。



  前管家以及她藏在地下室的老公的出現，打亂了金家人在客廳妄想的美好未來。當前管家

  不斷向金媽求饒時，我還天真以為金媽會念在他們與自己的處境相似網開一面，畢竟前管

  家並不知道自己是被「弄」走的。但事實並非如此，或許是為了一保自己的地位，起初金

  媽報警的意味濃厚，直到豬隊友們摔下樓梯被錄影存證，情勢又有了轉變。



  看著兩組人馬在客廳開搶，說來可笑卻也諷刺，因為他們求的就只是得以繼續寄生的環境

  ，誰比較有理、誰比較值得留下，在朴媽的一通電話之後，蟲子依舊得四處逃竄，把這個

  美好的環境還給別人。










  這一晚，在兩聲鈴響，金家人從虛幻的天堂被打回原屬的角落。在客廳假裝有錢人的生活

  ，在門鈴聲響後身份被識破，在電話聲響後除了金媽之外的三人在大雨中逃回家裡，從上

  坡一路往下走，就像是從階級頂端滑落，在那已淹水卻名為「家」的地下室，彷彿狠狠打

  了金家人一巴掌，譏笑著，醒醒吧！這裡才是你的歸屬。



  大雨過後，蟲子就出來了。生日派對上所發生的一切，對朴家來說應該是莫名其妙，朴爸

  的遭遇或許會被解讀為「遇到瘋子」，但這一刀劃下的不只是個人的不幸，而是在長期在

  陰暗角落隱忍已久的壓抑與自卑。當金基宇拿著那象徵財富與地位的石頭往下走，我不確

  定這時的金基宇是不是真的起了邪念，但可以確定的是那顆石頭沒有帶來財富，某種程度

  上把他給打醒了（誤）。



  「我要賺很多錢，買下那間房子，而爸爸你只要走上來就好了。」儘管沒有人知道金基宇

  會不會如願，但至少這次，他對自己的人生有了計劃。



  《寄生上流》最耐人尋味的是那句「有錢所以善良」。如果我有錢，我一樣也會這麼善良

  。然而，當金家人得到高薪的工作、地位稍稍抬升時，他們卻是無法接受寄生地下室的前

  管家與其先生。不是光明正大得來的財富，只能靠更不光明正大的手段來死守，再有錢，

  也不代表會有更多的良知。





  --'
