url: https://www.ptt.cc/bbs/movie/M.1614148547.A.A36.html
title: '[新聞] DC首位拉丁英雄《藍甲蟲》導演：創造歷史'
content: 'DC將推出首部拉丁裔主角超英電影《藍甲蟲》 導演：等不及要一起創造歷史！




  華納將推出DC超級英雄「藍甲蟲」的個人電影，最新確認導演人選—將由執導去年日舞影

  展好評新片《街頭飆車王》的安傑爾曼努埃爾索托負責，有望於今年秋天開拍。




  該片將是首部拉丁裔為主角的DC超英大片，由Gareth Dunnet-Alcocer（《選美小姐》、

  新版《疤面煞星》）編劇，Zev Foreman擔任執行製片人。聚焦第三代藍甲蟲海梅雷耶斯

  ，他是一個生活在德州的墨西哥裔青少年，因撿到一隻藍色聖甲蟲並將其移植到自己的脊

  椎裡，成為擁有外形盔甲、可以隨意創造武器的超級英雄。藍甲蟲可以飛行，擁有增強的

  力量和耐力，並能夠翻譯外星語言。




  導演索托對此項消息也發佈聲明：「很榮幸能執導DC的第一部拉丁裔超級英雄電影《藍甲

  蟲》。我要衷心感謝華納兄弟和華盛頓特區的每個人，相信我能將海梅雷耶斯帶入生活之

  中。我等不及要一起創造歷史了。」







  --'
