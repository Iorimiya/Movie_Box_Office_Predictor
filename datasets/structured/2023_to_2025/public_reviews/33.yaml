url: https://www.ptt.cc/bbs/movie/M.1508345771.A.510.html
title: '[新聞] 【腥聞風暴+1】淫蟲逼《權力遊戲》女星開'
content: '新聞網址：


  【腥聞風暴+1】淫蟲逼《權力遊戲》女星開房　門卡失靈脫逃


  (新增動新聞)

  好萊塢金牌製片哈維韋斯坦的性騷擾醜聞爆發2星期，幾乎每天都有女星、業界女性出面

  控訴他的惡行惡狀，估計超過50人受害，今天則是美劇《冰與火之歌：權力遊戲》（

  Game of Thrones）女星蓮娜海蒂（Lena Headey）指控哈維韋斯坦曾兩度向她伸出魔爪。

  蓮娜海蒂透過推特公開多年的祕密，2005年威尼斯影展時，她已是哈維韋斯坦眼中的獵物

  ，「當時為《神鬼剋星》（The Brothers Grimm）出席首映禮，哈維要求我陪他到海邊，

  其間更有暗示性的話語和動作」，當下她大笑應付，但著實震驚，心想這一定是個玩笑，

  此後再也沒有參演哈維創辦Miramax電影公司的作品；另外她也自曝當時受到《神》片導

  演泰瑞吉連（Terry Gilliam）無止盡的霸凌。


  多年後，蓮娜海蒂在洛杉磯再次遇到哈維，「他邀請我吃早餐，談到電影和拍片事宜，他

  問我感情狀況，我趕緊轉移話題」，哈維以交付劇本為由，提議一起上樓到房間。蓮娜在

  電梯裡表明除工作以外的任何事毫無興趣，「請不要以為我是另有目的，什麼事也不會發

  生」，對方沉默以對。


  兩人出了電梯，哈維把手放在蓮娜海蒂背上，推她走向房門，不過當他發現房門磁卡開不

  了瞬間爆氣，隨後再與她搭乘電梯到停車場，付了停車費，緊緊抓著她的手臂，並在耳邊

  低語「這件事不要告訴任何人，包括經紀人和經紀公司」，直到上車她才放聲大哭。（娛

  樂中心／綜合報導）


  --


  我是男生，只愛男人。我是0號，希望真愛是溫柔體貼、體毛豐盛，身材高壯的1號好男人


  喜歡和不同國籍、類型的帥哥猛男型男交友約會。已記不得、數不清和多少男人交往過了


  --'
