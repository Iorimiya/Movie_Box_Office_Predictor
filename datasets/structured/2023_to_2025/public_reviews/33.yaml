url: https://www.ptt.cc/bbs/movie/M.1658023417.A.CFF.html
title: '[好雷] 螢火蟲之墓 軍國主義下的悲劇'
content: '上票根


  雖然是老片 但為了防止正義魔人

  設防雷頁
































  這部其實也不用討論什麼

  在版上戰過好幾回

  就是很兩極化的作品

  有人說阿姨太現實

  又有人說清太白目

  身為妹控還把妹妹玩死

  我自己認為 雙方都要退一步

  仔細想想阿姨跟清太兩人的立場


  1. 阿姨家 典型的工人世家 普通老百姓

  軍國主義下的底層階級

  洗腦之下 認為每個人都該貢獻自己的一份力 有勞動才能吃好飯 現實人

  開始清太有柴魚 酸梅 麵包等稀有資源

  才好心招待 等到清太沒利用價值

  加上不付出勞動成果 就鄙視他


  這部分就是為啥幼時跟成年觀看時

  感觀會差異如此巨大的主要原因

  因為長大才知道 有付出才有收穫的硬道理


  2. 清太家 軍人世家

  既使老爸只是個重巡摩耶號大尉

  但過的還是比老百姓好

  物資優先配給 戰時大家為了食物發愁

  還有閒情逸致去海邊玩水

  吃白米 吃涼麵

  （白米在二戰算是稀有物資 一般人都是吃糙米）

  老百姓的屍體一眼都不削瞧

  沒啥悲天憫人的性格

  講難聽點清太就是位養尊處優的大少爺

  沒謀生能力 寧願偷東西也不去勞動

  唐吉訶德式的無能幻想

  在美軍轟炸的時候 邊偷邊喊炸的好

  暗示自己發戰爭財

  根本不關心自己國家打不打的贏戰爭


  再分析一下時間線

  清太領出媽媽剩下的三千元大概是8/15日本投降日

  正是節子過世的時間點

  而清太是9/21 營養不良死於三之宮站

  那時的三千元可是一筆大數字

  (1943年蕎麥麵+咖啡大概10錢

  100錢等於1日元

  就算1945年物資匱乏 3000元還是很好過)

  就算幫節子置辦棺材

  也還會剩下很多錢 而不到一個半月

  就身無分文死在車站

  再說這三千元早早領出來

  不知道可以買幾百頓好吃的

  節子也不會死

  甚至清太連營養補充要買什麼也不知道

  代表清太對金錢跟食物的優先權拿捏真的是很糟糕.......


  現實上 原作者野坂昭如

  自己也沒照顧好妹妹

  跟她搶大豆渣吃 導致妹妹餓死

  野坂寫下這部作品 是為了向妹妹贖罪

  也從來沒看過動畫版


  高畑有提到 這部不是反戰電影

  也不是支持軍國主義 把日本刻劃成受害者的情勒電影

  “主要想藉由故事中清太與節子

  脫離社會群體

  想以僅僅兩人來建立一個家庭生活的行為

  來影射出社會上的一些現象

  特別是一些二十多歲的年輕人們”


  用寫實主義 直白描述平民跟軍人階級的戰時生活 當代每位日本人的悲劇

  二戰時期身為戰爭的發動國

  相信除了被軍國主義洗腦的人以外

  沒有任何日本人願意回想那難堪的回憶

  在那時代的百姓 沒有什麼好人壞人

  只有為了生存而處處掙扎的一般人

  最後清太的死 代表軍國主義的結束

  坐在椅子看著神戶現代夜景

  提醒著現在的人 珍惜和平

  但願軍國主義別再復辟 荼毒百姓


  -----

  Sent from JPTT on my Google Pixel 4a.


