url: https://www.ptt.cc/bbs/movie/M.1707406324.A.A1B.html
title: '[新聞] 艾瑪史東玩膩情慾遊戲 改當書蟲'
content: "艾瑪史東玩膩情慾遊戲 改當書蟲\n\n2024/02/08 05:30\n\n\n影后艾瑪史東在《可憐的東西》再展精湛演技，有望再獲奧斯卡肯定。\n\
  （探照燈影業提供）\n\n〔記者許世穎／綜合報導〕影后艾瑪史東再度問鼎奧斯卡的新作《可憐的東西》，堪稱今\n年春節最另類賀歲片，她在片中和馬克魯法洛「日也操、暝也操」，沒想到玩膩後竟然開\n\
  始思考人生，還改當書蟲，甚至叫他別擋太陽「閃邊去」。\n\n片中充滿大膽激情的情慾場面，以及各種顛覆三觀的超展開情節，但其實也有溫馨的心靈\n啟發片段，搭配奇幻世界目不暇給的華麗視覺饗宴，令人大開眼界、盡情大笑又感動落淚\n\
  。\n\n電影在北美上映締造票房紀錄，上週末更成為2023年度全美限量開片最高票房電影，也是\n疫情後僅次於《媽的多重宇宙》第二賣座的限量開片電影，全球票房目前逼近7000萬美金\n\
  （約台幣21.9億元）。《可憐的東西》今天一刀未剪、尺度全開在台上映。\n\n--\n佛法\n 是菩薩成佛之道\n        是 佛經\n  是 佛   \
  \     是 菩薩\n\n\n\n--"
