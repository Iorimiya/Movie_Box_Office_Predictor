  就自動被扣五毛帽子囉


  好可怕喔 嘻嘻


  皇民邏輯


  不舔日= 你舔中 你哈韓


  可憐啊 台灣就是一堆你們這種日本奴


  難怪日本看不起台灣 笑死

  -----

  Sent from JPTT on my iPhone


  --

  賤啊

  懶得幫皇民們上課 智商差距太大'
