url: https://www.ptt.cc/bbs/movie/M.1692789924.A.206.html
title: '[好雷] 藍甲蟲'
content: '時間8/24 pm1:25

  地點高雄大遠百4DX票價499元


  先說結論

  並不像黑豹系列強調種族正確

  雖是拉丁裔演員有演到位

  強調家庭成員

  美國白人應該不愛看

  海外市場收入應該不差

  尤其4dx有按摩和噴水

  上天下海真的有臨場感

  五百沒白花因為趕行程

  最後十分鐘沒看

  覺得五百太貴

  至少先看數位版

  怕花太多等二輪片再看


  以下有雷

  雷文防雷資訊頁




  大致內容簡介

  某科倫公司發現來自外星人的聖甲蟲

  一直研究二代以上研究出半成品而已

  主角意外認識科倫公司的富家女

  富家女偷自家聖甲蟲一次意外

  主角被聖甲蟲選擇而變身合體

  其他情節類似其他超級英雄

  上天下海無所不能ai幫手

  但是融入家庭元素不是單幹俠

  富家女的爸爸留下一堆高科技工具

  而他的姑姑想要篡奪公司奪聖甲蟲

  比較好笑的最強奶奶拿機關槍掃射

  因為出身亂邦瓜地馬拉又是美國搞鬼

  從小練出游擊戰

  連壞人配角也是受害者

  最後一幕主角要下手殺

  蟲ai開壞人小時候回憶影片

  壞人小時候母親被飛機轟炸死

  這種違背美國第一的多元思想

  在愛國思潮一定不賣尤其是拉丁裔

  劇情緊張和搞笑配比合宜

  雖然沒有大卡司演員

  值得一看DC的超人我看到睡

  這片保證一定不睡一片到底

  我也想搞一隻聖甲蟲玩玩



  ----

  Sent from  on my Realme RMX3241


  --'
