title: '[負無雷]  夢回15年前的藍甲蟲'
content: '這是一部用三句話就可以講完的電影...


  雖然不會提及劇情，但為了怕有人覺得被雷到，


  還是放個防雷警示好了。



  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  1. 主角無意間拿到反派公司的重要物品


  2. 反派公司派出BOSS前來搶奪


  3. 主角擊敗BOSS抱得美人歸


  === THE END ===



  對，就這樣！


  整部電影一切都在觀眾的預料之內，


  更有甚者，很多部分還不如觀影者(至少我和一起收看的同伴)的預期。



  至於標題說到的，夢回15年前，


  因為這部片讓我想起了超級英雄電影的濫觴－鋼鐵人第一集，


  或許有些看過藍甲蟲的朋友會說：「作為英雄起源的首部曲，它應該還行啦！」


  但我真的覺得藍甲蟲還不如15年前上映的鋼鐵人

  (我不是漫威粉也不是貴古迷，DC粉請鞭得小力一些)，



  那就從劇情安排、正反派塑造和配角效果等幾個基本的要素來聊聊，


  1. 劇情安排：

  和大部分超英電影的劇情安排

  不能說是差不多，只能說是一模一樣...


  如同前面所提到的，

  觀賞過程中完全可以預測下一段的劇情，

  甚至是反派第一次露面，我就知道最後會是跟誰、以及如何決戰了。


  這感覺就很像是近幾年育碧各種模板化的開放世界遊戲一樣，

  你要說它爛嘛，也還不到那種程度，

  但就是完全沒有任何期待與驚喜的成份...



  2. 正反派塑造：

  不管是哪一方的刻劃都不夠深刻，特別是反派，

  女BOSS的氣場、戲份和退場方式，

  都沒有主要敵人該有的規格！


  戰鬥過程也沒有帶給觀眾任何緊張感、危機感，

  然後因為主角塑造得也不夠立體，

  所以最後勝利的喜悅也無法讓觀眾感同身受，


  而最為主要元素的「藍甲蟲」本身也幾乎沒有帶到。


  (只好努力說服自己：好吧，是首部曲)



  3. 配角效果：

  只能說，有幾個配角才是超級英雄吧...

  他懂的東西也太多了吧！

  (雖然好像每部電影都有類似的配角)


  大概除了阿嬤好棒棒之外，

  其他角色都是為了營造墨西哥家庭團結的氛圍吧。


  此外，最後那個沒來由的鄰居大集結是...！？

  (好吧，這可能也是墨西哥文化的一環)


  哦對！女主角蠻好看也蠻耐看的，哈哈



  4. 電影特效：

  就中規中矩吧！

  這年頭超英電影如果連特效都不及格，那真的也不用看了...


  不過至少沒有閃電俠那種詭異的嬰兒、時空扭曲等特效值得挑出來嫌的。



  以上。


  ==========


  本來只是想簡單聊聊，以免大家踩雷，

  沒想到講著講著就打了不少篇幅，


  花在打這篇的心力應該比看電影時需要動到的腦力還多lol


  以上是今晚收看的心得，提供給大家參考，

  也歡迎看過的夥伴一同討論囉！

  -----

  Sent from JPTT on my iPhone


  --


  真的嗎？是哪個部分？看來不是只有我這麼想XD



  其實藍甲蟲有蠻多部超英電影的影子耶！


  可惜的是沒有抓到各別的優點，縫合得有點普普通通



  確實！經典難以超越，


  不過我沒有預期他會超越，只是覺得都過了那麼多年，


  沒有延伸出一些新的要素、風格有點可惜，


  至少前陣子的閃電俠我覺得很不錯呢！所以這次有點小失望'
