url: https://www.ptt.cc/bbs/movie/M.1505385297.A.94C.html
title: '[新聞]修女半夜中邪全身蠕動  下體噴蟲 '
content: '新聞網址：


  修女半夜中邪全身蠕動　室友掀被驚見「下體噴蟲」嚇慘


  2017年09月13日

  ETnews 新聞


  《厲陰宅》、《安娜貝爾》原班團隊新片《刑弒厲》（The Crucifixion）改編自本世紀

  最駭人的真實事件。飾演中邪修女的演員阿妲盧布（Ada Lupu）由當地試鏡脫穎而出，其

  中一場遭惡魔附身後「下體噴蟲」的戲，拍攝時嚇壞劇組人員。


  《刑弒厲》故事來自2005年羅馬尼亞社會刑案，當時神父和4名修女被控在驅魔儀式殺死

  患有精神疾病的修女，經過冗長審訊後皆因謀殺罪而被判刑，但是仍堅稱修女遭惡魔附體

  才驅魔，此新聞震撼全球，這樁懸案在當地靈異傳聞不斷。


  為此，導演哈維爾根斯（Xavier Gens）堅持拉至羅馬尼亞境內實景拍攝，更雇用當地演

  員與當地神父當驅魔顧問。劇組真的找來真實事件中驅魔時使用的祈禱文，未料遭到神父

  警告：「絕對不能使用惡魔的祈禱文，否則將惹禍上身！」


  《刑弒厲》當中，阿妲盧布飾演的修女開始被惡魔纏身後，夜半裡都會在床上不斷地蠕動

  。後來同寢室的修女覺得不對勁掀開棉被後驚呆，她的下體竟然爬滿了密密麻麻的蟲，畫

  面令人怵目驚心。


  談到「下體噴蟲」的演出，阿妲盧布回憶表示：「《刑弒厲》的真實事件是我這一輩的羅

  馬尼亞人，從小就耳聞的靈異故事。片中關於中邪後的表現，絕對都不是空穴來風，所以

  這幾幕我從小就有所想像，演起角色來也特別切身。」


  對此，導演哈維爾根斯對阿妲盧布飾演的修女讚不絕口，「她簡直就是修女和惡魔結合的

  完美化身，身形和眼神都很貌似真實事件中的修女，只要阿妲現身在片場時，劇組工作人

  員都會不寒而慄，現場氣氛相當可怕。」


  此外，《刑弒厲》拍攝場景和驅魔儀式太過真實，導致熟悉這事件的當地演員都感到很害

  怕，再加上拍攝期間遇上狂下暴雨、機器當機等各種事故都接二連三地發生，劇組人員都

  認為有不明力量在阻止拍攝，還好最後還是順利拍完。




  --'
