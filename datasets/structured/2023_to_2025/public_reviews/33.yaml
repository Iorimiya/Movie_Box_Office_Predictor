title: '[請益] 鐵線蟲'
content: '剛看完鐵線蟲有幾個疑點


  吃了藥後鐵線蟲好比精怪遇到莊圓大師，暴斃！


  那些基本上都成蟲了，體型不小，死在腸子裡怎麼排出？

  是腸胃會吸收嗎？還是大號會排出去？


  另外洗澡的時後，或泡溫泉不就接近水源了嗎？鐵線蟲可以從肛門出去吧！

  為什麼一定要逼人當世堅跳海？？



  一直想不通啊　早上才看到地上有螳螂屍體


  --

  在我眼中看來，你不值得擁有那條懶叫


  可惜了那條懶叫


  可謂千里懶常有，而勃樂不常有阿


