  胡八一等人由於之前探險而身上出現會帶來詛咒的印記，據說放在古滇國獻王陵墓中的

  塵珠能解開詛咒，胡八一等人只好深入瘴癘之地。眾人穿過古滇國秘密地下水道，不料遭

  遇千年痋術機關，成千上萬個痋俑倒懸在洞頂；深入叢林，更是不斷遭遇重重考驗。終於

