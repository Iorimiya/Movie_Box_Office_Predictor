url: https://www.ptt.cc/bbs/movie/M.1572000209.A.D91.html
title: '[LIVE] 螢火蟲之墓       東桑洋片19:00'
content: '每次看都想哭的電影T_T

  讓我想吃綜合水果糖果罐的電影T_T


  =========================

  《螢火蟲之墓》改編自野坂昭如的同名小說，1988年由日本吉卜力工作室製作成動畫電影

  ，曾獲得多項電影大賞的肯定。[高畑勳]以細膩而寫實的手法，描述了戰爭的殘酷和手足

  之間的情感，是一部感人肺腑的動畫佳片。

  昭和二十年的那一個夏天－這對兄妹留下了一段感人的故事…

  清太14歲，節子4歲。


  二次大戰快接近尾聲時，由於美軍的猛烈轟炸，讓整個城市毀於一旦，誠田與節子兄妹的

  母親因而重傷不治，家也毀了，兩兄妹只好投靠阿姨，而他們的阿姨原本以為兄妹兩是軍

  眷可以帶來些好處，但戰爭使得物資短缺，因此漸漸的食物開始不夠，兄妹也開始遭到

  阿姨一家人排擠和冷言冷語，逼得他們只好搬出阿姨家。


  兩人來到廢墟住下，白天乞討、晚上則是抓螢火蟲來玩，回憶以前觀看軍艦遊行的愉快過

  往...。而乞討的生活無法支持多久，因為每個人都已是自身難保，不得已之下誠田只好

  用偷的，但此時節子卻病得越來越嚴重，後來竟昏倒了！


  誠田帶著妹妹去看病，卻因為戰爭醫藥短缺，沒有藥可以給妹妹吃，誠田又想到銀行把爸

  媽留下的錢全部提出來，這也才發現日本已經戰敗，身為海軍軍官的爸爸也已戰死，漸漸

  失去生存意志的誠田強打精神買了西瓜回去看妹妹，卻發現妹妹將彈珠當成糖果吃，他趕

  緊餵妹妹吃了點西瓜，但妹妹就這樣.........。


  誠田將妹妹火化，將骨灰裝進她唯一笑著把玩過的糖果盒，自己也慢慢閉上眼睛...。


  --

  推 hope951:有片無槍 片失其用 無片有槍 槍失真我

  → hope951:有片有槍 登峰造極 無片無槍 天下無敵


  --'
