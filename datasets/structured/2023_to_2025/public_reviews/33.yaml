url: https://www.ptt.cc/bbs/movie/M.1549970876.A.5F9.html
title: 銃夢 阿基拉 螢火蟲之墓
content: "年少時看那漫畫銃夢.\n\n 銃夢的廢墟與垃圾城,好像是戰後日本的不知是怎樣的景況.\n\n 也不清楚是怎麼個不再有那景況.\n\n 然而在其他國家的垃圾與生活共處一地.還是存在著的.\n\
  \n 不清楚電影在描述那浴火重生的動力與衝動又是個怎樣的表現.\n\n 文筆不好,只是稍為表達出那感想而已.\n\n 沒看過日本的垃圾城,也或許不存在過.\n\n\
  \ 不過那些活力與衝勁,是肥宅的我難以想像的.\n\n ----------------------------------------------------------------------\n\
  \n 2020/7/14\n\n 應非浴火重生,只是蠅營狗苟.等著新的政治人物規劃新的建設,推掉或翻新舊的痕跡.\n\n 螢火蟲之墓的真面目是\n   那些蟲子般的生命,在戰火肆虐之下,努力的餵飽自己.於是在死前交配期有那光輝.\n\
  \   因為自顧著餵飽自己.所以一些其他的生命可能成為其幼蟲的食物與養分.\n\n   戒嚴與戒嚴時期臨時條款 或許就是因為非常時期的發戰爭財的那些螢火蟲而設立\n\
  \n   螢火蟲做了什麼?就只是做了螢火蟲.\n\n--\n you got it\n 螢火蟲之墓 最早的作品是文學作品\n            本地有翻譯本.\n\
  \            而那本文學作品是好多的故事集結出一本小說的厚度.這是題外話.\n            從譯者的介紹,那作者說是個 \"廢墟黑市\"\
  流派 的小說家\n\n 還是很難想像出 日本的廢墟樣貌.\n 另外還有個文學作品 是另一個小說家的 \"紙之月\"\n            還好不是劇中人,另一種看不到廢墟的走向荒蕪,而非由廢墟走向繁華.\n\
  \n 萌萌噠"
