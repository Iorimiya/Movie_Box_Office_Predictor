url: https://www.ptt.cc/bbs/movie/M.1465806121.A.B01.html
title: '[笑抽筋好雷]特務大臨演之劇毒毛毛蟲'
content: '大家好 又來推薦歪片了!!


  端午假期


  不小心看到了這片


  也許是我笑點低吧!


  看完覺得我的腹肌被訓練過了一輪


  另外可能也因為無聊轉到的 不期不待沒有傷害


  所以倍覺有趣


  看完之後  到板上來找找有沒有共鳴的人


  結果沒有文章!!


  覺得一定要把這個樂趣推薦給所有板友


  就來胡說八道一番


  -----------------------------終於撐快一頁的防雷線--------------------------


  影片的開始


  是激情的性愛畫面


  小弟一度以為看錯影片


  後來畫面一轉  發現竟然是一對情侶在賣場的床墊上嘿咻


  測試床墊嘿咻的好用程度來決定是否購買!!


  主角決定購買床墊後...用著一般人不太會選的方式自行搬運回家


  一路上  扛著走 或是坐公車  甚至去商店買東西床墊暫離身邊

  竟然有人也在床墊上要嘿咻起來!(情趣床墊?)


  一番辛苦帶床墊到家後


  才引出了一個劇情 ----主角有個28年沒見面的弟弟


  畫面再切換成第一人稱視角


  有個很猛的特務(主角弟弟)  狂殺猛追一個壞人


  最後抓到壞人時  逼供方法是注射90秒不說真話就會死掉的毛毛蟲劇毒

  (其實是90秒不打解藥)


  原本不知道為什麼要弄個毛毛蟲劇毒


  後來才知道  這個毒  真的太毒了!


  用劇毒獲得之後會被暗殺的目標會參加一個宴會後 特務準備與會


  畫面又切到  男主角的PARTY  主角此時展現菊花有時候不只能排遺

  放放火箭也是OK DER


  從這邊也引出了男主角的朋友群們  還有他的特異功能!??


  火箭放完以後  主角的朋友告知 有他失散多年的弟弟的消息..還幫他偷到宴會一張入場券

  (有點突然...不過  電影嗎!!放鬆就好)


  想當然耳  主角就去參加宴會了


  理所當然的是主角弟弟要阻止暗殺時  主角突然跑去相認  讓弟弟子彈打偏!!被暗殺的人

  還是中彈外  打歪的子彈還打中一個愛滋病童 (好笑不暴雷)


  順其自然的 主角弟弟就被當成暗殺者通緝了!!


  接下來  主角帶弟弟回家


  一路上就是他們基情四射的搞笑


  小弟認為要親自看  就不做贅敘


  心得~~!


  這影片  諷刺了好幾個名人


  另外  有很多的梗  都是出現兩次以上


  當下笑過了  但是又會用另一個方法呈現出來


  不會覺得因為重覆難笑


  也很有笑點  短短一個半小時的影片


  幾乎讓我從頭笑到尾


  很推薦無腦放鬆去看~~!!


  --'
