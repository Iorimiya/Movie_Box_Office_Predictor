url: https://www.ptt.cc/bbs/movie/M.1692256848.A.18A.html
title: '[負雷] 藍甲蟲'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~










  先說優點

  女主角很正，有色人種也是能挑正妹的



  整部戲讓我很煩燥

  我不知道是不是墨西哥人真的都這樣

  他妹各種白目，不尊重

  看了很煩


  還有前面近似低能的不要打架

  我們談談


  不是不能不殺

  但至少要像片尾一樣完全解除威脅

  雖然說是剛畢業的大學生

  但人家都不斷開槍了要談三小


  後面叔叔蟲機一腳刺穿一個

  奶奶掃射大好評


  男主除了要談判外

  就一直喊“放了我”

  以前的電影電視這樣很常見

  現在要跟上時代了吧

  這只會讓他看起來很弱智



  然後藍甲蟲的背景完全沒帶

  就天外飛仙

  這東西看起來這麼的神鬼傳奇

  加些趣味性吧


  藍甲蟲沒背景

  那主角就該有

  為什麼選上他是不是該帶個敘述

  又不是蝙蝠俠那種紅到不用介紹的

  全世界都知道他死了爸媽



  打鬥除了雙大刀對砍外都很可惜

  兩人抱著纏鬥是最糟的

  既然像綠燈能自由變出武器

  就認真的設計啊

  或是觸手應用強化

  看看鋼鐵蜘蛛裝

  不要只是四隻觸手連打



  我看DC沒救了




  --


  我本來有吐這點

  後來想想就當藍甲蟲讀到記憶轉變

  雖然我覺得沒必要就是了'
