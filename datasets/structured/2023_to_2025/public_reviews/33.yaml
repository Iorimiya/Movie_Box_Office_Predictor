url: https://www.ptt.cc/bbs/movie/M.1555775862.A.D5C.html
title: '[新聞] 奉俊昊坎城入圍新作寄生蟲 宋康昊擔綱'
content: '奉俊昊坎城入圍新作寄生蟲 宋康昊擔綱



  （中央社記者姜遠珍首爾20日專電）南韓著名導演奉俊昊執導的新作「寄生蟲」，入圍第

  72屆法國坎城國際影展競賽單元，寄生蟲由南韓國民影帝宋康昊與李善均等主演，極具話

  題性。


  南韓「東亞日報」報導，奉俊昊是繼2017年的作品「玉子」之後，第2度受邀參加坎城影

  展競賽單元。南韓電影自2016年導演朴贊郁的「小姐」、2017年導演洪尚秀的「之後」、

  奉俊昊的「玉子」、2018年導演李滄東的「燃燒」之後，已連續4年入選坎城影展。


  「寄生蟲」由南韓國民影帝宋康昊、人氣男星李善均等主演，劇情講述一個欠缺經濟來源

  的家庭，全家生活陷入困頓，長子基宇為了準備薪資較高的課後輔導教師的面試機會，走

  進某家豪宅後發生的系列事件。


  另外，南韓導演李元泰的「惡人傳」參加影展非競賽「午夜展映」單元。


  馬東錫、金武烈等主演的「惡人傳」，描述偶然情況下成為連環殺人狂目標，但倖存的黑

  社會頭目，與拼命抓犯人的重案組刑警聯手追捕殺人犯的故事。


  （編輯：廖漢原）1080420



  新聞網址：





  --'
