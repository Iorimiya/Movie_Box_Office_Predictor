url: https://www.ptt.cc/bbs/movie/M.1762966211.A.58D.html
title: '[極好雷] 蟲，失語者的沈默'
content: '原本對這片沒太大興趣


  會去看純粹是因為剛好時間對上


  想說有送海報，又有游安順


  就去看了



  先說結論


  極精彩極好雷

















  一開始反送中的電視畫面


  對映著失語者的鍾翰


  他不會說話


  但什麼都懂，會客家話會看人臉色會台語


  以及在不知道怎麼回答時


  用了自己的優勢，我不會說話微笑就是了


  但這也隱藏了他的陰暗面


  一個人去夜店狂歡，


  瘋狂的扭曲著自己的身體


  沒有任何的目光或是關心


  只需要擺動自己的身體


  在這一刻，他與常人無異


  但劇情急轉直下


  跟著好兄弟為黑社會做事


  無論理由是什麼但還是傷害了別人


  以致最後


  最後的一擊竟然是自己的家……


  因為劇情轉得很快很快又來不及細想


  一攤麵店到都更甚至政治人物的插手


  從慣用的黑衣人砸店再到黑衣人霸桌


  甚至是找未成年的開車衝撞


  這無一例外根本是台灣才會發生的事


  到最後老實人終究要被驅離


  只是這次驅離的不再是萍水相逢的人


  而是自己


  男主角從一開始的渴望再到嫉妒再到兄弟情


  最後愛情兄弟家庭全部都落空


  鍾翰一句台詞都沒有


  但演出了真實的人生


  劉韋辰飾演男主角


  真的有夠會演的


  片長2小時12分卻都不會讓我不耐煩


  只想一直看下去看最後會怎樣的發展


  這片有溫馨有快樂有衝突有愛情


  又夾雜著複雜的政治和反送中


  每每播完反送中，接著就是可口美味的甜點


  其實蠻令人諷刺莞爾一笑


  最後這片應該這禮拜就下檔了


  在電影院看真的很過癮！很好看


  但是票房應該是真的慘淡


  沒什麼宣傳又扯到政治加上他的電影名稱


  相當的冷門


  但是真的很好看！趁還沒下檔可以把握


  -----

  Sent from JPTT on my iPhone


  --'
