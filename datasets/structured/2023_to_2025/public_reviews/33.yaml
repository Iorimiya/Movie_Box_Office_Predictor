url: https://www.ptt.cc/bbs/movie/M.1692693492.A.F6C.html
title: '[好雷]末路明花《藍甲蟲》／《Blue Beetle》 '
content: '末路明花《藍甲蟲》／《Blue Beetle》


  圖文好讀：


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  如果之前的DC作品都這麼拍，那就算沒辦法像隔壁棚一樣賺得盆滿缽滿，至少在粉絲心中

  還能有些回饋與情懷。


  至少對我來說，看到海梅跟卡吉塔互相嘴砲我就很滿意了。


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  【DC的”首任”藍甲蟲】


  這次的《藍甲蟲》電影主角海梅雷耶斯是最廣泛意義上被漫畫與DC迷們所認識的藍甲蟲，

  除了因為他在泰坦中的活躍表現外，另一大重點則是因為海梅是實質意義上DC的第一位藍

  甲蟲，而他的兩位前輩丹·加勒特與泰德·科德的故事雖然都非常輝煌，但都沒能在一開

  始就加入DC的故事中，泰德·科德甚至沒能被卡吉塔選中，可說是最慘藍甲蟲了。


  劇情主要圍繞在海梅首次接觸到聖甲蟲以及與家人間的深厚羈絆，這次電影很聰明的將海

  梅與其家人的背景稍作修改，除了主角海梅從高中生變成大學生外，妹妹米拉格羅也從小

  孩子一舉抽高為青少年，家人的比重也大幅加重，除了把奶奶變成帥氣的荒野大鏢客外，

  也透過海梅與父親的交流，巧妙地融入了墨西哥對於亡者的尊重與慶賀元素，在我看來，

  文戲部分除了某些橋段較為矯情外，幾乎可算是可圈可點，無論在情感面與情懷面，都顧

  及得宜。




  【沒借鑑不義聯盟我死都不信】


  這次藍甲蟲流線體的造型與光害十足的效果我個人是挺買單的，要說沒被最後那流暢的戰

  鬥畫面驚喜到更是騙人的。


  藍甲蟲的打鬥畫面之流暢不禁讓我想到知名遊戲《Injustice 2》其順暢度十足，卻又有

  著足夠的爆破力與效果張力，讓打鬥看起來既順暢又舒服，雖然與拳拳到肉的爽快感或是

  火力全開的武裝展示有所不同，但流暢在各種不同的武器上做切換，不僅讓打鬥畫面看著

  舒服，同時也凸顯了海梅這個版本的藍甲蟲特色，畢竟武器隨意化形這點，可是前兩代前

  輩沒有的福利。




  【倡導著平等，卻也走上了街頭】


  《藍甲蟲》電影在美國的首周票房來到2500萬美金，在墨西哥等地也達到了200萬美金的

  票房，可說是近期的超級英雄電影中票房表現較為亮眼的，此外在爛番茄上有著高達92%

  的爆米花指數，IMDB也給予了將近7分的表現，雖然不能說是所向匹敵，但至少是有了個

  好的開始。


  而電影中除了強調家庭觀念外，也倡導了勞工階級與大資本集團在資源與環境上的不對等

  ，諷刺的是，在電影中所呈現的不對等情況，如今也真實的於好萊塢上映著。


  Gareth Dunnet-Alcocer作為《藍甲蟲》電影的編劇，在電影首映會上不僅為走上紅毯，

  同時還現身於華納的片廠前擠身罷工前線。


  拉丁裔的他表示，拉丁裔在美國大多為外來移民，為聲量較小，資源也相對匱乏的一群，

  他強調就如同電影中所倡導的，所有參與罷工的勞工所追求的只是老實工作，拿到應有的

  報酬，好過著相對應的生活，就像是電影倡導勞工階級須團結一樣，如今編劇與電影的幕

  後工作人員也應該團結一致，好對抗利益至上的企業與財團。




  【電影評價與有關藍甲蟲的有趣小知識】


  在超級英雄電影氾濫的現在，如何手握著政治正確，又將預算花的理所當然？


  塞入大量的爆破？使用大量的CGI還是找到更多願意為了片酬穿上戲服的巨星？


  《藍甲蟲》的電影預算與《沙贊！眾神之怒》差不多，有趣的是同樣是青少年英雄，同樣

  以家庭為主要核心之一，《藍甲蟲》似乎獲得了更多讚譽。


  超級英雄電影的爆炸性產出讓人們從興奮轉為疲勞，除了看到英雄們強大對敵的一面外，

  流的血，吞的淚，作為英雄必要的犧牲似乎都要要考量在內。


  除了認識閃電俠，人們更期待認識巴里艾倫；除了認識藍甲蟲，人們也認識了海梅·雷耶

  斯與他可愛的家人。


  這不一定是部偉大的電影，但他流暢，柔軟，幽默且凸顯了剛成為一位英雄時所會出現的

  混亂，我很喜歡。


  --'
