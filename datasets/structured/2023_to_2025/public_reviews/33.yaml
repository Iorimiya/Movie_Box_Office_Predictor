  年也沒出事，於是便成為了流行減重法


  殊不知寄生蟲的兇性要在日蝕之時才會喚醒；某次一次日蝕造成使用此療法的人都被寄生

  蟲開膛破肚


  我當時在FB watch看到這裡就臨時有事去忙，再回來已找不到該影片資訊。還請強者大大

  幫忙，謝謝～


  --'
