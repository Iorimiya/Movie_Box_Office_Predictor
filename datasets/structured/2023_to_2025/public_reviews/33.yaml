title: '[新聞] 昆蟲系英雄合體？傳《蜘蛛人4》將由蟻人搭檔作戰'
content: '新聞網址：


  2023-12-15 12:30:40



  湯姆霍蘭德（Tom Holland）主演的「蜘蛛人」雖然已經被他的宇宙所遺忘，但戲外的影

  迷們依然期待他接下來的旅程。根據最新傳聞，正在籌備中的第四部 MCU《蜘蛛人》電影

  ，將會遵循前三集的傳統，讓蜘蛛人與另一位復仇者聯盟組隊。




  目前兩人僅在《美國隊長

  ：英雄內戰》（Captain America: Civil War）與《復仇者聯盟：終局之戰》（

  Avengers: Endgame）的戰場上交手，並沒有正式碰面，




  再者，蟻人與即將登場的《復仇者聯盟：康之王朝》（Avengers: The Kang Dynasty）有

  密切聯繫，或許本片有助於搭起兩者之間的橋樑。



  除此之外，

  ；但考慮到目前《夜

  魔俠：重生》（Daredevil: Born Again）劇本面臨更動，可能導致兩部作品之間的連貫

  性有所改變。



  查理考克斯（Charlie Cox）飾演的地獄廚房惡魔，將會在下個月《回聲女》（ECHO）影

  集中率先回歸；至於蟻人在與家人征服完「壞康」的下一步，目前暫未明朗。



  --'
