url: https://www.ptt.cc/bbs/movie/M.1565756392.A.DCA.html
title: '[討論] 日本原爆74週年，電影，螢火蟲之墓'
content: "看到\"緯來日本台\"臉書的日本原爆解說影片\n讓我想到國中歷史課學的日本原爆事件\n說到原爆就想到核輻射影響\n而出現身體健康狀況異常的受害者\n\
  \n小時候我看螢火蟲之墓，只知道空軍投下原子彈\n火垂るの墓 (Hotaru no haka)\n\n\n\n\n大家有發現什麼嗎？\n\n貞子為什麼從水井爬出來？\n\
  貞子說慈禧太后是我母親\n慈母手中線，遊子身上衣。\n臨行密密縫，意恐遲遲歸。\n誰言寸草心，報得三春暉。.....猜猜我是誰？\n中元(移個1)>>>味，\n\
  \n廣島與長崎原子彈爆炸\n發生在第二次世界大戰末期，\n美軍在1945年8月6日與8月9日，\n分別在日本的廣島市與長崎市\n投下原子彈（核彈），。\n\n\n\
  今年2019年是原爆74週年，\n柯南小弟我是民國75年出生(1986年)\n黑暗組織說明年2020年東京奧運就是你的死期？\n\n-----\nSent from\
  \ JPTT on my Xiaomi Redmi Note 5.\n\n--\n水滅火 風助火 誰害中國? :\n七龍珠之復活了? 聖鬥士星矢之AKB48明星大戰?\
  \ 機動戰士鋼彈之家電變化?\n城市獵人之市區被害? 機動警察之警察沒有感情? 桃太郎傳說之消滅鬼怪?\n魔神英雄傳之機車變化? 魔之子? 閃電霹靂車之龍蛇道高速公路?\
  \ \n幽遊白書之魔界降臨? 新世紀福音戰士之人類遊戲計畫? 名偵探柯南之黑暗藥物?\n爆走兄弟之汽車變化? 神奇寶貝之怪獸現實真奪戰? 中華一番之食物變黑暗料理?\n\
  \n--"
