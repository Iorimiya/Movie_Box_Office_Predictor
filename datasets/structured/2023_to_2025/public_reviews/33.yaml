title: 'Re: [討論] 藍甲蟲北美票房爆炸'
content: '老實說藍甲蟲出師不利對DC粉來說算好事吧


  有綠燈軍團、蝙蝠俠、黃燈聖納斯托、貓頭鷹法庭、末日軍團不拍，跑去拍一個無法撐起獨立個人電影的藍甲蟲，他今天成績好我才要緊張，後面DCU還要搞個生物突擊隊、權力戰隊這些比藍甲蟲更沒知名度的團體



  現在的DC CEO只需要對華納的CEO負責，幾乎沒人可以阻止他拍這些沒人氣的冷門角，也不知道他們哪來的自信敢把電影跟影集綁在一起做聯動，隔壁MCU是站穩腳步才開始推出影集，DC是把地基拆了還覺得自己穩如老狗


  我現在開始擔心可能DCU的蝙蝠俠還沒登場，DCU就先被華納送進ICU了





  -----

  Sent from JPTT on my Samsung SM-A3460.


