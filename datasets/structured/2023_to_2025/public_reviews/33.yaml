title: '[情報] 劇場版《巨蟲列島》釋出預告影片 預定202'
content: "那一天，人類終於想起了巨蟲的恐怖！劇場版《巨蟲列島》釋出預告影片　\n\n預定2020年1月10日上映\n\nMr. Qoo 2019-10-28\
  \ 19:07\n\n由 藤見泰高 原作、REDICE 及 廣瀨周 作畫的動畫作品《巨蟲列島》，於今天（10月28\n日）公開劇場版的預告影片，並宣佈上映日期將定為2020年1月10日。\n\
  \n\n\n預告影片\n\n\n\n相關情報\n\n在本次公開的宣傳影片之中亦可以看到，主角 睦美 一行人在像是「蛇蜻蜓」以及「綠帶\n翠鳳蝶」等不同巨大化昆蟲遭遇，嘗試在他們的恐怖支配下求生的場景。\n\
  \n\n\n\n\n\n作品簡介\n\n本作的舞台設定在一座被巨大昆蟲支配的島嶼之中。故事以一架載滿私立鳳翔高等學園學\n生的客機，遭遇到神秘事故而墜落為開端。主角\
  \ 織部睦美 與其他同學必需在救助隊前來\n之前，嘗試在巨大昆蟲的攻擊下奮力求存。\n\n\n\nSTAFF\n\n原作　　：藤見泰高\n漫畫　　：REDICE（秋田書店マンガクロス連載中）\n\
  總監督　：高橋丈夫\n監督　　：龍輪直征\n劇本　　：森田 繁\n角色設計：野口孝行・出雲誉明\n道具設計：福島達也\n美術監督：宮本実生\n色彩設計：小山知子・大谷和也\n\
  攝影監督：植村優基\nCG監督　：山田太郎\n音樂　　：鈴木暁也（Team-MAX）・Johannes Nilsson（Team-MAX）\n音效指導：立石弥生\n\
  動畫製作：パッショーネ\n制作　　：NAS\n發行　　：クロックワークス\n主題曲　：東城陽奏「Stellar」\n\n官方網站 \n官方Twitter \n\n\
