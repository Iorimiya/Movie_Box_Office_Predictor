url: https://www.ptt.cc/bbs/movie/M.1471791045.A.C66.html
title: '[負雷/電影說]變蟲人:最近不吃鮭魚壽司'
content: '【負雷劇透慎入！】


  電影說一餿＿《變蟲人》



  文字版本:


  1986年有部科幻電影《變蠅人》，講述一位科學家因實驗不慎，將自己與蒼蠅的基因重新

  組合成了新的自己，導致他漸漸變異成了難以界定的物種……


  《變蟲人》從片名看來似是仿效《變蠅人》卻內容完全無法相提並論，《變蠅人》是較真

  的挑戰你對人與動物之間的界定、判斷、選擇，科學家那變異導致的驚悚外觀是為了用來

  試探人性，卻《變蟲人》完全就是賣弄噁爛純粹為滿足偏愛此類型電影的觀眾服務的一部

  B級片。


  即將嫁作人婦的凱西和兩位好閨密去到旅遊勝地舉辦單身派對，過程中凱西不慎被水中的

  不明生物咬了一口，還被陌生人撿屍，身心受創的她回到家不知如何面對未婚夫，不知如

  何告訴他自己還沒準備好，更倒楣的是她還發現自己懷孕了！此外被咬到的傷口竟能擠出

  黃黃的東西，身體也開始出現一些詭異的情況……


  說大白話這種類型片就是拿來吐槽兼讓人明明作噁卻還是看得很高興的，但本片的B指數在

  我看來沒有想像中到位，預告片已是最噁心的呈現，正片不過多了很多很多很多很多很多

  的鮭魚卵，看到最後真的就是審卵疲勞打起哈欠，再加上後段劇情犯起空轉的毛病，人物

  如往常B cult的慣例一樣智商低落，就這樣一個又一個走進蟲窩，被凱西一個又一個處理

  掉。


  編導明顯就沒想好好為這場本就沒頭沒尾的鬧劇收尾，最後成了一部毫無新意毫無誠意，

  遵照死板流程結束的糟糕之作。


  以這種類型和成本來說的電影，應該著重在如何讓人瞠目結舌嚇到掉渣的重口味部份，

  就這麼撒撒魚卵踩踩踩踩蛋實不夠看，變異的女主本體原是重點中的重點，卻最後階段

  妝容含糊地到底她成什麼樣子都沒個清晰的全貌，在前已有眾多變異人相關的電影可腦

  力激盪的情況下劇情還能夠這麼俗套不思求變，可見這就是部為了賣B而拍B拍了還不如

  不拍的作品。


  外觀妝容不講究倒好，連女主角變異成蟲人的心理情境也是一會兒正常一會兒混亂，前面

  還在說我不想傷害你啊朋友，下一秒就撲了過去秒殺了朋友，再下一秒又拚了命懺悔，原

  來有種蟲的個性是情緒如此反覆打臉啊？


  但這部作品有一點是可多做延伸和讓劇情有所突破的，就是凱西懷孕會孵化出的具體會是

  什麼呢？在凱西的惡夢中她噴出許多鮭魚卵，旁人邊喊著Baby~Baby~Baby~邊踩爆她的蛋

  ，她著急地護著蛋。而現實場景的後半段她的房間滿滿都是卵，有小顆有大顆，讓人心想

  是否會孵化出更嚇人的東西？可等到最後……


  啥X都沒有


  電影市場截至目前為止變異人相關的數量不算少，卻大都沒觸碰到變異人後代，原因在於

  這勢必需要很完整清楚的腦洞脈絡，和嚴謹構築成的新價值觀和道德觀才有發展的可能，

  或僅僅只完成實驗性的嘗試。


  《人工進化》中的女科學家被自己創造的新人類強暴有了身孕，電影就結束在她想把孩子

  生下來的那一幕，是留伏筆還是終其究開這種腦洞還是太不現實了？


  無論如何《變蟲人》是連這唯一有趣的部份都扼殺了，成為一部徒留給觀眾魚卵魚卵魚卵

  魚卵滿滿盡是魚卵的一部作品。


  本來這電影搭配魚卵壽司一起賣票一定相當惡趣味有梗的說＞口＜


  －－－－－－－－－－－－－－－－－－－－－－－－－－－－

  更多資訊請參考：





  --'
