url: https://www.ptt.cc/bbs/movie/M.1750481218.A.79C.html
title: '[新聞] 比Labubu還難搶？《看不見的國家》蔡英文'
content: '新聞網址：




  比Labubu還難搶？《看不見的國家》蔡英文徽章「黃牛價飆10倍」嚇壞全網


  生活中心／鍾昀軒報導

  美籍導演葛靜文（Vanessa Hope）執導的紀錄片《看不見的國家》（Invisible Nation）

  ，近期在台上映後引發熱烈迴響。該片以台灣首位民選女性總統蔡英文為核心，完整呈現

  台灣近年民主深化、性別平權、同婚合法化等重大歷程，同時直面兩岸局勢，描繪出台灣

  人民對身份認同與自由價值的堅持。前總統蔡英文更在上映首日透過臉書發文推薦，吸引

  大批支持者進場觀影。發行片商透露，電影首周末票房即達480萬元，昨（16日）已衝破

  500萬元大關，全台戲院平均上座率高居第一，成為近年來罕見的紀錄片佳績。不僅如此

  ，，引發搶購潮，在拍賣平台上更飆漲到了新台幣

  3000元。


  紀錄片《看不見的國家》以台灣首位民選女性總統蔡英文為主軸。（圖／翻攝自蔡英文臉

  書）


  導演葛靜文耗時8年拍攝本片，並於上映前已帶著作品走遍全球超過40個國家，獲得如美

  國米德堡影展觀眾票選獎、太陽谷影展最佳紀錄片、美國索諾瑪影展評審團大獎等多項國

  際肯定。她上周來台宣傳時表示，能夠把這部電影帶回台灣才是真正有「回家的感覺」。

  上映首週期間，葛靜文親自出席十多場映後座談與映前導讀，與觀眾深度互動。而她提到

  自己印象最深刻的一次，透露有一場活動中，有一位台灣太太帶著香港籍伴侶觀影，談到

  片中香港街頭鎮壓片段時，忍不住哽咽感謝導演留下見證歷史的紀錄，場面感人，就連導

  演聽聞後也。


  除了電影本身內容備受肯定，片商所推出的周邊商品也意外掀起熱潮。在首波套票組合中

  包含代表「宣誓女力」的蔡英文背影徽章、主視覺海報與女力小卡，短短幾日內預購破千

  組。其中，徽章的部分更因為限量販售，在網路拍賣平台被炒至近新台幣3000元，單價暴

  漲近10倍，引發討論，黃牛價格飆漲幅度只有風靡全球的Labubu能相比。針對商品供不應

  求的狀況，片商表示將於近日評估是否開放更多周邊預購，也鼓勵觀眾進戲院支持紀錄片

  產業，見證台灣之路。



  --'
