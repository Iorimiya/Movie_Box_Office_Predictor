url: https://www.ptt.cc/bbs/movie/M.1749912047.A.1D0.html
title: '[有雷但應該不太影響吧] 看不見的國家'
content: '還是防一下雷























  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  先用一句話總結個人心得


  "這是一部給外國人看的，宣傳台灣的電影"



  整部片的歷史跨度是從李登輝到蔡英文任期

  有稍微往前帶到一些兩蔣時代的事

  然後很有趣的是有馬英九，但通篇沒有陳水扁XD


  雖然跨度是這樣

  但大約有50%都還是放在蔡英文任內就是了


  拍攝手法大家應該也都想的到

  過往新聞片段配上人物訪問交錯

  類似紀錄片的拍攝方式(但不是紀錄片)


  主旨大概就中華民國在退出聯合國後

  如何從戒嚴威權時期轉為民主國家

  以及在國際上被孤立的局勢下的各種自處


  老實說整部片的政治色彩算蠻中立的

  沒有刻意去醜化國民黨和民眾黨


  有一些轉型正義，和當年動員戡亂的橋段

  但同樣沒有刻意醜化

  反而更像是為了帶到台灣是如何從威權走向民主的過程


  印象中語氣最重的，應該是訪談裡面有講到

  "蔣中正從來沒有把台灣當作他的家"

  但個人是認為一點都不奇怪啦


  蔣中正，浙江奉化人，當年逃來台灣就是想要反攻大陸的

  今天換成你我是他這個角色，腦袋想的大概也是差不多

  如果有人拿這點去醜化蔣中正，那這人真的就是無聊，娘希匹


  國際色彩的部分很明顯就是靠攏台灣這一邊了

  阿合理，行銷宣傳台灣的片，不然要怎樣XD


  史實考究程度

  只能說這不是紀錄片，這是宣傳片

  用歷史學家的標準來看這部片，你應該會很痛苦

  譬如蔣經國任用大量本土派國民黨員、任命登輝伯當副總統的原因

  這部片提到的和我自己本身曾經看到的說法就不太一樣

  不斷穿插的片段，有沒有去脈絡化、斷章取義

  我猜有可能，但應該不是刻意為之就是了



  這部片比較容易觸動到敏感的話題

  要問我推不推的話


  我認為如果你是小英狂粉，你應該會看得很開心


  如果你不是民進黨支持者，但是願意抱著

  "來看看外國導演怎麼拍一部宣傳自己國家的電影"的心態

  那也挺推薦的，畢竟之前印象沒有這種類型的電影


  但如果你生下來的使命就是恨民進黨，或是是共產黨員

  那就還是算了，別自討沒趣了


  大概是這樣


  --

  大概一秒，而且不是C位

  不否認他就是宣揚台灣的行銷片

  有刻意把中國共產黨描寫成欺壓台灣的角色的感覺

  但政治色彩上我認為沒有刻意的抹黑藍白這點應該是無誤

  我今天下午想說去松仁威秀看

  結果爆滿，只剩第一排的位置的樣子

  然後摸摸鼻子去華山光點要看六點的場次

  結果訂票人員說只剩第一排

  後來殺去台北光點才好不容易才有位子XD

  我很不想這樣說

  但我個人認為是因為他的外型姣好

  還有曾經當過發言人，口條口齒在一定的水準之上


  甚至在延伸一點

  我認為通篇沒有陳水扁

  是因為陳水扁台灣國語，國際形象上比較不吃香

  還有陳水扁的貪汙案曾經上國際新聞過

  之前忘了在哪一本書上看過

  統計上來說，台灣國語的口音，給人的專業度是最低的


  當然口條口齒外貌與能力品行操守無關

  但政治魅力這種相對感官性質的玩意，其實挺殘酷的


  但這都是我亂猜的就是了

  也是...那應該真的是貪汙案和台美關係吧

  了解...我一直已為紀錄片要相對的客觀

  當然立場不可能避免，人都有立場

  我沒有查到，但我想如果要臆測的話，應該不難猜

  查了一下wiki

  2023年開始有在胡士托電影節

  阿姆斯特丹國際紀錄片電影節

  伍德斯托克電影節播放過了

  我想當時看的人應該是不多啦XD

  但願意投入資金讓台灣盡可能的被國際認識，這一定是好事

  畢竟多數人應該都還是希望自己的家鄉能被國際認同吧

  這個就有趣了

  之前我在八版問中共當局對64的態度的問題

  有一說法是64從頭到尾都是美國主導的顏色革命

  所以中共當局認為這個沒有甚麼好道歉的

  這說法真實性有多少我不知道

  但是起碼是得到了一個新的資訊


  阿扁的問題可能要問導演囉

  我這種一般觀眾就只能臆測而已了

  我想你對政治色彩中立這幾個字的理解

  應該和我不一樣


  你應該是認為各政黨所占篇幅的大小

  但我認定的是踩一捧一的比重


  至於誰才是對的，我想爭這個沒甚麼意義

  如果你要說各政黨所占篇幅的比重的角度來看

  這是一部民進黨大外宣，那我也尊重你的推理

  這部本身片長不長，本身體感的話是咻一下就演完了XD

  哈哈，網路嘛

  跟25年前相比，現在已經文明很多囉

  明明小弟我前幾行就說了!!!!!!!!!!!!!!!!!!

  XD

  畢竟片名叫看不見的國家

  不叫海峽兩岸阿XD

  老實說如果中國有這類的片，我也會想看'
