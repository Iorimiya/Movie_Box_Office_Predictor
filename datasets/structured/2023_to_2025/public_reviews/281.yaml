title: '[新聞] 《看不見的國家》74家戲院仍一票難求！'
content: '《看不見的國家》74家戲院仍一票難求！票房破千萬　子瑜被迫道歉逼哭觀眾


  記者蕭采薇／台北報導


  紀錄片《看不見的國家》（Invisible Nation）上周五在台上映，掀起觀影熱潮。電影上

  映首周末熱賣480萬元，接下來每天票房節節高升。因民眾觀影需求熱烈，許多人反映買

  不到票，更是從原來65家戲院，再加入9間戲院放映，上映一周票房已突破千萬大關。


  已返美的導演葛靜文也持續關心台灣票房，得知捷報後開心驚呼：「Wow！」並感謝台灣

  民眾的支持。在《看不見的國家》中，葛靜文以她分別待過兩岸的經驗、破天荒獲蔡英文

  總統的貼身採訪機會，記錄了台灣從威權體制走向民主轉型、性別平權、同婚合法化，以

  及追求台灣人身分認同的發展的過程。


  葛靜文藉歷史脈絡與政經現實的交會，結合台灣人自身經驗、以及她在海外的觀察，反思

  並討論了國際視角下的台灣，描繪了這座400年來不斷被殖民的島嶼，在爭取民主、自主

  和免於威權侵略恐懼的自由之路上的掙扎。


  《看不見的國家》自13日在台上映以來，吸引許多平時不常進戲院的民眾買票相挺；不少

  觀眾直呼「票怎麼那麼難買」，甚至平日場次也有高滿座率，周二的單日票房甚至比周一

  成長18.5%，接著更是節節高升，目前數字已突破1000萬元大關。


  熱門社群平台Threads上的相關討論，更累積百萬瀏覽數，看過電影的觀眾紛紛討論片中

  收錄TWICE台灣成員周子瑜在2016年被迫錄製道歉影片片段、或看到「花媽」陳菊重回當

  年監禁處聊心路歷程、我國選手在奧運奪金時會場播放中華民國國旗歌強忍淚水看中華台

  北奧運會旗冉冉升起等，直喊片中哭點實在太多，眼淚根本止不住，建議最好準備面紙；

  還有網友開玩笑問：「要怎麼退票？電影沒多久就淚眼模糊，根本看不清演了什麼。」


  台灣民眾對《看不見的國家》迴響熱烈，有家長表示想帶年輕子女進戲院了解台灣的民主

  發展進程、也有子女表示想帶立場不同的父母觀賞，拉近彼此之間的思想鴻溝。全台甚至

  有店家紛紛發起「憑票根換美食」的活動。


  包括在台北開店的香港老闆看完後發起客人「憑電影票根每桌送一份咖喱魚蛋」、台中南

  屯區麵包店豪氣讓客人換10個蔥麵包、彰化酒吧大方招待調酒與苗栗咖啡店可換咖啡，這

  些慷慨的店家們，不約而同表示想藉此讓更多人看到《看不見的國家》，這份熱血也讓其

  他人直呼感動。






  --'
