url: https://www.ptt.cc/bbs/movie/M.1750669495.A.EAD.html
title: '[新聞] 《看不見的國家》衝上紀錄片票房Top 8 '
content: '《看不見的國家》衝上紀錄片票房Top 8 美導演曝：下部想拍蕭美琴


  〔記者鍾志均／台北報導〕美國導演葛靜文執導的紀錄片《看不見的國家》上映第二週，

  口碑持續擴散，於Line Today電影聲量榜衝到冠軍，上映10天衝破1800萬元，站上台灣影

  史紀錄片票房第8名。


  《看不見的國家》進入台灣影史紀錄片票房排行第8名，僅次於《看見台灣》、《十二夜

  》、《不老騎士-歐兜邁環台日記》、《灣生回家》、《生命》、《台灣超人》與《時代

  革命》。


  葛靜文這回接受台灣知名主持人聶雲的《The Taipei Tonight Show》節目訪問，葛靜文

  笑說這是自己的綜藝節目初體驗，加上他們本來就是有交情的朋友，兩位老友暢聊《看不

  見的國家》拍攝原因、動機與幕後故事。


  有趣的是，《The Taipei Tonight Show》安排了美國脫口秀常有的「快問快答」橋段，

  葛靜文被問到想到台灣會想到什麼字？她微笑說：「Love.」更透露下一個她想拍紀錄片

  的對象是現任副總統蕭美琴。還有她認為外界對台灣的誤解是什麼？她毫不猶豫說：「台

  灣不是中國的一部分！」


  聶雲也與她分享，身為藝人常承受害怕說錯話的巨大壓力，「兩岸之間很敏感，說錯話可

  能就被Cancelled（封殺）」，但節目仍設計一段關於兩岸關係的10個笑話，像是「一人

  堅持『我們是正式交往！』但另一人說：『我們只是鄰居。』」聶雲邊說邊緊張強調：「

  這只是博君一笑。」


  《看不見的國家》以外國人視角記錄台灣從威權體制走向民主轉型、性別平權、同婚合法

  化，以及追求台灣人身分認同的發展的過程。


  紀錄片貼身採訪蔡英文前總統，並訪問陳菊、蕭美琴、吳沛憶等具代表性的政治人物，電

  影在台正式上映前，她已與團隊帶著電影在40多國放映，讓世界許多民眾更了解台灣，直

  到台灣放映後，感到有「回家」的感覺。




  --'
