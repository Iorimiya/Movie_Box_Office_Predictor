url: https://www.ptt.cc/bbs/movie/M.1750154956.A.160.html
title: '[普雷]《看不見的國家》百年殖民後的民主台灣'
content: '無法忽視它就是存在，台灣的國家發展進程


  在2025年初時，台灣網路上流行了一個有趣的小遊戲叫「投胎抽卡機」。它是根據全球人

  口比例與人類發展指數來計算出生率，模擬玩家可能下一次會投胎在什麼國家？有趣的是

  出生還在台灣的機率平均低於1%，只有.29%。可以說要成為台灣人恐怕還真不容易。


  從歷史的洪流中，台灣的自我認同、該如何定位百年至今的身分，一直都是複雜難題，但

  也因為生活在這片如此複雜的土地上，讓我們可以思考台灣是怎樣的台灣？民主與自由如

  何在這裡落地生根。


  《看不見的國家》是將台灣視為被國際忽略的實質國家，聚焦於敘述台灣本土所發展的民

  主進程，與台灣現在民選總統，性別平權、自由包容的民主進程。美國專門研究東亞歷史

  的導演，在聚焦於美中關係後，決定拍攝一部台灣的紀錄片，除了簡敘台灣過去的歷史，

  也敘述從馬英九政府到蔡英文政府這之間長達數十年，台灣的變化。






  《看不見的國家》是什麼電影？


  我覺得台灣很有趣的是每個人都有所謂「覺醒」的時候，那畫面在我一個宅宅眼中就好像

  是看到《機動戰士鋼彈SEED》主角爆種一樣，瞬間醒悟而去做了什麼事情般。不管是覺醒

  成什麼政治傾向，台灣就跟世界上任何一個國家一樣總免不了產生歧異，每個人都有著自

  我的政治傾向和選擇，故政治歸政治，要將自己的生活從政治裡革除，對我來講從來就是

  不切實際的事情，而提到台灣政治，就免不了會夾雜在「中國」和「美國」這兩大世界強

  國之間，而台灣就算不是政客，一般民眾或多或少都還是很清楚這樣的國際趨勢跟現狀。


  根據這樣的政治歷史，過去我也曾經在這些資料收集下，寫過長篇通俗小說《黑貓與自行

  車》。故事敘述關於從日治時代一路到中華民國黑貓中隊的台灣飛官，與一位中國解放軍

  小兵相識，兩人之間的耽美故事。


  在耽美的背後我試圖用這位台灣飛官去找答案，關於「我到底是什麼人？」這件事。就跟

  《看不見的國家》中所敘述台灣政治與時代轉變一樣，小說中走過日治到達民國的飛官對

  中國解放軍問：「你覺得我是日本人？中國人？中國民國？還是台灣？」








  《看不見的國家》紀錄片導演－葛靜文，過去曾任職於美國外交政策相關機構，專研中國

  與東亞之間的議題，在哥倫比亞大學攻讀博士期間的專業是「中國研究」，並在中國生活

  多年，並且從那之後開始拍攝短片與紀錄片。例如2015年記錄電影《All Eyes and Ears

  》就是以美國駐中國大使喬恩亨茨曼，跟他中國領養女兒、盲人維權人士三人在中國的故

  事。


  隨著越了解中國，葛靜文就曾表示：在中國的經驗，讓她意識到「中國社會與民主社會的

  差異」。並且她也在1995 年來台見證台灣第一次總統直選、並經歷過馬英九、蔡英文的

  執政。而讓她認知到中國與台灣的不同之處在於「中國必須隱藏真相，台灣大眾公開真相

  」。


  葛靜文接受台灣中央社的訪問中，表示會拍攝《看不見的國家》這部紀錄片是受到台灣人

  民的啟發，並且見證台灣人選出了第一位女性總統。會將這部紀錄片取名為「看不見的國

  家」是反映了台灣在國際舞台上的真實狀況、與即便如此仍努力尋求能見度。藉由在世界

  各地上映這部電影，讓許多外國人了解台灣是個怎樣的國家，並且美國導演葛靜文也主張

  ：「人民有決定自己國家名稱的權力，而不是某些強人領袖的幻想。」表明她拍攝這部電

  影的政治目的與想法。







  《看不見的國家》分析與延伸：


  台灣在國際上的曖昧感，是長久的歷史原因，更直接也是現在的政治角力。可以說從清朝

  割於日本殖民後，在二戰日本投降，至今沒有一份具有法律拘束力的國際條約明確規定「

  台灣歸於何處」。1943年開羅宣言，美英在戰時有意要將台灣歸於中國，但屬於宣示聲明

  非有效國際法律條約。


  1945年的波茨坦公告，也是日本接受此公告作為投降宣言，僅意味日本放棄佔領台灣，延

  續後來的1951年舊金山合約，日本表示放棄對台澎的權利，但也沒有明確說明台灣歸還給

  誰。同樣的概念也出現在1952年的中日合約中，都是以日本放棄台灣主權為主。


  可以說如今的台灣歸於中國是中華人民共和國單方面的主張，而就算以當時開羅宣言中，

  美國表示要將台灣歸於中國，而這個中國很有可能是指如今在台灣的「中華民國」，因為

  中華人民共和國的成立是在1949年。


  同樣後續在1971年聯合國第2758號決議將中國席次改由「中華人民共和國」排除中華民國

  時，也未處理台灣歸屬問題。可以說整題而言在太平洋戰爭前，台灣雖然殖民地，但明顯

  是作為日本國民，但在日本投降那一刻，其實台灣就形成無主的空窗期。






  不過我們可以從一些拍攝的歷史電影，和文獻資料發現關於戰後台灣歸中的一些敘事與情

  節，例如2024年根據二戰台籍戰俘監視員的故事，改編戲劇的《聽海湧》，就有台灣戰犯

  被審判時，從日本人變成中國（中華民國）人的劇情出現。


  這其實並不是有國際法律意義的回歸，比較像是戰後勝利國接管，故以歷史脈絡來說台灣

  並不是歸屬中華民國，而是中華民國接管，但因為中華民國與中華人民共和國的中國內戰

  失敗，撤退於台灣，這變成一個很有意思的局面，更明確一點可以說：才剛脫離日本統治

  的台灣，其實是無端被捲入了中國國民黨與中國共產黨，兩方的內戰之中，未曾在國際任

  何文件下加入任何一方。


  但這裡就有一個有麻煩的地方，就在於中華民過撤退於台灣時，其實是包含金門、馬祖兩

  處，但金門馬祖兩地其實並非是過去日治時代的殖民地，而是確實的「中國領土」但現於

  中華民國所有的國土是「台澎金馬」這使整個歸屬問題又更進一步的複雜化。


  也是說現在台灣澎湖有戰後歸屬不明確的問題，但金門馬祖兩地其實沒有這個問題，因為

  他們始終都屬於過去中華民國的領土之一（並未被中共占領過）故這也形成台灣與金門、

  馬祖之間在國際上的處理很以可能是不同的，但這已是過去放了超過半世紀未處理的問題

  。






  《看不見的國家》值得一看嗎？


  這部電影並非台灣人拍攝的電影，而是由過去生活於中國、研究東亞、中國歷史，並且看

  著台灣民主轉型，人民直選投票的美國導演，所想要對是界說的台灣故事，不管大綱內容

  或是電影紀錄片，我想都應該有很濃郁的關於她想要表達的觀點，而這個觀點很可能並不

  是所以在台灣這片土地上的人所認同的，也許會對某種立場的人感覺不適，更何況導演本

  人也表明是以馬英九過渡到蔡英文執政時期作為電影主軸，我想立場是很鮮明的。


  在近幾年除了不少外國人來台旅遊以外，也更多外國人融入並加入在台灣生活，並且了解

  台灣好或不好之處。不管是工作或是研究，美國葛靜文導演，以她一位外國學者的觀點拍

  攝敘述以台灣殖民歷史、民主抗爭、性別平權的電影。


  甚至以美國和中國與台灣接觸，台灣歷屆總統親中、親美到自主的當代歷史，我認為是可

  以給比較少接觸政治的人，和不了解台灣的人，做一個全面性的解析，以一個研究東亞歷

  史政治的學者怎麼看台灣，或則說她想讓台灣被世界看見。









  但如以紀錄片而言《看不見的國家》其實有一些電影敘事的問題存在，第一它節奏較為緩

  慢，且在敘事時而連貫，有時卻不連貫，會讓一些人難以去銜接故事，我認為以一個半小

  時時長內的電影來說，《看不見的國家》無法把台灣一些複雜的歷史和本土的問題敘述清

  楚，再加上如果向觀眾是面對台灣本地人來說，這些敘事其實很多是相當表面的事情，但

  如果對於想了解或第一次知道台灣這個國家的人來說，《看不見的國家》會向是一部前導

  電影，讓只是走馬看花的遊客，針對台灣這國家有所省思和了解它在國際上處境。


  但整體來說，世界開始有像《看不見的國家》這樣敘述台灣的電影出現，或是如同其上映

  的《造山者－世紀的賭注》，台灣開始有人在描繪台灣半導體產業故事，並且開始以國外

  熟知的台灣形象作為出發點，讓世界看到，成為了世界上無法忽視它的存在。


  應該說台灣就是在那裡，在走過矇著眼不願見的好幾個世紀，它仍然作為福爾摩沙無法被

  國際忽略。導演葛靜文想要的是，讓觀眾暫時離開那些雞排與珍珠奶茶的誘惑，看見另一

  種在台灣無形的價值與力量，當觀眾表是：「前從沒有用這種方式理解台灣。」也許就是

  啟發他翻開台灣的另一面。




  --

