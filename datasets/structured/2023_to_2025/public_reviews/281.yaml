url: https://www.ptt.cc/bbs/movie/M.1750427773.A.304.html
title: '[新聞] 《看不見的國家》淚點片段曝光 周子瑜道'
content: '新聞網址：




  《看不見的國家》淚點片段曝光　周子瑜道歉、奧運奪金無國歌最共鳴


  mirror-daily-logo


  2025/06/20 16:55:00


  記者：田瑜萍


  美國導演葛靜文（Vanessa Hope）執導的紀錄片《看不見的國家》（Invisible Nation）

  6月13日在台上映一週全台票房已突破千萬元門檻，原定上映的65家戲院更因觀眾需求殷

  切，臨時加開9家戲院加入放映行列。已返回美國的葛靜文得知消息後驚喜表示「Wow」，

  並感謝台灣觀眾的熱情支持。


  以國際視角凝視台灣　紀錄民主與身分認同的歷程


  《看不見的國家》透過導演葛靜文曾於兩岸生活的獨特經驗，深度記錄台灣自威權體制邁

  向民主轉型的關鍵時刻，包括性別平權、同婚合法化與國族身分建構等重大議題。片中更

  獲得蔡英文總統破天荒接受貼身專訪，並以歷史脈絡與國際視角交織出台灣四百年殖民歷

  史下的現代困境，刻畫這座島嶼在追求自由與主體性過程中的掙扎與韌性。


  哭點密集催淚彈　觀眾戲稱「淚眼模糊沒看清劇情」


  自上映以來，《看不見的國家》場場高滿座率，不少平時鮮少進電影院的觀眾亦熱情參與

  ，票房節節高升。社群平台Threads上更湧現百萬瀏覽量的觀影討論，許多觀眾直言：「

  眼淚根本停不下來。」不僅對TWICE台籍成員周子瑜2016年錄製道歉影片、前高雄市長陳

  菊重返監禁舊址的心路談話等片段感觸良多，也在我國選手於奧運奪金、奏起國旗歌時的

  壓抑與榮耀中潰堤。有觀眾幽默留言：「電影沒播多久就淚眼模糊，要怎麼退票？」


  憑票根換咖喱魚蛋、蔥麵包、調酒　店家暖心力挺民主紀錄片


  電影反響熱烈，也激起全台各地店家的行動力，不少商家發起「憑票根送好康」活動聲援

  電影。包含在台北開店的港籍老闆看完電影後發起「送咖喱魚蛋」、台中麵包店推出「換

  10個蔥麵包」、彰化酒吧提供免費調酒、苗栗咖啡館則招待咖啡等。

  各地店家表示，希望藉由這樣的實質行動，鼓勵更多人走進戲院支持《看不見的國家》，

  讓更多人看見台灣民主之路背後的歷史與人民努力。許多觀眾也分享，希望能帶家中長輩

  、年輕孩子一同觀影，拉近世代間的思想鴻溝，讓電影成為對話的開端。

  ------------------------------------------------------------------------------


  真的很好哭+1 尤其看到周子瑜那個真的徹底淚崩... 哭到不能自己


  --'
