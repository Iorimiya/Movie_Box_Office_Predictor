url: https://www.ptt.cc/bbs/movie/M.1750791275.A.0C3.html
title: '[負雷]The Invisible Nation/看不見的國家'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  最近版上幾十篇新聞報導的紀錄片"看不見的國家"，因為在美國加州並沒有戲院上映,我

  用"The Invisible Nation"當作關鍵字搜尋網路, 意外發現了這部2007年的加拿大紀錄片

  "The Invisible Nation/看不見的國家/Le peuple invisible"，講述阿爾岡昆部落的故

  事。這部片子簡直可悲又無聊，由兩個沒什麼名氣的激進分子導演理查德·德斯賈丁斯和

  羅伯特·蒙德里拍攝，純粹是進步派的政治宣傳，哭訴阿爾岡昆失去土地和貧困的遭遇。

  老舊的影片片段和煽情訪談試圖讓你感到愧疚，但這全是胡扯。如果一個族群跟不上現代

  生活，那是自然選擇的結果。阿爾岡昆的困境是文化競爭力的問題，不是社會的責任。


  這部片子很失敗。幾乎沒人看過,沒有票房，沒什麼討論，只有幾個電影節的怪咖知道。

  它對阿爾岡昆沒帶來任何改變；他們的土地還是沒了，問題也沒解決。某個NGO資助這部

  片，帶著明顯的政治偏見，根本不是幫忙，而是為了推銷他們的政治正確意識形態。這部

  片操縱情緒、毫無意義，果然就像片名一樣「看不見」。別浪費時間看這部無關緊要的哭

  訴片。喔,對了，這片旁白是法文，偶爾訪談到英語人士才有英文，開英文字幕看完。 這

  部不是板主開放討論政治的那一部,推文請小心.







  --'
