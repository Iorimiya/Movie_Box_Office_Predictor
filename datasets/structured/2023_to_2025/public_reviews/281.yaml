url: https://www.ptt.cc/bbs/movie/M.1750752493.A.3DE.html
title: '[普雷] 看不見的國家，給老外看的介紹片'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  看完才會發現，事前新聞報導有很重的誤導性。以前看新聞說外籍導演是因為台灣第一位女總統才興起拍攝此片的念頭。但紀錄片實際內容卻令人覺得蔡英文只是一個引子，更像是因為拍攝時總統恰巧是她，所以成為代表台灣的人物。



  以領導人物來說，反而馬英九、習近平，甚至已經過世的李登輝，給觀眾的印象可能都更強烈。至少片中明確點出馬英九、李登輝做了甚麼大事，但還真想不起來片中有說蔡英文具體做了什麼大事。


  所以這紀錄片的主軸正如其名，聚焦主題是台灣＝中華民國（片中導演觀點很明確是這個）這個國家，不是台灣上的任何一個人物。因為主題是國家這個很空泛的東西，因此我覺得結構有點鬆散，帶入了導演覺得老外會有興趣的東西，比如亞洲最早允許同婚、女性參與政治。但我覺得剪掉並不會影響到主題論述。



  紀錄片真正有說清楚的應該只有兩點：1.台灣與中國目前關係的來龍去脈。2.台灣從威權政府變為民主政權的軌跡。這兩點老實說台灣人都很熟悉的，是真的只有老外需要了解。所以這部記錄片對我來說比較值得一看的，就是挖出上一世紀的影像資料吧？有些影像資料還真的不容易在網路上見到。



  結論：如果是作為讓老外了解兩岸問題的懶人包這角度，那這部紀錄片還不錯。但對台灣人來說紀錄片主題就是毫無新鮮感，國高中歷史課本可以學到的東西。雖然多很多當時影像紀錄可看，或當事人親身說法是不錯啦。



  --

  正在上映的片會去看維基本身就很奇怪吧

  一般大片還不需要小弟獻醜，是這片片外描述跟內容實在有落差。我覺得該寫

  洗腦在那？舉個片中出現的實例可以嗎？

  目前還沒有人對導演敘事手法、切入角度等紀錄片該討論的東西批評，尤其對這片不滿的。

  看板主覺得算不算與影片無關囉

  你很明顯沒看電影喔～

  因為只有這任有貼身拍攝，純論出鏡是不少。但我覺得導演都貼身拍攝了才只有這樣，如果是人物傳記類紀錄片問題更多


  你怎麼不自己進場確認真不真實，然後發篇心得？

  我看的心得也是比想像還負面很多，符合您的期待

  任何民主國家的老外，尤其是東歐可能很受歡迎'
