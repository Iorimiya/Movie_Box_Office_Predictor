title: '[新聞] 臺灣發了！《看不見的國家》票房34688888'
content: '新聞網址：




  臺灣發了！《看不見的國家》票房34688888萬　神巧合5個8


  ▲臺灣發啦！《看不見的國家》票房34688888萬，連續5個8（發）， 氣勢磅礴持續熱賣

  。（圖／海鵬電影提供、翻攝自《看不見的國家》電影預告）


  《看不見的國家》6月13日上映以來，一直破紀錄，打破紀錄片上映天數紀錄、7天票房破

  千萬，統計到7月15日票房統計數字是34,688,888萬。逼近3千5百萬。發行的海鵬電影公

  司表示，一共有5個8，發發發發發。8、發是臺灣人最愛的吉利數字。

  。


  《看不見的國家》7月15日票房  氣勢磅礴持續熱賣


  《看不見的國家》導演葛靜文以分別待過兩岸的經驗、破天荒獲蔡英文總統的貼身採訪機

  會，記錄台灣從威權體制走向民主轉型、性別平權、同婚合法化，以及追求台灣人身分認

  同的發展過程。


  從歷史脈絡與政經現實的交會，結合台灣人自身經驗、以及她在海外的觀察，反思討論國

  際視角下的台灣，描繪臺灣這座400年來不斷被殖民的島嶼，在爭取民主、自主和免於威

  權侵略恐懼的自由之路上的掙扎路程。《看不見的國家》破了紀錄片的紀錄，口碑發酵讓

  上映天數長、票房累積不斷增加，記者日前持續三天下班時間到不同戲院觀察，在週間時

  段宛如週末夜晚，人潮滾滾，就是來看《看不見的國家》。



  --'
