url: https://www.ptt.cc/bbs/movie/M.1751215182.A.B8C.html
title: '[普雷] 看不見的國家觀後感'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  身為一個藍營支持者


  被綠營女友抓去看此部電影


  我儘量以客觀的角度，描述電影的觀後感


  (BTW: 我女友淺綠。可能是因為這個原因我們才有機會在一起，台派應該沒機會告白成功)



  我給普雷的原因，是因為它作為宣傳片的效果，偏好雷


  這部也在某些橋段


  營造出感人點



  但它的客觀程度，是負雷


  這部可以確定是以民進黨視角為主去推進故事


  且比起蔡總統自傳


  更偏向DPP及小英總統之路的紀錄片



  我覺得紀錄片的敘述脈絡要這樣呈現，當然沒問題



  但我認為基於此部劇的片名，以及它的目的，是要呈現給外國人為導向


  應該更為客觀的去看待與處理: 台灣內部族群因中國問題，還有自我認同


  對彼此所產生的拉扯，才不失公允，且增加其深度



  所以綜合起來，我給普雷，當然啦，這是我個人看法


  提供一下，非台派族群觀後感的樣本



  回過頭來說


  這部片的主軸我想很多電影板的鄉民都認識一二了。我覺得簡言之，如果外國人看這部


  大概真的會同情台灣



  因為這部有特別去著墨在賣慘這一塊，所以也是我認為宣傳上偏好雷的原因


  比起花極大的篇幅講述:台積電、民主、同性婚姻等優勢，賣慘是最直接有用的方法


  像是被各種國際組織拒絕，以及把中國塑造成大魔頭的形象



  其他部分: 我比較想針對部分問題去描述


  而且我主要想針對去電影本身去討論，淡化針對總統施政的部分


  一些我較為驚艷的地方，以及較為失望的地方



  首先是驚艷的地方吧，這部片讓我了解蔡英文平時比較鮮為人知的一面


  蔡英文總統這個人，在這紀錄片的表達下，大概可以看出


  她還是有意識到，每個族群因自我認同不同，所以有不同的立場


  她也說出她的一些心裡話:她試圖去取得共識，去謹慎處理這樣的問題



  儘管在她的任內，網軍戰開始崛起，網路論壇開始被敗壞。但我會更想去回頭檢視


  網軍跟大時代環境的關係，還有


  蔡英文在針對不同立場之人的處理，能以及在與國際交流時獲得的成果與損失


  相比賴清德總統，我認為她相對更為穩重與警慎。比起內政，外交更為擅長一些



  (紀錄片還有提到一個觀點: 中國與前幾任總統台灣的對話未獲得實質成果，所以變得更r

  igid


  這也是蔡英文對中國對話挫敗的原因之一，供鄉民參考與思考)




  回過頭來說吐槽的地方


  這部片，我認為蔡總統的訪談沒問題


  導演甚至找馬總統等相反立場的人，剪出的對話也沒有很爭議


  那些與台外交資深的美國相關人士，講話也很公允



  但敘事的手法，與後來找來的人，像是蕭美琴，有些話直接鬼轉控訴國民黨的部分


  直接就可以說，這部就是以民進黨為主要視角去進行拍攝的電影



  我不批評


  我覺得更好的處理方式，是把大比例民進黨相關政治人物


  換成訪談不同立場的選民


  詢問他們的自我認同、對中國的看法，以及台灣島內不同聲音互相爭執的看法


  像是原住民、本省外省人、以及新住民的看法



  引出228與轉型正義的部分，我覺得要把228事件描述得更為具體


  外國人我認為他們不懂發生什麼，光看突然轉折的片段



  另外，同樣也要找出不同立場人的看法


  我認為找陳菊是沒問題的 她畢竟就是個例子，再找一下其他民眾針對228的看法，進行訪談



  轉型正義也要提出原住民相關議題綜合議題及補償措施，更能凸顯台灣重視這塊的包容決心


  我覺得外國人這樣看，才會理解台灣族群議題為何如此複雜



  儘管有一段，好像是蕭美琴


  說大家都是台灣人，包含外省人、新住民;但這部片的敘事架構仍以台派為主體


  個人認為蠻諷刺的



  看完這部片


  外國人他們可能只會覺得台灣好可憐、小英總統帶領的民進黨是英雄之師，反對黨是大壞蛋


  台灣請加油，努力對抗中國，keep going!



  看到這裡，你一定會說: 你是笨蛋嗎?這就是拍給民進黨支持者看的


  但我只想說，我知道


  這部片，一定是台派為主體，進行大內宣及外宣的影片



  但我認為，它還是有一些部分


  是非民進黨支持者看到可以思考的


  不管是好是壞啦



  娛樂度的話，以紀錄片來說還算可以。談到台灣，被世衛掛電話很好笑


  也可以看到一些老舊紀錄片段


  (不過我隔壁的阿姨好像還是睡著了)



  大概是這樣



  不過還是打一下預防針，前面中立骨，後面直面台派族群


  非民進黨支持者決定是否觀影時請三思


  謝謝





























  --






  身為反對黨支持者 您說的我認為沒錯，也或許那是我的一些觀點 or 淺意識的想法，因為

  內政的爭議，我一開始也是帶著有色眼鏡看這部電影的


  不過這部片也帶出，蔡英文有在外交和國防、軍演努力，但基於大環境還是困難重重，和中

  國以及全世界的進展常常碰壁


  所以我才認為，或許蔡英文主要是把心力放在外交，因為這幾年的外交和國際情勢，加上疫

  情真的難度不小


  這些因素，再加上內政產生的一些爭議+

  ，以及網軍充斥的環境，讓我們這些藍營支持者很不爽



  另外


  我認為更重要的是看到「蔡英文的想法」



  平常我們是以執政成果去檢視她，再加上常常跟台派互相嘴炮，對她很不爽；她的一些演講

  ，其實反對者陣營也都懶得去看


  不管在紀錄片裡的話是不是演的


  但聽到她有想要顧全所有人的想法，以及她的個性偏沉穩，我是認為她至少比激進的賴清德

  好蠻多的



  也會讓我對她的想法做個調整


  至少可以再check看看，那些內政跟外交的她的得與失


  撇開跟台派瘋狂吵架的情緒，去看小英總統這個人





  當然不會有 XD


  阿扁總統都沒有出現



  我完全理解您，建議您不要去看


  後面會出現曹興誠和黑熊，擔心扛不住


  我也害怕自己會突然心中發怒還是怎樣的


  結果他們講中國比較多


  反而是蕭美琴和陳菊那段才開始嘴在野



  是個人宣傳片+DPP成長與總統勝選之路片


  蔡總統談話也只有在前半段以她為主



  沒錯…



  沒辦法


  我真的認為外國人或台裔看這部


  會直接被洗一波



  當然沒有 XD



  感謝您的欣賞



  阿扁總統對DPP勝選的光榮歷史


  可能是必須被忽略的部分


  甚至是柯文哲出鏡率都比阿扁高



  對我而言啦


  我當然對超買和3+11的事情感到反感


  但之前比較沒想聽她的訪談


  看完這部


  會比較想去研究她了


  觀點可能轉好或壞，我自己也抓不準



  我女友找我去


  還笑我進場時表情超猙獰


  我怕被政黑鄉民認出


  被圍毆啊 XD



  綜合紀錄片的觀點和我的理解


  它比較想表達


  連馬英九總統對中國相對友善的總統


  似乎都無法達到中共期望的獲利


  （這邊不單指統一，可能是經貿和其他的因素）



  所以中共選擇忠於自身利益和原則


  懶得理台灣了



  當然朱朱當時選上，中共願不願意改變這個想法，現在也無法推測



  我自己是沒提到她最擅長外交


  是說相較內政，更好一點


  我覺得下面有一個板友說的蠻對的


  一部分也跟國際局勢有關



  她能被包裝


  賴連包裝的可能性或許都快沒有了



  理解正確



  這段有



  這段沒有



  這邊紀錄片蠻厲害的


  引用美國外交人士嘴季辛吉的片段


  借刀殺人



  我不是 QQ



  老哥看看我在八卦和政黑的發文


  我常常被青鳥說是槓精



  確定呀



  交往前到交往初期試探出雙方立場不同


  但都有說好



  討論政治，理性中立討論


  政治歸政治，苓膏龜苓膏



  她也叫我去投大罷免啊


  我就跟她互相小鬥嘴之類的，但也都沒走心



  不過她的台派朋友們就說過，男友或女友不是台派，連考慮這件事情都不會存在



  算是吧


  不過文鄒鄒的說法


  大概是「以民進黨視角為主，英雄史觀的紀錄片」


  以某立場視角為主，註定就不算是客觀的紀錄片。不過就有算得上是建構台派世界觀吧



  差不多哈哈



  很不想講或相信同立場的人是網軍 XD


  反正我的觀點就放在這邊


  就有好有壞，我也有提到是民進黨專屬片



  藍綠白網軍如果有人不爽


  都歡迎留言吧


  因為我無法辨認是極端粉還網軍




  我女友花錢買兩張電影票 XD









  危險


  不是哈哈，我女友坐我右邊


  是我左邊的阿姨


  眼睛看起來很瞇，都沒在動




  沒有


  蔡完全沒提2025以及賴的事情


