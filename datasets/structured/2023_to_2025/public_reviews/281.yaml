title: '[雷] 看不見的國家 很感嘆'
content: '其實大多數的內容都是已經知道的事情啦。


  但是有一段真的讓我很感嘆。


  那就是最後提到2019反送中事件時。


  有一段是引用馬英九的採訪畫面。


  馬英九說：「一國兩制的構想已經正式走入歷史，換句話說是宣告它的死亡」


  對照整部紀錄片中多次提到馬英九多麼期待兩岸交流。


  那句「宣告它的死亡」真的也是馬英九感嘆自己兩岸交流的願景的死亡。


  在這一刻。 馬英九這名腳色的故事弧線出現了轉折點。


  當然……這是只在片中啦。 哈哈。


  說個小插曲。 在看到世衛官員被採訪時聽到台灣就說自己連線有問題時。


  全場出現多個笑聲。 充滿了歡樂的氣息。



  --'
