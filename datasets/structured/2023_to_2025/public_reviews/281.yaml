url: https://www.ptt.cc/bbs/movie/M.1750385379.A.A57.html
title: 'Re: [討論] 看不見的國家這麼多人看喔？'
content: '不討論政治啊


  違反板規


  與其說是政治片票房不好


  該說的是


  政治片或者說是權謀片不容易拍好


  這種片要好看


  每個人的智商都要在線


  太弱智的反派


  或者是一遇到主角就弱智的反派


  這種純文戲的鬥智怎麼會好看呢？




  且麻煩的還不只劇情不好寫


  照真的拍


  看起來就是紀錄片


  少了戲劇衝突與張力


  電影外也要一堆顧慮


  諷刺到誰，或者是觀眾過度解讀一下


  支持者就要開始大炎上


  炎上商法可不是這麼好操作的啊


  翻車的多的是


  我就一個普通想賺錢的金主


  增加這麼多額外風險是幹嘛啊？





  回頭看看之前相關類型的片子


  大多是票房大爆死的下場


  也印證了拍好看的難度


  相對比較成功的黑金


  即便他有比較明顯的"借鑑"真實人物與事件


  其實就種類上對我而言比較是警匪片


  這種類型好萊塢有太多成功的商業片典範可以參考


  幾個小警察，對抗黑惡勢力，或者是官商勾結


  來個反轉，上頭高層也是壞人


  最後將壞人打死或繩之以法作結


  中間的飛車，槍戰大場面一定要有


  觀眾基本喜歡的元素都有了


  票房就比較有機會成功





  要不然


  觀眾花了幾百塊，然後看一堆人在那邊尬聊


  票房是不可能好的


  就連冰與火之歌這種大IP


  也要找一堆裸男裸女串場


  才能讓觀眾看完他們想表達的對話


  如果真要拍這種純政治文鬥片


  應該找已經有觀眾基礎的小說來翻拍


  先讓最基礎的故事有經過市場的審核


  直接跳到千萬級別投資的電影


  對金主而言風險實在過於龐大了





  綜合上述


  配合現在台灣國片比較流行的片種─黑道片


  或許可以考慮看看


  在原本的角頭宇宙之中


  就已經有警察的腳色了


  或者可以考慮在角頭宇宙的架構之下


  拍攝以警察角度的警匪片擴大受眾


  看看能否帶起一波警匪片的懷舊氣氛


  如果是以彰顯警方正面形象


  甚至也許可以找到警方或者政府的協助


  讓服畫道上顯得更加真實可信


  這種純動作爽片


  我認為對國內票房而言還是有一定吸引度


  題材上畢竟相對熟悉


  國片上一次的警匪片，應該要追溯到痞子英雄了吧？


  都已經十幾年過去了


  再幻想一下，痞子英雄與角頭夢幻連動？


  難說不會有一波小高潮


  新聞熱點應該也是有的





  男主角除了趙又廷與周渝民外


  他們現在願不願意回歸痞子英雄這個IP實在難說


  我認為可以考慮看看彭于晏


  畢竟他已經多次出演過動作片


  在華人動作片之中


  也算比較有作品的代表


  動作上的演出


  相信彭應該是沒有問題的


  女主角繼續王淨吧


  台灣也沒幾個知名的年輕女電影主演了


  只要劇情順順的


  不要太有智商硬傷


  專注在動作大場面上的呈現


  別人我不敢說


  至少我願意掏錢去電影欣賞


  但如果是那種純文鬥的政治權謀電影


  除非口碑炸裂


  否則大概在串流上看到


  我也不見得會挑來看吧



  --


  我一篇這麼多字


  提到王淨的才多少


  你別自己搜尋能力太好就怪我頭上吧XD



  其實跟偏頗沒啥關係


  主要是好不好看吧


  你有本事隱射某黨某人


  然後寫的他心機超深沉


  敵人也都是高智商的政治油條


  仍能被他以觀眾想像不到的方式反轉打落馬下


  這管他形象中分頭還是禿頭


  應該還是會有得到一定的好評的


  就好像韓國電影我根本也不知道韓國歷史


  也不知道他們影射誰


  但好看的電影就是好看啊'
