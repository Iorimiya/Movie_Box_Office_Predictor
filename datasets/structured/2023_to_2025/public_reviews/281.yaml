title: '[普雷] 看不見的國家 習哥哥好多戲份喔'
content: '剛剛看完覺得還不錯啊

  幾乎歷任總統都有講話（除了在監獄）

  也給有把鏡頭給到對面傳達中國的想法

  習哥哥根本第一男主角了吧

  戲份不少欸

  他的堅持他的渴望還有他的談吐

  非常的有魅力


  劇情節奏普普

  音樂很好聽

  希望實戰化軍演的部分多一點

  電影院聽很爽


  劇情蠻中立的啊

  不懂有什麼好噓文的

  還是噓文的都在質疑

  習哥哥統一大中華的決心






  好啦認真評論

  講被關那邊有點想哭

  那種環境關幾十年真的很可怕


  還有烏克蘭跟香港

  現實寓言


  不畏戰才能避戰



  我準備被噓爆了

  機器人你們可以進來了

  多發點厲害了我的國的好評（要付票根喔親）

  我想看


  -----

  Sent from  on my iPhone


  --


  神功護體



  --

  哥你沒看過紀錄片喔 新聞公共媒體本來就能截取

  不要來秀下限了

  那則新聞是對外公開的

  消費誰？ 說出來～

  提到習哥哥又在扯顏色笑死

  紅網軍最多好嗎

  噓文大軍文本一樣

  其實裡面的內容蠻中立

  有看過就知道～'
