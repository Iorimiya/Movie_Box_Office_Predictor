url: https://www.ptt.cc/bbs/movie/M.1751717537.A.AD6.html
title: '[新聞] 《看不見的國家》上映3周賣破3,000萬！'
content: "新聞網址：\n\n\n《看不見的國家》上映3周賣破3千萬！副總統蕭美琴、日本藝術家奈良美智都來看了\n\n2025/07/05 19:48\n\
  壹蘋新聞網 / 李子凡 綜合報導\n\n【李子凡／綜合報導】美籍導演葛靜文（Vanessa Hope）執導的紀錄片《看不見的國家》\n （Invisible Nation）\
  \ 上月13日在台上映，掀起觀影熱潮，至昨天（7/4）票房數字已\n突破3千萬大關、成為年度國片賣座亞軍。\n\n前總統蔡英文在上映當天在臉書上發文推薦，而也在片中現身與受訪的另一位重磅女性政\n\
  治人物——副總統蕭美琴，今透露昨晚邀請了前副總統陳建仁、許淑華議員與幾位女性駐\n台使節，共同欣賞該片，她在社群媒體上發文表示：\n\n「感謝大家共襄盛舉，一同感受台灣的悲情、歡樂、驕傲與困惑。」\n\
  \n\n副總統蕭美琴（左圖）與日本藝術家奈良美智(右圖小圖，資料照）都分享看了熱映中的\n紀錄片《看不見的國家》。翻攝FB、X\n\n《看不見的國家》中，葛靜文以台灣首位女性總統蔡英文為核心人物，紀錄了台灣從威權\n\
  體制走向民主轉型、性別平權、同婚合法化，以及追求台灣人身分認同的發展的過程，其\n中也訪問了蕭美琴、陳菊等具指標性的政治人物。\n\n蕭美琴看完片後，有感而發表示：\n\
  \n「台灣走過歷史的障礙與不公，到如今擁有傲人的民主成績，這是台灣人的故事，也是我\n們共同努力的成果。期盼所有台灣人，持續用充滿韌性的精神，與守護和平的勇氣，走向\n\
  世界每一個角落，讓世界看見台灣。願歷史的裂縫，成為光照進來的契機，點亮彼此、照\n亮未來。」\n\n\n蕭美琴（前排左二）邀請前副總統陳建仁夫妻（前排右二）、許淑華議員（前排左一）共\n\
  同看片。翻攝FB\n\n最近人在台灣、享有高知名的日本藝術家奈良美智，也在X平台賬號分享自己看了《看不\n見的國家》，讓台灣粉絲相當驚喜。而他的觀後感可看出他對台灣人的觀察與對自身、國\n\
  家的反思，寫道：\n\n「我剛看完了一部紀錄片《看不見的國家》。現實的複雜程度，恐怕早已超出了美國導演\n原本想拍攝的內容。對我而言，有太多不了解的事，但我真切地感受到，在台灣，政治是\n\
  與人民貼近的；反觀日本人，從投票率就能看出來，對政治的參與意識相對薄弱」。\n\n他繼續寫著：「觀看時，雖然英文字幕來不及一一閱讀，但中文字幕一眼就能理解大半，\n\
  讓我再次感受到漢字的便利與力量。然而，我卻無法為這部電影的感想找到一個明確的落\n點。作為一個日本人，這似乎也反映了我自身對歷史和政治的認識之薄，讓我感到些許自\n\
  責與自我厭惡。」\n\n\n日本藝術家奈良美智分享自己看了《看不見的國家》觀影心得。翻攝X\n\n\n\n\n--\n\n看不見的連署書，\n因為中國國民黨\n\
  只會偽造文書，抄寫名冊？\n藍白支持者連一位\n罷免綠委的連署都無法做到？\n只會躲在網路上還會做什麼？\n\n期待在中國稱自己為「馬先生」的\n馬英九前總統也可以出一部紀錄片\n\
  紀錄他輝煌的8年 順便把國民黨最近\n知法犯法都拍進去（讚喔！）"
