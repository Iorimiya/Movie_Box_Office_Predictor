url: https://www.ptt.cc/bbs/movie/M.1750670548.A.D7D.html
title: '[新聞] 《看不見的國家》上映第二周票房逆襲 導'
content: "《看不見的國家》上映第二周票房逆襲 導演跟聶雲大玩兩岸關係「地獄梗」\n\n周刊王CTWANT |粘湘婉\n2025年6月23日 週一 下午4:41\n\
  \n葛靜文來台宣傳時，\n也接受主持人聶雲的《The Taipei Tonight Show》節目訪問，兩人大開兩岸地獄梗，讓\n聶雲急忙補充：「只是博君一笑。」\n\
  \n《看不見的國家》是葛靜文費時8年拍攝、以外國人視角記錄台灣從威權體制走向民主轉\n型、性別平權、同婚合法化，以及追求台灣人身分認同的發展的過程。她除了破天荒獲得\n\
  總統蔡英文的貼身採訪機會，在台上映之前，她已與團隊帶著電影在40多國放映，讓\n世界許多民眾更了解台灣，才有真正帶電影「回家」的感覺。 \n\n\n葛靜文在電影上映前來台宣傳，也接受主持人聶雲的《The\
  \ Taipei Tonight Show》節目\n訪問，葛靜文笑說這是自己的綜藝節目初體驗，加上他們本來就是有交情的朋友，兩位老\n友暢聊《看不見的國家》拍攝原因、動機與幕後故事。\n\
  \n聶雲也與她分享，身為藝人常承受害怕說錯話的巨大壓力，「兩岸之間很敏感，說錯話可\n能就被Cancelled（封殺）」。但節目還是設計了一段關於兩岸關係的10個笑話、對於不\n\
  少人可能是「地獄梗」，包括「一人堅持『我們是正式交往！』但另一人說：『我們只是\n鄰居。』」聶雲邊說邊緊張地強調：「這只是博君一笑。」《看不見的國家》現正上映中\n\
  。\n\n\n\n\n--"
