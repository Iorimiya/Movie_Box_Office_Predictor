url: https://www.ptt.cc/bbs/movie/M.1750073450.A.540.html
title: '[新聞]《看不見的國家》好口碑賣破500萬 網曬票'
content: '新聞網址：



  《看不見的國家》好口碑賣破500萬 網曬票根高呼「合法亮票」



  《看不見的國家》導演葛靜文（左）、前總統蔡英文。（海鵬提供）


  〔記者鍾志均／台北報導〕紀錄片《看不見的國家》以台灣首位女性總統蔡英文為核心，

  口碑延燒全台，13日在台上映後，首週末票房賣破480萬，為滿座率冠軍，今（16）票房

  持續衝刺，至截稿前已飆破500萬，後勢看好。


  《看不見的國家》由美國導演葛靜文執導，記錄台灣從威權體制走向民主轉型、性別平權

  、同婚合法化、台灣人身分認同的發展過程，讓世界看見台灣。



  影迷秀出台北、台南、新竹、台中戲院售票情況，幾乎場場爆滿。（翻攝自臉書）


  許多影迷自發性在社群發布感想、截圖戲院全滿的畫面，並曬出票根高喊「合法亮票」，

  引來網友熱議；有人分享平日一早的新店裕隆城電影院9成滿，電影無冷場，不時被感動

  到，也有網友直呼「奇蹟總會發生在我們這個寶島的」、「想要二刷、三刷，看很多遍」

  。


  住在彰化南投的影迷則哀號看電影只能去台中，《看不見的國家》粉專小編回覆「抱歉讓

  大家舟車勞頓，由於是紀錄片戲院安排總是不及好萊塢大片」，表示會繼續努力，也要有

  賴觀眾繼續支持。




  此外，另一部紀錄片《造山者－世紀的賭注》聚焦台灣首部「半導體產業」，於《看不見

  的國家》同日在台上映，首週票房突破500萬，兩部電影「雙強聯手」，被影迷戲稱「台

  灣也有自己的《芭本海默》。」


  --'
