title: 'Re: [討論] 看不見的國家這麼多人看喔？'
content: '你是活在平行宇宙的台灣嗎？


  哪有很多人看？


  國賓根本幾乎半張票都沒人訂。


  台灣片真是越來越不賣座了，


  可能台灣拍不出什麼好片吧。


  可是台灣鬼片、角頭片還是至少會有人訂票。


  像這部片幾乎沒有半個人訂票的，


  真的很少見。


  大家知道原因嗎？


  嘻嘻



