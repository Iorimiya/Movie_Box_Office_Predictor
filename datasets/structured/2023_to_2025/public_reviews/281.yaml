title: '[新聞] 紀錄片「看不見的國家」 上映7天票房破'
content: "新聞網址：\n\n\n紀錄片「看不見的國家」 上映7天票房破千萬\n\n（中央社記者邱祖胤台北20日電）紀錄片「看不見的國家」上映一週，票房突破千萬大關，\n\
  已返美的導演葛靜文得知捷報後開心驚呼Wow，並感謝台灣民眾的支持。\n\n根據海鵬影業新聞稿，美籍導演葛靜文以她分別待過兩岸的經驗，並貼身採訪前總統蔡英文\n\
  ，記錄台灣從威權體制走向民主轉型、性別平權、同婚合法，以及追求台灣人身分認同的發\n展過程。\n\n新聞稿指出，「看不見的國家」自13日上映以來即掀起討論，上映首週末即熱賣新台幣480\n\
  萬元，第4天更在平日週一賣出100萬元；因民眾觀影需求熱烈，許多人反映買不到票，放映\n戲院也從原本的65家增至74家。\n\n紀錄片在社群平台Threads上的相關討論已累積百萬瀏覽數，其中收錄韓國女團TWICE台灣成\n\
  員周子瑜2016年被迫錄製道歉影片的片段、看到「花媽」陳菊重回當年監禁處聊心路歷程、\n台灣選手在奧運奪金於會場強忍淚水看著會旗冉冉升起，都令觀眾止不住淚水。（編輯：張\n\
  雅淨）1140620\n\n--\nSent from my Google Pixel 9 Pro XL\n\nPiTT \n\n--"
