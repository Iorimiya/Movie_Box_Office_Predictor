url: https://www.ptt.cc/bbs/movie/M.1750221363.A.1E6.html
title: '[新聞]《看不見的國家》被酸拿稅金拍幹片！製片'
content: '新聞網址：



  《看不見的國家》被酸拿稅金拍幹片！製片怒曝真相：再造謠就告



  《看不見的國家》6月11日舉辦上映記者會，製片馮賢賢（左）與美國導演葛靜文（右）

  合影。（資料照）


  劉晉仁／核稿編輯


  〔即時新聞／綜合報導〕紀錄片《看不見的國家》（Invisible Nation）由美國導演葛靜

  文（Vanessa Hope）執導，劇情以台灣首位女性總統蔡英文為核心人物，。


  近日該片在台上映，卻有一票藍白粉在網上痛批「拿台灣人的稅金拍這種幹片」，讓擔綱

  該部電影的製片馮賢賢跳出來怒曝真相，直言「誰再造謠就提告！」


  《看不見的國家》這個月在台灣上映，引發關注，沒想到包括Threads在內等社群，出現

  一票藍白粉痛批該部電影，諸如「我繳的税，不是拿來讓你們拍幹片的」、「拍這種爛片

  ，不知道可以拿多少補助？如果你想浪費錢、有嚴重失眠問題可以考慮看不見的國家，整

  部片出現的人對比現在的高官俸祿，讓人有嚴重出鏡、噁心、想快點逃離電影現場。看完

  只有一種感覺，這是給小學生洗腦的電影」、「就是民進黨洗腦台灣人的宣傳電影」等貼

  文，掀起網友熱議。


  相關貼文也馬上被其他網友發現內容大同小異，疑似「中央廚房」出產的模板文。《看不

  見的國家》台灣官方Threads也隨即發聲強調：「這部片的拍攝的資金全部都是美國導演

  自主籌資，無花到台灣政府任何一毛錢。我們僅有合法合規地申請文化部的行銷相關的補

  助，目前補助金額也尚未確認及公布。」


  其他網友則紛紛表示：


  「






  「網軍就是這樣，明明就是美國導演自主籌資拍的，被這樣亂抹，人蠢真是沒藥醫」


  「這些人根本就沒去看過這部電影吧」。


  而馮賢賢對於這些汙衊、抹黑也相當不滿，在臉書發文開砲：「



  」




  --'
