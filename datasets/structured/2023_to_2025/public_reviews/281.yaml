title: '[新聞] 真正臺灣之光！《看不見的國家》突破3200'
content: "新聞網址：\n\n\n\n真正臺灣之光！《看不見的國家》突破3200萬　他們看完落淚捨不得走\n\n▲真正的臺灣之光！《看不見的國家》2025年7月7日破3200萬，觀眾看了哭了，電影散場\n\
  了捨不得走。（圖／翻攝自《看不見的國家》紀錄片預告）\n\n真正是「臺灣之光」！《看不見的國家》6月13日上映以來，打破紀錄片上映天數紀錄、7\n天票房破千萬，統計到7月7日票房已經突破3200萬。導演葛靜文在得知票房長紅，第一時\n\
  間的反應是「」。這部紀錄片以台灣第一位女總統蔡英文為核心人物，紀錄台灣從\n威權體制走向民主的轉型路程。記者持續三天下班時間到不同戲院觀察，在週間時段宛如\n\
  週末夜晚，人潮滾滾，就是來看《看不見的國家》。\n\n《看不見的國家》7月7日票房破3200萬  \n\n《看不見的國家》掀起觀影熱潮，上映7天票房破千萬，美國氣質才女導演葛靜文（\n\
  Vanessa Hope）執導的《看不見的國家》（Invisible Nation）6月13日上映，第一個週\n末熱賣480萬。從第4天起更在平日週一賣出100萬，接下來每天票房節節高升。統計到7月\n\
  7日為止票房已經累積到3206萬。票房長紅，讓已經回美國的導演葛靜開心驚呼：「Wow！\n」謝謝台灣民眾支持。\n\n《看不見的國家》口碑發酵  \n\n葛靜文以分別待過兩岸的經驗、破天荒獲蔡英文總統的貼身採訪機會，記錄台灣從威權體\n\
  制走向民主轉型、性別平權、同婚合法化，以及追求台灣人身分認同的發展過程。從歷史\n脈絡與政經現實的交會，結合台灣人自身經驗、以及她在海外的觀察，反思討論國際視角\n\
  下的台灣，描繪臺灣這座400年來不斷被殖民的島嶼，在爭取民主、自主和免於威權侵略\n恐懼的自由之路上的掙扎路程。\n\n《看不見的國家》破了紀錄片的紀錄，口碑發酵讓上映天數長、票房累積不斷增加，記者\n\
  持續三天下班時間到不同戲院觀察，在週間時段宛如週末夜晚，人潮滾滾，就是來看《看\n不見的國家》熱門社群平台Threads上的相關討論，已經累積超過百萬瀏覽數，觀眾紛紛\n\
  討論片中哭點。\n\n1.TWICE台灣成員周子瑜在2016年被迫錄製道歉影片片段。\n2.「花媽」陳菊重回當年監禁處聊心路歷程。\n3.台灣選手在奧運奪金時會場播放中華民國國旗歌時，強忍淚水看中華台北奧運會旗冉冉\n\
  升起....\n\n▲週間下班時間宛如週末，民眾下班揪伴來看《看不見的國家》。（圖／記者鍾志鵬攝影\n）\n\n蔡英文臉書：\n\n蔡英文在臉書上表示，「這不是一部關於我的紀錄片，而是一部關於台灣的紀錄片。它描\n\
  繪了我們如何從一個曾經被忽視、被打壓的『看不見的國家』，一步一步走向世界的舞台\n。我們靠著對民主價值的堅持、對自由多元社會的珍惜，以及在科技與經濟實力上的努力\n\
  與突破，讓世界終於開始看見台灣」。\n\n\n--"
