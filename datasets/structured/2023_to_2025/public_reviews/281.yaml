url: https://www.ptt.cc/bbs/movie/M.1750488708.A.652.html
title: '[新聞] 《看不見的國家》全台票房飆破千萬！播映'
content: '《看不見的國家》全台票房飆破千萬！播映戲院增長至 74 間，引發觀影熱潮


  2025-06-20 電影神搜



  美國導演葛靜文執導紀錄片《看不見的國家》6 月 13 日在台上映，在社群媒體上掀起熱

  潮，也帶動觀眾進場看電影。


  已返回美國的葛靜文得知捷報後，驚喜直呼：「Wow！」並感謝台灣觀眾熱情支持。她以

  自身曾居住兩岸的經驗，破天荒獲得蔡英文總統貼身採訪機會，記錄台灣從威權走向民主

  、性別平權、同婚合法化與身分認同發展。《看不見的國家》結合歷史脈絡、政經現實與

  自身觀察，呈現這座 400 年來多次被殖民的島嶼，在民主與自由之路上的掙扎與奮戰。


  根據《三立新聞網》專訪導演葛靜文，她談到拍片七年，最困難的是資金與等待。紀錄片

  不像劇情片能一次獲得大筆資金，而是分段籌措，


  「我們常常拍到一半沒錢，只能停拍等資金到位。我們面對的挑戰，就像台灣在國際上遭

  遇的那種『小國、邊緣化』的待遇一樣。」


  幸好有來自舊金山某基金會的女性和平主題專案給予初期大額資助，葛靜文對此表示：


  「那是我人生中最大的一筆補助，但即便如此，也不足以一次拍完。」


  而拍攝過程中最讓葛靜文動容的一幕，則是 2016 年總統大選前夕的周子瑜事件：


  「她只是個 16 歲的 K-pop 少女，卻因為揮了國旗就被逼道歉，還被中國封殺，這太荒

  謬了。」


  而蔡英文在第一時間為她發聲，讓她深受感動：


  「那一刻我覺得，這不只是選舉的勝負，而是關於價值的選擇。」


  社群媒體上也有不少女團 Twice 的粉絲提及《看不見的國家》中子瑜的段落，令他們淚

  灑電影院，也成功掀起一波討論度。




  連結：


  --'
