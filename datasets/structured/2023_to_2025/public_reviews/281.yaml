url: https://www.ptt.cc/bbs/movie/M.1750568632.A.067.html
title: '[新聞] 一票難求！《看不見的國家》上映一週狂'
content: "一票難求！《看不見的國家》上映一週狂賣千萬 戲院緊急加開\n\n曾郡秋綜合報導\n\n發布 2025.06.20 16:54\n\n紀錄片《看不見的國家》自6月13日在台上映以來熱度持續攀升，首週末便創下480萬元票房\n\
  ，週一單日再破百萬，上映一週已突破1000萬元。導演葛靜文得知後驚呼「Wow！」，並感\n謝台灣觀眾的支持。電影題材引發跨世代觀影潮，更吸引商家發起憑票根送美食活動，獲得\n\
  網路熱烈響應。\n\n由美國導演葛靜文執導的紀錄片《看不見的國家》，透過她在兩岸居住的經歷，深入記錄台\n灣從威權體制轉型至民主社會的歷程，題材涵蓋性別平權、同婚合法化與身分認同等議題。\n\
  她也罕見獲得總統蔡英文專訪機會，從第一人稱視角呈現這座400年歷經殖民的島嶼如何在\n自由與民主間奮力前行。\n\n該片上映首日便吸引大批觀眾進場，特別是平常不常觀影的群體也被吸引。上週末票房開出\n\
  紅盤，累積達480萬元，週一平日單日票房也突破百萬。週二票房較前一日再增18.5％，全\n台上映戲院數也從原本的65家擴展至74家，至今總票房正式突破千萬元。\n\
  \n電影上映後，在社群平台Threads上引起廣泛討論，累積瀏覽量已超過百萬。不少觀眾反映\n場次爆滿，「票怎麼那麼難買」成為熱門話題，甚至平日白天場次也座無虛席，顯示觀影熱\n\
  潮不僅止於特定族群。\n\n\n原文網址:  | 娛樂 | Newtalk新聞 \n\n--"
