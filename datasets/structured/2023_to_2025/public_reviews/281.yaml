title: '[選片] 《厲害了我的國》vs《看不見的國家》兜己'
content: "如題 誠心發問\n\n這兩部片有沒有都看過的？　\n\n其實我是想都看啦　但因為時間不夠用　所以想請各位幫我從中挑一部\n\n主要最近看太多娛樂、特效類型的，恐怖也看了不少\n\
  \n實在有點厭倦了　想換換口味　\n\n所以我想找一部跟國家進步建設、社會文明經濟有關的片子　\n\n讓腦子充電一下　不要被太多五光十色的娛樂題材麻醉到死\n\n\
  \n所以回主題\n\n請問《厲害了我的國》和《看不見的國家》\n\n這兩部片　哪一部比較強？\n\n\n有何相似、相異處？　請看過的都來分享一下　甘溫\n\n\n\
  \n   有特定喜好或需求，想請朋友開片單   請選 3.[片單]\n   已知劇情詢問片名，    請選 2.[問片]\n\n◎ 此為搏杯文，適用於已有兩三部備案，不知該如何選擇的情況。\n\
  \n   1. 請在標題上註明片名，以便爬文， ex. [選片] 原始啟動碼 殺客同萌\n                                  \
  \              (標題必須打上片名)\n\n   2. 要板友幫你搏杯前，請先述明「特定需求」或「個人偏好的電影類型」。\n\n   3. 在發文前，請按\
  \ \"/\" 搜尋 \"選片\"，近一個月內重複者將視為op刪除。\n\n   以上四點任一不合規定，即觸犯本板板規。\n\n\n--\n   別鬧了, bro......\n\
  \   快笑死\n　 感謝分享\n   感謝分享\n   人家在上面認真回答我也是感謝他分享 你在這喊板主是???\n   你正在講讓人聽不懂的話喔"
