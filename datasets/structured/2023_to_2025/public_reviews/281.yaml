url: https://www.ptt.cc/bbs/movie/M.1750625520.A.3FB.html
title: '[好雷] 看不見的國家 '
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看不見的國家 個人覺得說是一部大內宣電影也不為過


  但是不掩它是一部好看的類紀錄片政治類電影的本質


  當初是在網路上看到推薦 剛好又有空才買票進場


  週末的晚場 沒有想到這樣的電影在阿湯哥同檔期也可以幾乎滿場 即便是小廳



  接下來談談內容（微雷）


  有些看過的人有提過 這部大概是從李前總統時代（更前面的蔣總統也有提到）


  大概是那個時期開始的台灣近現代史的電影


  對六七年級生來說應該內容不會陌生


  但是對於已知的內容 還可以覺得拍得好看 確實就見仁見智


  我個人是覺得蠻好看的


  特別是很多素材應該都是新聞畫面剪輯而來


  能夠串成一個完整好看的故事 我覺得也蠻不容易


  當然有些比較挑剔的人會說沒有阿扁那一段


  不過我覺得不影響整體故事的可看性


  個人最喜歡的橋段是世衛官員視訊受訪的那一段


  堂堂世衛官員還要假裝收訊不良拒答問題 實在很好笑也很可悲


  但這就是國際社會的現實


  這一段特別喜歡的原因是因為很像捍衛戰士獨行俠電影中


  阿湯哥拒絕聽從上司命令取消試飛新戰機的橋段


  假裝收訊不良的即視感 有戳中我的笑點ＸＤ


  以上簡單的心得 跟大家分享


  不排斥政治類電影的話 個人蠻推薦進電影院看看～


  --'
