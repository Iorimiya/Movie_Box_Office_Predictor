url: https://www.ptt.cc/bbs/movie/M.1749716201.A.58C.html
title: '[新聞]《看不見的國家》將上映 導演哽咽喊話台灣'
content: '新聞網址：



  「看不見的國家」將上映 導演哽咽喊話台灣不孤單



  紀錄片「看不見的國家」（Invisible Nation）11日在台北光點華山電影院舉行記者會，

  美籍導演葛靜文（Vanessa Hope）來台宣傳，主辦單位特別準備台灣造型的鳳梨酥給她品

  嚐。中央社記者王騰毅攝 114年6月11日


  （中央社記者王心妤台北11日電）紀錄片「看不見的國家」將在台灣上映，電影已在多國

  放映，導演葛靜文哽咽表示，最想對台灣說「謝謝你們，你們並不孤單。」她也說，得知

  家鄉洛杉磯目前狀況，或許想搬來台灣。


  導演葛靜文（Vanessa Hope）、製片馮賢賢、泰德霍普（Ted Hope）、主角之一的民進黨

  立委吳沛憶今天出席「看不見的台灣」記者會。葛靜文表示，因為求學來到台灣，曾萌生

  拍攝已故前總統李登輝就職典禮的想法，發現台灣即將選出首位女總統後，就開始聯繫台

  灣製片人馮賢賢，也開始拍攝前總統蔡英文的畫面。


  美國移民暨海關執法局（ICE）掃蕩非法移民引發的抗議活動入夜後情勢惡化，搶劫和破

  壞行為重創洛杉磯，市中心部分地區也開始實施宵禁。葛靜文表示，飛來台灣過程都在想

  著警車、軍隊或是街頭抗爭的影響，讓這次來台灣變得更有意義，她也表示，想要搬來台

  灣。一旁的吳沛憶則邀請她住在選區萬華、西門附近。


  「看不見的國家」已經在義大利、波蘭等地放映過，葛靜文表示，收到許多觀眾的回饋，

  但沒有收過壓力或威脅，但目前的確不會去中國、香港等地。葛靜文期待透過這部片讓更

  多人看到台灣民主自由的可貴，還有對抗極權威脅的樣態，「獨裁很可怕，而民主為什麼

  重要，從美國現在的樣子就能理解。」


  吳沛憶表示，紀錄片拍下她10年的成長，就像初期拍攝她是個幕僚，到現在成為立委，電

  影不只是展現台灣的民主，也是讓女性故事被看見，「女性過去很容易變成一個隱形角色

  ，但現在讓大家看到台灣女性的力量，從總統、民意代表到民間的社會力量、公共領域學

  者，都是台灣改革很重要的力量。」


  「看不見的國家」將於13日在台灣上映，葛靜文受訪最後哽咽表示，最想對台灣觀眾說「

  謝謝」，還有希望台灣知道自己並不孤單。（編輯：林恕暉）1140611



  紀錄片「看不見的國家」透過美國導演葛靜文（Vanessa Hope）（圖）貼身跟拍和訪問，

  紀錄前總統蔡英文執政8年的重大里程碑。葛靜文11日在台北光點華山電影館出席記者會

  ，分享拍攝歷程。中央社記者王騰毅攝 114年6月11日


