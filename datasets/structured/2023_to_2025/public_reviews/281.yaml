content: '前幾篇不知道為什麼一直吵這部有沒有人看


  其實直接看票房資料就知道了


  這是昨天平日的禮拜四，全台單日票房排名和累積票房


  No.1 馴龍高手 313.9萬，累計: 4829.7萬

  No.2 不可能的任務最終清算 214.1萬，累計: 4億656.6萬

  No.3 看不見的國家 159.1萬，累計: 1050.2萬

  No.4 捍衛任務復仇芭蕾 154.8萬，累計: 5601.8萬

  No.5 28年毀滅倒數 152.9萬，累計: 414.3萬

  No.6 星際寶貝史迪奇 60.7萬，累計: 9390.3萬


  看不見的國家排名第三名，上週末開始上映到昨天累積1000萬


  跟其他國片相比算好還是不好，大家自己判斷吧0.0


  資料來源：台北票房觀測站FB


