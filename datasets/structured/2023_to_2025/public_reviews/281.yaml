url: https://www.ptt.cc/bbs/movie/M.1750506263.A.F8E.html
title: '[新聞] 《看不見的國家》掀觀影熱潮　熱血店家'
content: '《看不見的國家》掀觀影熱潮　熱血店家憑票根換美食


  發佈時間2025.06.20 17:37 臺北時間


  更新時間2025.06.20 17:37 臺北時間


  在《看不見的國家》中，葛靜文以她分別待過兩岸的經驗、及獲蔡英文總統的貼身採訪機會

  ，記錄了台灣從威權體制走向民主轉型、性別平權、同婚合法化，以及追求台灣人身分認同

  的發展的過程。葛靜文藉歷史脈絡與政經現實的交會，結合台灣人自身經驗、以及她在海外

  的觀察，反思並討論了國際視角下的台灣，描繪了這座400年來不斷被殖民的島嶼，在爭取

  民主、自主和免於威權侵略恐懼的自由之路上的掙扎。


  蔡英文在總統任內接受葛靜文採訪並拍攝《看不見的國家》，愛貓的出現為蔡英文加了很多

  分。（海鵬提供）


  《看不見的國家》自13日在台上映以來，吸引許多平時不常進戲院的民眾買票相挺；不少觀

  眾直呼「票怎麼那麼難買」，甚至平日場次也有高滿座率，週二的單日票房甚至比週一成長

  18.5%，之後不斷向上攀升，目前數字已突破1,000萬元大關。


  看過電影的觀眾討論片中收錄TWICE台灣成員周子瑜在2016年被迫錄製道歉影片片段、或看

  到「花媽」陳菊重回當年監禁處聊心路歷程、我國選手在奧運奪金時會場播放中華民國國旗

  歌強忍淚水看中華台北奧運會旗冉冉升起……都說片中哭點實在太多，眼淚根本止不住。


  《看不見的國家》迴響熱烈，有家長表示想帶年輕子女進戲院了解台灣的民主發展進程、也

  有子女表示想帶立場不同的父母觀賞，拉近彼此之間的思想鴻溝。有店家發起「憑票根換美

  食」的活動。包括在台北開店的香港老闆看完後發起客人「憑電影票根每桌送一份咖喱魚蛋

  」、台中南屯區麵包店豪氣讓客人換10個蔥麵包、彰化酒吧大方招待調酒與苗栗咖啡店可換

  咖啡……這些慷慨的店家們，不約而同表示想藉此讓更多人看到《看不見的國家》，這份熱

  血也讓其他人直呼感動。《看不見的國家》現正上映中。




  --'
