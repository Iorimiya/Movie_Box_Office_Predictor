url: https://www.ptt.cc/bbs/movie/M.1750580568.A.482.html
title: ［普雷］看不見的國家
content: '很少看紀錄片，還可以記得上次是看「赤心巔峰」，再上次是看「我們的青春，在台灣」

  ，老實說這次「看不見的國家」沒有到上述兩部的感動程度，即使如此，頒獎台只能升會

  旗、放國旗歌的段落還是跟著掉了幾滴眼淚。


  首先，「看不見的國家」從片名、內容到訪談都是提供給外國人的視角，其實沒有接受到

  太多新資訊，對於稍微有在關心時事的台灣人應該很熟，從1996第一屆民選總統開始都是

  親身的回憶，再早的兩蔣、戒嚴、退出聯合國等，雖然不是這個世代，但從課本、媒體、

  網路得到的資訊量也夠多了。


  訪談的部分，有感覺到聚焦在女性政治人物，陳菊、蔡英文、蕭美琴、吳沛憶，無奈國民

  黨女性找不出同等份量的人物，只有馬英九出來撐場，儘管篇幅比例不對稱，但也沒有刻

  意醜化，就是呈現兩黨不同的政治理念，多少可以讓外國人認識台灣政治對立的衝突點在

  哪裡。


  這部片對台派、支持大罷免的人來說，內容熟到不行，其實更推薦不關心政治的人能夠透

  過這部片了解台灣處境，很可惜12歲以下不能看，希望之後能剪一個普級版，把暴力片段

  修掉，讓學童也有機會認識台灣的一切得來不易。


  題外話1，原本父母預計要去看，先看完回家報告馬英九畫面很多，也沒太多新資訊，他

  們就放棄去看了...


  題外話2，後來把「我們的青春，在台灣」找出來看，強調一下，真的不是造神太陽花或

  陳為廷的電影，除了跟拍陳為廷還有一位陸生蔡博譯，太陽花後期意見分裂、難堪退場、

  陳為廷性騷擾、陸生受不平等待遇等醜態，都拍出來了，現在重看，陳為廷訪中國、香港

  那段又難過又好笑，尤其看到黃之鋒、中聯辦...不勝唏噓。


  --'
