url: https://www.ptt.cc/bbs/movie/M.1742487457.A.820.html
title: '[包場] 看不見的國家 3/29 光點華山電影院 '
content: '電影版的大家好，以下是我幫忙朋友宣傳包場的資訊



  ＊＊＊＊＊＊＊＊＊＊＊＊＊



  看不見的國家 Invisible Nation


  大家好我是Andy，我舉辦了場「看不見的國家」(Invisible Nation) 的電影包場活動！

  歡迎大家一起揪團來看時間：3/29 (六) 19:30

  地點：光點華山電影院 (台北市中正區八德路一段1號)

  費用：每人$200

  報名：



  ［適合誰來看？］


  本片以國際局勢的角度，描述台灣從威權走向民主，以及台灣近年在世界政治角力下的處

  境。非常適合對於國際關係有興趣，以及關心台灣民主的朋友。尤其在近幾個月台灣內部

  政治對立之下，更該好好的認識台灣的土地與故事，並傳遞給更多人了解民主的得來不易

  。


  ［為什麼我想辦電影包場］


  本片於去年即在多個世界級影展播出，並引起諸多迴響，讓國際更了解台灣近年的發展。

  在台灣方面，原訂今年三月底就要上映，但是發行商又臨時延期至六月，所以我想要搶先

  舉辦包場讓更多台灣人能先看到，這個屬於台灣人的故事！

  *僅此一場，錯過就要等到六月！*


  ［電影介紹］


  本片紀錄台灣從威權向民主轉型、性別平權、同性婚姻合法化和追求台灣人身分認同的發

  展。並描述過去幾年間，台灣在中國與美國間承受的地緣政治壓力，以及台灣如何面對和

  走到現在。


  導演葛靜文（Vanessa Hope）：「台灣的歷史和民主的故事需要被國際社會瞭解，這對台

  灣人民的未來非常重要。只要國際社會更加認識台灣，中國就不能主張擁有台灣，四處聲

  稱他們有權對台灣為所欲為。


  片名取『看不見的國家』反映了台灣在國際舞台上尋求能見度的長久努力，更何況台灣現

  行的官方名稱是中華民國，對於不理解歷史背景的外國人來說很容易誤解。」





  ＊＊＊＊＊


  我朋友是一位年輕有為又浪漫的文藝青年，這次第一次大手筆包場，但目前售票只有 50

  多人，全部位置有 133 席，歡迎大家 29 號花上兩百塊來支持～


  謝謝！


  --'
