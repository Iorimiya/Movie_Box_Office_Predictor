title: '[新聞] 台灣紀錄片《看不見的國家》出現周子瑜'
content: '新聞網址：



  台灣紀錄片《看不見的國家》出現周子瑜！粉絲看了喊傷心


  記者石亞萱／綜合報導




  ▲台灣紀錄片《看不見的國家》日前上映，引網熱議。（圖／取自蔡英文臉書）


  由美籍導演葛靜文執導的紀錄片《看不見的國家》近日上映，卻因內有子瑜片段而引網友

  反應兩極，一邊喊「ONCE才該看」，另一邊認為「消費子瑜」、「被傷口上灑鹽」。


  《看不見的國家》近日上映，前總統蔡英文就發文表示，《看不見的國家》是一部關於台

  灣的紀錄片，描繪了台灣如何從一個曾經被忽視、被打壓的「看不見的國家」，一步一步

  走向世界的舞台，靠著對民主價值的堅持、對自由多元社會的珍惜，以及在科技與經濟實

  力上的努力與突破，讓世界終於開始看見台灣。


  卻有網友在看了該片後發文指出，有人在呼籲ONCE（子瑜出道團體的粉絲名稱）們如果想

  看《看不見的國家》前好好考慮，裡面有消費子瑜的片段。那種重要事件對紀錄片導演來

  說何其重要，被說成是消費，只能說遺憾。


  但也有網友認為：「這就叫在傷口上灑鹽，不要用假正義去情勒不敢看的人，難道那部影

  片我們不知道嗎，追星等於政治，但不代表可以這樣直接戳別人的傷痛。」


  對於子瑜的片段網友反應兩極，底下也有大票網友表示：


  「JYPE的Youtube頻道還不下架那支影片，那才叫真正的消費」


  「我倒覺得once都應該去看」


  「那段根本不是在消費周子瑜」


  「once才更應該要看好嗎，畢生不會忘記這件事情的罪魁禍首是誰」


  「身為once又擔子瑜的真的不敢看那部影片」


  「消費子瑜的是中國政府，逼迫子瑜的也是中國政府」等等。




  --'
