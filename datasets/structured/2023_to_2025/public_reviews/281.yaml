url: https://www.ptt.cc/bbs/movie/M.1750218872.A.37E.html
title: '[好雷] 看不見的國家'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  隨著俄羅斯入侵烏克蘭邁入第四年，近來台灣境內也陷入台海威脅升溫的氛圍。美國導演

  葛靜文在台灣首任女總統蔡英文任內拍攝的紀錄片《看不見的國家》，從外國人的眼光看

  這座民主蓬勃發展的小島，如何擁有成為「國家」的一切，卻又總是不見於全球組織與世

  界地圖。



  導演葛靜文於2016年見證臺灣人選出首位女總統的創舉，當看見螢幕打出「我們是臺灣人

  」，觸動她決定拍攝這部電影，「我深受臺灣人民的啟發」。這次她拍攝《看不見的國家

  》，史無前例獲准近距離貼身採訪蔡英文，並記錄蔡英文八年總統任期內，臺灣的身分認

  同及民主發展，包括她如何採取堅定立場，面對中國軍事侵略和干涉內政。



  「Ring the bells that still can ring/Forget your perfect offering/There is a

  crack, a crack in everything/That''s how the light gets in」



  現任中華民國無任所大使、時任數發部部長唐鳳，在紀錄片當中引用加拿大小說家、創作

  歌手、詩人與音樂人李歐納‧柯恩（Leonard Cohen）的歌曲《Anthem》裡的歌詞。這首

  歌強烈表達李歐納對保守、改革與希望的觀點。唐鳳藉此告訴台灣人，切勿放棄希望，且

  在還能為自己的信念奮鬥之時抓緊機會。「萬物皆有裂縫，那就是光照進來的地方。」即

  便台灣在世界舞台總是遭到抹除，只要我們不妄自菲薄，持續努力，終有希望。



  身為女性，導演葛靜文不但將其外國人的視角表現在《看不見的國家》裡，更展現台灣女

  性從政的剛毅。除了唐鳳與蔡英文之外，片中也集結不少台灣的女性政治人物，呈現出這

  片土地的平權發展。像是現任立法委員吳沛憶講述自己如何從對政治無感，到經歷太陽花

  學運後，深深體會到「沒有人是局外人」而投身政壇；現任監察院院長陳菊以美麗島事件

  政治受難者的身分，回到當初收容的景美看守所，見證台灣從白色恐怖走到現在民主大鳴

  大放的歷程；現任副總統、時任駐美代表蕭美琴，以她獨特的世界公民角色分析美台關係

  ，並擔任「同性婚姻法」的重要推手。




  除此之外，前副總統呂秀蓮也多次以隨行蔡英文總統的方式，出現在紀錄片當中。美國歷

  史上首位女性眾議院議長斐洛西訪問台灣，在當時被視為挑釁中國的行動。不過，《看不

  見的國家》除了藉由這次訪問表現當時美國與台灣的外交關係，也以斐洛西與蔡英文的會

  面展現出女性視角與女性參政的現在與未來。



  《看不見的國家》的敘事像是一堂輕鬆的歷史課，不論是對台灣的過去不熟悉的人，還是

  外國人，都能夠在短短80分鐘內大致了解台灣複雜的歷史。從荷西時期、明鄭時期到清領

  時期、日治時期，都以清楚的動畫呈現，並明確指出唯有二戰結束後的1945到國民政府迫

  遷來台的1949年間短短4年，兩岸才由「中國國民黨」以「中華民國」的名義共治，自此

  之後各不相屬。此一史觀，對於認同自己國家為台灣或中華民國的台灣人，都屬中立不偏

  頗的陳述。



  同時，也透過國內外學者與政治人物的角度，帶出現今生活在台灣這塊土地上的人民對自

  己的國族認同，以及背後乘載多少民主之父李登輝的努力。另一方面，中國對台策略有何

  改變，以及習近平在其第二任期期間取消國家主席連任限制，也都可以在紀錄片中看見。

  不管是台灣做為一個地區還是台灣人民所受到的外部威脅，都清楚呈現。




  但是，作為一部紀錄片，《看不見的國家》仍舊有其意識形態。即使居住在這塊土地上的

  大多數人都認同自己為「台灣人」，仍有很多樂見統一者，無論是被統一還是華統（以中

  華民國收復失土），但紀錄片卻沒有為這些人發聲，稍嫌可惜。片中固然也有呈現出馬英

  九與吳敦義對台灣人民要團結的肯定，但整體來說的確比較容易讓非民進黨支持者感到反

  感，反而會讓這個群體失去觀影興趣。



  可是，《看不見的國家》除了歷史意義之外，最大的貢獻在於將台灣的包容與多元展現給

  世界看。林昶佐代表的是在台灣，音樂人也能從政；同性婚姻在台灣合法，使其成為亞洲

  第一個合法的地區；各種公民運動與抗議活動時不時都能在街頭看見。這些台灣最真實的

  面向與生活都在紀錄片當中忠實呈現，是不論政治局勢如何都無法否定與改變的，但求世

  界能夠看看這座美麗的寶島一眼。



  《看不見的國家》從外國人的視角呈現出發人深省且忠實的觀察，每一位地球村的公民與

  台灣人都值得一看，並從中找出這座早已是實質國家的小島上，難能可貴的民主、美麗與

  自由。


  --

  Viola''s World：Screen Scream影迷尖叫屋


