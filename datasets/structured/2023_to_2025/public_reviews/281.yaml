url: https://www.ptt.cc/bbs/movie/M.1750409388.A.058.html
title: '[新聞]美國導演用第三視角看台灣《看不見的國家'
content: '新聞網址：



  民視新聞網/ 美國導演用第三視角看台灣　《看不見的國家》引台人共鳴


  影音中心／陳瑞婷報導


  由美國導演葛靜文（Vanessa Hope），所執導的紀錄片《看不見的國家》，以台灣首位女

  性總統蔡英文為核心人物，記錄了台灣從威權體制走向民主、性別平權、同婚合法化，以

  及追求台灣人身分認同的發展過程。


  而YouTube頻道「486系列之486街頭全民調」也在日前進行街訪，發現這部電影引發不少

  民眾共鳴，尤其是經歷過戒嚴時期的人，都認為大家應該要跟著美國導演，「用第三視角

  重新認識台灣」，才會知道現在踩著的這片土地正在發生什麼變化，以及面對中共的威脅

  ，更應該勇敢地站出來，讓世界看見台灣。


  影片這邊看



  #美國導演 #葛靜文 #看不見的國家 #紀錄片 #蔡英文 #台灣 #中國 #中共 #威權體制 #

  民主 #戒嚴


  --'
