url: https://www.ptt.cc/bbs/movie/M.1750126034.A.2F5.html
title: '[新聞] 《看不見的國家》讓世界看見臺灣 3位'
content: '新聞網址：



  《看不見的國家》讓世界看見臺灣 3位「女總統」力挺




  記者王丹荷／綜合報導


  　美籍導演葛靜文正在臺灣宣傳熱映中的紀錄片《看不見的國家》（Invisible Nation）

  ，她以外國人視角，以臺灣首位女總統蔡英文為核心人物，紀錄臺灣從威權體制走向民主

  轉型、性別平權、同婚合法化，以及追求臺灣人身分認同的發展的過程，讓世界看見臺灣

  。她的用心感動了無數臺灣人，此行更有3位「女總統」相挺，包括曾在螢幕扮女總統的

  呂雪鳳、Janet，前總統蔡英文在上映當天於臉書上以真摯而動人的文字，邀請所有人進

  戲院觀看這部極具意義的紀錄片，讓葛靜文相當感激與感動。


  　蔡前總統在臉書上表示，「這不是一部關於我的紀錄片，而是一部關於臺灣的紀錄片。

  它描繪了我們如何從一個曾經被忽視、被打壓的『看不見的國家』，一步一步走向世界的

  舞台。我們靠著對民主價值的堅持、對自由多元社會的珍惜，以及在科技與經濟實力上的

  努力與突破，讓世界終於開始看見臺灣。」




  　她更在臉書提到費時8年、克服諸多挑戰與難關的導演葛靜文，「我要感謝導演葛靜文

  與她的團隊，拍出這樣一部動人的作品。她們讓臺灣的故事，不再只是被遺忘的一角，而

  是被真實地記錄下來，傳遞出去，擺脫被忽略與掩蓋的宿命。這部片也讓更多人認識臺灣

  ，一個小小多山卻美麗而強韌的國家。」葛靜文獲知蔡前總統的推薦，感到受寵若驚與無

  比感動。


  　《看不見的國家》臺灣首映會上有Netflix夯劇《人選之人－造浪者》飾演女總統的呂

  雪鳳加持，在臺劇《零日攻擊》中同樣扮演女總統的謝怡芬（Janet）與葛靜文也有交集

  。上月在丹麥舉行的「2025哥本哈根民主高峰會」上，就上演著葛靜文與Janet、蔡前總

  統3人同時出席並在異地相會的「魔幻時刻」。


  　葛靜文此番來臺宣傳，也邀Janet在臺再聚，Janet也熱情盡地主之誼，帶著她逛寧夏夜

  市當吃貨，她倆邊逛邊暢聊電影相關話題，聊到蔡前總統時，葛靜文表示蔡前總統私下風

  趣、溫暖與從容，Janet 則笑著回憶蔡前總統曾以開玩笑口吻說：「Janet妳很幸運，妳

  不用競選就當上總統。」


  　Janet好奇詢問葛靜文：「這（《看不見的國家》）是1則很難去述說的故事。故事其實

  一直就在那裡。但大家可能會對說這則故事猶豫不決，或可能會變得泛政治化。妳怎麼想

  出述說的觀點？」葛靜文回答：「真的很不容易，但我試著以外來者的視角，針對臺灣『

  不被看見』的大方向、探究箇中原因與如何讓臺灣被看見。」




  　她們踏進寧夏夜市沒多久，就被花生捲冰淇淋吸引目光，Janet更推薦添加香菜會讓口

  味更有層次。有趣的是，香菜濃烈的氣味連不少國人都敬謝不敏，葛靜文卻大呼：「我愛

  香菜！」葛靜文也聊到自己1995到1996年間首度來到臺灣還是學生時，住在永康街一帶，

  對於國際馳名的「鼎泰豐」小籠包超上癮，還說自己愛吃「豆芽菜」。


  　但葛靜文的口味還是比較「老外」，對於內臟類、臭豆腐等食物不敢嘗試。與她同行的

  好萊塢名製片老公泰德霍普（Ted Hope，曾是李安多部作品製片）則充滿「吃貨精神」，

  大啖蚵仔煎、豬肝湯、豬血糕等在地美食，夫妻形成有趣對比。


  --'
