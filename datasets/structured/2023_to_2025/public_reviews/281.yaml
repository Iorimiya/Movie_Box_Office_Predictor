url: https://www.ptt.cc/bbs/movie/M.1748099846.A.E1A.html
title: '[新聞] 《看不見的國家》貼身紀錄蔡英文 導演葛'
content: '新聞網址：



  「看不見的國家」貼身紀錄蔡英文 導演葛靜文：盼為台發聲



  美國導演葛靜文（Vanessa Hope）（右）執導紀錄片「看不見的國家」，貼身紀錄前總統

  蔡英文（左）8年執政歷程。兩人日前在丹麥哥本哈根民主高峰會重逢，蔡英文感謝葛靜

  文持續支持台灣。（海鵬影業提供）中央社記者葉冠吟傳真 114年5月16日


  （中央社記者葉冠吟台北16日電）美國導演葛靜文執導紀錄片「看不見的國家」，貼身紀

  錄前總統蔡英文8年執政歷程。兩人日前在丹麥重逢，葛靜文表示，這是她從影以來最重

  要的經驗，盼藉此為台灣民主自由發聲。


  「看不見的國家」（Invisible Nation）透過美國導演葛靜文（Vanessa Hope）貼身跟拍

  和訪問，紀錄蔡英文執政8年的重大里程碑，並講述台灣民主歷史與現今面臨的世界局勢

  ，展現台灣社會在民主受到威脅之際，如何捍衛自由，讓世界看見台灣。


  根據片商新聞稿，日前蔡英文出席丹麥哥本哈根民主高峰會發表演說，導演葛靜文也在高

  峰會主持影集「零日攻擊」的首映座談，與首集飾演總統的演員Janet謝怡芬、導演鄭心

  媚暢聊。


  座談結束後，葛靜文和蔡英文在後台相遇，久別重逢的兩人特別開心。蔡英文也特別向葛

  靜文表達謝意，感謝她持續支持台灣。


  葛靜文坦言，拍攝「看不見的國家」是她從影職業生涯中最重要、最有意義的經驗，稱讚

  蔡英文在總統任期內強化台灣民主，期待未來能再次合作。


  葛靜文也提到，在「零日攻擊」座談開始前與Janet彩排時，兩人聊得意猶未盡，決定即

  便只有20分鐘，也要為台灣這個美麗的民主國家發聲，也獲得現場熱烈掌聲與共鳴。


  葛靜文期盼，透過作品讓國際社會了解台灣民主的重要性，也為在極權國家中渴望自由的

  人民樹立榜樣。「看不見的國家」將於6月13日在台上映。（編輯：龍柏安）1140516


  --'
