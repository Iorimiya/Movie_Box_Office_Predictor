title: '[好無雷] 看不見的國家   是中國人就該買票支持'
content: '今天剛看完真的是太感動了QQ

  在民進黨的帶領下

  台灣越來越像中國

  快變得跟中國一樣強大QQ

  真的覺得很感動


  回顧蔡英文這8年來的政績

  超買非走私

  3+11

  小吃店快篩

  巴西報廢蛋

  高端股價飆升

  等等

  這些回憶讓人民點滴在心頭QQ

  被蔡英文女士帶領下的中華民國

  變的越來越像中國

  能像中國一樣強大真的很感動……

  難怪台灣內有40%的中國人那麼支持民進黨


  最後我要再說一次

  中國人一定要買票進場支持QQ







  --'
