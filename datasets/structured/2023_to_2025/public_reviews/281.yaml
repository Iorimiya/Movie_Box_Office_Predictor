title: '[討論] 剛看完『看不見的國家』，無雷。'
content: '本篇無雷



  剛剛心血來潮

  看完電視新聞後

  充滿了一種欣喜感


  就決定再去看一遍那部電影

  畢竟這種曠世鉅作

  再不看，也沒機會看了


  畢竟預算也差不多快要被砍了

  很快這幫人就要被斷糧草了。


  且看且珍惜




  一進去院廳

  給我猜的一樣

  樹倒猢猻散


  空蕩蕩一片

  整場只有我一個人


  於是

  我就一人包場整部電影

  然後微笑聽著那外國人的聲音，就慢慢睡著了。



  因為幾乎睡了整場

  沒有什麼心得想給大家



  雖然花了我一筆小錢，還有可樂錢


  但我內心

  仍然充滿了喜悅感

  也有一種莫名充實的感覺


  很難形容

  能帶給我這樣歡樂的電影

  也真的只有這一部能做到。



  第一次影評。

  謝謝大家

  -----

  Sent from MeowPtt on my SH-M27



  --

  那倒沒有，本來想看有沒有觀眾還沒看就先哭

  但一個觀眾都沒有，自然也沒看到。


  大難臨頭各自飛的感覺比較強烈。

  07/27 17:39

  不行嗎？我不太懂規定

  但這部電影再搭配新聞，真的真的給我充實的娛樂感，是不爭的事實。

  對不起，沒有引戰意思

  真要講影評的話，大概就是冷氣好冷，然後音樂蠻助眠的

  這點給好評

  這樣可以嗎？'
