url: https://www.ptt.cc/bbs/movie/M.1750833763.A.0F6.html
title: '[新聞] 《看不見的國家》上映第二周聲量衝冠 票'
content: "《看不見的國家》上映第二周聲量衝冠 票房成長破1800萬\n\n\n記者周毓洵／臺北報導\n\n　由美籍導演葛靜文（Vanessa Hope）執導的紀錄片\n\
  　《看不見的國家》歷時8年拍攝，從一名外國導演的視角，細膩記錄臺灣自威權轉型至\n民主社會的進程，\n\n　，\n如今終於「帶片回家」，導演與團隊也形容這是意義非凡的時刻。票房表現上，《看不見\n\
  的國家》已超越《我們的那時此刻》，現居臺灣紀錄片影史第8名，僅次於《看見臺灣》\n、《十二夜》、《不老騎士》、《灣生回家》、《生命》、《臺灣超人》與《時代革命》\n\
  。\n\n　近期來臺宣傳期間，葛靜文積極參與映前映後活動，並受邀上聶雲主持的《The Taipei\n Tonight Show》節目訪問，這是她首度參與臺灣綜藝節目。節目中，她暢談拍片動機與\n\
  拍攝過程，更在「快問快答」橋段中被問到「想到臺灣會想到什麼字？」時，她脫口而出\n：「Love」，並透露下一部想拍的紀錄片人物是副總統蕭美琴。\n\n\n\n\n\
  --"
