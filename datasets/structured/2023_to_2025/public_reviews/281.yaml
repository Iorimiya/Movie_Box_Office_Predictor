title: '[新聞] 蔡英文愛貓也亮相！「看不見的國家」上映'
content: '新聞網址：



  蔡英文愛貓也亮相！「看不見的國家」上映7天票房破千萬　憑票根換美食



  蔡英文總統的愛貓蔡想想也難得在電影「看不見的國家」中亮相。圖／海鵬影業提供


  美國才女導演葛靜文（Vanessa Hope）執導電影「看不見的國家」（Invisible Nation）

  上映7天票房破千萬，因民眾觀影需求熱烈，許多人反映買不到票，更是從原來65家戲院

  ，再加入9間戲院放映。


  在「看不見的國家」中，葛靜文以她分別待過兩岸的經驗、破天荒獲蔡英文總統的貼身採

  訪機會，記錄了台灣從威權體制走向民主轉型、性別平權、同婚合法化，以及追求台灣人

  身分認同的發展的過程。


  葛靜文藉歷史脈絡與政經現實的交會，結合台灣人自身經驗、以及她在海外的觀察，反思

  並討論了國際視角下的台灣，描繪了這座400年來不斷被殖民的島嶼，在爭取民主、自主

  和免於威權侵略恐懼的自由之路上的掙扎。


  除此之外，全台甚至有店家紛紛發起「憑票根換美食」的活動。包括在台北開店的香港老

  闆看完後發起客人「憑電影票根每桌送一份咖哩魚蛋」、台中南屯區麵包店豪氣讓客人換

  10個蔥麵包、彰化酒吧大方招待調酒與苗栗咖啡店可換咖啡。電影「看不見的國家」目前

  已在台上映。


  葛靜文拍攝「看不見的國家」破天荒獲蔡英文總統的貼身採訪機會。圖／海鵬影業提供


  --'
