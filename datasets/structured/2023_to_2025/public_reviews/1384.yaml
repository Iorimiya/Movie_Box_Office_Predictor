title: '[ 好雷] 沒有國家的冠軍'
content: '在類包場的狀態下看完這部電影，

  不得不說，很好看。


  過程有好笑，更多的是感人，

  包括家人間的牽絆，夥伴間的支持，不放棄的精神。


  撇除嚴肅的國家立場，

  平鋪直敘的劇情，卻讓人動容。


  完全衝著河正宇去看的，演戲渾然天成，

  任時完神似宋仲基，賞心悅目，還有可愛的朴恩斌。


  不過觀影人數不多，

  真心推薦連假期間可以看部勵志感人的電影，需要帶衛生紙。


  謝謝分享票卷的網友，才沒錯失這部作品。


  --'
