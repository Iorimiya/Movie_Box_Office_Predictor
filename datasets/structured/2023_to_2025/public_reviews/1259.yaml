title: '[情報] 夢工廠動畫《魔髮精靈：樂團在一起》'
content: '夢工廠動畫《魔髮精靈：樂團在一起》今年 12 月上映 首支預告宣傳影片釋出


  （GNN 記者 阿Lu 報導） 2023-03-29 12:29:03




  今年聖誕節檔期夢工廠動畫將推出由安娜坎卓克和賈斯汀提姆布萊克率領明星配音演員陣

  容演出，色彩繽紛的家庭音樂喜劇動畫片《魔髮精靈》系列全新續集《魔髮精靈：樂團在

  一起》，預計今年 12 月在台上映。


  在前兩集經過友情的考驗和彼此不斷的打情罵俏之後，波比（安娜坎卓克配音）和小布（

  賈斯汀提姆布萊克配音）現在終於正式成為一對情侶了。正當這兩位小倆口的關係變得越

  來越親密，波比卻發現小布竟然有一個神祕的過去。他曾經是她最瘋迷的男孩團體兄弟樂

  團成員，那是他和他的四個兄弟佛洛伊（金球獎提名電音流行樂歌手特洛伊希文配音）、

  強多瑞（《歡樂好聲音 2》艾瑞克安德烈配音）、史布斯（葛萊美獎得主及《漢密爾頓》

  戴維德迪格斯配音）以及克雷（葛萊美獎得主及《千萬別抬頭》基德酷迪配音）共同組成

  的男孩團體。但是兄弟樂團在小布還是的小貝比的時候就已經解散，這一家人也跟著四分

  五裂，從那時候起，小布就再也沒有見過他的兄弟。


  但是當小布的兄弟佛洛伊因為他的音樂才華被兩個流行音樂的邪惡大壞蛋－凡菲（艾美獎

  得主及《姐姐愛最大》艾米舒默 配音）和凡尼（音樂劇《摩門之書》葛萊美獎得主及東

  尼獎提名安德魯蘭內斯 配音）－綁架之後，小布和波比就展開一場既驚險刺激又情緒激

  動的冒險旅程，希望小布和他其他的兄弟能夠重新聚首，救出佛洛伊，不讓他遭受比在流

  行音樂界成為過氣明星更悲慘的命運。


  《魔髮精靈：樂團在一起》這部全新音樂喜劇動畫片和前兩集一樣，都有歡樂無窮的全新

  和經典流行歌，豪華的配音演員陣容也找來許多流行音樂界的超級巨星和電影圈的知名喜

  劇演員，其中包括四度入圍葛萊美獎及拉丁葛萊美獎得主卡蜜拉卡貝羅（2021 年音樂浪

  漫喜劇片《灰姑娘》），她為薇娃配音；柔夏瑪美德（驚悚喜劇影集《謎飛空姐》），她

  為可依配音；以及曾經榮獲 12 座艾美獎的變裝皇后魯保羅查爾斯，他為美心姐配音。


  再度回歸為這部全新動畫片獻聲的配音演員則包括葛萊美獎、艾美獎及金球獎入圍者柔伊

  黛絲香奈，她為壁姬(壁寶)配音；克里斯多福米茲布拉斯為庫搜（小庫庫）配音；瑞典二

  人組合愛卡娜女王的艾諾賈瓦及卡洛琳耶爾特分別為大紅和大紫配音；葛萊美獎得主安德

  森帕克為丹王子配音；喜劇演員朗恩芬奇斯為褲哥配音；美國演員工會獎得主昆瑙納亞爾

  為白閃閃配音；以及艾美獎得主及《週六夜現場》傳奇喜劇演員基南湯普遜為小閃閃配音

  。


  導演華特道恩再度回歸執導《魔髮精靈：樂團在一起》，吉娜夏則再度擔任製片，共同導

  演是提姆海茲（《魔髮精靈唱遊世界》故事總監）。夢工廠動畫分別於 2016 年和 2020

  年推出《魔髮精靈》以及《魔髮精靈唱遊世界》，曾獲得一項奧斯卡獎最佳原創歌曲獎提

  名。


  --'
