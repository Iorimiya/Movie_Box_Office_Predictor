url: https://www.ptt.cc/bbs/movie/M.1741794085.A.19A.html
title: '[好雷] 窒息倒數'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  英國紀錄片與影集導演Alex Parkinson的首部劇情長片，改編自己2019年拍攝的同名紀錄

  片。雖說感動不足，但緊張有餘，仍舊是一部廣獲好評的作品，也獲得Heartland Film評

  選的最動人作品。



  改編真實海底災難事件，潛水員克里斯在一次「修復爆裂油管」時遇到意外而被困海底，

  氧氣瓶僅剩10分鐘可使用，而負責救援的隊友鄧肯與戴夫離救援現場卻至少30分鐘。一段

  充滿驚心動魄又扣人心弦的災難救援，先從屏住呼吸開始…



  全片採用不少攝影機視角，打造出觀眾也與潛水支援船上的船員一同觀看即時影像的臨場

  感。不論是與潛水主管一起從艦橋的監視器查看俗稱「錫罐」的飽和潛水艙與潛水鐘的狀

  況，還是透過水下無人載具一起在岐管周遭試圖尋找克里斯的蹤跡，這些逼真的水下攝影

  畫面都能讓觀眾身歷其境，並且感覺自己彷彿在看探索頻道或國家地理雜誌的節目。



  除了視覺上給予觀眾最真實的感受之外，由於導演曾經拍攝過相同題材的紀錄片，相關知

  識非常豐富，所以《窒息倒數》把飽和潛水的很多細節都呈現在大銀幕上。從一開始的字

  幕描述全球的海底布滿各種天然氣與石油管線，而這些管線都需要也只能由飽和潛水員來

  維修，因此這項潛入深海進行高技術性作業的工作是全世界最危險的職業之一。如此高風

  險的工作，相對地，報酬當然也很可觀，年薪約為50萬美元，另外還有深度加給。電影從

  潛水員進入飽和潛水艙開始加壓與輸入氣體，到裝備檢查、著裝，最後回到飽和淺水艙減

  壓，都一一呈現。即便本來對飽和潛水一無所知的觀眾，看完《窒息倒數》後，也能對這

  項職業有所了解。



  造成這起意外的原因是潛水支援船的動態定位系統故障，連帶導致推進器無法運作，不過

  ，技術問題發生沒多久，動態定位系統官就發現推進器沒有問題，手動操作還是可行，但

  是，當時他們正遭遇暴風雨，人為操作極為危險，一有閃失全船送命。原本潛水主管曾向

  船長提議拋錨，以免主船離克里斯越來越遠，但船長擔心拋錨會勾破海底的石油管線，造

  成環境浩劫，所以拒絕。可是，人命關天，一旦發現推進器尚能運作，即使必須手動航行

  也得放手一搏。



  就像《搶救雷恩大兵》裡，眾人身處砲火隆隆的戰場，還是要想辦法救出雷恩。只要尚有

  希望救回克里斯，支援船上沒有人想要輕易放棄，更何況這種天氣在北海很常見。就算救

  援行動進行到一半，大家都以為任務目標已經轉為「拾回遺體」，每個人都還是抱持著一

  線希望。最後，不放棄的人性光輝成功救回克里斯，甚至有些人戲稱他成功「騙過」死神

  ，但就連克里斯本人都最感謝他這群堅持到底的同事，畢竟自己只是躺在那等待救援而已

  。



  電影的配樂相當磅礡，也十分緊張刺激，只是，一切都發生得太快，角色都還來不及堆疊

  情緒，觀眾也還無法與角色共情，就馬上進展到下一個事件，讓已經到眼眶的眼淚說什麼

  就是掉不下來。譬如說，克里斯的循環軟管繩索斷掉的瞬間，他原先還在向戴夫交代遺言

  ，一消失在對方眼前，鏡頭便迅速切換到戴夫想辦法回到潛水鐘。假使這時候讓觀眾與克

  里斯一同感受全然的寂靜與闃黑，接著在克里斯快要窒息的喘息聲中打開逃生氣體，而非

  由戴夫在通訊尚未中斷前「指示」克里斯切換，透過轉換視角的方式，讓觀眾身歷其境，

  恐懼與緊張的感覺會更深刻。畢竟目前的片長也才90分鐘，應當還有許多篇幅能夠再闡述

  更多。



  雖然不少人觀影後讚賞電影忠於事實，並沒有太過加油添醋，但事實上，2019年的紀錄片

  也大獲好評，如果單純想了解事件始末，觀看紀錄片即可。既已改編為劇情片，未能好好

  利用來發揮戲劇效果，的確可惜。紀錄片與《窒息倒數》最大的不同為潛水員的聲音，因

  為在飽和與加壓的過程，潛水員吸入大量氦氣，因此聲音會非常尖細，但放在劇情片當中

  會影響觀眾融入劇情，所以導演特別將此事實改動。



  另外，克里斯2012年遇難時，逃生氣體大約只有5分鐘的時間，電影將其延長為10分鐘，

  但片中的克里斯多半將此時間用來爬岐管，支援船開始採取救援行動時，克里斯已經開始

  缺氧，「倒數」的緊張感蕩然無存。雖說事實與此相去不遠，但作為一部驚悚片，要讓數

  字有意義，可能必須在每次時間出現後，救援團隊隨即也對應做出什麼新的行動。不見得

  要與他們意識到時間的流逝有關，只要讓觀眾保持緊張感即可。



  片尾提到科學家與專家都想不透為何克里斯可以活命，只能猜測是海底的低溫與壓力造成

  特殊情況。也有一派人認為，由於克里斯體內充滿在飽和潛水艙注入的氣體，再加上他昏

  迷的時間極為剛好，提早昏迷，氧氣足夠的話，他或許會失溫而死；延後昏迷導致氧氣不

  足的話，他可能會窒息而死。但正因為低溫讓身體以最低效能運作，而體內又充滿足以維

  持這段時間的氣體，讓克里斯奇蹟似地活下來。



  如同很多真實故事改編的電影，《窒息倒數》也在片尾放上真實的影像。除了潛水員實際

  進出飽和潛水艙的畫面之外，最有趣的就是克里斯的婚禮，他甚至幽默地說，現場給過他

  深情之吻的除了他老婆之外還有兩名男士，便是與他一起出生入死的好夥伴戴夫與鄧肯。

  不過，電影只說三週後，這三個人又回到海底繼續他們未完成的任務，卻沒有進一步揭示

  其實克里斯一直擔任飽和潛水員直到2022年轉任潛水主管，繼續在當年意外發生的支援船

  上效力。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
