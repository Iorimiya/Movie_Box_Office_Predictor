url: https://www.ptt.cc/bbs/movie/M.1740913011.A.150.html
title: '[普好雷]窒息倒數 '
content: '雷文防雷資訊頁





  雖然這個星期大家都跑去看喵喵漂流，但是因為時間不剛好，所以我是先看了窒息倒數。


  這種真人真事改編的片通常很冷門，我怕它一下子就下檔了。


  不過幸好假日還是有點影響，今天去電影院時沒有包場。



  這部片其實有兩個蠻有名的演員：伍迪哈迪遜和劉思慕，我個人對主角演員芬恩柯爾比較

  不熟。然後艦橋上面指揮部的眾人基本上也都是面熟面熟這樣。



  嚴格來說我給這部片普好雷，原因見下方。




  以下有雷以下有雷以下有雷



  慎入慎入慎入






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這部片原名叫做Last Brethe（最後一口氣），台灣翻譯為：窒息倒數



  之前看過的一些電影也有沒有深海潛行的情節，不過那基本上都是冒險的片段

  而不是主軸。（比如巨齒鯊XDXD）這部片就完全以深海潛水員的真實經歷為故事大綱。




  其實故事蠻簡單的，就是因為風暴來襲，潛入深海工作的潛水員克里斯被留在原地

  然後船上的人跟在潛水鐘裡的同伴想辦法回去原地救他的，然後他奇蹟獲救的故事。



  基本上故事就是平鋪直敘，所以故事也不長，大概就是90分鐘左右，

  這是我覺得比較可惜的部分，我並不是說過程要多驚險或千鈞一髮，而是我覺得鋪陳


  花了不少篇幅：他們說明潛水員必須生活在特定機艙裡面，然後在潛水鐘內準備穿戴好，


  接著下海到預定地點工作，其實每一個環節都可以再多做著墨，但是導演好像有點.....


  我也不曉得該怎麼說，應該說是有點像是拍的鏡頭剪不不了那麼多（內容？）那樣的感

  覺，所以每一個環節都是一帶而過，這是比較可惜的地方。


  但是雖然比較倉促緊湊一點，但是有很真實地拍出潛水員在等待工作前的日常，工作前的

  準備，躍入深海中的黑暗遼闊，以及在海底進行各種工作的艱辛不易。

  會讓人覺得，願意從事這個工作的人，真的是熱愛潛水和海洋，不然不會這樣為愛發

  電欸。


  所以當風浪過大，使得潛水工作中斷，返程過程中克里斯的繩索意外斷裂，他

  被留在瓦斯管線附近等待救援，然後船隻也因為儀器故障飄走，必須得想辦法回到

  原本的地點，才能再次放下繩索讓劉思慕演的戴維回去找克理斯。

  不過這時候我們也可以看到，雖然21世紀，大部分的機械都已經自動化，

  但是在遇到機器當機時，還是得先靠手動（有點想建議定位員在機器上面放乖乖）XDXD


  總之在這個過程中，克理斯就逐漸缺氧，等到戴維順利下降找到他時，他已經缺氧十

  幾二十分鐘了，然後戴維拉著他重新往上爬時，因為風浪很大所以還滑了好幾次，

  雖然知道一定會沒事，但真的看到有點緊張，幸好最後不但沒事，

  克理斯還在缺氧29分鐘的情況下居然醒了過來，還完全沒有後遺症。


  根據影片最後面的說明表示，科學家認為可能是深海溫度減緩了大腦缺氧

  （我自己OS所以溫度太低而讓身體進入冬眠狀態，結果反而降低氧氣需求最終撐到

  救援嗎？）


  總之以真人真事改編，這部片其實算是相當寫實，敘述也算完整，演完表現也都可圈

  可點。


  但是缺點就是我剛剛說的，每個環節都有演到，但是其實可以再「催」一下，

  讓表現的力道更足，比如說負責留守的鄧肯（伍迪哈得遜）一開始說要被強迫退休

  戴維（劉思慕）安慰說：「也許10年後一切都自動化了」

  其實也是在表達從事這個行業充滿危險性以及可替代性，但是後來也是不了了之



  或者他們其實可以有更多在潛水艙裡獨處的生活鏡頭，來表達戴這樣的朝夕相處


  讓一開始好像不是很好親近的戴維，與其他兩人的感情其實是緊密連結的，


  在無邊深海中，讓他願意回去找克理司，不只是因為道德和責任

  而是是因為他們在這樣的工作環境中，彼此就是彼此的兄弟和依靠。

  儘管犧牲和損失是不可避免的，但只要有一線希望他們就不會拋下自己的兄弟


  我個人是覺得時間過短導致表現力略略不足確實是這部片的缺陷<

  但是以一部寫實片來說，確實呈現了這「世界上最危險的工作之一」的真實樣貌。


  如果說在家裡看串流，可能很容易分神就感受不到那種分秒必爭的緊張感

  所以還是推薦一下大家有空可以看一下。






  --

  江山易改，本性難移；江山縱改，本性不移。


  --'
