url: https://www.ptt.cc/bbs/movie/M.1764308167.A.868.html
title: '[好雷] 大濛 年度最佳當之無愧'
content: '昨天看了今年金馬獎的最大贏家《大濛》，看完真的意猶未竟。


  在看的過程一直讓小弟想到義大利神導De Sica 1948年的《單車失竊記》，


  小弟當初大學的時候耳聞這部片是影史最偉大電影之一毅然去圖書館借片來看，


  雖然節奏跟拍攝都很上古，


  但呈現的那種大時代下淚中帶笑的市民苦日子卻讓人印象非常深刻，


  那時才學會原來電影不用有甚麼讓人意想不到的劇情或特效，也可以非常有韻味。





  《大濛》時代背景跟《單車失竊記》接近，只是空間是戰後光復的台灣，


  《單車》是失業的爸爸跟兒子在找上班用的腳踏車，沒找到去偷別人的結果被抓，


  《大濛》則是退伍小兵跟收屍小女孩踩三輪車，因為沒錢只好鋌而走險最後被抓，


  兩部都在描述戰後社會市井小民的生活，


  以白色恐怖主題而言算是與民主化宏大敘事滿脫離，還是有沾到邊但不是大重點，


  比較像新浪潮楊導侯導的處理方式，重點不是植入意識形態而是歌頌時代下的人。




  整部片到最後面才用雲和霧的故事回收了《大濛》這個標題，


  曾敬驊的兩個版本的故事裡，小水滴最後的路有三種：


  1. 成為雲，變成下在沙漠的雨，滋潤大地


  2. 成為雲，但雨下在太平洋


  3. 只是團霧


  1比喻了那些集合眾人力量推翻威權，成功讓後人歲月靜好的先賢，


  2雖然是下在了太平洋，對歷史沒有建樹，但是至少成為了他人故事中曾經的風景，


  而3呢，就是曾敬驊對自己的比喻，讀了書，立志成為雲，但最後只成為了火化場的煙，


  英年早逝，還害家人家徒四壁，若非妹妹的「勇敢」，可能只是某個亂葬崗裡的孤魂野鬼。




  我自己很喜歡選霧當題而不是雲當題，


  我們大部分人都曾在泥濘裡面仰望天空成為雲，想在時間的洪流中留下點甚麼，


  但少數變成雲的人最後雨會下在太平洋，更多的人窮盡一生只成為了霧，


  這是辛苦時代下小人物的悲歌也是當代人生命的寫照，


  雖然看似很悲觀，但導演用曾敬驊跟宋云樺戲中的名字「育雲」和「念雲」給了點希望，


  即使只是霧，我們作為前人還是能抱著孕育雲的理想，


  作為後人也可以追憶並緬懷過往的雲與霧。




  非常值得一看的電影！




  --'
