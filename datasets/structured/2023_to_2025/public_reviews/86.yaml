url: https://www.ptt.cc/bbs/movie/M.1768355904.A.2C6.html
title: 'Re: [討論] 大濛怎麼賣不好'
content: '也來補充一下


  很多觀點前面回文都有分析到位


  我是覺得你要拍歷史議題的劇不是不行


  但是拜託可不可以拍得有娛樂性一點


  之前拍得返校 就包裝的很有娛樂性，也確實吸引了一群人買單


  而不是只有單純的在講228當時多苦難


  拜託現在已經是串流的時代，電影市場都在萎縮了


  一般民眾工作一個禮拜已經很累了，放假還要跟你看這種歷史苦難劇


  好萊屋的電影都在想方設法增加娛樂性吸引觀眾進戲院


  國片還一直拍這種政治議題歷史苦難劇


  --

  重點是題材吸不吸引人 你賣相不吸引人然後怪客人不嘗看看

  可能吧 但看片名、預告片看不出來 一般大眾也不太會去注意到

  當時的返校 反而吸引到我，而且返校當時沒有拍得很好

  要看過才能發表意見 那會聽不到很多聲音

  外來語不計較啦  知道是什麼就好'
