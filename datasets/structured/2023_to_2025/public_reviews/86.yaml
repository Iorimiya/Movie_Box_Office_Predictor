url: https://www.ptt.cc/bbs/movie/M.1764501799.A.251.html
title: '[好雷]《大濛》：重現白色年代的臺灣眾生相 '
content: '雷

  文

  防

  雷

  頁



  ============================


  《大濛》：重現白色年代的臺灣眾生相

  網頁版：


  或許是因為難以忘卻之前某部相同題材的電影，所帶來的不舒服觀影體驗，在進場看《大

  濛》之前，我其實既期待又怕受傷害。


  好在《大濛》是一部謙卑還原時代的作品。作為編導的陳玉勳，誠懇、不炫技地重現了一

  個雖然時局晦暗，不乏險詐人心，卻也充滿溫暖人情的臺灣；它不高聲控訴，卻著墨各種

  真情，因此某些段落更能撩撥觀影者的情緒。


  即使不喜歡審視臺灣悲情痛史的觀眾，也完全能將其作為回眸過往、笑淚交雜的時代劇觀

  看。但也必須承認，本片帶給觀眾的情感是很濃重的，就我自己來說，散場後，滿盈的情

  緒仍壓在胸口，好一陣子才能消化。


  雖然是以1950年代的白色恐怖為題材，在一些情節上，也彷彿看到幾個真實政治案件的影

  子，但是電影其實並不以案情還原為宗旨，也不聚焦、探討受難者何以被捲進風暴，而是

  以那些親友遭難的普通民眾的視角、感受切入，寫實地重現那個一直看到「有吏捉人」、

  自己動輒也可能被懷疑、審問，卻始終搞不清楚，這一切究竟是什麼緣故的社會氛圍。


  編導並未寫定，劇中那些被國家獵捕的人是否為冤枉的，而是讓觀眾的視域與北上為兄收

  屍的少女阿月一起停留在「不可知」，然後透過對話，隱晦地暗示受難者可能源於某種不

  被編劇寫死、可讓觀眾自由想像、帶入的理想抱負，才遭遇刑殺的命運。


  相較於過往相關主題的電影，不是明確指涉這些受難人有著某個特定的理想、立場，譬如

  社會主義、自由主義、中國或臺灣的民族主義，就是清楚預設他們全然是遭到誣陷，承受

  莫名之冤，《大濛》的「留白」處理，反而給予臺灣戰後這段複雜、多元，囊括眾多分歧

  立場受難者的歷史，更為開放的理解空間。



  就人物塑造而言，雖然方郁婷飾演的少女阿月、曾敬驊飾演的育雲，以及9m88飾演的阿霞

  ，前者囿於劇中角色的社會經驗，後兩者則受限於登場時的處境篇幅，因而展現的個性不

  免過於純粹、單一，但在其他不少角色身上，我們還是能看到，編導賦予他們立體、多面

  的性格。


  比方，搭車的富太太有同情心，卻也會順手「凹人」；派出所裡值晚班的兩位警察，一個

  態度嚴厲卻心存憐憫，另一個外表文靜卻容易暴怒失控；警察局長表面溫和，一旦碰到民

  眾質疑卻會擺官威，等到在情治人員面前，卻又乖得像隻小貓；國防醫學院的窗口看似面

  惡嘴壞，其實心腸軟；就連柯煒林所飾演的趙公道，這位貫穿整個故事的仗義「屠狗輩」

  ，也有意想不到的「小貪」、「小奸」心思。可以說成功創造了具真實感的民間人物群像

  。


  當然，電影裡仍有稍微流於刻板形象的角色，陳以文與蔡昌憲飾演的特務二人組就是代表

  ，尤其陳以文幾乎就是令人顫慄、純粹的邪惡化身。但編導仍然透過蔡昌憲對於青梅竹馬

  放不下的情節，以及陳以文陪著孩子講故事、睡覺的鏡頭，來指出他們不是全然冷酷無情

  的魔鬼，也有柔情與慈愛的一面。




  在劇情層面，比起帶有公路喜劇風格、有些雜駁發散、可用「臺北城冒險記」代稱之的故

  事主線，阿月與育雲之間的兄妹親情戲，才是全片的催淚所在。


  從開場育雲強作樂觀、談起妹妹與他的未來願景開始，就已讓觀眾醞釀起淚液。因為觀影

  的我們都知道，育雲是沒有未來的，我們其實都正見證著他走向生命戛然而止的時刻。此

  後，每次畫面轉到兩人共處時光，包含最後，讓時代暴力冰冷現身的福馬林池畔認屍戲，

  總能令我淚流滿面。


  很喜歡在電影中兩度出現、結局不同的「兩粒小水滴」故事，那是育雲傳達給手足，也傳

  達給觀眾的不同階段的心境寫照。


  第一個以「成雲化雨，滋潤荒漠」作結的版本，呈現了當時尚未被捕的育雲，不管結果如

  何，也不考慮成功或是失敗，義無反顧決心獻身於改變社會的熱血志向，同時也隱晦的暗

  示他會犯禁捲入政治案件的原因；第二個「未能成雲，卻化作白霧消散」的故事版本，則

  是他被捕後，面對理想和自身，終究將粉碎，可能不被記憶的不甘與無奈心情。


  電影裡，當阿霞轉述第二個版本的故事給阿月聽時，是我此次觀影體驗的「暴哭」時刻。

  由於同時搭配育雲在甘蔗園內孤身茫然地望著天空的畫面，竟令我瞬間帶入育雲失落、悔

  恨與無可奈何的情緒，一時間悲傷層層疊起，如潮水般襲來，讓我在黑暗的戲院裡，忍不

  住放聲痛哭。




  在語言與腔調的處理上，《大濛》的認真程度超乎過往臺灣歷史片的標準，甚至我認為它

  為將來的臺灣電影，在語言要求上，立下新的標竿。在幾位主演中，9m88的偏泉州腔的臺

  語，我自己聽來最有感覺，因為那是較接近我家族長輩的臺語腔調。而柯煒林在劇中雜糅

  中國各省腔調的外省口音，則略有刻意之感。然而，考量到演員們使用的，都不是自身習

  慣的語言，卻能練就如此逼近真實的角色身份設定的口音，無論如何都值得大加肯定。


  不過，如果要指出《大濛》最成功之處，我想，所有看過電影的人都會承認，是它的場景

  建構。


  劇組極為寫實的，重建了七十多年前，那個汽車與挑夫、牛車、三輪車爭道，主要仍是紅

  磚建築、日式與閩式平房的臺北街景，真實得就像是某個臺北老人閉上眼睛後浮現的記憶

  ，令人無法忘懷、忍不住讚嘆！




  本片的結局，是許多觀眾在映後議論的焦點。不少人主張，故事應該停在七十一年前，阿

  霞、阿月姐妹捧著育雲骨灰，在霧濛濛的天候，跟隨送葬樂隊回鄉的畫面，認為如此更有

  懸念與餘韻。對於這樣的美學想像空間，我是認同的。但導演選擇交代眾人未來命運，我

  也可以理解，因為那是導演給予這些苦難人物的小小溫柔。特別是，他讓阿月在暮年重遇

  趙公道，正是為了圓滿兩人過往的遺憾。


  相較於有著女兒、孫女相伴的阿月，再次出現的趙公道，已然白髮垂頭、佝僂攜杖，且依

  舊孤家寡人，這樣具有對比性的重逢安排，編導似乎也有意突顯許多底層老榮民，默默奉

  獻青春在這座島嶼，卻最終孤身凋零的境遇。


  只是這一幕，有個比較可惜的地方，那就是，老年趙公道沒有找一個年齡相符的老演員飾

  演，而是直接讓柯煒林扮老。雖然特效化妝已經努力在柯煒林的臉部、頸部添上皺紋和老

  人斑，甚至也有疑似被刑求的傷疤，但明顯喬裝的痕跡，仍讓人瞬間出戲，打斷感動的延

  續。


  總之，《大濛》並不是一部與大眾存在距離的電影，正如同七十多年前的那個蒼白年代並

  不遙遠，它是屬於這片土地上，不分籍貫、族群的長輩，共同走過的歲月。它造成的裂痕

  ，至今仍然存續、影響著。


  而這部電影的可貴之處，在於它如同照亮歷史陰影的一道陽光，大膽地用溫暖的故事調性

  ，來述說政治暴力下的傷痛往事，讓未有相關經歷的人們，也能有個容易、較無負擔的理

  解、共情途徑，同時也藉由彰顯曾經存在於黑暗中的可貴人性，嘗試給予遺族一場遲來的

  療癒。


  --'
