title: '[情報] 《大濛》 預告 11/27 上映'
content: '《大濛》 A FOGGY TALE


  2025 年 11 月 21-23 日感動口碑場

  2025 年 11 月 27 日 全台上映


  —— 動盪的大時代，最溫暖的光輝


  1954年，一個15歲女孩，聽聞哥哥在台北被槍斃的消息，獨自搭火車從嘉義到台北，不顧

  一切後果，只為帶哥哥回家。


  她懵懂無知初到台北，意外下被來自廣東、思鄉而歸不得的三輪車夫所救。兩個沒有血緣

  關係的人，因為緣分變成患難之交，展開一段為籌措贖屍費，而賭上性命的旅程。


  第 62 屆金馬獎入圍最佳劇情片等 11 項大獎

  第 62 屆金馬影展開幕片


  -


  監　製｜葉如芬、李烈

  編／導｜陳玉勳

  主　演｜方郁婷、柯煒林、9m88、曾敬驊


  製作｜華文創股份有限公司

  發行宣傳｜牽猴子股份有限公司

  海報設計｜陳世川


  奔放小勳 ｜ #方郁婷 ｜ Will Or 柯煒林 ｜ 9m88 ｜ 曾敬驊


  --'
