url: https://www.ptt.cc/bbs/movie/M.1766117510.A.351.html
title: '[新聞] 淡江校友陳玉勳分享《大濛》創作歷程'
content: '淡江校友陳玉勳分享《大濛》創作歷程 師生觀影感受時代群像


  (中央社訊息服務20251216 16:00:59)


  「你看過《大濛》了嗎？」近日成為淡江大學校園內最常聽見的話題。


  為支持校友陳玉勳導演執導的電影《大濛》，淡江師生與校友以實際行動相挺，相約走進

  電影院，共同感受這部榮獲第62屆金馬獎「最佳劇情片」等5大獎項肯定的國片魅力。


  繼11月23日舉辦觀影活動後，12月15日晚間再度連續舉辦兩場觀影，陳玉勳特地到場進行

  映前與映後分享，向母校表達感謝之意，現場氣氛熱烈而溫馨。



  淡江時報與媒體中心和大傳系於12月15日在淡水禮萊國賓影城舉辦《大濛》觀影活動，出

  席者大合照。（圖／淡江大學提供）


  映後座談由大眾傳播學系許傳陽主任與淡江時報與媒體中心潘劭愷主任共同主持。許傳陽

  表示，教資系（現資訊與圖書館學系）校友陳玉勳曾在大傳系實習媒體「淡江影棚」實習

  ，學生時期的學習與實作，為其日後創作奠定重要基礎。


  陳玉勳分享創作理念時表示，《大濛》並非著力於結構嚴謹或高度專業化的敘事，而是希

  望呈現特定時代背景下「小人物」的多元樣貌。


  他指出，電影並不聚焦單一歷史事件的再現，而是透過騙子、軍人、流氓與平民等不同角

  色，交織出那個年代人們的生活狀態與生命風景。「每個人都是別人的風景」並非一開始

  就設定的主題，而是在劇本發展過程中逐漸浮現，也促使他將敘事重心放在人與人之間的

  關係與生命感受。


  針對師生提問電影的時間敘事方式，以及非母語演員演出大量臺語角色的選擇，陳玉勳說

  明，選角時以角色形象與表演張力為首要考量，語言則透過專業指導與密集訓練克服；由

  香港演員柯煒林飾演外省軍人角色，則是為了營造角色的陌生感與外來者形象。在談及配

  樂時，他也幽默分享自己大學時期曾兩度在淡江金韶獎獲得亞軍，音樂創作的養分深受校

  園影響。


  多位師生於座談中踴躍提問並分享觀影感受。大傳系學生徐慧珊表示，電影以淡淡幽默包

  裹沉重歷史，隱晦呈現威權時代人們對不同思想的恐懼與壓抑，令人反思自由的可貴；公

  行系學生楊成勤則指出，透過導演現場解說，更能理解片中細節與情感層次，深刻體會大

  時代下小人物所承受的辛酸與掙扎。


  目前《大濛》票房已逼近新臺幣5,000萬元，口碑持續發酵。


  陳玉勳最後以一句話為分享會畫下溫暖句點：「每個人都是別人的風景，幫助別人、讓別

  人好，自己的風景就會很美好。人會消失，風景會留下來」，也為這場觀影活動留下深刻

  迴響。



  教資系（現資圖系）校友、導演陳玉勳特地到場表達感謝之意。（圖／淡江大學提供）


  新聞網址：



  --'
