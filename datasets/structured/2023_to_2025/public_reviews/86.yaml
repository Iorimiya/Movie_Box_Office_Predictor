url: https://www.ptt.cc/bbs/movie/M.1766386531.A.986.html
title: '[好雷] 大濛 活著總會有個公道'
content: '電影版潛水，看到版主想批改心得文

  鼓起勇氣寫了心得文，眼淚還是流不停

  希望會過關


  防雷













  -


  金馬看了開幕片眼淚留個不停

  從甘蔗園裡哥哥閃閃發光的眼神

  到最後醫院阿月巧遇趙公道


  但心中一直有個疑問

  為什麼趙公道把錶留下後就離開了


  電影上映後終於可以看到大家討論了

  因為不同背景出身的人就會有不同觀點

  每個人看的角度都會不一樣

  剛好滑到一篇心得文是以外省人家庭的角度分享

  裡面說到趙公道做那樣的決定

  是因為他們就是那樣的人

  他們就是會做出那樣的事的人


  突然想起自己的經驗

  我有一位老師是出身在外省家庭的老師

  曾經因為政治立場與老師不同有了不愉快

  老師那時候跟我說了盲人摸象的故事

  那五個人因為立場與角度不同

  對於大象就有了五種不同的詮釋

  我問老師那我的不認同呢？

  老師說對於事物的觀察已經如此慎重

  更何況是人呢？


  隔了幾年接到了師母的聯絡

  老師動了心臟相關的手術狀態不好

  但老師請師母帶話給我

  說我是很好的學生


  儘管我跟老師之前因為立場不同

  討論沒有交集

  但最後的最後老師好像跟趙公道一樣

  選擇的了對阿月最好的選擇


  我到現在還是沒辦法清楚的描述

  是什麼讓他們做出那個選擇

  但或許這是導演口中的忠義吧


  這幾年有好多事情還是想問老師

  但已經問不到了

  如同電影中趙公道的離開一樣


  --'
