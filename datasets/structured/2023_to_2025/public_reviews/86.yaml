title: '[好雷] 大濛_阿兄你會怕嗎'
content: '終於，趕在金馬獎頒獎典禮的這天早上，進戲院看過入圍11個獎項的《#大濛》。今晚的

  頒獎典禮，在電腦螢幕前肯定很有參與感。


  其實一開始看到預告片，因為我也是當哥哥的人，所以對其中一個片段印象特別深，是女

  主角阿月(#方郁婷)問他哥哥(#曾敬驊)：阿兄你會怕嗎？


  今天看完的結果，確實是被劇中的兄妹情所感動到。覺得比較會讓人想掉淚的是哥哥第二

  次從甘蔗田裡茂出來，對妹妹述說關於他的那本「雨滴變成雲彩的繪畫故事」。明明是講

  夢想的事，講著講著想到其中的含意與之後的遭遇…就被感動了。


  然後就是，我覺得也很難不被「金馬獎入圍的獎項」所影響對這部電影的評價吧。好像有

  被肯定過，看起來確實就不會太差。


  男主角趙公道(#柯煒林)的演出，媽你個B，真的很搶眼。#9m88 演唱的主題曲也很貼近劇

  情讓人感傷。


  整體簡單而言，就是幕前演員與幕後所有人員都表現得淋漓盡致，電影裡那個年代的老房

  子老建築讓我想起小時候看過的華視連續劇《愛》，勾起很多回憶。


  從小就生長在這塊土地，以為長大之後會變得不一樣，結果風風雨雨這多年，社會總還是

  吵吵鬧鬧，或許這是台灣之所以特別的地方，希望大家好好珍惜得來不易的民主自由。


  --

  But，既然是拿金馬獎做比較，我還是私心比較喜歡《我家的事》，一部看完會想馬上再

  刷的電影。



  --








  --'
