url: https://www.ptt.cc/bbs/movie/M.1764594419.A.57D.html
title: '[新聞] 陳玉勳領軍宣傳 大濛口碑好奈良美智也想看'
content: "陳玉勳領軍宣傳 大濛口碑好奈良美智也想看\n\n2025/12/01 05:30\n\n\n方郁婷（前排左起）、柯煒林、導演陳玉勳為宣傳《大濛》，來到台南與鄉親們熱情互動\n\
  。（華文創提供）\n\n〔記者鍾志均／台北報導〕台片《大濛》拿下金馬62最佳劇情片、原著劇本等5獎，導演\n陳玉勳上週攜主演柯煒林、方郁婷在台北、台南影城跑透透，還傳出有影迷3刷，全片哭\n\
  了逾10次，感動到不言而喻。\n\n\n方郁婷（左）、柯煒林行程滿檔，連跑多場活動和影迷相見歡。（華文創提供）\n\n《大濛》在台南鹽水「岸內影視基地」還原民國40年代台北街景，陳玉勳回憶當時雖然是\n\
  冬天，但天天幾乎都是30度好天氣，讓拍攝十分順利。\n\n柯煒林分享自己騎了2個多小時的腳踏車回到民宿地點，引起台南鄉親驚呼，而台南剛剛\n好的氣溫更讓柯煒林嘴甜的說：「跟你們的熱情好搭！」\n\
  \n因拍攝首次來到台南的方郁婷表示最懷念的是「牛肉湯」，笑稱拍攝時每天都要喝一碗，\n更透露在台北城拍攝時身旁有真的牛，直呼「沒看過那麼大的牛」逗樂全場。\n\n\
  電影上映後好評爆棚，口碑延燒到日本藝術家奈良美智也忍不住在社群平台發文，表示「\n現在最想看的台灣電影，就是《大濛》。」吸引不少台灣影迷大讚「老師眼光真好，這片\n\
  超讚」、「快來台灣看，請你吃鹹酥雞」。\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
