content: '網路上已經有點資料囉

  今天大濛在國賓試映


  網路上評價都非常高喔

  都說感人熱淚

  觀眾都在哭


  美術精美

  依然是勳導擅長的喜劇主軸

  兩個主要角色彼此有很深的羈絆

  沒有太多政治隱含

  130分鐘一下子就過去，體感13分鐘




  非看不可啊!!!

  大濛大家都來5刷


  --'
