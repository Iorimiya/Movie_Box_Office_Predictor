title: '[普好雷] 大濛'
content: '今天剛看完口碑場，蠻意外整場只有大概十個觀眾，不過好處就是觀影品質好，旁邊都沒

  人干擾可以更專注觀影。但因為還沒正式上映，所以會去看的觀眾注意一下本篇心得會有

  雷喔！


  好雷給方郁婷跟柯煒林，我覺得比起劇本，整部電影的進行更像是以阿月和趙公道這兩個

  角色去推動。人物塑造的很成功，在混亂的時代裏兩個小人物之間發展出類似共患難的真

  摯情感令人動容。從「美國女孩」第一次看到方郁婷的演出就讓我驚艷，這次的演出一樣

  厲害，一心想找回哥哥屍首帶回家鄉的堅定精神、遭遇不公時據理力爭不像那時刻板印象

  的傳統女性以及最後認屍時那一段張力十足的表演都非常精彩。

  不過我最喜歡的一段應該是阿月在甘蔗園裡聽著哥哥述說自己寫的關於雲的故事那段，哥

  哥把想告訴妹妹的話透過這個故事傳給她，未來即使自己不在也期許有一天她可以懂。


  柯煒林演出的趙公道則是個退伍軍人出身的車夫，我喜歡他那有點樂天的性格，以及在軍

  中到處亂學而滿口不道地的髒話。因為偶然救了被拐騙的阿月而跟她一起踏上這段找哥哥

  的旅程，劇中暗示因當年的軍中長官被指為間諜因此自己也被抓去審問過。讓我印象深刻

  的是在家中又被陳以文飾演的特務關切時，無奈又氣憤的說自己只想帶兄弟的手指回故鄉

  時那段，以一個小人物的角度來看完全不懂那些無意義的官僚提問到底有什麼用意。

  不過對於趙公道這角色的結局，我覺得如果就停在最後他被抓走生死未卜留一個懸念我也

  不反對。我沒想到的是故事最後竟然有到現代的時間線，當然我也喜歡happy end，不過

  最後兩人多年後重逢時的那段，在感人力度上我反而覺得還比不上阿月認屍時那段。


  再來是普的部分，劇本雖然大致還算流暢，可是中間有一段比較長的地方讓我不太理解為

  什麼會演這段。（就是趙公道潛入醫生家想暗殺特務陳以文那邊）

  感覺想多走一些劇情支線卻又沒有交代完整，另外就是最後用照片交代完角色的後續故事

  後時間線竟然轉到現代，讓本來阿月帶著哥哥骨灰回家的結局情緒有點中斷。雖然是為了

  最後的那段相遇，但第一段多年後的戲碼結束之後又到了第二段的再更多年後，或許是想

  表示阿月多年來心中一直都惦記著這位當年的恩人，不過在情緒的堆疊上可能就是讓我覺

  得差了一點點原因吧。但我還是喜歡趙公道最後把相似的那隻手錶還給阿月這個舉動。


  整體來說，以有提到白色恐怖的電影來講我喜歡大濛勝過餘燼。劇中不少小配角也找來了

  滿多知名演員客串的，陳竹昇、林美秀、劉冠廷、朱德剛出場時都讓我會心一笑算是一些

  小彩蛋吧。希望金馬獎能有一些斬獲，也希望正式上映後票房不要太差（不過個人覺得可

  能是獎項大過票房吧）


  --'
