title: '[普雷] 大濛'
content: '雷文防雷資訊頁


  本文無雷


  純粹分享觀影心得


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-


  看完感覺很普，幾個點想分享


  1.

  感覺得到導演想重現當時的時代感

  在場景建構上很用心

  但總覺得畫面還是太乾淨了

  有點像現在古裝劇總是妝很濃或是有難以言喻的違和

  （還是因為現代影劇的畫質太好？XDD）


  2.劇情太單一

  因為很直線式敘述

  很清楚知道劇情會怎麼推展

  因而感受沒那麼強烈


  3.用了很多知名且厲害的演員

  演技都很好


  4.最喜歡的一段是結尾

  巧妙地串連了姐弟妹





  因為這部電影有政治色彩

  要寫心得文也會有些顧慮

  但又覺得

  因為我身在台灣

  所以應該可以好好闡述自己的想法

  縱然跟主流言論不同

  但能有多元的想法交流分享

  也是身在台灣最珍貴的地方


  --'
