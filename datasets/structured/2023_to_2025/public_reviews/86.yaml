url: https://www.ptt.cc/bbs/movie/M.1766776093.A.73D.html
title: '[超好雷]那張照片裡的我們-不下大濛 '
content: '坦白說，我本還在考慮著怎麼寫大濛心得文，卻怎麼也沒想到聖誕節看的這部片，卻硬生生

  插隊了我本想寫的東西，甚至讓我體感到...我其實也沒那麼喜歡大濛


  雖說大濛是部好片，但相較於餘燼那樣的劇情動作片，你依然容易覺得在平淡中好像少了

  些什麼刺激


  而這部卻是取了兩部的優點，從小人物的角度出發，卻又與歷史事件契合


  驀然回首，甚至會發現潛藏在台韓愛情片的表象之下，它是一個屬於台灣歷史的英雄旅程


  所以如果你喜歡大濛、聽海湧等台灣歷史題材的作品，不要猶豫，買票進場吧



  下面談些這部讓我喜愛的原因





  (防雷)







  首先，如果你是細節控、歷史控，會很容易發現裡面劇本的嚴謹。從時代背景、主要角色

  設定、職業關係、人生困境...皆都有著絲絲入扣的關聯，甚至藏了不少歷史彩蛋(合歡山

  雪訓)。這在歷史影劇中其實很難拿捏，通常台灣歷史劇本要不太直白、要不太隱諱，但

  這部乍看只是單純異國三角戀情+桃園中壢事件的劇本，卻拿捏在剛剛好讓人看得十分順

  暢的地步


  情理之中、意料之外，我想是對這部最好的註解


  你以為自己已經大致知道會發生什麼事，環環繞繞、曲折之中，卻又不免跟著劇中角色緊

  張起來，在各種親情、愛情、青春與歷史陰影中，一步步深入那個社會時代


  裡面有幾個我很喜歡，又帶巧思的設定：


  1.照相館


  作為女主角家庭背景乍看是十分普通，卻精巧的串聯起了所有角色關係。


  外國人要拍照出書，需要來到照相館

  社運街頭紀錄要拍照，需要來照相館

  政府抓靶子拍照恐嚇，需要來照相館


  甚至是沖洗遺照，也需要來照相館...


  照相館彷彿成了各方角力的中繼站，許多故事都在此發生，暗房作為天真燦爛的女主避風

  港，但也無可避免的，將逼迫她被動長大


  從那片暗房中的白雪一片、到隻身往合歡山的動力、與最終三人的合影，都不免讓人驚喜

  於腳本對照相館這個設定的精妙


  2.韓國人


  我想在這部片之前，很少人會想像得到韓國人與台灣民主化的關係


  我的意思是說，我們知道韓國拍了很多政治背景、沉重的歷史題材。我們也知道台灣民主

  歷史有很多苦難的事情，但要說兩者有什麼實際火花？大概很難有清晰的想像


  但這部電影卻做到了


  跆拳道、韓國特警、永遠忠誠、鎮暴警察，和那隱藏在背後沒明講的後續支線，這樣的大

  膽結合，注定讓它迴異於其他台灣歷史劇，更拉高到了一種異地觀看角度


  有人會問：台灣拍得出我只是計程車司機嗎？


  在這部電影之後，我會很肯定地說：能


  最後不得不提到


  觀看時不由得聯想到華麗的假期，相較於我只是計程車司機可能較不那麼出名，但敘述的

  是同一場事件


  那種從平凡市井小民的小情小愛、煩惱生活的人生，一點一點在壓抑的氛圍中推進，然後在歷史湧

  浪前爆炸，結構都十分相似。對於「攝影」的使用，也同樣有意思(如果看過華麗的假期

  的結局的人應該會懂我說的)我只是計程車司機事實上也有著攝影的元素



  結尾對於主角之一的後續沒有明言，只有相機透過轉交回到女主手上、以及最終女主三人

  合照的暗示


  燈亮後我便迫不及待的查了手機，而後鳥肌了起來


  中壢事件1977


  光州事件1980


  我想我大概知道，有什麼沒講完的後續了


  敬自由，敬台劇


  --'
