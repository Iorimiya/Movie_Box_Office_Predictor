url: https://www.ptt.cc/bbs/movie/M.1765607592.A.555.html
title: '[好雷] 大濛-讓我在電影院裡大哭的人生哲學家'
content: '#國片 #大濛 #金馬獎最佳影片 #最佳劇情片 #導演陳玉勳

  #白色恐怖 #好看 #在電影院裡大哭 #推薦






  （防雷頁）













  我很少看國片，也很少看文藝片，總覺得人生已苦，

  下班就要放飛想象力、修仙打怪升級、異世界、玄幻或科幻都好，

  電影就是娛樂，商業大片才對得起我的電影票價，

  白色恐怖這樣沈重的政治歷史內容，實在讓我很害怕。

  在電影院裡面被感動到大哭，完全出乎我意料之外。



  電影開頭民國42年，我馬上心算了一下，我爸4歲，小屁孩一個，跳過，

  奶奶31歲，社會中堅，所以這是一個我奶奶年代的故事。


  劇情內容簡單來說，就是妹妹孤身從嘉義上來台北幫被槍殺的哥哥收屍的一段經歷。


  我大哭的那段是歷經種種波折，在醫學院福馬林池認屍體的那段，

  因為太難熬，妹妹想著哥哥曾經對她說，難過的時候，就想著未來會發生的事，

  一年兩年十年，妳當老師、生兩個孩子、當奶奶了....

  過去與現在畫面交錯，那時哥哥描述這段情景的時候嘴角帶笑，說他想要當畫家。


  鮮活跳脫的美好生命，就這樣沒了，如果是我，一定一生傷痛。

  不敢回想也不願意走出來。



  一開始領屍通知單寄到家裡來的時候，我就想，不要去領了，要花這麼多錢，

  家裡這麼拮据，活下來的人好好活著比較重要。


  死了就死了，什麼都不知道了，做這些哪有意義？

  就像男主角趙公道(這個名字真的諷刺意味點滿)硬要把3個戰友的手指骨送回家鄉，

  封建迷信，愚蠢至極。

  但就在那一刻，我突然懂了。這個儀式不是為了死人，正是為了活下去的人，

  讓活下去的人能藉由這個方式，完成他的念想，好好地走過遺憾與傷痛。


  回家的時候我纏著孩子把劇情說給他聽，講到這段時又哭了出來，

  孩子把棉被蓋住頭，試圖躲避我的眼淚與鼻涕，我硬把棉被扯開，試圖糊在他臉上。

  別覺得我殘忍，他可是會在我要睡覺的時候，

  烏漆媽黑也要站在我床前堅持加開半小時的個人演唱會呢。



  哥哥曾對妹妹講過一個故事，溪裡面的兩滴小水滴，

  化作天上的雲，下在沙漠裡，讓沙漠變成農田。


  跟姊姊講的又是不同的一個發展，那時哥哥已經入監了，

  水滴可能下在太平洋，變成一道風景。

  也可能只是變成霧氣，什麼都沒有 #呼應電影名稱 #背景是哥哥屍體火化時的煙

  我好喜歡這個故事，人生如露亦如電，如夢幻泡影， #哥哥根本人生哲學家

  大夢一場，你可能改變了一些事，也可能什麼都沒有改變。


  孩子說，他文筆這麼好，難怪是政治犯。

  我說，他說他要當畫家。



  女主角阿月(方郁婷)真的演得很好，她專注聽人講話的時候，好有靈性，

  澄澈的眼睛可以映射出整個世界。

  男主角趙公道的人物曲線特別完整，角色豐滿、小善小惡，

  我對他的情緒特別多，不高興他騙阿月的手錶錢，轉念一想他救她離開人販子，

  等於是一條命，價值根本不是一條手錶可以比擬的。


  不喜歡他粗魯沒讀書、滿嘴髒話，受不住刑求供出排長下落，

  覺得他熱心天真沒文化、沒心機、衝動又容易被挑撥、成不了事，

  又覺得即使如此，也不應該有人有權利可以剝奪他的人生，莫名其妙讓他坐25年牢。


  特別驚嘆姊姊，自己身為從小被送養的童養媳。

  卻勇於對抗命運，從不想嫁人離開家裡自己謀生、去歌舞團跳舞、

  到去美軍酒吧駐唱養活妹妹和弟弟，讓她們繼續唸書，妹妹真的當了老師。

  追著愛人（美國軍人）去美國，最後結婚，人生堪比逆襲女主文。


  那個年代人命好像特別不值錢，養孩子就是多雙筷子的事，特別好養活。

  台灣現在全球生育率最低，養一個孩子都壓力山大到想剃度出家了。

  每個年代真的都有自己的風景，我覺得不用特別政治化，導演真的講了一個好故事！

  我擁有了一場很值得的視覺和靈魂盛宴。



  --'
