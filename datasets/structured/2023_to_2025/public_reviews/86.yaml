url: https://www.ptt.cc/bbs/movie/M.1763802987.A.15D.html
title: '[普好無雷] 《大濛》獻給某族群的話語'
content: '昨天剛看完國寶

  今天看大濛總覺得缺少了什麼

  是什麼我也不知道

  或許是劇情的緊湊程度吧

  也可能是演員的表現方式


  我覺得《大濛》比不上之前的《流麻溝十五號》

  那是一股更純粹的情感

  大濛有點太多枝葉了

  反而長不出甜美的果實來

  但這也代表大濛或許能接觸到更多的族群


  最後，獻給某族群的話



  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
