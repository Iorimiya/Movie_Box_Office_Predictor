url: https://www.ptt.cc/bbs/movie/M.1767261686.A.B96.html
title: '[好雷] 大濛'
content: '在觀影前我知道這部電影受到各方爭議，不論是政治議題、文化補助或是意識形態。


  再受到金馬獎的肯定後我決定進電影院觀看，對比之前看過的台灣電影，來看看怎


  麼呈現台灣的大時代電影。



  觀影後我覺得這部台灣電影是值得推薦的，滿分10分的話，我給8分。


  因為他成功將嚴肅而沉重的時代議題，包裹在詼諧的敘事外衣中，使時代的壓力


  不至於拖垮觀眾，流露出專屬於台灣的「溫度」。



  儘管在部分演技的表現、場景細節的電腦感，以及稍嫌冗雜的插曲安排上仍有瑕疵，


  不過整體瑕不掩瑜。劇情確實勾勒出時代的宏觀輪廓，也回應主軸的敘事主題。




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  白色恐怖與相關的時代題材幾乎不可避免的背負著政治性與沉重的歷史包袱，如何


  避免流於政治說教或僅止於歷史紀錄，是此類電影的困難命題。「大濛」選擇將時代


  恐怖轉化為人物命運的一部分，讓人性在恐懼與壓迫中尋找人性的平衡。


  這樣的敘事策略為作品加不少分。


  在敘事手法上，讓我印象深刻的有兩點:1.「快轉」的運用，以及2.幽默的安排。


  這兩者不僅協助電影完成起承轉合，也在結尾形成一次有效的回馬槍完成趙公道的


  人物輪廓，有效提升劇情的張力。



  「大濛」的意象與主軸


  大濛一詞的解釋，出現在電影的尾聲，透過阿霞的口白講述。電影描繪地上的兩個


  水滴嚮往成為天上的雲與彩霞，最終一個化為繚繞不散的雲霧，另一個回歸成為大海。


  雖然同為風景，並非每個人都能成為想要的面貌，每個人最終得接受時代的使命。


  大濛所講述的，正是一群人在時代洪流下，被迫接受命運，卻掙扎向上的過程。


  阿月與阿霞成為大海中的水滴，哥哥黃育雲與趙公道化為時代的陰影，時代命運如


  濃霧般揮之不去，然而在濃霧之中依然有著人性的溫暖陪伴時間的流逝，默默存在。



  1.「快轉」的運用


  電影一開始強調「手錶快轉」的動作，他像是在勸人不要著眼於當前的苦難，而是將


  目光投向未來，另一方面，也提醒觀眾以更宏觀的視角面對自身遭遇。同時，快轉也


  隱含著「哥哥始終與自己同在」的情感連結。


  另一段關於快轉的重要場景出現在認領屍體的橋段。阿月藉著念出快轉的時間逃離


  難以承受的心理壓力，即便在失去手錶後仍固執地想讓時間加速，這段巧妙地讓觀眾


  與阿月的心境同步，每一次認屍的環節都是哥哥的生命倒數，沒有人想面對那一刻，


  但是當時間停止時還是得面對命運。


  在電影後段時間被快轉至1993與2004，象徵，象徵阿月人生中重要的節點，也標誌


  著她心境的轉變:1993的新聞讓她重新燃起尋找失蹤的趙公道的念頭，暗示白色恐怖


  的陰影從未真正消散；2004的醫院重逢讓阿月直面自身的遺憾，當趙公道將手錶交還


  時代的輪廓終於完成－在巨大陰影之下，人性的溫暖成為唯一持續傳承的見證。



  2.「幽默」的運用


  大濛電影中穿插的幽默橋段，明顯是為了對比時代的嚴肅性。一方面軟化故事的調性


  一方面拉開與日常的反差，增加帶入感。從趙公道的家鄉髒話、人口販子、國防醫學院


  的窗口以及盜賊高金鐘，這些角色的出現都有其脈絡與劇情轉場需要。目的在注入更多


  人性的溫度。



  與此對照的就是時代的冷酷:警察的暴力、特務的威脅、求職的困境，以及一次次令人


  窒息的認屍環節。幽默在此必不可少，不僅推動敘事、也讓觀眾能跟隨腳色在劇情中


  前進，而不被壓抑的時代情緒湮沒。相較於韓國電影寄生上流與米奇17的社會黑色


  幽默，這種帶有人情味的幽默感讓我感受濃厚的台灣特色。




  被中斷的情緒張力


  儘管電影的主題明確，敘事邏輯穩健，主要人物收束都有完成，還是有幾段讓我稍微


  出戲，主要體現在兩個層面:1.演員詮釋與2.額外橋段的安排。


  作為女二的阿霞，其情緒反映有時不太符合角色所處的位置，缺乏合理性也缺失細節。


  他面對素未蒙面的妹妹，究竟是將它視為親人還是外人?如果是其中之一那要怎麼貫徹?


  就算是親人那是甚麼程度的親人?面對一再闖禍、進出警局的妹妹她應該怎麼反映心境?


  又或者，面對一名可疑、牽涉叛亂嫌疑的外省退伍兵，她的恐懼與警惕應該如何展現？


  尤其弟弟在火化後，阿霞眺望遠方並訴說故事主軸的鏡頭，情緒演出層次理應十分複雜


  但演出並未完全承載這份時代的重量，這些細微之處往往只需一個表情特寫，便能展現


  深沉的掙扎，更何況是長時間的鏡頭停留。



  另一個略顯多餘的段落出現在高金鐘的角色線，期初登場為阿月偷窺阿霞與處長的逃跑


  橋段，第二次則出現在殯儀館與國防醫學院的路途上。高金鐘並未與故事的主體產生


  實質連結，卻花了較多畫面鋪陳故事，反而削弱敘事集中度，如能適度縮減其篇幅，


  整體節奏應該更為洗鍊，不去干擾主要故事的情緒張力。





  --'
