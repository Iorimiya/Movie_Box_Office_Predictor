url: https://www.ptt.cc/bbs/movie/M.1763736866.A.2DD.html
title: '[好雷] 《大濛》成為他人的彩霞'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  先直接講結論：如果這週末你有空、有一部電影的額度，請去看《大濛》(A Foggy Tale)

  。它不只是今年最好的國片、也是今年最好的電影之一。

  .

  陳玉勳導演完成了一件非常了不起的事情，我們即便先不管電影的故事以及劇情，光是《

  大濛》對於時代的還原與重現，在服裝、道具、場景以及美術等各層面都極為精良，絕對

  是在大銀幕上看才能完整感受其用心的電影。

  .

  而或許電影的題材會讓一些觀眾有所顧慮，白色恐怖這個主題本身確實容易起爭議，但我

  覺得陳玉勳這次找到了一個很好、也很獨特的切入角度：這是屬於一個大時代的故事，但

  他選擇大題小作，將整個時代的縮影放在兩個幾乎可以說是局外人的角色身上，帶領我們

  從一個更客觀、也更輕快輕鬆的角度來走過那個年代。

  .

  是的，輕鬆。這樣說或許有些意外，尚未看電影之前，我原本以為陳玉勳這次打算轉型，

  但實際看完後反而讓人感到驚喜，擅長拍攝喜劇片的他，這次並不是跳出了舒適圈，而是

  擴大了舒適圈，竟以喜劇的風格處理起了這個沉重的議題，但並非揶揄或冒犯，仍保持著

  對時代以及對白色恐怖受害者的慎重與敬重。

  .

  因此《大濛》的觀影門檻極低，即便你有特定政治立場或意識形態、即便你可能對白色恐

  怖並不熟悉，或甚至對這樣的議題敘事感到排斥與反感，我都認為你可以給《大濛》一個

  機會：儘管背景設定在白色恐怖的時空背景之下，但它並沒有試著去挑逗觀眾的敏感神經

  、沒有賣弄國仇家恨與渲染民族主義，也沒有太過激烈的對這個年代展現出憤怒、激進、

  挑釁、或是控訴的態度。

  .

  事實上這部電影很溫柔，它更聚焦在幾個目標純粹、個性單純的小人物身上，某種程度上

  來講，我覺得它其實有點像是一個屬於台灣的，格局極小版本的《辛德勒的名單》，透過

  一個至暗的時代映照出最美麗的人性光輝，《大濛》並非要你去沉痛地去回顧歷史、或是

  要你去痛恨那些人，它其實在提醒我們：在當下、在過去，無論是一個多麼糟糕的時代，

  台灣還是有很多很可愛、很善良的人，這裡有需要幫助的人、也有願意無條件幫助他人的

  人，即便只是個小小的舉手之勞，我們都能成為他人記憶中難忘的彩霞。

  .

  陳玉勳的選角眼光依然極佳，我們在方郁婷與柯煒林兩位男女主角身上看到了兩種不同面

  貌的純樸：前者天真純粹，無助卻又堅強的模樣十分惹人憐愛，後者粗鄙卻也直率、毫無

  心機，兩人並非革命志士，也非黨國特務，他們都是那種在時代的洪流之中註定會被遺忘

  ，卻也不該被遺忘的小人物，這種努力活著、努力幫助人、努力記住身邊那些人們的精神

  讓人為之動容，尤其是柯煒林的演技簡直是在發光，是用生命在演戲的那種，讓人驚豔。

  .

  客串陣容也不時讓人驚喜跟惹人發笑，我自己覺得劉冠廷的角色非常有趣，算是個不該被

  爆雷的驚喜，這邊就不多說。而我有時候會開玩笑說台灣的電影選角就是，當你的劇本裡

  有一個機掰的中年阿北時，陳以文就會自動出現在你的片場裡─我真的好期待再看到一部

  高委員宇宙的電影喔─而這片陳以文演出的特務頭子確實機掰到了極點，一段審問柯煒林

  的戲氣勢凌人，擺明完全無法溝通又不講道理的威權模樣壓迫感十足，是那種你真的會害

  怕他的角色。而就算這部電影是喜劇基調，但有陳以文出現的戲，陳玉勳其實都展現出了

  很好的驚悚氣氛調度能力，其中一場刺殺戲剪輯與鏡頭緊張地令人窒息，非常精彩。

  .

  如果要我為這部電影的類型做一個分類的話，我其實覺得它很像是一部那種天公疼憨人、

  傻人有傻福的公路喜劇。我不確定陳玉勳是否有意為之，但如果我們從公路喜劇的角度來

  看，或許這會是這部片最用力也最尖銳的一個諷刺：公路喜劇中的主角總會為了一個簡單

  無比的目標踏上一段旅程，而且是帶著一種極為執著、死不放棄的精神，或許只是想要吃

  個漢堡、吃燒肉、灑爸爸的骨灰等。而這種電影笑點往往來自於，明明是個聽起來如此簡

  單的目標，應該隨隨便便就能做到的，但卻會遭遇各方人事物的百般刁難，彷彿整個宇宙

  都在阻止他們達到目標似的，讓觀眾看了覺得這也太過荒謬。

  .

  而這正是《大濛》最令人難過之處：來自鄉下的小女孩只是想要北上尋親(屍)，明明是件




















  常看他的推文就知道他恨的不是《大濛》，他恨的是台灣'
