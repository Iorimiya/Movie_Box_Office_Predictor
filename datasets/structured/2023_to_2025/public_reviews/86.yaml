title: '[好雷] 大濛  溫柔地回望 '
content: "從沒有想過可以結合喜劇，來訴說台灣傷痕累累的這段過去。\n\n還記得小時候看完熱帶魚的快樂，在荒謬與詼諧的情節之中，在異想的童趣世界穿梭，卻\n\
  又在片尾時湧出一股惆悵。而大濛也勾起小時候看熱帶魚混雜著荒謬、笑料與不捨的情緒\n ，不同的是，歷史的重量，逼出一滴滴的眼淚…\n\n\n\n\n\n雷文防雷資訊頁\n\
  \n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n十幾歲的小女孩阿月隻身一人從嘉義北上，她的心願卑微而堅定，要領哥哥的屍體回家，\n\
  她帶著我們走進那個時代，遇見了外省退伍軍人趙公道，而他的心願也是如此卑微，他只\n想混口飯吃活下去，有朝一日帶著戰友的骨頭回家。\n\n阿月是白恐歷史裡被害者的家屬，而趙公道曾因為被牽連遭刑求，供出對自己有恩的長官\n\
  下落，被害者成為了無辜的加害者，在白恐的歷史裡，迫害是不分省籍與族群的，渺小如\n阿月趙公道都無法置身事外。\n\n電影溫柔起手，兩日萍水相逢的兄妹之情，一路上冒險犯難的喜怒哀樂，成為台灣40年代\n\
  獨有的公路電影，一路上有哭有笑，達成任務之前，在最壞的時代，遇見難得的善意與人\n情。\n\n儘管溫柔，卻能在每一個細節看見那一記又一記歷史的重手，黃家為了救回入獄的育雲散\n\
  盡家財、特務掠奪民眾資產、受害者家屬領屍還要付重金、沒人領的政治犯遺體被丟在醫\n學院成為解剖大體......\n\n最後，在阿月認屍時，數著一年又一年的年份裡，我也泣不成聲，不只是哥哥安慰著阿月\n\
  ，痛苦總會過去，也是在那一年一年裡，台灣一步步走向了解嚴、邁向民主化的路程，回\n首來時路，那段歷史近得餘悸猶存。\n\n兩個版本的水滴故事裡，第一版對著妹妹訴說理想，第二版對姊姊傾訴理想未竟的不甘，\n\
  黃育雲在電影中出現的場景很少，但貫穿了電影的主軸，這兩個故事代表著理想的初衷與\n破滅，也是大濛對前人的同理與致意，在乾涸的沙漠裡，每一顆勇敢的水滴，都不知道前\n\
  方的命運，卻依舊堅定前行。\n\n最後的聚首，趙公道笑說，只關了 25年，在心痛之餘，不免也想到「超級大國民」的許\n毅生，即便出獄了，卻還是被困在愧疚的牢籠裡。這一年的趙公道，有放下劉大慶了嗎\
  \ ?\n 但至少與阿月的聚首，趙公道人生的種種遺憾裡，能放下這一件事了吧.....\n\n大濛是導演溫柔地回望，向無數前人的真誠致意，同時在重現大時代的壓迫下，提醒人們\n\
  銘記歷史的殘酷與傷痕。致勇敢的雲與霧，你們成為了別人的風景，也是台灣成為今日台\n灣的原因。\n\n\n\n--"
