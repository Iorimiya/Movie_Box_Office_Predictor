url: https://www.ptt.cc/bbs/movie/M.1766334419.A.299.html
title: '[新聞] 《大濛》遭PTT電影版封殺！網兩派戰翻：'
content: '〔娛樂頻道／綜合報導〕陳玉勳執導的電影《大濛》獲得金馬11項提名，最後抱走最佳劇情

  片等4項大獎（不含觀眾票選獎），電影題材與白色恐怖有關，自上映以來話題不斷，今天

  （21日）PTT電影版宣布禁發《大濛》相關新聞，引來網友正反兩極意見。


  PTT電影版的版主今天早上發文，指出：「大濛11／27上映，現在12／21，宣傳已經足夠，

  相關新聞下面常常都是政治推文吵架，罵藍罵綠罵白都有，相聞禁發，發的砍除，水桶三天

  ，不累加，過去新聞不會砍除，心得文能發（但會看內容決定是否空洞洗版引戰）。」


  下面鄉民反應兩極，有網友大讚，「德政」、「支持全禁啊」、「板主英明！」、「政治電

  影有政治宣傳用意，本來就該禁一禁」、「水～政治電影滾一邊」、「德政，傻逼真的超多

  ，不管哪個立場」、「支持，明顯有計畫的在洗，太刻意了」、「支持版主連這裡也要看到

  政治口水真的很煩」、「板主有在處理就給推」。


  也有人提出反對，「處理不了政治推文只好拿電影開刀，呵呵」、「板主開這個先例，以後

  有政治立場不同就互相吵架，那是不是就要禁止該電影討論？」、「悲情城市也是政治電影

  ，以後是不是也要禁發？」、「太扯了吧，不去禁吵架，限制電影？？」、「這處理方式真

  的有夠搞笑」、「宣布電影板戒嚴比較直接」、「大濛熱映引發電影板戒嚴，何其諷刺」、

  「我還以為我在牆國」、「禁評是你」。


  部分鄉民也對版主提出建議：「請版主明定宣傳期的長度幾天，與亂吵的標準吧」、「請版

  主三思啊… 這樣是不是全部新聞都要禁？」、「請板主定規則啊」。


  - - -


  大濛刻劃小人物的生活

  在威權時代下仍努力地活著

  我在哥哥前面算著未來的年份就噴淚了

  我猜哥哥是活不到數出來的民國48年、49年


  2025年霧散了嗎？


  --'
