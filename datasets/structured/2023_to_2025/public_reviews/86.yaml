title: '[好雷] 去看那手工藝的質感—大濛A Foggy Tale'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  原本第二週才要跟朋友去看《大濛》，因為看到三宅唱的華山搶先特別場，而跟友人改約

  《旅與日子》，所以上週末就衝了《大濛》。


  原本就沒有抱任何預想，即使口碑場之後，傳出許多好評，我也沒有提升期待。主要就是

  很難想像這樣題材的電影能怎樣拍得好看？


  結果實際看起來，竟然是滿不錯。個人以為缺點也滿明顯，就是很快你就知道這部片會一

  直圍繞著那筆錢，錢來來去去，人來來去去，沒有一個很強的主線。可看到結束時，覺得

  這一點也許也不能說是完全的缺點，反而是跳脫了原本對劇情片的想像，而透過這樣子繞

  圈圈的方式，讓現代人看看那個年代。有人說像是玩遊戲一直遇到ＮＰＣ，寫的人是以批

  評的角度寫，我讀來覺得很像，卻是以正面的方式理解。


  很多人談美術，這部片的美術真的成就了這部片。那些新到不像真的（確實也是假的）的

  時代布景，讓這部片明明白白地表現它的悲喜故事，不是寫實的，是像童話像寓言（剛好

  是阿雲故事的兩個版本），這是陳玉勳的強項（作為長期的觀眾，很高興看到他在自己長

  處上下功夫，去進化，而不真的是去挑戰一些不需要去挑戰的東西）。在體驗完一切之後

  ，快轉時間，轉阿轉到我們熟悉的時代，這是一部給現代人的歷史通識課，它教的不是以

  英雄為主的歷史，而是試著回到那時代，讓故事中人去完成一件事，藉以呈現活在那時代

  的能與不能。


  相對於過往有過的「白色恐怖」時代的電影，這部片確實更多溫情和敬意。若是認為火力

  不足的人，去看《悲情城市》、《牯嶺街少年殺人事件》，前者大家都知道，但是似乎很

  少人會把後者列進這題材的觀影指南中。雖然確實《牯嶺街少年殺人事件》中只有一小段

  白色恐怖，但於我個人來說，那一小段比任何其他講「白色恐怖」的電影更強有力，那種

  看不見的暴力，甚至可以說是《牯嶺街少年殺人事件》的底色。


  再說回最後，以往常看到有人說：為什麼台灣拍不出什麼什麼片？看完《大濛》之後幾天

  ，我一直在想，是啊，台灣就是拍不出日韓歐美那些片，但台灣今天竟然可以《大濛》這

  樣的電影，其實也是非常不容易。我們的電影也許沒辦發展成所謂電影工業，可這種手工

  藝的質感，從搭布景開始，一字一畫一、一條街一棟樓，還有我覺得近期最看不出問題的

  後製技術。去好一點的電影院看到全部細節，是值得的。



  ***


  這裡是我的樂園:




  --'
