url: https://www.ptt.cc/bbs/movie/M.1766402348.A.C23.html
title: '[新聞] PTT「禁發《大濛》相關新聞」遭網諷'
content: 'PTT「禁發《大濛》相關新聞」遭網諷：電影版戒嚴　片商高EQ回應了



  新聞網址：



  白色恐怖題材電影《大濛》近期票房突破6000萬元，引發廣泛討論與好評，更榮獲金馬獎

  最佳劇情片殊榮。然而，由於影片涉及政治敏感議題，常在網路平台上引發正反派激烈論

  戰。近日，PTT電影版版主宣布禁止發布《大濛》相關新聞，引發網友批評此舉有如「電

  影版戒嚴」。對此爭議，片商則以高EQ回應，坦言遺憾但也表示理解，同時指出相關討論

  反而增加了影片曝光度。


  PTT電影版版主於21日發布公告，表示《大濛》上映近一個月，宣傳已足夠，由於相關新

  聞下方總是引發政治派系爭論，因此規定禁止發布任何《大濛》相關新聞。違反規定者將

  被刪文並禁止發文三天，只允許發布觀影心得，且需經過審核。此舉引發正反兩方討論，

  支持者認為可減少無謂爭論，反對者則質疑此舉有如在電影版實施「戒嚴」。


  《大濛》描述台灣白色恐怖時期，由方郁婷與柯偉林主演，講述一段尋親之旅。影片上映

  後獲得廣泛好評，目前票房已突破6000萬元，並獲得金馬獎最佳劇情片肯定。





  「

  」



  --'
