title: 'Re: [好雷] 大濛  當生活就是政治 政治就是生活'
content: '來推一下大濛

  這真是我近年來看過最好的臺灣國片之一了


  用小人物的平淡語言與視角建構出那個獨裁時代的荒謬

  想到那個被台灣人民唾棄而在野的政黨

  現在依舊活成獨裁的模樣

  覺得這真是一部警世神作


  電影裡的小特務頭子 依靠黨國組織給予的特權

  對善良平民各種壓榨和羅織罪名

  最後居然活的十分滋潤

  這不就是現在很多時代餘孽的翻版嗎?


  黨國體制好像消失了

  但他們依然在各領域都做著好生意 賣天賣地賣國家

  比如動不動就能佔國有地蓋豪宅

  隨便就可以找到很多範例


  電影只用一頁幾行字交代

  但觀眾走出電影院後細細想

  卻能現實生活裡

  可以找到罄竹難書洋洋灑灑的罪狀

  等著現世報












  --'
