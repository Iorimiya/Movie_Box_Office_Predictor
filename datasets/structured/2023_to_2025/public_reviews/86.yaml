url: https://www.ptt.cc/bbs/movie/M.1766462980.A.764.html
title: '[ 好雷] 大濛-還好當年不是現在政府執政'
content: '避免被水桶，有些關鍵字我用XXX代替。


  防雷

  .

  .

  .

  .

  .

  .

  .

  .


  .

  .

  .

  .

  .

  .

  .

  .


  .

  .

  .

  .

  .

  .

  .

  .


  《大濛》，電影劇情以過去國民黨威權體制的白色恐怖時期為背景，講述民國40年代底層

  人民的刻苦生活，和當時風聲鶴唳的社會風氣，整體來說，是非常推薦的一部電影。原因

  在於《大濛》全片營造的古早時代感很成功，開場甘蔗園的場景，彷彿真的帶領觀眾回到

  那個質樸卻又動盪的年代，這也是《大濛》的看點，電影不說教，靜靜地呈現出白色恐怖

  時期芸芸眾生最真實的模樣，片中的本省人和外省人，有善良的行徑，也有邪惡的舉動，

  《大濛》不刻意去美化其中一方，也不一味的醜化另一方，儘可能地保持客觀立場不偏頗

  ，因為這些平凡人，是在高壓統治下掙扎求生存罷了，一手造成如此多起悲劇的，是當年

  的政府，國民黨責無旁貸，這是臺灣人的不幸，也是整個大時代的悲劇，我們應當在當中

  學到教訓，避免重蹈覆轍，轉型正義是一定要做的，勢在必行，但不該以此作為清算政敵

  的手段，不能假借轉型正義的名義，藉機去清算對自己有威脅的人，不然這樣跟當年白色

  恐怖的國民黨有何兩樣？不過，也慶幸白色恐怖時期執政的不是現在的XXX，否則以他們

  高明的手段，臺灣可能變成第二個XX，我們連爭取民主的機會都沒有。




  回到電影本身，以白色恐怖為主題的《大濛》議題性很強，還有時代氛圍感營造成功之外

  ，許多演員都貢獻出絕妙的演技，主演方郁婷堪稱是臺灣這個年齡層中，演技最為自然脫

  俗的演員，幾乎找不到破綻；柯煒林獲得金馬提名最佳男主角，真的當之無愧，他的演出

  ，真的像是活在那個年代的人，在一些內疚或憤怒的情緒轉折，也都相當自然，毫不生硬

  ；9m88則是進步非常神速，第一時間完全沒認出是她，她已經是一位擁有電影感的演員了

  。林道禹飾演的撈屍人和蕭東意飾演的殯儀館員工，一者毫無生機，一者充滿喜感，都能

  詮釋出該角色的特質，為《大濛》添色不少。當然，老戲骨陳以文是最值得讚許的，他飾

  演的特務，帶給人的壓迫感，不寒而慄，而且那種恐懼感能收能放，他知道什麼時候該加

  大力度，什麼時候該讓人喘口氣，分寸拿捏自如，不怒自威的人，是最可怕的狠角色。



  關於陳以文飾演的特務范春，很值得深究，他本質上真的是純粹的壞人嗎？會不會范春抓

  到的人，真的都是共匪，他戮力幫國家肅清奸細，避免被共諜滲透，是一位抗中保台的大

  英雄？會不會他的手下二雄只是因為心上人醫師太太被搶走，才說謊誣衊范春把人刑求致

  死？《大濛》並沒有透露更多資訊來讓我們理解這這兩名角色，在沒有上帝視角的情況下

  ，下屬二雄的說法，只是片面之詞，不能盡信，指控人是要拿出證據的。我們換個角度想

  ，如果范春真的那麼壞，他大可不給趙公道錢去買酒，根本一毛錢都不用給他，繼續給他

  壓力即可；如果他真的那麼壞，趙公道刺殺他失敗，竟然沒有藉機報仇，把趙公道刑求至

  死？從這點來看，這完全不合理，也不符合人設。因此，從趙公道能活著回來這點推估，

  二雄對他的指控，有很高的機率只是挾帶私怨的抹黑。人是有多面性的，所以一個人在眾

  多人的評價中，絕對不會完全相同，因為每個人看到的面向不同，日本有部漫畫叫《貓之

  寺的知恩姐／猫のお寺の知恩さん》，第56話裡有句台詞：「就算是再好的人，只要有好

  好地在努力，在別人的故事裡，也可能會變成壞人。」若以國家的立場來論，范春是一位

  抗中保台、保密防諜、盡忠職守的公務員；在上級眼中，范春可能是一位盡忠職守的優秀

  下屬；但在受他刑求拷問的人眼中，范春無疑是一位心狠手辣的冷血特務。說的就是這種

  情況。如果看電影時，會對范春這名特務的行徑感到反感，那也應該要對這幾年動不動就

  扣人帽子，說人是中共同路人的政客和名嘴感到反感才對，因為他們做的事情本質上並無

  不同，特務殺人，政客側翼誅心，如果只討厭前者，卻可以容忍後者，這就是雙標，不是

  一個正常人該有的思維。




  電影結局時提到范春後來的發展，很多人忿忿不平，覺得這名威權時代作威作福的特務，

  應該有報應，怎麼會有這麼好的生活？原因很簡單，這世間不存在「善有善報，惡有惡報

  」這回事，這八個字是宗教用來約束人的行為，使其向善，但世間上有太多為惡之人沒有

  獲得應有的報應，例如：假借建國之名，行貪汙之實的前總統陳水扁，停建核四的他讓當

  時經濟蕭條，股市崩盤，他卻靠貪汙洗錢致富，退休後一樣擁有話語權並過著富裕的日子

  ；又或者車庫娛樂的老闆張心望，曾經背刺自己前東家威望國際，被指控背信，涉及不少

  刑事案件，最終威望國際也是求償未果。從這兩人的例子來看，你還相信「善有善報，惡

  有惡報」嗎？更何況，人沒有絕對善與惡，以趙公道為例，他本性不壞，卻也騙過阿月，

  人士有多個面向的，可能今天做了三件好事，也可能明天就做了兩件壞事，用善惡二元論

  來評斷一個人，真的太膚淺。



  最後兩段放上來，很可能會被桶或吵架，有興趣的朋友請移駕：

  k











  --'
