url: https://www.ptt.cc/bbs/movie/M.1763913530.A.AE6.html
title: '[新聞] 電影「大濛」奪金馬獎４大獎成最大贏家'
content: '電影「大濛」奪金馬４大獎成最大贏家　賴清德：讓我們重新走進台灣歷史現場



  電影"大濛"奪金馬4大獎。（圖／台視提供）

  生活中心／綜合報導


  第62屆金馬獎落幕，張震睽違4年再度稱帝，影后則由中國女星范冰冰拿下，而講述白色

  恐怖的電影"大濛"，本屆入圍11項，榮獲最佳劇情片、原著劇本、美術設計、造型設計等

  4座大獎，成為本屆最大贏家。


  總統賴清德在第一時間發文祝賀，大讚陳玉勳導演，帶我們重新走進台灣的歷史現場，讓

  這些故事能夠被世界看見。




  頒獎人西島秀俊vs.桂綸鎂：「第62屆金馬獎最佳男主角得獎的是，張震"幸福之路"。」

  宣布最佳男主角當下，張震用雙手摀住臉龐，難掩激動情緒，因為這是他相隔四年，再度

  封帝。




  第62屆金馬影帝張震：「我相信，不管今天有沒有拿這個獎，我都盡力而為，做我最好的

  一部分，電影是一個團隊的製作，每一個人都很重要，謝謝你們，沒有你們的努力，看不

  到我的表演，謝謝你們。」


  感謝攝影、幕後團隊，以及最愛的家人一路支持，至於最大獎最佳劇情片，則是不負眾望

  。



  第62屆金馬獎最佳男演員張震。（圖／台視提供）


  頒獎人廖慶松vs.李屏賓：「金馬獎最佳劇情片，得獎的是"大濛"。」第62屆金馬獲獎團

  隊導演陳玉勳：「我要謝謝這一次，沒有入圍的陳麒文攝影師，他是我心中比珍珠港還大

  的遺珠，然後也要謝謝盧立民，他也是這一屆，非常閃亮的一個遺珠，然後謝謝在天上護

  佑我們的，前輩前人謝謝。」


  講述白色恐怖歷史的電影"大濛"，橫掃最佳劇情片、原著劇本、美術設計、造型設計等四

  座大獎，成為本屆最大贏家。


  演員獎部分，除了新科影帝張震、影后由中國女星范冰冰拿下，男星曾敬驊，以"我家的

  事"榮獲最佳最男配角，女配角則由17年磨一劍的陳雪甄，以壓倒性的15票，全票過關。



  電影"大濛"奪金馬4大獎。（圖／民視新聞）


  總統賴清德（11.21）：「我非常喜歡陳玉勳導演，用電影來說台灣的故事，唱台灣的歌

  。」


  頒獎前一天，總統賴清德現身影廳、力挺國片，得獎後在第一時間更發文祝賀，稱讚"大

  濛"帶我們重新走進台灣的歷史現場，看見小人物如何在那個罩著大霧的時代裡相互扶持

  ，展現堅韌與勇氣，電影還沒正式上映，未演先轟動，口碑已經獲得滿堂彩。




  臺灣電影《大濛》預告：



  新聞網址：



  --'
