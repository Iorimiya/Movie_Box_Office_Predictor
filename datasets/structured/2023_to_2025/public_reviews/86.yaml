url: https://www.ptt.cc/bbs/movie/M.1768313102.A.586.html
title: 'Re: [討論] 大濛怎麼賣不好'
content: '理性分析有幾個原因:


  最大原因是被政治標籤化了!


  記得剛上映沒多久, 一狗票民進黨相關團體各種包場觀看, 然後就可在社群媒體


  看到一堆狗票看了電影後哭得淚流滿面, 然後開始指責藍白有多可惡, 各種吹捧


  民進黨, 再觀察進場觀影的民眾, 又很莫名高調說自己愛台灣, 然後開始在網路


  用電影出征異己, 甚至是只要對電影有意見批評的人, 都會貼上藍白跟舔共的標籤!


  試問, 大家現實只是要看個電影, 結果被旁邊人發現自己看"大濛", 直接被旁人


  認為是青鳥這種高度政治化的超激進團體...直接勸退一堆正常人!


  第二個原因是白色恐怖這種破爛主題被拍爛了!


  每年拍白色恐怖這種議題電影都搞得苦大仇深, 根本提不起勁看! 千篇一律的劇情


  拍到疲乏就算了, 三不五時還要扯到現實的政治鬥爭, 而且現實生活的228早就被


  特定政黨拿來消費操作仇恨攻擊政敵的工具, 讓很多人對這段歷史只剩下製造


  社會對立跟政治鬥爭的印象!


  第三個則是在討論上, 變得不是討論劇情而是政治鬥爭!


  光是版上因為這種題材的電影就吵鬧得不可開交, 大家只想政治歸政治, 電影歸電影


  懶得吵這種爛題材...


  結論: 台灣在討論關於白色恐怖的電影, 已經讓許多人反感了...估計市場只會越來越小



  --'
