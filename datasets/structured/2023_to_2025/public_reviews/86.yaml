title: 'Re: [討論] 大濛怎麼賣不好'
content: '很簡單 曲高和寡 叫好不叫座只有一個理由


  那就是:沒有引起台灣社會大眾共鳴


  大濛這部片是以詼諧包裝的時代反權威電影


  而且以台派敘事為主視角


  先講這部電影要凝聚大眾票房的根基只有兩個


  一個是台派的意識形態


  另一個是台灣社會大眾對國民黨政府權威時代的同仇敵愾


  舉個隔壁的例子


  南韓能一直拍出有全民票房的反權威電影


  那是因為南韓內部即便有親日反日的矛盾 但在大韓民族的意識形態上是統一的


  因此權威的軍政府能夠是所有南韓人民之敵


  意識型態的統整+跨派別對舊政府的苦難有集體共鳴


  所以票房能夠得到全民的參與 因為有共感



  但大濛的主旋律:台派敘事一開始就打掉了60%非台派的市場受眾


  因為外省基層的苦難已經在半個世紀的歲月之中凋零了


  而本省基層的仇恨雖然一直靠黨外組織/台派政黨凝固


  但大濛的時代背景距離現在確實太久遠了


  大濛時代的白色恐怖以及228事件對現在的台灣人來說只是一個概念


  一個曾經的蔣氏政權很壞的概念


  而台灣的人權以及民生其實在民主化的過程中已經有不同維度的改善


  年輕人對這個概念的反彈只剩下教科書的文字以及台派的敘事(而且不免會有政治操作性)


  講個直白一點 難聽一點的


  那就是其實大部分的人早就已經不在意了 覺得事情已經過去了


  "你是忘記了 還是害怕想起來"


  曾經是個很響亮的口號


  但承認吧


  大部分的人其實無感


  因為事情真的已經過去了


  以前確實很糟糕 但關我屁事?


  就是這樣


  如果你這時候跟人強調我們就是要警醒以免再回到過去


  一部分的人會覺得你反智 現在這麼民主了要怎麼回頭


  另一部分的人只會覺得你在說教 覺得你帶有政治操作的動機



  大濛是部不錯的電影


  但可惜它已經不是為了全體台灣人而拍的


  它是一封寫給舊時代台派的情書


  我們要承認電影視娛樂產業


  大家進電影院的需求必須獲得解決才有口碑


  而大濛只是沒有成功走出同溫層的好電影而已


  或許真的要拍全民共感的台灣歷史時代電影


  可以嘗試拍野百合運動


  這樣敘事就不會只有台派的票房而已


  台灣整體的共感會更加強烈吧


  --

  淦真的都沒東西了餒揑 不爽啦 淦我的東西都沒了啦 機掰勒只剩下水箭龜 剩水箭龜而已

  都沒東西啦淦都沒東西了啦 這蝦洨5等5等20(最高25等我已經看過了 沒有60這隻 對水箭

  龜啦只有水箭龜60其他都20) 你還敢給我講我的噴火龍勒!蛤!我的尼多王勒!我的尼多王!

  我的尼多王!嚇 我下班回來就是要玩這個 結果勒 我的東西 都不見了!我不想玩了趕羚羊

  啦我不要玩神奇寶貝了 不爽玩了啦我要把它砍掉!不爽玩了 我的神奇寶貝到底在哪啦 淦

  雞排勒 淦逃跑又失敗 啊~抓到了 抓到了抓到了妙蛙種子 淦 又要開始重練了想到就不爽


  --


  有關係


  電影裡面主角嘉義農家少女黃秋月很明顯是本省人


  (趙公道代表外省基層的受難者)


  而黃育雲講的大濛故事 其實就是台灣人在蔣氏權威政府壓迫下的寓言


  因此主旋律確實是台派的敘事沒錯



  你這個類比很有問題


  美國膚色不同的種族議題能夠凝聚黑奴時期的苦難共鳴


  但台灣現在本省人跟外省人幾乎沒什麼差別了


  口音 戶籍 生活習慣 兩者已經同化了


  只剩意識形態的差別


  這就是你類比有誤的地方 兩者無法混為一談



  我這篇只是分析這部電影叫好不叫座的原因而已


  你的回應感覺已經帶入政治對立情結了


  如果你覺得大濛是票房很成功的全民電影


  那可以自己開一篇文闡述你自己的觀點 尊重你的言論自由喔'
