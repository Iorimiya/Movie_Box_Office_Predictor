url: https://www.ptt.cc/bbs/movie/M.1765719668.A.D23.html
title: '[好雷] 大濛'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  本來想給普雷，因為後面插那一段謀殺情節，

  給我感覺破壞了整部電影的調性，顯得頗為突兀。



  這部片的主題是女主角黃小妹妹因為感情深厚的哥哥被政府抓走，

  甚至被槍斃，收到通知單後決定孤身一人至臺北領回遺體的故事。


  前面的黃小妹妹好傻好天真，被台北本地人騙走後還差點被推入火坑，

  幸好被從廣東逃難來的男主角救回，而男主雖然出口成髒又賭博打架鬧事，

  但他展現出來的性格，以及與黃小妹妹的互動都是這部的亮點，

  可惜對白讓他講太多髒話，到中間開始就有點聽膩了。


  本片的運鏡、構圖意象呈現以及搭配的音樂都讓我蠻欣賞的，

  不會有那種刻意賣弄的作法，幾乎都是很樸實平順的自然帶入，

  光是可以看到試圖還原那個時代的服裝、建築及街景就值回票價，

  也很少血腥畫面(除了謀殺情節開槍那段)，

  但打人的場面還是有的，會怕的人可以放心。


  而為何沒有給普雷，是結局那段使我很感動，

  真的讓人意想不到，特別是還記得那個物件，

  加上最後搭下電扶梯的那簡短2個字，

  更是意境悠遠，讓人又想哭又想笑。


  --'
