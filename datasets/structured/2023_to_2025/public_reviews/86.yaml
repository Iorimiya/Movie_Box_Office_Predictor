title: '[請益] 大濛的老特務問題？'
content: '防雷















  我是在想為何最後老特務沒有把男主殺了的原因


  我猜是因為男主單純是一般買兇殺人未遂


  並不是犯了什麼叛亂罪


  這樣想其實老特務還算有點原則


  只會對上頭交代的人下手


  不然以他的能力


  要把男主殺了根本簡單吧


  而且看起來老特務跟醫生寡婦也是兩情相悅


  並不是單純騙財？


  大家覺得呢？

