content: '片尾感謝當年的雲跟濛

  比喻像雲一樣的人事物

  出現一下就消失的雲霧


  片中說把希望寄託在未來

  這樣才能度過最苦的日子

  想像十年後自己會怎樣？


  雷


  曾敬驊演哥哥

  方郁婷演妹妹

  哥哥在逃亡躲警察

  就像在演返校的政治犯


  有天村長來家裡報信

  說她哥在台北被槍斃

  問他們要不要去收屍

  親戚說如果不去唸書

  可能她哥就不會出事


  他們爸媽都過世，家裡很窮

  親戚去住她家一起相依為命

  聽導演說爸爸因為打仗過世

  去台北收屍太貴所以破產

  收屍要一千元，全家可以吃一年


  但妹妹很愛哥哥還是執意要去收

  就籌了點錢坐火車從東石去台北

  聽說這是導演朋友媽媽的故事

  方郁婷演的應該就是那位媽媽


  到了台北，北車有夠亂

  很像現在的柬埔寨或緬甸寮國

  一堆騙子人販小偷地痞流氓

  她才剛到博愛路問路就碰到壞人


  由一家子兒咕咕叫的胡自強演反派

  他跟他在咕咕叫裡一樣演小流氓

  只是比較有念點書的高智慧流氓

  可能也因在本日公休演過一中生

  所以這片就變詐騙集團斯文騙子


  先把妹妹騙上黃包車

  然後載去賊窩打算賣掉

  結果行李掉在黃包車上

  運匠就掉頭要物歸原主


  一敲門就聽到求救聲

  馬上破門而入英雄救美

  還拿磚頭讓首腦頭開花


  之後妹妹就一直跟著運將

  運將問妹妹來意

  就跟胡自強一樣想騙他錢

  帶她去黑市當她哥的名錶


  結果整個黑市都穿通好

  就只賣了90元而已

  收屍要1000元


  運將就帶妹妹去賭場

  結果用90元連贏800元

  玩18辣四個骰子一個碗


  妹妹可能手氣好逢賭必贏

  最後一把運將手癢執骰子

  天生衰到爆，一把全輸光


  運將覺得愧對小妹妹

  就想幫她贖回那隻錶

  但當然是沒錢去贖錶


  就想跟她組扒手集團

  去扒有錢婦人的錢包

  但妹妹知書達禮做不來

  運將可能還是個文盲


  運將就把妹妹送去找他姊

  他姊在秀場當歌舞團跳舞

  有點像現在的韓國男女團

  下面一堆男粉絲買票捧場


  他姊大概嬰兒剛出生時

  就賣到台北給人當童養媳

  把她養大後跟家裡兒子結婚

  但她長大後沒法跟義兄結婚

  所以逃婚跑去秀場自立更生

  結果買家等於白花錢白養了


  妹妹一跟姊相認就血濃於水

  理論上應該從沒見過面才對


  姊跟舞團籌錢也只借到幾百塊

  還是錢不夠，這時還碰到飛賊

  這部戲有一點像是古裝武俠片

  劉冠廷演廖添丁二世的神偷


  也是跟妹妹有一面之緣

  還給妹妹幾百塊劫富濟貧

  後來才知道他是頭號通緝犯

  甚至被抓到蘭嶼都能越獄成功

  被演的好像真的是個神偷義賊


  正好劉冠廷也都演壞人居多

  這戲剛好能美化古代的義賊


  運將回家後被警總特務來家訪

  問他以前當兵的長官有無聯繫

  他說以前就被抓去嚴刑拷打過

  怎麼現在又跑來問他


  原來運將是廣東剿共的阿兵哥

  跟國民黨撤退來台就回不去了

  退伍後就當運將拉黃包車

  但他的長官叛變連累到他

  所以他供出一個軍官

  害他長官被活活打死


  之後特務就常來找他麻煩

  在匪區應該也算是黑五類

  保密防諜個人成分不乾淨


  沒多久特務旁的小特務

  億萬吉祥物蔡昌憲主演

  拿了一大把鈔票要買兇

  找運將去殺長官陳以文


  說陳以文搶了他的青梅竹馬

  就給運將一把生魚片刀

  用報紙包起來給他

  自己也帶一把短武士刀


  結果兩人都殺不了陳以文

  可能因為長官有把點三八

  六顆子彈全打光只幹掉蔡

  運將命大沒被打死跑得快

  不愧是打過仗的九命怪貓


  後來運將有錢載妹妹去收屍

  但屍體被送去國防醫學院

  當成醫學生解剖課的標本


  沒收到屍，一離開殯儀館

  反而被人蛇集團守株待兔

  馬上被一群流氓包圍堵人

  突然飛賊又帶警察出現

  警察追飛賊撞上這群人


  飛賊再次神奇的脫逃

  警察把人蛇集團逮捕

  結果把運將當成歹徒

  因為黑道流氓嘴巴多


  都說運將是壞人誘拐女童

  還在女童身上搜出巨款

  是運將行刺警總的錢

  當場全數沒收充公


  特務陳以文來警局

  默默的把運將給帶走

  大家都認為他死定了


  警察局長說被他們帶走

  應該都跟叛亂有關

  就像她哥一樣


  妹妹無奈還是得去收屍

  就跟姊姊跑去國防醫學院

  後來碰到好人可以領回屍體

  但大體要帶回嘉義沒有運費

  只能就地火化把骨灰帶回去


  醫學院裡也有焚化爐可以火化

  院方請工友帶他們去密室收屍

  密室裡有個大池子全是福馬林

  裡面泡了一堆無名屍

  比餘燼還多了防腐池


  工友是角頭系列的光頭林道禹

  他一出現就很陰冷像鬼差一樣

  這戲裡只要是公務員都很妖氣

  殯儀館的館長演上海人也很妖

  演的跟東廠特務裡的宦官一樣


  費盡千辛萬苦終於

  把哥哥的骨灰帶回嘉義東石

  而且還不用錢，醫學院不收錢

  殯儀館沒人認領就送去醫學院

  或埋到六張犁捷運站的爛葬岡


  結尾感謝以前像雲跟霧一樣的人

  運將 飛賊 秀場人 醫學院好人等

  像雲霧一樣突然出現幫了大忙

  又像雲霧消失不見無影無蹤


  時間來到現代

  捷運木柵動物園線剛通車

  妹妹已經長大也如願當了

  台北老松國小的小學老師


  她都當了阿嬤頭髮都白了

  女兒是宋云樺，還有孫女

  有天去醫院看病巧遇運將

  兩人一相認阿嬤老淚縱橫


  運將問找到哥哥沒？

  阿嬤久遇恩人哭著點頭

  說她以為他也被槍斃了

  多年一直在尋找他的名字

  他叫趙公道，趙子龍最公道


  他說沒死，只是做了25年牢


  阿嬤叫運將等她看完病

  叫他千萬別走，想報答他

  但運將只留下手上的錶

  讓護士轉交給她


  請護士轉告她這不是當年那隻

  他找了好久才找到很像的錶

  說完就快閃默默的煙消雲散


  這部片讓我哭到爆

  俠義情感非常濃厚

  期待這片能大賣

  但願能超越海角


  片尾有描述每個人的去向

  姊姊後來去美國找以前相戀的美軍

  特務頭子陳以文退伍後開貿易公司

  其他人跑馬燈跑太快記不起那麼多

  以後用手機按暫停才能細細咀嚼



  以上


  --

  ok3Q改了，我台語不太行

  前面講一長串，看字幕也慢

  未來看手機得一段段暫停看'
