url: https://www.ptt.cc/bbs/movie/M.1764503976.A.E5A.html
title: '[好雷] 大濛 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  耗資超過一億台幣

  今年最佳國片大濛真的是太好看啦


  美術非常的精美

  花了超過4000萬搭景

  徹底呈現50年代的台北風光


  用了兩個水的故事來呈現育雲的心境

  當然也可以拿來當作當時全體台灣人的心境


  節奏鬆弛有度，基本步調輕快有趣，但也時不時要讓觀眾緊張

  各種情節轉折都讓觀眾替阿月捏一把冷汗

  阿月與趙公道相處令人動容


  最後的劇情發展到最高，全場觀眾超過一半的人落淚

  啜泣聲此起彼落

  真的是非常感人的電影


  非常值得各位三刷五刷，期待票房衝破6000萬!!!


  --'
