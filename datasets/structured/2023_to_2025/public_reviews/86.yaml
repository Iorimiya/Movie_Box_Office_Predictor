url: https://www.ptt.cc/bbs/movie/M.1756879694.A.A28.html
title: '[情報] 2025金馬影展開幕片《大濛》'
content: '金馬影展《大濛》開幕世界首映 焦點影人西島秀俊攜《Dear Stranger》來台閉幕


  2025金馬影展《大濛》開幕世界首映 焦點影人西島秀俊攜《Dear Stranger》來台閉幕


  金馬名導陳玉勳率方郁婷、柯煒林、9m88、曾敬驊見證大時代的患難真情


  日本名導真利子哲也讓西島秀俊、桂綸鎂做最陌生的枕邊人




  將於11月6日盛大展開的2025金馬影展，今日公布開、閉幕片。開幕片由金馬獎最佳影片

  《消失的情人節》導演陳玉勳的矚目新作《大濛》榮膺，將在金馬影展世界首映，導演將

  率演員方郁婷、柯煒林、9ｍ88、曾敬驊一同揭幕。閉幕片《Dear Stranger》則是日本名

  導真利子哲也集結日本影帝西島秀俊、金馬影后桂綸鎂的懸疑新作，三人也確定出席影展

  參加映後座談。此外，金馬影展也特別規劃西島秀俊專題，加碼選映《人間合格》（1998

  ）、《電影魂CUT》(2011)、《在車上》（2021）等片，一睹西島秀俊的銀幕魅力。


  金馬名導陳玉勳繼《消失的情人節》獲得金馬獎最佳劇情片、導演、原著劇本等五項大獎

  ，籌備多年的《大濛》將在金馬影展首度亮相！影片以白色恐怖時期為背景，講述嘉義少

  女獨自北上贖回兄長遺體，險被拐賣之際，遇見廣東退伍車伕趙公道搭救，兩人因緣分成

  為患難之交。陳玉勳以笑中帶淚的草根幽默，道出時代、人性的悲歡善惡。影片邀來《美

  國女孩》方郁婷搭檔《濁水漂流》柯煒林，加上曾敬驊、9ｍ88的精彩演出，鮮活詮釋患

  難真情。




  得知《大濛》榮膺金馬影展開幕片，陳玉勳表示：「小時候看到百貨公司開幕都很羨慕，

  覺得喜氣洋洋、有很多好康的，希望有一天也能有個什麼來開幕。沒想到我拍的電影能入

  選今年金馬影展的開幕片，人生願望解鎖，十分開心與榮幸。」監製葉如芬開心之餘也感

  性地表示，希望透過故事傳遞他們對那時期的一點回望，也相信人跟人的真情友誼是可以

  感染的。監製李烈自謙不敢說已經做到最好，可是希望這份努力的心意，可以傳達給每一

  位看到這部電影的人。三人感謝《大濛》一路克服困難走來的所有演員和工作夥伴，也非

  常期待和觀眾在金馬影展相見。




  《Dear Stranger》導演真利子哲也和金馬影展十分有緣，前兩部作品《失序男孩》、《

  男人真命苦》（日原名：宮本から君へ）都在金馬影展大獲好評，兩度隨片來訪的他也對

  台灣印象深刻。新作《Dear Stranger》更邀來金馬影后桂綸鎂與《在車上》日本影帝西

  島秀俊攜手合作，飾演一對在紐約生活的台日夫妻，看似平凡幸福的日子，卻在兒子被綁

  架後變調，兩人亟欲隱藏的過往和壓抑的內心也逐漸浮現。影片透過看似微小事件，揭開

  美國移民家庭在文化熔爐下煉不開的內心孤寂、家庭束縛和種族隔閡。真利子哲也表示非

  常高興自己的新作能和許多敬愛的導演作品一樣獲選為金馬影展閉幕片，期待和台灣觀眾

  一同觀賞，並希望《Dear Stranger》能為影展劃下精彩句點。桂綸鎂則表示：「能夠參

  與《Dear Stranger》這部電影，我的內心充滿感激，它讓我重回表演的最初，開啟我對

  於藝術創作的另一扇門。謝謝金馬影展的邀請，很榮幸與你們分享這份感謝與感動。期待

  這部電影餘音繞樑，陪伴觀眾前進下一趟的旅程。」


  在影迷殷殷期盼下，西島秀俊確認出席金馬影展。影展也特別規劃專題，除了閉幕片《

  Dear Stranger》，還將選映他早期與黑澤清導演合作的《人間合格》，青澀卻純粹的演

  技獲得日本電影專業大賞男主角獎。與伊朗導演阿米爾納德瑞合作《電影魂CUT》，用拳

  擊血汗支撐電影夢，信手拈來超過一百部影史經典，絕對讓影痴看得熱血沸騰。在濱口龍

  介執導的《在車上》，西島秀俊精湛內斂的演技也獲得美國國家影評人協會、日本電影學

  院影帝殊榮，西島秀俊專題完整片單將後續公布。得知新作將在金馬影展閉幕，西島秀俊

  非常高興之餘，也提到和桂綸鎂的合作是一次難以忘懷的美好經驗，自己很榮幸成為本屆

  影展的焦點影人，十分期待11月在金馬影展和台灣觀眾見面。



  心得:

  看來《大濛》也是跟《餘燼》一樣

  國際影展被退貨沒人收

  只能作為金馬開幕片

  去年金馬前進坎城的四部片看來命運都不好

  只有《女兒的女兒》至少還有個東京+多倫多

  剩下的一部《功夫》不曉得能否如期明年賀歲檔上映


  --'
