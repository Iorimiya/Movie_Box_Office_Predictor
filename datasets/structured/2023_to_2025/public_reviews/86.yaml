url: https://www.ptt.cc/bbs/movie/M.1763919814.A.6B8.html
title: '[好無雷] 《大濛》絕對會在臺灣影史上記上一筆'
content: "《大濛》A Foggy Tale\n｜2025｜陳玉勳｜134mins｜\n\n\n\n受金馬效應影響，最後一天口碑場幾乎滿座！整場都是窸窸窣窣的鼻涕聲，也因此想分享\n\
  一些無雷心得，會盡量以客觀事實去條列本片的優缺點，希望可以推薦到你。我不是製作\n人員，只是一介觀眾，而身為觀眾，製作過程其實可以完全不用理會，靠成品說話。但若\n\
  知道幕後的艱辛，或許可以更加理解它的誕生是多麼得來不易。\n\n\n\n1. 本片不以服務政治為目的，它就是想講好一個故事，刻劃那個時代下小人物的人性黑\n暗與光輝，但卻不會過於沉重，一如陳玉勳以往的主角群一樣，都非常可愛，所以壁虎先\n\
  生才會說他humble，只做自己能做好的事，而不是題材架構先於劇本。\n\n2. 演員演技完全沒有掉線，選角非常厲害！就連最令人擔心的9m88都表現得比預期還好\n\
  ，且臺語鄉音聽的出來是有認真考究雕過，不會因為口音出戲。\n\n3. 趙公道這個角色絕對會在歷史上記上一筆，臺灣電影從來只在乎臺灣人的迫害，或是\n戰後老兵的心境，對於戰間流亡的青年，鮮有去關注甚至是描述，本片能把這樣的角色放\n\
  到男主角的位置，非常難得可貴。\n\n4. 本片預算只有9000萬，卻很高程度還原了老臺北的情景，王誌成老師的美術和許力文\n老師的造型設計功不可沒，真的非常厲害！（抱歉，真的不懂為什麼高鐵驚悚片預算可以\n\
  到1.6億，卻沒有一個地方能讓人滿意）\n\n\n\n1. 可能受限於製作期限吧，但劇本還有再打磨的空間。\n\n2. 配樂偶有亮點，但整體比較普通。\n\n\
  3. 9m88的片尾曲〈大濛的暗暝〉就算有調音過，她那R&B的唱腔唱臺語還是有點不夠味。\n\n整體來說，還是瑕不掩瑜的好作品，非常推薦11/27(四)上映後去電影院看看！\n\
  \n--\n\n\n\n--\n急了 \n三部片的角色背景、節奏調性大相逕庭\n偏要針對這個無聊的點問他humble不humble?\n嗯，你說的沒錯\n\n\
  等你^^\n\n消失確實比較好看而且完成度也更高\n\n是可以這麼說，但他就算失手，下限還是比其他人高很多很多"
