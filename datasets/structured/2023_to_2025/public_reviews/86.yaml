title: '[新聞] 《大濛》金馬入圍贏家 奧斯卡導演來爭獎'
content: '新聞原標：金馬62》《大濛》11項入圍成大贏家 奧斯卡最佳導演也來爭獎


  新聞網址：




  第62屆金馬獎今日（10／1）公布入圍名單。今年報名影片共計593部（劇情片80部、動畫

  片3部、紀錄片64部、劇情短片310部、紀錄短片79部、動畫短片57部），入圍名單由本屆

  星光大道主持楊千霈、徐鈞浩、彭千祐共同揭曉。



  由，包括最佳劇情片、最佳導演、最佳男主角、最佳女主

  角、最佳原著劇本、最佳視覺效果、最佳美術設計、最佳造型設計、最佳原創電影歌曲、

  最佳剪輯、最佳音效；

  ，包括最佳劇情片、最佳男配角、 最佳女配角2位、最佳新導

  演、最佳新演員、最佳原著劇本、最佳攝影、最佳剪輯，西恩貝克本人也入圍最佳原著劇

  本及最佳剪輯。


  幸福之路）、藍葦華（我家的事）；最佳女主角入圍的有方郁婷（大濛）、劉若英（我們

  意外的勇氣）、林依晨（深度安靜）、高伊玲（我家的事）、范冰冰（地母）。


  金馬執委會執行長聞天祥也在記者會上公布本屆「年度台灣傑出電影工作者」得主為「鍾

  瓊婷」。得獎理由是，「燈光師鍾瓊婷以敏銳與專注，為許多影像創作者提供了可靠的支

  持與靈感。她參與過的作品跨越不同世代與類型。今年她以《大濛》遼闊蒼茫的氛圍，與

  《我們意外的勇氣》細膩而溫暖的光線，展現獨到的手筆。本屆評審團希望藉由這個獎項

  肯定她今年在電影燈光的專業與貢獻。」


  第62屆金馬獎評審作業分為初選、複選、決選三階段進行，最終得獎名單將於11月22日頒

  獎典禮當天選出，完整評審名單將於10月下旬對外公布。


  所有入圍影片皆會在11月6日展開的金馬影展放映，影展自


  ，詳細活動資訊可上金馬官網查詢。


  第62屆金馬獎頒獎典禮於，台灣觀眾可鎖定台視頻道同

  步收看直播，網路直播則由MyVideo影音獨家播出，LINE TODAY共同轉播，海外除了新加

  坡（StarHub）、馬來西亞（Astro）各有當地電視台直播外，其餘地區皆可透過金馬與台

  視YouTube同步觀賞，更多資訊請見官方網站典禮資訊。


  --'
