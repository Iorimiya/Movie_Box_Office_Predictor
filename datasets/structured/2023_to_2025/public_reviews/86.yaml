url: https://www.ptt.cc/bbs/movie/M.1764682381.A.133.html
title: '[好雷] 《大濛》 - 人的風景/光景與時間性 '
content: '榮獲本次金馬BP 最佳原創編劇等


  女主角可惜了



  本來是要跟朋友去戲院看

  但意外朋友有事 遞補


  感謝 榮耀基金會包場




  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  年紀越大淚腺越來越發達了。


  電影平舖直述，一些細節、小瑕疵，無傷大雅。


  這是一部是自己沒有特別要談些什麼的電影敘事方式（要講的很多人都講了）。



  對我觸動的點在於。人的風景/光景與時間性。



  首先是編劇對於善惡的相依或說陰陽同一。在維持故事線的進行中，對於壞人與好人的反

  覆無常與低限（僅僅在局部的外省人呈現的惡狀）。阿月上台北與人的相遇，不知是真誠

  還是別有用意。福禍相依，在緣份中擺盪，就像風景中的人，來來去去的霧氣，水滴的故

  事。



  再來是演員的部分（以往談電影不太提演員 XD），特別稱讚方郁婷，即使台語口音有些

  地方奇怪，但成功演繹，代表著純樸台灣人善良、堅毅，與島外來的活力：趙公道，帶有

  即興的口語髒話聲音表演。兩位 一動一靜，交織故事線內部生命螺旋。



  第一次的哭點，就是阿月在戲班遇到姐姐就被美秀邀請去舞台下見證著眼前的歌舞熱鬧與

  繁華，那一付不可思議和淚牛滿面的的表情。不只是苦難現實與綺麗幻想境地之間對比，

  而是看到了稱之為「電影」─ 在足以濃縮的時間流轉中痛哭流涕。



  認屍橋段，念咒般，時間躍進/回溯的魔法，昭示著《大濛》在過去與未來，以機械手錶

  的客觀時間，卻是在充滿數字的鐘，終究內化的純粹抽象的意識。電影幻覺，即是那不存

  在的時間之河（歷史，皆只是如何再現的形式）。



  --


  拉特飯 - 以商業力量進入獨立市場


  --'
