title: '[心得] 大濛，真正的台語"電影"'
content: '不像以往台灣電影，例如:「角頭」那類平鋪直述單純演出台灣社會現象

  劇裡的一些小細節，甚至焦距外的背景都是有其含義在

  這樣的電影表現手法，沒有很直接的喜或悲，反而多了點想像以及奇幻的元素在裡面

  比起過往的台灣電影，有跳脫出一個新境界(輕柔的隱喻以及奇幻想像力)


  雖然劇情，觀看中，沒有特別讓人會到狂流眼淚的橋段

  但若回想起在那時代的時空背景，就會有股莫名的悲傷


  其實導演刻意以小人物事件，輕輕點綴上那時代的悲劇

  整齣劇寓意深遠的是劇中前後兩則小水滴的寓意


  很推薦大家去看這部屬於台灣真正的台語電影

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  話說，沒想到都這年頭了，還可以看到禁片

  這幾年一直在講轉型正義，轉型正義，看完導演的訪問文章後

  突然覺得台灣才剛正值轉型正義的艱難起步時刻而已

  我想又會有一群人覺得轉型正義是在分裂台灣

  說真的，我覺得這想法很適合中國的河蟹文化


  附上導演的訪問文章




  --'
