title: '[新聞]金馬光環加持！《大濛》聲勢攀升票房破3千'
content: '金馬光環加持！《大濛》聲勢攀升票房破3千萬


  今年金馬獎最大贏家《大濛》，由陳玉勳執導，耗資1.2億元打造，重現1950年代白色恐

  怖下的台灣，感受小人物為生存奮鬥的勇氣與情感，有著金馬光環加持，票房已突破3千

  萬。而另外一部問鼎本屆金馬獎最佳男主角獎項的新加坡電影《好孩子》，在台上映後同

  樣好評不斷！


  方郁婷、柯煒林等人演出 《大濛》重現白色恐怖下的台灣

  《大濛》找來方郁婷、柯煒林、曾敬驊等演員演出，在本屆金馬獎風光奪下最佳劇情片、

  最佳原著劇本、最佳美術設計、最佳造型設計4項大獎，導演以詼諧方式包裝沉默時代的

  壓抑悲歌，登上大銀幕感動無數影迷。


  導演陳玉勳坦言，「拍這部電影要花好多錢，應該沒辦法回收，


  也不會有人想投資，寫完就算了，就是抒發自己的心情，


  能夠完成這部電影，我已經心滿意足了。」




  --'
