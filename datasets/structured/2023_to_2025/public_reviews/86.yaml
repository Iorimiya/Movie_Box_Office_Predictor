url: https://www.ptt.cc/bbs/movie/M.1766341507.A.144.html
title: '[好雷] 大濛  當生活就是政治 政治就是生活'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  版主要禁大濛的新聞，反而讓我這個潛水不知道多少年的人出來發心得文


  育雲的童話故事，看得懂的人都知道在影射  沒有自由的人  與充滿自由的人


  這部片很多支線，很多也交代不清楚


  但忠實呈現了  在那個時代  白色恐怖也只是生活的一部分


  大家知道  大家不談   大家繼續努力活著


  被槍殺了  哎呦那ㄟ安內？   繼續吃飯


  只有身為親人的阿月  硬著一口氣也想把哥哥的屍體帶回家


  我覺得真的是一部滿不一樣，講述白色恐怖的電影


  因為所有人都在過自己的生活   彷彿一切都沒有事情發生（或是裝作沒有看見）


  只有在那黑暗角落  那些搜查人員  蛇一般無聲的  帶走人  然後人死去


  然後  所有人  繼續生活  繼續打招呼  說笑  玩樂  賺錢


  不像返校一般   從頭到尾充斥著壓抑與恐懼


  大濛的恐懼是隱性的   藏在日常生活中的


  大家知道被抓走的人沒有理由  也不敢討論理由


  於是大家繼續生活  假裝一切都沒發生過


  沒人敢說出口  沒有人敢站出來說出口


  現在民國114年，我，可以說出口


  我，可以站出來抗議


  我突然死了我的親友會出來幫我找出原因


  我是阿水，我不在溪裡，我也不願意在溪裡


  我很慶幸我可以發言，這是PTT的初衷


  我反對版主針對大濛新聞進行言論管控



  --'
