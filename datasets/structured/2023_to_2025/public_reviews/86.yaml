content: "大濛票房拚3千萬 陳以文超壞 蔡昌憲帥領便當\n\n2025/12/09 05:30\n\n\n《大濛》「特務組」陳以文（右）和蔡昌憲的角色引起討論。（華文創提供）\n\
  \n〔記者廖俐惠／台北報導〕電影《大濛》上映兩週票房持續升溫，本週將突破3000萬，討\n論度不斷。陳以文、蔡昌憲在片中飾演的特務組合，吸引程度不遑多讓，蔡昌憲更坦言一\n\
  度把陳以文幻想得很可怕，在金馬相遇之後，當晚還做了惡夢。\n\n陳以文、蔡昌憲從特務搭檔，到後來反目成仇，蔡昌憲在扭打之際遭到槍殺，從影生涯第\n一次「領便當」，順利拍攝結束還不忘問導演陳玉勳：「有死得很帥嗎？」見到陳玉勳比\n\
  出大拇指讚「帥」，讓他覺得一切都值得。\n\n《大濛》吸引許多影人力挺，吳念真有感特務頭子陳以文壞到不行，卻沒有受到報應，還\n富貴晚年，感嘆：「這是在這樣的時代裡，這部電影最心痛也最誠意的交待。」莫子儀也\n\
  有感而發，「希望自己有一天也能化為雲與霧，降落在這片土地上，陪伴、滋潤所有乾枯\n的孤寂，哪怕再遙不可及，也能一起重建溫暖的希望與夢想。」\n\n--\n\n\
  \ 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
