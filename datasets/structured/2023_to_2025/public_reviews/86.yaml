url: https://www.ptt.cc/bbs/movie/M.1766245548.A.59D.html
title: '[新聞]嘉義看一次不夠！奈良美智衝台北二刷大濛'
content: '奈良美智深受台灣文化吸引，除了愛上嘉義薑母鴨之外，近期推出的國片「大濛」更是讓

  他進戲院看了兩次；今（20）號奈良美智在thread發文說「我在嘉義看過一次，這次又在

  台北忍不住再看了一遍。（圖／翻攝thread@michinara3）


  日本藝術家奈良美智「跟著朦朧潮濕的一天回嘉」展日前在嘉義縣新港文化館25號倉庫開

  展；奈良美智除了來台宣傳，也沈浸式享受台日文化。今（20）日更是二度進戲院欣賞國

  片「大濛」。


  中華文化總會主辦的奈良美智在台10年巡展第5站前進嘉義，在新港文化館辦開幕記者會

  ，奈良美智、文總秘書長李厚慶、嘉義縣長翁章梁與日本台灣交流協會高雄事務所長奧正

  史等與會。展期自12月12日起至明年5月17日，重新詮釋的經典畫作「凋謝的花」首度曝

  光，也展出繪畫、素描、攝影等作品。


  奈良美智深受台灣文化吸引，除了愛上嘉義薑母鴨之外，近期推出的國片「大濛」更是讓

  他進戲院看了兩次；今（20）號奈良美智在thread發文說「我在嘉義看過一次，這次又在

  台北忍不住再看了一遍！真的非常震撼。因為已經知道故事內容，這次幾乎不怎麼看字幕

  ，而是更深地沉浸在影像之中。第二次看的感動反而更強烈，連我自己都覺得很意外。


  日本藝術家奈良美智「跟著朦朧潮濕的一天回嘉」展日前在嘉義縣新港文化館25號倉庫開

  展；奈良美智除了來台宣傳，也沈浸式享受台日文化。今（20）日更是二度進戲院欣賞國

  片「大濛」。（圖／翻攝thread@michinara3）

  阿月有兩段哭戲讓我特別揪心：一段是看著姊姊在舞台上又唱又跳的那一幕，另一段是去

  確認哥哥遺體的場景。那是兩種完全不同的眼淚。


  好像也已經確定會在日本上映了，下次我要在日本再看一次。」


  由此網友留言「奈良美智老師都看了兩次了，趕快去電影院支持大濛起來」、「謝謝奈良

  先生2刷。 台日友好，天佑臺灣！ 」




  --'
