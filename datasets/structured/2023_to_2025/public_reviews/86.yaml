url: https://www.ptt.cc/bbs/movie/M.1763701114.A.F9B.html
title: '[大好雷] 大濛'
content: "我從不看國片的人\n本身對台灣政治發展一定程度了解 \n\n劇情大綱：\n育雲（哥哥）在台北讀書 因白色恐怖遭追緝\n躲在嘉義鄉下的田裡 秋月（妹妹）帶飯接濟她\n\
  被警察追到田裡\n時間來到一年後 有人來通知育雲已被槍斃\n同住的叔叔說沒錢上去台北接屍 需要一千元 這可以讓全家吃一年\n妹妹帶著四十元自己搭車到台北 要去極樂殯儀館接哥哥回家\n\
  馬上就被壞人強擄 幸好有趙公道（三輪車）救她\n途中又經歷了一堆苦難 \n最終當秀霞（9m88飾演）跟秋月來到醫學院\n魯常在拉大體給他們認屍的時候\n我真的忍不住啜泣\
  \ \n我沒想到我會看國片到在電影院啜泣\n秋月一個14歲的小孩 回想著育雲跟他講述的「兩顆水滴」寓言故事\n沒想到在被抓之前的故事 和被抓之後跟秀霞講的故事\
  \ 已不相同\n此時破題 「大濛」\n育雲火化完成後 秋月秀霞跟著大街上的送喪隊伍\n對著哥哥說可以回家了\n我又忍不住顫抖不讓自己啜出聲\n\n但最後的片段拉回到現代\
  \ 演員開始講國語時我又開始覺得出戲\n所幸最後的那一句「走囉」真的是給本片完美的結尾\n\n我真的很推薦大家去看\n我看不起國片的人都這麼推薦 我完全沒料到\n\
  \n\n\n-----\nSent from MeowPtt on my iPhone\n\n\n--\n\n\n看到9m88台上唱歌瞬間出戲 \n可能我真的看太多民主運動的書\
  \ 覺得透過平民百姓的角度看這年代有多悲戚這方面很打\n動我\n大家對國片都好熟 我只是抱著踩雷的心理準備 才有超出預期的收穫\n沒有現代線的話我給的評價會更高\n\
  \n\n\n\n\n\n\n種11/21 16:37\n\n\n，11/21 20:33\n你提到的這些缺點我都有一樣的問題 但還是不影響我覺得這部好看\n感覺我這篇文已經變成在吵其他東西了\
  \ \n我感到非常抱歉 沒去了解就一昧的以為國片現在只剩角頭 我以後會更加關注"
