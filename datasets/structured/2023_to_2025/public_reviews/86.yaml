url: https://www.ptt.cc/bbs/movie/M.1765661831.A.9D5.html
title: '[新聞] 奈良美智推《大濛》：這部將會成為名作'
content: '奈良美智推《大濛》「這部將會成為名作」　陳玉勳驚喜回應




  日本當代藝術家奈良美智來台舉辦展覽，他曾在X跟Threads上表示對電影《大濛》很有興

  趣，果然來台後實現承諾跑去看了《大濛》。他在社群貼文上表示：「終於觀賞了《大濛

  》這部電影。


  主角的演技真的非常精湛，還有最後響起的歌曲（是阿月的姊姊唱的嗎？）也相當動聽。

  」並貼上9m88演唱的主題曲〈大濛的暗眠〉YouTube連結，導演陳玉勳也在臉書回應：「

  奈良美智真的來台灣看《大濛》了，謝謝奈良美智老師！」




  日本當代藝術家奈良美智來台舉辦展覽，他曾在X跟Threads上表示對電影《大濛》很有興

  趣，果然來台後實現承諾跑去看了《大濛》。他在社群貼文上表示：「終於觀賞了《大濛

  》這部電影。


  主角的演技真的非常精湛，還有最後響起的歌曲（是阿月的姊姊唱的嗎？）也相當動聽。

  」


  並貼上9m88演唱的主題曲〈大濛的暗眠〉YouTube連結，導演陳玉勳也在臉書回應：「奈

  良美智真的來台灣看《大濛》了，謝謝奈良美智老師！」




  奈良美智「跟著朦朧潮濕的一天回嘉」特展正在嘉義縣新港文化館 25 號倉庫展出，展覽

  期間自2025/12/12 至 2026/5/17。


  這次展覽是奈良美智在台10年巡展計畫「跟著朦朧潮濕的一天去旅行」繼金瓜石之後，第

  5站來到嘉義，作品包括首度在台展出的《凋謝的花（2020版）》大型畫作。


  奈良美智聽〈莎韻之鐘〉落淚　台語語速太快


  每次都是親自佈展的奈良美智，又來到台灣展開趴趴走行程。行前他就宣告對電影《大濛

  》很有興趣，沒想到在開展當日就跑去看了電影，他在社群上表示：「在送葬隊伍中演奏

  的音樂是《莎韻之鐘》（サヨンの鐘），加上與自己的經歷有所重疊，讓我不禁落淚。雖

  然大致的情節都理解了，但是台語的語速太快，英文字幕還沒看完就消失了，所以還是有

  很多地方沒辦法理解。」


  新聞網址：



  --'
