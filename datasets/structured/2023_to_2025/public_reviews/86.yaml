title: '[好雷] 大濛  仍是泥土路的台北'
content: '雷文防雷資訊頁






  無雷心得：極有時代氛圍的片。






  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  雖說好雷，我想把缺點都先說一說。


  缺點，太多分枝。比如刺殺，我粗淺的理解，是要增加特務方的人性，以及男主

  最終陷入牢獄之災的原因。


  以及賊，我連名字都懶得記。這腳色其實沒到很多餘，但在快轉時提到他讓我覺

  得很多餘。感覺是為了增加時代感：那時小偷很多。相對現代人拿手機佔位子，

  其實也是很重要的背景。但對整部戲只有兩幕的腳色給了後日談實屬畫蛇添足。


  男主回去找二手攤要錢這幕我也覺得不夠完整。你可以用男主也會騙人來增加腳

  色的多樣性，但要給出足夠的邏輯讓觀眾了解。而且這種多樣放在主要投射的主

  角上，應該要更小心。要麼刪掉，要麼解釋一下為什麼願意為了還女主失物救人

  卻又想要騙女主錢財。不還跟騙兩者還是不還成本比較低。


  最後是撈屍體時，女主不停說著數字，這點我也很出戲。我不確定都不講話會不

  會更好，但我寧願這幕它是拍著女主的手，不停對不存在的手錶轉時間。



  雖說如此，我依然願意說這是部好電影，甚至我也認為這是好劇本。

  因為劇本凝聚了許多巧合，為了包括當時的人間百態。但也或許是野心太大，一

  些旁支的前因後果沒辦法做得很完整。

  看完當下，我覺得這部有點「御都合主義」，用近乎機械降神的方式，把想要的

  劇情硬塞進去，讓整部電影都有些魔幻的味道。

  但能很清楚知道這些插入的劇情的用意，也就是想把那時代會發生的事濃縮在這

  短短幾天的旅程。


  撇除掉旁枝，會發現故事本身其實相當完整，尤其對男主的形象刻畫相當深刻。

  多種方言髒話的來由，本應逃亡，卻仍放不下女主，導致來不及逃。以及多年來

  依然備著的手錶。

  他的人生是悲劇。但他帶給女主那一刻最亮的光。


  --

  主要是我不太喜歡快轉到現代時，用文字跟圖片交代後續的手法。

  女主的女兒都能問「舅舅不是接回來了嗎？」這種程度的話，後續用對話交代不

  是更好？


  我還是不覺得這只有兩幕的腳色有需要用這種方式交代後續，何況他的後續也一

  樣魔幻。


  我個人的哭點在最後巧遇男主，相當驚喜他還活著。

  然後他的時間就被荒廢了，沒有家庭不一定是悲慘，但相對女主，他活得像悲劇。


  想到可能真的有外省老兵是這樣完結一生，悲從中來。


  我有一些想法可以去合理這個行為，但我仍然覺得螢幕上的對白不足以形成一個

  完整邏輯。


  可能是我缺乏一些背景知識，或者其實男主只是要盧小，不是真的覺得價格差這

  麼多。


  你說的很合理，但當下我覺得缺了一點對白去描述這到底是甚麼回事。

  有沒有介紹回扣、公道價幾幾分之類的。

  讓我有點不確定到底是說好的，還是硬凹。


  念年代我覺得就是我說的拍女主調不存在的手錶，一般閃回哥哥的話語這樣。


  講故事可能就演員說服力不夠？或者提到故事不夠自然？

  我也覺得這段讓人出戲。

  不過這一段很必要，但可能是崁入的不夠滑順。問題應該比較細緻，可能劇本跟演員

  都有一點關係。


  巧遇這一段真的是最動人了。


  他真的慘....

  哇，你解答了我的疑問，原來那是是被警戒。

  這部戲裡面本省人跟外省人的衝突好像沒被刻意強調，描繪得比較幽微。

  當時我一開始只想是對陌生人的戒備，但覺得有點太過。現在想起來應該是省別情節


  賊的話我就真的只是討厭他在後日談出現，會讓我不知道後日談是誰的視角。

  可能，如果在對話中有更多討論過這個人，我會更願意接受？

  這樣想起來，我是不喜歡那一段的手法更多於這個腳色，只是這一段出現這個腳色

  尤其多餘，所以在批評時拿他出來講。但實際我是不喜歡這一段。


  這一段除了用母女聊天的形式去替換，再來可能就是用一樣手法，但更能看出是以

  誰的角度去回憶中間這些年發生過的事。

  他的拍攝方式，應該是以看故事的人，這樣一個旁觀者的角度去快速地看那時到現

  在的改變，但我這個人並沒有打算知道這當中的某些事。

  所以我會覺得我被放在一個不是我的框架去看故事。

  有點像一本用第二人稱書寫的小說，看起來格格不入。'
