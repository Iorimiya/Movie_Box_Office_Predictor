title: '[新聞] 金馬62今先頒出1獎《大濛》抱回觀眾票選獎'
content: "金馬62今先頒出1獎《大濛》抱回觀眾票選獎\n\n【大紀元2025年11月21日訊】（大紀元記者馬維芬報導）金馬執委會今（21）日舉行第62\n\
  屆金馬獎入圍午宴，為隔天登場的金馬獎頒獎典禮暖身。同時也率先頒發本屆金馬獎觀眾\n票選獎最佳影片，由《大濛》贏得；國際影評人費比西獎則由《核》獲得。\n\n今年「金馬獎觀眾票選最佳影片」活動於花蓮、新竹、台南三地同時舉辦，觀眾須完整觀\n\
  賞完五部入圍的最佳劇情片《人生海海》《左撇子女孩》《眾生相》《地母》《大濛》後\n，才能投票選出心目中的最佳影片。最後共有432位觀眾完成，結果由陳玉勳導演的《大\n\
  濛》勝出。\n\n\n第62屆金馬獎觀眾票選獎得主《大濛》。（台北金馬影展執行委員會提供）\n\n「國際影評人費比西獎」起源於1930年正式成立的國際影評人協會，以推廣電影藝術為使\n\
  命，鼓勵了無數傑出的電影，也建立起它的權威性。它在金馬獎以鼓勵年輕、傑出的華語\n電影新銳為目標。本屆入選影片包括《我們意外的勇氣》《深度安靜》《幸福之路》《左\n\
  撇子女孩》《遼河的士》《我家的事》《恨女的逆襲》《殺手#4》《今天應該很高興》《\n柔似蜜》《核》《不可能女孩》共12部。\n\n\n2025國際影評人費比西獎得主《核》。（台北金馬影展執行委員會提供）\n\
  \n評審由羅馬尼亞影評人與策展人安德雅佩德烏、義大利影評人喬凡尼斯迪亞諾梅蘇提、影\n展策展人與台灣影評人協會副理事長洪健倫擔任，三人選出的得主為陳思攸執導的《核》\n\
  。\n\n評審認為，這部成長電影運用了出色的攝影機運動與剪輯手法，象徵性地反映出其國家的\n歷史與認同。片中年輕主角們的溫柔情誼，也讓這部作品以相當原創的方式呈現了身處壓\n\
  抑環境中的女性青春生活，並引發普世的迴響。\n\n第62屆金馬獎頒獎典禮暨星光大道即將於週末（22日）下午5點30分於台北流行音樂中心\n登場，頒獎典禮準時於晚間7點舉行。台灣觀眾可鎖定台視頻道同步收看直播，網路直播\n\
  則由MyVideo影音獨家播出，LINE TODAY共同轉播。海外除了星馬地區各有當地電視台直\n播外，其餘地區皆可透過金馬與台視YouTube同步觀賞。\n\n\
  責任編輯：蘇漾\n\n\n\n--\n\n                  \n\n\n\n--"
