title: '[好雷] 大濛'
content: '雷文防雷資訊頁




  雷文防雷資訊頁




  雷文防雷資訊頁






  原本沒有任何期待去看這部片

  只是想順便收個海報

  原本以為這種歷史片我大概會睡死


  結果出奇的好看

  可能是有主線任務(拿哥哥)

  然後年代感也有拍出來，沒什麼破綻


  很意外的學到許多廣東山東髒話


  我看到最後以為我不會哭的就要結束了，結果安排現代線劇情還是把我眼淚擠出來


  但是就劇情層面，我覺得現代線不拍直接結束做留白會更好



  最後警察局長在講出「砰」的時候

  我腦子想的是接著唱IRIS OUT.....



  --'
