url: https://www.ptt.cc/bbs/movie/M.1765941804.A.4A1.html
title: '[普雷] 大濛 善與惡的光譜'
content: '昨天看完了大濛，回去查一下資料


  這部是歷史下的虛構故事


  比較讓我出戲的是，阿月明明是從小到大說台語的人


  台語卻說的沒有很好，有點奇怪


  趙公道語言還算合理


  畢竟他是廣東來的，來台灣學不是很流暢的台語


  學髒話的確是最快的速度沒錯XD



  劇裡有些部分我想知道的更深一點


  例如哥哥是做什麼的，為什麼會有這麼貴的手錶（很好奇）


  劇中說約有500元價值（沒記錯的話可以吃喝半年至一年）


  是因為什麼事情而被通緝（劇裡他只是說因為想法不同帶過）


  兄妹感情我無法感受到很強烈，因為劇中相處時間不長

  （但別部作品短時間我就get到了）

  所以撈屍體的時候，我真的沒什麼感覺



  劇中我觀察到的視角，人不是非善即惡，而是一種光譜


  人心險惡，但還是帶來一絲善良


  趙公道一開始救阿月，出自單純的正義感


  但後來帶阿月去賣錶，才知道他們都是串通好的


  連趙公道也想拿抽成（還自稱公道XD）



  中間阿月被抓時，做筆錄那位警察還算有點人性


  可能體制下的關係，他只能擺態但選擇不動手


  隔天還有給阿月早餐吃



  阿月知道高金鐘通緝有獎金時，我有感覺到她在考慮要不要通報來換錢



  裡面最讓我驚艷的是那位撈屍體的人，演員叫林道禹


  劇中沒有名字，沒有什麼台詞，就有一種說不出的氣場


  很完美的詮釋陰陽擺渡人這位角色



  一開始還沒得獎前，看了預告就想看了


  看完後的確跟導演有種一樣的感觸


  在台灣這片土地，不管本省人外省人


  這些故事的確在台灣土地有發生過



  我覺得這部可以給立場不太偏頗的人看


  這個不是類似南京照相館那種煽動情緒刻意放大對立的片


  可以好好品嚐這位導演詮釋台灣曾經發生的故事



  如果看完想更了解導演的想法，可以去看報導者採訪導演的那篇文章：）


  -----

  Sent from JPTT on my Sony XQ-DQ72.


  --

  哈哈

  的確是不簡單，但就有點點可惜

  真假，那我漏看了

  合理

  我想起來了 哈

  我記得說這些錢可以過一年好像是舅舅說的（後來搬到她家的那位）

  回憶漸漸甦醒

  媽媽的哥哥還是弟弟算舅舅吧？

  啊啊 對 魯常 感謝提醒

  你這麼一說也好像是這樣

  感謝補充

  你突破盲點了

  原來如此'
