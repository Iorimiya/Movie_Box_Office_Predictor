  雷防雷防雷防雷防雷防雷防雷防雷防雷防雷防雷防雷防雷防雷



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  1. 過於妥協的故事情節


  我不知道也不去猜測原因，就我在電影中所看到這整個故事是充滿著「妥協」到，在格局

  這麼大、精緻考究的世界，開了許多可能都很有發展性的故事線，但每一個故事線都只搔

  了一下癢癢，甚至連最後六張犁公墓如果能夠用真實的新聞影片等，將真實內容結合進來

  ，可能會讓阿月的故事更有真實性。


  哥哥的線幾乎在甘蔗林就結束了，沒有說為什麼被抓，沒有說他追求爭取著什麼；趙公道

  集結了許多故事線，軍中故人被捕，特務頭子試探要他的反叛：「為國除害的事情，做不

  做」等都只有點到一些，沒有給出前因後果。


  雖然可以理解這是陳玉勳導演一貫的公路旅行風格，但難得能做到這麼深刻與格局的題目

  ，還是覺得十分可惜。



  2. 生硬的機械降神轉場


  趙公道為阿月煩惱沒錢時，就這麼剛好有這麼一個特務看到了趙公道，就這麼剛好醫師太

  太的房子就在旁邊，就這麼剛好這個特務想要殺自己老闆，就這麼剛好這個老闆也馬上就

  到…這麼多的剛好，甚至發生在可能沒炸幾條油條的時間，趙公道也這樣失手然後引導劇

  情到趙公道被桌、退場。特務要殺范春的原因好像想要影射范春故意抓走醫師，想要搶女

  搶房，但沒有前因後果就這樣一句話噴出來…實在過於降神了。


  我認為這一段生硬到會讓人出戲，讓人感受到這是為了推進劇情而安排的橋段。這一段我

  覺得也是浪費了陳以文的演技，最後到警局帶人走那段真是靠一個眼神就帶出整個恐懼情

  緒，但就這樣沒頭沒尾的。



  3. 「致那些年的雲與霧」


  雖然這些標題的呼應，但是並沒有在電影中說明雲與霧實際上在追求跟爭取的是什麼，即

  使觀眾可能能夠自己腦補猜測出來，但是這在電影中故事最重要的主線的延展變得推力不

  足，總不能真的只當作阿月媽媽說的「哥哥就是到台北讀書後學壞」了這樣理解吧。


  而雲跟霧的故事也過於「霧茫茫」到難以共情與理解，我中間一度以為雲與霧是在指「好

  像」也是地下黨的趙公道，甚至中間很期待趙公道這個角色是否會有翻轉，特別是在范春

  揭露他的營長、排長都被抓走之後。但最後沒有，故事的雲與霧在電影中很難找到對應的

  對象，反而讓 9m88 的那段念白讓人感到尷尬。


  4. 我覺得很棒的地方


  我覺得很棒的地方有兩處，阿月在警局被外省口音警察的皮帶打時，導演安排外省口音警

  察突然踹一腳然後不由分說的打過來，再安排會講台語的警察給予同情，這種「格差」的

  安排加上突然的驚嚇跟理解很震撼。


  另外一個是結局時，趙公道說的「沒被槍斃，關了25年」這一段很能讓人因為時間跨度而

  共情到。





  看完馬上出來寫心得還是覺得好可惜


  --'
