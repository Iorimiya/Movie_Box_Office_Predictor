url: https://www.ptt.cc/bbs/movie/M.1766374452.A.C67.html
title: '[討論] 大濛之人生解鎖'
content: '人生解鎖


  除了回家吃飯，不管我揪母親去哪裡、做甚麼，

  她都興致缺缺。


  這天，我編好謊言：打電話說有個活動，

  要帶長輩去，門票才會免費，

  節儉的母親不置可否。


  「活動地點」在忠孝新生站，即使捷運直達，

  我還是開車接送，避免夜長夢多。

  殊不知抵達後，

  母親對華山藝文特區的老建築、小商店都沒興趣。

  然而，距離開始還有一個多小時，

  我只得奉上各種話題，

  包含兩個月前不歡而散的父親家宴。

  也許，這段談天是她這天最大收獲。


  終於

  手持早買好的電影票：

  「帶母親進戲院看大濛」


  影癡如我，

  這輩子第一次和母親看電影。

  希望說台語、1950年代的台灣故事，

  可以讓她心生共鳴。


  母親看了三分之一，

  嚷著「可以了，要走了，想上廁所」，

  但阿月才剛找到姐姐，

  正噙著眼淚看彩蝶歌舞團表演。

  我帶母親如廁，再把她哄回戲院，

  改坐最後一排，避免干擾他人。


  母親習慣挑剔各事各物。

  批我蓄鬍太老，批我髮型難看，

  批我衣著不入她老人家法眼……

  然而，直到字幕升起，母親沒有再說什麼。

  我問電影如何，

  她只說「比較喜歡看歌唱節目啦」，

  沒說電影不好看，

  身為兒子，我知道「大濛已經過關了」。


  大濛也是人生唯一買票二刷的國片。

  然而早上工作滿檔，下午忙這波，

  累到電影後面睡著了。

  -----

  Sent from  on my Android


  --'
