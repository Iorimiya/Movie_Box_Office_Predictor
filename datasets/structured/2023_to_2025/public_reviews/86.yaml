url: https://www.ptt.cc/bbs/movie/M.1764861470.A.16A.html
title: '[普雷] 大濛'
content: "好的部分大家都分享很多了，下面就是挑剔：\n\n    整體來說劇情不錯，但是妹妹替哥哥收屍這段經歷，和兩個水\n\n滴的故事相關性有點勉強，說難聽點是硬套的。也就是說就算沒有\n\
  \n兩個水滴的故事，完全不影響整部電影的完整性。若要讓兩者產生\n\n呼應，那怎樣把水滴的故事說得好就很重要。令人失望的是，水滴\n\n故事的敘事方式太像現代給幼兒園至國小低年級年齡層的童話，而\n\
  \n且還是用普通話為母語寫作的童話。完全不像那個年代本土作品的\n\n用字遣詞與意境。編劇在這裡若肯揣摩仿效當時本土作家如賴和、\n\n楊逵、吳濁流、鍾理和作品的文體來寫作，或是改成用詩或者歌謠\n\
  \n如農村曲、望春風、月夜愁的體裁來譜寫水滴，應能讓觀眾感覺劇\n\n情與主題無痕契合，而不是如今天般曾敬驊和9m88在唸那兩段故事\n\n的表現像個現代小文青，讓人出戲，也導致開頭提到的問題。\n\
  \n    陳玉勳的熱帶魚真的是神作，但到了健忘村，給人感覺更像舞\n\n台劇而非電影，演員知道自己在演戲，觀眾也知道台前這些人在演\n\n戲，不管是演的還是看的都透出一股滿滿的尷尬。大濛好不容易有\n\
  \n了恢弘的格局，劇情和節奏都掌握得頗佳，卻在需要畫龍點睛的地\n\n方淺薄了，實屬可惜。\n\n\n\n\n--"
