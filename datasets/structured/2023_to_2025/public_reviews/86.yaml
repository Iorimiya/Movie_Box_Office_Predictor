url: https://www.ptt.cc/bbs/movie/M.1762443505.A.6EC.html
title: '[新聞] 大濛搶金11項 試映會哭成淚海'
content: "大濛搶金11項 試映會哭成淚海\n\n2025/11/06 05:30\n\n\n柯煒林（中）與方郁婷（右）今年憑《大濛》角逐金馬帝后。（華文創提供）\n\
  \n〔記者許世穎／台北報導〕台片《大濛》入圍金馬獎最佳劇情片、導演、男女主角等11項\n大獎，成為本屆入圍大贏家，昨首度在台舉辦大型試片，導演陳玉勳和監製葉如芬、監製\n\
  李烈黃金鐵三角一同出席，陳玉勳形容像高中生參加成果發表會，一度哽咽，現場觀眾看\n了電影也哭成一片淚海。\n\n香港男星柯煒林憑該片角逐本屆金馬影帝，自7月親曝罹患肺腺癌四期後，始終堅定抗癌\n\
  、積極面對病魔，他前天已飛抵台灣，準備參加今晚金馬影展開幕首映，甫下飛機便笑著\n說：「好想台灣啊！」直說能為《大濛》來台宣傳「意義非凡」，更直呼：「這是我非常\n\
  珍惜的作品，也是非常重要的一段旅程！」\n\n昨試片入場時片商特別贈送片中具有寓意的紙手錶，象徵時間能沖淡傷痛；還有以方郁婷\n飾演的「阿月」為原型的手帕，電影播畢後，全場淚流不止，手帕正好派上用場。\n\
  \n《大濛》將於11月21日至23日舉行感動口碑場，11月27日全台正式上映。\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛 \
  \       是 菩薩\n\n\n\n--"
