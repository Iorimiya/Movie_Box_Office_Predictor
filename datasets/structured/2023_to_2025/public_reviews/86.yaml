url: https://www.ptt.cc/bbs/movie/M.1766330034.A.A21.html
title: '[好雷] 大濛：往事如煙，卻也並不如煙'
content: "回憶似雲似霧，朦朦朧朧。偶爾，會有一道陽光射進來暫時驅趕雲霧。\n而那一道陽光，叫做趙公道。\n\n大濛，不是只有記憶的濛，也不是只有雨滴故事的濛。\n\
  整場電影，都陷沒在白色恐怖令人不敢大口呼吸、資訊模糊的背景裡，\n我們只能用平民視角去試著解開戰爭迷霧，再加上歷史距離的濛，\n多少窺探那個時代一二。\n--\n\
  大濛的世界觀，在有一定年紀的台灣人眼中建立得算是完整，\n但對於不了解的人來說，應該會有很多問號。\n\n哥哥去台北變壞了到底是什麼意思？\n為什麼有比起現在更多的方言跟口音交錯？\n\
  極樂殯儀館是什麼？ （我在欣欣秀泰看的，就在隔壁）\n為什麼那個特務頭子這麼囂張？\n怎麼這麼多被角色提到的往生者？\n\n我猜想，這就是劇組想要營造的大濛。\n\
  離開電影院，你會有興趣自己去解開這些問題，\n然後，開始理解角色的淚眼矇矓何來。\n--\n撇除亂入群毆的義賊與突然想幹掉老闆的特務這兩個機械降神，\n以及第一版童話故事的過分直接，\n\
  大濛其實就是個白色恐怖時期的日常縮影。\n很多的理所當然，都是大霧的一份子，讓生活蒙著一層模糊與窒息。\n\n那個誰被抓走了，就跟聽到那個誰最近摔倒了一樣平常。\n\
  那個誰被槍斃了，啊知道就好不要多講。\n那個誰沒工作了，因為他的老闆不想惹麻煩，這也沒辦法。\n那個誰被騙錢了，誰叫他太想救自己親人。\n那個誰突然失蹤，啊可能是被拐賣了吧。\n\
  那個誰去殯儀館，啊應該就是去認領的啦。\n\n當年的治安、階級、民生乃至於人心，都跟當今社會差距太大。\n歷史課本不足以讓我們認識這個世界，其實這部電影也沒有，\n\
  它只能片段地、隱晦地、窺探似地呈現其中一角，\n用十幾個人的對話讓我們拼湊個大概，到足以推動劇情的程度就好。\n\n那個年代的人們，也只能知道這麼多，或是假裝自己只知道這麼多。\n\
  他們，不得不活在大濛裡，也可能是自願活在大濛裡。\n--\n在這個叫警察為大人，然後警察對特務怕得要死的世界裡，\n阿月的故事應該上演過無數次，但很少有人跟她一樣幸運吧。\n\
  \n沒有被波及牽連、真正見到了解嚴、過上自己想要的生活，\n很多過去也漸漸淡忘了，很久很久才會有一次，有個訊號將她拉回過去，\n那個一切被迫朦朧，某些細節卻異常清晰的過去。\n\
  \n她一定記得徬徨無助唸著年份的自己。\n她一定記得哥哥寫過的故事內容。\n她一定記得跑上台北的頭三天的每個行程。\n她一定記得還有個人下落不明。\n只是宇宙很大、生活更大，50年來，淡忘了、朦朧了。\n\
  \n直到那一聲趙公道，這些細節瞬間撥雲見日，她回到了50年前。\n故人依舊，卻不如舊。\n往事如煙，卻也並不如煙。\n\n真的，很少有人跟她一樣幸運吧。\n--\n\
  我們現在的世界很幸福，這個幸福在70年前並不存在。\n它建築在許多人的犧牲奉獻，與汗水血淚上。\n\n我們的幸福在於擺脫了那抹霧，但我們也該回頭看看以前的那抹霧是什麼。\n\
  然後提醒自己，大濛隨時會回來，自由隨時會再度消失。\n\n明天開始，就去查查資料，吹散這道歷史迷霧吧。\n讓自己的意識不再朦朧，讓自己成為另一道後人可以追隨的風景。\n\
  我想，這應該是這部電影最想告訴我們的吧。\n\n--\n    ￣￣￣╲    ﹀  \n ▕       ▕ ｜｜   \n‧ ‧▕  ‧ ‧ ▍ \n ███▕\
  \  ███  \n‧ / ‧  ‧ ‧   \n        \n\n--"
