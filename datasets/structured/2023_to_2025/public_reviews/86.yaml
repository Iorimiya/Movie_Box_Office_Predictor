title: '[新聞] 本屆金馬大贏家「大濛」上映！口碑場觀'
content: '本屆金馬大贏家「大濛」上映！口碑場觀眾淚推　原聲帶同步上架



  2025-11-27 14:38


  聯合報 記者廖福生／即時報導


  榮獲本屆金馬獎最佳劇情片等5項大獎史詩年度巨作「大濛」，今（27）日正式在全台上

  映！該片口碑場賣座又叫好，被觀眾形容為「一生必看的國片！」，散場時幾乎人人哭紅

  著眼離席。而電影原聲帶也於今日同步上架各大平台，由金獎配樂大師盧律銘全盤操刀，

  也有參與主題曲「大濛的暗眠」作詞的導演陳玉勳更是分享了電影中的小故事。



  盧律銘分享，「大濛」配樂一開始交出的版本被陳玉勳導演直言「沒有風味與靈魂」，讓

  他只得「砍掉重練」。在導演半激將、半鼓勵的推動下，他決定回到角色本身創作，從方

  郁婷飾演的阿月出發，以她離家沿途所見的風景寫出第一首 demo，讓整張原聲帶彷彿成

  了阿月的旅程日記，有雲、有霧、有雨，也有撥雲見日的片刻。



  其中，電影主題曲「大濛的暗眠」更是他近年最深刻的創作，不僅歷經多次改動、趕在最

  後關頭才完成錄製，更邀請 9m88 演唱與吉他大師黃中岳編曲。他形容整個過程如同陳玉

  勳導演說的：「有股神秘力量推著大家前進，每個環節都剛好扣上。」並說：「這部電影

  、這首歌都是獻給那些在霧中前行的人。」他也特別感謝 9m88，笑稱：「這是一首最不

  像 9m88 的歌，唱的人是片中的每一個人。」



  關於電影配樂，導演陳玉勳分享，剪接時他一度苦惱不知該配什麼音樂，直到某個深夜靈

  感閃現，一段既熟悉又陌生的老歌旋律竄入腦海，正是60年代的「月光小曲」（莎韻之鐘

  ），他立刻記下旋律。



  另一首是導演很喜歡盧律銘配樂裡的一首曲子，他幽默地對盧律銘說：「這首我們把它弄

  成一首歌，可能會紅喔，你老婆肚子的小兒子快出生了，如果這首紅了，你兩個兒子所有

  學費都有了吧！」



  此外他也親自嘗試撰寫台語歌詞，笑言說：「阿銘師，我們什麼都沒有，只有才華，就自

  己寫吧！」最終完成的「大濛的暗眠」，連同原聲帶皆送往英國倫敦傳奇錄音室Abbey

  Road Studios進行鬼斧神工的母帶製成，完美呈現電影情感與氛圍。



  電影「大濛」將於本周同步推出觀影特典，凡於上映戲院購買「大濛」任一場次電影票乙

  張，即可獲贈「大濛」正式款A3海報乙張，數量有限，贈完為止。電影「大濛」也將於本

  週六在台南南紡威秀影城舉辦拍照會、台南新光影城舉辦簽名會。




  --








  --'
