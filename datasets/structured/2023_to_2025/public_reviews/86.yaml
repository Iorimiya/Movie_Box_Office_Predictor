url: https://www.ptt.cc/bbs/movie/M.1764356357.A.0C8.html
title: '[好雷]《大濛》無以關乎政治，只談情義'
content: '之前在板上發過一篇無雷心得（）

  那這篇就會牽涉到個人的劇情分析了，有糖果有鞭子，請斟酌觀看。




  ～～～～～～～海報防雷～～～～～～～











  ～～～～～～～海報防雷～～～～～～～




  如果《總鋪師》不算的話，這算是陳玉勳第一次完整的寫了一個公路電影的長片劇本，而

  構成公路電影的最大前提，就是為什麼故事要繼續走下去，就如前篇所說：劇本還有再打

  磨的空間，主要是因為如果阿月一到台北就去找阿霞，那這一切都不會發生，而且我覺得

  姐姐出現得太早了，需要一個理由中途退場，導致這一段顯得多餘，但也可以理解這是在

  商業上所做的取捨，畢竟很多人也是因為9m88參演才知道這部作品，戲份不可以太單薄。


  但這段並不是一無是處，甚至是整片拍最好的部份 ── 阿月看著舞台上光鮮亮麗的阿霞，

  包裡還有她無法奔喪的信，那個情感是複雜的：為什麼我一個人在這裡看著沒見過的姐姐

  表演？為什麼她不回家？她好漂亮過得很好，而我和弟弟卻只能在嘉義受苦？她真的過得

  好嗎？她會幫我去找哥哥嗎？哥哥在哪裡？我好餓好累好想念哥哥……排山倒海的情緒湧

  上，一個台詞都沒有，眼淚卻什麼都說了。


  另一個沒必要的地方是老照片後阿月長大的現代線，我知道陳玉勳是希望給趙公道一個善

  終，並頭尾呼應錶的部份，但很一廂情願。

  （私心亂想阿月前段遇到的不是樂隊，而是遇到趙公道正準備被遊街槍決，笑著對著阿月

  大喊「走囉！」，留點遺憾情感才能更昇華。）


  就可能是製作時間限制吧，如果劇本再磨一點，狗血再收斂一點，音樂有主題一點，歌曲

  再有味道一點，剪接再順一點，會更接近完美，像是為什麼鳥要飛到日本人身上並Focus

  他？這一鏡其實交給陳以文就好；還有刺殺陳以文那段太突然，都沒有鋪陳，會以為是要

  陷害趙公道，諸如此類包含上面的結構問題，真的很可惜，但說實話，就檯面上的臺灣導

  演來說，應該也沒有人能拍得比他更好。如果《消失的情人節》完成度是85分，那本片只

  有70分，甚至是他所寫的長片中劇本倒數的，只能說愛之深責之切，對陳玉勳有更高的期

  待。


  不過以上都是吹毛求疵啦，完成度還是算高的，帶有一點魔幻寫實，又操弄他最擅長的喜

  劇包裝悲劇的部份，表面上很多人不覺得是喜劇，但其實那些善良的倔強（沒錢就扶著車

  子走、錢就跟流水一樣），角色本質都沒有變，尤其是趙公道真的很棒，不論演出還是設

  定，希望柯煒林可以長命百歲繼續發光發熱QQ。


  此外試片後就有人在吹本片是這個世紀的《悲情城市》，拜託差多了吧！就鏡頭語言來說

  完全不一樣，《悲情城市》是用遠長鏡頭去看「小人物」的故事，而本片是用特寫去刻劃

  這些善良可愛的「大人物」，真要說的話還比較接近王童的電影。


  最後，雖然PTT現在沒什麼活人，但還是感慨如果挑戲都跟著些族群的眼光走，那這輩子

  的眼界就這樣而已，終將要眼見為憑，才有底氣說話，謝謝大家。


  P.S. 這幕劇照沒有放到正片超可惜，方郁婷的表情超有生命力



  --




  --

  推你，而且認屍戲和現代線反映滿兩極

  有些人哭爆，但我自己是覺得有點尷尬…


  不會到失望，但更多的是惋惜吧'
