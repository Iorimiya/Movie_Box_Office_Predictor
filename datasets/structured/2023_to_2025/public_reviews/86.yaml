title: '[討論] 大濛應該直接預約金馬獎最佳劇情長片吧'
content: '女孩既然不(敢)報名

  那麼大濛根本就是預約金馬獎BP了



  這預告我看到都站起來了

  真的是坐不住拉

  光是預告都看到快流淚了

  今年最期待的國片就是這部啦!!!


  柯煒林應該也是預約影帝了

  去年破浪男女的UBERDICK我就很喜歡他了，演得很棒


  方郁婷預約影后


  最佳導演/原創劇本給我們老勳


  BP給台灣目前最好的兩位製作人葉如芬、李烈



  大家一定要進戲院支持!!!


  --'
