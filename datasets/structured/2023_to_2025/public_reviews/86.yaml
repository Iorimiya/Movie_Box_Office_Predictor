url: https://www.ptt.cc/bbs/movie/M.1766373093.A.4BF.html
title: '[好雷] 大濛 這不是戒嚴 什麼才是戒嚴？'
content: '這不是戒嚴

  什麼才是戒嚴？




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  看完大濛

  難得的坐在那裡看完工作人員列表

  不只是對於大濛的支持

  還有我久久無法平復的心情


  原本以為受苦受難的只有台灣人

  沒有想到連幫忙打仗的老兵也被迫害

  過的可能比窮苦的台灣人還辛苦

  國民黨過河拆橋的行徑真的令人作嘔


  歷史總是被人遺忘

  然後重蹈覆轍


  但在台灣

  有人會不斷的提醒你他還沒成為歷史

  卻有人已經遺忘

  或者是害怕想起來？


  願台灣未來順遂


  最後我只想說

  導演 你把顧面桶拍的太溫柔了啦！



  -----

  Sent from MeowPtt on my iPhone



  --'
