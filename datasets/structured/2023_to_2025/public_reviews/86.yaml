title: '[好雷] 大濛二刷 聖桑的動物狂歡節〈天鵝〉'
content: '看這部之前，因為很喜歡大提琴演奏


  就找了好多大提琴手來聽


  偶然聽到這首〈天鵝〉，大提琴鋪墊得像霧氣般滲透身體


  非常喜歡


  第一次看的時候，很驚艷這首歌被用在那個地方


  醫師娘看著的黑膠正是這首歌


  整部片的配樂都相當令人喜愛


  仿佛都循著霧氣流動的方向前進



  仍舊是霧茫茫，隱約的天光

  -----

  Sent from JPTT on my iPhone


  --'
