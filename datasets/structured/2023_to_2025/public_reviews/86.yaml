url: https://www.ptt.cc/bbs/movie/M.1766367408.A.818.html
title: '[普雷] 大濛 屬於臺灣的公路電影'
content: '看到這個時代竟然還會有電影被禁止討論，


  太神奇了，


  只好來這邊接力分享觀後感。



  畢竟哪吒到最近都還有新聞呢～





  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  老實說，大濛並不如大家說的好哭，


  在進場前，我原本期待的是像


  計程車司機、1987、正義辯護人、搖擺男孩、首爾之春等，


  讓我在電影院大爆哭，


  但是這部我哭不太出來（我還帶了一包衛生紙），


  所以我會稱它為臺灣的公路電影，


  你會跟著女主角


  出發-發現問題-遇到事件-事件結束-再出發，


  不像計程車那樣漸進式的煽情，


  多得是在裡面加了許多臺灣人的幽默感


  （阿月的每一次臺灣國語都讓我笑出來）


  陳導已經把那個時代最悲傷的事情之一，


  用最平淡的方式講故事給我們看了，


  最後也來個不是很悲傷的結局，


  讓習慣喜劇的我們知道，


  在這個時代，壞人不一定會受到懲罰，


  但是我們保持正向還是能活下去，找到幸福。


  講到這，


  如果想要看臺灣歷史又想哭，可以去看「牽阮的手」，


  當年看的時候，還哭到旁邊來安慰我。



  最後講講普雷的原因，


  我覺得是個好電影，


  但是情感比較深層，


  而且一直覺得舞台劇感很重，


  所以稍嫌可惜，


  會推薦給所有朋友，


  但還不到民主電影的神片，


  其實特定族群是不用特別攻擊這部片的。








  --'
