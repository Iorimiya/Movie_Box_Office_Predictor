url: https://www.ptt.cc/bbs/movie/M.1765973751.A.4E8.html
title: '[ 好雷] 大濛-每個人心中都有一個盼望'
content: '雷文防雷資訊頁

  多虧版友NuCat一直留言辱罵

  （這邊要謝謝版友一直洗辱罵留言）

  所以我決定去看這部電影

  看這部時我還帶了一位政治非常冷感的朋友一起去

  應該是他完全不關心政治

  結果看到最後他落淚了

  我還有點被嚇到

  先說我最喜歡這部電影的是還原當時的場景

  我朋友還問我是不是全部都AI

  因為美術場景真的還原得很好

  裡面我還蠻喜歡方郁婷的演技

  她把當時嘉義的鄉下人得單純有演出來

  而我最喜歡還是演趙公道的演員柯煒林

  他把趙公道的角色給演活好可愛！！

  之前本版有批評9m88我其實覺得也沒那麽不好

  她台語的口音我覺得練得很不錯

  以她是歌手這樣演

  我覺得很可以了

  至少沒有讓我覺得尷尬（但每個人感受不同）

  裡面讓我有點震撼是在醫學院認屍那邊

  那個場景（我真的覺得魯常可以拍一部續集殺人魔的！！）

  當阿月開始唸年代時我就開始落淚了

  阿霞對阿月說的故事我也是在後面才知道是什麼意思

  當然是我以我自己的認知去理解

  在那個時代

  高知識份子跟一般人形成了對比

  育雲對阿月說的未來

  是所盼望的未來

  在還沒到心中所理想時

  就是一片霧濛濛的大濛

  不是所有都可以成功

  但你除了勇敢的活下去去爭取

  才有可以看見大濛散開的世界

  在那個年代

  育雲屬於高知識份子

  他對阿月所描述他心中所嚮往的社會是如何

  等於帶領著阿月有一個盼望期望

  只是他無法看見

  但阿月走了下去走過當時那一段時光了

  我覺得大濛裡面每位演員我都很喜歡

  整部不會讓人覺得有演員讓你格格不入

  看完我還問我朋友你有感受到政治嗎？

  他說沒有

  他說就是一個小人物在那個時代所經歷的故事

  沒有大起大落

  畢竟一般老百姓生活要能有大起大落像英雄片那樣也很難

  就是阿月在那個時候去台北認領哥哥屍體的故事

  那段時光也在阿月心中無法忘懷一直在心裡惦記著

  最後謝謝NuCat的宣傳

  國片有這樣的水準

  在我自己標準很可以

  當然故事說得沒有很完整有很多的疑問

  這也是缺點

  但我覺得這是一部你可以錢去看的電影


  Ps:有好幾個地方，我真的被趙公道說話給笑到，真的很可愛QQ











  ----

  Sent from on my Motorola edge 50 fusion


  --

  真的是謝謝他欸

  他真的是把這角色給完全演活欸！！

  我真的每篇都看到他留言，他還把說他的留言都罵了一頓

  是是是

  我還蠻認同你說的，就是一部小故事，但說真的，這部也是靠這些演員演技把這部演活

  我是覺得就是一部國片這樣拍很不錯的電影，但沒有大起大落，就是小人物的故事

  我覺得在照片那邊就可以結束了QQ後面我覺得阿霞讓我有點感動，童養媳的她最後那樣子。

  崩潰成那樣我都懷疑是不是反串了

  謝謝NuCat推薦

  美術場景真的讓我覺得很棒，這點真的要誇獎

  那邊我沒有哭欸，我反而是認屍那邊我有哭，廖添丁那邊我覺得好好笑

  我看完這部電影，我好想要有那樣的哥哥喔，感覺就是一位妹控

  那邊我真的覺得演很好欸！！

  好啦QQ

  那邊我覺得好悲哀啊，窮人家跟有錢人家的對比，最後靠有錢人家的樂隊來幫自己哥哥送最

  後一程，那邊我真的好心疼啊！

  我自己認為照片那邊就是最好的結尾了，但每個人感受不同

  哈哈哈哈哈，我有注意到，照公道牙齒好像比較對，我覺得缺點最大是進人家房間那邊

  沒有欸

  我真的因為這部片注意到他欸！！！

  謝謝NuCat幫我推文，我收下你的推推了

  我也是因為他才去看，謝謝他

  我覺得拿獎很值得欸，好好看，裡面演員演技真的很棒

  謝謝你的推推

  已看完無法拒看QQ

  握手！！我也覺得

  謝謝NuCat一直幫我留言增加我文章熱度討論

  加油噓！！

  他講那句我都會不由自主嘴角往上欸，就是覺得可愛

  請幫我繼續留言衝人氣QQ

  希望可以一直這樣賣下去QQ

  這週有阿凡達QQ希望這部還是可以繼續細水長流賣下去

  這部不是大起大落的電影也不是很政治的電影，但我真的很喜歡這部，就是依照國片這樣，

  我會支持，希望你看完可以分享QQ不過缺點也是很明顯啦

  謝謝推推

  睡起來，又看到NuCat留言，午安啊！

  我真的就是感謝內

  我朋友是政治完全冷感，他當時要跟我一起去看大濛時，還問我這部是不是政治味很重，他

  對政治沒有參與，不太想看政治片，看完之後，流了幾滴男兒淚，我問他你有感受到很政治

  嗎？他說完全沒有，就是那個白色恐怖時代小人物的故事，他覺得很好看'
