url: https://www.ptt.cc/bbs/movie/M.1765518476.A.5D7.html
title: '[新聞]《大濛》票房破3000萬 超狂卡司被讚神'
content: '《大濛》票房破3000萬…超狂卡司被讚神選角　潘麗麗現身逼哭全場


  記者黃庠棻／台北報導


  電影《大濛》近來聲勢持續攀升，昨（9）日票房已突破3千萬，繼續朝4千萬邁進，社群

  討論熱度更是居高不下。除了主角群深刻動人的表演獲得觀眾一致盛讚外，星光熠熠的配

  角陣容也憑藉精準細膩的演出，成為話題焦點。



  ▲《大濛》全台票房突破3000萬，演員們被讚神選角。（圖／華文創提供）


  影后潘麗麗、億萬票房女星宋芸樺、金馬新人胡智強、金馬男配陳竹昇、金鐘男配王傳一

  等人皆在片中驚喜現身，導演陳玉勳也在個人社群寫下選角過程，坦言「我對選角一向很

  挑剔，電影裡出現的角色一定仔細挑選，幾經思考，真的要謝謝我們的casting（選角）

  能夠忍受我的機車、龜毛，每個角色都是選了很久，找了好幾輪。」



  ▲《大濛》全台票房突破3000萬，演員們被讚神選角。（圖／華文創提供）


  《大濛》故事前後橫跨50多年，年邁的阿月找來影后潘麗麗演出。潘麗麗為了將「老阿月

  」詮釋到位，事先看了好幾段「年輕阿月」方郁婷的演出，直呼「她真的很厲害，很怕我

  演不好。」更壓力大到喊話陳玉勳導演「以後找我不要拍哭戲，想演三八的喜劇。」



  ▲《大濛》全台票房突破3000萬，演員們被讚神選角。（圖／華文創提供）


  宋芸樺則飾演阿月的女兒「念雲」，與潘麗麗首次合作就組母女檔，戲外活潑性格更是如

  出一轍，兩人的好演技逼哭觀眾，直呼「最後和潘麗麗一起哭死。」而片中宋芸樺回春扮

  演大學生，高馬尾加上旁分造型，監製葉如芬看到後忍不住誇她青春如昔，讓經常飾演學

  生的她開心甩髮自豪「我還是馬尾女神！」逗得現場笑聲不止。



  ▲《大濛》全台票房突破3000萬，演員們被讚神選角。（圖／華文創提供）


  而金馬男配陳竹昇則向來是陳玉勳導演電影的固定班底，總能在關鍵時刻為角色注入靈魂

  、替電影畫龍點睛，這回在電影《大濛》中飾演照顧阿月的叔叔，將一家之主的兩難詮釋

  得相當到位；金馬新人胡智強片中一改過往形象，梳起油頭「使壞」上陣，飾演從事非法

  勾當的阿林仔，陰狠神態令人不寒而慄。



  ▲《大濛》全台票房突破3000萬，演員們被讚神選角。（圖／華文創提供）


  演技派男星王傳一則演出已有家室的處長，和9m88飾演的阿霞發展出一段情感糾葛。其中

  在社群上因陰鬱氣質被封為「引渡人」的演員林道禹，更是憑藉全無對白的演技震懾全場

  ，靠著面無表情加上重複的肢體動作，成功營造出如同置身異空間的神祕氛圍，令觀眾直

  呼「謝謝你（林道禹）無聲的演出，那段表演非常有份量。」



  ▲《大濛》全台票房突破3000萬，演員們被讚神選角。（圖／華文創提供）


  導演陳玉勳也分享「這角色是整部電影找最久的演員。」並透露這個角色的原名是「牛頭

  」，希望能讓觀眾快速聯想到牛頭馬面，雖然最終沒能完成這項設定，但林道禹「陰陽擺

  渡人」的氛圍也讓陳玉勳導演相當滿意，更大力稱讚「遇到這種好演員，導演不用多說什

  麼，他自己會把自己準備好。」而飾演醫學院管理員的李雪，除了一出場就讓觀眾眼睛為

  之一亮外，陳玉勳看到她的表演也直呼「我都被她圈粉了。」



  ▲《大濛》全台票房突破3000萬，演員們被讚神選角。（圖／華文創提供）


  《大濛》製作過程精益求精，從美術、造型到配樂，每個環節都力求完美，而選角更是受

  到觀眾高度讚賞，社群上不少網友直呼「這部每個演員都好會選！」、「選角未免太強大

  了」，導演陳玉勳也感動表示「我真的蠻幸運的，這麼多演員都不計較戲份願意來演出。

  」



  ▲《大濛》全台票房突破3000萬，演員們被讚神選角。（圖／華文創提供）


  除了主角群的情感演繹深入人心，配角群的精準演出同樣令人印象深刻，堪稱年度必看國

  民電影。由華文創股份有限公司製作，鉅資打造的電影《大濛》，奪下本屆金馬獎最佳劇

  情片等5項大獎，全台盛大熱映中。



  ▲《大濛》全台票房突破3000萬，演員們被讚神選角。（圖／華文創提供）



  新聞網址：



  --'
