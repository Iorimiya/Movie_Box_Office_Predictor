title: '[大好雷] 大濛，不說教的好片（內有不雷推薦）'
content: '先說我投柯文哲

  每個人都有立場

  我是冥禁洞請的網軍我就沒有小雞雞




  我先講點不雷然後這部電影做的很好的部分


  1.搭景：

  我知道有專家出來靠北過說沒有很還原史實，什麼國防醫學院的人物服裝不對


  但是說真的就身為一個普通觀眾

  這部電影的搭景是真的會讓你進入一個以前沒有人想去認真塑造的年代


  民國40年的台灣


  這時空沒有ubi刺客教條台灣傳

  也沒有好萊塢的《不可能的任務：回到白色恐怖》


  這在一般影視娛樂上是一個缺乏大預算製作的真空年代。


  所以就算其細節不算完全還原


  但你也可以像完全不懂法國歷史，但玩《刺客教條：大革命》時，肆意穿梭在聖母院大教堂

  一般


  在《大濛》裡跟著角色從嘉義的鄉下，

  北上到台北


  路上的行人似乎永遠有著薄薄的汗膜在身上

  看了很燥很熱

  沒有柏油路，都是塵土飛揚的髒亂

  每個人就在這種環境坐在街頭擺攤

  那時候最頂的交通工具就只有腳踏車

  外省口音和台語此起比落，講話就現在聽起來非常粗鄙


  這電影確實把那種草根味展露無遺



  2.不說教：


  這電影應該算...喜劇？

  沒有真的很沉悶的歷史傷痛環節

  其實多數時候你都會看著角色的互動然後笑出來

  「啊這個人怎麼講話這麼靠北」

  「這人是真的憨」


  但其實笑完你會自己去帶入角色去想


  「幹不對，其實他還是蠻慘的」


  然後自己同情角色


  不會有個人在旁邊跟你說

  「哦，這裡他受到迫害，很可憐，要可憐他喔！」


  沒有，本片沒有給我這樣的感覺


  然後外省本省人都有刻畫

  沒有偏袒哪一方


  都是小人物活在一個非常時期的掙扎

  人不是一刀兩斷，非黑即白


  這在男主角身上寫得非常好



  3. 演員的演技


  裡面的演員演技全員在線

  連是歌手的9m88演出也是自然的讓我大吃一驚


  但是最亮眼的是柯煒林

  他真的把那股憨勁演的淋漓盡至

  但也不會過多

  在該角色痛苦的時候會收斂

  一悲一喜他都完全把角色的情緒帶給螢幕前的你


  而且角色的人物曲線


  十。分。完。整


  他不是甚麼壞人，但他也不是什麼好人

  他就是一個活在那年代掙扎的小人物而已

  跟你我一樣



  __________________________________________

  好，底下大雷












  還是想講回柯煒林演的‘’趙公道‘’

  他是一個來回在善惡拉扯的角色


  第一次遇見阿月，他知道對面是賣小女生的垃圾

  但他那時候還是懶得多管閒事，直接載她到目的地

  本來這件事情就算了


  但他抽煙的時候看到啊月的背包

  又讓她想起那可憐從嘉義上來領屍體的小女孩

  覺得她真的很可憐

  回去救她


  然後他一開始看到啊月遺留的包裹裡的錶，他大可以直接不管拿去賣


  但他沒有，他還是回去找啊月


  後面救阿月出來後，貪念又起來

  把阿月騙去賣賤錶收點回扣

  但後面又反悔，同情阿月很可憐

  回去店裡想把錶贖回


  之後被特務盤查，道出他曾經洩露同伴地點的事情

  他懊悔到在房前柱子上哭得場景


  看了真的是....啊....


  然後後面殺人無膽，還有現代線的劇情


  都一再的跟你講：「對這角色就跟你我一樣，時有歹念，時有善良的執著」


  趙公道絕對是近幾年國片我最喜歡的角色


  趙公道的完美人物曲線是完全吊打同樣是寫白色恐怖的《餘燼》


  《餘燼》缺乏一個真的願意讓觀眾去同情

  共感的角色


  《餘燼》充滿很多酷炫符號和鏡頭

  但就是沒人會真的因為裡面的角色


  從角色出發去多想關於他的處境感受，乃至當下白色恐怖的歷史。


  而《大濛》的各種角色都給你一個入口

  去讓你願意去深入共感當時的角色


  而你願不願意就此去了解白色恐怖的更多？


  那是你觀眾自己的選擇。













  --'
