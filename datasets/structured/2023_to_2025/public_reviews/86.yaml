title: '[公告] "大濛"相關新聞 禁發'
content: '大濛 11/27上映

  現在 12/21

  宣傳已經足夠


  相關新聞下面常常都是政治推文吵架

  罵藍罵綠罵白都有



  相聞禁發，發的砍除，水桶三天，不累加


  過去新聞不會砍除

  心得文能發(但會看內容決定是否空洞洗版引戰)




  --


  嗯 我查錯了

  抱歉


  你檢舉了沒?


  我不知道阿希是在講什麼

  但我本身是希望政治電影全禁啦

  去政黑八卦討論


  不過看大家覺得該開放



  你檢舉了沒?



  我看沒人想檢舉啊




  3. 政治規範，本板禁止純政治文，但在討論電影的前提下可討論政治:


  電影本身非討論台灣政治的

  發文扯到台灣政治的水桶，會累加


  基本上現在的政治人物糾團的新聞都能算啦


  那好啊

  開放

  但只要內文有現在政治人物

  我就水桶一個月'
