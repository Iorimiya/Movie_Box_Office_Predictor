url: https://www.ptt.cc/bbs/movie/M.1765620138.A.A18.html
title: '[新聞] 《大濛》庶民角度描繪白恐 細緻考據時代'
content: "《大濛》庶民角度描繪白恐　細緻考據時代成就作品格局\n\n\n劇組搭設出繁榮的台北榮町商圈，並透過臨演與各種道具呈現1950年代的生活感。（華文\n\
  創提供）\n\n文｜項貽斐\n攝影｜蕭志傑\n\n《大濛》是編導陳玉勳繼《消失的情人節》後，再度與美術指導王誌成合作的電影，訴說\n1950年代農村少女因領贖遭槍斃哥哥的屍體與三輪車伕萍水相逢的故事，在昏昧的白色恐\n\
  怖氣氛下，透出底層庶民的生命亮光。\n\n全片經由考據田調勾勒時代樣貌，並藉搭景、改造、特效等方式重現昔日嘉義鄉下到台北\n市街的生活，技術與內容的搭配也成就作品的格局。\n\
  \n「上一部電影拍完，我不知道接著要做什麼，每天上網東看西看。可能因年紀大了，對阿\n嬤、媽媽的年代有興趣，就去找那時的東西。好像有一種神祕力量，拉著我不斷閱讀白色\n\
  恐怖時期的資料，受到震撼與觸動。」在動念拍白色恐怖題材時，陳玉勳發現，「以前的\n作品多半強調受難者，但我覺得活下來的家屬更可憐。離世的人不知道後面發生的事、也\n\
  不知道帶給親戚朋友什麼後果，所以我想從家屬的角度去理解。」\n\n\n 柯煒林（左）飾演的三輪車伕與方郁婷（右）飾演的農村女孩萍水相逢，展開一段旅程\n。（華文創提供）\n\
  \n陳玉勳以長輩的類似經歷，構思出一個貧窮女孩北上為哥哥收屍的故事。寫著寫著，覺得\n只有一條主線有些單薄，幾經思考，誕生電影裡繪本的「水滴」寓言童話。「我想到那些\n\
  受難者，有些那麼年輕、有那麼多夢想，卻失去青春生命，像一場霧一樣不見了。」\n\n編劇過程中，陳玉勳因故事年代遇到各種困難。「像是當時社會經濟狀況，一個軍人或一\n\
  般家庭的收入是多少？還有場景的設定，例如：女主角阿月住在嘉義哪裡？如何來到台北\n？在台北的行走動線？那時有沒有中山北路、南京西路這些路名？都要做功課，並且請教\n\
  專家學者。」\n\n語言也是一大難題，雖然陳玉勳從小就會說台語，但當時人們講話的樣子、語言的使用，\n得細心揣摩、查資料。\n\n\n\n編導陳玉勳（左）與美術指導王誌成（右）密切合作，共同打造《大濛》裡的時代氛圍。\n\
  \n劇本寫到一半，陳玉勳覺得很心虛，「因為故事裡的場景都沒了，要怎麼寫？怎麼拍？後\n來乾脆不管，就當寫來抒發情緒。」\n\n寫完後，陳玉勳把劇本拿給監製葉如芬、李烈及美術指導王誌成等人看，沒想到所有人看\n\
  完都哭了，希望拍成電影，王誌成也著手研究相關場景影像，協助調查，劇本又繼續修改\n。\n\n「我查資料能力很差，但有一群很棒的人幫忙。」陳玉勳笑說：「除了知道當時台北車站\n\
  長什麼樣子，劇本裡沒有一個景是我能想像出來的，但頭哥（王誌成）滿厲害，問什麼，\n他馬上找來。」\n\n\n美術指導王誌成手繪片中極樂殯儀館門口陳設景觀。（王誌成提供）\n\
  \n王誌成坦言：「起初懵懵懂懂，但會先把狀態抓出來，將蒐集來的文字與圖片資料消化，\n再畫出氛圍圖。」例如以前的「極樂殯儀館」（約現今北市南京東路與新生北路交叉口東\n\
  北角）旁邊是一片雜居的違章建築，他過濾整理圖文檔案後，想像角色在裡面轉來轉去，\n再轉到極樂殯儀館。畫圖的過程中，王誌成同時思考場景該如何調整、執行，後續可以落\n\
  實完成。\n\n\n從台南鹽水「岸內影視基地」空拍照，可見搭建的各種房舍與市街樣貌。（華文創提供）\n\n由於全片帶公路電影色彩，一路上場景不斷變化，劇組盡可能找實景，已經沒有的才搭景\n\
  或使用特效合成，拆成多處拍攝。片中台北繁榮的榮町商圈、金山街道、市場、低矮的房\n舍等是在台南鹽水「岸內影視基地」搭景，「但片場不大，我們得想辦法一景多用。」王\n\
  誌成解釋：「比如賊仔市跟菜市場其實連在一起，不過稍微變一下陳設方法，就成為兩個\n不同的場景。」\n\n片中的極樂殯儀館與國防醫學院兩個重要場景，也讓劇組傷透腦筋，最後分別找到嘉義市\n\
  昭和十八與成大台文系館做為兩處的主景，再搭配其他場景組合而成。還有醫生娘的洋樓\n則是台南赤崁樓後的陳一鶴故居，但因外圍環境早已現代化，還得靠後期特效進行修改。\n\
  \n\n美術組搭景陳設以及造型組提供的復古裝扮讓昔日街道與市場鮮活登場。（華文創提供）\n\n「時代劇的美術設計，要先認識劇中的歷史、理解故事內涵。」多年來，王誌成也養成「\n\
  美術田調」的習慣，會主動查詢、挖掘更多資料，對片中年代有具體的想像。\n\n設計場景時，王誌成還會考量人物背景，甚至想到其他部門。「像方郁婷飾演的阿月是農\n\
  家女，原本場景經理找一個比較高檔的農舍，我覺得不太對，因為她家窮到吃番薯簽，房\n子應該更簡陋。最後找到類似農具間的老屋，再加工去掉或遮住現代的痕跡。又比如柯煒\n\
  林飾演的趙公道，淪落到住在低矮破舊的房子裡，不可能有電燈，只能用煤油燈，但煤油\n燈不夠亮，就要提醒攝影與燈光設法補光。」\n\n\n導演陳玉勳（前排左二起）與柯煒林、方郁婷在拍片現場討論。（華文創提供）\n\
  \n\n因《大濛》四度與監製李烈、葉如芬合作的陳玉勳表示：「她們分工清楚，葉如芬掌控進\n度、預算；烈姐因是演員出身，會在演員、服裝造型上提供建議。至於錢的事情，她們完\n\
  全不讓我操心。」葉如芬指出，該片總製作預算1.2億元，整體美術預算5707萬元，占47.\n5％，其中岸內影視基地搭景製作費為4000萬元。在王誌成帶領三十多人的美術團隊執行\n\
  下，小至日常用具、大到台北城街區，打造生動的時代舞台。\n\n\n9m88（中）是片中彩蝶歌舞團的台柱，展現歌舞才華。（華文創提供）\n\n另在選角上，陳玉勳全憑直覺。「方郁婷的『阿月』籌備初期就決定是她，因為年紀合適\n\
  ，也看過她的電影，覺得她很聰明。退伍外省大兵『趙公道』一角希望是台灣觀眾不熟的\n外地演員，看了《濁水漂流》後，認為柯煒林可以。9m88是因為覺得她漂亮又會唱歌，就\n\
  找她演歌舞團台柱、阿月的姐姐『阿霞』。」特別的是，方郁婷與9m88都是從零開始接受\n3個多月的台語訓練，還因片中設定，腔調也有南北差異。\n\n《大濛》在金馬獎贏得最佳劇情長片、原著劇本、美術設計、造型設計與觀眾票選獎等肯\n\
  定。陳玉勳說：「我一直覺得做這部片好像命中註定，剛好我快60歲才寫這個劇本、剛好\n方郁婷長到十幾歲、剛好讓我看到柯煒林、許多場景也剛好可以，一切都是機緣巧合，自\n\
  然形成這樣非常台灣的電影，完成一件我想做的事情。」\n\n新聞網址：\n\n\n--"
