url: https://www.ptt.cc/bbs/movie/M.1767680030.A.F92.html
title: '[好雷] 大濛'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  一月一日沒事做，就去威秀看了電影。因為是主打真實事件改編，所以版上才會很多議題爭論吧。不過在沒有被爆任何雷的前提下進場去看電影，其實從頭到尾我印象最深的始終是主要演員們的表現，雖然阿霞的設定讓我有點不能入戲。還有刺殺那一段。

  但是到最後電影結束的時候，我滿腦子想的都是關於時代變遷的無奈，還有爸媽小時候原來是在這種環境長大的，等等等的感想。

  如果我們是在這種相對封閉的環境下長大，是不是也可以變得跟小女孩一樣的單純好騙??

  如果自己到了五六十歲的時候，會不會變得跟現在眼裡的長輩一樣，然後也被年輕一輩的嫌棄。

  更不用說未來世界的變遷只會加劇，那些科技產品我都不敢想我到了七十歲還會使用。


  總之，沒有什麼政治的口水。反正用不同時代背景的觀點來互相詮釋本來就充滿爭議。

  但是整部片散發出來的情懷跟時代感讓我覺得頗是新奇，畢竟現在社會太亂了 ，哈


  --'
