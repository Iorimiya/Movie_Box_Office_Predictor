url: https://www.ptt.cc/bbs/movie/M.1765848818.A.936.html
title: '[新聞]《大濛》逼出林柏宏的眼淚！讚製作精緻'
content: '《大濛》逼出林柏宏的眼淚！讚製作精緻演員好　票房逆勢成長25%



  ▲《大濛》（如圖）傳出好口碑，上週末票房逆勢成長25%，還讓林柏宏在社群網站上發

  文，大讚製作精緻、演員很好，自己看得熱淚盈眶。（圖／華文創提供）


  記者蘇詠智／綜合報導-2025-12-15 18:36:26


  今年金馬獎最佳劇情片《大濛》，上映後口碑爆棚，上周末創下千萬票房，跟前一周相比

  逆勢成長25%，週六（13日）單日票房更創下上映以來新高，全台正式突破 4600萬大關。

  林柏宏也在社群分享觀影感想，稱自己看的時候一直是熱淚盈眶，也稱讚製作精緻、演員

  很好，日本藝術家奈良美智更稱這部片會成為經典。



  ▲林柏宏曾是今年金馬獎的頒獎嘉賓，發文讚賞獲得最佳劇情片的《大濛》。（圖／NOWN

  EWS攝影中心）




  《大濛》讓林柏宏看完忍不住在社群網站上寫道：「那年代的故事像一陣霧，模糊到不敢

  直視，但我們可以跟著阿月一起在霧裡尋找光。好精緻的製作、好棒的演員，看的時候一

  直是熱淚盈眶。」奈良美智也趁來台舉辦展覽期間，特地欣賞這部片，表示深受感動，盛

  讚：「很可能會成為名作。」導演陳玉勳也在臉書感性回應：「奈良美智真的來台灣看『

  大濛』了，謝謝奈良美智老師！」


  演員們也持續親自上陣為電影衝刺票房，9m88和胡智強昨（14）日在台北一連跑了6場映

  前、映後，第1、2場大滿座，其他場滿座率也高達9成，讓兩位影人相當興奮與感動，不

  斷謝謝影迷外，也盼大家繼續塞滿戲院。不少影迷表示已2刷以上，就連9m88上週六於新

  竹工作完也在當地二刷，她透露影廳也是全滿狀態，更笑說因自己戴著口罩，還和朋友站

  在海報前催票房，大聲說：「聽說這部片很好看！要趕快去看！」



  ▲在《大濛》有演出的9m88（最前排左一）與胡智強（最前排左二）前進戲院感謝影迷支

  持。（圖／華文創提供）




  奈良美智不但在社群平台 X 上轉發《大濛》電影預告，還穿著台灣限定「藍白拖」造訪

  《大濛》拍攝地之一蒜頭糖廠蔗埕文化園區朝聖，也引發眾多影迷跟進打卡《大濛》拍攝

  足跡。


  此外，《大濛》在視覺與造型上的高度考究同樣成為熱議焦點，本屆金馬獎最佳造型設計

  得主許力文近日分享幕後細節，透露劇組在有限預算下，仍努力從史料、老照片與田野調

  查中還原50年代的服裝邏輯，包含孩童穿著的「麵粉袋褲」、不同身分階層的衣著差異，

  以及當年嚴格的髮禁規定。從小朋友的平頭與西瓜皮，到榮町街景中攤販與行人的細緻區

  分，皆是反覆溝通的成果，《大濛》全台上映中。





  --

  為什麼要抹黑別人是網軍？

  單純喜歡電影、愛分享電影怎麼了嗎？'
