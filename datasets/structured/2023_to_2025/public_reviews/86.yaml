url: https://www.ptt.cc/bbs/movie/M.1764394707.A.E98.html
title: '[新聞] 徐宗懋痛批電影《大濛》 靠白色恐怖犧牲'
content: '新聞網址：



  徐宗懋痛批電影《大濛》 靠白色恐怖犧牲者吃香喝辣


  2025/11/27 中時新聞網 丁世傑


  電影《大濛》入圍本屆金馬獎11項，最終抱回4項獎，成為大贏家，其中一項更是大獎「

  最佳劇情片」。對此，文史工作者徐宗懋26日在臉書撰寫萬言書，痛批消費白色恐怖犧牲

  者以實現個人名利，對於白色恐怖的歷史其實沒有任何的敬意，只是在利用他們滿足個人

  名利的慾望，這也是他最痛恨的地方！


  徐宗懋表示，民進黨執政以後，利用納稅人的錢做文化補貼，無論在圖書和影視作品上，

  創作的作品特點就是用正面的眼光描述日據時代，把它形容成生活富裕的中產階級社會，

  不是在讀書，就是在彈鋼琴，穿著光鮮，彬彬有禮。到了白色恐怖年代，則會出現一批大

  陸口音的土匪惡霸官員，以及一批莫名其妙被政治迫害的無辜者，可以說是白色恐怖樣板

  戲最基本的套路。


  徐宗懋指出，利用政治犯故事就可以拿到幾千萬的拍片補助金，真正的白色恐怖政治受難

  者本人或者後代，都經歷生活困難的時候，影視圈對他們真實的生活並不關心。他們只是

  抱著可憐他們的心情，消費他們的人生故事，作為自己取得巨額補助金的方法。然後穿著

  華麗地走上金馬獎的紅毯，得到獎項後說一些漂亮的感謝詞。


  徐宗懋想問，所有國家的歷史劇或政治劇，不管你同意他的內容與否，不管是否紀實或是

  純粹的戲劇誇張，都會有濃厚的國家主體情感，就像《阿甘正傳》、《現代啟示錄》、《

  越戰獵鹿人》、都有濃厚的美國主體情感。問題是《大濛》從頭到尾，不知道這是在講哪

  個國家的事？歷史、政治與社會情境，完全看不見，天曉得這是什麼國家？民進黨當然是

  在這種虛無中，可以隱瞞歷史真相，製造另外一種錯誤的認知。


  徐宗懋強調，這不過是要拿到補助金拍電影，但對於白色恐怖的歷史其實沒有任何的敬意

  ，只是在消費和利用他們，滿足個人名利的慾望。這也是他最痛恨的地方！


  --'
