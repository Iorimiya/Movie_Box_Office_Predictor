title: '[ 無雷] 大濛、說故事的手法'
content: '雷文防雷資訊頁


  上禮拜六看了大濛試映場次

  回到家到現在還是意猶未盡

  這部應該是本年最佳華語片了

  小故事的劇情還有角色都很棒

  能把小故事說的如此精彩也是一個本事


  不管是每個角色們都有其自然的演技

  請來了很多知名有經驗的演員客串

  讓整部電影不會因為配角們而出戲

  這個時代劇還原場景時雖說有些CG有待加強

  但還是瑕不掩瑜的呈現出當時50年代的樣貌

  反而襯托這部戲因為時代的巨輪之下

  老百姓平時生活樣貌，不管好的、不好的面相

  都如實重現


  每個人都是灰色的背景

  不可能有非黑即白的樣貌去闡述一個閩南人、客家人、或者外省人的故事

  希望未來多一點這類影片出現

  相對可以教育後代們

  看一個人的觀點不能只有直覺思考

  還要帶入他人在這種的情境如何思考的面相


  看完以後很想帶爸媽去看這部電影

  畢盡幾乎全台語口述

  對於南部長輩們應該可以接受才對

  畢竟經歷過白色恐怖的耆老們目前都還在

  希望看完能夠聽他們分享在地的小故事

  讓後代能夠知道那時發生什麼事

  增加人與土地黏著度


  最後

  私心劉冠廷戲份多一點XDDD



  --'
