title: '[新聞] 逆勢上揚！《大濛》全台票房破4600萬'
content: '逆勢上揚！《大濛》全台票房破4600萬 再揭造型內幕


  記者許世穎／台北報導


  台片《大濛》上週末（12月12至14日）票房表現逆勢上揚，不僅突破千萬關卡，較前一週

  成長25%，週六單日票房更寫下上映以來新高，全台累積票房正式衝破4600萬元。電影口

  碑持續發酵，除了情感層層堆疊打動人心，對年代質感的細膩還原，也成為觀眾熱烈討論

  的亮點。


  本屆金馬獎最佳造型設計得主許力文近日分享幕後祕辛，透露劇組為了讓角色真正「活」

  在 1950年代，從髮型、膚色到服裝與群眾造型都下足苦功。她指出，方郁婷飾演的阿月

  ，隨著從嘉義到台北、生活境遇的轉變，穿著與髮型也逐步調整，讓角色狀態自然流動。


  歌手9m88在片中飾演歌舞團成員，造型則結合50年代歌舞文化與角色身分，從妝髮到服裝

  層次層層堆疊；曾敬驊為符合躲藏於甘蔗田中的角色設定，拍攝過程中刻意保留「逐漸變

  髒」的不同階段狀態，讓角色更貼近現實。


  最讓造型團隊「傷透腦筋」的，莫過於柯煒林飾演的「趙公道」。許力文笑說，連導演陳

  玉勳在前期討論時都忍不住問：「柯煒林就是個型男，到底要怎麼把他用醜？」電影設定

  趙公道為退伍軍人、靠踩三輪車維生，又不太打理自己，因此團隊設定他「自己理髮」，

  特別使用傳統手動推子，刻意剪出坑坑巴巴、長了又剃的怪平頭，再搭配日曬與粗糙妝感

  ，讓原本的型男形象徹底消失。


  除了主演，年代片中至關重要的群眾造型同樣是一大工程。許力文表示，劇組在有限預算

  下，仍從史料、老照片與田野調查中反覆考證，還原50年代的穿衣邏輯，包括孩童常見的

  「麵粉袋褲」、不同階層的服裝差異，以及當年嚴格的髮禁規定。從小朋友的平頭、西瓜

  皮，到榮町街景中攤販與行人的細緻區分，都是反覆溝通、沙盤推演後的成果，只為在大

  銀幕上呈現出可信而立體的時代風景。《大濛》全台上映中。




  --'
