url: https://www.ptt.cc/bbs/movie/M.1765529806.A.94C.html
title: 'Re: [新聞] 徐宗懋痛批電影《大濛》 靠白色恐怖犧牲'
content: '的確是這樣，但《大濛》並非如此。



  電影不是要為政治負責，好的電影是要為歷史負責。



  《大濛》已經盡力還原那時台灣的城鄉風景，人文樣貌。

  而且政治立場已近中立，儘量沒有美化也沒有醜化。


  徐宗懋真正該痛批的，應該是即將上映的《那張照片裡的我們》。

  我在電影院看到預告就想痛罵，因為我就是中壢人，真正中壢事件不是那樣子。

  我父親就是當年中壢國小的老師，也是中壢國小投開票所的人員，完全親歷其境。

  中壢事件就是校長雞婆，熱心幫忙指導一位不會投票的老人，結果被旁人說是作票。

  然後一群流氓跑來鬧事，最後愈鬧愈大，直到把國小對面的警察局給燒了。

  整個事件，中壢國小投開票所還沒開票，就已經被鬧到無法開票，是要怎麼作票？


  現在關於中壢事件是作票引起的說法，根本就是胡說八道。

  真正引起中壢事件的原因，是許信良為求勝選而不斷煽動才導致其支持者過激行為。


  而且就預告片看，氛圍也不對，那些群眾演員不像中壢人，當年中壢是出流氓的地方

  台灣南北兩大逞凶鬥狠的流氓產地，南雲林，北中壢，所以為什麼中壢人敢燒警察局。

  就在二十世紀七十年代，中壢車站前還曾發生幫派上百人持武士刀當街械鬥砍殺。

  片中演員太嫩太文，根本不像當年中壢鄉民敢衝敢撞的樣子。

  當年中壢民眾的大約樣子，可以看看這部




  --

  《推背圖諰：中國國運與人類命運之預言憂患》全書PDF檔 免費流通


  詮釋《推背圖》，反省過去，展望未來，自二十一世紀浩劫後重建人類文明，

  至於二十七世紀人工生命挑戰人類，終於二十九世紀全球政權交付人工智能。


  --


  文史工作者未必現場經歷，我爸是親身在現場目睹。



  我爸何必美化自己，這事在當年他就說了，我是小時候就知道。


  當年許信良與歐憲瑜的縣長競選，讓許煽動得衝突火爆，本就民心騷動。

  當年許就像現今川普的人氣，桃園分裂成極端支持許與極端討厭許。

  我那時小六，班上同學就有因選舉而對立。


  許不斷宣傳說國民黨會作票，要他的群眾監票，從早到晚都有許的監票部隊。

  而中壢國小投票所在中壢事件的騷亂下，根本沒有開票，是要怎麼發覺作票？

  整個中壢事件的開始，是校長看到老人不會投票而去教導，然後被說是作票。

  從上午到下午，作票謠言愈傳愈廣，一堆群眾跑到中壢國小鬧事，又引來一堆看熱鬧的。

  接著開始打砸，先燒路上的車，再攻擊對街的警局，再燒掉警局。


  中壢事件當時，消息全被封鎖，新聞完全沒有報導，外界一般只知桃園選舉開票未完。

  事件當晚，催淚瓦斯屢屢飄到我家巷道附近，大家都被嗆到。

  我騎單車到縱貫路上，看見路邊成排軍卡，上面載滿全副武裝的士兵，嚇得轉頭回家。

  整個事件一直鬧到次日凌晨才散場，暴民鬧了整晚累到解散各自回家。


  下週一到校上課，還有同學說他去湊熱鬧，也拿石頭去丟警局玻璃，很好玩。



  是這樣，中壢國小投票所根本沒有作票，中壢事件就是一件謠言引發的衝突。

  而這謠言會廣為人信，是因為國民黨有作票前科及許信良在選前不斷宣傳國民黨會作票。

  還有中壢當年流氓與警察本就對立，一些流氓逮到鬧事機會可以修理警察就開打了。

  許多流氓並不關心黨派，重點是有機會可以打警察出氣，就想藉機行事。

  事件當天，有些警察是逃到中壢國小換便服溜走。


  暴民燒車，是將路邊停的一些私人車輛也推翻燒掉，只能說車主倒楣，停錯時機。


  中壢事件就是一場謠言引發的暴亂，也是當年中壢民風剽悍才會發生。



  你乾脆說我在唬爛好了。

  現實是不只我爸作為投開票所人員在場，當時還有很多人在場。

  那場選舉，因為競選過程衝突對立，投票當天根本就是風聲鶴唳，雙方一直都在監票。

  現場作票根本不可能，整個事件就是一件投票糾紛引發的謠言導致。'
