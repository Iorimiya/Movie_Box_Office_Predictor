title: '[新聞]《大濛》票房破4600萬！奈良美智淚推：盼'
content: '《大濛》全台票房持續攀升，截至目前全台票房已突破新台幣4600萬元，


  與前一周相比逆勢成長25%，周六單日票房更創下上映以來新高。


  驚喜的是，日本藝術家奈良美智也來台觀影，他表示劇中某片


  段連結到自身經驗，感動到落淚，盼《大濛》能在日本上映。


  為衝刺票房，演員們持續上陣與觀眾面對面交流，其中9m88與胡智強14日在


  台北一連跑了6場映前、映後活動，第1、2場大滿座，其餘場次滿座率也高達9成，讓兩人

  既興奮又感動。


  9m88分享，日前於新竹工作完也在當地「二刷」，透露影廳是全滿狀態，


  更笑說因自己戴著口罩，還和朋友站在海報前催票房，


  大聲說：「聽說這部片很好看！要趕快去看！」


  演員林柏宏也在社群分享觀影感想表示，「那年代的故事像一陣霧，


  模糊到不敢直視，但我們可以跟著阿月一起在霧裡尋找光。


  好精緻的製作、好棒的演員，看的時候一直是熱淚盈眶。」


  日本藝術家奈良美智日前來台舉辦展覽期間，特地走進戲院觀賞，


  並於社群平台分享觀影心得，直言深受感動。他寫道，「我終於看了


  《大濛》。主角的演技真的非常出色，而且最後播放的歌曲也非常好


  聽。」他特別提到片中葬禮隊伍演奏的〈莎韻之鐘〉（????鐘），


  與自身生命經驗產生強烈重疊，讓他忍不住落淚。










  --'
