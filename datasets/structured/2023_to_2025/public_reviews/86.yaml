title: '[新聞] 金馬導演陳玉勳《大濛》殺青 方郁婷 9m8'
content: '新聞網址：





  金馬導演陳玉勳繼2020年《消失的情人節》後再度編導第6部劇情長片《大濛》，與知名

  監製李烈及葉如芬第四度聯手。《大濛》為史詩劇作，今（24）日曝光首波劇照。本片以

  民國40年代台灣為背景，講述女主角阿月接獲哥哥被槍斃死訊，毅然決然從嘉義北上，尋

  覓姊姊阿霞一起前往認屍，因緣際會結識三輪車伕趙公道，發展出一段超越血緣的羈絆。


  陳玉勳表示這些年來，他看過不少白色恐怖時期的文章，真實事件撼動了他，但相關電影

  並不多，他自問：「是大家不熟悉還是不願再提起？」陳玉勳表示，他一直想拍一部關於

  受難者家屬的故事，他認為在殘酷無情的年代，仍然看得到人性的光輝，而愛是讓人們在

  苦難中走下去的力量。片名《大濛》即來自「大霧」的台語發音，雲與霧在片中具有重要

  的象徵意義，「不管是雲是霧，我們不該忘記那一片風景，如此我們才能成為别人美麗的

  風景。」


  首波劇照中，在《美國女孩》中表現出色的方郁婷，以17歲「降齡」演出14歲女主角，一

  頭短髮加上黝黑膚色，草根味十足。曾以《濁水漂流》角逐金馬男配角的性格男星柯煒林

  ，化身在底層求生存的三輪車伕；爵士女伶9m88飾演歌舞團的台柱阿霞，展現復古髮型和

  穿搭。


  《大濛》製作成本達9千萬台幣，電影自2023年12月初開拍，取景地遍及台南、嘉義，並

  在鹽水「岸內影視基地」搭建早期的台灣農村建築、金山街道、市場、福馬林池等重要場

  景，重現台北榮町商圈。預計2025年在台上映。


  —————————————————————

