title: '[請益] 問《大濛》中，關於趙公道的問題(有雷)'
content: '殺人未遂罪：不論被告犯罪情節是否輕微，亦或犯後態度良好，殺人未遂刑期皆為10年以上

  有期徒刑，除非因未遂結果減輕或法院另外給予被告減刑的機會。


  我查了網路是這樣寫的


  他會被關二十五年，是因為殺人未遂，還是因為窩藏匪諜(無論實際上有沒有)？


  直到最後都沒提到這件事


  畢竟他的確是殺人未遂


  也闖進他人住家


  這部分來看是個罪犯是沒錯的


  --'
