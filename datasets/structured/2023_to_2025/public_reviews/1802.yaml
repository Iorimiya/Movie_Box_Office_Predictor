url: https://www.ptt.cc/bbs/movie/M.1679199282.A.A05.html
title: '[討論] 鈴芽之旅的缺點是觀眾觀影素養不足?'
content: "鈴芽之旅我個人覺得有他不錯的地方，好比對於災後受難者心靈修復這塊，\n但也有自己觀影時第一時間感覺不通順的地方。\n\n不過看到近期的討論，似乎這些問題都要歸咎於觀影者素質不足，無法領會新海誠的苦心。\n\
  \n好比\n\n\n\n如網友推文:\n「一堆看過你的名字就自以為很懂日本動畫的進場以為要看愛情片，台灣人素質\n  不就這樣意外什麼。」\n「因為動漫很多受眾是宅男\
  \ 看到暈帥哥現實社會鐵拳」\n\n不確定其他觀眾想法，自身有去看大概動畫的製作想法，311災後的心靈修復是本篇主軸\n我是可以確定。\n\n但不只一位心得指出，就算觀影者想忽略戀愛元素，但劇中不斷暗示、明示，觀影者\n\
  很難忽略。\n\n網友推文\n「老實說就是我從來都沒有以要看戀愛的心情來看這部\n  但這部電影就是一直塞給我這些東西啊\n  硬要做戀愛又做的很爛 這才是我覺得難看的地方」\n\
  \n「劇情裡面一開始就安排女主覺得男主很帥而拋下學校回頭找他\n  好幾幕女主對男主臉紅，甚至想親男主（椅子）\n  最後女主再進去常世前也是跟環阿姨說\n 「去我喜歡的人那裡」\n\
  \ 導演用這些大量的鏡頭跟台詞在告訴觀眾，女主喜歡男主，\n 然後你反而怪觀眾戀愛腦解讀失焦也是蠻有趣的。」\n\n\n\n\n主要分岐點在於那句:「沒有草太先生的世界....才可怕!」\n\
  \n\n事後很多分析指出，這句話要從文本的前後，還有要從故事中埋藏的草灰蛇線\n最後揭露鈴芽身世的伏筆往回推，才能感受到這句新海誠要傳達真摯的情感。\n\n所以這些第一時間沒感受到新海誠用意，甚至出戲的可能是如網友說\n\
  \n「有沒有可能是不到分析程度的，\n純粹一堆人接收資訊的能力在速食社會反而弱化很多了」\n\n「這種程度的人比較適合看拍給幼兒的作品\n最好不要有帶反轉跟須更新認知的伏筆\n\
  否則他們就會覺得自己看的是爛電影，是導演不會講故事\n明顯就是速食短片養壞了現時部分人的胃口跟觀賞能力」\n\n\n\n\n這部電影在觀眾中應該第一次看就能明白新海誠想傳達的情感。\n\
  如果有些錯誤的觀影體驗那可能是\n\n如網友推文\n「為什麼一定要覺得是愛情 才讓你覺得合理?\n根本就看了太多黑粉的評論被人影響   真是笑死」\n\n\n\
  總之看完鈴芽之旅如果觀影體驗不好是否很可能觀眾沒什麼觀影素養，可能要先去\n台藝大上個電影賞析之類。\n\n第一次覺得看個商業電影，原來電影不好看是取決觀眾觀影素養得提升。\n\
  \n--\n我自己是無法給這部到好雷的\n所以看了這麼多評論，才想說是不是自己素養不足\n是在認真檢討自己的電影素養缺乏\n看完很多心得，感覺有必要\n請問台藝大有專攻新海誠賞析的課程嗎\n\
  很遺憾看來這部似乎要這樣\n一刷如果你感到不對勁，沒關係回來後靜下心來，先看看三四刷的心得分析。\n他們會完整講解，鈴芽在劇中每個動作、每句話背後的心理活動和劇情之前給的鋪陳。\n\
  接下來再看新海誠為這部電影出的小說，最後如果可以連訪談、場刊都看過一遍。\n\n這樣子去二刷觀影者就會發現。\n \n\n鈴芽之旅，一部完美無敵的電影\n是看過一些熱情的心得，覺得似乎是自己的不足，所以不能感受這部電影\n\
  就這部分才和大家討論看看"
