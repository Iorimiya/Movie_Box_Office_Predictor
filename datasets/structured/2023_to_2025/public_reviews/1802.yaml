url: https://www.ptt.cc/bbs/movie/M.1678010642.A.21D.html
title: '[ 普 雷] 鈴芽之旅- 經不起推敲的劇情'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~










  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  新海誠的最新作品，感覺得出劇情從你的名字開始已經越來越市場化，至少都會讓災難的

  劇情有個良好正向的結局。


  本作不僅如此，在敘事上面也開始更向吉卜力靠攏。本次不但加了吉祥物，還有女主角的

  神秘冒險與成長，然後還一如吉卜力所有作品一般的省略了男女主角的感情鋪成直接一見

  鐘情。可能考量吉卜力公式就是動畫電影的賣座法則，所以本作許多地方都直接照抄公式

  了。


  但是卻有許多不合理的地方讓人無法代入劇情，最終變成一個完成度極高，但形狀怪異的

  動畫作品：


  1. 就算男主再帥，也是一下就變成了椅子。到底是怎樣的戀物癖才可以對一張椅子一見

  鐘情？


  2. 撿了一隻流浪貓說要養他，後來又嫌麻煩的把他拋棄丟回原地。貓咪根本才是最大受

  害者。一切的災難都從女高中生自身的不負責任開始。擅自認養流浪貓，擅自拋棄，而且

  還不隨手關門。


  3. 然後在貓和椅子中間選了椅子！？


  4. 突然出現的左大臣。不知從何而來也不知道為何而來。感覺只是作者想畫帥氣的怪獸

  大戰所以登場。


  5. 作畫和場景細節一如既往美得無法挑剔。不考慮劇情的話光是作畫就可以讓人無條件

  融入動畫裡了。


  6. 學會吉卜力的招式使用經典人氣老歌來販賣情懷，甚至還直接使用了同樣的歌曲。


  7. 如果失業沒工作然後跟妹子自我介紹時說自己職業是關門師，不知道有沒有妹子會一

  見鐘情。如果不巧是肥宅的話可能直接被報警了。


  再補充一些：

  先不論為什麼幼時的女主可以穿過門，也不說為什麼現在的女主可以見到過去的自己。主

  角最後的成長完全沒有解釋也沒有鋪成，究竟她是跟自己和解了？還是放下過去？亦或是

  釋懷母親的離去？完全沒有說明，反正劇情就是說她經過旅程後突然成長了然後硬餵給觀

  眾要觀眾吞下去。



  結論：怪獸大戰好帥，女高中生好棒。


  --


  女角跟椅子相處的時間比和男主原型相處的時間多十倍以上吧。實際上見到男主本人只有

  兩面吧？我完全無法理解機乎90%的時間都是跟椅子相處，還可以義無反顧喜歡上的心理

  狀態。

  還真沒想到這麼破洞百出的劇情竟然還真有這麼多人護航，看來女高中生真的很香。哈哈'
