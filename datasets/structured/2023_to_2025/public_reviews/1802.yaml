url: https://www.ptt.cc/bbs/movie/M.1678100318.A.643.html
title: '[討論] 鈴芽之旅 鈴芽喊出那句話的情感(有雷)'
content: '看很多評論都說這部要把男女之間的情感切開來看，才能領悟到新海誠要講述對於311震災

  後災後心靈重建的那種感覺。


  這部戲很多橋段如鈴芽不斷的臉紅、千果對男朋友概念的調侃、和環阿姨的互動，

  及最後一個橋段



  所以觀影第一時間當下

  看到鈴芽對爺爺喊




  很難不去想到男女之間的情愫，不過看完網路上的討論，原來這句話新海誠要注入的情感

  是



  所以鈴芽劇中表現出來看輕自己的生命(因為災難後倖存者的自我懷疑，為什麼是自己活下

  來)、還有拔出要石造成草太先生變成要石的愧咎)

  這些東西組合的愧咎而成的責任感，才是鈴芽所蘊含的情感。



  可惜第一時間我無法領悟，不過看網路討論上也蠻多人認為那句喊話是蘊含男女間情愫。


  純好奇調查，電影院第一時間鈴芽喊出那句時，大家的想法是


  1、對草太先生的好感和男女情愫

  2、對草太先生的責任及愧咎



  --'
