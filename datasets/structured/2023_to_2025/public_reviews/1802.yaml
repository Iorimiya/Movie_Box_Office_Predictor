url: https://www.ptt.cc/bbs/movie/M.1680793851.A.210.html
title: '[新聞] 鈴芽之旅登中國最賣座日本電影 導演感謝中國影迷'
content: '新聞網址：


  鈴芽之旅登中國最賣座日本電影 導演感謝中國影迷


  （中央社記者吳柏緯上海6日電）


  日本動畫電影「鈴芽之旅」在中國傳捷報，成為中國影史上最賣座的日本電影，迄今票房

  已突破人民幣6.5億元（約新台幣29億元）。導演新海誠為此數度發文，感謝中國影迷支

  持。


  「鈴芽之旅」是新海誠「天災三部曲」的收官之作，以311日本大地震為靈感，描述生活

  在九州的17歲少女鈴芽與四處旅行的神秘青年草太，為了阻止在日本各地可能發生的大地

  震而踏上旅行。


  「鈴芽之旅」去年11月日本首映，今年3月初陸續在多國上映。中國大陸則於3月24日正式

  上映，新海誠親赴北京為作品宣傳，引起不小的關注。


  在中國大陸上映14天，「鈴芽之旅」受到許多影迷喜愛，票房傳出大捷。


  「貓眼專業版」即時票房統計顯示，截至6日晚間10時，「鈴芽之旅」在中國大陸累積票

  房已超過人民幣6.5億元（約新台幣29億元，下同），成為中國影史最賣座的日本電影，

  光是在清明節當天的票房就超過4100萬元。


  中國票房告捷，新海誠難掩興奮之情，過去兩週數度在個人推特發文分享好消息並感謝中

  國影迷支持。


  3月27日，「鈴芽之旅」在中國上映第3天，新海誠在推特發布一張寫有「謝謝你中國」字

  樣以及簽名的圖片，表示在中國的觀影人數突破1000萬人次，票房達到3.4億元，對此感

  到驚喜並且謝謝所有到戲院觀賞的影迷；在4月1日，中國票房突破5億時，新海誠再度發

  文致謝。


  4月4日，「鈴芽之旅」累積票房5.77億元，正式超越「你的名字」的5.75億元，創下日本

  電影在中國的最高票房紀錄，新海誠在推特發文表示，「由衷地向中國人民致謝，謝謝你

  們這麼喜歡外國的電影」。


  新海誠致謝文的下方，吸引許多中國影迷留言，除了向他回饋觀影感想，也有不少人分享

  電影票根，並感謝新海誠創作了這部作品。


  根據公開資訊，目前在中國大陸上映的日本電影累積票房前10名，新海誠的「天災三部曲

  」均榜上有名，「鈴芽之旅」、「你的名字」佔據前兩名，2019年的「天氣之子」則以

  2.8億元排名第五。


  （編輯：楊昇儒）


  --'
