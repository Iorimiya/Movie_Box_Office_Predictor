url: https://www.ptt.cc/bbs/movie/M.1678277096.A.C41.html
title: '[好雷] 鈴芽之旅 心得分享'
content: '第一次入門新海誠電影是天氣，你的名字之後才補


  很可惜那時候你名已經被暴雷，這次只知道跟311有關


  （順帶一提我是喜歡天氣的那派xdd）


  今天終於看完鈴芽趕快來分享


  最後希望大家可以分享一下自己從哪邊開始爆哭


  以下有雷



















  鈴芽劇情嚴謹程度結構我覺得跟天氣差不多，都是中間一大部分都在講述天變主軸，天氣


  -晴女＋下雨，鈴芽-關門師＋地震，你名-巫女＋隕石，但你名有用線這個元素貫穿整部劇


  情，天氣跟鈴芽則讓我感覺就是個日常，跟後面轉折處沒啥關聯。



  先講雷點大概有兩個



  首先前中期一直在找大臣，找到大臣卻又一直讓他跑掉＋關門的迴圈，讓我覺得有點煩躁


  ，到東京超大蚯蚓那段，大臣說要草太去當祭品才有比較有轉折說貓在盤算這個，但也就


  這樣，不論是草太要掛掉的自白還是鈴芽要插草太的情感戲，我自己都沒啥感覺，如果能


  多增加一些草太因為當關門師放棄人生的主觀描述或畫面或許會好一點，男女主角互動也


  應該多一點，感覺沒啥交流都是女生單方面付出。跟爺爺對話那段也應該是個重點，但個


  人濾鏡只覺得就是個迷妹很喜歡草太，不能沒有他的世界。



  第二點就是大臣，這部分真的是完全看不懂他在幹嘛，大致理解是他被鈴芽救出來所以想


  當她的貓，所以他找了一個辦法就是把草太當祭品就可以解決關門問題，後來發現鈴芽寧


  願自己去當祭品也不願意草太去當，大臣還因此被討厭所以最後為了讓鈴芽順心自己回去


  ，但中間那段貓咪從一個自私鬼突然洗白真的讓我wtf，出戲到一個不行。而且很容易猜


  到結局就是大臣回去當祭品，卻也沒啥感覺，就覺得也只能這樣啊，要不然大家死光光逆？


  另外阿姨黑化那邊看的時候覺得幹要是這樣演也太糞了吧，好險結果是被黑貓影響，但阿


  姨跟屌男哭訴的時候，讓我覺得有點突兀，感覺很零碎不完整。




  主要雷點就這兩個，現在來講喜歡的點




  先從哭爆點講起，第一是回到故鄉翻日記發現3/11全部被塗黑，看到直接哭爛，其實我對


  3/11大地震沒有很了解，對9/21的印象也只知道就是一個很大的地震，但看到的當下就了


  解新海誠的用意，對於我們這些非當事者而言，3/11就只是一個新聞報導，但是對受害者


  ，就像電影畫面中的滿頁黑色塗鴉，是不願再想起的惡夢，換個方式去帶入，我們人生


  中有些重傷我們的記憶，也是這樣畫滿黑色記號。最讓我感動的是新海誠直接點出3/11號


  這天，告訴觀眾我就是要進入大家最深層最痛苦的記憶，想要好好治癒你們。在這之前我


  以為這部電影跟3/11的連結就只是都跟地震有關，東京超大蚯蚓暗示3/11,沒想到新海誠


  在最後直接點名，有些話我想跟3/11的人們訴說，好直接也好溫柔啊><




  第二是草太在尋求神明幫助那段，唸咒語時畫面帶出人們幸福的生活樣貌，新海誠用另外


  一種方式讓觀眾去同感3/11倖存者,不是用負面的方式而是用正面的，讓我感觸之深。




  第三是大鈴芽跟小鈴芽的對話，小鈴芽一直在找媽媽，而大鈴芽看見這樣的小鈴芽，過去


  跟他說你早就知道了-我們都早就知道那些黑色塗鴉真實存在並沒有消失，但我們卻一直


  不敢去接受，深怕這些印記一輩子會帶來不幸，跟幸福無緣。而大鈴芽卻告訴小鈴芽未來


  並非如此、妳以後會遇到自己超喜歡的男生（草太），會有很愛自己的阿姨，會遇到很多


  照顧自己的陌生人，未來跟現在的你想像並不一樣，要勇敢走出來-就像現在的自己遇到


  很多很想死喘不過氣的事情，或是失敗痛苦的經驗，新海誠透過大鈴芽告訴大家，現在不


  等於未來，就像日記上面的3/11雖然黑暗了幾頁，但到了後面幾頁他並沒有全黑下去，要


  努力走出去，邁步向前，勇敢出發。這也是為什麼我很喜歡動畫電影，這些話語如果是長


  輩朋友告訴你，效果可能沒這麼顯著，甚至反效果，認為你們不懂只會說空話，我知道我


  有多廢物，但從動畫電影的整部劇情來傳達這些訊息，特別有滲透力，似乎從二次元補足


  三次元無法觸及的心靈缺口。


  前三點都是哭爆，基本上我從3/11黑頁開始哭到最後，第四點是我喜歡的點，但沒哭。


  就是屌男試著去理解鈴芽的想法-問她貓咪似乎有想要鈴芽去做的事情，鈴芽打破沉默開


  始說話，很多時候真的小孩自己也不知道該從何講起，更多時候會認為這種事情講了你們


  也不信或是一定反對，但屌男在這裡直接拋出橄欖枝。



  咖啡廳打烊了 回家再補。


  --'
