url: https://www.ptt.cc/bbs/movie/M.1677323833.A.B74.html
title: '[  好雷] 鈴芽之旅'
content: '今天去看了口碑場

  有送鈴芽的海報很香^^





  ~~以下有雷~~~~


  簡單來說

  就是一個關上門避免會引發地震的蚯蚓跑出來的故事


  畫風如新海誠過去的風格般精緻

  和配樂的搭配也很棒

  真的是視覺聽覺饗宴

  每關上一扇門我都會起雞皮疙瘩


  但因為男主一開始就變成椅子

  所以相較《你的名字》的感情羈絆來說

  這部的感情線比較少

  男主人格魅力也比較難展現

  （但那個淚痣還是很加分，後面也是HE）


  整體上我很喜歡女主角在關門之旅中

  和各種人物的互動、相互幫助

  以及關門地點的背後回憶（國中、遊樂園等等）

  再搭配上手機的應用

  十分地貼近現代生活


  最讓我印象深刻的是

  最後鈴芽翻開小時候的日記時

  311的部分全部都塗黑

  和小鈴芽到處詢問媽媽在哪裡

  相信日本人看到這部分一定更有感觸


  看完後

  回想起鈴芽說：「生死不過就是運氣而已」

  除了覺得生命無常外

  也會讓人格外珍惜與家人相處的時光

  因為你永遠不知道哪一段相處

  會變成你和家人最後的回憶

  （電影中，蚯蚓掉下來前，有帶到很多居民出門前跟家人說：我出門了！

  那如果大地震真的發生

  這句話就會變成和家人說的最後一句話

  想到就讓人覺得眼眶濕濕的）


  總之整部影片有歡笑有溫馨有淚點

  劇情除了流暢

  也富含著人生意義

  推薦給不要太吹毛求疵又喜歡看動畫片的人~


  （大貓小貓都可愛）








  --'
