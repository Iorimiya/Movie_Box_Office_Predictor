title: '[討論] 鈴芽之旅的一些疑問(搶先+首映)'
content: "因為去年日本朋友很推薦\n\n這幾天看了兩次\n\n以下有時間線的雷\n\n--\n\n--\n\n劇情的架構下\n\n已知蚯蚓有兩個頭\n\n\
  而關東和關西分別有兩顆要石鎮壓住\n\n\n然後在時間線上\n\n草太和鈴芽相遇後\n\n關西要石脫落(右大臣-白貓)\n\n雖然九州不算關西?\n\n然後蚯蚓探頭\n\
  \n1.溫泉街廢墟\n\n2.春日高中廢墟\n\n3.神戶遊樂園廢墟\n\n\n接下來移動到東京\n\n關東要石鬆脫(左大臣-黑貓)\n\n然後草太變成要石\n\
  \n鎮壓了關東的蚯蚓頭\n\n\n所以到目前為止\n\n關西地帶都沒有要石\n\n然後草太一個要石抵過之前兩個要石\n\n後來都沒被開門\n\n\n最後鈴芽似乎回到仙台一帶\n\
  \n進入平行時空後\n\n左右要石才歸位\n\n草太才重回自由身\n\n然後草太說之後再慢慢回九州找鈴芽\n\n代表還是偶爾會被蚯蚓開門\n\n結論\n\n是關門師當要石效果\n\
  \n比左右大臣厲害嗎?\n\n\n\n\n然後題外話補充\n\n這部的喘息聲真的有點多\n\n我怕我以後在家看開太大聲\n\n別人會以為我在看什麼奇怪的東西QQ\n\
  \n\n\n\n\n\n\n\n\n--\n                  ▲  \n  /\n       \n       ●  \n\n--\n\n\
  但嚴格來說\n\n鈴芽故鄉後門\n\n仙台應該是關東要石的管轄範圍?\n\n\n然後關西要石(右大臣白貓)\n\n怠忽職守在外面到處玩(想泡鈴芽結果被打槍)\n\
  \n然後那邊都沒任何災情\n\n也是很奇怪"
