url: https://www.ptt.cc/bbs/movie/M.1713428632.A.7B6.html
title: '[普雷] 鈴芽之旅'
content: '防雷






























  沒有給好雷


  因為不滿的地方好多


  1. 鈴芽就是個一見鍾情的逃家屁孩沒錯吧？


  至少我看到後面的感想就是這樣


  雖然她還算有禮貌


  但是我看到很多人問她原因她都不講就很阿雜


  尤其是阿姨問的時候


  是在張幾點的？


  又不是累積好幾年的專業無法一下說給外行人聽


  妳就是個大外行不是嗎？


  妳都能理解其他人就是笨蛋？



  2. 搞不懂大臣的所作所為


  要說喜歡鈴芽 幹嘛不直接幫她？


  說是帶他們找門 幹嘛不直接帶路？


  感覺編劇為了不落窠臼


  反而讓角色行為變得很畸形


  要石也廉價的像什麼東西都能變一樣


  那幹嘛不抓一隻蟑螂？



  3.  阿姨吵架太突兀


  前面才說編劇不落窠臼


  後面又是老套收養家庭吵架主題


  而且超級突然


  突然吵架 突然跑出左大臣 突然阿姨暈倒


  突然跑去找小鮮肉哭哭我還以為他們要在一起了


  這段是我最無法理解的一段


  完全刪掉都沒差



  前面就有意識到這部電影是在說震災的事情


  但是看到3/11的日期還是不禁震撼了一下


  類似的電影讓我想到的是從心開始


  同樣都是為了撫平傷痛


  我比較喜歡從心開始的鋪陳跟結局


  他沒有明白的告訴你一定會沒事的


  也沒有告訴你未來一片愁雲慘霧


  他只是讓你看看這個故事


  並不是高高在上的教你該如何面對


  就好像自然產生的共鳴一樣


  技高一籌


  --'
