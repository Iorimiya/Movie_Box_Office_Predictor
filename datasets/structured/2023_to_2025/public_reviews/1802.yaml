title: '[好雷] 鈴芽之旅，不是給男女主角秀恩愛的'
content: '雷文防雷資訊頁







  每場災難中


  都有受創的小鈴芽，與默默付出的那位關門師


  但最後只有你自己能關上屬於你的那扇門


  也許那場半夜的無名雨


  是有個人幫我們阻止了一場災難











  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  以下是我對鈴芽之旅的藍色窗簾


  可以說我過分解讀我完全接受


  這次感覺新海誠不再把重點放在男女主角之間


  因為這是給311受害者們的一封情書


  鈴芽就是代表311受害的人們


  那些曾經帶給人們快樂回憶的廢墟


  那些門


  卻成為他們恐懼的來源


  大臣是代表人類的純真與善良


  他單純認為鈴芽想跟他玩


  才用自己的方法指引鈴芽去面對恐懼


  在鈴芽遇到危險時他也用自己的身體保護她


  而草太是默默暗地幫助大家克服困境的人


  左大臣可能是人類的負面情緒與壓力


  即便像是環阿姨那樣付出的人


  內心也承受了許多壓力，也許有過後悔或不甘


  但還是繼續付出


  就像左大臣打蚯蚓一樣，在第一線直面壓力


  而旅途中遇到的那些人


  我們平時可能覺得他們與我們不同


  可能是8+9妹或卡拉OK媽媽桑


  但在他們的日常生活中和我們並無不同


  一樣在社會中努力工作盡力生活


  ====================================


  整體劇情想帶給觀眾的是


  那些對於普通人而言就只是廢墟的地方


  對於那些受害者而言，雖然充滿許多美好回憶


  但是那些回憶可能觸動他們對災害的恐懼


  可能是親人的離去或好友的失蹤


  即便有大臣、左大臣、草太在幫助大家


  但是內心的恐懼還是會不經意間泄露出來


  大臣用他認為的“遊戲”想幫助你


  左大臣頂著壓力在對抗那些困境


  草太四處奔走也可能無法即時出現


  最後的最後，還是必須要鈴芽自己的覺悟


  去走出那個“常世”


  那些回憶也許會有痛苦


  但也是那些曾經的快樂


  帶給我們好好活下去的動力


  讓我們帶著那些快樂與對大自然的崇敬


  好好活著


  ====================================


  而我認為可能的一些隱藏訊息


  也許鈴芽也有關門師血統？畢竟沒說他老爸是誰


  可能也是某個關門師


  鈴芽跟草太可能是堂兄妹或遠房親戚之類的


  XD







  --'
