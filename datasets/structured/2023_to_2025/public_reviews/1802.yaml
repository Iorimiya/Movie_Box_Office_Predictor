content: "先說明這僅代表星之聲開始看的老粉的極短主觀評論，是否有參考價值請自行斟酌。\n\n\n\n如果以新海誠的災難三部曲來評比的話:\n\n\n你的名字\
  \ >(無法超越之壁）>天氣之子>>>>鈴芽之旅\n\n\n如果以新海誠所有作品比較的話大概是這樣：\n\n你的名字 = 秒速五公分 >（無法超越之壁）>(其他）>鈴芽之旅>追逐繁星\n\
  \n\n\n基本上可以當成追逐繁星威力加強版，追逐繁星的所有問題大概都在這部犯了遍，甚至拋棄了新海誠的專武（不用台詞單靠畫面細節堆砌出日常回憶中的小確幸），變成單純用一堆對白去表現情感這種普通的作法。\n\
  \n\n所以如果你跟我一樣幾乎想把追逐繁星當成新海誠黑歷史，那可能要斟酌一下\n\n\n但如果有帶淚點低女友的話，還是可以考慮進戲院支持下。\n\n--\n\n\
  追逐繁星是因為連畫風氛圍都太像畫虎不成反類犬的宮崎駿，學的太明顯所以對我來說是只會想拋之腦後的黑歷史\n\n你被秒5傷的很深喔XDD\n\n我會把天氣之子排前面，是因為雖然天氣之子許多不合理，但至少我能到那兩個屁孩性格與情緒的醞釀\n\
  但鈴芽裡沒有，你要我敘述君名、天氣之子裡男女主角性格碰上什麼狀況會做什麼事，我多少可以想像\n但鈴芽裡男女主角是什麼性格？我卻很難想像。\n\n 啊我就不想寫太長呀\
  \ 就是從找便利商店店員配音的宅宅開始看起的老粉才會想用簡單的比較方式來寫心得吧 = ="
