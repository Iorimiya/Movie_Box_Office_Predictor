title: '[情報] 鈴芽之旅韓國票房超越你的名字'
content: '《鈴芽之旅》3/8在韓國上映以來，蟬聯28天票房冠軍，累計3,859,561觀影人次，超過新

  海誠自身作品《你的名字。》3,812,806觀影人次的成績。


  《鈴芽之旅》目前是日本電影在韓國的票房亞軍，僅次於《灌籃高手》4,397,923觀影人

  次，新聞提到最終觀影人次估計突破400萬人次。


  新海誠在推特也預告月底即將再次造訪韓國。


  --'
