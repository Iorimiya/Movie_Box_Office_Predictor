url: https://www.ptt.cc/bbs/movie/M.1678098556.A.B0E.html
title: '[好無雷] 鈴芽之旅 是新海誠，也不是新海誠'
content: '雷文防雷資訊頁









  昨天去看了鈴芽之旅


  畫面很棒。天氣之子有一部分人體作畫失誤(例如某些分鏡的人物腿細的不自然)，鈴芽都沒

  有出現。


  劇情感覺很順暢、很不新海誠。新海誠過去的作品最顯著的特色就是大量的人物獨白、空白

  畫面。在你名、天氣，這個特性大幅減少但依然存在，到了鈴芽基本已經看不出這個特性了

  ，所以說這部電影很不新海誠。


  然而新海誠對自己愛用的分鏡和劇情元素還是很有堅持，某幾個分鏡一看就是在致敬天氣、

  你名，所以喜歡新海誠的人絕對一眼就看得出這部是新海誠的作品。


  看到這部的主題是天災，我其實也稍微覺得，怎麼又是天災？災難是變成新海誠的招牌了嗎

  ？但其實宮老，或說整個吉卜力，其實也掛著環保議題這塊招牌十幾年，所以我覺得鈴芽作

  為天災主題的第三部是可以接受的。重要的是，你名、天氣、鈴芽這三部災難題材的作品，

  其實有講出不同的故事，對觀眾來說感受還是不同的。


  你名和天氣有些可能會讓女性觀眾覺得不太舒服的笑點，在鈴芽也修正的比較圓滑，儘管這

  些依然一看就是三部曲一脈傳承的風格。


  新海誠從你名一直到鈴芽，都在作品中放入大量日本民俗文化、傳統信仰的元素。對台灣人

  來說，我相信鈴芽的置入更容易理解、感同身受。


  我對女主角的喜好程度會影響我對新海誠作品的評價。我是真的很喜歡三葉，鈴芽相比之下

  我比較無感，這可能也跟電影本身的刻畫有關。三葉、陽菜、鈴芽，我覺得描繪最深刻、最

  投眼緣的還是三葉。但是以整體人物來說，我覺得鈴芽裡的人物刻畫非常好，即使是配角都

  很好。


  坦白說鈴芽相比你名沒有那麼對到我的電波，風景我也是喜歡你名多了那麼一點。但是鈴芽

  的故事本身流暢，趣味性都更好一些。而且我們的確也看到，觀眾對你名和天氣批評的一些

  點，在鈴芽有被刻意的消除或是淡化。這部作品的畫面和音樂都屬頂尖，劇情不差，我覺得

  鈴芽之旅是一部值得進電影院觀看的電影。而且最好趁早看，才有音效、畫面特化的影廳可

  以選擇。



  ----

  Sent from  on my Google Pixel 4 XL


  --'
