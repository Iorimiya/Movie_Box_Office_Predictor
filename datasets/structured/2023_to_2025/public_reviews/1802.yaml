url: https://www.ptt.cc/bbs/movie/M.1678255436.A.699.html
title: '[好雷] 讓我哭到快兩小時的鈴芽之旅... '
content: '雖然我不知道是不是自己淚腺太低、還是昨天晚上沒睡好的緣故，

  總之我估計電影兩小時，我大概哭了一小時半...


  從十明的主題曲第一次響起就開始哭，一路哭到最後:)


  我必須說，十明這個歌手太厲害了，歌聲的穿透力超強，

  洋次郎選她真的是選得很對，十明的歌聲一出來，整個片子的感覺就出來了!


  新海誠說故事的功力又進步了，前一次天氣之子讓人很失望，

  但這次的鈴芽整個非常動人，應該說有好好把一個故事講清楚，講得感人，

  我覺得這就是很棒的事情了。


  最後我必須說，君名我刷了八次，但這部片我不敢刷第二次，

  第二次就沒有這種強烈的感動了...



  --


  "你要學會忍耐，哪怕周圍所有的人都不在了，只剩下你自己，你也要堅持到最後。"

  --<<祚明>>


  --'
