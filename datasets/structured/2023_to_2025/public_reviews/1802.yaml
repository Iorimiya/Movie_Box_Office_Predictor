title: 'Re: [炸彈雷] 鈴芽之旅-瑕不掩瑜，但千瘡百孔的微爛'
content: '以下純腦補跟有歷史資料對照

  就看小說或舞台挨拶QA有沒有解釋了


  抓蚯蚓的地點跟次數是有意義的


  第一、二次地點現實是在日本大分縣

  及愛媛縣，2022年大分曾經發生6.6地震


  但真正讓日本擔心的是南海海溝的地震預測

  ，在江戶時代曾經發生南海大地震，所以包

  含九州、四國、關西等，都在擔心南海海溝

  ，其預測規模會比311大上數倍。


  第三次登場則是阪神大地震，這場地震在日

  本地震史上是別具意義的，因為更加喚醒日

  本對於防震的重視。


  第四次就很明顯的是關東大地震，罹難人數

  超過10萬人，所以可以看出蚯蚓看似比其他

  地方（除了311），都還大。


  第五次當然就是311，就不多說



  所以這些蚯蚓就登場的地點，都是別具意義

  ，新海誠是不是這麼認為不知道，但就現實

  搭上電影發生地點，是可以連結出意義的。




  三本足椅有以下腦補解釋


  （1）

  只是單純象徵草太當時右或左手受傷，所以

  以三腳椅做象徵。

  （2）

  日本神話鳥「八咫烏」，是為神武天皇帶路

  鳥，世間將形象為三腳鳥，日本足球代表隊

  上的鳥就是了



  電影象徵草太是為輸輸妹帶路的人。









  不是一次，而是一個人只能進入專屬的一個門

  所以輸輸妹沒辦法進入別的門




  常世是真的充滿Bug，但可以想成某個維度空

  間，連結記憶、時空的地方，反正你的名字也

  都能回到過去，所以有個常世這樣的地方應該

  也不奇怪。




  其他的覺得好看難看，不予置評~

  單純腦補解釋



  -----

  Sent from JPTT on my Xiaomi 21091116UG.


  --'
