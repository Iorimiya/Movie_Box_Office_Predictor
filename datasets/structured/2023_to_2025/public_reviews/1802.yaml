url: https://www.ptt.cc/bbs/movie/M.1677406091.A.C27.html
title: '[好雷]  鈴芽之旅 LUXE'
content: '雷文防雷資訊頁


  新海誠還是那個新海誠，只是少了點悲傷結局，個人雖然認為你的名字應該是最完整的故事；天氣之子概念很好，但敘述的不夠很好，很多地方有不足，不然畫面真的是最絢麗的；但我個人最喜歡的可能是鈴芽之旅，也許是因為某些經歷有共同感受，如果有經歷過921大地震也許更有體會也說不定。


  說是三部曲嗎？我覺得更像是番外篇，因為沒看到跟其他兩部有連結，所以有可能真的是新海誠寫給311大地震之後的情書。


  至於畫面部分，發現LUXE廳有上毫不猶豫直接買好位置，畫質真的不用說，聽到LUXE廳的重低音音效，我想可以理解為何會上4DX，可是如果是4DX，有可能會被淋濕，因為下雨畫面很多；這次音樂切入有恰如其分，節奏明快幽默，自然的笑點，最後的劇情頭尾呼應相當感人。


  唯一美中不足是真的很多人來看，有八成滿，結果隔壁遲到20分鐘不說，還一直滑手機結果被我罵才肯停，後面好好認真看電影感動到哭不好嗎==，幸好我本來就還要再看一次杜比廳，不然被干擾到真的很可惜。



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  其實要說什麼大概就是感情戲不夠深刻，也許是刻意加的，但就算不是刻意，只要套上命運一切就能說得明白，草太跟鈴芽的相遇絕不是偶然，雖然電影裡表現很花痴，如果能多點時間營造大鈴芽跟小鈴芽之間的故事對話，還有草太過去的故事就能說得通，不過可惜新海誠常常很多故事在電影上不會說明白，要看小說或漫畫才能補完。


  忘了說，還有關門師、左大臣跟大臣這些應該都還有很棒的故事能說，希望後面能一起補完，不然看電影常常會覺得莫名其妙，怎麼搞事仔突然洗白XD


  不得不說東京大決戰真的是震撼，對，就是大決戰，那個絕望感氣勢磅礡，事實上我認為鈴芽有帶入天氣之子的影子，只是不同的是天氣之子是「輸了妳，贏了世界又如何？」


  在鈴芽之旅則是追愛變成了自我救贖和拯救世界，也許也是為了療傷，不然在我看來都是為了愛不顧一切橫衝直撞，其實跟天氣之子是差不多的，只是天氣之子花了很多時間在陽菜帆高的情感相處建立上，不像鈴芽單薄。


  但這不影響我非常喜歡這部片，因為裡面一句話我深感認同：「生死不過是運氣。」在我到現在短暫的人生當中，有時候我常常覺得怎麼不是我，而我卻一直在送行，因此對我而言，生死真的是一個運氣而已。


  剩下要說的話，雖然新海誠這次不再是姐弟（我御姐控），但阿姨真的很正啊（姊姊也是），同事太工具人了，直接一個芹澤出現根本不用玩QQ，但芹澤真的有情有義而且善解人意，同事你就認了吧！


  如果鈴芽在遇到草太之後沒選擇追愛而是在乖乖去學校上課，我想就沒辦法成長，無法跟過去好好對談，一路上的經歷都是未來的動力，雖然運氣也是很好就是了，然後身為一個女高中生根本可以跟職業運動員比了（？


  沒想到打了這麼多，這次新海誠把一些科技生活很好地融入了電影中，椅子跟貓也很可愛，難怪這麼多人愛，可惜台灣目前沒什麼週邊，不然我可能看完就順便帶個鑰匙或椅子回家了。


  -----

  Sent from JPTT on my Sony XQ-BC72.


  --'
