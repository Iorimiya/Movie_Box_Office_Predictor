url: https://www.ptt.cc/bbs/movie/M.1678498019.A.B32.html
title: 'Re: [普雷] 鈴芽之旅 — 讓人意難平的感情線'
content: '我是昨天晚上進程看的，看之前沒有看任何劇情評論


  這部在親情跟旅途上的塑造真的很不錯


  但一直到爺爺那段的「草太先生不在的世界才讓我覺得可怕」


  我也是瞬間出戲，直接覺得這是什麼戀愛腦發言？


  明明那時候爺爺已經說了，不要讓男主角的犧牲白費、女主角的決定是正確的救了幾百萬

  人


  但女主角卻還是堅持在不知道能不能成功讓自己變成要石取代草太的情況下堅持要去救草

  太


  這樣為了一個人而可能犧牲百萬人的情況下，加上劇情一開始就安排女主角對男主角一見

  鍾情，

  讓這段更顯得女主角很戀愛腦


  的確女主角有部分覺得愧疚於男主角害他變成要石，所以陪伴旅行要讓他變回人類


  這部分我覺得觀眾已經有感受到了


  如果那句改成「草太先生是因為我才變成要石的」或是其他呈現方式


  我覺得會讓女主的高度呈現瞬間不同


  阿稔之於環姨不會讓人覺得突兀是因為他們是認識好幾年的同事，感受的到阿稔喜歡卻又

  不敢明說


  但鈴芽對草太也就幾天的相處卻如此義無反顧甚才會讓人覺得出戲


  另外在還沒有看任何評論下的觀影感受，怎麼會變成人云亦云了呢？


  --

  如果大家是看風向後都這樣說

  那是你說的人云亦云

  但是有多少人沒看評論後出電影院都是這個感想

  你卻反過來指責觀眾膚淺、沒看懂電影

  而不是導演的敘事方式出了問題

  導致於大家沒辦法聚焦在真正想表達的意思上？

  劇情裡面一開始就安排女主覺得男主很帥而拋下學校回頭找他

  好幾幕女主對男主臉紅，甚至想親男主（椅子）

  最後女主再進去常世前也是跟環阿姨說

  「去我喜歡的人那裡」

  導演用這些大量的鏡頭跟台詞在告訴觀眾，女主喜歡男主，然後你反而怪觀眾戀愛腦解讀

  失焦

  也是蠻有趣的

  所以你也不否認他就是給了很多戀愛因素啊

  你給這麼多戀愛因素然後卻怪觀眾用這個角度去看

  而到底是伏筆還是你超譯，就不好說了

  畢竟你覺得自己才是看懂電影的那位'
