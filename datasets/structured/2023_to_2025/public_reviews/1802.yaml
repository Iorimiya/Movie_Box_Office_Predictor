url: https://www.ptt.cc/bbs/movie/M.1678413042.A.C14.html
title: 'Re: [普雷] 鈴芽之旅 — 讓人意難平的感情線'
content: '若這部電影如很多X子講的，多著墨於戀愛的感情互動


  那這部電影就會變成譁眾取寵的糞作了



  劇情是需要取捨的，在有限時間裡表達想表達的東西


  明顯這部就不是戀愛向，結果很多人一直在那說感情戲不夠


  就好像買了普通漢堡在那嫌棄起司太薄太小片


  啊人家賣的就不是起司堡嘛 (攤手


  你花錢看了電影，沒get到電影主要想表達的意念


  連別人告訴你了，你也不想接受，那你是不是浪費錢?


  電影末段揭露女主是311的倖存者，而這段旅程，實際是女主的自我救贖之旅


  也是獻給所有震災受創者的集體療癒，這樣感情還不夠飽滿?



  說到底，為什麼覺得電影就一定要是起司堡?


  那句：草太先生不在的世界才讓我覺得可怕，是能多讓人出戲?


  如果草太是你的好友，你會因為只是友情，就能接受世界沒有草太?


  為什麼一定要是愛情，才讓你覺得那句合理?


  女主因為震災失去母親，活在沒有母親的世界


  不想再接受因為地震失去誰的心情，這解釋不夠充分?


  一直糾結在感情戲的人，是為黑而黑，還是根本自己戀愛腦的問題?


  芹澤也沒法接受沒有草太的世界啊，所以他才會出現在地鐵站口


  難道芹澤是草太基友? 還是芹澤對鈴芽一見鍾情?


  不要看太多黑粉的評論，然後被人影響了，好嗎?  真是笑死


  (上面笑死是針對全部沒有獨立思考能力的人)


  最後再說，戀愛的部分，為什麼不是主要成份就不能放進去?


  放進去就一定得要說得清清楚楚，中間醞釀再醞釀?


  怎麼會有那麼膚淺的想法呢?


  人的情感本來就是很複雜的，電影都是透過一些片段在表示或暗示


  就像電影用阿稔幾個反應就讓觀眾知道他很喜歡環姨


  難道你也會抱怨鋪陳不夠，阿稔的激動根本動機不足，讓你很出戲?


  電影不是那樣拍的嘛，是要有觀眾想像空間的嘛，是不是?


  比起看人批評這部電影，更讓人不蘇胡的是....人云亦云的人不會隨時代進步變少呀


  --

  那是你覺得，你的不滿足，當然這可以自由心證

  你從哪裡得出這是"多數人"的看法? 你幫沒出聲的人都代表了是嗎?

  多少人都說了，那不只是戀愛感情，你是卡在哪? 耳朵會不會太硬?

  既然不全是戀愛感情，那就不純然是感情戲，不只是感情戲的話，又哪算是硬塞了?

  實際上男女主角互動還不少


  男主變成椅子那段我也傻眼了三秒


  心想，這要怎麼發展感情啊?


  結果這反而算是大幅拉近男女主距離的方法


  因為女主可以堂而皇之的一把抱起男主，誰叫他是椅子


  還一屁股坐上去，誰叫你是椅子


  被JK穿著襪子踩了，誰叫你是椅子 (拜託坐我、踩我)


  也因為男主變成椅子，才有用親吻喚醒的橋段 (若是人形就沒辦法了?


  以上都是男主變成椅子才會有的互動


  為什麼要認定男主變成椅子，她們之間的互動就不能加深感情?


  但是另一方面


  也因為男主被變成椅子，戀愛要素被限縮了


  但這對於一部來說，不也是最好的安排?

  這部分我也覺得很荒謬

  為什麼這麼基本的認識得再三的跟看不懂的人講

  好像在教閱讀測驗怎樣都看不懂的人似的

  多少人都講過上述的解讀，但他們就是不願意接受 (攤手

  誰規定人云亦云的內容一定要是多數人的認知了

  你們就一小搓人講著重複的內容，一個接一個地跳針

  抱歉啊~ 已修正，的確不要亂改台詞才好，尤其是中間有翻譯的

  的確是中性的，不是戀愛腦所想的

  找到預告了，反覆聽我想是爺爺先問鈴芽去死者的世界不害怕嗎?

  鈴芽回答: 草太先生不在的世界我(才)覺得可怕

  翻譯當然都會潤飾，不過原意看起來真的不是以戀愛情感為主

  硬要用戀愛電影的公式與標準套在這部電影就是不恰當

  跟戀愛腦講再多都沒用

  同上

  看電影不需要當蛔蟲

  搞錯重點的人真的很多，不是嗎'
