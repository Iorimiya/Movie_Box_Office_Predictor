title: 'Fw: [悲報] 鈴芽之旅北美票房,被小美人魚一天打爆'
content: '作者: shun01 (老胡做13年,青沼瞬活14年) 看板: C_Chat

  標題: [悲報] 鈴芽之旅北美票房,被小美人魚一天打爆

  時間: Sat May 27 22:11:46 2023


  如題,根據IMDB旗下Box Office Mojo的資料,鈴芽之旅北美上映42天以來,最終僅收穫1067萬7777美元票房

  由於僅剩場次不多,再剩下上映日數一天也很難有超過1萬美元的票房,所以幾乎可以確定票房大概就這樣了


  然後小美人魚北美票房光是5/25的週四提前場,就快要跟鈴芽之旅的北美累積票房打平了(大約1000萬左右)

  雖然目前Box Office Mojo還沒放出5/26正式上映首日的票房

  但根據其他網站的資料,含上述的週四提前場,小美人魚正式上映的首日(5/26)票房,就高達3800萬美元



  我沒看錯吧!

  說真的這年頭要找比鈴芽之旅好看的電影不算太容易

  (哪怕星際異攻隊3,對岸給小美人魚補刀的SAOP2或龍與地下城都還是差了一點,更別說瑪利歐這種沒配4D就不太值得去看的...

  今年有印象真的能跟鈴芽之旅相提並論的,大概就EVA終跟萬惡世代吧!頂多加鞋貓劍客2或那個男人,連捍衛任務4都差了一點點...)


  沒想到小美人魚能有這樣的票房?

  而且論教育,小美人魚有可能比鈴芽之旅更適合教育?

  (難道黑人父母會希望女兒當愛麗兒而不是鈴芽?)



  我開始好奇有沒有記者問新海誠:自己作品的北美票房輸小美人魚是甚麼感想?


  --

  諸神已離開 鬼在狂歡 而人們在糾纏

  誰生錯血脈 誰長錯色彩 誰夢錯了期待？


  《少年他的奇幻漂流/五月天》


  --


  可惜這片沒看過,就先不評論了

  如果是詹姆斯岡恩或史蒂芬史匹柏來拍的話,可能還值得期待

  其實瑪利歐這票房反而讓鈴芽有點尷尬,因為都是動畫+日本IP,但鋒頭最後被搶

  其實我電影看蠻多的,但是看到最後,發現還是日本動畫的敘事節奏最好

  不盡然,有些情感總該是人類共通的

  不如問,為何中韓的狀況沒有在歐美複製?

  又一個悲報,今日小美人魚對岸單日票房超SAOP2了

  就是看了很多電影,看到後來才發現平均而論,還是日本動畫最好

  反了,我這幾年年均影院觀影300場起跳,幾乎是日均一步了

  小孩想看?

  真發生這種事我會嚇傻,然後帶孩子做健康檢查或檢討教育是不是出了甚麼問題

  灌籃高手的劇情配重怪怪的,感覺能看的都集中在後半段

  瑪利歐則是不配4D的話還是不行,偏偏台灣沒進4DX'
