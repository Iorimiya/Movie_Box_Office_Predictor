url: https://www.ptt.cc/bbs/movie/M.1678004847.A.BB4.html
title: '[炸彈雷] 鈴芽之旅-瑕不掩瑜，但千瘡百孔的微爛'
content: "鈴芽之旅  滿多人去看的我自己有點意外\n\n好像板上也是滿多好評\n\n以作畫水準或是配音  都是高水準以上  以及配音也都很好 這是可以享受的\n\
  \n但是一部電影最重要的恐怕還是劇情的關鍵\n\n\n所以我要說這部　　別期待　　你會趴帶\n\n\n能不能打動人心  劇情必須實打實的有眼淚的威力\n\n否則儘管最後故意要煽情\
  \  配音澎湃下去  回憶殺開始閃爍  人物眼淚狂掉\n\n當觀眾感受到劇情裡面的瑕疵與空洞  就顯得毫無作用\n\n\n我不想用很批評的角度來酸他  因為整體的架構你可以當作一部電影看完\n\
  \n不至於覺得阿凡達2的昏睡或國片的想罵幹你娘\n\n\n\n可惜抓蜈蚣的次數實在是太頻繁以及沒有鋪陳出意義\n\n莫名其妙地看他們關門起碼三四次  已經很膩了\n\
  \n關門師的介紹已經是中後期了\n\n但其中有蘊藏一些幽默  是不錯的  包含椅子睡覺的睡姿  貓咪耍可愛\n\n以及踩椅子坐椅子  這種草太跟鈴芽的互動\n\n\
  那種有一點點感情的fu絕對是加分的\n\n\n\n我不認同草太改成女生會更好  那只會讓人覺得整趟旅程更莫名其妙\n\n草太跟鈴芽的戀愛沒有著墨太多  我認為是雙面刃\
  \ 其實也有好處\n\n自己覺得挺舒服  再多的話會有點出戲 畢竟關門是很緊急緊湊的任務\n\n只是最後顯得兩個人的依賴  執著有點太深了\n\n當然以動畫的角度去吸收\
  \  也不太意外\n\n\n\n瑕疵是各種超現實跑酷飛起到摩天輪\n\n各種超加速  不符合物理那種毛病  就也是動畫誇張化可忽略的\n\n\n\n我繼續從劇情分析\n\
  \n\n\n大臣的出現滿扣分的  我早就猜到它是要帶領主角們去關門(很明顯...)\n\n一下邪惡 一下洗白的飄忽不定沒啥必要\n\n\n\n另外看一下大家很詬病的點\n\
  \n就是一路上都遇到好人\n\n這個我自己不覺得是一個問題  觀影過程中我的確有出現這樣的想法\n\n\n「哇真好  都遇到好善良的人呢」\n\n\n但是我不會覺得這樣是一個缺點\
  \  實際上我本身也遇到很多很誇張的好人\n\n生活中是會出現這樣的奇遇的\n\n何況是電影  那這些功能性的角色出現  我不會太意外\n\n包含跟小孩的互動又有增加一點幽默的成分\
  \  這又是一個瑕瑜之間的搏鬥\n\n\n只是最大的癥結點就是這個關門師的意義沒有深入人心\n\n就像是椅子為什麼三個腳\n\n你可以不解釋  但就是要面對到觀眾心裡會一直有疙瘩\
  \  想知道靠北到底什麼梗\n\n與其這麼秘密或是要讓觀眾懂  不如最後硬掰一個理由會更好\n\n\n\n當然bug的出現又是另一個打擊觀眾共鳴的重點\n\n\
  包含常世只能去一次  但鈴芽好像有超能力可以來回穿越  至少給人這種感覺\n\n讓人覺得爺爺講什麼幹話怎麼不去死\n\n又或者見到過去的自己  開始變成時空交錯的梗\
  \  但完全沒解釋為什麼\n\n\n\n其實這種漏洞在天氣之子  你的名字就常常發生\n\n為了煽動情感\n\n邏輯完全放飛硬要搞  故事一開始漏洞就一兩個 \
  \ 但放著不顧到結尾就是千瘡百孔\n\n觀眾除非真的閉上眼睛心理高潮著新海誠  否則很難不看到那些缺點\n\n\n\n當草太暫時掛掉  草太的朋友出現來撐場 \
  \ 卻只是為了當一個司機\n\n從頭到尾她阿姨跟草太朋友都是狀況外\n\n這某種程度表現了觀眾也會是狀況外\n\n\n\n這是新海誠的致命缺點\n\n\n\n\
