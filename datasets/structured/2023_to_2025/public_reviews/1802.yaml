url: https://www.ptt.cc/bbs/movie/M.1678089913.A.D0C.html
title: '[微負雷] 鈴芽之旅，新海誠不告訴你呦~~'
content: "沒什麼好說，就是防雷\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n\n\n\n\n\n昨天總算是進電影院\n把自己有興趣的電影片單給消掉一個了\n\n新海誠的電影我看得不多\n基本上是從你的名字 -> 天氣之子 -> 鈴芽之旅\n\
  \n所以不用說什麼我懂不懂新海誠想表達的東西\n或他一直以來如何如何的\n\n我不了解他，以一個純電影觀眾的角度講\n我也不應該需要了解他\n\n我需要了解的，應該只有電影本身\n\
  \n因為我，就是普通的電影觀眾，不是粉絲\n\n========前提=======\n\n看得出來這次新海誠是想挑戰公路電影的模式\n\n看完之後，又上來看了一下大家的討論\n\
  有些想法想說說\n\n\n\n\n個人的感想是\n\n畫面很棒，取景跟角度帶出來的壯闊感有\n音樂很棒，音樂跟場合的搭配度很棒\n\n劇情很爛，想留的伏筆太多，到最後又都不解釋\n\
  \n我喜歡這次劇情用較為輕快跟搞笑的方式去處理\n(個人喜歡明亮輕快型的電影，純主觀)\n\n感覺這次搞笑的橋段不少，也順暢，算自然\n斧鑿的痕跡比較沒那麼重\n\
  \n因此，如果想看娛樂電影的話，值得一推\n\n除此之外，不推\n\n很簡單，因為除了畫面、音樂、搞笑的部分以外\n問題偏多，劇情真的有點糟\n埋了太多伏筆，卻無法一一交代\n\
  \n導致最後都只能靠觀眾自行判斷跟腦補\n\n個人覺得，這不是一個好的交代手法\n\n\n==============正片==============\n\n\n\
  我想，就試著用問題清單的方式來說明看看\n\n名稱部分，因左大臣為另一個要石\n姑且簡稱之為\n所以大臣就簡稱為\n\n以便釐清\n\n--------\n\n\
  --------\n\n\n大臣or神(以下簡稱右喵)\n想要變喵就變喵，想變要石就變要石\n\n是什麼原因或什麼力量\n導致要石變回右喵，又要什麼條件才能恢復成要石？\n\
  \n電影完全沒有說明\n\n右喵不能變回要石的原因\n只簡單說了，右喵已經沒有責任\n要石已經變為草太了\n\n但為什麼變成要石的是草太\n卻不是拔起要石的鈴芽\n\
  \n電影還是沒有說明\n\n而草太變為要石的關鍵點\n僅是右喵說了一句\"你很礙眼\"\n\n然後草太就變成椅子(要石？)\n\n這不就代表要誰當要石，是右喵可以決定的？\n\
  \n而右喵決定是草太當要石\n卻非拔起他的鈴芽\n(正常應該是闖禍者要承擔？)\n\n\n\n最後，在常世救回草太時\n\n草太突然就恢復人身了？\n然後突然喵就可以變回要石了？\n\
  \n草太解除身為要石責任\n恢復人身的關鍵原因是什麼？\n\n喵恢復要石責任的關鍵原因又是什麼？\n\n\n\n\n\n\n再者，你要石變成喵之後，現世的人都看得到\n\
  那不就意味著，變成要石後，別人也看得到\n那是不是哪天哪個人不小心拔出來就完了？\n\n然後一開始，鎮壓的要石是在現世被拔掉\n中間，妳鈴芽把草太插進(羞)蚯蚓時也是在現世\n\
  \n但是最後進行鎮壓時，卻是在常世插進去\n\n這要石要鎮壓，到底是要在哪個世界才有作用？\n\n\n\n\n\n--------\n\n--------\n\n\
  \n這隻喵(或神)最大的問題是\n如果你是為了要鎮壓而選擇跟著鈴芽\n想藉人的手恢復原狀\n\n當時，變回貓形時，你還在鈴芽手中\n若是因某些原因導致鈴芽拔了你之後\n\
  短時間內無法變回要石\n\n那為何不從頭開始就跟著鈴芽？\n等到可以變回時，再藉由鈴芽的手變回就好\n卻反而是要跑給他們追？\n\n有人說這邊是要引導鈴芽去關門\n\
  \n這樣的方式\n常常導致蚯蚓都到最後一步快壓下來了\n才勉強關上\n\n會比在身邊先提示鈴芽來得快又直接？\n\n若留在鈴芽身邊，還能提早過去關門\n降低失敗機率不是？\n\
  \n\n--------\n\n--------\n\n\n左大臣(以下簡稱左喵)\n\n在鈴芽拔出右要石後\n因為僅剩一個左要石，鎮壓不住\n\n最後鬆動，導致地底力量大幅冒出\n\
  \n鬆動後，左要石變為左喵\n\n然後跑來找鈴芽(或是感應到右喵而來)\n\n可是出現方式\n卻是控制環阿姨說出內心角落的黑暗面想法\n\n\n\n電影中沒有說明\n\
  \n且後面也未再對此能力多做說明與應用\n\n或許，這是電影為了引導環阿姨跟鈴芽更好的了解彼此\n進而體諒彼此，所設計的橋段(問題四說明)\n\n神的能力要如何設定\n\
  其實在奇幻電影中都是隨導演高興\n但一個能力，只為了一段不甚重要的劇情\n又不說明，後面也沒有任何應用\n(個人覺得不甚重要的原因，同在問題四說明)\n\n其實反而顯得有點過於刻意\n\
  \n整體來講，左喵最關鍵的作用是阻擋蚯蚓\n與在最後變成左要石，壓制蚯蚓\n\n左喵在常世變成大喵壓制蚯蚓鑽出後門的畫面\n可能就是要石平常鎮壓力量的樣子\n\
  只是現世看不到\n這部分其實我覺得表現得滿好的\n\n但是，同問題一\n\n你左要石鬆動後變成左喵\n跑來找右喵，然後說要藉人的手恢復原狀\n\n但右喵的問題是責任轉移給草太\n\
  所以無法恢復原狀\n\n而你左喵沒有這問題\n\n那為什麼不能請距離更近的其他人直接把你恢復原狀\n而是千里迢迢跑來找鈴芽？\n\n難道是鈴芽有什麼特殊能力？\n\
  (但是電影沒提到呦~~)\n\n而到底是短時間內不能恢復\n(多短？左喵來找鈴芽\n 到進常世變回要石也不過七小時不到)\n\n還是責任轉移給他人無法恢復\n\
  (轉給誰？)\n\n喵要恢復成要石是否需要其他條件\n\n\n\n\n\n--------\n\n--------\n\n\n\n\n前面不少文章提過了，這邊簡單提一下就好\n\
  \n一個女生，路過遇到一個問路的男生\n覺得他很帥，所以有點在意\n\n後來去遊樂園遺跡時\n又表現得好像見過\n(鈴芽說我是不是見過你之類的話)\n(但是到最後還是不知道男女主以前是否有見過.....)\n\
  \n後來因為帥哥受傷\n硬是要帶他回家包紮(帥哥一開始其實有婉拒)\n\n然後短短幾小時內，他就被變成椅子\n\n女生覺得是她害的，要想辦法幫他恢復原狀\n只好開始追喵順便關門之旅\n\
  \n這橋段在公路電影裡其實滿常見的\n\n兩位主角不論男女，從一開始的無法理解\n到最後因為各種事件\n互生好感因而結為好友or情侶\n\n這部分我其實可以接受\n\
  \n但是，一路上，妳扛著的可是一個椅子啊\n妳跟我說，因為跟一個椅子東奔西跑關門\n\n最後產生人椅之戀\n\n這，如果不是椅子的第三隻腳讓妳沉迷\n\n我真的不好理解這感情的發生原因....\n\
  \n然後最後妳鈴大姐說，妳不能接受沒有草太的世界\n\n嗯？？嗯嗯？？？嗯嗯嗯？？？？\n(沒有椅腳的妳還是可以選擇電動按....)\n\n只能說人帥真好嗎？....Orz\n\
  \n\n\n\n當鈴芽去到醫院，明確地找到病房時\n我還懷疑我是不是漏看了什麼\n\n草太不是一直都沒跟鈴芽說哪間醫院嗎？\n\n那鈴芽是怎麼知道資訊的？\n\
  (算了，也不用深究了....)\n\n而爺爺聽到草太失敗後\n就表現得好像知道草太已經掛了\n\n失敗，對關門師來講\n不是就代表關門失敗而已嗎？\n\n他從哪裡知道草太變成要石的？\n\
  \n鈴芽這不是剛到你房間，什麼都還沒說嗎\n\n還有你那知道草太變要石之後\n無比冷靜(or冷淡)的態度\n\n他草太，真的是你養大的嗎？....=.=\n\n\
  \n\n\nhmm...你鈴芽第一次到草太房間時\n遇到芹澤來敲門，不是還覺得麻煩\n要鈴芽去應付他嗎？\n\n一開始我還以為芹澤是什麼麻煩人物\n\n結果是他喵的啊\n\
  \n無責任突然感覺到鈴芽在做的事很重要\n願意自願載她連夜跑到幾百公里外的郊區\n\n撞壞了車也不在意\n被姨女倆拋在路旁也不在意\n被別人投以異樣眼光也不在意\n\
  還幫忙調解兩位大小姐的心情\n\n我說，你芹澤跟鈴芽不就見過這麼一次面嗎？\n\n你怎麼知道這個在草太房間的女生\n不是被草太始亂終棄後來糾纏他的\n或是單純迷戀草太的恐怖粉絲\n\
  \n你到底哪來的信任感......=.=\n\n甚至到最後還無怨無由\n然後才說出，原來是你欠草太錢啊\n\n哇靠，這樣的債主我前所未見\n希望我有生之年也能遇見幾個啊....(茶\n\
  \n(其實我這邊有開始懷疑草太說不定是雙......)\n\n\n\n\n環阿姨在左喵出現的那一幕\n講出了一直以來心中角落的壓抑情感\n\n然後解開控制後，才說她想的只是一小部分\n\
  對鈴芽的愛遠遠超過那部分\n\n而後鈴芽理解，也道歉\n最後互相接受\n\n\n這其實也是一般公路電影中常出現的橋段\n\n兩個陌生or相識已久的人\n\n因對彼此不了解，一路上多有衝突\n\
  直到發生某事件，看清了彼此的內心\n了解，然後體諒\n\n\n但這段實在很難讓人有代入感\n最大的原因，真的是這段太短太突兀了\n\n前面既缺乏舖陳\n\n比如環阿姨可能工作太忙沒空了解鈴芽\n\
