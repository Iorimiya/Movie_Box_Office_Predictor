url: https://www.ptt.cc/bbs/movie/M.1679908544.A.06F.html
title: '[新聞] 《鈴芽之旅》票房創紀錄！新海誠推特整排'
content: '《鈴芽之旅》票房創紀錄！新海誠推特整排「盜錄打卡照」　網暴怒


  編輯 王芊歷 報導 2023/03/25 15:35



  新海誠出席中國大陸上海首映禮。（圖／翻攝自＠shinkaimakoto推特）

  繼《你的名字》、《天氣之子》之後，日本動畫導演新海誠再度推出第3部災難題材電影《鈴芽之旅》，自去年（2022）11月先於日本上映，隔年接著在台灣、南韓、馬來西亞、新加坡等陸續上映，其中中國大陸首日票房更達人民幣9537萬（約新台幣4.2億元），創下日本動畫電影票房新紀錄。對此，新海誠也特地在推特以中文寫下「非常感謝您！」怎料底下卻出現不少電影院大螢幕的偷拍畫面，掀起網友熱議。



  新海誠用中文致謝。（圖／翻攝自＠shinkaimakoto推特）


  為感謝各地影迷的支持，新海誠日前飛往北京、上海等地與粉絲見面，並在推特寫下初次到中國大陸的心得。值得關注的是，許多中國大陸網友在看完電影後，紛紛翻牆到推特給新海誠留言，附圖竟是電影院內的大螢幕，電影甚至仍在播放當中



  網友竟留言盜錄的電影畫面。（圖／翻攝自＠shinkaimakoto推特）


  面對這些網友盜攝的舉動，其他網友忍不住在微博砲轟「為什麼那麼多盜錄？沒有人管管嗎」、「雖然覺得劇透沒啥，但也不用拍一大段吧」、「還好昨天去看了，不然抖音片段都能拼湊整部了」、「自己國內平台發了不夠，還翻出去到新海誠推文下面發，可都要點臉吧」、「電影再好看也不是你在電影院盜錄的理由」。



  中國大陸網友在微博怒罵盜錄者。（圖／翻攝自微博）


  事實上，電影院內所播放的預告片、電影正片、片尾皆不可錄影、照相和錄音，儘管是個人收藏或與朋友分享，都是「違法重製」行為。另據中華民國刑法、全國法規資料庫說明，盜錄電影可判處3年以下有期徒刑、拘役或30萬元以下罰款，若要檢舉電影盜錄片段或盜版侵權行為，則可撥打檢舉電話0800-016-597、受理單位為「內政部警政署保安警察第2總隊刑事警察大隊」。






  --

  Sent from nPTT on my iPhone 14 Pro Max


  --'
