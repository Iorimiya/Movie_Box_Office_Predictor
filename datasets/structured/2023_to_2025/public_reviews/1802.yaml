title: '[討論] 鈴芽之旅為什麼是保護級'
content: '無意中發現鈴芽之旅的分級是保護(6+)


  人稱新海誠的天災三部曲另外兩部


  你的名字和天氣之子


  分級都是普


  鈴芽在日本也沒有特別的年齡限制


  是有什麼原因導致這部在台灣被分類為保護級嗎？


  ----

  Sent from  on my Google Pixel 4 XL


  --'
