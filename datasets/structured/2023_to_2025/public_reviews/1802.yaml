url: https://www.ptt.cc/bbs/movie/M.1678171585.A.EE9.html
title: 'Re: [微負雷] 鈴芽之旅，新海誠不告訴你呦~~'
content: '感謝原PO nifa寫這篇。

  而且又跟不少板友互動，很有共鳴。

  同時覺得片子不錯看跟遺憾。


  以下會有各部一些劇情雷

  鈴芽之旅 2022年11月

  風起？2013年7月

  福音戰士新劇場版Q 2012年11月

  福音戰士新劇場版終 2021年3月


  ===========以下有雷=========



  先說本片可以拋出來認真處理的問題：

  鈴芽，是否願意為了救人涉險關門或成為要石？

  草太，關門師職責跟原本的人生哪邊比較重要？


  大臣，原本長年的責任與新生活的私心如何選擇？

  阿姨，自己的人生及孩子的人生如何平衡？


  母親，以椅子為象徵，襯托出單親家庭之下對鈴芽的母愛。

  瑠美媽媽桑：一樣襯托媽媽帶孩子的愛。


  世人，平凡的日子也值得珍惜，天災人禍難預料。

  受災戶，時間無法帶走所有傷痛，儘管悲痛但要相信更好的明天。


  地震的災區、各地的廢墟，以及受災戶的心都有一道鎖。

  當我們走出傷痛，可能就有能力伸手打開老舊的門，見到過去的自己。

  好好善待她，給予安慰扶持及鼓勵。

  兒時的椅子彷彿是過去好回憶的凝聚與寄託。

  椅子的不全代表災民身心的創傷。


  是不是原作大綱跟概念就是這些？

  但是有些關門的廢墟，並不是因為地震產生。


  而是缺少人居的意念，這樣的地方容易有後門。

  這塊世界觀就是輕描淡寫吧？


  鈴芽在多年前到過常世的原因，也可以具體呈現一段特殊體驗，

  可能畫面中有生命垂危的暗示？


  但問題來了，結局的爆點是神明早就知道會這樣？

  鈴芽過去的不幸，以及未來拯救世人都是必然的命運嗎？

  正因為在常世目睹了未來的自己，對草太的樣貌有印象。

  但是這部又用了現實的大震災，我有點不知道如何面對，

  現實的災害是必然，只能去面對命運迎向未來的說法。


  更何況正片演的是關門師阻止了大災害，那３１１跟關東大地震？

  對比災難的危險程度，關門師的處理方式像兒戲。

  看似頑皮的大臣還有無力的椅子又更像兒戲。

  可能不是「監督都想好了，只是不跟你說」

  而是「監督沒想那麼多」，觀眾也只能不多想。




  我在看的時候心情很複雜

  究竟是要沉重？還是被親情感動？

  還是代入戀愛心情？或是品味設定之奇？

  而且不免想起風起跟福音戰士


  作為對比，風起演出了100年前關東大地震的可怕及男女邂逅。

  光是畫面上的地震以及音效就很驚人。


  「福音戰士新劇場版Q」呈現了毀壞的都市與大地。

  「終」因劇情發展有了海嘯襲擊的畫面，

  一大段片長刻劃人類災後復興的努力。

  但又是人生無常，安全居所以外的地方都遭到汙染侵蝕。

  生命如此脆弱，但人有永不放棄的意志與希望。

  片中有母親孕育子女，甚至動物孕育生命的畫面。


  這份從天災走出來的希望，我覺得鈴芽的個人特質是有的。

  她不會只是眼看帥哥想搭訕及追愛的高中女生。

  只是片子有很多重點，變得沒有全部聚焦，或是有點矛盾。



  那鈴芽的聚焦是？

  畫面、情節編排已經綁死

  仔細想想把椅子跟草太綁定，

  又有要石轉移的秘密，這有點複雜。

  大臣則是跟鈴芽的養貓咪願望綁定。

  用意是把環阿姨跟鈴芽的關係帶出來。


  再來又是過去的鈴芽進過常世，

  現在的鈴芽終將原地重返常世。


  編劇設定「一定要」的東西太多。

  壓縮到鈴芽個人、鈴芽母親，也就是椅子跟故鄉的戲分。


  如果有關門師，那過去的大地震時

  要石跟關門師是怎麼失手的？沒有刻劃。

  鈴芽特質及動機描寫還不夠時，

  就執行鈴芽要替草太成為要石的情節。


  消除天災、拯救愛人、告別過去，

  全都要，但哪個才是重點呢？

  都可以是啊，但需要鈴芽完整的動機？


  --'
