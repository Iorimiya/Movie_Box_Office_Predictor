url: https://www.ptt.cc/bbs/movie/M.1681059741.A.3AB.html
title: '[好雷] 鈴芽之旅的我流賞析(有防雷)'
content: "因為之前都在電影板參考一些影評文章，\n這次剛好對於鈴芽之旅有一些個人心得，\n所以就整理在這邊，\n或許之後再轉錄到C洽。\n\n個人不是新海誠的忠實粉絲，只是剛好有看過幾部有名的作品，\n\
  這次的鈴芽之旅，因為其基於日本神道的部分相當對我胃口，\n加上個人會日文，所以我也參考了日本那邊的賞析跟新海誠的訪談，\n目前有個比較深刻的感想成形，\n這邊就分享給有興趣的板友們參考。\n\
  \n以下內容分為【無雷感想】、【含雷心得】。\n中間也有防雷頁避免雷到人，\n可以放心服用。\n\n那麼首先就從無雷感想開始吧：\n\n\n【無雷感想】\n\n\
  在新海誠的訪談中，他表示受到311大地震的衝擊後，他首先製作的是「你的名字」，\n接著，在「你名」上映後，為了回應觀眾們的各種意見與反饋，才製作了「天氣之子」，\n\
  而這部「鈴芽」則是在前兩作的進程與反饋上，自己再次交出的作品。\n\n以新海誠的話來說，這是與觀眾的「交換作業」，因此「鈴芽」的內容是基於前兩作而\n驅動製作的，是最初自己也沒料想到的作品。\n\
  因此，如果你是新海誠粉絲，當然是建議你可以進戲院看看這部新海誠在持續與觀眾對話\n下所生產的作品。\n\n若你不是新海誠的粉絲，這部作品是一場快節奏的公路電影式的大冒險故事，其中有笑有\n\
  淚，最終也有個完整的收尾，娛樂性是相當高的，推薦給想看場單純冒險故事動畫的你。\n\n雖然劇情略顯王道，並且戀愛部分的描寫較少，應該會讓想看傳統新海誠的愛情故事的觀\n\
  眾失望，但新海誠在此作中充分發揮了他對於自然景色的作畫功力，同時也成熟地運用了\n3D技術呈現了令人佩服的動作鏡頭，音樂更是與御用的RADWIMPS合作，以切題的民族風串\n\
  起了整個故事，並且，在情感豐富的場面中，RADWIMPS的音樂更是正常發揮，讓人可以自\n然地帶入劇中情感，整體而言，音樂跟作畫的部分令人相當印象深刻。\n\n\
  缺點方面，可能就是要素略為過多，導致節奏有些過於快速，許多背景設定被略過，\n\n並且部分內容貌似有些都合主義。\n\n但我認為，導演最終有完整闡述了他想闡述的東西，剩下的部分，或許就是特意留白給觀\n\
  眾思考並期待觀眾反饋的了。\n\n我雖然並不是新海誠的粉絲，但我看到了一個導演在創作賣座商業作品的同時，持續\n與觀眾及社會互動，並持續在作品中大膽地闡述個人思想，令人感到相當敬佩。\n\
  \n如果你是相當注重劇情呈現的邏輯性的人，或許會覺得無法解釋的地方有些多，可能讓你\n會覺得坐立難安或尷尬。\n但我覺得很多地方是可以解釋跟理解的，在下面的含雷心得中我會試著闡述個人的解讀。\n\
  \n那麼無雷感想的部分，就先到這邊。\n希望足夠給想參考的人參考。\n\n再往下就是含雷心得的部分了，不想被雷的可以左轉離開。\n以下先防個雷吧：\n\n\n\
  ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ 防雷分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\
  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n\n\n\n\n                   !!!!!!!!!!!這邊往下含雷喔，慎入!!!!!!!!!!!!!!!!!\n\n\n\
  \n\n\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n【含雷心得】\n\n個人認為，本作的主軸及意涵可以分為表中裏三個部分，因此以下依此架構進行分享。\n\n  《1. 表層意涵-鈴芽的贖罪大冒險》\n\n \
  \ 整段劇情的主軸就環繞在鈴芽的關門(すずめの戸締まり)，不過我認為，\n  鈴芽幫忙關門師草太的工作，並不是因為愛情或是正義使命，而是贖罪。\n\n  從劇情一開始鈴芽誤開門波溫泉遺跡的後門開始，鈴芽就一直覺得是自己的錯，\n\
  \  加上後面知道大臣是要石後，鈴芽應該是一直想嘗試修正自己的錯誤而奔走。\n  草太變要石後，實際上鈴芽也說了兩次自己代替成為要石，後面跟大臣說的時候，導演\n\
  \  也給了重點鏡頭，所以，鈴芽整部劇情中的奔走，與其解釋成為愛冒險，不如說是她\n  為了贖罪，為了修正自己的錯誤，恐怕比較貼切。\n\n  也因此，許多人覺得尷尬的「草太先生不在的世界比較可怕」這句話，或許也能有除了\n\
  \  愛情外的解讀。\n\n  看起來很多人會覺得愛情線有些生硬尷尬，有些硬要，實際上我首刷時，也是有點一樣\n  這樣覺得的。\n  當下想新海誠可能為了娛樂性，硬要湊戀愛感情線出來。\n\
  \n  但多看幾次後，我覺得鈴芽的動力並不一定像「天氣之子」一樣在愛情。\n\n  鈴芽作為16歲少女，她可能有些情竇初開，有親吻的可愛小舉動，但草太全程作為三角\n\
  \  椅子存在，這部要說是鈴芽草太的愛情大冒險，恐怕的確是有些腦補了。我想，整個旅\n  程最多只能說是鈴芽與草太的相識過程，而他們之間的愛情，必須「鈴芽的明天」之後\n\
  \  才會有開始。\n\n  所以，「草太先生不在的世界比較可怕」的這句話，我想是為了回應草太爺爺要鈴芽做\n  的，就是要她以把草太當作要石插入為傲，然後忘記一切的這個建議。\n\
  \n  但是如果她真的這樣做了，她就永遠沒有機會贖罪，她一輩子將作為闖了大禍，還把無\n  辜的草太當作要石插入蚯蚓的壞人。\n  這樣的世界，雖然沒有人因為地震死去，但她將一輩子承擔罪惡感，所以可怕，所以她\n\
  \  認為寧願犧牲自己作為要石承擔這一切。\n\n  畢竟，鈴芽在皇居地下從大臣口中也了解，大臣是為了鈴芽口中的「當我家的孩子吧」\n  才一直要與鈴芽獨處的，這個部分應該也加深了鈴芽的罪惡感，也加強了她一定要救草\n\
  \  太，修正這一切的想法。\n\n  最終，大臣因為當不了鈴芽的孩子，所以變回了要石，鈴芽也得以不用犧牲自己，但也\n  達到了親手修正自己錯誤的目的。讓整段大冒險劃下完美的句點。\n\
  \n  因此，與其要特別抓住曖昧的話語，去連結到自己也覺得尷尬的愛情情感，我想不如用\n  不同角度去詮釋角色的行為，或許能更合理地共情角色的想法。\n\n \
  \ 如果有看訪談，其實可以知道新海誠在創作中，是會讓角色自由成長發展的。有些台詞\n  並不是原本就寫在劇本中，而是混合了配樂製作者、聲優、其他人員對於角色的意見，\n\
  \  讓角色在製作階段中，因為大家覺得，她好像會這樣說，所以去增加台詞的。\n\n  例如千果的「我覺得妳好像在做很重要的事呢」的台詞，也是在角色詮釋的過程中新\n\
  \  加入的台詞。\n  因此，透過解析角色的行為與台詞，我們可以更深刻地了解劇組對於該角色的理解。\n\n  所以，我覺得一些以愛情來解釋的台詞如果覺得過於尷尬，那麼或許是最初解釋的角\n\
  \  度就有些錯誤。\n\n\n  《2. 中層意涵-天災的療癒與民族共感》\n\n  整部作品以輕鬆療癒的公路電影方式鋪陳，其中我想有個很大的目的，就是中和掉311地\n\
  \  震相關內容對於日本社會的衝擊。\n\n  實際上新海誠也說過，這次他特別用較為露骨的描寫，直接寫入了311大地震。並且，也\n\n  提到「讓誰都不受到刺激的電影，並無法撼動人心」，也因此我想新海誠需要用較有娛\n\
  \  樂性方式去調和原本的尖銳議題。\n\n  通常，日本的影視作品都會盡量避免直接提及現實中的相關災害，以避免刺激到受害人\n  們的心情。\n  所以新海誠這次用那麼直接的方式在作品中提及311，是相當有膽識的。\n\
  \  從訪談中看起來，他是有意識到這點的，所以原本他是相當擔心的，不過，最終這個作\n  品的迴響，看起來有如他所想做到的，成功地撼動到了不少人的心。\n\n\
  \  另外一點，新海誠有說公路電影這個方向是比較早就已經決定的了。\n  而這樣的縱貫全日本旅程的公路電影模式，除了適合新海誠對於311的想法之外，事實\n \
  \ 上也相當適合正要度過新冠疫情的日本現在。\n\n  從目前日本對於「鈴芽」的聖地巡禮的興盛程度，以及各個自治體開始了許多本片的聯\n  名活動，例如放個後門門框讓大家拍照之類的，這部作品實質上就在對新冠疫情下的日\n\
  \  本進行實質上的療癒，因此，我覺得導演是有意識到這點才決定公路電影的方向的。\n\n  至於共感這個方面，新海誠自己的女兒實際上跟鈴芽的歲數差不多。\n \
  \ 他自己有提到自己想留下有著豐富娛樂性的故事，以故事乘載史實，讓史實簡單地被轉\n  述下去，就像是古早的童話故事或是神話故事的性質一樣。\n  我想這就是近年幾作人稱災難三部曲的作品的本質。\n\
  \n  再者，他自己也知道，他的觀眾的年齡層都集中在比較年輕階層，或是青少年。因此或\n  許也有喚起年輕人針對腳下土地的共感的目的存在。\n\n  故事背景以日本神話及日本神道作為土壤的部分，我認為也是一樣的目的。在如今年輕\n\
  \  人逐漸不熟悉日本傳統的現代社會下，本作以「常世」、「祝詞」、「產土」、\n  「要石」等元素創作，實際上是向現代社會的年輕人提醒這些日本傳統文化的重量，讓\n\
  \  人們加深對於這些腳下「土壤」的共感。\n\n  日本媒體們在鈴芽上映熱賣後，不斷地在解釋其中出現的神道元素，我想這也是導演喜\n  聞樂見的結果吧。\n\n\
  \  在2011年的311震災以及2020年的疫情過後，我想新海誠以本作試圖讓現在的小孩子能夠\n  共感311這場10多年前的大災難，並且也以日本傳統神道為繩，以此串起大家的共同經驗\n\
  \  ，驅使生活西化的年輕人們能夠回頭感受傳統文化。\n\n\n  《3. 裏層意涵-結束與和解》\n\n  新海誠在訪談中有提到，這次不是一個關於展開的故事，而是一個關於結束的故事。\n\
  \  (開く物語ではなく閉じる物語)\n\n\n  就如同片中描述的，因為失去人心重量而使得後門敞開，蚯蚓竄出。這些土地被人們\n  借走開發後，因為種種因素荒廢，並沒有慎重地歸還給大地，而要關上被開啟的後門，\n\
  \  需要關門師觀想過去在後門土地上的人們的生活，讓門鎖現形，再以祝詞(神道於禱告時\n  吟唱的咒語)將土地好好地歸還給神靈。\n\n  這本身就是一種向神靈與自然和解的過程。\n\
  \n  新海誠有舉例我們常常在不知道怎麼好好關上門的狀況下，又去開了一扇門，這樣是不\n  負責任的。\n  若是套用在本作劇情裡解釋，關門師草太是幫人們關上沒關好的門，而整部「鈴芽」其\n\
  \  實也是草太在協助鈴芽關上自己沒有關好的門。\n\n  鈴芽在小的時候因為找不到媽媽，誤闖常世遇到「鈴芽的明天」給予三腳椅子，但恐怕\n  是因為太過思念媽媽，最終把「明天」說的話都忘了，只記得自己遇到媽媽給了椅子。\n\
  \n  那張椅子在剛交給鈴芽的時候，她說要一輩子珍惜，但實際上，在她與大臣墜落到皇居\n  下方時，她問了自己「我珍惜著它到何時為止呢?」，因為在草太剛踏入鈴芽房間時，\n\
  \  椅子是被隨手放在旁邊的，這可以看出來，16歲的鈴芽其實已經不那麼珍惜椅子了。儘\n  管它是媽媽的遺物，但實際上，她要的不是椅子，而是媽媽。\n\n  不過，在整部劇的旅程下來，她明白了自己其實都擁有該擁有的了，所以她要昨天的\n\
  \n  自己相信明天會到來，一定沒問題。這段話看似說服得很生硬，但與其這是要說服昨\n  天的自己，不如說是代表著鈴芽對自己內心執著的和解，因為小時候一直以為遇見的\n\
  \  媽媽，其實就是自己。拿到椅子並不是和媽媽見到面，而是和自己見到了面。媽媽早就\n  離開，而自己也該好好放下了。\n\n  在與昨天的自己談話後，鈴芽與草太從門裡出來，鈴芽鎖上門時說的是「我出發了」，\n\
  \  我認為這是代表她已經好好處理完自己至今的內心遺憾，她可以前往下個旅程的意思。\n\n  而那張三腳椅子，則交接給過去的自己，由過去的自己再次展開旅程，再傳承回自己。\n\
  \  因此，我想那張椅子或許也象徵著鈴芽對於失去母親遺憾的執著。\n\n  明天的鈴芽知道昨天的自己在當下不可能理解或是接受自己的任何話語，所以拿出椅子\n \
  \ 讓昨天的自己繼續擁抱遺憾，並且告訴她傷心沒有關係，但要相信明天終會到來，\n　「きっと大丈夫」，等到時機成熟，自己最終會與遺憾和解，並且邁向新旅程。\n\n\
  \  而這「相信未來」的論述，在新海誠的作品裡也並不是太陌生的話語了。\n  這或許也是導演在幾部作品中自己最赤裸與真誠的陳述。\n  也是想傳達給所有人的話。\n\
  \n\n\n-------------------------------------結---------------------------------------\n\
  \n一個不小心打了太多太久，\n其實原本我主要想針對一些網路上可以看到的疑問的部分，寫寫自己的想法，\n例如大臣和左大臣是甚麼?、環阿姨為什麼被附身?、大臣到底在想甚麼?、為什麼是三隻\n\
  腳的椅子?\n等等......\n\n不過因為感想的部分就意外地說了有點多，\n花費了意外多的時間，\n所以其他部分，或許就等之後有時間再另外開一篇文討論了。\n\
  \n整體而言，我覺得鈴芽之旅是值得細細品味的作品，\n如果此作本身就對你的胃口，不如可以多發想或思考其中意涵，也是別有一番樂趣。\n\n目前鈴芽之旅還持續上映中，\n\
  如果想重看或是沒看過想看的朋友，\n或許可以把握機會，\n畢竟大螢幕的時間，過了這村就沒這店了。\n\n\n祝福各位觀影愉快。\n-nightstory\n\n\
  --"
