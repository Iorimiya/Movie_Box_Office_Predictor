url: https://www.ptt.cc/bbs/movie/M.1678123479.A.05E.html
title: 'Re: [微負雷] 鈴芽之旅，新海誠不告訴你呦~~'
content: '防雷


  我個人是一個看電影時很討厭看到任何敘述性文字的人

  解釋設定跟過度說明現況的都討厭到不行的那種

  看完後用任何東西補完設定的那種也不太喜歡

  我希望一部電影就改用一部電影把該演完的東西演完

  所以就某方面來說我應該是你的相反類型

  除非真的很詭異

  不然我是支持電影該適當的省略部分過程跟說明、解釋的人

  所以我自己看鈴芽是還看的挺開心的

  下面有些問題我試試看能不能幫你解惑


  其實這一段我個人覺得算是最好理解的

  鈴芽把大臣拔起來了

  重獲自由的大臣在門關起來跑到了鈴芽家

  被鈴芽說希望成為他家的貓後

  因為很開心

  所以不想回去當要石了

  就把神力給草太

  至於為什麼是椅子這我就不知道了

  總的來說就是現場只有三個人（？

  大臣喜歡鈴芽

  所以就把責任丟給了倒楣在現場的草太



  而恢復人身的關鍵我想應該就只是大臣把神力收回了

  草太剛代替大臣插下去後

  爺爺有說過

  他接下來會逐漸跟神力融合

  代表草太還不是完全體

  在東京終於把草太插下去後

  大臣很高興終於有人代替他了

  卻發現鈴芽比較重視草太

  於是他為了讓鈴芽開心就跟著鈴芽

  再回到常世後把神力收回

  自己繼續當要石了



  我自己的理解

  會出現門的地方需要本來有人曾經生活過但現在杳無人煙這個條件

  因此小規模的廢墟或許不會出現

  要在一定層度規模的廢墟中無意間被人拔起一顆在地上的樁

  本身發生率就很低

  再加上如果不把要石拔起來就不會有蚯蚓跑出來的設定

  過去這種發生率很低的事應該也發生過好幾次

  所以要石的位置才會換過好幾

  結論就是被人拔起來本來就是發生率很低的事

  發生了就只能想辦法擦屁股



  就劇中的表現

  很明顯只要插進去就可以了

  只是平常都是跑出來了才插進去

  而這次是有個進過常世的人

  想再次進去才會在裡面插



  因為從一開始就不可能留在鈴芽身邊

  草太會從中妨礙

  因為他也只想把大臣插回去

  實際上在神戶草太不在時

  大臣有自己接近過鈴芽

  我自己的理解這個時間點

  大臣應該還在想

  【我不都說責任已經交給你了，你怎麼還不把自己插下去】



  這對我也看不懂

  我本來還以為左大臣是來當反派或抓大臣的



  我想問題是普通人看不到常世也看不到蚯蚓

  而且他負責的位置已經有人插下去了

  在沒有人幫助的情況下

  等到下次蚯蚓出來再把自己插下去

  門就關不起來了

  跟著鈴芽進到常世直接插可能比較快



  這部分在這次的電影中描寫真的不太夠

  明明每個人都很有描寫的空間

  卻都不夠繼續深挖

  非要靠其他方式補完或是自己腦補如果可以少一兩位

  然後描寫的更深入就好了




  這部分我個人會理解成是電影或戲劇的原罪

  大部分的作品都會有這種狀況

  真心覺得不要深究



  想了很久要怎麼回覆之後

  我覺得這就像是在計較為什麼主角是主角

  為什麼只有小智看到鳳王這種感覺

  不過照爺爺那樣說

  實際上過去就有過人誤闖常世的狀況

  只是次數爺爺沒講我們也不得而知





  我覺得這要看你怎麼理解這部片了

  我自己看到中後段後才發現這大概是一部在描寫311的故事

  鈴芽對爺爺說的【生死不過就是運氣】

  描寫出了部分生者對於自己的存活並沒有喜悅

  更多的是對於死者的愧疚

  還有走不出震災的心傷

  當然我們可以死去的媽媽出來見鈴芽

  讓鈴芽走出這個坎

  但這邊讓大鈴芽來安撫小鈴芽

  或許是想傳達一種訊息

  能讓自己振作起來的只有自己

  過去的傷痛依然在那

  但我們可以告訴過去的自己

  自己現在已經在好好的過日子了

  未來並不全是痛苦的事

  不要勉強自己放下，也不要勉強自己忘掉

  用更好的自己去面對當年的自己

  來讓自己走出這個傷痛


  希望有回答到你的一些問題


  --

  雖然我看完了

  但是我很認真的覺得

  直接回文比較好

  因為打在推文並沒有這麼好閱讀'
