title: '[普雷] 鈴芽之旅'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  推薦的點：

  畫面一貫華麗好看，故事背景從九州宮崎，一路向北愛媛/神戶/東京/宮城等地。


  有點像公路電影，難怪中譯要這樣翻。


  地震災難的表達手法有震撼力，一副山雨欲來風滿樓的感覺。


  有貓就給讚。


  歌好聽，但前奏真的很像風之谷...


  劇情的話平鋪直述，叛逆期少女公路旅行到處關門阻止災難。


  個人認為的缺點：

  設定上有些不明地方。


  是現代日本社會太冷漠嗎？17歲少女獨自離家沒人要報警介入？

  在東京街頭衣服破爛/沒穿鞋一路上都沒有警察或站務員關心？


  為什麼女主小時候可以到常界？

  安排女主跟過去小時候的自己見面這段有什麼意義嗎？

  要石怎麼都偏好喜歡女主？

  看前面以為椅子只有三隻腳會有什麼涵義，好像也沒有...


  女主顯得太花痴了，男方沒什麼表現出喜歡她的感覺。


  環阿姨爆氣那邊還以為要跟著另一個要石黑化了，也是雷聲大雨點小。


  整部片看完沒什麼記憶點，就是畫面漂亮，歌好聽。

  可能有經歷過311的人比較有感觸吧。


  --'
