url: https://www.ptt.cc/bbs/movie/M.1678030329.A.4DF.html
title: '[好雷] 鈴芽之旅—每個人都值得好好活下去'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n去嘗試了好評很多的桃園新光，開頭的杜比介紹影片相當有感\n\
  音效與影音效果都很優秀，而且不會像台北那幾間一樣太多人\n\n不過這次不算是誠哥背景最火力全開的一部\n如果前兩部哪天有重映的話會想再去體驗看看\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n先把時間線往後拉一點\n會覺得 鈴芽整趟旅途過得太順遂嗎?\n\
  一路上有著貴人相助 在乎自己的阿姨一路跟了過來 芹澤義氣相挺載了整個後半段\n\n\n\n心裡頭那個4歲的女孩 對於母親不在的疑問 不曾停歇\n\n隨著草太一路前往東京可以說是必然\
  \ 作為母親遺物的椅子離去 因為自己而導致草太被詛咒\n的負責 當然還有因為愛(X\n但如此的義無反顧還是令人驚訝的 究竟是什麼讓鈴芽願意冒著危險關門\n甚至自願犧牲變成要石?\n\
  \n「生死不過是運氣」\n\n\n\n「覺得在做一件重要的事情」\n協助關門的工作 正是前面提到 避免他人遭遇不幸的事情\n後續草太變成石頭 面對無奈的選擇\n\
  也不可能學帆高一樣 地震什麼的隨他去吧\n\n「不能接受的是沒有草太的世界」\n不能接受的 是因為自己而讓草太遭遇到失去生命的不幸\n這些才是我認為鈴芽行動的原動力\n\
  \n回到一個重要的問題 這段旅程鈴芽要成長什麼? 欠缺什麼?\n我覺得答案是缺乏對「自己」的關注\n\n有在其他篇文章看到我很認同的推文 部分內容大概如下\n\
  如果真的讓鈴芽變成要石 難道草太就會接受?  鈴芽沒有考慮到其他人對自己的感受 而且\n兩隻貓也不會願意這樣的結果\n\n的確 故事也是這樣子演的 大臣後來回去當石頭了\n\
  更不用提還有前面那些幫助鈴芽的人的好意 扶養她長大的阿姨\n這些都不應該是可以隨意捨棄的\n\n最後的最後 在身體逐漸結冰的情況下\n說出不想死去的鈴芽 才是完成了自己的轉變\n\
  不只是想著為別人 也要為了自己—\n\n世界上還有很多對你好的人\n身邊的人都值得被珍惜\n每個人都值得好好活下去\n\n--\n\n\n\n        \
