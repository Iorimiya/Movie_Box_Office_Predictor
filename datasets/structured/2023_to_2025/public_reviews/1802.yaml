url: https://www.ptt.cc/bbs/movie/M.1677689829.A.031.html
title: 'Re: [好雷] 鈴芽之旅-雖然推薦但能處理的事情'
content: '從草太爺爺遇到左大臣的對話

  我個人的感受是要石本來應該都是人變的

  左大臣應該可能當年是草太的爺爺的親人或是朋友之類的

  這也應該能解釋爺爺聽到草太成為要石並沒有特別訝異

  只是感嘆而已


  這一點跟天氣之子的概念也是近似的

  新海誠這三部長片的共通點，就是總是會有人為了大局而被犧牲

  然後主角永遠都是為了愛要去拯救那個被犧牲的對象


  我自己感覺就是大臣被拔出來之後又被問了要不要來我家的時候很開心

  覺得有人在乎自己了，但是後來發現鈴芽為了草太竟然寧可犧牲自己時

  這已經違背了牠的初衷了，因為他的願望是跟鈴芽在一起生活

  這也是後來大臣會願意幫鈴芽的原因


  不過我個人也覺得這是這一次新海誠的作品比天氣之子天真的原因

  上一次主角為了愛寧可讓東京被淹水其實是個很酷的描繪

  鈴芽之旅最後讓大臣自我犧牲其實相對的比較弱

  我想這也是新海誠讓大臣在全片一直不斷賣萌的主因

  前面你不覺得這隻貓真可愛，最後他的犧牲就沒有重量了


  --


  男人是一種很悲哀又很容易控制的動物，因為他們往往拼了命的取悅異性，或是從各種媒

  介取得任何可以引起性幻想的事物，甚至還因而犯下強姦或是偷窺等大小不一的罪，但是

  追根究柢，目的卻只是想要從自己的身上擠出那麼5C.C的液體而已。

  粉絲團



  --'
