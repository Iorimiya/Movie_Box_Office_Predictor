url: https://www.ptt.cc/bbs/movie/M.1678094250.A.675.html
title: '[新聞] 《鈴芽之旅》熱賣7千萬奪票房冠軍'
content: '《鈴芽之旅》熱賣7千萬奪票房冠軍 民間自費造「關鍵白門」吸粉朝聖


  文/王怡文


  《你的名字。》導演新海誠新作《鈴芽之旅》上週正式在台上映，累積票房突破新台幣7,

  000萬元，空降全台票房冠軍。《鈴芽之旅》以311大地震為背景的故事內容，也受日本文

  化廳認可，讓新海誠獲「藝術選獎文部科學大臣賞」，近日片中出現的景點，更出現了鈴

  芽關的門，吸引大批粉絲朝聖。


  《鈴芽之旅》在日本票房吸金140億日圓（新台幣約33億元），即將超新海誠前作《天氣

  之子》，擠進日本影史票房第14名。台灣票房不俗，228連假推出口碑場後，上週正式上

  映，至昨天票房已突破7,000萬，有機會挑戰新海誠《天氣之子》（1億6,861萬元）、《

  你的名字。》（2億5,020萬元）在台的成績。


  日本文化廳上週公佈「藝術選獎」名單，新海誠以《鈴芽之旅》獲得媒體藝術類別文部科

  學大臣賞，去年獲奧斯卡最佳國際電影的《在車上》濱口竜介導演也曾獲該獎。延續《你

  的名字。》《天氣之子》以隕石、水災等災害作為題材，《鈴芽之旅》則用311東日本大

  地震發想，描繪女主角鈴芽在經歷多次的地震過程中，有了新的邂逅並慢慢成長的故事。


  文化廳說明，除了作品的規模和戲劇性的故事展開外，《鈴芽之旅》帶領觀眾走訪宮崎、

  愛媛、神戸、東京，最終來到了東北，「作品中可見到日本地方之美，以及對逝去時代的

  憐憫之心，一名女高中生為找回重要的人而反抗，卻更深刻地感受到大自然的浩大與無情

  。《鈴芽之旅》以日本神話與傳承為底蘊的世界觀為基礎，透過動畫描繪出『壯闊的史詩

  』，是獨一無二的。」


  《鈴芽之旅》的好成績也吸引許多觀眾跟著電影走訪景點，最近岩手縣的山田灣展望廣場

  索性打造一扇與電影相同的門，方便粉絲們踩點拍照。當地觀光協會透露：「去年11月電

  影上映後，連續超過3個月都有人來訪，希望為大家留下美好的回憶，也希望藉此機會讓

  大家認識我們這裡。」


  當地觀光協會委託64歲建材店的老闆製作，完成了《鈴芽之旅》關鍵的一扇門；此外，宮

  古市也出現了同一扇門，《每日新聞》報導指出，該扇門主要也是民間人士希望能解此帶

  動觀光人潮而贈送，但並未供開真實身分，只知道土地所有人也非常積極協助了門的設置

  。《鈴芽之旅》4DX、IMAX、Dolby Cinema各版本在台熱映中。




  --'
