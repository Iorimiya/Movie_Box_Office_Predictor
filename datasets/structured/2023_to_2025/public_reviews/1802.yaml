url: https://www.ptt.cc/bbs/movie/M.1707795778.A.F98.html
title: '[討論] 《鈴芽之旅》過不去的點'
content: '防雷頁


  內有《鈴芽之旅》、《天氣之子》雷











  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  過年期間補完《鈴芽之旅》

  身處地震帶的台灣 雖然921僅是幼時模糊的記憶

  仍能對共感新海誠透過關門師、門裡的常世…

  想傳達的震災的撫慰、救贖、對生命的珍惜、「如果可以預測或阻止地震發生那就好了」

  的希望

  但在觀影過程中 一直揮之不去一種心裡怪怪的感覺


  電影中關門師的職責是關上各地的後門 阻止蚯蚓竄出印發大地震

  那麼如果關門師都有確實把門關上 世界就不會發生地震了嗎？

  那鈴芽小時候經歷的311 也是因為關門師沒有成功關上門才發生的嗎？

  就像電影中的那句「生死都是運氣」

  地震本就是天災 發生與否都是自然法則

  不是很喜歡這種天災可以以人為力量阻止的設定

  這讓我一直無法真正沈浸在整部電影的感動中


  順帶一提 我個人是蠻喜歡《天氣之子》中為了所愛放棄世界的浪漫

  甚至鈴芽在東京要將草太椅子插入蚯蚓時

  也一瞬間閃過會不會走上相同套路的念頭

  （當然天氣的背景和堆疊在這部並不適用啦）

  畢竟回到現實 憑什麼要一個人為了拯救全世界犧牲自己？

  如果沒有關門師的出現 日本本就會發生地震

  （就像就算沒有晴女 東京也還是會被淹沒）

  就是因為生命無常、因為天災無法被預測或改變

  我們才更能夠珍惜並把握所能擁有的每一刻


  --'
