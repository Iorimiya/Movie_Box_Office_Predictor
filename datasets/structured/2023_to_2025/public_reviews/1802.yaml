url: https://www.ptt.cc/bbs/movie/M.1716927567.A.F9F.html
title: '[好雷] 鈴芽之旅二刷觀後感（極長文）'
content: '4/3花蓮地震後當夜，

  我在MOD重看《鈴芽之旅》的導演特別版，

  （主要差在後段有蠻多張彩圖原畫）

  去年則是在3/11當天和男友看的。

  基本上我不太二刷電影，

  除了小時候沒看完整或還看不懂的情況，

  才會在長大後補看。


  一直以來頂多在限時稍微分享心得，

  很少認真發一篇文專寫一部電影的觀後感，

  但我自己是觀影後會去爬影評的人啦，

  這次被《鈴芽之旅》打破紀錄呢XD


  鼓起勇氣第一次在電影板分享心得感想

  會有一些和主流影評不同的切入點

  更多的是套用至自身心靈的角度

  請大家多多指教啦～文很長也請見諒哦！

  （也會有較閒聊的部分希望鞭小力點plz）


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  「鎮住土地的是人心的重量。」

  —《鈴芽之旅》


  如果蚯蚓源自於地底能量的失衡，

  究竟該累積多少與醞釀多久多久，

  才會以一次巨大破壞的型態反撲？

  短短幾秒到幾分鐘的天搖地動

  可能會在一瞬間破壞掉的多年建設與心血

  甚至造成一整個世代集體的創傷記憶


  「在人心消失的寂寥之地，後門將會開啟。」

  電影裡是這麼說的

  廢墟可能蘊藏著致命的能量

  然而每個荒蕪之地過去皆曾繁盛

  校門、遊樂園門口乃至家門

  承載著許多歡聲笑語和招呼問候

  早安、明天見、歡迎光臨、謝謝惠顧

  從我出門了到我回來了

  有時意外就在這段期間當中發生


  我想人的心靈也是這樣吧

  或許在從某個昨天開始

  到這個今天再到哪個明天的過程裡

  也是可能會有突然陷落自溺的時刻

  失衡的、崩毀的都是希望你去注意到它

  注意到你所擁有的萬般珍貴是如此美好

  而難免的陰暗醜惡卑劣其實相當正常

  勇於正視自己的深淵方能正當能量釋放

  -


  「誠惶誠恐呼喚日不見神、先祖之產土神。

  領受已久之山河，誠惶誠恐，謹此

  奉還於爾！」


  這是關門師封印蚯蚓時

  向神明、祖先、自然呼告的咒語

  敬畏、誠懇地感恩戴德

  對於「領受已久」的「恩賜」是該「奉還」

  當你對一切所有take for granted

  早晚就得take a heavy toll

  反之不應由你承擔的苦果亦不必勉強吞下

  別人的課題就還給別人處理


  關門的程序是這樣的

  仔細聆聽並回想起這片土地上的聲音、

  插入鑰匙、朗誦咒語、轉動門把並上鎖

  蚯蚓就會回到它原來的所在地—常世

  （與人世相對、死後才會去的地方）


  讓我們也來嘗試練習看看吧

  記得想著自己的幸福（自己才是最優先考量）

  插入正確的鑰匙（採取適當的方式）

  以專屬於你的咒語（請相信意念的力量）

  用力去關上那道風暴似的沉甸甸大門

  關上門的瞬間世界會暫時靜止片刻

  當你隔絕了外在的惡意

  以及將你拉至常世的毀滅性念頭

  全心專注於現世——也就是當下

  就能沉浸在每個深層的呼吸與吐納

  並自得其樂、享受其中

  （我想這大概即為所謂的心流）


  關門不是一件易事

  電影裡每次關門我都看得膽戰心驚

  這部片不只核心的故事及概念發人深省

  技術層面上的音樂、美術亦是上乘

  情緒渲染的部分更讓我高度共情

  將地震的危急緊張呈現出末日般的災難感

  緊密的親情和飽滿的人間溫情皆令人感動

  除此之外還有公路電影般的迷人與暢快

  並附帶少許的戀愛元素（這倒不是主要看點）


  至於強調女性配角們互助的人性光輝

  以及女主角的堅毅勇敢

  則與《魔法公主》相似

  鈴芽不僅可以和草太並肩同行

  甚至還能反過來去拯救他呢！

  （有看到影評提及以往常見的巫女角色

  這部電影則是由草太擔任）


  當然最重要的仍是治癒311災民的部分

  在那場地震裡鈴芽失去母親、草太的爺爺失去右臂

  就連鈴芽母親親手製作送給女兒的椅子都缺了一隻腳

  倖存的生者該如何面對至親的逝去

  並釋懷那永遠難以平復的缺憾

  鈴芽塗黑的日記本宣告著她多想抹滅掉那一天

  太多我們不想再經歷乃至想重新來過的時刻了

  當面臨摯愛的生離死別時

  曾緊握的手會鬆開

  緊閉的心房也需要打開、心結更要解開

  長大的鈴芽回到過去安慰當年無助徬徨的自己

  或許這就是療癒受傷的內在小孩、與自己和解吧

  願所有人都能透過和自我對話去尋得內心的平靜

  -


  二刷讓我淚崩之處反而是大臣的段落

  而當被左大臣操控的阿姨

  大聲吼出不為人知的黑暗與辛酸

  亦讓我驚恐得心有戚戚焉

  是啊我們並沒有先要求誰來對我們好

  反之我們對別人好一開始也是主動且自願的

  關係與羈絆的建立總是冒著流淚的風險

  我想世上大概沒有完全平整無暇的愛

  無論什麼形式的情感難免都帶點荊棘與傷痛

  難以強求彼此內心毫無半點怨懟、悔恨

  只求雙方快樂的時光總是大多數的就好了


  所以我們即便哭得皺巴巴的也要相擁呀

  將那些滑稽而無傷大雅的齟齬和衝突熨燙、收納

  （阿姨和鈴芽之間原本總有點隱忍般地禮貌式疏離

  雖然都是關愛對方的但太客氣了好似充滿隔閡

  爭吵過後才真正靠近彼此心房、更了解對方的感受）

  所謂愛人是如此赤裸且危險卻也值得

  做好自我保護和心理建設

  就可以無畏地展開笑顏、張開雙臂


  大臣或許也像我們想擺爛時的偷懶惰性吧

  努力賣命太久就只想不管不顧地任性跑跳

  待在輕鬆的、讓我們著迷的人事物身邊多好？

  人性如此而縱是神明亦曾為人身

  祂可以是一時迷戀

  也可以是逃避雖可恥但有用

  但最終仍得屈服於我們真正選擇追求的目標

  乖乖投降回工作崗位、繼續勤懇地履行職責

  既為「要石」可見其身肩重任


  為了不要再有人因為地震喪生、為了草太

  在天秤上權衡出來的結果

  大臣註定當不成鈴芽的貓啊（爆哭

  若熱愛的心之所向是正軌

  那歧路不得已只好犧牲

  當然這並不代表閒逛就是十惡不赦

  漫漫長路偶爾是該允許倦怠與迷途

  畢竟旅程總是美的

  休息片刻自是愉悅快樂

  生命本無需受限

  只是何時該做什麼事的大方向需謹慎思慮清楚

  人壽終有時別太過蹉跎浪費以致走偏甚至荒廢


  在自我實現的過程勢必得有不少取捨和遺憾

  不過所有經歷並非毫無意義

  點點滴滴的養分必定使你成長為更好的自己

  至少歡喜過、觸碰過、錯誤過、學習過

  即使羞恥難堪、忿恨不滿、愧疚無比、

  痛哭流涕甚至渾身疤痕與陰影都沒關係

  收獲不分得到或失去、堅持或放棄

  惦記著所懷念的過往在心

  將目光望向未來並勇敢地大步前行

  -


  「在你心中的紅線與藍線

  連結兩者的正是你的心臟

  以不輸強風的聲音

  欲傳遞的話語正在孕育著


  時間為枕木，風為柔膚

  星辰為產地，人為蚍蜉」


  主題曲不僅旋律動聽、歌聲動人

  歌詞更是優美至極

  十分佩服野田洋次郎的創作

  把動、靜脈比喻成紅線與藍線太有才情了

  最近也聽了不少RADWIMPS的歌（包含電影配樂）

  目前最愛的是《Dreamer’s High》

  實在令我欲罷不能


  在長成一棵參天巨木所需的一生時間裡

  我們時時感受著徐徐微風的溫柔膚觸

  那可能是親人的照拂、友人的陪伴

  以及愛人溫暖的擁抱

  若我們都來自也終將回歸天上成為一顆星

  如此閃耀卻又如蚍蜉般渺小

  願我們珍惜一切相遇的意義

  -


  好的以上感謝大家看完我落落長的初次貼文影評

  921時我還太小只知道我媽說抱我躲在梳妝臺底下

  而這部電影所提及的311東日本大地震

  只知道在那之後LINE就流行起來

  （為了讓親友知道你還活著能「已讀」訊息）

  以及臺灣積極參與援助賑災

  （沒想到日本十年後在疫情期間回贈了大批AZ疫苗）


  直到2016年0206地震維冠大樓倒塌時

  我在朋友的邀（打）請（賭）下

  （模擬考輸的捐錢對沒錯我輸了）

  捐了人生第一次款（高中生的100元）給臺南市政府

  結果之後居然還有收到賴清德寄的感謝信來家裡呢

  雖然只是個署名但那麼小的金額能收到回信實在感動


  至於我人生第一部看的地震電影

  是中學老師放的《唐山大地震》

  國、高中各一次但我始終沒有看完

  年紀還小不太敢看如此紀實的災難片

  之後萬一還有大地震的話再來補

  （但還是先不要吧呸呸呸別亂說話）


  接著就到今年的0403驚天一震

  根本就是我有記憶以來最大的地震

  在這之後較大的餘震都會打開地震直播

  甚至在凌晨二點多跟到18萬人同時在線呢

  那陣子我都訝異於自己對地震的敏銳程度

  （雖然震度超過四級收到國家警報的餘震只有一次）


  最後就願地震和所有負面能量平時就能夠逐次釋放

  而非直到不可承受之重時才以毀天滅地的姿態爆發

  也希望政府當局經過此次自然清洗的天擇式力量後

  去淘汰早已不適合居住的危樓並注重補強建築建構

  相關法規亦必須重新審視調整且嚴格執行檢查稽核

  多管齊下方可將未來的災害風險減到最低

  防患未然遠勝於亡羊補牢


  我們自己更需具備足夠的防災意識和應變能力

  不要輕忽任何細節免得釀成大禍

  （論我們社區大樓因為施工而遮擋住的逃生門）

  同時也要練習遇事冷靜處理

  不必無謂驚慌甚至散播焦慮

  適時抒發情緒以及定期做心靈上的斷捨離與大掃除

  並不要忘記每個看似微不足道實則寶貴萬分的日常

  所有「一切如昔」皆該珍視與感激

  就讓我們每天都用比前一天更健康的心態

  用心地度過獨一無二的每日、每時、每分、每秒吧

  -


  在此再次感謝各位閱讀～

  也歡迎大家推文討論哦！

  -----

  Sent from JPTT on my iPhone


  --'
