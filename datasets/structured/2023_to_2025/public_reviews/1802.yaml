url: https://www.ptt.cc/bbs/movie/M.1677776334.A.301.html
title: '[好無雷] 《鈴芽之旅》玩轉世界瘋很大'
content: '《鈴芽之旅》玩轉世界瘋很大 8/10分


  先說重點

  畫面一樣很美 甚至更美

  是那種在大銀幕看到會倒吸一口氣的壯闊之美

  真的是一種享受


  這次也多了很多運鏡

  拉近/拉遠/橫移的這些鏡頭設計

  大大增強了畫面的張力

  非常過癮

  而且這些運鏡

  在動畫上製作起來是非常麻煩且耗時間的

  只能說製作上是誠意滿滿


  另一點是音效、配樂

  比起《你的名字》跟《天氣之子》

  怎麼覺得更加細緻磅礡？！

  好幾次都因為畫面/音效/配樂的搭配之下起雞皮疙瘩

  更顯得《鈴芽之旅》在戲院觀看的體驗實在太好


  唯一較為普通的就是劇情方面

  一開始細節滿滿、直接明瞭，很快的進入狀況

  但到中期突然開始疲乏無力

  雖然一些支線鋪陳跟配角們

  讓這段尷尬期仍算是有趣

  不過依然會感覺到劇情沒什麼太大的進展

  相較於前段的各種驚喜

  中期的劇情安排是較為可惜

  直接變成旅遊節目《玩轉世界瘋很大》四處跑


  再加上此片的故事設定在交代上也不是那麼清楚

  在某些轉折出現時當下會覺得

  「咦？為什麼？」

  有些後來會解釋 有些可能沒有說太明

  又或許是我沒領會到

  但或多或少會像無頭蒼蠅一樣

  被故事強制拉著跑的感覺


  導演也有提到

  故事有融入了311日本大地震的一些元素

  雖然遠在台灣 但在觀看的當下

  依然能被導演想要傳達的理念感動到

  如果是日本人 想必更能感同身受吧


  總之

  劇情不差 但不到精彩 (不過概念很有意思)

  畫面/音效/配樂超讚

  還是很值得進戲院一探究竟

  畢竟新海誠的風格其他人也模仿不來

  只能說是 看一部少一部啊！



  --


  無雷 電影/影集短評IG：




  --


  4DX都隔靴搔癢而已吧

  （看完獨行俠4DX後不打算再看任何4DX)



  你再想一下'
