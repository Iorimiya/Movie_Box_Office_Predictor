url: https://www.ptt.cc/bbs/movie/M.1677858861.A.DFA.html
title: '[大負雷] 令人失望的鈴芽之旅'
content: "防雷區\n\n我個人是非常喜歡前一部天氣之子的（imax兩刷、數位兩刷，總共四刷）\n如果你很喜歡鈴芽之旅\n我建議不要往下看以免影響你的好心情\n\
  但如果那樣的你還是不小心看完我的負面感想\n甚至冒出念頭來反駁我\n請不留情面的講出自己的看法\n因為身為一個新海誠的粉絲\n我也很想喜歡這部電影\n希望你的反駁足以讓我改觀\n\
  \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文\
  \ 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n以下是我認為這部電影的主要的大缺點：\n\n1. \n整部電影主要分成上下兩段（上段：尋找白貓；下段：尋找男主）\n\
  主要描寫男女主互動的地方只有上半段\n\n或對彼此內心有更進一步認識\n編劇為了讓鈴芽體驗到“旅程”\n壓縮女男主互動的情節\n到結束為止\n我甚至認為他們連“熟識”都不算\n\
  由於缺乏情感堆疊\n導致難以共感\n讓女主為男主赴湯蹈火的決心顯得非常牽強\n\n\n2. \n：\n因為311大地震失去母親\n從此看淡生死\n但編劇對於這段過去並沒有很深入的描寫\n\
  與母親相處的畫面不多\n也許是顧及災民的感受\n並沒有描寫大地震發生時的場景\n還有她經歷大地震之後的心靈創傷\n由於編劇對這段著墨的並不多\n可說是白白浪費了這些原本能感動人心的設定\n\
  我對鈴芽的印象大多數還是\"\"\n除了愛上草太以外\n我並不認為她在旅程中有獲得其它的事物\n\n：\n看不出來他喜歡上鈴芽的原因（女主是因為草太是帥哥）\n\
  \n除了每次關門會喊那段很中二的台詞以外完全沒有記憶點\n\n：\n編劇貌似想傳達“神明是很任性的”這個概念\n安排祂四處惹事\n\n貌似只是因為鈴芽誇祂可愛就喜歡鈴芽\n\
  那為什麼祂不喜歡那些其它因為也覺得祂可愛\n而把祂的照片傳上推特的人類呢？\n\n唯二“相對”有趣的配角是男主友人和阿姨\n有看出友人有些傲嬌和對男主十分關心\n\
  還有阿姨對鈴芽有“甜蜜負擔”般的那樣複雜的感情\n\n\n3. \n\n這邊質疑的並不是找草太或是找大臣那樣的表面意義\n一部有內容的電影\n讓主角踏上旅程\n\
  往往是要使得主角在旅途中有所成長或是修補內心的空缺\n但這部電影居然還真的讓主角順順的旅行下去\n鈴芽在旅程中並沒有體悟到任何事物\n\n旅行前後除了交到男朋友外\n\
  心靈上幾乎沒有任何昇華\n\nPS:\n你可能也許想要反駁\n她不是和阿姨和解了嗎？\n算是變成熟了吧\n但她跟阿姨的問題是突然爆出\n事前並沒有鋪陳\n這段劇情就顯得很不流暢且牽強\n\
  \n\n4. \n\n走向很好猜\n勉強要說的話大概是草太變成要石吧\n\n\n5. \n\n御用的radwimps也只有片尾曲一首\n但我承認音樂這件事非常主觀\n\
  \n\n6. \n看得出來編劇是想點出\n\n最重要的地震元素也是\n對於殘酷與無常的描寫嚴重不足\n我想不是像我們一樣生活在地震帶的國家\n應該無法透過這部片體會到\n\
  大地震到底是一個多麼恐怖的存在\n\n\n7. 嚴格來說這並不是一個獨立的缺點\n而是有前面各項缺點累積起來的問題\n\n在最後一段大臣洗白自願再次成為要石和救出草太的部分尤為明顯\n\
  因為沒有適當的鋪陳\n感動的音樂卻讓人毫無波瀾\n\n\n：\n\n我其實並不認為你的名字和天氣之子在人物塑造方面有多麼的優秀或是深刻\n然而\n你的名字有出人意料且精彩的劇情\n\
  天氣之子在男女主的感情線有下功夫雕琢\n鈴芽之旅卻在各個方面都沒有特別驚艷或是印象深刻的地方（令人驚訝的是，身為最新作\n的它在作畫方面居然是退步的）\n\n\
  如果要用兩個字來形容這部電影\n我想應該沒有比“”還要更精準的詞了吧\n\n--"
