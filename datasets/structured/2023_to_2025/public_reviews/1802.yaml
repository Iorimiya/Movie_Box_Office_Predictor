title: '[  好雷] 鈴芽之旅之大腦洞'
content: '鈴芽之旅像之前的天氣之子，你的名字都一樣維持良好品質，精美的畫風跟好聽的歌曲，

  只是沒有像天氣之子的歌曲那麼的洗腦

  跟你的名字及天氣之子比起來，感覺愛情的部分淡了很多，甚至可以說有點唐突，女主只

  是感覺男主帥就愛上對方了

  不過劇情方面邏輯性比上兩部強多了，如果再補上一些腦洞，可以說是星海誠的細心安排

  貓咪是最可憐的角色........


  以下腦洞跟暴雷




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  1.東大臣是那裡來的？

  東大臣是在環阿姨對鈴芽有負面情緒時，出現在環阿姨的身後的。

  這時有一個問題，要釐清，那就是東大臣的封印地在哪裡？

  在電影裡，草太說是封印在東京，但是實際的地點是那？古書是以塗黑隱瞞這個資訊的，

  為什麼要隱藏，就是怕有人心軟去解封要石，為什麼會心軟，我容後再說，我個人的腦洞

  是東大臣的封印地是東京以北的地點，電影也是秀東京以北開車大約一天的路程，如果要

  致敬歷史，就硬拗說是福島了，我想這是新海誠要撫慰真實歷史的受害者

  東大臣的封印地應該是在福島，或是說鈴芽的出生地，而且電影東大臣的現身地就是快到

  鈴芽家鄉約20公里的地方，才現身在環阿姨的身後

  另外代表死后世界的常世，引發地震的蚯蚓，如果要套入進日本地圖跟頭尾的概念，東大

  臣是在北邊的福島，西大臣是在南邊的九州，那東京的蚯蚓是在搞那一樁的？我的

  理解是東京人口多，相對的，死亡人口也多，常世蚯蚓的能量也越強，但最強的應該還是

  福島，要東西大臣，而不是一把椅子才壓的住。


  2.東大臣是誰解封的？

  有兩個可能，一是西大臣，二是環阿姨？

  西大臣，我個人是覺得不太可能，一是體型差距，二是沒有必要，為什麼說沒必要？我想

  所謂的關門師不一定是指人類而已，草太的爺爺的最後一幕就是對著一個貓咪的陰影說，

  老友，你來了！

  所以可以解釋成，爺爺跟東大臣跟西大臣以前就是一起封印蚯蚓的夥伴或是世家，只是若

  干年前是東大臣跟西大臣選擇犧牲自我去封印常世蚯蚓，這點可以在爺爺知道自己孫子冰

  封當要石後，不但不慌張，還一副接受的表情，請鈴芽不要再多管閒事，因為他知道總是

  有人要去當要石，只是這次是自己的孫子而已，東西大臣也是爺爺的老戰友，既然戰友在

  好久以前選擇犧牲，他是倖存者，他又有什麼理由要東西大臣再犧牲第二次呢？但他知道

  鈴芽的堅持有可能救他孫子的唯一希望，所以爺爺就心機的告訴鈴芽線索，把機會賭在鈴

  芽身上，不就幸好沒正面支持，要不西（東）大臣躲在窗戶偷聽，不就難為情了？

  所以解封東大臣的人只剩下一個可能性了！就是環阿姨！

  鈴芽應該在她四歲的時候，有過瀕死體驗，所以她去過常世，才可以進入所謂的”門”，

  而在那個時間跟地點，電影裡另一個在那時那地出現的就是環阿姨了，也就是常世蚯蚓頭

  的封印地-鈴芽的出生地。

  或許環阿姨會拔起東大臣也跟鈴芽是一樣的情境，就是家族基因，也就是手賤跟手癢。

  另一個更腦洞的證據是時間，電影日本上映的時間是2022年（鈴芽高二大約17歲左右），

  所以四歲的鈴芽是2009或2010年，請參照一下網址


  日本歷史上在2011前很少密集頻繁的地震，分別是1993，1995，2004，然後環阿姨手賤，

  拔掉東大臣後，開始在2011後就頻繁的發生大地震，密集程度比2009-2010前密集多了，

  所以可以說是一個間接的證據，指出就是鈴芽四歲時，東大臣被環阿姨解封了！

  那在之前1940年代也是有密集的地震年份怎麼說？

  搞不好當時也是沒有要石鎮壓的歷史啊！

  另外東大臣是隨著環阿姨出現在離封印地20公里處出現的，所以我的理解是環阿姨應該是

  無意解封東大臣的，而這十幾年東大臣一直徘徊在附近找尋著像鈴芽一樣解救西大臣的環

  阿姨，直到環阿姨出現在附近，他才現身在鈴芽一行人的面前。


  3.最可憐的角色是西大臣貓咪

  處在西大臣的角色想想，跟爺爺或是關門師世家奮鬥，最少也有十來年吧，也可能更久，

  當初西大臣選擇自我犧牲當要石，孤寂了那麼久的時間，好久以後，鈴芽手賤解封了西大

  臣，然後再次遇到鈴芽，被鈴芽的善意（小魚乾）感動喜歡上鈴芽，看到草太，心想我被

  硬了好久了，這次該換你們家（人類）自己當值日生了吧？要不怎麼一隻貓神，會一看到

  草太就說，這次換你了喔！西大臣搞不好還看過小時候的草太，然後草太硬要西大臣再當

  回要石，祂當然打死不要啊！媽的，再怎麼輪，這次總要換人吧

  ？為什麼又要我當要石？

  直到祂愛的鈴芽跟祂說，祂最討厭西大臣了，天知道這是多大的傷害，對西大臣來說，救

  祂的，是鈴芽，對祂好的，是鈴芽，結果鈴芽為了另一個要石備胎硬是追著祂，還為了這

  個要石備胎說討厭我？

  雞巴毛，鈴芽真的是綠茶婊！

  祂還勞心勞力的引導這對姦夫淫婦，一一去關後門，還看著他們卿卿我我，最後妳說討厭

  我？

  所以西大臣最後心死，選擇自我再次犧牲，再做一次要石，讓鈴芽這個綠茶婊再插進一次

  蚯蚓的屁眼，這是多麼悲摧的角色。

  東大臣也是被插二次，但至少他有在外面爽十幾年過啊！


  可憐的小貓咪


  --

  西大臣只是騙他們去關後門而已，再者如果西大臣比東大臣還早被封印，他怎麼知道東大

  臣切確的封印地

  如果真的只是鎮一個不夠會鬆動，那鈴芽看到東大臣就知道根本不用去救草太了啊？因為

  只剩一把椅子鎮住而已，是要救個什麼勁的，草太是有有本事像東大臣化為大貓戰鬥嗎？

  就慢慢等就好了，也不用犧牲西大臣貓貓了'
