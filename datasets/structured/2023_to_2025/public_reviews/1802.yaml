title: '[  雷] 鈴芽之旅'
content: '防雷














































































  新海誠這名字映入我耳廉是第一次看你的名字

  當時身邊的人無不狂推這個作品這個人

  我看了也是還蠻喜歡的,我應該永遠不會忘記

  幾年前又看了天氣之子

  也是還不錯啦但我幾乎全忘光了

  我只記得男主角最後被誰抓起來揍

  這次的鈴芽之旅也是睽違已久再次拜見新海誠

  很不錯看啦,音樂美術不用說一定頂的嘛

  我也喜歡公路電影的元素

  看來離家出走再怎樣都能跟浪漫扯上邊

  一路遇到不同的人,像是開驚喜包的過程永遠不會膩

  可惜就是劇情和設定沒這麼嚴謹

  感情線以16歲少女的角度還算合理,但還是疑惑居多

  重點是整體留白的地方其實不少

  我還是沒有很懂那兩隻貓到底是來幹嘛的

  但我是喜歡的,大致上都看的很舒服

  我也就看過這三部而已

  排名會是:你的名字>鈴芽之旅>天氣之子

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  一旦踏出去，就無法再回頭，朝三千世界的血海而去


  --'
