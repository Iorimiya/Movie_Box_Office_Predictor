title: '[新聞] 《排球少年》太強！打下《鈴芽之旅》奪台'
content: '新聞網址：





  2024/06/17 17:56


  〔記者鍾志均／台北報導〕劇場版《排球少年！！垃圾場的決戰》昨（16）上映中文配音

  版，助攻該片票房直衝2億5357萬，正式打敗《鈴芽之旅》（2023年 2億5270萬）的紀錄

  ，登上台灣影史日本電影票房第三名！


  目前台灣影史日本電影票房前兩名仍由《鬼滅之刃 劇場版 無限列車篇》與《灌籃高手

  THE FIRST SLAM DUNK》霸占，不過《排球少年！！》聲勢凌厲，口碑、票房都被看好。


  片中男主角日向翔陽的生日為6月21日，片商羚邦亞洲再度推出5場「特別場」，6月21日

  的MUVIE CINEMA TITAN廳，與6月22日的全台IMAX影廳：美麗華大直影廳、新竹巨城威秀

  影城、台中大遠百威秀影城與台南南紡威秀影城。



  --'
