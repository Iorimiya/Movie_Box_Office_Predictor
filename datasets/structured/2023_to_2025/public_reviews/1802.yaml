url: https://www.ptt.cc/bbs/movie/M.1677724013.A.E94.html
title: '[好雷] 鈴芽之旅 一點周邊分享&心得雜談'
content: '這篇是之前日本上映首日發在希洽再稍微修過的

  因為沒有於台灣看過中文字幕的版本

  所以有些專有名詞是我當時看完自己翻譯

  或許會跟台灣的正式翻譯不同（一些名詞有附上日文原文

  敬請見諒



  文長附個網誌好讀版





  期待已久的新海誠監督新作

  照慣例前面先分享一些周邊（日本的

  後面進入有雷簡評


  物販區




  沒什麼錢只收了個小壓克力模型和資料夾以及場刊






  場刊




  翻個第一頁示意，內容也是介紹以及聲優/監督/工作人員訪談等等




  入場特典 - 新海誠本



  主要收錄了關於這些作品的一些訪談



  Spotify宣傳




  合照




  順便來兩張電影院的和一張附近書店的宣傳













  以下進入有雷簡評

  會採取總評/劇情簡述/心得雜感的順序










  老樣子先用幾句總結

  雖然新海誠作品最令我著迷的還是像秒五那種難以言喻的傷愁

  但隨著近年更面向大眾

  儘管上一部的天氣之子令我不甚滿意

  可是這趟說走就走的自我療傷之旅

  新海誠風格看似不強烈卻有著許多他的痕跡

  讓我再次感受到這位監督的魅力

  不過也必須老實說，這部屬於觀影當下感動

  但事後越是細細回想會出現越多問題的作品


  聽說本作舞台會散布日本各處

  身為聖地巡禮愛好者

  在觀影前還很單純地想說

  會不會有現在居住的宮城県

  但隨著劇情開始

  想起之前官方公告的地震警報演出

  意識到東北肯定是繞不過的坎



  這次的劇情在一個相對好猜測的大框架底下帶出許多驚奇與趣味

  大框架是一部girl meets boy

  更擴大來說是女主角鈴芽面對塵封的過去

  所展開的自我救贖之旅

  而種種驚奇則是路上遇到的人們

  以及中後段開始的反轉

  整體節奏流暢觀影體驗很好





  故事的基本設定是在日本國土之下沈睡著類似蚯蚓的東西（みみず）

  若是不藉由要石（カナメイシ）鎮壓住便可能藉由散落各處的「門扉」顯現

  當蚯蚓接觸地面則會引發巨大的地震

  所謂的門扉基本上都是出現在曾經繁華但已沒落之的廢墟

  當門開啟時便需要閉門師（閉じ師）出動來關上

  男主角草太便是代代相傳的閉門師



  故事流程則是在男女主角在宮崎県相遇

  女主角意外解除要石的鎮壓引發蚯蚓外洩

  好不容易渡過危機後由要石幻化而成的小貓「ダイジン」

  卻將草太變成擺放在鈴芽房間的椅子

  追上去想要復原的草太和尾隨其後的鈴芽登上了開往四國・愛媛県的船

  遇到當地人便成功將門關上

  下一站抵達神戶也是一樣與當地的人交流並關門

  之後來到東京

  與蚯蚓對峙時卻被小貓告知原來現在的要石已經變成草太了

  必須犧牲他才能成功鎮壓住這邊的蚯蚓

  早已愛上草太的鈴芽也只好百般無奈地將椅子（草太）插入蚯蚓以鎮壓


  另一方面

  其實一般人是看不到蚯蚓的

  而鈴芽之所以可以似乎是因為兒時曾經迷路至「常世」

  所謂常世是世界的裏側，死者之所向

  打開門扉後鈴芽所見的草原與星空正是常世的景色


  草太作為要石鎮壓蚯蚓後也身處常世

  一心想拯救他的鈴芽想要再次進入並讓自己成為要石以換取草太的命

  經過與草太爺爺的對話

  理解到需要找到自己第一次進入的門扉

  而那就位於他的老家

  於311震災遭海嘯肆虐的地區


  路上鈴芽和大老遠來找自己的阿姨以及草太的朋友芹澤會合

  一同驅車前往故鄉

  我們觀眾也才知道鈴芽兒時受災的故事以及母親的罹難

  也得知原來小貓一路上並不是在阻撓或是想殘害人間

  而是想辦法將主角們引導到門扉的所在地進行關門


  終於經過重重險阻

  鈴芽重新打開了塵封的記憶

  拯救了草太

  同時也拯救了自己

  見了當年誤闖常世的兒時鈴芽

  告訴她將來一定能好好長大成人

  並將手上的椅子交給她（那張椅子其實是某年媽媽親自製作給鈴芽的專屬座椅

  接著離開常世

  關上門


  後日談則是草太想要將路途中的門關上

  並許諾總有一天會去見她

  鈴芽和母親一路回到九州

  路上也與曾幫助過鈴芽的人們再會

  想成為護理師的鈴芽

  也終於在某天

  當初相遇的通學路

  兩人重逢







  前一陣子許多新海誠作品在日本的各大影院上映IMAX版本

  雖然近幾個月因為種種需要重看了很多次秒速五公分

  但缺乏像這樣聚精會神地欣賞的機會

  進入影院再次深深沈浸於作品的魅力之中

  也懾服於其對於擦肩而過的詮釋

  這次的作品也始於一次擦肩而過，但終於重新相逢

  整部作品從場景的用心到故事架構到表現手法

  某些特定層面可說是新海誠的集大成

  但整體呈現也很不新海誠

  在貼近於大眾向的故事發展之中

  雖然不再是那種散落的哀愁

  卻充滿了他的風格

  更多適時的笑料與吐槽也降低了融入的門檻

  也少了一些更虛無縹緲，淡淡卻令人銘記的戀愛氛圍

  與其說是不新海誠

  不如說是他保留了一些過去自己的習慣

  雜揉了商業電影所需的要素而蛻變

  究竟是進化還是退化很難說

  但我想改變對他來說也是必要的

  雖然我還是比較喜歡以前他還偏小眾時期的氛圍

  卻也能感受到作為商業動畫片監督慢慢地進化



  但雖然故事發展本身可以說是非常大眾向

  可是核心碰觸到了那份痛苦的記憶

  震災

  老實說關於311或是影射其的「喪失」與「再生」類作品

  近年來用「氾濫」來形容也不為過了

  但也襯托出了這份記憶對日本人來說有多麼難以忘懷

  （當然很多作品的切入點其實是擔心大家已經忘記

  自從搬到宮城，再加上研究項目

  更多機會去接觸相關災害

  也基於對電影的愛好看了很多有關作品

  只能說對於如何去觸碰甚至是去療癒這份記憶是個困難的課題

  也有作品喜愛從旁人的眼光高談希望與重生

  看起來卻反而像是一種二次傷害

  這次的鈴芽的門鎖是否做出好的詮釋我不知道

  但有著屬於自己的的觀點

  除了受災者之外

  以「廢墟」為一大核心，探討了對於土地的鎮魂與療癒

  並且從一開始的沒落溫泉街到遊樂園

  慢慢遞進到主題的海嘯災區

  看到高懸於屋頂的小船

  實在很令人心痛

  而劇中要鎮壓住這些地方的蚯蚓

  一大要素便是感受到當年這裡人們的聲音

  並不是鬼魂的哀嚎

  而是此地仍繁榮時的熙熙攘攘

  這片土地的活力

  對於災區，他可能會成為受害者的傷心地

  但仍無法抹滅這裡曾是那麼的快樂

  回想起此地的美好對於災後重建也相當重要

  即使困難異常


  而在電影最後

  鈴芽回到故土，將連結常世的門關閉

  這個動作也相當值得深思

  關上門代表訣別過去和死者永別不再迷惘

  也可以是說著這個地方也將不再只是悲傷之地

  因為我們用過往人們的歡聲鎮壓了蚯蚓

  不僅鈴芽自己得到了個人的救贖

  也是給予這片土地救贖

  不過我想說到對土地的救贖似乎也有點太過頭了

  更重要的可能是回想起跟自己的故鄉

  說聲

  「我出門了」

  「我回來了」

  的那段時光

  如此單純卻必要的小事


  說到災害

  近年新海誠的三部作品，你的名字、天氣之子、鈴芽的門鎖

  主題全都是天然災害

  可見關於災害已經成了監督心目中的一大主題

  而這次沒有明講12年前的震災名稱

  但大家想必都能輕易聯想

  雖然整體充滿玄幻氣息

  但從隕石墜地、超大範圍豪雨洪水

  到這次的大震災

  某種意義上越來越貼近我們的生活體驗

  或許對於災害的關注一開始便是從大震災開始

  循序漸進地以自己的作品來探討

  又或者是在震災之後

  監督對於自然災害還有更多不同的詮釋角度

  也是相當值得期待

  （不過對天災主題講期待實在有夠怪，若引起誤會抱歉了






  來聊聊一些有的沒的點



  雖然中間幾段是遵循一樣的模式

  到某地遇某人看到貓發現蚯蚓

  並且鎮壓的模式

  但因為各個段落遇到的人事物都很有特色

  所以看起來也不會有強烈的重複感



  許多吐槽我超喜歡

  像是鈴芽追趕至廢墟時在想要對草太說什麼

  結果自己吐槽說這根本是在搭訕

  又或是說著總覺得浪費了阿姨的大好青春

  結果被吐槽這完全是前男友的台詞

  這些很貼近生活（？）也很適時不突兀的吐槽超棒的



  話說雖然整部看起來很流暢舒服

  但還是會不時想吐槽

  鈴芽啊，妳不去當長跑選手實在對不起國家

  每次看到遠處蚯蚓現身

  管他公路還是山路都能超迅速抵達

  此外在摩天輪關門時也一直在想她都快沒立足點了還能這樣推

  也太神



  話說不知道是不是我抄筆記漏看了

  好像還是不知道為什麼小貓會這麼堅持要讓鈴芽來幫忙

  純粹是因為她小時候進入過常世？

  而且這部還有一個蠻大的問題

  對小貓的處理有夠隨便

  後來知道祂對自己死心塌地

  也只是很自然地拿去當要石插

  很可惜對祂的描寫從開頭到結束都太過缺乏



  或許是刻意為之

  但這次雖然也是男女相遇的故事

  整體對於戀愛的描寫卻相當簡樸

  兩人剛相遇很自然地就像愛了

  比起前幾部可說是將愛情的描寫淡化了許多

  可能是為了突出核心主題

  總之也不能說是缺點比較像一種選擇

  畢竟對於感情的細膩描寫我想新海誠也可說是箇中好手

  不過這也造成了一個小問題

  前期鈴芽並沒有打算去面對過去

  之所以會重回舊地

  是為了心愛的男人（？

  可是對於她是如何愛上他

  似乎也只有講到一開始她就覺得草太很帥

  以這個角度來看

  鈴芽的自我追尋與救贖就好像只是追愛的副產品

  剛好有機會與過去的自己對話並互相拯救

  但背後基底的愛情線又是偏描寫不足

  使得男女主角的個人成長其實也顯得倉促

  算是比較可惜的點



  在常世，鈴芽面對兒時的自己

  看到她說著「媽媽可能會不知道我在哪」

  這一句話直接把我的眼淚榨出來

  後來鈴芽說的「妳也會好好地長大成人」

  也是一句細細咀嚼相當富有意義的話

  乍聽之下理所當然

  但能好好長大成人對多少人來說卻是一份渴求

  值得珍惜的事

  此外在鎮壓那個地方的門扉時

  出現的畫面是人們離開家，帶著笑容說「我出門了」的畫面

  這也是越想越感傷



  啊對了女主角的名字也相當有趣

  岩戶鈴芽

  前者讓人想起天岩戶的傳說

  再加上她住在宮崎

  這裡的高千穗也是作為神話所在地的可能之一

  那裡的天岩戶神社我以前也去過XD

  至於名字的すずめ

  也跟鎮め（しずめ)的發音很相近




  最後

  這部作為災害作品的同時也帶有旅情的色彩

  聖地巡禮點實在太多啦XD

  雖然過去作品也幾乎都是硬派的實際取景

  但要比上物理距離的跨度

  實在是難以匹敵

  希望等BD發行後有招一日能跑一趟

  不過也別忘了官方的小提醒

  聖地巡禮的大前提是不要造成當地人困擾！






  總之

  整體算是非常合乎我的胃口

  雖然硬要說的話不管是對於戀愛還是災害都沒有進行過度深刻的描寫

  但仍能從中感受到監督想說的話

  想必是經過無數的刪減平衡才達到現在的成品

  雖然還是有很多小缺憾

  不過整體觀影體驗仍是十分優秀

  也提醒我們想起對故土的那句「我回來了」












  置底防雷












  --

  kaze的日本留學＆不務正業ACG



  --

  感謝解釋～

  03/02 11:37

  真的是不完美但也有很多優秀之處

  真的

  喔喔這樣解讀也很有意境

  現在的話可能要去アニメイト（animate）之類的ACG專門店找找

  之前還有看到'
