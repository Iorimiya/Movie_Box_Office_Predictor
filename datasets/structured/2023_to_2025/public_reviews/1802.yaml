title: '[新聞] 《鈴芽之旅》王牌製作人川村元氣原著小'
content: "新聞網址：\n\n日本王牌電影製作人川村元氣，曾參與製作《告白》、《你的名字。》、《龍與雀斑公主\n》等超人氣鉅作，至今已擔任超過40部電影的製作人，這次他著手將自己的著作《百花》\n\
  改編成電影，並親自擔綱製作企畫及導演，更親手操刀撰寫電影劇本，並集結菅田將暉、\n原田美枝子、長澤雅美、永瀨正敏、北村有起哉、板谷由夏等日本奧斯卡影帝、影后及一\n\
  線知名演員共同參演。《百花》在日本上映後感動許多觀眾，好評不斷更勇闖海外影展，\n正式入選美國洛杉磯最大規模的國際影展美國電影協會影展（AFI），是2022年唯一入選\n\
  的日本電影，濱口龍介導演《在車上》；是枝裕和導演《海街日記》、《小偷家族》；宮\n崎駿導演《風起》等日本名作也都曾入選該影展。此外，《百花》還入選第70屆聖賽巴斯\n\
  提安國際影展，並成功奪得最佳導演獎，這也是首次由日本導演獲得該獎項。菅田將暉也\n表示內心相當熱血澎湃：「導演的熱情能夠傳達到出去，開心之餘也感到安心。」川村元\n\
  氣導演動人新作《百花》，將於3月10日（五）在台上映！\n\n電影《百花》是以導演的親身經歷改編，他也坦言因為是跟自己有關的故事，一開始沒有\n打算拍成電影，會開始考慮製作電影，是因為《我的長崎母親》山田洋次導演的一句話：\n\
  「這個會成為很有趣的劇本」而開始思考要如何製作成電影。故事講述男主角葛西泉（菅\n田將暉 飾）與母親百合子（原田美枝子 飾）多年來彼此之間有著一條無法填補的鴻溝，\n\
  在面對因失智症逐漸失去記憶的母親時，泉漸漸回想起與母親之間的回憶，卻也不小心發\n現母親的祕密。當隱瞞多年的祕密解開同時，才知道母親真正且深刻的愛。\n\n電影《百花》由演技派男神菅田將暉與資深影后原田美枝子共同主演，對於參演，原田美\n\
  枝子表示：「以後可能很難再有飾演主要角色的機會，所以我抱持著『這部當作最後的作\n品也不錯』的心情，用盡全力去演。我的母親也罹患失智症，她在電影拍攝快結束時離世\n\
  ，就這方面對我來說也是很特別的作品。」這部電影在菅田將暉與小松菜奈結婚前已經開\n始拍攝，他也分享了參演的心境：「我的祖母罹患失智症時，剛好是在我結婚的時候，這\n\
  也是我第一次感受到自己和飾演的泉有著同樣心情的時期。我感到自己心情的波動，也有\n些部分反映在完成的作品上。」\n\n除了菅田將暉、原田美枝子外，長澤雅美、永瀨正敏、北村有起哉、板谷由夏等知名演員\n\
  也共同參演。長澤雅美與菅田將暉是繼《銀魂2》之後再度合作，這次在《百花》中首度\n飾演夫妻，她表示這次合作讓她有種安心感：「我至今還無法掌握菅田先生是位怎樣的演\n\
  員，我對他的印象是做什麼都很靈巧能幹，但這次飾演夫妻角色，看到他在演繹時煩惱、\n思考又止步不前的模樣，也能看到他笨拙的一面，非常感同身受，總覺得很安心。」對於\n\
  本作，長澤雅美認為這是一部任何人都會產生共鳴的作品：「希望大家能以總有一天自己\n也可能面臨這種局面的心情去觀賞，而模糊的記憶也是這部作品的有趣之處。元氣先生也\n\
  說過，記憶是否正確，說到底也只是自己的主觀。心中只會留下自己擷取的一部份記憶，\n從各種不同的斷面來看這段記憶，或許會遇到自己意想不到的情感，也是這個故事的精采\n\
  看點。」真摯感人的電影《百花》將於3月10日（五）在台上映。\n\n--\n                                 02/13 12:10"
