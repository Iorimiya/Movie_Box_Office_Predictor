url: https://www.ptt.cc/bbs/movie/M.1677951169.A.E03.html
title: '[好雷] 封印心中的傷痛《鈴芽之旅》'
content: '封印心中的傷痛《鈴芽之旅》／《すずめの戸締まり》


  圖文好讀：


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  先說，我是犬派，沒有貓咪濾鏡，但即便脫去這層濾鏡，《鈴芽之旅》仍舊是新海誠有關

  災難的三部作品中我最喜愛的一部，即便我仍認為在翻譯上，鈴芽的門鎖可能更好一些，

  但這種事本來就是各有所好的，不是嗎。


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  【新海誠的災難三部曲】


  《鈴芽之旅》講述高中生岩戶鈴芽遭遇自稱閉門師的大學生草太，關門過程中鈴芽意外拔

  出封印「門」的要石，害阻止門後會引發地震「蚯蚓」的封印失效，令草太成為三腳座椅

  ，為了幫助草太恢復原狀，鈴芽踏上尋找變成生物的要石，並關上全國各地「門」的旅程

  。


  從《你的名字》到《鈴芽之旅》，三部作品分別詮釋了隕石、豪雨與地震三種災害，共通

  點除了都與天災有關，提倡自然外，更都是以女子高中生為主角，劇情上也描寫了青澀的

  情愫與青春期女性徬徨到堅定的情感變化。


  從《言葉之庭》與《秒速五釐米》到《鈴芽之旅》新海誠從青春期的男性轉換為從女性，

  也從少年少女的曖昧融合成對自然天災的敬畏。




  【百年追思巡禮】


  《鈴芽之旅》中除了已經提到爛，新海誠那美如畫的絢爛背景外以及強到不行的建築風格

  外，也花了不少心思在旅行上。


  從鈴芽旅行的腳步我們會發現，宮崎、愛媛、神戶、東京，皆是日本史上發生過重大地震

  災害的地區，分別是日向灘地震、伊予灘地震、阪神大地震與關東大地震（1923）年，而

  關東大地震發生的時間恰好與鈴芽抵達東京後，草太口中所說百年前蚯蚓造成的龐大災害

  不謀而合，同時也是日本史上少有震度超過8級的超級地震。


  而鈴芽的故鄉在維基上為仙台，但我個人從劇情推斷上認為更可能為岩手縣，一來東京與

  仙台距離車程約為四個半小時，到岩手縣則要六個半小時以上；二來從311震央推斷，當

  時災害程度岩手縣恐怕更勝於仙台。


  而鈴芽的這段旅程，也如同是走過了日本百年來的地震史，宛如一場地震史的追思巡禮，

  充滿了敬畏，也提醒著日本人過往慘痛的記憶。




  【常世】


  電影中我們能看到，在時空共存的常世中盡是斷垣殘壁，野火地鳴，蚯蚓躁動，鑰石疲乏

  。


  暗紅的蚯蚓彷如在這漫長時空中人們對於地震恐懼的記憶，隨時準備破門而出，提醒人們

  天災的可怕，而鑰石則像是人們對於神明祈願具現化的祝福，一而再再而三的壓住埋藏在

  大地中那可怕的回憶，但隨著時光過去，人們逐漸忘了地震的恐怖，鑰石逐漸失去了法力

  ，那對於地震的恐怖再度化為蚯蚓，再度讓人們記起值得敬畏的天災。


  開門，往如讓恐懼回憶席捲。


  關門，就像是塵封恐懼。


  鑰石，就像是人心對於地震敬畏的具現。


  閉門師的工作，說是封印地震，實際上是維護了，人們面對天災後的敬畏、反思與現世的

  平靜。




  【為何喜歡「門」更勝於「旅程」】


  關於名稱肯定是各有愛好的，這次的《鈴芽之旅》每關上一扇門，在我看來更像是關上了

  對於這片土地慘痛的回憶。


  就如同鑰石封印的蚯蚓一樣，他們始終存在，就在門後，不會消失，也不該被遺忘，但人

  生，關上門後，還需要開啟新的門，沉痛的回憶不能忘記，但也不該為此糾纏，在關上門

  後，才會發現仍有人等待著你，就像是在電影開頭，困住了鈴芽12年的媽媽的聲音「我出

  門了」，與最終她對草太說著「歡迎回來」，對我來說正是關上了悲痛，自我救贖後的前

  後呼應。




  【極具透明感的高分作品】


  這次的音樂誠哥與RAWIMPS以及陣內一真合作，不得不說陣內一真極具透明感的配樂讓整

  部電影的質感提升不少，在過場中也穿插了些許的日本老歌，都讓整部作品顯得更加飽和

  活潑，絲毫不會有喧賓奪主的感覺，彷彿是傳達著每個世代，每塊土地的聲音。


  這樣的透明感雖然整體上沒有《你的名字》這樣的波瀾壯闊，也沒有《天氣之子》的悲傷

  泉湧，但卻散發著淡淡的哀上與平靜感，彷彿為神明與土地至上深遠的敬意，以及歌頌這

  得之不易的平靜。


  當然，該壯闊時還是少不了，該催淚時也會讓你眼淚狂噴，絕不是平靜到像水晶音樂就是

  了，否則我也不用帶衛生紙了。




  【集大成的豐沛之作】


  《鈴芽之旅》並沒有《你的名字》命中註定的壯闊，也沒有《言葉之庭》那細膩的惆悵，

  但卻抓住了新海誠過去所有作品的特點，美如畫的風景、生機感十足的廢墟、青春期男女

  的青澀、沉重包袱的責任、透明感十足的配樂，這些元素似乎都點到為止，卻又互相契合

  ，最終成就這部既隱晦，又富含創造與想像力的《鈴芽之旅》。


  作為鑰石的寂寞、草太與芹澤的友誼、地震與蚯蚓的關係，《鈴芽之旅》有太多太多值得

  討論與細看的地方了，或許最好的辦法，就是買張電影票，到戲院的大螢幕上，細細品味

  這部作品的魅力與感動吧。



  對了，別帶貓奴去，整場都聽到後方的貓奴驚呼真的挺不好受的。


  --'
