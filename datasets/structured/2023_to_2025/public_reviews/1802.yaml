url: https://www.ptt.cc/bbs/movie/M.1678227998.A.398.html
title: '[好雷] 鈴芽之旅，關於大臣'
content: '看完電影就發現裡面有

  因為有兩個角色成長轉變之旅，

  一個是主要角色（明線）  鈴芽

  這邊版上很多討論，這邊就不想講太多

  另一個主要角色（暗線） 大臣

  非常有意思，如果，你就會看出為何他的心態轉變，以及一些細思極

  恐的部分。


  ，他沒有讓大部分的人一開始就發覺，要仔細看劇情才發現




  但如果搞的很明顯我想會模糊“成長“這件事，而聚焦到另一個角色怎麼這麼可憐？


  我會推薦再看第二次，真的會發現很多很奇怪的地方。







  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  有想到幾個點想提出

  1.大臣是人柱？

  為何草太爺爺知道？

  為何草太說而且他還知道怎麼使用要石，那不是就代表


  2.大臣喜歡鈴芽為何不直接幫助他？

  如果是，當然可以演第一次關門，他跑到旁邊，被關門師抓住插回，影片END。

  3.大臣是個喜怒無常的角色？


  大臣從頭到尾就是

  （因為他不記得是自願的）

  我是覺得讓大臣不要講太多話，是一個非常好的處理，不會太讓人出戲，又可以

  聚焦在鈴芽這主角上，。


  鈴芽解救 > 因為百年孤寂感謝她 >

  發現鈴芽旁有可惡的關門師 > 詛咒關門師變要石 >

  鈴芽說要收留他 > 覺得自己被愛，鈴芽好溫柔 >

  發現鈴芽在關門解救世界 > 想幫助她封印，但避免被抓，所以讓他們來追。 >

  鈴芽出狀況 > 去誘導草太救人（他不能太靠近蚯蚓，因為會變回要石，只要被插上就脫不

  了身，。

  ）>

  當草太暫時變要石 > 排除障礙來到鈴芽身邊

  等等，，不是喜怒無常。

  4.大臣為何心態轉變？

  當鈴芽說討厭他，他只是覺得被討厭了。

  他最不能接受的是，那種輪

  迴的既視感和絕望感，應該就是讓他願意變回要石的原因。

  我超喜歡一幕就是

  環阿姨和鈴芽在車上的告白，表面上是他們倆的對話，


  從，直接拆穿成

  左大臣透過讓環阿姨的真實情感表達，再次點出右大臣一件事


  而最後右大臣起身反抗，卻只能無奈的接受了。（，都是

  反抗，一個有好結局，一個屈服而已）

  5.大臣接受自己的命運？

  有一幕鈴芽其實已經知道是怎麼回事，所以才猶豫不決，但大臣說

  ，那一幕看懂真的會

  心痛。

  6.為何鈴芽可以穿越常世，那不是死人的地方？

  今天一個暴風雪，你看到一個小女孩躺在雪地裡很久（阿姨有說終於找到你了），

  你會想到甚麼呢？

  A.那女孩真會玩，玩累了還躺在雪地上睡覺。

  B.天啊，那女孩是不是了？怎麼躺在那邊？



  7.那鈴芽知道了大臣身份，她怎麼下的了手？


  ，所以主角必須選擇：

  1.大臣，被做成要石孤獨並失去了所有，想要脫離不死狀態，用主角貓的身份活完一生。

  2.草太，帥哥，年輕，熱情有為教師。

  3.主角，對，就是不會死的主角

  4.其它人管它去死！我要帶他們離開日本！


  不過女主經歷選擇的痛苦後，去O的新海誠導演很溫柔呢，他讓女主

  兩位都用哀傷的微笑，希望女主下手（真實意思），真的是太棒了！


  謝謝大家


  --

  請保持清新好口氣！


  --'
