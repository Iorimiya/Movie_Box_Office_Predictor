url: https://www.ptt.cc/bbs/movie/M.1678800482.A.D86.html
title: '[討論] 鈴芽之旅 原本以為有彩蛋'
content: '==========有雷================




  剛看完鈴芽之旅 看到一半時沒特別喜歡


  但到結束時好像又懂了導演要傳達什麼 可以給到80分以上 算是滿喜歡的


  我是覺得這部導演想塞太多東西了


  每個面向都想擠進一部電影 所以反而每個部分都少了一點點


  感情線我是覺得可以刪去 單純是友情就好 這樣會比較剛好


  另外 在跑工作人員名單的時候


  我跟我妹說 等等彩蛋一定是大臣回來找鈴芽了


  日本動畫最喜歡搞這一套惹 顆顆


  結果直接沒彩蛋 直接被打臉lol


  居然沒彩蛋 哭啊


  還我大臣拉～～！！！




  --

  我也是= = 我想說等等一定猜中lol

  幹真的 但歌是真的好聽拉'
