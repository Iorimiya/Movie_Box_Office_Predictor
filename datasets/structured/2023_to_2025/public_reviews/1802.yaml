title: '[好雷] 溫柔地再見一面，鈴芽之旅'
content: '感覺以下經驗分享應該不算雷，

  但每個人的雷點不同還是防一下。


  ～～～～～～～～～～









  311東北大地震之後，日本政府為了傳遞災民積極面對災後重建的正向訊息，開啟了「絆

  計畫」（KIZUNA PROJECT），邀請世界青年前往災區參訪，而10年前的我有幸透過學校成

  為台灣訪問團的成員，當時參訪了分別位於宮城縣的南三陸町、石卷市的災區。


  看鈴芽之旅前，就略知是以311為背景的改編故事，但看完之後，原本已經逐漸淡忘的回

  憶，又再一次被翻湧出來。電影裡許多場景都對應著10年前災區的衝擊畫面。


  無論是鈴芽跟隨阿姨遷居九州，還是原先在東北的家鄉，場景都與南三陸町受災前相當相

  似，可參考以下網址：


  （未考證作者參考依據，歡迎補充官方資訊）


  災後兩年的參訪，我們搭著交通車穿梭在南三陸町的街區，前方殘存的鋼構建築物，是原

  本的防災對策廳，因為當時堅守崗位的遠藤未希，直至殉職前不間斷的避難廣播，保住了

  上萬人的寶貴生命；電影中短暫致敬了防災廣播。



  鈴芽回到故居時，家屋只剩下地上的矩形牆基，當時災民也在原址設立看板，提示著原先

  該處的建物。



  電影中多次出現的各種廢墟、車輛甚至屋頂上的船隻，沒有親臨現場真的難以想像，堆積

  如山的報廢車輛，照片根本不及百分之一二。




  到了石卷市，我們在某個小學的對街下車，當地爺爺訴說著海嘯襲擊當下，師生疏散到學

  校的後山躲避，卻萬萬沒想到海嘯高度竟然比那座小山還高，「生命之輕，薄如一張白紙

  」爺爺感嘆著。



  如同電影裡草太說的，想像當時在這裡的聲音，站在校舍對面，我們也曾全員閉眼默禱，

  對於此地發生的悲劇實在令人鼻酸。



  ~~~~~~~以下才是關於電影的心得雷~~~~~~~~




  我覺得作者的溫柔之處，在於全片沒有出現任何一個無辜民眾的驚恐、尖叫（除了小鈴芽

  以外），而是以多段跳接畫面與對白，形塑災變前的現世日常。


  「我出門了！」、「注意安全喔！」

  「我回來了！」、「歡迎回來！」


  永別的悲劇，卻以溫馨的畫面隱喻著，

  鈴芽的童年其實數以萬計地發生過。



  另一個溫柔之處在於每一扇竄出蚯蚓的後門、即將襲來的巨變，都因為鈴芽、草太、要石

  的奉獻犧牲而擋下，從九州到東北，終究沒有讓災害再次降臨。


  不需要再一場災難來提醒我們失去了什麼，但透過鈴芽的故事，去看見走過傷痛直至今日

  的自己。

  大小鈴芽相會之際，原本傾斜的構圖漸轉平緩，觀影情緒也跟著平靜下來。


  傷痛可能會逐漸淡化，但不會消失，

  也許某一天我們會翻到全黑的那一篇日記，

  但可喜的是我們堅持到現在。


  今天的你，來自昨天，值得明天的你一個擁抱。



  願大家身邊都有一位關門師，要石永不鬆動。


  --

  去過特別有感QQ

  對啊非常重要，我們不需要再看到為什麼船會跑到屋頂上、為什麼會有整個城鎮著火

  哭點不同啦，我有被感動但也沒哭，不過哭的人一定很多

  我個人覺得還好啦，小鈴芽早就看過穿越時空的草太，會一見鍾情其實不突兀，劇情推展

  也沒有太膩的愛情戲，以倖存者觀點去拼命避免災害降臨應該也是說得通的。

  去Google新聞畫面還不夠多嗎…沒必要再重現'
