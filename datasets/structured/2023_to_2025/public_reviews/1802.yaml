url: https://www.ptt.cc/bbs/movie/M.1678129531.A.95B.html
title: '[討論] 鈴芽之旅的貓 (有雷)'
content: '我自己的想法啦

  要成為鎮壓的石頭可能有一個潛在條件：必須自願


  白貓被鈴芽拔出來後喜歡女主 不想繼續當石頭了

  但是為了守護這個世界 必須讓替死鬼男主角意識到：本貓不爽當石頭了 還想救這世界必須

  自願當石頭

  最後男主順利變石頭後才會對女主說：「終於只剩下我們了」想要和女主幸福快樂過生活

  沒想到女主卻很生氣


  這時大家應該有注意到 白貓變瘦不啦嘰的

  相比白貓一開始變肥是在一開始女主家窗戶 女主問他要不要做她家貓咪

  可能還有個設定是 白貓跟喜歡、快樂 之類的情緒有關

  白貓和生氣、負面的情緒有關 所以黑貓出場時才會有阿姨黑化的戲份


  而黑貓出來找黑貓其實就是很不爽白貓落跑 要來把白貓抓回去當石頭 畢竟他們當初都是自

  願當石頭守護這世界的神明

  他們打架完的那幕正是黑貓叼著白貓 很和諧的樣子


  進到異世界後 黑貓也馬上化身成大龍打蚯蚓

  印證黑貓是毫無顧慮要守護這世界的想法

  而白貓看見女主這麼愛男主 決定放下繼續當石頭


  大概是這樣

  如果新海誠能把兩場甚至只要一場打蜈蚣的戲改成簡單的文字對話 把這些東西講清楚

  我相信評價一定不會像現在這麼糟

  甚至私心認為開車場景也根本不需要那麼長 真的是開車 開 太 久


  不過以上都是我自己看完後想了很久得到的結論

  畢竟劇情裡根本什麼都沒說

  大家可以一起討論看看


  --'
