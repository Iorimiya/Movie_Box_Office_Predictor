url: https://www.ptt.cc/bbs/movie/M.1716487985.A.117.html
title: '[大負雷] 鈴芽之旅 超難看'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  我會想看這部動畫就是因為歌曲很好聽 新海誠名氣大而已


  沒想到劇情爛成這樣啊



  不就是一個發春JK巧遇長髮憂鬱帥哥 像是F4的仔仔那樣 然後追到天涯海角

  帥哥不見了  還脫口說出我不能活在沒有你的世界


  感情線明明完全沒有鋪陳  滿滿的黑人問號




  我如果是在電影院看一定睡著  好險我在家看可以滑手機



  地牛翻身在這邊變成長相畸形的地龍  長相跟動作都莫名其妙地可以



  大臣 要石 後門 關門師 這些自以為很有創意的設定也不多解釋一點

  自創這些科幻的東西可以啥都不講  自以為浪漫就帶過嗎




  對這部動畫有興趣的人奉勸不要浪費時間去看了

  主題曲聽一聽就好   因為劇情是大便一坨

  發春JK的無腦追男劇真的沒啥好看的


  --'
