url: https://www.ptt.cc/bbs/movie/M.1677311690.A.504.html
title: '[好雷] 鈴芽之旅，貓貓，我的貓貓嗚嗚嗚（全劇情'
content: '這次有訂到搶先場在竹南尚順威秀，原本以為搶不到了結果有訂到雙人票，於是就和女友去看。


  自己看過很多部星海誠的作品，從最早的貓的集會就大概知道星海誠是個十足的貓派了誤），這回更是讓貓咪變成主線了（？）


  這部感覺是集合你的名字、天氣之子之後的集大成之作，比起你的名字聚焦於男女雙方的情感、天氣之子專注於青少年為自己想法的衝撞現實，這部主線則在於一步步解決衝突、沿著主線跑→轉折→公路旅行→解開謎題收尾，然而比起天氣之子那個可笑的他手上有槍啊！有更貼切合理的故事設定。


  該感動的地方很多，但星海誠作品的缺點向來都是奇幻的地方不會多做解釋，只會演出結果；這回雖然有劇情上帶過一段補充，但仍然篇幅一下就過，但在劇情流程上就舒服很多。


  而這部解謎的收尾主要的受眾還是日本人對之前311地震海嘯的悲痛做一個宣洩口，我覺得這部分只有經歷過311的人會更有共鳴，星海誠以此劇情（也很明顯使用311這個日期）去撫慰同樣悲痛的人，並鼓勵他們

  走出傷痛。


  還有我覺得這次奇幻的部分變得更好：像是上鎖的咒語和鎖上的花紋特效



  以下為整部劇情憑記憶，可能多少有疏漏，絕對暴雷請斟酌閱讀：


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  女主鈴芽由阿姨扶養，在九州的鄉下一同生活，小時候的記憶不太記得了，只記得椅子是她媽媽給她的遺物，而很久以前有個人將椅子交給了她。


  有一天上學遇上男主角草太一見鍾情，草太問她附近是否有廢墟，女主回說過去有個溫泉街廢墟後草太就此別過。


  後來鈴芽因在意草太而上學中途翹課跑到廢墟，沒看到草太反而闖進了一個廢墟的池子，中間立著一道門（如預告那樣）。她好奇打開門看到了門後是另外一個世界：有著美麗星空與草地的世界，然而她走進去的瞬間—至少她認為踏進去了，卻只是跨到了門後：反覆幾次之後發現她沒辦法進入她所看到的世界那邊，此時她踢到了鑲在地上的一個貓石像，她將石像拿起後似乎回想到了什麼，那瞬間貓石像變成了一團生物，鈴芽嚇得把它丟掉，並害怕的留下開啟的門跑回學校。


  回到學校與朋友閒聊時望向剛剛的後山，卻發現一隻巨大如蚯蚓狀的東西從廢墟的方向竄起，然而周圍的人都看不到那個蚯蚓。驚恐的她跑回廢墟，卻見到那蚯蚓正是從之前沒關起來的門裏竄出來的，也同時看到草太正試圖將門關起來。


  在蚯蚓倒下造成一個小地震之後，他們合力將門給關閉。此時草太手臂受傷，鈴芽於是帶他回家包扎。


  包紮時，家裡的窗戶冒出一隻骨瘦如柴的白貓，鈴芽餵給牠食物並說「好可愛啊能不能當我家的貓」的時候，牠變成健康的樣子開了口：


  「好啊。」

  「鈴芽，人好，喜歡」

  「你，很礙事。」看著草太，貓咪語畢，草太就被變成女主房間原本是媽媽遺物的缺了腳的椅子。在女主還搞不清楚狀況時，貓咪逃了出去，椅子草太也跟著踉蹌的追了過去，女主接著在後，最後一人一椅一貓（？）搭上了從九州往愛媛的船，而貓隨著他們上船之後跳去其他船消失無蹤。


  船上，草太向鈴芽說明自己是關門師，為的就是要在即時把在各地的門給關上，而那些蚯蚓則是門後的一種存在，會不斷尋找有門的地方竄出，然後倒下造成大地震，於是必須透過他們關門師去將門關起來，而原本有兩個神石是來鎮住蚯蚓的，其中之一便是那隻白貓。


  而後他們合作，靠著SNS傳出有很像「大臣」樣子的貓來追蹤牠跑去哪里，而每次到的地方也會有門被蚯蚓竄出的情況，也都順利在引發地震前解決。


  最後，他們一路追到了東京，卻發現這地方竄出的蚯蚓卻在河川下游、地鐵之內，非常之巨大，原先由另一個神石所鎮住的蚯蚓在引發一次地震後掙脫，在東京高空形成巨大的盤旋蚯蚓（說真的看到這真的有種EVA使徒來襲感）；男女主衝上了蚯蚓身上找到了白貓，要他這個神石回去鎮住蚯蚓並把草太變回來，但此時白貓卻道不可能，並悄聲說對草太說，「現在你才是神石。」


  此時草太才發覺自己並不只是被詛咒變成椅子，而是被丟包變成了新的神石，了解到了自己現在的責任後失去了意識化成新神石。鈴芽怎麼喚也喚不醒草太，白貓告訴鈴芽那個椅子已經不是草太了，再這樣下去會有數百萬人喪命，情逼之下只能淚流將椅子插入蚯蚓，化解蚯蚓的地震後從空中墜入河中（被白貓變身包覆沒有受重傷）。


  醒來後來到了東京地鐵地下的古代山門，這裡是東京的門，看到椅子草太被釘在門後的世界而無法過去，憤怒的說討厭白貓，白貓再被說討厭的瞬間變回了第一次見到那骨瘦如柴的樣子黯淡走開。


  鈴芽決定前往探視先前到東京在草太的租屋處找資料時，草太提及過他在醫院的爺爺；一進來爺爺說道：「草太，他失敗了嗎。」


  鈴芽想要救回草太，卻被爺爺怒喝這是糟蹋草太變成神石的決心，當初不就是你將他插入蚯蚓體內的嗎？外人就該回去過自己的生活。


  然而鈴芽心意已決，看到無法阻止她之後爺爺則點出了鈴芽小時候應該誤入了門，門後是常世的世界、死者的世界，要能進入那地方必須回到過去第一次進入的門，也就是鈴芽很久以前的故鄉那裡。


  女主明白以後決意回去故鄉，在她離開之後，醫院窗外冒出了一個貓咪的影子，爺爺認出了他說：


  「好久不見了，你要跟著她嗎」

  「那就拜託你了」



  鈴芽要準備啟程途中遇到了先前遇過的草太朋友、開著一台敞篷車來找草太的芹澤，同時也遇到找鈴芽很久、從九州殺過來的阿姨，以為芹澤把鈴芽拐走。鈴芽決定上了芹澤的車，拜託他載她到故鄉去。此時，瘦小的白貓也跟著上車。


  接下來一路昭和歌曲的公路旅程，阿姨帶出了鈴芽以前在某次事故後為了找媽媽跑出家門，後來在大雪之中找回她的往事。為了敞篷車收不回屋頂而到休息站躲雨時，鈴芽因為不想解釋為何從九州一路跑到東京去的原因，和阿姨吵起來，此時阿姨怨懟說道：


  「我犧牲了自己12年的心力，浪費了自己的青春去養育你！你給我離開我家！」在鈴芽錯愕之時，白貓對著阿姨後面吼叫，之後，阿姨背後出現了有半個人身高大的黑貓，原來剛剛阿姨會爆出這些話似乎跟牠有關？阿姨昏倒、白貓撲了上去扭打之後反而被黑貓叼起，一起坐上了車。


  之後，他們繼續三人兩貓到達了鈴芽以前的故鄉，找到了過去那扇小時候開啟的門後得知白貓其實一直引著他們去關上要被竄出的門，而非引出蚯蚓，於是鈴芽與兩貓跳入常世之中。


  常世中，有條更為巨大的蚯蚓匍匐等待竄出，此時黑貓變成了巨大的貓妖，與蚯蚓扭打起來，而鈴芽受白貓保護落地後去跑向在遠方那個鎮在蚯蚓尾巴的椅子。


  女主要拔起椅子時，白貓說這樣會讓蚯蚓竄出門外，鈴芽回到：「那就由我來當神石吧！」握著椅子的她開始結冰轉化，白貓看到後似乎理解了什麼，也跟著拔椅子。


  椅子成功拔出，救回了草太醒後，看到那隻大貓妖認出其名為「左大臣」，也就是另一個神石；鈴芽奔向倒下的白貓，此時白貓虛弱的說：


  「對不起，我不能成為妳的貓」轉眼間變回了原本的神石樣子。


  鈴芽流淚，並和草太握著也變回神石的左大臣，一起將蚯蚓頭尾封印。最後，在那個第一次的門將其上鎖，「我出發了。」


  結尾，草太將沿途繼續將沿途的門關閉，並答應鈴芽會去找她，而鈴芽母女倆就隨著芹澤開


  最後，一樣的下坡，畫面中鈴芽看到人，微笑停下並說道：「歡迎回來。」




  ~~~~~~~~~~~~~


  雖然這次仍然有星海誠一貫的一直喊對方名字的橋段，但比起之前更有氣氛也不會煩躁，這


  總之，我推薦去看，整體劇情絕大部分非常順暢，中間也穿插很多好笑也不會大亂節奏的片



