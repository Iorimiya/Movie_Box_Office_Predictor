url: https://www.ptt.cc/bbs/movie/M.1677941134.A.281.html
title: '[  好雷] 鈴芽之旅之我的藍色窗簾'
content: '大家好：


  今天跑去看鈴芽之旅了，針對電影中草太跟大臣之間的關係，有一點點發想，內容大概有

  涉及到一些電影劇情，所以就自行審酌要不要往下看哦！





























  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  為何大臣從「來世」返回「現世」的地點，要放在池塘？



  古時候池塘、湖泊等被認為是陰陽交接之處（如同現代鏡的概念），所以日本神話中伊邪

  那岐從黃昏國（常世）逃回現世後，是直接在阿波岐原的池塘中祓濯；而劇中大臣也是在

  池塘上，從常世返回現世。






  劇中的大臣為何要詛咒草太？又為何要自願回歸封印？



  以陰陽學來說，常世屬陰，現世屬陽，一來一往方為衡平。因此倘欲復活一人（大臣），

  則需要葬送一人（草太）；復來之人須進行淨化儀式，歸去之人須予以詛咒儀式。


  而劇中復活儀式的呈現方式，乃是大臣詛咒了草太，讓草太受到黃泉之氣（陰氣）侵蝕；

  而大臣自身則在獲得鈴芽的善念（陽氣）後，就決定一直跟著鈴芽，進而淨化自身，完成

  復活儀式。


  但是，劇中草太雖已被陰氣侵蝕完全，可是大臣卻未能獲得足夠陽氣淨化，復活儀式仍處

  於未獲成功。所以鈴芽即便沒有禱咒及相對應的祭器，仍然可以救回草太；而劇中大臣明

  明任性且無情，可最終還是自願回歸封印。



  另外本片畫面真的超美，個人覺得粉值得票價XD



  --'
