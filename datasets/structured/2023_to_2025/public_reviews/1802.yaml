url: https://www.ptt.cc/bbs/movie/M.1677579715.A.501.html
title: '[好雷] 鈴芽之旅'
content: '看的是連假的搶先場，影廳不算大但幾乎全滿。


  先說結論：〈你的名字〉依據是個人心中第一名，完成度最高、配樂跟畫面也都恰到好處

  。

  可是



  個人覺得這部整體性比〈天氣之子〉好，即使配樂畫面略遜。因為劇情調性的關係，美感

  沒辦法企及前兩部，但在情節跟角色的塑造上比前一部來得立體。


  觀影之前有「這不是愛情片、主軸更不是談戀愛」的心理準備觀影體驗會較佳。與其說是

  雙主角不如說是單主角——在災難過後被留下來的人，該如何在珍貴的人不在了的這個世

  界裡，繼續堅強地生活下去的？




  而在一路跌跌撞撞地長大了之後，回首才發現，所以也能理解為什麼電影標題叫做「す

  ずめの戸締まり」（鈴芽之旅、鈴芽的門鎖）。


  看得出來新海誠下足了功夫在處理鈴芽的情感面。這部作品對於經歷了311大地震後的日

  本、更甚者說日本東北地區的人們來說，會非常的能同情共感、而且是會感到被療癒的一

  部作品。


  臺灣觀眾或許感受不那麼強烈，但曾在921當中受創的人，應該也能理解這部要傳達的意

  義。而即使沒有相關經歷的人，應該也能為其中所欲傳達的情感跟道理所動容吧。


  所以即使這部整體來說完成度依舊沒有〈你的名字〉這麼高，但這部的出發點、描述的角

  度與方式，是一部別具意義的作品。


  看了蠻感動的，還是推薦大家去看。



  ＊＊＊以下個人感想，＊＊＊



  〈鈴芽之旅：活下來之後〉


  劇情細節就不贅述，直接記錄看完的心得。


  主角無庸置疑是鈴芽個人。與鈴芽看似有淡淡情愫、一起冒險的草太與其說是男主角，不

  如說同樣是鈴芽在找回因為地震過後可能有的創傷，而缺失了的記憶的「協助者」。


  鈴芽在經歷了震災之後，被阿姨帶離東北到了九州生活。幾乎可以說是在阿姨的悉心照護

  之下長大，看到家中擺放的照片也可以看得出兩人的情深跟阿姨的疼愛。


  從鈴芽帶著草太一路踏上抓回大臣的關門之旅，──無論是同年

  紀的千果及其家人、還是載她一程的酒館老闆娘、草太的好友芹澤──。大

  家全都熱情地對鈴芽伸出援手，即使鈴芽不便道明旅行的目的也從不過多詢問，無論是舉

  手之勞還是像芹澤那樣捨車陪姨女（XD）。從中感受到的就是一種「良善」還有「愛」的

  凝聚。


  也就是即使在震災後成了孤兒、內心也有著延續到青春期的混亂與某個黑暗角落，但鈴芽

  依舊在愛跟善良中成長到了這個年紀。




  曾經經歷過麼嚴重的創傷，走到電影上映、一直在努力恢復、人們彼此扶植成長的2022年

  ，也已經11年了。


  然而，順利成長了不代表過去的「創傷」不存在。


  那道「門」象徵的是生者的現世與常世，若不是鈴芽天賦異稟看得到所以在年幼時誤闖，

  再不然就是年幼的鈴芽隨著母親逝去的創痛，遺留了一部分幼小的自己在門內，宛如死去

  一般。


  鈴芽究竟怎麼誤闖的不得而知，但就結局來說，長大了的鈴芽藉著所有時間聚合的「常世

  」，拯救了當初陷入黑暗的小鈴芽，讓自己抱著母親的愛繼續走向未來、在這個世界的善

  意當中長大，

  鈴芽打開門、發現當年的自己這個情節，我想到心理諮商很常提到的「內在小孩」這個概

  念。


  隨著年紀增長，年幼時曾遺留的創痛、未被滿足的慾望、被壓抑的焦慮、不被允許的哀傷

  ，不一定會隨著身體的增長消弭療癒。反而可能在長大成人的過程當中，因為某些導火線

  而觸發。


  因為門未關好、蚯蚓竄出而引發的地震，或許就是鈴芽心中的導火線。



  災難倖存者很容易產生「為什麼活下來的是我？」這樣的想法。雖然在鈴芽身上表現得並

  不明顯，但從她願意代替草太成為「要石」的舉動、跟劇中某些某些台詞、跟阿姨的爭吵

  ，就可一窺鈴芽較微弱的求生意志。


  但也不是真的想死。而是因為覺得「有比自己更重要的人、更有價值的人」值得活下去，

  所以寧可犧牲的是自己。


  可是當有人並肩、有人陪伴、還能看見未來的可能性的時候，就又覺得「一週、一天、一

  小時」也好，還想繼續活下去。因為未來不是「黑暗」的，是「多彩」且「光明」的。


  或許覺得自己的性命是那麼微不足道，但如果是跟你一起活下去，好像可以再努力看看。


  所以這部電影不是雙主角的愛情故事，而是鈴芽的成長與療癒之旅。也真的算是給經歷過

  東日本震災的人們，一部觸及十一年來內心感受的絮語。


  一路有著溫暖的人們陪伴跟幫助，所以鈴芽順利長大成人，回到了家鄉，拿著母親的遺物

  ，安慰了當年遍尋母親不著、在黑暗裡獨自哭泣的自己。




  就像是鈴芽擁抱了自己的「內在小孩」，走入了小鈴芽的黑暗、擁抱了小鈴芽的悲傷、給

  了小鈴芽那把象徵母女羈絆的小木椅。



  人啊，只要活著，就絕對不是孤獨的。





  少了互助的他人、少了自救的自己，生命都是不完整的。


  所以，當鈴芽完成了「命定的」任務，帶著草太離開常世，鎖上「因為人心不不安定而打

  開的『後門』」時，她說的不是草太以「關門者」相傳的關門咒語，不是感受到強烈衝突

  與對抗性的「奉還於爾」。



  而是將自幼時創痛的那道門在好好療癒過後，在心底鎖上放進角落，充滿朝氣地說聲，然後




  P.S.(1)唯一覺得沒想通的是，小鈴芽的日記怎麼會在3/11寫完之後埋在老家的院子。震

  災發生過後理應就回不去了才對？



  P.S.(2)大臣們任性的設定實在是有夠日本神明，拿貓來比喻真的超級惡趣味。



  P.S.(3)劇中穿插蠻多自然又趣味的笑點，感覺作者有想讓整部的調性不要過於沉重，畢

  竟是直面東日本震災的題材。在傳達情感跟寓意的同時，又不希望過於悲傷之間的平衡真

  拿捏得很好。寫完心得的此時又更喜歡這部作品了。應該會二刷！


  --

  　　寫完心得一個小時後，覺得後勁有點強。回味了一下你名要傳達的概念，覺得好像

  好像不能像開頭說你名還是第一名欸哈哈哈，兩部真的沒辦法這樣比，概念真的不同。

  這部越回味越喜歡，希望大家刷起來XD'
