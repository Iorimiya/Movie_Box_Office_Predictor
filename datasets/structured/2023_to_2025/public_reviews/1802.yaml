url: https://www.ptt.cc/bbs/movie/M.1679205017.A.AB5.html
title: '[普好雷] 鈴芽之旅 生命誠可貴 愛情價更高'
content: '不可否認這部片以閱聽享受的角度來說


  還是很好看啦



  不過整部為了推動劇情而推動的痕跡


  確實是蠻明顯



  首先 女主光速暈船

  很多人（所有人）都提了



  其實我自己覺得


  別人問廢墟地點 自己有好奇心


  跟上去也不是不能接受



  可惜比起好奇心


  個人感覺電影更著重在女主發春上


  也難怪觀眾會覺得突兀了



  由劇情發展來看


  為了讓女主拔石->女主必須到門->女主因為發春追男主才跑去廢墟看到門



  男主一開始是不想把女主牽扯進來的


  ->變椅子使其必須依賴女主



  結果後來椅子移動能力比人還強


  遊樂園飛簷走壁


  那我也就 動畫啦 好吧 okok



  為了讓主角follow大臣去哪


  ->把貓變成SNS明星


  （我印象中劇情裡也沒有別隻貓


  我實在很難“想像”到底有多特別...）



  為了讓主角追上大臣


  ->降神兩組居民讓女主吃好穿好睡好


  （展現日本人的親和?）



  爺爺那邊一開始嚴厲斥責


  別讓男主努力白費


  結果馬上大笑三聲脫口常世資訊


  打臉三秒前的自己


  （感覺多點鋪陳可以更合理）



  最後要喚醒男主的名言


  “我無法想像沒有草太的世界”

  （經查詢 改為“我害怕的是沒有草太先生在的世界”）

  也是建立在->光速發春後的六天發情期


  （雖然我覺得產生感情合理


  但六天就愛到卡慘死還是突兀的）



  除此之外 都還是不錯的


  音樂場景 穩定發揮


  人物塑造和個性 都很討喜



  包含很多人詬病的日常


  我自己是滿喜歡的


  感受煙火氣以外 也能看看作畫



  最讓我能代入和喜愛的人物就是芹澤了吧


  只是個平凡人 但對主角的征途也能提供貢獻



  毅然答應女主的浮誇要求


  和公路上的自得其樂與悠哉



  可以說讓我感受到


  在這部片其他地方本應該得到的“浪漫”



  “我難道不能擔心我的朋友嗎”


  這句話反而比女主喚醒男主更戳到我



  至於說是災後治癒片


  我個人是和朋友看 沒看過預告片



  但從日記上的3/11也大概理解了


  這部片真正想講的事情


  那麼行經地點的意義那隱約也明白



  只是 整部幫男女主配羈絆的味實在太濃


  於外看上去是愛情片


  於內來說 還是一部為愛發昏的片



  走出傷痛 繼續前進


  就是個幫助撮合男女主的“口號”罷了



  在比重來說 就是沾了個邊


  後半段跟你宣示了下存在感


  （當然可能當事者很感動


  這裡只是以一個消費者的觀點）



  不過 完全可以理解 商業上需要成功


  也確實成功了


  大團圓我看的也很開心就是了







  -----

  Sent from JPTT on my Samsung SM-S9010.


  --

  為黑而黑 okok'
