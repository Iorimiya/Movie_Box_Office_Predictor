title: '[好雷] 鈴芽之旅 打開與關上廢墟的門'
content: '雷文防雷資訊頁

  週五去買了4張朋友一起看的票，順便領特典。

  否則還真的會怕沒有好位子跟膠捲。

  我是喜歡這部片的，每個人都有個人的微小理由或看點。

  但是否要花錢看4DX或杜比廳，還是會想一下。

  去看之前有被網路言論影響，有人看了5~6次

  甚至說愛情成分比較少，我還真的信了


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  新海城製作的美景。配上少女以及帥哥還是很賞心悅目。

  不知道這樣說對不對，這部片可以好好運用

  「門」、「鎖」的象徵與延伸意涵，但卻沒有用到滿。



  用傳說及天職，描寫天災地震的成因是架空的發想。

  但劇情主軸卻是沒有阻止的現實天災，創造了鈴芽的際遇。



  假設不去看千瘡百孔的部分，12年前的少女遭逢不幸。

  隨親人搬到了九州生活，偶然中一見鍾情踏上追愛之旅。

  這趟旅行遇見形形色色的好人，鈴芽最終踏上故土。

  重拾舊物舊景，面對過去的事實與兒時的自己。

  原來，曾經痛苦而遺忘的那些都很重要，

  而給予自己慰藉的，竟是在未來的明天

  已經變得堅強的自己。


  大綱是天災的前後，人透過自己的整理加上時間變遷走出來。

  感動堆疊的主軸其實是鈴芽母女的單親家庭記憶。

  但是本片混了太多男主宗像及環阿姨的支線。

  更不用說鈴芽跟椅子，兩人獨處LOVELOVE的描寫。

  鈴芽為什麼要去找他？為什麼要去旅行？

  在神明（編劇）或大臣眼中，是命運的必然。

  觀眾眼中是暈船少女不上課去搭訕帥哥，闖了禍得負起責任。

  不顧一切是為了愛，也不畏生死，甚至還加上阻止天災的神聖使命。

  有點過於熱血了，不禁讓人擔心日本關門師怎麼應對這些天災。

  而且對於311震災跟關東大地震只能保持距離描寫之下。

  僅僅12年前的大震災怎麼不提關門師在做什麼呢？


  總之，個人看點還是鈴芽女主的演技與繪製是可愛的。

  大學生芹澤領軍的放老歌公路旅行很香很有趣。

  再次把日本動畫化，沿路交通旅遊及路途與人緣分之美

  絢麗幻獸對決及動物人物動態美作畫

  人設跟作監雕琢的俊男與少女

  懷舊選曲能勾起不同年齡層情懷的歌曲

  由簡到簡刻意解決時空問題的架構

  順順看完，會得到什麼昇華過的家園山河

  鄉土與人的牽絆關係嗎？


  門跟鎖，人心的門與鎖用得不多。

  算是隱晦吧，例如震災衍生的核災事故，

  迫使政府將災區鎖上，居民必須搬遷。

  那些有後門的地方都是變得無人居住，

  所以關門師才要打開禁止進入的鎖進去關門。

  對於這些災害與傷痛，災民的心也上了一道鎖。

  這些東西多講一些，把母親，及鈴芽的心路歷程一起說

  可能會比較聚焦。


  但沒有，還是拍了一場轟轟烈烈的追愛

  個人好雷，但不會推薦給所有身邊朋友


  --'
