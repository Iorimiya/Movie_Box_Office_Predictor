title: 'Re: [大負雷] 鈴芽之旅 超難看'
content: '其實我一開始也覺得是戀愛腦花癡JK


  草太真的有那麼帥?


  結尾才揭曉,原來跟夢中的帥哥長得一模一樣,難怪會追上去


  二刷的時候,我才注意到鈴芽在第一個廢墟找男主時


  自言自語說"好像在哪裡見過""這好像搭訕" 前一句是事實,只是我首刷都只注意第二句


  所以我一開始就戴有色眼鏡,導致快躁了整場


  甚至無聊到跟友人打賭,猜小鈴芽一開始看到的是誰


  朋友認為沒那麼多誤導,就是媽媽,我則是猜草太,不然很難解釋鈴芽在花癡什麼


  在解釋常世時,我們就猜到答案是大鈴芽了,所以女主真的是顏控戀愛腦嗎?


  結果草太站在旁邊,小鈴芽見到的是2個人,勉勉強強能圓啦


  至於片中公路片的部分...我要第3刷才能想起來了


  --

  草太是夢裡見過的帥哥,還跟疑似媽媽的人站一起,所以我認為勉強能圓啦

  雖然鈴芽一開始醒來只喊媽媽,但應該2個人都有夢到吧'
