url: https://www.ptt.cc/bbs/movie/M.1707802195.A.725.html
title: 'Re: [討論] 《鈴芽之旅》過不去的點（雷）'
content: '關於311地震這件事，我也有想過，從電影裡面推測的話

  311是關門失敗，失敗這情形，一開頭溫泉街那段就呈現過

  如果不是遇到鈴芽來協助，光靠草太一人可能就失手了


  至於311是誰失敗的，我推測是草太的父母

  因為閉門師是家業，草太又是從小由爺爺帶大

  以草太大四生22歲來看，311應該是他10歲時發生的事


  也因為父母的關門失敗導致上萬人喪失性命

  讓草太對於關門有龐大的責任感，堅持每一扇門都要確認關好

  甚至無可奈何要當要石，也勉為其難地接受這命運

  既使從要石返回人身，也直接了當地展現活下去的渴望


  寬鬆一點來看，鈴芽跟草太都是311的倖存者，因為成長背景的不同

  鈴芽是不怕死，但草太是想活下去，異同思維的兩人正好可以互補


  」


  --'
