content: "《鈴芽之旅》全台票房破1.69億 登上台灣影史日本電影票房第六名！\n\n《你的名字。》《天氣之子》日本動畫大師新海誠的最新作品《鈴芽之旅》3/2在台上映\n\
  後席捲全台票房，不僅蟬聯三週全台票房冠軍，目前《鈴芽之旅》全台票房更已 #突破1\n億6900萬，超越前作《天氣之子》1億6861萬的票房紀錄，#登上台灣影史日本電影票房第\n\
  6名。\n\n《鈴芽之旅》在日本上映至今票房已達142.5億日圓，同樣於本週超越了《天氣之子》142\n.3億的票房成績，#登上日本影史票房Top14。《鈴芽之旅》的好口碑也持續延燒全球，韓\n\
  國在3月8日上映後累積票房突破243億韓元，累積觀影人次達231萬名，上映至今已 #蟬聯\n17天票房冠軍！《鈴芽之旅》為新海誠過去十年來對於災難、自然、社會面等方面的深刻\n\
