url: https://www.ptt.cc/bbs/movie/M.1677998770.A.BA3.html
title: '[好雷] 鈴芽之旅 すずめの戸締まり'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n整體而言推薦新海誠以及對日本動畫有興趣的人觀賞，\n\
  \n本來是從官方車庫娛樂那邊訂票，他們說順序出貨我沒注意到哪邊有問題\n結果原定要看電影的時間都錯過兩次了都沒拿到票，所以強烈不推薦在車庫訂票。\n\n\n我個人是在板橋的ATMOS廳看的，由於是午夜場，人數不多，所以音效品質很好。\n\
  \                                                不太需要擔心觀眾配音的意思\n\n會選擇特別廳是因為覺得未來應該會在飛機上之類的地方再看過他，所以就在\n\
  IMAX和Dolby擇一。\n\n網路上有些人是說因為外部干擾所以聲音不夠好，低音不夠低之類的，所以\n不推薦板橋ATMOS，不過音效的部分倒是沒有感覺不好，低音也很不錯。\n\
  \n布幕的部分如果影片亮度比較亮，色彩比較純的時候，可以感受到影廳獨有\n屬於布幕自然的花紋，還滿有特色的。\n\n\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n整體劇情是為了喚起大家對於地震的記憶，不過這部分對於日本外的觀眾可能比較難引起\n\
  共鳴，畢竟會重覆一直提起311大概也是日本社會的文化之一。\n\n片頭預告、海報、宣傳其實都沒有提到和地震相關的訊息，如果沒說天災三部曲的話恐怕\n觀賞的人會以「你的名字」這樣的愛情片為前提來觀賞吧?\n\
  \n整部片最大的疑問我覺得應該在「為什麼是椅子」以及椅子的腳是什麼時候少一根的。\n直覺的想法是在海嘯的時候弄斷了，象徵有殘缺的人生，但是帶這個人生繼續走下去。\n\
  但是作者並沒有特別解釋這點，所以我後來覺得這個想法是有點超譯了。\n\n現在我覺得比較像是作者覺得這張椅子很可愛所以就把他從常世還給了鈴芽。\n\n第一次進入常世的鈴芽其實原本不應該離開常世的，\n\
  很多剛失去至親的人會有這樣的心情，會突然失去活下去的動力，\n想要和親人一起到另一個世界。\n\n所以一開始高中生的鈴芽對自己的生命顯得毫不在乎，因為如果不小心死掉了，\n\
  那麼不就正好可以去找媽媽了嗎?\n對鈴芽來說，沒有人可以解釋為什麼天災會這樣降落在像他們這樣無辜的人身上，一切\n只能用機率解釋，「所以生與死只是單純的運氣問題」\n\
  \n但是可以被關上的門出現了，如果真的現實中有這樣的東西，我想各國花上多少經費\n可能也會想辦法用科學的力量關上他的吧?\n\n所以劇情進入了整個主線。\n\n\
  但是在東京的門被開啟時，主角被迫在夥伴(情人?)以及大災難之間選一個。\n上一部天氣之子的主角居然選擇了讓東京淹掉，\n所以原先我以為新海誠這次打算震垮東京。\n\
  \n結果在大臣的反覆提醒之下，鈴芽還是選擇把椅子插入。\n\n但是看來事情並沒有這樣結束，在阿公的提示下一行人回到了鈴芽的故鄉。\n\n這部分中間插入魔女宅急便的\
  \ ルージュの伝言 口紅的傳言真的很有趣，\n被稱為魔女的少女帶著貓去解救一個大學生的旅行。\n順帶一提，這個月底魔女宅急便要在台灣「首次上映」\n\n到了故鄉之後，日記裡面停留在3月11日正式揭開謎底。\n\
  \n接著找到了沒有被資源回收掉的常世之門，然後鈴芽還是沒有在管他阿姨接下來怎麼辦的\n一個人(和兩隻貓)跳入了常世之門，在這個時候鈴芽可能也沒打算回到現世。\n\
  大概只是想要贖罪的概念而已。\n\n後來大臣可能也是認命了，或是左大臣在旁邊只好乖乖聽話，只好變回要石繼續工作。\n\n封印完之後，這時候在時間不斷交錯的常世中發現了小鈴芽，這時候才知道原來在常世\n\
  裡看到的那個人並不是鈴芽的媽媽，而是鈴芽的未來。\n\n接著把缺了腳的椅子繼續傳給小鈴芽。\n\n這部分我有個不確定的地方是到底缺了腳的椅子，是在宗太變回來之後分離出來的，還是\n\
  在小鈴芽開門前就在常世漂流的。以及宗太以及鈴芽離開常世後有沒有把椅子帶回來。\n\n\n但是在這邊的椅子，其實代表的像是對小鈴芽的祝福。\n\n不過據說在先前的訪談中，其中一個沒有被採用的提案是牛奶箱呢。\n\
  \n\n\n\n\n--\n此篇文章以 CC BY-SA 4.0 發表。\n\n咖啡是一種豆漿，\n茶是一種蔬菜湯。\n\n\n--"
