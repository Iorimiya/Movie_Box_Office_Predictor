url: https://www.ptt.cc/bbs/movie/M.1677686970.A.B8F.html
title: '[好雷] 鈴芽之旅-雖然推薦但能處理的事情'
content: "趕在連假尾巴催促著朋友看了搶先場，\n之後應該還會基於推坑其他朋友的目的至少到三刷吧(望)\n(夢時代秀泰寬巨幕第6排剛剛好，\n再往前一排會超出雙眼直視的視野，這次體驗還不錯。)\n\
  \n\n有別於天氣之子、你的名字，\n這次的鈴芽之旅作為誠哥天災系列的第三作，有著明確的主線及收束\n給認為誠哥商業化之後只會想著發糖，不像以前誠哥的觀眾...\n\
  這次了。\n\n\n以下主要點出認為應該可以處理的部分\n\n\n\n\n*你的名字：\n瀧跟三葉的塑造分配的剛剛好，\n雙方在筆談(笑)的日常中都有讓彼此的性格顯露，\n\
  所以都能對彼此有一定認識\n\n**天氣之子：\n雖然節奏上沒有君名來的好，\n但帆高跟陽菜的背景其實也相當單純，\n在母親過世後與弟弟相依為命的陽菜顯得早熟，\n\
  受不了家中高壓離家出走的帆高顯得稚氣，\n也很明確凸顯彼此的特徵\n\n但來到鈴芽之旅的部分，\n草太的資訊就是知道是大學生、關(閉)門師無法糊口所以要考教師，\n\
  但關於草太的個性、心路歷程之類的塑造可說是一丁點也沒有\n即便鈴芽之旅實際上是著重於鈴芽向未來進發的故事，\n但作為一個促使鈴芽踏上這趟旅程動機之一的重要角色，\n\
  卻只是像發任務NPC一樣的存在，就相當突兀。\n\n甚至讓人覺得，草太看起來根本沒有對於\"生\"的堅持，\n要不是鈴芽一頭熱的投入，那其實草太作為要石也沒有任何不妥的地方吧?\n\
  在草太將要沉入深淵的演出時，應該就該在此處穿插草太的過往...\n只有鈴芽想要救草太嗎? 草太本身沒有什麼想要作的事嗎?\n草太自我消失成為要石那邊帶的就很快，其實應該要有點掙扎的吧(苦笑)\n\
  \n\n\n鈴芽高二可推測約16~17歲，311大地震發生時為4歲，\n代表311在本篇故事開始的12~13年前\n\n草太為大學生並且正處於進行教師甄試的階段，\n\
  應該是大四生，推測為22歲左右，\n那311大地震發生時約9~10歲...\n那當時的關(閉)門師是誰擔任的?\n為什麼本篇故事時只剩他跟爺爺?\n--以下為希望加入的處理方式--\n\
  如果草太的父母親是在從事閉門師的時候遭遇311大地震，\n或是以故事提供的設定，沒有鎮壓好引發311大地震的\"蚯蚓\"，\n所以導致311大地震發生，連同父母也喪生，\n\
  那草太跟鈴芽就是有著同樣傷口的兩人，\n只要加入這樣的背景也就可以完成一個雙向救贖的故事...\n----------------------------\n\
  但實際上，草太在常世醒來後，也沒有對於311有觸景傷情的感受，\n因此應該對於311是不知情或沒有直接參與到事件，\n所以要說草太跟鈴芽在過程中有什麼吊橋效應，還真是沒有那種共患難意識的共鳴感。\n\
  \n另外既然故事中地震的發生是常世的蚯蚓進到現世中造成，\n故事中的311大地震是為何發生應該也要用此設定解釋，\n既然關(閉)門師看一個古老還流傳至今的職業，\n\
  那當時的東石跟西石是否也有狀況，是什麼原因造成的?\n爺爺有參與那時的事件嗎?\n這邊沒有用設定去解釋感覺有點怪。\n\n\n為什麼大臣要把草太變成椅子?\n\
  但最後又要鈴芽親手將祂\"回復原狀\"\n看完全篇，\"人\"本身似乎是無法直接成為要石的，得先變成器物，\n以大臣對草太說職責已經轉移到你身上了，\n後來也一直跟鈴芽說，草太已經不是人了這兩點大概可以得證...\n\
  那是不是因為最初鈴芽無心對大臣講的那句話造成的呢?\n\"你要不要來當我家的貓\"\n導致大臣起先不想作回要石，並且對草太說討厭呢?\n\n與其說大臣是一般人認知的神靈，\n\
  更像是所謂的\"付喪神\"，器物經過長年累月有了自己的意志或說是被常世中的靈體寄宿，\n所以並不具備所謂的\"神性\"，對於職責也比較像是一般人的概念...\n\
  如果變成貓的樣子代表因為被貓靈寄宿所以有著前後反覆的表現似乎可以說得過去...嗎?\n\n想想還是有些不解之處...\n\n\n\n\n在看完你的名字和天氣之子時，都有種，這樣就結束了嗎...的感受\n\
  但鈴芽之旅最後回收伏筆的時刻讓人眼睛為之一亮，也相當感動。\n\n鈴芽(4歲)時不能接受媽媽突然不見的事實，\n這時候的鈴芽需要母親的象徵，就是母親親手做的椅子，\n\
  所以鈴芽(高二)將椅子交給鈴芽(4歲)\n鈴芽(4歲)才願離開常世回到現世，\n鈴芽(高二)決定要繼續往前邁進，所以已經不需要椅子\n最後鎖上自己最初打開的這扇通往常世的門，說到\"\
  我要出發了\"\n這邊的意境真的非常好，\n\"揮別過去，走出傷痛，往明天出發。\"\n\n\n\n但說真的，這一段後來越想越不對勁(苦笑)\n\n\n\n最後回收伏筆的部分，可以解釋為何環阿姨找到鈴芽(4歲)時，\n\
  為什麼手上抱著一把三隻腳的椅子...\n但同時也有個很大的問題產生...\n如果鈴芽的記憶中，\n在常世內看見的其實是自己(4歲)跟自己(高二)會面的情況，\n\
  環阿姨在風雪中找到鈴芽(4歲)時就抱著三隻腳的椅子這點沒問題，\n因為故事本篇中那隻椅子是三隻腳的，所以她交給小鈴芽時就是三隻腳的狀態，\n\n那麼...\n\n\
  \n\n到現在都還沒辦法想到一個合理的解釋，誠哥你的常世設定有BUG阿...(拖\n\n\n\n\n--\n                         \
  \                03/02 00:14\ncp廚表示憤慨(拖\n沒要求很多，真的多幾幕畫面就好，人物就會立體很多\n草太太平板了，連芹澤都比較有特色XD\n\
  \n\n因為常世是所有時間的匯集地，用這個去解應該是比較好的\n一開始本來在想椅子不是從外面帶進去的嗎，但草太變回人的時候椅子好像也不見了?\n這邊之後二、三刷時再留意一下...\n\
  \n\n老實講一開始是帶著cp腦的在看的，不過這部在親情上的著墨還更多\n但補足草太背景，就算不交往，對於草太本身巡迴日本各地關門，\n也比較好佐證他本身這麼強烈的責任感..."
