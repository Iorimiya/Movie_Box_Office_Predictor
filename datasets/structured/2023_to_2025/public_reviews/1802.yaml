title: 'Re: [普雷] 鈴芽之旅 — 讓人意難平的感情線'
content: '昨天剛看完鈴芽

  其實新海誠看習慣了

  真的會覺得鈴芽的感情過於平淡

  畢竟新海誠的習慣

  感情戲就是苦情到不可思議

  甚至我覺得鈴芽的愛情成分也不高

  更多的是一種不愛惜生命的自我毀滅


  秒速五公分

  小時候的回憶困住男主一輩子


  星之聲

  隨著距離越來越遠，遠到光年之外

  一則訊息需要八年才會送達

  男女主卻始終惦記著對方


  雲之彼端

  男主像是自虐一樣

  每天跑去車站假裝等人再孤單走回家


  你的名字

  互相體驗對方生活

  最後拚盡全力想要拯救隕石災難


  天氣之子

  為了愛人寧願讓東京沉默

  同時這齣還隱含一個概念

  沒有什麼氣候是異常的

  人類過於渺小不要妄想干預大自然


  相較之下

  鈴芽之旅一整齣戲其實男女主互動超少

  更多的是鈴芽一個人的成長

  所以這齣戲其實重點不在男女情愛

  而是家人 朋友的感情

  以及歷劫以後的自我救贖


  最震撼的點

  莫過於翻開日記本

  311以後全部塗黑的段落


  特別是跟我同行有921的罹難家屬

  真的就是像鈴芽那樣

  時不時會冒出那種不愛惜自己生命的想法

  所以她在看的時候很多地方都直接大爆哭


  我自己的感想

  鈴芽之旅很早就開始趕主線

  所以整個劇情節奏流暢

  順到不像是新海誠

  所以我自己是滿喜歡的


  個人排名

  言葉 君名 = 鈴芽 秒五天氣


  其他幾部新海誠沒有列入

  就是覺得缺點明顯

  有興趣可以看

  沒補到也不會覺得很可惜的


  -----

  Sent from JPTT on my Vivo V2126.


  --

  我覺得你們說的都很對

  其實作者在訪談裡面有提過

  比起各種跌宕起伏刻骨銘心的愛情

  一般人的生活本來就是什麼都沒有


  這種感覺大概是

  或許曾經有過青梅竹馬

  或許曾經有過留有遺憾未能在一起的小情人

  或許你一往情深地放不下他

  但是這在外人看起來其實都微不足道

  也沒有真的那麼多人甘願等你五年十年

  不如收拾好自己重新出發


  如果你小時候有類似經歷會覺得很痛

  當年瀧和三葉在樓梯上錯過

  一堆人嚇到差點PTSD'
