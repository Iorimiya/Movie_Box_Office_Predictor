  後面左大臣真的帥

  大臣真的屁孩


  不過阻止東京地震那邊

  真想喊一句

  我的鑽頭是突破蚯蚓的鑽頭



  然後隔壁肥仔一直講話真的幹

  笑我是沒差

  一直講一些沒梗

  真欠捶



  -----

  Sent from  on my iPhone


