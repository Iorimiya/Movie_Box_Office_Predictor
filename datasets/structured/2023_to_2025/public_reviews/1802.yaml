url: https://www.ptt.cc/bbs/movie/M.1678687237.A.5B1.html
title: '[普雷] 鈴芽之旅——12年的羈絆'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  防黑前提

  本人從來沒有看過任何新海誠的作品

  甚至上一次進電影院看日本動畫片

  是18年前的《霍爾的城堡》

  因此以下都是我淺陋想法～


  在2個小時的觀影過程中

  我總共落淚了兩次

  一次是鈴芽將要石化草太插進蚯蚓時

  說了句類似：「我不想再承受這些了」的話

  （忘記原話了，再麻煩神人補充）

  手拿著已逝母親親手製作的遺物

  又要面臨這個讓她燃起新生的人的離開

  對於一個女高中生而言

  這種情感上的剝奪感真的很讓人心碎


  第二次則是鈴芽翻著日記本

  看著3/11以後的頁面全部被塗黑

  等於再次自揭傷疤

  重新面對母親的離去

  我個人對這種親情加上生離死別的描寫極無防備心

  嘩一下就落淚了……

  但，真的就一下下

  因為再連結到最後大小鈴芽的會面時

  老實說我覺得霸鈴芽那段話雖然感人

  但真的有點冗長，說教意味也過重

  大概是我太先入為主認為一部想要老少皆宜的作品裡

  至少會有一個核心議題

  所以在我還沒搞懂的時候

  想說她對4歲的小孩講這些最好是聽得懂？？

  導致我自己覺得高潮衝擊力度稍嫌不足


  而後我才從她的童年去思考災後振作的議題

  才慢慢體會出其中不斷穿插的童年夢境、

  後面提及的12年來沒有回過老家

  一直在暗示鈴芽根本沒有從悲傷走出來過

  直到遇到了草太後

  和他一起直面其他人的回憶

  替其他受害者關上門，封印傷痛後

  才反過來去勇敢面對自己的不安

  看清楚夢境裡的媽媽不是媽媽

  而是不得不面對的「鈴芽的明天」

  這部分倒是寫得既平淡又令人嘆息

  「我出發了」

  ——不用忘記傷痛，但請將此化成努力前進的動力。


  最後

  如果新海誠是真的想把草太置入戀愛線的話

  那就恕我超譯一下

  除了一開始鈴芽看到那張文青帥臉的小花癡外

  我很難說服自己鈴芽對他有真正的男女情愛

  更多的應是將母親的情感遺憾轉移到草太身上

  畢竟女高中生對一個80%時間

  都是以遺物椅子之姿出現的人物

  要產生些什麼特別情愫的話

  大抵都是由對母親的想念分支而生


  再者

  他們又一起完成了許多在阿姨管教下無法達成的事

  這是一種前所未有的自由

  更是會讓人產生：「如果媽媽在，她也會這樣陪我上山下海吧？」的錯覺

  也就更能解釋她為什麼敢衝到素未謀面的斷手阿公面前

  還可以大喊「我的世界不能沒有他～～」了

  鈴芽寧願赴死

  也要與對母親的唯一情感憑藉同生共死

  但反過來說

  「關門師」這個家傳世代的職業

  也可以象徵這世上每個人身負的一點責任

  如果身邊有親朋好友正處於這種痛苦

  與其袖手旁觀

  不如一起想辦法如何引導其正確面對傷痛


  再連結到本片結尾的呼告

  雖然強調的是「自己拯救自己」

  但個人認為其實阿姨和芹澤這兩個角色

  側面強化了「珍惜」的議題

  當人自認失去所有時

  可以看看身邊還有替你犧牲奉獻的家人

  或者雖然嘴賤但還是到哪都想著你的朋友

  而「要石」或許算是一種歷史之鏡

  照著歷史中令人難過的一面

  而不論面對任何天災人禍

  我們都有責任記取教訓

  而不是拔起丟棄、置之不理

  如此一來只會重蹈覆轍而已


  總結而論

  個人認為劇情的高潮迭起不是很吸引人

  沒有什麼會讓人倒抽一口氣的經典畫面

  或許是想描寫災戶們的心理狀態吧

  即真正的傷痛是和日常共處

  卻又要表現得若無其事

  因此我暫時沒有想二刷的慾望

  但本片背後的議題也算是一種精神上的撫慰

  也希望未來的世界可以不再讓更多人留下遺憾


  個人疑問：

  1、蚯蚓的動畫是真的偏粗糙還是新海誠的特色？

  2、在草太家看到的關門師秘笈中，被塗黑的部分到底是什麼？



  --'
