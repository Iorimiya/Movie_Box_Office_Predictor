title: '[普雷] 鈴芽之旅 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  電影板第一次發文～金魚腦如我只記得個大概


  寫的零零落落的還請見諒



  先說最大感想 個人覺得這部片的劇情就跟中文劇名一樣的直白


  然後女主角腦衝的種種舉動 反映了高中那個年紀的單純（蠢？）


  因為無意間打開廢墟中的後門 又把白貓要石拔出來 害男主變椅子的自責感之外


  多少還是參雜了一些莫名對男主角的感情


  才開啟了這一段從九州到仙台的鈴芽之旅


  但是對男主角草太的感情到底由何而來 明明就素昧平生的路人 也沒相處多久


  就跟著變成椅子的男主角追著白貓（大臣）到處去關門


  果然還是人帥真好比較能夠解釋了吧


  白貓從要石變成貓以後 就任性邪惡的搗亂


  可是到最後又突然乖乖回去當要石 心境轉變太快 覺得不太合理



  最喜歡的段落 是芹澤開車載著大家去仙台的那段


  每次換播的歌曲 對照劇情發展都很有意思


  看到這段也會想到在日本自駕的時光 也是愜意的邊聽歌邊開車



  這次是在青埔新光影城的LUXE廳看的


  音響跟畫面效果都很好 只是感覺劇情普通了一點


  以上簡短心得


  ps.完全沒到哭點 但左右兩邊都有人在啜泣（？）


  --'
