url: https://www.ptt.cc/bbs/movie/M.1670250007.A.A15.html
title: '[新聞] 「鈴芽之旅」還是「鈴芽的門鎖」'
content: '新聞網址：


  東森新聞


  「鈴芽之旅」還是「鈴芽的門鎖」　新海誠最新電影中文片名引討論


  日本動畫大師「新海誠」暌違三年所推出全新作品《すずめの戸締まり》，在日本上映後

  繳出相當不錯成績。台灣部分官方先前也公布，中文片名正式確定為 《鈴芽之旅》。不

  過因為之前，大家都把電影翻譯為《鈴芽的門鎖》，因此這次官方中文片名出爐後也引起

  不小討論。


  《鈴芽之旅》上映前三天票房就高達18.8億日圓，並吸引破百萬人進場，該數據也打破新

  海誠自己電影「你的名字、天氣之子」紀錄。截至目前為止，《鈴芽之旅》已經突破75億

  日圓再創紀錄，突破百億指日可待。日本推特上，不少觀眾紛紛表達自己的感想，並提到

  電影結束後，全場都獻上掌聲，甚至許多人都哭著走出戲院。


  台灣部分，目前僅確定會在台上映時間則尚未公布，GaragePlay車庫娛樂上周也宣布，經

  與日方多次溝通確認中文片名為 《鈴芽之旅》。不過因為之前，大家都把電影翻譯為《

  鈴芽的門鎖》，消息一出也引起兩派討論。


  許多網友表示，「還我門鎖，鈴芽之旅好沒感覺」、「神秘魔幻氛圍都沒了」、「喜歡之

  前的名字」；但也有網友回應，「尊重官方的片名」、「不管什麼名字我都看爆」、「鈴

  芽之旅不錯呀」、「上映日期比較重要啦」 。



  --


  我覺得比照英文單翻鈴芽就好，


  翻成這麼無聊的名字還不如翻成鈴芽的俐嘴。


  --'
