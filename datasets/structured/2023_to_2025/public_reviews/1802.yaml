url: https://www.ptt.cc/bbs/movie/M.1679315950.A.73F.html
title: '[新聞] 《鈴芽之旅》全台票房破1.5億 國語版由'
content: '新聞網址：


  《鈴芽之旅》全台票房破1.5億 國語版由22位大咖老師配音


  16:212023/03/20 中時  李承陽


  《你的名字》、《天氣之子》日本動畫大師新海誠的最新作品《鈴芽之旅》上映後席捲全

  球票房，在台灣上周末更力壓新片《沙贊！眾神之怒》，蟬聯三周全台票房冠軍，這也是

  導演新海誠的電影首度在台灣拿下三周票房冠軍，寫下新海誠在台票房新紀錄。


  目前《鈴芽之旅》全台票房已突破1億5千萬，預計本周將超越《天氣之子》登上台灣影史

  日本電影票房第6名；而《鈴芽之旅》在日本上映後至今票房已突破142億，不僅獲選第73

  屆柏林影展正式競賽片，更榮獲第46屆「日本奧斯卡」日本電影學院獎最佳配樂獎；韓國

  在3月8日上映後至今累積票房突破206億韓元，累積觀影人次達195萬名，上映至今12天蟬

  聯票房冠軍。


  《鈴芽之旅》國語配音版也於17日登上大銀幕，這也是新海誠的作品在台首次上映國語配

  音版本，國語版配音老師也是大有來頭，包含女主角岩戶鈴芽由《龍與雀斑公主－內藤鈴

  》鄭可欣配音；宗像草太則是《七龍珠超布羅利－布羅利》莊汶錡聲演；可愛的貓咪大臣

  則是6歲的蘇蘊佳擔任配音；曾擔任過江戶川柯南、野原新之助聲優的曾允凡則是聲演鈴

  芽阿姨的岩戶環一角，配角群更有許雲雲、張乃文、蘇振威、江志倫、陳進益、石班瑜等

  22位資深實力派配音老師參與。


  --'
