content: '萬

  草

  見

  又



  我沒有看過新海誠前面任何電影



  我的邏輯是



  如果誠粉覺得誠哥有辦法有能力把感情線演好


  那他就不可能不知道這部戀愛線有點薄弱



  所以就是他故意而為之


  不是這麼想把戀愛占比這麼重


  想讓觀眾著眼其他他想表達的東西


  所以我是覺得RIVER的講法比較合理的




  當然也可能是他第一次把戀愛的成分降低


  想傳達更多事情


  但仍然想有戀愛的元素


  沒有拿捏好


  讓大家有奇怪的感覺






  總之有被治癒到就好了


  這部真的很治癒人心啊～


  --'
