url: https://www.ptt.cc/bbs/movie/M.1678123535.A.940.html
title: '[好雷] 鈴芽之旅 觀影者的療癒之旅'
content: '雷文防雷資訊頁


  這部電影讓我自己感受到最深的 是一種療癒


  也許他的情節 世界觀設定 沒有解析的這麼清楚


  但我認為 畫面 音樂 場面 感動點 都有 可圈可點


  尤其是情節的設定 在很多橋段裡 有別出心裁的趣味性


  無論你認不認為 這樣的趣味點 在整個電影的主軸上 是否無關緊要


  但至少在看電影的當下 你會覺得這是部精采的電影


  之所以這樣說 是為了平衡不爆雷 和想推薦的想法


  才用比較偏頗的 主觀的 忽略劇情線的說法做推薦


  總之 如果你不是那麼在意要把一部電影當作邏輯推理來看 我覺得是部好看的電影





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~























  這部電影裡面最大的問題點 我認為就是在於那隻貓 用劇中的名字代稱 就是大臣


  很多人糾結在大臣做非常多事情的邏輯性 這點我自己倒是透過一些拼湊


  給了自己一個自圓其說的理解


  這個理由其實也不是我自己想到的 因為我看完電影也有同樣的疑問


  「這貓超級奇怪的 明明前面故意招黑 後面直接洗白是怎樣


  那他幹嘛這麼無聊把男主角變成要石？」



  後來我老婆直接回我：「男主角不就說了嗎 神是任性的」


  雖然我覺得有點瞎 但坦白說 你這樣想 其實很多東西就很合理




  為什麼只有女主角可以拔出要石？ 因為她是女主角阿(開玩笑)


  我總覺得這個點不用太糾結 你總可以找到理由的


  比如 她是災戶 有讓貓貓想守護的氣息 也可能她是少見活著進出過常世的人


  讓貓貓有熟悉的氣息 但反正 主角身上有一些特別之處 我覺得大家都能接受吧



  為什麼貓貓要選擇把草太變成要石？


  我個人認為 同前述 因為祂任性阿 祂就想跟鈴芽玩


  而且祂自己知道 當祂脫困的剎那 祂就不再擁有那個責任


  可能對於祂來說 是一種必然吧 祂得選擇一個人去做傳承


  其實這也很符合爺爺在醫院裡面的坦然 關門師或許某個層面上


  也有成為要石的歷史 或說責任 因此他並不意外


  而且爺爺對大黑貓說(有一幕在窗外) 您終於也脫困了


  不就代表他知道 成為要石不是死亡 只是一個責任


  那為什麼要感覺到無限感傷 這不就是關門師應該要做的嗎



  又談到為什麼祂要一直跑


  這個我覺得也滿能理解的


  「因為草太很煩阿」


  大臣如果留在鈴芽身邊 那祂就要面對一個超級大電燈泡


  而且祂應該懶的去跟草太解釋 祂自己已經解封了 要石的責任被傳承了


  與其留在當下跟這兩個人糾纏 不如引著他們去不同的後門解決問題


  我認為這對於祂的神性來說 還是挺對得起的


  從一個宏觀的角度來看


  1.祂對得起自己的職責 畢竟祂也指引了關門師方向


  2.祂根本不覺得草太成為要石有什麼不可以(那又為什麼只能祂是要石？)


  從劇情中來理解 大臣的心智水準 大概就7歲上下 完全是個屁孩


  至於他為什麼每次壞壞的說 有很多人會死哦


  從祂為神的角度來看 雖然壓制蚯蚓是祂的使命 但要石不是祂了 後門也指引了


  這些人死不死到底跟祂有什麼關係？祂也從來沒阻止過鈴芽去關門阿


  這可能就像有些官員的心態吧 阿我能做的都做了 事情還是發生了跟我什麼關係


  我為什麼要拿命去博？或是拼老命做些什麼事情 更何況 祂是神欸


  另外一點是 「這個很好玩嘛」一個當石頭這麼久的智慧體 愛玩不為過吧



  為什麼大黑貓(應該是左大臣)可以自行解封 我覺得這是具備必然性的


  先談談為什麼他直接控制了阿姨


  讓我有點想到大黑佛母 就像有些神是瘟神 是瘟疫神


  與其說控制 不如說祂只是讓阿姨直面本心


  祂並不是「控制阿姨去說出違心的話」


  而是讓阿姨說出心中深藏很久 不願說出口的話


  從神的角度來說 祂無惡意 是一種釋放


  更何況對應電影每次關上門會出現的「人們的聲音」來看


  神習慣的氛圍 應該是一些熱絡 真誠 原始的本心


  講回前面提到的必然性


  無論大黑貓是因為大臣的解封而解封 還是自然解封


  可以看的出來祂是比較成熟的那隻貓


  祂可能知道 祂必須要確認另外一塊要石被傳承到誰的手上


  或是說 祂這樣的行為 只是完成一次重新的封印而已


  有些人困惑為什麼要「藉人之手」


  那你怎麼不好奇 為什麼神不能自己關門？


  封印鬆動了 關門需要關門師(有這個天資的人-看起來反正鈴芽就是)


  那麼找到鈴芽 讓祂重新穩定兩個要石去封印蚯蚓 不是很合理嗎？


  終歸-劇情告訴你 大黑貓的封印就是鬆動了 那麼重新封印 就成為必然



  為什麼大臣可以決定是否成為要石？


  我覺得電影當中的流程是有一個解釋的


  我猜 必須要完成一個要石的轉換才有辦法


  也就是說 草太變成椅子的當下 只是擁有成為要石的資格


  但他沒有真正成為要石前 是不具備轉換這個資格的能力的


  另外 也不單純說大臣能指定誰為要石


  當鈴芽在拔出草太的要石的當下 她自己本身也在結冰


  可以說 如果沒有大臣的幫忙 鈴芽就會代替草太成為下一個要石


  只是大臣在那個瞬間 祂把這個轉換引回到祂自己身上而已


  至於鈴芽為什麼可以拔出草太？


  與其說是拔出草太的要石，不如說，她用她的愛意把草太喚醒了


  其實這些劇情裡面都是有提到的


  如果不是因為鈴芽的吻和呼喚 幾次的讓草太能再醒過來 也許他早就要石化了


  也呼應前面提到的 要石化不是死亡 而是一種神化 具備功能性的神化


  那麼爺爺之所以不那麼難過 應該就可以理解了



  --------------------------------------------------------


  以下講講我認為的缺點吧


  我認為這部電影最大的敗筆 在於草太變成椅子


  也就是因為這樣 戀愛的氛圍很難展現


  其實以一個高中生的視角 尤其是大災後失去親人的心態


  在這種生死共歷的過程中 日久生情是相當可以接受的


  大家想想 如果那一天 草太被鈴芽用一個吻親醒了


  你還會覺得她愛上草太很突兀嗎？


  她知道她自己親的不是一張椅子 是一個男人 那麼關於愛上了這件事情 是可以理解的


  我覺得草太可以用漸凍人的形式來表達 可能會更好一點



  另外還是關於椅子的 只有三隻腳這件事情 真的是很大的缺漏點


  這樣設計 卻沒有任何著墨 滿可惜的 如果這個部分能加入和媽媽的互動


  甚至是更充分的解釋她之所以可以進入常世 應該也更能詮釋草太能以椅子的型態


  成為要石的意義


  除此之外


  我覺得這部電影相當棒


  很多人詬病的 關門次數太多 其實我不那麼認為呀


  鈴芽之旅的概念 就在於旅行 或是說 觀眾也陪著她在旅行


  她的每一段旅行 我認為有作者的溫情 因為她感受到的都是溫情


  而這些際遇 也溫暖著觀眾 甚至是那些災後的人們


  告訴他們「雨後有彩虹」 電影本身想傳遞的 本來就是希望


  對於未來的想望


  鈴芽結尾關上門的那句話 我忘了 有人記得可以提醒我一下


  但我對於那句話的感受是記得的 終歸她想表達的意思就是


  她從童年的傷痛裡面走出來了 這也是這趟旅程的意義吧



  總之 我們陪著她 經受了一段被這個世界治癒 也被自己治癒的過程


  而且有這麼美的畫面和音樂 我是挺喜歡這部電影的



  --

  我個人對於這個論點 不是很支持

  萬年救援天能 我個人可以說看不是很懂

  但如果我說天能完全是個爛片 根據電影版的風向我肯定是被噴爛

  天能粉只會說：我看不懂是我程度低


  當年星爺大話西遊 一度被認為是相當爛的破片

  幾年之後被各種剖析平反 其實同理讓子彈飛也有同樣的狀況


  所以我覺得 花大量心力腦補 或說解讀 不是一部電影好不好的依據

  而是你研究過 思考過 得出了一個結論後 這個結論合不合理


  如果大臣基於任性的解釋 解讀他的行為 我們一樣認為 完全不合理

  那我可以接受這個角色的塑造相當失敗

  但我就是覺得 其實挺合理的阿0.0

  哈哈 你說的


  那我只能給你我個人的進階版認定了

  我覺得寄生上流也是部爛片

  捍衛戰士2其實只是普通偏上

  這電影好像都走這種路線 我覺得可能是他想講的東西太多了


  還有一個很大的重點也是這樣表現的 就是開頭有講過：常世是所有時間的交會點

  如同我文章裡說的 如果親椅子 改成親真人 好像就可以接受多了

  但我必須說 我也覺得這句話 我瞬間有出戲 後來我是說服我自己 他只是個高中生...

  我個人認為是電影視角的關係 通常這種東西不會只有一家傳承才對'
