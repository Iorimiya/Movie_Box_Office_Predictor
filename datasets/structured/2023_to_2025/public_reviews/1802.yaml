title: 'Re: [好雷]  鈴芽之旅'
content: '原文恕刪，前文先給想看什麼特殊廳版本的版友們，原文隔壁版也有


  這次為了特典跟上映日期對我有其意義，所以光這週就看了五次，但奈何IMAX實在抽不出時間，所以單就新光三種規格的廳說一下。


  搶先場看的是LUXE廳，銀幕明亮清晰滿版，重低音震撼強烈，但細部音效稍嫌不足，會被蓋過去。


  杜比廳的光影跟LUXE完全是不同等級的東西，除了轉場跟鈴芽的標題有夠黑以外，那個光

  線真的會刺眼，場景更加明亮深沉，畫質整個大提升，儘管LUXE表現已是相當不錯，但依舊在杜比面前被壓下去，有杜比規格的動畫片真的不一樣。但音效方面就是空間感、舒服，就像在現場一樣，不會有任何一方的聲音被蓋過去，但就不若LUXE來的猛烈，所以偏好音效可以選LUXE，喜歡細緻細節再選杜比，但個人認為這部片就是該看杜比。


  最後就是一般數位，為了特典去看的，正常發揮水準，而且最重要的是4K投影，然後放的是一般廳的最大廳，銀幕大小接近LUXE廳，以桃園其他戲院一般廳來說，我認為是一般數位廳的最佳選擇。


  這次車庫不是我要說，我3/2當天在青埔新光看的時候沒有看到場佈，今天看就有了，到底是發生什麼事？然後聽說每週可能都有不同特典，沒關係，我會看到下檔為止，我真的很愛這部片，因為完全跟自己的人生經歷有關。






  以下可能有雷請斟酌


  其實板上的分析討論應該都很詳細了，包含蚯蚓發生的地點都是過去曾發生過大地震的地區，草太跟鈴芽的名字也是取自於日本民俗神話傳說；至於大臣要石的部分，原本的記載是在百年前關東大地震中有一個要石毀滅，才由一個年輕的孤兒繼承要石，那麼大臣那些後續的行為其實一切都說得通。


  我自己本身算是921重災區的附近，我還記得我當年是怎麼被父母抱出去的，睜開眼看見家中東西散落滿地，附近的房子東倒西歪，學校也因為地震龜裂整修，還有很多學校倒塌的同學轉學過來，沒想過時間已過了那麼久，所以我完全可以理解鈴芽小時候的行為，長大後選擇性遺忘，還有那些曾經出現在夢中後來卻實現的場景。


  我很喜歡電影裡的那些人日常，因為你永遠不知道下一秒會變成怎樣的人生，當你在試著拯救，但底下的人卻一無所知對於即將發生的災難無感，那是一種深沉無力的痛，個人感受比災難來臨之後更為難受。



  我跟多數人的哭點不太一樣，我對於關門的那一刻最深刻，因為那個剎那間封存在廢墟的記憶全部湧現，曾經繁華如今空蕩，我個人也是很喜歡去找尋祕境廢墟，我會在廢墟裡回想那些過往的足跡，沉靜在此時此地此刻。


  阿姨跟鈴芽的對白，大鈴芽跟小鈴芽的對白，這些都是我曾經歷過或感受過，非常的真實，但怕過度渲染情緒，因此可以理解用比較平淡的講完這個故事。


  還有我其實本來要說的是原聲帶，這次的取捨非常棒，我一直認為電影配樂就應該是襯托電影，相輔相成，而不是讓歌曲搶走電影的風采，因此後來也在原聲帶上收錄了沒有放在電影裡的歌曲；但作為電影主題曲跟配樂，我相當的喜歡，切入的恰到好處，配樂用神道教的鈴聲作為起承轉合，老實說這三部我最喜歡這一部，我真的聽到每次都會想哭


  結尾的對話



  向神明祈禱，浮現過往的生活



  與千果的相遇



  拯救草太



  出發前往家鄉東北

  主題曲在結尾下的很好



  最後當然要


  真的是很厲害


  當然不得不提，新海誠選的那些經典歌曲也超厲害，好聽又符合當下的狀況心境，有趣又幽默，讓人重新認識老歌，新海誠還是那個浪漫的新海誠，只是多了點溫柔。


  我可能還不夠資深，但我也看完新海誠的所有作品，我想說的是人都會隨著經歷心境而有所不同，這樣的改變都是很正常的，只是看自己能不能接受，再說這三部曲說是商業通俗化，但其實也塞進不少新海誠想表達的一些內容，如果沒有塞的話就是一般通俗作品，而不是那種讓人非常喜歡&討厭的作品了，認真說有在搞事只是被拉住了，不過非常剛好的，這次我很喜歡。



  最後再附上一些我喜歡的對白


  「我知道生命短暫，死亡可能隨時會來臨，即使如此，再一年，再一天，就算只是再一小時也好，我們都想要活下去！」


  「生死不過是運氣罷了！」


  「不管現在有多麼悲傷，今後還是會順利長大。所以別擔心，未來一點都不可怕！」


  「你今後也會喜歡上別人，也會遇到許多很喜歡你的人。雖然你現在可能覺得一片黑暗，可是早晨總是會來臨。」


  「我是明天的鈴芽。」



  -----

  Sent from JPTT on my Sony XQ-BC72.


  --'
