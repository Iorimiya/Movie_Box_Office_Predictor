title: '[討論]  鈴芽之旅>你的名字？'
content: '以下不會有鈴芽之旅劇透 但會有個人的小結論 請斟酌閱讀




















  看到有些朋友說鈴芽>你名 所以想來討論看看


  你的名字在我心目中是神作等級作品

  劇情節奏、內容

  音樂

  男女感情

  反轉

  無可挑剔

  尤其時最後瀧寫在三葉手上居然不是名字而是「我喜歡你」真的太讓我感動到


  如果說你的名字可以給95分 鈴芽之旅個人大概給85分


  鈴芽之旅

  講點自己的心得結論

  優點：

  劇情節奏搭配音樂真的很猛

  地震恐懼也給的很好 尤其是地震警報

  音效特效畫面也是很頂不用說

  結局中上

  缺點：

  劇情普上 沒有一點讓我出乎意料或反轉

  男主女主感情太薄弱 這點讓我扣最多分

  親情 普通


  不過鈴芽之旅整體觀影體驗還是非常不錯的 非常推薦進電影院觀賞 不會後悔的


  我覺得鈴芽之旅把缺點修一修真的有機會成為心目中的神作，可惜了，不過雖然不是神作

  但也是部不錯作品了


  個人覺得你的名字>鈴芽之旅


  討論看看八







  --'
