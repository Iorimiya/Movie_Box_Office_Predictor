url: https://www.ptt.cc/bbs/movie/M.1677591041.A.256.html
title: '[好雷]鈴芽之旅，連假人擠人值得搶先'
content: "《鈴芽之旅》於3月2日全台上映，特別搶先場則於2月25日至28日開始上映，對於前作《\n你的名字》、《天氣之子》唯美畫面，富有感染力的音效非常對我的胃口，此次新海誠風\n\
  格的新作令我非常期待。剛好連假4天有空，立馬參加搶先場體驗聲光饗宴。當天場場爆\n滿，票有點難訂，現場從大人到小孩都有，涵蓋各年齡層。觀影結束後果然不出所料，沒\n\
  有讓我失望！\n\n\n《你的名字》：4.9星☆\n《天氣之子》 :4.2星☆\n\n\n我心中的神作還是《你的名字》，但是《鈴芽之旅》動畫內容也非常精彩，我也認為值得\n\
  一看，值得2\n刷\n\n\n\n\n\n\n\n\n\n雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\n\
  \n1.  劇情概述\n2.  好雷一：熱血的故事\n3.  好雷二：無法自理的貓控必看\n4.  好雷三：刻畫現實的傷痛與自我內在小孩對話\n5.  整體概述\n\
  \n\n\n\n\n《鈴芽之旅》（日語：すずめの戸締まり），是日本動畫導演新海誠的最新作品，因前作\n《你的名字》、《天氣之子》後，接續第三部包含災難題材的電影，也被稱作新海誠的《\n\
  災難三部曲》，此次選用日本311大地震為故事題材，講述背負著守護人類使命「關門師\n」草太與鈴芽冒險的旅程。\n\n\n\n\n 故事一開始由高中少女鈴芽，一樣的熱血3件套：女高中生（青春）＋馬尾（可愛\n\
  活潑）＋腳踏車（熱血），邂逅守護人類的帥氣「關門師」草太。鈴芽從一見頃心，到翹\n課想進一步搭訕草太，最後不小心捲入踏上「關門」冒險旅程（只能說人帥真好）。\n\
  \n\n   故事從關門師的使命展開，旅行各地把象徵地震災難的「門」關起來，地震以巨大\n蚯蚓的形象具體化並伴隨大量的飛鳥出現，呼應現實中有災害來臨地震會有大量蚯蚓昆蟲\n\
  出現、鳥類異常騷動的現象。動畫中只要象徵災害的巨大的蚯蚓倒下，就會引發不可避免\n的地震災難。\n\n\n   原本草太正經尋門的之旅，到芽鈴陰錯陽差把守門貓神放走，帥氣的草太被詛咒\n\
  成為缺腳的三腳椅，芽鈴與三腳椅追尋貓神明的故事。人、椅子與貓形成有趣互動，顯得\n好笑又逗趣。期間千里尋貓之旅中遇到不少困難，都被富有人情味的陌生朋友幫助，不管\n\
  是海部千果民宿少女或是歌舞廳瑠美姊姊都刻畫得非常在地，非常市井氣，充滿著熱心腸\n，還有看似舉止非常輕浮但細節處處顯示非常關心朋友的的芹澤，很像是你我身邊的朋友\n\
  一樣具有很微妙的親切感。\n\n\n   這次我覺得男女主角一開始”表象”感情互動刻畫得不夠深刻，可能是草太才剛出\n場沒多久就變成椅子，人與物品的互動很難呈現情感的交流（人與椅子接吻？），反倒是\n\
  變成椅子的草太增添有趣搞笑的情節，把此次艱辛冒險變成輕鬆有趣（椅子追貓？）。電\n影最後鈴芽打開草太心裡的那扇門，把變成要石封閉內心的草太一把拉起來，草太內心的\n\
  救贖描繪得恰到好處。從淺薄的一見鐘情到芽鈴為了解救自己重要的人，不惜息犧牲自己\n替代成為要石執念，後期補充2人進入“內心”情感的交流，在冒險中默默成為那個重要\n\
  的人。\n\n\n\n\n\n讓人又愛又恨的守門神「要石」-貓咪大臣，誤打誤撞被鈴芽解除封印後，想把鎮守災害\n的任務交給草太，看似把他變成小椅子，到處搞破壞解放災難，實則是幫忙玲芽尋找「後\n\
  門」的重要角色。貓咪大臣由8歲的童星山根あん配音，非常活潑適合貓咪可愛的形象。\n\n\n動畫中貓咪大臣左眼黑框類似小丑不受拘束的形象，可愛中帶點邪媚，在解除封印後到處\n\
  走跳蹭熱度，成為另類貓網紅，看似到處搞破壞但社群中留下蹤跡給主角們，每當鈴芽成\n功鎖上「門」後，大臣就會在旁邊說「鈴芽好厲害」，就一溜煙跑走了，表現得非常欠打\n\
  與俏皮可愛。大臣的配音與動畫形象配合的相輔相成，添增了很多有趣的情節，絕對是片\n中獨挑大梁的核心角色。\n\n\n\n\n\n當初在看預告片其實看不懂「門」所代表的意思，直到片尾中看見童年鈴芽的日記停留在\n\
  3/11之後都是漆黑的頁面，頭尾呼應一開始片頭在夢中想起心中的傷痛，在最後才真相大\n白，完整了311大地震故事的脈絡背景。\n\n\n這部由日本災害311大地震為故事藍圖，動畫中核心關鍵的「門」是連結往生者世界「常\n\
  世」與人類所處的「現世」的通道，門的後面是「人們心裡消失掉的寂寞之地」。\n12年前日本311地震所造成的傷害一直留在人們心中，身為「受災戶」的鈴芽，傷痛沒有\n\
  被好好處理，漸漸形成傷痕，成為我們成長的烙印。電影結尾最後鈴芽打開自己內心的那\n道門，面對自己喪親的傷痛「內在小孩」和解，擁抱自己的童年，給予相信明天會更好的\n\
  力量。\n\n\n片頭孩童時的鈴芽誤以為成年的鈴芽是「媽媽」的片段，我認為是意指心理學上所謂的「\n重做（自己的）父母」，藉由扮演自己的父母來和「內在小孩」溝通對話，化解災害所造\n\
  成的傷痛。\n\n我也認為「門」又象徵災害的起點(震央)，「關門師」在鎖上“門“前需要詠唱咒文，並\n傾聽當時候人的活在此刻的證明，並與內心傷痛和解才能鎖上心中的地動。\n\
  \n\n\n\n\n日本位於環太平洋火山帶地震活躍區，天災危害頻繁，此次新海誠用動畫的形式以具現化\n蚯蚓的形象重新詮釋地震的危害，以在各地尋找關閉「災難之門」的「閉門師」，象徵日\n\
  本人對於尋找災害預防、災害應急對策的重視。最後詮釋災後人們在面對傷痛對話和解的\n過程，從一開始青春熱血到最後面對災害自我內心的對話，劇情與音樂，相當有渲染力，\n\
  毫無疑問的《鈴芽之旅》為今年值得一看的大作。\n\n\n\n\n--"
