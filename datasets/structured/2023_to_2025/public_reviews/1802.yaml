url: https://www.ptt.cc/bbs/movie/M.1679418794.A.A6F.html
title: '[好雷] 鈴芽之旅：向回憶致敬之作 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  人生無常，

  所以常世不可見，

  但鈴芽卻看得見，

  於是這成了鈴芽必須走的一段解開心結的旅程。




  新海誠的新作《鈴芽之旅》有很多場景及人物挺有像一些經典致敬的意味，

  例如宗像草太挺像《霍爾的移動城堡》的霍爾，在愛媛遇到的的同齡朋友千果挺像今敏《

  盜夢偵探》的小辣椒，非常時期要有非常行動，拋下搬運橘子的工作幫助鈴芽很有這種精

  神；在神戶遇到經營小酒館的瑠美讓我想到今敏《藍色恐懼》裡的經紀人留美的（哇名字

  也很像！），左大臣化身為白龍則讓我想到《神隱少女》裡的白龍，也確實，左大臣也幫

  助鈴芽找尋忘記的那段記憶；至於坐上芹澤的車展開長程公路旅程放的音樂，也有很多向

  例如《魔女宅急便》等經典動畫致敬的意味。




  劇中有很多值得令人深思的反動配置，

  比如說右大臣貓咪看似是作亂，實則是要感念鈴芽餵養以及放乎自由的《貓的報恩》，而

  且右大臣對鈴芽不離不棄的跟隨，挺像《神隱少女》的無臉男的。

  蚯蚓其實也不是邪惡的化身，而是一種對環境破壞的省思，不知道有沒有人也有看過五十

  嵐大介的漫畫《故事說不停》，第３１話「赤龍升天」裏頭被壓扁的蚯蚓的獨白就提到，

  人們不但沒有感謝蚯蚓偉大的鬆土幫助農業發展的功勞，反而恩將仇報，把地面鋪上蓋子

  ，切斷地下的水脈，讓蚯蚓沒辦法呼吸，不得不爬出來喘口氣，結果被車壓扁。赤龍也是

  蚯蚓的別稱，若是蚯蚓真的倒地了，那還真的是人類的災難。此外，蚯蚓也有為回憶鬆土

  的隱喻，每扇被蚯蚓打開的門，都是一段段對過往各種回憶的放鬆與呼吸，最後的那個心

  結與癡念透過鑰匙才能解開，而那鑰匙，從來都是自己。






  創作從來就不是無的生有，這也是新海誠厲害的地方，

  從新海誠新作的巧思，不難看到充滿著對大師滿滿的感念與敬意，

  以及對大地與貴人的反饋，

  他就很像是鈴芽一樣，旅途中受到各種人的幫助，

  也會懂得回饋而心存感激，

  鈴芽之旅是向回憶致敬之作，

  也是訴說傳承的重要與偉大之作，

  雖然在無情的大地震後最珍貴的東西缺了一塊，

  最終也能綻放出新芽。




  -------------------------------

  [ 當世界都在跟你說教 ]



  --'
