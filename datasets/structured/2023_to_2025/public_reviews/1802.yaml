title: 'Fw: [情報] 鈴芽之旅 IMAX Dolby Cinema 重返大銀幕'
content: "作者: gary8442 (起秋風) 看板: C_Chat\n標題: [情報] 鈴芽之旅 IMAX Dolby Cinema 重返大銀幕\n時間:\
  \ Tue Apr 11 20:58:33 2023\n\n\n\n由日本動畫大師新海誠導演的最新作品《鈴芽之旅》3月2日在台上映後席捲全台，上映一個\n多月後，口碑持續延燒。全台票房至4月10日已突破2.2億，有望於近日超越《咒術迴戰》2.\n\
  3億的最終票房紀錄，登上台灣影史日本電影票房Top 4。《鈴芽之旅》在日本上映至今票房\n也已達144.4億日圓，登上日本影史票房Top 14。\n\n   \
  \ 《鈴芽之旅》於中國3月24日上映後，短短上映12天，就超越2016年上映的《你的名字\n。》5.75億人民幣(約25.47台幣)總票房，成為中國影史日本動畫電影票房冠軍，上映16天\n\
  觀影人次達2069萬，超越《你的名字。》2068萬觀影人次。上映17天，截至4月9日，票房累\n積7億人民幣(約31億台幣)，創造了十分驚人的票房成績。韓國在3月8日上映至今後累積票\n\
  房突破450億韓元，累積觀影人次達437萬名，上映至今已蟬聯5周票房冠軍！值得一提的是\n，今年在韓國上映的電影只有兩部超過400萬名觀影人次，包含《灌籃高手》與《鈴芽之旅\n\
  》，而《鈴芽之旅》上映31天超越了400萬名觀影人次，比《灌籃高手》上映70天才破400萬\n名觀影人次的速度還要快上2倍多。除了亞洲國家外，4月12日起《鈴芽之旅》將在北美、南\n\
  美、澳洲以及德、法、義等歐洲國家陸續上映，也受到許多國外影迷的熱烈期待。\n\n\n\n    為回饋支持喜愛《鈴芽之旅》的觀眾，電影公司極力爭取，除了4DX外，4月14日起《鈴\n\
  芽之旅》IMAX、Dolby Cinema也將再度回歸！讓許多之前錯過特殊影廳的觀眾，都等不及再\n刷一波。不僅如此，《鈴芽之旅》也特別推出期間限定【《鈴芽之旅》電影角色珍藏卡】，\n\
  只要於影城購買《鈴芽之旅》4月14日(五)至4月20日(四)期間的一般版或4DX版電影票1張，\n即可兌換領取，4款隨機發贈；於影城購買《鈴芽之旅》4月14日起Dolby\
  \ Cinema或IMAX電影\n票1張，即可兌換【特製厚磅奔跑版電影海報】1張；另外，於影城開放場次售票起，凡購買\n《鈴芽之旅》4月14日(五)起樂聲影城電影票1張，即可兌換領取【常世款電影珍藏膠捲卡】\n\
  1張。以上皆數量有限送完為止！《鈴芽之旅》IMAX、4DX、Dolby Cinema 重返大銀幕，全\n台現正熱映中。\n\n\n\n\n--\n\n\n\n\
  中國特典 2本新海誠本 2本特典小說 \n\n台灣...貼紙 紙書籤 塑膠刮痕書籤 明信片 角色卡 薄海報 厚磅海報\n\n然後新海誠本1藏在刮刮樂\n轉蛋（沒新海誠本1了）\n\
  \n車庫特典操作懶人包 \n\n結論：特典買日版， 台版不存在\n\n有 Dolby Cinema 就會再搭高鐵去看，特典是其次\n\n\n\n\n可惜鏡孤沒有特殊廳...廳也剩不多\n\
  .....快下檔了吧\n                                     04/11 21:27"
