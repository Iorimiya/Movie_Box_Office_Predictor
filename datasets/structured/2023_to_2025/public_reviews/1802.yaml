url: https://www.ptt.cc/bbs/movie/M.1677383298.A.D8D.html
title: ［好雷］鈴芽之旅 首映心得
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  小弟第一次在此版發文，這篇昨天晚上也發在西洽。沒看到轉錄規定所以這邊也發一篇如有

  違規，煩請各位版友告知了。


  先說總結：個人認為這部比起天氣之子更加優秀，劇情老梗且隱晦卻後勁很強。不像前兩部

  直接把衝擊幹在觀眾臉上。但可能需要一點想像力跟感性才能夠有更好的體驗


  然後本魯是助人工作者，最近在看CPTSD(複雜性創傷)的書，所以會帶一些裡面的概念進來

  這樣。


  新海誠一貫高水準背景與光影的精美，跑出教室那幕的走廊倒影之乾淨令人印象深刻。


  題材選用地震與311背景，只能說誠哥蠻勇敢的。地震警報、被刨除的廢土、歸還不能的家

  園，甚至是當天出發前的招呼。每一幕都可能勾起人們的PTSD。


  表面上是すずめ阻止地震跟找老公之旅，在我看來是她的自我救贖之旅，想談談貫穿故事這

  張缺一腳的椅子。


  椅子作為媽媽送給鈴芽的禮物及留下的遺物。劇中大部分時間是草太的身體（人形反而出來

  不到半小時，我越來越熟悉椅子啦）、給予她勇氣、建議，引導她踏上這段歸鄉之旅。


  最後並非成就了兩人之間的愛情而是歸還給了小時候的自己。帶給小すずめ安慰和勇氣。


  大冒險的背後實則是一段面對災難創傷與喪親之痛的自我救贖之路。下面會稍微探討一下す

  ずめ的內心動力與自我認知，覺得太藍色窗簾的可以pass。


  從故事一開始被質問「難道你不怕死嗎」回應「不怕」、「生死不過是運氣」，結合上311

  倖存者的背景，可以看出她對於生命是沒什麼執著也了解生命的無常的。


  4歲喪親的すずめ被阿姨收養，對於阿姨也有著是否耽誤對方人生的自責。休息站的爭執雖

  然有著左大臣的影響，卻也能略窺兩人並非全然接納彼此。すずめ心中或許也有著被親人拋

  下的遺棄感。


  時隔12年的歸鄉，埋藏起來塗黑的日記本則是當年的自己不願意回想的過去，這也是PTSD常

  見的症狀。對於創傷事件的失憶。


  令我自己最感動的地方還是大小すずめ的對話。小すずめ問「有沒有看到我媽媽，我媽媽找

  不到我一定好擔心」

  大すずめ的回應並非告訴她母親不在的事實而是回應小すずめ沒說出的「對於未來的擔心與

  害怕」。選擇告訴小すずめ，或許你會擔心會害怕，會恐懼只剩下自己的未來，但請你相信

  你會遇見許多愛你的人及你所愛的人。並轉交了椅子埋下了旅途的契機。


  也或許是應證這一點，自行車上阿姨的坦誠及すずめ爽快的接納，或許會有人覺得轉折生硬

  ，但那正是すずめ是在阿姨正向的愛之下長大的證明。也是只有在這樣環境長大的孩子才能

  夠對於親子關係如此信任。


  看似老套的時光機情節，卻是整部片的核心。椅子作為災難的象徵與旅途的見證者，すずめ

  經歷了這趟旅途終於能正視自己的創傷與遺棄感，對於那個受傷喪親的悲慘童年自我產生內

  在的自我憐憫與救贖，走出那個熊熊燃燒的廢墟，關上門走向未來。

  也再次回收日文標題伏筆（すずめの戸締まり）



  誠哥這次將成長優先於愛情，甚至幾乎沒有草太視點的愛情表現。或許也是想將其作為獻給

  311受災戶的作品。近年來日本大力推動東北震災復興，前年GreeeeN也是為此上了紅白。


  劇情部分還是有很多沒有交代完整，誠哥壞習慣埋一堆梗都不講。尤其是大貓貓和小貓貓，

  爺爺的線也啥都不講，誠哥又不會出前傳。雖然愛情戲不夠飽滿，但關於主角成長個人會給

  這三部下來最高分。






  --'
