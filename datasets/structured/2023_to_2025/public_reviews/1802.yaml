title: '[好雷] 尋回鬆脫遺失的要石：《鈴芽之旅》上'
content: "本文整理《鈴芽之旅》主角岩戶鈴芽與宗像草太、大臣的立場、心理與動機。\n\n　　（內文有雷且具個人觀點，建議觀影後再讀）\n\n\n\n圖文網頁版：\n\
  \n上　\n\n下　\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\n\n\
  尋回鬆脫遺失的要石：《鈴芽之旅》上\n\n\n\n　　有些電影情節猶如狂潮，推至最高處拋甩而出，帶給你強烈的刺激與爽\n\n快；有些則是像是日常的摭遺，當下以為無關緊要，但匯聚某個時刻才會察\n\
  \n覺：那個瞬間已把你推到岔路，偏離原本的軌道。\n\n\n\n　　前者是無常的交響，後者是如常的變奏。\n\n\n\n　　《鈴芽之旅》二者兼具。電影一開始讓主角岩戶鈴芽與宗像草太、大臣\n\
  \n相遇，追著上船離開規律，一起執行「關門」的任務；一路上在聆聽他人聲\n\n音的同時，也傾聽、確認自己的聲音，在無常中確認真正想要的如常，進而\n\n發生改變。\n\
  \n\n\n　　記得在第一次看《鈴芽之旅》時，雖能體會新海誠導演試圖撫慰災後對\n\n土地、對人心帶來的傷害，鼓勵他們珍惜生命並好好活下去的用心，但龐大\n\n\
  的資訊量、必須與主角一起擷取稍縱即逝的細節，以及在有限視角和時間限\n\n制下不得不捨棄的部分背景交代，讓我看完之後，對角色──包括主角──\n\n的動機與情感轉折，無法理解得很充份──畢竟我們並非涉身其中，而是藉\n\
  \n由觀影，同時吸收了所有角色、整個故事的行進，難免有所偏重與遺漏。\n\n《鈴芽之旅》除了鈴芽的療傷成長之外，亦鋪陳了草太的情感曲線；大臣戲\n\n份雖然不多，卻是牽引、帶領他們進行這趟旅程的關鍵，這三個角色之間，\n\
  \n也有各自參差對照的相似之處，可以互為補充。\n\n\n\n\n\n一、角色設計以「關門師」為核心\n\n\n\n　　「關門師」的任務，鈴芽、草太、草太爺爺與兩位大臣，各自代表了入\n\
  \n門者、現任、卸任，和「成為要石／神」的階段。從草太在東京住所攤開給\n\n鈴芽看的繪卷可知：所謂鎮壓蚯蚓的要石，其實是人柱，東京和九州各有一\n\n個，現今負責的正是左大臣與大臣；但再從故事最初，鈴芽受聲音蠱惑，輕\n\
  \n易取起大臣要石，以及與故事最末在常世拔起草太要石須一人一神用盡全力\n\n相較，故事一開始要石就已鬆脫，需要重新設置，這也是為什麼鈴芽離開宗\n\n像爺爺的病房後，左大臣會來訪確認狀況；抑或是大臣逃離之後，左大臣無\n\
  \n法獨自鎮壓，以致有了蚯蚓積累的能量可能造成大地震的危機。\n\n\n\n　　電影裡對「關門師」的資訊甚少，只能從草太口中知道那是「家傳祖\n\n業」，且從宗像爺爺的態度來看，為此受傷、缺損，甚至死亡都是必須承擔\n\
  \n的風險。但無論是否家傳，都至少要具備能看見常世與蚯蚓的條件。草太為\n\n何由爺爺撫養？可能他具備這個能力，但父親沒有；又或者，草太的父親具\n\n備能力，但已然亡故，所以宗像爺爺一面培養草太一面持續工作很長一段時\n\
  \n間。成為要石跟關門師一樣，至少要具備看見常世與蚯蚓的條件，以及願意\n\n獻身的覺悟。由此看來，「關門師」與「要石人柱」的條件幾乎重疊，甚至\n\n可以確認：關門師在必要的情況下，必須化為要石寄宿神的力量來鎮住蚯蚓，\n\
  \n減輕地震的危害。\n\n\n\n　　這也是為什麼當鈴芽要救草太時，爺爺說：你要辜負他的決心嗎？爺爺\n\n與左大臣的熟悉，可能來自皆是同行：新海誠在2022年12月30日的\
  \ Twitter\n\n表示，羊朗（草太的爺爺）在３１１地震時犧牲了自己的右手臂，將左大臣\n\n刺入了位於東京地下的後門。草太與鈴芽追逐大臣蹤跡的過程，因為逐漸化\n\
  \n為要石而冰冷、凍結時，其實已經隱約知道自己的命運，只是抗拒承認；最\n\n後恢復人身執行插入要石任務亦顯現與左大臣較為熟悉，與大臣則完全不熟，\n\n所以故事有很長一段時間，大臣的動機與行動都被誤解。\n\
  \n\n\n　　我們可以從以上推論統整：要石是由人柱鎮守，但每隔一段時間都會因\n\n為地下的力量蓄積、轉移而鬆脫，鈴芽在聲音蠱惑之下，才會輕易拔起要石；\n\n\
  而要石的人柱，很可能多由關門師自我犧牲而成，他們都須具備這樣的決心\n\n與覺悟。因此，大臣很可能以前是年幼的關門師，或者跟鈴芽一樣，因為面\n\n臨生死關頭而能看見常世與蚯蚓，卻因地震而失去親人，在左大臣的照顧與\n\
  \n徵詢下，自願成為要石。成為要石後為神所寄宿，所以也有著神力。\n\n\n\n1.草太\n\n　　草太作為關門師，從「很怕爺爺失望」來看，或許能力未及頂尖；必須\n\
  \n祕密訓練、旅行去執行任務，同時兼顧現實的責任，使他長時間處於孤獨，\n\n甚至有些抽離人世。從芹澤的故事可知，他會關心周遭的朋友，雖非積極交\n\n際的類型，但助人不遺餘力，除了天性使然，應該也是他渴望這些情誼，懂\n\
  \n得藉由付出去維繫，只是因為家族祕密，這些交流便難以深刻。雖然草太對\n\n關門師的工作一直盡心盡力，視為自己應盡的責任，也有獻出生命的覺悟，\n\n但從芹澤說「不會照顧自己」、受傷也不包紮、一開始極力拒絕鈴芽幫助的\n\
  \n態度來看，除了一直擔心自己無法勝任，他也對這份工作產生了「我（的生\n\n命）只能一直這樣下去吧」的迷惘，對人生態度消極。\n\n\n\n2.大臣\n\n\
  　　這也是大臣長時間累積的迷惘──由於長時間遠離人煙，逐漸失去原本\n\n的意願：除了成為要石，祂有沒有其他的選擇？鬆脫離開之後，不願蚯蚓引\n\n發地震的祂應該看見草太與鈴芽一起關上了門。在鈴芽房間第一次正式會面，\n\
  \n鈴芽給祂食物，由於自身經驗的投射，擔心祂在經過地震後受到驚嚇，願意\n\n給祂一個家而開口說：「願不願意當我家的貓（孩子）？」讓祂有了新的選\n\n擇，也是「神」聽到人類請求而應允──但即使如此，祂沒有忘記須有要石\n\
  \n鎮壓蚯蚓，那麼，在場的第三者──關門師草太，對祂來說就是唯一且正確\n\n的選擇；然後引導他們到下一個後門開啟的地方，才能讓新的「椅子要石」\n\n發揮功用。有了轉移、承擔責任的對象，就能安心當鈴芽的貓；甚至讓鈴芽\n\
  \n取代草太擔任關門師的任務，祂更可以一直陪伴、庇護她，一如後來回故鄉\n\n岩手的路程。\n\n\n\n3.鈴芽\n\n　　鈴芽在四歲時因３１１大地震失去母親，經歷過地震後烈火焚燒、房屋\n\
  \n盡毀的災禍，因遍尋不到母親下落在生死邊緣誤入常世，為十六歲的鈴芽所\n\n鼓勵並予以椅子作為思念亡母的寄託，和草太一起送回人世才得以存活，也\n\n就與草太有過一面之緣，後由愧疚的環阿姨以一句「來做我家的孩子吧」收\n\
  \n養。雖因年紀幼小，出於求生本能及被收養必須早熟懂事，鈴芽將童年、回\n\n憶與日記、以及門後相遇的細節埋於地下，甚至忘了草太的存在並把白衣女\n\n子記為母親，但記憶仍時時在夢中徘徊，這份創傷使鈴芽一直害怕地震（電\n\
  \n影第一次發生地震時，同學都認為警報太誇張，只有鈴芽察覺可能與屋外的\n\n蚯蚓連結而凍住不動），認為生死無常且是運氣，自己沒有活下來的價值，\n\n自責「如果我當初做了／沒做什麼，母親或許就會活下來」的倖存者偏差，\n\
  \n甚至長大後產生「自己的存在奪走了阿姨的珍貴時光」，「如果我不在的話\n\n就不會給人添麻煩」的念頭，使她想盡早獨立，也不害怕死亡。這份痛苦被\n\n她深深埋藏起來正常生活的同時，也讓內心的一部分陷入無人可訴的孤寂。\n\
  \n環阿姨自知無法取代姐姐成為鈴芽的母親，但因愧疚、責任與愛，對鈴芽過\n\n份照顧（從眾多照片、到高中了還過份裝飾被同學笑說「愛很深」的便當，\n\n以及地震沒有回應訊息，就從忙碌的工作中趕回來）已經對感到內疚、且想\n\
  \n要獨立的鈴芽造成壓力和負擔，但因非母女只能各自容忍。\n\n\n\n　　在電影開頭，鈴芽與草太第一次相遇，固然草太出色的相貌吸引了注意\n\n力，但長髮、白大衣，對方問句裡提到「廢墟」與「門」更隱約喚醒過去\n\
  \n「在常世見到母親」的記憶，使她內心受到擾動而不安，騎到平交道遇到小\n\n絢，聽到她說「臉很紅」確認自己的在意，才會權衡後轉身找廢棄的溫泉街，\n\n喊出「總覺得好像在哪裡見過你」卻意識到「很像搭訕」決定返回──如果\n\
  \n不是在這時候看見門，她應該就不會和草太相遇了。\n\n\n\n　　再從後來劇情來看，能立刻找到門，能聽見大臣要石蠱惑的聲音，鈴芽\n\n具備的條件很適合當一位關門師（可能是誤入常世而擁有了特殊體質），更\n\
  \n不用說她不畏生死的勇氣、願意阻止災難的決心和優異的行動力。她問大臣\n\n一般人能否成為要石，大臣沒有否決，答案就顯而易見──至少鈴芽是合適\n\n的，甚至大臣可能本身就是。\n\
  \n\n\n　　在各自這樣的心理下，二人一神相遇。前往愛媛的船上與草太交換資訊\n\n之後，鈴芽明白是自己拔起要石的錯，加上讓草太「遭到詛咒」寄宿在媽媽\n\n\
  遺留的椅子上都令她自責愧疚，所以堅持一起去找大臣；由於變成椅子的草\n\n太無法獨自行動，便一起開啟了這趟關門之旅。大臣想要當鈴芽的貓，就必\n\n須找到替代的要石，在那之前也要鎮住接下來可能發生的災害，所以祂帶鈴\n\
  \n芽和草太到下一個後門開啟的地點。但大臣沒料到的是：讓鈴芽與草太朝夕\n\n相處，加上草太變成椅子，是童年象徵＆母親遺物的親切熟悉感，大幅降低\n\n了異性的隔閡；以及認同關門任務的價值、進而同甘共苦與同生共死的過命\n\
  \n情誼，讓他們之間的相知之情加速上升。\n\n\n\n\n\n二、經驗情感與生命的旅途\n\n\n\n　　電影裡安排的每一個目的地，除了分別暗示日本過去發生地震的地點之\n\
  \n外，新海誠導演也在有限的時間與互動裡，安排鈴芽與草太相處的細節，和\n\n距離的逐漸拉近。\n\n\n\n1.從宮崎到愛媛：從設防到熟悉　\n\n　　鈴芽與草太在溫泉街的後門邊再次相遇時，鈴芽隔著一段距離看著草太\n\
  \n努力關門，一度因為地震創傷而呆滯，直到草太倒地才上前相扶，此時地震\n\n警報響起。在草太為了保護她而受傷，且確認從門裡冒出來的蚯蚓是主因後，\n\n鈴芽壓下恐懼上前幫忙。事後原本草太要鈴芽忘記一切，因受傷而被鈴芽半\n\
  \n強迫邀回家包紮。雖然鈴芽想問細節，但草太不願多說，卻與她交換名字，\n\n可見他對鈴芽亦有好感。此時大臣闖入，鈴芽許了「願望」讓大臣將草太寄\n\n宿在椅子上。為了追回母親的遺物，也因草太的變化太過令人驚奇，鈴芽一\n\
  \n路追到船邊，同樣是猶豫之後才上了船。\n\n\n\n　　大臣逃走後，兩人交換訊息，草太始知是鈴芽拔起要石，卻幾乎沒有怪\n\n罪，這裡可以看到即使變身為椅子，行動有限，草太仍與鈴芽保持距離，勸\n\
  \n她快點回去，安慰她「這不是你的錯」，這不只是個性使然，「本該由我負\n\n責，是我的錯」思維裡也有長久以來「獨自承擔」和「是我沒做好才會把不\n\n知情的人拖下水」的自咎。之後初次沉睡不醒，直到鈴芽帶下船，積極勸說\n\
  \n後才認知到一己之力有限，同意一起行動。而鈴芽在船上，夢見塗黑的日記、\n\n尋找母親、進入常世的回憶，再次顯現過去的創傷一直會干擾她，封鎖的回\n\n憶也逐漸復甦，「和椅子草太一起旅行」有彌補過錯、將對母親、童年的回\n\
  \n憶移情的作用──但在開門的同時醒來，證明她還沒有真正面對創傷，先注\n\n意到草太的誇張睡姿（成為要石的預兆），接著被日出感動──鈴芽下定決\n\n心不回宮崎而是跟著椅子草太行動不只是試圖挽救錯誤，也是藉由旅行感受\n\
  \n周遭、開啟冒險。\n\n\n\n　　遇見千果這段情節，共有三個目的：其一，看見橘子掉落，草太與鈴芽\n\n幾乎是以直覺默契合作攔截，「身體不自覺就動起來」的回答其實再次強調\n\
  \n兩人都有積極助人的默契，跳過徵詢直接行動（共通點１）。其二，藉由千\n\n果協助騎車載鈴草一程完成關門的目的。其三，與千果的互動鋪陳女性之間\n\n獨有的互助情誼之外，也是鈴芽「傾聽當地聲音、感受生命」的過程，這有\n\
  \n助於她在和草太一起關門時強化「人心的重量」。但在接近廢墟時，身體變\n\n成椅子的草太仍要鈴芽止步，可知他們都有不願讓「普通人」涉足危險的堅\n\n守原則及責任感（共通點２），直到鑰匙掉落，且看見廢墟與蚯蚓、克服創\n\
  \n傷反應遲了一段時間才趕來的鈴芽，表達自己「不怕死」、有犧牲自己以利\n\n他的決心（共通點３）之後才請她幫忙，讓鈴芽真正參與（第一次只是出力\n\n＋旁觀整個儀式，但這次是協助用鑰匙鎖門）。\n\
  \n\n\n　　結束之後，草太稱讚鈴芽做得很好，認為這是鈴芽的功勞（先前獨自試\n\n驗失敗、鑰匙掉落時，他曾自責「我連這種事也……」），這裡鈴芽的回應\n\n\
  可以特別注意是：「我們很厲害對吧？」讓草太愣了一下──顯然草太認為\n\n這是自己「應盡的責任」而且沒有做好，並無得到稱讚的價值，但從草太的\n\n稱讚裡得到肯定、確知自己不再只能被動等待、而是可以用行動阻止天災的\n\
  \n鈴芽，卻藉由這句話把這份肯定同樣給予了草太，進而察覺到草太也有這種\n\n「不在乎、不認可自己」、對自己過份嚴苛的心理（共通點４）。\n\n\n\n　　所以任務完成後，鈴芽應千果的邀請暫住她家的旅館，兩人的聊天當中\n\
  \n讓草太了解到鈴芽的離家是想證明獨立不再耽誤阿姨，這點與他獨自執行任\n\n務、不想讓生病的爺爺失望異曲同工（共通點５）；其次，鈴芽注意到草太\n\n過於執著獨自完成任務，所以在千果雖不明白但仍認可鈴芽說：「你在做的\n\
  \n是一件重要的事」，鈴芽覆述時刻意略略提高聲音講給身後的草太聽，再次\n\n把這份兩人都需要的認可（我所做的／我的存在是有價值的）給予彼此，也\n\n藉此表達對草太的感謝（不再無助的面對創傷，而是能以行動改變現況），\n\
  \n讓草太微微一震。\n\n\n\n　　由於這趟任務中，兩人從彼此身上找到認同與理解的親近感，所以當草\n\n太再次沉睡不醒時，鈴芽聽了千果的建議，試圖用親吻喚醒草太──這張椅\n\
  \n子是母親的遺物，從環阿姨的加筆小說可知，鈴芽小時候常對椅子用貓語說\n\n話，一開始親吻的目的應為喚醒（畢竟已發現大臣的蹤跡，必須盡早彌補過\n\n錯），但想到「不知道嘴巴在哪」而中止。在那之前，鈴芽與椅子草太的接\n\
  \n觸都屬必要──為了不被人看見，在這裡多了一點特殊的好感，但仍有距離，\n\n故而草太問她「你在做什麼」時往後退了一步。在攔不到車時，可以看到草\n\n太比較輕鬆的建議她動作大一點，鈴芽則吐槽讓你走動就一定可以嚇到別人，\n\
  \n被草太認可（這也能證明草太已接受自己「變成椅子」，需要協助、但不需\n\n要逞強的事實），這樣可以互損的玩笑讓草太確知兩人的關係更為親近，所\n\n以在等車時，草太開口確認椅子是鈴芽母親的遺物後，問了為什麼是三隻腳\n\
  \n──這把椅子在此可視為兩人的象徵：都因過去而失去一部分（鈴芽是因震\n\n災失去母親、失去自我價值，草太則是為了任務而必須承受孤獨，可能犧牲\n\n的危險，和容易過度自責的心理），但仍可繼續前進（共通點６）。\n\
  \n\n\n　　這段旅程我們可以看到：草太化身為椅子，並且在「現在」與鈴芽互動\n\n的過程，讓鈴芽能用比較自在的心情面對過去、彌補曾經「來不及救母親」\n\n\
  的傷痛，同時看見周遭、面對未來──即使危機重重，卻也有「我能帶來改\n\n變」的希望；長期獨自執行關門師任務的草太則終於得到肯定、逐漸改變以\n\n往必須逞強的孤獨心態，拉近與他人（鈴芽）之間的心理距離，過去必須保\n\
  \n持祕密與設防都失去必要，這可能是他對他人最坦承、最親密的時刻。　\n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n\
  有時候，眼睛只肯告訴我這麼多。\n\n                                  陳斐雯  貓蚤札（其三）\n\n--\n\n\n　　這點我也想過，而且有點好奇，且不論要石除了經過一段時間會鬆脫，\n\
  \n要人獻身當要石，應該必須意志堅定－－這恐怕真的要是關門師這種家族教\n\n育才做得到。草太在東京上空成為要石後，雖然不捨人世但仍願意獻身，如\n\n果不是鈴芽去喚醒他，他應該就認命了。\n\
  \n\n\n　　大臣雖然不想再當要石，但祂始終沒有忘記必須壓制蚯蚓，所以一路引\n\n導鈴芽和草太，而且在東京上空一再提醒鈴芽「會造成災難」，我想祂想阻\n\n\
  止地震的決心一直是堅定的。至於宗像家，九州原本不是他負責的範圍，這\n\n次是去代理原本的關門師去處理，從左大臣與宗像家的交情來看，左大臣無\n\n意犧牲宗像家的孩子；大臣把草太變成要石，可能也是因為不熟的關係，如\n\
  \n果來的是原本的關門師，祂還會這樣做嗎？\n\n\n\n　　總之關門師和要石有滿多地方值得探究，讓一個孩子當要石，可能當時\n\n是最好（且不得不）的選擇，大臣有了神力之後就再試著扭轉吧？只能說心\n\
  \n意是會依現實改變的，大臣願意當要石，鈴芽以為大臣是流浪貓想給祂一個\n\n家，環阿姨收養失去母親的鈴芽，當初都是出自真心的啊。\n\n\n\n\n　　謝謝分享，雖然限於語言我看不太懂……\n\
  \n　　如果大臣是如此設定，難怪會對自由如此嚮往。QQ"
