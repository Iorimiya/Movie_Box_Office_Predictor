url: https://www.ptt.cc/bbs/movie/M.1677928768.A.AFB.html
title: 'Re: [  雷] 求《鈴芽之旅》開往東北老歌歌單'
content: "用在鈴芽裡，晨間新聞提到明石大橋上有貓的時候。\n\n-------------------------------------------------\n\
  \n\n\n\n在鈴芽裡，應該也是晨間新聞那段。\n\n-------------------------------------------------\n\n\
  神戶協力者-二之宮瑠美的小吃店(スナック)客人歡唱曲；\n\n\n\n\n (cover.松居直美)\n一首有那卡西、阿戈戈(A Go-Go)時代的歌w\n附帶一提；作曲芹澤廣明，後來也寫了機動戰士ZZ鋼彈的OP-アニメじゃない(詞秋元康)\n\
  \n\n\n\n\n\n\n\n\n\n歌詞和住在糸守町的某位巫女高中生當年的心聲有87像www\n\n另外補充推文版友提到的；吉幾三 - 酒よ(\"傷心酒店\"\
  \ 原曲)\n\n\n\n\n\n不解釋，根本日本結婚用名曲w\n記得當年君名上映的討論串，\n也有人提到這首歌也很適合住在糸守和東京的那倆個人w\n\n\n\n\
  \n\n  (cover.鄧麗君)\n\n\n------------------------------------------------------------------\n\
  \n\n鈴芽往東京新幹線時月台BGM；\n\n\n\n\n-------------------------------------------------------------------\n\
  \n\n鈴芽和芹沢和深津絵里aka.環阿姨，三人一車時的車上串流音樂\n\n\n\n\n  (cover.生田絵梨花)\n  (cover.糸守町JK巫女)\n\
  這首應該不用講了，劇中芹沢也講了，旅行+有貓+離家遠行 就是這首了\n隔壁車道還有一台黑貓宅急便經過......\n附帶一提，在君名須賀神社那個長坂階梯前的巷子，也有黑喵的宅配點\n\
  \n\n(小弟朝聖照片)\n\n\n\n\n  (cover.幾田りら)\n我很懷念她女兒，冰雪奇緣的安娜aka.神田沙也加 QQ\n\n\n\n\n  (cover.斉藤由貴)\n\
  \n\n\n  (cover.生田絵梨花＆斎藤由貴)\n斉藤由貴的名曲之一，\n另外她也唱過相聚一刻的OP-悲しみよこんにちは\n\n\n\"卒業\" 作曲-筒美京平，2020年也走了QQ；也是一位戰後昭和到平成J-POP的偉人\n\
  這邊推一首平成澀谷系王子-小沢健二 \"強い気持ち　強い愛\" 就是他寫的。\n\n\n\n  (cover.渡り廊下走り隊７/AKB48)\n国生さゆり+小貓俱樂部，不用說，作詞就是那位秋肥-\"\
  秋元康\"。\n所以當年有讓以渡辺麻友C位的AKB48子組合-渡り廊下走り隊來翻唱，\n也是很合理的事w\n\n\n\n\n\n  (cover.竹内まりや)\n\
  詞曲都竹内まりや寫的，所以她翻唱也是很合理的事w\n\n\n以上。\n\n--\n輝く五月の草原を               さざ波はるかに渡ってゆく\n飛行機の影と雲の影\
  \             山すそかけおりる\n着陸ま近のイヤホーンが         お天気知らせるささやき\nというその響きが        ロシア語みたいだった\n\
  \n--\n                                   03/04 19:24\n謝推薦，內文補充上。"
