url: https://www.ptt.cc/bbs/movie/M.1677913073.A.3CF.html
title: '[好雷] 《鈴芽之旅》還是很讚'
content: "原文 \n\n和阿姨相依為命的鈴芽，在某天與神祕少年草太相遇之後，世界突然風雲變色，未知的龐\n然巨物從一扇門後面竄出並引發地震，而在門後使勁想把門關上的，就是神祕少年草太。\n\
  兩人費盡一番工夫攜手將門關上之後，就此踏進拯救世界的冒險之門...\n\n繼《你的名字》《天氣之子》之後，新海誠再次以「災難」作為主題，《鈴芽之旅》的故\n事同樣融合了神話並藉由動畫具現，在磅礡的氣勢中展現細緻的作畫風格。電影進行方式\n\
  有點像以前好萊塢龍捲風電影的「追風團隊」，必須預測災難發生地點，追逐不斷移動的\n「災難」並設法阻止，就像警察緝捕連續殺人犯，或是像神探找出定時炸彈般一樣，節奏\n\
  相當緊張刺激。\n\n而這次新海誠在劇情上企圖挑戰更大的格局，鈴芽與草太的公路之旅從日本的南端一路移\n動到北端，代表這次的故事想述說的是全日本共同的記憶與傷痛，串聯起日本的過去、現\n\
  在與未來。\n\n（以下有雷）\n\n\n\n\n這場擴及大半日本的災難，從鈴芽幼年時的日記來看，是在隱喻日本311大地震。停泊在\n房子上的船隻、只剩下地基的房屋殘骸、雜亂不堪的廢墟，在很多日本電影或紀錄片中都\n\
  看過這樣的場景，新海誠維持將景點原封不動呈現的作畫風格，在《鈴芽之旅》中同樣很\n真實描繪出311災區的殘破與寂寥。\n\n「我總覺得你在做一件重要的事。」\n\
  \n對於那些經歷過災難的人來說，鈴芽的行動或許無須多做解釋，也能在潛意識中意會到其\n重要性。雖然地震後的災難畫面，以及鈴芽的兒時陰影到了電影後段才揭露，但如果再回\n\
  顧電影前段那些關門前所湧現的眾人回憶，以及鈴芽對於「常世」的迷戀是來自於失去母\n親所造成的記憶扭曲，就算沉痛的災後畫面只佔極小篇幅，但在大量快樂回憶的對比之下\n\
  ，也能放大災難帶給倖存者的傷害與苦痛。\n\n然而新海誠並不打算用傷痛作為主調，去淹沒他所重視的「傷後痊癒」。「常世」是人死\n後前往的場所，一生只能穿越一扇後門，是死者的世界，是活在現世的我們不該前往的地\n\
  方。這段場景設定就明確表現出導演拍攝本片的立場，是為了承載國人的傷痛，肯定大家\n沒有在傷痛中迷失，並從中走了出來，努力的沒有讓自己走向另一個世界。\n\n「我出發了。」\n\
  「路上小心。」\n\n這兩句日常問候，在災難之前是與親人的簡單道別，而在災難之後，是踏著堅毅的步伐前\n進、面對艱難的挑戰時，大家互相鼓勵的信心宣言。鈴芽一路上受到許多人照顧，除了感\n\
  受到濃濃的人情味之外，也看到因為地震串聯起國人的回憶，在災難的餘波之下，能一路\n挺過來就算沒有血緣，也都可以是一家人。\n\n很多時候我們都覺得自己渡不過難關、做不好某件困難的事、達不到理想中的目標，但過\n\
  了一段時間再看看自己，不只好端端的，可能還已經進步到過去的自己已經難以想像的樣\n子。遭遇難關時的痛苦或許當下覺得過不去，但要是能咬著牙撐過並在未來回頭看，會發\n\
  現我們都可以過得很好，畢竟一切終究都會挺過去的，對吧？\n\n--------------------------------------------\n\n\
  但有人懂那隻貓在幹嘛嗎？我實在懶得幫牠腦補，電影要是沒有牠，我大概可以再加個一\n分，實在是太討人厭的角色了，後面的洗白根本京劇變臉。\n\n\n--"
