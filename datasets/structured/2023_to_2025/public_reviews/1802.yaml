url: https://www.ptt.cc/bbs/movie/M.1678156370.A.68A.html
title: 'Re: [討論] 鈴芽之旅在現實中了話'
content: '在現實世界的話，我們大概會看到這樣的關門之旅:


  一個怪怪的大叔沿著快速道路漫遊說要關門，

  然後在路上遇到了一位開卡車的年輕人，跟年輕人一起踏上了關門之旅...


  大家有沒有覺得這樣的關門之旅很眼熟?


  沒錯，這是村上春樹"海邊的卡夫卡"中一條重要支線，

  中田大叔和星野青年的關門之旅。


  其實我還滿想看這段故事電影化的，只是真的會有人想看大叔和卡車司機關門嗎?


  --


  "你要學會忍耐，哪怕周圍所有的人都不在了，只剩下你自己，你也要堅持到最後。"

  --<<祚明>>


