url: https://www.ptt.cc/bbs/movie/M.1680553717.A.4C3.html
title: '[討論] 鈴芽之旅.. 抓交替，及我做過的夢'
content: '這部電影裡，模模糊糊的抽象概念很多，大家的感受都不一樣

  google ''抓交替''，果然有這樣的感覺的網友


  我也很為貓咪心疼，但現世就沒有這樣的人嗎？

  有啊，鈴芽的小姨不就是其中之一嗎？！


  想想一場海嘯，會有多少人失去親人

  多少人揹上別人的責任

  小姨必需收養鈴芽了


  如果她不做，就必需有別人來做（比如丟給孤兒院）

  因此，小姨守護鈴芽，她就是鈴芽的要石

  長久的守護，十幾年過去，她也累了，也感覺好冷

  但在一陣爆發後，她說自己是心甘情願的

  希望鈴芽不要介意她一時的情緒


  如果沒有這些要石會發生什麼事？


  社會會解體，比地震還要可怕

  因此擔任要石，傾聽這片土地發出的聲音，過往的所有回憶

  這樣才能把心中竄出的不甘心給關上，鎖在常世之中

  直到死去的那天來臨，才能和所有的祖靈重聚


  -------------------------


  然後來說說我做過的夢吧...


  在好幾年前結束了一場戀愛之後，我受傷很重

  於是我做了場夢，夢中有一個人傷心的哭著，有一個人在安慰傷心的人

  而又有一個人從窗外走過，看著這兩個人


  這三個人都是我


  我是被哭聲吵醒，從夢中醒來的，醒來後發覺那哭聲就來自我自己

  像不像電影中的三個鈴芽呢？

  一個是小時的自己，一個是長大的自己，安慰著小時的自己

  而一個是在摩天輪，旁觀著兩個在常世相遇的自己（那時她以為是小時自己遇到媽媽）


  後來我把這個夢跟有學心理學的姐姐講

  姐姐說這正好符合佛洛依德的假說

  是本我，自我與超我


  所以啦，常世其實不是不可能存在

  它一直存在我們內心的精神世界裡

  如果你也能發現這三個都屬於自己的存在

  那就能感受到常世了




  --


  你說的就是鈴芽的回應，事情總是有很多面向，不會只有誰的立場是對的

  我當然可以把所有面向都交代，但這樣文章就會落落長，顯得我不會說故事

  戲劇的任務就是好好說故事，讓每個面向的人都覺得自己被傾聽



  我做這夢是因為，我不是什麼都不懂

  我知道我不應該傷心，但我明明很傷心


  於是我只好分裂成兩個自我了

  而在同時，我也能理解自己，知道自己的心靈能量有限，對這一切冷眼旁觀

  於是第三個我也分裂出來了


  --------

  我試著再描述一次，看會不會落落長，但我還是必需用講故事的方式


  我學姐本來在台北工作，但她母親病重時，她辭掉了台北的工作，改到台中來生活

  這肯定有捨棄了什麼，但她也得到了什麼；她得到最後相處的時光

  這個決定不能拖，因為才一年，她母親就走了


  但她也不是什麼都沒得到，她回到中部，因為生活步調較慢，就報考博士班

  母親走後她就專心攻讀博士


  我們不能說被綁住的人一定會變成''要石''，但人生軌跡肯定會改變

  而這一切必需心甘情願


  她上一次改變是為了丈夫，那時她在國外攻讀博士，放棄國外學位嫁人

  也放棄工作，後來離婚時她就心有不甘：我是為你放棄工作的，而你要和我離婚

  這也就造成她後來有機會要再攻讀博士，但這時她不年輕了

  年輕時若有博士會爬到什麼位置，現在退休年齡才拿博士，還能不能去那個位置？

  你要說沒捨棄什麼，那不對

  你要說那是自我設限，好像也對


  因為說不清楚，就只能模模糊糊的帶過了'
