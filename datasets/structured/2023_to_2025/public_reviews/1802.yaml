url: https://www.ptt.cc/bbs/movie/M.1677756843.A.239.html
title: '[新聞] 鈴芽之旅搶先場口碑狂掃全台飆破1570萬'
content: '《鈴芽之旅》搶先場口碑狂掃全台飆破1570萬票房 刷新《你的名字》口碑場票房紀錄


  觀影突破千萬人次，票房狂收138億的《鈴芽之旅》即將於週四（3/2）在台正式上映（英

  文片名: Suzume）。《鈴芽之旅》是由《你的名字。》《天氣之子》日本動畫大師新海誠

  根據311東日本大地震創作的現象級感人作品，《鈴芽之旅》於上週末在台以限量放映形

  式進行特別搶先口碑場上映，隨即引爆全台戲院觀影熱潮，搶先口碑場票房飆破1570萬，

  刷新新海誠《你的名字。》在台灣口碑場1370萬的票房紀錄。


  《鈴芽之旅》觀影心得和討論更洗板各大討論區，爆棚好評席捲全台，各大戲院一位難求

  。影評膝關節推薦「《鈴芽之旅》堪稱是新海誠災難愛情三部曲最壯觀的創意」、菜記士

  多分享「懷抱著思念活下去，新海誠的《鈴芽之旅》給了曾歷經傷痛的人們這樣的勇氣。

  」，不少粉絲因片中觸動心靈的感人情節淚灑戲院，紛紛力推「超讚……我現在整個語無

  倫次……」、「爆好看，劇情、畫面、音樂，各種推爆」，表示正式上映後準備繼續「二

  刷」、「三刷」！新海誠導演日前也特地錄製影片感謝台灣觀眾：「為了讓所有年齡層的

  觀眾都能盡情享受，我投注了百分之百的心力製作這部電影。期待與臺灣觀眾朋友們在電

  影院相見！」


  而第73屆柏林影展於上週日(2/26)落幕，入圍正式競賽片的《鈴芽之旅》也於柏林首映，

  放映結束後不僅全場滿廳觀眾感動不已起立鼓掌，更獲得觀眾與海外媒體的一致好評，整

  體評分超越本屆口碑大熱的作品《Past Lives》，一度衝上評分總榜第一名！外媒「COMI

  NG SOON」也給出高度評價「除了情感豐沛的配樂，《鈴芽之旅》獨特的視覺效果、親切

  的人物和精湛的故事描繪，是部必看之作。《鈴芽之旅》成功拿捏了心碎絕望與希望感之

  間的平衡，這也證明了新海誠的才華。」。儘管最終最高榮譽金熊獎頒給法國紀錄片《Su

  r l’Adamant》，新海誠仍表達對於粉絲們的感謝，「雖然《鈴芽之旅》未能在這次柏林

  影展中獲獎，但此行仍讓我獲益良多，也開始瞭解電影受到全世界關注的意義。之後《鈴

  芽之旅》的海外上映宣傳也將持續進行，那麼，我出發了。」


  《鈴芽之旅》劇情描述生活在九州鄉間的17歲少女鈴芽（原菜乃華 配音），某日遇到一

  名「為了尋找門」而四處旅行的神祕青年草太（松村北斗 配音）。好奇的鈴芽尾隨草太

  進入山中的廢墟後，在那裡發現了一扇宛如遭逢崩塌毀壞後，所留下的陳舊之門。受到某

  種神祕力量的吸引，鈴芽將手伸向了那扇門……。不久之後，日本各地開始出現類似的「

  門」，如果未能及時將門關上，存在於門另一端的災厄將降臨於現世。繁星、夕陽、和拂

  曉時分───鈴芽踏入的迷途之境，有著彷彿將所有時間融合在一起的天空……。於是，

  在神祕之門的引導下，鈴芽踏上了一段奇妙的“關門之旅”……。《鈴芽之旅》3月2日4D

  X、IMAX、Dolby Cinema同步全台盛大上映。




  --'
