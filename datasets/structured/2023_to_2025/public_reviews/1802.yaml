title: '[好雷] 鈴芽之旅 車庫之騙'
content: '先講一個不算雷的：建議不要看預告片。





  雷文防雷資訊頁








  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  首先講一個關於本劇類型的雷


  鈴芽之旅不是愛情劇。


  心懷期望愛情劇的觀眾必定帶著失望離場，因此我建議不要看預告片。帶著空白期望入場

  最為適合。



  會有這個提醒，是因為我看完電影後才去看預告片，卻赫然發現：車庫娛樂一直以愛情劇

  行銷此劇。加上新海誠長於編導愛情劇，導致很多人懷抱著愛情劇的期望入場。


  這些人必定失望出場。我走出影廳也時不時聽到人對於愛情線的部分表達失望。


  但本劇主旨從來不在愛情線。

  為此失望著實可惜。




  -----

  與本劇最有共鳴者當屬曾有心理創傷者(尤其是日本311受災戶，但不限於此)。



  #鈴芽 (Suzume)

  鈴芽是日本311震災的倖存者。這個哏埋到劇末才揭曉，因此劇情前半很多事情至此才會

  讓人恍然大悟：

  - 震災與海嘯使本就單親家庭的她4歲喪母，成為孤兒，因此片頭夢境才會在連漁船都掛

  在房子上的一片斷垣殘壁中哭尋亡母。


  - 巨型天災加上喪母，造成嚴重的心理創傷，使她在幼年的繪圖日記中將3月11日之後的每一天都將空白

  頁從第一行塗黑至最後一行。這段回憶在夢中不斷出現，暗示鈴芽的心理陰影面積巨大且

  如影隨形。


  - 她口中那個「很善良的人」、在醫院當護士救治病患的媽媽，在天地不仁的海嘯中仍喪

  命，使鈴芽看破生死。說出「生死不過是運氣使然」，來自她自身於震災中倖存、慈母卻

  殞命的深刻體悟。


  - 對草太的爺爺喊出：「我怕的是沒有草太先生的世界！」表達的未必僅是對草太的愛慕

  之情，也可能表達是對於「沒有閉門師而震災頻仍的世界」的畏懼。(有朋友反駁說：鈴

  芽自己跳下來當閉門師不就好了。但這樣說也太不尊重百年老店的專業了吧)


  - 承上，草太變成要石後，鈴芽不惜做一切努力要取代草太成為要石的原因，未必全出於

  愛慕，更可能出於責任感(拔出大臣、害草太附身於椅子)以及倖存者內疚(survivor''s

  guilt, 寧願死的是自己，而非更有價值的其他人)。後者尤甚，且呼應她的生死觀。這個

  心理學症狀板上已屢次討論，不再贅述。


  劇末鈴芽進入常世，遇見年幼的自己。將自己珍視的缺腳椅交給幼鈴芽，除了給幼鈴芽一

  個心靈的依附之外，同時也代表她終於能放下創傷，不再倚靠缺腳椅便能邁向未來。而她

  自己就是在片頭夢中看到的那位神似母親的女性，自我救贖於焉完成。


  此外，由於幼鈴芽在常世中見過男主，所以劇首就讀高中的鈴芽再次見到草太時，才因強

  烈的既視感翹課去追問：「我是不是在哪見過你？」未必單純只是因為草太很帥或有「魅

  惑之淚痣」。



  #大臣 (Daijin)

  他並非在劇末才「洗白」，而可能自始至終都惦記著封印蚯蚓的念頭。但因為

  鈴芽將他從封印狀態解放出來、並邀他「來當我家的孩子」而決意從之。故將要石之職轉

  移給草太，並將草太變成椅子(草太也知道，見後文)。


  - 沒有證據表明是大臣故意打開後門。由於要石鬆脫，後門被蚯蚓打開的頻率大增已成事

  實。大臣既然承諾當鈴芽的孩子，當然只能引領鈴芽和草太去下一個後門所在地關門。每

  次成功關門，大臣都說「鈴芽好厲害」，顯見大臣並沒有希望後門被開。


  - 大臣會說「會死好幾百萬人哦」，未必是出於惡意。天地不仁，以萬物為芻狗。

  他只是敘述事實，以加速鈴芽用椅子(草太)封印蚯蚓的決心。


  - 大臣期待「小王子與狐狸式」的情感連結，且以為鈴芽也是如此。在愛媛時，鈴芽追上

  大臣，大臣躺在地上露肚肚。在御茶水地下神社時，大臣環繞鈴芽腳邊撒嬌。在在都說明

  他喜歡鈴芽。但鈴芽從不認為自己隨口說說要來收養他的這一句話是承諾。(渣女？)


  - 大臣在東京和常世中屢次變身保護鈴芽。以行動證明其愛並非唬爛。


  - 由於鈴芽在常世中展現欲取代草太成為要石的堅定信念，對鈴芽有愛並受其恩的大臣才

  終於重新成為要石。



  此外大臣與鈴芽的關係 和 鈴芽與環阿姨(Tamaki)的關係恰成對比。環對幼鈴芽說：「來

  當我的孩子吧！」之後奉獻超過12年的黃金歲月照顧他；不過幼鈴芽別無選擇，可說是被

  迫從之，因此兩方其實心中都有介蒂，後來也被左大臣(Sadaijin)激發出來。


  相較之下，鈴芽信口開河對大臣說：「來當我們家的孩子吧！」卻從來沒愛過大臣。但大

  臣卻認真以待，並以行動保護鈴芽。上開兩例中，雙方的心境與動力全然不同，形成強烈

  對比。



  #草太 (Souta)

  草太一直宣稱「只要大臣回來當要石，我就可以變回人」 但大臣才是神呀！無論大臣如

  何任性，神說的才算數。當大臣說：「難道你沒發現這已經不再可能了嗎？」的時候，草

  太才終於不得不面對自己當下的使命：成為要石。(所以他才一直夢到自己結冰，呼應一

  開始大臣石像被拔出來的時候也是結冰的)


  這另外反應在草太一直叫不醒的狀況上。草太並非貪睡而每天賴床，而是在與肩負成為要

  石的現實搏鬥的結果。他屢次瀕臨放棄，但都被鈴芽叫回來。直到蚯蚓騰飛在東京上空才

  下定決心。


  草太90%的時間都以三腳椅的形象出現，根本不可能是所謂的「男主角」。他和鈴芽或許

  真有在一連串的冒險中產生情愫。但這和本劇主軸(鈴芽的自我救贖)相比，完全不是重點

  。




  ----

  最後補兩個和劇情沒啥相關的點：


  1. 我去電影院時，旁邊坐兩個專業新海誠粉絲。其中一位看完完拭淚，稱：「新海誠終

  於成功了。他把本來想在《繁星》講述的故事說完整了。」我因此去Netflix上重看了一

  次本已當作黑歷史忘卻掉的繁星，才驚覺確有相似之處。



  2. 劇中新幹線到達名古屋之前有經過一座黑瓦紅欄的天守閣。那就是戰國迷一定都聽過

  的清洲城。從JR清洲站走過去的路上會經過一個鐵道下的小徑(隧道)。火車和新幹線會從

  頭上的枕木上飛速駛過。由於頭皮會離火車非常近，因此感受會非常刺激。但沒事別亂去

  ，否則說不定會不小心進入常世。(？)




  --

  以上個人心得純供參考

  我只看過一次 不可能記得所有訊息




  --'
