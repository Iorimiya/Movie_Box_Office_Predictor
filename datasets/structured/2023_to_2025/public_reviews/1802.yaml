url: https://www.ptt.cc/bbs/movie/M.1678033901.A.82E.html
title: '[雷] 鈴芽之旅-當年4歲的小孩如今也是高中生了'
content: '還沒入場就已經知道了這部是在描寫311大地震

  而劇情也對應到了現實

  12年前的劇中女主角因為地震失去了媽媽

  12年前的今天也發生了日本311大地震 讓許多人失去了家庭

  而現如今日本社會面對這些災難帶來的傷痛

  我們也隨著新海誠一起經由這趟旅程來一起面對


  先說明立場

  我的主觀感受中 根據近期新海誠三部電影進行排序比較


  以一個電影的精彩程度來說

  你的名字>天氣之子>鈴芽之旅


  音樂面

  天氣之子=你的名字>鈴芽之旅


  但鈴芽之旅並不是說不好

  他作為一個描述災難後的作品實在也很難在劇情精彩程度超越你的名字

  但這部看完確實我比較認真去思考新海誠想表達什麼給觀眾的


  音樂面則是我覺得很可惜的

  這次的歌絕對不差

  單獨拿出來評價絕對跟前兩部不相上下

  但不知道為何在看電影的過程完全沒觸到



  以下含雷正文

  雖然已經在看完儘快發文了

  但還是有可能不小心記錯 若有麻煩提醒


  這部以我的理解搭配板上前幾篇看到的

  每個門代表著的是一個地震地點

  而門內的說明則為沒有時間的概念 以及死者的世界

  照我的看法對應到的現實狀況為對於這個災難永遠留在人們心中的痛


  這趟跟著鎮石關門的旅程

  劇情中是阻止地震

  實際上則是慰藉現實中這些災難的傷痛


  劇中女主被告知人的一生只能進入一扇門

  就像是告訴他 你只能去面對那最初的傷痛

  最後他也打敗最初的傷痛

  告訴了四歲的自己

  為來會有許多你喜歡的人

  許多喜歡你的人

  彷彿是告訴觀眾 即便現在你遇到傷痛

  撐過去 未來還是美好的



  看到這邊理論上這部的評價應該是可以更高的

  但為何會給予比前兩部低的評價是

  我覺得這部片情愛的因素加的太硬要了

  哭啊 今天早上剛看到的人

  你們下午一起關個門幫他換個藥你就這樣跑去跟他環遊日本關門

  最後還為了他命都不要了

  整部片女主給我的感覺是比天氣之子的國中生男主還不會動腦

  不過這部分很主觀 或許其他人不這麼認為就是了

  再加上也確實在劇情的轉變上並沒有像前兩部那樣帶給我印象深刻的感覺


  因此這部雖是佳作還是會排到前兩部之後


  --




  這部女主角對我來說真的扣分太多了

  挺可惜的


  謝謝提醒



  剛開場女主騎下坡被問路


  女主：跟你很熟嗎死肥宅


  全劇終'
