title: 'Re: [情報] 鈴芽之旅全台票房突破2億'
content: "這次車庫很糟糕的特典操作，\n\n首先是一堆品質很差沒吸引力的書籤就不貼了，\n\n我認為最糟糕的操作在兩個地方。\n\n1.樂聲戲院限定（車庫自己的影城）\n\
  \n\n強迫粉絲要蒐集只能去樂聲消費，\n\n而且樂聲的硬體設備真的是...\n\n2.最糟糕的扭蛋操作\n\n\n退一萬步就算你車庫真的很努力，\n\n沒辦法像中國那樣大市場可以爭取到更多特典，\n\
  \n沒關係，但你搞這種抽抽樂根本是黑到不行，\n\n就是一副要宰粉絲的嘴臉，\n\n\n來個沒比較沒傷害，\n\n搖曳露營電影版的志摩凜生日場特典，\n\n\n\
