  \n環阿姨跟芹澤再次嚇到\n\n卻又再次沉默\n\n讓人感覺這兩段的目的\n只是為了帶出環阿姨跟芹澤喜劇式的驚嚇畫面\n\n是一種日式漫才的表現方式\n\n但前後僅此兩段，且未讓段子帶出兩隻喵的作用\n\
  讓人本以為他們可能要說明整件事or開始引導眾人\n\n結果卻只是兩段搞笑的，其實反而顯得突兀\n\n\n\n\n(我記得爺爺講的是一\"次\"，\"個\"跟\"\
  次\"其實差滿多的)\n(這部分可能等以後串流出來再確認)\n\n但不管是哪種說法\n\n後面是怎麼會引申並了解到\n是要去當初誤闖的那扇門\n\n這個我個人是真的理解不能\n\
  \n即便不管這部分\n\n鈴芽當初到底是怎麼誤闖常世的？\n她有什麼能力？\n\n電影依舊沒有交代\n\n如果她沒有特殊能力卻能誤闖\n那不就代表當下受災後的倖存者\n\
  每個都可能誤闖，每個都能看到常世跟蚯蚓？\n\n這樣不會造成現世的混亂嗎？\n\n\n\n\n\n嗯，為什麼死者的國度沒有其他人....？\n有哪裡感覺到什麼亡靈的氣息嗎？...=.=\n\
  \n如果真要說，平行世界可能還比較能說服我....\n\n\n\n而最後的最後，鈴芽到常世\n遇到當初的自己，才理解\n\n原來她是要來渡化(?)當初的自己\n\
  \n要她自己跟自己說，要好好生活\n\n整個電影，你創造了一個叫常世的死者國度\n然後透過鈴芽的夢不斷追尋\n最後跑進常世，讓觀眾以為\n鈴芽最終會在這個世界見到母親\n\
  \n結果那個影子竟然是長大後的自己\n\nWTF？？？\n\n這個莫比烏斯環安排的意義到底何在？....\n\n\n\n其他，觀影時總覺得有些不順暢的地方\n\n\
  但細節我已無法一一記得\n就恕小弟難以一一列出了....Orz\n\n\n==================\n\n結論：\n\n嚴格來講，我覺得這部電影可能是新海誠在公路電影型態的一次嘗試\n\
  同開頭所述，我不是他的粉絲，是從你的名字才開始接觸的一般觀眾\n\n如果他之前有類似這樣的公路電影曾經嘗試過\n請恕我可能沒看過\n\n但這部電影，我覺得在新海誠身上看到很明顯的規劃問題\n\
  \n世界觀設定的模糊不清\n人物關連的感情混亂\n劇情安排的邏輯略有不通\n\n整體來講，看電影時我的重心幾乎是放在搞笑、音樂及畫面上\n在劇情面，真的很難有代入感\n\
  \n而雖然看電影時我大約知道這在講災難後的倖存者心理\n但恕我粗淺，我真的感覺不到這部電影有深入什麼部分在探討這個\n\n直到上來看大家討論才知道，原來這是講\
  \ 311 的\n\n甚至還有人說關門的地點都是跟地震有關的\n\n但是除了蚯蚓引發地震，中間好幾個關門點的遺跡\n該遺跡沒落的原因，不都跟地震無關嗎？\n\n\
  撇除這些，從畫面的表現、音樂的結合、輕快的節奏這部分來看的話\n想享受畫面跟音樂，不思考的情況下，用愉快的心情看電影的話\n\n那我推這部電影\n\n但是，想享受被劇情跟人物刻畫感動的人\n\
  \n我建議，不用去電影院看這部....\n\n更不用說，如果你是想了解對 311 倖存者著墨的電影\n那就更不推這部電影了\n\n以上，皆個人淺見，我只是個喜歡看電影的觀眾\n\
  \n若有見解錯誤的地方，歡迎指教討論，謝謝電影板\n\n--\n\n上PTT純粹是慌亂生活中忙碌時間裡緊張壓力下微不足道的我們唯一偷偷能做到的\n忙裡偷閒下的快樂時光用來放鬆慌亂生活中忙碌時間裡緊張壓力下微不足道的我\n\
  \n--\n\n其實很多電影不需要花太多時間交代細節\n\n哪怕是一個一秒的畫面或一句不用半秒的台詞\n甚至是同一個畫面，聚焦的地方改變一下\n\n都能交代一些簡單的事情，讓整體更完整通順\n\
  \n但這部不是\n\n\n如上所說，我個人覺得是不一樣要解說旁白\n\n但是電影的整體，留下太多的空白\n而其中的某些空白，還是關鍵點\n\n比如要石的設定條件等\n\
  \n這樣就很容易讓人搞不清楚導演要說的是什麼\n\n\n這部分就是我覺得最大的問題\n這部電影的邏輯太多地方說不通\n文本又交代不清\n\n\n我目前記得的，確實滿多地方都沒說明or演清楚\n\
  如果您有記得，我寫錯的地方，還請不吝告知\n\n或許我真的記性不好，漏看了\n\n\n關於時空交錯這一點的設計\n\n請恕我資質魯鈍\n我到現在還無法理解設計這個時空交錯想要表達什麼...Orz\n\
  \n\n我其實有想過，像這樣未來的自己拯救過去的自己\n這個在不少電影出現過\n\n但鈴芽的表現手法，讓人沒有驚喜感\n也缺乏說服力\n\n我自己覺得這是比較主要的問題\n\
  \n比如，如果之前夢裡的畫面，\n可以用個一秒顯示出模糊的人臉之類的\n而這個模糊的臉，對小鈴芽說\n\n你要相信，未來會很美好之類的\n\n讓觀眾一直相信，是媽媽鼓勵她往前\n\
  所以她才成長至今\n\n然後在最後再揭開，鼓勵她的是她自己\n\n可能還比較震撼\n\n但鈴芽這部的問題是，她前面沒有舖陳\n\n比如這個人影對她說了什麼，或造成什麼影響之類的\n\
  或者因為人影的鼓勵，讓她走過喪母之痛等等\n\n都沒有，結果後面突然來一個自己救自己\n\n我們會感覺不到，她到底救了自己什麼....\n\n語焉不詳的表達手法\n\
  是我覺得貫穿這整部電影的共同問題就是\n\n\n這點其實有點說不過去\n\n如果要以命運解釋一切\n\n那就像蜘蛛人三為什麼要蠢到帶壞人回家\n結果害死梅嬸\n\
  \n因為命運讓他遇到了那些\"他覺得有救的壞人\"\n所以就救回家了，沒想到會害死梅嬸\n\n這都是命運的安排，沒有那麼多為什麼\n\n你看到了這樣一部電影，也是命運的安排\n\
  \n是像這樣解釋的嗎？\n\n比如我的問題不是路上怎麼那麼好運會遇到一堆好心的人\n這個可以用命運解釋，沒有問題\n\n就像電影總是會有一堆突發事件\n這沒有問題，因為這就是電影的手法\n\
  \n是為了推進電影所需要的手法\n不需要解釋原因\n\n比如羅拉快跑，我很喜歡\n但不會要它解釋為什麼羅拉可以不斷重覆選擇\n\n也不會覺得它不合理\n\n但鈴芽不是\n\
  這是一部重劇情的電影\n\n結果一堆關鍵的東西都留白\n前後的情緒轉折沒有前因後果\n\n這到底是電影的手法出了問題\n還是命運的問題？\n\n或許您可以研究看看\n\
  \n\n我覺得您可能對所謂的填鴨式教育\n跟國外的開放式教育有很大的誤解\n\n填鴨式教育是不斷的塞東西到你的學習過程\n而不給予你思考答案的機會與時間\n只告訴你，你該怎麼做，讓你缺乏獨立思考的能力\n\
  \n但開放式教育也不是留一堆空白\n然後要你自己去尋找答案\n而是給你主題跟目標，但要你自己去經歷過程\n找出適合自己的答案，培養你的獨立思考能力\n\n比如電影中常會看到\n\
  美國老師教育的方式，可能是訂一個題目\n叫做對二十世紀最有影響力的人\n(這叫訂定方向)\n\n然後要你去自己找資料，自己研究\n最後報告，你覺得最有影響力的人是誰\n\
  你為什麼覺得他最有影響力\n他影響了什麼\n\n這樣一來，每個人的答案都會不同\n但都切合主題\n\n這才叫開放式教育\n\n但鈴芽這部電影不是\n\n它是劇情類的電影\n\
  \n因為作者可能有他想表達的東西\n傷痛的沉重、自我的定位、生命的無常等\n\n結果你看完說，這是一部喜劇，超開心的\n嗯？你這樣還覺得導演有表達出他要的東西嗎？\n\
  \n而如果真要以開放式教育來形容鈴芽\n\n就像是老師出一個主題\n要你找出可以關門的東西\n\n那理論上，你可以用大鎖、用卡榫、用鑰匙或破壞絞鍊\n結果你回答老師這些方法時\n\
  \n老師卻說，不對喔\n\n你只能用要石鎮住\n\n但是要石要轉換形態才能鎮住\n而轉換的方式，我不告訴你呦\n\n這種不說清楚，卻牽涉到標準答案的表現方式\n\
  才是這部電影的問題\n\n還是你覺得，要石的設定在這部電影不重要\n\n不需要說明清楚？\n\n說明清楚了就會變填鴨式電影？\n\n以這部電影來講，要說開放式的想像的話\n\
  應該是要在結論\n\n比如 A 覺得他看完有所成長，這是部關於自我成長的電影\nB 覺得很難過，原來震災受災戶內心這麼煎熬\n\n不同答案，但切合電影意旨，這應該才是開放式....\n\
  \n而不是把關鍵不說明，然後說這叫做刻意留白要你想像\n這其實不太能說服人....\n\n\n確實，我個人看法也是覺得表達手法的問題很大...."
