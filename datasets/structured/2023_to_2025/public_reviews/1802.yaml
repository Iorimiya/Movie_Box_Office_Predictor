url: https://www.ptt.cc/bbs/movie/M.1677944458.A.431.html
title: '[普雷] 鈴芽之旅'
content: '今天在板橋看下午5:20的數位場，人真的很多，基本上剩前兩排位子，先說無關電影的事

  ，拜託看電影至少要有基本的尊重，面對螢幕最右邊的區塊吵的不行，大肆的聊天是把電

  影院當在家裡看Netflix嗎？拜託給別人一點點尊重。


  電影大致感想：滿分10分這部大概6分，5分給了音樂與畫面真的很美，劇情真的只值1分

  ，大概只比泡泡好一丁點。


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~











  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  直就說缺點

  1.男女主感情線

  這條線著墨真的好少，從第一眼女主覺得男主很美，然後可能關門到時候覺得男主帥氣，

  後面男主就變成椅子了，椅子期間感情戲好像也沒有特別深刻，但到最後女主卻可以為了

  男主犧牲自己，也跟她阿姨說我去尋找愛了，簡單的匪夷所思，不過同行友人提了一個觀

  點，女主小時候就見過男主，只是忘記了，所以第一幕騎腳踏車遇見男主才有命中注定的

  感覺。


  2.主線劇情像打怪升級

  我是覺得前面開門關門看到最後是有點乏力，更大的缺點是在於過程中形形色色的人都像

  是工具人，他們只是推動劇情的進展，對女主好像也沒什麼影響，除了芹澤刻畫比較多，

  橘子女跟雙胞胎媽媽好像都是可有可無的角色，如果只是展現人情味好像有點太簡單了。



  3.爺爺的角色功能

  按照整部劇的設定來看，會發生地震的原因是要石鬆脫造成蚯蚓跑出來，而關門師來不及

  關門而產生地震，那311大地震是不是代表爺爺沒來得及關門？或是有其他的關門師來不

  及關門所以產生這樣巨大的災害，關於311大地震的描寫其實可以更深刻，不然顯得這部

  的劇情過於薄弱，爺爺也淪為前面配角一樣的工具人，負責告訴鈴芽回到她第一次穿過的

  門這件事就退場，其實有點可惜。


  4.阿姨與鈴芽的關係

  關於阿姨與鈴芽之間有複雜的關係，劇情卻只有點到為止，僅僅用一小段阿姨的內心話與

  鈴芽內心也有的壓力說明複雜的關係，後面又快速和好，因為鈴芽只想追愛，阿姨瞬間放

  手追愛，完全不懂為什麼要設定這個衝突點，如果是為了設計讓左大臣出場，那為什麼左

  大臣要這麼做，完全不明所以。



  目前想到的大概就這樣，但個人認為還是值得進電影院看，畢竟音樂跟畫面不在電影院看

  確實很難好好呈現。


  --

  完全一語中的，沒死人的蚯蚓還能理解，可能怕太過寫實？但過於扁平單一的公路旅行看

  了真的煩躁，遠景的臉我也很疑惑，背景都這麼美了，有需要這麼偷懶讓畫面這麼不協調

  嗎'
