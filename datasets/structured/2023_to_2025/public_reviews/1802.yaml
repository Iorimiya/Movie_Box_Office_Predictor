title: '[新聞] 「鈴芽之旅」險變「戀在椅上」 新海誠揭'
content: '新聞網址：



  「鈴芽之旅」險變「戀在椅上」 新海誠揭片名幕後[影]

  2023/3/13 15:23（3/13 18:27 更新）


  （中央社記者葉冠吟台北13日電）日本動畫電影「鈴芽之旅」2日在台上映至今，連續蟬

  聯雙週全台票房冠軍，票房突破新台幣1億2200萬元。導演新海誠透露片名差點變成「戀

  在椅上」，忍不住吐槽自己命名品味。


  「鈴芽之旅」以311東日本大地震為靈感背景，描述生活在九州的17歲少女鈴芽，某日遇

  到一名「為了尋找門」而四處旅行的神秘青年草太，她尾隨草太進入山中廢墟後，發現了

  一扇陳舊之門。


  受到某種神秘力量吸引，鈴芽打開了那扇門，不久之後，日本各地開始出現類似的「門」

  ，若未能及時將門關上，存在於門另一端的災厄將降臨於現世。


  電影上映後，不僅日本、台灣票房均佳，地震、常世、門、封印災禍的要石等特殊故事題

  材也連帶引發眾多網友熱議。其中，男主角草太被神秘的白貓「大臣」變成了一張三腳椅

  ，被迫以椅子型態和鈴芽展開「關門」之旅，也獲得許多討論。


  新海誠曾分享，原本「鈴芽之旅」的片名規劃命名為「戀在椅上」，是名符其實的「與變

  成椅子的對象相戀」。不過當新海誠與製作人川村元氣討論到電影的設計時，川村元氣覺

  得故事很有趣之際，忽然為它想到另一個名字，也就是「鈴芽之旅」。新海誠聽到後覺得

  像拼上了一塊新的拼圖，並採用作為最終片名。


  不僅是「鈴芽之旅」，過往新海誠的電影「你的名字」，最初暫定片名是「若知是夢」，

  而「天氣之子」原名則為「預告天氣的你」，新海誠都是在身邊的人提議裡修改最終片名

  。他忍不住笑說：「最近作品的標題都是他人提供的點子，我自己的命名品味實在難以信

  任。」


  至於「鈴芽之旅」的戀愛故事，新海誠認為，重要的其實是「與變成椅子的對象相戀」的

  概念，他指出這部分或許可以說是格林童話「青蛙王子」的變體。比起描寫戀愛對象的美

  醜問題，新海誠更希望著重描寫「自己被困住而失去自由」的感覺。（編輯：張雅淨）11

  20313


  --'
