url: https://www.ptt.cc/bbs/movie/M.1677922246.A.C74.html
title: '[微好雷]【鈴芽之旅】草太先生 我可以踩你嗎？'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  影片影評



  從2016年 以【你的名字】在全球獲得3.8億美元總票房收益的新海誠，堪稱是近年來日本

  動畫界最引人注目的明星創作者，在這之前的新海誠，是以「僅僅數人的工作團隊就可以

  製作意境優雅又美麗的動畫作品」在動畫界當中極有名氣的創作者，幾部作品如【星之聲

  】、【雲之彼端，約定的地方】、【秒速五公分】、【言葉之庭】等作品都頗獲好評，擁

  有極為死忠的支持者，而新海誠在【言葉之庭】之後與東寶合作，製作出更具規模的【你

  的名字】之後，才一舉成為廣為人知的電影名人。


  而在這之後，新海誠接連推出新的電影作品，2019年的【天氣之子】與2022年的【鈴芽之

  旅】。


  以我這個多少接觸過新海誠作品的觀眾而言，【鈴芽之旅】的故事走向其實跟過往我所熟

  悉的新海誠很不同。在這之前，新海誠的作品角色往往心裡話多過實際的對話，所以看他

  早期的作品會急死人，因為大部分的情況都是兩方各自想各自的，就算可以溝通也都是很

  不直接的對談，也許是因為新海誠自身的個性與喜好（他曾自承受到村上春樹與宮崎駿作

  品的影響頗深），也可能是因為早期他個人的成名作是花費很少的成本所做出的技術考量

  ，他的作品最大的特色，就是會經常出現細微描繪的遠景與靜物，透過各種光影的變化展

  現出美感，一張張精美會動的畫作、動態不會很誇張劇烈，但是相當的精緻，而片中的人

  物就在這些美景當中行走、穿梭，搭配角色間的內心獨白，與浪漫的流行音樂，呈現浪漫

  唯美的氛圍。


  這些讓人一看就能立刻辨別出來的作者標記，在【你的名字】上映時仍舊有大量的留存，

  不過為了商業考量，【你的名字】的故事情節與節奏都變得比過往的新海誠作品明快，故

  事不再只描繪角色的內心世界，主角生活周遭的日常對話與故事變成了主線，那些內心的

  獨白與靜態畫面就減少了許多。


  其實身為一個觀眾，我覺得這些轉變是良性的，過去的新海誠很唯美浪漫，但是我也覺得

  他太過文青自溺，在故事比較短的時候，他的浪漫餘韻很強，但是只要故事超過五十分鐘

  以上，他的作品往往會讓沒有耐性的觀眾不耐煩，不過新海誠早期的每一部作品都可以感

  受到在掌握觀眾的情緒有顯著的進步，到了【言葉之庭】，新海誠已經很懂得適時將壓抑

  的情感釋放感染觀眾的情緒。


  而在【你的名字】與【天氣之子】的幾段結尾，新海誠更加的熟練，最後少年少女之間互

  訴衷曲的獨白與音樂，都能將氣氛烘托到甜蜜的要死，想當年，電影的宣傳號稱有曖昧的

  男女們看完了【你的名字】出來就會在一起，雖然稍嫌誇張，但是自有其道理。

  但是有趣的是，這樣善於描繪純愛的新海誠，到了【鈴芽之旅】卻似乎不再把重點放在男

  女的感情上了。


  過去的新海誠作品在描繪青少年酸酸甜甜的愛情與戀慕一直相當的拿手，但是到了【鈴芽

  之旅】，新任的「新海誠女郎」岩戶鈴芽一反過去那些總是在內心糾結卻老不行動的角色

  ，從一開始看到他的命中注定宗像草太，就勇敢追愛，很多小細節也顯示了她完全是個先

  斬後奏的人，看到椅子二話不說一屁股坐下去，拿東西搆不到也是先踩了再說，完完全全

  成了一個行動派的少女。


  甚至不只是鈴芽，鈴芽在路上碰到的各種女生每個都是行動派。當然這種女性過去在新海

  誠電影裡頭也不是沒出現過，只是多半都是屬於配角或是在一旁助攻的角色，作為主角可

  能還是第一次。


  而且，過去的新海誠經常會放慢腳步刻畫的男女情愛描繪，在這一次幾乎全都沒有了，鈴

  芽煞到草太就是一瞬間的眼神交會，鈴芽這個凡事都先做再說的角色不再像新海誠過去的

  那些年輕男女這麼優柔寡斷，但也因此，片中人與人的感情激盪都不像過去的新海誠那麼

  文藝了。


  然而我總覺得，新海誠這一次的描繪重點，似乎不再著重在少女身上，片中非常大幅度地

  刻劃由「要石」化身而成的可愛貓咪「大臣」。大臣這隻貓的臉雖然看起來並不是寫實的

  貓，反而比較像是【龍貓】裡頭的龍貓公車那樣的貓妖，但是每次大臣只要一上場，幾乎

  都是各種貓咪翻身、舔毛、遮臉、蜷縮的細節萌樣，對於我這個貓奴來說那些動作實在太

  熟悉，新海誠還在電影當中埋入了大量致敬，甚至還直接放了【魔女宅急便】的開場插曲

  在裡頭，讓我不由得覺得新海誠一定是個貓奴。


  結果資料一查，新海誠果然是貓奴，2004年7月，新海誠在製作【雲之彼端，約定的地方

  】時在西新宿撿到一隻生病、虛弱的幼貓，性別母。新海誠收養了牠，並以該片的女主角

  「澤渡佐由理」的名字取名為佐由理，除此之外他應該還養了不只一隻貓。而佐由理則在

  2020年的十六年後過世了。


  這樣回頭看【鈴芽之旅】，想到大臣這隻貓剛出現在鈴芽窗前那瘦巴巴的可憐模樣，聽到

  鈴芽對牠講的台詞之後的各種反應，還有片尾的行為，忽然覺得新海誠也許把對貓的情感

  也投射到電影當中了。


  也許這一次的新海誠，他投射情感的對象不再是女孩了，是貓。


  回想起來，從【追逐繁星的孩子】與【天氣之子】，新海誠就已經頻頻讓貓出現在電影當

  中，到了【鈴芽之旅】，貓的身份不再只是配角，而是成為了類似神靈的身份，而且在最

  後還成為為了人類而付出的犧牲對象。回想在【天氣之子】時，犧牲的對象還是陽菜這樣

  的少女，當時的主角帆高還會為了愛寧可改變世界，也要救她回來，而到了【鈴芽之旅】

  ，鈴芽變成要在大臣與草太當中選擇，最後變成了人間椅子的草太成為了鈴芽即使犧牲自

  己也要救回的選擇的時候，大臣選擇犧牲自己，而且還開口說出了：「雖然沒有辦法當你

  的貓」的台詞，以及鈴芽的阿姨對四歲的鈴芽脫口說出：「你來當我的女兒吧」的台詞，

  還有阿姨在左大臣的法術底下對鈴芽說出內心真正的陰暗面，都彷彿是種對於逝去者的內

  心投射。


  等等，這麼說起來，鈴芽的個性與行為（看到椅子也不徵詢對方意見就坐、直接踩椅子）

  也挺像貓的個性的。


  但是新海誠除了對貓的情感投射之外，也把環境凋零的情境描繪進了電影當中，鈴芽從九

  州宮崎縣開始，一路與草太追逐大臣到東京，然後再一路到了仙台，遇到的每一個人都是

  或多或少背負責任的女性，而每一個要關閉的「門」幾乎都是廢墟，而每一個廢墟在關閉

  門之前都有各種的回憶，最後鈴芽抵達的仙台正是他幼年時期居住的地方，而關閉「門」

  之前會回想起當地的回憶，然後再由鑰匙鎖上，這種劇情刻畫的主旨，也許是新海誠覺得

  想要面對明日，必須要放下對過往的眷念，要不然就會引發巨大的災難（蚯蚓），然後所

  謂的「要石」就跟【天氣之子】的雨女、【你的名字】當中的巫女一樣，新海誠的電影當

  中，往往都會出現這種為了大局，而被犧牲的個人角色，因此草太被變成了「人間椅子」

  ，最後必須犧牲自己才能夠壓制災難，只是這一次的神靈比起【天氣之子】的雨神更為慈

  悲，從片中草太的爺爺聽到草太的消息的反應，以及黑貓「左大臣」出現後的對話，左大

  臣與大臣或許在過去也曾經是人所變成的，因此片尾草太的拯救，也許也能解讀為前人決

  定繼續犧牲、背負責任，好讓新世代能夠獲得幸福「活下去談戀愛、生孩子、做自己想做

  的事」。


  【鈴芽之旅】若是要看男女的情愛與浪漫，那麼絕對不如【你的名字】與【天氣之子】與

  【言葉之庭】，如果想要的是文藝的對白、優雅的靜物畫面的慢步調浪漫的話，那你可能

  就要調整心態。這一次的新海誠只把男女間的純愛當成是一個附加的元素，他這一次真正

  想提的，可能還是對於家庭責任的背負以及對於失去親人的之痛的療傷。而擅長利用作畫

  、聲優的配音念白與音樂打動觀眾的新海誠，在這一點依舊還是頗有情感的渲染力，片尾

  一幕鈴芽的獨白可說是電影最深刻的催淚點，如果你對於【鈴芽之旅】沒有太多的預設立

  場的話，那麼這部電影絕對能夠感動你。


  --


  男人是一種很悲哀又很容易控制的動物，因為他們往往拼了命的取悅異性，或是從各種媒

  介取得任何可以引起性幻想的事物，甚至還因而犯下強姦或是偷窺等大小不一的罪，但是

  追根究柢，目的卻只是想要從自己的身上擠出那麼5C.C的液體而已。

  粉絲團



  --'
