title: '[好雷]  鈴芽之旅'
content: '趁要下檔前趕快去看


  看完的感覺就是那畫面太美


  真的還是要看大螢幕













  雷

  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  一路從南到北的日本之旅


  風景很漂亮，好喜歡日本鄉下的小鎮風格


  再來喜歡每次在關門時那段屬於土地的記憶


  雖然劇情與音樂搭配比較沒有


  你的名字（彗星）和天氣之子（兩個人在空中飛）


  那種澎湃讓人悸動的感覺


  但和天氣之子還有你的名字相比


  感受比較貼近生活事實（雖然劇情還是超現實啦）


  結局是好結局，也是正向看


  但不知道有沒有人看完之後和我一樣


  就是有一種說不出的淡淡的哀傷


  大小鈴芽那段，還有大家出門說我出門了


  還有大臣變回要石（雖然前面覺得這貓真G8)


  真的有點難過......





  -----

  Sent from JPTT on my Sony XQ-AS72.


  --'
