url: https://www.ptt.cc/bbs/movie/M.1677828823.A.EA2.html
title: '[討論] 鈴芽之旅 彩蛋&劇情腦補'
content: "先預留一頁給還沒看過的朋友\n\n這次的鈴芽之旅光是看畫面就相當值得\n劇情部分也很多都前後呼應有交代\n至少我是看的很開心\n跟蟻人比屌打到爆\n\
  \n以下整理自己看到的一些彩蛋和劇情\n\n\n\n\n\n\n\n\n\n\n防雷\n\n\n\n\n\n\n\n\n\nQ. 大臣為什麼後來決定變回要石？\n\
  \n鈴芽跟他說來當我的貓吧\n但草太絕對不會允許，所以貓貓把草太詛咒變成椅子\n讓他去當要石這樣就可以當鈴芽的貓了\n\n後來草太變成要石後，鈴芽很生氣的跟貓貓說最討厭你了\n\
  所以大臣就低落下去\n\n最後鈴芽進門前和要石說了一句話才讓大臣打起精神恢復原狀，最後決定獻身變回要石\n\n\nQ感情線薄弱？\n小時候的鈴芽在常世就看過草太了\n\
  （至於為什麼會看到\n因為常世是時間空間交織在一起的，往生者的世界）\n\n因此在溫泉遺跡中自言自語說：我覺得以前好像看過你\n另外一個可以解釋的就是男主角威能\n\
  如果今天草太是個肥宅可能就不會有後續的故事（？\n\n\nQ蚯蚓的設定看不懂？\n有經歷過大地震的應該都有聽過低鳴\n從遠方一個轟隆聲靠過來\n很像一條蛇在地底鑽動\n\
  \n我倒是覺得蚯蚓的設定很有趣\n最後在常世被封印的時候落在地上化成了丘陵\n也跟現實發生地震後會有地面隆起相呼應\n\n照這個邏輯\n有時候蚯蚓可以踩但有時候不行，\n\
  也可以解釋成土壤液化的關係\n\n\nQ為什麼不去名古屋或新潟？\n有版友有提到這些地方都有發生過大地震的紀錄\n然後草太有提到關東百年前有大地震的紀錄\n正是1923年的關東大地震\n\
  以及大家耳熟能詳的阪神大地震、311大地震\n\n\n彩蛋部分：\n\n1.片尾兩個小孩的椅子也都畫了眼睛XD\n\n\n2.經過高速公路看到很多載著廢棄土\n\
  應該是經過福島未歸還區域附近\n\n\n3.常世中的火災是311大地震後很多地方都發生類似的火災\n而且燒不完那種\n\n4.草太好友最後跟阿姨說話時煙沒點燃\n\
  最後的車子也貼滿了膠布\n\n5.鈴芽關上門後說的是「我出發了」\n\n\n6.草太在車站告別鈴芽時說\n能夠壓住蚯蚓的是人們的念想（有點忘記台詞了）\n就是人們對於先人或者地方上的思念\n\
  \n7.最後鈴芽跟草太說：你回來了\n的時候是長袖\n劇中一開始是短袖\n因此是冬天回去找鈴芽\n\n\n\n\n\n\n\n\n\n前面有幾篇解釋的PTSD論點我也覺得很有意思\n\
  \nNHK Yt有一部紀錄311大地震前三天的影片\n很多畫面應該都有參考\n有興趣的版友可以搜尋NHK\n The first three days\n\n\n\
  日旅版有一篇進去未歸還區域的見聞\n也很值得一看\n\n\n\n這部片對於經歷過這些大自然無情的人\n以及生命無常的人確實能夠救贖到內心\n然後重新整理後再度出發\n\
  充滿勇氣跟感動\n\n真的是值得細細品味的好片\n（無論畫面或背後的含義）\n\n\n\n\n題外話：我特地去找Lawson店看能不能找到草太的家\n但好像在聖橋西北附近沒有看到類似的店…不知道是參考哪間店的原型\n\
  \n\n--\n有意思\n反倒是草太很守規矩\nJK還踩他身上有夠爽的（？\n對，這邊大臣情緒轉換很多\n從失望到覺得看開到決定奉獻自己\n補充\n看到有人說無法接受咒語的設定\n\
  但我認為其實整部電影想要表達一個很重要的價值就是人們對大自然的感謝與敬畏\n\n仔細看草太的咒語\n以及最後兩隻大臣封印蚯蚓前\n燃燒大地變成日常時的內容\n\
  都是表達類似的概念"
