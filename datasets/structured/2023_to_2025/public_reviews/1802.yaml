url: https://www.ptt.cc/bbs/movie/M.1679413264.A.383.html
title: '[深度雷] 鈴芽之旅 - 無雷推薦+好雷影評'
content: "今天趁著下午有空的時間\n\n衝了戲院 把一直想看的這部看完了\n\n雖然我知道我已經很晚 但還是習慣先寫一段無雷的推薦\n\n必須說 新海誠的作品\
  \ 畫面張力真的超強 在影廳看真的很過癮\n\n劇情部分 雖然因為電影想說的主題非常宏大 導致部分細節處理真的很倉促\n\n但至少在主線上 它完成了一個完整的故事\
  \ 也清楚的表達了想傳達的理念\n\n並且驅使觀眾走出影廳後 持續思考帶出的意義\n\n就這點上 我認為它已經成功了\n\n所以 推薦給大家\n\n不管你是單純想看新海誠的畫面\
  \ 或是想看一部發人深省的電影\n\n我想這部都能滿足你的期望的(阿 不過想看戀愛電影的可能會失望就是了XD\n\n~~~~~~~~~~~~~~~~~~~ 雷文\
  \ 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n先說 我雖然喜歡新海誠的電影 但並不是粉絲\n\n除了這部之外 我唯一看過的\
  \ 就只有君名而已\n\n所以我不會用其他作品來做對照\n\n在打這篇前也盡量不去看別人的解析 全部以我自己的理解為準\n\n也許我的觀點 已經有人提過了也說不定XD(畢竟我也不覺得這有很隱諱\n\
  \n如有其他想法或是要補充的 歡迎下方一起討論~\n\n\n回歸正題 這次的作品想要表達的核心觀念 我認為只有一個 就是\"\"\n\n首先 第一個問題 \"\"\
  究竟是什麼？\n\n在關門的步驟中 草太要鈴芽 去回想在這個地方的人們的生活\n\n結合門的地點都在廢墟 可以做出一個推論：\n\n\n\n這些思念體 渴望離開常世\
  \ 來到現世\n\n且期望已經看不見它們的人們 感受到其存在 於是引發了\"地震\"\n\n而要阻止蚯蚓 電影展現的手段是關門\n\n但其實重點是\"\"\n\n\
  當現世的人們 紀念過往人們的存在\n\n又或者說 當過往的人們 意識到仍然有人紀念他們的時候\n\n便能壓制住蚯蚓來到現世的暴走\n\n\n事實上 我認為 整部電影不只是蚯蚓\
  \ \n\n大臣為何要對著草太說\"你很礙事\"呢？\n\n我想 大臣一開始確實是不想再繼續擔任要石了\n\n因為它發現 沒人再\"紀念\"它鎮壓蚯蚓的努力\n\
  \n\n從爺爺對大臣的態度 不難看出前代的關門師 對雙要石是非常尊敬的\n\n與之對比的是 草太認為大臣鎮壓蚯蚓 是它的\"職責\"\n\n面對這樣的態度 也無怪乎它會想要脫離這一切\n\
  \n而當鈴芽認可大臣後 它就願意為了鈴芽再次化身要石這點\n\n就知道 僅僅如此罷了\n\n(在鈴芽否定大臣的那段期間 大臣是不跟鈴芽對話的)\n\n除此之外\
  \ 草太從要石中脫離的過程 其實也暗示了這一部分\n\n\n\n大臣、草太、蚯蚓 全都指向了\"紀念\"這一件事\n\n\n\n我想不只是這樣\n\n鈴芽的母親\
  \ 是在311大地震中過世的\n\n思念母親的鈴芽 為了要尋找母親 誤入了常世\n\n而多年之後 長大的鈴芽回到了以前的家 面對過去\n\n才知道 當初給出椅子的\
  \ 不是別人 正是自己\n\n當時的小鈴芽 執著於找到媽媽 不願意接受媽媽已經不在的事實\n\n透過長大的鈴芽安慰她 之後還會遇到非常多愛你的人\n\n同學、千果、瑠美、芹澤、阿姨...\n\
  \n\n\n最終 鈴芽將椅子交給小時候的自己 除了完成閉環外\n\n同樣表示鈴芽對媽媽的執著放手 能夠真的去面對 並享受接下來的人生\n\n\n\n總結來說 新海誠透過這部作品\
  \ 傳達了他想訴說的\n\n鈴芽之旅的主題 無疑是\"地震\" 又或者更直接地說 是\"311大地震\"\n\n而我們應該要怎麼樣去面對這樣的災難？新海誠給出了自己的答案：\n\
  \n\n\n\n\n\n\n題外話 我非常喜歡這次電影的中文譯名\n\n鈴芽之旅 除了代表鈴芽關門的這一趟旅程\n\n也代表了她從小鈴芽接收椅子 到長大交出椅子\
  \ 這樣的一個過程\n\n比起\"鈴芽戶締\" 更加昇華了這一部作品\n\n\n當然礙於篇幅 + 有些藍色窗簾 電影的一些細節我就不多提了\n\n對我來說 這是一部充分表達了其主題內涵的作品\n\
  \n能夠讓我出影廳之後仍然持續回味其中的內核 進而與作者產生共鳴\n\n我想 就足以稱作是一部好電影了吧\n\n--\n\n--"
