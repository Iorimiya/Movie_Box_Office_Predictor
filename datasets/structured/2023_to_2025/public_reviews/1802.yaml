url: https://www.ptt.cc/bbs/movie/M.1679998873.A.329.html
title: '[討論] 最喜歡《鈴芽之旅》的原因和猜測'
content: '防雷--------










  宛若一個渴求被愛的小孩子，要祂去接受什麼拯救世界自我犧牲的宿命？


  想到處去玩、想引起照顧者注意才是這個階段的孩子會有的樣貌....直到祂發現鈴芽願意

  為草太犧牲，說出「我當不了鈴芽家的貓了！」


  有個悲傷的猜測：或許兩位神明原先也是關門師？一長一幼，為了鎮壓蚯蚓而成為了要石

  、停留在常世。


  從祂們成為要石之後，祂們的間就停止了....所以大臣一直維持原先孩子的心智。


  從左大臣和草太爺爺的對話去推斷：

  說不定關門師「宗像一族」本就是有能成為要石的體質，在某些時刻要決斷是否用自己的

  未來確保任務成功。


  .



  鈴芽與草太跟之前的作品相比，少了些超現實的浪漫，多了些寫實任務與自我成長。

  （通常動畫片唯美浪漫、不明所以的愛我吃不消）


  那種因為對方風趣、因為新鮮而心動的戀愛橋段，大概要脫離現實很遠才能投入吧？

  而《鈴芽之旅》中維繫男女主角關係的軸心是責任。


  打從一開始誤解封要石導致草太疲於奔波，到後來感受到這片土地上的美好聲音可能會消

  失。

  鈴芽的角色設定，不完全是個為愛奮不顧身的青澀少女，更多的是願意負責任、想好好守

  護世界、開始珍惜身邊人事物的成人。


  假設...




  鈴芽是新海誠三部曲中，較能體現。


  並非指一個小女生不能因邂逅而心動或想入非非，有時候愛的形式是




  .


  其中，向過去的自己傳遞勇氣、面對創傷自我療癒，更是哭花了我這張大餅臉。擁有重大

  創傷的人，或多或少會有一部分的自己停留在過去，被遮蔽了、斷開了，呈現出一種選擇

  性失憶的狀態，一有點連結就會莫名恐慌。


  但更好的方式是「」，不是拿畫筆塗黑忘卻，而是

  。


  套一句《黑暗榮耀》文同垠說的：「我已經不站在那條走廊上了，你也別繼續待在體育館

  裡。」


  算是有點類似的概念吧？

  真的是寓教於樂、唯美悲傷並存、難得的好作品。好美好喜歡。



  ------------

  無廣告全文blog



  --

  真的！她在同理方面比之前角色細緻，

  不是純為了腦愛要如何如何的那種~

  而且結局沒有正面描述他們在一起，也是種留白美，或許彼此只是友達以上，或一段刻骨

  的記憶。

  超喜歡！沒有前面的鋪陳，就沒有最後的感動。聽小鈴講話都心疼了'
