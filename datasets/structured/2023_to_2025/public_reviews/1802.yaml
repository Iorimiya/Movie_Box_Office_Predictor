url: https://www.ptt.cc/bbs/movie/M.1697762496.A.637.html
title: '[好雷] 鈴芽之旅 感受與感謝之旅'
content: '鈴芽之旅


  看完鈴芽之旅已經很久了

  原本真的是很想當下就把心得整理好寫出來

  但是打了一點草稿後就一直被各種事情耽擱

  (其實就是懶)

  一直到現在才把它整理寫完


  其實很多細節都忘了

  但是有些沒被忘掉的還是很想把它們紀錄一下

  有空的人可以加減看一下

  這篇遲到很久很久的好雷心得文

  以下有雷


  (1)災難三部曲


  從妳的名子去看院線開始

  我才認識了新海誠這位大師


  天氣之子是在NETFLIX上補起來的


  這次剛好有時間可以在電影院看鈴芽之旅

  真的是很慶幸自己偷到這個空檔

  能在電影院欣賞這部撼動人心的電影


  我個人認為

  鈴芽之旅可說是三部曲集大成之作


  也因為日本人對於大地震的餘悸猶存

  鈴芽之旅這個描寫地震災害的主題

  也被壓在三部曲的最後壓軸呈現


  很好的描繪了這個離我們日常生活如此接近的

  可怕天然災害


  (2)美術呈現


  從妳的名子開始

  堪稱透視法及光影呈現教課書的美術描繪

  就深深的吸引了我


  但就是在這麼寫實的畫風下

  新海誠的電影卻可以創造出這麼多超現實的場景


  從一開始鈴芽在常世看到的深邃夜空

  到最後跟蚯蚓的飛天大戰


  能在寫實當中創造不真實

  更能讓觀眾認為這是現實中可能發生的事情

  鈴芽之旅可以算是當中的佼佼者了

  徹底地打破了寫實與虛幻的模糊界線


  我一直認為

  能將自己幻想中的場景

  透過各種藝術媒介(動漫畫、電影、繪畫等等)

  傳遞給社會大眾

  正是藝術家超越凡人的證明


  而新海誠

  無疑已經證明了他藝術家的身分


  (3)故事發展


  整體故事走一個馬不停蹄的公路電影發展

  我在幾乎沒有被雷的情況下去觀看電影

  其實蠻有峰迴路轉的感覺


  鈴芽遇到草太之後

  不知道是不是戀愛腦爆發

  追隨上去之後竟然開啟了意外的關門之旅


  本以為兩人會一路打打鬧鬧去關門

  但是貓貓一出

  直接把草太變成三腳小凳子

  關門的重任就這樣落到鈴芽身上


  後續在各方路人的情義相挺下

  關了好幾扇門

  但是草太卻越來越難維持自我


  在巨大蚯蚓上的困難抉擇

  鈴芽忍痛將草太化為要石

  暫時平息了地震的威脅


  最後鈴芽在阿姨跟草太死黨的幫忙下

  成功再次進入常世解救草太

  難得的HAPPY ENDING

  皆大歡喜


  (4)女力的發揮


  整個劇情跟著看下來

  故事中對於女力的發揮其實我看得蠻入迷的


  新海誠電影中的女主角

  向來就是富有行動力

  不怕困難的勇敢形象


  但這次連主要的幾個女性配角

  都描寫得非常深刻

  讓人感動


  千果初登場就是自己載著一車水果

  在鈴芽和草太幫助他撿起散落的水果後

  親切的招待一人一椅回到家裡民宿


  在民宿中也是前前後後的幫忙

  隔天早上還幫忙打包好衣物和行李

  太感動了吧


  接著又遇到唯一肯停下車載人的瑠美

  鈴芽跟著她一同短暫體驗了她一部份的人生

  一手拉拔兩個孩子

  還有自己開店維持生計


  鈴芽在店裡幫忙

  瑠美提供食宿

  這樣的表現我相信比無償提供幫助

  更為健康、更為溫暖


  當然更要提到環阿姨

  在歷經姐姐過世的傷痛後

  毅然決然擔起照顧鈴芽的責任

  儘管喪失了揮灑青春的自由

  仍將鈴芽視如己出


  尤其最後旅程結束

  跟著鈴芽拜訪沿途的貴人(千果、瑠美)

  如此正面的互動

  我只能說太感人了


  小結一下

  鈴芽之旅無形中就刻畫出女力的發揮

  女性不再是男性保護的對象

  也不是男性角色的附屬品

  她們展露出無比的力量與韌性

  溫暖且感動人心


  (5)社會議題的呈現


  妳的名子劇情中

  男女主角預知災害降臨

  通告眾人時

  沒有人選擇相信高中生的話


  天氣之子中

  男女主角年紀更小

  而且被視為逃家少年的身分下

  更沒有人會聽他們講話


  回到鈴芽之旅


  在外人跟環阿姨眼中

  鈴芽就是個不折不扣的翹家少女


  跟家裡沒有常態聯繫下

  翹課翹家這麼多天


  但是環阿姨後來堵到他在男生的車上

  也沒有第一時間大發雷霆

  反而是選擇跟隨他去做鈴芽執意要做的事


  尷尬的旅途進行到一半

  環阿姨在大臣的影響下

  情緒整個大爆炸

  是我整部電影中

  看得最揪心的橋段


  如此在乎彼此的兩人

  在憤怒下吐出如此多傷害彼此的話語


  尤其是那一句鈴芽所說的

  “大人根本都不懂!!”

  (忘記原話了，大概是這樣說的吧)


  真的是聽得我椎心刺骨


  現在我兩個小孩才都是國小的年紀

  我衷心期許自己不要變成

  會讓小孩講出這種話的父母


  (6)溝通障礙


  從上面就可以看出來

  新海誠在災難三部曲裡都刻意的點出

  “溝通障礙”這個人與人相處的大問題


  相信所有的觀眾都會有類似的體驗

  面對自己所重視的人

  無法理解你的想法


  甚至在焦急的溝通過程當中

  越說越說不清

  把對方跟自己的關係越推越遠

  那種無能為力的沮喪感


  但是

  要怎麼打破這種溝通障礙呢


  我認為

  電影中所描述的

  感受與感謝

  就是解開門鎖的關鍵


  (7)感受與感謝


  誠惶誠恐呼喚日不見神

  先祖之產土神

  領受已久之山河

  誠惶誠恐，謹此

  奉還於爾


  這段關門咒語

  借用一下網路上大神的翻譯大概是這樣


  請恕我呼喚您的名字日不見神啊！

  孕育久遠先祖故土的產土神啊！

  我們長年從您那得到的這片山河之地

  讓我們感到受寵若驚

  請讓我以最誠摯的敬意將它歸還

  歸還於您！


  歸結起來

  就是感受與感謝


  鎮住土地的是人心的力量

  只有在土地被人們遺忘的時候

  後門才會悄悄開啟


  而關門師

  在找到被遺忘的土地之後

  用心感受這片土地所乘載的思念

  再藉由咒語表達衷心感謝

  才能順利關門


  感受與感謝的能量

  套用在人際關係之上

  我覺得也是毫無違和


  以劇中的環阿姨來說

  鈴芽翹家這幾天

  他擔了多少心

  只有觀眾看到

  而鈴芽不會知道


  在環阿姨心中

  她就像被遺忘的土地一樣

  被鈴芽所遺忘了


  找到鈴芽之後

  鈴芽不肯跟她說明來龍去脈

  更沒有對她的擔心做出任何反應

  沒有感受，沒有感謝

  終將招致溝通障礙的降臨


  這段劇情真的是我全劇中最有感觸的地方

  也是在觀影這麼久後

  還令我有動力整理這篇心得文的主要原因


  傾聽對方的感受

  真摯的表達感謝


  這不是我們面對親近之人的基本嗎

  但是

  何嘗容易做到


  反之

  如果真的能保持感受與感謝

  又有甚麼溝通障礙是無法克服的呢


  (8)總結


  真的是拖了很久的心得文

  但是上面最後一段也是我所想分享的心得

  當然可能有點超譯

  有點腦補

  但還是整理出來

  跟大家分享

  也推薦還沒看過的人

  可以找機會把災難三部曲一口氣補起來

  推



  --'
