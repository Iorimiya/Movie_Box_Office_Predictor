url: https://www.ptt.cc/bbs/movie/M.1677774351.A.8D9.html
title: '[普偏負雷] 鈴芽之旅'
content: '整部電影在尾聲揭曉了苓芽與小時候的自己相遇

  這部分是我內心最澎湃的時候

  我很喜歡這樣類似療癒自我的設定

  如果電影把核心放在迴圈這塊

  鋪陳更多相關的細節我覺得會很猛


  可惜的是鈴芽又是一個暈船仔(我怎麼說又呢

  一見鍾情跟對方相處不到半天後對方就變成椅子

  竟然能夠為了對方赴湯蹈火

  情願犧牲自己當一個塞子我真的不懂？


  當關門師要在不知情的情況下被抓去幹苦差當要石，

  這確定有在關門師的職務範疇？

  要石的神也很隨便，

  白貓隨便卸任也不交接清楚，

  獨留黑貓在鎮壓蚯蚓，

  椅子變成塞子以後，

  換黑貓自己隨便跑出來，

  留一個剛被抓交替的椅子站哨


  確定日本的國土安危要交給這整個非常隨便的關門師圈？


  整部還是很多作畫精美的部分

  但是敞篷車拉車回老家那段好多廉價3D動畫跟作畫

  有股割裂感讓新海城的招牌瞬間蕩然無存


  個人給《你的名字》評價滿高

  以《你的名字》的標準來看這部劇情非常拖沓，

  畫面也沒有隨者劇情鋪陳顯得更壯闊更驚豔，

  各個情節沒有讓角色更立體情緒更飽滿，

  不是要把一段真摯的感情或是冒險故事講好講講順，

  都只是單純為了情節在跑流程


  --

  已改

  天氣之子之前看評價很像很慘就沒看了

  結果沒有比較沒有傷害XD'
