url: https://www.ptt.cc/bbs/movie/M.1678167739.A.A08.html
title: '[好雷] 鈴芽之旅 鈴芽妳這痴女= ='
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  昨天看晚場的，這樣星海誠的災難三部曲都有看過了，直接重點條列式感想吧！


  優點：


  1、動畫畫面還是很不錯的，似乎有網友說不如天氣之子？但片裡的一些擺明炫技的場面

  還是很驚豔，蚯蚓也不像網友說的有廉價感，尤其在東京出現的那段搭配BGM震撼力十足



  2、劇情進展流暢，用有點像是公路旅行的方式推進劇情，與劇情主軸相互搭配不會讓人

  覺得單一煩悶，蚯蚓也不會永遠只從單一的門出現，而是有各種形式的變化（摩天輪、電

  車隧道等等……）


  3、足控的福利，這算是個人喜好，星海誠這三部女主一定都會出現浴衣和裸足等能展現

  女性美的片段，只能說誠哥真的很懂……


  缺點：


  1、男女主角互動不足，尤其一開頭看其實還頗尷尬的，鈴芽完全就像是一個追著帥哥跑

  的迷妹……從夢中有印象到到實際見面帶到房間，之後沒多少時間男主就被變成板凳了啊

  ……跟本沒和草太的人類型態有多少互動，正常人不可能對一個板凳有什麼愛戀之心吧？

  不過也許只是革命情感就是了……


  2、和環阿姨的衝突，真的讓我對鈴芽的好感度下降不少，相比之下天氣之子和你的名字

  女主幾乎零負評，鈴芽真是有點太過自我囉！而且環阿姨明明比鈴芽還婆吧？算是對鈴芽

  視如己出了，換來的卻是鈴芽滿無情的回應。


  2、和天氣之子與你的名字相比，BGM還是很優秀！但似乎沒有讓人印象深刻的插入曲？前

  兩部插入曲的插入時機都非常棒！本作捨棄這個特色真的很可惜！


  總結：個人喜好度是：天氣之子＞鈴芽之旅＞你的名字，但只要無視缺點一的話本作一樣

  可以看的很愉快，推薦！

  --

  沒辦法，陽菜太婆了XD'
