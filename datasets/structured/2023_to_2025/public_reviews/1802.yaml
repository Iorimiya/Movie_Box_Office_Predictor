title: 'Re: [討論] 鈴芽之旅 鈴芽喊出那句話的情感(有雷)'
content: '爺爺問不怕死嗎 她的回答是三句話

  1.不怕死

  3.原po問的那句

  這兩句解讀是喜歡或愛的確沒什麼問題

  但是中間還有一句很重要的話 2.生死不過是運氣

  愛情發言的話 這句就很突兀了

  刪掉也沒問題 或是改講什麼他是我喜歡的人


  鈴芽一直以來最介意的 首先自然是被塗黑的記憶

  始終無法釋懷為什麼媽媽就離開了

  她覺得她是運氣好活下來 媽媽是因為運氣不好才遭遇不幸

  才會覺得生死是運氣


  今天又一個運氣很差的草太要失去生命了 尤其這次還跟自己直接相關

  她不會願意這種事情再發生一次的


  --




  3:40



  開頭那個船以前看過照片 印象深刻

  是在講我嗎 我沒那個意思0.0 有措辭不當的部分很抱歉



  沒事 我也怕無意冒犯到人'
