url: https://www.ptt.cc/bbs/movie/M.1678012196.A.DBF.html
title: '[好雷] 鈴芽之旅 '
content: '在觀影前，有稍微瞄了一下板上的文，

  （大概就防雷線前面的短評）

  聽到這部劇情非常弱，大概跟《繁星》差不多時，

  原本還滿失望的



  但今天看完，

  我覺得這部比《繁星》好上不少欸，

  它有很明確想要傳達的主題；

  在世界觀的設定上，也比《天氣》完整；

  相較《你的名字》以壯闊的時空背景，撐起個人的青春愛戀，

  我其實更喜歡《鈴芽》這種訴諸群體生命經驗的災難敘事。

  （但這就是我個人偏好啦）





  以下涉及劇情，請斟酌

  _________________________________________



  大概分為三個層面吧



  【第一層感受】


  這部真的是新海誠「災難三部曲」當中

  最認真談論災難的片了吧

  （災難不是作為故事背景或烘托）



  蚯蚓、要石、關門師，象徵人心失落的廢墟，

  所有設定都非常完整，解釋了地震的發生，

  以及為什麼有些地震會造成很大的災害，

  有些則不會。




  【第二層感受】


  導演塑造了要石和關門師這兩個角色

  （要石可能本來都是人類）

  想要通過人力的方式去壓制蚯蚓

  一方面反映出日本對於歷來大地震的創傷未解

  一方面卻也展現人試圖戰勝災難的強大意念



  現實無可挽回的遺憾在電影有了轉圜的餘地

  想想新海誠其實滿溫柔的吧

  （大概地震帶給日本的創傷更甚於水災）



  這種溫柔也在於

  鈴芽與年幼的自己相遇。



  這段情節當然有放下、節哀的寓意，

  但導演並不是安排一個外人去勸說，

  而是讓倖存者在阻止災難的旅途中自行平撫傷口。

  說明這趟旅程不是只是跑跑大地遊戲，

  更是倖存者重生之路。



  逝者不可追，而活著的人還要繼續向前。

  不知道為什麼我老是想起《風起》那句話

  ──「風起，唯有努力生存」。




  【第三層感受】


  關門師關門的方式除了唸咒語，

  還要去「感受」曾經生活在這片土地上的人們，

  這大概是最觸動我的部分了



  地震創傷大概只有生活在地震帶的人才會懂得，

  但人心與土地的連結，乃至落地生根的意識，

  是在很多地方都有的觀念。



  那些發生地震的所在，都曾經是一群人的根，

  稱之為「家」，或稱之為「故鄉」。

  關門師當下感應到的何止是那些人的生命，

  其實更來自於

  人與土地緊密相連所產生的情感（人心）。



  廢墟是人心的失落，是地震的起源地，

  那也唯有召回人心，才能阻止地震。






  以上，粗淺表達我的感受。

  我自己是真的滿喜歡這部的，

  可能我年紀有了，

  對青春愛戀的情節本來就沒有什麼期待惹。




  --'
