content: "LUXE真的貴  我已先在書局買優惠票230\n\n劃位時要再加收45  275快可以買HBOGO一個月了\n\n開頭幾部電影宣傳片沒感覺特別清楚\n\
  \n進到新光片頭宣傳手機請關靜音 就明顯感覺螢幕比其他影院清楚\n\n不管是出現片名那一刻BGM雞皮疙瘩的好\n\n還是對話聲 背景聲    影像跟聲音的饗宴\
  \  275很值!!\n\n\n\n站在男生角度無法理解 不顧生命也要解救男主的心情\n\n但我猜觀賞者只要是年輕女生應該都很有共鳴感吧\n\n聽聞周遭朋友跟新聞也不遑只要女生本人願意\n\
  \n渣男也是照養.............人帥真好\n\n新海最近的劇情都是走這種純愛無畏一切的劇本\n\n不像早期被寄刀片那走寫實風 XDDD\n\n\n\n\
  畫面我覺得沒有\"你的名字\"跟\"天氣之子\"那樣細節滿滿\n\n衝擊感我認為兩個地方  \"拯救男主那刻\" \"另一邊的世界給小女孩椅子\"\n\n當初看PTT以為會有更大的哭感\
  \  可能老了\n\n你的名字當初可是大哭\n\n\n\n但以上感想都是因為你的名字太高  (配樂也是你>鈴)\n\n我還是很推薦周遭朋友去看鈴芽之旅\n\n\
  尤其沒接觸過新海電影的朋友\n\n新海在刻劃人性純粹的美好 應該很受社會人士的嚮往\n\n不像現實社會勾心鬥角  在新海的電影裡\n\n你可以快樂的享受人與人互相幫助\n\
  \n日式酒店打工那部分 一直想到華燈初上(原來日酒是真的)\n\n還有你想不到的魔法元素\n\n每一步新作 都期待作者更大的腦洞\n\n\n\n\n以下開放\"\
  關門師\"回報各地天氣\n\n\n\n\n\n\n\n--\n            \n \n \n \n \n  \n\n--"
