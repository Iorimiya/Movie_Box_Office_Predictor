url: https://www.ptt.cc/bbs/movie/M.1680449044.A.BD8.html
title: 'Fw: 鈴芽之旅-すずめの戸締まり_11刷電影院心得文'
content: "作者: it101042000 (亍) 看板: C_Chat\n標題: 鈴芽之旅-すずめの戸締まり-Susume_11刷電影院\n時間: Sun\
  \ Apr  2 23:14:25 2023\n\n有雷請注意\n#我出發了\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n前情提要： \n\n\n\
  10刷君名之後\n本來抱著可能天氣之子劇情我不愛的心情\n看了鈴芽的搶先場\n\n1. 林口三井\n \n在只有瞄過海報的情況下\n沒注意到有貓的存在\n還有地震相關的情報\n\
  看完眼睛是腫的\n應該是我對情感類的哭點都很低\n\n看完覺得需要再細細品味這部作品\n\n2. 桃園新光影城 Dolby Cinema\n\n大概是螢幕中間右側\n\
  聲音的表現真的很厲害\n臨場感很夠\n而且海報是最讚的那款\n\n3. 台中Tiger City 威秀影城IMAX\n\n時間關係+想拿imax海報就先看了這個\n\
  買完才查到這家是一般戲院規格改的\n第三次看還是感動哭\n\n4. 桃園新光影城 Dolby Cinema\n\n這場算是同事推坑場\n這次坐正中間 體感更好了\n\
  而且影城有超大海報可以合照\n也多很多相關佈置可以拍照 很貼心\n\n5. 台北大直美麗華imax\n\n來到真imax廳，可能我座位不在黃金區\n亮度跟細節部分感覺沒有Dolby\
  \ Cinema 好\n\n君名的時候就覺得要珍惜\n電影還在院線的時間\n而鈴芽之旅 讓我在想\n是否能達成一縣市關一扇門的成就（？）\n於是 旅程繼續\n\n\
  6. 新竹巨城威秀 \n座位倒數三排左側\n03/11當天看的\n一起去的朋友看完才知道當天日期\n覺得又驚又怕\n本週特典透明書籤還蠻好看的\n\n7. 雲林中華影城\n\
  \n要關門當然要回家鄉關\n而且是看中文版\n警報的音效有改成台灣版的\n很在地化\n甚至有些意境的台詞變得更準確\n咒語的短句唸法也很還原\n推薦下檔的時候可以補\n\
  也謝謝配音老師們辛苦配音\n\n8. 高雄大遠百威秀\n\n坐到第三排\n但螢幕意外的還算剛好\n音效在當下的位置也不錯\n\n9. 基隆秀泰\n\n特典是中文版的旅程海報\n\
  在基隆看這部有種特別的感覺\n附近就是基隆港\n\n10.南投戲院\n\n最讓我感到特別的戲院\n是老戲院的樣式\n前面有一個像舞台的地板+護欄\n聲音的表現很像在舞台表演的音場\n\
  前跟後的聲音區分很明顯\n畫面部分 光影的變化超級讓我驚艷\n我可以看到港灣小酒館美紀\n衣服上的亮片居然在閃\n還有黃昏之時突然轉暗的光影效果\n推薦還有放映的話可以去體驗看看\n\
  \n11.台中大遠百威秀\n\n本來想在彰化關門\n但看沒有上映來陪朋友二刷\n這場很意外是滿場\n而且售票處有很多佈景可以拍\n\n總結\n前3排名（個人觀感）\n\
  1.南投戲院\n2.桃園新光\n3.林口三井威秀\n\n謝謝各位一起守護鈴芽之旅\n關門師-亍應該BD再見了...\n\n\n\n\n\n--"
