title: '[新聞] 鈴芽之旅票房突破128億!作品入選柏林影展'
content: '《鈴芽之旅》票房突破128億！作品入選柏林國際影展...睽違20多年壯舉


  東森新聞


  《鈴芽之旅》是動畫大師「新海誠」暌違三年所推出全新作品，電影在日本上映後繳出超

  好成績，目前票房已突破128億。不僅如此《鈴芽之旅》更受到柏林影展肯定，正式入選

  了「73屆柏林影展主競賽片」，這也是睽違20多年再度有日本動畫電影入選。


  《鈴芽之旅》以日本各地廢墟為舞台，講述17歲少女「鈴芽」碰到一位尋找「門」的少年

  ，本以為藏著仙境的白色木門，沒想到另一端卻有著無限災厄，為了阻止災難發生，一趟

  「關門之旅」就此展開。《鈴芽之旅》上映後繳出亮眼成績，目前作品已超越128億票房

  ，動員人數更高達963萬，根據日本推特分享，不少觀眾看完後紛紛獻上掌聲，甚至感動

  到哭著走出戲院。


  除了票房肯定之外，《鈴芽之旅》日前更入選了「73屆柏林影展主競賽片」，這也是繼宮

  崎駿《神隱少女》後，睽違20多年再度有日本動畫電影入選，具有相當大的意義。隨著官

  方發布全新視覺圖，新海誠以及女主角聲優「原菜乃華」也感謝所有觀眾支持，還有工作

  人員的付出。台灣部分《鈴芽之旅》則預計在3月2日登上大銀幕。




  --'
