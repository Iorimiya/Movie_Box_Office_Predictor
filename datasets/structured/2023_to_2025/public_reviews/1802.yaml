url: https://www.ptt.cc/bbs/movie/M.1678527935.A.32E.html
title: '[好雷] 鈴芽之旅'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  「我等了一個晚上就是在等這個大場面」，中段的巨大危機與最後的神獸大戰，光這兩段

  的場面就值得進電影院看了，搭配新海誠一貫超細膩寫實畫風，以及從《你的名字》、《

  天氣之子》就合作的 RADWIMPS 創作的配樂，整部動畫從視覺到聽覺都是上乘之作。


  動畫故事的推進也相當有趣，主角鈴芽住在九州宮崎，後來踏上旅程前往四國、神戶，又

  到了東京，最後還前往兒時居住的仙台，要不是劇情需求，讓她一路直上北海道也是蠻好

  玩的，直接完成縱貫日本之旅。特別的是旅途中隨著地點的不同，也出現一些地方差異，

  像是語言的腔調、飲食文化的差別，或許對於日本人來說會更有感覺吧，不過對於光在台

  灣這個小島上就可以有各種南北食物差異大戰的我們來說，看到這種地區差距應該很能感

  同身受吧，還有住在宮崎的鈴芽第一次一個人在東京地鐵找路而暈頭轉向的模樣，這麼微

  小的地方卻讓我很喜歡這部片呈現的方式。而且啊，鈴芽到了愛媛跟神戶都有遇到好心人

  收留，可是東京卻沾一下就走了，不知道是不是在調侃東京天龍人冷漠沒人情XD


  如果要認真去形容我只看完一次《鈴芽之旅》後的感想，那大概會是好大一片藍色窗簾，

  片中有太多地方會引人「簾」想了。雖然號稱是新海誠「災難三部曲」的第三作，不過我

  對於《你的名字》跟《天氣之子》的劇情印象已經不深了，只記得《你的名字》是隕石撞

  擊事件，《天氣之子》是洪水，但看到新海誠在訪談中說《你的名字》、《天氣之子》是

  在隱喻 311 東日本大地震，而這次《鈴芽之旅》則是直接的討論地震這項災難，還是對

  311 東日本大地震對日本人有這麼深刻地影響感到驚訝。畢竟 921 是台灣相當重大的災

  難，但二十多年過去好像也沒甚麼相關作品在討論的印象，是我們不喜歡討論災難，覺得

  那是在消費受害者；還是我們仍舊不習慣將災難面臨的負面情緒攤開來討論，還是想壓抑

  在心裡；又或者對於非直接受害者來說，那已經是歷史名詞了？


  回到動畫，將引發地震災難的靈物以蚯蚓命名我覺得蠻有趣的，畢竟蚯蚓就是生活在土壤

  中，每天在土裡鑽來鑽去的，從這個角度來看一隻超大型蚯蚓的活動會造成地震好像也不

  太意外？雖然可能不少人的印象中日本傳說裡引發地震的是鯰魚，而且又剛好鯰魚相關傳

  說就發生在東京這個片中巨型蚯蚓的主棲地，要是片中從門裡衝出來的是飛天鯰魚好像也

  頗有看頭。不過在更早的日本傳說裡，引發地震的是龍神，龍的形象好像就比較接近蚯蚓

  了。至於為什麼在作畫這麼精緻的動畫裡為什麼不用外觀比較帥氣威猛的龍，而要用個粗

  糙醜陋的蚯蚓，或許新海誠是想表達災難終究給人不討喜的負面觀感吧。用龍神作代表雖

  然可能給人一種敬畏天災的感覺，但好像也有一點美化災難的形象。而鈴芽的日文「すず

  め」意思是麻雀，腦補一下或許有在龐大的天災面前，我們都像弱小的麻雀一樣微不足道

  的含意。


  本動畫的吉祥物擔當當然是「大臣」啦，雖然他任性又愛到處搗亂，可是看在他是貓皇的

  份上就算了，尤其是草太說神都是任性的，讓人會心一笑。後段出現的左大臣雖然戲分不

  多，但卻是重要戰力，只是左大臣剛出現時，他與大臣一大一小的體型差距，再加上雙貓

  身負守護日本的職責，瞬間讓我聯想到《銀魂》裡的定春，進而聯想到狛犬這個日本常見

  的神獸，至於怎麼從犬變成貓？想必是因為貓比較可愛啊（開戰囉）。


  動畫中設定蚯蚓出來的「門」都是在廢墟裡，因為乏人問津漸漸被遺忘，成為了蚊子館，

  當下我心中想著：「難怪台灣地震這麼多……」，土地失去了人心的重量而變得不穩定。

  這真的是很日本風格的劇情設定啊，總是很細微的思考人與人、人與土地之間的連結，連

  關門前都要回想過去生活在這個地方的人，他們在這個地方所累積的回憶與情感，好像要

  藉由回想這些事情，凝聚過往的人心力量，才能幫助弱小如麻雀的鈴芽關上門一樣。


  --'
