title: 'Fw: [閒聊] 最後一場《鈴芽之旅》DOLBY CINEMA'
content: "作者: gary8442 (起秋風) 看板: C_Chat\n標題: [閒聊] 最後一場《鈴芽之旅》DOLBY CINEMA\n時間: Tue\
  \ May  2 23:00:53 2023\n\n最後一場鈴芽杜比版發文紀念一下~這兩個月的鈴芽杜比高鐵之旅正式告一段落\n\n2023/05/02 今天下午這場《鈴芽之旅》『すずめの戸締まり』Dolby\
  \ Cinema 是台灣最後一\n場鈴芽杜比影院版本了，明天開始其他大片排滿，短時間內很可能沒機會再回歸杜比（如果\n未來有回歸會再去刷）\n\n5/2 剛好是3/2《鈴芽之旅》杜比影院首映過兩個月，將2本特典小說在影廳外面看完~\n\
  \n\n特典小說有收錄新海誠簽名\n（台版比照日版規格，尺寸一樣只有紙質不一樣）\n\n\n上個月底在影廳外看完兩本台版新海誠本\n\n\n3~4月都在影廳外看台版小說（1/18開賣的電子書）\n\
  \n新海誠寫的小說我很推薦，補充很多細節\n例：\n\n\n\n\n\n從3/2刷到5/2...兩個月花了好多電影票錢（鈴芽幾乎全是看杜比）& 高鐵票錢 ....\n\
  \n票根我就不合照了，總數量比不其他數十刷/百刷的粉絲~\n（大略翻了一下大約有十幾刷 3/2~5/2）\n\n回顧其他有領到特典的場次:\n\n4/14\n\n\
  \n\n3/2\n\n\n其他:\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n---\n\n\n\n回家啦！\n\n荷包空空啦，高鐵票太燒錢了，即使都買學生票也快負荷不了~\n\
  \n感謝今天在杜比影廳外面借我錢的PTT影院版大佬，差點沒錢回家XD\n （今天早上發生了些意外導致要搭計程車趕高鐵把我錢包掏空了...）\n\n「你要記得還我錢喔，大學生！」\n\
  --\n\n\n很久沒這樣多刷電影了\n\n上一次刷這麼多次（比這次多）是2016~2017 《你的名字》\n不過特殊版本 雷射IMAX 大直美麗華只上映一週\n\
  所以只看了6次IMAX （印象中）幾乎是一天一刷"
