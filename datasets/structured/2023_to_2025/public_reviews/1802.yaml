url: https://www.ptt.cc/bbs/movie/M.1680621756.A.948.html
title: '[好雷] 尋回鬆脫遺失的要石：《鈴芽之旅》下'
content: "本文整理《鈴芽之旅》主角岩戶鈴芽與宗像草太、大臣的立場、心理與動機。\n\n　　（內文有雷且具個人觀點，建議觀影後再讀）\n\n\n\n圖文網頁版：\n\
  \n上　\n\n下　\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\n尋回鬆脫遺失的要石：《鈴芽之旅》下\n\
  \n\n\n2.從愛媛到神戶：從熟悉到親密\n\n　　遇到琉美小姐之後，鈴芽在神戶與草太的幾次互動，都加深了親密感：\n\n和雙胞胎一起玩的過程，讓鈴芽發現與自己相反，草太對孩子很有辦法（除\n\
  \n了沒有與孩子相處的經驗，也有可能是鈴芽喪母後，為了不讓環阿姨擔心過\n\n份早熟，所以不太懂得怎麼跟孩子相處），猶如父親的態度（那時鈴芽還不\n\n知道草太想當老師）以及載著孩子前進的遊戲，可能亦是她幼時對椅子的想\n\
  \n像。而當鈴芽說「草太沒那麼聰明啦」草太氣急敗壞反駁「鈴芽小姐，你說\n\n什麼？」的同時，發現彼此擅長／不擅長，以及拘謹客氣外的另一面，同時\n\n流露出草太已經極為在意鈴芽對他的評價，即使隨口哄孩子的話也要計較，\n\
  \n跟之前對自己漫不經心、對別人維持距離有明顯差異。後來鈴芽在酒吧裡幫\n\n忙，跟在千果的旅館一樣是感受生活傾聽聲音，只是琉美和環阿姨都是獨自\n\n帶孩子的母親，讓鈴芽感知到環阿姨的辛苦，卻忘了聯絡，這在劇情上是避\n\
  \n開重複，讓環阿姨從手機支付紀錄尋找鈴芽足跡推動劇情，對鈴芽而言則加\n\n強了「我要盡快獨立就不會再拖累阿姨」的逃避心理。\n\n\n\n　　至於在遊園地關門的任務，草太終於不再堅持獨自行動，而是主動提議\n\
  \n分工合作，他去追捕大臣讓自己恢復原狀，關門任務則交給鈴芽；而在鈴芽\n\n受常世吸引、捲入尋找母親的記憶瀕臨危險時，草太放棄捕捉到的大臣先去\n\n救她。這裡值得注意是，鈴芽在完成任務後，初次說了「好可怕」讓草太認\n\
  \n同的笑了，顯現兩人因為在意彼此，對「生」有了新的依戀，也讓草太察覺\n\n鈴芽對他的重要，稱讚她並向她道謝，發現她能看見「常世」而解釋常世的\n\n意義。\n\
  \n\n\n　　另一個值得注意的是，當鈴芽與草太召喚過去的聲音時（琉美曾告訴鈴\n\n芽小時候來這裡玩，再次連結這塊土地），有一句是「第一次約會就來坐摩\n\n\
  天輪，我們還真老派」──兩人的第一次約會就是（已成廢墟的）摩天輪。\n\n在這樣生死與共之後，鈴芽知道她在草太心中是優先的，兩人之間的距離更\n\n近，她不再讓草太面壁，而是坐著椅子（達成之前草太對她說「你不行\n\
  \n（坐）」的願望）和琉美與美紀一起吃馬鈴薯沙拉＋炒烏龍麵，抱著他一起\n\n拍照，和在愛媛不同的是，她試著和草太一起「接觸人群」；睡前也從草太\n\n那裡得知他是東京的大學生，將來要兼任關門師與老師的夢想，告訴她「重\n\
  \n要的事還是不要給人看見的好」。\n\n\n\n　　但草太在這個晚上已更明確意識到自己正在「要石化」，坐在門前而感\n\n到冰冷、幾乎放棄抗拒時，是鈴芽開了門把他拉進去──這是一個打開心門\n\
  \n的象徵，同時鈴芽用親吻讓他醒來──此刻的鈴芽已經領會到與草太的相處\n\n模式：愈沒有距離、愈隨便和愈親近，草太會因來不及設防流露出最真實的\n\n反應，這是他過去少與人深入交流的被動模式，儘管他說鈴芽是「奇怪的女\n\
  \n孩」，實則是因鈴芽在他心中的地位特別而逐漸卸下心防。\n\n\n\n　　所以在新幹線上，鈴芽要他記得還錢，抱怨經過富士山沒有叫醒她，也\n\n直接抱著他睡覺──對沒有身體而感到不安的草太來說，鈴芽無顧忌的親近，\n\
  \n和如同小孩依賴年長者的任性（與童年回憶連結，這也是在與雙胞胎一起玩、\n\n摩天輪面對創傷後，鈴芽愈能表現孩子氣的一面）讓他覺得自己仍然是個值\n\n得依靠、擁有未來的「成人」而感到踏實溫暖，同時對象是他也喜歡、深具\n\
  \n好感的人。在東京地鐵，草太像驅馬一樣要鈴芽換車，請她打電話到打工處\n\n取鑰匙，待她也自然了起來──變得更加親近。\n\n\n\n　　但除了共通點之外，鈴芽和草太對生活的經歷有所差異：鈴芽過去在環\n\
  \n阿姨的過度保護下，生活體驗較為狹窄，由於收養的身份，同學調侃阿姨便\n\n當時她不置可否，卻能對初識的千果訴說想要獨立的願望；感受日出之美、\n\n吃飯時感覺好吃而流淚，以及傾聽千果的戀愛故事、在酒吧幫忙接觸不同的\n\
  \n客人等經歷，都是旅行的特殊體驗；與草太一起完成關門任務阻止地震，則\n\n使她感受到自身存在的價值，有改變生命、拯救他人的力量，亦即她的生命\n\n經歷因此而拓展。相對而言，草太則變得不會餓、不會喘，只有身心逐漸變\n\
  \n冷，難以與他人交流，行動受限，鈴芽是唯一可以交流、感受其溫暖的對象，\n\n且鈴芽不但認可（甚至可以說是尊敬）他的工作，不因他變成椅子而異怪或\n\n有距離，常常關心他的狀況與感受，也毫不在意的碰觸摟抱──兩人在旅程\n\
  \n中的體驗都與超乎日常，並因朝夕相處、同守祕密與執行任務的親近而能傾\n\n訴過去無法啟齒的感受與回憶──草太自不待言，鈴芽雖然認識了千果、琉\n\n美、美紀等朋友，但遠不如草太跟她之間的相互理解與精神支持──在彼此\n\
  \n傾訴的同時，也傾聽了自己深藏內心的聲音，意識到與過去不同的細微變化\n\n與成長，認為是對方存在的功勞。兩人因過去的巨大創痛／長久孤獨，以致\n\n自我認同不完整的情況下，從彼此身上獲得純粹的感情：被尊重、重視、關\n\
  \n懷、愛護，能肯定自己而產生信心，進而在精神上有所淨化與成長。這種超\n\n越同伴的心靈支持讓對方的存在變得獨一無二、無可取代。\n\n\n\n3.從神戶到東京：從親密到生死情誼\n\
  \n　　這樣的彼此認同、精神支持與親近關懷，也讓兩人逐漸產生友情之上的\n\n在意。來到東京草太的房間，鈴芽先低聲抱怨「草太先生你好受歡迎」的吃\n\n醋反應讓草太明顯有點害羞，還安慰她那沒什麼，接著鈴芽為了找繪卷而站\n\
  \n在草太身上還刻意踩了幾下，故意徵詢意見也表現了占有欲（只有我可以對\n\n你這樣），草太雖然兇她「踩之前要先問」但明顯語氣裡沒有真的生氣（所\n\n以問了就可以踩的意思XD）──兩人在這樣的你來我往裡也在試探這段感情\n\
  \n發展的程度。然後他們一起看繪卷花了相當長的一段時間，直到芹澤意外來\n\n訪，這裡草太的反應很有趣，雖然用詞是「認識的人」，語氣卻明顯把芹澤\n\n當朋友，但要鈴芽打發芹澤的態度就是「我們才是同伴」、不願被打擾的親\n\
  \n密──只是接下來的地震和蚯蚓使兩人再次執行任務。\n\n\n\n　　東京的繁忙和距離讓鈴芽沒有機會聽當地人的聲音，加上「門」在地鐵\n\n隧道裡，鬆脫的要石加劇了危機，所以草太不再讓鈴芽幫忙而是自己跳進去，\n\
  \n但鈴芽隨之躍下讓草太看到她願意共赴危難的義無反顧──可惜時間已屆，\n\n草太意識到自己作為「人」的生命到此為止，犧牲自己的決心雖因對人世有\n\n了更深的依戀、不捨與願望而有所動搖，卻還是成為要石（之後可以看到他\n\
  \n接受了這個命運，盡職地壓制蚯蚓）。而鈴芽雖然萬般不願，但仍在大臣的\n\n誘導、和自身不願再次看見災禍發生的信念驅使下，完成了將「椅子要石」\n\n插入蚯蚓身體，阻止地震的任務。如果到此為止，鈴芽只是普通的高中女生，\n\
  \n兩人之間只是夥伴之情，以及之前累積的默契，鈴芽即使一開始傷痛，但必\n\n能明瞭草太願意犧牲的決心，甚至鈴芽可能會在大臣引導下選擇替代草太擔\n\n任關門師，各自在常世／現世守護日本，如此大臣可說就完成了他的目標，\n\
  \n且能成為鈴芽的貓，以貓的外形庇護鈴芽。\n\n\n\n　　但目睹、甚至親手犧牲草太的鈴芽，夢到了母親為她做椅子的過去，翻\n\n攪出埋藏的創傷，失去了母親、椅子、一度開始修復卻又失去草太（母親與\n\
  \n童年聚合，加上與草太之間的感情）的她，再次體會到「重要之人被奪去卻\n\n無能為力」的痛苦，和「為什麼活下來的是我（而不是對這個世界更有價值、\n\n擔任護理師的媽媽和關門師的草太）」的倖存者偏差，卻為了活下去而埋藏\n\
  \n了童年，使她忍不住自問「我從什麼時候開始，不像之前那麼珍惜了呢」。\n\n在還誤會大臣真正目的時，她痛苦憤怒到一度要摔下大臣（對神／命運的恨\n\n意），卻又只對大臣說「以後不要再看到你」──不明白人類情感變化、也\n\
  \n不會解釋自己行為動機的大臣，無法實現鈴芽的願望，又回到原本的嶙峋。\n\n\n\n　　至此，鈴芽、草太與大臣都回到、且加強了原本的孤獨狀態。而被翻攪\n\n\
  的創傷記憶和草太之間初萌的感情使鈴芽加倍自責痛苦，更無法安於現狀，\n\n她不再是四歲的孩子，所以她去找草太的爺爺，在後者的勸說下仍堅持找到\n\n後門帶回草太。和摩天輪上的「好可怕」不同，鈴芽回到並增強了「我不怕\n\
  \n死，生死不過是運氣」的不顧一切，「我怕的是沒有草太先生的世界」裡包\n\n含的不只是對草太的情感，更是倍增的「無價值」、「都是我害的」愧疚自\n\n責，強化四歲後記憶埋藏卻從未停止（對母親）的哀悼：倘若如爺爺所言就\n\
  \n此放棄，鈴芽必將無法遺忘與草太之間的記憶，對自我的認知將會徹底破碎，\n\n在精神上孤立自己，且在遇險時輕易奉獻／犧牲生命。\n\n\n\n\n\n三、從旅途到歸鄉\n\
  \n\n\n　　在下定決心成為要石／救回草太的途中，鈴芽又必須面對跟環阿姨之間\n\n的矛盾：由於不是母女，卻又有著姨甥的親戚關係，加上鈴芽曾經走失的罪\n\n\
  咎，單身女性撫養孩子的辛苦與為生活帶來的限制，讓環阿姨用「過度愛護」\n\n強化作此選擇的價值。這對逐漸成長、本該學習獨立的鈴芽而言，卻因習於\n\n為常與「奪走阿姨的珍貴時光」的愧疚而變成難以開口的壓力。所謂的「叛\n\
  \n逆期」也是成長自我與親人保護界線的碰撞，從環阿姨的同事們口中可知：\n\n「現在才開始叛逆」的鈴芽過去必定相當乖巧聽話──如果是真母女，早就\n\n應該吵架的衝突不斷推遲，在鈴芽必須追回母親遺物、彌補失誤而上船開啟\n\
  \n的旅行，連同一連串無法開口的祕密加速累積。在火車站前遇見環阿姨的鈴\n\n芽，精神上正處於最痛苦緊繃的狀態，完全無法負擔與回應環阿姨的過度保\n\n護與追問，加劇了後者的擔心與憤怒，環阿姨內心最深的黑暗「我這麼做到\n\
  \n底值不值得」在一次一次被鈴芽拒絕後召喚了出來──「你馬上離開我家、\n\n把我的人生還給我」藉由左大臣的引導向鈴芽／大臣脫口而出。\n\n\n\n　　環阿姨的發洩雖然傷人，對已決定「奉獻生命」的鈴芽而言反而鬆一口\n\
  \n氣。兩人在說開後一同騎車的和解讓鈴芽對環阿姨道歉（而非道謝），在門\n\n前告訴環阿姨「我是要去見我喜歡的人」（不只是草太本人，包括椅子草太\n\n代表的母親）而前往常世──已下定決心不會再回來的她，這兩句話是真心，\n\
  \n也是她盡力讓阿姨失去她之後可以得到安慰和解脫──抱歉，但不是阿姨的\n\n錯，這是我自己的決定。\n\n\n\n　　大臣一開始行動的動機，是成為鈴芽的貓，和找替代要石來阻止地震，\n\
  \n但左大臣的干涉讓大臣體會到即使一開始鈴芽（與環阿姨）確實真心，但經\n\n過時間的變化後想法也會改變。雖然在鈴芽找到故鄉之門後，終於明白大臣\n\n一路上都在引導他們關門而向大臣道謝，使祂改變了狀態，但經由相處，鈴\n\
  \n芽明白封印蚯蚓的必要性，作為關門師的草太比她更有活下去的價值，故而\n\n決定以身相代，而這是大臣不願意見到的結果，並認知到祂無論如何都不可\n\n能成為鈴芽的貓。把草太要石拔起來的過程，感受到鈴芽與草太因為相遇相\n\
  \n知而「想活下去」的意志與願望──作為神的大臣才恢復要石的石像，對鈴\n\n芽說：「我當不成鈴芽的貓了，就藉由鈴芽的手，恢復原狀吧。」由於長久\n\n的孤獨幾無機會傾聽人類的願望，使大臣一度不再重視自身成為要石任務的\n\
  \n價值，也無法明白人類細微的情感變化，但經過這趟旅程，他體認自身的任\n\n務能保護重視之人的平安，完成她想維護生活如常的願望，並在草太的禱詞\n\n裡感受到人類對自然與神明的敬重與懇求，比起一開始的迷惘，雖然曾經悲\n\
  \n傷，但已然找回自身的價值，而這也是神無私無悔的大愛──即使被遺忘忽\n\n視，被誤會以致厭惡，但只要誠心祈求，便仍願運轉神力，實現眾生的願望。\n\n\n\n\
  　　從草太的口中可知，每個人看見的常世都不同：而進入常世後焰火焚地\n\n的震災畫面，正反映了鈴芽內心的創傷始終停留在四歲那個燃燒的夜晚；找\n\n到草太後，經由拔起要石碰觸到草太的記憶，體察到自己在草太心中的重要\n\
  \n性，且經由這趟旅程拓展經驗的她，感受到生活最細微的美與（來自阿姨、\n\n路上得到的協助，以及認識了草太）恩惠──而草太回應了鈴芽強烈的呼喚\n\n與意志，從認命的沉睡中甦醒，進而鬆動了要石恢復人形──「我知道生命\n\
  \n很短暫，我知道死亡隨時會來臨，即使如此，再一年、再一天，就算只是再\n\n一小時，我們都想活下去！」──鈴芽和草太牽引了彼此想「活下去」感受\n\n人世與愛、實現理想的未來，這份人心的重量讓草太藉由禱詞向左大臣祈求，\n\
  \n同時經由鈴芽手持大臣一起平息蚯蚓的災厄力量，把土地交還神明恢復安定\n\n的狀態。\n\n\n\n　　恢復了的常世，讓鈴芽不受時間限制，看到過去在生死徘徊的自己，真\n\
  \n正面對了過去的創傷。拿起被沖到常世的椅子、一步一步靠近年幼鈴芽的她，\n\n赫然明白當年的她早已知道母親去世，這道創傷卻深深埋在心底，一如蚯蚓\n\n會不時擾動，使她長久以來都背負著無人可訴的哀悼與孤寂。但經過這一趟\n\
  \n旅程、與環阿姨和解、及與草太經歷過旅程的鈴芽，已對未來有了嚮往，也\n\n知道了自己的力量與價值。她對小鈴芽說的話除了讓小鈴芽面對早已知道的\n\n事實（其他大人都知道卻都無法告訴四歲的孩子），帶給她面對未來的力量\n\
  \n（親人猝然逝世的小鈴芽，正處於「否認」階段，先「承認」才能前進）：\n\n「不管現在有多麼悲傷，今後還是會順利長大。所以別擔心，未來一點都不\n\n可怕！你今後也會喜歡上別人，也會遇到許多很喜歡你的人。雖然你現在可\n\
  \n能覺得一片黑暗，可是早晨總是會來臨。你會在曙光中長大成人。」「我是\n\n鈴芽的明天」，更多的是對未來的自我期許。而草太在月台與鈴芽分別之際，\n\n察覺到她的不安而給予的擁抱和承諾「謝謝你救了我，我一定會回來見你\n\
  \n的」，既是傳達感激、承認情誼的延續，更是承諾珍重自身，珍重彼此的未\n\n來。對還未成年、認識未久卻相知最深的鈴芽來說，這是最謹慎又含蓄的告\n\n白。\n\
  \n\n\n\n\n四、結語：尋回鬆脫遺失的要石／鑰匙\n\n\n\n　　在《鈴芽之旅》當中，「蚯蚓」代表的不只是土地荒廢或失去敬畏、進\n\n而失去人心重量之後必須及時面對與處理的災厄，亦是象徵人心裡的傷痛、\n\
  \n困惑、煩惱、迷惘……一旦累積到某個程度未被正視，讓心靈的角落成為廢\n\n墟，就會逐漸造成破壞，甚至破門而出。但如果能找到要石／鑰匙，好好面\n\n對以及祈願，收拾那些回憶，蚯蚓就會四散化為雨水、彩虹或土壤，成為生\n\
  \n命的恩澤。這時將整理過的回憶好好關門、上鎖，便能繼續前進。「從很久\n\n以前，我就得到所有重要的事物了。」鈴芽的這句話，無論對她、對草太與\n\n大臣，其實都是相同，他們過去的價值與堅守的信念都沒有改變，而是如要\n\
  \n石一般鬆脫，改變的是經由相遇與旅程，加強了「價值的堅信」，也就是自\n\n我實現的確認與勇氣。\n\n\n\n　　所以這趟旅程看似回到原點，實則是原本在路途遲疑的她、他與祂，都\n\
  \n再次確認了自己的目標、價值與歸處，「我出發了」而能繼續前進。而鈴芽\n\n最後對草太說的「歡迎回來」既是她四歲送別母親、倖存者對離世者來不及\n\n說的話，此刻對草太承諾與情誼的回應，更是面對未來的無常與如常最平凡、\n\
  \n卻能堅持前進的力量。\n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\n  \
  \                                陳斐雯  貓蚤札（其三）\n\n--"
