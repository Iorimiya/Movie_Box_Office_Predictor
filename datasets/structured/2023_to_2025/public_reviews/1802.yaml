  \n後面又收得太快\n\n阿姨醒來後馬上解釋\n鈴芽瞬間理解，然後後面劇情就不再著墨\n\n導致後面的體諒缺乏其力道\n\n反倒讓觀眾覺得這個問題並不嚴重\n\
  而是似乎被導演刻意放大\n\n這段的情緒轉折太過匆促又短暫\n真的很難讓人感同身受\n\n很抱歉，但是\n這樣的方式實在\n\n然後，左喵這個心控的能力也出現僅此一次\n\
  後面便對此能力再無著墨\n\n更顯得這個橋段的設計過於刻意\n\n\n--------\n\n--------\n\n\n\n\n鈴芽每次關門時，看到的目的地往往都在遠處\n\
  但扣掉橘子妹騎腳踏車的那次\n(那次也是騎超快....妳橘子妹其實是飆速宅男吧...=.=)\n\n常常是用跑的就跑到目的地\n\n先不講跑了多久\n\n就看電影表現出來的感覺\n\
  辣個蚯蚓的增長速度\n\n比我他喵的看片子時血脈賁張的速度還快\n\n妳鈴芽那動輒一兩個山頭的距離\n說到就到\n\n除了第一次家鄉的地震是因為來不及關上\n\
  (還不是來不及跑到喔)\n\n蚯蚓的那個....頭\n好像在妳到之前都不會軟掉一樣\n\n妳閃電俠系？\n\n更不用說辣個無限的體力\n在跑到現場之後，喘都不喘一下\n\
  \n直接硬上關門....\n\n\n\n\n\n在還沒變成椅子時\n草太關門關得要死要活還受了傷\n\n沒想到你草太那變成椅子後\n反而超越人類的運動能力是怎樣？\n\
  \n一跳就一個摩天輪座的距離\n\n更不用還有那不遜於人類的跑步速度\n連鈴芽都追不太上\n\n男生的第三隻腳原來這麼厲害的嗎(誤)\n\n\n\n\n\n嚴格來講，大部分的橋段我覺得都滿好的\n\
