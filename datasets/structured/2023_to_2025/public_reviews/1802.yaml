url: https://www.ptt.cc/bbs/movie/M.1677775485.A.DCB.html
title: '[好雷] 《鈴芽之旅》部份聖地巡禮'
content: '剛刷完IMAX，絕美畫面加神級配樂，真的

  非常享受，雖然對新海誠的作品還是最愛

  《言葉之庭》，但在《天氣之子》讓我稍

  微失望後，《鈴芽之旅》讓我重新更愛新

  海誠


  311地震是近10年來，日本發生過最大災難

  ，新海誠巧妙的連結到311，雖然沒有直接

  指名此場地震，僅靠一些細節告知，完全不

  再挑起傷痛，而是鼓勵當年還繼續努力活下

  去的災民；劇中的蚯蚓也對照世界各地地震

  前，蚯蚓會大量爬出地面的說法。


  看新海誠的電影，最有趣的是能夠聖地巡禮

  有機會去日本旅遊的人，不妨去一下。


  開場的平交道（ 臼杵高校前平交道）




  鈴芽乘坐的渡輪（おれんじ四国）



  八幡濱港



  廢棄遊樂園（岡山鷲羽山遊樂園）



  鈴芽故鄉的後門（宮古市運動公園停車場）




  其他場景如新神戶、明石大橋、御茶水聖橋

  、皇居、森後機關庫就很容易找到，就不另

  分享。


  最後一些無用知識

  電影中，推特出現的分享大臣之一帳號

  現實是存在的






  這次的主要場景區域都曾經發生過災害性大

  地震


  九州大地震

  南海大地震

  坂神大地震

  關東大地震

  311福島





  -----

  Sent from JPTT on my Xiaomi 21091116UG.


  --'
