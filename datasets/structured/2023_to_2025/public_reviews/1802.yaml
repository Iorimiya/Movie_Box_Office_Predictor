url: https://www.ptt.cc/bbs/movie/M.1677940538.A.AB3.html
title: '[好雷]無常與日常之間'
content: '周六的10:30早場，原本以為頂多一半XD

  去的時候一直跟朋友驚訝人怎麼比想像中多那麼多XD


  先講大致的感想，一路看得很順，不會覺得拖沓

  畫面還是美的沒話說(但個人更喜歡天氣之子的畫面)。

  有非常喜歡到流下眼淚的部分，也有覺得故事邏輯處理起來讓我沒那麼共情的部分。








  (以下有雷)



  先講沒那麼喜歡的部分：


  覺得主線劇情很像在玩RPG闖關，並沒有給我層層堆疊的感受。


  比較像是：因為遇到夢中的少年>>>少年說要去廢墟>>>廢墟有奇怪的門>>>要找貓貓了...


  到第一關愛媛的時候教一下怎麼關門，第二關神戶的時候又講解什麼是常世。


  這樣一路以事件來推動，看的時候雖然覺得接得很順也很有趣，但由於支線也不少，所以

  心境上並沒

  有太多跟著角色成長的地方。


  也有覺得部分可惜的支線，以為會講得更深刻結果好像也就突然結束(?)


  像是鈴芽與阿姨微妙的關係，原本以為在休息站大吵後會有更深刻或用回憶來鋪陳的劇情

  ，結果好像阿姨後面就突然接受她勇敢追愛的行徑了(?)



  -


  對我來說，這是一部讓我感受到許多「日常」的電影。


  不管是後疫情的現在，還是每每在天災過後的沉痛情緒。

  對我來說，最大的共同之處就是突然失去的「日常」。


  什麼是日常？

  可能是習以為常卻又建構生活的每一刻。


  電影裡有很多畫面都短暫帶過了平凡日常生活的風景。

  正要上下課的學生、在車站通勤的人、逛街的人、加班的上班族…。



  什麼是日常？

  也許日常同時也是一瞬間就能覆滅的無常。






  —莫文蔚《忽然之間》


  走出電影院的時候，我想到了這首創作背景據說和921有關的歌。


  即使是現在，從收到警報到實際發生地震之間，也不過就短短的時間。


  電影裡給了「關門師」能關上地震的能力，雖然在看的時候總覺得不切實際，但也許這是

  一種無奈之下的想望，能知道發生的時間就好了，能看得出地震要發生的預兆就好了，能

  早一步去阻止就好了。


  雖然電影內對鈴芽小時候的創傷描寫的篇幅並沒有想像中的多。

  但非常喜歡的部分，仍是在常世裡重遇小孩時自己的片段，看到大爆哭XD


  很痛苦，我知道你有多痛苦。

  每天回的家不見了，連媽媽也消失了。


  在醫院工作的媽媽去哪裡了？擅長木工的，在我生日的時候幫我做一張可愛椅子的媽媽去

  哪裡了？媽媽為什麼不見了？她找不到我怎麼辦？




  最讓我難過的，

  就是看見長大後的鈴芽對小時候的自己說出的這句台詞。

  (原本的文字我有點忘記了，但大致上是這個意思)。


  你知道的，你問的問題，你其實都知道答案。

  媽媽死掉了，不會再回來了。


  事情就是這樣發生了。

  再也沒辦法改變了。


  變成廢墟的遊樂園不會有人再去，廢棄的學校也不會再有學生的身影。

  傷痛永遠不會過去，就像三隻腳的椅子，會永遠像少了什麼一樣。


  但是，我想對你說。

  其實長大好像也會發生還不錯的事。


  阿姨會每天做同學都羨慕的愛心便當給你吃，

  在你離家出走的時候二話不說奔波大半個日本；


  會在學校交到中午一起吃便當的好朋友；

  會在上學的路上遇到長得像霍爾或白龍的夢中帥哥；

  會在愛媛和神戶遇到陌生卻善良溫暖的人…



  偶爾想起來的時候也沒關係，就用力地哭

  就算遇到突然的暴雨也總有一天會放晴的。


  然後向著下一個日常說，「我出發了。」



  --'
