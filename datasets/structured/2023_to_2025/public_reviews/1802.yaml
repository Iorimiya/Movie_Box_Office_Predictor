url: https://www.ptt.cc/bbs/movie/M.1679939184.A.E04.html
title: '[雷] ［負雷］鈴芽之旅觀後感'
content: '我是第一次在這裡發文，還請噴小力

  只不過好不容易擠出時間，滿懷期待

  有些嘈不得不吐





























  以下有雷



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  首先說，我是九二一後才出生的，基本上沒有經歷過什麼特別嚴重的地震

  所以我對佔據電影主要部分的「地震」其實沒有甚麼感覺，對不上電波也蠻正常的



  不過，女主的戀愛腦就讓我全程出戲


  我只能說，一名女高中生可以為了路上看到的男生直接翹課只是蠻不尋常的


  但是短短幾天就可以「不願意活在男主的世界」與「願意代替成為鎮石」實在是太令人難以

  接受


  沒什麼感情鋪墊就呼喊名字實在是尬的要死，最後到常世的那段回憶閃回尬得我腳趾可以扣

  出三室一廳


  同是災難作品，雖然天氣之子比不上你的名字，但好歹男主的動機十分明確，男主是因為女

  主比自己年紀小卻獨自承擔了整個東京的晴天，加上自己受到她的照顧，以喜歡她和痛恨自

  己窩囊為情感爆發點，就有後續反抗警察的劇情


  反觀鈴芽之旅，沒有仔細數過程過了幾天，但是在路上過夜有明確劇情的就是兩個地方：橘

  子園和小KTV，然後關了中學與摩天輪兩個門，所以我就會覺得只過了三天女主就不願意活

  在沒有男主的世界實在太誇張


  如果是因為自己拔出鎮石才讓男主犧牲，在電影這種的感情刻劃程度，女主尋回男主的動機

  應該是責任感（自己造成他人麻煩），而不是因為愛情（不願意失去他）


  另外，女主的感情戲加上男主的就更糟糕了，從男主的表現上來看，男主對女主的觀感只不

  過從陌生到同伴（然後到戀人？），女主的行為就像是單方面被男主顏值蠱惑的舔狗。


  而且男主的感情戲也一言難盡，東京之前只關過三次門，第一男主受傷女主合作，第二次男

  主手太短女主代替上鎖，第三次女主迷失還要男主救，我實在很難對男主「好不容易遇見妳

  」的感情產生共鳴



  除了男女主的塑造，這部電影的劇情線主軸也亂七八糟。


  電影劇情線就是：

  找媽媽帶出女主背景=》一見鍾情=》關門+設定說明=》追貓=》被貓耍+阻止兩次地震=》被

  貓耍+男主為救東京犧牲=》女主為了男主返鄉=》女主和阿姨吵架=》找到故鄉後門=》救男

  主然後封印蚯蚓=》把椅子交給以前的自己然後HE


  乍看好像沒什麼問題，但是電影參雜了太多元素，有災難（地震）、親情（阿姨）、愛情（

  男女主）、友情（男主和其友人）、成長（面對小時候的自己）……等等，不但沒有選定主

  要的元素，還把這些元素全部零碎的丟到電影的各個片段，就像是把一季都兩季的動畫硬是

  濃縮成兩小時電影，想要討論的元素太多又講不好的感覺


  而劇情的重心也沒有一個明確的側重點，開頭的短片與傳承椅子的結尾讓我感覺這部影片應

  該會著重女主的心理成長，但是影片中段卻都是戀愛腦和關門，對女主的心理刻劃完全不足

  （只有摩天輪上看到門後然後恍神、行為動機都是愛情和過去創傷無關），讓我有種強烈割

  裂感



  最後關於貓咪的部分，我完全看不懂大臣的動機，難受的要死，只能說神明的動機是我這個

  卑微的人類無法揣測的吧


  總之，以10分滿分我給3分，一分給畫面，一分給原聲帶，一分給新海誠。除非對地震很有

  感覺，或是受災戶，不然基本上不推薦


  --




  主要是我不太能接受後半部分救回男主的劇情還是用愛驅動。阿姨作為在災難中失去親姐姐

  ，又犧牲青春照顧鈴芽的人物，完全有更強的情感渲染潛力，而不是歇斯底里的宣洩後結束

  。這部主旋律就是女主自我救贖，但是劇情卻有強硬加上愛情的感覺。


  雖然說後續想想，這種愛情表現以及女主可以隨時犧牲的解讀也很有道理，但是觀影當下的

  感覺真的很尷尬


  成長的部分應該是我搞錯，但是我覺得這部以公路片表現形式就是要藉由路上的好人好事來

  撫慰女主內心潛藏的傷痛，所以最後說的「我是妳的明天」我才認為是一種成長'
