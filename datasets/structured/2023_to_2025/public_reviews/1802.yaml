url: https://www.ptt.cc/bbs/movie/M.1677729027.A.C77.html
title: '[負無雷] 《鈴芽之旅》  宮崎駿，我的超人'
content: '雷文防雷資訊頁




  內文無雷





  從《天氣之子》後


  我就知道新海誠的作品不是我的菜


  《鈴芽之旅》更是讓我確認這件事


  畫面很美，劇情很碎


  題材的侷限性更是硬傷


  早年的《言葉之庭》和《秒速5公分》


  帶來的感動已不復見


  我很慶幸伴隨童年成長的是


  宮崎駿和高畑勳的作品


  也許新海誠票房跟得上宮崎駿


  但議題的深度等級差太多


  謝謝你，宮崎駿，我的超人


  無雷：




  --'
