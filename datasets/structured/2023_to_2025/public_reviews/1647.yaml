title: '[新聞] 《燃起希望之火》亞當貝薩用生命爆發力 '
content: '新聞網址：


  中時新聞網 2023-05-23 翁紫曦


  《燃起希望之火》亞當貝薩用生命爆發力 勇奪坎城一種注目最佳演出


  在《燃起希望之火》中演出精湛的男主角亞當貝薩，因為這個角色拿下坎城影展一種注目

  單元的最佳演出獎，也因為他已完全融入角色的演出令國外影評對他大表讚揚。曾就讀法

  律系的亞當貝薩卻因為熱愛演戲而退學，卻一度因為找不到表演工作只好去做房產仲介之

  後又當賣魚郎，放下身段體悟各種不同的人生之後，亞當貝薩在後來多部作品中逐漸展露

  頭角，如《驚天營救》和美國影集《漢娜》都可看見亞當貝薩的身影，也打開國際知名度

  。


  亞當貝薩出生在法國卻有著義大利和突尼西亞血統，這次在《燃起希望之火》中飾演一名

  在街頭非法販售汽油的男子阿里，一心希望自己能夠存夠錢之後離開貧困無望的突尼西亞

  前往歐洲生活。為了要融入阿里這個角色，亞當薩貝嘗試在2個月滯留在突尼斯一人獨居

  ，甚至還每天將自己灌醉然後大太陽底下曝曬，這樣的體驗就是希望能夠詮釋出阿里孤獨

  和絕望的心情。果然，也讓亞當薩貝在去年坎城一種注目拿到他應得的最佳演出獎項。


  以紀錄片起家的導演洛特菲內森在海量試鏡專業演員或街頭素人，原本遲遲找不到適合的

  人選，終於製片相中表現自然又不做作的亞當薩貝，也讓洛特菲看到他混合著堅強又脆弱

  的情感面，盛讚他就像一朵尚未盛開的美麗人格和靈魂。導演也提到：「由於片中他是唯

  一一位專業演員的主角人物，因此許多其他角色都需要靠貝薩的幫忙才能表現出不畏懼鏡

  頭的專業表現。」


  雖然導演洛特菲內森雙親是埃及血統，他們移民到英國之後，又在洛特菲10歲時隨著母親

  搬到美國，洛特菲在馬里蘭藝術學院讀繪畫時愛上電影，就一路追求影像藝術。處女作是

  紀錄片《黑人騎士幫》入選50多個國際影展，洛特菲內森首部劇情片《燃起希望之火》，

  他希望能夠讓角色和拍攝背景盡量接近寫實的狀態，尤其是主角阿里，但他並不希望觀眾

  將這個角色認定為真正引發「茉莉花革命」主人翁的傳記電影，因此他特別將主角角色的

  水果小販變成非法汽油兜售者，讓阿里站在大太陽底下販售汽油，還要被警察明目張膽的

  勒索繳教保護費，加上父親的過世，造成他和無依無靠的妹妹與房屋貸款的銀行周旋等困

  境，都讓《燃起希望之火》形塑出突尼西亞人民的困頓與挫折。


  --'
