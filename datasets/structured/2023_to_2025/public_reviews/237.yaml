title: '[普好雷] 追殺騎師'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  代表阿根廷角逐奧斯卡最佳外語片的《追殺騎師》，乍聽之下彷彿是類似《追殺比爾》的

  犯罪動作驚悚片，不過，在導演奧特加的詮釋之下，犯罪的元素仍在，但成品是一部充滿

  諷刺、色彩繽紛的黑色喜劇。究竟黑道老大為何要追殺這名騎師，卻又沒趕盡殺絕，古怪

  又荒謬的劇情，讓本片很有「奇幻影展」的味道。



  馬術騎師雷莫曾有輝煌的傳奇，是備受讚譽的勝利騎師，但後來卻身陷自我毀滅的境地，

  落魄危及他的職業生涯、人際關係，尤其是與女友的關係。而且又與黑道神秘商人牽扯關

  係，為故事增添層層複雜性。



  《追殺騎師》裡主角雷莫的性別認同與性傾向都是流動的，觀眾本來可能會以為他是由於

  出意外，撞傷大腦，改變認知能力，而有性別錯亂的問題，但從黑道老大與雷莫女友分享

  的故事能夠得出，或許他過去一直都是以多洛雷斯的名號在地下賽馬闖蕩，直到老大「看

  上他/她」，引其進入檯面上的賽馬世界，才換上「雷莫」的軀殼。電影大部分的時間，

  都描寫雷莫擁有一位馬術精湛且美麗動人的女友，但她以多洛雷斯的裝扮前往劇院向老大

  道別時，對方稱讚她的美貌後送上一吻，這可能才是老大長年支持著雷莫的原因吧。



  女友或同樣擁有流動的性傾向，或為雙性戀，她對雷莫的愛真實存在，即便自己擁有賽馬

  事業的野心，也願意為對方懷孕、生小孩。雷莫出事、失蹤之後，她也四處奔走，希望可

  以找到他的下落，但同時，仍舊在賽場上拚搏的她，也接受另一位騎師的追求。觀眾無從

  得知，多洛雷斯看見兩人交歡的畫面，心裡是什麼想法，但至少女友是真心誠意地為她的

  歸來感到開心，送上溫暖的擁抱之餘，也留下安心的眼淚。



  其實，《追殺騎師》若僅為討論身分認同，大可不必加入黑幫的劇情，但既為之，導演也

  非常認真處理與其相關的內容，甚至塑造出的是有情有義，而非心狠手辣的版本。除此之

  外，在黑幫成員出現的橋段，影迷們也不難看出各種經典幫派電影的致敬元素，像是類似

  《黑色追緝令》裡的餐館場景與如《教父》般坐在巨大的書桌前，抱著嬰兒擬定對策，都

  有說不出的滑稽感，極為逗趣。



  入獄後的多洛雷斯很受獄友歡迎，也勇於裝扮自己。某次她向獄友講述馬匹是如何與人類

  建立起長年的關係，其中逃跑是恆久不變的關鍵。這番談話還引起典獄長關切，詢問多洛

  雷斯為何談論「逃跑」這種敏感議題。沒想到典獄長是賽馬迷，實際上想利用權力借調她

  外出「勞動」，此時的「馬」對多洛雷斯來說，的確也成為一種短暫的逃離。事實上，馬

  在《追殺騎師》中的象徵還有「本性」、「本質」或「真我」。



  老大為了讓雷莫振作起來，回到過去的風光，而從日本運來一匹厲害的馬。問題是，日本

  馬習慣右轉，從小到大都往右跑，一時半刻要改成左彎本就不容易，更不用說騎師還是當

  時陷入毒品濫用與酗酒問題的雷莫。開賽後，雷莫與日本馬的組合看似跑得很順，但一進

  入彎道就失控地衝向圍欄外的馬路，其後，雷莫開始放膽做自己，回歸她原本的樣貌。女

  友說雷莫必須死後重生，自己才能再愛上他，而那匹日本馬也在這場意外後死去，或許也

  象徵雷莫的死亡與多洛雷斯的重生。



  這部電影奇幻的地方在於，除了充滿拉丁風味的配樂、歌曲與舞蹈穿插在故事間之外，便

  是觀眾在前半段看到的「雷莫」真的是我們以為自己看到的樣子嗎？畢竟他是在醒來之後

  ，直接拿走病床前的包包與大衣，雖說觀看監視器時，警官說雷莫取走他人的物品，推測

  大概是隔壁床的病患，但如果那真的是雷莫，或該說多洛雷斯的物品呢？多年來，她始終

  壓抑自己的身分認同已是事實，但從多洛雷斯翻看包包內的物品，就馬上知道該如何在自

  己臉上塗塗抹抹，以及毫不費力就走到好友家，對方卻表示她從未去過等蛛絲馬跡，我們

  能夠大膽推測，雷莫可能沒去過、對物品不熟悉，但多洛雷斯肯定駕輕就熟。



  片中的雷莫濫用毒品、酗酒，這或許是他逃避的方式。老大帶雷莫入行，即使他後來表現

  不佳，都仍舊不離不棄，但這份好意對雷莫來說卻可能是無法忠於自我的壓力。受到典獄

  長賞賜後，他再次重拾騎師的身分，雖然開門的獄卒叫的是「蘿莉塔」，門打開後看到的

  卻是全副武裝、帥氣十足、未施脂粉的雷莫。或許對他來說，坐在馬匹上奔馳，尋求逃脫

  的還得是男兒身。最後，雷莫中槍身亡，女友也在槍響的同時破水，誕生的女嬰命名為多

  洛雷斯，便成全了女友的承諾，死後重生她便會再次愛上對方。


  --

