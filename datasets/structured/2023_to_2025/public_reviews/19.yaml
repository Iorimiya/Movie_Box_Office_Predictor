title: '[新聞]葛倫鮑威爾大展超狂身手！《逃亡遊戲》五'
content: '派拉蒙影業將於11月12日推出由艾德格萊特執導的最新動作鉅獻《逃亡遊戲》，主演卡司

  包括葛倫鮑威爾、威廉梅西、李佩斯、艾蜜莉雅瓊斯、麥可塞拉、丹尼爾艾薩拉、潔米勞

  森、柯爾曼多明戈和喬許布洛林。


  《逃亡遊戲》近日釋出最新預告，動作場面全面升級，葛倫鮑威爾化身新世代動作英雄，

  親自上陣挑戰高難度特技與爆破戲，火力全開、拳拳到肉，展現前所未見的極限身手。導

  演艾德格萊特延續其標誌性的快節奏剪輯與視覺風格，讓整支預告充滿張力與速度感，更

  驚喜致敬「逃殺電影始祖」《魔鬼阿諾》，打造年度最震撼、最具娛樂性的動作鉅片。




  看點一：葛倫鮑威爾親自上陣，挑戰極限動作

  身為好萊塢近年力捧的新星葛倫鮑威爾，不僅先後演出阿湯哥的經典作品《捍衛戰士：獨

  行俠》，更以《龍捲風暴》成為票房賣座的保證。在預告中可見他全程親自演出爆破現場

  到肉搏追逐的動作戲碼，展現其邁向新一代好萊塢動作巨星的決心與魅力。


  看點二：艾德格萊特獨具節奏的導演風格

  以《活人甡吃》、《終棘警探》和《醉後末日》「血腥冰淇淋三部曲」成名的導演艾德格

  萊特，更以招牌的快節奏剪輯與強烈視覺構圖，結合強烈節奏音樂與動作的速度感，打造

  能讓影迷們腎上腺素飆升的視覺饗宴。


  看點三：「真人實境 × 生存遊戲」的驚險設定

  以真人實境直播生死搏鬥為賣點的《逃亡遊戲》，讓參賽者必須在職業殺手的全程追捕下

  存活 30 天，更以高額獎金與全程實況轉播同時吸引社會底層與嗜血的觀眾，結合媒體操

  控與極限挑戰的內容更是好萊塢經典不敗的題材之一。


  看點四：豪華卡司齊聚，共演生死對決

  除了主要演員葛倫鮑威爾與喬許布洛林兩大主角互飆演技外，製作團隊找來的柯爾曼多明

  戈、李佩斯、艾蜜莉雅瓊斯等人，均為好萊塢知名的實力派演員，同時導演更在片中致敬

  「逃殺電影始祖」《魔鬼阿諾》，希望正片上映時也能看到阿諾親自客串演出，為影迷們

  帶來更多驚喜。


  看點五：娛樂與人性的雙重對決

  由喬許布洛林飾演的節目製作人丹奇利安，不僅擅長操控觀眾情緒的黑暗操作，導演更以

  動作與懸念兩大主軸包裝對於現今媒體現象（或亂象）的深刻諷刺，這也讓這部作品不只

  是刺激的逃亡，更是一場關於人性與道德的終極挑戰。


  《逃亡遊戲》故事敘述在不久的未來社會，《逃亡遊戲》是收視率最高的電視節目，這是

  一場致命的競賽，參賽者被稱為逃亡者，他們必須在職業殺手的追殺下存活三十天。參賽

  者的一舉一動都透過實況轉播提供給嗜血的觀眾收看，他們每多撐一天，獎金也會變得更

  高。急著拯救身患重病的女兒，工人階級的班理查斯（葛倫鮑威爾 飾）在既魅力十足又

  冷血無情的節目製作人丹奇利安（喬許布洛林 飾）的說服下，決定鋌而走險參加比賽。

  但是班的反抗精神、直覺反應與堅韌意志，讓他意外成為觀眾心目中的黑馬，甚至威脅整

  個體制。隨著收視率飆升，危險程度也越來越高，班不只是要以智力與膽識逃避獵人追殺

  ，更要對抗一個沉迷於觀看他註定要失敗的國家。




  --'
