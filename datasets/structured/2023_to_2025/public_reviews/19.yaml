url: https://www.ptt.cc/bbs/movie/M.1762879408.A.5FC.html
title: '[好雷] 逃亡遊戲，推薦給想看動作片和葛倫的粉絲'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  本篇微雷，幾乎無雷。


  感謝台灣派拉蒙贈票，幸運抽中台中新光影城11/11週二晚上19:00的特映會：

  《逃亡遊戲》The Running Man

  11/12上映，反烏托邦黑色幽默動作驚悚片，片長133分鐘。改編自史蒂芬金

  1982年小說《奔跑的男人》，也是1987年阿諾主演電影《逃亡遊戲》的翻拍版，

  葛倫鮑威爾、喬許布洛林主演。劇情描述在不久的未來世界，主角班理查斯

  因故失業，為了拯救病況危急的女兒，鋌而走險參加全國收視率最高的電視節目

  《逃亡遊戲》，參賽者必須逃避職業殺手的追殺，並透過電視實況轉播給嗜血的

  觀眾收看，每存活一天就能累積更高的獎金。

  某些方面讓人聯想到有點像是《魷魚遊戲》加上《飢餓遊戲》的感覺。


  片中有出現致敬阿諾的彩蛋，還有一位讓人印象深刻的女配角，在去年2024電影

  《龍捲風暴》也有跟葛倫鮑威爾一起演出，讓人會心一笑。

  全片幾乎沒有冷場，滿滿的動作場面，有點浮誇，也有血腥暴力，以及黑色幽默。

  喜歡動作片的影迷應該不會失望，雖然個人認為運鏡可以再加強一下。

  葛倫鮑威爾有賣肉的畫面，本片他的身材鍛鍊到更強壯了，演出也很精采，

  推薦給喜歡他的粉絲。個人蠻看好他以後會走紅。


  --'
