url: https://www.ptt.cc/bbs/movie/M.1763128391.A.E6A.html
title: '[負雷] 逃亡遊戲 '
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n阿諾版本好上一百倍，也不如去看金鐘國\n\n首先還是DEI的黑白配\n不過顏值正常，如果不是被荼毒太久，其實很ok\n\
  \n\n\n\n整部片毫無讓人興奮的地方\n五名獵人對比阿諾的各種花枝招展的主題獵人，遜色太多\n除了蒙面人外，根本不知道設定，也完全不會進入腦海中\n\n\n\
  主角也看不出來強的地方，阿諾版本是神擋殺神佛擋殺佛\n2025這版的..........\n榮民之家幹掉八個獵人.......關他屁事\n就掉到地下室，獵人剛好射到瓦斯管線\n\
  \n後面靠黑人兄弟躲了幾天\n靠熱狗怪咖躲了更多天\n主角根本沒發揮什麼本事\n\n礦坑的獵人是靠熱狗男偷襲\n橋上對撞算是主角自己解決的\n但我就問主角都想到要跳車，獵人為什麼沒想到跳車??\n\
  \n\n然後製作人也是腦殘\n前面強調的沒特色獵人外\n節目開播才能殺人是三小\n可以預錄又是三小\n最白癡的是自己都說直接用老婆小孩威脅就能解決的\n要搞一堆事\n\
  我看不懂不用老婆小孩威脅，要搞一堆假影片問主角服不服幹嘛\n\n最後崩盤也很莫名其妙\n因為主角的黑盒子被公開，所以人民革命\n他媽的整部片的影片都在造假\n\
  這麼簡單就能讓人民革命\n革命軍早點造假一下不就好了\n\n喔!我忘了，阿諾版本才有革命軍\n這版只有熱狗怪咖\n\n\n要未來感沒有未來感\n要動作沒動作\n\
  要噱頭沒噱頭\n要劇情沒劇情\n\n\n整部片我最喜歡的大概就是美國生活的肥皂劇吧\n短短片段就有夠低能\n\n\n\n\n\n\n\n\n--\n\n   \
  \                \n\n\n                                                        \
  \       by ckshchen\n\n--"
