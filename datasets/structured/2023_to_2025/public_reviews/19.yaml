  \n國網:社群媒體\n\n看電視的人:出廣告錢的人，也是受眾\n\n逃亡者:娛樂觀眾用的標的\n\n有沒有覺得很像，這就是每天社群媒體在做的事情，收廣告商的錢，偏向的報導/帶風向，甚至靠AI捏造不存在的事實，影響自以為中立跟善良的人們，讓他們不自覺的拿起屠刀追殺逃亡者。\n\
  \n我個人覺得，這片至少IMDB會到7.0以上，只是這個故事，社群大頭大概不會很喜歡。\n\n某種程度上，他比純爽片的終極戰士，還有些讓人思考的空間。\n\n\
