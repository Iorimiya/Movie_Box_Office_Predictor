url: https://www.ptt.cc/bbs/movie/M.1760507847.A.EF0.html
title: '[新聞] 葛倫鮑威爾的《逃亡遊戲》 史蒂芬金表達滿'
content: "葛倫鮑威爾的《逃亡遊戲》 史蒂芬金表達滿意\n\n\n《逃亡遊戲》（The Running Man）劇照，葛倫‧鮑威爾。（UIP提供）\n\n\
  【大紀元2025年10月14日訊】（大紀元記者葉子杰綜合報導）當地13日，派拉蒙影業釋出\n葛倫‧鮑威爾主演的驚悚片《逃亡遊戲》（The Running Man）最新預告片。美國知名作\n\
  家史蒂芬‧金（Stephen King）對該片讚不絕口。\n\n《逃亡遊戲》釋出全新預告，該片改編自史蒂芬‧金的同名小說《The Running Man》，\n\
  該小說於1987年曾被改編成美國反烏托邦動作電影《魔鬼阿諾》（The Running Man），\n由阿諾‧史瓦辛格（Arnold Schwarzenegger）主演。週一，史蒂芬在社群媒體X上（點這\n\
  ）說：「新預告片：《逃亡遊戲》。順便說一句，我已經看過了，精彩絕倫。堪稱當代的\n《終極警探》。一場跨越黨派的驚險之旅。」\n\n最新預告片：\n\n據《Fandomwire》報導，史蒂芬先前曾對保羅‧麥可‧格拉澤（Paul\
  \ Michael Glazer）\n執導的《魔鬼阿諾》改編電影表示失望，因為這部電影的調性和主題與他的小說完全不同\n。如今，他讚賞葛倫‧鮑威爾主演的新版本，似乎在暗示這次的改編電影終於讓他滿意了\n\
  。\n\n《逃亡遊戲》由艾德‧格萊特（Edgar Wright）執導，從預告片來看，這部電影確實有點\n像《終極警探》（Die Hard，1988）的感覺。史蒂芬的原著小說講述的是一個窮困男子參\n\
  加生死攸關的遊戲節目，想贏錢救他生病的孩子，故事非常黑暗、反烏托邦。但是格萊特\n導演的電影看起來則輕鬆一些。\n\n\n《逃亡遊戲》（The Running\
  \ Man）片場照，（左）導演艾德‧格萊特。（UIP提供）\n\n除鮑威爾外，主演卡司包括威廉‧梅西（William Macy）、李‧佩斯（Lee Pace）、艾蜜\n\
  莉雅‧瓊斯（Emilia Jones）、麥可‧塞拉（Michael Cera）、丹尼爾‧艾薩拉（\nDaniel Ezra）、潔米‧勞森（Jayme Lawson）、柯爾曼‧多明戈（Colman\
  \ Domingo）和\n喬許‧布洛林（Josh Brolin）。\n\n《逃亡遊戲》故事敘述在不久的未來社會，《逃亡遊戲》是收視率最高的電視節目，這是\n一場致命的競賽，參賽者被稱為逃亡者，他們必須在職業殺手的追殺下存活三十天。參賽\n\
  者的一舉一動都透過實況轉播提供給嗜血的觀眾收看，他們每多撐一天，獎金也會變得更\n高。\n\n工人階級的班理查斯（鮑威爾 飾）急著拯救身患重病的女兒，他在有魅力卻也冷血無情\n\
  的節目製作人丹奇利安（布洛林 飾）的說服下，決定鋌而走險參加比賽。\n\n但是班的反抗精神、直覺反應與堅韌意志，讓他意外成為觀眾心目中的黑馬，甚至威脅整\n個體制。隨著收視率飆升，危險程度也越來越高，班不只是要以智力與膽識逃避獵人追殺\n\
  ，更要對抗一個沉迷於觀看他註定要失敗的國家。\n\n《逃亡遊戲》將於11月7日在美國上映，11月12日在台灣上映。\n\n責任編輯：蘇漾\n\n\n\n--\n\
  \n                  \n\n\n\n--"
