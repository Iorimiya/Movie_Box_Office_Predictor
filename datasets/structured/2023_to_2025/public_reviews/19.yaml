url: https://www.ptt.cc/bbs/movie/M.1763628192.A.C1A.html
title: '[普雷]  逃亡遊戲(2025)與原著差異'
content: "小時候看過1987版的The Running Man(魔鬼阿諾)\n(明明它是限制級，為什麼我當時能看www)\n\n所以之前看到預告時也一直以為這是翻拍1987年的電影\n\
  沒想到看完之後發現除了主題都是死亡電視節目\n兩部電影幾乎沒有共同之處\n\n事後查了資料，才發現艾德格‧萊特這部電影\n其實是史蒂芬‧金原著小說的忠實翻拍\n\
  (魔鬼阿諾只借用了小說的一些元素，但大幅度改編)\n幾乎所有情節都是照原著小說的發展走\n只是加上了一些現代化的詮釋\n以及影視化必要的改編\n\n但要說與原作的最大不同之處，當然還是那個結局了\n\
  \n原著小說的主角，同樣用炸彈威脅搭上了飛機\n同樣被飛機內建的安檢識破在吹牛\n同樣被給予成為新獵人的提議\n然後同樣被告知老婆與女兒早就被殺死了\n\n與電影不同的是，他在接受提議殺光全機上的人後\n\
  (女汽車駕駛他還是強迫她跳傘了)\n沒有利用甚麼逃生艙逃跑，也沒被擊落\n\n\n\n而是選擇讓飛機撞上N網的大樓與身在其中的節目製作人同歸於盡\n\n...這個結局不能照著拍的理由顯而易見\n\
  \n但不免讓人覺得可惜，如果電影這樣結尾\n絕對會更加有震撼力\n也更符合這部作品的世界觀：殘酷又黑暗\n(記得片頭主角老婆說她賣笑不賣身嗎?\n 在原著裡，她老婆真的為了小孩治病而賣身了)\n\
  \n而非像目前的版本，彷彿童話故事一般的Happy End\n\n其他故事節奏上的問題，好像都是原作的包了\n原作就是如此的急收尾\n\n另外值得一提的是，你覺得30天的遊戲\n\
  電影裡主角只玩了2週就GG很沒用嗎?\n(雖然已經是第1季以來最久的一個跑者)\n小說裡的主角，只撐了197小時(8天多一點)\n但他已經是節目開播以來撐的最久的一個\n\
  \n而也因為他奮於抵抗集權菁英的姿態\n真正點燃了所有的底層民眾起身反抗\n(電影應該是因為大人的理由，淡化處理了這部分)\n\n只能說，全篇幾乎照拍原作，卻在結尾鬼轉\n\
  真的是可惜了\n\n--"
