url: https://www.ptt.cc/bbs/movie/M.1763092664.A.284.html
title: '[普好雷] 《逃亡遊戲》失去魔力的艾德格萊特'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  《魔鬼阿諾》堪稱台灣電影翻譯史上最意義不明、卻也最精確地表達了這部電影最大賣點

  的片名：你根本不需要知道這部電影在演什麼，反正看到阿諾進場就對了。

  .

  而阿諾確實也是好萊塢最偉大的巨星之一，他讓全世界知道觀眾緣比演技還要重要，任何

  劇本、任何角色到了他的手上，都可以被他演成他的形狀。《魔鬼阿諾》裡的他被陷害入

  獄、被陷害加入一場死亡遊戲、看著同樣被陷害的夥伴一個一個死在他的眼前，這個角色

  理應憤怒、理應厭世，但阿諾可不來這套，80年代那些亂七八糟(這是誇獎)的奇想動作電

  影也不來這套，這部改編自史蒂芬金原著的電影充滿了對於未來的獵奇想像、還有各種奇

  形怪狀的反派打手，而超愛講One-liner冷笑話的阿諾的爛演技跟垃圾話，以及他獨特的

  鬼叫聲，只會讓更加昇華這部電影。

  .

  但是到了葛倫鮑威爾版本的《逃亡遊戲》(The Running Man)時，這股憤怒回來了，而這

  股憤怒成了驅使他不斷向前衝的最大動力：他演出的主角對這個世界憤怒、對媒體巨獸憤

  怒、對體制憤怒、對群眾憤怒、也對自己的無力感憤怒，《逃亡遊戲》並沒有忘記動作電

  影該有的幽默感，但對比《魔鬼阿諾》的直覺幽默，《逃亡遊戲》的幽默是建立在這股憤

  怒之上的，更加尖酸刻薄、也更加自嘲自憐。

  .

  而這樣的幽默，應該要是艾德格萊特的拿手好戲，但不得不說的是，艾德格萊特這幾年似

  乎失去了他的”MOJO”，這片跟他前兩部電影(《玩命再劫》、《迷離夜蘇活》)給我的觀

  感很像：它們都是好看的電影沒錯，但如果你把導演的名字遮住要我猜，我都不會猜導演

  是他─像《逃亡遊戲》我可能會猜是法蘭西斯勞倫斯導的，反正這陣子有什麼反烏托邦題

  材就丟給他就對了─他變得有點像是個好萊塢打工仔，《血腥冰淇淋三部曲》跟《歪小子

  史考特》那個時期的他好像回不來了，他就像是一個一登場就連續交出四張九十分以上的

  考卷的超級資優生─《終棘警探》我甚至私心認為是可以給到一百分的─但之後幾部作品

  都是八十分左右，儘管這也是不錯的成績，但你就是期待更多。

  .

  以故事設計來講，我是沒看過原著，所以不太確定新舊兩版的電影到底哪部比較忠於原著

  ，雖然有點懷念8、90年代動作片那股粗糙爆走的活力，不過新版確實也是有針對這個世

  代觀眾的審美做出了調整，讓它從一部「看阿諾亂搞一通然後觀眾笑呵呵」的動作片，改

  編成了「對媒體/社群提出厲聲控訴、替觀眾出一口氣的快節奏動作片」，它的背景設定

  其實依然蠻8、90年代的，就是反派是企業大老闆，大媒體/大公司的權力大過天、還有一

  個樣板卻也卡通化的油膩反派(喬許布洛林有稜有角的剛毅外型與這樣的角色意外合拍)的

  那種動作片。

  .

  但不得不說，新版跟舊版雖然都是以「主角參加死亡遊戲」做為主題，但兩個"Running M

  an"的節目設計幾乎可以說是南轅北轍，如果你不講，我可能還以為這它們只是設計類似

  ，但沒有關係的兩部電影。要是仔細思考的話，我們先撇開「節目製作組操控了一切勝負

  、根本不會有真正的贏家」這樣反烏托邦電影必備的橋段，單就這個比賽來看，其實《魔

  鬼阿諾》的規則看起來合理許多：活三個小時，然後要對付的對象只有幾個關主，他們甚

  至還是一個一個上的。《逃亡遊戲》裡主角必須活過三十天、而且是全國傾力追殺，這光

  用看的就覺得怎麼可能贏？

  .

  不過也多虧於《逃亡遊戲》這樣的規則設計，這次的娛樂價值不只是看阿諾笨重地海扁每

  一個同樣笨重的對手，我們可以看到比《魔鬼阿諾》還要更加大量且豐富的動作戲：追逐

  、逃亡、獵殺、飛車、槍戰、爆破、甚至《小鬼當家》式的動作戲連綿不絕，加上怒火中

  燒的主角不斷堆疊的革命情緒累積到最後一口氣爆發，單就一部科幻動作片來講，《逃亡

  遊戲》確實帶給觀眾足夠的刺激過癮。

  .

  然而還是想要吐槽一下，就像我曾在《哈利波特：火盃的考驗》裡面說過的那樣，這片最

  大的問題是，《逃亡遊戲》對於那個世界裡面的觀眾來說，這節目根本不好看吧？《魔鬼

  阿諾》裡面節目至少是全程直播，這片為了讓全國民眾也能參與遊戲，觀眾能看到的只有

  當屬於節目的獵人找到選手時刺殺他的那段過程，這不過就是幾分鐘的事情，而如果是民

  眾殺的，觀眾甚至還看不到。這節目大多數的時間到底在看什麼？主詞人在台上自嗨還有

  熱舞表演嗎？

  .

  我們看到的、主角那些準備、規劃、逃亡、潛行的過程，還有獵人追捕誘殺的過程，這才

  應該是這種節目最有趣好看的部份，理論上應該是要安排兩組攝影機，一組跟著主角、一

  組跟著獵人，然後兩邊情報互不相通，讓觀眾可以同時看到這兩邊貓抓老鼠的遊戲才對，

  但整個遊戲時間拉長到了三十天，加上民眾也要參加，這讓那個世界裡面的觀眾在主角被

  找到之前，根本不知道他做了哪些事情，這樣的節目會很好看？

  .

  最後我想說的是，我好討厭麥可塞拉的媽媽這個角色，不是說她把一個討人厭的角色演的

  很好這種討厭，是這種角色的存在就對劇本很扣分。還有李佩斯真的蠻帥的，但可惜好像

  就是缺了個大紅的機會。


  --'
