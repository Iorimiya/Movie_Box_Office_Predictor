url: https://www.ptt.cc/bbs/movie/M.1762917945.A.758.html
title: '[好微雷] 逃亡遊戲：見證媒體巨獸'
content: '憤怒哥防雷










  ~~~~~~~~~~~~~ 雷文 主文~~~~~~~~~~~~~


  颱風前一天能看到這娛樂性高的電影，感謝主辦單位贈票。



  生病的孩子，崩潰的媽，憤怒的爸爸，破碎的家


  主角憤怒哥為了幫小孩治病，被說服參加了這場專門為了娛樂大眾，十死無生的實境節目。


  劇中很好的體現了宛若飢餓遊戲的反烏托邦世界觀：窮人與富人的天差地別，大企業完全掌握了世界，透過國網的免費電視，娛樂觀眾的同時也散撥假消息操弄人心。


  這世界有著超猛無人機跟人臉辨識系統，但儲存媒介仍然是類似卡帶這種大東西。劇中有手機甚至app, 但似乎都是看電視當作主要娛樂, 沒有人在低頭滑手機，這真是個美好的世界：)


  這種科技上的反差滿有趣的。



  講一些片段：


  主角憤怒哥葛倫·鮑威爾(總感覺他無時不刻在生氣), 之前在獨行俠就知道他身材棒，這次也是大秀肌肉，福利滿滿。


  中間還有一段在致敬小鬼當家，整個超歡樂，快笑死。


  沒看過阿諾的原版Running man，但這部確實娛樂性很高，雖說劇情中有幾處草草帶過：比如沒什麼轉折就能這麽快信任對方，但整體節奏很好，是個不錯的爽片。




  阿對，結尾沒有彩蛋：(


  --'
