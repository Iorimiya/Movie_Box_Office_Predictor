title: '[好雷] 逃亡遊戲  別帶腦看還行'
content: '屬於那種看了就忘了的爽片

  他的超級豪華版就是 子彈列車

  子彈列車音樂劇情節奏都很完美

  而且有記憶點


  這部的城市感覺蠻像高譚市

  沒什麼特別高科技的感覺

  戰鬥沒什麼記憶點

  反而蠻喜歡惡意抹黑假訊息的議題

  但沒深挖蠻可惜

  這部電影給的評價就是看一遍

  可以但不會想看第二遍






  以下有雷



  這部節奏忽快忽慢

  中間有一段小鬼當家還行

  後面劫車到結局真的很潦草



