title: '[負雷] 逃亡遊戲'
content: "真的非常難看\n首先 男主角的老婆是髒辮黑人 就非常出戲\n沒有說不能黑白配 但他們的造型就像兩個世界的人\n然後 主角就是懷有正義感的藍領階級\n\
  所以他沒有什麼外掛 但他還是活到最後\n他整片應該叫LUCKY MAN 不該叫running man\n從第二天在旅館差點被逮 吊掛在旅館外面時\n突然電視台的人一句不要射他\n\
  逃到地下室後電視台的人就拿槍一直射 把瓦斯射出來再一直射\n主角就趁電視台的人炸翻旅館同時脫逃\n之類的場景一直發生 \n幸運值MAX 絕對是喝了福來福喜\n\
  然後莫名的跟革命組織搭上\n革命組織的幹部也是莫名其妙\n熱狗男的奶奶在發什麼瘋 看不懂\n莫名出現的房仲女 角色塑造如此淺薄\n那個禁忌的印刷品 也沒派上用場\n\
  電視方的BOSS 突然被幹掉\n\n男主可以活過兩週 真的很不合理 \n但片裡有給解釋「就是電視台方為了收視率」\n但這不等於片裡所有的不合理都可以推給這個藉口\n\
  劇情爛到不行 配樂可能是要配合主題實境秀所以也不好聽\n\n同樣是被體制壓迫、反抗體制、戰勝體制的進展\n2011年的鐘點戰好看多了\n而且女主角還是亞曼達賽佛瑞\
  \ 超美超正\n我也沒去了解什麼阿諾的情懷\n本片就是不好看 我寧願去二刷去死吧親愛的\n\n我朋友的票給我看 所以我禮拜一還要二刷逃亡遊戲跟看出神入化3 \n\
  天哪 會不會是災難般的一天\n-----\nSent from MeowPtt on my iPhone\n\n\n--"
