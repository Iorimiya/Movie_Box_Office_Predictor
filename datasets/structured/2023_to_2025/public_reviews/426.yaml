title: '[普無雷] 倫敦最壞的男人'
content: '雖然 IMDB 5.7 分

  昨天太無聊的小弟我

  忍不住還是衝了這部倫敦最壞的男人


  有看預告大概也知道

  這部就是在講藝術經紀人詐欺犯

  也是柯南道爾的福爾摩斯中的米爾沃頓的原型 -

  Charles Augustus Howell


  兩個小時的片長

  其實就是繞著他和藝術家 Dante Gabriel Rossetti 的恩怨情仇打轉


  攝影上蠻用心的，看到了不少維多利亞時代的文化背景細節

  飾演 Howell 的葡萄牙演員 Albano Jerónimo 演的蠻好的，不慍不火

  但劇情節奏很慢，很多橋段感覺都不是很必要

  猜測導演是想醞釀甚麼沉浸感，但小弟沒有感受到

  另外這部片說故事的能力老實說真的不是很好

  不能說導演沒有想拍出點高潮起伏

  但就有種加了很多調味料，但食物卻還是很清淡的感受


  以前有時會跟前女友說哪個遊戲超好玩怎樣怎樣的

  前女友都冷冷的說聽我講起來一點都不好玩


  那時候都覺得女朋友歧視宅男

  看完這部片忽然就能夠體會當年前女友的感覺了

  想到忍不住嘴角上揚了起來


  大概就這樣吧

  想看的人可能要先去做一下功課

  觀影體驗可能會比較好一點


  --

  是不到難看

  兩個小時我也是從頭看到尾沒有恍神

  但看完確有一種 "恩我是有甚麼沒看到嗎" 的感受XD'
