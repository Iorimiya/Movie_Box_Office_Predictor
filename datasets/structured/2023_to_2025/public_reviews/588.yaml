url: https://www.ptt.cc/bbs/movie/M.1736827947.A.4E0.html
title: '[好雷] 狂人法則'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  去年美國總統大選後，川普成為史上第二位兩度當選且任期不連續的總統。與此同時，伊

  朗導演阿里‧阿巴斯所拍攝、講述川普年少時期的新片《狂人法則》也在電影院上映。雖

  說北美的上映日在大選之前，但從後見之明來看，並沒有影響到選舉結果。雖然片中提到

  不少川普拒絕承認的爭議性事件，但《狂人法則》畢竟不是拍來黑川普的，而是提供世人

  一個全新的平衡觀點來看這位在當時非常成功的商人。



  1970年代的紐約，年輕的唐納‧川普為了擺脫房地產大亨父親所帶來的陰影，立志要在曼

  哈頓房地產業界闖出名聲。羅依‧科恩（Roy Cohn）看中川普的潛力，教導他邁向成功的

  「狂人法則」——攻擊、否認、永遠稱自己勝利。不過，當川普逐漸成為眾所皆知的「狂

  人」之後，他也為身邊的人帶來出乎意料的影響…。



  大部分的傳記電影要不是拍攝故人，就是以回憶錄的方式呈現，但《狂人法則》卻是在川

  普仍是話題人物時拍攝。雖說故事聚焦在年少時期，但要演繹一位幾乎每天出現在世人眼

  前的人物可不容易。為了忠實呈現川普的形象與樣貌，賽巴斯汀‧史坦（Sebastian Stan

  ）不但在前製期攝取過量碳水化合物並把可樂當水喝，還觀看上百支川普的影片，以完美

  捕捉他的動作神韻與說話方式。從靦腆青澀的20出頭小夥子，到成為不可一世的房地產大

  亨，史坦無懈可擊的演技也讓他獲得金球獎戲劇類最佳男主角提名，而賽巴斯汀在另一部

  作品《非常男人》的精湛表現則為他奪得喜劇類最佳男主角。



  雖然《狂人法則》在呈現川普的形象方面還算中立，但講到他，很難不聯想到「歧視」，

  而電影也為大家揭密為何川普會形塑目前的想法。不論是恐同、性別歧視，還是種族歧視

  ，都能夠從片中看出，當時的時代氛圍與他的人生導師羅依，無疑都扮演著關鍵的角色。

  那是一個身為同性戀都會被剝奪公職身分的年代，在當時，同性戀等於愛滋病，而與愛滋

  病患對話不會傳染的觀念也尚不盛行。



  即便科恩最後死於愛滋併發症，他都不願承認自己HIV陽性，也經常公開發表貶低同性戀

  的話語，而在《狂人法則》裡，年輕的川普親眼看到歷史上性向成謎的羅依‧科恩與男人

  交合的畫面，以及他與助理羅素過從甚密的關係，都讓觀眾得以想像川普對於碰觸敏感議

  題可能會讓自己失去權力的恐懼。



  故事從川普父親的房地產公司陷入官司風波開始，他在康尼島建設的川普村遭控種族歧視

  。片中的川普向羅依求助時，義正嚴詞地說，他們並沒有拒絕讓有色人種入住，他們只是

  必須提供收入高於平均四倍的證明。科恩甚至在法庭上說，沒人有辦法確切知道某人是不

  是有色人種，畢竟有些波多黎各人比他度完假的屁股還白。



  這些言論在此刻聽來是多麼政治不正確，但羅依‧科恩講出口很可惡是一回事，聽著當年

  還很單純的川普緊張地解釋自己的家族企業真的沒有種族歧視，還是會讓觀眾對他興起一

  股同情。沒錯，賽巴斯汀‧史坦飾演的川普就是這麼有魅力，而光是想到川普的父親曾經

  在奉行白人至上主義的三K黨集會上被捕，就不難想像川普後來會發展成我們現在所看到

  的樣子。



  就像川普所說，他的父親極為嚴厲，這或許也是形塑他人格特質的原因之一。除了灌輸孩

  子成功才有價值之外，他對成功的定義也成為子女價值觀的基礎。《狂人法則》中一場飯

  桌上的戲，就明確指出這種權力關係。當時的川普還只是川普集團的副總裁，頭銜聽起來

  當然是很好聽，但他實際的工作內容說穿就只是到川普村去收經常無法順利收回的房租。

  野心勃勃的川普對房地產與紐約市的規畫有著豐富的想像，而他對哥哥「弗萊迪」也充滿

  敬重與崇拜，尤其哥哥對川普想執行的事物全力支持，也幫他向爸爸美言。



  但是，無法承受房地產事業壓力的弗萊迪，在爸爸的眼中就是一個失敗者。他甚至直言，

  每當有人問起他們的家庭，他都不敢提起自己的長子在當「機師」。與川普現今兩度進出

  美國白宮相比，擔任機師可能不是什麼了不起的工作，但尚且也是受人景仰又收入豐厚的

  職業，在爸爸眼中卻是如此不堪，讓弗萊迪在轉任機師前後都背負巨大的壓力。



  長年不受父親肯定的他，開始酗酒，最後導致無法繼續擔任機師的程度，在《狂人法則》

  裡，也呈現出他晚年潦倒求助於川普卻沒能獲得幫助的情景，最後因酗酒導致心臟病發而

  身亡，年僅42歲。對當時的川普來說，也是不小的打擊。其實，弗萊迪並不是川普家第一

  個孩子，川普的大姊是退休的美國聯邦法官（當時正在攻讀法學院），但在那場飯桌上的

  戲卻全然沒被提起，川普爸爸對於成功的定義與性別歧視的觀念可見一斑。



  「假如失去所有財富，我或許會去選總統。」



  電影結束在80年代末，川普正要著手出版《交易的藝術》一書，所以尚未碰觸到政治。可

  是，《狂人法則》中有很多他一直都對政治有興趣的蛛絲馬跡。從川普的電視隨時隨地都

  播放著政治人物的發言，到他受訪時主持人問：「假如失去所有財富，你會做什麼？」川

  普開玩笑地說自己可能會去選總統。事實是，他多年來多次破產，卻也屢敗屢戰，屢戰屢

  敗，最後真的成為美國總統。再加上川普這些年與羅依的相處，讓他對於成為握有權力之

  人越來越有興趣。



  不過，即使從政，還是可以從各方面看出川普作為一名商人的手腕。他的政治立場反覆，

  曾經多次轉換黨籍，當死忠的共和黨支持者大聲為川普吶喊，許多人卻不知道他最初是一

  名民主黨員，而後也加入過共和黨與改革黨，並曾經再次回歸民主黨。就算川普後期的立

  場都與共和黨一致，他也數度進出，如同川普做生意時的準則，哪裡有利益就往哪裡靠。



  「為了贏，你必須不擇手段。」



  科恩在某次聚會上，以「王子（Prince）」介紹川普，不禁讓人想到馬基維利的《君王論

  》（The Prince）。《君王論》的中心主題是「如有必要，君王應使用不道德的手段去實

  現目標。」川普著手出版《交易的藝術》，已是羅依‧科恩過世後的事，他毫不猶豫地偷

  走當年羅依傳授的三大狂人法則，就連現在大家耳熟能詳的「讓美國再次偉大（Make

  America Great Again.）」其實也是取自雷根的競選標語「Let''s Make America Great

  Again.」，而川普甚至在2016年初次競選總統時為口號註冊商標，彷彿這是他原創的標語

  一樣。



  電影並沒有明確指出是什麼事件，或在什麼時候川普從野心勃勃的單純男孩，變為不擇手

  段、唯利是圖的狂人，但人的轉變不就是這樣嗎？當科恩沾沾自喜於得意門生正一點一滴

  邁向成功的同時，卻沒發現他的「青出於藍」正往不可收拾的方向前進。從羅依‧科恩、

  川普與首任妻子伊凡娜的互動多多少少能夠看出這些轉變。當羅依開始建議他不要快速擴

  張，川普就開始疏遠對方，甚至科恩的同志傾向與或許患有愛滋病都讓他避之唯恐不及。

  就連最後為羅依‧科恩慶生，川普致贈的鑽石袖扣都是假貨，也讓前妻伊凡娜直言「唐納

  沒有羞恥心」。



  即便有這些較為負面的形象描繪，川普在確認愛滋病不會經由對話與相處傳染之後，便主

  動與羅依聯繫，關心並照料這位當年在自己還默默無名時就已經看到未來耀眼光芒的人生

  導師。科恩多次在公開場合稱川普是自己最好的朋友，而在《狂人法則》裡也多次提供無

  償協助，只要求對方以友情相待。事情的發展可能不如羅依‧科恩所料，但據傳川普是他

  過世前最後一位通電話的人，川普也還算重情重義。



  除了對待羅依的段落之外，其他像是婚內強暴前妻伊凡娜就是兩人在打離婚官司期間，伊

  凡娜曾經的指控，雖說最後撤銷告訴，但都有跡可循。另外還有禿頭整形、抽脂與濫用藥

  物等黑歷史的爭議內容，想當然爾會被川普否認，甚至揚言提告。《狂人法則》畢竟是部

  電影，為了娛樂效果加油添醋在所難免，但劇組在考據過程中肯定也下不少功夫，究竟哪

  些是八卦獵奇，哪些是真實故事，雖然不得而知，但都讓我們對川普有不同面向的全新了

  解。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
