title: '[好雷]《狂人法則》川普發跡過程的核心知識'
content: 'Sebastian Stan 在相當年輕的年紀獲得了「功能性」為衝獎的傳記片，並且扮演當代最

  具爭議性的美國前總統，同時是美國總統當選人的 Donald Trump，通常做傳記電影會選擇

  已經過世的名人，很少有這種即將成為世界上最有權力的人，本片在拍攝的時候，劇組對

  於美國政局的想像一定跟現在即將發行的時候完全不一樣，但片商仍然將電影推出，甚至

  台灣也即將上映，對於我們這些「外國人」想要了解即將再當4年總統的川普的為人，本

  片是相當不錯的入門戲。


  雖然 Sebastian Stan 2024年是以其他電影獲得柏林影帝，但他的演技在《狂人法則》也

  是淋漓盡致的展現，可以分成3個階段來觀察演員對真實人物的描繪。首先在川普年輕時

  ，他利用自己父親的房產事業獲得私人俱樂部的會員資格，跟重要人物認識，這時候的他

  不能說是白紙一張，但他的腦袋只對那些擁有的比他多的人，有利用價值的人有興趣，

  Stan 在臉上掛著的表情永遠都是茫然，因為他自己本身缺乏身處於這個精英俱樂部的資質

  ，總是被人呼來喚去，Stan 捕捉川普微妙的表情，以及缺乏語彙的尷尬姿勢，這時候已經

  很可以看出現代川普的形狀。





  第2就是在得到律師 Roy Cohn 的青睞後，靠他的骯髒手段解決了自己正要起飛的房地產事

  業面對的種種問題，這時候的川普雖然都是靠別人幫忙解決重要的危機，但是他開始進入

  一種自己做什麼事情都不會失敗的心境，Stan在這邊的演繹擺脫了年輕川普的窘困，而轉

  換身份讓 Roy Cohn 這種紐約扛霸子不得不在他身後解決他一直不斷創造的新問題，而電影

  內的川普，將這些都視而不見，只在乎自己的美麗新娘，把新的川普王國功績都歸在自己

  身上，對自己家人的冷淡薄情，到此，Stan 又一次把這個無情無義的特性加到自己的角色

  曲線上。




  到最後階段，如同電影本名所稱的 The Apprentice 本來是川普相當成功的真人秀，

  其實是描述 Roy Cohn 跟川普的關係，川普就是 Roy Cohn 一手帶出來的，川普就是 Roy 的Apprentice，但在 Roy 過世之後，川普對於自己從
  Roy 身上學到的任何東西馬上當作自己發明的成功秘訣，對於以前幫過他的人，只要成為了累贅，他完全不會遲疑的把他們踢出自己的人生，並且收下所有成功的果實，Stan
  到了最後，已經面目全非，電影一開始的青澀無知的富家子弟，現在已經成為在紐約這個都市叢林可怕的掠食者，對家人都不放過的他，已經漸漸看出他將用他的無情技倆吞下世界上最強盛的國家。




  選舉的結果不能更改，我們可以預期世界局勢在接下來的4年會陷入一種不一樣的混亂，

  但這部電影協助我們了解川普的成長過程，以及他的不擇手段，不學無術，偷來的攻擊、

  攻擊再攻擊的策略，對於美國國內政局顯示就是有效，美國人現在需要的就是這樣的一個

  強人，就算是假的強人也沒關係，因為美國是最偉大的國家這件事，必須由這樣厚顏無__

  的人來幫美國人爭面子，這部電影就算是在預期川普不會當選的情形下拍攝，但在出乎預

  料的選舉結果出來後，還是非常具有參考價值，去了解現代進步主義是承受不住非理性支

  持者的攻擊的，世界即將進入新局，但一部電影能讓我們了解背後深植的原因，個人覺得

  是相當值得一看的，不只是 Sebastian Stan 的出色演技，還有自由世界領導者真正的模

  樣。


  --'
