title: '[新聞] <狂人法則>導演稱川普是科學怪人要見面聊'
content: '新聞網址：



  以《邊境奇譚》（Border）與《聖蛛》（Holy Spider）揚名國際的伊朗裔丹麥導演阿里

  阿巴斯（Ali Abbasi），推出最新強片《狂人法則》（The Apprentice）即將在明年1月

  10日在台灣盛大上映。本片以美國總統當選人唐納川普（Donald Trump）早年商場崛起之

  路作為故事主軸，聚焦他與爭議律師羅依科恩（Roy Cohn）的師徒關係。據悉，導演對於

  「怪物的構成」這項主題十分著迷，認為本片不僅是一部關於川普的電影，更是一部呈現

  美國政治體系的作品，他甚至直接將川普比喻為「科學怪人」，描繪他在羅依科恩的指導

  下，如何像是怪物一般地成長。對於自己不是美國人卻拍攝這部電影，他不畏質疑，反而

  認為可以更簡單、擺脫束縛地看待作品，並期許自己能向李安導演的《冰風暴》（The

  Ice Storm）看齊，製作出一部只有外國人才能拍出來的美國電影。尤其本片在坎城影展

  世界首映上獲得極佳口碑，獲得全場八分鐘熱烈掌聲。即使在那之後的正式上映過程，屢

  屢遭受川普團隊的抨擊與打壓，讓他坦言非常瘋狂，甚至喊話：「隨時可以和川普見面聊

  聊！」





  伊朗裔丹麥導演阿里阿巴斯的最新作品《狂人法則》，這次不走以往的奇幻、血腥、批判

  路線，改以細膩刻劃人類多元面向的手法，將川普攀上權利寶座的過程給搬上大銀幕。對

  「怪物的構成」十分著迷的他，認為本片不僅是一部關於川普的電影，更是一部呈現美國

  政治體系的作品，甚至是一個「科學怪人」的故事，描述川普如何像怪物一樣地成長，他

  對此分享：「就我個人而言，這是一部關於美國政治體系的電影，以及一個科學怪人式的

  故事，講述羅依科恩如何按照自己的形象塑造出川普。」



  對於自己不是美國人的身分，他認為可以更簡單且擺脫束縛地看待作品：「最棒的一點是

  ，我不為藍隊效力，也不為紅隊加油，這讓我感到自由！我沒有什麼民主黨的表親，我爸

  爸也不是共和黨人。我沒有被任何東西束縛，因此我可以用更人類學、神話學和戲劇性的

  方式來看待這件事。」他更特別提及國際知名台灣導演「李安」，其描繪1970年代美國精

  神、政治理想幻滅的電影《冰風暴》，期許自己能夠和他一樣，拍出一部只有外國人才能

  拍出的美國電影。





  《狂人法則》在坎城影展大獲好評，沒想到卻在上映過程中屢受川普團隊的抨擊與打壓，

  讓本片一度找不到美國片商願意發行，也讓導演阿里阿巴斯感嘆：「製作並上映這部電影

  ，是我至今做過最具挑戰性的事情。」面對宛如被埋葬的發行困境，他坦言非常瘋狂，並

  進一步說道：「電影敘述的是隨處可以自由取得的資訊，並且經過再三查核，所以我最大

  的問題是『到底哪裡有問題？』」他甚至向川普團隊喊話：「我認為川普不一定會喜歡這

  部電影，但我覺得他會感到驚訝。如果川普團隊有興趣的話，我可以去任何他想見面的地

  方，並在放映後聊一聊！」只可惜他的期盼，最終並沒有獲得川普團隊回應，以至於無法

  成功見面對談。



  這部大膽揭露美國總統當選人唐納川普早期商場生涯瘋狂事蹟的電影《狂人法則》，即將

  在明年1月10日於台灣盛大上映。本片劇情描述1970年代的紐約，年輕的唐納川普（賽巴

  斯汀史坦飾演）為了擺脫房地產大亨父親所帶來的陰影，立志要在曼哈頓房地產業界闖出

  名聲。因緣際會之下，他結識了惡名昭彰、擅長政治操作的爭議性律師羅依科恩（傑瑞米

  史壯飾演）。科恩看中川普的潛力，教導他邁向成功的「狂人法則」——攻擊、否認、永

  遠稱自己勝利。兩人透過欺騙、恐嚇與媒體操控，無所不用其極的瘋狂行事，成功讓川普

  的房地產事業崛起，逐步登上權力寶座…。不過當川普逐漸成為眾所皆知的「狂人」之後

  ，他也為身邊的人帶來出乎意料的影響…。



  欲知本片最新消息，

