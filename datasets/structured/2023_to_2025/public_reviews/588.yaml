url: https://www.ptt.cc/bbs/movie/M.1736913870.A.CCA.html
title: '[普雷] 【狂人法則】教出了一頭狂妄巨獸'
content: '‧


  電視劇新三國裡的荀彧這樣評價過曹操


  「我家主公知錯改錯，下次也不會犯同樣的錯，但他絕對不認錯。」


  同樣的思維出現在這部【狂人法則】中，只是他不像曹操一樣的蓋飯，而是蓋起了大樓；

  他是川普家族的次子、新任也是前任的美國總統、寧可我負天下人的「唐納川普」。



  ‧


  英文片名The Apprentice (學徒），更加表達揭露出川普如何從險惡的商業政治環境中，

  一路學習成為一代狂人；當然學習必須有個導師，川普在1970年代認識了羅依柯恩，這位

  謊言、威嚇、權謀、熱愛權力、煽動恐慌等集於一身的律師及權謀者。


  川普政治商業的起源，皆來自於這位政治右派的羅依柯恩，這名角色由Jeremy Strong的

  出色演出，與飾演川普的Sebastian Stan，有著極為精彩的對手戲及化學效應，其以面無

  表情的冷酷、充滿冷靜的處事邏輯詮釋，表現上完全不輸給新科金球影帝的Sebastian；

  而Sebastian對於川普的人設詮釋及模仿，也沒有刻意的去做出任何受爭議的演出，而是

  將一位在商場上還不算個超級大咖的年輕川普，將逐漸成魔、成狂人後，那種自我、唯利

  是圖、貪婪、歧視的心境，幾近完美的詮釋在劇情之中，【狂人法則】目前的評價普遍中

  等良好下，能夠說完全歸功兩位演員的精湛演出，挽救了平淡敘事的劇本。


  而全片的色調有如VHS復古的顆粒濾鏡，加深了對當年時代的詮釋感，劇中多段配樂刻意

  加大音量，也凸顯川普與羅依的狂傲往事。



  ‧


  羅依柯恩如何教出一頭巨獸？我想羅依與川普在互相的身上看到過去及未來的自己，與其

  說學習及教導，更準確的應該是互相利用，類似戰國時代呂不韋與贏異人、贏政關係，做

  為一位幕後謀士、陰暗的黑手，羅依除了欣賞川普特質之外，他更想招攬川普成為手中控

  制的棋子，以便他更可以達成他想要的社經地位、商業及政治上目的的達成。


  「與怪物戰鬥之人，應當小心自己不要成為怪物、當你凝視深淵，深淵也凝視著你。」


  尼采曾這樣說過。


  電影中的川普對於羅依這頭影響力不小的怪物，的確是含有敬佩又懼怕的心，但川普知道

  這是他唯一能在這商業及政治詭譎時代裡，能夠生存下去的法則，所以學習、抵抗及利用

  ，這是川普對於這個深淵巨獸，能夠學習的是，羅依對於事件的合法非法處理方式、能夠

  利用的是吸收羅依廣闊人脈，而最後抵抗的是他不會成為像羅依那樣的人，甚至他心中對

  羅依充滿歧視，所以他必須更青出於藍；最後事實上他做到了，當川普爬到那樣的高度時

  ，羅依已經不如以往，川普擁有更勝於羅依個人的律師團隊，社經人脈、財富累積都已達

  到高峰，此時已經無須羅依這個曾經導師的存在了，唯有最後那通電話，才展露出川普那

  所剩不多的良知。



  ‧


  川普真的是十足的混蛋嗎？


  是的沒錯，他的確在某種程度上真是個混蛋，但更可以說與其是狂人法則，不如說是川普

  式的生存法則，當貪婪佔據內心之時，心中只會持續吶喊著「 I want more ！」


  寧可我負天下人、不可天下人負我的川普，他不斷使自己更強大，無論是可怕的抽脂、縮

  頭皮手術，或是使他更光鮮亮麗的手段，都無一不去嘗試，為的就是更加完美的行銷自我

  。


  讓美國再度偉大？我想川普心中只是想「讓川普再度或持續的偉大。」


  這就是一代狂人的生存法則。



  ‧


  「觀影的樂趣在於能獨自在那裡冥想一刻鐘」






  --'
