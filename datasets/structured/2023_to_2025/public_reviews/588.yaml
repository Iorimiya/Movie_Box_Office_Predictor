url: https://www.ptt.cc/bbs/movie/M.1736322765.A.3FD.html
title: '[新聞] 傑瑞米史壯【狂人法則】化身川普恩師獲獎'
content: '新聞網址：



  直擊美國總統當選人唐納川普（Donald Trump）早期商場生涯，聚焦他與律師羅依科恩（

  Roy Cohn）師徒關係的最新強片《狂人法則》（The Apprentice），即將在本週五（1/10

  ）於台灣盛大上映。將川普培育成「狂人」的羅依科恩，由曾憑藉《繼承之戰》（

  Succession）勇奪金球獎肯定的傑瑞米史壯（Jeremy Strong）擔綱。他在最初收到演出

  邀約時，曾相當猶豫甚至一度打算婉拒，但在和丹麥名導好友托比亞斯林道赫姆（

  Tobias Lindholm）聊過之後便回心轉意、點頭接演。為了將人物內化，他大量閱讀羅依

  的傳記、檔案與訪談，甚至在他的戲份還沒開拍時，便穿著戲服溜進片場觀摩。由於他不

  喜歡排練，因此與飾演川普的賽巴斯汀史坦（Sebastian Stan）幾乎沒有事前練習，更在

  現場有大量即興表演，精湛的演技也讓他陸續獲得佛羅里達影評人協會「最佳男配角獎」

  肯定，也陸續獲得各大影評人協會的提名，值得影迷進戲院一探究竟！





  描繪川普如何在律師羅依科恩的教導下，打造出房地產帝國的電影《狂人法則》，請到「

  金球獎視帝」傑瑞米史壯，演繹這位惡名昭彰的爭議性律師，犀利演出更讓他再度問鼎金

  球獎！據悉，他最初收到本片邀約時，曾考慮要探索的內容黑暗與準備時間較短，讓他十

  分猶豫更一度打算婉拒，他對此表示：「我當時不確定自己能不能做到，我沒有很多時間

  ，加入得也晚，而且我知道自己必須準備得非常充分。」話雖如此，但等他和丹麥名導好

  友托比亞斯林道赫姆聊過後回心轉意，他對此回憶：「我當時並不知道自己能否做到，讓

  這部作品紅起來，但我後來和托比亞斯林道赫姆一起吃晚餐時，他問我『如果你不害怕，

  你會怎麼做？』於是我便決定答應演出。」



  為了內化並詮釋這個角色，他希望能夠盡可能理解羅依科恩，而大量閱讀他的自傳、書籍

  ，以及相關的檔案資料與訪談影片，他表示：「我的工作是全面、深入地學習和理解這個

  人，從多面向的角度來看待，然後只需要走進片場，自然地表現出來，不用刻意去想什麼

  。」他甚至還在自己的戲份開拍前，穿上戲服溜進片場觀摩，可說是為角色做了萬全準備

  ！





  由於傑瑞米史壯坦言自己不太喜歡排練，因此在演出《狂人法則》時，他與飾演川普的賽

  巴斯汀史坦也沒有太多的事前練習，而導演阿里阿巴斯（Ali Abbasi）也給予演員們很大

  的發揮空間，在片場時常不喊卡，進而看看兩人的即興演出能夠發展到什麼程度，傑瑞米

  史壯對此表示：「導演給了我們很大的自由空間能夠即興發揮，讓我有一種對我們所創作

  的內容擁有自主權的感覺。我對這些事情的處理方式，不僅僅是學會劇本上的台詞，而是

  試圖準備角色的整個人生，然後現場表達出那個人的人生。」而這些即興演出，也都是他

  根據羅依科恩常用的詞彙與留下的紀錄來表演，種種細節都讓角色充滿層次與真實感，是

  值得觀眾進戲院親眼欣賞的好演技！



  這部大膽揭露美國總統當選人唐納川普早期商場生涯瘋狂事蹟的電影《狂人法則》，即將

  在本週五（1/10）於台灣盛大上映。本片劇情描述1970年代的紐約，年輕的唐納川普（賽

  巴斯汀史坦飾演）為了擺脫房地產大亨父親所帶來的陰影，立志要在曼哈頓房地產業界闖

  出名聲。因緣際會之下，他結識了惡名昭彰、擅長政治操作的爭議性律師羅依科恩（傑瑞

  米史壯飾演）。科恩看中川普的潛力，教導他邁向成功的「狂人法則」——攻擊、否認、

  永遠稱自己勝利。兩人透過欺騙、恐嚇與媒體操控，無所不用其極的瘋狂行事，成功讓川

  普的房地產事業崛起，逐步登上權力寶座…。不過當川普逐漸成為眾所皆知的「狂人」之

  後，他也為身邊的人帶來出乎意料的影響…。



