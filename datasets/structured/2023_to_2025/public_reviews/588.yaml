title: '[好雷] 以記者角度記事的傳記《狂人法則》'
content: '雷文防雷資訊頁



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  1.影片名稱 : 狂人法則

  2.觀影時間 : 1/10

  3.觀影地點 : 國賓戲院

  4.觀影方式 : 自行購票





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  此區為發文防雷頁 可選擇性提供上列 1~4 資訊 或不提供亦可 觀影心得於分隔線下方發

  布即可




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  一開始朋友揪我陪他去看這部電影時，


  只跟我簡單介紹說是描寫美國政治人物川普的生平故事，


  原以為是那種政治上常見的操作，


  藉由出資拍攝電影來替自己平反、說好話之類的，


  但是實際看完電影之後，卻有種：WOW～好不掩飾阿！的感覺。



  電影一開始的人設呈現其實還挺稀鬆平常的，


  描寫一個家道中落的富二代，終於受邀加入一個社會上流階層匯聚的俱樂部，


  這個年輕小伙子熱衷於觀察這些＂成功人士＂的特質，


  於是他也逐步地從觀察、學習、模仿……最後讓自己也成功驥身於名流的行列中。



  其實對於想要獲取＂人生成功＂的人來說，


  這作法是毫無疑問的直接且有效，


  且作為主人翁的年輕川普，也是充分地利用了他個人的魅力，


  同時他對於時機的掌握、並懂得找對的敲磚人，


  再加上他自身對於成功的積極性，


  與現今川普對外的言行互相對照之下，確實也符合其人格特質。



  只是在這個追求成功的過程中間，


  也摻雜了一些較令當今社會大眾產生爭議的事件，


  例如：恐嚇、用藥過度、強暴、恐同以及一些明顯具歧視性的言論，


  這些在以往的紀傳性電影中，通常都會對當事人鞭小力些……


  但在這部片中，只能說是毫無修飾的呈現給觀眾！




  對於這部電影竟然會用如此不客氣的敘事角度，


  我也感到相當訝異，查了查網路上的相關討論，


  才發現這部片原來編劇本身就是記者出身，


  也難怪片中對於川普這些較為負面的形象與事件的敘述，是這麼的直接與粗暴！


  這一點就連在預告片當中也可以略窺一二，


  在快節奏的畫面剪輯之下，直搗影片核心、絲毫不拖泥帶水。



  更有趣的新聞是這部片初期的製作經費，


  雖然得到了川普的摯友施奈德的贊助，


  但是當施奈德看過電影初剪版後卻相當生氣，


  其所屬的製片公司的律師團隊甚至尋求途徑阻止電影的發行；


  這也是電影介紹與預告上提到，電影上映過程曾遭受打壓的來源之一。




  不過就以藝術的角度來看待這件事情，


  電影本身就允許有多元的角度來敘述人/事件，


  特別是傳記類型的電影，更應該像史書記載那樣客觀記事、以事論人，


  雖然掌鏡執筆的終究是人，難免會摻雜一部份非理性的解讀在其中，


  我們畢竟不在當下、並非當事人，很難評判導演與編劇是否趨近客觀，


  但是就這樣的一個以記者追蹤敘事角度來說，


  我覺得也算是一個蠻不錯的觀察切入點。



  而且在一些對於人性的刻劃上，


  我覺得這部電影給我的感覺是真實、不加掩飾的，


  有些對話以及對事件看法的表達上，雖然用字露骨、行動駭然，


  卻更貼近我們生活中會與親密的親友知己相處時會有的言行反應，


  或是每當自己遇到爛事時，當下會有的情緒激動與衝突表現，


  這也是為什麼這部片會讓人看完後有種＂混亂、但是又相當合乎邏輯＂的感覺；


  真的是過於寫實了。




  --'
