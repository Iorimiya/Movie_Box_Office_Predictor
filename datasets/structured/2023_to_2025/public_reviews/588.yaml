url: https://www.ptt.cc/bbs/movie/M.1736444311.A.117.html
title: '[普雷]《狂人法則》總統不願面對的真相？'
content: '曾經好傻好天真，如今名師出高徒


  美國第60屆總統大選在2024年結束，前總統唐納川普攜著「讓美國再次偉大」的理念，再

  度度捲土重來，坐上總統大位。而這次不如與希拉蕊對戰那次，有許多人對於川普的當選

  已經不意外、不吃驚。


  這次川普在競選時仍有許多爭議事項，例如他涉及的四起刑事案件，甚至是美國歷史上第

  一位被兩度被國會發起彈劾的總統，但川普依舊我行我素，甚至有著自己的行事步調？雖

  然我們知道川普是美國相當成功的地產發展商，但究竟川普的做事態度與如今的性格是怎

  麼養成的，也許這部電影可以給你一些答案。


  《狂人法則》是以唐納川普經商時的機遇、成長為主軸的傳記電影，由三國合資拍攝，在

  拍攝期間因為涉及美國總統競選人而備受爭議，尤其是川普的陣營。電影故事講述唐納川

  普準備接手父親在紐約的房地事業，但闖蕩不順，最後在俱樂部裡結識了啟發他的律師導

  師－羅伊科恩，川普也從羅伊身上學到了如何遊走美國法政商的各種手段。





  《狂人法則》是什麼電影：

  民主國家的選局令人緊張，畢竟不像「沒有、沒有、通過！」那樣絕對，由各州各地一票

  票開出結果，總是有不少網路與電視直播狀況，結果總是幾家歡樂幾家愁，甚至會有人集

  結抗議不公、並無法接受這樣投票結果的狀況。


  在台灣的選舉因為國土較小，是由各地方投票所公開公正的開票，最後匯集出結果。雖然

  台灣從日治時期、國民政府來台、甚至戒嚴時都有投票選舉，但都屬於有資格的人參與的

  投票，並未全民參與。直到1996年，台灣首次舉行全民直選總統，才象徵台灣選舉制度的

  完全民主化。


  同樣以民主制度為主的美國，雖然與台灣同樣都是民主國家，但在總統大選的投票方式卻

  有很大的不同。台灣是直接民選，採取國民一人一票，候選人獲得相對多數的票就可當選

  ，整體運作較為單純。但美國的投票採間接選舉制度，由選民在各州投票選出選舉人代表

  團，再由代表團選出總同，選舉人等同於國會議員538人，候選人需要贏得過半的選舉人

  票數才能當選，並且存在贏者全拿的制度，故獲得較多選票的總總統候選人會贏得該地方

  全部的選舉人票，這也讓開票結果變得更加捉摸不定。







  在這次美國第60屆總統大選中，由地產大亨唐納川普再次取得總統之位，而也成為少數從

  過去經商、候選人、總統之位等，具備爭議和話題性的美國總統。並在此時以川普傳記為

  主題《狂人法則》電影出現，讓電影還未開撥就引起網路的討論，甚至在撥出後有所爭議

  。


  《狂人法則》並不以川普作為總統的近況為主軸，而是聚焦在川普年輕時候房地產事業時

  的故事為主軸，描繪他與幫助和教導他的律師羅伊科恩之間的故事，也因為電影許多情節

  描繪入骨，故在還未撥出就備受爭議，最終以無法廣告的方式在美國上映。


  《狂人法則》從1973 年，開始說起川普家族因為對非裔美國租戶的種族歧視，而受聯邦

  政府的調查，並且有很大的機率會陷入敗訴危機。年輕的唐納川普前往會員制的高級餐廳

  用餐，遇見了那位人稱無敗，且具爭議的律師羅伊科恩。羅伊科恩感受到川普投射出來熱

  烈的視線，有償的幫助川普，並教導他美國政商大人們的「做事規矩」，並要他銘記三條

  法則，這也成為川普往後在美國政商遊走的鐵則。









  《狂人法則》分析與延伸：


  這部川普的傳記電影出現受到許多人的討論，討論與回擊最熱烈的當然川普周遭的親友，

  前NFL球隊華盛頓指揮官－施奈德知道要開拍川普的電影曾大力贊助製作金費，但是有媒

  體指出他再看過初剪時非常氣憤，並且動用律師團試圖阻止電影上映。


  川普的競選團隊也在選舉期間對電影發起法律行動，例如發律師函向劇組發出停止、終止

  的警告，並也同樣阻止電影營利和任何形式的出版。而多個電影評論網站給了這電影普普

  通通的評價和分數。


  對於川普周遭許多人士的抗議，電影製片團隊公開表示《狂人法則》是一部對前總統的公

  正、平衡的描繪。並且希望觀眾看完後再做出評價，不要未審先判，電影中許多關於川普

  的敘述都有所文獻根據，例如川普與他第一任妻子之間的各種狀況，就來於他們的離婚證

  詞，還有川普的手術等。也有許多電影的商業行為片段式源於川普本人出版過的商業書籍

  《交易的藝術》、自傳書籍《川普自述：永不放棄》等。








  電影中主要角色，除了主角川普和他的第一任妻子伊萬娜外，貫穿整部電影的律師羅伊科

  恩，可說是過去一直引導川普的導師和私人律師，但同時羅伊科恩也是一名在當時聲名狼

  藉，頗具爭議性的律師。其中讓他最為知名的是「羅森堡夫婦案」，這是一件在美蘇冷戰

  時期，羅森堡夫婦被指控為蘇聯間諜，並是唯一判決以電椅死刑的案件，在美國至今認為

  當時的判決相當有爭議。其中羅伊當時是作為主要檢察官，扮演推動定罪與死刑判決的關

  鍵角色，故受到爭議。但這也符合電影中羅伊跟川普表示「一切都是為了美國」的形象。


  在電影中有一些很有趣的細節，都是在川普與羅伊之間的接觸之中，例如羅伊的派對中的

  來賓就有帶到不少藝術界的人士，並讓人理解到與後續羅伊的後半生有相關，這之中川普

  也是被受影響的人士之一。


  也因為川普與羅伊的關係其實匪淺，包含私人律師，多次代表川普出庭，並且幫助川普完

  成許多建設和要求。電影中也展現出川普和羅伊之間複雜且矛盾的關係，並在公開場合反

  反覆覆與遠近感的拿捏，也讓兩人之間的師徒關係，在觀眾眼前更有意思。









  《狂人法則》值得一看嗎：


  這部電影是難得以具有爭議性和討論度的美國總統川普，從外人較為不熟悉的角度去詮釋

  川普過去年輕時經商、學習、與混跡美國政壇、商業社會的過程。整體而言導演與演員在

  電影節奏和川普的神韻上還是抓得滿穩的，也沒有像《大賣空》或《華爾街之狼》等有較

  多專有名詞和專業術語的呈現，這也讓整部電影可以很順的了解故事，並且試圖以另一個

  面向去看待川普這個現今總統外，較為私人的一面。但其實電影有某些部分不知是故意或

  無意間的忽略。


  在《狂人法則》電影中的確呈現出，川普透過律師羅伊去理解當時美國商業之間與政壇那

  些不可告人的地方，並且也呈現出年輕的川普從開始的不解，到似乎可以領會其中，並且

  試圖掌控全局。


  但電影中缺少著「關鍵性的片段」，也是說雖然可以看到川普前後作風上的轉變，但是電

  影卻沒有呈現出轉變的關鍵時刻，這點在一個期待為何川普開始變成強硬、並且有心機盤

  算、甚至跟老婆關係惡化等有所交代的觀眾來說，有些虎頭蛇尾的成份在。反而在律師羅

  伊的心理呈現轉變上雖然可預料，但至少是完整的。






  雖然不知電影為何沒有呈現出川普轉變關鍵時刻，但整題而言我們可以從電影中大概了解

  到，川普的某些行為和言行為何會是那樣。說起來我並不覺得這是一部在中傷川普的電影

  ，反而比較讓人很理解他的行徑，甚至知道為何川普要這樣表演與呈現在媒體面前，預計

  到何種效果。


  當然電影中有許多誇張與誇大的部分，要如何辨別和相信與不相信，這個只能留給觀眾自

  己去詮釋，我自己是純粹當成一部可以作為參考川普往後言行舉止的參考，並且對於電影

  的演示持保留態度。


  而就在現役美國總統都可以被拍成電影的同時，也難免在想台灣是否也能拍出以當代政治

  為主題的人物電影，而非只是拍攝日治時代或過去政治人物？但在如今台灣局勢混亂，且

  又礙於中國對台灣始終有所目的，也許短期間拍攝出如《狂人法則》這樣的電影是不太可

  能。雖有爭議《狂人法則》還是在2024年的10月上映，以結果來說，電影內容似乎並不是

  左右結果的重要環節，或許觀眾還是理解電影、紀錄片的載體終究是一種對議題的娛樂性

  和主觀性的詮釋，而真正要做出選擇的，還是那難解的現實。




  --

  個人Blog：

