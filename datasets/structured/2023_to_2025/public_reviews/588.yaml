title: '[雷] 狂人法則 簡短心得 看看川普2.0'
content: '原本看完覺得還好

  但看到現在川普2.0的種種表現

  尤其是應對烏克蘭與俄羅斯上

  以及近期的美俄談判

  足足展現了他那十足狂妄自戀的性格


  就讓我想到這部

  川普遇到羅伊柯恩這個律師後

  開始變成了不折不扣的西斯大君

  還反過來對導師倒打一把 忘恩負義

  對官司以及妻子 父親

  越來越自我中心主義


  為了勝利不擇手段

  死不認錯

  否定一切


  這在第一任跟現在川普2.0都看得到

  就說現在

  看看川普

  面對持續不斷的通膨與物價上漲

  面對各種空難與墜機

  面對烏俄戰爭


  不是怪拜登 怪dei就是怪歐洲

  永遠不會承擔責任


  Jeremy Strong跟冬兵的演技確實可圈可點

  陰險狡詐的卑鄙軍師

  以及川普本人都詮釋的很好

  尤其是Sebastian Stan

  舉手投足就算沒有100分也有80分像川普



  發這篇純粹是

  從罵台積電 到 美俄會談出賣烏克蘭

  種種不滿才發的

  請見諒沒有太多的電影點


  --



  他擦了什麼？跟普丁下跪？

  我有 你羨慕嗎

  他破壞民主

  換一下

  「他要跟習近平合作有助美國利益

  把美國在台積電 / 台灣的損失補回來」'
