url: https://www.ptt.cc/bbs/movie/M.1736486383.A.8AE.html
title: '[普好雷]《狂人法則》，唐納川普的殺手天賦與本'
content: '部落格版：


  2024年年底美國總統選舉中，本該由時任總統、民主黨參選人喬拜登對上再度參選的前總

  統、共和黨參選人唐納川普，但後續因為包含健康在內等因素，拜登中途宣布退選，改由

  副總統賀錦麗接棒迎戰。本來外界普遍從各項數據與戰況分析，認為賀錦麗將有可能成為

  美國史上首位女性總統，沒想到卻因接受媒體採訪時的失言，讓局勢逐漸轉向川普陣營，

  最後在無法挽回頹勢的情況下敗給對方，讓川普不僅再度重返白宮，成為格羅弗克里夫蘭

  後第二位二度當選且任期不連續的總統，同時替民主黨寫下難堪新頁，賀錦麗成了自2004

  年後首位輸掉普選票的民主黨候選人外，本屆選舉也是民主黨自1988年選舉後最差一次。


  唐納川普的當選或許對於台灣人而言，除了是關心他將會如何看待與對待兩岸情勢之外，

  更多的是好奇川普在未來四年會有再多少的驚人言行，畢竟曾經在聽聞梅莉史翠普於頒獎

  典禮上諷刺他後，便直指對方是最被過譽的好萊塢女演員，更是當時對手希拉蕊的走狗。

  從不怕引發爭議的川普自然不在乎自己是別人眼中的笑話，只是當他看到自己的過去被拍

  成了電影，可能就真的笑不出來了。


  由出生伊朗的瑞典導演阿里阿巴斯所執導的《狂人法則》，將故事背景選在1970年代至

  1980年代的紐約，把鏡頭聚焦在年輕時的唐納川普身上，看當時還「只是」房地產大亨傑

  瑞德川普次子的他，如何擺脫因遭政府控告導致事業岌岌可危的父親、從一個毫無實績卻

  野心勃勃的菜鳥，成長到事業版圖擴展到能夠撼動整個紐約房地產業界的大人物，從肯向

  他人低頭求教的青澀稚嫩，變成桀驁不羈又盛氣凌人的狂人川普，《狂人法則》宛如一部

  即使你無法認同其為人，但依然沒辦法否認他就是一位事業成功人士的名人傳記。



  不過看在川普本人自己的眼裡，卻對劇情中對於他的形象描寫與某些他始終不願承認的私

  事感到不滿。導演阿里阿巴斯不僅將根據川普與首任妻子、名媛伊凡娜的離婚紀錄中的證

  詞提到的、川普曾經強暴伊凡娜的場景搬上銀幕，也於電影中直指川普靠整形手術解決脫

  髮問題、濫用藥物減肥，甚至影射他因此性方面力不從心，最後尋求建議進行抽指手術，

  如此影響形象的過往生活描寫，想當然的被即將上任的川普給否認。


  《狂人法則》充滿著娛樂性，電影就像是另一部的《華爾街之狼》，既看1970年代紐約的

  紙醉金迷，也看政治角力與權力鬥爭，看誰高處跌落而有誰趁勢上位，看那些功成名就背

  後要付出何種代價，而這也是《狂人法則》最為有趣的地方。前面提到的，川普方面矢口

  否認電影中對他的描寫，其團隊更尋求法律途徑要讓《狂人法則》停止所有營銷、發行與

  出版，如此大動作卻只顯得欲蓋彌彰。然而實際上，導演阿里阿巴斯不論在其所掌握的事

  實中有多少杜撰，這部作品的重點依然還是在於要讓觀眾知道「川普是如何成為現在的川

  普」的。


  年輕時的川普有野心，有想實現的願景，他不像他那疑因不堪家族事業壓力而改行當起機

  師的哥哥，川普跟在父親身旁學習，努力的想要表現自己就是為了有天繼承川普集團。無

  奈現實是他還只能做些收房租的雜事，加上父親與政府的關係緊張、紐約前景不被看好等

  等，讓川普可以說是有志難伸。直到某日因緣際會下，他意外結識了惡名昭彰且備受爭議

  的律師羅依科恩，過去曾多次身陷險境卻總能全身而退，擅長操弄政治與玩弄權力的科恩

  ，不僅出手協助川普父親打贏官司，更看中川普的潛能傳授他的致勝三招，「對敵人毫不

  留情攻擊」、「遇到指控全盤否認」、「永遠必須堅稱自己勝利」。



  兩人聯手開始撼動整個紐約，川普在科恩的協助與指導下，很快成為房地產業一顆不可忽

  視的超新星。科恩對川普可以說是傾囊相授，而川普也是青出於藍更勝於藍，將其所學發

  揮的淋漓盡致，檯面下是無所不用其極，檯面上是版圖日益擴大，可以說川普的成功一半

  是靠他自己，一半則是靠羅依柯恩。只是我想連科恩都沒有想到的是，他一手栽培出來、

  當時對他畢恭畢敬到連與伊凡娜簽結婚協議都聽從他指示的川普，最後會成長為連他都再

  也控制不住的瘋狂人物，或許正確的說法是、科恩激活潛藏在川普體內的殺手基因，並步

  步開發出他的本能，這結果是讓川普變成只懂利用他人、無價值後就推開甚至解決的無情

  殺手，包括父親傑瑞德、妻子伊凡娜還有科恩自己。


  《狂人法則》可謂是唐納川普的養成日記，當多數觀眾認識川普早已是美國總統時，導演

  阿里阿巴斯選擇把年輕時的川普帶到觀眾面前，重提這段對他帶來深遠影響的經歷，儘管

  電影少了相當明確的轉折點，少了一個讓觀眾感受到川普「確實變了」、變成了另個羅依

  柯恩甚至超越羅依柯恩的關鍵點，然觀眾還是因為有了羅依柯恩這個角色，而知道川普是

  如何走到今日這一步的。真要說起來，比起後來觀眾都知道的川普從房地產業轉往從政甚

  至當選美國總統，或者是與伊凡娜離婚後的花邊新聞等等，這段過去某方面來看確實是川

  普最值得被拍成電影的部分。


  《狂人法則》對我自己而言，前半段的精彩程度比後半段高出不少，這時候的川普相對陌

  生因此也相對有趣，加上川普與科恩、伊凡娜彼此的關係，三人無論怎麼組合都充滿火花

  ，雖說是科恩栽培了川普、是伊凡娜讓川普嚐到愛情滋味，但反過來說卻也是川普成就了

  他與她，而三人後來從合作、相愛到背叛、相恨，激烈且熾熱的關係變化也很有意思。而

  後半段時科恩與伊凡娜的戲份大幅減少，這時的川普也已是觀眾熟悉的川普，基本與現在

  無異的言行與表現，看著川普獨秀是少了些激情與驚喜。不過整體來說，《狂人法則》還

  是值得一看，不論是看川普爭議性的成長過程，或者是賽巴斯汀史坦、傑瑞米史壯與瑪麗

  亞巴卡洛娃三人的詮釋與表演，都能從中獲得樂趣與滿足。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --

  抱歉已更正'
