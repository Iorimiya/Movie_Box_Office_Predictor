url: https://www.ptt.cc/bbs/movie/M.1653808487.A.836.html
title: 'Re: [情報] 乳華恐怖電影《小熊維尼：血與蜜》'
content: '其實這才是正常的操作，一定時限後進入公有領域，


  開放大家創作，讓作品得到最大的發揮，


  而不用受版權製肘。



  保護公有領域成為保護社會公眾的文化權利。


  《世界人權宣言》第27條第1款規定：「人人有權自由參加社會的文化生活，


  享受藝術，並分享科學進步及其產生的福利」。



  我們都是站在巨人的肩膀才能看得更遠。


  今天我們能自由改編格林童話、安徒生故事、天方夜談、西遊記等著作，


  也是得利於這個作品進入公有領域的關係。



  所以我非常的瞧不起某個打著創作自由，


  說是追求公平正義、政治正確，


  結果把白雪公主、美人魚給黑化，


  說這是創作自由，可以自由改編。


  自己為保護自身利益，一再遊說政府，


  延長作品進入公有領域時限的某公司。


  也導致美國至1998年至2018年間都沒有作品進入公有領域。


  大部分國家是70~75年，只有墨西哥最長是作者身後的100年。


  只有美國是1927年前的作品全屬公有領域，1927年的作品全是95年。



  真的是"米能你不能"




  --'
