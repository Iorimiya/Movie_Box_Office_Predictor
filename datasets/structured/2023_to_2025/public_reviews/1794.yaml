title: '[情報] 小熊維尼：血與蜜2'
content: 'Winnie The Pooh Blood & Honey 2


  《小熊維尼：血與蜜2》首張海報




  在《小熊維尼 2：血與蜜》中，

  小熊維尼、小豬皮傑、貓頭鷹和跳跳虎

  尋求向克里斯多福羅賓報仇......


  本片預算：100 萬美元




  疑似是電影預告


  資料來源：X


  《小熊維尼：血與蜜 2》是一部即將上映的英國獨立恐怖電影，由里斯佛雷克-沃特菲爾

  德共同編劇和導演，並與史考特傑弗瑞共同擔任製片人。


  這是 2023 年恐怖電影《小熊維尼：血與蜜》的續集，是 A. A. Milne 和 E. H. Shepar

  d 的《小熊維尼》書籍的恐怖重新想像。


  該片由史考特錢伯斯、瑞安奧利瓦、艾迪麥肯齊、路易斯桑特、馬庫斯馬西和西蒙卡洛主

  演。



  --

  有啊'
