title: '[普無雷] 《小熊維尼：血與蜜》 習禁評的電影'
content: '《小熊維尼：血與蜜》


  惡搞迪士尼小熊維尼的驚悚片


  由於對岸領導人的長相與維尼太過相似


  導致小熊維尼的圖像以及衍生的創作


  在對岸的網路顯得非常敏感


  一不小心就可能觸犯辱華的底線


  大陸豆瓣電影雖然有上架本片資訊


  卻關閉評論的功能


  完全無法在頁面留下隻字片語


  嚴禁評論


  不愧是「習禁評」


  還好我們生在有言論自由的臺灣


  可以評論，全文無雷：









  --'
