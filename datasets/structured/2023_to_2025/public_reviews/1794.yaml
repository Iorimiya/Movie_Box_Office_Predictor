url: https://www.ptt.cc/bbs/movie/M.1679371022.A.822.html
title: '[新聞] 《小熊維尼：血與蜜》香港疑被禁上映 包場活動取消、預售連'
content: '新聞網址：


  由英國導演里斯．弗雷克沃特菲爾德製作的恐怖電影《小熊維尼：血與蜜》，擬於本周四

  （23日）在港上映，惟有放映活動搞手表示，原安排在周二晚舉行的《小熊維尼》包場活

  動，基於「技術原因」要取消。而原本已預售的戲院，也停止了發售該片的戲票。《獨媒

  》正向發行商及電檢處查詢事件。


  在電影資訊平台WMOOV，雖仍能搜尋到電影資料，但只有新光數碼戲院有23日至29日的放

  映場次。《獨媒》記者今早11時03分進入戲院網站，成功購得兩張戲飛。惟在早上11時08

  分再次進入網站，電影場次資訊及購票連結已經消失。


  Instagram帳號「電影療傷誌」原定在周二（21日）舉行包場活動，放映周四才正式上畫

  的《小熊維尼：血與蜜》。惟在周一（20日）晚上，「電影療傷誌」宣佈包場「被取消」

  ，指是基於「技術原因」。帖文最初提到，「相信大家都明白身於現今的香港，的確很多

  事情是不可抗力的」、「「痛心是除了再次見證有其他原因凌駕於電影之上」，惟事後刪

  走上述句子。


  據電影發行商VII Pillars Entertainment的公開資料，《小熊維尼：血與蜜》原定於本

  周四（23日），在全港超過30間戲院上映。不過在各大戲院售票網站，至今未見有《小熊

  維尼》的放映場次和售票資訊，較早前推出「搶先預售場次」的Cinema City 朗豪坊，售

  票連結已經無效。


  電影曾在上周一（13日）於嘉禾海運戲院上映，據VII Pillars Entertainment的社交帖

  文，該次放映全院爆滿。


  《小熊維尼：血與蜜》由身兼導演監製及編劇的里斯．弗雷克沃特菲爾德（Rhys

  Frake-Waterfield）製作，只用十日就拍完，屬超低成本B級片，完全顛覆維尼在童話中

  可愛的形象。電影講述小熊維尼的人類好友羅賓上大學後，維尼及小豬感覺被遺棄，逐漸

  不再相信人類，回復動物本性，並變成嗜血的殺人魔。電影在 IMDb網站被選為「2023 年

  最期待的電影」第二名，現正在全球超過30個國家上映。




  --'
