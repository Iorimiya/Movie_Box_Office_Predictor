url: https://www.ptt.cc/bbs/movie/M.1669609865.A.16E.html
title: '[新聞] 小熊維尼：血與蜜團隊要將「小鹿斑比」..'
content: "新聞網址：\n\n《小熊維尼：血與蜜》團隊要將「小鹿斑比」變身為殺戮機器\n\n導演瑞斯華特菲德 (Rhys Waterfield) 執導的《小熊維尼：血與蜜》，\n\
  \n預告甫上線就引爆社群討論，因為他將那些童年記憶中呆萌的維尼和夥伴們，\n\n都變成嗜血的惡魔。\n\n電影僅用 10 天拍攝，完成速度之快的瑞斯華特菲德，\n\
  \n當然也不會放過其他荼毒美好童年的機會，\n\n\n\n另一方面，擔任的斯科特傑佛瑞也準備大顯身手，\n\n他\n\n這部了《小鹿斑比》殺戮版本，製作公司為\
  \ ITN 影業與 Jagged Edge，\n\n而瑞斯華特菲德也會擔任製作，斯科特傑佛瑞表示：\n\n 「電影將把我們熟知的 1928 年故事改編成極其黑暗的版本，\n\
  \n靈感來自 Netlflix 的《林祭》(The Ritual) ，\n\n\n\n而為何《小鹿斑比》被團隊們盯上？\n\n那是因為根據美國版權法，作品問世後的\
  \ 95 年即進入公有領域，\n\n這份作品就可以供所有人自由閱覽、複製、二次創作與傳播。\n\n因此 1926 年由  A.A. Milne 撰寫的《小熊維尼》及\
  \ Felix Salten 執筆的\n\n《小鹿斑比：森林中的生活》都成了公用智慧財產。\n\n但要注意的是，迪士尼購入小說版權，且在 1942 年推出動畫，\n\
  \n因此\n\n回顧《小鹿斑比》的劇情，雖然是闔家觀賞的迪士尼動畫，\n\n但斑比的成長過程並非一帆風順，特別是，斑比的母親因為獵人而逝去。\n\n獵人對森林動物的肆意獵殺，讓牠們的生存飽受威脅，\n\
  \n\n\n斯科特傑佛瑞執導的電影名稱暫定為：《Bambi：The Reckoning》，\n\n劇情將聚焦於斑比親人被殺後的轉變，\n\n斑比並沒有與森林動物成為知心好友，並沒有遇上夢中情人，\n\
  \n\n\n導演參考的《林祭》，劇情圍繞在四個大男人身上，\n\n他們因朋友之死希望來一趟「緬懷之旅」，卻不幸誤入危機四伏的森林，\n\n甚至遇上未知的怪物…。\n\
  \n---\n\n繼小熊維尼外  製作團隊魔掌將伸向小飛俠以及小鹿斑比..\n\n--"
