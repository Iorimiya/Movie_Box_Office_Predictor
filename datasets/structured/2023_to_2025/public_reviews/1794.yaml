url: https://www.ptt.cc/bbs/movie/M.1710354831.A.286.html
title: '[新聞] 《小熊維尼：血與蜜》橫掃2024金酸莓獎'
content: '《小熊維尼：血與蜜》橫掃2024金酸莓獎！導演不走心：我們總成本比漫威電影的餐飲預

  算還低！


  Yahoo奇摩電影戲劇編輯部


  2024年3月13日 週三 下午1:04




  《小熊維尼：血與蜜》劇照


  1. 低成本恐怖片《小熊維尼：血與蜜》橫掃2024金酸莓獎，導演一點都不在意！


  2. 他笑稱，這電影的成本可能連一部漫威的餐飲預算都不到！


  3. 儘管如此，他也樂見自已的作品與他欣賞的導演相提並論！


  【文／千尋少女】


  本屆金酸莓獎由血腥砍殺電影《》（Winnie the Pooh: Blood and Hon

  ey） 拿下5項獎，而一手包辦本片監製、製片、編劇及導演等職位的英國導演瑞斯弗雷克

  沃特菲爾德（Rhys Frake-Waterfield）卻聲稱自己完全不走心，也對僅3％的爛番茄指數

  不以為然，笑稱：「

  ！」


  有「」之稱的（Golden Raspberry Awards）按造慣例，搶先於9日

  奧斯卡頒獎典禮前公布第44屆得獎名單，恐怖片《》拿下「」

  、「」、「」、「」及「

  」等5大獎成最大焦點！


  對此弗雷克沃特菲爾向《綜藝報》表示：「我很驚訝我們這部小預算電影被拿來與好萊塢

  製作相比，但我也不介意接受這可疑的榮譽，因爲這等同於將我和那些我十分欣賞的作品

  及導演並列同一水平。」




  《小熊維尼：血與蜜》劇照


  恐怖片《》惡搞經典童話，將「」原本趣味溫馨的童話故事，

  變成一部100分鐘的血腥B級砍殺片。


  故事描述被主人遺棄多年小熊維尼與小豬，恢復動物獸性對人類展開殘暴殺戮。


  據傳本片製作成本只有（約台幣316萬），而且僅花了10天便拍攝完成，卻意外

  在全球收穫（約台幣1.64億）票房，獲利豐盈。


  2022年1月小熊維尼版權走入公領域，一年後火速推出《》，不少觀眾

  因新鮮獵奇而買單，然而也因劇本結構與敘事邏輯混亂牽強，以至於網路上罵聲連連，並

  創下爛番茄影評指數3％的超級低分，甚至有網友忍不住猜想：「

  ？」




  《小熊維尼：血與蜜》劇照


  僅管惡評如潮，弗雷克沃特菲爾德坦言並不灰心，也不打算就此收手。


  他近日在宣傳續集《Winnie the Pooh: Blood and Honey2》時對SFX雜誌表示，近年將有

  更多角色進入公領域，例如米老鼠、小鹿斑比和皮諾丘等，他打算進一步製作更意想不到

  的搭配組合，「

  ！」並打算擴大成一系列的「」


  而被問及慘烈的評價及負評時，弗雷克沃特菲爾德也直言：「說實話，要成為一個電影製

  作人，你的臉要很厚，因為無論你表現如何、擁有什麼資源，你都會受到嚴厲批評。」


  他還解釋道，「當像《》這樣的電影上映時，它可以被直接拿來和漫威

  電影做比較，即使你的預算只有他們的0.01%，我們甚至連他們的餐飲費都不到，這中間

  是有很大的差異的。」


