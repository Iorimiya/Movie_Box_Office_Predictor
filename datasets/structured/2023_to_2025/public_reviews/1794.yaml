url: https://www.ptt.cc/bbs/movie/M.1705905754.A.2E1.html
title: '[  雷] 小熊維尼：血與蜜'
content: '防雷



















































































  這部電影真是太厲害了

  竟然有辦法請一個國家領導人來演他自己

  順便將很多人的童年狠狠摔在地上踐踏(稱讚

  不過以B級砍殺片來說表現還是待加強

  一大堆問號情節表現,用邏輯去看絕對會氣的腦袋冒煙

  還有處處可見的經費嚴重不足

  粗糙的道具效果加上多數在晚上拍攝

  還有只有一個露點畫面也能看出

  劇組可能不夠錢錢請女生脫,這樣講可能會有些冒犯

  但這類賣肉畫面是這類片型的特色也是少數賣點

  血腥畫面就一般般還可以,只是都在晚上很難看清楚

  我是覺得整體能更好,有些地方不用花錢就能更加分

  有特殊癖好再來好好欣賞便可

  否則這一個多小時拿去補眠也好

  真希望中港澳可以上映,一定嗨爆

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  一旦踏出去，就無法再回頭，朝三千世界的血海而去


  --'
