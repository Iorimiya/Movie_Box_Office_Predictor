url: https://www.ptt.cc/bbs/movie/M.1675699457.A.F0B.html
title: '[新聞] 童年回憶全崩壞！《小熊維尼：血與蜜》台'
content: '新聞網址：






  由A.A. Milne創作的《小熊維尼》原著童書系列版權已經在2022年初正式進入了所謂的「

  公有領域」，英國導演瑞斯華特菲德在同年推出血腥版的小熊維尼，完全逆轉經典童話故

  事中的溫馨形象，堪稱繼《窒友梅根》後，最具話題的恐怖電影，去年消息一出便在網路

  上掀起熱烈討論，有大批網友崩潰童年回憶全滅、三觀全毀，但也有網友笑說這是一部嚴

  重辱華的電影，中國絕對無法上映。另外喜歡《驚聲尖叫》崩壞系列及砍殺電影的網友們

  也大喊不會錯過這部電影的上映。




  這部由INT與JAGGED EDGE共同合製，以十天低成本製作的《小熊維尼：血與蜜》，劇情講

  述小熊維尼和森林夥伴們被人類朋友克里斯多福羅賓遺棄後，變得兇殘又嗜血，當長大後

  的克里斯多福羅賓回到森林與故友敘舊時，才驚覺童年的甜美回憶，竟已變成一場血腥噩

  夢。劇中邀請到OnlyFans網紅娜塔莎托西尼出演比基尼辣妹，在泳池邊慘遭小熊維尼及小

  豬毒手，在劇照中可見娜塔莎傲人身材，與兇猛的小熊小豬形成強烈對比。


  去年製作團隊釋出消息後引起旋風式的網路聲浪，在 IMDb 的2023年度期待排行榜調查中

  甚至打敗了多部強片，一躍成為眾多網友2023年最期待的電影第二名，僅次於由瑪格羅比

  主演的真人版電影《芭比》。製作團隊決定打鐵趁熱，在電影首集未上映前驚喜發布第二

  集的前導海報，預計今夏拍開。


  而本片的台灣發行商可樂電影，於去年底一發布原文海報與代理消息，立刻引來網友高度

  討論，影迷紛紛敲碗上映時間，如今本片終於訂檔於3月3日上映，讓台灣影迷能在大銀幕

  一睹這部年度話題之作。《小熊維尼：血與蜜》不僅血腥又創意十足，片中小熊與小豬獵

  殺人類過程中，招牌蜂蜜、血漿與尖叫聲不間斷，保證讓喜歡血腥砍殺片的影迷過癮滿意

  。





  --'
