url: https://www.ptt.cc/bbs/movie/M.1711821717.A.7B1.html
title: '[新聞] 《小熊維尼：血與蜜》確定開拍第 3 集'
content: '拍熊快！《小熊維尼：血與蜜》確定開拍第 3 集，「瑞比兔」也加入卡司陣容


  2024-03-29電影神搜




  根據導演瑞斯弗雷克沃特菲爾德，以及演員斯科特錢伯斯所證實的最新消息，大幅改編自

  經典童書故事的恐怖砍殺電影《》即將展開第三部續集的計劃。


  電影的製作團隊來自 B 級恐怖電影製片公司 Jagged Edge Productions，團隊表示《小

  熊維尼：血與蜜 3》將會有比前兩部還要更加龐大的預算，同時介紹更多來自原版《

  》童書故事的黑暗版角色，像是兔子瑞比、長鼻怪 (heffalump)以及大臭鼠 (woozle

  ) 等。


  可想而知的是，這些角色都會以極為殘暴扭曲的方式呈現。


  在這項消息公開前，《小熊維尼：血與蜜 2》已經正式在北美的 Fathom Events 活動上

  舉行特別放映，與首部《》只隔了一年左右，而現在，系列的第三部電

  影也已經火速進入了計劃階段。




  即使原版《》評價慘烈，甚至還橫掃了今年的金酸梅獎，但本片在 202

  3 年初上映後，仍創下了出乎意料的票房表現，不少觀眾可能都相當好奇可愛小熊到底會

  如何變成慘忍的殺人狂。


  這部噱頭十足的恐怖電影以 ，

  。


  《小熊維尼：血與蜜 2》則有了比前作高出整整 10 倍的拍攝預算。


  雖然《小熊維尼：血與蜜 2》的詳細票房數據目前尚未揭曉，但這部續集的預算提升或許

  也連帶讓評價出現相當顯著的躍進。


  甚至在爛番茄最初的幾篇評論中開出了 100％ 的好評，即使目前已經跌落至 48％，仍比

  首部電影的 3％ 要高出許多。




  第三部《》電影的消息公開前，Jagged Edge Productions 還率先向觀

  眾們揭露了他們野心勃勃的「」計劃，其中還包含了一部如同《復仇者

  聯盟》一般的大型跨界合作電影《》，集結了黑暗版的維尼、斑比

  、小叮噹、皮諾丘、彼得潘、跳跳虎、小豬、瘋冒客和睡美人等。


  《》預計將於 2025 年上映，《》的開拍時間

  目前尚未確認。


  新聞網址：











  --'
