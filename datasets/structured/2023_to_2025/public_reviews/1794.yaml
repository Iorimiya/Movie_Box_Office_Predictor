url: https://www.ptt.cc/bbs/movie/M.1677905226.A.F37.html
title: '[雷] [狗屎爛無雷]小熊維尼'
content: '剛看完，又氣又笑


  過冗的長鏡頭、莫名其妙的轉場


  殺手的臉像上個世紀的電影面具道具，還有大近視，人蹲在超級明顯又不到幾步路的地方(e

  x.沒有一個人高的小箱子、森林裡差不多到腳踝邊的小石堆)都能轉半天的頭才看到


  雖然受害者在該跑的時候不跑已經是這種砍殺片的鐵則，但這部用了更讓人生氣的方式去呈

  現


  該有配樂的場景安靜的像在辦喪事


  有配樂的地方無法營造緊張感


  收的很爛，看不出來是已經導過幾部片的人拍的


  呼籲打算去看的人做好浪費錢跟時間的心理準備


  我原本要圖個新鮮結果看了滿頭問號



  --



  我覺得普通


  超爛 我這裡的電影院還開的跟鈴芽一樣多場'
