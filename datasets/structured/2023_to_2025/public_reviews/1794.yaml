url: https://www.ptt.cc/bbs/movie/M.1742702542.A.734.html
title: '[討論] 維尼血與蜜很舒壓吧'
content: '很久沒看這種舒壓的爛片了


  賣血的作品很多


  但是賣的那麼純的很少


  有些賣血的片 還會想辦法合理劇情


  像是奪魂鋸 或是 絕命終結站


  小熊維尼 血與蜜


  全部的主軸就是看維尼殺人

  沒有硬要合乎邏輯的劇情

  每個演員的選擇就是要讓自己被殺掉


  這種放飛劇情的安排 反而超好看 娛樂性超高


  很久沒看過娛樂性這麼高的作品了


  還有沒有這類型的B級片啊


  不一定要血腥類的


  --'
