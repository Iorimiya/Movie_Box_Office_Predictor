title: '[情報] 2020金馬電影學院《滿七》'
content: '今年金馬電影學院的作品《滿七》官方已上傳至Youtube





  此部作品改編自今年台灣文學獎金典獎、蓓蕾獎雙得主


  林欣惠《瑕疵人型》內的短篇小說《虛掩》


  由《大佛普拉斯》莊益增及今年以《消失的情人節》獲最佳女主角提名的李霈瑜主演



  《滿七》故事簡介


  「滿七法事以後，亡妻的房門突然上鎖了。在一扇打不開的門外，志宏始終未能猜透妻子無

  法安心離開的原因；在空蕩的家中，志宏努力修補與女兒嘉安日久疏遠的關係，但她正在

  經歷的劇烈經痛，志宏卻不知如何應對」




  今年學院導師為去年以《返校》獲最佳新導演的徐漢強擔任


  學員為


  導演：李怡慧、歐詩偉、錢檸、羅晨文、陳奕凱(另擔任此部的剪接)


  編劇：馬慧妍


  攝影：劉世文、鍾艾


