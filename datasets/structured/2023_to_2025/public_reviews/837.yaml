title: '[新聞] 短片「滿七」致敬朱自清 庹宗華飆演技獲'
content: '短片「滿七」致敬朱自清 庹宗華飆演技獲桃影放映



  2024/8/27 18:09（8/27 18:26 更新）


  （中央社記者洪素津台北27日電）演員庹宗華與孫明宇在短片「滿七」飾演一對溫暖父子

  ，劇情聚焦於一場兒子對父親的道別，此片獲選桃影觀摩放映，導演林明智表示會拍攝此

  片除懷念父親外，也致敬朱自清。


  短片「滿七」劇情描述飾演父親的庹宗華逝世滿七時，飾演的兒子孫明宇依依不捨去辦理

  除戶，卻在回程時意外拾獲一盒火柴，當一根根火柴被點燃，香煙裊繞之間，往事竟一一

  浮現，父親的外遇、自己的初戀，以及他長大的第一次離家。


  短片「滿七」拍攝影靈感來自林明智與其離家父親的短暫相處，林明智憶起18歲那年，父

  親倒了杯酒祝賀他長大成人，當晚父親跟他聊了許多，幾乎超越他一輩子跟他說話的總和

  ，後來父親離家、與他的成長漸行漸遠，但這個晚上的經歷卻讓他終生難忘。


  林明智出身理工卻熱愛電影，曾參與投資出品廖士涵執導的「粽邪3：鬼門開」，以及入

  選金馬創投的「一路狂奔」。這次他初試啼聲編導劇情短片「滿七」，除向朱自清名作「

  背影」致敬，藏有說不出口滿滿父愛，更具備魔幻寫實風格，一舉入選第11屆桃園電影節

  觀摩短片。（編輯：李亨山）1130827



  新聞網址：



  預告



