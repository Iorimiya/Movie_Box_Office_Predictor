url: https://www.ptt.cc/bbs/movie/M.1753831934.A.8B0.html
title: '[好雷] 創意,驚奇,歡樂,動人的Sketch 素描(直譯)'
content: '整篇無雷請安心服用


  昨天去了電影院偶爾會有的"未上映"電影場次，也就是說，當投影機開始播放前

  我並不知道今天會看到什麼電影，抱著獵奇心情就去了


  剛開始出來了ANGEL電影公司的圖騰和很可怕的恐怖音效，以為就要看到驚悚片了

  但是出來的第一幕的童趣的對話就冷不剩防快把全場笑死


  Sketch大致的故事是在講失去母親的家庭，怎麼慢慢恢復的故事

  當女兒陰暗/灰暗/血腥/殘酷的塗鴉素描角色來到現實世界，會發生什麼事


  這部電影在2024年9月TIFF多倫多影展播出過，獲得非常高的評價


  8/6將在全美上映


  我希望給對此片有興趣的人


  "連預告片都不要看"

  最好當然是連海報都要看到，像我這樣完全未知觀賞真的效果最佳


  這是導演Seth Worley首部長片作品，風格很像80年代的經典家庭片風格

  有像是小精靈，親愛的我把孩子縮小了的風格，又有史蒂芬史匹柏的家庭冒險元素


  極具創意!! 且充滿不做作的幽默片段，沒想過會在戲院如此爆笑這麼多次

  完美了結合所有元素，在這小成本製作的電影裡，看到重返戲院的感動


  在北美的鄉民可以下周找時間觀賞，剛查到台灣上映日是9/6，中文片名: 怪奇寶貝



  目前爛番茄僅有12篇影評是100%正面的評價

  推薦



  --'
