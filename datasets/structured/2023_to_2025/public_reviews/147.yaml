url: https://www.ptt.cc/bbs/movie/M.1757312083.A.A45.html
title: '[普好雷]《怪奇寶貝》，學會面對悲傷是成長的第'
content: '部落格版：


  由導演賽斯沃利執導的奇幻喜劇《怪奇寶貝》，偶爾時候會讓我想到另部由童書《雞皮疙

  瘩》系列改編的恐怖喜劇《怪物遊戲》。雖然觀眾取向不太相同，不過整個概念我認為兩

  者是滿接近的。恐怖童書作家將自己書中所描寫的怪物鎖在書本裡避免牠們跑到人間作亂

  ，直到男主角等人不慎放出書中怪物，而其筆下邪惡腹語娃娃史賴皮則開始指揮其餘怪物

  攻擊主角群與他們所待的小鎮...。而《怪奇寶貝》中女主角安柏雖然沒有特殊能力，不

  過她那些為了抒發與宣洩內心失去母親悲傷、憤怒情緒所畫下的各種怪物圖紙，同樣不小

  心掉落到有著神秘力量的湖泊，不僅神奇的活了過來，安柏所繪、並將之形容為自己黑暗

  面的黑暗安柏，更是繼續畫下更多怪物圖畫讓牠們復活肆虐這座城市。


  同樣帶點童趣的《怪物遊戲》與《怪奇寶貝》，前者告訴觀眾克服心魔的重要性，後者則

  試著教會孩子們如何面對悲傷與創傷，那些被具象化的奇幻產物，都成了主角們必須跨過

  的難關，或許每個人都可以有朋友陪伴、有父母保護，可有些事情最後終究還是得自己學

  著處理，而這是成長必須邁出的第一步。只是相比《怪物遊戲》，《怪奇寶貝》目標觀眾

  族群顯然年齡要再低一些，所以不論是劇情或者角色關係變化、成長曲線等等，於編排上

  都是相當簡單且直接，許多或許在給成人看的電影中會被吐槽的部分，放到《怪奇寶貝》

  裡選擇用與孩子平齊的視角來看都單純的合理。例如傑克與安柏的手足情感，總是上一秒

  出言嘲諷，下一秒開口關心；還有總是欺負安柏的博曼，其實卻對安柏抱有好感，孩子們

  的口是心非，讓電影帶點傲嬌的可愛。



  除此之外，安柏等人直到最後才想到能將武器畫在圖紙上丟入湖泊裡使之重現來對付怪物

  這點，也因為他們還是孩子而情有可原。接著談到這類電影最為重要的地方，也就是關於

  角色的成長曲線，我個人很喜歡導演賽斯沃利的編寫，在有限的篇幅裡透過幾句簡單的對

  白與幾場戲，就讓觀眾能清楚看見女兒安柏、兒子傑克還有父親泰勒三個人的改變與成長

  。在看似只有安柏正面臨著她這個年紀無法承受的悲傷的同時，傑克與泰勒原來都各自面

  對著不同難題，身為哥哥的傑克知道妹妹更需要父親的關心與照顧，他無法將自己同樣失

  去母親的痛給表現太明顯，然而從他在意那特殊節日才能使用的盤子，還有他試圖將母親

  的骨灰撒進湖泊好復活母親的行為，都顯示出了他內心對母親的思念與對失去母親這件事

  的在意。



  父親泰勒或許沒有表現出悲傷，不過他其實也有許多事情要面對。在妻子過世後，得獨自

  照顧兩個孩子的他，處在很想關心卻又怕過度干涉孩子的尷尬處境，同時他也時常因花費

  更多心力在女兒身上導致忽略兒子感受，而他選擇將家中所有有妻子出現的照片全部收起

  ，是不想讓孩子們難過，可這不就是等於是某種自認是保護孩子的逃避行為？不可否認的

  是，許多大人、家長總認為孩子不夠成熟去面對、去處理那些他們覺得複雜的情緒與情感

  ，於是總在無意識間先行做出許多認為對孩子好、能夠幫助到孩子的事情，直到身旁的人

  提醒還有看著孩子們的表現，才會明白到原來孩子沒有自己所想的那樣脆弱。當安柏正面

  迎戰黑暗安柏，當傑克拾起又放下盤子碎片，當泰勒將妻子照片再度掛起，他們終於都向

  前了一步。



  《怪奇寶貝》另一個讓我喜歡的是電影的視覺效果，每隻出場的怪物不僅是色彩鮮豔，連

  呈現材質都是當時安柏畫下牠們的媒材，從奇異筆、蠟筆到粉筆都有，用來消滅牠們的方

  法也是這些媒材害怕遇到的，牠們遭到消滅後亦是殘留下所使用媒材的碎屑與粉末，是值

  得肯定的細節用心。此外，不同於《怪物遊戲》中的怪物設計，《怪奇寶貝》的每隻怪物

  、除了紫臉的黑暗安柏外，都是兒童適宜，特別是有著一大一小的晃動眼睛的藍色長腳戴

  夫，還有成群的橘色眼珠怪，都是很可愛的設計。而最後博曼的那把槍與傑克所持的鑽石

  劍，加上安柏的黑色觸手，儘管與黑暗安柏戰鬥大概只有五分鐘不到，但這些武器實在是

  非常炫炮，中二感十足。


  最後想提的是，當泰勒與莉茲發現不斷敲著安柏房間的是黃色蝴蝶時，我其實有被感動到

  ，因為那是安柏記憶裡母親手腕上的蝴蝶，於是我們可以想成是過世的母親回來看孩子們

  。本來我還想會不會黃色蝴蝶會去保護安柏與傑克，或是母親身影浮現與他們告別之類的

  ，但結果沒有，甚至黃色蝴蝶到後面也沒什麼戲份，我覺得是稍微浪費掉了能感動觀眾的

  機會。不過後來想想，如果真朝這個方向發展，似乎也真的會失去這部電影的意義，點到

  為止就好，讓更多時間放在安柏與傑克的成長與蛻變。整體來說，《怪奇寶貝》雖然談及

  成長議題卻不會太過沈重嚴肅，也不會幼稚到讓人感到不耐，剛剛好的劇情與剛剛好的片

  長，是部能讓人輕鬆觀賞的闔家歡電影。



  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
