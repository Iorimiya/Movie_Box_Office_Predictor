url: https://www.ptt.cc/bbs/movie/M.1754883641.A.50A.html
title: '[普微雷] 怪奇寶貝:文藝兒童怪物搞笑片'
content: '怪奇寶貝是2024年上映的多倫多電影節兒童搞笑怪物片，講述一個失去母親的家庭

  孩子繪畫怪物和其他東西排解情緒，直到有天怪物成真，這些孩子要打倒怪物

  並且和家人達成和解，目前爛番茄97%新鮮度，可謂好評如潮


  不過這畢竟是影展片，一般兒童應該是看不下去，不到90分鐘的片長應該會讓小朋友

  相當不耐煩


  構思是有趣的，幾乎沒有任何血的怪物片，而且穿插了許多搞笑橋段，用剪接和音效

  讓人覺得荒謬的那種，或是無厘頭式對話


  比較不滿的是明明很早就知道怪物是畫出來的，卻到了很後面還想到要用畫的把武器

  畫出來反擊


  總之如果平常常看影展片的推薦去看，一般兒童則不推薦


  --'
