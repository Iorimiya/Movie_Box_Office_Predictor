title: '[無雷]  怪奇寶貝， 真的很怪，不太好看'
content: '沒有看過預告片


  聽說評價不錯，就直接白紙一張進去看了


  結果這部片真的是很奇怪，調性很混亂


  懸疑，搞笑，動作，親情童趣四方拉扯大混戰， 讓人摸不著頭腦


  節奏跟配樂也很怪異， 雖然劇本概念很不錯，但是實行起來很糟糕，沒有一個主心骨，實?


  但是優點還是有 主演的幾位小朋友男帥女美 而且都很可愛，看了心情就很好


  評分6.6／10


  -----

  Sent from JPTT on my Samsung SM-A5660.


  --'
