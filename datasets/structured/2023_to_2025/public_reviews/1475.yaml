title: '[好雷] 喵的詐騙集團'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  原作貓鼠奇譚我是十年前看了。


  所以關於原作的部分都是憑記憶打的。


  這部作品本身沒有太多魔改。


  本身就是普萊契爵爺的童書作品。


  原本那些打破第四道牆或是後設（我的用法應該沒問題）的劇情呈現也盡可能的保存了。



  不過對於鼠王的設計在視覺上有特別的安排。


  使得這名超自然存在有更適合電影的需求。


  另外就是對於捕鼠人假裝愚蠢實而精明的設定也有所降低。


  原作中，捕鼠人故意製造鼠王好盜竊的設定也改掉了。



  鼠王的存在只是恰巧出現的天災。


  捕鼠人也從陰謀團體變成只是偶爾經營供給老鼠給鬥鼠場這項灰色副業的普通人。


  只是被意外誕生的鼠王控制。



  這也因此讓劇中沒有一位真正的需要被制裁的反派。


  所以大家都能過著美好的結局。


  （除了花衣吹笛手）




  另外，本作也有刻意安排彩蛋給喜愛普萊契爵爺作品的觀眾們。


  那就是出現在鎮長辦公室的大阿圖因畫像，還有作者普萊契爵爺的頭像。


  這個安排讓我看得很開心。



  雖然不用了解普萊契是本作作者。


  大阿圖因是托著四頭大象，還有他們所背著的整個碟型世界的宇宙巨龜。


  或是整個碟型世界的隱性主角就是那位好說話的死神。


  都不影響觀眾欣賞這部作品。

  總之我很開心自己有看這部作品。


  （說不定這也是我唯一有機會在台灣的戲院觀看改編自碟型世界觀作品的機會。





  -----

  Sent from JPTT on my Samsung SM-A217F.


  --'
