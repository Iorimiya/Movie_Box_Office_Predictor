title: '[新聞] 「喵的詐騙集團」貓鼠合作使壞 笑翻日舞'
content: '「喵的詐騙集團」貓鼠合作使壞 笑翻日舞影展



  動畫電影「喵的詐騙集團」（The Amazing Maurice）將於8月25日全台上映，該片2023年

  以兒童動畫之姿獲選美國日舞影展，劇情藉由貓、老鼠及人類，探尋不同族群之間和平共

  處的可能。（海鵬影業提供）中央社記者葉冠吟傳真 112年7月31日


  （中央社記者葉冠吟台北31日電）改編獲獎小說、貓鼠合作使壞的電影「喵的詐騙集團」

  ，今年以兒童動畫之姿獲選美國日舞影展，跌破許多影評人眼鏡，更被外媒大讚是繼「料

  理鼠王」後最可愛的老鼠。


  「喵的詐騙集團」（The Amazing Maurice）改編英國奇幻文學大師泰瑞普萊契（Terry

  Pratchett）獲卡內基文學獎的作品「貓鼠奇譚」（The Amazing Maurice and His

  Educated Rodents），創作靈感受格林童話「花衣魔笛手」啟發，藉由貓、鼠、人類主角

  ，探尋不同族群間和平共處的可能。


  全片描述神奇街貓「莫里斯」有天突發奇想出一個完美賺錢計畫，夥同男孩基斯、老鼠們

  要聯手詐騙純樸的人們，他們先讓老鼠在小鎮出沒，再請男孩假扮吹笛手驅鼠，用以獲鎮

  民豐厚報酬。


  不過當他們到惡布林茲鎮故技重施時，卻碰上真正的饑荒，發現所有食物都被「鼠王」掠

  奪，正義感被激發的貓鼠眾，決定找到真正吹笛手的魔笛來拯救人們。


  「喵的詐騙集團」幕後團隊也星光熠熠，導演為德國編導托比格恩柯爾（Toby Genkel）

  ，他曾以動畫「諾亞方舟漂流記」（Ooops! Noah Is Gone...）爆紅國際，並邀到「史瑞

  克」奧斯卡編劇泰瑞羅西奧（Terry Rossio），以及「料理鼠王」角色設計卡特古德里奇

  （Carter Goodrich）出馬，讓每個角色都充滿個性、栩栩如生。


  配音卡司更請出影集「怪醫豪斯」休羅利（Hugh Laurie）、「龍母」艾蜜莉亞克拉克（

  Emilia Clarke）分別擔任「神奇街貓」與「鎮長女兒」，讓導演興奮直呼陣容太「超現

  實」，並期待在保有原著輕鬆幽默步調，讓全片更適合闔家觀賞。


  「喵的詐騙集團」將於8月25日全台上映。（編輯：張雅淨）1120731



