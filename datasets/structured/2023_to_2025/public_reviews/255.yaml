url: https://www.ptt.cc/bbs/movie/M.1539787748.A.C7D.html
title: '[好無雷] 江湖兒女：人在江湖 淺醉一生'
content: '經友人同意轉載


  江湖兒女(2018) dir.賈樟柯

  ★★★★★★★☆☆☆

  人在江湖，淺醉一生。

  畢竟，我們都是宇宙中的囚徒。

  \

  江湖兒女可以說是賈樟柯生涯集大成之作，與本屆坎城影展中是枝裕和的<小偷家族>，與

  李滄東的<BURNING>相似，皆是對導演來說極為重要的作品。


  江湖兒女處處可見賈樟柯舊作的遺跡，除了沿用<小武>的背景，許多符碼的置入也有跡可

  循，包括<站台>中的街頭文工團，<三峽好人>中的飛碟，<天註定>及<山河故人>中的關公

  及廟會(<天>片中「你可知罪？」的廟會戲曲(雙關)橋段堪稱影史經典，也是賈樟柯跟中

  國結上樑子的濫觴，這以後再談)等等，就連主人翁的名字亦是沿用其舊(傑)作<任逍遙>

  的姓字。


  回到電影本身，這次講的是一個再普通不過的故事。一個江湖女子如何從意氣風發， 失

  足，再到崛起。三幕劇的形式上承<山河故人>，下啟<在清朝>？(據說劇本已完成)。 就

  故事處理層面分析，賈樟柯對中國東北的未來化顯然有著無限的想像，這次處理的比<山

  河故人>三幕劇中的第三段還要優雅。<江湖兒女>是一部重要的作品，世紀交融的女性浮

  世繪(其實賈樟柯的電影中，女性一直是重要的存在)。最後的監視器一景堪稱絕筆。


  賈樟柯其他的電影，之後有空會再分享。

  \

  延伸觀賞

  (1)賈樟柯全集

  (2)馮小剛：芳華(對文工團的歷史有十分詳盡，且真摯動人的描繪。)


  ig原文 歡迎追蹤


  --'
