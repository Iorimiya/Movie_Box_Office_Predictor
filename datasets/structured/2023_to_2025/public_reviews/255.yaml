url: https://www.ptt.cc/bbs/movie/M.1526755487.A.335.html
title: '[新聞] 華人影片唯一希望 剩「江湖兒女」'
content: "新聞網址：\n\n2018-05-19 23:22      聯合報 記者蘇詠智／綜合報導\n\n本屆坎城影展即將進入尾聲，各方期待的最佳影片金棕櫚大獎誰屬？影評分數極高的韓國\n\
  片「燃燒烈愛」、黎巴嫩與義大利兩位女導演的好評之作、大師高達的新作「影像書」等\n都有可能，就看評審團主席凱特布蘭琪今年要鼓勵女性影人，或是肯定電影藝術。\n\n\
  坎城影展評審團組合年年不同，因此得獎片並沒有既定的模式，端看當年的主席想要肯定\n哪一種方向。從去年秋天到現在，女性對抗男性不平等壓抑的「Me Too」活動紅遍全球，\n\
  不少媒體都預言女性導演有機會在今年坎城影展抱走最高榮耀。\n\n今年總共有3位女性導演的影片打進正式競賽，除了法國女導演伊娃于松的作品評價甚低\n，義大利女導演艾莉絲羅爾瓦雀的「Happy\
  \ as Lazzaro」、黎巴嫩女導演娜汀拉巴奇的「\nCapernaum」都有好口碑，尤其後者更被譽為「有奧斯卡相」，極有機會脫穎而出。\n\n目前各大媒體預測的金棕櫚片可能名單，「燃燒烈愛」出線機率大都排在第4、5位。今年\n\
  獲選參加坎城影展的華語片中，畢贛「地球最後的夜晚」，在「一種注目」單元好評備至\n卻敗給北歐片「邊境奇譚」，沒有得到任何獎。賈樟柯「江湖兒女」在正式競賽單元算是\n\
  口碑不俗的「前段班」，成為華人影片揚威本屆坎城影展的唯一希望。\n--\n\n    \n\n\n--"
