url: https://www.ptt.cc/bbs/movie/M.1537096535.A.CA2.html
title: '[新聞] 《江湖兒女》馮小剛戲份消失 賈樟柯：一'
content: "《江湖兒女》馮小剛戲份消失 賈樟柯：一言難盡\n\n\n    賈樟柯《江湖兒女》在中國首映，公映版為136分鐘，此前在戛納電影節首映的版本則\n\
  為141分鐘。新浪娛樂對比兩版，發現馮小剛客串戲份消失，而海報上馮小剛的名字已經被\n去掉了。\n\n　　在片中，馮小剛演一個醫生，總共有5分鐘左右的戲份。而公映版中相應的戲消失，\n\
  畫面裡大夫只露出一雙手。\n\n　　在映後主創見面會上，有觀眾說“這片子從一開始我們都關注，有些事也迴避不過去\n”，還提及范某某是去年賈樟柯主辦的平遙電影節影展大使，馮某某的電影是開幕片。賈\n\
  樟柯無奈笑答：“寫劇本的時候在書桌上貼了一句話：一言難盡，五味雜陳。這是這部電\n影的感覺，也是我現在的感覺。”\n\n\n\n\n--\n\n那個男人，臉上永遠有著捉摸不透的悲傷微笑。竹鼠們不知道他為什麼會那樣的殘忍，總\n\
  是莫須有地給自己扣上「中暑、內外傷、長太肥、長太瘦、憂鬱症」的荒謬病因，反正那\n個男人一開口，所有竹鼠的數量就會少一隻。\n竹鼠們都很慌張，大家都在討論要不要集體出逃，離開這個鬼地方。\
  \ \n \n\n--\n對啊，他今天又被前央視主持人崔永元嗆是孫子，崔永元就是爆料范冰冰逃稅的人，背景很硬的樣子"
