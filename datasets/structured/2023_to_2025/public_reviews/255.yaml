title: '[小雷] 江湖兒女'
content: '在對岸看完後

  感覺還是天注定好看

  感覺天注定是賈導的巔峰

  這片有點向吳宇森致敬的感覺

  一直在播喋血雙雄的畫面跟歌

  葉倩文的歌聲貫穿全劇


  裡面一堆賈導以前片裡的熟面孔

  董子建演警察，張毅演高幹

  徐錚愛吹牛的演火車過客

  還有天注定裡面第一個

  被姜武用獵槍爆頭的會計

  這片又演一樣的貪官

  然後又第一個被掛了


  裡面男主角廖凡

  以前演師父一個打50個

  但這片演流氓寡不敵眾

  被一大群小流氓圍堵

  師父以寡擊眾的風光不在

  說明武打片都是騙人的


  最後還是極道之妻拿槍救命

  結果一把黑槍被判五年


  出獄後人事全非

  廖凡變心跟女人跑了

  到三峽開發電廠做正行

  背叛了幫會跟自己的女人


  女人心灰意冷回故鄉山西

  重操舊業開賭場收小弟

  當然還是靠廖凡以前的聲望


  結果廖凡報應來了

  應酬太多喝酒喝到中風癱瘓

  最後女人事業都沒了

  唯一能依靠的就是極道之妻

  女人把殘廢廖凡接回家養

  因為還在江湖混

  所以一直沒再婚


  徐錚是個插曲

  在火車上追她

  但條件也不是那麼好

  跟了徐錚從良也是哭哈哈

  所以還是回山西當大姐

  受人尊敬生活好

  所以才人在江湖身不由己


  沒想到回到故鄉

  勢力跟事業都還在

  被他的女人顧的好好的

  他回到山西一樣還是個老大


  結果帶他去針灸治好了

  稍微一能走路就又跑掉了

  再度拋棄了江湖跟女人

  吃軟飯面子掛不住

  加上隨時都會被仇家打死

  所以江湖還是不好混

  要不怕死不怕坐牢才能當流氓


  中共有一向不準拍鬼片跟黑道片

  但賈導是拿歐洲跟日本的錢拍片

  賺的是中國以外的票房

  所以不受電檢制度綑綁

  他拍黑幫片估計跟北野武有關

  沒有北野武也不會有天注定

  北野武公司也有歐洲的資金


  裡面一樣拍出中國悲哀的一面

  這是外國人愛看他電影的原因

  現在新聞只會報強國多有錢

  從來不知道他們內政有多糟


  裡面又把賈導故鄉山西煤礦

  欠薪水要把礦工牽到新疆挖石油

  這些國內外新聞都不會報

  只有在他的電影才能得到情報

  因為只有當地人跟新浪微博才知道


  感覺就跟以前蘇聯感覺一直很強

  強到後來就突然破產跨掉一樣

  大企業倒閉都是無預警突然宣布

  復興航空也是一樣


  看賈導的電影了解中國現況

  你會知道在臺灣有多幸福

  對岸表面再強也還在水深火熱中

  窮人數量都是好幾個臺灣的人數

  罪犯可能也是


  雖然這片沒有天注定好看

  但還是可以支持賈導多拍

  才能了解現在中國老百姓

  不是全世界想像的那麼強

  而且數以億計


  --'
