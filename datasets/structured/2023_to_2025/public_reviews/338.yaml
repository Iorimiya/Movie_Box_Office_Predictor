url: https://www.ptt.cc/bbs/movie/M.1748443908.A.952.html
title: '[新聞]《史迪奇》電影結局掀熱議！粉絲怒批根本'
content: '《史迪奇》電影結局掀熱議！粉絲怒批根本背離「歐哈納」精神


















  迪士尼真人版《星際寶貝：史迪奇》（Lilo & Stitch）於美國陣亡將士紀念日週末正式

  上映，雖然票房表現亮眼，截至目前已突破全球 3.41 億美元，但其大幅改編的劇情卻在

  社群上引發激烈討論，尤其是對於片尾安排的批評聲浪不斷。




  與 2002 年原版動畫相比，真人版《星際寶貝：史迪奇》在情節上做出了幾項重大改動，

  其中最具爭議的，是將主角莉蘿的姊姊兼監護人「蘭莉」設定為選擇放棄監護權，將莉蘿

  交給州政府收養，自己則前往加州攻讀海洋生物學。這一情節改動在 Reddit 等社群平台

  引發憤怒，有網友直言這是「愚蠢至極的決定」，完全違背原作中「歐哈納（Ohana）意

  味著一家人不離不棄」的核心價值。




  部分支持者則認為，這項改編是對角色成長與現實困境的另一種詮釋，強調「家庭不僅限

  於血緣」的觀點。他們主張蘭莉為了未來努力並非背叛，而是另一種形式的愛與責任。不

  過，多數觀眾對此並不買帳，質疑這樣的設定過於牽強且脫離夏威夷在地現實。




  有網友指出，夏威夷本地已有全球頂尖的海洋生物學課程，對當地原住民提供低廉甚至免

  學費的入學方案，蘭莉若真有求學夢想，根本無需遠赴加州，也不必將妹妹交給他人扶養

  。此外，原作中蘭莉並未展現過對升學的渴望，她之所以堅持留下撫養莉蘿，正是劇情情

  感厚度的重要來源。



  許多觀眾也對電影改變原作文化背景的做法感到失望。有評論指出，這部改編片「剝奪了

  原版所有的情感深度與夏威夷文化」，更質疑迪士尼是否真正理解原作的訊息，還是僅將

  其當成「一部可愛的外星人電影，背景只是看起來『異國風情』的夏威夷」。





  --'
