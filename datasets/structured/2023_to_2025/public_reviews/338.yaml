url: https://www.ptt.cc/bbs/movie/M.1748758178.A.E1B.html
title: 'Re: [新聞]《史迪奇》電影結局掀熱議！粉絲怒批根本'
content: '看到這篇新聞，本來以為是在講強霸的部份，點進去看發現竟然是個我完全料想不到的部

  份引起粉絲憤怒，我想來說說我的看法。

  .

  這篇當然是有《星際寶貝：史迪奇》的結局雷，還沒看過的可以趕快跳出。

  .

  老實說我反而覺得這個結局的更動是一個更好的、有更符合這個時代價值觀的設計耶。甚

  至我覺得這是真人電影少數勝過動畫原著的部份。

  .

  一個人本來就沒必要為了家庭犧牲他的人生跟夢想，並不是說一輩子跟家庭綁在一起才是

  正確的。

  .

  莉羅調皮歸調皮，但她其實很清楚知道蘭莉為了這個家、也因為她的關係做出了多大的犧

  牲，最後甚至在已經找到一個能夠平衡所有人需求的情況下的最佳解，蘭莉依然將莉羅視

  為自己的責任不願意放手，用「丟」給寄養家庭這個說法對蘭莉是很不公平的，最後甚至

  是莉羅鼓勵她去完成自己的夢想她才願意離開的。

  .

  最後結局他們姊妹之間的感情經歷了整部電影之後其實變得更好了，雖然在物理上拉開了

  距離，但現在兩人都過得很好很開心，即便拿掉了傳送槍這個設定，這依然是個對大家都

  好的結局。

  .

  Ohana是家人，家人就是沒有人會被遺忘跟放棄，這不只是指莉羅跟史迪奇，蘭莉的人生

  跟夢想也不該被遺忘、被放棄，家人不只是血緣關系才是家人，真正的家人是一種靈魂上

  的羈絆，對孩子真心付出的寄養家庭當然也是Ohana，這家庭到了結局從來沒有被拆散，

  而是變得更大、關係更緊密了。

  .

  這樣的結局安排並沒有不好，至少我是這樣覺得啦。我真正不爽的改編反而是鋼圖艦長被

  刪掉，反派的戲份全部給強霸背，讓他從頭黑到尾。


  --'
