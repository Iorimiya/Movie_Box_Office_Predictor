url: https://www.ptt.cc/bbs/movie/M.1744631169.A.61C.html
title: '[新聞] 《星際寶貝：史迪奇》有望拯救迪士尼！'
content: "《星際寶貝：史迪奇》有望拯救迪士尼！預估首週末就可破億！\n\n\n美國的陣亡將士紀念日連假，對迪士尼即將上映的《星際寶貝》真人版電影\n\n\
  《星際寶貝：史迪奇》來說，意味著可觀的票房收入。這部改編自 2002 年經\n\n典動畫的真人電影，將於 2025 年 5 月 22 日上映，\n\n與湯姆克魯斯主演的《不可能的任務：最終清算》同檔期競爭。\n\
  \n根據票房預測公司 Quorum，《星際寶貝：史迪奇》真人版的開片表現預估極佳，\n\n有望在三天內突破一億美元，表現毫不遜色。\n\n不同於先前由瑞秋曾格勒與蓋兒加朵主演、口碑與票房皆不理想的《白雪公主》真人版，\n\
  《星際寶貝：史迪奇》預計將輕鬆突破美金一億元門檻。在為期四天的連假檔期中（週五\n至週一），全球首週票房有望突破 2 億美元。相比之下，《白雪公主》首週僅開出\n\
  \ 4220 萬美元，三週下來全球票房也僅達到 1.7 億美元。\n\n以下是歷年迪士尼真人版電影的美國地區開片票房前五名（單位：百萬美元）：\n\n《獅子王》：191.8\n\
  《美女與野獸》：174.8\n《愛麗絲夢遊仙境》：116.1\n《森林王子》：103.3\n《阿拉丁》：91.5\n\n\n而 2002 年的原版動畫《星際寶貝》當時首週票房為\
  \ 3530 萬美元，\n\n最終全球收入達 2.73 億美元，若以通貨膨脹換算，相當於今日的 4.85 億美元。\n\n至於這次的真人版《星際寶貝：史迪奇》，是否能獲得當年觀眾與影評人同樣的喜愛，也\n\
  成為外界關注焦點。\n\n2002 年的動畫版《星際寶貝》至今在爛番茄網站仍保有 87% 的「新鮮認證」，\n\nCinemaScore 更給出 A 級評價，觀眾評分方面也有\
  \ 78% 的高分。\n\n雖然真人版尚未上映，但截至 3 月 12 日止，首支預告片已累積超過 1350 萬觀看次數\n，顯示出影迷高度期待。\n\n《星際寶貝：史迪奇》導演為曾執導《迷你網紅實貝秀》的狄恩佛萊雪坎普，\n\
  \n這次他將帶領莉蘿與史迪奇再次回到大銀幕，帶來屬於 2025 年觀眾的新版本故事。\n\n\n\n\n\n--"
