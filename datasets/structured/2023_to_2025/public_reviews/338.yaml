url: https://www.ptt.cc/bbs/movie/M.1752932314.A.39C.html
title: '[新聞] 「史迪奇」太強了！今年好萊塢首部破10'
content: '新聞網址：




  迪士尼影業自從在2002年推出《星際寶貝》之後，相隔23年推出真人版《星際寶貝：史迪奇

  》締造賣座奇蹟，上映兩個多月以來，全球正式突破10.01億美金(約新台幣294億)，成為今

  年好萊塢最賣座電影，全球冠軍目前是大陸電影《哪吒之魔童鬧海》的20億美金。


  迪士尼影業聯合主席艾倫柏格曼開心表示「我們知道全球觀眾對《星際寶貝》的喜愛，但我

  們從未將這視為理所當然，我們為這部新電影與觀眾的共鳴感到自豪，我感謝我們的電影製

  作人、演員陣容以及所有工作室團隊成員，是他們讓這部電影取得如此巨大的成功，我們期

  待未來與這些角色一起展開更多冒險」。


  《星際寶貝：史迪奇》原本計畫單純在迪士尼自家的串流平台Disney+上，但因為內部迴響

  極佳改為戲院上映，沒想到成為今年迪士尼電影的票房救世主，去年感恩節推出的《海洋奇

  緣2》原本也計畫直接在串流平台上檔，也是改由戲院上映，同樣在全球斬獲10億美金的驚

  人成績。


  --'
