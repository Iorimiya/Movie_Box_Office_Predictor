url: https://www.ptt.cc/bbs/movie/M.1750997009.A.913.html
title: '[討論] 真人版電影《星際寶貝：史迪奇》宣布續'
content: '改編自迪士尼動畫《星際寶貝》的迪士尼影業真人版電影《星際寶貝：史迪奇》已於今年

  5月正式上映，而官方也於6月 26日「史迪奇日」正式宣布了續篇製作確定的消息，關於

  續作的詳細資訊還有待日後公開。


  《星際寶貝：史迪奇》敘述因家庭破碎而深感孤單的夏威夷「人類小女孩」莉蘿，與逃離

  邪惡主人並降臨地球的藍色外星人、卻有酷似無尾熊超可愛外表的史迪奇一拍即合，除了

  鬧出一連串與地球格格不入的笑話，也在彼此身上找到前所未有的友情與依靠。


  根據官方資料，《星際寶貝：史迪奇》於 5 月在北美及台灣等地上映，於美國陣亡將士

  紀念日連假期間創下 1 億 8300 萬美元的票房紀錄，並連續三週穩坐全美票房冠軍，目

  前全球票房已突破 9.1 億美元。








  --'
