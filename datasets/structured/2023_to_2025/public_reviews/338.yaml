url: https://www.ptt.cc/bbs/movie/M.1605370006.A.AAC.html
title: '[新聞] 《星際寶貝》真人版！「史迪奇」將寫實化'
content: '史迪奇即將寫實化！《瘋狂亞洲富豪》導演有望掌舵《星際寶貝》真人版




  在迪士尼旗下眾多的動畫片庫裡，《星際寶貝》（Lilo & Stitch）早在多年前便被盛傳

  將翻拍成真人版本，但導演人選遲遲未有著落，不過根據《好萊塢記者報》（THR）今日

  的獨家報導，這個人選似乎已經有譜，《瘋狂亞洲富豪》（Crazy Rich Asians）、《舞

  力全開》（Step Up）系列的導演朱浩偉現在正和迪士尼洽談接下導筒。




  《星際寶貝》真人版由一起監製過《阿拉丁》（Aladdin）真人版的林暐和喬納森埃里希

  （Jonathan Eirich）擔綱製作人，《厲陰宅》（The Conjuring）外傳《The Crooked Ma

  n》編劇麥克馮懷斯（Mike Van Waes）替該片撰寫了劇本草稿，但電影仍在開發階段，尚

  未被正式准許展開製作。先前雖有傳言《星際寶貝》真人版將成Disney+平台的獨家內容

  ，但《好萊塢記者報》和《Deadline》皆強調，目前還無法確定會是上院線或上串流。







  --'
