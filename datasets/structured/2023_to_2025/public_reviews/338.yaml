url: https://www.ptt.cc/bbs/movie/M.1748260120.A.D89.html
title: '[普好雷] 星際寶貝史迪奇 可以更好'
content: '作為一個童年是史迪奇狂粉的人

  我一直認為這部片是很完美敘述何謂「愛與歸屬」的片

  原作刷過N百遍都還是會感動，電視影集也是小時候少數會固定守在電視前追的

  所以在迪士尼陷入DEI狂熱時期聽到這部要真人化實在害怕...

  而昨天看完的感覺

  是沒有被刻意塞教育意涵

  不過有些設定的轉變，讓原作的感動點打了折扣

  所以整體評價就中間偏上













  防雷













  我認為好雷的部分：

  1.史迪奇：

  還原太成功了，真的很可愛！

  2.選角：

  除了族裔沒亂搞，莉蘿選了平時愛海邊活動也會跳草裙舞的女孩，蘭莉選了平時很愛衝浪

  的演員，大衛選了會跳草裙舞和火舞的演員，都很貼近角色本身

  3.音樂：

  好聽的開場曲和Hawaiian roller coaster找回了原本的合唱團回來，而且沒有改變太多

  ，經典的貓王也留著

  4.實驗品彩蛋：

  強霸說要把史迪奇改造成627的時候，畫面出現624（天使）跟625（三明治小子）兩個影

  集很經典的角色，這短短賣彩蛋的情懷我直接被回憶殺了一下QQ，有一瞬間看到童年蹲在

  電視前的自己，另外627也是真實存在的，是強霸覺得史迪奇太囂張所以製造627來讓他吃

  癟



  我認為負雷的部分：

  1.新增沒必要的角色：

  這是我覺得最嚴重的問題，我認為沒必要的角色就是鄰居奶奶跟女社工。

  首先是鄰居奶奶分掉了蘭莉的戲份，但蘭莉跟莉蘿在處境上的孤單、彼此只有親情可依靠

  ，這是這部片最大的感動處（原作莉蘿被光頭先生帶走後，蘭莉大聲哭求不要帶走妹妹，

  這真的太好哭了）


  但戲份給鄰居奶奶後，就讓蘭莉對莉蘿的愛不夠濃，而且也減少莉蘿一家人各自獨自奮鬥

  的孤獨感

  像是原作蘭莉聽到莉蘿許願想要有個不會離開他的朋友，隔天遂帶她去領養狗狗（因此遇

  到史迪奇）

  真人版呢，蘭莉同樣偷聽莉蘿許願，但隔天是鄰居奶奶帶她去寵物領養

  有時候都覺得莉蘿是不是跟鄰居奶奶更親


  女社工則是分掉原本光頭先生的戲份，這個角色本身合理

  但就讓光頭先生變成一個瞎忙又不知道重要性在哪裡的角色


  這兩個角色可能是因為演員身為動畫版蘭莉和水果攤奶奶而置入

  但這類角色像可以像李截出演餐廳老闆這樣就好

  實在沒必要安排一個角色把重要角色打碎


  2.說服議長的方式：

  原作中，莉蘿買了史迪奇，有購買契約，光頭先生用了「外星人最講求契約」說服議長尊

  重莉蘿擁有史迪奇的效力，後面也暗示光頭先生早就跟外星人合作過。

  老實說這個理由還算粗糙，但真人版改得更糟，一句you have my words議長就通融了，

  完全看不出為何議長願意相信光頭先生。


  3.史迪奇的轉變：

  原作中，無論是看醜小鴨，或是在沙灘看到莉蘿蘭莉大衛玩得如此融洽

  史迪奇的態度轉變都是認知到自己孤獨、需要愛

  所以從一開始只搞破壞的野生動物逐漸變成家人

  但真人版史迪奇一直給我有種…「破壞力」不夠高的感覺，比較像調皮而已

  所以反差比較不深刻



  跟大家分享心得

  歡迎一起和平討論～

  謝謝閱讀！


  --'
