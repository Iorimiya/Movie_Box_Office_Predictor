url: https://www.ptt.cc/bbs/movie/M.1747927566.A.9CD.html
title: '[ 感人雷] 史迪奇真人版很感人'
content: "剛才看完\n發現板上分享不多而且評價普普\n想講點不同立場\n我幾乎從頭哭到尾的程度的感人\n\n史迪奇我覺得是老鼠家有史以來最好看的真人版\n\
  我看過黑魔女 阿拉丁 獅子王 白雪公主\n但有可能是我沒看過史迪奇原本動畫版\n當年的畫風沒有很有興趣\n真人版倒是一看預告就決定要看了\n\n優點(可能有雷)：\n\
  \n1. 劇情很感人啊QQ\n    姐妹好幾場戲配上音樂眼淚直接泛出來\n    Lilo 許願、教史迪奇跳舞、收容所第二次擁抱\n    都太好哭了 = =\n\
  \    大家會調皮都是因為沒有感受到愛\n    雖然老套但很有效\n    原版卡通有這麼沈重的主軸嘛？\n\n2. 史迪奇好可愛 非常可愛\n\n3. 女主角好可愛\n\
  \     而且我覺得她演技是好的耶\n     她的戲我很喜歡 情感戲也很催淚\n\n4. 姐姐很漂亮\n\n5. 隔壁的阿嬤很好笑 而且很強\n\n6. 看了好想去夏威夷\
  \ 好漂亮 那個海\n     而且非常喜歡她們穿插族語在台詞中\n\n7. 搞笑的橋段不會硬要\n    我們這一場笑得蠻開心的\n    有好幾位是哈哈笑到所有人都聽得見\n\
  \n覺得不管是約會或是帶小孩去看都很適合的電影\n有親情有感人有好笑有寓教於樂\n有可愛的小妹妹\n還有可愛的史迪奇\n雖然劇情後面有點趕火車但還是順順的節奏\n\
  唯一可惜的是Lilo那隻小巫毒娃娃的戲份比較少\n覺得很可愛也很惹人憐的造型\n\n非常推薦\n個人心目中目前看過最好看的真人版\n\n--"
