url: https://www.ptt.cc/bbs/movie/M.1747991805.A.823.html
title: '[好雷] 星際寶貝：史迪奇 OHANA就是家人'
content: '昨天首映就直接進戲院看史迪奇

  先說結論，就是一部感人大片，我跟朋友都哭掉一包衛生紙QQ

  整部電影劇情有小改，但個人覺得不影響內容呈現

  某些片段甚至更有帶入感，有養寵物的人可能會很有共鳴


  底下有雷
















  看完電影後覺得真人版在著墨「OHANA」的手法更具體了一些，刻劃方式也更真實

  可以很有共感的體會蘭莉姊代母職的沉重感、莉蘿對於朋友的渴望感

  以及史迪奇對於家人的迷失感

  分享一些個人印象很深刻的片段


  首先是蘭莉和莉蘿在吊床上大談心，其實看的出來在父母過世後

  蘭莉面臨到的角色錯亂感，他想當個姐姐

  但有時卻要向媽媽一樣包容莉蘿所有的任性並照顧好妹妹

  他們合唱的最後一句歌詞「直到我們再次相見」

  離別的同時某種程度上也在說：下次我們都會以更好的樣子相見


  再來一定要提到的大場面，史迪奇沉入海底時

  比的手勢呼應前面的歌詞「直到我們再次相見」

  相信一定逼哭在場很多人（包括我）

  從一開始只會搞破壞的史迪奇，與莉蘿相遇後開始學習什麼是「愛」

  因此在強霸說要拿掉史迪奇愛的功能時

  若真的被拿掉了，我想也是拿掉了他一半以上的「自我」吧！

  因為莉蘿，他才知道什麼是被愛、什麼是家人

  在最後願意犧牲自己，拯救莉蘿，這段希望彼此好的友誼真的看哭了


  個人覺得史迪奇真人版跟動畫的差別在於，真人版對於情感的演繹做得很細膩

  從演員表情、行為，到歌詞的寓意，可以感受到這份似朋友一似家人的羈絆有多強烈

  沒想到在情感表現上可以這麼的真實，真的蠻推這部真人版

  看完會想回去抱抱自己的愛寵QQ


  --'
