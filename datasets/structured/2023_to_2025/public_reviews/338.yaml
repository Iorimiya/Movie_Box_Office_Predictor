url: https://www.ptt.cc/bbs/movie/M.1747917809.A.918.html
title: '[  雷] 星際寶貝：史迪奇'
content: "下面全部爆雷\n \n雷文防雷資訊頁\n \n \n \n \n雷文防雷資訊頁\n \n \n \n \n \n雷文防雷資訊頁\n \n \n\
  \ \n \n \n剛看完，覺得有點不行\n花了比原版更長時間卻沒有把故事講的更好\n \n第一幕，海底畫面，真的要給迪士尼一個讚，原來你們也可以把海底拍的如此通透明亮的嘛\n\
  。 那為什麼小美人魚拍的暗七八糟的。\n \n角色方面\n鋼圖艦長完全刪除，原本的戲份給了強霸博士\n光頭社工拆成2個角色，女社工以及CIA探員\n \n劇情方面大致與原版相同，多了一把傳送門的槍，玩過遊戲大概就懂原理。\n\
  醜小鴨故事書直接刪除\n跟獅子王遇到的問題一樣，就是假設觀眾都知道劇情了，然後就趕火車似的趕進度\n \n \n結局海灘告別，原本是外星人最遵守契約的，直接改成CIA探員一個眨眼，就讓議長流放史\n\
  迪奇，這個改動真的爛\n \n音樂方面，夏威夷歌曲風味十足，貓王音樂也保留。\n \n \n總之有點小失望。個人主觀評分7/10\n\n\n順便說一下，小女孩選角非常之好，簡直就是原版莉蘿\n\
  \ \n \n--"
