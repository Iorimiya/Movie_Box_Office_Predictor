title: '[普雷] 星際寶貝史迪奇 好很多但也爛很多'
content: '優點


  多了鄰居大媽來解決寄養問題 彌補了動畫結局遺漏的點


  史迪奇還是很狂 劇組也給蘭莉一個長處 來告訴觀眾姊姊的結局


  在電影裡也有把史迪奇遇水變重的這個設定給表現出來 也沒想到拯救史迪奇的方式居然是

  蘭莉在水底抱著牠行走 這點還不錯


  缺點


  莉蘿演技太爛了…

  面癱 尖叫 沒了

  看預告時就覺得怪怪的了 想說正片會比較好 結果更糟

  被推倒和推人時完全沒表情 看到外星人時更是先尖叫再來一臉稀疏平常的樣子


  劇情太急躁 史迪奇莫名突然想要家人 動畫有醜小鴨來感化史迪奇 電影裡直接沒了


  總結來說還可以 但看點只有史迪奇很可愛和很正的蘭莉 沒了


  --'
