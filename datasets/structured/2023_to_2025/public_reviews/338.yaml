url: https://www.ptt.cc/bbs/movie/M.1747926301.A.904.html
title: '[史迪奇雷] 星際寶貝史迪奇，就只是史迪奇'
content: "票根防雷\n \n \n\n \n \n \n \n \n \n \n \n先說背景是陪女朋友去看而已，覺得史迪奇本身蠻可愛的，但當年的錄影帶(?)劇情全忘光?\n\
  ，只記得大小女主角跟史迪奇的程度\n \n優點是真實版的史迪奇還是保留當年卡通裡的樣子，動起來的一舉一動還是很可愛\n該好笑的地方還是有笑果\n整部動畫和真人不會讓人覺得突兀，以一個忘記劇情的狀態去看，至少整個故事就是順順進\n\
  行到結束\n喜歡美女的，姐姐長得還不錯\n喜歡帥哥的，男主角整場都在露大肌肌\n然後我喜歡空間槍的部分，玩過portal的人會會心一笑\n \n \n \n但缺點就是扣掉史迪奇這個優點好像就沒了\n\
  \ \n劇情順順到結束是結束了，但中間一直有種很破碎的感覺，細節的處理很趕很隨便\n黑人探員存在意義超不明，CIA整部戲做的事只有分析一根毛\n外星人途中也沒感覺到有特別做什麼努力\n\
  中間找Lilo的時候也好像大家喊的很危急，但就…就這樣，不知道在忙什麼，實際也沒做什\n麼\n最後連議長出來也是莫名其妙的嘴遁就什麼問題都沒有了\n \n不是要針對演Lilo的童星，但她整部劇都棒讀的讓人很出戲，只感覺要把那幾句經典台詞唸\n\
  過一樣\n最後在擔心史迪奇的那幕甚至在衝浪板上坐得端端正正，純粹只有台詞在擔心而已\n至於Nani最後救人的方法也是前面大概五秒帶過的小細節，可以理解，但沒注意的人肯定忘\n\
  記了\n \n \n總之喜歡史迪奇的人應該還是會看得很開心\n至少坐我隔壁的人整場都在笑，史迪奇隨便動一下她都能笑\n但像我這種中立粉絲就覺得普普\n史迪奇80分的話，其他剩餘部分大概50吧\n\
  但真的還是很可愛啦，適合看到史迪奇就滿意的人\n \n \n \n \n \n \n \n \n \n \n \n \n \n防雷\n----\nSent from\
  \  \n \n--"
