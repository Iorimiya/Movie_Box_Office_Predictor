title: '[好雷]二刷《八月三十一日，我在奧斯陸》 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  印象中並沒特別喜歡這片，會想重看完全是因為男主角在《世界上最爛的人》的演出，讓

  我忽然想復習一下這部片。


  原以為是三刷這部片，看了之後才發現應該只是二刷，而且一刷應該是好幾年前的事。可

  能因為身邊好些朋友都因為這片成為導演尤沃金·提爾的粉，時不時都聽到這部片的事情

  ，導致自己產生已經看過不只一次的幻覺。

  再看還是沒有迷倒我，但這次看覺得拍的真的好。完全可以理解愛這片的人愛上什麼：主

  角遇上的困境是無法以任何客觀角度去說明，沒有人虧負他什麼，一切都很好，卻找不到

  出口。成癮的問題，只是一個切入點，實際上卻可以呈現出一個人與家人、朋友、戀人的

  關係，並自我價值感的消亡與背後的社會文化。


  此外，看到《世界上最爛的人》的女主角有參一咖，雖然不是戲份很重的角色，但一看到

  就可以認出來，算是重看這片的意外驚喜。



  ***


  這裡是我的樂園:




  --'
