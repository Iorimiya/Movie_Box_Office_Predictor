title: '[情報] 八月三十一日，我在奧斯陸 8/28 限定重映'
content: '八月三十一日，我在奧斯陸

  OSLO, AUGUST 31ST

  -------------------------------------------

  尤沃金提爾 Joachim Trier

  -------------------------------------------

  2011 | Norwegian | Color | Norway | 95min | C/E Subtitles |


  限定放映 8/28 @光點華山


  即將戒毒期滿的安德斯獲得面試機會，這一天奧斯陸陽光普照，他試圖和自己的過去重新

  搭上線。他拜訪老友、參加派對、認識陌生人，也嘗試與前女友連絡，但心中仍不斷為過

  去他曾辜負過的人事物感到愧疚，他還年輕，但感覺自己的生命在各方面都已然結束，彷

  彿這一切只是徒勞無功。過去綑綁著他的夢魘再度浮現。這一天，他能否重新開始新的人

  生？ 根據1931年的法國小說〈鬼火〉改編，路易馬盧亦曾備受感動，並於1963年改編為

  同名電影。


  情報來源:

  光點華山網頁


  心得:話說這部不是美昇的嗎?結果看官方粉專也沒有宣傳的消息,懷念美昇的片也三年了~~


  預告:


  粉專:


  --

  等等換您上車庫的臉書(?) 沒有啦,車庫也是靠商業賺錢買藝術?

  查了一下好威去年才成立

  大家怎麼都知道這些消息XDD 恭喜光年藍色恐懼大賣'
