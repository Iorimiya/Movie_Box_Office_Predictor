title: '[屎雷] 逃出狂鯊島好雷都是寫手'
content: '—————————-更新———————————

  想看鯊魚請直接看巴黎深淵

  netflix不用多付錢還精彩多了

  巴黎深淵75分的話逃出狂鯊島19分

  15分是女生有激凸（沒露點）

  4分給鯊魚出現的12秒

  ———————————————————————


  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  如果你也被雷到，請留言好人一生平安

  讓這篇推可以被大家看到


  最近發現line電影的評價都還算真實，但因為本身就很愛各種動物類的電影，鯊魚、鱷魚

  、恐龍、獅子


  但逃出狂鯊島就是一團屎，一句話我就可以講完整部片


  五個閨蜜去島上婚前派對然後遇上鯊魚就死了三個。


  你覺得一句話太牽強嗎？不信自己去挑戰如何把這一句話拉成90分鐘，沒有額外的畫面、

  動

  作，大概在水裡漂了85分鐘

  看完後去line上看了評價，給5顆星的除了片商我想不到有誰可以昧著良心做這種事，全

  片最精彩的是開演前的預告「救援生死線」

  各位珍惜光陰。

  -----

  Sent from JPTT on my iPhone


  --

  我是預言有推的絕對是廠商，line上倒是已經有片商了

  我連傑森史塔森的巨齒鯊都可以接受就知道這個有多爛

  先跟大家說這部鯊魚正面大概出現1秒3次共3秒

  整隻鯊魚空照畫面大概3秒3次共9秒

  沒有一個奶可以看相信我，畫面最多的兩個B以下，別忘了有85分鐘漂在水裡，也看不到

  B級片也是一種style

  而且我也不排斥

  再怎麼B我都不曾形容一部片有如屎

  如果大家想看90分鐘的屎可以花330去看

  生平第一次看完這麼生氣

  還看到line電影片商洗評價有夠缺德

  詐騙集團不是應該用加重詐欺辦嗎？'
