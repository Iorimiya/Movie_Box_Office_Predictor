url: https://www.ptt.cc/bbs/movie/M.1718514599.A.4F7.html
title: '[負雷]逃出狂鯊島'
content: '一群女生出遊就是災難的開始

  一開始鯊魚很溫柔的只咬了小腿一小口

  也沒有把人拖走

  好讓特效團隊秀傷口特效

  之後要止血傷口猜猜怎麼止血

  把傷口遮起來

  不是加壓或是綁緊大腿


  之後開船離開的時候

  會開船的不去開

  讓一個沒有開船經驗的去開船

  不出意外的出意外了

  後面船就撞到暗礁了

  喊著不要讓手機泡到水

  卻只拿了一隻沒有防潑水的手機

  讓其餘四隻手機放在袋子裡一起泡水沉下去


  之後四人帶著傷者開始離開船上

  展開漂浮之旅

  然後開始話家常完全沒有要管傷者的意思

  沒有試著講話保持傷者意識

  只顧著聊天後面才發現傷者已經掛了

  這時候明明屍體的腿還在流血

  鯊魚卻只在旁邊晃了一圈

  完全沒有要攻擊的意思


  後面他們開始討論該有人去求救

  我整個黑人問號

  剛剛一陣兵荒馬亂

  而且在在海中央欸

  沒有指南針之類的工具

  派出一個人「游泳」去看不到的陸地去求救


  後面其中一個人肩膀被弄出一個小傷口

  於是準備犧牲自己

  拿著小刀準備和鯊魚決鬥

  鯊魚撞了她一下，就把小刀弄掉了

  靠，你唯一的求生工具抓緊好嗎？

  後面不出意外的被吃了


  後面剩兩個人一件救生衣一個浮板

  之後就看他們有說有笑

  從早聊到晚

  聊到暴風雨

  聊到後面不小心把浮板放開飄走

  幹，那是你們的救命稻草欸


  後面配角決定犧牲自己

  把證明我們五人友情的手鍊放到女主角口袋

  把救生衣偷偷穿在女主身上

  隔天女主醒來發現配角不在了

  然後猜猜他做了什麼

  把救生衣脫掉前下水試圖尋找朋友

  差點讓救生圈跑掉

  操，妳們到底有沒有求生的慾望啊


  後面遇到鯊魚襲來

  女主手不小心受傷開始流血

  她把血抹在救生圈上丟出去吸引鯊魚後開始游泳往礁石游去

  然後鯊魚不去追流著血會動的生物

  而是追有血味的救生衣


  之後沒有什麼好說的了

  就是那個游泳去求援的人帶了救援回來救女主


  看完之後真的有想哭的衝動

  為了逝去的票錢和時間……


  整片就看

  曬了一整天太陽沒有中暑

  在晚上的海水裡沒有失溫

  的一群女人在聊天化解心結

  好像聊天就可以活下去

  還有一堆海水海水還是海水


  最好看大概就是片頭看她們被揍


  回家去看絕鯊島洗眼睛


  --'
