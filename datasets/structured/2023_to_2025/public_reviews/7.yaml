title: '[情報] 【隱藏殺機】預告 11月21日上映'
content: '★ 2025聖賽巴斯提安國際影展

  ★ 西班牙哥雅獎得主 安東尼奧赫南德茲執導

  ★ 你必須成為共犯，才能找到答案

  ★ 西班牙人氣女星布蘭卡蘇拉茲、愛德華多諾列加領銜主演

  ★ 「燒腦神作」再現，喜歡《佈局》的你絕不能錯過

  ★ 一段故事、三種視角、無數秘密



  ★ 故事大綱


  伊娃正與新伴侶納薩里奧以及他的女兒艾莉西亞過著幸福的生活。然而，與前夫荷西

  的重逢後，卻打開了一連串複雜情勢的大門，讓她踏上一段充滿恐懼的旅程，並為所

  有人帶來可怕的後果。一切都不像表面所見，每個人所見的，都是各自平行的真相。





  又一部西班牙燒腦懸疑電影


  還記得當時看佈局和屍物招領看得很過癮


  劇情緊湊，懸疑感拉滿，最後的反轉也很驚人


  這部預告也是滿滿懸疑感，會有點期待


  但目前評價還滿兩極的就是了


  --'
