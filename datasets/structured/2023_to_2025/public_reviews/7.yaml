title: '[好雷]《一個人的武林》隱藏殺機在民間'
content: '導演陳德森用一樁樁「既分高下，也決生死」的凶案，把武林概念包裹在現代故事裡。


  緝凶的電影架構則讓人想起《紅龍(Red Dragon)》中，警官、漢尼拔跟牙仙的關係，


  但殺人者身份沒懸念，這樣的架構為的是串起一場場無比激烈、血腥殘酷的生死決勝：


  警官的角色換楊采妮；人魔漢尼拔變成比武失手打死人後自首入獄的武林第一甄子丹；


  牙仙是傻帽專業戶王寶強，橫練武藝突破殘缺，逐個殺敗高手、挑戰偶像的變態武癡，


  還依甄子丹「先練拳次練腿，後擒拿用兵器，由內而外」的練武層次，挑戰各派高手。





  電影裡，夏侯武是丹哥真名，「封于修」則是王寶強這個角色幫自己取的「江湖渾名」


  也鏘好對應了他執念於「功夫是殺人技！」自我封閉進行慘無人道修練的武道狂之路！


  這武俠小說裡名字，道出學武之人的孤獨，也呈現殺遍天下高手、高處不勝寒的絕路。


  是了，絕路，登頂見天地，舉目四望盡皆蒼茫；反倒甄子丹放得下，走下山見了眾生。


  至於電影最後一場的「既分高下，也決生死」是熟勝熟負？大家就自己進戲院看看吧。





  雖然丹哥這回沒怎麼祭出凌空三腳、剪刀腿、轉身回旋踢、右手甩圈揮拳等等招牌菜，


  但甄子丹、元彬、董瑋三大動作指導設計出的幾場動作戲，從拳到腿，打到擒拿兵器，


  天台追逐、龍骨雕塑上拼腿、刺青館裡近身擒拿、片廠刀槍劍棍見血封喉的兵器險戰、


  到大澳水戰和車流中決鬥，都打得狠疾，看得見心思，沒辱沒了那個閃亮的黃金年代。


  在《關雲長》《特殊身分》《冰封奇俠》《大鬧天宮》雷片後，丹哥總算「回來了！」


  至少面對泰國東尼嘉《拳霸》跟印尼伊科烏艾斯的《全面突襲》，這回，香港沒丟臉。


  最驚喜的是王寶強，他不是傻帽專業戶嗎？武癡演起來，個性之囂張、手段之殘忍的！


  上網查了一下，他居然有好幾年的少林寺俗家弟子資歷（嚇）也總算是有用武之地了。





  故事裡王寶強每殺敗一個過去甄子丹的手下敗將，他都會在屍體上留下「堂前燕」鏢。


  耆老說這是過去朝廷賞給武狀元比試敗陣下來的安慰獎典故，貴金屬打造，值點錢的，


  也算給走跳江湖的武人打完收工後「舊時王謝堂前燕，飛入尋常百姓家」的一點補貼。


  南拳王販毒、北腿王搞當代藝術、擒拿王開刺青館、兵器王是動作演員、內功王開貨車


  甄子丹為了發揚門派去跟各派高手論武，王寶強選擇擊殺各派高手只為挑戰天下第一，


  當代武人都各有各信奉的武道，在他們選擇的武道之路上都是自己「一個人的武林」。




  電影裡的武林群像，像星爺電影《功夫》豬籠城寨裡隱姓埋名討生活的眾家武林高手，


  但相信他們心境上多少也像《少林足球》裡，那幾個認清練功不能當飯吃的師兄弟們。


  在飛機手槍的世界裡，在軍警律法的制度下，在人人舉頭望明月、低頭拼經濟的現代，


  《一個人的武林》用許多昔日武打明星跟知名幕後武術指導客串，向香港動作片致敬，


  電影的劇情，也同時向在經濟發展與現代社會浪潮沖刷下，逐漸消失的香港武林致敬。


  這點情懷與感動，很像在大銀幕上看到麥浚龍執導，喚醒殭屍片集體回憶的《殭屍》。





  ---

  動畫圖文網誌


  ---


  --


  喔，所以發動作片的文一定要有『拳拳到肉』這四個字就是？

  好吧，它的而且確值這四個字。'
