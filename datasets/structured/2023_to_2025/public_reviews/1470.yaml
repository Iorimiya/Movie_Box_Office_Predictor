title: '[情報] 2024 冰島奧斯卡代表：《神選之地》'
content: '冰島於日前公布了申報 2024 年奧斯卡「最佳國際影片」的電影，將以《神選之地》作為

  代表！




  《神選之地》為冰島導演 Hlynur Pálmason 的第三部長片，去年在坎城影展的一種注目

  單元中首映，該片獲得了國際影壇的高度推崇，但最終並沒有獲得評審團的青睞而空手而

  歸。電影陸續獲得特柳瀨德、多倫多和倫敦等大型影展的選映，也在合製的冰島和丹麥兩

  國的本土大獎頗受青睞，頻頻展獲大獎。


  「肩負著神之諭，踏上未知的冷酷異境；熾熱的生之慾，顯影前轉瞬化作永恆。19世紀末

  ，一名丹麥牧師為了在蠻荒異土蓋教堂、拍下異鄉人的照片，而泊旅至遙遠的屬地冰島。

  他們跋山涉水、旅途艱辛，還被疾病襲擊、遇見死亡，大自然的力量漸漸侵蝕牧師的信念

  與理想。即便在陌生的小鎮展開傳教任務，與居民親近並為他們拍肖像、蓋教堂，不料越

  深入當地生活，伴隨而來的人性和慾望，卻如同暗箱中顛倒的幻象，越令他偏離初衷而感

  到迷惘。眼看寒冬就要逼近，這趟旅程終將帶他去向何方？」（取自 Yahoo奇摩電影戲劇

  ）




  這是導演 Hlynur Pálmason 繼《接近無限的白／白色吻痕》後第二度獲選為奧斯卡代表

  的作品。該片在美國已經由 Janus Films 進行發行，也是他們今年繼土耳其的《春風勁

  草》後第二部獲選為國家代表的電影。


  冰島曾在 1991 年以《自然之子》首度獲得奧斯卡的提名，也是唯一一部闖進五強的作品

  。在此之後僅有 2012 年的《The Deep》和 2021 年的《羊懼》兩部片入選過短名單。



  --'
