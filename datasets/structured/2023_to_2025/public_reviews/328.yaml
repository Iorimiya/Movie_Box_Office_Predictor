title: '[噁  雷]  老狗變不出把戲的天啟 '
content: '說實話 如果買票送甚麼卡片之類的  我拿到還寧願是保險套


  然後還沒開場前搞甚麼抽限量行李箱 那麼多人只抽一個


  應該是想要掩飾電影難看的內容


  接下來我以為又跟BVS一樣 因為瑪莉媽媽


  如果因為我是你兒子就讓萬慈王倒戈


  還好不是 不燃真的老梗中的老梗


  從頭到尾鋪陳一堆 也沒甚麼戰鬥 最後那甚麼對決跟收尾


  釋放妳的力量吧  琴  虧你還是教授 還不是靠隊友


  然後突然大家都倒戈  只能是無言中的無言


  那麼晚如果去汽旅跟女友來一發說不定還比較實際


  天啟根本不需搞甚麼收服四騎士 然後奪取能力


  明明就瞬間摧毀城市


  搞那麼多五四三的完全無法理解


  總之這部片真的弱到不能再弱


  --'
