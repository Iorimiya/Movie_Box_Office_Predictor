title: '[普負雷] 邊緣禁地'
content: '中規中矩的冒險動作片，感覺不出遊戲中的混沌混亂。


  人型的服裝、妝扮還蠻用心還原的。還有看到城鎮的武器販賣機。


  給負雷的原因是，


  戰鬥幾乎都是人對人，遊戲中的怪物竟然只當背景、串場用...


  武器槍枝略顯單調，沒有遊戲中多樣化。


  最還原的大概就是影評提到的狂匪，還有小吵鬧。



  另外首週有海報可以拿，以上。


  --'
