url: https://www.ptt.cc/bbs/movie/M.1721869510.A.DCF.html
title: '[情報] 知名遊戲改編真人版電影《邊緣禁地》今'
content: '知名遊戲改編真人版電影《邊緣禁地》今日釋出最終預告影片 　8 月 9 日上映




  美國獅門娛樂（Liongate）今日公開以知名遊戲《邊緣禁地（Borderlands）》系列改編

  的同名真人版電影《邊緣禁地》上映前最終預告影片，預定 8 月 9 日上映。


  《邊緣禁地》遊戲原作是結合詼諧幽默、豐富故事與奪寶元素，系列作累積銷量十分亮眼

  ，如今改編成真人版電影，由伊萊羅斯（Eli Roth）負責執導。伊萊羅斯曾透露，他是以

  凱特布蘭琪的前一部主演作品《TÁR 塔爾》為切入點向她提出邀約，她因為在該片飾演

  指揮家而獲得奧斯卡影后提名，「人們喜歡看你（凱特布蘭琪）拿著指揮棒，但我要把火

  焰噴射槍交到你手中。」結果出乎意料，凱特布蘭琪立刻答應，還透露科幻動作經典《紐

  約大逃亡》是她最愛的電影之一。


  　　在電影中，故事以擁有神秘過往的賞金獵人莉莉絲（凱特·布蘭琪 飾）作為主角，

  為了替全宇宙最有權勢的大壞蛋阿特拉斯（艾德格拉米瑞茲 飾）尋找他失蹤的女兒，她

  不情願地回到自己的家鄉──銀河系最混亂的潘朵拉星球。在那裡，莉莉絲與一群烏合之

  眾組成了隊伍，包含傭兵羅蘭（凱文哈特 飾）、科學家塔妮思（潔美李寇帝斯 飾）、瘋

  狂少女小蒂娜（雅瑞安娜葛林布雷 飾）、狂匪克里格（佛洛里安蒙特亞努 飾）、機器人

  小吵鬧（傑克布萊克 飾）。這群人必須攜手對抗各種外星怪物和兇殘盜匪，並解開潘朵

  拉星球最驚人的秘密，宇宙的命運可能就掌握在他們的手中。


  　　在今日公開的最終預告影片，展現了動作場面與《邊緣禁地》場景氣氛：




  《邊緣禁地》真人版電影預定 8 月 9 日上映。


  --'
