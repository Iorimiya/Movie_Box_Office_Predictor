title: '[普好雷] 邊緣禁地其實沒那麼差'
content: '我是沒玩過遊戲 爬文才知道是遊戲改編

  不過單純就一部娛樂電影來說 還真的沒有版上之前說的差


  動作有~ 特效有些不錯 但就是走有點像邪典B級片的風格

  偏偏現代人好像不怎麼吃B級片的單了

  或許是有太多網遊手遊本身就很像B級片?


  前面有人說星際異攻隊 是有一點

  但其實更多讓我想起瘋狂麥斯 真要說優點是人設部分

  但就整個故事有點太理所當然 有趣的地方都是在人的表現

  而不是劇情有什麼令人驚豔的轉折


  不過真的是就我而言沒這麼爛啦

  Sony系列的幾部漫威 還有雷神四 個人都覺得更鬧更無聊


  --'
