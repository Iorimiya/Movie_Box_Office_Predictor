url: https://www.ptt.cc/bbs/movie/M.1765802985.A.39F.html
title: '[好雷] 邊緣禁地 其實不難看啦'
content: '只知道是電玩改編的電影 但沒有玩過


  知道凱特布蘭琪主演


  知道是去年大爆死的片之一


  本來想看一下到底有多爛


  但其實看了覺得不差


  雖然劇情很簡單 非常老梗到看不到一半幾乎都可以猜到結尾了


  但是我覺得整個過程很流暢不拖泥帶水 簡單俐落 娛樂效果不錯


  場景特效服裝和化妝都很不錯 人物造型也很好


  凱姐真的是帥炸，潔美李的造型也很帥，凱文哈特超級嚴肅但看得出來他很想搞笑


  只是很可惜人物角色塑造太弱，女主人設又跩又高冷但根本也不夠到味


  明明想要營造一個團隊溫馨熱血的氛圍，但角色之間的互動又很乏善可陳


  導致這幾位大咖來演這幾個角色真的是浪費掉了


  而傑克布萊克努力地演好碎嘴小吵鬧也略顯很蒼白無力


  把子彈拉出來這個橋段 我有笑出來 也是整部我唯一笑出來的地方


  然後反派有夠弱 弱到一點緊張感都沒有


  小蒂娜倒是很可愛啦蠻驚豔的但就是有點尷尬感


  我覺得整體而言是好看的無腦爆米花片 適合過年闔家觀賞的那種


  但.....可能不符合遊戲迷的期待吧所以炸掉了吧？


  --'
