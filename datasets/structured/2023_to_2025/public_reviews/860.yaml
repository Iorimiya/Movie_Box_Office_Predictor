  充斥無意義的笑話、空洞的劇情、

  彷彿回到電子遊戲改編=垃圾的那個年代、

  像是刻意模仿的超級低配版《星際異攻隊》。


  可惜，本來週末想去看的，

  板上還有勇者要衝嗎？


