title: '[新聞] 知名遊戲《邊緣禁地》改編電影宣布由《'
content: '知名遊戲《邊緣禁地》改編電影宣布由《恐怖旅舍》導演艾利·羅斯負責執導


  　　美國獅門娛樂（Liongate）今日宣布，以知名遊戲《邊緣禁地（Borderlands）》系

  列改編電影將由《恐怖旅舍》、《當辣妹來敲門》等恐怖片導演艾利·羅斯（Eli Roth

  ）執導，電影預定今年稍晚開始製作。


  　　獅門娛樂曾於 2015 年公開，與《猛毒》、《蜘蛛人：驚奇再起》製片阿維·阿拉德

  合作將《邊緣禁地》改編為電影，而今電影終於有新的進度，獅門娛樂除了宣布導演人選

  外，也將由 Picturestart 執行長艾瑞克·費格擔任電影監製，並由美國著名編劇與導演

  克雷格·麥辛撰寫劇本，他曾與人合作撰寫過《醉後大丈夫》電影系列故事，並於去年以

  《核爆家園》拿下艾美獎。


  　　《邊緣禁地》是由 Gearbox 研發、由 Take-Two 發行，強調結合詼諧幽默、豐富故

  事的奪寶與射擊遊戲，《邊緣禁地》系列全球銷售量已經突破 5700 萬套，而最近一部作

  品為《邊緣禁地 3》。


  　　《邊緣禁地》的遊戲執行製作人、Gearbox 的創始人 Randy Pitchford 與

  Take-Two 執行長 Strauss Zelnick 都將擔任電影的執行製作人。Randy Pitchford 表示

  ，相信藉由艾利與克雷格之手，能夠將 Gearbox 充滿創意的《邊緣禁地》角色與故事生

  動地帶到大螢幕觀眾面前。


  　　導演艾利·羅斯說，他很高興能夠進入《邊緣禁地》的世界，能夠有這麼好的劇本、

  製作團隊與工作室了共同合作，他期待將自己的想法與願景帶入這個遊戲充滿狂野、趣味

  與無窮無盡創意的世界。




  --'
