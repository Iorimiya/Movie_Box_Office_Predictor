url: https://www.ptt.cc/bbs/movie/M.1726499788.A.A04.html
title: '[新聞] 耗資上億《邊緣禁地》上映一個月火速下檔'
content: "新聞網址：\n\n原標題:\n\n\nJay_FM 2024-09-16 11:52:49\n\n\n獅門影業發行的《邊緣禁地》（Boarderlands）改編電影，在上映前便獲得一面倒的毒舌\n\
  批評。然而對本片不滿的可不只有媒體影評，觀眾對本片的失望也反映在奇慘無比的票房\n表現上。如今電影才上映一個月，竟已經在院線全面下檔，火速登上數位平台。\n\n\
  \n\n，其中北美票房為 1540 萬美元，國際票房為1540 萬美元；然而根據《\nVariety》指出，\n\n\n\n事實上《邊緣禁地》的幕後製作爭議連連，上映後便有工作人員跳出來指控，自己的名字\n\
  沒有被列入片尾名單中。擔任為傑克布萊克（Jack Black）配音的機器人「小吵鬧」 CG\n建模的 Robbie Reid 表示，他與另一位一起共事的3D模型藝術師，都沒有出現在電影的\n\
  片尾名單當中。更指出這是他入行多年以來，第一次遇到這種情況。\n\n\n另外，《邊緣禁地》遊戲所屬的 Geabox Entertainment 母公司 Take-Two\
  \ 執行長\n Strauss Zelnick 也在票房翻車後出面緩頰，希望外界「給這部電影一個機會」也說不\n論這部電影的表現如何，都不會影響團隊對於遊戲方面未來的規劃。\n\
  \n\n--"
