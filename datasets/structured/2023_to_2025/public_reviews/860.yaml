title: '[普雷] 邊緣禁地-措手不及 '
content: "雷文防雷資訊頁\n\n看預告片本來以為是搞笑片的說\n結果只有機器人是搞笑擔當\n以下多劇情雷，慎入\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n劇情大綱:\n\
  一群人到一顆曾經主宰宇宙的族群的母星球尋求他們留下的寶庫。\n\n先消毒:\n我沒玩過遊戲本體，以下純粹對劇情作吐槽。\n\n吐槽點:\n一、開頭交代了一堆就是沒交代小女孩怎麼被抓去關的?\n\
  \n二、小女孩解釋自身是由第一片鑰匙上的血漬製作出來的複製人，\n    但搞了老半天最後開寶庫的時候卻不合資格?\n    到底是複製失敗?還是一個科技大公司連檢驗血脈都辦不到?\n\
  \    導致開個寶庫都還要搞另一條女主身世之謎再來開。\n\n三、通片搞笑擔當機器人最可愛了，可是他去擋喋血黨的那幕蠻黑科技的\n    照遇到女主時說詞是，他的設計就是防止被暴力對待(可以理解為防超高?)\n\
  \    下一幕回到他抖了一下就\"蛻皮\"接著後續把子彈拉出來更是有笑點，\n    只是不解他等於把子彈吸收進去，而不是把子彈擋在外?\n\n四、決戰一幕我以為看到了X戰警的鳳凰女呢(X\n\
  \n結語:本來以為搞笑擔當是黑人，個人很愛他在野蠻遊戲系列中的表現。\n     看在機器人表現也不錯的情況，本片還是給推個普雷。\n\n--"
