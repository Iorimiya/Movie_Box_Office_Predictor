url: https://www.ptt.cc/bbs/movie/M.1720065408.A.DD3.html
title: '[新聞] 《邊緣禁地》遭粉絲質疑不符原作？凱特'
content: '《邊緣禁地》遭粉絲質疑不符原作？凱特布蘭琪承認因為「這件事」才接演


  原文：

  憑藉《藍色茉莉》中的精湛演技奪下奧斯卡影后的凱特布蘭琪（Cate Blanchett），更是每

  年的入圍常客。令人驚訝的是，她竟然會接下《邊緣禁地》這部以遊戲改編的商業電影，尤

  其因為與原作角色年齡不符在網路上引發熱議。凱特近期在宣傳時解釋了自己接演這部電影

  的主因，最大的原因就是她無法忍受疫情期間的隔離生活，為了逃避這一切，才決定接下這

  個角色。



  當時《邊緣禁地》預告釋出時，讓許多人訝異凱特布蘭琪（Cate Blanchett）竟然會接下這

  部片，雖然她也曾演出過《雷神索爾３》、《仙履奇緣》等類型的商業片，但演出遊戲類改

  編的電影，還是會讓人納悶「真的有需要請到她嗎？」對此，凱特布蘭琪（Cate Blanchett

  ）其實也知道網路上對她演出這部電影的聲浪，在接受《Empire》雜誌訪問時解釋了原因，

  回想當時疫情在全球擴散，許多電影拍攝被迫暫停，大家都只能在家中隔離，但這部電影，

  卻成為了她逃離這一切的一種方式。



  凱特布蘭琪表示：





  當然她也清楚知道《邊緣禁地》是以遊戲改編的電影，她為了更深入原作的內容買了一台PS

  5和其他人一起玩這款遊戲，她說：「我的拇指幾乎連操作手機都有難度了，但我還是買了

  一台PS5與他人一起玩。我想了解這款遊戲的極限以及粉絲們喜愛這個角色的原因。我真的

  被那個世界深深吸引了，甚至看了很多cosplayer和YouTube的化妝教學。」


