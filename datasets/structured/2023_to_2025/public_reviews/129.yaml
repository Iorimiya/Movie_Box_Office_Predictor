url: https://www.ptt.cc/bbs/movie/M.1582880801.A.440.html
title: '[新聞] 疫情無法控制！病毒吞沒朝鮮半島…《屍速'
content: '疫情無法控制！病毒吞沒朝鮮半島…《屍速2》最新海報曝光宛如人間煉獄！




  《屍速列車》延尚昊導演最新力作《屍速列車：感染半島》（PENINSULA），今日片商車

  庫娛樂與韓國同步公布兩張最新前導海報！由《宅配男逃亡曲》姜棟元、《軍艦島》李貞

  賢、《阿爾罕布拉宮的回憶》李蕊主演的《屍速列車：感染半島》，故事敘述在《屍速列

  車》發生的4年後，朝鮮半島因不明病毒肆虐而成為前所未見的廢墟之地，為了逃脫這人

  間煉獄，倖存者們將展開一場史無前例的逃脫計畫。今日所公布的兩張精彩前導海報中，

  白晝版可見姜棟元與李貞賢身處了無生氣的朝鮮半島，拿著長槍躲在車後，身後面對的是

  數以萬計的活屍大軍，究竟他們會採取什麼樣的方式消滅活屍、逃出這人間煉獄，令人十

  分好奇！另一張黑夜版則可看到在朦朧的月色中，某名男子宛如吹笛人般被成群的活屍包

  圍，面對這不尋常的氛圍，人類與活屍們究竟會有什麼樣的發展，同樣備受期待。


  《屍速列車：感染半島》不只故事設定比前作更加強烈，這次的選角也引發關注。與玄彬

  、孔劉、蘇志燮齊被喻為「韓國四大公共財」之一的演員姜棟元，這次在劇中飾演關鍵人

  物，將在毫無生氣的朝鮮半島上，與占領整個國家的活屍們展開熾熱的決鬥，挑戰多場精

  采絕倫的動作戲。另外，在《軍艦島》等作中展現多樣演技的青龍影后李貞賢，在《屍速

  列車：感染半島》中飾演一名倖存者，即使身處荒蕪的朝鮮半島，但仍勇敢地與活屍對抗

  努力求生，展現如戰士般的強韌戰鬥力。


  延尚昊導演近期於綜藝節目時透露，由於求學時常被孤立，而意外從活屍世界中獲得安慰

  與希望，但沒想到竟能透過《屍速列車》改變自己的人生！延尚昊導演也表示，這次《屍

  速列車：感染半島》將展現更勝《屍速列車》的視覺效果和寫實驚人的活屍陣容。而《屍

  速列車：感染半島》目前也預計將在北美、法國、英國、印度、日本、泰國、新加坡、菲

  律賓、澳洲、越南、香港等地上映，繼《屍速列車》後，預料將再度於全世界掀起一陣觀

  影熱潮！眾所期待的《屍速列車：感染半島》暑假在台上映，敬請期待！






  --'
