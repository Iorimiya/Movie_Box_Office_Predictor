url: https://www.ptt.cc/bbs/movie/M.1682260716.A.512.html
title: '[好雷] 抗疫戰士，抑或病毒俘虜：《疫起》'
content: "本文涉及劇情，且具個人觀點，推薦觀影後再讀。\n\n\n\n　　　　圖文網頁版：\n\n　　　　\n\n\n　　　　預告片：\n\n　　　　\n\
  \n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\n\n抗疫戰士，抑或病毒俘虜：《疫起》\n\
  \n\n\n　　沉重的呼吸是無法預測的恐懼，也是「生」對「死」的回音。２００３\n\n年初，嚴重急性呼吸道症候群（serious acute respiration\
  \ syndromes,\n\n簡稱ＳＡＲＳ）自中國透過國際旅客傳到香港、越南、加拿大等地之後，台\n\n灣也在三月間被證實有境外移入案例。４月２４日，因ＳＡＲＳ在台北市和\n\
  \n平醫院群聚感染的事實再難掩蓋，台北馬市府下令封院，一千多人被迫集中\n\n隔離，一線醫療人員更在不知情且無防護裝備下直接接觸感染病人──這正\n\n是台灣電影《疫起》的背景。《返校》監製李耀華、《我們與惡的距離》、\n\
  \n《茶金》導演林君陽，以及有護理經歷的編劇劉存菡改編當年的事件，選擇\n\n從醫護內部視角去談論不同身份：醫生、護理師（當年仍被稱為護士，後討\n\n論亦稱之）、病患、家屬、記者、送回失物恰好被隔離的司機……面對疫情\n\
  \n擴散和突然封院的種種反應，試圖以對照的手法來呈顯「一個情境下的兩種\n\n選擇」，讓觀眾藉由「共感式的觀影體驗」隨著鏡頭理解狀況、感受情境，\n\n進而從角色的決定裡體會到人心的矛盾與艱難。\n\
  \n\n\n　　當年的ＳＡＲＳ對台灣頗多台北市以外的民眾如我而言，可能較無近身\n\n經驗，多數僅從新聞和歷史資料中得知大略始末，何況是至今已２０年。然\n\n\
  而經過２０２０年再次自中國武漢傳播COVID-19肺炎至今三年，台灣政府及\n\n疫情指揮中心團隊以更全面完整的防疫措施及醫療資源防疫有成，生活逐步\n\n解封的今日，正足以讓我們跟著走進劇裡的「北台聯合醫院」，體會那份內\n\
  \n在衝突。\n\n\n\n\n\n「看見希望」的Ａ棟ＶＳ「黑暗無光」的Ｂ棟\n\n\n\n　　最先被發現感染病患的Ｂ棟，在全院被封「只進不出」之後，為了避免\n\
  \n全院成為「病毒培養皿」，從原本的互相支援，被「暫且安全」的Ａ棟隔離。\n\n當醫生夏正（王柏傑飾）送便當、護士安泰河（曾敬驊飾）被迫前去支援，\n\n以及女童小瑜（賴雨霏飾）去找母親王莉貞，必須經過兩棟相隔的長廊時，\n\
  \n都被黑暗籠罩，一如恐懼會使人失去希望──故而之後「出去後想做什麼」\n\n的願望，各自身在Ａ棟的李心妍（項婕如飾）與Ｂ棟的安泰河的回答正呈現\n\n了「看見希望」與「四周無光」的對比。\n\
  \n\n\n　　Ａ棟對Ｂ棟的隔離，明顯並無良方，更無專業：片頭夏正在為陳宏文開\n\n刀時，並不知道病患已然染疫，廣播則召集主管前來開會；封院毫無預兆，\n\n\
  鐵捲門一拉、警衛聚集就隔開裡外；發送便當時，可以看到Ａ棟醫護刻意避\n\n開Ｂ棟員工，之後才派當時「手上沒有病人」的夏正送便當；院內人手不足，\n\n還將當時不在院內的醫護緊集召回「量體溫並且立刻上工」，否則就得離職。\n\
  \n從COVID-19的防疫經驗，我們知道「隔離」必須一人一室、分層分棟管理，\n\n電影裡卻是在人心惶惶、尚不知感染源、也不知道有誰是否染疫的情況下，\n\n\
  醫護病患家屬（還有記者）到處走動接觸，在大廳打地鋪，封院之後才開始\n\n發放口罩、生物防護衣等物資（當年必須用搶的），都暗中顯現當時「外行\n\n領導專業，嚴重迫害醫護生命權」的事實。當年還用「自動離職協議書」來\n\
  \n逼迫醫護在無保護措施之下繼續照顧病人，馬市長更是強言表達：「防疫如\n\n同作戰，如有抗爭視為敵前抗命，除了強制處分外，將會追究行政責任。」\n\n最終使７名醫護人員間接在體制不公之下犧牲，更是有無數醫護人員染疫，\n\
  \n該期間日日生活在死亡威脅的恐懼中──電影裡則僅以背景看見Ｂ棟用布條\n\n表達對此措施的強烈抗議，「我們願意接受隔離，不願接觸ＳＡＲＳ病人」\n\n間接呈現對乍然封院卻無保護醫護配套的不滿。\n\
  \n\n\n　　Ｂ棟隔離是否真的有用？事實上在夏正與記者金有中（薛仕凌飾）的調\n\n查裡，真正的感染源張華興和許富川，原先住在３ＡＩＣＵ（加護病房），\n\n\
  致使一位護士發燒；而４／２４日當天，原本下班要趕去為女兒慶祝生日的\n\n夏正被召喚回來進行手術的車禍傷患陳宏文是十際工程被服室的員工，對照\n\nＢ棟走廊看到遍地用紅色塑膠袋裝的感染衣物，都能看到封鎖前疫情已然擴\n\
  \n散，故而陳宏文動完手術亦因肺炎死去。可見Ａ棟與Ｂ棟早已不分，原本健\n\n康的人，都有可能像Ａ棟大廳的孕婦與夏正一樣忽然發燒；曾到Ｂ棟支援的\n\n安泰河，毫不知情的與染疫的王莉貞說話，難以確知他是在何時遭到感染。\n\
  \n這也符合歷史：依照衛生署機密資料顯示，感染的１５０人，有超過３０人\n\n是在封院之後。如果將疾病比喻為火焰，在有足夠防護措施的情況下，將人\n\n派去Ｂ棟支援將如消防隊員，抑制疫情的蔓延；反之就是將人送入火窟，往\n\
  \n來之中更使火苗帶回Ａ棟。再加上關掉空調，來到Ｂ棟必須穿上防護衣的工\n\n作環境，如同燃燒的地獄。\n\n\n\n\n\n金有中ＶＳ夏正－「每個人都有自己的戰場，而我的位子在這裡。」\n\
  \n\n\n　　在這樣的環境裡，導演用角色對照的手法呈現「私我」與「奉獻」的選\n\n擇：夏正與金有中原是醫生與病患的關係，後者在住院期間感受到院內不尋\n\n\
  常的氣氛，雖已痊癒卻遲未出院，當時院內早已有零星感染，他的獨家報導\n\n雖云推測，卻與事實相距不遠。夏正原本對金有中私下採訪獨家的行為不滿，\n\n但被金有中提醒「靠上面假裝在開會的人無用」後，一為解除隔離，一為追\n\
  \n求真相，兩人一起尋找感染源，才逐漸發現早已無法置身事外，最終各自在\n\n戰場上選擇自己的位置。金有中乍看為求獨家不擇手段，在夏正確知第二天\n\n下午可以撤離後與之道別，或許是之後可能無法再見，金有中說出自念書時\n\
  \n就想當記者，「幹一些大是大非的事」，如今面對病毒就像在打仗，「我在\n\n第一線，很幸運」、「每個人在戰場，都有自己的位置。」這使夏正在整理\n\n物品時，對著醫師證思索；安泰河前往Ｂ棟支援，以及病患上吊急救無效、\n\
  \n李心妍崩潰時的哭喊，都間接影響夏正轉往Ｂ棟支援的決定。\n\n\n\n\n\n夏正ＶＳ李心妍－「我想要多學一點。」「你怎麼不乾脆轉科？」\n\n\n\n　　同在胸腔科的師徒身份，原先實習醫生李心妍對主治醫生夏正的消極頗\n\
  \n有不滿，表現出積極學習的態度；在封院的消息傳來，李心妍還不清楚此事\n\n時，走廊上有病患（樓一安飾）昏倒，眾人畏避，是她與安泰河一起確認是\n\n氣喘，其他護士馬上依指示專業行動。但在病患上吊時，夏正冷靜做出專業\n\
  \n判斷，李心妍則可能因經驗不足與事發突然，一度呆滯原地。李心妍的哭喊\n\n也聽進夏正耳裡，呈現資深與菜鳥、倦怠與熱血的對比。\n\n\n\n\n\n安泰河ＶＳ林志偉－「死只是一下子的事，至少好好說再見。」\n\
  \n\n\n　　林姓病患已胰臟癌四期，卻不願加重兒子志偉的負擔而選擇隱瞞消極治\n\n療，明明渴望兒子關心卻總是嫌棄他的到來，畢竟兒子的疲累與逞強顯而易\n\n\
  見──父子皆心知肚明卻也不能坦承。「久病無孝子」的無奈看在因九二一\n\n地震而失親的安泰河眼中，是滿滿「子欲養而親不待」的悲傷。在聽聞兒子\n\n因父親久病，生活早已難以負荷後，只能用「死只是一下子的事，至少好好\n\
  \n說再見」相勸──事與願違與命運無常，無論指責哪一方都過於沉重，只是\n\n生死之間，安泰河的「勸告」有著難以反駁的重量，在現實無法改變的情況\n\n下，增加的只是對方的壓力與痛苦，父子怎麼會對此毫無察覺？加上疫情與\n\
  \n封院的壓力，最後就是父親選擇上吊結束生命。這段劇情帶出安泰河較為深\n\n入的性格，鋪陳他最後投入急救、與李心妍道別的決定，也呈現了被封院、\n\n生死隨時越線的「異常」狀態，讓安泰河採取了「轉移壓力」、卻未必適合\n\
  \n護士的行動。\n\n\n\n\n\n安泰河ＶＳ李心妍－「出去後你想做什麼？」「我想要……跟以前一樣。」\n\n\n\n　　即使發生了重大事故，人們也得同時想著其他事才能活下來，那些「日\n\
  \n常」是人們稍微喘口氣的瞬間。電影安排這對醫護情侶前後討論「去無國界」\n\n的決定，呈現戀愛日常與染疫非常的對比。但這份日常在揭露安泰河曾去\n\nＢ８（最早確認有ＳＡＲＳ的病房）支援，被同事「集體要求」應去Ｂ棟幫\n\
  \n忙時，向來和善熱心、人緣極佳的他，瞬間因可能染疫成為眾矢之的，醫護\n\n對不明疫病、不明決策的恐懼不安有了發洩的對象，彷彿排斥才能獲得安全\n\n感的自衛本能都在此刻呈現──這樣的反應極具傷害性，不僅平日一起與病\n\
  \n痛死亡搏鬥的同事，連他悉心照顧的病患都在此刻視其如疾，讓安泰河完全\n\n沒有反抗，在遭受背叛的痛苦當中直面他同樣認同「Ｂ棟危險」的恐懼而選\n\n擇了投入──安泰河的處境可說是被隔離的Ｂ棟處境：只要有染疫風險即被\n\
  \n歧視與排斥。李心妍雖為他抗議，也有堅守工作崗位的使命感，但恐懼仍真\n\n實存在，使她最終選擇留在Ａ棟。當安泰河去了Ｂ棟與李心妍通話時，後者\n\n說看到窗外有人用蠟燭排出台灣的形狀，很漂亮，安泰河則回答他這裡沒有\n\
  \n窗戶，「看不到」；以及最後安泰河確認發燒染疫後，隱瞞病情實踐曾云\n\n「至少要好好說再見」，尚不知情且剛為同事罷工心力交瘁的李心妍試著為\n\n之打氣，在頂樓的大雨之下，淋濕他們的是對現況的無能為力。\n\
  \n\n\n\n\n醫護的留守ＶＳ罷工－「這是激將法，出去就輸了。」\n\n\n\n　　電影中除了Ｂ棟抗議，Ａ棟亦曾因配套不足、有染病死亡之虞、和不斷\n\n\
  延長的隔離時間等原因發動過罷工，畢竟個人無法對抗公權力的執行，內心\n\n恐懼無法得到安寧，罷工是當時可以安頓身心的消極抵抗。然而同在醫院，\n\n本就病床、單人房、人手均不足的情況下，病人無法得到妥善照顧，甚至上\n\
  \n吊無人發現，防疫自是更加險峻。在病人死去之後，李心妍的拍門崩潰令眾\n\n人無動於衷，實非無情，而是那些話語裡「使命感」的強調幾乎無視醫護亦\n\n是肉體凡身，同樣會恐懼、擔憂，牽掛家人，內心的抉擇序位不同，要求幾\n\
  \n乎被放棄的醫護承擔院內病人的生命委實太過沉重。「我也很想回家」、夏\n\n正想為女兒過生日的願望、王莉貞護理長的喪命和不惜入院也要找她的女兒\n\n小瑜皆是如此。然而，李心妍的抗議除了道德性非難（一如待在房裡的文潔\n\
  \n所言：這是激將法，出去就輸了）與憤怒男友被迫去Ｂ棟的情緒發洩，更多\n\n的是在極度恐懼無力不甘下用來支持自己「至少我可以做這些」來抵擋恐懼\n\n的方法，她喊得愈大聲就愈證明恐懼的重量早已難以負荷──即便心知逼別\n\
  \n人承擔恐懼只會造成反彈，但此刻的她別無選擇。反而是她宣洩之後的痛哭，\n\n才真正哭出了眾人心中的糾結、不安與脆弱──或許只有面對脆弱、找到防\n\n禦與支持內心的平衡，才能真正思考「我可以做什麼」並行動，推測這也是\n\
  \n原先帶動罷工的護士文潔（李雪飾）最後回到崗位的原因。\n\n\n\n\n\n小瑜ＶＳ計程車司機：「要懂得先照顧自己，知道嗎？」\n\n\n\n　　女童小瑜獨自闖入醫院卻無人照顧，令人不禁揣想她該不會是單親家庭？\n\
  \n計程車司機（張永正飾）的處處照顧呈現了人性的溫暖，同樣令人反思：若\n\n非遇到好人相助，小瑜該怎麼辦？這些醫護也有家人，甚至可能是家中的唯\n\n一支柱，「如果我們大家都被感染的話，請問誰照顧病患」既是選擇自保，\n\
  \n更是專業實難替代的真實現況，畢竟養成一位專業成熟的醫護實屬不易。在\n\n不知感染源、也不知如何控制病毒漫無邊際的擴散，加上封院而無配套的事\n\n實（口罩甚至是封院後才發放），如同將沒有裝備、赤手空拳的戰士推向前\n\
  \n線，如此恐懼要怎麼收斂才是「專業」？抑或根本強人所難？染疫死亡或造\n\n成終身跟隨的後遺症，若也該是醫護必要的「奉獻」，那麼對他們家人造成\n\n的傷害又該如何補償？\n\
  \n\n\n\n\n夏正ＶＳ安泰河－「你沒那麼偉大啦！」\n\n\n\n　　身為電影的最主要角色與醫／護代表，一開場便是兩種工作態度的對照：\n\n急於下班的夏正，被已過下班時間，還支援學妹、問候生病的阿長、甚至留\n\
  \n在護士站寫紀錄的安泰河提醒「還沒到交班時間」。之後兩人還相遇了三次：\n\n一次是在樓梯間，安泰河再次提醒夏正記得還有金有中這個病患，卻被夏正\n\n「他比我還健康」回應時說：「你怎麼都只想到你自己啊？」夏正回答：\n\
  \n「你沒那麼偉大啦！」把兩人的差異再次檯面化，亦是整部電影裡「私我」\n\n與「奉獻」兩種選擇的代表；第三次是安泰河因有染疫之虞，被同事逼去\n\nＢ棟支援，去送過便當的夏正並無迴避，反而主動上前給他飲料並提醒：兩\n\
  \n棟狀況完全不同。\n\n\n\n　　但深入探索便知，兩位角色所代表的並非只是積極與推託的態度：在封\n\n院的４月２４日當天，是夏正的女兒亞亞生日，從他與妻子、與計程車司機\n\
  \n的對話可知，過去他也曾有投入醫療的熱血，看見林姓病患上吊的即時反應\n\n亦可證明，卻因此與家庭缺少相處的時間，「救活了理所當然，出了什麼事\n\n就等著被告」澆熄了他的熱情，為了早日返家，甚至不惜向學姐吳主任（謝\n\
  \n盈萱飾）要求「我可不可以在第一批撤離名單」；安泰河則在九二一地震失\n\n去了全部的家人，思親時只能聆聽過去與母親一起錄答錄機的留言，他的投\n\n入與積極，是過去失親創傷的心理補償，和人生價值所在。亦即夏正的自私，\n\
  \n來自想珍惜（甚至可能是補償與挽回）家人的努力，以及過去被背叛的心灰\n\n意懶；安泰河的無私，出於「奉獻讓我感受到生存意義」的利己主義，過去\n\n「乍然死亡」的恐懼與創傷封閉在記憶裡獨自面對並驅使他的行動。在疫情\n\
  \n擴散的情況下，夏正因為旁觀安、李、金的選擇，逐漸找回當年成為醫生的\n\n初心，確知染疫後仍積極急救染疫的孕婦，「醫生要先照顧病人才能離開。」\n\n重新感知「爸爸剛剛救了一個人」的成就感與喜悅。安在經歷被同事、病人\n\
  \n背叛、自己也在支援Ｂ棟染疫之後，因不忍看見隔壁病房的病人倒下，心靈\n\n的苦痛凌駕肉體煎熬，堅持拖著病軀完成ＣＰＲ，也在精神上得到「我還能\n\n做這些事克服痛苦」的淨化。兩人在最後的對視，既是彼此理解，更是在克\n\
  \n服了對疫病與死亡的恐懼後，給予彼此勇敢的肯定與重生。\n\n\n\n\n\n角色對照的危險\n\n\n\n　　創作是現實的裁剪與抉擇，《疫起》亦非例外。這些以角色對照不同態\n\
  \n度的手法固然在二個小時內呈現人性的各種樣貌，但也容易產生：\n\n\n\n１、電影試圖收納許多情境，再藉由角色與角色之間的對立呈現人物的不同\n\n面向與人性矛盾，誠能在有限的戲份裡讓角色的特徵鮮明，但角色與角色之\n\
  \n間態度的對照大多前後一致，容易使觀眾感到疲乏，且最後都選擇奉獻專業\n\n甚至生命，除了夏正之外，易使其他角色的形象與變化單薄。\n\n\n\n２、和平醫院疫情因政策錯誤最終造成１５０人感染，包含醫院員工、病患\n\
  \n及其家屬，其中３５人死亡，１人在封院期間上吊輕生。電影淡化真正的主\n\n因，只在背景、配角暗示醫護抗議罷工是來自政策失誤的恐懼，致使其他角\n\n色一旦選擇自保，與主要角色的「奉獻」對照容易顯得自私及無理取鬧。\n\
  \n\n\n　　舉例來說，夏正為染疫孕婦開刀的過程，最令人印象深刻的莫過於「幫\n\n我拿掉護目鏡」的決定，乍看之下是醫護良心的展現，但若強調政策錯誤的\n\n\
  背景，便會在使命感之外，亦能呈現「最快消滅歧視的不是愛與包容，而是\n\n處於同一立場」的幽微人性──正因已經不再需要擔憂染疫，才能全心面對\n\n病人──進而突顯當時政策的荒謬，以及醫護亦是人，不該神化或英雄化，\n\
  \n更能使觀眾體會到自私自保（隱瞞病情或歧視病人）反而會致使更多的死亡。\n\n屢次在奉獻與自保之間選擇奉獻看似偉大，卻與人性相悖；沒有絕對的善惡、\n\n沒有最好的選項，在兩個很爛的選項之間挑一個比較不痛、比較不爛的選擇，\n\
  \n更能在考驗中看見真正的人性。相對來說，安泰河的兩次手術鮮明堆疊出過\n\n去「面對死亡」的極度恐懼與失親的心理創傷，反而增加了他的人性而非神\n\n化，更使角色立體，之前勸病患的片段也有了「道德勒索」外思索其更真實\n\
  \n的脆弱，因此是我最喜歡的一場戲。\n\n\n\n　　誠然這樣「善」「惡」分明的安排更易理解，或者認知每個角色的選擇\n\n可以作為當下情境的兩難，藉由他們的抉擇對比出人類的脆弱與堅強。但能\n\
  \n考量因封院政策幾無保護措施，才更能明白被逼赤手空拳站上疫情戰場的前\n\n線，恐懼是人性無從苛責；但醫護工作的責任心與使命感，為皆所共有，無\n\n論作何決定，都是當下權衡，進而逐漸明白無論恐懼與希望，戰爭都持續存\n\
  \n在，面對自己的脆弱後仍選擇堅持專業，冒險犯難並忠於職守，更能顯現高\n\n貴的情操。畢竟真正的勇氣是儘管感到害怕，仍能迎難而上；儘管感覺痛苦，\n\n仍能決心面對，這是他們經歷的艱難與堅韌──而經歷過三年疫情的我們，\n\
  \n對此掙扎應更有感。\n\n\n\n　　儘管電影裡淡化結構與政策的影響才是「疫起」後加重「人禍」的主因，\n\n進而減弱了人性衝突與抉擇艱難，但本片無論是場地調度、音效安排，以及\n\
  \n演員表演的精采，許多片段仍有可觀之處。例如夏正送便當到Ｂ棟，眼見關\n\n掉空調、全身包裹在白色生物防護衣的護士倒下後仍撐持起身說「我沒事」\n\n比ＹＡ後繼續進入病房，真正呈現戰士堅守前線的韌性；夏正每一次與女兒\n\
  \n的通話，都透露了他當下「該留？該走？」想法的拉鋸；金有中吐實時略帶\n\n靦腆但堅定，以及和知道夏正染疫時點菸顫抖的恐懼；夏正與安泰河兩次交\n\n錯、總共四場的急救對照，呈現先前的無力痛苦和之後的盡力搶救，是醫護\n\
  \n在專業前線的苦痛、掙扎與成就；頂樓象徵絕望、卻還努力把關懷傳送給對\n\n方的雨；拍門抗議時屋內罷工醫護的倔強神情，是抗議體制的堅持，更是電\n\n影裡難得另一立場裡勇敢與脆弱並存；計程車司機為小瑜綁口罩帶子、小瑜\n\
  \n自己戴上的細膩互動；夏正送完便當從Ｂ棟回到Ａ棟，及安泰河從Ａ棟進入\n\nＢ棟工作後，脫掉雨衣／防護衣和洗澡時用力過度留下的傷口、口罩在臉上\n\n留下的痕跡，以及兩人共三次量體溫時確知有無發燒的反應，都是對病毒侵\n\
  \n體的恐懼……\n\n\n\n　　在觀影的同時，尚能想像著自己能夠做到何處，卻是他們在彼時彼刻不\n\n容思考的掙扎與抉擇；看完後深入理解當時抗疫卻如同被犧牲放棄的艱難處\n\
  \n境，會加倍感念所有曾經付出的醫護人員──防疫是一場戰爭，醫護是站在\n\n最前線的戰士，在疫起的同時，誰都不該逼使他們赤手空拳成為病毒的俘虜，\n\n還得發揮使命感成為聖人或英雄，而是應該一起抗疫，成為他們的後盾與支\n\
  \n援。\n\n\n\n〈悼念當年的抗煞殉職醫護〉\n\n陳靜秋 / 台北和平醫院護理長\n\n2003年5月1日殉職\n\n陳呂麗玉 / 台北和平醫院清潔環保員\n\
  \n2003年5月3日殉職\n\n林佳鈴 / 台北和平醫院護理師\n\n2003年5月11日殉職\n\n林重威 / 台北和平醫院醫生\n\n2003年5月15日殉職\n\
  \n楊淑媜 / 台北和平醫院護理書記\n\n2003年5月28日殉職\n\n蔡巧妙 / 台北和平醫院醫檢師\n\n2003年6月13日殉職\n\n鄭雪慧 / 台北和平醫院護理部副主任\n\
  \n2003年5月18日殉職\n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\n\
  \                                  陳斐雯  貓蚤札（其三）\n\n--"
