title: '[討論] 黑水與T病毒的相似性(有劇情雷）'
content: "之前有發了文章，但是有點被人身攻擊所以刪掉重發。\n第1: 我知道這裡是電影版不是八卦版。\n第2: 這是我自己的看法，如果不讚同，也不要對我人身攻擊，我查了國外的異形百科跟\n\
  惡靈古堡相關資訊。\n第3: 這不是比較黑水跟T病毒誰比較強，只是探討這兩種病毒的相似點。\n\n--請不要人身攻擊---請不要人身攻擊--\n\n\n---------------------------------------------\n\
  有雷（聖約雷、普羅米修斯等）\n\n以下是介紹黑水跟T病毒的外觀及傳染途徑。\n\n背景簡介：\n黑水(Chemical A0-3959X.91 – 15,or\
  \ Black goo)\n是由工程師所製作的致命病原體(實際試突變劑)，目的用於戰爭或是生物上使用，因為容\n易 在環境及溫度下性質不穩定，故工程師將它放在\
  \ Steatite黑罐內(在普羅米修斯內有\n呈現)。\n\nT病毒(Tyrant-virus)\nT病毒的原型是非洲的Ebola virus 具有90%的致死率，在1978年保\n\
  護傘公司在此病毒中 發現無限潛力，私下進行研究，在1978年由三位人員( Dr.  James\nMarcus , Captain Albert Wesker,\
  \ and Dr.  William  Birkin) 將此病毒與水蛭的DNA\n結合產生了T病毒。此T病毒日後也 成為保護傘公司研發出其他病毒的基礎。\n\n\
  兩種病毒外觀\n\n黑水:在靜止期呈現出液體形式\n\n（普羅米修斯畫面）\n\nT病毒:一般情況下在裝在試管內，呈現液體形式。\n\n（惡靈古堡網頁）\n\n\
  傳染途徑: (以傳染人類來比較)\n\n1.  吸入性感染:\n黑水 在接觸到空氣中的黑水分子時，會引起意識混亂及休克，細胞突\n變、DNA重新編碼，在50個\
  \ 小時後，會變成非常有侵略性及暴力行為。\n\n案例：\n在聖約的片段中，殖民船第一位隊員踩到了森林中的黑水形成的胞囊，黑水份子由他的耳\n道進入到人體進行突變，但不到漫畫中設定的50小時，他已經進入破背體階段，幼型異型\n\
  \ 破體而出。 第二位隊員在進入太空船時，用手摸了地上的黑水胞囊，黑水份子從鼻腔進\n入，短短幾小時異形破體而出。\n\n（引用預告片的畫面）\n\n\nT病毒：在原始形態的T病毒是靠空氣傳播，但是一旦感染有機體，也會從皮膚及液體接\n\
  觸進入人體進 而引發突變，引起腦部病變，會出現強烈飢餓感、動作緩慢、暴力行為等\n。T病毒能夠消耗宿 主內細胞的能量，來產生有絲分裂，進而造成宿主細胞壞死，而T病\n\
  毒融入宿主的DNA來改變 宿主的DNA。\n\n案例：\n在惡靈古堡1的背景，裝有T病毒的試管不慎被打破，T病毒從中央空調散發到整個大本營\n，導致研究室人員全部被感染，幾小時後發生突變。\n\
  \n（惡靈古堡1的畫面）\n\n2.攝入性感染:\n\n黑水在喝進黑水1小時內，會產生敗血症、意識改變、抽蓄、嚴重內出血、DNA溶解等。\n\n案例：\n在普羅米修斯時，大衛給男主角的酒裡滴入了黑水，男主角喝完後，過了幾小時出現了內\n\
  出血，以及意識改變等。\n\n\nT病毒在水裡放入T病毒，能使飲用者受感染源的人類感染到T病毒，進而突變。\n\n案例：\n馬庫斯博士將T病毒倒入水庫造成了浣熊市居民大規模感染，變成喪屍，一樣造成宿主的\n\
  腦功能改變，有侵略性等。\n\n3.直接接觸感染\n\n黑水：直接受到由黑水形成的生物時攻擊時，會產生突變。\n\n案例：\n普羅米修斯的生物科學人員，接觸到像蛇一樣的生物，被攻擊後產生突變，具有攻擊性等\n\
  。\n\nT病毒：直接被T病毒感染的宿主攻擊，如咬傷、割傷等都會造成突變。\n\n案例：\n惡靈古堡電影系列，任何人被T病毒感染的宿主攻擊，都會被感染變成怪物。\n\
  \n相似點：\n1.黑水跟T病毒都是被製作出來的病毒\n2.外觀ㄧ樣呈現液體狀\n3.感染途徑ㄧ樣\n\n以上雖然是不同電影系列的病毒，但是還是有些相同處。\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n--\n05/14 14:24"
