content: '原PO對電影內細節的解說很有趣


  設想到不同的情況，都還蠻符合的。


  我是這禮拜三才去看的，之後來版上看了有相同不懂的疑問


  或者自己沒發現的事情


  "這邊想提一個當初在電影院看到就覺得奇怪的事" (或許之前有人提過了)




  那就是，為什麼會沒有某個的稱呼


  電影裡面會有現實的地名等等，我想世界是相同的


  因此電影中也是會有電影的


  自然也會有活屍、喪屍、殭屍等等片子吧@@~


  當然逃命被追殺時不會去管這麼多


  但是在暫時安全時就可以去思考了---"那是什麼東西。"




  老實說各個活屍題材的電影中，活屍的表現都是差不多的(臉部特徵、奇怪舉止)


  就像原PO那篇病毒所說，這是有可能的。


  所以如果在思考那個是什麼的時候，活屍、喪屍等等


  應該是會說出來的


  幹！ 還真的有活屍這種東西啊！(喘氣      類似這樣



  可是這部電影好像不是著重在那個東西是什麼上


  沒有某個稱呼出現。



  如果有人提過，我再刪除，感謝閱讀。


  --'
