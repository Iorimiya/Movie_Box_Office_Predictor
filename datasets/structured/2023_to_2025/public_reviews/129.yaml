title: '[討論] 《蟻人》病毒式行銷影片'
content: "為了宣傳即將上映的《蟻人》，Marvel最近在YouTube設立了一個名為WHIH的頻道，並陸續\n\n上載了一系列病毒式行銷短片。這些短片的內容為WHIH新聞台有關Marvel電影世界中各類\n\
  \n事件的報導，而負責報導這些新聞的主播，正是先前曾在《鋼鐵人》系列中登場過、由萊\n\n絲莉˙畢伯（Leslie Bibb）飾演的女記者克莉絲汀˙艾維哈（Christine\
  \ Everhart）。\n\n\n\n在今天公佈的第二支病毒式行銷影片裡，克莉絲汀提到了《復仇者聯盟2：奧創紀元》的蘇\n\n科維亞（Sokovia）事件過後，政府對於超能力者的控管與資訊透明程度已經成為了社會\n\
  \n關注的焦點議題，很明顯指向了明年《美國隊長3：英雄內戰》的劇情；而另一方面，報\n\n導中也簡要說明了《蟻人》主角史考特˙朗恩（Scott Lang）多年前曾犯下的一起刑事\n\
  \n案件。\n\n\n\n報導中提到了：史考特多年前曾竊取自己任職的維斯塔企業（Vista Corps）數百萬元的\n\n資產，並將大部分犯罪所得歸還給該公司的客戶。史考特在法庭上曾數度宣稱這些金錢\n\
  \n皆是維斯塔企業不法從客戶手中取得的，但官方的調查中並未找到相關證據。\n\n\n\n值得一提的是，根據影片最後的標示，當年史考特涉案的維斯塔企業正是WHIH電視台的\n\
  \n母公司，因此他們的新聞報導可能隱藏了某些對史考特有利的資訊。\n\n\n\n除此之外，影片底下的新聞快報亦提到了珍˙佛斯特（Jane Foster）將會舉辦談論個人\n\
  \n宇宙旅行經驗的演講，以及史特拉克男爵（Baron Strucker）證實死亡、南非發生地震\n\n......等消息。可以預期的是，Marvel未來將會繼續利用這個頻道發布更多電影世界裡\n\
  \n的「新聞」影片，透過這些影片，觀眾也將能對系列作品之間的過渡有更多的瞭解。\n\n\n\n另一個有趣的地方則是影片底下的回覆，不只官方病毒式行銷玩得開心，網友們也樂於\n\
  \n扮演劇中的一般大眾留言。例如有網友對史考特即將出獄的報導就留下了這樣的評論：\n\n「記住我說的的話，把他放出來的話，他一定又會繼續去搶其他高科技設備的！」，其\n\
  \n他人則回覆：「我也不知道耶，老兄，這聽起來就跟他有朝一日會變成超級英雄一樣荒\n\n謬啊。」\n\n\n\n--\nQ for Quest:  \n\nMarvel電影世界觀百科：\n\
  \nMarvel電影世界觀百科臉書頁面：\n\n--\n                                 07/08 21:29\n\n已修掉爆雷推文"
