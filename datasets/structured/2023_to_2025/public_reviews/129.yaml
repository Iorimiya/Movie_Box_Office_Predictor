title: '[新聞] 確診甫一個月 湯姆漢克斯願提供血漿研究新冠病毒'
content: "新聞網址：\n\n2020-04-26 17:19 聯合報 記者陳建嘉／即時報導\n\n湯姆漢克斯與妻子麗塔威爾森於3月中確診新冠肺炎，經過多日悉心照料後已經復原，湯\n\
  姆近期仍在家安心休養，他近期在家接受外媒「NPR」的廣播節目電訪時，認真表示願意\n提供自己的血液做為醫學研究，並維持一貫幽默風格說：「假如真的研發出什麼了，我希\n\
  望可以叫做『漢克斯疫苗』。」\n\n湯姆與麗塔雖然已經痊癒，迄今已在家專心隔離，但仍很關注全球的病毒災害，眼見疫情\n並未緩和，也希望能盡自己一份心力，提供自己的血液做為學術研究，「我們所想的便是\n\
  目前可以做什麼？有什麼是可以做的嗎？實際上，我們認為自己可能以帶有抗體」，湯姆\n並說目前已與一些醫學機構取得聯繫，「我們問他們，想要我們的血漿嗎？我們可以提供\n\
  嗎？」並不忘持續為全球人民祈禱，希望這場浩劫趕快結束。\n--\n      \n\n\n\n--"
