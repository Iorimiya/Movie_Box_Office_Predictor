url: https://www.ptt.cc/bbs/movie/M.1585551323.A.D28.html
title: '[討論] 末日之戰的殭屍體內只有一種病毒嗎'
content: '記得這部片，

  主角最後發現了殭屍會自動略過生病的人不咬，


  因此想到往自己身上，

  注射其他病毒才逃脫，


  所以這病毒的作業方式是：

  感染人》把人弄死》成為體內唯一能存活的病毒


  因為先前已經由特別方式篩選過要感染的人了

  會這樣揀選可能代表這病毒就人緣差，而且容易被其他病毒霸凌，有任何其他病毒他就不能

  存在

  而如果把其他病毒

  注射到殭屍體內

  會出現

  1.變回人類（這可能性滿低的）


  2.病毒互殺，殭屍變屍體


  3.無效，因為早已變殭屍


  就片中殭屍的活動作息

  比較可能偏向哪種結局


  --

  有殘疾的人也不會被攻擊

  有這段哦？

  病毒要怎麼認知殘疾人士

  只能靠人腦生前記憶囉'
