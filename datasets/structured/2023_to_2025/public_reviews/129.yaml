url: https://www.ptt.cc/bbs/movie/M.1514690263.A.8F0.html
title: '[好雷] 現代感染/病毒入侵 Pandemic'
content: '這是一部製作看來很 B級的片，不過我是為了看美女，那就輕鬆看也是有點意思。女主角是《特種部隊：眼鏡蛇的崛起》的紅髮妹 Rachel Nichols
  ，幾年下來她除了跟馬王/海王 演的《蠻王柯南》算是主演大片外，大多只演小片小配角，倒是砸了四年演加拿大科幻影集《超越時間線》已不知不覺慢慢接近中年了。此片 Pandemic
  中她已經在演十幾歲女兒的媽，萬里尋女。



  電影故事背景是美國病毒感染大爆發，片頭馬上由上司用台詞介紹感染分五級、紐約已淪陷、醫生女主角老家資源短缺苦苦支撐。這背景加上個五級感染者會攻擊人甚至吃人的設定，簡直像是部僵屍片！而且電影特色就是用類似《超狂亨利》的第一人稱視角攝影，跟著女主角頭上的攝影機看她拿球棒拿斧頭拿槍打殭屍
  XD


  哎，我很直覺地就把這些感染者稱作「殭屍」了，因為電影的電動打怪視角拍起來，他們就像是見人就吃的殭屍，電影內固守基地堡壘的軍隊也完全是把這些感染者當殭屍來看，有誰敢接近殺了再說，儘管這些「殭屍」其實是有理智還會說話苦苦哀求的（！）。這層設定讓本來如《惡靈古堡》般打電動打爽的打殭屍故事，變得更像是種族隔離與滅絕的故事。片頭就讓女主角看一群來基地求援的感染者被無情殺死，穿著制服的她與基地軍人們才是有資格活命的乾淨人類，這一幕將得到片尾結局的呼應。


  主角是號稱「從已淪陷的紐約調來的」醫生女主角，帶著一輛巡邏車小隊含導航員、司機、槍手共四人，深入感染區的任務是找到生還者並研發解藥，不過人人心裡不免都蠢動地想著找自己的家人與愛人，這「愛」的老梗讓這
  B級片仍有抓住觀眾注意與認同的魅力。當然任務一出就不免老梗：隊員冷血殺殭屍、女主同情感染者、但同情不免令大家多次身處險境。嚴格說來女主的溫情並未真正害死哪個夥伴，而是她的溫情感動了夥伴們溫情起來後，各自因為一念之間的溫情之舉而死，其中兩個還算是慷慨赴義。


  中段我們發現女主角根本是假醫生！她只是撿到了個死去女醫生的吊牌就自己偷偷逃進基地，要假藉女醫生的身分想辦法進感染區救（希望沒被感染的）女兒！這令人匪夷所思的偷天換日反映的是軍隊的形式主義：只認吊牌不認人臉、只認制服不認真人、只用頭盔對講機不准用手機、甚至初期感染時只救醫生這資產而不救一般人命。


  當然電影絕大部分的戲都是冒險打怪、殭屍吃人，這對軍隊形式主義與非我族類的非人之控訴，電影一路潛隱從不直談，直到片尾才終於爆發出來！終於成功找到女兒，她受了還有救的第一級感染，媽媽當然不顧一切還是要帶女兒會基地，儘管明知軍隊只救第一級感染的醫生而不救一般人；媽媽體貼地把防護制服讓給女兒穿，自己穿得像一般人就一路殺出重圍開車回基地大門。哀傷卻甜蜜的一幕終於頭尾呼應：


  沒制服的女主角，如片頭感染者一般被當殭屍冷血射殺；有制服的女兒，雖也不是醫生沒資格被救，但靠制服上的編號被視為醫生就得救了。女主角臨死倒地帶著甜蜜笑容送別女兒，也許她終於知道那些苦苦哀求的「殭屍」們是什麼心情了。



  結論：此片談人性與感情夠認真、電動打怪有創意、社會控訴有點到、搖晃鏡頭不太舒服、整體製作品質中下、主角群演技中上... 對「紅髮妹」Rachel Nichols有興趣的，放假沒事值得找來看看。


  --

  《停車場夜驚魂》真是年底最應景！倒是 Rachel Nichols 穿比較多還超有魅力的，我還是推薦加拿大影集 Continuum《超越時間線》。

  這倒是真的 XD 不過花時間看電影當然是要找有趣的地方看囉～'
