title: '[討論] 死侍病毒影片'
content: '嘴砲王超級英雄「死侍」的電影《惡棍英雄：死侍》（Deadpool）即將在2016

  年2月跟大家見面，前面幾次的宣傳影音都令人啼笑皆非，而上週才剛結束的

  萬聖節死侍可是不會錯過他搞笑的機會，找來了縮小版的「X戰警」們，到公

  園討論接下來的作戰計畫，可是死侍說的話對小朋友來說會不會太「硬派」了

  一點？不過這也可以讓大家更了解明年二月將要跟大家見面的這位超級英雄，

  可是真性情的粗魯又嘴賤阿！


  其實「死侍」這個角色在《金剛狼》（Wolverine）的獨立電影就出現過，然而

  當時的設定實在太不符合漫畫原始設定，如果要照著漫畫設定發展又會過於血

  腥，導致實際上擁有非常多粉絲的「死侍」沒有辦法與大家見面。不過身為

  《惡棍特工：死侍》的編劇，Rhett Reese 在訪談中提到了兩個關鍵人物，是讓

  福斯公司願意放手一搏製作本片的原因。


  「如果沒有大衛芬奇與詹姆斯卡麥隆的幫助，我現在甚至不會有機會坐在這裡

  進行訪問。」


  當初 Rhett Reese 把劇本交給了這兩位已經有許多優秀代表作的導演，而大衛

  與詹姆斯對此非常讚賞，於是大力向福斯推薦將它拍攝成電影。以目前的預告

  看來肯定會是影迷們非常喜歡的「高娛樂性」作品，當然也有許多人想知道會

  不會繼續發展續集，或甚至與《X戰警》一起發展宇宙觀，Reese 則表示如果

  要往大亂鬥的方向發展，或許會再推出一集「死侍」的獨立電影續集，會比較

  有可能與其連接。不過負責整體妝容設計的比爾寇索（Bill Corso）則透露，《惡

  棍特工：死侍》將會有除了死侍之外的某些變種人。


  「我們可能會偷偷放入幾個變種人角色，甚至是讓其他幾個變種人小露個臉，

  我們有福斯公司所擁有的角色名單，挑出了幾個是我們會放進電影中的變種人

  角色。」


  看來《惡棍特工：死侍》將會滿足非常多觀眾的期待，儘管它目前還沒有確定

  會分在哪一個級別，為了呈現最「死侍」最真實的一面，就算是限制級也一定

  還是能吸引大批觀眾前往電影院欣賞，就讓我們好好期待一下這個嘴砲王會帶

  給我們什麼精采的表演吧！


  《惡棍英雄：死侍》由提姆米勒（Tim Miller）執導，《屍樂園》（Zombieland）

  編劇 Rhett Reese、Paul Wernick 操刀劇本，卡司包括雷恩萊諾斯（Ryan

  Reynolds）主演死侍、艾德斯克林（Ed Skrein）飾演 Ajax，莫雷納巴卡林

  （Morena Baccarin）飾演 Copy Cat、吉娜卡拉諾（Gina Carano）飾演 Angel

  Dust、T.J 米勒（T.J Miller）飾演 Weasel、布里安娜希德布蘭德（Brianna

  Hildebrand）飾演 Negasonic Teenage Warhead，2016年2月12日上映。


  影片:


