url: https://www.ptt.cc/bbs/movie/M.1585660213.A.FD4.html
title: '[新聞] 【武漢肺炎】第一部新冠病毒電影誕生！'
content: '【武漢肺炎】第一部新冠病毒電影誕生！伊朗裔加拿大導演盼探討疫情下的種族歧視






  新型冠狀病毒肺炎（COVID-19，下文稱武漢肺炎）疫情持續延燒，還沒有看到減緩的跡象

  ，但已經有第一部以它為題材的電影出現，這部由伊朗裔加拿大籍導演莫斯塔法（

  Mostafa Keshvari）執導的《冠狀》（Corona，暫譯），主要探討疫情下的種族歧視問題

  。


  《冠狀》片長63分鐘，在上個月拍攝完成，故事描述一間公寓裡、不同種族的房客，某天

  突然被困在電梯裡，因為武漢肺炎疫情，他們對在場唯一的亞裔房產生了恐懼心理。


  莫斯塔法30日向《好萊塢報導者》（The Hollywood Reporter）表示，某天他在電梯裡讀

  到關於中國觀光客被襲擊的新聞時，有了這部片的靈感，他認為應該要把場景設定在電梯

  裡。


  莫斯塔法說：「這部驚悚片在溫哥華的一個片場拍攝，已經剪輯完成並準備出售，它藉著

  發源於中國的武漢肺炎疫情，探討一群被（電梯）困住的公寓房客之間（對於種族）的恐

  懼和歧視。」


  為了讓電影的基調更寫實，莫斯塔法採用了一鏡到底的拍攝方式，他也鼓勵演員們自由修

  改台詞，以強調他們對於受困於電梯，和可能感染冠狀病毒的恐懼。莫斯塔法說：「你看

  的到這些角色的真實感，他們彼此交談，然後他們的恐懼化為現實。」


  莫斯塔法拍攝《冠狀》時，還不知道武漢肺炎會演變成席捲全球的傳染病，他表示：「它

  曾經被視為中國的病毒，但是現在任何人都可能感染它，所以它現在已經不只是一個種族

  問題。人類必須團起來才能戰勝病毒。」


  莫斯塔法透露，在疫情爆發的初期，他就曾被警告武漢肺炎可能會襲擊溫哥華，因為當地

  有大量的華裔移民，這些華裔移民正面臨著恐懼和仇外心理（xenophobia）。


  現在，武漢肺炎的疫情也蔓延到莫斯塔法的故鄉伊朗了，他很擔心老家的父母：「對於可

  能失去所謂的愛之人的恐懼，只會加快你拍片的速度。」


  莫斯塔法原本想帶著《冠狀》參加影展，但是後來決定透過影音串流平台上映。目前已經

  有發行商買下這部片，正在將它兜售給影音串流平台中，下面你可以看到這部電影的預告

  片。




  --'
