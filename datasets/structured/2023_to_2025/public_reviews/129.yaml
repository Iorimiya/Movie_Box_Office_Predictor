url: https://www.ptt.cc/bbs/movie/M.1507613611.A.48C.html
title: '[問片] 關於一部病毒，突變的電影'
content: "問一部電影，因為是在夢中突然想到的，不太確定是不是做夢，但我覺得很熟悉，我\n看過很多次這個橋段，我也只記得這個橋段，以下開始：\n\n   \
  \ 兩個男主角，男a男b，男a不知道被什麼東西感染，全世界的人類也正遭受這東西的\n摧殘，他們也找到解決辦法，要先將病患逼到發作的那一瞬間殺死他們，才有辦法得救。\n\
  \n    男A帶著男B到能解決問題的醫療機構，一進去就看到有個人在隔離的玻璃櫥窗內被火\n燒且不停地增生。\n\n    之後他們進了診療室，醫生跟男A好像認識，他問問男A要將身上哪個器官切除，男A\n\
  說脾臟，醫生看完覺得不行就說要切除一個腎臟。\n\n    做完手術之後，男A被送入剛剛那個隔離玻璃櫥窗，醫生叫男B先離開等等在回來，男\nB堅持不要，說要等男A出來，在這過程中醫生好像正在計畫用槍自盡，將手固定住並拿著\n\
  手槍往頭指著。\n\n    男A那邊正在進行將他逼到絕境的行動，裡頭的醫生講男A的手指一根一根折斷，男A\n很痛苦的叫著，折完後，裡頭的醫生笑著說：「好！你就這樣自生自滅吧。」但他手上正\n\
  拿著手槍，男A陷入絕望，開始發生異變，結果異變是從頭頂竄出，要處理的醫生站在頭\n的正後方來不及閃躲，直接被攻擊死掉了。\n\n    這持畫面轉到男B，醫生好像告訴他什麼秘密後，男B很震驚，外頭突然傳來尖叫聲，\n\
  男B跑出去看，發現玻璃櫥窗破掉了，有一隻長滿觸手以及畸形肉塊的不明生物正在爬動\n，不停的喊著吉米吉米，救救我。\n\n    好，這個回憶就到這結束了，剛剛起床一直在想這到底是什麼電影，因為我有印象是\n\
  在電影裡看到的，但不知道為什麼會常常夢到這場景。\n希望能有大神幫忙解答這是哪一部電影。\n\n--"
