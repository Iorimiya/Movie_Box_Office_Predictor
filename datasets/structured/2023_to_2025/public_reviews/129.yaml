url: https://www.ptt.cc/bbs/movie/M.1693406039.A.6EA.html
title: '[新聞] 李惠仁再推紀錄片 指最危險病毒是官員謊言'
content: '李惠仁再推紀錄片 指最危險病毒是官員謊言


  2023/8/30 19:29（8/30 20:16 更新）



  紀錄片「不能戳的秘密III：官官相護」由導演李惠仁執導，30日在台北舉行特映會，李

  惠仁出席留影。中央社記者王飛華攝 112年8月30日


  （中央社記者葉冠吟、楊淑閔台北30日電）以「不能戳的秘密」紀錄片揭露禽流感疫情危

  機的導演李惠仁，相隔10年再推系列新作，今天舉辦首映記者會，他說：「最危險的病毒

  是官員的謊言。」


  2004年台灣爆發H5N2禽流感疫情，當時除了對食品安全及生物環境產生影響，更可能衝擊

  總體經濟發展。李惠仁在2011年、2013年陸續推出調查報導紀錄片「不能戳的秘密I」、

  「不能戳的秘密II」，更親自撿病死雞解剖送驗，寫信詢問國外禽流感實驗室，把真相公

  布於大眾面前，戳破農委會隱匿疫情謊言，讓時任農委會主委陳保基承諾重啟相關調查。


  睽違近10年，李惠仁再繳出系列最新作「不能戳的秘密III：官官相護」，記錄現任農業

  部動植物防疫檢疫署署長邱垂章當年博士論文實驗曾使用H5N3病毒與抗原，卻未依循正式

  管道申請，沒經過生物安全會同意，就從農委會家畜衛生試驗所移到其就讀的台北醫學大

  學，李惠仁還發現這項研究也未依法提出動物試驗申請。


  李惠仁為更深入理解邱垂章的論文實驗是否曾向當時的家畜衛生試驗所正式申請動物試驗

  及病毒分讓，在紀錄片中多次去函要求農業部、台北醫學大學與監察院等單位請求重新審

  查，但始終不得其門而入。


  李惠仁說，在這十多年與政府機關互動的過程，發現官員們說話技巧逐漸提升。他接受媒

  體訪問表示：「他們會互相告誡不要接李惠仁的電話，不要回應他的質疑，媒體自然不會

  報導。」


  李惠仁表示，當年用了較有創意的「寄病死雞」手法，強迫農委會承認錯誤，但最終結果

  僅是被彈劾的負責人每個月扣薪1000元，最終還升官，「我覺得很悲傷，台灣能通過高等

  考試的公務員都很優秀，但進到這個場域後，發現高官不需要為自己的錯誤付出代價，年

  輕公務員會怎麼想呢？」


  他感慨直言：「最危險的病毒，其實是官員的謊言，假如你不處理，它就會找尋下一個宿

  主，然後，不斷地複製再複製」。


  今年8月1日農委會升格農業部，李惠仁認為這部紀錄片是獻給農業部最誠摯的滿月禮，盼

  能藉此痛定思痛，正視「官官相護」的問題，「歪斜的結構不幫他導正就會垮掉，如同一

  個人的手受傷長膿，還是得清創，掩蓋起來只會壞死敗壞」。


  在首映會現場，紙風車文教基金會董事長李遠（小野）、導演蔡崇隆、柯一正、蕭菊貞、

  黃嘉俊等人出席給予支持，李惠仁強調，監督政府與官員是公民的權責，期盼透過「不能

  戳的秘密III」讓觀眾理解，面對病毒、科學，應該要誠實與謙卑，國家和社會才能進步

  發展，也希望讓更多人看到這部作品。


  邱垂章接受中央社記者電話訪問時說明，民國95年開始他就讀台北醫學大學博士班，主要

  是進行疫苗佐劑開發，之後參與家禽流感疫苗有關的試驗，是以家衛所提供的H5N3死毒病

  毒為抗原，並未涉活病毒分讓與操作，依當時的規定，死毒病毒抗原尚不需要申請。


  他說，李惠仁在107年他就任家衛所所長時就提出質疑，之後又向台北醫學大學提起檢舉

  ，經台北醫學大學召開學倫會調查、多次審議，並提教務會議決議，在108年9月以並無發

  現違反學術倫理的情事，認定此案不成立。


  邱垂章表示，但李惠仁又將資料再訴諸監察院，經監察院調查，約詢並多次提供資料說明

  後最終於109年4月調查竣事，結論仍是沒有違反規定。邱垂章重申，李惠仁所提相關資料

  及所述內容，都是發生在10多年前並在多年前經過兩個不同單位的審視確認沒有違反規定

  的舊案，「不知道他這時候提出來的想法為何？」


  全片將於31日晚上10時在公視「紀錄觀點」、公視＋同步播出與上架。（編輯：管中維）

  1120830



  公視紀錄觀點「不能戳的秘密III：官官相護」特映會30日在台北舉行，導演李惠仁（中

  ）、紙風車文教基金會董事長李遠（小野）（左）及導演柯一正（右）出席並合影。中央

  社記者王飛華攝 112年8月30日



  導演李惠仁拍攝禽流感疫情紀錄片「不能戳的秘密」已來到第3集，「不能戳的秘密III：

  官官相護」30日在台北舉辦特映會，李惠仁應邀出席，分享拍攝心路歷程。中央社記者王

  飛華攝 112年8月30日



  以「不能戳的秘密」系列紀錄片揭露禽流感疫情危機的導演李惠仁，相隔10年再次製作「

  不能戳的秘密III：官官相護」。圖為國家動物傳染病檢驗實驗室畫面。（公視紀錄觀點

  提供）中央社記者葉冠吟傳真 112年8月30日


  「不能戳的秘密III官官相護」特映 導演李惠仁出席 |中央社即時影音




  --'
