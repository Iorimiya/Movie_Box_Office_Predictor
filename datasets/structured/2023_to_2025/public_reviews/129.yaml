title: '[問片] 病毒傳染的片'
content: '至少十年以上的美國片

  類似流感非僵屍片


  印象中電影描述致死率超高的病毒在流傳著

  得病的人好像會一直咳嗽


  男主角把自己家用類似保鮮膜密封起來

  拒絕任何人的求救

  連自己的女朋友都拒之門外

  中間情節有被人破壞闖入過

  男主角就放棄被破壞過的房間又重新密封


  最後外面的傳染病莫名其妙突然就消失了

  得病的人好像痊癒了!?


  然後醫護人員發現男主角早就得病了

  但是因為他家太密封了

  反而變成病毒完美的溫床

  結局就是男主角就被帶走去研究病毒了...


