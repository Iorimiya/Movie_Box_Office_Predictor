title: '[請益] 末日之戰 的病毒相關問題'
content: '剛剛又看了一次HBO重播的末日之戰


  當初這部評價似乎不太好


  但其實在電視上看還算不錯的娛樂片







  防雷







  想請問一個關於電影中病毒設定的問題


  電影中是解釋說感染病毒的活死人


  看見身體有缺陷或身染重病的人不會主動攻擊


  也鋪了很多梗暗示這點


  像是紐華克公寓外的流浪漢、南韓軍營的跛腳軍人


  以色列的老伯跟光頭小孩


  相關的設定應該是這樣沒錯吧


  那其實在WHO機構的時候，Brad Pitt根本不用自己深入險境啊


  身邊不是有個以色列女兵Segen因為被咬而把手砍斷


  既然南韓的跛腳軍人都因為身有殘疾而逃過一劫了


  那女兵少了一隻手掌應該更不會被咬吧？


  派她去拿病毒跟疫苗不就好了


  還是我有什麼遺漏的地方呢？




  --

  是因為主角發現線索時的回憶畫面有帶到軍人


  而且那段又有特別安排台詞，才想說設定上是不是跟身體殘疾也有關


  如果軍人是因為其他疾病而沒事，那感覺跛腳那段還滿沒意義的'
