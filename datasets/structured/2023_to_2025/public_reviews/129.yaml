url: https://www.ptt.cc/bbs/movie/M.1462293516.A.C13.html
title: '[討論] 《美國隊長3：英雄內戰》病毒式行銷整理'
content: "有在關注Marvel Studios作品的朋友們應該都知道，官方去年在《蟻人》上映之前曾在\n\nYouTube註冊了一個WHIH新聞頻道，並請《鋼鐵人》系列中登場的蕾絲莉˙畢伯（Leslie\n\
  \nBibb）再次扮演主播克莉絲汀˙艾維哈（Christine Everhart），推出多支報導蘇科維亞\n\n（Sokovia）事件餘波、以及專訪受刑人史考特˙朗恩（Scott\
  \ Lang）的影片。\n\n\n\n隨著《美國隊長3：英雄內戰》即將上映，這個頻道連日來又推出了多則報導，影片底下\n\n的跑馬燈也透露了一些小彩蛋，非常有意思。這些影片包括：\n\
  \n\n\n1.復仇者聯盟（Avengers）對世界帶來的衝擊\n\n  \n\n\n 跑馬燈：\n\n ˙ 一名受到美國隊長（Captain America）啟發的跑者在邁阿密的馬拉松活動上創下世\n\
  \n    界紀錄\n\n\n ˙ WHIH將播放以亞歷山大˙皮爾斯（Alexander Pierce）為主題的深入報導。\n\n\n ˙ 美國副總統展開全球尋訪，預計停留蘇科維亞與南非。\n\
  \n\n ˙陸軍中將薩迪斯˙羅斯（Thunderbolt Ross）宣佈退伍。\n\n\n\n2.拯救世界的代價，誰來支付？\n\n  \n\n  在報導裡，WHIH訪問了民眾對此議題的看法。有受訪民眾認為自己雖然沒有能力守護世\n\
  \n  界，但可以幫忙進行災後清理，也有民眾認為東尼˙史塔克（Tony Stark）等英雄們應\n\n  該為相關行動中的損害賠償負起完全責任。\n\n\n \
  \ 跑馬燈：\n\n\n  ˙ 傳記電影－《凡人或滿大人：崔佛˙史萊特利的故事（Man or Mandarin: The\n\n     Trevor Slattery\
  \ Story）》開拍。\n\n\n  ˙ 國家動物園迎接稀有白化症貓熊鈴鈴（Ling Ling）誕生。\n\n\n  ˙ 資遣謠言導致皮姆科技（Pym Technologies）股票重新上市的日期延後。\n\
  \n\n  ˙ 食品藥物管理局警告國民勿一窩蜂迷信全麩質食品。\n\n\n\n3. 復仇者聯盟與白宮\n\n   \n\n\n   報導中提到總統馬修˙艾利斯（Matthew\
  \ Ellis）面臨了不少政治壓力，並表示總統\n\n   日前已與卸下軍職的薩迪斯˙羅斯將軍會面，未來羅斯將有可能接下某個政府職位，\n\n   成為政府應對超級英雄問題的解決方案。\n\
  \n\n   跑馬燈：\n\n\n  ˙ 舊金山郊區出現多起疑似巨大螞蟻生物的神秘目擊事件。\n\n\n  ˙ 川西亞公司（Transia）宣佈臨時執行長人選。\n\
  \n\n  ˙ 紐約商家聘請知名街頭藝術家為其沙威瑪餐廳繪製復仇者聯盟主題壁畫。\n\n\n  ˙ 明尼蘇達州學校推出「超級英雄時代」學程。\n\n\n  ˙\
  \ 航空公司為廣受歡迎的經典電視劇與電影推出主題航程。\n\n\n  ˙ 實境秀明星推出以粗麻布為主題的時尚系列產品。\n\n\n\n4.總統專訪\n\n  \n\
  \n\n  在訪談裡，艾利斯總統表示自己非常在乎這些超人類災害所造成的恐懼效應，但他也十\n\n  分感念東尼˙史塔克、史帝夫˙羅傑斯（Steve Rogers）......等英雄的付出，而隨著\n\
  \n  薩迪斯˙羅斯將軍被任命為新任國務卿，總統也相信這位過往曾多次處理過類似事件的\n\n  專家可以順利讓美國政府與盟友及英雄們進行互助合作。\n\n\n\
  \  跑馬燈：\n\n\n  ˙ ATCU持續對破壞其設施的組織進行調查。\n\n\n  ˙ 南美新出土的化石可能揭示了人類的未知歷史。\n\n\n  ˙ 頂尖外科醫師史帝芬˙史傳奇（Stephen\
  \ Strange）將於WHIH的獨家專訪中展示嶄新\n\n     的手術救治技巧。\n\n\n  ˙ 為了與相同題材的傳記電影競爭，電視電影《十戒馭眾戒－崔佛˙史萊特利的故事\n\
  \n    （10 Rings to Rule Them All: The Trevor Slattery Story）》即將推出。\n\n\n  ˙ 卡爾弗大學（Culver\
  \ University）宣佈「尖端技術圖書館」將在整修後重新開放。\n\n\n  ˙ 樂透彩已多期無人獲得，獎金上看10億美金。\n\n\n  ˙ 遠景企業（VistaCorp）因超收有線電視費用而遭到起訴。\n\
  \n\n  ˙ 為蘇科維亞（Sokovia）歌唱」明星慈善活動已募得3億美金。\n\n\n  ˙ 亞伯拉罕˙厄斯金（Abraham Erskine）先前未曝光之文件在紐澤西被發現。\n\
  \n\n  ˙ 布魯斯˙班納（Bruce Banner）依舊不見蹤影。\n\n\n\n5.緊急插播，拉哥斯事件\n\n  \n\n\n  報導指出，復仇者聯盟在奈及利亞拉哥斯追捕「十字骨」巴拉克˙朗姆洛（Crossbones\n\
  \n  , Brock Rumlow）的行動中引發了多人傷亡，總統馬修˙艾利斯在緊急發布的聲明中表\n\n  示：國務卿羅斯已與奈及利亞政府連繫，美國並保證為當地提供一切必要的協助。\n\
  \n\n  艾利斯總統強調，此時正是各國團結一致的時刻，美國將儘速與聯合國合作進行調查，\n\n  並釐清整起事件應當負責的對象。\n\n\n--\nQ for\
  \ Quest:  \n\nMarvel電影世界觀百科：\n\nMarvel電影世界觀百科臉書頁面：\n\n--\n                     \
  \            05/04 00:39"
