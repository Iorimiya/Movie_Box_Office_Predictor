url: https://www.ptt.cc/bbs/movie/M.1452851014.A.A06.html
title: '[討論] 名模大間諜 病毒影片 我看了三小?'
content: '身為世界第一名模，各式各樣的廣告、代言商品自然是接到手軟！

  由班史提勒（Ben Stiller）飾演的名模祖蘭德即將在《名模大間諜2》

  （Zoolander 2）強勢回歸，同時也釋出了全新的香水與汽車代言宣傳

  影片，為了取得最佳鏡頭，違規數十次也在所不惜啊！


  此片同樣由班史提勒親自執導，並找來了在首集飾演 DJ 的賈斯汀賽理斯

  （Justin Theroux）執筆劇本，先前，兩人也曾在班史提勒另一部導演作品

  《開麥拉驚魂》（Tropic Thunder）中合作過編劇。雖然並未透露出太多的

  劇情細節，不過仍然期待能夠看到德瑞克（Derek）與韓塞爾（Hansel）

  兩人之間的針鋒相對，此外，逐漸被「潮流」淘汰的兩人也將攜手合作。


  卡司包括威爾法洛（Will Ferrell）、克莉絲汀泰勒（Christine Taylor）、克

  莉絲汀薇格（Kristen Wiig）、奧莉薇亞穆恩（Olivia Munn），以及肯伊

  威斯特（Kanye West）、金卡戴珊（Kim Kardashian）、小賈斯丁

  （Justin Bieber）等多位話題音樂人，2 月 26 日台灣上映。



  香水影片的中文翻譯:


  我到底看了三小?

  Mooooooooooooooooo!!!!!!!!!!!!!!


  --'
