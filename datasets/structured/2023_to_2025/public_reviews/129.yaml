url: https://www.ptt.cc/bbs/movie/M.1628952972.A.8F9.html
title: '[新聞] 對抗Delta病毒救票房靠「尚氣」？各方密切矚目'
content: "對抗Delta病毒救票房靠「尚氣」？各方密切矚目\n\n\n漫威「尚氣與十環傳奇」票房表現極具指標性，受到各方關注。圖／摘自imdb\n\n2021-08-14\
  \ 19:00 聯合報 記者蘇詠智／即時報導\n\n迪士尼正為了和「黑寡婦」思嘉莉約翰森因分紅是否違約而鬧上法庭，暫時不願再將漫威\n影片同步安排在Disney+上架，9月初「尚氣與十環傳奇」戲院上映45天後才會登上平台，\n\
  賣座表現備受各方關注，北美院商更深切期待。不過近來Delta病毒嚴重影響觀眾出門看\n片意願，漫威首位華人英雄擋不擋得住？大家都在等著瞧。\n\n新冠肺炎疫情在歐美爆發，票房常勝軍迪士尼也備受衝擊，為了確保影片收益，臨時調整\n\
  「黑寡婦」、「時尚惡女：庫伊拉」等大片推出方式，Disney+與院線同步登場，雖然\nDisney+訂戶還要再花30美元才能欣賞這些院線大片，已經招來全美院商的砲轟，認為平\n\
  台同步上架讓戲院票房縮水，而思嘉莉約翰森、艾瑪史東等當初合約上寫明按照戲院收益\n來分紅，顯然就會受到損失，才會鬧出思嘉莉狀告迪士尼的難堪場面。\n\n儘管艾瑪史東已經和迪士尼達成再合作「時尚惡女：庫伊拉」續集的協議，然而思嘉莉的\n\
  問題沒解決，迪士尼也不願再冒可能發生類似局面的風險，眼看美國各大影城還是很不滿\n影音同步上架的做法，乾脆暫時打住，至少漫威今年要推出的新片包括「尚氣與十環傳奇\n\
  」與「永恆族」等，都會在戲院先獨家推出，按照推算，「尚氣與十環傳奇」要到10月18\n日才會上影音平台，在此之前全部收入都押在戲院票房這邊。\n\n過去漫威英雄片常能締造輝煌的紀錄，疫情期間推出的「黑寡婦」明顯比過去的表現打折\n\
  ，還能怪到影音平台同步上架上，「尚氣與十環傳奇」可就是考驗漫威魅力能不能贏過病\n毒的時刻，更是後續好萊塢大片能否勇敢照常推出的指標，意義相當重大。在華人區引發\n\
  高度爭議的男主角劉思慕，能不能在歐美抓住大批觀眾，讓他們願意走進戲院捧場？問題\n的答案，好萊塢各影片公司密切注意中。\n\n\n楊紫瓊也參與了「尚氣與十環傳奇」演出。圖／摘自imdb\n\
  \n\n思嘉麗約翰森和迪士尼因為「黑寡婦」酬勞出現分歧，鬧上法庭。圖／摘自imdb\n\n\n對不少華人觀眾而言，影帝梁朝偉才是「尚氣與十環傳奇」的焦點。圖／摘自imdb\n\
  \n--\n、。帝釋所問經講記77頁拆穿佛法的。\n是 是菩薩成佛之道\n、、、、()、、是佛經。\n  是佛          是菩薩\n\n和破十方諸佛\n\
  \n--"
