url: https://www.ptt.cc/bbs/movie/M.1584809147.A.BC9.html
title: '[新聞] 周星馳破解「中共病毒」？電影《功夫》'
content: '周星馳破解「中共病毒」？電影《功夫》藏祕密


  【新唐人北京時間2020年03月21日訊】


  中共病毒（武漢肺炎）肆虐全球之際，香港知名導演周星馳主演的一部電影《功夫》，再

  度引起網友熱議。影片曾被廣泛認為隱射中共邪惡暴政，揭示「正義終將戰勝邪惡」的天

  理。如今許多跡象顯示，中共病毒疫情是針對中共來的，如何破解中共病毒，周星馳的電

  影《功夫》或能給出一些啟示。


  《功夫》於2004年上映，由周星馳擔任導演、編劇兼主演。《功夫》一經放映，立即火爆

  全球。不僅迅速登頂大陸影史，也狂掃香港、臺灣多項影史記錄。香港電影金像獎，《功

  夫》入圍16項；第十屆金紫荊電影獎，《功夫》獲得最佳電影和最佳男配角(元華)兩項大

  獎。


  《功夫》被認為是一部具有深刻政治寓意的電影作品。周星馳在接受採訪時，曾說過一段

  大意如下的話：我是一個膽子很小的人，有很多事我想說想做，可是又不敢做不敢說，所

  以我想通過電影表達。


  在《功夫》上映之前，香港發生過一件震撼世界的政治大事。2003年，50萬香港市民走上

  街頭，舉行七一大遊行，抗議港府執意就基本法23條立法，該法例被認為侵犯港人人權，

  最終中共當局和港府被迫撤回立法。


  《功夫》上映後，外界廣泛認為，影片中的「豬籠城寨」其實隱射的正是1997年主權移交

  之後的香港。而影片中的斧頭幫則被認為隱射中共邪惡暴政，蛤蟆功隱射的是中共前黨魁

  江澤民，中國民間也稱江澤民是蛤蟆。


  影片故事中，居住在「豬籠城寨」的民眾，從最初屈服斧頭幫黑社會，到最後群起反抗。

  最終由周星馳扮演的「阿星」，用「如來神掌」，打敗斧頭幫首領「火雲邪神」的蛤蟆功

  ，揭示「正義終將戰勝邪惡」的天理，也隱射中共邪惡暴政必將滅亡的結局。


  如今，中共病毒（武漢肺炎）肆虐全球，香港也被病毒侵入，更有大陸民眾如潮水般湧入

  香港躲避瘟疫。外界曾預測，香港可能成為「第二個武漢」疫區。但出乎意料的是，香港

  疫情卻出奇的輕微，網上熱傳這是港人反送中，實質是反中共的結果。


  香港反送中運動爆發與去年6月，因中共當局和港府強推「送中條例」，侵犯港人人權，

  超過2百萬港人上街遊行抗議。中共當局則支持港府暴力鎮壓民眾，發射催淚彈、甚至開

  槍打傷港人，更有無數年輕抗爭者被抓捕、被跳樓、被溺亡、被失蹤。


  中共暴行激起全港正義民眾怒火，反送中運動從最初單純的撤回逃犯條例修訂，演變成驅

  逐中共的反極權抗爭。至今港人仍在頑強抗爭，反對中共暴政，維護港人權力。


  香港民眾不懈的抗爭精神感動世界，得到國際社會的支持。匯聚成一股正氣，這也使得港

  人在瘟疫邪氣的侵襲中，得以避過災禍。


  中華傳統的中醫認為，瘟疫是邪氣入侵，正氣強就能抵禦邪氣，「正氣存內，邪不可干」

  。這一「正氣」從深層意義上講，是指人明辨是非善惡的浩然正氣。


  有香港網民說，香港人站在反共最前線，港人用血與淚和生命的付出，清理了香港的共產

  黨邪氣，扶持了正氣，令香港對中共病毒有更高抵抗力，從而未受到武漢病毒的嚴重侵蝕

  ，從某種意義上講，抵制中共，遠離中共，就越安全。


  「天滅中共」的標語在反送中運動中曾隨處可見，如今「天滅中共」四個字，已然成為香

  港人抵抗中共病毒的「護身符」。


  香港知名風水師香山夕陽先生日前接受「看中國」專訪時表示，武漢肺炎疫情就是針對中

  共而來的。


  他說，真正的香港人就安全，黃絲（反對中共人士）就安全，藍絲（親中共人士）難逃劫

  難。他奉勸有良知的人，盡早認清中共，與之割席，保住性命。


  值得一提的是，在《功夫》一片中，周星馳扮演的「阿星」，原本是斧頭幫的一員，由於

  他心中存有善念，在關鍵時刻，脫離了斧頭幫，遠離邪惡並最終戰勝邪惡。


  （記者羅婷婷報導/責任編輯：文慧）




  --'
