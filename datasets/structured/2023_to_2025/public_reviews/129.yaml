title: '[討論] 《蟻人》病毒式行銷--達倫˙克羅斯專訪'
content: "為了宣傳本週上映的《蟻人》，除了WHIH的病毒式行銷影片外，Marvel日前也和Wired共\n\n同推出一篇劇中反派達倫˙克羅斯（Darren\
  \ Cross）的虛構專訪。本文內容簡述了達倫\n\n與導師漢克˙皮姆（Hank Pym）、以及皮姆女兒荷普˙范戴恩（Hope Van Dyne）之間的\n\n\
  複雜關係，文中的部份資訊在電影正片中也有提及。\n\n\n\n全文翻譯如下：\n\n\n\n達倫˙克羅斯的專訪被安排在1點整。但他提早了30分鐘到達。比表定時間更早抵達的習\n\
  \n慣在這位科技天才的職業生涯中發揮了相當良好的影響，也反映了他的成功之道。20歲時\n\n，他從麻省理工畢業；25歲時，他已經在一家產業龍頭的科技公司中擔任首席科學家，\n\
  \n並在35歲時當上了這家公司的執行長。我們與達倫˙克羅斯一同坐了下來，共同討論皮\n\n姆科技（Pym Technologies）這位充滿遠見的執行長將如何以這個身份形塑未來、以及\n\
  \n他為了這一切目標所做的努力。\n\n\n\n1990年代，皮姆科技曾是未來科技產業的龍頭，唯一勝過他們的強悍競爭對手僅有史塔\n\n克工業（Stark Industries），而史塔克工業這家公司如今也以政府與戰爭軍需科技的\n\
  \n革命性技術聞名。皮姆博士本人開啟了奈米科技的研究，達倫˙克羅斯則為了完成這項\n\n技術而鞠躬盡瘁。漢克˙皮姆博士現已退休（有傳聞指出這是達倫本人逼退他的結果）\n\
  \n，但他或許已將這項重要的計畫傳承給自己的弟子。\n\n\n\n「幾乎我所知的一切知識都是由他所傳授的，」克羅斯表示。「我很榮幸能從他手中接\n\n下聖火，並讓這家公司繼續朝我知道漢克會希望的方向前進。」\n\
  \n\n\n然而，克羅斯與這位導師之間的私密連結卻是非常複雜的，這方面也有許多公眾周知的\n\n紀錄。董事長荷普˙范戴恩，即漢克˙皮姆的女兒，就曾在公司的領導權轉移上協助了\n\
  \n克羅斯先生，她所投下的最後一票解除了自己父親的執行長職務。\n\n\n提到自己與公司前任領導者女兒之間的合作，克羅斯是怎麼說的呢？\n\n\n「范戴恩小姐是本公司未來相當有價值的一份子，她對本公司的過去則更是如此。能讓\n\
  \n一位活生生的傳奇人物的女兒支持自己，你是沒辦法拒絕這種事的。」首先，克羅斯毫\n\n無保留地如此回答。接著，他則更加冷靜地補充：「皮姆博士為我提供了令我相當感激\n\
  \n的基礎。這次商業決策是一項努力與改變，它的目的在於推動漢克曾經發展的研究，並\n\n利用它讓皮姆科技達到新的高度。」\n\n\n\n挑戰極限\n\n\n數十年來，皮姆科技一直是推進奈米科技極限的先驅。在克羅斯的領導之下，皮姆科技\n\
  \n的聲望將會透過公開其研究而再次獲得生氣。皮姆科技過去在那些廢棄構想中達成的成\n\n就—以及研發部門的構想墳場—目前都在克羅斯的完整掌控之下，這位野心家將這些計\n\
  \n畫項目列為他執業之初對公司而言最為強大的提案，那些可能性現在將會變成現實。\n\n\n\n克羅斯表示自己曾打算浸淫在那些檔案之中，並重啟某些剛加入皮姆科技時令自己感到\n\
  \n相當興奮的計畫。但皮姆科技的重要成長—目前仍缺乏具體的生產成果—也隱藏了公關\n\n的兩難危機。面對那些不問近期發展、只在乎公司營收狀態的質疑，克羅斯有些含糊地\n\
  \n迴避了這個問題。\n\n\n\n「我保證：我們已經在奈米科技的領域上有了突破。」\n\n\n\n奈米科技的文化衝擊\n\n\n所以，皮姆科技的突破究竟是什麼？不論克羅斯或皮姆科技的代表都不願透露他們正在\n\
  \n進行的計畫，但克羅斯一再保證這項計畫的潛能。\n\n\n\n「如果這項研究證實了我們的理論」—克羅斯不願將此部份的內容公開—「我們將會前\n\n往催生粒子科技下一階段突破的邊緣。」\n\
  \n\n\n克羅斯並說服我們皮姆科技相關計畫的展示將會對整個社會與文化造成深遠廣泛的影響。\n\n\n\n「基於我們近期的研究成果，我並不覺得說皮姆科技的下一個公開計畫令人驚訝是一件\n\
  \n過度誇張的事情。」\n\n\n\n一旦研究完成、皮姆科技也做好了向大眾宣佈的準備，這間公司將會開始招募投資者。\n\n雖然入股存在著高風險，但風險也代表了多年的長期合約與數百萬美元收益的潛力。克\n\
  \n羅斯表示，目前的股東對於皮姆科技的新企劃與繼續投資未來科技的商業策略都感到「\n\n非常高興」。\n\n\n\n皮姆科技新計畫的公開日期將在本週稍後由克羅斯宣佈。\n\
  \n\n--\nQ for Quest:  \n\nMarvel電影世界觀百科：\n\nMarvel電影世界觀百科臉書頁面：\n\n--"
