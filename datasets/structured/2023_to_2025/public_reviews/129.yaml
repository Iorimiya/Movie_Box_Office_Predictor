url: https://www.ptt.cc/bbs/movie/M.1584963999.A.A62.html
title: '[新聞] 電影劇情「害大家都低估病毒」　威爾史密'
content: '電影劇情「害大家都低估病毒」　威爾史密斯：我也有責任


  2007年年底電影《我是傳奇》讓威爾史密斯成為紐約市唯一的倖存人口，現在大家都說這

  部片跟現實狀況好接近。不過，男主角威爾史密斯覺得片中對病毒的描述不完全正確，導

  致大家輕忽了新冠肺炎，自己也有責任。


  在4天前發佈的《Red Table Talk》網路節目中，威爾的老婆潔達主持關於新冠狀病毒的

  討論，威爾史密斯一開口就提到自己有責任，因為《我是傳奇》的劇情好像沒有把病毒講

  得很正確，因此他們請出了真正的醫學專家跟觀眾介紹病毒。


  當年為了飾演病毒學家，威爾造訪了CDC（美國疾病管制與預防中心），學習相關的知識

  ，讓他從此改變了不少衛生習慣，「我對於病毒、病原體有了基本的認識，這確實改變了

  我的生活，改變對世界的想法。」在電影中，威爾史密斯成了瘟疫後的唯一倖存者，獨自

  在紐約求生，而得病的人都變異，成了宛如吸血鬼般的怪物。


  有趣的是，雖然這集是請出威爾史密斯一家人，但他們的兒子傑登卻沒來，因為傑登之前

  很活躍、到處跑，所以老媽潔達說他正乖乖待在家，「這樣做的出發點是為了他祖母著想

  ，他正在學習當個負責任的年輕人！」


  來源網址：


  ▲威爾史密斯（右2）、老婆潔達（中）一家人在網路節目《Red Table Talk》討論新冠

  狀病毒危機。（翻攝自Jada Pinkett Smith官方推特）


  --'
