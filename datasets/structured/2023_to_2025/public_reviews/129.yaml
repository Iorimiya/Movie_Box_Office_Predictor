  力動能的第五區介紹如何以水力發電、第二區的保衛和平訓練員展現了學員們為

  了加入施惠國精銳部隊所受的精密訓練，以及擅長紡織工業的第八區則展示了如

  何更有效利用多餘的紡織材料及樹脂再造獨具風格且實用的衣物。


