title: '[新聞] 《侏羅紀世界：殞落國度》病毒行銷網站'
content: '新聞網址：


  《侏儸紀世界：殞落國度》病毒行銷網站亮相，內容暗示劇情走向！




  昨天剛剛公開全新預告片內容的《侏儸紀世界２：殞落國度》，在今天也讓病毒行銷的宣

  傳網站「恐龍保護團體」正式上線。


  在這個虛構網站中，我們可以看到由電影女主角克萊兒身為宣揚保護電影世界中被人工誕

  生的，成為網站大使提倡人類有責任善待這些透過自己之手帶回世界上的恐

  龍。




  其中，網站有很大的一部份在強調過去曾經被當成侏儸紀公園／世界的地點：哥斯大黎加

  的Sibo火山島，在近期變得相當活躍，隨時都有噴發的可能。克萊兒預見到了被困在島上

  等同被人類們放逐在那自生自滅的恐龍們，生命即將受到威脅。這部份的設定等同直接呼

  應了預告片中的火山爆發場景，以及為什麼男女主角相當強烈地希望回到島上與自己的恐

  龍同伴們重逢的原因。




  網站上也公開了這次電影的另外兩位主要成員：古生物女獸醫的琪雅（Zia）跟前侏儸紀

  世界的ＩＴ員工富蘭克林的照片。




  目前續集針對演員陣容的部分，除了男主角克里斯派特與之前登場過飾演基因工程博士的

  亞裔演員黃榮亮之外，系列作招牌男星。在昨天公開的預告片中，

  似乎有比目前登場過的所有恐龍都還兇猛殘暴的種類出現，電影預計將在今年六月正式上

  映。



  官方病毒式宣傳網站連結



  --'
