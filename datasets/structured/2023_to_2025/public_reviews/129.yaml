url: https://www.ptt.cc/bbs/movie/M.1502372079.A.B9D.html
title: '[新聞] 宋仲基大馬宣傳軍艦島 自稱快樂病毒'
content: '（中央社記者郭朝河吉隆坡10日專電）由宋仲基、蘇志燮和黃政民等南韓一線演員主演的

  電影「軍艦島」，今天在馬來西亞進行宣傳。心情大好的宋仲基笑稱自己是「快樂病毒」

  ，常在片場搞笑。


  近期在南韓掀起話題的電影軍艦島，3位主角和導演柳承莞來到馬來西亞宣傳。導演和演

  員4人9日在吉隆坡柏威年廣場出席首映會，吸引逾6000名粉絲擠爆商場與街道。


  軍艦島導演與演員今天連袂舉行新聞發布會，暢談電影創作過程。10月將與宋慧喬結婚的

  演員宋仲基心情大好，不僅發言最多，更笑稱自己是「快樂病毒」，在片場是個開心果。


  南韓影帝黃政民略顯吃味的表示，在片中飾演他女兒的金秀安，常把不好吃的東西給他，

  卻把好吃的留給宋仲基，可見宋仲基的迷妹功力非常厲害。


  當被問及若戲裡的戰爭在現實生活中重演時，誰能活到最後？宋仲基自認是他。他說：「

  因為我最年輕，而且絕對能拯救這3位。」蘇志燮笑著附和，指宋仲基那段期間剛好拍攝

  完「太陽的後裔」，應該會是生命力最強的人。


  蘇志燮表示，這是第一次與柳承莞合作電影，感覺「好可怕」，因為需要配合電影的大哥

  角色，接受各種訓練，甚至還必須穿上丁字褲露出身材，與人在浴場搏鬥。但結束後覺得

  一切都值得，非常感恩有機會參與這部歷史巨作。


  軍艦島在南韓上映賣出好成績，柳承莞謙虛表示感恩，希望能還原部分歷史，讓觀眾感受

  到戰爭的可怕。他也感謝3位演員非常敬業的表現，為戲除了必須練出精壯身材外，也要

  學習各種戰鬥場面，所以電影有好成績，多虧演員的敬業。


  新聞網址：


  --'
