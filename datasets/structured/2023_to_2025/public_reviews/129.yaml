url: https://www.ptt.cc/bbs/movie/M.1473996808.A.E30.html
title: '[討論] 當我被咬了以後(屍速列車病毒與劇情淺談)'
content: '大家好，我是水小生


  最近屍速列車在台灣造成的話題性非常熱絡

  從劇情一直延伸到韓國民情政治背景、台灣製片環境等


  甚至對病毒也有些微的討論



  剛好小弟的工作與所學還能解釋一些病毒行為

  所以想在這裡跟大家淺淺討論一下殭屍病毒






  對了，目前能夠侵入腦部的細菌與病毒超過100種，以下文章都用"病毒"來帶入哦~






  1.發病快慢


  發病的快慢可以簡單地分成三個方向：感染部位、抵抗力強弱、病毒特異性


  (1)感染部位：很多版友都有提到了，咬到脖子或是咬到動脈，變殭屍的速度會比較快


  但這樣並不能解釋為什麼啦啦隊長被咬大腿外側一下就幾乎馬上變殭屍了(我也想咬


  所以這可能就要另外兩點來解釋


  (2)抵抗力強弱：這就跟在座的各位身體中都有各式各樣的細菌一樣


  當你抵抗力好的時候，細菌雖然在體內有小量繁衍，但是都會被壓下來


  當你抵抗力差的時候，細菌繁衍量超過抵抗力防禦的極限，就發病啦!!


  所以也可以說啦啦隊長抵抗力真的很差，而巴士營運長的抵抗力還不錯(?


  (3)病毒特異性：病毒能夠感染所有物種，蛋白質殼內的基因序列會在感染正常細胞之


  後釋放，改變正常細胞的DNA序列，導致異常蛋白質的轉錄與轉譯、最後造成病毒大量繁


  衍。但是病毒還是有特異性的問題，某病毒對一些人比較容易感染，對另一部分的人就不


  易造成感染，不過目前在電影中沒有看到這樣的情況發生。






  2.病毒發病特徵


  小弟現在做的是阿茲海默症藥物，二刷完電影淺淺談一下病毒特性：



  (1)宿主並無死亡：


  基本上只要人類還能走跳，血液還是有在流動(心臟有在跳


  身體內的電子傳遞依然在進行，因此大腦跟中樞神經是被病毒寄生，藉此操控四肢與咬合



  (2)海馬迴被嚴重破壞、但是小腦性能依然健在：


  海馬迴是控制人短期記憶、長期記憶與空間定位的獨特樞紐


  阿茲海默症患者都可以觀察到他的海馬迴萎縮或是被破壞


  電影中殭屍幾乎完全沒有記憶(至少短期記憶可以說是沒有的


  正孕婦拿報紙遮住玻璃後所有殭屍都無所適從


  而空間定位系統是當一個人走第一條路不通的時候，他會去尋找第二條路，直到找到出口


  為止。電影中殭屍幾乎被卡在門外或玻璃後就只是在那邊推擠蠕動，並沒有去尋找他路


  因此可以從這兩點推測，海馬迴完全GG(不然就是訊號根本被阻斷


  但是小腦卻很發達，小腦是控制身體平衡的最重要部位


  如果小腦壞了，你只會看到殭屍在地上緩緩爬行，並不能像電影中能走能跳





  3.當我被咬了以後


  有看到一些版友覺得當電影中的殭屍好像不錯，那如果真的被咬了以後會怎麼樣


  首先，病毒操控你的四肢與咬合，為了讓病毒更快速的繁衍下去，他會控制你這個病毒


  載體去傳染(咬)其他正常人，這也滿符合病毒與細菌的繁衍機制的。


  你心中的想法會是：為什麼我要咬這個人，我並不認識他，他是誰，我是誰?


  很多疑問會在你心中(阿茲海默症後期症狀)


  也有可能根本不會多想什麼啦(已經喪失自我意識)



  在你受到球棍與盾牌猛烈攻擊時，有可能你會感受到痛，但是反射神經並沒有起作用


  所以當男主角拿盾牌猛尻你腳的時候，你會覺得超爆痛，但是腳為什麼還在那邊給他尻



  最後身邊若是已經沒有正常人可以感染之後，你就已經完成你繁衍病毒的目的


  你的軀殼可以捨棄了，你也會因為沒有進食與補充水分，在三天到一週內死亡


  在電影中可以很明顯地看到，殭屍咬人不是為了進食



  或許你可以覺得當個殭屍很詩意，並不用考慮太多，身體也是病毒操控著


  你也不一定感受到來自身體各處的所有訊號(肚子餓、痛、冷熱)


  你只要睜大眼睛看好眼前的每一幕就好，但幾乎不會記得(可能三秒)





  4.身邊目前可能具有的危機


  很多人都覺得這是電影，不可能發生，什麼殭屍阿設定很扯


  但我依照目前生化技術來看，其實哪一天發生都不會太奇怪


  病毒因為可以在短時間內大量繁衍的特性，早就有很多研究單位在進行特別蛋白質的大量


  複製：將一段特別的基因序列(DNA或RNA)植入病毒殼內，再讓病毒感染正常細胞


  一段時間後就可以得到你想要的蛋白質，而且量還不少，中間出了什麼差錯誰曉得?



  另外如果有興趣的話可以查一下這個單字：Ophiocordyceps unilateralis


  中文名是偏側蛇蟲草菌，是一種擬寄真菌，主要以萊氏屈背蟻（Camponotus leonardi）


  為寄主。偏側蛇蟲草菌感染螞蟻后，會控制螞蟻的大腦，利用螞蟻的身體幫助真菌找到


  適合的生長環境。當螞蟻感染了這種真菌，就會離開蟻穴，在附近的樹林地上找一片樹葉


  ，緊緊咬住它的葉脈，然後死去，為真菌生長創造完美的環境。


  NCBI還有一篇PAPER是專門在探討這種真菌的，60多頁。


  且當初科學家以為只有這種真菌有這樣的特性，但其實在巴西雨林中還有其他多種真菌針


  對多種物種進行專一性寄生的。






  所以你要說目前談殭屍的可能性很滑稽嗎?


  小弟在這裡奉勸各位，沒事多健身、多練跑、多交朋友、多準備一些，遇到事情時還是


  用得到的。




  但是要我說這病毒有沒有什麼問題


  當然有阿，發病速度真的太快了，照理來說應該是24小時到72小時之間比較合理

  (病毒濃度達到一定量，且具有傳染性)


  --


  老實說我不敢保證XD...



  因為要達到一定濃度

  24-72小時算快了～



  什麼都很難講...



  車掌阿伯不是趴在地上被咬嗎？

  幫阿伯QQ



  的確，但是在生化工程技術日新月異的情況下，什麼事情都有可能～



  老實說我並沒有感受到體力有變強～

  喪失理智與身體支配權後，力量大概就是如此吧！



  感謝指點方向（誤



  陰屍路的殭屍不合理的地方太多了

  1.宿主死亡才變殭屍，但血液不流通怎麼走怎麼咬？

  2.以進食為目的，這就代表有部分的訊號傳遞依然在進行（食慾刺激



  真的，惡靈古堡的殭屍完全娛樂取向，滿滿的惡意！



  同意～未來一起加油！



  這裡補充一個蠻有趣的地方：

  雄性生物的海馬迴普遍比雌性的還要來得肥大發達一點

  因此就生物構造來看，雄性生物的方向感與尋求他法的能力會比雌性生物來得好（沒有要

  戰男女的意思啦

  不過電影之中男殭屍並沒有比較優秀就是了XD



  感覺還不錯，哈哈！'
