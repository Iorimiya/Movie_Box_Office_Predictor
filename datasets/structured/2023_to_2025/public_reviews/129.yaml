title: '[新聞] 科洛弗系列新作開始病毒傳銷 網友解破'
content: '《柯洛佛》系列新作開始病毒傳銷！網友解破神秘網站現隱藏文字！


  新聞網址：


  ２００８年襲捲全球影壇的《科洛弗檔案》，在當初上映之前曾經透過另類實境遊戲（Al

  ternate Reality Game）幫電影進行病毒式傳銷，獲得了莫大的迴響。然而，預計在今年

  四月份上映的第三部系列新作也如法炮製，透過一個神秘網站讓網友解謎！


  根據電影世界觀中的科技公「Tagruato」架設的同名網站（），在

  今天突然之間有了全新的訊息；在看似讀取網頁失敗的訊息中，網友們透過一連串的解謎

  ，找出了下面這段訊息：


  神秘網站反白處理後顯現的神祕文字

  ＂Tokyo – January 18 2018: Tagruato has begun development on a revolutionary

  new energy technology in what Ceo Garo Yoshida called a technological great le

  ap forward for our planet. This renewable technology will take at least 4 year

  s to complete along with another six years International regulatory bodies to

  bring the powerful revolutionary energy source by April 18 2028＂


  ＂東京，１月１８日，２０１８：Tagruato公司已經開始開發一個全新的能源科技，該公

  司的執行長Garo Yoshida稱這個科技將會大幅推進地球的科技發展。這個全新的科技將會

  需要四年的時間研發，然後六年的時間經過各立法與審查機關的審核後，在２０１８年的

  ４月１８日正式登場！＂


  該訊息很明顯就是在敘述電影的上映時間，也正好迎合１０年前第一部電影的１０周年紀

  念。


  新聞來源：Reddit

  （）


  -


  前兩部都很特別，也期待這部新作的故事！


  --

  神「秘」'
