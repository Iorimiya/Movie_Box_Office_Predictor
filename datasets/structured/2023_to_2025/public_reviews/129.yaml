url: https://www.ptt.cc/bbs/movie/M.1461710331.A.C2C.html
title: '[問片] 一部病毒感染片最後倖存者墜機？'
content: '剛看完危機總動員想起以前看過一部很類似的片


  似乎也是病毒在一個小鎮爆發


  然後大家拼命找解藥


  就在最後的最後好像在小鎮要被炸毀前還是什麼的


  小鎮的大家突然研發出解藥然後要開飛機逃走


  但是就在看似大家可以平平安安開飛機遠走時


  病毒突然又突變


  其實疫苗似乎無法治癒病毒


  然後整台飛機的人就消失在雷達上還是就墜毀了





  不知道有沒有大大可以在這嗎爛的敘述想起這部電影XD


  真的很想想起這是哪一部電影


  但剛剛google了好久都找不到


  希望有神人出現


  幫助青年痴呆回憶起過去的記憶


  --'
