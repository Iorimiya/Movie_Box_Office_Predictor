url: https://www.ptt.cc/bbs/movie/M.1420628868.A.ADA.html
title: '[問片] 想找一部病毒感染片(非殭屍類)'
content: '好幾年前看過

  印象中片中主要角色是一對兄弟 以及各自的女朋友

  內容是在敘述美國爆發病毒感染 有點類似流感症狀 但染病後只有死路一條

  他們開著車在找尋安全的地方 後來哥哥的女朋友因為照顧一個染病的小女孩 所以自己也

  被感染 後來被哥哥丟下

  但後來也發現哥哥也被感染了 所以後來剩下弟弟與弟弟的女朋友

  很努力回想了 不知道線索夠不夠 印象中最後一幕好像是在海邊打開一個箱子 裡面有一

  堆螃蟹 忘記跟片中內容有什麼關係了

  希望能夠問到片名 感謝各位大大


  --

  Sent from my Android


  --'
