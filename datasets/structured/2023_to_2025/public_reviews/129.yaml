title: '[問片] 病毒相關的電影'
content: '這部電影起碼有10年以上了


  希望能找到童年的回憶QQ




  主角是一位有跟警方往來的男性華人


  好搭檔兼任好朋友是一位從事醫生或驗屍相關工作的白人


  後來某次在家染上病毒而把自己的舌頭拔掉，失血過多死亡


  接著，主角跟警方一同前往到一間寺廟調查


  一開始看似跟一般寺廟沒什麼兩樣


  裡面有很多信眾跟兩位和尚


  突然警方要求他們配合搜查時


  他們負責人拒絕了還是怎麼樣


  然後，這些人都發了瘋似的開始（非常人似的）攻擊警方


  後來警方&主角俠持了一位和尚


  這場鬥毆才停止


  這時有透漏出這兩位和尚其實是通緝犯來著


  警方也有在這間寺廟中找到一具女屍（整個故事都與她有關聯）


  這個女屍肚子上有傷口


  而且這個女屍的雙胞胎姐姐還是妹妹在出生時就死了


  然後被泡在福馬林裡面做成標本放在醫院（？）



  --'
