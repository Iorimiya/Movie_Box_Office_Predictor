title: '[新聞] 朱軒洋《哭悲》遇病毒變異 陷感染者大逃殺'
content: "朱軒洋《哭悲》遇病毒變異 陷感染者大逃殺\n\n2021/01/13 21:30\n\n〔記者吳琬婷／台北報導〕台灣原創恐怖電影《哭悲》，故事講述超級變異病毒迅速蔓延\n\
  ，只要被感染上，就無法控制內心的原始欲望，同時也會發狂猛烈攻擊身邊的人。該片找\n來《下半場》鮮肉男星朱軒洋和新人女演員雷嘉納主演，兩人演出令人不寒而慄。\n\n\
  \n朱軒洋（左）、雷嘉納在《哭悲》中飾演熱戀中的情侶。（傳影提供）\n\n曾在《下半場》亮眼演出的朱軒洋，這次參與《哭悲》有不一樣表現，不是騎車狂飆就是\n拔腿狂奔，一心想找到失聯的女友雷嘉納。片中他隨時可能遭遇變異人種的突襲，幾乎每\n\
  分每秒都用腎上腺素拚命。由於拍片時期正值酷暑，朱軒洋大嘆：「好險在《下半場》體\n力有練過，但是這次在熱烘烘的柏油路上狂奔也讓皮膚曬傷、脫皮又紅腫！」\n\n\
  朱軒洋在《哭悲》中飾演一名剛畢業的年輕人，和女主角雷嘉納是熱戀中的男女朋友，沒\n想到在送女朋友去捷運上班的路上，竟然遇到突發狀況，被一群人攻擊追殺，好不容易逃\n\
  出生天回到家中，卻聯絡不上女友，心急如焚。因為劇組在嚴密完善的保護措施下拍攝，\n朱軒洋慶幸無論是動作打鬥戲，或騎摩托車在路上風馳電掣，都毫髮無傷。《哭悲》1月\n\
  22日在台上映。\n\n\n1.22《哭悲》The Sadness｜官方預告 Official Trailer\n\n\n1.22《哭悲》 限禁版預告｜“The\
  \ Sadness” Red Band trailer\n\n\n1.22《哭悲》The Sadness｜30秒預告 30s Official Trailer\n\
  \n--\n、。帝釋所問經講記77頁拆穿佛法的。\n是 是菩薩成佛之道\n、、、、()、、是佛經。\n  是佛          是菩薩\n\n和破十方諸佛\n\
