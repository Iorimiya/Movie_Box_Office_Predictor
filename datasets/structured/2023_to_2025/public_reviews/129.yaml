url: https://www.ptt.cc/bbs/movie/M.1580150607.A.5EF.html
title: '[好雷] 全境擴散——武漢病毒只是歷史重演'
content: '一開始是因為朋友說目前武漢的狀況，

  和2011年這部片極其相似，

  所以就直接租來看。


  與其說它是一部電影，不如說它是預警了當流行傳染力來襲的時候，人類會怎麼樣。


  這些畫面不是憑空想像，

  而是人類每一次都在重複歷史，

  隱匿病情、製造恐慌、研發疫苗，

  有辦法等待疫苗到來的時候，才可能把一個新的流行病轉化成人類能抵抗的狀況。


  人類是很脆弱的，一場病毒就能殲滅大多數的群體，我們難以抵禦傳染疾病。


  然而比起疾病來說，

  最恐怖的還是人心，還是隱瞞的政府。

  十分推薦在這個當下，

  把這部電影找回來看一次，

  對於接下來可能發生的事情會有一些預警的功效。


  因為每一次有高度傳染病的時候，

  人類都是這麼做的。

  雖然故事比較零碎，但是是難得的好片，加上眾星雲集，可以看到不少熟悉的大咖面孔。


  強力推薦！


  -----

  Sent from JPTT on my Asus ASUS_Z01RD.


  --'
