title: '[問片] 問一部有關遺跡病毒傳染的電影'
content: '電影內容詳細有點忘記了，


  只記得最後一群人好像到了一個遺跡，而後發現旁邊有個水井，


  進去之後發現植物會學手機的聲音，然後就被傳染什麼病之類的就死亡了，


  有些人沒被傳染跑出來後似乎想要開車離開這鬼地方，


  但卻被當地的原住民(?)阻擋並且要殺害他們，因為好像被感染到就會容易傳染給他人


  以上。 很想知道是哪部片子，麻煩大家 ><


  --'
