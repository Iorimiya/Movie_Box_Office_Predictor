title: '[新聞] 抗病毒不延期【逃出立法院】釋出正式預告'
content: '抗病毒不延期！【逃出立法院】釋出正式預告


  華映



  華映


  　　充滿政治嘲諷和黑色幽默的《逃出立法院》由鬼才新銳導演王逸帆執導，

  聯手《紅衣小女孩》系列的監製曾瀚賢及編劇群，

  集合禾浩辰、賴雅妍、庹宗華、高慧君、王中皇、林鶴軒等實力派演員，

  共同演出一場血淋淋的暢快政治嘲諷版活屍喜劇！




  華映


  　　日前公佈電影正式預告，可以見到活屍病毒在立法院中無限度人傳人擴散，

  被關在立法院中的少數未感染者只能想盡辦法求生，

  甚至不得不和活屍們來場摔角大混戰，極度瘋狂卻又意外貼近現況，

  大膽直接諷刺疫情全球擴散的狀況，讓影迷看得目瞪口呆卻又心有慽慽焉！




  華映


  　　《逃出立法院》由《紅衣小女孩》系列的監製曾瀚賢和編劇團隊簡士耕

  全力打造的最新作品，由新銳鬼才導演王逸帆執導。

  之前瘋狂宣傳一波接一波，前導預告及個人海報都

  讓粉絲驚呼，終於推出讓鐵粉引頸期盼的正式預告，果然瘋狂程度持續爆表，

  可見到電影中立法院一爆發活屍病毒後，立刻遭到封閉隔離，

  接著便出現和台灣接近的防疫4步驟，像是避免近距離的接觸、保持適當距離，

  並要通報疑似病例，更要相信政府的安排，等待救援。





  華映


  　　這些防疫步驟都非常有道理，可惜電影中的政府並非台灣般可靠，

  這保護不值得信任，政府決定殲滅在立法院的一切生物，

  只好讓未受感染的賴雅妍、禾浩辰、高慧君、大鶴、庹宗華等人紛紛硬起來，

  豁出去和活屍大打摔角，也要衝出一條生路。

  步步逼近的情節及搖滾風格的配樂，再加上微惡搞全球疫情，

  預告讓觀眾看得熱血沸騰還更加莞爾一笑！




  華映


  　　仔細看預告，突然發現一顆粉紅泡泡！

  就是賴雅妍與禾浩辰在生死存亡之際的一場血淋林的吻戲，

  只出現一秒鐘，但也讓人眼睛一亮！

  片中禾浩辰演出從小暗戀學姊賴雅妍的魯蛇，

  沒想到兩人竟在立法院內再度見面，更遭遇到病毒危機，

  在互助逃命的過程中，避開了病毒卻滋生了愛苗。




  華映


  　　兩人在5年前合作《等一個人咖啡》後再度合作，但當時兩人完全沒有感情戲，

  禾浩辰說：

  「雅妍的頭髮比之前長一點，但還是一樣迷人，很有魅力。

  我一開始很緊張，因為很期待可以再次和她合作，但之後就沈默了，

  因為之前已經建立了默契，在拍攝現場就不太聊天交流，

  因為全都累癱了，力量全都用在表演上。」




  華映


  　　賴妍雅同樣表示兩人之前在電影開拍前，因為受訓已經變得很熟悉了，

  「我們在前製期時，就完全剔除陌生感了，到現場我們就直接演出，

  但我好像永遠都要演他的學姊啊！」

  在預告中也可見到在發病前，受感染者會噴出嘔吐物，

  禾浩辰也上演了一場嘔吐物噴發的一幕，

  他表示這些嘔吐道具非但不噁心，味道還很不錯，

  「因為是八寶粥做的，含在嘴中甜甜的。」

  賴雅妍透露禾浩辰嘴巴的容量超大，

  「他一口幾乎可以HOLD住一整罐八寶粥的量，超多的！

  然後再噴出來，那一場戲很驚人。」




  《逃出立法院》預計4月17日上映


  更新日期：2020-03-23


  --

  、。帝釋所問經講記77頁拆穿佛法的。

  才是 是菩薩成佛之道


  拆穿


  對之批判


  --'
