url: https://www.ptt.cc/bbs/movie/M.1584375178.A.B98.html
title: '[新聞] 神預言病毒肆虐全球！《全境擴散》編劇坦'
content: '神預言病毒肆虐全球！《全境擴散》編劇坦言「感覺很差」






  新冠肺炎（武漢肺炎）疫情蔓延全球，2011年上映的驚悚片《全境擴散》（Contagion）

  成功預言9年後的現況，也再次被眾人關注。電影其中一位編劇史考特Z.伯恩斯（Scott

  Z. Burns）最近接受採訪，對自己的劇本成了神預言，他坦言「感覺並沒有好到哪去」。



  《全境擴散》由史蒂芬索德堡（Steven Soderbergh）執導，多名大咖影星演出，該片講

  述由葛妮絲派特蘿飾演的女商人到中國出差，感染了一種神祕且致命的病毒後不治身亡，

  病毒在全球擴散，世界各地爆發醫療衛生危機；因情節與現實有許多相似之處，讓這部電

  影再度成為討論話題。



  《全境擴散》講述女商人到中國出差，感染一種神祕的病毒後不治身亡，病毒因此在全球

  擴散。（翻攝自推特）



  史考特Z.伯恩斯透露自疫情爆發以來，社群媒體與身邊的朋友常對他說，劇情意外吻合現

  實真的太不可思議，「不過我一點也不意外，因為我與很多科學家討論過，他們告訴我這

  種事只是早或晚發生，而非不可能發生。」不過他也說：「顯然的，看到這麼多人生病與

  死亡，確實讓人很不安。」



  此外，他也抨擊美國的防疫措施，「我們的國家並未讓病毒學的專業人士領導政府，這真

  的令人難以置信」，直批只能以「落後」兩字形容。


  --'
