url: https://www.ptt.cc/bbs/movie/M.1589507125.A.A20.html
title: '[討論] Netflix蒙上你的眼 很像現在病毒肆虐的fu'
content: '本肥昨晚無聊看了Netflix 《蒙上你的眼》


  珊卓布拉克主演 2018年上映的美國末日驚悚片


  覺得這部片和現在的情況太像了....以下有雷 斟酌服用




















  本片根據喬許·梅勒曼所著同名小說改編，講述當一股神秘力量要殲滅人類，大家只知道

  一個法則：萬一你看到它，就要奉上自己的性命。


  電影開頭，梅樂莉·海耶斯（珊卓·布拉克飾）孤身一人帶著兩個孩子走到野外，並警告

  孩子們接下來無論發生什麼都不能摘下眼罩，否則會死。




  然後時間倒序回五年前


  講說疫病爆發之初 驚悚的事件突然發生 而且找不到原因或理由


  直到結局也找不到源頭 (是不是跟現在的情況很像)




  然後無論何時也不能摘下眼罩 這種情況也很像現在全球被迫戴口罩的光景


  混亂情況下不斷有人宣傳假消息、還有邪教組織要人們拿下眼罩、接受光明




  兩個小孩的繼父(女主角的戀人)  也跟兩個小孩講到


  和現在不同  他們小時候的時光是如何如何好


  不用整天關在屋子 可以爬上樹 可以不戴眼罩想看多遠就看多遠 Blablabla......


  聽了兩個小孩心醉神馳~~  後來還給女主角罵 產生爭論


  男主角只是希望小孩子活潑開心 能夠保有夢想和純真的童心


  那珊卓布拉克講得比較現實殘酷  大意是你這樣會害死小孩子 事實是我們都回不去了





  片末是為了求生存 珊卓布拉克帶著兩個小孩  努力去尋找無線電傳出的安全大型的社區


  即最後的淨土、樂園   (會不會就是將來的台灣 哈)





  不多加贅述 大家有興趣的話去看 這部片還是滿切合時事的


