url: https://www.ptt.cc/bbs/movie/M.1470902984.A.542.html
title: '[ 普偏負雷] 病毒'
content: '圖文精彩版↓




  級別 : 未分級


  上映日期 : 2016年


  片長 : 1時25分


  IMDb : 5.6/10(764票)


  爛番茄 : 50%(5票)



  [劇情介紹]


  一種神秘病毒開始在一個小鎮快速傳染，並致使大多數居民死亡。年輕女孩Emma在病毒隔

  離區裡記錄她家庭的新生活，並試圖保護被病毒感染的妹妹Stacey...



  又是部賣弄親情的活屍怪物片了...這種類型的片大家肯定不陌生，通常是以活屍或是被

  病毒感染的世界為背景，然後親人受到感染了，所以到底該大義滅親還是死守著他們呢，

  覺得這種劇情很眼熟吧，沒錯，這種劇情不知道有多少部電影用過了，已經膩到不能在膩

  了，劇情根本就已經大公開了，但就是有人可以把它拿出來再拍一次，偏偏怎麼拍觀眾看

  起來還是那個樣子，公式化的劇情，唯一的差別就在於片中出現的是活屍還是病毒，以及

  想催哭人的結局而已，其他地方根本沒有可看性，而且為了營造出親人之間共患難時候的

  感情，通常會在劇情中做鋪陳，這些鋪陳如果是非感性一點的人大概會覺得非常無聊。


  本片這次的主謀是一條黑黑長長看起來像蚯蚓的蟲蟲，當他入侵到你的體內之後會讓你受

  到感染而食慾大增，而這種病毒只會藉由血液傳染，所以呢...這些被感染的人會以吐血

  的方式攻擊其他沒被感染的人，這些病毒還會彼此傳遞訊息或指令，說實在點，被感染的

  人不論是外表還是行為都像極了活屍，差別就在於本片中活屍的攻擊模式是吐血吐在你臉

  上，這個攻擊TMD看起來一點都不威猛，隨隨便便戴個口罩活屍的攻擊就沒屁用了，從來

  沒看過那麼弱的活屍。


  劇情大概是為了迎合青少年觀眾，而加入了女主角爸爸出軌所以搬家遇上鄰家帥哥這個要

  點，但劇情中並沒有特意在兩個女孩與爸媽之間的尷尬處境多加著墨，而且爸爸出場露個

  臉之後就再也沒有出現過了，有點浪費了一開始的設定，片中的大部分時間帶到的鏡頭也

  是以青少年為主，不過我還滿訝異美國青少年是多愛開趴啊，連病毒在世界各地肆虐他們

  還是可以照常開派對然後像喀了搖頭丸一樣晃頭晃腦，最後全部被殺光光，這劇情也太有

  病了吧...


  雖然本片劇情無聊歸無聊，但是有些地方卻發揮得不錯，像是女主角為了救妹妹所做的一

  切都滿讓人動容的，他們之間的互動及表現也沒有"我就是要逼哭你"的那種刻意，雖然劇

  情之中感動的點不多不過卻格外顯得真摯。


  發揮不錯的地方還有氣氛的營造，同樣也是沒有刻意營造孤立無援的處境，但是看到四周

  的街道房子空無一人，以即被政府切斷與外界的聯繫，表面上電影沒有特別去強調他們的

  處境，但是觀眾看起來卻覺得他們像是被世界遺棄的人們，即使女主角表現得多麼勇敢堅

  強，觀眾感受到的卻是一股冷冷的絕望。



  到了劇情後半段後明顯感受出導演拍出來的畫面越來越帶有美感，有別於先前一堆沒有特

  別意義的畫面及嚇人的點，可能是考慮到劇情走向姊妹親情的因素，導演特意拍出唯美的

  畫面來搭配情感，而這些畫面倒也帶出了被遺棄的他們是顯得多麼孤獨、卻也多麼堅強，

  相較之下，同樣類型的片子多半不會有這項特色，跟別人不一樣就算贏了。


  血腥度看起來似乎不是導演著重的點，從活屍的攻擊方式就可以看出來，不過倒是也加減

  灑了一點血漿，尺度的話算是清淡到不能在清淡，害怕血腥的觀眾可以安心服用。


  本片劇情走向公式化，也沒有伏筆及爆點，血腥度也不高，這樣看下來似乎快變成爛片了

  ，好在在後來的劇情中營造出有如身在荒島中的氣氛以及姐姐營救妹妹的親情表現得還算

  不錯，這部片我個人是覺得還可以，但不會推薦給其他人。


  評分(滿分5分):


  劇情: 1.5 劇情公開又沒有爆點，換湯不換藥根本沒有意義


  結局: 2 再怎麼演也都是那樣


  血腥: 2 吐血是可以吐到多血腥啦


  氣氛: 3 後半段真的營造得不錯，本片唯一可看的地方


  推薦: 2 真的不是很推薦各位看，如果真的沒片子要看的話再看吧


  個人喜好: 2.5 覺得還可以，不算是爛片等級但也沒有多好


  --'
