url: https://www.ptt.cc/bbs/movie/M.1631782453.A.CBC.html
title: '[新聞] 《異類崛起》滅絕人類的不是新冠病毒 而'
content: '新聞網址：


  《異類崛起》滅絕人類的不是新冠病毒 而是外星人！


  新冠肺炎已在全球肆虐近兩年，在疫苗研發不斷進步及自然演變情況下，未來可能漸趨「

  流感化」而不再像現在造成重大危害。然而即便人類這次在病毒下倖存，浩瀚宇宙中總有

  會對我們存亡產生威脅的存在。「外星人」電影便是人們對於這種威脅的娛樂想像，近期

  如《異星入境》、《異類占領》等片皆是如此。而美國驚悚片《異類崛起》描述不明隕石

  墜落紐約州，造成空氣毒化，後來更發現這竟是外星人入侵地球的先行準備！電影最後的

  翻轉結局更是令觀眾意想不到。


  《異類崛起》故事始於一顆隕石墜落在紐約州一個農業小鎮，將空氣有毒化。整個小鎮開

  始死亡，包括動物、植物，以及——人類。女主角蘿倫是一名外星生物學家，被國土安全

  部徵召去尋找這起神祕事件的答案。她不情願的動身，殊不知這是一場即將到來的巨大危

  機。此時，一棵異世巨樹生長在隕石撞擊的地點，原來這顆隕石是被送往地球尋找新家的

  實驗種子。種子來自一個垂死的世界，巨樹是為了在地球上創造適合他們居住的環境，進

  而展開殖民。很快的空氣變得更加有毒，而人類正處於大規模滅絕的生死邊緣。


  電影將於9月24日在台上映。

  電影預告：


  --'
