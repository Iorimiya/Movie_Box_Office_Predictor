url: https://www.ptt.cc/bbs/movie/M.1579913559.A.BFE.html
title: '[新聞] 武漢肺炎電影情節? 病毒變種蔓延全球'
content: '新聞網址：




  武漢肺炎電影情節? 病毒變種蔓延全球

  蝙蝠傳染情節類似武漢肺炎 全球熱議

  美研發武漢肺炎疫苗 最快今夏臨床試驗

  2020-1-24   國際新聞


  武漢肺炎蔓延全球，歐美有網友發現，這波疫情其實跟好萊塢電影《全境擴散》場景相近

  ，片中描述中國大陸境內蝙蝠病毒，無意間感染豬隻，病毒之後變種又感染人類，最終引

  爆全球疫情，而武漢肺炎疑似也是從野生動物傳給人，再繼續人傳人。不少民眾憂心武漢

  肺炎疫情持續擴大，但好消息是，美國目前已著手研發疫苗，最快在今年夏季就會進行臨

  床試驗。



  致命病毒入侵人體，短短時間就在全球各地蔓延，這是電影《全境擴散》的情節，如今有

  歐美網友拿來和武漢肺炎疫情做比較。英美網友熱烈討論，點出《全境擴散》片中的末日

  級疫情，跟武漢肺炎疫情有部分相似處，電影中描述中國境內蝙蝠病毒感染豬隻，再變種

  感染人類，引爆全球疫情，而武漢肺炎病毒，也疑似是從野生動物傳給人類，再繼續人傳

  人。


  武漢肺炎疫情至少擴散到全球三大洲，死亡病例持續增加，各界期盼問世的武漢肺炎疫苗

  ，正在瑞士參與世界經濟論壇的專家，也讓外界燃起希望。美國目前已著手研發疫苗，並

  跟澳洲昆士蘭大學跨國合作，最快今年夏天進行臨床試驗，在疫情擴大的同時，和時間賽

  跑，為全球防疫作業，助上一臂之力。


  --'
