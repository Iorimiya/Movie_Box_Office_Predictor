url: https://www.ptt.cc/bbs/movie/M.1434465806.A.7A5.html
title: '[好雷] 韓國片 流感～面對病毒，請戴上口罩'
content: '豐富圖文版:




  遠渡重洋的貨櫃

  帶來的不是期待

  反而是無盡恐懼

  無所不在的病毒～


  隨著空氣到處肆虐

  身上出現詭異紅斑

  隨著咳嗽嘔出鮮血

  沒有人能倖免於難


  身處其中的你

  要如何面對呢？



  提到SARS這四個英文單字，

  相信在台灣都會出現一陣寒顫，那時出入公共場所有要量體溫，

  如果一有發燒就會十分擔心，最近韓國又傳出MERS的疫情，

  讓人又想到聞咳嗽色變的時刻，對照他們在2013年拍過的電影，

  由張赫與秀愛主演的流感，更是讓人覺得百感交加～


  一開頭即埋下伏筆，在快速帶出男女主角背景，

  病毒迅速的在城市中蔓延，藉由特寫拍出飛沫傳染的恐怖，

  無形中沒有發覺就身染重病，於是整個城市開始陷入恐慌，

  從保護女兒的醫生，見義勇為兼想把妞的救護員，

  到一國最高的總理與總統，由小至大呈現面對疫病的狀況。


  劇中的怪病發病速度非常的快，因此整部電影進展相當緊湊，

  雖有部分支線，但仍集中於主角，所以沒有全境擴散的鬆散感，

  雖仍有部分主角威能及灑狗血片段，但不得不說韓國片真的越拍越好，

  已經能拍出不輸好萊塢的大場面(當然部分特效仍有些假假的)，

  當用空拍呈現整個城市失控，以及為了處理病死者的畫面，

  跟末日之戰活屍的震撼有得比了。


  劇情中也呈現這次MERS的問題，其實不只是韓國，只要是人都一樣，

  當你遇到跟自己有利害關係的情形時，

  不論於公於私，能藏起來不讓人知道，總是第一個會出現的念頭，

  但現實沒辦法跟電影一樣理想化，

  只希望疫情能儘速平息，不要再有人被疾病所侵襲～



  阿一一個人評價


  劇情★★★★★★(最高10星)

  演員★★★★★★★

  氣氛★★★★★★★


  整體★★★★★★


  星等說明


  九星以上 經典

  六星以上 值得一看

  四星以上 還可以看

  三星以下 別浪費時間


  --

  歡迎光臨我的部落格

  阿一一之詩意與電影的流動



  --'
