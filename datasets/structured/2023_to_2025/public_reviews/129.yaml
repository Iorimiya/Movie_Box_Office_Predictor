url: https://www.ptt.cc/bbs/movie/M.1595232154.A.550.html
title: '[討論] 屍速列車 VS 新冠病毒 哪個病毒比較可怕'
content: '可能有屍速列車2的雷



  昨天剛看完屍速列車2


  想來跟現在沸沸揚揚的新冠肺炎病毒比較一下




  其實電影裡面病毒的設計


  不一定會比新冠肺炎可怕



  喪屍病毒潛伏期很短


  大概一小時內就會屍變


  而且潛伏期也不會傳染


  政府要阻隔不一定有新冠肺炎困難


  片中開往香港的船，乘客只要隔離一兩小時確認沒發病


  檢查身體有沒有開放性傷口，就很安全了


  連篩檢都沒必要


  當然政府如果完全不作為有可能導致這樣的結果




  相比之下


  我們現在14天都在隔離了


  喪屍病毒發病前還有一段抽搐期，可以給人逃跑


  新冠病毒狡猾太多了，篩檢正常也不代表沒有感染



  當然新冠肺炎的致死率遠小於喪屍病毒


  但這也使新冠肺炎更難被消滅，可能會永遠存在



  還有被喪屍咬的視覺效果比肺炎病死強烈很多


  不然真的喪屍病毒爆發全球死亡人數可能遠小於此次的新冠肺炎




  最後小女孩說的台詞


  「其實我們待過的世界也不差」


  是指現實世界的新冠肺炎其實更加可怕嗎


  --'
