title: '[新聞] 首部探究中共病毒疫情真相的紀錄片（中文'
content: '首部探究中共病毒疫情真相的紀錄片（中文字幕）


  （Tracking Down the Origin of the Wuhan Coronavirus）




  新唐人 2020-04-16


  目前，中共病毒疫情已蔓延至全球185個國家和地區，至少200多萬人確診感染、逾13萬人

  死亡。由於中共嚴重隱瞞中國的疫情，真實的感染和死亡人數仍不得而知。目前中國和伊

  朗感染數據是被嚴重低估的。


  英文大紀元調查記者喬舒華·菲利普（Joshua Philipp）回顧了今年1月至4月初疫情的發

  展情況，結合資料和專家訪談，剖析了表象背後的疑點——從武漢華南海鮮市場到中共的

  超限戰手法，這其中存在哪些關聯和祕密？ 數位美國專家和學者從病毒學、政治與國際

  關係、情報學等角度闡述了關於本次疫情爆發及中共極權危害性的見解。


  （中文字幕更新）




  新聞網址：



  --'
