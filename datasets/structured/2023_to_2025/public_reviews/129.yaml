title: '[負雷] 病毒 能拍得比國片爛也是不容易！'
content: '衝著其他電影前播的預告


  愛情病毒、韓式喜劇、裴斗娜


  是不是很吸引人？！一定很精彩吧！！



  我算是非常喜歡韓國電影


  劇情不拖沓、快速進入主題、講好一個故事


  但這部劇完全反其道而行


  像是看了名為“戀愛症候群”十集韓劇的前兩集



  短短九十分鐘的電影，播了一小時


  我還是沒看出男主角是誰、劇情主軸是啥？



  電影講述男主研發的憂鬱症特效病毒擴散


  劇情以女主裴斗娜展開，最後產生抗體結束


  但男女主之間沒啥互動 也沒火花


  愛情片的成分沒有、災難片的危機感也沒有


  喜劇片會心一笑的橋段，就真的只是一笑



  最近看的電影哪怕有缺點


  至少都有能討論的吐嘈點


  這部真就是完全沒可取之處


  難怪網上一篇觀影心得都沒有



  如果有喜歡裴斗娜的，看看電影預告就好


  不須要特地跑到電影院浪費生命，謝謝



  --'
