title: '[新聞] 鄭中基《阿龍》化身復仇父 避談離婚事'
content: "鄭中基《阿龍》化身復仇父 避談離婚事\n\n04:10 2025/10/08 中國時報 李承陽 、香港連線\n\n\n鄭中基（右）跟周秀娜合體宣傳電影《阿龍》，分享拍攝幕後花絮。（華映提供）\n\
  \n鄭中基今年年中與主播出身的第二任妻子余思敏宣布離婚，兩人14年婚姻宣告結束，日前\n鄭中基宣傳自導自演動作電影《阿龍》，與同片演員周秀娜接受台媒電話訪問，被問到家\n\
  務事，他低調避談。\n\n鄭中基在《阿龍》化身復仇父親，把自己練得超壯，花了整整8個月操肌，自曝最難練的\n是背肌，「我自己在構思電影的時候，第一個變壯的鏡頭是先拍我的背。」會自己照鏡子\n\
  讚歎訓練成果嗎？他笑說：「不是真的健美身材，是因為角色是做黑工、體力勞動，是比\n較粗獷型的。」\n\n片中鄭中基跟飾演泰國華僑的周秀娜結婚，兩人如何培養親密戲？周秀娜表示：「因為電\n\
  影是在泰國拍，在外地拍的好處跟香港不一樣，在香港拍完大家就各自回家，在那邊就是\n工作，相處的時間相對比較多。而且我們之前合作過，所以拍親密戲不會尷尬。」\n\n\
  有趣的是，該片雙導演鄭中基跟胡耀輝也都頗愛演，親密戲會男男上陣先示範1次，好讓\n女生放心，同時鄭中基也認為自己跟周秀娜默契好，甚至用「快」字來形容兩人拍攝親密\n\
  戲的進度。\n\n另，周秀娜演泰國華僑，為戲苦背泰文，沒事就把錄音檔放出來聽，「基本上明天有泰文\n的戲，我就緊張到睡不著，一直聽錄音，到現場也會叫工作人員念1次給我聽，很怕講起\n\
  來不自然，不像是生活很久的泰國華僑。」\n\n#避談 #周秀娜 #兩人 #泰國華僑 #阿龍\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n\
  \  是 佛        是 菩薩\n\n\n\n--"
