url: https://www.ptt.cc/bbs/movie/M.1756922716.A.F6E.html
title: '[好雷] 噪音殺機 值得一看的驚悚小品！'
content: '閒閒沒事

  想說南港lalaport沒去過

  隨便挑一部沒聽過的，結果意外好看

  剛上映就包場，看完覺得不虧，推薦一下


  驚悚電影該有的昏暗、夢境、幻覺都有

  看完後也都有常見感想

  大韓民國是沒警察嗎？

  為什麼一定要在晚上去冒險？

  就不能白天然後多找幾個人嗎！！



  接下來就劇情解析一下

  本部純驚悚，沒有任何鬼怪

  所有超自然都是三位神經病幻想出來的


  故事主要就兩個角色，604姐姐和704母親

  首先是704母親的女兒在家玩遭前主委抗議

  跑出門玩被大車司機招呼而離開

  704母親因此崩潰做出三件事

  1.幻想女兒存活 2 製造噪音 3.殺害前主委


  604妹妹受不了噪音而四處尋找

  最終發現704母親秘密而被綁架


  本作就按姐姐尋找妹妹和噪音展開

  最後在地下室發現被綁架的妹妹

  姐姐和母親搏鬥時，母親坦承殺害妹妹

  此時突然出現鬼怪殺了母親

  姐姐所幸逃出，和妹妹離開地下室

  姊妹兩個從此過著平靜的生活


  結尾觀眾才發現，原來姐姐繼承了母親的病

  其實全劇就有暗示姐姐開始罹患幻想的過程

  從夢境現實不斷交錯、看到704女兒

  在704母親口中才意識到妹妹已死

  無法接受，最後並殺害了704母親


  結論

  1.妹妹很可愛，一直希望她活著

  2.新主委態度由惡轉善很感人原因，沒想到是本

  唯一溫馨點

  3.妹妹男友超倒楣，504房客被逼瘋更倒楣

  4.雖然驚悚片死循環是老梗，但還是很震撼


  最後影廳雖然普通，但新東西就是好

  有一股剛開箱的味道，推薦大家去體驗~



  --'
