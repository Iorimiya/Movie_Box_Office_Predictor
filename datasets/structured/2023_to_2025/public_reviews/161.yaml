url: https://www.ptt.cc/bbs/movie/M.1756204482.A.C4B.html
title: '[新聞] <哭聲>音效大師操刀<噪音殺機>掀驚駭體驗'
content: '新聞網址：



  以都會生活最令人崩潰的「樓層噪音」為題材，強勢榮登南韓年度最賣座驚悚電影的話題

  懼作《噪音殺機》，即將在本週五（8/29）於全台驚駭獻映！本片之所以成為小兵立大功

  的票房黑馬，關鍵原因之一就是演員們的精彩演出，尤其女主角李先彬睽違三年強勢回歸

  大銀幕，首度挑戰驚悚片型就展現驚人蛻變，成功轉型成新一代「驚悚女王」。她透露儘

  管熟知整個劇情發展，仍必須「假裝不知道」地詮釋角色，這樣的演出過程極度燒腦又耗

  費體力，甚至讓她在拍攝期間瘦了兩到三公斤。除了精湛演出，片中最令人毛骨悚然的，

  莫過於讓人頭皮發麻的「捂耳級」音效設計，而打造全片驚悚音效的幕後功臣，正是曾參

  與過《哭聲》、《鬼病院：靈異直播》等恐怖名作的音效導演朴勇基（音譯），他更直言

  ：「這部電影藏有許多在家裡看電影會無法聽到的細緻聲音，絕對只有透過電影院的音響

  ，才能真正感受到那股窒息的壓迫與驚懼，效果會完全不同！」





  憑藉《酒鬼都市女人們》、《少年時代》等作深受觀眾愛戴的李先彬，時隔三年重返大銀

  幕，透過《噪音殺機》展現出前所未見的全新魅力。她飾演的「珠英」，為了尋找被樓層

  噪音折磨的失蹤妹妹而重返公寓，卻被捲入神秘事件當中。之後，她也開始聽見可疑的聲

  音，並變得愈來愈敏感。李先彬細膩且完美地詮釋出角色在日益敏感與崩潰之中的情緒變

  化，時而因恐懼而喘不過氣，時而因噪音而對微不足道的小事爆氣，帶領觀眾進入角色脆

  弱的內心世界。導演金秀鎮對於李先彬的選角表示：「她是一位表現力強大、非常有魅力

  的演員。她閱讀劇本後立刻展現出對角色的深刻理解，讓我非常驚訝。我覺得她的臉能展

  現出強烈的情感，尤其在了解她是恐怖驚悚片的狂熱粉絲之後，我就對她更加感到興趣，

  想展現出她的全新面貌。」



  為了呈現角色的心理轉變，李先彬也透露自己做足準備：「前半段和後半段的語氣、氣場

  是完全不同的。為了讓觀眾相信角色走向崩潰的過程，我花了很多心思鋪陳感情細節，希

  望讓觀眾不知不覺地被我『騙過去』。」她更將「裝作不知道」視為自己演技上的挑戰：

  「這部片最難的地方，就是『裝作不知道』。只要相差0.1秒的反應都會讓人出戲。我必

  須精準知道幾秒後要轉頭、哪裡有聲音、什麼東西會出現。因為有很多特寫鏡頭，眼神的

  移動也要非常講究。身為知道劇本內容、也參與現場籌備的演員，要演出『不知道』的狀

  態，其實非常困難。」尤其隨著劇情真相逐漸明朗，角色的面容也將愈益憔悴，從中更可

  看出李先彬對角色的深度投入。不過她也幽默表示，自己的體質反而讓這種憔悴的模樣得

  以自然呈現：「我一瘦下來，臉頰就會凹陷。我天生不容易胖，反而成了我的困擾，所以

  我拍戲前通常都會努力增胖，但在拍攝本片時，體力上很辛苦，情緒上也變得很消沉。這

  些跟化妝效果結合起來，讓角色的憔悴感更加強烈，我想我在拍攝期間大概瘦了兩到三公

  斤。」





  另一方面，由於《噪音殺機》以「樓層噪音」為題材，為了最大化全片陰森懸疑的氛圍，

  「聲音設計」也成為本片絕對不可錯過的極致看點，像是椅子拖動聲、腳步聲等稀鬆平常

  的日常聲音，在片中都被打造成令人毛骨悚然的「捂耳級」音效。而這些驚悚聲音的幕後

  功臣，正是來自曾參與過《哭聲》、《鬼病院：靈異直播》等恐怖名作，以及《7號房的

  禮物》、《犯罪都市》、《駭人怪物》等千萬觀影人次大賣作品的音效導演朴勇基。擅長

  以逼真音效強化觀眾沉浸感，讓人不自覺深陷其中的他表示：「我花費很多心思去思考，

  該用什麼樣的聲音來成為緊張與恐懼的核心工具。希望讓所有住過公寓的人，都能在戲院

  裡如同身處家中那般，真實感受到這些噪音。因此在聲音設計上，我積極運用多聲道技術

  ，來呈現方向感與距離感。」值得一提的是，他與擬音團隊進行了無數次會議，並運用各

  種道具與設備製作音效，他對此補充：「電影院的音響喇叭數量很多，這樣一來，小聲音

  可以被精緻呈現，大聲音則能帶來爽快的震撼感。這部電影藏有許多在家裡看電影會無法

  聽到的細緻聲音，絕對只有透過電影院的音響，才能真正感受到那股窒息的壓迫與驚懼，

  效果會完全不同！」



  這部南韓票房突破3.7億台幣，榮登南韓年度最賣座驚悚電影寶座的《噪音殺機》，即將

  在本週五（8/29）於全台驚駭獻映。本片劇情描述有聽力障礙的珠英（李先彬飾演），與

  妹妹珠憘（韓秀娥飾演）終於買下夢寐以求的新房，卻沒想到噩夢才正要開始。某天起，

  珠憘開始被來自公寓某處的神秘噪音折磨得身心俱疲。那讓人不耐的樓層噪音，不僅讓她

  無法安睡，更像是潛藏某種黑暗秘密的警告。正當珠英離家工作時，珠憘突然失蹤，讓驚

  慌失措的珠英立刻趕回家，並與珠憘的男友基勳（金珉錫飾演）聯手追查真相。同時，住

  在樓下的神秘男子（柳炅秀飾演）也長期受噪音困擾，認定一切都源於樓上的這對姊妹，

  讓他情緒逐漸崩潰，揚言要對她們痛下殺手…。真相究竟藏在誰的耳中？噪音背後，又是

  誰的瘋狂正在近逼？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
