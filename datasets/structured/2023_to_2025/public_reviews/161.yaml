url: https://www.ptt.cc/bbs/movie/M.1755701458.A.E16.html
title: '[新聞] 【噪音殺機】逆轉砲灰片，翻盤嚇翻全世界'
content: '新聞網址：



  以都會生活層出不窮的「樓層噪音」為題材，強勢榮登南韓年度最賣座驚悚片的話題懼作

  《噪音殺機》，即將在8月29日於全台驚駭獻映！本片深刻描繪都市人最熟悉卻最無力對

  抗的噪音困擾，在極具共鳴的題材中注入驚悚懸疑元素，引爆觀眾心理極限。曾在《太陽

  的後裔》、《鯊魚：風暴》等劇大放異彩的金珉錫，這次在片中飾演女主角李先彬妹妹的

  男友「基勳」，他自評角色是「辛辣菜餚中的柔和配菜」，以出色的節奏掌控，巧妙緩和

  片中緊張氛圍，反而強化了全片的現實恐怖感。跟他在片中有多場激烈動作戲的李先彬，

  也盛讚他貼心細膩：「他的身體非常靈活，所以我在動作戲中得到他很多幫助。」值得一

  提的是，本片在南韓上映時，原先被外界視為在好萊塢鉅片與國產大片夾殺下的「砲灰型

  電影」，卻憑藉爆棚口碑展開驚人「票房逆襲」，票房在短時間便超越《F1電影》（F1）

  、《侏羅紀世界：重生》（Jurassic World Rebirth）、《超人》（Superman）等片，更

  受到多個國際重量級影展邀約，並囊括國際媒體熱烈好評，徹底展現本片在全球市場的強

  大震撼力。





  透過《太陽的後裔》、《鯊魚：風暴》等劇展現出色演技的金珉錫，演出橫跨愛情、驚悚

  、動作等多樣化類型。他在最新主演的《噪音殺機》當中，詮釋失蹤少女的男友「基勳」

  ，在與女友姊姊一同踏入神祕公寓搜尋的過程中，逐漸被捲入一連串詭異離奇的事件當中

  。金珉錫將原本平凡的基勳，如何逐漸變得神秘莫測的轉變演繹得淋漓盡致，為全片增添

  更多懸疑與張力。他透露對角色的刻畫：「我努力讓角色不要太過突出，讓觀眾能夠跟隨

  姐妹的故事逐漸發展。」他更形容自己飾演的這個角色，像是「辛辣菜餚中的柔和配菜」

  ，注重讓表演可以更加和諧。實際上，隨著故事真相逐漸揭露，他的角色變化也將被細膩

  地展現出來，憑藉精準的節奏掌控，進一步提升全片的現實恐怖感。



  導演金秀鎮表示：「恐怖驚悚片的特性，是主角越孤立無援，觀眾越能產生共鳴並感受恐

  懼，因此飾演主角身邊的角色其實並不容易。基勳這個角色的重要性，我認為金珉錫最適

  合。這個角色既是主角的幫手，也是讓人起疑的關鍵人物，必須在緊張與懸疑之間取得微

  妙平衡，他本身也帶著挑戰的心態選擇了這部作品。」導演更對他的表現給予極高評價：

  「這是一個演起來非常困難的角色，但他對角色與演技都進行了深度分析，甚至在開拍前

  就提出許多創意構想，讓我們拍出比原本預期更出色的場面。」此外，在片中跟金珉錫有

  激烈動作場面的李先彬也回憶：「聽說珉錫前輩是相當體貼的人，這次和他拍動作戲時就

  體會到了。有場戲是在很累又很冷的狀態下拍攝的，但他讓現場氣氛變得輕鬆愉快，也讓

  全場歡笑不已。他的身體非常靈活，所以我在動作戲中得到他很多幫助。」





  值得一提的是，《噪音殺機》在南韓上映初期，雖然被視為冷門佳作，但隨著口碑不斷發

  酵，如今已經榮登「南韓年度最賣座驚悚片」寶座。尤其本片不僅在南韓國內締造亮眼票

  房成績，更受邀參加西班牙錫切斯影展、加拿大奇幻電影節、瑞士納沙泰爾奇幻影展、義

  大利佛羅倫斯韓國電影節、羅馬尼亞特蘭西瓦尼亞電影節等世界知名國際性影展，並獲得

  多家國際媒體熱烈盛讚。Cinapse評論：「導演精準掌握視覺衝擊與本能恐懼的時機，並

  巧妙將熟悉的敘事結構，轉化為新穎而令人印象深刻的恐怖體驗。」ScreenAnarchy表示

  ：「這是一部令人神經緊繃、彷彿撕裂耳膜般的恐怖作品，為觀眾帶來強烈的感官衝擊。

  」Eye For Film稱讚：「本片在保有經典風格的同時，也展現出極高完成度，緩慢滲透的

  恐懼與強烈的情緒爆發交織得恰到好處。」Horror Junkies也說：「導演巧妙讓觀眾用恐

  懼填補畫面空白，這不僅是傑出的導演處女作，更向世人證明，當恐怖電影認為『沉默』

  如同『尖叫』時，它可以變得多麼創新並令人震撼。」對於全球對本片的高度關注與肯定

  ，導演金秀鎮直呼宛如置身夢境：「雖然本片以非常韓國式的空間作為故事背景，卻能在

  海外引發如此大的共鳴，觀眾也能精準抓住我所設計的細節並享受其中，讓我既驚訝又非

  常開心。」



  這部南韓票房突破3.7億台幣，榮登南韓年度最賣座驚悚電影寶座的《噪音殺機》，即將

  在8月29日於全台驚駭獻映。本片劇情描述有聽力障礙的珠英（李先彬飾演），與妹妹珠

  憘（韓秀娥飾演）終於買下夢寐以求的新房，卻沒想到噩夢才正要開始。某天起，珠憘開

  始被來自公寓某處的神秘噪音折磨得身心俱疲。那讓人不耐的樓層噪音，不僅讓她無法安

  睡，更像是潛藏某種黑暗秘密的警告。正當珠英離家工作時，珠憘突然失蹤，讓驚慌失措

  的珠英立刻趕回家，並與珠憘的男友基勳（金珉錫飾演）聯手追查真相。同時，住在樓下

  的神秘男子（柳炅秀飾演）也長期受噪音困擾，認定一切都源於樓上的這對姊妹，讓他情

  緒逐漸崩潰，揚言要對她們痛下殺手…。真相究竟藏在誰的耳中？噪音背後，又是誰的瘋

  狂正在近逼？



  欲知本片最新消息，

