url: https://www.ptt.cc/bbs/movie/M.1754575716.A.471.html
title: '[新聞] 【噪音殺機】榮登南韓年度最賣座驚悚電影'
content: '新聞網址：



  全球各地，「樓層噪音」已經成為現代人共同經歷的「日常惡夢」，並衍伸鄰居之間的嫌

  隙糾紛，甚至產生種種駭人聽聞的縱火、攻擊等傷害事件。光是在鄰近的南韓，今年就推

  出多部與這主題相關的電影，除了近期登上Netflix電影收視榜非英語電影類冠軍的《牆

  外之音》，更有以喜劇角度刻劃噪音問題的《這棟公寓很有事》，以及由李先彬、金珉錫

  、韓秀娥、柳炅秀（又譯劉慶秀）等韓星共同主演的《噪音殺機》。其中《噪》片以超高

  話題討論，國際版權在南韓上映前夕，便狂銷117個國家與地區，並獲無數國際影展邀約

  放映。當《噪》片在韓上映之後，更以驚人速度締造票房佳績，目前已經吸引超過170萬

  觀眾進戲院搶看，全韓總票房更直衝167億韓圜（約新台幣3.7億元），甚至超越《黑祭司

  2：闇黑修女》等話題強片，榮登今年南韓最賣座驚悚電影冠軍寶座，證明觀眾對本片的

  強烈共鳴與肯定。《這棟公寓很有事》與《噪音殺機》台灣皆由「采昌國際多媒體」代理

  發行，《這》片將在明日（8/8）發行影音商品、9月登上數位影音平台；《噪》片則將在

  8月29日於全台驚駭獻映。





  根據台灣內政部營建署調查，台灣的樓層噪音問題，已經連續多年位居住戶投訴前三名，

  更有超過65%的集合住宅居民表示，曾受到不同程度的噪音困擾。再根據南韓環境部統計

  ，住宅大廈的噪音相關投訴個案，從2015年的1.9萬宗，到2019年的2.6萬宗，雖然四年來

  的增幅不算太高，但在新冠疫情期間，卻一下子飆升至4.5萬宗，可見其情況因為待在家

  中的時間變長而急劇惡化。而根據南韓環境公團「樓層噪音鄰里關係中心」在2025年4月

  22日的統計，光是2024年就收到超過3.3萬宗樓層噪音投訴。「樓層噪音」不僅影響人們

  的休息與工作，長期暴露在噪音環境中，更可能導致健康問題，甚至可能衍生出縱火、攻

  擊等駭人聽聞的社會事件，這也讓今年上映、將樓層噪音以驚悚片獨有魅力相互結合的《

  噪音殺機》，成功引發各界話題討論。



  本片講述一名患有聽力障礙的姊姊，在長期飽受噪音困擾的妹妹突然失蹤後，踏上尋找真

  相的旅程。過程中，她捲入噪音製造者與受害者之間的激烈衝突，為觀眾帶來深刻共鳴與

  緊張懸疑的觀影體驗。導演金秀珍表示，在撰寫劇本的過程中，因為樓層噪音已經成為重

  大社會議題，經常可以在新聞中看到相關案例，這也證明這個題材具備高度普遍性與共感

  力：「公寓作為建築空間，在南韓是非常熟悉的存在。正因為這種熟悉，我花費很多心思

  去思考如何利用它。太舊不行、太新也不對，我希望找到一個不會太小，但又能在鏡頭上

  呈現一定規模與張力的場景。」這也讓透過寫實與懸疑結合的這部電影，不僅提供娛樂性

  ，更將帶領觀眾反思噪音與生活之間的界線與代價，勢必將讓觀眾在觀賞後，對樓上出現

  的聲音更加難以忽視。





  也因為「樓層噪音」這個在全球各地都有高度共鳴的主題，讓《噪音殺機》在南韓正式上

  映前，就廣受海外眾多重量級國際影展的熱烈邀約，成為全球焦點話題，接連入選西班牙

  錫切斯影展、加拿大奇幻電影節、瑞士納沙泰爾奇幻影展、義大利佛羅倫斯韓國電影節、

  羅馬尼亞特蘭西瓦尼亞電影節等世界知名國際性影展，更獲得「年度最大驚喜！」「南韓

  電影的全新大師級典範！」「完美刺激的體驗！」「引人入勝的故事，讓人懷疑自己究竟

  聽到了什麼！」等一系列高度好評，展現出全球對本片的高度關注與肯定。此外，本片在

  南韓上映前，也創下銷售橫跨亞洲、歐洲與拉丁美洲等117個國家與地區的驚人紀錄，再

  度印證電影的全球話題性。導演金秀珍也對此欣慰表示：「這部電影的設定非常韓國化，

  海外觀眾能夠產生共鳴，準確理解我的意圖，並享受這部電影，讓我既驚喜又欣慰。」



  尤其本片在南韓上映後，更以驚人速度締造票房佳績，不僅火速突破百萬觀影人次的損益

  平衡點，更吸引超過170萬觀眾進戲院搶看，全韓總票房直衝167億韓圜（約新台幣3.7億

  元），展現驚人氣勢。更值得一提的是，本片甚至超越《黑祭司2：闇黑修女》等話題強

  片，成為2025年南韓最賣座的驚悚電影，成功寫下年度票房神話，也在競爭激烈的暑期檔

  市場中殺出重圍，證明觀眾對本片的強烈共鳴與高度肯定。尤其本片是一部必須走進電影

  院親身體驗的作品，從令人汗毛直豎的音效設計，到壓迫感十足的視覺張力，絕非是透過

  小螢幕能完整感受的作品。只有身在戲院影廳裡，才能真正聽見、感受到那讓人坐立難安

  的「噪音」，以及它背後所埋藏的驚懼，想挑戰自己的感官極限，千萬不要錯過！



  這部國際版權狂銷117國、南韓票房突破3.7億台幣並好評不斷的《噪音殺機》，即將在8

  月29日於全台驚駭獻映。本片劇情描述有聽力障礙的珠英（李先彬飾演），與妹妹珠憘（

  韓秀娥飾演）終於買下夢寐以求的新房，卻沒想到噩夢才正要開始。某天起，珠憘開始被

  來自公寓某處的神秘噪音折磨得身心俱疲。那讓人不耐的樓層噪音，不僅讓她無法安睡，

  更像是潛藏某種黑暗秘密的警告。正當珠英離家工作時，珠憘突然失蹤，讓驚慌失措的珠

  英立刻趕回家，並與珠憘的男友基勳（金珉錫飾演）聯手追查真相。同時，住在樓下的神

  秘男子（柳炅秀飾演）也長期受噪音困擾，認定一切都源於樓上的這對姊妹，讓他情緒逐

  漸崩潰，揚言要對她們痛下殺手…。真相究竟藏在誰的耳中？噪音背後，又是誰的瘋狂正

  在近逼？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
