title: '[  爆讚雷] 噪音殺機，好鳥的片名'
content: '羨慕光洙啊

  沐浴後的鏡頭真的迷死人

  片名有點鳥會降低對這片的興趣


  查到韓第二週票房比第一週還好

  就決定要看這部了


  樓層噪音題材韓不少，這部恐怖驚嚇十足

  噪音實況的情節這片著墨倒是不多

  穿插貫穿融會了完整的劇情

  劣勢的族群家人間的摩擦癒合

  噪音是問題的起點瀰漫恐怖的氛圍

  妹妹因噪音而捲入失控與失蹤的情緒

  在探索樓上與樓下周遭的過程中

  逐步修補跟妹妹的關係

  一個個的命案發生透露不可思議的無形力量

  塵封的異味地下室出現不同詭異空間

  有失控的鄰居還有無形的恐怖力量纏繞

  最後終於找回妹妹變成下一個加害人？


  大概是今年超乎期待的觀影感受前幾名

  讚！


  --'
