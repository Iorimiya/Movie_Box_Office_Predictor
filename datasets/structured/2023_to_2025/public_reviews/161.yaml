title: '[新聞] 李先彬男友李光洙看<噪音殺機>嚇灑爆米花'
content: '新聞網址：



  榮登南韓年度最賣座驚悚片的話題懼作《噪音殺機》，即將在8月29日於全台驚駭獻映！

  本片以都會生活層出不窮的「樓層噪音」為題，巧妙融合現實恐懼與懸疑驚悚，引爆觀眾

  強烈共鳴，南韓票房更直衝167億韓圜（約新台幣3.7億元）佳績。女主角李先彬一改過往

  亮麗、搞笑形象，首度挑戰驚悚類型，在片中飾演聽障人士，並捲入一連串讓人頭皮發麻

  的神秘事件。她坦言從小就是驚悚片迷，卻始終不敢輕易接演這類角色：「對於自己真正

  熱愛的東西，反而更怕搞砸。」她透露，正因為本片劇本的獨特設定與深刻人性，讓她下

  定決心迎戰心理極限：「本片雖然是驚悚片，但其實有非常豐富的人性戲劇成分。」尤其

  本片日前在首爾舉辦VIP試映會，現場星光熠熠，包括李先彬交往多年的男友李光洙也慕

  名現身力挺，讓她笑稱：「他本來就很怕看恐怖驚悚片，結果當場被嚇到把整盒爆米花灑

  出來，超好笑的！」





  被譽為「南韓年度票房黑馬」的驚悚新片《噪音殺機》，由在《酒鬼都市女人們》、《少

  年時代》等人氣戲劇中有亮眼表現的李先彬領銜主演，挑戰詮釋聽障人士，在噪音肆虐的

  公寓中尋找失蹤妹妹，卻意外捲入接連不斷的神秘事件。全片以「聲音」為主軸，引領觀

  眾進入一場前所未見的感官試煉。李先彬以細膩入微的演技，精準傳遞角色在恐懼與焦慮

  中逐漸崩潰的情緒。從她驚恐中顫抖的呼吸、過度警覺的神情，再到對細微噪音瞬間爆發

  的情緒，層層堆疊的表現令人屏息。更讓人驚訝的是，出道14年的她，竟是首度演出驚悚

  類型！她坦言：「驚悚片是我從小就非常喜歡的類型，正因為喜歡，反而變得更加小心翼

  翼。有時對於自己熱愛的東西，反而更怕搞砸，也更不敢輕易觸碰。」談起過往顧慮，她

  誠實分享：「我曾懷疑自己的外型和身體條件，能否有效傳達恐懼情緒。我也曾覺得，自

  己是不是不適合這類角色。其實從新人時期就陸續接到驚悚、恐怖片邀約，但我大多都婉

  拒了，因為覺得自己還不夠格。」



  然而，《噪音殺機》的劇本改變了她的想法：「這部作品以『樓層噪音』為出發點，是很

  多人都能產生共鳴的現實問題。這讓我覺得，即使是『普通的李先彬』也能投入這個角色

  。因為電影探討『誰都可能是被害者，也可能是加害者』這項主題，這樣的設定，給了我

  演出的勇氣。」她也大讚本片的創新視角：「驚悚片最重要的是『聲音』，本片是一部以

  『聽覺』為主題、甚至從聽覺展開故事的電影，在南韓幾乎前所未見。透過聽障角色來帶

  動恐懼，這種設定對我來說反而非常有魅力。我敢說，即使是最挑剔的驚悚片迷，也會對

  這部片的聲音設計印象深刻。」為了完美詮釋角色，李先彬也投注大量心力：「驚悚片是

  非常困難、講究細節、而且非常耗費體力的類型。在沒有音效、沒有配樂的場景裡，我必

  須靠自己來填補整個畫面，那些時刻幾乎都是獨角戲，非常考驗演技。我很努力去打磨細

  節，但觀眾能否感受到，我也不太確定，所以當大家跟我說『很可怕』或『很好看』時，

  那種反應真的讓我非常感動。」





  李先彬對自己在《噪音殺機》中的演出，原本就抱持不小壓力，但在VIP試映會後，她終

  於如釋重負；看著親朋好友在影廳裡的驚嚇反應，讓她忍不住興奮直呼：「試映會後，我

  整個被多巴胺沖昏頭，到早上六點還睡不著！」李先彬笑說，男友李光洙也來捧場，結果

  被嚇到當場把爆米花灑了一地：「他本來就很怕看恐怖驚悚片，結果當場被嚇到把整盒爆

  米花灑出來，超好笑的！不過他願意來看就已經很感謝了。」她透露李光洙看完跟她說：

  「好可怕喔！」還補了一句：「看得出來妳很辛苦！」這也讓她有感而發：「畢竟他也是

  演員，只要看畫面就知道拍攝過程會怎麼樣，因為他現場也有看著拍，所以可能更加了解

  吧。」不只男友，李先彬的圈內好友也在影廳裡嚇到花容失色，她笑說：「我很親近的妹

  妹盧正義，看電影時買了熱狗，結果嚇到整個噴飛，還把番茄醬弄到椅子上。」甚至還有

  幾位前輩坦言：「我是為了妳來的，但真的不敢把它看完。」這些反應對李先彬來說，不

  是打擊，而是最真實、最甜美的肯定。她感性表示：「作為一部驚悚片，當大家都說『看

  不下去』時，對我反而是一種稱讚，讓我覺得我曾經的努力都獲得了回報。」



  這部國際版權狂銷117國、南韓票房突破3.7億台幣並好評不斷的《噪音殺機》，即將在8

  月29日於全台驚駭獻映。本片劇情描述有聽力障礙的珠英（李先彬飾演），與妹妹珠憘（

  韓秀娥飾演）終於買下夢寐以求的新房，卻沒想到噩夢才正要開始。某天起，珠憘開始被

  來自公寓某處的神秘噪音折磨得身心俱疲。那讓人不耐的樓層噪音，不僅讓她無法安睡，

  更像是潛藏某種黑暗秘密的警告。正當珠英離家工作時，珠憘突然失蹤，讓驚慌失措的珠

  英立刻趕回家，並與珠憘的男友基勳（金珉錫飾演）聯手追查真相。同時，住在樓下的神

  秘男子（柳炅秀飾演）也長期受噪音困擾，認定一切都源於樓上的這對姊妹，讓他情緒逐

  漸崩潰，揚言要對她們痛下殺手…。真相究竟藏在誰的耳中？噪音背後，又是誰的瘋狂正

  在近逼？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
