url: https://www.ptt.cc/bbs/movie/M.1742031556.A.C16.html
title: '[普雷] 封神2 戰火西岐'
content: '其實比想像中好看

  不懂對岸怎麼口碑炸裂

  但至少該有的大場面都有

  應該給好雷的

  但殷郊法相的粗糙濫製感在整部電影貫穿

  還是給個普雷就好 但真的算好看的電影


  如果想跟魔戒的聖盔谷比絕望感

  這部戲還遠遠不足

  且基層士兵的廝殺場面覺得還可以更多


  好看是魔家四將的威壓感有做出來

  但是又一下被殷郊暴力碾壓 就沒了

  這集就看殷郊 一人救全場

  楊戬、哪吒反而淪為打下手的角色

  可以更多描述姬發與西岐將士犧牲

  整部電影會更動人


  總之 鄧嬋玉角色加的分 通通被殷郊扣光

  還是不懂 怎麼有那麼兒時卡通感的成品出現

  偏偏他又是正方最強戰力

  但片長2.5小時 不覺枯燥冗長

  畫面、美術、音樂、動作皆為上乘

  算好看的娛樂電影


  --'
