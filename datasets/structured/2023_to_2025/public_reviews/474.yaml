title: '[好雷]封神二:戰火西岐 '
content: '昨天假日不用上班，前往高雄夢時代看這二部


  之前水管有播放24小時第一部


  其實比原本預期中好看，真的大場面、高特效就要去電影才能體驗


  從頭看到尾不會讓人想睡覺，而是大戰一場接一場


  鄧嬋玉這腳色選的很好，英氣勃發


  聞仲也展現統帥的不怒自威，不愧是當年賭神2的仇笑癡


  會進戲院的原因一半也是衝著仇笑癡而去


  當年那句:我在法國看過一幅畫，是不是你?


  到現在還記著XD


  如果說缺點就是姬發跟鄧嬋玉的感情戲，姬發會讓人沒帶入感情


  連最後劇終唱歌時會讓人出戲


  殷壽跟妲已對手戲帶入感情


  總之值回票價，光看動作跟特效、大場面就值得


  最後彩蛋的特效也很精彩!


  --

  韓非:


  國小而不處卑，力少而不畏強，無禮而侮大鄰，貪愎而拙交者， 可亡也


  --'
