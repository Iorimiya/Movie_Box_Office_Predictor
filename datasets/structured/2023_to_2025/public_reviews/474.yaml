title: '[好雷] 《封神第二部：戰火西岐》比想像中有料'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  《封神第二部：戰火西岐》比我想像中更有料。

  .

  上一集《封神第一部：朝歌風雲》我覺得是還不錯，但就是娛樂性夠高的佳作，不能說是

  極愛。而中國已經先一步上映的《戰火西岐》，目前看到的評價是炸掉了，我因此稍微把

  對第二部的期待調低了點，沒想到實際看完《戰火西岐》之後竟意外覺得這片非常精采。

  我認真說，我自己是覺得這片比第一部還好看的，如果你喜歡《朝歌風雲》而且覺得沒辦

  法進電影院看到是件遺憾的話，那這片一定要進電影院看，最好是直接看IMAX版的，很值

  得。但先講個前提好了：我沒看過原著，如果負評的原因是因為爆改原著之類的這我也沒

  辦法評斷了。

  .

  當然我不確定這是不是跟我把期待擺低了有關係，我在第一集的文章裡是這樣寫的：「原

  來《封神》在講的好像根本不是一個這樣的故事(各種神魔大戰)，至少這第一部還不是。

  也或許還好它不是，因為我想像中的那種電影很吃特效，而這片的特效依然是中國電影常

  見的暴發戶水準。」當時就有網友留言第二部評價會差的原因，是因為它真的就變成那樣

  的電影了。我進電影院前對這片的預期，是徐克最近幾年亂拍一通的那種東西，什麼《西

  遊伏妖篇》或是《狄仁傑之四大天王》這種我完全不知道拍給誰看的垃圾─話說徐克最新

  那部《射鵰英雄傳：俠之大者》在中國評價也大爆炸，不過基於研究心態我還是蠻想看的

  ─我說這樣的期待標準應該真的夠低了吧。

  .

  先講講特效的部份，其實沒我想像中的那麼爛，當然沒辦法跟好萊塢最頂級的特效比，但

  連續幾個戰鬥場面其實都很不錯，從峽谷打到山上打到水裡再打到平原，一直到最後的十

  絕陣都蠻具看頭與想像力的，震撼度跟娛樂性都夠高，哪吒跟二郎神這兩個用大量特效戰

  鬥的角色效果也都處理得不錯，上集爛到像PS1特效的崑崙山，這集也稍微進步了點，大

  概是PS2等級，還好劇組多少有點自知之明，沒在這邊停留太久。

  .

  不過我看中國那邊最為人詬病那個三頭六臂的藍色巨人就真的爛到沒救，這個無法護航，

  而且這個角色不只特效差，還用一種帶些戲謔、油膩感的方式來呈現這個角色，讓這一切

  變得更加糟糕，基本上他每次出現在畫面上你都會希望他快點下去。但我一直覺得這片特

  效上真正的問題其實還不是好壞的問題，反而是美感的問題，當然這可能是個人審美的關

  係，這很主觀，不過即便特效做好了，那個藍色巨人呈現的方式還是很蠢，魔家四將跟雷

  震子也醜到不行，而且這魔家四將還被演成一種智力不足的憨厚感，看這幾個傻大個爭先

  恐後地卡在峽谷裡出不來、或是劍被偷了沒人被吵醒等場面，已威嚴盡失，這樣很好笑？

  .

  我是說，這些都已經是完全用特效呈現的角色了，有什麼理由不能把他們做的......呃，

  帥一點？我說那個墨麒麟就蠻帥的啊。尤其烏爾善明明是以美感著稱的導演的，至少我看

  過的《畫皮II》還是《尋龍訣》這兩部在美學上都讓我留下了蠻好的印象，這片應該是能

  讓他大展身手的機會的，沒道理搞成這樣啊。

  .

  但我還是覺得，這片竟然多少改善了我前陣子寫上一部時提到的缺點，我當時說「台詞的

  部份應該能再更打磨、更精煉一點，有些解釋性的台詞、還有那種中國電影裡面莫名一定

  要出現，但其實刪掉會更好的幼稚搞笑場面都扣了點分」，不只《封神》系列，這是許多

  中國電影都有出現、我一直受不了的部份，尤其那種彷彿在跟觀眾說「你看我正在搞笑喔

  ，拜託你笑一下啦」的硬要搞笑，幾乎是在跪著求你笑了，中國好像沒有這樣的段子就拍

  不了電影似的。但這片還真的減少了不少這樣的場面(當然還是有)、節奏敘事也更簡潔穩

  健，片長將近兩個半小時，但體感時間非常快。

  .

  當然節奏敘事的改善我覺得多少也跟這集的文本架構有關，跟許多三部曲中的第二部一樣

  ，這片最重要的任務還是承先啟後，它的單獨觀看性跟完整性可能會是三部曲中最低的一

  部。上集文戲居多，這集則幾乎用武戲占滿，每打完一場讓角色們稍微休息回個血馬上又

  打下一場了。我想這可能是這集評價不如上集的原因之一，它確實缺乏上集那種很具戲劇

  張力的文戲，上集最演技最好的費翔跟李雪健，一個負傷躺平一整集，一個已經躺到直接

  埋起來了，文戲/演技擔當幾乎是演出聞仲的吳興國一個人全扛了，很完美地詮釋出了一

  種近乎著魔般的愚忠，是整部電影少數的文戲亮點。

  .

  而我想我對這集的觀感比上集更好，多少跟觀看的管道有點關係，上集是在家裡用串流看

  的，這集看了IMAX版，剛好這次從頭打到尾，畫面跟音效在硬體上的全面升級把這片所有

  的優點放到最大，戰場上的千軍萬馬、每場戰鬥之間的來回交鋒、還有最後十絕陣的視覺

  奇觀，這些場面全部都是為了大銀幕而生，儘管前面嫌棄魔家四將長的醜，但當他們拿起

  無限砲火的兵器橫掃戰場時，那畫面還是精彩。我必須說這樣說：這真是一部屬於電影院

  的電影，它或許不會成為什麼中國版《魔戒》這種被永久傳頌的經典，但它就是那種會讓

  你想起來電影可以有什麼魔力的典型商業大作。

  .

  不過說到十絕陣，我還是必須吐嘈一下最後姬發破陣那段的安排，明明當下已經是所有人

  命懸一線的絕命時刻，姬發那邊所有障礙也都排除，只要爬幾個階梯就能破陣了，但那邊

  卻為了製造緊張跟絕望感、還要讓激發掙扎一下好收素他的感情線，整段莫名拖拖拉拉的

  ，這邊看了蠻煩躁，如果要挑整部電影最打亂情緒的敗筆，我會選這段。

  .

  說了這麼多，其實這片的優點光講一個就夠，一個可以擋掉十個缺點，就是演出鄧嬋玉的

  那爾那茜實在太帥，我最愛帥氣的女人了，而一個女人帥成這樣是犯法的。她在這片的造

  型、氣勢還有氣質讓我直接進入戀愛腦模式，想要跟她原地結婚的那種，只要她出現在畫

  面上，什麼問題都不是問題，我基本上沒辦法去在乎任何其它事情。你剛剛跟我說這片有

  什麼缺點來著？不好意思我頭有點暈，沒聽清楚。話說回來，之前烏爾善在《尋龍訣》中

  也把陳坤拍得帥到爆炸，為什麼這片造型可以如此不帥？

  .

  最後，既上集殷郊被綁了半套龜甲縛後被玩成迷因後，這集升級成主角的姬發也躍躍欲試

  ，突然主動脫起衣服、要鄧嬋玉把他綁起來(啊我也想)，這儼然已成了這系列定番，我是

  不知道接下來故事會怎麼演啦，不知道還有沒有機會綁一下紂王。這集票房好像不大理想

  ，但我是真的蠻想把這個故事看完的，希望還有下集能看。


  --'
