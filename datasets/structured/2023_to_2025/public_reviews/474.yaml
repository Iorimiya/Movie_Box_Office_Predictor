url: https://www.ptt.cc/bbs/movie/M.1742176966.A.91B.html
title: 'Re: [普雷] 封神2 戰火西岐'
content: '非常同意這篇

  由於對岸口碑很慘降低了預期心理

  實際去看真的覺得沒那麼糟


  特別是紂王+妲己的所有戲分

  大體上延續了第一部的鋪墊

  妲己病態的全心投入的愛

  跟紂王為了報答妲己所以殺手下

  非常OK 比原版紂王為了殘暴而殘暴好多了

  就連派出鄧蟬玉和聞太師的兩場戲

  也是很高分


  但相對來說西岐的戲就很OOXX

  我覺得中國寫完全正面的主角都寫不好

  姬發又是一個絕佳例子

  整個戲下來 完全像個花瓶空殼

  所有決策都毫無道理

  可怕的是有這種糟糕至極的統帥都還能大勝@@


  同樣是大軍+法術

  魔戒做得非常好

  大軍對戰是主線 法術只在關鍵時候發揮作用

  強度也是大軍>法術

  但封神設定上強度就完全失衡了

  大軍<四巨人<藍巨人<教主

  大軍完全是笑話 一個殷郊應該就能殲滅第一部殷壽率領的沒有法術的質子大軍

  電影裡甚至一個真正的兩邊大軍互打的戰爭場面都沒有..

  跟第一部哪吒和楊戩vs凡人的強度對比

  可以說完全壞掉了

  (所以哪吒和楊戩在二部的戰場也只剩龍套功能了)


  最後 通天教主的造型實在是..



  --

  對 回頭看殷郊的設定根本從頭就錯到尾

  現在設定是吸乾元始天尊 所以只能變超強

  若改成復活後只有楊戩強度 殷郊+楊戩+哪吒努力幹掉三個巨人

  應該都會比現在秒殺好多了

  (現在的聞仲大軍..笑死 我藍巨殷郊一個人打全部都有剩)'
