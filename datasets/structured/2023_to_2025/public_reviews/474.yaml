url: https://www.ptt.cc/bbs/movie/M.1742189829.A.EFD.html
title: 'Re: [普雷] 封神2 戰火西岐'
content: '恕刪


  烏爾善利用兩本原著改編，讓封神2成為了一部娛樂好看的電影，但卻不是部能夠為劇本

  稱讚的電影。


  一部分取至封神演義、一部分取至武王伐紂平話，最後一部份取至自己的改編；這樣的形

  式不能說不好，但很容易陷入雜燴，就像一套劇本很多編劇在撰寫，風格多少不盡相同。


  先舉藍色螢光巨人為例，封神原著中殷郊是因犯斬首之罪，而被救去崑崙山大學就讀，這

  點1、2部還算符合，但2部開頭為了戲劇張力，也能理解殷郊吸收元始天尊的法力，為得

  是鋪成反叛周軍；但老實說元始天尊被吸得要死不活，整個玉虛宮教室支離破碎，營造出

  藍色螢光巨人有著碾壓級的戰力，但在西岐前戰，僅僅打掉魔家將，沒有盡滅大軍，在邏

  輯上我還是可以理解劇情還是得演下去，不能開幕就結業，還是得在某一方戰力上做點降

  維。


  但三部曲中，也是整個封神演義滿重要的橋段「九曲黃河陣」，這陣法是被元始天尊與老

  子所破

  ，但這位崑崙山大學校長已經半死不活了，我實在很難想像到時會怎麼魔改這個陣法，畢

  竟十絕陣也不是那個十絕陣，就只是拿出金光陣與陰陽鏡混合的十絕陣，而陰陽鏡只有哪

  吒不受影響，還是多少符合了劇中哪吒用了混天綾護民的威力，真正破金光陣的還是需要

  法寶，但劇中把願者上鉤這橋段運用在破陣，立意良好，但卻把聞仲這位苦征北海的大將

  下調了智商，難怪會去打了10年。


  雖然可以理解十絕陣需要大量的出場人物，對於篇幅有限的劇情，是沒辦法再去說明聞仲

  與金鰲島之間的關係，也因為如此，假如九曲黃河陣會出現在三部曲，我想也是難逃被魔

  改的命運。


  再來就是姬發，當然可以理解要捧出于適這位演員，但可惜的是劇本對他卻是相當不友善

  ，首部曲前端完全被費翔與娜然給壓著走，後段被父王李雪健老師拉走眼球，縱使李雪健

  老師聲帶受損，表現上還是優於于適，而姬發在原著上本就是後段角色，但為了捧，硬是

  加入了因肌肉引起話題的質子團，反倒是淡化了原本封神主角姜子牙，不過還是可以「再

  度」理解，顏質與身材對於投資方來說，應該是吸票房的考量。


  第二部的姬發，我認為角色上刻畫還是有進步，還是有為這個在前段硬抗出來的角色，做

  出了情感上的加成，只是我沒想到，先不說這個角色又被鄧嬋玉給碾壓，已經演完二部曲

  了，還未有原著中姬發的色彩，如果到第三部才要顯現，我想整個轉折會相當生硬，畢竟

  姬發也是靠著姜子牙長期的輔佐，才能成為八方諸侯擁戴的武王，但姜子牙依然被淡化，

  甚至文王遇子牙的部份是整個被大砍改編。


  封神與魔戒，我相信烏爾善是想仿效魔戒的磅礡感，但封神與魔戒本質上是完全不同的東

  西，封神一向以兩教的仙法、法寶、陣法及人物之間的鬥智鬥法，甚至可以說是場天庭的

  大型面試；但實際上既沒有許多神仙打架鏡頭，磅礡大軍也沒有太多的篇幅，進而展現特

  效軍火演示，雖不到畫虎不成反類犬程度，但絕對有符合搔不到癢處。


  雖然知道整個三部曲加起來可能達到9小時片長，但始終撐不起有著百回合、無數人物的

  封神題材，加上為了捧明星而大量改編，這讓期待原著黨的觀眾，失落極大，但要是不熟

  封神的觀眾，卻還是能樂在其中。


  --'
