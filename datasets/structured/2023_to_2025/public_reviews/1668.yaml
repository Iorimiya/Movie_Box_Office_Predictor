title: '[好雷] 炎日 Burning Days'
content: "雷文防雷資訊頁\n\n炎日\nBurning Days\n2022土耳其電影\nKurak Gunler\n\n\n\n\n\n\n年輕檢察官充滿傲氣與道德正義感，來到人生地不熟小鎮，看似平靜背後卻暗潮洶湧。鎮\n\
  長兒子邀約宴請檢察官至家中吃飯，酒酣耳熱之後檢察官喝到不醒人事，沒想到隔天鎮長\n家中發生性侵案件，自認清白的檢察官展開公正調查，目擊證人卻是與鎮長敵對的報社發\n\
  行人，兩人曖昧關係以及他酒後破碎殘留的記憶，更讓這起案件撲朔迷離…\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n被本片海報，預告片及劇情介紹而吸引，追看完感覺很棒，前段鋪陳累積一些情緒及小鎮\n\
  缺水困境的狀況，可能有些人會覺得沈悶緩慢而棄看，看到最後收尾之爆點。Bravo.覺得\n很棒！\n政治驚悚片類型的傑作！\n\n極具戲劇性的電影，酣暢淋漓的鏡頭語言，一部內容豐富帶點迷幻色彩的寫實鉅作。\
  \ 開\n場和結尾都太驚艷了！\n\n個人滿意度85分（滿分100）。\n\n以下有劇透。\n\n\n\n1.本片呼應到土耳其當今，全部或某些地方？執政單位的腐敗、玩弄的政治遊戲，類似黑\n\
  社會一般的手段，以及土耳其的愚民、暴民的現象，古今中外的政治黑，皆類似吧？\n\n2.從一開場並貫穿始終的強大攝影、到剪輯音樂和表演，都讓人眼前一亮。一個在土耳其\n\
  某小城新上任的充滿正義感的年輕檢察官，在面對這地方的供水問題、選舉、天坑、以及\n反覆發生卻不了了之的強姦案，他想要秉持正義，卻被複雜的、官官相護又各懷鬼胎的政\n\
  治人際網，一步步帶入流沙似漩渦。全片用章回體的方式，將故事分隔，並在輔線將「男\n主角被下藥、又身處強姦案發生現場的那夜」，由男主角視角、以酒後斷片閃回的記憶片\n\
  段呈現，一點點為觀眾拼湊真相全貌。是一部全程牽著觀眾目光，劇情緊湊扣人心弦的政\n治驚悚戲。土耳其的政治凌駕、官僚腐敗，在前不久的大地震之後，再次被曝光在世人面\n\
  前，本片的社會現實意義，引人省思，結尾收在近乎失控又略超乎現實的高潮，非常震撼\n。\n\n3.開場的sinkhole天坑和hunting獵殺野豬的場景，暗示了年輕的檢察官即將面臨的困境\n\
  ？土耳其小城缺水的現實困難，和傳統生活方式埋伏著暴力的精神問題。 而這兩種困境\n，正是現任市長加以利用的民粹情緒的根基。 市長控制著水的供應，以此控制市民基本\n\
  的生活需求，另一方面，他又鼓勵獵殺狂歡，滿足市民的「精神」需求，通常可以用一個\n很好的詞來掩飾，即「傳統 」。\n\n4.有著「現代」特質的年輕檢察官初來乍到，他以自己是「法之奴僕Man\
  \ of Law」的身份\n，試圖公正地處理地下水工程建設問題，但很快地他被設計捲入強奸案。 在那個可能被\n酒中下藥後迷幻的夜晚，他不知道自己有沒有參與強暴了吉普賽女孩，他也不確定自己是\n\
  不是在浴室被記者「強暴」了？現在麻煩來了，自己可能已經違法犯紀，還可能違背了當\n地的傳統，被貼標籤成為本地認為下流又恥辱的男同標記？\n\n5.選舉前夕的夜晚，又一次狂歡和獵殺，市長煽動起了民意，搗毀了記者報社，攻擊檢察\n\
  官住所。 像開場時候眾人獵豬一樣，這一次，烏合之眾打著手電筒獵殺檢察官和記者...\n\n6.Sinkhole天坑除了是缺水而抽地下水而造成的地面塌陷現象，也令人聯想到對土耳其政\n\
  治的狀況，惡性循環為了生存sinkhole會越來越多，而越來越多的sinkhole又危及人的生\n存。\n\n7.轉貼douban精彩評論文，網址如下：\n\n\
  \n\n8.轉貼本片評論大好評的文章字句之摘要：\n\nA.\n在土耳其電影陷入Nuri Bilge Ceylan努里比爾格錫蘭風格的情境電影，和不成功的喜劇\n\
  電影之間的貧瘠時期，這片Emin Alper艾敏阿爾珀的作品相當特別。 他不僅以引人注目\n、嚴肅的風格，傳達了他想要傳達的訊息，而且將緊張的元素保留到最後一刻。\
  \ 除了故\n事的地理與調色板的和諧之外，攝影機角度通常也很成功。 主演 Selahattin Pasali 和\n Ekin Koc 的表演非常出色。 他們之間的緊張關係令土耳其某些群體感到不安，也揭示\n\
  了影片內容的話題性。\n\nB.\n這部引人入勝的電影的深刻戲劇性和幽閉恐怖感，是電影的經典範例——事實上，我發現\n當代土耳其電影是世界上最好的電影之一，也是最穩定的。\
  \ 反派充滿恐怖，有一個完美\n的女性受害者，兩個主要角色都非常複雜，在主角和對抗之間搖擺。 添加了同性戀層次\n，所有這一切都被淹沒在腐敗和征服的壓迫性和過於真實的故事中，暴民可能是其中最大\n\
  的惡棍。 電影攝影非常出色，有些場景堪稱藝術品。\n\nC.\n對安納托利亞中部農村地區令人不安的真實社會政治分析。 它處理得非常好，讓你對情\n節感興趣。 很多戲劇也強調司法系統內部的腐敗。\
  \ 任何執法人員都無法在政治和操縱社\n會的陰影下真正履行職責。 考慮到法官、檢察官和警察的三角關係，指揮鏈也得到了很\n好的體現。 為了了解土耳其的局勢，這絕對是必須關注的。\
  \ 它被低估了，應該得到更多\n的推廣。 我不認為它在土耳其媒體中得到了應有的讚譽。\n\nD.\n精彩懸疑犯罪劇\n警告：劇透\n這部令人難以置信的電影由一位偉大的導演執導，絕對值得一看。\n\
  當然，正如人們所期望的那樣，表演非常出色，而且他們的角色工作確實為伴隨它的宏偉\n劇本增添了色彩。\n攝影、剪輯和剪輯都令人難以置信，無可否認，這部電影的拍攝確實非常精美。\
  \ 從各個\n方面來說，一切都非常漂亮地組合在一起。\n劇本總體來說非常微妙，非常懸疑，而且寫得非常巧妙——有很多曲折、轉折和情感。\n總之，這絕對是一部寫得非常好的電影，強烈推薦給所有電影愛好者！\n\
  \nE.\n 我的天啊\n 警告：劇透\n就像...我沒想到這件事會這麼好。 實際上，它是安納托利亞人的一面鏡子。 這部電影\n是真實的，真實的。 這聽起來可能很奇怪，但這部電影給了我很多希望，同時也讓我充\n\
  滿了希望。 他們沒有放棄並屈膝。 但實際上，電影中真正的安納托利亞人，永遠不會看\n這部電影。 這讓我覺得，事情永遠不會改變。\n\nF.\n 精彩的影片\n\
  這部電影簡直太棒了，我祝福每一個做出貢獻的人都擁有健康的心……它就像一記耳光打\n在了這個國家的現實上。 當它完成時，它會點燃一盒需要點燃的火柴，以治癒真正開明\n\
  、善良和有意識的人們的思想和心靈，並治愈這個國家。對於其他人來說，它一定創造了\n一些一種如釋重負的感覺。 我希望……動物的屍體被怪物變身的人類流著口水的唾沫追\n\
  逐，這一事實肯定擾亂了邪靈。 我們對電影、藝術家有何期待？ 這不就是把事實擺在臉\n上嗎？ 這不就是我們想要面對自己的願望嗎？ 在我看來，真正的藝術家是上帝在這個世\n\
  界上的使者。 他們引領人類生活在真、美、誠實、人性與和平之中。 這些大使的數量並\n不多。 我衷心希望這部電影的價值以及在我看來這位“大使”艾敏阿爾珀和他的整個團\n\
  隊將得到讚賞...\n\nG.\n 被低估\n首先，這是一部精彩的作品，成功地藝術地呈現了土耳其（也許還有許多其他國家）最近\n的社會結構和國內事件。 應該不帶任何偏見地觀看。\
  \ 絕對是土耳其電影的希望燈塔。\n\n如果我需要添加我的個人觀點，我認為如果我們能夠看到兩個主角之間的吸引力，那將會\n更加戲劇性和明顯浪漫。 我只是喜歡演員們彼此之間的和諧。\
  \ 但這只是一個小細節和背\n景故事。 除此之外，這是我看過的最好的電影之一。 有時間我會再看一次。\n\nH.\n非凡、史詩、被低估\n它具有非凡的說故事風格，同時又具有非常現實的故事。\
  \ 當你處於電影的赤裸裸的真實\n之中時，你也會有一種不真實的感覺。 驚心動魄、幽閉恐怖的故事給人一種享受。 人物\n設計得很好。 一個與    所有電影不同的故事。\
  \ 這類電影證明創意仍然存在。 它有一\n些東西要講，並以一種令人印象深刻、令人愉快和有趣的方式進行。 演技很棒。 男主角\n的造型與他的角色非常契合。 電影的結局讓你看完之後這種感覺依然存在。\n\
  \nI.\n 誰正在被追捕？\n 警告：劇透\n多麼棒的電影。 這部電影是一部真正的傑作，可以被視為一部驚悚片、一部黑暗的政治\n諷刺片、一部土耳其視角的西部電影，甚至是一部愛情故事。\n\
  \n攝影是強大的，天坑既是字面的，也是隱喻的。 這部電影表達了對權力的思考：擁有它\n、爭論它、參與它。 這完全是權力鬥爭的問題，伴隨著傳統、腐敗、威脅和難以維持的\n\
  平衡。 國家和村莊，外來者和當地人，受過城市教育的入侵者以及居民的野蠻和痛苦（\n解放氛圍）。\n\n如果說對權力的思考並不新鮮，那麼這部電影對人性的模糊性，進行了偉大而原創的反思\n\
  。 一個渴望正直行事的人，會幾乎同時成為掠奪者和受害者嗎？ 儘管這個村莊地處偏遠\n、與世隔絕，但利用毒品來操縱某人的話題，卻非常當代，並且與大城市息息相關。\n\
  \n最後一幕令人難忘。 做得好！\n\nJ.\n 美學與政治的結合\n艾敏阿爾珀的第四部電影奇蹟，不僅以獨特的電影風格，恰當地描述了土耳其的社會和政\n治當代狀況，而且還完美地嘲弄了這種狀況。本片既具有政治現實性，又具有藝術性。\n\
  電影結束時，你坐在戲院的座位上，有一種被理解的感覺，一種被理解的感覺，伴隨著一\n種難以形容的喜悅的情感。 這是一件非常巧妙、引人注目的藝術作品，充滿了機智、諷\n\
  刺和諷刺。 劇本相當令人印象深刻，幾乎沒有什麼缺點，攝影、藝術指導和音樂尤其強\n大。 而且，在選角方面，Selahattin Pasali 和 Ekin Koc\
  \ 出色地表達了他們的角色，\n而配角的表演也令人印象深刻（尤其是扮演 Kemal 的 Erdem Senocak）。\n\n\nK.\n 非凡的心理和政治懸疑電影。\n\
  本片片名，在土耳其語中的字面意思是“乾旱的日子”，是一部非凡的心理/政治懸疑電\n影，我從一開始到最後一分鐘都沒有呼吸。 如果我們在過去20年經歷了所有的恥辱和恥\n\
  辱，但仍然能被這部電影中發生的事件所深深影響，這意味著這個國家仍然有希望。\n\n懸念一直持續到電影結束，同樣得益於出色的配樂和完美的表演，尤其是才華橫溢的土耳\n\
  其年輕演員塞拉哈丁帕薩裡 Selahattin Pasali。\n\nL.\n野豬\n如果你與別人不同，並且說實話，你就會像野豬一樣被獵殺。 當社會中有些人的行為不\n\
  符合公認生活方式的期望時，這部電影勇敢地批評了社會。 腐敗的保守社會破壞了障礙\n，並由於生活方式不同而對新來者俱有侵略性。 社會上的天坑如此明顯，以至於他們常\n\
  常忽視可能威脅到他們生命的科學現實。 水資源匱乏，為腐敗的政治提供了自由行動和\n濫用法律的機會。 然而反對派是無辜的我們，永遠無法知道。\n\nM.\n近年來製作的最好的土耳其電影之一\n\
  我帶著對這部電影的期待走進了電影院，然後心滿意足地離開了。 當然，有些事情我覺\n得不切實際，而有些事情卻非常現實。 並不是每個人都喜歡這個結局，但我喜歡我們可\n\
  以討論並提出不同的意見。 我喜歡它的象徵意義和它所傳達的訊息。 電影攝影很棒。\n我將這部電影稱為一部代表「The Other他者」的政治驚悚片。 這裡的另一個可以是很多\n\
  東西，包括「女性」（與男性）、「城市」（與鄉村）、「酷兒」（與cishet）、「公正\n」（與腐敗）、「少數」（與多數） 。 我相信這部電影值得我們的支持。 儘管只有\
  \ 2\n小時 9 分鐘，但從未有過這樣的感覺。 我從來沒有意識到時間過得有多快。 我正在考\n慮重看。\n\n#炎日\ns\n#土耳其電影2022\nr\n\
  #政治驚悚片\n#缺水\n#天坑\n導演\n\n--\n\n 02/16 15:08\n\n謝謝小羊大大留言，希望你未來有機會能夠看完本片及心得文分享，衷心盼望！\n\
  我在中華電信MOD看完本片，挺喜歡的。\n\n\n\n呵呵，古今中外的政治黑暗都大同小異，這片的天坑奇景，堪稱一絕。\n\n同感！真是...同時感覺很棒。矛盾，哈哈哈。"
