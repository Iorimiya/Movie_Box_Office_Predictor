url: https://www.ptt.cc/bbs/movie/M.1367745319.A.297.html
title: '[好雷] 小勞勃道尼經典詮釋--卓別林與他的情人'
content: '最近《鋼鐵人3》電影上映造成洗版，小勞勃道尼依舊是魅力非凡，這又讓我重溫他1992年

  的成名作品《卓別林與他的情人》。當時才二十七歲的他飾演影史傳奇人物，傑出的成果

  獲得奧斯卡最佳男主角提名。看完這部片能讓你更喜歡卓別林跟小勞勃道尼，並且見證兩

  位橫跨世代的天才演員同時在銀幕上活躍。



  接下來是含有劇情的感想



  傳記電影只要選對主角就成功了一半，如何精準揣摩人物神韻相當關鍵，而小勞勃道尼證

  明他的確是飾演卓別林的不二人選，他對這種專業又有自信的角色處理起來相當熟稔。此

  外兩人不僅身形接近，連長相也略為神似。畫老妝有些人認為有點假，不過我還能接受。



  不過好的傳記電影除了適合的選角，劇本改編也相當重要。台灣翻譯的片名似乎告訴觀眾

  一個重點，那就是本片的主軸放在卓別林的愛情故事。當然在看完這部片後，我必須說若

  真要取個片名恐怕很長《卓別林與他的情人、家人、恩人、朋友、死對頭、司法不公、政

  治迫害跟成就》，所以乾脆縮短取個《卓別林傳》就好了。這也暴露一個缺點，那就是這

  部片想把卓別林生平大事都呈現出來，想要面面俱到又變得有些瑣碎，最初剪輯的版本據

  說長達四個小時！這讓本片的分數打了些折扣。不過幸好這部片不像政治人物傳記，例如

  《強艾德格》、《鐵娘子》跟《林肯》那樣嚴肅，非得兼顧批判的力道。因此即使像流水

  帳也不至於沉悶，反而滿有趣的。



  整部片最有趣的片段即卓別林向傳記作家敘述他如何創造經典銀幕角色，就是那個頭戴圓

  頂禮帽，穿尺寸過大的褲子跟皮鞋，手持竹拐杖，嘴上黏著小鬍子的「流浪漢」。卓別林

  用一段優美又夢幻的文字，告訴對方這個角色在他踏進試衣間時就在呼喚他。而安東尼霍

  普金斯飾演的作家直接了當地說：bullshit, and you know it. (都是唬爛，你自己也知

  道) 卓別林回說：But the truth was so boring. (但事實真相太無聊了)接著下一幕我們

  看到年輕的卓別林急忙換衣服趕上台，在他跨出試衣間後影史上最鮮明的符碼於焉誕生

  (話說這一段的配樂不錯) 接著就是他的即興演出獲得大家讚嘆。不過事實上這段戲劇化的

  情節也是電影自己創造的，意外反映了先前那一段對話，算是玩了小小的後設手法吧！


  這是真實世界裡卓別林第一次以流浪漢為形象演出


  當時只是老闆要求他換上喜劇的扮相


  這是電影的改編




  另一個印象深刻的地方就是卓別林成名後回到英國，在火車上被告知原來他念茲在茲的初

  戀情人Hetty已經過世。接著火車進入隧道準備進站，小勞勃道尼的臉色轉為黯淡，窗外的

  人興奮敲著玻璃大喊Charlie，他落魄地走出車廂靠著牆壁哀痛。別人遞給他外套跟帽子問

  他該怎麼辦，他淡淡地說笑一個 (Smile)，接著走出去迎接熱切群眾。這段小勞勃道尼內

  斂卻深切的演出著實令人心碎啊！想當初卓別林穿戲服挽著Hetty去餐廳卻被拒絕入內，接

  著跟對方發誓去美國成名後要回來娶她並打餐廳侍者的臉。結果去美國名利雙收卻看到愛

  人的信說已經嫁人，回來故鄉更慘變成天人永隔。而事實上卓別林當時的情況就跟電影演

  的差不多，但是由對方的哥哥在火車上通知噩耗，接著馬上又要調適心情面對大眾。還真

  的驗證了人生如戲這句話。(這讓我猜想假如Hetty很早答應他成婚，那卓別林可能就不會

  離開英國，更不會成為我們今天認識的樣子，這又讓我想到《新天堂樂園》的劇情..)



  本片穿插了不少卓別林真實電影畫面，而有些是融入卓別林日常生活由小勞勃道尼重現，

  像是他在與胡佛聚餐時表演在《掏金熱》裡的桌上麵包舞，以及拍攝《大獨裁者》時那段

  有名的演講。他也學會講流利的Cockney (倫敦東區的方言)，口音還隨著片中時間演進慢

  慢轉變，並試著用左手打網球跟拉小提琴，看得出來在模仿方面小勞勃道尼花不少工夫。

  其實他早年也參與過周六夜現場，在模仿這領域也有天份。而為了這個角色他把卓別林所

  有電影都看完，日後別人問他感想如何，他說嚇死我了XD (They scared the hell out of

  me)。中間還有段為了躲避訴訟跑到鹽湖城剪接《尋子遇仙記》模仿了早年喜劇默片的慣用

  手法，利用減速攝影營造快轉的喜感，使人會心一笑。



  當然卓別林對電影的貢獻早就無庸置疑，《卓別林與他的情人》也帶著觀眾去瞭解他的思

  想。如果卓別林是個單純喜劇演員，那他必然無法擁有今天的地位。除了一人身兼導演、

  編劇、演員及作曲的才華外，他最重要的就是對時代的洞察和出身貧困促使對弱勢的關懷

  ，像是《摩登時代》、《城市之光》都是如此。他同時是鮮明的反戰主義者，堅信世界上

  的紛爭很大一部分出自語言的隔閡，這是他在有聲電影時代還堅持拍默片的原因，並非口

  條不好，他在《大獨裁者》證明他開口講話一樣可以擄獲人心。卓別林在片中對有聲製片

  家模仿俄羅斯舞蹈家尼金斯基紮實地闡述這個道理，他的電影是不必靠台詞來理解的藝術

  。(題外話：小勞勃道尼小時候的確學過芭蕾) 不過以上種種特質讓他被當局者盯上，由於

  他從未入美國籍，又被懷疑是共產主義者，在戰後被美國拒絕入境，致使他舉家搬到瑞士

  。直到1972年奧斯卡頒給他特殊榮譽獎，洗刷了他的冤屈。他在最後頒獎台落的那一行淚

  可以說是對自己作品歷久彌新被重新接納的喜悅。


  附上當年卓別林領取奧斯卡獎的歷史性影片




  女性角色發揮的地方比較有限。戲份比較多的就是卓別林的媽媽，由卓別林的女兒

  Geraldine Chaplin親自飾演，以及Moira Kelly同時分飾卓別林的初戀情人跟最後一任太

  太Oona，電影可能是想暗示卓別林最後能跟Oona幸福長相廝守是因為對方喚起他初戀的感

  覺吧！也算是給卓別林專吃幼齒一個較浪漫的解釋。其他還有中規中矩的黛安蓮恩、那時

  候還是年輕肉體的蜜拉喬娃維琪、和出場時間很短但聽聲音就認出來的Marisa Tomei。



  電影有些中文字幕較難表達的雙關語。像是卓別林在劇院表演酒鬼，主持人對他說：Take

  your seat(請就坐)，他反而拿起自己的椅子。以及Joan Barry彎腰撿球時說：Women

  drop hankerchiefs. I guess men drop other things(目光)。另外一個網友發現的戲外

  笑點，就是卓別林換衣服換太久，導演抱怨：What''s he putting on? A suit of armor?

  (他在幹嘛？穿盔甲嗎？)，這句話在十六年後果真實現。



  結論就是可惜小勞勃道尼那時候的對手太強大 (有《女人香》的艾爾帕西諾跟《殺無赦》

  的克林伊斯威特)，再加上還太年輕，不然憑他的表現絕對有資格拿到一座小金人。看他最

  近幾年演藝事業再度復活，期待他在未來能帶給觀眾更多驚喜，並得到應有的肯定。


  --

