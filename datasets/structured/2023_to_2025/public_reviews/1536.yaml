url: https://www.ptt.cc/bbs/movie/M.1691064050.A.E94.html
title: '[極好雷] 卓別林與他的情人'
content: '剛好奧本海默上 剛好很多人討論到小勞勃道尼的演技

  剛有這部被譽為他演技最好一部重映


  還好有去看! 真他X的好看!


  雖然以前就看過小勞勃道尼年輕的照片 但動起來比靜態更好看

  真的是花美男等級~飾演一直可以吃嫩妹的卓別林很有說服力


  也儘管那時候還沒那麼東尼史塔克 但不得不說

  也許我們錯怪他被史塔克綁住了 早在那個年代

  他就有很多習慣性動作 其實是小勞勃道尼本人 而不是史塔克風


  但雖然如此 他對於卓別林的詮釋實在維妙維肖

  很多時候的背景 以及黑色幽默的表現簡直像是重現


  劇情結構也很有意思 某些荒謬的時刻

  就重現卓別林的默劇形式 完美呼應了當初卓別林不想只是喜劇

  喜劇往往其實就是人生太過荒謬的重現

  那麼多段的婚姻跟人生故事 也因此不完全是線性剪接

  所以好看不悶 而且真的也把人生大事都交代完了


  在這個時間點看這部 或許意義更為重大

  因為卓別林就像奧本海默 也是另一個被麥卡錫主義搞到的名人

  雖然稍微有讀他資料的人都知道 雖然他很多也是被冤枉

  但卓別林本人真的是喜歡共產 還跟那時候的中國很親近


  總而言之~雖然明明過了整整30年 整部片看起來真的都還不落俗套呀!!

  真的很推薦大家抽空不要錯過 我看的那場人意外的不少 但我想最多再一個多禮拜吧


  話說後面仔細查演員表才知道陣容之前

  第一任老婆是好嫩的蜜拉喬娃薇琪 演媽媽的是卓別林女兒

  一開始沒認出來記者是霍普金斯爺 第三任是黛安蓮恩 好友是凱文克萊


  最意外的是 客串的女演員居然是梅嬸!!!

  不曉得這部是不是他情牽小勞勃道尼的開始呢



  --'
