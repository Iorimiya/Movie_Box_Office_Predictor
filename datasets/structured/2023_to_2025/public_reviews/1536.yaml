url: https://www.ptt.cc/bbs/movie/M.1691244115.A.A48.html
title: '[好雷] 卓別林與他的情人'
content: '有雷



  車庫娛樂這波經典電影的上映

  可惜戲院少、場次也少

  一間戲院一天一場，還不是每天有

  要看的要把握



  對卓別林的印象只知道是很久以前的喜劇泰斗

  就這樣，沒了，畢竟是百年前的人物


  而這部由小勞勃道尼主演的電影

  讓我認識了卓別林的一生，了解他是什麼樣的一個人


  鋼鐵人很久以前看的，也忘記得差不多

  所以我對小勞勃道尼的演技也沒有什麼固定的框架在

  本劇演卓別林演得活靈活現，很讚

  不愧有奧斯卡提名水準


  除了舞台上詼諧的那一面

  私生活各種情緒也表現得很好


  劇中卓別林一生的許多女人

  裡面我最喜歡他的初戀 16歲女舞者海蒂（Moira Kelly 飾）

  年輕的她實在非常可愛，大眼睛、精緻的鼻子和小嘴巴


  劇中安排她一人飾兩角，除了初戀外

  還有最後一任老婆，陪卓別林走完人生路的 Oona

  這樣的安排也滿巧妙的


  劇中的配樂是一大重點

  還有卓別林當時的真實畫面

  在最後奧斯卡頒獎給他那邊，大螢幕上播放他的電影

  雖然都是黑白畫面的默劇，但很自然地引起觀眾放聲大笑

  明明是喜劇，卻讓人感動得想流淚


  很精采的一部電影，推薦


  --'
date: 2023-08-05
sentiment_score: 1.0
