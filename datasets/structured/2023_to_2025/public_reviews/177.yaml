url: https://www.ptt.cc/bbs/movie/M.1721719507.A.9CC.html
title: '[新聞] 《絕命律師》鮑勃奧登科克主演 無名弒2'
content: '《絕命律師》鮑勃奧登科克主演《無名弒2》揭曉反派角色　第一集前作導演、編劇回歸

  製作



  隨著上回敲定熱門動作電影《》（Nobody）將開發續作，且擔任本片主演的《

  》（Better Call Saul）（Bob Odenkirk）也將再度扮演主角「

  」（Hutch "Nobody" Mansell），回歸大銀幕演出後，官方進一步揭曉登場於

  續作的反派角色。




  根據報導，資深女星（Sharon Stone）確定將參與《》的演出，雖然到

  目前為止，官方仍未透露關於新續作的詳細劇情，但現階段可以知曉的是，她將在本作中

  扮演主要反派角色，並與有著令人期待的對手戲。




  其餘則如同先前報導，《》由前作導演伊利亞 奈舒勒（英語： Ilya Naishuller

  ）執導，《》（John Wick）系列電影德瑞克 柯斯達（Derek Kolstad）負責劇

  本撰寫，而凱莉 麥考密克（Kelly McCormick）、大衛 雷奇（David Leitch）也確認將

  持續本作擔任監製回歸參與製作。


  而檔期方面，則也預計將在2025年8月15日於北美戲院安排上映，並由環球影業負責發行

  。


  新聞網址：












  --'
