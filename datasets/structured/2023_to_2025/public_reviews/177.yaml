title: '[普好雷] 無名弒2'
content: '懶人包：基本和上一部一樣，老男人的家庭事+忍無可忍動手+老鬼當家2



  喜歡上一部的話第二集一樣不錯


  故事依舊是給你個簡單粗暴理由然後打打打殺殺殺


  最後改裝本集的場地完老鬼當家爽就完事


  如果討厭上一集後段的老鬼當家的話可以不用去看了


  還是一樣不能細想






  劇情基本上預告片就能看個七七八八了


  直接接上一集，滅掉俄羅斯幫後但燒掉的錢居然還是得主角賠XD


  所以又開始接任務還債，結果因為工作太忙讓家庭感情又出現裂痕


  於是主角和上司請假帶著家人和爺爺跑去度假


  之後不意外的和本地人起糾紛 又不意外的一路牽扯到當地土皇帝


  最終祖孫三人在渡假村直接滅掉整個犯罪集團


  而上一集最後撿了貓，這集又撿一條狗，下一集不知道能撿什麼XD


  第一集的小女兒長大後又更可愛了



  --'
