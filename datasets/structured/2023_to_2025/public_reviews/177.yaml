url: https://www.ptt.cc/bbs/movie/M.1755570454.A.36E.html
title: '[好雷] 無名弒2 符合期待的續集'
content: '看完第一個念頭，喜歡第一集的朋友也會喜歡這集吧

  雖然沒看過初集的朋友會少些醍醐味

  但這就是系列作的必備成分，對角色了解越多越有感覺


  作為動作片，打鬥的成分很高

  劇情都是點到為止，這部片的配角和劇情剛剛好

  避免了亂開支線配角最後收不回的窘境

  同樣或許會有朋友詬病劇情張力不夠，我是覺得還好啦

  畢竟賣動作又賣情懷的片已經很少

  2025能看到回到未來的博士上鏡，所求無多眼匡已濕啊



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  接續了第一集結尾，第二集開始悲劇打工地獄

  主角第一集燒錢有多狂第二集還錢就多孬，這點真的有夠現實

  在第一集爽完後還是得回來當社畜


  得特別說Bob在新工作和家庭生活中掙扎的複雜感真是入木三分

  我已經完全忘記同個演員在BB和BSC的意氣風發

  完全只剩下一個社畜打仔，但又心繫家庭的傳統爸爸


  此時Bob為了家庭關係，和黑道大老闆請假去渡假

  結果老闆意外的好人啊，簡單幾句話點開後面的劇情

  讓後面Bob一邊渡假一邊發瘋都合理了，這傢伙就是瘋狗

  瘋狗咬人不需要理由


  然後直接飆入渡假主線，整部片時間只有渡假兩天，非常緊湊

  狂狂的博士每次出現都是笑點，棒透了


  從渡假開始在餐廳、電玩店的事件情緒堆疊

  Bob的反應永遠比觀眾的預期更狂些

  肉眼可見的，Bob是隻爆氣邊緣反覆跳躍的瘋狗，這表演真的精彩


  鴨子船起初還試著講道理，結果小指被切整個開關被打開

  受傷導致暴怒的轉折做得很好，幫後續的衝突升級找到藉口


  衝總部爆氣掃蕩這幕，此時雖然是主角為了家人想要停止衝突

  取得協議後主角離開時，鏡頭拉遠然後等待

  週一下午場的觀眾不多，但光是看到鏡頭停止大家都笑了

  我很滿意這個轉折，滿足了觀眾期待著的轉折同時又帶有意外笑點


  Hutch真的想要救人嗎？毫無疑問，但比起直接進去開殺然後和毒梟正面對決

  把自己家人捲入更大的危機，他應該有更好的選擇？

  如果Hutch開關還沒被徹底打開，但這時他的雙眼比毀滅戰士還要紅


  最後遊樂場搞成像Ikea的戰場，充滿哈哈鏡和娛樂設施放雷的公式

  雖然製作組試著表達新意，例如滑水道和球池地雷

  但還是有點可惜，整體來說走向太過傳統，每個小路線結局都猜得到

  反派裝備齊全但比星際大戰的風暴兵還不準


  武士刀打開山刀實在太硬要，沙拉史東的Lendina也很可惜，深度不夠

  既然劇情只需要免洗瘋子毒梟，實在不用請到這個層級


  這是部爽快的動作娛樂片，如果票房不錯，應該會有第三集

  但不知還有沒有博士啊..且看且珍惜


  --'
