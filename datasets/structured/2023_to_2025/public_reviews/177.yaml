url: https://www.ptt.cc/bbs/movie/M.1763105868.A.447.html
title: '[普無雷] 無名弒2'
content: '剛補完這部續集


  第二部延續了第一部的風格，但在無厘頭上顯然有些過頭了


  在暴力的視覺爽感上大致上和第一集差不多，但缺少了劇情的襯托，所以又少了點味道


  無名弒2看起來似乎想讓一切相較於前作都升級，尤其是在娛樂性的部分，但很可惜沒辦到

  ，甚至因為劇情過於套路，反而丟失了許多第一集才有的東西，例如主角的角色塑造和心境

  轉變、內心掙扎等，使得這部續作只夠稱得上是爽片，而不像第一集中的某些情節是值得玩

  味的


  不過就相當短的片長及娛樂性而言無名弒2對我來說仍算優秀，只是我就不會那麼期待接下

  來的續作（如果有）了



  --'
