title: '[普雷] 無名弒2    主角變打工仔'
content: '我當時看無名弒第一部看得很爽，所以知道第二部上映就馬上去看了，我有點失望


  其實第二部的打戲比第一部多很多


  第一部是先壓抑了一大段劇情，然后才一路打到尾


  而第二部從電影開頭就一直打了，但我還是覺得第一部比較爽


  主要是第一部主角的塑造就是神秘、深不可測，管你是誰惹到我就殺，見神殺神見佛殺佛


  然后第二部告訴我原來第一部囂張之後，主角要因此做牛做馬還債


  看第一部時主角有多秋多裝逼，又看到第二部時那拼命打工還債，卑微的向上司請假的主角

  就有多悲涼



  就算第二部又一次把惹到主角的黑道殺光又怎麼樣，我看到被主角燒光的錢只覺得又多了筆

  債要還



  不過打戲依舊暴力感十足，所以為了滿滿的打戲去看也不虧啦










  --'
