url: https://www.ptt.cc/bbs/movie/M.1756210920.A.567.html
title: '[極好雷] 【無名弒2】'
content: '先附上人權證明～

  前幾天與女友討論這部跟胸…呃不對！【凶器】二擇一時決定無名，沒想到場次要嘛錯過

  不然就是少到不行，一天1、2場而已…




  現場最大眾是角頭，其次則是鬼滅～

  兩邊類型的觀眾非常明顯可以分辨（笑）。


  先題外話那天到科博館看蠟筆小新短片～

  寓教娛樂還不賴，只是音量太平且忽大忽小聲…






  隔天下班第二次到老虎城看威秀，隔許多年記得第一次是公司包場看【世界第一麥方】，

  之後除非逛唐吉才會偶爾逛逛～





  沒想到老虎城的MUVIE影廳比一般威秀廳更讓我驚豔！










  晚場大約加我十位左右～都男性。

  全程沒冷場，也或許同性別人不多歡笑聲不斷，大家都很放得開XD！

  如同電影板某篇的形容一樣，真的是男人強力春藥，名符其實！

  跟【捍衛任務】一樣喜歡，只是類型與呈現方式不同～

  特別欣賞第二集昇華為全家族共同奮戰，不再只是單打獨鬥開無雙，很多片段會心一笑！

  年過35歲特別能融入、同理有感～

  如果臺灣的國片像麥娜絲那種道出中年無力與無奈感，這部則是反其道而行！

  我們幾乎都幻想過自己能像電影主角一樣拳腳功夫行雲流水教訓對手，這部貼近現實生活

  與描述方式真的非常痛快！！！


  有些朋友因為看了釋出兩片段覺得很乾，但請放心～事發原因以及配樂下去是很過癮的！


  很喜歡原本看不順眼但後來不拖泥帶水和好、合作，還有淡定天然呆小女兒太可愛了啦！


  血腥程度分寸拿捏點到為止，到時候也會放給我爸媽看～


  感動點還是有，另一伴與家人的溝通、扶持皆有傳遞出來～個人覺得挺溫馨。


  霸氣名言也不少，最愛「別拿開山刀對抗武士刀。」XD～


  唯一沒看清楚的是童年時期的主角兄弟檔，我一開始好像把弟弟演員看成女生！？

  到後面才知道是男的。


  總之推薦這部給還沒看過或想挑一步進電影院的您～


  --

  有好有壞，好的是觀影體驗非常棒~

  壞的是場次實在被吃掉太多...

  【無痛先生】嗎？

  每個人感受不同互相尊重，謝謝您說出自己的真心話XD~

  確實跟第一集比起來某些程度輸了些...

  我很喜歡第一集老爸在養老院突擊、反派過馬路、秀出刺青那幾段！

  哈哈~謝謝同路人(擊掌)！

  跟預告片歌曲的玩到趴有異曲同工之妙~

  真的...

  那運鏡很厲害又吸睛！

  成龍的【捕風追影】不知道會不會在臺上映...

  沒錯！就是愛上第一集所以必看續集~

  反倒【私刑教育】跟【即刻救援】我只喜歡第一集而已:P。

  真的耶！

  不跟IMAX比較的話確實贏過威秀一般廳～

  想趁年底前升級黃金會員，請問升了之後還會被降級嗎？

  打好打滿！

  娛樂笑果十足～

  這種暴力美學我超愛der！

  哈哈～超可愛！

  超級感謝k大補充與解答！！！

  年底前來衝看看~

  我懂幫拍拍T^T…

  場次被吃得太誇張！

  要不是累積點數我寧願跑遠點到日新看場次更多～

  千真萬確！！！

  謝謝你們看完來留言回饋~~~

  也很適合成年後的全家觀賞！'
