url: https://www.ptt.cc/bbs/movie/M.1724899041.A.8B1.html
title: '[新聞] 《無名弒2》終於開拍，鮑勃奧登科克 '
content: "SAY MY NAME！《無名弒2》終於開拍，鮑勃奧登科克以「小人物」之姿再出擊\n\n\n\n\n\n細數那些絕對惹不起的殺神，除了基奴李維飾演的約翰維克外，還有一位外表看似平凡，\n\
  但身手卻不同凡響的哈奇曼賽。2021 年《無名弒》找來《絕命律師》鮑勃奧登科克主演\n，以 1600萬美元的成本，賺回 5750 萬美元的票房。\n\n或許片商當初也想不到，《無名弒》能創造如此熱潮。而如今，備受期待的《無名弒\
  \ 2》\n終於開始拍攝，鮑勃奧登科克將再次回歸身懷絕技的前政府殺手哈奇曼賽。\n\n\n\n《無名弒2》釋出片場照\n\n《無名弒 2》導演改由印尼驚悚電影鬼才導演提姆賈彥多\
  \ (Tim Tjahjanto) 執導，他在\n 8 月 25 日於 X 上發布一組片場照，讓粉絲們得以一窺這部續集的製作過程。這些照片\n雖然看似平常，卻充滿了令人興奮的細節，其中最引人注目的是賈彥多與奧登科克並肩而\n\
  立的照片，這無疑是對粉絲們最好的福利。\n\n\n\n\n\n\n\n\n小成本立大功的《無名弒》\n\n2021 年的《無名弒》，由《捍衛任務》系列電影的德瑞克柯斯達編劇、伊利亞奈舒勒執\n\
  導，描述哈奇曼賽為前政府殺手，但他一心只想退休，於是轉型成了一位愛家好男人，從\n外人的眼光來看，他就是一位生活平淡無奇的無聊男人，總是對受到的污辱忍氣吞聲，從\n\
  未反擊過。有一晚，兩名歹徒闖入他位於郊區的家中，哈奇不願意以暴力手法制伏對方，\n於是家人對他開始感到不諒解。\n\n儘管他想遠離風波，但風波仍不肯放過他，某次意外的暴力相向，讓他惹上了麻煩，最終\n\
  他決定拾回過往的戰力，引發一連串的後續事件。\n\n\n\n\n\n這次《無名弒 2》導演換成提姆賈彥多，劇本仍由德瑞克柯斯達執筆，不過此次鮑勃奧登\n科克本人也有參與編寫。另一個消息是，湯姆漢克斯的兒子—科林漢克斯確認加盟《無名\n\
  弒 2》，他將飾演腐敗的警長，莎朗史東也將加入續集陣容，擔任反派。\n\n\n在電影中飾演哈奇妻子貝卡的康妮尼爾森也表示：\n\n\n「電影存在著自然的緊張關係，但也有暗藏甜蜜，這種愛將所有人聯繫在一起。這是一個\n\
  偉大的家庭。這是一個我期待回歸的精彩故事。」\n\n\n《無名弒》成功關鍵在於，它巧妙地平衡刺激的動作場面和深入人心的角色塑造。奧登科\n克飾演的哈奇曼賽，是一個複雜而引人入勝的角色，他既是一個普通的愛家好男人，又擁\n\
  有驚人的戰鬥技能，電影前期透過一直鋪陳主角忍受欺辱的事件，引導出後續的情緒大爆\n發，激出影迷的痛快感受。\n\n續集重點當然擺放在哈奇曼賽的進一步發展。我們看到《無名弒》中，他對於過往暴力經\n\
  驗的掙扎，最終為了家人而選擇拿起武器。續集他會如何平衡這兩種身份？怎樣才能真正\n擺脫過去的陰霾？\n\n\n提姆賈彥多雖然並無執導好萊塢大片的經驗，但他在印尼電影界已經頗有名氣，特別擅長\n\
  拍攝動作片和恐怖片，他的加入可能會為《無名弒》系列帶來新的視角和風格，也許我們\n會看到更大膽和創新的動作設計。\n\n儘管續集常常難以超越前作，但《無名弒 2》似乎有著足夠的潛力。強大的製作團隊、優\n\
  秀的演員陣容，及第一部電影留下的良好基礎，都為這部續集提供成功的可能。當然，最\n終的成敗還要等到 2025 年 8 月 15 日電影上映後才能見分曉。\n\n\
  \n\n\n--"
