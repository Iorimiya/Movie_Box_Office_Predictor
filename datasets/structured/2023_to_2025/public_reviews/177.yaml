title: '[新聞] 鮑勃奧登科克親自回應《無名弒2》傳言'
content: '新聞網址：


  原標題：


  2022-02-17



  去年上映的動作電影【無名弒】（Nobody），由【超狂亨利】（Hardcore Henry）導演伊

  利亞奈舒勒（Ilya Naishuller）執導，艾美獎得主鮑勃奧登科克（Bob Odenkirk）主演

  。該片雖於疫情期間上映，但票房成績不俗，




  電影中，一位毫不起眼的無名小卒，卻配以拳拳到肉的流暢動作場面，讓該片男主角奧登

  科克成功翻轉影集「絕命律師」（Better Call Saul）中喜劇形象，成為新一代大叔殺神

  ，而耳目一新的拍攝手法更是讓不少粉絲們敲碗續集作品。



  導演奈舒勒也曾在去年6月證實，儘管電影公司尚未批准，但編劇戴瑞克柯斯達（Derek

  Kolstad）已經著手撰寫續集劇本。



  日前奧登科克接受《帝國》雜誌訪問時，親自回應【無名弒2】籌備進度：


  「，我也已經和戴

  瑞克（柯斯達）討論過續集故事。雖然一切都尚未定案，可以確定的是我們都在努力中。

  」




  。」看來有男主角兼製片的掛保證，看來【無名弒2】也只剩時間上的問題了

  。



  值得一提的是，先前【無名弒】上映後，身兼【捍衛任務】（John Wick）系列電影故事

  主創的編劇戴瑞克柯斯達曾表示，

  ，不過未來仍是有機會在兩部電影中發現編劇埋的連

  結彩蛋也說不定。



  --


  要不再加上丹佐華盛頓，三位銀幕殺神合作!!??


  --'
