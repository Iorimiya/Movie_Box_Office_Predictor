title: '[情報] 《飢餓遊戲》黑密契前傳 前導預告'
content: '《飢餓遊戲》第二部前傳式衍生電影《Sunrise on the Reaping》依舊由本傳後三集以及

  首部外傳《鳴鳥與遊蛇之歌》的導演Francis Lawrence執導，本傳首部曲編劇Billy Ray

  也回歸執筆劇本。


  本片改編自《飢餓遊戲》系列原作者Susan Collins上個月出版的同名小說，講述當年16

  歲的黑密契參加第50屆飢餓遊戲的經歷。


  本片預定於2026年11月20日在北美上映。


