url: https://www.ptt.cc/bbs/movie/M.1416627584.A.7F6.html
title: '[普雷] 飢餓遊戲三'
content: '先說明...我沒有看過原著小說，但因為爬過心得文所以大概知道小說走向


  這集的確比起第二集平淡許多，

  主要是鋪陳第二集末才出現的13區是怎麼回事及他們推翻朝廷的進度這樣...

  可以想見高潮應該都在part2，所以平淡我覺得可以預期。


  Katniss其實是個蠻可悲的人，

  她雖然有著可以煽動人心、號召人心的天份，但她並沒有想做那樣的人，

  每當她出現震撼人心、讓人想跟隨她的行為時，

  其實都是她受到逼迫，悲傷至極、憤怒至極時一時腦熱做出來的事，

  如果當初她沒有加入Hunger games，

  革命一定還是會繼續進行，但一定不會有她一份...

  因為她只想保護她最愛的家人跟朋友。


  而這集最有進度的大概就是明顯可以看出在三角關係裡她選擇的人是誰了 XD


  一開始她跟青梅竹馬的Gale因為有著相似的生活經驗所以走得近，

  要不是有爬文我還一直以為他們其實已經在交往，

  但直到加入遊戲，經歷了太多以往想都沒想過的經驗，

  一開始她只想獨善其身，但Rue的犧牲讓她站了出來，

  大量的廝殺與詭計，甚至她必須要跟Peeta演戲博同情，

  她還是當初那個只想著要活下去的小貓草，但同時又已經不是那麼相同。

  Peeta，是跟她一起經歷了這些的人，

  他們有相同的噩夢、相同的陰影，

  看起來Katniss勇敢又堅強，但那是因為她背後有Peeta在支持，

  當Gale說出如果他是Peeta他絕不會那樣懦弱時，

  Katniss想的應該是:"媽的...你知道個屁!你從未經歷過!"

  後來Finnick直接破題法...

  點出在Katniss心中她其實早就已經愛上Peeta了，Katniss竟然也沒有反駁，

  很好，愛情應該差不多就這樣了吧!


  期待看打戲或爆破或任何大場面的part1可以跳過，到時候租片回家看就好，


  part1的重點在如何喚起被奴役習慣了的人民們終於起身反抗，

  劇中兩幕-

  在要去伐木工作的森林裡埋下炸彈，然後爬上高樹引爆、炸死都城守衛們，

  還有一邊唱著Katniss的歌，一邊抬著炸彈衝向水壩，這兩個點是比較熱血沸騰的場面，

  尤其Katniss那首The Hanging Tree 稍微沙啞的嗓音超適合這首歌，

  直到電影結束旋律還一直在我腦裡環繞呀!


  但有個小小疑問是...

  當播出這首歌時，Plutarch說他改了歌名，看起來沾沾自喜，

  請問他是把歌名改成怎樣啊?


  --


  嗯嗯，其實我說的"可悲"，比較偏向可憐那邊!'
