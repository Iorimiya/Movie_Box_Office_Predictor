title: '[LIVE] STAR MOVIES 21.00 飢餓遊戲：自由幻夢 '
content: 'STAR MOVIES 21.00 飢餓遊戲：自由幻夢 終結戰

  本片為《飢餓遊戲》大結局的下集。原本只是自願代替妹妹當貢品的堅強女孩凱妮絲艾佛

  丁（珍妮佛勞倫斯 飾），成為施惠國各區的革命象徵後，已刻骨銘心地領悟到：革命的

  賭注不只在求生存，更會決定未來！


  劇情接續前集，施惠國已進入全國性戰爭狀態，凱妮絲挺身對抗都城的史諾總統（唐納蘇

  德蘭 飾），決心展開最後殊死戰。她與親密夥伴蓋爾（連恩漢斯沃 飾）、芬尼克（山姆

  克萊弗林 飾）和比德（喬許哈契遜 飾）攜手反攻，集結第13區反抗軍前進都城。他們冒

  著生命危險，發動刺殺史諾總統行動，誓命解放施惠國各區公民。當然，在都城衛軍層層

  保下的史諾，也一心想要置她於死地而後快。

  　

  在此最後一役，凱妮絲將面臨致命陷阱、陰險敵人和道德抉擇，身心遭逢的巨大考驗，將

  比任何飢餓遊戲競技場上的挑戰，都更加危險萬分。


  --'
