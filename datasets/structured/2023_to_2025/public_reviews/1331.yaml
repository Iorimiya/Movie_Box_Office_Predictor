url: https://www.ptt.cc/bbs/movie/M.1417080515.A.AB2.html
title: '[好雷] 飢餓遊戲3_世界不是你期盼的那樣 '
content: "網誌好讀版\n\n\n\n(有雷慎入。無雷的心得太難寫，我不會。)\n\n\n\n公司福委會舉辦的電影日，是難得可以拋夫棄子，理直氣壯走進電影院享受聲光效果的時\n\
  刻。前兩集我都是用筆電觀賞，這集在大螢幕的威力下，當女主角悠悠地Are you, Are\nyou…(the hanging tree註1)清唱旋律縈繞，逐漸加入其他反抗軍低沉的和聲時，久違的\n\
  雞皮疙瘩就浮起來了。\n\n\n\n看電影最值得的時候就是這種感動到頭皮發麻的moment啊!\n\n\n\n通常這個時點都是隨著劇情，情緒累積到了一定的量以後，配上恰到好處的音樂催化得來\n\
  的效果。硬體設備太差或不夠融入，或是旋律沒辦法進到心底，都沒有辦法得到它。難怪\n有人說配樂是電影的靈魂呢!\n\n\n\n簡單的旋律，哀傷的曲調，革命初期就是要配上這種似亡歌的宣傳曲，所謂「哀兵必勝」\n\
  ，一開始一定是流血流淚大於所獲成果，大部份的反抗都不是為了崇高的目的，僅僅是為\n了活下去的反撲。甚麼民主，甚麼國家之愛，都是後來政治上的演示。\n\n\n\n\
  劇中標誌性的舉三指手勢，也是源自於葬禮，表達感謝、尊敬和與所愛之人再見的意思。\n我覺得作者在這部長篇裡頭，最想表達的就是這種不想要，卻不得不已的哀傷。就像實體\n\
  書的宣傳句：世界，不是你期盼的那樣。(小說我只看過的第一部，會找時間全部啃完的\n。)\n\n\n\n\n\n這集裡面我印象最深刻的是霍夫曼(Hoffman)飾演的遊戲設計師普魯塔克(Plutarch註2)，\n\
  後來變成反抗軍的行銷官。我很好奇他心裡轉變的因素(電影裡面沒有描述，可能要看小\n說才能知道了)，是甚麼原因讓他從舒適且有權有勢的都城離開，投身朝不保夕的叛軍呢\n\
  ？他對凱妮絲(Katniss)青睞有加，個人特質掌握度精準，不自覺流露出的獨到觀點和天\n才頑童似的狡黠，對照後來轟炸那夜語無倫次貪生怕死的驚恐，我覺得都演得很好。後來\n\
  查資料才知道這位可是硬底子演員，曾得到奧斯卡影帝，但拍完這部(含上下)之後，疑似\n嗑藥過量已去逝。\n\n\n\n每看完一部電影和卡通，我已經養成習慣問問孩子們最喜歡劇裡的哪一個人和哪一個片段\n\
  (沒錯，這是Dora帶來的影響。)不但可以從此知道孩子的個性和訓練他的觀察力及表達能\n力，也常帶給我意外的驚喜和共同回憶的歡笑。這部片縈繞於心的除了這首歌，還有短暫\n\
  的戰爭犧牲赴死畫面，樹林和水壩的不惜同歸於盡(If we burn, you burn with us!)。\n我不知道這樣的片段該怎麼樣孩子解釋，光是想到戰爭的殘忍醜惡我就開不了口(還好他\n\
  們也不會看到這部片)。後來我想到愛爾蘭政治家有名的一句話：「The only thing\nnecessary for the triumph of evil\
  \ is for good man to do nothing.邪惡盛行的唯一\n條件，是善良者的沉默。」有些犧牲是為了更好的將來，儘管那個將來你不一定能夠看到\n\
  。多麼美好的人性，對照其中政治的籌謀計算，這些光輝只不過是可供利用的棋子，又是\n多麼的可悲。人生就是曲輓歌，世界，從來就不是期盼的那樣。\n\n\n\n\n\n\
  註：\n 1.這是首有點詭異變態的歌曲，被吊死者邀請戀人共享死亡。淒清中帶著詭麗，配上珍\n妮佛勞倫斯低沉的嗓音，簡直就是太催魂啦~\n 2.普魯塔克把詞中的「rope」改成「hope」，自詡為文青。我是感受不出其中的精妙所\n\
  在啦(可能英文程度太差)，不過他沾沾自喜的樣子挺可愛的，哈哈哈。\n 3.《吊人樹之歌》（The Hanging Tree）中英文歌詞\n\n\n\nAre you,\
  \ are you\n\nComing to the tree\n\nWhere they strung up a man\n\nThey say murdered\
  \ three.\n\nStrange things did happen here\n\nNo stranger would it seem\n\nIf we\
  \ met up at midnight\n\nIn the hanging tree.\n\n\n\nAre you, are you\n\nComing to\
  \ the tree\n\nWhere the dead man called out\n\nFor his love to flee.\n\nStrange\
  \ things did happen here\n\nNo stranger would it seem\n\nIf we met up at midnight\n\
  \nIn the hanging tree.\n\n\n\nAre you, are you\n\nComing to the tree\n\nWhere I\
  \ told you to run,\n\nSo we'd both be free.\n\nStrange things did happen here\n\n\
  No stranger would it seem\n\nIf we met up at midnight\n\nIn the hanging tree.\n\n\
  \n\nOoooohhh\n\nooooh\n\n\n\nAre you, are you\n\nComing to the tree\n\nWear a necklace\
  \ of rope,\n\nSide by side with me.\n\nStrange things did happen here\n\nNo stranger\
  \ would it seem\n\nIf we met up at midnight\n\nIn the hanging tree.\n\n\n\nOooooooooohhhh\n\
  \noooooh\n\n\n\n妳要 妳要來嗎?\n\n到這兒來 到樹下來\n\n他們在這吊死一名男子 說是有三個人被他殺死\n\n這裡真的發生很多怪事\n\n\
  最古怪的卻是\n\n一旦我們子夜相會於吊人樹\n\n\n\n妳要 妳要來嗎?\n\n到這兒來 到樹下來\n\n吊死的男人在這裡大聲叫號 要她的愛人快快逃\n\n\
  這裡真的發生很多怪事\n\n最古怪的卻是\n\n一旦我們子夜相會於吊人樹\n\n\n\n妳要 妳要來嗎?\n\n到這兒來 到樹下來\n\n在這裡我曾要你快快逃\
  \ 好讓我倆都得著自由\n\n這裡真的發生很多怪事\n\n最古怪的卻是\n\n一旦我們子夜相會於吊人樹\n\n\n\n妳要 妳要來嗎?\n\n到這兒來 到樹下來\n\
  \n戴上繩索的項鍊 與我在一起肩挨著肩\n\n這裡真的發生很多怪事\n\n--\n\n\n生活大小芝麻粒子事\n\n\n--"
