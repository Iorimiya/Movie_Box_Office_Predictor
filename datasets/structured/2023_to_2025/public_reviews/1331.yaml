url: https://www.ptt.cc/bbs/movie/M.1743867193.A.D6B.html
title: '[新聞] 《飢餓遊戲》第二部外傳「少年版黑密契」'
content: '《飢餓遊戲》第二部外傳「少年版黑密契」曝光演員人選！雷夫范恩斯有望接棒化身「中

  年版」史諾


  《飢餓遊戲》（The Hunger Games）系列的第二部外傳《The Hunger Games：Sunrise

  on the Reaping》前幾天才在 Cinema Con 釋出超前導預告，今天就有選角方面的消息傳

  開，例如外媒《Nexus Point News》便獨家披露，獅門影業已將《金錢世界》（All the

  Money in the World）新生代男星-查理普拉瑪（Charlie Plummer，下圖左）列入扮演主

  角「黑密契」的候選名單。


  《Sunrise on the Reaping》的時空是設定在正傳首部曲的 24 年前，將敘述 16 歲的黑

  密契參加第 50 屆飢餓遊戲、並成為優勝者的經歷。伍迪哈里遜（Woody Harrelson）先

  前已於正傳四部曲扮演過中年版的黑密契，如今普拉瑪則可能接棒詮釋少年時期的他。



  另外，知名影視記者-丹尼爾瑞奇曼（Daniel Richtman）今早也在他《Patreon》頁面報

  導，雷夫范恩斯（Ralph Fiennes）也已受邀加入本片飾演中年版的「史諾總統」有望成

  為繼「青年版」湯姆布萊斯（Tom Blyth）、「老年版」唐納蘇德蘭（Donald Sutherland

  ）後，第三位在大銀幕擔綱此角的演員。


  《Sunrise on the Reaping》依舊由正傳四部曲的後三集、《鳴鳥與游蛇之歌》的導演-

  法蘭西斯勞倫斯（Francis Lawrence）執導，正傳首部曲的編劇-比利雷（Billy Ray）則

  回歸執筆劇本。本片改編自《飢餓遊戲》系列原作者-蘇珊柯琳斯（Suzanne Collins）上

  個月剛出版的同名小說，北美地區已排定將於 2026 年 11 月 20 日正式上映，預計今年

  七月在德國開拍。




  --'
