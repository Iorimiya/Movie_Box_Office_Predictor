url: https://www.ptt.cc/bbs/movie/M.1700202877.A.E21.html
title: '[2/3好雷] 飢餓遊戲前傳:黑雪公主好正'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  會說2/3是因為本片分三部分，和小說一樣

  但是飢餓遊戲結束後根本是依託答辯

  想看史諾總統黑化的可以不用期待了

  年輕史諾就是個有為帥氣青年

  很會把妹這樣

  瑞秋曾格勒還是很會唱歌

  薇奧拉戴維斯演技超讚

  由於飢餓遊戲發生在很久以前

  所以場景遠遠不如本傳豐富

  只有一個競技場

  但是我覺得精采程度是勝過三部曲的

  小說很厚

  所以電影拍的超級趕

  很多細節都省略了

  誰和誰是朋友都一句話帶過

  看得要很專心

  我覺得乾脆把第三幕改成史諾和黑雪過著幸福快樂的日子還比較好

  拖拖拉拉的看得很不耐煩

  本傳書迷和影迷推薦去看

  第三幕可以直接離場

  反正也演了100分鐘不虧

  除非你想看男女主角親親


  --'
