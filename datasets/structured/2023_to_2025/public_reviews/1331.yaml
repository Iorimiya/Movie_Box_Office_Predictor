url: https://www.ptt.cc/bbs/movie/M.1422078692.A.DB2.html
title: '[新聞] 2014年美國最高票房電影 飢餓遊戲3險勝'
content: '想不到負評多多的飢餓遊戲3居然後來居上 北美票房全年第一


  WOW 不可思議


  娛樂中心／綜合報導

  由金獎影后珍妮佛勞倫斯主演的《飢餓遊戲：自由幻夢Ⅰ》，自去年11月上映後，日前統

  計出已經在美國達到3.332億美元票房，壓過得到3.3317億美元票房的《星際異攻隊》，

  成為2014年北美最賣座票房冠軍電影。這也是該系列電影，連續第二年榮登北美票房年度

  冠軍寶座。

  2013年《飢餓遊戲：星火燎原》以些微優勢勝過《鋼鐵人3》的票房，登上北美票房排行

  榜年度冠軍，2014年《飢餓遊戲：自由幻夢Ⅰ》再度險勝《星際異攻隊》，連續二年打敗

  漫威旗下的超級英雄電影，再加上《飢餓遊戲》並沒有3D和IMAX版本，還能獲得如此好成

  績，實在相當不容易。

  《飢餓遊戲3》去年11月上映後，一路打破「年度午夜場票房紀錄」、「年度首日票房紀

  錄」、「年度首周末票房紀錄」，並且連續三周蟬連北美票房榜周冠軍，掘金攻勢所向披

  靡，同時也獲得了歐美媒體和觀眾的廣泛好評。

  對於全球觀眾來說，《飢餓遊戲》系列不僅創造了超級英雄電影，以女性作為主角的巔峰

  ，而且不再以賣弄女性的身材作為賣點，卻能屢屢突破票房成績，也真是創下票房奇蹟，

  截至目前為止，該片已經在全球收到超過7億美元的票房，而該系列電影的全球票房，則

  累計已達22億美元。



  --'
