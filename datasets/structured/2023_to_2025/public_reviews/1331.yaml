title: '[雷] 飢餓遊戲男主史諾的堂姐'
content: '以下有雷———








  ———以下有雷

  當初在電影院看，堂姐從一開始跟堂弟男主的知心交流，從堂弟眼中看不到她懼怕的伯父，後來快結尾時，堂弟問她在他眼中看到什麼？很明顯堂姐的眼中流露出了不安（算恐懼嗎？）


  這時候我想到了一個人——在飢餓3下集中，提供主角群在都城得以休息地方的那位貓面女


  後來找到網路上的片段，這位貓面女也的確叫Tigris， 這算埋的很好的伏筆吧！？記得這位貓面Tigris 好像也提過史諾總統背叛（辜負？）她之類的

  -----

  Sent from JPTT on my iPhone


