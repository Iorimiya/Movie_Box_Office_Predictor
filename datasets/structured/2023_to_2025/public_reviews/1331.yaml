title: '[新聞] 美國首屆飢餓遊戲！川普將辦「愛國者運'
content: "新聞網址：\n\n\n  美國首屆飢餓遊戲！川普將辦「愛國者運動會」各州1男1女參賽\n國際中心陳政嘉／綜合報導\n\n2025-12-23 22:29:04\n\
  ▲圖為電影《飢餓遊戲》劇照。（圖／獅門影業提供）\n▲圖為電影《飢餓遊戲》劇照。（圖／獅門影業提供）\n美國總統川普（Donald Trump）常有許多奇思妙想，包括拆除白宮東廳蓋宴會廳、在白宮\n\
  辦UFC格鬥賽等，近期他又宣布明年美國建國250週年，將舉辦「愛國者運動會」，從各州\n選出年輕1男1女參賽。不過，賽制因為與《飢餓遊戲》極為相似，引發民主黨人和網路熱\n\
  議。\n\n我是廣告 請繼續往下閱讀\nCNN報導，川普18日宣布，作為明年美國建國250週年慶祝活動一部分，白宮將舉辦「愛國\n者運動會」（The Patriot\
  \ Games），「我們將在秋天舉辦首屆愛國者運動會，這是一場\n史無前例、為期四天的體育賽事，將有最優秀的高中運動員參賽，每個州和地區將派出一\n名男運動員和一名女運動員」，他還保證不會有男性運動員參加女性賽事。\n\
  \n川普最早在7月就已經預告這場活動，透露將會有電視直播，並由衛生與公眾服務部長小\n甘迺迪（Robert F. Kennedy）主持。\n\n川普18日在無黨派組織「自由250」（Freedom\
  \ 250）的YouTube上，公布明年美國建國250\n週年的活動規劃。自由250是一個無黨派組織，負責籌劃、舉辦總統級別的全國性活動，\n為慶祝美國建國250週年，該組織與白宮250週年特別工作小組、聯邦機構和美國250週年\n\
  委員會合作。\n\n不過，由於這個賽制，與改編成電影的反烏托邦青少年小說《飢餓遊戲》（The Hunger\nGames）相當類似，引發民主黨人在網路上嘲諷。《飢餓遊戲》講述末日後的美國，僅存\n\
  的13個行政區中各選出一名男孩和一名女孩，參加一場電視直播的生死搏鬥，他們必須互\n相殘殺或與競技場中各種致命的危險搏鬥，直到只剩一人存活。倖存者將為他們所在的行\n\
  政區贏得食物和物資。\n\n在「自由250」的YouTube影片下，也有許多網友吐槽：「原來他看了《飢餓遊戲》，覺得\n這是個好主意」、「謝謝雪諾總統，美國史上第一次飢餓遊戲」、「接下來就是國定殺戮\n\
  日了」、「誰準備好參加飢餓遊戲了」。\n\n川普也介紹其他相關規劃，包括在首都華盛頓特區建設一個新的「凱旋門」拱型紀念碑，\n他明年生日（6月14日）當天，要在白宮草坪上舉辦UFC綜合格鬥賽。\n\
  \n\n\n  \n\n\n\n\n\n  ---------------------------------------\n\n\n\n\n\n\n  果然選出川普永遠不缺樂子\
  \ 樂子人的最愛\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n--\n  Q:請問以下的諸位人物 何人是[真實存在]於幕末時期---明治維新之間的歷史人物?\n\
  \    1.坂田銀時  2.南方仁 3.緋村劍心 4.以上皆是\n\n　      ( ′_ゝ`)<怎麼沒有選項5　　　    (ﾟДﾟ;) <什麼?我以為答案是4欸\n\
