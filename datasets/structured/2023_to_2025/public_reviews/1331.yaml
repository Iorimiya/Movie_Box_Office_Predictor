url: https://www.ptt.cc/bbs/movie/M.1448240910.A.8CB.html
title: '[好雷] 飢餓遊戲 自由幻夢II'
content: '先說結論，由於我看過小說，所以相較下我認為這部電影能給好雷


  本來就知道小說第三集糞劇情的我，只是被人要求下陪看的，但出乎意料的好看








  基本上電影最終集算是相當忠於原著，節奏雖然進行得有點怪但還算合理，小說主線該有

  的都有


  尤其是拍攝小隊進入都城後，在卵囊威脅和遭遇地下變種這幾段，看小說時實在很普通，

  但透過電影用背景音樂告訴觀眾「有事情要發生了」的老梗下，也營造了不錯的刺激感


  最後官邸外的炸彈炸翻平民和小孩，也炸死小櫻。透過凱妮絲在玫瑰溫室和史諾的談話，

  向觀眾闡述了柯茵的陰謀


  凱妮絲答應舉辦飢餓遊戲後獲得處決史諾總統的機會，選擇射死柯茵總統，一同觀看的朋

  友不能理解為何要冒險殺死柯茵，難道沒有其他更好辦法？其實只要知道凱妮絲本來就是

  個為情所困的白目少女，而不是一般電影裡完美的英雄角色


  最後結局給了Happy ending，雖然平淡沒爆點，但也就是這樣合理地收尾…



  這部電影對我來說的最大亮點，就是凱妮絲抱起小櫻的貓時，貓咪居然呼嚕了(''▽''〃)


  --'
