title: '[情報] 《飢餓遊戲：自由幻夢I》的三個看前須知'
content: '《飢餓遊戲：自由幻夢I》本週上映！


  這部選在選前上映真是太會挑時機了！

  本集〈電影怎麼看〉不但有著滿滿的酸味政治哏（不喜勿入）！

  也特別適合沒看過一二集，想直接無縫接軌第三集的人！


  《飢餓遊戲：自由幻夢I》的三個看前需知



  錦囊1：

  請問飢餓遊戲之前演到哪裡了啊？


  錦囊2：

  我覺得電影裡面的暗喻好多喔，什麼13區、三指禮、學舌鳥到底在講什麼啊？


  錦囊3：

  飢餓遊戲的故事背景好熟悉喔，怎麼覺得好像在哪裡看過啊？


  --'
