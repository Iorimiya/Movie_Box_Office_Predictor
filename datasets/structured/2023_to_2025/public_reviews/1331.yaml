url: https://www.ptt.cc/bbs/movie/M.1448345969.A.E08.html
title: '[  雷] 飢餓遊戲-蓋爾工具人'
content: '不曉得這個分類是否適當

  以下有雷慎入













  今天剛剛看完飢餓遊戲最新一集

  覺得蓋爾根本最哭工具人


  與主角青梅竹馬情義相挺，主角也對他各種調情


  結果妹妹被炸死後卻慘遭遷怒


  最後不離不棄選我比德，共度餘生


  幹？！你妹死去關蓋爾屁事啊？


  我沒看過原著不曉得是怎麼鋪陳這段三角關係，但從電影來看實在處理的很糟糕和莫名其

  妙


  又硬要著墨這段關係，又不妥善處理，搞得我一頭霧水


  我彷彿又看到蕭勃俊


  --'
