title: '[討論] 飢餓遊戲的小櫻長好快....'
content: 'Willow Shields 第一集還萌萌的樣子

  第三集的時候已經完全是少女的樣子

  外國妞真的長有夠快的


  外型有點眉毛才是本體的感覺

  難怪一直有老外在問是不是和 Brook Shoelds 有親戚關係

  答案是沒關係

  不過眉毛還真的有點像xddd


  而且現實生活中還有個雙胞胎姊妹 Autumn Shields

  上面還有一個哥哥

  三人都有演過戲

  不過 Willow 活耀很多



  男人的夢想

  當哥哥女朋友壓力很大......


  --'
