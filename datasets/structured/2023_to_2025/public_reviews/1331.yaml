title: '[負雷]  硬要拆成兩部的飢餓遊戲三'
content: "很明顯 上集撈錢目的非常非常明顯\n本身看過小說\n說好聽一點是忠於原著\n說難題一點就是撈錢用\n\n以一個小說改編的劇本來說\n有太多地方可以直接刪掉\
  \ 也不影響劇情\n要鋪陳嗎 但我並沒有感受到人物的張力\n劇情的深度嗎 我也真的感覺不到\n\n女主角為了要鼓舞其它區的人民\n自願成為學舌鳥並到戰區拍片宣傳\n\
  \n這樣的內容要拍到電影的一半時間\n會不會太多了一點\n\n對於沒看過小說的人來講\n如果要看有深度的劇情片\n那看星際效應就好啦\n況且 整部片的鋪陳\n\
  真的沒有感覺到有什麼很嚴肅的主題\n\n想用娛樂爆米花片來看的人\n可能會很失望\n太多可以帶過的劇情\n但都拍了很長的時間\n\n期待第二集吧\n\n\n--\n\
  Sent from my Android\n\n--\n\n  第二次回12區的地方 因為要拍宣傳片 第一次去第八區已經夠了\n  還有他們去地面上打獵的那一整段\n\
  \  然後被轟炸那一段太長了\n  太多人物的對話實在是沒有必要 因為即使不拍 稍微交代一下也就過了"
