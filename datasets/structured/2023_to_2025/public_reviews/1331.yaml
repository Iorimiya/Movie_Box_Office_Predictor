url: https://www.ptt.cc/bbs/movie/M.1453987293.A.AC3.html
title: 'Re: [討論] 和第五毀滅相比 飢餓遊戲贏在那裡？'
content: "~~~~~~~~\n                                        ~~~~~~~~\n\n其實反烏托邦這個詞顧名思義故事最開始要有個烏托邦\n\
  \n就是在剛開始的時候，要有個看似美好而和平的世界\n\n然後沿著劇情發展，大家才發現，這個烏托邦根本沒有想像中的好，甚至其實十分病態\n\n這樣才叫\"反\"\
  烏托邦\n\n最典型的就像極樂謊言那樣\n\n\n如果按照這個定義的話，飢餓遊戲可以算是反烏托邦作品\n\n但第五毀滅故事剛開始就是一大堆的災難，劇情裡也沒講到哪裡有個人間仙境\n\
  \n所以第五毀滅一點也不能算是反烏托邦作品\n\n\n不過雖然第五毀滅不算是反烏托邦，它跟飢餓遊戲還是有很大的共同點\n\n(我講的飢餓遊戲只有1，2、3的拯救世界部分跟第五毀滅沒甚麼關係)\n\
  \n那就是青少年面臨極大的衝擊(外星人入侵、參加遊戲)\n\n而面對這樣子的衝擊，主角們通常也沒甚麼資源\n\n所以他們剛開始進入這個體制(無論願不願意)，並漸漸地在這個體制中甦醒，或者有資源\n\
  \n最終跳脫這些規定，起身反抗\n\n\n飢餓遊戲的衝擊其實很明顯，就是參加飢餓遊戲\n\n飢餓遊戲本身是個只有一人勝出、殺到你死我活的一個遊戲\n\n但故事中的遊戲參賽者們並沒有從頭殺到尾\n\
  \n而是會在遊戲的過程適當的合作以尋求彼此的最大利益\n\n所以飢餓遊戲其實本身就是個青少年之間競爭的縮影\n\n舉凡在學時期的大考小考，到出社會之後職場生存\n\
  \n樣樣都是資源有限而需求者眾多的競爭\n\n青少年在考試、面試等等的競爭中，也會出現彼此合作的情況\n\n所以飢餓遊戲某種程度上還蠻寫實，也蠻能引人共鳴\n\n\
  \n至於第五毀滅裡面青少年的衝擊，其實是弟弟、男二進入軍營開始\n\n當社會發生了大轉變後(其實是主角群的生活發生大轉變)\n\n他們在無其他選擇之下加入了軍營\n\
  \n他們本來以為，加入軍營是為了打倒外星人、恢復世界的原樣\n\n配角們也不再是小孩，舊日的光環不再\n\n而軍營生活也讓他們變得更強，讓他們以為自己在打倒外星人的路上\n\
  \n直到第一次出任務之後才發現原來他們完全被外星人利用\n\n他們做的事，根本就是再把地球變成外星人想要的樣子\n\n其實這樣的象徵應該已經很明顯了\n\n就是講許多抱著理想的青少年想要改變世界，但時間卻逼迫他們社會化\n\
  \n這樣的理想卻沒有辦法真正改變社會，反而被社會利用\n\n讓這世界更加遠離當初他們想改變成的樣子\n\n\n飢餓遊戲跟第五毀滅的劇情同樣是繞著青少年進行\n\n\
  兩者同樣隱喻了青少年成長面臨的問題\n\n我個人覺得這是很好的主題，可是飢餓遊戲跟第五毀滅在劇情化的過程，都各有問題\n\n\n飢餓遊戲的問題，就是裡面的劇情不合理\n\
  \n飢餓遊戲開始後，小隊們追凱妮絲追到一群人在樹下睡死這點極度不合理\n\n因為他們手上明明有很多武器，卻沒有辦法殺死凱妮絲\n\n作者在這裡給凱妮絲主角威能就太大了\n\
  \n更別說後面某區供品因為屁話太多所以沒有殺死凱妮絲等等\n\n以及讓大家最詬病的:文戲太多\n\n都讓這場殺戮遊戲變得兩光--都說是殺到你死我活的遊戲，但過程卻很沉悶，實則一敗筆\n\
  \n不過基本上這些缺點沒有實質上損壞飢餓遊戲的隱喻\n\n所以飢餓遊戲並不會糟糕到評價太低\n\n\n而第五毀滅的問題就非常嚴重了\n\n故事裡的隱喻有個重要角色沒有參與到，那就是本作的主角凱西\n\
  \n當弟弟跟男二在軍隊裡忙著學習格鬥、用槍的時候\n\n凱西在忙著跟外星帥哥談戀愛--而且是最讓人受不了的那種暮光之城式戀情\n\n而弟控凱西跑去軍營救弟弟的時候，外掛開得比妹控凱妮絲大太多了\n\
  \n凱西一進去就把女外星人勒斃已經夠扯了\n\n外星帥哥還會及時跑來幫忙打怪，順便幫忙炸軍營\n\n而且外星帥哥背骨的理由比阿凡達的傑克爛多了!!\n\n第五毀滅裡面社會化的隱喻橋段已經夠少了，還夾雜了狗血愛情劇\n\
  \n我想真的除了看帥哥美女，不然它的劇情真的搞得毫無可看點可言\n\n\n總結來講\n\n飢餓遊戲是修飾劇情精彩度的情節、特效做得不好，但主結構沒被影響\n\n\
  第五毀滅是特效做很好(其實也只有剛開始那裡而已)，但主結構很爛\n\n\n這就是為什麼第五毀滅評價會比飢餓遊戲低那麼多的原因\n\n--"
