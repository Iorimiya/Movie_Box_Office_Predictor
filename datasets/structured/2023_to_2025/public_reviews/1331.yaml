url: https://www.ptt.cc/bbs/movie/M.1418318531.A.F85.html
title: '[普雷] 飢餓遊戲3自由幻夢 廣告與革命'
content: "整體來說 無聊到爆\n拜託不要噓我\n\n沒有前兩集鬥技場殺戳的緊湊感\n\n凱妮絲是一個重情重義卻演技差的女人\n比德這個演技好卻受盡折磨的可憐人\n\
  整部片的感覺就像一齣無聊的拍廣告電影\n\n首都主打了一支比德主演的反革命為穩和諧的廣告\n依珊區就打一支凱妮絲革命的廣告\n\n除此之外\n這部電影中有三個場景讓我感動到\n\
  \n第一幕就是凱妮絲到戰地醫院探望\n四處傷痕累累  整個場景都跟著凱妮絲的情緒悲傷到極點\n然後突然路人甲小弟站出來問他:\n  凱妮絲姊姊, 你會跟我們一起戰鬥嗎?\n\
  \n凱妮絲凝視著他無辜的雙眼, 說到: 我會的\nPS: 路人甲小弟怎麼有像伊斯蘭國的童年戰隊XDDD\n\n第二幕就是\n  If we burn, you\
  \ burn with us!!!!!\n  如果我們烈火焚身, 你也要跟我們一起燃燒\n\n  然後一隻燃燒的金色學舌鳥飛出來做廣告的結尾\n\n第三幕\n\
  \  凱妮絲靜靜的在湖邊哼著小曲, The Hanging Tree [吊人樹]\n  Are you, are you\n  Coming to the tree\n\
  \  Where I told you to run,\n  So we'd both be free.\n  是否 是否\n  來訪此樹\n  曾央求妳向前奔逃\n\
  \  一起獲得自由\n\n然後暗夜裡一群工人帶著冷兵器與炸藥\n用肉身衝進了首都的水力發電廠\n多少血多少淚與勇氣\n成功的炸毀\n\n幹\n\n難怪本片在中國被禁\n\
  \n\n\n\n\n\n--\n 05/15 11:09\n  05/15 11:10\n  05/15 11:10\n 05/15 11:10\n  05/15\
  \ 11:11\n\n--"
