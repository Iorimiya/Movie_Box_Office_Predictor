url: https://www.ptt.cc/bbs/movie/M.1417346623.A.28C.html
title: '[普好雷] 飢餓遊戲-自由幻夢  珍妮佛好可愛唷~ <3'
content: "(貼心小防雷)\n\n\n\n\n\n\n\n\n\n\n\n\n從高中以來班上就會揪看電影  玩命關頭和飢餓遊戲則是每年必定朝聖的\n\n當時很迷飢餓遊戲是因為班上有一套完整的小說每天傳看\n\
  \n所以大家都愛上了這樣(?)\n\n而今年的電影咖們都好忙  只剩我跟一個女生去看QQ\n\n-----------------------------廢話前言結束-----------------------------\n\
  \n看完整套小說的時候  一直很愛凱妮絲這個角色\n\n珍妮佛就很生動的演活了我心中的凱妮絲!!\n\n這一集不管是她念著醫生要她做的復健\n(就是她說我叫作凱妮絲\
  \  我住在第十二區...BlaBla)\n\n還是她很滑稽的拿著旗子喊著革命台詞   或者去到第八區完之後唱歌的橋段\n\n都很能讓人知道當時凱妮絲心中的想法\n\
  \n我是先看過小說才進電影院看的  因為很愛在看電影時  腦補主角當時的小劇場XD\n\n而小珍就很能夠把凱妮絲在小說裡面落落長的心境描述  用她的演技輕鬆表現出來\n\
  \n光衝著這一點  就想給飢餓遊戲超好雷了 >_____<\n\n這一部之中最令我感動的時刻是唱吊人樹和找妹妹那邊\n\n小說中把吊人樹與爸爸的回憶一起描寫著\n\
  \n電影則是拍成一首革命歌  在她的歌聲之中  反抗的人民衝進水壩丟炸彈\n\n啊~~堆積的屍體給人好難過的感覺  而且珍妮佛的歌聲其實還不錯 >////<\n\
  \n找妹妹那裡則是再次證明了她有多愛多愛她妹妹\n\n電影中沒提到  那個防爆門是關了就無法再開啟的  直到警戒解除\n\n也就是說  她們沒在時限內進入的話\
  \  就有可能待在外面的地堡中被炸死\n\n這種危及性命的關頭  完全體現出了凱妮絲對妹妹的愛\n\n看的我是高潮一波接一波QQ\n\n\n\n蓋爾這一次的戲份明顯重了許多\
  \  他在陪同凱妮絲回第十二區的時候\n\n凱妮絲在她家給了蓋爾一個吻  小說中好像沒有這一段劇情吧\n\n讓我還滿想哭的  因為蓋爾說了「只有我難過，才會讓你注意到我。」\n\
  \n凱妮絲從第一集就一直在蓋爾跟比德之中抉擇著\n\n我知道電影拍的比較像她從頭到尾都愛比德啦\n\n但是小說是她兩個都在猶豫  例如第二集勝利之旅前夕問蓋爾要不要逃\n\
  \n覺得蓋爾一直都是滿重要的角色  有了他的陪襯  才能看出凱妮絲的愛有多深\n\n\n\n小櫻則是畫龍點睛的一個人物  有天鏡頭是她和凱妮絲對話\n\n雖然只有短短的幾句\
  \  卻很能表現出她對姊姊的關心與對利害關係的清晰想法\n\n這麼小的年紀就懂得大人世界權力的運作  對小孩來說好像有一點悲情\n\n\n\n再來說說比德  比德的細微表情真的很厲害\n\
  \n那個皺眉  那個眨眼  搭配上他說的話  不難知道比德一心還是繫著凱妮絲的安危\n\n小說中的設定是比德說的話很能打動人心  電影拍起來也是真的如此\n\n\
  我想很大一部分的原因都是比德自然不做作的演技吧\n\n他從拍宣傳片的誠摯眼神  到被刑求時的憔悴  再到被救出後想殺了凱妮絲的殺氣\n\n完全一個紅螞蟻阿~\n\
  \n\n\n\n今天看完之後的感想其實很簡單   「嗄?就這樣歐?  一臉來串場的...」\n\n雖說演員們滿厲害的  但以劇情來說我深深覺得被欺騙了220大洋...\n\
  \n劇情的推展度不太足夠  還以為會拍到更後面去   =      3  =\n\n最後覺得  這一部有些場景好像滿嚇人的\n\n不是可怕的那種  而是忽然出現的聲光效果很容易嚇到\n\
  \n跟我一起來的女生一直尖叫害我頻頻出戲...\n\n這一篇心得有點亂  因為我平常講話就沒什麼邏輯QQ  傷眼傷腦請見諒嗚嗚\n\n\n總而言之\n\nHappy\
