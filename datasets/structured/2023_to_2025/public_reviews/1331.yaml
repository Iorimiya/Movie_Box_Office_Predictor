url: https://www.ptt.cc/bbs/movie/M.1448133243.A.D5F.html
title: '[負雷] 被一堆超近特寫切割開的飢餓遊戲完結篇'
content: '雷雷雷雷雷雷























  一般來說看到爛電影就自己摸摸鼻子算了，但飢餓遊戲好歹也是一個系列的終結，


  沒想到會是以這樣子的形式完結....



  小櫻被炸死的地方實在是有夠沒頭沒尾，感覺起來就像是為了交代最終凱尼斯選擇


  比特而不是蓋爾的舖陳罷了。


  在婚禮的地方姐妹倆互相擁抱，然後接下來的兩人的互動就只剩下被炸死的前一秒。


  小櫻這個角色有沒有這麼免洗啊.... 出場只為了讓凱尼斯抱然後死掉只是讓凱尼斯可以


  責怪蓋爾？！



  然後一群人玩遊戲瞎闖首都，芬尼克(哭哭)一開頭還宣告飢餓遊戲開始，


  啊整個首都我看也只有你們在闖關啊，剩下的反叛軍都躲在最後面然後轟的一聲就打


  下首都了，那政府軍佈下天羅地網的陷阱是要... 抓老鼠嗎？




  整部電影充斥了大量、大量、大量的特寫鏡頭，然後故事劇情就這樣被切割的亂七八糟，


  前幾集好歹最後有個大戰收尾，同時間穿插凱尼斯和比特戰亂兒女的情懷，


  反觀這集戰爭收的莫名其妙，


  女魔頭的陰謀舖的莫名其妙，


  凱尼斯一箭幹掉她的時候後面一群人直接衝去殺掉老總統，毫無情緒轉折，


  (有沒有這麼免洗的臨演)


  導致最後兩個人回歸家庭的地方一點都不動人…


  (想想最後佛羅多和山姆過著幸福快樂的生活.... 多令人嘆羨  *誤)





  雖然說我不是鐵粉，但也在電影院追完了這部飢餓遊戲。


  給我這樣的結尾實在很難嚥得下。






  --'
