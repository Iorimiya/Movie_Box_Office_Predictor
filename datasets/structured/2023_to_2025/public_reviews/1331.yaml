url: https://www.ptt.cc/bbs/movie/M.1448960888.A.AD2.html
title: '[影評]柿子影言》飢餓遊戲殺總統　忠實原著缺亮'
content: '影評來源:


  卡優新聞網電影影評


  連結:



  內文:


  作者 柿子 報導 2015/11/27


  「飢餓遊戲」終於步入完結篇，柿子有種鬆了一口氣的感覺，畢竟從「哈利波特」之後，

  由青少年文學作品改編的電影愈來愈多，像是《分歧者》、《移動迷宮》、《天使聖物　

  骸骨之城》…等，大抵不脫堅毅心性的主角，為了生存而努力征戰，充滿了科幻和魔幻感

  ，看久了還真得有點膩，但偏偏看了第1集，為了知道劇情，就只好不斷看下去…。


  　　「飢餓遊戲」還真是其中的佼佼者，有如「大逃殺」一般的劇情，加上帶出受到強力

  壓迫而起身反抗的革命情節，確實讓電影充滿了可看性。即使上一集女主角只射出一、兩

  把箭，還是讓人對這一集充滿期待。電影本身也不負觀眾期望，動作與特效畫面十足，娛

  樂性讓觀眾超過癮，可惜就像原著小說一樣，犧牲了心境轉折與情感流動，只能靠觀眾自

  己「腦補」。


  　　《飢餓遊戲：自由幻夢-終結戰》接續前集，施惠國進入全國性戰爭，主角凱妮絲挺

  身對抗都城的總統史諾。在親密夥伴蓋爾、彼得的相挺下，不惜私自前往前線作戰，發動

  刺殺計畫。而史諾總統也發覺刺客小組的到來，在都城設下重重陷阱，讓大戰有如第76屆

  飢餓遊戲，決定了整個國家的未來。


  　相較於前一集的「媒體戰」，最後一集非常明確聚焦在「刺殺」這一件事上，想要看凱

  妮絲大顯身手的影迷、書迷們大概會很開心，整部電影充滿了殺戮、陷阱、怪物…等元素

  。雖然並沒有再強調各種武器的特色，也不像首2集，詳細說明每位角色的技能與長才，

  不過打打殺殺真得比上一集過癮太多，絕對可以滿足觀眾的娛樂需求。


  　　不過，不知道是不是柿子要求太多，畢竟看小說的時候，就感覺作者並沒有花太大力

  氣處理細膩的情感變化，以及面對國家社會改變的震撼，使得電影最末集同樣出現這樣的

  缺點，應該說是「忠於原著」？還是「虎頭蛇尾」？這一點實在太可惜了！


  　　首先是施惠國總統史諾，與第13區領導者柯茵之間的關係，史諾對於戰事節節敗退的

  無力，以及柯茵逐漸崛起的野心，在電影中全然看不到；彼得終於歸來，卻被洗腦成精神

  失控的怪人，凱妮絲也沒有太多的情緒展露；妹妹小櫻被利用的過程未詳細描述，只看見

  凱妮絲有如鐵娘子般復仇，總感覺缺少了一些情緒，催不出觀眾的眼淚。


  柿子本以為，原本小說最後一集，被電影分為上下2集，應該可以補齊小說沒有描述到的

  部分，唉！這一切都是柿子想太多，導演非常「忠實」地呈現出小說的一切，連小說的缺

  點都拍進去了，從「觀眾」的眼裡，看到的是主角想盡了辦法要殺死史諾總統，戰事優劣

  、自己的感情、親情全部都拋諸腦後，這讓「自由幻夢」前集難得拓展出來的宏觀變得狹

  隘，層次也降低不少。


  　　當然可以說，故事繞著主角跑就可以，是誰規定她要成為戰事成敗關鍵，不過從「燃

  燒的女孩」進化成為「學舌鳥」，最後卻沒有展現出主角在故事中應有的重要性，確實讓

  人好嘆氣啊！所以才說最後的一切要靠觀眾自己「腦補」，因為小說沒說、電影沒演，觀

  眾就自己想像吧！


  　　總而言之，柿子只能給《飢餓遊戲：自由幻夢-最終戰》象徵「可有可無」的3顆柿子

  。看動作場面很爽快，但比不上首2集的完整，劇情偏向保守，沒有太大的突破，就是中

  規中矩讓觀眾看到小說的結局，進場觀賞好像在盡義務，給看了3集的自己一個交代。


  酸柿子點評：最爽的人就是艾菲了啦，當初進行第12區的飢餓遊戲徵選，老天爺給她一個

  冠軍候選人凱妮絲，連續4集都負責主角的食衣住行，完全沒有捲入戰爭，故事裡活的最

  爽的就是她，如果劇情繼續下去，這人大概會出一本「我在學舌鳥身邊的日子」吧。


  影評等級：(0顆柿子~5顆柿子)

  0顆柿子：影史奇觀；0.5顆柿子：不值一提；1顆柿子：絕對傻眼

  1.5顆柿子：眉頭深鎖；2顆柿子：一陣尷尬；2.5顆柿子：尚未成熟

  3顆柿子：可有可無；3.5顆柿子：瑕不掩瑜；4顆柿子：不看可惜

  4.5顆柿子：強力推薦；5顆柿子：影壇經典


  作者介紹：電影部落客「Mr.柿子」，從大學時代開始迷上電影，過著沒有電影活不下去

  的生活，曾經有一天趕過6場電影的瘋狂紀錄，誓言為每部看過的電影，寫一篇評述，至

  今已破千篇文章。

  --'
