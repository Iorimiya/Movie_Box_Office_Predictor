url: https://www.ptt.cc/bbs/movie/M.1416490082.A.190.html
title: '[新聞] 「飢餓遊戲3」 減少打戲多談情'
content: '【世界日報╱記者馬雲／好萊塢報導】2014.11.20 03:49 am


  珍妮佛勞倫斯。圖／獅門公司提供


  本月21日上映的「飢餓遊戲」第三部「飢餓遊戲：自由幻夢」（The Hunger Games:

  Mockingjay - Part 1），是小說三部曲中爭議最大的一部，牽扯到太多政治內涵，且動

  作戲將減少，感情戲特別多，搬上大銀幕效果又如何？珍妮佛勞倫斯（Jennifer

  Lawrence）、連恩漢斯沃斯（Liam Hemsworth）、喬許哈契森（Josh Hutcherson）等主

  演在記者會上暢談他們角色的轉變。勞倫斯也表達沒能去中國及其他亞洲國家宣傳而感到

  失望。


  本片為「飢餓遊戲」大結局的上集，首度揭開施惠國（Panem）最隱蔽之處，即神秘的第

  13區。故事延續上集「燃燒的女孩」凱妮絲（Katniss Everdeen ，珍妮佛勞倫斯飾）炸

  掉遊戲賽場後，在大旬祭上被反抗軍救走，比德（Peeta Mellark ，喬許哈契遜飾）卻不

  幸落入都城(Capitol)手裡。凱妮絲被帶到傳說中已成廢墟的第13區，在反抗軍領袖柯茵

  （President Alma Coin，茱莉安摩爾飾）和戰友支持下，銜命成為革命的象徵，領導施

  惠國各區叛變，對抗專制又腐敗的都城，同時也心繫比德安危，傾力籌畫營救行動。


  隨著這場決定施惠國命運的戰爭愈演愈烈，凱妮絲也漸漸察覺，遊戲根本從未結束，她必

  須先確定該信任誰。因為被分為上下兩集，故事的高潮部分都被留在明年上映的下集中，

  而這部則屬「過渡篇」，講述過去兩集殘忍殺戮遊戲給幾位年輕人造成的心裡傷害及改變

  。


  勞倫斯 吃洋蔥拍吻戲


  勞倫斯表示：「這集中沒有太多的動作戲，但感情戲特別多，觀眾會看到凱妮絲面對朋友

  愛人被威脅、折磨，要做出選擇，同時發現經過這些殺戮遊戲，她已改變，要努力找回自

  己。」片中勞倫斯有很多情感大爆發的戲分，還有哭戲，她稱演哭戲的訣竅就是一直把眼

  睛瞪大看著一個地方看很久。


  而愛惡作劇的她自然不會放過與連恩漢斯沃斯演吻戲時捉弄對方的機會，她特地在拍攝吻

  戲前吃了有洋蔥的三明治並不刷牙。連恩表示：「我一直把勞倫斯當親人一樣看待，她什

  麼都好，就是每次拍吻戲絕不讓我好過。」連恩的角色不再只是「花瓶」，也加入反叛軍

  成為戰鬥者。


  喬許哈契森飾演的比德則面臨折磨與考驗，並被敵軍洗腦，從愛護凱妮絲的戰友，變成了

  她的敵人。而山姆克萊弗林（Sam Claflin）飾演的Finnick這次也因愛人被敵人抓走，展

  示出內心黑暗、難以控制的一面。


  雖然沒人直接問關於「手機裸照風波」，但勞倫斯表示，好在身邊的朋友、經紀人和助理

  都是從她未成名前就跟隨她一路走來，從來不會對她說謊。勞倫斯說：「我需要有人隨時

  對我說『不』，因為有真實的聲音在，我才能繼續作自己。」




  --







  --'
