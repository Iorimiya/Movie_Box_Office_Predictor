url: https://www.ptt.cc/bbs/movie/M.1449215207.A.70B.html
title: '[普雷] 台哥大VIP電影招待會初體驗之飢餓遊戲~'
content: '(趁一早沒人先拍一下)

  首先要先謝謝我朋友用他台哥大VIP身分報名特映會，

  不然現在電影院一定人爆多，而且又很難買到票XD

  雖然前幾集都只有在電影台看過重播，但最後一集還是會想去電影院看看~~~~



  整體節奏是很順暢的，不會讓人想睡，有一種一波未平一波又起的刺激感覺

  在戲中，我覺得女權(?)是被強化的，以至於我覺得有點爛尾...


  我是沒有看過小說，所以我會單就這一集看到的內容來分享~

  劇情毫無疑問是接續上集，凱妮絲因傷復原中，

  但施惠國已經進入全面性的戰爭，且比德的狀況遲遲沒有好轉的情況下，

  她決定要史諾付出代價，進而開始一連串的秘密計畫。相較於在競技場，

  凱妮絲在這集遇到更多更危險更難決定的事情，

  不只是面對陷阱、敵人，甚至是道德的抉擇，

  正因為身處現實生活中，要考慮的因素變多變雜，而讓這些衝突美更顯得耀眼。


  可能大家在看電影都還是會希望Happy Ending，

  可是這樣前面鋪陳的衝突美就蕩然無存啦~~~在不爆雷的情況下，

  還是歡迎大家購票入場觀賞人性間的爾虞我詐

  (搞得我好像發行商在推銷一樣)


  另外，我最印象深刻的是，化妝真的可以影響一個人很多很多啊!!!



  這是準備慷慨激昂準備說服史都奴隸的凱妮絲，只有淡淡的妝，看起來滿無害的



  這是化全妝準備來一場刺激的抉擇的凱妮絲，完全霸氣外露啊啊啊!!!

  美到一個不行當然這箭射出去也是一個霸氣外露的決定，

  但秉持不爆雷的情況下，就大家進戲院看吧~


  額外要分享的是這次的特映會，實在太物超所值哈哈哈

  原本以為這種免費的VIP特映會，就是規定限制一堆，然後要啥東西都要加價

  沒想到竟然除了電影票還有吃得跟喝的，還有看片紅利金(撒花)



  為了免錢的食糧，花了五分鐘體驗了台哥大相關的數位服務

  比較讓我驚艷的是myVideo線上影城，沒想到上面收的片還蠻多蠻新的，

  想看電影時能直接透過app宅在家裡看片，還蠻方便的

  另外是時空訊息的服務，拿來當surprise應該很適合!!




  利用排隊確認資料的時間體驗這些app，會有專人解說

  這還蠻聰明的，還會順便再跟你強調一次台哥大的4G比人家快XD




  老實說，這個活動還滿不錯的，實際回饋到用戶，

  也讓消費者更了解自己有哪些加值服務可用，

  看看我朋友，每個月都固定在領VIP服務

  而且在現場被服務的過程中，接待人員都很親切~

  還特別挑美麗華的VIP廳，我完全被座椅還附桌子嚇到(世面見不夠多哈哈哈)

  難怪我朋友默默的使用這家電信秉持不跳槽中斷VIP身分，果真有原因的~~~~~




  ------------------回歸正題------------------

  其實我本來是對飢餓遊戲這題材沒有太大的興趣，也只會想說在電視上看看重播就好

  不過這次看完完結篇之後，我竟然有一種想要把全系列再看一次的衝動

  因為飢餓遊戲正是人生寫照，而又有誰能在這場遊戲中獲勝，就看自己的決定了！



  --'
