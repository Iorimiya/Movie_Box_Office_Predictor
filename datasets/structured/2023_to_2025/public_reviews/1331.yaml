title: '[新聞] 系列最佳《飢餓遊戲》好評出爐！'
content: '新聞出處 /



  由奧斯卡影后珍妮佛勞倫斯（Jennifer Lawrence）主演的萬眾影迷引領期盼的《飢餓遊

  戲》電影系列的最終篇章《飢餓遊戲：自由幻夢 II》（The Hunger Games: Mockingjay

  – Part 2）雖然還有兩個多禮拜的時間才會上映，但第一波評論已經出爐。影片在知名

  評論網站爛蕃茄得到了100%的新鮮度，全數媒體都給予影片正面好評。


  《TheWrap》認為「今年最令人滿意的商業鉅片。」、 「從頭到尾都激動人心。」《Inde

  pendent》更讚譽本片是： 「整個系列中最黑暗、暴力的章節，卻也是全系列最棒的一集

  ！」而《Time-Out》更是驚歎道：「近期最讓人目瞪口呆的觀影體驗。」


  《飢餓遊戲：自由幻夢 II》同樣由導演法蘭西斯歲珥蛓窗]Francis Lawrence）執導，卡

  司陣容包括了：連恩漢斯沃斯（Liam Hemsworth）、喬許哈契森（Josh Hutcherson）、

  伊莉莎白班克絲（Elizabeth Banks）、史丹利圖奇（Stanley Tucci）、伍迪哈里遜（Wo

  ody Harrelson）、奧斯卡影帝菲力普西摩霍夫曼（Phillip Seymour Hoffman）、薇洛希

  爾絲（Willow Shields）及奧斯卡影后茱莉安摩爾（Julianne Moore）等。


