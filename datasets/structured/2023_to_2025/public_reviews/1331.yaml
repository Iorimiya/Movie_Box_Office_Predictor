url: https://www.ptt.cc/bbs/movie/M.1717711815.A.A64.html
title: '[新聞] 飢餓遊戲系列前傳電影確認開發 敲定檔期'
content: '《飢餓遊戲》系列前傳電影確認開發並敲定檔期　改編自即將發行的系列同名小說


  繼深獲好評的《飢餓遊戲》（The Hunger Games）前傳電影《飢餓遊戲：鳴鳥與游蛇之歌

  》（The Hunger Games：The Ballad of Songbirds and Snakes）之後，獅門影業也緊接

  宣布開發下一部前傳電影系列《飢餓遊戲：黎明收割》（暫譯：The Hunger Games：Sunr

  ise On The Reaping）。




  事實上，本片是改編自小說家蘇珊 柯林斯（Suzanne Collins）所撰寫，並即將在2025年

  發行的第五部同名小說《飢餓遊戲：黎明收割》，儘管目前為止還不清楚詳細的故事細節

  ，不過可以知道的是，該作時間點是設定於第一部小說《飢餓遊戲》的24年前。


  而柯林斯也表示，故事靈感是深受於蘇格蘭哲學家大衛 休謨（David Hume）的啟發，表

  達出「多數人被少數人統治的容易性」的概念，探討掌握權力的人有多大的影響力。




  小說預計將在2025年3月18日發行，而改編電影《飢餓遊戲：黎明收割》則是預計安排在2

  026年11月20日於北美戲院上映，目前官方尚未公布包含導演、編劇、演員名單等消息。


  新聞來源： THR


  新聞網址：








  --

  噓太慢了吧 加油好嗎 別再混了'
