url: https://www.ptt.cc/bbs/movie/M.1697304395.A.850.html
title: '[新聞] 飢餓遊戲導演坦言後悔將自由幻夢分成上下'
content: '《飢餓遊戲》導演坦言後悔將《自由幻夢》分成上下集：我知道這讓很多粉絲非常憤怒




  （圖片來源：獅門影業）


  2008 年，《哈利波特》（Harry）系列決定將最終章《死神的聖物》（Deathly Hallows

  ）特別分成上下集製作，以求能提供更完整的結尾給觀眾，而自此之後，好萊塢也開始頻

  繁跟風這種做法，例如《分歧者》（Divergent）、《暮光之城》（Twilight）、再直到

  近期的《不可能的任務》（Mission：Impossible）系列等片，都依舊熱衷於此。


  《》（The Hunger Games）系列也是《死神的聖物》後第一批跟風將結尾分拆兩

  集的案例之一，但負責執導最後兩集的法蘭西斯勞倫斯（Francis Lawrence）現在事後回

  想，其實很後悔選擇這麼做。




  （圖片來源：Syfy）


  下個月 17 日將帶著最新執導的《》前傳《鳴鳥與游蛇之歌》（The Ballad of

  Songbirds and Snakes）重返院線的勞倫斯，在《時人》（People）雜誌的專訪中坦承，

  如今的他已經後悔將正傳三部曲的最後一部《自由幻夢》（Mockingjay）分拆成兩集：


  「我真的很後悔，一整個很後悔。我不確定參與製作的每個人都跟我一樣後悔，但我絕對

  非常後悔。」


  勞倫斯解釋，他和製作團隊都認為《自由幻夢》上下集其實是有各自獨立的故事主題，但

  他也明白為何觀眾會對於拆成兩部感到不滿：


  「現在回想起來，在聽到所有的觀後反應，並感受到粉絲、影評人和大眾對分成兩集的憤

  怒之後，我已經意識到這樣的做法很令人失望，而我也能理解。」




  （圖片來源：獅門影業）


  勞倫斯也指出，他認為人們會感到失望的其一因素：「以電視劇來說，如果每一集的最後

  都有留下待續的懸念，你就得等上一個禮拜才會看到後續，或者你也可以等到一季完結之

  後再一口氣全部看完，這樣你就能馬上看到下一集。但讓觀眾等上一年才能夠看到下一集

  ，我覺得這就給人一種很卑鄙的印象了，即使事實並非如此，即使這不是我們的意圖也一

  樣。」




  （圖片來源：獅門影業）


  但勞倫斯仍覺得，分兩集呈現還是有其好處：「事實上，我們從《自由幻夢》原書裡搬到

  大銀幕的素材，比其它集數都要多，因為《自由幻夢》改編成電影後的總片長有將近四小

  時。但我有觀察到、也明白這為何會讓人們失望。」


  勞倫斯也保證，同樣改編自原作者 蘇珊柯琳斯（Suzanne Collins）前傳小說的《鳴鳥與

  游蛇之歌》，這次絕不會分成上下集：


  「我絕不會讓他們再將這本書拆成兩部電影了，我們也從來沒有討論過要這麼做。《鳴鳥

  與游蛇之歌》原著的篇幅是很長沒錯，但我們已經因為將《自由幻夢》分兩半而收到很多

  批評，無論是粉絲還是影評人，所有人都在罵我們，所以我就想說：『我不會再這麼做了

  ，我這次就只要把電影拍長一點就好了。』」




  文：Joker


  新聞來源： People


  新聞網址：




  --'
