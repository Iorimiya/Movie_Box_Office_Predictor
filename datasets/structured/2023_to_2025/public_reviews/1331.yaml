url: https://www.ptt.cc/bbs/movie/M.1449831808.A.976.html
title: '[負雷]飢餓遊戲 自由幻夢II'
content: "以下有雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n------------------------------------------------------\n\
  電影版首PO，如有違規會自刪\n\n這系列我沒有看過小說，所以單就電影分享一些簡短心得~\n\n\n\n1.同許多人的感想，第一部還蠻精彩的\n\n  第二部雖然跟第一部差不多\n\
  \n  但是結尾女主角被直升機吊走的時候有surprise到\n\n  第三集上部絕地大反攻也還OK\n\n  下部就是一直老調重彈炒冷飯...\n\n  (覺得第三集不要拆成兩部會好很多)\n\
  \n  追了好幾年的電影就以這樣的結局結束有點無言 :(\n\n\n\n2.認真覺得電影中女主角雖然有理想但是行動上實在是傻傻好天真\n\n\n\n3.發便當發得很沒層次\n\
  \n  前面鋪梗鋪那麼久很有個人特色的角色們就這樣通通莫名其妙地突然死了\n\n  死到後來我都快無感，處理得很倉促\n\n  菁英小隊的菁英死的和路人一樣快\n\
  \n  (對照第一集小芸的死，她的死有帶起劇情上的張力讓觀眾覺得義憤填膺)\n\n\n\n4.這集前面的劇情散散的、沒有把整個感覺撐起來\n\n  導致後面看到男女主角隱居的時候沒什麼感覺\n\
  \n  (對照板友提的，看到佛羅多山姆先後出海的時候就會想\n\n  \"啊~真是辛苦了，快去好好休息\"\n\n   這邊就是咦你們要休息啦？)\n\n\n\n\
  一點簡短心得大家將就看看\n\n\n\nPS.大家有沒有看到一半突然懷疑自己是不是在看殭屍片\n\n\n\n\n\n\n\n\n\n\n--"
