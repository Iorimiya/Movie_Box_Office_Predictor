url: https://www.ptt.cc/bbs/movie/M.1698897461.A.2D7.html
title: '[新聞] 珍妮佛勞倫斯高度意願回歸《飢餓遊戲》'
content: "珍妮佛勞倫斯高度意願回歸《飢餓遊戲》　但製作團隊認為凱妮絲的故事已完結\n\n\n\n《飢餓遊戲》全球票房佳績讓珍妮佛‧勞倫斯(Jennifer\
  \ Lawrence)一躍成為好萊塢當紅明\n星，該系列三部曲也獲得了不少迴響。時隔多年，這個熱門系列再度推出前傳，《飢餓遊戲\n 鳴鳥與游蛇之歌》以瑞秋·曾格勒(Rachel\
  \ Zegler)為女主角。勞倫斯先前接受《Variety\n》訪問時表示，若有合適機會，她將毫不猶豫地再次扮演凱妮絲·艾佛汀一角。然而，系列\n製片人卻暗示凱妮絲的故事已經結束，因此要看到珍妮佛在《飢餓遊戲》中再次大放異彩似\n\
  乎並非易事。\n\n\n珍妮佛勞倫斯在六月接受《Variety》採訪，宣傳新片《珍愛硬起來》時表示，如果有合適\n的機會，她「完全」願意再次扮演《飢餓遊戲》中的凱妮絲·艾佛汀角色。她當時補充說：\n\
  「如果凱妮絲能夠再次進入我的生活，我會毫不猶豫。」\n\n\n然而，系列製片人妮娜·雅各布森(Nina Jacobson)和導演法蘭西斯·勞倫斯(Francis\
  \ Lawr\nence)對於凱妮絲一角的發展似乎不太樂觀。其原因在於她的故事已經有了完美結局，而是\n否會有後續發展則取決於原作《飢餓遊戲》作者蘇珊·柯林斯(Suzanne\
  \ Collins)是否有意\n重新探索凱妮絲角色。如果柯林斯沒有意願撰寫關於凱妮絲回歸的故事，這也意味著電影製\n作團隊不會讓珍妮佛·勞倫斯再次回歸演出。\n\
  \n電影《鳴鳥與游蛇之歌》的故事背景設定在《飢餓遊戲》系列的六十多年前，這使得珍妮佛\n·勞倫斯無法再次扮演她在該系列中的角色凱妮絲。前傳中的主角是來自第12區的露西·格\n\
  雷·貝爾德(Lucy Gray Baird)，由瑞秋·曾格勒(Rachel Zegler)擔綱飾演。露西是第12區\n的一名參賽者，由年輕的史諾指導參加了第十屆飢餓遊戲。\n\
  \n\n勞倫斯在八月受《Empire》雜誌採訪時談到凱妮絲和露西之間的差異：「凱妮絲是一個內斂\n卻堅毅的角色。她深沉寡言且堅忍不拔。相比之下，露西·格雷展現了她獨特的魅力，她真\n\
  的是一位優秀的表演者。」\n翻譯：沒你的戲了\n--"
