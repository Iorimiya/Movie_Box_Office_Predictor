title: '[討論] 過時但終於看完飢餓遊戲'
content: "這部好幾年前我只看了第一集\n因為熱門\n 所以就覺得反正很有機會常看的 就沒動力馬上接著看\n直到前幾年在電視看了2前段\n才開始疑惑凱妮絲對比德愛到底有多少\
  \ 那1又怎麼有感情\n2又跑出青梅竹馬蓋爾\n後來這幾天決定看完2-3上下\n我看了3後\n雖然查網路看到有人認為她是喜歡蓋爾 或是兩人勢均力敵\n而且我覺得蓋爾還幫凱妮絲救比德,是大度的情人\n\
  只是因為妹妹死了的原因才讓凱妮絲選擇比德\n（其實關鍵的價值觀也蠻重要的,不然遲早會有問題，蓋爾跟凱妮絲爭論對戰爭被犧牲的\n人看法 ,蓋爾覺得是必要之惡,就跟凱妮絲不同了,所以我覺得凱妮絲選比德是對的，但在\n\
  3中我覺得蓋爾就很可靠 ，比德戰力不高就算了 ,還被洗腦人格 ,是未爆彈扯後腿，但後\n來他好在有恢復.）\n其實看3雖然明顯的凱妮絲相當在乎比德，有人說是因為同情想保護他而愛，\n\
  如果照我以前也是會這麼認為，但因為自己經歷，\n喜歡一個人除了他也要讓你崇拜，還有得 不捨，因之前看過教戀愛的課,是教兩性要找的\n,要找“無法把你丟下不管的人”,也不是要表現差,是既好又能讓對方看見你不足弱點\
  \ 更\n加覺得可愛或不捨,這種關系能加深長久愛戀,不管怎樣跟我個人愛一個人經歷很像，\n我看了3 我確定凱妮絲是愛比德的，蓋爾是工具人 ，不知道是不是因為蓋爾也比較會戰\n\
  鬥，但是 ，凱妮絲是不能失去比德，因為比方 ，假設兩個人都能付出自己所有 ，但是\n凱妮絲就是對比德更有感動，以利益衡量兩人都付出一樣多的話\n為何我覺得凱妮絲就是會覺得哇比德真愛我,\n\
  蓋爾 ，就是 ，哇好暖心\n偏心.\n所以我認為凱妮絲是比較愛比德的.\n\n\n\n--"
