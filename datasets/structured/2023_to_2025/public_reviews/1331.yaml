url: https://www.ptt.cc/bbs/movie/M.1416668495.A.962.html
title: '[好雷] 飢餓遊戲-Mockingjay-Part 1'
content: '真的非常好看，覺得鋪陳的非常好，


  Francis Lawrence有延續的第二集的好品質，


  雖然大場面不多，但Katniss內心的痛苦和掙扎演得很好，


  其實Katniss真的很可憐，被迫參加hunger game，


  破關了又搞一個大祭典，存心要搞死他，不過都撐過來了><


  現在又要他當Mockingjay，成為都城的大死對頭，內心鐵定非常煎熬，


  我忍住不看書，就是很期待電影的詮釋，一定會比書來的棒!


  Jennifer Lawrence真的很棒，果然是當今有演技又有票房的女星!!!


  很大力推薦大家去看(不過還是要看過1.2集比較好懂)


  很期待明年的Part2 <3 <3


  PS:想請問一下，為什麼都城要故意把貢品放出來?是不是有其他目的?


  --'
