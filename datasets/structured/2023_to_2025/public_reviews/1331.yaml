  Viola Davis 在《飢餓遊戲：鳴鳥與遊蛇之歌》中飾演 Volumnia Gaul 博士。


  2023 年 11 月 17 日在影院上映。




  Hunter Schafer 在《飢餓遊戲：鳴鳥與遊蛇之歌》中飾演Tigris Snow 。


  2023 年 11 月 17 日在影院上映。






  《飢餓遊戲：鳴鳥與游蛇之歌 》預告




  中文版預告（車庫娛樂）：




  《飢餓遊戲：鳴鳥與游蛇之歌》（英語：The Hunger Games: The Ballad of Songbirds

  and Snakes）是一部2023年美國科幻動作片，由法蘭西斯 勞倫斯執導，麥可 安特撰寫劇

  本，改編自蘇珊 柯林斯的2020年小說《鳴鳥與游蛇之歌（英語：The Ballad of Songbir

  ds and Snakes）》，為《飢餓遊戲電影系列》的第五部電影兼前傳，湯姆 布萊斯（英語

  ：Tom Blyth）、瑞秋 曾格勒、杭特 薛佛、傑森 薛茲曼（英語：Jason Schwartzman）

  、彼得 汀克萊傑和薇拉 戴維絲主演。


  資料來源：X


