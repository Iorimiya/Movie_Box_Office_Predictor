title: 'Re: [  雷] 飢餓遊戲看完心得'
content: '爛雷 垃圾爛片


  以下有雷







  飢餓遊戲真的是一部很鳥的爛片


  這一系列真的只有第一集好看


  第二集開始就是垃圾 一集比一集垃圾


  為了賺錢拼命拖台錢


  結尾都故意留伏筆要觀眾下一次再掏腰包


  然後劇情很鳥很爛


  莫名其妙就出現很奇怪的反抗軍


  然後什麼女主角還被救走又回來抵抗帝國


  殺小 帝國之前洗腦控制成功那麼久


  最後竟然敗給一個貧窮的窮酸破麻？


  女主角就是垃圾破麻


  周旋在兩個癡情男人之間


  玩弄愛她的人的感情


  用情不專又會演戲 裝可憐


  讓人覺得噁心至極


  這種破麻竟然被塑造成女英雄


  可恥到家


  垃圾爛片


  然後


  劇情整個爆炸爛


  吐嘈點一堆


  難看死了


  滿分十分 大概勉強給個1.5分吧



  （筆者為專業電影評論家 是電影研究權威）




  --

  Sent from my Android


  --'
