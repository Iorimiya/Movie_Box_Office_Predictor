url: https://www.ptt.cc/bbs/movie/M.1448130790.A.1D4.html
title: 飢餓遊戲自由幻夢part2 望穿秋水，世界非你期盼
content: '電影版首po，手機排版，請見諒。


  下午看完到現在仍忍不住回想，覺得很惆悵，後勁很強，情緒很亂，想抒發一點心情。


  我是一個非常入戲的人，電影一開始，My name is Katniss Everdeen. 第一句台詞講完

  我就哭了。


  我知道小說改編電影的例子早已不計其數，但當有一本你真心喜歡的書籍、甚至整個系列

  ，被改編成電影，呈現在眼前的不再只是文字，對我而言是一件非常感動的事。


  也或許是因為這樣，在看自由幻夢part2的時候，我的情緒是激動的，因為讀過小說，所

  有的劇情走向幾乎都知道，反倒更緊張。


  整部電影讓我最難受的地方莫過於小櫻的死亡。金鳳花與凱妮絲和解、比德親手植下櫻花

  草的橋段，令我格外心碎。小櫻的死和蓋爾間接相關，而從頭到尾，凱妮絲就是為了保護

  小櫻。現在小櫻死了，見到蓋爾，凱妮絲就會想起小櫻，無論害死小櫻的真正原因是什麼

  ，都和蓋爾拖不了關係、都在彼此心中種下疙瘩，這段感情，無疾而終。


  其實我一直是希望凱妮絲能夠和蓋爾在一起的。


  我是鐵粉，小說與電影我都愛，電影最後的結局給我很大的感觸，原著裡頭寫道凱妮絲和

  比德的兩個孩子，女孩繼承了凱妮絲的黑髮和比德的藍眼睛，而男孩有著比德的金髮和凱

  妮絲的眼眸。看著自己一讀再讀的文字躍上大螢幕，呈現在眼前，畫面柔和到刺痛了我的

  眼睛，眼淚不由自主地流了下來，我心裡非常感動。


  失去珍愛的人、事、物，留下的傷痛是無法挽回的，那些傷痕、那些噩夢仍歷歷在目，無

  法擺脫。


  凱妮絲始終明白，「遊戲能在上演。」

  看似美好的結局，其實充滿著遺憾。


  而對我來說，小櫻、芬尼克、蓋爾就是這個系列在我心中永遠的遺憾。


  --'
