content: "防雷頁\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n看完電影當下在腦海中想的第一件事情是\n\n\
  凱尼絲最後那段的手臂看起來好粗(被毆\n\n劇情有不少文章打了所以就不獻醜了\n\n只是  在服飾店躲藏休息時  前任男友(?)跟現任男友的談話真揪心\n\n\
  整體來說  可能是受到兩屆飢餓遊戲的洗禮  其實對攻入都城沒啥感覺\n\n縮小地圖範圍版的遊戲感覺還比較緊湊\n\n都城水下道底下的變種  造型根本惡靈古堡\n\
  \n可憐了新婚的芬尼克  這集威不到五分鐘  但  依然帥氣\n\n\n\n\n\n若要照喜好程度排名的話  2>1>3-2>3-1\n\n當初是沒看過第一集就被拉去看第二集\n\
  \n被彼得跟凱尼絲淡淡的情愫給吸引\n\n畢竟兩人一開始是作戲  後來是假戲真做\n\n為了得知前因後果才又讓我去追了第一集\n\n對了  片尾曲也是第二集加分的因素\n\
  \n\n\n片尾音樂響起  卻有種淡淡的哀傷  又一個系列作在今年結束了\n\n話說  惡靈古堡哪時候也可以結束....再爛我還是想要看結局啊~~\n\n--\n\
  「一個女人最重要的是什麼？」\n                           \n「錯，是貞操！！」\n                  \n\n--"
