title: '[討論] iTunes特價 黑鷹計畫/電流大戰/飢餓遊戲'
content: '【2023/11/21 iTunes特價報】

  黑鷹計畫／愛·子／宮廷秘史／電流大戰／奪魂鋸：遊戲重啟／柯羅索巨獸／飢餓遊戲系

  列

  －

  這一期的特價首推雷利史考特執導的經典戰爭電影《黑鷹計畫》，除了對戰爭畫面的寫實

  描寫之外，由漢斯季默操刀的配樂也相當厲害，而且極難得特價到$150以下，是納入收藏

  的絕佳時機！另外同樣$150的還有卡司強大的《愛·子》，以及老片迷可能會喜歡的《宮

  廷秘史》與《阿拉伯的勞倫斯》，其中《阿拉伯的勞倫斯》是有不同版本的，在Apple

  TV裡選購時請務必留意。

  －

  $190的部分我個人推薦BC和麥可夏儂主演的《電流大戰》，題材是以愛迪生和喬治威斯汀

  豪斯為核心的電氣產業版圖之爭，非常有時代感的一部作品。另外《飢餓遊戲》除了第一

  部的$290之外，其餘的續作目前全部打折到$90，是整套收藏的好時機。這個特價已經持

  續一陣子了，建議想收的要把握時間了。

  －

  以上，祝大家看片愉快！

