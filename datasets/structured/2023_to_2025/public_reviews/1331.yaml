url: https://www.ptt.cc/bbs/movie/M.1447763240.A.F70.html
title: '[新聞] 飢餓遊戲最終章本週上映 料創票房佳績'
content: '（中央社洛杉磯17日綜合外電報導）賣座強片「飢餓遊戲」（The Hunger Games）第4部

  作品、也是整個系列的最終章本週躍上大銀幕，料將創下票房佳績。


  這一系列反烏托邦的冒險故事，造就珍妮佛勞倫斯成為好萊塢A咖影星。


  發行這部電影的片商獅門娛樂公司（Lionsgate）表示，「飢餓遊戲：自由幻夢終結戰」

  （The HungerGames：Mockingjay - Part 2）將為好萊塢史上最賣座系列電影之一劃下句

  點；「飢餓遊戲」前3集在全球總票房已締造22億美元紀錄。


  「飢餓遊戲」改編自蘇珊‧柯林斯（SuzanneCollins）的暢銷同名小說，敘述小珍飾演的

  女英雄凱妮絲（Katniss Everdeen）在後天啟時代的「施惠國」（Panem），投入致命的

  生存戰。


  年僅25歲的珍妮佛勞倫斯已成為奧斯卡影后，更在全球最高收入女明星排行榜名列榜首，

  她近日在洛杉磯告訴記者，要向這個讓她一夕暴紅的角色告別，感覺有些「奇怪」。


  小珍說，「當電影最終上映，一切正式劃下句點時，我想感覺會非常奇怪」；珍妮佛勞倫

  斯2013年以「派特的幸福劇本」（Silver Linings Playbook）榮獲奧斯卡最佳女主角獎

  。


  她說：「這麼多年來，這系列電影一直是我的生命。」


  「飢餓遊戲：自由幻夢終結戰」18日將在歐洲、拉丁美洲、亞洲和中東多國上映，北美則

  必須等到20日。


  任職票房追蹤機構「北美院線聯盟」（ExhibitorRelations）的波克（Jeff Bock）說，

  這部電影全球票房預計將落在8億美元，實力驚人，但略少於「飢餓遊戲」二部曲「星火

  燎原」（Catching Fire）創下的8億6500萬美元紀錄。


  「星火燎原」是「飢餓遊戲」系列電影迄今最成功的一部。（譯者：中央社劉文瑜）


  新聞網址：


  --'
