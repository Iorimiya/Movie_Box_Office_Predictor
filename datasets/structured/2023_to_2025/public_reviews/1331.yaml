url: https://www.ptt.cc/bbs/movie/M.1448555800.A.ACB.html
title: '[普雷]飢餓遊戲3：自由幻夢II '
content: '部落格圖文版:


  有一陣子沒看電影了，這次應朋友邀約


  來看個飢餓遊戲三部曲最後一集


  雖然前面一集不是很好，我倒是滿期待看他怎麼收尾的


  一件作品的好壞，就看開頭和尾端怎麼掰





  首先Katniss失聲，馬上勾起久遠的上集回憶: Peeta被催眠


  Snow故意放Peeta過來讓他攻擊Katniss


  好，回憶結束


  這集重點當然要延續上回的革命


  Katniss的夢幻好來塢團隊，承襲上集任務，前去各區戰場攝影


  女主角Katniss一樣不看稿，脫稿演出(黑密契你都知道了還擬個屁稿)


  這次不幸運的遭到攻擊


  因為主角威能，休息一下又復活了


  和工具人蓋爾Geil談話中發現到重點---兩人理念大相逕庭


  Katniss一心只想殺掉Snow，認為擊垮大魔王問題就樣遊戲一樣解決了


  Geil則認為即使會殺害無辜，也要推翻政府暴政


  這段為後面的戀情敲響了喪鐘





  Peeta依然還沒回覆，仍是一部份被催眠狀態，動不動就發作


  然而，反叛軍首領柯茵(Coin)仍將他調往明星好萊塢攝影團隊


  這種刻意添亂的做法相當引人疑竇


  途中大肌肌隊長Boggs不小心誤觸陷阱，死前將那台機器(忘了名字啦)


  授權給Katniss，頗有寓意的遺言:別相信他們的任何話!


  他們是誰? 是新加入人手?還是好萊塢攝影團隊全部人都有鬼?





  Katniss率領攝影團隊要跨越層層雷區


  其中下水道那邊我覺得是本片最精采部分


  可能是電影前的紅衣小女孩預告影響


  下水道情節超恐怖啊!!! 覺得隨時都會被嚇到


  當女副隊長驀然回首時，我想全場應該都從座位上彈了起來吧


  芬尼克在這邊展現姣好身手，奮力抵抗讓我血脈噴張


  可惜作者太邪惡，死旗立太早，帥哥芬尼克終究要跟安妮說掰掰





  Katniss和Geil偽裝潛入難民群中


  讓我想到了敘利亞難民大逃亡事件


  在一群難民中，是否潛藏著意圖推翻國家的份子呢?


  和現實不同的是，都城的難民們，穿著仍然雍容華貴


  臉上頗有氣色，神色自若，一點也不像是面臨大難當前的樣子


  我想，應該是城民們非常信任政府吧?認為不管如何，政府會保護他們


  今天就跟往常沒什麼不同吧?





  然而，反抗軍攻進來了! What The Hell!!!人家明星攝影團隊長途跋涉那麼久


  中間犧牲了一堆隊友，結果反抗軍輕易就抵達都城


  政府毫無招架之力，還被敵人擺了一道


  一開始看到Geil坦承那幕感覺很怪，後來想想


  也許只是Geil為自己提出的策略感到羞恥，儘管發動攻擊的不是他本人


  我也為Snow那麼坦白感到訝異，一個老謀深算一生充滿算計的人


  輕易的把實情告訴Katniss，怎麼看怎麼怪





  柯茵宣告自己擔任臨時大總統


  為了保持戰勝國之姿，想再次舉辦Hunger Game...這樣應該是第77屆吧?


  充分顯露了他就是Snow 2.0


  這次，Katniss不再那麼衝動，平靜地做出令電影中的人民訝異觀眾卻早就猜到的舉動





  我沒看過小說


  不知道最後一集是不是完全忠於原著


  個人感想是，最後橋段真的太多餘了


  很多畫面的提示也很明顯，驚奇的部分並沒有很多


  戰爭的畫面並不比上一集精彩


  本集太過著重凱妮絲攝影團隊的旅程了


  革命應有的大場面反而大大的限縮了


  我覺得是相當可惜的地方


  政治方面嘛.....普普通通，給青少年滿適合的


  --'
