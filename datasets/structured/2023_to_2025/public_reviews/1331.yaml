url: https://www.ptt.cc/bbs/movie/M.1649771114.A.9B1.html
title: '[討論] 飢餓遊戲之爛決策'
content: '看完後123後

  照故事順序火大（也是因為看到後果）

  1 第二部

  電線通電殺人

  科學通討論說要大樹綁電線計畫 ，那時還覺得沒什麼，直到大家去到樹那裡，說要分2路

  ，我知道科學通為了自保一定要留比德同隊，比德本來要跟去凱妮絲跟喬安娜 說是去保

  護女生，我覺得不如是想跟凱妮絲一起，這2女都很強，

  而芬尼克不用說的強了， 少點豬隊友要他背就好了，

  任何女生都背不太動傷者邊跑

  不管怎麼組 ，要麻大家一起綁好，再一起去海邊放線，

  拆散比德跟凱妮絲，或是拆散大家，說幾點才在哪會合，根據多年看各種故事預感，就是

  不會完全會合.總之就是起於電線殺人計畫.


  2第二部接到第三部上


  沒救比德


  科學通跟凱妮絲對13反叛軍有價值 ，不知是因為都在大樹才一起救走，芬尼克是可能還

  沒倒下順便跟著逃出，比德完全不知去哪，

  不懂最後凱妮絲回到大樹只剩芬尼克聲音在喊 ，留下下科學通，科學通沒辦法自保 芬尼

  克跟比德不可能丟下他，大概是有敵人來逼進把

  他們搞散了？還是啥我還想不通，喬安娜後來也不知去哪， 但臨走前拔掉了凱妮絲追蹤

  器，後來比德被抓走，並不只是丟在普通貢品區，

  他可能被視為有學舌鳥反叛思想的人， 或是因為對凱妮絲很重要 ，反正他跟喬安娜都被

  毒打.總之黑密契就是沒救比德結果不只是凱妮絲很擔心生死,還看到電視完全不同比德，

  讓彼德被13區視為叛徒,要不是凱妮絲保比德跟比德警告13區 ，比德根本兩邊不是人，哪

  裡都不能活，然後救回

  來卻是要殺凱妮絲的比德，好在珂因決定救比德，還有蓋爾協助， 雖然科因是壞人出於

  私心或為了凱妮絲能幫助13

  區， 黑密契是好人 ，但這部份我超不爽黑密契， 從第二部兩人分組之後我的預感就很

  糟, 感覺最糟高點是在比德變個人 到底他是黑化還是被迫而且擔心他被殺,回來後他還

  是被毒打造成人格改變 ,心痛 QQ.


  3第三部下

  前往殺史諾


  明星小隊隊長死了，副隊想帶大家撤回基地，凱妮絲聽了隊長秘密遺言，決定堅定心中殺

  史諾計畫，接著 ,導致後面死一堆隊友,再導致接下來我要說芬尼克之死的決策,

  更何況史諾根本也不用馬上被殺才能結束永無止盡戰爭跟遊戲，他開始走下風了，反叛著

  軍戰爭就要勝利了,之後凱妮絲跟蓋爾裝難民前往

  宮殿 ，珂因早就另有計畫，

  史諾也快被逼得投降反叛軍，凱妮絲愛怎麼殺就怎麼殺


  4第三部下走地下道前往殺史諾總統，明星小隊走那暗又狹小只能一個人一個人接著走，

  我根本覺得很不安阿，隨便什麼魔神仔或災難，怎麼走啊 ，連拳腳都很難施展，

  還怕打到隊友，他媽的越看越緊張，像在看異形電影的節奏. 乾 ，史諾知道他們活著走

  地下道了,一定派什麼消滅他們，幹，

  真的來了一堆異形阿！

  後來看網路說是蜥蜴人啥的,

  可我當時真的覺得跟異形頗像！


  拜託不管怎麼危險寧走大路好嗎？不怕被堵死嗎？


  我最愛的神隊友芬尼克，

  他根本從頭到尾是1打10 ，忙不過來， 就算10個還是有救的 ，是他們死不透， 全都過

  來， 怎麼爬樓梯？要是在外面，先跑的都可以幫忙射擊殺異形，卻因為空間太小？

  說到底還是覺得是地下道太狹小  ，其他人只能先走了，

  我看幾個差點都咬死了， 是芬尼克或隊友救的 .

  沒看到結果不知道喜劇悲劇

  主角都不保證活了,更何況配角,芬尼克可能會在戰鬥中死,

  但 ,我希望他死的地方漂亮點,

  讓,大家看到他帥氣跟英勇,

  為何跟一些醜怪物死在臭地下道,哭哭,

  我希望像是大戰鬥場面最後勝利前死掉,讓他有遺言或大家帶回他屍體,然後作為戰勝後結

  局之一幕,是隆重忠烈葬禮阿！！


  以上 發洩完


  除了凱妮絲一票贊成跟那一箭射向科因...還有黑密契關鍵票

  這好像要感謝史諾總統了，那一番話我也懷疑，但科因沒死大家就白費革命了...至少他

  科因死後迎來真自由, 可以確定普魯塔克不是壞人，

  因為他一開始到終極戰時感覺壞，長的也壞，最後科因一死那笑意也很壞





  --'
