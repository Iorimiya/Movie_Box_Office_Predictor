  所以剛看到電影開頭


  說男主被洗腦綁在病床那幕看不太懂


  上一部看的好像也是叫「自由幻夢」


  但內容是主角群逃離某區 然後遇到活死人(變種?)


  最後一幕是女主背叛反叛軍


  然後帶著一個亞洲人上飛機(小眼睛那個


  跟這部的開頭不太連貫


  請問我中間是不是漏掉什麼了??


  估狗了一下好像是飢餓遊戲3有分上下


  所以順序是


  星火燎原->自由幻夢->???->終結戰


  這樣嗎??


  感謝～～


