title: '[心情雷] 飢餓遊戲之我愛芬尼克'
content: '怕誤入防雷頁

  文長

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  本文開始

  從第一集就跟隨至最後一集的本魯

  凱妮絲的演技就不用多說

  不管是一開始沒有戰友

  孤僻的眼神

  甚至是對彼得或蓋爾

  愛慕的眼神

  或者是對專業貢品

  復仇的眼神

  每個表情都很到位

  演出凱妮絲一開始

  孤孤單單代替妹妹自願參賽

  就像花木蘭代父從軍一樣

  那麼令人感動

  -

  但今天最想要表達的是

  芬尼克

  真名 山姆克萊弗林 Sam Claflin

  從第二集開始出現

  小酒窩討喜的外型

  難怪受都城人民的愛戴

  連我也被深深的吸引

  還拿著魚叉這個特別的武器

  已經充分顯現出這個角色的特色

  有外在也有內在

  對恩師不離不棄

  一直保護她至最後一刻

  俗話說「一日為師終身為母」

  完全的實踐

  跟凱妮絲結為戰友後

  面對有一次凱妮絲拿著弓對著他

  他仍是從容不迫的面對

  大旬祭後

  自己的內心充滿創傷

  但仍為自己心愛的安妮

  不斷地守在她身邊等她療傷復原

  有情有義的真男人

  是本魯心中追求的目標

  覺得可惜的是

  明明就已經是人生勝利組了

  有美嬌娘甚至快要有了孩子

  卻放下一切為了幫助凱妮絲

  這點覺得片中沒有交代仔細

  或者是本魯漏看了

  是總統命令他去還是自願的？

  再最後還是有幸看到他大展身手

  不知道殺了幾個變種？

  但...

  又為了保護凱妮絲捨棄自己的武器

  看他投擲出去就想到Ro的騎士

  不是...

  是想到完了

  感覺就是要讓芬尼克死的節奏

  被異種拉下的瞬間

  心好糾結

  好人都不長命 英雄總是默默無名

  覺得芬尼克之死

  太可惜了雖然死的很壯烈

  有點斷後路讓大家能夠順利前進

  好不容易收起悲傷

  在前面避難處的地方

  碰到的第一個懸賞單又是芬尼克

  嗚嗚導演是想讓本魯傷心幾次

  以上是個人喜愛芬尼克的各種小劇場

  謝謝大家收看


  --'
