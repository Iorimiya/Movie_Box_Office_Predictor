  \  請問那個人曾經在電影出現過嗎?\n  整部戲除了秦納完全沒有其他設計師的印象\n\n2.史諾召集一堆人在圓桌吃飯\n  被他毒死的不知道哪區將軍(好像叫安東尼)\n\
  \  被下藥是因為他沒確認凱妮絲死掉還是他被發現是臥底?\n  我覺得他看史諾的表情感覺很心虛\n  個人比較偏向是臥底被發現\n  但是電影好像也沒說明\n\n\
  \n  書是好久以前看的\n  很多細節都忘記\n  以上兩個問題其實蠻不重要的XD\n  但是一直沒有解答\n  真的超在意阿!!!!!!\n\n\n--\n\
  我知道\n只是凱妮絲突然說認識她\n讓我猜想她是不是有曾經出現過?"
