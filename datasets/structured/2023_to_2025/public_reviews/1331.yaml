url: https://www.ptt.cc/bbs/movie/M.1448300432.A.1EF.html
title: '[普雷] 飢餓遊戲最終回+看電影的禮貌 '
content: '興致勃勃地去京華城喜滿客看飢餓遊戲最終回


  雖然我已經看完第三集的小說


  知道是不可能超越飢餓遊戲第一二集的(實在是太好看!!)


  但是第三集原著原本看完就讓我覺得空虛


  所以我覺得電影能夠拍成這樣已經算是很不錯了


  尤其有個還算不差的結局~比起小說那個太~~~多~~~的讀者自我想像空間來的好


  但是觀影的一開始我的好心情就被影響了


  隔壁坐了一對超級無敵沒水準的情侶


  我旁邊那個女生片頭一開始就在那邊看手機 那個螢幕亮到我要用手遮才能看電影


  到底是來看電影還是來看手機的啊


  接著翹著二郎腿還踢到我不打緊 她完全不道歉裝作沒這回事


  最沒水準的是她整整像一隻豬一樣在旁邊吃吃吃吃東西吃了一個半小時有吧


  我不誇張 她真的吃超久! 吃到這部片都快要演完了還在吃


  而且她吃的東西是一直會發出很大塑膠袋雜音及零食包裝撕開又撕開的聲音


  拜託真的那麼餓也不要搞出那麼大的聲音影響到別人觀賞電影啊


  來看飢餓遊戲不要把自己搞得很飢餓好不好!!


  然後電影散場之後


  果真 沒水準的人真的就是有夠沒水準


  她在她們的座位下留下了滿地的垃圾 不誇張真的是滿地


  真是辛苦工作人員了


  要不是凱妮絲最後跟彼得那麼幸福的畫面


  我真的是....很想像飢餓遊戲3-1最後那個畫面掐著她的脖子...叫她不要再吃了


  --'
