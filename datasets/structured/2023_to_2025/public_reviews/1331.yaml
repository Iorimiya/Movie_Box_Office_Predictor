title: '[新聞] 耶誕妖怪來襲 飢餓遊戲北美票房不墜'
content: '（法新社洛杉磯6日電） 電影「飢餓遊戲：自由幻夢終結戰」（The Hunger Games:

  Mockingjay -- Part2）連續第3週稱霸北美票房；耶誕恐怖片「聖誕妖怪：坎卜斯」（

  Krampus）只爬上第2名。


  根據北美院線聯盟（Exhibitor Relations）今天公布的票房統計，「飢餓遊戲」系列第4

  集票房進帳1860萬美元。


  這部片儘管影評普通，上映3週仍開出2億2710萬美元總成績。


  「聖誕妖怪：坎卜斯」一上映就登上票房第2名，故事描述1個小男孩意外將怪獸召喚到家

  中的年節聚會，讓耶誕節變了調，票房1600萬美元。


  新一代「洛基」（Rocky）系列電影「金牌拳手」（Creed）連續第2週位居第3，進帳1554

  萬美元。


  迪士尼動畫片「恐龍當家」（The Good Dinosaur）以1551萬美元緊追在後。


  最新007電影「007：惡魔四伏」（Spectre）本週票房估計540萬美元，掉到第5名。


  統計票房排6到10名的電影分別是：「聖誕狂歡夜」（The Night Before）、「史努比」

  （The PeanutsMovie）、「驚爆焦點」（Spotlight）、「愛在他鄉」（Brooklyn）和「

  沉默的雙眼」（Secret in TheirEyes）。


  新聞網址：


