url: https://www.ptt.cc/bbs/movie/M.1416839034.A.71D.html
title: '[新聞] 全美週末電影票房 飢餓遊戲創今年票房紀'
content: '才三天就1.23億 太賣了吧


  一堆片上映幾週還不到這數字


  全美週末電影票房(11/21-11/23) 飢餓遊戲火熱上映 創今年票房紀錄


  深受好評、改編自同名小說的《飢餓遊戲：自由幻夢 Part I》未上映前就備受矚目，果

  不其然，首映當周即衝破今年全美周末電影票房紀錄，以1.23億美元打敗《變形金剛4：

  絕跡重生》的1億美元票房；本周居於排行榜前3名的依序為《大英雄天團》、《星際效應

  》，同為上映第3周的電影，票房業績仍維持在2008萬美元與1510萬美元的水準。


  《飢餓遊戲：自由幻夢 Part I》為此蘇珊柯林斯(Suzanne Collins)所著《飢餓遊戲》大

  結局的上集，由《飢餓遊戲2：星火燎原》導演法蘭西斯勞倫斯(Francis Lawrence)執導

  。


  主要演員包含珍妮佛羅倫斯(Jennifer Lawrence)、連恩漢斯沃斯(Liam Hemsworth)、喬

  許哈契森(Josh Hutcherson)等人，以及最新加入的茱莉安摩爾(Julianne Moore)飾演第

  13區總統，與娜塔莉多莫(Natalie Dormer)飾演反抗軍領袖。


  《飢餓遊戲：自由幻夢Part I》劇情敘述，反抗軍在大旬祭上救走珍妮佛羅倫斯所飾演的

  女主角凱妮絲艾佛丁，比德（喬許哈契遜 飾）卻仍不幸落入都城手裡。


  凱妮絲來帶到傳說中已成廢墟的第13區，在反抗軍領袖和戰友支持下，銜命成為革命的象

  徵，領導施惠國各區叛變，對抗專制又腐敗的都城，同時傾力籌劃營救行動。然而， 隨

  著戰爭愈演愈烈，凱妮絲也逐漸察覺，遊戲根本從未結束，再度陷入充滿疑惑的困境。



  --'
