url: https://www.ptt.cc/bbs/movie/M.1436318953.A.BEF.html
title: '[新聞] 「飢餓遊戲」海報曝光 小珍妮佛變關公'
content: '新聞網址：




  「飢餓遊戲」海報曝光 小珍妮佛變關公


  2015-07-07 20:05:55 聯合報 記者項貽斐／綜合報導


  電影「飢餓遊戲」系列最終回「飢餓遊戲：自由幻夢2」的角色海報曝光，片中主角珍妮

  佛勞倫斯、喬許哈契森、連恩漢斯沃等的臉上都有代表反抗軍的紅色學舌鳥圖騰，一片殺

  氣騰騰，感覺一場激戰即將開打。


  「飢餓遊戲」系列電影已在全球創下23億美元（約台幣717億）的賣座，由於「飢餓遊戲

  ：自由幻夢2」是該系列的完結篇，備受影迷期待，片商也在聖地牙哥動漫展即將登場前

  ，先行發布最新角色海報，為影片造勢。只見片中反抗軍代表人物「凱妮絲」珍妮佛勞倫

  斯等人一字排開，表情嚴肅且堅定，就連「凱妮絲」的妹妹稚氣的臉上都有紅色學舌鳥圖

  騰，顯見反抗軍的決心。


  「飢餓遊戲：自由幻夢2」劇情進入最後關頭，施惠國的內戰開打，珍妮佛勞倫斯挺身對

  抗唐納蘇德蘭飾演的都城總統，並與從小一起長大的連恩漢斯沃等人攜手反攻。不過面對

  龐大的都城軍隊與險惡的總統，此次「飢餓遊戲」的危險比過去更為恐怖。


  山雨欲來的緊張氣氛反映在此次「飢餓遊戲：自由幻夢2」的角色海報，但看到這批帥哥

  美女的臉被紅色學舌鳥圖騰遮去大半，也有粉絲開玩笑說，他們是加拿大人嗎？因圖騰乍

  看像是加拿大的楓葉旗。


  --


  一些翻譯的圖



  --'
