url: https://www.ptt.cc/bbs/movie/M.1448022672.A.C0C.html
title: '[普雷]《飢餓遊戲：自由幻夢 終結戰》 '
content: '圖文網誌版 歡迎順手參觀指教給點牡蠣~





  從《暮光之城》開始，片商嗅到了原來青少年小說也是一個超級有利可圖的大餅，於是以

  《飢餓遊戲》為首的一票改編電影如雨後春筍般直冒出來。這些故事多半以年輕演員為主

  角，或身負使命、或家世不凡，一開始懵懂無知，後來才知道自己的與眾不同，挺身對抗

  烏托邦，戳破表面體制的虛假，過程中當然還要順便談場時間比例勝過正事的多角戀愛。

  飾演反派的「大人」則會邀來硬底子巨星抬轎，不過最後抬成功的轎子也沒有幾頂。


  雖說滿足青少年救世主幻想的作品從未少過，但不曉得為什麼，在好萊塢這波改編風潮裡

  ，真正能夠做到裡外兼具、既有好評價又有好票房的改編電影還真的沒有幾部。


  當然，直到今天，《飢餓遊戲》都還是箇中翹楚，實在賣得太好，也學起《哈利波特》，

  使出把最後一集拆兩集賣的招式，觀眾看來依舊買單。


  這系列的轉捩點應該是在第二集。雖然第一集憑藉著書迷和Jennifer Lawrence的超人氣

  魅力大賣特賣，但比起第二集導演改由《我是傳奇》的Francis Lawrence接手之後，第一

  集真的顯得沉悶又無趣。第二集的節奏感、刺激度、最後結局的安排都令人感到精神振奮

  ，期待後續真正擴展到史詩規模的戰爭究竟會如何發展。


  但是就在最後完結篇硬生生拆成兩半的情況下，第三集上半篇很尷尬地淪為「政治廣告拍

  攝教學」，雖然諷刺意涵濃厚，但幾乎所有的戰爭、轟炸都是以遠方的音效、震動，搭配

  一些意境來帶過，雖然很蒼茫、很無助、很灰暗，但是觀眾想看的想必不是這些東西，但

  也只能以「這只是上集、這只是鋪陳，Jennifer Lawrence很可愛、明年的完結篇一定很

  精采!」來安慰自己。


  那麼好不容易又等一年的完結篇是不是很「精彩」、充滿刺激的戰爭場面呢? 答案是: 沒

  有。整部電影彷彿又回到了第一集的慢節奏和拖沓，只有Katniss滿滿的內心戲、壓抑的

  氛圍、Peeta喃喃自語地回憶過去、依然十分蒼茫無助的眺望著遠方煙霧瀰漫的廢墟，然

  後完全不曉得都城和革命軍到底在打什麼東西。只看到Katniss Everdeen帶領著一批拍攝

  廣告小隊，走在空無一人的戰後街道，一邊躲避滿滿的陷阱(可是不是說前幾天前線部隊

  才剛推進的嗎?)，順便掙扎著自己應該要選擇哪一個男人，喔不對，是天真地想要混進都

  城官邸之中暗殺掉始作俑者。


  而這批主角小隊，就一路漫長的走著、偶爾碰上一點危機、犧牲掉新婚帥哥和幾個雜魚

  (Leeg姊妹花，你們的同伴後來數著犧牲者名單的時候完全忘了你們唷~ 好歹你們也被都

  城利用來當作Katniss死亡的煙霧彈呢……)，最後莫名其妙混進都城難民之中，只憑著帽

  T就妄想躲過最基本的安檢，而就在這時候，理應走在前面的反抗軍前線士兵突然之間現

  在才殺到，好不容易到來的些許戰爭場面，短短一陣交火之後，都城兩波玉石俱焚式炸彈

  攻擊，連帶Katniss擔任醫護隊的小妹都一起炸死了。


  其實結局很成功的帶出了戰爭的殘酷以及政客的算計，當初純粹為了保護妹妹挺身而出的

  Katniss一路上不只是Snow的棋子，當然也是反抗軍總統Coin的棋子，而Coin對於Katniss

  的安危本身其實也根本不怎麼在乎(所以也才會真的放任她這樣亂搞)，如果她真的把自己

  給搞死了，不管怎樣都可以轉化成激勵反抗軍士氣的素材。最後Coin把自己封上了個不知

  道要臨時到多久的「臨時大總統」、承諾了一個「等到民眾準備好才會舉辦」的「民主」

  選舉甚至也想要舉辦「飢餓遊戲」以牙還牙，對歷史有些熟悉的觀眾朋友想必頓時都會有

  種「狗去豬來」的感覺吧。


  只不過這些複雜的政治算計畢竟沒辦法著墨太多，說起來也沒啥張力，甚至有些一廂情願

  ，反正只要通通怪罪一到兩個人就可以輕鬆解決，那麼我們就把那支箭射向Coin的心臟吧

  ，乾淨俐落。有趣的是，都城和反抗軍都先後爭相把Katniss捧成自己的政治明星，而到

  頭來這位被自己捧出來的政治明星都回過頭來搞死了自己。


  理論上來說應該連服藥都來不及就會被當場射殺的Katniss十分幸運的在Plutarch安排之

  下返回故鄉，做回她原本的純樸鄉間獵人少女。只不過，兒時的青梅竹馬在仕途上飛黃騰

  達、母親持續奉獻醫護專業、當初沾染一身煙硝的理由也已經不在這個世界上，整棟大宅

  只剩下自己一人，直到這時候她才終於崩潰痛哭，到底自己轉了一圈改變了什麼? 到頭來

  ，這個世界、都城的政治雖然好像才剛經歷了驚天動地的革新，但又好像什麼都沒有改變

  ，偏偏只有自己的家鄉人事已非。


  其實Gale是個好人(發卡)，但同時他更是一個好軍人，所以在價值觀上他或許注定是要跟

  Katniss分道揚鑣的，或許也只有同樣身心受創的Peeta可以和Katniss互舔傷口，遠離世

  間的一切塵囂。


  不過冗長無聊的全片看到最後，其實還是會令人忍不住像Peeta一樣問一句。


  「這部電影終於結束了，是真的還是假的?」


  「是真的。」


  太好了。



  --

  段譽一見之下，身上冷了半截，眼圈一紅，險些便要流下淚來，心道：「人道習主席是人

  中龍鳳，果然名不虛傳。馬先生對他如此傾慕，也真難怪。唉，我一生一世，命中是注定

  要受苦受難了。」他心下自怨自艾，自歎自傷，不願抬頭去看馬先生的神色，但終於忍不

  住又偷偷瞧了他一眼。只見他容光煥發，似乎全身都要笑了出來，自當選以來，從未見過

  他如此歡喜。兩人已走近身來，但馬先生對段譽視而不見，竟沒向他招呼。段譽又道：「

  馬先生心中從來沒有我這個人在，從前就算騙我投票給他，心中也只有他主子。」


  --'
