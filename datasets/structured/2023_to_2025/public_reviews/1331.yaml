url: https://www.ptt.cc/bbs/movie/M.1448004666.A.10A.html
title: '[好雷] 飢餓遊戲:最終章 戰爭的沉重'
content: '我1.2集只看電影


  最後一集有看小說


  看小說時沒有電影來的沉重


  也有可能最近的一些社會事件影響了我


  對我來說  當初看小說時


  作者感覺把重點放在描述那些致命的陷阱


  給我一種很重的科幻感


  但今天看電影的時候  每當有角色死亡


  我感受到的是生命的渺小  一個小小的動作


  就能奪走一個人的性命


  或許是我個人投入的情感太多


  但一些配角的互動  都讓我想到戰爭的殘酷


  從姐妹被炸彈轟炸  到下水道無聲人兄弟間的牽絆  和最後小孩的死亡


  戰爭從每個人身邊奪走多少人


  讓我在看電影時  心裡有些沉重


  以上都是我個人的感受  或許導演可能沒有要說這麼多  都是我的自作多情XD




  總結來說 我很喜歡這部電影


  給我了一些反思  陷阱的效果也還行


  但應該是可以不用看3D


  對於結局我沒太多的感受


  畢竟要給受盡苦難的主角 一些歸屬


  然後那一箭深得我心XD




  感謝大家看完充滿個人情感的心得~







  --

  我也是個感性的人XDD'
