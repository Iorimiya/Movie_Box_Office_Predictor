url: https://www.ptt.cc/bbs/movie/M.1416770879.A.57D.html
title: '[負雷] 政治角力+戲中戲的飢餓遊戲3-1'
content: "--------防雷------\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n-------\n\n\
  今天看完飢餓遊戲3-1最大的感想就是拖拖拖\n\n整部戲怎麼可以拖到一個讓人無奈地囧境\n\n前面開頭半-一小時就是緩慢的鋪陳\n\n加上後面根本就毫無爆點的結尾\n\
  \n讓我給這部片一個負雷\n\n比起哈比人1也是緩慢的不行的節奏\n\n至少哈比人1還有漂亮的風景\n\n飢餓3-1只有地窖地窖地窖地窖地窖地窖....成本有沒有這麼低阿....!!!\n\
  \n全片最多的時間就是在戲中戲 - 當然這引導出最後人民的反叛怒火\n\n但是真的很拖戲阿\n反正就是地窖->現場場勘->拍戲->彼得出場->地窖->場勘->拍戲\
  \ LOOP...\n加上中間根本沒甚麼爆點\n(1.一箭射爆飛機讓飛機撞爆大樓壓爆醫院...厄...)\n(2.回老家聽故事...去河邊唱歌...)\n\n\
  中間去打獵那段我整個無法理解\n\n戰爭中為什麼還可以去外面閒晃約會阿  而且你的男人不是還在首都嗎???\n(友:這邊其實是要點出不濫殺無辜...吧\n 我:???\
  \ 有需要特地加這一段嗎?? 應該就是要拍女主角腳踏兩條船吧...\n 後面女主角亂叫我要失去他們兩個了嗎?!?!?!我想應該可以證實我的想法吧...)\n\n\
  LOOP完被轟炸  地窖地窖地窖...妹妹亂搞插曲  無爆點可言  整個老梗\n最後營救...\n整個就是陷阱  老梗到不行  無爆點可言...\n最後莫名的就救出成功\
  \ - END - WHAT?????\n\n只能期待說3-2可以說明清楚了吧\n\n但是3-1...回家看就好啦  整部簡單來說就是在說明 鋪陳...\n\n\
  整片重點\n1.打爆飛機(難民視學舌鳥為精神領袖)\n2.唱上吊樹歌(引發農民自爆A(大壩)+B(地雷)片段)\n  ....順便說一下這跟大壩那邊活屍沒兩樣的堆屍法是哪個白癡想出來的片段...\n\
  3.營救(轟炸那段整個悶啊  頂多就是女主角玩貓玩出心得\n       ... 總統很狡猾厲害(我的理解是這樣)  這心得到底有多困難啊??)\nEND............................................................\n\
  \n\n\n\n\n\n\n\n\n--"
