title: '[好雷] 飢餓遊戲前傳'
content: '雷文防雷資訊頁(不過其實沒什麼雷)




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





















  整體來說，算是讓人思考許久的好片,不帶有硬式說教的成份

  會讓你自己思考


  飢餓遊戲正傳四部都在電影院看過,覺得遊戲只是其中一個小插曲，重點

  都不在遊戲本身,而在背後的育意


  前傳以史諾當主角,也間接的洗白了他？ 至少之後正傳所做的一些事情

  算是合理了,當下如果你是史諾,應該也是這樣子吧?


  第三章的轉折真的頗快,男女不是要私奔嗎? 怎麼一個轉身就變成彼此的不信任?

  後來發現似乎小說也是這麼快的轉折


  他們凌晨約在吊人樹要私奔,經過一個小木屋 balabala .... 搞了一堆事後

  (被蛇咬、去沈槍)


  史諾回到部隊,竟然完全沒人發現他離開過一陣子,可見部隊管理之鬆散,不在營這麼久

  都不會被發現的(這算挑毛病嗎?)


  也許是因為有看過正傳四部，所以新的女主角我一直沒有對她很融入


  另外,這個時代背景設計真的很妙,有視訊電話,但是錄音是用八卦鳥實體錄音...


















  --'
