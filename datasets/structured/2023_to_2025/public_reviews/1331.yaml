url: https://www.ptt.cc/bbs/movie/M.1448075176.A.833.html
title: '[好雷] 飢餓遊戲-自由幻夢II'
content: '飢餓遊戲-自由幻夢電影版是目前以來我看過把原著小說拆成上下二集最成功的例子了，

  有效地緩衝了第十三區反抗軍勢力帶入劇情以及戰後布局內部派系矛盾的兩部分，少了當

  初讀小說跟不上劇情轉折的突兀感，在我心中從原先以為爛尾的作品竄升成了想回味再三

  的好片！



  就我個人口味而言，飢餓遊戲這系列從一到三上就是部英雄主義的科幻小說而以，充其量

  就是飢餓遊戲本身目的及設計的新穎性，可是三部曲自由幻夢加入了大量我所熱愛的政治

  鬥爭元素XD，電影版切割成三下又使其比重提昇，讓我決定動筆寫下一點點的觀後心得，

  這個心得不會涵蓋全面劇情，只會著重在部分（我所熱愛的）元素上。



  先讓我們用粗淺的知識提幾個熟知的東西方故事。在台灣少數以西方人士命名道路的美國

  麥克阿瑟將軍，與時任總統的杜魯門的摩擦，為什麼讓五星上將在韓戰後被解職；以及中

  國古代助漢滅楚的韓信，在劉邦戰後布局的下場。



  回到自由幻夢電影下集中，在十三區領導人柯茵（Coin）總統將情況尚不穩定的比德（

  Peeta）送到前線明星小隊中時，原先稍為隱晦的意圖，直接由小隊長博格斯（Boggs）向

  凱妮絲（Katniss）點破：儘管戰後的總統選舉凱妮絲無意與柯茵競爭，但只要她對於公

  開表示支持柯茵有一絲猶豫，就會被視為威脅。儘管這時我們不受控制的主角凱妮絲清楚

  這點，她仍只想對施惠國（Panem）的總統史諾（Snow）復仇，只要她們推翻現今政權的

  目標一致就仍是同盟。這裡要特別提一下十三區領導人性別的設定，女性領導除了強化十

  三區叛軍全民尚武的形象外，更突顯和故事女英雄凱妮絲的衝突感。（不然直接找白袍薩

  魯曼來演就好啦，何必特別弄個女版薩魯曼～從上集就覺得真的很像XD）。



  接著，明星小隊用犧牲帶觀眾們回味飢餓遊戲的殺戮，過程中幾個強制收看的節目非常有

  意思，原本計畫為反叛軍拍攝宣傳片的明星小隊，他們疑似全滅的畫面反倒成了都城方的

  題材，而這也是雙方領導人唯一共同期待的事件，還沒察覺柯茵這角色的史諾大肆用以撫

  慰都城百姓，柯茵則得到了最想要的劇本，不和學舌鳥起正面衝突、意圖用紀念來承攬她

  的聲望。（一旁全看在眼裡的前任遊戲設計師普魯塔克（Plutarch）表情更是一絕，千萬

  不要因為很像蔡康永就出戲啊！）



  模仿飢餓遊戲複習本日陣亡名單的模式，重提了明星小隊內成員的出身，最後的倖存者除

  了凱妮絲和她的後宮比德&蓋爾（Gale）外，就全剩來自都城的人了，除了不可或缺的嚮

  導功能外，更藉此著重刻劃都城的平民們，以求與都城權力中心的形象脫鉤。雖然派對遊

  行般的難民們與避難的既定形象有強烈的反差，透過與凱妮絲視線交會的嬰兒這角色重新

  強化了平民們的無辜。官邸前從天而降、嫁禍給史諾的炸彈，催毀了無數無辜的百姓；蓋

  爾在第二區作戰會議上提出的第二顆炸彈，試圖無差別殲滅更多的人，卻意外地也奪走了

  反叛軍人道醫療團成員、凱妮絲妹妹櫻草花（Primrose）的性命，多麼的諷刺啊！凱妮絲

  從整系列之初就是為了保護妹妹櫻草花才自願代替其參加飢餓遊戲，（妹妹超早就被插旗

  了啊！），與史諾的種種恩怨都起因與此，想想所有為了她的不受控制而造成的犧牲，她

  不僅沒成功向史諾復仇、對局勢毫無影響，更親眼目睹妹妹的死，徹底地打醒了凱妮絲。

  前面劇情雖已多次點出蓋爾的觀念已偏向激進，最初承諾要保護她妹妹的蓋爾卻反倒成了

  死亡推手，在這次實際的行動得到默認後，凱妮絲終於說出了再見蓋爾！歹戲拖棚的後宮

  劇終於落幕！



  戰後由柯茵和歷年飢餓遊戲勝利者們組成的史諾處置會議上，柯茵宣布自封無限期的臨時

  大總統，以及再次舉辦飢餓遊戲的提議具體呈現了她的作風，儼然下一個史諾，眼裡不再

  只有復仇的凱妮絲於是提出了由她處決史諾的條件交換支持，最有趣的就是不再用酒精麻

  痺自己、擔任清醒者角色的黑密契（Haymitch）說出的答案不是贊成或反對舉辦而是支持

  學舌鳥的決定，到這裡劇尾的劇情已全然而出。處決總統當天，（由溫嵐飾演的）凱妮絲

  視線望去的史諾和柯茵二人，柯茵不僅沒有承接凱妮絲的聲望，更是繼承了史諾總統的形

  象（柯茵設定為白袍薩魯曼的造型也是為了和史諾的白色形象連結吧！）。刺殺柯茵後，

  憤怒民眾唯一的反應是要親自去處決暴君史諾，沒人關心為何成為刺客的凱妮絲以及倒在

  地上、原將成為下一個史諾的柯茵，柯茵死亡當下的淒涼，也印證了對凱妮絲的種種權謀

  在柯茵自身的鋪路上是絕對必要的。



  其實戰爭在占領第二區之後就局勢已定，攻陷都城只是早晚的事，柯茵也計畫不再讓凱妮

  絲現身，只留下她激勵反叛勢力的形象與效果，但故事花了大篇幅描寫明星小組，別忘了

  這是柯茵要納凱妮絲的不受控制為反抗軍原訂計畫下的產物，我一直很喜歡小玫瑰（演員

  在權力遊戲中的角色）攝影小組帶來的效果，很刻意地將塑造英雄形象的彆扭感呈現出來

  ，前兩部曲中藉由遊戲轉播為由，凱妮絲學舌鳥形象的散布得到了合理的管道，但在反叛

  軍勢力就顯得突兀。原本預計營救比德的柯茵和選擇凱妮絲的不受控制的普魯塔克，各懷

  鬼胎的對手戲也是精彩。因前期局勢需求，柯茵不得不依賴凱妮絲這道雙面刃，有目的地

  將學舌鳥的形象傳遞出去，但也加深了凱妮絲的自主意識，雖然小隊所有的犧牲對於刺殺

  史諾、推翻政權沒有任何直接貢獻，卻也即時地在民眾意識到柯茵為人前、專制底定前刺

  殺了下一個史諾的誕生，避免了多年後下一場內戰的發生，故事終究還是要以英雄主義方

  式做結。



  凱妮絲與金鳳花和解一幕，再次強調捲入眾多詭譎局勢的凱妮絲，她的初衷只是要保護妹

  妹櫻草花，經歷了這麼多卻仍是徒勞……幸好多年後的草原上，美麗的天倫樂畫面重新給

  了凱妮絲可以去保護、珍惜的一切，



  --


  感謝樓下angelma板友回答囉！'
