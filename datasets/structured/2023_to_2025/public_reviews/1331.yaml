title: '[好雷] 飢餓遊戲/沉默的雙眼'
content: '兩部片我都給好雷，就發在同一篇寫一個簡短的小心得～





  以下無雷心得






  飢餓遊戲：


  我看過小說，所以對劇情都知道，當看到那畫面呈現的時候，真的覺得拍的很棒。


  沒看過小說的人，一定會對結尾感到失望，因為整部電影是這麼的有張力，

  可是結尾如同小說一樣，非常平靜又溫和的結束所有。


  我覺得很感動，而且珍妮佛勞倫斯這集真的很正。






  沉默的雙眼：


  平鋪但不直敘，過去和現在反覆交疊，就算過了13年，都還是一樣，走不出忘不掉


  有猜到大概，但看到後面那段，還是覺得雞皮疙瘩都起來了。








  --

  So maybe tomorrow

  I''ll find my way home


  --'
