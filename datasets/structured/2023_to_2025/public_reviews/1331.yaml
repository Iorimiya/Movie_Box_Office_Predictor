url: https://www.ptt.cc/bbs/movie/M.1448300480.A.927.html
title: '[好雷] 飢餓遊戲：自由幻夢終結戰與政治現實'
content: "--- 《高譚市 Gotham》Season 1, episode 4\n\n\n\n其實《自由幻夢》上集自己就覺得不錯了，到了下集果然有值得。最盛大的一次飢餓遊\n\
  戲，以攻城戰的形式開展出來。倒是很自制的限縮在女主角的觀點，不是從權力核心的\n角度來看這場大戰，我喜歡這個方式。\n\n\n看起來當反抗軍攻陷第2區的要塞，Snow總統已經準備投降了。畢竟兵臨城下，識時務者\n\
  皆見大勢已去。然與其敞開大門讓敵軍長驅直入，不如佈下星辰般的膠囊詭雷做困獸之\n鬥，挫挫反抗軍的銳氣，也避免屠城的可能。而作為反抗軍首領的Coin總統，第2區要塞\n\
  的作戰會議上，她已表現出不擇手段的強勢態度。要不是Gale想出山崩戰術，她可能真\n的會命令第2區的作戰小隊進入山洞裡送死。\n\n\n從結果論來講，Katniss在要塞的緊急出口面對降者演講之後，其它時間根本不用做什麼\n\
  事，Snow的政權也能被扳倒。所以為什麼創作者（原作者也好，這集的導演和編劇也罷\n）為Katniss經營了那麼多的痛楚（兩屆飢餓遊戲、Peeta被洗腦、家園被摧毀），讓她\n\
  非去都城殺Snow不可，到底我們要看的是什麼？\n\n\n上集我們看到的，是處於反抗軍權力核心的13區，Coin在13區的樣子是個臨危不亂、當\n機立斷的領導人。除了女主角參與的「宣傳片之戰」，我們看不到太多Coin在戰場上的\n\
  佈局，是直到這集我們跟著Katniss偷跑到前線，才會看到Coin的另一面：疾風暴雨、草\n菅人命、邀名射利、過河拆橋。\n\n\n「我都不知道我對她有這麼重要。」Katniss所在的明星小隊疑似戰死，Coin直接收割\n\
  Katniss的努力，在螢幕上哽咽扮演心疼的元首，也為自己接下來對都城的猛攻合理化。\n創作者不僅在這場戲將媒體的反諷推展到極致，也呈現出Katniss而言只是Coin用來打媒\n\
  體戰、經營形象的工具。所以當戰事結束，失去至親而悲痛的Katniss從Snow口中得知真\n相，進而做出最終的選擇，一切都有了說服力。\n\n\n那些不必要的犧牲，那些可怕的陷阱，那些因為立場反目的同胞，或者是榮華不再的斷\n\
  垣殘壁，正因為不是在權力核心，這一切看起來才會這麼荒謬。爭權奪利的政治鬥爭，\n演變成生靈塗炭的無情戰火，戰場上有血有肉的人類被當成不會思考的棋子，受害的永\n\
  遠是底層人民。也無怪Katniss自責隊友的犧牲，其他人還坦承跟隨的意願，比起Coin的\n兩面手法，至少大家願意相信一個衝動卻誠實的人。「學舌鳥（Mockingjay）」的魅力\n\
  ，莫過於此。\n\n\n「自由幻夢」一詞，表示在政治權利的角力之下，所謂爭取自由的理想也不過如幻似夢\n。不得不去承認這種政治現實，在台灣不管社會運動的理由多麼正當，只要被媒體抹上\n\
  特定政黨的色彩，就很容易被模糊焦點，更不可能將自己的訴求真正溝通出去。在媒體\n上要去操縱仇恨和喜好，太容易了，只有事件的關係人和有解讀能力的閱聽眾，才會知\n\
  道事情真正的樣貌是什麼。\n\n\n故事到了尾聲，施惠國選出一個理性之聲，不再有壓迫的政治環境。現實真的會這樣嗎\n？我無法這麼樂觀。我另外覺得其實在Peeta回到第12區，Katniss終於跟他同床共眠的\n\
  時候就可以結束，不需最後過於美好的幸福景象。兩人經過3個故事、4部電影的動蕩不\n安，終於可以好好睡上一覺，這種革命情感不就是幸福本身？\n\n\n顯然原作者認為最後一段獨白還是很重要，好萊塢也一定要給觀眾一個明確的「希望」\n\
  才行，滿可惜的。\n\n\n一向不喜歡寫好萊塢大片，厲害的文章太多，動筆太慢更顯得自己目光如豆。然而對於\n一部喜歡的電影，還是想多嘴一番。創作者對於民主的觀點有點太正面了，請容我引用\n\
  紀錄片《第四公民》裡，Edward Snowden的話來表達我的看法：\n\n\n\n\n\n\n\n\n很棒的政治理想，希望哪天我們能讓它變成現實。\n\n\n\
  \n--\n真性情男孩，深度沒有，只有電影。\n                   讀電影，愛電影，用電影崇拜電影。\n\n部屋: \n部屋: \n\n--"
