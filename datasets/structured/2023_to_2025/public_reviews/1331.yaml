url: https://www.ptt.cc/bbs/movie/M.1448119647.A.00D.html
title: '[無雷] 飢餓遊戲'
content: '看完覺得很感慨，決定來po個感想抒發一下。


  當反烏托邦題材成為氾濫，飢餓遊戲依著他最穩當的步伐走到了終點。面對一個系列的完結，就如同電影結局般，給人滿滿的惆悵之感。


  從拍很爛的第一集、讓人拍案叫絕的第二集、不太知其所云的第三集上半、到總算塵埃落定的下半，場景從競技場、進入都城，隨著劇情的進展，電影不斷的告訴我們有一種殘酷叫做怨怨相報、自相殘殺，我們眼睜睜看著悲劇即將發生，卻無能為力。人們明明知道問題所在，卻不斷踏入輪迴。


  這就叫做戰爭，叫做權慾。


  現正發生當中，很多人就是活在一場被操控的遊戲當中，生、死從來都不是自己可以決定的。無常的時局中，芸芸眾生也只是一枚枚上帝安排好的棋子，祂什麼事情都做好了，也都不打算做，冷眼旁觀而已。


  很多人對於電影結局抱持疑慮，我自然覺得這樣收尾最好。因為一部忠於原著的作品，就該如此。歸根結底，理想世界不需要英雄，因為人從平凡裡來，就該回到平凡去。塵歸塵，土歸土，這才是人生。


  -----

  Sent from JPTT on my HTC Butterfly.


  --'
