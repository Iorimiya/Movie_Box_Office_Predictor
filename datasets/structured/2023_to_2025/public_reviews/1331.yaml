content: "剛剛有爬文看到同樣的問題\n\n  但是我想要確認的是   畢竟花錢進戲院了  所以我想要有的是\n\n  第一  要有大螢幕的爽度  看DVD絕對比不上\n\
  \n  第二  本身不大會在乎哪裡劇情不大合理  只要不要太誇張即可\n\n  第三  不要悶  不要太多腦補\n\n  第四  我只看過飢餓1   2沒看過\n\
  \n  這樣的前提下  哪部大家比較建議???\n\n  先非常感謝大家的建議\n\n--"
