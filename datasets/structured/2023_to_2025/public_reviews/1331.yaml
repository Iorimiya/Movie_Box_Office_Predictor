url: https://www.ptt.cc/bbs/movie/M.1764346775.A.FEA.html
title: '[新聞] 名導昆汀批《飢餓遊戲》抄襲日片《大逃殺'
content: "名導昆汀批《飢餓遊戲》抄襲日片《大逃殺》\n\n\n《飢餓遊戲》劇照。(圖/ CatchPlay提供)\n\n【大紀元2025年11月28日訊】（大紀元記者葉子杰編譯報導）昆汀‧塔倫提諾除了是一位\n\
  導演，也是一位資深影迷。最近，昆汀在廣播節目中批評《飢餓遊戲》小說及其電影系列\n抄襲了他喜歡的日本動作驚悚片《大逃殺》，並認為日本作家應該要提出告訴。\n\n\
  當地25日，62歲的金獎導演昆汀‧塔倫提諾（Quentin Tarantino）接受《Bret Easton\nEllis》的廣播節目採訪時，列出了他心目中21世紀至今最佳的20部影片，其中包括大導\n\
  演史蒂芬‧史匹柏（Steven Spielberg）的《西城故事》（West Side Story，2021）以\n及《大逃殺》（Battle Royale，2000）。但他不客氣地批評了《飢餓遊戲》（The\n\
  Hunger Games，2008）小說作者抄襲了《大逃殺》這部經典之作。\n\n對於那些不熟悉《大逃殺》的人來說，該片講述的是一群國中生被迫在日本極權政府的統\n\
  治下進行生死搏鬥的故事，改編自日本作家高見廣春的同名小說。談到《飢餓遊戲》系列\n和《大逃殺》的雷同之處，昆汀不滿地說：「我不明白，日本作家怎麼沒把《飢餓遊戲》\n\
  作者蘇珊‧柯林斯告上法庭，把她所有東西都告了。」\n\n昆汀繼續說：「他們根本就是抄襲了這本書。那些愚蠢的書評根本沒去看一部叫做《大逃\n殺》的日本電影，所以書評才沒揭穿這點，他們還說《飢餓遊戲》是他們讀過最有創意的\n\
  作品。結果，電影評論家們一看電影就說了：「這根本就是《大逃殺》，只不過是輔導級\n（PG）！」\n\n據《World Of Reel》報導，《飢餓遊戲》和《大逃殺》之間的相似點被討論得很熱絡：\n\
  青少年被強迫互相廝殺、政府作秀、電視轉播暴力、反烏托邦的背景等等。很多評論文章\n都說，這些雷同之處根本不像巧合，就算不是故意的也太相似了吧。\n\n柯林斯本人知道《大逃殺》嗎？2011年時，柯林斯在一次訪談說她根本不知道《大逃殺》\n\
  ，無論是書還是電影。柯林斯說：「在我的書稿交稿之前，我從來沒聽過那本書或那作者\n。那時有人提到這本書，我問我的編輯要不要讀一讀，他說：『不要，我不要讓那個世界\n\
  跑進妳的腦子裡，繼續照妳自己的想法寫就好。』」\n\n責任編輯：蘇漾\n\n\n\n--\n 神韻晚會觀眾反饋（2025）\n\n--"
