url: https://www.ptt.cc/bbs/movie/M.1416926522.A.9FB.html
title: '[新聞] 飢餓遊戲續集 全球票房佳'
content: '（中央社記者鄭景雯台北25日電）「飢餓遊戲：自由幻夢I」上週末北美票房高達1億2300

  萬美元， 在全台票房也累計有新台幣6000萬元的好成績，勇奪票房冠軍。


  「飢餓遊戲：自由幻夢I」締佳績，在美國票房超越「變形金剛4：絕跡重生」，一舉成為

  今年度首週票房冠軍。


  電影同時在北美以外85個國家地區上映，全球海外票房累計1億5200萬美元，比上集「飢

  餓遊戲：星火燎原」票房高出4%。


  台灣也與美國同步上映，吸引大批飢餓迷捧場，週末台北票房新台幣2640萬元，是11月目

  前為止首週賣座最好的電影，全台票房也累計有新台幣6000萬元的好成績，勇奪票房冠軍

  。


  片中女主角珍妮佛勞倫斯，雖然曾在「派特的幸福劇本」裡大秀舞技，並在「瞞天大佈局

  」中瘋狂對嘴表演，但她其實對跳舞和唱歌毫無自信，謙稱歌喉極糟的珍妮佛勞倫斯，這

  次必須在電影中演唱「吊人樹之歌」。


  她當初抗拒好久，在導演堅持下，不得不在眾人面前清唱。這是「飢餓遊戲」珍妮佛勞倫

  斯飾演的凱妮絲父親在世時常哼唱的歌曲，由美國民謠搖滾樂團「魯米尼爾」根據原著小

  說歌詞譜曲，搭配珍妮佛質樸真摯的詮釋，許多影迷看完後，紛紛表示這首歌盤旋在腦海

  中揮之不去，已被這首歌徹底「洗腦」。


  新聞網址：


  --'
