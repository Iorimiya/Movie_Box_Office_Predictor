url: https://www.ptt.cc/bbs/movie/M.1416581133.A.920.html
title: '[大負雷] 飢餓遊戲三 文宣幻夢 '
content: '身為第一集跟第二集都看的忠實飢餓遊戲粉絲


  對第三集簡直失望透頂惹


  如果說第一、第二集的核心在於Hunger game


  那第三集的核心就在怎摸拍出好的競選文宣紀錄片


  喔不 是革命宣傳片


  本部有七成時間圍繞著拍出好看又吸引人的文宣片及特寫中二貓草的側臉


  兩成時間特寫其他人


  一成時間拿來推進劇情，演完了還是沒開戰


  看來第三部至少要拍三集




  絕對是部看完會讓你高喊 what the fuck 的電影


  千萬不要錯過


  看完一定讓你疑惑 我到底看了三小? 的最新強檔


  看了兩小時大家慷慨激昂的喊話，發現劇情根本沒前進


  (好啦 有前進一小點 )


  看邪教教主中二貓草怎麼催眠出一大堆自殺炸彈客轟炸水壩


  看最精彩的片段，已經在預告片就演完的強檔續集大作


  準備好接受 滿滿疑惑、滿滿懊悔 走出電影院的衝擊


  到底在演三小 騙錢騙太大了啦!!!!!!!


  補個幹(?)


  --'
