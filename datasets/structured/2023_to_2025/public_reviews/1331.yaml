title: '[ 負雷] 失望透頂的飢餓遊戲最終章'
content: '前陣子電視播出時把前面兩集一起複習了一下


  如今再來看最終章的上下兩集


  根本除了失望還是失望


  一口氣看完也沒比較爽


  反而搞不懂裡面的角色感情戲都還沒烘托到高潮就直接跳轉


  剪接的很難讓我融入他們抗戰的情感裡


  角色賜死的也雞肋


  結局猜得到卻沒有什麼霸氣boss的感覺


  反而讓人覺得 蛤？就這樣？


  沒了



  總之 很難看


  結束


  --'
