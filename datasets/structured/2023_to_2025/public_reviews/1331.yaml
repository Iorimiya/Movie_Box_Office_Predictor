title: '[新聞] 昆汀宣稱[大逃殺]作者應該告死[飢餓遊戲]'
content: "新聞網址：\n\n\n\n   Quentin Tarantino Blasts ‘Hunger Games’ for Ripping Off\
  \ ‘Battle Royale’\n as He Starts to Reveal 20 Best Movies of 21st Century: How Did\
  \ Suzanne\nCollins Not Get ‘Sued for Every F—ing Thing She Owns’?\n\n\n\n    昆汀塔倫提諾說他認為最偉大的21世紀20大電影之一就是[大逃殺]\n\
  \n\n    同時認為大逃殺電影導演和原作應該告死蘇珊柯林斯(飢餓遊戲作者) 因為整部飢餓\n\n\n  遊戲很明顯他媽的都是抄的\n\n\n    Tarantino\
  \ noted the similarities between “Battle Royale” and “The Hunger\nGames,” the book\
  \ and movie franchise started by author Suzanne Collins. The\nfilms more or less\
  \ share the same plot set-up, which is why Tarantino can’t\nbelieve the “Battle\
  \ Royale” team did not sue Collins.\n\n“I do not understand how the Japanese writer\
  \ didn’t sue Suzanne Collins for\nevery fucking thing she owns,” Tarantino said.\
  \ “They just ripped off the\nfucking book! Stupid book critics are not going to\
  \ go watch a Japanese movie\ncalled ‘Battle Royale,’ so the stupid book critics\
  \ never called her out on\nit. They talked about how it was the most original thing\
  \ they’d ever fucking\nread. As soon as the film critics saw the film they said,\
  \ ‘What the fuck!\nThis is just “Battle Royale” except PG!'”\n\n\n\n    昆汀批評說飢餓遊戲根本就只是把18禁的大逃殺改良成青少年版\n\
  \n\n    同時說他和已故的知名導演深作欣二是好友\n\n\n\n\n\n\n   -------------------------------------------------\n\
  \n\n\n\n\n   這個如果告能告成會賺翻吧\n\n\n   畢竟大逃殺這類型這麼多 電玩應該也全部告一告??\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n--\n  [電擊文庫護航艦隊 艦長資格遴選簡答題]\n  14.請從以下6部作品中找出一個共同點 並由此共同點選出一部電擊文庫的小說\n  -->1.擅長逃跑的殿下\
  \     2.鄰座的怪同學  3.偶像大師系列\n     4.肯普法             5.心之谷        6.LoveLive!虹咲學園學園偶像同好會\n\
  \n   這題難度有點高 給你們一個小時的思考時間 P.S:回答作品的同時須回答共同點為何\n\n--"
