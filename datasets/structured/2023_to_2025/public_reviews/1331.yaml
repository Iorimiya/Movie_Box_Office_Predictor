url: https://www.ptt.cc/bbs/movie/M.1447525068.A.9F8.html
title: '[專欄] 幕前幕後兩三事：《飢餓遊戲》（2012） '
content: "【幕迷影評】電影知識 專欄分享\n\n\n[知識] 幕前幕後兩三事：《飢餓遊戲》（2012）\nby 壕G\n\n\n網頁版文章（有圖文解說）：\n\
  \n\n\n重新看過自己當初寫的《飢餓遊戲》（The Hunger Games）影評，倒是發現以前的自己是\n現在的自己討厭的那種人。嗯該怎麼說......？有種「對啦對啦你講的都對」但又一點也\n\
  不討喜「幹嘛我平常壓力夠大了還要看你哭夭歪歪叫」的那種感覺？好吧，每個過去的自\n己在現在看來都是愚蠢的。其實現在的自己也沒多討喜就是啦......（難過\n\n\
  首先文章剛開始先來暖身一下\n\n\n\n\n\n\n一、薪酬議題\n\n這陣子好萊塢傳起了一股討論男女薪資不平等的問題，不少女演員出聲為自己在業界中同\n工不同酬的現象抱不平，但反過來看男演員們倒是都說不上幾句正經話，要嘛打哈哈帶過\n\
  不然就是附和個一兩句表示贊同但並沒有提出特別的男性觀點。也是啦，如果有錢人站出\n來說其實我們並沒有賺很多啊那一定會被丟雞蛋的。\n\n女性演員的代表人之一，珍妮佛勞倫斯，他是目前最具有語言力量的女演員，因為她的存\n\
  摺數字會比任何A片都容易讓人高潮，而我每次看自己存摺就像讀史蒂芬金的小說一樣恐\n怖（《菜鳥新移民》的梗喔齁齁）。如果就連賺最多的女演員都出現不平等狀況，那你叫\n\
  三流女演員們該如何是好？\n\n時間回溯將近五年前，劇組為了女主角凱妮絲找上了珍妮佛，當時的合約價碼是五十萬美\n元。為了這個合約珍妮佛思考了三天的時間，她考慮過這部小說的超人氣女主角日後將帶\n\
  給她人生以及演藝事業的影響，也考慮過這五十萬美元（好啦幫你算一下大概是一千五百\n萬台幣算錯別怪我因為我文科的數學學測只有3級分）可能會如何改變他的未來，我是不\n\
  清楚他是因為錢太多怕被車撞所以不敢接還是錢太少覺得想冰的，但絕對沒人想到他在下\n一部《飢餓遊戲：星火燎原》（The Hunger Games: Catching\
  \ Fire）價碼飆升到千萬美\n元，噢台幣大概是......我可以不要算嗎？\n\n這價格一炸裂再也沒有人可以忽視她的存在，此外因為《X戰警：第一戰》（X-Men:\n\
  First Class）超級好看、還有《派特的幸福劇本》（The Silver Linings Playbook）讓\n她在紅毯階梯上有如神助般跌了個颯爽的一跤、然後駭客肆虐使得她和一堆人的半裸照被\n\
  公開但他老大姐一臉無所謂，這些種種因素加起來觀眾對他的好感無限上揚，自然也登上\n了女星榜天下第一咖之位。還有最重要的，他告訴全天下女孩就算你不是天生就超級漂亮\n\
  還是可以變得超級漂亮，只要你別長得跟一般的超級漂亮一樣然後做一些跟超級漂亮的人\n沒關係的事就行。\n\n\n\n二、小珍珍與哈契遜\n\n喬許哈契遜曾經在好萊塢新聞「E!」的採訪中透漏，有次他和珍佛（珍妮佛勞倫斯被簡稱\n\
  為J-Law，那我就給他中文簡稱珍佛）鬧著玩，珍佛告訴他說：「我可以踢很高喔！而且\n高過你的頭喲！」哈契遜當然是冷笑不當真，珍佛則是試圖踢給他看，哈契遜就站著要她\n\
  踢踢看。也不知道珍佛是太有自信還是她其實真的可以踢很高，她就這麼猛力往哈契遜頭\n上一掃，給他掃了個颯爽的腦震盪。\n\n哈契遜表示，他從小到大有發生過很多次造成腦震盪的意外，所以當那一腳掃過來後他既\n\
  馬上知道自己的腦袋發生什麼狀況。當下珍佛不知所措地哭了出來，劇組也請來了腦神經\n醫師前來幫哈契遜做了個檢查，所幸最後診斷結果是輕微的腦震盪，但醫生還是建議他休\n\
  息個幾天再繼續工作。\n\n啊哈哈哈…當時珍佛21歲哈契遜19歲，兩個猴囡仔。\n\n話說回來，珍佛本來是金髮，為了凱妮絲染成棕髮；而哈契遜本來是深色髮，反倒染成。\n\
  還有他們倆個都是肯塔基人，而肯塔基正好如同第十二區一樣，是屬於比較鄉下貧瘠且以\n礦坑為主要經濟來源的地區。\n\n\n\n三、獅門榮耀\n\n您可知道，在當今電影市場被好萊塢六大片商（福斯、迪士尼、派拉蒙、華納、哥倫比亞\n\
  、環球）霸佔的狀況下，小片商很難不在跟大片商妥協的前提下賺上一筆，而獅門當時就\n靠著獨具慧眼挑上這部小說和珍佛的關係，成為了美國境內第一次有不是以上這六大片商\n\
  出品但卻賺上超過四億美元的片商。\n\n當時的狀況得回歸到2009年，首次看上「飢餓遊戲」這部科幻系列小說的倒也不是獅門影\n業，而是獨立製片廠Color Force取得了電影的製作版權，就在這消息流出後沒過幾個禮\n\
  拜，獅門便接收到了Color Force的請求，兩方協調之下決議共同合作拍攝電影，並且由\n作者蘇珊柯林斯本人參與編劇團隊進行劇本大綱的製作。\n\n時間線排序是這樣的：2007年妮娜雅各布森創立獨立製片廠Color\
  \ Force→2008年9月14日\n蘇珊柯林斯出版小說《飢餓遊戲》→2009年3月4日Color Force取得《飢餓遊戲》電影版\n權→兩個禮拜後獅門宣布參與電影製作，同時作者蘇珊柯林斯宣布第二部小說《星火燎原\n\
  》已完成並即將出版，而第三部《自由幻夢》也即將完成→2010年蘇珊柯林斯撰寫好劇本\n→9月三名導演競逐分別為《網交陷阱》（Hard Candy ）的大衛史雷德、《007：惡魔四\n\
  伏》（Spectre）的山姆曼德斯和最後獲選的蓋瑞羅斯。\n\n一整個蘇珊柯林斯和Color Force趕進度的節奏。\n\n\n\n四、書中無名卒；電影好忙碌\n\
  \n電影中出現不少明明書裡都沒名字，可是來到電影裡卻大放異彩的腳色。\n\n一位是由伊莉莎白班克斯飾演，花枝招展的艾菲；一位是遊戲設計師也是主辦者的克藍；\n\
  另一位則是最終大決戰的第一區參賽者馬維爾（或者我們可以直接叫他漫威）。\n\n首先聊聊艾菲這腳色。艾菲本來是在書中最後部分名字才被蘇珊寫進故事中，他的戲份根\n\
  本一點也不重要，但卻神來一筆的加到電影裏頭，做為第十二區的伴護人和黑密契形成不\n錯的「飢餓遊戲引導人」。伊莉莎白班克斯飾演這名角色的拍攝時間裡，每天每天都得花\n\
  上四十五分鐘製作他那華麗的指甲，對單單指甲而已，再加上那些妝幾乎都得花上一整個\n早上的時間。\n\n而艾菲的名字其實也是有隱含意思在裏頭。Effie Trinket，在希臘文中Effie指的是很會\n\
  說話的人，而Trinket是小小的稍微有點價值的飾品，正好就如同片中的腳色個性一樣，\n多次用話術在主持司儀時幫助凱妮絲，也說服了不少人擔任他們的盟友協助凱妮絲度過難\n\
  關。\n\n\n\n至於遊戲設計師克藍，書中幾乎不會看見遊戲的設計者面對凱妮絲的頑強展現出什麼樣的\n反應，基本上讀者就是隨著凱妮絲在五里霧中緊張興奮，而克藍地出現則是在第二本書中\n\
  ，勝利的凱妮絲獲得總統雪諾接見，雪諾在對談中提到了克藍這位設計師，因為必須負起\n誕生兩名勝利者的責任於是將他處死。然而克藍在第一部的結尾倒是替電影拉抬了不少劇\n\
  情飽和度，讓觀眾透過那毒莓果跳脫了單純的殺戮遊戲，而將視野放大到之後作者的鋪陳\n。\n\n然後漫威嘛，他也一樣，死了之後獲勝的凱妮絲才聽說了他的名字，即便他在第一部書中\n\
  殺得翻雲覆雨卻也只被稱作來自第一區的男孩。\n\n\n\n五、小趣味總整理\n\n伍迪哈里遜是個素食主義者，在片中黑密契這腳色總是得大口大口濫吃一通並喝好幾壺酒\n\
  ，仔細看的話他完全沒碰肉。\n導演蓋瑞羅斯在DVD特別收錄的幕後訪談中表示，這部片的預算只有八千萬美金，比一般\n科幻片的預算比起來整個少上三倍左右。\n拍攝劇組因為有很多小孩子的關係，所以他們設置了一個髒話罰錢桶。而接受紐約雜誌採\n\
  訪時導演蓋瑞羅斯透漏，裡面有一半都是珍佛貢獻的。真是猴囡仔。\n各位都知道唯有第一部導演跟其他部不同，然而上映日期也只有第一部不是在十一月。\n這部片也出現A113，我不知道又是誰偷加上去的，好恐怖喔A113。\n\
  \n\n以上，希望各位沒有覺得厭煩，一種吼又是要寫好幾篇的文章那種厭煩，但如果順利的話\n可以接軌即將上映的最新一集啦我想。如果沒有也就算了。另外，還有很多部分本來想寫\n\
  但礙於篇幅問題作罷的內容，幾乎都是小說中被視為重要的元素但電影卻漏掉的，不過這\n點我想就交由想讀小說的人自行摸索吧，這樣才可以在兩個故事媒材都獲得新鮮樂趣嗎你\n\
  們說是吧！\n\n接著，就讓我們以飢餓遊戲的尾聲來做為文章的最後收尾吧。\n\n\n\n\n\n\n相關參考資料與圖片\n\n一、IMDb\n\nThe Hunger\
  \ Games (2012) on IMDb 7.3/10\n\n\n\n二、Hollywood Life & E! On-line\n\n\n\n三、電影DVD特別收錄\n\
  \n\n\n\n\n--\n\n===================== power by =====================\n         \
  \  幕迷影評 \n    臉書粉絲頁 \n====================================================\n\n--"
