url: https://www.ptt.cc/bbs/movie/M.1702144677.A.0B9.html
title: '[討論] 飢餓遊戲觀後一些問題（有雷）'
content: '之前看完飢餓遊戲1真的太愛了

  還去補完小說

  看完小說對整體架構還有角色們的心路歷程都清晰很多，對於人性刻劃琢磨良多，真的看

  的非常過癮，壞真的很壞嗎？好有真的好嗎？其實不過是每個人都有自己的立場。

  之後再看續集就更深刻，且電影忠於原著

  真的拍得很好也很盡力呈現


  前傳只大概知道是史諾總統的成魔之路（？）完全不敢看相關內容爬文怕被暴雷

  看完只能說光男主角顏值發呆看完整部都很值得

  有幾幕真的暈到不行


  但是前傳沒有看小說

  所以電影中一些轉折點整個黑人問號...

  盼知道的各位高手觀眾們或小說迷可以解答





  ———————-以下有雷——————


























  比較笨的問題...指導貢品的導師們

  都是學生？好像都同班

  應屆畢業生？還是只是角逐獎學金的資優生？


  1. 第二章賽前史諾偷渡老鼠藥給露西，然後談話中史諾幫露西擦眼淚，露西似乎是感動

  了忍不住想親史諾，但史諾躲開

  這邊問號露西是喜歡史諾了嗎？這麼快？

  史諾此刻尚未動心他還是只當露西是貢品而已（我的感覺）

  後面也沒有感覺到他什麼時候心動

  是露西為了救他沒有逃跑的時候嗎

  對愛情的刻劃有點問號


  2. 第三章 露西跑去跟史諾說他要逃跑到北方，史諾居然答應一起跑，這邊蠻意外的他算

  是付出真心了吧

  但他為何要提起他原本要被調去第二區啊

  沒必要吧

  明顯露西聽到他要去第二區一臉覺得 你這傢伙原來要走了不跟我講

  這邊算是信任崩塌第一步嗎？找不到兩人裂縫起頭

  想想應該是這邊？


  3. 兩人在路上聊到史諾說他殺了三人已經夠了，露西驚訝覺得被騙，目前為止史諾殺人

  應該都是出於不得已的選擇，第三人我覺得是在指他的摯友，但我認為他初衷並非殺人。

  只是給自己一條後路或是想要有重回都城的機會

  露西在遊戲中也有失手殺過人，有這麼過不去嗎

  他對於史諾的愛真的很撲朔迷離


  到這邊覺得露西越來越怪？？


  4. 為什麼槍在小屋裡，代表露西是反叛軍的一員嗎？

  記得前面提到那個湖很少人知道，是他們族人的秘密基地之類的


  他還特地告訴史諾魚竿在地板下：講開撕破臉

  堅持跑出去採植物：下定決定要逃跑


  轉折太快心中跟史諾一樣一頭霧水的問：你是要離開了嗎？

  是發生什麼事情你需要離開什麼都不講啊

  還故意把人家送的禮物掉在路上讓他被蛇咬

  這裡我真的被大嚇到不行==

  所以那蛇沒毒吧？他根本沒事啊（我真的好執著這個小問題）


  我有試著揣摩露西的心：

  畢竟史諾是都城的人，而自己已是亡命之徒，史諾都可以調去第二區了，隨時會走而且可

  能會為了私利又殺人（這次可能是自己）所以無法繼續信任史諾。


  結論：立場根本完全不同，完全是對立方

  兩人信任基礎薄弱

  兩人都是多疑性格

  導致最後只有相愛相殺的結局


  但露西在遊戲內力保同鄉讓我以為她是個重情重義的傻女孩


  最後露西結局如何也不重要了

  逃了也好或是被史諾開槍打中也好

  她在史諾心中已經死了


  正傳裡冷酷無情又變態的史諾總統，原來帶著悲傷的影子

  可憎之人必有可憐之處


  電影中史諾呈現的較為無辜，我一開始理解成他是善良的人，只是一路以來的無從選擇（

  家道中落、貧窮、無權無勢）讓他逐漸走上狂人之路

  看了網友分享原著中似乎不是如此，是性格使然，看來該拜讀原著了。


  題外話

  正傳的遊戲超級科技化 都城也很fancy

  這裡的競技場超爛 一炸就差不多毀了

  抽籤到比賽當日隔太少天了吧根本去送死 難怪比賽一下子就結束了

  而且好像都沒飯吃

  好慘

  完全是趕鴨子上架的新規則

  連導師送東西的無人機都爛到可以變成武器砸人

  真的是會心一笑











  --'
