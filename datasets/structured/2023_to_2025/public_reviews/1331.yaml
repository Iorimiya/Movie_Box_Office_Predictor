url: https://www.ptt.cc/bbs/movie/M.1700976841.A.BF8.html
title: '[雷] 飢餓遊戲 鳴鳥與游蛇之歌'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  先說結論


  我覺得這部就

  有跩哥馬份氣質和外型的湯姆瑞斗

  史萊哲林學生成魔記

  但史諾沒有像佛地魔那樣純粹的邪惡


  這部不當成系列作

  當成一般劇情片還可以看一下

  但當然沒到真正劇情片那種深度

  劇情還是滿YA的

  YA版劇情片


  這部沒看過前作也是能看懂

  前作除了第一集我也已經忘得差不多了

  只是有幾個地方沒認真看可能會很困惑


  比如最後露西跑了

  好像滿多人不懂為啥她會跑

  但電影裡其實給了好幾次提示 雖然很set


  1. 露西會被選上當貢品 就有被前男友衝康的成份

  - 被愛情背叛產生陰影

  2. 和史諾一開始本來就是互相利用猜疑而產生的情愫

  - 信任感本來就很單薄

  3. 露西有句台詞是直接對史諾說：

  信任大於愛情 他們之間如果沒有信任 史諾對她來說就毫無價值

  4. 露西唱給史諾的歌 好像都是什麼純潔如雪的你之類的歌詞

  4. 被露西發現史諾原本打算離開 但卻隻字未提

  5. 史諾第三次殺人隱瞞露西 又被她發現

  6. 找到殺人時用的槍 等於阻礙史諾回到原本世界的因素都被排除了 除了露西自己


  最後就是露西跑了



  這系列作我是不會討論什麼好人壞人

  這裡面角色本來就沒幾個好人

  全部都是為了生存不擇手段的人

  只是手段高明跟不夠高明的差別而已

  前作劇情我大部份都忘了

  唯一記得的是主角三人我都很討厭


  這部就可以看看

  但應該不會留在我心裡


  --



  文青青春痛 本來就怪人不用太在意XD


  後面就其實是遊戲設計師

  對史諾留戀露西這件事存疑

  故意把史諾丟出去體驗真實世界啊

  看他有沒有資格接班

  打從一開始就沒人在乎是不是作弊

  上流階級的小孩都能隨便殺的國家


  如果他能捨棄愛情返回原本的世界

  那就合格

  如果無法捨棄感情 他就會被原本的世界捨棄

  他暱稱就性愛戰神'
