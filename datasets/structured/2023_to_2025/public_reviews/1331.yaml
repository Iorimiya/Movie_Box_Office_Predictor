title: '[好雷]飢餓遊戲的第十三區 '
content: "沒看過小說,純粹覺得第十三區地堡挺有戲的\n\n這地方就像是為了能讓管理者能輕易監督所有人而設計出來的\n\nㄧ成不變的制服,有序的工作進度安排,死板而刺耳的廣播\n\
  \n再加上不能養貓又不能喝酒的規矩,不就是暗示這裡是集中營嗎?\n\n一開始拙劣的宣傳手法,後面又來一段集合眾人欣賞反攻首都宣傳片\n\n最後總統不忘大喊 One\
  \ X, One X, One X\n\n這麼意淫的橋段,八成是向某段歷史,某個國家,還有某個手機廠牌來致敬XD\n\n剛好13區人民呼喊的口號,和下面這WIKI的影片挺像的\n\
  \n\n\n\n作者高達八成在告訴讀者觀眾,這裡的大總統也是個壞人~\n\n首都和13區之戰,就是鐵幕東西兩邊之戰\n\n其他區的人民,死了剛好可以拿來宣傳利用,\n\
  \n所以13區的安全主管說的好,總要有人活下來宣稱勝利\n\n\n所以下一集可以看到凱妮絲被婊嗎XD\n\n\n不過凱妮絲的眼睛真的很棒,恐慌,欣慰,信任,焦慮,悲憤\n\
  \n以及最後的血絲眼,就像黑洞一樣,把我情緒都吸進去了\n\n凱妮絲這人根本是這雙眼睛的放置器\n\n\n--\n\n   掛網...即是不存在的存在\n\n\
  --"
