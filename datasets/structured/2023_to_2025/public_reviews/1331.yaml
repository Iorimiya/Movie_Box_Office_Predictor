url: https://www.ptt.cc/bbs/movie/M.1448470030.A.1C2.html
title: '[好普雷] 飢餓遊戲 3下嚴格遵守原著'
content: '好普雷 飢餓遊戲：自由幻夢 終結戰-嚴格遵守原著



  還記得當初看完第一集的感動，促使我特地去將原著小說看完，

  基本上我個人認為這部小說改編電影是成功的，畫面震撼.歌曲動人，有好幾幕皆令人動

  容，

  這集做為一個整部曲的結局是合格的，

  有嚴格的遵守原著，滿分5分我給4.3分，

  但如果三的上下兩集合成一集長達3小時，刪減一些不必要的長鏡頭會更棒。





  防雷




  【時代巨輪下的英雄】

  如同於第三集小說封面所寫：

  權力競逐是他們的遊戲，我的沉默就是我的答覆，

  有別於以往英雄片的爽感，主角總是帶頭衝鋒陷陣，

  女主角凱妮絲只是政治角力下的棋子，

  上位者希望她負責拍片與遠離危險，

  但大家會這麼喜歡凱妮絲，

  就是因為她忠於自我，

  沒有忘記一路走來的本心，

  抽籤日自願取代小櫻.

  為小云唱歌與哀悼.

  迷昏彼得幫他拿藥.

  嘗試救梅格絲.

  對抗史諾總統.

  希望前往前線.不因為憎恨無謂殺人，

  因為出自真心，所以感人，

  當然戰爭意味著死亡，凱妮絲的個性注定她無法帶領群眾，

  反而是蓋爾的手段，認為為都城掃地的平民也是在幫助都城，

  懂得必要的犧牲革命才能成功，在書中也當上第二隊隊長，

  凱妮絲的心情和【硫磺島的英雄們】以及【來自硫磺島的信】

  這兩部電影的反戰思想頗為雷同，有興趣可以參考看看。



  我個人很欣賞作者的設定，

  可惜在電影中太過於著重在主角，

  針對整個革命進度很少著墨，沒看書的觀眾可能會覺得過於倉促，

  在書中晚上反抗軍會介紹攻城推進路線，至少會間接得知戰況，

  電影一個爆炸後就闖關成功，根據我沒看小說的朋友表示，太突然了!史諾前面老奸巨猾

  ，後面怎沒出半招XD






  【有點可惜的彼得】

  當初看完小說時，愛上了彼得這個角色，

  多少少女希望身邊能有這種男人，

  願意為凱妮絲犧牲一切、

  想了解凱妮絲的喜好、

  無條件支持凱妮絲、

  有自己的一技之長、

  還有悲慘的經歷、

  根本天菜等級會秒殺少女芳心!

  可惜電影版中蓋爾的選角帥得沒天理，

  外加彼得的身高劣勢，怎麼看都比女主角矮...

  這個腳色在電影裡反而沒有小說裡優，

  嗚嗚嗚，好哀傷...

  果然視覺還是很重要的(誤





  【革命必定伴隨著犧牲與陰謀】

  一路走來好多人都為了理想而死，

  結果換上的新政府居然想沿用舊制度，

  臨時總統跟為了維護秩序實施管制，

  這橋段怎跟以前讀到的歷史課本好像(皺眉)

  電影為了結局其實有做了相當多的鋪陳，柯茵總統的表現ㄧ直都頗心機，


  可惜電影沒把小櫻的死寫清楚，

  在小說裡曾經寫到，

  小櫻未滿14歲，還不能授予軍事頭銜，不應出現在前線救治傷患，

  想要到前線必須要有非常高層的人士批准，

  是誰想讓凱妮絲失控，完全站在柯茵總統那一邊？

  現場也有無數的攝影機從各個角落拍下當天畫面，



  另外小說裡史諾總統有說他不可能派飛機去丟炸彈，

  如果他有飛機早就先坐上去逃走了，

  但事實是在前幾次空中對炸後，

  首都早已沒有可飛的飛行器，

  那架飛機絕對不是他派的，


  上述兩點沒演清楚有點可惜，

  書中的凱妮絲是因為這樣才確認柯茵總統是無良的政客，

  但電影劇情都嚴格遵守原著，我個人蠻喜歡的，哈哈，

  如果前幾集的都看的觀眾，去補完最後一集也是不錯的，

  有看過小說就更推囉，電影節奏比小說緊張刺激，

  沒演到的劇情還可以自行腦補?!XD

  是部合格的小說改編電影。




  --

  --

  可惜電影沒這種感覺

  也是因為小櫻才有這種結局QQ


  哈，個人喜好啦

  我覺得大家不喜歡3-1，是因為他斷在ㄧ個很尷尬的地方，完全不能當做一部獨立電影看

  ，3-1和3-2合在一起會更棒！我是看3-2之前才去把3-1補齊的，裡面的2段宣傳都好感人

  ！雖然我個人淚點也低啦，看到民眾舉起3根手指頭就噴淚XD

  同行的朋友也覺得很失望XD

  這種大場面我本來以為會大改，

  看看哈利波特電影版對戰鬥場面的放大...

