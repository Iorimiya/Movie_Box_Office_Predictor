url: https://www.ptt.cc/bbs/movie/M.1417950964.A.9B2.html
title: '[負雷] 飢餓遊戲3'
content: '防雷





















  因為是臨時拉去看的  也只看過第一集


  沒看過小說   有些地方可能不太懂



  但沒關係  這部負雷的點電影本身問題就很大了



  劇情開始 前面說要有學舌鳥的象徵


  需要一個領導帶領大家有反抗革命的精神


  好  可是電影卻花了一大半的時間


  讓裡面的角色忙著  拍宣導短片?


  殺虫  這是在幹嘛



  然後最扯的就是 他媽的醫院被敵方戰機炸光光  死了一堆人


  結果反抗軍和總統是什麼反應?


  居然事後在慶祝" 哎呀 醫院被炸光 這聲光效果十足 我們總算拍出了這麼好的宣導片阿"


  這什麼鬼鳥蛋  導演是腦袋裝X嗎


  劇中大家忙著拍宣傳短片拖台也就算了  連這種沒邏輯的橋段也敢拍來賺錢


  然後劇情中段都不知道在幹嘛  就雙方你我一直宣傳戰  各種拖  不重要




  接著  總統終於要派人去救以前的勝利者了  包括女主最愛的比得


  電影經過一個小時   劇情總算跨出了"一大步"


  然後就去救阿  救阿救  原來  早就被發現總統偷派去救人了


  阿這邊也不知道是怎樣   被敵方總統發現後



  居然  大家還是平平安安的回來了


  這到底是殺虫  這到底是殺虫


  而且行蹤曝露後  我方後來怎麼逃出來的過程  全部都沒拍出來


  馬的  不該拍的拍一堆   該拍出來的什麼屁都沒有


  最後救回來才發現  原來比得  起笑了


  結束



  傻眼  真的是傻眼  這根本不是電影吧  沒什麼劇情  也沒高潮迭起


  實在是很鳥  今年看過最爛的就是這部


  奉勸各位  稍微看下預告片  然後爬一下板上的心得文  就差不多了


  不要浪費你寶貴的兩百塊   真的   誠心不推


  謝謝各位



  --


  所以是小說原本就爛的意思嗎...  因為電影真的拍得很爛



  飛彈一發讓戰機裡面的敵軍跟勝利者死光  不是更能打擊反叛軍和小珍妮佛嗎



  因為是臨時說要看的  之前只看過第一集


  真的很瞎  像預告裡面小珍妮佛還很熱血地 " If we burn, you burn with us."


  靠好像反抗大戰要一觸即發了  結果...事實上只是在對著鏡頭喊  拍短片而已  瞎



  願聞其詳  哪些橋段有什麼特殊含義可以拜託跟我講一下  謝謝'
