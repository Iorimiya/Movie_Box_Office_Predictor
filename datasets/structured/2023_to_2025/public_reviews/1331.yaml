url: https://www.ptt.cc/bbs/movie/M.1448217094.A.9DE.html
title: '[ 普雷] 飢餓遊戲3 part 2,前後不搭的系列作品'
content: '昨天看完 飢餓遊戲第三部 完結篇, 雖然說有看過小說 早就知道結局 不過還是很期待進

  入電影院, 飢餓遊戲各系列的電影陪我度過了人生的 精華時期,第一部是在美國看,第二

  部 在香港,三上在曼谷 最後的完結篇終於有機會在台灣看



  防雷頁
















  當初會進去電影院看飢餓遊戲1其實也是誤打誤撞,因為我們在美國我們都會團購很多電影

  票,幾乎每個禮拜都會去看兩次電影反正有什麼就看什麼, 算是在美國很便宜的消費娛樂


  結果看完之後我跟朋友對他的評價都算不錯 雖然這是一般的娛樂爽片不過感覺 算是有帶

  出一種人性的 陰暗裡面，所以接下來的幾集 我都有追著看,第三部一步曲 其實就已經比

  前面兩不少了很多戰爭的畫面,當初很多影評都說把第三部拆開上下拍是為了爭取更多 空

  間去拍戰爭場面


  結果都城的防空部隊 就好像隱形人一樣 讓反抗軍的 戰機直接飛進都城空降炸彈 就結束

  了, 如果我沒有看過小說我真的會覺得莫名其妙, 不過 導演可能為了要吸引女性觀眾所

  以特別強調感情線吧, 很成功啦我覺得如果要這樣想的話, 是一部完美的戰爭愛情小說XD


  昨天看的時候轉進最後一幕就是彼得 跟凱尼斯抱著他們的小孩在玩耍的時候全場 都在大

  笑 也聽得出來帶點無奈吧, 想了一晚要怎麼樣形容這種感覺,應該比較像進場看哈利波特

  最終編結果導演沒有把哈利根 佛地魔 對戰的情節拍出來就跳到哈利生子了==


  如果把最終篇當作一部獨立電影來看的話其實他不難看 只是我覺得整個系列從頭到尾的

  風格實在差得太多, 我相信 有從頭看到尾的朋友都多少有一點這種想法吧, 另外我有一

  個朋友講了一句更好笑的如果這一部直接拿來當移動迷宮3搞不好 也很合理XD


  --'
