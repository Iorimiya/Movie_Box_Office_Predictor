title: '[新聞] 《飢餓遊戲》珍妮佛勞倫斯不飢餓瘦身祕招'
content: '新聞網址：


  「說人胖等於犯法！」 《飢餓遊戲》珍妮佛勞倫斯不飢餓瘦身祕招


  2014年11月25日


  《飢餓遊戲》續集一上映，立刻又掀起觀眾的一陣熱議，而當中最受矚目的，

  莫過於飾演女主角的小珍「珍妮佛勞倫斯」。今年才24歲，珍妮佛勞倫斯就已

  獲得影后頭銜，她的個性直爽，尤其在「身材」議題上從不掩飾自己的堅定立

  場，她認為的正常女人模樣，並非瘦成「紙片人」般的樣貌，這樣的珍妮佛勞

  倫斯，反而更讓人喜愛。



  珍妮佛勞倫斯：「在電視上說人胖，應該要算違法！」


  一句「在電視上說人胖，應該要算違法！」道出了珍妮佛勞倫斯幾年來的心聲。

  在這個認為「瘦」才是美的社會，剛出道時的小珍曾被嚴重羞辱，「那時候有人

  說我肥，如果不減到某個體重數字便會被炒魷魚。他們還拿出我近乎全裸的照片

  ，要我以此作為減肥的動力。那時候我只是個小女孩，傷害實在很大。」



  「減肥」不等於「餓肚子」！


  受到了世俗美感的影響，儘管小珍並不認為瘦就是美，但她還是要維持自己的體態

  ，不過她說她絕不會用「餓肚子」的方式來讓自己變瘦，因為她真的非常愛「吃」

  。她曾說過自己一天中最重要的事就是「吃」，因此，維持身材也變成是最困難的

  事。




  影后級的「消水腫方式」


  如果不能控制自己「少吃」，到底要如何維持健康又漂亮的體態呢？小珍健身教練

  公開了她的消水腫方法，每天早上小珍會來一杯溫的檸檬水，保持體內的平衡。上

  台前小珍會喝薄荷茶、長途飛行後喝蒲公英茶和蘆筍來消除水腫。此外，在大型活

  動前一晚，小珍會泡「瀉鹽浴」幫助排毒及紓解疲勞。



  持之以恆的運動不可少


  要和小珍一樣有穠纖合度的身材，「運動」可是不可少的，她在拍攝《飢餓遊戲》時

  ，為了讓身材符合電影的需求，還有私人教練督促她運動。喬霍里根教練

  （Dr. Joe Horrigan）說：「我們安排了大量的自行車、攀岩和射箭的訓練，有氧

  和無氧運動並進！」


  儘管沒有纖細的身材，健康又豐滿的珍妮佛勞倫斯仍大受歡迎，她表示「我不要年

  輕女生看了之後，為了想成為女主角凱妮絲而不吃飯，因為凱妮絲和我都是正常的

  女人，而不是紙片人。」像小珍一樣用正確的方式，擁有健康的體態，並且愛自己

  才是更重要的。


  --'
