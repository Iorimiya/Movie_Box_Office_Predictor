title: '[新聞] 全是現場演出！瑞秋曾格勒在《飢餓遊戲'
content: "真實力！瑞秋曾格勒在《飢餓遊戲》中的演唱片段全是現場演出　製片大讚「歌聲令人驚豔\n」\n\n\n\n\n在電影中讓角色融入歌唱元素，不僅能透過歌曲讓觀眾更有代入感，也能透過歌詞，充分表\n\
  達當下心境。這種拍攝手法在電影中早已不是新鮮事，在傳統製作中，演員會先額外錄製好\n歌曲，並在拍攝時對嘴表演，例如像《Barbie芭比》，不過偶爾導演會選擇現場讓演員直接\n\
  演唱，《飢餓遊戲：鳴鳥與游蛇之歌》正是以這種方式進行，可見瑞秋·曾格勒(Rachel Ze\ngler)的演唱實力。製片人對其聲樂技巧更是讚不絕口。\n\n\n\
  雖然現場演唱的風險要高得多，若發揮不好較容易看出破綻，但卻更能搭配演員的肢體表演\n和歌唱實力，《飢餓遊戲：鳴鳥與游蛇之歌》導演法蘭西斯·勞倫斯(Francis\
  \ Lawrence)便\n是選擇這種方式進行拍攝。女主角瑞秋·曾格勒(Rachel Zegler)所飾演的露西格雷(Lucy G\nray)是柯維一族（Covey)的成員，她們愛好自由、嚮往無憂無慮的大自然，喜歡穿著色彩鮮\n\
  艷的服飾，常常以優美的歌聲，抒發自己的情緒，也代表音樂佔據她人生很大的比例。\n\n\n電影中的每首歌曲都是經過特別設計創作。在製作過程也都會徵求《飢餓遊戲》系列原作者\n\
  蘇珊·柯林斯（Suzanne Collins）的意見。而劇中女主角演唱的大多數歌曲都有著樸實、\n民俗的聲音，對此導演勞倫斯解釋「當人們收集這些代代相傳的歌曲或民謠時，通常來自英\n\
  格蘭、愛爾蘭、蘇格蘭，然後用小提琴、吉他或小鼓來編排它們，非常簡單，在酒吧就能演\n唱，我喜歡那種感覺和聲音，而作者蘇珊也是，這種聲音絕不會帶有錄音室錄音的純淨感。\n\
  」這也是為什麼導演不選擇使用後期錄製的拍攝方式。\n\n\n勞倫斯進一步表示「一確定音樂的呈現方式，之後就請了專業音樂人戴夫·科布（Dave Cob\nb）為作者在書中寫的歌詞進行譜曲。一切完成後，他們與樂隊錄製好樂器，然後請瑞秋·\n\
  曾格勒加入人聲，但她錄音時只算是種排練，以確保她能融入歌曲、風格。」監製尼娜·雅\n各布森透露曾格勒會選擇在片場現場演唱，在這個過程中讓劇組人員驚嘆不已，「每次他們\n\
  喊停之後，人們就會瘋狂地鼓掌！她的歌聲令人瞠目結舌。」\n\n 「她很順利得適應了我們需要的風格，而且她每天都能在現場唱歌，這也很令人驚嘆，無\n論是伴奏還是清唱，她全部都是現場表演。」瑞秋·曾格勒從幼年時就展現好歌喉，她曾翻\n\
  唱過《一個巨星的誕生》中的熱門歌曲《Shallow》在網上爆紅，這也證明了她的嗓音足以\n應對現場演出的表演方式。導演補充「要在電影中現場錄製歌曲的秘訣，就是找到能夠在現\n\
  場震撼全場的演員。」瑞秋·曾格勒也被選為迪士尼電影《白雪公主》真人版的主角，她的\n好歌喉或許能在劇中再次展示出來。\n\n--"
