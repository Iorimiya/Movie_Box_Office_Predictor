url: https://www.ptt.cc/bbs/movie/M.1501951565.A.754.html
title: '[負雷] 辦公室大狂殺-廉價版飢餓遊戲?'
content: "最近剛好有免費的catchplay單租序號 加上又沒啥大片好看 看到這部覺得題材還算\n\n可以就租了下去.... 殊不知.......\n\n\
  \n\n--------------------------------以下有雷--------------------------------------\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n電影敘述一家坐落於哥倫比亞的美商公司(?)-BELKO在某天遭到不明份子入侵辦公室系統\n\
  \n除了當地人外的歪國人都意外的被關在了辦公大樓裡面 而以為是開玩笑的大夥們殊不知\n\n正要掀起一股紅色恐怖....\n\n\n好啦 其實看這部電影也不用去了解誰是誰\
  \ 反正就是廉價版的飢餓遊戲....\n\n實在不知道從何吐槽起 為什麼專挑歪國人下手? 為什麼任務那麼的無聊就是殺人殺人?\n\n飢餓遊戲雞肋歸雞肋至少場地還有些效果(?)\
  \ 這部就是拿刀拿槍剁剁剁射射射\n\n說血腥基本上就是還好 說煽情也沒有.... 你看看老闆多沒有情趣 女的都主動了還不先\n\n吃了再說 加上電影當中有幾位女生其實都還蠻漂亮的\
  \ 真的都被當花瓶省略.....\n\n(個人想法啦 如果是我 女的就全部先集中起來OOXX再說 反正又花不了多久(?) )\n\n然後劇情就非常之好猜到一個極致\
  \ 反正最後就是老闆跟男主角決鬥嘛\n\n不過在女主角中槍那時我一直覺得會不會男主角把老闆殺掉後女主角再一個反殺掉男主角\n\n這樣就神片了XDD 但前面女主角也說過\"\
  人是自私的\" 所以沒被反殺真的有點無趣XD\n\n然後我說女二也真夠衰的 前面一整場都躲得好好的沒事 硬是要亂跑結果電梯門一開\n\n叮咚! Bang!  \
  \  女二:挖咧OOXX\n\n\n電影最後的最後 男主角被幕後主使者抓去詢問 結果也只得知這是某種社會人性實驗\n\n然後咧??? 到底For what??\
  \ 然後幕後主使者就死了\n\n\n片尾明顯的告知男主角並不是唯一一場\"比賽\"的獲勝者 就是要跟風拍續集???\n\n如果真的有續集 拜託至少場地效果加乘一下好不.....\n\
  \n\n\n結論:看免費的還算可以 當作B級片看囉....\n\n--\n             \n    \n             Inside\n\
  \                            Out\n              \n |        \n\n--\n   我相信是成本問題啦\
  \ 就是想打出小成本版的飢餓遊戲....\n   剛剛查了一下電影製作成本500萬美金.....\n   飢餓遊戲第一集就7800萬美金了XDD 大概真的是想走低成本B級片路線"
