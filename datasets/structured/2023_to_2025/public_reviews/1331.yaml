url: https://www.ptt.cc/bbs/movie/M.1700233026.A.E0C.html
title: '[2/3 好雷] 飢餓遊戲 前傳'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n飢餓遊戲很久以前看的\
  \ 大概記得劇情\n\n前傳完全沒做功課\n\n原本不期不待 單純陪朋友去看的\n\n所以可以算是直觀感受\n\n\n\n分三章 前幾篇的這個2/3標題很棒 所以就接著用\n\
  \n前兩章真的好看\n\n史諾是將軍兒子 從小生活艱困 所以奮發向上\n\n遊戲的開始 抽籤 女主唱歌\n\n一連串都很自然 入戲 銜接 很順暢\n\n第二章競技場\n\
  \n真的是最棒的一章\n\n覺得比本作都還精采\n\n一個小小的傳統競技場 營造出來的壓迫感 緊張氣氛\n\n真的很到位\n\n史諾的擔心 用計 劇情推進 也都是環環相扣\
  \ 十分精彩\n\n可媲美日本鬥智型漫畫了\n\n2/3可以給95分了\n\n原本不太熟女主\n\n但直觀上 演技 詮釋吉普賽民族 都是成功的\n\n男主也是\
  \ 選角好 帶入感就很強\n\n會一直想到本傳的總統\n\n若是前兩章就結束 也算是完美了\n\n很久沒在電影院看的那麼過癮了\n\n\n\n接著第三章 就開始囧了\n\
  \n劇情開始很不順 有點拖沓\n\n前兩章 是鬥智劇情動作片\n\n第三章 變成驚悚恐怖片\n\n轉的很不順\n\n很多地方都摸不著頭緒\n\n除了劇情節奏外\n\
  \n有幾點可以挑出來講\n\n\n第一是史諾的黑化 史諾跟女主的互動 很無厘頭\n\n史諾不得已會殺人\n\n但 那是建立在殘酷的現實無奈上\n\n所以根本也不知道為啥最後會瘋狂\
  \ 黑化 殘忍\n\n情傷嗎 ??\n\n情傷 跟全面黑化又有啥關聯 ??\n\n再者 女主不也錯殺過 自己也很內疚\n\n怎麼會不探究男主 究竟是不是說謊 說謊原因\
  \ 就這樣神秘飛離\n\n轉折也太大了吧 突然太高標了\n\n像是魔神仔 完全銜接不上人格表現\n\n這邊劇情真的很跳\n\n看完我朋友直接去借小說來看到底哪邊出問題\
  \  XDD\n\n\n\n第二是小惡魔的阻擾\n\n他是你好友的小孩 之前有錯也是他老爸\n\n完全沒說明為啥要這樣刁難 阻礙原本正向的小孩\n\n然後自己很高標的要打斷遊戲\n\
  \n卻不輔導眼前的正向有為青年 讓他掉入博士黑勢力中\n\n\n\n第三就是博士了\n\n腳色 造型 都算成功\n\n但 但 那個超不搭的紅色塑膠手套\n\n\
  真的會出戲 XDDD\n\n\n\n這部的前兩章 真的好看 很完美了\n\n跟第三章 簡直像不同導演拍得不同類型電影\n\n但光是2/3 還是值得推薦\n\n\
  --\n 但那段我還是覺得史諾是想「阻止這件事」 而不是要殺掉好友\n 只是意外好友被其他人刑求招出來"
