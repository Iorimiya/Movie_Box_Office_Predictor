title: 'Re: [新聞] 俄富豪搞真人版《飢餓遊戲》 殺人強姦都可以'
content: '後續新聞

  俄富豪認「真實」飢餓遊戲是騙局　參賽者：羞恥心在哪


  俄羅斯富豪皮亞特科夫斯基（Yevgeny Pyatkovsky）之前祭出台幣5200萬的獎金舉辦現實

  版的飢餓遊戲「Game 2：Winter」，在這個比賽中完全沒有禁忌，也讓很多想嘗試的人躍

  躍欲試。不過，最近皮亞特科夫斯基最近坦承這個比賽一切的血腥、暴力都會交由電腦特

  效，之前的宣傳都是噱頭，這個發言引發參賽者強烈的不滿，他們已經準備好將9個月生

  命奉獻在此節目。


  據《西伯利亞時報》報導，「Game 2：Winter」是一個模仿飢餓遊戲的現實生存秀比賽，

  選手將在西伯利亞鄂畢河旁的孤島上面臨黑熊、野狼以及零下50度的生存挑戰，比賽規則

  無論抽菸、酗酒、打架、強姦，甚至是謀殺，這些都可以逃脫法律的制裁。皮亞特科夫斯

  基3月份時還再次表示，比賽中完全沒有限制，哪怕是哪個女人懷孕，主辦方也不會出面

  干涉比賽。



  據報導，這樣的規則引起非常大的爭議，不過也吸引很多人想參加，但是現在這些都成為

  泡影，39歲的皮亞特科夫斯基在聲明中表示，「之前說的比賽規則都不是真的，一切都只

  是為了宣傳，證明我是一位行銷天才。」


  報導還指出，這場比賽的參賽者在得知消息後都非常憤怒並表示，「他讓俄羅斯的形象變

  成一個讓人不開心的國家，而且毫無吸引力，國家應該要因為你感到羞愧，你甚至沒有道

  歉」、「原來這麼有錢的人是個騙子，這麼沒有羞恥心」、「現在我覺得自己很愚蠢，原

  來被一個富豪當白痴耍感覺是這樣」。




  心得:挖靠還真的有人要花五百萬去參賽喔

  剛剛終於忍著看完自由幻夢下...

  我真佩服我自己能看的下去


  --


  --'
