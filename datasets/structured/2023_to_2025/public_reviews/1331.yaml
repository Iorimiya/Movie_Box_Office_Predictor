title: '[普雷] 飢餓遊戲-自由幻夢'
content: '沒看過小說,如果只是看完二 很想看繼續發生甚麼事的人


  看這部片 會很失望 一開始在敘述拍宣傳片 醫院那邊比手指的時候有點感人


  然後等很久很久 就變成了動作片 最後面就變成殭屍片 然後就中斷在很尷尬的地方


  從頭到尾 只對兩個有印象 洗腦的歌 和突然變殭屍的男主角 然後兩小時就這樣過了


  只能期待下集能拍的精采一點了,如果只是想看發生甚麼事的人 真的蠻建議


  等dvd或者是下集出一次看完,要不然真的會有點失望.


  --'
