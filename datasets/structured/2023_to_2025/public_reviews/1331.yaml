url: https://www.ptt.cc/bbs/movie/M.1535069115.A.FCE.html
title: '[新聞] 「飢餓遊戲小芸」接班小珍妮佛　《闇黑'
content: '新聞網址：


  「飢餓遊戲小芸」接班小珍妮佛　《闇黑之心》談末日之愛


  科幻動作新片《闇黑之心》（The Darkest Minds）找來新生代女星──曾在《飢餓遊戲

  》飾演楚楚可憐「小芸」的女星阿曼德拉斯坦伯格（Amandla Stenberg），搭配提名獨立

  精神獎的英國小生哈里斯狄金森（Harris Dickinson），談跨越膚色的末日愛情，「小芸

  」阿曼德拉被看好接班「小珍妮佛」珍妮佛勞倫斯，成為新一代反烏托邦女英雄。


  阿曼德拉擔綱《闇黑之心》女主角露碧，幾乎出現在每一幕，戲分吃重。劇組一眼相中她

  ，導演珍妮佛尼爾森分析：「她懂得如何透過演出呈現角色最內心的那一面，而非在每一

  個畫面中都把自己表露無遺，這在這部電影中非常重要。阿曼德拉有一種神祕的特質。有

  著敏銳的智慧，這是一種真正的力量，讓她成為最完美的露碧。」


  除了著墨於科幻驚悚的危險世界之外，跨越膚色的末日愛情，亦是本片一大賣點。一個無

  法控制自身超能力的16歲少女露碧，被國家與掌權者視為社會的亂源及最大威脅，在她努

  力逃亡存活之際，碰巧撞見了剛完成一次起義的英雄人物連恩（哈里斯迪金森飾）；連恩

  教會她如何去依賴，關心甚至去愛身邊的朋友，這對她來說是從未有過，甚至是不曾想像

  過的情感連結。連恩由入圍第33屆獨立精神獎最佳男主角的英國小生哈里斯狄金森飾演。


  《闇黑之心》故事背景設定在虛構的近代美國，一種名為「青春退化症」的神祕絕症在毫

  無預警的情況下肆虐全國，讓百分之98的青少年人口死去，存活下來的百分之2，也因病

  毒得到異變能力，帶給當局者莫大恐慌，政府決將倖存的孩童們關在集中營，被一群由「

  超能士兵」所組成的軍隊監控，以顏色分類管理及定義這些超能力孩童，分別是具有燃燒

  能力的「紅印者」、隨心所欲控制電力的「黃印者」、隔空取物的「藍印者」、擁有超凡

  智慧的「綠印者」，以及能夠控制人類心靈的頭號危險份子「橘印者」。電影今天在台上

  映。（李子凡／綜合報導)


  --

  我是快樂、樂觀，有過N次豐富戀愛經驗的開朗零號男同性戀。


  現在會讓我擔憂的事情，只有爸媽的身體，以及買的股票會不會賠錢。


  --'
