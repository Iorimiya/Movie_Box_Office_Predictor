url: https://www.ptt.cc/bbs/movie/M.1416821163.A.FC0.html
title: '[好雷] 飢餓遊戲:自由幻夢part1~鳥籠中的學舌鳥'
content: '<無音樂有圖好讀網誌版>




  這篇絕對是不專業影評(?!)


  因為我第一二集都沒有進戲院看，都是在電視上斷斷續續看的


  (圖)




  <無雷之我很認真看電影但我不是小說迷的心得>




  雖然前兩集都是在電視上斷斷續續的看


  但也還算了解大致上的劇情(?!)


  就算是單獨直接去看第三集part 1也沒有問題唷!


  先來說說為何前面沒進電影院看


  第一集因為對書不熟，再加上朋友看完回來心得都覺得還好


  所以就沒有到電影院報到了~


  在電視上看了之後，由於在遊戲過程中拍攝都是邊跑邊拍鏡頭很晃，


  老實說不太喜歡~自然第二集也不想去電影院看


  而這次第三集part1是因為在電視上看了第二集覺得還蠻好看的，


  再加上朋友大力推薦，所以就跑去看了 :P




  這次part 1感覺也是在鋪陳後面的結局，


  所以part 1電影的節奏算比較緩慢，


  不過前面緩緩道來一直到最後節奏加快的進行，


  導演的電影步調抓得很好，該有的娛樂效果也有


  的確有享受這次電影的感覺!


  而Jennifer跟Josh的演技也讓我看得相當過癮


  看完相當期待下一集，


  同類型電影像是"哈利波特：死神的聖物"，


  同樣也是part 1鋪陳~就沒有這集來的精采緊湊(但也可能是劇情的關係啦)


  總之，的確是部值得一看的電影!!!


  而且主題曲是Lorde唱的!!! 好喜歡呀!!!!!




  來看個預告






  <應該是有雷看了心有戚戚焉的心得>




  不知道有多少人跟我的感覺一樣


  相較於電影中的情節，


  好像反映了現今我們存在的社會一樣，


  媒體與隻手遮天的政客操縱著無知的民眾，


  13區的革命與施惠國的獨大，


  都相當的令我感到無法言喻的淡淡哀傷，


  或許我們都想當學舌鳥，但終究我們只是鳥籠中的學舌鳥，


  永遠都不知道野外的學舌鳥是多麼自由自在，


  籠中的學舌鳥想要掙脫鳥籠，


  一定會經過許多痛苦與犧牲才能換到難能可貴的自由，


  真的能夠得到自由嗎? 還是只是幻夢一場??!


  其實我覺得書名翻譯的真的很不賴~




  演員的部分首先先來說說Philip Seymour Hoffman


  在完成了最後一集上下的拍攝內容後，


  被人發現可能疑似吸毒過量的在自家過世


  這部電影可以說是他的遺作(哭)


  (圖)


  當然曾獲得奧斯卡影帝的他，演技自然不在話下~


  只是希望優秀的演員能夠再活久一點呀~嗚




  Jennifer Lawrence也再次完美的詮釋了劇中的Katniss


  (圖)



  那個帶有點柔弱卻又異常堅強的女孩


  總是能夠牽動觀眾的情緒，


  當他看到第八區醫院那些手無寸鐵的男女老幼無條件的相信他支持他那時的眼神，


  以及看著第八區醫院被都城空襲燒為殆盡的時候


  (圖)


  他的確絲絲牽動著觀眾的心


  而他看到Peeta還活著時候的情緒轉換


  我相信他是真心愛著他的~


  Jennifer Lawrence 每每都是能讓我感到驚喜呀!!!!! 好喜歡他呀!!!!!!




  而是主角卻又在這集沒幾個鏡頭的Peeta


  (圖)


  光是那些短短的鏡頭他就抓住了我的心呀!!!!!


  Josh你雖然矮(靠杯沒禮貌)~但你的演技果然從小訓練有差呀!!!!!!!


  (圖)


  尤其是那段看到Katniss的反應，


  其實讓我很想哭(但是我忍住了耶!!!)


  不過其實飾演 Peeta的Josh Hutcherson他在訪問中有說到


  "I did nothing to prepare physically for this role.


  I went on the CGI diet, computer-generated images.


  They just sucked my face down in post-production"


  他其實沒有特別為這部電影減重，而靠的是CGI電腦特效幫他減重的~


  不過看他瘦弱的樣子


  (圖)


  姐姐看了好心疼呀!!!!!!!!(干你屁事)




  另外還要來說一下的是飾演導演Cressida的演員Natalie Dormer


  (圖)


  我愛死他了!!!!尤其是看完<權力遊戲：冰與火之歌>後~嗚嗚嗚嗚


  (圖)


  裡面的演出真的很吸睛!!!


  不過在<決戰終點線>中就真的只是花瓶的存在~有點可惜~


  (圖)


  這位演員相當有魅力，


  可以說是集性感與帥氣於一身~個人相當喜歡這種特質的演員~


  (圖)


  好期待他<權力遊戲：冰與火之歌>第五季的表現呀!!!


  拜託馬丁爺爺不要賜死他~嗚嗚嗚嗚




  整部電影的音樂與歌曲都相當的好聽


  除了Lorde唱的主題曲之外，


  片中Katniss唱的"The Hanging tree"也是由Jennifer Lawrence本人獻唱的




  尤其後面搭上那段第五區的人一起合唱起義的片段


  真的是讓我在電影院內起雞皮疙瘩!!!!!


  不知道為何一直想到悲慘世界的"do you hear the people sing"


  順便來貼一下歌詞好了


  "Are you, are you Coming to the tree


  They strung up a man They say who murdered three.


  Strange things did happen here No stranger would it be


  If we met at midnight In the hanging tree.






  Are you, are you Coming to the tree


  Where dead man called out For his love to flee.


  Strange things did happen here No stranger would it be


  If we met at midnight In the hanging tree.




  Are you, are you Coming to the tree


  Where I told you to run, So we''d both be free.


  Strange things did happen here No stranger would it be


  If we met at midnight In the hanging tree.



  Are you, are you Coming to the tree


  Wear a necklace of rope, Side by side with me.


  Strange things did happen here No stranger would it be


  If we met at midnight In the hanging tree. "




  以上是不專業影評(?!)


  看完很期待完結的part 2


  因為朋友說會逼死我的眼淚~所以讓我們期待明年吧!!!


  這邊來放些幕後花絮跟照片w




  (圖)



  其實Liam Hemsworth側面跟他哥Chris Hemsworth真的是有夠像的


  優良基因必須保持(?!)


  (圖)



  不專業心得到此，謝謝大家的收看!!!!!


  --'
