title: '[新聞] 「飢餓遊戲」不下檔！　改編成舞台劇繼'
content: '新聞網址： (內有圖片)


  「飢餓遊戲」不下檔！　改編成舞台劇繼續演



  《飢餓遊戲》系列電影，前兩集全球票房賣破15億美金，約450億台幣，雖然明年將推出

  最終章，讓許多影迷都不捨電影落幕，但電影公司打算改編形式，把電影改編成舞台劇，

  預計2016年夏天在倫敦登場。


  電影《飢餓遊戲：自由幻夢I》：「我從來不想參加遊戲，我只想救我妹，還有讓我妹活

  命。」


  飢餓遊戲最新續集中，飾演女主角凱妮絲的珍妮佛勞倫斯在祭典上被反抗軍救走，而好友

  比德卻不幸落入都城手裡。


  電影《飢餓遊戲：自由幻夢I》：「比德是都城的武器，如同你是我們的武器。」


  凱妮斯只好與反叛軍領袖，一起共同對抗專制腐敗的都城。


  電影《飢餓遊戲：自由幻夢I》：「只有他能達成使命。」


  預告中還能看到已故影帝，菲利浦西摩霍夫曼的精采表現，劇組因為不想偽造霍夫曼的表

  現，堅持不用cg動畫呈現，在他過世後緊急重寫劇本，來彌補霍夫曼還沒拍的部分。


  電影《飢餓遊戲：自由幻夢I》：「留著訊息給史諾總統。」


  也隨著前兩集，全球票房賣破450億台幣，成績亮眼，明年即將推出最終章的消息一出，

  讓影迷非常捨不得，因此電影公司也決定將轉換形式，用舞台劇的方式繼續下去，預計

  2016年在倫敦亮相，同樣由電影改編成舞台劇的還有…。




  =========================================================================

  好棒噢超期待的~~~


  --'
