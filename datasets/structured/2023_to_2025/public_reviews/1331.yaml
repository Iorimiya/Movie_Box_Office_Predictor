url: https://www.ptt.cc/bbs/movie/M.1416672266.A.936.html
title: '[微好雷] 飢餓遊戲3'
content: '沒看過小說。


  飢餓3-1跟前兩集的走向是截然不同的，若是你著重在打殺刺激感，可能只會覺得這部枯燥乏味。

  在刺激感上，遠遠比不上第二集給的震撼力；但單就感情層面來看，一、二集比起來是較少琢磨到。


  以下是比較印象深刻的段落：


  第八區的醫院，那些奄奄一息的傷者對照被殘忍的都城全數殲滅，katniss對都城革命宣言由此產生，「我們將與你同歸於盡」這段劇情雖然老掉牙，但心裡還是很有共鳴。


  還有這部洗腦歌hanging tree，搭配在人民攻進水壩時，有種說不清的悲哀感，他們知道無一倖免，但他們仍起身反抗。水壩是我私自認為這部3-1拍得最好橋段，它讓我在腦海中激盪數遍。


  在Katniss跟Gale去打獵時，他們準備獵殺一隻鹿，katniss稍稍碰到樹葉，只見鹿觀察四週，卻無逃跑之意，這時katniss說：「牠竟然不怕我們」而Gale則說：「因為牠沒被獵殺過」養尊處優的人，從來就無法體會低下階層的人的感受。


  但這部片被人認為拖戲也不是沒有理由，就如katniss去12區兩次（我認為相當多餘）或是一直重複拍攝、回復對方的話而拍攝。

  還有最後peeta的失控很出乎我意料之外，還在螢幕上的正常跟發狂的樣子，距離時間有點太相近，而且還剛好是剛被救回來的時候發狂...XDD

  除此之外，覺得結尾真的是很爛，比較喜歡第二集的結尾。


  整體來說，沒有很大的震撼感，平淡但動人，角色也都詮釋的不錯，不過若是喜愛刺激感，那就看3-2會比較適合。爛不爛是很主觀的，沒有最好看的片，只有合不合口味的片。



  --'
