content: "這篇不是談飢餓遊戲的觀影心得,\n\n近年來有不少以青少年為主角群的電影,飢餓遊戲 暮光之城 移動迷宮 哈利波特(?)\n\n有很大一部分的影片是原著改篇,本來就是書迷青少年取向\n\
  \n可是這又不像YA電影,之前還跟朋友說錯...\n\n飢餓遊戲似乎是其中比較有意思的片子,不過我還是一點也不想看暮光之城...\n\n\n這類片子算劇情片吧?\
  \ 沒有一點喜劇意味阿\n\n--\n\n◢\n◣         \n◤◣      \n◣  \n\n\n--\n我發現在票價便宜的戲院 工讀生都搶著進場來打掃趕人\
  \    當然這是題外話\n太早走 沒看到 哀"
