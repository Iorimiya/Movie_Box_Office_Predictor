url: https://www.ptt.cc/bbs/movie/M.1419738452.A.B89.html
title: '[分享] 飢餓遊戲3-1插曲"The Hanging Tree"'
content: "年初補了飢餓遊戲一二集電影後 又去把小說一二三集找來看\n那時就決定年底一定要進戲院看電影3-1\n看完感覺拍得不錯 珍妮佛羅倫斯的演技也很棒\
  \ 把凱妮絲笨拙跟激昂的樣子演得活靈活現\n因為時間比較晚 板上心得大多被寫光了 因此來分享片中插曲\n\n一二集時給觀眾印象較深的插曲 威武莊嚴的施惠國國歌\
  \ \"Horn of Plenty\"(豐饒角)\n之前在板上分享過 在3-1時仍有出現在都城的宣傳廣告中\n\n\n小說中 只有說在都城貢品出場時有播放國歌\
  \ 至於歌名,歌詞,歌曲 都是電影原創\n而3-1的這首\"The Hanging Tree\"則不同 是書中就有歌名和歌詞的一首歌\n原著中當凱妮絲和攝影小組來到12區時\
  \ 其中一個\"去聲人\"攝影師要求凱妮絲唱一首歌\n於是凱妮絲唱了以前爸爸教她的這首\"吊人樹\"之歌 唱完後發現已經被錄下來\n而在電影中進一步演出這首歌經過13區的宣傳後\
  \ 在其他區被當作革命歌曲的情形\n是公認成功的改編之一 也成為本系列超越國歌的洗腦歌XD\n\n以下分享歌詞\n\nThe Hanging Tree    \
  \                             吊人樹\n\nJames Newton Howard featuring Jennifer Lawrence\n\
  lyrics by Suzanne Collins                        歌詞：蘇珊‧柯林斯\ncomposed by Jeremiah\
  \ Fraites and Wesley Schultz  翻譯：鄧嘉宛\n\nAre you, Are you                       \
  \          妳要，妳要來嗎？\nComing to the tree                               到這兒來，到樹下來。\n\
  Where they strung up a man                       他們在這裡吊死一名男子，\n they say murdered\
  \ three                           說是有三個人被他殺死。\nStrange things did happen here  \
  \                 這裡真的發生很多怪事，\nNo stranger would it be                         \
  \ 最古怪的卻是\nIf we met up at midnight in the hanging tree     一旦我們子夜相會於吊人樹。\n\nAre\
  \ you, Are you                                 妳要，妳要來嗎？\nComing to the tree    \
  \                           到這兒來，到樹下來。\nWhere the dead man called out          \
  \          吊死的男人在這裡大聲叫號，\n for his love to flee                              要他的愛人快快逃。\n\
  Strange things did happen here                   這裡真的發生很多怪事，\nNo stranger would\
  \ it be                          最古怪的卻是\nIf we met up at midnight in the hanging\
  \ tree     一旦我們子夜相會於吊人樹。\n\nAre you, Are you                                 妳要，妳要來嗎？\n\
  Coming to the tree                               到這兒來，到樹下來。\nWhere I told you to\
  \ run,                         在這裡我曾叫妳快快走，\n so we'd both be free              \
  \                好讓我們倆都得著自由。\nStrange things did happen here                   這裡真的發生很多怪事，\n\
  No stranger would it be                          最古怪的卻是\nIf we met up at midnight\
  \ in the hanging tree.    一旦我們子夜相會於吊人樹。\n\nAre you, Are you                    \
  \             妳要，妳要來嗎？\nComing to the tree                               到這兒來，到樹下來。\n\
  Wear a necklace of rope,                         戴上繩索的項鍊，\n side by side with me.\
  \                             與我在一起肩挨著肩。\nStrange things did happen here,      \
  \            這裡真的發生很多怪事，\nNo stranger would it be,                         最古怪的卻是\n\
  If we met up at midnight in the hanging tree.    一旦我們子夜相會於吊人樹。\n\n\n電影版本由\"The Lumineers\"\
  樂團的Jeremiah Fraites和Wesley Schultz作曲\n詹姆斯.紐頓.霍華featuring珍妮佛羅倫斯演唱 (不知是什麼意思 只聽到珍妮佛的聲音)\n\
  \n\n歌詞跟原著有些許不同 可能是為了配合歌曲音節作的改動\n像是每段最後一句變成\"If we met at midnight in the hanging\
  \ tree\" 少了一個\"up\"\n第一段的\"they say who murdered three\" 加了一個\"who\"\n第二段的\"Where\
  \ dead man called out\" 少了\"the\"\n還有第四段的\"Wear a necklace of hope\" 原本的\"繩索的項鍊\"\
  改成\"希望的項鍊\"\n這是片中普魯塔特的巧思 為的是激起各地反抗軍的希望XD\n\n另外早在電影上映前 就有等不及的國外粉絲先為書中的歌譜曲演唱了\n其中這個版本的\"\
  The Hanging Tree\"我覺得很棒 一起分享一下\n\n但這邊中段都變成 Strange things did happen here no stranger\
  \ would it \"seem\"\n害我不太確定原著歌詞到底是be還是seem\n\n最後分享剛發現的中文字幕版搭配電影畫面\n\n果然這首歌還是後段第五區的人們一邊合唱一邊奮不顧身的衝向水壩那邊最讓人有共鳴\n\
  一首凝聚人心的歌曲的確對革命有很大的助力\n讓人想起去年夏天跟今年春天 台灣人民走上街頭時\n也高唱悲慘世界名曲\"Do You Hear the People\
  \ Sing\"改編的\"你咁有聽到咱的歌\"的畫面\n\n--"
