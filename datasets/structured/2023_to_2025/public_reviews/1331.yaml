url: https://www.ptt.cc/bbs/movie/M.1444300039.A.AC9.html
title: '[新聞] 《飢餓遊戲最終章》預告曝光　小珍妮佛'
content: '《飢餓遊戲最終章》預告曝光　小珍妮佛怒喊：除掉總統


  2015年10月08日 14:56 記者許瑞麟／綜合報導


  《飢餓遊戲》從2012年首集上映以來，獲得極高的電影票房和討論，不但捧紅片中一票演

  員，連原著小說都暢銷至今，而受到全球影迷熱切期盼的《飢餓遊戲：自由幻夢最終章》

  （The Hunger Games: Mockingjay Part 2）近日也釋出全新預告，展現最後一集的磅礡

  氣勢。


  在預告片中，可以看到珍妮佛勞倫斯（Jennifer Lawrence）所飾演的凱妮絲將率領施惠

  國各地區的人民對抗史諾總統，只見她充滿氣勢，從原本獨自1人走在都城的道路上，直

  到集結愈來愈多的民眾，感覺1場激烈的戰鬥即將引爆。而連恩漢斯沃斯（Liam

  Hemsworth）、喬許哈契森（Josh Hutcherson）、伊莉莎白班克絲（Elizabeth Banks）

  、茱莉安摩爾（Julianne Moore）及已逝演員菲力普西摩霍夫曼（Phillip Seymour

  Hoffman）都將回歸演出，本片將在11月20日於台灣上映。




  --'
