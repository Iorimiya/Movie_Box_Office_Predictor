url: https://www.ptt.cc/bbs/movie/M.1481908170.A.D97.html
title: '[新聞] 俄富豪搞真人版《飢餓遊戲》 殺人強姦都可以'
content: '俄富豪搞真人版《飢餓遊戲》　殺人強姦都可以






  真人版《飢餓遊戲》明年7月可能成真！俄羅斯富豪Yevgeny Pyatkovsky祭出130萬英鎊（

  約台幣5200萬）的誘因，計畫吸引30名參賽者，在西伯利亞荒野挑戰生存9個月，除了要

  面對毒蛇猛獸，彼此廝殺、強姦也都允許，簡單說就是愛怎樣就怎樣！


  這個實境秀名稱《Game 2：Winter》，據英國鏡報報導，這個實境秀會在900萬平方公尺

  的大針葉林舉行，其中埋藏2000多部攝影機，節目24小實不間斷播放。


  30名參賽者男女各半，必須年滿18歲且身心健全，而且還需要先支付13萬2千英鎊（約台

  幣500萬）參加費，再簽下同意書，不論在比賽中受傷、死亡，都與節目無關。


  參賽者必須在零下40度的惡劣環境度過9個月，誰能過得了就能平分獎金。但節目也有設

  定保險機制，只要按下緊急按鈕便可棄權。這個節目將會翻譯成英語、法語、德語、西班

  牙語、中文及阿拉伯語，預計明年7月拍攝。（謝昇璁／綜合報導）


  --'
