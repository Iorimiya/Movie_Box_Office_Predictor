url: https://www.ptt.cc/bbs/movie/M.1448001881.A.E8A.html
title: '[好雷] 飢餓遊戲:自由幻夢最終章-遊戲不曾停止'
content: '又完成了一個系列作的旅程

  追了一整個系列 不管好看難看還是乖乖買票進戲院

  畫下一個完整的句點


  我看過原著，但不是書迷

  當初一次三本看完

  其實到第三集時

  腦袋裝了太多東西 匆匆看完 沒有太大感覺

  只覺得很混亂 草草結束



  但當文字實體化後

  這樣的缺點更顯而易見

  在我看來 電影基本上就是照著原著走　

  以戲劇張力來說

  這部電影沒有所謂的高潮

  後半部有點無力

  我想很多人看完以後可能會有:蛤?就這樣結束了?的感覺

  可能很多人也會覺得無聊


  這也是我很難對這部電影下評價的原因

  就娛樂性而言

  如果要我推薦這部電影 我會說他不好看XDDDDDDD

  因為這不是一部爽片

  想要看凱尼絲痛快殺掉史諾復仇大快人心場面的人

  對不起，你會失望


  但如果你是書迷 喜歡原本的結局

  又或者你能理解作者想表達的意義

  又或者你喜歡凱尼絲和比德之間深厚的情感

  又或者你是珍妮佛羅倫斯的影迷

  那我覺得這部片還是值得一看的




  以下是劇情











  這集從上一集比德襲擊凱尼絲之後開始延續

  對於凱尼絲而言 史諾將她最愛的人變成變種

  摧毀比德與她之間那種無人能取代的連繫

  從內心折磨她 使得凱尼絲對史諾起了強烈的殺意


  於是凱尼絲一意孤行 偷溜到都城

  想自己暗殺史諾

  柯茵發現她跑走之後 派了一個小隊跟著她 任務是專門拍MV

  但是就算是拍MV也是危險重重

  都城埋伏太多 每幾步路就是死局

  於是隊友開始一個個領便當 還有我最愛的帥哥芬尼克> <


  到最後離總統官邸只差一步

  都城卻對城外難民兒童投下防禦炸彈

  激起都城人民不滿 倒向反叛軍

  於是史諾終於垮台


  但想想看

  有哪個政治人物會做這種無異是自我毀滅的腦殘事情

  和史諾見面後 凱尼絲這才發現

  這一切都是柯茵的陰謀，目的就是要奪權

  而為了要幫妹妹小櫻報仇(對 小櫻在爆炸中掛了)

  她在處決史諾的儀式上

  一箭把柯茵從近在眼前的權力高位射下



  其實結局非常好猜

  所以顯得非常平淡

  一開始我也覺得很空洞

  但後來想想

  凱尼絲之所以這麼有魅力的原因

  就是她不受控制 一切行為皆出於本心



  她不想介入政治鬥爭

  扮演學舌鳥只是因為想為12區復仇

  她說:偏偏我是最懂私慾殺人的人

  最後那箭 她仍然是做出遵從自心的選擇

  不管自己是否會死 她一心就是想為小櫻復仇

  也或許 死亡在她面前也顯得不重要了


  但即使復仇過後

  內心的傷痛卻依然存在

  只有比德 兩個互相知道彼此傷痛的人

  才能給凱尼絲安慰

  最後就是兩人平凡的生活做為結尾


  喜歡最後凱尼絲對寶寶說的話:


  「噩夢始終徘徊不去，但我會教你如何面對它的方法」(大致意思 可能有誤)


  只要人的心源著私慾 像飢餓遊戲這樣的場面就會一直發生

  但心中保有那份善良本性

  終會度過每個難關



  所以憑著對凱尼絲的愛

  我還是給這部片好雷

  電影拍的還是不錯

  想看的人還是可以去看

  每次舉學舌鳥手勢那裏 都還是讓人很感動阿~~~~~~~~







  --

  死好慘QAQ

  沒有

  被變種圍攻....非常慘

  比德真的很沒用

  還拖累大家

  但我還是愛他XDDD

  我想他不是那種會為了自己偏安

  而不上戰場的人

  沒有比德我想她可能會一直走不出來


  從情節安排來看

  小櫻一定要死

  不然凱尼絲沒有殺柯茵的理由


  只能說一切從小櫻開始

  也因小櫻結束

  這場遊戲根本沒有所謂的勝利者

  每個人都是在權者私欲之下的犧牲者

  比德和凱尼絲都失去了家人

  但也因此最後兩人的平淡才令人感到欣慰


  超傷心的QQ


  真的 但沒有 QAQ 而且我忘了小櫻會死

  看到時差點罵髒話orz

  暫時忘記身高只看臉XD

  其實我覺得演得不錯了

  但是氣場還是小珍大勝

  兩個男生都是

  感覺可以有更好的選角

  也是照著書走

  我覺得拍還不錯

  但不會有看完覺得很好看的暢快感XD

  但還是推薦 哈哈


  QAQ 即使早就知道結果 還是很難過

  特別是他叫著凱尼絲名字的時候...

  握手!自始至終比德派 從小說到電影都愛比德 XD

  對 你說的沒錯

  我有想到但當時打太快忘了寫

  謝謝你的提醒

  柯茵如此罔顧人命 跟史諾根本一樣'
