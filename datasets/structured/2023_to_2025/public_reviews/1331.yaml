url: https://www.ptt.cc/bbs/movie/M.1686620823.A.D65.html
title: '[新聞] 珍妮佛勞倫斯願意回歸《飢餓遊戲》'
content: "新聞網址：\n\n原標題:\n\n\n\n奧斯卡影后珍妮佛勞倫斯（Jennifer Lawrence）憑藉《飢餓遊戲》（The Hunger Games\n\
  ）系列電影中「凱妮絲」一角，而成為家喻戶曉的好萊塢巨星。近日她為即將於 6 月\n 23 日上映的新電影《珍愛硬起來》（No hard feelings）進行一段視訊訪談，主持人卻\n\
  問起再次出演《飢餓遊戲》的意願，珍妮佛勞倫斯毫不猶豫的表示「願意」，引發熱議！\n\n\n\n珍妮佛勞倫斯願意再次出演《飢餓遊戲》！\n\n珍妮佛勞倫斯（Jennifer\
  \ Lawrence）近日正為新作品《珍愛硬起來》（No hard\nfeelings）做宣傳，在劇中她飾演 32 歲的 Uber 司機，受僱於一對富裕夫婦，並與他們\n\
  \ 19 歲的兒子約會，幫助對方在上大學之前擺脫內向，以換取一輛車。然而接受採訪的過\n程中，\n\n\n\n然而《飢餓遊戲》的前傳電影《鳴鳥與游蛇之歌》（The\
  \ Ballad of Songbirds and\nSnakes）也即將於今年上映，該劇由湯姆布萊斯（Tom Blyth）擔綱男主角，女主角則找\n來瑞秋曾格勒（Rachel\
  \ Zegler）飾演，故事聚焦於在大反派「史諾總統」，預計於 11\n月 17 日上映\n\n\n--"
