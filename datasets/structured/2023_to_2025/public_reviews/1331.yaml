url: https://www.ptt.cc/bbs/movie/M.1690958355.A.6F7.html
title: '[請益] 為什麼飢餓遊戲Mockingjay是自由幻夢?'
content: ":\n\n《飢餓遊戲》（英語：The Hunger Games）是一個科幻反烏托邦冒險電影系列，獅門出品\n，根據美國作家蘇珊·柯林斯的《飢餓遊戲》三部曲改編。這個系列由妮娜·雅各布森監\n\
  製，三大主角凱妮絲·艾佛丁、比德·梅爾拉克和蓋爾·霍桑分別由珍妮佛·勞倫斯、喬\n許·哈卻森和連恩·漢斯沃主演。兩名導演執導過這個系列，蓋瑞·羅斯執導首齣電影，\n\
  法蘭西斯·勞倫斯執導其餘三齣電影。[1]\n\n首齣電影《飢餓遊戲》已於2012年3月23日上映，並創下開畫日（$6730萬）和非續集電影\n開畫週末的最高票房紀錄。在它上映之時，這齣電影的開畫週末總收入（$1.525億）是北\n\
  美洲所有電影的第三高。這齣電影不論口碑還是票房都很成功。\n\n第二齣電影《飢餓遊戲：星火燎原》已於2013年11月22日上映，並創下有史以來最高的11\n月份開畫週末票房紀錄和當時所有電影開畫票房第六高，總共是$1.581億。這齣電影不論\n\
  口碑還是財務都很成功。\n\n《飢餓遊戲：自由幻夢》，小說系列的第三本亦是最後一本，會改編成兩齣長篇電影。《\n飢餓遊戲：自由幻夢Ⅰ》於2014年11月21日上映，而《飢餓遊戲：自由幻夢II》於2015年\n\
  11月20日上映。    (節錄wiki)\n\n\n--------------\n\n請問一下，飢餓遊戲-自由幻夢\n為什麼英文叫Mockingjay，英文有這個詞嗎?\n\
  \n他有什麼特殊涵義嗎?\n\n\n個人很喜歡這系列小說改編的電影\n很有宏觀的藝術氛圍\n\n順帶一提，他的第三部電影\n\n\n\n飢餓遊戲：鳴鳥與游蛇之歌\n\
  Original title: The Hunger Games: The Ballad of Songbirds and Snakes\n\n預計在今年2023-11月上映\n\
  \n:The Hunger Games: The Ballad of Songbirds & Snakes  (youtube關鍵字搜尋)\n\n\n看會不會大賣~的可能?\n\
  \n--\n     讚~\n  我看過啊~看過\n\n\n對啊鳥就鳥JAY蝦餃\n\n我看過啊~最後攻城，董?"
