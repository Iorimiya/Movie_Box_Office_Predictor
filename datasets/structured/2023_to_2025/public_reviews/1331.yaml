title: '[ 好雷] 飢餓遊戲3 今年能不能不看的電影'
content: '凱尼絲情非得已的遊走在兩男之間 兩男為了她上演了一齣婊哥救婊弟的夢幻戲碼


  比墓光之城有過之而不及 把兩王一后的夢幻感發揮淋漓盡致


  (主人公換成男角完全被唾棄阿)





  飢餓三 完完整整把共產主義最終形態呈現出來


  二句 "各位請繼續按每日課表操課" "共享他人努力的成果"


  跟民眾宣布時 採談判式的方式宣布


  本魯蛇恍然大悟 這革命軍不就是眾魯蛇追求的 "開放言論自由式的共產國家?"




  史諾總統就是大家唾棄的資本主義政治  就像台灣每次到了選舉


  藍營打出的 "沒有經濟 台灣哪有未來" 與 "沒有施惠國 就好像沒有心臟"


  片中出現這種語氣 有沒有感到 deja vu?




  彼德就是個政客


  擷取from wiki一段形容他的話  "屬於商人階級 一開始會偽裝術"


  加上庶民蓋爾一句話道破重點  我就算被槍指著頭拷打我都不會講出這種話


  這不就是大家形容政客的話嗎


  最後政客被搞的精神分裂 因為想追求民主 又擺脫不了資本主義荼毒


  躺在床上也是應該的





  加上連嗆聲都用玫瑰 竟然用都這麼夢幻的灑玫瑰方式


  這麼夢幻方式 只應天上有





  最後


  這部女性夢幻度破表加上超現實主義寫實派的電影真的不看不行



  -


  --


  其實...心得都在第二段的第一個字..


  在開麥拉驚魂中 RDJ說了一句經典的話 大意是這樣


  "人家演弱智會紅 是因為努力的不要成為弱智

  而你演弱智 就真他媽是個弱智 這就是你的問題"


  飢餓3這部 導演想拍出挑動觀眾憤慨那個點

  結果就真他媽只剩這個點 這就是爛的問題點


  世間情電影版我猜都會比他強'
