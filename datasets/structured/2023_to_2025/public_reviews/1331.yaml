url: https://www.ptt.cc/bbs/movie/M.1448633465.A.96A.html
title: 'Re: [  雷] 飢餓遊戲-蓋爾工具人'
content: "我是飢餓遊戲系列作的腦粉\n從泰勒絲的 Safe and Sound開始\n就對這部小說有很大的共鳴\n今天才去美麗華補完最後一集\n\n\n\n\
  小說雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n其實在那個虎娘子(貓臉)的地下室裡面\n凱妮絲聽到兩位男主角的對話\n\n蓋爾「那是凱妮絲的問題，看要選誰。」\n\
  \n比德「只想知道，她會怎麼做決定。」\n\n蓋爾「凱妮絲會選擇她一但失去，就無法存活的人。」\n\n\n這一段電影沒有著墨太多，\n在小說裡她卻很難過聽到蓋爾這樣說，\n\
  \n「一點也看不出愛情或慾望，或起碼氣味相投，會左右我的決定。」\n\n但也證明了蓋爾是很了解凱妮絲的\n在最後凱妮絲選擇了比德後，\n她有一段自白，\n\n\
  \ 「為了存活下去，我需要的不是蓋爾的烈火，用憤怒和仇恨點燃的火。我自己已經有足\n夠的火了。我需要的是春天的蒲公英，明亮的黃，意味著重生，而非毀滅。」\n\n\
  其實蓋爾是很了解凱妮絲的，只是電影沒有詮釋出來。這點很可惜，他們不只互相理解，\n也彼此相似，「燃燒的女孩和復仇的火焰」，但也因為如此，凱妮絲不選擇蓋爾而選擇比\n\
  德。\n\n\n\n很喜歡這系列作品，對電影的期待也蠻高的，基本上除了第一集電影以外我都很喜歡，小\n說翻拍電影後我都不敢抱太大期待，這部是少數沒有讓我失望的。\n\
  \n\n\n\n進電影院前要想一下，如果你看過前面兩部，而且還蠻喜歡它的劇情，這部不會讓你失望\n，但是如果你希望它像第一集一樣是類似大逃殺的動作片，那還是挑別部看吧！這系列對\n\
  感情和性格的著墨比血腥更多的多。\n\n--"
