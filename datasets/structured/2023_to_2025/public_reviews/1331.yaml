url: https://www.ptt.cc/bbs/movie/M.1417611154.A.92E.html
title: '[負雷] 飢餓遊戲3'
content: "防\n\n\n\n雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n基於一和二都看過了，所以想說去看第三集\n\n\n結果有點後悔啊，之前有看過小說的人說「小說end很差」可能是這樣，電影也…\n\
  \n首先是整個片有約2/3在講拍廣告\n\n「當一個革命軍，不是攻下一座城堡…」\n\n不對，當一個革命軍當然要攻下一座城堡\n\n總之，和前二部比起來，這部太多的文戲，而且安排的並不好。當然有人會說它不是動作\n\
  片，但是前二集都是啊，你看了二集的變型金鋼，結果下一集是愛情片，這很怪吧?\n\n整個故事加強了主城和13區的對立，但是有一直老調重彈的感覺\n\n還有本片最大的動作場景…\n\
  \n女主角用………\n\n………\n\n………\n\n最後男主角被男二救回來也很奇怪，怎麼想都是把男二的部隊打死比較有用吧\n\n我知道男主角被洗腦可以打擊女主角，可是其他人呢?其他人都沒有被洗腦啊，這總統人\n\
  還滿好的，該不會最後發現他是自己人吧?\n\n總之這片我給的分數很低就是了\n\n--\n\nQ:一個人出名之後會變成什麼?\n\n             \
  \                     A:\n\n--"
