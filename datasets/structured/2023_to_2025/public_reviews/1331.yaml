title: '[好雷]飢餓遊戲這男主角也選太成功了吧...'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這次選角是真的屌欸


  先前完全沒演過大片 直扛飢餓遊戲男1 然後超投入在演


  全部看過的都在討論他是誰


  好萊塢白人帥哥競爭很激烈ㄉ


  曾格勒也完全是認真在演跟唱


  Viola Davis戲份多多的


  而且第三部分風格大轉 竟然還有點詩意 ?


  就是那種鐵幕時代你會聽到的淒美故事


  我還以為是在看Pawel Pawlikowski ?


  主題曲也沒有隨便找 維持傳統好聽


  這次重啟難度絕對比導演在拍前傳2.3難很多


  能拍成這樣只能說厲害....


  重點是又捧紅一個超新星 好萊塢現在真的需要帥哥美女來救啦



  --'
