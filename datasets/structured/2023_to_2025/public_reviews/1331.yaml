title: '[ 極好微雷] 飢餓遊戲前傳 神作'
content: '先說本人是飢餓遊戲系列粉絲，所以心得大概會很主觀。


  總之非常好看，完全承襲飢餓遊戲的核心精神，反抗強權，勾心鬥角和人性刻畫都描寫得很

  到位。我還來不及看完前傳小說所以不知道劇情省略了多少（書超厚像磚頭一樣= =）但是

  電影本身故事就講得很完整了。

  導演真的很有料，除了很會導之外我發現他的電影選角都超神，康斯坦汀就是他的作品基努

  李維被他拍得帥到翻。這部也一樣，從主角到小配角幾乎每個都讓人印象深刻。

  Rachel 非常美而且歌聲極好，是Lucy的完美人選，而且每一個造型都非常好看。男主角更

  是帥得要死，而且眼睛是漂亮的冰藍色，和他的名字snow超合。之前沒看過其他作品但是他

  演技真的好，電影一開始到後段他人格的改變有感受到，希望之後能夠看到他繼續活躍。

  這部有一點大勝本傳就是感情戲的部份，本傳Katniss什麼都好就是搞三角戀搖擺不定超煩

  ，我一開始還站錯cp以為他會和蓋爾在一起，氣死。這次男女主談戀愛時就很直接甜甜蜜蜜

  的，女主甩人時也超乾脆，讚啦。片尾曲Can''t catch me now歌詞非常符合本片劇情也很好

  聽，很推大家聽聽看。

  對了，片中有提到Katniss這種植物，也有出現學舌鳥，大概算是本傳的小彩蛋，看到時頗

  驚喜。

  總之十分推薦，特別是喜歡飢餓遊戲的話必看。



  --'
