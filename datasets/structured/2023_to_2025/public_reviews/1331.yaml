url: https://www.ptt.cc/bbs/movie/M.1417362390.A.F8E.html
title: '[微負雷] 飢餓遊戲3-自由幻夢 最後可惜之處'
content: '-----------防雷線-----------------



















  雖然身邊不少朋友都不推前半段  但一二集都看了  第三集當然還是要追一下


  的確是很忠於原著沒錯  但...最後面要去營救人質時  既然場面都做了


  為何不做精彩點?  讓我們知道一下救人質的過程 好歹有個打鬥畫面吧?


  虧我還以為你們會有什麼東西衝出來 都摀住耳朵 怕被聲音嚇到


  結果.............什麼都沒有  給我一道白光?...  當場輕柔的說了一聲:乾


  這明明可以拿來做為前半段最精彩的地方  真的非常非常可惜


  電影結束後  至少有一半的人在碎碎念 ... 好爛喔


  如果在最後面有精彩的營救人質打鬥畫面  我想評價會差很多













  --


  說實話 我會覺得打鬥畫面比較震撼 掐她是小說早就有的...


  既然做成電影 應該就是可以把小說的劇情擴大呈現出來


  小說 是寫說我方直接營救完  但其實可以做大場面   雙方互攻擊


  最後再假裝讓他們離開


  直接放他們離開 真的很假= = (雖然是小說)'
