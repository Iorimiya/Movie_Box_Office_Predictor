url: https://www.ptt.cc/bbs/movie/M.1449611219.A.C0C.html
title: '[新聞] 引用《飢餓遊戲》男恐嚇起訴'
content: '引用《飢餓遊戲》男恐嚇起訴


  私訊對話情節 女友認為暗示殺人


  【楊永盛、蕭夙眉╱連線報導】引用《飢餓遊戲》情節和對話吃上官司！苗栗一名劉姓男

  子與女友分手後，因購買機車費用的數萬元分攤問題起爭執，劉男引用已改編電影上映的

  暢銷小說《飢餓遊戲》用語，透過臉書私訊傳給女友，女友認為對方暗示殺人，心生恐懼

  提告，檢方採信被害人說法，昨以恐嚇罪嫌起訴。


  檢警調查，被告劉原良（三十一歲）兩年多前外遇，跟當時未成年的蔡女（十九歲）同居

  ，育有兩歲大私生女；去年十二月間蔡女控訴劉男家暴，後來雙方分手，蔡女帶著女兒投

  靠父母。苗栗縣府社工科長張國棟說，家暴案未成立，小孩由蔡女母親照顧。


  無直接恐嚇字眼


  檢警調查，劉男多次要求復合被拒，雙方關係惡化！劉男自稱同居期間花錢買機車供蔡女

  騎乘，後來分手，兩人因購買機車的數萬元分攤問題起爭執。劉男自去年十二月二十一日

  至今年一月中旬，五度以臉書私訊跟蔡聯絡，傳了「遊戲才十分之一而已」、「Death

  game（死亡遊戲）」、「關於《飢餓遊戲》的介紹」、「先祝你生日快樂，生日結束，請

  你看《飢餓遊戲3》」等與《飢餓遊戲》相關的字句。


  蔡女指控，《飢餓遊戲》原著及電影情節為參與遊戲者，以各種方式將其他參與者殺死，

  唯一生存者才是勝利者，認為劉男傳送對話隱含殺死她的恐嚇意圖。

  檢方認為，小說《飢餓遊戲》中虛構的國度當權者，為懲罰叛亂，要求各行政區必須派出

  一對少年少女，到競技場內戰鬥，雖私訊字眼無直接恐嚇字眼，但男子引用《飢餓遊戲》

  就含有恐嚇的意思，昨以恐嚇罪嫌起訴。


  讓人害怕恐觸法


  律師張智宏說，此案是罕見的恐嚇起訴案例，被告雖在私訊字眼上，無直接威脅他人的字

  句，但提及《飢餓遊戲》聯結的劇情，間接傳達致人於死的意思，造成被害人恐懼，實務

  上應可構成恐嚇罪要件。律師黃雅琴說，字裡行間透露要加害別人生命、身體，讓人心生

  害怕，均可能吃上恐嚇罪官司，最重可處兩年徒刑。


  分手應慢慢疏遠


  台中市刑大科偵組長張承瑞指，年輕人常用網路用語「Ｐ」，有人解讀Ｐ為「屁」，有人

  解釋為「劈」，若因此導致對方心生畏懼，警方可依法受理偵辦。弘光科技大學諮商輔導

  中心主任陳彥樺說，文字和圖片的使用時機和場合很重要，像分手情侶使用《飢餓遊戲》

  對話，確實讓人感受威脅。提醒情侶分手，若對方利用手機等通訊軟體糾纏，勿一刀兩斷

  ，應採取慢慢疏遠方式，如對方有更激烈行動，則應立刻報警。


  《飢餓遊戲》小檔案


  ●作者：美國小說家蘇珊柯林斯（Suzanne Collins）

  ●出版：為美國青少年冒險科幻小說，2008年8月陸續出版《飢餓遊戲》、《星火燎原》

  與《自由幻夢》三部曲

  ●改編電影：2012年起陸續拍成電影上映

  ●故事情節：內容描述虛構國家「施惠國」，各行政區每年須各派出一對男女「貢品」參

  加「飢餓遊戲」，該競技場最後只能有一人存活

  資料來源：《蘋果》採訪整理




