url: https://www.ptt.cc/bbs/movie/M.1449651720.A.465.html
title: '[？雷] 飢餓遊戲3-2　屬於書迷的精彩結局'
content: '前半無雷後半有


  跟前面幾集一樣　這是很棒的改編　但不太能算是一部好電影　


  沒看過書就看不懂的問題比前面幾集更嚴重　


  劇情基本上滿沉悶的　主要是因為小說本來就這麼寫　


  不過電影已經修掉了很多小說的缺點和漏洞　


  書迷大概會很滿意但一般觀眾則相反


  演員把原本不討喜的腳色演得很吸引人


  劇情改編則因為不是從第一人稱出發　長出很多令劇情完整的段落


  但一般觀眾單看電影大概會看不懂而且被劇情搞得很煩躁


  這一集剩下的故事段落節奏不佳且劇情破碎很不討喜：


  前情提要＋故事繼續→刺激但不長的動作段落→休息→刺激但不長的動作段落→休息


  →接近目的地→爆點→內幕交代→爆點→結局


  看完只有"終於結束了"的感覺沒有精彩的感覺


  －－－－－－－－－－流水帳雷分隔線－－－－－－－－－－














  首先接續上集交代比德的病況和進展　去打第二區兼拍宣傳片


  芬尼克結婚但沒像小說強調是要宣傳　所以在電影中感覺有點突兀


  接著慈菇爆走偷渡要暗殺雪總統　被硬幣總統硬凹成拍片　


  小說中是單純要拍宣傳片　雖然慈菇偷渡也很扯　不過這樣改編比較強調硬幣的謀略


  接著就是短暫的刺激動作段落搭配長段休息時間文戲和前進的部分


  每次動做段落都是領便當時間　沒多久小隊長就領便當把領導權交給慈菇了


  所以他們在慈姑帶領下把拍宣傳片的目標改成進攻總統府


  文戲時間就是交代比德的病況進展和三人感情的發展


  大概因為一路上陷阱的追殺　他們前進速度超快　終於混入難民中要去總統府


  接著報春花妹妹就跟著醫療隊和難民小孩被反抗軍的陷阱炸彈殺了


  電影中有把蓋爾跟工程師解釋他設計那個陷阱炸彈的片段演出來　


  比小說清楚很多　不過容易被觀眾忽略


  故事接著就是慈菇在總統官邸亂晃最後跟健康不佳的雪總統對話


  跟觀眾解釋那個硬幣總統有問題　


  慈菇自願處決雪總統　在處決的儀式上　


  硬幣總統的演講很諷刺的成他自己死亡的註腳　


  什麼"跟著你真誠的心走"之類的東西　


  於是慈菇被拖去一間大房間關起來


  電影基本上把小說中慈菇的精神崩潰全刪了　只留下創傷後症候群的部分


  所以電影相對討喜很多　


  最後怎麼解釋慈菇處決雪總統殺成硬幣總統就只能草草帶過　用個赦免來解釋


  我嚴重懷疑本來這邊的段落不是預計這樣演的　


  搞不好還有很多後續戰後重建的相關劇情　


  不過因為演員過世　所以只好讓黑密契拿著信簡單跟慈菇交代後續　


  慈菇回家後原本小說中人民重建家園發展經濟的段落全被刪光了　


  只留下感情戲的部分　最後的慈菇抱著baby講的那一段話　


  只是把小說中的ＯＳ變成台詞而已　這樣的結尾還不錯啦　


  如果戰後重建的部分增加　再增加一些正面能量會更完整


  --

  減緩地球溫室效應你可以做到的十件事（節約能源）：

  1.多搭乘公共運輸交通工具             6.隨手關閉不需使用的能源 ex: 電燈或冷氣

  2.臨時路邊停車請記得熄火             7.不用氟氯碳化物噴霧產品

  3.開關冰箱次數盡量減少               8.多走樓梯減少搭電梯 （還可以順便減肥）

  4.多以晾衣服代替烘衣服               9.有錢人請買油電混合車為環保盡份心力

  5.少喝碳酸飲料                      10.多唸書少蹺課..少上PTT = =


  --'
