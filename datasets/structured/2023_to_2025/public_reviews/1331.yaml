url: https://www.ptt.cc/bbs/movie/M.1703715795.A.398.html
title: '[神好雷] 飢餓遊戲-機八女與入魔男的交織'
content: '先澄清聲明 這不是古阿莫說書 這不是古阿莫說書


  只是想要取個綽號XD


  我個人完全沒有看過飢餓遊戲  書本 電視啥的都沒看過就來看電影了


  實際上已經看完好一陣子  忘記打心得 現在補上




  總結  我記得電影演完 我覺得非常好看




  故事分成三幕  節奏很緊湊  有人反映最後很拖戲 我倒覺得張力拉滿


  很喜歡那種故意虐觀眾 故意戲耍觀眾  把故事人性刻劃到極致




  對我來說 很清楚的知道為什麼男主角會走火入魔


  他本來就是一個很有志向 很有目標的人  其實遇到女主角  只是推他一把而已


  因為表面上女主角  看似自由如鳥  根本是心機魔  從一開始身上帶蛇


  這種標準就是自以為是的雞巴女


  說什麼要唱歌只有自己想唱才唱的話  超級自我中心



  對比男主角


  男主角是一個如果利益不相衝  還能當善良人物  還能助人一把的人


  而姬芭女  根本就不會在乎別人的利益跟自己的利益  基本上想幹嘛就幹嘛


  這也導致最後根本沒有溝通  就直接兩個人爆發



  讓我覺得電影好看的就是這兩個人的性格對比 時而黑白 時而遊走灰色地帶


  兩個人互為表裡  幾乎是互相切磋 互相學習殘忍的人性


  這點跟現實人生也差不多


  加上 男主角好朋友的白痴雷舉動  那邊也很好看  描寫人的愚蠢


  以及人的背叛  還有猶豫不決心如刀割的各種場面都很棒




  基本上這部能討論的非常多 可以有很多衍伸的心得



  可以從男女感情切入  也可以從好兄弟友情分析  以及權力爭奪的政治都有


  講白了所有關係都是權力的拉扯


  有讀社會學或是聽過Foucault的人應該都很有Fu


  進入過學校或是職場小圈圈  也能從生活各種經驗體會到其中奧妙




  看完這部讓我對飢餓遊戲 肅然起敬  原本以為只是像墓光之城那種通俗作品


  沒想到這個前傳 讓我覺得超有深度  作者不是一般人


  寫角色跟故事的技術非常高超


  甚至都想去啃原著 或是買一本中文來紀念一下  越講越想去下單了XD




  這邊我就懶得再多去細節討論  反正台灣的劇本可以好好學


  最後要推薦一個YT的影片




  她講得很好  而且之前也做過直播說書  影片底下說明欄應該都找的到


  有興趣的去聽一下 會發現講得很完整就像是重看一次電影XD



  滿用心的內容 就順便推給各位




  總之我給這部非常好的評價  希望今年最後再去看的其他部也能如此有趣 精彩


  大推飢餓遊戲前傳


  我認為不需要做功課就能直接去看  對我來說  也是加分點


  以上


  --

  一半是指哪邊

  沒探究欸

  標題有寫啊 飢餓遊戲

  好啊我看看能不能塞下去

  我從來沒說我自己聖人欸  你這什麼護航

  你是不是想__人家 好氣好氣氣氣氣

  事實上她就是個雙標偽善的個性 你可能不懂什麼是人物性格分析吧

  的確有聽到這樣的聲音跟說法  我能理解有些人會覺得不夠

  不過我很喜歡小丑  小丑說 ONLY one bad day

  足以逼瘋人XD'
