url: https://www.ptt.cc/bbs/movie/M.1700973882.A.813.html
title: '[好雷] 《飢餓遊戲 ・前傳》好與壞的抉擇'
content: '首先、如果是還沒看過還在猶豫的人


  我建議不要看任何影評直接去感受


  因為我就是這樣

  很臨時的決定、沒什麼想法的就坐在電影院第六排開始這部電影。


  甚至是看完心裡想說這不就是在講前傳的感覺嗎？ 怎麼會是系列作。

  然後走出電影院一查才發現對欸這是前傳…

  但我覺得這樣挺好的。


  未免暴雷、這邊就只說一些感想：


  我覺得這部作品有異於前三部飢餓遊戲

  無論是風格、音樂、或是給人的感受


  有些時候可能會覺得拖沓、有些時候可能會覺得多餘、有些時候出戲、有些時候又突然感

  受到震驚


  電影如此、人生也是如斯吧。


  看完後我有那麼一刻很想打電話給所有的好朋友和家人說聲謝謝。








  以下有雷


  以下心得可能會有部分劇透露


  以下內容請還沒看電影的人迴避






  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  大師們的觀後感可以寫得很豐富和具有深度、不過我想只重點說說幾個感想：



  1. 前半似乎有些拖沓


  甚至記不太住電影內的一些細節和角色名字

  在緊張環節到來之前都有點沈悶感

  或者應該說劇情內容沒辦法一直吸引人



  2. 歌劇內容有些出戲


  因為本身也看過一些歌劇和歌舞電影作品

  深知那些作品的賣點就是唱歌和舞蹈、劇情和演技完全是其次


  這次飢餓遊戲的Songbird 、雖然女主角是真的長相討喜也不讓人覺得有何政確成分 （棒


  不過唱歌過程的力道、表情、姿勢

  加上運鏡方式和歌唱的時長， 我整個就很出戲

  感覺自己像在看歌劇表演…



  3. 歌曲的選擇沒什麼記憶點


  不同於各個經典電影作品的主題曲和插曲總是充滿記憶點、這次從電影院走出來後我很認

  真的想回想出電影內女主角那首讓大家都流淚的歌，但不僅是歌詞、連旋律我都想不起來


  回家後我才上網找了那首和其他電影的歌、然後重複聽很多次，女主角的聲線是真的棒



  4. 兩小時半的電影卻不會覺得時間太長


  我知道這樣講和第一點有些衝突（？） 不過我的感受的確是如此、有點越看越好看的感

  覺，看完後自身心情也有些受影響。 想到主角連吃塊餅乾都是這麼奢侈的事情就覺得我

  的日常小確幸真的都太幸福了。




  結語：


  男主的人生就像是你我的寫照


  很意外主角會選擇放棄家人和仕途跟女主角遠走高飛，結果在看到那把槍和聽到女主角的

  一些試探挑釁言詞後就又改變心意了。


  男主角演技真的很不錯、至少我都蠻入戲的。


  雖然不贊同、但完全能理解為何男主會做出那些決定。 人生很多岔路、很多支路、也很

  多的徬徨和阻礙，你沒辦法滿足每個人，也沒辦法同時做到滿足每個自己想做的選擇。


  就像你決定生小孩的那刻、就放棄了很多自己的生活和自由那樣，你沒辦法什麼都要。

  （這裡只是比喻）



  史諾嘗試過了


  他嘗試過順從自己的內心，結交不該深交的朋友、認識不該愛上的女人、做出不會被容忍

  的壞事。


  最後他發現他不是他想的那麼完美、當然這世界也不是。


  在這些混亂和衝擊後，如他自己所說：


  ”我把以前的那個我殺死了。”


  他開始接受現狀、開始明白社會和人生的險惡、開始往現在擺在眼前的道路邁進



  觀影後的沈悶感大概持續到隔天睡醒吧

  不會太沈重、但也不會無趣。 我喜歡這種些許負重感的結果、太沈重的電影我反而會想

  迴避


  整體來說我是蠻喜歡這部前傳作品的







  --


  評價這麼高！

  希望續集不要那麼歌劇內容、當成背景音樂還不錯…

  我本身是看一般影廳、iMax 應該會感覺更震撼吧我想！'
