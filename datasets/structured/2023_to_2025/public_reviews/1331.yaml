  在iTunes上架，但如果想要單集收續作的話，這次是個不錯的時機。另外，由美國前副總

  統高爾主持的環境紀錄片，也正特價到$150/部，第一集推出的

  時候在當時也引發不小的話題，成功讓許多人更加正視碳排放的影響，是相當具代表性的

