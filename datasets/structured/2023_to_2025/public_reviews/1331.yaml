url: https://www.ptt.cc/bbs/movie/M.1418396255.A.786.html
title: '[遲好雷] 飢餓遊戲3:沒看過1.2(補完後小疑問)'
content: "我是防雷頁~ ( 電影好像都快下檔了但還是防一下雷好了~)\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n我沒看過飢餓遊戲1.2集，也沒看過小說\n\n看電影前先瞄了維基的介紹 & 1.2.3集的預告片\n\n同行友人有告知第3集的故事是革命軍準備要推翻都城\n\
  \n本以為這部電影是大逃殺頗沒興趣，看完後卻覺出乎意料的好看~\n\n回來後找了前兩集來看，觀看順序是3→2→1 (奇怪的順序XD)\n\n這系列電影以劇情片而非動作片的角度來看個人還滿喜歡的~\n\
  \n喜歡程度是2>3>1，有幾個小疑惑想請教看過小說的各位\n\n來板上發現心得文很兩極，請大家鞭小力點Q_Q\n\n\n小心得 & 疑問:\n\n\n\n以沒看過1.2集的角度來看凱妮絲，她給我感覺是只想保護重視的人\n\
  \n並沒有想當什麼革命英雄的遠大志向，以救比得為交換條件\n\n才答應當革命軍的symbol，但她明顯不是擅長演戲的人\n\n面對鏡頭很不自然，兩支感動人的宣傳片(we奔you奔\
  \ & 吊人樹之歌)\n\n都是真情流露下的產物(分別刺激了兩波自主性革命好感動啊Q_Q)\n\n電影中失敗的宣傳片拍攝方式V.S.引導她真情流露的拍攝方式\n\
  \n這個表現手法把凱妮絲的個性鮮明的描述了出來\n\n\n\n\n凱妮絲加入革命的角度是以保護重視的人的\"小愛\"出發\n\n革命軍領導者的角度卻是以\"推翻都城\"\
  的大志向\n\n就像小老百姓在乎的是溫飽與當下所能把握的，與執政者要考慮的事物不同\n\n因此革命軍領導者是有策略的運用symbol來帶領大家前進\n\n雖然大方向的目標一致，電影中給我的感覺卻是一直有一些違和處:\n\
  \n例如: 革命軍女總統一開始給人感覺滿體貼(擔心保護不了凱妮絲不建議她回12區)\n\n但她答應了凱妮絲以營救人質擔任symbol的條件時\n\n卻是在大家還因為都城比得宣傳片群情激憤時\n\
  \n平鋪直述的對大家說出凱妮絲的條件，引起一陣眾怒\n\n就有種 她怎麼好像有點故意? 的感覺\n\n再例如: 醫院被炸因而拍出很棒的宣傳片，女總統發表激勵士氣的演說\n\
  \n沒有特別提起罹難者，比起歡欣鼓舞的13區，凱妮絲顯得很哀傷\n\n再再例如: 史諾總統故意讓13區救回一個彈跳比得，\n\n女總統再次發表全員營救人質全身而退、推翻都城指日可待的演說\n\
  \n雖然順著情勢激勵人心是必須為之之舉\n\n卻不知這些革命軍領導高層與凱妮絲思考角度的差異\n\n是否在越接近成功的未來，會埋下發生歧異的導火線?\n\n總覺得事情不會那麼順利~\n\
  \n\n\n\n為救人質，先是芬尼克的宣傳片演講\n\n據說他以前很英勇，同行友人失望第3集他沒啥表現\n\n但芬尼克平靜、緩慢的訴說身為勝利者貢品背後的黑暗\n\
  \n不如表面的光鮮 (他好像有說到玩物什麼的? 有點忘記)\n\n還有提到史諾總統配戴白玫瑰是為了掩飾生病的口內血腥惡臭\n\n(補了第2集後看到比得凱妮絲都城假訂婚的宴會上，\n\
  \n史諾總統喝了一口酒又吐出來杯子裡上層是血，應該是指這個?)\n\n而這種秘密芬尼克竟然知道，感覺他過去也有段故事\n\n覺得芬尼克像個優雅又哀傷的貴公子~\n\
  \n請問小說中有寫到這段的內幕嗎? \n\n另外補看第2集後，結尾處芬尼克等人笑嘻嘻的迎接醒來的凱妮絲\n\n(凱妮絲還揍了黑密契) 那時芬尼克看起來頗正常\n\
  \n為何第3集他腳不能動了? 我錯過什麼了嗎? \n\n\n凱妮絲為了引開注意找史諾總統講話\n\n之後凱妮絲崩潰抱著黑密契說她同時失去他們了\n\n可以感覺蓋爾比得兩人都是她深深所愛\n\
  \n這裡的情緒對比竟然全身而退的救援小組\n\n怎樣想都很可疑，但安妮等人又很正常\n\n最後比得死命掐凱妮絲那邊真的讓人很衝擊~\n\n原來史諾總統的招是出在這!!(有被嚇到)\n\
  \n這部分看了許多心得文也是引起兩極反應的地方\n\n總覺得若只是想來個出其不意的攻擊，雖達到目的但總覺有點薄弱\n\n(因為史諾總統感覺是個心思很深沉且決策精準的人)\n\
  \n直到補完1.2集，看到史諾說:\n\n「如果只是要嚇阻那些行政區，為什麼不隨機抽取24個人\n\n然後立刻全部處決，那樣不是更快?\n\n因為『希望』是唯一比恐懼更強烈的東西」\n\
  \n還有黑密契阻止捲捲鬍遊戲設計師殺凱妮絲時說:\n\n「你想製造一個烈士嗎?」\n\n我想史諾總統若直接把彼得蓋爾都殺了讓凱妮絲崩潰、\n\n或直接派軍機尾隨救援小組回革命軍那把他們炸光\n\
  \n那麼就製造出「烈士」，反而會引起大眾的激憤反抗\n\n像這樣大方的放人回去，對外可獲得大眾的好感:\n\n「是不是還有『希望』? 都城似乎也沒那麼壞」\n\n\
  對革命軍內部又能造成效果: 沒殺了凱妮絲也至少能重傷她\n\n折磨她、毀滅她的意志，讓革命軍的symbol站不起來\n\n沒有這個精神指標，那些暴民還能怎麼樣?\n\
  \n而且，最重要的: who knows?\n\n13區也不可能去宣傳革命的指標倒下了\n\n史諾總統真的很可怕、很聰明\n\n\n\n這是我第一次看珍妮佛演的電影，一開始注意力都放在她肥肥的手指(誤)\n\
  \n後來覺得好喜歡她~ 尤其是她微啞的嗓音好迷人啊~\n\n(補完1.2覺得她越來越漂亮，情緒轉折也不一樣)\n\n吊人樹之歌唱得好好聽，比原唱的版本更喜歡她唱的\n\
  \n題外話，歌的內容是相約在發生很多怪事、死了人的吊人樹\n\n還有提到曾要你快快逃、叫愛人快快逃\n\n卻又問你要來嗎? 你要來嗎?\n\n這是否有暗喻革命軍集結到危險都城的意思?\
  \ \n\n\n電影板首PO，不小心寫了太多，先感謝大家幫忙解答疑問~\n\n期待第三集下~ (不對，不能期待，期待就變不好看了XD)\n\n--"
