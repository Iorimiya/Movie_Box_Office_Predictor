title: '[新聞] 《飢餓遊戲》前傳 珍妮佛勞倫斯回歸客串'
content: "《飢餓遊戲》前傳 珍妮佛勞倫斯回歸客串\n\n【大紀元2025年12月11日訊】（大紀元記者葉子杰編譯報導）《飢餓遊戲：黎明收割》是\n《飢餓遊戲》系列的前傳電影，也是該系列的第六部電影。當地10日，傳出該系列正傳四\n\
  部曲的兩位主角珍妮佛‧勞倫斯和喬許‧哈契森將回歸客串演出。\n\n獅門影業的《飢餓遊戲》系列前傳電影《飢餓遊戲：黎明收割》（The Hunger Games:\n\
  Sunrise on the Reaping）即將於明年11月上映。週三，據好萊塢內幕人士傑夫‧史奈德\n（Jeff Sneider）透露，珍妮佛‧勞倫斯（Jennifer\
  \ Lawrence）、喬許‧哈契森（Josh\nHutcherson）也將回歸演出這部電影，再次分別扮演「凱妮絲‧艾佛丁」（Katniss\nEverdeen）和「比德‧梅爾拉克」（Peeta\
  \ Mellark）。\n\n他們上一次演出這兩個角色是在10年前的電影《飢餓遊戲：自由幻夢 終結戰》（The\nHunger Games: Mockingjay–Part\
  \ 2，2015）。兩人都出演過該系列的前四部電影。\n\n\n珍妮佛勞倫斯在《飢餓遊戲2》全球首映式上。（Getty Images）\n\n據《Variety》報導，《黎明收割》講述了16歲少年黑密契‧阿勃納西（Haymitch\n\
  Abernathy）參加第50屆飢餓遊戲的故事，時間則設定在凱妮絲和比德首次作為第12區代\n表進入殺戮戰場的前24年。至於凱妮絲和比德參賽時，黑密契是他們的導師，凱妮絲贏得\n\
  了第74屆飢餓遊戲。\n\n據報導，《黎明收割》是原作前傳，改編自蘇珊‧柯林斯（Suzanne Collins）最新小說\n。因為是前傳電影所以勞倫斯和哈契森的戲份可能不會太多。蘇珊的小說可能會透露一些\n\
  他們怎麼被安排，該小說結尾有一個後記，是黑密契向凱妮絲和比德講述他的過去，這暗\n示著電影可能會有跨越20多年的閃回場景。\n\n勞倫斯和哈契森客串出演的性質目前仍處於保密狀態。外媒也猜測，伍迪‧哈里遜（\n\
  Woody Harrelson）也會回歸繼續扮演年長的黑密契。目前已知，少年黑密契是由新人喬\n瑟夫‧札達（Joseph Zada）飾演。\n\n\n《飢餓遊戲》。（Catch\
  \ Play提供）\n\n《黎明收割》故事一開始，就會看到年輕的普魯塔克‧黑文斯比（Plutarch Heavensbee\n）在第12區記錄那裡貢品的抽籤儀式。這時他遇到16歲的黑密契，他是第12區的貢品，參\n\
  加第50屆飢餓遊戲。在未來，黑密契會成為凱妮絲和比德的導師，幫助她準備第74屆飢餓\n遊戲。\n\n法蘭西斯‧勞倫斯（Francis Lawrence）執導這部新電影，劇本由比利‧雷（Billy\
  \ Ray\n）改編。尼娜‧雅各布森（Nina Jacobson）和布萊德‧辛普森（Brad Simpson）擔任製\n片人，卡麥隆‧麥考恩（Cameron MacConomy）擔任執行製片人。《飢餓遊戲》系列五部\n\
  影片迄今的票房總收入已超過33億美元。\n\n《黎明收割》預定2026年11月20日在美國上映。\n\n責任編輯：蘇漾\n\n\n\n--\n 神韻晚會觀眾反饋（2025）\n\
  \n--"
