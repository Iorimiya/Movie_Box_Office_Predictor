title: '[ 蠻好雷] 飢餓遊戲-自由幻夢part II'
content: '看完感想是，深度足夠，爽度沒有。


  如同片名一樣，一切只是一場遊戲。


  所有的紛擾終究會有結束的一天，


  噩夢終究只是夢，撐過去就沒事了。


  自由，是不是就只是一種平靜的生活呢?


  看過小說的朋友說電影跟原著差不多


  可以說非常的平鋪直敘甚至可說是平淡


  前幾集都有看的朋友可以考慮追完這集


  至少它比上部曲好看很多...


  想看戰爭耗大血腥場面的朋友就不推薦


  --'
