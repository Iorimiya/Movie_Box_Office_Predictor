title: '[普雷]最後一集要有始有終[飢餓遊戲3 最終回] '
content: "劇照圖文好看無音樂:\n\n\n\n\n\n\n__________________________________________\n\n純文字:\n\
  左等右等\n終於等到了最後一集上映了\n當個有始有終的影迷\n趕緊進去電影院插旗了呀!!\n是說特地找周五下午三點去看\n人潮已經不少了\n看來這個週末 來看此片的影迷們應該會絡繹不絕~\n\
  沒辦法\n結局就是有這種魅力~~\n\n不多廢言\n進入主題吧!!\n\n\n這集的飢餓遊戲\n打鬥的片段比較少\n因為有太多劇情要交代了\n很多地方很快的就帶過去\n\
  中後面還出現變種人\n突如其來的出現 嚇死人了\n我還以為我在看恐怖片!!\n\n\n 64253.jpg\n決定進入官邸解決史諾\n孰不知其實自己早已是柯茵設下的旗子\n\
  然而這支明星隊伍 乍看之下很有看頭\n其實到從頭到尾重點還是擺在凱妮絲(我在講廢話嗎?)\n大家都很脆弱的說死就死\n就只有凱妮絲 九命怪貓\n也是 從頭到尾被攻擊了好幾次\n\
  每次都是險象環生 再來一次!\n看到最後 都不會被嚇到了XDDD\n(反正待會就又醒了這樣)\n\n\n  65836.jpg\n不得說 凱妮絲越看越漂亮\n\
  第一集時還覺得SOSO\n結果她是屬於耐看型的!!\n\n  65843.jpg\n這次出現頗短的艾菲\n其實我很期待她的出場\n可能是因為對她的穿著打扮很有興趣\n\
  每次一出場就非常吸睛\n這種前衛的服裝設計 真的讓人讚嘆不已\n\n  65847.jpg\n最後的大魔頭\n\n一直以為史諾才是最壞的\n沒想到 螳螂捕蟬 黃雀在後\n\
  最後的決策更像是第二個史諾\n也因為這樣\n引來了殺機  凱妮絲在最後選擇射殺了她!\n(反正眾目睽睽之下 史諾是活不了了 因此先射死柯茵再說)\n這種一箭雙鵰\
  \ 不按牌理出牌的凱妮絲\n真的讓人忍不住給她無限個讚這樣\n\n\n  65855.jpg\n最後一集 愛情的部分也是要交代一下\n可是凱妮絲阿! 你真的很多情XD\n\
  前面先吻了蓋爾\n後面卻選擇了比德.....\n其實我比較喜歡蓋爾說...\n\n\n\nmaxresdefault.jpg\n本片中唯一一幕令人感動的畫面!\n\
  凱妮絲真的是神了!!\n\n\n  activities3_782_1415010104.jpg\n 最後\n不得不說\n本片真的蠻衷於原著的\n至少該交代的幾乎都交代完了\n\
  \n感覺這一部片子就是在交代~\n所以沒有高潮迭起的感覺\n也沒有什麼視覺享受\n特效的部分運用的很少\n大多都是呈現一些劇情對話\n\n\n總之\n雖然有點失望\n\
  感覺不怕沒票房 所以有一點點\"青菜\"\n(廢話 最後一集了 大家當然會去看阿!!)\n但是還是不失本片的精彩啦\n(至少有始有終~)\n\n\n所以 有在追的影迷\
  \ 可以去追一下\n但是4D的就不用了 真的沒必要 不用浪費錢XD\n\n\n呼\n總算把本系列追完了~\n\n\n\n\n\n\n--"
