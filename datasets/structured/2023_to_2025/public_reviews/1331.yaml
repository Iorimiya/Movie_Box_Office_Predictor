url: https://www.ptt.cc/bbs/movie/M.1449649134.A.773.html
title: '[普雷] 飢餓遊戲：自由幻夢II'
content: '今天下午終於記得去看Hunger game了


  結果看的過程瞌睡蟲一直來


  是電影太無聊了嗎？


  只覺得電影真的太扯了！！


  好像只要是主角就會很弱但怎麼也死不了，然後大家都會幫她，願意為她犧牲奉獻，即使


  她有很多無腦行為都會讓她看起來更像英雄。


  整個過程就是不斷有壞人出現，一邊要利用女主角，一邊要把女主角幹掉，女主角夾在中


  間，看似很正義，其實就是個無腦人，旁邊有腦的人都會為她擋子彈去死，然後她說說話


  ，就會有一堆人跟她比三根手指頭，好像很厲害，然後中間就是一連串爆炸、槍擊、動作


  片，看著看著我就不小心睡著了～囧


  結果讓我最印象深刻、最有感的一幕就是：


  戰爭結束後，女主角失去小櫻很難過，回到家後，看到那隻小櫻曾經奮力為了救的貓坐在


  吧台上，女主角開始對那隻貓咆哮（P.S.貓超可憐的說），小櫻GONE!GONE!GONE!的


  一直叫～一直叫～


  我突然了解了，仇恨真的是件挺可怕的事，整個過程就是不斷地製造仇恨與對立，然後有


  心人士就會利用這些仇恨與對立來得到他or她想要的權利與榮華富貴，可憐的就是這些無


  辜捲入這些仇恨之中的人（or貓？！）。


  會這麼有感是因為本人從事醫療行業，常常對於人世間的生死感到很莫名、有時也覺得很


  無奈，身為醫療的第一線人員，我們也常常被病人家屬的情緒給波擊到，簡單地來說，我


  就是跟那隻貓一樣，曾經只能站在病人家屬前面，接受他們的咆哮，明明害他躺在病床上


  的不是我，為他執行醫療行為的也不是我，但我就是那無辜捲入這些事端之中的人們呀！


  如果病人家屬都能像女主角一樣，咆哮完貓咪後，還會良心發現，把貓抱起來秀秀就好，


  現實世界就是他不僅把你咆哮完一頓後，還要告你，讓你賠錢給他，讓你用你的生命為他


  負責，有沒有搞錯啊！！


  所以小說就是小說，現實世界就是現實世界，就算把史諾、柯茵全部殺光，還是會有千千


  萬萬個史諾、柯茵再度粉墨登場，這大概就是這部電影想要表達的吧～我想


  最後還是要宣傳一下：醫療人員不是神職人員，無法掌控生死，在傷心難過之餘，請不要


  對他們太過慘忍喔～～感謝大家把我的垃圾話看完


  就是篇電影心得而已，不需要太過認真尼～～


  --'
