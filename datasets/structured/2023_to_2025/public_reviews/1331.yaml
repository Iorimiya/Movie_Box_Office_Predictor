url: https://www.ptt.cc/bbs/movie/M.1448206679.A.AF2.html
title: '[普好雷]飢餓遊戲--自由幻夢II '
content: '趁著星期日看了兩部電影，一部就是這次的主題飢餓遊戲，一部是剩者為王。

  唯一要讓我覺得失望的就是習慣的秀X戲院竟然沒有上飢餓遊戲..只好換間看。

  但看完，接近原著的電影讓我出了戲院還是有種感傷在心頭盤旋不去，試著把這種感覺寫

  下來，希望可以表達的完整。



















  ---------------------防雷頁---------------------------------------------------

  由於版上很多人都寫了，我就針對另外的方面去寫自己的看法，可能有理解錯誤，再請大

  家多包涵。

  這部電影，其實真的需要輔助原著會比較容易進入情節，從一開始彼得的狀況到凱妮絲決

  心要進入都城，在那句會把彼得視為變種並且把他殺了的對話，這是第一個我看到對史諾

  最直接的恨(其實我也很恨.…..彼得在第三部變得好憔悴 還我原本的彼得！)


  再來，當他們到達第二區時，那句都城跟我們問早安，諷刺的口語也顯現史諾的殘忍，搭

  上在會議時兩派都不願意派出自己的人潛入奪取軍火，最後卻妥協於製造山崩。為此，其

  實兩方多半都還是有私慾，保留下自己的人民，但卻想要制衡都城，電影明顯對十三區科

  茵描寫較深。


  第三，當蓋爾被判出局時，其實在前頭埋了許久，就是那段戰爭是人的私慾那段，當蓋爾

  說出他覺得戰爭不是人的私慾，而是必要的犧牲時，針對他這點，他能成為指揮軍事家，

  帶頭只需要達到目的，但卻已經因為忘卻這些戰爭演變背後的原因，我想這或許是在十三

  區中所經過的改變。明顯在這時跟凱妮絲認為人與人之間不該再有戰爭，應該要砲口對向

  爭端的史諾有很大的分歧。當然最重要最後會沒有選擇他在於小櫻的結局其實是跟他脫不

  了關係，另外，凱妮絲可以沒有他而活下去。(從這幾部看來，凱妮絲真的是只有在彼得不

  在時會極力尋找，並沒有出現尋找蓋爾的狀況)


  最後，針對自己的想法，其實原本科茵屬意要解救的是彼得，源於彼得的好控制，但其實

  ，彼得是否能成為好棋子，我想這是科茵跟史諾心知肚明的，我想，如果整個立場交換，

  今日科茵或許是無法站上那個高位，更遑論把史諾綁在上面處決。

  畢竟，當整個小隊的犧牲，其實也是因為凱妮絲的天生學舌鳥魅力，我很喜歡他們所說的

  ，在當上明星小隊前，他們的出生跟死亡都是史諾的，只有推翻史諾，他們才有機會去改

  寫這一切，儘管日後或許因為人的健忘又出現下個史諾，但只有在當下，去試過才會有所

  改變。


  整部其實會顯得冗長的原因，我想是因為原著有太多需要描寫的部分，因此用了很多分鏡

  的鏡頭去詮釋，可能有些部分詮釋的不夠完整，所以對於沒有看過原著的觀賞者會顯得倉

  促，對於看慣張力十足刺激的人可能會顯得無趣。

  不過，如果可以，我還是會想再進影城看第二次，尤其是閱讀完原作之後，深刻感受到最

  後結局那種平凡，是目前最能撫平傷口，以及遠離噩夢的方式。

  沒有英雄、沒有政權，只有想守護的彼此。


  --'
