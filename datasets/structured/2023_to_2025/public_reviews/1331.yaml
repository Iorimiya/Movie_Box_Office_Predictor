url: https://www.ptt.cc/bbs/movie/M.1448895879.A.5B6.html
title: '[  雷] 飢餓遊戲四-可以好雷,可以壞雷,不能平雷'
content: "這部片實在很有意思, 它分成上下兩部, 共四集.\n   而從內容來看, 第一集跟第二集是動作片, 第三集跟第四集是劇情片\n   而我認為大部分沒看過書的觀眾.\
  \ 心理預期會是動作片.\n\n   以動作片來看的話, 第四集我認為是負雷.\n   首先他動作戲的比例不算多. 而且更糟的是, 女主角跟戰事完全沒關係.\n\
  \   所以以觀眾的角度來看, 我們根本不知道女主角到底在幹嘛.\n\n   戰事如下:\n\n   1)  一開始叛軍女首領是把女主角當宣傳模特兒用的, 功能在心戰喊話.\n\
  \   但是偏偏一開始就中槍了, 只好乖乖回去休養\n\n   2)  醒來之後, 女首領說了, 戰爭很順利, 女主角可以不用上戰場了\n   偏偏女主角不死心,\
  \ 一定要親自暗殺都城總統, 就自己溜上前線了.\n\n   3)  溜出去之後被拍影片的部隊收編, 跟其他人待在相對安全的後方.\n   好死不死拿到指揮權,\
  \ 帶著一群負責拍片的人往前衝到前線.\n   她有想到這些人只是來拍片的嗎?  沒有, 因為只想到她自己!\n\n   4)  等她殺到都城外圍的時候. 遇到空投炸彈,\
  \ 被炸傷, 回去休養\n   醒來之後被告知戰爭已經打贏了, 大家可以回家了.\n\n   至此, 動作場面都演完了. 觀眾也了解, 不管女主角有沒有加入戰爭.\n\
  \   反叛軍都會贏. 她只是帶著一群劇組亂入戰場而已.\n\n   至此, 我想負雷是毫無懸念的\n\n   xxxxxxxxxxxxxxxxxxxxxxxxx\
  \ 分隔線  xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\n   那如果以劇情片看呢?  這片真的是有後勁的.\n\n   想想看幾個場景跟對話\n\
  \n   1) 女主角: 偏偏我比任何人都了解殺人是出於私怨\n\n      對照戲中她的行動, 堅持要暗殺都城總統, 是出於私怨\n      那最後射殺叛軍女首領那一箭.\
  \ 是私怨\n\n      女主角其實只是無故被捲入事端的人而已, 她根本不想革命\n\n   2) 當蓋爾跟女主角討論感情時.\n\n      蓋爾  :\
  \ 你不會選擇你最愛的人, 而是會選擇你認為失去他,\n      你就會活不下去的人\n\n      而最後女主角選了跟她有相同經歷的比德. 還生了孩子.\n\
  \      這拿來回應第一集她說在這時代不會生小孩.\n\n      還有她一個人在家無所事事, 對著貓崩潰大哭. 以及她對著孩子說.\n      要教導孩子如何克制傷痛的方法.\
  \ 代表女主角逐漸在撫平創傷\n      漸漸找到平靜的生活.\n\n   其實我覺得這片的文戲很有畫龍點睛的作用. 而且配合劇情發展.\n   他是相輔相成而且互相呼應的\n\
  \n   當劇情片看, 我覺得還是可以給好雷的.\n\n   xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\
  　　\n　劇情片是好雷, 動作片給負雷\n\n  那可以給平雷嗎?　好像也不行！有人可以一次以兩種不同角度來看電影麻？　\n\n　所以,　我也不知道給什麼雷.....\n\
  \n\n\n\n\n\n\n\n--"
