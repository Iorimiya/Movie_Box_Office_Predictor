title: '[新聞] 「飢餓遊戲3」 美首日預售逾1.3億'
content: '新聞網址：




  「飢餓遊戲3」 美首日預售逾1.3億


  【世界日報╱編譯組／綜合報導】

  2014.11.07 05:30 am


  「飢餓遊戲」（Hunger Games）系列電影票房常勝不衰。將於本月21日上映的第三部「飢

  餓遊戲：自由幻夢I」（The Hunger Games：Mockingjay）的首日預售票房已高達1億3000

  萬至1億6000萬元，打破「變形金剛4：絕跡重生」 （Transformers: Age of Extinction

  ）首個周末票房1億元紀錄，勢必成為今年最賣座電影。


  「飢餓遊戲」改編自蘇珊考琳絲（Suzanne Collins）的青少年暢銷小說。


  美國最大網上電影票預售公司Fandango表示，這部電影首日預售票房超過今年任何一部電

  影。10月29日預售票開賣第一天，這部電影即占Fandango當日售票的80%。在此之前，今

  年最高預售紀錄由另一部青少年小說改編的「分歧者」（Divergent）創下。


  「飢餓遊戲：自由幻夢I」也是MovieTickets.com今年預售成績最佳的電影。10月29日預

  售情形超過去年的前一部「飢餓遊戲2：星火燎原」（The Hunger Games: Catching Fire

  ）。


  2012年「飢餓遊戲」第一部上映的首周票房1億5500萬元，美國和加拿大總票房4億800萬

  元。第二部「飢餓遊戲：星火燎原」在2013年11月上映時，首周票房1億6100萬元，全美

  總票房4億2500萬元，為美國電影史上排名第十的最賣座電影。



  --'
