url: https://www.ptt.cc/bbs/movie/M.1416401219.A.BF4.html
title: '[新聞] 飢餓遊戲修改劇本 留霍夫曼最後身影'
content: '新聞網址：


  【世界日報╱記者馬雲／好萊塢報導】         2014.11.19 10:02 am


  「飢餓遊戲：自由幻夢」（The Hunger Games: Mockingjay - Part 1）中加入了著名女

  演員茱莉安摩爾（Julianne Moore）飾演的第13區總統「柯茵」（Coin）及「冰與火之歌

  ：權力遊戲」走紅的娜塔莉多莫（Natalie Dormer）飾演飾演叛軍成員「奎希妲」（

  Cressida）兩個新角色。同時，本片也成為今年2月去世的奧斯卡影帝菲力普西摩霍夫曼

  （Philip Seymour Hoffman）最後一次銀幕亮相。


  霍夫曼今年初突然離世時，正在拍攝「飢餓遊戲：自由幻夢」。當時，他還有兩場有對白

  的戲尚未拍攝。在他離世後，獅門公司並未改變上片時間，那麼霍夫曼的戲分是如何完成

  的？影片導演法蘭斯羅倫斯（Francis Lawrence）表示，他們修改了劇本，刪除了一些霍

  夫曼的戲分，未用電腦合成，也沒用替身。


  羅倫斯表示，霍夫曼是世界上最好的演員之一，無論何種技術都無法重現他的風采。霍夫

  曼與茱莉安摩爾在片中有對手戲，摩爾表示：「實在難以形容當時我的震驚，他的離去是

  一個特別遺憾的損失，作為同行和朋友，我覺得他是一個很棒的演員，我很榮幸在本片中

  與他再次搭檔。」


  摩爾提到她加盟「飢餓遊戲：自由幻夢」是自願的，且是她主動打電話給導演的，因為那

  時她的女兒和兒子都是「飢餓遊戲」系列書籍的忠實讀者，摩爾也抽空讀了，發現小說寫

  的確實不錯，就立刻找經紀人聯絡希望加盟。她說：「我兒子為買這本書深夜去排隊，我

  想我的加盟對他們意義很大。」


  英國女星娜塔莉多莫為加盟本片剃掉了一半頭髮，她與珍妮佛勞倫斯（Jennifer

  Lawrence）有不少戲在一起拍攝，她說：「我有很多機會站在一旁觀察勞倫斯，同是年輕

  演員，我終於明白為何她如此受歡迎，因為她與她演出的角色凱妮絲一樣，十分平易近人

  ，沒有架子，這是成為偶像的基本條件。」

  --






  --'
