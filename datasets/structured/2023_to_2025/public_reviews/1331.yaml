  \                │▽│           \n╱◢╲       ◥\n│    │     \n\n--\n有事？\n整片美術造型很強 之前電影都未到類似藝術水準\n\
  看到她上雜誌封面好像又接拍幾部文藝\n我看到宣傳照都軟了......就是沒有那種值得去看的感覺\n我開始相信只要在好萊屋 只要接過大製片的角色都能成為大牌了...\n\
  那張臉連拍片男主角都比她小\n大嬸口味 呵呵\n拜託 有外表比她會演沒有喔？\n今天最好笑的話"
