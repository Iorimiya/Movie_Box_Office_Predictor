url: https://www.ptt.cc/bbs/movie/M.1419048880.A.BD5.html
title: '[好雷] 《飢餓遊戲3：自由幻夢 I》'
content: "網誌圖文：\n\n\n\n\n    「權力競逐是他們的遊戲，我的沉默就是我的答覆」\n\n    這是第三集小說封面的標語，個人覺得電影真的有把這句話的感覺拍出來。\n\
  \n\n\n\n\n    以小說喜愛排序來說，我是1>3>2。\n\n    但其實真正會讓我喜愛第三集大於第二集的主因，是在於凱妮絲最後做的一個\n\n決定。不過因為是電影3-2的雷，當然就先不暴雷了。但這個決定的產生，在電影3-1\n\
  \n中，我發現導演有偷偷把這些蛛絲馬跡放在兩位總統之間和十三區。\n\n\n\n    當然，最喜歡的就是世界因凱妮絲所帶來的改變。\n\n    像是開場沒多久的一個小細節，史諾總統的孫女原本是綁跟凱妮絲相同髮型的\n\
  \n辮子，但因為史諾總統在發飆，所以孫女偷偷的把辮子解開。\n\n\n\n    重點戲的拍宣傳片、吊人樹之歌，更是把凱妮絲所代表的象徵意義變為一種革\n\n\
  命行動。\n\n    不得不說的是，吊人樹歌衝水壩那幕真的改編得很棒。其實在小說中，看到這\n\n段歌詞時我就只是瞄過去而已XD，但電影有畫面有歌聲，那感覺真的變得很不一樣。\n\
  \n\n\n    芬尼克的自白算是讓我覺得有一點可惜的地方，因為我一直很期待這一幕。\n\n    但電影則是穿插去救比德的過程，試圖要展現出很刺激的感覺。可是畫面一直\n\
  \n切來切去，總覺得有點混亂。雖然芬尼克小說中該講的電影都還是有提到，但覺得\n\n如果給他個完整鏡頭，依照他的角色魅力，這一幕應該會更棒。\n\n\n\n \
  \   非常開心這集依然有艾菲（小說中她第三集就消失了）。她的存在，和凱妮絲\n\n之間有種一路走來，很真的情誼。另外小櫻這集真的如同小說中，凱妮絲所說：從\n\
  \n小女孩變為小女人。感覺突然長大了，而且變得好正喔XD。\n\n\n\n    繼續期待明年的3-2。\n\n    可惜我原本很期待的Lily Rabe居然沒演了QAQ。\n\
  \n    （角色Commander Lyme改為《冰與火之歌》的演員Gwendoline Christie飾演）\n\n\n\n\n延伸閱讀：\n《飢餓遊戲》-\
  \ 中規中矩的改編，好可惜！\n\n\n《飢餓遊戲2》- 以書迷來說，滿足！\n\n\n\n--\n：\n  \n \n (Eva Green + Josh Hartnett)\
  \ (￣﹁￣)\n \n\n--"
