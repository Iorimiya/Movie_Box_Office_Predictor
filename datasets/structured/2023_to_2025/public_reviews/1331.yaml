title: '[討論] 看完飢餓遊戲有些疑問（有雷'
content: '雷




  雷








  （個人一點小心得）


  這部真的很多突然驚嚇，


  也異常的寫實，


  幾乎各個陣營都有在做事，


  並不是鏡頭帶到或台詞提到的程度而已，


  叛軍突如其來的爆炸，


  讓人感受到反抗依然在持續，


  對於男女主角來說危險和困境也不只於此，


  不同時間不同陣營的危機，


  比起第一集那樣高科技的飢餓遊戲，


  專注在遊戲和生存上面，


  鳴鳥與游蛇讓人更能體會這世界的殘酷！


  不過我還是我比較喜歡第一集啦！


  只是想稱讚這部的優點！


  （疑問開始）


  希望鞭小力一點，


  有些台詞沒有看的很仔細，


  所以漏看了一些東西…



  1.不懂為什麼小惡魔最後會喝下毒藥，


  我看他明知道那是毒藥，


  是男主逼他的嗎？還是他自己放棄了？


  2.史諾被蛇咬真的是露西放的嗎？


  就算不信任他，感覺也不太像一般人所為，


  目前感覺被誤會機率更高？


  （相對不重要的疑問）


  3.史諾至少有兩三次脫離崗位，


  完全沒人起疑？？？


  雖然也不影響劇情，但就很怪…



  --'
