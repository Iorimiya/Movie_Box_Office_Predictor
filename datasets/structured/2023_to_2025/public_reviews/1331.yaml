url: https://www.ptt.cc/bbs/movie/M.1449628269.A.604.html
title: '[新聞] 《飢餓遊戲》還沒結束 獅門娛樂想拍前傳'
content: '《飢餓遊戲：自由幻夢 終結戰》﹙The Hunger Games: Mockingjay — Part 2﹚象徵著

  這個暢銷 YA 小說三部曲改編電影的完結篇，但獅門娛樂顯然還沒準備好跟「燃燒的女孩

  」說再見。根據 Variety 報導，獅門娛樂正打算拍攝《飢餓遊戲》前傳，副主席

  Michael Burns 在今日舉辦的 UBS 全球傳媒會議中也表示，《飢餓遊戲》系列「會一直

  繼續下去。」，他同時提到如果拍攝前傳裡面一定會有競技場，但不會是一部歌頌暴力的

  電影。


  《飢餓遊戲》系列前三部電影目前為止已在全球獲得超過三十億美元的票房，正在上映中

  的第四部電影《飢餓遊戲：自由幻夢 終結戰》也蟬聯全美三周票房冠軍。





  美國網站 Collider 針對前傳列出幾個可能的故事走向，首先究竟施惠國是怎麼出現的，飢餓遊戲又是如何開始？

  顯然是許多原著跟電影粉絲都好奇的問題；再來，「黑密契」過去參加第五十屆飢餓遊戲的故事，雖然在書中有比較詳細的描述，但他或者是《飢餓遊

  戲：星火燎原》（Hunger Games: Catching Fire）中任何一個第三次大旬季參賽者的經

  歷都會是很好的前傳題材。 不過這個獅門娛樂構想中的前傳要是想跟目前的四部電影一

  樣成功，最好還是先想辦法讓原著作者 蘇珊柯林斯（Suzanne Collins）加入編劇團隊。






  --'
