url: https://www.ptt.cc/bbs/movie/M.1702167872.A.BD8.html
title: 'Re: [討論] 飢餓遊戲觀後一些問題（有雷）'
content: '當然有雷





  本片是以史諾的角度出發，考慮到這點，很多事來的倉促又錯愕


  但這也是我覺得比較好的處理，其實有很多事就是事後想想越來越不對勁，所以恨意才會綿

  綿無絕期



  我的解讀和猜想如下


  女主的前男友一開始泡上”首長的女兒”!?


  不感覺這就是叛軍的美男計嗎？為了地下工作有內鬼可以罩？


  所以猜測是前男友被女主支使去泡，但沒料到首長女兒嫉妒心強，就算是前女友也要趕盡殺

  絕，送到飢餓遊戲，懦弱的前男友也不敢吭聲，順便和叛軍斷掉聯繫自保


  此後第一第二章，男女主都算是付出真情意，即使女主是為了生存而引誘男主，仍是在關鍵

  時回頭救男主，飢餓遊戲怎麼樣都是九死一生，有人真心關懷很難不感動


  而女主回到12區之後，說真的正常人都會去找前男友算帳，怎麼可能避不見面


  怎麼算帳，當然是叫他儘快安排走私軍火和偷渡


  懦弱的前男友必然害怕極了，所以才回來求和，女主沒有料到男主竟還跑回來找她，但此時

  女主的心態已經不純了


  除了重施美人計之外，最高招的應該是利用已策反成功的男主好友，間接策反男主（一般謀

  反保密為上，會透露訊息的必定也要策反之人），如此進可攻（策反），退可守（男主會顧

  慮好友，投鼠忌器不會揭發）


  但沒料到男主自做聰明密報好友，因為他認為只是逃走罪不致死，他都城的父母也會救他


  怎麼看出女主從頭到尾都是叛軍呢？

  看到女主發現男主走到後台就緊張，甚至暫時離台進去關切就知道，偷渡武器放在駐唱點後

  台根本不是巧合，從一開始就是叛軍基地


  首長女兒其實見到女主就有意會到她中了美男計，跑走被幹掉，懦弱前男友慌了想跑，被幹

  掉


  這邊對女主心態是有衝擊的，畢竟報復前男友不代表想要他死，如果如猜測當初的美男計是

  她支使的，那等於前男友就是她害死的


  槍在林中屋子當然是因為那邊也是叛軍基地


  最後為何要帶男主去看槍，因為當她聽到男主說殺第三人時，她才意會到整個策反行動全都

  失敗了


  她出去採慈菇那麼久，又那麼熟悉森林，卻被男主槍擊到？不可能，她忍不住在旁偷看男主

  崩潰的時刻，表示她深深的歉意，無論是對男主 前男友 男主好友


  而她最後的選擇，就是把她自己這條命還給男主，畢竟前面看來，她和男主都是孤兒，爛命

  一條，你救過我，我還給你，也還你回都城的自由，在我看來這是第三章唯一的愛情戲


  整個第三章就是一個策反失敗的間諜戲


  回到都城，我們發現遊戲設計者早在幕後操縱一切，叛軍 女主和男主從來就在她的手掌心

  ，早在一開始就都逃不掉，根本從來沒有什麼逃到北方的機會


  整個就是很極權國家下的故事，看多俄國鬥爭史和中國文革時代各種故事就很清楚


  這片藝術性高的地方在，你其實可以以完全不同的方式解讀它，不見得是我認為的這樣



  --'
