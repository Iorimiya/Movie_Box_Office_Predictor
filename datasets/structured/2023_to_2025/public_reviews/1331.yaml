url: https://www.ptt.cc/bbs/movie/M.1423568113.A.2B1.html
title: '[ 普雷] 飢餓遊戲：自由幻夢 (有雷)'
content: '剛剛看完這部電影，如果滿分一百的話我應該會給它65分，我是先看過小說之後才來食用這部改編的作品

  以下為本人對於這系列作的看法



















  當時初次品嚐這部作品時，三部曲看下來，我最喜歡的就是第一部曲，我覺得第一部曲的故事鋪程的很好，女主角從一個不知人間煙火的鄉下女孩，經過殘酷的戰火，蛻變成一位成熟的勇敢的戰士

  小說非常注重在人物的描寫，每個配角的一舉一動，他們的談吐都深深的刻畫著每個角色鮮明的個性

  就是因為這些描述，第一部的故事量應該要比後幾集還要大，結果第一部的電影礙於時間問題竟然鳥鳥結束

  導致有許多電影的設定並未解釋清楚，有些人物的刻畫並未深入觀眾的腦海中(重點是他們乾脆直接刪掉一些角色XDD


  之後的第二部我認為是有稍稍補救到第一部的缺漏，但也漸漸顯示出一些問題，這部分我就在第三部一起說明





  第三部一開始是接續第二部末女主角破壞力場後被救起來，但開場開的有點生硬讓觀眾有點不知所措，會有種what happened？的feel，我不知道導演是不是刻意營造出這種氣氛


  接下來就是導演的說故事能力，從第二部開始導演非常喜歡做對比鏡頭，一下子慌亂一下子平靜，尤其到第三部更為嚴重，這種手法完全是在考驗觀眾的邏輯能力還有記憶力，導演完全不想好好的講故事給觀眾聽，他很喜歡用不斷的變換場景來推進故事

  要不是我有看過小說，否則我真的很難融入到劇情內


  最後是這部作品的運鏡，導演似乎很喜歡讓攝影機跟著走路XDD，鏡頭從頭晃到尾，這可能是種特色，但看完整部會令人有點不舒服，而且導演很喜歡特寫女主角的表情，時不時就來個女主角的臉，不是說不喜歡看女主角，你有事沒事一直tag女主角的臉，女主角也有事沒事擺出個若有似無恍然大悟的臉，下一幕又好像什麼事都沒有的繼續XDD


  還有就是跟上一點一樣，上一幕是革命的場景，下一幕馬上變成女主角在沉思的臉XDD，上一幕還很熱血，下一幕馬上脫戲XDD




  但第三部最後被轟炸時的氣氛有做出來，以及女主角的演技拯救了這一系列XDD

  如果是飢餓遊戲的粉絲還是推薦去看這部飢餓遊戲：自由幻夢



  手機排版抱歉QQ



  -----

  Sent from JPTT on my Foxconn International Holdings Limited InFocus M320.


  --'
