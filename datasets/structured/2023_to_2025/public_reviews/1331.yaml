title: '[無雷]  飢餓遊戲 自由幻夢終結戰'
content: '以下簡短2D心得（回文有雷）


  我沒看過書

  老公有看過

  他說他第三集是非常勉強把它看完

  所以這部基本上是因為疼我所以才一大早陪我來看XD


  前面還不錯

  但是結局真的不ok

  我禁止老公跟我講劇情

  但最後那邊實在有夠好猜...

  後面張力不足，有種匆匆結束之感


  雖然老公沒爆我雷

  但在我們看完第一集時就有跟我提到結局很爛

  所以我有一半是基於喜歡珍妮佛才進電影院看的～


  個人覺得不需要看4D

  老公看完以後只跟我說了句


  「我覺得看Snoopy可能都比較值回票價...」

  （我們超愛那隻獵犬XD)


  ps.以上就是個人主觀的電影觀後感，回家後有跟老公討論了一下，對於整部電影的流暢

  度跟理解方面我認為有看書會有差～結局的好與壞就憑個人喜好囉～


  --

  如果是幸福結局我應該更不愛啦！畢竟我沒看書，所以覺得後面有點匆促有點突然這樣，

  不過我喜歡女主角處決時做的選擇！

  我個人覺得會需要''''晃動''''臨場感的地方不多～

  阿哈哈那我還是改成有雷好了～

  嗯嗯就是覺得構想不錯但是演的不到位...我不清楚書細節交代的如何，但彼得心境的轉

  換跟蓋爾的部分我覺得光看電影讓我有點反應不過來這樣！

  （握手

  應該不至於啦！

  哪泥！？

  沒有～

  雖然我沒有給好雷，但是我覺得是可以進場看的！因為前面拍的不錯，只是我自己不喜歡

  妹妹領便當以後的劇情而已...

  H大言重了XD木瓜還有美型吸血鬼，飢餓遊戲好像沒有主打什麼帥哥牌啊～小說也是見仁

  見智啦！老公覺得書第一部很好看，第二部普普，第三部～''''～....這樣


  可是我看不可能的任務時完全是個無腦愚婦般的為阿湯哥尖叫耶哈哈哈

  電影評價滿主觀的啦～'
