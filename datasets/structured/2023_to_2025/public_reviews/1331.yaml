url: https://www.ptt.cc/bbs/movie/M.1448379320.A.E70.html
title: '[有雷] 飢餓遊戲三部曲之小小心得'
content: '其實看完II後，心裡真的是五味雜陳，當初接觸到這部片時，以為就是單純的爽片，


  但事實上，看完1後的確也有度認為是動作片(未看小說)，一直追到現在，很不可思議


  ，竟然有電影系列作從動作片轉成劇情片，對我來說這是很新鮮的感覺，但也因為本身


  的故事結構吸引著我，讓我有動力可以追完這個系列。(其實應該是比較偏劇情的，只


  是剛接觸時一直都認為是動作片)



  ==============================防雷=========================================

















  劇情承接I，不出所料的，Peeta完全對Katniss視同仇人，包含在故鄉時丟麵包出去給


  Katniss結果回去被打也怪罪到她身上去(五告雖)。後續也許是因為Coin的故意安排下


  ，讓Peeta跟隨Katniss一組人，慢慢感化(回想)，讓Peeta慢慢回復成回來的自己。



  由於沒看過原著，所以我一直以為Finnick會一直活到最後，沒想到最後還是領了便當


  ，都城圍攻的時候有一小段劇情沒帶到他，害我一直以為被綁在空中的是Finnick，因


  為圍攻那邊劇情來的太緊湊，一下子很多人領便當。



  可憐的工具人Gale，最後還是沒能跟Katniss在一起，這點我倒是覺得蠻意外的，也許


  是跟Katniss的意見不同，加上小櫻的死亡。(我內心應該是Gale派吧，因為我自己覺得


  Peeta真的太弱了...)



  這部看完走出戲院後，實在很難形容心理的感覺，但絕對不是激動或是興奮，比較像是


  有一點點的失落感，到底失落些什麼我也不清楚，其實當初看完I的時候，看版友都說


  對II的劇情不要有太高的期望，現在看完後，我倒是覺得結局我還蠻喜歡的，至少Snow


  這個王八蛋終於掛了，恨他真的恨得牙癢癢XD




  以上簡單打上一些心得，其實撇除原本這個系列作就是我必追的原因外，另一原因就是


  紀念Philip Seymour Hoffman(飾演繼任遊戲設計師Plutarch Heavensbee)，雖然他並不


  是最愛的演員，但他為電影的付出相信大家都看的見，真的很可惜...


  --'
