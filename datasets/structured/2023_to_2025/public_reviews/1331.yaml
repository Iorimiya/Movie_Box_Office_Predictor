url: https://www.ptt.cc/bbs/movie/M.1716341067.A.76C.html
title: '[新聞] 新版《X戰警》有望由飢餓遊戲前傳編劇'
content: '終於出現動靜！新版《X戰警》有望由《飢餓遊戲》前傳編劇執筆


  Yahoo奇摩電影戲劇編輯部


  2024年5月22日 週三 上午8:32




  「X戰警''97」（圖：Disney+/Marvel）


  1. 收購案五年以來，X戰警遲遲沒有動靜。


  2. 漫威耐心埋下伏筆，為X戰警作足準備。


  3. 如今傳出編劇人選，X戰警新片有望了？


  【文／血紅蘭姆】


  在迪士尼收購福斯的五年之後，漫威版《》電影如今終於邁出了第一步，有望請到

  《》編劇麥可雷斯理出馬執筆。


  自從迪士尼在2019年正式收購福斯以來，漫威粉絲無不期盼福斯旗下兩大超級英雄系列電

  影能早日重返漫威本家手上，好在漫威銀幕宇宙中登場亮相。


  其中《》已宣佈卡司陣容，也預計今年中在倫敦開鏡，令影迷大喜過望。


  相對的，《》雖然遲遲沒有進一步消息，漫威卻一直耐心埋下各種相關伏筆，先是

  讓「」在《》中客串現身，「」又

  暗示女主角一身超能力是出自變種人基因。




  《死侍與金鋼狼》（圖：Disney/Marvel）


  除此之外，漫威首位變種人「」泰諾克烏爾塔則在《》中登場亮

  相，曾演出《X戰警：最後戰役》、《X戰警：未來昔日》的「野獸」，也在《

  》隱藏片尾中回鍋現身。


  甫於本月中播畢的「X戰警’97」第一季則延續九零年代經典動畫影集，贏得了世間一面

  倒的鼓掌叫好，更別提休傑克曼再次張牙舞爪的《死侍與金鋼狼》將於今年7月底上映，

  在在為X戰警重返漫威銀幕宇宙作足了準備。


  在苦等五年之後，《X戰警》如今終於傳出了最新動靜。


  根據綜藝報指出，《》編劇（Michael Lesslie）

  目前正在跟漫威影業商談執筆這部萬眾期待的新片。


  現年四十歲的英國編劇麥可雷斯理最早是從劇場界出身，他2007年將1994年電影《與鯊同

  游》改編搬上舞台，就此創下了當時在倫敦西區劇院推出新劇的最年輕紀錄，由麥可法斯

  賓達主演的《馬克白》、《刺客教條》也都是出自他筆下，此外更執筆了四集「女鼓手」

  ，接下來也將在新片《》中擔任共同編劇。


  不過在編劇麥可雷斯理、製片凱文費吉之外，這部重新開機版《》目前尚未敲定任

  何導演、卡司人選，也不知何年何月才會開拍。看來在本片終於如願登上大銀幕之前，觀

  眾恐怕還要再等上好一陣子了。


  新聞網址：









  --'
