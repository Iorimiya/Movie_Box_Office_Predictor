url: https://www.ptt.cc/bbs/movie/M.1448272230.A.2B8.html
title: '[好雷] 飢餓遊戲最終回 '
content: '難看的3-1就讓它過去

  3-2重拾水準


  大致上就是原作改編

  感謝導演完美地影像化了小說

  很期待導演的下一部作品，不過看imdb沒有新片計畫


  Peeta終於獲得最大勝利，這是最好的選擇

  雖然人矮臉方，但是他的愛超越Gale，真愛無敵

  不管迷妹還是肥宅都能接受


  小珍跟Katniss已經分不清了，兩個合體了...

  雖然小珍有點太高壯，但演技真的很好


  不過受限原作，只能說作者把Katniss描述得太無腦太中二

  作者沒有把劇情收得很好，為狗血而狗血

  連累一堆人陪她死，有點悲慘

  幸好選擇的對象沒有錯，不然大家要燒書


  Coin這角色很有趣，3-1拍得很正派，3-2那股邪惡奸詐的感覺有出來

  影后就是影后，演得真的很好


  還是很不錯看，雖然星火燎原無法超越，星火燎原看來永遠成為YA小說電影的巔峰


  --'
