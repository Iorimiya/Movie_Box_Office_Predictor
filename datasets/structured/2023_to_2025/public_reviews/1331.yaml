url: https://www.ptt.cc/bbs/movie/M.1416656049.A.C04.html
title: '[好雷] 飢餓遊戲3之我沒看過1.2'
content: '在被Peeta試圖掐死Katniss驚嚇之前，

  我心裡充滿了滿滿的感動

  如散場路人所說，她為了Katniss的兩支宣傳廣告哭了兩次

  我也泛淚。


  革命大概就是那麼一回事，

  太多人膽小、太多人害怕、又太多人想安逸現狀

  最後，只有身邊的人也起立抗爭時

  才能踩著他人的勇氣前進


  Katniss正是鼓舞他人的重要精神指標

  也是希望的「具體」象徵，所以才無可取代的地位


  我沒看過1、2，更沒看過小說

  僅因為家裡人訂了票我就跟去看了

  我對劇情一蓋不知，連看到他們有電、飛機和槍都讓我驚訝

  還以為飢餓遊戲只是「叢林聚落中的大逃殺」

  雖然是第三集，但是我把它當作全新的電影般看待


  我承認花了很多時間猜測跟消化與1、2集連貫的劇情

  不過我覺得對融入革命情感似乎沒有太大障礙?

  畢竟整部片主軸就是「如何誘導一場革命」


  把一部片濃縮成八個字好像顯得很乏味

  但我說過了：革命大概就是那麼一回事

  不是一朝一夕促成，即便人民受苦受難已久

  也不一定有人出來反抗，過程冗長也就無可奈何


  電影結束後，

  為了更瞭解Katniss的內心世界，我甚至想看小說三部曲了

  沒想到回來一搜，這麼多人對飢餓遊戲3給予負評

  我文筆不好，不能好好表達在電影院裡受到的感動

  如果單純把這部當作劇情片看待，我覺得是好看的。


  --


  補一下後記，這兩天補看了1、2集：


  看完第一集的時候只感覺空虛，

  說不出來什麼，就覺得普通，有點不知所云

  我甚至對朋友總結：好像就只是「大逃殺」三個字而已

  等到看了第二集開頭才發覺不對勁在哪


  第一集劇情過於倉促，內心描述不深刻

  以致於我無法進入開頭Kitniss的陰影和恐懼

  兩集角色們的情感深淺差很多


  可是星火燎原就好看很多了

  我好像才終於瞭解Kitniss這個人，還有她的想法

  承接第三集part1，她從來沒想過要保護所有人

  她在乎的只有她所愛的人，想要救他們於水火中而已

  即使成了monkingjay，一開始也是為了救人才妥協


  第二集有動也有靜，算是很完整的作品

  個人喜好硬要排名的話應該是：2>=3上>>>1

  不過光看演技的話，看3非常過癮'
