url: https://www.ptt.cc/bbs/movie/M.1448216310.A.D00.html
title: '[負雷] 飢餓遊戲...看完肚子真的滿餓的'
content: '本人近期只看了三部片


  分別是黑勢力 二輪的殺手47 及拼首映的飢餓遊戲


  本以為普普的黑勢力


  居然是最好看的一片.....



  以下有雷














  我就不談女主角的婊子個性及整部片的架構了


  我最看不下去的就是在都城女主角一夥遇到陷阱伏擊那一段落

  我們先回想一下

  當女主角一夥跟黑油快樂追跑時

  這一段畫面在女主角一夥到達安全大樓時有被反派撥出來做宣傳

  你當時可以看到那攝影機的角度挺高的吧???

  所以理論上那攝影機是不會被黑油淹沒到的

  但女主角一夥為何逃出來都沒有人發現到???

  好啦，說不定那一台就跟國防布一樣

  關鍵時刻完全沒有畫面


  那第二個問題吧

  女主角一夥人在那時大概有8個人

  留下兩個人在原地

  其他人後來撤退到安全區域

  那兩個人在接下來的影片中被炸死了


  請問兩個人怎麼分出8個人的屍體?

  叫大衛魔術來變嗎???


  史諾前面表現精明無比

  光靠一點點訊息就可以推斷出女主角沒死

  更說出了「有看到屍體嗎?你永遠不會去現場判斷他到底死了沒有」類似這樣的話

  怎麼這時候又變個老番癲


  我實在不喜歡這種為了劇情所以請你腦弱的安排


  不過後面的劇情有沒有女主角好像都沒差

  反正她的鏡頭有三分之一都在醫院

  反正不管她死不死反抗軍都打得進去

  所以我覺得她還是早點死一死好了

  禍害別人有夠久的


  整部片女主角最大的貢獻大概就是宰了那女總統吧

  唉....女人何苦為難女人


  題外話

  淫照事件之後，每次鏡頭特寫她認真的表情我都很想笑。


  「筆者為中央精神病院認證的低能」


  --

  在這個年代，22K已沒什麼大不了，但我就知道你們鄉民喜歡合理的公平正義，因此我為

  你們找來了商界裡最血汗的這四間公司。

  我給了他們外號『過勞四』，相信他們就能剝奪你們無限的未來。

  可別小看他們呀，他們在商界裡就等於昆蟲的螞蟥、壁虱般的吸血。

  每間都有過勞死者、每間都有獨特後門、剝削跟暴利更是驚震八方。

  超時加班，更給你意外的驚喜呀~哈哈哈哈...


  --'
