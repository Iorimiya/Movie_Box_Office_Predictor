title: 'Re: [請益] 飢餓遊戲 最終戰 為什麼小櫻會在那邊？'
content: '一開始被毒死的將軍會死就是因為他把大多數的軍隊都調去守2區軍火庫，


  因為2區被攻下所以政府軍兵力大減，


  逼得男總統只能將剩下的兵力都調回都城總統府塔防，


  並在都城裡設下一堆遊戲陷阱代替失去的兵力，


  所以都城基本上是沒有兵力的情況，因為兵都集中在總統府...


  電影中女總統有提到他們特別訓練了一支醫療部隊會前往前線向都城的居民證明反抗軍不

  是要挑起戰爭而是要尋求自由，


  所以在反叛軍利用地面火力將總統府高牆擊垮後，便派出預備好的醫療軍上前救援，意在

  讓都城相信反抗軍反抗的是壓迫人民的政府而非都城人民，


  然後在這時候再利用有都城樣貌的飛機空投炸藥，


  一來一往就可以製造男總統為了鞏固權力不惜犧牲都城人民的假象，


  讓原本還守護都城的軍隊都失去軍心...


  然後女角的妹妹的醫療能力點的很高，所以加入醫療隊伍...


  大致上應該是這樣。


  --


  我沒看過原著...是就電影台詞情節整理出來的觀點。


  沒想過女總統是故意派女主角的妹妹到前線ㄟ...第3集上下部都是濃濃的政治味...



  誰被打@@？


  近期看了兩部電影感覺上在一些比較細的地方都沒處理好...一部是飢餓遊戲，一部是007'
