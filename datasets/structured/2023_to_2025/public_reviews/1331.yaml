url: https://www.ptt.cc/bbs/movie/M.1448051452.A.CA4.html
title: '[普雷] 飢餓遊戲III-Part2'
content: '去雞排攤買炸中華豆腐,老闆娘的女兒又是笑又是朝我衝過來


  一般來說可愛蘿莉,都會惹人一把抱住的衝動吧,可是我忍住了


  (我果然不是蘿莉控呢 的防雷)














  通常我很少給普雷的,連《聶隱娘》我都給好雷


  一部熱門片來說,這部劇情對我實在太冗長


  因為Part1也有看,所以節奏上可以在Part2進場前有心理準備,


  畢竟同本小說又拆半演除非此小說前後節奏感差異超大<-但我還蠻期待是否會如此


  小弟沒看過原著

  但是中文wiki介紹網站影評都不俗,是說有政治隱喻之類的


  不巧我又對政治不敏感...


  大概如同劇中施惠國革命軍對學舌鳥的偶像崇拜,我也是去看看勞倫斯的演技的


  順便緬懷菲利浦.西摩.霍夫曼,最早知道他是在《女人香》(這次應該沒錯了0.0)



  若說小弟覺得最遺憾的,


  應該是沒有向Part1一樣來首精彩的片尾歌曲



  Lorde - Yellow Flicker Beat (From The Hunger Games: Mockingjay Part 1)

  (Audio)



  也許是想用純音樂表達戰後的平靜吧~


  --

  Sent from my Nokia3310


  --'
