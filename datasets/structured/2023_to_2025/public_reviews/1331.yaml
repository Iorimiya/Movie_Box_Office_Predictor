url: https://www.ptt.cc/bbs/movie/M.1419833410.A.2AC.html
title: '[請益] 珍妮佛勞倫斯與飢餓遊戲'
content: '有沒有人覺得哪裡怪怪的


  大家都討論珍妮佛的演技


  可是我覺得珍妮佛跟這部戲理念 根本不同


  她跟本理念跟女主角不同 比較適合演總統的角色


  也就是她心裡根本就是想要有這種劃分階級世界


  大家難道都看不出來嗎?


  她根本不會想革命軍的角色 她的理念根本不同


  根本不適合演女主角 演的單純真誠沒演出來


  只是沒適合的演員來演 被她矇上了


  她是有點撐起來啦


  可是我總覺得她一開始就是理念不同


  也不太喜歡女角的理念


  甚至一開始我覺得這電影是婊這種革命軍的女角


  譬如有一段"katenis只想到自己 她是為自己而戰"


  莫名其妙 整部電影婊女主角


  不過後來好一點


  可能是錢也賺了 也被她們知道有的人是真心想革命的


  我覺得真的莫名其妙


  這一系列的戲是珍妮佛與戲組的成長歷程


  全部人幫她們賺錢 成長


  珍妮佛的確有貢獻 撐起來了


  但我覺得奇怪的是


  粉絲幹嘛捧她捧成這樣? 甚至說話很...是只有她帥嗎


  是大家幫妳們的


  反而傷害幫她們成長的人們


  這就是我覺得奇怪的地方


  --'
