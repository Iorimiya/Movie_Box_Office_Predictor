title: ' [普雷] 飢餓遊戲3 終結戰'
content: '一如往常一樣平平淡淡

  高潮總是來得快，卻也去得快

  這一部電影真的不好看

  甚至有一點推拖拉過頭


  但我能感覺到作者

  要給我們的寓意和含意

  所以我下了一個註解


  這一場權力鬥爭遊戲

  這一些政客為的不是社稷大眾


  為的就只是自身的權力和利益

  至於宣傳片...

  不就是現在大家所用的媒體


  殊不知這一切都只是政客

  精心策劃一場大戲和遊戲


  凱妮斯的堅持和莫忘初衷

  也告訴我們記得要相信自己

  別相信政治，更別相信政治人物




  --


  ~

