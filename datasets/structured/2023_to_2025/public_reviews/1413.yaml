title: '[新聞] 【印咒：畢舍遮】印度傳說惡鬼首嚇大銀幕'
content: '新聞網址：



  由《逃出絕命鎮》（Get Out）製作團隊打造的最新恐怖力作《印咒：畢舍遮》（It

  Lives Inside），即將在9月22日於全台駭人獻映。首度執導劇情長片的美籍印度裔新銳

  導演比沙爾杜塔（Bishal Dutta），選用印度文化中的知名傳說惡鬼「畢舍遮」為題材。

  傳說當中，畢舍遮專挑孤獨、不安者下手，食人血肉，以死屍、精氣維生，更幻化多端地

  附身在人類體內存活。此外，熱愛恐怖片的導演，直言本片是獻給恐怖電影的一封情書，

  片中結合多部恐怖片經典元素，將為觀眾帶來毛骨悚然的觀影體驗。導演更期盼觀眾看完

  電影後，會被嚇到向自己「發脾氣」，而導演所言不假，許多在SXSW西南偏南影展觀賞首

  映的觀眾，看完後也都紛紛表示嚇出「後遺症」，也讓本片一舉榮獲該影展的「觀眾票選

  獎」高度肯定！





  在SXSW西南偏南影展首映後嚇翻全場，榮獲「觀眾票選獎」高度肯定的《印咒：畢舍遮》

  ，是美籍印度裔新銳導演比沙爾杜塔的首部劇情長片。身為恐怖片狂粉的他，在經過大量

  研究後，決定選用印度傳說惡鬼「畢舍遮」，帶給觀眾恐懼新體驗！傳說中的畢舍遮，是

  仇恨與憤怒化身的惡鬼，專挑孤獨與不安者下手，食人血肉，以死屍、精氣維生，並擁有

  變形能力，能夠隱形，更能幻化多端附身在人體之內，讓被附身者精神錯亂、受盡痛苦折

  磨。



  深受多部經典恐怖片啟發的導演，直言本片是獻給恐怖電影的一封情書：「我認為《印咒

  ：畢舍遮》是一封寫給不同類型恐怖片的情書，我想大多數恐怖片粉絲都可以從本片看見

  各式各樣元素，像是80年代的血腥恐怖片和日式恐怖片。不過我主要還思考很多像《鬼哭

  神號》（Poltergeist）和《半夜鬼上床》（A Nightmare on Elm Street）之類的電影，

  可以從中感受到某些關於郊區的恐怖經歷。」





  導演比沙爾杜塔首度製作電影長片《印咒：畢舍遮》，便挑戰執導、編寫的雙重大任。由

  於他來自移民家庭，成長過程便常透過觀賞美式恐怖片，來認識美國文化。熱愛恐怖類型

  電影的他，也汲取過往觀賞的經歷，希望將同樣的恐懼灌輸在觀眾身上，他對此表示：「

  我參考很多青少年時期觀賞恐怖懼作的經驗，例如《厲陰宅》（The Conjuring）、《鬼

  入鏡》（Paranormal Activity）、《陰兒房》（Insidious），我喜歡在戲院裡跟人們一

  同尖叫，我也想拍一部能讓觀眾體驗這種感覺的電影。」



  他甚至自認恐怖片就像在對觀眾惡作劇，並進一步表示：「我愛這麼做！觀眾會大吼大叫

  ，然後對我發脾氣，像是『你為什麼要這樣對我？』我認為我是個惡作劇者，很喜歡這樣

  的經歷，我會想著：『我需要繼續看到這種情況，我想繼續看到恐怖片是如何影響觀眾，

  越多觀眾越好！』」許多觀賞過本片的觀眾，也都紛紛表示自己留下後遺症：「看完後，

  開始有點怕衣櫃會有東西出現。」「現在看到空罐子會多瞄幾眼。」導演還加碼爆料自己

  的父母觀賞後怕到不行，甚至天黑之後再也不再去地下室。足以證明本片得以驚嚇四方，

  值得熱愛類型片的影迷進戲院試膽。



  這部由《寄生上流》北美發行公司「Neon」驚悚懼獻，透過印度傳說惡鬼嚇翻大銀幕，並

  獲SXSW西南偏南影展肯定的《印咒：畢舍遮》，即將在9月22日於全台駭人獻映。本片劇

  情描述出身傳統印度家庭的印度裔美國少女珊米妲（梅根蘇莉飾演），渴望融入美國自由

  的高中生活，拒絕接受母親不停灌輸的印度傳統文化，也疏離了同樣有印度血統的童年好

  友塔米拉（莫哈娜克里希南飾演）。她發現這位曾經的好友漸趨詭異，不僅隨身攜帶空玻

  璃罐，不安地振振有詞碎念，還散發令人不適的腥臭味。某日，塔米拉找上珊米妲求救，

  但珊米妲再也受不了她的奇怪行徑，一怒之下打破了她手上的玻璃罐，沒想到卻因此釋放

  出古老的印度惡鬼「畢舍遮」，讓身邊的人們開始陷入一連串無可預期的災難，而惡鬼也

  正一步步向自己逼近…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
