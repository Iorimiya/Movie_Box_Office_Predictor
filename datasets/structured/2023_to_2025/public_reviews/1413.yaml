title: '[新聞] 溫子仁欽點【印咒：畢舍遮】導演恐怖接班'
content: '新聞網址：



  由《逃出絕命鎮》（Get Out）製作團隊打造的最新恐怖力作《印咒：畢舍遮》（It

  Lives Inside），即將在本週五（9/22）於全台駭人獻映。本片取材自導演比沙爾杜塔（

  Bishal Dutta）他爺爺所聽聞的撞鬼經驗，並選以缺乏安全感又內心孤獨的青少年作為主

  角，挑戰利用身份認同的恐懼，打造出恐怖片前所未見的嶄新體驗！尤其導演的高超才華

  ，不只吸引《逃出絕命鎮》團隊青睞，就連之前執導的恐怖短片《Inferno》，都緊抓住

  名導溫子仁（James Wan）的目光，指名要讓比沙爾執導他監製的最新恐怖片，也讓比沙

  爾成為影壇指日可待的「恐怖大師接班人」之一。不僅如此，為了創造片中由內而外都讓

  人懼怕的印度傳說惡鬼「畢舍遮」，劇組也煞費苦心，與知名怪物設計師陶德梅斯特（

  Todd Masters）合作，透過逼真的實體模型，達成讓觀眾無法從恐懼當中抽離的效果。





  《印咒：畢舍遮》是美籍印度裔新銳導演比沙爾杜塔的首部劇情長片，在劇本構思初期，

  導演便決定取材成長過程當中，爺爺所分享的撞鬼經驗。根據爺爺的描述，朋友的女兒總

  會對隨身攜帶的空罐子說話，而朋友不信邪地逗弄了女兒與罐子之後，怪事就接連發生，

  導演對此分享：「他開始半夜聽到噪音，有時還會有馬匹奔騰的聲音；某天他掉了一包花

  生，轉身後開始聽見咀嚼聲，等再次回頭時，卻發現那包花生不見了。這些瘋狂的事，迫

  使他決定離開那棟房子。」導演也補充：「這是一個我成長過程中，聽見的可愛撞鬼故事

  ，我不知道它的真實性如何，但它確實影響了我。」並透過這個故事，為本片揭開恐懼的

  序幕。



  本片選用青少年作為主視角，找來在人氣美劇《好想做一次》（Never Have I Ever）與

  《人肉搜索2：失蹤搜救》（Missing）展現精湛演技的梅根蘇莉（Megan Suri），詮釋在

  移民家庭下成長的女主角。導演對這樣的安排表示：「成為一名青少年，基本上就是活在

  一部恐怖片中十年。」認為他們不僅缺乏安全感、有家庭衝突，還會有身份認同的困擾，

  他也對身份認同這點補充：「這是主角在電影中最重要的事情，她身兼兩種文化，但也同

  時無法駕馭，這感覺就像是之前未曾見過的新穎衝突，在恐怖片中前所未見！」





  打造印度傳奇惡鬼新篇章的《印咒：畢舍遮》，在SXSW西南偏南影展首映後，隨即嚇翻全

  場，一舉在專門鼓勵恐怖、有趣、性感、爭議性作品的「Midnighters」 單元中，獲得「

  觀眾票選獎」高度肯定。同時也在指標性電影評分網站「爛番茄」（Rotten Tomatoes）

  獲得84%新鮮度，並讓《華盛頓郵報》（The Washington Post）、《綜藝》（Variety）

  等權威媒體都紛紛給予好評肯定，為本片的精采程度背書。為了創造由內而外都使人懼怕

  的印度惡鬼「畢舍遮」，劇組也煞費苦心，找來曾設計過《星際爭霸戰》（Star Trek）

  角色「博格女王」的知名怪物設計暨特殊化妝師陶德梅斯特合作，導演談到：「對我來說

  ，有些東西透過真實效果，會讓你更無法從恐懼中抽離，當我想到《養鬼吃人》（

  Hellraiser）或《變蠅人》（The Fly）那些逼真效果與質感，這就是我在這部電影裡所

  追求的真實！」在大量研究與討論後，劇組根據文化與宗教藝術中的樣子，打造出遵循物

  理定律、符合空間感，同時又惡意指數爆棚的駭人惡鬼「畢舍遮」，也讓觀賞過本片的觀

  眾，在離場時依舊餘悸猶存，直呼：「會不會晚上繼續做噩夢？！」



  這部由《寄生上流》北美發行公司「Neon」驚悚懼獻，透過印度傳說惡鬼嚇翻大銀幕，並

  獲SXSW西南偏南影展肯定的《印咒：畢舍遮》，即將在本週五（9/22）於全台駭人獻映。

  本片劇情描述出身傳統印度家庭的印度裔美國少女珊米妲（梅根蘇莉飾演），渴望融入美

  國自由的高中生活，拒絕接受母親不停灌輸的印度傳統文化，也疏離了同樣有印度血統的

  童年好友塔米拉（莫哈娜克里希南飾演）。她發現這位曾經的好友漸趨詭異，不僅隨身攜

  帶空玻璃罐，不安地振振有詞碎念，還散發令人不適的腥臭味。某日，塔米拉找上珊米妲

  求救，但珊米妲再也受不了她的奇怪行徑，一怒之下打破了她手上的玻璃罐，沒想到卻因

  此釋放出古老的印度惡鬼「畢舍遮」，讓身邊的人們開始陷入一連串無可預期的災難，而

  惡鬼也正一步步向自己逼近…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
