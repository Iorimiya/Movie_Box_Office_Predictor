url: https://www.ptt.cc/bbs/movie/M.1735489232.A.F93.html
title: '[好雷] 《長夜盡頭的微光》- LOOP '
content: '五月多曾經在院線上映


  日本導演三宅唱 最新力作




  雷文防雷資訊頁







  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  劇情描述PMS（經前症候群）與恐慌症精神疾病病人相遇相知，並一起在生產科學儀器公

  司工作，探索天文世界。



  不像鍾導（鍾維拉再度出場救援）《瀑布》有消費思覺失調症之嫌，《長夜盡頭的微光》

  明顯做足田調，更帶出精神疾病病人群體之間互助，同時以敘事上對比電影開頭一般職場

  步調繁忙、明快，相對導演三宅唱前作《惠子不能輸》（註1）的慢板，電影大多刻意呈

  現更加緩慢、沉靜等以感知擴大的內心狀態。



  並以觀測星象：「黑夜」才得以知道遙遠星星的存在，同時對比人類黑暗之中 的孤獨自

  我，說深淵也好，也包含著某種「無限」；而「白天」以為就是全貌，引入地動說，地球

  不斷轉動，世界不斷改變，陽光下的外顯現世：強調各種人的關係，人的世界。就好像老

  子的陰陽概念，明暗的相互依存（黑暗的世界，在細微之處會有星光；而光亮世界，看似

  一目了然，但看不到更後面的東西）。



  此種概念，加上紀錄寫實描述類似《惠子不能輸》的拳館，《長夜盡頭的微光》裡地方科

  學儀器公司的老舊與親切。電影安排較多俗稱無關情節的「過場」，配樂（註2）、獨白

  橋段，稱之為客觀時間性，試圖以主角內心世界的無時間性，或內在時間，但畫面補抓外

  在世界日常運行，相呼對照。



  那麼電影有什麼結論？一如《惠子不能輸》避免過於正向雞湯式解讀。若就劇情上，女主

  角為了照顧媽媽離開工作的斷點，藉由男主角過了一個月後的回憶，與生活吉光片羽，並

  與電影開頭的獨白時間形成LOOP。比較接近自己看待內心世界與外在世界之間抽離，同時

  在電影中成為內在與某種物理客觀的狀態。





  （註1）關於《惠子不能輸》詳見筆者舊文




  （註2）就第一段簡單的配樂



  --


  拉特飯 - 以商業力量進入獨立市場


  --'
