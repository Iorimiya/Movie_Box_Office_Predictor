title: '[  雷] 長夜盡頭的微光'
content: '雷文防雷資訊頁


  長夜盡頭的微光

  all the long nights

  夜明けのすべて

  2024日本電影



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  因為看到這片在一些影展得到最佳影片及專業刊物(映画芸術)列入2024日本電影Best 10,

  得獎copy如下：

  1.

  第16回TAMA映画賞

  最優秀作品賞

  最優秀女優賞（上白石萌音）

  最優秀新進男優賞（松村北斗）

  2.

  第46回ヨコハマ映画祭

  作品賞

  日本映画ベストテン 第1位

  3.

  Filmarks Awards 2024

  国内映画部門 優秀賞

  クリエイター部門 監督Fan!賞

  4.

  第37回日刊スポーツ映画大賞・石原裕次郎賞

  ファンが選ぶ最高作品賞

  ファンが選ぶ最高演技賞（松村北斗）

  5.

  第79回毎日映画コンクール

  日本映画大賞

  スタッフ部門 監督賞（三宅唱）

  TSUTAYA DISCAS映画ファン賞

  6.

  第48回日本アカデミー賞

  優秀作品賞

  優秀監督賞（三宅唱）

  優秀主演女優賞（上白石萌音）


  好奇為何簡介如此平淡的作品，如此受好評，而追看完。看完只能夠說我沒有欣賞本片的

  眼光，僅就好看的地方，記錄下來。


  本片就是非常生活化，沒有任何煽情面，非常平淡地描述飽受嚴重經前症候群（PMS）所

  苦的藤澤美紗（上白石萌音），每月一次例行性變得煩躁、無法控制自己的情緒，及男同

  事山添孝俊（松村北斗）是一位恐慌症患者，他們二人及旁人，一起工作及生活的故事。

  本片我覺得最精彩的地方，在女主角的公司在學校展演星象圖的旁白内容。覺得男女主角

  相遇的職場的公司氛圍，規模小卻温馨，才能夠讓男女主角二人在此安身立業，收尾畫面

  也非常庶民化明亮化，雖然我沒有很喜歡這片，但似乎可以理解這片頗受好評的感覺。如

  下：

  電影中男女主角兩人的職場〔栗田工業〕，變成了製作學生科學用品的〔栗田科學〕，這

  群栗田科學的同事們，讓工作環境充滿著互助和諧氛圍，為藤澤與山添兩人提供了不少心

  靈安定的力量。也促使兩人在共同籌備移動星象儀活動舉辦的過程中，慢慢找到對工作的

  熱情與自我價值的肯定。

  即使女主最後因回鄉工作為照顧母親而離職，相信她已經可以克服這人生的難關。


  全片真的令人感覺平淡卻温暖。



  --


  謝謝留言。


  持續横掃許多大獎吔，我不懂，哈哈哈。


  2025.2.5.今天的news...

  2025〔電影旬報〕，得獎名單：


  最佳日本電影：


  《長夜盡頭的微光》



  《奧本海默》



  《正義の行方》



  《長夜盡頭的微光》三宅唱



  《奧本海默》Christopher Nolan



  《LAST MILE：全面引爆》野木亜紀子



  《納米比亞沙漠直播中》《那個女孩》河合優実



  《長夜盡頭的微光》松村北斗



  《我生活的兩個世界》忍足亜希子



  《我心裡的太陽》《辣妹刺客3 : 假期殺機》池松壮亮



  《我心裡的太陽》中西希亜良



  《我心裡的太陽》越山敬達



  《長夜盡頭的微光》三宅唱



  《奧本海默》Christopher Nolan



  〈映画のまなざし 転移〉斎藤環


  我想有點類似白開水打敗含糖飲料的感覺。'
