url: https://www.ptt.cc/bbs/movie/M.1569781082.A.3C8.html
title: '[新聞] 陸電影產業 從官方到百花齊放'
content: '中時電子報：



  04:092019/09/27 旺報 廖慧娟 、專題


  電影被稱為第八藝術，也是最能反映當代社會與生活風貌的媒介之一；在大陸建政70年的

  過程中，電影已不是單純的藝術創作，而是在官方政策主導下，兼具政治宣傳、文化導引

  、民眾娛樂到產業發展等功能。


  中共建政後，第一步是把民間私營電影製片廠整併為國營製片廠。隨即成立大陸電影發行

  放映公司，建立保定電影膠片廠、北京電影洗印廠，並在南京、哈爾濱、上海分別建立電

  影機械廠，軍方則成立八一電影機械廠。


  為培育人才，上海、北京先後成立電影學校，也就是後來的中央戲劇學院、北京電影學院

  、上海戲劇學院等，為大陸電影產業、工業化發展埋下伏筆。



  《白毛女》被稱為樣板戲


  當時由於導演、演員及主創團隊都是各製片廠的「公務員」，雖然工資不高，但只要拍攝

  符合官方政策、宣揚政令的作品，都可以拿到額外的酬勞，此一時期的電影如《白毛女》

  等，因為過度強調政治傳宣，被稱為「樣板戲」，在各地播放時，村落或機關團體的所有

  人都要集體觀看。


  文革時期風聲鶴唳，許多影人遭到政治打壓，重創電影產業。直到1978年大陸實施改革開

  放，電影業才浴火重生。1980年代由北京電影學院畢業的年輕導演適逢其時，創造大陸電

  影最輝煌時期。張藝謀、陳凱歌、田壯壯、霍建起、顧長衛等「第五代導演」，把故事與

  電影的視聽元素、視覺感性、風格結合現實題材，打造至今仍膾炙人口的多部好片。



  《霸王別姬》獲坎城金棕櫚


  1985年陳凱歌的作品《黃土地》，革新大陸電影敘事語言；1993年《霸王別姬》獲坎城影

  展金棕櫚獎，入圍奧斯卡金像獎最佳外語片。


  張藝謀與鞏俐更是最佳組合，1987年作品《紅高粱》獲得第38屆柏林影展金熊獎，成為首

  部獲得此獎的亞洲電影；1990年《菊豆》與1991年《大紅燈籠高高掛》都曾入圍奧斯卡金

  像獎最佳外語片，後者還讓張藝謀獲得威尼斯影展導演銀獅獎；至於1992年《秋菊打官司

  》也在威尼斯影展獲金獅獎，鞏俐獲得影后。


  「第五代導演」的作品在國際大放異彩，大陸本土的電影院開始出現排隊搶票，進電影院

  看片的盛況，票房市場逐漸拓廣。2002年12月14日張藝謀電影《英雄》上映，全球票房

  1.77億美元，締造大陸電影的全球票房奇蹟，也揭開大陸商業大片的帷幕。


  進入21世紀之後，電影創作觀念進一步開放，「第六代」導演賈樟柯、王全安、姜文、王

  小帥等導演以反映當代價值，彰顯本土敘事，創作各種不同題材的電影，獨立製片的作品

  越來越多，讓電影進入百花齊放的時代。


  2003年，大陸電影全面進入產業化時期，《電影製片、發行、放映經營資格准入暫行規定

  》等政策公布，鼓勵和支持非公資本進入電影產業，允許民營公司獨立出品、獨立發行電

  影，讓大陸電影產業與電影市場開始增速擴張。


  2013上半年，大陸原創電影票房占整體市場62.7%，打敗外國的引進片；2015年總票房為

  440.69億元（人民幣，下同），比2014年增長48.7%，大陸官方「十二五」以來最高年度

  增幅，且原創自製影片票房271.36億元，占總票房的61.58%，以較大優勢保持在電影市場

  的主導地位。



  《戰狼2》全球影史票房55名


  大陸互聯網快速普及，也改變電影創作。時至今日，大陸電影市場已成為全球第2，甚至

  單月票房超越第一名的北美，《戰狼2》更躍登全球影史票房排行第55名。


  大陸電影市場快速發展的同時，也存在許多問題，例如偷票房、假造票房數字、影院擴張

  太快造成經營壓力等，但不可諱言的是過去70年的發展中，為華語電影培育出的人才正在

  發光，從2002年至2018年的票房，也由10萬元飆升至609.8億元，發展潛力及商機仍有極

  大開發空間。


  --'
