url: https://www.ptt.cc/bbs/movie/M.1654078025.A.398.html
title: '[情報] 菅田将暉,原田美枝子,長澤雅美《百花》 預告公開'
content: '預告:



  劇情描述一位在唱片公司工作的男子 泉(菅田将暉 飾)


  與經營鋼琴教室的母親 百合子(原田美枝子 飾)因過去某些原因產生隔閡


  而在發現母親種種不尋常的舉動後，才發現百合子原來已罹患阿茲海默症

  且狀況日益惡化，連心愛的鋼琴都彈不了，母子倆的回憶也逐漸消逝



  直到某日泉在母親房裡的日記發現塵封已久的祕密。




  --



  演員陣容包含長澤雅美，在片中飾演泉的妻子


  以及永瀨正敏，飾演一位熟知百合子過去真相的男人



  其他卡司還有北村有起哉、河合優実、岡山天音、板谷由夏等人





  本片改編自導演 川村元気於2019年發表的同名小說


  川村元気曾以製作《電車男》打開知名度，隨後則以《告白》、《惡人》

  《你的名字》、《天氣之子》的製作人、企劃廣為人知



  而他所著作的《如果這世界貓消失了》、《億男》也曾改編成同名電影

  前作也與原田美枝子合作過




  本片亦為川村初執導筒的長片

  他也在2018年時與多位導演共同執導《Duality》，入圍當年坎城影展短片競賽


  可以期待這次的長片成果




  --'
