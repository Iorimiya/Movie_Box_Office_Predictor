url: https://www.ptt.cc/bbs/movie/M.1560836566.A.4F5.html
title: '[新聞] 李行90歲仍動怒！直言金雞百花贏不了金馬獎'
content: '新聞網址：


  資深名導李行將邁向90歲，國家電影中心將於8月2日在剝皮寮舉辦「李行電影文物展」，

  今先為他切蛋糕慶生，他的子弟兵甄珍、李烈以及他的生平紀錄片監製之一朱延平都到場

  ，他許下「祝大家平安健康快樂」的心願，並表示人生90才開始，願一輩子為電影做志工

  。


  不過提到今年大陸金雞百花電影節頒獎典禮和金馬頒獎撞期，曾擔任金馬獎執委會主席的

  李行忍不住動怒：「金雞百花比得過金馬嗎？根本不用問！金馬獎有50多年的歷史，如果

  片子入圍，大家會去金馬還是金雞百花？根本自不量力。我勸他們，現在能調整還來得及

  ，我聽到這個消息非常生氣。」


  甄珍看到師父發脾氣，趕快上去遞水給他，讓他喝口水、緩一緩情緒，朱延平也打圓場：

  「典禮活動有時候碰在一起，也不是第一次，以前到現在都有，大家各自辦各自的，自己

  做好就好了。」


  李行表示他的個性向來耿直、敢言，對金雞百花的決定他不高興，一定要講出來。


  --'
