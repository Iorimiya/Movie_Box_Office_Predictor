url: https://www.ptt.cc/bbs/movie/M.1208313345.A.A2D.html
title: '[影評] 腐去的花心──觀陳凱歌《百花深處》'
content: "影片連結：\n\n　　＊\n\n    《百花深處》乃○二年陳凱歌為《十分鐘，年華老去》所作的短片。以「搬家」作\n為整部片的軸端，拉展出一則諷諫時光與中國當代的寓言。片中講述馮先生委託了一家\n\
  搬家公司為他遷屋。出現時，搬家公司正忙完一樁生意，他悠悠走近車門彷如一名舊時\n光的鬼魅，詳細的說出他家屋的所在地位於百花深處的胡同內。期間，驅車在北京城內，\n\
  馮先生竟然認不出這個城市的童顏與老容。工人訕笑他，老北京也能在北京迷路。故事\n發展至此漸漸有了蹊蹺，當一行人來到了百花深處胡同竟然發現此地不過一片墟土，無\n\
  屋無牆垣，僅僅一棵老樹聳立彷彿一顆大頭針，將時光穩穩的給釘在這裡。看電影時我\n以為馮先生是以那顆彷如戰火後所倖存的一顆老樹作為辨識家屋臉上的一顆痣，沒想到，\n\
  在搬家工人同他玩上一場「瘋戲」後，不小心把一只看不見的前清花瓶給摔破了我才意\n識到，啊，那不就如同卡爾維諾筆下那一座又一座「看不見的城市」嗎？那是一座看不\n\
  見的宅院，擁有兩進的的院子，在時光與人事的沖刷之後，彷若地縛靈一般盤桓於此地\n不去。其堅韌的紙窗與繁麗的雕藻門飾被馮先生以一只從前懸掛於家屋簷下的鈴鐺給召\n\
  喚出來。一種普魯斯特的魔法。彷彿由時光的河床中取出了一塊石頭，然後丟進回憶的\n湖底，再也拿不出來。\n\n　　即便是生命中一件再不起眼的事物，也有可能是我們拿來與舊時光通靈的鏈結。\n\
  \n    片尾馮先生雀躍的搖著鈴鐺，朝著院落深處大喊：「搬新家哩！搬新家哩！」成為\n中國當局最為諷刺的註腳。\n\n    北京因為奧運之故拆去許多舊屋，讓過百萬的北京人民確確實實搬了新家。城市的\n\
  進步以一種彷如青春期般的暴力姿勢抽長著，市容變換之間，彷彿在恍隔數年以後親友\n驚訝的對著你說：「啊，都長這麼大了，我都快認不出來了。」片中馮先生探出頭去想\n\
  要仔細的確認這是否是那座他所熟悉的城市，在時光的長路上他乘著現世的車前行，沒\n想到連觀望後照鏡都無法看見過往的市景。一個老北京對於自身過往無可依恃的徬徨、\n\
  迷惑，在外人看來不過一名瘋子。\n\n    然而，究竟是誰才是瘋子呢？馮先生嗎？還是那些同他演上一齣滑稽戲碼的搬家工\n人？抑或陳凱歌最後終有所指的中國政府？為了興建北京奧運場館不惜動盪百萬人口的\n\
  家園，且在奧運舉辦結束之後，甚有可能改建，只因棒球於中國境內並不是那麼的流行，\n往後的奧運項目中也不再有棒球一項。中國人權在奧運期間逐漸退兵，當國政府甚而以\n\
  「侵犯主權領土完整」、「鼓勵分裂」和「恐怖主義的活動」的名義加以迫害那些維權\n活動、異議團體的抗爭、堅持宗教信仰的民眾和法輪功修煉者。瘋人瘋戲演至此也不過\n\
  摔落的花瓶脆聲一響，人哭過便罷。文學上擅長以瘋、以愚作為譏諷的寓言，好比吳敬\n梓的《儒林外史》，或者是塞萬提斯所撰寫的長篇小說《唐吉柯德》。而陳凱歌在此以\n\
  一名瘋子（太監？）輾轉攤平了一則諷喻的卷帙，訴說在當代中國如同百花正繁盛的深\n深處，有老靈魂回眸凝望，不過一顆腐去的花心。\n\n\n--\n\n\n\n\n\
  \n--\n◆ From: 140.128.194.150"
