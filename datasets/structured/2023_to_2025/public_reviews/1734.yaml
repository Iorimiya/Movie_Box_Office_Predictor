url: https://www.ptt.cc/bbs/movie/M.1574168315.A.AFE.html
title: '[新聞] 金雞百花開幕公佈：金雞獎將每年評選一次'
content: '金雞百花開幕式公佈：金雞獎將每年評選一次


  新浪娛樂訊 第28屆中國金雞百花電影節開幕式上公佈：從今年起，金雞獎將每年評選一

  次。


  中國電影金雞獎創辦於1981年，由電影界各門類專家學者組成評委會進行評選。此前金雞

  獎和百花獎隔年舉辦，金雞獎每兩年評選一次，金雞獎是專家獎，百花獎是觀眾獎。今年

  是第32屆金雞獎。




  --'
