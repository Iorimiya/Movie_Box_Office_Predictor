title: '[新聞] 金馬獎高大上海報KO金雞百花　中國網友'
content: '金馬獎高大上海報KO金雞百花　中國網友不得不服





  金雞百花電影節的海報出爐。翻攝金雞百花電影節微博



  第55屆金馬獎將在本月16日揭曉奬落誰家，而第27屆中國金雞百花電影節則從即日起至10

  日，百花獎頒獎禮在10日舉行，日子非常相近，兩者海報分別出爐，對比強烈，連向來護

  自家人的中國網友都不禁笑說：「高下立見，難怪金馬獎是兩岸三地影壇最具含金量的獎

  （指最有公信力）。」



  （曾宛如／綜合報導）





  金馬獎的海報向來講究意境。翻攝吃瓜鵝每日速報微博





