url: https://www.ptt.cc/bbs/movie/M.1541871537.A.ED3.html
title: '[新聞] 吳京「戰狼2」勇奪百花獎影帝'
content: "新聞網址：\n\n2018-11-10 21:42 聯合報 記者蘇詠智╱即時報導\n\n大陸電影盛事—第27屆中國金雞百花電影節閉幕式及第34屆大眾電影百花獎頒獎禮，今晚\n\
  在廣東佛山舉行，包括林志玲、黃曉明、趙薇、周冬雨、馬思純、馮紹峰等紅星皆盛裝出\n席，林志玲在紅毯上造型端莊典雅，並沒有露出任何身材，依舊引起熱烈討論。今年入圍\n\
  百花獎的影片中以大陸票房分別高居56億、36億人民幣的兩大動作片「戰狼2」與「紅海\n行動」較勁最激烈，粉絲在網上互相叫戰。\n\n一開始「紅海行動」先有杜江、蔣璐霞、王雨甜分別拿下最佳男女配角和新人獎，看似氣\n\
  勢無法擋，哪知影帝大獎還是由「戰狼2」吳京勝出。曾讓周冬雨和馬思純一起登上金馬\n影后寶座的「七月與安生」，讓她們再度在百花獎影后上捉對廝殺，不過這一次是一起落\n\
  敗在資深女星「十八洞村」陳瑾之手。陳瑾沒有到場，代領人員表示今年是她入行30年，\n獲得百花獎影后格外有意義。不過「七月與安生」拿下最佳編劇獎，製片也透露會再拍攝\n\
  「七月與安生2」。\n\n吳京靠著自編自導自演的「戰狼2」刷新大陸電影票房紀錄，也是目前最夯的動作天王，\n更是今年度金雞百花獎形象大使，他上台時説道：「以為獲獎沒我啥事了，沒想到能拿獎\n\
  。」但稍後「紅海行動」林超賢獲最佳導演，扳回一城。\n\n林志玲在紅毯上向來是備受矚目的焦點，幾度都性感亮相，沒讓大家失望，這一次在百花\n獎紅毯禮服卻把自己包得緊緊，有網友認為志玲姐姐的「衣Q」突槌，這件禮服沒能突顯\n\
  她的好身材，卻讓她看來顯胖，成為頒獎典禮得獎人之外，另一個熱門的話題。\n--\n\n    \n\n\n\n--"
