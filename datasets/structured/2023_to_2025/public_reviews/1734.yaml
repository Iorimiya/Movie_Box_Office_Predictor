url: https://www.ptt.cc/bbs/movie/M.1416755310.A.740.html
title: 'Fw: [新聞] 金馬獎被酸百花獎　陳玉勳：沒勇氣跟人家'
content: '作者: berlinch2000 (壓抑自身威能) 看板: Gossiping

  標題: Re: [新聞] 金馬獎被酸百花獎　陳玉勳：沒勇氣跟人家

  時間: Sun Nov 23 23:06:49 2014


  對於台灣媒體圈長期被一群既得利益者統治

  加上中國崛起得晚

  所以華語電影界一直沒有很強的競爭對手


  我覺得金馬獎就算通通頒給中國，我也覺得合情合理

  我先說，今年的中國電影我沒看過

  但這幾年得獎的中國電影，哪一部的水準不佳?

  又有哪幾部是所謂大成本的製作?


  但我也必須說句公道話，大成本大製作的電影

  可以帶給整個產業很多的經驗值

  無論是在導演、劇本、演員、後製等等都是非常有用的幫助

  問題點就在於大製作的電影，能否帶給台灣產業甚麼經驗值


  中國近幾年的大製作，強調的是時代背景以及複雜的情感

  台灣近幾年的大製作，除了魏德聖的時代背景感以外

  幾乎都是一些騙錢的大爛片(雞排、總鋪....)


  台灣的電影圈似乎沒有搞懂

  電影 MV 廣告 電視 這四個製作的差別

  總是把在電視上行得通的方式拿到大銀幕上

  就舉今年九把刀拿了一堆錢拍的等一個人來說

  節奏掌握的不好，整個劇情不知道重點在哪裡

  大概是用高成本台灣偶像劇的方式來拍攝


  KANO的問題是用了過於高規格的拍片格局

  去拍一個劇本非常簡單的小品故事

  以劇情來說，非常的貪心，希望說明全部細節

  但其實整個故事反而變得零碎不堪

  看魏德聖對台灣電影的熱血，反而不太敢罵

  但這種預算拍出這種水準希望得獎

  實在有點不太可能

  但我相當認同魏導重現歷史觀的決心


  商業跟藝術可不可以一起討論? 可以

  前幾年姜文一部讓子彈飛不只讓票房好到不行

  更打了當局一個大耳光


  別說姜文了，今年的陳建斌

  從青少年時期就在接觸戲劇詩曲

  我想問台灣創作人員的青少年時期在做甚麼?

  台灣的電影要強

  第一點就是必須要增加自身的閱讀習慣

  第二點是培養重現該時代的寫作手法

  最後則是跳脫框架的思維方式


  可惜台灣教育不希望我們這樣做


  補一下對於軍中樂園的看法

  軍中樂園是外省主義和大中國主義的結合，在虛無的幻想中找出那屬於自己族群的一點慰

  藉。它是片段但連續的呻吟，是一種哀戚還不是一種真實力量的質感，在思念的質素上，

  它擁有了那補齊缺憾的圓。


  還偷渡中國人參觀軍艦，真無恥


  --'
