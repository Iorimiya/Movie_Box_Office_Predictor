url: https://www.ptt.cc/bbs/movie/M.1658422942.A.D0D.html
title: '[好雷] 入圍中國百花獎的反中共電影《揚名立萬》'
content: '《揚名立萬》絕對是我在這一年來看過最偉大的電影。在今天公布的中國電影百花獎入圍

  名單，放眼望去盡是一堆「爹親娘親比不上中國共產黨親」的黨國宣傳片，但《揚名立萬

  》這樣的異數，在當中居然入圍了最佳導演、最佳編劇、最佳女主角、最佳新人等四項大

  獎。本片在黑色幽默的懸疑片包裝下，不露鑿痕的，大膽暗諷了中共霸權統治下的腐敗時

  政與社會慘況。你說，怎能不為其心潮澎湃熱淚哽咽？


  謹以此片，向所有冤案中的犧牲者致哀。

  謹以此片，向所有冤案中的吹哨者致敬。


  「我會聽見嬰兒哭泣，我會看到他們長大，他們能學到的東西將遠勝於我」—Louis

  Armstrong《What A Wonderful World》


  「那他們能看明白嗎？」


  「不一定能看明白。但是我相信咱們這部電影一定能夠被留下來。咱們做了應該做的事，

  問心無愧。」





  #萬萬沒想到

  #報告老闆




  --


  謝謝你告訴我在中國拍反共片應該要把歷史背景定在中共統治的年代。



  抱歉，我應該把這部片只想成一塊塊綠豆糕的...'
