url: https://www.ptt.cc/bbs/movie/M.1659222322.A.47F.html
title: '[討論] 2022百花獎一甲子在武漢'
content: '↑星光大道+頒獎典禮↑

  主持人藍羽、吴刚、佟丽娅、鄧超

  鄧超跟隨資深主持人藍羽主持過三屆金雞



  第36屆百花獎至今一甲子60年

  7/30(六)昨天在湖北武漢舉辦

  中國電影家協會主席陳道明主辦

  由101位大眾評審現場投票選出得獎者

  像日本紅白歌合戰現場投票決定誰拿獎


  台灣演員代表出席的是張鈞甯、任賢齊

  任賢齊還有上台獻唱春天花會開，聲得民心

  你好李煥英、中國醫生、我的姐姐都是湖北片

  最佳女主角袁泉、李煥英導演賈琳也都是湖北人

  劉亦菲也是湖北人，可惜演了花木蘭就沒來頒獎


  最佳新人只有八歲，破了10年前張子楓

  第一次演唐山大地震10歲拿新人的紀錄




  最佳影片：《长津湖》


  　　优秀影片：《你好，李焕英》


  　　最佳导演：文牧野（《奇迹笨小孩》）


  　　最佳男主角：张译（《悬崖之上》）


  　　最佳女主角：袁泉（《中国医生》）


  　　最佳男配角：侯勇（《守岛人》）


  　　最佳女配角：朱媛媛（《我的姐姐》）


  　　最佳新人：陈哈琳（《奇迹笨小孩》）


  　　最佳编剧：里八神、刘循子墨、张本煜、柯达 《扬名立万》







  --

  明年金馬60屆也一甲子了，不過應該不只60年

  百花獎竟然跟金馬同年開始，都是1962年開始的

  看來金馬比百花早一點點，現在金馬59百花才36

  跟金馬金雞不同的是百花獎是觀眾現場票選獎

  最佳影片是觀眾票選冠軍，而優秀影片是亞軍








  韓戰題材應該去好萊塢找克林伊斯威特來導才好看


  懷念他導演的黃飛鴻，和他監製的英雄本色

  沒徐克就沒今天的李連杰、吳宇森、周潤發


  學外文是很講天份的，知己知彼百戰百勝'
