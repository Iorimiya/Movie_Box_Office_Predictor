title: '[請益] 金雞獎改一年一次，所以百花獎取消了嗎?'
content: "在網路上用關鍵字都搜不到相關訊息\n\n所以來這邊請教各位\n\n今年開始中國電影金雞獎改為一年一次\n\n所以原本跟它輪流的百花獎就停辦了嗎？\n\
  \n百花獎近年在中國的公信力似乎不怎麼樣\n\n趁這個機會結束它好像也可以理解\n\n--\n [問卦] 喝星巴克為何要自己收桌面?\n\n--"
