title: '[新聞] 今年金馬獎很慘？百花金雞獎恐怕更糟'
content: '新聞網址：




  今年金馬獎很慘？百花金雞獎恐怕更糟


  素有「華語奧斯卡」之稱的第56屆金馬獎在10月1日公布入圍名單，頒獎典禮定於11月23

  日舉行。然而中國官方今年8月宣佈「暫停」所有中國電影工作者參與本屆金馬獎競賽，

  使得今年中國與香港電影全數缺席金馬獎，引發各界議論。不少評論擔憂金馬獎已經「去

  中國化」，淪為台灣本土電影「自導自演」的獎項。然而事實上中國不具名的業內高層人

  士透露，，這次恐怕兩敗俱傷，究

  竟是怎麼回事？


  金馬獎自1996年開始接受大陸電影報名參加，外界認為是華人電影界最重要的獎項，近年

  來因為中國電影崛起，許多中國電影與演員都拿下金馬獎大獎，包含賈樟柯、章子怡及婁

  燁等電影人都陸續拿下金馬獎。


  根據知情人士透露：「百花金雞獎至今尚未公布入圍...就是因為國內諸多限制，不只是

  台灣演員限制，包括外國演員比例問題...外資比例限制，參加徵選片量實在太少，即便

  來得及參加，也讓製片公司意興闌珊，同時今年是慶祝建國70年，所謂的驚悚片、恐怖片

  這些一定不會在得獎選項之中。」是今年的窘境，被看好肯定是《我和我的祖國

  》、《中國機長》之類超級大片。


  今年暑假中國電影市場，所謂國產電影《八佰》、《少年的你》、《小小的

  願望》和《刀背藏身》都在上映前無預警遭「撤檔」，雖片商僅提到技術及市場因素等模

  糊說詞，外界就紛紛猜測，就因為迎接中華人民共和國建國70週年即將到來，使得中國媒

  體審查機制日益緊縮。而中國大陸又不讓電影參賽，傷害最大的是中國電影獲獎機會。


  「壞事未必壞，」知情人士更指出：「金雞

  百花獎的視覺向來就比不過金馬獎，所以今年中國將傾全力評斷整個金馬獎所有缺失...

  相對這是某種心態作祟，今年台灣金馬獎的視覺設計總監，瞬間成為中國14億人口的

  討論焦點。」兩個頒獎典禮都將定於11月23日舉行。


  ------------------------------------------------------------------------------

  話說回來

  "八佰"到底要上了沒?

  中國國慶日都過了

  還會那麼敏感嗎?

  中國政府是得了過敏症嗎?


  --


  --'
