url: https://www.ptt.cc/bbs/movie/M.1720008497.A.17C.html
title: '[新聞] 中國百花獎入圍名單出爐 陸網錯愕「一堆'
content: '中國百花獎入圍名單出爐！陸網錯愕「一堆流量明星」：內娛要完蛋了


  三立新聞網


  2024年7月3日 週三 上午5:00


  娛樂中心／張家寧報導


  大陸第37屆大眾電影百花獎於昨（2）日公布入圍名單，劉德華、王俊凱、朱一龍、易烊

  千璽、張藝興等人入圍最佳男主角，女主角則是賈玲、馬麗、王智、倪妮、殷桃。


  不料，名單曝光後卻引發陸網批評，甚至直呼「內娛要完蛋了！」




  第37屆百花獎男主角入圍名單出爐。（圖／翻攝自微博）


  大陸第37屆大眾電影百花獎入圍名單於昨日曝光後，立刻在微博上掀起眾多網友熱議，而

  「百花獎 笑話」等關鍵字更一舉衝上熱搜榜，其中，最具爭議的為最佳男主角入圍名單

  ，不少網友點名沈騰、張譯、王寶強等實力派未入圍，取而代之的全是新一代流量男星。





  入圍名單引發陸網批評。（圖／翻攝自微博）


  名單曝光後陸網紛紛表示「「我們內娛...好像要完蛋了...」、「最佳男主有王俊凱和易

  烊千璽，我彷彿感受到了美國人民投拜登還是川普的痛苦」、「要不把劉德華摘去吧，放

  一起怪怪的」、「由此可以看出1內娛電影完了2內娛完了」。


  不過，也有另一派網友緩頰表示，入圍名單中的男星在演技表現上表現確實有進步，不能

  單憑是流量明星就否定其努力。


  新聞網址：




  --'
