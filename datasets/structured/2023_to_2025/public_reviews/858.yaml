url: https://www.ptt.cc/bbs/movie/M.1724221524.A.BA9.html
title: '[極好無雷] 異形 羅穆路斯-完美的現代化與新意'
content: '（推文有雷注意）


  這部片真的很棒，遠超出我的期待



  我本來想說

  就異形嘛，來來去去就那個幾個元素

  是有什麼好看


  的確

  這部片可以說


  30%的異形1    20%的異形2

  10%的普羅米修斯


  但同時

  他也有30%的太空災難片   10%的創新橋段


  而且在這些元素運用上

  彼此之間融合的恰到好處合為一體

  絲毫沒有割裂衝突之感


  而且在每個元素環節上都張力十足

  緊張與刺激的娛樂性無可挑剔

  不管是太空環境的危機感

  步入黑暗的驚悚感

  面對殺戮怪物的胃痛感


  沒有破壞氣氛的搞笑情節

  沒有出戲的耍蠢行為

  更沒有弱智的演技和分鏡

  （但當然有不合理的部分，但少到瑕不掩瑜）


  而且不僅僅是站在巨人的肩膀

  羅穆路斯也有創造許多專屬於本片特色

  頗令人驚喜的橋段設計


  雖然說本片相比其他續作

  以創新的角度來說似乎太少

  但我不覺得異形一定要有什麼特別的創新啦

  扎扎實實把每個部分打磨到極致

  讓觀眾重新擁抱經典風格的再詮釋

  反而是異形這個IP所需要的

  正如越單純的料理越講求廚師的手藝



  結語：


  異形 羅穆路斯

  是系列作中清爽又香醇的一口美酒

  成功以現代技術重新拍出經典好老片的韻味


  老粉應能看得開心

  看不下老片特效和節奏的新粉絲

  不須看過任何前作也能感受異形之所以紅遍幾十年的原因



  要說羅穆路斯最爛的部分

  大概就是預告片吧

  那個B級感完全不會讓我想進戲院的衝動…





  -----

  Sent from JPTT on my iPhone


  --


  --'
