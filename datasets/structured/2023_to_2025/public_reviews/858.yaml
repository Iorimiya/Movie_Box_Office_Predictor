url: https://www.ptt.cc/bbs/movie/M.1724497079.A.06F.html
title: 異形：羅穆路斯 心得及劇情請益（雷）
content: '［防雷警告］





  ————————————

  本身很少看電影 也沒看過異形前面的集數

  是被朋友拉來看的 覺得是部很不錯的驚悚電影

  氛圍、絕望感 營造得蠻到位的


  人造人安迪的演技 令人驚艷

  能靠表情演出 似人非人的異質感 蠻厲害的

  主角難免有些主角光環

  但要在封閉的太空船 面對一堆異形

  而活到最後 沒有驚人的運氣是不行的


  配角雖然有些感情轉折

  沒有演得很到位 但瑕不掩瑜

  例如：堂哥在他妹小凱被做串燒帶走時

  悲痛欲絕 下一幕進實驗室後

  表情又變得很平靜放鬆 有點突兀


  地獄倒霉鬼是孕婦小凱

  在船上孕吐休息 醒來看到夥伴被異形開胸

  被撞暈醒來後 又看到另一個夥伴被酸液噴死

  好不容易打開門 逃出去

  卻在一門之隔被異形打包帶走

  幸運獲救後 在主角勸說下打了不知名的針

  想說可以好好睡一覺

  最後卻被自己的寶寶吃掉 好慘


  註：孕婦藥物安全分級很重要

  使用藥物前應詳閱說明書

  ———————————————

  覺得本片有疑惑 想請益的是

  1. 黑科技：主角們開的運輸貨艇

  小小一艘是怎麼在太空中製造重力？

  看到他們上太空時 堂弟還秀了一段華麗點煙

  但之後船內大家 就正常地走來走去


  以及飛船如何在像停車場 密集的地方

  製造足夠多的推力

  而沒有燒到旁邊 坐在椅子上目送他們升空的人


  2. 電影在進到太空站中

  蠻著重有重力系統跟無重力狀態的差異


  但最後一幕 貨艇的貨廂在扣子解開後

  為何會像有重力似的 加速掉落在小行星帶？


