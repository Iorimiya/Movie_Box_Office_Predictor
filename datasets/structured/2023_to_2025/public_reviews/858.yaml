url: https://www.ptt.cc/bbs/movie/M.1723983301.A.803.html
title: '[請益] 異形：羅穆路斯一些問題 （有雷）'
content: '大家好 今天去觀賞完最新的異形電影之後有幾個問題


  1. 異形成長速度很快是正常的嗎？

  印象中之前看得幾部作品都沒有切鏡頭後馬上就變超大隻異形了

  （印象中伊莉莎白·蕭博士用手術床弄起小異形時還沒這樣的狀況）


  2.最後結尾的超大人型異形跟 普羅米修斯中的外星人形象非常的像 那是否那是進化後的外星人？ 還是進化前的外星人？ （普羅米修斯開頭有的外星人吞魚子醬之後就變成炭疽進入河水之中了）


  3.雖然說最後生產的是進化後的異形人類 但本質上還是異形對嗎？ 因為無論外觀 身形 都是一樣 而且還以吸血為食以外 他並沒有生殖器官（生殖器部位是個X)這樣理解對嗎？


  4.最後一點也是我最疑惑的 從剛開始看異型電影就有的疑惑就是


  一直強調異型是一種 完美、更強大、攻擊力更強的有機生命 強調牠更適合殖民


  但每一部異型都沒有人可以控制的了牠們 每一部幾乎都是被幹掉比較多= ="


  那為什麼還要一直執著於異型的改良進化?



  影後觀感


  不可怕 粗暴直白的敘事手法非常喜歡以外


  導演真的厲害  很多驚嚇老把戲雖然已知道下一秒會發生甚麼 但還是被嚇到不要不要的


  雖然異形沒有很多很完整的鏡頭 都是用閃光若隱若現去呈現 但依然覺得… 幹 看幾次都覺得這東西超噁


  雖然我沒有看過很多異形電影 也不是粉絲 但看了聖約 普羅米修斯都可以接受 這一部最後的進化版異形人類看幾次都不行  噁…


  --

  Sent from nPTT on my iPhone 14 Plus


  --

  喜歡機械的原因是它們不會講謊話，壞了就是壞了。

  對機械好，機械就會對你好。

  對人好，或許他只當是應該的。不會記得。

  更甚至對他好，他對你更不好。


  --'
