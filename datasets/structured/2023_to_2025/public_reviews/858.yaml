title: '[好雷] 異形羅穆路斯兩個細節設定問題'
content: '1. 為什麼最後像工程師的異形會殺母親？


  看來他是認得他是誰的產物，

  為什麼會殺掉？好像和以往設定不太一樣


  不然為什麼要特地演這一段？


  2. 為什麼這次Android會取名是Andy？


  Ash

  Bishop

  Call

  David


  Walter (D是第四個英文字母，W是倒數第四個）


