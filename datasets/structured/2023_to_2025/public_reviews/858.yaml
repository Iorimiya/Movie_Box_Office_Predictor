title: '[請益] 異形：羅穆路斯一開頭那邊'
content: '先放個仙仙照防雷
















  就是片頭一開始羅穆路斯太空船抓到的那隻石化異形


  會不會就是蕾普莉在異形一片尾燒掉的那隻阿？


  因為異形一上太空的異形就只有那隻


  羅穆路斯又是接在異形一跟二之間


  這樣異形不就跟卡茲一樣了嗎？？？？


  --


  生無可戀的七七



  煞氣a七七



  --'
