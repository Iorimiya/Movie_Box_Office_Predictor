title: '[負雷]  異形羅穆路斯 過多致敬'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看起來主角一行人在殖民星球是魯蛇等級


  對於他們可以輕鬆開走飛船


  又這麼大動靜外加消失這麼久都沒被發現


  實在覺得有點出戲


  另外太多不需要的驚嚇點==


  明明都是人經過而已


  聲音卻弄得比異形還大


  應該是想辦法把異形的詭異跟恐怖提高


  給人的感覺反而還不如普羅米修斯


  異形的強度看起來也不像生化人說的那麼高


  這部最大亮點應該是女主的溝跟安迪的升級版


  整體來說還是可以看


  畢竟希望異形系列可以繼續下去


  雖然感覺也不太好再掰下去了…








  --'
