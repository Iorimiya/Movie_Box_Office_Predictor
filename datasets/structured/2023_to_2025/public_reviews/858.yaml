title: '[好雷] 誠意滿滿的異形：羅穆路斯'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  沒彩蛋，可放心離場


  睽違很久有續作

  這次的劇情編排很不錯沒有冷場

  雖然一開始敘述有點無聊

  但後來他們去取燃料時，有開始漸入佳境

  尤其是要停止呼吸、很多小異形那段很緊張

  不塊是暫時停止呼吸導演拍的


  而且爆點是ㄧ層一層鋪上

  女主角無重力開無雙殺異形很爽

  還要越過強酸陷阱，有新意


  結果最後的人形異形也讓我狂捏大腿

  我以為躺入凍眠艙是結局

  這次的新異形真的有致敬異形4的人形異形

  但真的有夠醜

  血腥度還好，可放心食用


  滿分5顆星，我給5顆，期待續集




  --'
