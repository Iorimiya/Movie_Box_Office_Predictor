url: https://www.ptt.cc/bbs/movie/M.1725630493.A.38C.html
title: '[ 好 雷] 異形羅穆路斯，和目前中國科幻片的思辯'
content: '[ 好 雷] 異形羅穆路斯，和目前中國科幻片的思辯


  這裏主要是和劉慈欣的改編作比較的


  一，大組織的信任度

  流浪地球是一呼百應

  強調眾志成城


  異形顯然不信任

  礦工說，公司用希望奴役我們

  直接戳穿







  用至2142



  還不如犠牲活體來省成本


  二，小組織的信任

  因此

  小組織的信任度在異形上還是很玩味

  他們大都不法

  行事衝動很多

  終於造成了悲劇


  但是

  小組織的情感羈絆

  可以是很強大的

  甚至可以創造奇蹟



  三，理性和感性

  這




  當然還是有空子鑽

  就是對大組織的賄賂


  異形的安迪沒升級有如智障

  升級充滿了菁英份子的傲氣

  但




  四，黑水改造爭議

  最玩味就是這個

  黑水讓小凱續命

  保住小雨和安迪


  但黑水卻讓胎兒異形和工程師化


  詹姆斯卡麥隆還是拿著我在殖民地但還是王的劇本

  而，但某程度真是必要的




  五，配樂

  事實上是二派涇渭分明

  沒融合好



  說真的我喜歡Jerry Goldsmith真實管絃

  沒辦法了，看了網友剪出的異形一

  真感到真實管絃才有活靈活現感





  --

  其實這已是不同文化產生的文創風格了

  1979版已主張了大組織會為了大目標而拋棄普通的人

  這讓雷普立憤怒

  你不仁我不義

  炸船啦！


  普羅米修斯

  公司社長求工程師

  換來的只是致死一擊


  但中國，甚至台灣文化

  還是會用人造神

  臣服造神的司祭


  1979至2024，這麼冗長，演化還是緩慢的'
