url: https://www.ptt.cc/bbs/movie/M.1724067192.A.154.html
title: '[討論] 二刷異形：羅穆路斯 觀眾年齡層 (無雷)'
content: '上週末看了一個早場、一個下午場


  雖說大多數觀眾群看起來都是二、三十歲年輕人


  但是散場時還是可以看到幾個阿公阿嬤


  慢慢走下台階


  有的甚至杵著拐杖需要家人攙扶


  不禁好奇難道不會被嚇出心臟病嗎？


  異形一、二集分別是是1979年和1986年的事了(45年前和38年前)


  問了家中長輩，大多都有看過


  而且還是他們高中或大學的學生回憶


  而羅穆路斯的時間線位於1和2之間


  號稱異形1.5


  與第一集時隔45年


  應該可以說是等最久的續集之一吧？


  如果45年後(2069年)還有異形續集


  你們會去看嗎？(如果還在世的話)


  但屆時肯定不會是雷利史考特執導了


  能在老年看到年少的電影續集


  似乎也是相當感動的事

  ----

  Sent from  on my iPhone 11


  --'
