title: '[好雷] 異形：羅穆路斯'
content: '這是一部標準的異形電影

  起承轉合非常完整 該有的都有

  同時也告訴我們 上太空辦事

  千萬不能有雷隊友

  比較可惜的是 本片跟前作脫節

  沒有交代聖約號那些人怎麼了

  就直接跳到公司接收異形 開始研究

  我個人比較希望的劇情

  是羅馬開國兄弟號

  是跟聖約號連結的大型實驗研究太空船

  而大衛被公司回收關押起來

  被主角一行人發現

  在生化人升級模組時 把大衛也轉生過去

  然後大衛開始搞事 這樣的開局

  本片格局 應該是歷代最小的

  感覺就像一般B級恐怖片

  不過麻雀雖小 五臟俱全

  異形粉絲還是值得一看



  -----

  Sent from JPTT on my Xiaomi 23049PCD8G.


  --'
