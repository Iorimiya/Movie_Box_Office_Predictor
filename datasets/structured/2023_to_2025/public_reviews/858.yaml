url: https://www.ptt.cc/bbs/movie/M.1723996462.A.9A8.html
title: '[好雷] 異形：羅穆路斯 - 新舊混合很感動'
content: '手機排版請見諒


  我無法說自己是不是異形迷

  但異形1-4、普羅米修斯+聖樂

  鐵血戰士系列

  異形遊戲

  以及平台上的兩大解析(誰不....、達奇...)

  每一片都看了超過十次吧

  很喜歡這個IP在2024年仍有新作


  《有雷注意》


  我認為這部即使不懂異形梗

  也能看的很緊張、刺激

  最後達到一個觀賞高潮

  尤其是這部彩蛋爆炸多

  除了漫威以外

  估計這就是致敬彩蛋最多的電影了吧


  電影一開始直接從挖礦星球開始

  簡潔扼要的帶過偉倫與奴役礦工的背景

  隨即再幫女主角標配一隻安卓...仿生人ND

  一行人想要逃離奴隸生活乘船而出

  直截了當的開始宇宙恐怖的封閉空間...


  一開始在礦星上場景有點像異形2的監獄星

  第一眼並沒有甚麼連結

  但當他們連接上太空站

  準備拉那個拉桿的時候

  遊戲isolation的回憶全部都湧現了

  我看到那根拉桿真的好興奮啊！

  整個太空站的場景

  幾乎就是遊戲isolation整個照搬！！

  雖然太空站裡面的映像管螢幕和機械按鍵

  與普羅米修斯等高科技形象完全不搭嘎

  但也可以解釋為不同功能取向的機台風格

  能看到遊戲中的畫面，就是一個大彩蛋


  而且，兩者連劇情卡的時間點都很像

  根據劇情推估，羅穆路斯應該是接在異形1之後

  完全跟isolation一模一樣

  但主線劇情確實截然不同，幸好如此


  接著主角遇到的第一個仿生人竟然是Ash老大

  電影不過才前1/5，我就已經興奮到快暈倒

  這次的Ash完全承襲了異形1

  那個演技飽滿又冷酷無情的生化人

  前段告訴你我會帶著你們離開

  後期直接切割放生，以公司為最高指導原則


  且這次換了CPU module的ND一臉反派感

  讓我直接期待遊戲中的仿生人大軍

  所幸電影並沒有這麼無趣

  本次羅穆路斯的仿生人更趨近於現實

  少了許多倫理道德以及哲學的探討

  少了普羅米修斯和聖約的那種人性

  少了與主角曖昧不明地互動

  但這種改動反而更貼近於我們現實

  也能帶出主角並沒有當他是人

  但對他的感情是無庸置疑的深

  (就如同從小陪伴到大的熊娃娃一樣)


  這次的生化人命名其實我有點疑惑

  應該要把主角仿生人作為ND還是Andy

  以順序排下來的話我認為是ND更符合


  這次的抱臉蟲在電影中也有重新介紹

  雖然內容不多但直指核心

  老影迷不用說就知道怎麼回事

  新觀眾也能馬上進入狀況

  這次的壓迫感和緊張感

  超越異形2雷普利跟牛頓在實驗室的逃亡

  真的是只要怪物一出來

  就有無限的高血壓


  由於ND被Ash洗腦新的指令要去拿化合物

  到了實驗室後畫面隨著Ash講解

  竟然透過異形還原出了普羅米修斯的黑水炸彈

  並且那個黑水滴上浮的模樣

  與大衛研究瓶子時倒轉上浮根本一模一樣

  好可怕

  我們都知道，令人毛骨悚然的事情

  即將，再度發生...


  我們都知道黑水能改變DNA

  並且根據劇情演進

  黑水已經被大衛改造

  從原先的分解DNA的功效轉往改變序列

  從而指向性很強地變成一個新物種

  完美生物異形...


  中間的逃亡、戰鬥我認為就是爽片的發揮了

  這一連串過渡一直到Ash噴金句

  ：「I can''t lie to you about your chances, but you have my sympathies」


  高潮即將再起


  隨著他們爬回太空船

  將好友放進休眠艙、將ND與船對接

  自己也要爬進去睡覺了

  我們觀眾都知道，要結束了

  畢竟異形1、異形和聖約

  都是在觀眾已知有人受感染的情況進休眠艙

  讓恐怖繼續往宇宙深處擴散

  而他們的好友為了活命也注射了Ash版黑水

  應該就繼續期待續集了吧？


  but

  就在這個but

  休眠艙警鈴大作，嚇死女主

  衝過去一看竟然是要生了

  恍如普羅米修斯的劇情上演

  接下來更哭的事情發生了

  那隻怪物我只能說


  「是有史以來最噁爛最可怕的鬼東西」


  人類很害怕未知的東西

  但其實我們更怕人形卻又不成人形的東西

  這真的是好樣的

  臉像工程師(致敬)

  身體體徵像異形4的boss(致敬)

  身材像異形本身

  還長有手指跟尾巴，到底是什麼鬼東西

  還學著異形4認媽媽的情境

  我的天，臉跟媽媽靠這麼近真的是要吐出來了

  壓迫感、詭異感、噁心又恐怖匯集於一身...

  那個追逐的感覺真的壓力很大

  最哭的是他還會笑，笑什麼東西啦


  不過女主終歸是女主

  怪物就是不會輕易一招殺

  把她拍走後剛好可以將船體開洞

  與異形4同一招的吸吸大法

  可惜怪物沒那麼輕易放棄

  但隨著被噴砂拋光以及被落井下石

  最終女主爬回了休眠艙

  睡了去...


  好可怕的劇情反轉

  真的沒有想到這次會看到這麼恐怖的新怪物

  異形全系列、鐵血都沒出現過這種等級的

  電影中段幾乎都是在怪物片的範圍內

  結果結尾又把宇宙恐怖這一點拉了回來

  給觀眾心理壓力最後一擊


  異形1~4雖然帶有神秘

  但終歸是偏向怪物怪獸片的氣息為主

  普羅米修斯與聖約則是帶著克蘇魯般

  那樣的神秘的未知恐怖，也就是宇宙恐怖

  羅穆路斯這次以為套路都在異形怪物上

  但結尾的人形又回到了宇宙恐怖

  ：我們到底創造了什麼「東西」出來了...

  甚至只能說that thing不敢說是creature

  這種扮演上帝操縱DNA的結果

  或許就是伴隨著如此巨大且難以承受的後果


  好看

  好喜歡異形系列

  希望我激動的心得不會太亂

  這部甚至讓我想到荷蘭蜘蛛人3

  滿滿致敬外還有老梗新創


  心得完

  有誤鞭小力點~感謝各位

  希望所有異形迷都能因為此片激動

  我想去二刷了


  -----補充

  看到有人討論我才想到

  個人認為羅穆路斯會被當成重開機的轉捩點

  如果成功，就可以將這個故事線拉成主線

  直接讓老雷重開機異形的故事

  而當初的異形2、3、4直接當成蕾普莉支線

  畢竟異形2之後也沒有太多有效劇情的進展

  如果真的以羅穆路斯當重開機的主線

  也比較容易重新搭上大衛故事線

  腦補到這裡，覺得好興奮喔！！！


  -----

  Sent from JPTT on my Sony XQ-DQ72.


  --

  真的是有回歸異形本傳的續作感

  但我還是相當期待大衛線的故事有後續的QQ

  真的超噁，比什麼人形海象還怪奇

  這就是宇宙恐怖的魅力

  你完全不知道操弄DNA後會產生出什麼鬼怪

  我難得看電影會被怪物嚇到XD

  我知道QQ    電影裡面明顯是CGI

  是不是...搭配當下情境，真的超越異形4那隻

  沒問題，媽媽不是獵物XD

  只是那一幕跟異形3一樣

  近距離接觸的壓迫力爆滿

