url: https://www.ptt.cc/bbs/movie/M.1723728529.A.F06.html
title: '[請益] 有雷-異形羅穆路斯的疑問'
content: '我想問為啥後面跑出一堆異形啊?


  從頭到尾只有亞洲妹被抱頭不是嗎?


  為啥後面跑出十幾隻???


  不要跟我說他用屍體抱頭做出來的

  懷孕那個不是說因為他在流血所以沒被抱頭

  前面也說抱頭後會提供氧氣讓宿主活著


  既然這樣那宿主是活著這件事就是必須的吧


  那這樣那些異形到底哪裡跑出來的?


  --

  原來是這樣

  我想說一開始太空站不是都死光了

  所以是被抓去另一邊主角剛好沒遇到而已

  我剛剛一查才發現原來那個切一半的仿生人不是第一集那個喔

  只是型號一樣之類的

  因為看這部之前有人講到這是介於一跟二中間的故事


  所以才想說連仿生人都沒電應該已經過很久了

  就算原來有異形也應該都死光光

  整個完全看錯方向~.~

  因為這集黑水感染版讓每隻生出來都直接魔法長大

  讓我完全失去時間概念

  想說是不是又是魔法變出一堆'
