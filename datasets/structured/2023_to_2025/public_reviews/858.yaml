title: '[ 有雷] 異形：羅穆路斯-最慘的角色'
content: '本片首映當天陪朋友去看，後來陪家人二刷。


  在看完其他心得後有特別留意一些之前遺漏的點。


  如壁畫上的嬰兒哺乳是在暗示懷孕的小凱後面有戲。


  而小凱最後生出的後代確實夠醜，醜到令人難忘。


  劇中小雨問過生父是誰，小凱只答「是個混蛋」。


  當時就有人猜想是團隊中的八嘎囧表弟，而導演也在reddit上證實。





  嗯，的確是個混蛋。




  個人注意力都放在醜上天的後代身上，倒沒特別細想生父的部份。


  如今看來，小凱妳真的全劇最慘。







  -----

  Sent from JPTT on my OPPO CPH2371.


  --


  恭喜解鎖成就：目睹一半以上的角色死狀




  本尊現身說明了。




  你說的門上浮雕是羅馬神話中的兄弟倆被母狼哺育的圖案。


  個人談的是文藝復興空間站上的壁畫，上頭描繪的是黑死病時期的慘況。







  長知識了。




  台灣是六等親內不得通婚，南韓更嚴格到八等親。


  而日本跟歐美部份是放寬到四等親以內可通婚。


  所以堂/表兄弟姊妹通婚在外國其實並非什麼新聞。'
