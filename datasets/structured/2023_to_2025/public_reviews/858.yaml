url: https://www.ptt.cc/bbs/movie/M.1740386889.A.B55.html
title: '[新聞] 異形：羅穆路斯導演分享他的新版異形戰場'
content: '新聞網址：


  《異形：羅穆路斯》導演分享他的新版《異形戰場》構想：不讓觀眾事先知道其中一方會

  登場！


  去年靠著票房熱賣、好口碑熱烈的《異形：羅穆路斯》（Alien：Romulus）成功重振《異

  形》系列的費德阿瓦雷茲（Fede Alvarez）導演，不只已經在開發《羅穆路斯》的續集，

  還放話過想拍《異形戰場》（Alien vs. Predator）的新電影，而日前受邀出席一場《羅

  穆路斯》IMAX 特別放映會的阿瓦雷茲，也更進一步透露了他會想要怎麼拍攝、甚至宣傳

  《異形戰場》的電影。


  阿瓦雷茲解釋：「我最有可能採取的方法是 — 如果行得通的話啦，現在要在網路上保守

  秘密太難了 — 《異形戰場》最理想的呈現方法就是，觀眾不會事先知道那是《異形戰場

  》，直到（異形和終極戰士）其中一方終於登場才會知道。起先你會以為你在看一部《終

  極戰士》電影，看著他們降落到某個地方，然後那裡有出現一些生物，結果你會驚訝：『

  操！那居然是異形！』那會讓我興奮到不行。就算是顛倒過來也一樣，你以為你在看《異

  形》電影，但頓時有個神祕生物出現，接著你就聽見那熟悉的聲音，看見那隱形的偽裝，

  然後驚覺：『那該不會是他 X 的終極戰士吧！？』沒錯就是牠們。你不覺得就是要這樣

  拍嗎？如果你直接把牠們的名字全放進片名，那就形同劇透了。」


  阿瓦雷茲亦補充，他本來也是要將這招保密手法用在《羅穆路斯》：「我本來確實是要這

  樣做的。雷利史考特正在製作《異形：聖約》時，我們就已經開始在談論《羅穆路斯》了

  。」阿瓦雷茲表示，早在前傳系列停滯前，他就已將《羅穆路斯》的構想提案出去：「當

  他們問我想拍什麼類型的電影時，我就提出了這個故事，我當時跟他們說：『我們何不把

  它拍成外傳呢？然後我們也不提到這是《異形》電影，我們就只是隨意取個科幻風格的片

  名，向觀眾介紹幾個年輕主角和某顆星球，然後當他們走進一個房間時，才發現裡面有異

  形蛋。』想像一下，西南偏南電影節的觀眾在首映會當天，直到進場 30 分鐘後才發現，

  自己其實是正在觀看一部《異形》電影，這就是最初的計劃。」




  阿瓦雷茲在暗示了


  搞不好羅穆路斯的續集會出現終極戰士


  然後標題翻轉一圈變成異形：戰場


  --'
