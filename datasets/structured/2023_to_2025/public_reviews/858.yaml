title: '[討論] 異形羅穆路斯 IMAX 畫幅宣傳'
content: "電影板的各位好\n\n大前天有發一篇異形 IMAX版本推薦文\n\n同時也很疑惑，為什麼影城方都沒特別宣傳\n\n昨天在好奇心的驅使之下\n\n\
  分別私訊了美麗華、美麗新、in89影城\n\n以及在威秀的粉專留言\n\n\n\n\n的小編蠻用心的\n\n有回覆表示近期忙碌，疏忽了這塊\n\n他們會盡快補充宣傳！\n\
  \n\n果然今天就出圖了，效率不錯！\n\n\n\n以下美麗華粉專原文\n===================================\n\n【異形：羅穆路斯】\
  \ 觀影首選 IMAX®影廳\n\n影史傳奇之作，恐懼再現大銀幕\nIMAX觀影五大指南：\n\n全片1.90：1完美呈現\n多達26%精彩畫面\n太空場景絕美壯闊\n\
  最完整的異形畫面\n前所未有的窒息感\n\nIMAX稀有王座全面熱銷中\n立即搶購，一同浸入異形世界：\n\n\n\n也在今天放出了示意影片\n\n\n以下美麗新粉專原文\n\
  ===================================\n\n享受大銀幕好過癮！！！\n全片採用IMAX「特製」拍攝，體驗全片畫幅彩蛋\n  \
  \        　　　\n能比一般廳看到更多特別畫面內容，\n大銀幕的震撼絕對值回票價啊 (搶先買票！\n-\n【#異形：羅穆路斯】現正熱映中\n\n\n\n\
  \n\n\n\n目前威秀和in89都還沒有特別宣傳\n\n之後若有更新會再補上\n\n\n\n\n\n\n\n\n還沒觀賞異形的朋友！\n\n把握這幾天電影場次的開放時間！\n\
  \n\n\n\n\n--\n\n\n\n印象中這好像是因為有出過一些事件，消防法規特別針對變嚴厲。最誇張的時期左側逃生門\n一共點亮四個逃生指示燈，超級干擾，目前只亮兩盞大概已經是折衷的做法了。\n\
  \n\n\n很多漂浮的移動的鏡頭應該很搭！\n\n\n真的安全第一\n\n\n感謝心得分享~\n\n\n對的，這次挑哪家IMAX看畫面都一樣~\n選自己喜歡的就好~\n\
  \n\n看異形一定要嚇一跳的！\n\n\n感謝分享~\n\n\n看起來！\n\n\n這次蠻可惜沒有Dolby Cinema 可以看\n\n\n\n這次整個宣傳都超弱，搞不懂\n\
  \n\n還是期待看看\n\n\n這應該看導演決定\n\n\n真的爽！！！\n\n\n\n我都看Box Office Mojo"
