url: https://www.ptt.cc/bbs/movie/M.1724609849.A.BE3.html
title: '[討論] 《羅穆路斯》夾在續集與續集中間的續集'
content: '這部算是1.5集了吧

  看完以後真的覺得這次的感覺就像《俠盜一號》一樣是另外一群人再衍伸出來的故事

  內容也是發生在前一集之後沒多久的時間線上然後又要接續著下一集

  算是夾在續集與續集中間的續集（外傳？）吧

  有些聲音批評這次沒有什麼變化但至少走保守路線沒亂改或是添加太多

  在既有的設定之下又不能更動或是再增加多過多的內容

  不然到時候就跟X戰警一樣前後矛盾亦或是吃書的狀況產生

  一堆內容拼拼湊湊的老實說真的看的很累

  但是看著這次票房跟迴響很好勢必還會再有續集的

  只希望接下來不要搞砸

  真的怕到時候跟侏羅紀世界一樣開高走低爛尾

  還是希望我們老番顛大導演老雷能把前傳系列的第三集補齊

  是好是壞至少能夠完整的讓大家前後連貫

  如果真繼續出續集不知道雪歌妮薇佛會不會回來客串

  就像月光光的潔美李寇蒂斯一樣回歸露臉應該會很讚



  --'
