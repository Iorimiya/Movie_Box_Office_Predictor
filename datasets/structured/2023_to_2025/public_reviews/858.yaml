url: https://www.ptt.cc/bbs/movie/M.1732290564.A.489.html
title: '[雷] 好雷 異形 ：羅穆路斯'
content: '這是我第一次看異形系列，

  個人覺得蠻有趣的

  從電影一開始的鋪陳就讓我感到新鮮且能夠快速沉浸，

  中間這些角色出事的慘樣真的很噁，

  我想這就是這系列的醍醐味吧，

  獵奇、血腥、外星生物加悲劇 意外的

  我蠻喜歡的，（畢竟之前沒看過）

  老實講當初上映的時候我有考慮去看，

  但沒什麼原因讓我有動力去，

  這次上串流，不看白不不看，

  我覺得真的不錯，推薦給大家。

  裡面jumpscare有點多，會嚇到的多注意，

  西雅圖MOPOP裡面的異形根本超弱，

  電影版的我會嚇尿。




  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  女主光環超強，

  中間要通過無重力酸性溶液太唬爛，

  但瑕不掩瑜。

  特別是看到每個朋友都倒在自己身邊，

  真是夠慘了。

  Andy演的好好，兩個人格完全不同樣貌，

  公司版Andy可以看到他的冷酷無情，

  眼神的變化超厲害。



  --'
