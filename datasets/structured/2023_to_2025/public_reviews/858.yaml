title: '[請益] 異形：羅穆路斯 有算恐怖嗎==？'
content: '不是系列作粉絲 沒印象有沒有看過前作


  今天剛看完 就覺得普通吧


  常常看科幻片 所以也不會看不懂


  不會不好看 但覺得有點不夠力





  板上說這部壓迫感和恐怖氛圍營造的不錯


  但在看的時候 都覺得還好


  可能劇情都在預測內 也完全沒有被嚇到=.=


  異形的長相我也覺得不恐怖


  最後有人臉的有點噁心而已


  看主角群降智的時候 不耐煩的感覺比較多==





  因為沒看過系列作


  腦中拿來比較的作品 反而是惡靈古堡第一集


  這部真的有算恐怖嗎==？


  --



  就惡靈古堡第一集吧==

  影集美國恐怖故事第二季 怪奇物語第一季

  其他就沒啥印象惹

  然後一直很喜歡以前林正英的殭屍片

  小時候也很喜歡看神眉和金田一

  突然想起來 恐怖蠟像館的封閉感好像也還不錯

  而且蠟像本身就很陰森


  1有抓到神韻啊 氛圍有到

  就重點橋段有到位 不是指整部都很恐怖

  電玩比電影恐怖多了=.=

  動作片是後面的事了==

  第一集主要是那種封閉空間

  加上時間倒數的急迫感 都有到位

  這集異形也是玩差不多的東西 才會拿來比較'
