url: https://www.ptt.cc/bbs/movie/M.1724007221.A.2D0.html
title: '[  好無雷] scxeenX 異形 羅穆路斯'
content: '先說我自己是非常喜歡「普羅米修斯」、「聖約」的科幻神話粉絲，也看完過所有本傳

  四集，在看本片以前，心裡是抱著希望跟前傳有所連結，也想看看專門拍驚悚動作片的阿

  瓦雷導的異形，觀後大致上接近本傳四集的系列風格。


  但是，內容有許多驚喜！只能說結合的挺巧妙的，有出現關鍵字跟道具、角色，已經有稍

  微撫慰到看不到聖約續集的得失心。


  這次是到台中文心秀泰新的X screen 廳觀看，真的很推薦！！！ 許多外太空行星環的震

  撼壯麗景色、恐怖氣勢感十足的地獄走廊，都搭配延伸的很巧妙！我的位置是8排的中間

  ，視野跟包覆感非常好，沉浸感強烈，這集的大畫面也不少，值得！


  邊看都會一直不斷腦補聯想聖約後的續集XD,如果還有的話，到

  底大衛會把女主角跟整船的胚胎做成什麼，好好奇啊啊啊啊啊




  --'
