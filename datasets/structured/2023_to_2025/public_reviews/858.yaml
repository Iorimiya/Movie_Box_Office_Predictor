url: https://www.ptt.cc/bbs/movie/M.1723699684.A.F69.html
title: '[好雷] 《異形：羅穆路斯》'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  1.劇情與演技表現

  本片是異形系列久違的新作，個人認為劇情簡潔明瞭也沒有異形系列為人詬病的聖母與失智

  隊員，在這方面的進步我十分肯定。

  其中人造人安迪的演技更是令人激賞，前期在礦工星的唯唯諾諾與不像人類的「非人類感」

  都詮釋地非常生動!他不連貫的眉眼表達與怪異的類ChatGPT語句起初令人厭煩,卻在揭開身

  份後才讓我瞬間擊節稱賞其表演功力；而後插入科學官晶片的冷靜無情更使人印象深刻!

  在狡猾的異形以孕婦勾引人類開門時，採取正確的冷眼旁觀策略避免了更大的損失；在最後

  女主要慘遭異形毒手時也堅毅勇敢地跳下來秒殺之(雖然不知道為什麼在有重力情況下自如

  此高處掉落還能瞄準並毫髮無傷)總的來說，安迪乃本片最佳男主角。

  而女主就比較遜色了,人物本身沒有甚麼成長曲線，有些許聖母，不過基本上比較爽快的槍

  林彈雨爆殺異形大海與大戰「人型異形」的戲碼都詮釋地很到位，給個及格分。其他配角就

  比較臉譜化了：

  一看就知道處處立旗的霸凌仔男二、當隊長卻很粗心大意的男一、「人型異形」專用培養基

  孕婦、自私仔男性氣質濃厚女,基本上一出場就大概知道他們下場了。

  2.怪物的突破與創新

  這點導演是勇於突破異形系列一直以來的印象：

  即非人類、高科技流線型與恐怖卻又充滿猙獰美感的昆蟲外骨骼結合,在收尾處藉由藥劑與

  孕婦的結合，創造了「人型異形」這充滿怪誕而不協調的產物，但個人認為他太過人類化了

  ，導致失去了異形本身銳利而俐落的昆蟲化美感，變得有點像萬聖節滑稽的南瓜骷髏稻草人

  元素雜揉的搞笑動物，也好像沒有表現出異形高智商狡黠的特點，只保留舌頭與尾鉤等異形

  特徵。此處是我覺得比較可惜的，本來還臆測他能發出嬰兒啼哭聲之類的生物擬態以展現其

  高智商呢!

  3.4DX體驗與整體感想

  強烈推薦4DX觀影!不管是太空船起飛撞擊還是女主清空彈夾爆殺異形海，強烈的推背感與高

  低起伏幾乎毫無冷場!(所以不太建議點爆米花之類的)而在前面略顯冗長的鋪墊後，不管是

  控溫室全神貫注躲避抱臉蟲的小心翼翼、孕婦一覺醒來就必須與大異形躲貓貓的極致恐懼、

  大戰人型異形的激烈鏖戰，可以說是沒有冷場，完全沒有喘口氣的時間!


  劇情也沒有強行降智商的白癡與硬要救人的爛聖母行為(都被切換人格的安迪擋住了)，可惜

  比較缺乏與普羅米修斯等設定的再深化(還是我沒有發現？有待顯微鏡觀影的版友補充)

  總體來說，大推這部異形最新作^^


  --



  個人覺得只輸普羅米修斯的大場面，不過現在看來導演好像是要分成兩種系列？

  來是演員問題哈哈

  個人覺得蠻突兀的，有可能本來有支線後來刪除了'
