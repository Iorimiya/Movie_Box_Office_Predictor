url: https://www.ptt.cc/bbs/movie/M.1723779871.A.FBB.html
title: '[好雷] 異形：羅穆路斯，有情懷的異形迷必看 '
content: '雷文防雷資訊頁






  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~











  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  有雷喔～


  有雷喔～



  這部非常適合有看過異形系列跟擁有異形情懷的人


  裡面非常多致敬異形全系列的彩蛋



  故事一開始，就是女主角小雨（超像愛情小說的女主角名字）跟他的生化人弟弟安迪


  要去另外一個號稱看得到陽光的星球（簡稱B星球吧）


  他們所處的星球（簡稱A星球吧）永遠看不到陽光，而且有週期性的毒氣


  會讓人慢性的死亡


  結果完全不意外，當小雨透過合法程序要申請去B星球的時候


  被資方給坑了，說工作時數不到，別想移民（可以提到勞工局申訴嗎？ XD）


  總之，在絕望的時候，小雨以前的工作同事


  發現外面有一艘傳看起來是被公司給廢棄的，裡面有凍眠艙，可以支持他們偷渡到B星球


  腦波很弱的小雨在帥哥男主角勸說下，答應偷渡計畫



  一行人（帥哥男主角、男主角弱智的表弟、生化人安迪）上了羅慕路斯號，


  發現是有凍眠艙，但冷凍燃料只夠3.2年，要到B星球起碼9年，所以只好再去找燃料


  到了燃料室，不知道為啥啟動了抱臉蟲啟動機制


  最衰代表的光頭女，只是去救人的結果被抱臉蟲給抱住了


  眾人啟動掛點很久的異形1的生化人（AI特效嗎？臉整個沒變啊）發現這邊的秘密


  但光頭女從被抱臉到破胸生出萌寵（？）小異形時間超快的


  第1集被抱臉到生出小異形時間超長，還讓宿主吃了一頓最後的晚餐


  這時候大家都慌了


  1隻異形幾乎幹翻人類，只剩下被安插第1集生活人模具的安迪跟小雨


  突然想到第4集，雷普利隨手就可以秒殺1隻異形，根本神力女超人 XD


  小雨靠著那一把神槍（我忘了那把槍的名稱，但也在異形1出現過）又幹翻了一票異形


  這段幹翻異形的橋段，也致敬了異形1、2




  小雨、安迪、懷孕女三人逃到原本的船艦，準備前往B星球的時候


  懷孕女因為注射有黑水的針筒後，生出了半人半異形


  不得不說，普羅米修斯結尾的人類跟異形，還有異形4的「半人半異形」還比較萌


  這一集的半人半異形，身高超高，長得也超醜，一臉超冷酷的表情


  這部分致敬異形2（要逃離進入凍眠艙，發現有異形）跟4（半人半異形）


  小雨把這隻用失壓的方式把半人半異形，趕出了船艦


  哇～～～跟異形2的雷普利一模一樣，整個超有情懷的


  最後就剩下小雨跟安迪活著前往B星球了




  這部真的是值回票價，滿滿的異形經典元素，也有滿滿的異形致敬情懷


  其實我不太喜歡有大衛的異形，整部外星太空科幻驚悚，變得...好像是在上哲學系的課


  我就是要看異形1、2、3、4這樣的密閉空間科幻驚悚啊！


  總之，非常值得異形迷進入電影院好好觀賞


  --'
