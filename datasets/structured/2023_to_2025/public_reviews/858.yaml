url: https://www.ptt.cc/bbs/movie/M.1723884840.A.8BF.html
title: '[好雷] 異形:羅穆路斯'
content: '我自己只看過異形1跟普羅米修斯


  不算是異形的粉絲


  有人約才會去看的那種


  羅穆路斯滿好看的


  把密閉驚悚的精神拍的很好


  沒有普羅米修斯那種弱智科學家


  反之是一群身手矯健的年輕人


  看他們電抱臉蟲意外的很爽


  有點像在看動作片的感覺


  後面也有喜聞樂見獵殺跟大戰橋段


  總之該有的都有了


  不該有的也都沒有了


  如果跟朋友約的話滿推薦看這部的


  散場後可以一直討論異形寶寶


  我唯一想吐槽的就是明明船上一堆就一堆成體異形


  結果剛上船的時候卻一隻都沒有


  明明主角一行人上船後就乒乒乓乓的


  只能說是為了電影鋪陳也沒辦法


  其他橋段都有解釋前因後果算是不錯了


  --








  --'
