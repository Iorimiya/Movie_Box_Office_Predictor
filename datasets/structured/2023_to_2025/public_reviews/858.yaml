title: '[新聞]《異形:羅穆路斯》首波評價出爐:系列最佳'
content: '新聞網址：


  原標題:



  2024-08-13



  《異形：羅穆路斯》首批觀眾的反應已經在社群媒體上釋出，導演費德阿瓦雷茲這次執掌

  由雷利史考特 1979 年創立的系列新作，而初步的媒體反應普遍好評。



  在這個新的篇章中，我們見證了一群年輕的太空殖民者，他們意外地發現了一個廢棄的太

  空站，而那裡潛藏著可怕的生命形式。



  《異形：羅穆路斯》的演員陣容包括卡莉史派妮、伊莎貝拉莫塞德、亞奇雷諾、大衛強森

  、吳愛琳、史派克費恩和羅伯特波布羅茲基，將於 8 月 15 日在台灣上映。不僅雷利史

  考特和詹姆士卡麥隆喜歡《異形：羅穆路斯》，觀眾們在看完早期的放映後也對阿瓦雷茲

  所取得的成就讚不絕口。




  《綜藝報》資深編輯 Jazz Tangcay：


  「#異形羅穆路斯 狠女人回來了。

  費德阿瓦雷茲沒有讓人失望。很棒的聲音設計和世界觀建立。實體特效太厲害了，

  讓我做了一堆惡夢。」


  這對導演阿瓦雷茲來說一定是個好消息，他曾自豪地表示，這部電影中「沒有使用綠幕」

  。



  《The Escape Pod》Podcast：


  「，也

  可能是我最喜歡的恐怖片。迫不及待地想再次看到它，我很高興全世界都能像我們今晚一

  樣欣賞這部傑作。」




  影評人 Big Screen Berkan：


  「

  。」




  內容創作者 TropicalJoe：


  「對 #異形羅穆路斯 的第一感想：


  導演回歸了恐怖片的根源，但沒有犧牲掉動作場面


  對第一集的超棒致敬，再加上新的元素


  超瘋狂的結尾


  」




  影評人 Rachel Leishman：


  「#異形羅穆路斯 是我第一次在看《異形》電影時感到害怕。 卡莉史派妮飾演的 Rain

  是這段旅程中最適合跟隨的角色，在費德阿瓦雷茲的曲折推進中，你永遠不知道羅穆路斯

  將走向何方。第三幕真是狂野。我很愛。」


  --


  穩了嗎!!??


  --'
