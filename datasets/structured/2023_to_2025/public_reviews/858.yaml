title: 'Re: [雷] 好雷 異形 ：羅穆路斯'
content: '最近這部開始上二輪片

  今天去林園看 是唯一一部全部看完的

  金鋼狼只看10分鐘 看金鋼狼死侍對戰百人死侍就走了

  腦筋急轉彎2因為先前有看過 所以跳過最前面也還行


  這部戲我覺得缺點在於場景取名羅慕路斯 喜好歷史的人應該都知道其中代表的含意

  我會直覺反應 這難道是人類由另一個民族培育出來的意思嗎

  但實際也就真的是船區叫羅慕路斯跟雷路斯 有點弱

  本來以為還會對工程師民族有更進一步的說明


  不過安迪真的演得很好

  愚鈍跟冷峻調適得很到位



  --'
