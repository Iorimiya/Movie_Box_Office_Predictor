title: '[ 好雷] 異形：羅穆路斯 '
content: '推給恐怖片愛好者，這部是我近期看過驚嚇程度最高的驚悚爽片

  為了更好的被嚇（？ 我跟朋友還跑去看ScreenX

  看完大概知道為啥異形又經典又紅


  其實原本很擔心會看不懂，畢竟完全沒看過這系列

  幸好蠻好嗑，沒看過系列但看驚悚片的人完全可以去看

  以下有雷

  -

  -

  -

  -

  -

  -

  -

  -

  -

  前面鋪陳滿好的  節奏和緊張點抓得不錯

  導演利用配樂還有時不時安靜的手法堆疊觀眾害怕的情緒

  我緊張到手心都是汗，一直戰戰兢兢不確定哪時候會被嚇

  有幾個地方真的印象太深刻


  1. Tyler他們去威蘭的太空站找凍眠艙，結果不小心把抱臉蟲解凍

  他們被關在密室裡逃不出去

  在那小小的空間重複 被抓>逃走>被抓>逃走 的狀況

  我的心情也一直 驚呼>好險>驚呼>好險

  心情完全無法安心:)


  2. Tyler被吊起來那段，跟異形面對面又那麼近

  看到要瘋掉(誠心建議大家不要吃飽看)


  3. 最可怕噁心的不是抱臉蟲的幼體破胸，而是Kay把人形怪生出來

  怎麼可以長那麼噁心，而且當他靠近媽媽，我以為他需要哺乳

  結果是吸血！！！我的天！！超級恐怖！！！


  雖然很多細節被嚇到忘記，但撇除恐怖驚悚元素

  這部大型企業太空殖民的世界觀設定真的好酷

  而且殖民地、太空站、飛船也都做得很逼真很有沉浸感


  整體看完被嚇得好累但好過癮

  ScreenX直接把驚悚氛圍拉到最滿

  雖然不想打擾大家觀影，但真的忍不住狂叫

  這部我覺最強的是那種很窒息的壓迫感

  真的是讓我暫時停止呼吸..


  --'
