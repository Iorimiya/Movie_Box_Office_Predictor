title: '[好無雷] 異形:羅穆路斯無雷心得'
content: '很幸運地抽到4DX的電影票，所以昨天看完了。

  這次真的很好看。算是讓這部老IP有拍出新的味道。


  整部片蠻驚悚恐怖的，調性變得比較像恐怖片而不是怪物片這樣。

  氣氛和美術風格營造得很好。


  本次的人物設定還是免不了降智，但個人覺得比較吞得下去一點。

  但劇情上有安排解釋為什麼會降智，另外老觀眾可能一看就知道誰會活誰會死就是了。


  故事說得很淺白，比較不需要像普羅米修斯看完會有滿肚子問號需要去查詢這樣。

  比較喜歡這樣的安排，看的時候會比較認真在電影上。

  不會一直卡現在是甚麼狀況的思考。


  另外蠻推4DX的影廳。可以模擬飛船的飛翔/無重力的飄浮感/肉搏戰的刺激。

  還會噴水搞得自己很像被酸血噴到一樣XD


  真的很推這次。希望這導演能繼續發展這IP下去，會繼續想追。


  --

  對，配樂比較一般一點。

  我不知道無雷能不能說這件事情XD 還是去電影院看啦。

  完全不用喔。雖然有舊作的彩蛋。但並不是很強烈。不影響觀影。

  真的，會有種厲害喔，虧你想到這些。

  真的很不錯耶，看完會很期待下集。

  很希望他大賣!

  劇情推演上有一些必須的，但沒有很多。

  真的，大推4DX。

  真的建議4DX，因為體感太有趣了(又風又水又搖來搖去還有閃光)

  08/15 19:4

  不用喔，這部門檻很平易近人'
