url: https://www.ptt.cc/bbs/movie/M.1723892715.A.2E0.html
title: '[好雷] 異形 羅穆路斯 這部真的好看'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  至少快十年沒去電影院了

  昨天看完某人頻道介紹後就馬上衝去看了


  不得不說這導演真的是天才

  敘事邏輯簡單粗暴但合理

  人物塑造、性格、行動邏輯全都完美

  短短幾句對白就能解釋某個角色為何這麼機掰


  除了合成人竟然沒背叛讓我很意外以外

  還有在無重力狀態下閃躲的場景真的是天才發想


  除了這次的異形有點軟皮，打完異形屍體突然消失以外讓我有點出戲以外無可挑剔


  最後想問一下，為什麼安迪踩到藍色的水（？）會突然當機啊？


  -----

  Sent from JPTT on my iPhone


  --'
