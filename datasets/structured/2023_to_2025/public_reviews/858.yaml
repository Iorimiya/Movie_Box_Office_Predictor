title: '[好無雷] 《異形：羅穆路斯》'
content: '異形系列中

  我很喜歡普羅米修斯和聖約這種不同風格的

  這點可能跟別人不太一樣


  羅穆路斯也摻雜了一些這種色彩

  保持一些神秘(儀式感？)的感覺讓人很過癮

  雖然有些橋段我個人不是太喜歡

  太過刻意驚悚恐怖的橋段之類的

  不過喜歡驚悚片的人可能會覺得很過癮


  很難得人物沒有什麼降智行為

  一般這種作品都會見到令人無言的降智行動

  但這片一直都有進行行為上的解釋

  整片看起來是讓人覺得舒服的


  雖然有懷舊情節在

  可能無法說是系列最好看

  但裡面加入的變革

  或許的確是系列中最出彩的

  讓人感到非常驚艷


  演員的表現也都很棒

  人物刻畫曲線凸顯人物特質

  很容易區分每個角色的不同性格

  所以也很容易看出誰會第一個死

  誰會留到最後之類的= =


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
