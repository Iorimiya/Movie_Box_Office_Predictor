title: '[討論] 二刷異形：羅穆路斯 稍嫌不合理處(步槍)'
content: '防雷



  防雷



  防雷



  這個週六週日各看了一次


  整體的觀影體驗都很不錯


  二刷時特別觀察同場觀眾被Jump scare嚇到的反應


  非常有趣


  唯一覺得奇怪的地方


  是標榜彈頰有450發的電磁脈衝步槍


  女主在無重力的橋段裡已經幾乎射光子彈了


  可以看到步槍側面的彈量剩一格、閃爍紅光


  在後面女主要上電梯時被異形抓住


  又繼續開槍，然後異形血把電梯網子溶了


  到這裡還好


  比較誇張的是幾分鐘後


  仿生人在電梯井幹翻異形、解救女主


  彷彿開了子彈無限外掛拼命射


  最後再烙下「離她遠一點」的致敬台詞和動作


  編劇是不是忘了這槍應該已經沒子彈了？


  有點出戲


  翻了版上的文章


  還沒有版友提到這個小小Bug

  ----

  Sent from  on my iPhone 11


  --'
