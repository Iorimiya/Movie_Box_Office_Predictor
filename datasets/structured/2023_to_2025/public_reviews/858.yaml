url: https://www.ptt.cc/bbs/movie/M.1723708319.A.B9C.html
title: '[好雷] 異形：羅穆路斯 4DX 極致體驗'
content: '第一次體驗4DX影廳就直接獻給異形了

  這部真的很適合看4DX！

  本身劇情就已經很令人覺得恐怖了

  4DX的效果直接讓等級Level up，有感提升

  有雷










  主角群在太空穿梭或無重力環境的時候，椅子也會隨著飛行和旋轉的節奏移動

  彷彿跟著主角群一起穿梭太空


  再來是抱臉蟲和主角群的第一次相遇

  在紅光和密閉空間裡，牠逐漸往Bjorn的方向步步逼近的時候

  可以感受到氣氛讓人窒息

  費德·阿瓦雷茲真的很會拍，就算故事結構很單純

  他還是用很多聲光效果、音效把恐懼拉到最高點

  印象深刻主角群被抱臉蟲攻擊的剎那，椅背被戳一下+配合畫面超有感

  真的有被嚇到


  再來是破胸體要從Navarro身體鑽出的時候

  那一幕直接搭配噴水霧，真的被噁到

  還以為自己也被血漿噴得滿身都是...


  整部覺得最恐怖的是最後人形異形

  那個笑容我真的晚上會做惡夢，在我的腦海揮之不去


  整體來說這次觀看體驗很不錯

  聽朋友說這部比起她之前看的其他部，這次4DX的體驗更爽

  簡直把所有該噴該晃該嚇得地方毫無保留的呈現

  推薦給大家


  --'
