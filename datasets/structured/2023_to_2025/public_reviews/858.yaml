url: https://www.ptt.cc/bbs/movie/M.1723991040.A.F51.html
title: '[  雷] 異形：羅穆路斯'
content: "第一次看到異形是在異形戰場\n心想：真是集美麗與暴力於一身的生物（大衛上身\n於是我愛上了異形,這些年從異形戰場一路到現在\n順帶一起看終極戰士系列（也是很棒啦\n\
  當時聖約上映我隔天要月考照樣衝\n下場就是成績比被抱臉蟲寄生還慘\n但我甘之如飴（其實是根本不在乎成績\n不過我是偏愛前傳的那邊,所以有些想法還請見諒\n\n\n\
  \n\n\n\n防雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n基本上這部電影就是本傳四集那派的\n我不太說四集誰好誰壞,而是各有千秋\n\
  真的要比會用評價穩定度.他一定贏3、4\n就是用穩健的風格呈現異形的恐怖\n前中段是異形本身的恐怖,後面是導演自身的恐怖\n雖然早就對這個導演的風格略有所聞\n\
  那隻怪物真的是幹你娘嚇死我,噁爛到爆,恐怖到爆\n明顯致敬4的人形異形,那隻我看了就已經不太喜歡\n（雖然雷普利送他上路是4最棒的橋段之一\n這次被噁到新高度,我旁邊的人更是三小脫口而出\n\
  就電影角度來說我覺得並無不妥,就導演風格\n用在這個系列還算合理,只是情感上我不太喜歡\n\n其他部分就都還不錯,這部電影可說是各集縮影\n提及前傳設定,用槍相關段落很異形2\n\
  更別說那句”get away from her,you bitch”\n這句說出影廳的人不少都有笑\n但我猜他們應該不知道這句台詞的來歷啦\n節奏前面有點鬆垮垮,好聽點就是日常,這個見仁見智\n\
  中間開始就沒什麼冷場,一開始的抱臉蟲就五告夭壽\n有好幾段像是在玩遊戲,帶入感更強了\n角色們也比較有腦了一點,雖然我本來就不在意這部分\n最棒的是補上異形的成長設定,還有寄生過程\n\
