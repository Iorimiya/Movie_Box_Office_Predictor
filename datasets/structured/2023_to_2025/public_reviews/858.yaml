url: https://www.ptt.cc/bbs/movie/M.1723821499.A.C6B.html
title: '[好雷] 異形 羅穆路斯 -好雷 -爛尾'
content: '雷文防雷資訊頁










  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  自己是異形迷


  先說結論


  這次有驚豔到 劇情比預期中好 但結尾爛了 導演風格很重


  但 異形迷一樣要看





  先說好雷


  劇情真的不錯


  有把公司採礦世界的無奈感描寫出來


  以前只覺得公司很屌 很壞


  但沒有人這麼深刻描述過 很成功


  為了出逃


  所以去廢棄飛船冒險 也是預期中 卻意料之外


  對超熟悉異形系列的粉絲


  還是有拍出意想不到的感覺




  再來 女主也好看


  劇照覺得很普通 但螢幕上卻很亮眼


  只是主女最後的變強


  劇情上很突兀




  小行星帶 也是漂亮 大概要現在的技術才做得到


  畫面也是


  時間介在一二集中


  但 電腦螢幕 操作顯示 按鈕等等


  能做到自然銜接 卻又沒第一集那麼陽春




  這次的人造人 也是不流俗套 厲害


  把科學官翻過來瞬間 真感動


  後來查資料 才知道是CG了 QQ




  黑水的解釋 我是覺得論述邏輯上比普好


  但 也太容易了吧 XDD





  缺點的話 也是顯而易見


  沒想到還有比異形寶寶更差評的寶寶阿


  簡直就像現在最夯的佛地魔


  體態也俗套了 臉也一整個不搭 口器更是破功


  一直強調背上的呼吸管 也沒必要


  哀 真是敗筆


  對比 普羅比修斯的新品設計 實在無言




  再來就是人很少


  六個人 雖然節奏不會斷


  但過程中 會一直覺得主角群人也太少了吧




  成熟異形的蛻變


  應該是第一次拍出來 電擊棒去戳的橋段很讚


  雖然大家都知道影射性器 但也太直白性器了吧


  這樣就沒有隱含層次的討論了




  然後導演風格很重


  其實就是導演風格的恐怖片 +密集恐懼


  硬要講 不太像原始異形的恐怖


  這部份自己是有點失望





  最後有幾點搞不太懂


  一開始片頭光線不太適應


  有些漏看


  所以一堆抱臉蟲是哪來的啊


  太空運回來的 不是只有一隻成年異形


  怎麼能增生那麼多抱臉蟲跟異形


  船底的沙堆又怎麼來的啊 是啥意思呢 XDDD



  再來 他們說的休眠 沒看錯是九年吧


  哈哈 九年真的有必要這樣冒險吧




  題外話


  角頭也上映


  天母sogo影城 擠滿89捧場


  各樓層都是89 真的也是壯舉了


  究竟哪跑出來的 XDDD





  最後 其實劇情上我是覺得厲害 還能拍出新東西


  但 最後真的被寶寶爛尾了


  --'
