url: https://www.ptt.cc/bbs/movie/M.1723802741.A.067.html
title: '[普好雷] 異形：羅穆路斯觀後感'
content: '看到這次是由費德阿瓦雷茲執導，雷導監製的時候

  讓我對這部片產生了一點期待

  主要費德阿瓦雷茲之前那部暫時停止呼吸我是真的很喜歡

  算是我心目中前幾名的驚悚動作片

  無論是打鬥場景還是驚悚橋段幾乎沒有冷場

  記得當初進電影院看的時候全程夾緊腿，一口飲料都沒喝

  以下有雷










  而雷導又是打造異形系列的先河

  所以從一開始的配樂出現時，真的有種回到當初第一次看異形的感覺

  就連上了太空船和太空站裡面的整體設計風格都有延續最初的風格

  當初會喜歡異形，就是因為他的恐怖美學和在太空船中無處可逃的恐懼氛圍

  還有很多異形經典的元素致敬

  Rook的出現尤其那句Perfect organism真的讓人驚喜

  這次出現的異形實力不算太強大，但還是一樣噁

  有看到說是用真實模型

  的確沒有什麼特效感，這個滿加分的


  總結來說整體劇情的編排算是滿順暢

  沒有過於複雜的背後原因，加上抱臉蟲沒有眼睛和無重力的設定

  也讓主角不會在過程中產生讓人難以忽視的降智過程

  如果要說唯一的缺點的話，前面的鋪陳稍稍長了那麼一點

  雖然說致敬很多，但就算沒看過任何一部異形的人去看也不會看不懂

  喜歡看這類型的應該可以放心衝


  --'
