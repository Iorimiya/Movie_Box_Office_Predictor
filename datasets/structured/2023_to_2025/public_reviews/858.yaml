url: https://www.ptt.cc/bbs/movie/M.1723699228.A.818.html
title: '[好雷] 異形:羅穆路斯  該有的元素都有了'
content: "窩本身是異形正傳1~4 前傳1~2都有看  雖然3看得斷斷續續的\n\n先說,建議還沒看過預告片的,\n雖然還是有藏一些東西沒放出來,\n但這種探索未知領域的劇情,還是保持未知進影廳比較好\n\
  \n大致上窩給中上,\n所以有些評語給系列最佳什麼的,還是自己看比較準~\n\n(防雷頁)\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n有人說這次做宵小去偷東西,是把格局做小了,窩覺得是還好\n\n\
  因為還藏了一個大事件,就是把\"黑水研究成果\"做出來,\n只是可能有點可惜的,此作時間點橋接在一跟二中間,黑水必須失敗,因為後面也沒出來..\n\n雖然此集主角團人數有點少,各種死法也是盡量不同擺出來滿足觀眾,\n\
  ..窩是覺得那個小嘴戳人,真的是頗沒效率的,還要湊近獵物ww\n\n然後staff應該有人玩過《復仇女神號》吧? 任務還可以丟棄,選公司的ww?\n\n之前有搶先觀賞團說第三幕有驚喜\
  \ 窩是猜 \n最後應該..算有中吧?  本集的新種異形,臉還長得有點接近工程師的\n相信這個算是有跟雷導討論過的吧?  不然前傳收尾有點遙遙無期的感覺\n\n\
  推薦對異形有興趣的觀眾去看,血腥度還好,死侍3都比這片血腥的感覺\n--\n\n\n \n\n--"
