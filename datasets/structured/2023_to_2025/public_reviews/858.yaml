content: '雷文防雷資訊頁




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  觀影資訊：如圖



  小弟沒看過異形系列，不過看了預告男女主OK沒有亂改膚色、太空特效感覺也多，版友也

  說僅致敬前系列「不用補課」就來看看惹。


  劇情前期其實很快就帶入上太空應該不到15分鐘從開場後；


  再來，找飛到期望星球的休眠艙，檢查儀表燃料不夠(心裡有先想到鋪陳），再來找冷凍

  燃料但不幸誤觸解凍裝置(心裡有先想到鋪陳）異形怪就掉出來，看起來好像被撲臉是不

  是馬上轉45陞i避開(看混蛋表弟跟男主都用過），光頭女比較可惜會開太空船也很勇敢帶

  女主去救隊員可惜第一個領便當，再來就是男女主與安迪一起到中後期但男主也領便當，

  本來以為預告這畫面(下圖)應該是男女主握槍打爆異形。


  喜歡看小情侶這種愛的射擊

  (基本上只有遊戲跟電影看得到）



  女主真D是主角光環一個人到最後，原本以為帶著男主妹妹回太空艙準備要開往那個星球

  ，結果妹妹生了人形異形(本片小弟覺得很嘔的也Han怕的畫面），最後一幕女主在那麼危

  急的情況下還可以看到綁帶可以打到卸倉閥這不是普通人能辦到的。


  結局女主也進了休眠倉也錄了音希望可以到達，但那個太空艙結果推進器滅了，是不是代

  表沒辦法到了？本片結束(無片尾)。


  致於有關致敬應該是那個科學官跟異形原型給資深觀眾的吧，但小弟怎感覺有其它一點電

  影元素分享一下。


  1. 前期太空艙無重力探索類似有一部電影(大概是維修搶救好像也有重力切換，如有阪友

  知道希望可提醒一下小弟也想回放一下）

  抱歉真的有點忘了。


  2. 中期男女主跟著安迪找逃生路線有一段需要安靜通過很像噤界(好加在那時廳內觀眾都

  沒有人製造噪音）


  3. 女主與安迪在電梯井逃生那段很像透明人1993因為電梯最後有墜落只是沒刮到女主。


  以上小弟個人想像，整體是好看！看起來要等第二部另一個部分三個字的太空站惹順便交

  代一下女主最後太空船飛到哪了。




  --

  你真的要噓人手腳很快耶，我不到30秒就改好惹。

  我想你說得對，他們出場的時間涵蓋整片。

  因為沒看過前系列，小弟也不是異形迷。XD

  雖然是很早的電影但裡面的特效都不假很厲害。

  你不會都是在用全票價看的吧？！'
