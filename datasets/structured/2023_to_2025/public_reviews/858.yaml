url: https://www.ptt.cc/bbs/movie/M.1724053496.A.F15.html
title: '[好雷] 異形羅穆路斯-合理的腦殘'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  相較於以往的異形、異形前傳

  這次整部片抱臉蟲的戲分拉滿

  前期的突襲營造出危機感

  中間塞滿通道男女主還非要走過去的緊張壓抑

  快要結束前還出來露個臉想把女主當孕母

  也是有另外一種新鮮感

  但異形就明顯太過於弱化

  女主一把高科技步槍就能殺個七八隻異形

  本傳四集前傳聖約再加上其他各種外傳、連動

  可能每片的主角團都會覺得不服


  雖然本片還是有個傳統的把大家都拖去死的腦衝角色

  但是至少不會有聖約那種醫官拖著不明感染的病人

  捨棄船外隔離醫療站而上到飛船深處的劇情

  沒有因為害怕就隨便改了個目地的代理船長

  也不會有普羅米修斯那種看到未知物種就急著接近的科學家

  沒有這些完全跟他們的角色背景相違背的人物刻劃

  就是幾個...礦工青少年


  腦殘還是腦殘，一樣是拖著大家去死

  但至少這些礦工青少年是真的沒讀多少書的樣子

  整部片也幾乎在各種可以吐槽的切入點都打上了預防針

  為什麽女主突然是神槍手---槍會自己瞄準

  為什麽沒事要把抱臉蟲解凍---他們真的需要那些能冷凍的酷東西

  為什麽不能等確定結果再把駕駛弄上船---腦衝仔對合成人PTSD

  為什麽異形不殺了女主---異形真的需要代理孕母

  總之

  除了異形大幅度弱化、韋蘭企業怎麽可能不管這個空間站

  還有男主其實也可以當孕母以外

  幾乎沒有其他邏輯問題


  而且這些背景交代都很好的融合在劇情裡

  幾乎都不拖泥帶水的極快交代過去

  但又不至於讓人出戲也不至於看不懂

  譬如有一場異形追殺男主妹妹的戲

  男主跟女主在門的另一側打不開急的歇斯底里崩潰無能

  合成人安迪理性分析結果後拒絕開門

  異形則在男主妹後方高台好整以暇，確定不會開門了才動手

  這一場戲把異形的殘忍狡猾、人類的感情用事、合成人的理性計算

  同時呈現出來

  雖然這算是個常見的橋段

  但也是把三種陣營的不同拍的乾淨俐落


  其他我比較感興趣的地方是科學官人格的安迪

  載入科學官資料重啟之後的安迪

  雖然也是純理性考量

  但比起大衛、艾許之流又多了許多的誠懇

  就是老老實實的告訴你

  "不行，那個異形就是在等我們開門就要闖進來，所以我們不能開門"

  "我現在以韋蘭企業利益為第一優先"

  大衛跟艾許那種用真話騙死人的能力半點都沒有

  八成是瓦特的後繼機種

  但跟大衛、艾許比起來，安迪也明顯無聊許多

  他沒有大衛那種想要繁衍的慾望

  也沒有艾許那種試圖掌控的權謀

  拔掉科學官的資料就只是個老好人老弟弟

  角色上比較沒有像前兩者這麼深度有點可惜


  總得來說我覺得緊張的氣氛拍得很好

  真的嚇到的鏡頭有幾個但不多

  壓抑遠多於驚嚇沒有太多冷場

  劇情也算是在邏輯上，蠻推薦的


  --'
