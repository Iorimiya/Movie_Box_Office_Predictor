title: '[好無雷] 異形-羅穆路斯'
content: '這部電影是疫情過後少數優秀的系列續作

  這片不敢說滿分

  但起碼在我心中有80分以上 而且沒把經典IP砸爛


  氣氛 畫面 節奏 都掌控的很棒

  跟著電影推進 甚至一度以為在玩最新款的異形電玩遊戲W


  雖然有些橋段很老梗、突兀

  但片中出現許多橋段、台詞、道具來致敬異形各集經典元素

  看到當下瞬間懷念當時的感受與震撼

  沒想過活了好幾十年

  歷經各種苦難(天災 疫情)

  還能繼續在電影院裡追異形系列電影 就覺得有夠幸福

  未來希望有生之年還能繼續欣賞雷導或其他新銳導演拍攝的新異形電影



  感謝能活到現在進電影院欣賞這部電影

  感謝:

  費德·阿瓦雷茲

  雷利·史考特

  HR·Giger

  各集導演、演員



  偷偷說 Steam 異形-孤立(Alien: Isolation) 特價到8/20

  看完電影再玩這款更有Fu~


  --

  不怕不怕 異形尾巴準備好了W


  恭喜各位覺得好看W 這片就值得了'
