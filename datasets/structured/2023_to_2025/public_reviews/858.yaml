url: https://www.ptt.cc/bbs/movie/M.1725698395.A.F29.html
title: '[討論] 有雷，異形羅穆路斯的彩蛋小整理'
content: '一，小雨工時加長，調職礦區

  小雨爸媽死於三周前，死在礦區

  公司決策其實就是父債女還










  批判力很強

  公司與其用機器分析空氣

  還不如犠牲活體來省成本


  三，太空站羅穆盧斯與瑞摩斯


  羅穆盧斯（拉丁語：Romulus，約前771年出生[註 1]，約前717年7月5日逝世）與瑞摩斯

  （Remus，約前771年出生，約前753年4月21日逝世）是羅馬神話中羅馬市的奠基人。在羅

  馬神話中他們是一對雙胞胎。


  神將雙胞胎帶到帕拉蒂尼山上，在一顆榕樹下一條母狼飼養了兄弟倆。

  呼應了工程師異形吸乾凱的奶



  1，兄弟倆人後來因為就誰獲得當地神的支持應該給新建的城市命名的問題而發生爭執，

  甚至爆發戰鬥，結果羅穆盧斯將瑞摩斯殺死。


  2，通過搶劫附近的薩賓人的婦女增加了人口，也通過搶劫附近的城市增加資源



  3，羅馬市兵役長，是因為方便組織搶劫


  四，繪畫馬賽鼠疫


  這次爆發的「馬賽大瘟疫」是典型的人禍。首例疫情出現在前往馬賽的商船裡，


  當這艘滿載著病毒的「死亡之船」抵達馬賽後，港口機關原本下令將其隔絕，但馬賽的權

  勢富商拒不從命，因為有大量進口貨物積壓船上，影響其經濟利益。


  於是愚蠢的富商向港口機關施加壓力，強制取消這艘商船的隔絕措施。商船入境後，徹底

  打開潘朵拉的魔盒。




  五

  真的是對岸看很細

  雨和泰勒為安迪吵時

  窗口已出現了


  太空站墜毀也有一個白點脫離

  媽的，放雷普立去死

  等LV-426建設完才叫醒她是吧


  六，比諾恩的電棒和凱的胎

  這已在明示

  凱的胎是比諾恩的

  比諾恩的電棒就是屌

  他亂刺安迪就是諷刺，你沒種

  他亂刺異形蛹反被顏射

  諷刺吧！


  剩下的，歡迎大家補充

  有雷，異形羅穆路斯的彩蛋小整理


  --

  隔離14天

  但老媽ai大概還是會開門

  畢竟公司至上

  我現在對x複數的id有PTSD

  想到什麼弱女子

  唉！

  馬賽的權勢富商拒不從命，因為有大量進口貨物積壓船上，影響其經濟利益。



  太多了！'
