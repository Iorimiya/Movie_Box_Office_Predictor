  《異形：羅穆路斯》全球票房來到2.34億美元，片中許多驚悚畫面讓觀眾難忘，特別是邀

  來羅馬尼亞籃球員羅伯特博布羅茨基（Robert Bobroczkyi）扮演的「Offspring」，近來

  導演費德阿瓦雷茲（Fede Alvarez）便曝光了一段幕後影片，掀起網友討論。


  影片中，可以看到身高231公分的羅伯特博布羅茨基換上戲服以及特效化妝，化身成

  Offspring，他傾斜著身體，一副很自在的模樣討論拍攝狀況，可說是相當違和，一旁則

  是女主角卡莉史派妮（Cailee Spaeny）。導演費德阿瓦雷茲分享道：「極具天賦的羅伯

  特博布羅茨基，正在準備追趕卡莉史派妮。」兩人的身高差距也形成強烈對比。讓大批網

  友不敢相信，還沒經過後製就如此駭人。


  導演費德阿瓦雷茲其實想要用實拍呈現恐怖氛圍，視覺效果總監Daniel Macarin分享，當

  時一看到背景和羅伯特博布羅茨基穿著戲服的樣子，就感到很可怕。動畫總監Ludovic

  Chailloleau則認為，羅伯特雖然並非專業演員，「但他的移動方式非常獨特，考量到他

  的巨大體型以及這個生物的概念，他在視覺上帶來了許多全新的效果，所以我覺得很棒。

  」



  評論：

  那時候就有覺得特效也做太好

  沒想到是真人啊啊啊 現在開始崇拜特效化妝師


  --

