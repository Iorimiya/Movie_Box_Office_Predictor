url: https://www.ptt.cc/bbs/movie/M.1725387654.A.A1C.html
title: '[雷] 異形 羅穆路斯 幾個問題'
content: '防











































  必須要說，我是看4DX


  覺得體驗感讓這部加分很多


  我被耳邊吹氣嚇到好幾次，乾


  如果是看數位版會覺得普通


  主要是劇情太鳥又了無新意


  最喜歡的還是是普羅跟異形第四集


  這部比較像是難看版的第四集


  首先一開始幾個社會底層屁孩，為何可以開一艘算大的飛船？我本來以為是個接駁船之類的

  ，結果後來說可以飛到拿什麼星球，飛9年


  還有一個超大航空站飛到天上了，完全沒人要處理？何況還是公司資產？


  再來人物刻畫不深，所以不能理解為何最後女主還要去救安迪


  而且女主一開始說不信任那個注射劑，在電梯又叫單親媽媽注射？看不懂


  還有女主電梯井掉下去，被異形戳中為何也沒受傷？


  結局感覺似曾相識，我忘了是2還是3，雷普利的小孩也是被吸出去


  給我感覺整片就為拍而拍，沒講到什麼東西


  不像普羅或是聖約有帶到很多內容


  動作程度又沒四精彩，嚇人也多半是音效


  覺得有點可惜


  --'
