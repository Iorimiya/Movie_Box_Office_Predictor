title: '[新聞] 異形：羅穆路斯 導演證實不會回歸執導'
content: '《異形：羅穆路斯》導演證實不會回歸執導續作！但下一集的故事已經構思好了




  （圖片來源：二十世紀影業）


  去年全球票房賣破 3.5 億美元的《》（Alien：Romulus）很快便確定要

  續拍第二集，編劇兼導演的費德阿瓦雷茲（Fede Alvarez）也早就投入構思後續的故事，

  但自從續拍的消息證實後，外界普遍都認定，阿瓦雷茲也會繼續執導第二集，然而最近接

  受外媒《TooFab》採訪的他卻意外透露，他其實已經決定將第二集交給其他人接掌。




  （圖片來源：Pinterest）


  阿瓦雷茲表示：


  「我們才剛剛完成《羅穆路斯》的劇本，但我這次會推掉導演的職務，我只會和雷利史考

  特一起擔任製片人，而我們現在正尋找新一任的電影創作者（導演）加入行列。我想這系

  列的傳統就是這樣，但雷利是例外（意指他是唯一有執導超過一集以上的本系列導演），

  一位創作者進來拍一部，拍完再把指揮棒交接給下一位。但我們寫出《羅穆路斯》續集的

  故事，是因為我們真的很喜歡我們在《羅慕路斯》奠定的基礎，而我們想把這故事延續下

  去，我們熱愛這個故事，現在我們就差找到一位真的很想把握機會的導演。」


  文：Joker



  新聞網址：




  --'
