title: '[好無雷] 異形：羅穆路斯 4DX'
content: '內文無劇情雷請安心




  拿到兩張很有質感的海報好喜歡，


  是有厚度的卡紙，上面字體跟異形纏繞的部分是磨砂的。



  大推4DX版本！


  第一次看真的覺得票價值了，


  震動跟水氣都跟劇情配合的很好，


  尤其是驚險場面配上體感真的超級刺激！



  主要是劇情驚嚇，但是不是莫名其妙亂嚇一通，


  血腥程度一般，


  不會有太近距離血腥畫面，


  有看過其他部異形的應該都可以接受，


  同場也有看到女性自己一個人來看的，


  （這部沒有屍變那麼噁心XD）



  座位選擇給大家參考一下


  新竹大遠百4DX F9 F10 覺得滿剛好的


  好想再看一次！






  --'
