url: https://www.ptt.cc/bbs/movie/M.1724167662.A.6D8.html
title: '[好雷] 異形：羅穆路斯-有個地方不喜歡'
content: '雷文防雷資訊頁




  以下有異形：羅穆路斯的雷























  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  前半段的壓迫感營造覺得很棒，

  一開始劇情是女主的人日常生活這點很喜歡，

  之前比較多都是休眠倉醒來，


  直接開門見山，

  不喜歡的點是掃射異形那邊，

  一看到複數異形就覺得不太妙，

  結果果然異形變成免洗反派


  個人還是比較喜歡

  被殺被殺被殺>逃逃逃>


  然後

  被殺被殺被殺>逃逃逃>智取異形


  我自己喜歡看人類面對外星生物宰制人類的劇情


  不過要爽度大掃射也不是不行，

  只是前面要鋪陳異形帶來的壓迫感，

  就是異形一直殺一直殺，

  人類無能為力走投無路，

  最後大反撲


  不過這次異形沒出場多久，

  現身在女主面前後，

  也只收掉一個男主(?)，

  然後女主跟人造人嘻皮笑臉，

  最後射爆異形


  對我來說免洗感太重了


  另外就是覺得老鼠突變的訊息，

  可以放在孕婦休眠倉閃紅燈之前，

  電影這麼早就揭露會突變的訊息，

  後面的驚喜感有點打折


  上述都是個人主觀喜好，

  個人還是滿推這部的


  --

  我也覺得人造人放突變的片段很奇怪


  對耶，

  讓大家緊張打黑水也是種戲劇效果'
