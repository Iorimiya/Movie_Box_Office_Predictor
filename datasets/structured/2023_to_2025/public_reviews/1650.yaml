url: https://www.ptt.cc/bbs/movie/M.1687063469.A.74A.html
title: '[好雷] 搭過火車的人就能看的《南方，寂寞鐵道》'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  標題會這樣講

  是我發現不少人在講這部片的心得、推不推薦時

  都會先表明自己是不是鐵道迷

  山椒魚、黑熊的紀錄片好像就比較不會有人強調自己是不是登山客、動物迷

  或是生物自然相關科系?


  可能這就是人文跟自然的差異



  而我自己看完後覺得

  看這部片不必是鐵道迷

  甚至像我對火車一無所知

  只要曾經搭過火車、對火車有屬於自己的回憶

  看這部片時

  就能想起火車與自己和台灣這塊土地的連結

  還可以額外增加對南迴鐵道、火車相關職業的認識




  像我真的完全不懂火車和南迴鐵道

  開場用蒸汽火車的畫面講述南迴電氣化

  我還很納悶火車不是本來就用電嗎

  難道南迴在十多年前還是蒸汽火車?

  完全不知道中間有柴電機車XD

  學校的歷史課也只有簡單帶過台灣從清朝到現在鐵路擴張的程度


  本來去看之前以為自己曾經搭過南迴鐵路

  但也許小時候去花東都是家人開車或從北邊繞

  對電影中的並排式座椅、可以打開的窗戶和要在枋寮換車完全沒有印象


  但這些都不影響我享受這部電影

  反而能當成一堂輕鬆有趣的課




  多虧了這部片留下南迴電氣化前的影像

  不然像我這種沒經歷過的人

  要認識南迴就要特別到相關的鐵道文化館閱讀文字、看看文物

  比電影更難接觸到




  昨天導演說她接到消息

  本來有上映這部片的電影院就不多了

  現在他們還有在考慮端午連假要不要繼續上

  還是讓出影廳給閃電俠蜘蛛人那些外國大片


  撇除愛台灣、支持國片等半情緒勒索

  至少本來就想看的人

  可以把握這幾天先去看一下

  也可以多推薦朋友看

  不知道是以前我忽略了，還是這幾年才流行起台灣的紀錄片

  總之我很樂見越來越多這種能讓台灣人更了解自己生長的土地的電影

  如果有外國朋友想認識台灣

  除了一般的景點和餐廳

  我也會推薦他們透過這些紀錄片知道台灣特有的生物和文化





  另外導演有說電影能放的東西有限

  對南迴有興趣的可以買書

  但她好像對自己的說故事能力不太有自信XD

  告訴觀眾如果覺得她敘事能力不好

  最起碼書的價值在最後50頁有當初工程師們一個月才能手繪出一捲的PP圖複本



  相關當局當初覺得用不到就當廢棄物燒掉

  只有一卷編號01~50的被工程師保存下來



  昨天滿場(照片取自FB粉專)





  這個畫面有做成海報當成上映前套票的特典


  特別場的集章紙和印章





  --'
