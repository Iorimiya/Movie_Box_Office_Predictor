url: https://www.ptt.cc/bbs/movie/M.1687243737.A.DC5.html
title: '[好雷] 南方，寂寞鐵道 一段台灣人的生活記憶'
content: "雷文防雷資訊頁\n\n在台灣，只要前往花東地區，民眾能夠走的就是公路、客運、鐵道三種\n而中途就是經過中央山脈，怎樣子去建設路段讓兩邊可以流暢通行\n\
  在每個路段都有一個艱難的工程史\n\n片中除了記錄了鐵路南迴線的電氣化之外，也一同紀錄了整個南迴線的歷史\n確實也可以作為一部台灣的通勤史來觀賞\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n枋寮-台東，只要是雲嘉南高屏地區的人應該都有搭乘過相關車型的經驗\n\
  \n藍皮普快、柴電自強、莒光，記憶中要去這些地方都是要搭乘這些車型\n\n相較於現在已經可以搭乘到普悠瑪/3000型新自強號\n隨著時間過去，一些現在的東西已經漸漸地成為了記憶\n\
  就現在來看，這部影片也已經成為了一部分的記憶\n\n影片除了記錄著沿線各站的記憶，也記錄發生在各路段的一些大小事件\n大概我自己有一點記憶的就是莫拉克那個時期\n\
  \n看了一下前面幾篇留言，大家對吳奇泰真的很有印象\n不論遇上的搞軌案這樣子的事件還是能夠放下來，在電氣化試車也一直在陪同加班\n其實在聽這一段的時候一度以為他已經退休了才能輕鬆地講故事\n\
  \n這幾天也有跟著家人聽到幾段司機故事，像是不能對牛鳴笛，牛會愣住\n或是好好的開著車，順著號誌，突然就被闖軌的給卡了\n\n想到前一陣子司機罵機車的那個片段，背後扛著幾百條人命，弄不好是他們一起出事\n\
  或是又像搞軌那樣子造成路線異常，鐵路可以說很安全也很脆弱\n每天都有養護班的人員下去確認全線沒有異物才能放車\n雖然說很多都是已經知道甚至沒有感覺的理所當然\n\
  現在再去回想這個片段也確實對各個工作人員有著強烈的敬意\n\n這次是自己本來要在首映日同時也是鐵道節的6/9一起跟家人觀賞\n結果正好工作忙不過來就想說要自己平日找時間看\n\
  也剛好家人看完想要二刷同時陪自己慶生就在這個周末一同觀賞了\n\n總之推薦給各位一起來找尋關於鐵路的記憶\n\n--\n仔細一看發現自己喜歡的角色似乎都偏冷門...\
  \                   ↓開燈\n \n \n \n \n \n\n--"
