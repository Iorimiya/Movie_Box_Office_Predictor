url: https://www.ptt.cc/bbs/movie/M.1687003952.A.A54.html
title: '[好雷] 南方，寂寞鐵道'
content: '這是一部記錄南迴鐵道的紀錄片

  南迴是台灣最難開通的火車道路

  也是最晚開通的環島鐵路


  導演趁著要電氣化之前而記錄了這一段歷史






  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  片中最主要記錄了3個段落

  1是訪問了列車長/車站長

  2是南迴搞軌案

  3是開通南迴時的工程師


  當然其中也有很多比較短的片短

  例如他有訪問了鐵道維護員 每天都要趁火車出發前巡鐵軌


  1.列車長/車站長

  列車長大多數人都是因為對火車有熱情才來做這份工作

  不然一年真正能回家的時間實在不多

  其中也有著很多人都是火車世家

  而南迴之中 枋山火車站 曾經有過一年總收入只有4萬的記錄...


  2.南迴搞軌案

  當時依稀有在報紙上看到這件事

  看了這部片才知道原來有這麼嚴重

  當時坐南迴的人都人心惶惶

  而其實列車長更是每天都提心吊膽的上班

  幾乎每隔2個月就有一班火車翻覆

  片中也有採訪到其中一個列車長歷劫歸來的感想.....


  3.開通南迴

  南迴是1992年才開通

  離現在也才30多年

  這條不到10KM的鐵路開通難度真的有夠高

  當時機器不夠先進 所以大家都是很克難的來測量和做工程

  甚至其中的工程師們說"我們一起睡覺的時間比老婆還長"

  而最後開通後 反而讓台東大鳥這個地方沒落

  原本大家會坐火車到大鳥 換車再坐到屏東或高雄

  開通後這個地方的旅客就越來越少了....


  能夠對南迴鐵路有點瞭解

  也有把寂寞的感覺拍出來

  而不得不提陳明章的主題曲實在是和這部很搭!!


  --'
