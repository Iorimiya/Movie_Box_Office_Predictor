title: '[討論] 「南方，寂寞鐵道」（台鐵南迴），院線'
content: '「南方，寂寞鐵道」2023.6.9（五）上映了！


  這部片適合鐵道迷、喜歡旅行、喜歡台灣、

  喜歡各類電影的大家～


  官網在這：



  還記得2020年南迴鐵路藍皮解憂號退役時，

  我還特地南下去搭（順便環島XD）；

  多良的海實在美

  （這裏是movie板您沒跑錯，不是旅行板XD）


  於是抓住南迴鐵路電氣化前拍攝。


  導演拍過「紅葉傳奇」、「銀簪子」


  這次「南方，寂寞鐵道」，

  因眾網友集資順利上院線了！

  看到全台各大戲院有台灣的電影還滿開心。



  今天6.24（六）台北京站威秀有，

  全台各點大家可查。


  喜歡電影喜歡鐵路喜歡旅遊的大家，

  可以把握機會用行動支持！


  如果已看過的，歡迎用推文或回文討論唷！


  預告片



  報導



  重返南迴線藍皮普快！《南方，寂寞鐵道》

  紀錄片導演蕭菊貞

  ：「有人記得，逝去的就永遠活著」

  by 郁子

  2023 年 1 月 25 日


  昏暗的車廂悠悠晃晃，兩排暗綠色的雙人長軟椅，只坐著少少幾名乘客。蓊鬱山色快速後退

  ，列車經過幾個隧道、穿過中央山脈，再抬頭便是寧靜的太平洋。迎面吹來的海風混著柴電

  機油味，行駛於南迴線上的藍皮普快車，在轟隆隆的運行聲中成為追憶。

  2020 年底，台灣環島鐵路完成最後一段電氣化工程，原先往返於枋寮與台東之間，南迴線

  上的舊型列車，也在同年 12 月 23 日正式停駛；改由速度更快的普悠瑪號、推拉式自強號

  等電氣化列車投入營運。


  為了保存即將消逝的原始鐵道地景，曾以《銀簪子》、《紅葉傳奇》等作品榮獲 2 屆金馬

  獎最佳紀錄片獎的導演蕭菊貞，自 2017 年起帶領團隊深入島嶼南方拍攝；後於 2022 年底

  啟動《南方，寂寞鐵道》紀錄片後製與上映集資計畫，希望讓這部作品順利完成後製、上映

  院線。


  「藍皮普快車是一個比較熱門的話題，可是我想說的，其實是整個南迴鐵道的故事。」蕭菊

  貞說。從乘客、鐵道迷、前線鐵道員，乃至於興建鐵道的工程師；這一次，讓我們帶著不同

  的視角記憶，在這班來自過去的時光列車重新相聚



  (圖片來源：《南方，寂寞鐵道》紀錄片集資團隊提供)

  聚散悲歡，承載無數情感的移動場域

  小時家住高雄，長大後到新竹念書教課，後來再到花蓮長住，又因為拍攝不同紀錄片而不停

  在台灣各地奔波；經年累月之下，蕭菊貞成了頻繁搭火車的常客。對她而言，火車是與「家

  」的記憶連結，也是承載無數悲歡離合的場域，特別適合觀察「眾生相」。


  「有的人心灰意冷要離開、有的人下定決心重新開始。還有相愛卻必須分離的人，依依不捨

  地追著火車  ，這不只是常見的電影畫面，也是台灣庶民生活的場景，早年並不是每家每

  戶都有自己的私家車，出外工作求學、離鄉返家，幾乎都得仰賴火車。」蕭菊貞說。


  也許是搭火車的頻率實在太高，蕭菊貞也遇過幾次突發事故。比如 10 年前某個深夜，她就

  在北迴線的列車上遇到有人臥軌；等了 2、3 個小時，列車才重新啟動。「後來那段路，車

  子極度頻繁地剎停減速，我第一次坐火車坐到暈車。」


  彼時夜深，北迴線周圍全是大山大海，漆黑一片。蕭菊貞試想司機員的心情──經歷突發意

  外，仍得在黑暗中載送上百名乘客；誰知視野能及的路段之外，一切是否都安全暢通？「我

  也第一次意識到──原來火車一直都是有一個人在開著。那個人有情感、有恐懼、有他的專

  業技術，只是平常順順地走，一切都太理所當然。」



  (圖片來源：《南方，寂寞鐵道》紀錄片集資團隊提供)

  回溯歷史挖掘故事，南方鐵道不曾寂寞

  交錯穿梭的鐵道，串起台灣島嶼上的南北人流，許多城市聚落的鬧區，更是以火車站為中心

  發散成形。聽聞蕭菊貞想拍鐵道文化，幾位鐵道迷朋友紛紛推薦她，趕在鐵路電氣化以前去

  拍南迴。「可能拍紀錄片的人，就是會有這種使命感。」蕭菊貞笑道，「一聽到『快要不見

  了』、『以後沒有了』，就覺得我們應該想辦法留下點什麼。」


  作為台灣最後一段啟動電氣化工程的鐵道，南迴線聚集了許多舊型車款；平日少有旅客搭乘

  ，沿途多數地段也未經開發。因此，蕭菊貞最初拍攝時，總有股蒼涼的寂寞感。可越是深入

  前線鐵道員的工作現場，了解到越多南迴鐵道的興建史，她才發現，這裡其實藏著許多故事

  ：


  比方說，看似人煙稀少、寂寞運行的列車，其實集結了許多鐵道員的辛苦付出──包含車站

  運務人員、火車司機、維修技工，還有每天深夜負責鐵道修理維護的工務組，以及需要確認

  機電設備，協助搶修意外事故的電力組  ，因為有這群人默默守護，列車每天才能順暢行

  駛、平安到站。


  「除此之外，南迴線穿越中央山脈南段，中間歷經 20 多年規劃、10 次設計改線，興建時

  也遇到很多困難。」她感嘆，現今我們坐在火車上，10 分鐘就能通過的中央隧道，當年工

  程師們足足挖了 10 年。期間還遇到湧水問題，再加上當年還是用 TNT 炸藥去炸山挖山，

  造成不少工人受傷去世；這段重要歷史，最後卻只留下極少資料，鮮少有人知道



  (圖片來源：《南方，寂寞鐵道》紀錄片集資團隊提供)

  克服險峻地勢，山海之間追火車

  南迴偏遠，可從過去到現在，這條鐵道上承載了許多故事；不是只餘山海壯闊寂寥，更不該

  就此被人遺忘。然而，這條美麗而危險的鐵道，不只火車難開、攝影機更難拍；蕭菊貞直言

  ，《南方，寂寞鐵道》是她 20 多年的紀錄片作品中，拍攝難度最高的一部。


  「最大的兩個困難，其實是『速度』和『地形』。」蕭菊貞解釋，南迴線貫穿中央山脈南端

  ，周圍沒有任何公路；火車途經 30 幾座隧道，走的都是直線距離，開車追也趕不及。


  為此，她只能將人力拆散，分組到不同地點架機拍攝。可南迴鐵路車班少，許多拍攝點更是

  難以抵達；為了捕捉好畫面，攝影小組常常得翻山越嶺、早早開機等候，有時忙了大半天，

  只為捕捉幾秒鐘的畫面。


  雖然用空拍機也能取景，但其訊號常常被中央山脈的山勢阻隔。「空拍機要因應地勢高低起

  伏，配合火車換速，一顆鏡頭要跟到漂亮真的很難。」蕭菊貞嘆道。



  (圖片來源：「蕭菊貞」facebook 頁面貼文)

  世界太快，珍惜「慢下來」的每一刻

  拍攝《南方，寂寞鐵道》紀錄片期間，蕭菊貞一直在跑，奮力地追。鐵路電氣化的進度每天

  都在往前，時間不等人，火車也是；她想捕捉的每個當下，每分每秒都在改變流逝。有天下

  午，蕭菊貞帶著相機腳架，一個人來到瀧溪車站，一待就是大半天。


  「瀧溪是一個很小的站。那時鐵道兩側還沒架起高壓電杆，你站在月台，會看見鐵軌的兩端

  盡頭就是山和隧道，遠方還能看到海。」蕭菊貞生動描述。整個下午，從瀧溪站進出的乘客

  不到 3 人；清冷的月台上，多數時候只有一名站務員、一條小黑狗，和蕭菊貞這位拍攝者

  。


  「我在那裡拍了很多火車快速通過車站，看著列車呼嘯過站後，小站又瞬間回歸平靜，感覺

  自己的心也靜下來了。到底是為了追火車，或者自己也在追求一種寧靜，那時候是分不清的

  。」


  蕭菊貞覺得，南迴最動人之處正是如此。城市太過喧囂，做什麼都追求快速，每件事情都講

  究目的；可越是如此，我們越該珍惜那些能讓自己「慢下來」的人事物。「那個下午，是我

  那一個月來心裡最寧靜的時刻。我甚至覺得，光那半天就夠我拍成一部短片。」



  (圖片來源：《南方，寂寞鐵道》紀錄片集資團隊提供)

  集群眾之力，南迴鐵道故事永不褪色

  2020 年 12 月，南迴線鐵路電氣化工程正式完工，藍皮普快、復興號等舊型列車已經走入

  歷史，現在就連柴聯自強號也從南迴線上退役。


  蕭菊貞說，過去她總覺得柴聯自強號「太沒個性」，四方扁平的車頭與車尾太像，車身也不

  若莒光號鮮豔明亮。可聽到柴聯自強號要停駛，她還是有些感傷──《南方，寂寞鐵道》中

  出現的許多畫面，有太多都已成為追憶。


  可消逝不等於死亡。蕭菊貞相信，那些以影像留存的歷史文化，會活在每位觀眾的記憶裡，

  連同他們自己的鐵道故事持續閃亮。


  「集資計畫上線後，有很多不認識的朋友給我鼓勵。」有鐵道迷來訊表示，她本來只是想支

  持集資，卻意外在集資影片中，看見 70 多歲父親在鐵道上認真工作的身影，讓她感動到當

  場落淚。還有出現在紀錄片海報上的男同學，看到集資計畫上線也特別寫信，向蕭菊貞分享

  自己對火車的熱愛，以及孩提時代，父親帶他去看火車的回憶。


  集資宛如火車鳴笛，喚醒許多人的鐵道記憶，也讓蕭菊貞深受感動。「這部片可以像一個時

  光列車一樣。」集資影片最後，她語帶感性：「就是帶著大家，重新再走這一趟。」


  --'
