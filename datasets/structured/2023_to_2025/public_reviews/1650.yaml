title: '[普雷]《南方，寂寞鐵道》火車已經到車站'
content: '在車上，穿梭記憶隧道的漫長形影


  有時候一代人的記憶總有種很奇妙說不出的歲月流逝，你我雖不相識但卻有著對某件事物

  共同的記憶，和渺渺觸動憂愁和歡笑，有時候是一首歌、一本書、一部電影和一張老照片

  ，而會不會轉過頭總以為一輩子的東西，也隨著時光稍縱即逝，成為了腦海中的記憶？也

  成為最後月台相離別的倩影。


  紀錄片《南方，寂寞鐵道》是敘述關於台灣南迴鐵路從開通到結束的一群人的共同記憶，

  開墾鐵道的原住民工人、駕駛不好駛的火車鐵道員、還有依靠火車來去從年輕到老的乘客

  、或是後來追逐火車最後倩影的鐵道宅。


  在全面電氣化即將淘汰舊火車，有著台灣人的記憶和多少悲歡離合，老照片張張出現不只

  是回憶，也是台灣一幕幕鐵路史。







  《南方，寂寞鐵道》是什麼電影？


  「今日無事。」如果對1999年日本電影《鐵道員》有印象，一定對每日站崗於即將廢棄幌

  舞車站的乙松站長這句話特別有印象。這個由淺田次郎創作的小說，知名演員高倉健主演

  ，把鐵道員青春奉獻給車站的一生描繪的感動且讓人落淚。雖著人們移居與村落變遷，有

  些地方車站已經鮮少人造訪，但依舊有著站長駐守於此為乘客服務，日本如此、台灣也是

  如此。


  在台灣汽、機車與高鐵捷運那麼方便的交通下，你有多久沒有搭火車？除了老是誤點、和

  被人戲稱本業是賣便當的台灣鐵路局，恐怕只剩下一些重大事故和不光彩的事情才會讓火

  車再度回到新聞與他人的視野中。


  撇開這種傷痛且負面的記憶，對於還是搭著火車通勤，與過去和現在都有大半輩子與火車

  、鐵道渡過的人，鐵路對他們的意義究竟是什麼？是一份世代交替的工作、還是大半輩子

  鐵路的吭噠聲。









  《南方，寂寞鐵道》是拍攝台灣最後一條電氣化的鐵路「南迴線」的紀錄電影，這條被稱

  為不可能任務的台灣鐵道，從日治世代到國民政府都一直極力想開通這條穿越中央山脈的

  山間鐵路。


  以當時的技術實在過於困難，前前後後在中華民國政府時代經過十一年才開通，是全部由

  台灣工人、鐵路設計師所建設規劃的一條別具意義的南部鐵道。


  過了多個年頭從當年炸山開洞的工人，到探勘鐵路山上山下到處測量的設計師，還有開通

  時經過訓練、也遭遇過多次災難的列車長，甚至獨立在山間小站一待就幾十年過去的站長

  。這條鐵路一代過一代的承接回憶。如今面臨現代電器化，車體將迎來更新，而一些站可

  能也會被停用。最後只能藉由當年台鐵人員與鐵道迷留下這份台灣鐵道的歷史和即將跨入

  的嶄新一頁。












  《南方，寂寞鐵道》分析與延伸：


  南迴鐵路是一條來往於臺東和屏東兩縣市的主要火車道，也是台鐵最後開通的主要幹線，

  為了方便山區民眾所開闢的鐵道，因為沿途多為深山地區且能看見海天景色，故也讓人有

  種穿梭於自然間的錯覺，也成為一些人徒步環島必搭的鐵路之一。


  因為近山見海之故，在颱風或地震來臨時都常面臨災禍，其中2013年的康芮風災不僅大風

  大雨，列車還撞上土石流造成脫軌事件，可以說是相當危險的一條路線。


  南迴鐵路最早的設計來於日治時代，但因為當時技術問題和台灣多樣的山茂與地質，而無

  法施工。而在中華民國政府來台之後有多次長達約幾十年的考察和測量，藉由本土工程設

  計師不斷推敲方案，最後選定為「十二項建設」在1980年開始著手興建。但實行的過程太

  過艱難在後續又繼續併入「十四項建設」並慢慢的拓長鐵路線才在1991年完成計畫，故正

  確來說從日本到中華民國前前後後，可能花上快60年。










  2017年南迴鐵路開始電氣化工程，而老舊的火車將在之後不再使用逐次淘汰，這也讓許多

  過去搭乘的民眾和對鐵道有興趣的鐵道迷們，爭相目睹南迴鐵路傳統列車最後時刻的風采

  。在2021年完成全面電氣化通車。


  紀錄片《南方，寂寞鐵道》在最後5年整理屬於南迴鐵道的故事，將這鐵路的點點滴滴都

  會急於電影中。而目前未來南迴的規劃將以屏東、恆春為終點，預計可以在2026年完工。


  電影的導演蕭菊貞，認為像他們這一輩的人，火車鐵軌乘載著他們的記憶，沒錢有車、機

  車危險，火車成為像他這樣普通學子、民眾的代步工具，也因如此看見鄉鎮因鐵路而起的

  興衰。當時她因醫生朋友而認識了台東鐵道局工務段的副段長，才得知南迴還未電氣化但

  在倒數，現在不拍就再也拍不到傳統鐵路。也因此原本以為自己追逐列車的蕭菊貞，才發

  現她追的是新舊交替一點點在流逝的歷史時間。












  《南方，寂寞鐵道》值得一看嗎？


  自己並不是鐵路迷，也從未對鐵道感興趣。但在鐵路電氣化轉換的接接觸，自己其實也意

  外地見證了台灣鐵路的轉變，但並不是南迴鐵路電氣化而是2016，2016年台中鐵路高架化

  ，第三代臺中車站的啟用。


  1917年大正時代台灣第二代車站臺中驛正式退出舞台，但對於從學生時代到當兵都會走近

  舊台中車站的我，也在每次新站通車後覺得有點念舊隔壁那現在空無一人的舊車站。


  而《南方，寂寞鐵道》作為乘載著台東與屏東山間民眾的記憶，還有在這些小站服務的列

  車長和站長，看著過往列車將離開、而如今需要改變，雖然小站許多還留下未來會怎樣卻

  不一定，難免比我這種過客可能更有思念之情。電影在這種考究、與從過往建造南迴線到

  駕駛員、站長對於鐵路的熱誠，父傳子繼續開著車班，讓這部紀錄片有種新舊接替的傳承

  感。










  但我覺得在剪輯編排這部片的步調有點略顯雜亂，基本像是想到什麼就穿插什麼，整個電

  影規劃沒有很順暢，前一片段在談建造鐵道的辛苦、後面卻又跳到無人進出偏僻的鐵道站

  、再來又跳接到追逐火車的鐵道迷和鐵路員工，雖然有刻意將其串起，但是整體而言還是

  太過於零碎，會讓人無法全面了解南迴鐵道樣貌，這是電影可惜之處。


  我覺得如果可以有一個順序或可以銜接不同片段的貫穿電影的人物，也許會讓《南方，寂

  寞鐵道》再更完整一些，而非太多零散的段落。


  「放在這邊只是回憶，給妳之後就有機會變成歷史。」這是當時規劃南迴鐵路的工程師對

  導演所說的話，一些回憶如果保留下來就只是隨著記憶帶走，而當有什麼東西留下，也許

  是種曾經一起努力過的證明。如同電影將老火車、舊月台、無人的車站、三代鐵道員等故

  事留在南迴，讓車站不再只有無情的喇叭聲音，而是相送、再見人們走過與留下的腳步聲

  ，此起彼落。


  --

  個人Blog：

  小說連載頁：


  --'
