title: '[好雷] 南方，寂寞鐵道 On The Train'
content: '雖然紀錄片不知道需不需要防雷

  就還是貼一些有的沒的


  紀錄片6/9就上映了，

  導演是已經拿過兩座金馬獎的蕭菊貞(紅葉傳奇、銀簪子，都沒看過XDD)


  紀錄片的內容是關於南迴鐵路的人事物

  除了紀錄片之外，導演也把相關的紀錄出了同名書

  書跟電影都很好看，很大推，兩個作品之間是有互補關係的，如果可以真的不要錯過


  我先看了書，才在紀錄片已經從商業電影院下檔的時候

  跑去國家影視聽中心趕上所剩不多的場次


  是說國家影視聽中心的影廳設備很不錯耶

  最近還有楊德昌特展，也很值得去看

  還托了楊德昌跟這部紀錄片的福，順道看了伍迪艾倫的《曼哈頓》




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看完書之後，真的好想去看一次《南方，寂寞鐵道 On The Train》的 紀錄片。

  從書裡的照片就可以感覺到這樣的畫面，真的需要在電影院一片漆黑的環境中，專心地盯

  著大大的銀幕，讓自己掉進南方的大山大海，還有從中劃過，孤線的鐵道。

  所以星期天特別跑到了神奇的 國家電影及視聽文化中心，好好地看了這部值得在電影院

  一看的電影。


  紀錄片開頭，沒有人聲，就是一輛火車頭準備從機庫出發，只是這不是一般的柴電或電氣

  火車頭，是蒸氣火車頭。那個很強烈的鋼與鋼的碰撞聲，蒸氣越來越濃的嘶嘶聲，然後火

  車頭從瀰漫的蒸氣中既緩慢又氣勢萬鈞的出現。就像盧米埃兄弟的《火車進站》震懾了全

  世界，《南方，寂寞鐵道》的片頭也展現了無比渾厚的力道。


  不到兩個小時的片長，從枋寮到台東走了一趟南迴各站巡禮，從路線規畫到即將電氣化回

  顧了一整段台灣南部到東部的交通演進。紀錄片帶著觀眾走過空間也走過時間。每一站都

  有各自的故事，但串起這些故事的是一個又一個的人物故事。


  訪談裡有好幾位都是鐵路世家，兩代三代在火車站鐵道邊玩耍工作、生活長大的他們，從

  小就立志，長大也真的成為台鐵人好像就跟呼吸喝水一樣自然而然；也有好幾位上班是站

  務員、司機、維修員，下班後繼續當個上山下海追火車的鐵道迷。紀錄片訪到當初設計測

  量的工程師、開鑿隧道的鐵道工、退休多年還能喊著"All Right!"的老司機、接受轉正前

  測驗緊張到不行的實習司機、從臨時工變正職到即將退休的站務員、讓火車用另一種形式

  存在的維修員、一群翻山越嶺只為幫火車留下影像紀錄的鐵道攝影迷，還有很多各樣的人

  物，說著自己與南迴鐵路的關聯和故事。


  回到南迴鐵路本身，最為人所知的大概就是他經過的大山大海，屏東的海，台東的海，雖

  然只差了幾十公里，但那個山和海好像真的就是長得不一樣。紀錄片的畫面記錄了靠近台

  灣海峽的鐵道、穿過農田和魚塭的鐵道、在山中間的隧道中若隱若現的鐵道還有遠方太平

  洋黑潮流過的鐵道。


  搭什麼交通工具，就會用什麼速度認識這個地方。紀錄片用一個有點點快但又能看到很多

  人事物的火車的速度，看鐵道經過的風景，鐵道上的火車，鐵道乘載的人們。紀錄片也記

  錄了台灣鐵路電氣化最後一哩路完成前，還沒有滿滿電桿的純粹的鐵路影像。就如我的讀

  書心得，這部紀錄片真的值得《看見台灣》一樣的關注度，值得大家像當初去看《看見台

  灣》一樣，在電影院裡把自己丟進片中的每一個畫面，感受南迴鐵路的生命，藏在鋼鐵底

  下的火車的生命。


  電影和書，兩個作品的內容是一種互補。電影提供的動態的畫面，由真人口中說出來的話

  ，那種真實感是文字所無法傳達的；但文字用一種慢一點但深一點又久一點的方式，補足

  了電影在不到兩個小時的時間中來不及完整傳達的情感。


  新莊的影視聽中心還有場次到8/30號，高雄的內惟藝術中心好像也還有機會可以看，我覺

  得如果可以在電影院看的話，真的值得進電影院好好看一次。


  --

  抱歉早上重新查了一次，高雄剩下的應該是in89駁二。'
