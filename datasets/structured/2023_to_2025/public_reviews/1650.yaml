url: https://www.ptt.cc/bbs/movie/M.1687090413.A.042.html
title: '[好雷]南方，寂寞鐵道-寂寞，也不寂寞'
content: "小時候阿嬤總帶著我從台東市區的台東車站搭火車到高雄車站，再轉公車到鳳山找小姑姑，\n當時一趟車程可能將近4小時，對幼小的孩子來說，長時間坐在座椅上，是非常無趣的一件\n\
  事，阿嬤總會叫我數山洞（隧道）的數量，數著數著我便沉入夢鄉，再醒來時已經到高雄車\n站準備轉公車了。\n\n高中畢業後上了台南的大學，每隔1個月到2個月，便會搭乘火車回到台東家鄉與家人相聚，\n\
  4年間來回也將近4、50趟，畢業後回家鄉工作，但台東畢竟是鄉下地方，大學朋友又以高雄\n人居多，使得我出社會後仍然非常依賴搭乘南迴線火車到高雄，因此這部電影-紀錄片對我\n\
  來說，看著畫面裡熟悉的景色，又或者看到我通常睡著了沒看到的景色，是既懷念又新鮮。\n\n本片藉由台鐵南迴線司機員、車長、道班員、站長、員工家屬、南迴鐵路工程師、施工人員\n\
  、乘客、鐵道迷以及南迴線村莊商店老闆娘等等與南迴線相關的受訪者所訴說的回憶，建構\n出整部紀錄片。沒錯，這部片講述的不是火車，不是鐵道，而是回憶。因為南迴線的運行，\n\
  在這些人們生命中留下了回憶，串起這條鐵道的靈魂。南迴線，車站少、工作人員少、搭乘\n人數少，看似一條寂寞的路線，但其實，它承載著台東-枋寮間所有人的記憶，它一點也不\n\
  寂寞。\n\n在紀錄片得知南迴線在1992年才開通，當年我7歲，亦即南迴線開通後，阿嬤便帶著我搭乘\n火車，而至今我依舊搭乘著。從開通到電氣化，到未來的雙軌化，我也見證了南迴線的成長\n\
  ，南迴線也成為我生命中非常非常重要的一部分，就像片中的受訪者一樣。\n\n柴聯莒光號通過古莊站\n\n\n\n\n\n打了一篇感性的文，好像沒說到太多電影的細節XD\n\
  這部紀錄片可以很輕鬆的觀賞，裡面不會有很艱澀的專有名詞，畫面很美，音樂很好聽，進\n入的時機也剪輯得很好，唯一小缺點就是太短了，看不過癮吶~~~\n\n--\n\
  \                                          06/18 22:55"
