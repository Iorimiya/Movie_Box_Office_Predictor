url: https://www.ptt.cc/bbs/movie/M.1729848122.A.4A9.html
title: '[ 好無雷] 劊樂小丑3 : 這才是真正的小丑'
content: '看完媲美「歡樂歌舞秀」的小丑2後，心裏總對於小丑少了些什麼…然後看到新聞說居然

  有一個關於小丑的電影，可以在試映會讓觀眾瘋狂嘔吐or逃出電影院，本身又是cult片的

  重度迷（哭悲我看了5次），決定在上映首日直衝電影院看「劊樂小丑3」，看完有以下心

  得：


  1.絕對不要帶東西去電影院吃，本人在看電影的時候吃著麥當勞薯條，手裡沾著番茄醬，

  看著螢幕上滿滿的血漿，突然感覺嘴裡的味道也開始變得有血腥的鹹味


  2.本片的畫面有不錯的視覺衝擊感，上一次看到類似的片子就像「鬼玩人」一樣，砍殺見

  骨、開腸剖肚是基本款，有一場浴室虐殺的戲真的是太猛了，聽說多數演員都拒演，所以

  要給本片演員滿滿respect


  3.強烈建議要先看過前面的集數的劇情（我覺得至少要看過2），才可以比較帶入角色的

  背景設定，不然看到一些畫面跟角色你會誤煞煞


  4.本片的小丑壓迫感極重，成功發揮小丑本色（他不會唱歌，謝謝），雖然幾乎沒有台詞

  ，但是表情跟手勢很生動，殺戮中卻又帶些滑稽跟惡趣味


  5.本片女主角宛如神力女超人附體，應該可以算是超級重口味的超級英雄片（誤


  6.片尾無彩蛋，不過應該是有新續集的設定








  --

  週五下午，800人巨幕廳，大概10多個人哈哈

  有～女主角又正又強悍

  不算有～都偏隱晦帶過

  無情的電鋸～

  基本上2就是交代女主角和弟弟的背景，1的話就是毀容女的故事，所以先看2再接3，比較

  順'
