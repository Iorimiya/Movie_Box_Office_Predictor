url: https://www.ptt.cc/bbs/movie/M.1730387646.A.458.html
title: '[好雷] 劊樂小丑3，在現代已經不錯'
content: '平心而論~宣傳太誇張了

  前面好雷幾十年最佳也是

  如果你有看夠多影展片 觀影資歷夠久

  應該還是會覺得不錯 但要說到那麼誇張就過頭

  在剝削片跟B級片裡更誇張的 大有人在


  單純論虐殺手段 大概就是老鼠插管那一招夠狠有創意

  還有很少虐殺血腥片結果是引爆炸彈大趴踢這點跟以往類型片比較不同


  其他大概就是過了前20分鐘會慢慢習慣的斷肢破肚


  但在現在這個甚麼都好像政治正確

  甚麼都不能過激的年代 這部片就顯得爽度高很多

  特別是也認同前面要說的 比較特殊的一點在於真的拋棄了道德底線

  儘管大部分用手法帶過 小孩真的是一個一個殺

  小丑這個角色也確實詮釋得不錯 夠姬芭


  整體真的算不錯了 比較可以詬病的是最後一幕有點拖

  突然女主角就被抓住 然後被迫搞低反派二人組的腦殘

  只為了誰都知道的神劍伏筆


  不過這邊因為也不落俗套的直接把老公跟弟弟都給宰了的驚喜

  算是剛好可以打個平手吧 畢竟一般公式弟弟的角色一定也會被虐(但不一定會死)

  結果直接不給希望的宰了 還拿來搞主角的心態 算不錯的安排


  然後那個追星女 又一個年輕版徐若瑄/龍媽

  但身高身材實在比龍媽好很多 都已經宰成這樣了

  結果浴室戲還是堅持三點不露真的很可惜 可能是女星本身要形象吧

  不然雖然是假屌 雞雞+蛋蛋總還是出現在螢幕上了


  希望這個女孩能紅 又正身材又超好 再幫這部加很多分XD


  --'
