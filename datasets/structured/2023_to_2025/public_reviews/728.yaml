  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  個人覺得1,2還不錯，3完全喪失了小丑的惡趣味。


  就拿開頭那一家人來說吧，就是單純的殺戮行為。


  可是有看過1,2的就知道，小丑通常會先作弄他人，


  他人不爽後搞得小丑自己也不爽，就開始搞一些惡趣味殺人。


  3唯一我不敢看得地方是浴室自刎那一段，


  其他地方更甚者我還覺得好好笑，


  就是各種浮誇，為殺而殺。


  你說把老鼠塞進嘴巴再割開喉嚨，有啥惡趣味？


  以前把警察OO那橋段才有趣吧！


  可惜了，最後既然還有伏筆，我的天！


  --'
