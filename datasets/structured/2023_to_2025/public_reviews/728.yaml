url: https://www.ptt.cc/bbs/movie/M.1730555044.A.034.html
title: '[負雷] 劊樂小丑3'
content: '之前發過劊樂小丑1&2心得

  我是給好雷


  雖然是虐殺B級片

  但小丑的雞歪妝容

  跟第一集的剖半對開

  第二集床上荒謬的砍殺殘肢


  雖然你知道他在唬爛

  但你還是笑了出來(讚


  但這集....很不行捏導演 = =

  (記得編導都是同一位)


  我先不求劇本

  畢竟這也沒啥劇情好講


  但先講結論：

  老子不是來看德州電鋸殺人狂的

  要講電鋸,那個面具大漢使得更順


  再來~

  這集鋪陳sienna的餘悸猶存

  和他弟弟強納森鋪了半天


  結果弟弟最後怎麼死的都不知道？

  只剩一個頭蓋骨被老鼠啃！蛤？

  靠腰~

  廢到讓我差點跟著咬牙切齒掯！

  那你鋪他弟弟鬱鬱寡歡半天是在哈囉


  經典的是

  還有一位從頭到尾定位不明的小妹妹蓋比

  我真不知這角色到底是出來衝三小的

  除了偷看日記給她點事情做以外

  到最後我才知道原來她是美國貝瑪！


  最後的大洞,她還記得抓住洞邊...

  只差沒喊"大日如來 佛光普照！"


  問題這裡沒有狗肖啊！

  到底是去是哪裡了我也不知道(抓頭

  一個莫名的角色掉去莫名的黑洞？？？

  然後就不見了,到底在演三小朋友...= =

  (協尋貝瑪小朋友)


  對！如推文講的還用劍要拉他一把

  笑死~就算雙手血流成河

  神力小女超人喔


  最後~

  從一些預告有看到小丑這次聖誕老人裝

  以為這次會有不一樣的劇情延伸發展


  結果完全沒有...

  小孩拆禮物炸彈炸死其他小孩,沒了。

  對！就這樣?蛤？??


  最北爛的是sienna被綁在椅子上

  就被小丑左右手各猛力剁了一刀

  下一秒骨折拆開禮物發現是劍

  手完全沒事還可以把劍像射飛鏢一樣扔出

  欸導演,你說小丑殺不死我就算了

  女主角可以這樣玩？那浴室被剖開的情侶

  妹子大腦要不要乾脆自然癒合又活回來？


  至於之前什麼國外11個觀眾觀影不適還嘔吐？

  一開始砍手剁頭的開場也沒比前兩集威猛去哪


  看來會再有第四集。

  但這集很涼,劇情跟創意娛樂性直線下降

  如同第二集,最後三十分鐘開始唬爛越來越強


  導演,母湯喔！

  老狗還是要有新把戲,拜託~


  很不劊樂,真心不騙。


  --'
