url: https://www.ptt.cc/bbs/movie/M.1733118269.A.226.html
title: '[負雷] 劊樂小丑3 商業成功的取捨'
content: '從駭靈夜到劊樂小丑1、2、3

  這個系列一步步踏上商業上的成功

  但也一步步地走上傳統西洋恐怖片的老套路

  血腥色情暴力也逐部遞減


  且隨著“劇本”“人物描寫”的加入

  導演能力上的缺乏也被突顯出來

  劇情上為了滿足讓sienna跟art對打

  強行忽略了很多bug


  像是從一開始根本看不出來art有要去找sienna一家

  突然加入了惡魔附身的設定


  然後art就突然跑去殺Johnathan 的室友

  接著又毫無交代的sienna一家突然

  就被art綁起來虐殺了


  虐殺到一半 突然就開始讓sianna拆禮物

  拿到上集莫名其妙出現的神劍

  接著雙手被砸爛的sienna突然就雙手復原

  又是丟劍把被惡魔附身的victoria幹掉

  又是持劍跟art用電鋸對打


  然後突然又開啟地獄之門

  Gabby突然就掉進去

  埋了一個下集要勇闖地獄的伏筆


  真的是莫名其妙


  從商業角度看或許加入劇情、人物跟背景故事有所幫助

  但從虐殺片看來真的很畫蛇添足


  -----

  Sent from JPTT on my Samsung SM-S9180.


  --

  看得真的覺很不爽

  而且不知道為什麼 硬要變成聖誕節

  還因此硬塞一堆聖誕梗

  感覺就是為了要讓sienna去拜訪阿姨有個好理由

  問題是不應該有除了art以外的主角'
