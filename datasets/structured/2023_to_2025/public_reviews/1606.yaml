title: '[新聞] 《六月之蛇》靈感來自一幅畫　導演「下'
content: '《六月之蛇》靈感來自一幅畫　導演「下海」變身偷窺狂


  新聞網址：



  日本邪典電影名導塚本晉也執導的經典電影《六月之蛇 數位經典版》將在6月9日上映；

  電影描寫女性內心世界的情欲流動，不僅深受國際影展肯定，當年在日本推出時獲得極佳

  的評價，導演還親自「下海」出演偷窺狂，為執導生涯展開創創新篇章。


  塚本晉也導演在本片飾演偷窺狂，將偷拍少婦自慰的照片，用來威脅對方不穿內褲並穿上

  極短迷女裙，按照他的指示穿梭在人來人往的大眾場合，甚至以要向少婦的先生拆穿她一

  直在上網搜尋按摩棒等自慰用品為威脅，逼外表看起來安靜內斂的少婦去購買按摩棒，而

  即便她都照著指示做，卻還是讓有著嚴重潔癖且一絲不苟的先生發現了這些尷尬的自慰裸

  照及淫穢影片，平靜的夫妻生活將掀起一場超大的風暴…。


  《六月之蛇》的創作靈感是來自於導演自己在小時候畫的一幅《繡球花上的蝸牛》的畫作

  ，這幅畫作後來被刊登在校報上，塚本導演：「我已經不記得文字了，但我是一個非常害

  羞的男孩，這是我第一個獲得大人認可的作品。當我回想起那幅畫時，繡球花周圍透明的

  藍色空氣氛圍彷彿又回到了我的身邊。當我將此片拍攝設定在雨季時，那藍色的氛圍彷彿

  已替我設定了方向，在極其粗鄙的極端中，我想看到一絲純潔，一絲被深愛著的情感流露

  ，及一絲高尚。」所以當每年雨季來臨，他看到繡球花開吐芬芳之際，他總是感嘆：「今

  年我又沒有成功拍出《六月之蛇》。」這樣持續了將近15年之久，起初，它是關於一個殘

  酷跟窺狂及一個家庭主婦的電影，是一個會讓欲液流進欲望之嘴的不道德故事。但有趣的

  是，當電影完成時，它徹底轉變成不同的作品，塚本導演：「大家必須親自前來觀賞這部

  電影，才能體會其中的不同奧妙。城市深處，所有靈魂方暗自乾涸枯燥，如果你能聽到角

  色靈魂黑暗深處所湧出的卑微叫喊聲，我將會感到非常欣慰。」


  《六月之蛇》故事講述一對結縭多年夫妻之間情欲死灰復燃的故事。妻子凜子（黑澤明日

  香飾）是一位電話諮商師、個性安靜內斂，丈夫重彥（神足裕司飾）則是一位有重度潔癖

  的工作狂，他們的婚姻生活中雖然沒有魚水之歡，仍極似一對幸福的夫妻。在6月某日，

  凜子收到一封信上寫著「你丈夫的祕密」奇怪的信，信裡面發現了多張自己自慰的照片。

  為了要回照片，凜子不得不聽從神祕男子的要求，而她舒適、熟悉的生活將像紙牌搭起的

  房屋一樣逐漸崩塌。



  《六月之蛇》預告



  塚本晉也



  --'
