title: 'Re: [負雷]  喪屍集中營難看到笑'
content: '幹這部真的超級垃圾


  主要演員蒙古人根本都長一樣 四男四女囚犯根本分不出誰是誰


  而且那個鏡頭不知道在晃什麼


  前面半小時囚犯就在各種靠北然後被警衛揍


  這種鏡頭起碼重複五六次 不知道有什麼意義


  然後運鏡就超晃看了頭超痛


  好不容易有喪屍出現也是不知道在忙什麼


  整部片就在一個廢棄的工廠還有雪地上跑來跑去 成本低到靠北


  蒙古人男角都像馬東石那個臉 我都不知道誰是主角誰是雜魚


  然後女的也是很像那種菲律賓的人


  我看到一半就頭痛可是音效故意很吵想營造恐怖感害我想睡也睡不著


  最後有個小女孩好像是啥疫苗帶原者（老到不行的梗）也是都醜到有剩


  劇情完全不知道在幹麻最後就放字幕了


  真他媽的超級垃圾片


  --'
