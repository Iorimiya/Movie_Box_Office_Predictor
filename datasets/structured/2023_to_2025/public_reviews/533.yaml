url: https://www.ptt.cc/bbs/movie/M.1738936369.A.027.html
title: '[負雷]  喪屍集中營難看到笑'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  真的不用進電影院看




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  1. 登場角色超級多，但是一個也讓人記不住

  2. 轉場技術有夠爛，片段結束直接黑幕還不只一次，用了好幾次

  3. 這麼大的集中營沒有圍牆，殭屍一下出現一下不出現不知道在演什麼？設定上好像是讓殭屍聽到聲音就會聚集，但是沒特別解釋是誰發現這個特性，說話的那一個人只會一直叫人噓噓噓，然後講話小小聲

  4. 蒙古語讓人很難帶入劇情，奇怪的體罰制度還有穿著打扮也很難融入其中

  5. 有一隻殭屍看起來好像很厲害，但也不知道他扮演什麼角色，好像只是化妝技術厲害一點點而已

  6. 有幾個場景出現了沒必要的喝水、換座位、移動物品、沉默 超級拖戲

  7. 整部片沒有那種緊張刺激的感覺，更多是莫名其妙以及讓人想睡覺或者廢到笑的感覺，若不是為了打這篇文，可能看不到1小時就會離開現場

  8. 扮演解藥的小女孩人在案發現場竟然沒被咬，超級奇怪

  9. 劇情沒有邏輯，上下幕常常沒有關聯，沒有交代一下就讓人物出現在某個河邊、房間、森林，看得一頭霧水

  10. 片尾說有精彩彩蛋，結果一點也不精彩，就只是兩個不重要的角色存活下來的無意義對話

  11. 場景佈置經費不足，秘密地下室的鐵柵欄沒有做到頂，難怪關不住喪屍

  12. 整部片感受不到情緒張力，害怕沒有害怕的感覺、哭沒有哭的哭點、生氣只知道他們在氣被欺負這件事


  真好奇這麼爛的片為什麼會在台灣上映？

  早知道就把電影票錢省下來去看別的電影



  ---

  Sent from for iOS


  --

  09/05 15:48


  --'
