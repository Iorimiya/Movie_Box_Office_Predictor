title: '[好雷] 夜鷹的單戀, 2022日本電影'
content: '雷文防雷資訊頁


  夜鷹的單戀

  The Nighthawk’s First Love

  2022日本電影

  よだかの片想い




  白皙的左臉長了一大片深色胎記，女大生前田愛子曾在小學上課時被同學發現「前田的臉

  上有琵琶湖！」，因而開始對自我產生懷疑，從此埋首課業，對玩樂與戀愛一概沒興趣。

  這段關於「臉」的故事被寫成報導文學的書籍之後，前田成為話題人物。她在書籍封面拍

  攝現場邂逅了電影導演飛坂逢太。飛坂對前田一見鍾情，決心為她拍攝一部電影。傷痕累

  累卻努力活著的前田，邂逅了願意直視人們刻意忽略的事物並好好珍惜的飛坂，兩人的戀

  情逐漸升溫；然而隨著電影拍攝來到尾聲，前田發現飾演電影女主角的女星竟是飛坂的前

  女友……




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  看本片的動力是來自本片的女配角藤井美菜    ，長期欣賞她，但她的主演作品極少，作

  品多半是存在感低的小配角。本片看完，感覺藤井美菜在本片的角色及演出，她扮演女主

  的學姊Miyu，發揮出畫龍點睛的效果，有意思，果然值得我一看。


  女主松井玲奈，本片的劇情中心，看似清淡柔和地說話及行事，但終究要面對自己的一些

  現實，而表現出決斷，演技良好。男主中島步扮演的導演，也演出到位，就是那種工作大

  於感情的，有魅力的男人。


  平淡卻有餘韻，令人回味的小品佳作。個人滿意度75分（滿分100）。


  以下有劇透。




  劇情娓娓道來女主遇到男導演後，相遇相戀了？後來...一路走來的心路歷程，不在乎天

  長地久，只在乎曾經擁有，有些人註定是人生某階段的過客，就只是陪你一段，可以抱持

  遺憾，也可以抱持感謝，看到本片女主的釋懷和學姊的共舞及對話，令我嘴角泛起微笑。



  夜鷹的單戀

  TheNighthawksFirstLove

  2022日本電影

  よだかの片想い

  藤井美菜


  --


  吃多了大魚大肉的菜色，偶爾吃吃清粥小菜，挺爽口美味的，對我來說，這片平淡但有好

  滋味。



  藤井美菜演配角居多，而且常常是存在感低的配角人設，這部片算是不錯了，有她發揮的

  空間。謝謝你對本片的留言評論，開心。'
