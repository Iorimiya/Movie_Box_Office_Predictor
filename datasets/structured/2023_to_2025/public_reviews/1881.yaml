title: '[新聞] 松井玲奈【夜鷹的單戀】與性格男星中島步'
content: "新聞網址：\n\n改編自島本理生同名小說的電影【夜鷹的單戀】，由女子偶像團體SKE48前成員松井玲奈\n與性格男星中島步聯手演出。外型高大挺拔的中島步近年不僅先後參演華語電影【蘭心大\n\
  劇院】、【梅艷芳】，更與古川琴音在濱口龍介話題電影【偶然與想像】中上演一段剪不\n斷，理還亂的感情糾葛。此次，中島步再陷感情困境，飾演一名新銳導演飛坂，因為偶然\n\
  被臉上有著胎記的理科女大生愛子（松井玲奈 飾）堅毅的神情吸引，決定以她的故事作\n為下一部電影的題材，開始對她展開積極攻勢，終於取得她的同意，也收穫了她的愛情。\n\
  然而這段愛子遲來的初戀，隨著電影的開拍，兩人的關係一步步從友情、曖昧到滾床單、\n正式展開交往，也開始面臨新的考驗。中島步對於此次繼【梅艷芳】、【偶然與想像】後\n\
  ，再次在電影中演出「深陷感情風暴」的男性感到哭笑不得，「我很慶幸自己的花花公子\n、失意男子形象深植人心，但未來也想挑戰不一樣形象的角色，讓大家看到我不一樣的面\n\
  貌！」\n\n中島步表示自己在演出導演飛坂一角時，最著重的部分在於塑造出這個男人的高超魅力，\n從衣著、談吐、對待愛子的態度上，都充分展現出「萬人迷」的特質，他的演出也受到導\n\
  演安川有果大力讚賞，「中島步先生的演出讓我印象深刻，在他身上我可以看到一個演員\n不斷試著突破自己舒適圈的努力。」中島步也坦言很開心首次和安川導演及女主角松井玲\n\
  奈見面，就與她們展開良好的溝通關係，因為劇情中與松井玲奈有較親密的肢體接觸，一\n開始有點害羞，但因為松井玲奈的態度相當開放，讓他感到非常自在，「拍攝前我們大家\n\
  彼此交換了各自的感情觀，這說來有點難為情但很有創意，我們也將大家的觀點加入了這\n部作品，相當期待觀眾們看完電影的反應！」【夜鷹的單戀】將於2023年1月6日在台上映\n\
  。\n\n白皙的左臉長了一大片深色胎記，女大生前田愛子（松井玲奈 飾）曾在小學上課時被同\n學發現「前田的臉上有琵琶湖！」，因而對自我開始產生懷疑，從此帶著痛苦和恐懼的心\n\
  情埋首課業，對於玩樂與戀愛一概沒興趣。這段關於「臉」的故事被寫成報導文學的書籍\n之後，前田成為話題人物。她在書籍封面拍攝現場邂逅了電影導演飛坂逢太（中島步 飾\n\
  ）。在價值觀偏頗的社會中，飛坂對想連同自己胎記也一起肯定的前田一見鍾情，決心為\n她拍攝一部電影，雖然屢屢遭到拒絕也毫不氣餒。觀賞飛坂的電影作品之後，前田終於對\n\
  飛坂的態度有了轉變，漸漸卸下心防。傷痕累累卻努力活著、認真面對每一天的前田，邂\n逅了願意直視人們刻意忽略的事物，並好好珍惜的飛坂，兩人的戀情逐漸升溫；然而隨著\n\
  電影拍攝來到尾聲，前田發現飾演電影女主角的女星竟是飛坂的前女友......超值預售套\n票於博客來售票網熱賣中，購買單人套票即可獲得「中文全開海報」壹張；憑本片電影票\n\
  根，還有機會抽中大牌出版社提供之「銀河鐵道之夜：照亮徬徨人心的永恆曙光，宮澤賢\n治經典短篇集」壹本。更多電影相關詳情請洽天馬行空粉絲專頁。\n\n--\n \
  \                                12/26 19:29"
