url: https://www.ptt.cc/bbs/movie/M.1690472084.A.34B.html
title: '[  雷] 超難搞先生  觀後感'
content: '#呼朋癮伴 #朋の影癮


  “HEART”超難搞先生 A Man Called Otto，2022

  很久沒有一天看兩部電影，還都紀錄下心得，我要先給自己一個讚。除了稍嫌狗血這點，湯

  姆漢克斯的這片與他過去的《高年級實習生》一樣，都是能在某一時刻溫暖人心的溫馨小品

  。


  劇情沒什麼驚喜感，但光看他與片中亡妻年輕時的那些互動，我便掉了不少眼淚。那些以前

  的回憶也隨著他慢慢活在當下而不再出現，很喜歡這樣的手法。過去的他只擁有他太太，當

  不再拒人於門外，他擁有了許多許多。


  另外心臟病這一個設定也是這部片畫龍點睛之處，尤其喜歡他在醫院中被醫生再次告知病情

  時，瑪麗索在旁邊笑出聲來，她說：你還真的是很難死。而當時我想的是，或許正因天生有

  著比常人大的心臟，他的愛比海還深，也在那之後成為一種他對什麼都看不順眼的原因，他

  其實很愛很愛這個他所在社區，與這個世界。


  最後不算是一個開心的結局，但讓我又一次掉淚的原因是，雖然嘴巴說麻煩，但他每一次尋

  死或最後，都想著那一隻闖進他生活的貓，養貓果然是世界上最棒的事情之一。


  這部與下午安東尼波登的紀錄片有一些差別，一個一心尋死最後也得償所願的現實故事；與

  一個我們都明白有點太正能量的小品，但我們有時也需要這種東西，需要一些像他一樣試了

  好幾次卻都沒死去的勇氣與運氣。

  ----

  Sent from  on my iPhone 12 Pro


  --'
