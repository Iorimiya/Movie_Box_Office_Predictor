url: https://www.ptt.cc/bbs/movie/M.1690813823.A.298.html
title: '[好雷] 超難搞先生'
content: 'Netflix上檔


  大致上防雷...

  據稱是小說原作改編第二次的電影，基本上就如簡介是很難搞


  不過主要劇情把惡劣的部分保留在最前頭敘述背景，如退休之際的蛋糕、與建商人員的嗆聲


  後者還讓人十分納悶，但後續額外有梗，但也收的很隨便


  其實這部一開始看的時候就會明確的被標語爆雷

  然後就一直連環，期待後續發展但哇哩咧......


  看到中途真的一把鼻涕一把眼淚整個撐不住，但也不知道哪裡算是讓人難過的地方
















  不過大概還是想雷一下講一些比較有趣的銜接點

















  基本上幾輪下來都有起承轉合然後又再一次的嘗試


  比較有感的是中風的魯本抓住水管那幕我還沒理解是什麼意思


  還有貓貓躺在那邊給雪包住真的心都寒了，但牠超級會演的，雖然從頭到尾根本都在跟湯姆漢克撒嬌(笑)


  孕婦不能碰貓怕寄生蟲這個大忌也有特別描述算是很棒的地方


  除此以外大多數哭點大概是失愛與人生目的的痛苦吧


  像個人家庭因素，我爸曾說過「如果因為跟人打官司導致整個精神崩潰陷入中度精神障礙的我媽」

  因此出了什麼事他會乾脆去跟他們拼命一波結束


  但說到底我爸也跟這部主角一樣，為了她而活了一輩子


  會讓人感慨所謂真正的愛到底是什麼，能讓人一輩子整個人生都繫在上面


  但也很多情侶夫妻早早就分手離開......


  咳，總之這是一部好電影跟劇本



  比較微妙的是劇中稍微塞了點跨性別要素，放在第四波收尾上，沒影響到任何東西算是還好



  倒是會聯想到日本漫畫的死役所中，就正好也有這種雞掰鰥夫的故事


  很不幸的他的後事就十分慘烈


  他的故事起頭也相同，與社區相處得很好的老婆突然走了

  老公本身稀奇古怪的脾氣為了避免自己爛在家裡硬是沿著老婆的社交網路出去走走


  結果超級大失敗，去跟人家上課完全不想學東西、做饅頭分給人家吃卻自顧自降糖分


  最後就如同本片的獨居老人主角......嚴格來說，就差那麼一點就是這部最痛苦的地方吧？



  打到這裡才突然領悟為什麼要特別下標語，其實這部勸阻卻自殺效果超級差的耶




  額外補了一下Tvtrope的條目，只多看到小說步調相同、瑞典版與小說相對加強了很多主角雞掰別人的部分


  這部電影除了一開始買東西以外大部分都是在糾正跟碎嘴而已，通常不到人身攻擊，連種族歧視的是反過來搞笑的



  只可惜原版因版權問題...


  --'
