url: https://www.ptt.cc/bbs/movie/M.1692717125.A.E7F.html
title: '[請益] （有雷）請問超難搞先生的一段劇情'
content: '就是奧托去幫鄰居顧小孩的時候，

  看到牆上掛兩張表框的好像是畢業證書，

  好像一張大學，一張碩士，不知是否為名校，

  然後還起身特別去看，

  請問特別演這一段，是要凸顯女鄰居學歷很好嗎？

  因為奧托很愛嫌別人是白痴，

  然後最後有說女主不是白痴，

  不太懂特別演去看那兩張證書的意義，

  請教一下，

  謝謝。


  -----

  Sent from JPTT on my Samsung SM-A426B.


  --'
