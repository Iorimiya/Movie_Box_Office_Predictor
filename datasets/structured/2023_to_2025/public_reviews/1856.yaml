url: https://www.ptt.cc/bbs/movie/M.1676195355.A.4BE.html
title: '[好雷] 超難搞先生 人生的意義'
content: '雷文防雷資訊頁



  在還沒看之前看網路影評蠻高的，就立馬訂票，果然沒讓我失望，如果有女性朋友記得

  帶衛生紙~~~哈哈哈


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看完超難搞先生，這是一部很寫實的電影，因為人生的不如意和親人過世，導致男主

  角想放棄人生，所幸有善良的鄰居及時拉一把男主角，才讓他回到正常軌道，我在學

  生時代也有這種想了結生命的想法，還好在人生低潮時有遇到一些很棒的人拉了我一

  把，所以現在很幸福，也很感謝當初的貴人謝謝你們在我人生中出現。


  故事中男主角OTTO被認為很難搞，在妻子離世後就開始難搞的人生，導演也以詼諧的

  角度描述這段，讓觀眾又笑又流淚，年輕女鄰居也真是熱心的人，不厭其煩的想打開

  OTTO的心牆，在現在的社會應該很少這種人了，熱臉貼冷屁股還無所謂。



  故事超難搞先生的最後，男主角也將他感受的恩惠回饋給幫助他的人，最後開心且無

  遺憾的離開這世間，我想這就是善循環，有時候無心善良的幫助一個人，對被幫助人

  是莫大的鼓舞，很棒的一個電影故事，湯瑪漢克也是位很棒的演員，從阿甘正傳就很

  喜歡他，看完超難搞先生後又想再刷一次阿甘正傳。


  --'
