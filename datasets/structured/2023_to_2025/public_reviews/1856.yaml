url: https://www.ptt.cc/bbs/movie/M.1719635347.A.D89.html
title: '[  雷] 超難搞先生'
content: '防雷


















































































  這部電影的一切真的蠻貼切的

  從老番顛到建商的雞掰都很寫實

  一般人鐵定不會多喜歡老番顛

  所以應該不太了解他的心路歷程

  也是因為我們的主角是老番顛

  我們才願意了解他的演化過程

  他是個很典型的上代人,絕對會說一代不如一代的那種

  然後很明顯看什麼都不爽,什麼都想砲一下

  但又有刀子嘴豆腐心的性格

  看到鄰居有難,把上吊的行程暫緩

  看到貓咪沒有家,不嫌棄的給他一個家

  結合這些就是對抗建商的過程

  對抗建商是一個善良和雞掰並存的過程

  你一定是秉著良心跟他們對幹,同時不能跟他們客氣

  有時候你也很難評斷這種人,好跟不好的地方都明顯

  不過你會對這種人有相當的印象,不時的想起這個人

  就像最後男主角的遺愛人間

  大家也許還是會覺得他很機機歪歪

  更多的卻是他好的那部分,這樣就夠了

  至少他留下了大家會津津樂道的事蹟

  如同他拯救跌到鐵軌的人的影片一般

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  我們不應該流淚，那對內心來說，等於是身體的敗北。

  那只是證明了我們擁有心這件事根本就是多餘的


  --'
