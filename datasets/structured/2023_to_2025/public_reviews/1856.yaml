url: https://www.ptt.cc/bbs/movie/M.1673914785.A.8AA.html
title: '[好雷] 超難搞先生'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  開演後發現劇情有點Dejavu

  原來是改編自2015年的瑞典片《明天別再來敲門》

  上次看到湯姆漢克斯是《貓王艾維斯》裡的豐腴蹣頇

  現在的暴瘦老態更讓人擔心他的身體健康



  美國版大致沿襲瑞典版的主軸

  但是節奏較為拖沓

  劇情要素上也不如瑞典版鮮明

  比如瑞典版的主角一眼看上去就是憤世嫉俗的機車老人

  湯姆漢克斯則一臉憂心忡忡，像是快被過往回憶壓垮



  主要亮眼的反而是介入主角生活的新移民瑪麗索

  成功為本片注入了幽默與溫暖

  很有說服力地挽回老人的餘生

  還有一點比較有意思的是

  這次找來湯姆漢克斯的小兒子楚門漢克斯

  演他回憶中年輕的自己，戲份頗重

  老爸跟兒子另類同台...其實我不覺得兒子有像老爸 XD



  《超難搞先生》相較瑞典版也更為「政確」

  片裡被趕出家門自力更生的跨性別

  放在十幾年前改個名稱就是同志

  當下我是覺得置入角色應該可以更用心一點


  《超難搞先生》是一部笑中帶淚的溫馨電影

  至少我看前後左右都笑得很開心(?)

  不少橋段我也偷偷一掬眼淚

  喜歡這部片的也建議看瑞典版的《明天別再來敲門》

  在各項議題的探討上原版都更為到位


  最後感謝片商贈票


  --'
