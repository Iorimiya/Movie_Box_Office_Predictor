title: '[贈票] 【超難搞先生】PTT鄉民特映會 (台中場)'
content: '這部是由兩屆奧斯卡影帝、「美國爸爸」湯姆漢克化身鄰居眼中憤世嫉俗的厭世大王奧托

  ，在眾人面前脾氣暴躁又毫無耐心的他，其實背後有一個令人動容的溫暖故事。在結褵多

  年的妻子去世之後，奧托不僅對外人封閉內心，對人生也不再抱持希望，直到熱心開朗的

  新鄰居瑪莉莎闖進他的生活。預告中有一個驚喜的彩蛋，湯姆漢克最小的兒子楚門漢克，

  將在電影中飾演年輕版的奧托，首次在大銀幕上露面，這也是首次湯姆漢克與楚門漢克同

  台演出同一部電影。


  導演：【007量子危機】馬克福斯特

  編劇：奧斯卡提名 【少年PI的奇幻漂流】大衛馬吉

