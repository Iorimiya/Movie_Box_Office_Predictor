title: '[微好雷]超難搞先生心得'
content: '剛看完這部影劇，看完真的是邊看邊哭




  微雷


  在劇中奧托是一位很難搞，被人避而遠之的老人

  但原本的他是一位熱心助人的好人，後來因為自己的老婆過世

  讓他備受打擊，人生失去了色彩

  後來在他低潮的時候，剛好有搬來隔壁的鄰居闖進他的生活，讓他展開不同的人生樣貌


  我們人生在不同的階段一定會遇到一些挫折與煩惱

  你可以低潮、可以抱怨，你也可以像他一樣難搞

  但千萬不要忘記自己的初衷，還有自己愛的人一直待在你的身旁


  --'
