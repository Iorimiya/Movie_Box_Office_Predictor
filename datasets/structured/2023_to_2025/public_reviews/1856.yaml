url: https://www.ptt.cc/bbs/movie/M.1677337845.A.658.html
title: '[好雷] 超難搞先生：精緻有誠意的感人小品'
content: '(防雷)

  無雷推薦：不要猶豫，去看就對了














  (有雷警告)







  瑞典原版跟Tom Hanks版都看過了


  強烈建議兩個版本都可以看一下


  著墨的點不太相同，但都很有意思


  瑞典版劇情比較紮實，


  帶入了比較多身障權益的議題


  Tom Hanks版則是比較單純


  並且放入了社群媒體的相關內容


  其實認真來說，


  瑞典原版相較於Tom Hanks版


  瑞典原版真的更難搞XDD


  那個主角真的有夠機歪的，


  那個模仿狗叫的碎嘴真是印象深刻XD


  會聯想到身邊每一個欠揍的人


  反觀Tom Hanks比較像是「難親近」


  不會說很難搞，但Tom Hanks不虧是影帝


  把那個Otto遺憾、對人生的不留戀、


  還有對妻子的緬懷


  每次看他回憶Sonya時，眼淚真的止不住


  以及吃烤雞、餅乾時、還有跟鄰居女兒互動那種


  想正經但又不由自主開心的微表情詮釋得很到位


  這部片優點非常多，


  Tom Hanks演技內斂且感人


  而且音樂、剪輯也不馬虎，


  配樂都非常好聽


  整部片要小挑剔缺點


  就是靠網路媒體幫鄰居拿回房子那段真的太Easy了


  心裡某個地方就是覺得怪怪的


