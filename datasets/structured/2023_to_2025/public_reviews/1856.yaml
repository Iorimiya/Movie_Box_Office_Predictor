title: '[請益] 看超難搞先生看到哭是正常的嗎？'
content: '我是看Netflix 線上串流的

  明明劇情已經知道是一個超級機車的老人，這種老人常常存在於你我的身邊，日常生活中也

  會看到。


  但是故事的結尾，女鄰居讀著他的信那段，我居然流淚了，我平常看電影是不太會哭的耶。


  有人能幫我分析一下哪些部分觸動了我的淚腺嗎？


  看到哭我自己是超級意外的。


  --'
