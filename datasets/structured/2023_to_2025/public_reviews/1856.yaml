title: '[ 好雷] 超難搞先生小小心得'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線

  ~

  ~

  ~

  ~

  ~

  ~

  ~

  ~

  ~

  ~

  ~

  ~~~

  ~~~~~

  ~~~~~~

  ~~~~

  ~

  ~

  ~

  ~

  先下結論！

  看完沒有覺得浪費時間真的是太棒了！還被沒收了好多眼淚QQ


  抱歉鄰居是瑪莉索才對！記錯名字了！

  男主老婆才叫索妮亞…在此跟湯姆漢克斯道歉QQ


  很慶幸奧托的對面搬來一個如此暖心的房客瑪莉索一家人！多次都在奧托的人生即將畫上

  句號時又把它改成逗號！每次都很到位啊～而且跟丈夫吉米的互動也很逗趣，從一開始的

  借扳手就覺得他們是不是在演戲為了找話題跟奧托聊天XD我也覺得瑪莉索有發現奧托終結

  生命的想法才會一直登門打擾！打擾過程中也了解到奧托有多麼的厭世！

  雖然時空背景一直跳躍卻沒有讓我感到不適或看不懂！也讓我了解到奧托真的很愛他老婆

  ！看到公車事故那幕還以為妻兒雙亡了！幸好還有留下一個！不然奧托應該活不到今日了

  ._.

  看到後面一直以為吉米會被綠XDD還好最後是很溫馨的一家人！雖然奧托還是走了！但我

  覺得在最後他獲得了很溫暖的一家人，及一隻貓XD

  看到最後覺得奧托其實也是個嘴硬的大暖男啊！！！很喜歡奧托這個角色～很像住在鄉下

  刀子口豆腐心的長輩XD嘴巴不斷碎念卻還是會給予幫助！！





  --

  對QQ抱歉記錯名字了><'
