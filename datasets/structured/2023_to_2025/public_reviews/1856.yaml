url: https://www.ptt.cc/bbs/movie/M.1673881501.A.E65.html
title: '[好雷] 《超難搞先生》笑中帶淚的暖心小品'
content: '感謝片商贈票，已經10幾年沒在台中親親

  戲院看電影，上次在這看是2011年的星空

  ，影廳設備真的超爛，這次安排在親親1廳

  ，整體設備升級的體驗真的很棒。


  本片由湯姆漢克斯主演，相較於上一部貓王

  電影的身材肥胖，本部刻意減重，讓演繹成

  一個獨居難搞老人更有說服力。



  沒有看過原著，單純以電影來看，這部是

  值得推薦進場的暖心小品，是那種以後就算

  在HBO看到，會為它停留不轉台的優秀作品

  。


  雖然整體是很普遍的公式劇情，但本片的人

  物特色是一大亮點，尤其是瑪麗索，不僅是

  奧圖的鄰居也是情同父女、好友，更是剋星

  ，她帶動了整體劇情，跟笨蛋老公更是搞笑

  擔當，如果這部片沒有瑪麗索，會黯淡許多

  。




  全片風格輕鬆詼諧，但卻不失感動人心，在

  奧圖嘗試自殺時，總會連結奧圖與妻子年輕

  時的相遇，很喜歡這邊劇情處理的風格。


  如果想要在寒冷的冬天來部暖心的電影

  《超難搞先生》會是近期最佳選擇。




  -----

  Sent from JPTT on my Xiaomi 21091116UG.


  --'
