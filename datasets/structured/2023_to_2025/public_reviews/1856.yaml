title: '[微雷]蟻人跟超難搞先生'
content: '其實沒什麼雷啦


  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  蟻人 幹這三小 AI的粒子多元宇宙???

  整理來說 很亂 簡直是蟻人之簡樸窮人之星際大戰版

  大魔王也沒有很強

  然後很好笑的是 黃蜂女又老又醜 她媽看起來比較年輕

  而且黃蜂女膚色黑黑的 難道他的親生老爸是黑鬼康康??


  而且蟻人變大大巨那邊 好像鹹蛋超人XDDDD

  然後初代壞人變成的大頭怪

  讓我想到這個早期人氣卡通 未變身前的大頭




  唯一優點是 蟻人女兒超正 可說是漫威岳父了 好幾個角度有王淨的FU


  超難搞先生則是大力推薦 非常感人 在電影院的氛圍襯托下

