title: '[  雷] 超難搞先生 勿以惡小而為之'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  週末在Netflix看了超難搞先生

  必須說這大概是近期看過最滿意的

  用簡單的故事、慢悠的節奏、真摯的人物情感去說好一個故事

  比起錯綜複雜的劇情編排跟邏輯

  我更好這種直球對決的風格


  我身邊也有一個這樣的朋友

  對很多事情很有原則

  但當然不至於到片中主角那樣會去攻擊別人的程度

  但必須說這種人的堅持往往都是對社會很有幫助的

  俗話說勿以善小而不為；勿以惡小而為之

  遺憾往往都是很多的小惡造成的


  回到正片

  其實主角在生活中的這些堅持都是對的

  只是在情境的使用上或許可以更婉轉

  但也能說或許他試過婉轉的方式了

  但是無用

  我想因為失去愛妻的傷痛

  這些對生活準則的堅持是他僅存的生活目標

  也是維持人設的一種方式

  就像他對妻子的愛

  至少他去愛妻幕前聊天時能讓逝去的妻子感受到他沒有變

  依然是那個愛他的癡情男


  但本片想傳達的是

  其實如果你願意用更開闊的心胸以及眼光

  身邊其實還有很多關心你的人

  或是值得你努力的事

  其實很多東西都是一念之間可以轉變

  轉過了你也覺得其實沒什麼

  例如他跟老友的過節


  整部片對主角人物刻畫的描寫非常深

  對他人生的參與感很真實

  也能透過導演的手法完完全全感受到主角的情緒

  實在是部暖心的好片



  --'
