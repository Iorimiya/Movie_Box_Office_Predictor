url: https://www.ptt.cc/bbs/movie/M.1676044877.A.694.html
title: '[好雷] 超難搞先生。沒有令人失望的'
content: '雷文防雷資訊頁


  OTTO看完後我的臉變成這樣，感情豐富的人記得帶面紙


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  起先覺得書好看，我看著滿滿的電影片單，心想就選它吧，並早早劃了位。


  OTTO是個不好相處的老先生，其實一般人看到這樣的主角，可能不會特別想看這部片，但

  我看完非常感動，不虛此行。

  我對經典北歐電影刻版印象就是步調較慢，但不知是因為書中的人物刻畫，還是電影呈現

  的方式，這部片讓我能自然而然跟著鏡頭想多關心OTTO先生為什麼要做出那些舉動。

  然後我就哭了，本來是小哭，最後哭到口罩都溼溼的，不得不拿起我的大包包翻找著面

  紙。

  很推薦的好片！


  --'
