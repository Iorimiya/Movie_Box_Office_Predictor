title: '[好哭雷] 超難搞先生'
content: '重雷慎入















  關於超難搞先生的劇情，

  主線其實很好預測，

  但就算早已做好了心裡準備，

  也無法阻止自己在戲院哭成87。



  劇情走向已經大致明朗的電影，

  尤其又有原版珠玉在前，

  也就更考驗導演的執導功力以及演員的演繹能力，


  湯姆漢克斯自帶的憂鬱氣場非常貼合對人生毫無期望一心尋死的奧托；

  而導演運用對稱的畫面、奧托所居住的社區、以及四季變化這些細節來隱喻奧托心境的轉變

  都是我很喜歡的手法。


  色調、配樂、音效也都是一時之選，就像交響樂一樣，每個音符都適得其所，最後交織成一

  篇完整的樂章。


  推薦給喜歡溫馨療癒、以及跟我一樣對回憶殺超沒輒的你



  另外，再推一下類似氛圍的歌曲






  我猜想瑪麗索一開始就知道奧托的人生登出計畫了，你們覺得呢？




  推薦指數 5/5

  療癒指數 5/5

  哭哭指數 1000000/5




  紀念一下這是我的第100篇文，以下留言中隨機挑一位送稅前100P




  -




  --

  QQ，我從餐廳約會那段就開始哭了，有人比我早的嗎哈哈哈哈哈

  我的想法是在窗外就看到了，話說那一踢真的好帥XD

  哈哈，我覺得重點不是他多擊敗，是厭世感+生無可戀，因此這部的選角我給滿分，瑪麗索

  也演得非常棒！！

  其實瑞典的才是原版

  沒關係我不孤單:")'
