url: https://www.ptt.cc/bbs/movie/M.1676899985.A.FE2.html
title: '[好雷] 超難搞先生'
content: "先講結論：\n如果最近覺得體內水分太多無處宣洩\n能接受電影播放中旁邊夥伴的鼻涕聲\n歡迎進場看這部電影\n\n\n以下是喜歡的部分\n\n1.Tom\
  \ Hanks的電影：\n\n  光看他的演技就覺得過癮，尤其把內心很深層的情緒、單純用表情的方式演出。\n\n2.人與人的連結：\n\n  比起很多電影，裡面的人物很多都有很突出的能力或者是背景，而這部片的人物\n\
  \  就是日常生活會出現的平凡角色，雖然很普通也很不起眼，但社區的每個住戶關係\n  ，其實是很緊密連在一起，就算沒有很熟，但也都知道彼此的存在。\n  是我覺得滿溫馨可愛的一部分。\n\
  \n3.OTTO的老婆\n\n  這是劇情裡面最吸引我的一部分，這樣的女生身邊一定不缺追求者。\n  但她卻選擇連談吐、外貌都不是那麼出眾，甚至經濟上都還有問題的OTTO\n\
  \  一起吃飯。尤其她在餐廳問OTTO為什麼不吃主菜時，OTTO的回答讓我知道\n  他就是那麼一個真誠可愛的存在，毫不掩飾地把自己呈現在喜歡的人面前，\n \
  \ 那是需要多大的勇氣。\n\n4.現實的發生\n\n  因為我們家鄰居就是有這麼一個存在，所以劇情有帶入現實的既視感。\n  小時候真的覺得他很靠杯囉唆，什麼都要念和撈叨，但不得不說他對於\n\
  \  做事情的專注和完美，而且答應過的事情會辦到好，舉凡家裡水電&機車\n  只差沒請他接生而已。雖然還是很愛東念西念。\n\n  長大之後也習慣和他這樣的個性，也對於有這樣的鄰居感覺很開心。\n\
  \  直到有一次和他一起修理家裡的水塔，看見他年邁走路的樣子，還有那雙不再充滿\n  魔法的雙手，真心覺得要再找到這樣熱心的鄰居很困難。\n\n  近年因為身體的病情，越來越少看到他走在路上，連搞事弄點東西給他靠杯的\n\
  \  機會也沒有。\n\n  有人說住大樓很好，有管理員，有人幫忙收件，沒有鄰居間硬要搭話還要客套打招呼。\n  但如果可以，我想再遇到這樣敦親睦鄰愛靠邀的好鄰居。\n\
  \n\n\n--"
