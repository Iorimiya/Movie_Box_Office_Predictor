url: https://www.ptt.cc/bbs/movie/M.1691334308.A.A21.html
title: '[好雷] 你身邊也有一個超難搞先生嗎'
content: '超難搞先生大概是今年看過最棒的小品電影

  故事單純、架構完整

  大概就是帶你看看超難搞先生的一生

  細細品嘗完會很有感觸

  適合一個休假的午後一個人慢慢欣賞


  裡面的主角讓我想到一個多年老友

  他對交通正義也有一樣的堅持

  晚上出門散步的時候都會檢舉路邊違停的汽機車

  有一次跟他出去 看到有人騎上人行道

  他直接大喊：「這裡是人行道!」

  讓一旁的我有些尷尬

  說起這些違規仔他總是氣得牙癢癢

  而且這行為他一做就是好幾年

  有時會好奇他為啥要一直堅持這些事

  畢竟他一個人的努力對整體社會的影響也不大

  他回我說:「這些事 總要有人來做」

  他相信這些舉動會像漣漪一樣慢慢擴散


  看完這電影後慢慢有更了解他孤軍奮戰的心情

  或許有時候我們在社會上都享受著某種紅利

  但渾然不知這些紅利是一群超難搞先生努力堅持的果實

  你身邊也有一個超難搞先生嗎?


  --'
