title: '[ 好雷] 超難搞先生很走心'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  其實看完超難搞先生一陣子了

  但是身邊的人好像都不太知道這部片

  討論度在我同溫層算低

  啊我也是在男友推薦下看的

  他說：這部你一定會喜歡 而且會哭

  想當然爾……

  我就來推了


  奧托這種潔癖個性我覺得在老年人身上很多

  反正就是對某些事情有獨特堅持

  就像我媽不喜歡客人夾了麵包又不買放回去

  我阿嬤明明好客 但不喜歡別人太熱情

  可能各年齡層都有所堅持啦

  只是年輕人比較傾向不要多管閒事（？


  雖然奧托死腦筋有時候很討厭

  鄰居卻也很習慣這樣的相處模式

  甚至有點依賴奧托幫忙修理東修理西的

  遇到外來打壓還很團結


  文字講的很無聊

  看起來就是很有fu

  很喜歡這部片的敘事模式

  整個vibe都很舒服

  包括色調和節奏

  而且情緒面也照顧到

  奧托躺下的那幕非常催淚

  淡淡的卻很走心

  可惡 我也想要雪弗蘭！

  之後都要跟鄰居好好相處

  共勉之（喂






  --'
