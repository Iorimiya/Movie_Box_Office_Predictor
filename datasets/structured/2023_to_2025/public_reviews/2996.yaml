title: '[好無雷] 銀魂 THE FINAL'
content: "《銀魂 THE FINAL》 - 還原原作追求極致、刪增仍有遺憾\n\n老實講，身為追《銀魂》到中途斷離過的我，近期回頭補最終章進度，與\n欣賞作為收尾的漫改電影，得到的感受有感動，倒脫離不掉可惜的滋味，\n\
  促使自己不敢輕易寫出看法，怕無法明確表達長期以來支持這部作品的心\n聲。\n\n然而，我還是選擇一次講個明白，會比較對得起先前補追到結局的心情。\n在這選擇無雷方式，描述個人心得，提供大家之後觀看的參考。\n\
  \n從銀時同私塾老熟識桂、高杉帶著攸關地球存亡的關鍵物，通往中樞塔阻\n止悲劇發生，又受到來自萬事屋、真選組與歌舞伎町的要角大力相助，與\n過去交手的敵方勢力再度展開刺激對決，無疑帶給我的是緊湊、熱血、動\n\
  人和詼諧的觀影體驗。\n\n首先，談談從漫畫改編成劇場版的此回成果。可清楚看到將令我混亂的原\n作分鏡，好好地重新梳理達到一看就明白劇情怎麼走的成效；特別是促成\n\
  大反派上陣的轉捩點，原版進展順序出現邏輯不太通順的疑慮，經動畫團\n隊適度調整，不只解決我在看漫畫到這段的困惑，還善用配樂結合角色情\n緒表達鋪陳大事要發生的氣氛。\n\
  \n此外，配合由平面讀物變成生動大銀幕呈現的轉變，把原本阿銀講轉至別\n家雜誌連載得罪同家出版社話題作的過程，更改為動畫團隊應付製作困境\n的現實挖苦，致使打破第四面牆玩得更猛烈，同時散發笑著笑著就惆悵起\n\
  來的苦悶氣息。\n\n論及惡趣少不了本作惡搞其他作品的精神！別的不說，光前情提要變本加\n厲到我還以為是走錯棚了呢！扯的是連畫風模仿跟本來版本沒啥差異，且\n\
  借回擊順便正大光明使出他作經典招式進行惡整，根本沒在客氣，完全走\n不在乎是否被提告的步調。不愧是我喜歡的搞笑作品，果然到最後不放過\n趁機白爛的任何一刻！\n\
  \n還有預告有透露的萬事屋重聚部分，發揮老大以外成員既定特色：定春咬\n人、新八吐槽、神樂毒舌，任阿銀遭定春咬頭的悲劇慢慢導為令我這老粉\n笑破肚皮的荒唐喜劇，可以說氛圍切換銜接角色特徵重溫恰到毫無突兀，\n\
  也替萬事屋阿銀安排華麗帥氣不失重口味搞笑成分的隆重回歸，逗得我是\n大笑想噴淚又興奮不已。\n\n接著，人物外觀亮度方面，怎麼比我在看同為宮脇千鶴執導的電視版第三\n\
  、四期，來得更加明亮，我還以為大家是在開美肌濾鏡效果，或借到《Jo\nJo的奇妙冒險》代表物石鬼面戴，通通變成不見天日的白皮膚吸血鬼呢（\n笑）！\n\n回歸漫畫改編這點，對照〈銀之魂篇〉最後六回內容，看得出幾個明顯刪\n\
  增痕跡。比如，定春迎見阿銀一夥前，原作明確敘述牠在本回牽涉地球命\n運的關鍵，偏偏到本片直接刪掉不提，淪為純粹和萬事屋重逢協力的戰友\n，失去加深角色特質寶貴機會，令我感到惋惜。\n\
  \n至於增補這邊，桂小太郎對付半途殺出的對手那段，個人期待是達到桂先\n前與春雨「三凶星」之一猩覺交手時鋪墊角色魅力的層次。沒錯，針對打\n鬥譜寫的激烈吉他演奏樂，提升二人之間互不退讓的情勢，並增加台詞澄\n\
  清敵人身分與出場動機，順便了解桂恩師吉田松陽深陷長生不老輪迴的折\n磨，卻憑敵方同情松陽的發言讓我不禁想問這次交戰意義何在，又覺得錯\n失敵人本該形成阻力而非助力的作用。\n\
  \n到這或許會問我難道這塊就沒達到我心中認同之處嗎？其實不然！光是增\n添一些動作或鏡頭加以順暢發展的顯然是看得到的，就土方十四郎與柳生\n九兵衛那段互動，氛圍從嚴肅換為歡樂，中途安排循土方「鬼之副長」人\n\
  設的拔刀特寫，對應九兵衛一本正經搞怪的講究心態，形成不按理出牌的\n反差笑點，對我而言接近尾聲享受《銀魂》特有逗樂花招是相當開心的事\n。\n\n儘管前面點出片中得改進的地方，終究掩蓋不住不甘阿銀他們告別觀眾的\n\
  不捨，但就是這部作品佔據我人生有不可忽視的一塊，且時常被空知英秋\n那異想天開的幽默手法笑得快弄壞肚子，才感覺不發自內心道出實話，等\n同愧對長期陪伴的老朋友；就算好幾度預告邁向完結，差點翻白眼見太平\n\
  洋，依然不影響對於空知帶來歡笑的謝意。\n\n==\n\n◎ 電影資訊\n\n名稱 | 銀魂 THE FINAL\n年份 | 2021\n管道 | Hami Video、bilibili、myVideo、Apple\
  \ TV、Google Play、\nYouTube 電影\n導演 | 宮脇千鶴\n編劇 | 宮脇千鶴\n原著 | 空知英秋《銀魂》\n主演 | 杉田智和、阪口大助、釘宮理惠、高橋美佳子、子安武人、石\n\
  田彰、山寺宏一\n\n==\n\n◎ 收看管道\n\nHami Video：\n\n\nbilibili：\n\n\nmyVideo：\n\n\nApple TV/iTunes：\n\
  \n\nGoogle Play：\n\n\nYouTube 電影：\n\n\n--\n          \\◣◣\n\\   ╲       ★\n\\╲◢\n\
  \  ◥\n▏ ◤\n ◣\n\n--\n不鬧就不是銀魂了XD\n我看到結局，也同樣希望空知老師持續畫下去，\n但一想到他在周刊少年Jump連載時生出病，想要他好好就此休息，\n\
  讓我心情感到矛盾。 QQ"
