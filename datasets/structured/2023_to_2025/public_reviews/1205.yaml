title: '[好雷] 崖上的波妞'
content: '雷文防雷資訊頁








  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~







  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線

  ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  趁有空重溫了這一部電影

  再次聽到：「波妞喜歡宗介！」

  還是會覺得好可愛！


  很喜歡在淹水後的劇情

  宗介和波妞踏上找理沙之旅

  看到理沙的車子，卻沒看到人

  即便是乖巧懂事的宗介，也是破防了

  當下他的腦袋應該閃過各種不好的念頭吧



  波妞平時表現的雖然“鏘鏘”的

  這時候卻意外的冷靜

  牽起宗介的手要去找理沙。

  宗介才打起精神


  現實中知道兩小無猜的變數很多

  內心卻還是希望他們這一對，長大後不變


  --

  這張圖片確實蠻恐怖了XD'
