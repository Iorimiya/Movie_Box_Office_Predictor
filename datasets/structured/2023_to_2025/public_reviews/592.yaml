url: https://www.ptt.cc/bbs/movie/M.1735979860.A.2EF.html
title: '[普負雷]《祝你們幸福》，みなに幸あれ。'
content: '部落格版：


  日本新生代導演下津優太發想自「地球上的幸福守恆定律」的都市傳說，將「如果世界上

  不幸的人與幸福的人數量是相等的，那可不可以故意製造出不幸的認知，來讓自己活得幸

  福呢？」的概念放入其中，拍攝成一部僅12分鐘的短篇作品，不僅獲得了首屆日本恐怖電

  影大獎首獎的殊榮，更被日本業界讚譽為能夠「改寫J-Horror的歷史」，後由當屆評審團

  主席、日本恐怖電影大師清水崇出任監製，把此作延伸為88分鐘的長篇作品《祝你們幸福

  》。如此評價自然是讓人對《祝你們幸福》有著高度期待，然而實際看完電影之後，卻不

  禁想對這樣的評價給打上一個問號。


  《祝你們幸福》概念確實有趣，導演下津優太將這樣一個看似古怪且莫名的故事用相當通

  俗易懂的方式講給了觀眾聽，讓人能從中準確看見電影中那「犧牲他人來獲取幸福」的假

  設寓言，而既是以此來將劇情延伸，整體發展自然會朝往這個方向。於是，導演下津優太

  讓原來以拯救他人為職志、正在就讀護理系的女主角，受到包含爺爺奶奶在內的多個有著

  不同想法與立場、遭遇、過程與結果的角色衝擊與影響，讓她本來的信念逐漸鬆動、甚至

  崩潰瓦解，在她眼前近似超自然的詭譎，其實都是存於社會的無情現實。不是吃人就是被

  吃、不是犧牲別人就是奉獻自己，不論是自己體悟到的幸福，還是他人感受到的幸福，其

  實不都是建立在「有人（自己或者別人、包含牲畜）奉獻出生命」這事之上？



  女主角見識到了將犧牲他人視為理所當然的爺爺奶奶的癲狂、始終無法靠別人來讓自己幸

  福的兒時玩伴與最後不幸離世的其父親、路邊偶遇遭到欺負最後再見面時卻成了欺凌他人

  的男學生、還有被父親一家視為已死去那逃離現實獨居山上的姑姑...，她不斷的反抗著

  家人口中似乎逃避不了的命運，只是當女主角進入到死亡倒數階段卻依然下不了手奪走他

  人性命，最後是兒時玩伴為了讓她幸福決定讓女主角親手「殺了」自己，好使懦弱的自己

  得以續命的時候，女主角聽著家人們對她果然沒辦法犧牲自己好奉獻給家人的嘲笑後，終

  於褪去了僅有的假聖女尊嚴，轉而加入這個犧牲他人來獲取、或者說是維持幸福的可恥世

  界。


  只是可惜的是，雖然導演下津優太有著「不知從何而來、從誰開始也不知道如何結束的口

  耳相傳而生成」的都市傳說當作故事基底，讓深知都市傳說難以探究起源的觀眾能夠不去

  特別在意電影有沒有對整個劇情中各種的不對勁、如女主角爺爺奶奶的詭異言行等無法解

  釋的情事進行解釋，然而依舊無法讓人認同女主角的「不正常」。基本上可以明白的是，

  女主角的故鄉本就信奉著「犧牲他人來換取幸福」這樣的理論，從爺爺奶奶到女主角過去

  的同學、還有後來才抵達的父母親，本身就有如此詭異莫名的言行舉止是能接受的，也因

  此他們相當排斥不遵行此理論的女主角兒時玩伴與他的父親，而好幾次都有提到爺爺奶奶

  或者父母親都有想要「告知」女主角「某些事」，故可以說明剛回到故鄉的女主角並不知

  道故鄉的「不正常」。



  換句話說，女主角在剛開始時應該是「正常」的才是，觀眾理應看到「正常的她」在衝撞

  著「不正常的家人與故鄉」，但女主角卻在有些時候的反應與決定，卻會讓觀眾無法理解

  。起初面對爺爺奶奶的各種不對勁，如站在走廊深處動也不懂、舔拭著她的手指、時常聽

  不到她在叫喚他們，女主角都用是否老人家得了失智症來解釋，可隨著怪事越來越多、目

  睹了爺爺奶奶綁架男人、還將其雙眼與嘴巴縫起，趕到的父親與母親也沒有要阻止，甚至

  還放火燒了男人，周圍的鄰居亦是冷眼旁觀著一切時，女主角氣憤的收拾著行李要離開，

  結果最後卻還是留了下來...等的，都不是正常人遇到無法理解的事情所會有的行為。即

  使心裡知道這類劇情走向，最後女主角選擇留下是絕對肯定的事，無奈女主角的「不正常

  」卻讓人內心抗拒去認同這樣的發展。


  《祝你們幸福》不走傳統的突發驚嚇，也鮮少有會嚇到人的橋段，偏向於另部日本恐怖電

  影《來了》中的前半段，僅靠畫面與聲音成功製造出故事感，帶給觀眾黏膩的不適與壓迫

  ，不特意說白的詭異言行更添詭譎，是部單論氛圍就勝過許多恐怖電影的作品。不過除了

  前面提到過的女主角問題外，電影的氛圍勝過劇情、比起劇情更像是氛圍讓觀眾感到不安

  的這點，在《祝你們幸福》中也影響了觀眾給予電影的評價。至少對我來說，我喜歡電影

  說不上來的毛骨悚然，也喜歡古川琴音的演出，但回到劇情本身的話，《祝你們幸福》就

  有如電影中人們不斷談論的幸福那般抽象，看似具體卻虛幻的情節撐不起、更有些拖累被

  賦予的概念，讓這部本應有意思也具有思考空間的作品，容易被看為刻意灌輸某種信仰的

  自我意識過高之作。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --

  認同，女主角的心境太詭異了'
