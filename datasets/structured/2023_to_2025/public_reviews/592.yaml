title: 'Re: [普負雷]《祝你們幸福》，みなに幸あれ。'
content: '剛剛看完，簡單想法：


  這片的優點：

  氛圍塑造得不錯，配樂跟音效上對此貢獻良多，甚至給我有些許歐美恐怖片的感覺（音效配樂）

  然後女主角的演技扛起了劇情，因為劇情設定的不足跟薄弱，更需要女主角的表現讓這部劇

  不致於整個垮掉，我覺得她有做到


  再來就要講這部劇的缺點：


  它要表達的概念我大概能理解，但顯然導演沒有把這個設定再去細膩深化

  以至於你只能用理解它抽象表達的部分告訴自己忽略常識上的不合理費，

  而一旦你脫鉤了，就會感受到整部劇的荒謬，這是很大的敗筆


  在這個命題上，受益得到幸福的家庭 有多幸福？

  其實就一個普通家庭，感覺上他們沒有真的大富大貴，反而是停止後遭遇到的

  情況，感覺上這更像一個詛咒，你得到的不多，但反噬的後果卻很嚴重


  這不合理，至少主角家庭要設定為富人家庭，他們藉此得到的「幸福」

  是足以旁人稱羨的，你這個支撐整個故事的命題才站得住腳


  再來，被綁的人就不幸福嗎？

  導演沒講清楚，看雜貨店老闆娘的反應 他們似乎沒有很抗拒成為這樣的角色

  那，這要犧牲的人能得到什麼才能換得人自願做這樣的事情，都沒講清楚。


  而且逢著嘴眼靠簡單的點滴就能活那麼久（這一點都不合理）


  他應該設定，這些被縫嘴眼的人 也許都是世上受盡苦難的人

  一旦進入那樣的狀態，他們不需要進食也能活在幸福的夢裡，致使這些人

  也願意被奴役，這樣大家都得到自己想要的幸福


  這樣才會有選擇的衝突 但這部片都沒講清楚，變成觀眾要發揮想像力補全


  其他阿嬤生孩子根本沒意義，感覺導演滿足自己的獵奇口味而已


  要我說這部片好或不好，我也很難說

  它有些新東西，有優點，甚至我覺得日本人在這個他們會花大篇幅說教

  的事情上卻沒說教，太值得鼓勵了


  但日本恐怖片沈淪的原因也很簡單，一個的故事脈絡都沒辦法設定

  的完整，我就不知道這是誰的問題，總之 日本片還是要加油

  -----

  Sent from JPTT on my iPad


  --'
