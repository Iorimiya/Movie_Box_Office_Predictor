title: '[微好雷] 《末日小隊請登入》 '
content: '得了蠻多獎項

  院線已上映一段時間

  這裡比較談的是我覺得片子有問題的部分



  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  《末日小隊請登入》的問題會是過於「形式主義」？以生存遊戲《DayZ》裡製作的獨特紀

  錄片，自己已經不太區分到底是紀錄片 劇情片 還是錄像藝術 等等分法，對我來說都是

  「看起來會動的影像」。


  但若是宣稱的紀錄片 就好比 基督教的 因信稱義 有現實對照的效度，透露電影 紀錄遊

  戲的虛構樣貌 與背後真實人物的對白以 AI重建，是特殊性 也透露了電影的缺陷。


  導演以玩家虛構記者 採訪 遊戲中各種社群的虛構信仰 在一開始看似有趣，

  但中段之後略漸疲乏（電影最難的是開始 還有結束），腦中出現，不太知道作者到底要

  幹嘛的想法 （好 這不重要），但卻透露 導演 創作世界觀的限縮（對 這很重要）


  看完最大的問題

  片中只是呈現人的多樣性， 典型西方政治進步派論調，而非寬廣世界的整體 ，

  只是一種不斷給出世界很複雜的取捨 ，而非化約

  中後段 充斥著 現實逃逸 老生常談的論調 ：精神分析式 ，現實自我 數位本我。

  很 基督教式的二元觀點

  於是對於那種 末世烏托邦氣氛，嬉皮感

  看似解放 其實危險。

  （看到後段在空中游泳那種很ㄎ一ㄤ的東西 覺得是某種「正確」無誤）



  自覺不是嚴肅的人

  在想遊戲本體論的可能性


  約老朋友新春聚聚剛好看的電影，討論就是可能性

  其中一個朋友 年輕時是CS《絕對武力》高端玩家組隊分享遊戲經驗

  覺得 實在感很重要 如在電影中被抹去 的血條

  被作者的「遊戲紀錄片」概念（意識型態）凌駕「 實在—虛擬」之間 有便宜行事、偷懶

  之嫌。


  另外朋友說：玩家之間溝通 都很務實 大多聊遊戲的事情，

  這讓我想到有趣的反而是， 現實大多是沒有什麼想法（那些在電影介紹中宣稱玩家探索

  「生命的本質」），只想好好玩遊戲的務實玩家。


  刻意布置 虛擬世界與 現實身分的關係 反而落入作者看似隨意、 自然，

  但其實「太有想法」，過於「加工」的意圖。



  --


  拉特飯 - 以商業力量進入獨立市場


  --'
