title: '[好雷] 逃出搶錢鎮好看 有像三個廣告牌'
content: '有點像意外（三個廣告牌） 融合一點險路勿近


  典型的好看黑吃黑電影  後面倉促 但有做到讓你猜不到結局


  南方小鎮拍得很舒服 但裡面的人幾乎不是蠢就是很自私


  男主角跟太太說了半個真相最巧妙 這種自以為的坦承真的不如不說XD


  兩個警察一開始真的信任彼此 就是太太在餐桌上嘴賤搞爛一切


  某方面來說沒有浪費喬瑟夫高登跟莉莉的表演


  真的就是最核心的兩個角色



  -----

  Sent from JPTT on my iPhone


  --'
