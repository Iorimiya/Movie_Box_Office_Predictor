title: '[普雷] 去死吧，親愛的'
content: "雖然劇情有跟沒有一樣\n\n\n\n不過還是防雷一下\n\n\n\n以下有雷請斟酌閱讀\n\n\n\n\n\n\n\n-------------------------------------------------------------------------------\n\
  \n這部導演的手法虛實切換與時間線前後切換很多次,\n而且沒有明確暗示,\n觀眾很難理解到底現在這個畫面是 真實? 幻覺? 回憶?\n導致整部看到最後其實就是一個體驗而已(還不怎麼愉快),\n\
  沒有辦法感受到導演明確的想要說明什麼,\n希望觀眾關注憂鬱症嗎?\n可是看完之後好像也沒有什麼引導觀眾作為....\n(當然也有可能我沒看懂 我承認XD)\n\n\
  以下幾點是個人觀感,\n但也有可能我理解錯誤,\n跟這部的電波不太合,\n同步率不太高 XDa\n\n-片中多次出現的黑馬,\n 如同其他版友的看法就是主角自己的化身,\n\
  \ 這點可以從主角撞玻璃臉部受傷之後,\n 馬臉也有類似的傷痕看出.\n 但最終幕主角燒毀自己的筆記本步入火場時,\n 馬並沒有出現,\n 讓人懷疑其實最後一幕可能只是主角的幻想..\n\
  \n-最後與婆婆舉杯那個party到底有沒有發生我抱持懷疑態度,\n 那個蛋糕(媽媽回來了)出現在兩幕,\n 第一次出現與婆婆舉杯,\n 之後不知哪來的狗把槍殺的狗骸骨挖出\
  \ -> 主角又出去散步\n 此時車道上停滿車輛.\n 第二次出現家中空無一人 -> 主角又出去散步\n 此時車道上空無一車..\n 我的認知是其實兩者都是幻覺而已,\n\
  \ 主角現在應該還在醫院..\n\n-片中先生與女服務生親熱那個畫面應為主角的幻想,\n 由先生後續的表現來看這段真的不太合理.\n\n-與機車騎士ONS那幾段,\
  \ 我認為幻想的成份比較大,\n 至少在停車場謊稱爆胎那段對方一副\"你誰啊\"的表情..\n\n我個人的認知是,\n主角最遲在被送入醫院之後發生的所有事情都是幻覺,\n\
  這點可以從她與死去公公對話這段來得到確認.\n\n當然, 也有可能小孩從一開始就不是真的,\n一切都是流產造成的憂鬱症,\n不過這些都沒講清楚就是了.\n\n\
  畫面部份故意採用4:3應該是想營造一種壓縮的窒息感,\n實際看起來效果是真的不錯 很窒息(汗\n不過那幾段微光畫面效果實在不怎樣,\n除了看起來不清不楚很躁以外對劇情理解或情緒沉浸沒啥正面幫助XD\n\
  更不用說畫面也不美觀..個人是沒很愛這種拍法.\n\n整體而言這部劇情實在太抽象了,\n導演給的引導不太足夠,\n以我這種理解力一般的觀眾來看很難了解導演想幹啥XD\n\
  畫面美術的部份也不是特別出眾.\n\n-----\n\n附帶一提,\n這部是昨晚在信義威秀看的,\n那場有一對情侶在endroll的時候朝螢幕拍照被工作人員制止,\n\
  還回嗆\"If you insist.\"\n理虧就算了,\n還要反嗆這樣會不會太不尊重人了?\n\n本以為會去看這類片型的觀眾素質會好一點, 看來沒有.\n\
  只能說可以理解想分享的心情,\n不過這樣對於你喜愛的電影並沒有正向幫助.\n更不用說對人的不尊重.\n\n--\n這就不好說了\n但從旁人觀點看不是這麼回事\n\
  \n我也不懂工作人員好聲好氣制止他們\n他們有什麼必要回嗆就是了..\n\n我只能說跟我電波沒對上\n看起來相當茫XD\n\n你這麼一說好像真有那種感覺XD\n\
  \n唉 同樣都是劇情理解不能的作品\n我還寧可看兩次Parthenope 至少畫面賞心悅目QQ\n但我有預感這部應該不會是我今年看到最爛的片....\n\n主角確實演技到位\n\
  如果是小珍粉應該會看得很開心XD\n但這部導演可能覺得觀眾理解力都很好就沒拍到讓人看懂...\n\n真的 看到最後還是跟主角很剝離\n如果引導作好一點也許不會這麼難帶入體驗...\n\
  \n真的超亂\n沒什麼引導就真實幻覺回憶一起來\n導演自己玩得很開心 觀影體驗就....\n總感覺JL演技被浪費了 :(\n\n真的QQ\n\n這麼說挺有道理的\n\
  只是觀眾看完之後還是一頭霧水\n這鍋應該還是該導演背XD\n\n像是剛開始的那段裸體打戲我是覺得沒很必要...\n(至少呈現上沒有賦予它足夠的意義)\n不過這片如果不是JL演可能project也不會成案就是.."
