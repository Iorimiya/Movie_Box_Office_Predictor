url: https://www.ptt.cc/bbs/movie/M.1762757693.A.628.html
title: '[普好雷] 去死吧，親愛的'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  聽到羅伯‧派汀森與珍妮佛‧勞倫斯聯手主演，不少影迷應該都會冒出粉紅色泡泡，不過

  ，他們最新合作的2025坎城影展主競賽片《去死吧，親愛的》，與浪漫愛情劇完全沒有關

  係，反而呈現出愛情所能帶領關係中的兩人所能去到最殘酷之處。



  今天倘若《去死吧，親愛的》講述的是一段沒有愛的故事，又或者其中一人做出破壞關係

  之事，那觀眾大可直接無後顧之憂地痛恨片中角色，但它偏偏不是。片中很多細節都一再

  告訴觀眾，他們之間還是有愛的，但當過去甜蜜的體貼互動都不再可愛，關係裡的每項元

  素都能對兩人的精神健康造成傷害。雖說電影開場時，葛蕾絲與傑克森尚未有孩子，但導

  演暴力且毫不留情地把他們瘋魔的裸體搏鬥「非床戲」放在觀眾眼前，直接確保限制級，

  也暗示兩人相愛相殺的關係。



  傑克森提議搬進叔叔留下的房子，無非希望減輕彼此的負擔，而葛蕾絲得知房內有老鼠之

  後，便認為他們需要養貓，沒想到傑克森卻在孩子誕生後，帶回一隻高需求的吵鬧狗狗。

  傑克森的原意可能也是讓小狗在自己出門上班時陪伴葛蕾絲，卻無意間更加深葛蕾絲的精

  神壓力。小狗不斷吠叫，也讓這幢鄉間房屋最大的優點「靜謐」消失無蹤。



  當然，傑克森各種「豬隊友」的行為讓人很難同情他必須獨自面對伴侶轉變的無助，但從

  兩人多次爭吵，傑克森除了提高音量外，並沒有做出什麼攻擊葛蕾絲的行為得以看出，他

  仍舊保有理智，且一直很珍惜對方，甚至提出結婚，努力想辦法讓她變好，只是或許還是

  用錯方法。最後，在葛蕾絲不停自殘後，傑克森決定將她送進精神病院，並獨自擔起照顧

  孩子的責任，而非直接離婚一走了之，也算是很有愛了。



  以《Morvern Callar》、《捕鼠人》、《凱文怎麼了》與《失控救援》等片聞名的導演琳

  恩‧倫賽，本就擅長捕捉循環發生的死亡、悲痛與罪惡感等議題，所以《去死吧，親愛的

  》裡面也有非常多主題之外的象徵符號。但是，導演並沒有給予更多提示，或是深入探討

  這些符號背後代表什麼意思。不論是片尾與海報上看到的森林大火，還是片中反覆出現的

  馬匹，甚至是虛實難辨的機車騎士，要說他們意義不明也情有可原。



  森林大火或可解釋為，即便葛蕾絲從精神病院出院，但光是派對上一隻狼狗在庭院挖掘出

  他們過去寵物的骨骸，都能觸發她以前的記憶與情緒，讓葛蕾絲覺得自己就是一切問題的

  根源，因此決定離開婆婆，離開傑克森，離開所有關心她、愛她的人。除了狗之外，馬匹

  是片中最常出現的動物，不但有葛蕾絲抱著孩子到農場看馬的片段，甚至葛蕾絲與傑克森

  在車上激烈爭執，最後撞上一隻衝出圍欄、跑上道路的黑馬。這些馬匹或代表曾經自由奔

  放的葛蕾絲，生養小孩之後，便被眷養在禁錮裡，而兩人的爭吵也才會撞上衝出的馬，但

  即使如此，牠仍然毫髮無傷地在森林中獨自徘徊著。



  至於機車騎士則是葛蕾絲到底是否出軌的辯證，假使他只是想像中的人物，便是足以帶她

  逃離一切的救贖；如果騎士是真實存在的鄰居，那葛蕾絲的外遇究竟純粹是滿足生理需求

  ，還是一種對外求援？不管是導演刻意為之，還是由於我們無法確知葛蕾絲的精神狀態，

  這些象徵到底是想像還是真實不得而知，而這可能也是觀影後依舊未解的謎團。



  《去死吧，親愛的》主要聚焦在「產後憂鬱」，雖然成因主要是面臨產後身體修復與照顧

  嬰兒的責任，但伴侶提供的支持不足或許也是導致葛蕾絲情況惡化的原因。除了孩子剛出

  生，觀眾第一次看到葛蕾絲在草叢中如獵食者一般地匍匐時，傑克森正在逗弄孩子之外，

  一直到電影結束，傑克森僅有去接葛蕾絲出院時抱著孩子。無論工作多繁忙（何況葛蕾絲

  控訴傑克森一週只需工作三天），銀幕上呈現的就是他全然不負照顧嬰兒的責任，就連兩

  人關係還不算太糟時，全家三口出門，也必定是葛蕾絲繞車一圈到後座去跑起孩子。



  再加上傑克森帶回的小狗也變成葛蕾絲的責任，他甚至責罵對方把家裡弄得一團糟。事實

  上，就算葛蕾絲不是深陷產後憂鬱，要她自己一個人打點好一人、一狗，同時還要打掃家

  裡，的確不容易。更不用說傑克森對伴侶的性需求視而不見，甚至還拿這件事在吵架時說

  嘴。這一切的一切，都一步步地將葛蕾絲推向崩潰的深淵。



  看完《去死吧，親愛的》實在很難「喜歡」這部電影，因為導演從頭到尾都沒有想要討好

  觀眾。她不但讓我們「看見」葛蕾絲在這段關係裡的痛苦，更直接讓我們「身歷其境」。

  每一次嬰兒爆哭，觀眾都恨不得搶先主角一步將孩子抱起，而他們養的狗，更是非吠叫即

  哀鳴，無時無刻不在發出噪音，也讓部分網友直呼，葛蕾絲開槍轟掉小狗的瞬間，雖說觀

  影當下也有愧疚與震撼，但總是鬆一口氣。



  除了聽覺上使用難以忍受的音效逼迫觀眾，視覺上也以極為飽和的色彩創造出疲勞感，讓

  觀眾在整個觀影過程感官絲毫無法放鬆。最後，當然是珍妮佛‧勞倫斯瘋癲的演出給人的

  壓迫感。除了葛蕾絲各種自傷的行為之外，浴室裡刨抓壁紙的那場戲更讓人想起1892年的

  美國短篇文學《黃色壁紙（The Yellow Wallpaper）》，一名由於嚴重產後憂鬱而失去理

  智的女人，最終將囚禁自己房間內的黃色壁紙全數撕下來。巧合的是，故事中的女主角也

  被父權壓迫禁止寫作與閱讀。雖然傑克森並沒有禁止葛蕾絲寫作，但以她每天的生活與精

  神狀況，實在也無法繼續寫作，而葛蕾絲身為作家，家裡卻連一本書都沒有，相當諷刺。



  全片曾在葛蕾絲住院治療前就關心她的都是女人，最先發現葛蕾絲狀態不好的是婆婆Pam

  ，但她自己也身陷丈夫剛逝世的適應階段，並正經歷夢遊之苦。雖說Pam馬上提出能夠幫

  忙分擔照顧孩子的建議，但為時已晚。除了Pam之外，朋友聚會上的一名女子也注意到葛

  蕾絲的狀況，並與她分享自己當初生產完也是經歷低潮，不過之後就會好轉的。《去死吧

  ，親愛的》並沒有明確指出故事發生的時代背景，但「產後憂鬱」從未從Pam或其他女人

  嘴裡說出，但大家似乎都略知一二，畢竟這是十分常見的身心狀態。



  觀看《去死吧，親愛的》無法為你獲得欣賞其他電影一樣的娛樂效果，反而會一起陷入不

  良的情緒漩渦，但如果想朝聖珍妮佛‧勞倫斯無懈可擊的表演，它將會是不錯的選擇。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


