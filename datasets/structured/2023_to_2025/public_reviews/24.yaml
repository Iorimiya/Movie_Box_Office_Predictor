title: '[情報] 【去死吧，親愛的】預告'
content: '做女人哪天不想發瘋？珍妮佛勞倫斯 x 羅伯派汀森


  震撼演出《去死吧，親愛的》11月7日(五) 全台戲院與全美同步上映





  世上沒有瘋女人，只有被逼瘋的女人。


  獻給每一個飽受折磨的瘋女人，和飽受瘋女人折磨的你。





  坎城影展主競賽片！首映獲得9分鐘起立鼓掌

  《凱文怎麼了？》英國名導琳恩倫賽睽違8年作品

  《正常人》《惡女馬克白》編劇愛麗絲柏區打造瘋狂驚悚新作

  改編自國際布克獎提名同名暢銷小說《Die, My Love》

  珍妮佛勞倫斯 X 羅伯派汀森 首度大銀幕飆戲

  奧斯卡影后珍妮佛勞倫斯再創震撼演技巔峰





  劇情簡介：


  葛蕾絲（珍妮佛勞倫斯  飾）在生下孩子後與丈夫傑克森（羅伯派汀森  飾）搬回了傑克

  森的老家蒙大拿州生活，迷失於自我身分認同和精神崩潰的葛蕾絲，行為日漸脫序，她在

  徘徊於現實邊緣的同時努力保持理智，也愈加執著於對愛的追求…。







  --'
