url: https://www.ptt.cc/bbs/movie/M.1762562146.A.808.html
title: '[神好雷] 去死吧，親愛的'
content: "結論：Die my love直接衝擊了我前三喜歡的電影排行榜（星際效應/歡迎光臨布達佩斯大飯\n店/鬼店），下面心得可能影響觀影體驗\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n電影的主軸是一個年輕的媽媽從自由快活到產後憂鬱的過程，但除此之外也表現出了很多種\n不同的精神和狀態：焦慮世代、創傷後壓力症候群、失親、喪偶、夢遊、自我認同、失智症\n\
  等\n\nJennifer Lawrence飾演的Grace，看似從原本的不羈逐漸因為生下孩子後走向瘋狂，但我自\n己會覺得這一切無法自洽從她失去雙親後就開始了，從小失親、沒有被愛的能力，進而在面\n\
  對自己的小孩時，身為媽媽的責任心和不知如何給予正確的愛之間產生矛盾，最後才成爲了\n她時而酗酒、時而緊抱孩子的狀態\n\n我特別喜歡的一段是Grace的婆婆Pam問到她：你一天起床的步驟是怎麼開始的，這句話除了\n\
  關心，更多的是側面指出Grace已經失去了支撐生活的事物，瑜珈也好、晨跑和寫作也罷，G\nrace只是起床、感到焦慮地在過著新的一天\n\n除了琢磨台詞和劇情之間，Die\
  \ my love的畫面和音樂是我最喜歡的部分，從開頭最明顯的\n使用35毫米底片、1.33:1的畫幅進行拍攝，接近正方形的比例，強力要求觀影者完整接收到\n\
  所有畫面資訊；整部電影裡嬰兒哭聲、蒼蠅振翅、轟鳴、狗吠、雜音交錯，過激的搖滾樂和\n緩慢舒服的情歌來來回回，這些都讓觀影者的感官在緊繃和放鬆之間交錯，彷彿和Grace一\n\
  同感受焦躁、混亂和麻木\n\n電影的最後，Jackson邀請親友為出院的Grace舉辦了派對，賓客的狗將她槍殺後埋藏的狗骨\n頭再度挖出，她的精神已到了極限，Grace確立自己無法完全告別過往、無法安穩自立、無\n\
  法再與自己和解，於是轉身走入深林將自己焚盡\n\n（一些零碎的點）\n電影裡不斷出現的黑馬，非常明顯的是與機車騎士、黑人連結在一起的，不過我並不覺得Gr\nace有外遇，這對她來說只是逃離現狀的幻想，是一種精神上尋找出口的方式\n\
  \n我很喜歡電影的最後當Jackson想要追回瘋狂的Grace時，只有身後的Pam說了句：讓她一個\n人靜一靜吧，這是同樣作為母親、同樣失去至親、同樣深受精神困擾的她可以給的最好安慰\n\
  \n--\nSent from my iPhone 14 Pro\n\nPiTT \n\n--"
