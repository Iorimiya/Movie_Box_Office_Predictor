url: https://www.ptt.cc/bbs/movie/M.1762491395.A.53D.html
title: '[好雷]《去死吧，親愛的》，無以名狀的孤獨與悲'
content: '部落格版：


  實在不確定要如何評價《去死吧，親愛的》。感性的我很喜歡珍妮佛勞倫斯那讓人感到焦

  躁、歇斯底里、崩潰卻又讓人心碎的表演，我認為這是她最爲出色的一次演出。但理性的

  我又對電影不時感到煩躁，導演琳恩倫賽確實用著很有趣的敘事方式來呈現女性心理健康

  議題還有產後憂鬱問題，粗暴而又溫柔的刻畫著女性在面對身份轉換時的自我調適過程，

  試著學習接受卻仍然抗拒的無力，在獲得與失去之間不斷掙扎的痛苦都如此細膩且深刻。

  甚至我也很喜歡導演琳恩倫賽在虛幻與現實之間建構出了女主角格葛蕾絲的精神世界，她

  彷彿成為了一隻野獸，被豢養在遠離喧囂都市、僅剩靜謐的鄉間老屋裡，任由逐漸湧上的

  孤獨緩慢的侵蝕著她，她對傑克森與兒子的愛使她溫馴、令她眷戀，只得不斷地壓抑著內

  心對離開的嚮往，還有對曾經自己只是自己時的想念。


  然而即使如此，我還是對電影長達近兩小時這件事感到困惑。在這刻意的破碎敘事裡，是

  不斷反覆上演的相似情節，爭執、和解、爭執然後和解，出走、回來、出走然後回來，即

  便一次又一次的循環裡，能夠感受到葛蕾絲一次比一次憔悴、看到她一次比一次多的傷痕

  ，顯示出她的精神狀態明顯已是搖搖欲墜。只是當導演琳恩倫賽步步推著葛蕾絲走向懸崖

  邊緣的同時，似乎也在考驗著觀眾能否安穩的繼續坐在位子上。當然後來我會想，或許這

  股煩躁感是來自於這部電影本身其實就是「葛蕾絲的精神世界」，被關住的從來就不只有

  變成野獸的葛蕾絲，還有每個走進戲院的觀眾，我們都被關在了這裡，無能為力的看著她

  的世界逐漸瓦解，陪著她在不再擁有自己之前放火燒了一切，慾望與愛終究敗給了無以名

  狀的孤獨與悲傷，歉疚與解脫隨著熱風吹來...



  《去死吧，親愛的》如果能夠再短一點，我想我會給電影更高的分數。電影改編自阿根廷

  作家愛莉安娜哈維茨於2017年出版的同名小說，顯而易見的主題、關於產後憂鬱症。最初

  ，葛蕾絲是激情奔放、活力四射的，隨著男友傑克森搬來他叔叔身後留下的鄉間老屋，他

  有很多時間玩音樂，她有很多時間寫作，他們有很多時間能夠做愛，可直到她懷孕、直到

  兒子出生後，這些時間似乎不再被葛蕾絲擁有。隨著日子一天天的過，葛蕾絲情緒越來越

  不穩定，在頻繁的暴怒與歇斯底里過後，會陷入只有她自己明白的憂傷與憂鬱。傑克森不

  再與她做愛，面對稿紙也只剩什麼都沒有的悵然若失。與住附近的黑人鄰居偷情、點頭答

  應傑克森的求婚，或是開槍讓生病的狗解脫，這些看似脫序的行為是葛蕾絲想讓生活回到

  正軌的嘗試，無奈最後不論是她的生活還是她的心都沒有變好反而更糟糕。


  後來葛蕾絲被送去看了精神科。本來我在看電影的時候很排斥電影將葛蕾絲罹患產後憂鬱

  症這件事指向她兒時家庭的不健全，認為是曾經不好的經歷對她造成心理創傷，進而導致

  現在的結果。我會覺得這會給觀眾似乎有產後憂鬱症的女性都有內心創傷的錯誤認定，但

  回家上網查找相關資料後才發現，產後憂鬱症確實可能的原因有很多，其中就有源於心理

  的問題。不過我自己會想，葛蕾絲的問題更多應該歸咎於傑克森。許多資料都顯示，產後

  憂鬱症患者需要的不僅是藥物上的治療，更需要家人、尤其是伴侶的陪伴與支持，在葛蕾

  絲最需要被接住的時候，傑克森卻躲進工作裡逃避，他不想跟葛蕾絲做愛卻與餐廳女服務

  生發生關係，在葛蕾絲想要養隻貓的時候他竟帶了隻狗回來，更把照顧狗的責任一起丟給

  葛蕾絲，而在好幾次葛蕾絲陷入情緒不穩的時候，他不僅沒有與她站在一起面對，反而是

  斥責她行為上的脫序與丟臉，這樣子要葛蕾絲怎麼會好？



  如同最後那場大火燒毀了葛蕾絲的精神世界，電影中出現好幾次的黑馬我個人也覺得很有

  意思。那匹黑馬彷彿象徵著葛蕾絲內心渴望的追尋，牠既存在於現實也存在於虛幻，本該

  自由奔跑的牠與她一同被困在了這裡。當葛蕾黑馬，葛雷絲跟黑馬都似是曾經離開過，卻

  兜轉一圈再度回到這裡，又好像是從來無法離開的受困於此。當葛蕾絲走上前輕撫著黑馬

  ，那個瞬間是我覺得葛蕾絲對自己「終究還是努力過了」的覺悟，我不認為最後葛蕾絲痊

  癒絲與傑克森的關係似乎慢慢變好，下一刻卻猛地撞上了黑馬，讓兩人關係不僅再度降溫

  ，葛蕾絲亦拖著受傷的身體回到老屋。最後，在葛蕾絲總算向傑克森道別後，她走進林間

  看到了那匹被他們撞上倒地而又快速站起跑走的了，而是如釋重負般的坦然接受殘破不堪

  的自己被大火吞噬。


  《去死吧，親愛的》是需要時間去適應的，在習慣了電影的節奏與敘事風格後，一切變得

  是那麼的強烈，珍妮佛勞倫斯逐漸失控的詮釋拉扯著電影的張力與情緒，而羅伯派丁森與

  好久不見的西西史派克兩個人則是偶爾來一些刺激她的催化劑，挑動著她早在緊繃邊緣的

  神經。導演琳恩倫賽不給觀眾只看見只有好的那面，而是讓觀眾如臨其境般的感受到旁人

  從來都無法體會到的痛苦與掙扎，並且意識到她們最後的選擇是多麼的不容易，那些旁人

  口中的「妳還好嗎？」更像是如針般的諷刺。《去死吧，親愛的》不走常見的路線，沒有

  誰接住了誰或者誰被誰給接住，而是讓觀眾看見了一個不斷撕扯著自己直至滿身傷痕、堅

  強同時卻也脆弱，在真正失去自己之前選擇擁抱自己的女性。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


