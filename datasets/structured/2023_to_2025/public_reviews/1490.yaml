title: '[新聞] 暑假首選親子動畫《雪后奇緣》角色草圖「'
content: '暑假首選親子動畫《雪后奇緣》角色草圖「數以百計」全球票房一億美元


  2023-08-18 12:55

  聯合報 編譯張佑生╱即時報導




  改編自安徒生童話故事動畫電影《雪后奇緣》，是該系列的第五部，今天（18日）起在全

  球上映。片中的新角色艾拉，個性天真無邪，因充滿好奇而「做錯事」將監禁數百年的冰

  雪妖魔釋放出來擾亂人類世界，艾拉她並沒有逃避，反而「勇敢面對」自己的過錯，並攜

  手鎮民裡的小小勇士們「團結一致」解救兩個世界。《雪后奇緣》是今年暑假最寓教於樂

  的必看親子動畫，試映後也受到相當多觀眾盛讚「動畫非常精緻」「打鬥場面好刺激」

  ！


  《雪后奇緣》的編劇兼藝術總監艾力克斯札米斯洛夫（Aleksey Zamyslov）對於片中每個

  角色都是「精雕細琢」，為了製作出高質量的動畫影像，翻閱數千兆的視覺資料，每個角

  色都「數以百計」的草圖，從髮型到髮色，從鞋尖到外套的流蘇，編劇甚至開玩笑地說：

  「如果你的衣櫥是每天都要花上半小時來選擇穿搭，那片中角色的衣櫥是沒有底限的，要

  多少衣服就有多少衣服！」而角色設計中有個亮點就是「眼睛大」，除了讓角色更甜美、

  更可愛、更漂亮，也讓此系列電影成功在全球上映，並且票房超過一億美元，是Wizart

  Animation工作室創作的最成功的動畫系列。


  電影描述在鏡之國的一座冰雪城堡中，冰雪女王警告女兒艾拉神祕封印下的厚厚冰層內，

  住著邪惡的冰雪妖魔們。三名可愛的山精旅行家意外來到冰雪城堡探險，鮮少有朋友的艾

  拉看到他們非常開心，忘情地決定帶他們到神祕封印遊覽，卻意外打開了封印，釋放出的

  邪惡冰雪妖魔們不僅擾亂鏡之國，甚至人類世界。冰雪女王要求艾拉和山精們一起前往人

  類世界尋找冒險家凱和格爾達，只有他們能幫助對付冰雪妖魔。凱和格爾達住在一個舒適

  安靜的小鎮，發現突然間小鎮上的人們都被凍結。找到凱和格爾達的艾拉一行人，出發尋

  找擊敗精靈們的方法。


  一路上遇到了許多冒險，最後意外拯救了仙女艾麗達後獲贈了魔法靈丹。大家回到鏡之國

  合力對付這些冰雪妖魔們，並且使用靈丹的力量，艾拉、女王和大家並肩作戰，究竟他們

  能否擊敗這些來自北方的冰雪妖魔，解除鏡之國和人類世界的危機呢？《雪后奇緣》將於

  8月18日（今日）中、英文同步上映。電影上映期間至戲院觀看，可獲得超萌【電影造型

  貼紙】兩款隨機贈送詳情請洽各影城。



  新聞網址：



  --'
