title: '[無雷] 子供向的變身少女露比'
content: '優點：


  翻譯優秀，這部片很活潑，很多美式校園東西，但翻得很貼切，沒有出現一些自嗨的東西，像我的老天鵝，原子少年等


  海怪在海中游泳衝刺的片段做得非常棒，海底很多奇幻場景，讓人很感動


  美人魚族在預告片裡就有強調他們是大壞蛋，卻一副白皙紅髮直男超愛的模樣。「可是人類愛美人魚耶」，「那是他們白癡」，跟小美人魚完全相反，滿有意思




  缺點：


  劇情太單調又好猜，估計是為了讓小朋友方便看懂


  人物扁平，為推進而推進，很多配角都很尷尬刻意不好笑，直接刪除比較好，但感覺孩童會覺得很好玩



  評分：6.3/10，帶小朋友看不錯，大人就免了，但還是比小美人魚好看很多











  -----

  Sent from JPTT on my Google Pixel 6a.


  --'
