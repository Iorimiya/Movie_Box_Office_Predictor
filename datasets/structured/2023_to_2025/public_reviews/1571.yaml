url: https://www.ptt.cc/bbs/movie/M.1685628002.A.46C.html
title: '[新聞]美人魚變反派？夢工廠《變身少女露比》動畫'
content: '美人魚變反派？夢工廠《變身少女露比》動畫電影4大看點：

  金獎陣容詮釋邊緣少女成長之路，新生代演員李沐獻聲中文版！


  01 Jun 2023 | by Yui


  不讓迪士尼、皮克斯專美於前，夢工廠在今年暑假檔也有新作品了！即將於6月30日上映

  的動畫電影《變身少女露比》結合校園、海怪、動作等元素，打造一部搞笑又溫馨的動作

  喜劇，並請來奧斯卡影后珍芳達、《古魯家族》科克德密科等加入配音陣容。


  1.邊緣少女成長之路




  《變身少女露比》敘述善良體貼、性格彆扭的16歲少女露比很想要融入高中的生活，但她

  卻偏偏是個邊緣少女，雖然正在幫暗戀的男生補習數學，但他卻只是佩服自己功課好而已

  。但露比就與所有少年漫畫的主角一樣，有天發現自己是海怪女王戰士的直系後代，而且

  天生注定就要繼承王位，讓她的人生從此大轉彎。


  2.美人魚變反派




  露比一族的使命，就是要與虛榮浮誇、渴望權力的美人魚一族對抗。不過學校新來的轉學

  生雀兒喜不但又漂亮又受歡迎，還剛好是一隻美人魚。如果露比想要保護她最愛的人，就

  必須勇敢接受她真正的身分。導演導演科克德密科說：「身為電影製作人，我在說故事的

  時候很喜歡顛覆傳統，所以這個故事去翻轉神話中的海怪和美人魚。」當海怪成了英雄、

  美人魚成了反派，會是怎樣的故事呢？


  3.金獎陣容




  本片的編導演員陣容也是相當精彩，由導曾獲金獎提名的《古魯家族》導演科克德密科執

  導，主要配音陣容有為主角獻聲的有《愛的過去進行式》系列拉娜康多、《無敵破壞王2

  》賈布克楊懷特、奧斯卡獎提名東妮克莉蒂、奧斯卡影后珍芳達、艾美獎得主安妮墨菲等

  。


  4.李沐獻聲夢工廠動畫




  這次中文版特別邀請到新生代演員李沐，首度挑戰好萊塢動畫配音，原本就很想嘗試配音

  的她，這次終於圓夢。李沐表示，在動畫的世界裡，聲音的演出可以用很誇張的方式去呈

  現，而自認講話速度已經超快的她，竟然還是比不上海怪公主露比，讓她在錄音室一直不

  停的追趕語速，不過最難的還是中文要跟上英文的口形和節奏，嘴形要完全對上觀眾才會

  真實感受到是角色在說話。


  source：環球影業


  Bella



  --'
