title: '[情報] 夢工廠動畫《變身少女露比》'
content: '美人魚 VS 海怪 誰才是英雄？夢工廠動畫《變身少女露比》首支預告釋出


  （GNN 記者 阿Lu 報導） 2023-03-17 10:48:38


  夢工廠動畫將於今年夏天推出一部既搞笑又暖心的動作喜劇動畫片，以海洋住民們作為主

  角的《變身少女露比（Ruby Gillman, Teenage Kraken）》今日公開了首支預告宣傳影片

  。




  《變身少女露比》故事發生在少女之間明爭暗鬥、波濤洶湧的高中校園，主人翁是一個靦

  腆害羞的少女，有一天她發現自己竟然擁有傳奇神話中的海怪皇室血統，而且她在海底深

  處的宿命，遠遠比她想像的更宏偉。善良體貼、性格彆扭的 16 歲少女露比吉爾曼（拉娜

  康多配音）很想要融入海岸高中的生活，但是她卻總是覺得其他同學都把她當成隱形人視

  而不見。


  她正在替她暗戀的滑板少年（賈布克楊懷特配音）補習數學，但是他似乎只是佩服她的功

  課很好，而且她那護女心切的虎媽（東妮克莉蒂配音）不但禁止她和學校的酷同學一起去

  海灘玩，甚至還嚴格規定她永遠都不准下水游泳。但是當她違反了她媽媽的頭號禁忌，露

  比將會發現她是海怪女王戰士的直系後代，而且天生注定就要繼承她霸氣十足的外婆（珍

  芳達配音），也就是七海女王戰士的王位。


  海怪一族發誓要捍衛這個世界和所有的海洋，而且從古到今都一直在對抗虛榮浮誇、渴望

  權力的美人魚一族。但是露比卻遇到一個既嚴重又迫切的問題：學校新來的轉學生雀兒喜

  （安妮墨菲配音）不但長得漂亮又受歡迎，又剛好是一隻美人魚。如果露比想要保護她最

  愛的人，就必須勇敢接受她真正的身分，而且要大大地茁壯成長。




  除了上述參演演員之外，科爾曼多明哥將為全心全意支持露比的爸爸配音；山姆理查森為

  露比古道熱腸的叔叔配音；以及布魯查普曼為露比酷勁十足的小弟弟配音。還有威爾佛提

  、妮可拜爾、萊莎寇希、蕾夢娜楊、艾德華度法蘭科以及艾克科倫。


  這部全新動作喜劇動畫片的導演是曾獲奧斯卡獎提名的柯克狄米科（《維沃的精彩生活》

  、《古魯家族》），製片是凱莉庫妮席勒拉（《魔髮精靈唱遊世界》、《魔髮精靈》），

  共同導演則是法倫珀爾（《古魯家族：新石代》、《魔髮精靈唱遊世界》）。


  動畫電影《變身少女露比》預計今年 6 月 30 日在美國上映，台灣也預計將在暑期上檔

  。


  --'
