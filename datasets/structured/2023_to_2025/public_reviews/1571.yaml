url: https://www.ptt.cc/bbs/movie/M.1688201886.A.9EA.html
title: '[  雷] 變身少女露比'
content: '雷文防雷資訊頁


  今天去看了這部，原本是想看元素方城市結果時間對不上，就選了這部，想說比較看看類似

  小美人魚的題材，這幾年動畫真的進步很多，這部的美術、動畫我也覺得滿讚的。

  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  故事我覺得有點薄弱，故事是在描述一個小城，媽媽帶小孩定居，海怪偽裝成人類生活。

  它很注重在描述 普通、特別。青少年中的格格不入或是想辦法融入群體。

  我有感受到他們想藉著海怪的女主來延伸一些事情、講一些故事。

  這個像是說 原本很特別的人，怕被大家異樣眼光注視，而隱藏自己，想辦法融入群體生活。


  對自己不自信，到後面接納自己、以自己的特別為傲。

  這點很棒，因為那就是很多族群啊，或很多人長大的時候會面對到的課題，青少年也很容易

  面對這種煩惱。

  然後重塑小美人魚這個故事也很創新的題材，對標前陣子的黑美人魚。我覺得黑美人魚可能

  wrong的地方在於，我們小時候看到的童書到迪士尼，都是白人系的美人魚，所以突然出來一

  個黑人美人魚，那就是顛覆的過往的傳統、記憶、回憶等。會讓人覺得硬要。


  例如這5年左右好萊塢電影、影集也一直在注入不同膚色的情侶搭配，但那樣會給人有點突兀

  ，因為一直在打破既定印象。不過我覺得動畫是蠻適合打破框架的載體，例如阿凡達水之道

  ，也是在描述不同族群融合。那小美人魚真人版我覺得是出在上文提到的真人的種族融合、

  膚色融合會不會給人很硬要，洗掉小時候記憶的感覺（類似麥克雞塊就是要糖醋醬，但突然

  改成標配番茄醬，會令大眾很抗拒）

  這部反轉，變成海妖為主角，小美人魚是反派，還蠻新鮮的，但琢磨很少、節奏頗趕。主軸

  還是放在青少年的探索自我那樣，有點可惜。不過是好作品，看板上沒什麼心得文先來給大

  家意見。

  最後我蠻喜歡小美人魚變身的頭髮，白色的波浪效果很讚。

  ----

  Sent from  on my iPhone 11


  --'
