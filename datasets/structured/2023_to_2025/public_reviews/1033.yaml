url: https://www.ptt.cc/bbs/movie/M.1709828080.A.E67.html
title: '[新聞] 馬東石《犯罪都市4》上映日確定！'
content: '新聞網址：


  原標題:



  記者黃庠棻／綜合報導



  馬東石宇宙回歸！南韓巨星馬東石打造犯罪電影《犯罪都市》即將帶著第四集回到大銀幕

  ，該片曾入圍第74屆柏林影展特別展映單元，並已在當地的2月23日舉辦首映；近日根據

  各大韓媒報導，，同時也公開這一次反派的劇

  照，引起大批熱血影迷關注。



  《犯罪都市》從第一集開始，馬東石就參與了主演與監製，2017年首集上映後就引起熱潮

  ，在南韓吸引了將近700萬人次觀看，開出紅盤之後陸續在2022年與2023年推出第二集與

  第三集，近期也已確認了第4集將在2024年的4月24日上映，除了正義的警察馬東石之外，

  每一集的反派也都是網友關注的焦點，從尹啟相、孫錫久到李浚赫，




  《犯罪都市4》劇組早在2月就前往柏林影展，當時除了飾演警察的馬東石之外，這一次的

  反派金武烈與李東輝也有出席，當時一行人皆穿著一襲黑色西裝亮相，吸引了大批媒體的

  目光。沒想到，近日電影公司公開了該片的劇照，反派金武烈穿著一件白色襯衫，露出壯

  碩又結實的身型，讓不少網友驚呼「無條件要看」、「這就是我想像中的反派」、「練得

  好壯啊」等。







  此外，

  。而《犯罪都市

  4》在柏林影展首映後，也獲得了極高評價，不少外媒都大讚「是最刺激的娛樂動作片」

  、「幽默程度比之前更強」等，更引起影迷高度期待。



  --'
