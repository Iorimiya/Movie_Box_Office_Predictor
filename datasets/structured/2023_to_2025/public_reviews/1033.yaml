title: '[ 好雷] 犯罪都市4 -- 精彩依舊'
content: '這次的宣傳 一直說是全系列最高峰


  但我覺得這集只比第三集好 有點失望

  回歸到有點像第一集辦案的感覺

  但是又有第二集開始的那種笑點


  這次打鬥的方式明顯有不一樣

  馬叔的速度更快了

  但是威力誇張的表現招式也略有減少

  走比較寫實的風格


  搞笑的部分

  這集的同事還是3的

  個人覺得還是1.2集的同事比較搞笑

  4的搞笑大多在張夷帥

  他這次的戲份非常多


  還有網路組的女警真的很正

  李主儐短髮加上不走濃豔系的妝

  反而更好看

  金武烈已經看過他詮釋過太多不同角色

  這次的設定就是冷酷兇殘的傭兵殺手

  感覺沒什麼特別發揮 中規中矩











  -------------雷---------------------------------


  這次的反派就是線上賭場的

  已經在別的影劇上看過太多了

  較缺乏新鮮感

  李東輝這次的高智商反派

  真的哪裡看不出來是聰明 還是it天才

  就是一個勁的傻笑

  感覺挺無趣的一個角色

  想黑吃黑最後被解決


  反派這次是傭兵殺手級別的

  打鬥方式都是用小刀速度快的類型

  一言不和就捅人 屬於殘酷冷靜


  另一個比較弱的會拳擊 戲份強度還ok

  至少都和馬東錫對了很多拳

  不會像3的boss 出場感覺很強

  結果這麼簡單就結束


  個人覺得這集雖然綜合了前面的優點

  但是少了一點激情

  暴揍壞人少了大快人心的感覺

  或許是辦案過程比較平鋪直敘

  少了一些曲折反轉吧

  不過喜歡這系列的  還是很推


  --

  我覺得這集爽度還是差了一些  個人還是最喜歡2'
