url: https://www.ptt.cc/bbs/movie/M.1715931904.A.04E.html
title: '[好雷] 犯罪都市4'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  也沒什麼劇情可以雷的

  一開始正反派就直接告訴你是誰了

  反正就是爽片


  我沒看過前三集

  但這似乎是獨立的故事

  所以可以直接去看


  前陣子也看過一部類似的韓國電影

  那部是綁架韓國人到青島做電話詐騙

  這部是綁架韓國工程師到菲律賓操作線上賭場


  那部就比較誇張一點，一群大媽能找到主謀繩之以法

  應該沒那麼容易吧XD


  這部是黑吃黑內鬥自爆

  加上警方介入才順利偵破

  比較神奇的地方大概是最後他們自己也設立了一個線上賭場

  引誘對方來破壞並抓捕

  怎麼可能網站一設好就能吸引到大量用戶來引起對手注意XD

  還是對方只要查到有競爭對手

  不管規模多小都直接破壞



  然後反派白昌基很帥

  打鬥動作看起來真的很強

  光看身體和刀子就能跟更高層的勢力分庭抗禮


  但那個IT天才也是傻傻的

  如果他沒有更強的勢力撐腰或是請很強的保鑣

  知道白這麼狠還會不守承諾多分點錢給他喔

  那個權老闆跟他的利害關係也沒那麼密不可分

  看到白的戰鬥能力馬上就改跟他合作了



  女主角很美

  不過大部分就是講講話

  雖然在劇情上有重要的幫助

  但以觀眾視角會覺得戲份不算太多太關鍵XD




  --'
