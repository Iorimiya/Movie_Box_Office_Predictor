title: '[ 好雷]  犯罪都市4 大眾娛樂化'
content: '第四集的好看度比較偏大眾娛樂化

  打鬥畫面還是不少 但血腥的部分幾乎已經用錯位或景深、快速帶過

  感覺越熱賣觀眾越多要想再回到第一集那種尺度已經不太可能（我這場都看到好幾個爸媽

  帶小朋友進場）

  各種笑點堆疊滿整部片，整場相當歡樂。

  _

  重點的反派部分好像不再能回到第一集張謙那種尺度無下限的狠勁，雖然比上ㄧ集好，但

  總覺得還是少了什麼。而且面對馬東石還是有點太弱化傭兵的戰鬥能力。

  _

  這系列該有的公式元素：張夷帥、勒索黑幫、真實的房間、求局長再多給時間辦案ㄧ樣不

  少。


  整體還是很喜歡，不過馬東石怎麼越來大隻了


  --'
