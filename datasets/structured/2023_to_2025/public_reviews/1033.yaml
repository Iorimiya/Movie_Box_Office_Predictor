url: https://www.ptt.cc/bbs/movie/M.1714369106.A.173.html
title: '[好雷] 犯罪都市4'
content: "1. 這次馬石道對上的是國際詐騙集團\n   不僅用假工作騙理工人才去菲律賓, 還囚禁他們當作豬仔來當奴工\n   更令人徹底沒想到的是,\n\
  \   詐騙集團首腦竟然是有IT天才之稱的長髮斯文敗類!\n\n2. 一直延續的丑角張夷帥戲份大幅上升!\n\n3. 就劇情上我覺得比第三集好很多,\n   不過整體還是喜歡第二集爽一點\n\
  \   第二集反派很野又精明, 不停有辦法逃掉的樣子比較厲害\n   這集的打仔反派一直是一號表情, 想擺出冷酷沈著的樣子\n   帥是很帥啦, 就少了點戲味\n\
  \   還是沒有第二集的姜海尚表現出色\n\n4. 打戲也是比二不足比三有餘\n   第二集的巴士戰, 馬石道跟反派打是大概6比4\n   這集頭等艙之役, 馬一挑二還是明顯碾壓\n\
  \   真應驗了他那句 \"沒拿刀就跩不起來了吧\"\n   而且比起二的最後一招重拳著擋風玻璃\n   這次的最後大招碎頭腳, 我倒挺想看到壞人頭真的有被壓爆的畫面\n\
  \   這個力道跟重量, 頭跟脖子還是完好如初實在太普遍級\n\n5. 這系列的套路也是越來越難改, 從1到4\n   反派打仔一定有幾個武藝高強的跟班\n \
  \  反派打仔一定要跟其他反派黑吃黑來凸顯反派跟跟班們的厲害\n   還有很直線的辦案過程, 線人線索們都會乖乖到手\n   這系列要開創新局的話還是要努力想新橋段\n\
  \   期待第五集的大拳回歸!\n\n\n--\n幹他被菲律賓人當同鄉真的笑死"
