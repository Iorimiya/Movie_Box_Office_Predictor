url: https://www.ptt.cc/bbs/movie/M.1713976676.A.45B.html
title: '[好微雷] 犯罪都市4-韓國玩命關頭了XD'
content: '今天看特映 真的還蠻好看的~

  不要說本來就已經變成韓國的玩命關頭或John Wick

  (真的有組建出馬叔Family的輪廓了... 小弟們這集武力還變強了)

  看新聞馬叔已經在寫7~8集的劇本 但人家還真的認真在寫劇本


  以下可能有一些微微雷 但盡可能不影響大家觀影體驗
























  大家最在乎的應該還是打戲吧~ 如果是想看從頭打到尾的人可能會有點失望

  但問題以第三集來說 我反而覺得打太多殺太多變得為打而打

  這集更高比例放在劇情架構本身 還有笑點XDDDDDDDDDD(張夷帥太好笑了)


  打鬥本身雖然比較少 但這次的大反派根本是小刀幫幫主

  幾乎全場用小刀 這部份還蠻帥的 而且算是這四部以來最冷血的殺手壞蛋

  金武烈真的詮釋出了一個不把人當人看的反社會份子


  然後我蠻推劇情的... 這次格局應該是四集最大 而且看得出來是有些東西想講


  這集把現代數位犯罪 app販毒 線上博奕 洗錢 類似柬埔寨的詐騙擄人打工

  (只是電影裡變碼農) 全部這些勾當集結在一起 變成了一個跨國大型犯罪

  (最後片尾有說好像是呼應2018年一網打盡100多人犯罪集團的事情)

  其實看的時候是有點沉重的... 因為他很多地方清楚描述這些黑道與智慧犯細節

  太寫實了... 你真的會有種現在社會就是這樣犯罪組織吃香喝辣橫行的無奈感


  當然 還是有些可以挑剔之處啦

  -這系列沒有一集沒出現的bug:為了製造反派武鬥超強

  黑吃黑對手永遠人多勢眾 但永遠很講武德不帶槍然後被殺爆XDDDDDD

  -小反派科技公司老闆最後的結局為了推動劇情 實在有點降智降太兇

  -馬叔解決國外危機後突然就跑去堵科技公司老闆 這邊的關連性寫的不夠有說服力

  -雖然前面反派很強 但是系列固定有的拼拳 馬叔真的光物理寬度就覺得會贏喔

  就算後面給回武器 算是四集以來最終魔王讓馬叔最多傷的一個


  但好像還是會讓觀眾覺得不夠打Orz 雖然比第三集好

  可多少還是會有種我還看不夠啊啊啊的感覺


  不過這些都瑕不掩瑜啦

  劇情 笑點 加上馬叔的重拳連發 這已經是很夠娛樂價值的爽片了


  就希望後面幾集 還是真的有能讓觀眾覺得跟馬叔更勢均力敵的反派

  這方面大家只會胃口越養越大而已(但馬叔也真的越老啦 這集明顯有醫美了哈哈)


  --'
