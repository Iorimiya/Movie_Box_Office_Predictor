url: https://www.ptt.cc/bbs/movie/M.1714109392.A.CEC.html
title: '[ 好雷] 犯罪都市4，超好看'
content: '1234集都看過


  我覺得4=1＞2＞＞＞＞3



  1經典，但是笑點少，雖然最後痛毆壞人很爽，但前面其實蠻沉重的



  第4集內容一開始是一個韓國高材生變成豬仔被監禁在菲律賓，幫忙博弈集團弄程式，後

  來逃出來，卻被金武烈扮演的大反派殺了。



  這一整集都在講述網路賭博犯罪，甚至非法虛擬貨幣割韭菜都有提到


  整個很有現代感


  不像前2集都拿智障手機，這集開始用智慧型手機了


  然後這集笑點非常多，我是看最早場，雖然人數不多，但笑點大家都笑很開心，特別是張

  夷帥出場的地方，處處是笑點



  然後打鬥場面其實很多，不論是壞人打壞人，或是馬東石痛毆壞人


  看了真的非常爽！！


  馬東石在裡面也展現鐵漢柔情一面，因為答應被害者母親（後來自殺）一定要揪出兇手，

  還去跟廳長下跪請求一定要讓他們繼續查下去



  最後的最後，打大boss完全致敬第一集，是在仁川機場開幹，只是不同於機場廁所，這次

  是在頭等艙，金武烈也致敬第一集問馬東石：你一個人嗎？



  當然打完機場座艙長也是下來找長官賠償，都滿滿致敬


  總之，真的很好看


  我覺得不輸第一集，感覺韓國那邊因為口碑和原本就有的鐵粉，一定會賣翻


  推薦大家去看看，真的讚


  --'
