url: https://www.ptt.cc/bbs/movie/M.1696099218.A.44A.html
title: '[普雷] 《榮耀之路》沒有和解卻越發想念'
content: '兄弟之間，我與弟弟最後的記憶在台北


  近幾年台灣因為中美之間的角力被國際頻頻報導，又因防疫的高水準登上世界版面，可以

  說是好久不見的高光時刻。許多久居台灣的外國人也透過各種方式與自己家鄉的人介紹台

  灣，除了社群平台發文、拍攝自媒體影片外，電影等娛樂媒體也是讓他國人最快見到台灣

  民俗風景的一環。


  《榮耀之路》是一部台法合資製作的電影，故事敘述工作中的伊斯梅爾接到一通家中電話

  ，弟弟埃沙在軍校迎新中離世，在眾人因為法國部隊處理後事的意見不合的情況下，失去

  弟弟的伊斯梅爾想起一些跟弟弟的過往，例如他們從阿拉伯移民法國的兒時記憶、父母失

  敗的婚姻、還有弟弟前往台灣留學時，他與弟弟在台留下的回憶和遺憾。









  《榮耀之路》是什麼電影：


  台灣有著眾多複雜的族群，不管是最早的台灣原住民，或是早期渡海來台的本省人或當年

  因台海戰爭滯台的外省人，甚至在後期為了打工和結婚生子落腳台灣的東南亞移工與陸配

  等，都讓台灣這片土地多了不同的文化色彩。其中不少世界各地的人士也生活在台灣，不

  管經歷好事或壞事，但這些故事依舊不屬於別的地方，而是台灣故事。


  雖然台灣故事往往讓人想到台語或是客語文化，還有高山原住民的種種，甚至是離島之外

  金馬澎湖、蘭嶼等故事，但如今移工和各種在台灣生活的人群也開始自己或透過他人說出

  自己在台灣的故事。


  無倫如何都讓我們更了解不同人眼中對台灣的看法，或是他們短暫停留於台的印象，這些

  對於島嶼的曾經都是可貴的。










  《榮耀之路》是一部較為特殊牽絆台法兩地之間的故事，從阿拉伯國家移民到法國的伊斯

  梅爾接到了弟弟死訊，在軍校迎新時因為高年級的霸凌而讓他的弟弟埃沙死於意外之中。

  軍方想要息事寧人的態度讓伊斯梅爾大為不滿，一度爆發衝突。


  但弟弟的死去無法更改，這讓伊斯梅爾在家服喪這段時間，想起自己與弟弟小時候到大的

  種種，包含他這個優等生的弟弟、和從小就不被家人看好的他。


  伊斯梅爾想起弟弟埃沙在過去成有一段時間於一個亞洲小國台灣留學，法國到台灣的機票

  昂貴，但伊斯梅爾還是搭機前往探望弟弟，卻是熱臉貼冷屁股。不太流露情緒的弟弟埃沙

  ，和到處惹麻煩的哥哥伊斯梅爾，造訪台灣各處不同的景點與文化，雖然不是事事美好，

  但也是伊斯梅爾僅存對弟弟的最後丁點記憶。也在此時伊斯梅爾一點一滴的在他們兄弟之

  間做出了妥協。











  《榮耀之路》分析與延伸：


  電影《榮耀之路》講述了許多複雜的故事背景，從來台交換學生到法國移民故事。關於《

  榮耀之路》中伊斯梅爾家人從阿拉伯遷籍到法國定居的其實不在少數，根據統計阿拉伯裔

  法國人是法國第二大族群，雖然在法國種族數據統計是被視為種族主義的一種，是明訂禁

  止的，但是因為族群龐大還是有第三方調查出數據。


  同時他們也是法國當地最大宗的穆斯林信仰群體。多數的阿拉伯人是在70年代舉家遷入法

  國，通常都是居住在工業重鎮。但更遠在拿破崙時期，法國就已經跟敘利亞、埃及等國家

  接觸。


  如今法國的六千六百萬人口中有一成為新住民，這也使各種文化在法國激烈碰撞，而延伸

  的種族問題，例如在2022年就曾經發生法國右翼黨派禁止提案在體育賽事中禁止選手穿戴

  有「顯眼的宗教符號」的服裝飾品，被指出是特別針對穆斯林信仰者為多數的阿拉伯法裔

  。不過這個問題從過去歷史上就不斷的被提及，例如法國非裔群體就也經歷過殖民文化，

  像是北非許多人就會說流利的法語，甚至法國外籍傭兵團也在世界相當有知名度，台灣也

  有不少人加入此行列。






  《榮耀之路》講述關於法國新住民的種族問題，但更多的是講到如台灣軍旅文化一般，法

  國不合理、僵化的軍中生態，這些故事都來源於導演哈希德阿米本人的記憶，這部片也是

  為了紀念他的家人。


  對於出生阿爾及利亞的導演，從小時候離開到現在出生國家依舊是戰亂不斷，故無法自故

  鄉取景，反而在台灣留學的故事跟台灣製片配合，順利的拍攝出短暫在台的種種回憶，還

  原當時導演來台灣探望弟弟的各種兄弟相處的時光片刻。


  雖然電影中較多重要的是關於伊斯梅爾家人與法國軍方的對峙，和他們因為移民法國阿拉

  伯裔身分，有著比較偏批判性的電影主題，包含每個人對於弟弟的死去不同的看法，和家

  庭間複雜難解的親情故事。在這之中台灣其實只是一個小片段，但卻也是在電影中兄弟兩

  人相當重要的一段時光，也是成人後漸行漸遠的兩人難得再次陪伴彼此的時光，配合台灣

  場景而整體變得非常魔幻。










  《榮耀之路》值得一看嗎？


  如果只是單純因為電影中講到台灣而去觀看此片，我想這部片拍到台灣也算是有宣傳效果

  了。總而言之裡面並不全然以台灣為背景，而是根據導演的記憶拍攝出阿拉伯、法國、台

  灣三地的兄弟與家人之間的故事。而台灣雖然佔比不多但卻是《榮耀之路》電影中哥哥伊

  斯梅爾與弟弟埃沙成年後相處寶貴的回憶，也是本片很重要講解兄弟之情的重點戲。


  自己看下來認為《榮耀之路》雖然重點在於弟弟軍中的死，一個移民家庭對法國軍方的不

  滿，但更多是生為一位不成材的伊斯梅爾從小與優秀的弟弟埃沙不斷被家人拿來比較，甚

  至哥哥伊斯梅爾也透過每個親人話中理解弟弟與自身的差距，這也是他已經認同的事實。


  但在內心深處，伊斯梅爾有著過不去的坎，不管是對於他是哥哥這點，或是弟弟不斷的執

  著過去這點，還是家人對他跟弟弟持不同看法，會讓一些有著兄弟姊妹家庭的人有帶入感

  。









  《榮耀之路》我覺得有意思的地方是雖然講述兄弟之間的摩擦，但卻不是以通俗的兄弟和

  解作為故事核心，許多描繪這類型故事的電影往往會以一家人因為碰撞更了解彼此進而理

  解共同成長。


  但現實中我們都知道往往不是那麼簡單，不管今天是你的父母還是兄弟姊妹，我們對這些

  家人有愛有恨，同時也包含羨慕與忌妒。《榮耀之路》中並沒有給予通俗的和解答案，而

  是另一種兄弟之情。


  對於家庭裡擁有兄弟姊妹的其實是一件複雜的事情，尤其在年齡相仿的家人之中，被拿來

  作比較更是稀鬆平常之事，《榮耀之路》中透過哥哥伊斯梅爾眼中的弟弟埃沙，讓觀眾了

  解到他一個哥哥對於既愛又恨的弟弟一個複雜的情感，但當事實擺在眼前時，一切回憶不

  管好壞湧上心頭時，弟弟的事情也許變成心理重要的一部分，這是不分他們兄弟誰好誰壞

  ，而是一直以來他們對彼此複雜的情感交織，終將因為一場意外而回憶更多。




  --

