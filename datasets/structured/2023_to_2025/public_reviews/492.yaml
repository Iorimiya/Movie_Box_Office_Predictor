title: '[好雷] 《平行青春的我們》觀後筆記'
content: "電影 《平行青春的我們》推薦\n越是模糊不清，越是危險萬分。\n\n1. 很喜歡這部的光影設計！\n2. 阿東是小安和阿珍用來確認彼此心意的鏡子。感情中這樣的角度很殘忍，但現實就是\n\
  如此。青春懵懂的感情探索，常比想像中無情（點一首林宥嘉的＜伯樂＞\n3. 阿珍將安東戀公諸於世，有恐怖情人的潛力。只有這樣單純的少女，才能展演出最純\n粹的佔有與忌妒。\n\
  4. 看這部一直想到楊乃文的＜離心力＞\n\n欲言又止 也很快樂\n我只是你 眼前星塵\n你不明白 這裡\n危險萬分\n-\nIG：Fishpond_like\
