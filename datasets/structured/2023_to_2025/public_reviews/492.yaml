title: '[好雷] 平行青春的我們'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  除了鬼片之外，泰國也出產非常多青春純愛電影，近幾年，也越來越多以GL為主軸的作品

  ，像是去年的現象級電影《跳越時空的愛戀》。不過，相較於《跳越時空的愛戀》裡堅定

  的愛情，《平行青春的我們》存在著更多對於性向與愛的探索。



  小貞和小安是住在同一棟警察公寓的警察子女，宿舍裏有幾百名警察家庭居住。直到有一

  天，他們的關係開始面臨考驗，迫使小貞和小安開始思考愛、成長和成年的意義。



  從電影一開始，觀眾就不斷被灌輸「小安家有困難」這件事。從經常欠小貞媽媽錢，到無

  止境的燙衣、洗衣，明明大家住在同一個社區，卻有著截然不同的社經地位。小安家的困

  境一部份可能來自其父親殉職，家裡失去主要經濟來源所致，但可憐之人必有可恨之處，

  隊長的通融、小貞媽媽的幫忙與小安的省吃儉用，尚且能讓她們一家在警察公寓安身立命

  ，但小安媽媽對女兒的情緒勒索與其好賭成性的惡習才是壓垮這一切的關鍵。



  但是，小貞與小安並不是為了呈現階級對立而存在的兩個角色，而是呈現出「家家有本難

  念的經」。小貞看似衣食無虞，要什麼有什麼，甚至電影前段講到小貞的局長爸爸拍照不

  帶笑臉、打扮時髦，媽媽又頻繁看屋、經常收債，暗示小貞家比其他人富有或許來自不正

  當的途徑。沒想到，這一切都肇因於小貞的爸爸外遇，媽媽才會想方設法搬離社區。畢竟

  ，母女倆如果真的被拋棄，她們於情於理都無法再住在警察公寓。平常出手闊綽，也只是

  心疼大家日子苦，能幫且幫而已。



  《平行青春的我們》在最後針對小安安排一段開放式結局，不禁讓人想到甫奪得奧斯卡最

  佳導演的Sean Baker過去的作品《歡迎光臨奇幻城堡》。小貞、小安與阿東對每晚經過社

  區的豪華郵輪抱有憧憬，彷彿《歡迎光臨奇幻城堡》裡，居住在迪士尼旁邊廉價汽車旅館

  的主角們。在《歡迎光臨奇幻城堡》最後，主角面臨內心最低落的階段，一切看似再也無

  法轉好，兩位小朋友手牽著手逃跑，一路跑進迪士尼，這虛實難分的奇幻橋段象徵著主角

  內心此刻最渴望發生的事。



  當小安試過一切方法，甚至大義滅親報警抓聚賭的媽媽，好像都無法拯救自己脫離目前的

  命運，一雙曬著絲巾的手便突然消失。緊接著是從樓上看見小安的小貞，也加入她的奔逃

  ，兩人一路跑上豪華郵輪，最後小安在小貞閉眼時消失不見，只留下小貞送給她，希望能

  夠幫助她家度過難關的戒指。乍看之下，小安貌似從郵輪上落水，但我更相信早在家門口

  曬衣時，小安就已一躍而下。就像《歡迎光臨奇幻城堡》一般，搭上那艘每晚經過的豪華

  郵輪，是兩人內心最渴望的事，這也解釋為何她們就這樣硬闖上郵輪也無人攔阻，小貞在

  郵輪上尋覓小安時，全船也沒人發現有何異狀，只因這全是虛實難分的幻想。



  雖說《平行青春的我們》並不是以警察的角色為主，但電影也呈現出警察的其他形象。當

  嘟嘟車的司機聯合起來漲價，小安招一招手，爸爸生前的同事就以公務車載她們回家；小

  貞帶阿東去吃平時常去的冰店，老闆娘一聽到阿東也是警察，再加上小貞是熟客，便顧不

  得店內大排長龍直接讓他們插隊，讓阿東直言「顧一下警察的形象吧」。片中營造出警察

  很窮的樣子，從小貞的爸爸被同仁質疑「只是局長怎麼這麼有錢」，到小安說「好警察都

  很窮」，甚至從阿東女兒的嘴裡說出前妻的嫌棄，都一再強調警察在泰國並不是什麼受歡

  迎的職業。



  如果電影將焦點放在小貞與小安這對一起長大的好朋友，在成長過程裡所遇到的困境，表

  現便還算精湛，但《平行青春的我們》貌似想要探討太多議題。像是想要設定為GL片而納

  入青春期對性向與愛情若有似無的探索，但若不打算下結論也沒有要深入探討，就變得沒

  有什麼必要。不論小貞與小安是同性戀還是異性戀，即便只是好朋友，對於阿東突然出現

  並「搶走」自己與好姊妹的相處時光，產生嫉妒心理也是極為合理的事。尤其，不管是全

  片最甜的接吻，還是小貞為小安戴上戒指，甚至是事過境遷之後，小貞在跨年煙火下留言

  給小安的場景，兩人都不曾真切地意會到自己是否對對方懷有愛意，那這個提起的議題也

  只是未經處理就輕輕放下。



  最後，較為可惜的是阿東的角色塑造。如果他的出現是要讓小貞與小安意識到彼此的心意

  也罷，但最後卻發展成不知所云的三角戀。在小安與阿東交往期間，小貞出於嫉妒而故意

  說漏嘴導致兩人之間的嫌隙，但其實以警察公寓的住宅型態來說，他們的關係一定會被發

  現，只是時間早晚的問題。由於小安與阿東一旦成婚，小安一家就有正當理由可以繼續住

  在社區內，所以小安的媽媽不停鼓吹兩人結婚，但這樣就失去設定年齡差距大造成旁人反

  對的意義，甚至還安排阿東離過婚、有小孩，但全片唯一知情的小貞就連說氣話時都沒有

  把這個資訊講出來，阿東儼然成為推進劇情的工具人。



  《平行青春的我們》從警察公寓內兩個女孩的視角看盡社會的不公平與成長的苦澀，片尾

  奇幻的開放式結局也給予觀眾無限的想像。可是，放入太多議題的企圖，反而讓純粹的成

  長電影過於複雜，無法聚焦。它是一部不那麼甜蜜，又充滿現實的青春記事，看完雖然不

  會讓人感覺溫暖，反而有點酸酸的，但仍舊是一部值得一看的電影。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
