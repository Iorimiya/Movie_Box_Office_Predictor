url: https://www.ptt.cc/bbs/movie/M.1561732956.A.614.html
title: '[好雷]蜘蛛人:離家日 跟小蜘蛛一起見證AI時代'
content: '(以下雷一定有，慎入)





  (以下雷一定有，慎入)






  (以下雷一定有，慎入)







  難得又一步搶先在我中華民國淪陷區上映的漫威電影，

  昨天半夜興沖沖去看了首映場。


  這的確就是一部AI時代(After Iron-man)的電影……

  整部戲觀眾跟著小蜘蛛一起面對：

  沒有了鋼鐵人東尼史塔克，我(們)該怎麼過下去的沉重議題……


  即使面對如此悲痛的失落，

  這部還是保持了漫威一貫的"我就是要讓你幾分鐘就要笑出來"的風格，

  就算中間橋段再感人，漫威還是要安排笑點打破氣氛~~


  一開頭出現I will always love you的歌真的太犯規！

  呼應Tony的那句love you 3000，但用這首歌真的……到底是該哭該笑？

  等到紀念逝者的banner打出來，喵的太過份！這是要讓鐵粉噴淚嗎？！

  鐵人、美隊、幻視、黑寡婦，可惡的漫威再度提醒大家失去了哪些面孔……


  消失五年的人一口氣全回來又造成新的社會問題，

  讓梅嬸投入致力解決相關問題的NCO的確是個不錯的安排……

  第一次看到梅嬸有正職了～～


  這次的反派真的是一開始就讓大家覺得too good to be true.

  最後果然是假的。


  歸根究柢這次還是東尼搞出來的科技災難（遺產）……

  史塔克不只是本人很有事，連被開除的員工都很有事啊！！！

  員工的outplacement沒做好，就會造成重大的社會問題！


  東尼遺囑把開發出來的安全系統權限交給小蜘蛛，也算是傳承了……


  看到小蜘蛛在機艙後方開始搗弄新蜘蛛裝的設計，

  我的眼神跟HAPPY叔一樣欣慰QAQ


  齊柏林飛船的音樂一出來，我聽到觀眾席後方傳來一小陣歡呼，

  TONY以前做鋼鐵裝的時候也用過齊柏林當配樂嗎？


  這版的MJ果然是COOL GIRL，自己猜出來PETER是蜘蛛人～～


  又是一集證明當超級英雄的同學有多危險的故事，去哪裡玩，災難跟到哪裡……


  全班最正常(?)的跳出來質疑PETER怪怪的那一個同學，

  被老師說：你不能再這樣了XDDD

  標準的眾人皆醉我獨醒啊XDDDD


  彩蛋一的感想：好，事情真是越搞越大了……

  TONY起碼還是自己公開承認是鋼鐵人，小蜘蛛這是被迫出櫃啊！！！！

  假新聞真的太氾濫了，連漫威世界也充滿假新聞（搖頭）


  彩蛋二：算是解釋了為何這集的局長為何像是低配版＋不夠威嚴，

  但讓我更疑惑的是局長跑到外太空渡假幹嘛？

  還是其實局長是最無法走出復仇者形同解散的陰影的那一個？

  (那個花襯衫跟走路的姿勢，真的讓人感覺局長在自暴自棄……)


  史塔克工業的離職員工，最後只被解決掉一個首謀，

  但整組幕後工作人員都逃走了，

  下一集不知道會不會跟什麼奇怪的勢力合流再出來搞事……


  如果這版蜘蛛人可以跟死侍合演一集就好了~~(祈禱中)


  TONY的墨鏡給PETER戴，一開始看起來有點怪怪的，多看幾眼也就好了。

  不過還是反派戴起來比較帥XDDD


  如願吻到MJ的PETER好可愛(心)


  忘了說：除了眼鏡&自製戰鬥服讓人想到東尼，

  戰鬥橋段也故意安排致敬環節：

  小蜘蛛用招牌當盾、拆了無人機的核心改裝成鎚狀武器，

  把鎚子丟上天+用盾牌往上衝的戰鬥動作=雷神+美隊啊！！！！


  喜歡小荷蘭的朋友可以二刷刷起來！



  --


  　　                    來雙滿     後一孤



  --



  喔喔原來！那就是淪陷區版本的字幕翻錯，

  小蜘蛛回說：我也喜歡齊柏林飛船！

  淪陷區版本的字幕：HAPPY跟尼克說：尼克忘了一個衝浪板surfboard在史塔克工業那邊

  尼克說才不是我的（衝浪板），HAPPY回說：喔，不是你的啊～（大意是這樣）

  =(事情不是像表面On the surface那樣)

  哈哈對耶！返校日也是被東尼逼出來的反派XDDDD

  我有點搞混，這個報社老闆是二代蜘蛛人的報社老闆？

  喔喔天劍局？是神盾局的太空版嗎？（只看電影不看美漫的漫威迷）

  真的！！！

  哈哈所以小蜘蛛其實是誤會了？'
