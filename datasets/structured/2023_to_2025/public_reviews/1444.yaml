url: https://www.ptt.cc/bbs/movie/M.1619030344.A.AEF.html
title: '[討論] 玩具洩漏《尚氣》的「偉大保護者」、雜圖'
content: '#以下內容預告尚未出現，正片也未必會一模一樣：











  ▲樂高「古村落之戰」。


  《尚氣與十環傳奇》的相關玩具曝光之前已經在樂高出現的紅白龍（上圖）的正式名稱/

  頭銜：「」：






  不確定是否就是取材自漫畫的外星反派「非凡龍」（Fin Fang Foom），「非凡龍」是個

  龍形的外星生物，百年前乘坐的宇宙飛船墜落到中國，後被滿大人召喚，用以當作毀滅世

  界的工具，是漫畫中最具代表性的巨大怪物之一。不過，「非凡龍」之所以能成為漫畫迷

  中最受歡迎的反派之一，就在於牠有獨立的意識，更重要的是，就和《驚奇隊長》中的史

  克魯爾族一樣，具備易形能力，為此牠能夠變身為任何形體：





  本片還有可能取材自「帝江」的：




  要買女主角「Katy」才能獲得：




  帝江是中國古代天山的山神，也是原始先民的歌舞之神，顏色像紅火，六隻腳四個翅膀，

  沒有面目，能歌善舞：




