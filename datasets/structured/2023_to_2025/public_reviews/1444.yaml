url: https://www.ptt.cc/bbs/movie/M.1694518857.A.3FD.html
title: '[  雷] 保護者   該保護的是錢包'
content: "先說這部其實不難看\n\n但劇情真的很無聊\n\n劇情很平鋪直敘的走下去\n\n以為會有什麼特別的過去才導致主角浪子回頭\n\n阿結果什麼都沒講就繼續演下去=\
  \ =\n\n\n\n劇情無聊就算了\n\n連一些基本動作戲都沒有\n\n金南佶那組根本就只是戲份很多的雜魚\n\n小妹被綁架也沒什麼緊張感\n\n\n\n這部看點大概就是女主角滿漂亮的\n\
  \n第一次知道這位演員\n\n不過才幾十分鐘就掛了QQ\n\n重機女眼神很殺...雖然最後雷殘....\n\n還有就是追逐戰也滿不錯\n\n然後就沒了....\n\
  \n--\n \n \n \n \n \n \n\n--"
