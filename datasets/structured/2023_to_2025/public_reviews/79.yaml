title: '[請益] 風林火山的古天樂'
content: '想請益古天樂丟進冰箱那一包一包

  是什麼呢？

  感覺是人體組織？但為什麼也沒交代


  昨天在鄉下戲院看的

  晚餐時間，竟然一個人包場

  我是為了首周的金城武海報


  感覺真的是剪去了很多東西

  有些花絮的片段沒有在正片裡

  似乎要出個更長版本才會了解

  看完後也會有種“還有下集？”

  但應該是沒有

  最後一段不太確定是要表達什麼？


  畫面很美很藝術很有氛圍

  演員卡司跟音樂也很不錯

  其他的就不討論太多

  建議可以抱持著詩意的心情去看


  感覺每個角色都有故事

  但基本上都是留白


  --'
