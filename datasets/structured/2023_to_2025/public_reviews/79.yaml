url: https://www.ptt.cc/bbs/movie/M.1730366146.A.FA7.html
title: '[情報] 風林火山又延期啦'
content: "原本說今年年底上映 又改成2025年啦\n連帶著預告片也delay\n以下是香港01新聞：\n\n--\n風林火山｜推介會冇預告睇變文字討論　極致用詞︰有尺度有深度\n\
  撰文：許育民 \n\n由歌手麥浚龍執導，製作歷時長達7年，個人第二部執導作《風林火山》，雲集一眾型男\n及影帝︰金城武、劉青雲、古天樂、梁家輝等，自製作以來已成為不少影迷引頸以待的作\n\
  品。自8月初，《香港01》獲得可靠消息，指電影終鐵定將於今年年底上映，但隨後映期\n再調整到2025年。日前，電影正式在內地的橫店影片推介會亮相，一直盛傳會有預告發布\n\
  ，雖然最終只提供劇照，但單看宣傳部撰寫的推介語句，都夠晒創意。\n\n2024年度橫店影片推介會，於10月29至30日舉行，當中有超過160部的中港影視作品作介\n\
  意，香港代表有《風林火山》、《焚城》、《破．地獄》、《我談的那場戀愛》及《怒火\n漫延》等。起初消息指屆時會播放預告片段，曾引起一眾影迷瘋傳及期待。縱使撲空，但\n\
  在推介會上也有故事大綱及宣傳語句分享，當中亦不乏趣味。\n\n在推介會上，最終沒有預期的預告片登場，只有一位女主持，朗讀出宣傳部創作的語句，\n而當中的用字非常極致，將電影的期待度推至史無前例的高峰。例如︰「以暴制暴極致爽\n\
  感、人性搏奕犯罪爽片」，以及「頂級豪華陣容，極致犯罪爽片，超強感官刺激，暴力美\n學，有尺度有深度」可以話愈講愈令人期待。\n\n\n--\n頂級豪華陣容\n\
  \   極致犯罪爽片\n      超強感官刺激\n         暴力美學\n            有尺度有深度   以暴制暴極致爽感  人性搏奕犯罪爽片\n\
  \n這麼多buff 是不是幾撚期待\n\n--\n不依樣喔 上篇只是改期 我這篇連新的預告片都能延期 Hehe\n我就是看到這新聞覺得有夠鬧XD"
