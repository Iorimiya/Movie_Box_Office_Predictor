title: 'Re: [新聞] 《風林火山》導演搞失蹤、超支7億 金城武'
content: "怎麼很有王家衛的fu?\n\n王的作品當年2046、一代宗師也是拍了好幾年，\n\n拍到人家都在是問是不是2046真的要等2046才會上映？\n\
  \n一代宗師拍了10年。\n\n\n而這部才2年多？我覺得還好啊。\n\n\n感覺不是大好就是大壞的電影。\n\n\n至於金城武會跟導演傳不和，應該是不太可能啦，\n\
  \n頂多就是檔期不合而離開而已。\n\n金城武這個人非常低調而且Nice的，\n\n而且從來不跟導演與劇組起衝突，也不喊辛苦，\n\n對吃住都沒有要求，非常好講話，而且別人最討厭的等戲時間，\n\
  \n他卻是最喜歡，甘之如飴，因為他可以在旁邊打電動。\n\n我唯一想得到他會不爽的理由，就是你不給他網路。\n\n\n\n\n然後任賢齊也是圈內有名的好好先生，\n\
  \n什麼大風大浪沒見過，從沒沒無聞到暴紅再到沈潛，\n\n所以對人真的很好，脾氣與處事沒話講。\n\n\n\n要惹怒這兩個人品都一流的人，而且是同時？\n\n\
  我覺得很難耶。\n\n\n\n--\n 我還沒說完吶~~      夠多了夠多了，回家吃藥了啦~!\n    　　　                     \
  \              \\        /\n          　　　                                    ○\n\
  \                　　　                      ︵ \\○╱/|\n                      　　　  \
  \  . . ﹎ ﹍﹍ ╱￣﹚╱＞\n\n\n--\n他甚至想把電影版權買下來，自已接著拍。\n\n所以你說任賢齊會跟導演不合？？我是不信啦。\n\n這兩個人的人品在業界是口碑一流的好嗎？"
