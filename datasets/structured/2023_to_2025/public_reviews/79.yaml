url: https://www.ptt.cc/bbs/movie/M.1697249659.A.084.html
title: '[新聞] 金城武都50歲了《風林火山》殺青5年還沒'
content: '金城武都50歲了　《風林火山》殺青5年還沒上映




  金城武當年以偶像歌手出道。翻攝電影喜歡你微博


  【吳惠菁／綜合報導】


  金城武生日快樂！


  這位男女通殺的台日混血大帥哥今天（11日）50歲了，一向行蹤神祕的他，已6年未出現

  幕前，最近一部作品是與周冬雨配對、在2017年上映的電影《喜歡 你》，粉絲今在網路

  獻上祝福之際，也忍不住抒發思念，哀號：「金城武都50歲了，我們還沒看到《風林火山

  》。」


  該片已於2018年殺青，至今尚未敲定上映日期。


  《風林火山》由《殭屍》導演麥浚龍編劇和執導，斥資4億港幣（約17億元台幣），集結

  金城武、劉青雲、古天樂、梁家輝、高圓圓和任賢齊演出，特地在惠州搭建6萬平方呎1比

  1的銅鑼灣實景拍攝，除了演員陣容堅強，還請到日本大師坂本龍一配樂。


  遺憾的是坂本龍一在今年3月病逝，麥浚龍日前曾對《香港01》透露，因坂本龍一過世，

  由他接手電影配樂的混音工作，他也表示，之前受疫情影響，演員配音很多電影後期都難

  以進行，解封之後就變得順利了，因此後期製作已沒有剩下太多工序，至於排片、安排上

  映時間等還是發行商比較清楚。


  金城武50歲生日這天，粉絲再度勾起對《風林火山》的怨念：「難道要等到我50歲嗎」？

  「我年年等，心都等碎了」。


  儘管再無奈，也只能繼續等下去。




  金城武主演的《風林火山》已於2018年殺青，至今未敲定上映日期。翻攝電影風林火山微

  博




  金城武上一部公開的作品已是2017年的《喜歡你》，當時劇組徵求粉絲蒐集的金城武舊照

  。翻攝電影喜歡你微博




  吳奇隆（前排左起）、林志穎、蘇有朋（後排左起）、金城武曾被封為「台灣四小天王」

  。翻攝電影喜歡你微博


  新聞網址：



  re


  --'
