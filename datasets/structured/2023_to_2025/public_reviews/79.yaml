title: '[討論] 風林火山正式預告出爐！完整卡司介紹'
content: '《風林火山》完整卡司正式預告片出爐

  其中超大卡司一一介紹

  劉青雲

  古天樂

  梁家輝

  高圓圓

  盧海鵬

  金城武（與任賢齊從報告班長3之後再一起合作）

  任賢齊（與金城武從報告班長3之後再一次合作）

  林俊賢（驅魔警察的林警官）

  衛詩雅（破地獄女主）

  程東（獨眼龍大軍）

  鮑起靜（殭屍裡的梅姨）

  盧冠廷（富貴逼人的毛毛）

  李元霸（靈界風雲小活佛裡的好朋友阿吉）

  劉永（乾隆下江南的乾隆皇帝）

  杜德偉


  麥浚龍也算有誠意，片中大大小小角色大部分都是港片裡曾經赫赫有名的人物，都是回憶殺


