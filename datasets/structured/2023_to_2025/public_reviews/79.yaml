url: https://www.ptt.cc/bbs/movie/M.1760033691.A.6F5.html
title: '[請益] 風林火山的梁家輝在圖什麼？'
content: '心得

  沒什麼雷  劇情我是蠻喜歡

  而且大牌們都演的很稱職


  但剛看完 心情很沈重

  這部電影的特效是很大的敗筆

  但是每個人物的構築做得很好 劇情也喜歡

  （不要理爛特效 專注看大牌們敘述故事就很棒了）



  有許多地方看不懂（節奏太快）

  但我人生不敢二刷這部電影

  因為梁家輝老婆那段讓我心理有陰影

  可能會一輩子難過 （這應該不算暴雷）


  回到問題上

  我不是很懂梁家輝圖什麼？

  劇情裡每個人物刻畫的目標很清楚

  有人圖家庭安穩 圖轉型 圖還債 圖錢 貪 道義等


  但梁家輝在圖什麼？

  他沒感情？ 還是感情太深？

  追求正義安穩？

  請問有人看過

  可以解惑一下梁家輝這角色的立場嗎？





  --'
