url: https://www.ptt.cc/bbs/movie/M.1747237083.A.937.html
title: '[討論] 《風林火山》片長出爐 2小時12分'
content: '本屆坎城影展正式開展，入圍午夜單元的《風林火山》主創名單及片長也隨之公布。據去

  年本片剪輯張叔平講到定剪送審的版本有兩個版本，分別為2小時及3小時。


  而坎城官方公布的正式片長為：2小時12分鐘 (132分鐘)。

  導演麥浚龍提到坎城的播映版本也將會是後續上映的版本。



  正式公布的主創名單為：


  導演：麥浚龍


  編劇：麥浚龍

  　　　周汶儒（《第八個嫌疑人》《正港分局》）


  攝影：Sion Michel（《如夢》《暴走神探》）

  　　　Richard Bluck（《西遊記女兒國》、《吸血鬼家庭屍篇》）


  剪輯：張叔平


  美術：麥浚龍

  　　　奚仲文（《武俠》、《投名狀》、《滿城盡帶黃金甲》）

  　　　周世鴻（《九龍城寨之圍城》）



  配樂：Nate Connelly（《殭屍》）

  　　　坂本龍一


  （本片的主題樂為坂本龍一創作。

  　在他過世之後，麥浚龍找來曾合作過的Nate Connelly創作全片配樂。）


  --'
