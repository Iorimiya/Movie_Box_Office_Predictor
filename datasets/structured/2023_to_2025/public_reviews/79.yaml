url: https://www.ptt.cc/bbs/movie/M.1760800558.A.B7B.html
title: 'Fw: [普雷] 《風林火山》「傳說」的終點，是連滾帶爬'
content: '作者: elvayanzimei (柏C) 看板: HK-movie

  標題: [普雷] 《風林火山》「傳說」的終點，是連滾帶爬

  時間: Sat Oct 18 23:13:56 2025


  部落格圖文版：



  《風林火山》上週於港澳、中國大陸上映後，這部已經拍完八年，直到今年才陸續參加影

  展、安排院線上映的「都市傳說」，立刻引起廣泛的討論。而前幾天在看最近有什麼電影

  的我，一聽到預告裡的梁家輝開口，腦海瞬間浮現出《寒戰II》M.B.Lee 李文彬的畫面（

  前陣子剛剛看過 XD），加上自己也想一探「都市傳說」的真面目，便決定進場看《風林

  火山》。


  在大約兩個小時的片長中，隨著劇情、設定的不斷揭露，電影的優點令我眼睛為之一亮，

  可是缺點同樣讓我難以忽視。先說優點，從發生在銅鑼灣街頭的無差別襲擊，到因此陷入

  一團混亂、橋言集團主席李栢山正被軟禁其中的廣和醫院遭遇爆炸攻擊，《風林火山》一

  開始就營造出天大陰謀，將我對後續發展的期待值拉滿。


  同時在平行世界的香港裡，也能窺見香港電影的種種可能性。不管是灰色調下飄著雪的城

  市夜晚，所散發出比過去那些以此地為背景的 Cyberpunk 世界來得更濃烈的末日感，還

  是不以火力與速度壓制，反倒連弓箭都用上，放大生、死的動作美學，都在在堅定了我的

  期待。


  直到這股期待漸漸被無趣消磨殆盡。


  兩個月前我在中環的大館，看了以香港電影中「臥底」為主題的展覽（展覽全名「光影邊

  緣—香港電影的臥底世界」），《風林火山》裡一個個角色身上，不難看見來自過往經典

  類型的投射。想要擺脫家族陰影的李霧童，口口聲聲說為了女兒，結果被一語戳破內心貪

  念的王志達，以及分別由梁家輝、高圓圓飾演，隔空對弈的老警探、思欣，他們的目的、

  動機更多來自我們代入銀幕形象後的腦補，而非電影真的做了什麼鋪陳。


  相對完整的是古天樂的「清潔工」程文星。當女殺手小葉對他出手，意識到對方接受了既

  像家人，又不能真正成為家人的矛盾，他對這份殺心的肯定讓兩人的形象飽滿了起來。但

  認真而言意象始終多過細節，情感上仍然顯得薄弱。


  「《風林火山》是一個世界觀，上映的兩小時版本像是一個簡介。」


  在其中一個訪問裡，本片導演麥浚龍這樣形容。《風林火山》的龐大而破碎，就這麼浪費

  了可以說看一部少一部，大部分角色都能一眼認出、星光熠熠的演員陣容。Btw，發現清

  潔工小隊發工作的奀叔是盧冠廷的時候超級驚喜，然後鮑起靜某種程度訣別古天樂的一場

  戲，是滿滿的感情啊。


  「有兩輛警車，八個警察。」


  至於聽完以為是《黑暗騎士：黎明昇起》那種下著雪的街頭追逐戰，結果只在走廊上打一

  打的最後高潮；說藥能取代毒，也真的是要合法賣藥的反高潮；「重慶大廈有毒品。」還

  有上一秒說重慶大廈，下一秒竟然帶到了怪獸大廈的突兀。


  總之支持出六小時的版本，想看到從從容容游刃有餘，而不是匆匆忙忙連滾帶爬，角色心

  境全靠腦補的《風林火山》。


  --


  部落格：

  FB：

  IG：


  --'
