url: https://www.ptt.cc/bbs/movie/M.1709876493.A.A12.html
title: '[請益] 有像風林火山這種大咖集結卻沒上映的片嗎'
content: '風林火山 這部集結許多大咖

  包含金城武本人我所拍攝的電影

  2017開拍於2018三月拍攝結束

  至今也快六年了

