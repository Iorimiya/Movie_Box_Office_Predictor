url: https://www.ptt.cc/bbs/movie/M.1722061560.A.E5C.html
title: '[新聞] 神隱7年 金城武會不會現真身宣傳風林火山'
content: '神隱7年！金城武會不會現真身宣傳《風林火山》　經紀人回應了




  ▲金城武有機會現身宣傳新片《風林火山》？經紀人有初步回應。（圖／NOWnews資料照

  ）


  記者楊穎軒／台北報導-2024-07-27 08:00:00


  影壇巨星金城武入行35年，如雕像般的俊美五官、180公分高  身材及迷人談吐，至今仍

  是「帥哥」的代名詞，從不經營男神或明星人設的他，2017年年底拍完港片《風林火山》

  後就銷聲匿跡，如今該片雪藏6年終於要在年底上映，《NOWnews今日新聞》詢問經紀人，

  金城武有沒有機會露面宣傳，對方表示：「。」


  港片《殭屍》導演麥浚龍2015年宣布，將打磨5年的《風林火山》劇本搬上大銀幕，這部

  觸及富商命案、販毒者和反毒者之間角力的警匪動作片，邀集金城武、古天樂、梁家輝、

  劉青雲、高圓圓、任賢齊、鮑起靜等大牌演員，配樂找來日本音樂家坂本龍一，劇組在廣

  東惠州片廠裡搭建一條1:1實景、面積達6萬平方呎的銅鑼灣街道，搭配雪景拍攝，還有許

  多爆破戲，顯見規模之大。




  ▲▼金城武（下圖左三）6年前拍攝完畢的《風林火山》預計年底上映。（圖／風林火山

  劇照）




  不過《風林火山》從2016年開鏡到2017年殺青，加上前期的後製工作，2018年3月宣布拍

  攝完成，因為預算自2億港元（約8億元新台幣）嚴重超支達4億港元（16億元新台幣），

  讓多個投資方不敢再補錢坑，連帶影響後續的發行程序，讓上映日遙遙無期。


  此外，麥浚龍一絲不苟的個性，對作品的細節極為要求，希望做到盡善盡美，也是導致《

  風》片延期問世的原因之一。




  就在影迷苦等第9年之時，港媒《香港01》日前訪問電影《九龍城寨之圍城》出品人陳羅

  超，他親口透露，根據所收到的消息，《風林火山》已經排定在今年年底、12月份上映，

  「市場一直好期待，這是最大優勢」，然而，陳羅超擔心該片從開拍到上映時隔9年，可

  能會有觀眾無法適應演員當年的樣貌，以及劇情內容是否有過時的疑慮。


  《風林火山》男主角之一的金城武，從答應接演至今滿50歲，而距離上一次從日本回台灣

  公開露臉，為7年前的作品《喜歡．你》記者會，如今「新片」終於要上映，《NOWnews今

  日新聞》詢問金城武的經紀人，屆時金城武是否會參與相關的宣傳活動，對方回應：「是

  否會宣傳，需要看電影公司的安排，我們目前沒有接收到任何訊息。」


  新聞網址：




