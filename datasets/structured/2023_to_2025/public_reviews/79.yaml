url: https://www.ptt.cc/bbs/movie/M.1631796886.A.3F3.html
title: '[情報] 麥浚龍：《風林火山》預計於明年上映'
content: '麥浚龍在最新一期的香港Vogue雜誌專訪講到了《風林火山》的近況


  以下僅節錄原文跟電影相關內容



  電影最重要是注入自己的觀點與想法


  「我愈來愈沒有信仰，特別是在鬼怪題材上，沒有信仰和傳統忌諱才可以發揮得淋漓盡致

  ，如果你有規限，很多拍攝的地方也未必會去，例如殮房、孤墳，反而我沒有這樣想法，

  劇情需要就會去。」很多人看到Juno會不期然想起較為黑暗的故事，但Juno反而不想局限

  於拍攝特定題材：「電影最吸引的離不開也是人，所以我喜歡探索情感，題材只是一種包

  裝。」對他來說，喜歡創作的人應該對每一個題材也有自己的看法，「正如我不想拍《疆

  屍》續集，很大程度也是因為不想局限自己只拍一些天馬行空的題材。因為我認為怎樣的

  題材也可以，最重要是注入自己的觀點與想法。」



  《絕命大煞星》、《閃靈殺手》觸動人心


  對於一個喜歡探索情感的創作者，怎樣的作品才可以令他動情？Juno坦言他喜歡很多導演

  的作品，但對他來說，塔倫天奴未做導演前的兩套戲卻可觸碰他的心。「《絕命大煞星》

  和《閃靈殺手》是兩套獨立的電影，但對我來說卻是有很大關連，至少真的可以做到如戲

  名般的內容，《絕命大煞星》真的是浪漫。」



  緣份不是虛幻 一切像冥中注定


  雖然他正在蘊釀下一首企劃，但很多時也不是特別計劃，有時候可能會是電影，有時卻是

  音樂，一切像冥冥中注定。




  《風林火山》為麥浚龍繼2013年獲得多個獎項提名的首作《殭屍》後再次自編自導作品。


  參演卡司也是相當的豪華


  金城武、劉青雲、古天樂、梁家輝、高圓圓、


  任賢齊、衛詩雅、盧海鵬、鮑起靜、盧冠廷、杜德偉、蔡德才


  此部於2017年開拍並於2018年殺青，而麥浚龍自己也有上傳拍攝花絮及五大主演殺青花絮









  其實本片最早是定於去年年底上映

  去年中國戲院《奪冠》上映時正片有接一支前導預告 之後又退檔


  而去年也有新聞指出麥浚龍跟劇組和演員群創作分歧，導致後製和補拍進度落後


  在今年上半年則是有消息要排於下半年上映 但現在麥浚龍親口證實應該又要延到明年了


  這部跟《風再起時》誰會最早面世勒


  --'
