title: '[討論] 風林火山是不是不太妙'
content: '集結金城武 梁家輝 劉青雲 古天樂等多位大咖巨星主演的風林火山


  總體票房截至目前為止


  1.中國上映約 7 到 8 天的累計票房為 6000 萬至 7000 萬元人民幣

  中國媒體平台預測最終總票房將勉強破1億元人民幣


  2.港澳總票房840萬


  我個人很喜歡麥浚龍的殭屍

  即便口碑上再慘還是會進場看風林火山


  但對比投入製片成本高達4億港幣

  拍了超過10年的製作週期

  風林火山這次是不是很難回本了？




  --'
