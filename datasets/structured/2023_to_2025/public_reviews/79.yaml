url: https://www.ptt.cc/bbs/movie/M.1597726344.A.4DB.html
title: '[新聞] 《風林火山》導演搞失蹤、超支7億 金城武怒了離組拒絕補戲'
content: '新聞網址：


  曾和鍾欣潼（阿嬌）交往的香港導演麥浚龍（Juno），首度執導電影《殭屍》就獲金馬國

  際影評人費比西獎，他3年前開拍電影《風林火山》，找來金城武、古天樂、梁家輝、劉

  青雲、任賢齊和高圓圓等大咖演出，前年3月宣布拍攝完畢，至今2年多仍無法上映，且又

  超支2億港幣（約7.5億元台幣），傳出惹怒多位演員，包括金城武。


  據港媒報導，3年前開拍的電影《風林火山》遲遲未上映，除了後期資金問題，還爆出麥

  浚龍在片場和演員不合，與金城武和梁家輝產生分歧，讓金城武合約一到期就離開劇組，

  也不願意再回到片場補拍鏡頭。不少演員不滿麥浚龍的拍攝和處事手法，麥浚龍也經常搞

  失蹤，被爆在片場常常躲在帳篷裡，讓演員乾等，也不和演員溝通，導致金城武和梁家輝

  都曾因拍攝問題產生意見分歧。


  任賢齊也曾在拍攝上給麥浚龍建議，但麥浚龍堅持己見，導致任賢齊手部拉傷，合約到期

  後也離開劇組，電影成本從2億港幣超支到4億。對此監製禤嘉珍回應：「導演很有才華，

  要求又很高，追求完美，很多時候對拍攝會很堅持，這樣就很自然會和演員有分歧，麥浚

  龍拍的片不是很多，經驗不夠，是需要去累積經驗。」目前後製持續在進行，坦言確實超

  支，預計最快明年問世。








  --'
