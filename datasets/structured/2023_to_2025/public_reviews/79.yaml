title: '[情報] 金城武《風林火山》年底即將上映'
content: '等金城武等到50歲了！《風林火山》年底終於要上映啦！


  香港導演麥浚龍所執導的警匪動作片《風林火山》自2017年開拍至今，睽違七年終於不再

  雪藏！光是從籌備到製作拍攝及後期製作，匯聚眾多實力派影帝男神及影后等卡司，製作

  費用就斥資高達1.5億港幣，每年只聞樓梯響，不見蹤影來，光是粉絲等金城武演出的電

  影，等到金城武都要50歲啦！


  目前相同類型的《九龍城寨之圍城》於海內外就奪得億萬票房佳績，導演麥浚龍想必應該

  能夠放心，現確定公佈上映日期於年底上映，可不能再放粉絲們鴿子！


  因為如此難得一見的金獎陣容及故事題材，絕對能滿足影迷期待已久的心情啊！


  《風林火山》劇情描述一場突如其來的爆炸事件令香港富商失去性命，從案件查出販毒者

  與反毒者之間的不對等關係！


  此外，販毒集團繼承人不惜一切製造社會混亂，為的只是一個崇高完美的理由？


  原來沒有毒品的世界，竟比想像中更加混亂可怕！究竟誰能出面撥亂反正呢？


  不如... 先來複習先前釋出的拍攝影片望梅止渴等待正式上映吧！（與目前官方釋出相同

  ）


