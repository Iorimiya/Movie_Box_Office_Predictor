url: https://www.ptt.cc/bbs/movie/M.1760927383.A.2FC.html
title: '[好雷] 風林火山'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  完全好似沒有任何熱度的默默在台灣電影院上檔(又快下檔)。

  其實是看到Youtube跟臉書廣告有播放個別演員的角色專訪，才恰巧知道這部電影

  本身做為一個世代是看著港片長大中年人，光是看到演員名單閉著眼睛就應該要買票進場


  電影本身就不多做討論了，畢竟劇情不完整，網路上有太多香港影視人在分享評論

  有興趣的可以自己查查，雖然我也是看完之後才開始科普的。


  光是想到這些演員能夠擦出怎麼樣的火花，就讓人覺得興奮。

  可惜電影院看到的對手戲太少並不能滿足我 哈。

  如果真的有更長的版本，應該也是值得一看，就把它當作是每個演員的個人秀


  總體來說，光是看到每個演員的表演，就足夠了，真的是看一場少一場。

  也算是個美好的回憶。

  不管怎樣還是要感謝麥導花大錢把大家都召集過來!!!!


  --

  因為愛妳


  所以愛上別人來忘記妳


  --'
