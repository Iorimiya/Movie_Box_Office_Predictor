url: https://www.ptt.cc/bbs/movie/M.1760705601.A.8E5.html
title: '[ 普雷] 風林火山'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  其實能在大螢幕看到這群人，加上配角們都很驚艷，身為老港迷就值得給普雷了。


  看得出來原本的劇本應該很帶感，角色設定都很像殭屍的風格，有其人物的殘缺導致的宿

  命感（梁家輝老婆或者是劉青雲女兒）


  但麥導強設定弱故事的缺點也還是沿用下來，故事太詭異了，核戰爭後缺乏藥物資源的香

  港還一臉電力充足，假如金城武買得下隧道當自己家，那一般市民應該過的很貧窮，更不

  用說需要花錢硬蓋一個九龍出來。


  美術方面一開始看的確很精緻，但整部片的黑白色調太久，最後相當的疲憊。


  最後我覺得未來會有人為這部片平反，畢竟真的很有個人風格，也希望麥導可以跳脫自己

  的問題，他很適合拍一些100分鐘內強設定的類型片。


  --'
