url: https://www.ptt.cc/bbs/movie/M.1744122573.A.87A.html
title: '[情報] 《風林火山》最新海報 & 社群宣傳啟動'
content: "由麥浚龍編導的《風林火山》在歷經許多波折後，終於在去年開始慢慢浮現出來問世的消\n息。先是該片剪接師黃海於一場活動提及他已有收到導演麥浚龍的初剪版本和所有素材，\n\
  以及他和剪接指導張叔平剪輯出來兩個版本，且也提交送審。後續，出品人之一的陳羅超\n也說該片將會很快與觀眾見面。\n\n而去年開始，該片先參加了釜山國際電影節的亞洲電影市場作海外行銷尋找買家，後續又\n\
  於香港各地電影院派發年曆卡。\n\n在今年的柏林影展，《風林火山》也於影展現場的銀幕雜誌（Screen）刊登廣告開始進行\n宣傳。在上個月也在香港藝術中心播放了給業界人士看的獨家片段，而據已觀賞的電影人\n\
  透露，絕對不會讓大家失望，很多會是大家過往沒看到過的，也稱讚了劉青雲的演出。\n\n而在這個月，《風林火山》也開啟了社群宣傳，並公布了新的海報及宣傳照。目前也有國\n\
  外媒體猜測後天將公布的坎城影展片單，該片有望入選並於坎城進行世界首映，甚至有機\n會是入選主競賽片單。相信這部被廣大影迷等待許久的作品將能順利問世，不再是都市傳\n\
  說。\n\n\n\n\n\n（世界巨輪底下，新的一章即將被翻開）\n\n\n（欲念的臨界點，響起滅亡的前奏）\n\n\n\n《導演的話》\n\n沒有毒品的世界是樂土吧。\n\
  \n到過這片樂土的，才知它叫煉獄。\n\n人創造了藥物，目空一切地相信人的能力足以掌控生死。\n\n無知狂妄，但卻被蒼生麻木地擁戴。\n\n--\n     \
  \                              04/08 22:30"
