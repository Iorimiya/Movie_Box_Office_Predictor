url: https://www.ptt.cc/bbs/movie/M.1747451334.A.E40.html
title: '[討論] 風林火山坎城首映不如預期'
content: '已有不少消息出來了，風林火山在坎城影展世界級的首映會後，表現與評價不如預期（甚至

  可用差來評論）

  版主本人也親臨影展觀影現場，所以這算最真實的第一手消息。


  以下轉自版主臉書粉專《地下電影》：


  《風林火山》就在剛才於坎城影展完成世界首映，雖然這是「午夜單元」，放映結束接近午

  夜 3 點，但這可能是我在盧米埃廳內聽見最稀落的映後掌聲，觀影過程也不斷有人離席，

  我待到了最後，但我不確定我到底看了什麼。

  　

  《風林火山》設立在一個超現實的舊香港世界，這座城市下著雪，始於一場銅鑼灣的恐怖攻

  擊，而從一開始，所有的事物在我看來都有一種「假的狀態」——故事是假的、特效是假的

  、人物是假的、表演是假的、背景是假的，而這個「假的狀態」，我也不太確定是不是麥浚

  龍的一種手段，去架空、去表述另一種影像敘事上的政治方法。

  　

  至於這個「假的狀態」的手段——如果它真的存在的話，在《風林火山》是否有效、是否能

  夠成立，也同樣是我想知道的。

  　

  而麥浚龍確實也在《風林火山》試圖創造屬於影像的「文學性」，但麥浚龍在這部電影的故

  事閱讀方法、影像美學的實踐，讓他的電影距離觀眾太過遙遠，或許也就是因為這個距離，

  始終讓我走不進去這個超現實的舊香港世界，太難了。

  　

  對於《風林火山》我有太多疑問，而我真的希望麥浚龍知道自己在做什麼。


  如果搞了七年的電影還這麼爛，我倒不如覺得你乾脆把殭屍導演版（完整版聽說兩個多小時

  ）放出來上映還比較好……


  --'
