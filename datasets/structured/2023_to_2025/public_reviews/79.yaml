url: https://www.ptt.cc/bbs/movie/M.1744313550.A.C7D.html
title: '[情報] 《風林火山》15秒前導預告 & 新劇照'
content: '麥浚龍睽違12年的最新執導作品《風林火山》，於2017年開拍，2018年殺青。而等待了近

  7年，終於將在今年的坎城影展午夜單元進行世界首映。在坎城影展官方公布入選之後，

  麥浚龍也發表了入選感想，並搭配了一張新劇照。




  「收到了第78屆康城影展官方的邀請函。先在此說聲感謝，更代表整個團隊向每一位選片

  評審說聲感謝。謝謝每一位喜歡「風林火山」的評審們。相信每部電影都有屬於它的命運

  ，實在找不到一個更合適的時間/地點去響起屬於這部電影的前奏曲。背負的情緒太多，

  感動的話語不知從何說起，還是埋首繼續忙。再一次衷心的感謝。在天的，願你們都分享

  得到這份榮耀。2025 動如雷震 康城指教。 」


  隨後也於社群發布了15秒的前導預告






  在預告可看到五位主演金城武、劉青雲、古天樂、高圓圓、梁家輝的身影，並搭配著已逝

  配樂家坂本龍一譜曲的配樂。本片配樂也將會是坂本龍一的遺作。


  而原先為主演之一的任賢齊，有消息指出可能因素材取捨 (或是雙方間可能的衝突)，

  最終戲份全刪，不會出現在成品內。


  主演之一的古天樂昨日出席香港國際電影節，也被問到《風林火山》的相關問題，他回應

  去年麥浚龍有給幕後主創和些許演員看過4~5小時的版本，但最新的定剪版他還沒看過也不

  清楚時長是多少。



  --'
