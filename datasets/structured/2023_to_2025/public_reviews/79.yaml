url: https://www.ptt.cc/bbs/movie/M.1685168588.A.A1F.html
title: '[新聞] 麥浚龍回應《風林火山》最新進度（非原'
content: '麥浚龍（Juno）是《風林火山》編劇兼導演，由於電影開拍至今已6年，久不久就有網民開P

  ost問上畫未，日前他在活動上就向《香港01》交代最新進度，指負責電影配樂的坂本龍一

  月前離世，令他要接手混音工作。


  電影《風林火山》據說斥資近4億，除了集齊金城武、劉青雲、古天樂和梁家輝等超強卡士

  ，搭建了1:1銅鑼灣實景及雪景已教人相當震驚和期待。由於電影開拍至今6年仍未上映，曾

  一度與《風再起時》、《明日戰記》、《尋秦記》並列「都市傳說級電影」，不過《風再起

  時》及《明日戰記》已於近一年上畫，《風林火山》又如何呢？


  Juno自編自導的電影《殭屍》好評如潮，使很多網民都對《風林火山》格外期待，久不久就

  會開Post追問電影上畫未，日前編劇兼導演麥浚龍（Juno）現身飲品品牌活動，幾乎每次出

  席公開場合都被問起該片進度的他，就向《香港01》交代最新進度，原來他連混音工作都做

  埋！他說：「我最大嘅需要係反而係……因為今次部電影嘅配樂係坂本龍一去做，但係佢已

  經過咗身，變咗我要幫佢混音。」


  他坦言幾年前受疫情影響，演員配音等很多電影後期都難以進行，現時復常就順利返，因此

  後期製作已不算剩低太多工序，不過排片、安排上映時間等，始終是發行商比較清楚。




  Juno出席自己有份設計的飲品品牌活動。



  原文網址: 網民狂追《風林火山》上映日　麥浚龍：配樂坂本龍一過咗身… | 香港01 http

  s://www.hk01.com/article/902036?utm_source=01articlecopy&utm_medium=referral


  --


  隧道盡頭終有光，期待問世的一天。



  --'
