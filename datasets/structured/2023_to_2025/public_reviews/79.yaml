url: https://www.ptt.cc/bbs/movie/M.1760806962.A.E38.html
title: '[ 普負雷] 風林火山：黑社會警匪片的復古情懷'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  一個看過很多電影的導演，

  一個試圖要把偶像作品塞在一部片的導演。

  一個想用很多明星去擠出經典的導演，

  一個堆砌美學但忘記劇情合理性的導演。


  結果就套用片中，金城武對劉青雲講的一句話：

  你就是一個字，貪！



  ##$


  整片看下來，會發現很多名片的痕跡，當然我沒跟導演聊天過，

  所以這些致敬，就當我是瞎猜吧！



  前段，車站大場面，有諾蘭黑暗騎士的影子，畫面的風格也像天能。


  中間，黑社會殺人，像教父，

  也像馬丁史科西斯，賭國風雲，四海好兄弟。


  後面一直在談，有選擇，像致敬無間道？？？


  然後每個角色都想要有故事，

  但時間有限，所以每個都很突兀。

  但時間有限又喜歡拍一些無聊的鋪陳細節。

  例如清潔隊，女殺手根本不重要，用刀胖子也是可有可無，雖然殺蛇羹老頭那段不錯，但

  也是靠老頭演技拉抬。


  金城武老婆也浪費時間，

  特別是心理醫生的設定，非常無間道三，陳慧琳。


  但這個角色就對劇情推進影響有限。


  整片有種，廚師很努力想把菜做得好吃，放了一堆果雕乾冰，但基本調味就不行的矛盾感

  。


  甚至這部片如果只有1/10預算去拍，不用場景，不用燈光，

  用古惑仔那種程度的鏡頭去拍這套劇情，我覺得都不影響。


  看得出導演想強調幾個掙扎重點


  金城武的情感跟道德糾葛（家人vs販毒）

  劉青雲的糾葛（警察身份vs賺錢救女兒）

  古天樂（不喜歡殺人但又得殺）

  梁家輝（這角色還好沒啥糾葛，被編劇安排割韭菜的）


  戲份也偏重在金城武身上，

  全片比例可能

  金 劉 古 梁=

  40 ：30 ： 20 ：10


  所以只有金城武稍微立體，其他人都薄弱。




  總之，可以看，但不會想二刷。







  --

  確實 天能2020 風林2017開拍


  那就比較偏向黑暗騎士系列 2005年就有


  感覺很明顯有模仿諾蘭的味道


  寫一些我對劇情的解讀


  金城武：

  我是一個富二代，我爸爸販毒賺很多錢，我哥哥也販毒，但是我討厭販毒。


  所以我要拿下公司掌控權，

  方法是

  1.炸醫院炸死老爸

  2.派殺手殺掉反對我的公司老人

  3.引誘哥哥回來，然後殺掉他。


  我很用心，我很正確。


  高圓圓

  我是一個富二代的老婆，副業心理醫生。

  我很愛我老公，所以我用我的專業幫助他殺人。



  劉青雲


  我是一個很猛的警察主管，

  但是我不喜歡，我想帶小孩移民。

  所以我偷偷販毒賺錢，順便勒索最大的黑社會配合我賺錢？？？？？


  我派很多臥底，但是他們都死了。


  古天樂


  我是一個殺手，但是我宅心仁厚，常常勸同事離職。


  可是工作比同事還有我自己重要，

  我願意為任務殺同事，還有讓自己送死。



  梁家輝


  劇情需要一個看起來很穩重很聰明，

  識破一切陰謀的正方領導，所以我就來了。


  重點場合出來講幾句話就演完了，真輕鬆。


  任賢齊


  我演一個很雖的角色，

  沒啥表現機會，還躺著中槍被長官賣，死的很慘。


  我到底來幹嘛的？乾


  哈哈這句好笑

  任是 金城武老婆的跟班

  也是劉青雲安插在公司的臥底

  結果劉青雲為了錢出賣他

  有點硬凹 無言'
