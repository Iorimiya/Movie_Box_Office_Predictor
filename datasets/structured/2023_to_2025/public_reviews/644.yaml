title: 'Re: [好雷] 《旅人所嚮》A Traveler''s Needs'
content: '幾週前在國資圖電影院看過

  很喜歡洪常秀拍的文藝片

  以前很喜歡鄭在詠演的片

  才看了【這時對，那時錯】

  第一次看洪導的片就入坑



  我看雨蓓很常跟洪導合作

  查維基好像已經合作了三部

  這部應該是第三部作品

  台灣導演趕快找她拍戲

  她好像很想演台灣國片


  裡面雨蓓很喜歡喝

  韓國的生馬格利酒

  今天才知道還有生的

  出口到國外都要高溫殺菌

  不然會壞掉，所以要喝生的

  只能在韓國才喝的到

  除非在法國蓋酒廠

  才能喝到生馬格利


  台灣是原住民小米酒

  兩種是一樣的東西

  還便宜一點


  我敢說這片馬格利一定有投資

  用這片打廣告想打入歐洲市場

  把韓國酒外銷到法國去蓋酒廠


  洪導的片都很平平淡淡

  大部分都在看演員聊天

  一聊就聊半個多小時

  算是非常省錢的導演

  大概只要付大明星的錢就好

  不用任何特效美術的劇情片


  這戲雨蓓跟韓國年輕人相愛

  老少配被對方媽媽反對

  很像鋼琴教師的劇情

  大概被成名作定型了


  洪長秀跟蔡明亮、侯孝賢

  北野武、楊德昌、賈樟柯

  是枝裕和等三大影展導演

  都算常拿獎的國際大導演


  他們拍藝術片的錢好像

  都來自歐洲的貴族一樣

  所以不用擔心票房隨便拍

  最好拍的越看不懂越沒人看越好

  反正投資方滿意就會再給錢拍片

  他們就能靠拍這些小成本片養家

  主要是影展的投資人愛看

  我看黑澤明大概也是這類


  所以他們不用拍商業片就能活

  像張作驥也是，如果拍賣座片

  可能金主就不給錢了

  看你可以靠觀眾發財

  就不用靠金主維生了


  但如果賠錢就兩頭空

  所以還是拍一輩子文藝片

  對生活比較有保障一點

  才不會妻離子散流落街頭

  像魏導澎導一樣負債上億


  還有雨蓓鋼琴彈那麼棒

  直笛吹那麼爛蠻有趣的

  難怪能吸引韓國小鮮肉




  --'
