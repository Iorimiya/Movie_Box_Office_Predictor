url: https://www.ptt.cc/bbs/movie/M.1765293711.A.7E3.html
title: '[好雷] 《旅人所嚮》A Traveler''s Needs '
content: "南韓導演 洪常秀 勇奪  柏林影展評審團大獎 之作\n\n法國影后 伊莎貝雨蓓 主演\n\n\n去年台灣十二月多上映的電影\n目前有些串流看的到\n\
  \n\n\n\n\n雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\
  \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n (刊登於網誌的原文，有圖片參考)\n\
  \n\n\n伊莎貝雨蓓飾演無目的之法國旅者，在南韓東方國家看似閒人，怪人，命定體現東西方差\n異，看似教授法文換取生活費，實際是展現某種法式浪漫生活態度，好比問著彈奏樂器時\n\
  感受到的深度，在在提醒的西方哲學性，探討事物本質，尤其是法德區域為主的歐陸哲學\n更是不斷質疑著何謂哲學、何謂思考。\n\n\n電影以《逃走的女人》同樣的類公路電影，三次相遇，三段故事，相互連結。一開始還懷\n\
  疑著本片引用韓國著名詩人尹東柱的詩句，在如此恢弘的文字中，劇情又暗地佈置著那些\n看似熟悉的洪常秀式庸俗對話與調侃是不是顯得有力未逮？\n\n\n直到後來巧遇而收留伊莎貝雨蓓的南韓男子之間的忘年之交，被其男子媽媽意外探訪發現\n\
  其兒子對法國女子的嚮往，並在兩人激動對話中釐清，法式藝文的「真誠生活」，與一般\n人的「認真生活」之間，自己想著深受道家影響的南韓，無非是「見山還是山」的禪性思\n\
  考，同時像是更理解了洪式總是喜愛在通俗的場面中使力，不只是一種「藝術片導演」的\n自嘲，而可能是一種看待群眾的方式：在藝文族群與一般大眾之間。\n\n\n於是那尹東柱宏大的詩句深刻的思考生命感受與死亡的詩性中的藝術家個體，還能夠在電\n\
  影溢出的是：面對「眾人」，乃至於「無人」。\n\n\n因為遇到男子媽媽避免尷尬，雨蓓去外面抽菸，背景音則是類似台灣午後會出現的巷子的\n臭豆腐（或豆花）的餐車叫賣廣播聲，因為過於尋常，想到此片段呈現了一種午後時光的\n\
  恆久時間性，像是包容了所有人，同時也涵蓋著所有終會消失不見的人，如此恆常存在的\n時刻。\n\n\n\n--\n\n拉特飯 - 以商業力量進入獨立市場\n\n\
  --"
