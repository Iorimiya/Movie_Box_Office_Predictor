url: https://www.ptt.cc/bbs/movie/M.1729354852.A.759.html
title: '[好雷] 微笑2 好看好看'
content: "1. 茉莉公主真的正 演起偶像巨星來整個說服力極強\n   什麼高衩裝 帽T 各種造型都適合她\n\n2. 原本以為2hr7m的時常可以多介紹一點怪物的由來跟細節的\n\
  \   可惜都沒有 體感時間過很快 我每次瞄一下錶都發現已經過很久了\n   差強人意的地方是預告片把很多驚嚇點跟恐怖處都劇透了\n   連著劇情的過程也都劇透\
  \ 影響觀影經驗\n   等到劇情演到預告片快完之處 整部片也快完了\n\n3. 潔瑪這個橋段年初破墓演過了\n   不過老梗也是好梗 我沒意見\n\n4. 這怪物實在太強\
  \ 照這種編劇法 以後34567都可以這樣玩\n   就是演一演當作是惡夢的一部分就好\n   老實講我是不欣賞這一部分 希望這部片能停在2見好就收就好\n\n\
  5. 結尾真的有被鄉民推文猜中\n   我是到揭曉前兩分鐘才看出來\n\n6. 整體我比1喜歡 因為女主正多了 不過劇情上沒啥突破之處\n   倒是運鏡有點意思\n\
  \n--\n多打了一個1 Hehe"
