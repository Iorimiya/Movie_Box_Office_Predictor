url: https://www.ptt.cc/bbs/movie/M.1729227433.A.E3C.html
title: '[好雷] 微笑2 笑是打開收割靈魂的通道'
content: '劇情設定同第一部，沒有添加的設定或解釋，但相較第一部的女主角，這部的女主角更顯無助

  第一集女主角是心理醫生，還有個願意幫助她的前男友，了解到詛咒的運作邏輯，實質努力對抗試圖擺脫詛咒


  這一集就只是  一個字，慘


  這部片從頭到尾都維持沈重的步調，畫面音效都是，但我不喜歡這樣，特別是它的JS有點過多

  有趣的創意的JS會讓你會心一笑（好比閨蜜在床上那段），但無意義且好預測的JS會讓我有種「欸又要來了」的厭煩感


  片長兩個小時多，因為劇情並沒有太過出乎預料的部分，所以導演用了滿滿的音效跟JS維持觀眾的緊繃感（避免你看到一半睡著）

  但或許這樣的安排，很符合女主角當下的心境，導演應該是想讓觀眾感受到她的無助孤立

  因為基本上，她後續遇到的人事物都無法辨認真假，疼痛無法讓她回到現實，她應該是到死都無法釐清自己的情況


  雖然我不喜歡這種沒有舒緩的壓迫感，但或許比較喜歡老恐怖的觀眾會很享受，這是近年少見的恐怖佳作









  劇情雷















  1、女主角自始終沒有擺脫超自然生物的控制，她唯一的生機是第一次跟陌生人見面並且接受他的方案 但她沒有


  2、為什麼會微笑？ 怪物玩夠了，吞噬完你的痛苦後，它會拉開你的嘴角進去你的身體，收割你的靈魂，原來這才是微笑的原因

  -----

  Sent from JPTT on my iPad


  --'
