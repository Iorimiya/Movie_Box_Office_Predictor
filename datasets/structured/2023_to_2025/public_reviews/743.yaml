url: https://www.ptt.cc/bbs/movie/M.1729315477.A.E8D.html
title: '[討論] 微笑2的結局(有雷)'
content: '----防雷---




























  以往都是一個人看到原宿主微笑自殺的畫面，


  這次是一群人看到原宿主微笑自殺，如果演唱會還有賣直播票的話


  那連網路上的觀眾也都看到了。



  這樣會是多人感染嗎? 還是隨機找一個運氣不好的人當下一個宿主?


  如果是前者的話，那續集就可以玩得更大了


  按照一周內為一個周期來算的話，1場演唱會假如保守算1萬名觀眾


  1個月至少4萬人死，一年就接近50萬人了。


  如果多人感染成立的話，那又會死更多人。



  續集反而會變成像災難片那樣，大家覺得呢?
























  ----防雷結束---


  --'
