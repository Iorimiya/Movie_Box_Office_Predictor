title: '[討論]  “微笑2”  爛蕃茄開盤 82%！'
content: '「微笑2」爛蕃茄開盤，目前得到 82% 的高分！


  原本看預告整個氣氛不如第一集，想說應該又是失敗的續集爛片，沒想到目前影評人給的

  分數還蠻高的，至少應該不會是爛片了，大多數影評人讚賞女主角的演出很突出，整體也

  不輸第一集。


  這週有 微笑2、懼裂，下週還有 膾樂小丑，都是評價高的恐怖片，都值得上戲院，太爽

  了～～



