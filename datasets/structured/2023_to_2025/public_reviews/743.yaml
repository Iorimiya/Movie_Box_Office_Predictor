title: '[情報] 微笑2北美首週票房2300w'
content: '茉莉公主降肉。



  第一集微笑首週票房是2260w, 已經是超級黑馬

  全球最後收兩億多

  今年微笑2目前推是超過2300w, 把Terrifier 3壓下冠軍

  海外票房首週也共計收2300w左右, 海外開畫比第一集成長了41%



  格外一提, 年中的『長腿』首週開畫則是2240w

  也是超級贏家, 但我覺得長腿還是屌一點

  因為包含行銷成本總共不到1000w鎂



  來源：各新聞及mojo


  --

  你是說電影板吧 呵呵

  續集要賣還是比較吃香

  不過微笑2沒有長腿體感上恐怖就是了

  今年final girl都滿出來了

  霹靂嬌娃長髮還沒那麼正

  這次短髮真的驚艷

  導演可以把四個大美女(含Hailee Steinfeld不含Banks)

  拍得那麼難看也是厲害

  算賣很好了

  而長腿是真的屌 因為他是獨立製片公司

  而且10月最後一週 會在戲院重新上映慶祝萬聖節'
