url: https://www.ptt.cc/bbs/movie/M.1730507528.A.896.html
title: '[  好雷] 微笑2 令人驚艷的部分'
content: '微笑2有不少JS鏡頭，故事結構也是延續第一集，原本認為了無新意，不過看到後面改觀

  了......




























  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  從醫院那邊開始，先是女主角殺了老母到後面搶車來開，觀影當下覺得情緒很衝擊，同時

  因為女主角有意讓自己保持清醒，劇情上也有刻意著墨女主角跟怪物爭奪意識的過程，會

  讓觀眾覺得這一切都是真的，結果沒想到最後從醫院開始都是幻覺，這不就是夢中夢嗎？

  頓時有種全面啟動的感覺，算是令人滿驚豔的。


  --'
