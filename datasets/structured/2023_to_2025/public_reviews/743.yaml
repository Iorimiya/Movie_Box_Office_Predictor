url: https://www.ptt.cc/bbs/movie/M.1730136285.A.A08.html
title: '[好雷]微笑2女主角演到我真的擔心她現實精神狀況'
content: '可和上一篇搭配討論 今天看完也有同感


  微笑2女主角真的硬實力派確認


  因為這部片很長 也不像懼裂有兩個主角切換分擔


  女主角就是整整兩個小時都在演高強度情緒崩潰


  幹我覺得超屌的


  這種等級的好萊塢製作背後要調度東西更多 一定都是演好幾次


  看到最後我真的都懷疑這樣演現實精神真的不會出問題嗎 ?


  這集風格算是大轉換 無論喜不喜歡 女主角這點是超級有感的升級


  簡單講一下電影


  1跟2很明顯就是兩個規模完全不同 風格也不同的產物


  1贏在講得較清楚 壓迫感較重 有認真想要解任務


  2贏在錢堆出來的豪華質感 瘋魔式的表演


  兩部我都喜歡 但女主角真的需要放個長假什麼的


  可能會有人說演得很用力


  但我偏向沒基本功的人 再怎麼用力都無法演出這種感覺


  --'
