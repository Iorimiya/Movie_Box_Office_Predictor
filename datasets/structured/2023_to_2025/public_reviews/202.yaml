url: https://www.ptt.cc/bbs/movie/M.1754220663.A.2CD.html
title: '[請益] 那個人消失了，有雷'
content: '雷




































  雷
































  劇情基本上分三段，

  第一段就是鋪陳謎團，這段跟預告片的感覺一樣好恐怖，我很膽小所以很怕...。

  第二段翻轉急轉直下，丸子、荒川、小宮、島崎平靜圍坐，聽千尋娓娓道來她和島崎的身

  分，這段非常kuso...，我心想乾，怎麼是個大爛片！

  第三段，丸子發現了人物名字所呈現的詭計，因而識破真相，使島崎得以落網，這個翻轉

  呈現了整個劇情的巧妙！


  我的問題來了。第一段時丸子的確有去找警察，但警察只說島崎是來住凶宅的搞笑藝人。

  實際上，警察真的有去島崎家訪查嗎？島崎真的說自己其實只是來住凶宅的搞笑藝人嗎？


  --

  所以是真的電影沒交待嗎？:(

  這個原因倒是有可能？

  對啊，是編的，但整個跟第一段時警察說的一樣，說島崎只是來住凶宅的搞笑呢？所以想

  說電影是不是忘了交待關於警察的真實情形？

  也對，應該真的有去吧'
