url: https://www.ptt.cc/bbs/movie/M.1754036530.A.037.html
title: '[好雷] 那個人消失了'
content: '這部和其他日片步調一樣

  從日常慢慢帶出劇情

  開頭步調緩慢

  說明主角背景、個性、生活

  中間開始帶出主題

  再來就是不斷反轉劇情

  過程穿插不少日式吐槽笑料

  講故事那段很有趣

  而且一堆吐槽點

  最後其實是悲傷的故事

  但結尾又變很歡樂

  配上澤野弘之片尾曲

  氣氛就突然熱血了起來～


  -----

  Sent from JPTT on my iPhone


  --'
