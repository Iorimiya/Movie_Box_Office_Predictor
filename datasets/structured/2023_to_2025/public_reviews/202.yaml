url: https://www.ptt.cc/bbs/movie/M.1754485682.A.134.html
title: '[好雷] 那個人消失了 層次超豐富'
content: '這部好看！

  不帶任何了解去看很驚艷！


  前面懸疑 中間好笑 後段轉折 結局感人


  通常這種風格混搭的處理不好會蠻四不像


  但這部處理沒有問題

  一百分鐘整個豐富感滿出來 優質小品


  印象中很多年沒看過這種混搭但處理不錯的日片了。通常都是單一類型比較多。


  但缺憾也是因為類型混雜，有些地方顯的較兒戲，最後兇手壓制太容易沒有真的做出高潮 。


  但搞笑部分還真的是蠻好笑就是了，染谷將太戲份超多！

  -----

  Sent from JPTT on my iPhone


  --'
