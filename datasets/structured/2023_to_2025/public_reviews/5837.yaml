title: '[請益] 你怎麼看《千禧曼波》'
content: '我想請大家坦白說，如果把導演的名字遮起來


  你會怎麼評價《千禧曼波》這部20幾年前的電影？



  我個人興趣就是在 Netflix 上面找曾經錯過的老電影來看


  所以我並非不理解以前電影的調性，而且這只是20幾年前的作品


  其實還不算真正定義上的老電影


  但是這片真的讓我困惑


  我目前看了一半，忍不住上來問問大家是怎麼看待的




  我的感覺是，侯導可能是很想拍出特定族群的迷離感、迷惘感


  但是這種感覺，是他慣用的長鏡頭無法補捉的


  像是夜店裡的陌生人爭執橋段，就冗長到讓人都替演員感到尷尬


  就是會有一種「還要演多久」的感覺


  索然無味的情侶吵架也是一樣，完全沒有推進劇情的作用


  就只是兩個演員一直跳針「打給誰」、「神經病」


  我幾乎都能感覺能感受到他們心裡想著怎麼還不喊卡的尷尬


  然後舒淇的旁白講了兩個其實蠻無聊的故事


  一個是小豪偷爸爸的錶去當，警察上門抓人


  另一個是小豪會檢查她的電話卡，看到太長的通話痕跡會質問她


  這兩件事本身就很無聊了，結果已經在旁白裡帶過還不夠


  後來還要真的演一次給觀眾看


  看到這兩段的時候我就想，咦，這不是在剛才的旁白裡交待過了嗎？




  整體來說，就是我會不太明白拍這些畫面的目的是什麼


  我理解有些導演要的不是劇情，要的是一種感覺


  但是我的觀影感受就是，連這個想要「拍出某種感覺」的意圖都是失敗的


  有時還造成一種有點尷尬的好笑感


  比如說開場不久有場床戲，鏡頭一樣定著不動很長的時間


  在演員「動作」的時候，有一個反光的閃爍燈在畫面的中央不停閃著


  可能是想拍出迷幻感吧，但我覺得那真的很像一個節拍器


  （或者更糟，像一個倒數計時器）


  讓觀眾下意識去對照男生的動作跟那個燈號的節奏


  看著就覺得有點啞然失笑




  所以我真的很想聽一下大家怎麼看待這部電影


  它的影史定位又是在哪裡


  遮住導演的名字，你真的覺得這片可以嗎？


  不是要起爭議，真心求教，希望有誠懇的討論。



  ----

  Sent from  on my Samsung SM-S9380


  --'
