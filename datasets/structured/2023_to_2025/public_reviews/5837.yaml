url: https://www.ptt.cc/bbs/movie/M.1748957536.A.048.html
title: '[新聞] 北影邀電影造型師分享 解密千禧曼波、咒等片設計'
content: '北影邀電影造型師分享 解密千禧曼波、咒等片設計


  2025/6/3 13:34（6/3 14:16 更新）



  2025台北電影節「電影正發生」系列活動邀請造型指導走出大銀幕跟觀眾交流，而電影「

  請問，還有哪裡需要加強」主角服裝也將於22日至29日在中山堂光復廳展出。（台北電影

  節提供）中央社記者王心妤傳真 114年6月3日


  （中央社記者王心妤台北3日電）第27屆台北電影節今天公布「電影正發生」系列活動，

  涵蓋造型、特效化妝現場秀、造型師推薦片單等，「千禧曼波」、「咒」、「周處除三害

  」等片造型指導將分享創作理念。


  根據主辦單位提供資料，此系列的「魔法化妝間：特效化妝現場秀」29日在中山堂登場，

  由「咒」、「怪胎」造型指導董彥秀主持，並跟百嘉堂特殊化妝團隊蕭百宸、劉顯嘉及儲

  榢逸，將分別以青春搭配滄桑還有殭屍妝為北影非常新人演員張洛偍、林映彤上妝，帶領

  觀眾感受化妝品選擇、手法到妝容呈現的過程。


  另外，28日以「老狐狸」劇本與場景圖為藍本，由林芷妤、董彥秀、陳亞琦3名造型師從

  提案到發想，重現整個過程，導演蕭雅全與藝術總監王誌成也將參與活動。


  2場「電影造型論壇」也在上述2天舉行，由導演林孝謙主持，首場「從幕後到經典的造型

  之道」將邀台港資深造型指導王佳惠、吳里璐、許力文、黃文英分享經驗，從「千禧曼波

  」到「七月與安生」，從「血觀音」到「周處除三害」，分享4名巨匠的美學心法和創作

  歷程。


  另一場「造型美學的跨界對話」由王誌成、「海角七號」造型指導姚君、「返校」與「鬼

  才之道」造型指導施筱柔以及「月老」與「湄公河行動」特效化妝蕭百宸會談，探討電影

  美學的無限可能。


  另外，22日至29日在中山堂光復廳有電影造型成品展，展出「老狐狸」和「請問，還有哪

  裡需要加強」6套主要角色服裝。


  2025台北電影節將於6月20日至7月5日在中山堂、信義威秀影城、光點華山電影館舉辦。

  （編輯：謝雅竹）1140603



  新聞網址：


  --'
