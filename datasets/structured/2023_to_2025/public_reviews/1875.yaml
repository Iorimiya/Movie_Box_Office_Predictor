title: '[討論] 0.0赫茲/劫婚大作戰 iTunes NT$90 起'
content: "情報來源：\n\n\n《0.0赫茲》\niTunes NT$90\n>> \n\n《酒鬼都市女人們》百想演技派偶像鄭恩地主演同名熱門恐怖網漫改編作\n\
  ！同專研超自然現象社團夥伴，待知名廢棄靈探點憑腦波來到 0.0 MHz\n嘗試呼喚幽靈，探究是否取得陰界傳訊，倒沒料到惹來無法停止的失控暴\n走襲擊，處處危及全員存活機會。\n\
  \n《劫婚大作戰》\niTunes NT$150 (4K)\n>> \n\n《異星戰境》金球獎提名巨星珍妮佛羅培茲主演浪漫動作喜劇片！隨喬許\n杜哈莫共演準備結婚卻感情不如過往熱烈的情侶，面臨不速之客闖入島內\n\
  婚禮現場劫持親友，決定攜手想辦花招對付惡棍，踏入逐漸拾回最初相愛\n理由、不時出糗逗樂的歡樂救援戰。\n\n《手》\niTunes NT$190\n>> \n\n\
  翻拍《不要嘲笑我們的性》芥川獎入圍作家山崎直子同名小說，響應日活\n羅曼情慾電影五十周年！以話題新星福永朱梨扮起持機捕捉中年異性身影\n的上班族，本來投入忘年戀情尋求長輩代溝解法，但跟同世代同事來往愈\n\
  拉愈親近，慢慢改變心境，詮釋親密接觸環節。\n\n☆ 其他特價\n\n《魔偶奇譚：小小德意志》\niTunes NT$90\n>> \n\n《未成年愛狠大》\n\
  iTunes NT$150\n>> \n\n《劇場版 高校艦隊》\niTunes NT$150\n>> \n\n《哥吉拉：決戰機動增殖都市》\niTunes NT$150\n\
  >> \n\n《銀魂2：規矩是為了被打破而存在的》\niTunes NT$190\n>> \n\n==\n\n訂閱電影優惠樂搜搜 Telegram 頻道立即收到通知：\n\
  \n\n電影優惠樂搜搜粉絲團：\n\n\n--\n哦，其實主角鄭恩地在那之前接演《請回答1997》、《無理的前進》當第一主角，\n然後也憑《請回答1997》得百想藝術大獎電視類最佳女新人，已經是實力派大咖，\n\
  況且她近期邀約戲份都是主角等級，像《酒鬼都市女人們》出到第二季，且近期釋\n出預備新劇《日夜不同的她》私下演員合照，加上他更是 Apink 主唱，人氣是已\n\
  經出現被粉絲跟蹤又傳五百多則私訊示愛而提告這類要提防的程度。\n\n所以，要斷定《0.0赫茲》演員都是小咖的話，建議先查資料再思慮，會比較妥。"
