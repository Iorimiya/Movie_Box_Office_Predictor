url: https://www.ptt.cc/bbs/movie/M.1672845764.A.A63.html
title: '[微好雷] 意外爽片的劫婚大作戰'
content: '幸運得到特映票~ 但最近忙也沒有看劇情大鋼

  看片名以為大概又是什麼亂入搶婚的劇情

  (事實上第一幕前男友來了 我還真的以為果然來搶婚

  最後繞一圈還是覺得男主最好最愛男主對吧)

  純粹只是因為J-LO最近幾部片都覺得不錯想看

  結果卻意料之外得到一個蠻開心的夜晚


  幾個優點

  -第一段在秀J-LO的身材跟挑逗 幹你真的會覺得感同身受自己好像就是小班

  受不了那阿廝般的身材跟勾魂~ 但轉眼間你又會想到幹小班可能真的有合約

  又是一陣幫小班覺得勞碌命的悵然.............QQ


  -但其實前面有點就制式結婚當天突然雙方都發現有問題差點悔婚的老梗

  正當我覺得應該是無聊片時... 劇情開始大反轉~ "劫"是指真的有海盜來搶劫

  事實上從這角度看...可能也還是會給人不會是太新鮮劇情的預感


  大體上簡述:男女主角結婚當天被壞人入侵最後更鞏固真愛 全劇終

  你應該真的會覺得"看很好猜的老梗劇情呀"~ But... 這部妙就妙在

  大方向不新鮮 可是大多數小轉折都有出人意表的驚喜感 比如壞人的動機怎麼解梗

  這些其實都有埋很細微又合理的伏筆~ 所以揭曉時真的會想讚美編劇


  -笑點的部分也很不錯~ 除了中間有一段碎念我沒Get到點

  很久看美式喜劇片笑不太出來的我 今天居然大笑了好幾次

  也難得首映有人笑到鼓掌~ 配角群也許沒太多有名氣演員 但真的都甘草的頗好笑


  -當然~ 最大功臣還是要給J-LO跟喬許杜哈莫 兩人以前也都有喜劇底

  這部的化學效應真的挺不錯的~ 尤其J-LO拿捏的很恰如其份

  兩人固然愛情的部分郎才女貌也有點感動(是有演技的)

  但喜劇的部分 特別也拜兩人都算有動作片底子 等於是好笑台詞+動作喜劇 更添喜感~


  -不僅如此~ 這部片之所以意外的爽 是雖然本來就是加了動作的喜劇片

  但真的也沒想到後來場面會開到這麼大~有直升機有船的大對決 決戰結果還相當豪爽XD

  我幾乎都有聯想到一點點成龍 還有史密斯任務的夫妻了

  畢竟J-LO身材加上戰鬥裝扮的野性美很適合 喬許杜哈莫之前也可以說是美軍常客了


  總之~ 蠻推薦這部動作喜劇爽片的 真的能看的輕鬆又開心

  其他大片好像都在閃水之道 如果你已經看過水之道

  最近又想看些有動作場面又好笑的 可以考慮這部唷


  --'
