url: https://www.ptt.cc/bbs/movie/M.1705398110.A.895.html
title: '[爽雷] 蜂刑者 The Beekeeper'
content: '雷文防雷資訊頁







  大概也有快半年沒進電影院

  看到板上普遍好評決定給史塔森大叔一次機會XD

  上次看他演的電影

  應該已經是2015的麻辣賤諜了

  時間過得還真快








  雷

  雷

  雷









  電影的劇情大概就是

  唯一對我好的人被詐騙而自殺

  所以我要不惜一切大開殺戒復仇

  講完了

  沒錯！這才是我要看的爽片啊！


  主角背景的鋪成？

  不需要


  角色情緒的轉折？

  不需要


  劇情七彎八拐峰迴路轉？

  不需要


  縝密的劇情設定與邏輯講究？

  不需要


  強大的電影卡司怒飆演技？

  不需要


  傳達重大的道理或意義？

  不需要


  上面講到的通通都不需要不重要

  你只需要看到傑森史塔森用拳頭揍爆對方用各種花招搞死對方就好


  真的感覺好久沒有看到這樣子的電影了

  就是買完票 走進影廳坐下來

  把手機關靜音 大腦放空

  好好的享受這近兩小時的紓壓時間

  在觀影的過程時不時在心裡喊

  ：哇靠！這招好狠！

  ：喔幹！這感覺痛爆！

  ：天啊有夠帥！史塔森超強！


  為什麼特種部隊跟傭兵

  連一個養蜂人都打不贏？

  不重要 因為他是主角 實在太爽太紓壓了


  最後帶著滿足的心情跟放空完的大腦

  再出來面對一堆爛事瑣事雜事 唉QQ


  小提一下

  雖然捍衛任務3,4也是類似的風格

  不過個人覺得蜂刑者看完爽度更高

  主要還是電影時長的問題

  蜂刑者大概100分鐘左右的片長

  我覺得剛剛好 不會到爽感疲勞的程度

  在看捍衛任務4的時候就蠻明顯的

  基努李維還沒打累 我已經看累了XDD

  蜂刑者的花招也不少

  確實有種在處刑的感覺


  但我還是很喜歡捍衛任務系列啦~






  --'
