title: 'Re: [爽好雷] 蜂刑者 幾乎無冷場'
content: '唯一的小小缺憾是前半段的驚喜，一個可以拿來拍續作的題目直接搬上來


  看完也是唯一對這部分有點意見


  現任出來太快、又收得太倉促，然後直接說不插手了，有種鋪陳很大卻放了空包彈的感覺


  想想前面花了多少篇幅在鋪陳蜂刑者有多屌


  所以讓我其實一直到後面史塔森殺進派對，在跟殘兵對弈時，我都還有點期待


  是套暗號，一個反轉才發現其實蜂刑者組織早派人就在身旁、或這邊的才是真正的現任蜂刑者


  甚至總統旁邊說可以紀錄的女秘書，其實才是養蜂人這樣的設定



  不過其實也不是沒有轉圜餘地就是了


  畢竟描述到對蜂刑者下命令那邊，就只有兩段訊息、一個女殺手找上史塔森被殺、蜂刑者說保持中立


  其實一直沒說死這組織到底做了什麼


  所以如果想拍續集的話，也大可以用「蜂刑者其實根本沒派人 一直保持中立」


  或像前面有人說「故意派很瘋的去送頭」解決來演


  不過就看票房會不會讓他們想繼續拓展蜂刑者宇宙囉...


  --'
