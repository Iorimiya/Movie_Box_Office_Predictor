url: https://www.ptt.cc/bbs/movie/M.1706334312.A.88C.html
title: '[影評] 蜂刑者 (養蜂人)'
content: '這片題材是電信詐騙

  雖然美國台灣票房都不太好

  但一看就是瞄準中國市場的片


  講養蜂人史踏森是維尼熊

  大概是想把維尼熊習近平碩造成

  反詐騙超級英雄，拍習馬屁的片

  史踏森之前也去中國宣傳過

  大概也知道中國現在流行甚麼題材


  我還第一次看到白人也搞詐騙

  我以為電信詐騙是我們華人的專業

  沒想到這種犯罪文化也傳到歐美去了


  最近中國一部小成本防詐片票房冠軍

  【孤注一擲】賣了200億台幣

  但裡面沒提到詐騙來的錢流向何方

  這些錢匯流入國內的政黨用選舉來洗錢

  所以有官商包庇這犯罪產業才能生生不息


  政黨選舉需要很多錢，那錢從哪裡來 ?

  就從民間這些黃賭毒騙裡面拿錢

  就當作企業贊助的政治獻金


  傑生史塔森終於拍了一部合我胃口的題材

  老是拍打打殺殺的看多了也會膩

  但電信詐騙卻是最常看到的社會新聞


  中共外交再厲害也沒法

  一個人掃平一個柬埔寨KK園區

  跨國執法困難就只能靠史塔克自己來


  只是一群高智商的屁孩當反派不夠力

  還喜歡影帝傑瑞米艾朗當大反派

  他現在好像變大反派專業戶了


  好久沒看到的心靈捕手的學霸女主角

  這片也一樣演到美國中情局的高層

  在戲裡學歷高就是能在高層工作

  等於是美國學姊


  感覺我這樣寫應該會被噓爆

  噓的應該都是片商或詐騙集團

  因為把事實說出來會斷他們財路

  詐騙集團騙累了也是會上PTT紓壓的



  --'
