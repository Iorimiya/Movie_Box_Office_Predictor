url: https://www.ptt.cc/bbs/movie/M.1705332916.A.B42.html
title: '[無雷] 完全不用帶腦看的蜂刑者'
content: '優點


  動作戲很好看，打起來很乾淨俐落，舒服


  殺伐決斷，便當很敢給，連無辜路人也會死掉之干我屁事7414


  完全不用帶腦看，一路砍殺就完事了




  缺點


  主角威能開太大，美國特種部隊跟嬰幼兒一樣，而且還不太喜歡用槍 喜歡肉搏，終於找到比港片的香港警察還要廢的單位了


  邏輯死當，主角各種奇怪操作，像是跑到特種部隊面前挑釁幹架等，影片想要把它塑造一個非常專業的人士，可是又做一些非常不專業的高調行為




  這部戲還是蠻好看


  推薦給平常生活壓力大


  想讓腦袋徹底關機兩小時的朋友


  評分：7.4/10






  -----

  Sent from JPTT on my Google Pixel 6a.


  --'
