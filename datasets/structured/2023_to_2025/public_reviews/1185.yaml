url: https://www.ptt.cc/bbs/movie/M.1706200306.A.D78.html
title: '[普雷] 蜂刑者 (The Beekeeper) | 帥就完事了'
content: "◎ 片名：蜂刑者 (The Beekeeper)\n◎ 類型：動作/驚悚\n◎ 年份：2024\n◎ 片長：1小時45分\n◎ 分級：輔導級15+\n\
  ◎ 國別：美國\n◎ 發行：車庫娛樂\n◎ 簡介：在摯友因遭詐騙而自殺身亡後，一名過去成謎的男子克雷（傑森史塔森 飾）滿腔\n怒火地對詐騙集團展開激烈的復仇。然而，當人們發現克雷曾是祕密組織「蜂刑者」的成員\n\
  時，復仇不再只是他的私人恩怨，更是一場動搖國本的殺戮行動……。\n\n\n-\n◎ Ryan簡言之：想看傑森史塔森耍帥裝逼就來吧！不會失望的~\n-\n◎ 短評：\n\
  整部片顯而易見，就是一場為傑森史塔森打造的耍帥戲碼，開場的氛圍呈現挺不錯，偏冷的\n電影色調搭著細膩、紀實型的運鏡，很能呈現主人翁養蜂人帶點抑鬱有著許多故事的人物塑\n\
  造，但性格、情感的流露僅止於這裡而已，之後便是看一個殺人機器的多麼瘋狂多麼強大，\n還有看著反派角色們被嚇到多驚慌失措、多麼無助，\n-\n確實整部片看下來，過程是爽快的，但看完電影則會有種爽完的空虛感還有不協調感，感受\n\
  得到電影很想表達主角的情緒、故事甚至是世界觀的設定，但導演在認真將整部片佈滿著拳\n頭、子彈、血漿之下，似乎已經忘了怎麼說故事了，而主角異於常人的能力與異常的執著也\n\
  是讓人摸不著頭緒的，\n-\n本片的視覺動作、實打實且拳拳到肉的享受是無庸置疑的，但在無法引發情感共鳴、挑動觀\n眾情緒的狀態下，相對感受性的代入感、角色共感就少了許多，這類的手法，像是克里斯漢\n\
  斯沃主演的「驚天營救(Extraction)」做的就相對傑出許多，個人覺得這部分是本片「蜂刑\n者」比較可惜的地方。\n-\n◎ 綠豆糕指數：6.5塊(滿分10塊)\n\
  \n\n-Ryan的電影綠豆糕-\n一位很需要電影、小說、遊戲作為生活養分的人，\n在這裡純粹想把看過的電影都紀錄下來，以自己能無壓力的寫、大家也能輕鬆讀的半張稿紙\n\
  篇幅(但看心情啦~有時就幾句話有時可能超過)，聊聊對於電影、影集作品的一些想法、感\n受。\n\n\n\n\n\n--\nSent from my Google\
  \ Pixel 6 Pro\n\nPiTT \n\n--"
