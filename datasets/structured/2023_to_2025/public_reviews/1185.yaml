url: https://www.ptt.cc/bbs/movie/M.1712044351.A.BE6.html
title: '[普雷] 蜂刑者殺殺過癮'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  故事大致上是在描述一位退休的特務向一位老奶奶租園子飼養蜂蜜

  而老奶奶卻因為被人詐騙所有的家當而在自己的家裡面自殺

  警察通知了老奶奶的女兒(是位聯邦調查局探員)回來

  一度誤以為亞當是兇手，最後發現老奶奶是因為被詐騙而自殺

  亞當便投入了追殺詐騙人員及公司的生活。


  這篇感覺跟捍衛任務的感覺很像，一路都在殺

  還無法被幹掉的感覺，看起來十分得過癮

  看著他為了讓詐騙主腦下台，不畏權勢的一路往上殺

  是真的挺爽的！

  像放汽油燒了詐騙集團的公司


  一路找到了主要的詐騙主腦，即便是新任總統的兒子，

  他還是想要幫老奶奶討回公道


  總結就是一部爽片

  但真的很爽，有空的時候看看真的挺紓壓的

  但劇情就沒什麼深度可言了XD


  --

  就是要這麼過癮'
