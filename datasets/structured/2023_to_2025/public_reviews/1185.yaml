url: https://www.ptt.cc/bbs/movie/M.1705150985.A.AEE.html
title: '[爽好雷] 蜂刑者 幾乎無冷場'
content: '本來對這部片一無所知

  是偶然在電影版被名字吸引

  一開始還以為是養蜂的變態殺人魔



  結果看了之後才發現是變態連環殺人魔(X)



  整部作品在動作片的節奏上非常乾淨俐落

  節奏快到我這個重視邏輯的人完全放棄思考劇情

  昨天被害者出現，隔天主角就靠著自己的情報網殺到客服中心開燒



  我當時就在想哇這部片也太公式了吧

  有一種私刑教育+捍衛任務+無名弒的感覺  怎麼評價還這麼穩

  但是主角在暴力風格上別出心裁，雖然還是有鎖血跟子彈描邊的設定

  但這種片也只能這樣，畢竟傑森史塔森的作品很少受重傷



  文戲的兩個配角幾乎可以忽略，整部作品還有個特色是政治正確

  除了很多人種參演以外  (SWAT特種部隊的小隊長還是亞裔的)

  還有Boss殺手身障人士？



  唯一的小小缺憾是前半段的驚喜，一個可以拿來拍續作的題目直接搬上來

  就是反派直接找現任的蜂刑者去對付退休的，這個殺手前幾秒還被說是個瘋子

  後幾秒踩著高跟鞋出場就讓人覺得很不專業

  還在小貨車上準備了軍用的重機關槍

  重點是  她直接在加油站掃射  我當時下巴快掉下來

  瘋歸瘋  沒有你這麼瘋的  你不是蜂刑者，而是瘋行者吧

  像這種角色其實應該放到片尾前的決戰  或者是續作

  (但這一部起手設定直接殺總統兒子跟現任蜂刑者，我覺得應該不會有續作了)



  整部片最驚豔的是門口1挑多打啪特警(應該SWAT)

  還有那個電梯陷阱嚇死人，瞬間夢回惡靈古堡一

  但最後那個身障人士我還是想不起他是什麼背景

  穿的很痞，但血條倒是滿厚的


  整體來說

  這部動作片真的很爽，非常推薦也討厭詐騙集團的人去影院支持



  --

  很多貼身格鬥的場景  我是不太可能買4D啦...

  潛入海邊宴會換上西裝時，心裡面會有個聲音喊好戲上場啦

  沒說編制上有幾個  但考量到損兵折將機率太高

  公司決定袖手旁觀XD

  我覺得布魯斯威利也很棒

  但赤手空拳的光頭動作影星還真的想不到比傑森史塔森帥的

  確實人狠話不多，而且前中期堅持不用槍(頂多假他人之手掃射)

  到最後他決定要開槍時，真的嚇屎人

  片中有用出很多裸絞，超級有效(大拇指)

  下次準備好後門給他'
