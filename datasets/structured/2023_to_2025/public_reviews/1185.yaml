url: https://www.ptt.cc/bbs/movie/M.1706405322.A.958.html
title: '[普雷] 蜂刑者，不要惹beekeeper'
content: '防雷☺防雷☺

  防雷☺防雷☺

  防雷☺防雷☺

  防雷☺防雷☺

  防雷☺防雷☺

  防雷☺防雷☺

  昨天去看《蜂刑者》，行前先看過板上標題，大概知道是爽片。

  期待像《私刑教育》那樣開掛大殺特殺一波。


  該片是輔15級，片長105分鐘。

  只有幾處比較血腥的地方，會看到肉的部分，還有嗑藥橋段。

  大部分還是在槍械和打鬥上。


  故事開始是引退的傳奇蜂刑者隱居在小小的農莊中，犯罪集團惹上了他關心的人。

  一開始蜂刑者只是爆破掉犯罪集團據點，但犯罪集團的小小反抗（？）

  讓他決定開始瓦解犯罪集團的行動XD


  這次的犯罪集團選的是詐騙集團，但是這詐騙集團的事業相當清廉，做單純的詐騙，

  沒有跟毒、槍、黑社會扯上關係還可以做到全國規模。


  導致武裝守衛人力不足，要拼命找傭兵。好不容易動用到國家級武力，只能調到少數精銳。


  FBI在這裡面處於很尷尬的位子，除了被害者女兒在FBI上班，對整部戲沒有很大的影響。

  因為蜂刑者不會殺他們，他們不是他的目標，看起來他根本沒放在眼裡。

  只有與詐騙集團牽連的幹部和傭兵才會痛下殺手。


  前面都沒提過犯罪集團首腦的藥癮，看起來健健康康的，

  後面可能是為了要增加整個動作的合理性，才塞入一個藥癮。


  最後蜂刑者成功憑一己之力鏟除腐敗的蜂巢，如預期內的大殺特殺，非常爽XD

  但是沒有後續相關人員說明，沒有理念的闡述。

  只留下沈默冷酷的傑森史塔森離去的背影。


  --



  --'
