url: https://www.ptt.cc/bbs/movie/M.1740759542.A.E89.html
title: '[新聞] 傑森史塔森主演《蜂刑者》確定拍續集！另'
content: '傑森史塔森主演《蜂刑者》確定拍續集、新任導演接手！另一新作《重裝制裁》同步公開 R 級預告





  傑森史塔森（Jason Statham）、《怒火特攻隊》（Fury）導演大衛阿耶


  （David Ayer）二度聯手的動作新片《重裝制裁》（A Working Man）


  稍早釋出了 R 級尺度的第二支預告片，台美預定 03 月 28 日同步上映。



  本片改編自犯罪小說系列《Levon Cade》的第一本《Levon’s Trade》，由阿耶執導、


  席維斯史特龍（Sylvester Stallone）親自編劇並兼任製作人，


  敘述主角萊文凱德好不容易拋下過去，改行從事建築業，一心只想過簡單平靜的日子，


  做他女兒的好父親。然而，當上司的女兒珍妮突然遭到綁架之後，


  萊文不得不再次動用那些造就他成為地下世界傳奇人物的不凡技能，追查珍妮的下落。


  這趟行動引領萊文直搗犯罪陰謀的核心，卻也威脅到他平靜的新生活。





  （圖片來源：米高梅影業）


  另外，米高梅影業稍早也一併宣佈，史塔森去年和阿耶首度合拍的另一部賣座動作片《蜂刑者》


  （The Beekeeper）確定將於今年秋天開拍續集，但導演不再是阿耶，而是改由《黑夜降臨》


  （The Night Comes for Us）導演-提莫賈尚托（Timo Tjahjanto）接手操刀，


  不過首集編劇-寇特威默（Kurt Wimmer）仍會回歸執筆劇本，米高梅則依然希望阿耶能夠回歸監製。







  --'
