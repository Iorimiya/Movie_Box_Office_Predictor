url: https://www.ptt.cc/bbs/movie/M.1706640954.A.2BF.html
title: '[請益] 蜂刑者一些劇情的問題 (內有大量雷 慎)'
content: "下有劇情\n\n還未看過 避免爆雷\n\n這是防雷頁\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n首先第一個問題 史塔森殺到九星聯合總部 一棟大樓\n\n防守方有三組人馬\n\nFBI的特勤部隊\n\n總統的情夫 一個老頭 (我忘了他什麼職務)所僱的超強私人保鑣\
  \ (都是三角洲、海豹出身)\n\n最弱的大概是最後抵達的警察部隊 (?)\n\n\n\n史塔森到達大樓底部以後  用不到30秒時間將FBI的特勤們全滅了\n\n\
  然後上樓 和三角洲、海豹的混編私人部隊戰鬥\n\n這其中遇到一位很抗揍的小魔王 (僅次於片末的義肢壯漢)\n\n史塔森選擇用滅火器ＫＯ他下巴　\n\n接著是來到炸電梯橋段\n\
  \n史塔森在這裡罕見的下狠手　\n\n那群不知道什麼人　他炸了電梯弄死不少個　其中一位還被崩落的電梯攔腰斬斷　\n\n這是我想請教的第一個問題　這些被電梯弄死的是哪一方的人馬？　\n\
  \n是警察嗎？　看起來也不像　警察很末尾才來　　還是我有漏看\n\n以及史塔森為什麼要在這裡對奉命行事的公務人員下死手？\n\n他對一樓外面FBI那群都手下留情了\n\
  \n\n\n第二個問題是　蜂刑者這個秘密計畫組織\n\n感覺應該是很厲害很科技的絕密團體\n\n為何會用那種落後的　有點像第一代的蘋果電腦在辦公？　\n\n\n\
  \n第三個問題\n\n最終場的段落\n\n女主角在宴會中　誤把一位西裝光頭錯認成史塔森\n\n可是那個西裝光頭　我二刷了還是覺得　\n\n咁～　這轉過來的正面　還是很像史塔森本人　\n\
  \n那個鬍子　還有西裝的顏色　身材體型　髮型　長相\n\n也太像了吧　大家不覺得嗎？\n\n\n\n大概先這樣　有想到再補充\n\n謝謝幫忙解答的各位\n\n\
  --\n   感謝解答\n   我後來發現史塔森穿有領的搭配西裝\n   另一位穿沒領的搭配西裝\n   視感上很像就是了\n   XD  真的很像咩\n  \
  \ 我剛剛還在想傑森是誰 原來是傑森史塔森"
