title: '[爽雷] 真.詐騙死全家的蜂刑者'
content: '看了版上介紹昨天去看了

  還真的無誤完全是爽雷


  當然 他還是有一些缺點

  -老婦人被詐直接自殺實在太刻意太煽情 完全沒求救

  史塔森人就在旁邊 怎麼樣看起來都比較懂電腦吧

  老婦人沒自殺 這部應該變成變殺邊說"還我錢"吧


  -真正的直接兇手痞子哥史塔森沒第一時間好好教訓他有點氣出的不夠

  最後斷指被拖車飛走 我還覺得太便宜他了


  -最後總統都來了 結果混亂中一槍黑手兒子就這樣死了

  照理講這時候應該來一場總統跟超越體制蜂刑者的對話增加點深度跟懸疑會更好


  其他我想會有人批評但就都無傷大雅

  不外乎就是一個養蜂的把特勤隊 FBI CIA 海豹+三角洲 殺手群全部都當垃圾在輾


  整個美國都被他一個人打爆.......


  但就是因為這樣才無腦爽呀!!!


  而且因為快節奏就一直炸一直殺 你根本也只能一直沉溺在爽啦刺啦

  根本沒時間去思考"咦~ 他怎麼又直接混到辦公室跟FBI裡面的"


  反正爽嘛就當他也有神隱任務的威能囉~


  並且更因為劇情是要殺好殺滿詐騙集團 在這個時代太有感了

  相信大部分看的人也只希望看到這些詐騙仔全部被殺光 其他細節過得去就好


  很可惜的就是 其實蜂刑者這個概念很不錯

  基本上這部片根本就是過去史塔森 又是史塔森 依舊史塔森 永遠史塔森的集結

  某程度甚至把他過去作品剪一剪 補拍關於蜂刑者的概念說明 搞不好就一片了


  關於這個神秘組織的結構跟進一步說明 也都尚未揭開真相

  明明還有很大的發揮空間 票房好完全可以如大家說的

  變成另一個捍衛任務 私刑教育之類


  但他幾乎第一集就把格局寫完了QQ


  當第一集這個法外制裁者就已經把全球最不能動的人都給真.動搖國本了

  只為了維持他心目中蜜蜂們的安心生活 下一集還能演甚麼


  總不能第二集宰外星人 第三集殺進地殼把泰坦巨獸也都給宰了吧哈哈哈


  要是第一集把地方性宰了 第二集殺跨洲

  第三集再去殺總統但被蜂刑者組織反殺之類 就可以像捍衛那樣了吧

  只是一個殺狗 一個殺地方老媽媽而已


  --'
