title: '[超爽雷] 最後有點可惜的蜂刑者'
content: '雷文防雷資訊頁



















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  場次是看剛剛板橋大遠百威秀 IMAX 19:50的場次


  沒有說教 沒有聖母主角(女探員算主角嗎?

  動作場面非常迅速、流利、爽度非常高

  基本上就是為傑森史塔森量身打造的電影


  然後真的是把詐騙死全家發揮的淋漓盡致

  基本上人來就幹，無雙到底，沒在跟你屁話

  血腥場面也比我想得還多，但都不會太過


  想看壞人被打爛的這部真的必看

  下班後看完真的真心都舒爽了


  唯一可惜的是最後總統兒子死得太乾脆了

  老實講我本來會一邊嘴砲一邊把總統兒子虐死

  就跟前面幾個小BOSS一樣

  結果沒想到直接一槍把他崩了

  最後爽度應該可以疊得更高才對

  不過還是會找時間跟朋友二刷


  至於這部片應該是沒有看IMAX的必要

  看一般數位廳就足夠了


  --



  我也覺得金毛打戲是最好的 而且明明最後已經差不多了 還給他補上一拳 超爽'
