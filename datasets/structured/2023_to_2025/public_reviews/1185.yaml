title: '[好雷] 黛瑪:阿罵版「蜂刑者」教訓詐騙集團'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  黛瑪是出品於去年的小品，在爛番茄上獲得98%的好評，講述一個阿罵被詐騙集團

  詐騙，決定親自動手討回公道，改編自導演親身阿罵經歷，目前在蘋果可以低價購買


  雖然看上去好像是什麼老人家動作片，不過實際上是溫韾劇情片，不過最後還是有殺到

  詐騙集團那邊並且處罰了一下詐騙頭子啦


  整體來說是演員演技在線，配樂不錯，節奏也不錯的片，片長只有90分鐘，推薦給想看

  溫馨有趣小品的觀眾


  --

  影展和上串流不一樣

  沒事'
