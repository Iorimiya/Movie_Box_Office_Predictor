title: '[爽雷] 蜂刑者  '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~









  蜂刑者

  拳拳到肉，該斷的有斷

  該殺的不手軟

  沒有低級錯誤讓人翻白眼

  沒有凌駕人性的自以為高尚，沒有道貌岸然那一套

  從頭爽到尾


  痛扁詐騙集團 超爽

  可惜沒凌虐幕後黑手



  不過有個問題

  第一個據點的主管，主角一開始放他一命

  是知道他一定會找來嗎?

  還是當下覺得就那家公司而已





