title: '[爽雷] 就是爽片 蜂刑者 '
content: '前段不雷，給猶豫要不要看的參考



  如同其他板友說的，很傑森史塔森的片，傑森史塔森演傑森史塔森


  劇本直接放推，公式、BUG，幾乎沒邏輯


  節奏夠快，冷場點不多，武打滿滿，



  喜歡傑森史塔森或者喜歡爽爽動作片的可以放心進場。


  對故事有一點點要求的可能會失望


  認真魔人的話別進場了，你看完會比傑森史塔森還生氣










  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  開始雷


  優點前面講過了，滿滿的洞作片給想看動作片的你，養蜂人版的John Wick。節奏還算


  緊湊不拖戲。打鬥部分也OK，傑森史塔森式的俐落。



  缺點不少:


  1. FBI女超鳥，功用就是開玩笑+裝酷。老媽自殺了完全看不出半點悲傷，0演技來著。


  2. 這些在這種片不知道算不算缺點:


  劇情如免洗手遊般直接套模，公式到讓人覺得是不是其實在反諷XDD 退休政府特務，


  某天被某白目惹怒，展開復仇之路，復仇中發現敵人背後是不得了的人物......



  BUG一堆: 主角殺到詐騙總部只把房子電腦燒掉，那些當初騙他朋友錢的幫兇一副吊兒啷


  噹樣還當無辜民眾直接特赦放行??? 資深老手在大鬧一場後完全沒想到別人會復仇然後讓


  自己寶貝蜂巢就這樣被抄了??? 在第二個詐騙據點樓下跟FBI幹起來旁邊警察還什麼的都


  拍入境了沒半個人發覺??? 詐騙集團在第一個點被抄了之後居然沒有半點警覺第二個點


  沒半點準備??? 潛入總統莊園後第一件事居然是直接換西裝露臉，然後幹翻半邊天的通


  緝犯臉這樣大辣辣的露出來沒半個人發覺??? 總統莊園預期有人會突襲沒有狙擊手???


  這類型爽片的劇情大多會有bug，但這大概是少數完全放棄解釋的...劇情只是要給一系列


  的動作戲一些瞎理由，膚淺的程度跟謎片劇情有得拼 甚至直接用字卡帶過都不會比較差XDD



  3. 我還是沒辦法被說服為什麼美國總統的兒子還得那麼斜槓去經營詐騙公司...雖然劇本


  有試著解(ㄒㄧㄚ)釋(ㄅㄞ)說總統老媽選前缺競選經費差點選不上，所以孝順的兒子偷了


  CIA的程式去開詐騙公司。但是你媽已經選上了而且現在是地球上權力最大的人了耶，你


  公司還是每天費心費神去繼續經營，哇靠，這人也太認真太拼命了吧!?



  4. 蜜蜂好像只有被拿來做隱喻，也好啦，不然就變超級英雄片了。



  不過整體我不後悔買票去看，原本就預期是動作爽片了。最近傑森也有新聞說他動作片


  都自己來不用替身，希望有動作明星獎還什麼的，聽起來也是滿拼的就當作進場支持囉。


  另外，今天中午看的還有送A3海報。


  --'
