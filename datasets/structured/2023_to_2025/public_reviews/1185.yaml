url: https://www.ptt.cc/bbs/movie/M.1705662188.A.5AF.html
title: '[請益] 看完蜂刑者後對傑森史塔森的疑問(無雷)'
content: "如題 誠心發問\n\n首先講電影感想\n\n爆炸爽！！　爽到爆炸　\n\n接下來想問關於史塔森的問題　\n\n\n其實關於這位演員　不是很了解\n\
  \n我只看過浴血任務1~4裡面他的演出\n\n\n還有就是他和李連杰合演的一部動作片　\n\n以及早期他的一部片　（裡頭有很多mini cooper）\n\n\n\
  沒了　就這樣\n\n但因為蜂刑者爽到爆炸　所以起了想去回追他以前電影的念頭\n\n然後底下推文我也看了　\n\n很多人說他都在演自己\n\n別部片只不過把場景、年代、人設等等重組一下　又是一部新的片　\n\
  \n換句話說都是一直在重複　是這樣嗎？\n\n傑森史塔森總共演了幾部片？　\n\n這些片值不值得全部看一遍　請鄉親們指點一下\n\n--\n   感謝推薦\n\
  \   看久了真的越看越性格越帥\n   而且在浴血任務裡面也很有喜感\n   這比喻滿生動的 觀眾就想看他扁人啊\n   看過了...看他騎著快艇　背上背幾隻爆裂魚叉\n\
  　 臉上一副老子開掛開定了 誰都別想阻攔的模樣....\n   感謝推薦\n   謝謝大家推薦\n   可能部分有肢體斷殘的鏡頭　太過血漿了一點我猜\n　 不過沒給特寫我是覺得還好"
