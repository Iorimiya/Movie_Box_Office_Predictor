url: https://www.ptt.cc/bbs/movie/M.1705327682.A.7F6.html
title: '[ 爽 雷] 蜂刑者'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~









  1/15台中遠百威秀IMAX，無聊想看個電影解悶，威秀app看到列表有這部，維基了一下簡

  介（說是驚悚動作片？），看到是傑森 史塔森主演的，那就衝了！


  開頭是光頭移除了胡蜂（？）的巢穴，黑人阿嬤感謝之餘邀請光頭吃晚餐。 黑人阿嬤中

  了網路釣魚，帳戶瞬間清空，接著直接領便當（沒任何鋪陳就直接給自己一槍）


  光頭透過管道找到分公司直接兩桶汽油燒烤！接著開始一路無腦開扁，中間慢慢帶出BEEK

  EEPER這名號的“由來”！（原以為就單純的養蜂人而已） 看來是個虛構的體制外菁英特

  務！（所以海豹、三角洲、FBI、CIA都被光頭當曾孫爆揍XD） 中間那個女現任蜂刑者一

  度讓我以為可以跟光頭互有糾纏，例如給光頭一些傷害，結果一樣被當曾孫打-_- （所以

  組織判定不給予協助XDD）只有片尾那個義肢小boss有戳了光頭一刀（相對的給光頭“撿

  ”到手指虎，然後ko掉小頭目）最後總統兒子被一槍爆頭end


  就一如往常，很有傑森 史塔森的風格，人設可能是致敬私刑教育？（個人腦補）基本上

  整部沒尿點，這個打鬥場景完了，稍微帶點過場就換下一個打鬥場景！ 整部就是狂揍詐

  騙集團，讓人看得很爽！ 基本上這不會有續集了！ 要不要看到IMAX版？ 個人是覺得可

  以不用。光看爆揍場面就夠了，也適合拿來舒壓（讚）


  --'
