title: '[負雷] 海洋奇緣2'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看了版上諸多好雷 雖然一開始看到的影評是負面的


  昨天還是把小朋友帶去看 看完之後


  這幾年在戲院裡覺得看得有點掙扎的


  都是迪士尼...


  以下幾個我覺得失望的點 因為我是帶小孩 會以小孩的觀點來寫



  1. 劇情部分


  劇情很簡單 找到中間的島 破除詛咒 重新讓各島嶼連結起來


  但是他的故事講得很複雜 以小孩的角度有點難懂


  而且過程很簡略 唱歌帶過 就跳到下場景 整體有點空虛



  笑點或是高潮的部分也不太多 從戲院觀眾的反應就知道


  (整體笑點有印象的就水滴魚那段 和刺青轉奶頭那段...偏偏太快小孩沒看出來)


  感情戲部分 除了妹妹可愛之外 也不太引起共鳴 (舉個例 荒野機器人全部都看哭了)



  2. 節奏部分


  節奏太慢 不重要的部分很冗長 還沒看到出海 就過了快一小時


  到重點部分就開始唱歌 唱歌 唱到電影院小孩子一聽到開始唱歌就嘆氣


  爸爸坐在旁邊很緊張啊...





  --'
