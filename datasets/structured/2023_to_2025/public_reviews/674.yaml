url: https://www.ptt.cc/bbs/movie/M.1733020703.A.D9A.html
title: '[好雷] 海洋奇緣2'
content: '有部份雷





















  板上討論不少劇情


  我這邊講個遺憾


  毛伊這次的變身和第一集差不多完全一樣


  就連使用方法也是一樣


  第一集變鯨魚後掉入海中激起水攻擊


  第二集也是一模一樣


  老鷹就不用說了，根本毛伊本體


  用量之多和本體有比了




  就連鯊魚頭這梗居然也用了二次


  一次鼓勵莫娜


  一次和人拍照


  再好笑也不好笑了


  第一集是毛伊變身出了問題


  才有這意料之外情理之中的笑點


  第二集就覺得好像是個梗


  我又想不到其他笑話所以一直用


  就感覺很敷衍





  變身的貧乏


  可以看出製作方的保守


  不太敢作新的嘗試


  單純變身就有一堆東西可以玩了


  劍旗魚、章魚、水母也常在動畫出現


  也算是有戰鬥力的動物


  再來


  只能變普通動物嗎？


  不能捏他譬如小美人魚、海底總動員的角色嗎？


  動物方程市也可以啊


  模型都不用重畫還可以省點錢


  會不會比只有鯊魚頭梗可玩更好？


  且既然有鯊魚頭了


  表示合成獸奇美拉是可以作到的


  玩不出新花樣？






  其他配角太多導致戲份分散


  可合併的問題不少人提了


  發揮也不大


  那個愛生氣老先生


  有沒有在很重要嗎？


  農夫身份有發揮到嗎？


  不能讓女科學家當愛生氣嗎？


  毛伊鐵粉也沒有太大意義


  愛畫畫，就是讓改裝船的帆有多的布用？


  認真？


  如果加一個cos毛伊的屬性


  最後讓壞神誤認成毛伊


  使得毛伊、莫娜有空檔會不會更有劇情上價值？






  整體來說就是一個創新不足


  害怕嘗試


  一切都以第一集為依歸的續作


  不過劇情顺順


  簡單善惡二元我家小朋友看得很開心


  最後閃電追莫娜那段很有驚奇蜘蛛人2


  蜘蛛絲追人的既視感


  我很喜歡


  --'
