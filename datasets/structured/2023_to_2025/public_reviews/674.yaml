title: '[好雷] 五重點與《海洋奇緣2》一同連結南島語族'
content: "網頁版點這裡：\n\n\n\n\n\n\n\n\n看更多電影點這裡：\n\n\n\n\n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n迪士尼動畫電影要出續集的難度其實不高，看看那些古早的公主系列電影，有些續集都已經出到第三集了。但說到能登上大螢幕的續作，放眼望去目前也只有那位紅遍半邊天的艾莎女王有做到而已。殊不知2024年竟有另一位公主也到達了這個里程碑！今天就來聊聊這部與海洋息息相關的音樂冒險電影《海洋奇緣2(Moana\
  \ 2)》。\n\n\n重點一：第一集要補嗎？\n\n在回答這個問題前，我們必須先理解這兩集故事的差異。《海洋奇緣(Moana)》本身就是一個很完整的故事，講述主角Moana最終帶領族人擁抱大海的故事。然而《海洋奇緣2》則是開啟了一個尚未完結的新故事，除了原有的男女主角Moana跟Maui之外還新增了其他角色來增添電影的豐富度。基本上只要大概理解兩位舊角色的定位，其實也不一定要補齊前一集的內容，再加上兩集的主線任務其實不逕相同，所以真的沒必要在這點上做過多的糾結。\n\
  \n\n重點二：廢角怎麼變多了？\n\n我曾在「四重點告訴你《海洋奇緣》的迪士尼公主文化」這篇文章中提過那隻沒什麼用的吉祥物雞「Heihei」，殊不知這集竟遵循前作的傳統，加入了更多的廢角？吉祥物即便再廢也還有賣周邊的價值，但許多配角都淪為廢角的情況我還是第一次見識到？陪伴Moana出航的那些配角們大都功能單一且有些技能還與主角重複？吉祥物大部分的時間也都只會賣萌，確實無法有效地提升電影質感。其他電影的配角都能在作品中起到畫龍點睛的作用，但《海洋奇緣2》的配角真的是只能跟他們說聲「加油，好嗎？」。\n\
  \n(四重點告訴你《海洋奇緣》的迪士尼公主文化：\n )\n\n\n重點三：曇花一現的配角\n\n上一集可愛又迷人的反派「可可怪」，這集竟也加入了主角群的行列(雖然是有點半推半就啦)！最令人印象深刻的便是那隻武力超群的可可怪戰士，只可惜礙於電影篇幅的限制，我們甚至連這位戰士的名字都不知道？另外一個被浪費的角色就是女妖「Matangi」，明明有可以活捉半神人Maui的實力，卻在與Moana合唱一首「Get\
  \ Lost」之後就被神影了？雖然普羅大眾皆對這首歌曲讚譽有加，但應該還是更希望看到這些有特色的角色身後那些不為人知的故事吧，畢竟我們又不是在聽原聲帶，我們是在看電影啊！\n\
  \n\n重點四：關於歌曲分布比例\n\n載歌載舞從來都是迪士尼動畫電影的特色，但這次在電影的前半段歌曲確實出現的有些密集，不知道是不是跟劇情需要很快切入主線有關？在進入冒險劇情前Moana一首接著一首的唱歌一度讓我以為我在看歌舞劇？後半段由於劇情比較緊湊的關係，歌曲就比較沒有出現的那麼密集。當然歌曲的部分依舊維持著迪士尼應有的水準，像是Maui鼓勵Moana的歌曲以及祖先守護Moana的歌曲在版上皆有著很不錯的迴響。相信歌曲分布比例若能再均勻一些，對於《海洋奇緣2》絕對是加分的。\n\
  \n\n重點五：是多想拍第三集？\n\n是的，《海洋奇緣2》直接用一個電影片尾告訴你「我們還要拍第三集」。原以為這集的最後Moana一行人會對上終極魔王「Nalo」，殊不知我們一直等到片尾才有幸一窺Nalo的風采？究竟Maui跟Moana要如何力抗這位神明呢？我們只能將期待寄託在下一集了。另外，Moana在電影的最後獲得的新能力應該也會成為下一部作品的看點，畢竟她已經算得上是迪士尼公主界有史以來成長幅度最驚人的公主了？不過話說回來，她現在已經是「滔泰(比酋長更高階的領袖)」了耶，那這樣還能算是公主嗎？\n\
  \n\n很多人詬病《海洋奇緣2》是一部為了續集而誕生的續集，主因在於前作早已將這部作品做下了Ending。但不可否認的是，《海洋奇緣2》也確實走出了新的故事線。除了傳達「四海一家親」的理念之外，也暗喻了親情其實不會消失，只是換成其他方式陪伴的概念。Moana的奶奶就是最好的例子，明明第一集已過身，在這集卻還能瘋狂的出來刷存在感？導致我一看到海水發光的場景就會不自覺得以為奶奶又要來打嘴砲了？\n\
  \n最後，其實《海洋奇緣2》相較於《海洋奇緣》來說並沒有那麼的不堪，只是《海洋奇緣2》的成功與否必須仰賴於第三集的品質。至於電影埋下的續集梗究竟有沒有真相大白的一天，就只能夠交由票房去說話了！\n\
  \n\n\n--\n　　棒　　　　　　　　棒　棒棒棒　　　　　　　　　棒　　　棒　　　　　棒　棒\n　棒　棒　　　　　　　棒　　棒　　　　　　　　　　棒　　　棒　　　　　棒　棒\n\
  棒　　　棒　　棒　　　棒　　棒　　棒棒棒　棒棒棒　棒　棒　棒　　棒　　棒　棒　\n棒　　　棒　棒　棒　　棒　　棒　　　　棒　　　棒　棒　棒　棒　棒　棒　棒　棒\n\
