url: https://www.ptt.cc/bbs/movie/M.1733007223.A.2AC.html
title: '[新聞] 海洋奇緣2》刷新迪士尼開片票房紀錄'
content: "新聞網址：\n\n\n\n經典動畫《海洋奇緣2》在今年美國感恩節假期，創下感恩節最高票房紀錄，迪士尼透露\n，電影11月27日上映後，光是感恩節當天就達2800萬美元（約9.08億台幣）票房，超過\n\
  2019年《冰雪奇緣2》1490萬美元（約4.8億台幣），目前預測《海洋奇緣2》在假期周末\n後，很有可能進帳達2億美元（約64億台幣）票房，超過原本1.75億美元（約56億台幣）\n\
  的目標。\n《海洋奇緣》2016年推出第一部，當時締造超高人氣，根據外媒報導，這次續集上映不到\n5天，電影的全球票房累積1.096億美元（約35億台幣）。續集的開片票房更僅次於《死侍\n\
  》、《金鋼狼》、《腦筋急轉彎2》，成績亮眼；《好萊塢報導者》也指出，《海洋奇緣2\n》同時寫下迪士尼影業的最佳開片票房紀錄。\n另外，《海洋奇緣》真人版正拍攝中，主演巨石強森日前被狗仔捕捉到，穿著「肌肉裝」\n\
  扮演電影當中的主角毛伊，原本大家以為那是他的真實身材，沒想到被「抓包」其實是一\n套緊身肌肉裝。\n對此，巨石強森透露看到報導出現時，當下心想「慘了，被抓包」，不過他說，很高興服\n\
  裝做得非常真實，讓人無法一眼認出來，並提到「為了穿上這身服裝，得花上好幾小時」\n\n\nPS. 黑色星期五單日票房目前預估 5450萬美元 創下黑色星期五最高單日\n\
  \    票房紀錄\n    目前迪士尼預測北美五天 2.15-2.2億美元左右\n    很有可能創下北美五天動畫最高開票紀錄 (原來紀錄是超級瑪利歐 2.06億)\n\
  \n--"
