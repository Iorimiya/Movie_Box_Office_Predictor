url: https://www.ptt.cc/bbs/movie/M.1717041227.A.6D1.html
title: 'Re: [情報] 迪士尼動畫《海洋奇緣2》前導預告'
content: '剛剛看到有人提到說這部沒被政治正確汙染


  但本質上這部就已經很政治正確了吧


  1.少數族群


  2.女主也不是傳統的漂亮系


  3.女主不需要被拯救，反而是他拯救了男主


  最多就是沒加入明確的同性戀，或者多元性別元素而已


  這也證明了一點


  政治正確可以很好看


  少數族群也不需要佔用別人的文化


  自己的文化也可以拍得很精采





  前陣子看了公主與青蛙


  覺得滿好看的


  雖然沒有經過仔細比較過


  但應該是歌曲數量數一數二多的迪士尼動畫電影


  其實故事原作也是格林童話裡面的作品


  所以應該不意外男女主原始設定上會是白人


  但這部將之改成黑人


  但為什麼沒有小美人魚這麼讓人不悅？


  我想是因為經過有邏輯的改編


  將故事劇情設定在紐奧良


  以爵士音樂貫穿整部電影


  變成是以黑人文化來重新敘述青蛙王子的故事





  而小美人魚並沒有這樣的細心改編


  除了將艾莉兒換成黑人演員之外


  其餘的劇情跟原版的迪士尼動畫小美人魚幾乎沒有甚麼改變


  所以才會有人提出文化冒用的說法


  用了一個黑人冒用了一個白人的童話





  所以我對政治正確真的還好


  只要你電影拍得好


  譬如我看最後生還者的真人版


  因為我不是遊戲迷


  所以整部片看得很辛苦


  裡面覺得最好看的就是兩個毛毛男談戀愛的部分



  --'
