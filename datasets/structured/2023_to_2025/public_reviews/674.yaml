url: https://www.ptt.cc/bbs/movie/M.1733300026.A.540.html
title: ' [好雷] 海洋奇緣2 略遜於第一集的佳作'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  如題


  第一集滿分10分我給8分，這集大概7分吧


  略遜於第一集但仍是佳作


  對比前一個續集"腦筋急轉彎2"來說


  腦筋急轉彎2讓我有比較高的失落感




  有些人說本集歌唱的部分有點多


  農學家老頭也吐槽 "不要再唱歌了"


  但一個公主系列電影，怎可能沒有唱歌呢  所以這部份我覺得還好






  -------以下雷----------------------------
























  莫那接受先祖的使命，要當領航者去尋找世界上的其他人


  但連結世界的航路被一個叫做納洛的神所詛咒


  唯有突破這詛咒才能打破結界讓航路串聯



  蝙蝠女因為某些原因被納洛軟禁在時空之門處


  蝙蝠女知道莫那是命中註定的領航者，可以打破這個結界


  因此抓了毛伊當誘餌讓莫那受其指引而前來


  (不得不說蝙蝠女那段歌還滿好聽的)



  莫那來了後，果然成功穿越時空之門，抵達航路詛咒之處


  只要莫那抵達踏上結界所在的島嶼就可解除詛咒


  但島嶼被納洛沉入海，周圍又有閃電龍捲包圍保護


  莫那在克服困難後成功"登上"島嶼解除航路結界


  不僅成功連結到其他島嶼外的居民 (語言咁有通?)


  自己也成為了擁有刺青的半神人






  好啦簡單的說這集就是以為要玩大航海時代，


  結果陰錯陽差update成超級賽亞人




  片尾彩蛋搞得很像薩諾斯


  總之鐵定是會出第三集的



  可惜椰殼人的戲份不太多


  要不然應該是有潛力成為類似小小兵的超級配角



  另外一提，因為是跟小朋友看，所以是看中文版


  毛依與造船女的rap，以及蝙蝠女的歌聲都還滿不錯的



  --'
