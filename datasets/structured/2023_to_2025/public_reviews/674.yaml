url: https://www.ptt.cc/bbs/movie/M.1733035386.A.833.html
title: '[普雷] 海洋奇緣2在台灣是不是被低估？'
content: '看板上沒什麼人在討論這部，剛好有看到國外的新聞似乎票房很不錯

  就稍微分享一下自己的心得




  之前第一集是跟朋友去電影院看

  評價雖然不到像腦筋急轉彎那種程度的好看，但也還算好作品

  現在經過將近8年的時間出續集，就跟女朋友一起去看

  看完之後發現也是算還不錯，尤其是歌曲上的表現有驚豔到

  這次登場的新角色瑪丹姬跟毛伊的主曲都是我很印象深刻的

  很推薦大家進電影院感受一下音效的震撼感

  由於我們是看IMAX版本，聲音跟畫面特效都很滿足



  被最多人討論的應該是劇情方面，我覺得跟第一集相比不是說不行

  在劇情編排上可能是時間的關係電影前期節奏有點怪

  導致前面很快速進入到主線

  但整體故事上還算合理而且說得過去，節奏的問題到出海後就有改善

  甚至是結尾的部分表現也都算中上水準

  這次探討的核心大就是自我成長、認清自我這方面

  比起第一集這次海洋奇緣2也開始溝通更多「責任感」這部分

  可能適合親子或小朋友學習觀看，但對於我這次就相對無感


  這次看劇情發展應該是確定會有後續動作，但不確定什麼形式

  希望迪士尼能重視這個IP，我個人是真的滿喜歡整個背景設定的

  附上一張覺得很可愛的跟史迪奇的聯動海報



  --'
