url: https://www.ptt.cc/bbs/movie/M.1732806878.A.E26.html
title: '[好雷] 在海洋奇緣2中 看見冒險的勇氣'
content: '雖然當年看的第一集內容幾乎忘光

  還在沒看過預告的狀況下觀影完畢

  但眼眶還是含淚了（笑死，我都30歲老人了

  竟然又被迪士尼療癒


  先說我覺得這部核心是討論踏出舒適圈

  莫娜在使命感驅使下必須找到失落島嶼

  讓四散的族人得以重新聚首，於是挺進未知海域


  其實觀影過程我感受不大，一直到莫娜完成任務

  先人們全都聚在她身邊，才突然想起一句話

  「當你真心渴望某件事物

  「整個宇宙都會聯合起來幫助你」

  ㄇㄉ，瞬間百感交集


  我心目中一份理想的工作是適合做到退休的那種

  之前也覺得其實30歲已是腳步該穩下來的時候

  覺得不該因為想嘗試就換工作

  但同時我認為自己沒辦法一直燃燒下去

  所以很認真思考轉職

  在游移之間，朋友的朋友剛好引薦

  也聽了很多想法跟建議

  後來決定勇敢跨出去，結果順利到不行

  回頭看就就只是缺了勇氣，實在太觸

  老人真是越來越多愁善感了（嘆


  邊看邊覺得缺乏勇氣的人都應該來看看這部

  學習莫娜看到那麼多祖靈還不會害怕（誤XD

  喔然後2的歌也不錯聽，我是看中配版的

  搭配起劇情很有感，三位卡司都是唱將型，喔威喔威～


  --'
