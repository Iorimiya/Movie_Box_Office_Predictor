url: https://www.ptt.cc/bbs/movie/M.1732881873.A.EC6.html
title: '[微好雷] IMAX海洋奇緣2觀後感'
content: '以下有雷


  因為情懷和家人一起看完海洋2

  先說看完的結論

  電影節奏流暢，在第一集出現的主要角色都有成長

  音樂方面也是做得蠻洗腦的

  去廁所的時候還聽到有人在哼歌XD（而且哼得還不錯


  再來進到劇情的部分

  莫娜依然保持無所畏懼的冒險精神去探索大海

  但與這次不同的是

  她是跟著自己的族人一起去尋找四散的族人

  很欣賞她可以接受自己的天命然後去為大家爭取

  換作是我應該做不到....

  還有噗噗跟嘿嘿，兩個吉祥物應該是這部的開心果

  整趟旅途都在耍笨，很可愛XD

  差強人意的就是她的三位船員感覺好像沒幫上什麼忙


  除了莫娜以外，毛伊的心境也有所成長

  當莫娜一群人遇到怪物襲擊，差點失去他的夥伴開始為此而迷茫

  毛伊告訴她並且鼓勵她擁有堅強的意志，不要迷失自我

  這段其實蠻感人的

  但最感人的還是後面莫娜與毛伊一起成功破除詛咒

  最後失散的族人終於相聚，看完這段實在是很催淚


  還有新的反派瑪丹姬，現在應該也不能說她是反派

  我覺得她是這部最可憐、也是最有魅力的角色

  她被納諾囚禁同個地方好多年

  但看到最後感覺還沒脫離納諾的控制

  這種身不由己的感覺好像跟上班的我不謀而合


  另外也蠻推薦大家去看IMAX

  畫面精緻、美術視覺也做得很好

  整體的觀影體驗還不錯，最後還有驚喜彩蛋

  感覺是為了下一集做鋪陳？


  --'
