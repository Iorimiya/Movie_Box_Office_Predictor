url: https://www.ptt.cc/bbs/movie/M.1734789562.A.EC4.html
title: '[好雷] 海洋奇緣2--沒有政治正確的迪士尼就是強'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  其實本來是要重溫星際效應的，\n結果因為小朋友都想看海洋奇緣2所以作為爸爸只好捨棄了\n\n不過現在想想居然兩片有點類似之處??\n\n\n\n\n\n莫娜上一集是被迫出海\n\
  這一集則是成為領袖以後，為了整個族群的存續所以不得不出海\n\n其實想想族群會消失也是很久以後的事，但是能力愈大責任愈大的莫娜想很多\n因此她決定投入冒險，只為了整個族群的延續\n\
  於是離開家人踏上了未知的旅程......\n\n雖然她沒有機器人但是有雞跟豬\n雖然沒有穿過蟲洞但是有穿過神之時空門(這到底是什麼翻譯)\n\n好啦，回過來，當然我不覺得是致敬星際效應啦(純巧合而已)\n\
  \n迪士尼在冰雪2之後，陷入了政治正確的漩渦之中\n\n當時被批很慘的木蘭真人版，相比起小黑人魚跟白雪公主比起來好得太多\n曾幾何時迪士尼就變成了為了政確把劇情搞得四不像的情況\n\
  \n還好莫娜2既沒有真正的黑人(不適合吧)，也沒有白人\n也沒有LGPT，當然有一個胖子不過誰也不會覺得有違和感\n\n總之沒有政確的情況下，莫娜2的缺點雖然有\n\
  但是整體說來還是一部很好看的家庭片\n\n節奏上面是有點頭重腳輕，不過相對起莫娜在第一集出海前的處境\n第二集時她已經被眾人肯定，甚至當作救世主看待\n\n所以族群對她的重視也造成她的志向從個人轉向整個族群的興亡。\n\
  因此踏著前人的啟示就毅然決然的往前進。\n\n這次不同的是有著部族的支持，她可以得到更好的船，更多的資源\n還有沒什麼的隊友......\n\n不過整體的內容比起第1集的很多隱喻，第2集的劇情比較平鋪直述\n\
  就是一直線的達成目的即可，甚至達成目的結果有點像是摸到就可\n\n跟第一部相比，莫娜的戰鬥力又更加提升\n我看到一半的時候就覺得她的戰鬥能力大概穩進迪士尼公主前三了吧\n\
  (前二是艾莎跟木蘭)\n\n雖然說現代迪士尼公主都很有勇氣，但是莫娜的勇氣更是最中之最\n而她跟毛伊的搭配也更加成熟\n\n---\n毛伊的部分，因為大多數的梗前集都玩過了\n\
  這一集能夠表現的其實不算很多，比起前集的雙主角\n這集的毛伊更像是輔助，戲份不算特別多。\n\n---\n另外蝙蝠女的動機跟唱歌也是覺得\n(這邊是不是只為了塞一個反派進來)\n\
  \n真正的BOSS在STAFF後才現身，擺明了就是要出莫娜3\n\n看這個票房的表現我覺得應該出了也OK吧\n反正海洋探索還能搞得還很多，下一集來福爾摩沙如何??\n\
  \n---\n除了劇情算是平穩簡單以外\n\n比起莫娜1，事隔八年當然動畫的技術更進步了\n莫娜的成長在動畫中可以讓人時刻感覺這個角色的動作跟身型很像真人\n\
  不是美型而健美的身材與動作時刻展現出來\n\n觀眾可以知道她確實是身經百戰的強者\n出航時的華服，頭髮的擺動也更加的細緻。\n\n光影的變化跟前代不可同日而語\n\
  畢竟過了多年所以進步還是很多的。\n\n---\n\n總之害怕政確的觀眾可以放心觀看\n除非你覺得女主一定要是白皮公主\n莫娜真的是很有魅力的女人......嗯.......如果她還是人的話?\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n--\n \n\n--\n所以角色符合政確沒問題啊\n只要那個角色本身的型像沒改變的話\n\
  \n莫娜很有魅力啊\n以西方的角度不算黑皮吧"
