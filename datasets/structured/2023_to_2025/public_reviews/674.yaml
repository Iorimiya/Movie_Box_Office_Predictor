title: '[普無雷] 海洋奇緣2:沒期望就沒傷害'
content: '看了很多評論說留在串流就好的續集

  其實看完沒想像中的爛

  該有的大場面還是有的

  只是剩下幾乎空洞的劇情

  巨石強森仍然演得很好

  幾首歌也不錯聽

  特效也夠好

  就是某些人物煩躁到想讓他們消失

  好家在這些人出場時間都不多

  還有意義不明的反派

  也是消失得很快

  殺時間還可以


  --'
