url: https://www.ptt.cc/bbs/movie/M.1732928424.A.AB1.html
title: '[微好雷] 海洋奇緣2第一位有神格的公主？'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*\n\n\n\n~~~~~~雷文 主文分隔線\
  \ ~~~~~~\n\n先說我還是覺得第一集更好看，但第二集也還是沒讓人太失望啦。畢竟第一集我是有被Te\n kā就是Te Fiti騙到的，那種被大地之母逆襲，不就是現在的地球被大自然反撲的現象\n\
  嗎？不就是所謂的水能載舟，亦能覆舟嗎？\n\n（回到第二集）一開始海浪的環繞感就讓人目眩神迷，山與海的配合實在美麗。本人非常\n喜歡南島文化的氛圍，我認為依然有延續第一集那種美好的風格。Moana能撥開海洋這個\n\
  設定實在太愛了（某種程度堪比耶穌？）。\n\n這集也多了一些插科打諢，設定上又不會多到讓人討厭的角色。畢竟這次魯夫Moana招集\n了香吉士Kele、弗朗基Loto、索隆Moni、還有騙人布Heihei以及喬巴Pua一起前往尋找偉\n\
  大的Motufetu航道上（以上角色純屬隨意搭配，切勿計較）。\n相較第一集角色比較簡單，刻畫的可以比較清晰。這集角色相對眾多，但人物也是點到為\n止又不會太顯單薄，也會期待下一集對其他角色有更清楚的交代。特別介紹一下可愛的Si\n\
  mea，從頭到尾她笑我就跟這笑；她蹙眉我就跟著蹙眉，可愛程度也讓我懷疑，迪士尼也\n在騙人生女兒了。\n\n讓我比較想吐槽的點，可能就是神祇Nalo跟Matangi了，相較第一集也是神祇的Te\
  \ Fiti充\n滿戲劇性的反差，這集的風暴神Nalo就只是一個為壞而壞，為了推進劇情能走下去的棋子\n而已。而Matangi雖然有一些悲劇劇情的描寫，但然後，也就沒有然後了。迪士尼的反派\n\
  角色，幾乎都有著迷人的色彩，但上次的星願跟這次海洋奇緣2的反派描繪，都讓人有些\n小小失望。\n\n還有一個部分想跟大家討論，請問Moana最後也成為半神了吧？所以她算是迪士尼公主裡\n\
  第一位有神格的公主嗎？\n雖然以她特別受海洋青睞，最後也算是鬼門關前走一遭，有些特殊待遇也是合理。但拜託\n迪士尼不要因為了配上Maui，而硬要做的更動耶，Moana跟Maui只能是朋友啦！\n\
  \n還有讓我不解的是Nalo變成人形的樣子？那是黑人嗎？我以為大平洋文化為背景的作品，\n不太可能會出現其他膚色的人種耶。還有就是當Motufetu浮出水面，洋流帶來的其他人類\n\
  ，怎麼好像也有黑人？哪條洋流能把非洲人帶來太平洋？我甚至以為迪士尼要政治正確到\n其他人類會有亞洲面孔了，但還好沒出現。\n其實我是能明白迪士尼這個部分的設定啦，在保護主義盛行的後疫情時代，全球化這件事\n\
  一直在被挑戰（這也許是洋流帶來不同人種的原因？）。當然被挑戰不是壞事，才有進步\n的可能。\n\n音樂的部分也是一如既往地好聽，Moana新的I want song”Beyond”也的確讓感覺到Moan\n\
  a不同的成長。最後一首歌是在我心中，與how far i'll go並駕齊驅的We Know the Way\n竟然又出現了！給了我一個能一起合唱直到結束的好結尾\n\
  \n--"
