url: https://www.ptt.cc/bbs/movie/M.1725975608.A.016.html
title: '[新聞] 《海洋奇緣2》演員配音完成 故事比前作'
content: '《海洋奇緣2》演員配音完成 故事比前作更大




  （大紀元記者葉子杰編譯報導）當地9日，《海洋奇緣2》（Moana 2）的聯合編劇傑瑞‧

  布希（Jared Bush）在社群媒體上透露，演員的配音完成。近日，聯合導演傑森‧漢德

  表示，第二部電影故事會比前作更大。


  《海洋奇緣2》由美國女演員兼歌手奧莉伊‧卡拉瓦爾侯（Auli’i Cravalho）為女主角

  「莫娜」獻聲。週一，傑瑞‧布希在X上分享莫娜的動畫（點這看訊息）說：「你們猜怎

  麼著……無人能及的奧莉伊‧卡拉瓦爾侯，今天完成了她最後一次的音樂錄製，這也代

  表《海洋奇緣2》的演員錄音已經完成了。我等不及想要讓你們體驗華特迪士尼動畫工作

  室和這群超級巨星的驚人作品。」


  《海洋奇緣2》的預告片5月發布首支預告後，24小時內觀看次數達到1.78億次。比《腦

  筋急轉彎2》（1.57億次）和《冰雪奇緣 2》（1.16億次），以及之前任何一部迪士尼

  動畫電影都要多。


  據《ABC News》報導，最初迪士尼打算讓《海洋奇緣2》在串流媒體上播出，但後來改

  在影院上映，現在，它有可能成為秋季最賣座的大片之一。


  今年2月，導演小大衛‧德瑞克（David Derrick Jr.）和漢德宣布《海洋奇緣2》另一位

  聯合導演是達納‧勒杜‧米勒（Dana Ledoux Miller），並且米勒與傑瑞‧布希一同擔

  任聯合編劇。他們花了一年多的時間製作了這部電影。


  6日，德瑞克向《ABC》表示，他們開發了海洋奇緣的世界，這整體故事會一直延伸至後

  續的電影，並且會在大劇院裡放映，他們內部每個人都一致同意這部電影一定要搬上大

  螢幕。


  漢德補充說：「這電影故事一直都很大，就這樣一直持續越來越大。」「我們一直覺得

  《海洋奇緣2》理應搬上大螢幕，這是講故事的最佳方式。」


  談到劇情德瑞克表示，「就像第一部電影將她（莫娜）和古老傳說聯繫起來一樣，她現

  在將每個人與未來聯繫起來，所以我們在系列中增加並創造了這些新角色，我們對他們

  有了深入的了解。」


  漢德補充說：「是的，這是一項大工程，可能比我們最初想像的還要龐大，但最終我們

  還是在講同樣的故事。有很多原本被擱置一旁的角色素材，自然而然地幫助這個故事擁

  有了適當的戰鬥力。」


  《海洋奇緣2》故事中，莫娜受到先靈召喚、當上族人的領航者。為了完成先祖的遺志，

  她與夥伴們前往遠海，進入那失落已久的水域，欲將四散汪洋的族人找回來。德瑞克

  表示，「對我來說，每一位船員都能展現出原住民的天賦，這一點很重要。」


  《海洋奇緣2》2024年11月27在美國上映，11月28日在台灣上映。


  --'
