url: https://www.ptt.cc/bbs/movie/M.1735233784.A.701.html
title: '[普無雷] 【台灣超人】每件披風，都有它的承擔'
content: '‧


  超人，可以是超級人類的簡稱，也可以是超級英雄的代名詞，而在台灣的角落，卻也散落

  了許多超人，他們有些沒有健魄的體格，更沒有會飛的能力，但他們卻被稱為「台灣超人

  」，一群經歷超乎常人的困境、一群超乎常人堅韌心智的小人物；他們披著看不見的披風

  ，扛著逆風的重擔，永不放棄的嘗試起飛。



  ‧


  「台灣超人」是曲全立導演耗費數年時間，拜訪百位台灣超人的紀錄片，當中取出幾段做

  為劇情主軸，有因誤打過期疫苗而全身癱瘓的發明家，也有先天骨不全但與母親情深的小

  超人，更有一直堅守花東到府醫療的拐杖牙醫。


  這些看似被上帝開玩笑的生命鬥士，卻因為自己的自信、毅力、心志，讓上帝開了另一扇

  窗，使光線照進他們曾黑暗的人生。


  曲全立導演不斷以台灣美景穿插其中，以台灣之美帶人心之美，用以溫暖正向擁抱，接住

  每一位需要幫助的人；當然在這美麗的台灣風景之中，仍隱藏許多正陷落在困境的鬥士，

  正如曲導演所說，我們必須以善滾善，才能真正用生命想影響生命、用溫暖去包覆悲傷、

  用鼓舞去喚醒勇氣。



  ‧


  我非常喜歡孫翊倫小朋友的段落，他書寫對於母親感念的「阮的約束」裡面提到：


  “人是望子成龍、望女成鳳

  伊是望我健康、望我快樂”


  只是這看似平凡的句子，卻是孫翊倫與母親每日奢求的願望，母親為了翊倫，白了頭髮、

  多了皺紋，但母子倆卻用更堅定的心一起努力活下去，甚至約定，下輩子換翊倫做為母親

  的身份，照顧這為他操勞一生的母親。




  ‧


  最後其他數十位「台灣超人」，以一人一句人生金句方式登場，雖然在這之中看到幾位曾

  經有社會爭議的人物，我不禁懷疑起曲全立導演篩選受訪者的標準，但夜深人靜後，再細

  細回想電影的餘韻，也許「台灣超人」並不是單指身心有障礙，卻不怕逆境的勇者，而是

  只要專心不放棄做好自己堅定的目標，並用以良善的做為，去增添這世界上每一分美好，

  我想這就是台灣超人。


  謝謝曲全立導演花費10冬欸時間，踩下行動車的油門出發，這一出發就是10年，這10年來

  到過無數偏鄉小學，為這些孩童帶來了一點機會、一點啟發、一點勇氣、一點開心，這所

  有一點匯聚起來，就是孩子們的夢想願望，也培育出更多的台灣超人，並活得像光一樣。



  最後推薦電影主題曲





  ‧






  --'
