title: '[普雷] 露梁：死亡之海'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~









  戰爭場面

  服裝場景都沒話說


  但情節安排很不喜歡


  既然有兩組敵人

  第一組島津安排他們中計後

  就收尾換小西上場

  再用精神戰鬥熱血獲勝就好


  島津都中計

  （我不明白怎麼讓他誤走到海灣的？）

  被攔腰破陣

  被李舜臣船隊的側炮轟爛了

  然後前後夾擊

  還要為了貶低明軍

  拖到結束

  要貶低，後面小西軍還有機會啊


  小西也是莫名奇妙的安排

  早早發現燈火有問題

  全速前進結果還沒到

  那不如直接設計他為了個人利益放鳥

  在那玩什麼死舜臣走活行長

  我想看的是謀略

  氣氛流只能用一次啦


  李舜臣的收法知道是戲劇效果啦

  但旁邊的人說這邊危險

  要舉盾保護將軍

  結果盾牌舉超低的啊，完全沒擋住

  整個無言



  最後，找幾個真的會說中文的很難嗎？

  超出戲



  --


  有立花在

  竟然把神速拔刀讓島津秀...'
