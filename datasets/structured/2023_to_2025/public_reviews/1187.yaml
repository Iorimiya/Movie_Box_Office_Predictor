url: https://www.ptt.cc/bbs/movie/M.1705660940.A.D4B.html
title: 'Re: [中好雷]《露梁：死亡之海》東亞近世海戰顛峰之作'
content: '先講缺點，

  前面的對話文戲舖陳是太長了，我有看時間至少花了1個小時，

  我是建議類似這種戰爭片，對話10分鐘就解決掉，

  那個懷念兒子的戲碼可以把它刪除掉，

  然後一路殺到底，既然都花那麼大的成本製造戰船了，

  怎麼不讓撕殺的鏡頭再更長一些，如果1個小時

  由a船殺到z船，這樣子才精采。

  這部和拿破崙犯得錯誤是一樣的。


  至於鄧子龍就是找「朱蒙」裡的飾演解慕漱的演員主演的，

  他至少有武勇，算是編劇為了弱化明軍裡面還一點公道的地方。


  我的評價也是二大於一大於三。

  二部曲還有龜船當秘密武器的新鮮、期待感，原以為會在一就出現的。

  但這部的缺點是扮演李舜臣的演員與一、三的年紀相差太多。

  也不過才相隔7年而已。


  第一部還有日本大將武勇的展現，與李舜臣機智誘敵。


  至於目前的第三部的戰爭場面雖浩大遠甚於一、二，

  但沒安排小西軍進場，又讓明軍弱化，

  如此的作法讓我看不過穩。

  我要是編劇就會讓明軍與朝鮮軍夾攻島津，

  正當危急之際，小西軍出現了，打了個平手後離去。


  還在猶豫要不要去看第2遍，

  因為1、2的精采程度讓我覺得願意花錢進去電影院，

  至少日本這20年來並沒有這類的片子或是我不知道，


  但初次見面第1部時已經是在第四台播放了，

  所以上次2和此次去電影院花錢算是還這部片一個公道。

  說實在話，若是電影院是古早時代3、4百人廳的那種，

  看10次我也願意。


  --


  基本上和第2部的海上萬里長城比較起來，

  對我來說並沒有視覺上的特殊性。



  我認同你的看法。



  是啊。很多戰爭片都有類似的毛病。'
