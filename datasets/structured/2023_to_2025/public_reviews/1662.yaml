title: '[新聞] "正宗巨齒鯊"連鯊魚皮都黑的 網:政治正確'
content: '新聞網址：


  原標題:



  記者蕭采薇／綜合報導



  動作災難片《正宗巨齒鯊》（The Black Demon）預告公開後，立刻引起網友討論，故事

  取自墨西哥海域傳說中的真實遠古倖存巨齒鯊「黑魔鯊」，這是當地漁民口耳相傳的惡夢

  ，無數生靈因為牠而亡命海上。更有網友呼應了近來「政治正確」的議題，







  不僅如此，網友認真研究「黑魔鯊」，並分享道：「這些品種甚至可以生長至最長 150公

  尺以上！」、「因為出沒的墨西哥那一個地區有很多巨齒鯊的化石，所以他們當地人認為

  那一隻黑魔鯊，就是巨齒鯊的後裔，確實有資格叫正宗。」



  喬許盧卡斯在《正宗巨齒鯊》裡飾演石油公司的員工「保羅」，他帶著家人們到墨西哥旅

  遊，順便為公司的海上鑽油平台進行稽查，結果卻意外遇到一頭虎視眈眈的海底巨獸，而

  受困大海中央，為了拯救家人，保羅必須化身海上版「最強老爸」。



  喬許盧卡斯表示，《正宗巨齒鯊》很像史蒂芬史匹柏（Steven Spielberg）的電影，一群

  家人快快樂樂地出遊，結果意外捲入重大的危機，家人之間的情感會是一大重點，而演出

  本片最大的挑戰，就是如何表現得好像鯊魚真的在你面前。



  喬許盧卡斯透露，為了讓電影畫面更加真實，劇組真的在海上搭建了縮小版的鑽油平台，

  水裡的戲也都是在真的海裡拍攝，有時演員一天要在鹽水裡泡上八到十個小時。喬許盧卡

  斯強調，《正宗巨齒鯊》裡面只有鯊魚是假的，《正宗巨齒鯊》將於5月12日全台大銀幕

  兇猛上映。



  --'
