url: https://www.ptt.cc/bbs/movie/M.1696057320.A.D92.html
title: '[  雷] 忙著上課差點就沒有鯊魚的正宗巨齒鯊 （'
content: "雷文防雷資訊頁\n \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n \n\
  \ \n \n~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \ \n \n \n這片是一個超級標準的政確教材\n \n簡直就是花了錢上課一樣的充實感受\n \n各種你想得到的元素幾乎都塞滿了\n \n滿到連鯊魚都要沒有出場的時間了啊～\n\
  \ \n大概內容是這樣\n \n \n \n———第一節課———40分鐘\n \n———下課時間（鯊魚出來了）———5分鐘\n \n———第二節課———40分鐘\n\
  \ \n———下課時間（鯊魚出來了）———5分鐘\n \n \n \n角色部分硬要的感覺和轉折都太倉促\n \n演員演技不錯可是橋段和鋪陳都為了上課犧牲\n \n\
  之下變得非常的突兀\n \n佈景看得出來非常用心\n\n可是為了上課也沒辦法帶太多\n\n更糟糕的是恐怖和緊張感在上課的氣氛之中\n\n蕩然無存\n\n鯊魚雖然多了超能力但是由於忙著助教\n\
  \n所以也沒啥驚喜或是驚嚇\n\n畢竟是上課 安安穩穩地講完課程才是重點\n\n大概就是這樣\n\n\n下課\n\n\n--"
