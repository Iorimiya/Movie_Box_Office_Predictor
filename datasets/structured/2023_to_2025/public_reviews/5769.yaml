title: '[討論] 你的名字的彩蛋(瀧三in言葉之庭)'
content: '有雷


















  有雷
















  第一次發文還不太熟請見諒~


  看了一些關於彩蛋的文章和新聞，都沒有發現有人提到這個


  至今我總共四刷了，在我第二刷還三刷的時候，在中間後段時發現的彩蛋，


  瀧in三葉正騎著勒使的腳踏車，要去御神體找三葉in瀧時


  看到三年前三葉去東京找瀧的記憶的那段


  三葉在東京一直找不到瀧，在車站的椅子上坐著等電車


  電車來了，發現瀧在裡面，就跑到瀧所在的車廂上車


  上車後擠阿擠終於擠到了瀧面前，瀧在看小卡


  這時鏡頭拉遠照著整個車廂的這一幕讓我感到很熟悉


  (預告片一直找不到這一幕，抱歉用了盜版的圖片QQ)





  看到這一幕一直覺得好像在言葉裡看過，剛剛就打開了言葉一看






  這幕在言葉的一開始


  根本一模一樣啊


  只有有些人的衣服顏色不太一樣，還有瀧三出現在最後面這兩個地方不一樣而已!






  想不到都沒人發這個彩蛋，或是有人也有發現但沒說而已??




  --

  原來是兼用卡，我誤會了QQ

  原來是這樣 我誤會了哈哈

  誤會了qq

  應該有四，五次哈哈哈'
