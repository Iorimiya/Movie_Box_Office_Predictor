title: '[LIVE] 公視12:30追逐繁星的孩子 14:30言葉之庭'
content: '公視粉絲團

  提到 #新海誠 的動畫電影你可能不熟悉

  但說到前一陣子很紅的日本動畫『#你的名字』應該很多人看過或者也聽過...

  公視將於過年期間安排兩部新海誠的創作 #追逐繁星的孩子 及 #言葉之庭 ~~敬請期待

  !!!

  1/27(五)【新春電影院】12:30 追逐繁星的孩子 14:30言葉之庭


  《追逐繁星的孩子》是新海誠繼《秒速5公分》之後新製作的一部動畫電影，故事描述名

  叫「明日菜」的少女為了尋找曾經與自己一同度過的少年「瞬」，踏上了冒險旅程；《言

  葉之庭》則是再下一作，內容用愛情來臨前的孤獨——「孤悲」來呈現「戀愛」的主題，

  透過以成為鞋匠為目標的高中生「孝雄」與神秘的女性「百香里」在雨中的新宿御苑中相

  遇，展開了本作的故事。




  --'
