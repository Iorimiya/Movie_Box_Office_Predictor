title: '[討論] iTunes特價 情書$40/波斯語課/言葉之庭'
content: '【2021/12/21 iTunes 特價報】

  情書（NT$40）／波斯語課 ／腦筋急轉彎

  －

  昨天iTunes突然出現$40的超強特價！而且還是超經典的日本愛情神作《情書》！沒意外

  直接衝到人氣榜首，這個價格不知道會維持多久，有看到的就趕快衝了。

  －

  另外，我們這次趁空整理了幾部比較長期的特價，$90的首推巨石強森和凱文哈特哥倆好

  主演的《中央情報員》，除了笑料十足的劇本和對話之外，劇情也不馬虎，非常超值。

  $150的則是推薦以二戰納粹占領的法國為背景，真人真事改編，題材亮眼，演員情感表現

  優秀的《波斯語課》。另外《羊男的迷宮》也特價到$190元，之前沒跟到的也可以考慮入

  手。

  －

  這次iTunes聖誕節活動是以$290為主，鮮少特價，皮克斯出品的《腦筋急轉彎》是其中一

  大亮點，雖然還沒有升級4K，但想入手的還是可以斟酌看看。最後我們也整理了一些日本

  動畫，包括新海誠較少特價的幾部的作品都有小特價到$290，$90的《知道天空有多藍的

  人啊》和《玉子愛情故事》也都是非常超值的小品，可以參考看看。

  －

  以上，祝大家看片愉快。

