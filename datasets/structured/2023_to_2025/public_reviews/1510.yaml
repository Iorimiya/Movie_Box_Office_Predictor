url: https://www.ptt.cc/bbs/movie/M.1692262428.A.12E.html
title: '[普雷] 幽靈公館心得'
content: '這部電影看完感想，很像萬聖節會出現的閤家歡鬼片

  但放在這個時間播出也無不妥啦，暑假期間麻～

  看得出來是部親子家庭皆可接受的快樂鬼片

  有點惡趣味～真的有像是在樂園裡面玩鬼屋的感覺

  就是會被嚇到但不會覺得不開心，然後鬼的特效也蠻用心

  而且卡司居然還蠻不錯的，這兩年很常在大螢幕見到的Jamie Lee Curtis也在當中

  扮演天才女巫但後來被困在水晶球裡，冷面笑匠的形象好像有點適合他

  收費的橋段也是有噗疵笑出來



  主角的心路歷程也是蠻有劇情的，鬼的特效還不錯，整體的細節呈現算用心

  跟設施的還原度很高～心路歷程及背後意涵很直白

  但不會有那種硬塞道理到反感的程度，沒有心靈雞湯

  平心而論算值得一看的親子恐怖片


  笑點的部分可以預期，但即便可預期的也算好笑

  在嚇人的地方也是可以預期，這點算是我喜歡的，至少有心理準備

  我是屬於不喜歡那種突然出現為了出奇不意的鬼片類型



  小男孩的演技也挺不錯的，而且演技有點以前的年代感

  整部片也給我一種是在致敬以前那個年代的感覺

  我覺得是有一種復古感，不確定是不是要讓家長族群有共感

  很難以形容，就是我覺得艾迪墨菲來演小孩的話也是這樣演～


  這部我笑的片段不少，有很白爛梗，就閒暇娛樂消遣時看一下還不錯啦

  就屬親子類型的可愛鬼片吧

  蠻適合暑假結束前全家一起看的



  --'
