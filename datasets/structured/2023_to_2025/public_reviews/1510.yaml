url: https://www.ptt.cc/bbs/movie/M.1690687095.A.43B.html
title: 'Re: [情報] 迪士尼《幽靈公館》爛番茄開盤'
content: '幾個關於這部電影的小八卦:


  1.


  這點應該不算八卦了，算常識了，


  "幽靈公館"其實是迪士尼樂園的遊樂設施。


  眾所周知，迪士尼的大奶牛是主題樂園，


  而真正給主題樂園輸血的則是各大IP與角色故事的大規模文化傳遞，


  也就是動畫片與電影片。




  所以這就是為什麼很多人在評斷迪士尼經營狀態時，


  常常會說"電影虧損沒什麼，九牛一毛而已，真正的現金流在樂園"的時候，


  我很排斥這種想法。




  造就迪士尼的是一部叫做"白雪公主"的動畫片，


  因為這部片的成功，伴隨之後無數次的卡通與電影的成功，


  才讓爾後，迪士尼樂園成為公主夢與魔幻的樂園，


  推動迪士尼樂園後面那個發動機就是這些故事與IP，


  如果這些故事與電影開始品牌崩壞，迪士尼的樂園營收也會越來越欲振乏力，


  就像現在這樣。




  而"叢林奇航"跟"幽靈公館"也是為了維持樂園熱度而推出的電影，


  這兩樣設施的劣勢是，空有建構整個遊樂環節的故事設定與世界觀構築，


  卻都沒有一個流傳廣泛的原始故事來做遊樂設施的基底，


  迪士尼的方針於是變成了，設施沒有故事我們就創造出故事，


  然後把故事拿回去衝設施的人氣。




  "叢林奇航"確定是票房慘賠收場，但是考慮到迪士尼還百折不撓繼續推"幽靈公館"，


  除了要替自己的內容庫擴充內容之外，


  可能他們自己內部的判斷也是這樣做有助於設施人氣，


  至少有助於維持設施人氣不至於下降太多，但那是幾年前，現在又是另一個故事了。




  2.


  這部戲另一個卦應該是電影板的老板友也知道，


  就是"幽靈公館"其實之前就有拍過了，


  就是艾迪墨菲的2003年的"鬼屋"。




  不過這部當初評價不是很好，


  迪士尼的鐵粉，也就是去樂園玩設施的那群，


  並不買帳，不認為這部片有滿足致敬"原作設定"(也就是遊樂設施本身)，


  票房勉強達到製作費2倍，評分慘不忍睹，


  更號稱是艾迪墨菲砸招牌之作。




  原本來說，這個IP就不是非常好改編，


  因為這個IP說到底，就是一個樂園鬼屋的概念而已，


  你要怎麼從這個IP硬生出一整個引人入勝的故事，


  很考驗主創功力，而20年前的嘗試已經失敗了。




  3.


  因為演員工會罷工的關係，


  這部的上上週六的首映會(在加州迪士尼樂園舉行)沒有演員參加，


  所以迪士尼搞了一個很搞的辦法，


  就是把樂園中在"幽靈公館"設施扮演鬼怪的工作人員，


  以同樣的戲服，現身在首映場充場面之用，


  效果當然是慘不忍睹。




  4.


  接下來提到主創的八卦，


  這部的導演Justin Simien，本身是一個超級woke的wokie，


  我只要提到他的另一部編導製全包作品你就秒懂了:


  2014年的Dear White People，


  對，就是那齣超級woke劇，是他製作他編寫他執導的。


  黑人剝削電影有其市場，而且也不乏好作品，


  但是這麼直頭直面逼你含的剝削電影也是奇笆就是了。




  我必須強調，雖然此人往績如此，


  但這並不代表"幽靈公館"很woke，這還要實際觀賞才能驗證，


  搞不好這部並沒有什麼教育內容，單純想把一個好的娛樂驚嚇體驗帶給觀眾。


  但我是不可能去看了，你們行你們上。




  5.


  還是Justin Simien的卦，


  他的製片公司面臨破產邊緣，


  這件事情會被曝光，是因為他本人上眾籌網站發起籌募，


  名目是讓他的公司度過電影上映前的寒冬，結果其實也沒有募到多少錢。


  所以他其實是把未來賭在這部電影的票房成功上的，


  如果這部最後虧大，他沒能拿到肥美的分紅，


  那他的公司資金周轉很可能出現重大問題。




  6.


  繼承上則卦:


  他還有一個雪上加霜的困境是，


  盧卡斯影業籌劃的新戲"藍多"(主演是在"韓索羅"中出演藍多的Donald Glover)，


  本來他是編劇，結果他被換下來了，編劇改成了Glover跟他的弟弟。




  因為這樣，他還刻意上社群牢騷了一陣，


  意思是，他明白是創作決策的問題，


  但他不禁想到，會不會是他黑人與酷兒的身分，讓他被決策層排擠。


  Wokies gotta woke


  心態跟思路都是千篇一律地好猜。


  ===========================================================================



  差不多這樣，


  總之這部極大機率會慘賠，


  而檔期，看到有人談到這部的檔期因為跟驚奇隊長2互換才會這麼快上映，


  這個消息是不正確的。




  驚奇隊長2是延了起碼6次，


  從第四階段中一路延到現在第五階段中，


  最近因為罷工，竟然傳出又要從11月延到2024年，


  這則消息我是不相信的，因為宣傳都開跑了，


  連美國麥當勞的兒童餐玩具都開始供應了，


  現在說不搞了要延期上映，對驚奇2的行銷會是災難。




  實際上，這部幽靈公館原定3月上映，後來改到8月11日，


  結果又提前檔期兩個禮拜，改到7月28日，


  並沒有跟驚奇隊長2互換這一說。




  總之這部不一定難看，


  我自己是不會看就是了，板友們你行你上，


  搞不好真的不錯看也不一定，


  Good luck






  --'
