url: https://www.ptt.cc/bbs/movie/M.1690621681.A.167.html
title: '[新聞] 潔美李寇蒂斯被困水晶球 「幽靈公館」聚'
content: '新聞網址：


  潔美李寇蒂斯被困水晶球 「幽靈公館」聚集999隻鬼


  2023-07-29 聯合報記者 陳建嘉 報導



  迪士尼驚嚇喜劇新片「幽靈公館」，靈感來自於1969年首次對外開放的迪士尼主題樂園知

  名遊樂景點「幽靈公館」（Haunted Mansion），同時這也是華特迪士尼親自設計的最後

  一個遊樂設施。雖然不是首度改編成電影，但新版處處充滿驚喜特效、被喻為「會讓觀眾

  嚇到又大笑」的電影。


  該片由好萊塢新銳導演賈斯汀西米昂執導，不僅找來「神鬼奇航」團隊製作滿滿的驚嚇特

  效，還網羅包括「萬惡城市」羅莎瑞道森、「逃出絕命鎮」拉基斯史坦費爾德、「博物館

  驚魂夜」歐文威爾森、今年以「媽的多重宇宙」拿下奧斯卡女配角的潔美李寇蒂斯、「小

  飛象」丹尼德維托、「魔比斯」傑瑞德雷托等堅強陣容，一字排開氣勢相當驚人。


  電影敘述一位單親媽媽帶著兒子搬進具有古老歷史的紐奧良豪宅，但很快她便發現，豪宅

  裡不是只有人而已，還有多達999個鬼魂。為了擺脫這些超自然靈體，她開始求助各種專

  家，有牧師、通靈者、超自然專家、甚至是歷史學家，於是由各路人馬組成驅魔大隊，就

  在鬧鬼豪宅裡展開人鬼對決。


  而在迪士尼樂園裡的「幽靈公館」，雖不用讓遊客在豪宅裡打鬼，卻是樂園裡54年屹立不

  搖的遊樂設施。遊客只需乘坐遊園車，就可見到各種古怪、甚至會盯著你不放的壁畫，還

  有在餐廳裡翩翩起舞的各類鬼魂、以及有著許多會歌唱幽靈的墓地，當然宅邸裡各式復古

  的擺設，也讓這趟旅程驚喜不斷。


  在片中扮演靈媒里歐塔夫人的潔美李蒄蒂斯日前受訪就表示，她至今為止造訪迪士尼樂園

  多達3、40次，「我小時候就常去『幽靈公館』，人們會排隊進入等著被嚇，這就是一種

  懷舊之情，你看，我已經65歲了，我卻依舊記得第一次坐上遊園車的興奮感，迪士尼就是

  有這種魔力，而能夠改編成電影，也表示這些情感是特別的」。「幽靈公館」將於8月10

  日在台上映。


  --'
