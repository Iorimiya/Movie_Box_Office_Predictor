url: https://www.ptt.cc/bbs/movie/M.1691659217.A.3FD.html
title: '[普好雷] 幽靈公館 '
content: "圖文完整版：\n\n\n\n\n\n臉書專頁：\n\n\n\n\n\n\n\n\n「這裡住有999位快樂的鬼魂，你要成為第1000位嗎？」\n\n\
  \n\n如果你很喜歡迪士尼樂園，更喜歡「幽靈公館」這個經典的遊樂設施，那麼你可能有機會\n\n喜歡《幽靈公館》，但作為一部電影，《幽靈公館》反倒是不如遊樂設施本身那麼具有創\n\
  \n意與奇觀。\n\n\n\n竟然已經不是第一次翻拍的《幽靈公館》相當的「忠於原作」，你可以在裡頭看到許多來\n\n自遊樂設施的場景與角色重現，配樂也充滿致敬，如果你喜歡這個遊樂設施，的確是可以\n\
  \n會心一笑，讓回憶重返你到迪士尼樂園遊玩的那個時候，甚至也請出了裡頭著名且歷史悠\n\n久的「Hatbox Ghost」一角擔任大反派，而且還是由Jared\
  \ Leto飾演。\n\n\n\n而跟同樣是基於迪士尼樂園著名遊樂設施而改編的《叢林奇航》略略不大一樣的是，「幽\n\n靈公館」本身所具有的設定和背景故事素材略略豐富一點，而它也已經提供了一個基礎風\n\
  \n格，不需要像硬是想要把自己撐成《神鬼奇航》的《叢林奇航》一樣，膨脹出太多沒有用\n\n處的故事，《幽靈公館》很安全的把自己限縮在「鬼屋」的主題架構，走的是很傳統的「\n\
  \n搬進老宅遇到鬧鬼事件」的公式，情感則來自更老套的「喪親之痛」，希望透過聯繫陰陽\n\n兩端再見到至親，而迪士尼的調性讓遊樂設施本身本來就不走太過恐怖的路線，雖然當年\n\
  \n的確是為了增加黑暗風格吸引成年遊客而設計，但也是帶有戲謔黑色喜劇的況味。\n\n\n\n這些基礎為電影定了調，但同時也讓電影變得平平無奇。可以感受得出迪士尼認為上一部\n\
  \n《鬼屋》不是一部太好的作品，想在重拍版的《幽靈公館》一雪前恥，但太過安全保守的\n\n出牌，卻又讓這部電影陷入「其實沒什麼必要存在」的窘境，而跟原本的遊樂設施相比，\n\
  \n更是無法凸顯出設施本身所具有的創意、魅力以及恐怖和喜劇完美的平衡，反倒是襯托出\n\n了當遊客每次乘坐遊園車在「幽靈公館」晃悠的時候所感受到的驚奇和趣味體驗。而雖然\n\
  \n是有著一些設定背景，但要將這些設定都填補起來，也讓主軸的陰謀危機欠缺了不少說服\n\n力，幾位主要角色雖然看起來都是一時之選了，但實際上真正發揮功用的地方也不多。\n\
  \n\n\n《幽靈公館》的問世以及目前取得的票房成績，除了再次證明《神鬼奇航》真的是難得一\n\n見的大成功，可能也證明了「把自家遊樂園的遊樂設施改編成電影」似乎不是個真的可以\n\
  \n吸引觀眾進場的方法，即便電影本身可以算是「中規中矩」，但過於保守安全牌的情況下\n\n，反倒是令人更懷念設施本身所具有的蓬勃「生命力」，即便裡頭的主角是一堆鬼魂。\n\
  \n\n\n聽說原本這次的重啟計畫應該是要交給Guillermo del Toro執行，劇本已經寫好，連一些\n\n原案設計都已經開始動工了。結果因為迪士尼高層覺得「劇本太恐怖」而取消，輾轉成為\n\
  \n了今天的版本。這大概是迪士尼有史以來做過最愚蠢的決定之一了吧。好想看看\n\nGuillermo del Toro版本的《幽靈公館》啊。\n\n\n\n\n\
  --\n\n\n\n\n\n                     －－－\n\n--"
