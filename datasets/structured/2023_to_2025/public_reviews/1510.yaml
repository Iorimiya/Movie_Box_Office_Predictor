url: https://www.ptt.cc/bbs/movie/M.1691982941.A.C8F.html
title: '[普雷] 《幽靈公館》，你準備好當英雄了嗎？'
content: '部落格版：


  《幽靈公館》是迪士尼繼《神鬼奇航》與《叢林奇航》後又一次將迪士尼樂園中經典遊樂

  設施改編搬上大銀幕的作品，不過本人對於迪士尼樂園並沒有太大興趣，雖然去過東京迪

  士尼還有香港迪士尼，但基本上都是朋友想去所以跟著去，興致缺缺加上遊客實在太多所

  以其實很多遊樂設施都沒有玩，因此對幽靈公館這個遊樂設施本身了解並不多，過去也沒

  有看過二十年前由艾迪墨菲主演的、同樣以幽靈公館為靈感的《鬼屋》，這次《幽靈公館

  》就跟先前《叢林奇航》都是抱持著觀賞全新作品的心情進場的。先說結論的話，我個人

  覺得《幽靈公館》絕對具有一定的娛樂度，儘管當時華特迪士尼開發幽靈公館是為了吸引

  成年人客群，然而此版《幽靈公館》作為一部恐怖喜劇實在剛剛好，時而恐怖時而好笑，

  偶爾還有溫馨感人，是部相當適合闔家觀賞的作品。


  也許是《小美人魚》討論程度破表，才顯得《幽靈公館》有夠淒涼，不光是國外票房與口

  碑皆不如預期，幾乎確定將會賠本，連在台灣也不見多少討論度，所以下午四點多場次進

  場看到有快半場滿是有些意外。回到《幽靈公館》劇情上來看，我不曉得電影還原了原本

  這個遊樂設施的背景故事多少，只就我所觀賞完畢後的想法來講的話，我認為劇情是中規

  中矩，從開頭到結束基本上都能夠被預期到劇情走向，和許多同類型作品都是相同套路，

  一群人撞鬼之後組成了小團隊試圖找出並解決鬧鬼之謎，過程中有緊張時刻也有感人橋段

  ，看似得有犧牲可最後還是全員攜手擊敗最終魔王、來個圓滿結局。既然單論劇情沒有特

  色，《幽靈公館》的亮點與看點自然就落在眾角色們間的互動，以及取代了據聞被迪士尼

  認為劇本過於恐怖遭到取消的吉勒摩戴托羅的新任編劇凱蒂提波特所寫的有趣橋段與笑點

  。



  《幽靈公館》選角這部分肯定是電影的最大加分項，在主角凱斯史坦費爾德一肩扛起整部

  電影最為沉重與悲傷的情感的同時，歐文威爾森與蒂芬妮哈戴許、丹尼德維托則負責和緩

  這份沉重與悲傷的工作，他們三人分屬不同的喜劇風格，搞笑的方式截然不同可在這裡卻

  莫名的融合，不會顯得匠氣而是討喜的將每個笑點丟向觀眾，總能在恐怖或者悲傷即將太

  多時，在最適當的時間點出面和緩氣氛，讓《幽靈公館》能維持在一個剛剛好的平衡裡。

  而引發事件開端的母子檔蘿莎瑞道森與蔡斯W狄龍雖不像上述幾位有主要任務，可他們就

  像是這道菜的調味劑，用他們不論是思念已逝丈夫、父親的悲傷、面對豪宅內鬼魂侵擾的

  恐懼，還有通常時候有著的冷面笑匠性格，引出、增加這部電影更多的味道。


  「準備好當英雄了嗎？」


  就與多數迪士尼的電影一樣的，《幽靈公館》依舊是個談論關於自我成長、尋找自我價值

  的故事。來到鬧鬼豪宅的每個人，都有著自己必須面對的人生課題，這些難解課題早已在

  不知不覺間絆住了他們，走不出失去親人傷痛的班與小崔；能力與天賦遭到否定的哈莉葉

  與布魯斯；找不到生活重心與目標的肯特...，他們都在這個合作解決豪宅鬧鬼的過程裡

  ，一一收穫到各自內心渴望許久的東西，這讓他們終於都能從原地向前邁出一步，真正朝

  向新的生活前進，於是某方面來說，班等人不僅從狂普手中解救被困在這這棟豪宅裡的所

  有鬼魂，同時他們也從中解放了自己。那句本來以為就是肯特誘騙班踏入這場渾水的「準

  備好當英雄了嗎？」結果竟是解放語，解放了這棟豪宅裡的所有人與鬼。



  只是雖然《幽靈公館》用意明顯，但略顯過快的劇情節奏給人種破碎感，長達兩小時的片

  長也未能再對這些角色有更加深入的描寫，使得觀眾即便能懂得電影本意，但很難有什麼

  深刻的感觸。同理，那些被放入電影中逗樂觀眾的橋段與笑點，亦像是為了掩蓋劇情的深

  度不足，《幽靈公館》確實是部適合休假用來放鬆、連孩童都能看得開心的作品，可這就

  和當初華特迪士尼想要建造幽靈公館的初衷背道而馳，成人觀眾無法從電影感受到更多的

  刺激或者啟發，這其實是非常可惜的地方，相信若是吉勒摩戴托羅劇本為底，就會是更符

  合幽靈公館的形象的。但不得不說的是，原先我預想班的妻子艾麗莎會登場，例如在夢裡

  或是任何形式，想不到最後竟來個前面哈莉葉對班提到過的方式出現，這樣的結局還是有

  讓我感動到。


  《幽靈公館》並不會不好看，相反的它還算有趣，可就如前面提到的電影就是中規中矩，

  和多數的以抓鬼為主軸的恐怖喜劇類似，比較沒有會被記住的特點，最大優點就是眾演員

  們表現很好，讓每個被詮釋的角色都很有特色，其中也包含鬧鬼豪宅前主人葛雷西、被封

  印在水晶球裡的靈媒李歐塔，還有那些沒有名字的鬼魂，砍死五個丈夫的女人、拔槍對決

  雙亡的兄弟、夢想回到大海的漁夫等等的，算是部角色比電影更有記憶點的作品。


  --'
