url: https://www.ptt.cc/bbs/movie/M.1691235032.A.32D.html
title: '[新聞] 強尼戴普前女友加入幽靈公館 預告傻眼'
content: '強尼戴普前女友加入《幽靈公館》　預告一出傻眼：薇諾娜瑞德在哪？


  2023年08月5日 17:00


  記者蕭采薇／台北報導


  由迪士尼樂園熱門設施改編而成的電影，最成功的莫過於《》系列，如今因另一

  項熱門設施「」也將改編為電影。


  不過最讓粉絲好奇的是女星，當她的名字出現在演員陣容裡，已讓影迷情緒沸

  騰，大家不停詢問：「究竟在哪裡？」




  ▲《幽靈公館》光是演員一字排開就至少有30幾位，詮釋角色有人有鬼。（圖／迪士尼提

  供）


  與曾是好萊塢最著名的暗黑怪異情侶檔，兩人因合作《

  》結緣，後來演了迪士尼改編著名樂園景點的《》，則在《

  》裡客串了一個小角色。


  如今導演給了答案，她扮演的是個導覽員，賈斯汀西米昂說：「我對彩蛋十分痴迷，雖然

  很多客串都是小角色，但我們也希望觀眾看到他們時感到驚喜。」


  而薇諾娜的驚鴻一瞥，的確喚醒了影迷對《》的無限回憶。




  ▲潔美李蔻蒂飾演本身就是狂熱的迪士尼粉，至今為止造訪迪士尼樂園多達3、40次。（

  圖／迪士尼提供）


  《》故事改編自迪士尼樂園同名遊樂景點，該設施號稱豪宅裡裡外外就有999個

  鬼魂，其中被視為公館最邪惡存在的「帽盒靈」，是由《》演員扮演。


  「帽盒靈」的真實身份是克倫普，他出生於1900年路易斯安納州殘忍卻富有的家族，在父

  親過世後，他接管豪宅並辦了場豪奢派對，還殺害了所有的賓客，他自己也難逃一死，最

  終被困在豪宅裡繼續完成他蒐集靈魂的計畫。




  ▲單親媽媽帶著兒子搬進古宅，但很快她便發現，豪宅裡不是只有人而已。（圖／迪士尼

  提供）


  《》劇情敘述一名單親媽媽帶著兒子搬進一幢租金便宜的豪宅，但她不知房子早

  已被厲鬼霸佔，在安居樂業前，她首先必須找來各方專家為她處理群鬼問題。


  電影將在10日全台上映。


  新聞網址：
















  --'
