title: '[普雷] 意外療癒的電影 <謎樣的你 side by side>'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  原本是衝著齊藤飛鳥去看的，但意外的被坂口健太郎圈粉

  這部電影是2023 大阪亞洲電影節的閉幕片跟在2023金馬奇幻影展人氣爆棚


  男主角未山（坂口健太郎飾演）跟著他的女友詩織（市川實日子飾演）及她的女兒美美一

  同住在鄉間，未山有能夠感應到靈魂的能力，在他居住的這個鄉間，未山也常常利用這個

  能力協助村民解決疑難雜症，甚至幫助逝去的人去完成他們在過世前未完成的心願，深受

  村裡的人的喜愛





  看似美好平靜的生活，在美美(女友女兒)一語道破，未山身邊有個電視上看見的明星後，

  未山才不得不去面對他的過去，出發前往找他這個「會偶爾出現在他身邊的歌手朋友」，

  平靜的生活就開始有了不同的變化，出去了一趟回來，帶回了懷著孕的前女友莉子（齊藤

  飛鳥飾演），為了照顧她，而開始了四人一起奇妙的同居生活




  在劇情方面，從開頭的時候，男主角身邊偶爾會跟著一個金髮穿著全黑的男子時，我就在

  懷疑是不是跟看得見靈魂有關係，後面的劇情也證實了我的猜測，但比較意外的是，那個

  男子的靈魂不是已經過世的人，而是還活著，但對未山有執念的人藉由靈魂出竅一直在他

  身邊徘徊，這樣的一段劇情著實讓我感到意外



  而詩織能夠邀請莉子跟他們一起生活，照顧她到生下寶寶，也令我感到訝異，試問有人是

  可以接受男友懷著孕的前女友來家中一起生活嗎？



  但在電影中也沒有細說每個角色他們確切心中真實的想法，彷彿在這個地方，就是很純粹

  的喜歡，很單純的分享生活中的快樂，如果你沒有很糾結要去通順書裡整部片的劇情脈絡

  ，你會覺得這部電影是非常舒服療癒的


  電影的步調相較一般電影來得緩慢，但你會看到很美的風景畫面加上男女主角心曠神怡的

  顏


  沒有太多緊湊的細節劇情，很像在看一本書的大綱，電影中沒有交代完全的事情，可以由

  自己去填補那些空白


  我自己覺得是一部很特別，也很療癒的電影

  如果你不要琢磨在梳理劇情，純粹的去感受整個氛圍，會有另一種感覺！


  最後，我必須要說，電影的很多事情沒有明說，會讓人覺得突兀，結局開放性很強，對於

  劇情邏輯黨會覺得匆忙。


  真的是部吃頻率的電影，請小心服用。


  --'
