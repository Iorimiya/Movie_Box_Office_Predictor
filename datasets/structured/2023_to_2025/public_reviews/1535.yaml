title: '[?雷] 謎樣的你 Side by Side'
content: '雷文防雷資訊頁


  謎樣的你

  Side by Side

  2023日本電影

  サイド バイ サイド　隣にいる人




  未山隨著女友詩織及她的女兒同住鄉間，神秘的他有著不可思議的能力，能感知到「靈」

  的想法，有時是身分不明的靈體，有時是心願未了的亡靈，未山用這個能力治療在世傷者

  的身心，也協助村民解決疑難雜症，深受村民喜愛。他們在此安穩度日，歲月看似靜好，

  卻逐漸忘記曾經高中時代的後輩、現在成了音樂家的草鹿，以及因為某些原因不再見面的

  前女友莉子，直到某天被未山拋棄的過去竟然再度找上了他…。




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  個人滿意度65分（滿分100）。劇設及預告片畫面，對我挺有吸引力的，令我預期高，但

  看完失望的影片。


  這是一部留給觀眾自我解讀的作品？都是關於感情的……感情不僅是對活人的，也是對死

  人的。


  謎樣的你，謎樣的劇情及結局。

  坂口健太郎的自然魅力展現的影片。

  但這部片，看完，我是不喜歡的。

  但我相信，有人會喜歡這部片的。


  以下有劇透。




  很文青感的影片，許多場景令人心曠神怡。主角坂口健太郎的粉絲會喜歡？攝影畫面從頭

  到尾如詩如畫的美麗，很多綠意盎然的美麗，但是劇情對我而言，太無趣乏味了，感覺冗

  長。前半段劇設給我謎樣的你之中文片名般之朦朧美，好奇看下去，後半段實在考驗觀眾

  的耐心？我是看地不耐煩，然後結局安排，是在？


  不如拍美麗的MV短片，就好了。


  本片是吃氛圍向的電影。 一部感性的電影。是藝術電影？像很多張美麗的風景照。

  然而，就電影而言，僅憑氣氛來要求人們接受這故事，編導無異於是太沈溺於自戀了？是

  在拍坂口健太郎的寫真集？或這美麗地方的寫真集？

  主角人設的特異功能，是有趣的，但後半段就沒有太大作用了。

  我想這位導演的這部片，不合我的口味。


  一部很難讀的電影，有很多劇情留白，有些人喜歡，有些人不喜歡，我就是其中之一。


  從頭到尾都瀰漫著死亡氣息的世界。

  美麗的視覺效果和出色的背景音樂，房間的內部裝潢也很精緻。

  本片許多角色之情感的呈現，非常地平淡自然，不灑狗血。

  一開始，主角未山的現在女友詩織在意而想要買的餐桌上那盞燈，最後由未山的前女友莉

  子代勞完成？究竟有什麼劇情涵義？ 前後女友最後住在一起，且小孩都不是和未山生的

  ？


  看完本片，再度感受到不是所有預期高的人事物，都能開高走高，呵呵。



  --'
