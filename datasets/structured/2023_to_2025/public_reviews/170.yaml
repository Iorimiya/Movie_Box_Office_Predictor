title: '[普好雷] 《脫線神探》其實可以再更惡搞一點'
content: '個人很喜歡看無厘頭、爆笑、惡搞那種笑鬧喜劇，

  舉凡八九零年代港片或驚聲尖笑系列，

  亦或周星馳、金·凱瑞、亞當·山德勒等人的片子都是我複習多次的作品，

  由萊斯里·尼爾森擔綱演出的多部經典當然也不會例外，

  是以得知「笑彈龍虎榜」系列將推出由連恩·尼遜主演的續作之後，

  個人就一直頗為期待，等上映後便立刻購票一探究竟了 ww









  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  完整多圖好讀版：



  簡單結論：




  片中除了必備的眾多搞笑，

  亦保留了一脈相傳的黃色笑話與微煽情場景，

  與舊作風格算頗接近，然而可能是導演或編劇的關係，

  很多地方的演出實在.....太過認真了，因而在個人眼中，

  新一集「脫線神探」與系列舊作相較之下，

  有幾個地方讓我覺得稍遜從前:

  「笑點密度」、「笑點強度」、「笑點創意」，以及「黃色場景」。




  舊版「笑彈龍虎榜」系列雖然也會有醞釀和銜接的橋段，

  但很少持續太長時間，笑點總是一個接一個拋出來，

  讓觀眾笑到緩不過氣；然而新作就非如此，以開場的搶銀行為例，

  搶匪闖入、制服民眾、引爆保管箱、警察列陣、看到小女孩走進銀行.....

  經歷這麼多場面以後方才出現第一個搞笑橋段「小女孩撕臉變成連恩·尼遜」，

  實在拖太久了，若是以前的「笑彈龍虎榜」，

  上面這些過渡場面一定也會安插些無厘頭橋段，

  像蠢警察拉封鎖線被絆倒纏起來、身著刻板印象服裝的古怪搶匪之類，

  絕不會讓搞笑之間出現這麼長一片空白；

  而這就牽扯到了另一個我覺得不足的部份「空間上的笑點密度」:

  搶匪在銀行中的行為實在太認真了，簡直就像是在拍真實警匪片，

  然而這對後面的惡搞打鬥似乎也沒什麼加乘或反差的作用，

  既然現場人那麼多，就不該讓他們全部認真搶銀行，

  應該分一些人去做無關蠢事，讓觀眾在一個鏡頭中目不暇給、

  感受到場面的荒謬才對，就如這個在監獄中的片段：


  開始有些人在打籃球(正常)，

  後面就出現跳房子、跳繩、溜滑梯、盪鞦韆、玩搖搖馬(莫名其妙)，

  觀眾聽口白的同時背景那堆人物就在做荒謬事，

  而且還是很難一次吸收、回味才能看到細節那麼多的程度，

  另一個相同例子是聽到有炸彈而驚惶逃跑的民眾：


  雖然只有短短幾秒，卻絕不會讓眾人只是單純認真逃跑，

  反而仔細加入倒栽露出褲襪、摔桌上、跳來跳去、發瘋等橋段，

  這種仔細密集安插笑點的方式，

  我認為正是「笑彈龍虎榜」系列的經典表現風格之一，

  很可惜新版並沒有這樣的設計，

  片中在搶匪搶銀行、摔跤場與戶外觀眾失控等場面，

  都是有一大堆人可以在背景搞怪的好時機，

  偏偏讓他們認真搶劫、認真互毆，實在有些浪費。




  舊版「笑彈龍虎榜」常藉由「重複同一件蠢事但略改表現形式」來疊加笑點，

  例如法蘭克被反派抓住、嘗試磨開綁繩的橋段，

  若單純只掉一兩樣東西砸博士腦袋確實也挺好笑的，

  但這樣的話就僅止於此了，藉由不斷重複掉出不同東西，

  單純的意外便額外附加了「為啥會放這個啦」和「最好能放這麼多啦」的荒唐，

  因而從普通好笑變成了腦洞大開；

  然而新版有很多能這樣玩的橋段都嘎然而止，

  像被電動車鎖在車內跳海那段，

  經歷了氣球、養蜂人與新擋風玻璃三個笑點，固然好玩，

  但總體強度總覺得不太夠，若讓法蘭克Jr.多撞幾個不同對象，

  讓觀眾有「為啥街上會有這個啦」和「最好能撞這麼多啦」的荒唐感，

  搞笑強度應該還可以更升級.....


  除了笑點疊加稍有不足之外，滿多地方的表現方式也不太夠強烈，

  例如法蘭克Jr.獲得電動車的部份，當車子開門打中艾德Jr.後，

  觀眾應該十之七八都能想到接著是關門把艾德Jr.夾住，

  而電影也確實讓艾德Jr被夾手哀號了一陣─


  若是舊版「笑彈龍虎榜」的編劇絕不會夾隻手就滿足，

  想必會夾完手打開門，趁艾德Jr.一臉痛苦的探身進入車廂時再關起來，

  直接把他攔腰夾住、讓觀眾看他兩條腿在車外揮來揮去！

  即便只夾手，舊版編劇想必也不會放開，

  而會讓他被法蘭克Jr.拖行十幾公尺、腦袋撞幾個東西才算完，

  就如舊版這個橋段，倒車輾過諾柏之後沒有結束，

  又把他拖行一陣子那樣：




  這部片中個人最喜歡的應該就是抓到理查(電動車老闆)手下時，

  用假房間違法逼供結果被政風處釣魚，

  然後又反過來釣魚政風處的那一段，

  一層一層攤開房間的手法是我沒料想到的，十分驚喜有趣；

  但其他橋段相對就沒那麼令我驚艷了(當然還是很好笑)，

  像理查手下用熱成像儀那幕，

  雖有加入自己的巧思、並非完全借鑑「王牌大賤諜」，

  相較之下意外性卻沒那麼強，發想上有些相形見拙；

  另一個法蘭克Jr.搶用洗手間的片段也是，

  整段拖非常久、導致笑點密度稍低了些不說，

  作為重點的對空射擊居然「碰！」一聲就結束.....

  在以前可是會順便打中一個人，

  讓觀眾忍不住想吐槽「這是怎樣啦」的啊：


  好歹也讓法蘭克Jr.打爆一盞燈然後砸昏幾個人吧，

  編劇對荒唐惡搞的界線實在太低了 "orz




  新版女主角也是有和法蘭克Jr.入浴的場景啦，

  但潘蜜拉·安德森的年紀都快60了，

  輕色情的橋段實在沒什麼撩撥感.....

  當年的珍就算40幾歲，至少看起來很年輕，

  而且還真的有「滾過床單」才接海灘度假橋段，

  新版直接進入聖誕假期，節奏上有些奇怪，

  電影院中似乎就有不少人一開始看不懂怎麼回事 XD



  雖然我寫了一堆批評，

  這並不代表個人覺得這部作品不值得觀賞，

  只是因為舊作複習太多次，

  看新版每一幕都會忍不住猜測會有何等破天荒的發展，

  因此期待稍微有些高了；對於喜愛笑鬧喜劇的人，

  我還是滿推薦可以去看看，只不過個人入場的時候為平日晚上9點左右，

  全廳卻僅有20多位觀眾，在台灣的票房大概不是很好.....

  想在院線欣賞的話恐怕要抓緊時間了呢。




  --

  ‧英國、荷蘭、法國、芬蘭、俄羅斯、德國聖地巡禮！


  約束の空へ ～私のいた場所～


  --

  發現您也有po心得文，其中提到在結尾互相擁抱時，

  「如果是舊版的的話這邊應該會出現一些更誇張白爛的畫面」

  我在電影院腦中真的也想到一模一樣的事，

  覺得畫面中這麼多人卻沒在背景惡搞實在太浪費 XD

  新版真的錯過了不少可以玩的點.....

  畢竟舊作實在太經典，就算以一般笑鬧片來看合格，

  兩相對照還是有些相形見拙.....

  謝謝，我對不可能的任務沒那麼熟，原來有戲仿出處啊 XD

  好險我有坐到影廳開燈，沒錯過彩蛋 ww'
