title: '[新聞] 翻拍版《脫線神探》票房不如原作 9月上線'
content: "翻拍版《脫線神探》票房不如原作 9月上線\n\n【大紀元2025年09月01日訊】（大紀元記者葉子杰編譯報導）美國犯罪動作喜劇片《脫線\n神探》（The\
  \ Naked Gun）是《白頭神探》系列的第四部電影，截至週日（31日），北美\n上映一個月全球票房尚未突破1億美元大關，遠不如原作。預定於9月上線，11月實體發行\n\
  。\n\n據《ScreenRant》報導，1988年的《白頭神探》系列原作《笑彈龍虎榜》（The Naked\nGun: From the Files of Police\
  \ Squad!）製作成本為1,500萬美元（通貨膨脹後如今為\n4,100萬美元），全球票房收入為1.52億美元（如今4.24億美元）。《脫線神探》是該系\n\
  列的第四部電影，製作成本為4,200萬美元，初始投資與原作相同，但全球票房僅收入\n9,566萬美元。\n\n《脫線神探》劇照。（UIP提供）\n\n《脫線神探》由73歲的英國男演員連恩‧尼遜（Liam\
  \ Neeson）主演，在北美票房方面總\n收入為5,126萬美元。雖然全球票房不佳，但該片已是尼遜五年多來首部北美票房超過\n5,000萬美元的電影，尼遜上一部超過5,000萬美元的票房的電影是《MIB星際戰警：跨國\n\
  行動》（Men in Black: International，2019）。\n\n據報導，《脫線神探》需要賺取大約1.05億美元的票房才能達到收支平衡。這部電影可能\n\
  通過出租和串流平台達到盈利。近年來，好萊塢在計算電影盈虧時發生了一些變化，因為\n電影不在影院放映後，串流平台在決定盈利與否方面扮演了重要的角色。\n\n《脫線神探》在影評網「爛番茄」上獲得了88%的新鮮度評分和73%的觀眾評分。此評分對\n\
  下檔後的電影有很大的助益，當觀眾更方便觀看這部電影時，或許會願意給這部作品一次\n機會。\n\n據《ComingSoon》報導，派拉蒙影業宣布《脫線神探》於2025年9月2日起可在北美「優質\n\
  ／高端隨選視訊」PVOD（Premium Video on Demand）和Prime video等線上租借或購買影\n片。數位版還附加一小時特別內容，包括刪減片段和加長版。除線上發行外，將於11月11\n\
  日在北美發行4K超高清、藍光和DVD版本。\n\n《脫線神探》故事描述，只有一個男人擁有一套特殊的技能，他率領警察小隊拯救世界，\n那就是小法蘭克警探（尼遜 飾）。他將在《脫線總動員》一片中追隨他父親的腳步，展\n\
  開全新行動。\n\n責任編輯：蘇漾\n\n\n\n--\n                 \n   \n\n\n\n--"
