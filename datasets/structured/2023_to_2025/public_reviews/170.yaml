url: https://www.ptt.cc/bbs/movie/M.1762609641.A.154.html
title: '[普雷] 脫線神探 - 英文不夠好的人會笑不出來'
content: '今天才去二輪戲院看脫線神探，不得不說佳佳做二輪戲院也是辛苦經營，周六下午的觀影

  人數應該沒30人，當然可能是這廳輪播的電都蠻雷，尤其侏儸紀公園重生真的是爛到弱智

  。


  anyway，脫線神探在上映前就期待進戲院，只是新脫線神探的編劇太以美國通俗文化和英

  語雙關語做笑點，導致不懂的觀眾笑不出來，只有在明顯的搞笑點才有反應，這對比以前

  的脫線神探在喜劇的重點上不同，希望再有續集能考慮到不熟美式文化的觀眾。



  以下有不分電影時間雷：








  ……分雷線……









  1. 電影劇情是抄襲金牌特務嗎？主線劇情用手機傳播讓人瘋狂的音頻，還有高階人士躲

  到山洞，這和金牌特務的劇情可以說是抄襲吧，因為要說惡搞金牌特務也不像。


  2. 連恩在銀行露內褲的反差喜劇感還蠻好笑。


  3. 隨時得到的咖啡很不錯的點。


  4. 潘蜜拉在俱樂部的演唱很棒，雖然只是鬼吼鬼叫。


  5. 連恩在警局向萊斯里照片傾訴，然後一整排人都在向前集演員傾訴。


  6. 很多雙關語梗，像是take a seat結果真把椅子拿走和 UCLA （you see LA），但觀眾

  對這梗的反應就平淡很多。


  7. 雪人那段我覺蠻出戲。


  8. 我覺連恩尼遜的臉癱導致這部電影並不是那麼好笑，他和丹尼爾克雷格都屬臉癱演員

  ，而他們的喜劇都得要靠別人撐。


  9. 配角問題也蠻大，除潘蜜拉外，警局局長完全沒笑點，主角的夥伴也沒什麼表現。


  10. 我覺續集（如果還有）可以走些惡搞路線，不管是惡搞電影或政治人物甚至惡搞自己

  都蠻不錯，連恩的表情要再更浮誇，演喜劇就是要讓大家感到有趣，你在喜劇電影還擺一

  副臭臉就很難看。


  --'
