url: https://www.ptt.cc/bbs/movie/M.1755855601.A.8EB.html
title: '[ 負雷] 脫線神探'
content: '有雷

  手機排版，請見諒。




















  夏日的午後帶著老母去電影院吹冷氣

  剛好選到這部連恩爺爺的片

  知道是輕鬆喜劇類

  想說無腦放鬆可以接受

  沒想到看完真是點點點


  首先連恩爺爺感覺是個武裝技能滿點的警探，但是在銀行制服搶匪真是太扯蛋

  隨便比劃兩下搶匪就倒地，還能用嘴咬爛手槍。


  調查事故也是意興闌珊，同事放連恩爺爺的自錄完全是把連恩爺爺的形象搞到爛，吃一大

  堆熱狗堡拉肚子拿槍跟民眾搶廁所，整個就是塑造流氓警察的樣子。


  潘姐冒出來替弟弟查案，也是有點無腦無厘頭，莫名就跟連恩爺爺愛上了，在酒吧故意唱

  得很難聽的爵士樂拖壞人注意力，

  這感覺也是年輕個三十歲的二線演員做的事情，讓潘姐來有點辛苦了。


  後面兩個人渡假也是不知道怎麼的用咒語冒出個雪人，感覺是在致敬或反諷80年代情懷，

  但我覺得雪人的戲分也是浮誇，多餘的鋪陳。


  當然也是有笑點，像是所有警探在警局都有一個牌位紀念爸爸，以及潘姐到連恩爺爺家被

  壞人用熱感應監視讓人以為在壞壞

  ，這幾幕有好笑，但不超過五分鐘。


  套壞人貼身保鏢話的那幕，有點在嘲諷不可能的任務，講完關鍵字，佈景就倒下，表示為

  了欺騙人而塑造的場景，但一次兩次三次，一下同事黑連恩爺爺，一下爺爺黑同事，到底

  有幾百個佈景可以佈，局中局也太多了。


  連恩爺爺也是個碰什麼壞什麼的倒楣蛋

  試駕電動車車子還在電動站充電

  一啟動就把充電站拉到爆炸牆壁粉碎

  放出一大堆囚犯，感覺要把連恩爺爺

  塑造成地獄倒霉鬼，可是手段太浮誇了。


  還有每次到哪裡都有人獻上紙杯咖啡

  見一個人換一杯，還有超大杯

  大概是暗喻見的人事物嚴重等級吧。


  其他不一一細數了

  都是過於誇張的特效讓人傻眼

  像是從女孩變成連爺爺

  貓頭鷹帶著連爺爺飛等等


  個人覺得這部片找班史提勒跟亞當山德勒

  會比較適合

  連最後出來我媽都說

  連恩尼遜有點自砸招牌

  我只能苦笑

  也許連恩爺爺想嘗試不同戲路吧。


  有意願要看這部片的朋友請慎思。


  --'
