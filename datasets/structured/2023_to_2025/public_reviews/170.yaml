url: https://www.ptt.cc/bbs/movie/M.1756136878.A.C3A.html
title: '[好雷] 《脫線神探》劇本比連恩尼遜好笑'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  因為我實在太愛《The Naked Gun》系列(台灣三集翻譯都不一樣，以下先一律統稱《白頭

  神探》系列)，而且我們也已經很久沒有看到諧仿/惡搞喜劇了，所以當我看到《脫線神探

  》的預告時，我直接把這部電影列為了我今年最期待的電影。而且我也很喜歡阿齊瓦沙弗

  ，寂寞孤島是我一生的摯愛，我也超級喜歡他執導的《流行巨星：永不停歇》跟《救難小

  福星》，我完全相信他有能力拍好一部屬於這個世代的惡搞喜劇。

  .

  說起來，這片最大的隱憂反而是連恩尼遜，完全可以理解找他來演就是想要用他平常嚴肅

  的動作男星形象來製造反差喜感，但這樣的反差能做到的效果其實很有限，最好笑的大概

  就是宣布這件事情的時候跟第一次看到預告的時候，之後邊際遞減效應來的很快，連恩尼

  遜自己在《熊麻吉二》跟《百萬種硬的方式》裡面也拿自己的動作男星形象開玩笑過，但

  這種用現實/銀幕裡的形象開玩笑的手法只適合客串或是反派配角，要主演一部喜劇電影

  ，最終還是要考驗演員自身的喜劇表演能力。

  .

  那麼我們先講結論，這部電影跟連恩尼遜有達成他們的任務嗎？有好消息也有壞消息，好

  消息是電影確實是成功的，它夠好笑、也會讓你期待每隔幾年就看到一部續集；但連恩尼

  遜表現卻是差強人意，這是這部電影最可惜之處。

  .

  先講電影本身，《脫線神探》基本繼承了《白頭神探》系列的精神與喜劇表演風格，你甚

  至可以說它蠻復古的，我不太確定這樣的喜劇模式是否還符合現在觀眾的笑點審美，確實

  有看到一些評論覺得笑不出來，我會建議你可以先去把舊版的《白頭神探》找來看看(我

  覺得第三集比較普通，但一跟二都是可以反覆看好幾次還是一樣會大笑的)，或是去youtu

  be找些片段來看也行─我很推薦第一集一段主角在碼頭賄賂證人跟討價還價的戲，每次看

  每次笑，而且基本上可以說是定調了這系列的喜劇風格─如果你現在依然會被它逗笑，那

  恭喜你，這幾乎可以篤定你會是《脫線神探》的擁護者，但相對若是《白頭神探》的笑點

  無法讓你笑出來，那就或許不太適合。

  .

  《脫線神探》笑點之密集，幾乎是不給觀眾任何喘息空間的不斷塞笑點給你，有聰明的、

  有低級的、有胡鬧的、有無厘頭的、有肢體上的、有鏡頭語言的、有耍嘴皮子的、當然也

  有翻玩跟諧仿電影套路的，甚至一個畫面還不只會有單一笑點，就連背景都有一堆人在做

  無關緊要的搞笑動作，說它是一個尋找笑點版本的《威利在哪裡》都不為過。我朋友看完

  後針對電影中的幾個段落問我為什麼會這樣？這是什麼意思？我叫他千萬不要想這麼多，

  你光是問出這些問題就已經輸了，你對這片的邏輯有任何一秒的思考，都是對它的不尊重

  。

  .

  這樣的笑話連環轟炸，也是這種喜劇電影一向不會拍太長的原因，如果電影演太久，觀眾

  可能會感到疲乏，這些極大量的笑話有些可能有中、也有些可能沒中，也有些或許會讓你

  大爆笑，在不到一個半小時的片長內，它很可能講了超過一百個笑話，而對來放鬆大笑的

  觀眾來說，要有其中十幾個讓你笑出來，看這部電影也就值得了。

  .

  我一直覺得很多人總是會說想念那個惡搞喜劇葷素不忌，沒有政治正確的年代─其實我覺

  得沒有政治正確這個說法本身也是錯的，只是每個時代都有屬於自己的政治正確─那些人

  可能會因此期待這部電影復興那樣的喜劇，但我覺得這部電影反而打了他們的臉：《脫線

  神探》很好笑，但事實上它並沒有講什麼地獄哏、冒犯什麼族群或是講政治不正確的笑話

  ，它最敏感的可能是一個關於BLM的玩笑，但它也是以「開白人警察暴力玩笑」的形式踩

  在政治正確的安全線上。當然我並不排斥這些東西，如果講得好笑那也是種本事，但這部

  電影其實反而證明了，你並不需要這些東西，你也同樣可以讓人大笑。

  .

  不過連恩尼遜的表演終究還是可惜了，可以感受的出來他盡力想要不計形象地搞笑跟放下

  身段了，但不得不說他就是真的沒有那麼好笑、還是有點太嚴肅了。這部電影許多好笑的

  時刻終究來自文本，或是發生在剪輯跟鏡頭語言上，而不是發生在連恩尼遜身上，他的表

  演並沒有把這些笑話發揮出完全的力道。舉電影中一個最簡單的小例子，就是連恩尼遜在

  俱樂部跟丹尼休斯頓第一次見面的時候，對方喊了聲「Frank Drebin」，連恩尼遜則回他

  「Me too」，這種會錯意/已讀亂回的笑話是萊斯利尼爾森的拿手好戲，而你也完全可以

  想像他演出這個段子的樣子，光是用想像的都更好笑，連恩尼遜反而把這個笑話講冷了。

  .

  或許可以說這片最大的問題，就是它既想要萊斯利尼爾森的形象又想要連恩尼遜的形象，

  但這兩者還真的蠻衝突的。主要是這片也不是重啟，小法蘭克杜賓的人設其實沒必要刻意

  跟法蘭克杜賓/萊斯利尼爾森對齊。舊版儘管是惡搞喜劇，但法蘭克杜賓的人設其實三集

  都非常一致，認真辦案跟耍笨把所有事情搞砸，這兩者是同時發生的，但小法蘭克杜賓光

  是這集的人設就有點不斷跑來跑去的感覺，認真辦案的部分跟耍笨搞砸事情的部分，感覺

  有點像是兩個不同人格。

  .

  硬要套用法蘭克杜賓的人設或是萊斯利尼爾森的演法也不太適合連恩尼遜的氣質跟演技，

  他要演喜劇的話，反而比較適合的應該是那種整部電影裡面最嚴肅、最想把事情辦好的角

  色，然後身邊的人都在耍白癡這樣。但就像前面講的，這種角色比較也不適合當主角就是

  了。

  .

  我自己想像中最適合也最想看到他接這系列的演員其實是丹尼爾克雷格，我覺得他在《鋒

  迴路轉》系列中的演法非常適合演出法蘭克杜賓，甚至不用大改，只要把劇本的惡搞度更

  加強就可以了。不過我想會有這些遺憾，這可能也是萊斯利尼爾森那種渾然天成、一本正

  經講幹話的喜劇才華太難復刻，不管誰跟他比較都會相形見絀，我依然會期待續集，也希

  望連恩尼運經過幾度淬鍊之後，能夠更精確的掌握喜劇表演的節奏。


  --

  傑森史坦森其實超會講幹話，喜劇節奏掌握能力也很強，很想看他多拍點喜劇片啊哈哈

  我自己蠻喜歡UCLA那個笑話的，然後像比爾寇斯比這種可能怕台灣觀眾對他不熟悉，就直

  接翻成變態叔叔什麼的，醍醐味就少了點。

  其實這段我反而覺得好像少了點什麼，如果是舊版的的話這邊應該會出現一些更誇張白爛

  的畫面，例如銀行搶匪跟行員、警察跟犯人、各國利益衝突的領袖、甚至是什麼獅子跟兔

  子之類也和諧的擁抱在一起，但這片只有帶過幾個出場過的主要角色

  這有點算是我自己腦補，但我甚至有點在想，現實中妻子意外喪生的連恩尼遜，會接這個

  主角喪妻的惡搞喜劇，會不會其實對他而言也是有種療傷的效果跟用意在？而且如果他還

  能因此找到新歡，也是為他感到開心'
