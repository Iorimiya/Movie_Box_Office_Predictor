title: 'Re: [新聞]《白頭神探》原創者對《脫線神探》抱怨連連'
content: "文長恕刪。\n\n我對這15條規則感到好奇，古了一下將原文貼在下面。\n\n1.喺OKE ON A JOKE: Two jokes at the\
  \ same time cancel each other out. When an a\nctor delivers a punchline, it should\
  \ be done seriously. It dilutes the comedy\nto try to be funny on top of it. Likewise,\
  \ if there is something silly going o\nn in the background, the foreground action\
  \ must be free of jokes and vice-vers\na.\n\n2.孭CKNOWLEDGEMENT: Actors in the foreground\
  \ must ignore jokes happening behin\nd them. At the end of Naked Gun, Priscilla\
  \ Presley tells Leslie Nielsen, “Eve\nrybody needs a friend like you.” They never\
  \ acknowledge O.J. Simpson’s wheel\nchair careening down the steps and launching\
  \ him into the air.\n\n3.吚NRELATED BACKGROUND: A joke happening in the background\
  \ must be related in\n some way to the action in the foreground. The reason why\
  \ the O.J. Simpson jok\ne works is because he’s flying through the air as a result\
  \ of being slapped o\nn the back by Drebin.\n\n4.脷REAKING THE FRAME: Don’t remind\
  \ the audience that they’re watching a mov\nie. This is the rule most often legally\
  \ bypassed, but a movie has to be a stro\nng one to withstand more than one or two\
  \ of these.\n\n5.糍RIVIA: A joke using references so arcane that few people will\
  \ ever get it.\n\n6.喺ERRY LEWIS:餸on’t use a comedian in a straight man role. Scenes\
  \ in a paro\ndy ought to mimic the real thing. That means, basically, follow Rule\
  \ #1. You’\nve got funny lines in the script. If you add comedians (and “funny”\
  \ characte\nr names, “funny” wardrobe, etc.), it’s a joke on a joke.\n\n7.孭XE GRINDING:\
  \ When the joke is overshadowed by some message, it gets unfunn\ny fast.\n\n8.嚒ELF\
  \ CONSCIOUS: Any jokes about the movie itself, the movie business, or co\nmedy itself.\
  \ A strict no-no because it prevents the audience from being invest\ned in plot\
  \ and character.\n\n9.嚒TRAW DUMMY: Where the intended target is set up by the writer\
  \ instead of r\neal life. Even if the joke hits the target, who cares?\n\n10.AN\
  \ YOU LIVE WITH IT?: Once a joke is made, it can’t be allowed to hang a\nround after\
  \ the initial laughs. In Naked Gun, Frank and Ed are seated in a car\n, their lips\
  \ turned ridiculously pink from the pistachio nuts they’re munchin\ng. But one scene\
  \ later, when Frank goes snooping in the bad guy’s apartment,\nhe’s got to be clean.\
  \ It’s kind of like buying a personalized license plate.\n How long can “I H8 MEN”\
  \ be funny?\n\n11.糍HAT DIDN’T HAPPEN: Something that totally defies all logic but\
  \ is on and\n off the screen so fast that we get away with it. Example: Robert Stack\
  \ in Air\nplane! yells to Lloyd Bridges, “He can’t land, they’re on instruments!”\
  \ An\nd of course we cut to the cockpit and four of the actors are playing musical\
  \ i\nnstruments. Seconds later, in the next scene, the saxophone and clarinets have\n\
  \ disappeared. If it’s done right, no one in the audience will ask where the i\n\
  nstruments went.\n\n12.㗒ATE HIT: You know a particular target has had enough when\
  \ it’s been rake\nd over the coals by Leno, Letterman, the MTV Awards, etc.\n\n\
  13.糍ECHNICAL嘭IZZAZZ: Special effects don’t necessarily mean funny.\n\n14.㗎ANGING\
  \ ON: Don’t play a joke too long. When it’s reached its peak, get\nthe scissors.\n\
  \n15.糍HERE ARE NO RULES\n\n\n--"
