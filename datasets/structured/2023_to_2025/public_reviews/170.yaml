content: '才上映第二週場次就被砍不少

  .

  很多諧音梗只看中文翻譯會很難懂為什麼要這樣演

  有幾段我覺得很有趣

  一直有人給咖啡 還會有人收走換更大杯

  一群人意淫的OS

  巴提斯塔出來客串喊我沒演別打我

  .

  但裡面更多的是以前白頭的諧音梗

  雪人那段現在看也很尬

  尺（恥）度也沒那麼高

  賣點都在連恩硬漢形象和搞笑的反差演出

  但連恩的顏藝又沒白頭好笑

  整部就是在很尬、有點尬、好笑間徘徊

  .

  還好第二週有去看

  下週場次應該更少了…


