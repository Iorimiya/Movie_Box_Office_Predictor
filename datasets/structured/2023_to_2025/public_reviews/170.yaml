title: '[好微雷] 最強老爸「脫線神探」:驚聲尖笑再起'
content: '曾經有一位很有品味的影評人說，驚聲尖笑系列長期壟斷惡搞片市場，讓白頭神探

  這種高檔貨從此沒落，不過「脫線神探」完全打了這位影評人的臉，這部就是純純

  的驚聲尖笑系列類的惡搞片，沒在囉嗦的，從頭到尾就是無俚頭，打架可以變成擊拳

  還有惡搞不可能的任務的，隨時隨地都有人送一杯咖啡來，甚至反派都找常演反派的

  演員，然後一臉反派臉，諧音笑話沒在客氣


  不過要說神作還是太誇張，只能說爛番茄這年頭看太少這種惡搞片，拍得好一點就

  高潮了，許多笑點還是會荒唐到笑不出來，不管怎樣，脫線神探絕對是值得進電影院

  和大家一起開心大笑的爽片


  --

  北美已經上了

  大獨裁者落難記叫做引戰喔?你是不是支持獨裁啊?

  欠告早講

  分篇噓會水桶'
