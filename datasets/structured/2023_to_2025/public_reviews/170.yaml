title: '[新聞] 演員透露《脫線神探》最搞笑的場景被剪掉'
content: "演員透露《脫線神探》最搞笑的場景被剪掉\n\n【大紀元2025年08月05日訊】（大紀元記者葉子杰編譯報導）當地4日，美國女演員萊莎\n‧寇希透露《脫線神探》中其中一個最搞笑的場景被剪掉，或許實體版光碟發行後觀眾可\n\
  以看到。英國男演員連恩‧尼遜最近則透露，剛接演首部喜劇電影時確實有點擔憂。\n\n\n《脫線神探》（The Naked Gun）劇照。（UIP提供）\n\n《脫線神探》（The\
  \ Naked Gun，又譯：白頭神探）由「地表最強老爸」連恩‧尼遜（\nLiam Neeson）擔任主演，飾演出包的小法蘭克警探。女演員萊莎‧寇希（Liza\
  \ Koshy）\n飾演巴恩斯警探。片中有一個非常搞笑的場景，兩人在房間裡互相較勁，試圖抓對方違反\n了規定。這個笑點的核心在於該房間周圍其實只個假牆，牆壁突然倒塌，露出了另一個房\n\
  間還有正在偷聽他們對話的人們。\n\n寇希向《The Direct》透露，其實這不只一道牆。她說：「其實還有另外兩道牆……這就\n像俄羅斯套娃一樣的效果，很像我們製片人賽斯‧麥克法蘭（Seth\
  \ MacFarlane）的作品\n風格，但（導演）艾基瓦‧薛佛（Akiva Schaffer）執行得非常出色，而且花了不少預算\n。」\n\n「而它實際上就像是牆裡有牆、牆裡面還有牆，裡面有兩道其它牆，其實你看不到的。除\n\
  非你買藍光和DVD看幕後花絮，我猜是這樣。這是一個延伸出來的笑點，總共出現了兩次\n，但最終沒有被剪進電影裡，這讓我很好奇到底有多少畫面沒有被剪入最終的版本。」\n\
  \n寇希補充說：「不過話說回來，他們挑選了電影中那些最完美的片段和笑點，並把這些環\n節完美地結合，真的是傑作。」「連恩大多是在笑自己講的笑話，我想他賺了錢。是啊，\n\
  不，他們每個人都很可愛、很風趣、很愛笑。」\n\n連恩在接受《Variety》採訪時則透露剛接拍時確實有點擔憂，他說，十年前他和賽斯合\n作過一部電影。三年半前，賽斯聯絡他有沒有興趣接手這部翻拍電影，當時他確實有些忐\n\
  忑，但很快就釋懷了。\n\n連恩說：「我之前拍的喜劇作品都只是電視短劇，只有幾分鐘而已。但拍一部電影、當一\n部90分鐘電影的聯合主演這對我來說有點困難。不過我知道，如果逼不得已要拍的話，有\n\
  賽斯參與劇本至少會不錯，因為他有很有幽默感。如果劇本夠好，那我就不用刻意搞笑，\n只要嚴肅就好。我知道會有很多笑點。」\n\n眾所周知，如果想讓某件事情真正好笑，喜劇演員就得把它當成世界上最嚴肅的事情來演\n\
  。當談到是否在片場拍片會笑場時，連恩說：「沒有，沒有發生過。（女主角）潘蜜拉‧\n安德森和我談過這件事，當然我們會排練時對某些事情而笑，但在拍攝時我們還是認真完\n\
  成該做的事。不，從來沒有笑場過。我不記得發生過那種情況。」\n\n連恩還說，他不會為了模仿已故演員萊斯里‧尼爾森（Leslie Nielsen）扮演的小法蘭克\n\
  這個角色而去染髮，如果有人要求他模仿尼爾森經典的面部表情或面無表情的獨白風格，\n他肯定會置之不理。他說：「我拍過超過100部電影，所以我不需要別人教我怎麼演戲。\n\
  」\n\n《脫線神探》是連恩演出的第106部電影，也是他主演的首部喜劇電影。該片正在美國上\n映，8月22日將在台灣上映。\n\n責任編輯：蘇漾\n\n\n\n\
  --\n                 \n   \n\n\n\n--"
