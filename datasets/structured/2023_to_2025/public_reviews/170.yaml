title: '[  雷] 脫線神探 不必帶腦笑就行了'
content: "雷文防雷資訊頁\n \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n \n\
  \ \n \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n \n \n在進場看電影之前先複習一下笑彈龍虎榜(1988)\n\
  不得不說隔快40年風格竟然還能這麼還原\n開車必定會去撞人撞東西的警探\n\n一開始搶銀行的戲笑的人比較少，可能預告都看過了\n之後主線劇情類似金牌特務的概念\n\
  \n一堆刻意搞笑情節，笑就對了\n熱顯像儀那邊更是整場有人笑到岔氣\n\n雖然有些梗笑不出來或者無法理解，感覺翻譯並不是在地化的很好\n整體來說同樣是喜劇，比我上次看的超硬伴娘好笑多了\n\
  \n整片就是無理頭的搞笑，笑就對了，假日人多的廳笑果更好\n不必帶腦思考合理性這樣只會降低娛樂效果\n\n--"
