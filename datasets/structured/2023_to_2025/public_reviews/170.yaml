title: '[好雷] 脫線神探  沒啥好說 就無厘頭'
content: '其實我很久以前就看過了

  但為了看這部還把舊版三部曲重看一次

  但看不看都沒必要 不連貫的


  這部電影其實就像連恩尼遜說的一樣

  希望能跟原版一樣 但又有一些原創跟升級

  故事架構跟舊版大致相同

  一個科技佬為了一些理由策劃了恐怖攻擊

  但不巧擋在他們前面的是對壞人決不手軟

  你不是壞人也可能被開槍的小雷賓警探

  老角色警察局長 對雷賓感冒的市長 金毛紅粉

  不過沒有黑人跟班了 我猜他們不想出現第二個OJ


  其實知道這些就可以

  這種惡搞喜劇不講邏輯的

  反正就是看著笑就可以了


  有趣的是這部主角選連恩尼遜

  不知道是因為他的名字跟前作主角差不多

  還是因為他在熊麻吉二裡面嚴肅的買兒童麥片的那幕






  --'
