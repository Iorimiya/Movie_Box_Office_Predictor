url: https://www.ptt.cc/bbs/movie/M.1754019452.A.314.html
title: '[新聞] 《脫線神探》爛番茄評系列中最佳 票房預測'
content: "《脫線神探》爛番茄評系列中最佳 票房預測出爐\n\n【大紀元2025年07月31日訊】（大紀元記者葉子杰綜合報導）當地30日，據報導，《脫線\n\
  神探》（The Naked Gun）8月在北美首映後，北美票房預估將獲得1,500萬美元。該片目\n前在影評網「爛番茄」獲得影評員91%的好評，是爛番茄史上是該系列中最高的評分。\n\
  \n派拉蒙影業推出的全新動作喜劇電影《脫線神探》翻拍自經典喜劇1988年《搞笑龍虎榜》\n、1991年《站在子彈上的男人》及1994年《脫線總動員》。《脫線神探》延續原作的荒誕\n\
  無厘頭與機智幽默，帶領觀眾重返這場笑料百出的警探冒險。該片由「地表最強老爸」連\n恩‧尼遜（Liam Neeson）擔任主演，他一改過往硬漢形象，自稱警界高手、實則老是出\n\
  包的小法蘭克警探。\n\n\n《脫線神探》（The Naked Gun）劇照。（UIP提供）\n\n據《Variety》報導，預測《脫線神探》在3,300家影院將獲得1,500萬至1,700萬美元的首\n\
  映票房收入，考慮到喜劇片幾乎快絕跡，這個票房相當不錯。這部翻拍的電影長度僅85分\n鐘，製作成本高達4,200萬美元。多年來，派拉蒙影業一直試著想翻拍該系列。\n\
  \n據報導，該系列前三部電影都取得了票房成功，但那三部都是在觀眾願意去電影院看搞笑\n片的年代。《脫線神探》是少有的在戲院上映的喜劇電影，而不是直接在串流平台發行。\n\
  如在各式串流平台上，觀眾收視率通常沒有統一的數據報告數據，沒有一致性。\n\n另據《ComingSoon》報導，截至30日，該喜劇系列的新作《脫線神探》目前在爛番茄影評\n\
  員112條評論中獲得了91%的好評，在該系列中評分最高。此前，《搞笑龍虎榜》（The\nNaked Gun: From the Files of a Police\
  \ Squad）、《站在子彈上的男人》（The\nNaked Gun 2½: The Smell of Fear）及《脫線總動員》（Naked Gun 33⅓:\
  \ The Final\nInsult.）分別獲得88%、77%和65%的新鮮度評價。\n\n\n《脫線神探》（The Naked Gun）劇照。（UIP提供）\n\
  \n《脫線神探》故事描述，只有一個男人擁有一套特殊的技能，他率領警察小隊拯救世界，\n那就是小法蘭克警探（尼遜 飾）。他將在《脫線總動員》一片中追隨他父親的腳步，展\n\
  開全新行動。\n\n《脫線神探》8月1日在美國上映，8月22日在台灣上映。\n\n責任編輯：蘇漾\n\n\n\n--\n                 \n\
  \   \n\n\n\n--"
