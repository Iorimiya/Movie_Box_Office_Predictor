title: '[討論] 脫線神探怎麼沒有找原來編導團隊製作？'
content: '我一直以為David Zucker沒有參與新版The Naked Gun是因為他過世了


  沒想到他還健在  只是年事已高


  身為一個原版前三集至少看20遍以上的鐵粉


  看完新版全程笑不到五次


  新版的編劇和笑點團隊真的有夠失敗


  David Zucker的無厘頭風格真的不是誰都模仿的來


  究竟為什麼原來的編導沒有實際參與製作過程？？



  --'
