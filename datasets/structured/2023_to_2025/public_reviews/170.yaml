url: https://www.ptt.cc/bbs/movie/M.1763451084.A.381.html
title: '[新聞]《白頭神探》原創者對《脫線神探》抱怨連連'
content: "《白頭神探》原創者對《脫線神探》抱怨連連\n\n\n《脫線神探》劇照。（UIP提供）\n\n【大紀元2025年11月17日訊】（大紀元記者葉子杰編譯報導）《脫線神探》（The\
  \ Naked\nGun）是《白頭神探》系列的第四部電影，原版電影的創作者兼導演大衛‧薩克最近對《\n脫線神探》抱怨連連，他表示，《脫線神探》想模仿他們的惡搞喜劇風格，但完全沒抓到\n\
  重點，這個片預算也太高了。他還說，現在很多人都是為了錢而拍片。\n\n大衛‧薩克（David Zucker）曾創作、編劇及執導《白頭神探》系列的《笑彈龍虎榜》（\n\
  The Naked Gun，1988）及《站在子彈上的男人》（The Naked Gun 2½: The Smell of\nFear，1991）電影。\n\n\
  12日，78歲的大衛向《Woman's World》表示，製片人賽斯‧麥克法蘭（Seth MacFarlane\n）的《脫線神探》作品完全沒抓到精隨，並認為這部喜劇片的製作成本太高了。\n\
  \n大衛說：「我弟弟傑瑞‧索克（Jerry Zucker，原作編劇及原著）和我們的夥伴吉姆‧亞\n伯拉罕（Jim Abrahams，原作編劇及原著），大約50年前開始拍惡搞喜劇，我們創造了自\n\
  己的風格——而且做得那麼好，片子看起來就是很輕鬆。後來大家都開始學我們，比如賽\n斯‧麥克法蘭拍新版的《脫線神探》，但他完全沒領會到我們的精髓。」\n\n大衛說，他和兄弟傑瑞以及吉姆一起，靠著1988年那部由加拿大男演員萊斯里‧尼爾森（\n\
  Leslie Nielsen）主演的犯罪喜劇片，找到了「瘋狂背後自有章法」。\n\n大衛說：「我們有15條規則，我教這些規則就是希望如果有人再拍類似的電影，他們能拍\n\
  得正確一點。喜劇片不應該花太多錢，其中一條規則是關於技術花俏的部分。大預算製作\n和喜劇是矛盾的，新版《脫線神探》你就能看出，他們花了很多錢在那些技術花俏的場景\n\
  上，還想模仿我們。」\n\n據《好萊塢報導者》報導，1988年的原版電影當時的製作成本為1,500萬美元，換算至今\n通膨後的成本相當於約4,100萬美元。而《脫線神探》預算為4,200萬美元，並沒有高出多\n\
  少。\n\n他補充說：「現在大家拍片都是為了賺錢，感覺他們想拍新版的《脫線神探》也只是這個\n原因。」\n\n據《Ｄeadline》報導，撇開預算不說，因為《脫線神探》把喜劇電影重新帶回影院而受\n\
  到觀眾讚賞。該片於8月1日在美國上映，全球票房達到1.21億美元，現在影評網站「爛番\n茄」上獲得「認證新鮮」標識，影評人評分達88%，觀眾評分為73%。\n\n\
  責任編輯：蘇漾\n\n\n\n--\n\n                  \n\n\n\n--"
