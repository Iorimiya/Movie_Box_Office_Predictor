title: '[新聞] <聲之形>導演聯手音樂才女打造<記憶花園>'
content: '新聞網址：



  由《電影版聲之形》導演山田尚子執導，即將在本週五（6/27）於全台威秀影城獨家上映

  的《記憶花園》，透過以影像取代語言、用畫面細膩述說情感的敘事方式，打造出繼《再

  見機器人》（Robot Dreams）後又一動畫傑作。尤其音樂是全片靈魂角色，製作團隊找來

  有「在宅系創作才女」之稱的Lovely Summer-Chan打造動聽音樂。導演透露之所以跟

  Lovely Summer-Chan合作，就是想要把她那種少女心跟任性感兼具的獨特氣質，融入到本

  片當中。尤其對方更是山田導演的忠實影迷，一收到配樂邀約時，更讓她心想「不可能！

  」讓她對本次合作相當欣喜。兩人透過詩人吉野弘的詩作《生命是》一拍即合，導演更大

  讚她「真正的藝術家！」值得一提的是，台灣片商也推出「第一週戲院特典」，只有購買

  本片第一週（6/27-7/3）期間場次電影票乙張，即有機會獲得「A3原文主視覺海報」乙張

  ，數量有限，送完為止。





  《記憶花園》由《膽大黨》、《乘浪之約》製作公司「Science SARU」製作，《電影版聲

  之形》導演山田尚子執導，全片以「銀蓮花」為主題，透過色彩豐富的方式，描繪出「你

  」、「我」、「青梅竹馬」三個角色之間的細膩情感流動。全片彷彿視覺與音樂交織的沉

  浸之旅，導演大膽打破敘事框架，回歸觀賞動畫最純粹的感動。片商同步釋出最新PV版預

  告（），尤其音樂是全片重要元素，製作團隊找來有「在

  宅系創作才女」之稱的Lovely Summer-Chan負責全片音樂。導演透露自己先是將動畫製作

  完成，再向Lovely Summer-Chan解釋故事結構，而對方則根據動畫創作出音樂草稿。導演

  表示：「我想展現她創作音樂的世界觀，她非常有少女心，也帶有任性感，這些特質都體

  現在她的音樂當中，而且她相當帥氣，讓我想把她獨特的少女世界融入其中。」尤其

  Lovely Summer-Chan本身就是導演的忠實影迷，當導演邀她參與音樂創作時，Lovely

  Summer-chan更是驚呼：「我高中時參加過輕音部，當時正值《K-ON！輕音部》的年代，

  而且我當時的男友很喜歡動畫，所以我也觀賞了導演之前的《玉子愛情故事》，所以當我

  收到山田導演的邀請時，心裡直想『不可能！』我覺得導演在音樂方面很有造詣，能被她

  選中，真是備感榮幸。」



  Lovely Summer-Chan進一步表示：「參與本片製作的時候，我提交吉野弘的詩作《生命是

  》。這首詩講述一朵花和一隻馬蠅的故事，雖然它們沒想過要如何為對方謀福利，但卻維

  繫著彼此的生命，讓生活彼此依存。我們對此進行討論，與其只讓一個人沉浸在自己的世

  界，不如用三個角色來展現還有其他人在想著別人，這樣會更好。」導演對此回應：「我

  非常驚訝，竟然有一首詩能如此完美地契合這個形象。當一個人想著別人的時候，另一個

  人也想著別人。當她給我看了《生命是》這首詩時，我感覺非常貼切，也非常感動。這首

  詩充滿了我想要看待世界的方式，以及想要在作品中傳達的距離感，我感覺自己找到了盟

  友。」導演也大讚Lovely Summer-Chan：「我覺得她是真正的藝術家，她和她的作品緊密

  相連，我認為她創作的音樂，就是她另一個自我的展現。」





  值得一提的是，台灣發行商也推出《記憶花園》的「第一週戲院特典」，只有購買本片第

  一週（6/27-7/3）期間場次電影票乙張，就可以憑電影票在本週五（6/27）起，至原購票

  影城兌換領取「A3原文主視覺海報」乙張，數量有限，送完為止，詳情請見官方公告：


  。



  這部由《電影版聲之形》導演山田尚子最新執導，屢獲國際影展青睞，不僅榮獲富川動畫

  影展「特別優秀獎」與「觀眾獎」雙料肯定，並接連入選英國邂逅電影節、蘇格蘭愛動畫

  影展，更獲選安錫動畫影展特別放映、西班牙錫切斯影展動畫競賽單元的《記憶花園》，

  即將在本週五（6/27）於全台威秀影城獨家上映。本片劇情描述當思念著某人時，那份情

  感究竟會前往何方？房間裡，啤酒罐與酒杯隨意散落，雖然略顯凌亂，卻也透出一種生活

  的真實。「你」的空間裡擺滿了美術用品與一把電吉他，彷彿仍殘留著創作與回憶的餘溫

  。當手機鬧鐘響起，「你」緩緩醒來，迎接嶄新一天。而「我」所珍愛的那朵銀蓮花，是

  「我們」共同記憶的見證，是承載著「你」和「我」過往的珍貴之花。當打開房間的衣櫃

  後，記憶的潮水悄然湧現。這是一段屬於「你」、「我」，也屬於「我們」之間，一段關

  於思念與告別的故事…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
