url: https://www.ptt.cc/bbs/movie/M.1750169603.A.6F9.html
title: '[新聞] <聲之形>導演打造畫面敘事傑作<記憶花園>'
content: '新聞網址：



  由曾在台灣創下近7000萬票房佳績的《電影版聲之形》導演山田尚子執導，即將在6月27

  日於全台威秀影城獨家上映的《記憶花園》，可說是繼《再見機器人》（Robot Dreams）

  之後，又一以影像取代語言、用畫面細膩述說情感的動畫傑作。導演透露，本片從她親自

  創作的一首小詩出發，進而延伸成這部融合音樂與動畫、充滿詩意與感性的作品。她特別

  邀請《懶人的餐桌》知名漫畫家水澤悅子擔任角色原案，刻畫出水澤筆下那種少女的慵懶

  肉感，卻又恰到好處、真實得彷彿能觸摸到的氛圍。值得一提的是，山田尚子過去長年在

  京都動畫參與製作，執導出《電影K-ON！輕音部》、《電影版吹響吧！上低音號～莉茲與

  青鳥～》等多部膾炙人口之作，之後她離開京都動畫，加入《膽大黨》、《乘浪之約》製

  作公司「Science SARU」，她也大方分享自己在兩大知名動畫工作室之間，所體會到創作

  氛圍與理念上的最大不同之處。





  《記憶花園》由山田尚子親自編劇、導演，並首度挑戰原創動畫短片形式，再次以她特有

  的細膩視角與詩意敘事，引領觀眾走入一場溫柔卻震撼人心的記憶探尋。一如屢獲國際大

  獎肯定的《再見機器人》，本片也如同一首透過畫面與音樂交織而成的視覺詩，不需言語

  、只需感受，讓觀眾在光影與節奏當中，與自己展開一場心靈的對話。片中更以「銀蓮花

  」為媒介，描繪出「你」、「我」和「青梅竹馬」三位角色的情感微妙流動與起伏。談及

  創作契機，山田導演分享本片源自製作公司Science SARU執行長崔恩映，以及發行商

  Avex Pictures製片人松村的一個提議：「想不想創作一部像音樂錄影帶般的動畫？」這

  個念頭激起導演的創意火花，大家隨即展開關於音樂風格與劇本走向的討論。導演透露：

  「那段時間，我開始萌生想『寫一首詩』的衝動。於是我寫下一首小詩，並進一步拓展這

  個想法，最後決定創作出這部融合音樂和動畫的作品。」



  尤其本片的角色設計，是由曾創作《懶人的餐桌》的漫畫家水澤悅子擔任，導演表示：「

  我原本就非常喜歡水澤小姐的設計和畫風，她筆下的女孩子，大多都帶點肉感，相較一般

  的動畫角色，她們更稍微胖一些。這樣的體態，與社會普遍認定『應該如此』的外貌標準

  其實有差，但正是這些角色所喚起的那種『質感』才真實，讓人彷彿真的能觸摸到她們的

  肌膚一般。就好像剛睡醒、還帶著口水味的那種感覺。」她也補充：「這種懶洋洋、卻恰

  到好處的質感，是我非常嚮往的美感。我覺得這樣的合作機會可遇不可求，所以主動向製

  作人提出邀請，後來也很幸運，對方欣然同意，才有了這次的合作。」





  值得一提的是，大學畢業後即進入京都動畫工作的山田尚子，曾在該公司執導過多部膾炙

  人口作品，包括《電影K-ON！輕音部》、《玉子愛情故事》、《電影版聲之形》、《電影

  版吹響吧！上低音號～莉茲與青鳥～》等片，奠定她的細膩風格與情感敘事代表地位。在

  完成《莉茲與青鳥》之後，她選擇離開京都動畫，轉戰《膽大黨》、《乘浪之約》製作公

  司「Science SARU」，開啟創作生涯新篇章。談及這兩家風格鮮明的動畫工作室，她也分

  享親身感受到的最大差異：「在京都動畫工作時，我學到如何描繪角色的內心，以及人的

  情感變化。那不只是『做動畫』，而是要試著把角色經歷的事情，描寫得就像真實人生一

  樣。目的不是單純創作動畫，而是把角色當作現實中存在的人來對待，創造出一種『真實

  的人生』。」而轉至Science SARU後，她則體會到截然不同的創作氛圍：「在這裡，大家

  真的很享受『讓動畫動起來』這件事，整個製作過程都充滿對動畫創作的喜悅。」她進一

  步透露：「這也讓我非常好奇，當『動畫本身的樂趣』與『角色作為真實存在的描繪』這

  兩種方向融合在一起，究竟會產生什麼樣的化學反應？」特別是兩家工作室在「畫面表現

  方式」上同樣具有鮮明特色，只需一眼就能辨別出兩者的風格。山田導演的分享，不僅道

  出她從京都動畫到Science SARU的創作轉變，也悄然透露這段歷程，對她個人藝術追求的

  深遠影響。



  這部由《電影版聲之形》導演山田尚子最新執導，屢獲國際影展青睞，不僅榮獲富川動畫

  影展「特別優秀獎」與「觀眾獎」雙料肯定，並接連入選英國邂逅電影節、蘇格蘭愛動畫

  影展，更獲選安錫動畫影展特別放映、西班牙錫切斯影展動畫競賽單元的《記憶花園》，

  即將在6月27日於全台威秀影城獨家上映。本片劇情描述當思念著某人時，那份情感究竟

  會前往何方？房間裡，啤酒罐與酒杯隨意散落，雖然略顯凌亂，卻也透出一種生活的真實

  。「你」的空間裡擺滿了美術用品與一把電吉他，彷彿仍殘留著創作與回憶的餘溫。當手

  機鬧鐘響起，「你」緩緩醒來，迎接嶄新一天。而「我」所珍愛的那朵銀蓮花，是「我們

  」共同記憶的見證，是承載著「你」和「我」過往的珍貴之花。當打開房間的衣櫃後，記

  憶的潮水悄然湧現。這是一段屬於「你」、「我」，也屬於「我們」之間，一段關於思念

  與告別的故事…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



