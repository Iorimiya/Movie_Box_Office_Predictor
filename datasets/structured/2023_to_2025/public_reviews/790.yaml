url: https://www.ptt.cc/bbs/movie/M.1726925972.A.D49.html
title: '[普偏負雷] 流氓驅魔師-用驅魔包裝的小品愛情'
content: "1. 用驅魔題材包裝的小品愛情電影，想看驅魔題材的會失望\n\n\n\n\n雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n2. 中間男女主角的感情戲好想快轉，我是來看驅魔的~\n\
  \n3. 大部分人的演技實在讓人無法入戲，尤其女二Sora，大部分時間好像單純在念台詞\n\n    尤其最後一場大戰整個在狀況外\n\n4. 有幾場覺得角色的反應不自然，比如被魔附身的兒子掐住女二的脖子，父母的反應竟\n\
  \   然是\"不要過去\"!!??\n\n   一般情況是自己親兒子會想要過去拉開吧\n\n5. 劇情無驚無喜，除了郭書瑤的身分被揭穿時有那麼一點點小反轉，其他真的過得\n\
  \   太順了\n\n   男主角一出手馬上驅魔成功，碰到相關的物品馬上就能看到前因後果\n\n   完全沒有懸念\n\n6. 女二非常自以為是的逼男主角講他不願意提起的過往還有不顧小孩的安危硬逼男主角\n\
  \   出手，看得都想打她一巴掌了\n\n   可惜沒有受到報應，如果最後有說他決定不把男主角的傷心事公告，才能稍微洗白\n\n   否則誰受的了拿自己的傷心事去賺流量的網紅\n\
  \n\n　　　　　\n\n--"
