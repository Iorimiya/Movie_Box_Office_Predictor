title: '[  雷] 有劇透流氓驅魔師'
content: '話說我昨天莫名奇妙去看電影，郭書瑤演的那片流氓驅魔師，她其實是鬼，生前是妓女，

  被男主救後單純快樂的活了一段時間，但被車子意外撞死，但因為男主角是天生陰陽眼有

  法力，特別為了要看見她請他的老師傅封印他的能力，要墮落生活才能一直見到郭書瑤，

  這設定我覺得挺感人的，但電影還是在小情小愛格局太純愛有點可惜。




  --'
