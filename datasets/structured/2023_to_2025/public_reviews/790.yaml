url: https://www.ptt.cc/bbs/movie/M.1723046202.A.F33.html
title: '[新聞] 郭書瑤拍《流氓驅魔師》讓導演驚豔'
content: "郭書瑤拍《流氓驅魔師》讓導演驚豔\n\n04:10 2024/08/07 中國時報 李承陽\n\n\n郭書瑤（右）和宗子杰主演電影《流氓驅魔師》，劇情改編自真人經歷。（威視提供）\n\
  \n亞洲驅魔大師真實人生故事改編的靈異驚悚電影《流氓驅魔師》，由新加坡導演林雪燕編\n導，新生代演員宗子杰、《通靈少女》郭書瑤攜手主演，將神祕異度空間搬上大銀幕。首\n\
  次與新馬團隊合作並遠赴檳城拍戲的郭書瑤，開拍前就做足功課，敬業態度讓林雪燕讚不\n絕口說：「真後悔沒多加幾場戲！」\n\n林雪燕表示自己相當欣賞郭書瑤在《通靈少女》的演出，更意外她一口答應接下角色，「\n\
  我第1次和瑤瑤見面時，她不僅做好不同階段的角色分析，還早已自費請好表演指導，在\n我們見面前就做足了功課，我真的非常驚豔。」\n\n此外，在檳城拍攝時正值炎熱難耐的6、7月夏季，令郭書瑤十分難忘，「要在高溫下維持\n\
  妝容非常不容易，經常在收工時妝也差不多卸完了，而且沒有一天衣服是乾的！」但她也\n不忘補充好處：「人的新陳代謝都變好了，完全沒有水腫的問題！」\n\n#林雪 #驅魔師\
  \ #角色 #驚豔 #通靈少女\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
