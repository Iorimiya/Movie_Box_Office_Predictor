url: https://www.ptt.cc/bbs/movie/M.1748971828.A.47F.html
title: '[偏好雷] 《薄暮微光》失去與擁有的流轉之間'
content: '■ 薄暮微光



  「失去與擁有的流轉之間」


  寧靜的海面逐漸吞噬黃昏的餘暉，一對年輕男女被夜色驅趕前行，一路上肆意地述說愛意

  ，女人告訴男人，他應該要跟女友分手，男人則以笑回應。那一晚的雷克雅維克如常地隨

  著規律的呼吸聲陷入沉睡，整座城市的意識潛入黑暗之中，等待下一道晨光從洞口透出，

  然而就是那樣稀鬆平常的早上，隧道中迸發的火光佔據了車窗外的視野，有的人則再也沒

  有醒來過。



  原先要前去與現任女友分手的Diddi不幸地於意外中喪命，而現任女友Klara不但對此毫不

  知情，還在得知死訊後隨即飛奔前來，作為地下情人的Una，不得不一邊面對失去愛人的

  悲慟，一邊安撫Klara，同時還要在眾人面前掩飾自己真正的心情，複雜而幽微的念想，

  散落在不經意的細小言行之中，《薄暮微光》表面上談論的是人們的「失去」，實際上更

  體現出的是「擁有」，失去同一個男人的兩個女人，Klara自高中便與Diddi交往長大，理

  所當然擁有作為正宮傷心的權利，而更為理解Diddi內心的Una，則擁有他最毫無保留的此

  時此刻，實際上從Klara批判行為藝術與Diddi創作理念的態度，確實不難想像為何Diddi

  的內心更傾向Una。



  或許是因為這段出軌從未說破，抑或是兩人多少都對對方的底細心知肚明，原先乍看應當

  對立的Una與Klara，在相處的過程裡，不但逐漸放下敵意與質疑，也像是透過對方的眼淚

  ，間接療癒了自己失去的那一部分，如同Una課堂上三個纏滿膠帶的人所呈現的行為藝術

  ，無法擺脫的交集在經歷失衡、碰撞與擠壓的掙扎之後，還是有辦法隨著互動取得彼此都

  能接受的折衷，而Una在教堂前飛行的敘述性詭計，玩弄的概念是「垂直來看高不可攀的

  事物，只要改變焦點，換作水平視角也能是俯視」，即便對她而言這只是為了讓Klara理

  解觀看藝術的視角，但她當時沒意識到的是，這點套用在「自己究竟能否以戀人的身分悲

  傷」這件事本身也是成立的。恍惚之間，曖昧的窗光勾勒出擺盪的樹影，不約而同出神的

  凝望，在錯視與透視的角度裡彷彿交疊出了同一個身影，各別握有過去與現在的兩人，在

  失去了交集的男人後竟也變得互補而平等。



  另一方面，Una兩次踏入Diddi與Gunni的家的身份轉換相當有意思，最開始作為地下情人

  的她奪取了Diddi的牙刷，並笑著「允許」他用Gunni的牙刷，在愛人面前展現著「女主人

  」的權勢，而當Diddi不在時，自己卻只能狼狽地從後門翻牆逃跑避免被Gunni發現，再到

  第二次跟著Klara回到這個家時，礙於身份，Una只能表面裝作陌生，端詳著Klara的臉色

  並唯唯諾諾地跟在她身後，而在同一個浴室的刷牙場景裡，兩個人則同樣因為這個家沒有

  屬於她們的牙刷，而平等地用手指各自抹上牙膏，牙刷的所有權巧妙地闡述了不同身分對

  應的關係，而兩人整齊劃一的動作也像是再次強調了彼此的對等。



  Klara在等待日落時，覺得那樣的過程像是在跟Diddi告別，於我來看其實是點題了「一個

  人終究無法屬於任何人」的事實，如同太陽的遙不可及，也如日暮時分不會因為任何人的

  眼淚而停留在那一刻，失去愛人的痛苦宛如在她心上刨掉一塊血肉，但Klara不知道的是

  ，Diddi的心裡早已沒有了她，而對Una而言，她曾冀望那份讓關係見光的名份能讓她擁有

  說愛的自由，然而這樣的念想卻讓她因此失去了愛人。在失去與擁有的流轉之間，她們以

  為自己擁有的，其實從不真正屬於她們，逝去的故人已然黯淡，來自身旁的擁抱卻依然溫

  暖而真切，日復一日，薄暮的微光終將消逝，也始終會再度來臨。



  不過若要以我的喜好來說，《薄暮微光》整體實在有些過於平淡，因全片更聚焦在角色細

  微的言行舉止，沒能更加以利用唯美的自然風光，或是利用災難元素去做延伸還是不免讓

  我覺得有些可惜，雖然電影選擇了很不一樣的角度來談失去與擁有，而我也認為其中隱約

  感受到的關係角力是有趣的，但本片也就僅止於最簡單的敘事並始終保持克制，能帶給觀

  眾多少的感受很取決於每個人的敏銳度，而對我來說，大概只算是很有意思，但不至於在

  內心激起太多波瀾的作品。



  --


  電影心得隨筆帳號：


  ■ IG


  ■ 方格子



  --'
