title: '[無雷] 《薄暮微光》觀後感：天亮了，你走了'
content: '《#薄暮微光》無雷觀後感：

  天亮了，你走了。

  （不超過片介跟預告）


  很細膩的電影。沒有摻入任何雜質，情感更顯純粹。


  有幾幕內心默默讚嘆到：原來冰島這麼美。（看預告可以瞥見幾幕）


  悲傷、嫉妒、憤怒、寬慰、理解，複雜層次的情感，在無台詞的幾個表情中細膩演繹。


  看到這部電影的時刻，彷彿是冥冥注定。當想念和驚愕氾濫成災，誰能陪你靜靜哀悼？《

  薄暮微光》也許可以。


  電影預告：



  --'
