url: https://www.ptt.cc/bbs/movie/M.1748576943.A.5FC.html
title: '[好雷]《薄暮微光》，我們如何承受誰的離開。'
content: '部落格版：


  「阿峰今天沒有來，我們之中笑得最大聲的男孩，一起舉杯、少了一杯，他沒有跟任何人

  道別。」


  「阿峰再也不會來，我們如何承受誰的離開，空出一個位子的這一排，不再是畢業典禮後

  無盡的未來。」


  這是歌手萬芳的歌《阿峰今天沒有來》，收錄在她於2020年推出的專輯《給你們》當中，

  是我那年最喜歡的一張專輯與一首歌，而在看完《薄暮微光》後又讓我想起了這首歌。從

  《阿峰今天沒有來》到《薄暮微光》所談的，其實都是每個人在看似漫長卻又短暫的生命

  裡都會遇上的課題，關於離別。不論是萬芳輕唱著感嘆歲月流轉，傷感著曾經的親密卻如

  今都將缺席，或者是導演魯納魯納森鏡頭裡那提早到來的告別式，每一句每一字，每一個

  情緒反應，都實實在在表示著人們總是來不及準備好也無法輕易學會如何去面對告別。《

  薄暮微光》與歌同樣的，在看似輕柔緩慢的口氣裡，其實滿是無從宣洩的情感，也如同這

  首歌那樣的，與我們分享著記憶裡的那個男孩，而思念他的她們也都在這夜過去後理解長

  大。



  岡尼問著尤娜是不是第一次面對親友的離開，尤娜回答不是。只是有過經驗的她，還是無

  法冷靜的去接受愛人的驟逝，那些不斷湧上來的情緒無從宣洩，只因為她是迪迪無法公開

  的戀人。痛徹心扉的悲傷只得佯裝成是對摯友離世的不捨，當迪迪準備提出分手卻沒來得

  及分手的女友卡拉回到故鄉，與迪迪共同的好友紛紛上前安慰著卡拉，認為她正承受著無

  法體會的悲傷，而尤娜也只能逼迫自己上前給些擁抱。伴隨悲傷而起的，是不知如何是好

  的複雜情緒，她大可肆意發洩她的憤怒與不滿，她大可直接向卡拉攤牌、告訴她自己與迪

  迪的關係，她大可嘗試將這些本來應該要給她的安慰給要回來，可是尤娜並沒有。導演魯

  納魯納森沒有讓這些檯面下的不為人知搬到檯面上，而是選擇讓尤娜獨自面對這些只有她

  、也必須是她一個人寫完的課題。


  「走味的菜色與鬆弛的臉，話題從大夢想換成小思念。」


  在過去眾人常去的酒吧裡，他們一杯又一杯的敬著迪迪，尤娜在其他人的躁動下，些微不

  甘願的說起迪迪在表演課上讓自己吐到不行的行為藝術，所有人、包含卡拉都笑了。從酒

  吧離開，在無人的街道上他們沈默，直到一台車朝著走在馬路中間的他們按起喇叭，刺耳

  的喇叭聲將他們思緒喚回，他們來到另個好友的家中，邊聊著他們所認識的迪迪，邊喝著

  迪迪生前最愛喝的酒，聊著喝著忍不住笑出聲，彷彿迪迪也在現場與他們飲酒暢聊，然後

  隨著音樂的節奏他們開始跳舞，然後跳著跳著尤娜似乎終於還是意識到「迪迪不在了。」

  ，說不上來為什麼，就是能夠感受到尤娜是這麼想的。看著尤娜從外面察覺到有人正在看

  她，轉過頭是卡拉正站在裡面，兩個人的倒影在玻璃上重疊，尤娜不自覺的笑了。也是在

  這一刻，尤娜才真正明白原來傷心的從來不只有她一個，在這段關係裡她跟她都是失去的

  那個人。



  「這夜我們聊得特別長，長到我們驚覺生命太短暫，明年再不要有誰不能來，再不願把眼

  光從彼此身上離開。」


  那些沒能找到時間說出口的話，在這個失去迪迪的第一天裡，似乎變得不再那麼重要了。

  我想，卡拉其實在這不過短短幾小時的相處裡，或多或少察覺到尤娜與迪迪的關係，但她

  並沒有將之戳破，或許也是想找個時間，尤娜同樣也是。而這是我很喜歡《薄暮微光》的

  地方。導演魯納魯納森讓一切的發展是如此的順其自然，沒有刻意的安排某些場合，沒有

  卡拉抓到迪迪出軌的證據，也沒有讓尤娜突然的激動，而是讓她們各自隱忍的情緒，隨著

  相處、隨著從彼此口中聽到更多她們自己所不知道的愛人那面之後，有了感同身受的理解

  可能，理解自己、理解對方、理解這段關係、更是理解「失去」的意義。即便她們真的展

  開爭執，迪迪終究還是不會回到她或她的身邊，與其浪費時間在執著他愛誰這件已然無意

  義的事情上頭，記住迪迪、替他好好的且認真的活在每一天，才是這起悲傷帶給她們最重

  要的領悟。


  電影的開始是在清晨，尤娜與迪迪來到迪迪住處附近的海邊，坐在礁石上看著一望無際的

  大海，而在電影的最後是日落時分，尤娜與卡拉同樣來到這裡，然而她們不再是聊著夢想

  、聊著將來想去哪個國家，而是靜靜的看著夕陽沒入海平面，彷彿她們終於能真正向迪迪

  說再見。不過一夜的時間，生命的句點與巨變，《薄暮微光》如此靜謐的、冷靜的，如旁

  觀者般的注視著這個小鎮發生的一切，在看似漫長卻又短暫的生命裡，原來很多相當在意

  的事情、例如那個男孩比較愛自己還是愛另個她，又或者是自己還是另個她能在男孩離開

  後得到比較多的同情安慰，都成了無足輕重的小事。導演魯納魯納森反覆用著前與後的對

  比，反映出了尤娜的心境轉折，平凡一天裡的日出與日落，讓她、也讓觀眾更加認識生命

  。


  《薄暮微光》有傷痛也有療癒，那些情感與情緒都在一天的時間裡不停的流轉與改變，在

  自己與他人的對話裡去看見過去未曾留意的事情，是部相當細膩且柔和的電影，也是我今

  年上半年最喜歡的一部電影。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
