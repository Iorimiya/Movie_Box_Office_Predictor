url: https://www.ptt.cc/bbs/movie/M.1673287399.A.EE9.html
title: '[新聞] 開羅謀殺案 闖奧斯卡國際影片15強'
content: '新聞網址：







  去年勇奪坎城影展最佳劇本大獎的間諜驚悚片「開羅謀殺案」，今年也闖進奧斯卡

  最佳國際影片15強。由於劇情涉及宗教與政治議題，導演遭埃及封殺，只能招募

  300名演員赴伊斯坦堡拍攝。


  「開羅謀殺案」（Cairo Conspiracy，歐版英文片名Boy from Heaven）由埃及裔

  瑞典導演塔利克薩利赫（Tarik Saleh）執導，集結瑞典、法國、芬蘭和丹麥4國

  聯合製作。故事描述貧窮的漁夫之子亞當，幸運考上創立千年的埃及開羅名校艾資

  哈爾(Al-Azhar)大學，這座學校也是伊斯蘭教遜尼派的權力中心。但亞當開學第一

  天，就意外捲入一場間諜風暴。


  薩利赫曾以驚悚片「尼羅河的希爾頓事件」（The Nile Hilton Incident）勇奪日

  舞影展評審團大獎；新作「開羅謀殺案」更在影展及國際票房大放異彩，不僅入圍

  2023年奧斯卡最佳國際影片前15強，去年底在法國上映時，更狂吸新台幣1.5億元

  票房，成為繼電影「寄生上流」後，法國票房最高的非英語外語電影。


  由於「開羅謀殺案」片中涉及的宗教與政治議題，電影在初期便遭埃及政府全面封

  殺，導演也被列入「不受歡迎名單」，一旦赴埃及拍片就會遭逮捕。







  因此劇組只能轉移陣地，遠赴土耳其伊斯坦堡的16世紀古蹟蘇萊曼尼耶清真寺實景

  拍攝，並招募包括來自瑞典、芬蘭、巴勒斯坦、黎巴嫩、以色列及土耳其當地等

  300多名演員加入，光一場詩經朗誦比賽的戲就拍了20多個鏡頭，場面及動員浩大。


  具懸疑調性的「開羅謀殺案」，在片中也探討貧窮年輕人的成長處境。漁家出身的

  主角亞當試圖在這世界上找到自己的位置，卻險些成為權力鬥爭下被犧牲的棋子。

  兩名男主角巴勒斯坦男星塔菲克伯罕（Tawfeek Barhom）與瑞典男星法瑞斯法瑞斯

  （Fares Fares）的鬥智演出，也成為全片亮點。


  「開羅謀殺案」將於2月10日在台上映。


  （編輯：張雅淨）


  ------------------------------------------------------------------------------


  參考外電︰Esquire Middle East

  Egyptian director Tarik Saleh’s Cairo Conspiracy shortlisted for Academy

  Award



  這裡也補充電影的預告片(不過來源不是海鵬影業，所以沒有中文字幕，但還是有附

  上英字)



  心得︰怎麼這片名會讓人聯想到克莉絲蒂的小說，甚至肯尼斯布萊納拍攝的電影啊XD


  玩笑歸玩笑，「開羅謀殺案」被看好提名奧斯卡國際影片獎五強的機率，是不如

  德國/西線無戰事、南韓/分手的決心...這幾部擁有片商與媒體優勢的電影，

  不過他的劇本與鏡頭設計能力，早已獲得歐美業界的肯定，甚至於也已經獲得美國

  片場邀約，與Chris Pine合作同樣帶有政治陰謀的動作驚悚片救命緝約(Contractor)


  個人也蠻期待去年年齡滿50的他，未來拍攝融合政治題材又不失娛樂性影視作品的

  表現


  --'
