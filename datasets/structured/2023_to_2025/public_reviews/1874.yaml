url: https://www.ptt.cc/bbs/movie/M.1675092412.A.A01.html
title: '[普好雷] 開羅謀殺案'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  2022年12月21日，美國影藝學院公布第95屆奧斯卡金像獎的短名單，最佳國際影片獎項從

  92個地區與國家選出15部出線，其中也包括瑞典代表《開羅謀殺案》。這部作品也奪得

  2022年坎城影展最佳劇本獎，大膽的選材還讓埃及裔的瑞典導演遭埃及禁止入境。雖說標

  題就以「謀殺案」來吸引觀眾，但其背後想探討的政治與宗教意義才是重點。



  漁夫之子亞當幸運考上創立已有1048年歷史的開羅名校艾資哈爾大學，該大學亦是伊斯蘭

  教遜尼派的權力中心。



  「你還很純潔，但這裡的一切都會想盡辦法汙染你。」



  電影的阿拉伯片名意思為「天堂來的男孩」，象徵主角亞當剛從鄉下來到開羅，而且身為

  大學新鮮人的他還非常純真。但就像在他之前的「線人」被謀殺當晚告訴亞當的，來到開

  羅，來到艾資哈爾大學，就宛如掉進一個大染缸。說完這句話後沒多久，前一位線人就慘

  遭謀殺，而這場謀殺案也就是全片所要調查的案件。



  不過，與阿嘉莎‧克莉絲蒂的《東方快車謀殺案》、《尼羅河謀殺案》不同，《開羅謀殺

  案》的重點並不是破解這樁案件，而是在調查這場謀殺案的過程中所捲出的各種案外案。

  被大染缸污染並不是前一位線人的錯，他只是運氣不好，被國安局挑上而已。片中線人的

  代號為「天使」，正如負責招募這些線人的上校要求接班人時所說：「身家背景越乾淨越

  好，最好是新生。」沒錯，純潔如天使的白紙，不但不容易遭到懷疑，也才好操控，能讓

  國安局恣意塗抹成他們想要的樣子。



  其實，腐敗與貪污到處都有，開羅肯定也不例外。即便《開羅謀殺案》並非改編自真實故

  事，但由於背景設定在真實存在的艾資哈爾大學，還是惹惱埃及當局。作為全球伊斯蘭學

  習與阿拉伯文學的中心，又是世界上最早的大學之一，艾資哈爾大學受到政治與宗教把持

  應該一點也不奇怪。雖說教育理當獨立於這些爭議之外，但各國學術機構的校長多多少少

  都與政權有關，畢竟高等教育是最簡單也最有力影響年輕學子，並在他們心中種下思想種

  子的方法。



  若能在艾資哈爾大學掌權，獲得政治上的實權應該只是早晚的事。姑且不論導演是否誤打

  誤撞剛好說中事實，也正是因為他在電影籌備的前置期，對埃及的政治與宗教進行深度的

  調查，再加上導演個人對文化的了解，讓片中所呈現的一切都極為有說服力，可能真有類

  似事件發生也說不定。比較駭人的是，負責招募線人的上校並不知道這些他稱為「天使」

  的孩子們，不再為國安局工作後，居然是由國家出手將他們除掉。不禁讓人想起近日

  Disney+的台灣影集《台灣犯罪故事》裡的第四單元《黑潮之下》，過去軍中結案比真相

  重要與刑求的可怖內幕。



  除了政治的黑暗面之外，《開羅謀殺案》也充分利用伊斯蘭世界的特殊宗教文化。上校要

  求亞當參加晨拜，或許是由於遜尼派每天祈禱禮拜五次：黎明、中午、下午、日落與最後

  的晚禱，而什葉派只祈禱三次，早晨、中午與日落。在伊斯蘭教的兩大教派當中，遜尼派

  是相對較為溫和的派別，但同時塔利班與伊斯蘭國都是激進的基本教義遜尼派。



  片中還出現類似於IS發行的恐攻教戰手冊「孤狼聖戰士安全指南」的書，與亞當的純真形

  成強烈的對比，他也因為這本書，差點丟掉小命，甚至必須出賣好友來取得信任。就連詩

  經朗誦是究竟能不能吟唱，還是只能唸誦，都成為極端份子用來標示異己的工具。但其實

  ，如同多數正派的宗教，伊斯蘭教也是崇尚和平的，任何宗教都有信教到走火入魔的情況

  ，片中的詩經朗誦比賽除了能讓觀眾感受到一般伊斯蘭信徒的虔誠之外，也能體會到將可

  蘭經銘記在心，或唸誦，或吟唱出來，是多麼美妙的一件事。



  相信導演拍攝《開羅謀殺案》並非想要汙衊伊斯蘭國家與埃及，反而是開創出諜報電影的

  全新可能性。如果詹姆士‧龐德與傑森‧包恩能夠存在於軍情六處與中情局，那為什麼伊

  斯蘭國家不能拍攝屬於自己獨特風情的諜報片呢？雖說最後調查整起謀殺案已經不是重點

  ，還是稍嫌可惜，給人前後無法串聯之感，但真相終究是水落石出，而亞當象徵的純真還

  是獲得美好的結局，過程中的緊張刺激仍舊讓本片值得一看。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
