title: '[好雷] 開羅謀殺案 Cairo Conspiracy'
content: '雷文防雷資訊頁


  開羅謀殺案

  Cairo Conspiracy

  2022瑞典-法國-芬蘭電影

  Boy From Heaven

  阿拉伯語：




  學校是最危險的地方！驚悚遊戲的棋子…亞當幸運考上開羅的艾資哈爾大學，該校是伊斯

  蘭教遜尼派的權力中心。就在開學當天，宗教領袖大伊瑪目，竟在對學生歡迎演說時突然

  倒下。這場突如其來的死亡，誰會是大伊瑪目的繼任人選？某天清晨，一名學生被發現陳

  屍在校園，亞當的大學生活，也從此有了天翻地覆的轉變…。




  在爛番茄上，根據 34 條評論，該片的支持率為 79%，平均評分為 7.3/10。 該網站的共

  識是：「儘管本片可能無法完全釋放其充滿張力的背景和前提，但其出色的表演和複雜的

  劇本，提供了令人滿意的補償。」根據 Metacritic 的說法，該片根據 14 名影評人的加

  權平均分為 72 分（滿分 100 分），這部電影獲得了“普遍好評”。

  該片被選為第 95 屆奧斯卡金像獎最佳國際長片的瑞典參賽作品，併入圍 12 月入圍名單

  。






  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  本片探索宗教，人性及政治等議題，令人痛心疾首的古今中外常見的政治謀殺，劇情精彩

  豐富，別具內涵，個人滿意度85分（滿分100）。


  以下有劇透。




  1.看到男主亞當被迫當臥底，真的為他感覺心酸。    雙面諜，無間道，卧底人等下場，

  多半是難以善終吧？這就是臥底或情報人員的悲哀，古今中外的國家社會狀態亦相同──

  若對國家仍有用處，即便要勞師動眾、安排換囚行動，國家也要保護情報人員，更會被拿

  來大作文章宣傳；然而，更多的時候，那些從未在史書中留名的情報人員，或許才是最悲

  劇的存在，可能為國奉獻，最後卻客死他鄉。一些間諜人物，就像小說或戲劇作品中的角

  色人設，通常有著難以圓滿的缺憾，甚至會成為大國角力、意識形態掛帥的時代下，被操

  作的悲劇角色，正好呼應《開羅謀殺案》中亞當的遭遇。


  2.本片又是一部描寫某國背景的故事，但是只能在其他國家拍攝的影片。這是一部製作精

  良的電影，劇本精彩有意義，演員及角色的呈現出色，令人難忘。本片主題是一個熱門話

  題，也是一個非常有爭議的話題：本片的電影製片人，在埃及不受歡迎，這部電影是在土

  耳其〔伊斯坦堡〕拍攝的埃及〔開羅〕發生的故事。在埃及被禁止拍攝及禁止上映的影片

  ，這部電影從根本上震撼了埃及，被認為具有挑釁性，因此被禁止。 攝影運鏡得很好，

  氣氛營造得非常令人滿意。


  3.本片描繪了一個大多數非回教徒所不知道的世界。 創造了一種既神聖又充滿威脅的氣

  氛，而主角在他飽經折磨的脆弱和天生的純潔中，是一個引人注目的旁觀者清的觀察者？

  隨著情節推進，主角處境變得越來越危險，每個場景都引人入勝。這裡的生活很廉價，政

  治影響力非常重要。 這部電影是視覺享受，攝影出色，劇情步調充滿了停頓和沈默，反

  思性的沉默。


  4.男主角亞當不愧是天選之人，從一開始單純的漁民之子捲入政治陰謀，聰慧狠絕（他堅

  決要搞私生子教長時，挺令我驚訝的），全身而退。 幫助男主免於一死的國安政府官員

  沒升職的原因，應該是因為心軟？和他那位誰擋殺誰的上司或同事？對比鮮明。在 政府

  差勁？宗教勢力保守近乎瘋狂？的狀態中，要避免二方內戰，二方還是需要妥協求和平，

  這是男主的理念？先知的生死已不再重要，合作保國為先。


  5.本片看到的角色人設：最熟經文吟唱的生活最世俗、最基本教義的神聖教長私下最敗德

  ，那我們信仰之道真的還要那麼緊守教義形式嗎？真的還要以大學與教會的權力建制為守

  護目標嗎？收尾前的橋段，主角為努力求生之下，試圖去對質盲人長老，要求撤回自首，

  最有趣的地方，是他點破他自認有意義的犧牲，也只會是（不過是）政治角力的一環？


  6.最後主角得以解套的橋段，太精彩了。            也相當引人省思。            主

  角Adam和盲目教長幾分鐘的辯論，結果是關乎二人生死的大事。



  7.看到收尾前主角和盲教長這二人的對話，鏗鏘有力，餘韻未了，令我心儀及回味，本片

  已經足以值得一看。結局看主角回歸大海漁民的定位？安身立命於此？平安且心安理得之

  生存下去，在自己機智應對及合作的國安官員協助之下，免於一死，已屬幸運？


  開羅謀殺案

  CairoConspiracy

  2022瑞典_法國_芬蘭電影

  BoyFromHeaven

  阿拉伯語


  --


  哈哈哈，小羊大對此片的文章推好雷，令我有追看動力，趁有時間，趕快看完這片，没想

  到看完挺喜歡的，驚喜。



  謝謝P大留言鼓勵。



  是在土耳其拍攝的埃及背景故事之瑞典電影，哈哈哈，好複雜。'
