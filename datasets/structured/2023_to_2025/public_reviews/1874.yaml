url: https://www.ptt.cc/bbs/movie/M.1676338886.A.193.html
title: '[好雷] 開羅謀殺案 Boy From Heaven (2022 瑞典片)'
content: '上週末《開羅謀殺案》上映了趕快去看！雖然拍攝地點並非開羅而在同為伊斯蘭教卻開放很多的土耳其伊斯坦堡，不過演出伊斯蘭教第一學府 Al-Azhar
  「艾茲哈爾大學」的是更壯觀的伊斯坦堡 Süleymaniye Camii 「蘇萊曼尼耶清真寺」！看數以百計的伊斯蘭青年戴著圓帽坐在廊下講道真有一種古雅風情，只是萬頭鑽動中如發生「開羅兇殺案」還真不知是何人所為...
  不過閃光看了第一個反應是「都沒有女生」，還真的家裡沒有大學沒有清真寺沒有政府也沒有，街上與咖啡館包頭巾的女路人也屈指可數，令我回想在埃及出差時連外國男遊客地位都比在地女性專業者高...




  本片既叫「開羅兇殺案」自是驚悚片型，廣告還很聳動地強調它「批判宗教與政治」被埃及禁拍才去土耳其！那它對政治與宗教的批判又是什麼呢？片頭字幕開宗明義「Al-Azhar是伊斯蘭世界最古老學府，也是伊斯蘭遜尼派教義中心，歷代埃及政府都想操控卻從未成功」，那麼本片是埃及政府黑手伸進來要搞「政教合一」嗎？也是全男的埃及政府將軍會議的確大張旗鼓要伸出黑手，在當代埃及完全視伊斯蘭教如無物只稱「一國不容兩個法老」！只是這黑手也不能像古埃及般明目張膽理直氣壯，畢竟如果使用軍事力量併了
  Al-Azhar 那可失了法統與全伊斯蘭世界為敵。


  所以這種奪權當然要暗著來，就要責成軍情局上校主角 Ibrahim在 Al-Azhar 佈建內鬼暗中運作，內鬼當然就找上最天真無邪傻傻聽從用完可丟的小男主Adam，竟敢欺負純情小鮮肉這罪無可赦！只是我們觀眾義憤填膺時，看看這萬惡軍情局要運作鬥掉的都是什麼人？這回想起現世政治也是怵目驚心：Al-Azhar雖然學者多聞學生用功看似一片歌舞昇平，但其實內有許多教長與被列為恐怖組織的「穆斯林兄弟會」走很近，許多學生也有基本教義派思想甚至閱讀「聖戰教戰手冊」！當然
  Al-Azhar 言之鑿鑿教會獨立不容政府干預，但若任由極端勢力蠶食埃及又該怎面對國際社會？




  於是莫名其妙就被收為內鬼的大一男主角Adam，就要展開他的 Al-Azhar 驚悚旅程，見識這伊斯蘭世界第一學府的人生百態：(1) 這裡有上舖學長又是抽菸又是舞廳生活超糜爛世俗，但真要比起《古蘭經》吟唱他又領先群雄；(2)
  這裡有神秘學長 Zizo 接近 Adam 暢談教義批判，但看學長被殺後才知他是內鬼幫世俗政府工作；(3) Adam也當內鬼後先要接近的是最用功但也最極端的基本教義派讀書會，萬民普及的《古蘭經》吟唱他們竟都視為信仰的墮落；(4)
  Adam再以助理身分接近的教長 Sheikh Al Durani 雖是基本教義派理應格外聖潔，但私下墮落悖德搞大女生肚子。


  真要說這「開羅兇殺案」的「政教互鬥」有啥腥風血雨嗎？雖然全片以歐式驚悚片規格拍得鬼影幢幢令觀眾為 Adam 擔心揪心，但說到最後 Adam 幫軍情局搞倒的也不過就是個墮落教長、把他淫亂惡行公諸於世身敗名裂就大功告成
  XD 以驚悚片來說不免有點雷大雨小感... 不過對這政教鬥爭風雲來說這裡的「大伊瑪目」Grand Imam of al-Azhar貴為伊斯蘭首席神職是兵家必爭！但觀眾跟著
  Adam 冒險這一回也不免疑惑：軍情局雖是萬惡黑手，但他們對付的不是基本教義派嗎？不是在為恐怖主義鬼影幢幢的當代埃及穩定社會嗎？這與「教會獨立」的神聖價值又如何取捨？




  電影花一個半小時搞倒墮落教長後，剩下半小時才將「政教鬥爭」多方角色總結起來升級對立：(1) 政治方，埃及總統與將軍「一個國家只能有一個法老」，為穩定國家不惜腹黑髒手，只是以暗中操盤為原則不把事做絕；(2)
  軍情局長 Soliman雖年紀較輕但力爭上游爬到這位置，為了上級任務使命必達他不惜犧牲人命搞腥風血雨，已流於偏執極端；(3) 軍情局上校主角事必躬親培養第一線內鬼，知道基層之苦與人命之重，總在上層壓力與下層福祉之間掙扎妥協做出點人性空間；(4)
  教會方，「盲眼教長」Sheikh Negm 看不下軍情局惡行，決心正面宣戰犧牲自己公諸於世！


  唉，當宗教內部以「教會獨立」之名放任極端主義橫行不管、而政治勢力以「國家穩定」之名逾越體制侵犯權利時，這兩方「政教之爭」狗咬狗一嘴毛都有其墮落敗德、難道這只能是選邊站的集團對抗而不能是義理之爭？本片乍看只是走馬看花無關驚悚主戲的
  Al-Azhar 大學風景此時開始有了意義：這伊斯蘭教第一學府中充滿「表面 vs 內裡」的反差，最熟經文吟唱的生活最世俗、最基本教義的神聖教長私下最敗德，那我們信仰之道真的還要那麼緊守教義形式嗎？真的還要以大學與教會的權力建制為守護目標嗎？也許真正應該守護的還另有其事，就總結在倒數五分鐘辯論。




  這辯論，關於盲教長 Sheikh Negm該不該主動頂罪犧牲自己來將政府惡行公諸於世：(1) 盲教長「真信徒不畏懼死亡」說得漂亮，Adam「我是信徒我仍害怕，害怕父親兄弟失去了我」入世務實，盲教長竟答「只要信仰堅強仍能在天堂相遇」；(2)
  Adam基本提問「如果你扛下你沒犯的罪，還能去天堂嗎？」盲教長竟答「意圖是好的，那就可以上天堂」已開始硬凹；(3) Adam提問「我以為真主造我們是為了實現他意願、而非改變他意願」直指求真核心，盲教長竟答「我逃離真主安排的命運、是為實現真主的意願」陷入詭辯已自相矛盾。而最後一句，關於守護建制或守護義理：


  (4) Adam引用先知死後兩大弟子如何面對：Umar拿出了劍「誰說穆罕默德已死我就殺誰」已流露恐懼不願面對先知的逝去，但Abu Bakr「向穆罕默德鞠躬的人都知他已死，而敬重真主的人們都知真主之不朽」已不再依賴先知而能真正信仰。誠哉斯言，正如兩大弟子昔日爭論「守護先知
  vs 信仰真主」、如今 Adam & Negm也在爭論「守護教會 vs 實踐真理」。教會與政府的鬥爭只是俗世權力的移轉消長，但遵循道德堅守真理才是信仰的核心，難道值得為了權力與建制之爭犧牲信仰路上的理智與良心？大人物們堪不破，唯
  Adam 這來自漁村的 Boy From Heaven簡單清楚。




  結果總是世故庸碌集團對抗的兩方大勢力之間，還要有簡單直率靈台清明的 Adam 直道而行，簡直媲美《美國隊長》是引領伊斯蘭世界找回初心的「埃及隊長」呀！看片初 Adam
  這漁村子弟收到入學許可如光宗耀祖、片中上校卻放話暗示那都是軍情局安排、難道漁村小民單純心思正好讓世故埃及納為己用欺之以方？說不定埃及兩方爭戰多年遺忘的伊斯蘭初心、反而需要這「天堂來的男孩」幫他們「禮失求諸野」呢！本片談起伊斯蘭教義雖然我們觀眾未必熟，但放下知識建制直指問題核心亦能跟上那辯論交鋒。推薦喜歡埃及與土耳其尤其喜歡清真寺的觀眾院線欣賞。



  --

  應該不會每堂課都這樣上吧？但專拍中庭上課還真是浪漫！'
