url: https://www.ptt.cc/bbs/movie/M.1690171500.A.D25.html
title: '[好雷] 開羅謀殺案 - 以現世參透教義的電影箴言 '
content: "2022坎城影展的主競賽片最佳劇本\n算一算應該是位居\"分手的決心\"之後的名次\n今年二月曾經上院線\n目前在各大串流平台都應該看的到\n\n\
  \n\n\n雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n (刊登於部落格的原文)\n\n\n\n埃及血統的「諜報片」，不只是講述埃及政治局勢與伊斯蘭宗教之間權力糾葛的情報戰，\n\
  更以作為線民（代號：天使）作為主角，觀眾跟隨這位單純之人參與一場渾沌不明的世俗\n遊戲 （this game），遊走在肯認與否定的權力雙面刃。原片名英譯Boy\
  \ from Heaven天\n堂來的男孩，並非是上天派下來解救蒼生的英雄那類隔絕溫室的浪漫角色，而是當下（地\n獄）即是天堂，以「現世參透教義」的電影箴言。\n\
  \n\n背景資訊，簡單來說，以現今軍方系統支持的總統塞西，與敵對陣營：接近原教旨主義的\n穆斯林兄弟（以「聖戰士」自處，對抗歐美西方「異教徒」）。兩者為了爭奪伊斯蘭教傳\n\
  統伊瑪目宗教領袖的各自人選。而電影的背景艾資哈爾大學，同時也是伊瑪目做為導師為\n學生傳遞知識與教義等真理之所在。\n\n\n「要讓那些愛戴穆罕默德的人知道，他確已離我們而去\
  \ ；而讓那些崇拜真主的人知道，\n真主是活著的，永遠不會死亡。」穆罕默德先知離逝後，大弟子兼好友巴克爾如此說著\n– from 維基百科。\n\n\n《開羅謀殺案》以全然的「諜報片」包裝著阿拉伯世界在當代民主與民粹等各方勢力，試\n\
  圖討論傳統的伊斯蘭教義對於當今政治潮流的啟示。以宗教闡釋表象與精神性關係為電影\n一大「參透」線索（註1），並也非超然的以揭露諸現狀來彰顯（如阿比查邦的《記憶》\n\
  ），《開羅謀殺案》靠著情報收集之間的情節，與所謂箴言哲理交纏的特殊敘事。\n\n\n電影以盲人長老作為先知，首先點出「盲目的真理」的有趣雙關概念：一是接近佛教，所\n\
  謂諸法空相，講白話一點就是感官招致的欺騙與遮蔽，同時也來到第二層意義：政治流的\n迷失，或可以理解為當今社交媒體的按讚流的迷失。而電影也非「遁入空門」，而是政治\n\
  的群眾（盲目），也許是在掌握權力的雙面刃（作用力），也就是水能載舟、亦能覆舟中\n追求穩定。\n\n\n盲人長老電影前段講課時帶到猶太人馬克思哲學家（註2）：「需求」是盲目的，而自由\n\
  是有意識的「需要」，並提到宗教讓人不去思考的「盲從」指涉。若以政治和宗教的作為\n人「需求」。無非讓人想到莊子在《逍遙遊》提到：「至人無己、神人無功、聖人無名」\n\
  （註3）。裡頭談到限制性，意味著電影中被拋擲的主角（天使）在以「無」作為否定的\n前提，面對權力的作用力，作為電影中被國安局控制的不自由個體，如何面對現況消極的\n\
  積極意義中，活出自我的樣態。\n\n\n電影中軍方代表國安局最後成功推舉自方陣營的長老作為伊瑪目，同時也意味著在電影中\n無黨派色彩堪稱最公正的盲人長老無法帶領群眾，印證著（群眾）盲目的真理，同時想到\n\
  莊子典故「曳尾塗中」（註3），在泥巴中卑屈爬行活出自己的烏龜，相對於廟堂上的神\n龜，只是剩下龜殼被人膜拜著才是宗教（或政治 ）被群眾需要、簇擁，在「我」（那隻\n\
  爬行的烏龜）生下來即存在的現狀。（也同時意味著符合盲人長老：「善意謊言」）\n\n\n原片名「天堂來的男孩」巧妙的利用線人代號：天使，作為真主（神）的「使者」並非真\n\
  主本身。那麼何謂真主？真主就在我們當下面對的考驗中。如同《開羅謀殺案》片尾主角\n「任務完成」之後回到家鄉，回到地方的清真寺，長老把他的帽子脫下問他：去學校學到\n\
  了什麼？鏡頭中主角表情說明了，那個難言且百感交集的答案。也就是「現世大學」給予\n每個人面對難題的同時，其實也給予了答案本身。\n\n\n\n（註1）\n也包含我們（台灣）被「歐美俗世」餵養的「重口味」（如：不可能的任務電影系列），\n\
  《開羅謀殺案》裡面描述的偷抽菸、偷看禁書就足以被懲罰簡直會讓人覺得不可思議。如\n此文化差異造成電影氣氛的素樸，或說因為過於平淡沒有太浮誇的緊張感。或是同樣主角\n\
  身為臥底的無間道，想像在頂樓交換情報，電影則是在一家咖啡店，假裝打手機也還蠻好\n笑。諸如此個體在情報戰中各種角力拉扯的「身不由己」在《開羅謀殺案》同樣可以如此\n\
  解釋，只不過這樣就會錯過在電影頭尾埋設可以參透更深入的箴言。\n\n（註2）\n不太清楚是不是資本論作者馬克思，但在此不深究下去\n\n（註3）\n筆者參考《哲學談，淺淺地》節目，黃玉麟老師的解釋。節目連結如下，也蠻推薦這個節\n\
  目的，雖然已停播但網路都有存檔\n\n\n（註4）\n同（註3）影片前段\n\n--\n\n拉特飯 - 以商業力量進入獨立市場\n(剛搬家內裝待修)\n\n--"
