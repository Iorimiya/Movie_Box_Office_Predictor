title: '[情報] 《美國隊長：無畏新世界》全新預告'
content: '今天的D23 Brazil發表會上，漫威影業公開了的《美國隊長：無畏新世界》的全新預告與

  海報，






  在與新當選的美國總統「雷霆」羅斯會面後，山姆威爾遜發現自己被捲入了一場國際事件

  。他必須在真正的幕後黑手讓世界陷入危機與混亂之前，找出全球陰謀背後的原因。


  《美國隊長：無畏新世界》預計將於2025年2月14日在美國上映。


  --


  炸雞叔的角色有台詞了，




  跟紅浩克在預告中首次亮相相比，特效看起來比想像中好不少了，






  但最希望還是劇情不要像之前網傳的那樣…


  --'
