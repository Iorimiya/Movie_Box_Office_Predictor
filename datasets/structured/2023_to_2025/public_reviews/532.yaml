url: https://www.ptt.cc/bbs/movie/M.1739370489.A.67F.html
title: '[普雷] 美國隊長 無畏新世界'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n    這部我覺得前置除了復聯主線,只需要看過無敵浩克和永恆族就足以~\n\
  主要人物和故事衝突的背景比較清楚\n\n影集獵鷹和冬兵不看似乎還好,我自己是只看了前幾集,影響不大,\n至少山姆的自我質疑在影集就處理好了,不用等到電影觀眾還要看他糾結,這是好事\n\
  \n打戲還行,畢竟看過血清怪物/外星人等級的打鬥後,\n看這些凡夫互啄也不可能被驚艷到,但山姆新美隊的風格還是挺不錯的,\n肉搏是一定比較弱,但盾牌/翅膀/瓦干達/無人機搭配起來,\n\
  也是有從副搭檔成長為主看板的安心感,新菜雞由新獵鷹繼承~\n\n肯定點有2\n1.這部沒有很嚴重的漫威式要你笑,像雷神3.4蜘蛛人3那種就誇張了,\n台詞對話滿滿都要塞笑點,已經太多部了,都已經疲乏了只求他們正經講點話,\n\
  這部就好多了,不會在很正經的時候還是要把對話弄成喜劇這樣.\n\n2.節奏緊湊,有些人在知道片長不到2小時就在說什麼曼威要完,但我是肯定的,\n動作片本來就不用那麼長,緊湊更重要,負面示範黑豹2中間就有一段太拖節奏了\n\
  \n最後,彩蛋越來越沒誠意,已經很多部都覺得沒必要多等那幾分鐘了~\n綜合心得下來是普普,沒用上強力反派腳色就比較可惜,只會搞神出鬼沒,\n但浩克的武力有好好表現出來就能接受了!\n\
  (把美國總統變怪物和大拆白宮/特區象徵物,也是很佩服美國的文化自信XD)\n\n第五階段我的排名是~\n星異3>>美隊>>驚隊2>>死侍金鋼狼>>蟻人量子狂熱\n\
  \n--\n謝謝提醒我打錯了,我還真的把有機堡那部整個忘了xd"
