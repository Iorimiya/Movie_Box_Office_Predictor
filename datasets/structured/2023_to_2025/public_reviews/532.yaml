url: https://www.ptt.cc/bbs/movie/M.1739599832.A.D4E.html
title: '[普好雷] 美國隊長4-無畏新世界 '
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n聽說這一部有歷經重拍跟修改過好幾次\n\
  \n我覺得以這樣的狀況來說，能呈現出這樣的劇情我覺得已經算是合格線以上了。\n\n特別是對比雷神4、驚奇隊長2、蟻人3這三部我都看到睡著....\n\n這次的美隊4通過我(對我來說太難看的電影我會睡著，而且醒著的時候看的劇情會\n\
  完全沒有印象)沒有睡著的測試，那基本上就在\"普\"以上的評價了，雖然說難以跟美\n隊123比，但至少沒有其他系列這麼悲劇。\n\n其他我覺得都可以接受的部分就不多說了，以下幾點算是我覺得比較沒有表現好的地方。\n\
  \n\n1.打鬥\n\n這次的武術指導不知道是誰，我覺得有點糟，既然要強調獵鷹版美隊是普通人超級英雄，\n就更應該在武打動作上設計地更華麗、更呈現技巧一點，但這點在裡面幾場出現的打戲\n\
  完全沒有感受到，那種動作迅速、快速瓦解對方攻勢或切入對方弱點進行打擊的部分，\n武打不夠帥的話真的你還是去打血清好了....。\n\n怎麼樣呈現以巧破力的感覺以現在的電影技術應該不難吧?\
  \ John Wick 也是凡人之軀但是\n打戲就有辦法拍出超人類的感覺，怎麼美隊4好像當真把「普通人拍成普通人」。\n\n2.炸雞叔戲份\n\n不知道幾番大修的劇本到底是怎麼一回事，感覺炸雞叔在裡面的塑造一下子好像是事件的\n\
  要角、一下子又只是提供情報的NPC、要襯托出獵鷹版美隊強於凡人的地方我覺得也沒有\n處理好，這條支線顯得很雜亂無章。\n\n\n另外想問一下，炸雞叔手上那把左輪槍，是不是Chiapa\
  \ Rhino系列的左輪手槍啊?\n\n (個人喜好，左輪手槍真的很帥)\n我不知道有沒有數錯，但我聽到槍聲是9發，左輪手槍一般有這麼高的裝彈量嗎?\n\n\n\
  總之綜合各種狀況來說，這一部我勉強可以給個普~普好雷的分數。\n\n--"
