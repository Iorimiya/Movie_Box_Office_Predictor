content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  觀影證明：



  前言：

  沒有特地置入SJW小弟都能接受，最近看過媽佛最誇張就是驚肥少女，那畫面一出就是難

  看，糟，醜死了！但因為有多隻佛萊肯、否則根本不會想進電影院。


  內文：

  戰鬥場景都不錯，山姆穿上美隊戰服也OK，當然小弟心目中的美隊只有史提夫(而且要Chr

  is Evans飾演)，比較大記憶點深刻的只有在天神島那邊有戰艦，戰鬥機，山姆跟新任獵

  鷹以及最後福伯跟山姆在白宮打到櫻花樹那裡，還有一些黑豹跟美隊的影子在山姆身上，

  其它感覺沒什麼重要，大概就是這樣；


  片尾只有一個，提到有其它宇宙要入侵與美國隊長即將回歸，太棒了啦但有得等了。XD



  結語：

  秀泰（螢幕X）觀影體驗實在很差，早場票390$，那個螢幕銜接處還有展延的畫面根本模

  糊還大打沈浸式體驗，真D笑死人！不會再買第二次不如看（IMAX）。


  所幸來喝杯櫻花麻糬草莓風味紅豆布甸星冰樂～星期五之前大杯（含)以上買一送一喔。


  --'
