url: https://www.ptt.cc/bbs/movie/M.1733150273.A.47D.html
title: '[新聞] 《美國隊長：無畏新世界》據傳試映反應'
content: "《美國隊長：無畏新世界》據傳試映反應不佳，面臨再次補拍...\n報導還稱「導演有可能被換掉」\n\n\n\n如今距離《美國隊長：無畏新世界》上映不到三個月，這部片傳出因為最新試映的反應不\n\
  佳，必須進行再次補拍。\n\n《美國隊長：無畏新世界》動盪的製作過程\n\n《美國隊長》第四集的製作過程可謂充滿波折。電影曾改名（最初片名為《新世界秩序\n New\
  \ World Order》），也因加入薩布拉（Sabra，設定為以色列特工）而引發爭議，該\n角色已被重新設計以迎合「當今觀眾」。此外，本片製作因好萊塢罷工多次延期，補拍作\n\
  業則貫穿了整個 2024 年。\n\n根據內幕人士丹尼爾里奇曼的消息，由於試映後獲得的負面回饋，漫威再次決定為《美國\n隊長：無畏新世界》進行補拍。\n\n目前尚不清楚觀眾對《美國隊長：無畏新世界》有什麼具體的不滿。先前《World\
  \ of\nReel》的一篇報導指出，一些適應觀眾認為本片「毫無必要」且「平淡無奇」，其他聲音\n則批評其動作場面，認為漫威安排的動作設計「不夠宏大也不令人滿意」。\n\
  \n補拍對《美國隊長：無畏新世界》未必是壞事\n\n不過，正如漫威電影宇宙製片人路易斯德埃斯波西托所說的，補拍在任何漫威電影中都是\n標準操作，因此未必代表電影本身品質不佳。他在《漫威電影宇宙\
  \ 10 年創造史》一書中\n提到：\n\n「經歷了前兩部《鋼鐵人》電影後，我們就知道無法在拍攝期間達到 100% 的效果。\n\n漫威會告知所有演員，將來會有額外的拍攝。我們會提供日期以便他們預留時間。『你們\n\
  要拍什麼？』他們會問。我們不知道。但我們知道需要補拍。」\n\n換句話說，補拍對《無畏新世界》而言未必是壞兆頭——但也有可能是不好的訊號。《\nWorld of\
  \ Reel》近一步聲稱導演朱利葉斯奧納「很可能在最近的一輪補拍中被取代」。\n這篇報導還表示，《美國隊長：無畏新世界》「受到頻繁補拍和預算膨脹的困擾」。\n\n\
  《美國隊長：無畏新世界》將於 2025 年 2 月 14 日上映。\n\n--"
