url: https://www.ptt.cc/bbs/movie/M.1722159804.A.7CF.html
title: '[新聞] 美國隊長：無畏新世界 炸雞叔反派身分'
content: "《美國隊長：無畏新世界》炸雞叔反派身分曝光！金鋼狼「亞德曼金屬」也確認將於本片\n引入 MCU\n\n\n\n漫威影業今日稍早在 「SDCC 聖地牙哥動漫展」發布會上，漫威大家長\
  \ 凱文費吉（Kevin\n Feige）率領明年即將登場的《美國隊長 4：無畏新世界》（Captain America: Brave N\new World）主創團隊登台，包括新任「美國隊長」安東尼麥基（Anthony\
  \ Mackie）、「炸\n雞叔」吉安卡洛 伊坡托（Giancarlo Esposito）、「紅浩克／羅斯總統」哈里遜福特（H\narrison Ford）與「大頭目」姆布萊克尼爾森（Tim\
  \ Blake Nelson）等。\n\n費吉指出，《美國隊長 4》將再一次帶領觀眾回到《美國隊長 2：酷寒戰士》（Captain\nAmerica: Winter\
  \ Soldier）貼近現實的戰爭作品。\n\n安東尼麥基也說，觀眾將會看到一個「更理智」的美國隊長：「比起史帝夫羅傑斯的肌肉\n（muscle bound）山姆更像是一個以智取勝、有想法的角色。」\n\
  \n此外，吉安卡洛曾經對外放話稱，沒有任何人猜到他在《美國隊長 4》的角色真面目，如\n今他首度揭曉，將飾演反派組織「毒蛇幫」（Serpent Society）首領\
  \ 「響尾蛇」（Side\nwinder）也確實不曾被外界所猜到。\n\n本片也在會場播出了限定片段，其中證實傳聞許久的《永恆族》（Eternals）劇情接續理\n\
  論：\n\n國際社會將會持續探討「天神族」殘骸的後續處理對策，其中片段證實，他們在其中開採\n出了「亞德曼金屬」物質，也就是我們熟悉的「金鋼狼」骨骼和利爪的金屬元素，如今它\n\
  成為全世界最具價值的元素。\n\n片段中，羅斯總統希望山姆能夠組織新的「復仇者聯盟」，但似乎一切不會照著計劃順利\n進行。\n\n漫威今日在「SDCC」活動上還帶來另一波重磅消息，也就是證實《美國隊長》與《復仇者\n\
  聯盟》系列導演 羅素兄弟（Russo Brothers）確認回歸漫威執導《復仇者聯盟》兩部續\n作，並由小勞勃道尼（Robert Downey Jr.）重磅回歸飾演新反派「末日博士」一角。\n\
  \n新聞網址：\n\n\n\n--"
