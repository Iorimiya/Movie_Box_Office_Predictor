url: https://www.ptt.cc/bbs/movie/M.1739633379.A.74B.html
title: '[普好雷] 美國隊長：無畏新世界'
content: '劇情感想版上說得差不多，但想強調的是，看完之後真覺得前75 %

  是美隊2的大綱加後25 %《無敵浩克》的續集合體。


  說一下本集和美隊2的相同之處：


  開場任務時和敵方小頭目打手肉搏（一樣脫面罩）


  一樣出現多人用電擊棒企圖k 倒美隊


  一樣有槍砲偷襲主要角色車輛（美隊2冬兵偷襲神盾局長，本集炸雞叔偷襲新美隊）


  劇情中間調查走到偏遠的基地

  （一樣在反派說明真相後被埋伏，美隊2炸基地，本集是大量打手）


  昔日好友變敵人（美隊2冬兵，本集的實驗體隊長）


  不論新舊美隊一樣想救昔日好友


  調查組成一樣美隊、黑寡婦（3號？）、獵鷹（本集是新人）三人組


  上司一樣是幕後黑手


  最後打鬥一樣動之以情說服



  後面25% 是浩克續集的理由是，其實可以看得出來如果要把張力弄到最大，紅浩克

  應該在艦隊開戰時應該出來，但應該不好再補羅斯的心境才延後，讓電影被明顯得

  分成兩個段落。

  以及羅斯，貝蒂和反派藍先生都是浩克電影的人物，決戰一整段有點是讓新美隊被

  迫上場。


  不然以紅浩克定位應該是浩克出來（或浩克和惡煞合作）收服。


  我看完覺得，應該是無敵浩克2的劇本有一半被魔改到本集裡（如果真的有的話），

  但為強調美隊而把角色抽換掉。

  以片名和反派定位來說，最原始劇本應該是藍先生控制實驗體隊長或量產型隊長來

  和美隊決戰，才比較符合片名精神？




  --'
