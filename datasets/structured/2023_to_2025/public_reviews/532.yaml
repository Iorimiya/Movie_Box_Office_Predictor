content: '原本是週四要去看的

  結果就爆炸

  只好拖到週五才去看



  擔不起，就放下吧

  不然你還是打個超人血清吧

  凡人之軀+美國隊長真的不好看


  這集美國隊長事前不被大家看好

  事後也證明的確不是很好看

  劇情上支離破碎讓人難以代入其中

  整體上個人認為最佳的優點大概是紅浩克的力量表現

  但收尾很虛


  獵鷹完全背負不起美國隊長這個稱號

  要我看著他領導著一群復仇者

  那個畫面實在太美

  想想就覺得很好笑

  希望之後可以有個復仇者聯盟4.5來改善這個問題

  不然直接在5裡面把復仇者集結起來

  完全沒有那個看頭啊


  劇情就漫威系列來說

  其實還算是可以看的

  只是真的塞太多東西在一部載體以內

  各講各的

  導致整體電影表現支離破碎

  尤其是當獵鷹撐不起美國隊長這個稱號之時

  故事更加嚴重過水

  讓人難以下嚥



  演員表現還算不錯

  音樂很糟糕


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
