url: https://www.ptt.cc/bbs/movie/M.1679065660.A.28D.html
title: '[好雷] 要如何正面反擊一隻熊 熊蓋毒'
content: '雷文防雷資訊頁


  哈拉


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  熊蓋毒 一開始就引用維基百科 表示遇到熊  反擊比逃跑生存率高  顯然跟劇中不符

  不過有特別講正常的熊不會主動攻擊人類是一大進步  畢竟前例在前  大白鯊被黑得很慘

  還造成鯊魚生存危機  這點很值得讚許


  這部說是真實事件改編 我猜真實部分大概就只有一開始從哥倫比亞運毒到美國跳傘失敗

  造成毒品遺失在自然保護區的部分吧


  總之因為這件事 引發後面的故事

  一包又一包的可卡因散佈在自然公園裡面 其中一包被熊嗑了 就發瘋了

  不過這部與其說是驚悚 更偏向是黑色喜劇

  所以熊也不是無腦的窮凶惡極 而是會追逐著毒品去攻擊


  一開始 在自然公園爬山的男女朋友 因為發現熊發瘋 女的被幹掉

  一對小朋友翹課去公園瀑布畫畫 因為是小朋友所以安全

  女孩母親因為要找女兒 到公園請護林員與野保人一起去找  發現了小男孩 但

  野保男也被幹掉


  為了找毒品 毒品老大請小弟去找背離家族的兒子一起去找毒品

  持續追逐毒品老大的黑人警探也前往自然公園

  還有三個小混混跟警局的背叛者


  逃回小屋的護林員與熊幹掉兩個小混混

  護林員與來救援的救護員兩名被熊幹掉

  老大幹掉黑人警探 但最後也被熊媽與小熊幹掉


  腳色很多 活下來的意外地多  劇情沒有被角色多而拖垮 其實蠻清晰 蠻順的

  如果是想好好被嚇的 不太適合這部片 但是如果是喜愛黑色幽默的爆米花片

  這部就還不錯 至少不會像某些超英的劇情看到翻白眼 雖然還是有些可忽略的劇情不合理

  但是我覺得算OK了 可以理解在美國票房不錯的原因


  --

  是喔 我倒是沒想到'
