content: '取材自


  【熊蓋毒】故事靈感來自發生在1985年的真實事件，一名毒販的飛機失事墜機，遺失了一

  批古柯鹼，結果被一隻黑熊吃掉。這部劇情既荒誕又瘋狂的喜劇片，故事描述一群警察、

  罪犯、遊客和青少年全都聚集在美國喬治亞州的一座樹林，樹林中有一隻將近230公斤重

  的頂級掠食者/黑熊，吞食了一大堆古柯鹼，導致牠野性大發、大開殺戒，結果真的是血

  流成河。



  預告：

  【熊蓋毒】3月17日 粉墨登場 戲院見


