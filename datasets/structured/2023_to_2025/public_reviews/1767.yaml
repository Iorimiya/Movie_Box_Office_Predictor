content: 'Elizabeth Banks其實有說，她不是很想接這部片，因為製作與劇本她都沒有決定權

  她前兩部片都炸掉，導演新的霹靂嬌娃，接著主演的 Call Jane也炸掉


  她訪問說她怕因為熊蓋毒會讓她被定型以後無法再導她想要的東西（女拳?）

  加上如果熊蓋毒如果票房炸掉等於她連炸三部，基本上就很可能再起不能。


  熊蓋毒她完全沒有碰劇本與製作，實際上的劇本與製作都是別人

  Phil Lord and Christopher Miller

  作品有樂高電影1，2，蜘蛛人新宇宙與接下來的作品


  不過這部片成本夠低，加上兩位製作人滿強的，算是carry她一把


  --'
