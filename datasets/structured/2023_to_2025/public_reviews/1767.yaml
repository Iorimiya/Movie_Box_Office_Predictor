url: https://www.ptt.cc/bbs/movie/M.1677488937.A.984.html
title: '[新聞] 美國人愛看《熊蓋毒》！ 首映週末票房狂'
content: '新聞網址：


  美國人愛看《熊蓋毒》！ 首映週末票房狂飆7億元

  2023/02/27 14:07




  〔即時新聞／綜合報導〕美國R級恐怖喜劇電影《熊蓋毒》，主要講述一頭黑熊在吸食大

  量古柯鹼後大開殺戒的故事，並展現出主角們驚險求生的過程，在美國各地上映後深深抓

  住民眾的胃口，首映週末票房達2310萬美元（約新台幣7.1億元），完全可以說是橫掃影

  院。


  據《美聯社》報導，美國週末票房目前仍以《蟻人與黃蜂女：量子狂熱》的3220萬美元（

  約新台幣9.9億元）占據第一，但其評價相當差勁，和首週相比跌幅達69.7％，創下漫威

  電影宇宙的最差紀錄。


  相較之下，《熊蓋毒》以R級電影之姿斬獲耀眼成績，拍攝成本為3500萬美元（約新台幣1

  0.7億元），內容主要取材自1985年的真實故事，當時喬治亞州山區一頭79公斤的黑熊，

  在吃掉毒品走私飛機掉下來的古柯鹼後死亡。


  《熊蓋毒》在NFL超級盃賽前播放預告片，獲得了極大的關注，全球有超過9000萬人觀看

  並在社交媒體上引起了轟動。《熊蓋毒》目前的觀眾評價褒貶不一，但表現仍然算是相當

  出色，美國購票民眾中59％為男性，63％年齡在18至34歲之間。


  ----

  預告片看起來很鬧欸

  從購票狀況來看吸引到年輕族群和男性

  但女性觀眾也不少


  --'
