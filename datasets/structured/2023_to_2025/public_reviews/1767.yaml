url: https://www.ptt.cc/bbs/movie/M.1679065799.A.A0B.html
title: '[負雷] 熊蓋毒，不及格的B級片'
content: '今天中午去看了熊蓋毒，我覺得以B級片來說這部片不及格...


  查了一下，分類確實是R級，但是血漿給的有夠吝嗇


  每次熊攻擊人都意思意思給個鏡頭，然後就用草從或是鏡頭角度遮住了不給看。那個斷肢

  切斷之後也幾乎不流血的，很像市場上放過血的豬腳，你去點一客五分熟牛排來切，搞不

  好流的血更多


  隨便去看一部殺人魔或是殺人為主題的電影，血腥場面都屌壓這部，我小時候看的突變蟑

  螂或是突變蝗蟲，攻擊之後那個人根本是沐浴在血裡


  相較之下這部只有兩個斷腳（過程沒有演出來），一個斷手（同樣沒有演出來），一個被

  大卸八塊（同樣沒有...），一個腸子流出來（只給一個鏡頭）


  然後四個中槍場面，一個是被爆頭，一個手指斷掉，其它兩個胸口用紅色顏料潑一下


  此外這部片沒有半個正妹，沒有猛男，只有大嬸跟大叔，角色安排根本有問題，例如有一

  個大叔死了老婆，被毒梟老爸跟手下逼著來撿毒品，他根本對這件事興趣缺缺，一路上只

  不斷哭自己死了老婆，然後還花了一些戲份描寫他的心境轉變，跟同伴和好，這個人到底

  是來幹嘛？有一個內鬼女警，她的出場對劇情沒有任何影響，後續也完全0作用，安排這

  個角色幹嘛？


  相對於其他電影認真殺人的殺人魔跟殺人動物，這隻熊真的就是四處晃嗑藥，要殺人還要

  看他心情，心情不對了明明目標就在旁邊，可是他就是不開殺


  就這樣，我覺得導演跟編劇大概是抱著拍喜劇片的心情來拍這部片，結果拍出一個四不像

  ，既不血腥，我也不覺得有很好笑



  --'
