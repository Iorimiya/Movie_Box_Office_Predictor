url: https://www.ptt.cc/bbs/movie/M.1702221154.A.64D.html
title: '[好笑雷]熊蓋毒 '
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \  我覺得這部片很棒，但僅限於在串流上看，然後就是殺時間用的\n\n  這是真實故事改編，只不過是亂改啦，\n\n  真實故事就是1985年一個毒販跳傘運毒，結果他的降落傘沒開就摔死了\n\
  \  後來在附近山裡發現一隻死掉的美洲黑熊，身邊有毒販的旅行袋\n  這隻熊死於古柯鹼中毒，好像是吃下了34公斤的古柯鹼\n\n  看到很多人在介紹這部片的時候都給負雷，我也可以理解\n\
  \  因為真的是一部不怎麼樣的B級片，要花錢進電影院看這部的話我是不幹的\n  但在串流上看倒是很OK\n\n  有人說安排一堆故事路線，最後也沒有結果很莫名其妙\n\
  \  我會覺得他大概就是故意這樣的\n  因為這不是一個故事，\n\n  這根本就是一個綜藝節目真人秀的感覺，我是覺得本片很帶有以前沈玉琳的綜藝節目\n  那種感覺\n\
  \n  所以確實本片每個角色都有自己的故事。但是這些人的故事根本不重要\n  他們就是要湊人數的，遇到這隻古柯鹼熊的人越多，故事就會越好笑\n\n  而如果遇到熊的人較少，就會變成一部驚悚片或逃殺片之類的\n\
  \  因為沒得鬧了，如果就只有4人團隊去找古柯鹼，只有一條路線，碰到熊\n  那吸毒吸到瘋的熊跟他們鬧一鬧就沒了，畢竟是要演成熊還是會攻擊人的\n  所以接下來一定只能上演熊追殺人，這樣很容易就不好笑了\n\
  \  就真的會是動物驚悚或是逃殺片類型\n\n  導演伊莉沙白班克絲是演員，這件事大家都知道\n  她近年有幾部作品是當導演跟監製\n  她這樣的處理我覺得很好，畢竟她也不是什麼大導演，以剛剛當導演的狀況來看\n\
  \  這部片以3500萬美元的預算，最後獲得8900萬美元的票房\n  伊莉沙白班克絲的處理方式可以說是成功了，至少是賺錢了\n  如果真的拍成驚悚片，可能不會有這樣的票房\n\
  \n  這部片裡面的幾乎所有人物都很智障\n  我覺得完全就是一種搞笑漫畫風格，是滿刻意弄成這樣的\n  裡面正常的人大概只有那個找女兒的媽媽而已\n  連那個亨利小男生講話也很智障\n\
  \n  男主(應該算男主)是一個剛剛喪妻的黑道老大的兒子\n  黑人是黑道老大的手下，也是男主的至交好友\n  男主過世的妻子之前要他退出黑道，所以他就不幹了，他爸很肚爛\n\
  \  現在毒品掉在山裡面，老大要黑人跟男主去把毒品找回來\n  他順便想讓自己的兒子重新回到黑道事業\n\n  不過男主已經金盆洗手而且很善良，他就很不想做這種壞事，一路上就在想過世的老婆\n\
  \  黑人其實人也不錯，想勸男主又不敢，就只好一直被他煩，男主就一直哭\n  黑人其實就是冰塊酷巴的兒子\n\n  那個找女兒的媽媽，就是女兒跟同學兩個人逃學去山裡面玩，媽媽去找他們\n\
  \  他們的故事線很單純，\n  這個媽媽就是凱莉羅素，我對她的印象最深的就是\"不可能的任務3\"\n  一開始犧牲的探員琳賽，也就是阿湯哥的徒弟，被黑人盧瑟懷疑他們兩個有一腿的女生\n\
  \  我當時覺得她很有御姐的氣質\n  17年後她已經老了，看到她讓人有點感慨\n\n  警察那條線也很正常，就是黑人警察知道當地有毒販摔死，毒品掉在山裡\n\
  \  他要去找看看，然後他領養了一隻小狗，對小狗很有感情\n  他跟黑人女警滿要好的，把狗暫時托給女警，沒想到女警根本就是黑道同夥\n\n  森林管理員那組人全是超級傻瓜\n\
  \  女管理員就是鄉巴佬阿姨，很哈一個愛山的人叫做彼得\n  這座森林裡還有三個白癡青少年在鬼混\n  反正他們就是全掛了就對了\n\n  這些人就是在山裡碰上了古柯鹼熊，然後大家碰到面的時間點不一樣\n\
  \  有人死有人逃有人躲，後來也有跟熊正面接觸\n  他們甚至沒有進到很深山的感覺，大部分場景感覺上是從森林入口進去沒多遠發生的\n  那個感覺很靠杯，\n \
  \ 就是你會懷疑他們到底是找了個森林拍片，還是找個大一點的公園隨便拍一拍的感覺\n  只有到了後段才會走到熊穴裡，有個瀑布，\n  不然整部片看起來就像國家公園入口處的場景\n\
  \n  裡面很多不自然的地方。都直接\"不解釋\"\n  反正不重要，真的不要想太多\n\n  ---------------------\n  這部片全片就呈現一種\"\
  荒謬至極\"的風格\n  包含了好像很差的特效，我都無法確定它那個特效跟那隻假假的熊\n  到底是因為預算只能做這樣，還是故意做成這樣智障的樣子\n  我覺得是故意的，現在的電影應該沒有預算低到做出這麼糟糕的特效\n\
  \  (那隻熊的眼睛，我真的覺得很像早期動物片，是人披著戲服演的，絕對是故意的)\n\n  片中就跟網友說的一樣，熊在吃人時有點意外的血腥，還有開槍殺人畫面\n\
  \  有的時候會出現斷肢，最後甚至有腸子\n  我很難說它真不真，那個場面是有一點點殘忍的\n  但氣氛太荒謬了，所以出現了明明在被吃，但卻還是有好笑感覺的荒謬狀況\n\
  \n  這部片就是白目到，我會去想，伊莉沙白班克絲作為導演\n  在拍攝這部片時，大家到底是很認真，還是現場也在爆笑\n  白目成這樣，我看在片場也嚴肅不起來\n\
  \  應該是很歡樂的\n  所以我覺得這部片很像綜藝節目\n\n  我是滿推薦大家去看的，真的用來殺時間笑一下很適合\n  但是這部片就是智障到，到底要不要把它算成動物片，你都不能確定\n\
  \n  中文片名叫\"熊蓋毒\"，翻得也很好\n  都已經叫熊蓋毒了，你還會期望看到什麼正常的東西嗎XD\n  我覺得片名真的太貼切了\n\n--"
