title: '[討論] Apple TV 特價 世界大戰/回到未來/熊蓋毒'
content: '【2024/05/02 Apple TV 特價報】

  世界大戰／撕裂地平線／科洛弗檔案／燕尾蝶：數位經典版／窒友梅根／熊蓋毒／回到未

  來系列  ／Star Trek系列

  －

  今天的片單有超多熱騰騰的特價，而且相信會讓太空科幻迷們非常滿意。我覺得最值得把

  握的是睽違超過一年才再次特價到$190，湯姆克魯斯和達科塔芬妮的經典演出《世界大戰

  》，以及我個人的童年陰影《撕裂地平線》。《科洛弗檔案》和《科洛弗10號地窖》也是

  兩部同時特價，值得收藏。

  －

  緊接著，繼昨天的《花與愛麗絲》之後，我們今天也整理到同樣是岩井俊二經典作品，寓

  意深遠的《燕尾蝶：數位經典版》。另外這次的環球特價則是走豐富的恐怖路線，有近年

  科幻恐怖的新秀《窒友梅根》和動物恐怖的話題之作《熊蓋毒》，奈沙馬蘭的《詭老》也

  沒缺席。不過我認為其中最有收藏價值的還是《回到未來》的三部全特價，以及塔科夫斯

  基的太空科幻名作《飛向太空》，總之這次環球的新特價非常有料，大家可以參考看看。

  －

  最後是星艦迷的回合！以往的《星艦迷航記》和後來的《星際爭霸戰》全面來到$190/部

  的特價，如果沒跟到之前的優惠，或是想要補齊單部，我覺得這次是不錯的時機。

  －

  以上祝大家看片愉快，生生不息，繁榮昌盛。

  －

