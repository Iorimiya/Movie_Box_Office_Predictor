url: https://www.ptt.cc/bbs/movie/M.1677375937.A.000.html
title: '[討論] 蟻人3北美票房暴跌 熊蓋毒熱賣高於預期'
content: 'Deadline報導連結:




  《蟻人與黃蜂女：量子狂熱》上週末北美開盤表現稱職，


  但觀眾出口民調僅拿到B級，在漫威作品中墊底的評價。


  這個評價看來影響到次周末跌幅，該作次週五北美票房僅取得830萬美元，


  跌幅高達82%，日冠軍也丟了，預計整個週末下跌70%~72%。


  如果最終跌幅符合預期，蟻人3將打破漫威作品最高的跌幅紀錄，


  甚至超過李安版綠巨人當年創下的69.7%慘跌情況。



  本週新片《熊蓋毒》則是意外開出紅盤，週五單日以865萬美元的成績登頂。


  觀眾出口民調僅取得B-，但以該作的風格來說，這評價還算合格，


  目前預測北美週末將以2000萬美元以上的成績開盤。


  這部R級作品成功取得高於事前預期的收益，


  也讓導演Elizabeth Banks一吐霹靂嬌娃賣座失利的怨氣。



  --'
