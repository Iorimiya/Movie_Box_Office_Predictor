title: '[好無雷]《熊蓋毒》'
content: "動物類型的驚悚片印象中只有聽過鯊魚、食人魚、狼、獅子、恐龍、異形，以熊作為主軸\n倒是比較少見，其實本來想說真實事件改編應該會是嚴肅類型的驚悚片而比較沒有興趣(\n\
  後來才知道現實是只有發現嗑藥死亡的熊而沒有發生攻擊事件)，但是一看預告滿滿的黑\n色幽默就實在很想看看。看完果然是既好笑又驚悚的一部電影，幽默與恐怖的調和很恰當\n\
  ，是部優秀的爆米花娛樂片，很適合紓壓觀看；熊熊的部分應該是用演員動態捕捉再動畫\n後製，效果栩栩如生，有些動作真的很好笑；另外場面遠比預告片還要血腥，如果無法接\n\
  受腦漿、斷肢、腸子的人可能要考慮一下。\n\n題外話，我看的是3/14台鋁秀泰場，最後一排右後方一直傳來狗叫聲實在是滿惱人的。\n\n電影事件背景是1985，所以衣著跟音樂都很有年代感，就連官方的電影宣傳小遊戲都是致敬懷舊遊戲：\n\
  英文\n中文\n--\n\nSent from \n\n--\n)\n\n1"
