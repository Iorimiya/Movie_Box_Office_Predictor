url: https://www.ptt.cc/bbs/movie/M.1679064485.A.490.html
title: '[普雷] 《熊蓋毒》熊蓋北爛'
content: '可能原本就已經有了預期，對伊莉莎白班

  克斯執導就沒有什麼信心，看完後還算

  可以，但不算好看，就稍微白爛、幽默黑

  色喜劇，而且編劇方面出了非常大的問題


  95分鐘片長其實可以再把節奏加快點，但

  大概前40分鍾左右都在鋪陳各線，稍微有點

  沉悶，也可能是想趕快看到熊熊大開殺戒，

  所以對於各種鋪陳實在覺得沒必要，且一些

  對話劇情根本可以刪除。


  總共有4條線同時進行，尋找女兒線實在是最

  沒必要，而且後面風格居然變成探險尋寶風，

  完全少掉這線，強化警察、毒販、護林員互相

  的拉扯劇情，可能會更好看點。


  唯一MVP橋段是救護車這一段，真的白爛到

  爆，我想護林員可能覺得不如一槍斃了我吧

  XDDDD


  就很白爛普通的B級片，不血腥，因為都是

  低成本道具特效，斷體殘肢都很假，但很多

  jump scare，膽小的可能要當心。


  只推薦等串流。



  最後 Ray  R.I.P





  -----

  Sent from JPTT on my Xiaomi 21091116UG.


  --'
