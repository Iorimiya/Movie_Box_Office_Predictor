url: https://www.ptt.cc/bbs/movie/M.1680085620.A.334.html
title: 'Re: [好笑雷]  熊蓋毒'
content: '蠻喜歡黑色喜劇的，好像在看南方公園

  一堆很爆笑的死法，那隻熊也畫得很假

  雖然死很多人但都死的很像卡通片一樣

  而且這片的動作指導非常厲害

  是我覺得拍的很棒的動作片

  可能大反派雷尼奧塔覺得這片拍得不錯

  才能放心的在去年撒手人寰吧

  從小看四海兄弟看他的黑幫片看到大

  演了一輩子壞人終於死在這部喜劇片裡

  就像周處處三害一樣被熊吃掉黑心腸歸天


  這片裡面黑人金鍊條流氓

  在廁所跟三個瘦皮猴流氓打鬥

  感覺設計的非常好，很合理的武術指導

  拳拳到肉，很像成龍的功夫喜劇

  難怪能成為美國票房冠軍


  在美國那麼多校園槍擊案的國家

  那麼多槍擊案人倫悲劇，剛好透過這部片

  好好的舒壓一番，裡面一堆人被爆頭慘死

  但都死的讓大家很開心，就像在看卡通一樣


  反正這就是一齣很專業的動作惡搞喜劇片

  本來很不想看的，但實在沒什麼片可看

  就找來看個幾眼，沒想到很順的就看完了

  覺得很滿意的好片，沒什麼期待就不怕受傷害








  -----

  Sent from JPTT on my iPad


