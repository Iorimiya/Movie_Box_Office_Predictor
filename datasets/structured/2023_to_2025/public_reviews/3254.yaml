url: https://www.ptt.cc/bbs/movie/M.1579156216.A.91E.html
title: '[新聞] 賈樟柯揭中國人心事「 一直游到海水變藍」入柏林影展'
content: "新聞網址：\n\n2020-01-15 17:58 聯合報 編譯張佑生╱即時報導\n\n第70屆柏林國際影展公佈部分入選影片片單，中國導演賈樟柯執導新片《一直游到海水變\n\
  藍》入選特別放映單元（Berlinale Special）。影片聚焦社會變遷中的中國當代文學名\n家，這也是賈樟柯時隔19年重返「福地」柏林國際影展的全新力作，賈樟柯以處女作《小\n\
  武》斬獲柏林國際影展青年論壇首獎，奠定國際影壇地位。\n\n《一直游到海水變藍》通過18個章節講述了1949年以來的中國往事，以出生於上世紀50年\n代、60年代和70年代的三位作家賈平凹、余華和梁鴻作為最重要的敘述者。他們與已故作\n\
  家馬烽的女兒一起，重新註釋社會變遷中的個人與家庭，讓影片成為一部跨度長達70年的\n中國心靈史。\n\n談及《一直游到海水變藍》的拍攝初衷，賈樟柯在「導演的話」中表示：「作為一個讀者\n\
  ，我一直對那些用筆為我們帶來這個世界最新消息的作家心存敬意。」他發現，故鄉的一\n個村莊「賈家莊」與中國當代文學有著密切的關聯：「當我們以這個村莊為起點開始拍攝\n\
  之後，很快意識到我們進入的不僅僅是中國當代文學的旅程，更是當代中國人的心靈歷程\n。影片裡的幾位作家，講出了他們的私人故事，而這也是中國人的共同心事」。\n\n\
  《一直游到海水變藍》是繼關於畫家劉曉東的《東》（2006年）和關於服裝設計師馬可的\n《無用》（2007）之後，賈樟柯將關注點又一次投向藝術家群體，可稱為賈樟柯「藝術家\n\
  三部曲」的最終章。\n--\n    \n\n;\n\n \n\n\n--"
