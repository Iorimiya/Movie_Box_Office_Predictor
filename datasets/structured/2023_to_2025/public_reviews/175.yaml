title: '[超負雷] 角頭鬥陣欸:節奏瑣碎 內容乏味'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  這集看完感想，大概就是標題給的那8個字


  片長2小時多一點點

  只有後面15分鐘左右 是槍戰大場面


  前面大部分時間

  都在展現各種談判、溝通的環節

  其中有個很差的點

  兩個相接的片段之間，對話內容關聯性低


  A幫派講完一段話

  接著換B幫派對話...結果對白是獨立的

  再來跳到C團體對話...對白又是這樣子

  這樣搞下去好幾次

  劇情之間很難串聯、節奏變得很瑣碎

  觀眾也會感覺很拖很累

  然後警察那派的支線劇情~真的不需要


  而且

  對話風格又偏向說教式

  看久了真的會覺得乏味



  最後面的火拚

  雖然看起來凶狠

  但整體呈現出來的動作場面

  例如持槍、開火、肢體、語言

  就像是學生拿水槍互射的等級...

  還有過程好幾個"操你媽"配音

  感覺好出戲 = =



  再來講演員部分

  演警察的 一整個尷尬感

  瑞馬席丹 在裡面應該是演一個高級幹部

  但她演技和對白

  我覺得有種生硬、念台詞的感覺


  還有阿標把走私船長幹掉的片段

  對著船長說一段英文的樣子和氣勢

  真的超硬要+出戲到不行....


  再來崔浩然的對白

  我覺得直接讓他全程台語

  或是全程華語就好

  電影裡面 好幾次台/華語交插講話

  反而覺得很彆扭不自然




  結論

  劇情+節奏+年輕演員演技

  超負雷


  --'
