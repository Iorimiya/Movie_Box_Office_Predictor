title: 'Re: [新聞] 《角頭－鬥陣欸》上映一周火速破億 '
content: '這部看來無法破兩億

  頂多1.7或1.8億

  致命傷是文戲太多、武戲太少

  大橋頭起碼看麥可橫衝直撞很爽


  這部現在只能狂衝影人場

  不過反正本來也是影集

  硬多剪一部電影，也算是賺了

  我猜下週影人場應該是末段班

  這週小廳影人甚至稱不上爆滿

  雖然瑞豐夜市掃街人潮還是很多

  但明顯沒有大橋頭多


  這對96分鐘算是好消息

  若96這週特映口碑能衝出來

  能夠下週去拼第二名


  角頭影人場且看且珍惜

  然後抓一下，不要去搶那種映後還有映前

  那種都會趕場，你搶不到簽名合照的

  想要簽名的

  賭最尾場映前，影人可能早早入場等大家

  趕快進場有機會搶到1-2人的簽名


  觀察人氣排名

  仁哥>捷哥>>>其他

  （南部無阿慶）

  只能說演員人都很好

  有機會都能簽名互動

  筆要帶好就是

  ----

  Sent from  on my iPhone 16 Pro


  --'
