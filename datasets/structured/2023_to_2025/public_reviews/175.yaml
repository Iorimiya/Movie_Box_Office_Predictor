title: '[普雷] 角頭 逗陣欸'
content: '前半段敘事混亂

  想要多線展開

  但每條線都演一小段就跳另一線

  因為太混亂前面一直在分心

  一直到哈達槍戰才開始專心看


  八點檔老演員都發揮水準

  年輕演員講台詞一樣很尬

  雖然過往角色都有露面

  但每個人戲份都不多

  開頭的北館五虎…除了鄭人碩罵幹你娘雞掰有印象外根本沒什麼戲份


  整個反派就蠍子哥講台詞最自然

  狠、痞、奸，幾個反派個性都自然演出

  蠍子哥出場讓這部片有些看頭


  最後麥可哥帶著外國小弟回歸接角頭

  要和新反派標哥組超尬大橋頭陣營…

  以後大橋頭小弟要會撂英文嗎XDD


  這集沒有大型械鬥場面

  大都是槍戰但都打不到人就是了

  主線回歸到幾個老演員本身的角色背景


  因為警察支線沒注意看

  他是去找雞時被偷拍嗎？

  剛開始他去抓毒販還以為是守序正義

  看到後面變成蠍子哥勁敵

  真的很混亂…

  -----

  Sent from JPTT on my iPhone


  --'
