url: https://www.ptt.cc/bbs/movie/M.1755754779.A.A03.html
title: '[好雷] 角頭：鬥陣欸'
content: '觀眾數不算少,以早場人數來說

  先說結論是好看,應該或希望會有續集

  本片人物很多,建議先看這此網頁會更清楚




  雷文防雷資訊頁






  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  先解釋角頭系列的時間軸順序為

  角頭－大橋頭(2024年)

  → 角頭－鬥陣欸(2025年)

  → 角頭－浪流連(2021年)

  → 角頭2：王者再起(2018年)

  → 角頭(2015年)


  再解釋各大勢力

  1.頂庄老大=勇桑,老二=清楓

  2.大橋頭老大=KO桑,兒子=麥可,老二=文正,蠍子為麥可手下

  3.北館老大=貴董,老二=仁哥,底下有五虎=慶,超,宗,胖跟潘

  4.北城老大=哈達,兒子=憨春

  5.東門幫老大=喜爺,底下有數名東南亞殺手

  6.南部勢力老大=海董,老二=瑪莎


  大橋頭的麥可離開,阿標賣起毒粉

  蠍子哥入獄,但被阿標救出吸收


  海董要在台北買地,喜爺贊成但其他四個老大不肯

  哈達在上集被喜爺斷腳筋,現生不如死,但其他老大不敢報仇

  喜爺跟海董找貴董談買地被拒,所以喜爺命手下殺手殺哈達

  KO桑再命阿標跟蠍子去殺殺手

  勇桑則命清楓跟貴董命仁哥南下殺喜爺,火拼後警察趕到


  另瑪莎跟阿標買毒粉但不順利,後來找文正談妥

  在交易時黑吃黑,雙方火拼後被警察抓捕


  結局為阿標殺KO桑,並迎接麥可回來

  彩蛋為阿標送喜爺出國,並說殺KO桑是禮物


  其中穿插一名警察跟傳播妹,其實這可看可不看

  此外本片除了殺人戲外,也有露點玩樂畫面


  應會有下集,因最後警察有說要抓蠍子...

  最後希望本片的票房好,才會繼續拍下去！


  --'
