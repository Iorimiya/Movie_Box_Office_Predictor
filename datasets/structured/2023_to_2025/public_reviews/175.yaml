url: https://www.ptt.cc/bbs/movie/M.1745210126.A.06A.html
title: '[新聞] 《角頭－鬥陣欸》定檔暑假 「六大巨頭」'
content: '新聞網址：


  記者許瑞麟報導／去年《角頭－大橋頭》在台創下2.3億票房紀錄，如今該系列全新電影

  《角頭－鬥陣欸》宣布定檔，監製張威縯表示：「《角頭》影集就是一部很長的電影，原

  本規畫為15集的影集，現在直接將影集內容縮短，規畫出了電影《角頭－鬥陣欸》，即將

  在今年暑假隆重登場，正式與大家見面。」


  監製張威縯形容《角頭－鬥陣欸》是「大人版」的《角頭－大橋頭》，笑說：「完全是兩

  種不同的形式在講黑社會的階級概念，《角頭－大橋頭》比較像小孩子打架，《角頭－鬥

  陣欸》是一群已經相當有地位的老大，彼此互相勾心鬥角、爭權奪利。」


  導演姜瑞智則透露，《角頭－鬥陣欸》可以看到更多內斂、更多權謀、更多爾虞我詐、更

  多算計，「每一位角色真的在飆戲，每一句話都有兩種、三種以上的含義，一句話聽起來

  每一次都有不一樣的味道。」


  《角頭－鬥陣欸》劇情設定在《角頭－大橋頭》之後，阿仁（王識賢飾）忙著整頓「北館

  」內部兄弟間的摩擦，對外跟隨老大貴董（高捷飾）奔波。喜爺（喜翔飾）推動都更的野

  心越來越大，更拉攏南霸天海董（崔浩然飾）來關心，彼此嘴裡稱對方是認識多年的「鬥

  陣欸」，但內心各有盤算，原本和諧的角頭秩序、兄弟情感隨之分裂。


  王識賢飾演的「阿仁」忙著整頓北館兄弟間的摩擦。（圖／曼尼娛樂提供）

  王識賢飾演的「阿仁」忙著整頓北館兄弟間的摩擦。（圖／曼尼娛樂提供）

  另一方面，大橋頭KO桑（龍天翔飾）默許阿標（黃騰浩飾）經手走私毒品的生意，南部海

  董的二把手瑪莎（黃鐙輝飾）砸錢要更大的貨量卻被拒絕，更加深了雙方陣營的歧異。北

  部角頭版圖開始動搖，南部角頭勢力大舉入侵，角頭六大巨頭茶桌上爾虞我詐、權謀算計

  ，南北大戰掀起腥風血雨。


  在最新公布的「鬥陣欸！角頭六大巨頭」劇照中，有「頂庄」勇桑（蔡振南飾）、「大橋

  頭」KO桑（龍天翔飾）、「北館」貴董（高捷飾）、「北城」哈達（太保飾）、「東門幫

  」喜爺（喜翔飾）與全新登場的南霸天海董（崔浩然飾），光是表情都超有戲，暗示認識

  多年、彼此互稱「鬥陣欸」的六大巨頭私底下各有盤算。


  《角頭－鬥陣欸》將於8月21日在台上映。


