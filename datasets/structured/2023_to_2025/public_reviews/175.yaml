content: '鬼滅昨天結束應該已經了，看晚點官方會不會發圖卡

  (我推算約5.01~5.02億)


  隨著新特典投入暑假結束前的最後衝刺，目標是下個週末超過無限列車



  而角頭週五票房比週四的首映日似乎


  角頭是時間越晚越多人看的類型，一般來說隔天休假的週五要比週四好才對，


  推測是被砍了位子給週五上檔的新片：蠟筆小新、脫線神探等


  而客群又太過集中在晚間時段(早上的上座率甚至都不到20%)，晚上位子不夠所造成。


  今天、明天上座率要有以上票房才會跟首映日差不多，


  就看白天時段能不能比平日好一點，只靠晚上是拉不起來的。






  --



  --'
