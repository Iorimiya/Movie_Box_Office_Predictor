title: '[負雷]  角頭鬥陣欸'
content: '簡單來說，整部戲bug一堆，而且拖得要死


  雷聲大雨點小

  前面鋪陳一堆

  最終大戰喜爺毫髮無傷

  被警方逮捕又全身而退搭私人客機出國？


  阿慶前一集又帥又好笑

  這集幾乎沒有存在感


  背骨仔阿標拿刀在幹掉KO桑

  還是在人家的臥室裡面

  沒有半個人懷疑他？


  哈達怎麼知道有人要來殺他

  這裡應該要交代清楚

  不要又要下一集補充欸


  北城每一次都是挨打的份

  小弟養開心的嗎？


  看預告片以為北部要團結跟南部大戰一場

  來個全台黑幫大亂鬥

  結果根本沒有


  這集唯一亮點只有蠍子哥

  怎麼可以癖的這麼好笑

  完全救了整部電影


  整個系列一開始發太多便當

  導致後面補設定越補漏洞越多

  倒不如重開機

  把有特色的角色都找回來演就好


  角頭系列看來只能靠那幾個說書電影YouTuber

  來幫忙腦補劇情補設定了


  題外話

  我以為天母不會有8+9成群結隊來看電影

  沒想到今天去天母新光影城看還是遇到了…


  --'
