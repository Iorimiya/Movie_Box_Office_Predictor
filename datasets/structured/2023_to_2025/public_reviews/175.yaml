url: https://www.ptt.cc/bbs/movie/M.1756359661.A.14F.html
title: '[新聞] 《角頭－鬥陣欸》上映一周火速破億 Micha'
content: '新聞網址：


  《角頭－鬥陣欸》上映一周火速破億 Michael哥王陽明「驚喜歸隊」



  電影《角頭》全新作品《角頭－鬥陣欸》，21日上映7天（27日）全台票房火速破億，超

  越前作《角頭－大橋頭》8天全台票房破億的速度，也刷新《角頭》影史破億的最快紀錄

  。


  劇組為宣傳電影，所有演員全力出動。先前高捷曾提及「王陽明一定會驚喜歸隊」，如今

  「Michael哥」王陽明為了感謝粉絲達成破億票房，確定加入基隆廟口夜市掃街行程，預

  期平日晚間的廟口夜市將再度上演去年萬人空巷的熱鬧盛況。


  遠在澎湖拍戲的鄭人碩，也趁著拍戲空檔無預警突襲當地電影院，在片尾播放工作人員字

  幕、影廳亮燈時，他戴著鴨舌帽、太陽眼鏡在銀幕前驚喜現身，一開始有幾個觀眾沒認出

  來就從他面前離場，後來有粉絲認出他求拍照之後，戲院突然變成小型粉絲見面會，影片

  在網路上曝光之後，許多網友直呼：「好羨慕澎湖人，也太幸運了吧！」


  同樣身為「五虎將」人氣成員，飾演「阿超」的黃尚禾，參與演出《角頭》系列8年，演

  了4部《角頭》電影，也分享8年來見證《角頭》現象浪潮從無到有的心路歷程。他回憶

  2017年宣傳《角頭2：王者再起》時，王識賢帶著五虎將成員鄭人碩、黃尚禾、唐振剛、

  張再興、唐振剛，共計6個人一起在電影院準備參加映後座談，當時電影院工作人員有些

  不好意思跟他們說：「裡面的觀眾比演員少你們要取消嗎？」沒想到王識賢霸氣回覆：「

  就算只有一個人我們也要進去！」


  時隔8年，這次參加《角頭－鬥陣欸》宣傳與過去大不相同。他直呼：「每次走進影廳，

  觀眾都滿到第一排，戲院外也永遠有粉絲熱情的等著！」令他感動不已。他認為或許不是

  所有人都喜歡黑幫的題材，「但如果你正需要一股能量，需要在全世界都說不可能的時候

  ，依然選擇相信、選擇去做，那麼這部電影一定能帶給你力量」。


  首次參與《角頭》系列的「瑪莎」黃鐙輝，上週末跟著《角頭－鬥陣欸》跑遍全台，也感

  性直呼《角頭》是由全體演員及所有粉絲團結在一起，互相鬥陣組成的「團隊」，「北中

  南一天十幾場的行程，累得很爽，因為每一場都有滿滿的粉絲相挺，從早到晚、從南到北

  ，所有演員跟工作團隊累到沒力、喊到燒聲，每天到最後一場依舊是座無虛席，甚至結束

  後看到每一位粉絲待到演員都上車還不肯離去，讓他真的很感動，「只要是各位鬥陣欸有

  需要，無論要跑幾場都不會膩的」。劇組接下來將前往全台5大夜市掃街謝票，地點依序

  基隆廟口夜市、高雄瑞豐夜市、台南武聖夜市、嘉義文化路夜市、台中逢甲夜市。


  接下來就等影集跟三年後的角頭3


  --'
