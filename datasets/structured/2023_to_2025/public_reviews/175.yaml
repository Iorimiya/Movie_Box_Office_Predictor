title: '[請益] 有雷！《角頭 鬥陣欸》的角色動機請教'
content: '防一下雷








  ...



  雖然我有看角頭1和大橋頭

  其他集也有爬文複習過

  但有些片段真的接不上





  這三處想請教一下：


  1.文正莫名其妙介入瑪莎和阿標的生意

  他是想單純在中間抽油水嗎

  借者 “我都答應對方了” 硬要阿標給面子供貨


  這部分是否有潛在的政治盤算我沒看出來

  文正想挑釁阿標做出過激的舉動嗎

  還是想挑時間設局瑪莎，但不方便說明


  這跟主線劇情有什麼關聯性嗎？

  好像拿掉這線對主線沒有影響

  但也可能是我對角頭宇宙掌握不夠



  2.片尾阿標殺了Ko桑的原因是什麼？

  他認真的鞠躬，應該不是抱持恨意

  而是想好好送走他

  為了讓身體機能還良好的麥可接班對嗎



  3.片尾彩蛋中阿標向喜爺打招呼

  應該是暗示殺Ko桑，是給喜爺的禮物

  又說期待跟他合作，為何？

  純粹是因為此舉讓反對陣營-1嗎？

  但阿標好像也不是靠攏海董的人



  -

  不好意思，角色關係真的太複雜了

  我其實不是很愛這類打殺耍狠的元素

  但就輕鬆看，蠍子哥滿好笑的

  角頭常常有碎片化的劇情置入

  實在很難銜接，有請大神指點，謝謝


  --

  懂~是要鋪陳文正的人設，謝謝你！

  我第一集是在客運上看小螢幕，整個不記得人物性格@@

  謝謝，這層好深，感覺有阿標有不少底還沒寫出，看來角頭至少還會拍兩集以上

  瞭解，但是Ko桑應該不難看出來吧  他感覺沒有像哈達那樣有所備

  好奇，市場觀察

  嗯嗯 應該是這樣~謝謝你'
