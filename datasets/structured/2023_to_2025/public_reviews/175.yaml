url: https://www.ptt.cc/bbs/movie/M.1767104398.A.53A.html
title: 'Re: [討論] 角頭鬥陣欸還不錯啊 為什麼噴'
content: '討論角頭系列文 大家都會說

  敗筆是第2集寫死太多人

  我認同 但我總覺得還有真正的重點 少有人提


  無間道1死了很多人 但2、3還是好看

  奪魂鋸老頭第3集就死了但還是可以拍N集


  我個人很愛角頭2

  但我無法接受後續的角頭宇宙的原因是


  角頭2在顏正國歹路不可行的指導原則下

  不僅是死了很多人

  而且是慘死 窩囊的死 廉價的死 死得像個笑話


  沒有任何悲壯 悲劇英雄的感覺 就只是可笑


  因此後面把他們當成英雄來拍 就

  至少我個人沒辦法入戲

  因為我總會想到


  喔 你很帥嗎 很勇嗎 你真的這麼認為嗎

  但你知道嗎

  你再過沒有很久之後 就會


  被虐殺後沉入釣蝦池

  被綁成像沙威瑪之後淋汽油燒死

  跳樓自殺

  手掌被砍斷後被捅死

  手指被砍斷好幾根後從頂樓被丟下去

  等等


  這一切就都變得很荒謬





  --'
