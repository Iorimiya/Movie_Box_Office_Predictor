url: https://www.ptt.cc/bbs/movie/M.1756298594.A.AB6.html
title: '[負雷] 《角頭-鬥陣欸》該出手寫負評了'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  角頭電影宇宙我全都看過，我的排名是《角頭2：王者再起》>《角頭外傳-浪流連》>《角

  頭-大橋頭》>《角頭1》>《角頭-鬥陣欸》。


  《角頭-鬥陣欸》竟然連《角頭1》都輸，排在最後，原因大概是這些劇情太碎，而且前後

  不符，加上人物動機矛盾：


  1. 哈達的死時間對不上《浪流連》劇情



  2.ko桑的死時間對不上《角頭1》劇情



  3.宇道低調找阿超賣毒，但在《浪流連》公開找宗保合作？


  4.小豪被逐出北館，但在《浪流連》一樣跟在仁哥旁邊


  5.喜翔說自己可以談，但北館要你讓利卻裝傻？搞得一副自己很無奈才買兇，太瞎。


  6.瑪莎說自己錢最多，錢多幹嘛跟阿標買貨販毒？原地退休就好了啊！


  7.南霸天讓瑪莎黑吃黑大橋頭的文正，要動也是先選之前談崩的北館吧？大橋頭之間跟喜

  爺比較親近，喜爺南霸天關係又很好，怎麼說瑪莎都該找文正結盟吧


  8.阿慶他們乾一杯就變五虎了？沒有五個人先一起出任務累積戰功？


  9.警察支線可以全刪，拖戲且不影響主線劇情。


  10.船長沒後台還敢勒索黑道阿標？阿標從槍林彈雨中生還，這種實力還敢惹？





  要看更細節的話，都在這：




  --'
