title: '[討論] 角頭 鬥陣欸 開頭（有雷）'
content: '就是開頭阿標走私毒品那邊


  到底開槍掃射他們的是哪路人馬？


  阿標雖然有不爽跟妃姐靠北了幾句


  但妃姐也沒正面回答 後面劇情也沒有解釋


  另外瑞瑪席丹的角色也很奇怪


  警察打炮的影片是能威脅什麼？


  男未婚女未嫁 打個炮怎麼了嗎？


  總之整個劇情就很破碎


  不知道鄒兆龍會不會來客串一下


  角頭二最後提到的老闆娘是妃姐的話是不是有可能


  就把健合會的故事串起來了


  還有那個光頭佬在浪流連不是世界那邊的人嗎？


  高捷臉書說浪流連跟鬥陣欸是同一時間線的事情


  那光頭佬可以這樣兩邊跑的歐


  又是另一個bug

