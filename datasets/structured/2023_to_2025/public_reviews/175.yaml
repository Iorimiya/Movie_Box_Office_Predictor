content: '目前有個小問題啊




  雖然這次更快破億，但是領先主要集中在首週末，次週的平日衰退很明顯


  尤其到了昨天，跟上週四的首映日相比，也就是僅剩三分之一的票房


  相比之下，前作的同期衰退左右


  截至昨天，同比第8天的累計票房還有400萬的微幅領先


  在第5天時最高差距曾經來到1000萬左右，但這週末結束很可能就要陷入落後了


  更糟的是，比前作還要晚一週才上映，


  他將更快面臨到暑假結束的衰退期，想要反超是不可能的


  雖然還是賣座國片，但這麼快就出現IP價值下降是個警訊



  是什麼讓最強國片IP衰退的呢？


  1.年貨電影頻率太高，膩了


  2.這部真的不好看，口碑不佳


  3.鬼滅太強了，鬼滅還沒有使出全力的樣子，就算是第4週的鬼滅也會贏


  4.???


  --



  --'
