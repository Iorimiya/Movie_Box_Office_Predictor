url: https://www.ptt.cc/bbs/movie/M.1750315258.A.408.html
title: '[新聞] 《角頭－鬥陣欸》老大互撕！蔡振南不忍了'
content: '《角頭－鬥陣欸》老大互撕！蔡振南不忍了自組「鐵三角」切割　火爆一觸即發


  記者蕭采薇／台北報導


  億萬IP電影《角頭》系列全新電影《角頭－鬥陣欸》，集結《角頭》全明星演員共同演出

  ，揭開六大角頭「鬥陣欸」背後的人性角力與兄弟情義的暗潮洶湧，每句對白都話中有話

  、火藥味十足，對於飾演「東門幫」喜爺的喜翔在片中只顧利益、背棄兄弟，飾演「頂庄

  」勇桑的蔡振南不忍了，霸氣嗆聲：「我們三個心比較近，跟他『分得比較開』！」


  自從《角頭－鬥陣欸》宣布定檔之後，片名「鬥陣欸」到底是什麼意思，引發網友熱烈討

  論。監製張威縯在最新幕後花絮「鬥陣欸篇」當中直言：「什麼叫鬥陣欸？可能是知己，

  可能是讓你很開心的人。」不過「語氣」只要稍微不同，就會傳達出不同的涵意。


  導演姜瑞智補充：「在角頭世界裡，『鬥陣欸』有時是種稱呼，有時是關係的建立，有時

  卻成了『落眉角』（指找麻煩、挑釁）的手段。」正如同電影故事當中，角頭兄弟之間情

  義與利益交織，話中有話，語氣稍微一變，足以瞬間變成火爆場面。


  《角頭－鬥陣欸》故事延續《角頭—大橋頭》，王陽明飾演的「大橋頭」Michael離開之

  後，北部角頭開始動搖，六大角頭巨頭昔日情誼撕裂，如今開始各自盤算、權謀鬥爭一觸

  即發。


  喜翔飾演的「東門幫」仍不放棄都更大餅，虎視眈眈其他角頭的地盤，逼得「頂庄」勇桑

  、「北館」貴董、「北城」哈達自組「鐵三角」，彼此有一致的共識團結抵抗。


  飾演「頂庄」勇桑的蔡振南表示：「勇桑、哈達跟貴董，這三個心比較近。」更直言與喜

  翔飾演的「東門幫」喜爺「分得比較開」。飾演「北館」貴董的高捷則點出衝突核心：「

  強勢的作風與行為，就有了一些衝突。」


  花絮中提及「建案是幾百億的事情」，道盡兄弟間血淚與算計。喜翔飾演的「東門幫」喜

  爺在《角頭－鬥陣欸》為利益拋棄情義，冷淡地說：「情不能說服你，為了幫派、為了利

  益，我必須把這個情放下。」


  飾演「大橋頭」KO桑的龍天翔談到都更與南北資源分配問題時，低調警告：「如果是喬不

  好的話，我們就是後面看著辦。」飾演「南霸天」海董的崔浩然一語中的：「在他的立場

  沒錯，在我的立場就扎耳（刺耳、聽了不太舒服）。」角頭巨頭兄弟間的恩怨情仇，「深

  水炸彈」已到一觸即發的邊緣，南北大戰即將開打。


  這次《角頭－鬥陣欸》圍繞在六大角頭巨頭之間友情、利益的選擇，六位演技派巨星同框

  飆戲，展現台灣黑幫世界最真實、最震撼的權謀爭鬥。龍天翔直言很過癮，「整個場面熱

  絡又有震撼力！」


  對於片中「鬥陣欸」之間的兄弟情感，每一個老大有不同的想法，蔡振南坦言：「分得很

  清楚，有恩必報、有仇必報。」崔浩然則說：「什麼叫兄弟？腦袋瓜揶在腰桿上！」複雜

  又難解的兄弟情義關係，高捷賣個關子說：「觀眾朋友去看戲之後會更清楚！」





  --'
