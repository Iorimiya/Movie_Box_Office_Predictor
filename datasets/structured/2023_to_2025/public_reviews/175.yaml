url: https://www.ptt.cc/bbs/movie/M.1755960400.A.527.html
title: '[普雷]角頭-鬥陣欸 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~














  今天下午去看了角頭-鬥陣欸

  只能說不知道為何影集不出 剪成電影

  剪輯相當破碎 場景轉換都很不連貫

  瑪莎、阿標、蠍子

  都演得不錯

  至於其他人就中規中矩

  崔浩然(海董)氣勢演得很足

  講國語有外省腔 講台語很輪轉卻沒啥腔調很厲害

  以前看民視八點檔他幾乎都講台語 很少看到他講國語

  而且在劇中他的輩分好像比各個角頭老大還大


  曉波、小蔡的感情戲幾乎可有可無

  曉波這集再出來的用意是什麼? 角頭3難道他還會再出來?

  如果是要解釋為何她後來跟著壞壞一起瘋好像也沒必要

  應該是沒什麼人在關注這個角色...




  東門幫一開始去射殺阿標的人馬是為何 好像也沒解釋?

  阿標為何最後要殺KO桑? 麥克知道他爸是阿標殺的嗎?


  然後阿超也太沒擔當 明明賣毒的錢你也有拿

  自己也說要一肩扛起 結果打小豪打成這樣

  這邊是在營造角頭2的人設嗎? 為了錢賣毒也可以


  文正也是 大橋頭的文正感覺就是軍師 很穩重

  這集麥克不在好像漸漸露出本性 是要補角頭1的人設嗎?



  最大的問題是之前浪流連明明仁哥小孩的滿月宴哈達有來一起吃飯

  這集卻是仁哥老婆小孩都還沒懷上哈達就死了

  說真的多拍一個浪流連滿月酒的畫面再讓哈達死應該不是多大難度..

  還有哈達在勸貴董開戰時還說現在北台灣就剩我們了

  那湳坑的霸董呢?

  本來去年看完大橋頭就覺得角頭1要重拍 不然劇情被綁死太多了

  結果鬥陣欸又出現這樣時間錯亂的劇情

  難道導演不承認浪流連嗎 還是浪流連是多重宇宙...



  聽說角頭3也是影集 就不知道時間線要訂在何時

  最後就是你續集都是在拍前傳 場面、陣容越來越浩大

  我就更覺得角頭1根本在扮家家酒

  角頭1裡頂庄跟大橋頭的火拼 陣仗真的差太多了

  結尾阿標、蠍子當起麥克左右手 也絕對是不符角頭1的劇情

  這個陣容也不像頂庄單獨能對抗...


  --'
