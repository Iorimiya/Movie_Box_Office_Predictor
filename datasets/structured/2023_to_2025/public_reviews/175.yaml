title: '[好雷] 角頭鬥陣欸'
content: '台南幫的崔浩然

  我從小就看他演三台的國語劇配角

  聽說後來改朝換代後跑去演台語劇

  所以很多人是從小都看他演台語劇

  老人才知道他以前都在演國語劇

  可能因為他在台語劇演過流氓

  所以才找他來演角頭宇宙


  這次設定他是南部的外省黑道老大

  但底下的小弟全都是本省人

  我想這人應該以前是在高雄當軍官

  然後喜翔 高捷以前都當過他的部下

  退伍後就開始拉退伍的兵搞幫派


  高雄一堆外省退伍老兵二代

  陸海空三軍都在高雄鳳山左營岡山

  所以有個海董是外省人也不奇怪

  以前屏東縣長伍澤元也是外省人

  底下的小弟鄭太吉是本省人

  還當到南霸天屏東縣議長

  最後因為販毒被槍斃

  縣長伍澤元也逃亡死在大陸

  所以鄭太吉蠻像黃鐙輝的


  裡面也說選舉快到了急著要用錢

  才會開始去台北搞都更籌錢

  看來毒品都沒都更賺的多

  不知何時會拍到詐騙這一塊


  我覺得裡面最壞的就是黃騰浩

  真想看看他最後會怎麼個死法

  但他第二集幹掉了皺兆龍都沒死

  第二壞的就是蠍子懷秋

  他們兩個就像壞壞一樣該死

  就算手被砍掉觀眾也會拍手叫好


  想到這裡感覺還是顏正國拍得好看

  我想角2票房賠錢是因為角1拍的爛

  第三部浪留連會賺錢是因為角2拍得好

  第四部大橋頭大賣更是前兩部拍得好

  但大橋頭跟這部拍成這樣就有點危險


  希望張老闆還是能冰釋前嫌

  再把顏正國請回來導明年的角3

  跟著顏正國的JV也能再回來配樂

  角2有很多好歌沒延續很可惜


  沒有那種音樂一下就知道是這部片

  像英雄本色 洛基 海角等都有主題曲

  但角頭都是一部片換一首歌

  好聽是好聽但有點參差不齊

  像角2入圍金馬的老大借過

  動感曲風就很像好小子的配樂

  打群架配樂一下就很有節奏感


  角2後面的配樂除了渡鳥之外都是慢歌

  蠻悲情的悲歌，希望能有經典的配樂

  期待顏正國回歸角3的劇組

  顏導拍的氛圍超越後三部的複雜劇情


  還有王陽明的造型讓我想起

  驚天12小時裡的秦豪還有

  好萊塢片＜黑雨＞的大反派

  松田優作（他兒子是松田龍平）












  是蠻有型的

  希望能跟喜翔一路演到美國去

  想看他們在美國怎麼打天下的

  喜翔在片中竟然還有私人飛機

  販毒可以賣到買飛機還真少見


  高捷一幫人南部的時候

  有拍台南安平四草大橋

  跟魚光島秋茂園所以知道在台南



  --

  可能以前古代只有黃賭毒

  毒品都已經算很新的產物

  再來搞都更，都沒拍房貸

  現在台北只剩阿仁一個老大

  其他全死光光了，拍未來也就拍今天

  應該會有詐騙 光電 選舉等新生意可做'
