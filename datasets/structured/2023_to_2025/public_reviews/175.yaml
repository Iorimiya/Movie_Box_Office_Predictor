url: https://www.ptt.cc/bbs/movie/M.1755934596.A.5B0.html
title: '[普雷] 角頭-鬥陣欸'
content: '本集就是愈來愈公式化

  同時也因為想開啟宇宙 不敢輕易賜死角色

  這集掛的哈達、跟KO桑

  老實說 對觀影TA （89+年輕上班族）有距離感

  像角頭二 壞壞、胖達、阿超、潘帥

  這種該發便當就發的 才造就經典

  不然大家都抓進去關交代一下

  角色需要時又隨時出來 沒意義

  現在販毒衝突、建案利益真的萬年老梗

  是真的不如拍監獄生活

  反正古惑仔致敬完了 監獄風雲也可以拍一下


  然後這集說什麼老人勾心鬥角 話中有話

  其實說穿了就是

  1.有錢什麼都可以 2.你動我兄弟 我報仇


  文戲從上一集開始就千篇一律

  武戲槍戰為主 但是最後一場大戰也失望

  被警察喊停的決戰叫高潮嗎？

  反而蠍子+阿標 2打1馬來西亞殺手那段

  算是打戲最緊張時刻

  不過 阿標跟蠍子 不是武力值都頂尖的嗎？

  2打1還用到槍才慘勝

  而且馬來西亞殺手還不是最強那一個


  總之，衝突打戲恩怨情仇

  永遠是為了什麼毒品還是開發利益

  有點膩了 如果這個宇宙還想繼續

  是該想點新梗了




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  --'
