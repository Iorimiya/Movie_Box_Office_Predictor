url: https://www.ptt.cc/bbs/movie/M.1755859483.A.4FD.html
title: '[新聞] 《角頭—鬥陣欸》逼退《鬼滅》！首日近19'
content: '新聞網址：





  記者蘇詠智／綜合報導


  《角頭》系列果然是國片目前最強IP，最新續篇《角頭—鬥陣欸》昨（21）日正式上映，

  全台票房逼近1900萬，創下近10年來國片首日最高紀錄，也將瘋狂熱賣的《劇場版「鬼滅

  之刃」無限城篇第一章猗窩座再襲》拉下冠軍寶座。片中飾演「北館仁哥」的王識賢，感

  謝粉絲熱情支持，也特別在映後活動獻唱主題曲，笑言一定能做到就盡量做到。


  《角頭—鬥陣欸》首日開紅盤　高捷喊話破3億


  去年《角頭—大橋頭》全台賣破2.4億，劇組安排一堆南下見粉絲的行程，今年《角頭—

  鬥陣欸》上片第一天就下中南部，王識賢表示：「我們這次是北中南拆開宣傳的策略，感

  謝各位大家支持，國片需要大家一起努力。」 高捷則是聽到首日1900萬，對於總票房更

  具信心，喊話一定要破3億，大夥兒在宣傳車上得知首日的佳績，更是開心到唱起歌來，

  接下來再跑活動也更加賣力。


  《角頭—鬥陣欸》也創下今年限制級電影首日票房最佳成績。有機會超越上部《角頭—大

  橋頭》上映3天賣破5500萬票房的紀錄。除了觀眾的熱情如舊，批評的聲音也一樣有，尤

  其是尺度放寬不少，出現多位裸女，有些觀眾進場後大感意外。高捷表示會接受任何的批

  評和指教，然後一定會更嚴謹的堅持片子往做出最好品質的方向去努力。


  王識賢曝《角頭—鬥陣欸》忍痛刪戲　劇組認真討論如何取捨


  王識賢則稱劇組很虛心求教，也會很認真的檢討，同時滿足各粉絲們的胃口，當然這次影

  片也刪掉很多心血結晶，監製宏哥都是含淚剪掉，也都有討論該如何去取捨。導演姜瑞智

  表示，最新一集電影不只規模勝過前幾集，讓打戲更上一個層級，情欲上的東西也加進來

  ，元素其實有所增加。




  --'
