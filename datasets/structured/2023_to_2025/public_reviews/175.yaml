title: '[好雷]從兩性觀看角頭-鬥陣欸'
content: '防雷
























  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  如題


  看完角頭－鬥陣欸幾點重點心得分享


  1.打戲依舊精彩，這次除了近身肉搏戰，還加了槍戰，


  甚至我覺得角頭的打戲、槍戰都不見得輸好萊塢或港片。


  2.加入阿標這個角色強化了南北角頭火拼的原因及交代了KO桑的死因，


  阿標可以當成是本集的MVP，長的有型，髮型又很帥，劇情上更是串聯的關鍵。


  3.露點畫面滿多的，還有多P、火車便當、背後式等性愛姿勢，


  讓觀眾感受到什麼是酒池肉林的世界，誠意滿滿^^。

  (有人知道表演火車便當的男女優叫啥名字，可以分享一下)


  4.完美了詮釋為什麼女生喜歡8+9不愛好好先生


  女生喜歡8+9:吃飯時，仁嫂找仁哥討論想要小孩，仁哥表示樂意和仁嫂生一個，


  但仁嫂進一步說教，仁哥直接不爽離席，仁嫂錯愕之間，仁哥又返回座位喝湯，


  並安撫仁嫂，短短幾分鐘內表演了什麼是男女框架及兩性張力，真的蠻寫實的。


  女生不愛好好先生:警察小蔡喜歡曉波，買柳丁送曉波+拿錢給曉波，


  下一個畫面馬上拍出曉波厭惡的嘴臉，強調一味的討好是吸引不到女人的，


  小蔡做了討好女生的行為都被厭惡了，應該不難想像顏值不如小蔡的男性做了討好行為，


  下場會有多慘吧= =?


  5.看很多台八演員的老戲精尬戲很爽，但可惜的是有些出場都只有幾秒，


  甚至背景都交代不清，就沒戲份了，不過導演有說這原本是影集，後來濃縮成一部電影，


  也就可以體諒了，但還是希望之後有機會出影集，把一些細節再交代清楚一點。


  總之，覺得角頭－鬥陣欸還是不錯的國片，推薦大家去看。












  --'
