url: https://www.ptt.cc/bbs/movie/M.1178123903.A.600.html
title: '[心得] 奪面解碼'
content: '中譯：奪面解碼   Vidocq


  主要演員：Gérard Depardieu Guillaume Canet Inés Sastre


  故事發生在18世紀的法國，名偵探Vidocq在追查"鏡面人"後突然失蹤，一名年輕記者追訪

  關於偵探失蹤的原因，但知道真相或接近真相的，竟然都離奇的死亡。


  現代偵探推理片，其實都走不出一個瓶頸，『愈不是兇手的、愈是兇手』，漫畫柯南、金

  田一都是如此，因此，最後的兇手可能是如膠似漆的情侶、情同手足的兄弟．．．等等，

  依照這個邏輯，要猜出偵探電影的真兇大概有八成的準確率，當大部分這類型電影走不出

  這個框框時，如何製造懸疑、兇手怎麼行兇、偵探如何解迷往往比真兇是誰來的重要。


  所以，當觀眾都抱著『愈不是兇手的、愈有可能是兇手』這個邏輯看推理片，想找導演的

  碴時，若還能讓觀眾有料想不到的結果，那麼電影就是一部上乘之作，例：奪魂鋸1 ，但

  這是非常困難的，也因此SAW1 （特別強調第一集）成了經典中的經典。這部法國2001年

  的賣座推理懸疑片，雖然知名度普普，IMDB分數也很普通，但因為導演、編劇在面對眾多

  觀眾的追兇挑戰上，仍然給了一個驚喜，在我心中，這部Vidocq也成了好片，當然經不經

  典見仁見智。


  這部電影是法國2001年的冠軍電影，全片採用數位錄製，所以畫面極為華麗，顏色用的十

  分飽滿炫目、特效一流。十八世紀的法國、懸疑的氣氛、迷離的場景，一個個死亡的目擊

  者，消失的偵探是否自己就是兇手？或者是他的愛人、他的助手？當抱著『愈不是兇手的

  、愈是兇手』這個推理法則尋兇時，是不是就能拆穿導演的技倆呢？我只能說，是、但也

  不是。


  --

  ◆ From: 125.225.183.9'
