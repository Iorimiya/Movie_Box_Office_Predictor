url: https://www.ptt.cc/bbs/movie/M.1425108574.A.6A4.html
title: '[請益] 模仿遊戲 關於解碼過程'
content: '電影很好看 但有一些疑問


  在電影裡

  瓊的同事每天都會截聽到的電報 其開頭都會有五個字母CILLY

  圖靈聽到這個消息後 想到可以利用重複字詞 天氣 或 結尾希勒特萬歲等等

  讓機器運算的過程簡化


  我大概查了德軍在二戰使用恩尼格瑪的規範

  德軍會每天更換日密鑰(Day Key)

  並在每封電文開頭重複三個用日密鑰加密過的字母

  例如ABCABC→GHIQUY

  當作個別電文密鑰(Message Key)


  所以瓊的同事截聽到的電文應該不是密文

  不然她就無法聽出開頭的字母都是固定的CILLY

  而是今天收到FHWRE 明天收到JIEKW 後天收到EKGQE 之類的(雖然轉譯成明文都是CILLY)


  代表瓊的同事應該是收到明文

  不過德國規定明文開頭要五個隨機字母的用意何在?


  當然 我知道電影這段破解過程是虛構的

  我只是好奇在電影脈絡當下這串CILLY是怎麼回事



  還有圖靈跟孟席斯在瓊的房間對話完後

  圖靈突然很慌張要叫瓊離開

  感覺是圖靈不信任孟席斯 怕瓊惹禍上身

  事後來看當然是多慮了

  但圖靈當下何以判定至此?

  是怕孟席斯讓瓊當替死鬼 刻意栽贓她是蘇聯間諜嗎?


  --


  不不 你沒弄清楚我問的問題

  我知道團隊是用氣象報告這固定格式推出每日密鑰


  但重點是電影裡那個瓊的同事 她就只是一般的抄收員 她不負責解碼

  那她怎麼聽出開頭都有CILLY? 難道她是收到沒加密過的明文?


  雖然沒有解答我的疑惑 但還是感謝你


  對 你說的沒錯 但重點 重點是！

  那女同事Helen到底怎麼知道開頭都有CILLY 因為CILLY也會被加密(很多人忽略這點)

  她怎麼知道她抄收的電文 開頭那五個被加密的字串是指CILLY 莫非她會心電感應？

  我問了很久 還沒有一個人解釋這奇怪的漏洞


  恩恩 你懂我文內的意思 但我又想想可能是這樣

  先了解這特性：明文加密一次會變密文 密文在加密一次又會變回明文

  電影裡德國每封電文密鑰(message key)是用五個字 而非現實中重複的三個數字

  而有個德國人『真的』很愛Cilly 所以他打算每天發出去的密文開頭密鑰也是Cilly

  他的做法是先設定好日密鑰(day key) 接著在機器鍵盤輸入Cilly

  螢幕就會顯示出Cilly轉換出來的密文 把這密文抄下來 當作是這封電文密鑰的『明文』

  假設是FCEQT好了 他就根據FCEQT把密鑰都設定好 然後就開始打內文了


  只能說這德國人不是懶惰(因為要多道手續) 而是真的很北七地深愛著Cilly'
