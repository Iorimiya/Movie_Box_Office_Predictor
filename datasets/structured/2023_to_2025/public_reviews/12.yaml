url: https://www.ptt.cc/bbs/movie/M.1436629828.A.D02.html
title: 'Re: [請益] 模仿遊戲 關於解碼過程'
content: '這2天看了2輪 這部實在是好看

  回家也認真研究了一下 enigma machine的運作方式

  爬文發現大家講解了詳細破解的過程及原理

  那現在 enigma 這台機器到底現在有在賣嗎?

  查了下ebay 是沒有, 那既然沒在賣, 人家說超任沒在賣了 但是有模擬器

  那會不會網站也有人把enigma 寫成模擬器了?

  結果答案是有的喔


  enigma 模擬器:



  每次輸入一個字母,最右邊的滾輪就會滾一下,

  所以如果你每次輸入同個字母a,出來的字都會不一樣.

  最右邊的滾輪滾完一圈後,中間那圈自動滾1格,

  中間那圈滾完一圈後,最左邊那圈滾1格

  所以密碼難猜就難猜在這邊,不是簡單的1對1關係


  以下也有影片說明破解過程


  大家可參考參考



  --'
