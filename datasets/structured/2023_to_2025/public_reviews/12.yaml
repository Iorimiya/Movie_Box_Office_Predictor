url: https://www.ptt.cc/bbs/movie/M.1425454048.A.FD5.html
title: '[請益] 模仿遊戲-解碼問題'
content: '不知道算不算雷  怕被雷你看到這行快點按←還來的及XD



  不知道我理解對不對


  德軍機器恩尼格瑪是  你按下一個字母  他機器經過運算後得到另一個字母

  然後根據每天設定不同  計算方式就不同  對嗎?


  然後人力破解是

  把所有組合都手動試一次  根據試出來文字的意義去判斷  是嘛?


  比方說ABCDE  對應到如果是HELLO  那就是有意義

  再對應到整篇文章  都有意義  則判斷破解成功

  所以他們才需要強大的拼字遊戲人才  這樣對嗎?


  然後我就搞不懂克里斯多夫是怎麼破解的

  看起來破解的東西是設定檔

  這用後來的字母回推我可以理解

  就像是我用什麼設定檔可以讓ABCDE轉成HELLO  這前提是HELLO已經知道


  問題是在一開始不知道的情況下

  機器轉轉轉出來  他怎麼知道什麼字是有意義的?

  照電影裡面看來  他轉不出來只是時間不夠

  可是就邏輯來說機器永遠轉不出來吧

  因為機器無法判斷什麼字組合起來有意義  不是嗎?


  希特勒萬歲


  --

  人生最喜是死前把錢花完  最怒是人死了錢還沒花完

  最哀是錢花完了人還沒死  最樂是人活著錢又花不完


  --

  我知道你說的  我意思是想問他當初設計的邏輯

  如果沒有已知單字做推算  你機器轉一輩子也轉不出來吧

  當初沒成功只是因為時間不夠阿  不然大家也不會在那等  對吧

  你懂我

  因為照電影原本的演法  他表現出只要時間夠  遲早就能找到答案

  可是就邏輯來說不可能

  你說的是第二階段的事情了...

  yes

  這我後來上維基有看到...不過電影裡面沒有呵呵'
