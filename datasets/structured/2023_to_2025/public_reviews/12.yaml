url: https://www.ptt.cc/bbs/movie/M.1537743002.A.6C9.html
title: '[新聞] 台灣老電影轉生有術 膠卷數位修復解碼'
content: '台灣老電影轉生有術 膠卷數位修復解碼


  發稿時間：2018/09/23 17:53最新更新：2018/09/23 18:36


  （中央社記者林長順新北23日電）提到台灣老電影你會想到什麼。「MED＃161時光保物－

  菲林轉生術」特展，以「電影膠卷修復」為題，展示珍罕膠卷電影文物，即日起至明年3

  月14日在新板藝廊展出。


  「MED＃161時光保物－菲林轉生術」是新北市文化局與國立台北教育大學北師美術館為推

  廣文物保存觀念的系列特展，並力邀國家電影中心，結合「台灣電影數位修復計畫」共同

  策劃展出。


  新北市文化局指出，「菲林」翻自英文Film，展覽分為「菲林生命檔案」、「菲林轉生台

  」、「菲林放映室」、「菲林大戲院」等4大區塊，從膠卷媒材演進、攝影機放映機操作

  ，到膠卷保存及數位修復等不同面向。


  現場展出國家電影中心典藏以及民間放映師傅的戲院放映機、各型攝影機，並選映國影中

  心數位修復完成的「大俠梅花鹿」、「回來安平港」等11部經典國片。


  文化局今天邀請膠卷放映師陳枝傳，介紹傳統的碳精棒放映機，一同感受膠卷電影的色溫

  和手感。


  陳枝傳表示，國三開始就在試片室幫忙，一直做到現在，已經近45年，以前常在工廠、學

  校、廟口等放映電影，在電影開始轉向數位發展之後，一些老技師都退休了，但自己仍持

  續在這個行業努力。


  他說，也因為這樣保存許多電影機、放映機與多部電影，藉由這個展覽，讓保存的珍貴電

  影文物能重現大家眼前，感到相當高興。（編輯：方沛清）1070923



  「MED#161時光保物－菲林轉生術」特展以「電影膠卷修復」為主題，展示多種膠卷電影

  文物，帶領民眾體驗膠卷電影的魅力，即日起至明年3月14日在新板藝廊展出。（新北市

  文化局提供）中央社記者林長順傳真　107年9月23日



  --'
