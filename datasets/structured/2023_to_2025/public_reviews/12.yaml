url: https://www.ptt.cc/bbs/movie/M.1442765390.A.C0E.html
title: '[問片] 一部童話風格的電影,原來的好人是兇手..'
content: '解答：奪密解碼











  這是一部西洋片


  片名我印象中是四個字


  片名和電影內容好像無直接相關(或無法直接聯想)


  我是12年前看在百視達租的VCD影片


  內容的背景有點像是古代歐洲或英國的風格


  裡面使用的科技，有點超現實但也不會不合理，


  有點童話故事的風格，但是沒有法術或妖精。


  故事內容是很多人一一死掉，


  影片一開始讓大家以為主角在緝凶，


  但其實主角本身就是兇手，劇情我幾乎忘光了，只記得很好看。


  線索好像太少了，希望大家可以提供片名，謝謝....





  --


  對！！！  是 奪命解碼！！  太強了！！  謝謝！！'
