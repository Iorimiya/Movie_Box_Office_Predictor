url: https://www.ptt.cc/bbs/movie/M.1745145922.A.F78.html
title: '[好雷] 罪人  我到底看了什麼？'
content: '老實說，我很欣賞，

  這部片「我他媽就是要拍尼哥爽片」的這種毫不掩飾。


  整部片想拍什麼就拍什麼，

  違和感跟邏輯一把火燒了。

  我懷疑剩下的吸血鬼沒有死，

  是因為最後的那根木樁插在導演的腦門上。


  劇情分成幾個完全像不同片的段落，

  然後用玉米威士忌淋一淋就想黏在一起。


  1.黑道雙子，帥。

  狠人辦事利索，穿插硬漢柔情，讚讚讚。

  一路招兵買馬，大刀闊斧，充滿了夢想。


  2.音樂，超屌。

  雖然我根本不懂什麼是藍調，也覺得很好聽。


  3.奇幻尼哥林正英

  加入吸血鬼來襲的元素就夠跳痛了，

  還是會載歌載舞有品味的吸血鬼。

  可惜在主角光環之下智商被降得很低，

  但我總覺得認真計較這部片的邏輯就輸了，

  算他過。


  4.尼哥無雙殺光老白男

  就是要爽殺。

  應該也沒有要dei什麼的，

  因為前面白人吸血鬼說他在講中文，

  我完全聽不出來。


  5.人情味

  最後經歷過這些狗屁狗血的事情，

  故作感動的回憶橋段後，

  還以為又要搞事了。

  沒有。

  存活的吸血鬼就是來靜靜聽歌的。

  喜歡音樂的孩子跟吸血鬼都不會變壞。



  結論：

  137分鐘都讓我很專注的看，

  而且對於縫合怪劇情內心沒有吐槽看得很順。

  在我進入電影會看到睡著的年紀後是很難得的體驗。

  角色的個性都非常鮮明且自然。


  如果你喜歡藤本樹，你會喜歡這部片吧。




  --


  傷口細節滿真實而且會聚焦，


  另外血漿流很多，子彈打洞以後會像水龍頭一樣流'
