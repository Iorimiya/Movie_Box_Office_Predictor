url: https://www.ptt.cc/bbs/movie/M.1746427229.A.2BB.html
title: '[負雷] 【罪人】 by對音樂無感的人'
content: '覺得電影好不好看是很主觀，沒有對錯

  希望不要因為我逆風發文就被噴得太慘





  看到ptt上的好雷居多，很怕會被爆雷，

  所以沒有理解太多就去看了，

  事先知道會有音樂的部分，

  但想說不是「樂來越愛你」、印度那種歌舞片，

  也不是「悲慘世界」、「貓」那種音樂劇，

  認為扣除掉音樂，至少劇情應該還可以，

  不然不會這麼多好雷。


  但我覺得劇情實在是不好看，

  回家有稍微看一下yt影片解說隱喻的部分。


  我本身對音樂是無感的，

  也不喜歡電影弄一些隱喻，你要嘛就明示大聲地說出來。


  你可以說我就是這麼膚淺、沒內涵。



  如果你本身對音樂也無感的，我的建議是：別去看








  雷文防雷資訊頁








  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  劇情大意就是一對雙胞胎黑人兄弟要開一間音樂酒吧，

  後面有吸血鬼來鬧事，最後吸血鬼被殲滅，還殲滅了一群白人。


  劇情大意就是這麼簡短


  電影的重點是前面籌備音樂酒吧跟後來的唱歌跳舞，

  吸血鬼是後面才出現。

  電影裡的吸血鬼也不是嗜血芭蕾那樣狂暴，

