url: https://www.ptt.cc/bbs/movie/M.1744913518.A.1D9.html
title: '[好雷] 罪人 歌很好聽'
content: '有雷


  看到爛番茄好評便跑去看了



  總歸來說歌很好聽但劇情的話見仁見智


  我是沒有看預告片就直接去看電影的人

  一開始看到黑人採棉花以為是反抗白人的故事

  結果看到中間才發現有吸血鬼這種東西

  中間抓吸血鬼的那群人沒有多著墨有點可惜

  整部電影就是一整天的故事進程

  出現的角色不多所以認識角色的速度其實蠻快的不會認不出來

  但兩位堂兄弟是只能用顏色去認

  所以在中間酒吧劇情的時候其實有時候還是會搞混

  我覺得劇情從麗莎被咬後開始有點荒腔走板

  感覺就整個失控了有點拉不回來

  感覺開始大混戰整個亂七八糟

  10個角色9個便當

  到最後堂哥拿槍掃了3K黨那裡我也覺得莫名其妙

  雖然劇情有說他們搞他堂哥就要搞他們

  不過加上前面的吸血鬼大混戰後就覺得好像沒什麼了

  但那一段動作是真的蠻爽的

  直到山米老了後在酒吧的劇情我覺得整段談話有把整個劇本給強迫拉了回來

  但整體下來觀感是不錯的沒有很糟糕就是有點莫名其妙但說不出來

  但歌真的很好聽這就是藍調的魅力

  這劇本可能是在變相的說自由的重要吧看下來的感覺

  畢竟成了吸血鬼雖然永生了

  但也失去了在白天的自由跟家人在一起的美好

  整部戲也沒有很驚悚 驚悚的部分可能是種族隔離政策真的存在過吧


  蠻推薦大家去看的~



  --



  感覺就是梗吧哈哈

  劇情見人見智我覺得不差但歌真的很好聽

  哈哈原來如此 我還認真的以為真的是堂兄弟'
