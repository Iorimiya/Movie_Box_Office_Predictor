url: https://www.ptt.cc/bbs/movie/M.1540008062.A.5DF.html
title: '[普雷]檢方的罪人 什麼是真正的正義? '
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  1.影片名稱 :檢方的罪人


  2.觀影時間 : / 拒答


  3.觀影地點 :高雄威秀


  4.觀影方式 : 自行購票





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  此區為發文防雷頁

  可選擇性提供上列 1~4 資訊  或不提供亦可

  觀影心得於分隔線下方發布即可


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  意象中木村已經很久沒有演電影了，私心一直蠻喜歡這種利益衝突無法迴避


  的檢察官角色，據說是小說改編電影的一部作品日後應該會去閱讀原作，當看到


  他下定決心要殺掉對方時，我心裡其實是非常的忐忑不安，但對於法律無法制裁


  的罪人，以暴制暴到底算不算一個好方法就要多做討論，也會看到二宮和也努力的


  想要透過程序正義去抓住真正的罪犯，但到最後也看見自己的上司走火入魔想要拉


  他一把，其實整部電影很像是現實社會的縮小面，誰沒有曾經覺得自己努力去做就


  能得到一切，當被社會化後還能維持自己的本質的人又真正有多少個，當利益衝突


  跟自己心愛的人有關時，到底該去做哪種取捨？是否該抹黑自己的手去制裁？電影


  其實保留了蠻多空白的想像空間，也沒有做到這壞人就真的該死，反而很顯現了人


  性的兩面，只可惜最後的收尾有點草草結束，但就整個劇情來說前半段稍嫌拖戲，


  但中段的確有抓住觀眾的情緒，喜歡人性面的朋友們可以去看這部作品，不過戲中並


  沒有太多推理的成分在，這跟結尾一樣算是稍嫌可惜了！














  --


  一生中會認識多少人，又有誰是能永遠記著。

  請記住我曾經在你生命中最炫麗的那段。

  因為相處的時間無論如何都不夠多。

  因為我能認識妳一陣子，但不可能一輩子。

  所以我會在還能看見妳的時候，盡力去讓你記得。


  --'
