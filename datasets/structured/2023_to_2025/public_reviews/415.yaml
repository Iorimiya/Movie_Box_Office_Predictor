title: '[普雷] 有關《檢方的罪人》的政治梗'
content: '~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  1.影片名稱 : 檢方的罪人


  2.觀影時間 : 拒答


  3.觀影地點 : 香港


  4.觀影方式 : 自行購票



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  有關這部電影的政治涉指

  日本那邊也有討論

  個人整理了一些...


  1.戲中男主角最上毅（木村拓哉）好友丹野和樹（平岳大）的岳父高島進（矢島健一）

  ，本身是個有能力成為下屆首相的政治人物，已經有影射日本現任首相安倍晉三之嫌；

  高島女兒（東風萬智子）被指跟新納粹組織及「世界極右會議」的團體極為接近，就是

  影射。


  2. 丹野墜樓前向太太控訴，指自己身處的是太太與其極右好友共同經營的酒店，就被

  指影射早前因。


  3. 甚至在最上與上司討論主要案件的同時，旁邊穿插著年輕女檢察官為一宗強姦案申

  訴，當中對白「被姦十日後才報警不奇怪嗎」「因為他為高島集團打工，警方才不理

  會吧」，亦可能是影射早前。


  其餘非政治觀點:



  個人覺得導演想談太多, 導致故事主線不夠清晰

  小說則有點太過詳盡而累贅, 比較適合拍成短篇電視劇

  但電影的運鏡、配樂很有意思, 值得一看


  --'
