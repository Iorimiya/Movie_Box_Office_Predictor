url: https://www.ptt.cc/bbs/movie/M.1745673007.A.A4C.html
title: '[雷] ［宇宙爆炸好雷］罪人觀後感'
content: '今年首PO就獻給罪人了。

  先說結論，真的直接問鼎今年年度電影了，還好有看到版友們強力推薦，才讓原本對近期電

  影沒什麼進場慾望的我，進場看到這部神作。

  一句話就是集帥氣、幫派、音樂、種族議題、宗教、自由、吸血鬼、救贖於一身的好看電影

  。


  *劇情：整部架構完整前呼後應，雖然2個小時以上，但不拖泥帶水，體感時間很短，對於想

  要傳達的東西，也用很好說故事的方式呈現。

  *配樂及音樂：驚艷！好像自從瘋狂麥斯後就沒有讓人有這麼興奮的電影配樂，原本以為會

  是像音樂劇那樣的演出，但就是跟劇情融合的很自然，有藍調、鄉村、搖滾、現代流行等類

  型，讓我後悔怎麼沒看新光杜比影城！


  好了 詞窮了 反正很好看啦 快去看 這麼好看場次怎麼這麼少！


  --'
