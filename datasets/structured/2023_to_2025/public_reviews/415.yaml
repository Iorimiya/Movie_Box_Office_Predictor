url: https://www.ptt.cc/bbs/movie/M.1539608094.A.72A.html
title: '[新聞] 木村拓哉主演「檢方的罪人」 法界首映場佳評如潮'
content: "新聞網址：\n\n2018-10-15 10:51 聯合報 記者賴佩璇╱即時報導\n\n日本年度懸疑電影《檢方的罪人》改編自雫井脩介的同名懸疑小說，由傑尼斯兩大明星木\n\
  村拓哉、二宮和也主演，在台將於本月19日上映。車庫娛樂日前特別與台北律師公會在樂\n聲影城舉行首映場，許多司法領域相關人士皆到場觀影，映後紛紛表示這是一部切身實務\n\
  的電影。　\n\n《檢方的罪人》透過某起事件，以每個人各自懷抱的「正義」之定義為主軸，強調了善與\n惡、罪與罰、過去與現在等，充滿兩面性的議題。台北律師公會會員觀賞後，紛紛表示「\n\
  電影內容和法律議題相切合，深刻描繪法律和人性的對立面，發人深省，也令人震撼」、\n「令人省思與堅守法律人公正客觀之判斷義務」、「電影非常好看，從演員演技至敘事手\n\
  法都予以好評，題材或可讓社會大眾深思」、「為了實踐心中正義的，願意付出多大代價\n？法律的界線在哪？道德的界線又再哪？」\n\n北律理事長薛欽峰說，這部片子牽涉到很多司法問題，我相信很多法律人對這樣的議題非\n\
  常感興趣，我們也期待台灣之後也會出現如此有深度的影片，能讓法律界進行多重探討。\n\n楊晴翔律師指出，這是一部法律實務工作者都應該來看一看的切身劇作，這部片所描繪的\n\
  《檢方的罪人》，大家能否接受？正義在某一個條件之下，有沒有妥協變形的可能？你我\n有朝一日若成為局中人，又敢逕下斷言，正義一定是那般理所當然？」葉慶元律師則說：\n\
  「如果太執著於自己預設的正義而忽略了真相，那麼祇不過是淪為另一種不正義的罪犯而\n已。\n\n六合法律事務所表示，當嫌犯以法律程序為保護傘，語出狂傲、輕賤人命，這名嫌犯是否\n\
  無辜？令人深惡痛絕的嫌犯，竟因故得以脫免罪刑，檢察官該就此罷手？還是應不擇手段\n為被害者復仇，讓加害者付出代價，實現自己良心確信的正義？\n--\n\n  \
  \  \n\n\n\n--"
