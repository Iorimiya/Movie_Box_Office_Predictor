  先不要管世界在瘋什麼IP，這竟然是一部吸血鬼電影，而且好像三部曲的小句號；《 （

  我一直找不到的那部電影，利用安瓶穿梭真實與卡通之間） 》《牧羊人的奇幻旅程：保

  羅‧科爾賀》《罪人》。


  Just insane.


  原諒我平時沒好好嗑書，所以沒辦法像《牛津解密》那樣穿針引線，然而當故事一直演繹

  下去，看到越來越多線索，可能一開始它關於聲音，它關於宗教，它關於七情六慾，它關

  於歸屬，它關於這個地球上的每一個物種、主人、生活的方式，沒想到它竟然關於印地安

  人。這讓我懷疑起每一部講述印地安人的電影，想要生吞活剝其中的細膩，比如《花月殺

  手》比如《極地追擊》，卻又發現，那一副金戒指“史塔克”，滿有趣的。


  如果要像《闇》那樣，好像又無法享受到電影的樂趣，雖然隨著電影持續播映，好多所謂

  的“知識”隨風起舞，但《罪人》的安排，依然可以沉浸其中，很多一開始覺得爛大牙的

  安排，後面突然來個迴力鏢，完美了這部電影。


  不過AI大戰吸血鬼，誰會贏？還要贏？惡魔原來是___________

  ___推個手遊《守望傳說Gauardian Tales》________Who knows.


  But when they are  wave to you, what will you do ?


  If we should change the way we saw time, then change.

  Unfortunately, they''re just  wants winner also.


  What about that even no win one ....

  What about the speices that even no win one....


  They comes and they goes...



  what the hill you are?


  《冰火》又要回來了嗎___


  理化人能否告訴我，哪裡不愛？大波波～


  --


  剛好又滑到《死亡詩社》的簡介，這四個噓是不是要‘’受洗‘’一下_？


  本人接受噓，但是可以是有內涵的噓嗎？以上四位看過內文了嗎？哪幾點提出來噓，虛心

  接受；莫名其妙噓，電影版怎麼了......！？


  喔是喔，怕被我超越，害怕囉？呵



  哇～期待你的產出，趕快去開課教人寫



  哦哦哦哦！我去看看，感謝您


  如果你是老年的他，你會怎麼回答～



  就像看不到你產出的文章一樣



  只會這三個字？



  哈哈，好可愛，網路霸凌簡簡單單，電影版真的可惜了。不好說甚麼，大家都要流量，這

  種負流量也挺酷的，就像暗物質一樣。'
