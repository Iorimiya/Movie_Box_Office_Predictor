url: https://www.ptt.cc/bbs/movie/M.1165505225.A.AF7.html
title: '[評論] 千古罪人是李安'
content: "千古罪人是李安\n\n 馬伯庸\n\n毫無疑問﹐李安是中國電影的千古罪人。這個台灣人自從靠著一部非常規的武俠片《臥虎\n藏龍》在好萊塢大受追捧以後﹐就成了許多中國大陸藝術片大導演們的心頭夢魘。那尊奧\n\
  斯卡小金人無時無刻不在撩撥著這些大導演的虛榮和嫉妒﹐讓他們輾轉反側撕心裂肺﹐恨\n不得一身血液都化成醋酸劈頭蓋臉地潑到李安身上。\n\n\n\n和尚能摸﹐我不能摸﹖\n\
  \n\n\n李安能得﹐我不能得﹖\n\n\n\n向來眼高於頂的大導演們絕不會承認這種心理﹐但他們這幾年的業績確鑿無誤地表明﹕每\n個人心中都有一個李安﹐並且瘋魔般地驅使他們幹出許多燒人民幣的傻事。嫉妒讓人發狂\n\
  ﹐而發狂的人會讓自己的智商無限降低﹐他們朝著奧斯卡使勁兒的瘋狂舉動唯一的用處﹐\n隻是讓他們看著小金人的照片讓全國觀眾來幫他們捋管兒﹐以求得片刻心理和生理上的愉\n\
  悅。\n\n\n\n第一個是張藝謀。這位大概是中國最好的導演揣著對奧斯卡小金人的憧憬﹐放棄自己擅長\n的領域﹐毅然開始鼓搗武俠。考慮到《英雄》的開拍時間和《臥虎藏龍》的得獎時間﹐讓\n\
  人沒法不懷疑兩者之間存在著某種因果關系。《英雄》是一部有一流演員、一流武指、一\n流美工、一流攝像、二流導演和三流編劇的電影﹐所以毀譽參半﹐但再樂觀的人──張偉\n\
  平除外──也不會認為這麼一部裝B不成反類B的片子能拿奧斯卡。拿這片子去申奧﹐暴露\n出來了張藝謀那點惦記著小金人的心理。結果沒出任何人的意外﹐《英雄》連提名都沒混\n\
  上。於是張導洗心革面﹐又拍了一部《十面埋伏》﹐這一次是一流的美工和攝像、二流的\n演員、三流導演和四流編劇﹐結果這一部片子表現出來的弱智與拙劣達到了一個無法企及\n\
  的高度﹐讓所有金酸梅獎的獲獎電影都黯然失色。\n\n\n\n第一個得心臟病的是西施﹐第二個得心臟病的是東施﹐第三個就是芙蓉姐姐了。這個淺顯\n的道理張藝謀花了數億人民幣才懂。\n\
  \n\n\n不過張藝謀畢竟是名導演﹐拿的起放的下﹐一見沖奧不成﹐就退回去拍了一部老老實實的\n《千裡走單騎》﹐總算挽回了點晚節。很快大家就把這事兒淡忘了﹐因為又出現了另外一\n\
  個活寶。\n\n\n\n陳凱歌和《無極》。\n\n\n\n《無極》比《十面埋伏》高那麼一個檔次﹐但那種對著奧斯卡評委滿臉諂笑的作派更令人\n作嘔。張藝謀尚且含蓄了些﹐陳凱歌則拍馬屁拍出了痕跡。我一看到電影裡那班人滿口子\n\
  亂叫“王、王、王”的﹐就想抄起棍子去抽丫的。隻是礙著人家有層“奇幻”的皮﹐沒法\n罵他“你會說中國話麼﹖”﹐隻好憋著一肚子氣把真田廣之搞張柏芝的一段倒來倒去地看\n\
  ﹐好在這種場面是全世界都能看懂。\n\n\n\n適逢放映那會兒是中國電影一百周年﹐於是電影評論協會等單位召集那些屍位素餐的老冬\n瓜評委們主辦了一個“中國電影百年百部名片”排名。陳導隨手玩了玩政治﹐老藝術家們\n\
  就樂呵呵地拱手獻出自己的節操。影迷們從《勞工的愛情》開始往下數﹐發現許多經典片\n子都沒入選﹐心頭不由得大怒﹐再往下拉發現最後入列的一個是《無極》﹐這才放下心來\n\
  ﹐用關羽的一句話來說﹕“黃忠何等人﹐敢與吾同列﹖大丈夫終不與老卒為伍﹖”\n\n\n可惜陳導政治玩的好﹐心態卻沒張導那麼鎮定﹐經不得別人說。從放映前采訪時怒罵提錯\n\
  問題的記者到放映後追著趕著要收拾饅頭的表現可以看出﹐這個人心態已經完全失衡﹐容\n不得半隻蒼蠅──問題是《無極》就是一泡屎﹐不落蒼蠅落什麼。\n\n\n\n結果《無極》被外國人一通訕笑踢回了國內﹔國內觀眾都忙著下饅頭看﹔胡戈平白紅了一\n\
  把﹔隻有陳導和他老婆倆人一邊哭著一邊回香格裡拉清掃沒處理幹凈的垃圾。其實也挺慘\n的。\n\n\n\n而李安呢﹖人家早輕輕跳出武俠圈﹐拍了一部GAY片﹐輕輕鬆鬆又拿了一回奧斯卡﹐而且\n\
  是正統獎項﹐比最佳外語片獎還高格。\n\n\n\n這一下反倒給國內的導演們澆了一盆冷水。人家拍武俠吧﹐咱就算跟風也不怕﹔可現在人\n家拍GAY片了﹐咱能怎麼辦﹖那幫廣電的老爺們連《諜中諜3》裡的辦証兒都要強行刪掉﹐\n\
  更別說兩男人摟抱親嘴了﹐這不符合和諧社會的氣氛。你沒見《藍宇》拍完都五年了﹐這\n才允許閹割版DVD偷偷摸摸上市。\n\n\n\n結果還是有人義無返顧地跳了下去﹐這回是碩果僅存的馮小剛。\n\
  \n\n\n原來以為被奧斯卡和李安折騰的搔癢難忍的隻有張、陳﹐想不到啊想不到﹐朱時茂你這濃\n眉大眼的也叛變革命了。\n\n\n\n武俠斷然是拍不得了﹐奧斯卡評委們給《斷背山》發獎肯定不是因為他們自己是GAY﹐而\n\
  是因為那片子有內涵。那就簡單了﹐咱也內涵一把不就得了﹖\n\n\n\n如果說張、陳二人還隻是拿熱臉去貼奧斯卡評委的冷屁股﹐尚且還藏著掖著的﹐馮小剛則\n幾乎直接去舔了。\n\
  \n\n\n《夜宴》裡面充斥著無數露骨──不算拙劣﹐但是非常露骨──的西式模仿﹐無論台詞、\n表演還是情節﹐都無比鮮明地暴露出這是討好外國人──尤其是奧斯卡評委──的品好而\n\
  特意拍攝的﹐沒人相信這是一部給中國老百姓看的電影。\n\n\n\n為免重蹈張、陳的覆轍﹐馮導這次特意請莎士比亞來當編劇﹐心想總錯不了吧﹖用馮導自\n己的話說﹐是“與莎士比亞做一次愛”。\n\
  \n\n\n結果馮導搞的隻是一個貌似莎翁的充氣娃娃。\n\n\n\n觀眾在《無極》裡憋的這口惡氣總算可以從這發泄出來了﹕“丫的中國人哪有這麼說話的\n﹗”\n\n\
  \n\n拿名著來改不是新鮮事﹐東西方文化差異也並非無可逾越的鴻溝。從西至東的﹐黑澤明的\n《蜘蛛巢城》改自《麥克白》﹐可人家拍出的是日本原汁原味﹔從東至西的﹐瑟吉歐.萊\n\
  昂內的《荒野大鏢客》改自黑澤明的《大鏢客》﹐一樣原汁原味﹐毫無痕跡。可見隻要有\n心﹐渾然天成並不是不可能。\n\n\n\n反觀《夜宴》﹐不過是一部套著似是而非的中國服裝的外國舞台劇罷了﹐假模假式﹐一個\n\
  個端著身段兒朗誦台詞。中學時代我們學英語作文﹐老師總說這是中式英文﹔現在剛好相\n反﹐《夜宴》台詞寫的完全是英式中文。再配合著《夜宴》為了申奧而提前點映﹐拿去威\n\
  尼斯和多倫多滿世界亂跑的作為看﹐說沒成心討好外國人恐怕沒人信。自從我聽了馮導那\n一番義憤填膺的“一句英文台詞沒有﹐算什麼西化”的高論發表以後﹐更覺得他心虛。\n\
  \n\n\n結果﹐面對舖天蓋地的批評﹐馮導差點就學了陳導站去了人民的對立面﹐幸虧及時醒悟﹐\n說了幾句軟話﹐這才算揭過。\n\n\n\n但中國三個最拿的出手的導演﹐已經全部陷入了李安怪圈﹐為了小金人而神魂顛倒﹐並且\n\
  全軍覆沒。\n\n\n\n人說女人有錢就學壞﹐這些大導演咋也一有大投資就學壞呢﹖\n\n\n\n看看人家賈樟柯﹐看看人家寧浩。\n\n\n\n看看人家李安……唔……這位還是先別看了。\n\
  \n\n--\n◆ From: 140.121.221.221"
