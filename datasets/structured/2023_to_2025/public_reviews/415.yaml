url: https://www.ptt.cc/bbs/movie/M.1747557503.A.11D.html
title: '[好雷] 罪人（文長）'
content: '昨天去看了這部電影，之前就聽說評價非常好但台灣票房不太理想，結果看了之後覺得非

  常好看，真的很難得好萊塢能拍出這麼有深度的爽片了！以下心得比較多是我自己腦補以

  及想留下個紀錄，順便跟大家分享～文長提醒







  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  -開場白

  電影的開頭直接點題，有音樂才華的人能撫慰社群，但也會招來邪惡。其實看到這個開場

  白時我有點驚訝，因為在許多創作中都有一條原則：「Show, don’t tell。」也就是說

  ，與其把你想講的故事核心直接「講」出來，更應該讓觀眾自己在故事的安排中有所體悟

  。這個開場白對我來說很明顯就是一個「tell」（說）的動作，所以一開始覺得「哇，這

  麼直接嗎？」但看完電影後，我覺得搭配上前半段的平靜，這個開場很必要。沒有這個開

  場，可能在吸血鬼出現以前，大家會覺得電影調性變得太快（雖然應該還是很多觀眾覺得

  變太快XD），但有了開場白的暗示，觀眾大概就有個底這部電影想討論音樂與邪靈之間的

  關係。


  -多元文化 (簡稱DEI)

  近年來DEI這個字常常上新聞，由於我在美國有住過，而且所處的社群都是比較偏向支持

  DEI的，因此每次看到相關反DEI的論述，不禁都會有點遺憾。不過即使這麼說，我不是完

  全不能理解反對DEI的一些論述。確實這幾年很多的作品在DEI的表現都很粗糙，彷彿只要

  我這邊放了一個有色人種角色工作就完成了，而非好好去敘述這個角色所承載的歷史與故

  事。


  因此，我很開心看到這部電影非常非常用心地去加入各種多元的角色，但都非常完整地重

  現歷史以及讓他們的角色對於劇情有所貢獻，不是只是插花而已。首先，我們看到黑人文

  化不是鐵板一塊，主角雙胞胎也不是多討喜的角色，電影有滿明顯的點出他們的錢是黑錢

  ，但這不妨礙觀眾支持他們。有信基督教的、信薩滿（？）教的，甚至Mary的角色至關重

  要。在美國歷史上曾經有一個「一滴血原則」，也就是只要你的血液中有一滴黑人的血，

  你就永遠是黑人。這也顯示了Mary這個角色的複雜性以及時代背景。劇情上安排Mary認為

  自己的膚色能得到白人的信任，進而滲透組織。


  我也很喜歡三角洲瘦子(Delta Slim)，雖然我沒看出他特別代表什麼，但是一個非常立體

  的角色。可能喜歡的原因之一是他是由The Good Fight裡面的Adrian飾演的，雖然那部美

  劇後面爛掉了但前面超好看，而且超愛演員的表現！因此在大螢幕上看到他覺得非常開心

  。


  另外，雖然戲份超少，但我非常喜歡喬克托族的橋段。這邊大部分是留給觀眾腦補，但喬

  克托族首領的氣場之強大，讓觀眾會相信印地安人一定有些神秘麼方法可以抵抗吸血鬼。

  而主吸血鬼也很聰明，剛好找到一個白人家庭，利用了他們對於印地安人的歧視（剛好是

  3K黨成員），進而吞噬了兩人。看到這邊我內心不禁想，是不是在反諷這兩個白人因為自

  己的種族歧視（不信任印地安人）而遭殺害。看到後面我一直期待喬克托族有什麼神秘的

  魔法可以把人變回正常人，可惜他們後面就沒戲份了....


  看到華人家庭的角色我有驚訝到！尤其看完電影後查了影評才知道劇組有做了許多功課，

  不僅完全符合史實不是硬加，我自己認為也傳遞了一個最近美國社會的一個口號「團結」

  （solidarity）。歷史上，亞裔社群與非裔社群要不是不交流，就是相處不睦。但這幾年

  來不少年輕的美國人想要強調亞裔跟非裔（以及其他少數族裔）應該是盟友，要互相了解

  。雖然在實際操作上，不少這樣的論述有很多漏洞，像是不了解亞洲的亞裔非裔經常把亞

  洲幻想為沒有種族歧視的烏托邦，不過我個人是覺得「團結」的本質是好事。電影這邊的

  安排，在我看來有點「偷渡」這樣的想法，但表現得很自然且合理，對我來說是個亮點。


  當然，我看到華人媽媽Grace崩潰時，也覺得「啊，又要亞洲人背鍋了嗎。」但仔細一想

  ，Grace並不是一個單純的雷包，她是擔心自己的女兒會被已經變成吸血鬼的丈夫所騙（

  非常合情合理），而且她也向Smoke喊道「你不是軍人嗎，怎麼不反擊！難道要被動等到

  天亮？」其實這句話很不像是典型華人會說的話，因為大部分華人的心裡都是得過且過，

  被欺負的人不要反擊要安靜過日子，保命要緊（台灣社會就一堆）。因此我後來想了一下

  ，把Grace設計成因為母愛而激發反抗，是個滿有趣的小反轉。唯一可惜的是這邊有點拍

  得太快，如果把Grace的心境再多點鋪陳可能會更好。


  片中的那段「中文」，看到有人說是台山話或者是粵語。這也是非常符合史實的，因為當

  時移民都是兩廣居多，而我們現在說的普通話/國語，則是到很後期才完整建立。至於為

  什麼Grace會說這是「Chinese」也滿正常的，因為在當時英文的語境中，Chinese就是這

  種所謂的「方言」。現在去美國的中國城去跟裡面的老人講話，應該八成聽不懂我們說的

  國語。


  最後，我其實是看完電影後看影評才發現主吸血鬼是愛爾蘭人的，雖然電影中已經滿多提

  示了，但觀影時沒有反應過來XD。回想起來這個安排真的是太厲害了，因為如同許多評論

  已經講過了，愛爾蘭人也是底層的人。雖然他們外表是白人，但在美國曾經受到很嚴重的

  歧視。這也是為什麼甘迺迪作為愛爾蘭裔能選上總統是破紀錄的。而在更長遠的歷史上，

  愛爾蘭人被英國殖民、剝削，所以才有吸血鬼背誦聖經並提到「我的殖民者當初也是這麼

  說的」那一幕。愛爾蘭人的辛酸血淚史，電影沒有時間多說，但了解了這一點前情提要，

  真的可以感受到編劇的用心。同時這也昇華了反派的多元性，以及讓觀眾知道所謂的「白

  人」不是鐵板一塊，而吸血鬼當然是反派，但更是一個悲情的反派。


  -劇情的巧妙安排

  除了角色都設計得很不錯之外，我覺得許多劇情橋段也很神。例如把酒鬼變成真鬼的那一

  幕雖然搞笑，但實則有推進劇情的作用，正因為主角群們發現推出去的人是真人要打開門

  救他，吸血鬼才有辦法用言語與屋內的主角群們「對話」。而這個對話也是非常有意思的

  ：主吸血鬼散播的言論在我聽起來是一種失敗主義的想法：「你們沒救了，根本不可能自

  由，不如加入我們吧！」 在看那一段時我心跳超快，超害怕主角群會被「說服」，進而

  全部滅團。但好在Smoke心意堅定沒有被誘惑，雖然最終吸血鬼的言語還是騙到了Grace

  QQ~ 而吸血鬼的這段對話，也促成了最後一段劇情（Smoke大戰3K黨）。這種環環相扣的

  寫法，真的很令人拍案叫絕！


  吸血鬼的邀請與宣言，我自認為是一個沒有救贖的未來，而且也是以暴力強迫，得到的結

  果卻只是麻痹自己不去面對問題而已，因此吸血鬼最終也只能多在黑暗中，無法真正地自

  由。相比於3K黨這種真正的「惡」，吸血鬼卻更有誘惑力。不過也如同有網友指出的，最

  終變成吸血鬼的Stack跟Mary能夠常相廝守，也是多虧於永生。這邊就是丟給觀眾思考的

  另一個問題了。


  最後那場3K黨大戰我覺得也是很有必要而且看得很爽，在大太陽下跟另一群有肉身的鬼怪

  大戰，讓我想起了一句話：「人比吸血鬼（可以代換成任何怪物）可怕。」


  -結尾

  這部電影另一個重點是音樂與文化挪用，但這部分我反而想說的不多。不過我覺得這部電

  影最神的是最後老山米與Stack的那個對話（憑記憶打，有錯誤請見諒）：

  「經過了多年，我想到那個夜晚還是充滿恐懼。但轉眼一想，那一天在太陽下山以前，是

  我人生中最美好的一天。」


  Stack則回答：「是啊，那也是我人生中最美好的一天。是我最後一天見到太陽與Smoke，

  我最後感到自由的一天。」


  我對於山米這個角色其實想法不太多，甚至覺得他在開場跟父親那邊要不要放下吉他的那

  一幕讓我懷疑有沒有必要，但對我來說，在電影結束前的這一刻，他的角色完全立體了：

  山米必須活下來，因為他必須見證這一切，無論是黑人的人權終於得到伸張（即使還是許

  多要繼續努力的地方），以及藍調的發揚光大。即使他的音樂曾經吸引邪惡（即使這不是

  他的錯），但他仍然不放棄他熱愛的音樂，追尋了屬於他的自由。





  --'
