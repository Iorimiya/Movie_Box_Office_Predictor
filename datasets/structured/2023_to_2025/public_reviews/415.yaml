url: https://www.ptt.cc/bbs/movie/M.1745510226.A.ADC.html
title: '[  雷] 罪人  觀後感'
content: '#呼朋癮伴 #朋の影癮


  “BLUES”罪人 SINNERS，2025

  距今差不多十年前，有這麼一個吉他手出了一張專輯，喚做生來就彈吉他，另個藍調的大宗

  師，喔不已經不只是宗師而已，堪稱祖師爺等級的人物對他說：「藍調正在死去，請別讓他

  死去。」那兩個人一個叫做Buddy Guy，另一個則是Muddy Waters。


  藍調與生死，恰好是這電影的兩大主軸。透過天賦異稟的少年手中的吉他與遭遇的人事，帶

  出黑人族群過去數百年來的受壓迫；再穿插酒精、暴力與天外飛來一筆的奇特反派，作為畫

  龍點睛之筆。


  把吸血鬼這象徵與黑人歷史做結合早已不新鮮了，我們甚至還能看見林肯總統化身獵人大殺

  四方，但此處的怪物不只是扁平的噩夢而已，他們同樣自遠方而來、唱著家鄉的民謠、有著

  被殖民的血淚，那些悲憤化為無法超生的怒與怨。甚至在河畔唾棄該隱，那來自聖經被抹去

  的篇章，道聽塗說或鄉野異聞，賦予了這些嗜血者力量。


  力量從何而來？不只因為傷害。還暗示了那些有所追求的人，成為了一開始迷惘的人，追求

  歸屬、追求金錢、追求殺戮，都成了一開始惡魔的獵物。獵物追溯血跡、他們追尋樂聲，於

  是又一個熟悉音樂電影的人必會知道的典故召喚出最棒的場景：太傑出的旋律不只讓過去與

  未來共存，也帶來了邪惡的存在。


  十二小節劃破時間，古今中外都在此間。那是最精彩的一場戲，性與暴力，外頭有獸尋來。

  而這樣的危機，其實仰賴巫的力量，告訴眾人應對何物，同時也如同她的先祖一般，為自己

  占上一卜。起承轉合有了邏輯，剩下就是還能再過癮些的打打殺殺，但那些該爽的地方，導

  演放在了最後。


  男孩回到了教堂，選擇抓緊著吉他上路；男人倚靠著酒吧，選擇死握住槍柄上膛。兩種截然

  不同的結果，都是為了了結剛度過的那個夜晚。藍調往外傳播、仇恨由血終結。這個族群的

  所有傷痛與記憶，用不同方式與角度攤開在我們面前。


  最後的最後，男孩已變成男人，走進來的不速之客是他夢靨裡的身影。但沒發生不好的事，

  不過彈了幾段歌詞，最後他與她離去，沒有讓他死去。


  就像Muddy Waters曾經對Buddy Guy說的，這部電影沒讓藍調死去，甚至一旁伴奏的是新生代

  最傑出的吉他手之一：Christone “Kingfish” Ingram。這正是那曲風的精神：活著會遭遇

  到很多，但繼續活著就有希望，就可以把故事再傳下去。


  最後用這樣一段話作結：我懇求所有對藍調音樂、黑人族群與美國歷史有興趣的朋友，請馬

  上打開手機搜尋離你最近的電影院哪裡有放這部，這很可能是我今年最最喜歡的電影。

  ----

  Sent from  on my iPhone17,3


  --'
