title: '[贈票]【罪人】 IMAX 特映搶先看'
content: "★  以當今解析度最高的 IMAX 膠卷攝影機拍攝\n\n★  《黑豹》導演萊恩庫格勒、麥可·B·喬丹再度聯手\n\n★  當夜晚來臨，隱藏在黑暗深處的邪惡勢力悄然現身\n\
  \n★  電影預告：\n\n\n一定要在 IMAX 看。根本無法想像用其他方式觀賞這部片 - @bjntweets\n\n\n麥可·B·喬丹分飾「史莫克」和「史塔克」雙胞胎\n\
  他們帶著滿腦子的遠大夢想回到家鄉\n\n\n劇情描述這對從大都市返鄉工作的雙胞胎，熱情邀請老家親友參加一場徹夜狂歡的音樂派\n對，沒想到隨著夜幕降臨，詭異現象接連發生，眾人被困在窄小的倉庫裡，只能抓緊武器\n\
  ，用絕對武力對抗未知的邪惡勢力。\n\n\n導演萊恩庫格勒相信他所設想的世界會讓人完全沉浸其中，而 IMAX 格式的遼闊性將加深\n這種沉浸感，他甚至向 IMAX\
  \ 大師《奧本海默》導演克里斯多夫諾蘭及製片艾瑪湯瑪斯尋\n求建議。\n\n\n【罪人】全片以當今解析度最高的 IMAX 底片拍攝，這也與全片幅 1.43 IMAX\
  \ 膠卷攝影\n相合，並結合 Ultra Panavision 超寬螢幕格式，打造出最沉浸式的電影世界。\n\n\n《抽獎方式》\n4月12日 23:59前，推文留言分享想看的原因，就有機會獲得電影特映券\n\
  （如：台中場，我想看罪人，想看最沉浸式的 IMAX 特攝鉅作 ）\n\n\n《獎項內容》\n【罪人】電影特映券（一組2張）\n\n\n《特映會場次》\n台中場：4/16（三）19:40\
  \ 台中大遠百威秀影城 (IMAX) X 45組\n高雄場：4/16（三）19:00 高雄大遠百威秀影城 (IMAX) X 20組\n\n\n《中獎通知》\n\
  4月13日公布中獎者於回文內，並寄站內信通知得獎者得獎事宜。\n請於4月14日12:00 前回覆領獎資訊，恕不接受逾期回覆。\n\n\n《注意事項》\n1.特映券為非賣品，嚴禁兜售等圖利行為。\n\
