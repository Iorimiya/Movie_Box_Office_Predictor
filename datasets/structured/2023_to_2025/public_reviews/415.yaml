url: https://www.ptt.cc/bbs/movie/M.1745072951.A.81A.html
title: '[  雷] 罪人'
content: '音樂好聽，然後就沒了。



  講多一點就是，這是會得獎的片。但是我很難喜歡。

  主要就是文化差異。不懂那個文化根本很難進入劇情

  黑人文化、信仰文化、藍調音樂、印第安文化

  沒辦法進入劇情就只能看電影表面。


  只看表面就只剩音樂了吧。



  個人主觀評分：6/10


  建議找個音響好的影院看，還有亮度一定要充足

  一堆黑人角色，又很多夜晚場景，很容易一片黑根本看不到細節


  --'
