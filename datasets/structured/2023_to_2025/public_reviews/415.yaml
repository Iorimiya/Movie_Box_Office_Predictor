url: https://www.ptt.cc/bbs/movie/M.1539725920.A.039.html
title: '[好雷] 電影【檢方的罪人】 劇情選角皆優'
content: "本文出處:\n\n (有台詞整理)\n\n\n\n\n雷\n\n\n\n雷\n\n\n\n雷\n\n\n\n\n《檢方的罪人》改編自作家 井脩介「日本2014年這本推理小說了不起」獲獎作品，\n\
  \n由《關原之戰》導演原田真人一手包辦執導、劇本，\n\n傑尼斯兩大明星木村拓哉、二宮和也主演。\n\n對我來說本片既不推理，也不燒腦，若是想成偵探推理燒腦片，是有所誤解的，\n\
  \n個人認為算是劇情片。出場的人物有點多，但細想其實只環繞著一條故事軸線。\n\n是好看的日本片，對日本檢警工作環境有深刻地描寫。\n\n當檢察官心裡的那把天平歪斜，私心地想要實現內心自我的正義，\n\
  \n會是產生甚麼樣結果？\n\n\n\n– – – – 以下內容含有劇情 慎入有雷區 – – – –\n\n– – – – 以下內容含有劇情 慎入有雷區 – –\
  \ – –\n\n– – – – 以下內容含有劇情 慎入有雷區 – – – –\n\n– – – – 以下內容含有劇情 慎入有雷區 – – – –\n\n\n\n\
  \n我沒有看過小說，以下針對電影來講（不過小說評價似乎很不錯…，有機會再來看看）。\n\n首先要說，這部電影選角非常的棒，每位演員的演技都很到位！！\n\n\n\
  \n\n1.電影【檢方的罪人】演員要角\n\n木村拓哉（飾演 最上毅 ）跟二宮和也（飾演 沖野啟一郎）不在話下，\n\n兩位男神的演技皆是可圈可點。\n\n松重豊飾演諏訪部利成-代替上帝執事的男人，\n\
  \n把黑道老大的不拘小節、風流倜儻，演技收放自如。\n\n飾演松倉重生的酒向芳，詮釋變態異於常人的精神狀態，\n\n讓人會有一股打從心底層升上來的毛骨悚然，令人印象深刻。\n\
  \n總之，這部電影的演員選角，個人覺得相當出色！光這點就很值得看。\n\n以日本片來說，節奏、劇情流暢度都很好，不會有很悶或是拖沓的感覺，\n\n但為何覺得不推理，\n\
  \n大概就是其實答案都演給你看，也講給你聽，\n\n剛看完會覺得月野和樹（平岳大　飾）與最上毅這條軸線，在電影中兩個情節的銜接，\n\n以及關聯性在支線上稍嫌有點多餘，應該說是難以讓觀者有合理的前因後果聯結。\n\
  \n所以，在我看來，電影的軸線單就最上毅與新一代的檢察官沖野啟一郎，\n\n包含著檢察官兩代之間傳承，以及理念上的激盪，主題上會更俐落一些，\n\n其他關於二戰和政壇等在電影出現，反而讓整體顯得稍微失焦主題不明。\n\
  \n配樂上，則由二胡拉奏，在電影中稍微放鬆了凝重氣氛，卻帶著一股悲愴的淒美氣息。\n\n畫面上的開場，出現多個鏡射般的城市倒影，對稱的構圖顯得十分漂亮，\n\n\
  隱喻著正義公平的議題。\n\n\n\n電影【檢方的罪人】劇情及感想\n\n電影有如小說般，依序分為3個章節，也用了三張不同的塔羅牌代表：\n\nPART.1 語言魔術師\n\
  \n創造，暗喻檢察官運用言語，誘使嫌疑人供出事實真相。\n\nPART.2 審判\n\n象徵反省與贖罪，通過測驗後，將會有新的開始。\n\n偵查嫌疑人的過程，同時也象徵著在偵查中，檢察官本身亦面臨自我內心的銳變。\n\
  \nPART.3 愚人\n\n塔羅牌的第一張，象徵著起點，0也是一無所有，這張牌代表著自我，\n\n愚人可以不顧風險而一意孤行，但在塵世之中，仍保有純潔的赤子之心，\n\
  \n為了夢想甘願去面對凶險的未來。\n\n\n\n2.堅持自己的故事及正義，檢察官將失足成為罪人\n\n最上毅（木村拓哉）一開始以導師的身份，教導著後輩檢察官，\n\
  \n切勿用自我的心證，去編撰屬於自己所想的故事及正義，在法律與道德之間，\n\n檢察官更需中立公平，否則正義的天平只會崩坍歪斜，為整齣電影劇情埋下了伏筆。\n\n\
  一起因財而殺的老夫婦命案，讓最上毅與後輩沖野啟一郎（二宮和也）師徒共事，\n\n顯而易見的是，最上毅是下指導棋的推動者，而沖野啟一郎則為實際審問的執行者。\n\n\
  而從最上毅的交友往來可得知，其人脈廣闊，黑白兩道皆有交情。\n\n在審問的過程中，\n\n最上毅發現相關嫌疑人松倉（酒向芳）竟是殺死自己學生時期青梅竹馬久住由紀的兇手，\n\
  \n然而法律時效已過，就算知道松倉承認犯案，於法律程序上也無法起訴松倉，\n\n而松倉更表示這樣的自白會讓檢警對自己既定有成見，這一段關鍵的過程，\n\n可說各在最上毅與沖野啟一郎的心中埋下了種子，\n\
  \n牽涉到「法律時效，讓一個有罪之人能順利以法律程序脫罪！？」、\n\n「得知前案的犯案事實之下，在現案真相未明之前，檢察官是否能秉持公正地審理？」\n\n即所謂既定成見，是否會影響檢察官的辦案心證？\n\
  \n而與沖野啟一郎搭配的檢事官橘沙穗（吉高由里子），\n\n扮演一個原本非法律人出身的角色，從她的角度，\n\n更透析了外人所看到法界不合理的事情，而自身親人遭遇冤獄的事情，\n\
  \n也加深了一起辦案的沖野啟一郎，在辦案過程講究所謂的「真相」和「證據」，\n\n是為衡量定「罪與罰」的天平，但在辦案的過程中，愈發感到最上毅是因為復仇，\n\n\
  將所有的罪推到松倉身上，而非追查真正的「真相」。\n\n最上毅與沖野啟一郎，也為了心中所謂的「正義」而堅持。\n\n事實上，我認為最上毅是保有著天真的心，在法界打滾了這麼多年的他，\n\
  \n最清楚法律黑暗的地方，按照正常法律程序，時效追溯期已過，再加上罪證不足之下，\n\n松倉最終會是無罪獲釋的結果，最上毅當了這麼多年的檢察官，\n\n又怎會不知道道德與法律的界線！？\n\
  \n然而聯結到自身情感之下，他陷入自我所謂的「正義」堅持，\n\n他要的是松倉真正在法庭被判刑入罪，\n\n確切地實現松倉應當要承受的所有「法律程序」煎熬，\n\
  \n並非僅在於最後「法律判決」的實現，只是他如此大費周章，讓自己也成了罪人，\n\n而松倉最後卻在一聲令下中乾脆了結，對照使用槍枝的生澀與驚慌，\n\n充滿了諷刺的對比。\n\
  \n最上毅即是塔羅牌「愚人」的代表，更是正義的殉道者，\n\n欲令犯人入罪而做足一切假證，以滿足自己的故事，貫徹自我的正義實現，\n\n然而最終發展雖沒有按照自己的劇本而走，卻也無所後悔。\n\
  \n\n\n3.將所有罪孽推到一個人身上，不會減少犯罪\n\n松倉的辯護律師，或許可以說是人本主義的代表，\n\n深知松倉（酒向芳）是個有罪孽的人，但認為不該把所有的罪孽推到一個人身上，\n\
  \n因為這樣不會減少犯罪，而是要讓他也了解生命的意義，\n\n這就是平常所謂「教化」的可能。\n\n雖然松倉辯護律師的一番話頗為感人，但這樣的樂觀，對照松倉不受控的行為，\n\
  \n我的內心還是打了寒顫。\n\n沖野啟一郎，或許算是本片的中立角色，一個仍充滿熱血的新手檢察官，\n\n沒有既定的成見，也沒有情感牽伴，遵循著前輩最上毅的教誨，要真相事證，\n\
  \n不要以自我心證，能更客觀地看待松倉這個人，\n\n然而就如同那句「沒有人會說出毫無破綻的謊言，也沒有人會說出絕對的真相 ，\n\n正因為如此，所以這個世界沒有真正的正義。」\n\
  \n竹林中的一聲吶喊，也透漏著他對心中「正義」的無可奈何。\n\n\n\n4.結論＆其他\n\n片中還出現《白骨街道》，以及「多難旅社」等情節，\n\n包含日本曾經的「英帕爾戰役」等二戰背景，\n\
  \n是為最上毅與諏訪部的情感聯結，這部份的政治軸線是導演原田真人另外的添加，\n\n個人認為除了批判日本的過去之外，藉由「冤屈終將得到平反」，\n\n亦帶有「轉型正義」的意昧，讓最上毅有這樣的生長背景下，\n\
  \n更促使他想要以自己的方式實現正義。\n\n而最上毅的好友丹野和樹（平岳大），與其岳父高島進（矢島健一）及其女兒等情節，\n\n在本片整體觀起來顯的稍為格格不入，有一說這些右翼政治派系，\n\
  \n應是導演原田真人影射日本現任首相安倍晉三，包含墜樓選擇在酒店，\n\n及穿插著女檢察官為一宗強姦案申訴堅持的環節，\n\n及那句「日本媒體的自由度，只比北韓高一點。」等等，\n\
  \n算是導演藉由電影批判現況。\n\n--"
