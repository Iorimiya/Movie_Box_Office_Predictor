url: https://www.ptt.cc/bbs/movie/M.1744816562.A.112.html
title: '[微雷] 罪人SINNERS IMAX特映心得'
content: '先附上人權，感謝主辦單位


  難得抽到特映票上來分享一下


  雖然標題微雷，但我盡量不提及劇情


  還請斟酌觀看


  以下防雷～～～
















  整體來說是一部黑人、更黑暗的邪惡勢力，再融合音樂的電影（尤其片中不斷強調藍調音樂，雖然我是音樂門外漢）


  我很喜歡前半部導演花很長時間在介紹角色背景


  並慢慢帶入彼此間的關係


  讓不熟悉黑人歷史和文化的觀眾


  也可以理解主要角色所面臨的現實困境以及內心的衝突


  結局部分可能塞了太多東西


  導致許多條線收尾得比較突然



  但整體還是有許多值得觀賞的部分


  尤其音效部分處理的蠻讚的


  滿版IMAX約莫片長一半，我是一直很期待有滿版的時候哈哈哈


  不過因為後半黑人們遭遇黑暗勢力是在晚上


  建議要選音效好、螢幕亮一點的影廳觀賞，才能得到最佳觀影體驗



  另外片尾片段有兩段


  但可能宣傳不夠，我看的那場觀眾幾乎都跑了XD


  第一段字幕跑完有一段


  最後製作組字幕跑完還有一段


  這段雖然不影響劇情，但也值得留下來觀賞




  最後散場時內人說英文片名SINNERS跟singers雙關


  我才恍然大悟原來是指有很多人在唱歌啊(咦?


  -----

  Sent from JPTT on my iPhone


  --


  這部我沒看過，有機會再找來看看'
