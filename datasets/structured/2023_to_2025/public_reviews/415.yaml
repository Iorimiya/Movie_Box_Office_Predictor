url: https://www.ptt.cc/bbs/movie/M.1745247837.A.85B.html
title: '[雷] 【好雷】滿滿的藍調有夠讚_罪人 '
content: '周末去看了早場的IMAX，

  全場大概只有20人不到吧，感覺台灣的票房不會太好。

  不過好像也可以理解，預告片看起來就黑幫、恐怖、吸血鬼、音樂一堆元素全部混在一起，

  完全無法預期他到底會是甚麼類型的片。


  --------防雷--------


  先說最不喜歡的地方是前後節奏有點落差，

  很喜歡電影前半段，慢慢地舖成人物背景跟關係，而且很多場景看的時候都想到碧血狂殺2

  ，像是火車站、荒野中的小屋，還有神秘的沼澤跟傳說。

  但進到後段跟吸血鬼打鬥的部分，節奏感覺突然改變像不同電影，老實說是覺得有點突兀。

  另外罪人的核心很明顯地是想要討論文化挪用與文化剽竊，片中很多小地方都蠻明顯是刻意

  安排，不管音樂還是腳色的安排都帶有寓意跟暗示，不過我是沒有很直接被強迫教育的感受

  ，所以這部分其實是還好。


  會給這部片好雷，

  最主要就是音樂真的加分很多，劇情跟節奏的一些小瑕疵可以接受跟忽略，加上本身就很喜

  歡藍調音樂，所以整體來說是個很棒的觀影體驗。

  然後各種元素混在一起也是蠻腦洞大開的，但又都融合得不錯不會讓人覺得太過荒謬，覺得

  是個很有趣的呈現。


  分享一些自己覺得有趣跟喜歡的地方：

  1.中段的音樂穿越：

  真的是全片最棒的橋段，看到古至今的黑人音樂彼此融合，還穿插了一點中國傳統元素，這

  段真的讓人看了熱血沸騰。而且印象中這段是一鏡到底，鏡頭遊走在各個角色跟樂風之間，

  最後向天空飄去收在倉庫被燃燒殆盡，從側面的看見倉庫中所有的人在為音樂瘋狂，真的非

  常喜歡這一段。


  2.配樂的使用:

  劇情核心是文化剽竊，所以電影裡最一開始的吸血鬼是白人，彈奏的音樂也是偷了黑人藍調

  元素而成的鄉村音樂。

  另外我不是很確定，總覺得配樂有刻意做個很大的反差，印象中白人在說話的時候，配樂比

  較是用很古典、電影會用的那種華麗磅礡弦樂，但黑人講話的時候好像就是用藍調或至少沒

  那麼浮誇的弦樂，這部分不是很確定，不知道是不是自己的錯覺。


  3.藍調與魔鬼：

  其實如果對藍調有些認識，應該就會知道這個應該是來自Robert Johnson在十字路口與魔鬼

  交易，用靈魂交換音樂才華的傳說，而且他也正是彈奏delta blues的傳奇，跟電影的背景

  設定有蠻明顯的連結跟關係。


  4.Buddy Guy客串：

  最後結尾的長大版Sammie是藍調傳奇Buddy Guy客串，有聽藍調的絕對不會不知道他是誰，

  可以說是藍調的國寶級活化石，看到他真的超驚喜，也很意外他老人家竟然演的不差。

  另外Buddy Guy在舞台上演出的片段，在他旁邊的一個黑人小胖其實也是新一代的藍調音樂

  人Kingfish。



  最後雖然很喜歡這部電影跟音樂，

  也理解這是一部團結黑人，以黑人文化為傲的電影，不過對於電影主題文化剽竊的部分，我

  其實覺得是有討論空間的。

  我很清楚現代的流行音樂，基本上都是由美國黑人音樂所衍伸出來的，從藍調分支出爵士、

  gospel、R&B、Soul、Funk、Disco、搖滾、嘻哈...，全都是來自美國黑人。我也懂白人像

  是貓王把黑人音樂的元素偷走據為己有，就像電影裡的台詞「我要你的音樂，也要你的故事

  」。

  但黑人音樂裡其實也有很多黑人認可的白人，像是藍調經典的Johnny Winter，他是剽竊了

  藍調的小偷嗎?或者EMINEM也是偷了嘻哈文化的賊嗎?然後身為亞洲人的我們，可以玩藍調嗎

  ?還是要像電影裡的呈現，我們就應該玩京劇、國樂這樣的傳統音樂呢?


  總而言之，

  我是喜歡罪人的，覺得是個很特別、有滿滿的草根藍調音樂的電影，可以進電影院去好好感

  受一下魔幻的音樂呈現，也看看兩種不同感覺但都很帥的Michael B. Jordan。




  --'
