url: https://www.ptt.cc/bbs/movie/M.1744813927.A.787.html
title: '[負雷] 負雷理由在文內《罪人》'
content: '總之這部是一部爛片

  不過是對我個人而言

  爛番茄的評價完全是給這些黑人的分數

  有多黑，就有多少分吧


  這部片利用吸血鬼這個主題

  來倡導黑人當年的不自由

  因為吸血鬼見不得光

  在那個年代

  黑人也是見不得光的存在

  除非是做黑的

  否則黑人是很難成為富有的人

  每天都是在採棉花


  電影先利用白人當主吸血鬼

  白人利用咬的傳染途徑來感染黑人成為吸血鬼

  雖然成了吸血鬼，不再是黑人

  但依舊活在主吸血鬼白人的控制之下

  黑人和其他被感染的人都只是副吸血鬼


  吸血鬼在未受到邀請時

  是無法進入非吸血鬼的住所


  所以這種片都需要一個腦殘

  開大門讓吸血鬼進來

  不然劇情只要演到他們一直鎖門到日出

  故事就結束了


  既然這片是在替黑人說話

  那這個腦殘就不能由黑人來當

  因此

  對，這就是我給負雷最大的原因


  當然整體故事是非常流暢的

  但前綴有些過長

  令人有些不耐

  但那是必須的故事

  而且角色在演技上也都很不錯

  有興趣還是可以一看的


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
