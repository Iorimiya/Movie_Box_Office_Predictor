url: https://www.ptt.cc/bbs/movie/M.1745665369.A.AF0.html
title: '[討論] ［極好雷］罪人'
content: '罪人是部非常多元素的電影，讓觀眾可以從各個角度去觀看與賞析，從藍調音樂、3K黨、吸

  血鬼等，到親情、友情、愛情等，講述了殖民、種族、文化、歷史、宗教、奇幻、夢想等各

  種元素，並用非常動人的音樂（無論是藍調、愛爾蘭音樂或鄉村音樂都是）、及讓人驚艷的

  穿梭時空的音樂表演場景，都讓人覺得一定要在音效好的電影院看才能感受它的美好。（杜

  比廳）


  而最讓我印象深刻的，是鋪陳一個半小時的劇情主軸，就如同開頭山米的牧師父親所說，俱

  樂部是讓人縱情於慾望的地方，包括金錢、吃喝玩樂、煙酒賭色暴力等，衍然是罪人一般的

  行徑。而確實從成立俱樂部的過程、酒跟錢的來歷、俱樂部內的狂歡等，也確實是慾望的發

  揮與放縱。


  但這同時也是美好的，對雙胞胎兄弟而言，世界走了一圈、看過很多人很多事，能回到家鄉

  開夢想的俱樂部是美好的（雖然是黑錢、黑酒…），而一步步完成夢想、兩兄弟間深厚情誼

  、與朋友共事圓夢、發掘出人才、與所有人狂歡，這些都是美好的，而在那晚，史莫克跟前

  妻在一起、史塔克跟前女友在一起（不過是人妻），這些亦是無限的美好。


  而對山米而言則是更強烈的美好，家鄉的傳說雙胞胎堂兄，從小崇敬到大，能一起共事簡直

  是夢寐以求的事；與志同道合的人相識、成為朋友，並一起為同個目標努力，是很難得的美

  好；遇到夢中情人，在激情的最高點處男畢業，是多麼珍貴的美好（不過也是人妻）；自己

  的才華與努力，第一次能展現在所有人面前，獲得肯定、讚賞，這種成就感是絕大多數人一

  生都無法獲得的。


  而當原本可能只能採棉花、當牧師的一生，突然變成有可能美夢成真，未來的康莊大道逐漸

  明朗，而表演亦達到最高點，群眾的情緒也高漲到頂點，親情、友情、愛情等都達到最美好

  的時刻，此時的音樂、表演也達到令人震撼的美好。（這一鏡到底、穿越時空與人種的美好

  時刻，且是全螢幕的拍攝，讓我想去IMAX二刷了）但如同開頭所講，太美好的音樂，會穿梭

  時空、撕開

  陰陽界的…在最美好的時刻，迎來了黑暗的吸血鬼攻擊時刻，而亞洲媽媽喊著讓吸血鬼進來

  時，我想有喪女之痛的史莫克與前妻，也是能體會的，並迎來最終近乎全滅的大戰。（史莫

  克多打一場3K黨大戰。）


  在那個時代，黑人如同電影所演，絕大多數都是在採棉花、拿消費券，並受盡歧視，甚至3K

  黨的虐殺等，所以主角們才想用俱樂部來讓人們可以舒壓放鬆，享受藍調與生命的地方。而

  當最後山米成為了藍調大師，黑人也不再受到迫害（比較上），山米也功成名就、夢想成真

  時，他還是不斷會受那晚的吸血鬼惡夢所苦（其實我覺得吸血鬼咬一咬就掛，3K黨的虐殺才

  是真的惡夢），但山米及史塔克都還是覺得那晚是這輩子最美好的時刻，而導演也拍出了那

  份美好。

  ----

  Sent from  on my iPhone 13


  --'
