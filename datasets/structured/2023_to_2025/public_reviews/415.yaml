url: https://www.ptt.cc/bbs/movie/M.1555638772.A.15A.html
title: '[好雷]檢方的罪人-大推二宮'
content: "~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\n\n\n不喜勿入！以下文章含有批評及部分情節，閱讀前請多想十秒鐘喔！\n\
  \n\n\n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n正義的界線到底在哪？\n\n\n近年來，有許多日本作品都在探討類似的問題，到底該不該用非正當的手段，去實現自己\n\n心中的正義，這也是本片的核心所在，木村拓哉飾演的最上毅是一名資歷深厚的優秀檢察\n\
  \n官，卻被一樁與自己過去有所交織的案件所牽引，在最上的心中，早已認定眼前案件的疑\n\n犯松倉重生（酒向芳飾），就是過去殺害自己好友的真兇，隨著案件的追查，復仇的惡魔\n\
  \n也逐漸佔據最上的心靈…\n\n\n關於檢察官最上毅，到底是因為好友被害的影響才走上檢察官一途？又或者是當上檢察官\n\n後，才與好友被殺案件巧妙地「重逢」？筆者沒有讀過原作小說，無從得知這方面的設定\n\
  \n，但電影確實成功型塑出，如同最上這般優秀的檢察官，都無法抵禦心魔的侵擾，進而做\n\n出法律所不允許的行為，且非常有趣的一點是，最上的內心深處，似乎還維持著身為檢察\n\
  \n官的自覺，他堅持要讓松倉接受法律的制裁，而非直接拿槍射殺對方，即使，他願意為此\n\n親手殺了另一名疑犯弓岡嗣郎（大倉孝二飾）！或許，這就象徵最上對自己行為的懷疑，\n\
  \n只有透過法律上的有罪宣判，松倉的犯行才會變成眾人所承認的事實！\n\n\n相對於最上的內心描寫非常深刻，最上和沖野啟一郎（二宮和也飾）間的刻劃就顯得有一\n\
  \n點點薄弱，這或許是電影篇幅有限的緣故吧，就劇情判斷，最上應該是相當器重沖野的，\n\n否則不會將他帶在身旁，更試圖讓他參與丹野議員（平岳大飾）那頭的案件，而沖野應該\n\
  \n也非常敬重最上，故事前期可以明顯感受到，沖野並不願相信最上是帶著私心在辦案的，\n\n對於這兩位難得共演的傑尼斯，沒有更多情感衝突上的著墨，實在有些可惜。\n\
  \n\n本劇最精彩的部分，無疑就是沖野檢察官質問疑犯松倉的片段，沖野忽然暴起，用駭人的\n\n聲勢迫近松倉，想讓他坦承犯行，據說，模仿松倉以嘴唇發出的「啵」聲，是二宮自己加\n\
  \n上去的，不但毫無違和感，且大大強化了戲劇效果，二宮再次用實力證明，傑尼斯的演技\n\n擔當絕非浪得虛名！除了二宮外，飾演諏訪部利成的井之頭五郎（誤），也盡責地完成了\n\
  \n點綴的工作，戲分不是太多、且性格也不是太明顯的角色，一點都難不倒五郎，強烈到不\n\n行的存在感，可不是每一位老演員都可以刷出來的，相形之下，飾演主要角色之一的吉高\n\
  \n由里子（飾橘沙穗），其鋒芒完全被木村、二宮和五郎遮掩，讓本片有種零女角的錯覺。\n\n\n欣賞本片之前，筆者本來不抱太大期望，以為這又是一部沉悶的說教片，沒想到匠心獨具\n\
  \n的劇情偏排和角色設定，輕巧地背負起「正義」這個沉重的包袱，這再度說明，即使拍攝\n\n同樣類型的題材，編劇和導演的功力，還是足以大幅改變作品的吸睛程度，尤其在日本文\n\
  \n學中，從理性與情感間切入、故事相對嚴肅的推理小說，可是佔了相當大宗，能夠將這類\n\n故事完美地轉化為影像作品的編劇，實在很難讓人不記住他的名字－原田真人，感謝你又\n\
  \n讓大家看了部精彩的電影。\n\n\n\n\n\n\n\n\n\n\n\n\n--\n本文及更多日劇心得同步發表於-金匠的胡言亂語-\n 及 \n\n--"
