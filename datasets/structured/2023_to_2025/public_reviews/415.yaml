title: '[好無雷] 罪人'
content: "感謝Dcard抽獎活動\n今晚19:00美麗華IMAX特映\n《罪人》是部融合驚悚、藍調音樂、種族議題、信念衝突\n燉出一齣精彩絕倫的電影\n\
  雖說前半段的鋪陳略長\n但背景音樂讓人不會厭煩\n劇情得以層層堆疊\n後半段風格轉為驚悚片\n但保有黑色幽默與價值觀的衝突\n不僅驚悚還有劇情深度\n\n劇中多處使用長鏡頭與蒙太奇的拍攝手法也很有趣\n\
  另外這次電影IMAX的部分在美麗華的銀幕有打滿1.43：1\n而且有幾幕還是從慢慢從2.76 : 1轉換成IMAX畫幅非常有感\n\n晚上場景跟藍調音樂很多\n\
  Dolby廳的效果應該也會很不錯\n\n演員的演技都很到位\n尤其是麥可B喬丹一人分飾二角真的厲害\n--\n\nSent from \n\n--\n\n\n\n\
  過沒有搭配壯闊場景\n但這次IMAX海報背面是有IMAX字樣跟編號  而且1.43:1的電影真的是很少見了\n那段居然有露嗎？\n真的是對好\n美麗華按摩椅還在\n\
  動作戲幾乎都在後1/3"
