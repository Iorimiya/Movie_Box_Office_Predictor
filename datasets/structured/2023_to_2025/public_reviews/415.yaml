url: https://www.ptt.cc/bbs/movie/M.1745942334.A.081.html
title: '[新聞] 《罪人》北美票房連冠 阿湯哥曬票根力推'
content: "《罪人》北美票房連冠 阿湯哥曬票根力推\n\n2025/04/29 05:30\n\n\n湯姆克魯斯在個人社群曬出《罪人》票根，對該片讚不絕口。（翻攝自IG）\n\
  \n〔記者許世穎／綜合報導〕由《黑豹》金獎名導萊恩庫格勒、男星麥可B喬丹5度合作的動\n作驚悚片《罪人》，在全球靠好口碑票房抗跌，更吸引不少名人讚賞，就連「阿湯哥」湯\n\
  姆克魯斯前晚都在個人社群曬出票根，大讚該片並提醒影迷：「務必看到片尾，有兩個重\n要彩蛋！」\n\n《罪人》上週末在北美以4500萬美金（約台幣14.62億元）拿下雙週票房冠軍，累積票房\n\
  已突破1.22億美金（約台幣39.63億元）。票房較首週末跌幅僅6%，成為繼2009年《阿凡\n達》後次週跌幅最低的電影，更寫下影史恐怖片最佳成績。電影在台第二週票房也逆勢上\n\
  漲20%，目前已累計台幣1430萬。\n\n至於上映新片方面，「小班」班艾佛列克、強柏恩瑟主演的新片《會計師2》，以台幣\n2040萬票房登上台灣首週票房冠軍，在美國也大賣2440萬美金（約台幣7.92億元），表現\n\
  相當亮眼。\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
