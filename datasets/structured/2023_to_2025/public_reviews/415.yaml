title: '[好雷] 罪人的控訴 Der Fall Collini'
content: '記得 1999 年有部德國與匈牙利合製片，開頭就是一堆賓士車、帶了一位八十多歲的德國大亨來到布達佩斯，他就是要點一道匈牙利肉捲，沒想到肉捲一吃就被人下毒而死！然後電影慢慢帶我們看這謀殺案背後的二戰納粹惡行...
  不知有多少版友記得這部舊片《狂琴難了》呢？（德語片名 Ein Lied von Liebe und Tod 、英語片名 Gloomy Sunday）



  今天我看院線德國新片《罪人的控訴》，第一個想到的就是《狂琴難了》，它也是以一個八十多歲的德國大亨開場、也是一登場就遭到兇殺、然後慢慢揭露背後的二戰納粹惡行。話說《狂琴難了》上映在
  1999 年、《罪人的控訴》故事時間則設定在 2001 年，也許若要為二戰餘孽的惡行討回公道、一泯恩仇，好像千禧年差不多就是最後的機會？




  不知道現在還有沒有人覺得德國片一定很嚴肅冷峻的？那一定要來看看這部《罪人的控訴》，可別看它表面的二戰創傷與法律正義題材好像很沈重，其實它不但充滿媲美義大利的德國陽光、更充滿德國的熱情激情甚至煽情、絕對是部令人看了熱血沸騰鼓掌叫好的電影！光看它的攝影與配樂，總是在公路上、湖泊上、原野上、山巒間堅定地飛行，總是在當下與歷史中或悲慘或振奮的時時刻刻灑下濃郁的配樂，甚至在角色對話的一個側頭一個回首之間也有震撼的低音重擊，真正是令人難以自拔的視聽饗宴呀！卻渾然忘了這片儘管片長很長、它的故事其實並不複雜。


  的確，並不複雜：此片以一個八十多歲的德國企業大亨 Hans Meyer 被一位六十多歲的義大利裔移民 Collini殺死而展開故事。Collini 雖認罪但對案情一語不發，被分配到的公設辯護人就是年輕出道的律師男主角
  Caspar Leinen，結果好死不死那死去的大亨是待男主角如親生孫兒的長輩貴人！於是這位處境很囧的土耳其混血男主角 Caspar Leinen，他一來為了大亨恩情要自我掙扎、二來要對青梅竹馬的大亨孫女
  Johanna交代、三來要面對曾教過自己的控方律師 Mattinger一直來跟他心戰、四來要想辦法查出些蛛絲馬跡以激勵 Collini開他的尊口 XD 當律師真是大不易。


  真要聚焦案情真相，那也不複雜：(1) Collini 不開尊口，一開就勸珍惜家人，那人生動機令人玩味；(2) 查到他家鄉小鎮 Montecatini、兇槍是納粹手槍
  Walther P38，那殺意令人玩味；(3) 追到了義大利小鎮、找到了證人、追溯了故事，終於在法庭上揭露當年大亨身為黨衛軍屠殺鎮民的真相；(4) 但控方律師援引舊官司，聲稱
  1969 就已告過但大亨但無罪定讞；(5) 主角再找資料發現 1968 通過了「Dreher法」，偷天換日將納粹惡行重定義為「過失殺人」，剛好讓追訴期減為二十年而放走一堆人，而且控方律師好死不死年輕時還參與過這法案！這種法律稱得上正義嗎？




  片尾結果，這法律的「不正義」受到了承認，德國保守派維持的光鮮表象也終於正面戳破了、Collini 的正義也得到伸張而心滿意足自殺了，留了張照片給主角、片末還讓主角親赴他家鄉小鎮投出一顆歷史之球穿越時空告慰死者們（有夠煽情
  XD 我喜歡）... 此片要談的就這個「遲來的正義」嗎？這是主軸，但這主軸有點太簡單直線，反而我還覺得此片花很多時間多拍的支線更有意思，它們整個架構起了一張戰後德國的心智地圖，令整個德國就算大多人都知道有罪，卻只想和稀泥拖時間甚至做善事贖罪，但就是死不願面對：


  主角 Caspar Leinen，是 1970 左右出生的律師，媽媽應是土耳其客工 (Gastarbeiter) 第二代、他則是德國爸和土耳其媽混血的第三代。他受到德國大亨
  Hans Meyer 的仁心收留，宛如整代土耳其客工與南歐客工受到戰後德國的收留、雖然其實是來補充德國重建的勞動力，但在德國的敘事中是恩賜你們工作機會給你們新生活、你們應該要心懷感恩報效德國社會，正如
  Caspar Leinen考上律師功成名就就該以法律貢獻德國、要不是我爺爺供養你讀書你現在還在賣 döner kebap （字幕翻「沙威瑪」）呢 XD 是地，恩情是有的，但因為感恩就可以感情用事和稀泥嗎？



  德國老總裁 Hans Meyer ，他在 1944 年是年輕黨衛軍官，看飾演他的德國帥哥 Jannis Niewöhner年齡，我們就當他是 1920 年出生、生平經歷了納粹年代、也經過了戰後西德重建的年代。他像是潛伏在新德國中的老德國，曾經年少犯下惡行心懷罪咎，長大卻想眼不見為淨，因此他很願意做善事贖罪、很願意貢獻自己家業振興德國重建經濟，甚至很願意對外籍移民敞開雙臂、歡迎進入我們德國大家庭視如己出...
  但不管做了多少建樹與善事，仍不願真面對罪疚，如同一支手槍束諸禁忌的高閣。也許，還是要昔日的義大利孩子帶槍來找他，他才能面對罪疚得到解脫吧？



  德國小孫女 Johanna，像是「零點時刻」後被當一張白紙教養長大的新德國。她自幼就跟哥哥們在這忘卻過去向前看的家庭教養長大，自小就誠心擁抱外來移民多元價值，她的哥哥也許曾經像納粹一般口出排外語言，但她爺爺知道納粹不好一定要改而喝斥管教。於是她哥哥成了土耳其小子
  Caspar 的好友、她也與土耳其小子談了一場夏日情緣長大後還念念不忘。誰也不會說她是德國的壞人，她也絕不會認可過去納粹的一切，但說到「繼承」時她又焦慮了，明明知道要繼承下來的有許多不可說，但下面的人建議她別多問、她也沒那個勇氣面對。



  德國大律師 Richard Mattinger，這玩弄法律信手拈來的法律人，與其說是身負罪疚的老德國，不如說是沒有面貌的德國體制。此片中提到，1968制定「Dreher法案」的
  Eduard Dreher那代從納粹洗白到西德的法官們，他們才是自我解套的老罪人，當年只是小實習生的 Mattinger頂多只算幫凶；只是這「為了國家好、忘卻過去向前看」的擦脂抹粉法律人身段，他為了國家欣欣向榮而學了個全實踐到老。小律師
  Leinen 真要引證歷歷逼問他，他最終仍會憑良心說真話；但若沒有這苦苦相逼，他潛意識裡只是陷入一次次自主失憶，總說「事情攤開對大家都沒好處」不如放下罷。



  但義大利移民 Fabrizio Collini 一點也不想遮掩！他代言二戰時受德國欺壓、但二戰後竟要貢獻德國經濟的南歐國家「客工計劃」之客工 Gastarbeiter
  ，沒辦法當年戰後重建就是這麼不平等，不論馬歇爾計畫還是歐洲內部咸認北歐與德荷比法才是重建火車頭、而正面對付共產陣營的西德更是示範資本主義好生活的重建重點！因此，曾經被德國欺負的國家、屠殺的人民，現在居然為了卑微的工資要放下仇恨忍辱負重效力德國？「客工計劃」的客工來源有西班牙葡萄牙義大利希臘南斯拉夫與土耳其等國家，身為土耳其人也許並無太大仇怨，但身為義大利人可嚥不下這口氣！



  本片有老法律陣營，由德國老人組成鐵三角：有大律師 Mattinger、有女法官 Richterin、還有檢察官 Reimers，他們都不會伸出黑手搞陰謀陷害主角方，但都會用法律人的正當方法想辦法勸退主角；而此片新科律師
  Caspar Leinen事務所則組成了新法律陣營，以他這個土耳其客工第三代的混血德國人為事務所主持人、以賣 Pizza半工半讀的義大利小妹 Nina 為翻譯兼助手、查案之旅連南歐帥同學與自家老爸都來幫忙了...
  不論義大利還是土耳其這些南歐社群，都是 1950s「客工計劃」進入德國的新生代，他們過去也許是德國邊緣，但明日德國需要他們做出改變。




  此片是法律片，主角群是律師與司法官，只是在此並、而，這體制以支持國家發展「忘卻過去向前看」為務，會用民主的程序、嚴謹的立法、技術性執法，偷天換日以保德國發展產能，只盼大家有默契當沒發現。畢竟，1950s-1970德國還在戰後復興的發展期、要肩負歐洲經濟火車頭任務、更要領導西歐與共產陣營一較高下！當年冷戰圍堵共產陣營是西方第一要務，堅守經濟發展與意識型態前線則是西德第一要務...
  這一堅守到了 1989 年柏林圍牆倒塌、到了 2000 年當年受害者都老了，遲來正義要把握最後機會。


  說到遲來的正義，有多少二戰受害者與加害者得到了遲來正義呢？恐怕只鳳毛麟角，現在德國各種肩負國家發展甚至領導歐洲經濟的政商菁英與大公司，它們與納粹過去都還有剪不斷理不清的遺緒，只是當年親手犯下惡行的納粹一代現在應該都已作古。只是即使人已作古，追求真相爬梳遺緒的「轉型正義」還是要繼續，而且要交棒給更能超脫過去情結的下一代新德國人。對我來說，《罪人的控訴》這部片替過去受害者
  Collini揭露真相得到正義還只是其次，主角 Caspar Leinen他們開了一間新德國人小事務所、要以出道第一案為德國法律走出新路，那是更令人振奮的新局。


  結論：《罪人的控訴》在本週歐洲片中，我覺得是最劇力萬鈞張力滿點的！也許它表面的案情主軸並不複雜、甚至有點簡單直線，但它一方面用深情演出與視聽效果炒起了熱血氣氛、另一方面用眾家角色的立場分佈與姿態刻畫勾勒了一張德國面對過去罪咎的心智地圖。更別說，此片演員們拍起來都帥極了，男主角
  Elyas M''Barek認真工作不妥協的身影、女主角 Alexandra Maria Lara 隱隱不安戴著墨鏡等待主角的倩影、義大利老人 Franco Nero一語不發就強烈散發的半世紀悲傷、乃至小黨衛軍
  Jannis Niewöhner那年輕氣盛大權在握的冷酷傲慢... 一個個都帥到底，必看！



  --'
