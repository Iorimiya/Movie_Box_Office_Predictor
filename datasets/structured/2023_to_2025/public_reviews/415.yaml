title: '[請益] 檢方的罪人 有大雷'
content: '看完檢方的罪人後有一個疑問


  電影中松倉在25年前犯下的罪行


  依據電影裡面是說幾乎可以確定是他，但是最後因為法律追訴期失效而無法定罪


  我的疑問是日本在2010取消殺人致死的法律追訴期


  那松倉在偵訊時所說的自白不能當作新事證重新起訴嗎？


  對日本法律不慎熟悉，還請電影版的前輩解答，非常謝謝！


  --

  感謝解答！原來是這樣'
