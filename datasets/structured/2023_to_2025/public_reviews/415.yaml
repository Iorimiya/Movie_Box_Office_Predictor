url: https://www.ptt.cc/bbs/movie/M.1591073677.A.D22.html
title: '[新聞] 《罪人的控訴》影評：遲來的正義 也是正義'
content: "防雷頁\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n《罪人的控訴》影評：遲來的正義 也是正義\n\n文／蔡宜霖\n\n\
  \n《罪人的控訴》劇照。（海鵬電影提供）\n\n【大紀元2020年05月31日訊】在現實世界中，將凶殺案中的凶手繩之以法，通常便意味著\n正義已得到伸張，不過有時若深度挖掘背後的犯案動機，有可能掀起更大的驚濤駭浪，德\n\
  國電影《罪人的控訴》（The Collini Case）所闡述的案件便是以此為題材。故事本身更\n頗有看點，足以成為法庭攻防題材中的佳作。\n\n故事的背景為，85歲的德國富商漢斯‧麥爾在柏林一間豪華飯店遭人射殺身亡，凶嫌意大\n\
  利男子柯里尼隨即被逮捕，一位土耳其裔菜鳥律師帕斯卡‧萊恩則授命擔任他的公設辯護\n人。案件調查期間，柯里尼雖承認犯行，但卻對行凶動機三緘其口，使萊恩大感困擾，不\n\
  過他深入調查後卻發現，背後的原因恐怕要追朔到幾十年前的一場罪行，且真相的曝光勢\n必震驚全德。\n\n\n《罪人的控訴》劇照。（海鵬電影提供）\n\n命案的呈現\
  \ 展現敘事水準\n\n本片的首幕戲堪稱迅速單刀直入，劇情很快進入德國老地產商漢斯‧麥爾遭柯里尼殺害的\n情節。就這場戲的呈現手法也稱得上用心，導演對於凶殺案的發生並未呈現得太直接，而\n\
  是透過場景迅速切換的方式，給觀眾留下一定的想像空間；同時亦留下足夠的線索，讓人\n足以推斷出一場命案已經發生，且柯里尼涉嫌重大。就敘事層面來說，一開始就能給人不\n\
  錯的第一印象。\n\n男主角萊恩被官方任命為柯里尼的公設辯護人，是推動往後劇情發展的重要契機。萊恩此\n時是一位剛在三個月前拿到律師執照的法律界菜鳥，電影對此也有較趣味性的刻畫，透過\n\
  一場簡單但契合故事的戲碼，就將萊恩對於法律界的一些做事方式仍不夠熟悉的處境，呈\n現得簡潔有力。而俗話說初生之犢不畏虎，一位律師界新手如何逐漸成長、在本案中有所\n\
  表現，也足以成為令人期待的元素。\n\n\n《罪人的控訴》劇照。（海鵬電影提供）\n\n就角色背景而言，男主角其實與被害人漢斯‧麥爾一家關係匪淺，甚至已故的老富商還在\n\
  他成長的過程中，扮演過類似父親或祖父的角色。這樣的角色設定也是不錯的安排，足以\n讓萊恩接下案件這件事情，帶來額外的情感矛盾；漢斯麥爾的孫女約翰娜對此的不滿，也\n\
  足以為電影增添角色間的衝突感，一定程度提升了故事性。\n\n在萊恩設法處理柯里尼的案件時，最大的困擾便是後者的極度沉默。儘管罪證充分，柯里\n尼也無意否認犯行，但其始終不肯對行凶原因吐露半字，也讓萊恩大感困擾。畢竟背後動\n\
  機若有令人同情之處，身為辯護律師的萊恩才能為其爭取減刑，柯里尼的惜字如金，自然\n一度讓男主角難有表現機會。不過柯里尼的沉默，也足以令人懷疑背後是否有隱情，增添\n\
  故事懸念；同時，往後他首度開口時，戲劇張力也更強烈。就凶手一角的設定來說，也算\n成功的安排。\n\n\n《罪人的控訴》劇照。（海鵬電影提供）\n\n回憶片段有效填補角色背景\n\
  \n萊恩如何應對難纏的當事人及日常生活的事物，是電影前半段的主要內容。此時《罪人的\n控訴》的風格較貼近於劇情片，電影此時較缺少可以大力加強戲劇張力的元素。不過本片\n\
  在故事的闡述上有展現出合理水準，片中適時安排了諸多有關萊恩年幼時回憶片段，除了\n豐富男主角的個人背景外，還得以透過他與漢斯‧麥爾曾經的緣分，使後者的角色形象也\n\
  得到刻畫機會。因此儘管其開場不久便已身亡，但角色背景決不至於顯得過於單薄。\n\n萊恩與諸多配角的關係與羈絆，也在故事中各自起到一定的作用。男主角父親的登場，並\n\
  不僅止於對父子關係的塑造，其往後對萊恩的案件也有起到一定的幫助；男主角偶然認識\n的披薩店的女店員妮雅，表面上看似無足輕重，但該角色的實際價值絕對超過觀眾預期，\n\
  與男主角合作時，一定程度上就像福爾摩斯身邊的女版華生。漢斯‧麥爾的孫女約翰娜與\n萊恩則擦出浪漫火花，儘管本片對愛情戲碼的著墨甚少、難稱亮點，但這段親密關係仍足\n\
  以讓往後的情節更有張力。\n\n\n《罪人的控訴》劇照。（海鵬電影提供）\n\n命案的本身仍是貫穿《罪人的控訴》的重頭戲，如何突破僵局，則是攸關電影後半段觀賞\n\
  性的關鍵。本片對於轉折點的安排較為到位，以凶器本身的不尋常為開端，往後的發展則\n宛如蝴蝶效應般，逐漸將柯里尼作案的神祕原因攤在陽光下。過程中的發展，也足以體現\n\
  萊恩的能力與善用人脈，使男主角逐漸嶄露出成為優秀律師的潛力。\n\n真相的曝光 情感衝擊強烈\n\n柯里尼作案的動機，要追朔到漢斯‧麥爾曾經的黑暗過去，他的過往經歷在如今的德國依\n\
  然是大忌，因此在片中這項真相曝光時，塑造出的震撼效果也極為強烈。而此前本片對漢\n斯‧麥爾的角色塑造其實相當正面，其對萊恩的恩情與照顧更曾是電影的暖流。在劇烈的\n\
  反差下，也得以營造出巨大的情感衝擊，同時也留下一定的猜想空間，讓人思考漢斯對萊\n恩的善舉，是否是基於贖罪心態。\n\n\n《罪人的控訴》劇照。（海鵬電影提供）\n\
  \n\n《罪人的控訴》劇照。（海鵬電影提供）\n\n已故富商年輕時的經歷曝光後，電影對此的部分塑造，也讓片中擁有不少關於二戰時期的\n戲碼。此類情節的出現，也使《罪人的控訴》得以超脫劇情片的層面，在觀賞性上有了進\n\
  一步的提升。同時，對於漢斯‧麥爾過往罪行的呈現，既讓電影有了鮮明的正邪對立色彩\n，也讓柯里尼為何會對其恨之入骨，得到相當合理的刻畫，有力地填補了此前最大的空白\n\
  。\n\n值得一提的是，真相的曝光並非意味著案件就此定性，本片對此還安排了一項轉折，使柯\n里尼的未來再度蒙上陰影。對於萊恩如何化解這一表面上的死局，電影的塑造也有令人滿\n\
  意的水準，讓漢斯‧麥爾生前為何能逃過追責，得到較合理解釋，背後的原因更直指體制\n上的疏失，堪稱精彩的一筆。\n\n《罪人的控訴》的整體風格偏向劇情片，不過對於律師查明真相與法庭攻防的部分，都有\n\
  堪稱精彩的刻畫，故事本身更扎實地突顯尖銳議題，因此儘管較缺少容易討好觀眾的華麗\n元素與大場面，仍無礙本片成為一部優質的作品。◇\n\n\n《罪人的控訴》劇照。（海鵬電影提供）\n\
  \n\n《罪人的控訴》劇照。（海鵬電影提供）\n\n責任編輯：黃珊妮\n\n\n\n--\n\n\n\n \n\n\n--"
