url: https://www.ptt.cc/bbs/movie/M.1744906835.A.6AF.html
title: '[雷] 罪人心得 藍調與吸血鬼'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  講述美國種族隔離時期的1930年代，密西西比一對黑人雙胞胎兄弟去芝加哥發展得不錯，榮

  歸故鄉向白人買下一間舊倉庫決定開一間音樂酒吧，為了開幕音樂晚會他們招兵買馬找回老

  朋友、舊情人、老樂手與堂弟一起幫忙，殊不知堂弟美妙的歌聲竟然召喚了吸血鬼大軍，這

  群見不得日光的傢伙並非以殺人或吸血為樂，而是想透過咬人將人類變成吸血鬼，延續人類

  所聲稱、嚮往的永恆美好。


  吸血鬼領袖更意外爆料，他意外撞見白人前屋主與他的三K黨親戚同夥，原訂天明後捕殺黑

  人們。主角們一群人負隅頑抗吸血鬼大軍傷亡慘重終於撐到日出，並成功伏擊三K黨，黑人

  哥哥卻也中了彈


  時光快速轉到1992年的某間酒吧，垂垂老矣的堂弟仍在演奏著動人的藍調，兩位神秘訪客突

  然到訪，是60年前被咬變成吸血鬼的小堂哥跟白人女友，原來他們沒有被大堂哥與其他人木

  樁穿心還倖存著。


  吸血鬼小堂哥問堂弟會渴望永生嗎？堂弟說他也活得夠久了，且他們一致認為，60年前那場

  音樂派對，是一生中最棒的日子。


  結論：


  三K黨比吸血鬼還可怕，至少吸血鬼「召募」夥伴不分膚色，連華裔雜貨店老闆都收。


  看點：


  1.吸血鬼+美國黑人血淚史的題材融合

  2.流淌在黑人血液中的藍調音樂，恰如其分且無比動聽地舖排在兩個多小時的電影中


  --'
