url: https://www.ptt.cc/bbs/movie/M.1747077345.A.2A6.html
title: '[極好雷] 罪人 導演的全面進化'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  [極好雷] 罪人 導演的全面進化



  內文除了罪人，還有提到黑豹和逃出絕命鎮，怕雷請注意






  幾年前我在電影板寫了幾千字的〈黑豹〉負評，現在回去看那篇，還是可以回想起當時的氣

  憤，不是好無聊那種等級的不喜歡，而是看到很好的素材被浪費的失望，後來的黑豹2，也

  不覺得有改善多少，從此對萊恩庫格勒的作品就很保留，覺得他很有想法，但對於把概念化

  為故事的能力可能不是很足夠。


  這次的罪人，光看最一開始的預告，其實就可以猜到一些東西，種族隔離時期密西西比、黑

  人、超自然神怪、詭譎的白人在屋外，大概就是種族議題混驚悚這種類型混合的作品，一開

  始好評出來，我還覺得這種議題混驚悚或是混科幻的形式在影評界很吃香，不是很可信，結

  果自己現在已經三刷了，而且很有可能還會繼續刷。


  他把他之前犯過的問題全面性地修正，我懷疑是這次有雙倍的MBJ，所以他也雙倍的認真起

  勁。


  我自己覺得（強調是我的個人意見，如果是覺得黑豹就已經是神作，或是罪人還更難看，我

  也尊重你的想法）他這次把兩個超大問題修正了。不過平心而論，這兩個大問題在創作中也

  很常見，不是他獨有的。



  第一個問題，議題的核心有沒有好好的配合劇情和角色發展？


  創作者有一個最主要的核心想說，觀眾也知道，但是劇情線和角色發展跟這個核心完全配不

  起來。


  舉黑豹為例，裡面其實有很多角色，也有很多立場，但是幾乎都沒有跟主題有所交織，有娜

  琪雅舒莉恩巴庫犀牛瓦甘達耆老團，但沒有人的主張跟金豹帶來的主題有關聯，而黑豹甚至

  沒有主張可言。也不用講到議題的層次，就連劇情推進，也只是把重要角色用成她會做武器

  她會

  打架這種程度的工具而已。



  所以當我一開始看到海莉演的瑪麗登場時，只覺得OK現在黑白戀的代表出現了，就這樣，只

  覺得她會是一個元素。但看完以後，她不只有推進劇情的功用，她的存在映照了故事的主題

  。


  如果不是她最多1/8黑白混血後白人的外表，她就不會自告奮勇去找白人客人探聽，又因為

  是這些黑人佃農的家人般的熟人所以能輕易的得到黑人的信任。


  這個角色 passing的膚色直接可以對應吸血鬼「受邀才可進入」的設定，讓故事推進到下一

  個階段，但若接下來她就只是被殺死或自殺，那還是只有推劇情的用處而已，還不夠。


  等到第一個片尾，才明瞭原來是這樣，瑪麗這個角色必須出現在這個吸血鬼故事才行，吸血

  鬼這個設定不能去掉，也不能代換成其他妖魔鬼怪，因為只有這樣，瑪麗的心願才能實現，

  她才有救贖。她跟史塔克的愛情在那個時代是不可能的，這對戀人只能被拆散抱憾終身含怨

  離世，但因為這是一個吸血鬼故事，瑪麗活到了可以跟男朋友出雙入對也不奇怪的時代，永

  遠廝守。吸血鬼長生不老的設定，成了照射歷史傷痕的鏡子，既控訴過往，又對在歷史上受

  苦的人，施予滿滿的同情，你們的苦難在未來，結束了。


  記得史塔克跟瑪麗一開始在車站的對話嗎？瑪麗咒他下地獄，史塔克說好啊，我先下去幫妳

  留個位置，就在我旁邊。完全呼應結尾，前面的文戲鋪陳後面全都用上。



  接下來是安妮，她一開始登場，只覺得好吧有牧師男孩所以也出來一個傳統信仰的女巫，很

  多元喔，一個身份上的元素罷了，但就跟瑪麗一樣，這個角色也兼具了劇情推進功能和故事

  主旨的地位。


  首先劇情推進的部份就不用多說了，因為她的身份掌握鬼怪相關的知識，自然負擔起說明的

  功能，不然演到2/3 所有角色都要跟著吸血鬼跳大河之舞，THE END


  安妮也不是只有劇情推進的功用，她的信仰和信念，讓老公史莫克的靈魂在結局得到真正的

  救贖與回去的地方。他登場的時候，是一個硬派冷酷，只相信權力與金錢的男人，對不是很

  有害的小偷非得拿出排頭讓他們跛腳，不想通融貧窮的佃農拿的消費券，對靈魂和怪力亂神

  的祝福嗤之以鼻，但這樣的人，卻因為老婆對靈魂的堅持，有了一個最堂堂正正的結局。


  吸血鬼很好心，說可以幫他們殺3K黨，但不用了，史莫克是自己靈魂的主宰，他在光天化日

  之

  下和3K黨對決而亡，然後放下一生沾染的煙（煙硝），擁抱女兒，靈魂和家人團聚，這是一

  生艱苦卻堅持一生的他應得的；而3K黨在光天化日下被就地正法，將被記載為種族仇殺不成

  而死，而不是在黑夜裡因不明原因而死，那也是他們應得的。


  其他的配色也許沒有像這幾位要角一樣被寫的淋漓盡致，又有劇情上的發揮又感人至深，但

  基本上各自在劇情推展、議題深度、笑點節奏都有不同程度的發揮，沒有什麼浪費。


  不過雖然導演在角色和故事的搭配上進步很多很多，我倒也不是完全沒有意見，例如很多人

  提到的台山人太太葛雷絲好像就只有出來雷的功能，雖然情緒上可以理解她一秒都不能等，

  因為她不要苟活到明天女兒卻沒了，跟吸血鬼拼一下也許可以幫小孩爭取一點機會。但多少

  會覺得前面鋪陳這個太太的精明好像只是拿來跟母愛的崩潰反差而已，不是不合理，但有點

  可惜。


  對了，關於台山人家庭，補充一個劇情細節，前面史莫克去找周寶訂製招牌，有一整段是周

  寶的女兒小麗莎去叫媽媽過來，為什麼這段要類一鏡到底拍她走過去媽媽走過來而不是直接

  剪到葛雷絲過來的畫面可以多省幾秒？或是既然生意是跟太太談，那史莫克走過去也可以吧

  。


  我第二次看的時候因為有人提特別注意才發現，周家人開的兩間店，一間是服務黑人的，一

  間是服務白人的，一人顧一間。所以史莫克不能自己去找葛雷絲，要女兒走到對面顧白人店

  櫃台，媽

  媽再走來黑人店。如果沒拍這段，時代劇的空間感就會差一點，當然，這個穿梭黑白空間的

  小麗莎，呼應了她是之後吸血鬼可以突破的原因。


  還有喬克托印地安人，我想他們的位置跟童話故事有一個「從前從前，在某個地方」的說書

  人差不多，是揭開下一章節的引子，不算在故事發展裡面，所以也不至於覺得他們被浪費，

  但是他們在吸血鬼事件結束的白天或是最後的片尾彩蛋都沒有再登場，多少是蠻可惜的。


  這部電影為了這樣的戲份請了密西西比台山人和原住民喬克托人文化顧問，難怪成本降不下

  來XD




  第二個我認為導演大幅進步的地方，就是在議題混類型的作品中，最重要的核心劇情設定的

  呈現方式是不是夠有層次有角度有新意。


  這並不容易，隨便舉個例子，假設性別議題混科幻好了，觀眾猜中這個完美的郊區是個反烏

  托邦，賢惠的嬌妻是被迫困在這裡的，猜完以後呢？如果沒有提供更多東西，只是繼續重複

  這是一個反烏托邦太太被壓迫，就會非常無趣，你簡介就已經講的東西還重複兩個小時嗎？

  我絕對不是針對「別擔心親愛的」


  黑豹1也是一樣，大家很快就知道梗概是「被歧視的美國黑人如果到了一個黑人高科技烏托

  邦國度會怎樣？」，然後就沒了，沒有更進一步的東西沒有更多的角度金豹就被打敗了。


  舉好的例子，我會說是「逃出絕命鎮」。在這個科幻驚悚混種族議題的故事裡，一開始觀眾

  看到男主角擔心去見女友父母、被警察攔車，大概可以猜中這片要講種族，接著女方家庭微

  妙的友善和接連發生的怪事，觀眾會猜這是白人種族歧視搞出來的陰謀，猜中了嗎？有也沒

  有，那些線索是被導演拿來誤導的，揭曉了以後才知道，這些白人的陰謀不是因為歧視，至

  少不是一般常見的那種歧視，是欽羨，不是 180度的大反轉，但至少轉了個90度用稍微不同

  的角度來討論議題。



  回到「罪人」，前面說了光看首支預告裡的線索，已經可以產生這部電影用什麼梗要說什麼

  議題的預期了，但即使不看預告，正片兩兄弟一登場就和賣房子的白人提到3K黨，接著用了

  超過一半片長的時間具體而微地描述30年代密西西比黑人佃農壓迫感極重的生活。


  接著，調性一轉，一個明顯有古怪非常人的白種男性假借求救要進入一個房子，房子的角落

  放著3K黨的長袍和尖帽.......


  此刻導演誘導觀眾去聯想接下來的劇情方向是佃農黑人/3K黨白人＝可憐/霸道＝人類/惡魔



  但，直接這樣演下去，好像有點怪怪的？



  首先，吸血鬼只能夠在黑夜行動，但人類24小時都可以搞事，如果真的是因為種族歧視，當

  一個白人，比當一個白吸血鬼，要更容易對黑人種族歧視吧？要很直白的這樣演下去也不是

  不行，但前面已經演了超過一半片長人類的種族歧視，如果接下來只是繼續講一樣的東西，

  那敘事上就太重複了，吸血鬼做得出比三角洲瘦子的朋友遭遇到的悲劇更可惡的事嗎？那吸

  血鬼設定豈不是可有可無？



  還有，到了2025，綜觀創作中的吸血鬼會發現，吸血鬼其實是出現在言情作品多於驚悚作品

  的奇幻生物。因為不會腐爛不會變得奇形怪狀還可以長生不老，所以除了諾斯費拉圖是醜男

  以外，幾乎都是帥哥美女可愛正太蘿莉。加上吸血鬼的記憶和智力會保留，不像活屍一樣只

  能嘴巴開開腦袋空空往前走，當代的作品如果吸血鬼要轉化凡人，普通人的反應幾乎都不是

  驚恐而是「有這等好事？」



  因此若吸血鬼真的是種族歧視的白人，一堆黑人佃農在白天已經為白人做的要死要活了，特

  地轉化他們變成眷族吸血鬼，永遠生活在一起的必要性在哪，聽起來反而像是......地位提

  昇？



  導演把你往3K黨的方向誘導，但同時又運用吸血鬼的設定，直接把議題帶向另一個角度。





  吸血鬼唱起〈往都柏林的崎嶇之路〉答案揭曉，主吸血鬼雷米克是愛爾蘭人。





  曾經有3K黨人解釋，大家都誤會了，他們的中心思想並沒有針對黑人。


  聽起來像狡辯，但這是事實。他們沒有只針對黑人，除了非洲、亞洲，他們也把歐洲分成三

  份，愈南邊愈低等，地中海區域人種〈 阿爾卑斯山區域人種〈 西歐北歐人種最優但愛爾蘭

  除外



  「但愛爾蘭除外」



  詳細的歷史就不詳述，總之因為戰爭和飢荒，大量的愛爾蘭人被賣為契約奴隸或被迫移民求

  生，一次次往美洲輸入，生活條件和社會地位都非常糟糕。因為饑荒和被迫離散造成的愛爾

  蘭人口損失數量多到過了180幾年的今日還補不回來。



  （這是描述19世紀末愛爾蘭人在美國被排斥的喜劇段子）


  劇情到這裡，突然轉了一個彎。


  不是單純直白的強勢族群對弱勢族群，而是不同弱勢族群之間的關係。


  雷米克一片善意要解救世上受苦的人，但用的手段卻是脅迫與強制，弱弱相助跟弱弱相殘，

  常常只是一線之隔，我們都是可憐人的身份，也許只是一種把自身的弱勢當成武器的作法。

  但有意思的是，因為最終瑪麗和史塔克的結局，雷米克的行徑算是100%的罪惡嗎？導演留下

  了一個值得思索的空間。


  P.S.我看到板上和其他地方有一些討論，覺得吸血鬼的蜂巢型態（有個人意志但記憶感覺相

  連，有主體吸血鬼主導群體）可以對應黑幫、邪教、極端主義、共產黨等等現實中聲

  稱保護弱勢帶來解放實則服從領袖的團體，很有意思，但我自己是不太會想那麼多就是了。

  電影這個吸血鬼這個既提供解脫卻又進入另一種同化的兩難掙扎對我來說就夠豐富了。


  最後來講牧師男孩山米


  吸血鬼事件的終盤，人類跟吸血鬼大亂鬥，山米被雷米克追到水邊，那個時候我想山米的藍

  調會引來惡魔的伏筆用上了，那「牧師男孩」呢？他聖經熟到可以隨便抽背，這會是解決雷

  米克的關鍵嗎？是的，基督徒的設定在這裡用上了，但不是我想的那樣。


  故事開始時，教會對山米而言是權威的象徵，要求他規矩，阻止他自由的藝術靈魂，接下來

  三角洲瘦子提到基督教是外來強加的，但藍調是原鄉帶來的。如果雷米克會被聖經聖水擊敗

  ，反而會是最絕望的一件事，因為那代表即使山米再怎討厭規制，他終究得因為安全去放棄

  他想要的自由。


  「還好」雷米克不怕聖經。


  不但不怕還跟著背，還把山米的頭壓在水裡嘲弄地幫他受洗。


  因為雷米克在基督教來到愛爾蘭前就存在，應該是中世紀凱爾特人（他仍拿著古代金幣），

  直接對應了前面的「基督教是外來的」的殖民主題，接著他說：


  「他們編造了天上有神，地下有鬼的故事，但我們是男人與女人，我們是獸，我們是土地，

  我們是相連的，我們即是神」


  這個吸血鬼活了一千多歲，見證愛爾蘭的文明更迭、宗教轉換、戰爭與飢荒，然後來到新大

  陸，想建立一個讓苦難之人有愛與歸屬的新世界，然後，他想要美得可以撕裂陰陽界的音樂

  ，讓他再見他的家人一面......


  他不能被聖經打倒，擊敗他的是陽光、木錐還有山米一生都不願放手的吉他。


  我很喜歡雷米克這個角色，那麼少的資訊，卻這麼有魅力，會唱歌還會跳踢踏舞XD雖然酒吧

  的客人很可憐，但雷米克死在陽光下的時候，還是覺得很惋惜，不過換個角度想，千年後黎

  明再次照耀在他身上，哀怨也算到此為止，解脫了。


  三個主角都失去很多，但也得到各自的救贖，有的得到愛情，有的得到他該有的公義與歸屬

  ，有的得到了自由，既哀傷卻又有希望與滿足，好一段時間沒看到這麼有力量的結局。



  雖然講了這麼多劇情編排，但這部電影，不能不提音樂的表現力帶來的強大滿足感，藍調與

  愛

  爾蘭民謠好聽得不得了，配樂很滿但不過份，和所有畫面一起自然流動，配上很完整的故事

  線和感動的結局，觀眾跟他們一起經歷了最快樂最自由的僅此一夜。






  --






  說到投資，很多台灣影迷幫本片抱不平，台灣華納對這片的行銷怎麼靜悄悄的只有中規中矩

  的臉書貼文跟一般新聞稿，如果不是口碑跟美國的票房很好，就要錯過這麼優秀的原創電影

  。


  我要幫忙說個話，<罪人>在東亞地區有同步上映還排IMAX的並不多,台灣就是其中之一，韓

  國要五月底，香港等六月中，日本根本還沒排檔，所以華納評估這部東亞是不太能賣的，台

  灣華納願意同步院線，現在破2500萬，算是很不錯了。


  所以華納賭多大你就知道，這部題材太過美國本土歷史，主要得靠本地票房，但導演要用90

  00萬鎂的高預算拍黑人主題原創時代劇、服道化場景考據都精緻，有歌舞場面，要IMAX拍攝

  ，

  而且導演要求25年後版權要歸他，華納還開綠燈，簡直是被吸血鬼咬到洗腦，結果竟然真的

  賭到大賣特賣


  波琳對山米來說，是堂哥們以外的另一種對自由與罪惡歡愉的憧憬，不過我會把波琳和玉米

  麵包一起放在次要配角的區域，他們能提供笑點和懸疑感，有討喜或魅力的演出，就算很有

  表現了。



  我也很喜歡他



  華人妹妹的一鏡到底我也是看到有人提，再刷的時候特別注意才發現有這種巧思。還有人分

  析鎮上黑人在聊什麼白人在聊什麼，不過對我來說這就太細了超出我能關注的能力範圍。



  感謝補充這麼多資訊，特別是我對喬克托人一無所知，不知道他們跟愛爾蘭還有這層淵源




  哇如果再刷我會注意字幕，謝謝補充



  雷米克用麗莎要脅，葛雷絲才崩潰



  雖然出來查資料知道他是國寶級的大人物，但跟樂迷看到他的驚喜就是不同，我對音樂的了

  解很少所以這篇就沒多提，感謝各位的補充





  他喊「山米！」喊得那麼興奮真的很跟蹤狂XD



  雷米克真的很有趣，詭異氛圍兼具歷史厚度的同時又讓他超級幽默



  他說我會走很慢免得你們改變心意的時候還不忘回頭一下



  謝謝大家的推文，不過對這部電影，其實還是有一點覺得不太確定要怎麼理解的地方，不知

  道大家有什麼想法


  就是彩蛋2山米在唱歌，唱的是福音歌曲「小小的微光」，但是用藍調的形式去唱


  電影對基督教的觀點是比較負面的，彩蛋這樣的安排，是比較友善和緩的圓場，表示自由、

  非洲原鄉、藝術追求和基督教社群最後能找到一個融合與平衡（畢竟現實生活中黑人教會是

  社群的重要支柱，不能只用那是殖民就一概抹滅）


  也就是山米是樂觀的最終希望，雖然逃離吸血鬼（弱勢者的邪道）和教會（壓迫的正道），

  但他能夠在保持自我下與最後這兩者和解


  又或是反過來，因為彩蛋2是在一切開始之前（山米臉上沒疤痕）所以是很悲觀的覺得這種

  共融只不過是一個晚上就能毀滅的稍縱即逝？


  同意前者的感想比較多，但我不是很確定就是了'
