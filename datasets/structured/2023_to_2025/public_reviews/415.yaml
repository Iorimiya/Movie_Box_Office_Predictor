url: https://www.ptt.cc/bbs/movie/M.1541253669.A.090.html
title: '[討論] 檢方的罪人有雷'
content: '4刷了還是很喜歡，每看一次就發現不同的小細節，體會不同的滋味。可惜這幾天實在太忙沒能在今天這個特別的日子達成5刷QQ


  先分享一下自己觀察到的小細節，不過也有可能是自己過度解讀。

  1.電影開頭沖野剛被調到刑事部去拜訪最上時，最上把沖野的性格描述出來，第一次看還以為雖然兩人很少見面但是最上一直在關注沖野，原來是因為生日占卜才能描述得這麼頭頭是道啊


  2.橘在千島大鬧會議時特地把包包往前推。還有最上來找沖野詢問案情進度(就是看到松倉名字那邊），橘特地換了位置並且把手機放在桌上


  3.最上還是很細心的，一開始有向小弓確認是否有共犯，但是小弓為了保護戀人說沒有。戀人後來也因為擔心他報警。結果這一對狗男男為了彼此卻害慘最上QQ


  4.一開始直覺<檢方的罪人>說的就是最上，後知後覺的才發現沖野也同樣符合。兩人同樣偏執，對自己的正義深信不疑。最上為此殺了人，沖野也背叛了整個檢察體系（向外透露資訊什麼的真是要不得）。所以說，沖野小弟，你已經達成心願了，繼承了最上的這份偏執/正義。


  第一次看的時候基本上注意力都在臺詞（情報量真的很大）,重看的時候才終於能好好欣賞每位演員的演技。


  松重豐，木村，二宮，酒向芳四個人的演技都非常精湛，雖然說能讓大家交口稱讚演技的往往都是爆發戲，可是這四個人每一場戲的微表情也讓人讚嘆不已。還有臺詞的語調語速把握都堪稱完美。能夠在一部電影看到這麼多年齡層不同的好演員們飆演技，真的是讓戲癡我歡喜雀躍



  不過還是有些細節想請教一下

  1.最上每週去坐禪的動機？當初結婚確實是愛著他的妻子吧？


  2.沖野:

  審問松倉中途，最上聽到當年真相悲憤（？）離開，而沖野是在最上離開之後才開始動用言語暴力XD質問松倉。這樣看來後面這一段是沖野以自己的意願行事？可沖野在這之前就跟橘討論過最上和田名部過於針對松倉了，為什麼還要這麼做呢？


  3.諏訪部在最上拒絕後仍舊安排殺死松倉的目的？


  4.導演特別安排大師是外國人有什麼意義嗎？日本不用法錘到底是為什麼XD




  -----

  Sent from JPTT on my OPPO F1f.


  --'
