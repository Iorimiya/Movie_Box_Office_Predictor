url: https://www.ptt.cc/bbs/movie/M.1540476739.A.58B.html
title: '[普雷] 檢方的罪人'
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  1.影片名稱 :檢方的罪人


  2.觀影時間 : / 拒答


  3.觀影地點 : 信義威秀


  4.觀影方式 : 自行購票


  §其他防雷說明(非必要) : n刷等其他說明請於此區說明....可留空




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  此區為發文防雷頁

  可選擇性提供上列 1~4 資訊  或不提供亦可

  觀影心得於分隔線下方發布即可


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  一直以來都滿欣賞二宮的演技

  在路上看到他跟木村拓哉合作電影，經了解發現女主角是我超喜歡的吉高由里子!!!

  立刻決定要看這部!看之前只稍微觀望了一下版上評價還不錯，

  連劇情大綱都不知道就進戲院了


  看完其實有種搔不到癢處的感覺

  可以感受到導演有企圖想傳達很多理念給觀眾，但似乎不太成功

  對於最上的政治友人那條線，我始終摸不著頭緒，感覺是很重要的支線但又看不懂

  再來就是片中每個角色擁有的信念對我來說都不夠強烈，

  最上初戀被殺對他的影響、橘(女主角)的友人因為冤案自殺等等，

  都讓我不太能夠入戲

  看到完才想弱弱的問一下大家，橘這次潛入檢察官身邊工作不是為了寫書，

  而是為了防止冤案再度發生嗎?因為她跟沖野太突然的床戲(?)害我沒法認真聽她說話XD



  這部讓我喜歡的地方應該就是主演們的演技吧

  二宮的演技一如既往地沒話說，雖然娃娃臉還是有點減低他的魄力，

  但是偵訊那段真的精彩！也非常帥氣


  對了為什麼大家都稱呼橘為姊姊啊?害我還特地去查了吉高跟二宮的年紀，

  吉高比二宮還小沒錯啊@@



  吉高可發揮的地方似乎比較少，但因為很可愛所以很滿意XD

  也很開心她跟二宮有戀愛戲，雖然非常非常少，兩個人突然辭職後在一起那段我也有點亂，

  為什麼沖野辭職後好像搬新家，然後聯絡橘說妳安頓好了嗎?

  橘被最上拆穿寫書的那段看起來沖野也是被蒙在鼓裡，

  但是為什麼之後兩個人卻又在一起了呢...辭職不可能是說好的吧?

  不管如何，這段都是我最喜歡的一段，算是滿足我很喜歡的演員們湊對的願望

  二宮很可愛，吉高也很可愛~



  寫心得才發現看不懂的地方滿多的，覺得剪輯上也有一點跳

  其實以往我是很少看日本電影，比較不能理解日本導演的風格

  但是前陣子看的麒麟之翼精彩又令人感動，才想說再試一次日本電影

  只能說因為演員們的關係，我還滿喜歡這部電影，

  但可能要再看小說了解一下詳細的背景跟主角們的心境了！



  --'
