title: '[好雷] 罪人 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看完罪人雖然是在講黑人跟吸血鬼

  吸血鬼的部分我沒有特別想法,就是爽爽打架

  但我看到黑奴採棉花的部分 以及消費券的部分

  一直想到現在雖然沒有黑奴了

  但全世界的工廠裡面

  不還充滿著幫美國人工作的工人賺取著微薄的薪資(相對美國人薪資來說)

  生產著美國人需要的各種物品,電腦,iphone,衣服,各種日用品

  然後美國人還嫌工人們賺太多要拿回去

  消費券的部分跟現在的美債跟關稅其實也很像

  大家努力工作換來的報酬又要繳回去給美國

  剩下存的錢又是一輩子繳在房租或房貸上

  還是很多人過著努力工作只為了周末可以喝杯酒的生活

  黑奴制度其實一直沒有消失






  --'
