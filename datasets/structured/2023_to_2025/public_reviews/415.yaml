title: '[資訊量太大好雷] 罪人'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~













  前中段在戰種族、戰階級


  後段開始畫風瞬間大變

  直接變成驚悚恐怖片


  最後在談自由 在談生存

  格局很大 格調很高

  缺點當然就是那些故事背景 觀影者要自己再去吸收


  裡面那個的吸血鬼傳說

  光是這點就非常有趣


  這部片如果無腦看大概會看不懂XD

  要詳細理解各段歷史故事

  也不是看一次就能完整了解整個故事架構


  總之是部很有野心的片 真心推薦


  --





  --'
