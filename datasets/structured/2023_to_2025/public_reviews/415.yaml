url: https://www.ptt.cc/bbs/movie/M.1753786028.A.49D.html
title: '[心得雷]《罪人》：象徵、反基督與弱弱相殘 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




















  《罪人》：象徵、反基督與弱弱相殘


  致謝 虛詞．無形 刊登本文： （&

  picture credit）


  「There are legends of people…born with the gift of making music so true…it

  can pierce the veil between life and death. Conjuring spirits from the past

  and the future. In ancient Ireland, they were called Filí. In Choctaw land,

  they call them firekeepers. And in West Africa…they’re called griots. This

  gift can bring healing to their communities…but it also attracts evil.」


  故事的開端以 Sammie 拿著樂器帶著臉傷走入教堂開始，他的牧師父親以上帝之名及因他

  被罪惡（sin）給召喚為由，要他放下吉他並且在會眾前起誓。而這起始在尾聲中是以其

  帶著吉他開著車離去鄉村作結。吉他與音樂正是整部電影的核心，並非其內容，而係其象

  徵：靈魂。


  敘事回到一天以前，1932年的密西西比州，從芝加哥卡彭幫派回鄉的 Smoke 與 Stack 兄

  弟（Michael B. Jordan 分飾），要在家鄉開一間音樂酒吧，帶著成捆的錢財，從白人地

  主購入一間舊鋸木廠，並且在一日之間製作招牌、找了樂手與廚師、守門員。當然如此倉

  促似乎有些不切實際，甚至這些人即便可能是舊識但也有其他社會繫絆（例如鋼琴手

  Delta Slim 在故事中就因為夠高的報酬就離去待了十年的酒吧，與 Sammie 一同前往故

  事中的場景），然而當這對兄弟拿出成疊的鈔票時，進度就奇幻地推進完成。

  s吧奇蹟似地在晚間順利開幕，隨著 Delta 的藍調琴聲熱舞過後，他順勢引介了

  Sammie，自介姓名 Sammie Moore，並且是名佃農（如同在場大多數其他人一般），並且

  綽號是牧師男孩（Preacherboy）正因其父親是名牧師，而他唱著他所寫的樂曲《I lied

  to you》，伴著琴聲讓全場歡騰。金錢進帳、角落浪漫、樂舞狂歡，如此靡音亦如同片首

  的告誡一般，治癒了群體，但也召引了惡靈。


  白天時被印第安人追殺的白人男性，恰巧逃進到一戶夫妻人家前，起初雖被阻於門外，但

  以金錢為代價即順利入門，從該男性被白日照射灼傷的畫面，以及他吸食人血轉變他人即

  該夫妻為吸血鬼的行為，再加上「邀請入門」的條件，無疑地，吸血鬼正是這部電影的惡

  靈。而他們三人在晚間被樂音吸引前去酒吧，以樂器為喬裝演唱著鄉村音樂，卻仍無法誆

  騙獲得入門允許，臨走前他們卻提到他們有諸多可消費的錢，期以此為誘而得過境。


  Smoke 與 Stack 兄弟正因是否收受非美金的消費券而爭執（起因於多數來客都是農工，

  而沒有硬通貨即美金卻只有消費代幣可支付）時，Stack 的舊愛 Mary 以自己具有黑白混

  血身分提議前去確認上述白人底細。吸血鬼這類型的異類，如同偽人一般，除了獵食時亮

  出的獠牙以外，與常人實難分異，被金錢誘因所驅使，Mary 成為了故事中被轉化的黑人

  群體中的第一人。而她再以人類面貌與 Stack 交媾時，轉化了他。


  派對這時結束，但眾人仍不知何故，走入黑夜中的群眾被吸收成為吸血鬼群體的成員，而

  這也包括了Stack 與 Mary，留在酒吧的存活者成為了少數。這樣的情節要推向高潮必有

  其引信，而這就是製作招牌的亞裔 Grace Chow 因見丈夫 Bo Chow 也被轉化後，憂慮於

  女兒也遭毒手，怒喊了：「Come on in, you motherfuckers!」於是吸血鬼眾湧入，夫妻

  、手足、親友互相廝殺，直到最後 Smoke 將木樁刺向追殺 Sammie 的吸血鬼首領的身體

  中央，才結束了這場戰鬥。


  吸血鬼一直都有反基督的象徵性質存在，除了不死的性質對應於基督教的生死觀以外，常

  見的男同性戀氣質也有悖於基督教式的一夫一妻制男女結合婚姻，更不用說十字架經常是

  流行文化作品中對抗吸血鬼的利器。同時，Max Weber 在理論上建立了基督教與資本主義

  社會的關聯性，在《罪》的故事中，也充分體現了資本主義的根基「通貨（currency）」

  造就的各種悲劇，換言之，《罪》的故事即係就基督教與資本主義間的關聯之延伸與應用

  。


  除了為了確實賺進美金，Mary 找上了吸血鬼首領之外，故事中也揭露了實際上該首領最

  先吸收的白人夫妻本即3K黨的成員，而該地區的3K黨的首領即係故事開始時賣出土地給

  Smoke 與 Stack 兄弟土地與鋸木廠的白人地主，實際上，故事的隔日3K黨就要來殺害酒

  吧中的群眾（即黑人群體）。所以，如同命運般地，這間酒吧橫豎都會發生悲劇：要不是

  如同故事中晚間被吸血鬼給襲掠，就是隔日被3K黨給屠殺。


  而以吸血鬼作為主題的故事，《罪》的創新之處在於把賽博龐克元素的集體意識給納入，

  換言之，電影中的吸血鬼是作為群體而存在的，每一成員感其他成員所感，受其他成員所

  受。這個集體主義的特性更是對立於資本主義中的個人主義，那麼，吸血鬼的群體在電影

  中更有共產主義的象徵存在。這也可見得該群體在反對體制（基督教、資本主義）的行動

  上，並不區分膚色、性別、年齡、身分，只要是能吸納成為成員的來者不拒，這就如同現

  世中的共產主義理想的「平等」一般，因此故事中吸血鬼群體對體制的反抗，就有如共產

  革命一般。


  電影中的其他宗教象徵有如 Smoke 與 Stack 以及 Sammie 同行時，殺了貨車上的蛇。又

  或者，首先被轉化的 Mary 不僅是黑白混血，聖經中的聖母正也與其同名之外，故事中

  的 Mary 的丈夫也是一個沒有被揭示面孔的白人。更不用說，Sammie 在哼唱歌曲時的酒

  吧狂歡，有如酒神戴奧尼索斯式的狂亂一般，但在基督教面前，這些都是異端，就像

  Sammie 的音樂一般。眾所周知地，藍調（blues）是黑人音樂，是身分認同的基源，被宗

  教意識給支配的黑人群體即係 Sammie 父親牧師所帶領的信眾，他要他放下音樂，也就是

  要放棄「自我」。


  Sammie Moore 的名字是三個音節，類似於 Savior，只不過後者是基督教限定的，也因此

  哼唱著藍調、擁抱身分的 Sammie 不只是罪人（sinner），更係異端（heathen）。導演

  Ryan Coogler 的作品風格鮮明，就像 Jordan Peele ，都在敘說黑人群體的故事。事實

  上，不需要去扭曲事實、歷史，也能有內容豐富且富含意義的創作。同時，我們也能在《

  罪》想到過往的許多電影，例如分飾兩角像是《金牌黑幫（Legend）》，或是酒吧場景的

  吸血鬼故事經典《惡夜追殺令（From Dusk Till Dawn）》（尤其是《罪》中的特效有些B

  級感，更難讓人不將此二者連結），

  又或者在那個時代難以想像的對3K黨的滅殺（即片尾 Smoke 埋伏隔日到訪酒吧的3K黨群

  眾），就像《惡棍特工（Inglourious Basterds）》裡頭角色對納粹黨的掃射。


  若從主宰者的觀點來看，也就是從資本主義基督教的觀點來看，非我族類即係他者，二元

  的劃分沒有灰階。然而，《罪》的敘事即係從他者的視角出發，實際上，世界並不是二元

  的。基督教以外的不是非基督教而已，資本主義以外的不是非資本主義而已，甚至，資本

  主義/基督教中心以外的，也並不是一個群體，而是多中心的紛雜。固然在反對體制的路

  徑上，這些概念上的「非A」（相對於A）是相同的，但這些「非A」群體之間絕對不是大

  同小異可以概括分類。因為每個「非A」都有各自的群體目標，或許是為了壯大自己的勢

  力，其他較小的「非A」都可能會是被吞併的標的，就像是《罪》裡頭的吸血鬼群體，不

  僅是反基督的，也是被壓迫的群體，但他們也仍是迫害了黑人的群體，即便無論是吸血鬼

  群體或是黑人群體都是被這個更大的體制給壓迫著的。


  有些諷刺且荒謬的是，若將《罪》中吸血鬼群體的集體特性詮釋為共產主義性，故事後段

  為何集結了足夠的（吸血鬼）群眾，仍然要遵守那條「邀請入門」的條件？畢竟，邀請入

  門的條件顯然地具有私有財產制中對財產標的完全處分的性格，那麼若說情節有如共產革

  命，為何無法突破這層制度上的藩籬？答案並不複雜。因為那個制度早已不只是理想，而

  是已被實踐後的現實，即便是抱持著不同理想的群體，也不得不服膺於現實，除非直到該

  群體的理想也被實踐成為現實。換句話說，私有財產制已是現實的情況下，即便有著不同

  觀念的群體，例如共產主義團體，除非該觀念成功取代（例如革命成功），否則現實仍是

  有著一套必須遵行的規則。


  這是一個弱弱相殘的故事，Sammie 之所以是罪人，僅係因定罪者有此權力（Power）而已

  。然而，《罪》從（被指稱的）罪人視野述說故事，不僅電影作品本身即係對該權力之反

  抗，也是呈現給作為觀者的我們罪人的視界。






