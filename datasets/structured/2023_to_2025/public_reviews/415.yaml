title: '[好雷] 罪人 這評價一定超兩極的吧'
content: '雷文防雷資訊頁



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  我幾乎已經可以想像喜歡的人會超愛  不接受的人狂噴這種場面


  結論 前面很神 後面見仁見智


  優點：

  無法定義新型態吸血鬼音樂片 （應該還沒有人這樣嘗試過？）


  電影技法堪稱大師之作 音樂堪稱一絕


  聲光效果讚 有極高音樂元素 在小螢幕看整個等於沒看是真的


  吸血鬼沒有想殺人 是想讓所愛的人獲得自由 這對應到那個年代很有梗


  缺點：

  後面大戰處理輕浮 把前面鋪陳的關係很快玩掉 那亞州女是在亂啥？？


  不是剪爛了就是劇本真的掰不下去


  我一度想說沒有吸血鬼元素或許會更好 但最後酒吧對話有拉回一點看法


  但會讓人有這種感覺代表這個融合還沒有到最自然


  台灣華納在四月總是會排讓人耳目一新的電影


  去年挑戰者 今年罪人


  這部更是早早就已經定檔了 沒有因為它是黑人非傳統類型片很難賣就放棄


  比起某家出爾反爾的 這次我給華納一個大讚



  -----

  Sent from JPTT on my iPhone


  --'
