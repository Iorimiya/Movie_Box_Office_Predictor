title: '[新聞] 《罪人》全球破2.83億美元！　「台灣票'
content: '《罪人》全球破2.83億美元！　「台灣票房逆襲」IMAX限定3天回歸


  記者黃庠棻／台北報導


  由《黑豹》金獎名導萊恩庫格勒打造全新動作驚悚電影《罪人》，自4月上映後叫好又叫

  座，每週更維持超低跌幅持續吸引觀眾進場，全球票房已突破2.83億美元大關。


  該片在台也口碑爆棚，電影票房逆襲衝破2500萬台幣，片商今（12）日更宣布即將於本週

  三到五（5/14-5/16）限定回歸IMAX影廳。另外，由「水行俠」傑森摩莫亞、傑克布萊克

  主演的《MINECRAFT 麥塊電影》，上映後在全球掀起「雞騎士」熱潮，全球票房衝破9億

  美元里程碑，穩坐全球年度票房冠軍。


  狂破影史紀錄的新片《罪人》，是繼名導諾蘭《奧本海默》後，唯一一部使用頂尖技術「

  IMAX膠卷攝影機」拍攝的電影，透過這台攝影機才能拍攝出上下畫幅最高的銀幕視野，其

  中部份的電影鏡頭也使用寬度最廣的Ultra Panavision拍攝，讓觀眾能同時享受上下高度

  最大、左右寬度最廣的視野，完全沉浸在電影打造的1930年代氛圍。


  也讓《罪人》即便上映一個月，美國的IMAX場次仍一票難求，足見其IMAX規格的強大魅力

  。 導演萊恩庫格勒表示自己曾拍過改編真實事件、漫畫的電影，這次新片《罪人》想帶

  來新意，挑戰打造電影院前所未有的極致沉浸體驗。


  導演萊恩庫格勒找來《黑豹2：瓦干達萬歲》攝影師奥特姆阿卡帕夫合作，使用能最真實

  模仿人類視覺反應的IMAX膠卷攝影機拍攝，讓片中主角們面對未知恐懼的緊張感無限放大

  ，槍戰駁火動作戲也充滿震撼力，成果男主角讓麥可·B·喬丹驚嘆「畫面真的太美了」

  。女星海莉史坦菲德更直呼「這絕對是觀眾一生難得的體驗」。


  該片故事描述從大都市返鄉的雙胞胎兄弟，舉辦一場徹夜狂歡的音樂派對，沒想到隨著夜

  幕降臨，這場派對因門外的不速之客而變調。 《罪人》、《MINECRAFT 麥塊電影》現正

  熱映中，《罪人》將於5/14至5/16 全台IMAX場次限定回歸，詳情請洽各戲院。






  --'
