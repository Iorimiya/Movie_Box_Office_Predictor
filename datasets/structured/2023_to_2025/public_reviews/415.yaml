title: '[好雷] 罪人：這電影有點醉人'
content: "目瞪口呆，是我看完《罪人》的第一反應。\n.\n這部片實在太難歸類了 – 麥可 B.喬丹站在血紅背景前，海報乍看是典型的復仇電影；\n但看了預告才發現他一人分飾雙胞胎，時而玩世不恭、時而憤怒掃射，再搭配美國南方氛\n\
  圍的音樂酒吧場景，白人勢力悄然逼近的衝突預兆。看似有趣，但預告極度零碎的剪輯，\n卻隱約透露一絲違和感。\n.\n但這可是萊恩庫格勒的作品。從《金牌拳手》到《黑豹》系列，獨立電影出身的他早已證\n\
  明自己不只是動作片導演，而是能夠在主流娛樂框架中，精準植入文化脈絡與社會關懷的\n創作者。即便是他監製的《怪物奇兵：全新世代》或《猶大與黑色彌賽亞》，也都不約而\n\
  同地為非裔美國人的敘事發聲。\n.\n《罪人》則是他首部億級預算的原創長片。這次沒有 IP 加持，反而成就更狂放的世界觀\n — 黑人文化、藍調音樂、吸血鬼，這些元素在庫格勒的鏡頭下混搭，竟成為一杯醉人又\n\
  迷人的烈酒，成為近年最驚喜、也最難忘的觀影經驗。\n\n／\n\n雖然揉合眾多元素，但讓本片扣人心弦的，仍是角色的立體與情感的重量。\n.\n身為萊恩庫格勒的愛將，麥可\
  \ B. 喬丹一口氣分飾雙胞胎兄弟。史莫克講求原則、史塔克\n則浮誇灑脫，各自展現不同風格的魅力，儘管個性迥異，卻保有血脈相連的默契。\n.\n故事設定在 1930\
  \ 年代的密西西比，種族隔離嚴峻、三 K 黨猖獗，兄弟倆努力打造一間\n能讓黑人、亞裔與愛爾蘭移民等邊緣族群聚集的安全空間。而這間酒吧的靈魂，便是藍調\n音樂。\n\
  .\n最觸動人心的一幕，是一位老樂手講述年輕時被迫去警局表演、同行好友卻遭到栽贓處死\n的創傷。講完後，他拍起手、高唱藍調 — 無需煽情，就能把藍調「來自痛苦」的本質唱\n\
  進觀眾心裡。\n.\n新星邁爾斯卡頓飾演的山米，則讓藍調成為反抗與自由的代名詞。即便對藍調不熟悉，在\n片中聽他開口吟唱，也能被歌喉的純淨與憂傷打動。他不顧牧師父親的反對堅持演奏，甚\n\
  至遇襲後仍緊握吉他殘骸，面對凶險勢力與體制規訓都拒絕屈服，挺身用歌聲維護自己的\n文化與身分。\n.\n《罪人》延續庫格勒一貫的關注 — 內在掙扎、家庭連結與社會身份。即使前半段節奏偏\n\
  慢、對白繁多，但每段鋪陳都讓角色立體起來，也就更能同理他們後半段遭受誘惑與威脅\n時的選擇。\n.\n但本片真正的靈魂人物，無疑是打造配樂的路德維約翰松。這位曾以《黑豹》《奧本海默\n\
  》兩度拿下奧斯卡的新生代配樂大師與庫格勒再度合作，將藍調融合鄉村、電子、搖滾等\n不同時代的流行樂種，盪氣迴腸又振人心脾，好聽到出油。透過電影院的音場放送，觀眾\n\
  能真實感受到音樂本身的重量與召喚力，讓這部電影的混搭風格有了堅實的情感核心。\n\n／\n\n而讓《罪人》格局再提升一個層次的，是對「吸血鬼」這個獵奇元素的新穎解讀。\n\
  .\n片中的吸血鬼不只是吸血的怪物，而象徵壓迫體制的另一種形式：以「保護」之名接納弱\n者，卻要求他們放棄自我、抹除文化、遺忘過去作為被同化的代價。這不只是對美國社會\n\
  結構的諷刺，更是對極權文化下「集體意識」的反思。\n.\n因此，片中那間酒吧，便是這場集體誘惑的戰場。所有被主流社會邊緣化的群體聚集於此\n，當吸血鬼圍繞而至，這些被社會邊緣化的角色必須決定是否要保持自主、還是選擇被主\n\
  流「吸納」後，失去了原本的模樣。\n.\n這樣的雙重困境不僅適用於黑人，也包括其他族裔與階級邊緣人 — 在白人主流社會的遊\n戲規則中，誰都可能成為被犧牲的對象。因此，本片也跳脫二元的「黑白對立」—\
  \ 壓迫\n不僅來自白人，受害者也不限於黑人。\n.\n三 K 黨徒雖然極端，卻也反映底層白人如何在階級焦慮中，將仇恨投射到更弱勢的群體\n身上。提醒真正的問題從來不是個別族群的「邪惡」，而是整個社會何以陷入人吃人的局\n\
  面。\n\n／\n\n《罪人》最終的質問，是文化該如何保存？誰有詮釋的權力？\n.\n「白人喜歡藍調，卻不喜歡創造藍調的人」，這句台詞一針見血，點出藍調是非裔美國人\n\
  用血淚譜出的旋律，卻一再被主流文化欣賞、挪用、再定義。山米與史莫克最終的抵抗，\n便是對這場文化掠奪的回應 — 不願被轉化，也不再沉默。\n.\n《罪人》用吸血鬼的殼說著美國的骨。雖然類型混雜勢必增加行銷操作的難度、也可能嚇\n\
  跑一頭霧水的觀眾；但也因為執行得當的野心，證明類型片依然能承載嚴肅主題。愛極了\n結尾彩蛋的安排，返璞歸真音樂帶給人們的撫慰效果。在這個充滿速食敘事與公式娛樂的\n\
  時代，無疑成為讓人一聽難忘的靈魂樂章。\n\n更多影評推薦，歡迎按讚追蹤：\nbmtuYnBwbXd4\n\n--"
