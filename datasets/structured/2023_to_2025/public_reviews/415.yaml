url: https://www.ptt.cc/bbs/movie/M.1749149096.A.0B2.html
title: '[請益] 《罪人》中的一個小問題'
content: '微雷










  =================== 防雷頁 =================


  前半段愛爾蘭吸血鬼剛出現時

  跑到了一對人類夫妻的家中

  依影片給出的線索

  夫婦中的男人是3K黨首領的姪子

  夫妻屋中也有3K黨的服飾

  但我仔細看了

  並沒有"樂器"

  (吸血鬼沒帶，夫妻家中也沒給樂器的畫面)


  但之後在酒吧前出現時

  夫妻和吸血鬼來了幾段美妙的合唱和演奏

  所以是變成吸血鬼後

  突然就學會唱歌了?

  還特地去找了樂器...


  雖然這不是很重要的劇情

  但這一點

  害我在看到三人出現並拿著樂器唱歌時

  突然有一種這是不是音樂劇的錯覺?

  是不是只要變成吸血鬼就能唱得一手好歌?

  忍不住覺得好笑


  ---


  根據影片本身的解釋

  吸血鬼同化後可以獲得記憶和感覺共享，

  那初始吸血鬼似乎本身是個音樂人(鬼)

  所以或許被他變成吸血鬼可以獲得一點音樂能力

  但樂器上的技巧和唱歌天賦

  應該很難就這樣直接複製吧


  還是說那個時代的密西西比州

  人均音樂大師?


  --'
