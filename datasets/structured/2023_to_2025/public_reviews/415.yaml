url: https://www.ptt.cc/bbs/movie/M.1540043198.A.EE7.html
title: '[好雷]  檢方的罪人 觀後感'
content: '1.影片名稱 : 檢方的罪人


  2.觀影時間 : 10/20


  3.觀影地點 : 台南遠百


  4.觀影方式：自行購票



  選擇早場觀影品質果然不錯，


  否則週末很怕一堆嘰嘰喳喳的屁孩，


  或根本看不懂的小孩吵鬧影響興致…




  大概在半年前吧看過原作，


  說實在，這部跟推理真的沒什麼關係。


  因為早早就會告訴你答案了。


  而被說是燒腦……嗯……


  如果你覺得正義的思辨是一場燒腦運動那就這樣吧(聳肩


  總之覺得一些台灣的宣傳語有點莫名奇妙，


  拜託別誤導人用錯誤的方式打開作品啊……。




  而我自己在看改編電影時有個習慣，


  就是用電影歸電影，書歸書的心態來欣賞。


  所以心得上也會盡量避免用兩者的比較來做評價。



  以下有雷喔～～文長喔～～










  總結來說，這是一部出色的電影。


  bgm令人印象深刻，


  過了9hr到現在我腦裡依然奏響著二胡旋律。www



  搭上開頭一幕幕的城市倒影，


  似是象徵著兩種正義僅管一線之隔，


  卻將是完全相反的面貌。



  而演員的表現可圈可點，


  給了我期待以上的驚嘆。




  尤其是二宮和也。




  雖然預告片有稍稍閃過一些畫面，


  但實際欣賞時仍是被精湛的演技震懾住。


  沖野檢察官訊問犯嫌松倉，


  堪稱這部片的經典橋段。


  瞧那威壓的氣勢伴隨震耳的音量，


  飛快的語速交織辱罵的詞彙，


  看得大家氣都不敢喘一口。


  見他瞬間收斂客氣起來以為過了風頭，


  下一秒卻又再次翻臉爆發，


  這收放自如讓人看得讚嘆又過癮。


  然而如果只有二宮一人飆演技那也不過是無趣的獨角戲，


  所幸，飾演松倉的酒向當真是個鬼才。


  配合沖野的每一句怒吼，


  松倉崩潰似的回應與嚷嚷，


  把這場戲的精神壓迫感推向最高點。



  順帶一題，


  沖野模仿松倉用嘴「pa！」一聲的怪異舉動，


  據幕後訪問，是二宮的臨場發揮，


  連三次的模仿像是以其人之道還其人之身似的，


  讓檢方的訊問更顯高壓。


  這場戲很值得再三回味。





  雖然我日劇看不多，不熟悉木村和吉高的演技，


  但電影裡兩人也將各自的角色演的很不錯。



  吉高的檢察事務官是輔佐沖野偵查的角色，


  她也常常適時的在沖野不敢或不知如何說出口時提出偵查上的疑點，


  或是把沖野從檢方的預設劇本裡，甚至是


  崇拜最上的情緒裡拉出來，


  讓沖野能比較客觀的做出判斷。




  而最上毅，故事的核心人物，


  實力演出從執法者變成違法者的內心糾葛。



  當然以我自己的立場而言，


  殺人終究是不對也不該選擇的方式。


  只是當程序規定像座高牆擋在自己面前，


  牆外真兇仍愉悅的毫無悔意不受制裁，


  也不是不能理解最上那股不甘心的情緒，


  尤其被害者還是自己親近的人。



  究竟該堅守自己的職責維護法律規範的正義，


  還是服膺由人性由情感塑成的正義，


  沖野選擇前者，而最上選了後者。


  兩人的摩擦隨著故事進展更加激烈，


  直到最後彼此的質問，


  做得毫無意義的檢察官到底是誰？


  沖野不滿與扭曲的表情像在問著


  「曾經教我如何當一位好檢察官的前輩到底怎麼了？


  那位讓我十分尊敬的前輩去哪了？」



  而背過身去的最上，臉上留著被沖野反問的動搖，


  或許在那一刻他也無法說出一個肯定的答案了。




  松倉獲得無罪釋放後，


  最上仍緊抓一道原則，


  松倉只能讓法庭來制裁他！


  卻也不知是作為檢察官的底線呢、


  抑或是無限擴張的情緒正義呢…。



  只是松倉最後仍乾脆俐落的死了，


  沒受到法律施予的任何制裁簡簡單單的死了。



  諏訪部這一步很有意思，


  他想看最上的故事如何繼續下去，


  卻給了最上不想要的結局。


  那麼觀眾又會怎麼想呢？


  是「這是天譴，夕鶴！」呢？


  還是「沒讓他接受刑罰承擔應有的罪責，正義無法伸張！」呢？


  我自己也是第一次思考這個問題。



  尾聲最上找來了沖野，


  向他坦承自己正義的形狀。


  不理解便罷，不理解還能用自己的想像來看待對方，


  一旦理解了，理解卻又無法對話，


  理不清的是非對錯、自己堅持的原則、前輩所執的理念、


  在兩把劍的交戰中，


  沖野只能將一切矛盾的痛苦情緒，


  化成迴響在林中的陣陣嘶喊。





  不能動用私刑、不能也把自己變成殺人犯，


  規勸人人會說。


  然而一旦自己身為當事人，


  一旦自己握有能悄悄讓犯罪者繞過程序規定伏法的權力與資源，


  那條線你跨不跨呢？





  故事本身挺嚴肅的，


  好在劇裡也適時穿插一些輕鬆的橋段調節氣氛。


  調節擔當該屬沖野x橘這個組合了。


  沖野卸下檢察官的身份，就真的只是個純情男生。www


  進到摩鐵看到各種口味齊全的情趣用品，


  那個彷彿被打開新世界大門的震驚表情和反應


  ( ?  .— ? )!!!


  實在有夠可愛。wwww



  然後被橘一個主動初吻後，


  那聲「え？！ 」的完全狀況外，


  真的會讓人笑出來。XDD





  雖然除了主線命案外，還穿插了議員醜聞的支線，


  然而只看一次真的無法理解支線在講什麼，


  而爬了文才知道似有影射日本的右派政治勢力。


  對於第一次接觸故事的人怕是會和主線的資訊攪在一起吧><，


  而即便我自己先看過書知道主線在講什麼，


  還是會好奇支線的故事是否會同時和主線的一些小細節呼應之類的呢？


  這部真的需要至少二刷了。XD




  整體來說，劇情張力與節奏都控制的很到位，


  演員一個個實力演出，


  bgm和音效也配合的恰到好處。

  (我被那個墜樓巨響嚇到了wwww有嚇有加分！)



  結局對原作稍有更動，


  但我個人很喜歡電影的收尾方式。




  總之，這是一部很優秀的作品，非常推薦大家去欣賞！














  好的我冷靜。wwww


  以上，感謝大家閱讀。///w///



  --

  松倉那段否認犯罪就是在耍賴的嘴臉，憑著檢方錯把夫婦命案賴在他頭上，無罪釋放後就

  更囂張的說之前性侵少女的案件不是他幹的那也是檢警誣賴。

  這樣演只是在呈現松倉這人本性不改的惡劣，這種人卻能逍遙法外。/__\'
