url: https://www.ptt.cc/bbs/movie/M.1744821186.A.E9B.html
title: '[好無雷] 罪人imax特映心得'
content: '首先感謝華納邀請特映試片


  這齣算是我活30多年來看過最屌的恐怖片


  不是他真的多恐怖


  單純我沒想過電影劇情可以這樣編排


  他給我感覺就像電影版的鴛鴦火鍋


  什麼樣的元素都有，還他媽的都成立


  jump scare有


  家庭梗有


  感情梗有


  宗教有


  種族主義有


  超自然有


  不聽勸的智障有


  發神經的白痴有


  大場面有


  連音樂性都有


  笑點也有


  什麼都有


  真的就是過癮


  老實說我超級討厭jump scare


  每次jump scare都放那種早就知道的點


  不然就是很北爛的點


  但是這齣，我被嚇得心服口服


  冷不防直接往你臉上塞兩拳那種


  而且全演員演技真的自然又舒服


  而且劇情編排不拖沓


  主要角色形象塑造飽滿


  這齣個人主觀推薦等級為


  如果有人想去看，問我要不要二刷，我可以


  上串流我會二刷


  以上


  如果不愛恐怖片，想當爽片看，也是很可以


  讚讚


  --'
