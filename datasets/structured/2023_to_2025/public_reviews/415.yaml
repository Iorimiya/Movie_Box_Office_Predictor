url: https://www.ptt.cc/bbs/movie/M.1745097403.A.CD5.html
title: '[普雷] 罪人:至少音樂還不錯聽'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  本來標題想用另外一個的，不過看到版皇狠狠的制裁下去，就算了


  先說之前版友有人在說品味有高低，抱歉在下品味實在有夠低，真的看不出來這部片

  所有的隱喻，大概看得出想談種族主義，不過在這種前提之下，找一個中國人當腦殘

  隊友實在不是一個聰明的選擇


  對於藍調音樂不熟歷史的觀眾真的不友善，然後就算知道吸血鬼不是這部片的重點

  還是覺得前半段沒必要那麼長，麥可喬丹飾演的雙胞胎兄弟靠著做黑的致富，然後

  開一個屬於黑人的派對，中途被吸血鬼入侵，然後其實吸血鬼也很喜歡音樂，總

  覺得不管用什麼隱喻，在邏輯上都很難自圓其說，更不用說海莉史坦菲爾和麥可喬丹

  其中一兄弟在日出之後還沒有被燒死，直接切到靠近現代的時間線，實在令人感到

  費解，感覺是可以衝奧斯卡的片，不過一般大眾尤其對於種族議題不感興趣的話

  絕對是不推薦的


  --'
