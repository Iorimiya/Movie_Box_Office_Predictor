url: https://www.ptt.cc/bbs/movie/M.1744899304.A.EA2.html
title: '[好雷] 罪人 黑人、音樂、慢節奏'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  剛剛看完 沒看預告

  只看到麥克逼喬丹就進去了


  個人覺得不錯看就是節奏有點慢

  但整片時間線都在同一天

  因此還在可以接受的範圍裡


  隱喻或含意啥的不討論

  反正我也看不懂



  1.整片都是滿滿的音樂

  歌都很好聽 渾厚飽滿


  會一直唱歌

  但不會像小丑2那樣生理不適



  2.男主雙胞胎兄弟混黑幫衣錦還鄉

  回老家開店


  電影只用一天的時間線

  帶出了這一批老同鄉們的過去

  還有黑人社群的團結（？


  就連主角+9兄弟都很在乎他的鄉親們

  開槍打到以前的小弟

  還付錢給他找醫生 有情有義是我兄弟


  開店第一天就寧賠錢也要讓大家狂歡

  為何喝酒 為了消愁



  3.前半段看他們的故事挺有趣的

  但我猜有人會睡著


  後半段夜路走多了真的碰到鬼 吸血鬼

  以為會火力全開 結果也沒有

  整片都一個固定的步調

  不用期待動作戲



  4.全片著重在角色間的互動

  有帶出很多那年代的黑人們的故事


  「白人不准進黑人場子

  就算他們帶著善意也一樣


  如果不小心有人打翻酒呢？

  有人踩了他們的鞋呢？」


  這一段印象超深刻

  短短幾句道出了時代

  也帶出了主角兄弟很看重自己的社群


  5.片子140分有點長

  看到後來會覺得不過癮

  想看更多主角雙胞胎啊

  想看更多他們的故事和人生


  至於驚悚嘛 應該沒有

  恐怖嘛創意嘛 普普通通

  那麼高評分大概是美國人很有感觸



  6.應該沒有需要去imax的地方

  我看的是普通版的就是了



  7.結論嘛


  劇情片，而且很吃電波

  喜歡看小人物（？）的故事的推薦


  至於宣傳的什麼超自然動作片啦

  驚悚恐怖啦 通通都是點綴用的而已


  另外喜歡黑幫耍狠的也可以看看

  男主角這部很帥

















  -----

  Sent from JPTT on my iPhone


  --'
