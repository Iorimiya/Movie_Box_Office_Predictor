title: '[微雷] 歷史並未翻頁 靈魂沒有安息《罪人的控訴 '
content: '歷史並未翻頁，靈魂沒有安息—《罪人的控訴》


  文／邱慕天



  74歲的義大利退休車間工人柯里尼自1950年代以來一直在德國居住，這天他闖進85歲富商

  漢斯‧邁耶的豪華酒店套房，強逼下跪後往他身上開了4槍，並在死者的頭骨上反覆踐踏

  ，直到腳踏的靴子都變形、連自己的腳指都踢折了。


  他被捕時，喃喃地說道「成了」。沒有人知道他的殺人動機。一名菜鳥律師被指派為他辯

  護。卡斯珀‧萊寧，熱血而理想主義，想要打好人生第一個案子。


  但他的被告人什麼都不肯說，一心求死。


  一開始就知道犯罪和殺手，但背後動機卻是巨大的謎團。《罪人的控訴》改編自德國律師

  作家費迪南‧馮‧希拉赫（Ferdinand von Schirach）暢銷小說《誰無罪》，精心編排的

  情節，沒有任何特技或渲染；用前15分鐘令人震驚和不安的開場，為觀眾展開一個在2011

  年出版的當年度，震動了德國司法改革程序的轉型正義寓言。


  轉型正義的故事

  二戰時，德國人和同盟國經常開槍射擊平民，以報復佔領地的人民起義。讓人更加不寒而

  慄的是，納粹德國為此殺戮建立了一個精緻有序的哲學和系統，讓一切都能「依法辦理，

  謝謝指教」。


  1941年，希特勒將標準定為每1名德國軍人遭殺害，就要100位平民償命。這不是「殺一儆

  百」，也不是「百倍奉還」，因為我們根本找不到隨機的100位平民與德國軍人的關係。


  直到大約60年後，我們才知道這個問題困擾著一個名叫柯里尼的義大利男子（法蘭柯‧尼

  洛飾演）。一生困擾著。原來他成長在那場屠殺發生的一個村莊，與60年前在他眼前被殺

  害的一位平民，有著特殊的關係。


  他的人生，從那一刻就被強制註定了命運的走向。


  用人生寫小說

  原著作者馮‧希拉赫曾是德國最傑出的辯護律師之一，但他在中年脫下律師袍轉成小說家

  後，如今又被譽為成為德國最傑出的作家之一。優異的邏輯和法庭的實戰經驗，馮‧希拉

  赫過去手下案件為原型成功創作了頭兩部短篇犯罪懸疑小說，僅在德語國家就銷售破百萬

  冊，在全球翻譯成32種語言，自2009年在德國書榜上人氣不墜。


  《誰無罪》繼承了犯罪與懸疑的特色，但情節內容轉向了馮‧希拉赫自傳式的歷史尋根與

  靈魂探索。作為「馮‧希拉赫」家族的一員，他就像在在台灣的蔣氏後人，自出生起就背

  負著一個染上政治血色的姓氏。他的外公是希特勒的御用攝影師。他的祖父鮑爾德‧馮‧

  希拉赫更不僅是納粹的一員，還是希特勒青年團的團長；在紐倫堡的戰爭審判中被控危害

  人類罪，最終被判處20年徒刑。


  歷史血緣尋根

  馮‧希拉赫曾於2011年在德國《明鏡》週刊上撰文回憶自己得知祖父身份的那個場景，「

  那一年我12歲。我在歷史書上翻到一張他的照片，註記是『希特勒青年團的領導人鮑爾德

  ‧馮‧希拉赫。』」


  這位「律師轉小說家」無法理解，他認識的祖父，一位有品味高雅、博學多才的儒紳，怎

  能在18歲見到希特勒之後就從此擁抱納粹思想？維也納歌劇院演奏前排的座上賓，怎能一

  邊接受古典藝術的薰陶，一面下達將奧地利猶太人從維也納中央車站送往集中營屠殺的冷

  血軍令？


  馮‧希拉赫後來研究了紐倫堡審判，以試圖了解納粹大屠殺的背景。研究的成果，化為他

  筆下的漢斯‧邁耶——《罪人的控訴》裡那位慈祥的長輩、成功的商人、國勳的受獎人、

  菜鳥律師萊寧生命的貴人，但也是那位隱姓埋名了的冷血軍官、施行恐怖時要有悠揚古典

  樂伴奏的納粹屠夫。


  堆疊人倫重量

  《罪人的控訴》從菜鳥律師萊寧的主觀視角，將多維人倫重量堆疊在劇情中。不單要為「

  手染鮮血的罪人」辯護，那些血跡還指向對他有再造親恩的義父、是他一介移民之子成為

  律師如今出人頭地的貴人、自己青梅竹馬伴侶的親爺爺。


  一句「你明明知道我爺爺是什麼樣的人」，道出了馮‧希拉赫親身被歷史加諸的生命困頓

  ，也讓萊寧恨不得從案子中拔腿抽身。但不僅如此，萊寧還在開庭前遭遇到對手檢方的律

  師，是自己大學時仰之彌高的刑法學教授、在德國法界泰斗般的地位。教授激他膽怯、情

  感用事，「如果要為自己的怯戰找理由，你下個案子、下下個案子，還會找理由。就再也

  別告訴我你想當辯護律師。」


  因為不像金髮碧眼日耳曼人的髮色和五官，萊寧走在哪都會一眼被認成1960年代大量移居

  德國的土耳其客工後代。這也給德國「喜劇票房金童」埃利亞斯‧穆巴里克（Elyas

  M''Barek，實為突尼西亞與奧地利混血的移民二代）添了親身成長經驗的代入感：


  面對那隱隱袒護本國本族人的種族歧視、想要掩蓋歷史瘡疤的德國民族自尊心，他必須在

  能力和價值觀上證明，自己的信念與德意志國族靈魂棄存揚升（Aufhebung）的辯證目標

  一致。在這個目標面前，他必須將義父、恩師、情人、時勢、制度現況象徵的所有攔路大

  石一一擊碎。


  真理的法槌

  天堂，有嗎？正義，是人類能達到的嗎？萊寧鍥而不捨地追尋，通往那個目標的景象，從

  彩色、到黑白，到剩下混濁的灰色。原來以為十惡不赦的殺人兇嫌，竟背負著整個不公義

  帝國機器的隱形十字架；而原來一生載譽社稷、功在黨國的善商，卻要硬生生在蓋棺前被

  揭露出猙獰面容、遺臭萬年。萊寧你可知道，法律，真是一點也不美麗、一點也不浪漫呢

  。


  導演用高超的運鏡和配樂表達這份心境推移，將萊寧和柯里尼推到了同一條船上。惜字如

  金的被告，在囚房會客室一根菸底下，終於釋出自己壓抑一輩子的情緒重量。當完整真相

  被戳開、當原來那位刑法泰斗，自己就是袒護納粹法案的制度工程師之一和歷史見證者，

  整個情節的聚焦，引導觀眾來到終審量刑的判槌。


  《罪人的控訴》讓人餘韻無窮的，就在它堆疊了高張力的法庭辯證之後，神來一筆轉折，

  將結局安置在超越司法的恩典與希望。


  電影導演將小說刻畫的場景搬上螢幕，畫面的每一個角落，得以在無聲之中繼續向我們說

  故事：二戰殺戮的「過去」與繁榮承平的「現今」交互穿插；西裝革履道貌岸然的公堂，

  與陰暗死灰的囚牢交互對應；從義大利純樸鄉間小鎮小柯里尼天倫破碎時的瞳仁，看見華

  麗酒店落地窗上的映射－那將一生復仇殺意灌在槍口的74歲憔悴歐吉桑。


  一切僅為最忠實地還原一甲子前的暴力；一切僅為說明：歷史並未翻頁，靈魂沒有安息。


  未竟的轉型正義

  德國是以基督新教為主的國家、宗教改革的起源地，義大利是天主教重鎮、也是歷史上教

  廷的所在地。兩套神學思維推演的公共治理結構，也不相同。影片無須言明地在邁耶的追

  思禮拜，預備了德國新教教會場景和唱詩班；與柯里尼有關的一切，則寫實寫真地浸潤於

  天主教信仰的符號。


  務實理性的新教德國，在「柯里尼」案後將竭力將精神文明的懺悔，落實在秩序結構的重

  建修復。德語有個專門長字詞 vergangenheitsbewältigung，講述此一「溯往翻案」的

  國家工程：既然時間不能倒退、劇本無法重來，但求亡者的生命、前人的錯誤，成為踏腳

  的動能、改革的根基。未竟的轉型正義，德國人用工作與實踐，體現上帝的心意。


  但在天主教的義大利家鄉，被屠殺的村鎮，6、70年毫無開發變化，時間在此停滯了嗎？

  除了一些花、神父、麵包和葡萄酒、入了土的和牆上紀念的。在舉杯坐看一切的萊寧，心

  中如釋卻又像還少了些什麼。椅子腳下忽然絆到一顆足球，嘗試用腳滾動它，歷史竟也開

  始滾動。那顆球滾向視線的遠方、滾向眼淚匯聚的水塘、滾向撫平傷痛的希望、滾向永恆

  的家鄉、滾向罪疚被主恕宥的天堂。


  --'
