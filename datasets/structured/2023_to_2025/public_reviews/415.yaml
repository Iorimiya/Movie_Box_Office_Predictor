title: '[好雷]Sully薩利機長-英雄與罪人一線之隔 '
content: '因為看了很有感，第一次在電影版上發文


  薩利機長這部電影是以2009年全美航空1549號班機迫降哈德遜河為主軸。

  導演Clint Eastwood執導過不少電影，就像是近期的“強‧艾德格”、

  “美國狙擊手”等描述人物的電影，本片以較多的片幅刻劃機長的心境及經歷。






  以下有雷













  搭飛機不是我能經常體驗的，所以每次的起飛都讓我印象深刻。

  片中多次以墜機畫面表現機長內心的創傷，總讓我想到飛機起飛時緊張的自己，

  更何況是迫降時機上的所有人，他們在那當下所受的驚恐。

  乘客、乘務員、機師們，在當下能夠守住自己的責任使全員生還是多麼不容易。



  這部片的時間軸從飛機迫降後機長準備接受美國運輸安全協會調查開始。

  當時，所有媒體、民眾、乘客歡欣鼓舞的慶祝全員生還，

  另一方面機長卻必須面對調查，檢討疏失。

  隨著時間推進，安全協會依據不夠完整的資訊認為機長決斷錯誤。

  會議後機長也一度懷疑自己的記憶是否出錯。

  面對大眾時須維持一定的形象，內心卻懸著一根針。

  萬一被證明是判斷失誤，人生後續將就此毀滅。



  「我開了四十幾年的飛機，成敗卻只在這208秒。」



  一句話道盡他的無奈。



  除了對機長心境的刻畫，片中也帶入了航管員、空服員以及乘客的處境。

  航管員在盡力的協助機長後，還是不願相信機長選了一個沒人成功過的選項-迫降河中，

  因此他自責的落下了淚。

  空服員在確定要迫降後盡責的指示所有乘客完成迫降預備動作。

  乘客則表現了對於家人的擔心。



  片中也以一些片段來描述機長的經歷進而帶出他的核心思想


  ---絕不放棄控制飛機---


  看過了這些經歷，我們瞭解到機長的沉著不是沒有來由，

  這些都是經驗累積的成果。



  安全迫降後機長並沒有因此放心，他在快沉沒的飛機上確認沒落下任何人才離開，

  上岸後還是心繫著乘客直到確認人數。


  全片的高潮在片尾的聽證會，機長道出除了機器沒人能在第一次遇難就馬上反應，

  連模擬飛行也練習了十七次才成功降落備用機場(全戲廳都笑了XDD)。

  因此必須考慮當下時空人事物的狀況來評斷是否為人為失誤。


  最後證明，若非機長沉著冷靜、富有經驗以及技術純熟，飛機不可能安全迫降，

  機長總算露出安心的神情。



  值得推薦的一部，建議喜歡看演技的人可以去看看。


  --'
