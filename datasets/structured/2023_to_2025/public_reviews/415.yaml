title: '[微妙雷] 罪人 黑人新派鬼片風格'
content: '昨天in89看 全場只有三人 大概是快下檔了


  其實我有點不知道要判他好還是不好 因為它近寫實的風格 背景設定真的是不錯 拍的也蠻

  精細 沒有什麼破綻 這是好的地方


  不好的地方是 感覺劇情有點平 沒什麼爆點 大概只有一兩個Jump scare稍微嚇到 收掉最後

  的王 好像也沒什麼大爆點 蠻平淡的


  比較大的問題 是吸血鬼強度 在進屋之前感覺那麼強 但是在一群吸血鬼衝進屋子後 感覺就

  蠻廢的 整個垃圾殭屍化 本該可以秒殺的反倒被反打 邏輯上不可思議


  然後感覺角色我有些分不出來 像是吸血鬼王一開始我跟第一個男吸血鬼我都分不清楚 主要

  主角群外的黑人看起來也都差不多


  這個吸血鬼感覺應該是美洲本土的 因為提到搶走我們土地的給他們背聖經 大概是印第安惡

  靈 不吃聖經這一套也合理 不過黑人護符卻可以有用 也是蠻奇怪的


  中間那段超時空歌手 實在是蠻跳痛的 不過最後能跟吸血鬼聊聊 倒是蠻特別的片尾彩蛋


  整體要稍微了解美國以前的民族狀況 特別是美國的部分 是可以一看的 但如果是想看個吸

  血鬼片大戰來消遣 這片可能不太到位


  ----

  Sent from on my Google Pixel 4a


  --

  我改一下

  那我再改改'
