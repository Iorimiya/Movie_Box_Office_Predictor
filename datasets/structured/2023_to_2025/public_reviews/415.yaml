url: https://www.ptt.cc/bbs/movie/M.1745290894.A.029.html
title: ［普雷］罪人-異文化的時代情懷
content: '看到板上說音樂讚，還有吸血鬼殭屍什麼的我就去看了。內有大雷。


  先講優點：

  音樂很讚，雖然不是像迪士尼那種我回家後會找來聽的音樂，但配合電影環境，十分令人

  享受。

  久違的看到吸血鬼片出現與死而復生的親人交流而產生的掙扎，雖然是老調的劇情，但是

  我意外的沈浸。


  再來說點感想：

  覺得這部片的主題是壓抑。比起華人女崩潰讓吸血鬼全殺進來，兄弟倆算完帳發現農場主

  的兌換券不久後將會掏空（不確定這個用詞正不正確）他們的財產那段更令我感到絕望。


  雖然史弟（原本想叫他小S XD）跟情人在結局出現時，我對他們的苟活、不負責任感到不

  屑，但是他們的感情問題總算在新的世紀得到了解放。還有他們說要提供給主角選擇時我

  真的緊張了一下XD


  覺得吸血鬼象徵恐怖主義，畢竟帶原者是個愛爾蘭人XD


  有些看不懂的隱喻，那些文化象徵可能要對藍調熟悉才會理解？比如說為啥主角的吉他上

  面鑲嵌的金屬盤疑似是銀？還有響尾蛇是不是代表了什麼？

  另外我從某些作品看來的偏見讓我覺得，這部藍調電影的火車要素不夠充足XD


  這部片的性愛場景挺多的，雖然史哥的對象略龐大，但還是比某個10/10神作還要好（對

  不起我想起那段自己噁了一下）


  接著說缺點、槽點、笑點：

  有幾次很粗糙的剪接，感覺在麥塊電影也有看到，該不會他們丟給同一個AI剪吧？

  氣氛很沈浸不錯，但是太沒刺激了，好幾次快睡著。

  看到巫毒醫生對吸血鬼那麼熟悉總有種跑錯片場的感覺XD 不過德古拉成書在電影背景50

  年前，這麼想還算可以接受。

  把不明死因的屍體丟出去再玩個狼人殺，結果發現沒有狼，被扔出去的老兄從醉死醒來後

  被吸血鬼嗑掉，是我整部片笑得最開心的時候XD 後來伸個懶腰爬起來更是讓我再爆笑一

  次XD

  華人女崩潰把吸血鬼喊進來以前我還以為會讓史哥先佈陣一下，比如說亂丟些燃燒彈…雖

  然感覺可能也沒啥用。

  吸血鬼成分還算滿意，但是殭屍部分就有點弱了，感覺只有帶原者比較強一點。


  總地來說我算是喜歡這部片，但是我不會想看第二次。倒是這部有黑人又有吸血鬼，讓我

  很想把刀鋒戰士找來看XD


  回應留言順便補句：

  他們那個地方叫三角洲，是飛哥與小佛那個三角洲嗎XD 我看到一半想起這點的時候忍不

  住哼起「杜芬舒斯博士的邪惡企業～」XD


  --

  感謝你跟N大解釋～其實有用銀也是很懸，畢竟兄弟倆的父親應該也是窮人

  看到+9爽過就是不太爽XD 但是他們的感情終於能歸屬於彼此這點也略感欣慰

  我也以為哥倆是惹到吸血鬼，他們一開始都神經兮兮的

  我覺得他講述的故事配合他及時行樂的個性挺立體的

  探險活寶有個吸血鬼沒被邀請進了房子就化成灰，我一直期待電影裡重現這幕XD'
