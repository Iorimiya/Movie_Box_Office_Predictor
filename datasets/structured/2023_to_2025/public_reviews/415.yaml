url: https://www.ptt.cc/bbs/movie/M.1744991100.A.1A2.html
title: '[微好雷] Sinners罪人 imax 特映'
content: '抽到特映

  沒有看任何預告或是劇情介紹  只知道是麥可·B·喬丹主演

  先說結論還不錯看  不錯的爽片 聲光效果也蠻好的

  正片之前是會計師2的預告  場面看起來好像還可以


  時間線是解放奴隸制度後經過世界大戰後的時代

  開場介紹歌者/吟遊詩人聲音的力量

  主角堂弟Sammie就有一副藍調嗓音


  前段在講Smoke Stack  Sammie的背景

  到從3k黨白人手中殺價買下舊木材工廠開始準備進入正戲

  這裡感覺有點bug1 Sammie跟他老爸說要去演奏 隔天禮拜會趕回來

  之後的劇情看起來跑了超多地方玩大地遊戲  一天回來超猛

  同上因為時間匆忙

  Stack載堂弟Sammie去找樂手Slim跟其他幫手

  火車站鬧區巧遇前女友Mary   Sammie邂逅人妻

  Smoke去鬧區找周跟他老婆Grace作招牌張羅石材等

  這中間殺價蠻有趣的

  (可以看到Smoke比Stack有商業頭腦)

  也去看了前妻Annie並找她做菜跟幫忙做菜

  帶出Annie有一些巫術背景


  同時吸血鬼(紅眼-原生?)出場

  被印地安人人(忘記劇中正確名是啥)討伐中

  紅眼逃到一戶人家用金子誘惑成功也順便補充HP

  當然這夫妻就變晚餐  也簡單對吸血鬼作設定（設定上有條件弱化）


  晚上酒吧開張 Sammie靈魂藍調的歌聲

  吸引了過去未來各種靈魂穿插派對中  這邊聲光效果還蠻讚的

  吸血鬼來要飯開啟B級正片高潮時刻 Mary先中標  送走客人變大餐

  幾個搞笑橋段蠻好笑的

  1 玉米尿尿跟後來要進門

  2 路人?倒地被主要人物撿屍去外面真

  3 主要人物吃大蒜  人妻跟瘦子搞笑


  Annie推敲不是惡靈猜到是吸血鬼並且如何防範

  紅眼這中間有些話好像是愛爾蘭語?

  說Sammie的歌聲能幫他怎樣帶回族人還啥  忘了

  然後Grace說紅眼有說中文說要去雜貨店

  (奇怪怎麼印象沒聽到中文bug2)印象紅眼是說愛爾蘭語之類


  Grace借酒裝瘋>>>壯膽講了關鍵字

  這邊看戰力主角群正常應該要全滅了bug3  不過B級爽片就算了

  奇幻B級大戰後  後面又B級了一個要素槍戰  很可以

  彩蛋又拉回主軸Stack跟Mary嘻哈登場  並做了總結


  --'
