url: https://www.ptt.cc/bbs/movie/M.1745084290.A.85F.html
title: '[普無雷]  罪人 滿分音樂配上低能劇情'
content: '看完可以理解這部片為什麼這麼高分

  但同時也覺得我的觀影體驗其實蠻普通的

  反對的聲音少在那邊給我什麼我是因為看不懂才覺得不好看


  劇情實在太薄弱了

  整個都圍繞一個鄉野傳奇 前後還沒什麼呼應

  甚至有一大段都覺得很冗長

  後面該高潮的地方也不夠爽

  很多該稍微解釋的背景也沒有說明

  說他是恐怖片一點也不恐怖 爽片也不爽

  用劇情片來解釋又很薄弱


  已經可以預見過幾天有幾個Youtuber會用各種角度來解讀這部電影 說他有多好

  用黑人文化 自由主義 那些恐怖劇情的背後含義

  一想到這些過度解釋的東西就覺得蠻智障


  但我才懶得管他背後意義有多深厚

  劇情就真的太普通 讓人很難融入

  拍的也是普普


  就真的是音樂很棒 Ludwig Göransson真的屌

  演員也不錯


  看完就覺得 恩 還可以 但不會想再看一次

  以上


  --'
