title: '[討論] iTunes特價 醉後末日/大白鯊/檢方的罪人'
content: '【2022/11/08 iTunes 特價報】

  醉後末日／刺客密令／大白鯊／紫屋魔戀／綁架影帝黃晸珉／檢方的罪人／政客誠實中

  ／電影版怪物彈珠：空之彼方

  －

  今天的$90推薦血腥冰淇淋三部曲的最後一部《醉後末日》，賽門佩吉飾演一名想與好友

  重溫年少時光的中年人，再召集大家回到故鄉後，卻被捲入一場可怕的事件。劇情在超展

  開的旅程中對每個角色的背景故事抽絲剝繭，和前兩部一樣都是披著災難片皮的深度喜劇

  故事，沒跟到之前特價可以趁這次入手。

  －

  $150的部分則是有Maggie Q、米高基頓和山謬傑克森主演，2021年上映的動作片《刺客密

  令》。$190則有《大白鯊》和《紫屋魔戀》兩部經典作品。其中大白鯊雖然曾經特價到更

  低，但也是一年前的事了，這次的優惠算可以考慮。

  －

  最後我們這次也整理了多部日韓好片！翻拍中國警匪片《解救吾先生》的韓國電影《綁架

  影帝黃晸珉》，改編自2004年吳若甫綁架案，由黃晸珉在劇中演出自己遭到綁票的劇情，

  精湛的演技是這部片最大的看點。日片方面則有不少動畫作品，包括知名ACG改編的《電

  影版怪物彈珠：空之彼方》和《死亡筆記本：決勝時刻》，劇情片也有木村拓哉主演，知

  名推理小說改編的《檢方的罪人》，類型相當豐富，給喜歡日韓電影的朋友們參考。

  －

  以上，祝大家看片愉快！

  －

  未特別註明 畫質皆為 HD

  4K = 4K 畫質

  HDR = HDR 動態範圍支援

  DV = Dolby Vision 動態範圍格式

  DA = Dolby Atmos 全景聲音效支援

  EX = iTunes Extras 額外內容 （不一定均有中文字幕）

  －－－


