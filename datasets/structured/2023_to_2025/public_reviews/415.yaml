url: https://www.ptt.cc/bbs/movie/M.1745650049.A.278.html
title: '[雷] 罪人-後段讓人問號'
content: '先說整體劇情中的優點

  前段描述的不錯

  而且前段用的梗也算幽默，讓人小笑一下

  唱歌的音樂也不錯聽

  海莉的臀型真地漂亮內（誤）


  整部劇滿分如果100，我給62分



  但缺點就滿多的了

  缺點分三部份

  （以下為雷）


  （防雷）
















  描述兩兄弟的部份，其實很模糊

  如：


  （一下說爸爸會家暴，一下說是海莉的媽接生和照顧，描述的很亂）


  （曾當過卡彭的手下和美軍士兵，但又說錢和酒是騙來和搶來？那錢是搶自誰也沒講，酒的

  來源也很模糊）


  （另外不確定是否是翻譯的問題，因為今天進場看時，後面阿北的賴一直叫，干擾不少，被

  他老婆罵了才關掉）


  吸血鬼的部份：


  （吸血鬼被印地安人獵殺，可是印地安人是怎麼獵法也沒講...）（吸血鬼不是歐洲的產物

  嗎？照理說怕也是怕「基督教」的「東西」吧？）


  （吸血鬼怕銀、聖水我理解，可是那個華人夫婦人身上的十字架卻不怕？還可以跟著念經文

  ？然後可以踩進水裡？）


  （吸血鬼過於乎強乎弱，而且為何吉他打到時會有反應？）



  整體來說，前期很特別，中期唱歌很棒，後期我很多問號....而且最後的最後為啥還一副老

  友相見歡的怪況？！？？






  --

  初見悠攸心自顫，彼此驚魂情意牽。

  玉峰雙媚柔姿潤，痛憶當年步難前。

  友言吐慕孤忍讓，妳心無寄徒空然。

  七載悔思當日事，夢回常鎖玉容間。


  --'
