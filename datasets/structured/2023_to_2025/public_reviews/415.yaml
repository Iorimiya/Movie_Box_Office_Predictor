url: https://www.ptt.cc/bbs/movie/M.1539444736.A.153.html
title: '[好雷]檢方的罪人'
content: '人生第一次抽首映

  就獻給這部

  雖然現在韓劇正夯

  韓流明星當道

  但總有一群人死守著過去日劇的光輝時代

  那段日劇combo難以忘懷的青春歲月

  我想我是其中之一吧


  啊 話不多說進入正題吧


  電影消息一出

  光是木村拓哉再次扮演檢查官角色

  就足以讓人興奮

  合演的是在來自硫磺島的信讓人驚艷的二宮和也

  衝著卡司就值得一看


  和HERO的熱血正義不同

  本片相較起來寫實得多

  木村飾演的最上檢察官 不僅是明日之星

  收集法槌的癖好顯現出他對正義的執念

  一直影響他的是大學時期當議員的好友

  以及他所愛慕卻遭人姦殺的由季


  一場命案 讓當年犯案卻無從定罪的犯人松倉再度出現

  最上藉機想定松倉的罪

  甚至不惜捏造證據

  並和黑道合作冒險誘殺了真正的犯人

  以明其義


  而二宮和也飾演的沖野則在整件事都執著於真相

  在和松倉偵訊的戲是整部片的高潮

  沖野因為松倉對由季案的自我揭露而情緒失控

  讓人驚嚇的是檢查官對犯人的偵訊竟可到此程度

  最後松倉從最初的一臉不屑轉變為害怕喊媽媽的景象

  也暗示著案情另有發展


  最後沖野離職 甚至幫助了松倉打贏官司

  在一場律師事務所為松倉召開的慶祝會

  沖野只想道歉

  卻因之前的偵訊 引發松倉憤而離去

  最後遭人謀殺慘死街頭

  突有不勝唏噓之感


  覺得這部片有太多議題要探討

  對於正義的想法

  法律的追溯期是否合理

  還有政治和律政體系的互動


  而木村這次飾演的角色不像過去有如神一般

  總能對所有問題迎刃而解

  縱使精明幹練

  但在殺人時會感到噁心

  開槍前的緊張 和開槍時的驚慌失措

  用盡心機的角色塑造是十分立體的


  如果說HERO,是檢察官的烏托邦

  那麼檢方的罪人則是一面供人自省的銅鏡

  久利生公平曾經說

  唯一能全然替被害者著想的 只有檢查官啊

  顯然最上被仇恨所左右

  若是這兩人在平行時空相遇

  將會如何？


  喜歡HERO的人對這部是不會失望的

  八鳩智人 松島豐的出現絕對讓你們想起HERO的調調

  總之 這部片個人以為值得一看

  歡迎看過的版友一起討論喔


  --'
