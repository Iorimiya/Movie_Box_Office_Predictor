url: https://www.ptt.cc/bbs/movie/M.1767493886.A.6B4.html
title: '[好雷] 罪人'
content: '防雷




























  我終於知道為什麼這部電影這麼得人心

  我明明不是在看爽片,看完了卻覺得爽快

  這種情緒我會解讀成我能理解部份想表達的

  罪人兩字簡單卻深遠的對每個角色指名道姓

  在那個保守又歧視橫行的年代,隨便都會被視為罪

  不必多說,前面就是妥妥的歷史背景

  中間漸漸發酵,最後數盡所有人的罪

  吸血鬼本身根本就不算什麼,重點在於他們的象徵

  跟白人喜歡藍調卻討厭創造的黑人呼應

  應該是說這部電影的每個安排都互相呼應彼此

  環環相扣的程度也是精彩所在


  原本想給超好雷,不過後面收拾3k黨反倒沒那麼喜歡

  有種為了爽和政治正確拍出來

  雖然我也樂見種族歧視敗類被殺啦（口嫌體正直

  我一開始也不知道為什麼吸血鬼不直接攻進去

  後來才知道邀請這個設定的由來

  吸血鬼說中文那個到底是什麼？？？

  完全不像是我聽過的任何中文方言啊

  有些點小可惜啦,但根本不算什麼

  也有幸能看到彩蛋,除了最後放山米生路有點出戲

  （可能我對吸血鬼印象就是毫無人性

  的確也給作品更多詮釋空間,非常畫龍點睛

  他的確值得去電影院看,即時說這句已是放馬後炮


  ----

  Sent from  on my Samsung SM-S9280


  --

  我見過...你們這些人不會相信的事

  我目賭在獵戶座的邊緣著火的攻擊艦

  我看見C光束在湯豪色星門附近，在黑暗中閃亮著

  所有這些時刻都會消失...於時間中，一如眼淚...消失在雨中

  死期到了


  --'
