url: https://www.ptt.cc/bbs/movie/M.1749410683.A.F68.html
title: '[討論] 黃衣小飛俠-山忌、罪人觀後心得'
content: "周末看了兩部電影\n\n欣欣秀泰 黃衣小飛俠-山忌\n松仁MUVIE CINEMAS 罪人(SINNERS)\n\n\n雖都只是看過預告隨機選片，但發現兩部內容頗有相似處\n\
  都借助鬼神之力，襯托出情感戲的故事主軸\n\n黃衣小飛俠比較偏小情小愛，對逝者的自責、對愛情的堅持\n雖然故事沉重，但可以感受到對愛情付出的甜美\n\n而罪人則蘊含整個種族的苦難\n\
  透過吸血鬼、音樂這些設定，演出黑人選擇尊嚴 或是妥協的心境\n\n\n我比較喜歡罪人\n罪人的成本是9000萬鎂，黃衣小飛俠沒有查到\n雖然戲路格局不同，但還是可以相互參考\n\
  \n1. 罪人的鋪陳比較久，可以體驗氛圍營造感，實際演出早起顧棉花田、種族歧視等\n   日常，吸血鬼則是中間才出現，我覺得黃衣小飛俠在山難或傳說的內容可以著墨\n\
  \   更多，醞釀更多怨氣的感覺。\n\n2. 黃衣小飛俠中間破案過程蠻刺激，包含招魂儀式、宮廟求師傅驅邪等等都很精彩\n   想看到更多，反而罪人裡面吸血果跟印地安人比較沒有帶到。\n\
  \n3. 很特別的是，黃衣小飛俠應該是比較實際的演出，例如緊張、頭暈、有氣無力的\n   聲音，但是對觀眾來說卻不怎麼有吸引力；反而罪人危急時卻還搞笑(嚇到挫屎)\n\
  \   這種不合理的演出在對的時間點似乎比較耐看。\n\n4. 兩個都不太恐怖啊\n\n\n以上個人心得很多廢話抱歉~\n\n\n--\n\n莫聽穿林打炮聲 何妨淫笑且徐行\n\
  \n--"
