url: https://www.ptt.cc/bbs/movie/M.1745160689.A.5F7.html
title: '[請益] 有雷，罪人片末一幕'
content: '防雷














  在《罪人》最後幾幕中，跟吸血鬼大戰後，倖存的雙胞胎之一在最終決戰時腦海中出現了幾個閃回畫面。


  我不太確定自己是否理解正確，但雙胞胎領帶帽子一藍一紅讓我有這樣的想法，似乎是這樣的：


  真實的情況下，雙胞胎曾經包下了一間工廠，並雇用了一群黑人與他們一同工作。


  在這間工廠裡，他們過著幸福快樂的生活，應該是在製作捲煙。


  然而，當初將工廠賣給他們的那群白人——可能是3K黨成員——後來帶著一群白人回來，企圖殺害他們。


  這時，倖存的雙胞胎醒來，拿出他當兵時使用的狙擊槍和散彈槍，一人將這些白人全部殺光。


  我想請問，真實（藍色）的是雙胞胎包下工廠帶領黑人一起重新生活，卻被白人3K黨屠殺。


  而吸血鬼屠殺黑人是他幻想以吸血鬼包裝的記憶（紅色）。


  我的理解是否正確？

  -----

  Sent from JPTT on my iPhone


