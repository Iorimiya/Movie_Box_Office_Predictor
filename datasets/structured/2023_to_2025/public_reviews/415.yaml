url: https://www.ptt.cc/bbs/movie/M.1747411453.A.161.html
title: '[討論] 罪人的疑問?'
content: '先防雷一頁...
























  1. 第一個吸血鬼是怎麼登場的? 怎麼會從天而降??



  2. 酒吧停止營業的時候, 為什麼就這樣放大多數人回家?


  竟然沒被外面的吸血鬼攻擊??


  那些少數人又是為甚麼要關在一起? 一開始大家各自回家就沒人犧牲了???




  3. 有點吹毛求疵的問...


  吸血鬼威脅說要去找小麗莎, 這點好像挑戰到設定.


  如果吸血鬼能威脅到小鎮村民, 平常就可以不挑對像去做了吧?


  這麼萬能又無敵的話, 人類早該感到威脅, 會有很多人認識到吸血鬼吧?


  不知道電影裡面有沒有一些設定作解釋.



















  --'
