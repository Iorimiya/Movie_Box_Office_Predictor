title: '[好雷] 歐吉桑鄰好 - 罪人外表下的聖人'
content: "圖文完整版： \n\n「歐吉桑鄰好」(St. Vincent) - 罪人外表下的聖人\n\n如果有個奧斯卡獎，專門頒給不那麼認真、聲譽卓著的片，「歐吉桑鄰好」\n\
  的主角比爾墨瑞應該會被提名最佳男主角，搞不好還會得獎。\n\n剛離婚的Maggie﹝Melissa McCarthy﹞獨自帶著十二歲大的兒子Oliver﹝\n\
  Jaeden Lieberher﹞搬到新居，工時長的媽媽不得已請鄰居Vincent﹝比爾\n墨瑞﹞充當保母，在Oliver下課後看顧他，Vincent沒什麼育兒技巧與能力\n\
  ，但他很缺錢，於是Oliver與Vincent就這樣陰差陽錯地長時間相處...\n\n片中這位Vincent抽煙喝酒賭博樣樣來，即使多了個孩子要照顧依舊不改，\n\
  但觀眾漸漸發現他也有很善良的一面，尤其是他看到別人遭逢災難，決不\n會拋下人家見死不救。\n\n「歐吉桑鄰好」同時令人想起「經典老爺車」(Gran Torino)、「女人香」\n\
  (Scent of a Woman)、「愛在心裡口難開」(As Good As It Gets)、「非\n關男孩」(About a Boy)等等，尤其「非關男孩」與「歐吉桑鄰好」有非常\n\
  多元素相同，孤僻難相處的男主角、單純又有點怪異的小男孩、男孩的單\n親媽媽、片尾大結局的男孩學校活動...不過，讓「歐吉桑鄰好」與眾不同\n的，是比爾墨瑞。\n\
  \n電影裡圍繞著Vincent的這群人，是在社會上苦苦掙扎的人、甚至是被放著\n自生自滅的人，退伍老兵、失憶老人、單親媽媽、被霸凌而父母又無力關\n心的孩子、未婚懷孕的妓女，自成一個生活圈，想辦法在美國夢中陰暗的\n\
  那一面過活。但「歐吉桑鄰好」用喜劇的方式面對這些黑暗面，它的笑點\n都頗合我胃口，好幾次讓我大笑出聲，可是在戲劇安排方面，編劇兼導演\nTheodore Melfi太過操弄情緒，把所有能打的牌都用上了，阿茲海默症、\n\
  越戰英勇行為、單親媽媽面對監護權戰、地下錢莊討債、校園霸凌與瘦弱\n小子的反擊、中風與復健、外表粗俗心地善良的脫衣舞孃兼妓女...每一個\n安排都讓人害怕電影會變得超級虛偽、用老套來騙人眼淚。\n\
  \n所以，我很高興是墨瑞擔任主角，如果換成其他演法更討喜的演員，例如\n傑克尼克遜（他是本片原本設定的主角），整部片可能會甜膩到不行，更\n降低它感動人的效果。而墨瑞呢，他本質裡彷彿永遠帶著某種不屑，就算\n\
  劇中給他一個自我救贖，他看起來還是那個樣，而不是從此神奇地變成了\n個可人兒，熱情欣賞與擁抱生命中的美好。你要怎麼解讀他都可以，但他\n沒有改變的意思。他從頭到尾都是同樣的人，缺點一樣多，只是旁人與觀\n\
  眾多了解了他的另一面而已。\n\n喜歡比爾墨瑞的話，一定要看電影最後一段，他飾演的Vincent聽著Bob\nDylan的\"Shelter from the\
  \ Storm\"，拿著水管澆水洗東西，這段既愚蠢又\n神奇，展現的其實是比爾墨瑞這位演員的特質與魔力。但若你喜歡比爾墨\n瑞在這兒的表演，你更該看看「都是愛情惹的禍」(Rushmore)，導演Wes\n\
  Anderson真是知道該怎麼利用比爾墨瑞這樣一位演員哪。\n\n其他演員裡面，很高興看到McCarthy可以暫時不瘋狂搞笑，得以發揮演技\n，扮演一位被生活追著跑的辛苦單親媽媽，這角色通常是留給Toni\n\
  Collette演的（哈哈），不過McCarthy也演得很棒，而且當她悲哀地說\n\"Well, your father must think I'm a tree.\"\
  時我還是笑翻了（前後文\n笑點有收錄在本文最後的「經典對白」），她不一定要用肢體搞笑也是能\n讓人笑壞的呀。Chris O'Dowd飾演天主教學校的老師，極為搶戲，我認為\n\
  這個角色自己可以生出一部電影。娜歐咪華茲飾演俄裔脫衣舞孃兼妓女，\n我不知道華茲來這幹嘛，雖然這角色有時還算挺好笑，但能發揮的點很單\n調，而且比較像從卡通裡走出來的。Terence\
  \ Howard飾演地下錢莊的討債\n人，但完全被浪費了。特別提一下演療養院護士的Kimberly Quinn是導演\n老婆。\n\n題外話：Vincent向Oliver介紹俄羅斯妓女Daka的時候，提到她的工作是\"\
  \none of the more honest ways to make a living\"，這句話除了好笑以外\n，倒也很真實，想想台灣那些賣假油假食物的老闆，住好房開好車過得爽\n\
  爽的，但你說衣冠楚楚的他們，做的工作誠實嗎？比不上穿得亂七八糟、\n說話一點氣質都沒的Daka呢。什麼樣的人叫作水準高？什麼又叫作水準低\n呢？\n\n--\n\
  \n我的部落格 \nFB粉絲團  \n\n--"
