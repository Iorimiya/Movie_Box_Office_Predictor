url: https://www.ptt.cc/bbs/movie/M.1744870511.A.BCD.html
title: '[好雷] 是驚悚片的罪人 IMAX版'
content: '以下有雷～

  小弟對於音樂史沒有深刻了解

  單獨就從電影表面來討論


  就簡單來說真的就是現代版的‘’From dusk till dawn 惡夜追殺令‘’~

  但本片一開頭就有說好的音樂會吸引人和鬼，不像惡夜中途直接鬼轉，從警匪片變驚悚吸

  血鬼片~

  前半段不論音樂，角色刻劃都很到位，電影節奏也很好，帶入感很棒，主要就在講2兄弟

  回家鄉開音樂酒吧的故事，和過去之人愛恨情仇之類的～ 由於電影所演內容都是在同一

  天，因此不會讓人感到煩躁～

  中段在酒吧的電影轉折應該就是本片最好看的地方，音樂和氣氛都是最頂的，和惡夜追殺

  令一樣，弟弟一下就被咬了，然後吸血鬼的設定就按照傳統的怕大蒜，進屋需要邀請等設

  定～

  最後大家幾乎都死光了，只留下象徵藍調音樂的小哥活下來

  總而言之，本片劇情 節奏 音樂都很到位，不去管那些暗示依然可以沉浸其中，絕對是目

  前今年最好看(當然前提是你不排斥政治正確


  --'
