url: https://www.ptt.cc/bbs/movie/M.1745435065.A.7C9.html
title: '[好雷] 罪人'
content: '昨天去看的 高雄大遠百IMAX

  我進場前只在其他電影的預告時段看過罪人的預告

  而且是幾乎啥都沒講 超級初版的預告

  只知道麥可B喬丹 在一間暗暗的穀倉還是什麼房子裡對抗敵人 沒了

  所以算是沒有帶著任何期待

  看到好像普遍好評就進場了


  劇情就不贅述

  版上很多先輩寫得更精采

  我只能說

  完全值回票價


  音樂超過100分

  雖然對藍調音樂的知識僅止於知道這個類型

  但是在過程中

  會不知不覺被帶入節奏之中

  在那個年代 受壓迫的黑人們

  能夠為他們帶來些許慰藉的

  也就只有音樂

  從音樂中

  看見了人們的天性

  以及不同種族間共存的可能性


  整部片以音樂為主軸貫穿其中

  尤其安妮作為旁白所描述的

  「音樂天才會吸引過去與未來的幽靈」

  搭上炫技般的一鏡到底古今音樂盛宴

  實在是讓我驚艷

  尤其中間那段

  古怪又邪惡的畫面

  卻搭配節奏歡快的愛爾蘭民謠

  在場的所有人不分黑白

  只為了音樂而舞動著

  或許在那一刻

  他們真的是自由的


  老實說愛爾蘭人還真是對音樂很堅持

  不管是裝好人還是露出真面目

  都要來上一首歌

  我還期待在他走的時候

  會是一邊唱歌一邊消散的

  要是那麼拍了

  這個角色就真的會讓人印象深刻

  連走都要走得那麼瀟灑

  可惜沒有


  最後時光流轉

  宿命的雙方再次會面

  但是他們之間

  只有純粹的音樂

  也是非常棒的一個收尾


  推薦給還沒看的人


  若有時間

  一定會去二刷

  畢竟用影廳的音響才有最大爽感


  --'
