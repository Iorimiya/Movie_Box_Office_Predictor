title: '[討論] 麥可B喬丹「罪人」爛番茄100%'
content: '黑豹導演萊恩庫格勒執導，麥可B喬丹，海莉史坦非主演，是一部驚悚片，最好

  不要知道劇情，預告片透露的少，影評也提到這件事情


  目前爛番茄已經累積43個影評，全數好評，只能說萊恩庫格勒真的很懂爛番茄口味

  目前只有一個不新鮮，而且還是製片，希望他不要再去搞甚麼黑豹2這種東西

  專心拍好片


  --

  復仇反擊戰也是IMAX阿，雖然沒啥打戲'
