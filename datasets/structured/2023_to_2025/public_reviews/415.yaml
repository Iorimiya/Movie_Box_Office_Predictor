title: '[好雷] 幸運的罪人：羊之木'
content: '網站好讀版｜







  「你知道宮腰殺過人嗎？」



  「那又如何？他已經洗清罪孽了吧。」



  最開始，看見六位殺人犯出場，我想起的是七宗罪──

  傲慢、貪婪、色慾、嫉妒、暴食、憤怒、怠惰。這七項

  灰暗的罪名，不能平均分配到每一位殺人犯名下，但他

  們身上都曾閃爍這樣的特質，像發光的石子，像一種記

  號，昭示世人：這些人就是罪人，惡人，錯誤的人。



  他們背負的罪名，讓他們即便是在荒涼的黑夜裏，在無

  人知曉的荒野，也能夠被辨識出來。他們刺眼的光芒，

  使人心生恐懼，讓村落露出大難將至的前兆；因為刺眼

  ，他們也能夠輕易看見彼此的存在，有如肉眼看來，夜

  空中相距不遠的繁星，他們依循不同軌道行進，有不同

  的光年，卻在此刻，受限於人類的可視距離，因此顯得

  如此親近。



  他們不被允許走在同一條路上，也不情願與彼此同行。

  想成彈珠，或許就很好理解了吧，兩顆彈珠在同一條軌

  道上，無法同時全速前進。一旦相遇，就會相撞，就會

  粉身碎骨。事情變壞，是從杉山的攀談開始的。大野見

  他來，就說：「你真像我啊。」杉山追問下去，大野才

  說：「我過了很久之後，才發現自己是個傻子。」



  相較於中途半端的杉山、大野，在松田龍平飾演的宮腰

  身上，更能看出罪人的掙扎。總覺得無論怎麼寫，都無

  法精準形容松田龍平的演技──好像杉山、大野一干人

  等，相比之下都只是遊戲人間，以殺人為手段，來測試

  自己的能耐；宮腰殺人，卻是為了與自己與生俱來的病

  和平共處。



  宮腰殺人的景象，會讓我相信那是他的本能。像是我們

  生來就會吃飯喝水，他生來就會殺人；我們口渴了就想

  喝水，他一旦被喚醒了，自然會有殺人的慾望。



  我們能夠想像這樣的人嗎？世界上真的有這樣的人嗎？



  宮腰不厭其煩的向月末說：「你是以朋友的身份問我，

  還是以公務員的身份問我？」或許這也是宮腰對自己的

  質問。要去做一個真實的人，還是做一個符合社會標準

  的人。要去做一個罪人，還是一個洗清罪孽的人。在他

  心中，殺人的慾望像一口井，他盡力要掩蓋，用蓋子蓋

  起來，卻被無知的杉山給撬開。井水汩汩湧出，有如祭

  典那晚，降下無法抵擋的暴雨，宮腰說：「のろろ様、

  怒っているのかな？」問題的答案，其實也是宮腰自己

  最清楚的：憤怒永恆指向慾望的不滿足。



  純惡的宮腰，明白自己是神明慾望的對象，是萬中選一

  的祭品。神明的慾望鋪天蓋地，如此不可違逆。神要他

  生來這世上，作為一個罪人而生，作為一個罪人而死。



  或許這樣想，對宮腰來說也比較輕鬆吧。畢竟要洗清罪

  孽，真是太困難了。人類就是這樣的群居動物，犯了錯

  要黥面，要讓他人保持距離，就算有了愛人，也會有好

  事者跑去和愛人說：他可是罪人啊。除了宮腰和杉山，

  其他人多半是幸運的。在犯錯之後，還能變成村落的一

  份子。他們有幸領受了一份大禮──像把過去埋葬之後

  ，長出的第二個生命──平凡無奇的魚深村民。












  --



  謝謝Q____Q


  其實宮腰的選角真的是很好

  放在現實生活中是人人避之唯恐不及

  卻可以演得乾乾淨淨，渾然天成

  忍不住讓觀者心生憐憫

  這就是松田龍平的標準戲路啊


  寫到一半也覺得

  比起《怒》，這部片是比較慈悲的

  講出殺人犯的悔悟、殺人犯也有愛人的權利

  或許是想讓我們思考：

  每一個平凡的人，都有可能是洗清罪孽的罪人

  每一個平凡的人，都有可能是幸運的罪人


  另一個很有趣的點是

  與相似題材的電影相比

  這部片多了宗教元素（神的旨意）

  使得「為什麼有人天生就有殺人的慾望？」這個問題

  有了一個非常高的俯視視角

  因此也能夠產生更多元而寬容的解答


  宮腰可能是祭品

  也可能是在千萬人之中

  被神分配了「擁有殺人的慾望與能力」的示範任務

  讓世人了解，最壞的人類也不過是如此




  謝謝！！已修正～～'
