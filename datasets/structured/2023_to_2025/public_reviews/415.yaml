url: https://www.ptt.cc/bbs/movie/M.1745039376.A.2E5.html
title: '[大好雷] 罪人 - 驚悚片皮的文化片'
content: '看預告以為是部高規格製作的美國殭屍片，但沒想到卻在Imdb拿了7.7的高分，是近年院

  線少有，實在很好奇就毅然決然買票進場了



  從頭到尾導演都不斷透過台詞等小細節暗示驚悚表皮背後的種族與文化寓意，並用「音樂

  」這個題材貫穿白人強勢文化對少數民族的蠶食鯨吞



  要角Sammie（應該是這樣拼）作為一個渴望透過藍調音樂脫離密西西比黑人社群的牧師之

  子

  ，擁有極高的音樂天份，整部片最精彩的五分鐘就是Sammie在酒吧演奏寫給爸爸的歌並召

  喚出過去與未來的黑人歌者舞者的長鏡頭，穿越百年的黑人音樂交錯堆疊和虛實人物以截

  然不同但各自美麗的舞蹈共聚一堂的奇幻體驗真的讓我在目瞪口呆，認真光這顆鏡頭就值

  得進場看了！



  有一些橋段的小細節值得談談


  1. 三個愛爾蘭白人吸血鬼被藍調酒吧拒之門外後，在外面唱的歌是鄉村歌曲，導演暗示

  了白人的文化挪用，畢竟鄉村歌曲正是白人揉合塞爾提克人民謠和黑人藍調的曲風，此外

  ，最經典的白人剽竊黑人音樂的例子就是貓王的搖滾。


  2. 其中一個Michael B Jordan變成了吸血鬼並得到了永生，他變成了吸血鬼象徵他向白

  人強勢文化投誠並免於被時代淘汰的危機，但他最後向行將就木的Sammie坦承了他在藍調

  酒吧開幕的那晚才是最「自由」的一天，我覺得可視為導演的一種反全球化的文化保護主

  義的宣示。


  3. Sammie雖然亟欲脫離牧師父親的耶和華之道，但在準備要死前，還是念起了馬太福音

  主禱文，殊不知他的對手對那段經文還比他更熟，就連那個時代整個黑人社群唯一能盼望

  的上帝都不是你的上帝，也是一個種族統治另一個種族的文化侵略的結果，這與Annie這

  位傳統薩滿形成很有趣的對比。


  4. 女主角是個被黑人社群接納的白人，他講話模式與習慣都很融入主角群的底層黑人們

  ，甚至被說是Family，這某種程度上減弱了這部片的政確味道，畢竟膚色雖然說明了很多

  ，但Lifestyle才是構築一個文化的核心，這與當代迪士尼顛覆膚色種族同時混淆文化界

  線的做法差異超大。



  這部片可以討論的細節還有非常多，包含黑人社群的排外、治安問題（偷拐搶騙黃賭）、

  黃種人的精打細算與家庭價值還有基督教信仰霸權等等，算是這類題材的片中非常有趣的

  一部，也不禁讓人感嘆有多少「真正的音樂」已隨著或正隨著主流文化的擴散而被挪用殆

  盡。


  非常神！


  --'
