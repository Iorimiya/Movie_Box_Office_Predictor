url: https://www.ptt.cc/bbs/movie/M.1745051590.A.CEE.html
title: '[好雷] 罪人—定位混亂，但充滿靈魂'
content: '各位好，我是罪人



  我今天看電影前買爆米花，不聽店員說微波要按8的指示，自己按了1又按8，結果爆米花

  全燒焦了......吃起來都是苦的。



  好險電影很好看，我光吃自己的指甲就吃很飽了，不需要再吃爆米花



  開演之前，我看了一點預告，感覺好像是動作驚悚片，結果電影開演後，前半段非常的慢

  ，一個個介紹角色，彷彿在逼你跟他們培養感情，給人感覺這大概是恐怖片



  但看到最後發現，就是劇情片，主要講得就是歷史，以藍調音樂這個媒介為出發點去展開

  的，一幅時代的圖景



  這其實未必是稱讚，我覺得其實有一點像是導演想搞一個恐怖片或動作驚悚片，卻沒有搞

  好的結果，不然有些東西沒必要拍，最後還是只有顧好自己本來想做的表達，其他東西就

  捨棄了



  換句話說就是，這片既不驚悚也不恐怖，也沒有甚麼好看的動作



  所以總的來說，攝影音樂跟他的劇情主軸是很不錯的，但由於某些額外元素的處理不夠好

  ，導致某些人可能會被誤導，帶著錯誤的期待走進電影院



  請抱持著劇情片的期待來看本片



  以下是有雷的部分




  整部片以藍調音樂為主軸去描述時代，確實很有趣。藍調的優美，來自藍調的創造者們深

  刻的痛苦與憂鬱。劇中的瘦子在車上講述自己和一個好友被典獄長強行抓去表演，最後好

  友卻因為身上帶太多錢被栽贓處死的悲痛遭遇，講完後他便拍起手大聲歌唱，這便是藍調

  的核心，痛苦。



  而吸血鬼跟3K黨作為全片的反派也是一個很有趣的對比，有些人可能看完會解讀成吸血鬼

  就是白人文化，也許作者確實是這麼想的，因為就像那個吸血鬼咬了幾個黑人後，大家就

  開始其樂融融的唱著歌，還唱的有模有樣的，不過我想了一下，我覺得吸血鬼的存在象徵

  著一個概念，就是底層互害



  首先，只有安妮這個信古老薩滿教的人知道吸血鬼真正的設定，而男主美妙的歌聲吸引到

  了吸血鬼，這說明什麼？這說明吸血鬼跟非洲文化可能是同源的，而這個吸血鬼頭子雖然

  是白人，但他並沒有討厭黑人，甚至也說了自己可以先去處理掉3K黨的人。開頭他利用了

  3K黨看到自己是白人就會無腦包庇的特性躲過了印地安人的追捕，下一刻就把兩人都宰了

  ，也可以算是一種看膚色決定立場的批判吧



  而當男主Sam被吸血鬼抓住的時候念著祈禱文，而那吸血鬼說道，他的領土被搶走的時候

  ，那些人也背誦著這些，這說明什麼？說明他曾經也是個被侵略者，被殖民者。



  安妮說過吸血鬼是靈魂無法離開已死的肉體，懷著怨念行走人間，換句話說，他們就是時

  代的厲鬼。



  擁有類似蜂巢意識的吸血鬼群就像某種扭曲的集體主義，就像黑幫一樣。我們很和睦，我

  們可以弄死所有敢動你的人，前提是你要加入我們，成為這個殘害他人的集體意識的一部

  分。



  生在那個時代的黑人小伙，不只要面對明面上社會對你的惡意，還要處理在暗處隨時想把

  你拖進深淵的鬼魂。最後Smoke不只把吸血鬼宰了，也把3K黨端了，逃出生天的牧師之子

  才有了發展的機會



  最後融入現代的兩個吸血鬼聽著老了的Sam彈琴唱歌，似乎不再是噬血屠戮充滿威脅的存

  在了，也許也是象徵時代的進步終於擺脫了厲鬼的糾纏吧



  大概就是這樣，最後我想說一句，本片的音樂真的很好聽，請片商趕緊釋出OST，謝謝


  --'
