  動人預告:

  10月31日 全台戲院見



  參加抽獎方式：留言回答你想要搶先看原因 並註明場次就有機會中獎

  （）


  特映會場次（一人得獎兩人同行）

  中午場：10月28日 12:30欣欣秀泰影城

  台北場：10月29日 19:00微風影城

  台中場：10月28日 19:00 台中文心秀泰影城

  高雄場：10月28日 19:00 高雄夢時代秀泰影城


  公布得獎日期：10月21日公布得獎名單於回文內,得獎者請於10月23日10:00前

