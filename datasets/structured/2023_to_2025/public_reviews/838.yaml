title: '[好微雷][電影]史蒂夫·賈伯斯-藝術家引領潮流 平庸者追隨其後'
content: "Stay hungry , stay foolish\n\n \"求知若飢，虛心若愚\"，這句大家一定聽過，沒聽過一定知道iphone吧，史提夫.賈伯斯\n\
  就是建立蘋果電腦的重要人物。 因為在大學前都沒機會接觸pc以外的東西，當大學主修\n影像製作後，就成為一位果粉，但我相信蘋果電腦的信念不過卻不失去理性，沒有每次新\n\
  產品一出就買。 電影開始切入是一段紀錄式的影像，它解釋了電腦怎麼改變了人類，也\n直接的說出賈伯斯怎麼改變了人類收集資訊的方式。\n\n電影的進行架構是以三段產品的發表為主軸，以其準備發表會前的時間敘述著故事，由這\n\
  部電影可以帶領我們一探史帝夫賈伯斯在數位革命背後，關於個人黃金時代的深刻描繪，\n電影中出現的是新舊工作夥伴、記者、女友與女兒。\n\n\n\n 每次的產品發表會都像是一場自我與完美的追尋，不計輸贏依舊十足把握。我最喜歡的\n\
  兩場戲是第二場發表會賈伯斯與約翰史考利會前對談、最後發表會前與女兒對談。 與約\n翰史考利對談的戲充滿著攻擊性威脅刀光劍影，當賈伯斯走到一個長廊時畫面已一種平衡\n\
  安全的大全景放置兩位，隨著兩位的接近情緒的起伏還有事情的關鍵性，鏡頭的運動由方\n正平穩越來越動態越來越接近兩個人的臉部表情，當時談論著賈伯斯被董事會踢走的對話\n\
  ，當時賈伯斯說:{我當時只在車庫就開創新世紀，因為藝術家引領潮流，而平庸者只能追\n隨其後}，這句話不但大辣辣表明其他董事會都只是一般人，而沒有人像他一樣追尋完美\n\
  。\n\n\n\n  另一個印象深刻的場景是第三次產品發表會發表imac前賈伯斯找女兒修補家庭關係的時\n候，年輕時賈伯斯不願花時間去解決親子的關係，隨著年齡增長在三場發表會能感受到漸\n\
  漸地賈伯斯更包容女兒更多心思關注於家庭上，最後賈伯斯要發表產品前把女兒小時後用\nmacpaint畫出的抽象圖印出來交給她，女兒看著爸爸上台一邊看到這張抽象畫，此時沒有\n\
  對話只有閃光燈與眼神的對話，告訴著我們他其實一直在意她中只是不知道怎麼表達，這\n樣簡單的特寫鏡頭描繪父女間的情深義重。\n\n電影中有著一句話是賈伯斯在第二場產品發表會時與安迪何茲菲德爭吵時說的話，賈伯斯\n\
  說:[約翰藍儂不是因為幸運才成名，那是因為他自己知道他是約翰藍儂!]，這句話解釋了\n不是時勢造英雄，而是英雄本來就在只不過剛好事情發生要他來解決如此而已。\n\
  \n\n\n史帝夫.賈伯斯片中出現太多經典的對白，我都恨不得拿筆記本邊看邊寫下來，因為頭腦\n根本記不住所有對話。與賈伯斯對話在片中看起來就像是參加辯論大賽而且耳根子要非常\n\
  硬，不然很快地就無法與他對話。\n\n本片看一次也不夠展示著賈伯斯的工作模式與家庭關係，在看幾次都不膩，也不會減少對\n話帶給觀眾的衝擊力。如果不知道賈伯斯的人看本片也好，這部片直接表現了賈伯斯的人\n\
  生哲學與人生態度。\n\n\n\n\n電影預告>\n\n電影介紹>\n\n\n\n--"
