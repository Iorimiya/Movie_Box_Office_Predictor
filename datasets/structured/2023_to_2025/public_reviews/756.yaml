url: https://www.ptt.cc/bbs/movie/M.1730483505.A.27E.html
title: '[好雷] 小雁與吳愛麗 黑白人生就該用黑白色調'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n\n\n\n\n\n拜《大佛普拉斯》所賜，很喜歡黑白電影\n\n講述黑白人生的故事時用黑白色調呈現真的再適合不過\n\n\n\n進電影院前對這部電影完全不了解，甚至連片名都不知道\n\
  \n看到黑白色調一直會想拿《大佛普拉斯》做參考\n\n還好最後沒有辜負我的期望，真的很好看。\n\n\n\n\n已經被國片傷害太多次的我，對國片的信任實在蕩然無存\n\
  \n上次進電影院看《當男人戀愛時》還氣到高血壓\n(我後來真的有二刷想體會當時那種不舒服的感覺是甚麼，\n 原來是高血壓，一量152，真的是看了很氣很不舒服)\n\
  \n我不認為我是標準很高的人\n但國片充斥著俗濫的笑話、硬要的說教、尷尬的對話、太套路的劇情等等\n我真的被傷害的太深了QQ\n\n\n\n\n\n但這部真的很讚，讓我看得很開心\n\
  很多拍攝手法讓我覺得很美麗\n\n\n\n\n\n很多場景像是對稱一樣的重現，真的覺得很美\n\n吳愛麗重現了他喪夫之前的擇偶\n重現了有目的的去社大為了找人，卻因緣際會認識了不同角度的自己\n\
  有太多對稱的手法\n\n還有最重要的，\n小偉重現了他丟給小雁的問題：為什麼要殺爸爸？\n\n那畫面我真的覺得超美。\n我想，在那個時候小偉知道了小雁為什麼要殺他爸爸。\n\
  \n\n\n\n\n我也很喜歡這故事的留白\n\n有很多事情電影並沒有描述完整\n像是小偉的後來、或是小雁戲劇班的友情、或是與阿正的感情...等等\n\n都沒有講完\n\
  \n但有些事情就是不講完才有美感，像是要對吳愛麗講的我愛你。\n\n\n(雖然我當下很希望能突破不敢表達情感的框架XD\n但有些話和故事，留在謝幕後說完更美)\n\
  \n\n\n\n\n另外穿插的故事線跟重合的時機很融洽，導演真的很厲害。\n\n而且還好沒有說教，不然我可能又要高血壓XD\n\n\n\n我一直都很喜歡描繪社會底層的故事\n\
  像是《大佛普拉斯》講述幾個無法翻身的可憐人的故事\n\n這故事裡也有很多無法翻身也沒有選擇的人 (也許有，但不敢去做那些選擇)\n\n\n沒有對觀眾說教要對更生人更多包容，我覺得很讚\n\
  我一直都有在關注更生人的議題，讓我看了倍感欣慰。\n根本就不需要說教\n\n\n\n\n\n\n\n\n\n\n還好我沒有因為國片就拒絕XD (雖然當初是抱著隨便看看的心情去的XD)\n\
  真的沒想到這麼好看\n\n感謝我朋友讓我在2024尾巴看到這麼好看的電影~~\n\n\n\n\n\n\n--"
