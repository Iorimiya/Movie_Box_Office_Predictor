url: https://www.ptt.cc/bbs/movie/M.1741324168.A.E36.html
title: '[好雷] 小雁與吳愛麗 互相理解'
content: '對女主小雁來說就是他的人生就是個黑白人生

  用黑白方式呈現這點很喜歡

  家庭問題、母女情都很值得思考

  夏于喬演技超好 跟楊貴媚的火花很精采


  -----------防雷-----------





  從前是校花是專櫃櫃姐的小雁

  因爸爸家暴、出軌 為自己、媽媽把自己的爸爸殺了

  八年後出獄了 變成一個有前科的更生人

  面試被打槍 不能做自己想做的工作


  發現媽媽交了新男朋友 好死不死找一個也會家暴的

  以女兒的立場當然滿是無奈 用自己的青春去換安全的日子

  結果剛出獄就發現這個男人跟爸爸一樣是打女人的垃圾


  但對媽媽來說先生死了 女兒被關 人生當然寂寞

  再找一個男人也是合理的 仁哥也算是有幫他賣假彩票還債


  加上爸爸跟小三生的兒子出現

  對媽媽來說當然覺得關我屁事

  對小雁來說小偉再怎麼樣還是同父異母的弟弟


  在被小偉問為什麼殺爸爸那邊還是有點感動

  一個對爸爸充滿恨 一個對爸爸一無所知

  但兩人都是爸爸的小孩 出現同父異母弟弟這個角色很厲害


  看完不經在想 會吵架只是立場不同

  跟事情誰對誰錯沒有關係 學著互相理解對方



  --'
