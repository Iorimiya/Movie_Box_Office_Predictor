title: '[新聞] 國片《小雁與吳愛麗》勇奪芝加哥亞洲躍'
content: "新聞網址：\n\n第19屆芝加哥亞洲躍動影展（Asian Pop-Up Cinema\n, APUC）於3月20至4月13日舉行，在文化部支持下，駐紐約臺北文化中心與影展合作，特\n\
  別辦理，選映《鬼才之道》、《老狐狸》等部國片，其中《小雁與吳愛麗\n》奪得本屆「」，另《夜校女生》獲得「」，臺灣演員陳\n柏霖及陳姸霏則獲頒「」。\n\n\n\
  本屆影展首度辦理評審團競賽單元，頒發「評審團最佳劇情片獎」、「最佳短片獎」及表\n彰新銳導演的「Francis Kwong紀念獎」，最終由已獲多項國際影展獎項的《小雁與吳愛\n\
  麗》勇奪最大獎。\n\n\n評審團表示，「《小雁與吳愛麗》探討一名年輕女性的內在過往與可能的未來，嘗試重獲\n自身生活與認同，導演林書宇以黑白寬螢幕格式處理畫面，營造回想的效果，女主角夏于\n\
  喬的演出令人印象深刻。」\n\n\n本屆入選的國片，多部電影的主創人員均親自參加影展，包括《鬼才之道》導演徐漢強、\n男主角陳柏霖；《小雁與吳愛麗》導演林書宇、女主角夏于喬；《夜校女生》導演莊景燊\n\
  、女主角陳姸霏、製片唐在揚都出席映後座談與當地影迷見面，現場星光熠熠。\n\n\n本次影展臺灣專題另包含《獵人兄弟》、《乒乓男孩》，以及導演陳坤厚的經典作品《小\n\
  畢的故事》、《最想念的季節》，陳坤厚特別錄製一段影片向芝加哥影迷致意。\n\n\n芝加哥亞洲躍動影展今年邁入10週年，這次將原來每年春秋兩季影展轉型擴大為，網羅臺灣、日本、韓國、香港等地50部最新優質電影，持續推廣亞洲文化，影展\n\
  啟辦至今，已經播映超過200部亞洲電影，成為亞洲電影工作者打入北美市場的門戶，也\n是許多亞洲電影在美首映的登場舞台。\n\n\n\n\n\n--\n: ☑簡章\
  \ + ☑榜單 + ☑新聞    \n\n\n\n\n\n\n--"
