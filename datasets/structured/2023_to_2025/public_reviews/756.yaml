url: https://www.ptt.cc/bbs/movie/M.1724751698.A.9A9.html
title: '[新聞] 林書宇「小雁與吳愛麗」入圍釜山影展 角逐'
content: "林書宇「小雁與吳愛麗」入圍釜山影展 角逐金智奭獎\n\n\n釜山國際影展今天公布新浪潮及智奭等2項競賽單元入選片單，其中\n\n第29屆釜山國際影展（BIFF）將在10月2日至11日登場，大會今天公布2項競賽單元入圍片\n\
  單，林書宇作品「小雁與吳愛麗」入選的。\n\n「小雁與吳愛麗」由影后主演，演繹一對母女錯綜複雜的關係，並找來同台飆戲，除了囊括多位曾獲金馬獎肯定電影人才的團隊，也請來日本知名\n\
  配樂家林正樹參與電影製作。\n\n獲知入圍消息的林書宇透過新聞稿表示，已故釜山影展創始人金智奭一直是台灣電影與他\n的貴人，很榮幸這次能入圍以他為名的影展單元。\n\
  \n首次與妻子夏于喬合作拍電影的林書宇也透露，這部電影靈感其實就出自於夏于喬與她母\n親的相處，「她小時候一心只想要搬出自己家，逃離母親的情緒勒索，到最近她父母要搬\n\
  家，她反而是鼓勵他們搬到我們家附近，母女的關係始終是個複雜又無解的命題」。\n\n「我漸漸地在我妻子身上看到她母親，也在她母親身上看到她」，林書宇在「小雁與吳愛\n\
  麗」中對於母女之間這種「永遠都比她們想像地還要相似」的鏡像關係，精準呈現母女之\n間的糾纏與相互影響。\n\n預計10月10日在台灣上映的「小雁與吳愛麗」將在釜山影展進行全球首映，與林書宇共同\n\
  角逐金智奭獎的還有日本導演草野翔吾、石橋夕帆，韓國導演白承彬、李夏藍，吉爾吉斯\n導演Dastan Zhapar Ryskeldi、菲律賓導演曼多薩（Brillante\
  \ Mendoza）、印度導演達\n斯（Rima Das）。\n\n\n\n小雁與吳愛麗   \n\n\n\n\n\n\n--"
