url: https://www.ptt.cc/bbs/movie/M.1747532325.A.ECA.html
title: '[好雷] 小雁與吳愛麗：人間最清醒的距離'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《小雁與吳愛麗》有雷影評：人間最清醒的距離\n\
  \n■ 評語\n為何無法逃離家暴輪迴？什\n麼是鬆開恨意的鑰匙？\n\n■ 四堂表演課與劇情對應\n\n《小雁與吳愛麗》的主題非常明顯，在於母女倆如何面對、詮釋、化解重複上演的家暴問\n\
  題與創傷。我想重點針對四堂表演課的主題，寫一些對劇情的解讀：\n\n#第一課：戲是假的，內心必須是真的\n\n小雁想要擺脫自己更生人的身份，所以隱瞞背景跑去應徵美髮業的工作。但她發現她演不\n\
  來。而如果真實揭露自己的身份，結果就是什麼機會都沒有。\n\n更生人到底要改名換姓，還是誠實面對？重點在你的內心到底是不是真心的。即便要迎合\n演出，也得先過自己內心這關。\n\
  \n\n#第二課：語言的感染力，讓台詞感染內心\n\n這邊我覺得各自對應到小雁和吳愛麗說服自己的方式。有力的台詞可以感染內心，改變自\n己的立場。\n\n小雁面對小偉銳利逼問弒父的原因（直白版本是：為何讓他喪父），她用力的表明父親是\n\
  個壞人。\n\n吳愛麗面對家暴又外遇的丈夫，選擇不離開（當然這非常的簡化。你可以看到仁哥是怎麼\n趁人之危，控制並掌握對方。所謂的選擇當然不對等）。她給自己的台詞是：「我不能讓\n\
  他好過，到底憑什麼？」「我是為了保護女兒才忍氣吞聲。」吳愛麗內心當然有對小雁愧\n疚，但她必須以這些理由說服自己，唯有這樣才能支持自己面對殘破的家。\n\n人會運用語言來捍衛自己，避開顯眼的矛盾跟牴觸。因為真相太過赤裸。\n\
  \n#第三課：知己知彼好情勒！\n\n這部份對應到人物間的問答。透過第三隻眼睛看事情，可以逼當事人變得更加客觀。\n\n例如，小雁向表演課的同學介紹虛假家庭，看起來好像都是隨口亂掰，但也是逼小雁思考\n\
  母親可能的家庭背景與遭遇。\n\n又比如，中段小雁和吳愛麗大打出手的吵架戲，道出彼此對父親的態度和相關脈絡。\n\n向第三人描述自己的心情，可以看到一些邏輯跳躍和誇大的推論，幫助突破自己的盲點。\n\
  \n\n#第四課：演什麼像什麼\n\n她確實恨父母，卻也不想再恨。她討厭\n父親，努力拋棄認可，但又無法控制的向父親索取愛與關注。\n\n\n\n諷刺的是，仁哥在演戲與說服上面可真的勝過母女倆，因為他始終缺乏良心譴責與責任感\n\
  ，為了利益隨時完美出演。我想已故的父親也是。\n\n■ 結語\n\n小雁想藉父親之死結束苦難，才發現自己真正要放下的是愛、恨，以及隨之而來的追問。\n吳愛麗誠實面對自我，本以為再找男人作伴就能改變生活，後來看到小雁的勇敢與誠實，\n\
  才漸漸拿回主導權。\n\n\n\n從決定找尋答案、建構自己的敘事邏輯、透過客觀對話找到盲點，到最後藉換位思考找到\n問題核心。\n\n人生太難了，不必時時刻刻內外合一。但總有時候，必須對自己誠實一回。\n\
  \np.s.看完才去補看預告，剪得好好看！\n\n>>網頁好讀版：\n\n–\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond \n\
  個人網站：\n\n--"
