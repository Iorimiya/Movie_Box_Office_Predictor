url: https://www.ptt.cc/bbs/movie/M.1728533733.A.B26.html
title: '[影評] 《小雁與吳愛麗》夏于喬迎來演技巔峰'
content: "《小雁與吳愛麗》影評：夏于喬迎來演技巔峰，楊貴媚、曾國城動人傳神\n   朱哲輝Alan\n\n甫獲金馬獎最佳女主角等八項入圍的《小雁與吳愛麗》，是導演林書宇執導的第五部劇情\n\
  長片，描寫小雁為了保護母親而過失弒父，被關八年之後成為更生人，出獄後回到小鎮上\n與母親相依為命。另一面一個叫Allie 的女子則是在城市裡試圖用表演課面對自己。\n\
  \n電影初看前半會以為是類似《雙面薇若妮卡》（The Double Life of Véronique）的面\n貌類似的雙生劇情架構，但這部片跟《雙面薇若妮卡》完全不一樣（先不爆雷）。因為《\n\
  小雁與吳愛麗》其實是從「母女關係」的命題為主軸。\n\n母親與女兒既是一種生命的延續，也是相互對照，愛恨交織。母女之間是近似也可能疏離\n，像是電影中出現的一場戲夏于喬對著鏡子裡的自己不斷怒吼，「鏡像」成為一種對照，\n\
  與他者或是自我的對話。\n\n特地選了黑白片的呈現方式，刻意取視覺上、敘事上的純粹。為何要用黑白影像的設定，\n如同導演所說，這是沈重的題材，但是他不想要表演也變得沈重，所以他就在影像上下功\n\
  夫，直接賦予電影灰色苦悶壓抑的慘淡氣息，黑白退去色彩就宛如這些角色在這個世界戮\n力生存，奮力掙扎的尋找生命的色彩。\n\n電影開場是一個很長的定鏡，夏于喬騎著車從遠處逐漸迎向鏡頭，幾乎是大遠景到特寫。\n\
  我們可以看作是導演林書宇把我們未曾見過的夏于喬重新找回來，從深處挖掘，緩緩推進\n觀眾眼前，這個出場戲很厲害，懸念與驚訝兼具。而後這個類似的鏡頭之後又出現一次，\n\
  （如果我的印象沒有錯）幾乎都是當有心境或情境上的轉變，就會出現。\n\n期待重生的小雁用「表演訓練班」來改造自己，蠻意外編導會用表演訓練帶出戲中人的身\n分認同與心理療癒；角色透過情緒的揣摩進而了解自己，更透過戲中戲角色的扮演而得到\n\
  轉移釋放，讓角色弧度的轉變在跳躍式的剪接下也有完整的說服力。\n\n金馬影后楊貴媚詮釋的情勒寂寞母親，在草根氣息中流露母性的溫暖，在小奸小惡的貪婪\n底下還有一絲良知，楊貴媚表演豐厚強大。曾國城完全洗去綜藝天王的形象，將一個貪婪\n\
  爆烈的男子演繹的相當傳神。\n\n而女主角夏于喬更是幾乎全情投入，與楊貴媚的母女吵架對手戲很精彩；一幕穿著孝女白\n琴的服裝，一鏡到底的大量獨白與情緒起伏波動，難度很高，是其從影最佳表現。\n\
  \n\n\n\n--"
