url: https://www.ptt.cc/bbs/movie/M.1728780969.A.830.html
title: '[好雷]小雁與吳愛麗 真的很好看..'
content: '看影片很怕說教，還有太文青。


  台灣拍的影片如果不是搞笑片，大概有87%會有文青台詞。


  好在這部我看的時候沒有那種感覺。




  不想暴雷，只是說感想。  就是很好看。 劇情的鋪排其實我覺得很順暢。


  不會讓人有前段緩慢，後面才很順的感覺。



  裡面竟然也有茄子蛋黃奇斌(說實話現在歌手實在太多了，或者我們年紀太大了


  我跟我妹都不知道他是誰，只覺得那個腳色演得很自然)。事後演員表看到xx斌


  我才突然覺得不會就是那個唱浪流連的那個吧? 跟我妹敘述的時候


  只能講歌名(連團名都記不起來QQ)



  夏于喬裡面有一場戲，很厲害，一鏡到底的，去看的都知道我說的是哪一幕。



  我看片都是幾乎看人家感想才跑去看，然後盡量只偷瞄好不好看的字眼，劇情盡量


  不看。所以說實在這部片編導演到底是誰我都不知道(然後會盡量避開文青片)




  很感謝這個周末有這部好片陪我們度過。



  PS1. 不小心意外地看了高雄遠百導演演員出來交流的場次。真的是驚喜，這部戲到看完


  所有字幕都沒人離座，不知道是否大家事前就知道了，還是都在沉澱並欣賞辛苦的工作


  人員的列表。



  PS2. 高雄大遠百威秀的蚊子超多的，整場癢。冷氣超強。整場都在抓癢跟防冷


  ，沒人反應嗎? 奉勸之後要去大遠百看的人一定要長袖長褲加球鞋。


  否則會像我一樣，一直等電影甚麼時候結束(電影本身沒有不耐感，但是蚊子太可怕了)


  --'
