url: https://www.ptt.cc/bbs/movie/M.1729042557.A.138.html
title: '[好雷] 辣椒醬與生身血肉：《小雁與吳愛麗》'
content: "內文有雷且具個人觀點，推薦觀影後再讀。\n\n　　　　本片場次有限，有意還請把握。\n\n\n\n　　　　圖文網頁版：\n\n　　　　\n\n\n\
  　　　　預告片：\n\n　　　　\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\n\
  \n辣椒醬與生身血肉：《小雁與吳愛麗》\n\n\n\n\n\n　　看完《小雁與吳愛麗》過了好一段時間之後，我想到生日蛋糕。\n\n\n\n　　生身血緣的關係，大概像切生日蛋糕：有的時候，蠟燭吹滅，入口柔軟\n\
  \n甜美，除了太多了煩膩，或偶爾不合口味，大多出自幸福；有的時候，切的\n\n不是蛋糕，而是彼此的血肉，張裂的缺口，過了好幾年都沒有痊癒，卻還是\n\n記著：為什麼，你在那時候給的，不是蛋糕？\n\
  \n\n\n\n\n「你只會說你失去了什麼\n\n我失去了整個家」\n\n\n\n　　因為父親家暴，即使早就逃開家裡好幾年，小雁（夏于喬飾）為了保護\n\n母親（楊貴媚飾）意外弒父，浴著父親的血走到派出所，判了八年。對於這\n\
  \n件事，母親是怨她的，讓她同時失去了丈夫和女兒。八年後回到老家，小雁\n\n因為仁哥（曾國城飾）對母親施暴，喚起過往恐懼的環境使她再次決定要帶\n\n走同父異母的弟弟小偉，母親怨她：「養你養那麼大，你為了他把我丟下。」\n\
  \n女兒怨她不離開，就說「我都是為了你啊」。母親的不如意來自對現實的無\n\n力感，女兒的怨恨則來自母親不滿意自己的人生，卻又以「我想要給你一個\n\n完整的家」為由，強迫女兒接受相同的、被暴力陰影籠罩的生活方式，即使\n\
  \n女兒都為她計畫好了，母親卻不肯離開，「我要折磨他一輩子，他憑什麼得\n\n到快樂」，就在這一瞬間，打破了「母愛」與「自我犧牲」的神話，母親的\n\n懦弱與恨，賠進了女兒的人生。\n\
  \n\n\n　　血緣是粘連不癒的傷口。愛變成了詛咒。女兒苦苦被恨困著，「我不想\n\n再恨了」。那刀是，愛為動機，割出了恨，即使有蛋糕，也要拐彎抹角，不\n\n\
  知道怎麼關心，說的全是反話，是勒索，是用我的價值觀套在你身上。\n\n\n\n　　被殺掉的父親陰魂不散，孤身一人的母親找了仁哥來填補缺口，讓自己\n\n能藉由賣彩券作假活下去，生活也在每每送來的食物溫度裡，有了情感的依\n\
  \n靠。「我都這把年紀了」還是要陪伴，「我寂寞啊，我寂寞不行嗎？」能說\n\n出需求的母親，是想使生命完整，但無論是小雁的母親還是小偉的母親李雅\n\n雯（葉全真飾），她們的對象都只有一個條件：「他對我很好」，好到喝了\n\
  \n酒或不順意就用暴力處理衝突，相信對方說會離婚，離開時孩子已經大到無\n\n法中止妊娠……是因為出身重男輕女的家庭，太過缺乏愛的關係嗎？女兒出\n\n了獄，母親擺脫了暴力，女性的處境仍是天羅地網，步步驚心，是掐著頸項\n\
  \n的雙手：你不聽話，那就別活。那個被掐的，往往是身邊聽話柔順、「低我\n\n一等」的、自願跳進去、無法離開的女人。母親在那一刻，會不會想過，還\n\n好，不是女兒？\n\
  \n\n\n　　慶幸的是，女兒堅決離家，不願成就母親的殘缺家庭，連同她付出的八\n\n年，母親終於意識到，女兒不是自己的分身，不是自己，她要愛她，就要以\n\n\
  她的立場著想，女兒察覺在賣假彩券的反應，眼前男人的賤視無情，讓母親\n\n作出了艱難的抉擇──為了求生。\n\n\n\n\n\n「我有得選嗎」\n\n\n\n\
  　　出身重男輕女家庭的女性，離開家庭後要求生，更求愛。愛應該是與求\n\n生分開，才能獨立清楚，而非用愛寄生，賠盡自我。但對女性來說，求生的\n\n困境太難、陷阱太多，求愛同時求生，唯一途徑就是犧牲。「可是那都是你\n\
  \n自己選的，都是你自己要嫁給他」、「我就是嫁給你爸」，女兒接著怒喊：\n\n「我根本就不想生在這個家，我有得選嗎？」「有人叫你犧牲嗎？這都是你\n\n自己選的！」往往要過很久，很久，才會意識到，大多時候母親，也是沒有\n\
  \n得選的。女人和女人的戰爭，多是先被男人摧殘了，再互相敵對，說，你為\n\n什麼不站在我這邊。\n\n\n\n　　不符合自己的理想，母女彼此討厭，對待父親外遇生的弟弟小偉（謝以\n\
  \n樂飾），與對待彼此的方式亦如此近似：是麻煩，但是放不下。只是她們彼\n\n此是放不下，所以麻煩。小偉是他們的反射鏡，表面上是不請自來、無意豢\n\n養的麻煩，是血緣亦非血緣，「他不要你了啦」，其實是他們被拋棄的內在\n\
  \n小孩：在大人吵架、推卻自己的存在時，讓自己摔下來中斷；在沒有身份的\n\n時候，乖乖待在角落，乖乖等著那個說「一個月後會來接我」的媽媽；坐摩\n\n托車時手乖乖撐在後面，在洗手檯乖乖扭褲子的水……在他身上，可以看到\n\
  \n所有在家不被愛，但還努力想要被愛的小孩會有的樣子：乖巧、倔強、貼心、\n\n脆弱、懂事。\n\n\n\n　　無處容身。\n\n\n\n\n\n「我怎麼會養出你這種女兒」\n\
  \n\n\n　　大概很少有女性會對小三的孩子好，除了不忍。最親的母女相對，往往\n\n先向彼此投擲怨懟；小偉的存在，讓母女都看到彼此的無辜，收起了怨，有\n\n\
  善待內在小孩的機會，那個總是會被要求「要乖」、「要堅強」的內在小孩，\n\n那個已經哭不出「他不要你了啦」的內在小孩，先看到被忽視的自己，才能\n\n看到對方神似自己的、傷痕累累的臉。母親因為小偉，重新面對了淡化、但\n\
  \n從未消逝的丈夫；照片裡的爸爸，小偉想要的卻得不到的，是母女共有的愛\n\n恨交織。\n\n\n\n　　而女兒，再次逃離了家，找到工作，改頭換面，還去上了表演課，表演\n\
  \n自己被中斷的才華，挖掘內在的創傷，對著鏡子說：吳愛麗，我討厭你；在\n\n老師（張詩盈飾）的引導下，掩藏在孝女白琴的帽子裡，傾訴無法當孝女的\n\n自責，更傾訴對父親愛而不得的恨。既弒父又弒母（拒絕當母親的女兒），\n\
  \n雖然要經歷自我厭惡的折磨，但要承認自己不孝，承認「我不是吳愛麗」，\n\n更生的女兒才能活出自己的人生。母親則要承認自己不是女兒的母親，掙脫\n\n那雙扼住自己脖子的手，不再催眠自己窒息，對方也會無法呼吸，才能求生。\n\
  \n慶幸的是，女兒沒有爸爸可以選擇，母親沒有兒子可以選擇，她們只有彼此，\n\n只能愛彼此，也真的愛彼此。那個「真」在細節裡，讓我相信辣椒醬的滋味\n\n是值得懷念的，而不是生身血肉不得不嚥。結尾要不要回家的對話，辣椒醬\n\
  \n的面對與找尋，帶出了名字，始終是父母給予子女的，最短的咒語；而怎麼\n\n稱呼，也關乎一個人如何與他人連結的，選擇。\n\n\n\n\n\n「好好生活，都會好的。」\n\
  \n\n\n　　脫離地獄的都是更生人。愛能傳遞給對方，是一種必須學習的能力：必\n\n須承認你是另一個與我不同的女人，我才能因為你是「母親」／「女兒」而\n\n\
  愛你。也在這個時刻，她們終能成為女兒的母親，和母親的女兒。先承認討\n\n厭彼此，才能說我愛你，我還是愛你。這是為什麼，片名叫「小雁與吳愛麗」。\n\n\n\n\
  　　「吳愛麗」喚名背後的情感，是經歷過努力的選擇，與真心。迷途的女\n\n兒與求生的母親，終於找到了一起回家的路。\n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n\
  我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\n                                  陳斐雯  貓蚤札（其三）\n\
  \n--"
