title: '[好雷] 小雁與吳愛麗 可能只有林書宇粉會看'
content: '雷文防雷資訊頁






  先說個結論好了。

  好不好看，好看。

  但是票房很難


  我從這上映表出來就知道票房肯定慘

  整個大台北只有三間威秀有上

  其他城市也少了好多影院


  不要說大廳了，我覺得不要排最小廳都對得起首週



  導演演員場，開了西門威秀最大廳

  結果連中央區都坐不滿


  最近大片太多了，我連要安麗朋友看小雁與吳愛麗都非常困難，國片+黑白

  這種組合之前成功過的只有大佛+，但那是建立在搞笑預告上的。


  預測第二週直接最小廳，第三週消失不見

  之後要看請去金馬影展







  好了，前面講了這麼多票房討論

  現在開始爆雷，沒看過請絕對不要繼續看

  絕對影響觀影體驗









  ------------------------------------


  曾國城演技真的是一大亮點，我從來沒想過曾國城這麼會演戲，尤其還是客家話臺詞。

  另外曾國城屁股畫面大約開演10分鐘就會出現，預告其實也有幾秒。


  表演課分成4次上課，每次都有字幕跟你說這是第幾次課程


  自我介紹、大笑、繞口令、對鏡子罵自己、戲服腳色扮演


  夏于喬戲裡戲外都上表演課，這部片根本就是表演課推廣片，告訴你UBER司機、洗衣廠員工

  、小學老師都可以上表演課。



  我看完小雁與吳愛麗有個感覺，我也想去上表演課




  劇情最後高潮，我以為弒父2.0要開始了，還好有被阻止，後來想想，林書宇應該也不會允

  許這種事情出現在他的電影裡吧。



  最後《小雁與吳愛麗》的意思，不是之前FB留言猜的那個意思啦。




  (我喜歡看完電影馬上寫文記錄當下心得，文字方面就不多潤飾，只記錄真實感受。)



  --

  我甚至星期三買票的時候還不知道這場會有導演來。

  只看剛好是比較大的廳就買了。

  算是一個驚喜吧。

  他電影不多，不需要排前三。

  有些電影很根據個人經驗改編而來例如《九降風》、《百日告別》

  (雖然沒看過，但是我猜《跳傘小孩》也是相同道理)


  然後《星空》大成本大製作，梵谷、吉米、五月天 強強強聯手，要爛也難

  新光影城也沒上'
