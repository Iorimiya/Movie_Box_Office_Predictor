title: '[好雷] 小雁與吳愛麗'
content: '場景在高雄美濃

  美濃粄條客家人的地盤

  曾國城裏面演客家人

  講很多客家話

  一開場就夏宇喬滿身是血

  騎機車拿刀去警局投案自首

  應該是殺了他爸

  因為她爸家暴她媽

  她媽是楊貴媚

  楊貴媚被葉全真劈腿

  老公跟葉全真有個兒子

  但老公被女兒幹掉了

  女兒做了八年牢放出來

  葉全真把兒子丟給夏宇喬

  然後就人間蒸發了

  也就是兒子跟夏宇喬是同父異母的親姊弟

  楊貴媚當然不想養，但葉全真不見只能收留

  寫到這真是有夠亂，實在不喜歡林書宇的戲

  雖然他會拍戲，技術很好，但實在不喜歡

  他幫豆導拍的軍中樂園到還很好看

  主要因為導演不是他

  他就像姜瑞智幫顏正國拍角頭2一樣

  是很棒的副導跟執行導演

  但自己拍的戲都沒甚麼票房

  從九降風、星空、美國女孩、到吳愛麗等

  都覺得很多美中不足的部分，編導很有問題

  技術當然沒話說，跟徐漢強有得比

  都是技術好但編導功力差強人意有夠爛

  還需要被大導演多多調教一下

  可以多去探豆導的監跟他討教討教怎麼編導票房大片




  --'
