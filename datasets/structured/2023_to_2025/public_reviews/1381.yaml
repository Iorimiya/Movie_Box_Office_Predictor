url: https://www.ptt.cc/bbs/movie/M.1711180312.A.CDD.html
title: '[新聞] 《周處除三害》考倒陸網友 為何台灣禁帶'
content: '《周處除三害》考倒陸網友「為何台灣禁帶百香果探監」 矯正署給答案


  林毅


  2024年3月23日 週六 上午12:25




  《周處除三害》在大陸也颳起旋風，但不少大陸網友疑惑電影中提到，為何台灣探監不能

  帶百香果。(示意圖／資料照、賴佑維攝)


  主演的《》席捲全台票房，更在大陸刷出25億台幣的好成績。


  不過電影中提到「」規定，讓大陸網友看得霧煞煞，疑惑到底為什麼？

  對此矯正署也給答案。


  有大陸女網友在「小紅書」PO文分享看過《周處除三害》心得，認為非常好看，但卻無法

  理解為何台灣監獄探監不能帶百香果，「我知道拉鏈可以變成繩索，筆可以當作匕首，但

  百香果到底能幹嘛？釀酒孝敬黑幫老大嗎？」


  根據矯正署「寄（送）入飲食注意事項」公告，若食品是無法檢查檢查後產生質變或無法

  再食用，即屬禁止送入監獄物品，例如茶葉、勾芡湯汁、粉狀和流質食物都在內。


  此外，沒有切或剁的魚、肉類；沒切開或撥開的海鮮、沒開罐罐頭，以及其他客觀認定無

  法檢查或檢查後產生質變，或無法再吃的食品，如糖果、粽子、米粉也都是禁品。


  矯正署指出，百香果除了是液態狀，也符合沒去殼水果的定義，同時符合2種禁止送入監

  規定，液態食物不僅檢查程序耗時，還容易被混入毒品或藥物，若需符合規定，必須將液

  體全部去除，但這樣就毫無食用價值，因此經過考量後歸入違禁品。


  新聞網址：




  --'
