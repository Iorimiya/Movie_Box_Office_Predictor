url: https://www.ptt.cc/bbs/movie/M.1698284941.A.A49.html
title: '[討論] 周處除三害  癌症的藥可以亂吃？'
content: '以下防雷
























  貴卿(地下女醫師)讓阮經天以為自己得了

  肺癌末期

  阮經天片中有在服藥

  在澎湖邪教那邊昏倒，

  蒙古大夫(後來拿X光片那位)跟尊者說：

  「這個藥是肺癌末期在吃的」

  (假設蒙古大夫還是有些醫學常識)



  據我所知，藥物回收的時候

  一般藥物可以丟垃圾桶讓垃圾車載去

  焚化，但癌症藥物不行




  其實阮經天根本沒得癌症

  肺癌末期的藥可以這樣隨便吃嗎？

  沒死都剩半條命了吧？

  而且，應該很貴吧？


  --

  我標題有改過，這樣還算暴雷的話

  你電影都不要看預告


  我標題不寫討論的重點

  誰知道要問什麼？

  這也是在節省大家時間

  更何況，肺癌末期是在剛開始不久就演了


  事實上,原本的標題我有仔細審視

  我認為我已經避開爆雷了

  有人聯想力這麼強我也沒辦法'
