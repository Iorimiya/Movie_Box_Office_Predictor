url: https://www.ptt.cc/bbs/movie/M.1696863108.A.D3D.html
title: '[好無雷] 周處除三害 -  懸疑、過癮、寧靜'
content: '《周處除三害》 懸疑、過癮、寧靜 9/10分


  會想要進戲院看這部片的原因是因為導演黃精甫

  雖然阮經天感覺在戲中也很有料

  但拜託！黃精甫欸！

  他第一部長片《江湖》就得了香港金像獎的最佳新導演

  《江湖》的演員陣容更扯：

  劉德華、張學友、余文樂、陳冠希、吳倩蓮、曾志偉、林家棟

  阮經天OK 但沒有劉德華、陳冠希猛吧

  《江湖》這部片在角色、台詞、劇情安排上都很有意思 很推薦大家找來看

  另一部看過黃精甫導的片是《惡戰》

  劇情沒啥好說

  但動作戲屌炸天 超炫砲超過癮

  所以自然對於《周處除三害》也會有以上的期待

  -

  預告打著各種「台灣最惡」、「國片最黑暗」之類的宣傳詞

  害我以為真的多泯滅人性

  其實也還好

  不過在很多地方都更簡單俐落

  也少了很多國片會有的老梗橋段

  沒有七七八八在那邊搞一些破爛笑話

  而是用引人入勝的劇情帶著觀眾前進

  有一說一沉穩地推進著劇情

  就連最後尾段也是收得絕妙與富有巧思

  「阮經天真的是周處嗎？」 看完值得好好思考

  -

  這部片少了我原本的動作與運鏡期待

  但卻在劇情與橋段上更令我驚喜

  （Btw 本片編劇也是黃精甫）

  邊看腦中不自覺地腦補各種電影影子 像是：

  北野武  暴力中的柔情與海

  昆汀 血腥的爽快

  《傑克蓋的房子》  老天相助

  《仲夏魘》 的宗教

  甚至要說致敬《少林足球》也是有跡可循啦！！

  反正這隨人講 大家聽聽就好

  -

  而且片中每位配角也都好會演

  從來不知道李李仁可以這麼滄桑的帥

  還有陳以文也是演出新高度

  -

  總之《周處除三害》

  在劇本、演員、畫面皆屬上乘

  尤其在劇本上的絕妙安排

  真有一種昆汀的爽快感

  與北野武的硬漢柔情

  推薦給大家

  -

  難得能看到這麼滿意的國片

  沒想到導演卻是香港人啊….


  --


  無雷 電影/影集短評IG：




  --'
