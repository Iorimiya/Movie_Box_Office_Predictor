url: https://www.ptt.cc/bbs/movie/M.1710480856.A.F5B.html
title: '[負雷] 周處除三害'
content: '先說結論：浪費我兩個多小時


  整部片只有陳以文演技在水準之上

  連阮經天都還好

  更慘的就是面癱型演技的王淨

  這部的王淨到底在演什麼

  完全就是一台面無表情的讀稿機


  再來整部劇情毫無邏輯

  感覺想講什麼大道理但表現出來的毫無意義

  從來沒看過要諷刺一件事拍的這麼直白

  邪教那段根本流水帳又老套

  看的時候完全沒有感覺諷刺感

  只覺得在看小學生日記

  剪輯也超怪

  剪的有夠碎讓節奏變很怪

  也導致分鏡也很怪

  譬如陳桂林在旅店偷窺對面的理髮廳

  光陳桂林側臉望著窗戶的畫面短短幾分鐘就重複好幾次有夠無意義又煩躁


  然後也一堆無意義的鏡頭

  車子送王淨後目送陳桂林離開

  有個遠景的鏡頭又再一個後照鏡的鏡頭

  後照鏡畫面重複又沒意義

  尊者在地下室他老婆突然出現說懷孕了

  這資訊有夠沒意義又突兀

  對尊者的角色塑造有任何幫助嗎？？

  懂不懂留白啊…


  講到角色塑造就是整部最爛的地方

  李李仁那警察角色到底在幹麻？？

  整部片就一直打輸抓不到人

  最後反而同情陳桂林？？

  我也不知道是不是同情啦因為那情感轉折根本不知道是啥小


  王淨角色也是

  陳桂林只是要殺人不是想救妳欸

  完全沒有產生什麼火花也沒更多的互動

  最後對陳桂林的感情到底是？？


  最後就是主角陳桂林

  前面就像個會獲取情報利用各種手段的機智殺手

  到邪教那段瞬間變白癡

  什麼都不懷疑就相信尊者了？

  明明就是為了成名而去殺人

  到最後到底懺悔了什麼贖罪了什麼？

  被抓時還對媒體大喊看起來一生無悔

  結果在刮鬍子時卻哭了起來？？

  是在哭幾點的



  整部片

  故事老套流水帳無意義

  角色設計爛

  演員演技爛

  剪輯爛

  分鏡爛

  畫面構圖也爛

  除了開頭追逐戰外動作戲也普通



  說難聽點

  臺灣、中國都有很多好電影

  會紅這部真的可憐


  -----

  Sent from JPTT on my iPhone


  --'
