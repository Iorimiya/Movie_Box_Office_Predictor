url: https://www.ptt.cc/bbs/movie/M.1710945417.A.7AF.html
title: '[  雷] 周處除三害心得'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  剛剛在網飛上看完

  意猶未需要釋放我的分享欲xDD


  好喜歡這種黑色幽默片！！


  列了一下三個最愛的場景


  Top1 當然是教徒那段..

  首先尊者的表情很神

  我覺得有一種你奈我何的感覺

  然後尊者死掉後阮走下來聽到歌聲又返場

  倒數讓人跑

  卡彈讓人跑

  結果還是一堆不跑赴死的

  這段真的很神

  是說剛剛去聽插曲新造的人

  快被yt留言笑死…大家可以去看看


  Top2是香港仔剔鬍子那段

  鏡頭取得好棒有讓人緊張

  香港仔演技超讚…


  Top3有點難選

  可能會選阮看到x光片缺一角站在門縫的那裡

  那種被騙的荒誕感也傳達地很好


