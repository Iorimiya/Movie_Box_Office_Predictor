title: 'Re: [普負雷] 要cult不cult的周處除三害'
content: '邪典電影（英語：Cult Film）即邪門經典電影，又稱Cult片、靠片，是指那些在小圈子

  內被支持者喜愛及推崇膜拜的電影，也可稱為非主流電影或另類電影。這種電影通常未獲

  得大規模票房成功或僅有小部分影院發行放映。它指的不是一種嚴格的電影類型或風格，

  而較接近是種「地位」、「標籤」。 因為所處的地區不同，邪典電影的定義非常難下定

  論，例如香港邵氏時期的武俠片以及日本昭和的特攝片尤其是怪獸系列，常被歐美視為邪

  典電影，在當地則列入主流電影，廣泛且成功得到商業利益


  ===


  所以


  當初上映開了將近100廳


  李烈新公司的第一部片


  找阮經天跟王靜來演


  台灣找華納發行


  是Cult電影 ???????


  OK..... 你開心就好.....







  --'
