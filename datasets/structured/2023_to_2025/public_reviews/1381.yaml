url: https://www.ptt.cc/bbs/movie/M.1696261163.A.C86.html
title: '[請益] 《周處除三害》開場劇情（有雷慎入）'
content: '今天去參加了台北in89的三害生肖場




  活動規劃跟預期的差頗多


  排隊的名額


  好像是媒體或中獎未取票者的剩票


  也有工作人員宣導說可能會領不到票


  但大部分人都已經排一個多小時了


  而一直到七點半多都遲遲還沒開始發票


  中間斷斷續續搞了一陣才進場


  已經暗場開播一段時間了


  又有阿罵沒按劃位亂坐到我的位子


  也很抱歉在找位置時打擾到其他觀眾


  直到坐定開始看已經不知道開演多久了



  整部片看完我是覺得還不錯啦


  但就一開始沒看到


  映後問券提到前面好像有重大劇情


  所以想上來問一下



  ★防雷頁結束★



  我開始看的時候


  桂林已經在跟陳灰扭打準備戳眼睛了


  映後問券有個選項


  「陳桂林開頭在告別式囂張尋仇」


  想問問有看到的人


  具體劇情是怎樣的呢？


  他是跟誰有什麼什麼仇？


  誰的告別式？


  他有殺人嗎？


  有提到他為什麼會被列為三大通緝犯嗎？


  或他怎麼跟藥局醫生接上線的呢？

  （話說醫生整個造型神態好像小英 XD）


  希望有板友可以解答


  謝謝


  --'
