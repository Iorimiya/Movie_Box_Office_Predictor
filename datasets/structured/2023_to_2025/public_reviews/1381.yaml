url: https://www.ptt.cc/bbs/movie/M.1709534973.A.DA9.html
title: 'Re: [討論] 周處除三害證明不能失去中國電影市場'
content: '我覺得你根本搞不清楚

  對岸演員 搶資源有多競爭

  這些人在台灣都搶不到資源了

  到對岸跟人家大公司大團隊搶資源

  你以為是搶得贏嗎==？



  隨便一個流量小生小花

  就把他們壓在地上摩擦了

  就算他們演技爛得可怕

  但他們有粉絲就流量

  演技說真的也比不上對岸的老戲骨



  以前能過去發展的

  大部分都是在台灣就已經紅的藝人

  同時作品也有紅到對岸的

  就算是王大陸

  也有一部爆紅的我的少女時代



  你講的這些人有

  哪一部現象級爆紅的==？

  許光漢都接不到什麼好角色了

  這些人去對岸就只是路人甲乙丙而已

  除非全部簽賣身契給大公司 讓人家捧紅

  但請問他們都幾歲了=.=？



  過去想要好好演戲是不太可能啦

  當當綜藝咖撈撈錢倒是有可能

  但不會有什麼好作品


  --



  我不知道你對成功的定義是啥==

  這部片大部分都在關注張藝興 金晨 甚至王大陸

  孫陽？？？


  所以你在意的只是劉冠廷有沒有賺到錢？

  那跟一般人有什麼關係=.=？

  非粉絲的觀眾要在乎演員賺得多不多？


  他演得過李銘順的時候

  我就承認他足以代表台灣演員==

  王淨吳慷仁代言一堆沒看見?


  你可以私訊他臉書啊

  這跟一般觀眾又無關==

  跟電影也沒什麼關係


  我一度以為我來到微博粉圈了

  不說還以為一堆製作方狂邀這幾個

  是我們台灣觀眾不讓他們去似的=.=


  原文標題 我以為是在講題材的問題

  現在拍的題材 一堆對岸過不了審的

  結果只是在講演員賺好少=.=

  是是是=.=


  是 恭喜恭喜

  我是勸你不用抱太大期望

  邱瓈寬在中國真的那麽罩的話

  那些大咖在中國的演唱會 應該也都給寬魚主辦了

  但寬魚只是王力宏王心凌蔡依林羅志祥伍佰

  海外演唱會的主辦 不是中國演唱會的主辦


  歌手跟演員不太一樣啊

  王心凌也是以前就紅了 熱歌作品也一大堆

  演唱會巡演本來就是到處開的

  做專輯回台灣做

  台灣現在也沒打歌舞台 根本沒啥年輕人看台綜

  歌手開演唱會成本都要先自己團隊出捏


  演員有辦法憑自己的團隊

  拉到那麼多資金 找一堆演員

  自己拍出一部戲嗎==？

  講白一點 演員付出時間和體力領片酬

  戲紅了就賺到大量曝光

  戲賠錢他們也不用賠 片酬照領

  可憐在哪==

  這些一直有曝光但又不夠紅的演員

  該檢討的絕對不會是觀眾啦

  你要不要逛一下豆瓣

  比台灣刁的觀眾多得是

  電影圈的觀眾基本都差不多德行==

  他們有些還刁得很專業

  不像PTT一堆只會噓一句難看就跑


  阮經天應該是沒有 柯震東就不好說了

  Threads上常常刷到一堆年輕人去信義區蹲他'
