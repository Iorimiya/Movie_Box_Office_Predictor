content: '今天剛看完對這段特別有感



  （有雷慎）









  就電影內容來看非常荒謬


  是個人看著眼前有個搶手慢悠悠的換彈在一個一個射殺一定都會想跑的吧


  但依舊傻傻的站在那邊等著給人射殺


  但仔細回想整個片段都是一連串的荒繆


  什麼宗教.迷信.奇蹟


  自始自中都是荒繆的騙局


  跟前面那一段鋪成比


  這段反而還比較現實




  想起我姑丈當警察退休後


  不到1.2年就檢查出肝癌末期


  我姑姑發瘋似的求神拜佛


  半年後姑丈還是走了


  我姑姑現在還是整天跟師姐師兄在一起


  內心五味雜陳


  ----

  Sent from  on my Realme RMX3370


