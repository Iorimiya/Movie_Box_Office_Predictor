title: '[負雷] 周處除三害'
content: '篤定不進戲院看國片的我為了妹子還是破功了

  唉……..


  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  好看的預告都給你看了

  這部的順序很奇怪

  高潮都在前面

  後面的節奏拖泥帶水


  打戲的比例很少

  前段的打戲結束之後

  除害開始也就打那麼一次

  只看見男男糾纏

  怎麼打的不重要

  港仔逃脫能力真的很差

  阮經天都被拖住這麼久了

  一個可以當二號通緝要犯的

  竟然還就這樣被抓

  而且兩個人打鬥是在真空領域嗎

  就在對面房子而已兩個小弟聽不到半點聲音？

  還可以坐到人家開著車來槍殺你們？

  這種咖小當二號通緝犯是瞧不起台灣黑道還是警方我看不懂XD


  第二害就更傻眼了

  屁話一堆

  然後你從醫生旁邊經過就看的出來是同張X光片？卻看不出來那個講幹話的是你想殺的人

  ？

  真的是無言到了極點

  被埋了半天也早該缺氧了吧

  卻還是能破土而出？

  最後無差別殺人讓我想到金牌特務

  但表現出來的卻差這麼一大截

  那把槍可以叫做伸縮自如的槍

  前面不卡彈

  後面我就是要卡嚇死你阿怎麼樣

  唉…….


  額外一提

  阿季在華燈上的演技已經讓我很出戲了

  沒想到在這部還是一樣

  完全看不出喜怒哀樂驚恐失望

  要說冷靜也不是冷靜

  再加上她唸的台詞跟她的表情我實在很難融入

  所以她最後所講的反轉

  我也沒有那種 噢，原來是這樣的驚喜感



  國片真的很愛把台灣拍的舊舊破破爛爛的

  我要是外國人看到我真的會覺得阿，原來台灣就是長那樣阿


  這部拿到15年前放映的話我也覺得沒什麼違和感就是了

  下次有妹子要看國片我覺得我還是先跟她翻臉好了，省得兩個人出來都尷尬，哈






  --

  你看你都不確定了XD

  別這樣，也是有很多新大樓阿

  角度放這麼下面又是這麼一掃而過，還是好眼力阿

  有她我累積的感覺都被清空

  所以一定要拍舊公寓才有感覺就對了

  原來是觀眾不用心看阿，我還以為是國片的問題

  很多人讚的你確定不是來洗的？

  電影看的少都可以覺得不好了，你要那些精通各類劇情的怎麼接受

  什麼叫黑色電影？拍的破破舊舊就叫黑色電影？那台灣很多國片都可以叫黑色電影了

  為了吐槽而吐槽不會打那麼多，我只會打真難看然後就結束了

  很厲害欸，大家抓著X光片猛打欸，其他點說說好嗎

  如果要講X光片這樣就被看出來的話不是更智障嗎，既然弄破讓醫生這麼緊張的話，不是

  更應該拿去補起來嗎？講的很緊張然後不補救為的就是讓陳桂琳發現？哈哈哈'
