url: https://www.ptt.cc/bbs/movie/M.1710776926.A.4E3.html
title: 'Re: [負雷] 周處除三害'
content: '認同啊

  看完覺得就那個神棍演的最像神棍

  藥局醫師演到我渾身尷尬癌 口條有夠爛

  我完全沒看劇透 抱著看神片的期待來看

  看到殺香港仔的時候 覺得很悶

  很陳悶無腦的打鬥戲 警察跟他都有帶槍

  但都到最後一刻快被打掛的時候才想到要把槍拿出來

  殺完香港仔想說好無聊 下一位

  結果是神棍劇情 想說這是重頭戲吧

  結果最好發揮的神棍劇情被編得有夠無聊直白

  毫無張力 沒有打動人心的感覺 明明台灣有這麼多經典案例可以抄襲改編

  尤其那個媽媽為啥要自殺 超沒fu..

  有媽媽會拋棄還在的兒子馬上自殺? 而且明明還沒入教沒被洗腦太多

  明明有很多更好發揮的地方...

  到最後 我覺得跟醫師的談話就可以結束了 也不用說太多

  結果醫師一股腦地把核心概念說的明明白白 像是給小學生看的

  而且還是用話劇社演技念給大家聽

  接下來就是莫名其妙的女配角出場 搞得好像前面有甚麼感人的愛情鋪陳

  不過是一面之緣 真的莫名其妙

  然後是根本不需要的行刑

  根本不需要 想要封神只要在最後見醫師看見醫師在化療的樣子

  畫面特寫軟今天驚訝的表情就可以ending了

  他以為他是周處 但周處另有其人


  黑醫幫黑幫看病辦事

  本身也是害 知道自己癌末 所以想借刀殺人

  不就是周處的概念

  他自己都說了這麼直白了還看不懂喔

  還蠻有創意的概念拍成這樣沒什麼品味

  另一篇有人問阮今天終於到自己被騙

  卻完全沒有情緒起伏 也是很莫名其妙

  這叫做劇情片嗎

  結果還有人理解能力更夠低的


  一堆角色設定安排都很莫名其妙

  警察的角色除了莫名其妙的打鬥 根本很虛

  吃掉了一堆可以鋪陳劇情描繪人物的時間

  一開始吃便當的突然變成跟班 又完全沒戲份

  洗髮妹突然上演刻苦銘心的愛情

  編劇不合理情節比重設定太差

  演員口條太差 台劇不意外'
