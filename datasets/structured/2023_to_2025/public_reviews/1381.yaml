url: https://www.ptt.cc/bbs/movie/M.1711048788.A.B71.html
title: '[新聞] 中國網友喊「台灣會禁《周處除三害》」'
content: '中國網友喊「台灣會禁《周處除三害》」 台灣網友笑：你們是看二輪的


  三立新聞網


  2024年3月21日 週四 上午10:45


  娛樂中心／綜合報導




  《周處除三害》在中國斬獲亮眼票房，也掀起許多討論。（圖／一種態度電影股份有限公

  司提供）


  國片《周處除三害》在中國斬獲亮眼票房，也引起許多討論，有中國網友在看完電影後，

  竟異想天開的表示「大家猜一下什麼時候《周處除三害》在台灣會被禁掉」，令台灣網友

  笑稱「你們是看二輪的。」




  有中國網友竟覺得《周處除三害》在台灣會被禁。（圖／翻攝自推特）


  中國當局對於影視的審查、箝制愈加嚴格，深怕任何黨不喜歡的人事物映入民眾眼簾。


  但電影《周處除三害》不論是題材還是血腥、露骨的畫面，都震撼了牆內的中國人。


  因此電影上映後，各大論壇的討論重點除了劇情外，剩下就是「這部片到底怎麼通過審查

  」的疑惑。


  沒想到有中國網友以為自家的牆也包含台灣，認為《周處除三害》不久後就會在台灣被下

  架，不料卻被台灣網友無情吐槽「電影台灣去年就上映了，你們看的是二輪的」，吸引許

  多台灣人朝聖留言。


  新聞網址：




  --'
