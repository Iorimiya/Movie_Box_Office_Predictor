content: '純粹有趣分享，勿認真勿引戰


  主演是阮、李、王三位

  （是這樣說吧？都這三位在跑宣傳）

  主要戲份都在阮身上可以理解

  但電影結束後我轉頭對友人說


  直到電影結束約十五分鐘前

  （去監獄幫桂林刮鬍子前）

  李李仁的台詞只有

  ：別跑！

  ：進去！


  沒了^_^


  然後終於來了一句長一點的台詞

  ：典獄長你看看這個人用的又鈍又舊，傷不了人的，你就通融一下


  然後又沒了：）

  李仁哥台詞少到可以背起來

  天啊太逗了哈哈哈哈哈哈哈哈哈


  但沒關係，

  沒有影響到李仁哥的帥度

  武打片段有帥、各種眼神交流有帥

  這樣就夠了XDDDDDDDDDD





  --

  對耶還有這段XD謝謝補充'
