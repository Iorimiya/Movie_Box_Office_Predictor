title: '[討論] 周處除三害證明不能失去中國電影市場'
content: '周處算是很好的商業片

  就算不能像鬼家人那樣賣到3.6億

  最基本也該破億吧

  結果台灣觀眾是怎麼對待這部好片的？

  票房三千多萬

  這絕對賠本啊


  一堆台灣人等到這部片在中國上映廣受好評

  才跟著吹周處

  那當初上映時你們怎麼沒進場貢獻票房？

  還有多少台灣電影不像周處一樣有機會在中國上映而被埋沒的？


  台灣觀眾真的對不起台灣電影

  以後台灣觀眾沒有資格去罵藝人舔共了吧

  連票房都不貢獻

  害國片賠錢

  憑什麼要求人家不去追求中國市場


  人家賈玲一部賀歲片的票房

  就抵台灣全年所有電影的票房

  這麼誇張的差距


  劉冠廷、王淨、朱軒洋、王渝萱這些演員

  趕緊前進中國拍戲吧

  台灣這個市場對不起你們

  不能把你們捧成巨星

  快去中國發展吧

  張鈞甯拍一年中國電影賺的錢

  劉冠廷拍10年台灣電影都賺不到

  看到劉冠廷跟孫可芳都要快要生小孩了

  還在跟別人一起租屋

  這是劉冠廷這種等級的演員該有的待遇嗎？


  快去中國發展吧

  偶爾講一些舔共的話也沒關係

  張鈞甯的台灣代言也沒少啊


  --'
