url: https://www.ptt.cc/bbs/movie/M.1711184244.A.410.html
title: '[普負雷] 要cult不cult的周處除三害'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  先說結論，看完覺得頭很痛的一部片

  不少段落都很讓人出戲+滿頭莫名其妙


  雖然覺得導演盡力了，感覺得出來是有野心的

  希望他以後能拍出更好的片





  缺點1:這部片時長兩小時多，看完覺得可以剪掉很多追殺跟扭打的部分==


  第一part陳灰追桂林追那麼久，最後被打瞎才掏槍？？？我還以為你警察怕開槍勒

  你倒不如都不要掏槍，我還可以自己腦補你就是個堅持不用槍的警察



  第二part上樓找香港仔，想說是不是怕開槍被警察發現

  結果打了大半天最後還是開槍處理掉，好你說在荒郊野外不會被聽到

  回來在大馬路上對兩個小弟直接把子彈打光，用槍的時機點有夠莫名其妙….



  缺點2:要cult不cult的感覺讓人很躁

  這部片讓我覺得想拍cult片、但又沒脫離台灣喜歡營造鬱悶氛圍的習慣（我知道是香港人

  拍的，但就很台灣片風格）

  每個人都一副死人臉低沉腔調在講話，我以為我在看侯孝賢的電影



  邪教那段我覺得也許導演想嘗試融合兩種風格（某些畫面有昆丁跟侯孝賢的即視感？）

  但就是看了讓人覺得不倫不類，節奏很詭異

  也許是我自己吃不下去吧，畢竟這種感覺很主觀



  缺點3:不合理的橋段，想營造的感情或鋪陳都沒辦法有共鳴


  小美最後剃鬍子的感情戲完全沒感覺==阮經天演得很好但就是，蛤？你跟她很熟嗎？

  還有開到郊區然後把車子給小美==是在哈囉

  可以回市區再做這種事吧….



  陳灰最後為什麼要化敵為友？？？？他把你戳瞎欸

  你們這幾年也毫無亦敵亦友的互動啊

  憑什麼要對他那麼好

  根本超級莫名其妙==



  唯一優點：阮經天演技很好，看他很認真演一部莫名其妙的片反倒有點心酸….


  --

  邪教那一段我覺得有cult味，但又要cult不cult的

  覺得我亂用可以指正我，我虛心接受

  說的是，昆丁只是最有名而且是公認的那一個代表，更何況有些人對於cult片的解讀又不

  盡相同

  就算大家理解的是同一個概念，但認同是cult片的標準又是另一回事

  咦？我標題不是說要cult不cult嗎？哪裡有說這部是cult片了？

  沒有人覺得講英文比較厲害喔，但你既然看得懂那就好

  你有看完的話我應該說有問題的是開槍時機，被打瞎才開是腦袋有洞嗎

  我沒嫌棄武打喔，從頭到尾都在講一個合理性

  可惜看不到被刪減的片段，那段刪減感覺讓變得陳灰可有可無

  那想必您對cult的定義不同於人一般

  不然換你說說看？

  原來是要腦沒腦^_^看不懂人家在打什麼'
