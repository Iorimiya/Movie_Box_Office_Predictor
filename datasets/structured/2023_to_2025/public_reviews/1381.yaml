url: https://www.ptt.cc/bbs/movie/M.1696782387.A.7B7.html
title: '[好雷] 周處除三害 - 我忍不住去二刷了XD'
content: "我覺得蠻好看的 誘使我去二刷的 當然是 第三段的邪教橋段XD\n\n第一段 就一般的警匪追逐 殺老大 秀身手 跑天台 撞個車 標準格式\n\n\
  第二段 當然就是 香港仔 的兩場飆戲現場\n\n       比較厲害的第二場剃鬍子 我也在納悶他怎麼知道 陳在對面盯他一整晚\n\n       是不是對面旅社老闆娘也是香港仔的暗樁\
  \ 專門幫他注意有無可疑人等接近\n\n       演技很好 震攝力很夠 緊張了一下 最後載著小美 解決兩個手下畫面很帥\n\n第三段 我相信觀眾一開始應該都會猜\
  \ 尊者 就是 林祿和\n\n       只是想看劇情接下來怎麼呈現 這裡有安排給阮經天秀演技\n\n       前面都是癲狂狀態 這邊被馴化後 表情就變溫和許多\n\
  \n       因為我是二刷 所以我也有特別注意 林祿和尊者 的表情微妙變化\n\n       因為平常要強制讓自己的表情佛像化 後面真面目現形時\n\n\
  \       就是演技的展現 尊者這演員的演技也是不錯的 差異性有呈現出來\n\n\n       再來就是 大場面 了XD  我一刷時就會一直思考 這樣會不會清過頭了\n\
  \n       可是想到那場全部人圍上來喊著 殺 殺 殺 的畫面\n\n       我才釋懷這群人根本沒救了 而且我有注意他讀秒後\n\n       第一個跑的就是那四個手下中\
