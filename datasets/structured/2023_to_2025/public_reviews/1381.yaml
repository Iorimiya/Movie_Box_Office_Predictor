url: https://www.ptt.cc/bbs/movie/M.1710354791.A.7B4.html
title: '[討論] 周處除三害在對面爆紅的原因'
content: '因為好奇 剛在Netflix 上看完了

  這部優缺點很明顯 版上很多篇都說得很好

  不像是會爆紅的電影 但也不是不好的電影

  可以選擇拋開劇情邏輯 感受其氛圍


  會在對面爆紅的原因 應該是那邊的社會氣氛可能越來越緊繃

  很多人的心裡已經處於爆發邊緣 卻又必須像戲中教徒平安喜樂

  戲中邪教組織的種種作為跟中共有87趴相像

  所以潛意識中期待可以天降一位陳桂林

  當面給習大大一槍痛快 再把其他中共高層殺個乾淨

  讓自己可以成為逃跑的信徒


  理髮店妹也可以是另一種的自我帶入

  先人們受了帝國主義資本主義國民黨等荼毒

  中共趕跑這些人成立新中國

  沒想到從此欠更多 還都還不完 還要被各種狗幹

  但是陳桂林從天而降

  解決自己被脱光銬在床上的困境


  所以說看到這部在對面爆紅 感覺蠻有趣

  也許他們自己都還沒意識到自己的心裡是有多麼希望陳桂林的出現XD

  -----

  Sent from JPTT on my iPhone


  --'
