url: https://www.ptt.cc/bbs/movie/M.1696874062.A.ECE.html
title: '[微好雷] 周處除三害'
content: '先無雷結論


  覺得是部中上之作但缺點也很明顯


  不排斥國片&平常有在看國片的可以看


  裡面的動作跟鏡頭都蠻有水準的


  但一直認為國片最大的問題還是流暢度跟劇情


  以下解釋



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  主軸蠻明確的片也很好懂


  主角塑造的也很立體很有情緒

  (對，大概只有主角而已，其他角色怎麼說呢....我感受不到他們的情緒)


  整部片還算流暢，但覺得很多國片一直有如上所述的問題


  就是劇情常常會破洞，節奏忽快忽慢的感覺


  像是邪教殺人只捅一刀(還不是要害)釘一釘就埋起來


  然後阮也跟超級賽亞人一樣血條無限隨便撞幾下就出來了


  也許很多人會覺得這是瑕不掩瑜的地方 不要計較這麼多


  但這種好人如何逃脫對我來說是關鍵的轉折


  是劇情推進很重要的部分 我沒辦法忽略


  應該說感覺是編劇不知道要怎麼讓阮回去報仇 就隨便弄個不合理的主角威能


  然後搪塞過去覺得觀眾會買單


  這對我來說相當無法接受 偏偏很多國片都有這種感覺

  (西片當然也有，但國片比例偏多)


  是讓我覺得很可惜的地方 應該可以編得更完整更合理一些




  然後小美跟陳灰的角色情緒堆疊也是超級薄弱XD


  不知道是不是篇幅太短了


  總感覺有一種


  [哇你們什麼時候感情這麼好了]


  完全看不出來也很出戲


  ( 然後診所老闆講話口條也超讓我出戲的 )





  講講好的部分


  覺得阮經天演得相當好


  金馬男主如果是他我個人完全贊成


  真的會讓人有一種跟著他情緒起伏的感覺


  特別喜歡綁鞋帶和在門口食物這些謹慎的小動作 蠻細心的



  動作戲很讚 拳拳到肉相當有真實感


  整體劇情的精采、張力以及娛樂程度蠻高的


  尤其是後面邪教那段


  雖然有點拖但蠻有諷刺的創意


  手槍會卡彈、就算卡彈也要留下來等等這邊的劇情很不錯很有新意


  (原來是你知道會卡彈阿...難怪追港仔的時候最後才拿出來XD)


  一個一個殺讓觀眾好好沉浸在這種詭譎的氛圍裏面


  思考享受以及觀察畫面 我覺得還蠻用心的




  然後太常看陳以文演這種偽君子了...


  所以一看到他就覺得哩麥毫小，你就是林祿和吧XDD




  反轉的部分普普，我個人是覺得很好猜啦，


  尤其那個X光片被撕破鄭有傑還特別講一句很不合邏輯的話


  超令人懷疑




  另外就是香港仔演的超好


  真的令人不寒而慄


  在髮廊和阮對戲的那段也相當有張力





  王淨跟李李仁就不說了


  基本上他們換其他人演我也沒什麼感覺...


  因為劇情上有夠薄弱


  這部分缺點也蠻嚴重的





  大概這樣 不差的娛樂型國片啦


  但我是不會對他人說很好看，只會說還不錯可以當娛樂去看的程度而已


  --

  啊 我說的診所老闆是藥師XD'
