title: 'Re: [ 好雷] 周處除三害-台灣最好看的武打片'
content: 'Question

  如果密醫和小美要換角的話大家覺得有什麼人選呢？


  密醫我覺得琇琴應該不錯，年齡也適合。


  小美的話我心裡完全沒有人選，我自己是覺得要更柔弱一點，王淨造型和氣質就是青春俏

  麗，沒有那種可憐兮兮或純慾的感覺。


  如果可以幻想一下，年輕時的廣末涼子來演好像會很不錯XD


  歡迎大家提出討論～




  後

  什

  華

  作


  --'
