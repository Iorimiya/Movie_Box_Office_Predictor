url: https://www.ptt.cc/bbs/movie/M.1696613523.A.0D3.html
title: '[雷] 極好雷—周處除三害'
content: '先說我是工讀生我就去死


  以下沒雷安心觀賞


  這部片絕對是近年國片打戲之最

  導演很會用各種尖刺刺眼球般的畫面

  讓觀眾生理不適

  但也親身感受“刀刀見血”的感覺


  打戲運鏡很流暢

  拳拳到肉，子彈暴頭的爽感是有做出來的

  有john wick的感覺


  開頭追逐戰看yt蠻鳥的，

  但在電影院看其實很屌==

  預告片沒有的追逐戰結尾我覺得是整場追逐戰之最

  看了超級狗幹痛==


  劇情很簡單，風格滿昆汀的

  整部其實也沒要跟你說教

  也沒要美化+9

  反正就是爽片，沒在跟你屌什麼543的

  血腥程度應該也是近年國片之最

  畫面都很直接，痛給你死


  接下來講一下演技


  阮經天這部演技二封金馬我覺得有可能

  其實蠻驚訝的，

  阮經天在這部的演技夢回艋舺==

  去大陸拍一堆爛片還可以端出這演技

  算是有在用心在演吧


  然後是香港演員袁富華，應該是全劇演技最頂，讓我想到當初看毒梟帕布羅那種不怒自威的

  感覺

  講的平淡但話語都暗藏殺機，

  暴戾的性格隨時都在弦上準備噴發

  超恐怖==


  然候王淨，沒啥特別的


  李李仁，臉很凝重的老帥刑警，沒了


  陳以文，幹真的把這角色演的很靠北

  但怕暴雷這裡先不講


  ——————————————————————

  總結：這部電影以國片標準，

  滿分10分我給9分


  以國片來說有新的氣象

  不再是曲高和寡的文青片

  Or 白癡+9片

  算是有做出新高度的警匪爽片


  雖然後段和結尾有拖沓的節奏

  但我覺得瑕不掩瑜

  仍然值得一看


  推薦各位來看

  謝謝



















  --'
