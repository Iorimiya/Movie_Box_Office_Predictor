url: https://www.ptt.cc/bbs/movie/M.1709551352.A.1B8.html
title: 'Re: [討論] 周處除三害證明不能失去中國電影市場'
content: '這就是市場的影響力啊


  當年港片最輝煌的時候


  沒有中國市場


  但星爺的電影可以在台灣以及整個東南亞拿到五倍甚至十倍的成本收益


  成龍因為在日本的票房地位

  使他在80年代末期 片酬就高達500萬港幣 當時成龍的一部片酬 足以購買香港太古城10個

  大廈單位


  墨鏡王也才可以在氣病鄧光榮後

  還可以從學者蔡董手上拉到2000多萬港幣的投資


  邵氏跟嘉禾都有行銷全球的電影通路


  而台灣市場是當時最重要的指標 只要在台灣大賣的電影

  就會橫掃東南亞華人市場


  最牛逼時 台灣甚至直接封殺影帝梁家輝 導致全港電影公司沒人敢讓他拍片 整整三年多


  現在換中國了 即使中國經濟明顯下滑 但人口基數擺在那

  每年電影總票房還是持續上漲


  實話說我覺得20條(打錯了XDDDDDD)比周處深刻


  但周處確實很爽 可是台灣自己定位要清楚 吃到中國奶水

  並不是常有的事


  小成本不見得沒有巨大的票房成功


  雖然吃不到中國市場 但孤味  富都青年都是叫好叫座的好作品


  那麼片商跟導演要如何自己定位呢


  話說許承傑很久沒有作品上映了



  --


  早期台灣市場有多重要 1973年 香港打破李小龍票房紀錄的七十二房客

  這部電影電影奠定了日後港片及粵語影視作品的基礎 讓粵語作品成為香港社會的

  主流語言 但這部賣翻天的粵語電影 因為內容有左傾的現象

  逼得邵逸夫爵士 親自到台灣謝罪 還捐款給台灣電影發展協會

  這才算揭頁 封殺家輝影帝 真的算小菜一碟

  成本一億台幣 中國賣4億人民幣 分潤一億人民幣就好  就回本還大賺了

  剩下的發行 都算多賺的

  我真的覺得牛逼的形容詞俗又有力啊

  QAQ

  何止 還會硬排片咧 有一年我在上海做生意 約了妹子看電影

  結果到現場 幹 全部小時代洗版 沒有別的看影可以選擇  不得已

  我含淚買了兩張100塊人民幣的電影套票  非常矯情的電影 但人家硬排你也沒轍

  還好有吃到妹子餵的爆米花


  1984年他跟李翰祥跑去中國拍火燒圓明園 本來不至於直接封殺

  但他以本片拿到香港最年輕的金像影帝 就被封殺了

  張藝謀的最新作品 很屌的題材

  就我對中國電影的了解 分潤會在25-38%之間 當然大製作大導演跟超級演員

  可能會更高


  如果是分25% 那現在就回本了 我記得周處成本5000萬台幣左右'
