title: '[討論] 周處除三害-有關自首'
content: '-----------防雷頁------------







  周處除三害在N飛上架後, 看完第一次只覺後段轉折很爽快, 帶有後勁~


  然後透過不少推文才知道這片帶有不少隱喻. 諷刺.


  其中, 有一段關於陳桂林被黑道御用藥醫師策動去自首時, 陳入內只見警局內一堆人在等排隊自首!?


  警方無暇無心思而沒認出陳桂林, 陳也覺得怎會這樣..= =?


  後來想到, 印象中很久很久以前, 是不是有次台灣大掃黑還是什麼? 然後鼓勵自首繳槍可以從寬甚或不罰?


  然後那時被笑說, 都找小弟或囉囉去繳槍, 給官方做做績效及面子, 忙成一團有人來就好.


  如果影射的是這個梗, 那這香港導演感覺很瞭解台灣?


  可能是陳進興那時候的事了吧.



  曾經~ 我茫然前行~~


  --

  對,除一窩蜂外,還有什麼阿北閒雜人等,感覺都是"人頭",才想說是不是很久以前台灣那個勸自首繳槍的事情, 總之, 愈看梗很多.'
