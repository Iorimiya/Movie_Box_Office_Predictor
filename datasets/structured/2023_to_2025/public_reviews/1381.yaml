title: '[討論] 《周處除三害》裡的媽媽'
content: '剛看完《周處除三害》，整體劇情流暢不枯燥，給普雷。

  也因為這部片，才認識主角的原型「劉煥榮」，一個奇妙的人物。

  《周處除三害》本身是不錯的小品，但如果真的要以劉煥榮的真實故事為基底，可能要訴

  說的內容就會更深層，也更有許多令人反思或發揮的空間。


  陳桂林的背景在電影中並不是交代得太清楚，這是一個可惜的地方，不然觀眾有機會可以

  站在他的觀點，來理解他所接觸的世界。


  整部電影最深刻的部分，當屬邪教的描述。

  有一個議題是在看完之後跟朋友討論，卻得到不同想法的。


  「小胖的媽媽為何要自殺？」

  朋友認為是此時此刻的她太脆弱，再加上周遭給予壓力，讓她選擇自戕。


  但我認為，當陳桂林已拿出證據在她面前，再加上她還有一個可以付出所有的孩子，

  身為一位母親，她無論如何都不會選擇自我毀滅。


  覺得那麼乖的小胖變成孤兒好可憐T_T


  想聽聽大家的想法，謝謝。


  --'
