url: https://www.ptt.cc/bbs/movie/M.1709748882.A.BB6.html
title: 'Re: [討論] 周處除三害是因為反政治正確才爆紅？'
content: '小雷喔



  這電影反應的心境才是厲害的

  他的英文片名，鴿子、蛇、豬


  在國外鴿子是貪的意思

  因為公園餵鴿子，鴿子什麼都搶著吃


  我曾看過有民眾用套繩（活結圓圈）

  放地上，等鴿子腳來了，就拉

  抓鴿子，即使失敗，鴿子還是會為了飼料再飛回來，一直嘗試就會中


  蛇是瞋、（反正蛇的形象都滿差）


  豬是癡迷，沒什麼生活目標，


  所以片中的豬、陳桂琳，一開始也是想耍屌阿，我殺手阿，後來想當第一名


  直到意外救了小美，之後小美跟他解釋，

  她就誰救他就跟誰的人格


  陳桂琳才開始意識到，幫助人的那種神聖感，對方當你是神，他的心態才開始轉變



  所以他遇到鴿子時，那種純潔的神感

  才會讓他被騙，他本來就豬腦袋嘛



  後來又出現小胖媽媽，讓他意念回到救人

  才跳脫開殺戒



  為什麼死忠信徒不逃


  因為就如鴿子的貪，他們離不開這個生活方式，即使知道獵人在那拉繩圈


  要他們改變，就是做不到

  爽過了，怎麼走，寧願死阿。



  。


  --'
