url: https://www.ptt.cc/bbs/movie/M.1709634525.A.E0B.html
title: 'Re: [討論] 周處除三害在台灣不火在中國超火'
content: '大陸春節檔都是闔家歡電影，只有張藝謀的沉重一些



  我正在看周處，看到57分了


  只能説，暴力美學在哪呢？依然是台灣文青電影的沉悶敘事尷尬演技，武戲沒有亮點


  就是有一群大陸廢物文青，還是被上世紀港片荼毒過腦袋的


  把荷爾蒙的發泄程度等同於片子水準


  就我目前看，7分都到不了啊



  --

  世界最長城市中軸線  成都，150公里




  --


  劉德華的暗戰 天若有情 法國的終極追殺令

  影子太嚴重了，雜糅的二流片子



  我看完了，凡是小美有關的片段，真的又臭又長，標準文青手法，都是用呆滯表現文藝氣息


  好惡。'
