title: '[新聞] 《周處除三害》男星權樂證實過世 享年32'
content: '32歲單口喜劇演員權樂曾，飾演「尊者」陳以文身後

  的信徒，在。



  他，17日更傳出他已經

  過世的消息。對此，。



  權樂透過卡米地喜劇俱樂部舉辦自己的第二場專場「腦洞大開」，首演於15日登場，然而他

  本人當天卻莫名缺席了演出。據現場網友分享，主持人一個人撐了2個小時，且沒有人

  聯絡得到權樂本尊。


  對此，《ETtoday星光雲》致電給後續場次的場地詢問，包含新竹、高雄場，對方皆低調

  表示「演出確定取消」，至於退票或相關原因則要等卡米地喜劇俱樂部公布。據了解，

  場地方是在「17日凌晨」收到取消的通知，相當臨時。


  此前，百靈果的Ken跟凱莉曾公開大讚權樂，表示「一開始接觸台灣喜劇時，最先遇到也

  覺得最有趣的喜劇演員就是他」。




  博恩也給出「喜劇演員的喜劇演員」的讚譽，他的表演風格荒誕，且題材相當禁忌，雖然

  小眾但仍舊擄獲不少民眾的心，而他的離開也讓喜劇圈相當惋惜。


  ———————————————————————


  心得：我跟權樂也算是小有認識，看到他獲選《周處除三害》氛圍演員有搶眼的演出，想說

  還蠻期待他能繼續繳出其他代表作，可惜他的電影處女作，也變成絕響了..


  Rest In Peace，也感謝他對台灣現場喜劇的貢獻


  PS：

  1.權樂生前專場企劃《腦洞大開》目前確定剩下的5場表演（包括台北4/18-19的兩場）

  全數取消


  2.更讓喜劇迷感傷的是，權樂在上週二（3/11）才剛度過生日..


  --'
