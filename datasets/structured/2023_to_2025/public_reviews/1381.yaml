url: https://www.ptt.cc/bbs/movie/M.1709447299.A.274.html
title: '[好雷]周處除三害~後面看的很爽快~'
content: '之前就聽聞這部票房不錯, 以及相關爭議.

  結果前2天看到N飛上了, 立馬點來看~






  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  其實題材對我來說還好, 但看了後面陳桂林對待邪教, 真的是一整個驚艷!


  直接好雷了~>< 很少戲敢這樣演, 尤其偽善又衛道的台灣.


  陳桂林: 排名通緝榜第三大, 一開始為了奶奶挺而走險犯罪, 但奶奶也知道這錢來歷, 一毛都不用, 後來奶奶走了, 又因肺癌第4期, 而有不同體悟, 決定大幹一票讓世人記得他名字!
  也成功了!


  最後小美在獄中幫他剔鬍子, 他流下了眼淚, 應該不是怕死, 而是想不到還有一個關心他的人.


  程小美: 有人說她其實可有可無, 但她的戲份有帶到一點: 香港仔從別人手中救出她媽.. 陳桂林又適巧香港仔手中救出小美, 有時是一種環境問題, 為何社會新聞常有女子被暴力對待,
  甚至死亡, 還是不離開這類人渣? 是有些女子覺得, 離開了換個人還不是都一樣?

  現實中, "英雄救美"大多是電影.漫畫情節.


  張貴卿: 地下藥醫師, 初見下長的很像我們尊貴的蔡總統(已修正用詞,勿戰), 而演出時想說她怎麼沉悶無生氣, 後面真相大白, 原來時日無多, 愛兒怎麼辦? 才想說是否長期幫忙道上弟兄的報應,
  想做做善事彌補吧.


  香港仔: 通緝榜第二, 演出中規中矩, 不過有幾幕氣勢不錯, 另那時有回憶了一下, 台灣當初十大通緝犯, 外國人嗎? 印象最的還是陳進興. 張鍚明等人.


  林碌和: 通緝榜第一, 轉職為"尊者", 這類邪教, 常利用人的急迫需要或心靈空虛, 斂財斂色開後宮.


  後來陳桂林要槍殺前, 想說林怎麼那麼淡定? 有了權勢金錢難道不怕死(失去)?,


  再重看了一次, 前2槍他臉部有抽蓄了一下, 只是沒什麼大動作, EX.叫信徒組人牆, 最後被爆頭.


  原先我覺得束以待斃有點不合理, 但後來想想, 是不是林本來就對"生命"較麻木無感, 包括他自己的,


  因他有說, 隨便一場天災死多少? 多殺幾個又怎樣之類的~ 所以自己死了就算了.


  陳灰: 人一出場身上就帶戲, 可惜戲份不多, 這個角色我才覺得沒有也沒差.


  最後還是要提, 肅清邪教那段~ 或許有人覺得說, 留下的信徒一無所有或迷信沒救, 但罪不致死.


  但, 當他們個個喊"殺", 霸凌甚至殺害質疑.反抗的人時, 是否都是共犯?


  螢幕中個個信徒竟看著割頸刺胸濺血都能面不改色, 可見已習以為常, 到底還有多少是這樣直/間接死在他們手裡的?


  最後陳一個個槍決, 或許是中間有被騙(病情好轉,痛苦流涕想改過), 聽到歌森77?


  還是覺得這些人, 將來可能又會再害人(換尊母繼位,肚裡的再繼承), 那倒不如再當做好事, 剷除真正"執迷不悟"的人?


  最後就是笑著服刑, 或許當下是因成名而笑, 或許是覺得除掉自己也是好事, 也不會跟醫師騙他的事計較, 總之, 光後段就值回票價囉~

  --

  沒要戰,只是真的覺得很像,已修正用詞,謝謝.

  不跑的看的出很死忠..

  教母不知是迷信過頭,還是已覺尊者死了生無可戀.

  對,第2次我還特別看這個打到腿的怎就不動了.

  一般電影情節,應該是從後突襲環抱,大吼尊者快走!

  就絶望無措吧,當下又突然遞刀要她殺人,最後崩潰選擇登出.

  其實不少信徒都站起來不畏槍勢,總比傻賭9槍遊戲好,而且林殺了好幾個警察, 不是沒槍戰過

  且被爆頭後,大多信徒也沒啥反應,不知是教條導致無所畏, 還是洗腦太成功,下口令才有動作?不然不會傻等陳裝填子彈.

  像台灣有些加入的是因原人際邊緣,或求認同感,或妹子多,以為能近水樓台,或心靈空虛想找信仰依靠.

  只有宗教及部份團體會接納他們,在群體時智降+氣氛會仗勢膽加入霸凌,忠誠度低.

  前/中覺得就一般+9片,想幹掉各方角頭當大哥出名那種心態.

  後面陳看著都要被爆頭了,卻還能對著自己傻笑的信徒,也覺得荒謬,連陳也笑了.

  微笑行刑,微笑接受,最後可能覺得尊母歌聲不錯,唱完才KO.

  說真的,依台灣來說帶頭的不在了,邪教解散了,法官一定是輕判各信徒共犯,最後要求家人自行帶回教化,眼不見為淨.

  想到以前某神教,教主被爆擁一堆名車,暴力影片也有,但教徒還是深信不疑,跪著痛哭流涕求智慧,求消業障~

  事發後這幾年變很低調很低調,不強出頭,私下運用大數法則及團體氛圍足矣.'
