url: https://www.ptt.cc/bbs/movie/M.1711205323.A.70A.html
title: 'Re: [普負雷] 要cult不cult的周處除三害'
content: '小弟我的感覺啦～

  陳桂林在入邪教的洗禮，那段大喊我是罪人的時刻，才明白了自己前面所作所為多麼糟糕

  和罄竹難書～

  一開始是想要上分留名，到最後殺掉教主的時候說你果然該死，心態已經從揚名到想要除

  掉禍害了，否則後面也不會特別回頭清理剩下的邪教徒


  而他意識到自己的罪孽，對醫生的謊言不生氣，坦然接受死刑，還有那句我對不起社會，

  完成了他心境的轉變


  至於小美那段，應該象徵他人生中少數良善的部分，彷彿擁抱自己最後屬於善的部分，承

  受該有的懲罰，然後堂堂正正死去～


  我想陳灰也是多少欣慰他除掉榜一榜二，所以在陳桂林將死的過程抱持最大的善意吧。

  這是我的觀影心得啦，請大家鞭小力～


  --'
