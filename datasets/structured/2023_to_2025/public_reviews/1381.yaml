url: https://www.ptt.cc/bbs/movie/M.1711334251.A.F6F.html
title: '[雷] 周處除三害'
content: '當初上映時朋友就狂推，不過我對黑道片缺乏興趣一直放置，最近上串流大家都在討論加上

  衍生的迷因都很好笑就來補這部片，隨性寫寫，手機排版請見諒


  看完私心大概60分，電視轉到能看的程度吧


  這部片最可惜的就是沒用台語拍，黑道片該有的狠凶，用台語比較容易讓人有深厚印象,這

  片大部分的台詞我覺得都太軟趴趴，只能用演員本身的底子去演出挺可惜的，尤其是開頭主

  角請示關聖帝君那段，完全尬到不行，腦中直接轉換成一般信徒會怎麼拿著杯跟神明請示的

  口吻（但結尾面對尊者開槍那段我覺得超級好笑）


  還有就是我能理解為了打戲，弄得好像沒有槍的存在，但這部都是後來還是會掏出槍XD  開

  場跟李李仁的打鬥，根本前面一堆開槍時機，結果被打的都失明了才拿出來 超莫名的，還

  有跟香港仔打半天結果拿出槍收尾，你要打前面就可以拿出來一路殺小弟殺到香港仔前面了

  吧..不然兩個人扭打前就能用了啊，我自己只能腦部開槍是引起周遭注意 一個完事放煙火

  的概念


  然後是主線的兩個boss， 兩個故事，邪教表現的完整性比較好，從無知到被洗腦再到覺醒


  香港仔這段就可惜了，明明說子彈卡在腦袋需要止痛藥，但演出頭沒痛幾次，也不夠瘋（明

  明腦袋有問題沒錯啊），跟以前香港電影出現的黑道比較起來，香港仔看起來是只會欺負小

  弟女人的協咖，應該安排一段幹大事的橋段而不是一直嘴巴說要去弄誰但根本沒行動就掛了

  ，雖然養女讓人很出戲而且很多人批評，但具有暴力血腥元素的電影都會有個典型女主角賣

  肉或賣慘，我反而對這沒甚麼意見，但載女主角走順手殺小弟那段，如果改成是在鬆綁的時

  候殺掉來查看大哥的小弟，在拯救女人這個事件應該表現起來更俠一點（把車送人超想吐槽

  ，你不是還要逃去醫療 還用走的是怎樣XD)


  李李仁這種頭鐵死命追捕主角的刑警在警匪片很常見，這部對這角色著墨實在太少，如果把

  王靜的見證人戲份移給他會更好，幫桂林阿幹的大事做見證 （結尾打給李李仁自首，我看

  不出你們有這麼熟阿，或是給個李李仁上新聞講解案情的畫面讓人知道其實他是大官吧


  還有死刑執行方式也很出戲，真的叫一個人壓在心口開槍 你們這是黑道行刑吧...我以為打

  毒針太沒畫面 吊死不太符合在地元素，應該讓一排法警只有一個有子彈的人集體開槍


  黑道藥師的劇情不錯，換個片名不要破梗會更好，題外話，藥師的造型加上肺癌會一直讓我

  想到某個政治人物的抽菸迷因...


  總之，當初在台灣的票房蠻符合內容水準，佳作沒到大賣的程度,以上


  --

  「這次轉學結束後，我就要回老家和那女孩結婚了」

  「別擔心，這次的臨海學校很安全，絕對不會被敵人發現的」

  「這裡就由我擋著，你就去好好享受暑假吧」

  「我還是第一次像這樣和大家暢談學園祭的事呢」

  「我只能先在電話裡和你說這些，等見面再詳談學園祭的事吧」

  「咦？這個時間會是誰來了……是耶誕老人嗎？」


  --



  有屍體有裸體的爆米花片嘛


  不喜歡還有四千萬，你以為國片票房很好撈嗎==

  因為我聽說的死刑執行是按鈕的，不過這真的是我無知'
