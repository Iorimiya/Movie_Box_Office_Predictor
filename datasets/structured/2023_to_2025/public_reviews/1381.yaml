content: '以下有雷



















  ______________________











  只要接受 主角光芒太厲害

  阮經天有驚天的復原能力和抗打能力

  這樣的設定之下

  那就是一部好看的邪典電影 (cult movie)


  真的滿好看的

  動作設計也很到位

  刑警陳灰根本是巴柔的高手 但量級就是比桂林仔小 力氣不夠大


  細節氣氛運鏡色彩都是上乘之作

  阮經天左眉的疤 一直很連戲



  台中綠川 看了就很有情懷


  有沒有人真的邪教精舍的拍攝點在那裡呢？

  看起來很漂亮 想去旅遊參觀




  雷文防雷資訊頁




