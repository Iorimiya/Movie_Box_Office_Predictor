url: https://www.ptt.cc/bbs/movie/M.1710660412.A.06F.html
title: '[新聞] 《周處除三害》賣破21億！阮經天被敲碗'
content: '新聞網址：




  《周處除三害》賣破21億！阮經天被敲碗報金雞…陸影評人：有機會


  記者陳芊秀／綜合報導


  電影《周處除三害》官方微博17日宣布票房突破5億（約台幣21.97億元），成為台灣

  電影在大陸票房歷史第二高，僅次於2018年《比悲傷更悲傷的故事》。該片在當地票房大賣

  超出各界預期，緊接著影迷敲碗阮經天報名金雞獎。


  根據貓眼數據，《周處除三害》上映17天，總票房已經突破5億大關，當初業界預期

  破5億成功達標。票房刷新紀錄後，陸續有影迷敲碗《周處除三害》阮經天報名金雞獎，再

  掀討論，目前擔任戲院總經理的電影博主「董小姐聊電影」，分析此事寫道「有機會的」，

  但是要看片方是否報名，一般是6月底到7月20日報送，單項獎（如導演、編劇、表演等）參

  評人須為中國國籍（具體執行時台灣電影人視作可參評）。


  文中列舉幾位入圍及獲獎的台灣影人，如2005年第25屆金雞獎，攝影師李屏賓憑徐靜蕾執導

  的陸片《一個陌生女人的來信》，獲得最佳攝影獎，這是台灣影人第一次獲得。接著

  2009年入圍最佳兒童片的《男生賈里新傳》，男主角正是阮經天。演員金士傑憑路陽執導的

  《盲人電影院》入圍第28屆金雞獎最佳男配角，金士傑是首位入圍金雞的台灣男演員，而《

  周處除三害》的監製李烈早年是演員，憑《逆光飛翔》成為首位入圍金雞獎的台灣女演員。


  阮經天17日在社群平台曬出《周處》花絮照，照片是他與袁富華、李李仁3人滿面笑容一起

  走在街上，與電影中三人關係呈現極大反差，照片配文「2022/08/20凌晨，陳灰 香港仔 陳

  桂林」。網友紛紛湧入留言恭喜票房突破新高，更有人提醒：「記得報一下今年的金雞最佳

  男主啊，入不入圍得不得獎另說，但一定要記得報名啊。」




  --'
