title: '[無雷] 周處除三害 格局有點小 不夠爽'
content: '今天去看了周處除三害


  其實整體還算不錯 後半段節奏有點亂掉

  幾乎沒啥太冷場的時刻


  但該怎麼說呢


  覺得對男主的刻畫有點太薄弱

  要熱血不夠熱血

  要感動不夠感動

  要瘋也不夠瘋


  有幾個笑點還蠻有趣的


  如果只是要走純爽片不管劇情  好像又不夠爽


  後面的轉折也不會讓人覺得很驚喜  感覺都猜得到


  打鬥的部分還不錯啦  但可能最近韓國的東西看多了

  還是覺得差人家一大截


  大概給個70分 (國片標準)

  阮經天還是蠻帥的  王淨有小露一下(戲份不多)


  以上


  --'
