url: https://www.ptt.cc/bbs/movie/M.1710340410.A.7FF.html
title: '[討論] 為什麼周處除三害在中國爆紅?'
content: '看完了整部電影


  完全感受不到這部電影會爆紅的原因啊


  首先是電影的敘事手法跟表現讓我感覺很九把刀


  為此我甚至考慮再進電影院看一次片頭仔細看一下


  但是我把片尾完整看到最後



  沒有九把刀的名字...



  那...為什麼整部電影那麼像九把刀電影的風格？


  無法理解



  再來是說血腥 這其實也還好


  如果是說最近的 那基哥的捍衛任務也屌打


  更別提昆哥丁塔倫提諾的電影每部都把它壓在地上摩擦



  那還有更多被我遺忘在記憶深處的電影都贏過它



  至於劇情更是沒什麼記憶點


  稱不上多娛樂的娛樂片 更稱不上多有深意的深度片



  而且片中很多場景都刻意找老舊破舊的建築跟裝潢



  不是，導演你眼中的台灣到底是多破爛啦XD





  所以到底這部片為什麼在中國會紅？？



  我看完整部電影後是真的不明白



  有沒有人可以說明一下啊？


  --'
