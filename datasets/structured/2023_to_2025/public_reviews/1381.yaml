title: '[討論] 周處除三害的那把槍'
content: '跟大家討論一下


  周處除三害當中，陳桂林手上殺人的那把槍，後面是不是有一點bug?


  還是中間有哪個橋段我沒注意到?


  稍微數過，陳桂林手上用過的手槍應該是有三把?


  第一把是在黑道老大喪禮上，他開槍殺死鐵頭之後，就丟掉了



  第二把是在跟陳灰搏鬥時，從陳灰那邊搶奪來的台灣警用PPQ



  第三把是最後在開槍屠殺邪教的時候，用的看起來應該是克拉克系列的手槍



  我的疑問在第二把到第三把的轉換，因為看起來他搶到警槍之後，理髮店裡那場戲當中

  露出的槍、跟後面追殺許偉強到郊外的廢棄溫室，裡面跟許偉強打完一場，壓制對方之

  後開槍把對方殺掉，當時手上拿的都是同一把，就是陳灰的警用PPQ。


  後來他搭上船到澎湖，一直到他把槍埋進土裡，都沒有看到他換槍，直到把槍枝取出來

  之後，就發現那把槍變成疑似克拉克系列手槍的款式了。


  後來他下船投案的時候，交給陳灰的手槍，還是克拉克，其實換槍倒還好，之所以好像

  變成bug的原因是，陳灰就這樣把那把槍插回自己的後腰帶(鏡頭沒帶到，但看的出來應

  該是收槍的動作)。


  但我的疑惑就在這，那等於是殺人案嫌犯的作案工具，陳灰應該是叫人把槍拿走，怎麼會

  像是自己的槍一樣插回自己的後腰帶呢?


  可能注意這一點小錯誤很無聊啦...但因為槍的特寫鏡頭很多，我剛好前陣子剛複習完幾

  部動作片，有在注意電影當中正反兩邊角色使用的槍械，這次因為很多的特寫鏡頭就讓我

  更加注意到這部份了~



  我本身是覺得是個bug，還是說有板友有發現陳桂林除掉許偉強之後，真的有換過槍?


  --'
