url: https://www.ptt.cc/bbs/movie/M.1709748704.A.FE5.html
title: '[新聞] 《周處除三害》中國票房破7億台幣 中網'
content: "《周處除三害》中國票房破7億台幣 中網分析陳桂林「8美德」成為過審關鍵\n\n華視\n\n2024年3月5日 週二 下午2:35\n\n中國 /\
  \ 林彥廷 綜合報導\n\n電影《》於去年上映，上映後口碑不斷，而電影近日也登上影音串流平台 \n，並於3月1日在中國上映，目前票房已經突破1.6億人民幣（約7億新台幣）。\n\
  \n不過因中國電影沒有分級制，因此將電影中的血腥鏡頭進行刪減，也引發中國網友熱議。\n\n《》在中國上映後引發熱議，不少網友看完後直呼「好看」、「爽片」、「小鮮肉演\n\
  員老了可以變成演技派大叔」、「這種電影原來是可以在電影院放的」等，電影票房也在\n3月3日就破億，成為票房黑馬。\n\n不過因中國電影沒有分級制，在「點映」階段時也被民眾反應太血腥暴力，因此將電影中\n\
  的血腥鏡頭進行刪減，加上  正好也上架電影，讓不少人直呼「不想看刪減版」\n，但也有不少影評跳出來表示，上映版本並沒有差別太多，呼籲民眾一定要進戲院看。\n\n\
  此外，也有不少人好奇台灣電影是如何「過審」在中國播，對此提出主角的\n，讓不少網友也紛紛留言補充說「1.、2.\n」、「」、「\n」、「把槍還給了警察」、「他最後打電話給陳灰，指名道姓讓他抓自己」\n\
  等，此外也有人提到電影是被買斷的，所以過審與票房都與製作方無關係。\n\n即使《》在中國上映是刪減版以及同時登上串流平台，但電影仍在中國連續兩日拿下\n大滿貫，目前票房已經突破1.6億人民幣（約7億新台幣），中國票房預測平台也推測《\n\
  》總票房有機會突破4億。\n\n新聞網址：\n\n\n\n--"
