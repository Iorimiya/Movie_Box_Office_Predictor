title: '[新聞] 《周處除三害》被控抄襲　導演、製片、'
content: '《周處除三害》被控抄襲　導演、製片、監製全部不起訴


  記者劉昌松／台北報導


  全球賣座30億元的國片《周處除三害》劇本抄襲爭議延燒2年多，名導錢人豪控告《周》

  片製作公司負責人黃江豐、監製李烈、導演黃精甫涉嫌違反《著作權法》，台北地檢署檢

  察官調查後，以無法證明《周》片的發想起源與錢人豪有關等理由，30日以罪嫌不足等理

  由，處分不起訴。


  《周處除三害》由藝人阮經天主演，描述台灣槍擊要犯，得知自己罹患絕症後，殺害其他

  罪犯後自首伏法的故事，2023年在台上映，隔年在大陸爆紅，在兩岸三地獲多項演藝大獎

  提名，奪下最佳男主角等獎項。


  不過，導演錢人豪在2023年間公開質疑，《周處除三害》與他創作且曾公開過的《無法無

  天》劇情大綱相似，並到法院提告，相關民事案件仍在法院審理中，《周》片導演兼編劇

  黃精甫不滿遭影射抄襲，控告錢人豪妨害名譽，因2個劇本確實有相似之處，處分不起訴

  錢人豪確定。


  錢人豪另外以松露文化創意有限公司名義，提出違反《著作權法》刑事告訴，錢人豪主張

  ，他過去曾到香港與影視圈有提起自己的拍片計畫，以及劇情編排，《周處除三害》導演

  兼編劇黃精甫可能因此輾轉得知內容，進一步拍攝成片。


  黃精甫解釋，錢人豪所述的期間，他不在香港，並提出自己的《周處除三害》創作歷程記

  錄，否認有任何抄襲。檢察官調查認為，無法確認黃精甫在創作前得知或接觸到錢人豪的

  創作發想，也無法證明劇本內容涉及抄襲，因此處分黃精甫

  以及製片公司「一種態度」、公司負責人黃江豐、監製李烈全部不起訴。





  --'
