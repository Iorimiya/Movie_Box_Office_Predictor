title: '[討論] 周處除三害是因為反政治正確才爆紅？'
content: '以下有雷









  這部片以節奏及架構來看

  我是覺得有點像西遊降魔篇

  拆分各自獨立的段落分別收拾不同魔王


  但不同的是

  本片主角自己也是個惡人

  收拾其他通緝犯也不是基於什麼良善動機

  反而有點與眾不同

  並且脫離說教的傳統框架


  另外現實社會充斥著殺人不會判死的氣氛

  它最後卻反過來給你執行槍決

  前面也是直接以暴制暴

  跟現實偽善、過度照顧犯罪者的風氣完全不同


  現實世界中也是詐騙橫行

  洗腦、邪教一堆

  但沒人想認真處理

  所以看陳桂林一個個處決那些邪教信徒

  也是對現實不滿情緒的一種舒壓


  是不是這些政治不正確

  才讓對岸的觀眾有耳目一新的感受？


  --'
