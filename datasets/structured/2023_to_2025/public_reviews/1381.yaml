url: https://www.ptt.cc/bbs/movie/M.1709705296.A.028.html
title: 'Re: [討論] 周處除三害在台灣不火在中國超火'
content: '我覺得這部片，刻意被壓制了


  這些年的覺青片太多了

  不是gay片、鬼片、就是偽善片


  周處這種題材，台灣觀眾應該很愛

  只是他台灣上映時間接近大選


  當時的氛圍很多片都沒聲音

  甚至有人說劇中的女醫生髮型刻意


  所以在台灣算是宣傳失敗


  老實說光是看他殺死忠邪教那幕，


  就很多人買單了



  只能說他上映的時間太糟

  剛好是台灣邪教最狂的時間


  連張家輝，都在自己 “怒潮” 的記者會

  稱讚是他五年內看過最好的片



  只能說太貼切台灣現況


  很多人抗拒去提起吧。


  --

  很奇怪的心態，我喜歡就說我喜歡，

  為什麼要覺得我在洗。

  都下檔了，我是替誰洗

  殺戮在台灣沒什麼，

  一心要殺壞人的不容易

  周處除三害這個精神，台灣真沒有'
