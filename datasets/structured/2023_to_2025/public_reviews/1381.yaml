url: https://www.ptt.cc/bbs/movie/M.1709725148.A.F02.html
title: '[討論] ===周處除三害為什麼在大陸會紅 到底演啥'
content: "本篇主旨在核心討論:版上一堆人[近乎瘋狂在問的]為什麼此片在大陸爆紅?\n只是很簡單的陳述在大陸爆紅的環境原因\n\n\n其實原因非常簡單  [而且白癡都知道]\n\
  \n因為就是本片[在表層阿共看待宗教勢力的看法某些層面上大都一致]\n\n換句話說 會有本片主打就是[抱阿共大腿或為了抱阿共韭菜群體大腿所產出來的劇本]\n\n\
  \n       所以表層阿共瘋狂的透過[行之有年的動員手法支持]這部片\n   是這樣才大紅的  對於了解地球是虛擬世界級數的存在們要設定票房虛擬數值並不難\n\
  \   (等到了科技已經能讀心跟腦控的虛擬時代時)+AI智能推文技術\n   能洗腦多少麻瓜奴隸齒輪才是重點\n\n\n其實\n\n今天裡面邪教換成其他正規宗教\
  \ 也差不多劇本情況\n\n(因為正規到極致\n真正看透[地球其實是虛擬現實]\n並且完全依靠  神  的宗教徒或NPC  在特定的情況下也是有點類似如此\n\n\
  要說差別在於\n[那殺身體，不能殺靈魂的，不要怕他們；惟有能把身體和靈魂都滅在地獄裡的，正要怕他\n。])\n\n一個純粹是思想/文字/大腦超演算的意識形態群體/藝術的極致迷幻空間的邪?教娛樂文化\n\
  一個是真的有  神  力量在暗暗支配的  一群人 受安排的集會\n\n       電影中\n\n       ===>你殺的人其實並不存在(拼接出來的相) 並且弄不好你還要為此受苦\n\
  \n\n\n[我講的  純粹看你們對地球這個虛擬世界到底理解到什麼程度罷了]\n\n\n\n\n==我上面講這些  是想說什麼?\n==就是拜託那些滲透到MOVIE\
  \ PTT的大陸小粉紅不要瞎吹捧這部片大陸超賣台灣卻不紅===\n==還裝做一副搞不懂原因在PTT 狂發文\"重點是還狂問為什麼台灣不紅\"==\n\n==總之因為這是主打特殊目的的意識形態片===\n\
  ==拍攝殺邪教的片段[僅僅只是為了給那些真正的宗教小小信仰者們 植入恐懼]==\n\n總而言之這部片的意識形態導向  對表層阿共它們認為有利 所以動員這部片在大陸爆紅\n\
  \n\n講難聽一點就專業的電影打造員特別針對大陸這類特殊形態市場打造出來的\n[刻意安排的對大陸專用的奶頭樂]而已\n就這樣而已\n\n\n\n       \
  \ ==簡單說就是給[表面上來說 你沒得選]的阿共韭菜們一個想像空間==\n=讓它們看到這些邪教徒 在這個虛擬現實 [肉身]最後的下場 有個殺女人的性快感 跟警惕==\n\
  (要知道 最後那個片段如果換成全都是老男人 或老女人\n本片感受又會實質上徹底不同 並且票房又會徹底不一樣 真的\n人類的基底肉身本性就這麼單純\n你以為這電影後面在講宗教?其實那段只是在安排[透過劇本合理化]性快感處決場景罷了)\n\
  \n\n\n\n這也是為什麼在台灣這邊不賣座的核心原因\n====台灣根本就沒再CARE這些====\n====在正常國家  比邪教屌得 麻煩的東西多的是======\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nPS:那什麼叫深層阿共?\n深層阿共會告訴你世界上那些被他們逼迫的宗教是他們自己安排/創造/實驗出來的\n\
  為的是收割\n過程什麼的不重要  重點是收割情緒能多大 =[能否讓自己的韭菜們感到被逼迫感]\n\n\"有少.部.分.的.時.候.\"現實就是以下這麼一回事:\n\
  \n(不死不運)\n\n--\n對  然後市場一直都是動員的\n\n====我換個角度講好了  今天一個比賽冠軍100萬美金  +外面有國際賭盤  ===\n\n\
  你就會發現你的許多對手不知道為什麼狂輸給你\n\n有的時候這種現象的答案很簡單:\n對手只要花30萬美金去國際賭盤買自己輸\n[你的對手就能保證他自己無論打贏或打輸\
  \  他都能賺100萬美金上下 穩賺不賠的賽事]\n\n\n             這就是為什麼所有的這個世界所有比賽只要有國際賭盤都會走樣\n\n阿因為真的有穩賺不賠必勝法阿\n\
  \n        [[我不能保證我一定能打贏比賽  但我能保證我一定會輸掉比賽 懂?]]\n\n\n總之\n你們在電影票房上看到的只是虛擬現實安排的表象罷了\n\
  真正幕後的運作方式 跟目的是另外一回事情\n\n\n總而言之不要看票房就眼紅\n想透怎麼回事就好了\n\n\n北極洲\n貪婪之島\n隔鄰藍\n\n\n\n\n\n\
  \n神鬼一族 神鬼帝國\n\n\n不過反過來說\n在XY現實內其實我不是很相信DNA這類白衣科學家洗腦出來的概念\n因為近年都可以[直接]更新人類身體結構的歷史設定的\n\
  比如[間質]等等一堆改動"
