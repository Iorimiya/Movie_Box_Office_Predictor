url: https://www.ptt.cc/bbs/movie/M.1700248085.A.B2E.html
title: '[雷] 周處除三害'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  本來因為阮經天跟李李仁蠻期待這部的

  開頭的戲份也確實拉高期待

  兩個人打的蠻好看的


  結果高潮似乎就在此了


  為了要塑造男主遺憾、沒有掛念的形象

  所以讓阿嬤領便當

  但除了電話的隻字片語 根本感覺不出阿嬤對男主的重要性


  我覺得可以讓男主做夢夢到小時候 然後醒來就是四年後這樣 順便帶一下 失去這個家人對

  他的衝擊 不然感覺有點難以共情

  小豬手錶的符號也不怎麼感人


  不過我倒是覺得男主在警局要自首那邊設計的蠻好的

  的確非常荒謬


  而後來遇到香港仔跟第一名阿北那邊就演得有點無聊了

  劇情走向大概都猜得到


  小美這個對應受害者的象徵

  堆砌也蠻單薄的

  可能也有部分是演員關係吧

  本來應該蠻重要的角色

  在故事裡顯得可有可無


  並沒有為這次的惡討伐惡的旅程增加多少亮點


  不過李李仁跟阮經天都演得挺不錯的


  另外我一直很喜歡謝瓊煖

  也覺得她演技一直很好

  不過覺得她的這個人設好像有點難以言喻的違和

  可能是她的種種動機都沒有解釋 所以顯得蠻奇怪的吧


  --'
