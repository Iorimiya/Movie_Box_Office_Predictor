title: '[普雷] 《周處除三害》難怪在台灣不紅'
content: '在Netflix上出現一陣子了

  但是看到阮經天就感覺很無聊，完全不想點


  聽說在中國超級紅

  話題也被炒熱，就勉強去看了一下


  說真的無聊的時候可以看一下

  單純論拍攝手法我覺得是不錯的

  有些地方很有國際水準，特效也不會很假


  但是劇情就是一個莫名奇妙















  =========防雷心得


  整部片大概就是：

  殺人犯以為自己癌症末期，去殺了兩個更惡的人來打響自己的知名度，名留黑史

  (完全8+9心態，難以理解)



  中間穿插了一個邪教劇情

  這段轉折是還不錯


  我身為一個觀眾的心態大概是：

  尊者一定就是林祿和-->誤會了竟然不是-->原來真的是


  這段有把老梗多弄了一點新花樣

  但是剩下的劇情都很莫名奇妙



  莫名其妙1：

  主角跟陳灰警察扭打過2次而已

  怎麼搞得像難兄難弟，還會相視而笑==


  莫名奇妙2：

  當眾殺人這麼容易逃跑喔


  莫名奇妙3：

  主角怎麼知道那個警察叫陳灰？


  莫名奇妙4：

  主角怎麼知道陳灰的手機號碼？


  莫名奇妙5：

  小美記憶力真好，看過那個粉紅色手錶幾眼，竟然能完美複製上面的圖案==






  反正裡面很多吐嘈點，不能太認真去看

  看完就覺得「然後呢？」

  邪教說真的也是台灣人見怪不怪的題材了，純粹當爽片看的話就還不錯



  我是不懂為什麼在中國爆紅

  是不是對岸中國人第一次看到台灣社會黑暗面==



  --

  不是劇情片ㄇ

  什麼是cult

  很好啊，其實就是低端互殺

  只是有點美化殺人犯

  怎麼知道有刪減？

  其實拍得不錯啦

  但劇情就玫瑰桐玲眼沒錯

  原來

  對啊畫面不錯

  他們很少這種社會寫實電影？

  喔

  這有可能

  確實

  那個不是常見的佩佩豬吧

  會有完整版ㄇ

  還有阿

  主角被捅了一刀，又被封死在棺材裡

  怎麼從棺材掙扎出來後跟沒事一樣，早就失血過多了吧==

  就是民情不同啦

  台灣人當爽片看，對岸一堆解析'
