url: https://www.ptt.cc/bbs/movie/M.1717047561.A.9C2.html
title: '[新聞] 朱延平:周處除三害在中國成功 是兩岸交流好結果'
content: '新聞網址：


  2024-05-29 16:29

  中央社 台北29日電



  導演朱延平28日在中國四川雅安出席「第15屆兩岸電影展之台灣電影展」時表示，台灣電

  影「周處除三害」在中國大陸的成功是「兩岸交流的好結果」，希望兩岸電影交流能繼續

  延伸。



  綜合中新社、新華社及四川在線報導，「第15屆兩岸電影展之台灣電影展」27至31日在雅

  安市萬達國際影城及上影國際影城展映，28日並舉行開幕式，包括朱延平、魏德聖、李烈

  等近30名台灣電影業人士以及中國導演馮小剛等人出席。







  報導指出，




  魏德聖則指出，「周處除三害」在台灣上映時討論度不高，反而是在中國大陸獲得票房成

  功後引起台灣觀眾的興趣，「才瘋狂搶看到底是什麼片子」。這是兩岸增進了解的一個案

  例，他非常期待兩岸在人文方面的相關交流。



  根據報導，






  --'
