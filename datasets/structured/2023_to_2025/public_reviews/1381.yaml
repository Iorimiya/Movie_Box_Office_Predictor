url: https://www.ptt.cc/bbs/movie/M.1709468836.A.566.html
title: 'Re: [好雷]周處除三害~後面看的很爽快~'
content: '之前被講爆雷


  再來強力推薦一下好了


  這部是我除了富都 老狐狸 跟小曉外


  唯一 一片去院線看的


  我還是要說350很值得啦


  非常爽的商業片


  尤其是阮經天下班後


  剩下的宗教智障再度奏起音樂的時候


  阮經天那個表情有夠經典


  就好像在說 除惡務盡啊


  接著開始大屠殺


  哪一瞬間 就爽翻了


  看富都是沉重的壓抑


  小曉是小姑娘精彩 但就精彩而已


  老狐狸男主角應該是陳慕義吧


  而周處除三害 就是爽爽爽


  不少豆瓣評價黃精甫也有資格拿金馬最佳導演 我也是很認同的


  現在網飛訂下去或等待租dvd


  我覺得周處不會讓你失望的


  老實說2023的金馬 比上屆精彩許多


  另外再次推薦21條 以中共的審查 周處跟21條能上映

  確實很難得



  --

  同意 大獎應該不敢給 至於影帝真沒辦法 吳慷仁太強了


  好期待石門上映哦'
