url: https://www.ptt.cc/bbs/movie/M.1711308970.A.536.html
title: 'Re: [普雷] 周處除三害'
content: '因為導演的功力有限

  對劇情編排和鏡頭運用都不夠好

  大多靠演員的基本功帶好戲

  演員不行的部份就真的看起來會很尬

  雖然被當Cult片型

  但其實劇情並沒有太多荒謬怪誕

  談暴力其實中國電影不分級有更多暴力

  所以他是剛好的荒唐巧合推動劇情


  喪禮成群黑衣男子都是五百元找來的

  結果現場竟然只發三百

  整批人看著兇狠無比

  面對槍擊全都龜縮

  這些荒唐又合理的畫面打開故事

  只可惜劇情節奏沒把握好

  整體也才只能十分拿七分


  而片尾屠殺片段拿雙瞳比是比不過

  拿金福南後段為了報仇屠殺整座島

  狀況也不太相同

  陳桂林是殺掉目標後

  發現這些人在沒教主之後

  竟然還能正常歌唱聖歌而覺得他們無可救藥有

  不是跟他們有仇

  子彈開場從防潮袋拿出來

  一顆一顆裝的，然後還會一直卡彈

  廉價感既荒謬又現實

  他跟他們沒仇

  所以沒有需要殘暴的殺戮

  而是卡彈沒死就叫他們滾


  都知道教主是假的也沒拯救誰的能力

  在面對警告依然執迷不悟

  邊唱聖歌靈性覺醒的畫面

  充滿諷刺意味

  任何人都可以在這些畫面解讀自己說法

  每個人都有一個哈姆雷特

  都能講出自己想的陳桂林

  才會讓這部其實大多人評價都整體7分

  會在大陸有這麼大熱度


  -----

  Sent from JPTT on my Xiaomi Redmi Note 8 Pro.


  --'
