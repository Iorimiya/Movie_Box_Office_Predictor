title: '[有雷] 周處除三害想吐槽的點'
content: '先說整體還是很好看

  動作武打與氣氛都很到位

  尤其阮經天的演出讓人相當驚豔

  台灣與他同輩的演員中我想不到比他更適合這個角色的


  但這部戲的警察真的讓我很想吐槽


  1. 開場追逐戲

  我知道很多人覺得這場戲很精彩

  我也覺得運鏡和動作設計很棒

  但我實在不懂為啥這麼多警察會追不到一個阮經天

  我們樸實無華的桂林哥甚至沒有騎車開車

  就是正正當當用兩條腿跑贏你喔咿喔咿的警車

  我只能說你與其當槍手更應該去當國手

  我們李李仁也很親切

  明明有槍

  故意等到眼睛被戳瞎才亂開一通

  要是追人的時候瞄準開個幾槍搞不好直接開出電影結局


  2. 陳桂林搭船

  老實說我不太知道為啥桂林哥可以這樣大剌剌的搭台華輪去澎湖

  老哥你再怎麼過氣好歹也是全台三大通緝要犯

  最近還剛把老二幹掉

  風風光光 全台灣無人不曉 後面還跟著一個好兇的李李仁

  結果說出島就出島

  ？？？

  警察484真的沒想認真辦案ㄚ


  3. 陳灰對陳桂林的態度

  這是我整部戲最不懂的地方

  陳灰眼睛被陳桂林戳爆

  之後又追了他整整四年找不到個影子

  對這個人不是應該賭爛到不行嗎

  結果最後帶王淨出來刮鬍子的時候

  一臉英雄惜英雄的表情

  好像他是你兄弟

  這啥意思

  先不說一個逃犯可以簡簡單單找到通緝犯的居所

  你警察找了10年找不到

  人家雖然幫忙解決掉前兩大通緝犯

  但他本人也血洗了一整個宗教團體

  這樣一個神經病打給你說要自首

  你也就順理成章跟他和解還幫他送信給妹子

  哥你這心境轉折我是真的看不懂

  還是你們都姓陳是因為他其實真的是你兄弟？？？



  老實說黑道片的警察耍白痴很常見

  整體還是瑕不掩瑜

  期待之後可以看到更多精彩的台灣動作電影


  -----

  Sent from JPTT on my iPhone


  --

  他不是拿鐵絲勒他了嗎 這邊掛掉都不奇怪啊

  這我覺得還ok 我看追殺比爾長大的

  哥 人家是新聞每天在報的超級通緝犯欸'
