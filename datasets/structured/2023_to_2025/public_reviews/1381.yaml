url: https://www.ptt.cc/bbs/movie/M.1709995576.A.86B.html
title: '[討論] 周處除三害（無雷）'
content: '網路很多人討論，就在Netflix 看完「周處除三害」，坦白說，覺得蠻難看的，蠻多片段

  用快轉帶過。阮經天的演技非常好，是本片亮點。


  我比較有意見的地方如下：


  1. 畫面色調不一致，前面色調比較陰暗，後面突然變很明亮，感覺像看了兩部電影。


  2. 不必要的血腥暴力太多。


  3. 主要角色關係的變化很唐突，沒有層次，或交代關係變化的心理過程，讓觀眾覺得很

  丈二金剛。


  4. 私刑正義的正義標準很混亂，讓人不知道導演對正義的標準是什麼。


  5. 有些對白很奇怪沒有邏輯，在那個場景下那個角色會說這樣的話？讓人黑人問號。


  滿分10分 我個人評5分，不知道看過的網友評幾分？


  --


  純粹是影迷看電影論電影說心得，跟是不是台灣電影無關喔～

  通常色調變化是要傳達一些訊息，但本片我看不出來要傳達什麼，可以指教？

  所以導演要傳達什麼？周處除三害的典故不就是私刑正義，浪子回頭？'
date: 2024-03-09
sentiment_score: 0.25
