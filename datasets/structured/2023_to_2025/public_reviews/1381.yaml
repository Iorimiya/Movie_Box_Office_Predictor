title: 'Re: [  雷] 周處除三害 對於信徒的疑問'
content: "防雷頁\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n這段其實認真說不能叫「屠殺」，比較像「自殺」\n\
  \n主角一開始主動殺的是教主。被動開了一槍小教徒。\n\n下樓後復返\n\n\n給了信徒們一分鐘的時間，其中跑掉的人主角沒有任何動作\n\n留下來的人，主角開始殺，\n\
  一槍一個，有的因為卡彈沒殺\n\n被卡彈的信徒分為兩種，一種是繼續等死，一種是覺得死裡逃生突然醒悟快跑\n\n\n主角甚至一派悠閒的停下來裝子彈，也不見留下來的信徒們逃跑或有任何動作\n\
  \n然後裝完子彈繼續殺\n\n\n如果是我，或許會給那個大師姐一個想逃或求饒的畫面\n特別是在所有人都死光以後\n\n或許其他的信徒是真的不想活，不過大師姐給人的感覺比較像是共犯而不是信徒?\n\
  \n無論如何，這一幕的處理方式真的是難得一見就是了。\n\n\n\n\n--\n \n\n--"
