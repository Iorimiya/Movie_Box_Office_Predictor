title: '[討論] 有雷討論 周處除三害結局這樣拍會變神劇'
content: '有雷討論









  片尾最後小美幫桂林刮鬍子那段有點多餘又冗長

  但如果劇情這樣拍會不會變神劇


  小美其實是牛頭生的女兒


  二十年前香港仔把小美跟小美媽媽從牛頭手上救出來

  小美從小只知道香港仔是救命恩人

  但心裡一直記著生父牛頭對她唱的歌「新造的人」


  桂林仔連續殺了小美的繼父香港仔

  還有生父牛頭

  執行死刑前小美為了感謝她

  把兒時記憶「新造的人」唱給桂林聽


  全劇終

  -----

  Sent from JPTT on my iPhone


  --'
