url: https://www.ptt.cc/bbs/movie/M.1744594576.A.012.html
title: '[普雷]周處除三害：碌碌一生為何奔走？'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n開頭打戲不錯、後段諷刺邪教荒謬精彩，但人物塑造薄弱(個人看電影非常重視人物)。\n\
  \n本片意在用黑道死前的最後一搏，看陳桂林逐步解決三大通緝犯，在過程中呈現並試圖破\n除貪、嗔、癡三害。\n/\n用我自己的理解聊聊《周處除三害》的劇情。人物用兩個動詞貫穿整場戲：情勒與欺騙\n\
  (aka洗腦)。\n\n貴卿欺騙陳桂林肺癌四期，命不久矣，再洗腦他死後留名趕快去自首。陳桂林後來自己找\n到終極目標：幹掉前兩大通緝犯，名留青史，便情勒(甚至威脅)貴卿洩露消息讓他完成遺\n\
  願(人家都要死了，你就別管家破人亡的風險，幫我一下嘛)。\n\n第一害跳過(陳桂林沒有要跟他溝通)，後來陳桂林去找第二害林祿和，遇到尊者被他欺騙\n洗腦，相信自己已痊癒、相信宗教可以帶他向善、消除罪孽。\n\
  \n最後當陳桂林發現尊者的陰謀，他以槍威脅所有現場的信徒。服我者生、不服者死，這不\n是最明顯、最極端的情勒嗎？(那段連續開槍很荒謬、嘲諷邪教很震撼)\n/\n\
  \n\n\n死亡逼近，同時無家人依靠，他不知去向、沒有目標，於是聽貴卿的話想著自首，甚至請\n示關公決定自己的命運。\n\n當他發現自首對社會的影響力道之淺，便自己發想主線任務，自比周處開啟除害之旅。率\n\
  性從良為民除害，其實是不知道怎麼面對死亡的無意義，以及整合詮釋自己過去一生的所\n有作為。\n\n「香港仔」死前問陳桂林：給我一個理由，陳桂林只拿槍敲了敲自己的腦袋。看似是香港\n\
  仔罪大惡極，已不需要贅述，其實是陳桂林想帥一波，成就自己心中的正義。而他心中的\n正義未經思索，一切簡化成：不需要任何理由(劃破眉毛也只是表面的理由)。\n\n\
  電影最後破營包，陳桂林知道尊者是斂財騙子、一切都是貴卿騙了他，他根本沒有肺癌。\n陳桂林不得不面對一切真相。拆掉宗教的美化、成名的慾望、虛幻的生死，他到底為何而\n\
  戰？說到底，自詡為周處展開除害之旅，是你自己將死之時的選擇啊。\n\n\n\n陳桂林雖然擁有狂傲的外表，遭遇家庭變故、死亡恐懼時，顯露的脆弱人性卻跟常人無異\n\
  。標新立異、力求表現，其實只是隨波逐流。對一切的無意義  敏感難耐，所以反過來\n強調自己的存在價值，也尋求宗教來豐富行為詮釋的思想素材。\n\n陳桂林從頭到尾缺乏自主意識，隨「命運」漂泊流轉到了槍決前夕，才發現江湖名聲、為\n\
  民除害，全都是自己的妄念。當劇情終於拆開外包裝，陳桂林對善惡的判斷、自我的定義\n評價，全部用淚水與道歉輕輕帶過。\n/\n主角的靈魂搖擺不定、外強中乾，是社會人群的縮影。\n\
  \n\n\n–\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n--\n聽你這樣說，被嗔怒反噬的理解，在單獨段落裡解釋滿有趣，也有韻味\n\
  ／\n我是get不太到陳桂林這個人的動機。\n爭取江戶地位（開頭我只get到他很狂傲，沒感受到名聲對他的意義多大。他台詞當然有\n提到，但我從角色上接收不到。）、周處除三害的主線像天上掉下來的\n\
  後來他的理解又輕易被尊者、醫師牽著鼻子走\n\n不是一定要做桀驁不馴的8+9，可以走諷刺暗喻心智不堅之人的路線，但心境轉折的處理\n無法服人\n沒錯，陳桂林完全符合貪痴嗔的典型，他有服務到周處除三害的概念。\n\
  \n我認為以說故事的角度，開頭就被觀眾看出陳桂林對這些不全然相信，導致後面的頓悟跟\n轉化沒了力道。"
