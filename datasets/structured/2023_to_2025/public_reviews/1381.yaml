url: https://www.ptt.cc/bbs/movie/M.1698546177.A.4F3.html
title: '[雷] 周處除三害-好雷分享'
content: "雷雷雷～\n被雷到我不管了\n以下空白\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n     很久沒看過國片好看到會上來發文了，其實從劇本來看，邏輯前後呼應，寫的很縝密\n\
  ，是不錯的劇本，不是單純的爽片，劇情轉折不錯，裡面也幾乎沒有多餘的角色和片段，\n例如：\n一開頭認識的路邊吃飯的兄弟，邊吃飯攀關係，本以為是帶過，後來也真的請他幫忙;\n\
  得了肺癌末期，逃命還可以跑那麼快？結尾才轉折出來根本沒生病;\n和警察陳輝的多年糾葛，讓陳桂琳自首時，第一個想到的是他;\n在邪教時，真的徹底醒悟時，讓我感同身受，大概類似遁入佛門清修，忽然一個轉折，白的\n\
  就全變黑的;\n\n最後，很多人批評的蔡英文藥師（請允許我這麼稱呼ＸＤ），她的表演方式，很不自然，當\n下我也認為怎麼會挑這人來演，因為其他人幾乎都有撐起自己角色的重量，但後來一想，或\n\
  許她一開始演的就是肺癌末期，一個剛被醫生宣佈完全沒救，能有多少的情緒？她在抵抗不\n接受自己的死期，對任何事情都只有一號表情，也因為肺癌末期，說話有氣無力，氣若游絲\n\
  也是該有的表現，最後她看到陳桂琳入獄後，才有了二號表情(她笑了，為自己一生的罪惡\n，減輕了一些），其實已經很稱職的演出這個角色該有的表現，但最有得發揮也有演出來的\n\
  確實是陳桂琳了\n\n--"
