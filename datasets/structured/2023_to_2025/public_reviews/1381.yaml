title: '[好雷] 周處除三害 阮經天一個人撐整部片'
content: '前幾天去看了周處 意外的爽片一部


  劇情平鋪直敘的十分簡單也沒有要講什麼大道理


  打趴了很多野心太大能力卻不足的國片


  但是演技部分 除了阮經天的之外 其他人似乎都差強人意


  王淨 花瓶一枚


  香港仔 演起來沒啥氣場 跟小嘍囉沒兩樣


  教主 演技很像八點檔的演法 很廉價


  那個醫生的戲也很八點檔 而且很冗


  只有李李仁的腳色比較有味道點 可是給他的戲份又不多


  只是個追在主角後面的警察 沒有發揮到


  真的蠻可惜的 除了演技的部分 整部片水準都不差


  --'
