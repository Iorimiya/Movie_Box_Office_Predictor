url: https://www.ptt.cc/bbs/movie/M.1696691366.A.765.html
title: 'Re: [ 極負無雷]  周處除三害'
content: '關於結局我想講一下我的想法

  以下可能有小雷





  這部原型人物明顯是參考台灣史上最有名的死刑犯劉煥榮


  劉煥榮


  從開頭到黑道角頭祭祀槍殺大哥，還有那小弟口述拿手榴彈去討債的情節

  開頭就很明顯是在講劉煥榮

  這老哥是真帶種，這些事情都真實做過

  當初殺到道上稱他為「神經仔」

  一個人可以狠，但是死到臨頭還是會畏懼

  這老哥是從頭到尾都不要命的瘋狗

  竹聯幫也是因為他才打下現在這大片江山



  我認為結局堅持要拍槍決的原因

  是給致敬這死刑犯人物原型的一個交代

  不單純是為市場考量。


  但你說這部片有沒有為賣中國打算？


  那是肯定有的。


  劇中阮經天從船下來自願被捕、被記者追問你有什麼話要說的時候，他手舉手銬高喊：「我

  對不起國家！我對不起社會！謝謝各位！」


  其實原話是劉煥榮在執行槍決前，在媒體鏡頭上留下的最後一段話：「中華民國萬歲！我對

  不起國家！中華民國萬歲！謝謝各位！」


  這邊有稍作改編刻意不提國名，應該是為市場考量，QQ


  最後的最後是我自己對結局的看法

  結局除了完成角色支線的尾巴（小美、黑道醫生）

  最重要的任務是體現

  陳桂琳（劉煥榮）死到臨頭卻絲毫不畏懼

  跟平常一樣悠閒赴死的狂氣。

  要知道管你是殺多少人的狠人

  幾乎每個人在槍決前都是無法哭的跟娘們一樣大小便失禁。

  只有這老哥是這樣從容赴死的。


  他是個罪人，但同時是個狂人。




  --'
