url: https://www.ptt.cc/bbs/movie/M.1752890514.A.1DB.html
title: '[好無雷] 聖母殺手'
content: '本片改編自韓國作家具竝模的《破果》（中文版由木馬文化出版）

  描述傳奇殺手「爪角」的晚年

  與新秀殺手「鬥牛」的恩怨糾葛

  新舊殺手之間的對照與關聯看到結尾會豁然開朗


  主角縱使身手體力已不如當年還生病

  公司後輩雖然表面上尊敬卻視其為累贅並在營運上胡搞瞎搞

  但主角依然是個不好對付的很角色

  守著師父柳先生留下來的防疫除蟲公司

  持續剷除社會上的人渣敗類

  受傷後接受獸醫救治

  意外動搖冰封的心並找回自己的初心


  片中穿插主角年輕時候代號還是「指爪」的回憶

  跟「鬥牛」小時候的回憶

  切換的手法跟對照很有意思


  整體而言比較偏寫實文藝的冷硬風格

  有點探討老年員工的在職場上的定位

  但意外的是打戲片段不算少

  還有韓片少見的槍戰場面

  主演李慧英已60多歲將殺手的年老體衰表現的很好

  非常值得一看

  就是可惜在暑期大片環伺之下場次時間都不太好

  想看真的要趁早


  首周特典的海報紙質沒有很厚

  但片名有做突出打印設計

  水蜜桃的部分局部特殊處理跟香氣

  真的是很用心的特典

  DM也很厚很好看


  今天在西門的影城好像還有請coser做贈獎活動可惜值班去不了


  --


  Sent from PTT


  --'
