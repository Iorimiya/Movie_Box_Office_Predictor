url: https://www.ptt.cc/bbs/movie/M.1750403812.A.6BE.html
title: '[新聞] 限制級「聖母殺手」登台倒數！一刀未剪'
content: "一刀未剪影片:\n\n新聞網址:\n\n\n由韓國名導閔奎東編導的話題動作電影「聖母殺手」，由百想藝術大賞影后李慧英領銜主\n演，聯手金聖喆、申始雅、金武烈、金剛于、延玗臻等實力派演員，激盪出一場融合動作\n\
  與情感的震撼鉅作，片中畫面。片商今日驚喜公開「聖母殺手」限制級海報，並正式宣布\n，本片將以「一刀未剪版」搶先於全亞洲獨家上映。\n\n「聖母殺手」改編自暢銷小說作家具竝模的作品「破果」，由閔奎東親自操刀，擅長刻畫\n\
  複雜人性與極限處境的他，繼「姦臣：色誘天下」以宮廷權色題材引爆話題後，這次轉向\n更黑暗、更貼近現代社會壓力的「血色正義」主題。影片聚焦於兩位殺手之間的頂尖對決\n\
  ，李慧英飾演的傳奇殺手「爪角」，與金聖喆飾演的暴走型殺手「鬥牛」展開一場宿命般\n的激烈纏鬥，火花四射，動作戲拳拳到肉，令人屏息。\n\n在已公開的「博愛座篇」預告中，一場捷運車廂內的暴力事件引爆觀眾共鳴，影片在短時\n\
  間內即突破百萬觀看次數，引發數百則留言與分享。不少網友表示「捷運站螢幕也該播這\n部！」「這才是我們社會真正需要的電影」「等不及想看正式上映！」片商今（20）日也\n\
  同步公開「聖母殺手」一刀未剪版預告，其中片頭畫面令人難以忘懷——由申始雅飾演的\n年輕「爪角」，身形嬌小卻殺氣騰騰，單挑赤裸上身的彪形大漢。\n\n她行動靈活如閃電，幾記快狠準的攻勢瞬間纏住對方，接著一記繩索纏頸，迅速將對手壓\n\
  制在地，兩人在地板上翻滾角力，她如毒蛇般死死勒緊對對手咽喉，不給一絲喘息空間，\n畫面張力爆棚，又充滿原始殺意，也讓觀眾對這位傳奇殺手的成長背景更加好奇。\n\n\
  值得一提的是，由於韓國本地對影像尺度的審查制度較為嚴格，「聖母殺手」在當地上映\n時不得不進行部分刪減。而台灣片商堅持原汁原味，特別爭取「一刀未剪」完整版本在台\n\
  上映，讓影迷得以欣賞最完整、最具衝擊力的視覺與情感體驗。片商表示：「這是一部必\n須在戲院觀看的大銀幕作品，我們希望能帶給觀眾最完整的體驗！」此舉勢必成為影迷熱\n\
  議焦點。電影「聖母殺手」7月18日在台上映。\n\n\n李慧英在「聖母殺手」飾演傳奇殺手「爪角」，武器是殺人不眨眼的髮簪。圖／鴻聯國際\n提供 \n\n--"
