title: '[新聞] 恐怖大師筆下惡鬼出櫃 童年最驚悚夢魘現'
content: '新聞網址：


  恐怖大師筆下惡鬼出櫃 童年最驚悚夢魘現身


  2023-05-18 聯合報記者 陳建嘉 報導


  恐怖片「鬼出櫃」改編自美國恐怖大師史蒂芬金1978年出版的「有時候，他們會回來」中

  的短篇小說，描述許多人童年時期對櫃子的陰影，每當父母關掉床頭小燈，小孩總是擔心

  衣櫃裡會跑出可怕的東西，電影將衣櫃裡駭人怪物請出來，呈現出恐怖的童年夢魘。


  製片丹萊文坦承，「鬼出櫃」是他一生中最具影響力、最害怕的故事，「我父母的書架上

  就有一本「有時候，他們會回來」，但我看這本書的時候還太小了，看完了「鬼出櫃」這

  篇故事，讓我開始害怕衣櫥，害怕的時間不是幾天或幾週，而是幾年！」


  即使「鬼出櫃」的原著短篇已有40年歷史，至今仍讓不少人看了脊背發涼，導演羅伯薩維

  奇形容，史蒂芬金的故事經常會在他腦中盤旋，「它利用這種存在主義的恐懼，那種隱藏

  在表面之下的無聲黑暗引起了我的共鳴」。


  羅伯薩維奇認為，很多偉大的恐怖電影都是基於悲傷，但在「鬼出櫃」裡，衣櫥裡的超自

  然形體代表了更多東西，「房屋裡的人獨自面對自己的悲傷，他們無法分享各自的心路歷

  程，也創造出更恐怖的怪物，而他們能夠堅持下去的方式就是分享彼此的感受，我認為這

  是任何人能夠克服悲傷的唯一途徑。」


  該片劇情敘述一對姊妹因為母親的離世悲傷不已，她們的父親身為心理治療師，卻無法治

  癒孩子的傷痛，某天，一名病患前來拜訪並尋求父親的幫忙，卻意外帶來了恐怖的超自然

  形體，這個邪惡的存在以受害者的痛苦為食，當女孩們遭受一系列可怕的事件，這個家庭

  也面臨被摧毀的命運。

  「鬼出櫃」6月2日在台上映。


  --'
