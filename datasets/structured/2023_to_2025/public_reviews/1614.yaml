title: '[新聞] 衣櫃裡真的有鬼 史蒂芬金小說改編鬼出櫃'
content: '衣櫃裡真的有鬼 史蒂芬金小說改編 《鬼出櫃》現童年驚悚夢魘


  許多人在童年時期對櫃子或多或少都有些陰影，每當父母關掉床頭小燈，孩子們總是擔心

  闇黑的衣櫃裡會跑出可怕的東西來。即將在6月2日全台上映的《鬼出櫃》，將把衣櫃裡駭

  人的怪物請出來，並呈現出最恐怖的童年夢魘。


  《鬼出櫃》改編自美國恐怖小說家史蒂芬金的短篇小說，該故事收錄在1978年出版的《有

  時候，他們會回來》書中。電影製片人丹萊文坦承，《鬼出櫃》是他一生中最具影響力、

  最害怕的故事，「我父母的書架上就有一本《有時候，他們會回來》，但我看這本書的時

  候還太小了，看完了《鬼出櫃》這篇故事，讓我開始害怕衣櫥，害怕的時間不是幾天或幾

  周，而是幾年！」


  好的故事可以歷久彌新，史蒂芬金的小說就有此魅力，即使《鬼出櫃》已有40年歷史，至

  今仍讓不少人看了脊背發涼。導演羅伯薩維奇提及翻拍《鬼出櫃》的契機，在於史蒂芬金

  的故事經常會在他腦中盤旋，「它利用這種存在主義的恐懼，那種隱藏在表面之下的無聲

  黑暗引起了我的共鳴」，於是曾為《噤界》擔任編劇的史考特貝克、布萊恩伍茲再度聯手

  出擊，並加入了《黑天鵝》編劇馬克赫曼，三人一起將小說裡的可怕惡魔搬上銀幕。


  「很多偉大的恐怖電影都是基於悲傷」，導演羅伯薩維奇說，但在《鬼出櫃》裡，衣櫥裡

  的超自然形體代表了更多東西，「房屋裡的人獨自面對自己的悲傷，他們無法分享各自的

  心路歷程，也創造出更恐怖的怪物，而他們能夠堅持下去的方式就是分享彼此的感受，我

  認為這是任何人能夠克服悲傷的唯一途徑。」




  --'
