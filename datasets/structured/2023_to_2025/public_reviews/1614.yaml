title: '[好雷] 怪物片 不是恐怖片'
content: '沒有到多恐怖 怪物跟氣氛營造算還行 劇情也講的不錯 整體調色和電影構圖都滿舒服的


  如果要當恐怖片看可能會失望 當怪物片看就還不錯


  我一直很喜歡史蒂芬金的怪物系列 當然還是迷霧那片更為優秀 但這片也沒很差 就缺了點絕望感而已




















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看到波爾卡圓點人的時候先笑了XD 故事中真的是衰小人


  那個櫃魔的長相真的是不太恐怖....但殺傷力算滿強的 這樣算起來圓點人一家五口(沒記錯的話小孩子三個？)都被他殺光光了


  超衰小的朋友 只差還好沒賽到連櫃魔都跟過去 人真的很好


  已經算很謹慎的補了兩槍了 可是對方是怪物XD


  電影算是我最喜歡的部分 大姊跑起來 其他鏡頭都看不出來 這鏡頭真是 哇


  小妹身上纏聖誕燈超可愛


  這點很可愛也很好笑 那個噴霧連你姊都打不退 妳還想拿它防身XD



  藝術設計上還是滿不錯的 嘴巴裡是手+裡面有個小臉這個滿有趣的






  片尾看的出來其實燒掉也沒完全解決



  圓點人老婆的說法是櫃魔會纏上心靈有創傷的人


  其實我覺得最奇怪的一點是 怎麼纏上的是小妹卻不是大姊 大姊應該才是那個心靈最脆弱的


  小妹除了開始看到櫃魔之後害怕的反應 其他時間感覺還滿樂天小女孩的


  反而沉浸在悲傷裡還第一個看到圓點人屍體的大姊沒首先被纏上=~=


  整體劇情編排都還不錯啦 屬於有時間可以看一下的怪物片


  --








  --'
