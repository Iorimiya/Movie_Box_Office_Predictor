title: '[普雷]《鬼出櫃》，有按到點，卻不夠有勁。 '
content: '部落各版：


  美國作家史蒂芬金曾於1978年推出首部短篇小說集《有時候，他們會回來》（Night

  Shift），裡頭共計收錄了二十篇過去幾年曾發表或是未曾發表過的短篇故事，而《鬼出

  櫃》便是改編自其中的一篇《櫃魔》（The Boogeyman）。在原版的故事裡，主角雷斯特

  前往尋求精神科醫師哈珀協助，雷斯特告訴醫師哈珀他和妻子麗塔的前兩個孩子在單獨被

  留在臥室時因不明原因死亡，後來兩個孩子分別被診斷認為是嬰兒猝死綜合症與兒童抽搐

  ，唯一的共同點是在死前孩子們都喊著「Boogeyman！」，且事後發現本該關上的櫃子卻

  是半開著的。而在一年之後，麗塔再度懷上第三個孩子安迪，夫妻決定搬到別的地方生活

  ，剛開始的一年裡沒什麼事情發生，但漸漸地某些跡象讓雷斯特認為Boogeyman已經找到

  了他們，甚至還在夜裡闖入屋子裡四處遊蕩，似乎正在尋找安迪。


  某天，由於麗塔必須離開家去照顧她生病的母親，所以雷斯特和安迪獨自在家，察覺到

  Boogeyman似乎因為妻子不在變得更加大膽，感到恐懼的雷斯特知道Boogeyman的目標將是

  兒子，於是便把安迪移到另一間單獨的臥室，果不其然不久後，他聽到房間裡傳來安迪大

  喊「Boogeyman！」的聲音，接著雷斯特更直擊到了某種生物掐死了安迪，他害怕的逃離

  開家、去到家裡附近二十四小時營業的餐廳待到天亮才敢回家。在房間裡同樣是孩子的屍

  體，還有同樣半開著的櫃子，報警後，雷斯特編造謊言、告訴警方安迪是在半夜試圖從嬰

  兒床裡爬出來才會不慎摔到地上並且摔斷脖子。在雷斯特講完這些故事準備離開之際，哈

  珀提醒他可以再找護士預約下次治療，可當雷斯特離開辦公室時他卻找不到護士與櫃台，

  折返回去辦公室時連哈珀都不見人影，空無一人的辦公室只有一扇櫃門半開的櫃子，而哈

  珀接著從裡頭走出來，邊走向雷斯特邊脫下偽裝，裡頭竟是Boogeyman...。



  《鬼出櫃》與其說是改編，我更覺得它更像是《櫃魔》的延伸，在雷斯特不論以何種原因

  離開了辦公室後，他口中帶走他三個孩子、或許也包含著他自己的Boogeyman，又會去了

  哪裡？導演羅布薩瓦吉等同將《櫃魔》的故事續寫，更藉由新增哈珀與他家人的篇幅來試

  著完整Boogeyman的背景、也就是告訴觀眾「Boogeyman到底是什麼東西？」。開頭不久，

  觀眾很快知道威爾哈珀的妻子意外離世，獨留下他與兩個女兒莎蒂與蘇伊兒，失去妻子的

  他無法和女兒們談論相關話題，正在唸高中的大女兒莎蒂只好用自己的方法去思念母親，

  在重新回到學校上課後的首日，她穿著母親生前的洋裝遭來同學的質疑與反感，但莎蒂也

  很堅決的表示自己沒有打算放下，同個時間正在替患者進行諮商的威爾，亦提起了關於面

  對並克服內心恐懼的課題...，短短幾分鐘的資訊接收與組建，於是不難推測出Boogeyman

  生於恐懼、嗜殺擁有心理創傷之人，而最終也許擺脫的方法來自放下。


  「恐懼在哪裡，功課就在哪裡。」


  其實就像蘇伊兒會害怕關燈後的房間還有床底下的空間那樣，史蒂芬金筆下的許多故事、

  例如《櫃魔》也是，都在描寫著人們對藏於黑暗裡的未知會不自覺的產生恐懼，那種發自

  內心、沒來由的恐懼，而來到《鬼出櫃》裡，導演羅布薩瓦吉選擇賦予這份恐懼一個根本

  原因、心理創傷。因此可以想成雷斯特之所以被纏上，是因為第一個孩子死於嬰兒猝死綜

  合症後過度傷心導致，若真像他說的，Boogeyman喜歡玩弄牠的獵物，那麼我想最開始

  Boogeyman的獵物原來就是雷斯特，兩個孩子的死亡不過是牠為了折磨雷斯特罷了，畢竟

  還在嬰兒床裡的幼兒能有什麼心理創傷？最後當真的被Boogeyman殺後，所有人不過都會

  認為是早就被懷疑是殺人兇手的父親受不了罪惡感自殺，所以接著想到的，是Boogeyman

  下來的目標會是威爾，莎蒂和蘇伊兒也是為了玩弄威爾的犧牲品而已。



  《鬼出櫃》是部相當容易理解的類型電影，在大致能夠知道劇情走向與發展的情況下，重

  點就會放在看導演羅布薩瓦吉如何帶領觀眾去感受恐懼。出於「怕光的Boogeyman只會在

  黑暗中出現」的設定，所以基本上《鬼出櫃》的嚇人點都在那燈光的閃爍之間，整部電影

  最容易嚇到人的，我想還是在預告中就有出現過的那紅燈開開關關的那場戲，但同樣的概

  念把戲玩得最好的，依然還是2016年上映的《鬼關燈》。而由於雖然名義上是在黑暗裡，

  可多數時候觀眾還是能隱隱看到某些影子，加上那些影子總在觀眾來不及看清楚的時候被

  快速晃過，以至於整個嚇人的程度是不高的，既然如此就偶爾得仰賴其他元素搭配好讓效

  果能盡量提升，例如配樂與音效。我自己滿喜歡裡頭鼓聲的運用，心跳真有隨著鼓聲加重

  而變快的錯覺，只是除了這段幾分鐘的時間以外，《鬼關燈》在燈光與聲音的搭配之下，

  更多的就是Jump Scare，坦白說次數多了就麻木無感了。


  對我而言《鬼出櫃》有些頭重腳輕，開頭幾分鐘的時間導演羅布薩瓦吉就直接帶出了

  Boogeyman，可卻花了整部電影片長近一半以上的時間在故弄玄虛，儘管這過程看起來是

  在讓觀眾知道Boogeyman是怎麼樣的在玩弄獵物，但這個過程又不夠精彩到能讓觀眾願意

  去享受這過程，略微鬆散的節奏加上要給不給的Boogeyman，可以說是逐漸消磨掉觀眾的

  耐性。隨著劇情越發展就越顯匆忙，在莎蒂遭麗塔誘騙來當Boogeyman的誘餌時已經有點

  滑稽，最後莎蒂回家拯救蘇伊兒與威爾來到地下室和Boogeyman正面對決時，也是在一陣

  混亂中結束，這個結束力道是不夠的，不論是終於現身的Boogeyman帶來的視覺上的震撼

  ，或者是電影所試著想帶入的、親情的力量與和放下過去所做的連結度，都和我原先所預

  期會得到的力度有著落差，特別是結尾典型的收尾手法說服力同樣不足。


  《鬼出櫃》整體來說就像力道不夠有勁的按摩師傅，有按到點但卻無法有效舒壓。導演羅

  布薩瓦吉不只改編還延伸原版故事，能感受到他的用心與用意，然而真的恐怖的都在預告

  理了，正片本身反而失去那個味道，整個變得又長又拖。《鬼出櫃》既不恐怖也不血腥，

  當無形事物帶給人的恐懼被轉換成有形體的存在時，劇情又不足以去支撐這份恐懼，算是

  部相當可惜的恐怖電影。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
