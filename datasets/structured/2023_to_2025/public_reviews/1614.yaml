url: https://www.ptt.cc/bbs/movie/M.1685848348.A.EAB.html
title: '[好雷] 《鬼出櫃》，溫馨輕鬆但不恐怖'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  《鬼出櫃》

  天氣炎熱，隨意找了個恐怖片來看。以放鬆心情為目的的話，此片為好雷；但若以要被嚇

  到為目的，此片為普雷。

  （第一次寫影評，有覺得哪邊需調整的，歡迎指點，甘溫～）


  無劇透劇情介紹部分


  劇情發生在一個小家庭中，爸爸是心理諮商師、兩個女兒一個高中、一個國小。在媽媽過

  世後不久，有個陌生人來到家裡諮商，自此之後，怪事接二連三發生......


  個人蠻吃親情互動的部分，有好幾個畫面，是看到當下可以會心一笑的，很喜歡兩個女兒

  的設定，人設討喜。


  恐怖程度算是不高，但不會覺得本片雷，該有的常見恐怖片元素還是有，至少旁邊愛看又

  會怕的朋友，還是有被嚇到抓住我的手（？


  使用各種道具破關、以及一些槽點，蠻適合做成彈幕直播或遊戲的，應該會笑得很開心。

  .

  .

  .

  .

  .

  —————

  有劇透吐槽+討論部分

  .

  .

  .

  .

  .

  先來個正經的部分。貫穿整部戲的概念，個人覺得是［信任］。


  1. 爸爸與病患

  爸爸身為心理諮商師，卻在個案說出想法之後，馬上轉頭就走，雖然有用上廁所這個萬能

  藉口，但明顯還說感覺得出來，個案不被相信。


  個案說：［我有三個孩子，但三個都在短時間內接連過世，大家都說是我殺了她們，但她

  們留了訊息給我，跟我說有陰影怪物的存在。］


  雖然碰到未知東西的機率，可能真的微乎其微，但個案不管是殺人犯還是精神耗弱，總覺

  得還是需要先安撫他，過幾分鐘再使用尿遁這個技能。


  2.小女兒與家人

  小女兒說：［我看到了怪物，它在床底下。］


  爸爸和姊姊不相信她所說的，只當成她是被自殺的陌生人嚇到，腦袋出現幻覺，還激進的

  以模擬情境的方式，用燈光閃爍來讓小女兒適應。


  什麼是真實呢？

  要是身邊所愛的人，這樣跟自己說，自己應該會在晚上一起睡，而不是讓小孩自己面對。

  （雖然在本片背景的話，爸爸一起睡，大概會被怪物一起串起來吃）



  3.大女兒與朋友

  喜歡電影開頭的運鏡，所有同學都盯著大女兒看，好像她生了傳染病一般，但大女兒戴著

  耳機，努力生活在自己的世界中。


  後面廁所有一幕，朋友在隔壁廁所伸出手，女主角從原本的自我隔離，到笑出來牽住手的

  樣子很可愛。

  可能很多人都會想有這麼一個朋友，對脆弱的自己伸出援手吧？



  -


  接下來是吐槽，這個部分假如有彈幕，大家一定意見很多很好笑哈哈哈哈


  1.案發現場的錄音筆

  居然在發生自殺案的地方，沒有仔細檢查，這種關鍵物品，在警方做完筆錄後，還遺留在

  現場讓小孩拿到，黑人問號？


  2.衝進身體的黑影

  大女兒和同學抽一口大麻，出現分不清是現實還是幻覺的怪物，衝出來灌進喉嚨。

  嗯......大概在某種動作片會看到類似場景，看到不小心笑出來......




  3.放火攻擊怪物

  在原本被怪物攻擊的另一戶人家，裡面還住著一位看起來精神耗弱的女性，是自殺者的老

  婆。她知道怪物的存在，也知道怪物怕火、怕光。


  放了一堆蠟燭在走廊，看起來完全沒有通風，沒有灰修粗就已經很厲害了，居然也沒有缺

  氧？



  最後面打怪物時，大女兒也在自己家放火，在火場待這麼久，居然沒有因為濃煙而昏倒？


  有看電影的各位，覺得這部片如何呢？

  感謝有看完的人～




  --'
