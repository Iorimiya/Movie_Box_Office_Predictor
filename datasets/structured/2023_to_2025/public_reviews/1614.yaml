url: https://www.ptt.cc/bbs/movie/M.1697730665.A.FD8.html
title: '[好雷] 鬼出櫃 The Boogeyman'
content: '雷文防雷資訊頁


  鬼出櫃

  The Boogeyman

  2023美國電影



  Disney上架電影


  一名十幾歲的女孩和她的妹妹，仍然對母親的慘死感到震驚，發現自己被家裡的Boogyman

  所困擾，並努力讓悲傷的父親注意到，以免為時已晚。




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  從頭到尾都令人毛骨悚然。

  多年來有一些名稱“Boogeyman”電影。 本片英文片名太俗套了，英文片名The Boogeyma

  n讓它聽起來像是一部廉價的 DVD 電影，中文片名則是令人玩味？鬼？出櫃？ 雖然片名

  不怎樣，但這是一部精心製作、有時經過深思熟慮的恐怖電影。 這是一部獨立電影，在

  所有妖怪類型電影中，是表現傑出的。


  個人滿意度75分（滿分100）。


  以下有劇透。




  1.這部電影的開頭，令人毛骨悚然，而且這種毛骨悚然的感覺持續存在。 這部電影是令

  人揪心的，似乎不讓觀眾喘口氣？ 從開場就抓住你，讓你完全陷入其中，直到結局後才

  鬆一口氣。


  2.主角Sadie（Sophie Thatcher）最近在一場車禍中失去了母親，她的妹妹Sawyer（Vivi

  en Lyra Blair）和她的父親Will Harper（Chris Messin）三人以不同的因應方式，面對

  這悲劇。 Sadie的學校朋友大多取笑她。 本片劇設很通俗，Sadie一開始不相信妹妹Sawy

  er的家中Boogyman說法，然後因故相信了，接下來父親也不相信姊妹的說法，Sadie必須

  要....。


  故事一開始時，看到Will是一名治療師，有一天，Lester Billings來看他，向他講述了

  一個令人不安的故事，講述了他的三個孩子如何被「一個東西」殺死的故事。 由於擔心L

  ester可能有危險，Will報了警，但在他們到達之前，Lester被發現死在壁櫥裡。


  現在Sawyer開始看到Lester描述的同樣的“東西”，這個家庭的磨難即將開始。劇設讓一

  些觀眾起雞皮疙瘩？總是有不祥的預感，每當出現jump scare時，都有充分的理由——而

  且有很多理由！ 房子很黑暗——即使在白天，影片想營造一種恐怖的氣氛，類似於恐怖

  片“Lights Out”，而且它確實有效！


  3.儘管是一部恐怖片，本片仍然是有一些深度，可以看到父女和姊妹情感真摯呈現的時刻

  。 演員們也演出精彩！ 妹妹Sawyer因故全身必須掛聖誕小吊燈的劇情畫面，令人印象深

  刻又可愛！


  4.本片導演Rob Savage才華橫溢，他以風格和謹慎的方式運用鏡頭，出色的聲音設計和混

  音，以及巧妙而柔和的樂譜，為本片每次的驚嚇橋段，建立起期待感，並且一旦事情揭曉

  後，就不會放鬆緊張感。


  這個怪物的設計令人恐懼，它為何會纏上及折磨哪一特質的人？但導演明智地不經常向我

  們展示它，也從未真正向我們詳細展示它。 畫面中瀰漫著黑暗、壓抑的氣氛，給人留下

  許多令人苦惱的想像。


  5.本片不是第一部用悲傷或創傷來比喻怪物的電影，但本片在這方面做得很好。 這個劇

  本中的家庭狀況，面對悲劇及恐怖驚悚的場面是克制的，並且得到了很好的發揮，最終獲

  得了令人滿意的結果。本片是一場超自然的恐怖盛宴，加上結局沒有那麼令我怨嘆，所以

  看完感覺是挺好的。



  --'
