title: '[無雷] 意外超好看的千萬別開門'
content: '因為很喜歡申惠善，想說支持一下沒有想到意外好看


  優點：


  全員演技在線，韓國演員真的沒話講，全部超一流



  全片不到兩個小時，非常緊湊緊張又完整，壓迫感非常強，電影演完之後全身還在小小發抖



  反派夠強夠狡猾，真的會讓人覺得很可怕，配樂與動作戲也設計的很好


  缺點：


  情節有少部分違背正常人反應之處，但看電影也不用計較太多，依然瑕不掩瑜，真的挑不到什麼缺點了


  評分：9.1/10



  -----

  Sent from JPTT on my Google Pixel 6a.


  --'
