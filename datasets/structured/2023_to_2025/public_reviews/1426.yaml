url: https://www.ptt.cc/bbs/movie/M.1694876835.A.9F4.html
title: '[微好雷]有認真拍的《千萬別開門》 '
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  衝著申惠善去看《千萬別開門》，電影色調比她之前的《翻供》明亮


  劇情卻比想像中黑暗，大概2/3都令人蠻緊繃的


  但可以感受到是一部認真拍的電影



  故事說的是一個獨居的女生因為上網買了二手洗衣機發現被詐騙


  因為不甘心上網嗆聲，結果發生了一系列可怕的事……



  申惠善表現出害怕到崩潰的不同層次，蠻厲害的


  拍攝的方式讓裡頭出現的人包括上司、外送、施工的工人都有嫌疑


  如果女生自己一個人住，看完電影真的會害怕XD



  裡面飾演警察的金成均最近因為《Moving 異能》而又紅了一波


  我個人更喜歡他在《請回答1988》裡演的爸爸


  這次是飾演一名「正常的」刑警


  會這樣說是他朋友聽說他正在拍《千萬別開門》（原名Target）時


  都問他是不是演壞人，不然就是一開始是警察結果發現是壞人，讓本人很無言…


  但他在裡面意外有點帥，《非常律師禹英禑》的姜泰伍則是飾演另一位刑警



  電影裡的殺人魔有點太強，是我覺得稍微誇張的地方


  也是比想像中更黑暗的原因，是周末下午沒事可以去看的一部片



  btw申惠善真的很適合長捲髮，美呆～～


  --'
