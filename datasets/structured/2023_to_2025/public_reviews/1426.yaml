title: '[刺激雷] 千萬別開門'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~













  這部片在嫌犯進去女生家裝監視器

  在一些癡漢遊戲裏面會看到類似的手法


  整部片真的壓迫感很強

  只是嫌犯大概是能力點滿的感覺


  可以闖進女主角家

  又能監視 又能遠端電腦遙控等等的


  看到中後段感覺也是有點無力


  如果自己或是自己認識的人陷入這種狀況時

  會怎麼辦？？










  而且看到這片就想到詐騙

  感覺跟台灣的生活很貼近啊 (????


  一些劇本上的小缺點無視


  這還是一部很刺激精彩的犯罪片

  推薦一下



  --





  --'
