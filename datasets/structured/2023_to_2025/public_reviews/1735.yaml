title: '[好雷] 再一次勇敢跳躍 En Corps (2022 法國片)'
content: "去年我期待的已久的法片《舞魂》En Corps (2022) 本週以《再一次勇敢跳躍》之名上映台灣院線！雖然台北沒幾廳但很高興其他許多縣市也都有。本片大賣點，首先是當代巴黎歌劇院芭蕾舞團僅次於星級的「首席舞者」Marion\
  \ Barbeau演出女主角，開場還秀了約十分鐘的全傳統戲服古典芭蕾經典舞作《舞姬》La Bayadère！只消看她一出腿觀眾就知道，好萊塢明星再努力練習演出芭蕾都只是玩票\
  \ XD 只是觀眾若知這齣舞劇在談什麼恐怕也能預知不太樂觀的命運... 然後進入全片正題第二大賣點，則是這十年來三不五時也常來台的現代舞家 Hofesh Shechter侯非胥謝克特！\n\
  \n回想本世紀年輕人舞蹈片都愛玩「跨界」，嘻哈街舞馬戲等街頭玩意兒都很愛跨古典芭蕾、浪漫劇情則歡迎舞伶女主降下凡間認識小伙子 XD 本片也在這「舞蹈跨界」給玉女主角「重獲新生」的舞蹈YA類型中嗎？敘事格局大體神似，只是呈現風格又截然不同：本片由沒碰過舞蹈片的《西班牙公寓》Cédric\
  \ Klapisch編導，他 2000s繆思男神都 Romain Duris 近年 2010s則換 François Civil，這回找個繆思女神拍部舞蹈電影會有什麼新觀點？回想他\
  \ 2000s各片都在拍少年的四海一家、2010s 則常拍攝疏離城市與鄉村的人與人相聚，可以期待這次拍攝舞人也是「以舞會友」。\n\n\n\n故事開始：女主角\
  \ Élise 是巴黎歌劇院首席舞伶，今日擔綱女主演出《舞姬》後臺熱身中，已競業自課努力一生保持著完美狀態，還有舞蹈男友接吻打氣事業愛情兩得意，偷看觀眾席更期待家鄉老父來看她發光...\
  \ 只是完美演出半場後竟發現男友在後台偷吃其他女舞者！芭蕾舞伶的心情一受影響肢體也漸失平衡、隨之而來的台上受傷更是舞者最大噩夢，更慘的是受傷保養手術復健都需要休息時間、但人已26歲了哪來的青春給芭蕾舞者蹉跎？沒辦法，古典芭蕾就這麼卓越而殘酷，無數女孩自小苦練犧牲童年激烈競爭脫穎而出才到今天，但才拼到30歲狀況下滑就告老退休嗎？\n\
  \n Élise 又愛又怨的文學教授父親，他眼中的舞蹈這行就是如此蒼涼，「舞蹈是身體工作」只能撐到30歲、不像我「學者是腦力工作」可撐持一生，Élise雖聽了不服但也不得不低頭，畢竟爸爸見多識廣說得有道理：難道舞蹈就是個燃燒生命閃耀一瞬的行業？為了卓越犧牲童年少年乃至青年人生？要像那些素食者們刻苦自律忘卻享受？追求完美多年一次出錯就打入冷宮？尤其照專業醫生說的：唯有徹底停舞兩年才能保住腳、如敢再跳無異於自殘？曾幾何時女孩牽著媽媽的手滿心雀躍去上的芭蕾、竟成了一個「禁錮」甚至「自殘」的事業？我的人生與我愛的舞蹈已萬難兩全？\n\
  \n\n\n到這裡乍看之下仍有種世故影人看待芭蕾的黑暗視角：芭蕾關於努力與卓越、關於競爭與嫉妒、關於肯認的追求、關於凝視與垂青，尤其許多芭蕾電影其負向者如《黑天鵝》訴求偏執壓抑一生致毀滅死亡、其正向者如《波利娜》訴求刻苦卓越一生方苦盡甘來，除了那些揮別芭蕾擁抱街舞的\
  \ YA 片外有任何電影芭蕾主角得到美好人生嗎？再看古典芭蕾本身的經典劇目，耳聽 Élise 細數奸人挑撥為愛殉情的《天鵝湖》、慘遭負心化作女鬼的《吉賽兒》、乃至本片劇內劇外都女女相爭致傷心傷身的《舞姬》...\
  \ 為什麼古典芭蕾總是在讚頌痛苦？久而久之舞伶命運也總導向悲劇？\n\n在這憤世嫉俗的前提下，本片當然安排 Élise 來場遠離芭蕾的出走，倒不是一般商業片憤世嫉俗藉酒澆愁夜店打炮的那種\
  \ drama，而是她必須認清現實洗盡鉛華、並以芭蕾紀律重建一個新人生。這醫囑兩年不能跳舞的新人生能怎麼過？聯絡舊友看看其他舞蹈逃兵都在幹什麼？最直接的就是但展現優雅體態與身體演技、卻不需真格挑戰舞蹈極限的「演員」，只是舞者轉演員說穿了就只是一群年輕可人小美女，Élise\
  \ 與舊友 Sabrina 一眼看穿其中比芭蕾還糟糕的性別凝視馬上鬧革命！與其再追這種看似光鮮其實出賣肉體的舞台人生、寧可去當廚房幫工以雙手重建平靜人生。\n\n\
  \n\n當廚房小妹削蘿蔔皮算「人生重建」嗎？耳聽他們外燴駐點的藝術村女主人 Josiane拍肩分享：不是每人都有完整家庭天賦才能像妳跳芭蕾、但再破碎家庭再潦倒出身人人都有其「重建」、廚房事務就幫那粗魯直率的廚師老闆\
  \ Loïc重建了他的人生呀！只見 Pio Marmaï演起廚師老闆嬉笑怒罵搞怪耍蠢都當本片開心果 XD 廚房重建人生絕對是可行，但自小喜愛芭蕾渴望跳舞的 Élise\
  \ 一定也還有舞蹈新出路：這天前來藝術村駐點的是曾有一面之緣的現代舞家 Hofesh 由本尊 Hofesh Shechter飾演！Élise每天邊削蘿蔔邊看排練也蠢蠢欲動...\
  \ 只是養傷之身還能參與舞蹈嗎？\n\n片外本尊 Hofesh Shechter就學民族舞蹈上溯文化祭典下探土地身體、片內分身 Hofesh 也帶領舞團信手拈來為\
  \ Élise 也為觀眾揭櫫舞蹈人生全新世界：現代舞蹈modern dance，至少他 Hofesh 這一系現代舞蹈，非關努力、非關卓越、非關偏執、非關競爭、甚至非關破浪而出站上舞台受到掌聲與肯定，而是關於身體的探索、氣息的吞吐、自然的感受、律動的捉摸，總在尋個身心合一或天人合一、在宛如祭神般的來回走動中尋覓那個點、那點一到全身潛勢順水推舟精彩迸發！這樣身心合一讓身體揮灑的舞蹈、和\
  \ Élise 過去浸淫的芭蕾那競業自課苦行完美截然不同。\n\n\n\n也不止排練與舞台，就算在宛如夏令營小木屋的日常散步聊天吃喝hang out，舞蹈也彷彿是他們的人生延伸般無所不在，從來不是什麼負擔沈重的上戲工作下戲休息，而是有事沒事信手拈來舉手投足都能以舞蹈娛樂...\
  \ 原來舞蹈並不一定與人生對立、也可以與人生水乳交融宛如一體？甚至帶傷參與舞蹈也未必要挑戰腳傷、反而順應身體活絡筋骨傾聽身體需求更有益療傷？本片的舞蹈世界觀漸漸清楚：舞蹈未必是逆天的卓越追求、也能是順天的圓滿與療癒；一個舞者撐持完美卻遇上挫折破功傷身時，與其對舞蹈敬而遠之閉關療傷冷凍雙腿、不如傾聽身體善用雙腿滾石不生苔。\n\
  \n很神奇地 Élise 的腳傷竟也漸不藥而癒！當然具體怎樣跳舞完成復建只有舞者自知，總之這與身體親善而非與身體疏離的舞蹈取向已開花結果。這反映的是外人眼中很容易分門別派的「古典芭蕾\
  \ vs 現代舞蹈」差異嗎？這種對立觀點說來很容易，但本片仍有意地透過不經意場合打破這壁壘：「我喜歡芭蕾，只是不愛蓬蓬裙」，當然蓬蓬裙本身無罪，只是暗示芭蕾本身仍是許多人童年長大一生的珍愛、許多女孩的身體成長也與芭蕾早密不可分，是否問題不在芭蕾本身而在外加的規訓型制？眼看三位芭蕾逃兵在眾人起鬨下心血來潮歡欣起舞、舞蹈身體合一的理想本無遠弗屆。\n\
  \n\n\n看本片片頭片尾兩段 credits，觀眾也知不管經歷再多「現代舞蹈」洗禮、主角 Élise 心心念念渴望和解的終究還是「古典芭蕾」，只是片末回憶畫面苦澀道來這古典芭蕾走向異化的童年旅程：本來幼稚園學舞每天雀躍、天天跟媽媽牽手去學舞到了小學、但有天媽媽不在了改爸爸牽手心懷創傷陰影了、舞蹈成了思念母親或忘卻母親的遺緒辯論愈發沈重了、舞蹈人生也慢慢失去童真成了一場執著的追求。眼看開場十分鐘古典芭蕾《舞姬》細節完整構圖均衡是完美遠觀、終場十分鐘現代舞蹈《政治媽媽》卻遠近切換細看身體感受蓄勢迸發，兩種舞蹈的社會欣賞竟走向了歧異。\n\
  \n觀者與舞者漸漸異化的欣賞方式不能重構嗎？舞蹈與身體漸漸異化的訓練方式不能重審嗎？為舞蹈犧牲七情六慾的苦行人生不能翻轉嗎？《再一次勇敢跳躍》舞者主角雖以「腳傷」為出發點踏上另類的療傷旅程、但她邂逅的「舞蹈治療」不只治癒身體重建全新人生、更要與一生珍愛乃至人生創傷完成和解。這個和解關於身體當然採取與身體最相關的「舞蹈片」形式、但各行各業的不同觀眾回想各自事業與人生是否都曾有某些解不開的結？令我們本來暢快擁抱的人情事物走味變質反成一生枷鎖？推薦喜愛芭蕾與各類舞蹈的觀眾欣賞，這片舞蹈敘事絕不悲情偏執而充滿正能量！\n\
  \n\n--\n至於導演愛將 François Civil飾演的親密物理治療師 Yann 出來跟 Élise 先心心相印曖昧一回、但去了「印度果阿」回來後慘遭打槍\
  \ XD 這囧男劇情又是要表達什麼？我猜大概是在說一種西方人遇到人生挫折就去異國流浪「找自己」的外求取向吧... 但另一邊 Hofesh 鼓勵 Élise 腳傷仍要繼續順勢用腳滾石不生苔，不論身體還是人生的挫折療癒都要回歸自我「不假外求」。\n\
  \n\n--"
