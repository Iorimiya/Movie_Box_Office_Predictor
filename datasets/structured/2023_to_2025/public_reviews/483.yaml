url: https://www.ptt.cc/bbs/movie/M.1742251974.A.EC9.html
title: '[新聞] 無痛先生創下今年票房新低週'
content: '新聞網址：



  《無痛先生》以870萬美元的成績，在年度最差週末中登頂，觀眾對新上映電影感到麻木


  談到電影情節，這部電影恰如其分地贏得了2025年迄今為止國內票房最冷清的週末，也是

  後新冠疫情時代最糟糕的週末之一。


  派拉蒙的動作喜劇（Novocaine）輕鬆以870萬美元的開畫成績登頂國內票房榜，將第二週上映的《米奇17》

  （Mickey 17）擠到了第二位。然而，該製片廠原本希望票房能接近1000萬美元。《麻醉

  》由傑克·奎德主演，他飾演一種新型動作英雄，他不太擅長主動出擊，但他的確很能承

  受傷害——這要歸功於他的基因，讓他感覺不到任何傷害。


  爭奪第三名的是史蒂文·索德伯格的新電影《黑袋行動》（Black Bag）和華納兄弟命運

  多舛的《米奇17》（Mickey 17），兩者票房均約為750萬美元（最終數據將於週一公佈）

  。後者較首週末票房下跌超過60%，截至週日，其國內總票房估計略高於3300萬美元，全

  球總票房為9040萬美元。


  整個週末沒有一部電影票房突破1000萬美元，這實屬罕見。本週末的國內總票房收入估計

  為5470萬美元。在此之前，只有2025年的超級碗週末票房更差，為5580萬美元（前五名電

  影均獲得觀眾的B級CinemaScore評分，這可能並非巧合）。


  漫威的續集電影《美國隊長：勇敢新世界》（Captain America: Brave New World）在其

  第五個週末仍保持在票房榜前列，以550萬美元的成績位居第四，其北美總票房接近1.9億

  美元。迪士尼影業本週末達成了另一個里程碑，成為今年首個票房收入超過10億美元的製

  片廠。


  回到新上映的混雜電影。動畫電影《樂一通大電影：地球停轉之日》（A Looney Tunes

  Movie: The Day the Earth Stood Still）以320萬美元的成績位居國內票房榜前五名，

  而獨立信仰題材電影《最後的晚餐》（The Last Supper）則以280萬美元緊隨其後。


  可以說，影院業者正在倒數計時，等待迪士尼春季真人電影大片《白雪公主》（Snow

  White）的上映，這絕對是輕描淡寫。幸運的是，緊隨其後的是電玩改編電影《麥塊

  大電影》（A Minecraft Movie）。兩部電影預計都會有穩定的票房表現，其中《白雪公

  主》預計下週末將在國內開出5000萬至5600萬美元的票房。


  “票房確實很低，但肯定不是最差的。這是國內票房連續幾個週末維持在5000萬美元左右

  的又一個例子，”Comscore首席票房分析師保羅·德加拉貝迪安說。“下週情況會改變！

  ”


  命運弄人，最近的下滑殘酷地提醒我們，影院尚未從疫情中完全恢復，再加上2023年的勞

  工罷工。2025年3月20日，將是美國各地影院因整體封鎖而關閉五週年的日子。








  可惜阿，無痛先生真的好看，黑袋行動爛番茄飆升到97%，都表現不好，對片商來說真的

  是痛，太痛了


  --'
