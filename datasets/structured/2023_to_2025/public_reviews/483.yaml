url: https://www.ptt.cc/bbs/movie/M.1742379231.A.0E9.html
title: '[雷] [普雷] 無痛先生'
content: '雷文防雷資訊頁


  覺得沒什麼娛樂感

  如果你愛看暴力美學片，這部只有暴力沒有美學

  有種老套感


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  簡單來說就是一個剛陷入戀愛的宅男想去英雄救美

  從頭到尾就是不斷被揍被打

  我個人是沒有覺得特別好笑，反而覺得有點心酸


  整部片就是一直換不同地方打鬥，沒什麼特別劇情

  除了女主角身份有反轉讓人有點驚艷（如果沒有這個反轉我可能就給負雷了）


  整部片發便當發得很勤

  除了主角威能以及主要幾個配角幾乎死光

  死一堆人只為了要顯示反派心狠手辣，壞人就算了，好人死一堆的設計也讓我覺得沒什麼爽

  片感


  男女主角都沒什麼明星光環，感覺也不搭

  也是看了無感的原因


  我是戲院派的，但這部真的是少數我覺得看串流好像也沒差


  --'
