title: '[選片] 無痛先生 米奇17號 風之谷'
content: '如題，


  要帶剛認識的對象去看電影，


  對方不是電影迷、也不太會追劇


  自己對劇情深度比較追求，所以偏向米奇17號


  這三部想選一部，看完可以有討論火花、然後觀影後的心情是愉悅的。


  以其它電影來舉例，大概就是絕地救援這種觀後感。


  --

  Sent from nPTT on my iPhone 15 Pro Max


  --'
