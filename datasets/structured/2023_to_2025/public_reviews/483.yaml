url: https://www.ptt.cc/bbs/movie/M.1742058299.A.A2D.html
title: '[好無雷] 【無痛先生】Aka 戀愛腦先生'
content: '‧


  雖然素材並非相當新穎，劇本也是模板套路，不過這樣輕鬆有趣的爆米花電影，的確給予

  觀眾非常高的觀影娛樂；而編劇也毫不手軟，為傑克奎德安排了好幾場痛感十足的武打戲

  ，且頗具新意；雖然說是部輕鬆不動腦的爆米花電影，但實際上對膽小或怕血腥的觀眾而

  言，很可能會是場驚嚇之旅。



  ‧


  做為星二代的傑克奎德，的確在【無痛先生】中，表現的算是可圈可點，雖然不會是什麼

  太經典的演出，但稱職扮演好罹患CIPA的主角，而且是個超級戀愛腦，已經是無法感覺到

  疼痛及溫度之下，加上被愛情沖昏頭的加持，上刀山下火海都在所不辭；但傑克奎德這部

  片的外型上，一直讓我覺得有點神似安德魯加菲（笑）


  雖然劇情有點虎頭蛇尾，最精彩的打鬥並非擺在結尾，實際上中段劇情比起後段，還要好

  上不少，許多新穎的打鬥設計，會讓觀眾驚嘆“這也太痛了吧！”


  反派角色也不含糊，大多不算是無腦對打及收尾，但警察線真的是過於空洞，看得出來是

  要配合喜劇成份的演出，但實際上是有點浪費這一線的劇情。



  ‧


  雖然是部標準不動腦的娛樂電影，但還是暗藏了些許患者的無奈。


  「全身感受不到痛楚，你一定是超級英雄。」


  做為CIPA患者的主角，在生活上還是有諸多的不便，也只是個武力數值低下的普通人，但

  本片沒有任何以這樣的CIPA病症，來大量教育觀眾的情節，只隱藏在看似詼諧搞笑的橋段

  及台詞中，加上荷蘭蜘蛛人的好夥伴雅各布貝塔隆的出演，而在本片中，也是擔任這位「

  超級英雄」的普通人的好友，也算是個另類對比。



  ‧


  【無痛先生】是部比預想期待還要好的娛樂作品，縱使它結尾並不算收得太好，但單就娛

  樂性，還是能給予相當好的評價，也並沒有把因為無痛元素，更加倍誇張化主角威能，算

  是不錯的爆米花電影，推薦給週末想放鬆的觀眾，只是害怕血腥跟痛楚感的觀眾，就要三

  思一下了。




  ‧





  --'
