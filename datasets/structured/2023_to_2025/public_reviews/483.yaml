url: https://www.ptt.cc/bbs/movie/M.1741754246.A.C56.html
title: '[好雷] 《無痛先生》越不痛，就越痛'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  《無痛先生》(Novocaine)可以說是一部反向的「棍棒喜劇」(Slapstick)。

  .

  所謂的「棍棒喜劇」強調動作場面的作用力與反作用力：以大量直接而強烈的暴力鏡頭，

  配合角色誇張滑稽的表情與動作來逗笑觀眾。著名的代表作包括《樂一通》動畫系列、《

  小鬼當家》系列(不知道你們有沒有注意到這部標榜闔家觀賞的聖誕電影其實有多麼的暴

  力)、還有去年造成熱門話題的《貍太怨》等。

  .

  而《無痛先生》則透過了「感受不到痛覺」這樣的主角設定，翻轉了棍棒喜劇的原則：這

  類型的喜劇片正是靠角色如同漫畫般的誇示表演來稀釋暴力對肉體造成的傷害與疼痛感，

  讓觀眾可以放心地大笑。但這片正好相反，因為主角對於所有的疼痛免疫，在電影中無論

  受到了多麼大的傷害，他都毫無反應，這樣反而將那股痛感轉移到了觀眾身上，主角越是

  不痛，觀眾就越感到痛，試片當天比起笑聲，觀眾席發出更多的是驚呼聲跟倒抽一口氣的

  聲音，可見這片確實達到了跟觀眾連結的效果。

  .

  這邊講個題外話，電影開演沒多久我自己就在沒人看得到、幽暗的電影院裡演了一齣棍棒

  喜劇：這次片商特別在開演前特別準備了Tabasco醬包發給大家(跟電影內容沒什麼關係，

  好像是贊助商？)，我剛好買了熱狗堡，就順勢把醬淋上去配著吃，因為電影院裡幾乎沒

  光線的關係，我沒注意到手指上沾到了醬汁，電影開演後沒多久我揉了一下眼睛，結果他

  媽痛爆，但我又怕離場去廁所會錯過劇情，最後搞到我得用飲料裡的冰塊來洗眼睛，讓我

  整個人精神都好了，接下來看電影有夠專注的。這是什麼沉浸式體驗？我都不敢想像我接

  下來去看《絕命終結站血脈》會遇到什麼事情了。

  .

  一開始看到這片的預告，我原本還以為這片又是出自大衛雷奇的87North製片公司之手，

  畢竟看起來很像他們最愛的動作電影公式：找一個非典型動作派男星演出，主角是藏在日

  常生活當中的動作英雄。後來發現其實不是還挺驚訝的，實際看完後覺得相比87North的

  電影，這片的動作編排沒有那麼花俏華麗，不過主角確實也不是什麼隱世高手，就只是一

  個不怕痛的肉體凡胎，打不出什麼厲害的格鬥技或槍戰飛車也是自然的。

  .

  也因為如此，主角每場戰鬥都是用貼上去換血的不要命打法，所以電影中動作戲其實並不

  多，他從頭到尾只有四個對手，以動作片來講這個數量少到可憐，不過想想也是合理，光

  是處理這四個人就幾乎讓他達到肉體極限了。光看對上這四個對手的動作戲其實也挺夠看

  了，該給的殘暴血腥沒有少，再搭配主角那種看起來人畜無害的特質，有種荒謬到好笑的

  喜感。

  .

  但得說句老實話，電影是好看的沒錯，不過如果你看過預告的話，這片的驚喜會少了大半

  ，預告幾乎已經完整呈現了電影前兩幕近八成的劇情，包括主角遭遇的前三場戰鬥裡的高

  潮戲，剩下的時間就是稍微灌水把這三場動作戲之間的時間補滿，最後第三幕高潮戲透露

  不多，這段娛樂性還不錯。如果你對這片感興趣、又很幸運的沒看過預告的話，我會建議

  你直接去看，這樣是最能享受這片的完美狀態。

  .

  話說這片正反派的選角，正好讓我們見識了兩位星二代在影壇逐漸站穩腳步：傑克奎德在

  這片跟稍早的《完美伴侶》中的角色，似乎奠定了他演出這種不起眼魯蛇的戲路，如果他

  想繼續演出類型電影，這種氣質除了演出像這樣的反差動作片之外，未來無論是在愛情喜

  劇或是驚悚恐怖片中都很好發揮。而雷尼克遜則完美繼承了他老爸那彷彿都自身都無法駕

  馭的、從骨子裡散發出來的瘋狂基因，去年在《微笑二》裡小試身手，這次則火力全開，

  接下來的《Borderline》看起來也沒有絲毫的收斂，顯然是打算繼續瘋下去。

  .

  最後這段有點雷，還沒看過電影的可以先在這邊結束閱讀。我其實原本看電影前是蠻擔心

  主角的，這個人物設定怎麼看都覺得他很難善終，就算沒死，感覺最後就會看到他癱瘓地

  坐在輪椅上甚至躺在床上、但還是強顏歡笑跟女主角嘻嘻哈哈的的辛酸畫面之類的，還好

  這終究是部娛樂電影，還是給了他一個平安康復的快樂結局。但還是覺得這片別拍續集了

  ，這種罪讓他受一次就夠了。


  --'
