url: https://www.ptt.cc/bbs/movie/M.1743351892.A.317.html
title: '[好無雷] 無痛先生 意外好看的爽片'
content: '如果用三個形容詞來形容這部電影

  可能會是：刺激、誇張、意料之外


  整部電影表現有點超乎預期的精彩，好幾次轉折都大開眼界

  劇中的笑點我也蠻喜歡，討喜卻又不尷尬


  男主角的演技有撐起浮誇的劇情

  銀行副理的人設讓身穿西裝的他在動作戲變得更有反差感

  「無痛」的設定也不免俗的有許多血腥畫面，光看了就很痛


  整體我覺得蠻不錯的，動作片段精彩、笑點滿滿

  在電影院看是蠻爽的，推


  --'
