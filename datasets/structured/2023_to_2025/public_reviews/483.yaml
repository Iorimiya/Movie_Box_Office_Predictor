title: '[好雷] 無痛先生:痛，太痛了'
content: '無痛先生描述黑袍糾察隊的休伊(誤)有了先天性疾病，不會感到痛，某次公司意外被

  搶劫，心儀的女生被綁走，決定出手拯救的過程


  中文翻譯成無痛先生，不過就和前幾篇講得一樣，全程觀眾看的就是「痛，太痛了!」

  旁邊做一個男生常常摀著臉在看


  這個不會痛的設定就是給男主戰鬥爽用的，建議別看預告，很多關鍵瞬間都放在預告了


  這算是原創劇本，很高興終於有新東西出現在大銀幕，對比關繼威的狠狠愛，真的差很多


  比較不滿的是片尾最後有放希望大家關注這些罕見疾病患者的字幕，不過放在最後面，

  大家都收東西準備要走了，恐怕沒人會注意到這一段蠻有意義的聲明吧


  總之這可以是近期比較有娛樂性的爽片，如果對米奇17號有點失望的話，可以去看看這部

  說不定耳邊還會響起黑袍糾察隊的屠夫說:「太好了我的男孩長大了!」


  --'
