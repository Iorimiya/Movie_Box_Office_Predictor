title: '[好雷] 無痛先生'
content: '雷文防雷資訊頁





  防雷




















  __________________________

  從影廳出來還是一種興奮的感覺

  真的爽


  主角就只是一個普通人，只是不會痛而已，也是會受傷，失血過多也是會死。

  這不是一部超級英雄電影

  這是一個普通人被迫成為英雄的電影


  一路過關斬將 打倒1號敵人 2號敵人 3號敵人

  最後在感覺就要結束的時候來個小反轉


  主題明確、支線剛好，沒有扯太多議題

  比起隔壁米奇17，不拖泥帶水

  今年終於看到一部爽片了


  不過宣傳不太灑錢的感覺

  之前進戲院的預告也沒有看到過

  主海報也沒有很好看

  票房可能會有點慘


  明天被白雪攻佔之前還是推薦去看看至少是近期的爽片



  --

  其實並不慢

  現在還在首週。

  是的

  很多CIPA病人就是因為沒有痛覺的警告做出很多危險事情最終喪命'
