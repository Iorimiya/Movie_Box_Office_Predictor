url: https://www.ptt.cc/bbs/movie/M.1762881825.A.B46.html
title: '[好雷] 無痛先生'
content: '防雷




























  當初在電影院有看到海報,覺得這種題材蠻酷

  不過比較吸引我注意的還是丹尼斯奎德的兒子

  只能說這種二代的確需要更多努力去擺脫這種印象

  有好有壞吧,我覺得有在認真耕耘就沒關係

  話說回來這部電影是有做好他的定位,娛樂性不錯

  動作戲比想像中好上不少,廚房那段是精彩的

  而且男主角不會痛但並非無敵這個設定我認為很棒

  不管是沒讓他太扯,也能帶到他心境上只是普通人

  男主角散發著很真誠的感覺,想融入大家卻格格不入

  這是我最喜歡的地方,比起那些誇張橋段

  我覺得傑克奎德還不錯啦,希望他能讓自己發光發熱

  只是他的演技應該是可以再上去的


  ----

  Sent from  on my Samsung SM-S9280


  --

  我見過...你們這些人不會相信的事

  我目賭在獵戶座的邊緣著火的攻擊艦

  我看見C光束在湯豪色星門附近，在黑暗中閃亮著

  所有這些時刻都會消失...於時間中，一如眼淚...消失在雨中

  死期到了


  --'
