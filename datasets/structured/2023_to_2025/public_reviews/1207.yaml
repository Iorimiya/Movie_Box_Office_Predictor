title: '[雷] 坂本龍一OPUS - 100分鐘的音樂會'
content: '這片其實也沒什麼好雷的啦...還是防雷一














  雷文開始


  去年差不多時間剛好看顏尼歐



  這部跟顏尼歐比起來我比較喜歡顏尼歐，但兩部的本質是不太一樣的。去年的顏尼歐有點

  像是紀錄片，從顏尼歐發跡開始介紹到最後，中間穿插著一些他配樂的電影片段、相關人

  士的訪談，甚至音樂人在演唱會中致敬的片段。我的觀影背景只知道新天堂電影院、教會

  、海上鋼琴師等是他配樂的，但看完這部以後感覺比較認識顏尼歐了。也發現有些看過的

  電影原來是他！ 還有看到一些穿插的電影好想看。這也是我比較喜歡顏尼歐那部的原因

  。


  坂本龍一這部則是音樂會的形式，全片沒有對白，只有坂本龍一中間呢喃不超過五句。整

  場沒有別的樂器或配樂，只有坂本龍一跟Yamaha鋼琴。場景也只有錄音室，在演奏過程用

  各種角度特寫坂本龍一與鋼琴。這週首映有送贈品，其實有點像宣傳DM,裡面有簡介本片

  、導演，藝文界任務推薦序，最有價值的就是其中一頁附了整部片的歌單


  封面



  歌單 （巨雷！！！ 小心）




  曲目應該都是坂本龍一以往電影的配樂。電影（應該說音樂會）裡全部重新編曲然後用鋼

  琴親自詮釋。比起顏尼歐那部，這部你可以聽到完整的曲子。我有聽到怪物跟最期待的末

  代皇帝（mi re mi la ~ mi re mi sol~ mi re mi la~ si do si me re) 其他的我可能

  沒看過或不知道是坂本龍一配的。如果你期待鋼琴演奏會可以買票，100分鐘沒什麼間斷

  聽到爽。我是覺得只有一個樂器有些單調。但這部擺明就主菜吃到飽的概念。


  其中有一個橋段我滿喜歡的，結尾的時候有一幕是鋼琴自己動彈出坂本龍一的音樂，應該

  是象徵著人不在了但是他的音樂還是留在世界上。



  -----

  Sent from  on my iPhone


  --'
