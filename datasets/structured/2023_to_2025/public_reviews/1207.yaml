title: '[新聞] 【坂本龍一：OPUS】跨年特別場搶先看！'
content: '新聞網址：



  以音樂感動全世界的傳奇音樂家坂本龍一，由他竭盡全力所進行的最後一場音樂會電影《

  坂本龍一：OPUS》，即將在明年3月15日在台上映。電影公司在上週公佈上映訊息之後，

  獲得廣大樂迷熱烈討論。為了讓忠實粉絲可以搶先觀賞到這部難能可貴的作品，電影公司

  特別舉辦「跨年特別場」搶看活動，預計在年末12月31日晚間23:10於台北MUVIE CINEMAS

  頂級影廳「TITAN SCREEN」進行僅此一場的放映，也將成為粉絲難以忘懷的作品。票券將

  在本週六（12/16）中午12:00限量開賣，座位有限，請務必把握搶票機會。值得一提的是

  ，坂本龍一親自參與本片選曲，並賣力演奏20首精采曲目，從他在黃色魔術交響樂團（

  Yellow Magic Orchestra）時期的實驗電子音樂，到最後個人專輯《12》中的收錄曲，都

  是他以音樂告別，為觀眾帶來的特別獻禮！





  《坂本龍一：OPUS》雖然選在明年3月15日上映，但從上映訊息公開之後，就備受樂迷期

  待與討論，片商更收到許多期盼提早上映的留言。為了回饋廣大樂迷的支持，台灣片商特

  別選在年末12月31日晚間23:10，於台北MUVIE CINEMAS的「TITAN SCREEN」舉辦「跨年特

  別場」搶看活動，讓本片即將成為觀眾在今年的最後一部，也同時是明年的第一部電影。

  票券乙張600元（不適用其他優惠），預計將在本週六（12/16）中午12:00於MUVIE

  CINEMAS臨櫃暨自動取、購票機，以及威秀影城官方網站與APP開賣。凡購買本場電影票，

  即可在活動當天進場時，憑電影票根乙張獲得本片限定「原文典藏款A3海報」乙份，數量

  有限，售完為止，敬請把握搶票機會，更多活動資訊請見公告連結。（


  ）



  值得一提的是，本次「跨年特別場」將成為本片首度在台的第一場放映，為了帶給觀眾最

  頂級的影音享受，電影公司特別選在MUVIE CINEMAS的「TITAN SCREEN」舉辦。影廳不僅

  透過充分的座位高低差，打造遼闊壯觀的空間感，更透過4K雷射投影，銀幕使用高亮度

  RGB放映機，音響部分則全是隱藏式 7.1 環繞音響。尤其本影廳受到美國知名THX認證，

  不論影廳畫面對比度、色彩、聲音響度、音場頻率全都是最高規格，也是全台第一家通過

  此認證的影城，請影迷務必把握本場放映，透過悠揚的琴聲陪伴跨年，締造難以忘懷的觀

  影體驗。





  在《坂本龍一：OPUS》當中，坂本龍一積極參與選曲、編曲、錄音與演奏，透過這部只有

  他跟鋼琴的音樂會，為聽眾帶來最後一次的問候，也透過音樂帶給觀眾深深的感動。曾以

  多首電影配樂榮獲奧斯卡、金球獎、英國奧斯卡、葛萊美獎等多項榮耀的他，片中只見他

  獨坐舞台，緩緩演奏20首涵蓋他職業生涯各時期的代表作品。從他在黃色魔術交響樂團時

  期的實驗電子音樂，到他為《俘虜》（Merry Christmas, Mr. Lawrence）、《末代皇帝

  》（The Last Emperor）、《遮蔽的天空》（The Sheltering Sky）創作的獲獎電影配樂

  ，以及他最後個人專輯《12》中的收錄曲〈20220302 – sarabande〉。同時，也網羅他

  過去沒有以鋼琴獨奏過的作品，包括〈咆哮山莊〉〈The Wuthering Heights〉和〈

  Ichimei – Small Happiness〉，還包括對1978年黃色魔術交響樂團歌曲〈東風〉〈

  Tong Poo〉的重新編曲。透過20首美麗曲目的最後演奏，為觀眾帶來感動與慰藉的力量。



  由坂本龍一竭盡全力進行的最後一場音樂會電影《坂本龍一：OPUS》，即將在明年3月15

  日於台灣正式上映。本片紀錄以優美旋律為全球樂迷帶來感動與慰藉的音樂大師坂本龍一

  ，他竭盡全力演奏出他音樂生涯的20首經典曲目。悠揚的琴音在舞台與燈光之間流淌，時

  而慑人心神，時而令人屏息。坂本龍一的最後一場演奏，也是他以音樂獻給全世界的美麗

  問候。



