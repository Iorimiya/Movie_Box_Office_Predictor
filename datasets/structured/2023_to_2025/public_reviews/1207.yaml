url: https://www.ptt.cc/bbs/movie/M.1710850453.A.41C.html
title: '[新聞] 影評人馬欣講座分享【坂本龍一：OPUS】'
content: '新聞網址：



  日本音樂大師坂本龍一的最後一場音樂會電影《坂本龍一：OPUS》，目前正在台灣好評熱

  映當中。曾出版坂本龍一首部正式自傳《音樂使人自由》，以及生前最後文字作品《我還

  能再看到幾次滿月？》的麥田出版社，於上週日（3/17）舉辦本片的映後講座，邀請到影

  評人馬欣擔任主講人。本次音樂會與2022年坂本龍一於線上舉辦的演奏會《坂本龍一：

  Playing the Paino 2022》相較而言，選曲更加豐富，從YMO時期、鮮少演奏的《咆嘯山

  莊》〈The Wuthering Heights〉，到這次新增的〈Trioon〉與〈Happy End〉等作品，馬

  欣認為：「此次演奏是他人生各個階段的完成」，其中更包含他對世人的祝福，並展現「

  如何將自己所相信、熱愛的事情推進到人生的最後一刻。」由於本作是在坂本龍一生命最

  後的幾個月中拍攝，而人在將死之時、病痛折磨之際，仍能專注在自己虔誠的事物上，馬

  欣認為是非常難能可貴的精神，也推薦本片不僅樂迷能夠觀賞，還適合讓更多人一起認識

  這部作品。





  由坂本龍一親自參與選曲、演奏的音樂會電影《坂本龍一：OPUS》，和2022年線上舉辦的

  音樂會《坂本龍一：Playing the Paino 2022》不同的地方，是這次選曲拿掉了〈小活佛

  〉（Little Buddha），並增加了八首曲目。馬欣提及其中包含了坂本龍一初生之犢之時

  所完成的〈東風〉（Tong Poo），用於電影《怪物》中傳遞孩子救贖的〈Aqua〉，將原先

  由心臟、電療器與鋼琴合成器完成的〈Trioon〉，改為以鋼琴獨奏的形式呈現。涵蓋坂本

  龍一音樂人生的20首選曲，讓馬欣認為：「這次演奏是他人生各個階段的完成。」



  此外，馬欣也表示坂本龍一曾說過：「如果今天有可能的話，希望這個演奏會可以留到後

  世。」她分享：「留到後世是指『留給後世的一個禮物』，而這份禮物是『祝福與不要怕

  犯錯』。」其中當坂本龍一演奏到〈美貌的晴空〉（Bibo no Aozora）時，片中可見坂本

  龍一出錯的片段，也被身為導演的兒子空音央保留了下來，馬欣補充：「在〈美貌的晴空

  〉需要即興功力的時候，可以看到他出錯了，他後來也有承認自己出錯，而執導本片的是

  他的兒子，他的兒子太了解他，知道這段不能刪掉，也問過他本人而沒有刪除。」她更進

  一步分享：「這會被保留下來的原因，便是因為他想留下的是『不要害怕犯錯』。」





  不僅如此，馬欣也認為坂本龍一正是用自己所相信的音樂與藝術，在接受所有世界上的事

  物，在《坂本龍一：OPUS》中展現出「如何將自己所相信、所熱愛的事情推進到人生的最

  後一刻」。她更表示：「這次的演奏會，不只是一次藝術活動，不只是對於教授的緬懷與

  追悼，其所要傳遞的訊息是『要有所熱愛的事物，並且對它虔誠』。」而當人在將死之時

  與病痛折磨之際，仍然能夠專注於自己所虔誠的事物，馬欣表示：「這個精神不會是很多

  人會有的，他傳遞出這樣子音樂會的特別性。」如此難能可貴的精神，也讓她推薦本片不

  只可以給坂本龍一的樂迷觀賞，也適合更多人一起欣賞這部作品。



  由坂本龍一竭盡全力進行的最後一場音樂會電影《坂本龍一：OPUS》，目前在台灣熱映當

  中。凡購買本片第二週（3/22-3/28）電影票乙張，即有機會獲得電影原文曲目明信片乙

  張，數量有限，送完為止。本片紀錄以優美旋律為全球樂迷帶來感動與慰藉的音樂大師坂

  本龍一，他竭盡全力演奏出他音樂生涯的20首經典曲目。悠揚的琴音在舞台與燈光之間流

  淌，時而慑人心神，時而令人屏息。坂本龍一的最後一場演奏，也是他以音樂獻給全世界

  的美麗問候。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
