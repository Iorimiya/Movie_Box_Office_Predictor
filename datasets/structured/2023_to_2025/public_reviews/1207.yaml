url: https://www.ptt.cc/bbs/movie/M.1701953369.A.A88.html
title: '[新聞] 音樂大師【坂本龍一：OPUS】的最後謝幕'
content: '新聞網址：



  榮獲奧斯卡、金球獎、葛萊美獎等眾多獎項的「日本傳奇音樂巨匠」坂本龍一，今年3月

  28日因為癌症逝世，享壽71歲。在他逝世前幾年，已經無法再進行現場演出，更遑論龐大

  的全球巡演。隨著病情逐漸惡化，他感受到人生即將邁向盡頭，卻仍抱持「想再製作一次

  音樂作品」的意志，在他生命最後的幾個月當中，集中精力準備音樂會電影《坂本龍一：

  OPUS》拍攝，並積極參與選曲、編曲、錄音與演奏，以一部只有他跟鋼琴的音樂會，透過

  20首涵蓋他音樂人生的經典選曲，展現自己的靈魂樂章，就如他所經歷的人生一樣，透過

  這場音樂會，為聽眾帶來最後一次的問候。不僅接連入選威尼斯、紐約、倫敦、東京等國

  際影展，全片更透過黑白影像與多角度照明，以高藝術性呈現他的演出。本片也確定由「

  采昌國際多媒體」購入台灣版權，即將在明年3月15日正式上映，台灣觀眾屆時也將透過

  大銀幕，感受音樂大師驚人的集中力與能量，獲得感動與慰藉的力量。





  《坂本龍一：OPUS》由坂本龍一的兒子空音央執導，經紀人伴侶空里香，以及増渕愛子、

  沼澤尚、艾瑞克尼亞里（Eric Nyari）、艾伯特托倫（Albert Tholen）等人共同製作。

  攝影則由美國攝影師比爾克爾斯坦（Bill Kirstein）領軍，出動近30人的龐大團隊參與

  其中，並專程從美國運來三台4K攝影機進行拍攝。坂本龍一也積極參與選曲、編曲、錄音

  與演奏，表演地點則選在他所熟悉的NHK509工作室進行拍攝，他對此表示：「這個電影的

  構想，是以一種值得保留到未來的方式去紀錄我的表演——在我還能表演的時候。我認為

  這個地方提供日本最好的音響效果。」近期剛獲得《電影製作人》雜誌（Filmmaker）評

  選為25位獨立電影新面孔之一的導演空音央，堅持讓父親提前選擇所要演奏的曲目，透過

  縝密的企劃進行拍攝，並透過穩健的攝影機運動，以及風格化的黑白影像，原封不動向觀

  眾呈現只有坂本龍一與鋼琴的世界。製作團隊透露，當坂本龍一觀賞本片剪輯完成的版本

  之後，也肯定「這是一部很好的作品。」言語當中透露出對製作團隊的驕傲。



  片中，只見坂本龍一獨自坐在舞台上，緩緩演奏他20首代表作品，曲目涵蓋他職業生涯的

  各個階段，從他在黃色魔術交響樂團（Yellow Magic Orchestra）時期的實驗電子音樂，

  到他為《俘虜》（Merry Christmas, Mr. Lawrence）、《末代皇帝》（The Last

  Emperor）創作的電影配樂，以及他最後個人專輯《12》中的音樂。同時，也網羅坂本龍

  一過去沒有以鋼琴獨奏過的作品，包括〈咆哮山莊〉〈The Wuthering Heights〉和〈

  Ichimei – Small Happiness〉，還包括對1978年Yellow Magic Orchestra歌曲〈東風〉

  〈Tong Poo〉的重新編曲。





  《坂本龍一：OPUS》在2023年威尼斯影展進行世界首映過後，陸續在紐約、倫敦、東京等

  國際影展上放映，獲得來自全球的廣泛認可。國際媒體與觀眾的感動佳評，更讓人們對本

  片的期待度水漲船高。《綜藝》（Variety）盛讚：「他的音樂栩栩如生，是給全世界的

  獻禮。」RogerEbert.com表示：「為了無法欣賞他演出的下一代，展現出坂本龍一獨創性

  和音樂遺產的最後一場演出。」indieWire肯定：「只有坂本龍一才能做出的告別問候。

  」在在體現坂本龍一為了給予他所熱愛的樂迷，傾注自己最後全力所帶來的這場音樂會，

  也將成為樂迷們感動與慰藉力量的特別獻禮。



  由坂本龍一竭盡全力進行的最後一場音樂會電影《坂本龍一：OPUS》，即將在明年3月15

  日於台灣正式上映。本片紀錄以優美旋律為全球樂迷帶來感動與慰藉的音樂大師坂本龍一

  ，他竭盡全力演奏出他音樂生涯的20首經典曲目。悠揚的琴音在舞台與燈光之間流淌，時

  而慑人心神，時而令人屏息。坂本龍一的最後一場演奏，也是他以音樂獻給全世界的美麗

  問候。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



