  12:00在「博客來售票網」限定販售（

  ），數量有限，售完即止。不

  僅如此，本片也將與臺中國家歌劇院進行串聯活動，只要憑NTT Arts NOVA當中，坂本龍

  一最後一部舞台作品《TIME》的演出票券（紙本票與電子票均可），即可從3月1日中午

  12:00起，至台中中港新光影城臨櫃購買3月9日19:30放映的《坂本龍一：OPUS》台中特別

  場，並享有330元優惠票價，以及獲得「電影原文曲目明信片」特典乙份。機會難得，敬

  請把握優惠良機，詳情請洽片商官方社群查詢！



  這部由坂本龍一竭盡全力進行的最後一場音樂會電影《坂本龍一：OPUS》，即將在3月15

  日於台灣隆重獻映。本片紀錄以優美旋律為全球樂迷帶來感動與慰藉的音樂大師坂本龍一

  ，他竭盡全力演奏出他音樂生涯的20首經典曲目。悠揚的琴音在舞台與燈光之間流淌，時

  而慑人心神，時而令人屏息。坂本龍一的最後一場演奏，也是他以音樂獻給全世界的美麗

