url: https://www.ptt.cc/bbs/movie/M.1709896304.A.A18.html
title: '[新聞] 【坂本龍一：OPUS】讓坂本龍一欣慰又滿意'
content: '新聞網址：



  以音樂感動全世界的音樂巨匠坂本龍一，由他竭盡全力進行的最後一場音樂會電影《坂本

  龍一：OPUS》，即將在3月15日於台灣隆重獻映。坂本龍一在八天的拍攝期中，每天以三

  首歌曲、每首歌曲二到三次的拍攝，並選在他認為日本最好表達聲音細節的NHK 509攝影

  棚進行演奏拍攝。搭配細緻的攝影機運動，以及充滿詩意的燈光變化，也瞬間捕捉到他不

  穩定的呼吸，以及手部及呼吸的顫抖、表情與小動作，讓觀眾彷彿透過大銀幕跟大師近距

  離接觸，就連他本人都稱讚：「在我逝世之前，對能夠錄製下這場我滿意的演出，感到十

  分欣慰。」值得一提的是，適逢本片即將上映，台灣片商也推出「第一週戲院入場特典」

  ，凡購買本片第一週電影票乙張，就有機會獲得「台灣獨家電影小冊子」乙份，內容包含

  電影介紹、演出曲目，並獨家收錄陳建騏、廖偉棠兩位大師撰寫的推薦與導聆，請務必把

  握蒐藏機會。





  坂本龍一以《坂本龍一：OPUS》，向樂迷進行他竭盡全力的最後一場演奏。雖然拍攝當下

  ，他的身體狀態已經處在艱難的情況，但他依然從2022年9月8日錄到9月15日，在八天當

  中以每天三首歌曲、每首歌曲二到三次的拍攝，就像跟鋼琴融為一體一般，留下他渾身解

  數的演奏。他不僅親自嚴選和編曲20首歌曲，就連拍攝地點，都選在他認為是日本最好表

  達聲音細節的NHK 509攝影棚拍攝。製作團隊向正在演奏的他，展現出優美、詩意而感性

  的攝影機移動。此外，透過從美國運到日本的三台4K錄影機，與聚光燈、LED燈等多種照

  明裝置，進一步呈現出光的陰影，並以最大限度刻畫出皮膚、血管、鋼琴的質感，也瞬間

  捕捉到坂本龍一不穩定的呼吸，以及他手部及呼吸的顫抖、表情與小動作。製作團隊也期

  盼在這樣的努力下，可以讓觀眾以彷彿跟大師近距離接觸的演出，給觀眾身歷其境的感受

  。



  坂本龍一表示：「進入拍攝時，我有些緊張，想說這可能是我最後一次以這種方式，跟大

  家分享我的演出。我們每天只錄幾首歌，非常仔細地進行拍攝。某種意義來說，雖然我認

  為這是我的最後一次演出，但也覺得能夠開闢出嶄新的領域。在這個生命階段，我能夠集

  中精力每天彈奏幾首歌曲，已經是我能夠做到的了。也許因為付出了努力，之後我感到非

  常空虛。我的身體狀況在一個月左右的時間中惡化，儘管如此，在我逝世之前，我對能夠

  錄製下這場我滿意的演出，感到十分欣慰。」





  適逢《坂本龍一：OPUS》即將在台灣正式上映，台灣片商也在今日（3/8）公開「第一週

  戲院入場特典」。只要購買本片第一週（3/15-3/21）電影票乙張，就有機會獲得台灣獨

  家僅有的「電影小冊子」乙份。小冊子共有八頁，內容包含電影介紹、演出曲目，並獨家

  收錄音樂製作人陳建騏，以及詩人廖偉棠兩位大師撰寫的電影推薦與電影導聆。數量有限

  ，送完為止，詳情請洽片商官方社群查詢。



  這部由坂本龍一竭盡全力進行的最後一場音樂會電影《坂本龍一：OPUS》，即將在3月15

  日於台灣隆重獻映。本片紀錄以優美旋律為全球樂迷帶來感動與慰藉的音樂大師坂本龍一

  ，他竭盡全力演奏出他音樂生涯的20首經典曲目。悠揚的琴音在舞台與燈光之間流淌，時

  而慑人心神，時而令人屏息。坂本龍一的最後一場演奏，也是他以音樂獻給全世界的美麗

  問候。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
