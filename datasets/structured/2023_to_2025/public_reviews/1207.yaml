title: '[新聞] 【坂本龍一：OPUS】爛番茄百分百好評肯定'
content: '新聞網址：



  以音樂感動全世界的音樂巨匠坂本龍一，他竭盡全力進行的最後一場音樂會電影《坂本龍

  一：OPUS》，即將在3月15日於台灣隆重獻映。本片在威尼斯影展首映過後，持續累積各

  界一致好評，不僅在全球最大的網路電影資料庫「IMDb」獲得8.0超高評分，知名影評網

  站「爛番茄」（Rotten Tomatoes）更獲得100%滿分新鮮度，國際權威媒體與影評人也不

  吝給出極佳盛讚，可說是今年不得不看的電影作品。值得一提的是，本片的「限量電影海

  報預售票套組」也將在明日（3/1）中午12:00於博客來售票網開賣，可獲得珍藏電影交換

  券乙張與台灣獨家版海報乙張。此外，本片也跟臺中國家歌劇院舉行串聯活動，只要憑

  NTT Arts NOVA當中，坂本龍一最後一部舞台作品《TIME》的演出票券，至台中中港新光

  影城臨櫃購買3月9日19:30放映的《坂本龍一：OPUS》台中特別場，即可享有330元優惠票

  價，並獲得「電影原文曲目明信片」特典乙份，敬請務必把握優惠良機！





  《坂本龍一：OPUS》由坂本龍一親自參與選曲、演出，以一部只有他跟鋼琴的音樂會，透

  過20首涵蓋他職業生涯各階段的代表作品，展現出自己的靈魂樂章，也像是透過這場音樂

  會，為聽眾帶來最後一次的問候。本片在威尼斯影展進行世界首映過後，接連在紐約、倫

  敦、東京等國際影展上放映，獲得來自全球的廣泛認可。不僅在「IMDb」獲得8.0超高評

  分，知名影評網站「爛番茄」更獲得100%的滿分新鮮度，可說是一致好評，只能在戲院體

  驗到的視聽饗宴！



  不僅如此，國際媒體也給予本片一致好評。《綜藝》（Variety）盛讚：「他的音樂栩栩

  如生，是給全世界的獻禮。」RogerEbert.com表示：「為了無法欣賞他演出的下一代，展

  現出坂本龍一獨創性和音樂遺產的最後一場演出。」indieWire肯定：「只有坂本龍一才

  能做出的告別問候。」英國藝術新聞網站「The Arts Desk」直陳：「坂本龍一帶著典型

  而一絲不苟的態度，平靜而慎重地告別。」之外，更肯定本片是「極簡主義的傑作」。美

  國娛樂評論媒體《偏鋒雜誌》（Slant Magazine）也肯定本片的影像品質：「導演空音央

  （Neo Sora）和攝影師比爾克爾斯坦（Bill Kirstein）用晶瑩剔透的 4K 黑白鏡頭，完

  美捕捉了坂本龍一。」英國電影雜誌《Little White Lies》更盛讚：「聆聽坂本的音樂

  ，就像是打開一個人的身體和靈魂，感受他無與倫比的天賦，從看似最簡單的編曲中汲取

  偉大的美感。」一系列好評，也體現出坂本龍一為了給予他所熱愛的樂迷，傾注自己最後

  全力所帶來的這場音樂會，也將成為樂迷們感動與慰藉力量的特別獻禮。





  適逢《坂本龍一：OPUS》即將在台上映，台灣片商也順勢推出「限量電影海報預售票套組

