title: 坂本龍一：OPUS請慎選戲院
content: '如題


  美麗華大直的（一般影廳）觀影經驗相當良好，非常感動。

  推坑在高雄的朋友一定要去看。


  順手幫他查了有Atoms影廳，

  虛榮如我沒認真做功課感覺聽起來很高級，

  朋友在高雄觀影的反應也相當好，

  說踏板與呼吸聲都很清楚，

  自己覺得在美麗華的聽感低頻有點糊糊的有點不甘心

  於是我今天查好林口昕境（2廳）也是Atoms便特地前往。


  結果慘不忍聽，前面的踏板聲音的確相當清楚，但一到高音就破音。

  整場我膽戰心驚，有高音的部分都坐立難安，每一首有高音的部分都讓我想哭。


  破到想哭。



  雖然看的人數已經差不多是尾聲了，

  還是想要以自身的悲慘經驗警告大家慎選影院。



  --'
