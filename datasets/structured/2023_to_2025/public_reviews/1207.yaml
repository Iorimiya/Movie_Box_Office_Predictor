title: '[新聞] 【坂本龍一：OPUS】南韓上映獲譽票房黑馬'
content: '新聞網址：



  以音樂感動全世界的傳奇音樂大師坂本龍一，由他竭盡全力所進行的最後一場音樂會電影

  《坂本龍一：OPUS》，即將在3月15日於全台隆重獻映。電影公司在上週日（12/31）特別

  舉辦「跨年特別場」搶看活動，票券不僅在開賣三分鐘內銷售一空，搶先觀賞的影迷更是

  好評不斷。適逢1月17日是坂本龍一的72歲生日，電影公司更加碼舉辦「生日紀念特別場

  」，預計在1月17日晚間於桃園青埔新光影城Dolby Cinema、台中大魯閣新時代威秀影城1

  廳（Atoms）、高雄大遠百威秀影城 5廳三地進行特別場放映，透過戲院的頂級音響設備

  ，賦予觀眾更完美的視聽體驗。票券將在1月10日中午12:00限量開賣，座位有限，請務必

  把握搶票機會。值得一提的是，本片去年12月27日在南韓搶先全球上映，不僅攻占新片預

  售率冠軍，更連續數日蟬聯新片票房冠軍，成為南韓歲末年初的票房黑馬！上映同時，南

  韓NAVER評分也高達9.14，CGV網站更直衝92%金雞蛋高度好評，引起爆發性的支持與思念

  浪潮。





  台灣片商在上週日（12/31）為《坂本龍一：OPUS》特別舉辦「跨年特別場」，近400個位

  置在開賣不到三分鐘內銷售一空，展現出驚人買氣，也讓許多影迷呼喊能有更多類似的優

  先場活動可以參與。適逢1月17日是坂本龍一的72歲生日，電影公司更加碼舉辦「生日紀

  念特別場」。預計在1月17日晚間於桃園青埔新光影城Dolby Cinema、台中大魯閣新時代

  威秀影城1廳、高雄大遠百威秀影城 5廳三地進行特別場放映。透過高規格的Dolby

  Cinema與Atoms影廳，讓聲音畫面品質更升級，為觀眾帶來更絕美的精緻畫面，以及撼動

  人心的沈浸式音效，體驗無與倫比的極致觀影享受！



  本活動票券將於1月10日中午12:00於影城臨櫃、自動取、購票機、官方網站與APP開賣。

  凡購買本場電影票，即可在活動當天進場時，憑電影票根乙張獲得本片限定「原文典藏款

  A3海報」乙份，數量有限，售完為止，敬請把握搶票機會，更多活動資訊請見公告連結。

  （


  ）





  值得一提的是，《坂本龍一：OPUS》去年12月27日在南韓搶先全球上映，讓南韓各界人士

  都為大師的最後一場音樂會深深著迷。不僅未演先轟動，攻占當地新片預售率冠軍，更連

  續數日蟬聯新片票房冠軍，光是上映首日就吸引超越一萬名觀眾入場，展現藝文類外語電

  影的超強買氣，也被南韓媒體譽為是「歲末年初的票房黑馬」！本片不僅叫座更叫好，在

  南韓指標性入口網站「NAVER」收獲高達9.14評分，CGV網站更是直衝92%金雞蛋高度好評

  。此外，更獲得從觀眾、媒體，直到導演、演員、音樂人、作曲家、專欄作家等文化界人

  士極力稱讚。



  演員芮智媛觀賞後力讚：「巨浪般的感覺，無法用語言形容的巨大感動湧上心頭。音樂結

  束時的寂靜，就連翻樂譜的聲音都如音樂一般。」演員蔡時那表示：「彷彿融入藝術家生

  活喜怒哀樂的作品。藝術家在人生結束前的過程中，留下如此一部作品，讓我感到非常驚

  訝，我覺得這是非常有意義的事情。」演員韓智慧：「彷彿來到演出現場，大師的最後一

  場演奏，一定要看。」歌手白娥娟：「在戲院觀賞的時候，彷彿老師和我兩個人都在同一

  個空間。」作曲家盧英心：「看到對自己藝術人生表示感謝和滿足的臉龐，讓我思考將來

  必須完成或開始某件事情時，一定要想起這部電影。」此外，南韓媒體也極力好評。《東

  亞日報》：「連艱難的呼吸聲也成為音樂的一部分。」Tenasia：「大師的最後演奏，無

  需多言。」種種好評都體現出本片爆發性的支持與思念浪潮。



  由坂本龍一竭盡全力進行的最後一場音樂會電影《坂本龍一：OPUS》，即將在3月15日於

  台灣正式上映。本片紀錄以優美旋律為全球樂迷帶來感動與慰藉的音樂大師坂本龍一，他

  竭盡全力演奏出他音樂生涯的20首經典曲目。悠揚的琴音在舞台與燈光之間流淌，時而慑

  人心神，時而令人屏息。坂本龍一的最後一場演奏，也是他以音樂獻給全世界的美麗問候

  。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
