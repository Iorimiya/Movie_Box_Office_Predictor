title: '[新聞] 【坂本龍一：OPUS】琴音賀歲特開春節特場'
content: '新聞網址：



  台灣發行商「采昌國際多媒體」，即將在農曆春節期間，為觀眾呈現「采昌新春三寶」，

  除了有正宗賀歲電影《家有囍事4K數位修復加長版》將在1月26日上映、動畫片《鬼太郎

  誕生：咯咯咯之謎》將在2月7日上映（2/2到2/4搶先口碑場）之外，今日（1/25）更宣佈

  以音樂感動全世界的傳奇音樂大師坂本龍一，由他竭盡全力所進行的最後一場音樂會電影

  《坂本龍一：OPUS》，將在2月10日（六）至14日（三）期間，舉辦全台藝術院線限定的

  「春節特別場」，讓觀眾以大師悠揚的琴音相伴，度過一個嶄新風格的新春假期，《坂本

  龍一：OPUS》日後也將在3月15日於全台正式獻映。





  《坂本龍一：OPUS》在台上映的資訊公佈之後，便獲得廣大觀眾的討論，就連日前舉辦的

  「跨年特別場」與「生日紀念特別場」票券都幾乎一掃而空，展現出強大的買氣，甚至連

  南韓搶先上映，截至目前都吸引超越五萬民眾入場，成為南韓業界口中的「藝術電影票房

  黑馬」。適逢農曆新年將至，台灣發行商「采昌國際多媒體」也將為觀眾在2月10日（六

  ）至14日（三）期間，特別加開本片「春節特別場」，給觀眾截然不同的觀影選擇。特別

  場放映將在台北真善美劇院、光點華山電影館、光點台北電影院、誠品電影院、台南真善

  美戲院、高雄內惟藝術中心等六家藝術戲院舉辦，只要在這段期間於上述戲院觀賞，就有

  機會獲得「《坂本龍一：OPUS》電影原文曲目明信片」，數量有限，送完為止，請務必把

  握觀賞機會，以大師悠揚的琴音相伴，度過截然不同的農曆新年假期。





  坂本龍一親自參與20首歌曲的選曲、編曲和錄音，透過最後一場音樂會演奏電影《坂本龍

  一：OPUS》，曲目跨越他整個職業生涯，從黃色魔術交響樂團（Yellow Magic Orchestra

  ）時期，再到驚豔世人的《末代皇帝》，直至他人生中的最後一張專輯《12》，用旋律講

  述其波瀾壯闊、與音樂為伴的一生。全片以唯美的黑白影像，以及從多角度照亮大師形象

  的燈光表現，讓舞台上只有完全集中於演奏的坂本龍一。本片所要展現的主題「時間的經

  過」，透過黑白畫面的流淌，引領觀眾體驗跟坂本龍一共同度過的時間。尤其坂本龍一平

  時常說鋼琴是他雙手的延伸，在他錄製本片當下，以當時的身體狀態，不論是呼吸聲、翻

  閱樂譜的聲音，以及鋼琴的機械聲，都渾然一體地將觀眾帶入生動的演奏現場。坂本龍一

  深知這可能是展現自己藝術的最後時光，這回藉由透過音樂展現整個人生的《坂本龍一：

  OPUS》，邀請熱愛藝術與音樂的觀眾一同進戲院見證，大師留給世界的最後一份禮物。



  由坂本龍一竭盡全力進行的最後一場音樂會電影《坂本龍一：OPUS》，即將在2月10日（

  六）至14日（三）期間加開「春節特別場」，3月15日於台灣正式上映。本片紀錄以優美

  旋律為全球樂迷帶來感動與慰藉的音樂大師坂本龍一，他竭盡全力演奏出他音樂生涯的20

