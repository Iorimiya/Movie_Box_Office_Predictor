title: '[普好無雷] 《劇場版 我與機器子》'
content: '這東西也能出劇場版！？

  所以我昨天去看的時候

  是一個人包場的

  反正就是一直在玩哏

  隨便我笑

  時間長度拿捏的剛剛好

  太久會膩

  太短看不夠


  不過要看懂可能需要知道一些大作

  裡面的哏幾乎都是大作的哏

  不知道就會覺得很無聊


  --'
