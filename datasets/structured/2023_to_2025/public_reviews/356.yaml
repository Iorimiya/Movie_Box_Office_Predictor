title: '[好雷] 殭屍合唱團：夢想未完'
content: "英國傳奇搖滾樂團「殭屍合唱團」（The Zombies）\n導演找來還在世的四位成員\n娓娓道來殭屍合唱團從組團到成名\n再來歷經波瀾後解散各奔東西\n\
  最終再度復活的歷程\n最後看到70幾歲的團員在台上演奏\n真的很是感動\n成軍超過60年的樂團\n果然這就是所謂的“組一輩子的樂團”(x)\n劇中穿插該團各時期的歌曲\n\
  〈She’s Not There〉跟〈Time of the Season〉都很好聽\n很推薦西洋搖滾樂迷的觀眾一起看看這段歷史\n\n\n目前觀影還有送原文A3海報\n\
  \n\n第一週場次就不多了\n有興趣觀看要趁早\n\n--\n\nSent from \n\n--"
