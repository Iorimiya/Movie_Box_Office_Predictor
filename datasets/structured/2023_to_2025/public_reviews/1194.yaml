title: '[好雷] 怒潮'
content: '這部是中國拍片，不想看的可以pass


  我個人以電影來說，給90分


  18限制級


  打戲有部分很暗


  喜歡動作片的可以看看













  以下有雷——————————————————


  人口販賣，販毒，各種非法勾當都有


  黑道想洗白，參政就對了


  阮經天演的角色真的很入戲


  王大陸一開始以為戲份不多


  張家輝的動作戲好看


  後面結局大反轉，讓人覺得鼻酸


  大老闆的死法太便宜他了


  王大陸最後死了可能資歷最淺


  正義雖然遲到但終究會到


  願世上的人不會經歷這種事


  要對抗惡就要加入他們成為他們


  模仿他們觀察他們最後殺了他們


  這部打戲應該有70%


  莎莉最後沒死也許是最好的結局


  當法院外一堆人謝謝他們代表法律無法制裁的還是需要像他們這種人才能伸張正義













  --'
