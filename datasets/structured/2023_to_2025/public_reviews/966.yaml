title: '[新聞] 「刀劍亂舞 迴 -虛傳 燃燒的本能寺- 【'
content: "新聞網址：\n\n首部改編自舞台劇「刀劍亂舞」的全新動畫「刀劍亂舞 迴 虛傳燃燒的本能寺」繼\n上月（5月）前篇在台上映引發廣大迴響，後篇也於今日正式登上大銀幕！後篇的故事將\n\
  延續前篇刀劍男子們為了守護歷史上有名的事件「本能寺之變」，而展開了一段關於自我\n追尋的戰鬥。四名曾由織田信長所有的刀劍化成的刀劍男士：宗三左文字、不動行光、藥\n\
  研藤四郎、壓切長谷部不僅將與刺殺信長的首腦明智光秀正面對決，也將與信長最重視的\n部下森蘭丸相見，他們究竟該以什麼樣的心情面對這段故事？被稱作「天下人」的織田信\n\
  長對他們而言又是什麼樣的存在？對此，為壓切長谷部配音的聲優新垣樽助表示，「這一\n次，刀劍男士們內心的矛盾和變化被深深地融入到了故事中，他們的內心戲被刻畫得更細\n\
  膩了，這讓我們在演繹時覺得彷彿更貼近他們，我相信大家一定也能從刀劍男士們的視角\n出發，沉浸在故事之中。」\n\n至於此次串聯起整個故事的核心人物不動行光一角，則由聲優阪口大助擔任配音。他笑稱\n\
  這一次的作品可說是一改常態，不是將動漫作品搬上舞台，而是將舞台劇作品以動畫呈現\n。對此，他坦言一開始遇到了一些困難，「對於該如何將我創造的不動行光與椎名鯛造先\n\
  生在舞台上塑造的不動行光相互調合，這件事讓我思考了許久，這同時也是一件非常有趣\n的事！」而最終成品阪口大助也不負眾望，將不動行光這個全片反差最大的角色，活靈活\n\
  現地演繹出來，從剛到本丸，總是喝到微醺、無法理解自身職責的天真形象，到後篇戰鬥\n中與前主人森蘭丸的動人情誼和生死掙扎細膩帶到觀眾面前。\n\n「刀劍亂舞j虛傳U燒的本能寺-」故事講述四把刀劍男士由魔王織田信長所有，\n\
  信長是他們的前主人，他們將出陣前往信長被暗殺的本能寺之變，那個在種種糾葛下，由\n他們所守護的歷史會是？「刀劍亂舞 迴 虛傳燃燒的本能寺【後篇】」今日正式\n\
  上映，凡場次開放後，至戲院憑預售票劃位或現場購買\n「刀劍亂舞 迴 虛傳燃燒的本能寺【後篇】」電影票壹張，即可獲得角色小卡一份\n（隨機贈送），更多相關資訊請洽天馬行空粉絲團。\n\
  \n--\n                                 06/19 22:32"
