url: https://www.ptt.cc/bbs/movie/M.1730044018.A.5A2.html
title: '[好雷] 荒野機器人 The Wild Robot'
content: "(內文有劇情內容）\n\n圖文 Medium 好讀版\n\n\n\n----這是分隔線，以下有雷----\n\n\n雖然這部片得到許多好評，但我應該不是這部片的大粉絲，我偏好心思比較細膩或深刻的\n\
  故事；但這部片的強項跟特點，恰巧就是透過是從機器人與動物的互動視角，平舖直述且\n無太多刻意及加油添醋的去討論一些感情元素：愛、親情、屬於、善良。在這太過複雜、\n\
  每天受到太多刺激的時代，簡單反而是最難也最能打動人的方式\n\n故事描述一個具有 AI 智慧的服務機器人Roz7134，因故漂流到只有動物的小島，被設定\n要提供\"\
  協助\"的機器人，在島上遇到各種想要\"生存\"的動物、狐狸、水獺、熊、松鼠，也\n碰巧孵出一隻野雁，得到了他在島上完成任務的機會，幫助孩子長大，學會吃、游泳、飛\n\
  \n\n//關於屬於\n故事的主軸線上，機器人與野雁的親情，有比較多的迴響，但最觸動我的一幕，是當機器\n人製造商派人( =正常機器人)來島上要取回寶貴的 Data,\
  \ aka 機器人Roz7134 時，Roz\n與島上的動物小夥伴與正常機器人對峙時\n\n正常機器人：你應該要跟我們回家\nRoz：這裡就是我的家\n正常機器人：這裡是荒野\n\
  Roz：那我就是...荒野!機器人!\n\nAt that moment, I just strongly feel that everyone need the\
  \ feeling of\nbelonging. Even  a robot, or the fox who lives in the fox way, not\
  \ to mention\nthe human being.\n\nBelonging exits when you know you would be accepted\
  \ and\nloved under any circumstances.  So you would more than honor to say I'm part\n\
  of here.\n\n\n//關於從正常機器人變成荒野機器人的 Prompt 下法\n身為一個擁有理工直男一面的我(?) 不小心一直在想這件事情，在故事設定裡面，機器人\n\
  的演算法核心，用狐狸的說法 The Robot Way，也是跟隨 「Three Laws of Robotics」\n\n1. 不能傷害人類\n2. 必須服從命令/提供協助\n\
  3. 不違反前兩條的狀況下，可以保護自己\n\n可以看出 Roz 的運作模式，都有符合這個方向，那到底 Roz 改寫了自己了什麼樣的程式\n aka 做出什麼改變?\
  \ 而改變的契機，被下的 prompt 又是什麼呢?\n\n我猜想應該是狐狸仔的那句\n\"Find that, ah woo inside you\"\n\n\
  Roz 的概念沒有好人壞人（好動物壞動物、好狐狸壞狐狸），他沒有預設立場，所以他可\n以聽進去所有人的話，某種程度是個絕佳的聆聽者，而且狐狸說的，他也都真的去嘗試看\n\
  看\n\n這句 Prompt 帶來了雙向的效果，對於 Roz 來說，在原來運算的邏輯內\n\n1. 打破了純粹的最佳化、最有效率思維\n2. 不是只是聽話，或者說當聽了有所排斥的話的時候，他要怎麼決定執行哪個、或是優\n\
  先順序\n\n所以 Roz 最後把小野雁的 Survive 放在最高序位，而不僅是達成任務的效率，Roz 讓小\n野雁參與(但無貢獻) 蓋房子、Roz 不聽小野雁難過時叫他不要理他的氣話，因為\
  \ Roz 的\n內心，認定了讓小野雁 Sruvive 是最重要的事情，他需要讓他飛起來\n\n而對於狐狸來說，也許這句話是他無意中開始也面對自己的起點，畢竟他真的一直跟隨內\n\
  心的去執行 fox way 的人生XD，只是無意中遇到一個不去評斷他的機器人，所以他被理\n解了、被愛、被屬於了，他一張被認定為騙人的嘴，在關鍵時刻，反而變成凝聚大家的推\n\
  手，因為有了 Roz 的信任\n\n\n//關於愛\n雖然看似愛人的是機器人與小野雁，但教會機器人愛人的，還是那個自己也渴望愛，而跟\n隨內心\"ah woo\"\
  ，一邊當個鍵盤愛人教師，一邊自己也學習愛與被愛的狐狸仔\n\nRoz 問說：什麼是愛\n狐狸仔：我不知道，我也沒被愛過，但如果你感到那樣的情感，就試著說出來吧\n\
  \n我喜歡這個對於愛，很直截，沒有意義定義的操作型定義，Still the fox way, feel\nthe ah woo inside.\n\n而在 Roz\
  \ 跟小野雁學會直白的表達愛之前，至少他們都有感覺到愛，並且試著維繫他，\n愛與屬於存在的方式很像，就是當雙方的聯繫對話都被允許及接通的時候，就開始自然存\n\
  在\n\nRoz：我猜該是時候你要跟著雁群飛走過冬的時候了?\n小野雁：我想是吧\n...\n小野雁：你可以幫我嗎?\nRoz 就像他們從零開始理解與練習到成功飛行的經驗那樣，把小野雁放在肩膀上，Roz\
  \ 作\n為他的跑道、他的推進器，帶著小野雁起飛的速度，然後看著他飛翔。\n\n\n//關於領導\n看起來這部電影的 MVP 我是頒給了 The Fox way，那最佳配角或第六人，我應該會頒給\n\
  野雁群的長老。他真的是是一個酷傢伙，是我會喜歡的前輩或領導類型\n\nHe can make crucial decision. 身為一個團隊的領導，也會有時候發生有人掉隊，或沒\n\
  有辦法跟上的時候，他更是因為理解大自然的殘酷，所以一開始其實是選擇放棄小野雁\n\n他有識人/鳥的眼光、他懂得激勵，雖然看上去就是一群鳥，但他知道每個人都還是有所\n\
  不同，對小野雁，他鼓勵的方式，並不是叫他不要在意翅膀小，因為翅膀就是小，而是跟\n他說，他內心的強大，會是存活的關鍵、並鼓勵小野雁\n\n\" Don't fly\
  \ like them, like you.\"\n\n他讓小野雁逐步屬於的同時，又讓小野雁維持了他自己\n\n\n//關於善良\n故事其中一個主題在討論 \"\
  Kindness is a Survival Skill\"，身為一個小大叔，受社會\n摧殘也有近十年，我最喜歡善良的說法是「真正的善良，是經歷過一些不好的事情之後，\n\
  仍能在必要的時候選擇善良」\n\n用 Skill 來描述善良的話，也有異曲同工之妙，他是需要選擇被使用的，他在某些時候\n，即使從效益的觀點，存活的觀點，「善良」也是有效用的\n\
  \n我們是動物、都會有存活的生之本能，我們狩獵、我們競爭，善良不是叫兔子乖乖給大野\n狼吃掉、善良不是沒有脾氣、善良不是犧牲小我，可能以前的我曾經有這麼偉大的想法，\n\
  但現在身為一個平凡人，我比較推薦先努力把自己活好，才有餘力跟心情選擇善良，也唯\n有先把自己活好，才更能實現善良，並且得到善良的好處\n\n「Sometimes,\
  \ to survive, you must become more than you were programmed to be.\n」\n\nRoz 超越了原來的本能（程式），救了狐狸、救了森林裡的大大小小動物，而回過頭，變\n\
  成大家一起努力把 Roz 留下來作為荒野機器人。Kindness works as well. It can be\na survival skill and\
  \ also good deal.\n\n\n有些時候會思考，未來人與機器人的界線是什麼，因為有段時間我覺得我活的像是機器人\n，除了重複性的動作，日復一日，也有些時候我需要放棄思考或感受，單純的接受指令，\n\
  才能在那個島上存活下去。人類可以活得像是機器人，而電影中的荒野機器人也好，或是\n日益流行的生成式 AI 對話工具，都讓我們驚覺，AI/機器人可以\"像是個人\"\
  \n\n呼應電影的觀點，維持本心的存在、保有聆聽跟說出\"ah woo\" 的能力、沒忘記自己有選\n擇善良的權利跟能力，是人生而為人，還活著像個人的幾個重要查核指標吧\n\
  \n--"
