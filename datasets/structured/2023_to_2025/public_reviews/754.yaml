title: '[極好雷] 荒野機器人(中字)：細節決定成敗'
content: '劇情其實滿好猜的


  但細節的刻劃使《荒野》脫穎而出成為年度佳片


  舉例來說，野雁遷徙時，亮亮明明可以自己起飛的，卻故意請羅茲推一把


  原本沮喪的羅茲，聽到自己仍有一次幫助孩子的機會時，突然又精神抖擻


  亮亮起飛後，羅茲的任務明明解除了，卻好像少了甚麼


  衝出樹林，親眼見證群雁離去那段，真的惹哭了我


  父母就是這樣，隨著孩子逼近成年，越是抓緊每一刻和孩子相處的機會


  讓我想到過去參加國考時，明明可以自己搭車，父親卻堅持親自載送一樣


  考上時母親還難過的哭了一場，明明考上了


  對於父母來說，沒有比見證孩子成長獨立、脫離家庭，更重要的事了


  --'
