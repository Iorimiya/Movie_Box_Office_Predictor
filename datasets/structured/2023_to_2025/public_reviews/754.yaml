title: '[討論] 夢工廠《荒野機器人》爛番茄滿分開盤'
content: '如題，非業配寫手




  雖然爛番茄跟影評觀眾口味有落差

  但滿分開盤應該還是有點參考性吧？

  多倫多影展首映的口碑也甚佳

  至少我是很期待啦！


  團隊是《馴龍高手》《古魯家族》的導演

  雖然老梗，但這兩部的節奏都掌握的非常好


  再加上《鞋貓劍客2》的視覺風格

  預告搭配重混音的〈What a wonderful world〉真的超讚！



  臺灣要等到10/10才上映，晚好久啊…


  --



  你才是香蕉 你全家都香蕉


