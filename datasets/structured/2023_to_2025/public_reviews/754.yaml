title: '[好雷] 荒野機器人：直觸人心的好故事'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  因為沒看過原作，僅看過電影預告


  所以整體看下來真是被劇情不斷的衝擊


  劇情主軸是機器人照顧小野雁，帶出可預期的親情故事


  但整場電影除了主線之外的所有配角跟畫面


  導演（還是編劇？原作？）很微妙的把很多看似不相關的線在最後ㄧㄧ收攏


  我覺得這是這部電影能讓人在可預期的劇情下

  在情感上還能一直堆疊、一直被衝擊的原因


  配合著音樂效果


  看到亮亮在羅茲協助下跟雁群起飛的壯闊畫面


  看到羅茲冒著暴雪中一個個把之前視她為怪物

  的小動物救回窩


  再導引到原本弱肉強食的叢林法則在她那裡要有新的定義


  再拉回所有動物合作，一起捍衛羅茲的畫面


  一層一層的把情緒堆疊起來


  看到羅茲跟原是她同類的機器人說出 「我是荒野機器人」


  真的讓人很感動


  在進電影院之前，我覺得這就是一個標準親情溫馨片


  但看完之後覺得真的比原本的設想豐富太多


  看完之後感覺電影想講的東西很多


  但不會有很雜的感覺，真的厲害


  對我來說，這就是2024最能觸動自己的一部電影了！


  非常推薦！


  -----

  Sent from JPTT on my iPhone


  --'
