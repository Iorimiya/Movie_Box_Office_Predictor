  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  荒野機器人是夢工廠新出的電影

  由一本童書改編

  描述一個機器人被分配到荒野照顧野生動物的任務


  好笑的部分真的不少

  機器人剛開始適應野外的歷程有很多出包的橋段

  還有很多感人的畫面

  這部似乎是直接設定機器人也有感情

  簡單直接也更方便理解


  還有很多感人的地方

  音樂配的超級好

  這邊推薦飛雁回家的I can use a boost和人聲的Kiss the sky


  那隻狐狸的尾巴真的好蓬喔

  想摸摸看


  作畫水準有點像是鞋貓劍客

  劇情方面也是相當好看


  --

  沒錯沒雷射槍打到了'
