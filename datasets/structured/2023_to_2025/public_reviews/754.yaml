url: https://www.ptt.cc/bbs/movie/M.1729039968.A.EDC.html
title: '[無雷] 荒野機器人-超級推薦的家庭好片'
content: '先說結論，看完影片留在心中的餘韻久久未散，

  到現在聽著原聲帶還是會眼眶泛紅，

  但也可能是本人淚點極低的緣故。

  為了不想暴雷影響觀影，

  這篇只是單純講看完的心情。


  暑假帶了孩子看了好幾場電影，

  那時候都有預告這部電影，

  但我問了孩子有沒有興趣，

  因為預告說實話沒有太吸引人。


  一開始我也是碰巧看到爛番茄的評價很高，

  加上社團媽媽跟學校老師聊天推薦。

  為了要讓孩子有興趣，

  還買了原作給孩子。

  孩子才兩三天讀了一半，馬上吵著要去看，

  看完電影後不到四天就把三本書都讀完了。


  我們選擇看3D的場次，

  畫面美麗的不得了，

  好幾幕我都覺得如果我能在畫中多好，

  尤其配樂搭配畫面的所產生的渲染力，

  會讓人沉浸其中。


  故事也許對很多講邏輯的人來說，

  是把所有的老梗串在一起，

  事實上我也早就猜到後面的劇情，

  但這部電影厲害的地方就是雖然讓你猜得到劇情，

  卻在不經意處慢慢堆疊所有內心的情感，

  勾出我們這些為人父母對孩子的愛和期盼。


  雖然中間的大高潮過後，

  後面的故事稍微平淡，

  但我覺得就是放鬆的去享受一部充滿善良充滿情感的電影。

  我兒子說雖然與原著改動有一些地方，

  但整體而言是一部敘事完整的好電影。

  看完電影我們都哭到抽鼻子，

  我兒子還一邊舉著大拇指    說這是今年最好看的電影。


  很抱歉囉哩囉嗦打了一大堆，

  但只是希望好電影不要被埋沒，

  希望大家能夠進電影院支持！



  --'
