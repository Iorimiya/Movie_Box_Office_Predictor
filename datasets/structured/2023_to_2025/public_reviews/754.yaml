title: '[新聞] 荒野機器人表現佳 北美票房龍頭易主'
content: "荒野機器人表現佳 北美票房龍頭易主\n\n2024/9/30 14:42（9/30 14:54 更新）\n\n（中央社洛杉磯29日綜合外電報導）今天的業界數據顯示，科幻動畫片「荒野機器人」（\n\
  The Wild Robot）這個週末終結「陰間大法師Beetlejuice」（Beetlejuice Beetlejuice\n）3連霸戰績，登上北美票房冠軍寶座。\n\
  \n法新社報導，北美院線聯盟（Exhibitor Relations）估計，奧斯卡獎得主露琵塔尼詠歐\n（Lupita Nyong'o）配音演出的「荒野機器人」，27日至29日期間有3500萬美元進帳。\n\
  \n「陰間大法師Beetlejuice」在北美票房連當3星期的霸主後，週末期間再撈1600萬美元，\n上映4週的總票房來到2.5億美元。\n\n而週末期間最大的輸家恐怕是大導演法蘭西斯柯波拉（Francis\
  \ Ford Coppola）的「大都\n會」（Megalopolis），週末開映僅吸金400萬美元。\n\n法蘭西斯柯波拉為了這部片自掏腰包投資1.2億美元（約新台幣38億元），還賣掉他加州\n\
  葡萄園的股份。\n\n北美票房排名第3的的是動作動畫片「變形金剛：源起」（Transformers One），有930萬\n美元表現。\n\n排名第4的是印度方言德拉古語電影「德瓦拉：第一章」（Devara\
  \ Part 1，暫譯），進帳\n560萬美元。\n\n排名第5的是心理恐怖片「邪惡勿語」（Speak No Evil），進帳430萬美元。\n\n排名第6至第10名依序為：「大都會」，400萬美元；「死侍與金鋼狼」（Deadpool\
  \ &\nWolverine），270萬美元；「我的老屁股」（My Old Ass），222萬美元；「千萬別放手\n」（Never Let Go），220萬美元；「懼裂」（The\
  \ Substance），180萬美元。\n（譯者：蔡佳敏/核稿：陳昱婷）1130930\n\n#北美 #奧斯卡獎 #法新社 #法蘭西斯柯波拉\n\n--\n\n\
  \ 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--\n\n是佛教  （被佛教是）才是\n\n\n\n\n\
  上座部佛教馬哈希帝釋所問經講記77頁戳破偽經大乘妙法蓮華經\n帝釋所問經講記78頁開示說明假佛教大乘西方極樂世界是外道邪見（常見）假裝佛教"
