url: https://www.ptt.cc/bbs/movie/M.1728895487.A.0DF.html
title: '[好雷] 荒野機器人'
content: '雷文防雷資訊頁


  上一次看機器人動畫

  也讓我熱淚盈眶的大概就是瓦力了吧

  真的很推薦到電影院欣賞

  有國小年紀的小孩也適合家長一起帶去觀看


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  沒有看過原作 本來沒有打算進電影院看

  但看到了PTT好雷 決定給他機會

  真的是幸好有進場觀看


  在片頭一開始 對於羅茲這個機器人的呆板設定

  反覆的詢問是否有人訂購 是否需要指派任務

  有一點感覺重複太多次的厭煩感


  一直到那顆 野雁鳥蛋-亮亮 的出現

  狐狸一開始不安好心 無心協助養育野雁

  只想利用羅茲來飽餐一頓

  但看到了羅茲的不達成任務不罷休

  決定一起展開野雁養成計畫


  羅茲用自己的認知來教導亮亮

  從基本的生理需求 餵食 居住

  藉由狐狸的引導給予亮亮一個基本的生存能力


  但是完成任務的目標是需要讓亮亮學會游泳及飛行

  對於沒有看過野雁怎麼飛行的羅茲而已

  他知道的僅是人類的游泳方式

  擺動雙手及雙腳

  所以教出來的亮亮游泳姿勢

  總是讓人看了像要溺水一般的慌亂


  其實在這邊開始讓我有了感動的感覺

  沒有人一開始就知道怎麼當父母

  在教導我們的過程 他們可能也不是那麼知道正確的方法

  他們用著他們所知道的方式在教導著我們


  一直到羅茲看到了一群野雁的游水及飛行方式

  他迅速的紀錄下來 開始正確的訓練亮亮

  也為亮亮找了一隻專業的老鷹（？）

  來教他克服先天翅膀小的飛行問題


  藉由野雁的領頭飛行長者來告訴羅茲

  亮亮可以跟上他們這一次的遷徙

  只是需要不斷的訓練飛行耐力

  一定要從早到晚一整天都不能落地

  在訓練到夜晚 羅茲的眼睛投射出燈光

  就像在指引著亮亮返航的方向


  除了親情的劇情以外

  還有狐狸-阿探跟其他動物的友情

  在遇到寒冬暴風雪的時候

  羅茲展現了善良的一面

  靠著阿探聞出動物的蹤跡

  一起協助完成拯救其他動物

  達到了善的循環

  在最後羅茲要被帶回原廠基地的時候

  所以的動物挺身而出一起反抗


  雖然最後羅茲為了大家不再受到傷害

  還是回到了基地

  但因為在照料亮亮的過程中

  他也體驗過了愛與幸福的感受

  並且知道即使他的腦袋被設定重置

  還是能夠感受到他在乎的事物及情感


  這部可以再多刷幾次

  應該可以有更多不同的體悟跟感觸


  然後片尾有個很小的彩蛋

  有興趣的朋友可以等看看

  -----

  Sent from JPTT on my iPhone


  --'
