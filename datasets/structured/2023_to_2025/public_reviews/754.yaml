url: https://www.ptt.cc/bbs/movie/M.1745486344.A.842.html
title: '[好雷] 荒野機器人 最喜歡的動畫'
content: '羅茲一開始真的就像是一台機器，講話平淡、動作僵硬

  但隨著她慢慢學會跟動物互動，照顧雛雁亮亮、幫助其他生物

  她也逐漸有了情感、有了溫度


  看完之後會讓人有點安靜、有點暖，又有點鼻酸的感覺

  畫面其實很簡潔，角色也不多，劇情也不複雜

  但就是那種「什麼都不多、什麼都剛剛好」的節奏

  讓情緒自然堆起來，堆著堆著就有點被擊中


  配樂也超加分

  每個轉場、每個安靜的時刻都被襯托得剛剛好

  構圖也超講究，很多畫面都靜靜的

  像是在讓你自己感覺那個場景，而不是被台詞塞滿


  很不像我們印象中的動畫片，它節奏慢、畫面簡單、沒有大高潮

  但卻意外地讓人覺得很舒服、很有力量


  --'
