url: https://www.ptt.cc/bbs/movie/M.1712267699.A.AA7.html
title: '[普負雷]哥吉拉與金剛：新帝國—命題錯誤'
content: '要不是幸好我在這邊有看到哥吉拉-1.0，

  不然哥粉如我看這部肯定吐血。


  我覺得這部最大問題點在於，

  標題寫哥吉拉與金剛，那觀眾預期會看到什麼？

  廢話，當然是兩者在劇情上有相當分量啊。

  結果呢，出場戲份大概哥吉拉三成，金剛七成，

  甚至劇情基本上都圍繞在金剛身上，

  說極端一點，把哥吉拉的戲份全拿掉完全不影響。

  那我看這部幹嘛？乾脆去隔壁看猩球崛起嘛。

  後來我想一想，換個方向思考，

  如果把這部視為金剛：骷髏島的續作，

  然後哥吉拉驚喜客串，

  其實就好多了，

  我可能還會給出普好雷左右；

  問題就在於，

  就像我點半筋半肉牛肉麵，結果上來八成是牛腱，

  欸我不是不愛牛腱，但這樣我點牛肉麵就好了嘛。


  劇情部分，

  一開始看到沒有前幾集那個妄想拯救世界的屁孩，

  就稍微鬆了口氣，

  雖然還是有陰謀論大叔但還可以接受；

  但到後來看到原住民女孩其實是萬中選一的巫女，

  然後莫名其妙搞了個儀式，

  然後摩斯拉就又復活了，

  然後我頭就開始痛了。

  最後當然來個喜聞樂見的親情戲，

  「你想回去你原本的家(族人)也可以哦」

  「怎麼會，有你在就是我的家」

  我想是編劇想刻意對應到金剛跟小猩猩吧。

  但想想上一集就是你們人類擅自把金剛丟去地底欸，

  然後當時原住民小女孩還在那邊比說，

  這才是屬於你的地方哦，回家真好(笑)

  現在看起來格外諷刺。


  心得先到此為止，

  聽說下一集好像會偏重哥吉拉，

  反正......噴歸噴，

  到時候還是鼻子摸著去看啦。


  --'
