url: https://www.ptt.cc/bbs/movie/M.1711721593.A.107.html
title: '[  雷] 哥吉拉與金剛:新帝國-有點ㄎ一ㄤ但是好看'
content: "上作《哥吉拉大戰金剛》被批評人類角色與支線太多，本作回歸到讓怪獸自己說故事，這點算滿成功的，雖然我也很喜歡上作某些台詞，但本作也很有意思。\n\n\
  這系列的有些劇情就是會讓人吐槽，怪獸真的會這麼打架嗎？但是又忍不住會想看下去的類型。所以漫威有宇宙當然怪獸也有宇宙啊，只是怪獸宇宙劇情相對比較ㄎ一ㄤ一些。上作最後哥吉拉與大金剛合作打機械哥吉拉，本作則是大金剛烙人(烙哥吉拉)打刀疤王，這個電影預告早就劇透了，總之劇情還可以做到什麼事情是比較讓人好奇的部份。\n\
  \n話說為了看本作個人復習了幾部怪獸電影，怪獸電影除了是以怪獸作為主角的電影，這系列作看下來的心得是，因為可以吐槽的地方滿多的，原來怪獸宇宙是可以這麼無視物理法則又ㄎ一ㄤ又有趣\n\
  \n個人看到在散場後有一堆影迷在等彩蛋，本作票房應該不會太差。\n\n原連結：\n\n\n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n本作接續上作《哥吉拉大戰金剛》的結尾，金剛在空心地球生活的幾年後開始說起，艾琳\n\
  ·安德魯為倖存的伊維族人吉亞的養母，地心的一號基地被襲擊，眾人在找尋吉亞感知到\n的信號來源。另一邊是大金剛在地球空心處的生活，遇到了地底金剛的人猿同族，大金剛\n\
  +哥吉拉與反派巨型人猿刀疤王+霜魔交手的經過\n\n本作為怪獸宇宙的重啟系列第五作，前幾作《哥吉拉》、《金剛：骷髏島》、《哥吉拉：\n怪獸之王》、《哥吉拉大戰金剛》一路走下來，這系列的故事是以大金剛為主角，哥吉拉\n\
  為配角，劇情簡單來說就是《金剛：骷髏島》為大金剛與人類相識的經過，後來因為骷髏\n島資源不足，於是在《哥吉拉大戰金剛》，金剛被人類送往地球空心，運送期間與哥吉拉\n\
  交手，因此哥吉拉與金剛交手的劇情主要還是在《哥吉拉大戰金剛》，本作大金剛VS哥吉\n拉交手的劇情比較少，因此片名叫做新帝國，本作還有追加金剛與地底人猿族群的小金剛\n\
  認識的劇情。\n\n預告登場的反派巨型人猿「刀疤王」是兼具技巧與力量型的反派角色，就真的有一點強，\n因此本作金剛就要找哥吉拉幫忙合作對抗強敵。本作不能當災難片來看，屬性比較像特攝\n\
  片，這系列劇情給我的感覺就是劇情腦洞開得有點大，比方說空心地球的設定，但是地球\n空心歸空心，地核的光又是那來的？上作有找到地底宮殿，本作又生出了地底群族的新設\n\
  定，吉亞感知到的信號來源原來是地底的伊維族人針對地底的人猿族群而發出的警告，地\n底巨型人猿「刀疤王」一直想回到地面，因此襲擊了人類在地底的設施，總之劇情就是作\n\
  球為怪獸對打戲舖路的類型。就是個怪獸對打爽片。\n\n\n\n\n--\n          05/30 02:16\n\n--"
