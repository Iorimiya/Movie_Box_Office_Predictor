url: https://www.ptt.cc/bbs/movie/M.1712100485.A.E44.html
title: '[疑問雷] 金吉拉新帝國一問題請益'
content: '如提　看完這部片以後對哥吉拉的強度有問題



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  下一頁有劇情






















  很明顯繼上一集敗給了機械哥吉拉後


  哥吉拉回去加強了原子吐息的威力　把這招點滿了　


  打其他的泰坦怪獸　都是一擊必殺　噴必死　


  本集接連降伏了好幾隻猛獸　


  之後對上金剛、刀疤王也是　


  原子吐息一放　把金剛和長臂怪噴的到處逃竄　不敢硬扛這一招的威力


  我好奇的是　粉紅狀態的他　原子吐息威力應該是大大增幅的　


  怎麼那霜魔被他接二連三的噴　根本噴不死　還像一點受傷都沒有


  是我漏看什麼重要訊息嗎？　求解


  --'
