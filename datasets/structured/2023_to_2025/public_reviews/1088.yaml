url: https://www.ptt.cc/bbs/movie/M.1713425670.A.555.html
title: '[ 普好雷] 哥吉拉與金剛：新帝國'
content: '在NETFLIX上看完第一集覺得很不錯

  雖然覺得最後的機械哥吉拉輸得太快

  破解方式更是敷衍了事

  不過還算喜歡就找時間來電影院看第二集


  確實怪獸打鬥更多更爽

  但是對於片中的君主計畫的監管覺得很廢

  當然都掌握了哥吉拉的行蹤

  但每次哥吉拉要去哪君主計畫根本也拿它沒皮條只能ㄧ直煞有其事好像很緊張的互相通報

  （其實是根本拿所有巨獸都沒輒）

  但實際上人類武器只是幫牠抓癢

  根本阻止不了也無法改變哥吉拉想做什麼

  整部片的人類片段真的超多餘只像旁白在預告哥吉拉下一步的行蹤


  然後空心地球裡的劇情好像在看猩球崛起

  而且一個充滿泰坦巨獸的世界只靠ㄧ個小小幾個人監看的工作站在監測


  如果不是怪獸打鬥有爽到

  真的覺得裡面所有的人類劇本都好多餘



  --'
