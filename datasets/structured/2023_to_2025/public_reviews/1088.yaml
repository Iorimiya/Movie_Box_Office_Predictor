url: https://www.ptt.cc/bbs/movie/M.1712487766.A.340.html
title: '[好雷] 哥吉拉與金剛：新帝國'
content: '平常沒在看怪獸片

  也沒看過哥吉拉跟金剛相關的片


  因為前幾天去看莎莉

  發現該電影院爆米花很好吃

  剛好今天要打發時間

  就跑去看這片


  一開頭看到金剛吃東西場景

  就差點吐出來

  繼續看下去覺得連好吃的爆米花都不想吃了


  但已經買了只好硬著頭皮繼續吃

  可是邊吃邊覺得噁


  就這樣穿插一些怪獸打打殺殺的畫面

  跟噴內臟噴血的畫面

  越來越覺得不耐煩

  因為又看到吃類似腸子的畫面快吐了

  直到大概最後三十分鐘前


  出現了摩斯拉！

  一開始覺得長得也是有點可怕

  可是牠不像其他隻髒兮兮

  而且牠有翅膀飛來飛去

  最後幫助人類

  到最後變成用崇拜的眼神看著牠的大眼睛

  越看越可愛


  看到金剛跟哥吉拉跟摩斯拉團結好感動

  覺得每隻都變好可愛


  包括那個會噴冰的

  牠到最後攻擊原本控制牠的那隻猴子

  明明能力超強卻被猴子奴役欺負那麼久

  被利用來攻擊別人

  最後終於出了一口氣


  地底那群猴子也因此全部脫離霸政奴役統治

  真是太棒了

  而且金剛在地底就有好多新同伴了

  本來只有自己一隻好可憐


  我本來就很喜歡銀背金剛猩猩

  看到牠在片中一開始孤零零

  到後來被打很慘還被斷手筋

  看了都好難過

  幸好最後有這樣的好結局


  小女孩跟養母橋段也很棒

  最後講出你就是我家

  也是看了好感動


  沒想到為了吃爆米花可以看到不錯的片



  --


  牠有吃一隻很像海龍王的

  我也是想到吃魚

  可是有吸很像腸子的東西出來

  還是那是寄生蟲？



  看完查了一下

  聽說牠好像是會走路的核能反應爐？


  你們都好堅強



  噁噁噁


  生的血淋淋很噁

  不過熟的我也不敢吃吧



  一開始看覺得莫名其妙

  最後看到時覺得很可愛！'
