title: '[新聞] 《哥吉拉與金剛：新帝國》續集開拍 主演'
content: '《哥吉拉與金剛：新帝國》續集開拍 主演員確定




  （大紀元記者葉子杰編譯報導）繼2024年《哥吉拉與金剛：新帝國》票房大獲成功後，該

  系列電影續集已確認正式開拍，尚未公布正式片名。英國男演員丹‧史蒂文斯（Dan

  Stevens）將回歸主演，並加入了一些新演員。


  華納兄弟與傳奇影業製作的怪獸宇宙系列五部電影中不僅有哥吉拉，還有金剛。去年，《

  哥吉拉與金剛：新帝國》（Godzilla x Kong: The New Empire）全球票房收入5.71億美

  元，是該系列中製作成本最低（1.35億美元）又最賣座的電影。當地3日，美國女演員凱

  特琳‧黛佛（Kaitlyn Dever）向澳洲《7News》證實，怪獸續集電影已經開始製作。


  凱特琳出席了在澳洲雪梨舉行的HBO電視劇《最後生還者》（The Last of Us）第二季的

  首映式，她不僅在該劇集中首次亮相，還首次加入怪獸系列的主演。另外，已確認其他新

  加入怪獸系列的演員包括英國男演員傑克‧歐康納（Jack O’Connell）、美國男演員戴

  洛依‧林多（Delroy Lindo）和馬修‧莫汀（Matthew Modine）。


  史蒂文斯則繼續扮演金剛的獸醫「崔普」，至於該系列前兩部電影的主演：英國女演員蕾

  貝卡‧霍爾（Rebecca Hall）和布萊恩‧泰瑞‧亨利（Brian Tyree Henry）是否會回歸

  演出續集電影？目前尚未有報導或消息傳出。


  格蘭特‧史皮托瑞（Grant Sputore）將執導怪獸系列續集，劇本由《蜘蛛人：穿越新宇

  宙》、《尚氣與十環傳奇》和《神力女超人1984》的聯合編劇大衛‧卡拉漢（David

  Callaham）撰寫。目前未有消息透露這些新演員將會扮演什麼角色，只有3月傳出了劇情

  遭到洩漏，其中《怪奇物語》中飾演布「雷南博士」的馬修將扮演一名將軍。


  怪獸系列五部電影包括《哥吉拉》（2014）、《金剛：骷髏島》（2017）、《哥吉拉 II

  怪獸之王》（2019）、《哥吉拉大戰金剛》（2021）及《哥吉拉與金剛：新帝國》。截至

  目前，影評網「爛番茄」上觀眾分別給予66%、70%、83%、91%及89%的新鮮度評價，該系

  列電影全球票房總收入已超過25億美元。


  未命名的怪獸宇宙續集電影將於2027年3月26日在美國上映。


  --'
