content: "作者: yuizero (14) 看板: C_Chat\n標題: [閒聊] 哥吉拉和金剛:新帝國 8+9的故事\n時間: Thu Mar 28\
  \ 02:30:48 2024\n\n   剛從電影院回來  爽片的話  這及格了\n\n剛好一掃一堆糞片的怨氣  哥吉拉並沒有像以前的電影情報\n\n古早時敗給霜魔那種事\n\
  \n\n  當然有雷囉   先防雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n    再防雷\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n  在上一集  8+9好不容易找個新地盤  結果大哥找碴\n\n最後放了8+9一馬  8+9回到自己的新地盤\n\
  \n\n這一次  8+9在新地盤收了個小弟  小弟一開始還烙人來打  還想騙8+9\n\n給食人魚吃  結果都被8+9揍\n\n\n   大哥這時找到新家睡覺\
  \  但是這時感應到  我會有一場大戰\n\n於是到了一個健身房  把健身房教練分屍  霸佔健身房器材\n\n\n\n  之後  小弟帶8+9到一個礦坑  8+9看到工頭欺負小弟的同伴\
  \  就反揍了工頭\n\n工頭叫出黑道老大  黑道老大出來  看著8+9帶著假牙  就笑了  大家也跟著笑\n\n小弟無奈的假笑  黑道老大不爽 就踢了小弟同伴一腳\n\
  \n8+9不甘示弱 說\"我有名有姓  叫金剛\"  於是眾人退開 讓兩人PK\n\nPK到一半 黑道老大看贏不了  就用控制器叫野狗攻擊  野狗因為控制器會讓他很痛苦\n\
  \n所以只能咬8+9  8+9於是手受傷只能逃   中途被小弟所救\n\n\n\n  8+9之前的同伴跟來  才發現原來這附近是老大的女人的寺廟\n\n8+9這時被小弟帶來\
  \  同伴看他傷重  於是給了他神兵利器  乃無限手套也\n\n這無限手套威不可擋  但是孤身一人還是對付不了黑道老大和其他人以及野狗\n\n於是在同伴建議下\
  \  8+9上去找老大幫忙\n\n同伴看不行 一定會打起來  於是拿香拜拜  請老大的女人幫忙勸架去\n\n\n\n\n   老大看 8+9回來  以為他又來搶保護費地盤\
  \  8+9連忙解釋  但老大不聽\n\n還給了他一技過肩摔(沒錯  哥吉拉給金剛過肩摔) 8+9被激到 連忙用無限手套\n\n把老大按在地上  還連續給以寶拳\
  \  說著我已經不是以前的我了\n\n但是老大已經在健身房修練出關  也是不同以往  在8+9身後 他非常火的對8+9\n\n開槍  這時老大的女人跑來對兩人搧了巴掌\
  \  說 黑道老大都打到我家了\n\n你們還在這鬧  老大看到自己的女人平安  於是放下和8+9這一架  幫助去打黑道老大\n\n\n\n    回到老大女人的寺廟\
  \  黑道老大果然殺來  但是8+9和老大也同時趕來\n\n於是老大 8+9 黑道老大 野狗   4個瘋狗打了起來  老大女人則是在一旁打黑道其他人\n\n\n\
  \n\n\n4個瘋狗打到老大的地盤  黑道老大很高興  這是他朝思暮想可以收到\n\n眾多保護費的地方 於是想和野犬去詐領保護費  但是8+9和老大趕來\n\n\
  打鬥途中  控制器掉了 黑道老大想拿回  2位一直在阻止\n\n\n這時  小弟拿著8+9掉落的武器  打破控制器  老大對著野狗一吼\n\n野狗看著這老大不好惹\
  \  自己又脫離痛苦  於是3個把黑道老大分屍了\n\n\n\n\n   這道爭地盤的事終於結束了  8+9和老大互相看著  笑了  8+9很禮貌的\n\n把攝影機中央位置讓給老大\
  \  老大向天長嘯  宣告這次我又贏了\n\n\n老大回到新地盤睡覺\n\n8+9帶著小弟  和新收的野狗  回到礦坑  宣告大家都自由了\n\n\n\n\n\
  \   這是一個8+9解放被奴役的眾人的故事\n\n\n\n\n........?\n\n--\n\n\n\n\n\n--"
