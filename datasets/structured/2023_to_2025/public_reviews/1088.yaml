url: https://www.ptt.cc/bbs/movie/M.1711590555.A.31B.html
title: '[  雷] 哥吉拉-新帝國'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  劇情部分不多說


  只是隨便講講感想


  劇情設定很明顯的想灌很多東西


  但是又沒深入多少


  延續上集的人物設定


  看到那個黑人就很出戲


  聰明的智力角色


  感覺就只是為了有個黑人出現而有黑人


  脾氣不好的駕駛員


  從出現沒兩句話就等著他領便當


  果然一下就領了


  獸醫的角色就是為了帶閃電鳥出現而已


  有沒有治療沒有意義


  是個非常平面的角色


  伊維族的小女孩在上集只出現一下


  原來是出現在這裡


  讓人眼睛一亮


  但是兩人用手語流利的溝通這點很怪


  為什麼不讓章子怡出現，最少比較養眼


  地下的部分超級老套


  用白骨鞭的長臂猿


  還是個暴君


  中國風滿滿


  雖然老套但是我喜歡


  暴政是一定要被打倒的


  小紅毛猩猩因為一口吃的倒戈這點不意外


  照往例應該是母的


  等長大就知道了


  操控冰狗的椎子從出現就知道一定會被打壞


  操控系道具的命運一直都是這樣


  地底原住民的神廟地上沒有青苔代表常常在走


  可是旁邊長滿藤蔓


  操控重力的道具也是


  這麼重要的東西長滿藤蔓


  桿子也是腐朽的很嚴重的樣子


  這樣真的好嗎？


  原住民到底是出來幹嘛的


  出來講解劇情說有個壞長臂猿


  然後來自外面的族人會帶著好猩猩打倒牠嗎


  還以為他們的心電感應能力有什麼作為結果沒有


  劇情方面沒什麼新意


  怪獸大對決就對了


  可是有點疲乏


  北極的怪獸沒有長腳


  只是蛟而已


  然後哥吉拉不是貓


  搞個競技場當貓窩是怎樣


  沒有前三集讓人感到熱血沸騰的感覺


  就打打打


  打打打


  沒了


  --'
