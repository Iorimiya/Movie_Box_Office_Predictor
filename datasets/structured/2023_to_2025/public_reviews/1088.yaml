url: https://www.ptt.cc/bbs/movie/M.1711898374.A.921.html
title: '[普雷]  哥吉拉與金剛：新帝國 另類彩蛋？'
content: '今天去看高雄威秀IMAX版15:00場次，滿滿的人潮，還看到滿多年輕爸媽帶著小孩來看，

  我想這就是一種傳承吧！


  會給普雷是因爲雖然打鬥滿爽，但的確像有些鄉民說的，像是穿了皮套的武打演員在打鬥

  ，擬人化太過頭，好多動作根本不像哥吉拉會做的，比如德式後橋背摔，當下看是滿爽，

  但就是少了泰坦怪獸味道，另外讓我最不滿的不是哥佬戲份少，而是最後居然不是解決完

  疤王再二打一霜魔，還變成新夥伴？之前不是營造成霜魔很大隻很強嗎？怎麼只是從被控

  制的反派奴隸變成正派的夥伴？？？這樣安排對我個人來說是滿失望的！


  再來說說另類彩蛋吧！這應該對有在看2013以前的港劇的人才有的驚喜吧！那就是演過許

  多知名港劇的陳法拉，自從到美國後就沒在演港劇了，上次看到她演的電影是尚氣，不過

  尚氣在預告就知道有她了，這次卻藏的很好，除非有在追蹤她的FB或X吧！


  --

  我知道啊 但昭和全系列大致就那樣 除了1964比較嚴肅以外'
