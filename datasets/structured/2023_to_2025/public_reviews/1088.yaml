url: https://www.ptt.cc/bbs/movie/M.1712072767.A.412.html
title: '[普普雷] 哥吉拉金剛新帝國'
content: '今天中午去裕隆城看，難得一個人看電影，整場只有兩個人，我們一人坐一排好爽


  前面鋪呈還ok，中間劇情有一些很突然，後面看打鬥看得還行，就是無重力打鬥眼睛有點暈


  有一些劇情槽點

  1.粉紅男走到一半突然見聞色霸氣說會有危險，裝逼駕駛員開始堅持己見暴走被植物吃掉，這個人的存在感覺可有可無，搞老半天粉紅男其實也會開戰機


  2.剛好右手凍傷，剛好有開發右手機械手套，剛好手套在地底（後面發現傳送門超好連通，根本多拉a夢任意門，那手套回去地表升級不好嗎？剛好存放在地底根本超刻意）


  3.去異世界會給來歷不明的蚊子吸血，這超扯誰知道會不會有什麼奇怪的細菌，電影直接鬼轉陰屍路


  4.小女孩突然變石雕預言的救世主（如果當初不給小女孩跟去地底，預言直接失效）


  5.摩斯拉客串沒存在感，看到摩斯拉是很感動，國小的記憶都回來了，但突然出來當蜘蛛人，其他人在地表打，他直接神隱偷懶，打完才出來飛個幾下


  6.地底人都啞吧：這我不知道要講什麼，如果說能心電感應，那一邊看人一邊點頭要幹嘛，演起來不像心電感應，比較像啞巴


  雖然有些人會說爽片管劇情幹嘛，但是就會害我一直去想。到了地底就會去想地底世界的會有雲？會太陽光嗎？天空是藍色嗎？感覺不夠特別，可能對我來說地底世界要更未知，要像獵人的黑暗大陸那麼酷吧

  -----

  Sent from JPTT on my iPhone


  --'
