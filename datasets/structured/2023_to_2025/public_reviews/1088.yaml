url: https://www.ptt.cc/bbs/movie/M.1712561496.A.149.html
title: '[普無雷] 《哥吉拉與金剛：新帝國》難以評價'
content: '之前很多人嫌人類劇情太多

  這邊縮減了很多人類劇情

  基本上都是怪獸打鬥和怪獸戲份

  對於一個喜歡這種場景的人來說

  這部絕對是一個好選擇


  喔，但我想說的不是這個

  我覺得摩姐的戲份太少了

  把摩姐做的這麼騷

  好想看牠騎乘在哥吉拉上面修幹

  幹

  不對

  這部重點還是太過著重在於人類給予的影響上面了一點

  不過整體而言很難去評價這集

  或許混戰畫面比前面幾集還要精彩

  但是卻也導致劇情過於分散

  還有比重太偏於金剛上面

  比起硬要做一個結尾

  我認為可以把金剛放在這集的主角上

  下集再提哥吉拉的故事

  下下集再一起進行會戰

  不一定要全部塞在同一部電影之中

  這樣顯得後半的劇情有點倉促


  而且這種純爽片

  可能過一年之後就忘了劇情之類的

  頂多只記得登場角色和怪獸

  所以要拍下一集可能得快點了


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
