  4.石莫好像大狗狗(明日奈?),跟哥吉拉1V1認真起來幹的話,大概還是贏不了哥吉拉吧\n\n5.沒想到摩斯拉在怪獸中講話這麼有份量,一站出來仲裁,猴蜥都怒吼同意停戰\n\
  \n6.不過傳奇宇宙好像快沒梗惹,接下來真的能拍就要接到宇宙惹吧?外星人都說出口了\n\n\n--\n\n\n \n\n--"
