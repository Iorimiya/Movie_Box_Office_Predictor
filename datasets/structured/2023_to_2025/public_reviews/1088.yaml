url: https://www.ptt.cc/bbs/movie/M.1711467181.A.51D.html
title: '[好雷] 哥吉拉與金剛:新帝國'
content: '本文無雷


  首先感謝版上抽獎的特映會票



  本次特映會提供兩張小海報與特式門票，都還蠻好看的



  進場要把手機關震動裝袋，避免畫面流出?


  松信威秀巨幕廳場地相當不錯，觀看巨獸電影剛剛好



  劇情方面大概就是6/10，地球人線一如既往地只是點綴


  主軸大概是金剛戰神4你?不能說更多了



  重點是動作場景，不知道是不是AI大進步，特效好像不用錢了一直打


  打來打去感覺地球沒被打爆真是可喜可賀


  每隻巨獸都是活繃亂跳的給個9/10不過分




  比較弱的應該是音效部分，沒有個出色的背景音效、戰鬥曲


  熱血感稍減，得扣分，全程靠吼


  頂多7/10



  以巨獸電影來說，真的是誠意十足了


  就是BOSS有點弱?感覺能設計得更出色才對，不考慮出個BOSS玩偶嗎


  --


  比上一級好吧


  文戲一樣普普，不過動作特效滿滿'
