url: https://www.ptt.cc/bbs/movie/M.1718611206.A.D11.html
title: '[普雷] 哥吉拉與金剛：新帝國'
content: '雷文防雷資訊頁








  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~








  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  故事背景是哥吉拉佔據著地面

  金剛則是居住在地底下

  哥吉拉最近一直在吸收輻射跟攻擊對地區有害的怪物

  金剛則是發現地底的底下還有另一個世界

  居住著壞蛋刀疤王及霜魔，被霜魔攻擊受傷的金剛逃回他的地盤

  遇到下來探查據點艾琳和養女吉雅

  吉雅在地底找到她的族人也解開了身世之謎

  更與金剛、哥吉拉聯手打敗刀疤王


  這片內容真的不怎樣，不過特效還行

  建議不要帶腦進場，感覺會好很多

  但撇開大腦，當作是來看怪獸的爽劇就會好很多


  哥吉拉跟金剛的短暫對戰那段做得不錯

  不過還比不過後面根摩斯拉一起對戰霜魔和刀疤王



  然後認真覺得刀疤王實力真的普普

  感覺金剛單挑就打得贏他了

  真的都是靠霜魔再撐場面



  最後吉雅遇到她族人那段也很令人感動

  大概是這樣，劇情本身是真的很淺

  再次建議不要帶腦，當作看特效就好


  --

  8+9XDD'
