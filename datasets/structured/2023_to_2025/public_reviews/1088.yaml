title: '[好雷] 金哥拉 新帝國 但美術設計很爛'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~










  1.編劇有腦

  人類戲分不會太多

  但又不會很硬要




  2.知道怪獸電影重點在破壞城市

  場景很重要


  我看一半超怕最後在空心地球打

  還好利用傳送門

  快速切換城市


  到處破壞




  3.空洞地球的打鬥不錯

  天空的怪獸對決




  4.美術設計太爛了


  那個冰河龍不能去魔改一隻魔物獵人的嗎？

  看起來就是沒發育完的哥吉拉

  蠑螈長背刺


  頭超軟造型

  沒棱沒角牙短短，背刺短短

  麟片也沒魄力



  反派魔王和族人

  看起來超落魄

  禿頭狒狒流浪漢一族

  金剛敵人不一定要那麼像靈長類吧

  至少突變一點啊


  不然中間金剛到他們領地時

  場景也不是野外

  看起來就是猴子打架

  很解



  扣掉新登場兩隻外型太爛

  個人覺得好看



  --'
