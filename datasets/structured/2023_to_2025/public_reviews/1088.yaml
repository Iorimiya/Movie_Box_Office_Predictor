  金剛能贏哥吉拉，可以說主要靠萬達收購傳奇後在中國的排片及宣傳優勢

  （真要說的話大市場裡也只有韓國，是明顯喜愛金剛大於哥吉拉的）




  再來看看的前十大市場













  除了中國和台灣（怪獸之王2.59億台幣、哥吉拉2.28億台幣）

  相比第一集都是大幅衰退，連日本人都不太捧場

  與其說歐美不喜歡哥吉拉，不如說《怪獸之王》不知道討好了誰？

  也許台灣人特別喜歡吧？


