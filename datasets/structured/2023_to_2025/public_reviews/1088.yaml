url: https://www.ptt.cc/bbs/movie/M.1734107014.A.5B1.html
title: '[問片] 關於感應在紙上畫圖的科幻片'
content: '問過ai跟估狗還沒找到，只能上來求救了


  內容印象比較深的是


  有人在紙上塗鴉（好像是感應到什麼）

  把紙塗的黑黑的，最後中間有三個尖尖的輪廓，不確定是不是三角形


  後來有儀器也探測到這種能量，用類似地震記錄器的機器記錄下來

  （就是紙一直跑，指針會在上面畫線條的那種）


  發現與那個人塗鴉的圖形幾乎吻合



  接下來是印象比較模糊的部分

  那能量來源不知道是外星科技還是古文明

  發送的來源物體形狀就跟那三個尖尖的類似


  應該是科幻片...？


  --

  ˋ( ° ▽°)ˊ不需要女人 我只需要一個溫暖的______


  --'
