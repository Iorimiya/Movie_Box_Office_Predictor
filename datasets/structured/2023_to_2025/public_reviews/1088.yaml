url: https://www.ptt.cc/bbs/movie/M.1711526486.A.ADA.html
title: '[ 好雷] 哥吉拉與金剛：新帝國'
content: '鐵粉，有怪獸打架就給好雷


  這次有出現很多種的怪獸打架

  但都是曇花一現

  可喜可賀的是人類戲份跟角色也少了很多

  劇情推近很快，有進步

  然後小女孩吉雅跟陳法拉很正


  小金剛帶金剛去找刀疤王途中

  有一幕是走過一條獸骨的吊橋

  鏡頭拉遠就像人類在走吊橋那樣

  可金剛是100多公尺的泰坦誒

  照比例來看那巨獸至少超過1000公尺吧

  未來傳奇怪獸宇宙有機會出現這麽大的嗎？


  吉雅的作夢跟心電感應，

  應該是致敬平成版人心怪樹那集，

  有一群超能力小孩把夢到的未來畫出來，

  超能力少女三枝未希也是在該集登場


