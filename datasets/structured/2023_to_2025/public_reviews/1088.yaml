url: https://www.ptt.cc/bbs/movie/M.1710410947.A.014.html
title: '[新聞] 哥吉拉與金剛:新帝國 曝特別版預告!集結'
content: "十周年特別特別版預告:\n\n\n---------------------------------------------\n新聞網址： \n\
  \n《哥吉拉與金剛：新帝國》曝特別版預告！集結怪獸宇宙10周年畫面\n\nYahoo奇摩新聞（記者 許瑞麟）\n2024年3月14日 週四 下午3:59\n\n\
  《哥吉拉與金剛：新帝國》預售票開賣，官方也公布「怪獸宇宙10周年特別版預告」，可\n以看到該宇宙電影的許多畫面，包括《哥吉拉》、《金剛：骷髏島》、《哥吉拉 II\
  \ 怪獸\n之王》、《哥吉拉大戰金剛》，到最新一部《哥吉拉與金剛：新帝國》。\n\n對於怪獸宇宙10周年，製作團隊尊重這些角色的根基、起源和粉絲的期待，確保每次都為\n\
  觀眾提供新鮮且不同的東西。導演亞當溫高德（Adam Wingard）也認為，維持所有系列電\n影之間的連續性很重要，並且希望角色的改變是由故事所驅動的，哥吉拉的演變也是如此\n\
  ，牠的外皮改變成粉紅色，比例也發生了變化，讓哥吉拉有了新的形象。\n\n在《哥吉拉與金剛：新帝國》中，哥吉拉與金剛將聯手對抗強大的新威脅刀疤王，導演亞\n當溫高德笑說：「刀疤王，牠是典型的邪惡獨裁者，世界各地和整個歷史上的文明都有各\n\
  自版本的邪惡獨裁者。我認為刀疤王是種古老的邪惡，代表人性最陰暗的那一面。」\n\n《哥吉拉與金剛：新帝國》將於3月27日搶先全美在台上映，預售票於今（14）日正式開\n\
  賣。\n\nYahoo奇摩新聞娛樂記者 許瑞麟／綜合報導\n---------------------------------------------\n\n\
  大冰怪有畫面了耶! 還有哥佬金剛的合體技\n最扯的是金剛還可以騎哥佬.... 現在是大家都要學騎沙蟲就是 哈哈\n越來越期待嘍~ 但真的希望不要爛掉或爆炸了...\n\
  \n--"
