url: https://www.ptt.cc/bbs/movie/M.1712892439.A.4D8.html
title: '[好雷] 哥吉拉與金剛：新帝國 意外的不錯看'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~












  一開始預告裡那令人很不習慣的粉紅色哥吉拉

  劇中也有合理的交代原因(其實真正原因是要賣新玩具)

  原來是吃了不同屬性的能源就會發不同光啊XD(如果是吃了綠電應該會變綠色吧)



  不得不說

  本片人類戲份節奏掌握的總算是還可以了

  沒有硬打斷大家真正想看的怪獸打架

  主要人類角色也大多有其功能性

  (黑人網紅例外，他還是很煩XD)



  而片子中間有好長一段是金剛到達B2樓層後

  在刀疤王領地上跟其他猩猩衝突的橋段

  這段完全無對白，完全就是看那些猩猩在....耍猴戲

  然而劇情卻非常好懂，猴子們的表情跟動作都很到位

  這邊很棒，讓我有點期待有人拍一部完全沒有人類講半句台詞的怪獸電影



  怪獸打架部分，也算是有打好打滿，豐富程度僅次於怪獸之王

  不過牠們好像很熱衷於破壞古蹟跟地標



  最後，當本片唯一的壞人被打死後

  結局馬上走向HAPPY ENDING的極致.....


  霜魔被解放

  哥吉拉躺回紙箱

  之前孤身一人的金剛跟吉雅分別都找到自己的族人

  讓我由衷替他們感到高興



  整體來說相當不錯，娛樂性很足

  金剛老是一臉驚恐的遜砲樣很有喜感跟人味

  熊樣哥吉拉(平成哥吉拉是貓臉，傳奇版是熊) 又增加了貓屬性

  霜魔也很可愛(大狗)

  比想像中的好看


  --'
