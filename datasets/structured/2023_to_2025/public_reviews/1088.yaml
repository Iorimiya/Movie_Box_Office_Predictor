url: https://www.ptt.cc/bbs/movie/M.1715437565.A.01D.html
title: 'Fw: [閒聊] 哥吉拉與金剛 新帝國（雷）'
content: '作者: dukemon (dukemon) 看板: C_Chat

  標題: [閒聊] 哥吉拉與金剛 新帝國（雷）

  時間: Sat May 11 21:52:49 2024



  剛才去看了，大概是快下檔人蠻少看得很舒服XD



  金剛的劇情簡單來說可以帶入北斗神拳

  金剛拳四郎來到一個被暴政統治的村落打倒統治者刀疤


  但加上了哥吉拉視點就真的超想笑

  事前追了一個反抗泰坦追超久在義大利擊殺

  然後看到人類這個羅馬競技場很好睡就躺下來

  剛睡幾天聽到地底人呼救開始備戰霜魔順便把提亞馬特幹掉吸能源


  結果那個金剛就衝上地表用呼叫叫來哥吉拉

  忙翻天的哥吉拉當然衝過去就是暴揍一頓

  （記得那是挑戰王的呼叫方式）

  好笑的是金剛還真的一直指地下，哥吉拉照樣扁，

  他是不是覺得哥吉拉對自己的好感度很高啊XD

  直到摩斯拉上來叫停才結束


  最終戰我總覺得那個反重力不要開搞不好地上還沒事

  刀疤爛到打不贏金剛叫霜魔過來打

  結果霜魔一分心打金剛

  哥吉拉就開始輾壓刀疤了，

  控制器掉到地上被金剛小弟一斧砸爛


  是說再等一下摩斯拉就衝上來，刀疤這個廢物一點勝算都沒有吧


  結局哥吉拉回羅馬競技場睡覺，希望他這次能好好睡一陣子

  金剛跟霜魔回地底統治部落，摩斯拉幫地底人修復防護牆後就離開了


  整體而言就一部爽片

  還有摩斯拉跟霜魔要不要教一下金剛關於泰坦的社交常識啊

  他這樣總有一天會被暴怒的哥吉拉轟爛，

  還不知道自己是怎麼惹火對方的XDD

  -----

  Sent from JPTT on my iPad


  --'
