url: https://www.ptt.cc/bbs/movie/M.1712621995.A.D27.html
title: '[新聞] 《哥吉拉與金剛：新帝國》蟬聯雙週票房冠'
content: '《哥吉拉與金剛：新帝國》蟬聯雙週票房冠軍 全台票房衝破1.8億


  《哥吉拉與金剛：新帝國》持續刷新票房紀錄，全球票房已破3.6億美金（約116億新台幣

  ）；全台票房則衝破1.8億，蟬聯雙週票房冠軍。不少觀眾趁著春假期間進戲院體驗泰坦

  巨獸的無限威力，透過大銀幕親身感受熱血沸騰、腎上腺素竄升的快感。


  泰坦巨獸無疑是《哥吉拉與金剛：新帝國》的主角，透過哥吉拉、金剛的視角來探索巨大

  的新世界，而這次牠們也有了自己的心路歷程。金剛在電影開頭與結尾時會有所不同，其

  他泰坦們也會自己做出選擇、結成聯盟，齊心協力地去改變牠們的世界。


  《哥吉拉與金剛：新帝國》能讓觀眾完全逃脫現實，沉浸在令人驚嘆的世界中。導演亞當

  溫高德分享：「若要說什麼電影適合IMAX體驗，那一定是《哥吉拉與金剛：新帝國》，也

  只有在這部電影中，才會有身高300英尺（約91公尺）的主角。透過IMAX攝影機，我們能

  讓觀眾身歷其境地去體驗這場盛大的冒險旅程。」





  --'
