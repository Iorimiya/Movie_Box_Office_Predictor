url: https://www.ptt.cc/bbs/movie/M.1711676748.A.683.html
title: '[普雷] 金剛 新帝國'
content: '從預告粉紅哥吉拉跑步我就一直在思考要不要別去看了


  直到27號突然有個假日 想想還是去看一下順便收集海報


  不得不說秀泰這次首映海報有夠小張的 哥吉拉的頭又越看越像酷斯拉


  我對金剛也沒什麼感覺 要不是電影憑良心說還算不錯


  還不算浪費電影票錢 喜歡看爽片怪獸片的人值得進場一看




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  金剛因為蛀牙跑到地面找人類換牙齒

  安雅因為沒有對人類社會歸屬感又做了奇怪的夢境

  同一時間空心地球的前進基地遭受莫名的攻擊

  主角一行人在金剛返回空心地球時一通過去探查

  一行五人只有一個保全老頭有武器 不說還以為只是個非洲旅行團

  然後不出意外的時候就出意外了

  保全老頭死了 一行人順利發現空心地球中生活幾百年的啞巴中國人(我覺得真的很像中國

  人)

  同一時間金剛回到巢穴發現新的空間 一過去就被襲擊

  一群禿頭猩猩跟一隻8+9小猩猩圍攻我金剛大大

  之後威脅這隻8+9紅毛帶他去找其他禿頭猩猩的據點

  通過一座怪獸骨頭莫名強壯的橋後就抵達變成火山型態的據點

  在禿頭猩猩不知道在挖礦還是無聊在搬石頭的廣場

  發生礦場一定會有的監工鞭打勞工的事件

  以及主角一定會出手的情節

  導致反派老大一定會出手教訓主角的過程

  最後進入反派老大使出隱藏大招後主角敗逃的結局

  此時人類發現空心地球中人類一族的傳說

  以及自己一行人原來是救世主與她的跟班而不是旅行團的真相

  最後在這裡金剛與人類進行最後的裝備升級

  一同迎戰反派主角-禿頭猩猩幫的進攻

  最終打贏了這一場拯救世界的幫派決鬥 可喜可賀


  嗯?哥吉拉呢？ 本片沒有哥神

  有哥神還要金剛出手嗎？

  只有一隻會睡在羅馬競技場的變種蜥蜴而已

  是個廢物 還要四處打怪練等級 最後還是要靠金剛

  不值一提


  --'
