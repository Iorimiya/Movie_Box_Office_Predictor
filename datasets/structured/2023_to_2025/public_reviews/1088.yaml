url: https://www.ptt.cc/bbs/movie/M.1711551223.A.84C.html
title: '[普雷] 哥吉拉x金剛 新帝國'
content: '趁看完台中遠百六點的場還有印象來寫一下



  本文有雷，如果沒看中國版預告就先別看這篇了



  本作的哥佬，如果沒看前導漫畫


  其實是不太知道哥佬已經被某個獵人搞到龜懶啪火了，因為他一直用有核輻射的工具，不斷讓哥佬在整個地球四處跑以及打其他泰坦。



  也是因為這樣哥佬這集才會在羅馬打完後休息那麼久，又去破壞核電廠以及打提雅馬特。耗能太大了。



  本作就兩條線，一條主線金剛、支線哥佬。人類戲份這次少到我覺得就是真的只剩推動劇情。但新角真的會讓我有種看變形金剛的煩躁感。


  劇情就不說了，沒什麼能講的。頂多就是導演在主線嘗試的金剛線都沒對話。（這段我真的覺得可以，未來沒有人類劇情的話，用這段當例子相當好）



  整體上就打架、打架，再打架。打的算蠻爽的，選間大螢幕好好享受就好。



  最後就是驚喜真的是摩姐有出場，也是唯一一段算是讓我覺得美術設計還不錯的地方。



  音樂的部分從GVK 開始我就覺得不太ok，這次也一樣。

  最頂的還是KOTM以及2014版的。



  怪獸宇宙目前排下來，個人喜歡的排名大概是這樣


  KOTM>2014>Skull Island>GxK>Gvk

  -----

  Sent from JPTT on my iPhone


  --'
