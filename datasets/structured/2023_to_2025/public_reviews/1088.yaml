title: '[普無雷] 哥吉拉與金剛 新帝國 '
content: '此篇無雷 ~ 請放心



  人類戲份減少許多令人開心


  雖然我蠻討厭金剛的，但這集金剛確實有點帥


  只要有哥吉拉出場的場景都讓我興奮，雖然真的有點寵物化了(這次敏捷點滿了...)


  美術只有部份好~那個好我很喜歡


  最讓我討厭的就是猩猩打架與種族的部分


  讓我覺得很像在看猩球崛起-巨獸版


  而且動作打的很像人類打架，8+9的那種


  喜歡1跟2的可以去看，不難看


  因為至少比3好.. 3真的很難看



  最後真的很想許願


  可以把戰場與戲份還給哥吉拉嗎? 下一集不要再有金剛了~ 好膩喔 ...



  --'
