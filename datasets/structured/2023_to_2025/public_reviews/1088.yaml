url: https://www.ptt.cc/bbs/movie/M.1712301754.A.943.html
title: '[負雷] 哥吉拉與金剛：新帝國—可憐哪～'
content: '現在怪獸宇宙有五部分為兩個階段風格

  哥吉拉1跟2就是滿滿自我風格

  1的神秘感塑造與災難的降臨

  2的泰坦巨獸的莊嚴感與霸氣

  我都很喜歡但票房很爛也是事實


  而金剛、哥吉拉與金剛兩集

  就是好萊塢無腦爽片風格

  特效炸好炸滿其餘通通不重要

  在看這部時更有一種看中後期玩命關頭和變型金剛的感覺

  就是只剩空殼



  人類方就不說了整個就是跟10分鐘看完一部電影的白癡影片沒兩樣

  準備出發要去地心那邊還用慢動作真的超低能


  哥吉拉這條線除了哥吉拉變有夠敏捷像綠鬣蜥一樣外

  是還可以…

  但問題就出在佔了電影80%的金剛線


  金剛這集的核心命題根本跟上一集一樣啊

  然後所有的猩猩都太像人類

  不管是做的事情肢體語言甚至臉部表情

  金剛跟小金剛的互動完全就是好萊塢最老套的故事模式

  有個小孩或青少年因為家庭關係所以很叛逆很屁，遇到一個長者被教訓後因為某些原因需要一起行動，一開始屁孩還是很想弄長者，結果長者不管怎樣被弄還是不跟他計較感化了他

  這種爛大街的故事我幹嘛看猩猩版？？？

  小金剛也是真的屁到像臺灣路上的小猴子根本讓人喜歡不起來


  接下來最爛的就是那個BOSS刀疤王

  剛登場時就站37步然後仰頭斜視看金剛

  這跟平常臺灣人最討厭的那些公廟黑道猴子有何不同？？？

  戰力還跟他們一樣爛

  除了第一場跟金剛打有真正用上那條鞭子外而且還打輸

  之後就是看他不停用那毫無解釋的水晶一直指著霜魔

  從猩猩部落指到地心人類部落到了地表還在指

