url: https://www.ptt.cc/bbs/movie/M.1711835401.A.1AE.html
title: '[普好雷] 哥吉拉X金剛：新帝國@林口威秀4dx'
content: '好的部份給這片畫面呈現跟4dx的效果

  第一次看4dx看到要讓抓緊扶手

  真的有種快被甩出去的感覺

  已經有點影響到觀影了

  好險這片沒啥深奧複雜的內容

  就看怪獸打打打就完了

  這票價花的值


  普的部分...

  這片的劇本照舊是股泥石流

  有改善的就是尷尬的人類戲份少很多

  全場有一半是怪獸們嗷嗷吼吼嚶嚶叫

  嚴重懷疑這是好萊塢投資方

  針對編劇罷工的一次嘗試

  另外3d的效果不是很明顯

  應該是後製3d不用太期待了




  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~














  只能說好萊塢的Godzilla跟

  日本的gojira根本完全不同生物

  新的gojira minus one沒看過不好說

  （敲碗臺灣快上啊～～～）

  但看看庵野版的shin gojira

  再對比這片的Godzilla

  總覺得有股滿滿的+9味

  中間有一段哥佬跟金剛對打最明顯


  金剛：嗷嗷！！！

  哥佬：吼吼（你叫啥）？！

  金剛：嗷嗷（叫你咋地）！！！

  哥佬：吼吼（尬吝北旦欸）！！！

  哥佬就一路從直布羅陀跑去埃及扁金剛了

  然後直布羅陀那個跳崖畫面莫名的喜感

  另外求埃及人的心理陰影面積

  金字塔在那幾千年都沒事

  你們兩個+9怪獸花五分鐘就打爛了XD


  再來刀疤王嘲笑金剛裝假牙那段也是

  不會說話整段落吼來吼去很正常

  但那個肢體動作讓人不禁懷疑...

  你真的是遠古泰坦？

  不是整天刷抖音的8+9？


  最後2v2的決戰

  第一段在空心地球的無重力亂打

  這在其他怪獸電影可沒見過

  這段也是4dx效果最突出的

  畫面的鏡頭在轉

  椅子也跟著轉再加上打鬥的震動

  就像前面提到真的要握緊扶手才行


  最後的最後要吐嘈一下

  最開始金剛狩獵那段

  金剛把獵物抓起來撕成兩半全身浴血

  為什麼要噴水啊？？？


  --'
