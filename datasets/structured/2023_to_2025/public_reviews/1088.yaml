title: '[微好雷] 哥吉拉與金剛：新帝國'
content: '很幸運的，獲得台北場特映會的門票。

  昨晚大約六點二十幾分到達十樓，尋找報到處

  後來才發現廠商在十一樓設置，就在電扶梯上來的旁邊

  由於排隊人潮眾多，

  大概六點三十分聽到廠商工作人員說：先開始吧

  報到領票的動作提前開始，我就順勢加入排隊行列。



  (原訂電影19:40開始放映，規劃提前一小時報到劃位)



  (排到電梯間位置這裡的時間大概是七點左右)


  順利領取到小海報跟電影票後，就到處拍照，然後等待

  七點二十幾分就可以入場了，

  入場前已經沒人潮了，看到報到處還有剩一疊票，

  想說詢問看看能否有換位置的機會，才知道所剩的都是A排座位



  (小海報，可以拿兩張)



  (電影特映會票券背面)



  (電影特映會票券正面)



  (報到處有兩位廠商人員、兩位影廳工作人員)


  進場動線有看到四位穿著西裝的廠商工作人員(也許更多?)

  會提醒手機關靜音，並告知會發放袋子，請將手機放入再進場

  不會檢查電影票，有確實看到你將手機封印就可以進去影廳了

  因為我的位置在影廳最右邊出入口旁，所以可以觀察工作人員

  大部分的觀眾都在19:40進入影廳，

  穿著西裝的廠商人員很謹慎的在掃視觀察影廳內的情況，

  影廳工作人員也在旁待命聽從指示，所以電影延後十分鐘才播放

  電影從開始到結束，穿著西裝的人員一直都在兩側站著，辛苦了。



  --------------以下有點雷，防雷線--------------------















  這集對主角群而言，是簡單任務。

  詳細劇情就不說了，大致簡單帶過。


  金剛走主線任務(地心探險)

  哥吉拉走支線任務(環游世界)

  這兩條線同步進行。


  而人類的戲份大概都跟著主線跑(跟著金剛去旅行)

  在這期間也觸發了支線任務(召喚摩斯拉)


  金剛與迷你剛的比手畫腳，表情肢體很有趣!

  哥吉拉不知道是不是海裡睡太久，羅馬競技場變成他的窩!?

  摩斯拉在主線任務的BOSS戰前夕才現身，

  主要是擔任守門員輔助角色。


  哥老完成支線任務後，在金字塔傳送點久別重逢等待已久的金剛

  雙方情不自禁的嬉鬧一番，在摩姊出面制止後，

  大夥重整士氣踏入傳送點，進入主線任務BOSS戰!!


  刀疤王紅毛是敏捷型近戰，進攻手段仰賴鎖鏈般的專武。

  受控制的霜魔，雖然耐打能坦，分擔了不少傷害，但僅有冰霜射線。

  哥老與金剛能力提升後，其實這個BOSS戰算是很輕鬆了，

  更不用說還有戰友的支援。

  (地心一回戰有摩姊的幫忙)

  (地上二回戰還有迷你剛的協助)


  覺得這集主要目的是讓金剛與哥吉拉得以進化。

  而這些鋪陳，是導演為了下一集，讓他們有能力面對更強大的怪獸所做的準備。

  (希望能讓哥吉拉跑主線任務)


  已經逐漸淪為配角的哥吉拉，熱血的出場曲呢?

  在配樂上打安全牌，沒有亮點，實屬可惜。

  身為哥粉，實在不想說出食之無味、棄之可惜這句話，

  因為還有哥吉拉電影能看，就已經很開心了。

  希望導演真的是將這集當作鋪陳，讓未來更精采。


  --'
