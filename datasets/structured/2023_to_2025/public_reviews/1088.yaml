title: '[  好雷] 哥吉拉與金剛新帝國'
content: '劇情的部分很多人講過了我只講我的觀影心得，我的感想如下



  這部片我最不滿意的地方就是大幅吞吃前幾作的設定，尤其是哥吉拉從頭到尾各種莫名其妙

  的8+9行為，這部片如果是依照本來的金剛之子下去拍應該會好些，本部片打鬥多，對金剛

  的描寫也很豐富，不對靈長類有偏見的話推薦去看看，電影院的女生都覺得金剛拿小猴子使

  用*禮服*的互動很有趣


  --'
