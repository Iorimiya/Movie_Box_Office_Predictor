url: https://www.ptt.cc/bbs/movie/M.1711120192.A.E2F.html
title: '[新聞]《哥吉拉與金剛:新帝國》導演已計劃下一部續集'
content: "新聞網址：\n\n\nBy David 3 月 22, 2024\n\n\n導演亞當·溫高德已經為《哥吉拉與金剛：新帝國》下一部續集構思續集的想法。\n\
  \n\n亞當·溫高德執導了2021年的《哥吉拉大戰金剛》以及即將上映的《哥吉拉與金剛：新帝\n國》。\n\n\n\n亞當·溫高德表示 :「就像你所說的那樣，如果你已經拍了兩部電影，也許可以降級去做\n\
  第三部，因為這當中確實存在一個三部曲的架構。我絕對認為這個故事還有更多可挖掘的\n空間，我也認為我還有更多故事可以講述。但這完全取決於《新帝國》的表現以及事情的\n\
  發展走向。我知道這聽起來像是個冠冕堂皇的外交辭令 (笑)。但實話是，如果我要完全\n誠實地告訴你，我確實還有更多關於這些怪物的故事要講，而且我知道我會把故事引向何\n\
  方。如果一切順利，我非常希望能再次回來執導續集！」\n\n\n由亞當·溫加德執導的怪獸電影續集《哥斯拉大戰金剛：新帝國》即將於 2024 年 3 月\n 29\
  \ 日登陆北美院線。本片由特里·羅西奧、西蒙·巴雷特和傑里米·斯萊特共同撰寫劇\n本。\n\n\n官方劇情簡介寫道 :「史詩般的戰役仍在繼續！」傳奇影業的怪獸電影宇宙繼承了《哥吉\n\
  拉大戰金剛》的激烈對決，帶來全新冒險。 強大的金剛和可怕的哥吉拉將聯手對抗潛藏\n於我們世界深處的巨大未知威脅，這場戰鬥將挑戰它們的生存，也將挑戰人類的命運。\n\
  」\n\n\n《哥斯拉大戰金剛：新帝國》將深入挖掘這些泰坦巨獸的歷史和起源，探索骷髏島以及更\n廣闊世界的奧秘，並揭開塑造這些非凡生物的神話般戰役，以及將它們永遠與人類聯繫在\n\
  一起的過去。\n\n\n《哥吉拉與金剛：新帝國》集結了實力派演員，包括蕾貝卡·霍爾、布萊恩·泰瑞·亨利\n、丹·史蒂文斯、凱莉·霍特爾、艾力克斯·福恩斯和陳法拉。\n\
  \n\n值得一提的是， 2021年的《哥吉拉大戰金剛》目前正在流媒體平台 Max 上映。\n\n\n--"
