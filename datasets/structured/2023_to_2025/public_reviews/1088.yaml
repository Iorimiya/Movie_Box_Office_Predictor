url: https://www.ptt.cc/bbs/movie/M.1711551714.A.011.html
title: '[爽雷] 《哥吉拉與金剛：新帝國》舒爽！'
content: '雷文防雷資訊頁





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  覺得這集非常棒

  爽度完全可以

  太舒爽了～


  滿滿的怪獸

  而且大部分在白天

  主角怪獸外觀都蠻細緻 不粗糙


  總覺得還有萌感和CP感

  在羅馬競技場睡覺好可愛XD

  一開始還以為 新帝國

  是要哥吉拉+金剛一起建立嗎（誤

  摩斯拉也有戲份了 正牌女友來了

  莫名突然有點感動

  然後看哥吉拉開掛就是爽

  爽到爆！

  變異的粉紅紫光超帥！！！


  但我也覺得這幾個人直接走在地心很唬爛

  明明一堆怪物的地方 沒什麼防護衣就算了

  武器都不帶的


  不過就瑕不掩瑜了

  真的是怪獸打得很爽


  看的出剪了很多細節

  我蠻好奇動力裝備的簡介

  就只晃過一張圖

  懷疑是用之前環太平洋的東西XD

  連那個系統聲音根本就一樣吧

  也有點鋼鐵人浩克破壞者 總之很帥

  什麼時候feat環太平洋機器人啦 好想看～

  （雖然感覺泰坦一碰就沒了XDD


  上一集我還覺得這導演的普通

  但是這集改觀了 他很棒！


  --'
