  \   \n\n2005年獲選柏林影展新力論壇（Berlinale Talent Press）影評人項目。   \n\n國立台灣大學社會學系畢業，國立台灣大學建築與城鄉研究所肄業。\
  \       \n\n電影等相關文字曾定期與不定期散見於各大報刊。                       \n\n\n\n\n^L:b:#,:dis2:,#@E,:end:,End#\n\
  \n\n\n\n\n\n\n\n出生於1971年，畢業自輔仁大學歷史系，擁有紐約市立大學史丹頓分     \n\n校電影研究碩士學位。曾任聯合報影劇記者、金馬影展國際數位短片評審\
  \     \n\n、紀錄片雙年展評審，現於臺藝大電影系兼任講師，並擔任國片影像教育     \n\n紮根計畫講師，從事電影電視編劇，寫過電視劇「那一年的幸福時光」等\
  \     \n\n多部劇本。影評散見各相關雜誌及網站，電影專書則著有「好萊塢電影夢     \n\n工廠」等。                       \
