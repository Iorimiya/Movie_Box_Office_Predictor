  \     │          │          \n\n^L:01:#,:noon1:,#@E,:end:,End#\n\n\n\n李察。艾爾 Richard\
  \ Eyre                \n\n希芭是倫敦聖喬治中學新進的藝術老師。美麗又屬於上流階層的她，在這一 \n群早已失去教學熱情的教師群中，宛如一道清新的活水。對於41歲的希芭而言，\
  \ \n教書工作亦是讓她逃離正為青春期苦悶的兒女，以及年齡差距多達二十歲的無趣 \n丈夫的最佳出口。希芭的同事芭芭拉，個性刻薄又伶牙俐齒，卻對希芭有一股莫 \n\
  名的好感。某次芭芭拉為她排解課堂上的爭吵事件，兩人友誼自此開始滋長。然 \n而，芭芭拉卻意外發現，希芭與一名 15 歲男學生史蒂芬的不倫師生戀…。     \n\
  \n她於是成了希芭的秘密守護者，兩人關係更進一步成為知己好友。希芭對芭 \n芭拉無話不說，芭芭拉也將這段禁忌戀情的細節，鉅細靡遺地詳載在日記中。她 \n們的友情隨著芭芭拉與日俱增的獨佔慾逐漸變了調，而此時芭芭拉卻發現這個能\
  \ \n使希芭失去工作、家人，甚至還得吃牢飯的秘密，是她操縱希芭的最佳武器…   \n\n2007 金球獎最佳女主角、最佳女配角、最佳電影劇本提名    \n\
  2007 奧斯卡最佳女主角、最佳女配角、最佳改編劇本、最佳原創聲配樂提名    \n\n\n^L:1:#,:mon:,#@E,:end:,End#\n\n\n\n\
  史蒂夫。麥昆 Steve McQueen             \n\n布蘭登是一名住在紐約的白領，他事業成功，但酷愛成人影片，經常自慰和 \n召妓。不過，與妹妹茜茜的關係卻忽冷忽熱，總給他電話留言，他卻總是避之不\
  \ \n及。當茜茜走投無路搬來與他同住，他又表現出特別的關心。一日，布蘭登和上 \n司大衛一同去聽茜茜的演唱，大衛被茜茜的風姿所打動，而布蘭登卻沉浸在她的 \n\
  歌聲中潸然淚下。在妹妹面前，布蘭登表現的無所謂，而上司卻大膽追求，這令 \n布蘭登極為羞恥。                                 \
  \                      \n\n一日，大衛在與家人視頻通話後，開始斥責布蘭登的電腦硬碟中塞滿了成人 \n電影，稱之為恥辱，氣急敗壞的布蘭登卻對茜茜發火，令她十分傷心。及後，布\
  \ \n蘭登開始與公司女秘書瑪麗安妮約會，二人上床後，布蘭登才意識到自己真正的 \n問題並不是性成癮，而是心中掛念的兄妹之情。                \
  \             \n\n2011 威尼斯影展最佳男主角、影評人費比西獎                    \n2011 洛杉磯影評人協會最佳導演\
  \                                \n2011 英國獨立電影金像獎最佳男主角                         \
  \   \n\n^L:2:#,:tue:,#@E,:end:,End#\n\n\n\n佛森。歐茲派特 Ferzan Ozpetek          \n\n\
  年輕的喬凡娜已經為人妻母，儘管生活忙碌，她還為巷口咖啡店烘焙蛋糕。 \n雖然她一直對成為一位糕點美食家有著憧憬，但現實生活裡的沉重壓力已讓她幾 \n乎不敢奢望。由於老公菲力浦的優柔寡斷，喬凡娜的不耐與不滿也與日俱增。她\
  \ \n理想中的性幻想對象於是就投射在住在對窗的鄰居羅倫茲身上。每當夜幕低垂， \n她總留在廚房窺視，這為她的生活中增加了不少刺激…。 某日，善良的老公菲力\n\
  浦帶回一位優雅卻暫時失憶的老先生大衛。就在喬凡娜想試著幫他找回記憶時， \n卻因緣際會認識了心儀已久的鄰居羅倫茲。然而當大衛的記憶一段一段地浮現時 \n，他們之間的感情也正逐步地陷入了不可自拔\
  \ ....。                        \n\n片中大量地轉換時空佈景，其中穿梭時光的對白，細膩地呈現主角們在生活 \n中必須面對的壓力及生存課題，映照出人性對於現況不滿的行為反應，並且無法\
  \ \n控制體妹不時蠢蠢欲動的渴望與情慾。導演其中藉由相對映的窗戶，描繪男女在 \n現實及夢想、情感及理性之間彼此衝突的矛盾的抉擇。             \
  \          \n\n2003 義大利奧斯卡12項提名，入圍五項大獎                       \n\n^L:3:#,:wed:,#@E,:end:,End#\n\
  \n\n\n賈克。歐狄亞 Jacques Audiard           \n\n落魄的拳擊手阿里，帶著兒子到安提布投靠姐姐。在夜店打工當圍事時認識 \n\
  了殺人鯨訓練師史蒂芬妮。送史蒂芬妮回家後，留下的電話號碼終於被回撥時， \n卻已人事滄桑。一場意外，史蒂芬妮的雙腿截肢，本應能泅善泳的鯨豚訓練師失 \n去了平衡感，在汪洋裡迷失了方向感，偶然找到的阿里的電話冥冥中如浮木。而\
  \ \n阿里的言行直率毫不拐彎，由直覺與本能帶領一切行動，如此幾乎宛如動物般的 \n生命特質，成了她走出牢籠的出口。他的獸性本能和她面對自身殘缺時的小心翼 \n\
  翼，卻讓彼此走向一段既無明確期待更不知去向何處的關係。                 \n\n演出史蒂芬妮的瑪莉詠柯蒂亞透過電腦特效處理將雙腿去除，不過藉著表情\
  \ \n與肢體，足夠讓觀眾深瞭她的境遇與心情。另外導演鏡頭下蔚藍明晰的南法海岸 \n亦與模糊卻慾望暗湧的劇情形成特殊張力，片中流露大蕭條下的淒然之美，電影 \n\
  所呈現出來的蕭條會帶給人奇異的視覺效果，同時也赤裸裸地展現世界的黑暗。 \n\n2012 坎城影展競賽片  2013 金球獎最佳外語片 提名         \
  \     \n2013 凱薩獎最佳改編劇本、最佳剪接、最佳原創音樂、最佳新人    \n\n^L:4:#,:thu:,#@E,:end:,End#\n\n\n\
  \n喬。萊特 Joe Wright                    \n\n「幸福的家庭都是相似的，不幸的家庭各有各的不幸」。             \
  \        \n\n1874年安娜。卡列尼娜是政府高官卡列寧的妻子，兩人生活幸福美滿。一天 \n，大哥奧勃朗斯基來信，請求安娜到莫斯科拯救他和達麗亞的婚姻。途中認識了\
  \ \n伏倫斯基伯爵夫人和她的兒子–騎兵軍官伏倫斯基。兩人瞬間燃起火花。       \n此時，奧勃朗斯基的好友列文也上門拜訪。心思細膩又有同情心的他愛上達 \n\
  麗亞妹妹吉娣。他突兀地向吉娣求婚，但她早已迷上伏倫斯基。傷心欲絕的列文 \n回到家，全心埋首務農。吉娣則在舞會中徹底心碎，因為當晚伏倫斯基的眼光全 \n在安娜上，這位有夫之婦也回應了年輕人的追求。\
  \  吉娣則在舞會中徹底心碎， \n安娜嘗試恢復原本平凡的家庭生活，但卻怎麼也忘不了伏倫斯基。隨之而來 \n的則是烈火熱戀，在聖彼得堡社交圈鬧得滿城風雨。忍無可忍之下卡列寧只能向\
  \ \n妻子發出最後通牒。為了追求快樂，最後僅能以悲劇收場。                   \n\n2013 奧斯卡最佳服裝設計            \
  \                          \n2013 奧斯卡最佳攝影、最佳配樂、最佳美術設計 提名             \n\n^L:03:#,:noon3:,#@E,:end:,End#\n\
  \n\n\n婁  燁                                 \n\n余虹敢愛敢恨，在 1987 年隻身離開家鄉，告別身邊的青梅竹馬前往北京求\
  \ \n學，他與同校的周偉愛的火烈，熾熱愛情伴隨著一連串的不安、失望、和矛盾， \n讓他們只能藉由一次次激情的性愛撫平靈魂的缺口。              \
  \           \n\n對周偉來說，他無法招架余虹過於剛硬的個性，對余虹來說，因為太愛對方 \n，她興起離開的念頭。1989年六月，正當天安門廣場飄揚著年輕學子的自由理想\
  \ \n，余虹和周偉的戀情已走到盡頭。                                         \n\n在命運牽連最終註定了這對愛侶的分離，周偉前往柏林，余虹則回到家鄉，\
  \ \n再輾轉到了深圳、武漢、重慶。轉眼十幾年過去，漂泊的日子裡他們不時惦念著 \n對方，只是當兩人再度聚首，除了記憶中初遇的舞會，頤和園共遊的隻光片影， \n\
  他們該如何面對眼前這曾經最親密的人？                                   \n\n2006 坎城影展競賽片          \
  \                                \n\n\n^L:5:#,:fri:,#@E,:end:,End#\n\n\n\n佩卓。阿莫多瓦\
  \ Pedro Almodovar         \n\n她有完美肉體，卻被囚禁大宅地窖中。她的皮膚可以感受最細緻的觸摸，但 \n她的存在本身就是一道傷痕。她是整形醫生羅柏的實驗品。十二年前，一場車禍\
  \ \n造成羅柏愛妻體無完膚，此後羅柏潛心研究皮膚培植。卻因一次情不自禁的意外 \n發生，讓秘密從此如揭膚之痛，層層撥開。表與裡，肉身奇觀，那是藝術的極致 \n\
  ，還是怪物的誕生？一刀未減，一絲不掛，揭開秘密膚表，真相疼到骨子裡。   \n\n改編自法國驚悚暢銷小說《狼蛛》，阿莫多瓦籌備近十年時間，火力全開， \n再現早年異端本色，拿手元素一個不缺，性別、亂倫、復仇、家族情仇愛恨，結\
  \ \n合懸疑類型與黑色電影，情節高速翻轉，說故事功力臻至爐火純青。安東尼奧班 \n德拉斯以及伊蓮娜安娜雅再度攜手。薄皮膚，重口味，最表面，才夠深層。    \
  \ \n\n2011 坎城影展競賽片　2012 金球獎最佳外語片提名               \n2012 西班牙奧斯卡哥雅獎最佳女主角、最佳原創音樂、最佳新進演員\n\
