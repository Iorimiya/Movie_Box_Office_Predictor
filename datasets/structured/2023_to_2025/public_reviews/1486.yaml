url: https://www.ptt.cc/bbs/movie/M.1692425816.A.351.html
title: '[普好雷]《我的麻吉4個鬼》，從未離開的愛。'
content: '部落格版：


  先前只看過導演謝沛如執導的短片《雄雞卡克》跟長片《大餓》，以及她共同編劇的作品

  《鱷魚》，評價很好且入圍多項金鐘獎、更讓她奪下迷你劇集/電視電影導演獎肯定的《

  比悲傷更悲傷的故事：影集版》倒是沒看過，不過這也表示早有執導改編影視作品經驗的

  導演謝沛如，這次再度執導同樣改編自2010年韓國經典電影、由車太鉉主演的《開心鬼上

  身》應是駕輕就熟才是。雖然就和《比悲傷更悲傷的故事》一樣，事前並沒有看過原版的

  《開心鬼上身》，但從查到的資料上來看的話，《我的麻吉4個鬼》就故事上是與原版大

  致無異，僅有幾處小地方有進行改動，人物配置上與主要劇情核心都是相同的。也因為沒

  有看過韓國原版，所以這次是抱持著看新作品的角度來觀賞《我的麻吉4個鬼》，就我自

  己的感想是，故事的前半段是有些乏味的，可後半段在情節反轉之後，又意外的讓人很想

  哭。


  「活著哪有不累的？」


  我不是特別喜歡電影中安排的某些笑點與橋段，儘管確實考量到了四個鬼或許已經過世好

  多年，祂們所熟悉的與喜歡的都可能過時或者不在了，例如2009年離世的麥可傑克森、

  1994年倒閉的卡多里樂園，甚至是不再流行的幹話撩妹語錄的被提起與被使用等等，那種

  與電影中其他活著的角色還有觀眾間，因時代隔閡而產生的笑果顯然有限。但幸好的是由

  陸弈靜、蔡嘉茵、張再興跟洪君昊飾演的四個鬼有靠著他們的表演讓這些單聽、單看容易

  尷尬掉的笑點與橋段變得較為自然且有趣，而他們其實頗為本色的演出亦賦予角色相當討

  喜的靈魂，所以即使我對電影裡的笑點與橋段較為無感，還是會一個不小心被四個鬼給逗

  樂。只是另一方面，四個鬼的自然演出就對比出了活人、也就是主角曾敬驊就表演上的不

  夠鬆弛與大方，我能理解一般狀態時大概是角色背景上的設定的關係，但當他在詮釋被四

  個鬼上身時又給人很卡、不夠融入「角色（鬼）」的感覺。



  「心只要還在跳，一切都會好的。」


  回到劇情上來看，其實從阿緯開頭自殺被打斷，還有他過去幾次沒死成的自殺回顧，以及

  後來當他想死又被救活時所說的一番話，就能知道他對活著這件事感到絕望，對未來絲毫

  不抱任何希望，總是只有自己一個人讓他覺得疲憊無助，直到他「死而復生」後變得能看

  到鬼、更為了要擺脫這些鬼而欲幫他們完成生前遺願之後，便能大致猜到《我的麻吉4個

  鬼》主要會圍繞在阿緯的轉變、尤其是心態的變化上轉，想用有著心願未了的四個鬼對人

  生的遺憾來影響並改變阿緯的悲觀想法，試圖教會他可能人生不如意事十常八九，但這些

  不如意終究煩著煩著就會忘記了，於是阿緯如何能從與鬼相處的過程中明白到這點，就成

  了這部電影其中一個重點。而為了達到這個目的，電影自然就會放入最被常使用的情感招

  數，不論是友情、愛情與親情的收穫，都確實的讓阿緯感受到自己是被人在乎著的、被愛

  著的，哪怕最終依然還是會與他人告別，可這份情感會被留下，會成為某種力量讓阿緯能

  夠堅強面對人生。


  若說四個鬼是影響阿緯的主力，那由邵雨薇飾演的筱茵就是助攻、是種催化劑般的存在。

  導演謝沛如將筱茵與阿緯放在一起做了對照，筱茵家人這塊的「有」對照著阿緯的「沒有

  」，筱茵對於家人的「厭煩」對照著阿緯對於家人的「渴望」，同時被保留住的原本設定

  、「努力生活」的筱茵與「拼命想死」的阿緯亦是種對照。而順著劇情發展，阿緯從後來

  失去親人的筱茵身上看到了自己，他能夠感同身受她的複雜情緒，這份共情亦不僅讓他想

  要對她說些安慰的話，也讓他察覺到這其實也是對自己說的話。所以在遇見了祂們和她之

  後，阿緯的轉變看到後來是顯而易見的，即使我認為在某些橋段的安排與處理上是有點粗

  暴的，尤其是筱茵這個角色的登場與後續安排，我認同這個角色存在的必要性，但電影就

  編排上過於理所當然，就是要這樣發展所以就這樣發展了，合理性上就比較沒那麼有說服

  力，例如會接根本談不上認識的男人電話並且還去派出所保他出來，還有讓這個男人躺在

  她胸口上聽心跳等等，就算你說是筱茵同情阿緯也好、是她救人的天職使然也好，我就是

  怎麼看怎麼怪。



  「我們從來都沒有離開啊，在這裡，我們一直都在這裡。」


  不過也誠如前面說的，本部作品的主攻手是四個鬼，所以筱茵這條線至少不要是扣分的就

  好。接著繼續來看四個鬼這條主線，其實有猜想到祂們和阿緯會有著什麼關係，但結果沒

  想到當真相揭曉後那個關係伴隨而來的後座力如此之強，強到後來看著阿緯回想起這些日

  子與鬼們的相處、幫他們實現心願的過程中，祂們許多看似僅是隨口的字字句句，原來都

  在確定了阿緯與祂們的關係後，才發現裡頭蘊藏了多少情感，而這些情感成了祂們放不下

  人世的原因，也是祂們對活著的人最放不下的牽掛。想起前面陸弈靜望著早已癡呆的老友

  ，祂回答著阿緯為什麼不告訴對方自己是誰？祂雲淡風輕的回應著，說已經不在的人就不

  要再和活著的人有什麼牽拖，看似豁達、看似了無牽掛，可到頭來不論是祂還是其他三個

  ，都還是掛記著被留下來的阿緯，買菜挑魚的重點、卡多里樂園玩的約定、六合彩獎金要

  讓孫子娶妻的允諾、學習游泳的重點...，都隨著一捆捆仙草乾被熬煮成了燒仙草後做成

  仙草凍，滿滿都是愛。


  《我的麻吉4個鬼》是倒吃甘蔗型的，倒也不是說因為有後面的反轉才讓觀眾嚐到甜味，

  而是相比後半段、前半段稍嫌雜亂，某部分是節奏過快，感覺省略了很多部分造成劇情很

  跳的錯覺，電影太快的想要塞入然後確立一段關係，不論是四個鬼與阿緯或是筱茵與阿緯

  、甚至筱茵與哥哥都是，給不夠時間去接受電影中角色們對「被闖入生活」的反應與適應

  。但姑且不論筱茵這條線，若要說四個鬼與阿緯的交代曖昧都是為了後面的反轉力道，那

  我倒是可以接受，畢竟確實這個反轉威力是真的不小。最後提到曾敬驊的演技，不是沒有

  看過他其他作品的表演，只是不曉得為什麼他在《我的麻吉4個鬼》中的表現給人種很悶

  、被悶住的感覺，這就不是指阿緯這個角色的陰沈設定，而是在詮釋五個從年紀、性別到

  個性都不同的角色時不夠俐落分明，雖然我沒有看過《開心鬼上身》但卻可以想像車太鉉

  分飾五角的狀態，在我這裡曾敬驊是稍微可惜的，但我依然相信曾敬驊會是台灣影視圈新

  生代很有潛力的一位。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
