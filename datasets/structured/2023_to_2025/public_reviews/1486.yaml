url: https://www.ptt.cc/bbs/movie/M.1693196534.A.134.html
title: '[好雷] 我的麻吉4個鬼'
content: '雷文防雷資訊頁








  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~








  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  因為很喜歡邵雨薇所以剛上映就跑來看了

  這部是改編 2010 年金英卓執導的韓國電影開心鬼上身，

  所以在上映前有先去看了這部

  開心鬼上身最後的反轉結局超級催淚

  讓人不禁好奇台版的會改編成什麼樣子

  而且改版的通常很難超越原版

  小小期望台版的能夠超越原作！


  實際看了之後發現兩版劇情差不了多少

  較不一樣的就是女主角的家庭背景

  因年幼母親生病過世與哥哥經常在外闖禍等家庭因素下

  讓女主角逐漸養成獨立自主的個性


  男女主角在劇中都表現得很好

  但個人認為整部最加分的還是飾演鬼的4位演員

  每個都表現出各自的角色特色

  替整部劇增添不少的歡笑聲


  雖然台版與原作劇情相差無幾缺少了一點新意

  但在劇中還是有演繹出台灣特有的「台味」

  也算是一部很不錯的電影


  --

  對阿

  我覺得沒有到太牽強

  會嗎XD

  只能希望再進步摟'
