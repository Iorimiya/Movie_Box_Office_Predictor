url: https://www.ptt.cc/bbs/movie/M.1693066787.A.96C.html
title: '[好無雷] 我的麻吉4個鬼'
content: '「我的麻吉4個鬼」改編自韓國電影「開心鬼上身」，

  描述對生活失去希望、意圖了結生命的主角阿緯在瀕死之後獲得看見鬼的能力，

  進而引發了一連串的故事。


  這部片雖然有鬼，但一點也不恐怖，而是溫馨感人的喜劇片。

  結局時電影院內傳出不少人抽面紙拭淚窸窸窣窣的聲音。

  即使我在看預告片時就被評論暴雷了，也還是被劇情感染、跟著掉眼淚。


  演員表現也都不錯，包括第一次演大銀幕的坤達，基本上都不會有讓人出戲的感覺。

  想特別提一下主角曾敬驊，我一直很喜歡他的眼神戲。

  這次挑戰喜劇+鬼上身，在台詞跟動作方面還有進步空間，但他的眼神轉換我覺得是

  可圈可點的。


  我看完台版之後才去看了韓版，在韓版優秀的劇本基礎下，我覺得台版是很成功的改編。

  台版加入台灣的風土人情之後更容易讓人融入故事的情境，更容易產生感情上的連結。

  在我今年看過的國片之中是最推薦的一部。



  --'
