url: https://www.ptt.cc/bbs/movie/M.1692107607.A.4BD.html
title: '[無雷] 《我的麻吉4個鬼》翻拍片?善良執念清創師'
content: "電影首映不搭餐？  \n\n《我的麻吉4個鬼》翻拍片？破億片！善良執念清創師？比關於鬼更關於鬼的那件事！\n\n█比雖小更雖小的故事？死不了的地獄倒楣鬼！\n\
  \n如果你才剛看過九把刀的最新電影，然後你一個笑點也笑不出來，歡迎你來看這部《我的\n麻吉4個鬼》，因為我直接笑到嘴角合不起來～\n\n明明就是臭宅男＋臭直男＋小屁孩的電影，怎麼因為變成「鬼片」就變得這麼好看，那什\n\
  麼五貼騎機車、無敵風火輪的港片笑點，結果還給我在街頭直接上演《速命道》。\n\n笑點又中二又過時，但是放在這部電影裡面就是剛剛好，那撩妹幹話語錄和麥可傑克森，\n\
  老派到編劇至少40+以上，還有電子雞和卡多里，就連六合彩都跑出來，現在的弟弟妹妹\n一定沒聽過也沒看過，但是也全都心甘情願地笑出來。\n\n其實原因很簡單，因為這部電影是鬼片喜劇，所以所有不合理都變得合理，生前的所有執\n\
  念都變成遺願，然後才能一個笑點接著一個笑點，而且就算過時也都沒有關係。\n\n電影開場我還以為是一部沉重的電影，結果片頭一下去，鬼片直接變成賀歲片，想不到都\n\
  農曆七月了還有賀歲電影，是誰規定鬼月看鬼片就要把自己嚇個半死，今年我就是要看這\n一部鬼片喜劇賀歲大片！\n\n曾敬驊犧牲色相比地獄倒楣鬼還要倒楣，要死要活連自己都不能夠決定，如果你覺得蒲一\n\
  永太過厭世，許辰緯不只厭世還直接厭世到想要離開人世，然後你的情緒起伏也跟著他七\n上八下。\n\n一下大哭、一下大笑\n一下又大哭、一下又大笑\n就這樣一不小心就看完電影～\n\
  還差點被曾敬驊和謝沛如玩死掉～～\n\n\n█比大餓更大餓的故事？餓不死的老菜脯雞湯！\n\n如果你人都看到這裡，還覺得前面兩千多字的影評，都像是收了錢的廣告在「業配」，那\n\
  麼我要直接告訴你，接下來我終於要開始來抱怨了…\n\n我就問這部電影的編劇和攝影，你們的良心是不是被拿去包紅豆餅，看完電影我不只想要\n吃紅豆餅的紅豆，還想要吃加入玉米粉的仙草奶凍！\n\
  \n又不是大過年的，誰准你們直接在大銀幕圍爐，老菜脯雞湯、金瓜炒米粉，再來一個元寶\n，飯後甜點是仙草奶凍，然後你的杯子蛋糕要不要吃？我可以幫你把它給吃掉～\n\
  \n這什麼比《大餓》還大餓的電影，這部電影乾脆把《女孩上場》拍成了美食登場，倒是贊\n助商的生活飲料，只有背景一點點糊掉的焦，你們確定這樣真的可以跟廠商交代嗎？\n\
  \n雖然我確實看得很爽，餓到還差點偷喝隔壁座位的手搖飲料，看完電影就開始一直在找，\n哪裡還有在賣仙草？最好還有小貓咪圖案和愛心圖案，麻煩知道的留言肉搜刷一波，我一\n\
  定會直接衝到你們家店門口。\n\n國片電影有美食符號很正常，但是搞到害觀眾餓到不行就是你們的錯，麻煩你們準備好在\n手搖店門口發送仙草飲料，因為你們票房破億慶功時絕對會用得到！\n\
  \n\n█比家人更家人的故事？趕不走的麻吉4個鬼！\n\n電影劇情反轉很正常，但是我從來沒看過一部電影才剛開場，就直接給觀眾第一次反轉，\n後面又反轉又反轉又反轉，反轉到我眼淚原本只是在眼眶裡打轉，結果最後卻不爭氣的一\n\
  直掉…\n\n我知道映後導演有特別交代，拜託大家不要爆雷結局，但是我就是「忍不住」！原本我以\n為這只是有鬼的《不良執念清除師》，沒想到原來還是一部《關於我和鬼變成家人的那件\n\
  事》。\n\n親情、友情、愛情全都有，喜劇開場、悲劇反轉，最後還有讓人忍不住想要二刷的Happy\nEnding，就連電影主題曲下歌的時間點也剛剛好，片尾之後還有彩蛋不放人去尿尿。\n\
  \n國片電影開紅盤，本來就不是「奇蹟」，一直以來都有固定公式可循，然後這部電影票房\n破億，本來就是遲早的事。\n\n翻拍韓國電影又怎樣？還要加進大量台灣本土味才最對味，笑點剛剛好、哭點剛剛好、劇\n\
  情很簡單、結局很變態，輕鬆看完電影後，也沒有任何人會覺得被冒犯。\n\n又有鮮肉男神曾敬驊，還有不老男神謝坤達，你老婆柯佳嬿的《想見你》電影版，票房都\n可以破億了，為什麼這部電影會不能破億？\n\
  \n\n▲觀影後~不專業電影評價：【9.2∕10分】\n\n\n\n\n\n\n--"
