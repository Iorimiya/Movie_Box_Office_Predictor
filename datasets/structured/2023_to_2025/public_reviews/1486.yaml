url: https://www.ptt.cc/bbs/movie/M.1704093915.A.5A5.html
title: '[普好雷] 我的麻吉4個鬼～可以再更好'
content: '這部劇情結構表現上，前面越是輕鬆搞笑，

  最後真相揭曉製造出反差就越顯得感人，

  沒看過韓版，我覺得台版真的太可惜了，

  首先，前面輕鬆搞笑不足不夠好笑甚至

  有點鬆散、曾經是家人的線索太少了、

  4個鬼不像一家人，前面做足後面反轉才會

  更震撼後座力更強，不過即使如此後面回想

  還是蠻感人的(所以更是惋惜覺得可以更好)

  原來阿緯自殺一直失敗是因為4個鬼阻撓QQ



  再來是一些個人的隨機吐槽


  我超討厭爸爸鬼那種演法和氣口，

  奶奶鬼中獎的彩券藏在朋友的老菜埔裡？

  跟阿西之間的對話是要表達什麼？

  哥哥鬼徒手挖車輪餅攤的餡有夠噁，

  媽媽鬼為何老是要躲起來哭，

  阿緯演技不夠外放，鬼上身應該要演得

  更誇張才對，畢竟前半段是喜劇

  筱茵的手足戲在哥哥是因為欠債被砍死

  的設定之下顯得沒這麼感人欸…


  愛情線編排的不是很好，阿緯筱茵的互動

  對於沒有上帝視角的筱茵來說只會覺得

  莫名其妙，不足以累積這麼多好感才對，

  還讓他聽心跳整個超詭異，而且對方還會

  去墓地堵你欸...痾...



  就是這樣摟～只能給普好雷



  --'
