content: "本文涉及劇情，推薦觀影後再讀。\n\n\n\n　　　　圖文網頁版：\n\n　　　　\n\n\n　　　　預告片：\n\n　　　　\n\n\n\n\n\
  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\n\n是陪伴，也是糾纏：《我的麻吉4個鬼》\n\
  \n\n\n　　《我的麻吉４個鬼》改編自２０１０年韓國電影《開心鬼上身》，敘述\n\n原本預定自殺的地獄倒楣男許辰緯（曾敬驊飾），試了２１次終究失敗之後，\n\n\
  竟然開始被鬼纏身，為了送走這四隻任意占用他身體的鬼，許辰緯不得不一\n\n一完成他們的願望，再完成自己最後的解脫。\n\n\n\n　　這部電影同時具有笑點和哭點。笑點在於「附身」或「控制」後，原本\n\
  \n內向的許辰緯，做出原本不會做的事、說出原本不會說的話，與他身邊的\n\n「鬼」形成對照，違背心意卻無法抗拒的反差都相當有趣。四個鬼的個性分\n\n明，喜好各異，一人分飾五角的曾敬驊，展現了演技的高度功力與喜劇的荒\n\
  \n謬趣味。原本以為在一一完成願望的同時，許辰緯也會體驗他們的生命歷程，\n\n在擴展經驗的同時產生活下去的動力，尤其在他險些自殺成功，被救護員余\n\n筱茵（邵雨薇飾）救回來後，經由一連串巧合與因緣，讓他逐漸有了與他人\n\
  \n建立連結的希冀。\n\n\n\n　　特別的是，這四個鬼想要完成的願望、附身後所做的事，都相當的生活\n\n化，他們看似互不相識，但在「拯救／協助阿緯」這件事上，卻又團結合作，\n\
  \n有著無以倫比的共識，對阿緯這個「共用身體」的夥伴十分關心。而阿緯與\n\n「鬼麻吉」接觸時從畏縮膽怯到熟悉慣習（這裡有你們在，當然陰森森的啊）\n\n的轉變，有時又呈現像孩童一樣純粹、彷彿未經社會化的善意，都讓「鬼」\n\
  \n故事行進時多了一份溫柔（我特別喜歡阿緯兩次把鬼羞女（蔡嘉茵飾）從櫃\n\n子帶出來的互動，口吻的變化亦有把當下的自己帶出來的象徵），同時也產\n\n生微妙的矛盾感──直到阿緯發現了真相。\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n　\n\n　　（以下再次提醒有重雷，推薦觀影後再讀）\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n　　當年的車禍奪走了阿緯的家人、記憶，在他的右額留下必須遮掩的疤痕。\n\n失去了無條件被愛的記憶，讓獨立後一直獨自生活的阿緯始終缺乏自信，不\n\
  \n知如何與人相處，只能埋頭努力。因此當他被老闆騙走存款，落得一無所有\n\n後，決定走上絕路，卻也因此絕處逢生，看見了始終在他身邊陪伴的家人，\n\n更在這段時間，重歷了被命運奪走的成長時光：無論是陪阿嬤（陸弈靜飾）\n\
  \n領回逾期二十二年的獎券，還差點為「逗陣仔」和「緣投仔」（陳博正飾）\n\n重新牽線（愛與思念不會逾期），和哥哥（洪君昊飾）去卡多多樂園玩與夾\n\n電子雞，和爸爸（張再興飾）在車上抽一根菸，去海邊學游泳排解抑鬱，以\n\
  \n及和媽媽做蛋糕過生日、煮一餐飯，和最愛的家人平凡的度過一天……\n\n\n\n　　原以為只會是橫向的經驗擴展（聯誼詐欺、偷車與飛車逃逸、跟警察\n\n「談判」，和與筱茵建立情誼），事實上更多的是縱向的成長歷程，這些家\n\
  \n人的「願望」既是兌現未完的承諾，更是協助阿緯擁有獨立生存的能力，和\n\n面對挫折仍能堅持前進的心智，讓觀眾也跟著四個鬼，陪伴阿緯延續斷掉的\n\n家庭時光。其中最先觸動我的是坐在父親的車上，父親勸他「想不通的事也\n\
  \n沒關係！時間久了就會……想不起來」，阿緯像青春期少年般彆扭說「哪有\n\n你說得那麼容易啊」，卻在學會游泳，也學會如何在水面上放鬆身體，回程\n\n打開車窗抓著流動的風，覺得煩惱彷彿可以隨之而逝的情節，相信是很多青\n\
  \n少年與親人長輩有過的「談心」經驗吧。\n\n\n\n　　但有家人陪伴不盡然美好，父母的經驗往往未必適合子女，家人教阿緯\n\n「追女朋友」的方式，可以清楚看到二十二年來時代的進步：過去如總裁般\n\
  \n的霸道手法，如今看來滿滿的尷尬與地雷（回想起來，爸爸可能就是這樣追\n\n到害羞感性的媽媽的吧）；「為他好」但選擇隱瞞甚至欺騙的善意，輕忽了\n\n對方實想彌補失親遺憾的傷痛與真實意願，都呈現台灣家庭表達愛的慣性思\n\
  \n維與常見衝突。而當出了錯，筱茵留下電子雞拂袖而去，家人還裝沒事般要\n\n大家一起吃飯時，阿緯又多了新手聽從家人建議，結果卻弄巧成拙、事與願\n\n違的經驗，說出「拜託你們，趕快消失，我要死要活都跟你們無關」的氣話。\n\
  \n在為這一家人哭笑不得的過程裡，也會喚醒過去相關的回憶，那些過去勉強\n\n和好的，彷彿在此刻得到了理解：父母的愛，和子女各種初體驗一樣笨拙，\n\n但就是要經歷過這些磨擦與衝突，自小失去家人的許辰緯，才能約略明白筱\n\
  \n茵說「不想要這種家人」與反擊的怨怒，和他對親情的渴望一樣真實並存。\n\n\n\n　　亦即片中與鬼的衝突，也是與家人的衝突：關心而負累，磨合卻難以溝\n\n\
  通，個體之間存在無法理解的距離，卻因為是「家人」而產生過多的期待與\n\n干涉、侵擾與傷害，因為甩不開而煩躁的同時，又不知不覺受到影響。在幫\n\n家人完成願望的同時，許辰緯也在完成自己的願望，當四個鬼都消失，他對\n\
  \n筱茵說他們很「煩」，因為仙草凍逐漸喚醒回憶、察覺心有缺損的歷程，反\n\n映出親情的特質兼具深刻與寬廣的包容，以及窄仄而深銳的殘忍──亦和筱\n\n茵與哥哥余景天（謝坤達飾）的關係、最後要他「消失」的願望應驗相似：\n\
  \n明明因為哥哥無法擁有更好的未來、生活缺乏安全感，甚至在他人面前失去\n\n尊嚴，卻因為只有親人甩脫不掉那份依賴和情誼，以致愛怨交織，糾纏難解。\n\n\n\n\
  　　《我的麻吉4個鬼》裡闡述了家人的存在與我們密切相繫，是陪伴也是\n\n糾纏；看似幫忙卻又扯後腿，關心卻又照顧不到真正的需求，反而帶來更多\n\n麻煩。故事雖然最後才揭曉謎底，但仍有許多細節看到一家人的痕跡：阿嬤\n\
  \n堅持要取回獎金好為孫子將來「娶水某」的笑意，以及和「哥哥」的祖孫鬥\n\n嘴始終如一。年輕的媽媽保有少女的氣質（第一次看在猜他們是阿緯的家人\n\n時還以為是姐姐），對不幸的真誠同情，和阿緯的善感溫柔互為對映；全家\n\
  \n吐嘈爸爸終於上計程車時的緩頰與笑意，洩露夫妻間的默契；「今天就是你\n\n的生日」的祝賀，更是只有「媽媽」才能給予的祝福。「哥哥」不改哥哥的\n\n神氣，以及跟爸爸相似的臭屁，「許辰緯，你知道如果電子雞死了，會有什\n\
  \n麼後果嗎？」「會被哥哥揍。」的對答，以及票券被搶走，承諾「沒關係，\n\n哥哥下次帶你去」和實現時「你看不起我是鬼嗎？帶我來這種鬼地方」，看\n\n似任性實則在完成承諾（同時隱瞞真相），是與余家兄妹似異實同、而且更\n\
  \n為成熟的手足之情。而爸爸在計程車外踟躕良久，許辰緯說「反正做不到的\n\n事有很多，如果下輩子可以活得有用一點就好了」，點了菸讓爸爸漸漸想開，\n\n克服當初車禍的陰影重新上路，對照他對阿緯說「吃飯會噎到，喝水會嗆到，\n\
  \n難道就不吃不喝」，展現了面對挫折的身教，都是我相當喜歡的細膩段落。\n\n\n\n　　「那麼痛苦的事，想不起來也沒關係。」許家人不願阿緯回憶過去而自\n\n\
  責，卻正是因為記憶裡的溫暖與痛苦，才成為存在與成長的養份來源，讓人\n\n在摸索中尋找前進的動力。與深愛的家人好好道別，有過成長記憶，也與\n\n人／鬼建立連結的許辰緯，儘管遺憾除了堅持求死外看不到他如何梳理生命\n\
  \n裡的結，以及與過去的自我否定和解，但「家人是依靠，沒有家人，自己就\n\n是自己的依靠」，「這次是我叫醒自己的，我想再試著活下去」，對生命也\n\n就有了新的理解與勇氣：不再一味依賴外在的給予，把對愛的渴求化為自愛；\n\
  \n即使難免處在自我的地獄，現下看似絕境，努力過的一切暫時沒有回音，或\n\n許在下一秒仰首，或再往前一步，別人看似不需要、不重要的，也可能成為\n\n讓人願意再往前試試看的動力，進而與下一刻等待你的機會相遇。\n\
  \n\n\n　　《我的麻吉４個鬼》展現了愛的複雜與不易，卻也讓我們體會到孤獨未\n\n必真正寂寞，關懷有時隱而不見但仍真實存在。願所有在孤獨裡努力的人，\n\n\
  都能在每一次徬徨時，選擇認同自己存在的價值。\n\n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\
  \n                                  陳斐雯  貓蚤札（其三）\n\n--"
