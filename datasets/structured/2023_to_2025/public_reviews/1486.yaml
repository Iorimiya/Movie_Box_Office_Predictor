url: https://www.ptt.cc/bbs/movie/M.1692717394.A.BDC.html
title: '[好無雷] 我的麻吉4個鬼'
content: "雖有韓版珠玉在前，但我認為台版的改編也相當有水平\n在不大改原版主線之下，增添了許多有臺灣味的喜劇元素\n看了真的會讓人發出會心一笑！\n\n\
  演員部份主角肯定比不上演技爐火純青的車太炫，\n但我們自家的新生代演員演技也很靈動，有幾場的表現更讓人眼前一亮！\n其他演員也都各有特色，大飆演技！\n看完之後劇情和人物都有滿滿的記憶點！\n\
  \n不論有沒有看過原版，這部都是適合帶全家一起進戲院觀賞的好片！\n如果你不知道本片最大雷，請務必不看任何電影介紹，\n速速進戲院感受原汁原味的情緒大轉折！\n\
  \n如果你已看過原版或知曉本片最大雷，那麼你應該會和我一樣更早就開始感動，\n為主角阿緯無形中錯失的“天賜良機”而哭！\n\n韓版有韓版的悲的極致，台版的有喜劇堆疊出的情緒張力\n\
  因為看過原版而先入為主認為這版必然比不上原版的無形中會錯過一部好劇！\n就像金庸的武俠小說拍過這麼多版本，也都各有各的好一樣，\n難道因為知道這些小說結局就不看任何一版電視或電影了嗎?\n\
  \n另外，這四個鬼真的不可怕不可怕不可怕！完全不是那種為嚇人而嚇人的鬼片\n很適合帶一家老小去看， 我看的那場旁邊一對白髮皤皤的老夫妻就頻頻感動拭淚！\n難得有部國片就是講述平平凡凡的人間真情，\n\
  不帶什麼政治正確的議題，也不硬塞很多尷尬的劇情\n\n真心希望人人都能進戲院欣賞這部好劇， 並珍惜身畔有親友相陪的每一刻！\n\n\n--\nMeet→Met→Metby\
  \ elytseerf\n             同樣是相遇，也有各種不同的形式的。\n             每一種都很美好，很自然的話，〝分離〞也會等比例變化。\n\
  \n             我覺得Good-Bye不如See You Again更得我心。\n　       　　          　　　　　　　　　　　　　　　Takuya\
  \ ． K\n\n--"
