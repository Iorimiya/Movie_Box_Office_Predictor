title: '[好雷] 我的麻吉4個鬼 好評終於沒騙人 '
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n說真的啦，版上國片一堆好雷\n常常進去就發現很難看\n\n\
  這部沒騙人  真的好看\n可能是因為翻拍的關係(?)\n\n\n\n首先一定要稱讚的是 沒去綁一堆價值觀\n像我看鬼家人算是支持同性戀議題\n但不代表我支持其他議題欸\n\
  很多國片都要這樣塞同捆大禮包幹嘛\n\n\n這片就是很乾淨的說一個故事\n沒有教育 沒有價值觀洗腦\n\n\n\n裡面選角演技都在線\n不尷尬\n劇情順暢，雖然中間有點覺得怎麼鬆散鬆散\n\
  看到結局卻恍然大悟很感動\n\n\n4個鬼的心願看到一半想說這麼簡單是怎樣\n怎麼沒有後續\n看到最後才發現4個鬼的心願不是他們的心願\n是主角的心願\n\n\
  我有哭\n聽起來後面也有哭\n\n\n我也好想聽邵雨薇的心跳喔\n\n\n--\n\n         \n         \n              \
  \                                      by ckshchen\n\n--"
