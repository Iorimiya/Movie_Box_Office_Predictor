title: '[好無雷] 我的麻吉4個鬼'
content: '我沒有看過韓版，但之前已被網友的留言爆雷，即便如此還是哭到口罩微濕。


  前半部的喜劇中規中矩，笑點不算是很密集，有幾個點會噗哧出來，但不是笑出腹肌型的，鋪陳有些地方稍微悶一點（聽說原版也是前面比較平）；後面轉折開始就一直流淚了，即便已知結局，還是忍不住會哭。

  這部演員的演技都有一定水準，沒什麼尷尬的情況，男主偶爾會有蒲一永的感覺（但不多），整體發揮很不錯，幾個需要切換的點都可以讓人get到，甚至最後一段就是先被男主的表情變化戳到開始哭，潛力可期；女主比較少看她演戲，在這部表現不會出戲，蠻ok的；其他配角也都不錯，不過小朋友好像稍微尬了一點。

  台灣影視常被詬病的台詞口條問題，還是在一些小地方存在啦但不多，仍可以忽略或是比較順的看過去。

  本劇整體而言有哭有笑，演員表演不錯，值得一看。


  --'
