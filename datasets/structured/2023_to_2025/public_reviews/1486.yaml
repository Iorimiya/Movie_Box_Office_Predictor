url: https://www.ptt.cc/bbs/movie/M.1692788942.A.BAB.html
title: '[好雷] 韓片改編的《我的麻吉4個鬼》好看嗎'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  最近上映的《我的麻吉四個鬼》

  我光看預告就有猜到應該是改編自韓國的《開心鬼上身》


  當年車太鉉說服力超強的演技可是把我弄得哭到不行...

  本來是有猶豫一下想說台灣有可能拍得比韓版更好嗎？

  （畢竟這部真的算是很經典了）

  但既然有《當男人戀愛時》這種成功的改編作在前

  我還是有進戲院看一下～


  先說結論，雖然故事概念、走向都跟韓版差不多

  但劇情細節上加入了很多台灣的元素

  像是彩券、仙草、宮廟問事...之類的片段都有濃濃台味

  沒看過韓版的應該會覺得 這完全就是台灣本土故事啊哈哈

  在很多小細節處也有一些不錯的小巧思

  有讓人看出製作和編導的用心 整體而言算是一部不錯的改編了

  至少有讓我一個已經知道結局的觀眾哭出來

  而且還是哭得滿慘：）


  但有一兩個點還是稍嫌可惜...

  像是男女主角的感情線有點來得太突然

  女主角太過倉促的愛上阿緯 有點淪為推動劇情的工具

  但是我認可編導在這點上的努力

  因為韓版的女生戲份真的比較少一點

  這個角色加上了有一個軟爛哥哥這個設定

  變得更有血有肉、有記憶點

  邵雨薇這次的表演也有嚇到我 原來算是滿會演的耶

  眼淚說掉就掉Q__Q（坤達就...還好...）

  我之前真的一部她的作品都沒看過

  只知道她是吳慷仁的女朋友XD

  這次有點被圈粉...怎麼有人可以扮天使毫無違和啦！


  另外一個跟韓版比較不一樣的地方

  就是台版的男主角比起韓版

  在劇情上更去凸顯他雖然軟爛、與世隔絕

  但始終天真善良的本性

  雖然這種善良有時候有點白目

  例如他去消防局勸兩兄妹的架那邊

  如果我是邵雨薇我真的會氣死哈哈哈哈哈哈

  可是不曉得是曾敬驊太帥還是怎樣

  就還是沒辦法對這個角色生氣哈哈哈

  真的善良到讓人覺得死掉會很可惜

  我覺得這點是不錯的改編！


  四個鬼的部分也都很還原韓版設定

  包括經典的背鬼上街這段也有還原！


  唯一的不同就是色爺爺變成了陸弈靜飾演的吵鬧老奶奶

  我個人是很愛這個改變啦

  因為台灣人應該都有一段共同的記憶

  就是總是喋喋不休的奶奶了吧（？）


  （四色鬼一字排開有點可愛XD）

  肯定很多人覺得台版沒有比韓版更好看

  畢竟原作真的很難超越！

  但我心得越打越覺得 其實可以說是各有千秋啦～

  即使已經看過韓版還是可以去看看台版

  試看看自己有多愛哭哈哈哈


  --'
