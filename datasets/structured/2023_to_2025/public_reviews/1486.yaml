url: https://www.ptt.cc/bbs/movie/M.1693840192.A.BC1.html
title: '[普負雷] 我的麻吉4個鬼'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  《我的麻吉4個鬼》給我的感想就是


  前面好無聊  該搞笑的部分也不太好笑(我幾乎全場嘴角沒動)


  對白也都是很流水帳式的  好像演舞台劇一樣

  (好討厭那個鬼小孩  有夠煩)


  最後大翻轉的部分才開始好看  也微微讓人感動



  我看影評大多是說改編的不錯  但我也沒看過原版韓版無從比較


  跟同行友人一致覺得不好看  他還氣到覺得浪費錢


  如果沒有最後的翻轉我應該會給負雷


  不過男主角的演技不錯  只是口白太多  後面聽到會有點膩


  還有坤達的演技還是一樣爛  他跟女主角的兄妹情完全無感


  --'
