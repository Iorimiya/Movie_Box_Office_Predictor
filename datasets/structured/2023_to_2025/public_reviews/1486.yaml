content: '明天剛好有空想去支持一下國片


  目前有興趣的有查無此心與我的麻吉4個鬼，兩者爬文看評價都不錯


  查無此心，犯罪懸疑，評價數好像稍微高一點


  我的麻吉4個鬼，溫馨喜劇，不過好像快下檔了


  很猶豫要看哪部，還請板友們推薦，謝謝


  --

  沒有人陪，我都喜歡自己一個人看電影xd

  國片的話要有興趣的題材才會看，不過每年應該也會看個一兩部

  其實有一點點私心比較想看四個鬼> <

  原本只有一部預算，看大家這麼推查無此心就都看好了xd

  這樣感覺很可以期待(?'
