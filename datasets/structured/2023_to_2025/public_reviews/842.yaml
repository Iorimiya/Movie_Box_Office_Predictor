title: '[新聞] <金孫>阿嬤溫暖獻「聲」<跳越時空的愛戀>'
content: '新聞網址：



  勇奪泰國電影新片票房冠軍，並獲泰國文化部認證「軟實力計畫資助電影」之一的年度鉅

  片《跳越時空的愛戀》，即將在本週三（8/28）於台灣感動獻映。本片由突破七億次觀看

  夯劇《粉紅理論》國際巨星FreenBecky首度共同主演，兩人將在片中穿越多個不同平行世

  界，上演時而甜蜜、時而淒美的戀情。尤其角色穿越至二戰平行時空之後，身分成為了女

  軍官與戲曲演員；FreenBecky甚至因為戰爭的故事背景，在開拍前進行嚴格的動作與武藝

  訓練，甚至是持槍技巧，對她們來說都是全新嘗試，動作指導更對兩人的學習能力與進步

  速度讚譽有佳。值得一提的是，片中還將有角色年老後的時空場面，為了呈現出角色年邁

  的嗓音，劇組特別請來以電影《金孫爆富攻略》獲得「國民阿嬤」美譽的烏薩薩梅坎姆（

  Usha Seamkhum）驚喜獻「聲」，成為影迷又一熱議焦點。





  《跳越時空的愛戀》是泰國影史首部集結愛情、友情、平行世界的奇幻愛情催淚強片，不

  僅勇奪泰國電影新片票房冠軍，更透過震撼不已的絕美畫面，引領觀眾潛入海洋深處，再

  跨越數十億公里到達宇宙盡頭。尤其故事還將讓主角穿越到各個平行世界，試圖尋覓那可

  能將要遺失的愛戀，兩位女主角FreenBecky也將在這個平行時空，化身成戲曲演員與女軍

  官，再度上演刻骨銘心的愛戀。也因為二戰那風聲鶴唳的緊張時代背景，兩人將有許多驚

  險刺激的槍戰與動作場面。製作團隊為此詳細研究當年泰國在二戰期間，使用的是什麼樣

  的刀、槍與炸藥，以及當年的警察與軍隊是長什麼模樣。FreenBecky更為此進行嚴密的動

  作與武藝訓練，以及持槍技巧，讓Freen直呼：「感覺一切都很新鮮。」Becky也表示：「

  自己雖然有練拳擊，但拍攝的時候還是不太一樣，因為要小心不要傷害到別人，我覺得一

  切都超酷的。」



  本片除了槍戰之外，還有爆破場面，Becky的軍官角色必需在樹林中奔跑，以躲避爆破造

  成的傷害，讓她直呼：「沒有想到這麼難，因為在泥濘的地方是很難跑步的，還要從煙霧

  中衝出去。當我從裡面跑出來的時候，我整個臉都黑掉了。」不過她也坦言：「希望大家

  可以看到我的另一面，因為在眾人眼中，感覺我看起來嬌小又脆弱，甚至會被細心呵護，

  不過在這部電影的動作場面當中，我都是全力以赴。」這也讓本片的動作指導對兩人比讚

  ：「她們有很棒的意志力與舞蹈能力，以及運動技能，以至於她們進步得非常迅速。」





  值得一提的是，《跳越時空的愛戀》除了現實世界之外，還將呈現過去與未來不同的時空

  場面，演員也將挑戰為角色老年的模樣畫老妝。為了呈現角色年邁的嗓音，劇組特別邀請

  到在全球各地創下票房佳績、全球票房已經突破14億泰銖的《金孫爆富攻略》、片中飾演

  阿嬤的「Taew」烏薩薩梅坎姆擔任角色配音。素人演員的她，這是第二份電影工作，也是

  首度擔任配音工作，將透過溫潤的聲音，在觀眾心中烙印深刻的回憶，值得觀眾進戲院一

  「聽」究竟。



  這部由國際巨星「FreenBecky」領銜主演的泰國年度史詩級電影鉅製《跳越時空的愛戀》

  ，即將在本週三（8/28）於台灣感動獻映。只要購買第一週（8/28-9/5）期間場次電影票

  乙張，即有機會獲得「A3電影主視覺原文海報」乙張，數量有限，送完為止，請務必把握

  領取機會。本片劇情描述琳（Freen飾演）和凱斯（Becky飾演）從朋友發展成戀人關係，

  琳夢想成為太空人，而凱斯則夢想打破自由潛水世界紀錄。當琳終於成為太空人，凱斯卻

  消失在深海之中，再也沒有回來，讓琳的餘生都陷入在痛苦之中。某日，琳執行太空任務

  ，但太空船卻陷入巨大的太陽風暴當中，甚至切斷了她與地球的聯繫。她認為這可能是她

  生命中的最後一刻了，這時，某種形式的能量突然帶走她的靈魂，將她傳送到與凱斯多個

  不同的平行世界當中。兩人在平行世界裡跨越不同時代，都相互愛上彼此，只不過最終都

  無法改變悲痛的結局。儘管如此，她仍堅持追求一個可以跟凱絲珍惜彼此的世界，不必再

  忍受著別離的痛苦…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
