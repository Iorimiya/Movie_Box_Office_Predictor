title: '[新聞] 【跳越時空的愛戀】締造泰國影史多項驕傲'
content: '新聞網址：



  備受影迷期待，由突破七億次觀看夯劇《粉紅理論》國際巨星「FreenBecky」共同主演的

  泰國年度史詩級電影鉅製《跳越時空的愛戀》，即將在8月28日（週三）於台灣感動獻映

  。本片是泰國影史首部集結愛情、友情、平行世界的奇幻愛情催淚強片，更是泰國文化部

  認證「軟實力計畫資助電影」的其中之一。透過製作團隊強大的野心，並斥資6000萬泰銖

  製作預算，打造出這部讓泰國影壇為之驕傲的影史嶄新篇章。本片也無愧多項「泰國影史

  首次」美名，從前製、拍攝直到上映，都一直備受泰國人民關注。光是泰國日前曝光的「

  概念微電影」就在影音平台上勇破200萬觀賞人次，展現強大的話題性，更獲得全球觀眾

  高度詢問，讓電影的國際版權熱銷多國。直到電影正式在泰國上映，更勇奪泰國電影新片

  票房冠軍，絕對是台灣觀眾的年度必看之作。





  《跳越時空的愛戀》靈感源於一本名叫《即使NASA也無法把你帶回來》的小說，是透過一

  位年輕電影製作者所敘述的愛情作品。製作團隊首先被書名吸引，認為書名既浪漫又充滿

  戲劇性，便決定透過在NASA行星探索的背景下，打造出一部關於愛情、尋覓、等待，以及

  如何讓心愛之人重返自己身邊的電影。故事展開於一個人回家後，發現了一張家庭照片，

  進而展開後續的故事。之後很快地，將陸續出現時空旅行和平行時空元素，而劇情也將圍

  繞在等待和尋找家人及摯愛，並用奇幻電影的元素去串聯整部電影。導演塔納頓努安蘇特

  （Thanadol Nualsuth）表示：「本片靈感來自世界各地和我親眼目睹的許多真實事件，

  有些事件甚至挑起了我的內心感受。經過深思熟慮，讓我提出一個想要傳遞的重要訊息：

  『如果至親至愛的人，某天離開了我們這群還活著的人，那他們會以什麼樣的形式繼續生

  活？』」



  作為泰國影史充滿挑戰與史詩氛圍的製作專案，本片也將透過震撼不已的聲光與視覺效果

  ，引領觀眾潛入海洋深處，再跨越數十億公里到達宇宙盡頭與平行世界！尤其本片是泰國

  影史首部探觸太空領域的電影，製作團隊更與「Space TH」合作，深入研究過去、近期和

  預計在未來會出現的太空事件，力求呈現最真實的細節。團隊成員也深入研究國際太空技

  術，並依據NASA的資訊進行製作，力求真實還原。尤有甚者，更為本片量身打造一艘真實

  大小的太空船，設計靈感包含了現代太空船，以及NASA的月球門戶太空站（Lunar

  Gateway Station），更是泰國影史首見。





  在《跳越時空的愛戀》飾演雙主角「琳」與「凱斯」的演員更是一時之選，邀請到有「

  FreenBecky」之稱的國際巨星莎露彩查金哈（Freen）與瑞貝卡派翠西亞阿姆斯壯（Becky

  ）領銜主演。兩人之前主演轟動全球的GL夯劇《粉紅理論》，不僅創下突破七億觀看次數

  的驚人成績，更讓兩人成為全球GL影星的代表人物。這也是兩人首部共同演出的電影，

  Freen也成為泰國影史第一位詮釋太空人角色的演員，尤其她所配備的太空裝重達20公斤

  ，還必須吊鋼絲拍攝太空漫遊場面，全部都由她親自上陣沒有替身，展現出演員的決心。

  至於飾演潛水選手的Becky，更花費四個月時間，參加自由潛水工作坊，以確保每個演出

  細節都可以真實呈現。兩位女星在片中上演纏綿悱惻的女女之愛，不論是愛情的甜蜜，或

  是離別的悲痛，透過兩人精湛的演出，完美將各種角色融為一體，展現出強大的化學效應

  。不僅如此，本片還請來全球熱賣突破13億泰銖票房《金孫爆富攻略》中的「國民阿嬤」

  烏薩薩梅坎姆（Taew）首度擔任配音工作，為本片獻聲演出。



  本片也無愧多項「泰國影史首次」美名，從前製、拍攝直到上映，都一直備受泰國人民關

  注。直到電影正式上映，更勇奪首日票房冠軍，光是在曼谷與周邊地區，以及清邁的首日

  票房便斬獲227萬泰銖，擊敗來勢洶洶的新片《神偷奶爸4》（Despicable Me 4），同時

  也是2024年首日開片票房第六高的泰國電影，之後更順利奪下首週的泰國電影新片票房冠

  軍。泰國觀眾也紛紛在網路上寫下「非常美麗！」「令人驚嘆！」「細節完美無瑕！」「

  淚流滿面，非常感人！」「太空場景讓我起雞皮疙瘩！」「一分一秒都無法從銀幕上移開

  視線！」等好評盛讚。



  這部由國際巨星「FreenBecky」領銜主演的泰國年度史詩級電影鉅製《跳越時空的愛戀》

  ，即將在8月28日（週三）於台灣感動獻映。本片劇情描述琳（Freen飾演）和凱斯（

  Becky飾演）從朋友發展成戀人關係，琳夢想成為太空人，而凱斯則夢想打破自由潛水世

  界紀錄。當琳終於成為太空人，凱斯卻消失在深海之中，再也沒有回來，讓琳的餘生都陷

  入在痛苦之中。某日，琳執行太空任務，但太空船卻陷入巨大的太陽風暴當中，甚至切斷

  了她與地球的聯繫。她認為這可能是她生命中的最後一刻了，這時，某種形式的能量突然

  帶走她的靈魂，將她傳送到與凱斯多個不同的平行世界當中。兩人在平行世界裡跨越不同

  時代，都相互愛上彼此，只不過最終都無法改變悲痛的結局。儘管如此，她仍堅持追求一

  個可以跟凱絲珍惜彼此的世界，不必再忍受著別離的痛苦…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
