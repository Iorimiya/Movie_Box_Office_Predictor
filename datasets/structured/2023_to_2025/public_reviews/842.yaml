content: '情報來源：




  有沒有一個世界，能讓我們彼此相愛，直到永遠…

  【跳越時空的愛戀】8月28日(三)想見妳


  ◎ 概念微電影：




  ★ 泰國年度史詩級電影鉅製，斥資6000萬泰銖打造影史嶄新篇章！


  ★ 突破七億次觀看夯劇【粉紅理論】國際巨星FreenBecky首度共演電影！


  ★ 泰國影史首部集結愛情、友情、平行世界的奇幻愛情催淚強片！


  ★ 勇奪泰國電影新片票房冠軍，國際版權熱銷多國，全球觀眾詢問度破表！


  ★ 泰國文化部認證「軟實力計畫資助電影」，成就泰國影史驕傲！


  ★ 泰版概念微電影勇破200萬觀賞人次，展現強大話題性！


  ★【金孫爆富攻略】國民阿嬤「Taew」獻聲演出，首度擔任配音工作！


  ★ 超越泰影製作極限，量身訂做真實大小的太空船與航空站進行拍攝！


  ★ 泰國影史首部採用VENICE 2和BURANO專業攝影機拍攝的作品！


  ★ 引領觀眾潛入海洋深處，再跨越數十億公里到達宇宙盡頭與平行世界！


  ★ 即使這段戀情有多坎坷，只要有愛，無論我們相距多遠，愛仍能彼此傳遞！


  ★ 人氣女歌手Zom Marie深情獻唱主題曲〈Still Missing You〉！


  ★ 本次上映版本為泰語發音，中、英文字幕！






  琳（Freen飾演）和凱斯（Becky飾演）從朋友發展成戀人關係，琳夢想成為太空人，而凱

  斯則夢想打破自由潛水世界紀錄。當琳終於成為太空人，凱斯卻消失在深海之中，再也沒

  有回來，讓琳的餘生都陷入在痛苦之中。某日，琳執行太空任務，但太空船卻陷入巨大的

  太陽風暴當中，甚至切斷了她與地球的聯繫。她認為這可能是她生命中的最後一刻了，這

  時，某種形式的能量突然帶走她的靈魂，將她傳送到與凱斯多個不同的平行世界當中。兩

  人在平行世界裡跨越不同時代，都相互愛上彼此，只不過最終都無法改變悲痛的結局。儘

  管如此，她仍堅持追求一個可以跟凱絲珍惜彼此的世界，不必再忍受著別離的痛苦…。


  --'
