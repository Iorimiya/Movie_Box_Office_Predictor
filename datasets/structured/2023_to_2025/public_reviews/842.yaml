title: '[新聞] 【跳越時空的愛戀】打造等比例太空船拍攝'
content: '新聞網址：



  備受影迷期待，由突破七億次觀看夯劇《粉紅理論》國際巨星「FreenBecky」共同主演的

  泰國年度史詩級電影鉅製《跳越時空的愛戀》，即將在8月28日（週三）於台灣感動獻映

  。本片是泰國影史首部集結愛情、友情、平行世界的奇幻愛情催淚強片，更是泰國文化部

  認證「軟實力計畫資助電影」的其中之一。尤其本片還將打造震撼人心的太空場面，讓製

  作團隊與泰國的「Space TH」，以及「地理資訊與空間技術開發局」（GISTDA）等機構攜

  手合作，深入研究過去、近期和預計在未來會出現的太空事件，力求呈現最真實的細節。

  不僅如此，更野心勃勃地依照真實太空船大小，為本片量身打造1:1等比例的拍攝用太空

  船。宏大的製作規模，已經奠定泰國影史的重要里程碑。





  《跳越時空的愛戀》劇情描述太空人「琳」，某次在執行太空任務時，太空船卻陷入巨大

  的太陽風暴當中，讓她認為這可能是她生命中的最後一刻。不過這時，某種形式的能量突

  然帶走她的靈魂，將她傳送到與摯愛對象「凱斯」，多個不同的平行世界當中。透過奇幻

  的劇情與平行世界題材，試圖表達「從遙遠的太空到難以到達的深海，只要有愛，將引領

  摯愛之人再度相遇」這道主題。也因為電影將帶領觀眾漫遊至浩瀚的外太空，製作團隊這

  次與泰國「Space TH」合作，深入研究過去、近期和預計在未來會出現的太空事件，力求

  呈現最真實的細節，更依據NASA的資訊進行製作，力求真實還原。



  不僅如此，本片更打造與真實太空船等比例的拍攝用太空船進行拍攝，設計靈感包含現代

  太空船，以及NASA月球門戶太空站（Lunar Gateway Station），並輔以專業視覺特效，

  打造出逼真寫實的太空場面。本片監製「Boss」基塔瓦欽科特（Keetawat Chinnakote）

  對此透露：「片中太空船為真實太空船的實際尺寸，這是我們堅定的決心。在建造真實大

  小的太空船時，我們對每個部位的尺寸和細節都仔細研究。我們也得到Space TH的支持，

  以及地理資訊與空間技術開發局（GISTDA）的協助，根據真實進行創作。」





  協助打造《跳越時空的愛戀》太空船的GISTDA主任帕孔阿帕潘（Pakorn Apaphan）博士表

  示：「我很高興GISTDA提供有關太空船各種資訊的建議，讓電影盡可能真實且完整，尤其

  當我看到片場的太空船與航空站，以1:1等比例打造製作時，真的非常宏大，這將會是泰

  國影史的重要里程碑。」導演「James」塔納多努安蘇特（Thanadol Nuansut）也信心表

  示：「我認為我們已經準備好要創造一個前所未見的作品類型，而本片能去挖掘泰國人的

  潛力、超越其極限。我們志在創造一個令人嘆為觀止、大膽、有前瞻性的作品，我們深入

  研究一切，在每個細節透過動員泰國各領域最頂尖的團隊，共同打造這部作品，並已經準

  備好在國際上自豪地閃耀。」



  這部由國際巨星「FreenBecky」領銜主演的泰國年度史詩級電影鉅製《跳越時空的愛戀》

  ，即將在8月28日（週三）於台灣感動獻映。本片劇情描述琳（Freen飾演）和凱斯（

  Becky飾演）從朋友發展成戀人關係，琳夢想成為太空人，而凱斯則夢想打破自由潛水世

  界紀錄。當琳終於成為太空人，凱斯卻消失在深海之中，再也沒有回來，讓琳的餘生都陷

  入在痛苦之中。某日，琳執行太空任務，但太空船卻陷入巨大的太陽風暴當中，甚至切斷

  了她與地球的聯繫。她認為這可能是她生命中的最後一刻了，這時，某種形式的能量突然

  帶走她的靈魂，將她傳送到與凱斯多個不同的平行世界當中。兩人在平行世界裡跨越不同

  時代，都相互愛上彼此，只不過最終都無法改變悲痛的結局。儘管如此，她仍堅持追求一

  個可以跟凱絲珍惜彼此的世界，不必再忍受著別離的痛苦…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
