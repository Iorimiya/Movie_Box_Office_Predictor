title: '[新聞] <跳越時空的愛戀>FreenBecky三搭邁向國際'
content: '新聞網址：



  由突破七億次觀看夯劇《粉紅理論》國際巨星「FreenBecky」共同主演的泰國年度史詩級

  電影鉅製《跳越時空的愛戀》，即將在8月28日（週三）於台灣感動獻映。這是兩位演員

  第三度合體演出，將在片中跳越多個平行世界，大談刻骨銘心的淒美愛戀，並展現出強大

  的化學反應。尤其兩人都表示深受劇本感動決定接演，讓Freen直呼：「無論是什麼形式

  的愛情或是年齡，都是美好的。」Becky也有感而發：「覺得要愛自己，非常愛自己，並

  尊重我們所愛的人。」尤其這是泰國影史首部集結愛情、友情、平行世界的奇幻愛情催淚

  強片，也是泰國透過電影向全世界展現國家文化軟實力的作品，這也讓Freen信心表示：

  「希望這部電影能夠推動泰國電影的發展，並且走向國際，讓全世界都認識到泰國也能拍

  出這樣的作品。」





  勇奪泰國電影新片票房冠軍，並且是泰國文化部認證「軟實力計畫資助電影」之一的《跳

  越時空的愛戀》，不論從製作、卡司到上映都話題十足，尤其找來以《粉紅理論》享譽全

  球的莎露彩查金哈（Freen）與瑞貝卡派翠西亞阿姆斯壯（Becky）三度搭擋，更是影迷們

  的熱議焦點。監製塔瓦欽科特（Boss）透露：「這是一個很困難的企劃，因為想做這個企

  劃，所以找了Freen與Becky，跟她們表示希望拍一部關於太空及海洋的電影，但因為

  Becky真的要下到海底，而Freen也真的要穿上太空衣，體驗反重力，所以需要她們進行很

  多次的工作坊訓練，一開始很擔心她們會不願意接演，沒想到她們欣然同意。」



  也因為本片是泰國影史難得一見的電影鉅製，刻劃兩位主角不論從遙遠的太空，或是難以

  到達的深海，只要彼此有愛，愛都將引領兩人再度相遇。感人又刻骨銘心的劇本，也深深

  打動了FreenBecky。Freen便表示：「讀完劇本，感受無論是什麼形式的愛情或是年齡，

  都是美好的，也確實是無限的。」Becky讀完劇本也有感而發：「覺得要愛自己，非常愛

  自己，並尊重我們所愛的人。」尤其這是兩人三度合體演出，再度展現強大的默契與化學

  反應，也讓Freen表示：「我們全力以赴、意志堅定，而且非常謙虛，尤其本片的製作規

  模龐大，我們的角色也需要嘗試很多新事物，所以我覺得我們一起經歷了很多。至於信任

  與合作， 我們早就不用像新生兒一樣一步步來，因為我們已經合作過很多作品，我們早

  已經習慣了彼此。」據悉，兩人在開拍前積極學習騎車、潛水、射擊、武打等技術，就是

  為了將自己最好的一面展現給觀眾。





  值得一提的是，《跳越時空的愛戀》是泰國年度史詩級電影鉅製，劇組更為了片中的太空

  場面，打造出等比例的太空船進行拍攝，展現跳脫過往電影製作的強大野心。主演之一的

  Freen對此表示：「我覺得泰國電影每年都在進步，可能大家都習慣觀賞國外的電影，但

  我覺得泰國電影現在已經開始發展了，不論是設備、劇本、製作、導演或演員本身，都不

  斷在進步當中。」她更有感而發：「身為演員，我也做了很多功課，希望這部電影能夠推

  動泰國電影的發展，並且走向國際，讓全世界都認識到泰國也能拍出這樣的作品。因為本

  片的製作真的很龐大，包括畫面、燈光、顏色、聲音、特效，觀眾觀賞之後會感到很驚訝

  。希望能有更多人來觀賞這部電影，看看它的製作有多龐大，同時也幫助推動這個產業往

  更好的方向發展。」



  這部由國際巨星「FreenBecky」領銜主演的泰國年度史詩級電影鉅製《跳越時空的愛戀》

  ，即將在8月28日（週三）於台灣感動獻映。發行商也積極鼓勵觀眾進行包場，凡在戲院

  包場即可獲得A5原文電影海報小卡，詳情請見


  。本片劇情描述琳（Freen飾演）和凱斯（Becky飾演）從朋友發展成戀人關係，琳夢想成

  為太空人，而凱斯則夢想打破自由潛水世界紀錄。當琳終於成為太空人，凱斯卻消失在深

  海之中，再也沒有回來，讓琳的餘生都陷入在痛苦之中。某日，琳執行太空任務，但太空

  船卻陷入巨大的太陽風暴當中，甚至切斷了她與地球的聯繫。她認為這可能是她生命中的

  最後一刻了，這時，某種形式的能量突然帶走她的靈魂，將她傳送到與凱斯多個不同的平

  行世界當中。兩人在平行世界裡跨越不同時代，都相互愛上彼此，只不過最終都無法改變

  悲痛的結局。儘管如此，她仍堅持追求一個可以跟凱絲珍惜彼此的世界，不必再忍受著別

  離的痛苦…。



  欲知本片最新消息，

