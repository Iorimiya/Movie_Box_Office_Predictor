title: '[好雷] 桃子樹的最後豐收 Alcarràs (2022 西班牙片)'
content: '3/31《桃子樹的最後豐收》Alcarràs 剛上映時我就想去看！不過清明假期南北奔波家族聚會來回掃墓，這一拖就拖到了 4/9這週末... 誰知返鄉見識家庭眉角與農業社會滄海桑田後、再來看《桃》片的加泰隆尼亞農村轉型故事更加有感！海報上是農村田園一家老小、預告片從小朋友童心跑跳揭開夏日序幕、我一開始還滿心雀躍以為是《夏日1993》美女導演
  Carla Simón 又一童心夏日片？真看下去才知這次她拍第二片角色更多規模更大議題更複雜：不只近年台灣農村正在瘋「種電」、歐洲各地 2010s也如雨後春筍般設太陽能板、只是農村田園本有的農業經濟又該怎麼辦？




  希望這對「農村種電」的批判與懷疑不會挑起政治敏感 XD 我們就且當太陽能板製程嚴謹污染有妥善處理、也當太陽能板乾淨能源可數倍彌補碳足跡、更當窮苦農村有太陽能板可幫助翻身帶來好日子
  (?)... 鄉親們大家評評理：太陽能板愛護地球保護社區帶來富裕根本有百利而無一害 (!)、為何總有鐵桿鄉民冥頑不靈要當唐吉軻德與時代作對？這辯起來可傷感情，幸好
  Carla Simón 在本片沒繼續多談「太陽能板」的能源與環保辯論，毋寧說它早就是個給定的時代必然，如果農村還有唐吉軻德其實也沒啥好奮戰的了，只看大家面臨時勢所趨傳統消逝如何站在一起共同面對。


  故事開始：加泰隆尼亞西部 Lleida 附近農村小鎮 Alcarràs，在這也許是 2010 前後那智慧手機尚不見影的時代，幾個農家孩子徜徉田園自由玩耍時，赫然發現有大怪手入侵農村剷除障礙準備安裝著什麼！回家報告大人才見大家面色凝重：這是「太陽能發電」的綠能時代，綠能卻與農田競爭土地搶佔陽光，當地家境富裕不再務農的地主
  Pinyol 一家已出賣土地開始種電！那得他們惠賜土地種水蜜桃已到第三代的 Solé一家該如何守護祖業？誰知二代老爺爺 Rogelio雙手一攤坦承「沒有地契」，因為當年再上一代曾祖和地主是生死之交，拍了胸脯就是一生保證從不用地契。




  過去農村社會人際緊密重視諾言與榮譽、如今商業社會公事公辦白紙黑字才算數，過去農村社會呵護土地享受果實更親土親人、如今商業社會果賤傷農摧毀農村經濟更吞併土地遂行開發，過去農村大家庭分工合作親愛精誠齊心為家族興隆、如今商機入侵投機崛起人人心有貳志陷路線爭執...
  這還有什麼話好說？並非有個萬惡地主或無良資本家一臉橫肉要來侵吞你地產，而是整個時代都在變化西方社會已整個轉型，轉型已進入加泰隆尼亞西部大地你想擋都擋不住！當然轉型也並非都是壞事，年輕人喜愛流行嚮往城市打開心窗有更多可能，但已習於農村投注一生的上代怎麼辦？


  本片素人演員角色眾多乍看好混亂，在此先簡單整理：爺爺 Rogelio是大家長仍活在傳統世代，面臨土地整併子女跟他要地契他卻拿不出來，總是滿面愁容心懷愧疚覺得土地危機與家庭分裂都他該負責，還想拿有機農產去跟地主
  Pinyol 後代搏感情卻只是熱臉貼冷屁股；大兒子 Quimet 是家族第三代中堅有權力指揮一切卻也有責任扛下一切，土地將被兼併他卻束手無策很快陷入了莫名焦慮，日常農耕與土地事務已處處按捺不住發洩爆氣！只是負面能量激起家族分崩離析之餘，從他妻子
  Dolors 以降每個家人看在眼裡都不敢吭聲，一群女子小人背後撐持承擔他這家主的崩潰。




  大哥 Quimet 與大嫂 Dolors 守護家業堅持做好「最後一次桃子豐收」之餘，二姐 Nati 與二姐夫 Cisco則知大勢所趨已精打算盤準備順勢而為：我們當果農的日夜辛勞照料土地凌晨還要起床打兔子、結果盤商與政府低價收購高價轉賣根本剝削農民，反之若配合土地開發還能討價還價以後管理太陽能板、那可工作輕鬆賺得又多奉養父母何樂而不為？可想而知必吃大哥一頓派頭還被飽以老拳；三妹
  Glòria則是已去過巴賽隆納讀書工作的都市青年，當個單親媽媽帶個幼女回到老家以為能調停家人，殊不知自己從未涉足家務就無 family credits 對家庭亂象根本毫無置喙餘地！


  只是大哥與二姐姐夫大打出手之餘，犧牲的卻是大哥幼女 Iris 與二姐幼子 Pere & Pau 青梅竹馬三小無猜的親愛精誠！怎麼平日家長相安無事時童真小輩都玩在一起、家長一搞兄妹鬩牆孩子們也被迫站隊隔離不相往來？不禁令人感嘆兒時單純長大卻世故起來；大哥長子
  Roger努力幫忙爸爸農事渴望爸爸肯定，爸爸卻期待他讀書翻身不要務農，這父子爭執代言許多農村世代傳承的認同分裂；大哥長女 Mariona自小性別分工沒能碰農事、百無聊賴的夏日也在尋求參與感與認同感，倒是在父輩大人對爺爺沒有地契藏不住怨懟時、唯她細心體察處處給爺爺溫暖苦苦維繫全家心志。




  本劇最令我連連點頭的就是這「怨懟」，人人理性知道別人的無奈與彼此的不同考量、但感性上仍一股怨氣無處抒發化作日常竊竊私語，儘管名義上這仍是個年復一年的「桃子豐收」大家分工忙碌熱熱鬧鬧地、但那「最後一次」的末日陰影宛如房間裡大象人人心照不宣...
  這樣的「心照不宣」才是侵蝕個人心志人際關係與家庭團結的隱形殺手！本片這「最後豐收」的末日家族肖像畫，人人再多奮鬥也只是白搭，那面對無人可擋的時代惡水還能有什麼「成長」呢？也許成長就在片末大嫂
  Dolors 給大哥 Quimet 揮的一巴掌，末日悶在心裡歇斯底里只會蠶食人心分裂了全家。


  片頭的對面大怪手、片尾終於來到了自家，不論是大限將臨的震撼與恐懼、還是大限已至的面對與接受，頭尾呼應的共同諭示可能還是全家都要「站在一起」共同見證。主角 Solé一家靠「陽光」為生，產業卻競爭陽光趕走他們，那渺茫的未來他們又能怎麼辦？這對我們台灣來說是現在進行式，但對歐洲許多既成景觀背後的流離農家早已是過去完成式...
  不過命定的流離真如此絕望？也許還要轉頭看看人家早已踏上的流離：城裡多少黑人都在找零工？多少 2010s難民移工飄洋過海？但就算失根仍要文化儀式守護己心體現人性，可塑性極高的異鄉孩子也像個海綿會快速學習。




  看來 Carla Simón 電影的希望曙光還要看「孩子」，連《夏日1993》那樣與世界為敵的創傷孩子都能找到異鄉新生，那《桃子樹的最後豐收》儘管命定了傳統消失與家族離散、掌握己心仍能適應變局迎接未知。至於對過去既成的時代事實？Carla
  Simón電影還是會找個地方總結論述呼喊一回宣示存在。前片談的是後佛朗哥時代 1990s的文化解放與公衛問題，這回則是 2010s綠能產業來勢洶洶的農村轉型，但企業與國家有計劃裂解農村兼併土地早有久遠歷史絕非新鮮事！許多電影訴求戳破陰謀挺身而出實踐正義，她的電影則訴求接受命定現實仍須堅守己心。推薦靜心欣賞。



  --'
