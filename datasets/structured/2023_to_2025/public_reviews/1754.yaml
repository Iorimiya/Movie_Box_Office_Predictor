url: https://www.ptt.cc/bbs/movie/M.1680520265.A.D9A.html
title: '[好雷] 桃子樹的最後豐收'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  時代在走，科技越來越進步，ChatGPT與Midjourney等人工智慧的發展也越來越先進，當

  人類在擔心自己的工作是否會被電腦取代，傳統的生活方式早已面臨此威脅。2022柏林影

  展金熊獎《桃子樹的最後豐收》刻劃出資本主義如何進攻這座位於加泰隆尼亞的小鎮，並

  讓一個快樂的家庭出現裂痕。



  生活在西班牙加泰隆尼亞的索雷一家，以種植桃子樹維生。突如其來的變化讓家中長子吉

  梅手足無措，並逐漸與妻子朵洛絲、兒子羅傑產生摩擦，連帶牽動整個家族。



  電影忠實呈現農人與農業的日常，他們必須靠天吃飯，天氣好得工作，天氣不好還得擔心

  農地或果園是否會淹水。甚至片中羅傑曾經忘記關水門，就可能導致果樹死去。索雷一家

  夜晚也不得閒，還得到果園去巡視，獵殺會偷吃桃子的野兔。由於務農非常辛苦，世界各

  地都面臨年輕勞動力出走的困境，但農業又是糧食的基礎，種種矛盾造成農人的處境更為

  艱難。爸爸吉梅一生只懂種植桃子，但他卻總是趕兒子羅傑去讀書，或許是不希望兒子與

  自己一樣成為辛苦的農夫，但吉梅卻沒想過羅傑的務農天賦或能帶來一點變化與轉機。



  《桃子樹的最後豐收》開宗明義告訴觀眾，地主要將整片土地收回，所以這將會是索雷一

  家最後一次採收桃子。不過，明明是悲傷的故事，全片雖有爭吵，卻笑語不斷。不論是大

  人的苦中作樂，還是天真無邪的孩子尚且不知道發生什麼事而照常嬉鬧玩樂，都顯示出日

  子還是得過。電影結束在挖土機開挖，結束採收季的索雷一家開心地歡笑聚餐，聽到巨響

  後卻看傻了眼。沒人知道明天過後索雷一家究竟是只得改行做太陽能板，還是另謀他職，

  但片尾孩子們仍舊在院子裡奔跑嬉戲，彷彿一切無異，反而更顯辛酸。



  片中不管是大人還是小孩，演技都極為自然，但他們其實都是未經過專業演員訓練的素人

  。有些人是桃農，有些人是老師，這可能也解釋為什麼他們能夠如此俐落自然地採摘桃子

  ，並且在這充滿孩子的多口之家大家庭與其他演員自然地互動。對演員群裡的桃農來說，

  參與《桃子樹的最後豐收》的演出想必也是感觸良多，這無非也是他們部分人的現實寫照

  。



  飾演爸爸的約迪‧普約爾‧多賽正是在社會運動現場被導演相中，積極爭取農人權益的他

  ，應該會在片中看到身邊人的影子。飾演兒子的亞伯特‧波世更因為相貌俊俏，在演出後

  爆紅，獲經紀公司青睞，將發展演藝事業，也成為模特兒。本來就是桃農的他，在電影當

  中本色演出，個性有點叛逆又青春洋溢，演活羅傑這個角色，片中的情緒起伏也都相當自

  然，也讓他提名「西班牙奧斯卡」的哥雅獎最佳新演員。



  除了點出現今農業的困境之外，家庭之間的磨擦與羈絆也是《桃子樹的最後豐收》裡的重

  要主題。從一開始爸爸吉梅怪罪爺爺當初沒保留地契開始，到相對較為年輕的妹夫有意接

  受地主開出的條件轉作太陽能板，引發家人之間不合，甚至演變為小小年紀的表兄弟姊妹

  也不能見面。第三代裡年紀最大的羅傑，貼心地想為爸爸分擔農忙，卻不得爸爸的稱讚，

  甚至還與姑丈一起偷偷在桃林間偷種大麻，希望可以藉此改善家裡的經濟狀況。圍繞著爸

  爸的家庭衝突在兩小時的電影中從未間斷，但最終塵埃落定，家人還是彼此最大的支持與

  依靠。



  最讓觀眾覺得可惜與心疼的，肯定是找不到地契的爺爺。國片《哈勇家》裡也出現過類似

  的土地糾紛，以前「喝幾杯小米酒，擺幾顆石頭就是自己的地」，而《桃子樹的最後豐收

  》中的爺爺表示，自己的父母過去收留地主的祖父母逃過追殺，因此，過去兩代這片土地

  都交由索雷一家種植桃子樹。但是，相隔兩代後，兩家的世交也不是那麼熱絡，年輕的地

  主也不在乎這份情誼，這也是無可奈何之事。這份對土地的情感也只能寄託在片中所唱的

  歌曲裡，聽在耳裡格外淒涼。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
