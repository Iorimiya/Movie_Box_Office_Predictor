title: '[好雷] 沙贊！眾神之怒簡易心得'
content: "昨天中午去看媒體場，用最近的超級英雄電影來比的話，我個人認為比\n    《蟻人３》、《雷神４》等好。覺得與《自殺突擊隊：集結》相當。\n  \
  \  然後第三幕跟《黑豹２》一樣體感有點長，會覺得比實際片長多 20 分鐘左右。\n\n    導演大衛桑德伯格在這部電影中添加了自己的風格，盡量不要讓這一部電影\n\
  \    有公式化的感覺，本來看華納在海內外的宣傳有點擔心，但意外地不錯。\n\n    另外，之前訪談提到的同性戀設定其實跟《永恆族》一樣很淺很淡，\n  \
  \  有劇情上的小意義但是很快就帶過了。\n\n    如果覺得第一集的沙贊屁孩感太重，這集雖然稍淺，但如果對這種角色性格\n    不太喜歡的話，前半段可能會看得有點微詞，可以再參考一下其他人的評論\n\
  \    再看看要不要去看。\n\n    另外這部片意外的跟最近的時事有搭到！\n\n    同行者比較喜歡他前一天看的《龍與地下城》，不過我還沒看所以沒得比較。\n\
  \n    IGN 給《蟻人３》、《雷神４》、《龍與地下城》和本片的分數都是 7/10，\n\n    不過評論員都不一樣，和本片同評論員的給《捍衛任務４》10/10、\n\
  \n    《水之道》8/10、《黑豹２》7/10。\n\n    目前爛番茄的好評比為 68% 均分 6.3，評論 44 篇。\n\n--"
