title: '[普好雷] 有趣卻不失溫度《沙贊！眾神之怒》'
content: '有趣卻不失溫度《沙贊！眾神之怒》


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  做為一部續集，《沙贊！眾神之怒》延續了前作的世界觀，無論他會不會被詹姆斯岡恩捨

  棄，他都是華納在這幾年的跌跌撞撞下少數我認為抓到了角色魅力的作品。


  續作核心仍是比利對於自身歸屬感的問題，整體仍維持有趣到有些聒噪的風格。


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  【新角色，新氣象】


  除了前作大家已經看到膩的柴克萊威外，這次加入了新任的白雪公主瑞秋曾格勒，好久不

  見了劉玉玲，以及奧斯卡女主角海倫米蘭，後兩者都讓這部作品在節奏上有趣不少，與柴

  克的話嘮脫序不同，海倫米蘭的角色在這部電影中起到了緩和的作用，而劉玉玲飾演的卡

  呂普索更凸顯了角色狡詐與強勢的部分。


  電影中除了能看到沙贊家族間的情感交流外，更能看到阿特拉斯的女兒們間，對於人類採

  取的不同態度。


  另外這次沙贊家族的大姊葛莉絲·福爾頓同時也直接飾演了變身後成年版的自己，從暴漲

  的鏡頭數量可以感覺的到導演對她的厚愛。


  或許是上次只有脖子以下的克拉克讓DC粉不太滿意，這次客串角色直接請出了蓋兒加朵，

  再加上片尾畫面的提醒，不難發現現階段的DC電影角色仍是放在同一個宇宙中，而閃點後

  這個些角色該何去何從，或許就是詹姆斯岡恩該擔心的問題了，我唯一感到鬱悶的是，這

  些年來，除了梅莉莎外我真的很難接受其他的卡拉，尤其是沒有金髮的。




  【從孤獨到放手】


  若將《沙贊》與《沙贊！眾神之怒》兩部作品接續觀看，肯定能看到比利除了年紀外的諸

  多變化。


  當年那個一心想逃離寄宿家庭，尋找家人的青少年，已經蛻變成了維護家人，擺脫血緣關

  係束腹的兄長，當然，他還是很屁，但這並不妨礙他擋在家人與敵人之間，並在必要的時

  刻挺身而出。


  從逃跑到逃避離開，從些許的孤僻到不願意放手任何一個家人，聒噪說穿了也是比利掩飾

  自己膽怯與懦弱那一面的保護色。比起面對家人的離開，他寧可與惡龍交戰，對抗眾神以

  強悍的外殼，掩飾內在的不安，就像是海倫米蘭在電影中說的，即便偽裝的外表再強大，

  沙贊的內在仍舊是那個不安的小男孩。


  在相遇前，比利需要學習如何愛；在相遇後，比利更該學習如何放手。




  【必不可免的混亂】


  角色的暴增讓《沙贊！眾神之怒》多了許多必不可免的混亂，這點在電影收尾上最為明顯

  ，大量的CGI動畫除非是對於希臘傳奇生物特別熟悉且有興趣的人，否則恐怕會令人感到

  厭煩，公式化的收尾也讓劇情沒能染上驚艷，雖然有些令人遺憾，但還不到失望的地步。


  過多的笑話、諷刺、彩虹糖廣告、混亂的戰鬥場面，必須得說，從打鬥張力方面切入，《

  沙贊！眾神之怒》沒能帶來像《黑亞當》一樣的硬漢與爽快感，但就像《蟻人》在Marvel

  中帶來家庭小品的溫暖憤氛圍，《沙贊》同樣在DC作品中凸顯出了他青少年那一面的特色

  ，既不穩定，但也正是這份不穩定，讓他既無私又充滿可能性。



  《沙贊！眾神之怒》仍舊是一部主打有趣的作品，他就像是讓人重回小時候窩在漫畫店或

  是沙發上翻閱著成堆的漫畫小說雜誌，一杯珍奶就能度過一下午的美好時光，他塞入了許

  多原著漫畫的小彩蛋，也塞進了為電影粉絲服務的誠意，既便他不會是最好的超級英雄電

  影，但他肯定會是適合朋友們一起看的電影。


  --'
