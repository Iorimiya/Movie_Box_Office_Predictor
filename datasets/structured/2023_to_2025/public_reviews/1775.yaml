title: '[贈票]【沙贊！眾神之怒】北中南特映會搶先看'
content: "【沙贊！眾神之怒】接續描述青少年比利貝特森的故事，只要他喊出神奇字眼「沙贊！」\n，就會立刻變身為成人身體的超級英雄沙贊。\n在這部精彩刺激的超級英雄續集電影中，將為觀眾帶來更多的驚喜、冒險、和笑點，超級\n\
  英雄們也將面對更大的威脅、怪獸及神秘生物。比利貝特森和他寄養家庭的兄弟姊妹們，\n在被賦予眾神的力量之後，仍在學習如何兼顧青少年的日常與成人超級英雄的生活。這時\n\
  三位古代女神，即阿特拉斯之女，帶著復仇來到地球，試圖找回她們在很久以前被偷走的\n魔法；身為沙贊的比利，以及其家庭為了他們的超能力、生活及世界的命運，不得不挺身\n\
  而戰。不過，這群青少年真的能拯救世界嗎？比利也真的想要拯救世界嗎？\n\n《抽獎方式》\n3月9日 (週四) 18:00 前，推文留言你想要搶先看【沙贊！眾神之怒】的〈場次〉與〈原\n\
  因〉，就有機會搶先看電影！\n（如：中午場，想看復仇女神發威）\n\n《獎項內容》\n【沙贊！眾神之怒】電影試映券（一人得獎兩人同行，每場次抽10組）\n\n\
  《特映會場次》\n中午場 - 3/15 (三) 11:30 台北大直美麗華\n台北場 - 3/15 (三) 19:10 台北MUVIE\n台中場 - 3/15\
  \ (三) 19:00 台中文心秀泰\n高雄場 - 3/15 (三) 19:30高雄SKM Park國賓影城\n\n《中獎通知》\n3月9日 (週四) 20:00前，公布中獎者於回文內，並寄站內信通知得獎者得獎事宜。\n\
  3月10日 (週五) 12:00前，請各位中獎人務必回覆領獎資訊，恕不接受逾期回覆。\n\n《注意事項》\n1.試映券為非賣品，嚴禁兜售等圖利行為。\n2.票券尚未劃位，請於開演前60分鐘自行劃位，座位劃滿即不受理。\n\
  3.請準時入場觀賞，電影開演後10分鐘戲院與主辦單位有權謝絕入場。\n4.因應疫情期間，請民眾中央流行疫情指揮中心發布之防疫規範，持續配合防疫措施，守\n護彼此健康。\n\
  5.如本活動因不可抗拒之特殊原因無法執行時，主辦單位有權決定取消、終止、修改或暫\n停本活動與延遲得獎公告。\n更多電影資訊：華納兄弟台灣粉絲團 \n\n\n\
  --"
