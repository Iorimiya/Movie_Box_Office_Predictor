url: https://www.ptt.cc/bbs/movie/M.1684167173.A.468.html
title: '[新聞]《沙贊！眾神之怒》成為DCEU史上最差票房'
content: '新聞網址：


  原標題:



  。這部電影未能在觀眾中獲得廣泛的受歡迎程度。



  柴克·萊威在《沙贊！2》中回歸飾演比利/沙贊。在2018年的首部電影《沙贊！》在不到

  9000萬美元的預算下全球票房達到了3.63億美元，接著續集獲得了批准，



  然而，從最初的綠燈開拍開始，很多事情發生了變化，2022年是華納兄弟旗下DC電影界決

  定性的一年。



  巨石強森的《黑亞當》電影發佈，以亨利·卡維爾飾演的超人，令人興奮、又困惑的場景

  為特色。



  接著DC宇宙中似乎帶來了平衡，監製彼得·沙佛朗和編劇/導演詹姆斯·岡恩將領導新的

  DC工作室，該工作室將以動畫系列《生物突擊隊》和備受期待的《超人：傳承》展開。



  這個電影宇宙內明顯缺乏方向感，再加上《黑亞當》的差評，似乎導致了對《沙贊！2》

  的整體興趣不高。







  它不僅比前作少賺了2億多美元，而且被COVID-19大流行期間與HBO Max同步上映的兩部電

  影《神力女超人1984》和《自殺突擊隊 : 集結》超越。



  華納兄弟對這個結果肯定感到不滿意，但《沙贊！2》從一開始就沒有抱著成功的期望，

  從許多方面來看，該工作室正在觀望票房，直到詹姆斯·岡恩的DCU宇宙開始。



  在過去的十年中，有一件關於漫畫電影改變了的事情是觀眾不僅僅期望觀賞一部有趣的電

  影，還期待與其他電影和角色建立聯繫。



  《沙贊！2》在所有意義上都是2018年原作的獨立續集，與DCEU的聯繫並不密切，主要圍

  繞著在第一部電影的片尾片段中出現的沒有露出頭的超人客串。



  連貫性是這些電影的重要元素，也是為什麼漫威影業在2010年代及之後如此成功的關鍵原

  因之一。



  在一個令人困惑的決定中，沙贊的主要對手黑亞當在漫畫中有了一部起源電影，而這部電

  影在《沙贊！》續集之前僅僅幾個月就上映了，然而這兩部電影卻完全沒有聯繫。



  如果凱文·費奇寫了一本DC電影宇宙手冊，這種操作方式一定會被列入「不應該做的」清

  單。



  考慮到這部電影比原作更差、對過去、現在或未來的DC宇宙沒有影響力，並且圍繞著一個

  容易被遺忘的角色，這就是DC工作室得到的結果。



  2023年DC電影行程中還有希望，《閃電俠》獲得了正面的評價和反響，《藍甲蟲》是一部

  低風險的潛力作，而傑森·摩莫亞仍然能夠承擔起給《水行俠2：失落的王國》帶來商業

  成功的重要性。



  簡單的事實是，華納兄弟探索公司的首席執行官大衛·扎斯拉夫（David Zaslav）對《沙

  贊！2》的失敗不會感到擔憂，因為他把所有籌碼都押在詹姆斯·岡恩的《超人：傳承》

  和2023年之後的所有未來項目上。



  《沙贊！：眾神之怒》將於5月23日在Max上線。



  --'
