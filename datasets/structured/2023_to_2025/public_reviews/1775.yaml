url: https://www.ptt.cc/bbs/movie/M.1679121133.A.D67.html
title: '[好雷]【沙贊！眾神之怒】也太多女神了吧？ '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~







  我一直都覺得2019年的【沙贊！】是一部被嚴重低估的電影，這部改編自DC經典角色的電

  影，描述一位平凡的孤兒青少年意外獲得了超級英雄的力量，但是心智卻尚未成熟，必須

  學著適應自己的雙重身分與責任的故事。在當年預告片剛出現時就讓我看得很開心，後來

  上映之後更是沒讓我失望，華納找了【鬼關燈】與【安娜貝爾：造孽】的導演大衛桑伯格

  執導，讓整部電影呈現出大量的幽默感與衝突笑料。使得【沙贊！】在近年一片嚴肅處理

  世界各種危機與內心黑暗孤獨的超級英雄電影當中顯得既陽光又屁孩，但是那反而讓我覺

  得【沙贊！】是在時下一大票假裝要講很嚴肅道理，但是實際上骨子裡超簡單的超英雄電

  影當中，極端少數坦白、誠實又不裝模作樣的，展現傳統超級英雄電影存在目的與意義的

  電影：娛樂與可愛。


  可惜的是，也許【沙贊！】所呈現的樣貌與形象實在太坦白，太明顯了，這使得許多希望

  超級英雄電影有更多意義與價值的觀眾厭惡這部電影，雖然在現在的電影市場上，也有索

  尼的【蜘蛛人】這種描寫半熟青少年觀點的超級英雄電影，但是【蜘蛛人】是找了帥氣娃

  娃臉偶像男孩來詮釋屁孩，這與【沙贊！】找一個大人演屁孩青少年還是有些不一樣的，

  雖然我覺得柴克萊威演的超好，但是對青少年或是仍舊喜歡超級英雄類型能夠嚴肅、黑暗

  點的觀眾們而言，【沙贊！】的坦承可能更像是一種直接的嘲諷與冒犯吧。


  不過【沙贊！】雖然沒有引起話題迴響，但是在商業成績上還算是成功，它的成本大約1

  億美金，這在超級英雄電影當中算是中低成本電影了，然後獲得了3.66億的票房收益，這

  使得【沙贊！】有辦法繼續製作續集【沙贊！眾神之怒】，雖然在寫這段描述的時間點，

  華納對於DC改編電影的態度已經讓亨利卡維爾的超人與班艾佛列克的蝙蝠俠全都下崗，我

  們並不知道華納之後還會不會再延續這個與查克史奈德創立的DC電影宇宙故事線，但是總

  而言之，續集還是終於上映了。


  在上一集的最後讓沙贊從一個變成一群的比利，儼然讓費城成為了一個擁有英雄戰隊的城

  市，其實我當年在電影院看到的時候是看得頗樂的，看看那不同的顏色，美國除了金剛戰

  士與忍者龜，在DC的世界裡頭也有英雄戰隊了，只是審美觀不一樣就是，日本人特別喜歡

  帶安全帽，而到了美國則是每個成員都擁有健美的肌肉與屁孩般的臉孔，只不過沙贊戰隊

  雖然擁有力量，但是個個都不成熟。電影開場的一場拯救市民的任務，就可以看得出來這

  一家子個個心地善良，但實際做起事來完全是一盤散沙，也難怪費城的居民一點都不喜歡

  這幾個超級英雄。


  男主角比利應該也是感覺到這會是個問題，一直盡力想要好好的把整個團隊成功組織化，

  但是俗話說家人是最難合作的事業夥伴，更何況全都是青少年狀態的家人？再加上比利自

  己也不成熟，更沒有社會經驗，比利又不願意對家人發脾氣，然後對自己沒有自信的他又

  更加倚賴自己的家人們，希望凡事都要「同進同出」，以劇情面而言，【沙贊！眾神之怒

  】的確很成功的描繪無法獨當一面青少年的心理狀態。


  不過「青少年心理狀態未成熟」在本片只是次要主題，主要的故事線反而都集中在由海倫

  米蘭與劉玉玲兩人所飾演的反派赫斯珀拉與卡呂普索，這兩人是古老的神祇泰坦神阿特拉

  斯的女兒，對於沙贊這些獲得神力的人類屁孩充滿了敵意，一見面就用魔杖一一回收了沙

  贊的力量，使得比利這個元老沙贊必須被迫要獨自面對敵人。


  說起來，【沙贊！眾神之怒】跟前作一樣，故事的節奏並不快，甚至連危機也顯得慢吞吞

  的，即使泰坦神姐妹拿到了魔杖，卻因為想要拿到的神器金蘋果不知在哪

  而使得整部電影到了中段就停了下來，不過【沙贊！】系列一直都是日常生活番，主打的

  是青少年擁有超級英雄的神力之後拿來惡作劇的戲謔，與在家庭當中出現的衝突，才是這

  系列的有趣之處，然而電影都已經演到第二集了，比利早已習慣當沙贊，所以第一集的驚

  喜感自然就已經不能再玩，取而代之的，就是那種宛如青少年情境喜劇的喜劇氛圍，比利

  與他領養家庭的兄弟姐妹們把神秘空間「永恆之時」變成了一個青少年的秘密基地。


  於是這群孩子就在吵吵鬧鬧當中，用很彆腳的方式對抗著反派泰坦神族，而泰坦神族的女

  神們也不怎麼聰明，面對這群孩子，幾位神民姐妹的表演反倒出現異樣的喜感。第二集大

  部分的娛樂感幾乎都是泰坦女神們呈現的，尤其是飾演姊姊的大姐赫斯珀拉的海倫米蘭的

  表現撐住了整部電影，海倫米蘭不愧是個經驗豐富的影后級人物，很悠然的在嚴肅表演與

  冷面笑將當中不時地切換，把一位歲數幾千歲的女神面對17歲男孩時的衝突與荒謬感表現

  得非常可愛。而且這也呈現出電影背後在嘲諷的訊息：任性的老人家，有的時候反而很像

  小孩。


  片中兩位反派女神的「邪惡」，幾乎是明示的描繪「平權之亂」，一老一少兩個女神，在

  搶到象徵權力的杖之後，接著就「引發混亂」，那個混亂的形式還是在人的耳邊耳語之後

  ，遭到蠱惑的人繼續蠱惑他人，最後變成群體的混亂。


  誒？這不就是所謂的社群網媒攻擊嗎？


  而海倫米蘭拿著魔杖收回變成沙贊的弱勢孩子的力量又讓我覺得好像是在描繪老一輩不肯

  讓新一代接班的世代正義？


  當海倫米蘭使用法術，將費城隔絕在一個穹頂底下的時候，我腦袋裡頭瞬間想起史蒂芬金

  的【穹頂之下】還有【辛普森家庭】的電影版，老實說，在疫情之前，這種將整個城市隔

  絕起來的描繪只是個嘲諷的黑色幽默，然而在經歷過三年的疫情之後，看到這種畫面我卻

  總覺得有些不寒而慄。


  當劉玉玲拿到了象徵權柄的權杖之後，所做的第一個動作竟是剷除內部矛盾，然後在她取

  得了「可以重建神的國度，但放錯位置會毀滅人間」的金蘋果之後，選擇的第一件事也是

  報復人類，某種程度而言，這敘事是在描繪失去權力者取得權力之後的扭曲，而這個角色

  乘著巨龍與沙贊在海倫米蘭手中的障壁中的戰鬥也是某種象徵，擁有力量的人畢竟是要有

  為弱小者犧牲的覺悟時，才能夠被認可為英雄的。但是這一段戰鬥的視覺處理有些拖沓，

  在娛樂性上反而顯得有點減損。


  【沙贊！眾神之怒】主體是一部爆米花超級英雄電影，雖然角色的遭遇與應對總能看得出

  一些現實生活的投射，好讓觀眾引起共鳴，並沒有想要深入探討的意思，基本上他仍是一

  部愉快看完，心情會不錯的電影，因為他輕薄短小，所以去思考這部電影的意涵有的時候

  還會覺得自己這樣想很掃興，電影的結尾看得到知名角色串場是個不錯的驚喜，這部電影

  有兩段隱藏片尾，第一段是跟HBO製作的影集【和平使者】連動的劇情，第二段則是在為

  續集留下伏筆，然而，在華納找來詹姆斯岡恩主掌DC系列電影之後，這些隱藏片尾的預告

  還有意義嗎？


  --


  男人是一種很悲哀又很容易控制的動物，因為他們往往拼了命的取悅異性，或是從各種媒

  介取得任何可以引起性幻想的事物，甚至還因而犯下強姦或是偷窺等大小不一的罪，但是

  追根究柢，目的卻只是想要從自己的身上擠出那麼5C.C的液體而已。

  粉絲團



  --'
