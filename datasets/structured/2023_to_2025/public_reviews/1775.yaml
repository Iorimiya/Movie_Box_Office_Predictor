title: 'Re: [新聞] 巨石強森拒絕客串《沙贊！眾神之怒》？'
content: '不延續查克的DC宇宙，

  我連黑亞當都看不下去，尤其那個彩蛋，看一次就覺得被打臉一次。


  水行俠、閃電俠、沙贊...哪一部不是圍繞查克DC宇宙進行的？

  甚至正義使者、自殺突擊隊也都是啊。


  然後現在說沒有亨利超人了。


  那接下來看這些共同宇宙電影有啥意義！？


  不要說好聽話，「電影本來就是各自獨立」，

  明明這些故事都有個共同宇宙，然後故事的濫觴超人不見了，

  那到底誰會有心情往下看啊？


  看了然後就重啟，而且這麼早就宣告這些電影都不會再有後續發展，

  你他爹的要觀眾買單？

  不是說好了想要發大財要賺錢整天算虧損？


  現在這樣到底能夠賺什麼錢？

  然後虧損算誰的？這些電影花的成本都當作空氣？


  黑亞當之所以票房差強人意（注意只是差強人意而已，不是真的虧損），

  是因為DC長久以來的宇宙歪七扭八，

  誰會想看一個會忽然走鐘的真。多元（崩壞）宇宙大型電影連續劇啊？


  就算黑亞當內容再好，一想到劇情詐欺，或者又可能要浪費故事，

  後繼怎麼可能有力？


  雖然我覺得漫威第四階段整個爛成一鍋粥，

  好歹電影之間的連結度超強，是一個超大型的共同宇宙，

  看任何一部觀眾都有參與感，我參與了關於誰誰誰的故事，

  後面還是會跟整個主宇宙連結的啊！


  心境上整個沉浸了，去年專賣情懷的蜘蛛人3為啥成功？

  因為他成功的把前兩代蜘蛛人一併拉進來故事之中，

  甚至為了二代蜘蛛人專門設計一個讓人會心一「哭」的橋段，

  試問，誰不愛這種感覺？


  DC呢？

  我一下子看到勇猛善戰的wonder woman，

  一下子她又墮落到戀愛之中，


  閃電俠明明是可以帥到大家眼睛發亮，

  卻在正式上映版本去救了不知為何出現的莫名其妙一家人；


  鋼骨明明串起了故事的主軸，

  正式上映版本竟然把他砍成無聊的配角，


  這要人如何進去戲院裡面享受故事？

  一部電影次次都有人格分裂、劇情分裂版本，誰會心服口服的進入戲院看DC？



  送DC一個幹，慢走不送！


  --'
