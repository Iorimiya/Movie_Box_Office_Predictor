title: '[  雷] 沙贊！眾神之怒'
content: '防雷




















































  當初看第一集覺得比想像中好一點

  當成兒童向超英其實也不會很不好

  第二集的話我只能說第一集能看的點不怎麼保留

  缺點倒是保存的很開心,甚至因戲外因素更被放大了

  我喜歡第一集兄弟姐妹們聯合戰鬥的場面

  第二集都是各玩各的居多（各自玩沙？

  比利身為男主角還是跟第一集一樣

  柴克萊威的演技已經被大家臭過一輪,總之普通

  這次後面更多他的戲份,我看到一半就在不專心了

  然後他媽的請來海倫米蘭跟劉玉玲

  結果我只記得劉玉玲騎著龍到處飛

  兩個高實力的演員前輩只能暫時博得注意,哭啊！

  加上戲外因素,這部電影真的蠻慘

  看兩段伏筆都覺得看了個寂寞

  不過這部電影鬧得笑話還比他精彩

  DCEU死透加上柴克萊威的言論

  真的只能對這些搖搖頭了,我現在只期待蝙蝠俠2

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  萊斯特在最後敘述中講述了生活中有意義的經驗，他說，儘管他死了，他還是很高興，因

  為這世界上有這麼多的美


  --'
