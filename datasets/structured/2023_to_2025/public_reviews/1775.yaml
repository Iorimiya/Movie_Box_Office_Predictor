url: https://www.ptt.cc/bbs/movie/M.1671417938.A.527.html
title: '[新聞] 巨石強森拒絕客串《沙贊！眾神之怒》？'
content: '巨石強森拒絕客串《沙贊！眾神之怒》？




  《黑亞當》劇照

  【文/Howard Stark】籌備多年、由巨石強森(Dwayne Johnson)主演的DC反英雄電影《黑

  亞當》（Black Adam）於今年十月上映後引起了不少的話題，而引起最多人關注的莫過於

  亨利卡維爾（Henry Cavill）飾演的「超人」重披戰袍、以及宣布不再演出超人一角。不

  過，近期卻有了另一個報導指出，巨石強森婉拒了另一部DC電影《沙贊！眾神之怒》（

  Shazam! Fury of the Gods）當中的客串演出。




  《黑亞當》劇照

  在DC新任執行長彼得沙佛蘭（Peter Safran）和詹姆斯岡恩(James Gunn)上任後，黑亞當

  未來是否會繼續於DC宇宙活躍仍是個謎，而這個同時身為沙贊一角的反派角色是否有機會

  同台登場亦替黑亞當的未來增添了幾分未知數。




  那麼黑亞當的未來將何去何從？若黑亞當真的會在《沙贊！眾神之怒》當中客串，那麼《

  沙贊！3》便有機會成形，而沙贊和黑亞當便會首次同台決戰。儘管《黑亞當》片中提及

  了《沙贊！》當中的神話傳說，但這部片並未嘗試和《沙贊！》有所連動，而巨石強森婉

  拒《沙贊！眾神之怒》客串的報導很有可能會替他不喜歡《沙贊！》系列電影的傳聞火上

  加油，雖然他本人目前未對此發表任何言論。




  巨石強森主演《黑亞當》描述黑亞當的起源故事。（圖／華納兄弟提供）


  現在更大的問題則落在因《黑亞當》的收益不佳，和DC影業目前對於未來的方針仍處不明

  的狀態，難以推斷《黑亞當》未來的發展究竟如何。根據詹姆斯岡恩近期公布的一些政策

  和發表的言論，許多人認為《黑亞當2》也會是變革的其中之一，而原因則是他們在未來

  很有可能重啟整個DC宇宙。截至目前，詹姆斯岡恩尚未具體表示他們會將舊有宇宙進行剷

  除抑或是純粹軟重啟，畢竟其中一些《正義聯盟》（Justice League）的演員和角色都仍

  存在。




  倘若只是軟重啟，那麼巨石強森就有機會重披戰袍飾演黑亞當，但也許僅有在其他電影中

  登場的可能性，並不會有自己的續集發展。假設巨石強森不喜歡《沙贊！》系列的傳聞是

  錯的，但他婉拒了《沙贊！眾神之怒》的客串消息為真，那麼他們依然能夠在未來將他們

  的決鬥搬上大銀幕。




  《黑亞當》帶著復仇從囚禁中覺醒。（圖／華納兄弟提供）

  如果他們繼續擔任DC宇宙的一員，黑亞當便有機會成為未來正義聯盟的大反派，而沙贊便

  會成為正義聯盟的成員，將一切帶回起點。但很遺憾的是，黑亞當目前看起來不會在《沙

  贊！眾神之怒》當中登場，而時間也會告訴我們黑亞當的未來將會如何發展。


  新聞網址：


  傳聞啦 傳聞 不過巨石努力拉亨利拉了這麼久 終於回來客串結果又這樣搞


  是我我也不屌岡恩了 新宇宙你自己想辦法


  --








  --'
