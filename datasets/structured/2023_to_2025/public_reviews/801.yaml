title: '[好雷] 變形金剛：源起。送給我那固執呵呵呵的老'
content: '雷文防雷資訊頁


  先講結論，

  個人認為是最好看的一部變形金剛，

  8歲跟10歲的小男孩也給很高的評價，

  想帶小孩去的，可以放心


  可惜的是因為帶小孩看，所以看中配，

  我應該會二刷聽一次英文原聲



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  在你的生命中是否也曾有一位這樣的朋友？

  在心裡已經譙了他千萬次：

  「媽的，你是想害死我嗎？」

  但每次他一約，總是又忘記了上次的教訓…

  我們總是黏在一起，一起幹蠢事。

  柯博文就是這樣的朋友


  當時的我們既單純又固執，

  固執地認為，朋友之間就是絕對的要好、相挺，

  但如果我們是敵人，我就要想辦法弄死你

  密卡登就是這麼的單純，這麼的固執。


  在某一天，發生了某個事件，

  我們兩個之間意見不合，

  於是就當不成朋友了。


  可惜的是我沒有柯博文的主角威能，

  可以不顧一切的用自己的生命去說服你放下，


  但幸好你也不像密卡登，

  反社會人格大爆發，變成了大反派。


  我們之間不用鬥個你死我活，

  只是我們再也沒有聯絡了，

  就連上次在麵店偶然相遇，

  我知道你看到了我，

  你也知道我看到了你

  但…我們就各自默默的吃著麵，然後各自離開。


  20多年了，你還是一樣常幹蠢事嗎？

  希望你一切安好。


  看這部電影時，

  早就知道柯博文與密卡登以後是宿敵，

  也正是因此，前半段很多友情的畫面，

  都帶給我很多的感動。


  我看「那些年」的時候，最後10分鐘的MV，

  因為想起了逝去的愛情而崩潰大哭，

  沒想到是看變形金剛，讓我想起了逝去的友情，在最後落淚。


  以上心得，分享給版友。

  -----

  Sent from JPTT on my iPhone


  --'
