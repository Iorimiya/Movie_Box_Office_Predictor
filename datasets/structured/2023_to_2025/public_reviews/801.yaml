url: https://www.ptt.cc/bbs/movie/M.1726399442.A.B1B.html
title: '[好雷]連刷兩次變形金剛：源起--白首相知猶按劍'
content: "如題，本來只打算加班的星期六晚上挑部片慶祝加班結束，結果變形金剛太好看了\n直接買下一場IMAX版再刷一次，這邊要講就是IMAX基本上就是很多細節能看得更清楚\n\
  \n而且一部片一小時40分鐘真的如夢似幻，完全不虧，強推各位把握場次衝一波啊啊啊！\n\n\n\n\n先大喊\n\n本片沒有地球與人類！\n\n\n\n本片沒有地球與人類！萬歲！\n\
  \n\n本片沒有地球與人類！萬歲！這值得三刷！\n\n\n\n以下有雷\n\n\n以下有雷\n\n\n以下有雷\n\n\n\n\n以下是超級超級巨雷！！慎入！\n\
  \n\n\n1.為啥這麼短呢？\n\n\n\n我先說一下缺點，就是跟很多人說的一樣，片長只有105分鐘其實是略短的，\n把漫畫他們在漫長的歲月中曾經攜手又決裂的過程寫得超級世界無敵快，\n\
  這會顯得密董的前身D-16的黑化有點來得太快，但不至於到不可理解。\n\n我想來想去，可能是因為派拉蒙和孩之寶在拍了前幾部大XX片的真人版後，\n終於清醒地意識到再搞下去真的輸到沒XX可以穿了，下定決定搏這一把，\n\
  \n只單純去講密卡登和柯博文的前身：D-16與奧利安的崛起。\n\n\n2.世界觀：\n\n賽博坦星球其實本身就是極巨大的變形金剛正義大帝化作星球後，從裡面湧現能源與火\n\
  種，進而誕生了變形金剛，變形金剛天生就有變形齒輪，可以變化成各種不同的樣子。\n\n而當現存最後一位至尊御天因為私欲謀害了所有至尊，向宿敵五面怪投誠後\n為了提供其穩定的能源，所以把一部份的變形金剛齒輪拔掉，變成礦工，也就是造成\n\
  身份階級差異，再驅使這些沒有辦法變形、不完整的礦工們去星球深部挖礦來抽取能源。\n\n本片主角：奧利安、D-16、艾麗塔與B-127就是無數礦工之一。\n\n\
  他們都相信總有一天，御天至尊會找回失落的母體然後星球能源重新復甦。\n\n\n3.永遠不對勁的奧利安派克斯和他的難兄難弟D-16XDXD\n\n雖然筆者這篇是正式心得，不過我還是要說，前面多甜蜜，後面多虐心。\n\
  \n奧利安派克斯是一個階級低的採礦工，但是他心中總有一種追求自由的慾望、\n一種莫名地對現實感到懷疑、想要找到答案、想要讓星球恢復傳說中盛況的\n想法始終在他大腦迴路中不斷重複，這使他常常潛入各地的圖書館尋找被封印的資料\n\
  然後被逮到就開始落跑，這個地方就可以看到他們所在的都市鐵堡，是一個非常奇幻美麗\n的地下都市，雖然它是誕生於謊言中，依靠對礦工的壓榨下有如此盛景。\n\n\n\
  每當奧利安遇到狀況，D-16總是會義不容辭相助，雖然他會吐槽我應該換個麻吉\n但我們都知道當時他心裡不是這麼想的。相對於大腦總有新想法的奧利安，\nD-16很顯然就是普通人，樸實、忠於內心的信仰（前任至尊也就是狂派金剛\n\
  標誌的起源）、對現狀深信不疑，對上位者的忠誠擁護等等。\n其實他們感情是很好的，D-16在看比賽時還眼睛閃閃發光地問奧利安說：「你是特地\n為了我嗎？」\n\n\
  但D-16的不幸就是在於他的好麻吉做什麼都要拖他下水，我是不想把這個當奧利安的\n缺點，但是他雖然勇敢、真誠、腦中永遠有不同他人的想法、心地仁厚絕不會拋棄同伴，\n\
  但有時候都會惹出波及他人的事情，那怕所有人都知道這是對的事情，\n這也是艾麗塔一開始超級超級超級不爽的原因。\n\n好的，總是就是一連串的狀況後，這對難兄難弟結識了級愛說話的狠角色B127\n\
  又在路上遇到艾麗塔（艾麗塔：X！老娘怎麼就是擺脫不了這災星！）\n然後一起坐特快車去了地表，要去找領導母體。\n\n\n在地表上，他們不但發現五面怪其實還在地表逡巡不去，他們還找到至尊們的遺體\n\
  \n沒想到還有一位鈦師傅居然還活著只是暫時關係，吃塊能量巧克力又醒了\n當鈦師傅醒過來後，他很驚訝這些礦工們為什麼沒有齒輪，然後說這一切都是御天的陰謀。\n\n\
  \n\n\n4.工具人鈦師傅\n\n為什麼很多人會覺得劇情衝太快就是，鈦師傅明明才重新開機10分鐘吧？結果又去\n見正義大帝和澤塔至尊了是怎樣？\n\n鈦師傅在這部片裡面就是工具金剛（無誤）\n\
  \n鈦師傅能力超多：VCR實況播放、幫奧利安一行人硬體升級、戰鬥型態還可以變形\n真的很難相信會被黑寡婦擊敗=__=，總之他最後斷後任務結束就下線了。\n\n\
  他在裡面作為一個承上啟下的作用，雖然是工具人不過還是值得給讚。\n\n\n\n這個地方小劇場一下：\n\n\n劇情唯一給鈦師傅過往的一點點線索，就是他應該跟澤塔至尊很好。\n\
  \n戰友掛了一地，他爬起來第一件事情是對澤塔至尊說：「我讓你失望了朋友」\n\n其他至尊英靈：好哦，我們不重要就是了。\n\n10分鐘解完任務後，鈦師傅就回去了。\n\
  \n其他至尊英靈：X！御天你這垃圾！還有老鈦你是不是放水！這麼大一隻\n連隻喇牙都打不過，是要騙誰！\n\n鈦師傅團作一團：貓貓很累了貓貓要休息。\n\n澤塔至尊抱著獸形的鈦師傅：羨慕嗎？我有貓貓你們沒有。\n\
  \n\n小劇場結束\n\n\n\n4.崩塌與背叛，憤怒與殺意\n\n先說御天的控制手段是極其聰明的：扼殺人才、控制輿論加上娛樂麻痺，\n如果不是一個大腦迴路特別活躍，總有新火星的奧利安派克斯，他應該可以一直騙下去。\n\
  \n關於這個部分與現實的呼應，筆者這篇文章已經很長，就不先一一交代。（其實是\n怕寫不好）\n\n\n在此先說D-16知曉真相的憤怒情緒我覺得是鋪陳不夠的，不過大致可以理解，\n\
  \n因為他全心全意地信任御天，所以當他知道御天只是一個背叛同伴、欺騙族人的偽君子時\n那種怒火的反撲就格外驚人。\n\n這也是他和奧利安的不同，奧利安不是不憤怒，但是觀眾會發現他的憤怒會很快消褪，\n\
  他思考的事如何讓所有人得到自由得回他們的齒輪以及揭破御天真面目後，讓所有人去\n正視現實，就某個方面來說，過往受到的苦難對他而言不是折磨，他只要事實被匡正\n\
  礦工得到自由，他的願望便達成。\n\n奧利安重視的始終是同伴的自由與平等，當他發現這一切不是出於想像，\n他反而是高興的，他認為轉機在眼前，一切會往好的方向發展。\n\
  \n但D-16卻是沉了下去。\n\nD-16卻彷彿獻於個人悲傷五循環中不能自拔，如果說他以前安於現狀、遵守約定，\n是因為他堅定地相信眼前一切存在即合理，那當這一切不合理時，他的怒火就會讓他\n\
  整個思考和感情模式出現極端反應，痛苦、憤怒然後轉變成殺意、以及對至尊的仇視。\n\nD-16必須如此憤怒與仇視至尊，才能解釋為什麼他寧可被驅逐也不願意支持柯博文，\n\
  被欺騙、被壓榨的憤怒最終燃盡了他們之間的友誼。\n\n\n5.至尊與梟雄，朋友與敵人\n\n\n當御天被打倒時，如何處治御天變成兩人決裂的導火線，\n當D-16開槍誤射奧利安，又在奧利安即將墜入星球深處時放手，D-16就已經死了。\n\
  \n我要先說，D-16即便成為密卡登，他還是深愛著奧利安的，當他奧對利安說「我不想再救\n你」了，他不是只是他面對自己傷害了奧利安，而是他認清事實，奧利安原來跟他從\n\
  不是一路人的事實，所以當他放手那一刻，D-16就消失了，剩下完全新生的密卡登。\n\n密卡登向過去訣別，那個曾經一心一意擁護至尊、相信規則、安於現狀的D-16\n\
  與他的朋友奧利安一起死去了。\n\n密卡登殺死了他眼前所有的敵人，把御天扯成兩半時，是因為他知道自己失去了什麼，\n認為這個世界必須以血和痛苦償還他\n\n\n\
  罷特\n\n永遠是這個壩特\n\n當密卡登還在向賽博坦呼喊這個世界不需要新的至尊時，現實打臉超快，\n\n奧利安受到正義大地與至尊英靈們的認可，胸口放入了領導母體，脫胎換骨變成\n\
  柯博文飛出地表，堂堂正正出現在所有賽博坦人面前。\n\n這裡有小劇場有1趴腐注意：\n\n\n密卡登瞳孔巨震：完了！現在下跪求前男友原諒還來得及嗎？線上求解！\n\
  \n柯博文怒氣騰騰：家暴林北還想求情？渣男都給林北去7414吧！納命來！\n\n\n\n\n我其實這個地方有點意外是，柯博文完全沒有要勸說密卡登放下武器一起執政的念頭，\n\
  在漫畫裡面我明明記得他們其實在一起守護賽博坦、對抗五面怪一段很長時間，\n怎麼出來後就是互毆場面。\n\n\n孩之寶：沒錢啦！\n\n派拉蒙：沒錢啦！\n\n\n\
  這個地方也可以看到柯博文清醒理智的一面，比起友情決裂的痛苦，\n\n作為Prime的他意識到密卡登的憤怒與偏激絕不可能因他成為Prime而化消，只會\n讓矛盾更加擴大。\n\
  \n所以他在擊敗了密卡登之後，毅然決然地放逐了他和天王星一群高至守衛\n\n至高守衛：欸等一下，關我們什麼事啊？Prime你先把我們50年份的薪水結一結！\n\n\
  作為柯博文，他對密卡登說：「我們本來可以一起統治這個星球，但你背\n棄了我們的信念。」\n\n\n奧利安就是柯博文，但是柯博文要為賽博坦做最好的考量，最正確的判斷，\n\
  奧利安不管多想挽回朋友D-16，他最多就是一句「你背叛了我。」\n那是他最後的一絲私心，從今往後他是柯博文，他要把一生奉獻給賽博坦，\n所以他不打算讓密卡登這麼不穩定又暴烈、對至尊充滿怨憤的存在放在鐵堡。\n\
  所以他放逐了密卡登，看著朋友一去不回。\n\n\n當年的一見如故，終於變成現在的分道揚鑣。\n\n這就是從最早的動畫與漫畫，狂派與博派變形金剛的分歧點開始，\n\
  往後漫長的歲月會發生的事情，以及發生在遙遠的地球的事情，其實大家都知道了。\n\n嚴格來說，優點和缺點大概上面幾篇文章都提過了，所以筆者也只是就本人\n\n一天連刷兩回的觀後感，寫成心得罷了。\n\
  \n說實在因為前面那幾部真的看到我懷疑人生，所以我這次本來猶豫很久，後來還是決定\n\n去看。\n\n幸好有去看，所以一定要發文力推這部電影！真的很怕接下來小丑和猛毒上映，\n\
  \n本來就不怎麼多的場次被砍光光！求大家一定要去看這部變形金剛：源起，\n錯過真的可惜！\n\n\nPS.這部片的配音卡司其實蠻厲害的\n\n柯博文是雷神克里斯，艾麗塔是史嘉蕾喬韓森（害我看到她打黑寡婦還說我會很溫\n\
  柔時整個大笑出聲），難怪他們整片都閨蜜感情。XDXD\n\n奧利安時，克里斯的聲線比較明顯，後來成為柯博文之後確實有感受到整個氣質變化\n 有接近之前電影柯博文的配音了，但是究竟有沒有很「柯博文」，我自己可以接受\n\
  但也接受所有道友看法。\n\n密卡登的配音員則是哥吉拉系列裡面那個喪妻後整天陰謀論的播客XDXD\n\n御天是喬漢姆（好預兆的天使長加百列和捍衛戰士裡的旋風）我倒是沒認出來，我超驚訝\n\
  的。\n鈦師傅則是勞倫斯‧費許朋\n\n感謝看到這裡的所有版友，再次懇求不要錯過這部變形金剛！它簡直不能更正確了！\n\n如果這部沒賺錢...........我我我我我怕孩子之寶沒賺到不拍下一集了QWQ\n\
  \n--\n江山易改，本性難移；江山縱改，本性不移。\n\n--\n\n\n\n我想三刷XD\n\n鈦師傅很可惜，如果將來有做上古源起講至尊們那一代的故事就好了\n\
  這部作品真的很不錯！\n\n\n沒有那些亂七八糟的劇情線，整個故事流暢多了，劇情平順合理，只是略快\n\n所以想努力推廣\n\n\n\n在變一裡面是說他們要找回被密卡登帶走的領導方塊，所以先派出大黃蜂來偵察\n\
  然後其他博派金剛收到訊息才降落的\n\n後來變成滯留在地球回不去，就沒有說明為什麼了。\n\n\n搞錯了這麼多次，可能會害正確的這次賣不好，所以要努力推廣（握拳）\n\
  \n\n有可能，唉。但是現在上串流也可能可以海撈一筆，如果是這樣我還是願意樂觀以待。\n\n\n\n相信串流上了也會收到好口碑，不過大銀幕看的感覺就是不一樣！\n\
  \n\n美版是雷神克里斯配的，我覺得他有配得漸入佳境\n\nQWQ 孩之寶好不容易正確一次啊\n\n\n一起刷起來\n\n\n他們很瞭解彼此，所以到了分道揚鑣的瞬間，他們誰也沒挽回（但好虐）\n\
  \n\n跳過沒關係，但請看在強推的份上給個機會進場刷這部片！！\n\n\n\n基本上前面是青梅竹馬，後面就是密卡登黑化-->擎天柱衝過來把他揍一頓\n\n開啟往後漫長的互毆歲月，，但就好看。\n\
  \n\n一天刷兩次，因為我真的很喜歡。"
