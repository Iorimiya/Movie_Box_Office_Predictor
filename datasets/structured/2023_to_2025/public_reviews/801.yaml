url: https://www.ptt.cc/bbs/movie/M.1726406942.A.74F.html
title: '[請益] 《變形金剛：源起》'
content: '我比較仔細看過的「變形金剛」系列電影，

  回想起來，好像只有第一集，

  是在有線電視 HBO 播放時看的。


  由於時間久遠，詳細劇情已不太記得（狂派博派我知道），

  只記得那時看完覺得：


  　1.滿好看的


  　2.頭滿暈的



  那時在想：


  　我光是看電視播這部片就感覺頭暈了，

  　如果是在電影院看大銀幕上巨大機器人不斷激烈翻滾格鬥變形，

  　不知道會不會像大暈車那樣嘔吐？～～



  後來幾部變形金剛，

  由於一般評價都不如第一集，

  加上自己看到頭暈的經驗，

  就都沒看過了。




  想請問看過《變形金剛：源起》的板友：


  　是否需要補完前面的系列，才看得懂這部片？

  　或是是否需要至少看過哪幾部前作？


  　看了本片之後，是否會有頭暈之類的感覺？

  　（在 2D 放映廳的情況下）




  看板友們的幾篇好無雷推薦，

  有點心動，想進電影院看大銀幕。


  （話說 LINE 電影區這部片的評論留言幾乎全是好評盛讚，

  　還滿少見的）


  如果不需要對系列前作大補完，

  而且畫面不至於讓人感覺很暈的話，

  就要準備找時間進場了。







  　　　　　　　　


  --'
