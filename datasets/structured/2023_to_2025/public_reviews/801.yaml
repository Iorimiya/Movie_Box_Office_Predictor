url: https://www.ptt.cc/bbs/movie/M.1726586893.A.B74.html
title: '[討論] 變形金剛源起幾個問題？(雷)'
content: '去看了，讚，沒有人類就沒有政治正確問題


  但看完後有幾個問題想請教討論：


  1. 御天至尊在變形金剛(西亞里畢福真人版)怎麼還活著？


  崛起了御天至尊跟爵士還有阿蘭吳一樣被撕成兩半，但之前電影版劇情是"御天至尊帶著

  希望逃離"，且黑化前大家都把它當神。


  可崛起篇裡柯密兩人都知道御天是"背骨"，有改劇情？


  2. 所以密卡登還在不爽什麼？

  D16(密卡登)之前就是不爽被御天至尊奴役，所以才要報復"趕盡殺絕"，但御天至尊就被

  幹掉了，他還在....不爽什麼？餘黨嗎？



  3. 之後是接動物嗎？

  以前看的版本是動物版"百變金剛"，也是刻畫博派狂派在不同星球爭搶資源。

  但想問動物版是類似外傳概念嗎？還是真人版是外傳？

  雖然之前有拍動物版(楊紫瓊演老鷹那個)，但百變金剛裡一堆角色像老鼠、銀狼跟黑寡婦

  都沒出現(不會是經費不夠吧)


  還請解惑，謝謝


  --

  感謝解惑

  果然又是改遍，就覺得太早分很怪

  感謝提醒'
