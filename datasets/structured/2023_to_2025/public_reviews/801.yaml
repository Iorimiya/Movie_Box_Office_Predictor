url: https://www.ptt.cc/bbs/movie/M.1726986067.A.4A2.html
title: 'Fw: [閒聊] 變形金剛起源 好看(雷)'
content: '作者: dukemon (dukemon) 看板: C_Chat

  標題: [閒聊] 變形金剛起源 好看

  時間: Sun Sep 22 14:15:33 2024





  防雷頁








































  因為御天真的太G8導致我當下完全支持D當場處決他


  暗殺至尊，奪走D偶像齒輪，拔新生變形金剛的齒輪貶為礦工


  之後還瘋狂嘲諷D，我看到D就算死都不願在他眼前跪地的瞬間我就成了D的粉絲了



  D的黑化這點其實很明顯可以看出來是最後一根稻草是奧利安


  在被天王星抓之前他就想跟奧利安說自己不會再服從任何人，只有一個人的話我會聽


  但他真正發自內心氣到想殺了那個G8至極的御天的時候卻是自己最信賴的奧利安出來阻止


  當奧利安捨身為御天檔招的當下，他第一時間是過去救人，


  但又按耐不住自己的憤怒就黑化了






  最後就是兩個互相傷害後無法同行的好友對決，拿到至尊之力的柯博文勝利


  密卡登對御天寧死不屈，但卻願意接受柯博文的放逐裁罰離開城市



  一開始是違反規則的奧利安拖著一直守秩序的D一起幹些蠢事


  結果到最後奧利安成了秩序的守護者柯博文，D則成了企圖粉碎秩序的叛逆者密卡登



  密卡登真的就是那種御天至尊的腐敗時代需要他，


  但柯博文正常治理的時代就不需要他的那種英雄啊......







  --'
