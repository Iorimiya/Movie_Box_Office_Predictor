title: '[好雷] 變形金剛：源起'
content: '防雷




























  變形金剛一直是我重要的電影童年

  麥可貝拍的再怎麼麥靠北,我還是很愛他的變形金剛

  至少滿滿的娛樂性,不帶腦看總能讓我津津有味

  除了5,我操你媽這到底是三小,真的超氣

  萬獸崛起是唯一沒看所以不知道如何

  而這部似乎評價不錯,正好有機會就來重溫

  最讓我開心的就是大部份角色我都認識

  果然我對變形金剛系列的喜愛沒有白費

  娛樂性其實相對比較還好,更多的是把故事接起來

  也就是柯博文和密卡登的愛恨情仇

  早在很多年前第一集就能感覺到他們有著過去

  所以看完最多的情緒是感嘆


  只是我很好奇這部跟前面的是同個宇宙嗎？

  應該是沒什麼出入,除了御天至尊明顯不一樣

  其他像是天王星震蕩波音波他們的來頭蠻合理

  我對賽博坦還在的故事本來就很有興趣

  跟五面怪的對立也是,話說5的昆特莎是同個族類？

  這些讓變形金剛更不只是我們印象中的戰鬥機器

  而是有著金屬身軀的外星機械生命體

  就像第三集御天至尊說的:

  在地球我們是機器,在賽博坦我們是神

  這部電影多少體現了這點

  希望還有續集延續更多變形金剛本身的故事

  我對變形金剛的愛又回來了喔耶


  ----

  Sent from  on my Samsung SM-S9280


  --

  我見過...你們這些人不會相信的事

  我目賭在獵戶座的邊緣著火的攻擊艦

  我看見C光束在湯豪色星門附近，在黑暗中閃亮著

  所有這些時刻都會消失...於時間中，一如眼淚...消失在雨中

  死期到了


  --'
