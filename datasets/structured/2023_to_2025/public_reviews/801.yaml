url: https://www.ptt.cc/bbs/movie/M.1726887390.A.7BF.html
title: '[好雷] 變形金剛源起 執著的是信念也是愛'
content: '雷文防雷資訊頁














  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  兩人之中，D-16比較愛奧利安。


  記得預告出來的時候有網友吐槽變形金剛

  做嘴唇頗恐怖谷，開場不久看到D-16掩

  護奧利安吃那一拳我忽然懂了，原來是為

  了呈現被揍的力道。老是幫攏溜連的奧利

  安擦屁股，一個走在遊戲規則裡的乖乖牌

  被留校察看的惹事仔牽著鼻子走。上窮碧

  落下黃泉，哥帶你去的不是搖滾區，是參

  與比賽本身、被打入地下50層、搭上死亡

  列車、親眼見到御天至尊的兩面。如果活

  在原本的框框裡就這麼一輩子當個礦工，

  永遠看不到那令人屏氣凝神的宇宙，對吧

  ？最重要的是，如果沒有遇見奧利安，跟

  著經歷這趟冒險，就不會有兩次升級的

  機會，也不會創立狂派成為首領。


  但是沒有遇見D-16的奧利安還是會有這

  趟冒險，只是身邊的同伴換作他人。是

  奧利安闖進D-16循規蹈矩的生命裡，給

  了他即使是奪走變形齒輪的人也奪不走的

  那胸口的火焰。對D-16來說奧利安永遠

  是最特別的存在，誰都不能取代，因為

  奧利安本身的好奇、勇敢、仁慈與充滿

  希望就像自體發光的恆星照亮他人，使得

  奧利安從一開始就和別的礦工不一樣，

  就連艾莉塔，這位品學兼優的優等生，

  樣樣比奧利安強都甘願化做奧利安最凶狠

  的拳頭效命於他。


  後來的轉變可以理解，一直以來的信仰

  乃至生命的意義瞬間被顛覆，那就忠於

  自己，只有自己不會背叛自己，這個世

  界除了自己誰都不能相信。


  是說升級完了為什麼還是妹妹頭呢？要

  當一個領導應該要刺龍刺鳳而不該是cosplay

  中國娃娃吧？看到低頭轉場讓千頭萬緒

  剪不斷理還亂的金色眼波暫時消失我忽

  然懂了，為了這黑化的流暢度才設計成

  妹妹頭的，對吧？我不殺博文，博文卻

  因我而死，夠了，表台詞是我不想再救

  你了，裡台詞是我不想再愛得遍體麟傷

  了，我對你最後的疼愛是手放開。


  啊，為好人壞人都願意犧牲的這份高尚

  情操竟得到二次升級並成為領導母體的

  持有者。好喔，娜烏西卡。


  進入賽博坦核心、參加至尊們的握手會

  、正義大帝親自頒獎，讓拿到偶像貼紙

  就爽歪歪的D-16顯得像個小丑，讓拿到

  御天至尊的變形齒輪後的密卡登還是只

  能當個力量無法對等的反派。說不定奧

  利安升級為柯博文後心也變了，說不定

  他不再念及舊情手下留情了，說不定他

  現在代表正義大帝要手持天平賞罰分明

  了，密卡登揮出拳頭的那一刻也許就沒

  想要活吧，然而這場戰役終究還是結束

  於放逐，密卡登也沒有選擇玉碎。愛的

  反面不是恨，而是漠不關心，恨也是一

  種激昂的情緒，在萬籟俱寂的宇宙裡反

  芻著過去的某個分岔點，蠶食著右手的

  某處傷口。


  兩人之中，密卡登比較愛柯博文。


  --


  「我對你掏心掏肺，情義相挺，

  你卻甘願為了我的仇敵捨命，

  好，換作是誰你都愛人如己，

  原來我在你心目中並不是最特別的那一個，

  這太傷人了，

  我不想在一段不平起平坐的關係中繼續下去，

  這真的顯得我像個傻瓜，

  我不再救你了，

  讓我們消失在彼此的生命都好過我一再忍讓你」


  大概是這樣吧'
