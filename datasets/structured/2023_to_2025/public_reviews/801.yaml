url: https://www.ptt.cc/bbs/movie/M.1726590115.A.88C.html
title: '[好雷]變形金剛緣起 原汁原味'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \ BGM支援\n\n看了板上逐漸冒出好雷文 總不會有那麼多公關洗地吧!\n\n雖然最初看預告畫面時 那個恐怖谷機人臉孔對我實在有點勸退\n\n不過還是趁中秋放假跟風去看了\
  \ 可惜整廳大約才坐4 5排左右吧...\n\n果然動畫片實在很難出圈 對現充(現實生活過得很充實的人)沒有號召力QQ\n\n雖然麥導版的真人電影票房每況愈下\
  \ 被各種嫌棄為了省CG經費搞太多人類篇幅\n\n而且明明原作劇情也沒有和地球人扯上關係 為了加真人進來劇本整組打掉重做\n\n但以現實票房號召力來說 真人電影無疑是成功的\n\
  \n我不禁在想 假設2007年出的電影是這部源起 雖然劇情是很正宗的賽博坦故事\n\n但可能出不了圈 票房就這樣啪沒了 然後後續難產......\n\n\n心得簡結\
  \ 劇情的部分可以說是非常合格 很好的把一個故事說完\n\n以同類型的起源故事來說 拍得是比魔獸崛起要來得好了\n\n動畫的呈現方式其實比我預期得還要好 不至於到G1那種純卡通\n\
  \n布景整體氛圍讓我聯想到戰鬥天使艾莉塔\n\n在某些時候的變形金剛CG在我心目中是及格可以與真人版看齊的\n\n例如鈦師傅的外觀就像真人電影那般的真實金屬感\n\
  \n而其他變形金剛有的時候身上那亮晶晶一塵不染毫無戰損的樣子就讓人很出戲\n\n還有那恐怖谷的臉部表情 反而是口罩戴起來的時候反而順眼多了\n\n\n當年經典片段\
  \ 尤其是變形時那金屬的層次感簡直讚到不行\n\n不得不說 麥導當初的CG做的真得很好 可惜到第4集cost down變身畫面後就爛掉了...\n\n\n\n\
  關於這部電影的心得 版上各位先進們已經講過了\n\n於是我想從設定的部分切入 聊聊這部與前作真人版甚至是原作的異同部分\n\n電影裡將始祖變形金剛Primus翻成正義大帝\
  \ 感覺有點微妙 畢竟沒有與正義連結的必要性\n\n反而是民間翻譯原始天尊信達皆得只差在雅 依我看翻成光之大帝/原始至尊都好一些\n\n\n正義大帝將自身變形成賽博坦星後\
  \ 創造出了第一批至尊(Prime)金剛\n\n而這些至尊與生俱來就有變形能力(鈦師傅可以變成動物)\n\n真人版聽說是因為墮落金剛(原名密卡托那斯至尊)本身能力太過強大(超空間瞬移)\n\
  \n因此拔掉了能變形宇宙飛船的能力 玩具是可以變形的\n\n\n正義大帝還留下了領導母體(Matrix)\n\n就我的理解是這東西可視為控制賽博坦星能量流動的鑰匙\n\
  \n總之在本作設定中 有了它才能讓整個星球流淌著能量(類似地球的水系)\n\n在50週期(時間單位 猜測是行星公轉週期)前\n\n與變形金剛宿敵五面怪(Quintessons)(真人版叫昆特莎)的戰爭中丟失\n\
  \n導致星球上沒有了自然流淌的能量 機人們只能轉進地底 靠著挖礦開採的能量塊維生\n\n而地表已是一片荒蕪 除了地貌會劇烈變動外 還有五面怪的獵殺艦隊出沒\n\n\
  \n主角柯博文原名奧利安派克斯(CV克里斯·漢斯沃) 居然不是叫Convoy\n\n原本我希望御用CV彼得庫倫配音 結果聽到主角聲線超年輕一點都不像有點失望\n\
  \n還好後期成為至尊後的聲線開始有磁性了 讚讚\n\n男二密卡登(名字源自其偶像密卡托那斯至尊)原名D-16\n\n兩人以採礦機器人的身分出生 胸口是空的 沒有變形齒輪\
  \ 無法變形\n\n這是本作的設定 真人版的胸口放的是他們的火種(Spark)&生命之源 受到傷害就會死\n\n而本作也有提到即使他們的齒輪被取走 他們的火種仍存在他們心中\n\
  \n估計這裡的火種比較類似靈魂的設定 沒辦法掏心給人看到的\n\n劇情後面才會提到礦工階級的變形齒輪是被統治者刻意剝奪的 以塑造階級差異\n\n讓變形金剛階級能奴役礦工階級讓他們無多餘力量反抗乖乖工作到死\n\
  \n\n至於變形金剛如何出生 本作沒有設定 只知道不是像有機生命體那樣靠生殖的方式\n\n因此他們沒有父母親人 只有親友\n\n從前作來看 估計是可以透過領導矩陣存取行星內核火種源(All\
  \ Spark)中的情報\n\n以誕生新的變形金剛\n\n另外 真人版也沒有明確說明至尊的位置是如何繼承\n\n除了始祖7至尊外 柯博文是如何成為至尊的\n\n\
  電影45集中好像有老人金剛認為他是至尊的後代 但是變形金剛又沒有生殖能力...\n\n只有在第5集中提到柯博文是昆特莎創造出來的13騎士之一\n\n原本目的是用來管理賽博坦人\n\
  \n只是後來柯博文外的那幾位忘了為啥跑來地球 和亞瑟王貼貼= =a\n\n\n原作包含真人版設定 最初是正義大帝與尤尼克隆Unicron互相爭鬥\n\n前者打爆後者後變形成賽博坦星並創造出第一批至尊金剛\n\
  \n(真人版是7隻至尊 被打爆的尤尼克隆化為地球陷入沉睡)\n\n但是賽博坦星的能量不是無限的 至尊們因此要向外星系尋求恆星\n\n並發明恆星收割器 藉此摧毀恆星獲得能量帶回挹注賽博坦\n\
  \n但後來密卡托納菲斯至尊因為無視不得在有智慧生物星系的恆星進行收割的禁令\n\n變成墮落金剛 在地球建造收割器後卻還沒來得及摧毀太陽就被其他至尊圍攻\n\n\
  至尊們犧牲自身將他封印\n\n......但是真人版的御天至尊沒有參與這場大戰喔!還一直活著成為賽博坦星領袖\n\n到狂博大戰末期 他隻身前往地球尋找火種源時被狂派擊毀在月球上為止\n\
  \n這點倒是跟本作一樣 他是賽博坦星最後一位活著的至尊金剛\n\n\n而本作與前作最大的劇情差異 在於主角2人對抗的反派擔當\n\n前作是反抗五面怪的統治\n\n\
  但反抗成功後卻演變成民用機人(日後的博派)與軍工機人(日後的狂派)的內戰\n\n也因此博派通常變身成民用交通工具 火力也較弱 通常不會飛\n\n狂派則會變身成軍武\
  \ 火力也較強 有些會變身成飛行器\n\n而本作中最初的狂派組成為密卡登+當年的至尊衛隊\n\n而本作的反派擔當 變成了御天至尊= = 重啟世界觀最大的分歧點\n\
  \n人設也與真人版有很大出入\n\n真人版我將其評為自命清高的老頭 而動畫版則是一個討厭聽大道理的綏靖主義者\n\n真人版還沒老番癲前 是主角兩人都誓命追隨反抗五面怪統治的賽博坦領袖\n\
  \n後來可能也有因為密卡登認為御天偏心柯博文將其視為接班人導致後來造反\n\n結果狂博內戰打到最後火種源噴到外太空不知去向(被尤尼克隆吸引往地球飛)\n\n這老頭居然偷偷與狂派高層內通要尋回火種源\
  \ 結果被不知情的狂派士兵擊落在月球\n\n真人電影第3集被帶回地球救醒後 在柯博文面前正氣凜然的接收回領導矩陣\n\n結果人後卻在密謀使用能量柱要傳送整個賽博坦過來吸收火種源\n\
  \n甚至不排斥奴役地球人來復興賽博坦 這樣的舉動已經與信仰自由自主的博派背離了\n\n柯博文就是堅持著這個博派的信念 即使流亡到地球 也尊重地球人的自由自主\n\
  \n而不會利用自身強度高地球人一截而產生統治或是奴役的念頭\n\n(結果就是各種被地球人婊 人類虐我千百遍 我待人類如初戀)\n\n甚至為了堅持自身理念為地球人挺身而出\n\
  \n不惜殘殺狂派的賽博坦同胞也要阻止他們不擇手段復興賽博坦的行為\n\n請讓我稱其為變形金剛界的一頁書lol\n\n\n在動畫電影中的御天至尊 則是因為自認為打不贏與五面怪的戰爭\n\
  \n加上討厭其他至尊們滿口仁義道德不畏犧牲成仁取義的老生常談\n\n因此在50週期前與五面怪內通 放假情報集合所有至尊再伏擊以一舉殲滅\n\n原本打著算盤想要接收領導矩陣\
  \ 結果矩陣卻和真人版第2集一樣可以隨時化成灰不見\n\n導致賽博坦星的能量流全沒了\n\n事後臣服於五面怪 將地表讓給他們 轉進地下 並創造新一批機人同時剝奪其變形齒輪\n\
  \n使其成為採礦機器人的奴隸階級負責在地下挖礦冶練能量礦\n\n不只供機人們維生 同時還定期運往地面上上貢給五面怪\n\n而他則透過媒體將自己塑造成冒著地表危險不斷進行地上調查尋找領導矩陣下落的領袖\n\
  \n以此維持其統治不墜 並將不知實情的子民們關在地底(牆內)\n\n而少數知道真相 以天王星聲波震盪波的至尊衛隊們 只能成為反抗軍在地表上逃竄\n\n除了躲避五面怪索敵外\
  \ 就偶爾侵擾御天至尊的人馬 當作自己有在做事的自慰\n(然後被D-16嗆爆)\n\n\n關於領導矩陣 跟前作一樣有著承認崇高人格的對象後便會直接顯現的能力\n\
  \n真人版第2集男主角本來拿到矩陣的瞬間化成灰 後來一個彌留之中和至尊們蕉流後\n\n直接被承認 手上直接變出領袖矩陣拿來復活柯博文\n\n原作好像傳給沒有被矩陣承認的領袖的話無法發揮全部的力量\n\
  \n本作則是御天拿到時直接消失 主角瀕死墜入星球核心(火種源)時受到承認\n\n憑空冒出矩陣給他 並得到強化成為被前代承認的新任至尊柯博文\n\n也就是說在本作的設定\
  \ 要成為新任至尊是靠矩陣承認其有著高尚的情操\n\n\n關於D-16黑化成密卡登 前作的設定是其有受到墮落金剛的蠱惑\n\n而本作沒有墮落金剛的設定 密卡托那斯至尊只是個最能打的至尊\
  \ 到死都沒黑化\n\n他是因為自己對御天至尊的信仰一夕崩塌 再加上得到變形力量後逐漸走偏\n\n變成反抗任何人領導甚至反抗至尊(包含柯博文)的一個以力服人的密卡登\n\
  \n除非要設定成他最初接收洞穴中陣亡的至尊變形齒輪時\n\n剛好接收到某位墮落金剛的齒輪 心靈被汙染\n\n\n至於每代的戰鬥力比較 基本上我認為根本是唯心論沒得比\
  \ 劇情說了算\n\n劇本說要讓誰贏誰就贏\n\n至尊理論上戰鬥力是比較強 體型也會比較大\n\n但是劇情中也沒特別描述至尊有什麼獨門力量 讓墮落金剛忌憚到要等柯死了才出山\n\
  \n頂多提到受到矩陣承認的機人會受到其buff而強化\n\n像是真人版第2集 密卡登不是至尊 還是能在森林之戰中殺了柯博文\n\n而第3集老柯還能以一敵二左砲打密卡登右手撕御天至尊\n\
  \n本作中D-16在抓住御天至尊摔下高樓後 便強度逆轉開始打到他無還手之力\n\n最後更是直接發他便當 打到最後完全看不出至尊到底強在哪\n\n\n而關於變形金剛們死亡與復活倒是挺方便主義的\n\
  \n真人版第1集老柯要主角萬一無法守住火種源時便將其塞入他胸膛讓兩者同歸於盡\n\n主角變反向想到用此法來秒殺密卡登\n\n但第2集狂派拿到火種源碎片往密卡登屍體一戳\
  \ 便能直接復活\n\n而且理論上只要能量夠 變形金剛的傷勢都有辦法自我修復(但大黃蜂聲帶不能自修?)\n\n但是復活後的密卡登好像因為能量一直不夠導致舊傷未癒戰鬥力比不上老柯\n\
  \n第3集2打1結果還是直接再次被發便當\n\n老柯也是在第2集被貫胸殺死後 靠領導矩陣一戳照樣能復活\n\n本作則有遭受伏擊雖然沒死(核心仍在活動)但關機的鈦師傅\
  \ 直接餵他能量塊喚醒\n\n重傷瀕死的主角接收到火種源和領導矩陣力量後直接滿血復活還成為至尊\n\n基本上 我現在是把變形金剛的生命型態 用《轉生蜘蛛》這部作品的神來作為比照\n\
  \n在《轉生蜘蛛》的設定中 神基本上就是靈魂容量極高內含能源極多的生命體\n\n即使受到傷害 也能消耗自身能源進行回復 可以說在自身能源耗盡前就是不死之身\n\n\
  要殺死神 只能靠針對靈魂進行攻擊的外道魔法跟深淵魔法\n\n不是直接對靈魂進行攻擊使其直接損失能源\n\n就是靠飽和攻擊使神不斷消耗能源修復肉體 直至能源耗盡\n\
  \n而正義大帝a.k.a.賽博坦星 本身就是個能源超多的生命體 稱其為神族亦不為過\n\n而變形金剛們其實也是靠其內核的火種(Spark)的能量來驅動其生命的\n\
  \n就算受到槍械砲火攻擊也不像人類一樣容易即死(除非直接貫穿軀幹或頭部)\n\n只要能量沒耗盡 過一段時間就跟沒事一樣再站起來\n\n所以處刑敵人通常是用冷兵器或者手撕來肢解比較多\n\
  \n然而就算死亡 只要有火種源或領導矩陣等級的能量體供給核心能量 就能再次復活\n\n不過關於衰老與壽命的部分就比較迷了 例如真人版第2集中的天火便垂垂老矣行將就木\n\
  \n但理論上應該跟他差不多老的御天就沒這麼虛弱\n\n\n\n最後談談主角兩人最後走向分道揚鑣\n\n有點可惜的是兩人最後已無任何情分 就像是無間道二結局的黃sir跟韓琛那樣\n\
  \n而不是明明兩人惺惺相惜卻因為理念無法相容而不得不兵戎相見(瑞笙v.s.趙活)\n\n因應篇幅關係 關於D-16黑化成密卡登的鋪陳略顯不夠圓滿\n\n我原本以為他在拉住主角時\
  \ 會被後面得到喘息之機的御天至尊背刺\n\n於是徹底黑化 證明了御天至尊這種傢伙非剷除不可 主角的理念太過天真\n\n沒想到戰鬥終局的御天至尊弱到一個不行......\n\
  \n\n--"
