title: '[超好雷] 變形金剛：源起（無雷）'
content: '超級好看

  尤其是我完全不抱著任何期待的心情去看

  看完整場雞皮疙瘩

  有歡笑淚水 交代了

  柯博文跟密卡登的宿敵由來

  還有講到狂派是怎麼創立的跟天王星的故事（很小一段

  然後御天至尊的個性有夠像護國超人（有看黑袍糾察隊的話就懂了

  說話模式跟姿勢都超級討人厭

  整個動畫水平跟節奏掌握不輸蜘蛛人新宇宙

  建議大家也去看 尤其是前幾代的粉絲

  這部絕對不會讓你們失望




  -----

  Sent from JPTT on my Samsung SM-S9280.


