url: https://www.ptt.cc/bbs/movie/M.1726374637.A.3C3.html
title: '[好雷]變形金剛源起 沉浸式的了解變形金剛(無雷)'
content: '無劇情雷，只講推薦的點

  前提是大家都知道這是一部沒有人類劇情的變形金剛CGI電影




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  (推薦正文開始)



  變形金剛源起，一部終於把劇情重點跟主軸全部都聚焦在片名「變形金剛」上的電影。

  本片劇情線單純，但卻擁有起承轉合、角色又有血有肉，重點是這部的呈現又是完全

  以主角的視角出發，畢竟這次的主角終於是個變形金剛、而不是個置身事外的人類，

  所以以融入劇情又深入淺出的方式，帶出了變形金剛的設定與淵源。


  又因為劇情跟設定不屬於任何一部已存在版本的變形金剛電影，所以設定通通都是重新

  設計過的，就算是從來沒看懂變形金剛、或是從來不了解變形金剛的觀影者，也可以

  輕鬆了解這部的設定。


  如果是變形金剛的老粉，那這一部不管是設定、配樂、小彩蛋等等，元素都塞得夠多又

  夠滿，絕對是看一次覺得琳瑯滿目、看多次又能細細品味的佳作!!


  以往Michael Bay的真人版變形金剛，整天爆炸、變形金剛滾來滾去，煙塵滾滾又畫面

  凌亂，甚至連變形金剛到底誰是誰、誰在幹什麼都看不清楚，


  這次源起動畫因為色調鮮明，每個變形金剛除了由自介、或是他人的描述來好好介紹自

  己之外，又都採用了容易辨認清楚的色彩，所以你一眼就可以看出誰是誰、正在幹什麼。


  這部純變形金剛的電影，沒有中國的爛置入性行銷、沒有美軍的軍武展示、沒有不知道

  自己到底在哪裡在幹嘛的人類，也沒有不知道自己到底在幹嘛、又在哪裡的變形金剛。


  他有的，就是好好讓角色說故事、好好講述設定，又能讓人感到心曠神怡的外星風景。




  提到風景，就不得不提，這部的美術很棒~音樂也很棒~


  聲光、特效等效果，絕對不輸給任何一部真人電影。


  美術設定會讓人看到一個從來沒有在真人電影中多加展示的賽柏坦多面相的風景，以及

  人文風情，劇情更是以角色的自述，讓人深入了解賽柏坦的社會制度，而這一點在整部

  劇情當中又很重要，為什麼變形金剛會充滿衝突，乃至於發動戰爭，戰爭硝煙甚至蔓延

  到別的星際之外，這一部電影都在講述這個前提，絕對是變形金剛粉絲希望能夠了解的

  、也是新入坑粉絲可以輕鬆了解的前傳電影。


  有人擔心這部動畫片，是不是太過幼稚、是只給小孩子看的，這裡也必須說，這部電影

  絕對沒那麼簡單。電影的結尾，會切身讓人感受到這並不是給小孩子看的迪士尼或皮克

  斯電影式結尾，而是更貼近現實種種層面的衝突感，不提及劇透，所以不能說太多，只

  能說這部小孩子可以看得歡樂，但是大孩子與大人也是看了心情會有沉重感的一部電影

  ，這必須觀影體會，涉及劇情，就只能講到這裡了。


  要說這片有沒有缺點，有，還是有的。也許是時長限制，有些發展實在是太快，在第一次

  觀影時會覺得突兀，要靠先了解前因後果之後，再重看一遍才能稍微解釋那個奇妙的違和

  感與發展過於快速的衝突感。


  還有，就是時長真的太短了!!!!!!


  以往真人電影都可以近2個小時，花很多畫面在人類不知道自己在幹什麼的描述上，這部

  從頭到尾都知道自己在幹嘛的電影只有100多分鐘的篇幅，實在是不夠啊......


  缺點就是，看不夠、還想再看更多、還希望角色的獨白更多!


  所以誠心推薦大家都去電影院看一眼，看看這才是所謂的變形金剛電影~!


  --

  我的噗浪:




  --'
