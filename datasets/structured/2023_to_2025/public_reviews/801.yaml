url: https://www.ptt.cc/bbs/movie/M.1726381177.A.214.html
title: '[好無雷] 變形金剛源起，值得進戲院看一次'
content: '戲院人超少，很可惜啊！


  早上看imax, 全場應該不到20人吧


  看起來都大叔級老粉，小孩也沒幾個(可能是英文版有差)


  孩之寶整個ip經營的實在是….唉


  上一部萬獸崛起實在不行，劇情鳥以外，原本應該是重點的野獸金剛幾乎都來打醬油，大家最討厭的人類戲份又找政確女角，搞屁，我是來看美女洗車的！




  離題，趕快來推坑一下


  這次的電影絕對值得進戲院一看


  動作聲光真的非常用心，變形、戰鬥、追逐、素肚與激情通通有，絕對不輸甚至超越真人電影。而且電影長度剛好，不會像以前麥可貝那樣炸到後面都麻痺了


  劇情方面就是流暢，好看，而且重點是不幼稚(但也不會有什麼成人黑暗劇情啦)，我和小孩都看的超開心，我甚至有點熱淚盈框


  老粉不用說了，光在各個畫面找製作組藏的經典角色就夠我再刷一次，這次的劇情也很適合非粉絲來入坑


  對了結尾彩蛋有兩個


  很期待這系列的第二集或衍生動畫！



  -----

  Sent from JPTT on my iPhone


  --'
