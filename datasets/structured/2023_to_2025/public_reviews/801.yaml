url: https://www.ptt.cc/bbs/movie/M.1726418857.A.DA8.html
title: '[好雷] 變形金剛：源起'
content: '雷文防雷資訊頁


  有雷


  有雷


  真的有雷


  請小心


  有雷







  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  剛剛看完馬上來打熱騰騰心得


  南紡威秀22:15的一般場（英）


  目測約10人左右


  __


  先講3點結論

  1. 好看，算值回票價，畫面、場景很頂

  2. 近10年最佳變形金剛電影，因為沒有人類

  3. 御天的臉...


  __


  憑印象分享一下大綱


  Pax跟D-16因挖礦認識成為麻吉，Pax好奇勇敢的個性帶領主角一群人意外拿回變形能力，

  也發現了原本的挖礦生活是御天背叛賽博坦元老至尊們而設立的騙局。Pax和D-16兩人也因

  為後來的想法不同而分道揚鑣，最後成為我們熟知的博派和狂派。


  __


  個人心得：


  這次艾莉塔跟B比較像是點綴，給一些感情效果還有笑點。我覺得就像宣傳時官方給的註解

  ：「Built like brothers. Forged into enemies.」一樣，真的是會為這兩位感到惋惜，

  尤其是D-16放手對Pax說我不會再救你的那幕，真的是...有被戳到。


  雖然這部是動畫，但大人看也很適合！


  __


  講講我認為的優缺點


  優點


  畫面很棒，笑點不錯

  劇情好懂不會拖，節奏算緊湊

  故事前後主角的個性反差有做出來


  缺點


  角色的內心故事還可以在鋪陳多一點

  御天的臉太玩具了


  __



  以上，推薦大家可以去看


  --



  打太興奮了 謝謝'
