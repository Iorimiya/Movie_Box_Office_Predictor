title: '[好雷] 變形金剛：源起 Transformers One'
content: '好看，值得進電影院觀賞！



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  雖然不是變形金剛粉，但不知不覺也看完了前面的電影1-5、大黃峰及萬獸崛起，不敢說

  這部最優，但絕對是我個人最喜歡的


  源起是動畫電影，畫面看起來跟之前的真人版電影不一樣，變形金剛看起來就比較偏向卡

  通化，好像有些人就是比較不喜歡美式動畫風格就只愛真人電影的那種金屬機械質感，但

  我覺得卡通臉其實看起來很生動，感受得到角色的情緒，而且在變形後看起來都變得好~

  可愛XD但質感還是很棒的，至尊墳場那一段鈦師傅的外表感覺反倒是比較偏向以前的電影

  金屬質感(而且他沒有卡通臉XD)。


  這次的主要角色是：奧利安派克斯(我簡稱他是OP，後來的柯博文)，D-16(後來的密卡稱)

  、艾麗塔、B-127(簡稱B=Bee)，其他角色：御天至尊、黑寡婦、天王星、聲波、震盪波、

  鈦師傅等


  主要角色刻劃的都很不錯，OP整天搞事，D-16負責善後擦屁股，艾麗塔吐槽役，阿B搞笑

  役，

  話說回來一開始他們說自己沒有變形齒輪不能變形這件事我還沒有意味到這是什麼意思，

  原來他們不能變形就沒有戰鬥能力，沒有戰鬥能力就是下等人！就只能一輩子當社畜！還

  是最基層的那種！真是有夠符合人類社會現況。


  所以OP和艾麗塔想要突破現狀拼命想往上爬，只是做法不同


  其實蠻欣賞D-16男兒膝下有黃金，死都不跪渣男的風骨，就是腦筋有點太一直線，個性也

  很倔導致後面好兄弟撕破臉回不去了。


  艾麗塔因為上半身短下半身長的比例加上桃紅配色看起來超好看，本身似乎沒辦法像其他

  人一樣變出專武，單純靠體術或撿地上武器開扁，有夠帥的！


  阿B的造型我感覺是跟後來差最多的，外表黃色塗裝如果能再鮮豔一點會更美，不過B最自

  豪的手刀確實很酷！


  御天可能是因為先入為主的關係，覺得他一臉渣男樣，前傳就是會這樣，就是知道這人有

  鬼，只是本來以為是個有點本事的，結果比想像中還廢柴，一下就被撕爛，難怪只能靠五

  臉怪過活，不過我覺得他的造型和藍金配色是最漂亮的，很帥啊，孩之寶快出玩具啊！


  然後好像有在賽車觀眾席以及最後分齒輪的地方有看到雅希，以及一開始礦坑事故跟後面

  有一點點點點爵士的戲份，其他的都認不出來誰是誰了，不過這樣也好，劇情簡單不拖泥

  帶水，角色單純不複雜，雖然他們跟我們認知的個性略有不同，但因為是早期的故事所以

  就把這些角色當成是青少年在看，角色間的互動很中二，蠻好笑的。


  笑點的部份一開始檔案室的檔案跳針我就笑了，阿B的「狠角色金剛」也有戳到我的笑點

  ，雖然第2次第3次就沒有那麼好笑了，他們初次變形的冏樣也，OP要艾莉塔不要把黑寡婦

  打死那段也好笑，不過OP說他手指會變形我實在GET不到這是什麼梗。


  配樂的話好像沒有像萬獸崛起那樣有印象深刻的，不過片尾曲蠻好聽的，If I Fall：



  要說缺點的話我還是覺得配角的刻畫太弱，像艾麗塔、阿B、天王星等等，由其是在我心

  目中也排得上是A咖等級的天王星，剛出場的時候還嗆得很大聲，後段就沒台詞了，可能

  還是受限於篇幅吧，連D-16黑化翻臉得速度都比賽車的速度還快，可見要在短短的100分

  鐘要講完故事也是不容易的。


  總之本部電影各方面表現都蠻優秀的，個人對這部的評價很高，現在只希望這部的票房能

  衝上來，才能看到續集，不過我們這裡的場次很少感覺不太樂觀，這部看起來也沒什麼在

  宣傳的樣子；而且話說回來雖說這部是普級，但我覺得太小的小朋友可能也不太適合觀看

  …


  中文配音還可以，但是在御天手持領導母源消失的那場戲好像沒配到中文的樣子，我聽到

  他喊no不知道是不是我聽錯了。


  電影有送一張OP的小海報，會想再去二刷英文版~


  --'
