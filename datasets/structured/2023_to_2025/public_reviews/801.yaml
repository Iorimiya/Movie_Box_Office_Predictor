url: https://www.ptt.cc/bbs/movie/M.1726582306.A.A0D.html
title: '[極好雷] 變形金剛 源起'
content: '大家好


  變形金剛30幾年狂粉來報到了


  這片我評價為8部裡面最頂




  以下來做一點心得分享


  希望可以幫一些不了解變形金剛的更了解變形金剛


  變形金剛一開始是美國卡通


  大多都是在演述好人博派跟狂派的戰爭


  很多的設定一開始是沒有的


  是後來才由漫畫版本去補充


  後來很多版本的卡通


  也會去一點一點補充到故事設定




  電影版1~3集是一個系列


  電影版4~5是一個系列


  大黃蜂則是外傳講述他個人的故事



  萬獸崛起(TF 7)  也可以當作是一個新系列的開端


  真人版電影演的金剛王、那幾隻動物百變金剛 是 博派的後代


  正確設定上是不可能並肩作戰


  以人類來比方就是張飛關羽跟岳飛一起打曹操









  正文開始


  這部片即便你完全沒看過變形金剛的電影、卡通都非常推薦來看


  它一開始將變形金剛的祖先、起源故事很快速地說明了一遍




  這點真的很棒，因為其實真正懂故事的人只有一些狂粉


  打個比方好了


  沒看鬼滅的  只知道主角是在打鬼


  但可能不知道原因是家人被殺、鬼王跟主角一家有淵源


  再者，變形金剛真的狂粉我把他分為兩個世代



  1.G1世代 1985看卡通版本後喜歡上


  追後續推出的卡通、漫畫、真人版等


  這世代的認識的變形金剛非常多


  也因為有美日版卡通


  角色也開始很多不同


  日版卡通有很多角色幾乎都沒有出在真人版本



  2.電影版入坑的


  電影版因為要加入大量人類戲份


  加上時間短，必須要快速在兩三小時內演完


  所以很多都大量改變，可以當外傳去看


  很多設定都不是"正史"





  起源 這次做得很好的一件事情


  就是他在短短的100多分鐘將故事大致說完


  他將


  柯博文=奧利安  D-16=密卡登


  B=大黃蜂=我超猛機器人



  的故事演給你看


  劇情當然還是跟原本變形金剛故事有改編


  但80%都是正確的




  這次有笑點有戰鬥有特效


  因為有這一集的誕生


  你才會知道博派狂派到底在打什麼


  也因為這一集是動畫


  可以吸引更多小孩子可以看


  也更加了解到這個IP




  然後，真的完全不需要人類戲份


  大家就是來看變形金剛的







  自從死仕打破第四面牆後


  變形金剛這次的採用也真的超棒


  彷彿你也是在現場


  在電影院看到這幕還傻了一下以為畫面有問題


  這點真的處理的很棒






  大黃蜂從頭到尾說個不停外加說自己是超猛機器人


  呼應到片尾也刺到很多笑點




  片中的競速障礙賽也非常有趣


  這劇情安插非常畫龍點睛




  奧利安這個柯博文的前身


  也在這次劇情讓大家看到柯博文很多不成熟的一面


  比較起來，密卡登、艾莉塔都比較奉公守法


  甚至是它致敬星爵的手指變身(?)


  這次的源起拍得很好的部分


  就是讓你看到主角的成長或是改變



  奧利安非常有勇氣


  但做事也不管後果



  D-16、艾莉塔遵守紀律


  但如果一直都不做改變


  永遠不知道真相







  大戰過後


  追隨密卡登的狂派一族是地面上的戰鬥部隊


  天王星 震波 音波等飛機小隊


  這些人是本來就可以變形，也完全了解他們敵人是御天至尊跟五面怪


  只是領袖太弱，天王星不敢殺過去鐵堡，也沒有打算跟鐵堡的同族人聯絡


  簡單來說可以把他們當作一群遊牧民族


  誰拳頭大誰就是老大


  密卡登展現了他的實力外加殺死御天至尊


  自然而然會全部想跟隨他


  它們都是主戰派的戰士


  不可能想跟隨柯博文


  這部片演繹得很好的一點是


  壞人其實不是一開始就是壞人


  而是立場不同


  以密卡登立場


  他覺得被騙了一輩子，一堆同胞受苦


  祖先、偶像被騙而死


  這些都導致他的黑化


  御天死後也要殺光所有知情的御天同黨


  這點真的演得很好


  現實生活中就是那種被壓榨一輩子


  本來甘願認份，希望努力工作幫國家做出貢獻


  到頭來發現全部都是騙局


  在幫仇人工作


  知道的一切都是馬雷人編織的騙局(錯棚)


  所以當然會想殺光馬雷人對吧? (????)







  追隨柯博文的博派就是王道漫畫那種超級好人


  知道實情後就打算放御天至尊一命


  得到絕對力量後也只是打跑密卡登而已


  這種大愛不貼近真實世界


  但不管對方是好是壞都願意犧牲


  柯博文這樣的大愛也讓他成為第13至尊


  拿到領袖之証




  至於最後分為狂、博兩派


  都是為了賽博坦好


  幹嘛還要打鬥


  廢話要騙你來看續集阿(誤)



  因為很簡單，主事者領袖對事的意見肯定不同



  柯博文主事


  再次遇到五面怪襲擊，防禦、打跑五面怪就好



  密卡登主事


  殺光五面怪永絕後患，甚至現在可能就想直接整團帶過去打


  注意，這裡說的整團是指全部賽博坦人


  然後這集的密卡登這種鐵錚錚硬漢


  電影第4還是5你演跟地球人談判放囚犯真的人設直接崩


  電影1密卡登是直接開殺耶


  密卡登就算下屬被抓也會當寧可放棄讓它去死也不可能談判


  除非被綁的是極度重要的


  但那集裡面的都是一堆雜兵











  最後真的大推這部變形金剛


  我心中的排名是


  源起>1>3>2>7>6(大黃蜂)>4>5






  --

  百變當初就是3D的   如果期待的是動物猛獸只能看到很少


  但3D動畫應該合胃口


  我沒特別記耶XDD   震波我印象中  台灣也會叫震波 震盪波都會啦


  畢竟 SHOCKWAVE  兩個都翻得通


  倒是密卡登 柯博文  不會去叫成 威震天跟擎天柱就是'
