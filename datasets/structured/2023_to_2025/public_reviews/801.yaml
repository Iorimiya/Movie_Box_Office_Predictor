title: '[新聞]《變形金剛：源起》攻佔北美新片冠軍！觀'
content: '新聞網址：



  自由時報 2024/09/23 07:10


  〔記者許世穎／綜合報導〕首部全電腦動畫製作的《變形金剛》系列電影《變形金剛：源


  起》上週末（9月20至22日）正式在北美上映，以2500萬美金（近台幣8億元）登上上映新


  片冠軍。該片在北美以外的海外市場也獲得1400萬美金（約台幣4.47億元），目前全球累


  積票房達3900萬美金（約台幣12.47億元）。



  該片從初期試映就好評不斷，影評盛讚這部電影為粉絲們喜愛的角色增加了「複雜性和新


  的情感」，同時也具有足夠的戲劇張力，吸引不熟悉這個系列的新觀眾。


  目前電影在知名影評網站「爛番茄」也已獲得新鮮認證，目前仍維持著89%的好評新鮮度


  ，代表觀眾評分的爆米花指數更來到驚人的98%，好口碑對於接下來能否延長戰線將會是


  關鍵。《變形金剛：源起》持續在台上映中，全台票房粗估已破台幣2000萬。


  --'
