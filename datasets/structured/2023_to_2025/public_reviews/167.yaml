url: https://www.ptt.cc/bbs/movie/M.1749913022.A.65A.html
title: '[好雷] 克里斯伊凡「天作之合」:愛不是變形金剛'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  「天作之合」由入圍奧斯卡《之前的我們》韓裔導演Celine Song帶來第二部自編自導

  作品，講述她之前做過媒人的工作經驗改編，達珂塔強生陷入三角戀情，周旋在克里斯伊

  凡與佩德羅帕斯卡之中


  本片原名materialist物質主義者，談得當然就是女性追求愛情當然優先考量到經濟

  佩德羅帕斯卡是有錢爹地，克里斯伊凡則是窮光蛋，女主的青梅竹馬


  本片相當聰明的先用某男性凝視盯著達柯塔強生的美腿，接著女主順勢遞出名片，表明

  自己是媒人，隨後得知這位先生是一位謊稱自己經濟地位的詐騙，還襲擊了配對對象

  讓女主大受打擊


