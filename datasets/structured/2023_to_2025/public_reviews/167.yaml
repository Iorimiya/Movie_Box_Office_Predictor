title: '[討論] 天作之合這部片意義是？'
content: '簡述內容就是女主角是戀愛顧問公司員工幫人找男女朋友之類，有天婚禮遇上搭訕他的高富帥（高是手術來的）與當服務生的美國隊長（前男友，對比之下就是窮小子跟有錢人的選擇，在高富帥台戰下女主角開始答應交往，當天也打砲了，後來發現跟高富帥兩人根本不相愛又分手，跑去找回美國隊長重溫舊愛，想問這部片是再表這位女生,水性楊花嗎？實在看不懂這部片要傳達什麼意義。

  畢竟網飛第一名影片。


  -----

  Sent from JPTT on my Xiaomi 2210129SG.


  --'
