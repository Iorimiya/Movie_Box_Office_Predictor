url: https://www.ptt.cc/bbs/movie/M.1585209636.A.11C.html
title: '[負雷] 高草魅聲 -In the Tall Grass- 天作之合'
content: "中文片名 : 高草魅聲\n英文片名 : In the Tall Grass\n\n上映日期 : 2019\n\n圖文好讀版 : \n\n觀影地點\
  \ : Netflix\n\n\n劇情簡介 :\n\n一名懷孕的女子和她哥哥聽到一位男孩的求救聲，\n\n兩人隨即踏進一片廣大的高草地中，卻發現可能再也走出不來了。\n\
  \n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n觀影心得\
  \ :\n\n嗯....Stephen King恐怖小說改編的電影，netflix拍的恐怖片\n\n爛片的元素到齊了，挺好\n\n\n\n這部我沒看過原著\n\n\
  \n開場算是吸引人，草叢中小孩的呼救\n\n進入草叢後方向迷失的恐懼，兩個人而已還能走丟\n\n聲音似乎在附近卻永遠到達不了\n\n\n沒訊號卻收到不明女子的來電，內容卻語焉不詳\n\
  \n遇到同樣受困的人，但對方言行有些詭異\n\n進入者在時間軸上無法解釋的交錯\n\n神秘的石頭，未知的瘋狂行為\n\n\n聽起來滿棒，但就是不好看\n\n不恐怖，有些懸疑，有追殺躲藏，不明屍體，線也有串起來，不會看完一頭霧水\n\
  \n但沒有給來源太多的解釋\n\n觸碰石頭能看到什麼我們也不知道\n\n\n\nStephen King的恐怖小說我滿愛看，但改編成電影通常都不好\n\n畢竟文字可以給人很大的想像空間，一萬種人可以有一萬種想法\n\
  \n讓你自己去製造屬於你的恐怖，但電影通常是濃縮後的內容\n\n而且電影必須演給你看，或者乾脆留白不演出來\n\n後者是非常糟糕的方式，如果黃色小說改編成電影\n\
  \n但是沒有床戲也沒女主角還能看嗎\n\n\n這片就是後者\n\n\n被爛片轟炸多了，再以網飛的恐怖片及Stephen King恐怖小說改編的標準來看\n\n\
  這片不算很差，至少還看得下去，甚至我覺得它快及格了\n\n但如果只是想看一部恐怖片，略過這部，不值得\n\n\n--\n\n\n\n電影以及生活的隨想blog\n\
  \n--\n我覺得Needful Things節奏很悶，但都比這片好\n\n傑羅德遊戲我認為普通....但我很愛熱淚傷痕，\n\n那種在雇主與女兒與丈夫之間的無力卻要堅強的感覺，凱西貝茲演得很棒\n\
  \"夫人，您的戰車來了\"\n\n只是他的恐怖作品有些不好拍，除非主題很明確\n\n如Christine , Carrie , Cujo ,瘦到死或寵物墳場\n\
  \n或是乾脆cult片如鬼作秀，或更B級的Sleepwalkers\n\n太意境的恐怖作品實在很難拍好，看編導功力了\n還沒看過，感謝推薦~\n迷霧電影版我倒是覺得改得不錯，畢竟電影不是小說，需要收尾"
