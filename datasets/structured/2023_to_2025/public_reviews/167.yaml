url: https://www.ptt.cc/bbs/movie/M.1759201862.A.E9B.html
title: '[好雷] 天作之合~魚與熊掌不可兼得'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  　　電影《天作之合》（Materialists）裡的女主角Lucy，是一名職業紅娘。其實我覺得

  用英文片名「物質主義者」更能來理解這一部片子的主軸。


  　　從每個顧客所開出的條件看來，例如：年薪有一定金額、不要禿頭、不超過30歲的年

  輕女性（即使這名男性一開始本來說希望找成熟一點的女性，不然有代溝，但當Lucy提供

  合適人選時，他又嫌超過30歲太老），大家提出的都是外在的條件，沒有人特別提出內在

  特質。然而婚戀市場似乎就是如此，就連平常看交友軟體，也都是這樣簡易的分類:身高

  、體重、職業、興趣，以及最重要的──放上去的照片吸不吸引人，用最粗淺也最粗暴的

  分類，讓你決定是要右滑或是左滑，成功配對或者錯失。


  　　在一場客戶的婚禮上，Lucy邂逅了所謂的婚戀市場「獨角獸」。英俊、多金、挺拔、

  富有學識的Harry聽到Lucy在招募潛在客戶的「演說」談話裡，對她產生了興趣，認為聰

  明又有腦袋的Lucy，是適合自己的女子，於是展開追求，帶她上遍各大高級餐館，不過兩

  人之間的話題，似乎全是建立在「物質」這件事情上。Lucy第一次和Harry回家時，兩人

  明明在接吻，但她卻忍不住分心，瞪大眼睛張望妝點的富麗堂皇的豪宅，如果面對的是真

  愛，會有辦法如此不夠投入地分心嗎？在兩人交往之初，似乎就可發現Lucy並非真心愛上

  Harry，而是喜歡他所擁有的一切物質條件。


  　　在Lucy邂逅了Harry的同一晚，她也巧遇在宴會上工作、擔任服務生、分手已久的前

  男友──John。John是個依舊懷抱演員夢的演員，和其他三個人合租一間不怎麼樣的公寓

  ，室友還很自私，常常搞事。當初Lucy和John會分手，就是因為John太窮了。兩人會因為

  小錢，將車子停在大馬路上大吵，有一次Lucy訂了高級餐廳慶祝兩人周年紀念，但John卻

  因為不想付25美元的停車費，在街上開車繞了已經20分鐘，害兩人可能會遲到，而得支付

  高級餐廳的罰款，而一聽到有罰款，John簡直像吃了炸藥般狂怒，質疑Lucy為什麼要訂這

  種餐廳。雖然錢不是萬能，但要好好談戀愛，錢卻是現實的一件事，約會、吃飯、旅行通

  通要錢……沒有錢，兩人真的能好好一起過日子嗎？而從用錢方面，也可以看出兩人價值

  觀的不合。


  　　和Harry在一起後的Lucy，在工作上遭逢了強烈的打擊與內心譴責，但是她卻沒有和

  Harry吐露分毫，反而是找了John傾吐。從這一點來看又可以得知，John才是那個可以讓

  她安心、訴說煩惱，以及可以好好安慰她的人。然而如果沒有心靈上的交流，兩個人交往

  ，又是為了什麼？為了單純有人陪伴？為了對方可以帶我四處享受？


  　　於是，電影就此講明了，Harry是可以提供一切優良物質條件，卻無法讓Lucy交心的

  伴侶，兩人之間像隔了一層膜，有閃耀的炫光將愛情照耀地閃閃發亮，卻透不進心靈裡暗

  黑潮濕的角落；至於John則是那個能成為她的靈魂支柱，於闃黑的大海裡，因她的心靈擾

  動，閃現磷光，照亮眼前世界的存在，但在物質條件方面，他卻又是那急劇匱乏、阮囊羞

  澀的另一半，面對這樣的情況，究竟該怎麼抉擇？


  　　最後依照真愛無敵的電影公式，Lucy選擇了John，因為她認為，她自己有足夠的收入

  ，可以支持自己的生活，她並不需要John有錢，就如同一開始Harry在追求Lucy時說的，

  他自己已經夠有錢了，所以並不需要另一個物質條件與他匹敵的另一半。因為有底氣，所

  以可以選擇任何一個自己想要的另一半。


  　　然而在現實中，真的能夠那般美好嗎？我是悲觀的。雖然現下Lucy重新與John交往，

  表示能夠接受他的窮，但隨著時間過去，柴米油鹽醬醋茶，肯定還是會再次襲擊兩人的生

  活，他們終究可能會再次為了用錢的價值和態度再次爭吵，就如同電影《真愛旅程》的男

  女主角，兩人是知己、靈魂伴侶，但進入婚姻之後，日復一日的日常和經濟問題，終究是

  擊垮了兩人的婚姻。


  　　李安和妻子的故事，讓人津津樂道，「安，要記得你心裡的夢想」妻子如是說，在兩

  人經濟不寬裕時，她支持著李安的電影夢，養家活口，讓他追求導演夢。故事的結局，是

  李安成了國際知名的大導演、大放異彩。然而如果李安始終默默無名，這還會是一個

  Happy Ending的故事？妻子仍會毫無怨懟嗎？


  　　所有的情感關係，都是利益交換，雖然聽起來很物質、很不浪漫，卻是再真實不過。

  沒有麵包的愛情難以長久，戀愛和婚姻就是過猶不及，無論是物質條件的匹敵、或是心靈

  上的契合，實際上缺一不可，但魚與熊掌確實難以兼得，能夠同時得到兩者，擁有完美比

  例分配的人，只能說是極其幸運。而如果終不可得，就要看自己究竟在乎的是什麼而去抉

  擇，不過無論如何選擇，只要是依著心之所向，就沒有對錯。


  　　不過人始終是貪心的，選擇了一個，就會在日後忍不住追想，是否當初另一個選擇，

  較為美好，如同張愛玲《紅玫瑰與白玫瑰》的振保，「也許每一個男子全都有過這樣的兩

  個女人，至少兩個。娶了紅玫瑰，久而久之，紅的變成了牆上的一抹蚊子血，白的還是『

  床前明月光』；娶了白玫瑰，白的便是衣服上沾的一粒飯粘子，紅的卻是心口上的一顆硃

  砂痣。」


  　　如果都不願屈就，就只能選擇獨自一人，繼續在這廣漠的世界裡，踽踽獨行，看起來

  滄寂嗎？其實未必，如果和一個自己並不滿意的「選擇」在一起，或許更是孤燈長夜、輾

  轉難眠。



  --'
