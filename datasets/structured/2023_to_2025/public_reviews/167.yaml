title: '[好雷] 天作之合'
content: 'Celine song繼<之前的我們>後的最新作品

  攝影、鏡頭語言的運用依然讓人賞心悅目

  在角色心境以及對白設計都可以感受到導演的巧思


  我特別喜歡女主與富豪的互動

  在餐廳的一段

  女主道盡了她的關心：

  「你條件這麼好怎麼會選我？」

  「你有更多更好的選擇」

  「而我只是一個需要工作的女孩」

  我們可以從這段對白就了解女主心中的焦慮及自卑

  而這邊富豪給出的回應：

  「我會讓你感覺有價值」

  「我是你唯一忍受得了的富豪」

  卻不是從女主的焦慮去安撫她

  而是從自己的優勢、地位來切入

  也與前男友的安撫方式有強烈對比


  而後在富豪家 深夜的對談中

  富豪說道：

  「難道愛不就是一場生意嗎？」

  呼應了女主在工作中一直以來的觀念

  但這邊女主卻說道：

  「但愛必須是談判籌碼（Love has to be on the table)」 （這邊有點忘記中文翻譯）

  很明顯的可以感受到女主觀念的轉變

  也像是與過去的自己對話一般

  說明自己其實沒有自己以為的那麼物質主義


  喜歡這片藉由有趣的對白、背景設定

  從戀愛顧問的角度去探討現代人的求偶焦慮

  就算是以顧問的角度是一個完美的match

  那這段關係就一定能夠長久嗎？

  如果出生背景、收入、生活方式都相符

  就一定是Soul mate嗎？


  雖然最後結局沒有像前作來的後座力強大

  但我覺得前男友在樓梯旁的真心告白

  也是滿打動人心

  配上近景的特寫真的太美了！






  --'
