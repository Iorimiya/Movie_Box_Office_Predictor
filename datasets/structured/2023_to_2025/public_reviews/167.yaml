title: '[好雷] 天作之合 很真實的電影'
content: '看完《天作之合》後，我覺得這是一部非常好看的電影。卡司男帥女美，對白也很精彩。雖然有些觀眾認為劇情平鋪直述、缺乏反轉，但我反而很喜歡這位導演的風格。沒有對白的時候，我會專注觀察演員的肢體動作，那段安靜的時光反而讓我更沉浸其中，去猜測男女主角當下的心境。



  ---


  劇情片段的感受


  前半段，約翰與露西在餐廳外抽煙的場景，讓我印象深刻。他們看著彼此，那份專注與眼神交流，流露出即使分開仍然存在的愛意。


  哈利追求露西時展現了紳士風度，不是單純依靠砸錢。他將露西的一句話「我要跟下一任男友結婚」放在心上，甚至在冰島旅行前準備求婚。當露西意外發現戒指的那一刻，我感覺她突然清醒了。


  這讓我聯想到她和一位新娘的對話。新娘說：「對方讓我覺得自己有價值。」其實，露西過去也曾對哈利說過：「你讓我覺得自己很尊貴。」原來，她跟那位新娘一樣，都是透過對方來感受自身的價值。



  ---


  愛與金錢的掙扎


  露西一度以為自己是唯物主義者，選擇了哈利，也相信自己能一直走下去。但那枚戒指，卻讓她誠實地面對自己：她無法接受一段只有物質、卻沒有愛的關係。


  她與約翰在路上爭吵的場景尤其讓我心痛。露西說：「你也很恨我對吧，因為我也恨我自己。」她甚至抱怨為什麼要為了 25 元吵架。那時候的她，越來越相信金錢比愛情重要。但經過時間與歷練後，她才明白，即使遇見了傳說中的「獨角獸」，沒有愛，依舊走不下去。


  最後，當約翰以「報價」的方式表達心意時，雖然聽起來只有「愛」這個籌碼，似乎不切實際，但我能感受到他的真誠。而露西心裡，其實也是同樣的想法。



  ---


  真實與選擇


  彼此相愛，才是穩固未來的基礎。露西最終選擇了「高風險的愛情」，卻也因此更貼近真實的自己。


  這部電影讓我覺得它不同於一般的愛情片。無論是對白或沉默，都有各自的力量。兩次重刷下來，每一次我都更融入其中，也更有感觸。


  最近我也常思考：愛情究竟是和「條件」交往，還是和「人」交往？

  《天作之合》給了我答案──條件或許能帶來安穩，但唯有愛，才是能走向未來的關鍵。



  -----

  Sent from JPTT on my Sony XQ-DQ72.


  --

  看第一遍我也以為是，但二刷我發覺她並不是，她也有分享她自己動鼻子跟身上。她說其實在一起之前就確定沒有愛了，腿不是原因

  其實真實還有包含裡面男女開條件的時候

  身為戀愛顧問，一定遇過或看過不少條件好的男生。連萬中選一的獨角獸她都無法交往下去了，最後會選約翰也很合理：）

  這部給我的想法是，愛情與麵包的比例，前者佔比較多，不代表後者不重要

  現實角度讓我想起李安的故事。露西在劇中透露出，她喜歡看約翰演戲，也強調自己可以養活自己，代表想要男方專心在演戲方面前進吧！？

  原來如此！電影反應看來...（汗

