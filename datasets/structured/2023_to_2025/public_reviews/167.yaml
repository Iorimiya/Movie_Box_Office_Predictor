title: '[雷] 天作之合：愛的懷疑論'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《天作之合》有雷影評：愛的懷疑論\n\
  \n■ 無雷推薦語\n\n\n\n\n\n( 以下有雷 )\n\n■ 條件式愛情的盲點\n\n電影裡的真愛顧問、戀愛客戶，再到習慣挑剔的露西，都反映了非常堅固的愛情價值觀，\n\
  大致有兩條：一、真愛就是人海裡面萬中選一、量身打造，二、結婚(愛情)決定了你的一\n生，選擇誰當伴侶就是決定往後的生活方式。\n\n在這樣的信念之下，愛情變成要精打計算的交易。我同意做決定要計算清楚，但看起來\n\
  \n\n當你說眼前的人就是此生摯愛了，《天作之合》馬上演給你看，連露西自己的感覺跟標準\n，都因為前男友出現改變了。所以還是放寬去看待，\n，不僅拘泥於條列式的檢核表，才能觀察人品、個性、情緒\n\
  管理等其他一樣需要納入加總的元素。\n\n\n\n\n■ 真愛大考題\n\n一個對你滿心滿意，而且成長經歷相似非常懂你；另一個條件極佳，而且願意負責你的人\n\
  生。《天作之合》的選擇難在，兩個人都是好人、都沒致命性缺點。太難選了。\n\n另一方面，《天作之合》選擇論述的角度，避掉了一些沒回答的問題：\n\n一、十年後，約翰跟露西還能好好相處嗎？\n\
  約翰懂得體諒露西，但露西的個性就是挑剔。本性難移的情況下，若經濟條件一樣不變，\n真的難保不會變心。\n\n二、設定上直接攤牌，露西跟哈利之間完全沒有愛，只有雙方條件合算。\n\
  露西原本願意為了100分的條件，選擇與哈利走下去，但因為發現對方的增高手術痕跡，\n95分的條件便敵不過約翰100分的愛。\n\n我想，但凡哈利對露西的愛有個20分，這個選擇一定會更加艱難，也更有意義。\n\
  \n■ 結語\n\n當《天作之合》的結尾，露西選擇了愛情，做出了糟糕的財務決定，彷彿要觀眾去相信「\n愛」這個隨時變動的概念。但當回想起約會強暴的橋段，還是不由得保持一絲警惕和懷疑\n\
  。\n\n也許更符合現代的愛情觀，是\n\n\n補充：\n從天作之合談整形\n\n露西與哈利後來彼此攤牌，哈利做過斷骨增高、露西動過鼻子和隆胸（或塑胸）。\n\n\
  整形不只讓他們更有自信，也帶來實際的好處。哈利說增高後，的確有更多被搭訕的回頭\n率。\n\n看起來整形是約會市場的明智決定，但深入細究，整形對內心的影響，不是直接提升自己\n\
  的自信心。\n\n而是\n\n\n別誤會，整形的確帶來了好處。當基於自卑或是嫌棄心態做的整形，給予他們更多行動的\n能量和機會，卻依然無法填上內心的黑洞。\n\
  ／\n哈利跟露西的深層坦白，未必會帶來電影演出的破局，也可能是同理彼此對外貌的自卑。\n但露西把這份即使深藏了，還是需要照顧的自卑，坦露給約翰：一個了解她過去的對象。\n\
  \n我想這就是露西抉擇的關鍵。她選擇把最脆弱的一塊給了約翰，因為露西相信他更能理解\n，也更能善待她。\n\n\n\n\n>>網頁好讀版：\n\n–\n脆：\n\
  IG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n--\n謝謝"
