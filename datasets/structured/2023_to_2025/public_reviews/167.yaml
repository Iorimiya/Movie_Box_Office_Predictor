url: https://www.ptt.cc/bbs/movie/M.1757052481.A.CF6.html
title: '[好雷] 天作之合'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  佩德羅‧帕斯卡近來積極在大銀幕上扮演完美情人，從《驚奇4超人：第一步》的「驚奇

  先生」到《天作之合》裡的單身貴族，很難不讓人愛上他。8月31日是美國國定相親日，

  《天作之合》在兩天前於台灣上映，帕斯卡在裡面與同樣充滿魅力的達珂塔‧強生、克里

  斯‧伊凡一起上演三角戀，探討怎麼樣的愛情才最完美？



  在紐約打拼，充滿抱負的年輕戀愛顧問露西，想不到戰無不勝的她，在一場婚禮遇到業界

  傳說中的「獨角獸」，眾人幻想中的黃金單身漢，擁有名車與一千兩百萬美金的豪宅，幽

  默風趣又有品味，簡直完美。



  「約會」存在人類的社交文化已久，就像《天作之合》一開始呈現出露西夢境裡的山頂洞

  人，他們在打獵與採集之餘，建立起親密關係，甚至希望與對方訂下婚約。早在真人實境

  節目如近期韓國的《母胎單身大作戰》、《單身即地獄》與幾年前Discovery的《裸身求

  愛21天》與交友軟體推出之前，人類就一直透過家族、宗教領袖與專業媒人尋找另一半，

  但我們往往都忽略約會其實也有潛在風險。有時候只是以單戀坐收，有時候可能會導致可

  怕的後果，像是碰上恐怖情人或如片中的蘇菲一樣遭到侵犯。《天作之合》並不是把愛情

  塑造地很美好，而是深入核心，點出真實情況。



  如同露西所說，婚姻本來就是一門生意，不論是古代中國甚至現代華人社會都還是會「合

  八字」，依據雙方合適匹配與否、家庭地位與占星命盤來作媒，彷彿所有離婚的夫妻當初

  都沒有合八字一樣，還是中世紀歐洲，貴族與上流社會透過聯姻建立政治聯盟，都代表婚

  姻關係到社會地位、生存與未來保障。雖說女性獨立、工業化與城市興起讓媒妁之言逐漸

  沒落，大家不再只靠家庭與小群體尋找終身伴侶，而是在婚姻介紹所、社交俱樂部或舞廳

  認識新朋友，但還是沒有完全跳脫媒合服務等陌生介紹的風險。



  如今，現代人不再仰賴家庭或群體關係，轉而求助科技，利用交友軟體尋找對象。不過，

  不少人對於大方告訴他人自己是交友軟體的用戶還是有所顧忌，甚至不敢告訴家人自己的

  對象是在交友軟體上認識的。一部分當然是因為網路交友的詐騙陷阱多，一部分是不想表

  現得自己好像對愛情非常飢渴。但是，有所顧忌的人不在少數，所以類似「愛慕」的專業

  媒合公司，像是「Kelleher International」或「Selective Search」推出量身訂做的傳

  統方式。他們會仔細審查客戶，再幫他們與最適合的對象安排傳統相親。但就像我們在《

  天作之合》所看到的，畢竟這些公司標榜高會員費與高成功率，不會預設用戶心懷不軌，

  但再怎麼樣也無法對會員瞭若指掌，像蘇菲一樣的悲劇偶爾還是會發生，也難怪薇拉會說

  「約會」就是有風險。



  片名原文是唯物主義者的意思，也就是金錢主義或物質主義，而露西就是一位唯物主義者

  。或許是由於小時候窮怕了，長大後覺得一定要有能力讓自己享受才算成功，但話說回來

  ，我們每個人某種程度上都是物質主義者，只是在乎的東西不同，以及物慾程度不同而已

  。除非崇尚極簡主義或隱居山林，不然每個人都一定在不同的事物上堅持自己的物質主義

  ，有些人喜歡住好、吃好，其他人喜歡穿好、用好。露西第一次進入哈利的豪宅，對一切

  都感到不可思議，而聽到這間閣樓公寓要一千兩百萬美元，她彷彿吃下定心丸，心裡默默

  認定哈利就是自己的完美伴侶。



  既然每個人或多或少都是物質主義者，那當人變成商品的時候，大家挑剔、在意的點也會

  不同。《天作之合》將現代愛情商品化人類的一面展現出來，對露西來說，她的工作與殯

  葬業、保險業沒什麼不同，每個客戶都有自己的標籤，從高矮胖瘦，到職業、種族，一切

  都是簡單的配對、數學、演算法。但真的有這麼容易嗎？是也不是。



  當增高手術與醫美成為一種銷售「投資」與行銷自己的方式，實際上也真的有用，那這些

  標籤配對的確很簡單，畢竟身高是夏綠蒂的硬要求，假使哈利的弟弟沒有做增高手術，露

  西永遠不會幫他們兩個安排第一次約會。可是，後續的相處也很重要，如同愛情顧問無法

  從標籤看出對方是否會酒後亂性、酒品不佳，而現實生活中又有多少人會說伴侶根本不符

  合自己當初開的條件，但愛上了就是這樣。



  就像露西所言，由於像哈利這樣的獨角獸真的存在，因此本身條件不差的女性才會肆無忌

  憚地把自己的要求越開越高，反之亦然。哈利在電影最後揭露，他其實並非生來就是獨角

  獸，未做增高手術前168公分的他，絕對沒有自信與勇氣去搭訕露西。追求初期，露西也

  多次告訴哈利，以他的條件，能夠找到比自己更好的女生，但哈利對於過去遇到只因為他

  是黃金單身漢就會自動貼過來的無腦女生沒興趣，哈利看上的是露西的腦袋與「閱人無數

  」的經驗。《天作之合》在最後戳破大家對獨角獸的想像，並不是要觀眾對戀愛市場感到

  悲觀，而是深刻了解，沒有完美的對象，也沒有完美的戀情，一切端看如何經營。



  2004年，一名部落客在網路上撰寫講述愛情的「麥穗理論」後，廣為流傳。假如有人要你

  進入麥田拿一顆最飽滿的麥穗，但不能回頭，且只能選一次，大部分的人都會空手而歸，

  這就是愛情；有過這次經驗之後，再到森林裡去砍樹，規則一樣，通常大部分的人都會帶

  回一棵自己還算滿意的樹，這就是婚姻。



  如同露西所說，找結婚對象找的是墓友與養老院的室友，對物質主義的她來說，如果在20

  幾歲的年紀遇到哈利，露西可能就會馬上嫁給對方，但當時的她哈利或許也看不上眼，而

  20幾歲的露西選擇與約翰分手，但擔任戀愛顧問看一圈之後，她認知到，麵包當然重要，

  但一切還是要有愛情為基礎，所以最後露西決定「做出糟糕的財務選擇」。但誰知道呢？

  她即將升官，而約翰未來也可能成為大明星也說不定呢！在正確的時機遇到對的人，才是

  幸福的密碼，願大家都能找到自己心中的完美伴侶。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
