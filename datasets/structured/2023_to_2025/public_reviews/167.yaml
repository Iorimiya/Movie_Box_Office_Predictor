url: https://www.ptt.cc/bbs/movie/M.1751368796.A.02F.html
title: '[好無雷] 天作之合(Materialists)'
content: '<天作之合 (Materialists)> 是韓裔加拿大籍導演Celine Song自編自導的第二部長片作

  品。她的處女作<之前的我們 (Past Lives)>非常讓我驚豔，尤其最後一幕飽滿的情緒更

  是讓我久久無法忘懷。然而<之前的我們>畢竟只是她的首部作品，也看得出來她將很多韓

  裔移民的個人生命經驗都放在那部作品中了。因此，我非常想知道她的第二部作品是否也

  能延續前作的高水準。


  而這個問題大概在本片開場的前20分鐘左右就得到了解答


  Celine Song的電影似乎有著一種非常特殊的質感。她筆下的角色對白非常樸實，並且適

  度地運用留白來烘托情緒。沒有昆丁. 塔倫提諾的機智詼諧，也沒有Richard Linklater

  的深富哲理。然而，這樣的樸實卻讓角色的情感更能輕易穿透人心。在電影開場的前20分

  鐘，我就感受到了在<之前的我們>中見過的這種熟悉質感，並覺得本片一定會是我的菜。

  這樣的預感也的確沒錯，在電影結束後，我依舊沉浸在電影的情緒中，一直坐到片尾字幕

  跑完、A24的logo亮起才起身離席。本片是今年目前為止我最喜歡的電影，並且絕對能輕

  易排進年底的年度前10甚至前5名片單。


  <天作之合>的劇情大綱其實非常老梗，預告片看起來更是無聊的戀愛喜劇套路：女主角

  Lucy (Dakota Johnson) 是個成功的約會配對工作者，然而自己卻一直單身，並在舊愛

  John (Chris Evans) 與多金的完美對象Harry (Pedro Pascal) 之間難以抉擇。光打這幾

  句話都讓我覺得…這真的是2025年的電影嗎XD (BTW，本片其實完全不是戀愛喜劇的氛圍

  ，帶著看劇情片的心態進場會比較適合…)


  在這樣老套的故事架構之下，Celine Song透過深度的人物描寫，企圖反思現代人約會配

  對方式的合理性。家庭背景相當、高收入、有共同興趣、外貌條件接近、政治傾向相符，

  紙上的條件都符合之後，兩人就是完美的靈魂伴侶了嗎？說起來，電影提出的這個議題本

  身也不算特別。愛情與麵包的抉擇，早已被問了千百年了，本片提出的也不是甚麼獨特的

  見解。


  然而Celine Song作品的亮點在於她能透過角色的困境將情緒渲染給觀眾，而片中的情緒

  往往揉合了對理想的嚮往與必須直視現實的無奈。對我而言，這種氛圍特別能引起共鳴，

  既有浪漫的美感，卻又非常克制地不會讓人覺得不切實際。也正是這種共鳴，讓老生常談

  的訊息變成了能印在心裡的真實感受。


  整體而言，我覺得<天作之合>的後勁稍稍不如前作<之前的我們>，但Celine Song在兩部

  片中都展現了細膩又極具穿透力的情感刻劃。在本片之後，我將更密切關注Celine Song

  的後續作品了


  個人評分: 4.5/5


  --


  噓文預設別人看盜版之前可以先看看發文IP位置喔:)

  加拿大已經上映好幾週了'
