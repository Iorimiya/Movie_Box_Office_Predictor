title: '[請益] 關於危機航線的迫降橋段(雷'
content: '(以下有劇情雷)


  雖然這部電影主要還是看爽的居多

  不過其實還是蠻好奇的...







  那就是電影中，因為飛機起落架卡住的關係

  本來一度有要考慮用機腹著陸

  稍微查了一下機腹著陸

  其實是緊急迫降算常見的方式 而且也不一定會造成多大的傷亡

  (雖然肯定還是非常危險)


  電影是直接把公路清空

  然後直接用兩台貨車在底下接應的方式

  代替無法完全下降的起落架，雖然很佩服編劇的想像力

  但真的很好奇這樣是可行的嗎?


  突然想到以前還有流言終結者可以驗證這種方法是否可行

  但現在已經看不到這個節目了...


  --'
