url: https://www.ptt.cc/bbs/movie/M.1727451882.A.852.html
title: '[新聞] 劉德華闖《危機航線》 肉搏暴徒'
content: "劉德華闖《危機航線》 肉搏暴徒\n\n2024/09/27 05:30\n\n\n劉德華在《危機航線》上演高空對打，直呼很有挑戰性。（華映提供）\n\
  \n〔記者許世穎／綜合報導〕影帝「華仔」劉德華在新片《危機航線》單挑一群心狠手辣的\n暴徒，全片都在狹小的空間中進行肉搏打戲，片中不少動作戲由他親自上陣，幾乎用盡飛\n\
  機上每一個空間來發揮，讓他開心表示：「創作過程中發現有很多可能性，作為演員好有\n挑戰性，卻又好享受這個嘗試！」\n\n華仔飾演國際安保專家，在片中上演連場極具衝擊力的震撼動作戲，電影也將犯罪片的正\n\
  邪對立搬到萬呎高空，場景就設定在空中密閉的的環境，完全隔絕外部救援。\n\n華仔首次在高空情境上開打，讓他直呼印象深刻，「劇組搭建的機艙，幾乎還原真實的大\n\
  小，在封閉的機艙環境內，特別營造出一種無力的壓迫感。」《危機航線》將於10月9日\n在台上映。\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n\
  \  是 佛        是 菩薩\n\n\n\n--"
