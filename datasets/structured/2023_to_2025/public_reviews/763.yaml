url: https://www.ptt.cc/bbs/movie/M.1728820689.A.D4E.html
title: '[普雷] 危機航線-躁上加躁'
content: "雷文防雷資訊頁\n\n\n\n\n久違的發文\n當然要進場支持一下帥氣的華仔\n以下多劇情雷，慎入\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n劇情大綱:一班劫匪劫機勒索被華仔一家人擊敗。\n\
  \n劇中打戲算流暢，畢竟劫匪人數多(且未知)，有效的精準打擊讓劇情進展順利，\n但打戲時用綠色&紅色濾鏡，刻意強調的部分頗影響觀影舒適度的。\n\n以下開始吐槽:\n\
  一、你們家CEO在飛機上又是重要的首航，\n    但是整台飛機卻只有一個空警?\n    那華仔所屬的那個安保組織是塑膠作的喔?\n\n二、行李藏槍手段，Netflix之前有部劫機動作片(偷破天際線)\n\
  \    槍枝本體跟子彈都採用特殊材質跟構造組成，帶上飛機比較合理，\n    本作直接是零部件分散在託運就上的去也是夠扯的了(雖然有買通放行畫面)。\n\n\
  三、去劫機把公司的整體財務狀況透過內鬼摸的一清二楚了，\n    還買通安插了兩個副機長一個空服員，\n    卻沒有把飛機結構摸清楚真是一大敗筆，\n   \
  \ 被華仔從內部通道暗殺了一半人手。\n\n四、把6號摸掉的時候好歹也藏一下，\n    雖然用CALL機就知道不對勁了，\n    但至少能延緩被發現的時間，爭取更多時間吧?\n\
  \n四、7.8.9號被摸掉的時候應該也至少收入3把槍，\n    但看後面劇情感覺華仔火力有點不足，\n    還是怕給他太多槍會變龍五?\n\n五、以上種種都還好，覺得蓋不過打戲的流暢程度，整體觀影下來是好的。\n\
  \    但最後迫降的方式太唬爛了，只好給普雷。\n\n\n\n\n\n\n\n\n--\n可是重要乘客(自家CEO)在機上耶，派出華仔組織的一小隊來很合理吧?"
