url: https://www.ptt.cc/bbs/movie/M.1726845394.A.13F.html
title: '[新聞] 危機航線智鬥暴徒 華仔大打心理戰'
content: "危機航線智鬥暴徒 華仔大打心理戰\n\n2024/09/20 05:30\n\n\n劉德華在新片《危機航線》孤身力抗暴徒，於超豪華客機上營救家人和機上乘客。\n\
  （華映提供）\n\n〔記者許世穎／綜合報導〕由天王影帝「華仔」劉德華監製主演、《見鬼》系列導演彭順\n執導新片《危機航線》昨曝光全新預告，電影中分秒必爭、全機乘客命懸一線，華仔在超\n\
  豪華客機上孤身力抗暴徒，和飾演劫匪的屈楚蕭鬥智鬥勇。\n\n曾入圍金馬獎最佳女配角的張子楓飾演華仔女兒，還有歌壇天王周興哲也參與演出。華仔\n飾演的國際保安專家大展身手，在兩層機艙的狹窄空間內單挑劫匪團，運用智慧竭力瓦解\n\
  對方戰力，營救家人和機上乘客，光看預告就已相當緊張刺激。\n\n電影首發的海報也刻劃出角色的心理掙扎，華仔眉頭深鎖，神色凝重，臉頰留有傷痕，眼\n神堅定如山，表現出捍衛客機安全的勇氣和決心，他在片中除了上演心理戰，也有不少拳\n\
  拳到肉的肉搏演出。《危機航線》將於10月9日在台上映。\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\
  \n\n\n--"
