title: '[討論] 危機航線 父女疑問 (雷)'
content: '.

  ..

  …

  ….

  …..

  避雷頁

  …..

  ….

  …

  ..

  .


  A380上，女兒帶著媽媽去免稅店逛，當時華仔出現在女兒前面

  雖然女兒的眼睛看不到，但已經表明嗅覺很厲害

  好像沒有道理認不出老爸?


  之後回頭等艙開始遇到危機

  無線電對話機與頭等艙的對話

  撇除飛機上能否使用無線設備通訊外

  女兒好像沒有發現跟她說話的是爸爸


  我和我朋友的爭論是


  因為後面無線電應該真的不知道是老爸

  所以前面免稅店不知道機率比較大


  但我覺得免稅店怎麼可能不知道 人家直接幫他擋了一下

  所以後面電話應該多多少少早就猜到了？


  有這麼不熟嗎 講了這麼久電話不知道是自己爸爸


  大家覺得呢…，有可能前面知道，後面不知道？


  我覺得至少是 前面知道 後面大概知道的狀況吧


  --'
