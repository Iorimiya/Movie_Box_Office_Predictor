url: https://www.ptt.cc/bbs/movie/M.1728831907.A.83A.html
title: '[普雷] 危機航線'
content: '從狂躁症的乘客跟隔壁的醉漢起衝突引起紛爭開始


  就覺得他們的計劃滿滿的有問題，到底為什麼要拿酒瓶攻擊自己的人


  還是是故意要給他來個一擊來惹怒他。


  接著過程的消滅敵人這邊我沒意見


  直到劉德華三人會合躲在不知道哪裡開始


  我就止不住我的笑意


  感情戲來得有點突然，我是不覺得在要被殺害前


  還能這樣溫馨大和解


  還有收訊不是被截斷了嗎？


  為什麼敵人他們還可以跟地上的人通話或傳簡訊？


  這是我的疑問


  然後飛機大爆炸這一刻更是黑人問號


  劉德華的女兒抓力還真是強大


  在高空這樣的速度飛翔


  還能牢牢抓住降落傘撐這麼久


  我想問真實世界一個沒有受過訓練的普通人真的可以這樣嗎？


  然後周興哲的角色設定也是有趣


  是為了要請他唱主題曲，所以塞個可有可無的角色給他嗎XD


  兩個空姐都比他有用多很多~


  最後一幕的女兒也是方向感極佳


  不怕踩到異物的就直直衝向爸爸


  完全沒有感人捏><


  實在太多吐槽點，我是笑著離開戲院的...


  --'
