title: '[影評] 《做工的人電影版》台劇電影版最完整作品'
content: "如履的電影筆記  \n\n【影評】《做工的人電影版》噗攏共的通俗幽默，前傳劇情溫馨有趣\n\n《做工的人電影版》是一部2023上映的台灣劇情喜劇電影，由鄭芬芬執導，演員為李銘順\n\
  、游安順、薛仕凌、柯叔元，劇情講述阿祈和阿欽這對鐵工兄弟檔，在工地遇見了模板工\n昌哥與開怪手的阿全，幾人逐漸成為無話不談的朋友。某天為了改善艱困的生活，阿祈報\n\
  名獎金優渥的電視節目，幾人不輕易向自己人生認輸，在笑淚中互相關照扶持，想辦法度\n過難關。\n\n一直以來，家庭與人生故事都是台灣電影創作者最會拍的強項，向是近幾年金馬獲獎電影\n\
  《陽光普照》、《瀑布》或《一家子兒咕咕叫》，都以不同題材對相關主題做出精準的描\n繪，而這次《做工的人電影版》同樣也不例外，以有如賀歲電影的喜劇形式呈現一群工人\n\
  的日常生活，在全片歡樂有趣的氛圍中，究竟會講述一段怎樣的故事？相信都讓觀眾感到\n好奇。\n\n不是續集，而是一部前傳作品\n\n2020 年台劇《做工的人》根據林立青作家的同名散文集改編，作為台灣首部在大型工地\n\
  拍攝，並以藍領工人作為主角的電視劇，憑藉著鮮明討喜的人物角色，以及對於社會中低\n階層人們生活的描繪，播出後便獲得許多觀眾的歡迎和好評，不僅成為 2020 上半年度的\n\
  人氣戲劇，更一舉拿下第 56 屆金鐘獎的最佳迷你劇集獎，使得如今登上大銀幕，也將帶\n著劇迷重溫當時的感動。\n\n因此雖然是最新推出的電影版，但《做工的人電影版》並不是續集，而是一部前傳作品，\n\
  把時間背景拉回到影集故事的 11 年前，帶著我們看見李銘順、游安順、薛仕凌等人所飾\n演這群「噗嚨共」的過往生活與相遇認識的經過，從在各個角落揮汗工作，到共同解決各\n\
  種難題挑戰，都對《做工的人》劇中的人物角色有更加完整的交代。\n\n原班演員主角回歸\n\n就如同我們熟悉的主角，《做工的人電影版》由李銘順飾演的鐵焊工「阿祈」有著天馬行\n\
  空的發財夢想，雖然每天勤奮工作，白天在工地上班，晚上還外出兼差，靠著自身的努力\n來支撐家計，但他真正希望的是能夠登上實境節目「幸運到誰家」，每個禮拜都寄信報名\n\
  ，期待能夠藉由製作單位提供的豐沛獎品來改善家庭經濟，為老婆和孩子帶來更好的生活\n。\n\n而在這條追夢路上，他遇見了游安順的板模包商「昌哥」與薛仕凌飾演的怪手司機「阿全\n\
  」，他們同樣為生活所苦，阿祈有著要養家糊口的壓力、昌哥時常因為被警察開罰，而阿\n全則無家可歸，讓《做工的人電影版》三位主角逐漸產生相互扶持的革命情感，紛紛想辦\n\
  法逆轉人生，突破目前的困境，但情況是否會如他們想的那麼順利？過程中又會遇到什麼\n有趣的事？\n\n噗嚨共三人組面臨的難題\n\n在《做工的人電影版》主角阿祈的建議下，昌哥從路邊的廣告傳單上找來天心飾演的善良\n\
  的律師，幫他們處理堆積如山的罰單。對方是個曾跟馬英九等政治人物合照過的知名女律\n師，身材火辣、聲音溫柔，時常劫富濟貧，專門為勞工解決各種疑難雜症，重點還是完全\n\
  免費，只要稍微繳點事後會全額歸還的訂金，就能抵銷大筆罰金，有得看還有得賺，都讓\n他們感到十分心動。\n\n另一方面，《做工的人電影版》主角阿祈也終於被節目組錄取，獲得能夠帶著家人前去參\n\
  加節目，跟其他參賽者爭奪獎金的發大財機會，只不過當阿祈就讀國小的兒子小傑得知消\n息後，卻對父親的決定抱持著反對的意見。因此電影除了噗嚨共之外，也把許多篇幅放在\n\
  阿祈和小傑這對父子之間的關係之上，讓他們在各種矛盾衝突中，找到共同步向幸福的辦\n法。\n\n做工的人劇情的主題\n\n就如同許多人對於中低階層的異樣眼光，《做工的人電影版》也透過小傑不想跟父親一起\n\
  上節目的原因，帶出「做工的人」在家庭與社會上面臨的困境。在工地的大太陽底下工作\n一整天，身上的髒污與汗臭不只讓人們避而遠之，也可能導致在意同儕眼光的孩子感到丟\n\
  臉，或許現在已經越來越多人能夠體諒，但在這個現實社會，遭人排斥和歧視也是他們有\n苦說不出的無奈。\n\n因此以賀歲喜劇的形式呈現，雖然《做工的人電影版》這群主角有人遭到律師詐騙、有人\n\
  被家人討厭，還有人因為簽了假合約而沒有房子住，完全展現出社會殘酷的那一面，但不\n可否認，整個過程還是充滿笑料和娛樂性。除了讓觀眾能夠看得開心之外，也在他們樂觀\n\
  的生活態度，還有最終淡化衝突的方式，進一步帶出整部電影所要講述的主題。\n\n\n做工的人評價好看嗎？\n\n毫無疑問，《做工的人電影版》是這類型電影的最佳表現，以這幾位身處底層階級的「噗\n\
  嚨共」作為主角，看著他們用盡各種方法嘗試改變命運，平易近人的通俗劇情，生動有趣\n又溫馨感人，完全合乎普羅族群與目標受眾的口味取向，相信這種小人物笑中帶淚的奮鬥\n\
  努力故事，在全片意外不斷的故事之下，都能夠引發所有觀眾與平民百姓的共鳴。\n\n或許《做工的人電影版》在故事前段就以昌哥被開許多罰單，颱風天把板材掉在高速公路\n\
  上，卻從來都完全不覺得自己有錯，讓我們看到角色的缺陷，會淪落至此不是沒有原因，\n但他們思想單純，就算時常投機取巧也是沒有心機的那種，以樂觀態度來面對困難，彼此\n\
  之間互相幫助，沒房子住就睡車上，煮一鍋湯溫暖身心，似乎沒有什麼問題是不能解決的\n。\n\n\n做工的人結局的意涵\n\n正是如此，《做工的人電影版》在反映現實之餘，終究是一部暖心的喜劇電影。就算身無\n\
  分文，板材因為下大雨泡水全毀，連上節目都跟高額獎品擦肩而過，被自己最疼愛的兒子\n給嫌棄，但到頭來，原本逐漸疏離的親子關係，卻也在幫助阿嬤重建鐵皮屋的過程中，讓\n\
  那些被焊接起來的建材變成有如衣褲上的一針一線般，將瀕臨破碎的家庭給修補完整。\n\n當你真心想完成一件事情的時候，全世界都會跑來幫忙，《做工的人電影版》藉由這段故\n\
  事顛覆了我們既定的刻板印象，並同時展現出家庭的價值與意義，願意陪伴我們實現夢想\n，在過程中助我們一臂之力的人，就能夠被稱作是家人，電影結局以曾敬驊飾演的兒子小\n\
  傑看著阿祈、阿欽這對兄弟檔的背景作為收尾，他們既完美又不完美的人生故事，相信都\n給我們帶來正面的溫暖感動。\n\n\n做工的人 影評結論\n\n整體而言，繼先前《想見你》和《我的婆婆怎麼把OO搞丟了》等幾部令人不甚滿意的台劇\n\
  電影版後，《做工的人電影版》應該最完整的作品，從戲劇轉電影非常成功，以賀歲片的\n形式來描繪藍領工人的日常生活，既讓我們看見現實社會的無奈、居於底層的咎由自取，\n\
  也有苦中作樂與人情互助的溫暖，整部片面向頗廣，有趣生動又溫馨感人，反映出每個人\n複雜多樣的真實面貌，實在想不到這個題材該怎麼拍才能比這更好了。\n\n\n\n\
  \n\n--"
