url: https://www.ptt.cc/bbs/movie/M.1696475170.A.968.html
title: '[新聞] 愛在滿格時：如父如子—蒙古 2023 衝奧'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  【影評】《愛在滿格時》：如父如子——蒙古 2023 衝奧代表作


  2023-10-04 人文電影的追尋


  由阿木爾賽汗・巴爾金尼亞姆自編自導自演的蒙古電影《愛在滿格時》，劇情描述在五星

  級飯店擔任主廚的蒙古男子圖佳，受族人急召回到蒙古故鄉探望垂死的繼父，他遇見了一

  個跟著外公外婆長大的男孩屯圖雷，屯圖雷也沒見過自己的生父，縱然一開始互看不順眼

  ，卻在漸趨了解對方後化解了彼此的歧見，兩人產生了宛如父子般的情誼。


  然而稻草收割後，圖佳就要回去城裡，屯圖雷的淚水和殷切召喚，能讓圖佳留下嗎？


  故事簡單，情感真誠飽滿


  《愛在滿格時》故事簡單，情感卻很真誠、飽滿，在描述圖佳從失去父親到成為屯圖雷心

  理上父親的過程，編導透過足夠的篇幅、事件去堆疊兩人的情誼。雖然兩人初見面劍拔弩

  張，但屯圖雷對圖佳這個陌生男子卻產生了好奇，為他敷藥膏治療水泡顯示了小男孩的柔

  情，而圖佳也仗義對譏諷屯圖雷身世的兩名男子飽以老拳，他必然在成長過程也經歷類似

  的指指點點。


  而不知屯圖雷不識字的圖佳夥同外人譏笑他，嗣後對屯圖雷表示歉意的舉動，恰巧回應電

  影開頭繼父臨終前對圖佳的懺悔。這種溫柔的行徑，不只表現在圖佳沒有因為身為大人就

  不願對孩童道歉的成熟，更表現在圖佳揍了兩名男子後用兩瓶酒消解前仇的舉動，如何成

  為一個成熟的男人，電影為我們做了很好的示範。


  手機訊號滿格時，愛就滿格嗎？


  《愛在滿格時》中，當地居民必須站在高處手機才能收到訊號，手機滿格是一件極其艱難

  的事，好不容易搭好高塔屯圖雷可以跟媽媽通話了，電話那頭傳來的卻是敷衍的話語甚至

  關機。科技拉近了人物理上的距離，卻也拉長了人心裡的距離，當手機滿格時，愛就滿格

  嗎？答案顯然未必。


  我們反而從圖佳和屯圖雷直面彼此的互動中，感受到滿滿的愛，那是不消言說頭輕輕靠上

  的彼此懂得，是仰望滿天星斗的依偎浪漫，是一同經歷摔角轉大人的重要儀式，更是雖無

  血緣關係卻不證自明的父子情誼。


  沒有不必要的煽情，結局淡然的感傷餘韻十足


  臨近片尾圖佳從屯圖雷的全家福畫中，感受到他對想要有一個家的深切期盼，然而時間到

  了他終將回去，他能夠給予的，始終有限。雖然對觀者和他們來說，不免遺憾，但是導演

  沒有硬要戲劇性的巧合（如圖佳是屯圖雷的生父）來炮製不必要的煽情，也考量現實不選

  擇讓圖佳留下這個容易討好觀眾卻過於理想的結局，讓《愛在滿格時》的調性前後統一，

  淡然的感傷反而更添餘韻。


  《愛在滿格時》證明了怎麼在 90 分鐘說好一個故事，兩位演員的表現自然、真誠，帶領

  觀者入戲，是一不容錯過的佳作，推薦給大家。


  --'
