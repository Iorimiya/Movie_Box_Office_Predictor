title: '[新聞] 德牧小櫻【少年與狗】滿分演技征服大銀幕'
content: '新聞網址：



  由日本文壇最高榮耀「直木賞」獲獎小說改編的同名電影《少年與狗》，即將在4月25日

  於台灣感動獻映。通常拍攝影視作品，劇組都會開玩笑說動物與小孩最難拍，不過本片導

  演瀨瀨敬久在這部電影當中，不僅拍小孩更拍狗，甚至還將狗設定成主角，他也稱讚這回

  飾演狗主角「多聞」的德國牧羊犬「小櫻」超有靈性，尤其這回沒有為狗狗安排替身，小

  櫻可說是「全程完美演出」，讓導演直呼是他拍片以來，遇過最聰明的一隻，並透露牠非

  常擅長「靜止」表演，就連躺下的戲都能輕鬆完成。值得一提的是，男女主角高橋文哉與

  西野七瀨，也與小櫻有大量互動對手戲，劇組也安排兩人提早跟小櫻培養感情，不過才第

  一天，小櫻就跟高橋打成一片，就連訓練師都大讚他們超合拍；不過對於西野，小櫻反而

  顯得生疏許多，讓西野大嘆：「牠連看我一眼都不看呢。」這也讓導演笑稱：「小櫻其實

  是母狗（角色多聞在設定上是公狗），也許牠就是喜歡像高橋這樣的美男子吧。」





  《少年與狗》改編自知名作家馳星周，榮獲文壇最高榮耀「直木賞」的同名小說，透過真

  摯的人狗情誼，刻畫一隻名叫「多聞」的狗，在從東北到九州的旅程當中，與受傷、困惑

  和感到迷惘的人們展開心靈交流。據悉，馳星周非常喜歡狗，本身也有養狗，他表示狗狗

  是教導人們「無條件的愛」的老師，狗也讓他明白，與其害怕終將到來的死亡，不如思考

  「此刻我們能如何更充實地一起生活」。對於自己的這本獲獎小說登上大銀幕，他也表示

  ：「狗狗『多聞』這個名字，有『多聽』的意思。狗會傾聽人類的語言，並溫柔地陪伴在

  人們身邊。到底有多少人，是因為對狗傾訴心聲，而得以拯救自己的心靈呢？我由衷相信

  ，狗是神明派遣給人類的生物，是無條件之愛的典範。我真心期盼，透過這部電影，能有

  更多人對這份信念產生共鳴。」



  尤其在片中詮釋主角「多聞」的德國牧羊犬「小櫻」，製作團隊在日本各地尋找合適的狗

  狗來扮演，最終發現只有小櫻才能在各種條件下勝任這個角色。曾跟許多狗演員合作過的

  導演瀨瀨敬久表示：「我拍過許多跟狗相關的電影，但小櫻是我遇過最聰明的一隻。一般

  情況下，我們會準備替身的狗以防萬一，但這次『小櫻』卻從頭到尾完成了所有拍攝。牠

  真的非常優秀，真的把角色那種『神』一般的感覺給展現出來。」導演並笑說：「不過說

  到底，那也只是我們這些人這麼想罷了，說不定小櫻本身完全沒在想什麼吧？！」他並透

  露小櫻非常擅長「靜止」演出：「就連躺下的戲，牠都能輕鬆完成。唯一比較難的是閉上

  眼睛，那場戲是我們不停地撫摸牠，讓牠真的睡著後才拍下來的。」





  值得一提的是，本身都有養狗經驗的高橋文哉與西野七瀨，在《少年與狗》也有許多跟小

  櫻的互動演出，讓愛狗的兩人直呼開心。劇組讓兩人提前跟小櫻培養感情，所以在正式拍

  攝前，安排兩人幾天的接觸。結果高橋在第一天就跟小櫻培養極佳默契，訓練師都大讚他

  們超合拍，然而對西野就顯得生疏許多。這也讓導演瀨瀨敬久笑說：「小櫻其實是母狗（

  角色多聞在設定上是公狗），也許牠就是喜歡像高橋這樣的美男子吧。」



  對此，高橋分享他跟小櫻拉近距離的方法：「首先是讓牠坐在我旁邊、互相對視，然後牽

  著牠的牽繩一起散步。從這些基礎開始，漸漸地，我們可以不靠牽繩一起散步，甚至我跑

  起來牠也會跟著我跑。雖然一開始牠看起來有點緊張，但慢慢地牠也逐漸適應現場。對我

  來說，小櫻真的給了我很多安慰。」另一方面，一開始被小櫻冷落的西野七瀨，也使出自

  己專屬的小妙招：「聽說狗狗對手上有零食的人會特別服從，所以拍攝初期，牠還沒那麼

  習慣現場時，我就會用『零食作戰』慢慢拉近距離。牠在日子一天天過去後，也逐漸習慣

  了現場，拍攝也變得愈來愈順利。」導演也讚道：「西野跟小櫻在正式開拍後，很快就打

  成一片，這點讓我覺得她很厲害。」



  這部由日本文壇最高榮耀「直木賞」獲獎同名小說改編的電影《少年與狗》，即將在4月

  25日於台灣感動獻映。本片劇情描述震災後六個月的宮城縣仙台，失業青年和正（高橋文

  哉飾演）與同樣在震災中失去主人的狗狗多聞相遇。聰明的多聞，很快就成為和正和他家

  人生活中不可或缺的存在。為了維持家庭生計，和正不得已開始從事犯罪工作，並捲入一

  起事件當中，而多聞更在這場混亂中消失無蹤…。隨著時光流逝，多聞來到滋賀縣，與擁

  有悲傷過往的女性美羽（西野七瀬飾演）一同生活。因為多聞的陪伴，美羽逐漸找回平靜

  的日常。就在此時，為了尋找多聞的和正出現了。起初，美羽對和正抱持敵意，但因為多

  聞的關係，兩人也逐漸產生心靈上的交流。不過，美羽過去的傷痛仍舊逼迫著她…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
