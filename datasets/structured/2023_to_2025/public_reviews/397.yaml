title: '[新聞] <少年與狗>西野七瀨、高橋文哉秀精湛演技'
content: '新聞網址：



  改編日本文壇最高榮耀「直木賞」感人小說的《少年與狗》，即將在本週五（4/25）於全

  台感動獻映。本片刻畫一段跨越人與動物、善與惡、孤獨與救贖的深刻旅程，不僅是一部

  電影，更是一次溫柔而震撼的心靈洗禮。全片集結新生代人氣演員高橋文哉，以及前「乃

  木坂46」超人氣成員西野七瀨攜手主演。兩人首度合作就激盪驚人火花，並徹底顛覆以往

  形象，詮釋截然不同的角色。高橋文哉近期因為在廣告中化身「25歲真人版蠟筆小新」引

  發話題，這次則挑戰飾演為犯罪集團擔任逃逸駕駛的「車手」，展現黑暗面的人性掙扎；

  西野七瀨則大膽演出藏有秘密、命運多舛的「援交少女」，突破性表現令人驚艷，演技層

  次大幅提升。兩人透過本片首度合作，雖然初見彼此帶點試探，但年齡差距完全不成問題

  ，很快就在拍攝現場展現自然默契。尤其片中一幕「為狗吵架」橋段，更是充滿火花與笑

  料，不僅讓觀眾會心一笑，也讓導演瀨瀨敬久直呼：「高橋完美詮釋了我心中那種『可愛

  又迷人』的氣質。」製作人平野隆也盛讚西野的表現：「這會是西野七瀨演藝生涯的代表

  作。」





  曾被譽為「最帥男高中生」、並以《假面騎士ZERO-ONE》打開人氣之路的高橋文哉，近年

  來在戲劇與電影界迅速竄紅，接連參與《最愛》、《為你綻放的花》、《費馬的料理》等

  話題作品，2024年更參演四部電影，氣勢驚人。日前才在廣告中以「25歲真人版蠟筆小新

  」形象引爆網路討論的他，這次在最新主演電影《少年與狗》中，大膽挑戰反差演出，化

  身為陷入黑暗世界、為犯罪集團駕車逃逸的「車手」，展開一段與流浪狗「多聞」命運交

  會的動人旅程。高橋談到角色「和正」時表示：「因為故事背景設定在一個殘酷世界，所

  以我希望和正是個天真且容易親近的角色，我在劇本中特別注意這點。」他並坦言首度閱

  讀原著時，就認為吸引力極強、讓人得以沉浸在世界觀當中：「隨著和正的旅程一步步展

  開，遇見各種人，我心中也不斷浮現『接下來會發生什麼？』的期待感。那份沉浸感，電

  影也完整呈現了出來。」



  尤其這是他跟名導瀨瀨敬久首度合作，導演也對他的表現給出極高評價：「高橋完美詮釋

  了我心中那種『可愛又迷人』的氣質。」高橋也敬佩導演對細節的堅持，以及對人性情感

  的細膩掌握：「每一場戲都讓我充滿緊張又期待的情緒，能參與這部作品真的很開心。」

  搭擋演出的西野七瀨也直呼很快就跟他打成一片，展現超乎預期的默契：「剛見面時還有

  點生疏，彼此都有點試探的氣氛，但沒多久就能自在聊天。即使他年紀比我小，但完全沒

  有年齡上的隔閡。」她也大讚高橋是個讓人安心的搭檔：「拍攝現場的氣氛很輕鬆，我們

  的互動也非常自然。」





  另一方面，前「乃木坂46」超人氣成員西野七瀨，這回在《少年與狗》大膽顛覆過往形象

  ，挑戰詮釋在援交俱樂部工作的援交少女。這個角色不僅背負沉重過往，還隱藏不為人知

  的秘密，直到遇見流浪狗「多聞」，才逐漸找回那個被自己遺忘的「真正自我」，也成為

  西野在演藝生涯中最具突破性的挑戰。據悉，她在開拍首日就要詮釋情緒崩潰的戲碼，壓

  力之大讓她直言：「當時還對角色不夠熟悉，就得馬上進入一場非常沉重的戲，內心其實

  非常不安，而且情緒必須在瞬間拉到極限，拍完當下整個人都像被掏空了一樣。」然而，

  這個挑戰卻也讓她從中獲得前所未有的成長與觸動：「我一直在想像這個女孩的情感狀態

  ，試著把那些難以言喻的情緒具象化，每天都懷著愉快的心情去面對。」這也讓跟她共同

  演出的高橋文哉大讚：「她是對角色非常認真、誠懇的演員，能與她一同演出，是我莫大

  的榮幸。」



  導演瀨瀨敬久更是對西野的專業表現力讚：「她是一位到現場就能立刻融入、自然站上演

  員位置的人。她的現場反應力非常出色，和對手演員的互動之中，能產生新的火花。即便

  不需要過多說明，她也能立刻進入角色、成為那個人。我深刻感受到她是個感覺敏銳、直

  覺力非常強的演員，也完全沒有前偶像的印象。」製作人平野隆更直言：「這會是西野七

  瀨演藝生涯的代表作。」



  這部由日本文壇最高榮耀「直木賞」獲獎同名小說改編的電影《少年與狗》，即將在本週

  五（4/25）於台灣感動獻映。本片劇情描述震災後六個月的宮城縣仙台，失業青年和正（

  高橋文哉飾演）與同樣在震災中失去主人的狗狗多聞相遇。聰明的多聞，很快就成為和正

  和他家人生活中不可或缺的存在。為了維持家庭生計，和正不得已開始從事犯罪工作，並

  捲入一起事件當中，而多聞更在這場混亂中消失無蹤…。隨著時光流逝，多聞來到滋賀縣

  ，與擁有悲傷過往的女性美羽（西野七瀬飾演）一同生活。因為多聞的陪伴，美羽逐漸找

  回平靜的日常。就在此時，為了尋找多聞的和正出現了。起初，美羽對和正抱持敵意，但

  因為多聞的關係，兩人也逐漸產生心靈上的交流。不過，美羽過去的傷痛仍舊逼迫著她…

  。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
