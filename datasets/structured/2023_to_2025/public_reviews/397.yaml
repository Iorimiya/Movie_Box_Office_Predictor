title: '[普雷] 《少年與狗》狗狗為什麼流浪？'
content: '直木賞得獎作改編，人與狗的交會情誼


  寵物的存在在過去一輩的人們眼中，是一種輔助工具的存在，如農家出生的漫畫家荒川弘

  ，就在半自傳漫畫《百姓貴族》中敘述，家裡貓抓老鼠，狗巡邏田地和看守的趣事。


  但在如今許多人對於飼養的動物，不再只作為工具的用途，反而有所羈絆，這可能也是在

  發展平穩的社會中人們對於後代的教育有關，故寵物現今如同家人，也有許多飼主願意花

  時間與金額陪伴自己的毛孩子，而勝過生兒育女，成為寵物友善的環境。


  人狗彼此的羈絆能有多執著？電影《少年與狗》敘述這樣的狗與人的故事，改編直木賞得

  獎作品，在311日本大地震之後，失業青年和正撿到一隻名叫多聞的狗，多聞很快融入和

  正的家，但在一次事件失去蹤影。多年後和正在網路上找到飼養多聞的新主人美羽，前後

  養過多聞的兩人有著秘密，而多聞似乎也一直看著遠方，像是在尋找什麼？







  《少年與狗》是什麼電影？


  現在只要手機或電腦打開一滑社群，都免不了會有許多小狗和小貓賣萌的影片，有些是單

  純的曬自己的毛小孩，有些則是轉貼一些寵物有趣的行為與表情。在中國則是有很多透過

  文字註解，讓自己的寵物配合演戲，但也偶爾會有奇怪、錯誤對寵物的認知。


  基本將寵物當成家人疼愛這點，在社會上許多人眼中是沒錯，但對於一些動物學者和研究

  專家，有時候會怕過度將「動物擬人化」，而讓人們忘記動物基本的認知，甚至用人類的

  思想來判斷寵物的行為，這點對於寵物並不有易，反而危險。


  雖然現代人不再將寵物視為一種工具，是一種對於另一個物種的尊重，但是過於溺愛與錯

  誤認知，有時候也會害人害己，例如飼主不牽繩的狀況讓自己寵物對陌生的動物攻擊，甚

  至攻擊人的狀況，就是一種對自己寵物的不了解。過去最常見的像是飲食資訊的錯誤，例

  如將剩菜剩飯餵給貓狗。美國獸醫行為學會，建議飼主要「以物為本」的互動方式，才是

  對於寵物的真正尊重。但如今很多影視和短影片，依舊將寵物視作人的主體觀念來敘事。









  故當我們看待影視作品的貓狗，或其他動物時，有時候要有這是娛樂，並非真實動物呈現

  的行為，例如動畫片《喵的奇幻漂流》雖然捕捉動物的行為與動作，但本質還是以人的思

  考邏輯的動畫故事。而日本電影《少年與狗》中有靈性的狗狗多聞，也是如此。這部電影

  改編於直木賞得主－馳星周的原作小說《少年與狗》，將裡面每篇的狗與人類的故事串起

  ，做出原創的改編內容。並且講述更多人與人、人與狗牽起的情感與羈絆篇章。


  原作馳星周本身就喜歡狗狗，小說靈感是來於311日本大地震，日本人對於地震災難的無

  助，而讓他想透過描繪一隻狗的旅途，在災後的社會裡，串起人與人之間的希望。


  馳星周表示：「雖然描繪故事已經是在地震後多年，但他還是認為日本每位作家，都可以

  繼續書寫相關這場地震的故事。」改編小說的電影導演瀨瀨敬久也說：他希望將這部作品

  是可以傳達，在悲傷與絕望之中仍然有希望的故事。












  《少年與狗》分析與延伸：


  作者馳星周的筆名，對於香港或台灣許多人會直覺想到演員、導演－周星馳。馳星周過去

  對外表示過，他的筆名是對於周星馳的致敬，但也有一些日本小道八卦雜誌認為是因為馳

  星周喜愛賽馬的影響，但這點並沒有實際證實。


  反觀馳星周的作品的確有受到早期港片的影響，例如1998年的小說《不夜城》，就以中日

  混血的男女，被卷入新宿歌舞伎町中國黑幫的鬥爭故是為主題，可以看到《古惑仔》、《

  英雄本色》等電影的風格，以血腥暴力，煽情的情慾為主題的官能小說。


  作品後期風格的轉變是經歷了2011年的311大地震是一個契機點，當時的馳星周其實創作

  了不只港片的《不夜城》，也有以台灣職棒簽賭為主題的《夜光虫》、描繪日裔巴西人在

  日本社會掙扎《漂流街》等。在地震之後文風有點轉變，例如在2014年出版的《帰らずの

  海》，故事就以調職返鄉的刑警，看到殺人事件受害者竟是他年輕喜歡的女性水野惠美。

  讓他面對過去現在的情感糾葛，可以看見他將殘酷黑暗，轉變為人與人之間的情感探討。









  2020年創作的《少年與狗》則有著他轉變前後許多影子，並且電影與小說有著不小差異。

  《少年與狗》是以狗多聞陪伴在不同地方人，獨立篇章的視角，藉由多聞這隻狗串聯起來

  的故事。整體來說文體模式有點像日本作家－村上龍的小說《跑啊！高橋》。


  電影則是以小說「仙台篇」和「滋賀篇」的主角做為改編，並略帶其他篇章的故事短暫的

  出現與狗互動。整體來說電影版以男女之間的情感加上對狗狗多聞之間的人犬情感，而改

  編後原創的故事，試圖串聯整個小說內容，做出環環相扣的嘗試。


  這點其實跟原作馳星周描繪動物故事有根本上的矛盾，在馳星周創作這部小說時，曾表示

  過，他看過許多國內外描繪狗的小說作品，都是以「人類情節的附屬品」所以《少年與狗

  》想以狗為主角去串接整體，和以狗狗多聞所到之處與人相會做為故事的核心。但電影卻

  是轉變於和正和美羽為核心發展，這點與原作有所落差，這也挑戰導演是否在打破原作者

  的概念，自己去做一個合理的不同觀點的展現，《少年與狗》等同原作去延伸的同人作品

  ，既然單純以狗串接的概念不存在，就只能看觀眾和原作讀者，能不能認同導演的再敘事

  故事的功力。









  《少年與狗》值得一看嗎？


  《少年與狗》其實是一部很傳統的以人類視角去賦予動物，自我感動的概念。不管是馳星

  周的原作，或是這次改編的電影，都是一種動物擬人的手法去詮釋，透過裡面角色的對話

  與敘述去合理化狗狗多聞的行為，例如舔臉是安慰，會感覺到你孤單陪伴在身邊，或是感

  知到危險發出叫聲等，甚至看向未知的遠方好像在找尋什麼等等，這都是一種附加上，或

  是故意做出的人類詮釋動物行為的一種不正確的想像。


  所以為何說是「人類的自我感動」？因為電影將人狗的情感美化成人類以為的觀點，或是

  因為劇情刻意讓狗做出不符合他行為，但人類會喜歡或感覺到這隻狗不一樣的狀況。故我

  認為《少年與狗》是在描繪一個人類喜歡與期望的人犬共感，這也符合原作者喜歡狗的這

  份情感。


  整體來說裡面所有多聞的飼主都在合理化多聞為他們這麼做的原因，與這隻狗跟我有很深

  的羈絆，但如以另一種角度來說，裡面所有人對於多聞的感情似乎都是一廂情願的。









  這也是這部電影有趣的地方，整體來說劇情有許多老套，且看出馳星周過去想要敘事的議

  題，例如日本移民、邊緣人、大地震的災害等等，但因為原作是單篇章節藉由狗去延續每

  個故事，但電影試著將分開章節的主人翁有所牽連，就變成如前敘述所說，原本該以狗為

  主體的故事，到一半便成了男女角的人生故事，並且比狗的故事還要狗血、駭人。雖然這

  種發展似乎又有馳星周早期的作品風格，但是在《少年與狗》是否合適？也是很有趣的地

  方。


  整體來說《少年與狗》因為想說到很多人與狗的故事，還要建構原作沒有，男女主角相遇

  的原因，而變得冗長且令人感覺可怕。甚至後續不止狗擬人化的手法岳加嚴重，還有點超

  自然的元素，讓人有點找不到故事的核心。


  說救贖也沒有真正所有人都救贖，講述狗與人的羈絆，卻感覺每段感情多聞有時很瀟灑離

  去，但有時又好像刻意徘徊，故我認為導演為了串接起來每個故事，變成有點抓不到原作

  的價值，還不如一開始就以多聞為主題切開章節來拍，最後再來個全體回顧，要來得直接

  ，總而言之，這是一部對狗狗有美好的羈絆想像，大篇幅都在說男女私慾的奇怪改編作品

  。




  --

