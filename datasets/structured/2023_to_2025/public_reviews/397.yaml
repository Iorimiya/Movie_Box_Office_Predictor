title: '[新聞] 馳星周直木賞獲獎名作<少年與狗>台灣上映'
content: '新聞網址：



  榮獲日本文壇最高榮耀「直木賞」的獲獎小說《少年與狗》，在書迷的影引頸期盼之下，

  終於改編同名電影登上大銀幕，並將在4月25日於台灣感動獻映。故事刻畫一隻名叫「多

  聞」的狗，為了與重要之人相見，讓牠花費5年時間，跨越3000公里從東北到九州展開流

  浪，並在過程中療癒了無數人心。透過知名作家馳星周筆下的動人故事，以及《來自雪國

  的遺書》創作班底與名導瀬瀬敬久的精采打造，輔以「新生代男神」高橋文哉與「乃木坂

  46」人氣畢業成員西野七瀬的精采演出，更是讓觀眾看到淚灑影院，讓本片一舉勇奪日本

  本土新片票房冠軍。值得一提的是，男女主角昨日（4/1）也出席位在東京舉辦的謝票活

  動，飾演狗狗「多聞」的德國牧羊犬「小櫻」也來到現場，更帶著導演寫給兩人的感謝信

  ，信中並對高橋與西野讚譽有加，讓獲得導演認可的兩人，喜悅之情溢於言表。





  《少年與狗》改編自以《不夜城》一書廣為台灣民眾所知、知名作家馳星周的同名小說。

  該書不僅榮獲日本文壇最高榮耀「直木賞」肯定，並陸續登上紀伊國屋、東販、e-hon、

  丸善、淳久堂等各大書店的「2020年度百大暢銷書」排行榜，更長踞日本亞馬遜暢銷書即

  時榜，獲得千名讀者4.4顆星的高分評價，成為感動無數讀者的經典之作。尤其作品以充

  滿真摯情感的人狗故事，刻畫一隻名叫「多聞」的狗，為了與重要之人相見，讓牠花費5

  年時間，跨越3000公里從東北到九州展開流浪，並在這段旅途當中，與那些受傷、困惑和

  感到迷惘的人們相會，透過陪伴展開心靈交流。馳星周透過這個故事，寫出社會上不同身

  分人們的困境，透過一次次翻轉的故事情節，刻畫命運帶給他們難以預料的事與願違，尤

  其「多聞」僅透過純粹眼神，便接住了這些破碎的人心。



  曾打造出《生命最後一個月的花嫁》、《只想擁抱妳》等經典名作的製片人平野隆，在閱

  讀完小說之後，便著手展開電影化，找來曾打造出《永遠的0》、《來自雪國的遺書》等

  精彩劇本，並獲得日本奧斯卡優秀編劇獎肯定的編劇林民夫展開合作，更邀請到以細膩和

  精緻導演風格備受好評，不論硬派社會劇或愛情故事等各類型題材都相當拿手的瀬瀬敬久

  執導。平野隆表示：「故事當中，一群心靈受創的人們，遇見了一隻狗，並在跟狗的相處

  過程中獲得重生的希望。我認為許多人都生活在環境的陰影當中，很難看到希望。這些人

  可能正在受傷，或是對未來感到迷惘，讓我想要拍出一部電影，給予這些人們希望的曙光

  ，讓他們至少能向前邁出一步。」





  《少年與狗》找來過去曾以戲劇《最愛》打響知名度，並曾坐擁「2017年最帥男高中生」

  與「令和第一假面騎士」等稱號的新生代男星高橋文哉演繹。女主角「美羽」則找來女團

  「乃木坂46」畢業人氣成員，並以《輪到你了》、《孤狼之血LEVEL2》等作品讓觀眾津津

  樂道的西野七瀬演繹，並集結伊藤健太郎、伊原六花、柄本明、齋藤工、宫内瞳（櫻庭奈

  奈美）、江口德子、栁俊太郎等演技派群星共同演出。尤其高橋與西野兩人，昨日（4/1

  ）也出席位在東京舉辦的謝票活動。作為活動上的驚喜，西野代表朗讀了作者馳星周寫給

  高橋的信：「之前完全不知道高橋文哉這位演員，但看完電影之後，我覺得這位演員真是

  了不起，你將會不斷成長，成為優秀的演員。我31歲才出道，直到45歲才開始享受寫小說

  的樂趣，這就是追求精通之道的意義，我期待著45歲時的高橋文哉。」



  此外，片中飾演狗狗「多聞」的德國牧羊犬「小櫻」也來到現場，並佩戴一個黑色的小袋

  子登台。當高橋和西野從袋子裡取出東西時，發現是一封來自導演賴賴敬久的信。高橋則

  代表大家讀出這封信的內容，從中道出導演對兩人的稱讚：「希望你們繼續在電影中出現

  ，真的非常感謝你們。」獲得導演的鼓勵，西野表示：「導演在現場不太說話，曾說過『

  除了拍攝所需要的對話，其他都不太需要。』讓我有時會想，我是不是做得不夠好呢？導

  演會怎麼想呢？但今天能夠收到他這段文字，真的非常高興。」高橋也表示：「能和導演

  一起創造和正這個角色，是一段非常美好而榮幸的時光，很高興獲得導演的認可。」



  這部由日本文壇最高榮耀「直木賞」獲獎同名小說改編的電影《少年與狗》，即將在4月

  25日於台灣感動獻映。本片劇情描述震災後六個月的宮城縣仙台，失業青年和正（高橋文

  哉飾演）與同樣在震災中失去主人的狗狗多聞相遇。聰明的多聞，很快就成為和正和他家

  人生活中不可或缺的存在。為了維持家庭生計，和正不得已開始從事犯罪工作，並捲入一

  起事件當中，而多聞更在這場混亂中消失無蹤…。隨著時光流逝，多聞來到滋賀縣，與擁

  有悲傷過往的女性美羽（西野七瀬飾演）一同生活。因為多聞的陪伴，美羽逐漸找回平靜

  的日常。就在此時，為了尋找多聞的和正出現了。起初，美羽對和正抱持敵意，但因為多

  聞的關係，兩人也逐漸產生心靈上的交流。不過，美羽過去的傷痛仍舊逼迫著她…。



