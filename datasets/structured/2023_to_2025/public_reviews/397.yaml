title: '[新聞]【少年與狗】乃木坂46前成員熱唱AKB48名曲'
content: '新聞網址：



  由日本文壇最高榮耀「直木賞」獲獎小說改編的同名電影《少年與狗》，即將在4月25日

  於台灣感動獻映。本片選擇全部外景、實景拍攝，即使增加拍攝難度，卻也讓全片更加充

  滿臨場感；尤其在滋賀縣取景，更是將琵琶湖等在地美景透過大銀幕呈現在觀眾眼前。此

  外，本片在音樂選擇上也別出心裁，除了找來人氣天團「SEKAI NO OWARI」打造全新電影

  宣傳曲〈琥珀〉，片中更將依照故事情境，讓角色熱唱back number〈如果我成為超級巨

  星〉、安室奈美惠〈CAN YOU CELEBRATE?〉、AKB48〈無限重播〉三大經典名曲，滿足觀

  眾視覺與聽覺雙重享受。有趣的是，女主角西野七瀬是女子天團「乃木坂46」人氣畢業成

  員，卻在本片開口演唱官方設定對手AKB48的歌曲，讓一旁共同熱唱的男主角高橋文哉捏

  把冷汗，大呼「安捏甘好？」也讓西野笑說：「不、不、不，這個沒問題！」而高橋更大

  讚西野音準超強：「不管發生什麼事，她都不會走音。」





  改編知名作家馳星周同名小說的《少年與狗》，以東日本大地震為背景，透過真摯的人狗

  情誼，刻畫一隻名叫「多聞」的狗，為了與重要之人相見，讓牠花費5年時間，跨越3000

  公里從東北到九州展開流浪，並在途中與那些受傷、困惑和感到迷惘的人們展開心靈交流

  。劇組不畏拍攝難度，大膽選擇全部外景、實景拍攝，讓本片充滿臨場感。曾打造出《生

  命最後一個月的花嫁》的製作人平野隆，這回特別注重季節感，因為拍攝期涵蓋冬季、春

  季和初夏景色，他表示：「在描繪震災的過程中，如果我們在熊本或仙台拍攝，會涉及一

  些敏感問題。而琵琶湖在原著當中就有提到，我認為這裡是唯一能拍攝的地方。作為一個

  狗狗的旅行故事，從東北到九州的移動過程，琵琶湖能很清楚地展示這一點。更重要的是

  ，琵琶湖非常美麗，有令人驚嘆的攝影背景，也有非常清澈的空氣，讓電影的效果非常好

  。」尤其琵琶湖位在日本滋賀縣，劇組也透過精采的鏡頭，捕捉到當地大津湖岸渚公園海

  濱、琵琶湖大橋、琵琶湖露台、邁阿密營地、比叡山夢見之丘、笠原櫻花公園等美景，值

  得觀眾透過大銀幕一探究竟。





  《少年與狗》不僅透過美景滿足視覺，更融合多首歌曲滿足觀眾聽覺。曾公開表示喜愛樂

  團「back number」的導演瀨瀨敬久，選用他最愛名曲之一〈如果我成為超級巨星〉，讓

  角色因應劇情熱唱。而在片中的婚禮場景，更使用安室奈美惠的婚禮名曲〈CAN YOU

  CELEBRATE?〉，並讓男女主角在其中熱唱AKB48的〈無限重播〉。衝突的是，女主角西野

  七瀬是女子天團「乃木坂46」人氣畢業成員，卻在本片開口演唱官方設定對手AKB48的歌

  曲，讓當時一起唱歌的男主角高橋文哉捏把冷汗表示：「讀劇本的時候，我就一直在想『

  請考慮一下我在片場的立場吧！』我該用什麼樣的表情在旁邊唱歌呢？雖然有些困惑，但

  當時還是很開心。」當事人西野則笑說：「不、不、不，這個沒問題！」並解釋：「其實

  這是偶然的，雖然有很多其他候選曲目，但最終選擇了AKB48這首廣受歡迎的歌。雖然她

  們是我們的官方對手，卻也是前輩的作品。」她邊說邊露出微笑。而高橋也力讚西野：「

  她最棒的是，不管發生什麼事，都不會走音。無論我唱高音或低音，她總能保持主旋律不

  會走音。」而觀賞過本片的日本網友也笑稱：「從來沒想過能看到西野七瀨演唱〈無限重

  播〉，光憑這點就值得去看！」



  值得一提的是，本片還邀請到人氣天團 「SEKAI NO OWARI」，打造本片的全新宣傳曲〈

  琥珀〉。主唱Fukase透露在接到宣傳曲邀約後，腦中響起好友千葉龍太郎曾經演奏過的曲

  子，不過千葉卻在2018年因故離世，讓這段旋律成為Fukase腦中一直留存下來的未完成作

  品，也讓他因此用這旋律填入歌詞，完成了這首〈琥珀〉。Fukase表示：「本曲是我和朋

  友的共同創作。十年前，朋友曾給我聽過這段旋律，並深刻烙印在我的腦海當中。這次，

  我為這首未完成歌曲加入新的樂句，如果它能像片中的狗狗多聞一樣，成為連結思念與回

  憶的存在，那會是我最大的幸福。」男女主角高橋文哉、西野七瀬除了透露自己時常鈴聽

  SEKAI NO OWARI的歌曲之外，也深有同感地表示，歌詞跟自己飾演的角色有許多重疊性。

  製作人平野隆則補充：「在第一次聽到這首歌時，就忍不住流下了眼淚。片中女主角對男

  主角的情感，與Fukase對龍太郎的思念，兩者重疊在一起，深深刺進了我的心。希望大家

  能透過本片與這首歌，感受到『融入心底、永不消逝』的意義。」



  這部由日本文壇最高榮耀「直木賞」獲獎同名小說改編的電影《少年與狗》，即將在4月

  25日於台灣感動獻映。本片劇情描述震災後六個月的宮城縣仙台，失業青年和正（高橋文

  哉飾演）與同樣在震災中失去主人的狗狗多聞相遇。聰明的多聞，很快就成為和正和他家

  人生活中不可或缺的存在。為了維持家庭生計，和正不得已開始從事犯罪工作，並捲入一

  起事件當中，而多聞更在這場混亂中消失無蹤…。隨著時光流逝，多聞來到滋賀縣，與擁

  有悲傷過往的女性美羽（西野七瀬飾演）一同生活。因為多聞的陪伴，美羽逐漸找回平靜

  的日常。就在此時，為了尋找多聞的和正出現了。起初，美羽對和正抱持敵意，但因為多

  聞的關係，兩人也逐漸產生心靈上的交流。不過，美羽過去的傷痛仍舊逼迫著她…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
