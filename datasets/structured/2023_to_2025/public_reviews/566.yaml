url: https://www.ptt.cc/bbs/movie/M.1427372175.A.0CB.html
title: 'Re: [新聞] 周杰倫「不能說的秘密」 韓今春重上映'
content: '不能說的祕密真的是質感不錯的電影


  但是我覺得天台才是周現階段電影能力的表現


  電影最重要的是什麼

  當然是劇本

  今馬50爸媽不在家打敗ㄧ堆大製作的影片

  帶來的後續討論不就是小品片也可以這麼好

  不用大製作大場面大卡司


  而在來當然是看導演說故事的能力

  不然有好劇本也是枉然


  不能說的祕密故事說來流暢

  而且他故事上是埋梗到最後ㄧ次揭曉

  所以有點複雜性


  但就成果上是處理不錯的


  天台直敘式的故事卻說的2266

  故事淺白後面根本像世間情ㄧ樣灑狗血灑免錢的

  轉折生硬勉強

  故事前頭描述出來的可怕惡勢力

  臥房卻像公廁ㄧ樣很好淺入(看過的就知道我說什麼)


  很明顯為了怎樣而怎樣


  天台不論編和導和不能說的祕密對比之下完全不同層級


  兩部電影攝影都是李屏賓根本不用擔心

  音樂就是周自己的專長 沒問題


  至於天台的藝術風格

  要做台灣有的是人搞的出來

  只是沒人出錢給機會

  周杰倫三個字就代表錢

  有人肯投資


  但回歸原點先別提藝術風格，音樂和攝影了


  你聽過劇本嗎


  不能說的祕密另ㄧ個掛名編劇

  杜緻朗很關鍵


  有個構想是ㄧ回事

  能把構想弄成ㄧ個去蕪存菁穠纖合度 流暢的故事


  這才是功夫


  不然像天台的劇本淺薄的內容

  對我來說和鐵獅玉玲瓏ㄧ樣大概是八點檔等級


  不能說的祕密是部好電影

  裡面音樂的部份很棒那是周的功夫

  但其他有關電影的部份是不是他的才華就.....




  --

  Sent from my Android


  --'
