url: https://www.ptt.cc/bbs/movie/M.1582896351.A.151.html
title: 'Re: [好雷]《新聞記者》，不能說的秘密。'
content: '中華電信mod有這部電影!!!

  有安裝mod的可以找出來看。


  我今天找出來看，

  相關劇情介紹可以找本板前輩的po文

  只是，我對於特別這片子裡面描述網軍帶風向這一段實在印象深刻。。。


  因為台灣要抹一個人真的好容易啊!!

  抹紅抹綠抹藍抹某家媒體就可以直接影響這個人的可信度，

  好像整個事情的真相就不重要了，


  片中說，

  重點是這些消息人民信不信?

  最近防疫情況媒體報導中國怎樣，韓國怎樣，伊朗如何，

  重點不是實際上現場情況如何了，實況影片明明網路上就可以找得到了，

  但通常許多人懶，只相信媒體餵的資訊，

  重點是你信不信這個媒體傳播出來的那些真相?

  知不知道背後誰散播這些資訊?有沒有網軍刻意洗評價?好像不那麼重要了。


  其實覺得片子描述的操作蠻可能在台灣也這樣玩。


  不過最後不知道男主角到底怎麼選擇，

  他的女兒剛出生，

  他的太太一直被陪伴的太少（片中只是貼心好看的花瓶）

  他終於收到前輩給他的秘密，

  卻選擇了。。。。

  導演沒說死，可能覺得每個人保有一個自己對劇情的想像吧。


  我看這部片，劇情前半覺得男主角到底為什麼還沒辭職敢一直頂撞上司，

  後面又覺得為什麼男主角機關沒對他出手?

  一直讓我想到社畜這個詞，

  不知道日本上班族需要一份穩定工作，裝出自己很正常很勤奮上班的壓力，有多大?


  希望台灣能比片中情況好一些。

  （希望這個心得沒太離題）


  -----

  Sent from JPTT on my Samsung SM-N950F.


  --'
