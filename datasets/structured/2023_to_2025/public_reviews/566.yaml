title: '[討論] 恭喜不能說的秘密'
content: '不能說的秘密時隔八年在韓國重上映了


  這是最近的排名




  目前票房排第十名


  第一名是復仇者聯盟二


  第七名是寄生獸


  我覺得能夠在排外這麼強的韓國


  把八年前的老片重上映已經很厲害了


  還能擠進前十名


  真的是不簡單


  而且剛上映就入榜，應該還有機會往前擠吧


  希望不能說的秘密能夠挾這股氣勢從韓國再反攻台灣


  畢竟若不是07年上映時剛好是電影低潮期


  不然這片現在上映肯定破三億的


  如此神作只拿到幾千萬的票房真的很可惜


  希望在韓國有更好的成績



  --'
