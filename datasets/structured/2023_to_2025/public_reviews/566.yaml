url: https://www.ptt.cc/bbs/movie/M.1187117756.A.A99.html
title: '[轉錄] 《不能說的秘密》帶動台灣電影工業？'
content: '來源：




  作者：聞天祥


  別教我客觀地看待《不能說的秘密》，忘記周杰倫是本片導演（還兼原創故事、男主角及

  部分配樂）。除非你不聽流行音樂、不看媒體報導、甚至長期生活在華人文化無法到達的

  地方，否則怎麼可能摒除這個名字去看這部電影呢？你可以不喜歡他，卻不可能不認識他

  。


  事實上，周杰倫也非常聰明地在導演處女作裡面填充了絕大多數他有把握的東西。例如音

  樂、尤其是鋼琴，好幾次攝影機運動都像掛保證似地強調那個坐在鋼琴前面的身影與在琴

  鍵上飛舞的指頭是屬於同一個人的，突出了他音樂才子的形象。然後是愛情，周杰倫讓自

  己主演的角色從第一分鐘就成為被迷戀的對象，與其說是自戀，不如說有點可惜，因為多

  一些鋪排或許可以帶來更多說服力，現在卻只能因為電影裡的「葉湘倫」就是「周杰倫」

  ，所以理應如此。不過這也證明了他非常自覺觀眾來看的是周杰倫，而非他對葉湘倫的演

  繹。老實說，如果電影就只有這樣，還真的有些乏味，因為男女主角除了四手聯彈的浪漫

  外，幾乎只有兩小無猜接送情這類陳套，放到MV還可稱賞心悅目，但要撐起電影，就只能

  倚靠偶像與粉絲之間的彼此催眠了。


  因此我們看到電影前半部試圖想以一些笑料佐味，但穿插在其間的笑點常因其他年輕演員

  的表演完全沒到位而顯得冷場，好處是反而凸顯了周杰倫相較之下更像順理成章的白馬王

  子。到頭來真正具備喜劇感的竟然是黃秋生，他實在太搶戲了，剛開始還覺得他時好時壞

  ，角色寫得有些怪，但隨著戲份的加重，你才發覺他竟有辦法把一些肉麻台詞唱作俱佳地

  表達出劇本所沒有的情感與深度。儘管本片提供給他的表演幅度並不如《想飛》、《頭文

  字D》的父親角色，但他依然在搞笑的邊緣建立起慈父的性格。這部電影幸好有他，才不

  至於在愛情之外，陷於蒼白的危機。


  雖然努力避免，但我還是難逃在進戲院之前就聽說「秘密」是什麼。不過多年前看《靈異

  第六感》的時候也是如此，雖然少了解謎的趣味，卻因此多了檢視影片邏輯的自覺，甚至

  發覺《靈》片即使少了真相大白的快感，依然有超越謎底的情感爆發力。我並不是說《不

  》的水準直追《靈異第六感》，畢竟光是原創力就薄弱了一截，遑論角色刻畫力。我的意

  思是即使網路流竄的地雷讓人措手不及，但《不能說的秘密》後半部謎底揭曉的時候，既

  不像多事網友所暴露的那麼簡單，也具有比前半部更強烈的情感渲染力，更讓前面演來駕

  輕就熟的桂綸鎂在這部分終於有了較立體的生命，尤其在周遭同學扮演者的生嫩陪襯下，

  她輕而易舉就能鶴立雞群（雖然我更期待她在表演型態上早日脫離青春期）。讓我好奇的

  是，周杰倫在片中與學長「鬥琴」這場戲，靈感很明顯來自《海上鋼琴師》（1998），但

  周杰倫與桂綸鎂的愛情讓我聯想到的卻是年代更久遠的《似曾相識》（1980），是巧合或

  是有意的借鏡？耐人尋味。異曲同工的地方則是《不能說的秘密》和《似曾相識》都一致

  選擇打破時空敘事邏輯，寧可冒可能難以自圓其說之險，也要肯定愛的力量。


  從音樂人到電影人（這個比擬有點不公平，畢竟周杰倫已經演過《頭文字D》和《滿城盡

  帶黃金甲》），大眾自然覺得音樂元素一定是本片最安全也最有把握的要素，其實未必。

  平均每兩分鐘就有段配樂的盈耳程度，會不會反過頭來削弱影片主題音樂的力量集中，見

  仁見智。但如泣如訴的國語老歌「情人的眼淚」何以成為主角最喜歡的歌曲，在沒有交代

  的情況下，反而顯得突兀；而周杰倫與學長鬥琴是為了贏得「天鵝」琴譜好送給桂綸鎂，

  也沒有鋪陳。感覺上好像是在剪輯的時候捨棄了這些心理性的理由，不過這兩個攸關音樂

  母題的點，沒產生應有的邏輯與力量，則是不爭的事實。


  我相信大多數人都會認為《不能說的秘密》比想像中拍得好，因為我們多半低估了周杰倫

  在電影上的企圖以及這個製作團隊幕後多位大佬級技術人員與新生代創意人的護駕能力。

  而且無論就題材的選擇、角色設定、甚至混搭的類型手法上，都可以看到周杰倫小心翼翼

  確保自己的形象與才能得以發揮外，還想在典型的故事上提供一些小聰明，並證明他有感

  動觀眾的能力。其成績雖然不像他在音樂上的拔尖，但及格過關不成問題。


  寫到這裡突然想起周杰倫得到最佳新人的那年金馬獎，除了「自然、自信、自在」這個評

  語外，當時席間一個無關演技比較的聲音是「如果鼓勵周杰倫，或許激發了他對電影的興

  趣，他若能持續加入，對台灣電影工業或觀眾都會產生相當大的帶動力。」我不確定獎的

  肯定跟周杰倫投入拍攝《不能說的秘密》有無直接關係，但他究竟能產生多少電影帶動力

  ，以及持續的效應有多大？卻是讓人好奇且值得觀察的現象。




  --

  ◆ From: 123.192.169.20'
