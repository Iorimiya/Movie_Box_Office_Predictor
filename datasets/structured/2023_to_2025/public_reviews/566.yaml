url: https://www.ptt.cc/bbs/movie/M.1520411931.A.879.html
title: '[討論] 不能說的秘密在韓國很紅欸'
content: '前幾天去拍攝的地點，高中和大學走走，遇到好多韓國人，


  回家後，重溫不能說的秘密這部電影，


  居然youtube就有了，而且有英文韓文字幕。



  我是覺得那所高中可以有更好的規劃，停車什麼的超級不方便的，


  而且真正可以和影片一樣的場景只有鐘樓那邊可以拍照，其他地方和電影完全不一樣，只有一個地方可以照相真的不太好。



  看完不能說的秘密真的很想要續集，我發覺以前都看不懂，這次重溫才看懂，原來秘密藏在小雨的頭髮長度和心態變化。



  我是覺得很奇妙，現在韓國要翻拍不能說的秘密，那能改劇本嗎？



  拜託加演周杰倫在回到桂綸鎂還沒認識周杰倫之前，周杰倫怎麼利用這點來追桂綸鎂，我一直在腦補這個，好像很有戲，覺得這部電影真的太少了，似乎可以拍續集？


  --'
