title: '[好雷]《新聞記者》，不能說的秘密。'
content: '部落格版：


  「是真是假不是你說了算，是人民！」


  《新聞記者》裡的這句話讓我想起曾看過的韓國電影《奪命頭條》，當新聞台長官在面對

  警察的質疑時說著 「不是我們決定真相，而是觀眾選擇去相信了什麼才是真相。」 ，將

  屬下因搶快、或者捕風捉影寫成的錯誤新聞合理化，也就是變成「真的」，為的是什麼？

  為收視、為獨家，為的是還有很多我們所不知道的各種理由。在資訊量如此爆炸的現代，

  什麼是真什麼是假，似乎已經沒人能真正說的準確，俗話說三人成虎，指鹿為馬久了馬也

  就成了鹿了，更遑論網路科技發達、新媒體的竄起讓此現象變得更加嚴重，人人都可以是

  公民記者，人人都可以將所見所聞撰寫成文放上網路，隨著有人瀏覽有人轉發分享，不知

  不覺間就成了一篇「新聞」，相比過去要求嚴謹的時代，現在人們對於新聞接受度越來越

  高，各種趣聞、軼事都能是篇新聞，而選擇相信或不相信、判定是真新聞還是假消息的，

  都是觀眾、讀者自己。


  《新聞記者》改編東京新聞的社會現記者望月衣塑子的同名暢銷小說，電影不僅以她為原

  型，更將她過去所揭露的諸多醜聞以不同的新聞事件插入電影之中，以虛構新聞影射真實

  事件，大膽的批判著日本政府愧於人民的腐敗貪婪，同時卻也憂心著日本人民對於新聞的

  漠不關心與是非難辨，立場中立來辯論著何謂「新聞」？電影讓望月衣塑子客串政論節目

  來賓一角，和其他幾位來賓像是前文科省事務次官前川喜平、原紐約時報東京分局長馬丁

  法克勒以及新聞勞聯委員長南彰等人，針對新聞對於現代人的意義、是否具備媒體識讀能

  力、還有新聞是如何影響擴大至整個國家等議題去進行論述。為了讓望月衣塑子自身對新

  聞的觀點能確實體現在電影裡，也似讓她的堅持與付出被更多人所知，《新聞記者》以虛

  構的東都日報記者吉岡一角，來代替她付諸行動，除了報導真實更是要揭露更多被刻意隱

  藏的真相。




  「你要比任何人相信且懷疑自己。」


  吉岡的父親生前是備受晚輩敬愛的資深記者，然卻因一次的錯誤報導受到抨擊，最後承受

  不住選擇結束生命。父親對吉岡的影響很深，她投入這行業是因為他，旁人看起來就像是

  繼承衣缽，不過感覺上更像是她很想知道「為什麼父親深愛的新聞會將他殺死」，吉岡在

  東都日報服務多年，工作能力備受肯定，對於新聞真實性的敏銳度之高，往往能從一篇報

  導中、相關的資料堆裡，嗅到任何不對勁。近來不論是電視台、報章雜誌、廣播都連日報

  導著一則性侵案的新聞，媒體窮追猛打著加害者，人民也都在等他道歉，然詭異的是當受

  害女性出面召開記者會，聲淚俱下的控訴著自己遭受到的噩夢，網路輿論竟反而開始猛力

  撻伐這位女子，認為是她不檢點、認為是她勾引人家，還將她的個資全部挖出，風向整個

  吹向加害者，從加害者成了受害者，從受害者成了加害者，就連幫女子說話的人、包含吉

  岡都成了被攻擊的對象，詭譎變化讓吉岡開始懷疑是否有人在背後操弄一切。


  不久後，吉岡便收到一封上頭繪有一頭綿羊的匿名傳真，內容是政府推動的新設大學的機

  密資料，直覺認為這件事有追查的必要，於是她開始積極投入調查，企圖釐清這份機密資

  料的真偽，與此同時，一名曾替內閣府工作的官員神崎跳樓自殺，過去深受他照顧的後輩

  、目前任職於內閣情報調查室（內調）的杉原大受打擊，不明白前些天還好好的前輩為何

  會自殺，前輩的離世加上孩子的出世，讓杉原開始找不到方向，過去埋首於工作而疏於家

  庭的自己逐漸清醒，欲想推辭不再做泯滅良心的抹黑、放假消息、顛倒是非的事，卻反遭

  長官以言語暗示將會擾亂他的生活，夾在中間陷入掙扎的杉原，意外得知前輩生前最後經

  手的是一樁新設大學推動的案子，看見接手他的位子的同儕欲言又止的樣子，使杉原懷疑

  前輩的死和此事有關，於是他聯繫上了在告別式認識的吉岡，兩人遂分頭進行調查，最後

  總算在神崎深鎖的櫃子裡找到了資料，確認那隻綿羊就是神崎給的提示，原來新設大學案

  只是幌子，政府真正要做的是將新設大學用於研究軍事生化武器之途...




  「這是捍衛國家的重任！」


  「我們所捍衛的，究竟是什麼？」


  如果先去了解望月衣塑子過去曾揭露的醜聞或者報導過的新聞，就會發現《新聞記者》談

  的其實就是「真實」二字，從主線那樁新設大學變成研究軍事武器的機密計畫，是指2017

  年安倍內閣所爆發的「加計學園開設獸醫學院的關說弊案」，逼迫有關當局重啟調查的就

  是窮追猛打、提問尖銳的望月衣塑子。開頭的性侵案新聞是2015年的記者伊藤詩織遭安倍

  首相好友、前TBS電視台長官山口敬之下藥性侵一案。電影裡所出現的情節在真實世界裡

  曾經上演，伊藤詩織在召開記者會後受到許多日本網友匿名謾罵，她的照片與個資也被貼

  出，而她在記者會上因為襯衫釦子未扣被批蕩婦，認為是她誘拐山口敬之、她的形象和普

  羅大眾認知中的受害者形象差很遠，覺得整起事件都是伊藤詩織在設計山口敬之等。《新

  聞記者》和現實生活有著共同連結，似曾相識的既視感讓在看電影的過程裡感受到的格外

  強烈。


  《新聞記者》節奏很快，大量資訊、名詞從四面八方竄進觀眾腦袋，連稍微喘口氣的時間

  都不太有，滿建議在看的時候設法去用其它相似的詞彙代替腦袋比較不會容易打結。電影

  以吉岡與杉原為故事雙主角，分別以記者與政府官員來論新聞的真與假，除了要揭露日本

  政府所做的一切醜聞，同時是要反思新聞存在的必要性與意義性，最重要的是問著每個人

  ，在早已混亂不已的當今社會裡，我們所捍衛的是什麼？是新聞自由亦或是其它？而現在

  我們所走的每步都深深影響著下一代，當杉原的孩子出世後，他選擇不再做沉默的機器人

  ，開始想替孩子打造美好無憂的未來，於是他問著自己「能否替孩子留下些什麼、能替他

  們再多做什麼？」


  《新聞記者》反映著真實，如同一面照妖鏡照出許多被藏住的醜惡，於日本上映後引發熱

  議，不能說的秘密被迫以這種形式公開，不知情的人群起激憤，早已知情的人避之不談，

  《新聞記者》在做的是激起日本人民對「真」的渴望，對於新聞、政治、社會與自己的國

  家不再冷漠，如果人民能夠懂得明辨是非、積極投入，就能夠一起監督政府。喜歡電影偏

  向冷的色調，帶點灰暗的畫面感加深給觀眾的感受，小蝦米對抗大鯨魚的情節安排，與多

  重視角的不停切換，步步逼近真相的鋪陳，都替電影加分不少，最後留下的空白給人寬闊

  的思考空間，是替當今社會現況與出現的亂象拋出假設，也像是種另類註解。情節本身值

  得一看，飾演吉岡的沈恩敬表現同樣值得注意。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
