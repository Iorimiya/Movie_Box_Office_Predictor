title: '[請益] 不能說的秘密可以屌打近年來的國片嗎？'
content: '如題

  2008年周杰倫第一部自導自演的電影


  不論劇情還有演員跟鋼琴曲子


  都算的上是上等的，（那時我還愛上小鎂）


  之後推出的專輯裡面，也是用這電影的曲子改變而成


  蒲公英的約定讓我難以忘去


  可惜當初的票房沒有破億…


  如果今天這部電影是在2016年春節上映的話


  票房是是否會破好幾億？又或者可以帶來一陣學鋼琴的風潮呢？


  大家覺得呢？




  --'
