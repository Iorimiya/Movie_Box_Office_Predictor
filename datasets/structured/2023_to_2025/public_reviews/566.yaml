content: '日本翻拍不能說的秘密，

  首支預告影片公開




  日本版《不能說的秘密》，講述就讀音樂學院的學生「湊人」，因過去發生的事件，導致

  無法再像以前一樣彈奏鋼琴，在遇到性格開朗，卻又帶點神祕的音樂系學生「雪乃」後，

  兩人深受彼此的吸引，更是治癒了湊人因無法彈奏的創傷，一直到某天雪乃從湊人的生活

  中消失，一切又都不一樣了。




  日本版電影《不能說的秘密》預計將在2024年6月上映。





