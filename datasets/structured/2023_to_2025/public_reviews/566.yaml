url: https://www.ptt.cc/bbs/movie/M.1490801797.A.F9C.html
title: '[新聞] 韓版不能說的秘密明年開拍 網友不買單'
content: '（中央社記者姜遠珍首爾29日專電）周杰倫與桂綸鎂主演的「不能說的秘密」，是紅遍韓

  國的台灣電影，淡水碼頭也成為韓國觀光客來台必訪的知名景點，有韓國片商已經購買版

  權準備翻拍，最遲明年開鏡。


  對於韓版「不能說的秘密」翻拍計畫，熱愛台灣電影的南韓網友態度相當保留，大體上均

  表示反對。


  熱愛台灣電影的南韓網友紛紛上傳貼文表示，「名作最好不要去動它」、「草率動手必將

  蒙羞」、「不行！這部名作切莫亂動」、「若讓偶像去扮演男女主角，必將遭到辱罵」等

  。


  南韓「東亞日報」網路版今天指出，由台灣集作曲、歌手、製作人、導演及演員於一身的

  周杰倫和女演員桂綸鎂共同主演，並由香港演員黃秋生參演的電影「不能說的秘密」，

  2008年在南韓上映當時創下10萬觀眾的票房，2015年再度上映也引起熱烈迴響。


  「不能說的秘密」在南韓上映後，電影中出現的淡水碼頭等外景，已成為到台灣旅遊的韓

  國人一定要去的觀光景點。


  此外，也有南韓網友建議，韓版「不能說的秘密」可以考慮由朴寶劍、姜河那或劉亞仁等

  南韓演員演出。


  新聞網址：


  --'
