  \        《大佛普拉斯》\n\n\n\n台灣片於台灣上映票房排行(來源：維基百科)。基本上只有一部是2007年之前的：\n\n名次    年份    \
  \ 片名                       票房\n1       2008年  《海角七號》                $5.3億\n\n2 \
  \      2011年  《賽德克.巴萊(上)太陽旗》   $4.72億\n\n3       2013年  《大尾鱸鰻》                $4.3億\n\
  \n4       2011年  《那些年，我們一起追的女孩》$4.25億\n\n5       2015年  《我的少女時代》            $4.1億\n\
  \n6       2014年  《KANO》                    $3.4億\n\n7       2011年  《賽德克.巴萊(下)彩虹橋》\
