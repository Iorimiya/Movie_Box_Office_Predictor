url: https://www.ptt.cc/bbs/movie/M.1186943465.A.6B9.html
title: '[好雷] 不能說的秘密  還有bug問題??'
content: "本來對看\"不\"這在考慮, 因為看來好像愛情片, 沒特效怕浪費錢,\n後來看版上一直出現好評, 再加上電影名真的還蠻引起人好奇心的.\n\n\
  最後決定還是去看院線, 因為聽說背景曲都很好聽, 院線至少音響好吧\n\n一開始看, 嗯? 還好啊, 平淡無奇, 很純純的愛情片, 直至中段開始,\n劇情愈來愈有張力,\
  \ 且愈後面, 驚喜愈不斷, 就腦袋一直牽著走的感覺。\n\n看完了, 覺得還不錯看, 雖是國片, 但絕對值回票價, 音樂也很好聽,\n整部劇會讓人想到以前那種純純的愛、初戀、青澀的感覺,\
  \ 且也非全是\n單純愛情戲的因素, 秘密??  當然, 二個女主角都很正, 也比哈利好看(悶)。\n\n以下有雷:\n\n\n\n\n\n\n\n\n\n有一段,\
  \ 倫最後在舊琴房彈奏\"秘密\"時, 不是正在進行工程嗎?\n那他在彈琴時, 為何外面的人聽不到琴聲呢??\n\n解釋是, 挖土機與大鐵球挖來撞去的, 機器及崩落聲掩蓋了琴聲。\n\
  \n還有一個是我自己幻想的, 就外面的人在挖時, 突然從正崩落的建築物裡,\n傳來悠悠的琴聲, 大半夜的, 裡面怎會有??  莫非是遇到...@@\n\n於是工人們毛骨悚然,\
  \ 工頭就下令：「拆!!  快給我拆!!」 一邊默拜..\n\n...\n......\n\n好啦, 不好笑..\n\n先說我對劇情的感想:\n1. 小雨有沒有死:\n\
  A: 我覺得有\n   因為她在撞見倫手上的幸運鍊, 以為他已移情別戀(5個多月沒見), 傷心之餘,\n   回到過去後, 再加上身體很差(藥), 以及大受刺激下,\
  \ 將最後思念的心情, 拚\n   著最後一口氣, 寫在書桌上, 便..走了..\n   藥也沒帶在身上, 又或是, 在百般打擊下, 她也不願再活..\n\n\
  \   當然, 倫寫的回答她根本看不到, 因為她不確定倫還愛不愛她, 所以才在書桌\n   上\"問\" 我愛你  你愛我嗎?\n\n2. 倫最後回到過去時,\
  \ 小雨不認得他嗎??\nA: 我覺得不認得\n   因為1. 她看到倫的感覺, 好像陌生人似的, 禮貌性的點頭後, 繼續做她的事。\n       2. 最重要的是她\"\
  氣色很好\", 所以可以斷定, 是在還沒\"吃藥\"之前的狀態,\n\n   也就是, 倫回到的是, 小雨還沒發現\"秘密\"之前, 重新再追過..^^\n \
  \  也就是表示, 倫在彈奏秘密時, 速度比小雨還快, 才會倒流更久。\n\n\n3. 倫到底看不看的到過去的其它人??\nA: 我覺得可以\n   那, 秘密不是有第一眼限制嗎?\
  \ 這個有爭議的空間, 但我個人較合理認為,\n   在倫回到過去的同時, 琴也毀了, 於是倫不能回去, 自然魔力(?)也消失了.\n   就很單純的, 等於一個從未來回到過去的人,\
  \ 至於為何有第一眼限制??\n   那就得問當初該制定者的動機是??\n\n4. 倫有沒有死?\n   我覺得沒有\n   因為, 他是一身髒見到小雨的, 而且也拍了畢業照,\
  \ 如果他只剩靈魂??\n   那拍照時, 小雨的右邊應該會空一格, 醬的畫面不是很奇怪??  旁邊的\n   同學應該要緊靠著才對, 且他也換了那時代髮型了,也表示他們一起畢業\n\
  \   , 也就是小雨沒休學, 更證明倫是回到更過去的時間。\n\n   有版友提出一點, 其實他最後已被大鐵球KO, 最後是他自己的幻想, 我覺\n   得這個想法也不錯,\
  \ 但..人都掛了, 怎幻想? 誰來幻想? 觀眾自行幻想?\n\n   那倒不如說, 一開始, 其實整部劇都是一個癱瘓在床上的病人的自我幻想?\n\n另外, 有關BUG這個問題\n\
  \n我覺得除非是很明顯, 且又不合理的BUG, 否則, 常常看影評, 總是這個不合理\n, 那個不對勁的, 一部戲總要挑出毛病來他才爽.\n\n如此, 那\"\
  不\"片, 有時空跳越的梗, 我想, 也不用看了, 哪合現代邏輯??\n\n試想:\n你是來欣賞電影, 來看導演及編劇, 整部戲到底想表達什麼意界給觀眾,\n\
  而不是以\"大家來找碴\"的心態來看, 醬別人也不會認為你比較強, 反而\n認為, 你怎那麼會挑毛病啊?  如此? 請問, 哪部戲沒BUG??\n\n舉\"不\"\
  片來說, 一群人去看, 一散場. 談論著感想\n「哇~ 四手聯彈好好聽~」\n「好浪漫的戲~」\n「音樂好好聽~~」\n「桂綸美好正!」\n\n「不合理啦!!」\n\
  結果, 就有人一直講, 哪不對, 哪不合理, 依邏輯應該怎樣怎樣之類的.\n還蠻想問他, 這片你到底看到了什麼??  你那時在看的心態, 是試著融入\n電影情節呢??\
  \  還是一直拿著放大鏡, 挑足了毛病,  再來說怎樣怎樣??\n\n假設又看了\"變形金剛\"..\n大家依然在熱烈討論大黃蜂很可愛, 劇情很好笑等..\n\
  結果, 你又冒出, 「這片還好啦! 打鬥看的我頭暈了」..\n\n總喜歡以小疵掩大愉, 醬以後誰還想約你出來看電影??  興緻都沒了..\n\n\n最後, 對於不片我還假設了一點,\
  \ 就是, 何謂不能說的秘密??\n\n對小雨而言, 在她跳到未來時, \"跳躍時空\"就是她不能說的秘密。\n\n對倫而言, 回到過去後, 如果他隨意對人洩露\"\
  秘密\"的秘密,\n萬一更改了歷史, EX: 改變了他爸的未來, 而沒生出他, 不就..\n\n所以, 整個事情的始末, 就是一個\"不能說的秘密\"~~ ^^\n\
  \n\n\n\n\n\n\n\n\n--\n◆ From: 218.175.181.251"
