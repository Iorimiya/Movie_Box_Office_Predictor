title: '[討論] 不能說的秘密 和 不能說的夏天 誰值得看'
content: '不能說的夏天


  台灣名 寒蟬效應

  講述一個台東市大學音樂研究所

  主修巴松管的碩士生

  被指導教授兼交響樂團指揮強暴

  而後作小三得了斯德哥爾摩症狀自殺


  被輔導師周幼婷救援

  委託高中女友徐若瑄自訴的故事

  而辯護律師竟是指揮的妻子賈靜雯


  本片不出原聲帶

  但哀怨的交響樂時時若隱若現


  你吹奏的音符都證明你沒趣味價值

  對照主題曲演唱人陶喆的醜聞

  和貞潔的 不能說的秘密對照

  相當骯髒


  --

  Sent from my Android


  --'
