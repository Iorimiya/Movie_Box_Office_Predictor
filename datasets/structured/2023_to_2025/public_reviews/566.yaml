url: https://www.ptt.cc/bbs/movie/M.1427286613.A.81C.html
title: '[新聞] 周杰倫「不能說的秘密」 韓今春重上映'
content: '（中央社記者姜遠珍首爾25日專電）南韓媒體報導指出，由周杰倫、桂綸鎂主演的台灣電

  影「不能說的秘密」，時隔7年後將在南韓銀幕重新上映，南韓觀眾可於今年春天在電影

  院再次重溫經典。


  南韓「朝鮮日報」娛樂版報導，「不能說的秘密」曾於2008年1月在南韓30餘個藝術電影

  專用銀幕上映，共吸引10萬多名觀眾，周杰倫一人擔綱編劇、導演、表演和原創音樂，在

  南韓引起轟動，被評選為「最想在劇場重溫的電影」。此片上映後，周杰倫和桂綸鎂在南

  韓的粉絲大量增加。


  當時受到南韓電影製作公司兼發行商的排擠，「不能說的秘密」一片被逼得沒有院線肯排

  檔期供該片上映。在觀看過此片的南韓粉絲們上網爭取下，終於得以重新安排戲院檔期，

  再度與南韓觀眾見面。


  電影「不能說的秘密」講述了由周杰倫飾演的鋼琴天才「葉湘倫」是藝術高中的一名插班

  生，某日被某處傳來的一首鋼琴曲吸引住了。他來到其中一間舊琴房，遇到了「路小雨」

  （桂綸鎂飾），兩人之間發生的純純愛情故事。片中多次穿插周杰倫演奏鋼琴的劇情，超

  炫的琴技成為此片的一大看點之一。


  此次重新上映的「不能說的秘密」在影片的畫質和音響效果上，都將較7年前有很大的提

  高，將重新喚起南韓觀眾對於初戀的美好回憶。特別是，周杰倫在片中的鋼琴對決場面。


  「不能說的秘密」於2008年在南韓上映時，觀眾評分排名同期電影首位，7年後在南韓門

  戶網站Naver 電影的評分，仍然保持著9.28分的超高分（滿分10分）。


  新聞網址：


  --'
