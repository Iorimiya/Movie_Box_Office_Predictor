title: '[討論] 周杰倫為何一直不拍不能說的秘密2'
content: '最近周董新專輯上架

  除了複習他的經典歌曲以外

  我當然也複習了不能說的秘密這部紅到韓國去的國片


  想起來2010年周董不是說要拍續集

  現在12年過去韓國翻拍版都殺青了

  還是沒有消息


  不能說的秘密為何這麼好看

  除了取景的淡江中學、真理大學、淡水河堤很美以外

  耍帥的音樂才子根本就超適合周杰倫演

  不用演技做自己就好了

  再加上當年擁有絕佳空靈氣質的桂綸鎂

  比起現在一堆抖奶網紅完全不在同一個層次

  而音樂也都超好聽

  整張電影原聲帶都可以一邊工作一邊放著慢慢聽


  有人說周杰倫跟桂綸鎂都老了不能演高中生了

  我覺得沒差啊

  高中生找別人演

  他們就演穿越回去以後一直到中年的故事

  當年路小雨家窗台那個中年女人不就是中年小雨

  （因為跟小雨媽媽長的不一樣，又疑似出現在小雨房間）

  而且還一臉哀戚

  到底發生什麼事這個洞該補起來了吧


  雖然續集極難超越第一集

  畢竟天花板實在太高

  但周董音樂都走回他該有的風格了

  最能演他自己的不能說的秘密2是不是也該開拍啦？


  --

  我知道周董不缺錢

  但周董音樂都滿足粉絲走回原本的風格了

  電影也該來一下了吧

  而且不能說的秘密其實有很多洞沒有補起來

  包括我說的中年小雨在哀傷什麼

  還有葉湘倫到底是不是穿越到平行時空等等

  並不是小圈圈喔

  不能說的秘密於2008年韓國上映時是首個在韓國動員10萬名以上觀眾的台灣電影

  到了2015年時更被票選為最想在電影院重溫電影第一名並重新上映

  當然沒有啊，看看我的內文

  1.葉湘倫是到平行時空還是同時空的過去？

  2.中年小雨在惆悵什麼？

  3.秘密的琴譜是哪裡來的？

  4.黃秋生失去兒子以後能否想到辦法尋找他？還是不久後就有個中年兒子來跟他相見了？


  這是我臨時想到幾個能拍的點

  葉湘倫是穿越時間還是到了平行時空並沒有個答案

  電影設定的時間是1999年哦

  2015投票重上映第一名叫不紅？

  更不要說把版權買去翻拍這件事

  韓國會買的都是在國內紅過的劇本

  不然他們原創能量這麼強沒必要用買的

  我看不懂你的比喻

  2010年周杰倫說要拍續集時可是很轟動的

  至於還能演什麼我也說了

  可以爬文看一下

  不用悲觀的認為續集一定失敗

  你不用感到抱歉

  如果拍出來我會去看

  你不看也是你的選擇

  如此而已'
