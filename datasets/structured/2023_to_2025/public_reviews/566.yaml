url: https://www.ptt.cc/bbs/movie/M.1470406427.A.FD4.html
title: '[好雷] 《不能說的秘密》不說，是為了保有幸福'
content: '《不能說的秘密》迄今將近十年，仍是部令影迷津津樂道的音樂電影。周杰倫飾演的音樂

  高材生葉湘倫，與桂綸鎂飾演的路小雨，近乎一見鍾情的相遇之後，「喜歡」就像是彼此

  不說破的秘密，藏在輕鬆自然的互動裡，旁若無人地享受甜蜜的曖昧情愫。


  電影前三分之一是唯美的純愛劇情，畢業典禮湘倫察覺小雨的不存在則宛如鬼片，經過懸

  疑的回溯歷程，原來是部穿越劇！劇情的轉折動盪緊緊抓住觀影者，看著湘倫拚命以立可

  白訴衷情，不禁好奇著兩人能否重逢；相愛相遇是那樣不易，最後湘倫自舊琴房不顧一切

  地彈回去，小雨疏離而禮貌的笑容，顯然並不認識他，曾經共有的回憶已不復在，但這一

  回，他有的是時間，再沒有誰需要離開了。





  黃秋生飾演的老師思想古板，認為唯有聽音樂才不會胡思亂想，對學生或對兒子湘倫同樣

  嚴格；然而，青少年不都是在胡思亂想中慢慢長大嗎？


  優秀的學生鬱鬱寡歡，身為導師努力地陪伴並聆聽，只可惜他雖對小雨說著相信，實則對

  她的精神狀態擔憂，因此打破了對她的保密承諾，將情況告知班長與家長；以善意出發，

  卻引起同學的言語霸凌，母親的焦慮怨懟，將本就認為自己受了情傷的小雨，逼至更加痛

  苦的懸崖邊緣。


  在諮商輔導中，為當事人保密是最基本的要求，唯有自殺、刑案等危及自己或他人之可能

  時，才必須做出預警，否則不單單破壞了諮商關係，更可能釀成傷害。





  《不能說的秘密》集結了幾個元素：原創故事、李屏賓的攝影、亞洲天王、迷人的女主角

  、好聽音樂，成為一部連韓國影迷都喜愛，甚至相隔八年再次躍上大銀幕的愛情電影。筆

  者認為本片遠勝近期的熱門國片《少女時代》、《那些年我們一起追的女孩》等，因為以

  音樂高昂低迴牽動的情緒，相對來說較為和緩舒服，比起其他熱門片外放的情緒更能溫柔

  的在心中流轉不已。可惜當年臺灣處於電影業低潮，票房普通。


  在攝影師呈現的畫面裡，老舊的琴房有了迷炫的魔力，小情侶以單車出現在木棧道、雨後

  花徑的身影，都洋溢著青春的清新。太多片段值得單獨觀賞，鬥琴、四手聯彈，尤其是拆

  琴房時崩塌中的最後一曲，機械與琴音激盪，令人忍不住跟著緊張到雞皮疙瘩。


  就算有人批評周董在片中只是演自己，那又何妨？符合角色需求的靦腆隨和，帶點天才的

  自傲自信，因為真正擅長，更是把音樂玩得極為自然，順手拈來都是美妙音符；他與演技

  本就受到肯定的桂綸鎂互動輕鬆俏皮，加上其他各個元素，成功締造了一部質感絕佳的經

  典國片。


  --



  --'
