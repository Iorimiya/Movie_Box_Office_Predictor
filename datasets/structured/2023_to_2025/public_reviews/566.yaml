url: https://www.ptt.cc/bbs/movie/M.1644242765.A.F37.html
title: '[新聞] 暌違4年…韓版《不能說的秘密》終殺青！'
content: '新聞網址：



  暌違4年…韓版《不能說的秘密》終殺青！官方曝高甜劇照「D.O超溫柔眼神」引熱議


  記者古靜兒／綜合報導


  天王周杰倫首部自導自演的音樂電影《不能說的秘密》2007年上映後叫好叫座，不僅風靡

  全亞洲，更在2015年獲南韓民眾票選為「最想在電影院重溫電影」冠軍，電影當年也在南

  韓重新上映，沒想到還在2017年宣佈翻拍此作，直到去（2021）年宣佈由夯團EXO成員D.O

  都暻秀、元真兒、辛睿恩等實力派新生代演員領銜主演，電影日前釋出首波劇照，由新一

  代男神重新演藝鋼琴天才「葉湘倫」一角，讓粉絲又驚又喜。


  都暻秀飾演原版中由周杰倫扮演的鋼琴天才「葉湘倫」一角，元真兒則飾演原版中由桂綸

  鎂扮演的女主角「路小雨」一角，辛睿恩則飾演原版中由曾愷玹扮演的校園女神「晴依」

  一角。據韓媒報導，韓版《不能說的秘密》由驚悚電影《迴憶》的徐有玟導演執導，除了

  卡司和幕後製作團隊實力堅強外，原版上映後火遍全亞洲的電影原創歌曲流傳至今，也讓

  不少影迷相當期待韓版的電影主題曲。


  韓版《不能說的秘密》在今（2022）年1月21日殺青後，不少影迷都在敲碗官方趕快公佈

  上映日，而官方日前則搶先公佈劇照，只見由都暻秀飾演的男主角「柳俊」（音譯，），

  和由元真兒飾演的女主角「靜雅」（音譯，）在燈光溫暖的唱片行中，戴著耳機共享同一

  首歌曲，甜蜜氛圍更是讓影迷對上映日相當期盼。



  --

  這個社會一直在談家庭、教育，以及工作間的平衡，我辭職之後回家帶小孩，

  我沒想到這個社會是如此的不安全。


  我真的很希望政府、各級單位，能夠做些事情讓媽媽放心帶小孩，

  或者是讓媽媽放心工作


  --'
