url: https://www.ptt.cc/bbs/movie/M.1658655892.A.80E.html
title: '[好雷] 不能說的秘密'
content: '一開始確實不看好這片，

  直到也是同樣認為應該是糞作的朋友說很訝異竟然很好看，

  所以才看。也確實讓我相當訝異，沒想到竟然拍得很好，

  個人也認為算台灣目前最強國片。



  這部片用愛情和音樂做為故事的其中一項主軸，本身限制算蠻大的。

  其中有鬥琴這個世界觀，是很不錯的創意，

  有點像是街頭鬥牛的概念，多加著墨有改造成真正街頭遊戲的潛力。




  男女主角的感情路鋪陳的很不錯，有讓人希望這對會成功的感覺，

  雖然說超時空這劇情有點跳Tone，但還能接受，

  而且有完整解釋中間的過程，不會充滿Bug，

  結尾的地方仔細回想，又會讓人覺得「原來如此」，

  實屬非常難得。


  不會像某些片，要弄懸疑，結果根本Bug一堆，

  所有的懸疑都來自於因為劇本太爛了，所以很懸疑，前後根本不能解釋等等。

  這部片的完美閉環，可圈可點。



  立可白的部分，是個人非常喜歡的一段，

  也是我們這一輩人共同的回憶，


  用立可白寫字是這一輩人特有次文化，

  也是當時人用於表白、偷罵人的常用手段，


  加上那位長相酷似桂綸鎂的女主角被同學霸凌，

  因此用這種方式寫在桌上，是非常好的設定。


  (雖然一般來講，正妹根本不會被霸凌就是了。)

  因此影片中立可白從新變舊的片段非常有意思


  而長相酷似周杰倫的主角，在立可白用光後，用狂點的方式寫字

  也是一段很有創意的表現，給這邊滿分。




  一般來說彈鋼琴跟「緊張刺激」要聯繫在一起，是有那麼點困難，

  劇情中讓長相酷似周杰倫的主角進入琴房，而琴房正在拆除

  這樣的安排，使劇情變成「彈不好就會死」，確實畫面的緊湊感提升許多，

  這是很好的安排。


  總體而言這片在我心目中還是台灣國片第一名無誤。





  --

  恩恩你好棒喔 哇好有見識喔

  笑死，什麼被抓到周杰倫巨星跟青峰俠？

  完全不知道你在講三小，麻煩截圖po出來笑笑

  誰叫國片這麼不爭氣呢？

  刺陵沒看過，完全沒興趣耶'
