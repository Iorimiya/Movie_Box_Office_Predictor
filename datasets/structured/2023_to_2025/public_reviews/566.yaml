title: '[討論] 韓版《不能說的秘密》預告'
content: '韓版《不能說的秘密》預告



  鬥琴部分有拍出來！



  《不能說的秘密》(英語：Secret: Untold Melody）是一部計劃2025年1月28日上映的韓

  國奇幻愛情片，翻拍自2007年台灣同名電影《不能說的秘密》，由《明天的記憶》的導

  演徐宥敏執導，都敬秀、元真兒主演。


  * 都敬秀 飾演 宥俊，在海外活動的天才鋼琴家，作為交換生來到韓國後，和貞雅陷入命

  中注定的愛情中


  * 元真兒 飾演 貞雅，深藏秘密的音樂學院學生。


  * 辛叡恩 飾演 仁熙，小提琴專業學生，性格活潑、率直，總是和宥俊對視並對他感興趣


  cr.維基百科


  --'
