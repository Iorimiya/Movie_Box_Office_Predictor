  \           $1.05億\n\n\n以上兩項資料供各位參考。\n\n\n要我排出前十部，說真的也不容易，不過以下我也提供這十年間，個人覺得滿重要的作品\n\
  給大家參考：\n\n\n2007《色，戒》李安\n為台灣拿下威尼斯金獅獎、金馬獎最佳劇情片與導演。但是合拍片且非台灣故事。\n\n\n2008《海角七號》魏德聖\n\
  台灣影史票房最高國片，也帶動國片後續票房，可以看出票房排行榜幾乎都是2008後的。\n\n\n2009《不能沒有你》戴立忍\n國片低迷時期，勇奪金馬最佳劇情片與導演。導演戴立忍也是台灣電影重要人物之一。\n\
  \n\n2010《當愛來的時候》張作驥\n國片低迷時期，強勢入圍金馬獎14項獎項，且奪下最佳劇情片在內三座獎。張作驥導演從\n《黑暗之光》、《美麗時光》，就留下台灣影史重要作品，在《當愛來的時候》登頂之後\n\
  ，又創作出《醉‧生夢死》大作。可惜後來做了不好的事……\n\n\n2010《第四張畫》鍾孟宏\n國片低迷時期，入圍金馬獎7項，且奪下最佳導演，與《當愛來的時候》攜手橫掃。導演\n\
  鍾孟宏第二部作品，後續《失魂》、《一路順風》也都很棒。\n\n\n2011《賽德克‧巴萊》魏德聖\n上集為台灣影史國片票房第二，且為票房排行榜上，與《色，戒》唯二同時奪下金馬獎最\n\
  佳劇情片，堪稱藝術商業兼具大作。\n\n\n2011《那些年，我們一起追的女孩》九把刀\n台灣影史國票票房第四名，吹起青春電影熱潮，後續如《我的少女時代》、《等一個人咖\n\
  啡》，票房也很好。同時九把刀小說也開始大量跨入電影，後續如《樓下的房客》票房也\n有佳績。\n\n\n2012《女朋友。男朋友》楊雅喆\n愛情、同志、台灣民主歷程三議題完美融合作品，且將國片低迷時期唯一有票房號召力的\n\
  電影明星桂綸鎂推上金馬影后。\n\n\n2012《牽阮的手》莊益增、顏蘭權\n國片低迷時期，其實是靠紀錄片撐的，但當時重要的作品《無米樂》、《翻滾吧男孩》、\n\
  《奇蹟的夏天》都是2007年以前。《無米樂》導演2007後的《牽阮的手》是記錄台灣追求\n民主過程的重要作品。\n\n\n2013《郊遊》蔡明亮\n勇奪威尼斯影展評審團大獎，且是蔡明亮與金馬獎風風雨雨過後，睽違多年再度拿下金馬\n\
  獎最佳導演，並將愛將李康生推上金馬影帝。\n\n\n2013《看見台灣》齊柏林\n台灣影史票房最高記錄片，唯一破億。同時也是這十年來，唯一撼動台灣政壇，影響政策\n\
  方向的電影。永遠懷念導演齊柏林。\n\n\n2014《KANO》馬志翔\n台灣最多人觀賞的運動棒球主題，票房與藝術成就最高的電影。\n\n\n2015《刺客聶隱娘》侯孝賢\n\
  勇奪坎城影展最佳導演，侯孝賢2007年後唯一長片作品。但是合拍片且非台灣故事。\n\n\n2016《再見瓦城》趙德胤\n導演趙德胤自緬甸來台學電影，現已歸化台灣國籍。當資源少時，就已拍出如《冰毒》如\n\
  此受注目的作品。《再見瓦城》是第一部擁有較多資源的作品，同時也讓愛將吳可熙，以\n及改過自新的柯震東，雙雙入圍影后影帝。\n\n\n2017《大佛普拉斯》黃信堯/《血觀音》楊雅喆\n\
  今年的片應該不用多做介紹了。\n\n\n2017《紅衣小女孩2》程偉豪\n特別提一下，國片首部票房破億鬼片。\n\n\n以上作品超過十部，結論是我個人主觀不會排《不能說的秘密》啦。\n\
  \n\n\n\n\n\n--\n\n我列舉的重要電影並沒有《大尾鱸鰻》，就是因為除了票房也參考了作品質感。《不能說\n的秘密》在質感上贏《大尾鱸鰻》，但其他方面也不足以達到前十呀。後面電影票房是搭\n\
  熱潮沒錯，搭得是《海角七號》的熱潮，表示《海角七號》也是在低迷時上映，但他有本\n事掀起熱潮。其實我列舉的重要電影，純看票房不看入圍的也只有《那些年》，而《那些\n\
  年》也掀起了青春愛情電影熱潮。\n\n所謂得獎片讓觀眾覺得無聊部分，確實是如此。但是當世界各國學電影史時，學到台灣一\n定提到台灣新浪潮，尤其是侯孝賢、楊德昌兩位導演。他們的作品是台灣重要國片無庸置\n\
  疑，但也是一般大眾會覺得無聊的作品。大眾無感跟影史中重不重要，有時沒那麼相關啦\n。"
