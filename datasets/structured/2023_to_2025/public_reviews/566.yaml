  \n13      2015年  《大囍臨門》                $2.5億\n\n14      2013年  《看見台灣》(最高票房紀錄片)$2.2億\n\
  \n14      2014年  《大稻埕》                  $2.2億\n\n16      2000年  《臥虎藏龍》(合拍)     \
  \     $2億\n\n17      2012年  《愛》(合拍)                $1.8億\n\n18      2016年  《大尾鱸鰻2》\
  \               $1.7億\n\n19      2012年  《犀利人妻最終回：幸福男‧不難》\n                     \
  \                       $1.5億\n\n20      2011年  《雞排英雄》                $1.4億\n\n\
  20      2016年  《樓下的房客》              $1.4億\n\n22      2012年  《痞子英雄首部曲:全面開戰》(合拍)\n\
