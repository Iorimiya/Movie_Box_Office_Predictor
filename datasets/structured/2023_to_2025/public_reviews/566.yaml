url: https://www.ptt.cc/bbs/movie/M.1188150514.A.DFF.html
title: '[好雷] 不能說的秘密 音樂的神奇旅程'
content: "黑白的琴鍵、奔放的旋律、華麗的節奏\n這是一趟音樂的秘密旅程\n在旅程中認識了你..........\n演奏出動人的愛情樂章.\n甜蜜的四手聯彈、兩小無差的甜蜜時光\n\
  DO RE MI......\n\n也許這只是老天爺開的一個玩笑，卻改變了你我的未來\n(也許是整個世界....)\n\n\n如果你有機會穿越時空，你希望做什麼？帶著未來的技術回到過去而成就大事業？見見爸\n\
  媽小時後？還是談一場跨越時空的愛戀？\n\n小雨跟著琴鍵，來到了二十年後的琴房\n老舊的鋼琴，泛黃的琴譜、陌生的人群，\n小倫，是小雨第一個見到的人，也是這一生的最愛\n\
  鄉野間騎著腳踏車、雨中的約會、在琴房的四手聯彈\n用音樂訴說著兩人的默契....\n\n「你愛我嗎？」小倫始終沒有給一個正確的答覆\n卻造成了一個不可避免的誤會\n\
  \n「你一定要彈的這麼快嗎？」\n「我回去都彈的這麼快阿.....」\n\n誤會...........................................\n\
  \n小雨怎麼不見了？\n你一直都是自己一個人阿....\n揭開秘密的真相\n原來....................\n一切都與自己有關\n\n「不可以！」知道真相的父親\n\
  等不到兒子\n因為另一段神秘的音樂旅程...即將展開\n這段旅程，不只是旅程\n而是改變了命運............整個未來\n\n==============================================================================\n\
  \n之前就知道不能說的秘密電影引起網友廣大迴響，今天去看果真動人。前面的甜美動人，\n後面的淒美緊湊，搭配不時的幽默，更揪住了觀眾們的目光。周杰倫的第一部自導自演是\n\
  成功的，抓住了觀眾們的心。沒有太過深奧的意境，卻同樣揪住觀眾們的心房。他選了自\n己最拿手的--音樂，加上觀眾們愛看的「感情戲」+「時空遊戲」，因此讓正在看戲的大家\n\
  ，睜大眼睛想知道秘密。\n\n很喜歡電影的一些運鏡手法，用鏡頭呈現音樂的速度與旋律，在彈指與琴鍵中，表達音樂\n的奔放之感。黑鍵與白鍵，在速度之中早已合而為一，所有的升降記號、N拍子早已幻化為\n\
  齊一，讓人感動再三。無論是高手鬥琴的片段，還是與小雨的四手聯彈，透過螢幕卻感受\n到音樂的跳耀...\n\n前後的呼應也不錯，前戲算是鋪陳，在後段作出解釋。原來這一切，小雨只是一個不存在\n\
  這時空的人。最喜歡的片段，就是小雨以及小倫，在不同時空傳遞愛情。「我愛你，你\n愛我嗎？」在即將乾燥的立可白，來不及說出我愛你的同時，用一個愛心，卻足以說出小\n\
  倫濃烈的愛情與思念。 除此，為了趕在琴房拆除之前，能回到過去與你相聚，那種驚濤駭\n浪的決心....\n\n「為了你，我願意回到過去，重新開始.....只要我找到這個秘密」\n\
  \n跨越時空的愛情也許是錯誤的，但最終的加害者，是小倫的父親、小雨的媽媽、還有那些\n同學們！看到了琴譜的畫像，小雨的媽媽說著：「我應該相信他的。」同事說小倫的父親\n\
  很可憐，如果兒子回到了過去，怎麼辦？\n\n幾個推論與解答\n\n1. 回到了過去，也許父親根本沒有小倫這個兒子...\n2. 回到了過去，如同最後的結局，小雨順利的畢業了，更不可能有被當作精神病看待\n\
  3. 回到了過去，小倫和小雨重新開始，重新交往(小倫應該回到了小雨還沒開始旅程的時間)\n\n最後要說，桂綸鎂真的很有氣質，周董也選擇自己最擅長的音樂，詮釋的不錯。黃秋生老牌\n\
  演員，更穩住了父親的角色，以及讓氣氛緩和的重責大任，一些襯葉也都克進職責。\n\n蠻推薦大家進戲院，一起體驗音樂的神秘旅程....\n\n\n不能說的秘密 音樂的神奇旅程\n\
  \  (圖+文)\n\n--\n我的戲劇blog：\n\n\n--\n◆ From: 203.69.41.51"
