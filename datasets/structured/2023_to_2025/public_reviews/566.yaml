content: "1. 六號出口 (2007) [后期製作中]\n2. 不能說的秘密 (2007)\n3. 國士無雙 (2006)\n4. 宅變 (2005\n\n\
  \n\n魯冰花 (1989)\n花樣年華 (2000)\n最好的時光 (2005)\n小城之春 (2002).........作品太多 剩下的請看連結\n\n\n\
  《藍色大門》\n《五月之戀》\n《天邊一朵雲》\n《最好的時光》\n...等\n\n曾獲第五十四屆坎城影展最佳技術獎\n二十九屆亞太影展最佳音效獎\n獲得第 三十\
  \ 三十八 四十三屆金馬獎最佳音效\n二十二 二十九 三十二屆金馬獎最佳錄音......等等\n\n詳見連結\n\n\n\n\n1.不能說的秘密 (2007)\n\
  2.江湖 (2004)\n3.霍元甲 編劇之一\n\n\n\n\n電影作品：\n不能說的祕密 (2007)、大丈夫 (2006)、慌心假期 (2001)、爆裂刑警\
  \ (1999)、\n特警新人類 (1999)、愛在娛樂圈的日子 (1998)、追凶20年 (1998)、殺手之王 (1998)\n、神偷諜影 (1997)、算死草\
  \ (1997)、衝鋒隊之怒火街頭 (1996)、玩火 (1996)、阮玲玉\n (1991)\n\n後來發現\n台灣電影人論壇\n有詳細說明\n\n\n\n\
  不過雖然團隊很強\n但是也常常會發生有好的團隊\n但是拍出爛的片的情況發生\n且他也第一次執導\n所以以此來說\n算不錯了\n何況\n就國片長期低迷的情況來說\n\
  不管怎樣這部片\n也真的引起很多人的焦點\n也讓很多人願意花錢進去電影院看\n--\n◆ From: 125.225.106.241"
