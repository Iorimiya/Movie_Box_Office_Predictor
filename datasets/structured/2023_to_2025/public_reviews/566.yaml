url: https://www.ptt.cc/bbs/movie/M.1194886839.A.6A7.html
title: '[好雷] 令人惆悵又心痛的不能說的秘密...'
content: "不能說的秘密是好片，不過我因為周董之前的\"杰作\"的印象...一直沒有去看..\n\n好好看阿...T______T...這是我的主要感想...不過對於結局有點小意見...\n\
  \n====================================================================\n\n我的看法是...已經發生的事情是無法挽回的...\n\
  就像曾經害我暴淚的A.I裡面講的...\n        \n\n葉湘倫在的1999算是好了，\n這時空A裡有變老的黃警官，變老的小雨的媽媽，正常出現正常長大的葉湘倫，\n\
  \n最重要的是...這段時空裡面有...\n\n在20年前因為秘密被揭露而身心受創一個人孤單走過20個年頭的...\n\n(先姑且不論小雨是20年前就掛了還是經過20年變成了...=\
  \ =)\n\n路小雨在的1979年 ...是時空A的前段，\n也就是沒有這一段就不會有後面葉湘倫的時空A...\n\n而最後葉湘倫在鐵球的逆襲的前一刻回到的...是...另一個平行宇宙...\n\
  \n\n\n而你試圖回到過去更改的，\n只是另一個時間點接近的人物相同但\"靈魂\"卻不同的時空B...\n所以最後回到\"更過去\"的時空B的葉，遇到的是一個不一樣的女孩...\n\
  一個...\n\n就像是開先例的七龍珠裡面的有個特南克斯\n不管他在自己的世界作什麼努力，他的世界裡面的孫悟空都已經因為心臟病發而掛點了\n他回到過去只是要阻止\"\
  另一個悲劇重演\"，\n所以他在新世界的努力讓孫悟空可以不用心臟病發，不然七龍珠可能30集就完結篇了\n\n我也不想扯啥\"祖父矛盾\"或是\"蝴蝶效應\"，因為我也不是這方面的專家...XD...\n\
  \n重點在於...\n\n那表示最後葉湘倫跑回過去找到小雨根本沒有意義阿...\n\n周董自己也有講:\"葉湘倫最後一次談的比較快，所以他回到更從前去了\"\n\
  從最後一幕應該也可看出，那時候小雨還不認識葉湘倫\n\n他遇到了時空B的小雨，然後最後兩人快樂的再一起重新在畢業照上出現...\n\n可是...這樣至少...\n\
  \n對不公平...這就不用講了，養兒子養到和一個阿姨私奔..= =..\n\n對不公平...\n\n如果她還活著，那她這20年過的一定超可憐的，在失去了全世界的信任後...\n\
  孤獨的走過了20年的歲月，還可能因為長期誤用精神方面的藥而真的出毛病...\n雖然兩個人不可能再在一起，但如果見面了至少可以了卻這20年的缺憾阿...\n\n\
  但她掛念了20年的人在知道真相後，選擇的竟然不是和她重新會面，\n而是找尋另一個的女生重新開始新生活...\n\n更哀傷的是，對也不公平，而且是...\n\n\
  葉湘倫穿越時空回來找的...並不是她，是在1979時空A的小雨\n\n她不是那個忽然出現喜歡吃醋喜歡戳人臉頰的神秘女孩\n她不是在親了葉湘倫後氣喘發作，或一起用冰淇淋乾杯的女孩，\n\
  可能以後葉湘倫也會用腳踏車載她回家，但真正靠他背的卻是另一個女孩\n\n就像段譽其實從來沒有真正的找到自己的愛人一樣...\n他迷戀的不是王語嫣，而是無量山的石洞中的一樣...\n\
  \   ...................................她們...都只是別人的影子\n\n簡單的說，只有爽到葉湘倫，容我說聲-\n\n==========================================================================\n\
  \n其實如果我是葉湘倫，我知道事情的始末之後，想做的事情應該有兩件吧...\n\n我先承認我沒有爬鷹架還有和鐵球玩白金之星的膽量...(￣ー￣；)\n\n\n\
  \       因為，理論上，時空A的小雨應該是完全沒有看到最後周董補在上面的的..\n\n\n       不管她是還健在變成中雨了還是在20年前最後用立可白破壞完公物就抱憾而終..\n\
  \n如果最後一幕是...\n       一個滿臉倦容的中年婦人回到寢室，\n       發現自己珍藏了20年的畫像被人動過了跑到桌上...\n      \
  \ 氣急敗壞的她拿起畫像準備收好，\n       卻發現壓在下面的是那段刻著20年前得不到回應的木板...\n\n\n\n\n\n\n\n\n\n不過平心而論，我覺得小雨已經在20年前就消逝了，\n\
  不然如果妳是她，妳會不會去阻止重新再經歷一次刻骨銘心的旅程，\n妳會不會告訴跑到20年後的自己，接下來等著他的是全世界的背叛...\n或妳會不會想在20年後重新看看當年的那個男孩...可是她都沒有出現...\n\
  \n\n所以如果假設小雨在20年後早就不在了，\n她媽是因刺激太大才有那些不肯接受事實的言行...\n\n最後一幕應該就是...\n      葉湘倫反覆的在橋上騎單車，遊走唱片行.校園裡每塊兩人曾一起踏過的足跡，\n\
  \      他失去了小雨，卻還依戀著她的身影，但無奈的只有徒增惆悵而已...\n直到另一個雨天...\n      躲雨的過程中，另一個女孩闖進來和他一起躲雨，\n\
  \n\n\n\n\n\n\n\n\n\n      就這樣聊了起來，就這樣他的人生時間繼續走下去...\n      最後一幕是下雨的場景，隨著主題曲的響起，鏡頭由遠拉到近...\n\
  \      鏡頭裡的只有...某塊刻著立可白的木板靜靜的平躺在某人的墓前...\n\n\n\n\n\n\n好吧，其實我只是想幫小雨平反而已，她太可憐了...T_______T....\n\
  \n桂綸鎂演的真好，看她誤會後躲到門後哭泣，我也跟著心碎了...\n看她萬念俱灰的看著自己唯一個親人也不相信自己時吞下藥的神情，我的心也沉了..\n\n周董真的是很有才氣的人，很多東西都有自己的一套，\n\
  如果生在網球王子裡面，把恐龍滅絕的人可能就不是手塚了...(￣ー￣；)\n\n=============================================================================\n\
  謝謝大家的支持~還有season002大的幫忙改錯字，我還以為會被噓想太多之類的..= =..\n我可以偷推自己blog的版本嗎..= =..\n\n\n...........................因為我覺得...blog裡面的\"\
  木板\"做的比較好...(逃)\n\n--\n                     \n--------\n----!!\n\n福遊生務~\n      \
  \   ..........................其實退伍令才是主角，我只是駝獸..￣⊿￣|||\n\n--\n◆ From: 220.142.129.184"
