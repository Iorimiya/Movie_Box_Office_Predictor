url: https://www.ptt.cc/bbs/movie/M.1512268600.A.C84.html
title: '[討論] 不能說的秘密在近10年國片排得上前十嗎？'
content: '2007周杰倫桂綸鎂主演的不能說的秘密


  當年紅到韓國去，還讓淡江中學成為觀光勝地


  一轉眼就十年過去了


  在2008年海角七號帶動國片復興後，許多好片如雨後春筍般出現


  不能說的秘密或許不及海角七號的火熱，也不及賽德克巴萊的大手筆大場面磅礡氣勢


  如果攤開近十年國片(2007~2017)，不能說的秘密大概排第幾


  能列在前十名內嗎？


  讓我們複習當年充滿懸疑的預告




  還有從頭彈完可以回到過去的Secret曲




  以及著名的鬥琴片段




  不能說的秘密究竟整體評價排名會排在哪呢


  --'
