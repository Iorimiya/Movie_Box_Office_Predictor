title: '[請益] 《不能說的秘密》導演跟編劇'
content: "作者  OGC789456123 (好煩阿)                                      看板  movie\n\
  \ 標題  [新聞] 《不能說的秘密》翻拍韓版！\n 時間  Wed Mar 29 18:05:08 2017\n推 G0512: 我不是要酸但事實是，杰倫非導演更不是編劇，要戰請先弄懂\
  \   03/30 01:08\n→ G0512: 導演跟編劇到底在做些什麼                                 03/30 01:08\n\
  \n\n\n維基：\n《不能說的·秘密》（英語：Secret）[2]是臺灣藝人周杰倫自行製作的首部電影，於\n2007年上映，由其本人編劇、導演及擔任主要演員\n\
  \n\n\n\nG0512說的是指什麼啊？\n\n謝謝\n\n--\n查了片名+掛名\n\n電影的原創故事是周杰倫本人，亦即劇情的概念而已，\n其他都是來自另外一個編劇「杜緻朗」，\n\
  這位女生是最近冒起的編劇，從《江湖》到《霍元甲》，\n到現在的《不能說的秘密》，都是由她編寫。\n但是為了加強電影的話題性,編劇還是掛名了兩個人:\n周杰倫跟杜緻朗"
