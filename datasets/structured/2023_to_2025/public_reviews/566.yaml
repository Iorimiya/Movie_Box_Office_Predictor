title: '[討論] 不能說的秘密主角換成誰會讓本片變神片'
content: '當年"不能說的秘密"上映時

  我也是跟上一篇討論"少女時代"與"不能說的秘密"底下的推文一樣

  撐了好久一直走不進戲院

  因為我實在咽不下周董的演技,但又欣賞著桂綸鎂

  掙扎.........


  一直到下片後的某一天去朋友家喝酒

  剛好他租了這部片子,就當下酒菜把他給配了


  看完後只有一種感覺

  周董這麼生硬的演技,竟然沒能把我踢出劇情之外

  甚至尾段我還紅了眼眶 =::=


  雖然之前就聽說過鬥琴橋段是取材於海上鋼琴師

  但畢竟只是一小段

  而且就國片商業片的編導水準來說,本片已可說得上是佳作了

  唯一可惜的還是在周董身上

  角色氣質個性的設定對了,演技就差了那麼一點

  遺憾


  想請問版上喜歡這部片的各位大大

  如果將周董留在幕後

  誰會是大家心目中的最佳男主角人選?





  --


  沒錯 就是這種感覺'
