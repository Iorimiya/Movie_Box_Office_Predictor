title: '[情報] 日本版《不能說的秘密》正式預告'
content: '主題曲：SixTONES《ここに帰ってきて》

  翻拍自周杰倫執導同名電影的日本版《不能說的祕密》正式預告，河合勇人執導，京本大

  我、古川琴音主演，6月28日日本上映。


  該片講述音樂大學學生湊人在過去的事件中受到創傷，她與雪乃在鋼琴的引導下相互吸引

  ，雪乃的天真爛漫和動人心絃的琴音撫慰了湊人，兩人一起度過的日子變得無可替代，但

  有一天，雪乃從湊人面前消失了。








  --'
