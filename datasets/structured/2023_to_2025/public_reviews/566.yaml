url: https://www.ptt.cc/bbs/movie/M.1490781910.A.9B1.html
title: '[新聞] 《不能說的秘密》翻拍韓版！'
content: '新聞網址：


  記者吳孟庭／綜合報導


  電影《不能說的秘密》在南韓受到喜愛，2015年甚至在韓重新上映，成功打開周杰倫與桂

  綸鎂知名度。而有南韓導演看上此劇本，決定翻拍成韓版電影，目前已經進入劇本改寫階

  段，主角將從設定的高中生換成大學生。


  據《Star News》報導，南韓製作公司已購買《不能說的秘密》版權，將改編原著劇本，

  與周杰倫飾演的高中生不同，主角設定為音樂大學學生，目前已經進入劇本改寫階段，現

  正物色適合的導演，確定導演後才會進行選角。


  《不能說的秘密》2008年在韓上映，創下台灣電影在韓首個突破10萬觀覽人次的紀錄，周

  杰倫身兼導演、編劇、配樂到主演，1人扛4責任讓南韓觀眾嘖嘖稱奇，電影更因為廣受好

  評，7年後（2015年）竟然再度上映，電影場景至今仍是許多南韓觀光客訪台必去景點。


  --'
