url: https://www.ptt.cc/bbs/movie/M.1589623166.A.EEE.html
title: '[好雷]不能說的．秘密:生錯時代卻歷久不衰的戀曲'
content: '圖文網址：


  影片心得：



  不能說的．秘密：生錯時代卻歷久不衰的戀曲


  上映時間：2007/07/27   導演：周杰倫


  觀看時間：2020/05/08



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  　　【不能說的．秘密】，相信大部分的台灣人就算沒看過也聽過這部周杰倫於2007年自


  導自演的電影；以前國中音樂老師是周杰倫迷，就曾經在上課放時給我們看過，但因為我


  當年上課不太認真，對這部片的印象就只是普通而已；前幾天心血來潮，就把這部十三年


  前的國片翻出來重看了一次。看完感想：好看！這部電影真的是生錯年代啦！！



  　【不能說的．秘密】的故事大概可以分成前後兩段；第一段的故事，就是一段男歡女愛


  ，男女主角談戀愛的故事；在談戀愛的過程中，女主角其實有那麼一點神祕，之所以會如


  此神秘，就是因為她有一個不能說的秘密，而解開這個伏筆，就是電影後半段的重點。




  　　【不能說的．秘密】前半段愛情故事，除了主角葉湘倫與路小雨的互動好看之外，故


  事還以音樂包裝這一段戀曲。兩個人在設定上，都是熱愛音樂、愛彈鋼琴的音樂人；這對


  情侶除了藉由音樂相遇之外，也藉由音樂互動。電影以校園的課堂與活動帶領故事，並成


  功以音樂跟對話塑造兩位主角的感情，就是電影好看的地方。




  　　這個「不能說的．秘密」究竟是什麼，就是電影後半段的重點；電影除了解開這段伏


  筆之外，也交代了女主角路小雨背後的故事與背景，讓這位神祕少女的角色刻劃更為立體


  。如果你還沒看過本片，劇透的部分能避開就避開；如果你已經看過電影了，強烈推薦你


  再重看一次，知道一切的真相後再重頭看一次，會有完全不一樣的感觸，故事前後呼應的


  安排就是這部電影用心的地方。




  　　【不能說的．秘密】男女主角分別是周杰倫與桂綸鎂，桂綸鎂的氣質與演出，就是路


  小雨的完美詮釋；有人說周杰倫的演技是敗筆，但老實說我的感覺完全相反，在我看來葉


  湘倫完全是周杰倫以自己為底創造的角色，我真的完全想不到有任何一個演員能取代周杰


  倫演自己。配角的部分，爸爸與晴依在故事上的定位與發揮也相當不錯，讓我覺得好家在


  的是打橄欖球的兩位同學，這種八嘎囧的角色在國片裡超級容易成為敗筆，但本片有適時


  地踩住煞車，沒有讓這兩位成為缺點。




  　　【不能說的．秘密】有沒有深刻的寓意？我自己覺得還好，本片就是以一個伏筆包裝


  的純愛故事，但電影的故事拿捏得非常好，電影在該甜的地方發糖，該難過的地方發洋蔥


  ，再配上音樂與畫面呈現上的用心，讓觀眾能夠輕易跟上電影的節奏，並享受這對情侶從


  相遇到相愛的故事。




  　　台灣的國片在2008年的【海角七號】後復甦，而在愛情片這一部分，真的有太多電影


  的劇情生硬到不行，感情發展毫無說服力，故事轉折狗血到不行；為了避免引戰，我這邊


  就不舉例了，但真的有好幾部票房不錯的國片我連看都看不完。與眾多國片商業愛情片相


  比，【不能說的．秘密】不但好好地說了故事，也沒有硬要加入的本土元素，最後不但讓


  一堆人跑去淡水朝聖，還能紅到被韓國拿去翻拍，現在回過頭來看真的很不簡單。唯一可


  惜的是本片於2007年上映，真的是生錯年代了，我敢說以這部電影的品質跟話題，放到現


  在絕對是輕鬆破億的那種。



  　　總結【不能說的．秘密】這部電影吧，配樂好聽，畫面好看，角色從選角到演出都很


  棒；這首由葉湘倫與路小雨一同譜出的戀曲，除了故事簡單唯美之外，伏筆安排與轉折都


  很順暢；整部電影就是一部起承轉合完整，浪漫又賺人熱淚的故事，事隔13年後的今天重


  看依舊是相當優秀。



  【不能說的．秘密】：超級推薦，絕對值得一看再看！


  絕對是周杰倫能夠拿來說嘴一輩子的作品。




  後記：


  1.重看才發現電影裡面的音樂幾乎都是從「我很忙」這張專輯裡出來的，當初是專輯先出


  還是電影先出啊？


  2.本片還有一個超紅的橋段....想當年有多少人在看了這部電影後用立可白殘害自己的桌


  子，我高中的課桌上就有一段「我是大禹，我治水，你智障嗎？」。


  3.不知道有沒有考慮趁著這波疫情重新上映一下，如果有我很樂意去電影院支持喔！


  4.朋友表示：「看過周杰倫之後的電影，我真的懷疑這部電影是塞到的」，仔細想想，周


  杰倫之後參與的電影真的沒一部能回到本片的水準。



  --


  荒野遊俠電影部落格：


  紀之＆遊俠：


  平日評電影、動漫、電玩 偶爾寫遊記 想講什麼就講什麼


  --'
