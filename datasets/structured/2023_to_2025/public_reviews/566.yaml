url: https://www.ptt.cc/bbs/movie/M.1186800977.A.37C.html
title: '[心得] 不能說的秘密  無雷'
content: "主要演員：周杰倫  桂綸鎂\n\n這部電影的名稱很有趣，導演周杰倫在上映前不斷強調，這是有點懸疑、需要多次欣賞的\n電影。加上放的幾小段預告片，所以，很多人都做了許許多多對於結局的猜測，我的心中\n\
  也不免想很多種可能，在電影中後段時，其實心裡有『原來真的跟大家猜的一樣阿！』這\n樣的想法出現，但結局到來，還是被驚喜了一下。\n\n電影前半段很多人覺得只是平鋪直敘的劇情，感覺像日劇式的校園故事。但我覺得如果考\n\
  量一下周杰倫當高中生時的那個年紀，大約十年前網路、手機不普遍的那個年代，聯絡管\n道沒那麼方便，學生情侶當時最珍惜的一定是每天放學一同回家那個時光，共撐傘時希望\n\
  雨傘愈小愈好，走的愈慢愈好，總之，能多爭取和對方在一起的時間，什麼都好。在這點\n上，我覺得電影呈現的不錯，學生那種單純的喜歡配上些看似幼稚的舉動，再再讓人格外\n\
  的懷念憧憬。\n\n不過電影到了中後段，突然變成了推理驚悚片，一氣呵成直到結尾，劇情鋪陳很能牽動觀\n眾的心，和前段校園片段相互呼應，平淡的對白原來暗示結局的發展。雖然在周杰倫自訂\n\
  的邏輯下仍有解不開的謎，但我反而覺得這樣更好，留下那1％的空間讓觀眾討論，或許\n比故事說得滿佳。\n\n讓觀眾最深刻的絕對是桂綸鎂的演技和配樂。電影裡的小雨，有很多情緒的轉折，桂綸鎂\n\
  的演出很自然、很真誠，活像真有一個這麼可愛的高中女孩。至於周杰倫的演技，是有比\n『頭文字D』進步，但還是不夠好，最後劇情急轉時的爆發力不夠強勁，總覺得應該掉淚\n\
  的場景他的表情仍不夠投入，或許杰倫演的最棒的是彈鋼琴的手指吧！其他演員則是對黃\n俊郎印象深刻，演的超痞又很搞笑。\n\n對於一個每年華語唱片銷售NO1的創作者來說，代表的是他非常能抓住商業市場的取向。\n\
  電影裡的配樂是周杰倫最擅長的領域，他本身也有古典鋼琴的底子，前段平淡的甜蜜，後\n段懸疑的驚悚，藉由豐富的音樂性表達的非常完美，更讓觀眾融入故事裡。\n\n最後，其實滿難相信電影是由一個初當導演的人拍攝的，自編、自導、自演還親自配樂。\n\
  電影內容有新意，看得出整個團隊功力不俗。但讓我覺得可惜的一點，就是有些橋段原創\n性不是那麼充足，以至導演在配樂上完全展現了自己的想法，但拍攝手法還感受不到周杰\n\
  倫的特色。我想有些地方說抄襲實在是太嚴重了，「金手指戳戳樂」早在幾百年前就是小\n學生的遊戲，懸疑的劇情的確不是第一人，但表達方式是不同的，如果因此而隱射抄襲，\n\
  只會限制許多以後劇本創作者的想法。周星馳的『功夫』也向許多電影\"致敬\"，但大家仍\n不吝息給予掌聲。我想沒有必要因人而廢言，不應該就這樣抹煞電影的價值。\n\
  \n在欣賞完後覺得電影海報上的一段話寫得真是好，深深觸及心底。\n\n                      『我閉上眼睛，是為了更看清楚你』\n\n--\n\
  ◆ From: 125.225.184.217"
