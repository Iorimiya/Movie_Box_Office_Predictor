title: 'Re: [討論] 不能說的秘密在近10年國片排得上前十嗎？'
content: '排不上吧，


  2007年最強的國片是李安的 色，戒


  2008年最強的國片是楊雅喆的囧男孩 (非海角七號)


  2009年最強的國片是聽說


  2010年最強的國片是台北星期天


  2011年最強的國片是翻滾吧，阿信 (非那些年，我們一起追的女孩 )


  2012年最強的國片是犀利人妻最終回：幸福男．不難 (非陣頭)


  2013年最強的國片是看見台灣


  2014年最強國片是KANO


  2015年最強國片是刺客 聶隱娘 (非我的少女時代)


  2016年最強國片是六弄咖啡館 (非大尾鱸鰻2)


  2017年最強國片是台北物語 (非血觀音)



  不過周杰倫確實讓國片回來了


  感謝周杰倫




  --'
