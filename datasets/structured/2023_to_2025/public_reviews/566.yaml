title: '[新聞] 韓版《不能說的秘密》即將翻拍 都敬秀確定擔綱男主角！'
content: '新聞網址：


  2007年在台上映、由周杰倫自編自導自演的電影《不能說的秘密》，先前不僅確認將翻拍

  韓版，劇中男主角「葉湘倫」更已敲定人選！SM Entertainment今日 (15) 宣布旗下藝人

  、EXO成員D.O.都敬秀確定出演韓國版《不能說的秘密》！


  2008年在韓國以同名上映的《不能說的秘密》(  )，創下15.8萬觀影人

  次、3,345萬台幣的票房，至今仍在韓國處於不朽之地位，且對於多數韓國人而言，這部

  電影是台灣電影的代表作品，而片中的場景也時常成為韓國人旅台踩點之處，且《不能說

  的秘密》這部電影亦時常出現於韓劇劇情中，在近期完美收檔的《Run On奔向愛情》中，

  由姜泰伍所飾演的李映禾在劇中也有提及。


  一月底甫退伍的EXO成員D.O.都敬秀，先前已出演過《沒關係，是愛情啊》、《百日的郎

  君》等劇，以及電影《純情》、《屍蹤七號房》、《與神同行》系列等作品，已展現出「

  演員」身分的實力。另外，確認接拍韓版《不能說的秘密》之前，D.O.都敬秀也已確定加

  入《與神同行》系列的金龍華導演新作、預計上半年拍攝的《The Moon》作為其復出作品

  。


  韓版《不能說的秘密》將由曾執導過《萬惡新世界》、《南山的部長們》與《魔鬼對決》

  的Hive Media Corp製作，目前除男主角確認由都敬秀出演外，桂綸鎂的「路小雨」女主

  角飾演人選仍在選角中，而韓版《不能說的秘密》已確定下半年投入拍攝。




  --'
