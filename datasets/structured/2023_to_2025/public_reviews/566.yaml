url: https://www.ptt.cc/bbs/movie/M.1490916560.A.48F.html
title: '[新聞] 韓重拍《不能說的秘密》 朴寶劍被拱帥版'
content: '新聞網址：


  韓重拍《不能說的秘密》 朴寶劍被拱帥版「葉湘倫」


  【王怡文╱綜合報導】周杰倫執導兼主演的《不能說的秘密》深獲韓國影迷喜愛，韓國製

  作公司「HIVE MEDIA」確定將翻拍韓版。網友點名會彈琴的人氣男星朴寶劍擔綱「葉湘倫

  」一角，實力派男星姜河那和劉亞仁也被點名，有台灣網友卻認為外型神似周董又會彈琴

  的「防彈少年團」成員SUGA最合適，引發熱烈討論。


  預計明年開拍

  《不》片之前在韓吸金近3400萬元台幣票房，許多韓星都是該片影迷，儘管目前導演、卡

  司都尚未定案，已經成功引發話題。製作公司透露等確定導演後才選角，故事背景將從高

  中拉至音樂大學，預計明年開拍，對此周杰倫公司「杰威爾音樂」回應已售出翻拍版權，

  但不願透露版權金價碼。


  --


  我是男生，只能愛男人。我是0號，喜愛專情、體長粗壯的1號男人。


  單身時，喜歡和不同類型的男人上床做愛，也喜歡同時被多個男人輪流上。


  --'
