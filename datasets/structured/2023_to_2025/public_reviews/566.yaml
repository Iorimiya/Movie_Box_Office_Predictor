url: https://www.ptt.cc/bbs/movie/M.1735980182.A.75A.html
title: '[新聞] 日版不能說的秘密登台 周杰倫暖心推薦'
content: '新聞網址：


  日版不能說的秘密登台 周杰倫暖心推薦


  2025/01/04 05:30



  《不能說的‧秘密》被日本翻拍，周杰倫秀日文推薦大家。（可樂電影提供）


  〔記者廖俐惠／綜合報導〕周杰倫的經典電影《不能說的‧秘密》近來被日韓翻拍，由京

  本大我主演的《不能說的秘密》宣布將在1月17日在台上映，周杰倫也以日文打招呼，並

  說「一定要看呦！」



  《不能說的‧秘密》被日本翻拍，周杰倫（上圖）秀日文推薦大家。（可樂電影提供）


  《不能說的‧秘密》紅遍全亞洲，至今仍是經典，在原作上映後約17年，被日本、韓國接

  連翻拍，韓國的由EXO都敬秀、元真兒主演，日本則是找來「SixTONES」的人氣成員京本

  大我搭檔古川琴音主演，京本大我飾演就讀音樂學院的學生「湊人」，本來就有音樂底子

  會彈鋼琴的他，在電影中也會大展琴藝。


  周杰倫大方錄製影片助陣，表示：「很開心我的電影《不能說的‧秘密》在日本做了改編

  ，最近要上映了，聽說跟原創有一點點不一樣，不過還是很好看喔，希望大家一定要到戲

  院支持一下。」






  --'
