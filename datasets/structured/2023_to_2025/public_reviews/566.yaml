url: https://www.ptt.cc/bbs/movie/M.1444833505.A.385.html
title: '[討論] 周杰倫不能說的秘密場景-淡水淡江中學'
content: '不知道這是否可以討論 如果不行可刪 謝謝

  圖文網誌版

  淡江中學八角塔。


  由於今年發生文化國小事件，所以淡江中學目前不對外開放，也正因為如此，所以整理一

  些淡江中學及周杰倫電影「不能說的秘密」場景的照片，希望讓更多人知道淡江中學的歷

  史與美麗。

  淡江中學是經歷過清、日、民國三個年代的百年老校，校內著名歷史建築物有八角塔、體

  育館、婦學堂、淡水女子學校、馬偕墓園等，是個人非常喜愛的學校。


  淡江中學校門口。

  走進校門口後的磚頭，是早期區分男女學生走道的標示。

  往前走，下方照片是「不能說的秘密」劇中周杰倫及父親住的房屋，該屋早期為老師宿舍

  。

  埔頂鐘聲，早期馬偕博士皆親自打鐘提醒學生上課，故記念之。此鐘是向荷蘭所訂製。

  再往前走的橄欖球場，淡江中學是台灣第一個成立橄欖球隊的學校，這也正是「不能說的

  秘密」劇中有橄欖球隊的原因。

  大教堂，1965年完工，是當時遠東最大教堂，電影「不能說的秘密」畢業典禮場景就是在

  這，不過大教堂平時不開放。

  能在大教堂聽著淡江中學的學生演奏「不能說的秘密」，個人覺得是人生一大享受！謝謝

  這群可愛的同學！

  八角塔，建於1925年，結合中國寶塔與拜占庭風格，「不能說的秘密」及林青霞的首部電

  影「窗外」皆在這拍攝。該建築成三合院的外開「ㄇ」字型，注意不能內縮，因為外開對

  運勢較好。

  林青霞第一部電影「窗外」。

  以前稱私立「淡水」中學，但後來因法規原因私立學校不得冠用地名，故改為「淡江」中

  學。兩旁為中式古燈。

  1947年，二二八事件受難的教育人員中，以淡江中學及延平學院人數最多。

  下方合照背後的教室就是「不能說的秘密」的上課教室場景。淡江中學的學生好熱情啊！


  體育館，建於1923年，仿閩南農宅風格。1936年日本接管時作為武道館之用。

  馬偕博士墓園，除馬偕博士外，安息與此共44人，多為馬偕博士之親人及學生。

  1910年落成的婦學堂，類似媽媽教室，是提供非學齡的女性學習的地方，現為校史館。

  女學校大樓，又稱「純德大樓」。

  其他照片及電影場景。

  地址：新北市淡水區真理街26號


  --






  --'
