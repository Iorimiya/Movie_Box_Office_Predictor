title: '[討論] 「不能說的秘密」周杰倫根本不愛小雨吧？'
content: '最近回味「不能說的秘密」

  覺得真的很好看耶，戀愛的感覺中帶著一些哀傷

  女主角漂亮又俏皮

  只是大家還是要認清現實

  如果你不是高富帥，別幻想有女生會對你這麼主動



  我有個問題：

  小雨在撞見晴依跟周杰倫接吻之後跑走

  周杰倫去小雨家找小雨

  小雨的媽媽說：她氣喘發作在休息，不要來找她啦

  然後電影就跳到「5個月後」快畢業典禮了


  所以，這5個月周杰倫就讓它這樣過去

  這..........根本不愛這個人吧


  一般人就算是普通朋友也不會放著不管吧

  還是他們音樂班課業很重，都忙著練琴？


  --

  中年小雨還是不要出現，讓記憶留在最美好的時候


  據說窗子裡穿紅衣服的就是中年小雨

  但我都是把她當小雨媽媽來看(因為我不敢面對)'
