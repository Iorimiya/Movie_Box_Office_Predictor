url: https://www.ptt.cc/bbs/movie/M.1469255638.A.07B.html
title: '[討論] 不能說的秘密'
content: '最近有重新看了這部老電影，還是深受感動與喜歡這部片。


  片裡面的音樂真的是好聽，少見的導演自己還當戲劇音樂的創作！？


  小弟孤陋寡聞，真的不知道還有哪個導演也有辦法自己作曲的。



  個人相當心疼的是，小雨你好傻。


  周杰倫看到你的身影就跑出來，丟下整個鋼琴協奏曲的演出，

  (看到這段心臟都快停了，從沒看過獨奏者丟下整個樂團跑下舞台的)


  小雨你也就看到個手環自己就腦補。


  你要是也追回去　看到杰倫把手環都還給晴依你就該知道怎麼回事了阿。


  然後哭哭啼啼的跑回去　氣喘又用立可白，都不知道你被立可白毒死的還是氣喘死的。


  >.<


  你好歹也給湘倫一個機會去解釋或表白自己心意阿，自己消失五個月。他看到你身影


  就跑下舞台，這還不夠有誠意嗎? 你又跑回二十年前做什麼！？


  真的超想罵她王八蛋的 腦補天后。 (對不起 我太入戲)



  第二個我想抒發的是，葉爸二十年前真的做錯事情了。

  居然把小雨的事情跟班長講，殊不知他才是害小雨在學校裡面根本待不下去的主因。

  全班都嘲笑她，問她二十年後失身了沒?  叫她畢業典禮表演跨越時空追男友。

  真的超機車的。真是海K一頓那些小屁孩。

  結果葉爸他害死一個女孩，付出的代價是兒子也消失了。

  該說是一報換一報嗎?  是說 為人師表還真的要很小心。這種事情該怎麼處理 哀!



  另外一個，也不能說是bug啦，葉湘倫真的回到20年前，沒有爸爸媽媽? 他要住哪?

  靠什麼維生? 果真是二十年前，他爸也不會相信那是他二十年後的兒子!

  那他可能光打工維生就是問題了，哪來時間還去談戀愛。 只能說電影是最美的。

  真的讓他穿越了，似乎也不覺得他還有辦法去跟小雨談戀愛。

  所以我們能談戀愛，要先感謝爸媽。(疑)


  --

  我康宣今年十八歲，姑蘇人士，身家清白素無過犯，只

  為家況清貧，鬻身華相府中充當書僮，身價銀五十兩，自

  秋節起暫存帳房，待三年後支取，從此承值書房，每日焚

  香掃地洗硯磨墨等事，聽憑使喚，從頭做起，立此為據。


  --'
