url: https://www.ptt.cc/bbs/movie/M.1477396130.A.9D7.html
title: '[討論] 你的名字&不能說的秘密'
content: "雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n前幾天和閃光一起看完你的名字後，本來想和她討論觀後心得\n\
  \n但卻被她潑了個冷水說\"啊不就和不能說的秘密一樣?\"\n\n本來想反駁她說哪裡一樣，但仔細想想好像真的蠻相似的?\n\n相似的點有\n\n1.初期:兩者都是用帶點神秘的方式讓男女主角相遇，然後就是快樂的相處過程\n\
  \n2.中期:男主角在與第三者約會後，女主角就消失不見或聯絡不上\n\n3.解迷:男主角要去找尋事實的真相\n\n4.真相:解迷後才發現原來兩個人是存在在不同的時間軸，而女主角已經死了\n\
  \n5.信物:女主角留下的紅緞帶(琴譜的畫像)證明兩人的相遇不是幻覺\n\n6.改變過去:為拯救女主角，男主角都穿越時空回到了過去，並修正了女主會死掉的歷史\n\
  \n7.happy ending:最後男女主角還是相遇了，可喜可賀，可喜可賀\n\n8.家庭背景:兩部的男女主角都是單親家庭\n\n9.音樂:兩部也都有很好的配樂撐起電影\n\
  \n這樣比較下來，果真是有幾分相似呢?\n\n看看你的名字衝出亮眼的成績，再看看不能說的秘密...只能說，生不逢時\n\n讓周董的電影生在一個沒人要看國片的年代，真的是可惜了啊...\n\
  \n--\n台北是台灣的子空間、台灣是亞洲的子空間、亞洲是環球的子空間\n又{大學}is a basis of 台北\n  {國立，大學}is a basis\
  \ of 台灣\n  {私立，國立，大學}is a basis of 亞洲\n  {科技，私立，國立，大學}is a basis of 環球\n故台北大學<國立臺灣大學<私立亞洲大學<私立環球科技大學\n\
  \n--"
