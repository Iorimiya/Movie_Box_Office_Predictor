url: https://www.ptt.cc/bbs/movie/M.1736666100.A.D8D.html
title: '[負雷]不能說的秘密(日文版)'
content: '無雷心得部分


  身為一個資深的台版不能說的秘密的瘋狂粉絲

  當初高中國文課都沒在上課，躲在最後一排拿IPOD狂刷

  共看了15次以上，一度可以把台詞從頭背到尾

  還去買了琴譜，可以穿越時空的Secret，四手聯彈都練到會

  一轉眼18年過去了，聽到日韓接連翻拍

  我這個老粉簡直是興奮到不行


  剛好上個禮拜坐飛機去日本

  華航竟然有搶先上映，就搶先嚐鮮一下


  我只能說，太失望了

  雖然已經有心理準備，改編很難撼動原著在心中的地位

  但我真的覺得改得太糟糕了

  這整部片經典和與眾不同的地方都消失了

  就只變成一部無聊冗長的日式愛情小品


  給對原著有情懷和對這部片有期待的人打個預防針

  反正我看完是整個渾身不對勁

  還好華航上有收錄原版

  看完馬上點開來看

  在下飛機前撫慰我受傷的心靈


  希望月底的韓版不要翻車


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~








  首先

  男主角真的太討人厭了

  和原版那個屌屌的葉湘倫完全雲泥之別

  劇情敘述男主角留學回來

  由於在國外受到挫折，所以回來意志消沉想放棄鋼琴

  但鏡頭只有帶到幾秒鐘外國教授罵人的嘴臉

  對比男主角一負全世界都欠他錢的死爛樣

  完全無法帶入

  只覺得這個人怎麼這麼討厭


  女主角其實演得還可以

  除了倒貼男主角倒貼的毫無道理

  還算是日劇可以接受的甜美女主

  但

  一回看原版的，就覺得是懶覺比雞腿了

  首先，台詞完全沒有原版路小雨的可愛俏皮

  例如，男主問女主:"你好像很少朋友齁"

  日本回答"你少管閒事吧"


  路小雨是回:"沒有人喜歡我囉~"

  葉湘倫:"怎麼可能"

  路小雨(前傾靠近):"那你喜歡我嗎?"

  路小雨(氣音):"我.喜.歡.你"


  靠，高下立判好嗎?

  當初高中生的時候被桂綸鎂(路小雨)撩的不要不要的

  整部片路小雨的台詞都在撒嬌都在撩


  接下來，不能說的秘密另一個大看點，我想就是鋼琴

  鬥琴大賽我想是讓大家記憶猶新的一場戲

  裝逼到不行的鋼琴王子宇豪學長

  以及用單手屌虐他的葉湘倫

  和那18年前就看起來超屌的CG穿越鋼琴動畫

  在日版變成了:

  鋼琴王子...長的怎樣就不評論

  還內向害羞到不行

  然後男主角鬥琴，到最後竟然放棄砸琴鍵??

  只為了反映他心中不再喜歡鋼琴

  然後CG也沒了，就平淡無奇的

  男主角被逼去鬥琴

  然後放棄砸琴鍵痛哭

  哇，跟原版葉湘倫為了幫路小雨贏琴譜相比

  格調根本雲泥之別


  再來，女主角在原本年代的悲劇故事

  日版完全沒有提到

  只有說他得了病

  也沒說什麼病，反正就是注定要死

  反觀台版

  路小雨得的是氣喘

  然後在她的年代因為老師(黃秋生)洩漏她穿越時空

  而被學校霸凌，被媽媽帶去吃精神科的藥

  最後在因為畢業典禮那天誤會葉湘倫跟晴依在一起

  氣喘發作，身上卻沒有藥

  導致死亡

  台版這種"意外"感創造了滿滿的惋惜

  讓人不禁帶入電影，想要穿越時空去改正錯誤拯救小雨

  但日版就...嗯，我該死了，掰掰


  講到這裡就要提另一個經典場面

  桌面立可白那幕

  不得說當初第一次看到的時候，整個雞皮疙瘩爬上來

  立可白迅速變舊的動畫，現在看起來也是帶入感十足

  配上葉湘倫驚恐害怕的神情，但義無反顧地用立可白在桌面回覆

  戲劇張力真的是拉到天花板沒話說

  反觀日版

  只是在男主聽女主媽媽解謎時

  突然看到琴譜上出現女主用鉛筆寫下的

  "我好想見你"

  面對憑空出現的鉛筆字

  (先別說少了立可白瞬間舊化的張力)

  男主角那是什麼死魚演技?

  正常人看到這種靈異現象依定是直接把琴譜丟到地上吧

  男主的臉是真的看起來一點不驚訝欸

  整個出戲到不行


  最後一幕，台版葉湘倫在拆除大隊拆除期間

  偷偷潛入舊琴房

  只為了拚最後一秒能穿越時空拯救路小雨

  一邊彈琴，怪手一邊破壞的CG

  那個為愛拚死一搏的神情

  配上黃秋生為了拯救兒子邊跑邊抓心臟

  到現在看還是會起雞皮疙瘩

  日版完全沒有這些醞釀

  就只是平淡的彈了琴，回到過去

  發現女主角島在旁邊，抱著她下線

  說真的我看日本最後一幕時也在哭

  哭的是心中一代經典的死亡

  還是曝屍荒野的那種


  最後，要來吐槽CG和音樂

  CG的部分過了18年，不但沒進步，反而倒退一世紀的感覺

  彈鋼琴穿越時空時，原版是用類似縮時攝影的方式呈現

  配上運鏡，東西變舊的過程，牆壁慢慢斑駁，常春藤爬起來

  18年後的今天看了還是很有帶入感

  日版就只是讓身邊幾個東西淡入淡出

  我用imovie都能做出的效果

  看了實在很沒勁

  再來音樂

  我不知道是不是有情懷作祟

  但日版的音樂...也不是說不好聽

  但就是沒有像原版那麼有鑑別度

  鬥琴三首，Screat，兩個四手聯彈

  還有背景音樂的彩虹，蒲公英的約定

  音樂一出根本就淚腺迸發


  以上是18年來不能說的秘密狂粉的一點碎碎念

  已經有好幾年不曾在PPT上發文

  這次真的看了日版候忍無可忍

  特地找回PPT帳號上來報負雷

  奉勸大家如果想對這部IP抱持一點美好的回憶

  對日版真的要慎入


  月底聽說韓版要上了

  到時候有空我再來補上韓版的心得吧

  希望不要一個月讓我心死兩次


  --'
