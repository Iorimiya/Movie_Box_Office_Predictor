url: https://www.ptt.cc/bbs/movie/M.1512316859.A.DE0.html
title: 'Re: [討論] 不能說的秘密在近10年國片排得上前十嗎？'
content: "身為算常看國片的觀眾，來回一下這篇。電影排名這種東西常常是很主觀的，所以此篇列\n一些客觀的數據供大家參考。電影成就主要為藝術和商業兩種，藝術部分列出華語最具公\n\
  信力獎項金馬獎入圍最佳劇情片、最佳導演、最佳紀錄片者。商業部分，列出維基所整理\n台灣票房排行。\n\n2007~2017金馬獎台灣片入圍最佳劇情片、最佳導演、最佳紀錄片者(得獎打上*)：\n\
  \n年份     劇情片                   導演                   紀錄片\n\n2007    《色，戒》*(合拍)  \
  \      《色，戒》*(合拍)      《草木戰役》\n        《情非得已之生存之道》\n\n\n2008    《海角七號》         \
  \    《海角七號》           《遊藝人生女》\n        《囧男孩》\n\n\n2009    《不能沒有你》*          《不能沒有你》*\
