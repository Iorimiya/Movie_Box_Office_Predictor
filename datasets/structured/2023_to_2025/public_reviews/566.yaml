content: '看了不能說的秘密


  最後的結局路小雨有沒有死掉呢


  從葉爸的口中說出那是他最後一次跟小雨合照


  所以小雨可能死掉了?


  但如果小雨在二十年前畢業典禮死掉，那倫回去為什麼又可以看到小雨呢?

  (看起來好像不認識，所以穿越的時間超過二十年嗎?)


  在輪的時間線上，小雨的媽媽似乎一直覺得小雨活著，是因為失去女兒所以生病了嗎?


  小雨是在畢業典禮結束的時候氣喘病發的，最後那一張畢業典禮照有倫在裡面


  但這會不會是一場悲劇，因為還是會氣喘病發


  還是因為倫跟他在一起，所以他不會被霸凌，也不會氣喘病發呢?


