title: 'Re: [新聞] 雷／「星戰9」芬恩不能說的秘密揭曉 與「原力」有關'
content: '====雷========


  我覺得JJ在講幹話吧？


  那有人快死的時候，想講的是『芮，我想跟妳說，我能感應到原力』??


  然後這也不是什麼不能在波面前說出來的話，也沒必要隱瞞啊，


  能感受到原力是好事吧？



  應該是芬恩覺得快死了，想趁死前告白，


  結果沒死就算了，因為時機不對。


  至於芬恩倒底能不能感應到原力？


  他最後有感應到芮死了，所以應該是有，


  但他的原力感應該不算太強，


  而且是遇到另外一個黑人女孩後才正式了解的。



  至於芮對芬恩喔？是完全沒興趣，


  就把他當一個朋友看。


  畢竟也算她是第一個交到的人形朋友，


  也共患難過，但朋友等級還比BB-8低。



  可悲~~真的告白只會領到『好人卡+朋友卡』



  芮對忍還有波可能還比較有感覺吧？


  對忍親吻(有兄妹嘴對嘴親的喔？有人說這是在致敬星四？


  但那時候他們根本不知道彼此是兄妹啊)


  對波最後擁抱的時候又緊緊握手。




  為什麼我那麼懂？


  因為我是好人卡王啊Q_Q~~























