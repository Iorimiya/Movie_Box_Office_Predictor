title: '[好雷] 不能說的秘密 國片之光'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n電視台有轉到幾次 但都沒有認真看\
  \ 就看到廣告就轉台了\n\n\n時隔今日突然想到這部許多人讚譽的電影我竟然不知道結局\n馬上來追看看吧\n\n\n\n\n真的滿猛的\n\n桂綸鎂在本片真的是鎂的不要不要\
  \ 反而藍色大門我忘記她演什(有看過次\n\n就記憶點 桂綸鎂以前給我印像就是7-11咖啡\n看完後這部肯定是代表作了\n後續的電影我沒看 但觀察市場反應沒啥人推\
  \ 基本不是推不能說的秘密就是藍色大門\n\n不知道她本人怎麼想，雖然是學生妹子本來就容易討好大眾\n但拍的好也不容易\n\n這個選角太神了，她在片中表現完美\
  \ 演的自然不做作散發一股特別的氣質\n\n而周也算厲害，電影中很像在演自己，有時屌屌的但話不多~\n劇本+自導自演真的厲害了，可惜後續電影就...\n\n天台我也有去電影院看，還好，只能說不能說的秘密到最高鋒無法超越了(不過我是先看\n\
  天台過好幾年才看不能說的秘密\n\n\n\n\n黃秋生老將友情演出吧 老練的演技發揮綠葉功能點綴本片\n\n女一 也超漂亮，上網查才發現是名模\n\n\n後續的反轉也不錯，片中配樂也好\n\
  \n查一下新聞發現韓國要翻拍\n\n2017年的事 到現在都沒新聞 看來還沒拍好吧\n\n周的人生算全破了 ~姑計沒有心思在拍電影吧 跟家人相處也不壞就是\n\
  綜合來說台灣第一男應該是周了 世界知名度 音樂電影成就\n真的沒啥好酸了\n\n如果我是周 我也不會請吳宗憲\n\n看完正在找桌布 怎麼沒有幾張桂綸鎂的 片中跳舞那段超讚啊\n\
  \n\n\n--\n   \n\n \n\n\n ←了解更多\n\n--"
