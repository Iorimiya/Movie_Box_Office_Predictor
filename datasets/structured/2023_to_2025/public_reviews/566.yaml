url: https://www.ptt.cc/bbs/movie/M.1658287501.A.FA2.html
title: 'Re: [討論] 不能說的秘密放在現在是不是力壓多數國片'
content: "當年不能說的秘密國片市場環境跟現在還是有差\n不能說的秘密記得首周500萬幾乎是當年前幾名了\n加上排到的廳沒有很多最終台北票房2400萬\n\
  那年好萊塢大片蜘蛛人3、神鬼奇航、哈利波特、變形金剛\n\n主要是周杰倫太跩業內人士覺得一個音樂咖還想當導演？\n因為這部片周杰倫不僅是演員還是導演更是合力編劇\n\
  當演員其實大家可能笑笑無所謂\n但是當導演跟編劇這種專業性質\n就可能觸犯了不少人等著看周杰倫笑話\n\n周杰倫拍頭文字D拿了金馬新人\n又接著跟大導演還有大咖演黃金甲\n\
  讓他覺得電影很像滿好玩的可以來試看看\n\n當時受訪：他說這部片跟一般校園愛情不一樣\n          希望可以替台灣電影帶來不一樣的風貌\n      \
  \    台灣電影無聊太久了\n\n不能說的秘密自編自導自演的時候很怕被別人看衰\n所以攝影跟特效幾乎可以說是用當時最頂的\n然而不能說的秘密也是在金馬收穫了不少\n\
  \n周杰倫可能不是天才，但是如果認真想證明他某件事做的到\n他會用盡所有資源跟想法去證明不管是音樂、電影\n證明他拍好萊塢英文從超破變成流利溝通沒問題\n證明他的音樂可以傳唱許多地方\n\
  證明電影這一塊留下他曾是導演的印記\n\n所以當電影不能說的秘密成功之後\n他在電影部分不需要再證明\n就誕生出了天台這部\"想法是好的\"\n但整體細節跟不能說的秘密差異很大一部作品\n\
  \n周杰倫絕對有過最偉大的作品\n但最偉大的作品不是周杰倫最偉大的作品\n\n--\n\n--"
