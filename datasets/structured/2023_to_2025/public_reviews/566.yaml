title: '[討論] 不能說的秘密也太好看'
content: '今天還在放假


  剛好看到電視台在播不能說的秘密


  也沒什麼好看的就繼續看下去了


  不料越看越有感覺


  尤其是路小雨跟secret的配樂下去時整個頭皮發麻


  唸高中時的感覺都上來了


  劇情很流暢不拖戲  看到小雨看到精神病的藥時在那邊哭的時候也跟著難過起來


  雖然周董有點自肥然後劇情有點小bug之外


  桂綸鎂真的是很適合這部片子


  對比最近一堆奇奇怪怪的國片….周董執導的這部真的優


  --'
