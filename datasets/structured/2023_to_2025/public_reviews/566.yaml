title: '[影評] 不能說的秘密'
content: "心得  不能說的秘密\n\n    我想我應該在剛上映時就去看這部片，這樣驚喜感應該會強一點，距離上映三個星\n期之後，我已經看到太多關於這部片的好評，期望有點過高，看完之後反而只覺得還好\n\
  。不過持平而論，<不能說的秘密>的確是一部佳作，劇情、節奏、演員、場景、配樂等\n好電影應有的因素這部片都具備，其中一些環節更是額外出色，這使得這部片在商業價\n\
  值上不但超越大多數的國片，甚至，以我個人觀點，也比很多B級外片要來得優秀。\n\n\n    這部片子一些讚美感動或劇情解析網路上都很多了，我也沒必要再抄一次，我想在這\n\
  邊再寫一下周杰倫。我個人一直都還蠻推崇周杰倫在流行音樂上的成就，雖然很多人都會\n批評周的歌曲千篇一律，但我認為周杰倫最大的貢獻在於「發明」了一種國語流行音樂的\n\
  新模式，借由平板至近似唸歌的主歌搭上高低明顯的副歌，周的歌曲一方面不像純模仿的\n國語rap有種不倫不類荒謬笑點，另一方面可以容納大量新奇的歌詞，使得曲子呈現出不\n\
  同於以前芭樂歌的美感，也使得方文山有了用武之地。這樣的音樂模式並不難，但問題周\n之前並沒有這樣的東西，周之後才出現一大堆的模仿，即便是自稱原創性很強的陶吉吉或\n\
  是王力宏，也不能避免受到周音樂的影響。我記得有一次我和朋友去打撞球，店裡面放了\n一首很像周杰倫的歌，我說：「這不是周杰倫。」我朋友說：「但是這歌還是很好聽。」\n\
  我說：「對啊，這就是周杰倫厲害的地方，你只要順著他的調調寫歌，寫起來都不會難聽\n到哪去。」\n\n\n    周杰倫的才華，更抽象一點說，就是懂得如何討好他的觀眾或聽眾。他的音樂是這樣\n\
  ，這部他第一次導的電影也是一樣。簡單的愛情和搞笑，參入懸疑與琴聲所帶來淡淡的哀\n愁，名氣響亮的卡斯，配上復古優美的演出場景，完全就是對著大眾喜好的味口。不過這\n\
  些抽象元素當然還不足以保證片子的成功，還需要適當的調配，而周也很聰明地選擇了<\n江湖>的編劇杜緻朗來為他說這一整個故事；我看完這部片最大的感想就是片子的節奏真\n\
  的很好，完全擺脫了以往國片那種沒有節奏的問題。我個人會認為，要說一個引人入勝的\n故事，節奏是很重要的，什麼時候應該緊湊，什麼時候應該舒緩，什麼樣的轉折應該適可\n\
  而止，什麼時又應把觀眾吊在半空中，這都是說故事者必備的能力。以往國片會讓我覺得\n導演或編劇好像都不大重視這一部分，故事就平平板板的說，主角沒事要抽煙就讓他抽三\n\
  分鐘，電話沒人接就讓他響，結尾就把鏡頭拉遠，這樣就算原本是很精彩的劇情也在拖拉\n之間被浪費掉了。還有些國內導演會說這是因為國人都被「好萊屋的敘事方法」給慣壞了\n\
  ，但是，拜託，一百年前推理小說就知道讓偵探說：「如果這是真的，那我想的就沒錯，\n但是，這會是假的嗎？」然後結束一個章節；就算是三百年前中國的章回小說也懂得來一\n\
  個「欲知詳情，且待下回分解」，這種節奏控制很明顯是通俗文化中的共通功力，全部把\n它納入好萊屋妖魔化的範疇中，恐怕不大恰當。\n\n    <不>片在節奏上就掌握得很好，從前半段的純愛進入後半段的解謎，所有的伏筆安排\n\
  及後來的收線都放在恰當的位置上，不會因為太快而看不懂，也不會因節奏過緩而令人昏\n昏欲睡。惟一可以挑剔的是前半段的愛情片段沒有編成一個故事，只是斷斷續續打情罵俏\n\
  的片段，會讓人有點不清楚男女主角怎麼進展那麼快。\n\n    簡言之，這是一部相當優秀的片子，硬體和軟體兼具，推薦大家可以多捧場。\n\n--\n\n\n \
  \ MY  BLOG \n      --短篇推理小說 長篇小說 替代役週記 雜文\n\n--\n◆ From: 125.232.199.112"
