url: https://www.ptt.cc/bbs/movie/M.1188188834.A.C2B.html
title: '[好雷] 不能說的秘密：這是一首交響曲 '
content: '原文地址： （有插圖）


  看了令人好感動的一部電影。雖然，周傑倫同時身兼導演、編劇、男主角，

  但這部電影，真的一絲不苟。每一個鏡頭、每一分細節，到最後都證明了有

  它的含義。


  周傑倫真的很有創意，他把電影當成是交響樂在拍攝。鏡頭是音韻，演員是

  樂器，導演是指揮家，劇本是曲譜，出來的效果……就是交響樂。


  我從來沒有看過這樣的拍攝手法，這不是一部電影，這是一首交響曲。


  葉湘倫、路小雨、晴依、路小雨的媽媽、老師（也是葉湘倫的爸爸），還有

  兩個年代的班上同學，在這個故事中，扮演了不同的角色。


  在聽交響曲的時候，你可以從每一個角度去聆聽，鋼琴、小提琴、笛子、鼓

  、小號、長號，這個故事也一樣，你從每一個參與者的角度去看，看到的東

  西都不一樣。


  必須等到最後，聽完了每一個人的演奏，把全部人的曲子組合起來，才能重

  組出《不能說的秘密》的完整旋律。


  接下來的內容有劇情透露，如果還沒有看過電影，強烈建議不要往下看。






































  只有路小雨才知道魔曲的事情是真的，但到最後真相大白的時候，已經來不

  及阻止悲劇的發生了。


  “出賣”了路小雨的老師（黃秋生）全是一番好意。因為精神異常的人，真

  的很可能因為幻覺而尋死。即使她相信女兒看見了幻覺，小雨母親依然小心

  翼翼地用一顆溫柔的心去呵護她。這些人，都是真正關心路小雨的人。


  有一幕……小雨的母親在走廊對著已經去世的丈夫照片痛哭，小雨走出來看

  見了，小雨的母親立刻停止哭泣，強顏歡笑。


  小雨其實明白，在那世上所有人都不相信她，包括她的母親、她敬愛的老師

  ，她並沒有說過一句話解釋，只是向她母親投來哀怨的眼神，默默地把治精

  神病的藥吃下去。


  ------------------------------------------------------------------


  畢業典禮那一天，老師把她帶回學校。她悄悄溜到琴室，以魔曲的力量再一

  次去到葉湘倫的年代。但沒想到，五個月不見，葉湘倫已經戴上了晴依的手

  環。


  她用魔曲的力量回到自己的年代，但所有支撐她活下去的東西已經沒有了。

  在這個時刻，她的哮喘突然發作，藥劑卻留了在家里，她在教室中呼吸困難

  ，終于咽下最後一口氣。


  生命的最後一刻，她在教室的桌面上，寫下了一句話：“我是小雨，我愛你

  ，你愛我嗎”


  ------------------------------------------------------------------


  在葉湘倫的父親揭露了真相後，葉湘倫立刻就明白了，路小雨是在什麼樣的

  心情下寫下那些字。


  他立刻趕回大樓，在仿佛世界末日的混亂中，坐在鋼琴面前，以前所未有的

  速度，彈奏這一首魔曲。就算地老天荒、海枯石爛，他也要把這首魔曲完成

  ，回到過去。


  ------------------------------------------------------------------


  我一直都在想，這部電影對我來說，意義在什麼地方？第一部可以和《回到

  未來》比擬的中文電影？


  不錯，網上已經有人解讀出魔曲曲譜的秘密，以正常的速度彈奏魔曲，可以

  去到未來。以急速的速度彈奏魔曲，可以回到過去，所以葉湘倫彈得比小雨

  更快，所以他甚至可以回到比小雨拿到琴譜之前的時間。


  因為這個故事還有一個伏筆，誰是第一個把曲譜放到鋼琴底下的人？


  接下來如果要做《不能說的秘密二》，可以像《回到未來二》那樣，葉湘倫

  和路小雨再使用魔曲，回到更古老的過去：1959，故事變成超越時空存在的

  浪漫愛情劇……


  可以自由順流及逆流時間，葉湘倫和路小雨的愛情從此在時間中永遠存在。

  嗯，我覺得這樣也很浪漫啊！


  ------------------------------------------------------------------


  什麼是不能說的秘密？為什麼這個秘密不能說出來？


  就算全世界都不相信路小雨的當兒，唯有葉湘倫始終相信她。雖然到中間的

  時候，《不能說出的秘密》差一點變成鬼戲，當路小雨以蒼白的臉色出現在

  畢業典禮時，相信很多人都會以為路小雨是幽魂吧！


  魔曲的秘密是不可以說出來的，因為太荒唐了。說出來後，全世界都會排擠

  她。


  也因此，每一個人都在不知不覺中，成為逼害路小雨的凶手。班上的同學譏

  笑她，在她流淚退學的時候，還對她說：“開不起玩笑嗎”。老師把她的秘

  密洩露出去，小雨母親的哭泣，就是一種莫名的壓力。


  始終只有葉湘倫無代價的相信她，不是嗎？路小雨說她有哮喘，所以不能夠

  和男生牽手、不能夠和男生接吻，葉湘倫卻很認真地看待她的話。


  當路小雨絕望的在桌上刻下“你愛我嗎”時，只有葉湘倫會急著在上面刻上

  “愛”，根本不管她到底是人是鬼，根本不管當時的氣氛是多麼的詭異。


  如果你有一個不能說的秘密，你一定要等到有一天，你找到一個你深愛你的

  人，你才可以把秘密說出來。因為只有深愛你的人，才會毫無保留的相信你

  。相信，就是這個故事隱藏的秘密。


  地老天荒、海枯石爛，唯有真愛可以超越時空的限制，在無窮盡的時空中永

  遠存在。


  ------------------------------------------------------------------

  Update：《不能說的秘密》路小雨 mv 120秒，Youtube視頻的連接在此。



