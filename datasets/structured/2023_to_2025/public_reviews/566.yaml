url: https://www.ptt.cc/bbs/movie/M.1486315977.A.59B.html
title: '[討論] 不能說的秘密是不是沒人超越?'
content: '如題


  不能說的秘密真的是台灣難得的好片


  劇情真的不錯


  演員就不用講了


  一堆杰倫班底


  劇情其實算是蠻屌的


  雖然我相信大家都看過了


  但論質量其實還是不錯的



  不過時空論還是怪怪的


  比起周的Mv ，這部電影的手法品質真的差超多。


  像這種懸疑中帶點浪漫


  浪漫中帶點奇幻


  奇幻中帶點藝術


  藝術中在帶點憂鬱


  算起很少見了，很明顯周想把古典音樂帶給大家!


  而且結局中悲傷帶著歡樂



  惋惜了他爸在另外一個時空失去他兒子QQ


  幸好周在另外一個時空結局是好的


  至於周穿越之後，沒學歷沒身份還能插班讀高中也是很不科學的...


  音樂真的不錯


  為此我還買了電影原聲帶的鋼琴譜

  棒棒的



  台灣好像還沒有什麼電影能超越吧!?



  --

  大喜臨門其實拍的不錯，沒有很老梗

  一定會借鏡的啦，鬥琴的內容根本不一樣呀，一個彈超快，一個裝b'
