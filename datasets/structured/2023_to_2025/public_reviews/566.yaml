title: '[影評] 純建議影評---不能說的秘密'
content: "電影結尾字幕的時候，一堆人捨不得走，留在漆黑的電影院給自己一段沉澱的時間。\n\n\n\n\n     很難想像，周杰倫這個名字每年在台灣創造很多話題，從幫霍元甲寫歌、當頭文字D\n\
  \n的主角、進而拍起MV，如今他所執導的第一部電影\"不能說的秘密\"，硬是讓它成功從樂壇\n\n完美征服影壇。至少這部片就跟他許多好聽的歌一樣，觸動很多人心坎，因為...老子硬是\n\
  \n在這部片感動到流淚。周董，真有你的!\n\n\n\n\n\n    其實常看國片的人都知道，電影配樂、劇情是國片最弱的一環，縱使演員演技再好、\n\n社會性有多強、導演有多國際級，一樣沒人能在台灣商業片站住腳，吸引不了看慣好萊塢\n\
  \n的大眾們，而電影界外表怪罪的是資金不足及盜版氾濫，但內心其實是知道少了哪些東西\n\n。\"不能說的秘密\"對我而言是近年來台灣商業片最棒的範本，也是為台灣電影界打入一劑\n\
  \n強心針，因為，周杰倫對音樂的熱愛及對歌曲意境的想法，竟然能跟電影這麼match~~~很\n\n難想像它不是電影科班出身，能將觀眾要的東西放在電影裡，也知道如何將自己音樂上的\n\
  \n才華加入劇情使它加分(也正大光明的秀給大家看自己有多\"猴\")。不論選角上、故事性、\n\n戲劇張力都說明一件事，往後周杰倫在電影界將能大放異彩、並帶給大家聽覺與視覺的享\n\
  \n受呀~\n\n\n\n\n    本片優點很多，先首推演員演員方面。桂綸鎂實在是本片最加分的要素，有很多人就\n\n像我一樣，看到預告桂綸鎂的鬼臉就乖乖買票進場了，不但外表學生氣質出眾，演員魅力\n\
  \n迷人，自然率真的演技很能讓人融入劇中，更讓人想到孔子和耶穌都說過：「初戀無限美\n\n」呀~~也於是，本片看完之後，男生感動的大概多過於女生，因為都愛上她啦。再者，自\n\
  \n編自導的杰倫所幸有經過兩次的歷練，不然可能毀到自己手上，不但表情收放更自然，加\n\n上合乎自己的人物特質，雖然角色很\"周杰倫\"，卻因為Show出拿手的琴藝，硬是將之前呆\n\
  \n呆杰王子拋在腦後，提升許好感度。只是本片杰倫對自己角色關於愛情方面刻畫得實在不\n\n夠深，未看出對女主角深愛的地方，導致愛情元素單靠桂綸鎂延伸，十分可惜。(不過結局\n\
  \n卻是周杰倫那一段流淚了...點解?)\n\n\n\n\n\n\n    那周杰倫角色讓人迷人的橋段反而是與黃秋生的對手戲，兩人默契極佳，也延續頭文\n\n\
  字D父子般的情誼，很討喜也逗趣，也是本片第二觀影重點。第三則是本片音樂性，從頭\n\n到尾貫穿本片鋼琴演奏讓本片層次媲美\"海上鋼琴師\"，好聽悅耳又有劇情張力，尤其是結\n\
  \n尾配合鋼琴所搭配的高潮，幾近完美，也點醒想拍商業片的導演，國片配樂水準再不提升\n\n，是很難達到買票入座的情形。本片，的確卻是一部很棒的國片教材。至於劇情故事，主\n\
  \n打不能說的\"結尾\"，讓好奇的人想一探究竟，以及不看好周董人想有證據的數落他說:\"老\n\n套\"。但是，本片的鋪成雖不致完美卻已超過許多亞洲經典純愛片，配上渲染力非常強的\n\
  \n鋼琴演奏，一幕幕讓觀眾聽進心裡。而前半段校園故事搭配幾個甘草角色，讓觀眾心情帶\n\n入校園時光，卻又在後半段來個回馬槍，慢慢帶入悲傷的氛圍，讓人感動不已。\n\
  \n\n\n\n\n\n   雖然本片也有邏輯仍嫌不足、男主角角色深愛對方的刻畫也不夠深、總有些橋段似曾相\n\n似，但對於第一次拍電影的周杰倫，竟然拍出如此高質感、有歡笑、配樂水準高、故事張\n\
  \n力強的好電影，我實在不知能怪他什麼。周杰倫，如果你不再拍電影也OK，你可以幫國片\n\n作一個專業的電影配樂呀?為何去當朱延平大導\"灌籃\"的男主角呀?你可以把這部片搶過\n\
  \n來執導嘛，這可能會毀掉你呀呀呀呀呀~~~~~(嘶吼貌)\n\n\n\n\n\n\n\n\n\n\n\n\n◎純建議評價:今年最感人、視覺聽覺震撼、質感高的情人節首選電影\n\
  \n\n\n◎花錢程度：看完電影會再多花三百多買它的電影原聲帶及租藍色大門回去\n\n\n\n◎看完之後遺症:1.學校的教室桌椅將會慘遭立可白攻擊、上課時小紙條重現江湖~~\n\
  \n               2.學鋼琴的人變多，因為本片證明學鋼琴的男生都等著被倒追~\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n◎純建議族群:\n\
  \n1.周董永遠的粉絲(這部片讓粉絲更把他崇拜到神的地步了，那鋼琴指法實在太銷魂啦)\n\n2.南拳媽媽的粉絲(彈頭搞笑功力不錯、宇豪鋼琴神技也過癮萬分，至於張傑....)\n\
  \n3.今年情人節不知看什麼的情侶(就支持國片、感動人心的方面，實在沒理由不選這片)\n\n4.想看正妹的男生們(光是桂綸鎂就值回票價，更何況第一女配角的晴依及整班正妹)\n\
  \n5.喜愛海上鋼琴師的人(本片鋼琴演奏支支好聽、悅耳，而且配上特效視覺享受也過癮)\n\n\n\n\n\n\n◎後記:\n\n●飾演校園痞子阿郎的黃俊郎是本片最亮眼又好笑的角色，沒想到原是周杰倫御用作詞人\n\
  \  ，我看比較是幫伍佰寫歌的人吧...= = (本片笑點百分之60都是他提供的)\n\n●請不要太執著想猜片終結局，而使觀影心情受影響，本片秘密是什麼不重要，而是兩人\n\
  \  之間一直再累積的化學反應才是本片重點\n\n●黃秋生跟周杰倫的組合越來越有吳孟達搭配周星馳的趨勢，兩人在一起對手戲就是特別\n  舒服\n\n●很多還是討厭周杰倫的人，你還是等承認老天真的不公平，賜給他那多必殺技，不論鋼\n\
  \  琴技巧、寫歌能力，又多了一項導演封號，好在演技沒完全賜給他，不然....\n\n●再次重複本影評最後一句以代表我的惶恐，\"當朱延平大導\"灌籃\"的男主角可能會毀掉你\n\
  \  呀呀呀呀呀~~~~~(嘶吼貌)\n\n\n\n\n\n\n--\n<><><><><><><><><><><> 轉載請註明出處 <><><><><><><><><><><><><>\n\
  純建議影評：\n1.MSN SPACES  \n2.無名小站    \n桃園民和戲院 奇摩家族→   \n\n--\n◆ From: 123.195.135.16"
