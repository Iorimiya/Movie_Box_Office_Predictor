url: https://www.ptt.cc/bbs/movie/M.1546133582.A.8D1.html
title: '[新聞] 「不能說的秘密」過11年仍登熱搜！韓網：'
content: '新聞網址：



  「不能說的秘密」過11年仍登熱搜！韓網：最棒的電影


  周杰倫執導並演出的電影「不能說的秘密」在韓院線播映11年後，依然熱度不減，今（29

  日）凌晨韓第一大入口網站「Naver」即時熱搜第二名是「不能說的秘密」，原來EBS電視

  台於凌晨播出電影「不能說的秘密」，電影一播完，「不能說的秘密」隨即登上熱搜第二

  名，「周杰倫」3個字也登上熱搜第10名，韓粉絲紛紛留言表達對「不能說的秘密」電影

  的讚嘆，經過11年，依然讓他們念念不忘。


  有粉絲感動說：「我30年人生最棒的電影，每次看都會落淚，被它的音樂感動，演員的演

  技總會讓我哭，非常重要的電影。」也有人說：「我人生中一年之內都要看好幾次的電影

  ，我被劇情感動也很喜歡裡面的音樂，以後也會一看再看的電影。」


  --'
