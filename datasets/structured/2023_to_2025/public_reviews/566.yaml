url: https://www.ptt.cc/bbs/movie/M.1427332553.A.86B.html
title: 'Re: [新聞] 周杰倫「不能說的秘密」 韓今春重上映'
content: "應該不太可能，周杰倫排片都吃不到什麼香\n差不多台北首周30~40廳隔週砍半\n然後口碑還沒發酵就差不多要下片了\n不能說的秘密還是只能在網路上流傳好評\n\
  \n周杰倫不像其他導演善於製造話題\n頂多只會說：「我拍的電影很屌，可以來看看」\n他連發專輯都可以跟你說不用買上網聽就好了\n如果你覺得好聽再去買就好了\n\n\
  所以你看天台的確很屌呀，至少是不一樣的國片\n姑且不論這不一樣是好還是不好哪個比較多\n但同時也的確要說部分很爛尤其後面劇情爆走失控\n我承認前面45分鐘的確是有營造不一樣的感覺\n\
  不管是攝影、音樂、色彩都是有獨樹一格\n\n所以想像一下跟大尾差不多時間上映排片比不上\n然後票房黯淡，沒落下映...又或者把天台上映年\n換成不能說的秘密也是被環太平洋夾殺後面還有銀河守護者\n\
  所以不能說的秘密 能在2007取得這樣子的成績算不錯\n但說最近幾年上映破3億不太可能...\n\n而且國片票房已經趨回穩了\n\n如果有青蜂俠那種強勢宣傳強勢排片再說吧！\n\
  期待下一部周杰倫「客串」的出神入化2吧\n\n--\n  18063   6/01 -            □ (本文已被吃掉)    這梗有毒...救命~~\n\
