content: "《不能說的秘密》時隔七年，5月中在韓國重新上映，韓國海報上 \n                寫著「觀眾期待度第1名」。\n　　\n　　重映首日觀影人數第八名，周末票房第十名\
  \ ，整個5月份都在\n10~3X名榜上，中途還有降了又回衝。\n\n　　用韓文《不能說的秘密》以上傳日期搜尋 ，即使到\n今天（7月底）往回推，還是天天都有民眾上傳影片。\n\
  \n　  \n\n少女時代：在中國的節目上，台港中16位男神中最後心儀周杰倫 \n  金秀賢：\n   　EXO：\n　SuperJ：\n不知道誰：\n　　民眾：\n\
  \n　　逛中國網站看到韓國人最愛的九部「華語」電影 \n（為啥用「華語」？因像　 一樣中國很愛撿現成...）\n\n　  \n　　　《不能說的秘密》\n《那些年我們追的女孩》\n\
  　　　　　　　《聽說》\n　　觀眾給的分數分別是9.28、9.11、9.02（有人懂怎麼找韓網這種分數排行？）\n\n　　有人說，韓國人一開始以為周杰倫是「演員」，後來才發現他是那麼劃時代的歌手，\n\
  更驚訝他的全方位編、導的才能，在韓國藝人圈裡沒看過？以上都是網路找的，有人「確\n實」瞭解《不能說的秘密》、周在韓國最終票房和多紅？為何？還聽說周有黑掉？\n\n\
  \n--"
