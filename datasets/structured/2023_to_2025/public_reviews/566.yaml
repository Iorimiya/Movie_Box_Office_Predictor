url: https://www.ptt.cc/bbs/movie/M.1186900445.A.926.html
title: '[好雷] 不能說的秘密-把故事說得精采動人'
content: "標題已經標明是好雷，便不再空一頁了:p\n\n\n《不能說的秘密》個人給的評價相當高，認為這是近年極棒的國片，\n\n比較起之前也轟動一時的《詭絲》，個人甚至覺得有過之而無不及，\n\
  \n雖然兩者主題不同，但以綜合表現來說，《不》片的確是可圈可點。\n\n\n故事是說男主角遇見女主角，並且相戀，最後神秘女主角突然離去，\n\n男主角不解的去找回，卻找到一個跨越時空的大秘密。\n\
  \n就這麼簡單的點子，在各方評論中俱被批評成拼裝電影、甚至抄襲，\n\n比如說鬥琴像是《海上鋼琴師》、情節像《靈異第六感》、《穿越\n\n時空愛上你》等族繁不及備載，若是在看電影前我有聽見這些批評，\n\
  \n或許我就不會考慮進到電影院裡去看，畢竟個人一向崇尚原創。\n\n\n\n但今天，我相當慶幸自己是在看完電影後才看到這些評論。\n\n因為那與想像中的、定義中的「抄襲」完全天差地遠，對我而言，\n\
  \n那些橋段全都是為了成就一個最原始的創意--創造的意念，那便是\n\n這部電影的名稱也是謎底《不能說的秘密》。\n\n為了把這個最原始的意念給包裝好，所以使用了鏡頭誤導的方式、\n\
  \n情節懸疑的鋪陳、怪異對白的伏筆，每一個出場人物都具有存在的\n\n意義，抽掉任何一人那這部電影將不成立，雖然在時空的大邏輯上\n\n尚有一些爭議(這些爭議在科幻時空類題材電影中也都存在)，但是\n\
  \n綜觀整個故事來說，他們已經堪稱完整而嚴謹。\n\n而這擁有不錯的基本分數的故事再搭配上導演的詮釋、剪接的緊湊、\n\n音樂的渲染、演員的呈現、佈景的唯美，終能建起一部動人的電影。\n\
  \n\n\n影片一開始是普通的校園清純戀情橋段，可是因為節奏輕快，音符\n\n動人，故能吸引觀眾繼續看下去，另一方面觀眾也不會這麼快就覺\n\n得想走，其實起因於這部電影的名稱《不能說的秘密》，在還沒看\n\
  \n到秘密到底是什麼之前，觀眾都擁有一定程度的耐心；接下來劇情\n\n不斷演進，緩緩將懸疑的氣氛塑造出來，最後即使謎底解開了，還\n\n是有好幾個伏筆安排置底，繼續拉住觀眾的目光，這便是本篇文章\n\
  \n所稱讚的--把故事說得精采動人。情節的設計安排上極為精巧，不\n\n論是阿郎阿寶躲到櫃子裡寫下「教練是傻子」的橋段，或是小倫在\n\n桌上拼命用沒水的立可白點著愛心，或是小倫的爸爸在翻開琴譜的\n\
  \n最後一頁時發現有小雨的斑白字跡，當他翻開折角的瞬間，看見了\n\n葉湘倫這三個秀麗的字體--以上這些都是個人認為相當卓越的，也\n\n符合電影該擁有的好技巧──用畫面說故事。\n\
  \n\n\n看完電影走出戲院之後，那震撼在心中迴蕩不已。\n\n以一部商業影片來說，《不能說的秘密》一片可謂是相當的成功，\n\n並且在其中我也看見屬於他精緻的部分，就是那些精緻巧妙的部分\n\
  \n扣住了我的心弦，比如說我現在回想起來小倫在桌上拼命用立可白\n\n回應小雨的問句，但其實二十年前的小雨根本不可能看到的這種心\n\n酸，又或是小倫冒險爬入拆除中的校舍彈琴，最後大鐵球撞擊的瞬\n\
  \n間，我那一直梗在喉間胸間的緊張；我確實被這部電影給牽動情緒\n\n了，在觀影過程中不停的全身發燙，一方面驚嘆影片之精采、另一\n\n方面又沉浸其中不可自拔。\n\
  \n對我而言，如果擁有這樣的感想，還不肯正視他是一部好電影的話，\n\n那也未免太自欺欺人了。\n\n\n\n\n\n\n\n--\n我閉上眼睛，是為了更看清楚你。\n\
  \n我說，看清楚你後，捨不得閉上眼睛。\n--\n\n                                           \n\n\n--\n\
  ◆ From: 210.192.169.128"
