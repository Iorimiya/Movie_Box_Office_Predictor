url: https://www.ptt.cc/bbs/movie/M.1469720821.A.1F2.html
title: '[討論] 不能說的秘密 那些年 小幸運哪個比較猛R'
content: '大家好消夜都有吃好吃滿惹ㄇ

  movie版首po分類錯誤的話請多包涵QQ

  今天單純想來討論一下這三部大家比較喜歡哪部

  這三部應該都算近年來最猛的國片吧

  1不能說的秘密

  男主角是我們的周杰倫

  女主角是桂綸鎂

  這部片國小的時候第一次看還看不懂

  一直到了國中看了兩三次的時候才知道他在演什麼

  我覺得這部片最大的特色是有加上一點點懸疑效果混搭在一起(難怪我當初看不懂QQ)

  結局也蠻令我意外的(男主角他爸超可憐QQ)

  算是周杰倫演的最好的ㄧ部片吧

  跟天台比的話

  這首的音樂也很好聽

  算是當年最經典的歌吧

  2那些年

  男主角是柯震東

  女主角是陳妍希

  這部片大概在說學生時期都會跟幾個異性曖昧

  但是最後沒在一起

  而且彼此的距離還更加遙遠惹

  說到這部片當然要提到他的主題曲那些年啦

  那個點閱率我就不多說啦

  3我的少女時代

  男主角是去年最紅的王大陸

  女主角宋芸樺

  其實這兩個我都不太熟哈哈

  這部片我個人看過一次覺得也還不錯看

  主題曲小幸運也很好聽哈哈



  個人認為這三部都各有自己的特色哈哈

  大家覺得哪部片比較好看呢QQ





  --'
