url: https://www.ptt.cc/bbs/movie/M.1688712615.A.96B.html
title: 日本也要翻拍《不能說的秘密》！ 選角曝光他狂
content: '新聞網址：

  由周杰倫自編自導自演的電影《不能說的秘密》2007年上映後在亞洲受到喜愛，繼韓國宣布

  翻拍後，今日本也跟進公布製作日版的消息，將由傑尼斯男團「SixTONES」京本大我搭檔《

  偶然與想像》女星古川琴音詮釋台版周杰倫與桂綸鎂的角色。



  《不能說的秘密》當年拿下金馬獎年度台灣傑出電影、最佳原創電影歌曲、最佳視覺效果獎

  ，2008年在韓國上映時，因周杰倫在當地知名度並不高，上映規模接近獨立片，儘管如此仍

  寫下觀影人次逾15萬的成績，連續8年穩坐韓國影史最賣座台灣電影寶座，其後被《我的少

  女時代》超越，2019年王大陸主演《一吻定情》又擠下《我的少女時代》，成為目前在韓國

  最賣座的台灣電影。


  「SixTONES」京本大我挑戰日版葉湘倫，他也已看了原版，表示：「我很喜歡作品裡面的世

  界觀，邊看時邊想『我也好想進入那個世界』，所以能接下這部片真的非常開心。」原先就

  有接觸過鋼琴的他，為了電影也加緊練習，他說：「最近只要找到空檔就會拚命練習！」請

  觀眾期待屆時的演出。


  飾演日版小雨的古川琴音因演出奧斯卡名導濱口竜介短篇集《偶然與想像》受矚目，戲劇作

  品邀約不斷的她，這回首次挑戰演出愛情片女主角，從小學鋼琴的她，也將在片中一展琴藝

  。她興奮表示：「我第一次讀到劇本時，就有種好像可以從劇本中聽見鋼琴聲的感覺，覺得

  這個故事真的很浪漫、很美。」她與京本也透過練習四手聯彈更加了解彼此，兩人會擦出怎

  樣的火花，令觀眾相當期待。日版《不能說的秘密》預計明年夏天上映。



  --'
