url: https://www.ptt.cc/bbs/movie/M.1573908925.A.48E.html
title: '[討論] 不能說的秘密'
content: '雷
















  整部劇都是悲劇吧唉...


  葉爸爸永遠失去兒子

  小雨媽媽原本還有女兒，但中年女兒也消失了

  1979年的小雨心碎死在桌子上

  1978年的小雨跟一個不愛自己，愛1979年的小雨的男人在一起

  葉湘倫拋棄一切，但回到過去愛上的是沒有跟他有共同回憶的那個小雨...


  如果回到過去剛好拯救即將死去的小雨，並把誤會解開，該有多好...


  小雨帶來初戀的感覺，搭配唯美音樂，整部片好美，但也好令人惆悵


  --'
