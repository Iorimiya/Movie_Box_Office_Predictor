url: https://www.ptt.cc/bbs/movie/M.1730732271.A.490.html
title: '[ 神雷] 不能說的秘密'
content: '果然 電影一定要親自看完 才能下定論


  以前周董的音樂才華無可質疑


  但是他的電影我總留在 功夫灌籃 刺陵這些爛片當中


  一直聽到有人說不能說的祕密很好看


  但一直還未有幸欣賞 直到成片十七年後的今天


  淡水的風采都在李屏賓大師的手中


  堪稱神作的青春偶像電影


  而且想不到周董對情感電影的掌控能力這麽強


  他不只是自肥的男主 更是這部戲的導演與編劇


  最後當然要談談路小雨 24歲的桂綸鎂


  對你賣萌 撒嬌 悲傷哭泣


  這誰擋得住啊










  路媽媽年輕時也是絕世美女 這是dna傳承




  --'
