title: '[討論] 不能說的秘密，好懷念'
content: '不能說的秘密

  好懷念

  那是我大學時期的電影


  好想念那時候的自己

  想念那時候的周董跟桂綸鎂

  想念那一年的氛圍

  想念那首歌

  想念原聲帶中那首angle


  不能說的秘密

  一轉眼已經12年過去了

  我卻還是好懷念這部電影

  還是我是懷念那年的自己跟生活

  我已分不清


  --'
