content: "新聞網址：\n\n2019-12-23 09:50 聯合報 記者陳建嘉／即時報導\n\n「STAR WARS：天行者的崛起」是今年年末的最後一部娛樂大片，也掀起全球一股星戰熱\n\
  潮，但許多看過該片的人都有同一個疑問，片中由約翰波耶加飾演的主角之一「芬恩」一\n直想對其他2位主角想說的話是什麼？真正答案似乎也已經揭曉。\n\n為許多「星際大戰」網路平台撰文的專欄作家Kaila\
  \ Ren在推特上透露有參加J.J.亞伯拉\n罕的「STAR WARS：天行者的崛起」映後座談，他被問及此事時，也簡單給予答案，外界\n認為芬恩是想要對芮告白，其實芬恩想要對芮、波所說的是「他對原力有很敏感的感應」\n\
  ，也因為這樣，他在片尾才能夠感應到哪一艘戰艦有比較強大的原力，進而協助反抗軍進\n行反攻。\n\n「STAR WARS：天行者的崛起」現正熱映中。\n--\n\
  \    \n\n;\n\n \n\n\n--"
