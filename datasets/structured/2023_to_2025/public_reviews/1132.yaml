title: '[情報] 義大利超級英雄電影《蓋世怪胎》中文預告'
content: '義大利超級英雄電影《蓋世怪胎》中文預告




  《蓋世怪胎》二戰背景超能「奇」兵大戰，怪誕又眩目的金馬奇幻影展秒殺電影正式上映




  2024-02-29 電影神搜




  奇幻動作冒險鉅獻《蓋世怪胎》將於 3 月 1 日在台上映！本片是《叫我鋼鐵俠》橫掃義

  大利大衛獎七項大獎導演 蓋布瑞爾曼尼提 最新力作，由德國影帝法蘭茲羅戈斯基 主演

  ，《007 首部曲：皇家夜總會》克勞迪奧桑塔馬利亞等巨星飆戲，精采程度宛如漫威《X

  戰警》遇上《驚奇 4 超人》，橫掃全球影展榮獲 35 個獎項 21 項提名。


  《蓋世怪胎》故事背景


  《蓋世怪胎》劇情講述以二次世界大戰為背景，奇人異事就此上演！能控制昆蟲的白化少

  年、善良小丑能身吸鐵片、長毛野獸男力大無邊、女孩觸碰指尖會發電。二戰飛彈突然來

  襲，帳篷瞬間被夷為平地，徒留眾人自力救濟。男孩們決定投靠華麗德軍舞台，柏林劇團

  的六指彈鋼琴首領能預見未來；女孩則獨自踏上尋覓之旅，卻面臨更大的危機！




  《蓋世怪胎》的敘事流暢精彩，畫面華麗，視效精緻突出，配樂充滿巧思，集結怪誕、奇

  幻、戰爭等多重元素，本片融合真實事件與虛構童話的手法，揉合歷史奇想及冒險成長，

  交雜復古情調與現代文明，少女領銜夥伴再寫超能電影。子彈血漿沒在客氣，夢境穿越還

  撿到手機，變奏搖滾畫龍點睛。


  聞天祥推薦：二次世界大戰的『驚奇四超人』


  金馬影展執行委員會執行長聞天祥推薦：


  「《蓋世怪胎》這是二次世界大戰背景的作品。特別的地方是男主角法蘭茲羅戈斯基，他

  是德國近期最好的男演員，各位應該時常會看到他。他是一個從六指琴魔，變成納粹狂魔

  的角色，能夠對抗他的，是一個馬戲團怪胎秀組成的四個成員，可以想成是那個時代的『

  驚奇四超人』。他擁有我們講起來很像是好萊塢英雄、漫畫電影的格局，但也有比好萊塢

  電影更現實、更犀利，更深刻的部分。別看它長這樣子，它可是上一屆威尼斯影展的正式

  競賽片，而且得到一堆會外獎項，不只是技術，也包括表演，這樣類型的電影能進三大競

  賽，是非常特別的，這是一部義大利片。」




  除此之外，許多影評人觀賞此片後也大讚此片，電影部落客香宮堂主則大讚，


  「《蓋世怪胎》的敘事流暢精彩，畫面華麗，視效精緻突出（完全不遜於好萊塢的商業片

  ），配樂充滿巧思（預見未來的法蘭茲在表演中彈奏數十年後才會推出的電台司令名曲「

  Creep」，這首歌暗示的正是法蘭茲對自身的看法），演員也有適切且精彩的表現，作為

  一部熱鬧好看的娛樂片，《蓋世怪胎》絕對是高分過關！」


  超人馬戲團 VS 納粹主義




  值得一提的是，本片不但榮獲鹿特丹國際影展觀衆獎、義大利奧斯卡金像獎（大衛獎）6

  項大獎 10 項提名，還入圍了等各國影展包括威尼斯影展正式競賽、奧斯汀奇幻影展、釜

  山影展、西班牙 Sitges 奇幻影展，威尼斯國際影展競賽片，成為全世界爲之狂熱的超能

  戰鬥動作大片！集結超人馬戲團 VS 納粹主義 令人驚嘆的電影！非凡戰爭動作片 一種全

  新獨特的娛樂形式誕生！


  --'
