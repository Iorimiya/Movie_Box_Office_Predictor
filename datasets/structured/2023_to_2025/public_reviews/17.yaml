title: '[好雷] 三分之愛 大正時代感爆棚'
content: "因為廣瀨玲去看\n\n本來還以為是什麼隨便室內講講話的片\n\n結果整個時代感爆棚\n192x大正末期\n東西交融頹廢的文藝氣息\n\n從一開始京都小路\n\
  東京路面電車\n遊樂場舞廳\n木頭屋家具小物\n無聲電影片場\n\n就連最後紅磚殯儀館也是美到窒息\n\n這片美到窒息 美術完全不輸國寶\n\n但劇情完全沒有拍出岡田將生在片中到底重要在哪啊\n\
  \n女主角發瘋整個問號\n\n中原中也是真有其人\n這段關係應是有所本\n\n 那個年代的文人就是很難懂又靠邀\n\n最後收在沒有支柱駝背那個台詞後勁夠強\n\n\
  是用心好片\n日本拍時代電影還是很有一套的\n\n\n-----\nSent from JPTT on my iPhone\n\n--"
