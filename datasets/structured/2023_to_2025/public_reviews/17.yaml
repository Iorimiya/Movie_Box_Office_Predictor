title: '[情報] 【三分之愛】預告 11月14日上映'
content: "《#三分之愛》台版預告 ── 11.14 一去不返\n\n 2025鹿特丹影展大銀幕競賽片\n 《水手服與機關槍》日本傳奇編劇田中陽造執筆\n\
  \ 《海街日記》#廣瀨鈴 ╳《First Love初戀》#木戶大聖 ╳《在車上》#岡田將生\n夢幻組合 同台共演\n  他與她，她與他，他與他，一場濃烈而無法逃離的宿命\n\
  \n\n1920年代初，懷抱夢想的新人女演員長谷川泰子，邂逅了日後被譽為天才詩人的中\n原中也。兩人因同樣的自命不凡而彼此吸引，迅速墜入愛河並開始同居。搬到東京\n\
  後，他們的生活因中也的朋友小林秀雄的來訪而產生劇變。這位未來成為日本重要\n文學評論家的男子，意外牽動了長谷川泰子的命運，也讓三人捲入一場濃烈而無法\n逃離的宿命之中。\n\
  \n\n「是純情？還是純愛？\n          ──他們再也回不去的青春歲月」\n\n\nYasuko, Songs of Days Past ──11.14一去不返\n\
  \n\n\n\n\n\n--"
