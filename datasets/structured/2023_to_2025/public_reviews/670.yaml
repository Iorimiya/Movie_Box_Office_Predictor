title: '[好雷] 《我最喜歡的蛋糕》- 幸福的「往生」 '
content: '伊朗電影

  2024金馬影展與院線有上映過








  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  《我最喜歡的蛋糕》 My Favourite Cake，除了關乎伊朗政府當局箝制女性自由權利的背

  景，以及面對社會高齡化，與少子化的孤獨老人議題這類具有人文關懷面向的來解釋片尾

  那場意外像是人生最浪漫的送行儀式之外。



  比較想說的是電影刻意維持的極簡劇本與攝影的用意，與看似在對應著俗世以年輕、美麗

  、讚頌活力的價值觀，相對電影中主角老人的生活與戀愛，如長輩圖般帶有鄉愿且悲憐感

  地被解釋成一種對生命衰老的正向鼓勵。在此想到「不老騎士」與曾經看過雜誌拍攝老人

  的時尚照片，皆在現實中大家心知肚明避免醜陋、老化、甚至短命被視為一種羞恥的狀態

  下，被包裝成過度熱血浪漫的鼓勵。



  故若如電影對白所云，走樣身材有甚麼好看的？於是穿衣服洗澡的自嘲，想必是在提問著

  某些世俗眼光的觀眾：老人談戀愛有什麼好看？這個問題不是在說老人談戀愛不好看，而

  是反映一種心照不宣的社會價值，大家還是比較想看俊男美女的戀愛戲碼，對吧？



  於是我們看到《楢山節考》對於老人，「不顧顏面」的冷血，把等死的老人送去山上丟棄

  ，與《愛慕》展示著逐步面對老伴死亡的冷酷過程。



  於是電影中最後烘烤著「幸福蛋糕」在簡要的電影結構中像是蘊含整體的單義性：「生的

  死亡」，或許是獻給害怕寂寞且依舊打扮自己外表提醒自己還活著的生者，卻依舊必須忍

  受不知還要多久的孤獨寂寞；而死者卻幾乎無痛的死去「往生」，已經是最幸褔的方式。




  --


  拉特飯 - 以商業力量進入獨立市場


  --'
