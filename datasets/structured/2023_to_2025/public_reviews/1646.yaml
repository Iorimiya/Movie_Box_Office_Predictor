url: https://www.ptt.cc/bbs/movie/M.1618229843.A.054.html
title: '[新聞] 「當男人戀愛時」11天破1.6億 邱澤揭秘「'
content: '新聞網址：

  完整新聞標題: 「當男人戀愛時」11天破1.6億 邱澤揭秘「玉米鬚」造型

  新聞來源:UDN聯合新聞網

  2021-04-12 聯合報記者 黃保慧 即時報導


  新聞內容:

  邱澤與許瑋甯主演的電影「當男人戀愛時」上映11天全台票房已突破1.6億，更連6日拿下

  全台票房冠軍。監製程偉豪、金百倫、導演殷振豪與男女主角12日現身台北京站威秀，團

  隊把片中理髮廳重現，邱澤、許瑋甯還重溫浪漫剃鬍戲橋段，吸引大批粉絲圍觀。


  能有如此好成績，團隊都表示「不真實感比較多」，邱澤透露身邊不少友人都給予好評，

  就連曾合作「誰先愛上他的」導演徐譽庭都大讚，甚至認為這次離拿下金馬影帝的獎座又

  更近了。


  邱澤人氣也隨著電影的熱度更高，不少人爭相模仿他在片中的「玉米鬚」造型，對於要如

  何駕馭這顆頭，他表示，燙髮的藥水不要下太多，不然頭髮會毛掉。而他浪子暖男的形象

  讓不少影迷無法招架，有人直接在戲院映後對他求婚，他笑回：「要回家問媽媽。」而許

  瑋甯在片中哭成淚人兒，讓不少觀眾心疼，融入劇情問「還好嗎？」、「飲料店有沒有開

  成？」讓她笑回：「都很好。」


  片中一場甜滋滋又微揪心的浪漫剃鬍戲，就是發生在理髮廳內，邱澤被問到當下被許瑋甯

  剃鬍的心情，笑著表示雖然剃刀是道具，但內心還是「有點緊張！」許瑋甯趕緊解釋：「

  我拍攝前有練習啦！」電影現正熱映中。


  --'
