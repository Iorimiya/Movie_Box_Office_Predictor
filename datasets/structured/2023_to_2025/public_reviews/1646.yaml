url: https://www.ptt.cc/bbs/movie/M.1618132269.A.9CA.html
title: '[普偏負雷] 當男人戀愛時'
content: '我已經做好可能會被噓的心理準備了


  但我還是覺得這部片根本過譽欸


  放在去年的國片潮


  一定被屌打不知道幾條街


  原本我是想給負雷


  但不想辜負了邱澤的演技


  所以還是給普偏負就好


  而且再難看也沒有我沒有談的那場戀愛難看啦哈哈哈




  我周邊的人看了都說爆哭


  跟我一起看的朋友也泛淚


  但我幾乎都在尷尬癌中度過


  過多矯情的台詞


  為感動人而感動人


  劇情也是老到不行的老梗


  有些橋段我覺得不用靠台詞去向觀眾解釋


  用了反而很刻意


  看完果然認證是從韓國翻拍過來的


  我真的不知道為什麼這部片會這麼賣座


  也難怪會有人質疑國片是不是會有工讀生炒作




  題外話


  我自己覺得韓國的懸疑電影挺不錯


  但韓國情感類型的電影是不是走不出矯情劇情


  之前聽人家說七號房的禮物很好哭


  結果我看完也是覺得超矯情


  完全感動不了


  開心鬼上身我就覺得是少數不矯情的了


  而同樣也是情感方面的電影


  愛在黎明破曉時跟真愛每一天


  觀影過程就覺得那種情感流動是很自然很舒服



  --

  矯情當然是我覺得呀 照你的說詞 那什麼情況下 電影被說矯情是合理的？

  講敗壞風氣又有點太過了啦XD

  我哭點是頗高 只是也不是沒看電影哭過 但這兩部真的無法

  好險撐過去了

