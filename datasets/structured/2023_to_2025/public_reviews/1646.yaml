url: https://www.ptt.cc/bbs/movie/M.1616847484.A.CFD.html
title: '[好無雷] 老套卻深觸人心《當男人戀愛時》'
content: '在觀賞前已經知道劇情是老套愛情故事，且是韓國電影改編的，

  但衝著邱澤x許瑋甯的高顏值cp組合，

  還是跟朋友一起約去看片。

  我覺得整體可以用四個字帶過：

  俗夠又力！




  愛情線老套但是最後還是哭到不行，

  跟原版的韓國電影相比，對於親情有更多的描寫，

  望子成龍的父親、生疏卻深藏手足情的大哥

  劇情細節穿插不少的笑料與人物個性的刻畫，

  某些片段很像是會發生在你我周圍的故事，

  但那種平凡與常見卻更讓我能深入戲裡的劇情及角色。


  最後不得不稱讚這部戲的主角與配角陣容，

  邱澤的演技真的沒話說，

  面惡帶點中二感，心思細膩的流氓，

  每場戲的動作跟眼神都很到位，

  金馬獎男主角入圍門票應該沒問題，

  雖然許瑋甯是演欠債憔悴的農會小姐但還是仙氣逼人，

  後段談起戀愛很恰很甜美，感情戲有層次。

  配角方面Lulu、鍾欣凌、蔡振南、藍葦華等等

  戲份雖然不多，

  但出場的時候都能馬上吸引住眼球。

  第一次看到鍾欣凌演反派，意外地無違和

  大姐頭笑裡藏刀有帶勁！

  雖然一直不時會帶入我的婆婆的角色設定XDDD

  對這部片我給予正面的評價，

  你以為愛情總是令人臉紅心跳，但唯有經歷過才知道其刻苦銘心。


  --'
