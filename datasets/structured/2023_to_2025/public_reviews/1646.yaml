title: '[微好雷] 當男人戀愛時'
content: '以下依舊全有雷。






















  「啥款！」

  最有記憶點的是打保齡球，

  張孟成安排的那場告白，

  全場熄燈，LED燈板上的愛你99，

  跳著舞，唱著茄子蛋的愛情你比我想的閣較偉大。旁人訕笑的眼光與語氣，

  吳浩婷的「啥款！」完全是陷入愛情的模樣。


  電影散場後嘴裡仍然會喃喃唱著主題曲的副歌，

  這首太強了啦，

  本來上映前聽過還覺得沒什麼記憶點。


  「對不起啊，

  你的好我都有記得，欠的我下輩子再還你」

  事實證明，瘋子瘋起來真的會怕，

  張孟成同歸於盡也要跟蔡姐拿回那筆錢，

  眼底是求情，也是請託，唉。


  「你走啊，看你想走到哪去」

  吳浩婷的那個眼神，

  眼裡是生氣又是無奈又是心疼，

  太多情緒摻在一起而留下的眼淚，

  真的讓人跟著哭出來。


  看完後勁滿強的，

  後面哭到有點快瘋掉，

  邊哭邊想翻白眼，

  有些劇情都猜得到可是就是會哭啊，

  但是我真的要說，

  最後面放屁真的有點硬要欸哈哈哈哈XDDD


  而且芒果可不可以有點自己的想法，

  從頭到尾人家叫他幹嘛就幹嘛，隨之起舞


  簡單的故事卻因為男女主角的演技讓人感動，

  我覺得是屬於自己喜歡但不一定會推薦給別人的，

  如果有興趣可以去看看。



  最喜歡的是最後他們一起在豬肉攤前買肉要回家做粉蒸排骨的樣子。











  --

  社會中有非常多數的人或許是出自於不自願的決定，我單純討論劇情，請不要偏題。

  我也喜歡那段！掏耳朵真的是很親密的互動'
