url: https://www.ptt.cc/bbs/movie/M.1630317832.A.CA6.html
title: 'Re: [討論] 當男人戀愛時，為啥要把爸爸丟給女朋友'
content: '一家人的概念

  因為對比較傳統的人來說

  即使自己死亡，女方過門了，我父母就是你父母

  也就是對女方承諾我們是夫妻

  比較傳統或是鄉下的都有這樣觀念

  以前的貞節牌坊就是這樣來

  雖然現在對這樣觀念意識薄弱

  但有些人還是很在意過門後照顧彼此父母


  --

  哪邊有讚揚這種觀念的???

  我都說現在這樣的觀念比較薄弱

  沒說這樣是對或錯或是好或是壞，每個人有自己的理念

  我不會去說這樣觀念對或錯，自己選擇自己負責所選的結果


  你是不是該確認自己閱讀能力


  親愛的房客

  也是類似狀況，沒有婚姻但也替對方照顧他母親到離世為止

  這很難說對錯，但是自己選擇旁人也不能說什麼'
