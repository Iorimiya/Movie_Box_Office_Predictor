url: https://www.ptt.cc/bbs/movie/M.1630123101.A.B5E.html
title: 'Re: [討論] 當男人戀愛時──吵架的原因'
content: "劇情後面有一段 阿成把討回來的錢還給她\n\n她打了阿成一巴掌後說  「你欠我的不是這個」\n\n而且後來也堅決不拿\n\n這就很明顯女的是真的不在意那筆錢\n\
  \n在意的是感情\n\n這跟eq有關嗎  我覺得是跟每個人在意的東西不一樣\n\n\n同上  女的在意的是感情\n\n男的則是因為把女的的錢賠光了\n\n感到愧疚\
  \ 不敢面對 所以才會那樣亂嗆\n\n\n呃 你所謂的不合理的理由就是一直在\"錢\"打賺\n\n但騙感情又不是只能騙錢\n\n騙來玩玩 打打炮 然後說我從來沒有愛過你\n\
  \n這也不是不行\n\n不管是以前的網路聊天室、ptt、還是交友軟體\n\n也存在很多人會先跟女孩子說要交往  然後上過床後就分手\n\n所以女主角會相信男主角說的沒愛過她\
  \ 這根本超正常\n\n尤其男主角的人設本來就是痞痞壞壞der\n\n\n劇情從一開始 男的就一直介紹一些容易賺錢的方式 像是賣身、陪吃飯、賣腎\n\n但女的都拒絕\n\
  \n這劇情就在告訴你女主角就是個不會為了\"利誘\"而上勾的\n\n即使後來為了錢答應跟男主角出去 但也是男主角一個人自嗨 她都冷冷看著而已\n\n\n後來在男主角一連串的攻勢後\
  \ 終於達陣\n\n\n男主角說沒認真過\n\n女主角認為「原來你這一連串攻勢都只是為了上我」\n\n完全是有可能的\n\n也就是主要是騙色~騙財是其次\n\n\
  因為剛好2人打炮後 才聊到開店的事 才知道她那有一筆錢\n\n當時女主角問他：你不討債的話 想做什麼\n\n男主角說\n\n結果過幾天 又突然跟女主角說「」\n\
  \n然後幫女主角找店面  要了錢\n\n這些轉折  在男主角說不是認真的之後\n\n女主角可以解讀成：你為了上我 才幫我爸辦喪事\n             \
  \     然後知道我有筆錢 騙我說要一起開店\n                  還說要結婚 騙了我的錢去賭博 輸光了 才承認對我不是認真的\n\n尤其女的一直要帶男的回家\
  \ 男的一直不肯\n\n女的也會想：你輸光我的錢 我都原諒你 讓你回家了\n            你還一直拒絕 看來真的是騙我感情\n\n\n女主角一開始的心防本來就很重\n\
  \n是後來才逐漸打開的  被言語刺激後又再度有心防完全是合理\n\n\n總之~  所謂的玩玩的 本來就不是只有騙錢\n\n你一直在$$$上面打轉 自然看不懂\n\
  \n這段分手戲我是覺得沒什麼問題啦\n\n\n--"
