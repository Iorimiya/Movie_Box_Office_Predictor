url: https://www.ptt.cc/bbs/movie/M.1618852677.A.072.html
title: '[負雷] 當男人戀愛時-當8+9想幹炮時(文長)'
content: '如題


  這部電影基本上就是當 一個流氓想打炮時


  文章會囉嗦一點  因為....


  我本來也很想給好雷  很想被感動  很想哭




  然而最後哭的是我的理智與錢包




  先說  負雷的理由


  第一個是沒有哭點  沒有哭點照理來說並不一定是主宰電影好看的基準


  但是這部在宣傳行銷上  就是主打感動


  第二個是演技  我必須說男女主角的演技都是可以給肯定的


  但是光有演技沒辦法拯救電影  好的演技卻發揮不出來效果  只會更扣分


  第三  是重點  就是劇情沒有力量  再說一次  劇情沒有力量



  單純要讓人哭  不是一直塞哭的畫面就會哭   好啦我承認我差一點中

  但最後只要想到這到底要哭屁  馬上清醒

  反而小丑或寄生上流這種可悲的真實  我是真的會忍不住

  哭點這種東西很奇妙  它需要打中靈魂裡的深處  那是一種自己也沒發現的地方


  當被電影感動到時  你才驚覺你自己有那種模樣  便哭了出來

  這是我對  哭  的理解

  我是差點有被弄到  裡面真他媽塞很多  感覺怕人不哭顆顆

  剛剛聽主題曲  突然領悟到  這部其實就像是男主角在保齡球場跳舞唱歌一樣


  很花俏  很狗血  很大聲勢


  旁邊那女生所說的:"好俗喔 好丟臉還好不是我男友"


  剛好就會是一般人對這部電影的心聲  這部的愛情我是真的不懂  也許8+9會懂?


  電影就如男主角在那跳舞一般花俏  觀眾卻像旁邊女孩一般傻眼無法理解


  會喜歡這部的  可能也會喜歡很誇張的戀愛?

  不用執著票房吧  我是說喜歡的人  又不是說買票的人

  急著為8+9護航是什麼意思

  我也是

  我前面聽到的那對情侶也是阿  票房主義是很模糊的

  跟你感覺一樣  配樂很可惜  不過茄子蛋真的好聽

  但我也不會覺得完全到難看  畢竟演員頗會演  只是劇情硬傷就是硬傷

  說真的劇本爛  演員爛  整體爛的一堆XD

  只是  這部改編的  也許之後我會去找原版來比對  是否原版也有這種缺點

  那你花三百吃大便  可以吃很飽  吃不吃?

  還是你多窮  三百都吃不起  笑死

  神邏輯'
