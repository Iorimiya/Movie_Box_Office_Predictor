title: '[好雷] 當男人戀愛時'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  2014年韓國電影《不標準愛情》的「美女與野獸」典型故事叫好叫座，茄子蛋《浪子回頭

  》MV的導演殷振豪將這段「小姐與流氓」的故事加入台味元素，再找來台北電影節影帝邱

  澤與影后許瑋甯擔綱男女主角，搭配上三金得主蔡振南與金鐘影后鍾欣凌畫龍點睛的加分

  演出，拍出《當男人戀愛時》這部最派的台式虐戀。



  韓版原作男主角由影帝黃晸玟出演，獲獎無數的他演技精湛，雖說外型不算特別突出，但

  身材獲得不少導演肯定，飾演的多部作品都有脫褲子或裸下半身的畫面。台版《當男人戀

  愛時》導演找來同為影帝又帥氣的邱澤演出，除了由於他內心有個阿成之外，邱澤在《誰

  先愛上他的》與《江湖無難事》裡角色的台味與黑道背景也讓他在眾多男星中脫穎而出。



  邱澤在片中充分展現出他收放自如的情緒，導演在映後座談提到，拍攝《當男人戀愛時》

  最困難的地方在於邱澤太過搞笑，導致對戲演員與劇組都得憋笑，許瑋甯甚至必須「懸梁

  刺股」地捏大腿以避免笑場。不過，該認真的時候邱澤也絕不馬虎，片中阿成把錢全部輸

  光之後，在小吃攤喝醉酒叫浩婷（許瑋甯飾）回家的一場戲，導演表示，劇本是沒有台詞

  的，都是邱澤臨場發揮，甚至喊完氣話之後，蹣跚的步伐與倒向一旁的肢體動作都是一氣

  呵成，導演也就順勢沒有喊卡，而一喊完卡，邱澤就全身癱軟地倒在導演身上，直說「心

  好痛」，入戲之深令人佩服。



  另一方面，許瑋甯的演技也不遑多讓。導演提到，唯有透過大銀幕才看得出來，片中浩婷

  每一個眼神背後所隱含的情緒都不同。不論是前半拒阿成於千里之外的冷酷，抑或是後半

  的心痛、心碎與無奈，許瑋甯都為每一場戲揣摩了不一樣的情緒，用眼神說出不同的話。



  男女配角也為《當男人戀愛時》增色很多，蔡振南飾演的失智爸爸，除了是他首次嘗試的

  角色類型，對兩個兒子的關愛也在言談中表露無遺，是片中親情線的一大亮點。鍾欣凌飾

  演的蔡姐，是黑道中的大姊頭，導演解釋，這個角色設定成「不耍狠時討人喜歡」，如此

  人格分裂的角色交給鍾欣凌來詮釋再適合不過了，而蔡姐的心狠手辣也為《當男人戀愛時

  》提供另一個層次。



  全片最驚人之處莫過於揭露阿成動脈瘤的那一刻，觀眾這才意會到原來第一幕裡的鼻血，

  不單單只是因為他拿香爐砸頭打到頭破血流而已。阿成的生活與「流血」脫不了關係，所

  以不會有人把他流鼻血跟身體出狀況聯想在一起，也意外讓這個伏筆的後勁變得更強。除

  了「血」之外，片中的配樂、美術、燈光與場景也搭配得宜，營造出最好的氛圍，尤其是

  浪漫場景的色溫，與最後天人永隔形成強烈的對比，導演找來茄子蛋為電影量身打造的歌

  曲也充滿了台味與溫情。



  《當男人戀愛時》的愛情公式雖然老套，但導演利用成功的角色塑造感動人心。在所有角

  色裡看起來對周遭人事物滿不在乎的阿成，其實才是最懂得默默關心旁人的一位。身為討

  債公司的員工，要說對債務人網開一面是不可能的，畢竟他也是吃人飯碗，但每次收款都

  「少一點」的這點恩惠阿成還有能力給得起。明明老是為家裡添麻煩，也不忘為老父親與

  心儀的女孩購買補品，甚至在假釋出獄回到家中時，看到爸爸做著手工，不分青紅皂白就

  先開打，但到頭來出發點也是不忍父親受苦。



  陪著父親折紙盒的短短父子談心時間裡，聽到爸爸數落哥哥的不是，即便剛剛才跟哥哥打

  過一架，他也不忘為哥哥抱不平，解釋這麼多年來家裡的生活費都是哥哥在張羅的，叫爸

  爸要對哥哥好一點。最令人揪心的要屬阿成告別式後，以他的名字訂購的一箱包裹，哥哥

  一打開就徹底崩潰。這也是除了「流鼻血」之外，導演安排最巧妙的伏筆了。全片從頭到

  尾只有阿成一個人在意美容院的霓虹燈沒有在轉，他每一次出門看到也都不忘拍打幾下確

  保它正常運轉，原來最後一次不管怎麼拍打都沒有辦法讓霓虹燈轉之後，體貼的阿成早已

  默默訂了一個新的。



  看似對家中事務最不聞不問的他，其實一直默默以阿成最獨特的方式與體貼愛著家人，紙

  箱打開那一刻，不要說哥哥，就連觀眾想必也被這後勁打得淚流不止吧。



  片中兩場喪禮相互呼應，浩婷父親的喪禮由當時正在追求她的阿成真心且自發地幫忙發落

  ，除了讓浩婷看到他的體貼與真心之外，也發現被討債的債務人們都對阿成有著感激之情

  ，當葬儀社提到「女婿」時浩婷也不急著否認。當片尾籌備阿成的喪禮時，浩婷就是以未

  亡人的身分出席，為他撐傘，送阿成最後一程。哥哥也按照「白髮人送黑髮人」不能送行

  的習俗，要求爸爸待在屋內，但是當爸爸想到兒子與自己最後的談話，提到自己心愛的女

  人失去父親，請求他當她的爸爸，即使會違背習俗，也要看一眼這無緣的媳婦。



  雖說《當男人戀愛時》刻畫親情動人，賺人熱淚，最後還是不得不提一下前段如《消失的

  情人節》一般「死纏爛打就會成功的愛情」，實在是讓人無法苟同，彷彿合理化「死纏爛

  打」等於「追」的想法。可是，至少浩婷感受到不舒服時有報警，但正如許多性騷擾案件

  蒐證不易，派出所警員也只能以「抽號碼牌排隊」不構成任何騷擾或違法行為結案。其實

  ，這兩部電影呈現出台灣一個不爭的事實，那就是農會、合作社與郵局等單位的臨櫃人員

  經常都會遇到有人頻繁抽取號碼牌的情況，而三姑六婆拿著自己兒子的照片前來「自我推

  銷」的情形也時有所聞。



  不過，比起劉冠廷飾演的阿泰，邱澤飾演的阿成已經非常尊重他所追求的對象了。多數時

  候都只是在農會外默默等候，送上幾杯飲料，再考慮到浩婷身不由己的債務人身分，無論

  是高冷的心最終真的被打動，或是礙於無奈先接受，進而在彼此認識的過程中發現阿成的

  另一面，發展成最後的結果也才比較沒那麼令人意外。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
