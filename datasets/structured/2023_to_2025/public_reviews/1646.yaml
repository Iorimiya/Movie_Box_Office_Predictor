content: "「當男人戀愛時」連3日冠軍將破億 邱澤竟被求婚\n\n\n邱澤在「當男人戀愛時」的哭戲令人動容。圖／金盞花大影業提供\n\n2021-04-09\
  \ 18:58  聯合報 記者陳建嘉／即時報導\n\n「當男人戀愛時」上映迄今，全台累積票房已逼近9000萬，更連續3天拿下全台票房冠軍\n，預計今天衝破1億大關。昨晚舉辦特別映後場，邱澤更一時興起清唱電影主題曲「愛情\n\
  你比我想的閣較偉大」，帥氣模樣惹得觀眾激動示愛：「邱澤娶我！」\n\n「當男人戀愛時」昨(8)晚舉辦「男神寵粉特別映後場」，導演殷振豪、監製程偉豪與金\n百倫、男主角邱澤特地來到戲院，和全場300位觀眾近距離互動，眾人相約穿上花襯衫，\n\
  一同化身為片中各款花襯衫換不停的「阿成」！不到24小時就旋風式完售的300張現場座\n位，有許多觀眾都已三刷以上，觀眾紛紛喊著片中「啥款」、「今仔日要歡喜」、「我愛\n\
  你欸」等經典台詞吸引主創團隊注意，他們直呼「當男人戀愛時」不僅台詞朗朗上口，主\n題曲旋律更是洗腦，帥氣出場的邱澤也一時興起現場清唱電影主題曲「愛情你比我想的閣\n\
  較偉大」，令現場氣氛達到沸騰！\n\n主創團隊一一解答觀眾對於劇情設定的發問，邱澤表示對於每個角色都有其印象深刻之處\n，也很喜歡導演殷振豪放入的小細節，而邱澤在片中瀟灑又深情的模樣也迷倒現場眾多觀\n\
