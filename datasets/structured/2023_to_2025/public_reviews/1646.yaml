url: https://www.ptt.cc/bbs/movie/M.1618764496.A.FB2.html
title: '[好雷] 當男人戀愛時(Man In Love)'
content: "今天終於進場看到我覺得還不錯的國片了，不管是演員的演技口條、電影的節奏、\n\n故事情節、配樂等等，都有一定的水準，讓我眼眶都不禁紅了，感覺國片在有了好劇本\n\
  \n之後是可以把一部戲拍得不錯，雖然配角的演技都口條還是有待加強，不過一切都是瑕不\n\n掩瑜，平常朋友都覺得我對於國片或韓片特別的仇視，但是我只是覺得很多國片韓片的粉\n\
  \n絲把標準放到特別低，而我只是用一貫的標準來看，不會因為是國片就放低標準去鼓勵，\n\n但是這電影是我想推薦大家去看的，真心覺得不錯。\n\n\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n 電影的一開始就快速帶出主角的性格，那就是一個討債有底線的中年男子，阿成\n\
  \n在討債的時候好像都沒在傷害人，都是利用一些其他的小技巧來逼迫債務人，但是在\n\n遇到一些真正有困難的人時，又不會趕盡殺絕，甚至自己會掏腰包，在我看來他只是一個\n\
  \n不知道如何處理自己情感的幼稚中年男子，不管是對親人、大姐頭、或著是對浩婷，\n\n當阿成因為討債而認識浩婷，他只能用他一貫粗糙的方式追求，雖然有些笨拙，但是時間\n\
  \n久了還是能讓人看出他的真心，尤其是對浩婷父親的付出，那才是深深打動浩婷的關鍵，\n\n不過也是因為他這樣的個性才把他自己與浩婷的未來搞砸。\n\n這樣的男人都有他們自己堅持的浪漫，即使在旁人看來相當無謂及可笑，但是我卻能夠感\n\
  \n同身受，我想有人也稱這是男人的浪漫，當他決定為了浩婷的夢想而鋌而走險那刻，我覺\n\n得他就已經把他們的未來也賭上了，不管結果的好壞，對一個有理智的人來說已經輸了，\n\
  \n大姐頭在一開始應該是沒有要連阿成的份一起搶走，而是當阿成提出離開要求又反悔想要\n\n加入時，大姐頭才連他的份一起搶走，那些小弟在搶錢的時候把阿成往死裡打，讓我覺得\n\
  \n阿成484平常都在欺壓他們，不然搶錢就搶錢，面對自己曾經的大哥，應該至少會手下留情\n\n吧，在把事情搞砸後的處理也可以說明阿成是個無可救藥的幼稚男人，他直接惱羞成怒說\n\
  \n了一些屁話把浩婷趕走，因為他只想貫徹他自己的男人浪漫，他不希望浩婷跟著他繼續受\n\n苦，他一廂情願地覺得這樣對彼此都好，即使浩婷覺得兩個人在一起才是最重要的事。\n\
  \n\n在結局部分是有點矯情，不過知道劇本是從韓國買來的就覺得不意外了，阿成在出獄後，\n\n一樣把自己男人的浪漫貫徹到底，硬是去大姐頭那邊把錢討了回來，然後不管浩婷的感受\n\
  \n硬要把錢塞給她，在浩婷的眼裡，阿成粗暴地進入了她的世界又難堪的離去，現在則是又\n\n再一次莫名的出現，然後像個跟蹤狂一樣跟著她，或許阿成只是想趁著人生的最後一點時\n\
  \n間好好看著自己的愛情重新開始她的人生，這樣他才能安心的離去，不過也因為劇情的需\n\n要，阿成在離開時昏倒而且就被浩婷所發現，進而得知他所為她做的種種事情，這段的故\n\
  \n事安排有些刻意，但又不會令人太出戲，這就是我覺得國片有進步的地方，結尾部分也把\n\n親人部分收得不錯，前面所有動人情節都只是讓我動容而已，但是在大哥收到來自阿成的\n\
  \n快遞的地方，我想來想去猜不到是甚麼東西，在揭曉的那刻，我眼眶不爭氣地紅惹QQ\n\n他用他一貫的方式來對待他的家人，即使很多時候嘴巴很硬，但是心底還是關心著他的家\n\
  \n人，不管是送父親保健食品還是大哥的燈皆是如此，這就是阿成所遵從的男人的浪漫，貫\n\n徹了他的一生，我能理解，因為我在他身上看到曾經的我，現在的我知道兩個人平平淡淡\n\
  \n過一生才是幸福，只要有兩個人的地方就是家。\n\n\nPS:在散場戲院燈全開的時候，我環顧四周發現幾乎所有人都哭了，這我還是第一次看到!\n\n\n--"
