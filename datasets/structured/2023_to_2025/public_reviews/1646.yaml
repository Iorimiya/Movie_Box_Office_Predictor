url: https://www.ptt.cc/bbs/movie/M.1618974971.A.315.html
title: '[微好雷] 孤獨的擺渡人《當男人戀愛時》 '
content: '孤獨的擺渡人《當男人戀愛時》


  圖文好讀版：


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  對你們來說，阿成是什麼樣的人？


  從這次的電影看的出來，邱澤真的是很吃劇本的演員，好的劇本，能激發他獨特的一面，

  就像是《當男人戀愛時》、《誰先愛上他》等劇本，都讓我們看到了邱澤不同且具備獨特

  風韻的一面。


  但差強人意或是過於俗套的劇本，就只能讓邱澤的演技扁平化，當中差距，真的不是一星

  半點，諸如這種例子我想應該也不用我多說，大家心裡都有一把尺。


  而這次化身純情討債人的邱澤，在我看來，更像是個擺渡人。


  為何會這麼說的，請容我娓娓道來。


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  【愛著全世界，卻不被愛的人】


  用「愛」這個詞或許有點太過了，但我看來，阿成確實是盡己所能的幫助著周遭的一切，

  討債人卻變成了佈施者，這樣的反差性，他沒被蔡姊剁了餵狗我也是大感不解。


  但相較於他幫助著身邊所有的人，但整部作品我看來，真正愛他的，除了浩婷與蔡振南飾

  演的成爸，真正對阿成好的人，少之又少。



  阿成對蔡姊不好嗎？


  好，但也不好，要說忠心盡力，阿成確實可以擔當的起「好」這個字，但若要說是個好的

  討債人，阿成肯定是不合格的！哪個討債集團，能容許自己手下的討債人是個散財童子呢

  ？


  但就像阿成說的，這些年來，他沒有功勞，也有苦勞，雖然當初他踏入這一行，確實也是

  為了幫助自己的家人，但到頭被黑吃黑，確實也讓人覺得有些落魄。



  阿成的家人愛他嗎？我認為很難說。


  每天看著大哥夫妻吵架，床頭吵床尾和，姪女對他就是伸手要錢，沒一點尊重，這樣的日

  子在阿成家或許是日常，但在外人看來，這個做叔叔，當弟弟的，在家裡的地位真的是低

  到跟隱形人一樣。



  而阿成的那些欠債人，對阿成或許有感激，但肯定不是每個人都是同樣的，更多的，是一

  種占了便宜的心態，就像是Lulu或是道士，對阿成的善心，在感激之餘，也多了一絲賺到

  了的想法。


  雖然劇情後期演出了阿成離開後，每個人到來的模樣，但這樣的安排，在我看來反而有些

  多了，狗血，並不是越多越好的。




  【衰臉女神－浩婷】


  如果放在久遠點的年代，浩婷絕對可以被街訪說成剋夫命，出場死老爸，下台死老公，這

  樣的待遇真的是衰上加衰，而且保險金跟存款還全都消失，能把自己搞這麼慘，真的不簡

  單。


  我過去沒想過許瑋甯厭世臉可以這麼有特色，但經過這次，我大大愛上了她的厭世臉，那

  種不僅透露著厭世，更透露著一種，生無可戀的死氣，雖然後來笑起來同樣甜美可人，但

  那厭世臉的特色已經深得我心！


  可惜這部電影的主要光環都在邱澤身上，觀眾能將目光放在浩婷身上的時間有限，無法得

  知她的背景，也沒辦法理解她更深層的情緒，但即便如此，在最後她牽著成爸手的畫面，

  仍是這座冰山化為柔花的重要畫面。




  【蔡振南是逼哭我的最大元兇】


  如果沒有蔡振南，《當男人戀愛時》實在很難逼哭我，當蔡振南老人癡呆後，他跑到警局

  以為自己還要開客運時的場景，以及罵著剛假釋的阿成的畫面，實在是令人感到心酸。


  而在大雨中與浩婷對視後，那一聲「不肖子」，那種不捨的情緒更是豐沛異常，在最後家

  中收到阿成早就訂好的旋轉燈時，我的眼淚就真的忍不住了。可以說我這次被《當男人戀

  愛時》所感動的部分，都與蔡振南有關，而從劇情也不難看出來，相較於大哥，蔡振南明

  顯更疼這個不學無術，整天惹事的小兒子。





  【遺憾】


  不免俗的，《當男人戀愛時》還是有些令我遺憾的部分，我自己感覺如果阿成在看到浩婷

  能追求新的感情後倒下時就End，感覺也是不錯的收尾，雖然最後的部分蔡振南的戲有感

  動到我，但整段看下來，我自己是覺得大多橋段都有些狗血過頭了，偏向於為了給個善終

  ，而做的例行性收尾。


  此外，阿成被黑吃黑的戲是我整部電影感覺最莫名其妙的，我理解蔡姊想黑吃黑，我也理

  解阿成為了給浩婷更好的生活所以放手一搏，但我不理解的是，阿成就這麼帶著錢到賭場

  ，也沒有下去賭，也沒有講要怎麼獲利，結果就一群人衝進來砸場黑吃黑，我本來還以為

  是阿成與他們串通好的，但芒果的臉出現後才知道是阿成被黑吃黑，整段顯得混亂還有些

  沒頭沒尾，實在很難讓觀眾理解阿成到底是去賭場幹嘛的？


  《當男人戀愛時》翻拍自韓國電影《不標準情人》該片在2014年上映，取得了IMDB6.9的

  評價，並收穫了1360 萬美元的票房，而《當男人戀愛時》至今取得2.5億台幣的票房，距

  離打破原作還有點距離，但也並非沒有機會。


  我自己沒看過《不標準情人》，但這部翻拍作品找來邱澤，我認為是出色的選擇，殷振豪

  證明了自己的台味不僅能在MV上有獨特的風格，在電影上也能有不錯的表現！


  而茄子蛋的《日常》，更是比電影主題曲《愛情你比我想的閣較偉大》更能代表整部電影

  的情緒。


  或許在阿成的心中，他想要的，就是與浩婷簡單吃著粉蒸肉，賣著奶茶的平凡日常吧。


  我是老王，下次見。


  --'
