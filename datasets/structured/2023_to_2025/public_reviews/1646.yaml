content: "最近被警察朋友找去看這部\n\n從頭笑到尾\n\n是說襲警那段我沒轉過去看朋友表情\n\n臉色應該很不好看\n\n看完出來他也沒講話\n\n劇情很多人說有哭點\n\
  \n我是感覺不出來啦\n\n畢竟人老了,紅白場去多了\n\n沒什麼感覺\n\n以前有認識社會底層\n\n穿著講話都跟男主角一樣\n\n個性也差不多\n\n搞砸事情的能力也差不多\n\
  \n如果啊成好好開飲料店\n\n結局肯定不會是這樣\n\n不過啊成就是啊成\n\n他如果不這樣做死\n\n這部片就不好笑了\n\n這部片裡面最慘的大概是蔡姐\n\
  \n錢都被男主角拿去做人情\n\n啊成：你兒子要看病\n\n             啊不然這個月先不收啦\n\n蔡姐：………\n\n啊成：最近藥賣的不好\n\n\
  \            啊不然這些你們留一點啦\n\n蔡姐：……\n\n啊成：我女朋友的錢不能討\n\n蔡姐：…………\n\n最後蔡姐用計謀回收男主角一家的欠款\n\
  \n啊成：給我錢,我下輩子還你\n\n蔡姐：…………（給）\n\n啊成一定是跟蔡姐說過：\n\n「阿姨,我不想努力了」\n\n這部根本就是啊成與蔡姐的愛情故事\n\
  \n啊成還拿蔡姐的錢去lulu那邊灑\n\n幫哥哥買霓虹燈\n\n幫爸爸買補品\n\n幫浩婷辦喪禮\n\n至於女主角？\n\n請來顧失智老人的吧\n\n要說這部片少了什麼\n\
  \n大概是蔡姐沒有在啊成葬禮上痛哭\n\n= =\n\n\n--"
