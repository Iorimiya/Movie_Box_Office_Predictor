url: https://www.ptt.cc/bbs/movie/M.1617735667.A.A5D.html
title: '[超好雷] 當男人戀愛時'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  進影聽之前就對這部充滿期待，男女主角我都很喜歡，主題曲也是最喜歡的樂團，前一天

  要去看的時候忘記訂票，影廳甚至只剩第一排！為了觀影享受就決定隔天再去看了


  幸好做對決定了


  今天做了一個極佳的位置享受這部電影，劇情是老套，從最一開始他拿香爐打完自己的頭

  ，後來卻是在流鼻血的時候就猜到他應該是會得癌症。

  走向也很好猜，阿成是善良的，被迫走向這條路，女主是冷靜的，無奈接受阿成給的條件

  。但偏偏，是這麼老套的劇情騙走我今年至今所有的眼淚（今年的我目前真是堅強）


  喜歡邱澤演出的台客感，喜歡許瑋甯的厭世感，喜歡台語帶來的熟悉感，喜歡直白的告白

  ：「啊你就樂咖，閣乓乓誒」，喜歡誠摯的眼神（尤其保齡球那段！），喜歡合適的配樂

  （愛情你比我想的閣較偉大、日常）......


  雖然灑狗血的劇情太好猜，但邱澤跟許瑋甯演得太好，完全能融入在他們的世界裡！看到

  有很多版友在討論有沒有也適合這角色的演員，女主我真的想不出來欸！


  我從邱澤拿錢回去給許瑋甯那裡開始哭，哭到發現爸爸失智，再哭到看著聯誼的愛人露出

  欣慰的微笑、客運站的挽留、喪禮上爸爸的情緒，最後是送給哥哥的禮物，明明就是老套

  的劇情，但偏偏賺人熱淚。


  想知道大家都在哪段開始哭的 嗚嗚嗚


  --

  太前面了吧！

  不會！那邊很值得哭嗚嗚嗚嗚

  那邊也很感動嗚嗚嗚嗚嗚

  真的！演員表現的夠好！

  原來是這樣！

  哭爆

  那邊真的很值得！

  前面大家都很開心，後半段大家開始啜泣

  不會啦！本來就各有哭點（我看比悲傷的時候也完全哭不出來哈哈哈哈

  那邊我也是泛淚，但又想笑

  我也是哭到字幕跑完嗚嗚嗚

  真的！！我一看到那個燈管眼淚狂噴

  都好值得哭...

  喪禮那段我也想哭又想笑，覺得阿成根本是硬上欸，就是直接以女婿的身分完成這一切的

  這部分 哈哈哈哈

  能理解！我外公過世的時候我媽難過到什麼都沒辦法做，那時候也多虧有我爸，所以能感

  受到女主角內心的感動

  哥哥哭成那樣真的好難過嗚嗚嗚嗚

  下輩子還你也很值得哭...

  看到那幕的阿成真的直接成長欸！

  我的天！好多小細節都有戳到大家的點...

  我是屬於對醫療這部分不了解的人，所以這段在看的時候不會不合理，但看起來好像真的

  蠻奇怪的哈哈哈'
