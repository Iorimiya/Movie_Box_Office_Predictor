url: https://www.ptt.cc/bbs/movie/M.1616897976.A.144.html
title: '[好無雷] 當男人戀愛時 '
content: '雖然標題是無雷，但是摻雜個人觀影後的情緒描寫


  為免不小心雷到大家還是放個防雷頁
















  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  因為疫情已經好一陣子沒進電影院看電影了，直到最近終於忍不進有進場看電影的衝動


  怪獸片一直不是我的菜，加上看預告片時就被"當男人戀愛時" 吸引


  阿成抽號碼牌的橋段直接打中我的笑點，所以當下就決定我一定要買票進場支持了


  原本以為是歡樂的愛情喜劇，想不到直接貢獻出第一次在電影院噴淚的經驗。




  回顧全片其實劇情並沒有特別的神轉折，走向也不難猜


  但是為什麼這樣還是讓人大噴淚呢


  我覺得在這些俗套的大框架之下，還是能看到導演很多充滿濃濃台灣味的巧思


  以及導演獨有的敘事手法



  雖然電影主題是愛情，但是對於親情的描刻一點也沒有輸給愛情


  演員的演技自然不在話下，配合上燈光、氣氛跟配樂


  這些全都如海浪般一波一波不斷地襲來 (為什麼我腦裡出現食神的畫面)


  完全就是推人淚崩的導火線阿



  除了配樂外，茄子蛋寫的電影主題曲也真是恰如其分


  看電影前聽跟看完電影後的回味完全有不一樣的感受



  我覺得"當男人戀愛時"跟傳統8+9主題的台灣國片真的給人有很不一樣的感覺


  不太確定到底是差在哪，但就如同茄子蛋的台語歌和一般台語歌手的台語歌相比一樣


  就是有股很不一樣的風味




  總而言之很推薦給大家!!


  做為疫情以來第一次進電影院，真的有種久旱逢甘霖的滿足感。



  --'
