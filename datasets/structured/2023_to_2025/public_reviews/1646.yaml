url: https://www.ptt.cc/bbs/movie/M.1617286933.A.FF8.html
title: '[好雷]《當男人戀愛時》，我想牽著你可愛的小ꐠ'
content: '部落格版：


  《當男人戀愛時》就好像是《比悲傷更悲傷的故事》加上《誰先愛上他的》的綜合，很韓

  式的狗血情節裡卻充滿著台灣味的情感，導演殷振豪成功揉合了兩者，在保留住原來韓版

  《不標準情人》的味道的同時更將台式風格混入其中提升風味，讓電影變得更契合台灣觀

  眾的口味，不過分多也不過分少，加加減減的剛剛好，那些很直接或是說不出口的感情，

  對愛人也好、對家人也行，總適時的調和快要過頭的狗血橋段，讓觀眾不至於會受不了，

  反而還會默默的被其感動。過去以拍攝音樂錄影帶成名的新銳導演殷振豪，最為擅長的就

  是說故事，替每位與他合作的歌手的音樂，找到一個最適合的故事，讓人聽了歌眼前很自

  然的就浮現畫面，例如每次聽到了茄子蛋的《浪子回頭》，就不自覺會想到那句經典的「

  看三小」以及已故演員吳朋奉的回應「看你緣投啦！」，又或者是讓殷振豪拿下金曲獎最

  佳音樂錄影帶獎的告五人的《紅》，隨著旋律浮現腦海的，都是謝瓊煖的清晨獨轉，從帶

  著與兒子的回憶笑著到後來意識到兒子不會回來的傷痛欲絕，直接逼出我的眼淚。


  從《浪子回頭》、《浪流連》到《這款自作多情》，這是茄子蛋與導演殷振豪共同創造出

  來的「浪子宇宙三部曲」，而《當男人戀愛時》能否視為是浪子宇宙的外篇？導演殷振豪

  選擇了改編《不標準情人》實在有趣，討債流氓愛上了為錢所困的女孩因此決定為愛浪子

  回頭的劇情，再加上茄子蛋替電影所寫的主題曲、電影中曾由主角孟成拿來作逗樂浩婷的

  《愛情你比我想的閣較偉大》，到了最後又以茄子蛋2017年的作品《日常》當作收尾，從

  仍在江湖上浮浮沉沉的土味告白「雖然江山易改但本性難移，愛你愛甲白目眉」唱到想與

  她廝守到老決心走回正途的「我想牽著你可愛的小手，朝我們的家一直走」，導演殷振豪

  用一部電影、用兩首歌的時間，帶我們看見了藏在鐵漢外表下的柔軟內心，以及當戀愛時

  男孩成長為男人的轉變。當男人戀愛時會是什麼樣子的？會是可以為了讓對方感到快樂做

  出許多丟臉的浪漫小事，卻也會為了保護對方故意說些傷人的反話，如此笨拙又倔強、害

  羞標準抓不定的模樣嗎？我想，當男人想為了一個人改變，就是戀愛時的樣子吧。



  「走正路是好命人的權利。」


  《當男人戀愛時》既有愛情亦有親情，雖然多數時間觀眾都在看著阿成談戀愛，然而與家

  人之間的情感卻也是很重要的部分。是愛情和親情圓滿了阿成，也是阿成圓滿了愛情和親

  情，導演殷振豪讓愛情與親情改變了阿成，卻也讓阿成成為填補了愛情與親情缺口的那個

  人，我很喜歡的地方是，在映後導演殷振豪回應觀眾所說的，《當男人戀愛時》或許不是

  喜劇收場多少有些遺憾，但看到最後觀眾會不自覺的跟著嘴角上揚，即使不論是浩婷還是

  阿成的家人都因失去了阿成感到傷心，可是他們也因為阿成而擁有更多，阿成替他愛的人

  都做好了最好的安排，浩婷在遇見阿成之前與父親相依為命，可在父親過世後只剩自己一

  個人，阿成不願再看浩婷獨自面對往後生活，於是請託父親能替他好好照顧浩婷、讓浩婷

  再擁有一次父親；而阿成知道自己不是一個孝順的兒子，替父親添了很多麻煩，但他也知

  道父親非常疼愛他，無法承受白髮人送黑髮人的痛，所以在未來的日子裡就由浩婷替他孝

  順父親了。


  坦白來說，導演殷振豪最令人動容的，其實不是阿成與浩婷的愛情，而是與家人之間的情

  感，那些因為阿成的善良而默默牽起彼此的手成為家人的人們，當他們有困難時阿成幫助

  了他們，當阿成有需要時就換他們來幫他，他們都在無意間裡和阿成當起了沒有血緣的家

  人，就連看似心狠手辣的蔡姐，也是把阿成當成弟弟在疼愛，若非如此她就不會在阿成表

  示自己要退出江湖時語重心長的勸、更不會在後來把她騙走的錢還給阿成。阿成不坦率的

  可愛成了江湖上一個不標準的存在，卻讓我們都在不知不覺中跟著每個人喜歡上了他。


  「就算我跟你講，你也知道是假的這樣，你也要？」


  如前面提到的，《當男人戀愛時》主題雖然是愛情，但我想導演殷振豪著墨更多的，反而

  是在家人這部分，或者說是「陪伴」。電影裡的每個角色其實都很寂寞，所以他們最後都

  有了依伴，不過過程是相當有趣的，關係的變化成了情感的轉變，像黃路梓茵所飾演的芽

  芽在阿成發酒瘋後對他的一次實話實說，從早前兩人的對話間能知道芽芽也欠下不少債務

  ，她的還債方式就是肉體償還，可就算這樣子兩人也就停在討債的與欠債的關係，不代表

  阿成能夠對她做出超出「討債」這件事範圍之外的要求，同樣的道理放在浩婷身上也適用

  。阿成執著著的有人愛他，她們或是其他人要說當然可以說，就是騙騙他、哄他開心而已

  ，但這樣的我愛你不是很空虛嗎？不論是那種愛的關係，都是需要時間培養、去建立的，

  絕不是口頭一句敷衍就成立的，所有人都懂、阿成也懂，只是還很懵懂，對於愛人與被愛

  他還不太了解，以爲像簽借據那樣簡單，直到在感情的探索中受了幾次傷、流了幾次血、

  心痛了好幾次，才漸漸明白愛人與被愛是怎麼回事，也意識到了過去做了多少錯事，這樣

  的明白與意識使他從男孩成了男人，幼稚裡多了份成熟，即使用的方法還是笨拙的，可就

  已讓阿成和他人之間存在著的不再是冰冷的借據，而是擁有著溫度的陪伴。


  導演殷振豪透過這樣的設計來將阿成塑造的很飽滿、很立體，接著在以他為中心向外，在

  一來一往的互動裡連帶讓其他角色都跟著有了清晰輪廓，不只是女主角浩婷、阿成的父親

  、哥哥與大嫂、夢想當偶像的姪女、蔡姐、就連那些小弟以及欠債的人、芽芽、廟祝、外

  籍情侶等人都能讓觀眾記著，甚至到了後來看見他們前來參加阿成的告別式，會因認識而

  有感觸然後忍不住感到鼻酸。



  「我要轉行了，我要和你一起開一間最pro的奶茶店。」


  「店可以晚點租，房子也可以換小一點的，只要我們兩個可以在一起就好了。」


  《當男人戀愛時》有著韓國電影的公式骨架，以及台灣電影的靈魂，充滿台式風格的對白

  台詞，雖土卻很有效果，邱澤與許瑋甯很接地氣的表演拉近與觀眾的距離，兩個人先後用

  著「啥款」來表心意，本來聽著許瑋甯不是很流轉的台語有些尷尬，但聽久了竟也覺得蠻

  可愛的，和俗擱有力、很有口氣的邱澤形成很有趣的對比、意外產生笑果，認真說台灣應

  是找不到比邱澤更適合演台客的人了。論整體來說，《當男人戀愛時》不算是很創新的類

  型電影，而是因為導演殷振豪將韓國電影的那套成功吸收消化，並且轉化成較符合台灣觀

  眾胃口、很台式的愛情喜劇，兩者巧妙的融合令人耳目一新。


  導演殷振豪所做的鋪陳、醞釀，都隨著近尾聲那首《日常》的一次爆發，尤其是人與人之

  間的情感堆疊，更在這短短幾分鐘裡有了最美的遇見，不少容易被人看過就忘了的小地方

  ，也成了導演殷振豪用來試圖逼出觀眾眼淚的安排，像阿成最喜歡吃的粉蒸肉、向姪女借

  的彩虹筆，還有哥哥經營的理髮廳外頭不再轉動的旋轉燈，都是阿成與他或她的共同回憶

  、他曾經活著的證明。我特別對親情招架不住，看著阿成與失智父親的相處，以及哥哥在

  阿成走後沒多久收到的全新旋轉燈忍不住崩潰的時候都讓我眼眶泛紅。《當男人戀愛時》

  讓人笑也讓人想哭，那些笑中帶淚、淚中帶笑的情節交織成一部遺憾卻圓滿的電影。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
