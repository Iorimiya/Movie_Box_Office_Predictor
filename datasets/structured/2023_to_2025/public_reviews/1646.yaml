url: https://www.ptt.cc/bbs/movie/M.1620017746.A.B60.html
title: '[  雷]  當男人戀愛時心得'
content: '看了這部片


  喜歡的部分是

  在30歲以上的年齡

  很多社會壓力壓在身上

  還看得到這種純純的愛


  但一直有一種不切實際的違和感


  感覺這種愛情放在國高中那真的是還不錯

  舉例說

  一個用功普普通通個性倔強的女學生

  遭遇一些困難（家庭 或學校問題）但她想自己一個人扛下來

  然後學校大尾的混混因緣際會出來幫女生說話

  陪她渡過困難的時光

  又跟學校教官混得很好幫忙女生解決問題...

  兩個原本不相關的人互相影響一起變好

  很多人真的蠻吃這套的......


  回到片裡

  男主自己去陪幫忙處理後事

  這裡會讓人產生一種我真的可以很信任你的感覺


  女生問男生你為什麼喜歡我

  男生說你腿長阿...

  但是大家都知道這男生要有女人怎會沒有

  他就看不上啊 只喜歡女主這種


  就很像很多偶像劇裡

  男生身邊有漂亮的女二他就不愛

  就喜歡這種乖乖的對他兇兇的女主

  整個夢幻泡泡阿


  但是這部片違和感的地方就是

  他們已經不是學生了

  身上幾百萬的債務、做討債

  隨時都是未爆彈


  然後...

  就真的爆了


  前面那些我們穩定後去登記 都沒了

  變成錢被騙 被關 生病 繼續討債（拿瓦斯）

  到這邊就覺得完全戳破原本的粉紅泡泡


  這部片又從粉紅泡泡變回現實世界


  一個欠一堆錢年紀稍大的女生

  好像也只能跟一個做討債的中年男人在一起吧


  而拿掉討債大哥的身分

  還會有人叫阿成成哥嗎

  他只不過是社會底層罷了

  耍帥做人情的本錢也沒了


  他不能去做工 不能去從頭開始

  只能用賭的 想用黑吃黑賺一筆給女生幸福

  這樣的對像怎麼看都太不幸了


  所以說前面的粉紅泡泡，幸福的感覺都是建立在不切實際的幻想上


  回到實際

  一個只想賺快錢（用暴力討來的，一賺就想賺幾十幾百萬的人），這樣的男生他的人生有

  真正工作每個月領個三、四萬過嗎


  沒有，家裡也窮，他憑什麼覺得自己可以帶給女主角幸福


  所以女主角家裡欠很多錢，讓她只能跟這種人一起幻想未來

  前面的幸福真的很短暫


  回到最初

  如果男生就這樣際繼續做討債的，幫女主把最大條那比解決了（蔡姐看在男主面子上，算

  了）

  繼續陪陪女主吃飯散步像一開始一樣單純

  最後就算生病

  女主也就陪他最後一程

  這樣會不會好一點呢


  --'
