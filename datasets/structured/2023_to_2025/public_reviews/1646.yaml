title: 'Re: [討論] 當男人戀愛時的小疑惑'
content: '沒看過韓國版 這段我自己的解讀是這樣


  劇情有提到阿成的哥哥也是有欠大姐錢


  所以阿成才來這邊幫忙討債


  結果討回來的債都七折九折


  到後來吳父吳女的錢不討 外籍雜貨店的錢也不討


  最後說要拍拍屁股走人開飲料店? 阿女主的錢到底有沒有要還?


  可能讓大姐心生不滿 才會想要設局阿成


  先是暗示他多湊一點錢


  讓阿成以為是詐賭外國有錢人 讓他投錢進來抽成


  實際上搶劫才是重點 阿成並不知道


  順便把阿成的錢也搶一搶


  以上我的解讀大概是這樣啦



