url: https://www.ptt.cc/bbs/movie/M.1618050796.A.019.html
title: '[ 好雷] 啥款！《當男人戀愛時》中的無名英雄'
content: "【啥款！《當男人戀愛時》中的無名英雄】\n\n終於抽空看了期待已久的《當男人戀愛時》，真心覺得這齣戲的劇本實在是太厲害了，感\n動之外更獲益良多（看戲都在看細節，真是個職業病和職災呀）。導演、表演、音樂、美\n\
  術都很棒，但我想一個精彩的文本確實提供的好了基底，讓所有人的才華都能在其上錦上\n添花。\n\n看了不少評論，很多人說芭樂、煽情但是感人，但我認為芭樂與煽情也是有層次與細節的\n\
  差別。這齣戲的故事除了一些不敗的橋段如階級差異、生死離別、犧牲奉獻外，許多細節\n的鋪墊來營造、來頭尾呼應與勾連、進而來一記回馬槍，那才是真正擊中人心的秘密。如\n\
  果說大塊的情節如生死奉獻是所謂的芭樂，那麼細節的書寫就是展現其脫俗的地方。\n\n這齣戲的劇本就是這樣，既芭樂又脫俗。\n\n這個劇本完全展現了好的電影台詞的精髓，沒有什麼長篇大論的金句，沒有那種「強烈要\n\
  觀眾記得幾句台詞帶走」的用力與焦慮，僅僅營造出一個生活的氛圍而讓幾句發自肺腑、\n 雲淡風輕的對白在脈絡下產生最大的後座力，幾句生活感的話就能成為角色的動機與驅\n\
  動力。故事前半的邱澤拿了妹妹的彩虹筆去畫了一個討債格子，這個看似俏皮的橋段卻成\n了重要鋪墊，在後半的妹妹一句突如其來的「彩虹筆要還我喔」成為邱澤回去看許瑋甯的\n\
  驅動力。一句不經意的話，是角色的初心、是回憶、是故事的開始，亦成擊垮角色最後堅\n強與固執的利刃，這種巧妙的勾連都是細節、是功力，在這齣戲的劇本中屢見不鮮。\n\
  \n這是一次成功的劇本改編，成功的在地化與當代化。或許演員的魅力光彩奪走了所有人的\n注目而鮮少提及劇本，但我看到了，獲益良多。有空再好好發文寫個文本分析吧，剛看完\n\
  了還在感動中，趕緊推薦給大家。好的電影票房不怕錦上添花，而是更該好上加好。\n\n經典台詞只需要兩個字，啥款！還沒看的人快進戲院看看吧！\n\n\n\n--"
