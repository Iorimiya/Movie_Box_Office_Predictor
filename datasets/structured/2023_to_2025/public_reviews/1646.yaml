url: https://www.ptt.cc/bbs/movie/M.1616772958.A.649.html
title: '[新聞] 台式浪漫電影《當男人戀愛時》！ 邱澤、鍾欣凌耍壞顛覆形象'
content: '台式浪漫電影《當男人戀愛時》！ 邱澤、鍾欣凌耍壞顛覆形象演出


  向來以小生形象著稱的邱澤，跟許瑋甯合作新電影，卻頂著玉米鬚捲髮，化身台味十足的

  討債流氓。就連以親切形象著稱的鍾欣凌也變壞！飾演狂抽菸、飆髒話的討債公司大姐頭

  。首度挑戰笑裡藏刀的陰險角色，讓她說演來辛苦，卻也大呼過癮！


  邱澤化身癡情台客，許瑋甯詮釋欠債上班族，浪漫愛情電影台味十足。


  頂著一頭玉米鬚捲髮，邱澤詮釋超台的討債流氓，顛覆過往形象，他卻說自己原來就是這

  個樣：「平常小時候家裡阿嬤講台語，然後在球隊的整個成長過程，有很多中南部的選手

  ，以前在宿舍大家練球的時候，幾乎都是台語。」


  顛覆形象不只他，穿著花上衣，大口抽菸還髒話不離口。鍾欣凌不再演崩潰媽媽或親切婆

  婆，出道以來首度接演笑裡藏刀的陰險角色！鍾欣凌說，「真的不容易，就像我以前一直

  很希望，有個使壞的角色，可是我這次抽菸抽到肺好痛，也想跟大家喊話，大家慢慢來，

  因為我媽媽也不知道我抽菸。」


  直呼耍壞真是不容易，從代班醫學節目主持、演舞台劇還為電影配音，這回又以討債公司

  邪惡「大姊頭」，挑戰演藝生涯新紀錄。


  （民視新聞／黃郁涵、陳冠達、莊柏驊 台北報導）


  新聞網址：


  ===========

  難得看許瑋甯演這種角色，那厭世臉意外很吸引人XD

  邱澤造型倒還好，大概之前看過類似的沒啥感覺

  鍾欣凌滿有反派潛力的，感覺可以多試試


  --'
