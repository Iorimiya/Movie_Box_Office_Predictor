url: https://www.ptt.cc/bbs/movie/M.1618636444.A.A33.html
title: '[普雷] 當男人戀愛時'
content: "雷文防雷資訊頁\n\n\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\
  簡述三點\n\n\n1. 片名就錯了，阿成根本不是男人\n\n   本來以為會看到阿成，在故事的起承轉合中\n\n   有何從男孩變成男人的成長，進而引起觀眾共鳴\n\
  \n   但從頭到尾只看到樣板式的痞子主角，就這樣痞了女主角，痞了一輩子\n\n   然後就，沒了，問號問號\n\n   不過邱澤演技很好，台語也滿溜的\n\n\
  \n2. 許瑋甯不適合演這種苦命女主角，光長相就不適合\n\n   雖然導演把許的臉弄的瘦骨嶙峋有稜有角，但許的臉看起來還是太好命了\n\n   更不用說氣質方面也不適合，演這種苦命角色就是怪怪的，台語也卡卡\n\
  \n   換個柯佳嬿或那個誰眼演，可能還比較適合\n\n\n3. 編劇問題很大，就算這是70-80年代為背景的故事\n\n   也不該把每個人物寫得如此樣板化且扁平\n\
  \n   男主角痞了一輩子，女主角苦了一輩子，裡面的閩南人每天都在錢來錢去\n\n   你要跟我說這樣的劇情，是當時底層社會的常有遭遇，甚至到現代也是，OK\n\
  \n   但你把這樣的劇情呈現出來，要探討什麼，或是更淺層點，要刻劃什麼\n\n   我在劇裡面看到編導者放入這個背景，但卻看不到編導有給任何反思\n\n  \
  \ 那這樣只會變成各種刻板印象的再製而已，只呈現了編導本身的視角盲點\n\n\n   最後跟我自己的出身背景比較有關係\n\n   我跟我女朋友都不是閩南人，看了沒有代入感\n\
  \n　 我知道對錢的重視，是閩南人的重要文化之一，這點在本片也表現的淋漓盡致\n\n   但閩南人真的有嗜錢如命到這種地步嗎，還是這也是編導的刻板印象\n\n\
  --"
