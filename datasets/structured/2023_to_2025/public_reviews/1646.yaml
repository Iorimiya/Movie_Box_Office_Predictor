url: https://www.ptt.cc/bbs/movie/M.1618135232.A.261.html
title: '[好雷]《當男人戀愛時》《聽見歌再唱》 '
content: '原文>>>




  這陣子看到兩部電影特別想推薦，原因是好久沒看到如此「真誠」的國片，而這個真誠來

  自於角色的討人歡喜、劇情的平易近人，以及最重要的，將台灣文化美好的那一面展現出

  來。



  （以下提及些微劇情）







  《當男人戀愛時》



  討債大哥和苦命女孩的契約愛情並不是什麼新招，但如此平凡的劇情要如何拍得不平凡，

  讓人感動到眼淚直流，在這部片中的功臣是角色的塑造。在新聞和社會事件的渲染之下，

  地方混混或黑道給人的觀感並不是很好，雖然像《角頭》或《艋舺》點出義氣、勇氣、敢

  愛敢恨才是這群人的優點，但最後結局還是導向「歹路不通走」，又再次加深了負面形象

  。如何讓所有人愛上一個理當不討喜的角色，最後靠的是「真誠」。邱澤飾演的阿成有愛

  家、善良、直率、為愛走天涯的台灣好女婿特質，雖然從事的行業並不正派，但還是很難

  讓人討厭他。他不怕自己的脆弱攤在外頭給大家看，甚至必要時不惜把自己弄得頭破血流

  ，只為了展現出自己的真心，我想觀眾大部分的眼淚，都獻給他的真誠了吧。



  「我愛你欸！」



  當阿成在保齡球館載歌載舞時，浩婷怒斥在旁邊否定阿成的吃瓜民眾，這一幕成了這部電

  影中我最感動的一刻。自己愛上了就是愛，在愛人眼中才不管別人怎麼看，這樣的義無反

  顧讓人感受到，愛情你比我想的閣較偉大。然而我們花了一部電影、浩婷花了幾個月的時

  間，才愛上在日常生活我們不會去接近的人，那在現實生活中，你願意花時間去了解平常

  不會接觸的人嗎？如果我們能喜歡這樣的電影，那是不是也能相信自己能包容不同文化的

  人呢？雖說是韓國電影改編，但導演殷振豪將電影完全本土化，角色、台詞、場景、甚至

  主題曲，都相當接地氣的呈現出來，將台灣文化融入得相當好，導演和劇組大概也都像阿

  成一樣，就算弄得頭破血流，也想讓自己的真誠被肯定吧。





  《聽見歌再唱》



  如果說台客文化對你來說有點距離，那原住民文化可能就又離得更遠了，但原住民是在台

  灣生活最久的人，所以要說這部是近期最貼近台灣文化的電影，可是一點都不為過。原住

  民的生活簡單純樸，知足常樂，加上大部分角色都是孩童，整部片瀰漫著天真無邪的氣息

  ，照理來說這樣的電影會有不少尷尬，但《聽見歌再唱》的功力就展現在，看到最後你會

  覺得這不是尷尬，而是真誠，會讓你相信純真的存在。《聽見歌再唱》的劇情相當簡單，

  就是原住民學生參加歌唱比賽的勵志故事，當音樂響起、餘音繞梁的合唱聲出現，就算他

  們唱的是布農族語，你也很難不被感動，音樂的力量在這部片中就是如此強大的存在。



  「布農族唱歌，音或許會不準，但是會有一起不準的好聽。」



  除了孩童們天真，馬志翔飾演的方雅各也是個大小孩，雖然有老師的威嚴，但舉止卻沒有

  大人的世故，和從平地來的老師們完全不同，讓我們看到不只小孩在奮鬥，老師也是在尋

  找突破。而在這麼單純的氛圍之下，如何維持這些正向的存在，教育就成了這部片的重點

  。教育造就了老師，老師成就了學生，如果是好教育就會是正向輪迴，如果是壞教育則會

  成為惡性循環。電影中雖有壞教育的影子，但卻不讓它萌生惡果，並用方雅各這角色做了

  逆向突破，看著孩子們的微笑，就可以知道教育有多重要。另外最感動的是整個社區為了

  孩子們，從反對轉為支持合唱，眾人的團結成了電影中最亮眼的美好，可以感受到導演用

  很真誠的角度拍出真誠的故事，看完是會有一股暖意在心頭的舒服。



  這邊先預言以上兩部電影的男主角，邱澤和馬志翔，都會入圍金馬獎最佳男主角！



  IG>>>


  --'
