url: https://www.ptt.cc/bbs/movie/M.1617199461.A.411.html
title: '[好雷] 當男人戀愛時-這部要破億 實在很容易'
content: '因為導演是拍音樂錄影帶出身

  所以之前就有查過他的資料

  知道他的作品都特別帶有歹丸的本土味道

  因此看到預告的時候

  對畫面的期待比對劇情的期待還要高

  那昨天看完之後是覺得...

  劇情好棒...

  整部看完找不太到改編的影子

  差點以為是歹丸原著電影作品






  （以下有雷）

  入場的時候還附贈衛生紙

  我想說是在自以為什麽（誤

  上次送我衛生紙的電影是花椒之味

  但我沒有哭 所以我超期待這部會不會哭


  加上看到不少心得都說很感人

  我想說根據看韓版的心得

  就大概是男主角死掉的時候會最難過吧

  不過我應該沒什麼感覺

  還是認為自己用不到那包衛生紙


  無奈我少算了一個可能性

  就是導演與茄子蛋的關係

  再衍生至導演與蔡振南...

  蔡振南真的很好哭

  他就算演酒鬼我也都買單 何況是失智？？

  總之這部真的猜得的會演什麼

  但就是好看


  然後這卡司都很厲害

  感覺導演人緣很好

  除了LULU以外都是職業演員

  還是有品質保證的那種

  討債大姐 大哥 大嫂 姪女 甚至警察伯伯

  都有金鐘得獎或入圍

  就別說三金蔡振南了

  打到這邊也有可能是導演有錢所以請得到


  （說到這個大嫂最近有拍愛殺也滿好看的，造型跟這部真的是完全兩個人）


  心得好像沒什麼參考價值

  但就想說大家如果處於猶豫階段

  就不要想了 去看看吧

  應該不會覺得浪費錢

  這或許是下一部會破億的國片



  --'
