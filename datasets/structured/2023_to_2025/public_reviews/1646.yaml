title: '[討論] 當男人戀愛時--鍾欣凌所演的腳色蔡姐'
content: "小弟今天去看了電影，然後回到版上看文\n小弟文筆不好就不評論電影內容了\n針對有些朋友發文或推文提到一點\n看到鍾欣凌會有刻板印象，認為平常螢幕上很和氣的粉紅豬演蔡姐這種老大很怪\n\
  小弟卻是覺得蔡姐這種人設與造型一點也不怪\n甚至懷疑蔡姐的造型是彰化縣長王惠美的造型\n\n不知道這是不是台灣的政治人物的標準模板\n那個拿一個便當給阿成這點也是超熟悉，\n\
  本片是改編作品，感覺本土化這點做得不錯。\n小弟是彰化人，認得的縣市長或是政治人物不多\n總之我覺得蔡姐的造型很熟悉，一看就感覺真有其人的感覺，\n想問版友也有類似的感覺嗎？\n\
  \n--\n \n\n\n \n\n  04/16 20:49"
