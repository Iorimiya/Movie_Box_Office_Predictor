url: https://www.ptt.cc/bbs/movie/M.1631679561.A.D51.html
title: '[討論] 當男人戀愛時兩個問題'
content: '話說本大媽住國外的關係，最近終於在

  Netflix把心心念念的當男人戀愛時看完了

  而且還看了兩次（兩次都哭爆）虐QQ


  防雷（應該也不用防了吧...）





















  就場景有兩個地方我不懂的是，

  一個是男女主角在果汁店前面，

  阿成把畫好的格子紙遞出去，

  女主角不爽把果汁淋他頭上，


  那張紙位置怎麼看就一定報銷的阿？？？

  之後潔白無比回來真的超詭異的

  （我太認真了嗎）


  第二個景是後期阿成在餐廳外面看女主相親，然後昏倒被送進醫院，

  女主發現他不見跑出去追，

  中間怎麼會繞去警察局聽阿杯在那邊解釋？超奇怪的阿？我是不是漏了什麼


  有請知道的網友解答~謝謝


  -----

  Sent from JPTT on my Google Pixel 4a.


  --

  是厚，一個bug

  原來如此！衣服一樣就說的通了，謝謝泥~'
