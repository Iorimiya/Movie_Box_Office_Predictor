url: https://www.ptt.cc/bbs/movie/M.1616864655.A.CD3.html
title: '[好雷] 《當男人戀愛時》'
content: '當男人戀愛時：當代的復古性



  記得裡邱澤在《誰先愛上他》中那個在數學題目裡說出愛你一萬年的眷戀，深深的打動了

  無數人，在他即便被打斷了腿仍舊搭著計程車趕著演出的鏡頭，和《當男人戀愛時》裡他

  欣喜帶著喜悅要趕往示愛的表情一樣匆忙；記得許瑋甯在《紅衣小女孩二》裡擁抱由魔神

  仔虛幻變身的舊情人，擁抱著他依舊得狠下心放下逼出鬼怪的悲傷淚水，和《當男人戀愛

  時》她抱著那久久不見歸來的男人，要求他回家的表情一樣深情，卻是充滿哀傷後喜悅的

  掙脫。



  我想起了約翰伯格在《觀看的方式》裡頭的一句話：「本質上，廣告是鄉愁懷舊的，它必

  須把過去賣給未來。」當然，這是一個充滿商業與資本主義的事情，我們在視覺表現裡使

  得人們回憶起某種欲望：攸關乎過去－此刻－未來，連接起一種當下消費行為的動力，產

  生的當下。



  在《當男人戀愛時》的風格裡，我看見了一種臺灣式的「當代性復古」。復古是一種往往

  會在每一個世代不斷滲透到流行文化當中，我們會因為某些潮流思念起過去，經過改造和

  翻新，適當的應對當代，在這樣的復古有時候甚至是一種未來進行式，去引領著某種

  前衛。電影設定在2014年的當代，俐落臺語、寬鬆的花襯衫、電子合成器塑造的配樂、往

  後梳到底的油頭刻意挑出一條髮絲，那樣的耍帥。如同電影的標題「當男人戀愛時」，主

  角即是由邱澤飾演的討債公司混混男人，這是關於他這一生所戀愛的故事，如何去戀愛一

  個女孩、何以做出這樣的抉擇浪子回頭，通俗愛情與充滿了瘋狂喜劇類型（screwball co

  medy）是這部電影的基本，延伸的卻是溫情裡的臺式幽默、抒情表現的故事。



  不打不相識的邱澤和許瑋甯，在電影的前半部以半推半請的方式進行了場偶像劇愛情般的

  追求。在討債公司上班的混混，看似放蕩不羈，名片上的「互助會」實際上指的是放高利

  貸的地下錢莊，但在邱澤偏頗且柔軟的行為裡變成了一種名副其實的「互助」。他會為了

  不知是謊言還是藉口的生病，願意為債權人緩和期限、也會為了街上安寧的生活大打出手

  抱不平。這樣角色的定位本身即有著十分諷刺又衝突的身份，明明是個討債人，為什麼對

  人們這麼好呢？



  這個問題再遇見了許瑋甯所飾演的女專員後出現著轉轍：他第一眼就愛上了她，天雷勾動

  地火般的愛上了，無需理由且竭盡所能的想表達出「愛」是什麼。然而，這名照顧著久病

  父親、冷漠且對債務無所辦法的女人，根本對眼前男人的威脅毫無恐懼，儘管是那樣糾纏

  、跟蹤或是說了一大堆該如何處置的辦法，最終都被潑了冷水，是真的被一杯冰涼的冰沙

  撥下去般的冷水。邱澤終於知道了，戀愛是無法用力量討來的。即便他有錢，可以買到性

  、或是把餐桌上的小菜點滿，動手就威震小弟們，但戀愛並非如此單純。



  〔我想買你愛我，今晚〕正是電影裡第一次轉折的對白，他深深發自內心的願意去說聲對

  不起，無怨無悔的不再只是用那簡單的性、愛與金錢去衡量關於我愛你的事情。即便是那

  樣輕易的可以說出「我愛你」，但背後影響且深具意義的問題，並非如此簡單。從古自今

  ，關於愛重要的意義從來不曾改變，無論在復古的風格裡，還是瘋狂喜劇，通俗的愛情故

  事中，雋永且相知相惜沒有的愛總是一種最難仍可貴的事。



  《當男人戀愛時》即是利用了「戀愛」這回事小題大作，關於家庭與共生的意義，或是復

  古中亙古不變的情意。社會邊緣地帶中混混生存方式的浪子回頭，你希望成為一名安穩的

  人，卻無法如此順遂；你終於獲得了愛人的認可，卻發現自己失敗的配不上她。所有關於

  最俗爛戀愛過程中的追求、曖昧、死纏爛打，情歌與示愛，都在邱澤所飾演的男人裡渾然

  天成的展現了出來。



  浪子回頭金不換，或許我們仍舊用了一種極具有家庭核心的概念招喚人們。逝去的親人終

  究希望你有個伴可以相互照顧，而犯了罪過的人願意彌補自己的錯誤改過自新，一切都是

  為了那些自始至終希望能愛的人。這部電影裡有個關鍵的問題即是，在當代的社會景觀中

  ，我們仍舊用了邱澤這樣一名十分道地且帶著隨意、敢愛就愛的男人作為主角的視角，去

  追隨關於復古和亙古不變的戀愛關係為何。



  我們可以在電影裡看見許多邱澤和許瑋甯的火花，關於如同偶像劇般激昂的浪漫；也有許

  多遺憾與悲傷後殘留的淚水。這樣一個風格化的喜劇與愛情電影，轉移到了後段承接轉折

  的時候，正代表了某種絢麗奪目的臺式風格裡，根本俗濫浪漫到底的瘋狂喜劇。歸功於作

  為男主角的邱澤的演出完成度高，或許該是再次為入圍金馬的準備了，就像是渾然天成的

  融入了這個男人，他頂著髮根燙造型的俗味、改變在油頭整理後歌唱的毫無羞恥度，愛是

  愛、堅持是堅持，幽默是浪漫都是他臺味與自身散發出的魅力。



  當然，這是一部臺灣味十足的電影而非廣告，搭配上了茄子蛋原先以臺語創作的風格曲調

  的音樂，我仍然想以懷舊復古的當代性去召喚闡述一種我們深刻體會到雋永的事情。那就

  是：〔我愛你啦。〕




  --

  謝謝！'
