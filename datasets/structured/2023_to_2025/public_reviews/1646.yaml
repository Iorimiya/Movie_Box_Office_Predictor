url: https://www.ptt.cc/bbs/movie/M.1619499661.A.9F3.html
title: 'Re: [負雷] 《當男人戀愛時》茄子蛋寫了茄子蛋的歌'
content: '你今天講茄子蛋 我跟你講茄子蛋


  我接受你不喜歡電影配樂，

  不過我持另一方的想法給你聽


  茄子蛋的編曲、吉他處理在國內算很細膩的團


  歌詞部分則偏向描述中下階層的甘草人物

  所以這次BGM「理論上」會渾然天成

  而對我來說它的確做到了


  音量過大是為了忠實呈現，呈現在保齡球館/Disco廳裡那種中頻推到底的破爛廣播，給觀

  眾更身歷其境的感覺

  聽不到環境音即是身在這種破廣播開滿會有的情況（但即便如此，你還是可以聽到電影中

  隔壁球道球瓶倒、隔壁女生碎嘴的聲音）


  至於吉他solo的boost開太大、整首歌太有特色，我覺得是為了呼應男主角那種流氓Alpha

  男的個性，

  那種不在乎旁人、跳舞擺手不對點、凡事我說了算的個性，跟當下的BGM十分呼應



  說我腦粉護航也是可以啦

  但根據我聽到的 我相信茄子蛋在電影裡的配樂都是精心設計過的



  補姆咪點：

  雖然我沒有很喜歡當男人戀愛時這種灑狗血、8+9拿刀互砍的元素




  破3億代表 癡情壞男人類型的電影還是有很多受眾

  也許在我們嘴砲它不如普拉斯、不如孤味之餘，還是尊重多元族群的需求吧


  --'
