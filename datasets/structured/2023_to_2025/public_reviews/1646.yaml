title: '[討論] 不標準情人當男人戀愛時比較?'
content: '當男人戀愛是翻拍

  韓國電影2014年的不標準情人

  若只看台版 當男人戀愛時

  是值得給個好評的

  但若看過韓版 在看台版翻拍

  那當男人戀愛就只能說普普了


  只能說台版翻拍劇情大鋼

  角色對白也照韓版搬過來

  某些情節對白跟韓版幾乎一模一樣

  換句話說台版就是複製感動而已


  劇情流暢度是台版處理比較好一點

  但韓版也把一些細節演的更好一點


  我始終認為雖然是翻拍

  但還是要走出自己的路

  韓版曾翻拍台版命中注定我愛你

  但韓版卻翻拍出走自己的路

  命中注定我愛你就翻拍的很成功



  --

  韓版也有韓國元素啊！

  所以差異只有韓國和台灣?'
