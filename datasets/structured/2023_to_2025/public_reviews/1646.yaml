title: '[無雷] 當男人戀愛時'
content: '花170在台中書店買的團體票

  在全台中最便宜的首輪「親親戲院」

  本來以為會在新裝潢好的豪華大廳看

  沒想到買了2樓的票，2樓的廳竟然跟B1一樣爛

  看來以後去親親只能買3樓大廳的票了

  還好我是一個人去看，如果帶閃光去看

  下次她一定聽到親親戲院就打死不看


  不過看小成本的國片在這種爛廳看也蠻合適的

  雖然沒有海角優美的音樂跟風景，然後又是+9片

  但聳勾無爛的在地文化在像二輪的舊電影院看剛好

  本來想去二輪萬代福看50元的末場，但票房無法擋


  我一個在花蓮開火車的朋友，為了舒壓放假都在看國片

  這片他就看了7遍，消失也看了7遍，刻在他看了49遍

  真不知道是花蓮太熱了家裡沒冷氣去電影院睡覺還是怎樣

  他都在秀泰看270的首輪，主攻台灣愛情片，死不看角頭

  難怪這些片會破億都是因為有他這種公務員瘋狂挺愛情片

  可見當台鐵公務員開火車的壓力有多大，趁活著多看好片


  看完這片覺得女主角好美，男主角好帥

  反派蔡姐跟小弟真的壞到爆，新導演前途無量

  程偉豪自己拍的片不怎麼樣，沒想到當監製就大賣

  感覺真正的監製是程大導演背後的那個女人

  名字老是記不住，但站台時真的蠻漂亮的

  還以為是角頭前傳裡面的那個黑二代女議員

  程大導演要能娶到她，電影事業可以邁向月球了


  程大監製有了好的2～3億票房賢內助

  就像鍾大導有了葉大監製一樣如虎添翼

  期待下一部會有更好的成績，早日超越海角鬼滅

  從臥虎藏龍、雙瞳、不能說的秘密、海角、那些年、少女

  角頭、消失、孤味到這部當男人，感覺都是新新電影時代

  藝術跟商業的完美結合，又好看又拿獎又賺錢，叫好叫座


  之前很不喜歡程大導的片，竟然把李安的兒子

  拍的比鄭捷還變態，後面鬼片一部比一部變態

  所以對許瑋甯在電影圈就沒什麼信心

  只覺得她在偶像劇麻醉風暴很美

  沒想到一直跟著程大導終於要當億萬影后出頭天啦

  程大導捧不紅她，反而讓背後的女人跟下面的導演給捧紅了

  不只紅了許瑋甯，連邱澤、反派鍾欣凌都在電影圈爆紅大紫


  總之現在台片新導演輩出

  越來越多高手浮出檯面

  孤味的許承傑、廖桑

  角頭系列的姜瑞智、顏正國

  怪胎的廖明毅

  叱咤風雲的陳奕先

  當男人的殷振豪、金百倫

  鍾孟宏的張耀升、黃信堯

  刻在的柳廣輝、李屏賓接班人大攝影師小姚


  看來國片新人輩出，大師們可能都要退休當神了吧

  有李安接侯導的棒子掌金馬，大導演久久沒拍片

  積了很久之後隨便拍部片給好萊塢解饞

  可能就像侯導聶隱娘一樣隨便拍都拿獎

  到時候可能在台灣隨便拍部國片

  好萊塢都能給他奧斯卡最佳影片

  以紀念他為全球電影做出的貢獻


  回到當男人，這是國片最好的時代

  因為李安所以可以最靠近奧斯卡的年代

  他會像奉俊昊一樣是個跳板，把這些很棒的新導演

  全部都送上國際當大導演，這樣全台新導演都是安的全人


  PS

  而且這片學比悲傷更悲傷跟韓國買劇本

  不知道怎麼跟韓國拆帳，是全球票房要給他們一半嗎？

  還是幾百萬就買斷了，這片的原版好像票房不是很好

  可能是原版男女主角都是演技派而不是偶像派的關係

  就是黃正民流氓樣不夠帥，女主角不夠有名不夠美

  邱澤夠帥又是影帝，許瑋甯夠美也夠有名就大賣了

  這是個小品而已，沒想到韓國狗血淋頭的絕症劇情

  在台灣再次賣到爆，就像韓劇一樣的瓊瑤又周遊


  PS2

  這片我個人覺得唯一的敗筆就是保齡球店

  裡面許瑋甯嗆隔壁的人蝦款很做作不自然

  感覺像好女孩被流氓帶壞的感覺

  斯德哥爾摩症候群



  -----

  Sent from JPTT on my iPad


  --

  肺腑之言

  感謝，已修改

  柳導演拍的比瞿大監製好看，至少有電影感

  就像這部也是導演拍的比監製賣錢，至少不變態'
