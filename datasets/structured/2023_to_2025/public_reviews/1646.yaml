url: https://www.ptt.cc/bbs/movie/M.1617370788.A.AB1.html
title: '[好雷] 當男人戀愛時'
content: '當男人戀愛時-電影心得


  這就是很俗濫的愛情電影，典型的小姐與流氓，最後流氓掛掉，小姐徒留傷悲的愛情悲

  劇。


  劇情很老套，但演員演技不錯，邱澤現在的演技跟以往比起來有很大的進步，令人驚豔；

  鍾欣凌對於角色的駕馭也很棒，之前很久沒看她演戲，沒想到這次的表現讓我覺得她超強

  的；其他的演員表現也不錯，總之這部戲我覺得演員方面都很好。


  其中的亮點是它裡面有配合茄子蛋的歌，其中一首是新曲「愛情你比我想的閣較偉大」，

  這首蠻嗨的；另一首是「日常」，很搭配劇情，因此我蠻喜歡的。


  ------------------------------以下心得---------------------------------------



  以結局來說我認為，這是必然且最好的結局。


  為何這麼說呢？因為如果兩人都活著，會發生什麼事？


  兩人的價值觀、生活方式從根本上就不同，一個大學畢業的良家婦女，與一個靠討債維生

  的社會低層，他們的生活型態其實根本不太會有交集的，如果兩人繼續相處，那就不是愛

  ，而是生活。

  生活中的相處，久而久之會讓他們因價值觀產生摩擦，例如朝九晚五的生活作息與討債的

  不規律作息；上班的固定薪資與隨意揮霍的過手金錢；午晚餐的便當與路邊攤的飲酒黑白

  切…，他們的生活中並無交集，若是長久相處，必定只剩爭吵或妥協，走向分離也是必然

  的事。


  而我會什麼說這是最好的結局呢？


  因為我認為他們倆之間根本不是愛情。


  根據慕強理論，女性在擇偶時喜歡上較強的異性。這裡的［強］不一定是金錢，而是在女

  性身處的環境中，能夠有效處理事務的能力、或是能讓她崇拜的技藝。

  例如女主角一開始對於男主角的追求根本無動於衷，就算被債務壓迫、被要求陪吃飯免除

  債務，也只是心不甘情不願地陪對方吃飯，直到女主角父親去世，失去了心靈依靠又負擔

  大量的債務，讓她的心理壓力增加到最大。


  此時男主角幫她置辦靈堂、找人祭拜、處理喪事、以家屬身分協助，在女主角看起來，就

  是要錢有錢、要人有人、有事還能擺平，讓她的內心有所依靠，滿足了她的需求，正好符

  合了所謂的［強］的概念。


  而根據吊橋理論，人在無助或恐懼時，對於身邊的人會產生心跳加速的反應，容易被自身

  解讀為愛情。


  因此在女主角父親喪禮過後，兩人感情急速升溫，也不足為奇了。


  在女主角被危機壓垮之前，無論男主角做什麼，例如送飲料、搞笑、搭訕、請吃飯…，都

  不會被接受，原因就在於女主角不認為男主角是［強］的一方，兩人也並不般配。但是若

  經歷危機、而危機被男主角擺平，女方就會迅速的喜歡上男方，以往的行為也被解讀為甜

  蜜，而自我增強。


  很多小說漫畫電影也有類似情節，某個財團千金、知性學者被另一個與她生活完全不相干

  的異性吸引，之後墜入愛河，就是因為遇上了自己的能力無法解決的事情，而對方卻能輕

  易解決，因此被吸引而戀愛。這些故事的背後，就是慕強理論。


  所以為何市面上的故事不是小姐愛流氓、就是灰姑娘愛王子，其實只是這些女性喜歡上了

  ［有能力解決問題］的男性，如此而已。


  而不得不說男主角的出手時機也是不錯，一開始只是找債，並沒有理由幫助對方，使對方

  陷入危機與絕望之中，等到對方壓力大到極限後，再一舉幫助她，使好感度飆高，這時當

  然手到擒來。

  因此出手時機才是最重要的，如果這時有個斯文帥氣的小開也做同樣的事，相信女主角也

  會傾心於他，而且速度更快。


  所以這是愛嗎？我不認同。


  因此我說這樣的結局是最好的，否則男方若活了下來，他們兩人未來的生活，才會是真正

  的悲劇。


  但是男主角死了，對於女方來講真的好嗎？這倒也不一定。


  因為男主角死了，男方家人悲傷（雖然我覺得活該），而女方未來的日子該怎麼過？

  心裡一直記掛著男主角，也被男方家人當成未亡人對待，然後一輩子這樣悲傷痛苦地活著

  ？

  如果之後有新對象結婚，心裡一定還有男主角的影子存在，而活人是爭不過死人的，那些

  心底的印象會長時間留存。跟未來丈夫相處時，她知道心裡永遠有個最愛的人；而未來丈

  夫若是知道了，情何以堪？

  除非結婚雙方都各自有個最愛的人，兩人知道彼此都不是最愛，而是目前［最適合］的人

  ，否則兩人的關係永遠都不會是親密的愛人，而只是相互依存著的家人。


  所以，除非這兩人不要相見，否則注定是悲劇。


  --'
