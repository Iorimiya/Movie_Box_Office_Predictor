title: '[新聞] 《當男人戀愛時》口碑爆棚！ 邱澤台客'
content: '《當男人戀愛時》口碑爆棚！ 邱澤台客加持飆北市票房逾300萬


  李郁涵 何佳陽2021年4月2日 週五 下午7:05




  圖／翻攝自《當男人戀愛時》臉書


  電影《當男人戀愛時》1日上映第一天，加上三天的口碑場，台北市票房就已經衝到328萬

  ，更被看好成為下一部的破億票房國片。


  男女主角邱澤與許瑋甯，電影造型跟以往形象反差很大，接地氣的角色，也成為電影亮點

  之一。


  電影《當男人戀愛時》：「沒啦，那個廟口的他孩子生病啦，另外一家呢，那個他阿嬤生

  病。」


  飾演討債流氓的邱澤，在一次討債過程中認識了許瑋甯，兩人意外擦出愛的火花，電影《

  當男人戀愛時》改編自韓國賣座電影，1日上映加上三天的口碑場，台北市單日票房衝到3

  28萬，登上了國片新片票房冠軍。


  藝人邱澤：「元氣是不好的，是元氣啦。」


  為了更貼切的詮釋台客形象，邱澤私下勤學台語，造型也燙起誇張爆炸頭，自己還特別加

  戲，邊討債邊啃甘蔗超有哏，也讓角色更接地氣。


  導演殷振豪：「吃檳榔這件事情對阿成來說，是非常不瞎趴的，拿甘蔗這樣邊啃邊扔，這

  樣才夠帥啊。」


  連導演殷振豪，對他的敬業表現都讚嘆不已，至於女主角許瑋甯，片中飾演農會職員，幾

  乎素顏拍戲。


  藝人許瑋甯：「嗨大家好，我是瑞山之花，專員吳浩婷，常常有時候會在這邊遇到一些很

  奇怪的客人，一些變態奧客，或是拿一推一百張號碼牌的，很奇怪的人。」


  平時給人氣質優雅的許瑋甯為了符合小鎮姑娘角色，，還刻意曬黑，造型刻意搭配袖套與

  鯊魚夾，相當有反差感，但片中個性屬於不苟言笑，還常被邱澤逗笑。


  藝人許瑋甯：「我沒有拍過一部戲這麼常笑場。」


  拍攝花絮：「真的要說嗎，導演啊。」


  邱澤的即興發揮，常常惹得許瑋甯笑場，更被看好能入圍金馬獎影帝，韓國電影被翻拍成

  台味十足的愛情喜劇片，也看見年輕導演的功力與野心。


  新聞網址：




  --'
