url: https://www.ptt.cc/bbs/movie/M.1617802401.A.B49.html
title: '[新聞] 《當男人戀愛時》破億倒數！當日票房破千'
content: '《當男人戀愛時》破億倒數！當日票房破千萬　打下《哥吉拉》奪冠


  記者蕭采薇／台北報導


  台式新浪漫愛情電影《當男人戀愛時》，集結金邱澤與許瑋甯的高顏值CP組合，上映以來

  討論不斷。連假期間全台衝出5800萬票房的好成績，6日單日票房更是突破1000萬，超過

  早一週上映的好萊塢大片《哥吉拉大戰金剛》，極可能成為今年第一部破億票房國片。


  為了答謝觀眾，正在拍攝新作品的邱澤，也特地空一下天，在4月8日現身戲院會影迷。有

  粉絲興奮地說：「太開心，刷到第四刷，終於要看到阿成本人了。」除了演員出席的加成

  外，平日單日就有千萬票房進帳，目前已累積至7000萬票房，若無意外最晚本週末，《當

  》片就會成為今年度第一部破億票房的國片。


  《當男人戀愛時》演員和主創團隊從口碑場以來就勤跑戲院宣傳，有女性觀眾不顧男友在

  身旁、直接當面向邱澤示愛：「本來覺得你不是我的菜，看完電影覺得你真的很帥！」導

  演和演員更一起在戲院廳外偷聽觀眾反應，邱澤與許瑋甯更被網友封為「淚腺排毒最強CP

  」，導演殷振豪感謝的說：「希望大家看完《當男人戀愛時》後，更懂得如何向身邊珍惜

  的人表達自己的感情。」




  ETtoday星光雲 | ETtoday新聞雲



  --'
