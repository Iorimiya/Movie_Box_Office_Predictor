url: https://www.ptt.cc/bbs/movie/M.1618995613.A.28F.html
title: 'Re: [負雷] 當男人戀愛時-當8+9想幹炮時(文長)'
content: '一部電影票房破億 迴響熱烈有好評也會有負評是很正常的


  你這篇負評我看完來回應你 應該也沒什麼問題


  反正PO出來的文章就是可受公評的


  大家一起交流交流 如果有冒犯到的地方也請別太往心裡想去



  所以很顯然 看完這部電影 你沒被感動也沒有哭


  板上一堆"感動~" "想哭~"或許會讓你對這部電影的失望感觸更深吧


  反正你發負評文 這完全可以理解



  所以有沒有讓人哭 對這部電影很重要



  可惜了主演 被電影拖累



  所以是劇情內容的問題


  其實你三個論點可以合併成一個:劇本/人設太差 沒讓你想哭 大失敗



  不反對


  但都主打感動了 所以就是要把觀眾情緒帶起來啊...不然哩



  沒錯 狗血一波又一波


  就跟參考的韓國電影"不標準情人"一樣


  不過不這樣濫情片是要怎麼演 XDDD



  以悲情元素


  我覺得很多地方的心痛都會讓人感到"很致命"啊~


  家裡有長期債務追討經驗的人啊~


  家裡有失智長輩需要照顧的人啊~


  經歷過因為投機把未來(錢)全部賠光的人啊~


  經歷過伴侶在自己眼前死在病床上的人啊~


  還不少


  我相信有相關經歷的人 這部電影許多情節絕對悲得起來


  但沒打到你 也沒成功讓你同理/共鳴


  或許你的人生是較順遂的那一方的?



  這個很主觀


  尊重你的意見



  不反對


  放屁跟在頂樓脫褲子那邊我在電影院裏面也覺得尷尬


  很硬要



  流氓很明顯就是想要幹女主角


  在談交往契約時會在意"那個"的男主角 當然是想幹腿長又香香的女主角


  不然你以為在8+9的感情世界裡是如何?


  你可以覺得男主角低俗


  但他人設就是8+9流氓啊 會去半套店買春的那種


  對


  這部就是在講一個會買春的職業討債流氓想追/幹大學學歷公務員女主角的故事


  如果邱澤演出一個文質彬彬重道德的偶像劇白馬王子8+9


  那這部電影早就被罵翻了吧?



  而你說:當流氓的人要怎樣善良? 角色在為劇本服務


  這邊我就不認同了


  電影裡面 男主角有被大姐提到他之前也是因為哥哥生意失敗被討債


  為了還債 所以才來錢莊上班的


  因此電影裡面8+9男主角種種的"善良"行為在人設上應該判讀為"同理"行為


  真的經歷過那種家門口被潑漆 每天有混混上來問候家人的被討債人生


  安排他在電影裡面善待那些自己的催收對象 不實際 但在人設上是合理的


  因此這也是男主角性格上浪漫的地方



  大學學歷公務員正妹女主角不是沒人追喔


  電影有一段她跟同事被搭訕的橋段 有反應她感情市場條件上的優勢


  但也有一段


  大媽取巧給女主角自己兒子(還是孫子?)的照片 說要作媒


  結果女主角直接一句:我家裡負債 欠很多錢


  然後大媽直接變臉走人


  這一段其實已經很強調女主角單身至今的困境 以及為何她對感情不積極


  平心而論 真的有多少人能承受與一個家裡面被討債的人交往


  (而且還有一個吊著半條命的岳父躺病床上要負擔)


  能毫不猶豫覺得可以的我只想說有錢真好


  希望你的另一半不是"我不想努力了"的那種人



  承上面對女主角人設的回應


  要注意女主角電影裡第一次對男主角改觀 是在流氓照顧自己父親時


  兩人關係大加溫 感情飆起來 是在男主角主動自掏腰包張羅女主角父親的葬禮


  大學畢業的公務員正妹愛流氓嗎?


  很難想像


  但負債的女主角因為男主角主動承擔了自己人生的十字架而感動 打開心房?


  (原因當然也是因為對方尬意自己)


  這很合理吧?



  確實是在包觀眾席上那些有唸書的人問的 並且期待得到"像樣點"的回答


  但你為什麼要期待8+9男主角有辦法有"像樣點"的回答?



  這邊就是你自己對電影期待的投射了


  要裝一下回答的聰明一點才過你的關


  但這樣雖然浪漫 很偶像化 但完全不會比較"真摯"


  真正的真摯是男主角回答那些腿長 香香之類的屁話


  沒有拐彎抹角的在那邊裝文青讓觀眾出戲/自己出糗


  你對流氓男主角的回應不滿意 可以理解


  畢竟很低俗 一點有品味的高尚"情調"也沒有


  但 這就是邱澤演的那個沒文化流氓


  他已經盡自己所能做到最好了


  而女主角雖然傻眼 但她也不是不知道這款8+9是什麼料


  不然何必主動親他?


  你得有概念那時候男主角已經得到女主角的芳心了


  那個局面對男主角來說答什麼都是十拿九穩


  女主角之所以會問男主角為什麼喜歡自己


  只是正常人的好奇而已 卻已經不是考不考慮接受對方的階段



  當好人做好事連肥宅都會


  但並不是所有善良的肥宅都有辦法扛下正妹的家庭債務 以及一個累贅準岳父


  女主角縱使有對男主角討債暴力的誤解


  但後來得知真相時卻也只是其中一個感動點而已


  這部戲裡面感情方面的真正最高潮的


  是流氓躺在床上讓女主角掏耳多時 講得那番話


  流氓那段話已經超脫了:我愛你這個人


  而是我願意接納妳的人生


  這 才是8+9愛情故事的看點



  一個經濟其實也寬裕不到那裡去 前途茫茫的混混8+9


  願意為了女主角振作起來脫離黑社會 並且具體去實現伴侶夢想


  (一起找店面 籌資金)


  這才是 "當男人戀愛時" 這部電影要傳達的浪漫


  這種浪漫一點都不偶像味道


  而是充滿了人生滄桑的情調 以及高尚的人性情操



  只是無奈最後是悲劇就是了



  混混8+9確實不是龍傲天男主角


  說他廢物


  連最後拖小瓦斯桶去大姐總部時


  那於死網破的氣勢 最後講出來的話卻是:求求妳 拜託妳


  徹底展現出了小人物的卑微


  而你看不起男主角



  我尊重啦~


  反正總有達到你高標的男主角的電影能讓你寫好評



  所以你討厭這部電影什麼?答案是沒有


  只是因為沒文化沒水準又想幹砲的混混8+9追到了公務員正妹女主角


  不然負評就無法寫了



  看來這部電影又讓你厭世了一點


  憑什麼8+9也能吃女主角? 他不配 對吧?



  一切都要符合公設才正確?



  為何你看不出來


  這是天造地設的兩個天涯苦命人因為男主角的毅力促成牽絆的故事?


  只是最後男主角因為職業傷害而無法有好結局



  總結一下個人對電影的看法


  整部看下來 我沒哭過


  但我有看懂這部不是在演偶像談戀愛 而是在演海海的人生


  在社會現實之中


  仍然有著人性光輝的浪漫


  我不是8+9 但我覺裡面的8+9很可以




  以上觀點分享~


