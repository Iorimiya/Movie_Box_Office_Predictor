title: '[討論] 當男人戀愛時-女主角'
content: "昨天被女朋友拖去看這一部片 她本人已二刷\n\n不得不說 真的蠻好看的也很感人 韓國電影真的很厲害\n\n很多人說邱澤的演技很棒 查了邱澤的資料\
  \ 他念東方畢業\n\n應該本身就是8+9底 導演也說邱澤靈魂裡面就有一個阿成\n\n所以才可以演得那麼自然 渾然天成\n\n感覺邱澤入圍金馬沒問題\n\n\n\
  只是許瑋甯真的讓我有點出戲 記得他不是也演員出身嗎？\n\n怎麼演成這樣　有兩個部份讓我很出戲　\n\n一個是阿成失控跑去醫院時　發現浩婷默默地摺衣服\n\n\
  原來是浩婷爸過世了\n\n\n這點我覺得就算是久病床前無孝子 應該也要表現的失落一點\n\n這樣觀眾才有帶入感 否則情緒實在太僵硬了 觀眾容易出戲\n\n另外一點是阿成搞砸一切在小吃攤跟浩婷的對戲\n\
  \n我覺得許的情緒應該要多一點 阿成明明講了那麼傷人的話\n\n他卻還可以沒甚麼情緒的離開\n\n實在很好奇為什麼女主角沒有找陽靚？\n\n以他的演技應該可以發揮得很好\
  \ 而且不是跟導演合作很久了嗎\n\n有鄉民知道為什麼嗎？\n\n\n以上　純屬個人觀感 我給好雷\n\n\nPS.\n\n  忘了說 這部年代設定有點問題 阿成的腰間有BB\
  \ CALL\n\n  那個是邱澤學生時代會用的東西 大概民國85年左右\n\n  後來不應該出現智慧型手機 一點小細節\n\n\n--\n\"Das Leben\
  \ ist ein Born der Lust; aber wo das Gesindel mit trinkt,\n     da sind alle Brunnen\
  \ vergiftet.\"\n「生命是一口歡愉的井，然而一旦烏合之眾也過來取飲，所有的湧泉便中了毒。」\n\n－－尼采 ‧ 《查拉圖斯特拉如是說》\n\n--\n\
  \ 導演自己就說他靈魂裡面有一個阿成了 而且8+9沒有不好吧？為什麼是刻板印象=.=\n 哦哦抱歉 是我搞錯了 原來不是演員，是模特兒出身...\n悲傷過度就不會有心力摺衣服了，每個人情緒表達當然不一樣，但問題是多數人的反應\n\
  就不是像女角那樣默默的摺衣服，沒道理男朋友死了哭慘，老爸死了卻沒流眼淚吧？！\n 我沒看到設定年份欸，哪裡有出現2014？如果真的設定2014，那更不可能有\n\
  \ BB CALL存在 那時候智慧手機早就出來了，正要開始普及，或是用智障型手機\n 這種事大家都明白啊，所以不用大哭啊，但總是會默默地流眼淚吧\n 這不是7年級都知道的事嗎...."
