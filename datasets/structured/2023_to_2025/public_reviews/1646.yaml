url: https://www.ptt.cc/bbs/movie/M.1617799240.A.815.html
title: '[好雷] 當男人戀愛時 老梗的綜合新味'
content: '「老梗的綜合新味94棒。」







  身為台南人，《當男人戀愛時》就像波哥那杯萬年不敗的綜合新味，歷久彌新，儘管早就

  知道內容物組合，但還是會繼續為了那奇妙融合的滋味買單。從愛情到親情，從生離到死

  別，各種情感合理堆疊卻又不賣弄狗血，一網打盡進場觀眾的哭點笑點，就是要逼人掉下

  幾滴淚才准踏出影廳。



  我實在太喜歡阿成在保齡球館開唱那段，帥的又屁又中二，啥款，這就是咱查甫人的浪漫

  。茄子蛋+殷振豪的浪流連宇宙最佳組合不只幫阿成，也幫整部電影打造出了最光芒萬丈

  的時刻。《愛情你比我想的閣較偉大》在這段雖然不是邱澤親口開唱，但整首歌真的完全

  就是為了阿成量身打造。



  講到量身打造，也不得不提邱澤與許瑋甯完美扛起阿成與浩婷的角色。要能把阿成台的如

  此local又帥氣，除了邱澤一時似乎還真找不到第二人選，試想如果是黃鐙輝來演阿成的

  話，電影可能就是完全不一樣的走向了(?)。許瑋甯則是不笑時的高冷臭臉跟浩婷意外相

  當合拍，但卻又能從眼中滿是閃爍愛意的「啥款」，一路演到面對各種分離心痛的情感滿

  溢。


  整部電影如果非要挑個小毛病的話，我會說是在天台上吃冰的那場戲，明明是笑中帶甜的

  定情吻戲，我卻因為兩人手上的冰量一直隨著鏡頭切換變多變少大出戲，下次不要用這種

  會穿幫的食物啦！






  --'
