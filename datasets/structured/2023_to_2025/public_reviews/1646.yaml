url: https://www.ptt.cc/bbs/movie/M.1618131167.A.F85.html
title: '[討論] 當男人戀愛時的小疑惑'
content: '昨天晚上看完

  覺得還不錯看

  不過有幾個地方有點小疑問

  想跟大家討論討論



  1.阿成的討債方式


  開頭他就拿金爐敲自己的頭

  本來以為是類似捍衛任務那樣

  如果你幫助了敵人

  自己就要付出代價

  他可以拿受傷了回去當作沒有討到債的藉口

  但看來並不是這樣


  之後還有喝汽油什麼的


  他邊自殘邊討債是為什麼?


  讓債務人害怕?覺得他什麼都做得出來

  還是讓債務人同情他，多少拿出一些來還




  結果他也是因為常打架

  還會拿金爐敲自己頭所以腦部病變





  2.阿成好像蠻有錢的?


  他家欠蔡姐錢

  所以讓他邊工作邊還

  但從他資助茶妹、追浩婷的方式來看

  感覺他也蠻有錢的啊

  還可以用陪吃飯讓浩婷抵債，應該是阿成幫她還的吧







  3.殺豬仔


  這算是我最有疑問的部分

  是有聽過要金盆洗手沒那麼容易

  但當下蔡姐好像也沒刁難他

  是他自己覺得那些存款開店不上不下

  想再賺一些租更好的

  回去問蔡姐能不能讓他參加


  阿既然他在公司待過

  應該知道殺豬仔的活動要幹嘛吧

  怎麼不是跟其他小弟一樣當搶劫的打手

  而是變成客人參與賭局


  讓我有點搞不懂這段最想講的是

  當你曾經接觸過這行，就別想全身而退

  還是強調阿成的個性

  可憐之人必有可惡之處

  就算能過正常生活，還是想投機一步登天

  最後失足而亡





  然後那個蔡姐也是挺狠的

  阿成也算替自己賣過命

  殺那些豬都幾百萬

  幹嘛連十幾二十萬的阿成也設計


  後來參選議員，阿成來鬧

  妳也知道他是那種瘋子

  還他就好了

  偏要嘲諷他

  就算他是社會底層沒影響力

  但公開潑她髒水也夠影響選情了吧

  實在沒必要趕盡殺絕


  --'
