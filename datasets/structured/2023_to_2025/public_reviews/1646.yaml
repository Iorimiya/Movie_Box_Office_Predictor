title: 'Re: [討論] 當男人戀愛時──吵架的原因'
content: "因為她還弄不懂來龍去脈，\n只聽得阿成醉醺醺的話中提到──「錢都沒了，因為賭博」\n並且，比起錢，阿成滿身的傷與異樣的情緒，\n才是她更擔憂的，因此，我們回家說。\n\
  \n阿成：「是還要說什麼啦？我就是這種人啦！\n        是還要繼續什麼？難道要結婚喔？\n        頭殼壞去......(下略)」\n浩婷：「所以你沒有愛過我？」\n\
  阿成：「不然呢？......(下略)」\n浩婷：「不要再讓我看到你。」\n\n這裡原po可能有所誤會。\n\n浩婷不是真相信阿成絕情的話，\n也非懷疑阿成過去是否設局利用了她的感情，\n\
  這句話於當時情景，更像是在說──\n\n「你所謂對我的喜歡就只是這樣？」\n「就只是跟我約會、打保齡球、上床、幫我爸辦告別式？」\n\n浩婷是個長久寂寞、渴望愛情與安全感，卻又倔強的女人，\n\
  當她終於拋盔卸甲，讓一個男人住進心裡來，\n她要的、以為的愛情，不是只有這樣。\n\n在頂樓吃冰棒時，阿成隨口問浩婷，\n遠方兩棟施工中的住宅大廈她更喜歡哪一棟？\n\
  浩婷雖然吐槽「講得好像隨時可以住進去一樣」，\n她的目光卻很認真的在遠方流轉，彷彿帶著憧憬。\n阿成沒有發現，自顧自說著：\n「以後我每天陪妳來這看免錢的。」\n\
  \n對於一直想開的飲料店，\n從貸款、招牌、五金、店面到茶和牛奶的來源，\n浩婷規劃得清清楚楚，然後問了阿成：\n「欸，如果不討債，你想做什麼？」\n阿成只是有些心不在焉的回答：\n\
  「我哪知？做仙吧。」\n\n今年七月底金盞花大影業才曝光的「市場約會」片段中，\n兩人一邊吃甘蔗一邊經過了一對老來相伴的夫妻，\n妻子正細心餵著坐在輪椅上的丈夫，\n\
  這一幕讓浩婷略為慢下了腳步，回頭望了一下，\n阿成依然是一股腦的往前走，說著自己的話題。\n\n阿成很體貼，卻從來沒給過她安全感。\n\n所以，回到那句「所以你沒有愛過我」，\n\
  浩婷不是相信阿成的胡言亂語，\n而是在探求她要的答案，究竟和阿成給的是否一致。\n如果她心中至關重要的那些兩人共同的未來都不算數，\n對浩婷來說，這就不是愛，\n\
  而是阿成的浪漫遊戲，和她自己的一廂情願罷了。\n\n\n--"
