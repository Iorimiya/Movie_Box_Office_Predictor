url: https://www.ptt.cc/bbs/movie/M.1617640806.A.073.html
title: '[負雷] 當男人戀愛時 洗白8+9之作'
content: '因為看完哥吉拉了


  想說趁連假最後再看部電影收假


  想說電影版一片好雷


  雖然知道國片總有行銷預算


  但對現在國片一直洗白8+9感到難過


  1、劇情非常狗血八股 看不到一半就知道後面怎麼演 果然是韓劇改編


  2、8+9頭被打太多次所以得癌症是在抄襲我的少女時代？


  3、劇中年代不明 明明有聽到2014年 可是2014年沒人在燙玉米鬚了 連8+9也沒有 玉米鬚

  大概到2010年就絕種了好嗎 還要2014也幾乎沒保齡球館了...


  4、8+9都要死了...還叫自己老爸當女主角爸爸 是要人家守活寡一輩子？


  5、最重要的一點 近來國片如角頭等不斷洗白8+9 把8+9形塑成重情重義的好青年 可是你

  知我知8+9有87%從就學時期打架鬧事 未婚生子又不養造成一堆社會問題 對於近年國片藉

  著台灣價值洗白8+9感到難過 步出電影院發現現在年輕人都8+9化了 唉.....


  --'
