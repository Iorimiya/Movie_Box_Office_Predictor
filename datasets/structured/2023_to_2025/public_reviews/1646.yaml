url: https://www.ptt.cc/bbs/movie/M.1619476453.A.FDF.html
title: '[負雷] 《當男人戀愛時》茄子蛋寫了茄子蛋的歌'
content: "雷文防雷資訊頁\n\n\n\n在寫之前，我也不確定會不會寫到雷\n先防個雷比較保險\n\n\n\n來隨便說說一些不重要的事情防雷\n\n\n最近中了《大佛普拉斯》的毒\n\
  兩個禮拜內四刷，每次看每次哭\n這部得到金馬獎最佳電影配樂的作品\n在我心中得到了國片難得90分以上的高分，配樂我直接給超過一百分\n有可能是因為這樣的關係導致我不小心用偏高的標準來看其他電影配樂\n\
  \n\n\n以下完全沒有客觀想法，全部都是非常主觀的\n\n防雷結束\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n標題為什麼這樣下？\n\
  \n在電影中段時聽到主題曲disco音樂出現，然後主角準備開始跳舞\n\n接著而來的音樂讓我非常的出戲\n\n事先沒有聽過這首歌，在電影院內聽起來非常的突兀\n\
  \n風格跟電影沒有很合，主角擺手動作沒有對在拍點上\n\n音樂過於大聲，環境音直接消失，很像硬生生插進去的歌\n\n\n\n再來以編曲跟作詞來講，非常像茄子蛋的風格\n\
  \n但作為電影配樂像是太過凸顯個人風格\n\n所以才下了一個茄子蛋做了一首屬於茄子蛋的歌\n\n意思是我認為他做的不是電影的配樂。\n\n\n\n\n另外請茄子蛋作曲是也滿好理解的\n\
  \n茄子蛋寫過幾首有流氓情感的歌，獲得不少好評\n\n茄子蛋只要做他們自己，就可以應付電影的配樂了\n\n但就連是他們最拿手的部分，我都沒辦法滿意\n\n\n\n\
  另外，我不喜歡這首的吉他solo，混音混得太過大聲，背景沒有太多東西襯托\n他的riff我也覺得沒有到很好聽，但也沒有不好就是了\n\n就是一聽就知道是茄子蛋的solo，跟之前聽過的幾首的音色跟音階滿像的\n\
  \n\n副歌的和弦使用跟旋律有一點新奇，還不錯，但太過有特色壓過電影了\n\n難怪有人說當作看MV看這部電影，只是為了忽視這部電影的缺點而已\n\n\n但我不喜歡茄子蛋，所以掩蓋缺點我做不到\n\
  \n\n\n那其他的音樂部份我就沒有太多的意見，好像沒有像主題曲這麼突兀\n\n大部分都忘記了，如果上串流平台後我二刷再來寫好了\n\n硬要說的話就是我覺得太常見了\n\
  \n像是悲哀時候用弦樂/交響樂這種常見到不行的配樂\n\n\n\n在看了三遍(第四遍是今天刷的)大佛+之後\n這種不夠驚豔的配樂就被我否定了\n\n可能還有其他地方配樂我不滿意的，不過我忘了\n\
  而且我沒有二刷，也不想二刷，所以就不講了\n\n\n\n\n至於這部有很多地方讓我不滿意\n就讓我娓娓道來\n\n\n\n　　首先，我不喜歡狗血矯情片段，那令我很尷尬\n\
  \n\n    敘事手法我不喜歡，感覺像是畫面沒有呈現完整就把劇本塞進你嘴巴裡\n像是大媽聽到女主角欠錢就立刻跑走，我他媽的在電影院直接噗哧不小聲的：「幹沙小」\n\
  但有可能是導演刻意營造的笑點，總之我不喜歡\n\n很多時候角色形象還沒塑造完全，就被帶到下一段，感覺很唐突\n\n\n\n    運鏡跟剪輯方式我朋友表示沒有做得很好\n\
  我這部分沒有甚麼意見，不是我的專業\n\n不過有幾次剪輯有讓我出戲就是了\n平常看到讓我出戲的片段的感覺都沒有這部這麼讓人感覺拙劣\n但一樣有可能是導演想要刻意營造的\n\
  \n\n\n    笑點過於低級，一堆感覺刻意營造的笑點，內容卻完全不好笑\n像是中二生才會笑出來的笑點，很多都跟性器有關\n這部分真的是無聊到令人生氣\n\n\
  但中間有一個梗我覺得超好笑，但全場聽起來只有我笑出來(= =)，我已經忘記了\n\n\n\n\n        再提醒一次，我完全是主觀看法，一定會有人跟我不一樣，但我就是不喜歡\n\
  \n\n\n    劇情的起伏\n這個...這種劇情不難想像就是男主角改邪歸正\n不過後段也就只有男主角繼續表現出微善良的一面\n然後少了逞兇鬥狠而已\n但我覺得刻畫的不夠深，少了一點味道\n\
  沒有讓我感受到男主角真的歸正了\n\n可能是因為有男主角後面拿著瓦斯桶出巡想炸他全家的片段吧= =\n\n\n\n\n    女主角的境遇讓我很生氣\n而且都是被動的接受這個世界對他的惡\n\
  彷彿沒有改變的能力\n\n光是男主角把要創業的錢(有好部分都是女主角的吧)拿去想套筆大的卻被反噬\n卻超沒有禮貌的直接打槍女主角，雙手一攤表示錢沒了\n\n我他媽的幹你娘\n\
  餵這種屎給我吃我他媽的真的超氣\n\n\n結果後來女主角也沒有得到幸福\n就算錢有拿回來，那段時間現金流短缺還有失去愛情也足夠讓他痛了\n\n\n女主角的下場是甚麼?\n\
  \n半輩子都在照顧病人\n先是他爸、後是男友\n\n男友他媽的還超不體貼，說可以送他一個爸爸讓他有父愛\n結果他媽的他爸也失智，又要照顧病人\n女主角臉上露出一抹微笑，可能有些人會覺得這裡很好哭\n\
  \n但我就是不能接受，如果是我哪笑得出來，我直接哭給你看\n\n\n\n\n    還有一點是電影在販賣的流氓情懷\n很多人喜歡茄子蛋的浪子回頭或浪流連\n對我來說最吸引我的是那句「我已經決定要做一位善良的歹囡」\n\
  \n可能很多人也跟我一樣\n這部電影看得出來跟這句話一樣\n\n但流氓情懷我認為就只是人性使然而已\n有稍微逞凶鬥狠過很多都會是這種狀態(國中當過稍微愛嗆聲的屁孩，被8+9喬過=\
  \ =)\n\n都覺得自己是善良的，只是可能是環境逼迫，或是翻不了身\n\n\n　　我個人非常不喜歡流氓情懷\n而我認為不喜歡流氓情懷的人應該不少，所以票房3億讓我不滿意\n\
  這是我稍微對觀眾的抱怨，這是我比較自私的部分\n\n這部電影展現出流氓情懷，表現出善良的一面\n可能會讓一些8+9有共感決定做善良的歹囡\n而這種鼓勵我是非常不樂見的\n\
  \n\n\n\n　　可能還有剩下一點大小缺點，我不是很記得\n不然就是我不想講，把我有記憶的簡略帶一下\n\n像是覺青會講的通篇父權壓迫、或是情緒勒索、恐怖情人之類的\n\
  我覺得很多人都講得比我好，我就不想講了\n\n不過還是會覺得「為了你好，所以我去搬你靈堂喔」\n這件事情超不浪漫的\n\n就是台式浪漫+流氓情懷塑造的霸氣總裁逼我嫁式浪漫\n\
  \n\n\n\n　　或是把台語/髒話跟流氓做連結\n華語跟非底層階級做連結這種常見的手段(也常被抨擊)\n在此不想多作文章，我只想說在語言的表現可能可以做得更好\n\
  \n\n\n\n--\n\n\n\n　　整部電影我給負評，而且我沒有記憶點\n出了電影院我就快忘了到底在演甚麼\n中間我還氣到開始滑PTT(最後一排不怕亮到人)\n\
  要不是台灣沒有這個習慣，我也沒有勇氣，不然我真的想起身閃人\n\n\n我有看過有人說看這部就是會哭爆\n我是也有哭，我居然會去電影院看這部片\n\n\n\n\n\
  \n\n\n\n\n\n\n我能懂為什麼有人喜歡這部片\n我不懂的是為什麼喜歡這部片的人有那麼多\n\n怎麼說呢？\n我被一堆好評騙去看\n\n前幾天在FB看到還沒看的可以看看票房，票房是不會說謊的\n\
  都3億了值得去看一下吧\n\n\n我幹\n\n--\n我的意思是，他聽起來沒有渾然天成感，很像硬放進去的東西\n有一點感覺，要做有台灣味的電影要有一些功力\n\
  可能是，不過我覺得這部在平均之下\n我可能永遠無法習慣韓國狗血\nQQ\n建議不要去，等串流平台吧\n因為太難看了，懂?\n這是我對這部電影的不尊重\n真的很討厭狗血，看到超不舒服\n\
  後面哪首?\n我一直在等甚麼時候會讓我有值回票價的感覺\n= =我知道很多人這樣想= =\n我音樂品味表示不喜歡這首主題曲\n我個人覺得我有講到更多值得討論的事情=\
  \ =\n唉\n我只能說\n我知道這樣做會影響到人沒錯\n但我那個時候只能這樣做\n我跟我朋友去的，不方便起身閃人\n但我不做其他事情分心，我會超不舒服\n這部片沒有尊重我的觀感，我感覺像是被餵屎，我也不願意尊重這部電影\n\
