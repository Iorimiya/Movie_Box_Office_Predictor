url: https://www.ptt.cc/bbs/movie/M.1630145559.A.150.html
title: '[新聞] 獨家｜4億夯片《當男人戀愛時》編劇簡持'
content: '獨家｜4億夯片《當男人戀愛時》編劇簡持中36歲病故　工程師轉戰影劇圈英年早逝　



  新聞網址：



  4億票房國片《當男人戀愛時》編劇簡持中本月因病逝世，享年36歲。《當》電影導演殷

  振豪與簡持中相識多年，最早還沒拍電影尚在拍攝MV時，兩人就已是互相扶持的創作夥伴

  ，工作上信任度十足，拍攝《當》也是殷振豪介紹簡持中進劇組，成為雙編劇之一，並共

  同締造影史紀錄佳作。


  《當男人戀愛時》今年5月票房突破4億時，簡持中曾分享：「很幸運參與這部電影，更幸

  運的是認識一群很棒的人，一起工作。一起笑，一起朝目標前進。」今電影團隊也表示很

  幸運能夠有簡持中的幫忙，但大家都還在整理情緒，也因為顧及家屬心情，暫不便多聊。


  據台灣電影網資訊顯示，簡持中曾為科技業工程師，因為喜愛文字，所以轉身擁抱故事，

  由科技業轉從事文字創作，轉戰電視電影編劇，產出題材多元，參與作品除了有《當男人

  戀愛時》，亦擔任公視人生劇展《風中浮沉的花蕊》、偶像劇《黑喵知情》的編劇，而

  《風》是2018年殷振豪執導作品，也是兩人首部合作的台劇。（李承陽／台北報導）


  --'
