url: https://www.ptt.cc/bbs/movie/M.1618153417.A.2A4.html
title: 'Re: [負雷] 一廂情願的當男人戀愛時'
content: "昨天看完，趁著餘波還在時借回一篇\n這部電影是一個在當下容易感動的佳作，現場拋開邏輯後可以看得很開心\n但看完電影後細想整部會越想越不對勁\n\n\
  先講故事邏輯，這也是我給小負雷的主因\n\n以下有劇情雷\n\n男主角很可憐，他這一生看起來只有遇上女主角這件事情是幸運的\n他是有其他家人沒錯，但其他家人在我看來沒這麼愛他吧？(後面說)\n\
  \n女主角就衰到爆了，爸爸欠高利貸還昏迷不醒\n因為家裡欠錢還耽誤姻緣，雖然三觀五官都很正\n但還是因為感動而喜歡上8+9，最後還可能要照顧男主的失智爸爸\n\n\
  先來談談男主的問題/性格：\n是講義氣沒錯，卻是對欠債的講義氣\n人家是欠蔡大姊錢，不是欠你錢欸，你這樣打折還倒貼\n蔡大姊留你幹活不知道在留什麼的\n而且感覺他的錢不僅多又愛亂花，嫖妹還倒貼這麼多錢\n\
  拿別人的錢去做人情，這我不行。觀眾是高利貸老大你會養這種小弟嗎？\n什麼相處幾天欠債免還，真的是話都給他講\n\n再來，他對小弟很兇，明明小弟是照大姊的意思辦事，是在兇幾點？\n\
  最後黑吃黑那段還沒拿下面罩，很多觀眾就已經猜到劇情吧\n小弟沒因為平時的對待把他打死已經很客氣了\n\n現在談談為什麼我認為男主的家人前面對他不怎樣\n男主因為大哥經商欠債，就去做黑道當作還錢\n\
  過程中男主應該經常受傷(雖然有時候是自殘)\nPS.最後看到他長瘤被醫生唸說是頭部經常遭受撞擊\n   回想片頭的拿爐敲自己頭真是諷刺\n但整部影片沒有演到他的家人看到他的傷口有什麼關心(如果我看漏了請幫補充)\n\
  大哥好像也不怎麼關心自己債到底清了沒，反正男主會處理\n甚至看男主混得不錯，既然書唸不起來，一輩子就這麼混下去吧？\n但高利貸老大有這麼善良喔？那個大嫂沒被押去賣也是奇蹟\n\
  \n男主還有一個運氣很背的地方，就是他各種進出場的時機\n他因為討厭討債，想要跟女主好好過日子，所以跟大姊攤牌導致黑吃黑\n結果想不到大姊賺了那筆後跑去選立委=漂白\n\
  以男主被大姊重用的程度，搞不好大姊當上立委後，他也不用衝第一線要錢\n                                            \
  \   ↑以上這段純屬腦補\n\n除此之外這部片還是有很多令人感動/難過落淚的橋段\n我相信是因為當觀眾當下忘記男女雙方的背景，單純把自己的角色切換成\n一見鍾情的追求者\n\
  願意無腦做事討對方(曖昧對象)開心的男/女朋友\n曾經在手足無措、壓力爆表時受到幫助\n看到朋友的父母遽逝後，才想起要即時孝順家人\n知道對方喜歡吃什麼，特地準備只為了對方的笑容\n\
  分開後偷偷發現對方試圖追尋幸福(聯誼)\n曾經發生誤會，最後冰釋前嫌\n照顧年長的親人\n......\n\n當下觀影時的哭點很多，很多片段卻讓我莫名的聯想起上週連假的事件\n\
  心裡只想著，生命無常，然後眼淚就默默掉下來了\n「跟我不能過壞日子。」\n「今天要開心，知道嗎。」\n\n如果可以的話\n不止今天吶，每天都要開開心心的，好不好。\n\
  \n\n--"
