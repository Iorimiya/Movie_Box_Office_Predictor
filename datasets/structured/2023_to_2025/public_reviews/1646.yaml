url: https://www.ptt.cc/bbs/movie/M.1629630131.A.75A.html
title: '[討論]  當男人戀愛時──吵架的原因'
content: '防雷
















  標題指的是分手那幕，我看了真是一頭霧水。



  我的心境轉折如下：




  浩婷知道後居然還能冷靜地勸他先回家再說，EQ超高。




  說自己爛，說瘋了才會想結婚，說他只是個騙子。


  看得出來他覺得自己會耽誤浩婷才刻意疏遠


  雖然狗血，但說得通，沒問題。


  問題是接下來這點──




  ……蝦毀？


  當初不用還債的條件是約會，而且合約很乾淨，連手都不能牽。


  事後也確實沒有被迫進行任何肉體關係。


  要說這是騙局，但從利益面來看阿成什麼都沒得到


  沒錢沒人，只有幾杯果汁和聊天。

  （中途真的相愛就是另一回事了）


  這不是真的喜歡妳還會是什麼？


  妳怎麼會相信他不是真的愛你？



  有個可能的解釋是：


  浩婷相信了阿成是打算先騙取她的信任


  再一次騙走她的存款跟阿爸的保險金。



  可是浩婷，就算阿成是個沒讀書的流氓


  也不會大費周章演這齣蹩腳戲吧……


  就算不提你本來就欠他錢


  一個領死薪水的職員連付醫藥費都捉襟見肘了，幾乎沒有設局的價值


  就算真的要騙你，幫你辦葬禮、頭破血流也要跟你過紀念日──這兩點都顯得沒必要且不划算


  一個EQ高、智商高的大學生居然相信「我沒愛過你」這種脆如紙片的謊話



  這安排我真的不能接受ㄟ


  還不如把衝突聚焦在阿成把錢都輸光了，至少很合理。



  各位怎麼看？




  問題是這個「被男主傷了」很難成立，她怎麼會相信男主真的從來沒愛過她？

  就算真的只為錢，「騙局」也很多餘啊，阿成拿著欠條就能收錢了還騙什麼情？

  何必為了當時窮到要跟親戚借錢的小女生、和一個不確定何時會拿到的保險金那麼累？

  韓版的分手關鍵點也是女方信了「他從沒愛過我」這種P話ㄇ？ 說穿了這才是我的疑問。'
