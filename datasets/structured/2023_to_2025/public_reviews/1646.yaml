url: https://www.ptt.cc/bbs/movie/M.1688273144.A.598.html
title: 'Re: [ 負雷] 那些說當男人戀愛時好看的是瞎了嗎？'
content: '會覺得好看的人，就是屬於


  1. 社會底層

  2. 沒在研究電影，只看爽片的人


  這些人是什麼人？就是像我這種人，雖然我沒有進宮廟跳過八家將，

  但是這些人事物從小就在我身旁


  所以我也覺得很好看，看完後也重複聽了好幾遍主題曲，

  榮登我的2021年Spotify最常聽的歌曲


  其實這部片就是傳統的無腦愛情片，特別的地方在於鎖定底層社會人士，

  首先就吸引了一票底層族群


  你說劇情瞎，當然瞎啊，就是灑狗血的劇情，什麼討債時打自己的頭，

  到底在衝啥小，居然還因為這個原因導致腦動脈瘤，不就是活該嗎？


  用畫圖的方式來寫合約，也是既幼稚又智障


  可是裡頭所有劇情，就全部都是社會底層可能發生的事，你在新聞裡面會看到的，

  比這部電影更蠢的都有，不然怎麼會有人被騙到柬埔寨。


  另外一個原因是情緒


  藝術是傳達情緒的媒介，要引發情緒其實不難，大部分的劇情也都會跟著固定的公式


  對於沒在研究電影的，只要劇情照著公式走，就能引起他們的情緒


  你之所以會覺得難看，那是因為你比較聰明，或者你讀的書比較多，看片時會動腦想，

  我們這種底層怎麼會動腦，我看片才不會動腦咧，完全跟著情緒起伏


  我如果再看一遍，我肯定也會覺得那是瞎片


  就是這樣


  --

  一時好奇就查了一下，果然跟我想的一樣，這部片在劇情公式方面掌握得不錯


  「這幾天聽音頻時，有個節目主持人與來賓聊到最近票房大賣的「當男人戀愛時」，主持人

  很振奮的表示是多年來難得的好電影，來賓卻說：是拍得不錯，可是因為他長期待在影視

  圈對電影的拍攝有一定了解，因此在看的過程中，每次情節轉折處他都能事先預測，該有

  變化了，該有什麼轉折了，然後呢？每次都猜中，只是該電影中的轉折和變化都相當自然

  得體，難怪有這樣的票房，雖是仿自韓劇，但加入的本土風格使得它更能被本地人所接受

  …聽完的第一個想法是：原來劇情的走向確是有公式可循的。再與前面友人所說的故事是

  有公式可循的相比對，令人雖有點難以接受，卻又不得不承認好像有那麼回事。」




  --


  你去網路上查，解釋這部片為什麼大賣的文章，應該可以找到跟我類似的說法'
