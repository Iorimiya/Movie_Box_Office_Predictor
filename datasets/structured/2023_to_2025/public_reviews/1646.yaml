title: '[討論] 當男人戀愛時的蔡姐其實人很好？ (有雷)'
content: '防雷













  防雷











  先不論這部戲的哭點如何，我覺得討債的橋段真的讓我很出戲因為實在太不合邏輯


  女主角她老爸欠的錢至少有上百萬吧(不然男主角不會說啥賣腎有幾百萬可以賺)


  這麼大筆債務男主角玩個塗方塊遊戲就可以一筆勾銷不用還？這會不會太扯


  我原本以為男主角有什麼賺錢的偏門，但看起來也沒有不然最後也不會拿錢去賭


  而且不只女主角這筆大的，討債的男主角基本上是「長期」都收不到應收帳款


  但蔡姐也只有念他幾句而已根本也沒怎樣，沒叫男主角還錢還繼續讓他當大哥


  挖靠男主角根本就是蔡姐乾兒子吧！這麼疼你結果還背骨跟蔡姐說老子不幹了說走就走


  男主角真的當蔡姐開慈善機構唷，最後被設計洗劫真的剛好而已...


  最後男主角去跟蔡姐討錢，我心中OS是男主角根本欠蔡姐一堆人情和帳款沒還清吧


  劇情推斷應該是連男主角哥哥欠蔡姐的債務都沒有還


  這麼有良心的地下錢莊老闆要去哪找啊？


  --'
