url: https://www.ptt.cc/bbs/movie/M.1637994022.A.04A.html
title: '[ 好雷] 當男人戀愛時'
content: "明知道很多國片好看但還是優先選擇洋片，\n\n要不是最好的朋友說想看，\n\n我想不知何時才能欣賞這部佳作。\n\n並不是很新鮮的劇情但是能讓人有共鳴，\n\
  \n甚至還能讓好朋友跟著劇情流淚，\n\n我想這是部非常成功的電影。\n\n\n因為真的不太愛看國片，\n\n所以這是我第一次看許瑋甯和鐘欣凌演戲，\n\n鐘欣凌的第一幕我還信誓旦旦地覺得林美秀怎麼那麼敬業，\n\
  \n為了角色胖那麼多，\n\n看完電影後查演員表才發現搞錯了。\n\n\n身為長年在中南部生活的觀影者，\n\n電影拍出來的就是我對舊台北縣的印象，\n\n濕濕暗暗，\n\
  \n好像所有發生的事情都在夜晚發生似的，\n\n甚至連出差至北部時住的便宜旅館都有Lulu接客場所的影子。\n\n也可能是因為電影介紹的氛圍，\n\n我一直覺得這應該不是喜劇也不會有好的結局，\n\
  \n也果真如此劇情就如同我預想的演下去了，\n\n當導演拍到兩人的存摺印章時，\n\n我心裡面也馬上冒出兩個字：完了；\n\n蒙面人衝進去時也馬上可以想到那些人是誰。\n\
  \n但就算如此，\n\n還是有很多片段讓我很有印象。\n\n\n\n如女主角在客人拿出兒子相片時回應說我欠人很多錢、\n\n邱澤跑去農會即興演出要打經理、\n\n\
  男女主角在屋頂的畫面很好看，\n像是一種底層人們難得可以享受的一點陽光、\n\n兄弟打架爸爸問是誰打贏、\n\n哥哥最後收到全新招牌的痛哭，\n\n好多好多。\n\
  \n\n他們本來就不應該在一起，\n\n但是人生的故事讓他們走在一起，\n\n最可憐的還是女主角吧！\n\n失去了爸爸，\n\n欠了一堆錢，\n\n又失去了男友，\n\
  \n然後又多了一個失智的爸爸，\n\n人生有夠悲慘，\n\n但如果我是女主角，\n\n就算明知道這樣的人生不能算是好過，\n\n我仍然會這樣子選擇守護著屬於自己的幸福。\n\
  \n\n很喜歡這部片，\n\n分享給大家。\n\n--\n \n\n\n\n\n-----\nSent from JPTT on my Sony J9110.\n\
  \n--"
