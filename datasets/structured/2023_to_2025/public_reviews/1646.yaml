url: https://www.ptt.cc/bbs/movie/M.1716378623.A.1D3.html
title: '[新聞] 泰國翻拍<當男人戀愛時>，揭人民負債事實'
content: '新聞網址：



  翻拍自台韓愛情經典《當男人戀愛時》的泰國年度話題夯片《分期付款愛上你》，即將在

  6月21日於台灣催淚獻映。本片由人氣戲劇《特長生》瓦蘇蒂克特皮奇（Waa）編導，並由

  《流星花園泰國版》的「泰版道明寺」瓦奇拉維特奇瓦雷（Bright），以及透過電影《把

  哥哥退貨可以嗎》晉升「泰國億萬票房女神」的烏拉薩雅斯帕邦德（Yaya）攜手主演。全

  片透過討債人愛上債務人的劇情，間接證明金錢與愛情價值之間的差異，更融入泰國在地

  元素，旁敲泰國人民債務現實，甚至突顯「每三位泰國人，就有一位陷入負債問題」的社

  會問題，讓本片除了感動的愛情之外，更添加催淚的現實重量。這也讓本片在泰國上映之

  後，隨即登上首週新片票房冠軍，更名列今年泰國電影當中，開片票房第五高的作品，並

  在享譽全球的電影評分網站「IMDb」上，獲得9.6觀眾高分肯定。票房、口碑雙贏，值得

  台灣影迷進戲院一探究竟。





  催淚愛情強片《分期付款愛上你》，是由素有「泰國娛樂夢工廠」之稱的「GMM Grammy」

  所打造。作品翻拍自2014年由韓東旭執導，黃晸玟、韓惠軫主演的電影《不標準情人》（

  另譯《當男人戀愛時》）。該作品更在2021年翻拍成台灣版《當男人戀愛時》，由殷振豪

  執導，邱澤、許瑋甯主演，並在當年斬獲4.05億台幣票房佳績，更接連入圍金馬獎、台北

  電影獎等多項大獎。如今這個感動全球數百萬人的愛情故事，終於在2024年推出泰國翻拍

  版，光是製作消息與概念版預告一出，就在影音平台上大破120萬觀賞人次，成為粉絲高

  度熱議話題。尤其本片演員更是一時之選，找來以電視劇《流星花園泰國版》、《只因我

  們天生一對》紅遍全球的瓦奇拉維特奇瓦雷，詮釋用非典型方式來討債的帥氣男孩。而飾

  演債務人的美麗女孩，則由以電影《把哥哥退貨可以嗎》獲得億萬票房的混血女神烏拉薩

  雅斯帕邦德演譯。



  本片劇情描述一位討債人愛上了債務人，隨著兩人的相處時間越多，彼此的愛就愈發炙熱

  。不過他們不知道的，是有更巨大的障礙正準備衝擊兩人的關係，也間接證明了金錢與愛

  情價值之間的差異。導演瓦蘇蒂克特皮奇對此分享：「故事的前提很清楚，是討債人和債

  務人之間的愛情故事。我們要做的功課，是如何透過泰國背景來講述這個故事，又同時得

  思考如何讓觀眾對角色產生信任與參與感。這是一部擁有強烈情感的愛情電影，是一部必

  須恰到好處將多重元素混合在一起的浪漫故事，但也不能忘記所謂『非正式債務』的概念

  。據說，一半以上的泰國人都可能已經負債累累。我們研究人們的真實生活，甚至田調過

  我們認識或見過的人，這對我們說故事來說，都是一種啟發。」





  事實上，根據國際金融協會（IIF）在2022年6月所公佈的《世界負債報告書》當中，揭露

  泰國是亞洲家庭債務與國內生產總值（GDP）比率最高的國家之一，僅次於南韓和香港。

  每三位泰國人當中，就有一位陷入負債問題；尤其在新冠疫情之後，泰國的家庭債務狀況

  也愈來愈嚴重。另一方面，暹羅商業銀行在2023年1月20日至2月2日，針對4733位民眾進

  行調查，在所完成的「SCB EIC Consumer Survey 2023」報告中發現，82%的受訪民眾，

  存在收入落後於支出的問題，尤其是低收入族群（每月不超過15000泰銖），面臨這個問

  題的比例高達89%，而63%的受訪民眾更是負債累累。相較於南韓原版與台灣翻拍版，這次

  的泰國翻拍版更清楚暴露「債務」這項現實問題。



  本片在泰國上映首日，就熱賣230萬泰銖，逆襲蟬聯多天冠軍的《金孫爆富攻略》，甚至

  打敗同一天上映的好萊塢大片《特技玩家》（The Fall Guy），登頂泰國首日票房冠軍，

  隨即也登上首週新片票房冠軍，名列今年第五高開片票房的泰國電影。此外，泰國上映首

  日，便在享譽全球的電影評分網站「IMDb」上，獲得9.6觀眾高分肯定，許多網友更在社

  群直呼「超催淚」。這也讓本片憑靠極佳好評與催淚口碑，迅速累積票房，值得台灣觀眾

  進戲院一探究竟。



  這部翻拍自感動全球數百萬觀眾愛情之作，並旁敲泰國人民負債問題的《分期付款愛上你

  》，即將在6月21日於台灣催淚獻映。本片劇情描述在芭達雅這個充滿活力的不夜城，阿

  波（Bright飾演）日復一日帶著夥伴們四處討債。雖然阿波表面上態度強硬，但討債手法

  卻頗為反常，不但不會對債務人訴諸暴力，反而還會拿起手邊的東西，把自己敲到頭破血

  流，讓債務人虧欠地趕快還債。沒有任何抱負的阿波，某天邂逅了必須努力工作來償還父

  親債務的小盈（Yaya飾演）。小盈打從一開始就瞧不起阿波，但阿波卻對她一見傾心。出

  於對小盈的愛與同情，阿波提出一份約會契約──透過跟他約會來支付利息。小盈別無選

  擇，只好無奈地同意這項安排。在兩人波折不斷的約會過程當中，他們也逐漸發現到彼此

  的真心。不過當討債人愛上債務人時，會發生什麼事情？而這段負債累累的愛情之路，最

  終將引領兩人走向何方呢？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
