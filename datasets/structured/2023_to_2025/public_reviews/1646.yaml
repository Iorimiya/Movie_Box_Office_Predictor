url: https://www.ptt.cc/bbs/movie/M.1617700804.A.C56.html
title: '[ 好雷] 當男人戀愛時 好哭雷'
content: '剛看完走出電影院還在流淚

  雖然劇情非常好猜

  但也許是有打到我的點吧

  一直想到跟前任以前也常常因為經濟壓力吵架

  想到她也會幫我挖耳朵

  想到如果我當初做出不同選擇她會不會還坐在我身跟我一起看電影


  唉再講下去就變男女版了


  許瑋甯在本片中將被生活壓榨的死魚眼演的很好

  皮膚刻意顯得黯沉沒有活力，疲勞的眼袋重的人好像隨時都會垮掉


  邱澤我是在這片才認識他，把純情混混的尷尬樣也演的不錯，不過去孝順別人老爸放著自己老爸給人顧這實在是有點無言，只能說互相吧


  不過真正突破我淚腺是最後大哥收到阿成死後寄來的禮物，如同與神同行最後的告別，這種親情戲我總是無法抵擋


  這是部好片，但如果你看電影是想獲得好心情那不太適合


  -----

  Sent from JPTT on my Asus ASUS_I01WD.


  --



  --'
