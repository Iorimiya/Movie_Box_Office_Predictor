title: '[悲劇雷] 正義不彰台灣底層悲劇《當男人戀愛時》'
content: '[悲劇雷] 正義不彰的台灣底層悲劇《當男人戀愛時》



  .

  .

  .

  .

  .

  .

  .

  .

  防雷線

  .



  女主角任職於地方農會銀行櫃台。經過多日尾隨追求後，討債流氓之男主角抽號碼牌來跟

  女主角閒聊。女主角按鈕輪下一號客人，男主角拿出一張號碼單。女主角又按下下一號，

  男主角再拿出一張號碼單。反覆如此，原來男主角抽了幾十張號碼單。



  女主角呼叫經理，經理勾著女主角的肩膀詢問男主角意圖。男主角見女主角被勾肩搭背，

  ，心中怒火中燒，衝進農會櫃台追打經理。女主角報了警。



  到了警局，警察說經理不追究，有意大事化小小事化無。「客人來櫃台說話」「他抽了號

  碼牌」各種搪塞吃案。女主角怒火中燒，衝離了警局。經理無法為他主持正義，警察無法

  為他主持正義，他只剩自己。



  --

  女主角父親欠債，如今重病在床，女兒無怨悔照顧。男主角是討債流氓，帶著一夥小弟來

  到病床前討債。女主角扭開胸前數顆衣服扣子，說要錢沒有，監視器到處都是，侵犯他就

  可以上法院支付債務。



  男主角一行人拿女主角沒辦法，叫小弟準備將父親帶走。無怨無悔愛父親的女主角投降，

  簽下債務繼承契約，完全承擔父親的欠債。




  根據台灣法律，子女可依民法拋棄繼承。但在正義不彰的底層社會，在暴力討債集團前，

  受過大學教育仍完全承擔父親的負債。



  --

  女主角父親過世，女主角孤單地為父親辦喪事，沒有任何親友出席。親友們可能因女主角

  屢次借錢，早就斷絕一切關係。女主角準備要草草火化父親。




  此時，男主角衝進殯儀館，搬來鮮花果盤，自稱自己是家眷，帶著小弟來幫女主角辦後事

  ，站在家屬之位置，對前來的小弟和債主們一一答禮。女主角喜歡上了當初不停跟蹤尾隨

  ，來他工作場域騷擾她的男主角。



  女主角經濟與社會支持的單薄，忙於父親長照和賺錢，無機會無閒暇無餘裕尋找良緣。除

  了討債流氓男主角，更無其他異性與同性之支持。看來也別無他選了。




  --

  討債流氓男主角是善良。底層社會貧窮，借錢求路無門，只能找上「蔡媽媽互助會」高利

  貸借錢，而男主角和小弟們負責暴力討債。路人看到暴力討債情景也不會報警，直說被砸

  的店好像欠錢，少惹麻煩。




  欠債的民眾有生病開刀之親人，男主角總少拿一些錢。討債不成的小弟們去砸店時，男主

  角還毆打小弟叫小弟們住手。男主角是善良，作大環境貧窮悲劇下的一點點光輝。




  --

  男主角固然善良，但他解決問題能力受了侷限。未經女主角同意，將女主角所辛苦存的錢

  拿去投資蔡媽媽的賭局，結果被蔡媽媽派人砸場搶劫，損失所有金錢。女主角得知後固然

  震驚，但還是想跟男主角回家解決問題。




  對於損失所有金錢，男主角一廂情願覺得自己是個爛人，女主角跟自己永遠不會幸福。因

  此整個人崩潰，說自己從未愛過女主角，錢是用來償還女主角債務，讓女主角崩潰離開。



  男主角開始製造街坊混亂，並毆打過來支援之警察，襲警讓自己進入監牢。男主角沒道歉

  ，沒解決問題，沒承諾未來賺回來，沒過幾天去找蔡媽媽討錢，倒是先進入了監牢。



  --

  保釋出獄後，男主角來找蔡媽媽討債。才幾個月的光景，蔡媽媽已經出來競選議員，開設

  競選總部。黑吃黑後有了錢，出來競選議員洗白，順便取得公權力保障。地方警察跟他說

  ，現在的蔡媽媽已經惹不起了。



  --

  電影有說她「很乖」，乖到男主角死後還去照顧男主角失智的父親，可憐哪。




  --

  總結，這是一部台灣底層社會之悲劇片。男主角一廂情願索愛，女主角貧困長照悲歌，受

  騷擾時警方又無法為她主持正義。高利貸集團洗白。真是台灣底層的縮影。




  Mason


  --'
