  這兩個地方我真的不懂

  因為不是黑道片我想就算了

  裡面的小弟看起來都像大學生...超弱的樣子


  最後

  我看男主角整部片感覺

  就不是很缺錢的樣子

  各種撒錢然後說做討債是因為

  借錢給哥哥做生意...


  好啦撇除這些

  演員演技跟配樂真的沒話說

  許瑋甯、蔡振南演技好

  邱澤很帥

  茄子蛋音樂好聽到爆


  最感動的地方是

  阿成跟浩婷在房間的對話

  希望開店穩定後半年去結婚

  然後去看老爸說她的女兒不孤單有人照顧(女生很吃這套)

  另外一段是

  阿成在陽台跟老爸對話那段

  父子間的交談「你做他阿爸啦？好不好！」


  總結是一部可以帶妹子去看的電影

  記得準備衛生紙適時的拿出來

  今天帶女朋友去看她還哭了出來


  現實生活裡我想女主角

  很多場景都會覺得莫名其妙、尷尬又可怕

  人帥沒問題人醜就性騷擾了



  --'
