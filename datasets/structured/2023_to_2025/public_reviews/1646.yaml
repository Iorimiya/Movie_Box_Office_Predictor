url: https://www.ptt.cc/bbs/movie/M.1617697990.A.379.html
title: '[新聞] 「當男人戀愛時」票房破5800萬 奪春假全台新片冠軍！'
content: "新聞網址：\n\n2021-04-06 15:41 聯合報 記者黃保慧／即時報導\n\n邱澤和許瑋甯主演的台式新浪漫愛情電影「當男人戀愛時」，首周末上映全台突破5800萬\n\
  的票房成績奪下春假期間全台新片冠軍，更超越破億國片「比悲傷更悲傷的故事」與「孤\n味」的開片紀錄，上映沒多久就開出好成績，看來破億在望。\n\n邱澤和許瑋甯更被封為「淚腺排毒最強CP」，全台也掀起二創電影素材的風潮，跟著全台\n\
  跑透透的導演殷振豪感謝觀眾的喜歡：「希望大家看完『當男人戀愛時』後，更懂得如何\n向身邊珍惜的人表達自己的感情。」\n\n「當男人戀愛時」上映適逢連假，邱澤、許瑋甯與Lulu黃路梓茵全台戲院賣力跑透透，首\n\
  周末全台共跑了近70場放映，有網友投稿表示帶曖昧中的女生去看電影，看完後立馬脫單\n。\n\n許瑋甯近日邀請她圈內外的各界親朋好友來看「當男人戀愛時」，現場出席嘉賓星光熠熠\n\
  ，包含陳柏霖、余文樂、修杰楷、周興哲、吳建豪、謝佳見、林柏宏、吳慷仁、炎亞綸、\nØZI等人，全都大力推薦電影「超好看！」眾星紛紛稱讚許瑋甯演技之好外，陳柏霖直呼\n\
  一定要二刷，周興哲也說「看得我都哭了！」\n\n此外，同場星光還有蔡康永、曾國城、林心如、黃河、曾愷玹等人，李千娜發文：「今年\n超級推薦的電影！」黃健瑋更感性表示：「我們有邱澤和許瑋甯，這是一個時代的開始。\n\
  」大家一致認同「當男人戀愛時」讓人「笑著笑著就哭了」，很適合淚腺排毒，大力推薦\n全台觀眾一定要進戲院支持。\n\n主創團隊勤跑戲院期間觀眾反應相當熱情，有女性觀眾不顧男友在身旁、直接當面向邱澤\n\
  示愛：「本來覺得你不是我的菜，看完電影覺得你真的很帥！」許瑋甯跑遍北中南部戲院\n，紛紛被觀眾要求原音重現片中經典的台詞「啥款」，Lulu則在跑映後時被觀眾起哄高歌\n\
  一曲，還搞笑回應：「你們是不是很閒！」導演和演員更一起在戲院廳外偷聽觀眾反應。\n電影現正全台熱映中。\n--\n\n   \n\n\n\n--"
