url: https://www.ptt.cc/bbs/movie/M.1616948974.A.1B2.html
title: '[好雷] 簡單的故事卻讓人感動 當男人戀愛時'
content: "雷文防雷資訊頁\n ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*\n\n\n\n\n\n\n\n\n\n\n ~~~~~~~~~\n\
  \n戲如人生、人生如戲，\n\n《當男人戀愛時》這部電影就是闡述了一切，\n\n劇情真的很簡單，一個討債流氓愛上了欠債人的女兒，\n\n就這樣老梗的故事卻讓觀眾一會笑一會哭。\n\
  \n\n\n我覺得真切動人的故事來自於生活，\n\n而這部電影就非常生活化、人性化，對人物雕刻也很深。\n\n\n\n阿成雖然是流氓，內心卻很柔軟，\n\n口中操著三字經，心裡卻常替別人著想，\n\
  \n浩婷在戲裡前半段就是個冰山，阿成怎麼敲也敲不動，\n\n但阿成在一次又一次的事件裡讓浩婷看到他內心的善良。\n\n\n\n誰說流氓不能善良、不能溫柔？\n\n\
  就是這樣的反差讓兩人相愛。\n\n\n\n而這部電影的細節更是決定了它為什麼會好看，\n\n太多的劇情和畫面是讓人有深切的共鳴，\n\n操著一口超俗的台語，然後在深情浪漫時來一個大臭屁，\n\
  \n或者一起吃著特價品宵夜聊著未來。\n\n\n\n台詞有時候看來也是俗不可耐，但又怎樣？\n\n\n\n在我看來阿成就本該如此，而浩婷就是愛那樣的阿成，\n\n\
  有時候愛情本來就是不可理喻。\n\n\n\n而阿成一見鍾情的愛也讓人發笑，沒啥道理，\n\n就是看人家正又有孝心，\n\n或許沒遇到一見鍾情到前，你我都不會相信，\n\
  \n但對我來說是絕對相信的，\n\n遇到我女友時，也是瞬間一個眼神交會，\n\n真的是被電到不要不要的。\n\n\n\n當然電影裡不全是愛情，\n\n對於親情的刻劃細膩，\n\
  \n像阿成買保健品、跟爸爸談心、幫忙按摩腿，\n\n跟哥哥看似有點隔閡但有事卻會站出來扛，讓人很有感受\n\n而且裡面的笑點都是極其生活化的，\n\n沒有為了刻意逗觀眾笑的橋段，一切都是很自然的笑點。\n\
  \n\n\n但是當感動和悲傷的橋段來臨時又會讓人知道，這就是人生了，\n\n人生永遠沒有完美，或許有缺憾更顯得深刻吧\n\n片尾我是直接哭爆～\n\n還被我朋友說怎麼這麼娘，但我就是被感動的不要不要的\n\
  \n\n\n你管我我樂意～\n\n\n--"
