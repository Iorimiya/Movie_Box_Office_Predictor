title: '[討論] 性別論點談《當男人戀愛時》'
content: '本文以兩性以外的「性／別」觀點審視《當男人戀愛時》。









  單就表面與生理性別檢視《當男人戀愛時》，無可否認它是典型的異性戀電影。然而浩婷

  （許瑋甯飾）卻與多數同志電影主角籠罩在「孤獨」。


  受制於異性戀霸權藏匿於暗櫃，同志電影的主角往往明白己身性傾向與主流大眾不同，渴

  望愛情滋潤，藉此由孤獨一人轉為兩人陪伴抵抗世界。畢竟 99% 的同志在人生遇到另一

  名同志之前，都曾深陷於孤獨，因此加倍渴求愛情。這造就過半的同志電影，實質為「同

  志愛情電影」。


  無論是去年火紅的《刻在你心底的名字》（2020）、引領臺灣青春風潮的《藍色大門》

  （2002）、《盛夏光年》（2006）皆是如此聚焦在「孤獨感」，在青少年角色、時空背景

  設定於 1990 年前的電影最為明顯。因為「孤獨感」驅動愛情或友情，《墨利斯的情人》

  （Maurice, 1987）中主角才會轉愛上家僕家僕 Scudder、《藥命俱樂部》

  （Dallas Buyers Club, 2013）的 Rayon 才會願意以男裝跪求父親拯救主角。最聚焦同

  志孤獨感的電影，莫過於坎城影展酷兒金棕櫚得主《湖畔春光》

  （Stranger By The Lake, 2013），在結局中，主角寧願找死都不想承受獨自一人的孤寂

  。





  單就孤獨感，同志與浩婷如出一轍，渴望愛情陪伴，卻因性身份／債務而隻身一人。浩婷

  外型甜美、擁有穩定工作，因父親久病在床累積龐大債務無法談戀愛。郵局的一幕戲，歐

  巴桑介紹兒子給浩婷，浩婷吐露欠債，歐巴桑落荒而逃。浩婷瞳孔映照出孤獨，彷彿這輩

  子愛情註定遠離。後半段劇情不多談，阿成（邱澤飾）努力追求浩婷，浩婷阿成終成眷屬

  。


  去除生理性別框架上，這份孤獨者尋覓到愛情，在感知（sensibilty）上是與同志電影相

  符。因為如此，同志觀眾亦能被《當男人》所觸動。






  受限於家庭主義、父權體制中的生殖取向情／性慾，婚姻在國家規範與種種機制下幾近成

  為義務規範。在華人社會下根深蒂固的儒／孝道，婚姻後的「家庭」被無以名狀地放大，

  宛如詛咒束縛、箝制著人民。這一點在《當男人戀愛時》更是明顯，基於孝與家庭，浩婷

  為回報養育之恩，必須放棄生活、夢想、愛情來維持父親生命延續。


  這究竟呈現浩婷是個守法好國民，知道不理會病父觸犯刑法遺棄罪，更或是風序良俗造就

  子女要孝順呢？



  這份名為「家庭」的詛咒同樣體現於男主角阿成，他愛哥哥、孝順父親，但這般的「愛」

  與「孝順」究竟根源自於何處？與其批判後續的家庭勞務壓迫女性，我們是否該歸根究底

  檢討更上層的「親情」、「孝順」這類「陰魂不散的家庭主義魎魅 」。倘若沒有婚姻、

  家庭的道德倫常加諸，《當男人》後半段怎可能出現把我爸爸送給妳當爸爸這樣的荒謬劇

  情。


  與其聚焦在女性壓迫，阿成這位男性角色同樣深陷在另一種性別壓迫。


  所有人都是受害者。


  也因為多數觀眾買單感動，因為多數人都服從、認同家庭與婚姻，所以這類敘事才會奏效

  。


  畢竟多數人就是「家庭詛咒」下的被詛咒者。









  隨著《當男人戀愛時》大賣，有論者開始斥責排山倒海的觀眾，強調本片是資本父權愛情

  故事，故事情節以父權結構為骨架等等；這種觀點在我眼裡老派且教條，完全忽略觀眾的

  主體性以及電影的娛樂性。


  像臺灣 70 年代的瓊瑤電影，用羅曼愛情撫慰了數以萬計女工。瓊瑤電影給予觀眾做夢的

  權利，也給了勞動女性片刻享樂的幸福滋味。這觀點在《我們的那時此刻》（2016）有所

  呈現，而瓊瑤電影當年卻被多數知識份子與電影評論者所批評「逃避現實」，直至近年隨

  著修復與論壇重新賦予正面意義。


  這類知識份子貶低通俗愛情的觀點基本比比皆是，舉凡《暮光之城》、《格雷的五十道陰

  影》這些流行小說／電影，核心皆圍繞著羅曼史，反映當代女性在對於愛情、慾望的想像

  ，卻被部分觀眾（尤其是死異男）所鄙夷。


  《當男人戀愛時》用通俗愛情包裝文本。這樣文本的確是父權產物，台灣國際女性影展選

  映電影《浪漫喜劇麥擱騙》（Romantic Comedy , 2019）曾爬梳浪漫愛情喜劇片演變。除

  批判裡面的人物再現，受訪的女性影像工作卻紛紛「坦承」喜歡這樣的電影，並樂在其中

  。這證明女性主義與享受浪漫愛情並不衝突，僅為視角觀點差異。




  以女性主義、性別社會學批判電影是父權，了無新意。女權、平權、多元包容很棒，但是

  絕大多數觀眾進電影院追求的是娛樂、是通俗浪漫。愈不切實際的羅曼愛，愈讓觀眾以愛

  情幻想對抗殘酷現實。


  以知識份子的高位階去批判，只顯得自己與多數人的差距，僅止在同溫層拉抬聲勢，無法

  阻擋觀眾掏錢捧場。




  本篇文章並非在於打臉評論《當男人戀愛時》的寫作者們，

  而是提出聲明：性別論述並非限於「男女二元性別」。


  隨著性別主流化，多數人都懂性別是多元且流動。然而追求平權、訴諸運動時卻反而因為

  政治目的、簡化訴求而更加限縮、不多元、不流動，例如斥責電影主角不該如此如此，批

  判導演怎麼可以這樣塑造角色等等，當這些二元性別評論集結，反而煽情化且趨於一言堂

  。到底怎麼樣女人才是好女人、怎麼樣電影才是性別平權電影呢？現代女性能不能渴望被

  男人保護？現代女性能不能把男友爸爸當自己爸爸？


  真正的「自由」是在不妨礙他人時可以做任何的事。真正的「多元」是好女人跟淫賤女人

  都能夠被觀眾同等喜歡。當我們斥責電影不該怎麼做的同時，是否該反思此舉是否以「進

  步自由」之名箝制他人的自由呢？



  此外，一部電影可以被任何解讀，觀眾可以重新賦予電影意義。



  就像是那些小眾的 Cult Film一樣；




  或是許多男同志把異性戀情歌解讀為同志國歌等等，這就是閱聽眾的主體性。



  真理要愈辯愈明、而非愈辯愈窄化。


  當論述可以多元觀點、觀影可以多元解讀，


  容納所有的異聲、接納各式敘事文本，才是真正的多元自由。










  --

  歡迎加入粉絲團 (・∀・)


  movie板：z-6-6


  --'
