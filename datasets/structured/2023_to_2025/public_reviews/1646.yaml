url: https://www.ptt.cc/bbs/movie/M.1619888202.A.4E9.html
title: '[極負 雷] 當男人戀愛時  當一個角色毀掉電影時'
content: '勸世文：

  好久沒有一部讓我看到一半想走出場的電影，

  而且難得是一個爛角色，搞掉一個好題材、攝影與演員好演技...

  -------以下有雷------

  -------以下有雷------

  -------以下有雷------

  先補血，純看邱澤演技真得不錯，沒看過他飾演這類型角色。


  但不得不說這角色，真得廢到底，整齣沒看到他想好好腳踏實地做事，討債討到幫女友還債，公器私用辦喪事，這種沒想努力付出只有善良一股傻勁直衝到底，也難怪最後只能被淘汰...

  （我要的是教父那種集合現實與聰慧的高級8+9阿！）


  最後還來個「天際孝子」怪罪哥哥沒照顧好爸爸，他自己才是家裡最搞笑的禍害吧...這種到最後被賣了都還不知道原因是菜姊在跟他要回平常東偷西偷的補償...

  （綜合之前看其他分享文，覺得菜姊已經對他仁至義盡了）


  可怕的是，如果不是男帥女美的相交，這部大概會變成追討債權人親屬或恐怖情人的劇情，


  如果，最後可以來個浪子回頭，打算好好踏實工作，還女主錢，無奈重病，或許還能獲得些尊重死得也有尊嚴，


  結果最後卻是去跟一個對你有恩的人的選舉總部揚言allin氣爆，


  所以很可惜，拍謝，這種角色得不到我的尊重與淚水...


  -----

  Sent from JPTT on my Xiaomi Redmi Note 8 Pro.


