  角色情緒裡，拍攝整晚哭不停。許瑋甯也和導演在現場討論，依據角色心境共同創作台詞\n，使得角色心境更加完整。電影現正熱映中。\n\n\n邱澤（左）、許瑋甯（右）主演「當男人戀愛時」的感情戲相當動人。\n\
