url: https://www.ptt.cc/bbs/movie/M.1616785625.A.B9A.html
title: '[  好無雷] 當男人戀愛時'
content: '手機排版 傷眼抱歉


  今天去看了口碑場

  先說缺點 劇情有點老套、好猜

  但除此之外也沒什麼其他問題了

  整體劇本滿完整 劇情也都合理


  導演功力出色 很細膩的設定男女主角

  就連綜藝出身的LULU狀態也調整得不錯

  大銀幕處女秀不會讓人感到出戲

  其他角色也都恰如其分

  沒有什麼不知所謂的角色出現


  攝影燈光是去年《無聲》的燈攝

  這次同樣將畫面和氛圍營造得很好

  美術部分有幾個場景設計得頗有味道

  至於音樂 我向來沒很喜歡電影裡有主題曲

  所以這部分先pass


  然後吹捧一下邱澤的演技

  幾個特寫畫面看到他表情、眼神的細微變化

  情緒相當飽滿 整體表現滿精彩


  最後還是打一下預防針

  我想這不是一部超級神片

  所以也不需要抱持超高期待去看


  可是我想電影整體表現得很完整

  絕對是對得起票價

  能讓你好好享受兩小時的好電影

  期待導演的下部作品！


  --'
