title: '[討論] 當男人戀愛時vs比悲傷更悲傷的故事'
content: '這兩部都是台灣的導演改編韓國電影

  我都是先看完台版的才去找韓版的看

  感覺台版是後來改編的

  所以可以把劇情順序重新調整更流暢

  並且融入台灣文化元素

  讓觀眾更有共鳴

  尤其是黑道選民代感覺蠻諷刺現實的

  不過韓版原創的劇情大綱

  就已經營造出非常感人的氛圍了


  兩部比較雷同的地方

  就是男主最後都病逝了

  而且都想對女主隱瞞

  結果女主不管剩下多少時間都願意陪伴

  跟以前的電影有主角光環活到最後不同

  所以才會那麼催淚吧


  兩部比較有差異的地方

  當男人戀愛時比較貼近市井小民的感覺

  逞兇鬥狠的8+9和平凡普通的行員

  不過劇情走向比較好猜

  不順眼、在一起、分開、復合


  比悲傷更悲傷的故事背景比較是白領階級

  交互的情感關係比較複雜

  最後原來女主已經知道真相的反轉

  還配合達成男主心願的做法

  才是讓人更揪心的地方


  整體來說都算帶入感還蠻深的電影

  台版票房也都不錯

  不過還是私心希望能有多一點原創作品

  雖然我是魏黑酸台灣三部曲

  但是當初用原創電影海角七號帶來的票房

  還是算蠻厲害的


  --'
