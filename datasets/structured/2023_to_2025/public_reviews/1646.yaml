url: https://www.ptt.cc/bbs/movie/M.1617463739.A.071.html
title: '[好雷]《當男人戀愛時》希望能被人理解的心意 '
content: '以下有雷


  圖文好讀版：






  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  《當男人戀愛時》是一部台灣愛情電影，由殷振豪執導，邱澤、許瑋甯、蔡振南、鍾欣凌


  主演，劇情講述外表看似凶狠、實際有顆柔軟的心的流氓阿成，在某次討債過程中對債主


  女兒浩婷一見鐘情，提出用吃飯、散步的方式來抵銷她們家債務的交換條件。阿成一股腦


  的心意，漸漸卸下了浩婷的心防，然而一場突如其來的意外，卻也無情打擊了兩人對未來


  的期待。




  今年春節由鄭人碩、謝欣穎主演的《角頭外傳：浪流連》，靠著黑幫與愛情兩種類型的結


  合，塑造出一個既暴力又浪漫的故事，獲得許多正面的好評口碑，賀歲檔期短短 14 天就


  票房破億，成為今年目前為止最賣座的國片。而這次邱澤和許瑋甯合作的《當男人戀愛時


  》，通過兩位影帝、影后級演員的詮釋，也再度以貼近社會的人物角色和故事情節，展現


  出專屬於台灣本土愛情電影的浪漫。




  雖然根據 2014 年講述討債流氓愛上窮困落魄女孩子的韓國電影《不標準情人》改編，但


  這次國片《當男人戀愛時》找來了茄子蛋〈浪子回頭〉、〈浪流連〉、〈這款自作多情〉


  的 MV 導演殷振豪執導，確實從小人物的生活困境出發，在原作那充滿濃厚韓國電影色彩


  的故事之下，以獨特的台式美學，賦予「小姐與流氓」這種愛情電影時常出現的故事情節


  ，一個能夠讓所有觀眾產生共鳴的全新面貌。




  常聽人說鐵漢柔情，既然外表兇狠強悍的人內心也可能有著溫柔且能夠發自內心為人著想


  的一面，那在外界的異樣眼光下，他們能否像常人一樣擁有深刻的愛情？《當男人戀愛時


  》透過男女情感的多元樣貌，把故事聚焦在一對性格完全不對盤的男女因為討債而相識，


  發展出一段刻骨銘心的愛情，就如電影片名那樣，讓邱澤所飾演的男主角阿成帶著我們看


  見「當男人戀愛時」那股能為了愛人拋棄一切的義無反顧。




  毫無疑問，《當男人戀愛時》完全顯示出韓國電影劇本的精良與工整，從男主角阿成在討


  債時遇見浩婷後被她深深吸引，兩人因為一張「塗鴉合約」開始互相理解，彼此需要而陷


  入熱戀，到最終這對男女面對殘酷的社會而走向悲劇性的結局，《當男人戀愛時》故事不


  僅像那些我們熟悉的韓國電影那樣，鋪陳轉折一氣呵成，全片真摯的情感也給觀眾帶來最


  深刻的感動。




  我喜歡《當男人戀愛時》在描寫男女主角情感關係的同時，對於角色性格與內在困境的塑


  造。無論是片頭藉由阿成對每位債主網開一面，表現他隱藏在兇惡外表背後的溫柔內在，


  並讓觀眾喜愛這位角色的「救貓咪」橋段，或者當這位面惡心善的男人戀愛時，明明不懂


  愛卻依然選擇以自己的方式勇敢去愛的「浪子回頭」，《當男人戀愛時》整部電影都在導


  演殷振豪豐富的 MV 執導經驗下，以強烈的配樂和歌曲賦予角色更為討喜的多樣面貌。




  因此雖然《當男人戀愛時》故事前段跟去年得到金馬最佳影片的《消失的情人節》一樣有


  著跟蹤狂或性騷擾的疑慮，但在這段原本因為不對等權力而發展出來的關係背後，《當男


  人戀愛時》卻也能利用像是抽十幾張號碼牌，以及保齡球館那段旁人看得都覺得丟臉的真


  情告白，讓我們清楚感受到就連許瑋甯所飾演的浩婷這位冰山美人也會被深深打動，那種


  男孩子最無可取代的天真浪漫。




  或許以討債為業的阿成不是個完美的情人，事實上他全身上下存在著無數能讓女生瞬間把


  他淘汰的缺陷，但也正是如此，通過地痞流氓那些霸道、粗魯、俗氣等外部形象的對比，


  阿成面對心愛女人所顯露出來的溫柔的真心，還有遇到事情總是把責任往自己身上攬，不


  願牽連到身邊任何珍愛之人的骨氣。從最初追求浩婷使用的伎倆，到得知罹患絕症、理解


  自身過錯後的最終選擇，《當男人戀愛時》邱澤那幾乎毫無破綻的角色詮釋，相信都讓所


  有觀眾看得揪心又難過。




  儘管《當男人戀愛時》所有故事發展都相當老套好猜，但《當男人戀愛時》先是在故事前


  段以讓人忍不住發笑的喜劇氛圍，讓觀眾充分感受到台式愛情電影的獨特夢幻色彩，並在


  故事後半段回歸社會現實，讓整部電影從愛情婚姻進一步延伸到父子、兄弟等家庭關係，


  藉由冰棒、粉蒸肉、飯糰、彩虹筆、理髮店招牌等重要元素逼出觀眾的眼淚，依舊以成果


  證明這類故事的萬年不敗。




  一直以來，作品裡有沒有能讓每位觀眾都能夠理解的價值核心，都是台灣電影最終能否在


  主流市場取得成功的關鍵。因此《當男人戀愛時》以浪子回頭作為整部電影的主題，看著


  片頭浩婷父親過世，阿成找來他這些年來通過把地下錢莊經營成「互助會」所累積的所有


  人脈前來幫忙，到最終他離世後這些曾受他幫助人們，以及所有親朋好友對於他的懷念和


  追憶，《男人戀愛時》都將韓國電影的賣座公式轉移到有著濃濃台味的本土國片之上，成


  就一部兼具創新突破與商業潛力的佳作。




  整體而言，同樣都是改編自韓國電影的作品，《當男人戀愛時》不僅沒有《比悲傷更悲傷


  的故事》那種水土不服的不協調感，反而還在黑幫和愛情兩種類型的互相結合之下，通過


  編導和邱澤、許瑋甯、蔡振南、鍾欣凌、Lulu黃路梓茵等幾位演員的重新詮釋，搭配燈光


  、鏡頭和音樂歌曲的運用，都讓這段小人物在寂寞世界找到彼此的愛情故事展現出觀眾非


  常熟悉，但在過去台灣電影裡卻也相對少見的獨特風格，確實值得我們給予高度的肯定。




  誰說不成熟就不值得擁有愛情？《當男人戀愛時》讓我看見當男人戀愛時身上宛如被陽光


  照射般的溫暖。或許在現今這個凡事都必須小心謹慎、考慮周全的時代，阿成這沉浸於愛


  情世界裡的浪子所具有的天真，也是我們最欠缺，但不知道為什麼總是被人們遺忘拋棄的


  寶貴面貌也說不定。



  --


