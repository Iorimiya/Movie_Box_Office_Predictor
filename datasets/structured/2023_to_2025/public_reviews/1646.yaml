  (重播)初一 06:30 PM ~ 09:00 PM   下一個節目 2/1初一 09:00 PM 屍速列車:感染半島




  導演：殷振豪


  演員：邱澤、許瑋甯、蔡振南、鍾欣凌、藍葦華、陽靚、黃路梓茵、白小櫻


  年度電影票房冠軍【當男人戀愛時】上映至今全台票房累積近4.1億元, 更擠進台灣電影

  影史票房紀錄第六名！台式新浪漫愛情電影【當男人戀愛時】，集結金獎卡司邱澤與許瑋

  甯CP組合，三金影帝蔡振南，金鐘視帝藍葦華、金鐘視后鍾欣凌、台北電影獎最佳女主角

  陽靚與去年甫獲金鐘獎最具潛力新人的白小櫻，再加上跨界挑戰的Lulu黃路梓茵加持演出

  ，演員陣容含金量爆表！劇情描述邱澤飾演的討債流氓，看似兇狠、實際上卻有顆柔軟的

  心，他在一次討債過程中對債主女兒許瑋甯一見鐘情，進而提出要用「塗鴉合約」，以吃

  飯、散步的方式來抵銷她們家的債務，這種吊兒啷噹的態度，簡直顛覆了債主女兒的世界

  ，兩人完全不對盤的個性，究竟會擦出怎麼樣的火花？


  【當男人戀愛時】導演殷振豪曾為樂團茄子蛋執導三支「浪子宇宙」MV在YouTube上點擊

  率累積破億，去年並以樂團告五人〈紅〉MV奪下金曲獎「最佳音樂錄影帶」大獎，作品受

  到各個世代的喜愛，首度執導電影長片【當男人戀愛時】，就和《紅衣小女孩》系列億萬

  票房導演程偉豪合作，兩人合作無間，攜手打造台灣影史上10大賣座愛情神作！【當男人

  戀愛時】更一舉入圍第58屆金馬獎「最佳新導演」、「最佳男主角」、「最佳女配角」及

  「最佳原創電影歌曲」四項獎項提名，邱澤更以【當男人戀愛時】榮獲第23屆台北電影獎

  最佳男主角。




  --'
