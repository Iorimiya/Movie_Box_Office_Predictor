title: '[新聞] 「當男人戀愛時」上映9日破億 邱澤、許瑋'
content: '「當男人戀愛時」上映9日破億 邱澤、許瑋甯回應了



  2021-04-10 18:03聯合報

  記者陳建嘉／即時報導


  邱澤、許瑋甯主演，殷振豪執導「當男人戀愛時」上映迄今已9日，話題不斷，票房終於

  正式破億，成為邱澤主演票房最高電影，他開心表示：「謝謝大家，希望看過的觀眾能再

  帶家人進戲院。」


  許瑋甯則回應：「阿成跟浩婷就像你我的縮影，或許生活汲汲營營，但心中其實溫暖又直

  率。真的很謝謝所有觀眾的支持，更開心大家喜歡這部電影。」導演殷振豪則說：「非常

  感謝觀眾的喜愛，讓我相信小人物也有站上舞台的一天。」電影目前仍在全台上映中，劇

  組本週末持續在戲院跑映後會全台粉絲，更期許票房能夠繼續往上衝。






  新聞網址：



  --'
