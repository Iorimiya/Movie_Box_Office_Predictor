url: https://www.ptt.cc/bbs/movie/M.1617804753.A.E4C.html
title: '[討論] 當男人戀愛時的哭點（有雷） '
content: '看板上討論，大家哭點好像不太一樣

  有些人因為入戲，雖然劇情老梗還是被情緒堆疊到哭，

  阿成為了避免拖累浩婷，既然被騙了錢乾脆直接分開，

  後面雖然後悔，但只要浩婷幸福我就幸福

  讓人逼出不少眼淚


  而有些人是親情喬段就哭，我就是這種

  阿成送藥、父子對話

  父親對阿成的反骨、孝順，又氣又疼愛，

  最後就算失智還是隱約記得幫阿成照顧好浩婷、

  跟哥哥不對盤但還是會互相著想，

  回馬槍的送燈，眼淚簡直用噴的

  蔡振南跟藍葦華的表現都好讚啊


  不知道大家哪段劇情是哭點呢？


  --'
