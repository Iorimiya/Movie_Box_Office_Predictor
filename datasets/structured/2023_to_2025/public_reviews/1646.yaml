title: '[雷] 當男人戀愛時'
content: '防雷



















  有的時候，看片對自己而言是種療程


  例如看國片「腿」

  moon river這首配樂一出來

  搭上桂綸鎂深情的獨白

  眼淚就會不自覺流出來

  因為觸動到自己對伴侶的投射


  好哭的電影怎能不去買個票療癒自己？

  於是「當男人戀愛時」

  浩婷父喪哭一次

  兩人情感糾葛哭一次

  阿成離世哭一次

  反而因為知道會有包裹而我沒有哭

  （看電影還是不要事前知道太多）


  唯一的笑

  落在了阿成欲推浩婷進hotel那段

  賊賊的喜感



  阿成這個角色塑造就是一個暖男

  只是他的暖經常不按牌理出牌

  在邱澤的演繹下

  很明顯的把坐牢前後演出了擁有兩個不同神情、甚至有心境年齡之別的阿成

  許瑋甯則是十分貼近這個角色

  真的很適合


  配角方面

  我反而很想知道導演為什麼會找lulu演這個角色

  是為了增加喜劇成份嗎？

  總覺得找一個較為豔麗的比較能詮釋這個性交易角色的風塵味

  Lulu形象實在太正派了


  也因為主戲、主視角都在阿成身上

  這些配角還真成為了一道菜上的裝飾品

  看起來就像擺一個箭頭在配角頭上說：—》她是妓女———這般潦草

  對角色沒有深刻的刻畫

  減少了共鳴很是可惜



  要說電影最不滿意的地方

  大概就是不滿意阿成那顆爆炸頭

  印象中哪個世代的8+9都沒流行過這種髮型

  導致我覺得這樣的造型設計有些刻意的不到位

  反而妨礙了演員神情的展現


  第二個則是ㄧ開場砸香爐在頭上的不連戲

  上一個鏡頭把血抹掉

  下一個鏡頭臉上抹掉痕跡消失的突兀


  再來就是阿成打架臉上流血

  浩婷不知道是因爲血漿黏太緊抹不太掉還是怎樣

  本來要伸手抹去忽然收手隨意抹抹

  令我有點出戲


  有些場景浩婷總是穿著制服

  一般人應該不會穿著可能被認出來的制服跟一個討債8+9到處跑

  現實上愛情還沒成功

  早就被同事中傷了


  阿成坐牢多久未知，但蔡姐都說「這麼多年了」

  那麼小學正發育的姪女也應該有長大才對


  以上這些細節我覺得是影響電影精緻度的硬傷


  另外我不懂國片的對白為什麼要那麼跳脫現實

  配角諸如開雜貨店的外籍人士、房東太太對白都超級生硬


  不過蔡姐後來競選議員

  洗白成功嘴臉的戲碼真令我出乎意料


  扣除這些不滿意

  整個療程還是非常順遂

  當眼淚噴射時

  生活中的各種壓力也得到同位釋放


  看這部電影可以給予自己一個合理的理由去宣洩生活中的負能量


  看完電影我沒有忘

  阿成與浩婷那段有始無終的遺憾


  也許可以繼續為浩婷拍個人生三部曲

  演到老也説不定


  --'
