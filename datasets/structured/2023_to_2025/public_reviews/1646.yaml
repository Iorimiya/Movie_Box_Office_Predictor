url: https://www.ptt.cc/bbs/movie/M.1617876108.A.DCA.html
title: '[無雷] 當男人戀愛時：成功三元素'
content: '此篇很像導演的造神文

  但我是真心由衷的覺得導演很棒

  圖文並茂閱讀版





  當男人戀愛時 (Man In Love)是由殷振豪執導，該片也是導演電影處女作。首先來認識一

  下導演吧，導演殷振豪和茄子蛋在2017年橫空出世，一首破億MV 《浪子回頭》，不管歌

  或影像擄獲眾人耳目，接著2019的《浪流連》也是一樣，再創高峰，茄子蛋和殷振豪就此

  綁在一起。



  細數殷導從2017~2020短短三年，就拍了33支MV作品，小時候唱KTV時最常看到的MV導演不

  外乎是馬宜中、鄺盛、黃中平、比爾賈、周格泰、陳奕仁等，隨著時間推移，我們也開始

  唱這個年代的新歌，不只歌手換人了，連導演也不再是過去熟識的人了，舉凡魏如萱《彼

  個所在》、周興哲《我很快樂》、畢書盡《撞》、田馥甄《懸日》等，幾乎成了歌手們出

  專輯必須合作的新銳導演，更於2020年31屆金曲獎以告五人的《紅》拿下最佳音樂錄影帶

  獎。



  我近期把殷導所拍過的MV作品看完一輪後，發現一件事，他簡直是時間魔術師，藉由一首

  歌的時間，把一個命題好好講完，俐落又誠懇。他不僅僅能拍出像《浪子回頭》、《浪流

  連》台灣味十足的故事，也能把李淳和孫可芳在日本的《我很快樂》，拍得很美很動人，

  范少勳在《撞》裡，那種小人物擁有偉大的夢想拍得很催淚。殷導成功的用作品說話，他

  不是只能拍很台灣味的作品，他更大的能力是「好好的說完一個故事」。



  當男人戀愛時改編自韓國「不標準情人」，雖是改編，但編劇藉由角色的塑造，再加上超

  貼近民情的對白與環境，讓人完全不會因為不合時宜的情節或設定而出戲，留下骨架，換

  了一副好皮囊，奠定了此部作品成功的好基因。



  即使有一個好故事和一位好導演，這還不夠，必須還要有能撐起角色的好演員。男主角流

  氓阿成由邱澤飾演，早在2018年「誰先愛上他的」就被邱澤的演技給征服，他那一雙會說

  話的眼睛，任誰直盯三秒都會為他失魂，雖然那年他無緣騎馬，那今年金馬獎必須先幫他

  預留一個席位。阿成幾顆特寫鏡頭情緒處理得特別好，但最圈粉的無疑是此片裡他自成一

  格的喜劇節奏，很難想像讓人覺得很有距離的邱澤，看起來很ㄐㄧㄥ的邱澤，也能如此淘

  氣和滑稽。



  許瑋甯飾演的農會欠債女吳浩婷也是特別亮眼，上映前貌似有些質疑這個選擇的不恰當，

  但當我走出戲院時，我覺得這個選角超好。被大多數人挑剔不外乎是許瑋甯那不輪轉的台

  語腔，確實不輪轉，但似乎不影響觀影品質，甚至多了一點萌感，反倒成了加分效果。而

  且，許瑋甯真的好美，美到看她後面失落、落寞的樣子都忍不住為她心疼。



  接著配角也不馬虎，南哥動人的演技，加上婆婆鍾欣凌霸氣十足的奸詐婦人，還有藍葦華

  哥哥最後那一哭，簡直為此片做了最棒的起承轉合，這三位金鐘常客也是功不可沒的重要

  功臣。



  推薦給愛看電影的大家進戲院支持用心的國片，也期待殷導未來能自己操刀，再講一個具

  台灣味的好故事吧。



  話說，我看完第一個感想其實是，怎麼像在看「角頭-浪流連」的阿慶愛上「消失的情人

  節」楊曉淇的故事，流氓愛上櫃台女。



  最後預祝本周末破億。




  --

  04/08 19:47

  感謝校正，發個文壓力好大啊Orz

  不懂，部落格紀錄看過的作品礙到誰了？賺點閱？我可以獲得什麼？

  沒關係，那些我都沒有很在意，但還是很謝謝你熱衷於找錯字！'
