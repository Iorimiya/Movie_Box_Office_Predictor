url: https://www.ptt.cc/bbs/movie/M.1618204999.A.EF8.html
title: '[ 普雷]  當男人戀愛時'
content: '邱澤演技很棒，

  蔡振南和鍾欣凌也在水準之上，

  許瑋甯差一點，但也相當不錯了。


  再來一些台灣元素也很到位，

  是紮紮實實的親切感。


  可惜整部戲的劇本很糟糕，

  我相信大多數的「高知識份子」，

  都會看到尷尬癌發作，

  覺得自己幹嘛來電影院浪費時間浪費錢。


  不過社會上的「中低知識份子」，

  應該會很吃這一種口味，

  否則小玉、放火、聖結石，

  也不可能變成人氣網紅。


  只能說這部戲很吃電波，

  愛的應該很愛，

  哭到死去活來都不奇怪，

  可如果你智識素養高一點，

  這部戲應該吃不太下去，

  就當做捐款做慈善，

  鼓勵台灣電影產業吧？



  --'
