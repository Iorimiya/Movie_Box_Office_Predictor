title: 'Re: [討論] 當男人戀愛時，為啥要把爸爸丟給女朋友'
content: '我是昨天在Netflix上看的，其實還算讓人感動的一部片，邱澤演得很好。


  這段我看到的是阿成跟爸爸說要他把自己也當作浩婷的爸爸。我的解讀是，阿成希望浩婷有家人、不孤單。在阿成跟浩婷提結婚時，他說希望讓浩婷爸爸知道浩婷不孤單，有人照顧他。所以我想阿成是希望他走後，浩婷也不會是孤單一個人。阿成爸爸最後還說了一句，都走了還這麼麻煩，我想其實是反過來希望爸爸可以給浩婷一些家的感覺。


