url: https://www.ptt.cc/bbs/movie/M.1632309853.A.A22.html
title: '[ 負雷]  當男人戀愛時'
content: "沒看過韓版也沒打算比較，\n甚至可以說看完台版我都不打算看韓版了，所以不用跟我543。\n\n老實說，劇情太狗血是致命傷，然後就是表現方式太過濫情。\n\
  這個狗血要在兩小時內撒完也真夠嗆得，真的寧可他們拍電視劇，還不會這麼令人反感\n 。\n\n首先，邱澤的台客，到底是哪個年代來的？？\n浮誇的造型跟語調、行為模式，真的讓人很出戲。\n\
  整個戲感覺背景是民國50-60年代，連約會模式跟理髮院、冰果室、保齡球場都看起來很\n過時，但明明主角拿的又是智慧型手機，真的讓人無法入戲。\n不是說台灣鄉下不是這種生活風景，只是覺得連他小侄女都受韓流影響，阿成的角色感\n\
  覺反而像刻意在裝俗。你不如找鳳梨薯薯來演還比較像吧？\n\n其次，阿成最後說頭部太常受重擊造成腫瘤，但從開場砸香爐開始，我看他根本沒那麼\n常被打，幾乎都是在自毆啊？\n\
  討債歸討債，他們也不是一次收多大筆，動不動就幾千幾千少拿（不是人家沒給，是他\n自己三八退回去），但他又不是從自己收入補上去，然後也是幾千幾千花在開小姐、侄\n\
  女零用錢，真的無法理解他是金錢觀有問題還是工作倫理有問題？？\n\n第三，這麼不願意討債，良心過不去，卻又不早點辭，不是蔡姐不放他，蔡姐那都算不\n上威逼，充其量利誘，分明是他自己貪心作祟才把浩婷錢賠進去的。\n\
  很多人在討論蔡姐到底算正還邪，我只能說，他大概沒違法到被抓的程度，就這麼簡單\n。\n\n浩婷的設定我也是不得不吐槽，前面裝窮，結果他爸一死他突然保險金也來、貸款也下\n\
  來，\n以農會這種鐵飯碗，的確貸款應該很好貸，為何爸爸生前不貸下來還債、交住院費？？\n\n保險也是，除了少數解約會拿不回來的，是有什麼理由窮到要借錢莊而不能支用的？？\n\
  ？\n我們都知道家有病人就是拖油瓶，但你這號孝女也真的是迎風高飛咧？厲害。\n\n結果不管男主還女主，根本就犯賤自找啊？？命運弄人是一回事，但我看起來這兩位是\n\
  自弄不忘弄人吧根本。\n\n你農會鐵飯碗好好的，幹嘛要開珍奶店？為阿成謀頭路的方法多得是吧？\n而且就算有存摺印章，能直接大筆提走的機率是？？浩婷自己就農會員工，阿成能在他\n\
  眼皮底下把錢弄走，簡直台客之光了吧？\n\n少數我覺得好的鋪陳是蔡姐選民代，真的就台灣風景，至於有沒有影射誰我就不知道了\n。\n另外阿成他爸老人癡呆的部分不錯，南哥不愧資深，演技看得到。\n\
  \n這個電影真的少數我想快轉的國片，愛邱澤愛了很多年，但覺得他還是專心拍電視劇才\n是正途。\n\n幸好我是Netflix順便看的，不然我可能會不斷翻白眼吧。\n\
  \n\n--\n什麼時候電影版還不准發負雷文了？當你家啊？\n公三小？？\n難道你不會說「花錢買遊戲」嗎？\n照你的邏輯花跟買也一樣？？\n花跟開一樣，你是花錢還是花小姐？\n\
  有病啊還連噓？護航就護航還搞這麼難看\n呵呵，回樓上也要用噓的\n你護航有種噓到XX\n看我會不會去檢舉你\nNetflix還不支援快轉真的很low\n不過很多人說原版比較好？\n\
  我是無意去浪費時間找來看啦\n不懂台幹嘛要這麼刻意？\n很多人台得自然流露才厲害\n他說要賣珍奶的時候我一度以為他是要演珍奶創始的故事\n但浩婷的智慧型手機我整個出戲\n\
  你是噓電影還是噓我能講清楚嗎？\n不爽電影也犯不著噓我吧？？\n但他身材真的沒看頭\n有嗎？！支援所有節目嗎？？\n被你笑死\n重點他講的跟國文也無關\n為噓而噓一直魯小小\n\
  整篇就他一個人狂噓，無言\n關 你 屁 事？？？？？\n你國文造詣不可能比我好的啦，護航就護航刷什麼存在感？\n你們懂我的不爽\n有你們的噓文廢嗎？\n你表達贊同我的方式是噓我？\n\
  我也覺得，那段反而讓人覺得阿成活該貪心\n？？？？共三小？？\n他就自找的然後不讓人點出來？？\n你的句子完全無法表示意思你知道嗎\n完全無法理解，可能片商公關厲害\n\
  我是從頭到尾哭不出來啦……\n看完覺得浪費人生"
