title: '[好雷] 當男人戀愛時有人從女主出現就開始'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  「當男人戀愛時」


  劇裡讓我哭的 都是吳浩婷


  有人跟我一樣從女主出現就開始哭嗎







  電影前半段


  浩婷為了照顧父親

  白天上班 晚上醫院兩地跑

  醫藥費湊不出 生活費也不知在哪

  親戚跑的跑 沒人願意與你有交集

  又遇上討債的 耍兇狠沒有用

  他們更兇

  放不下父親 就全部擔下來

  一層一層的壓力往身上 壓得喘不過氣

  遇上阿成真的是笑不出來

  但他的善良認真 是看得出來的

  阿成的真誠、內心的溫柔打動了她

  原本只有浩婷一人家屬的葬禮

  也因為阿成變得體面

  但兩人原本的夢想 瞬間烏有

  感情也沒有了

  「從來沒愛過...」是最傷人的話

  付出這麼多 怎麼可能是假

  「你以為欠我的是這些嗎？」

  感情才是 欠最多也越還不了

  放不下 送到了醫院後

  原來 剩下沒有多少時間了

  聽到了最後一句我愛你

  往後 男友爸爸當成自己爸爸

  浩婷接下來的生活

  應該就是替阿成照顧父親

  和之前一樣 阿成認真對待浩婷爸爸

  -

  看完這部 帶入感很深

  因為電影很生活


  我是半個吳浩婷

  很多時候自己撐著

  過著過著 都變成了日常


  有人說劇情狗血

  但其實都離我們不遠

  以上只是個人感覺

  看不懂的也不用太認真喔


  --'
