title: '[微好雷] 當男人戀愛時'
content: '雷文防雷資訊頁






  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~









  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  先說我本身完全沒看過韓國版本


  一開始邱澤的出場讓我完全感覺不到他是邱澤

  操著一口流利台語加上玉米鬚爆炸頭

  讓我一直很難連結(對他的印象還停留在小資女孩)


  至於劇情就是個老梗

  農會行員乖乖女愛上8+9的反差劇情所產生的爆點

  (讓我出戲 想到消失的情人節之郵局櫃員XD)

  再加上電影裡很愛用的微小細節鋪梗再反推

  塗鴉合約 彩虹筆 壞掉的髮廊三色旋轉燈

  家人欠債所衍生的各種狗血劇情

  不過在這部電影裡都能夠很幽默的表現出來


  感人的部分當然就是邱澤與許瑋甯的互動

  讓人覺得非常的自然而甜蜜

  但是從黑吃黑以及生病就醫的劇情

  還沒劇終就可以預見悲劇的結局

  人在江湖身不由己  出來跑總是要還

  阿成受到委屈卻選擇不說而獨自承受

  似乎也是一貫的劇情手法

  不過配角很有存在感也是這部片的亮點

  芽芽一出場就讓人臉紅心跳

  蔡姊則是讓人恨得牙癢癢

  (不然阿成跟浩婷就可以幸福快樂過日子了)


  雖然是靠男女主角撐起來的一部片

  而且中後段的處理有點零碎

  雖然有堆疊  但個人覺得不夠深刻

  (或許礙於電影時間)

  但還是滿推薦可以去電影院看


  --'
