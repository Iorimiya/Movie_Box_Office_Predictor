content: '沒看完

  中間直接看維基百科補完劇情

  發現幸好沒看完


  邱澤演技不錯

  只是這劇本、這人設

  就是寫給未成年少女看的吧

  對這種社會底層人物的神秘感有著不切實際的幻想


  倘若有點深度

  寫實一點把黑暗面刻畫進去整部片才有血有肉

  不然就是個少女思春的套路而已了


  突然發現好像一點雷都沒有耶


  --'
