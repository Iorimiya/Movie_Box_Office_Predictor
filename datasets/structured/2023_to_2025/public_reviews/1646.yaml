url: https://www.ptt.cc/bbs/movie/M.1639534385.A.3EE.html
title: '[討論] 當男人戀愛時，有夠好看'
content: '這部劇簡單來說貫徹了愛情的真諦。


  俗話說：嫁雞隨雞，嫁狗隨狗。劇中女主愛到+9始終不離不棄，確實相當感人。


  男主也是有義氣，雖然到處作姦犯科但是還是有一顆善良的心。討生活麻，不容易啊。好

  手好腳不做正當工作，讓自己的頭天天被打。也算是真。血汗錢了



  男主最後雖然死了，但有留下一個沒用的老人，讓女主可以負擔一輩子，看到老頭就想起

