url: https://www.ptt.cc/bbs/movie/M.1617887108.A.4B6.html
title: '[請益] 當男人戀愛時 劇情台韓的感受不同?'
content: '餓死抬頭 其實一開始只有看台版的

  會覺得 劇情很瞎 然後也很多橋段很生硬

  不過後來有重新去補韓版的電影

  發現其實整個劇本翻拍得很好 經典橋段跟本土化都很到位

  就整個依照韓版劇情架構 翻拍內容是很完整的


  但不知道為什麼 韓版跟台版 劇情類似的情況

  感受度卻大不相同

  比方說阿成這腳色 韓版真的很有那個混混感 台版的8+9雖然也雷同

  但感覺起來好像就有點不太合味道

  還有韓版的大叔 開理容院的老哥 整個劇情基本上都一樣

  不過不知道為什麼套在台版的環境就很像生硬的八點檔


  後來發現劇情是一樣 但感受差異蠻大的

  不確定是不是腳本的套用環境有差

  大家不知道有沒有類似感覺


  --

  Sent from my Windows


  --'
