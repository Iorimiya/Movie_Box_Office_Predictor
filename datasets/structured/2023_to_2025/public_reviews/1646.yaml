title: 'Re: [討論] 當男人戀愛時 有比許瑋甯更適合的女主嗎？'
content: '簡嫚書阿

  台劇創業的那些鳥事證明演技不差

  長相可愛身材好，台語也不錯，大稻埕女主全程台語


