url: https://www.ptt.cc/bbs/movie/M.1617806233.A.935.html
title: '[負無雷] 當男人戀愛時 又一部為了主題曲進戲院'
content: '雖然原本已經知道是韓國電影翻拍

  可是沒想到會是這麼老哏大集合

  劇情發展走向很好猜，沒什麼亮點

  像看一部製作比較精良的八點檔+偶像劇


  殷振豪導演的製作質感沒話說

  他導的MV大部分也沒很棒

  尤其最愛茄子蛋的這款自作多情

  但他在MV慣用的手法跟風格拿來用在電影

  我自己看完覺得就有點太膩了

  很像看加長很長的MV

  不過很值得讚許的是主題曲找茄子蛋

  我承認我最主要是為了這首歌才買票的

  只是或許太愛這首歌，讓期望值也更高

  看完是蠻失望的。


  喔對了，除了主題曲，

  裡頭另一首茄子蛋的舊歌日常

  在這裡有畫龍點睛的感覺

  本來已經頻頻看手錶想說什麼時候要跑字幕

  而日常下的點很棒，讓我注意力稍微回來一點。


  此外值得一提的還有大部分的主演

  邱澤好幾場戲有得獎場的潛力

  看好他今年再問鼎影帝

  而女角我最愛的是Lulu，

  本來對她沒什麼特別的期待

  沒想到她一出場整個充滿亮點

  可惜戲份太少，若要爭取獎項很弱勢

  許瑋甯我則覺得受限於劇本，

  她的表現雖然很好，

  可是不如在16個夏天裡面給我驚喜的感覺

  且她的台語卡卡，真的很可惜

  至於鍾欣凌，她的個人形象太鮮明

  我怎麼看都還是鍾欣凌...


  結論，雖然我對這部片是失望的，

  主要是對劇情還有節奏不滿意

  但還是看好他前進今年的金馬獎，

  演員、音樂、美術、攝影等等都是在水準之上。




  -----

  Sent from JPTT on my iPhone


  --'
