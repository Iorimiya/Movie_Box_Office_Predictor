url: https://www.ptt.cc/bbs/movie/M.1620053839.A.8A8.html
title: '[新聞] 傑森史塔森將「當男人戀愛時」趕下票房冠軍寶座'
content: "新聞網址：\n\n2021-05-03 18:54 聯合報 記者蘇詠智／即時報導\n\n邱澤、許瑋甯主演的賣座強片「當男人戀愛時」稱霸全台票房榜將近一個月，終於在勞動\n\
  節連假被英國男星傑森史塔森最新動作片「玩命鈔劫」拉下王座，但累積數字也已破3億\n7000萬元，即將再往4億台幣的里程碑邁進。\n\n「當男人戀愛時」在傳統上並非熱門黃金檔的4月開出大紅盤，讓電影圈人士都感到驚喜\n\
  與振奮。緊接著該片推出另一部國片「聽見歌 再唱」，雖然沒有那麼驚人的反應，卻因\n口碑強勁，維持出色的跌幅，全台票房已破6400萬元，同樣表現超乎預期。接連兩部國片\n\
  強打令業界受到鼓舞，期盼好萊塢巨片要陸續回歸的5月開始，觀眾還能有繼續支持國片\n的熱情。\n\n「當男人戀愛時」讓「真人快打」、「名偵探柯南」等都成了手下敗將，「玩命鈔劫」在\n\
  它上映快一個月後推出，又祭出傑森史塔森和「兩根槍管」英倫名導兼瑪丹娜前夫蓋瑞奇\n再聯手，總算成功取而代之，成為台灣賣座排行榜上的新冠軍，隨著美國大片將要回歸，\n\
  還能在冠軍寶座上坐多久？也成了矚目焦點。\n\n今年勞動節因有連假，許多人走進戲院、欣賞院線大片，而因奧斯卡金像獎延後快兩個月\n才頒發，幾部獲獎影片跟著被帶旺，尤其以逆轉勝奪影帝的安東尼霍普金斯「父親」獲益\n\
  最大。最佳影片、導演、女主角得主「游牧人生」已在台上映一個多月，拉抬有限，卻也\n多少有些幫助；描述韓國移民在美國生活的「夢想之地」相較之下得到的加持略為有限，\n\
  和韓劇在台呼風喚雨的氣勢有差。\n\n而在復甦中的北美票房，不知是否因上周「真人快打」和「鬼滅之刃劇場版 無限列車篇\n」雙雙開出超乎預期的出色數字，本周兩片賣座下滑幅度都大，「鬼滅之刃劇場版\
  \ 無限\n列車篇」反而小贏「真人快打」，後來居上奪得冠軍。\n--\n        \n\n\n\n--"
