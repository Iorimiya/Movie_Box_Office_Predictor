url: https://www.ptt.cc/bbs/movie/M.1621139203.A.F70.html
title: '[新聞] 《當男人戀愛時》票房難超《少女時代》'
content: '新聞網址：


  【三級警戒影城暫停業】《當男人戀愛時》票房難超《少女時代》　《聽見歌 再唱》破

  億卡關


  上報流行 2021年05月15日 16:30:00



  疫情爆發，雙北防疫升至三級，戲院比照規定陸續停業，不少電影不是撤檔就是延後上映

  ，仍在上映的《當男人戀愛時》好在票房已破4億，且處在收尾階段，影響不大，可惜只

  差700萬就可超越《我的少女時代》，登上台灣票房史上第五名，看來是機會渺茫了。




  根據疫情指揮中心公告的防疫三級規定，龍頭戲院威秀影城今（15日）起發布信義、松仁

  、京站、板橋和林口全面關閉到5月28日。秀泰影城也發布旗下雙北的今日秀泰、欣欣秀

  泰、樹林、土城、板橋和東南亞秀泰等影城，自5月15日至5月28日停止營業；國賓影城同

  樣宣布暫停營業。



  ----------------------------------------------------------------------------


  其實我覺得當男人戀愛時已經非常非常強運了

  上映的時間剛好是台灣疫情控制最好的時候（部桃之後，諾富特之前）

  雖然最後可能會差幾百萬無法超越我的少女時代，但也暇不掩瑜了吧




  --'
