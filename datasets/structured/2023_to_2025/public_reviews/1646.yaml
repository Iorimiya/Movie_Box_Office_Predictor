url: https://www.ptt.cc/bbs/movie/M.1616930989.A.B2A.html
title: '[好雷] 當男人戀愛時'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  .

  .

  .

  .

  防雷頁

  .

  .

  .

  .

  .

  在電影之前

  茄子蛋出了電影主題曲MV《愛情你比我想的閣較偉大》

  就被打中了，一定要去電影院看

  許瑋甯和邱澤的搭配其實蠻亮眼的

  原本以為許瑋甯演的角色可能都是一些知性的女角

  沒想到演活了一個看透現實的甘草人物！


  邱澤真的不用多說，整個眼神連眼睛都有戲

  從誰先愛上他的土台客到甘草人物小混混

  從不懂愛的小男孩到懂得付出的男人

  他用細膩的表演方式，表達出對心愛人的愛

  就如同電影裡提到

  看到浩婷的時候，第一眼就愛上她了


  「愛情你比我想得還要偉大 你給我這輩子最後的期待」


  這部電影若作為愛情電影會覺得很甜，

  為了逗另一半笑或是希望彼此更好而付出各種自己

  不論是默默付出或是做傻事

  而不只是愛情戲，還有其他面向，像是親情、兄弟道義等，

  看到從不懂愛的男子到期待有共同未來的那一刻，

  即使被騙、即使犧牲生命也要浩婷快樂開心地活著，

  希望有人好好照顧她。


  後來查資料才知道原來當男人戀愛時是從韓國電影改編，

  不過我覺得電影中有非常多台灣元素、場景、音樂，

  特別是音樂，搭配茄子蛋的歌真的恰到好處，

  導演殷振豪有種把浪子宇宙延伸到電影的感覺，

  不管是愛情你比我想的閣較偉大

  還是日常（沒記錯的話），所有的橋段都搭配得恰到好處。

  可說是很有台灣味的改編，很到位


  --'
