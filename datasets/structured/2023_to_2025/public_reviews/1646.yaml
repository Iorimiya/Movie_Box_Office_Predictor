url: https://www.ptt.cc/bbs/movie/M.1617988320.A.E21.html
title: '[好雷]當男人戀愛時：描述的就是每個人的日常'
content: '雷文防雷資訊頁


  防

  個

  雷

  應

  該

  夠

  了

  吧



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  邱澤跟鍾欣凌的演技真的超級加分，特別是鍾欣凌，沒想到還有這樣奸詐的一面，每個眼

  神每段語氣的結尾真的都是神來一筆。事實上，我認為這部片大致上能夠分為三條線：



  ---------------------------------------------------------------------



  「你說你愛我，你愛我哪裡呀？」，女主角這樣問著男主角。

  「妳...腿長，聞起來香香的。」，男主角木訥，全場觀眾為有些尷尬的男主角笑了。


  可是回想起我們人生中的那些時刻，想起了《奇葩說》的那個橋段：




  從阿成與吳浩婷的互動中，我們能看到的是阿成青澀的追著一個女生的模樣，當然我覺

  得更多的是看到那些熟悉的方式，那些青春年代的我們曾經用過的方式，送飲料、寫合約

  、想盡辦法約會...。只為了想辦法靠近心中的那個他更近一點點，我們都想在對方心裡

  的分數再高那麼一點點。看著他們兩個的互動，


  當然，瑪麗更早的就離開了亞瑟，只是在看完電影、被拒絕後選擇了將戒指退回去，結束

  了那段感情。而吳浩婷雖然還是不諒解阿成，但在最後的最後仍然回頭相擁，陪伴他走到

  了生命最後一刻。所以雖然相似，但比起亞瑟，阿成是更幸福的吧。


  兩個人或許都在生命的最後收穫了內心的平靜，但阿成的身旁，還有那個人。而關於兩段

  感情的故事我覺得，就跟其他感情一樣，所有人都想做出對大家都好的選擇，然後我們就

  錯過了。歸根結底或許沒有誰對誰錯的問題，就只是錯過了而已。


  雖然不知道是不是有結果

  ，但兩人相愛，將心力投入此時此刻，那或許就是圓滿。

  ---------------------------------------------------------------------


  其實與其說是親情，我更想說的是在男主角與他姪女的親情互動、以及女主角先是照顧她

  爸爸、然後照顧病重的男主角、最後照顧男主角的爸爸，這一系列與親情有關的東西，我

  看到了這四個字。


  我從阿成哥哥的女兒身上看到了「拜金」兩個字，然而阿成是個遊手好閒的混混、阿成哥

  哥早年經商失敗還欠了一屁股債，就連阿成臨走前跟姪女說的都是：，而他姪女從小就花錢化妝打扮，甚至挪用補習費。


  可這個世界的視野，真的只有「金錢」嗎？然後女主角吳浩婷在農會上班，但爸爸住院付

  不起醫藥費、然後愛上的男朋友走了之後又要照顧男朋友失智的爸爸，這樣一直照料下去

  ，何時到個頭啊？一個人一輩子最精華的時光，都用在了這裡呀。那麼，她對於未來感情

  的憧憬、與對生活的期待呢？是不是已經被無情的生活打擊到起不來？就跟或許在這個社

  會上已經工作幾年、那個夜闌人靜時的我們，心中所想起的念頭一樣。


  特別談的是片中阿成的哥哥的女兒，我不知道她的未來會是什麼樣，但我衷心的希望她能

  看到更開闊的世界與有更開闊的視野，而不是人生就此被「金錢」所定義，這裏我想引用

  ，

  回歸片中的小女孩，我看到的是她過早被設定了人生的景觀，甚至無法想像山河、星辰與

  大海，或許過早的把金錢當成了人生唯一的答案，而我真心的希望，如果社會上有很多這

  樣的家庭，那這些事情可以少發生一點點，讓孩子自由的探索、發展，活出不一樣的精彩

  。


  ---------------------------------------------------------------------




  生活總是逼人的，這個故事中描繪的是一群被生活所逼迫的人仍然追求著那段真摯的愛情

  。因為生活，所以這條愛情路走得並不那麼順利，甚至不會有一個好結果。片中的人物們

  一個個都被生活霸凌衝擊的體無完膚。生活不容易，但互相扶持，那便是了。

  --


  我很難用單純的某個標籤來形容這部片，因為《當男人戀愛時》就是描述了你我日常的柴

  米油鹽，但或許也是這個時代，我們最需要的東西，然後起身，帶著對未來的憧憬，繼續

  向前。因為我們人啊，本來就需要幻想，不論是理想中的愛情、或者自己的夢想與目標，

  都是，我們的確需要這些，才能繼續向前走。


