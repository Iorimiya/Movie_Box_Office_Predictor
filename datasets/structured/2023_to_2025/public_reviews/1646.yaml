title: '[討論] 當男人戀愛時 有比邱澤更好的男主嗎？'
content: '如題，朋友都說邱澤詮釋阿成非常適合，我也覺得演得很好。

  但我開始想有哪些演員也適合這個角色：

  我對國片比較有印象的男演員就是吳慷仁、鄭人碩

  吳感覺太書生，無法演出那種流氓的感覺

  鄭感覺又太像流氓，反而無法詮釋阿成痞痞的那種氣質

  想請問大家覺得有其他適合的人選嗎？

  還是這部男主角非邱澤莫屬了呢？

  -

  題外話，

  差點把邱澤跟鳳小岳搞混，不知道同樣演過流氓的鳳小岳跟阮經天適不適合當阿成呢？

  個人覺得鳳好像可以，阮跟鄭人碩一樣太兇了


  --'
