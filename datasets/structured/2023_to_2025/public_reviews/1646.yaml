url: https://www.ptt.cc/bbs/movie/M.1618196776.A.D46.html
title: '[普好雷] 當男人戀愛時：把笑容變成日常'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  也許是因為觀影前接受到許多大量的好評訊息，讓我對這部片抱有高度的期待感，雖然在前半部分有些劇情參雜的笑點幽默可愛，但更多讓我困惑而無法忽視的點盤旋在我腦中導致我產生失望感，


  如果劇情最後只停留在男主角因病去世那裡的話，我可能會覺得這只是又一部俗爛的芭樂劇而已。




  其中有幾個部份讓我困惑又惱火，第一是劇情把男主角塑造成一個好流氓的形象，我覺得這部分是成功的，但顯得過度。


  明明在劇情中男主角因為哥哥生意失敗而被帶來討債用工作還債，從劇情中的對話也有透露債務是沒有還完的，但男主角老好人到我都懷疑他根本上就是沒有負債的慈善爆發戶，回收的款項打個七八折，還會提供額外贊助，女主角父親債務也可以讓他用填滿格子勾銷，頓時讓我覺得一切都很荒謬，他真的是幹討債的嗎？



  再來是男主角哥哥跟男主角吵架那段，明明男主角就是為了幫他還債才被帶入這樣的生活，哥哥說的話卻是責備男主，即便男主角入獄可能是害父親加速失智的原因之一，還有他長期以來的職業肯定是替家裡添了不少麻煩，那可是讓男主角進入這種可能會長期進出警局的生活不就也是因為哥哥生意失敗而所間接釀成的，


  看到這段的時候情緒上覺得有點莫名其妙，不過後面上樓男主角與父親的對談，一直到結尾的部分，確實有觸動到我讓我把分數又加了回來，即便覺得芭樂，還是有讓我哭出來。



  其實後來離場的時候有仔細思考過，有些我覺得特別荒謬的部分，有部分原因是遇到類似的事情我並不會這麼做，所以覺得荒謬。像幫不喜歡自己的追求者的父親辦葬禮，感動歸感動，但現實發生這種事我還是覺得既莫名又可怕。


  但用太現實的想法看電影其實也有失去一點樂趣，嘗試套入這個角色的個性的話，我會覺得他的行為、他的付出是契合他這個人的，單純、沒有想太多，純粹為了自己覺得好的事情付出行動，會白目、但當然也會讓人感動。




  整體而言其實就如同先前板上有人說的，整部片看上去有如加長版的ＭＶ，這部電影讓我最喜歡的部分，的確也是加進了茄子蛋＜日常＞配樂的後半部份，經典台詞「今天要開心」讓我想到了歌詞「把笑容變成日常」，讓我虐心。


  如果這部片被剪成大約七八分鐘的ＭＶ，我會非常喜歡，開玩笑說的說，如果整部片只留下幾個重要的句子，然後刪掉多餘對話加上合適的音樂把他弄成茄子蛋整個專輯的ＭＶ大合集，說不定我會更喜歡，因為我覺得導演用畫面說故事的技巧比加上對話敘事要來得更好。




  雖然前面不喜歡的地方講得比喜歡的地方還多，但有幾個部分還是讓我很感動。


  第一是放屁，當女主角在最後說出：｢我也愛你。｣的時候我眼淚就忍不住了，每一對情侶都有他們我愛你的表達、說話方式，也許無聊、也許可愛、也許嚴肅，但這個「我愛你」是只有兩個人知道的暗語，是兩個人心底的秘密，是一條隱形的線，綁在倆人的手，細細的，但輕輕一拉卻能輕易的把兩個人拉近，不管現實的距離，還是生死的距離。



  第二是最後男主角送哥哥的理髮廳旋轉燈，舊的燈前面時常故障，總是要敲擊一下才能恢復正常，好像男主角的生活，從一開始善良但渾渾噩噩，過一日算一日的日子，遇上了敲擊他心頭的女主角，此時世界好像才開始旋轉，要離開的時候再也無法旋轉的燈，也好像告訴他時間已經到了。


  最後哥哥拆開來的新燈，還沒接電，但眼裡彷彿已經看見他掛在牆面旋轉的樣子，好像看見男主角不斷地、不斷地在愛他的人心中轉啊轉的，不是掛在牆上，是掛在心上。




  掛在心裡的話，那就不會故障了。



  -----

  Sent from JPTT on my iPhone


  --'
