url: https://www.ptt.cc/bbs/movie/M.1617280408.A.36E.html
title: '[  好雷] 當男人戀愛時之邱澤真的進步好多'
content: '雷文防雷資訊頁


  -

  -

  -

  -

  -

  —

  -


  -

  -

  —


  本篇微雷


  剛剛看完，帶著很多水餃出來

  如果你是哭點低的人記得攜帶面紙進場

  帶大包的


  流氓與小姐的愛情故事


  很老梗，但很好笑



  前陣子剛好看到以前邱澤演的必取女人



  演技實在大躍進


  邱澤完全有把辣個流氓的港覺演的很好


  一個有愛的流氓


  我想起誰先愛上他的裡面的小王


  一樣是演浪子，但是浪出不同新高度


  這次又比上次揣摩角色更細膩很多了


  眼神 表情 動作細節


  雖然說，人帥真好其實還是有所本


  如果那個流氓長得不是帥哥，裡面虧妹的招數


  應該真的會報警


  請不要運用在現實生活中


  特別是抽號碼牌還有跟蹤女生


  XDDDDDD



  萬萬沒想到後面劇情的發展居然是BE


  編劇你好好寫不行嗎


  人生這麼苦


  前面給點糖


  後面又要給毒藥


  為什麼不能來點童話故事呢


  被關都關了......:(((((((((((



  後面蔡爸的演出也是很賺人熱淚


  看到那個送哥哥禮物的時候......麻煩再給我一包衛生紙


  覺得是一部值得的看的國片


  雖然有點老梗，但演員群張力滿好的


  大家一定要進戲院看看囉～～



  值得拿獎的邱澤啊～


  後記


  補完韓版之後覺得


  台灣把很多草根性的細節補滿

  演員間的關係也加深很多連結


  更多會心一笑，也能更加完整男女主角跟家人的感情深刻度


  導演編劇讚讚的~



  --


  誰先愛上他 這部電影之前，他在劇場磨練過一段時日，真的大變身

  我沒看韓版，但結局就是（淚）

  我看他在誰先愛上他的開始發現他演技變很好（這個意思


  他是在更之前 在劇場磨練出來的

  可惜沒看到他的暗戀桃花源....'
