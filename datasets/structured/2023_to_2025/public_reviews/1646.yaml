url: https://www.ptt.cc/bbs/movie/M.1619698853.A.AB5.html
title: '[新聞] 《當男人戀愛時》賣破3.4億 邱澤打鬥戲'
content: '新聞網址：



  《當男人戀愛時》賣破3.4億 邱澤打鬥戲堅持親自上陣



  〔記者吳琬婷／台北報導〕《當男人戀愛時》上映至今全台票房已累積3.4億元，票房佳

  績為台灣電影影史紀錄第七名，今日發布電影幕後花絮製作篇，導演殷振豪透露他對於改

  編自韓國電影的壓力之大，決心增添台灣文化的在地元素在片中，因此製作團隊在角色田

  調、人物情感及文化視覺上下足苦功。


  此外，導演殷振豪希望替《當男人戀愛時》加入真實殘酷的氛圍，因此安排男主角邱澤在

  片中有多場情緒激動的打鬥戲，豈料邱澤都堅持親自上場演出，常常下戲時累到體力透支

  ，有時候甚至會不小心掛彩受傷。


  導演殷振豪透露，希望可以讓沒看過韓版的觀眾一看到《當男人戀愛時》，就覺得這是從

  台灣長出來的電影，製作團隊在角色田調、人物情感及文化視覺上下足苦功，不僅四處走

  訪中壢和桃園一帶新住民的商店與餐廳，並在許多傳統市場內發現鍾欣凌所飾演的「蔡姐

  」原型，更實際訪問到一些賭場和討債集團的員工，將角色建立得更加立體完整。


  此外，製作團隊也用心拆解台灣街道的元素，將常見的色彩、字型與排版重新排列組合，

  並搭建組裝成充滿台式新美學的拍攝場景，另外還加入台灣觀眾都很有共鳴的食物元素，

  對於出現在鏡頭內的每個小細節可說是一點都不馬虎。


  雖然《當男人戀愛時》是部愛情電影，但導演殷振豪希望加入真實殘酷的氛圍，因此安排

  邱澤在片中有多場打架動作戲，這些打鬥戲都需要耗費極大的體力，但每一場戲邱澤都堅

  持親力親為、親自上場演出，不僅常常下戲時累到體力透支，連手都沒辦法抬起來，有時

  候也會不小心掛彩受傷，像是電影一開頭的「敲香爐」討債戲，雖然香爐為特殊製作的道

  具，但邱澤用力敲頭後現場香灰四散，都飛進他眼睛裡了，但他堅持不喊苦，一心只想把

  戲拍好。


  還有一場和「浩婷」許瑋甯爭執後的酒醉戲，「阿成」邱澤跌跌撞撞地衝進旅館想找「芽

  芽」Lulu黃路梓茵，但他一不小心用力過度，竟摔得全身傷痕累累，嚇得現場工作人員趕

  緊替他冰敷，但邱澤仍然堅持「來真的」，好將每一顆鏡頭的情緒都做到飽滿，讓導演殷

  振豪和許瑋甯在一旁看了都相當心疼。


  ☆自由時報電子報提醒您，未成年請勿飲酒 酒後請勿開車☆


  ☆飲酒過量，有害健康☆


  《當男人戀愛時》花絮：




  --'
