title: '[新聞] 邱澤中國發威力抗彭于晏當男人戀愛時3天'
content: '邱澤中國發威力抗彭于晏　《當男人戀愛時》3天票房破億




  邱澤主演的《當男人戀愛時》於中國上映中。鄭孟晃攝

  圖片來源 : 蘋果新聞網


  在台賣出破4億台幣票房的國片《當男人戀愛時》，6月11日於中國上映，同樣打出好票房

  跟口碑，據中國電影票房觀測APP《貓眼》顯示，《當男人戀愛時》上映第2天票房成績來

  到全院線第7名，今上映第3天，中午票房已達9000萬台幣，預計今晚就將破億，在端午檔

  期表現突出。


  《當男人戀愛時》由邱澤、許瑋甯主演，在中國排片比約6%左右，上映3天今天將衝破1億

  台幣票房，相比同檔上映的華語片，像是由彭于晏、張艾嘉等人主演的《熱帶往事》，雖

  然拿下總票房第2名、成績約1億5千萬，但該片的排片比高達15%，12日上映首日更是開出

  21%，換算下來，《當男人戀愛時》的票房實力不輸《熱帶往事》。




  彭于晏主演《熱帶往事》為電影角色暴瘦。

  翻攝《熱帶往事》微博


  圖片來源 : 蘋果新聞網


  而今年中國端午節檔期的冠軍，是由韓博文執導，鄭愷、李昀銳、曹炳琨、張藍心、張榕

  容領銜主演；李晨、金靖特別演出的劇情片《超越》拿下。


  該片講述了曾獲獎無數的「百米飛人」，在經歷人生轉型之後陷入低谷，因為與昔日摯友

  再聚喚醒跑步熱血回憶，並重新振作實現自我超越的故事。該片截至今午票房已達2億台

  幣。


  （李承陽／綜合報導）


  新聞網址：


  --'
