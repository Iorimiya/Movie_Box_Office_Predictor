title: '[討論] 當男人戀愛時 vs. 天若有情'
content: '今天從搞搞新意思意料之外地連結到了「天若有情」


  才發現原來旋律超美的「追夢人」


  竟然還有個粵語版的「天若有情」


  （）


  然後我就好奇心大起：


  「天若有情」與「當男人戀愛時」


  同樣是加酒談戀愛的故事


  為什麼「天若有情」似乎比較沒有像目前的「當男人戀愛時」這樣微炎上?


  難道說是「天若有情」的香港加酒，鼻血流得實在太帥嗎?


  還是當年其實「天若有情」也曾經被批判過


  只是我太漾、沒有躬逢其盛阿?




  今年初「天若有情」也有重新上映過


  好像也沒看到什麼討論


  難道大家都已經忘記了史上最帥的鼻血嗎?



  最後還是要說：


  追夢人∕天若有情，真的超好聽！

  　　　　　　　


  --'
