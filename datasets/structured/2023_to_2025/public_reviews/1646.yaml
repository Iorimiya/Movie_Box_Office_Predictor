url: https://www.ptt.cc/bbs/movie/M.1617960758.A.171.html
title: '[新聞] 當男人戀愛時 與韓國版本五大看點比一比'
content: '台片難波萬！《當男人戀愛時》催淚票房飆！與韓國版本五大看點超級比一比！

  新聞連結：


  電影《當男人戀愛時》在4月1日連假上映後，隨即衝出好口碑和亮眼票房，掀起影迷熱烈

  討論，該片翻拍自2014年度韓國最賣座的愛情電影《不標準情人》，台版保留了原著主要

  故事線，融入台灣在地文化元素，讓《當男人戀愛時》翻玩出正港的台味浪漫愛情故事，

  而韓國版本在眾多影迷心目中也有不錯評價，以下就盤點台韓版本的五大不同看點，看你

  ／妳更喜歡哪一個版本呢！


  台版女主角許瑋甯比較「派」

  韓版女主角由氣質女星韓惠軫飾演，雖在片中多數時間都擺著一副撲克臭臉，但撥開她漠

  然冷淡的外表，仍是個楚楚可憐的嬌柔小女人，讓人忍不住想要挺身而出保護她。而對比

  韓版，許瑋甯飾演的台版女主角「浩婷」就比較「派」，是那種會被形容是「恰北北」的

  女生，但深入劇情，會發現她的兇悍其實是來自於面對艱困生活的堅毅與勇敢，努力生活

  又真性情的樣貌是她的迷人處。


  此外，台版故事在邱澤入獄之後，導演殷振豪花了些篇幅在描繪許瑋甯獨自打工賺錢的辛

  酸處境，韓版後半段則是將劇情主力於著墨男主角的心境轉折，台版反而給予女主角更多

  的發揮空間，角色性格也更顯立體。



  鍾欣凌「轉性」黑道老大

  台版《當男人戀愛時》整體還原韓版程度很高，人物設定、故事情節大致都一樣，但在角

  色上最大不同，就屬鍾欣凌飾演的黑道大姐，韓版是由反派專業戶鄭滿植飾演討債公司社

  長。台版改變了該角性別，其實是來自劇組用心的田野調查，他們發現台灣鄉里市井裡，

  有不少放高利貸的都是大姐頭，因此翻轉黑道老大性別，也讓鍾欣凌在片中後來靠「從政

  」洗白，透過角色在地化，讓故事更貼近台灣真實社會情況。



  邱澤A台客帥 PK黃晸玟韓流痞

  韓版男主角由青龍影帝黃晸玟擔綱，演什麼像什麼的精湛演技毋需置疑，他演活了一個為

  心愛女孩子全心付出的傻氣癡情男，雖然外表不太起眼，又是個打扮粗俗的韓國地痞大叔

  ，奇怪的是，卻也會默默被他笨拙的暖心行為打動，就像是你我身邊不起眼的男人，其實

  正曖曖內含光的閃耀著。


  台版找來同樣是影帝的邱澤演出，帥氣的高顏值讓他在大銀幕上先佔上風，而他先前已透

  過電影《誰先愛上他的》證明自己不只是靠臉吃飯的演員，平時給人都會時尚男形象的他

  ，特地燙了米粉頭、穿花襯衫配上霹靂腰包「俗樣」入鏡，操著一口道地台語、撂口頭禪

  「啥款」，更融入大啃甘蔗、愛呷粉蒸肉的台味嗜好，讓台客帥出新高度，且論情緒轉折

  與爆發的演技，他也完全不輸黃晸玟，台韓浪漫都各有其吸睛魅力。



  韓版倒敘故事引懸念 台版穩穩鋪陳情感

  韓版電影在中後段時，讓男女主角戀愛正甜蜜時，畫面嘎然而止，時序瞬間跳到數月後黃

  晸玟從監獄出來，拋出一個懸念引觀眾好奇，再以時間交錯的敘事手法，交代兩人之間究

  竟發生什麼事，讓觀眾邊看邊慢慢解密黃晸玟與韓惠軫、與家人間的揪心情感，在觀影感

  受上較為緊湊和引人入勝。


  台版中後半段則選擇以平鋪直敘手法，穩紮穩打把故事說好，其實可以理解台版為何如此

  改編，畢竟故事情節已有原版在前，實在不必再賣關子，不如好好把故事交代完整，讓情

  感堆疊鋪陳更豐厚，開展出不同韻味的故事風格。



  韓版親情濃 台版愛情虐

  韓版故事完整細膩的建構了男主角「太逸」的家庭關係，不只是與失智爸爸間的愛之深責

  之切、與哥哥間彆扭的手足情，在他與嫂嫂、姪女之間也都有深刻的情感描繪，黃晸玟替

  被客人性騷擾的嫂嫂出氣、偷偷送姪女想要的手機、幫爸爸捏腿盡孝道，在感受暖暖親情

  之外，透過這些家人間的互動，也讓人看到這個老是惹麻煩的街巷流氓，其實是個體貼細

  心的柔情漢。


  台版電影則留了更多空間給男女主角刻骨銘心的愛情故事，兩人在車站見到彼此，相視而

  泣再激動擁抱和解的戲，相信令不少觀眾揪心，還有許瑋甯幫邱澤剃鬍子、兩人牽手逛市

  場買菜的日常約會更是甜蜜到不行，滿足觀眾戀愛少女心，也讓兩人在天人永隔後更顯虐

  心。



  ___

  昨天和朋友看完 覺得改得不錯～

  雖然男主角的詮釋真的差蠻多的

  但看完還是哭有點慘就對了


  --'
