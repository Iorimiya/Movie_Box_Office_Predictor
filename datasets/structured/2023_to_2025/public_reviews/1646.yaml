title: '[普好雷] 當男人戀愛時,2021'
content: '雷文防雷資訊頁


  當男人戀愛時 Man In Love (2021台灣電影)




  E6%99%82_(%E9%9B%BB%E5%BD%B1)


  看片前大概了解本片改編自韓國電影，在台灣首映後幾天的票房賣座狀況良好，好奇心驅

  使之下，去了電影院了解感受。



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  哈哈哈，果然是許多情侶共賞的狀況。這片有笑有淚有愛情有親情。就演員表現而言，女

  主角許瑋甯扮演的吳浩婷，角色設定容易引人入戲，演技自然感人，最有感！    男主角

  邱澤的張孟成角色，人設非常戲劇性，討債人、有情有義又深情搞笑，討喜又引人同情，

  但現實生活中這種人令人避之惟恐不及吧？邱澤的演出，讓人欣賞到這男人的美好的一面

  。男女的對手戲精彩有趣，構成通俗好看的愛情片。其他配角:蔡振南扮演男主的父親，

  角色及演出逗趣又動人，藍葦華扮演男主的哥哥，呈現家庭男人的生存之道，鍾欣凌扮演

  的討債人背後的老闆，到後來成為的新秀政治人物？角色諷刺寫實，令人討厭，演出令人

  印象深刻。


  這片看完，雖然一些橋段令我有點感動及有笑有淚，但整體而言，並没有深刻打中我的心

  。就是跟隨大眾了解一下賣座電影，看看女主角的精彩演出，OK了。


  當男人戀愛時

  Man In Love


  --'
