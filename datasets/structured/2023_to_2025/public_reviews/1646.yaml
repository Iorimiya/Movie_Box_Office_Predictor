title: '[好無雷] 當男人戀愛時 國片少見的苦情女形象'
content: '蠻久之前就先看了試片，散場跟幾個媒體朋友聊天，談到票房有可能爆。以下分三點討

  論本片。



  1.一度蠻期待歌舞橋段的設計


  電影以邱澤吃甘蔗破題。接著BGM響起，緊湊的鼓點配上一串討債日常的蒙太奇，也為片

  子拉開序幕。殷導不愧是MV出身的導演，對音樂的設計非常有想法且精準，無形中也形塑

  了不以對白推動劇情的電影意識，這在國片中是非常稀有的，個人給予很高評價。。（音

  樂推動劇情方式可以參考Promising Young Woman）


  本片其實有蠻多橋段適合拍成歌舞片，我想到的就有保齡球館、天台、客運站這三場戲。

  但可能歌舞還是國片始終不太敢碰觸的區塊吧，有點可惜但也可以理解。（遙望魏德聖與

  杜琪峰）



  2.國片少見的電影形象


  有兩個角色可以討論，一是鍾欣凌的大姐頭、二是許瑋甯的苦情女。


  鍾欣凌在片中的形象非常驚艷，活脫像老港片裡的油膩老鴇。許瑋甯在本片中演繹了現代

  國片少見得到苦情女形象（尤其第三幕）表演也是可圈可點，我自己是蠻好奇導演是因為

  怎樣的成長經歷，得以拍出這種老片裡常常出現，但現在幾乎已經絕跡的的角色命題？



  3.家庭線處理得紊亂，第三幕崩塌


  拍到最後有點崩了，家庭線太雜太碎顯得的紊亂且多餘（蔡振南、藍葦華等人的戲份刪光

  也不影響劇情發展。）但總而言之還算不錯的國片。


  話說之前看物料時有看到本片的簡體字海報了，而且監製是程偉豪（《緝魂》對岸票房還

  可以），應該有機會在大陸上映，希望能複製《比悲傷》的商業成功。（但有沒有可能礙

  於對岸商業壓力，片方因此不敢報名金馬獎呢？）





  --'
