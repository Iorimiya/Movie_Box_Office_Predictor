url: https://www.ptt.cc/bbs/movie/M.1617463965.A.FD5.html
title: '[好無雷] 從當男人戀愛時看見完全體的邱澤'
content: '一開始是從《誰先愛上他》開始看到邱澤

  駕馭了一個跟他以往形象反差的痞子形象，

  後來又在《江湖無難事》看見充滿江湖氣息的他，

  這次在《當男人戀愛時》看見他的表現又彷彿看見了一點《用久柑仔店》的霸氣身影，

  仿佛集所有角色於一身的完全體一般，

  但又把細節處更精準的掌握住，

  尤其表情細微的控制真的直接牽動了情緒，

  讓我為這個角色心疼及痛心

  （除了邱澤，藍葦華最後一場戲也是逼哭人）




  當男人戀愛時，劇情俗套老梗，

  但故事說得好不貪心依然打中了我，

  演員演技到位，美術陳設優秀，

  加上洗耳好聽的主題曲，

  真的值得進場感受！


  --'
