url: https://www.ptt.cc/bbs/movie/M.1619411370.A.B12.html
title: '[新聞]《當男人戀愛時》正式破3億擠進國片前10！影迷掀景點「巡禮'
content: '新聞網址：



  記者吳孟庭／台北報導



  由邱澤、許瑋甯主演的國片《當男人戀愛時》票房確定突破新台幣3億，不但穩坐今年最

  賣國片，票房佳績也擠進台灣電影影史紀錄前10名！影迷也掀起電影場景「聖地巡禮」，

  挖出片中新莊麵店、萬華冰果室、板橋咖啡廳等所在位置，引起粉絲朝聖。





  》。先前眾人承諾破億要請大家喝飲料，但現在比預期多3

  倍，

  ，請影迷持續鎖定。



  《當男人戀愛時》票房大賣，不僅使得片中經典台詞，全台觀眾

  更掀起一股浪漫揪心場景巡禮風潮，紛紛比眼力尋找邱澤與許瑋甯在片中愛的足跡。



  像是邱澤忍痛與許瑋甯分手的重頭戲，許多觀眾都發文表示，這家是位於

  ，是他們從小吃到大的懷念家鄉味。導演殷振豪透露，拍攝《當男人戀愛時》時

  就是特別鎖定台灣日常所見的平凡場景，包括冰果室、菜市場、客運站、小吃攤等地，目

  的是營造觀眾的共鳴感，並讓大家重新體驗在地感十足的台式美學。



  《當男人戀愛時》中各處景點也讓影迷紛紛朝聖，有位於，許瑋甯

  倒了邱澤滿頭果汁憤而離去；在邱澤與許瑋甯兩人訂下約會合約書，天天

  來這裡吃粉蒸肉；在新莊的邱澤包下全館驚喜獻唱《愛情你比

  我想的閣較偉大》。



  則是兩人共渡100天紀念日；桃園內，誤會尚

  未解開的兩人重逢，邱澤一句「再給我一分鐘」，與許瑋甯的痛心落淚逼哭全台觀眾；在

  ，許瑋甯奮力狂奔找到邱澤後緊抱住他，嘴上說「你再走試試看」背後

  則是意涵著「我再也不要離開你」的深情承諾，眾多揪心戲場景都被網友的敏銳眼力一一

  揭露。




  --'
