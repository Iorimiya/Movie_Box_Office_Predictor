url: https://www.ptt.cc/bbs/movie/M.1618144348.A.5E7.html
title: '[負雷] 不現實的當男人戀愛時'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  男女主角演技不想評價

  劇本根本可怕到不行！


  女主上輩子不知道造了什麼孽承擔老爸一屁股的債。

  又遇到男主討債大哥，靠著自己債主身分硬逼女主接受他的追求。


  要不是邱澤是飾演的內心純樸善良小男孩的討債大哥，女主被玩完後，直接賣到酒店我都不意外。

  誇張的程度讓我覺得根本在為黑道跟討債公司洗白，甚至鼓勵大家去借溫暖、富有人性關懷高利貸。


  最後，竟然還用這種我只要是為了你好，我做什麼都是這樣對的半強迫的方式，還可以感動女主，女主說你沒有斯德摩格症候群，不是抖m真的令人不敢相信。


  如果今天我老爸死了有人還要硬搬他靈堂我還不一拳尻爆他鼻樑，還有時間在那邊感動。


  男主雖然是個大好人，但他的個性不但不溝通、不計風險代價急於成功，又獨斷拿走女主保險金，最後被蔡姐算計，根本就不令人同情，只讓我覺得他咎由自取，明明就有存款，偏偏不願意腳踏實地，不知道在急些什麼。


  片名叫當男人戀愛時，中間沒看到有什麼情感描寫，只看到男主的一廂情願，遇到一個悲慘到不忍直視的女主，告訴貧窮到底是一件多可怕的事。






  -----

  Sent from JPTT on my iPhone


  --'
