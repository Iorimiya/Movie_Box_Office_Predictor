url: https://www.ptt.cc/bbs/movie/M.1618748377.A.EF1.html
title: 'Re: [討論] 當男人戀愛時的蔡姐其實人很好？ (有雷)'
content: '男主角前面的行為完全就是吃蔡姊的資源




  蔡姊高利貸  主角將高利貸變成低利貸  就這樣而已


  之所以可以不還女主角的錢  唯一的解釋就是  蔡姊的客戶超多


  不然就是蔡姊的利息超高




  所以男主角可以吃掉公司的利潤


  因為是高利貸...


  要是我沒記錯的話  重利罪年息約20％


  實際上蔡姊可能更高


  不然怎麼養下面那些討債小弟 + 男主角 ?




  蔡姊前面對男主角算是照顧有佳


  看到男主角打折自己的錢去餵人  演戲罵罵  默許了


  甚至看到男主角在自己辦公室痛毆自己的小弟後  演戲罵罵  還是默許了




  但是到最後男主角退出了  蔡姊就不當男主角是自己人了


  要是沒有最後一段的蔡姊黑吃黑


  我是覺得這整部前面最虧的就是蔡姊...


  男主角前面讓蔡姊演壞人


  自己在外面跑業務演好人




  所以導演只好安排蔡姊來個衝突  不然說真的男主角欠蔡姊超多東西...


  照理說蔡姊根本沒必要拿男女主角的開店錢


  開小店的錢了不起幾百萬吧


  啊一堆欠幾百萬的都在外面晃啊晃的  男主角還可以對他們的錢打折了啊


  這代表蔡姊不缺這幾百萬啊


  不然男主角一開始對公司應收帳款打折跟默許女主角不要還錢時


  蔡姊應該就把男主角打爛了...



  更別說選議員會碰到的只會更大不會更小


  現實有人搭個車都可以掉(?)三百萬在車上了


  蔡姊完全沒必要冒著危險吃瓦斯桶吧


  最後男主角拿的紙袋看體積應該是幾十萬到百萬之間



  所以說真的如果不是導演安排  我想不出蔡姊幹嘛要拿這點錢..




  --

  Unravel - Tokyo Ghoul OP [Piano]



  --


  對啊  這是個非常大的問題...今天這個人就等於是偷公司的錢...'
