title: '[新聞] 邱澤「當男人戀愛時」大陸票房達5億 大'
content: '新聞網址：


  邱澤「當男人戀愛時」大陸票房達5億 大勝彭于晏！


  2021-06-22 17:57聯合報 記者黃保慧／即時報導


  邱澤和許瑋甯主演的「當男人戀愛時」在台灣上映時票房突破4億台幣，叫好又叫座，6月

  11日在大陸上映，儘管邱澤原本的道地台灣腔被配音成捲舌音，讓不少大陸影迷崩潰留言

  ：「不要配音」，依然在21日衝上單日冠軍，累積1.13億人民幣（近5億台幣），超越台

  灣成績。


  由殷振豪執導、邱澤和許瑋甯主演的「當男人戀愛時」在大陸上映前的媒體試映口碑還不

  錯，只點出「台灣口音」消失問題讓影片不夠到位，而正式上映時成績還算可以，以排片

  比例僅6％很低的狀況，仍可在端午檔期排名第6，接著靠著口碑後市看漲，就在前天勇奪

  當周大陸電影票房的周冠軍。


  據大陸報導指出，大陸電影票房排名第二的是「比得兔兔」，第三名則是大陸電影「超越

  」；而同檔期上映、由台灣男神彭于晏主演的「熱帶往事」從一開始上映幾度擠進前3名

  ，現在已跌出10名外，累積票房落在約1.3億台幣，票房不是很理想。


  另一部早1周上映的「有一點動心」，找來言承旭擔任男主角，是他自2015年特別演出電

  影「我的少女時代」後，就沒出現在大銀幕上的作品，雖然是言承旭久違的愛情片卻還是

  滑鐵盧，6月3日上映至今，票房累積不到8000萬台幣，很淒慘。


  --'
