url: https://www.ptt.cc/bbs/movie/M.1629907215.A.5E7.html
title: '[討論] 當男人戀愛時，其實蔡姐本性不壞'
content: '阿成身為蔡姐旗下討債一把手，常常收錢收不齊，一下是欠債的兒子生病、一下是誰的家

  裡有什麼問題，反正理由很多，基本上目標達成率不高。




  阿成少收錢，甚至是拿錢救濟別人，其實那都是蔡姐的錢，等於他拿蔡姐的錢、做自己的

  面子，畢竟欠錢的只知道阿成人好不強討，但並不知道背後真正出錢的人是蔡姐。




  春秋戰國時代，齊國孟嘗君派馮諼去收債，馮諼發現很多人太窮了，一些債都收不回來，

  於是他燒掉債卷，並跟大家說：「孟嘗君知道大家真的沒錢，那這些債就不收了。」




  馮諼跟阿成一樣是沒把債收回來，但馮諼知道真正虧錢的是孟嘗君，所以是幫孟嘗君做「

  面子」，相反地阿成在免除窮人債務時，可沒說：「這期蔡姐先不跟你收了。」大家都以

  為是阿成人好，而不會感謝蔡姐。




  身為幫派份子，叫你去收債收不齊，還拿老大的錢給自己做面子，一次兩次可能就算了，

  但阿成長期這樣幹，沒被蔡姐吊起來打、家法伺候，真的已經算是蔡姐異常仁慈了。






  蔡姐頂多就是罵一罵阿成給小弟看，但更進一步的處理倒是沒看到，基本上等於默許阿成

  的行為，雖然電影沒說為什麼，但我想除了阿成帥以外，最大的原因是，蔡姐八成也知道

  有些人真的狀況太差，強討可能會逼死一個家庭，阿成心軟幫助人家，那她也就當做功德

  ，不深究了。





  蔡姐的仁慈是一直到阿成忽然說不幹了，她才設局陷害他，反正你已經不是自己人了，阿

  成至少欠了浩婷爸爸、自己哥哥兩筆大債務，弄你一下也沒逼死你，以一個黑道來說算是

  下手很輕了。





  話說阿成也是很衰，如果他不跟蔡姐提辭職，跟到賭場搶劫那單，之後蔡姐洗白選議員，

  阿成絕對會是議員身旁的左膀右臂，能動用的資源更多，身分也不再是小混混，少說也是

  議員特助、辦公室主任一類的職務。





  可惜啊，人生沒有如果。





  --



  我沒說她是好人


  我只是說她本性沒到太壞


  沒有真心想對欠錢的趕盡殺絕


  畢竟阿成所做所為如果不是蔡姐默許


  盜用公款一般情況早就被抓出來教訓了'
