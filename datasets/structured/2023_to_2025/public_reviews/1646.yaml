url: https://www.ptt.cc/bbs/movie/M.1620259379.A.5E2.html
title: '[負雷] 當男人戀愛時 後半急轉而下的莫名其妙'
content: '剛去看完當男人戀愛時，我認為在演技上男女主角都算挺不錯的，


  我知道這是改編自韓版，但後面急轉而下的部分讓人覺得有些太過，且也是可避免的...









  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  此片以兩人錢被搶走大吵分手為界，大約可以分為前半和後半，


  前半基調明亮，帶點粉紅泡泡，


  女主的情感變化、男主死愛面子又面惡心善濫好人的形象塑造都算不錯，


  儘管略嫌爛俗也仍有些不合理、差強人意處，但在粉紅光澤下大致可以忽略

  (反正我本來就預計去看愛情戲的)。




  然而到了後半就可說是急轉而下了，襲警、入獄、病發、出獄治療、挽回、和好...死...


  後半似乎是有點回歸現實的意思，一個拿香爐砸自己頭的暴力討債8+9終究不得善終，


  但明明想回歸現實卻又充滿著莫名感。



  其中之最便是男主好不容易和女主再聚，一同前去治療一同擁抱希望，


  那麼多努力畫面，結果轉瞬間男主安詳躺在床上，就突然心跳停了...


  心跳停了也不見有人著急搶救，畫面停在一個女主深情望像床上男主唯美的鏡頭，


  可是我就想問你們前面努力那麼久，結果一聲不吭突然就死了，


  還死得好像大家都理所當然。可是前面我根本沒看到多少治療中的病情說明啊...


  至少可以在兩人相處畫面中夾雜些醫生偷偷告知女主狀態不樂觀的橋段吧，


  你這樣我很容易有種"那你治療個屁"的感覺。




  其他還有為何半年不見男主爸爸的老人痴呆已經嚴重到這程度了、


  用暴力向議員競選人辦公室討錢的可能性與合理性等等。


  後半少數優點是帶出與家人深刻的情感，父子、兄弟情深，


  當然那些摧淚橋段是否有點過於直接爛俗又是另一個問題，


  不過我一開始就預計看一部爛俗愛情片，所以對於爛俗點我都是懶得追究的。



  本片前半後半差異太大，如果不想節外生枝，前半好好收個Happy Ending也就可以了，


  硬搞了個後半，想現實點又充滿莫名，何必呢?





  --



  畫面完全吻合XD

  對…的確是劇本，但還是略顯草率，

  假設安西教練在中場休息時

  還在說著不要放棄希望，放棄希望才是真的輸，連續全員振奮鏡頭，

  結果下一個鏡頭就是湘北被慘電30分球賽結束，

  儘管開頭就說與對手實力相差懸殊贏不了，

  我還是會很想問啊中間發生什麼事情怎麼都不提了...

  嗯…我也覺得給個Happy Ending爛俗到底還比較好。

  啊可是這部片前面都不現實了那麼久...後面就算說要現實一下也很多漏洞欸'
