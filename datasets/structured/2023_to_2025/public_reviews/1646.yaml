content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n   這部片完全就是靠男女主角撐場面\n\
  \n   邱澤的確就是戲精  所有的表情  眼神  動作 都非常有戲\n\n   雖然說是8+9  是感覺會讓人想戀愛的8+9\n\n   女主角飾演的是冰山美人的角色\
  \  情緒掌控非常好\n\n   從一開始排斥  到後來熱戀   情緒的收放 完全不刻意  沒有破綻\n\n   這兩個的對手戲  真的還蠻不錯的\n\n\n\
  \   可惜 劇本真的不行  女主角一開始死爸爸  後來死男人\n\n   最後還要幫忙照顧死去男友的失智爸爸\n\n   並不是說我排斥悲劇\n\n   這種劇本根本就是古代那種貞潔牌坊的套路\n\
  \n   說穿了 就是為了悲傷而悲傷 想騙眼淚的劇情而已\n\n   整部片只對男女主角演技有感   劇情真的無感\n\n   編成喜劇收場我還會給好評  硬要悲劇\
  \ 我真的不行\n\n\n--"
