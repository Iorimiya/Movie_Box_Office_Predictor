url: https://www.ptt.cc/bbs/movie/M.1618077571.A.1B2.html
title: '[討論] 當男人戀愛時的醫療部分'
content: '這邊不討論劇本好壞，畢竟反應滿兩極的，而且比較主觀


  就片內出現的幾個醫療行為，家裡有不少醫療從業人員(護理師跟醫生都有)，看了這部戲

  都滿傻眼的


  第一、吳浩婷的爸爸沒有上鼻胃管

  長時間不能進食的病人，一定會上鼻胃管，戲中女主角爸爸長期臥病在床，對人也沒有反

  應，居然沒上鼻胃管，而且打的點滴也不是營養針，所以到最後是餓死的嗎？


  第二、男主角的腦動脈瘤

  腦動脈瘤壓迫腦神經或是破裂，都不會像這樣流鼻血，如果說意識改變或是暈倒還可以接

  受，男主時不時在流鼻血我還以為是女主角太辣，到後來才知道是為了疾病鋪梗，其實這

  個症頭比較像得了白血病


  再者腦動脈瘤不會做腰椎穿刺，而是做從鼠蹊部打入的血管攝影，傷口非常小，一般一到

  兩天就能出院


  雖說臺灣的八點檔連續劇亂搞醫療部分已經見怪不怪，可還是希望電影在拍攝的時候，專

  業部分的考究可能還是要聘請相關人員



  --

  你要這樣護航也是可以，雖然不是醫療主軸，但都演到男主角一路破病死了

  女主老爸也死了，這應該不算挑骨頭吧，又不是說他打針打錯地方拿出來嘴

  完全是牛頭不對馬嘴的醫療行為好嗎

  各位在哪邊Google到會流鼻血的，可以傳給我看嗎？真的沒搜到

  該不會是不署名的農場文吧

  可以舉例嗎？我看過好萊塢的片真的都滿講究的，希望你可以說個片名片段之類的

  有的是會胡言亂語或不太講話了

  但電影反而選了最偏離事實的一種呈現方式

  阿通識缺乏的人看什麼馬都沒差

  看八點檔就好了嘛

  其實討債的方式沒啥毛病，但是邏輯有點問題

  基本上會到討債公司的債務都是垃圾債務(很難追回的那種)

  又以追回的難易度，討債公司會以件抽成30%～50%(所以說很好賺)

  但男主每次都只抽個幾千，甚至不收錢倒貼人，又出手闊綽，我其實在看得時候一直期待

  能看到男主對付那種有錢擺爛不還的債務人，可惜沒看到但男主又一直有錢拿出來，開公

  司的真的不是開廟的阿

  我沒聽過，我不是醫療人員，肉搜了一下你也不是，我是真的沒Goole到，不然你文拿出

  來嘛，為什麼那麼簡單的事情不做


  然後這篇文的內容是和家人一起觀影後討論的，家裡兩個醫生(醬料本科的，不是什麼中

  醫牙醫)還有兩個護理師，前年家族也有人因為腦動脈瘤過世，遠親有因為腦動脈瘤破裂

  住進安養院的，如果你對這部分覺得我在唬爛，我可以發地址給你來跟他們請教醫療專業

  阿


  Google大師vs醫生好像在哪裡看過

  那個人好像叫「艾莉莎莎？」

  阿結果搞半天你還是貼沒署名的農場文給我看

  要貼這種拜託去爆料公社好嗎？

  給阿怎麼不給，耍耍嘴皮誰都會

  你主觀感到害怕就可以報警喔？你是不是沒有受過義務教育啊？80年後的都有基本法制概

  念吧


  要告就去告，反正你也是先被警察罵一次再被檢察官轟一次，

  我再申請戶籍還是現住法院管轄，反正離你都很遠，肯定也是不起訴，你可以試試看，看

  誰賠誰

  他要戰我就陪他阿，放假那麼閒對不對

  寄信哪裡可怕？

  覺得違規你可以幫他送violation判

  不用在這邊帶風向

  沒關係這部分我的強項，你就儘管去看你要告還是怎麼樣，結果包你滿意

  國小畢業沒關係，希望你有個5、6萬可以請律師，或是你可以靠Google打官司啦

  一個在高醫一個在三總

  你也可以肉搜我找到他們啊

  哈哈到底威脅到你什麼了？

  你的自尊嗎？

  你真的好生氣好好笑

  一開始連噓引戰不就是你嗎？

  懶的理你還越講越起勁

  不就是想吸引我的目光？

  現在要認真要跟你討論了

  就說我威脅你，站內好可怕什麼的

  有沒有那麼雙標啊？


  然後文呢？到底拿出來了沒？

  要拿paper也可以，醫生發的衛教資訊也行

  不要給我看一堆健康雜誌的農場好嗎

  我對基督徒的印象都很好

  阿像你那麼激進的也是第一次看到

  好哦，謝謝

  電影日曆的地方我還真的沒有注意到

  說不定當時真的沒有這種手術

  這樣連噓可以滿足你的快感嗎？

  如果這樣可以滿足你的心靈就繼續吧

  我也算做一件好事

  不用理他啦，他Google比醫生厲害

  好啦Google比6年醫學系強

  別人說的你都聽不進去

  你國小畢業你最屌你贏了

  下次去看醫生記得拿Google文去診間教他

  沒辦法就是論事就另開戰場

  你各位水準也是跟他差不多而已

  扯在哪？站內犯法嗎？站內違反版規嗎？

  你們覺得有的話，提告或送檢舉阿？

  我們再來看到誰贏嘛

  說不贏人就只能拿主觀的態度問題攻擊


  醫療的部分很明顯就是rex搞錯

  硬要拉一堆沒署名的Google文

  阿他這樣嗆整篇就沒事

  下面一堆人糾正他也裝沒看到

  我站內他一封信，一堆崩仔就直接道德高潮，難怪人家說國片在電影版嘴不得


  然後，我唯一在電影版發過的影評就是在噓洋片，居然還有人說我崇洋媚外，好萊塢屌就

  大


  事實就是這部片的專業考究有問題

  只是你們這些粉絲沒辦法接受自己喜歡的電影被不是正面評價


  我也懶得浪費口舌，反正有些人就是覺得躲在網路上搬弄是非，甚至用公然侮辱的字眼都

  不用負責，其他人要怎麼噓我沒差，那是你們言論自由的範疇，

  無論法院管轄地為何，、你們準備請假來台北做警詢筆錄，反正說不贏

  就人身攻擊很好玩嘛，說別人道德瑕疵 自己卻踩法律的紅線，笑死人了。


