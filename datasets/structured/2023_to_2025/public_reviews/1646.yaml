url: https://www.ptt.cc/bbs/movie/M.1629640281.A.8C1.html
title: 'Re: [討論] 當男人戀愛時──吵架的原因'
content: '我覺得是這樣啦


  很喜歡找電影裡面有那些不合邏輯的人阿

  你們就去看推理片

  還是紀錄片那種就好了


  不然就去看看魔術表演

  然後再認真的研究人家到底是怎麼變的


  電影就是電影好嗎

  硬要把電影裡面的情節

