url: https://www.ptt.cc/bbs/movie/M.1619775298.A.606.html
title: 'Re: [負雷] 當男人戀愛時-當8+9想幹炮時(文長)'
content: '原文略...


  如果男主角只是想幹炮的話...


  我是不覺的有哪個滿腦子想幹炮的男人在那樣的情況下，


  會去幫女主角的爸爸擦身體還推出去曬太陽的啦，


  還是你覺的他演的太刻意、有讓你覺的“我就是想幹炮才做這些”？


  我是覺的營造上“單純的想要性”跟“我想跟妳有愛而性”


  二者的差別是營造的很明顯的，我是有感覺到二者的不同啦


  原po有沒有感受到就是個人主觀的問題了，沒毛病~個人感受不同


  說真的，在醫院看多了...女婿幫岳父擦澡、推出去曬太陽的，


  真的不算常見...還是電影那段你真的覺的演的很假？


  另，生病生到借錢、沒人敢接電話時...


  男主角願意“捧斗”陪著女主角這段..或許你覺的很狗血


  但有女人就是因為這樣才嫁的？信不？


  有些事情沒遇到是人生的幸運


  不用拚命的人是幸福的


  能拚命的人是幸運的


  有的人...連拚命的資格都沒有的時侯


  日子，還是要過下去...





  --'
