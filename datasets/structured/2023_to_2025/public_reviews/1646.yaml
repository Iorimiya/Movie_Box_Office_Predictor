url: https://www.ptt.cc/bbs/movie/M.1619187504.A.A75.html
title: '[好雷] 《當男人戀愛時》'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  這部是改編自韓國電影《不標準情人》，

  整體電影的調性偏柔和，

  有些劇情轉折，畫面會從暖色調轉為冷色調，

  導演多使用特寫鏡頭來詮釋角色的內心世界，

  更能襯托出演員的表演功力。



  演繹出台片既有的套路，不免俗帶有狗血偶像劇劇情

  收尾對照當初觀眾認知的角色形成強烈對比，

  電影中每個角色都相當有存在感，

  甚至有些配角會讓整部作品增添不少看點！



  全片超過九成以台語對白呈現

  展現男主角的本土性與從事地下討債公司的身分

  以男主的視角來做劇情推演

  故事的前半大多以台式幽默為基礎，加上壞壞討債公司的元素

  和他在《誰先愛上他的》的角色風格類似



  另外導演對於推動情緒也是很巧妙

  一開始阿成精心打扮出美髮院時，會敲打下三色旋轉燈；

  阿成向藥房收債，還順便買了些健康藥品給爸爸

  旁邊人還會說有個孝順兒子

  不過其實哥哥及爸爸平時對阿成並不是很肯定

  其實這些安排有點既視感

  有些父母對於兒女或是兄弟姐妹間總是用負面語言

  不過其實彼此是互相重視的

  阿成看似在哥哥家白吃白住，

  但其實是經濟來源之一，所以姪女來要錢可以馬上給錢

  看似兄弟感情不好，

  但是會留意美髮院的招牌，知道壞掉了，最後還買來新的

  對爸爸的情感有點隔閡，但看到爸爸做手工沒辦法做司機會生氣

  就算失智，還是會對爸爸述說內心話，

  甚至希望能照顧浩婷這種妄想的要求

  而爸爸最後記得了，走出去那段，實在讓人鼻酸



  覺得導演安排了不少細節

  可以仔細欣賞、多刷幾次，這樣能看到部分也越多！



  --'
