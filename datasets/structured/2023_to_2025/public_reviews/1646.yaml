url: https://www.ptt.cc/bbs/movie/M.1599354741.A.017.html
title: '[新聞] 程偉豪跨足電影監製《當男人戀愛時》改編'
content: '拍手Clappin''


  程偉豪首度跨足電影監製，《當男人戀愛時》改編2014年韓國最賣座愛情電影


  由金盞花大影業、香港眾合千澄影視文化傳媒有限公司共同出品，由金盞花大影業製作的

  愛情電影，邱澤在電影中飾演對

  愛情一竅不通，靠討債為生的遊手好閒者，許瑋甯飾演因父親投資失利，每天張開眼就想

  著該如何還債的落魄小姐。首度合作的二人化學反應超標，讓拍攝現場狂冒粉紅泡泡，騷

  動全劇組的愛情魂，電影今日殺青，首波劇照釋出，網友直呼CP感濃烈，太浪漫了吧！



  電影《當男人戀愛時》是許瑋甯、邱澤出道以來首次合作，是一部以男性視角出發的愛情

  電影，邱澤所飾演的男主角阿成，是一個一開始對愛情一竅不通的最後義無反顧去愛的角

  色，導演殷振豪在與邱澤首次碰面時，就在心中決定這個角色非邱澤不可了，殷振豪感動

  的說：「我的直覺沒有錯，阿澤果然為阿成這個角色帶來很多神采，拍攝現場我看著畫面

  裡的阿成與浩婷，我是完全被他們的牽著走，被他們的情感打動，真的很捨不得要殺青了

  ！」


  《當男人戀愛時》是許瑋甯出道以來，首次接演愛情電影，為戲做足很多準備，導演殷振

  豪表示：「瑋甯為了融入本片的在地風格，不只在造型上放手讓服裝老師發揮，甚至調整

  自己的說話方式，在現場常被她突如其來的台語嚇到，跟她私下的時尚的樣貌完全判若兩

  人。」，而許瑋甯首次與殷振豪合作，對於他的浪漫印象深刻：「可能他是雙魚座的吧！

  他很會捕捉生活中的浪漫小事，電影中有很多浪漫橋段都是原著沒有的，像是浩婷在理髮

  廳幫阿成刮鬍子、浩婷和阿成牽手逛黃昏市場一起買菜殺價等。」



  ，監製程偉豪與殷振豪初次洽談合作時，殷振豪立刻熱血地

  回應：「我看過這部，這如果可以翻拍成很在地很台灣的味道就太屌了！」於是一拍即合

  的二人，與金馬編劇傅凱羚共同投入長達10個月的劇本創作，立志打造台灣味十足、浪漫

  卻注定揪心的老派愛情電影，導演為了將最在地的生活感融入，全片拍攝35天，




  --'
