url: https://www.ptt.cc/bbs/movie/M.1622213283.A.EDF.html
title: '[負雷] 角頭外傳-真正的當男人戀愛時'
content: '如題


  說真的看完只覺得  這部電影應該完全跟當男人戀愛時交換片名


  角頭就在拍戀愛


  當男人就在拍角頭  兩部都搞錯片名了


  當你搞對片名就不至於氣到吐血




  整部沒啥大重點  就是想吃鏡頭女  就小情小愛


  幫派要尬起來說真的也沒特別的原因


  臺灣拍流氓也不是第一次了  很厲害的是每次端出來的都還是那種小雞毛蒜皮


  我不管真實的流氓有多智障


  電影拍出來你可以稍微設計一下吧   有點峰迴路轉  競爭的感覺


  不然每次都在那邊泡茶放話  阿你管太多  阿你管太少  阿你太超過  怎樣的





  國片真的要加油  要拍愛情片  好好拍  要拍流氓片  好好拍


  拍出其中的峰迴路轉  拍出其中的刻苦銘心


  真的不要無腦的推進劇情  觀眾或許被你宣傳騙到


  但心裡都很清楚  就像路邊看到八尬炯




  國片也是這樣  表面上大家買票支持  看完後......




  啥款?


  --

  Sent from JPTT on my iPhone


  --'
