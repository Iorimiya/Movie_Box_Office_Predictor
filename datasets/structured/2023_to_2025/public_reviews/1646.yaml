title: '[新聞]「當男人戀愛時」票房逼2.5億 男女主相戀8景曝光'
content: "新聞網址： \n\n\n2021-04-18 19:03聯合報 記者黃保慧／即時報導\n\n\n邱澤、許瑋甯主演國片「當男人戀愛時」票房不斷飆升，1日上映後，\n\
  電影票房也\n帶動周邊，拍攝場景成了朝聖地，邱澤、許瑋甯從相遇到相戀再到吵架的8大地點獨家揭\n秘整理。\n\n\n邱澤在片中對許瑋甯一見鐘情的地點就在「桃園祐民醫院」拍攝，這裡的相遇讓邱澤展開\n\
  一連串的追愛行動，跑到許瑋甯戲裡上班地點「新北三芝農會」示愛，接著約對方到「萬\n華龍來冰果室」喝飲料，並提出「集點還債」的主意，卻慘遭女方倒飲料在頭上拒絕，直\n\
  到邱澤為許瑋甯打點父親後事打動她後，他們相約在「故鄉卡拉ＯＫ」吃粉蒸肉，並簽下\n還債合約。\n\n\n兩人甜蜜片段，其中一場在保齡球館，邱澤又唱又跳還秀出「愛妳99」字樣討許瑋甯歡心\n\
  ，而該場景就是在「E7PLAY新莊館」。他們最激烈擁吻的天台場，則是在「金羅東大飯店\n」的天臺。故事後半段，他們感情有了波折，爭執的地點在「中義街麵店」，另外邱澤抱\n\
  著錢來找許瑋甯的菜市場，則是在「和平民有零售市場」拍攝。\n\n\n此外，片中鍾欣凌演出的討債「蔡姐」也是推著男女主角感情轉折的重要角色之一，她受\n訪時曾表示，自己出道20多年，從劇場到電視劇再到電影，直到近1、2年才比較懂電影語\n\
  言，謙虛功歸導演殷振豪給她很大信任感，幫她拿捏情緒收放。她也提到拍攝前，看到許\n瑋甯一句「隨時可以重新歸零開始」的言論，有了很大的啟發。「當男人戀愛時」現正熱\n\
  映。\n\n\n--"
