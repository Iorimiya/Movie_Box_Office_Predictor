url: https://www.ptt.cc/bbs/movie/M.1617538522.A.DB4.html
title: '[好無雷] 當男人戀愛時'
content: '看完電影後實在很想抒發這種暢快的感覺！


  一直以來沒有特別喜歡國片，一些尷尬的笑點或太刻意的哭點，甚至是一些拗口的對白，常常讓人出戲


  而一些比較文青(?的國片，看完會覺得畫面很美、傳達的東西很多，沒有不好但就是平平靜靜的


  （也可能是我看得太少啊啊啊）


  這次原本也不抱期待想說為了主題曲當大型MV


  先不說覺得整體都恰到好處，在笑笑哭哭後心裡很暢快紓壓，當然主題曲也是聽得心裡好滿足




  劇情上沒什麼特別，就像大家說的老套狗血，如果是注重劇情轉折伏筆等等的人不一定會喜歡


  但故事的畫面、演員的呈現和一些細節，覺得這部電影都讓人很舒服


  他不會成為你一直惦記的經典，甚至可能只是書局裡一本言情小說，但卻能讓你在故事結束的時候，好好的滿足的離開







  話說我台語沒有很差，但“啥款”到底是什麼意思？要怎麼用！？

  -----

  Sent from JPTT on my Samsung SM-G973F.


  --

  看完不會覺得浪費時間，笑笑哭哭很有紓壓'
