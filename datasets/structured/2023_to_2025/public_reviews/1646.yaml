  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-

  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  這是一部愛情片


  首先開場

  一開始去討債時拿東西K自己頭

  然後討債可以打折，還會再給一兩千

  超佛心討債公司...

