title: '[微好雷] 當男人戀愛時'
content: '嗨大家好，我是專門看完國片來發心得文的邱澤粉

  距離上次第九分局跟江湖無難事，又等到邱澤了，


  進場前沒看過預告片，到終幕時才知道是改編自韓影


  先講結論:


  邱澤的眼睛一樣會笑有光芒，單看他已經值得，

  眾演員表現都不錯，很多橋段催淚

  親情的餘韻是有的，戲院裡也充滿了哭聲 (對我也有哭)


  可能受限於故事情節發展，片長2小時的中段讓我有點不耐，

  外行人的感想是重新剪一版1.5小時的可能有看頭(?)



  以下有雷























  以下有雷


  我覺得讓浩婷接連送走自己最愛的兩個人，

  真的很殘忍...

  成爸的狀態會回復嗎? 雖然阿成要成爸當浩婷的爸彼此照顧

  但不是又準備讓浩婷傷心一次嗎...


  還有不是很懂讓小姪女有當偶像的夢的設計是為什麼?

  蔡姐改走政治路那邊我也看不懂XD





  --

  煞然劃入夜空 我內心默靜停歇


  感動那聲音的振動 心弦為之共鳴


  天使悄悄進入哥帝氏區域 琴激的血液遍布周身



  --

  我的話應該是從成哥想從良，想開飲料店找店面那邊

  (店面事件真的很零碎)

  到賭博被黑吃黑到襲警到出獄，

  (從良到賭博那邊不夠細膩)

  一直到成爸那段家庭戲之前

  雖然關鍵但真的拍得太零碎'
