title: 'Re: [ 負雷] 那些說當男人戀愛時好看的是瞎了嗎？'
content: '標準的腦霧渣男metoo劇情

  今天把這個男角拿掉邱澤換成現實中最近疑似metoo的裝熟魔人或是雞排代言人

  不就是會被公審到爆的人嗎


  襲警/權勢性騷/賭博/公器私用/挪用公款/平常不養家裡，爸爸失智第一個打哥哥,結果最

  後還是哥哥給他外出的錢 [標準的住外面比較孝順]

  從頭到尾都是廢物的角色

  我都想為他的親人哭了

  女主角也有夠M

  爸爸生病死了 男朋友生病死了

  死前再丟一個生病的老爸給女主

  嫌她這輩子命還不夠苦嗎？


  這種片當初在板上還好多人挺

  真的是懷疑這些人哭點在哪裡？？

  好看點在哪裡？？


  --

  四億票房，查以前版上也很多人說很好看，說負雷還被噴……真好奇這些人在想什麼

  要想像去看超英啦，這種片就抖音中國爽片

  可以想像你有多氣

  我看串流，想說搞不好會有反轉

  看完再罵

  結果是從頭爛到尾

  推什麼要結婚才算「有孝」天啊這清朝片嗎

  所以推本片的我都很想跟他們借錢

  對這根本鬼片

  東八區的先生們？還是我的少女時代

  你跟我說感動的點 還是好看的點就好

  不然這種誰碰誰衰的男主……

  自己爛就算了

  還鼓勵結婚不就害死另一半 跟下一代

  一直不懂說這是電影

  不是新聞台的人

  到底干電影屁事

  看電影不能帶腦不能討論？


  就想知道說好看的人，好看在哪裡啊……

  當初好雷這麼多，應該要有人跳出來開導開導我……，但目前看回覆的感覺都是跟我差不

  多的想法啊,協尋好雷的人 謝謝

  不是都拿智慧型手機了嗎？高度文明的低開發背景設定XD

  王董成功衣錦還鄉至少還有努力一下

  這部完全沒有

  不會啊我看偌蘭不會去想合不合理

  我看蜘蛛人超越新宇宙也不會覺得不合理太扯什麼多重宇宙

  因為角色給的感覺讓你覺得他做這些合理

  其他角色會幫忙也讓你覺得合理

  在想像的框架給予你無限可能

  但卻給你合理的解釋

  這部片單純就是餵你一坨屎還不能說屎難吃

  因為這是電影




  --'
