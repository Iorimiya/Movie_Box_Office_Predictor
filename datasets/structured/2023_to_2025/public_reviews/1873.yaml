url: https://www.ptt.cc/bbs/movie/M.1555768992.A.7A3.html
title: '[片單] 類似蘭登教授系列 那個男人來自地球的宗'
content: '各位大家好


  想問一些跟“宗教”“科學”有關的電影


  像是科學和宗教的對立 或是對宗教和上帝質疑的電影


  前陣子看了 那個男人來自地球、天使與魔鬼、達文西密碼都蠻喜歡的


  很喜歡片中人們對於神的迷信，或是對於神性的質疑，試圖用科學理論去辯駁對抗宗教，然後大家一起推理找線索解謎的感覺。


  也看了火線追緝令，我很喜歡這部，甚至是這裡面最喜歡的，但裡面可能會是心理變態謀殺案的成分大於宗教，可能會想看更多質疑宗教對抗宗教的電影。


  也看了彗星來的那一夜，我很喜歡這種大家一起討論的氛圍，但它跟宗教啊神性就比較無關

  同樣是討論的 那個男人來自地球就很符合我的胃口


  地獄我也看了，但看完只有覺得義大利很美而已XD


  希望大家來推薦一下電影~ 謝謝大家~



  -----

  Sent from JPTT on my HTC U12 life.


  --'
