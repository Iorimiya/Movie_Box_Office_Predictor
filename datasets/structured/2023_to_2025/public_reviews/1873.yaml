title: '[討論]《那個男人》結尾'
content: '昨天看完

  今天還是有點納悶




  最後一幕

  律師在酒吧和陌生人聊天

  臨走前交換名片


  律師說他名片沒了

  身分是伊香保溫泉旅館次男

  有兩個小孩



  我可以理解為

  他因為長期以來身處歧視和偏見的環境身心俱疲

  最終因為老婆外遇而精神崩潰了嗎？

  所以在酒吧那個放鬆的地方

  想要假扮成另一個人逃離不堪的現實？



  這樣理解，似乎也能揭露這部電影的核心

  有些人必須要做到這麼極端（換身分）才有辦法重新開始

  律師必須要裝作另一個人才可以得到片刻的解脫

  是這樣嗎？？？？？


  _________________________



  不得不說這是一部很棒的電影


  里枝後來說她沒有很想知道真相了

  因為假‧大祐雖然不是真‧大祐

  但他和她相處的那些時光都是事實


  這部分真的很觸動我


  __________________________



  不過，還是要吐槽一下：

  律師在找人的時候

  怎麼沒想過搜尋一下真‧大祐最後換的名字

  也就是仲介阿伯在照片上寫的那個三個字的名字

  一查應該很快就有結果了吧




  --'
