url: https://www.ptt.cc/bbs/movie/M.1630396917.A.41E.html
title: '[情報] 妻夫木聡、安藤櫻將主演《蜜蜂與遠雷》導演新片《那個男人》'
content: '根據日媒的報導指出，「妻夫木聡」和「安藤櫻（安藤サクラ）」將主演《蜜蜂與遠雷》

  導演「石川慶」的最新作品《那個男人》（ある男）。




  曾以《愚行錄》和《蜜蜂與遠雷》為導演生涯開創亮眼起點的石川慶今年中才帶來較大規

  模製作的科幻新片《Arc》，可惜不叫好也不叫座。不到半年後，如今又再度發布另一部新

  片《那個男人》的消息。


  《那個男人》改編自曾被譽為「三島由紀夫再世」的日本男作家「平野啓一郎」筆下獲得

  讀賣文學獎的同名小說。劇本將由與導演合作過《愚行錄》與編寫過《琳達！琳達！》等

  名作的「向井康介」執筆。


  「在橫濱開業的律師城戶收到宮崎縣里枝女士的委託：


  她曾經有段婚姻，痛失次子後走不出傷痛，離婚收場。後來帶著長子回到睽違十四年

  的故鄉宮崎，結識「谷口大祐」後再婚，兩人生下女兒過著幸福的四人家庭生活。


  有一日，「谷口大祐」在伐木林場不幸喪命，陷入哀傷的里枝還因此得知衝擊的事實：自

  己的老公並不是「谷口大祐」。所以死的是「那個男人」究竟是誰？戶籍上叫「谷口大祐

  」的人死了，但若不知道他究竟是誰，里枝自己的過去也將朦朧不清……」（劇情簡介取

  自 博客來）




  這回，導演繼《愚行錄》後再度與日本影帝「妻夫木聡」合作，將在劇中飾演律師男主角

  「城戸章良」，而失去丈夫的女主角「谷口里枝」則將由以《小偷家族》大展國際知名度

  的「安藤櫻」演出。此外，女主角死去的老公由《初戀》的「窪田正孝」飾演，真正的「

  谷口大祐」則找來近來以《喜劇開場》等作不斷有驚人表現的「仲野太賀」演出。


  其他還有清野菜名、眞島秀和、小籔千豊、真木陽子（よう子）和柄本明等多位知名演員

  也都共同參與演出。


  《那個男人》早在今年三月就已經殺青了，預計 2022 年於日本正式上映。



  --'
