url: https://www.ptt.cc/bbs/movie/M.1684151828.A.D67.html
title: '[好雷] 那個男人A Man-不可被複製的抽象與留白'
content: "去年金馬影展\n與今年一月底上映過\n\n\n\n\n\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n (部落格原文)\n\
  \n\n海報（或說電影意象）挪用比利時觀念藝術畫家馬格利特（René Magritte） 作品：《\n不是被複製》（Not to Be Reproduced）。畫面中「像是」鏡框的鏡子，照理說映照的應\n\
  該是人臉，但作品中卻是複製著人的背影，故鏡框也同時是畫框，意旨視覺的幻術，代表\n繪畫對於寫實的再現與虛構（註1）。同時與作品命名：《不是被複製》是馬格利特作品\n\
  往往涉及符號學的能指：表面，與所指：本質的關係（註2）。\n\n\n藉由上述《不是被複製》作品的解釋，同時是電影《那個男人》中重要的概念索引-「複\n製」：意味著父系社會姓氏與血緣的繼承。電影劇情巧妙錯置了名字與長相：第一次因為\n\
  谷口大祐（窪田正孝飾）意外死亡發現長相被錯置了，而後發現名字也被換過，深入追查\n後發現他身為殺人犯的兒子，因為目睹父親謀殺現場，長大之後長相太像爸爸，所以每次\n\
  看到自己的臉就會回想當時恐怖的殺人畫面，造成內心陰影揮之不去。\n\n\n家族遺傳的「複製」，在電影劇情中開展身為一個人（a man）「表面上」（長相與姓氏\n\
  ）和「本質」（交換名字後的新人生）之間的關係。並同時指涉追查死者身世之謎的主角\n（妻夫木聰飾）的長相與姓名：身為韓國移民的血統在日本被民族主義份子排擠。\n\n\
  \n敘事上，女主角（安藤櫻飾）與陌生男子谷口大祐突然結婚，又因為大祐意外離開（死去\n），因為保險問題開始追查死者真正身分的過程，得知背後是有兩個人同樣想要擺脫繼承\n\
  父親的血緣，於是交換身份重新開始。\n\n\n放棄身份，重新開始。令人想起《睡著也好醒來也罷》或日本導演深田晃司作品中常見敘\n事：往往是對家庭與角色社會身份的挑戰，帶有某種崩壞意味的安排。但這兩位日本導演\n\
  顯然不同於《那個男人》中追求自由只是劇情隱喻，而是更要逼近解放電影的敘事方法（\n註3）。\n\n\n相較於《那個男人》雖也保持著較開放的散文性，與有別於正規電影敘事上稍稍的反叛或\n\
  逃逸空間。如影像上某段落利用如死刑犯的繪畫被抹去的臉孔，增添更多抽象感與想像空\n間。但在劇情結構上因為帶有解謎懸疑的功能性必須保持嚴謹，交代故事進展。\n\n\
  \n於是乎當故事真相幾乎大白，剩下唯一要解決的反而是作為旁觀者主角，對於自我的認同\n，朝鮮後裔的「複製」問題。末段酒館場景成功在氣氛掌控上，依循著馬格利特作品的調\n\
  性，像是在嚴謹的語言哲學中找到的創造性：因為對方遞名片，不想說出自己的姓氏，以\n及在上一場景中得知妻子好像外遇的線索（私訊傳來的「正確的」日本男子名字）。電影\n\
  嘎然而止的企圖反而投向神秘、不可知的境界。\n\n\n就像是《不是被複製》作品畫面中佔據大半的鏡子中牆面的模糊、非均質的色塊，也許指\n向是繪畫抽象本身，而非理性技術的複製。\n\
  \n\n\n\n（註1）先姑且不論《不是被複製》（Not to Be Reproduced）涉及攝影技術的複製性對\n於繪畫的影響。利用「景框」的歧義則是對應著作品名稱Reproduced與Produced，就影像\n\
  的生產在攝影術之前的「製造」都是獨一無二，與攝影之後的光學機械複製（Reproduced\n）。\n\n（註2）就《不是被複製》（Not to Be Reproduced）的本質指的是物理性：科學層面，\n\
  意味看似鏡框中反射應該是人臉；然而探討「本質」就是哲學問題，例如可能是一種存在\n方式：如現象學，或其他如各式宗教上定義。\n\n（註3）如《睡著也好醒來也罷》藉由主角臉孔的混淆、模糊、在時間結構中的拉鋸；或\n\
  《側顏》中離散意味的劇本嘗試，遍佈在涉及女主角身體與精神／愛跟慾望／家庭關係與\n社會框架等等諸多面向的複雜敘事體。\n詳見：\n\n\n--\n\n拉特飯 -\
  \ 以商業力量進入獨立市場\n(剛搬家內裝待修)\n\n--"
