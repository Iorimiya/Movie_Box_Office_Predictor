  妻夫木聰主演的


  我看了簡介跟預告 很想去看就下檔了


  是說不知道會不會上串流


  有的話很想去看


  題外話:


  日本的作品很多都不上串流


  然後都只上映一下下


  真的想看都看不到


  這部份希望可以跟韓國學學


  --'
