title: '[噁心雷] 醜繼妹'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~











  台版叫做醜繼妹

  左岸版本叫做醜陋的繼姊


  看到前中段就知道這劇本是什麼了


  台版的名稱翻譯感覺有點超譯

  就是暗喻那個灰姑娘是妹妹??


  其實女主角另一個妹妹阿尼瑪也更可愛說


  回到故事...

  這部戲簡直就是超暗黑版本的灰姑娘


  剁腳趾那邊我不敢看

  自戳眼睛那邊我也不敢看


  最後女主吐出那條蟲也噁到爆






  整部電影講的就兩個字


  執念

  其實女主角有機會遇到其他男人的


  不過她這種心理狀態

  不管如何是都不會滿足


  看到最後感覺都剩下導演要噁心觀眾的慾望XDD


  該說推這部電影嗎.....


  反正就是噁心

  以驚悚cult片來看的話是算好看的吧


  不喜歡的就別去看了







  --





  --'
