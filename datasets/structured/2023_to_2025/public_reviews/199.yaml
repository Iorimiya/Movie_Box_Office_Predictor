title: '[好雷] 《醜繼妹》好雷短評：尺度全開的惡之饗宴'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《醜繼妹》好雷短評：尺度全開的惡之饗宴\n\
  \n■ 無雷推薦語\n\n\n\n\n（以下有雷）\n\n《醜繼妹》起於少女懷春的崩壞童話，艾薇拉被王子的情詩射中紅心，從此以幻想為食。\n\n\n*「你有天份，可惜都白費了。」*\n\
  \n\n\n\n一切安排都非常巧妙。當艾薇拉嫌棄自己的臉蛋，就有整形醫師給他協助；不滿自己豐腴\n的身材，馬上得到條蟲。如果希望的火苗沒有及時燃起，形成一個固著的信念，何來後面\n\
  的瘋狂與極端？\n\n不只身體的切割與凝視，看著艾薇拉的心情七上八下，就已經讓人胃痛。\n\n除了愛情幻夢，她還有另一個動力來源：競爭。一個期待美夢成真，一個剛跌落谷底，兩\n\
  個女人的戰爭吹響號角。\n\n媽媽善於攻心計，不斷靠攀附男人向上游。媽媽可以做到，也說我做的到。我一定要做到\n，我要讓自己值得。\n\n\n\n《醜繼妹》裡面的艾薇拉沒有魔法，一切都要付出相應代價。\n\
  \n\n唯一的敗筆，就是安妮絲的媽媽教母和南瓜馬車。它將之前翻轉「魔法」意義的世界觀推\n翻， 讓《醜繼妹》變成主要在玩弄童話故事情節的翻轉作品，而對現實的指涉減弱了一\n\
  些。\n\n雖然讓安妮絲跟艾薇拉的勝敗，轉為了較無驚喜的天意安排，依然不減《醜繼妹》帶給觀\n眾的娛樂和刺激。\n\n艾薇拉雖然輸了王子，但也變得更加漂亮（過）了。\n\
  \n\n\n>>網頁好讀版：\n–\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n--\n方向不太一樣，都滿喜歡的\n\
  懼裂剖女主角的心理變化跟渴望更深\n醜繼妹是玩壞你心裡的灰姑娘故事，美好的外衣下原來大家是這樣想，醜陋噬血，體感偏\n惡趣味\n我是看片商邀請的特映\n這我有點難比\n\
  只講客觀的，血腥畫面的時長應該是「懼裂」較多"
