url: https://www.ptt.cc/bbs/movie/M.1754161906.A.64A.html
title: '[好雷] 《醜繼妹》揭開童話的有毒糖衣'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  將經典的童話故事/動畫翻拍成真人電影顯然是近年的顯學之一，今年的《星際寶貝：史

  迪奇》以及《馴龍高手》也證明了這樣的電影依舊有其賺頭。但這樣的電影也時常落入換

  湯不換藥的批評當中，看到童年時喜歡的電影以真人的形式呈現確實有趣，但對於想要看

  到更多驚喜的觀眾來講，編劇確實得要找到不同的切入點來重新詮釋這些故事，將既有的

  故事做延伸(例如去年的《獅子王：木法沙》)是個方法，還有另外一種常見的作法是將故

  事中的配角或反派扶正成主角，從另外一個角度來看故事，有時這樣的做法可以有些翻案

  文學的趣味，例如《黑魔女：沉睡魔咒》就是個很不錯的案例。

  .

  《醜繼妹》(Den Stygge Stes鷭teren)改編自大家耳熟能詳的足控童話《仙履奇緣》，迪

  士尼自己都拍過了真人電影(完全離題的一件事：我體感覺得這頂多是兩三年前的電影，

  結果剛剛查資料很震驚的發現竟然已經是十年前的電影了，跟前面提到的《黑魔女：沉睡

  魔咒》才差一年，但這部卻是體感好幾年前的電影)，歐洲製作的電影在畫面與特效的精

  緻度不可能以得過財力雄厚後的老鼠本家，要吸引大家來看他們的《仙履奇緣》，自然得

  靠劍走偏鋒：來部限制級的獵奇版本如何？

  .

  其實《醜繼妹》可以說是一部相當有意思的童話改編電影：它雖然以原著中的反派作為主

  角來演出這個故事，但事實上它並沒有太多的顛覆與翻案，它的故事實際上可以說是非常

  忠於原著的，但它告訴了觀眾：如果我們將這故事拿的童話濾鏡拿掉之後，其本質有多麼

  荒謬和令人感到不適。

  .

  童話故事中的「他們從此過著幸福快樂的日子」聽起來十分美好，但如果認真審視《仙履

  奇緣》的故事，我們會發現這故事似乎越想越不對勁：它好像在告訴我們，女人要獲得幸

  福的唯一機會與管道，就是把自己打扮得漂漂亮亮、在舞會上獲得王子，或至少是權貴的

  青睞，她們彷彿只為這件事情而生、這是她們的人生中唯一需要做的事情，其他都不重要

  。

  .

  而《醜繼妹》就是在揭開童話這層有毒的糖衣，用最獵奇病態的視覺效果告訴你：醒醒吧

  ，或許當時的時空背景這確實就是女性翻身的最主要管道，但現在已經2025年了，我們別

  再歌頌和告訴孩子這種物化、性化女性的作品了。電影中舞會那段可以說是對原著最極大

  的嘲諷：理應浪漫的舞會，實則就是一場人口買賣，充滿權勢的男性將那些女孩們是做商

  品般品頭論足，這不過就是一個讓男人們驗貨試貨的場合罷了，根本毫無浪漫可言。

  .

  當然，我們可以說某種程度上《醜繼妹》雖然有趣好看，但它對於這故事的極盡嘲諷確實

  有些用力過猛、明顯要讓觀眾對於這樣的人生價值產生心理上的不適感，其實我一向覺得

  如果你的人生目標就是「要跟一個有錢人結婚讓他養你、然後輕輕鬆鬆過日子」，而且真

  的有朝這個目標做出努力的話(無論是維持好看的身材或外貌，還是能夠給予大量的情緒

  價值，這些都不是躺平耍廢就能做到的事情耶)這本身並無不可─靠北有機會的話我也想

  啊─真正的多元應該是你能有這個之外的選擇跟機會，而不是因為現在你的選項比過去多

  非常多，所以不准有這樣選擇─但千萬別學電影裡面的主角走傷害自己的極端路線是真的

  。

  .

  最後，當電影演到結局時，我原本想到了一個可以讓原著內容顯得更加荒謬的收尾，可惜

  並沒有出現這樣的劇情：就是王子到了村裡拿著那雙鞋找人時，他找到的第一個、隨機但

  剛好能穿上這雙鞋的路人就直接麻雀變鳳凰、被王子帶走了，連灰姑娘本人都沒機會。這

  樣的發展應該會蠻好笑的，畢竟如果真要這樣尋人，這怎麼想都是很有可能真的發生的事

  情吧？


  --'
