title: '[ 好雷] 《不離職冒險王》自嘲是最高級的幽默嗎'
content: '自嘲是最高級的幽默


  我不認同這句話


  喜劇公道伯 黃豪平 下的註解最精妙


  「自嘲不是最高級的幽默」


  「自嘲是最容易拿分的幽默」


  我私心認為比較高竿的幽默


  是能輸出觀點


  指涉出這世界不合理的荒謬之處


  《不離職冒險王》就有做到這點：



