title: '[好雷] 不離職冒險王 挺好看的'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  有雷


  剛剛看完

  場次很少的一片

  特地去西門的電影院才看到

  不想看文章可以直接看結論

  基本上

  就是不情願版的白日夢冒險王


  1.劇情

  很簡單

  法國要大砍公職冗員

  總共少1千多人

  男主在被叫去資遣會談前夕

  遇到工運領袖

  聽他的意見死不投降

  因此被各種調職

  調到鳥不生蛋的地方

  劇情前段是他一路調職的糞事紀俗


  在監獄當鬱卒

  通知山地耆老都更

  幫北極熊尻槍

  總之體驗到各種生活這樣


  最後在北極熊會咬人懶趴的地方

  遇到了他真愛

  兩人回女主老家

  男主準備面對全新的冒險


  電影前段各種婊公務員

  大約2分之一時間都蠻好笑的

  至少我電波有對到


  2.中段回女主老家後

  就是相處的過程

  發現女主相當開放

  這邊開始有點認真

  笑點零星

  我是覺得還是好看

  同行友人覺得中間有點悶


  3.男主受不了異地

  還是想回法國

  女友法國待不慣

  分道揚鑣

  最後反思後慣例的轉折一波

  人生海闊天空

  好不快活


  4.全片大約一半左右的時間是有趣的

  個人覺得不帶腦看的輕鬆喜劇

  真的要反思的東西我倒是覺得沒有

  總之很輕鬆好笑的一片

  個人評價

  有機會會再看一次這樣

  期待什麼勵志的人就免了

  真的勵志大概是騙人去當法國的公務員


  5.

  in89的小影廳設計的超囧

  椅子很高

  頭要往下看才看的到字幕

  看的很不舒服（物理上

  但有播的影廳真的不多

  不過電影有好到可以忽略這點




  -----

  Sent from JPTT on my iPhone


  --'
