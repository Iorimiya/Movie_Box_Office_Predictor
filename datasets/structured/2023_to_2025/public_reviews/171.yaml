title: '[新聞] 《我在荒野做了一場夢》沈可尚導演歷時6'
content: '「我在荒野做了一場夢」，是8月22日上映的片，

  但我剛想波9月觀影心得時，

  才發現本版完全沒相關資訊，

  （更別提早就荒廢的記錄片版了 ）

  所以來補充影片相關資訊和網址。


  本片適合：

  見微知著，喜歡生態、大自然、動物、攝影者，

  只要付300-400元票價，或參與公播，

  就可看到徐仁修老師和沈可尚導演，

  到深山甚至是赤道熱帶雨林的珍貴畫面，

  我覺得畫面很美很值得，

  他們用生命全力補捉的每個瞬間，都像看到宇宙。


  不適合：

  看侯孝賢影片的長鏡頭會一路睡到尾的人，

  對影片敘事是類似夢境剪法會一臉問號的人。


  資訊網址：

  （網址我的PTT app不給貼，所以只貼內文。）


  《我在荒野做了一場夢》

  沈可尚導演歷時6年 紀錄徐仁修50年荒野足跡


  2025-07-17 08:00 琅琅悅讀 牽猴子


  台灣生態保育的重要推手、生態攝影先驅徐仁修，

  首度以個人生命歷程為主角登上大銀幕！紀錄片《我

  在荒野做了一場夢》由緯創人文基金會獨家贊助、由

  曾獲台北電影節百萬首獎的導演沈可尚執導，歷時6

  年拍攝，橫跨台灣山林與亞馬遜雨林，將徐仁修對

  大自然的深刻凝視與長年奔走荒野的精神，以極致

  詩意的影像語言凝結成片。


  導演沈可尚攜手攝影團隊，與徐仁修走入自然深

  處，紀錄他超過50年如一日，以影像、文字與行動

  守護自然的6年足跡。「大自然，花一輩子都寫不

  完，用活好幾輩子的態度，去理解祂的豐富，辛苦

  就是最大的幸福。」，這段在紀錄片一開頭的文字，

  就是徐仁修為自己的熱情留下最好的註解。


  徐仁修出生於新竹芎林鄉，自幼在農村長大，耳濡

  目染大自然的節奏，也練就一身抓魚、捉昆蟲的好

  本領；如今帶著學生上山導覽，他依舊身手矯健，

  隨手就能抓到一隻可愛的小山老鼠，讓現場驚呼連

  連。大家在他幽默又生動的解說下，不僅感受自然

  魅力，還收穫滿滿冷知識。他分享一個有趣觀察，

  水鹿常常會悄悄接近營地，原因是山區夜晚天寒地

  凍，有些露營者會在帳篷外隨地解放，到了白天被

  陽光曬乾後，結出鹽分，水鹿為了補充鈉，就會靠

  近這些「鹽地」舔食，形成奇妙又真實的自然互動。


  隨著徐仁修的眼睛看世界，導演沈可尚也在臉書上

  寫道：「過往，走入山林，大都具目的，只為了拍下

  好鏡頭，就走了；這回，走入山林，更像生活中持

  續會出現的狀態。」他們一路從城市近郊，拍到亞馬

  遜雨林，面對萬物的瞬息萬變，他們長時間耐心等

  待，就為紀錄驚喜片刻。他們在一次深夜等到清晨

  終於拍到台灣特有種長鬃山羊可愛進食的畫面，徐

  仁修說：「你們運氣很好啊，我大概是找了至少30

  次以上才拍到。」回想這數不盡的驚奇旅程，導演也

  分享：「好棒的一段大人變小孩的旅程。」


  徐仁修在片中最後留下一段話，「深入自然生態，從

  不來自刻意的大計劃，而是就算寫了遺書，活下來

  就繼續出走的熱情。」、「只要懷抱愛與浪漫，離開舒

  適圈，探險，隨時可以從腳下的土地開始。」，足見

  他一生對自然的敬畏與熱愛。


  《我在荒野做了一場夢》由七日印象製作、緯創人文

  基金會獨家贊助；海報則由知名設計師陳世川操

  刀，徐仁修拿著單眼站在草地上專注的樣子為主視

  覺，一亮相就在社群引起討論。


  為讓更多年輕世代與教育現場接觸這部兼具美感與

  意義的作品，團隊透過群眾集資平台「WaBay 挖貝」

  啟動待用票券集資計畫，邀請全台老師與學生自 8

  月 22 日起走進戲院，觀看《我在荒野做了一場夢》

  感受來自荒野的呼喚、找回自己內心的節奏。

  ----

  Sent from  on my iPhone 11


  --'
