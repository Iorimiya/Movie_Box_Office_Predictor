content: '地球特派員目前爆米花90% 爛番茄82%

  一直以來都是喜歡進戲院看動畫片的人 幾乎每一部皮克斯電影都有進場看


  個人覺得皮克斯設定的世界觀的能力真的蠻強的

  尤其是這種有點對於幻想虛構世界的這種設定

  像是比較近的腦筋急轉彎 2 元素方城市我都有二刷以上

  光美術設定跟視覺就值回票價了


  有被這次地球特派員的外星設定打中

  劇本也有在製作過程經過多次調整 感覺會更符合大眾期待（？

  看國外有進場的人好評居多 普遍覺得故事感人 好理解

  而且聽說渡邊直美有配音 不知道是哪個外星人超好笑XD


  --'
