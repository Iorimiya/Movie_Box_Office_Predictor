title: '[  雷] 地球特派員'
content: "雷文防雷資訊頁\n \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n \n\
  \ \n \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n \n \n \n\
  雷文防雷資訊頁\n \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n \n \n \n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n \n \n \n \n早就預定要看這部了，但是並非是要看有多好，而是要來看看這片到底有多爛，如同白雪公\n\
  主買票入場的心情。話說迪士尼怎麼這幾年變成這番田地？\n從預告看起來就是個一眼就知道過程與結果的電影\n \n話說一個「特別」的人類小孩，被排擠霸凌之後意外接觸到一個非人類生物，而剛好那個生\n\
  物在他同類也是有點特別的存在，這種片在一個月內就看過2次了。雖然另外兩部都是經典?\n事改真人，這部是原創，但是類似劇情真的是看的有點膩。\n \n而那個外星生物的造型，沒有眼睛的節肢動物，今年也是也是看了2次了。\n\
  甚至那個披風，最近才在大銀幕看過2次，一個是外星人，一個是意外獲得神力的暴走族。\n \n雖然標榜腦筋急轉彎團隊，但是我在看片前完全沒有任何期待。\n \n \n\
  實際買票進場之後，哇，真的是比預告更縫合。\n原本以為那個軍人是夏令營的輔導員，沒想到竟然是主角父母雙亡，而軍人姑姑來照顧，說\n到父母雙亡，Lilo(你們名字真像)也是父母雙亡之後跟姐姐生活，怎麼又又又是如此相似\n\
  然後那個複製黏土？那個BOSS同樣造型的電影正巧拿複製人當作消耗工。\n然後那個外星朋友？ 身為宇宙最強一族的後裔卻不想爭鬥。真巧啊，我剛好認識一個維京人\n\
  不愛殺龍的。。。\n \n前面講了這麼多雷同元素或橋段。其實電影就如同料理一樣，那些元素就像食材，相同豐富\n的食材給名廚煮出來就是美味，給廚藝差的人煮出來就是廚餘。\n\
  所以這次皮克斯又做到了，儘管這些元素早就出現在各種電影，但是組合起來沒有大的破綻\n，前10分鐘就能看出知名團隊老工作室的實力還是有的。\n \n劇情中引入航海家一號，以及黃金唱片更讓這故事顯得真實\n\
  (有一段在播放各國給外星人的問候語時，突然傳來一句吃飽沒「呷飽未」，\n忽然感到很親切)\n我唯一感到出戲的是那隻蟲來到地球竟然是感覺冷？ 宇宙中到處都是比地球冷的地方，\n\
  你到地球應該是要熱死吧\n \n \n開頭及結尾兩次引用美國天文學家Carl Sagan的名言 我們在宇宙中是孤獨的嗎\n讓本片質感再上升一個層次\n \n最後提一下本片原本翻譯叫做艾立歐：第三星公關，撇開諧音不講，「第三星」這說法就是\n\
  把太陽系擺在首位，相比其他各星系的外星人，這未免也太自大了。比較好的翻譯就是直翻\n艾立歐就好，或者地球公關艾立歐也行\n \n個人感覺好看程度超越腦筋急轉彎2，值得進戲院欣賞\n\
  \ \n--"
