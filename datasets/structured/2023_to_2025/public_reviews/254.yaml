url: https://www.ptt.cc/bbs/movie/M.1752141421.A.1C9.html
title: '[普好雷] 地球特派員 感人小品'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  意外比想像中好看，還默默掉了幾滴淚


  整體美術很精緻，光束的呈現算是看點

  另外用地球之於宇宙跟個人之於群體的概念去探討孤獨蠻有意思

  劇情編排上也有很多溫馨感人的橋段

  可愛擔當的外星毛蟲登登比預想的討喜非常多


  有一段登登因失溫昏迷不醒

  登登的老爸（反派）看到自己孩子的模樣

  選擇脫掉他們族人最光榮的武裝

  不在乎被看到自己最脆弱的一面

  抱著登登幫他取暖

  說了一句：「雖然我不太瞭解你，但我依然愛你。」

  尬電，很煽情但很有用（而且很可愛）


  真的邊看會邊想到家裡的事

  即使平常很愛吵架、互看不順眼

  但每次發生事情的時候

  卻也總是家人在背後為我們撐腰


  如果腦筋急轉彎是在說自己的情緒和解

  那地球特派員就是一部關於跟家人和解的故事

  是一部溫馨感人的動畫，可以看啦！

  -----

  Sent from JPTT on my iPhone


  --'
