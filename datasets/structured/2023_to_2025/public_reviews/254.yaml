url: https://www.ptt.cc/bbs/movie/M.1752339190.A.F03.html
title: '[普負雷] 地球特派員 這是不是刪掉太多劇情了'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~










  防雷頁這樣夠了吧










  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  我只能說以皮克斯作品來說不應該只有這樣的水準.


  主角的背景交代很明顯砍掉很多東西,

  導致實在無法理解主角一開始到底是什麼心態

  自然很難共鳴.


  首先一開始交代主角Elio父母雙亡,

  跟姑姑處不來,

  然後看到航海家1號介紹,

  也許地球外有生物.

  然後就立刻希望外星人把他抓走(???)

  這會不會跳太快?


  好吧,

  雖然都沒交代,

  但我可以腦補父母都走了你很難過,

  姑姑也不懂你,

  所以你就畫個餅逃避現實,

  這我有時也會這麼做沒問題的.


  接下來跟其他火腿族交流那段,

  首先黑人帶無線電裝備來

  Elio就很開心的拿走,

  然後自顧自的玩起來,

  絲毫不管那東西還是別人的,

  物主問你要做啥也愛理不理,

  請問這東西到底是你的還是他的?


  接下來金毛想要看一下你在幹嘛,

  你幹他拐子,

  然後兩人打起來,

  到這裡我實在無法同情主角.

  我也不覺得這是什麼霸凌,

  主角錯的比例還比較高些.

  看到這邊後續要說主角多孤單多可憐

  實在是無法共鳴..


  接下來基地闖禍合理性就不提了,

  就當做為了劇情必須要這樣吧.

  後續與黑人火腿族的和解也是轉折生硬,

  怎麼忽然黑人就覺得對不起主角了,

  所以幫助主角連絡其他火腿族協助避開太空垃圾?

  這點我就腦補當作主角clone做人成功扭轉印象吧,

  不然這片子要怎麼看下去...


  真不知道這部前半到底是砍掉多少劇情啊..



  不過假設你能腦補這些設定,

  那這部還是有些感人之處的,

  像是登爸發現登登快凍死之後,

  也不管面子什麼的直接扒開外裝甲溫暖他

  這段處理不差,

  有皮克斯一貫水準.


  還有主角clone分解的時候

  小玩了T2大姆指梗也是個小彩蛋

  不過我那場只有我在笑

  大家好像都沒發現 XD



  總之整體而言要不是登登線處理不錯

  大概整部就沒啥亮點了

  前半段真的有點支離破碎

  偏偏那又是塑造主角情境

  讓觀眾共鳴最關鍵的劇情...

  後面做得再好

  前面人設交代不過去就很難有共鳴了.


  說實話我還滿失望的...

  以皮克斯來講, 應該能做得更好才對.


  --


  真的

  本來有看到一些這部不是很好看的評價在觀望

  後來想說登登滿可愛的

  而且皮克斯應該不會爛到哪裡去

  結果還真給我這坨...



  也是有可能啦

  但 刪了就要補其他設定啊..

  刪成這樣很難看懂主角的困境耶XD



  真的 講難聽點我只看到一個屁孩

  沒辦法看到他遇到的困境啊...



  確實 但劇情改成這樣坑坑洞洞的實在不行啊

  搞不好原來的版本還比較感動人:I



  平心而論,

  除了主角一開始心境的處理很不行以外,

  登登線處理得不錯,

  後面跟姑姑和好如果前面沒搞砸應該也會令人感動

  但前半部實在讓人無法理解主角,

  導致後面跟姑姑和好只會讓人覺得很硬要QQ



  前面一開始帶不進主角就真的會很無聊

  鋪陳真的不太ok



  我也支持原創世界觀

  主角設定什麼性向

  只要合理不要沒事說教我都覺得ok

  但這部真的不是很好看:(



  不好意思,

  半形標點符號難道不是標點符號?

  我自認這樣比較好閱讀,

  您如果有意見可以去看其他篇.

  (而且看來只有您有意見, 您的問題顯然比較大:)

  如果沒打算討論這部電影,

  請您直接離開,

  這裡不是讓您來刁難標點符號的地方,

  謝謝.'
