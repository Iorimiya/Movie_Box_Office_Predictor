url: https://www.ptt.cc/bbs/movie/M.1750399621.A.511.html
title: '[普微雷] 皮克斯「地球特派員」:平淡無趣兒童劇'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這部片真的是可以看完預告就知道全部劇情了，以下盡可能用預告就有的東西盡量

  講述全部內容


  艾利歐幻象找到外星人，結果真的被外星人綁架了，喔對了在那之前他被欺負，扁

  他最兇的是一個金髮小白男


  上了太空之後他為了掩蓋真實身分，稱呼自己是地球和平大使，有一隻特別暴力的

  外星人因為無法加入外星人社群爆走，艾利歐想到假裝綁架牠的兒子，換取和平

  最後當然是掩蓋不了事實，不過暴力外星人還是很愛牠的孩子的，所以大家開心結束


  大概就是這麼無聊的劇情，從頭到尾幾乎可以說是沒有碰到任何挫折的冒險，更可怕

  的是全片構圖非常置中，就算用抖音視角看，還是看得下去，所有角色都站在畫面的中間

  宛如開車開很久想睡，搭配上劇情那就更想睡


  這是恐龍當家等級的皮克斯作品，延後兩年修改的東西應該集中在後段，甚至有毫不

  相干的角色橫空出世出來支援，莫名其妙，不推薦想看皮克斯高端作品的人去看


  --

  唉呦死亡威脅耶，欠告欠水桶'
