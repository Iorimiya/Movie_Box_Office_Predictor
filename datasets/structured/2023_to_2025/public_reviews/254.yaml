  誰是沙文豬?青春養成記是女主演耶，如果不是我，難不成是......?\n很跟風噓喔!去我笑闖黑幫那篇噓到XX算你們厲害\nreddit兩個小時前的文章，google根本找不到\n\
  是說好久沒看DL了，都看Variety \n您有所不知阿，我有一群黑粉"
