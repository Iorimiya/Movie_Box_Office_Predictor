title: '[新聞] 皮克斯《地球特派員》主角原本是同志'
content: '皮克斯《地球特派員》主角原本是同志、但被否決！導演和高層起衝突、女主角不爽憤而

  辭退




  （圖片來源：迪士尼影業）


  皮克斯最新出品的動畫《》（Elio）或許是他們近年製作過程最波折的其中一

  部，不僅中途換掉導演和配音員，劇情也大幅改寫。


  而隨著該片近日已登陸北美院線，更多關於幕後的波折似乎也浮上檯面。


  外媒《好萊塢記者報》（THR）稍早刊出一篇採訪多位參與製作《地球特派員》內部人員

  的報導，而其中有人就爆料，主角「艾立歐」最初其實是被設定為，而且片中房間裡

  的擺設會暗示他喜歡男生的性取向，但皮克斯內部的高層後來不斷要求淡化任何會突顯他

  的設定，包括。


  但消息來源也強調，雖然原任導演 亞卓里安莫利納（Adrian Molina）也是同志，但他退

  出前並無打算將本片描寫成出櫃故事。




  （圖片來源：迪士尼影業）


  雖然有參與《》製作的皮克斯員工，大多對莫利納的版本讚譽有加，認為他有

  清楚塑造出艾利歐鮮明的個性，


  。


  差不多也是兩年前的相近時間點，莫利納又放映了另一個版本給皮克斯內部的高層檢視，

  而據說，皮克斯首席創意官 彼得達克特（Pete Docter）給予了嚴厲批評，甚至讓莫利納

  深覺受到傷害。


  雖然這個說法無法被證實，但莫利納後來的確退出了製作，如今的成品也被後續接手的導

  演大刀修改過。


  達克特曾經解釋，莫利納的退出是因為要去開發另一部更優先的電影，不過他當時並未指

  出是哪部，直到今年三月，迪士尼才確認莫利納會回歸執導《》（Coco）第二

  集，兩者應該就是同個項目。




  （圖片來源：迪士尼影業）


  有一些消息來源認為，修改後的《地球特派員》毀掉了原本好好的作品，遠遠不及莫利納

  的原版，而且拿掉涉及的關鍵元素後，也讓故事變得缺乏重心，使艾立歐從

  可愛有個性的主角變得平凡普通。


  有消息來源也聲稱，莫利納的離開也影響了配音陣容，現在柔伊莎達娜（Zoe Salda鎙）

  所配音的艾立歐姑姑，原本其實被設定為艾立歐的母親，並且是由艾美莉卡費瑞拉（Amer

  ica Ferrera）配音。


  消息來源指，費瑞拉之所以中途退出，是因為莫利納退出後，該片的領導層不再有像她一

  樣的拉丁裔人士存在，覺得這團隊缺少拉丁裔的種族代表性，所以才跟導演共進退。


  但該位來源也提到，

  。


  雖然《地球特派員》上映後仍然獲得不少媒體和觀眾的讚賞，但

  。


