url: https://www.ptt.cc/bbs/movie/M.1681313796.A.2D3.html
title: '[新聞] 《鬼玩人》驚悚試膽 《詭樓》露骨震撼'
content: "《鬼玩人》驚悚試膽 《詭樓》露骨震撼\n\n2023/04/12 05:30\n\n\n安琪兒麥克直說最愛《詭樓》這種類型的末日恐怖片，因此拍攝時相當興奮。\n\
  （威視提供）\n\n〔記者許世穎／綜合報導〕恐怖片《鬼玩人：復活》先前在西南偏南電影節舉辦首映會，\n映後獲得知名影評網站爛番茄96%高分好評。該片由導演李克寧執導，他透露電影延續《\n\
  鬼玩人》宇宙風格，「雖然片中有黑暗又嚇人的大量恐怖橋段，其中也有誇大的成分，希\n望這能滿足娛樂元素，同時也在某種程度上能讓觀眾承受整趟驚悚旅程。」\n\n\n\
  《鬼玩人：復活》在西南偏南電影節首映後，獲得影評網站爛番茄高分好評。\n（華納兄弟提供）\n\n另一部集合驚悚、奇幻、末日元素的恐怖片《詭樓》，則描述突如其來的致命黑霧來襲，\n\
  150人同困世界僅存卻致命的大樓裡，一步步將人性逼至絕境的野蠻生存寓言，以大尺度\n露骨的震撼畫面，挑戰觀眾觀影極限。\n\n該片找來模特兒與演員雙棲的安琪兒麥克主演，她透露自己本身就是末日電影大粉絲，「\n\
  我一直很喜愛影集《黑鏡》類型的作品，一直想嘗試恐怖片，《詭樓》就是我愛的這種恐\n怖片！每次到片場都覺得很興奮！」《鬼玩人：復活》將於20日在台上映，《詭樓》則於\n\
  21日上映。\n\n--\n佛教經典的\n是 是菩薩成佛之道\n        是 佛經\n  是 佛      是 菩薩\n\n\n\n--"
