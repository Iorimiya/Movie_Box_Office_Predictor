url: https://www.ptt.cc/bbs/movie/M.1708155211.A.2F1.html
title: '[好雷] 金手指，港式的「華爾街之狼」 '
content: '春節看完了劉德華三部電影


  潛行、莫斯科行動、金手指


  我就是個華仔粉絲啊 XD



  但這金手指，我會想了想會給好雷，原因就是梁朝偉的演技


  如果沒有梁朝偉，我直接給負雷，就算有劉德華也一樣...








  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  金手指的原型就是佳青案


  導演跟編劇拍的很像是佳青案的紀錄片


  但是敘事手法、運鏡，滿滿的致敬「華爾街之狼」


  尤其程一言把嘉文世紀股票炒到20塊


  眾人擁戴他的那場戲、運鏡，完全跟華爾街之狼一模一樣



  故事的前半段說明程一言是怎麼崛起的，透過各個狐群狗黨（？）的敘事建立起來


  前半段的確有點無聊


  一直到後半段，因為香港快要回歸，股市大跌之後，這邊才變得比較好看一點


  也發現程一言做事越來越心狠手辣


  就算是商場的朋友，他一個接著一個做掉，而且完全不會心軟


  所以我才說，金手指完全看梁朝偉的演技


  從落魄到崛起，再到股市崩盤，幾個轉變，詮釋的十分到位


  劉德華的劉啟源這個角色，反而隨便抓個B咖演員來演都可以


  很劉德華又很不劉德華的演出


  很劉德華的就是，一但耍帥劉德華就會演成演他自己，沒辦法，他的臉就是帥


  很不劉德華的就是，通常劉德華出演警察就會有比較多的情緒堆疊


  這部金手指完全看不到，就是我要抓到你那種執著而已


  甚至很莫名的就是，劉啟源的這角色剛正不阿，怎麼程一言隨口說說


  我幫你大女兒安排一下國外留學跟獎學金，就一副我可以加幾個0


  這角色設定不覺得有點突兀跟衝突嗎？



  還有，結尾根本就是草草結束，完全沒交代，前面這麼嗆又有持無恐的程一言


  居然最後出庭會認罪？？？


  總之，金手指完全看梁朝偉的演技就好，如果沒有梁朝偉，直接負雷 XD


  --'
