url: https://www.ptt.cc/bbs/movie/M.1706986764.A.451.html
title: '[負雷] 金手指 大爛片'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~














  本來想說有梁朝偉、劉德華，應該不是爛片了八


  結果看完整個覺得浪費我兩小時人生 還有這五分鐘打廢文


  整部片在講港生用不法方式炒股致富，最後入獄，正義不會遲來的故事



  1、


  前面梁朝偉致富，只是一堆很賽的機會讓他致富


  沒有鋪陳他是多有智慧奸巧有心機手段的人


  所以後面說他心狠手辣之類的都感覺跟前面人設對不上


  有點讓人出戲


  2、


  一個案子追十幾年


  前面都不招供，各種方式囂張拖延都沒在怕


  他大可以砸幾百萬美金就搞定劉德華


  但就是沒有，繼續跟她耗十幾年


  然後後面莫名其妙突然認罪賠錢


  梁朝偉就算股票暴跌也還是爽爽過逍遙日子，


  不像是受到教訓，又怎會覺悟投降認罪？


  這轉折跟結局真的太草率


  3、


  電影開頭還鋪陳一段


  廉政公署跟警察之間的對立，後面只有零星的提到


  但這條線就沒有再延伸了


  不知為何要加這個，是為了還原正史？


  其實這整段劇情抽掉都對整體沒影響


  4、


  片頭有看到武術指導錢小豪的樣子


  但...整部片好像沒打鬥？


  只有一些拉扯，一個撞車的片段...


  害我一開始看片頭的時候還以為有打鬥場景期待了一下...



  還有一個小東西，梁朝偉這麼聰明，整部片也沒打鬥


  真的不用叫別人保鑣打自己，抹個糖漿演一下就好，真的打，很蠢


  5、


  蔡卓妍的捏捏也有夠假


  情婦這條線後面也沒延伸，也不知道提梁朝偉老婆幹嘛


  好像從頭到尾沒現身？



  就整個劇情毛絮鰻亂的，這裡說一點那裏說一點，不知要幹嘛



  對了，之前中國很流行一種小說劇本


  就是窮小子女友被有錢的朋友上了


  甚至窮小子幫忙買保險套去房間給朋友，才知道房間裡的是女友


  然後隔幾天窮小子發現世界首富就是自己爸爸，卡裡多了兩億之類的


  接著有錢好友懺悔窮小子手下留情，女友求原諒的劇情


  這種劇情是為了撫平中國普遍打工仔幹一輩子無法翻身的妄想


  但為何導演為何花這麼多篇幅描述梁朝偉爆富過程


  也是這個原因嗎？



  心裡想說港片這十年...真的...


  好萊烏編劇罷工跟你們有關係?怎麼劇本這樣爛？


  現在我心裡想到最近好看的港片，還是功夫、少林足球...


  哀，說到要拍東方修行觀這種大徹大悟最後正義獲勝的腳本，還是星爺最厲害...


  我話說完，誰贊成？誰反對？



  我是做好被噓的心理準備了...


  --'
