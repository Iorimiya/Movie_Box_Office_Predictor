url: https://www.ptt.cc/bbs/movie/M.1705570462.A.A87.html
title: '[普雷] 金手指'
content: '學半套的華爾街之狼

  有在玩股票、投資會比較有感觸

  這手法就算是現代還是在用

  應該說不斷重複上演

  在電子交易的現代

  要再看到以前交易員掛單、喊單、搶單已經不可能了

  更不可能用手寫價錢

  雖然時間有到10幾年

  但梁從頭到尾看起來都沒老

  反而是劉很明顯的外表跟言談都有年輕到老的感覺

  裡面出現不少熟悉的港星

  審問時每個人講的金主故事都不一樣

  每段都演得很誇張很好笑

  不過電影絕大部份時間都很悶

  講金融、股票、貸款沒碰的可能連為什麼被抓都搞不清楚

  後面有提到合夥人任達華的角色失蹤

  但沒演出是否已經死了

  也呼應了現實人物生死不明吧

  這部片就是懂的人會覺得有意思

  不懂就會想睡覺

  畢竟不像華爾街之狼拍的那麼誇張也沒那麼煽情

  -----

  Sent from JPTT on my iPhone


  --

  01/18 17:56'
