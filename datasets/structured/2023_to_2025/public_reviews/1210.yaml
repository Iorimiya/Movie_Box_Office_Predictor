title: '[普雷] 可惜了好演員 金手指'
content: '老牌演員一如往常把工作做好，演技沒話說。但是劇本跟導演的功力很不給力，


  沒辦法完全發揮演員實力，節奏、舖成都不成熟，整場戲幾乎沒有什麼讓人震


  懾、驚訝、緊張的地方，明明有梁朝偉劉德華這種只要發揮6分力就能撐住整個


  場面的SS級演員，卻沒幾個有張力的地方讓他們發揮，明明好多東西可以做得更


  有層次的，好像把一鍋山珍海味的食材煮壞了一樣可惜。我甚至花點時間回想才


  想起4個小時前看的戲結局是什麼。




  想看的還是可以進戲院，看看演員還是值得啦


  下面心得有劇情雷




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  1. 比較精彩的戲大概就開始那邊梁朝偉演戲騙松哥買KK的爛房吧，其他的就很流


  水帳...



  2. 開頭那場警察跟連政公署的對峙看不出來有任何作用，就只是交代有廉政公署


  這段歷史，他不講我看到戲裡有廉政公署也知道這就是政府的查緝單位，劉德華的


  角色的刻劃在這場戲也沒有因此被描述得多到位，完全沒必要這樣登場。



  3. 我覺得整部節奏安排很亂，梁朝偉的部分沒記錯的話，先是來香港、跟KK認識、


  然後第一個case騙到松哥，然後突然就轉到被調查再開始倒敘，然後之後跟劉德華


  的種種過招。是還不至於看不懂，但是也不知道這樣效果在哪?



  4. 虎頭蛇尾，前面梁朝偉的崛起，到公司股價因為大盤不好下挫，到中間被控告、


  、訊問、脫身。但是後面結束卻非常匆促潦草，莫名其妙出現金主穆沙拉哈法然後


  莫名其妙被抓，總是有藏招的梁朝偉突然就認罪(網路上有說因為香港97年回歸有變


  數所以趕在96年認罪，但這在電影裡沒有明顯交代)



  5. KK兒子出來坦那一段沒有表達很清楚的樣子? 其他人被做掉了所以被脅迫出來?


  --'
