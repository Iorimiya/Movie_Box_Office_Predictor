url: https://www.ptt.cc/bbs/movie/M.1703954802.A.B0D.html
title: '[普雷] 金手指 梁朝偉跟劉德華的巨大鴻溝'
content: '剛剛看完金手指

  梁朝偉依然一支獨秀力壓全場

  劉德華的話 不知道的人還會以為他在拍雜誌型錄

  整常都在耍帥


  以前無間道有優秀的劇本撐著

  但是這部沒有

  而這部片一半是梁朝偉 一半是劉德華

  所以整部片有一半的時間都很無聊

  劉跟梁對戲也因為程度差太多激不起火花


  整部影片中間炒股部分有張力

  影片後半部又拖又長

  也缺少一個有力的主軸


  給普雷是因為梁朝偉

  不然這部片絕對是負雷






  --

  梁的部分確是比較多啦 但劉的部分也不少 而且體感時間因為無聊所以特別長

  然後我覺得這部片的確主打雙雄 兩人對戲我記得就四五場以上

  但編劇和劉的表現實在差強人意 才會讓你覺得劉看起來像工具人'
