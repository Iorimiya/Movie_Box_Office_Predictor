url: https://www.ptt.cc/bbs/movie/M.1707843670.A.225.html
title: 'Re: [負雷] 金手指 大爛片'
content: '剛看了這部片，提出我個人的看法

  打從香港反送中後，我就關注到香港

  為什麼要特地搞一個送中


  倒底有什麼問題


  為什麼香港是亞洲金融中心

  為什麼瑞士是歐美金融中心？？


  答案就是洗黑錢（兩地不管制金錢來源）


  能提供洗黑錢的平台，才叫做金融中心



  這也是原作者看不懂的一點


  香港的股市一天就可以價值十倍

  這跟台灣不一樣，台灣以前是上下7%

  現在是10%


  也就是某A買一個股票100萬，

  我就能幫你炒上一千萬，

  你乾乾淨淨的從股市賺了一千萬

  --------------------

  劇中鋪成香港警察抗議這一段就是這樣

  --------------------

  一堆警方的黑錢怎麼辦


  雖然說不追究，但你有錢一定會被查阿


  所以讓人用股市洗乾淨就好


  洛哥真的去加拿大了嗎？

  加拿大在當年無聊死了

  一個人帶著幾百億慢慢花？


  所謂的權力，就是有一批人帶槍保護你

  才叫權力


  或許警方高層集團就是背後的金主


  也或許新馬就是華人黑幫在控制


  也或許就是警方老友，才沒殺華仔全家



  劇中提到因為在新馬的老婆也叫嘉文

  這完全是幌子阿，


  劇中特地說他在新馬的太太叫羅嘉文


  廣東發音，就是洛哥蚊（蚊就是錢）

  （不知道是不是刻意）


  一個女人不可能這樣等老公

  都可以編一個假金主，假老婆當然可以



  不過蔡卓妍一直是我心中的女神

  她再裝上巨乳，完全修正他的短版



  劇中最後他認罪做三年牢

  也反映著一個時代的轉換完成


  你沒能力瞎玩股票是不行的

  那舊時代警方的黑錢那麼多錢也洗乾淨了


  沒有黑錢那種可以賠本的洗法


  怎麼堅持嘉文集團的炒股



  我想這就是導演想表達的真相


  可是太直白顯得正義又太無力


  才用這種隱晦的方式。











  --

  重點是金融管制，不管制資金來源'
