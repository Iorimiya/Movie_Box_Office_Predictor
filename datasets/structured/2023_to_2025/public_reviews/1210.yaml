url: https://www.ptt.cc/bbs/movie/M.1704202118.A.EA0.html
title: '[] ［好無雷］金手指-沒有廣電監管的話會是神作'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  金手指本質是部好作品。


  但看到片頭的天津工作室，早預期了沒法像早期銀河映像時期的寫實風格，應該說，再也沒有那種自由肆意的港味。


  劇情開始


  講到梁朝偉如何從想認真搞建築，到香港炒金融致富的過程。


  這段企圖極強，從排場、紙醉金迷的呈現、人物時而獨樂、時而熱鬧的強烈對比，有企圖想媲美華爾街之狼那種幹一大票後的極樂氛圍。


  整部片其實節奏還不錯，特別看到香港一線大咖擔任主演和配角，說真的，光這個陣容，就值得6、70年次的港影粉絲進場支持一下這些老戲骨。


  個人淺見，其實真正結局應該不是如正片結尾的結局，而是片尾倒數20分鐘的結局，才是莊文強、楊受成兩個大師級編導，想留給觀眾真正的結局。


  至於符合廣電局、投資方監督硬給的結局版本，常看港片的可以當它不存在，哈！


  也因此會有其他篇影評寫到，終段結局偏拖、冗長的問題，我更相信那只是為了交代官方要的結局，而非真結局。


  無論如何，這部片的反轉與樂趣仍是相當精彩，非常值得一看！







  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  --

  Sent from nPTT on my iPhone 14 Pro


  --'
