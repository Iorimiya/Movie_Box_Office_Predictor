title: '[新聞] 金手指龐德女郎 奧妮布萊克曼辭世享壽94歲'
content: '金手指龐德女郎 奧妮布萊克曼辭世享壽94歲



  （中央社倫敦6日綜合外電報導）英國老牌女星奧妮布萊克曼（Honor Blackman）曾在007

  情報員詹姆士龐德（James Bond）系列電影「金手指」（Goldfinger）飾演龐德女郎，家

  人今天表示，她已辭世，享壽94歲。


  法新社和「衛報」（The Guardian）報導，奧妮布萊克曼在與史恩康納萊（Sean Connery

  ）合演的1964年007系列第3部電影「金手指」中，飾演「龐德女郎」蓋羅爾（Pussy

  Galore），讓當時將近40歲的奧妮布萊克曼聲名大噪。


  她的家人今天發表聲明說：「我們很悲傷地宣布，奧妮布萊克曼已辭世，享壽94歲。她在

  薩塞克斯郡（Sussex）路峨斯（Lewes）自宅，因自然原因安詳離世，家人隨侍在側。」


  「除了是一位備受敬愛的母親和祖母，她也是一位擁有龐大創意天賦的多產演員。」


  龐德電影製片人威爾森（Michael G. Wilson）和布洛克里（Barbara Broccoli）在推特

  發出聲明表示：「一位電影巨星隕落，奧妮布萊克曼在金手指中飾演蓋羅爾的形象，將會

  永留世人心中。」


  「她是龐德家族中才華出眾，且備受愛戴的成員，我們的心此時此刻與她的家人同在。」



  （譯者：吳昇鴻/核稿：劉學源）1090407




