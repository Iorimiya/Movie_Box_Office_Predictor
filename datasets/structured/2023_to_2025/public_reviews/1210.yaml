url: https://www.ptt.cc/bbs/movie/M.1705052612.A.452.html
title: '[普雷] 金手指：是盛世，亦或者海市蜃樓'
content: '寫在心得之前

  其實整體來說我蠻喜歡這部電影的，單純以個人喜好來評價，我會給他好雷


  >但電影太長，也實在太拖了、我在長春國賓觀看後面真的有觀眾在打呼、醒來還跟女朋

  友聊天，我也真的是詛咒他

  >電影感覺很長的原因有一部份是他們一直在穿過走廊在走路，其實我也還算喜歡看帥哥

  走路，但一再重複類似的場景，真的很想問到底還要走多久...

  >另外本片應該是想貼近真實事件，但在法院上審判的戲拍得真的很普通，又一直中斷劇

  情的連貫性，看到中後段真的有點累


  如果喜歡香港電影，還是蠻推薦進電影院看，電影有拍出香港當年的盛況到衰敗，以及股

  市高低起伏怎樣和世界經濟互相影響，當然還有那些盛世之下的紙醉金迷。


  ———以下有雷———

  但本片爆雷也不太影響上面所說的觀影感受


  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  故事的開始，梁朝偉飾演的程一言(後面簡稱程一言)在一艘貨輪上醒來，我還以為是在回

  顧他怎麼淪落到海上的故事，很快發現故事其實是講他已成為商業巨鱷後被ICAC調查舞弊

  案件，而開始講述他如何從沒有證件、一張破床的小人物走向需要三十幾位會計師共同查

  帳的集團主席。


  電影前半段大概就是講他如何靠自己的聰明、靈活、懂得操作人心而一步步帶領公司越走

  越大，節奏很輕鬆、畫面有年代感，看著他的公司(以下簡稱:嘉文地產)不斷賺錢、發展

  迅速很有夢想、也非常迷人。


  但他的公司發展其實是支線，主劇情其實是ICAC的調查劉主任(劉德華飾演)在查程一言公

  司的黑幕，所以一直在輪流逼問公司關係人，比較可惜的地方我覺得是名名有兩大影帝，

  他們兩位的對峙跟衝突、張力都會因為程一言說他低血糖昏倒或者莫名的原因中斷那個情

  緒。


  加上關係人很多，每個人也不是輪流講一段他們跟程一言、嘉文地產的關係，就只是透過

  偵訊畫面串場的感覺（主要還是在講程一言如何崛起，沒有什麼刑偵、犯罪片的氛圍）

  但還是有吸引我的對手戲，最喜歡的一個橋段是梁朝偉在股市"莊家"任沖鬥智的片段

  表面上程一言好像賠了很多錢在股市，但最後看起來這都是他為了買下一個自己的股市莊

  家而演出的戲，看得出程一言很會用不同方式收買人心，包含ICAC的劉主任都一度被他所

  畫出的大餅吸引（相信這也是暗示，這並非第一個被他收買的警界、調查的相關人員)


  戲裡劉主任說如果能讓你脫身值多少錢，程一言卻直接下逐客令的劇情也很有意思，他或

  許一直很清醒，知道並不可能真的脫身，所以一直在拖延而已


  其實看到故事中間，電影卻還在重複營造程一言背後還有高人操作這個局，但可能梁朝偉

  飾演，整個氣場太強、或者說故事轉得太硬，根本就已經猜得到所謂背後的人，讓人覺得

  很故弄玄虛。（而且我後面的人還瘋狂打呼我真的是白眼到天靈蓋)


  撇開上面不談，隨著莊家跟程一言的計畫，嘉文在股市大漲、還把股票當錢收購許多公司

  、企業，甚至隨便跟銀行開價要貸款這些畫面非常精采，畫面節奏很快帶過，但說實話本

  片很多劇情明明都可以跟這段一樣，又華麗又好看，光看這段其實我就很喜歡這部電影了

  (要求真低)


  反正後來香港準備回歸中國，加上世界經濟跟局勢影響，香港也迎來股市寒冬，感覺政府

  也是要抓一個戰犯，所以很積極查這些透過股市洗錢跟特殊交易的大戶。


  後面就是ICAC蒐集很多次證據，但都因為一些很爛的理由，程一言也沒坐牢，還在外面享

  受自在奢華的生活，反倒他的同夥不管是意外死掉還是自己去認罪，反正程一言就還是逍

  遙法外...


  一直到故事結尾，重新在揭露一些程一言就是那個對別人心狠、對自己也心狠的人，但邪

  不勝正，ICAC還是在香港這個又能賺錢又講法治的地方費盡心力地送他坐牢了（雖然這個

  案件纏鬥了快十年，但牢只做了三年，但還真的是非常地講法治!）


  看完有一種，好吧他去坐牢了

  但就是...電影的過程比收尾好看


  所幸劉主任在逮捕他之前說了一個冷知識

  罐頭是在185X年發明的，開罐器比罐頭晚了十幾年才發明

  總之就是想表達遲來的正義還是會降臨


  我雖然覺得假如程一言真的像電影一樣都是他搞死這麼多人（不是別人的替死鬼)那這樣

  的懲罰真的算是公平正義嗎？



  而且對於那時的香港而言

  問題真的於程一言跟他同夥這些人多麼投機跟狡猾嗎?


  是不是很多監管機構

  根本沒有在景氣好的時候確實監督這件事

  景氣差的時候才會覺得這些禍根是很恐怖的


  總之這個故事的尾聲會讓人不經感慨


  是盛世、

  卻也是海市蜃樓


  以上


  -----


  題外話


  1.第一個題外話寫給想純欣賞"演員美貌"的

  總之我原本因為廣告很大，其實是想看<潛行>

  結果發現根本還沒上檔就看這部

  電影裡面就是劉德華還是很帥，但梁朝偉造型很特別...

  然後很喜歡裡面演銀行公子哥的演員"陳家樂"，哀呀他好適合這個妝造喔!


  然後蔡卓妍在裡面造型也蠻多的，還蠻喜歡他親梁朝偉那齣戲


  2.整部片可以好好欣賞舊香港的繁華

  好喜歡那些舞會場景跟莊家在交易所買賣的畫面

  雖然這些都像是海市蜃樓

  但還是拍出香港金融中心的一個角落

  跟奮力上游的人的身影

  看了都忍不住覺得非常迷人


  3.這部放在賀歲檔其實算蠻示警的電影

  可惜不夠歡樂所以沒機會排賀歲

  但覺得會很適合找親友看完，聊聊以前誰完股票之類的話題

  感覺會很多聊天話題，很歡樂

  同時可以示警那些正在自以為玩股票、基金自己有多聰明的人

  畢竟很多時候都只是設局的人設計好的一個數字而已


  但抱著看影帝對峙的心情去的人

  最好有預期他就是一部商業帝國的起落的故事

  大概就這樣


  --'
