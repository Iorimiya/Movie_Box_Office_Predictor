title: '[新聞] 《金手指》龐德女郎過世　塔妮亞馬萊享年'
content: '《金手指》龐德女郎過世　塔妮亞馬萊享壽77歲



  英國女星塔妮亞馬萊（Tania Mallet）曾與史恩康納萊在1964年的007龐德電影《007：金

  手指》（Goldfinger），今傳出不幸過世的消息，但未公開死因，享壽77歲。龐德官方推

  特也發文證實消息：「很遺憾地得知《007：金手指》中飾演Tilly Masterson的塔妮亞馬

  萊過世，在這個悲痛的時刻我們的心與她的家人朋友同在。」


  塔妮亞 16歲就出道成為模特兒，唯一一部登大銀幕的作品就是《鐵金剛大戰金手指》，

  之後仍專注於模特兒事業，她也是73歲英國影后海倫米蘭的表姊，海倫米蘭最近才向媒體

  表示希望能在龐德系列電影飾演反派角色。（謝宛儒／綜合報導）



