url: https://www.ptt.cc/bbs/movie/M.1592636750.A.FD4.html
title: '[  雷] 普'
content: '金手指是007系列的第三集，史恩康納萊老爺任期內唯一一部劇情幽靈黨沒關係的作品。

  在imdb上是第三高分，第一和第二分別是皇家夜總會與空降危機。


  一開頭，我們的007以高科技偽裝潛入某化工廠，用一管牙膏炸藥炸掉了化工廠，最後與

  漂亮小姐親熱時，用一個電風扇電死了一個雜魚，不要問為什麼電風扇會發出紅光。



  接著就是主題曲了



  007來到邁阿密度假(工作)，目標就是本集的BOSS奧瑞克金手指，007發現金手指連贏一周

  牌局的祕密就是望遠鏡作弊大法。


  並在泡金手指馬子同時逼金手指輸掉這輪牌局。金手指

  作為一個有格調的反派決定給龐德一個下馬威，他的手下打暈007並殺掉那位美女。


  回英國後，政府因為黃金走私問題而懷疑金手指，因為金手指於英國和歐洲大陸皆有合法

  煉金設備，令007與金手指接觸，途徑是去打高爾夫球，之後金手指和007以政府公物__金

  塊做賭注，輸了五千塊，因此再一次警告007不要想辦法調查他。


  接著007開著DB5，

  利用偷裝在金手指車上的追蹤器一路從英國跑到了日內瓦，在監視金手

  指途中遭到美女槍擊，機巴的007就用DB5的裝備把別人的車子搞壞，再去幫助人家， 之

  後來到了金手指的工廠。007在此發現金手指如何走私黃金，同時看到金手指與中共核子

  專家交談，得知了滿貫計畫。


  007接下來發現了槍擊他的美女，並知道她是先前慘遭毒手那位小姐的妹妹，歷經一番混

  戰，美女被怪俠的飛帽打死，007也被生擒，綁在一個大平台上。



  007的本該命決於此，金手指認為007對她的計畫一無所知，但是一番唬爛之後，他決定暫

  時放007一條生路。


  被麻醉後的007在飛機上認識了本集的龐女郎，普西(PUSSY)，是金手指的私人機師，而此

  時普西對007的雄性魅力是免疫狀態。下飛機後，007被關進牢房，用很蠢的方式逃出房間

  後，007得知了滿貫計畫的大概內容。


  金手指策劃用飛機撒播毒氣使銀行周圍六萬人死亡，然後炸開銀行，利用一枚小型核彈在

  金庫引爆，致使在此的黃金受輻射污染，這樣美國國內的黃金將無法流通，而金手指控制

  下的黑市黃金交易將獲得十倍以上的巨額利潤，中共也得到他們想要的西方經濟危機。

  同時金手指將所有協助他的外人用毒氣殺死。




  之後是普西和007的獨處時間，歷經了一些神奇配樂和打打鬧鬧之後，007終於感召了普西

  ，使普西向華府通報，並偷偷將毒氣換成睡眠瓦斯，007的這個舉動可謂是一砲救國，單[

  槍]匹馬拯救了美國經濟和六萬人的性命。



  使用超大雷射切掉金庫大門後，007與核彈還有怪俠一起進入了金庫，CIA好基友萊特同時

  帶著一隊人馬向金手指的部隊發起攻擊，之後007掙脫銬在核彈上的手銬，歷經一番大戰

  ，終於電死了怪俠，而在外頭的CIA好基友萊特在大戰後，也成功進入了金庫並解除了核

  彈，但是金手指卻趁亂逃走了。



  (就算在美國，CIA還是只能當007的工具人)

  最後在前往華府的飛機上，金手指突然拿著一把手槍現身，亂鬥之後，手槍打中了機身，

  金手指被壓力差吸了出去，007和普西則成功跳傘逃生，在野外又鍛鍊了一番。




  金手指雖然一些橋段放到現在根本是蠢到家，不過主觀來說，以007的平均水準來說算不

  錯?


  --'
