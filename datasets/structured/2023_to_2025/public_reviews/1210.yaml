url: https://www.ptt.cc/bbs/movie/M.1703933381.A.549.html
title: '[雷] 金手指'
content: '看到劉德華和梁朝偉一定要看的啊


  超多大咖演員，還有英皇必看的吧











  防雷線——————————————————-










  一個商人為了拼一口氣來到香港，從此逆轉人生


  股票真的可以當錢花


  男人有錢就變壞，女人變壞就有錢


  這篇很多金融商品的操作我完全不能理解


  這需要內行講解了


  但是有錢真的能為所欲為


  廉政公署感覺沒什麼威嚇效果


  劉德華為了抓人花了十幾年，不值得但是爽


  後期哈法那段有點太草率


  程一言最後會認罪是因為不得不認還是什麼原因


  感覺很開心反而沒有不爽


  蔡卓妍還是很正還爽到一個肥宅


  這部片我給80分



  --'
