  想模仿華爾街之狼，但主軸不明確，節奏緩慢又無聊，中間插了一些奇奇怪怪的人


  結局了無心意，應該又受到了上面的審查


  真的是蠻難看的一部片



  評分：5.7/10


  還有阿sa怎麼那麼大！？






