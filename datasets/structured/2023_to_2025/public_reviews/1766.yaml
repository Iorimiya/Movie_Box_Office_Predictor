title: 'Re: [負雷] 捍衛任務4 全面退化'
content: '我覺得第一集，設定上還稍微比較嚴僅，較像終極警探的公式，男主角有血有肉，被打會

  受傷，靠各個擊破，來打倒敵人。


  第二集開始就放飛了，如剛開始去黑幫那，想把愛車野馬搶回來，有一堆打戲，然後

  最後解決人居然是開槍。


  是說黑幫知道傳說中的殺手要來找麻煩了，沒有槍、好歹板手或刀也準備一下，全

  徒手作戰，根本太唬爛。


  要去暗殺沐浴淨身的女大老，怎麼來就怎麼回去，還不怕死的走最舞池，也不稍微

  變裝一下，怕人認不出來喔。


  第三部去見Berrada時，和Sophia一起在人家家裡開無雙，打的人家不要不要。

  我查了一下Berrada設定，說他是這殺手世界裡，專門鑄造那些殺手用的金幣。


  這麼重要的人士，連狗上藏隻槍也沒找到，難怪長老第四集一下就被暴頭。


  我看第二部後，就懶得去吐嘈了，純當爽片來看。

  像第四集的金牙胖子，聽說就純粹為了致敬洪金寶，在殺破狼裡的樣子。





  --

  認真講，我覺得就純粹，要把第一集，在澡堂的槍戰，硬要搬到第二集而已。


  我在看這電影當下，還以為導演是吳宇森，調性和鎗神和不可能任務2太像了。

  John Wick和法國上層老大Marquis談判時，我看到還有鴿子在基努李維後面飛，我

  快笑死了

  我覺得大坂櫃台的女演員，應該會紅。我看完電影覺得片尾曲很好聽，發現是她唱的。



  她的本業居然是歌手'
