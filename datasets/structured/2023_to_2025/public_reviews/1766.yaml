url: https://www.ptt.cc/bbs/movie/M.1680717797.A.DBC.html
title: 'Re: [大負雷] 捍衛任務4 找不到稱讚的點'
content: '原文先吃掉


  很認同4雖然是收官之作，但真的有很多很冗餘的畫面跟bug滿滿的情節，雖然基哥很帥但

  還是不得不來吐槽一下


  首先是第四集雖然情節上比第三集豐富，但剪輯上真的是死命的在拖台錢，主要是大阪飯

  店部份打不完的雜魚，還有後來要去決鬥地點前樓梯的那批，其實不管怎麼看都不需要那

  麼多無謂的打鬥


  再來是甄子丹的部份也很可惜，角色設定上他是一個盲人，一開始在大阪飯店設計他用接

  待鈴來判斷敵人位置這個真的設計的很棒，可惜後面越來越放飛自我，我都搞不懂他到底

  是盲人還是帶著墨鏡的普通人了


  打金牙胖子的那邊我也很想吐槽，旁邊那些觀眾到底是瞎了還是腦殘，前面開了一堆槍殺

  了一堆人好像沒看到，胖子死了以後才跑的好像後面有鬼在追一樣，整個就很出戲


  但也是要稱讚我覺得第四集的美術陳設、燈光跟攝影都很棒，大阪飯店整個設計的很有感

  覺，尤其是廢墟裡面打鬥那段俯瞰的那個長鏡頭就拍的很棒



  然後不知道為什麼我跟我哥討論到侯爵這個角色如果找山謬傑克森來演會變成怎樣：最後

  飯店經理嗆他：「他根本沒有開槍，你這個豬頭」然後畫面會變成一顆胸上特寫zoom in

  到整個臉的的大特寫：「馬的法科」然後被一槍爆頭


  --'
