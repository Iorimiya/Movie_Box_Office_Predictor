url: https://www.ptt.cc/bbs/movie/M.1680624271.A.FB7.html
title: '[  大負雷] 捍衛任務4真的有夠難看'
content: '先說捍衛任務前面三集都有看，第三集還勉強能說服自己這是無腦片爽片，這集真的看不

  下去了，超想直接走人


  以下邊打邊想不按照順序開始噴


  1.甄子丹這個角色前面演盲人還會記得自己是盲人，敲敲打打探路放門鈴，後面越演越嗨

  直接不演了，敲敲打打都不做了，偶爾裝模作樣一下，然後最後單挑給我選對射，盲人到

  底要怎樣在這種環節對射啦，是不是在羞辱盲人啊，甄子丹這角色真要說演的不錯的地方

  就是拐杖劍武的滿6的，阿最後不安排讓他們肉搏秀一下我也是看不懂


  2.帶著狗的黑人到底是要錢還是要挺John哥，一開始殺掉就有2000萬了（印象中），結果

  貪婪嫌不夠，阿最後4000萬因為john 哥救了他的狗就放棄了，然後在椅子上看戲…這角

  色如果從一開始存在意義就是為了要凸顯那幕john 哥愛狗人士那真的是滿可悲的啦，定

  位比玩命關頭的傑森史塔森還要尬，阿不然這黑人就是從頭到尾走個嘲諷模式，最後再嘴

  侯爵幾句垃圾話讓觀眾笑笑也好，真的莫名其妙欸......



  3.john 哥為了重回家族去殺金牙胖子，阿金牙胖子到底又是在演三小，一開始瘋瘋的淡

  定淡定的還讓人覺得有料，後面作弊後差點就被撲克牌割沒了，然後一路跑，跑一跑再回

  頭打，啊重點是金牙哥打的是這部戲唯一有稍微正面打贏john 哥的，欸不是啊打的贏那

  你一開始到底在跑三小啦幹你老師奈德麗咧，然後槍一直射、架一直打，結果背景跳舞的

  人一直跳一直跳一直跳，我一開始還說服自己是全部拉k 抽麻失去五感，啊結果幹你的架

  打的差不多了然後人才開始會尖叫逃跑？？？難道我還要可憐到自己腦補他們藥效退了膩

  ？



  4.怎麼找長老的也不說，沙漠這麼大這麼輕鬆就幹掉長老，算了這邊我也懶得多說什麼了

  相較其他吐槽點這邊沒解釋清楚反而不會不爽



  5.侯爵一開始也是心狠手辣的氣勢有做出來，我還以為有料，尤其有一幕帶到西洋劍女再

  擺陣，我還想說可能是用劍高手，啊結果最後是草包一個？？？？？這部到底是怎樣啊，

  反派明明一開始都有那個氛圍出來，結果最後爛到笑，就算你不知道john 子彈用掉了沒

  ，也不會走過去送頭吧？john 又不是看起來掛了沒反應了，但這就算了，居然還有那個

  美國時間看溫斯頓嘴他然後被暴頭…….歐買尬我的頭好痛好像也被這部電影爆擊


  6.我很喜歡基哥，但這集他的表情搭配台詞真的要多尷尬有多尷尬，台詞才多少而已，但

  基哥這集除了動作沒話說以外，感情的呈現真的完全不行


  最後片尾那個彩蛋的確很重要，因為再次告訴了我自己蠢，不但進來看被氣了一次，連看

  完了都不放過我又在氣了一次讚啦！

  .

  .

  .

  .



  我他x 看起來會在乎瞎子甄子丹有沒有死嗎？

  給一點基哥沒死的線索我可能還會考慮下集再次被騙，結果是這個？還等超久…



  結論：爛爛爛爛 還沒看的等netflix 上就好了


  --'
