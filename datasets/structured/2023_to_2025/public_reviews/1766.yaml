url: https://www.ptt.cc/bbs/movie/M.1679829021.A.952.html
title: '[好爽雷] 捍衛任務4 遠比預期的好看'
content: "狗本不打狗本\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n本來以為快三個小時的片長會看到睡著，沒想到全程清醒看完了。\n\
  \n只可惜中間實在忍不住跑出去上廁所，少看了基哥與甄子丹在教堂談心那幕。\n\n這集總算屏除二、三集套招感與冗長武戲的問題，每個動作戲都各有特色，\n\n而且場景與特效很漂亮，看起來很舒服，遠比前幾集一片黑壓壓好得多。\n\
  \n水幕、鳥瞰、馬路中間、長階梯每個場景都有配合地形特色的演出，看得超爽。\n\n\n\n基哥出來就是殺，不像上集打得老態龍鍾，這集動作編排明顯進步。\n\n\
  人人標配防彈西裝讓槍戰不再是一槍爆頭，糾纏、擊倒、打頭、對屍體補槍，\n\n這集的約翰真有殺神之威，也更擅長利用地形戰鬥。\n\n鳥瞰那幕簡直像在玩古早射擊遊戲一樣，非常有趣。\n\
  \n最後用傳統決鬥還以為導演、編劇在搞什麼飛機，沒想到一個超級大逆轉展開，\n\n被規則玩弄三集的約翰終於反將一軍，引誘侯爵拿槍對著自己，正大光明規則殺爆頭。\n\
  \n身為本集唯一被一槍爆頭的人，侯爵生前不可一世，死後卻無人關心，\n\n高桌會代表與工作人員裝備收一收就閃人，最後大概是溫斯頓出金幣找人來收屍吧。\n\n基哥少數表現不好的就雙節棍戰，打起來超級沒力，台灣家長拿愛的小手都比較可怕。\n\
  \n不過看在基哥努力甩出虛虛的雙節棍花招、拚死命都要把雙節棍當臘腸掛脖子上，\n\n就當作是致敬李小龍好了。\n\n\n\n\n甄子丹的角色肯恩戲分遠比想像得多，本來以為他只是來客串一個華人路人殺手，\n\
  \n但實際上他的戲分比重不在基哥之下，比起日本便當代表真田廣之更是不在話下。\n\n甄子丹詮釋一個相對真實的盲人殺手，一般電影中的盲人通常都神話過度，\n\n\
  眼盲心不盲，第六感與心眼比五感正常的人還準，肯恩用感應門鈴索敵、手杖扭來扭去，\n\n帶著喜感卻又凶狠的戰鬥方式，不愧是侯爵欽點的殺手。\n\n導演也給甄子丹做足面子，讓他重現過往在好萊塢的印象來致敬自己。\n\
  \n跟基哥初戰的甩刀有刀鋒戰士2的FU，打路人一言不和就來套詠春拳，\n\n更不用說與俠盜一號相仿的盲人戰士，這集就是光看甄子丹都夠本。\n\n接替上集荷莉貝瑞的設定，肯恩總是只能遠遠看著女兒，即使最後擺脫高桌會，\n\
  \n卻擺脫不掉仇恨，片尾彩蛋非常有港片出來走、遲早要還的意境。\n\n我是不太看好小明能報仇成功，不讓狗進入的飯店沒有存在的價值(X)\n\n\n\n\n其他配角方面，溫斯頓開頭無預警被資遣、副手代替受死(Lance\
  \ Reddick R.I.P.)，\n\n上集好不容易從稽查員手中逃脫的他憤怒了，翻遍高桌會古法找出報復侯爵的手段，\n\n雖然上層還有高桌會12成員、死不完的長老，不過溫斯頓確實是本系列城府數一數二深。\n\
  \n黑人狗本代表一直想投機，最後總算把肯恩的話聽進去，選擇站在狗本這邊。\n\n高桌會怎麼那麼喜歡刺手掌，上集的芭蕾舞阿婆被刺，狗本代表被刺，\n\n肯恩偷刺約翰右手掌，讓他在決鬥前不要顧慮人情，真的靠北又好笑。\n\
  \n最後這樣收尾算是很完美了，這集的演出也確實是集大成再造經典，別再破壞了。\n\n\n--\n謂鋼彈者，凌厲剛猛，無堅不摧，弱冠前以之與吉翁群雄爭鋒。\n加諸磁膜，一年戰終前所用，誤殺拉拉不祥，悔恨無已，乃棄之阿巴瓦空。\n\
  運機無鋒，大巧不工，八七年持之直撞阿席馬。\n九三年後，不滯於物，盾榴餌翼均可為劍，自此精修，漸進於無劍勝有劍之境。\n                   \
  \                  \n\n--\n可能他一開始剛重操舊業在抓感覺，而且肯恩在大阪明顯有留手，還偷懶躲起來吃麵。\n\n在飯店後門那有一個侯爵手下的屍體，應該是肯恩殺的，本來想給浩二機會活命。\n\
  \n最後無奈殺了老友浩二，卻又放女兒小明離開，肯恩真的重情重義。"
