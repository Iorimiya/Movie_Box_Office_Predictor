url: https://www.ptt.cc/bbs/movie/M.1623884521.A.61E.html
title: '[新聞] 甄子丹談加盟捍衛任務4條件：須尊重中國'
content: '甄子丹加盟《捍衛任務4》的條件曝光：必須尊重中國文化





  據上週報導功夫巨星甄子丹將加盟好萊塢動作大片《捍衛任務4》，在片中飾演John Wick

  的一位老朋友。兩人有著相同經歷，並且有很多相同的敵人。



  近日在第24屆上海電影節上，甄子丹分享了加盟《捍衛任務4》的過程。他說自己在接到

  邀約後，首先感謝了片方邀請自己，因為他認為任何一次機會都是對自己演技的認可。但




  後來《捍衛任務4》的，甄子丹考慮到劇本等

  各方面也都不錯，就接受了這個角色。



  甄子丹強調：「自己作為一個演員，除了拍一些好作品，還有一個很重要的任務，就是利

  用自己的影響力，去消除刻板印象。」




  甄子丹的這番言語直接表明了自己的立場，也表達了希望在國際上傳播中國文化的決心。

  甄子丹加盟《捍衛任務4》的條件曝光後，網友們紛紛為甄子丹按讚，並誇讚他三觀很正

  確。







  --'
