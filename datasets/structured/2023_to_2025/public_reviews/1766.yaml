url: https://www.ptt.cc/bbs/movie/M.1680080397.A.FF2.html
title: '[討論] 捍衛任務4 追跡者'
content: "防雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n即使國內許多人覺得追跡者是個拿掉也無傷大雅的角色(國外倒是很少看到類似評論)，個\n\
  人還是頗喜歡 Shamier Anderson 在劇中的角色和定位\n\nTracker 作為一個集跟蹤狂、農夫、高端撿頭射手等人設於一身的殺手，更是系列作唯三\n\
  的狙擊手(其二是John自己、Marcus)\n\n邏輯上狙擊目標對殺手的風險最低 (這部比起邏輯我更愛的是超現實設定、娛樂考量的安\n排和\n系列定番的撞車、墜樓迷因)，但從娛樂的角度來看電影若安排數個狙擊手殺手來對付\
  \ Jo\nhn 顯然是自\n斷手臂的做法，因此劇中設定上 Tracker 跟 Marcus 都是透過狙擊直接或間接幫助 John\n 的角色，這樣就不會破壞觀影體驗同時又能不將狙擊手這種殺手型態排除在電影之外，\n\
  就此而言，Tracker“只宰養肥的羊”是個有趣又可以滿足這個需求的設定。此外，跟\n蹤狂特性簡直給狙擊手上 buff，提升對 John 的威脅，另一方面又向男爵騷擾攻擊跟抬\n\
  價，增加劇情前中段的不確定性。以劇情結果而言，Tracker 這條線整個拿掉看起來當然\n對故事影響不大，但保留這個角色得以呈現的是劇情張力、世界觀、殺手多樣性、俠義精\n\
  神等等\n\n二刷前只覺得Tracker是個撿頭高手＆跟蹤狂，刷完細想Tracker更是個有趣的劇情工具＆\n撿頭高手跟蹤狂\n-----\n\n\n\n--"
