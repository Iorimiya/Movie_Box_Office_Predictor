url: https://www.ptt.cc/bbs/movie/M.1679915038.A.590.html
title: '[討論] 捍衛任務4打鬥場面 有雷'
content: '防雷
















  終於看完整個系列的捍衛任務了，整體來說，除了爽，還是只有爽能形容，但自己覺得小可

  惜的地方，在於打鬥空間的配置，還有主角使用雙節棍，感覺那邊都很像在…套招的感覺，

  一整個很協調的感覺….


  自己最喜歡的是上帝視角那一段，覺得ㄧ鏡到底真的很厲害，自己則希望可以增加狹窄空間

  ，利用地形的方式來進行


  譬如說

  去日本時的飛機上，或是坐地鐵的過程，狹窄空間的動作場面，拍的好的話，也可以營造出

  很棒的畫面，最有印象的就是「尚氣」在公車上的那一段

  ----

  Sent from  on my iPhone 14 Pro


  --'
