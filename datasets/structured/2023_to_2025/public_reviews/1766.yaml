title: '[新聞] 甄子丹加入基努李維捍衛任務4不要辱華'
content: '甄子丹加入基努李維《捍衛任務4》 「不要辱華！丹哥必須比基哥強」




  甄子丹（右）將與基努李維一起合作電影《捍衛任務4》。劇照合成

  圖片來源 : 蘋果新聞網


  甄子丹憑著一身功夫打出國際名號，尤其《葉問》系列最為經典，他繼《限制級戰警：重

  返極限》、《花木蘭》後，新消息指出他將加入基努李維的《捍衛任務4》，飾演與基努

  李維飾演的John Wick的老朋友，彼此有著共同敵人。


  網友笑稱：「警告你不要辱華喔，丹哥必須是正派而且比基哥強！」


  美國媒體的報導引來華人粉絲的期待，該片導演表示：「我們非常幸運能邀請甄子丹先生

  加入這個系列。」


  製片人也說：「甄子丹的加入會給這個系列注入強大的能量。我們決定在《捍衛任務 4》

  加入他，很高興有機會能讓這樣1個重要人才和基努李維合作。」




  基努李維在2019年《捍衛任務3：全面開戰》中又有精彩動作戲。威視提供


  不少粉絲熱烈討論，並在消息下留言說：「肉搏戰可能會因為有甄子丹更好看」、「要比

  打，丹哥很容易壓過基哥」、「甄：我要打十個」。


  其實，57歲的甄子丹早在2000年就曾赴好萊塢發展，當時擔任《刀鋒戰士2》等片的動作

  指導並客串。


  2002年因李連杰引薦主演張藝謀的《英雄》，此片提名奧斯卡及金球獎久語片，讓他的知

  名度因而大開；其後的《葉問》系列共4集電影則是他轟動武林的重要代表作。




  甄子丹主演的《葉問4：完結篇》前年底上映，在台賣出1.85億元台幣。劇照


  對於國際市場，2012年，紐約亞洲電影節選映由他主演的《殺破狼》、《關雲長》、《少

  年黃飛鴻之鐵馬騮》和《武俠》等片，場場爆滿。


  2016年，他受邀演出《星際大戰外傳：俠盜一號》，成為首位演出《星際大戰》系列的亞

  裔演員。也因此在洛杉磯好萊塢中國劇院前的星光大道留下手印足跡，是繼李小龍與成龍

  之後，第3位獲邀的華人明星。


  之後他屢屢參演好萊塢作品，2017年的《限制級戰警：重返極限》、去年上映的《花木蘭

  》；如今將再參演預計明年登場的《捍衛任務 4》。


  張哲鳴／綜合報導


  新聞網址：


  --'
