url: https://www.ptt.cc/bbs/movie/M.1680704609.A.991.html
title: '[ 好雷] 捍衛任務4 小小有感'
content: '連假從第一集開始補進度，一直到連假最後一天終於上影院把第四集補完。


  撇除大家都不管的劇情邏輯性、超爽武打片、要武裝飯店，卻拿弓和武士刀出來和槍枝PK

  等等的細節。


  -服裝部分真的很棒

  整部戲John的服裝基本上就是妥妥的安全牌，不是全黑層次的西裝就是白領子黑領帶西裝

  。

  紐約場景的西裝風格也都是比較穩定的正式感。


  沒想到第四集

  日本大佬角色，讓他們穿上超和風的和服外套突顯了地域風情以外。


  巴黎伯爵的三件套西裝閃亮登場，簡直眼前一亮啊。

  想不到會在電影裏看到有細閃編織的西裝、大紅色的晚宴西裝、奶油色系西裝，完整呈現

  出伯爵的高貴法國貴族身份。


  電影裡，連背影都可以看到伯爵西裝的布料閃閃發光！

  雖然很想吐槽，大boss 伯爵最後沒有脫掉西裝很解，但是所有的西裝都有夠華麗的！沒

  有脫實在殘念。


  -畫面、角色設定既視感

  從第一集看的時候，就覺得整部電影滿滿的電玩感，尤其每到一個場景的時候，都會忍不

  住在腦中想要提醒基哥找存檔點。想不到這集直接在巴黎空屋戰的時候直接換了一個透視

  的上視角，這算是導演對自己的最終作品的自嘲嗎？


  還有伯爵登場設定，每一次都是三件套超完整華麗西裝，編劇就差給他一個惡魔執事賽巴

  斯欽了......

  因為沒有黑執事，所以設定方桌12成員放所有資源給他運用，還有財力雄厚的背景條件。


  好險結尾對於事情失去控制的崩壞感，有跳脫謝爾的影子。不然我都在想什麼時候會出現

  一個異能特質的角色了。


  認真說看完只想說，前面幾集都覺得基哥很帥，但是這次伯爵一出場，基哥的頹廢風就撐

  不住了。整部電影都被伯爵演成時裝發表會了啦～（切手那一段我也是閉眼）


  --'
