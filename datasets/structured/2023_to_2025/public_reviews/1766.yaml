url: https://www.ptt.cc/bbs/movie/M.1679723178.A.567.html
title: '[好雷]捍衛任務4 guns lot of guns '
content: "雷文防雷資訊頁\n\n\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n昨天訓練完拉朋友們一起去看夜場的\n\n台南新光的LUXE廳 立體音效更大更好\n\n入場的空手道正拳稻草靶音效就很震撼\n\n整體劇情走向就是那樣\n\n\
  JOHN走到哪死到哪 只是這集有改進3的一些問題 我覺得不錯\n\n減少基哥不帶槍純肉搏的部分 畢竟他不是武行出身\n\n年紀又大了沒有辦法很俐落\n\n這邊就要佩服真田和丹哥了\
  \ 雖然比基哥更老\n\n畢竟是武行演員出身的 動作還是很俐落\n\n\n\n動作場景的部分主要就三個大部分\n\n開場大阪酒店很有趣 真田的飯店人員帶滿各種日本武器\n\
  \n日本弓 打刀 脇差 飛鏢 還有裝了重裝備的相撲手\n\n戰鬥力遠勝紐約飯店 3裡面紐約飯店根本只有櫃台能打\n\n\n賭場之戰3個人各憑把戲殺出去很有趣\n\
  \n然後第3集變成系列作唯一沒有在夜店舞群中槍戰的作品\n\n所以也沒有這首招牌BGM \n\n每次都想說那群人是不是嗑茫了 旁邊在槍戰打架都沒反應\n\nAdkins演胖子還真是有夠靈活\
  \ 一開始想說是個過場角色\n\n結果各種痛扁基哥 猛到不行 追蹤者的爆蛋狗也很兇\n\n\n最後追殺部分的段落很長\n\n凱旋門飆車法國是沒警察還是大家都習慣槍戰了\n\
  \n每台車都自己開自己的有點好笑\n\n\n大家最推崇的龍息彈俯瞰視角一鏡到底真的屌\n\n讓我想到當年辣手神探發哥和偉哥在醫院殺進去那段\n\n也是屌爆的一鏡到底\
  \ \n\n之後看幕後花絮會不會說怎麼拍的\n\n這裡基哥堅持原則 狗比任何東西重要也讓黑人心裡有了變化\n\n\n樓梯戰滾得真的很好笑\n\n尤其滾到平台基哥還硬要繼續滾下去靠北到不行\n\
  \n決戰的部分最後那個角度以為溫斯頓要補槍\n\n結果竟然是JOHN耍詐 蠻意外的\n\n想超越規則的侯爵被規則玩死 真的笑死\n\n\n\n最後彩蛋加上JOHN的墓碑讓人想到\n\
  \n只要你還是活人 就脫離不了江湖和仇恨\n\n只是不知道是JOHN WICK真的死了 還是只是這個身份死了\n\n如果只是詐死 覺得人還是離不開這個因果仇恨的螺旋啊\n\
  \n不過這樣的收尾要為JOHN WICK畫上句點我覺得很好\n\n整體來說4的劇情跟3差不多 不過動作跟美術更好\n\n接近3小時片長不會覺得不耐煩\n\n如果想尿尿的跟我一樣怕血腥\n\
  \n就趁黑人被侯爵插手時去吧\n\n我怕到瞇著眼睛 根本不知道那段在演啥QQ\n\n\n\n\n另外這次的基哥動作指導教練是Dave Camarillo\n\n\
  \n\n他也是台裔職業格鬥選手吳仲凱的老師\n\n在五年前曾經參加過他的講習課 也參加過吳仲凱本人的講習課\n是很厲害也相當有想法的格鬥和柔術教練\n\n\n\n\
  \n--\n你給我注意聽好，我的料理是炸巴麻美，就是學姊去頭裹粉去炸的，\n將靈魂寶石搗碎後裹在肉上，油炸成為金黃色，鮮脆可口的魔法少女外衣，\n經油炸之後，其香味立即倍增，堪稱人間第一美味，搭配轟母辣醬來食用，\n\
  味道更是妙不可言。\n\n--"
