title: 情報 捍衛任務4的尿點
content: '今天剛看完

  趁還有印象跟大家分享一下

  眾所皆知，這次片長長達2小時50分鐘

  已經夠長了

  導演還惡趣味似的一直放各種流水背景

  本來沒尿意都被逼出來了

  這是我看過電影以來

  最多人中途去上廁所的一個片子

  以下提供兩個適合去上廁所的點

  兩個點相差約莫45分鐘，可以參考一下


  以下有雷










  1. 搭電車


  2. John 去教堂點蠟燭


  這兩個點毫無重要性可言

  完全可以暫離

  其中第二個點可以視為進魔王關卡的最後一個儲存點



  當然，能hold住不要跑來跑去影響其他人是最好

  但意外忍不住的話請選擇這兩個點


  以上

  分享給大家參考


  --'
