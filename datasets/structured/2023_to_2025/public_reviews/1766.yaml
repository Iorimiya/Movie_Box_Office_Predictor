url: https://www.ptt.cc/bbs/movie/M.1679496483.A.7A2.html
title: '[  雷] 捍衛任務4'
content: '防雷






























  還記得當年第一次看捍衛任務的震撼

  說實話他也不算是這類型的最頂

  但他的魔力讓我才剛看完1就去找2來看

  到了3更是二話不說走進電影院支持

  到了今天依然去電影院支持4

  但與其說支持倒不如說是道別這個持續近十年的追殺

  假設沒有5啦雖然不好說XD

  但我不只有好話,也有醜話要講


  首先我對尺度的部分非常失望,真心不騙

  加上看到他是限制級更讓我滿心期待

  我期待的是約翰維克槍槍精準把人爆頭

  那個濺血的爽快瞬間

  但這集在尺度上甚至是不如3（3還只有輔導級而已

  加上這集都在不明亮的場景運作就更難見血

  這點真的讓我很不過癮


  再來我覺得捍衛任務最棒的就是他乾淨俐落的槍戰

  第一集就已經做得很棒,第二集直接封神


  這段奠定了這個系列在我心中的地位！

  但第三集就把這個元素拿掉了,也直接造成了缺失

  而我以為四會改善這點,但是他沒有

  不過武打方面我覺得是最好的一集

  我也不是很喜歡從三開始他們防彈技能大幅提升

  這也等於把乾淨俐落拿掉了,有時甚至會歹戲拖棚


  我知道這種電影不應該講求邏輯

  但這應該是要以不出戲為原則

  但約翰維克後面一直摔摔摔加被車撞

  都能好好的爬起來讓我頗傻眼

  而且反派最後死的實在有點蠢（雖然符合他的設定


  上面缺點打這麼多我都以為要給負雷了

  但我大概是真愛粉才會囉嗦了點

  至少演員們還是都表現很好

  我要特別表揚比爾史科斯加

  他的氣場帶給我出乎預料的驚喜,可說是這次的mvp

  基哥還是很棒,特別是這把年紀還拼命演出

  光這點就值得給他滿滿尊敬

  甄子丹的打戲可惜了點,我覺得他可以打更精彩

  但還是很不錯看啦

  史考特艾金斯不愧是我喜歡的武打演員

  我也很愛他的戲份,希望大家能多多關注他

  他會打又很帥,不紅真的太可惜了啦


  這集還有最棒的地方：結局

  一直陪伴著這個系列的人應該都能體會這場長期追殺

  他所帶來的煎熬隔著銀幕的我們都能感受到

  今天他終於畫上句點了,也讓約翰維克的故事圓滿落幕

  所以我才說這根本是為一位老朋友送行

  這個視角倒是滿甄子丹的

  我還是很滿意劇情這樣的安排

  他終於得以休息,身為觀眾的我們也是


  當然以上都是以沒有五為大前提

  事實上我之前就覺得捍衛任務最好就收在三

  一方面是這段故事最適合用三部曲演完

  1緣起2進入世界觀3決戰收尾

  這也讓我覺得4太壟長

  精簡化我會覺得更棒更剛剛好

  一方面是為了基哥年紀,畢竟他也老了是吧？


  總結來說4我大致上還是覺得很不錯

  他富有娛樂性但並未善用他最在行的元素

  但對這系列有愛你還是應該進場

  進場了這場追殺才真正的劃上句點

  謝謝捍衛任務在動作片史冊上留下特別的紀錄
















  約翰維克,摯愛的丈夫

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  萊斯特在最後敘述中講述了生活中有意義的經驗，他說，儘管他死了，他還是很高興，因

  為這世界上有這麼多的美


  --'
