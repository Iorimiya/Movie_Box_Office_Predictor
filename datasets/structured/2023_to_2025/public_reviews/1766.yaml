url: https://www.ptt.cc/bbs/movie/M.1596774390.A.C81.html
title: '[新聞] 捍衛任務4、捍衛任務5共同開拍輪番上映'
content: "「捍衛任務4」、「捍衛任務5」共同開拍輪番上映\n\n\n「捍衛任務3」。圖／威視提供\n\n2020-08-07 08:39 聯合報 記者陳建嘉／即時報導\n\
  \n基努李維主演賣座電影「捍衛任務」系列，原定在去年推出「捍衛任務4」，\n卻因為受到新冠肺炎疫情影響，最終推遲到2022年5月上映，\n然則片商持續公布好消息，\n\
  也許是因為疫情影響，\n片商龍頭直接表明「捍衛任務5」會與「捍衛任務4」同步開拍，\n兩部會以背靠背的形式拍攝。\n\n發行該片的獅子門影業執行長John Feltheimer在電話會議上表示，\n\
  「我們正忙於製作「捍衛任務」後兩集的劇本，\n其中「捍衛任務4」會在2022年的陣亡將士紀念日周末上映，\n我們希望明年初開拍時，「捍衛任務4」與「捍衛任務5」能以背靠背的形式拍攝」。\n\
  兩部續集一起拍的形式早已不是首例，\n包括基努李維自己的「駭客任務2」、「駭客任務3」，\n漫威的「復仇者聯盟3」、「復仇者聯盟4」都是這樣，\n電影一起拍攝，雖然時程會拉長很多，但也便於劇組剪片，\n\
  然則獅子門影業若是真的這樣做，\n也讓外界認為「捍衛任務5」也許有可能會是系列作完結篇，\n引起熱議。\n\n--\n、。帝釋所問經講記77頁拆穿佛法的。\n\
  是 是菩薩成佛之道\n、、、、()、、是佛經。\n  是佛          是菩薩\n\n和破十方諸佛\n\n--"
