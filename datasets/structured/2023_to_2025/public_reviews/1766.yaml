  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  剛看完捍衛任務4

  老實說劇情比我想的格局小了一點

  第三集最後結束的地方

  我以為約翰維克會和包厘幫一起推翻高桌會

  結果這集也只是在高桌會體制內找方法解決


  甄子丹被逼要去對付約翰維克看的出來他完全不想這麼做

  因為全場都很消極的在做這件事

  甚至最後樓梯那段

  還幫約翰維克到達約定地點

  如果是上一集的光頭壽司師傅

  根本沒有後面對決的畫面了


  在這四部曲電影中

  其實約翰維克要死的機會很多

  但最後都有人幫忙化解

  說明電影裡甄子丹和真田廣之的對話

  不是只有錢和誓約才會使人做這麼大的犧牲

  但其實甄子丹也沒有想殺真田廣之

  如果真田不要執意殺甄子丹


  電影裡最好笑的一段

  莫過於狗狗撒尿

  四集電影都有狗狗

  殺手人士大多都是愛狗派

  別想殺他的狗


  --

  靠杯勒  怎那麼衰小出生在這島啦??

  不就跟房地產一樣在亂喊價!!??

  你水岸格局第一排、捷運站樓下門口 開5000萬我認了

  現在不是...連那種住金山 通車要一小時起跳 建案旁還有靈骨塔相伴 也跟人家開4500萬

  你怎不去吃屎啦


  --'
