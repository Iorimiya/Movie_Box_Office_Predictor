url: https://www.ptt.cc/bbs/movie/M.1679666324.A.C94.html
title: '[ 普雷] 捍衛任務4'
content: '雷文防雷資訊頁


  .

  .

  .

  .

  .

  .

  .

  .

  雷(結尾處有二三集的雷)

  .

  .

  .

  .

  .

  .

  .




  之前1-3集都有看，來分享一下這集還記得的心得


  先說說不喜歡的部份，雖然是動作片，但邏輯真的不行。


  1.

  防彈西裝真的太離譜，比全副武裝穿鋼鐵裝的部隊防護力更好


  網路上查的到真的有防彈西裝，可是只能防禦大約9mm的子彈。


  但john wick那個已經誇張到霰彈槍都能扛下來、被車撞、五樓掉下來都可以馬上開始繼續行動...完全不合邏輯


  2.

  都在打雜魚我覺得蠻膩的，中間片段讓人很想睡


  不是說不能打雜魚，而是雜魚的戰鬥力真的太低，基本不會給觀眾任何的絕望感


  John Wick 弱勢的時候雜魚們都不補槍甚至更腦殘的衝上去近戰，導致看了一點都不刺激


  如果可以像是第二集那樣

  在John Wick受傷又有時間限制下要去做某件事會好看很多。


  3.

  整個高桌會的邏輯很腦殘

  一個這麼嚴肅的地下殺手世界

  先不說一堆奇奇怪怪的規矩


  但至少在維持組織營運的狀態下

  應該是要以營利為主要目標

  不然誰想去過這種刀口舔血的生活。


  但竟然讓侯爵直接把紐約的大陸酒店炸了，侯爵這個毛頭小子亂搞

  高桌的更高管理層都沒意見？

  高桌都沒有大人了嗎...


  高桌的更高層沒有出現，導致從頭到尾都是侯爵對上John Wick，沒有那種高桌最後真面目?



  喜歡的部份：


  1.

  有一些莫名的笑點，例如眼盲的葉師傅在激烈的戰場吃麵？？


  並且他帶了一些感測器貼在牆壁，

  有人經過會有聲音，發出滿有喜感的叮咚聲


  這些跟打鬥場面很有反差感，蠻有趣的。


  在廚房那段葉師傅也有使出連環打，不知道跟葉問有沒有關係？

  還是剛好而已


  讓我意外的是葉師傅的戲份很多



  2.

  畫面很漂亮，例如整個可以俯瞰整個巴黎日出的Sacré-Cœur教堂，日出的那個橘色調有夠讚。


  3.

  有一個片段的鏡頭是鳥瞰鏡頭，有點像在玩遊戲的感覺


  在我們觀眾已知下個房間有敵人的狀況下，John wick會怎麼應對的


  這個是其他電影沒看過的


  4.

  John Wick 去往教堂的路上


  電影的的畫面是由John Wick的實際戰鬥畫面、講解戰況的廣播臺、提升懸賞金的老奶奶電話室還有很刺激的背景古典樂組合起來


  這樣的切換並且組合起來也是沒有在其他電影看過，蠻有意思的。



  我意外的是這部動作片我喜歡的元素竟然是些微的反差幽默+畫面+運鏡+磅礡的古典背景樂，而不是戰鬥...




  其他：

  1.追蹤小夥為啥一開始手被刀定住不選擇拔出來啊?

  伯爵有講一段台詞但那邊我不太懂


  2.乞丐王到底在這部的戲份是做啥?

  當一個船長?


  3.葉師傅眼盲的原因還有家人都跟高桌會有關係，但好像也沒提到，還是我漏掉了?


  4.還有一個也是被切掉手指的高桌會人士，也沒提到背景是誰，感覺會有第五集了。


  評價:以捍衛戰士:獨行俠當作10/10標準的話，這部5/10。


  會覺得沒有絕望感跟跟對手都是雜魚

  其實我是跟前面幾集比較


  應該是第二集，那是基哥受傷還要再限定時間內找到醫生幫他治療，然後整個城市都在追殺他，那邊就超刺激。


  然後第三集後面大戰，一堆重甲人士讓基哥的小手槍連破防都很困難，跑回去地窖拿散彈槍那個也很爽


  不知道為什麼第四集反而沒這種感覺，這集都在清理小兵...



