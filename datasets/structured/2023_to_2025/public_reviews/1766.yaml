  :




  胖子看起來像是個孬種

  一開始被割一下就鬼叫鬼叫


  感覺很軟


  結果反而是裡面唯一一個痛宰基哥的人

  我看差點把基哥打死


  通常電影裡面吸噴霧劑的

  感覺就是身體有毛病會喘

  大概也不會是很能打



  不過我覺得胖子大概吸的不是普通玩意

  他每次吸完之後就可以痛扁基哥


  大概就是吸了什麼藥

  不過藥效有限


  所以扁一扁藥效沒了

  胖子就又開始孬種了



  另外最後決鬥

  我認為基哥最後上階梯時就跟政委套好招了

  政委打了三四槍，沒一槍打在要害


  以政委在電影中的身手

  避開要害打一點都不困難


  所以基哥當然可以不用死

  就是要留最後一槍給侯爵

  設計侯爵承諾不殺政委家人


  再讓基哥解決這一切


  反正就算是電影把人拍死

  需要時照樣可以復活



  阿諾就算進了熔爐

  還有千千萬萬個阿諾可拍派續集

  好來屋復活一個死人一點都不困難


  --


  你怎麼知道胖子有沒有氣喘?

  你怎麼知道胖子有沒有另外的"特效"藥

  專門在"特殊"情況吸的


  搞不好胖子跟本沒毛病

  那玩意只是看起來很像擴張劑


  但是吸一口

  卻可以讓你亢奮起來


  那胖子專門出千的


  這是當然的囉


  所以怎麼會以為胖子那玩意就只是氣管擴張劑呢?



  票房多賣個幾億

  死人也會從墳墓裡爬出來



  某個世界有消滅不完的吉翁殘黨

  基哥的世界也可以有消滅不完的"侯爵"殘黨


  也可以拍個20年後

  高桌會議有反抗勢力侯爵殘黨造反


  建制派不敵叛軍找上基哥

  為了維護世界秩序


  一個遵守規則的高桌會議比一個

  暴虐無道只信力量的高桌會議好


  基哥為了保護這個世界跟他朋友、弟兄、家人後代

  跟溫斯頓組織保皇軍

  剿滅了侯爵殘黨


  之後

  紐約大陸飯店一舉成為高桌會議權力中心


  基哥登基.............'
