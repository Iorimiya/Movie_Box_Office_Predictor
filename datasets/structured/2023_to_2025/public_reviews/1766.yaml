url: https://www.ptt.cc/bbs/movie/M.1631150299.A.441.html
title: '[新聞] 基努李維《捍衛任務4》回歸預告超狂！　'
content: '新聞網址：


  記者蕭采薇／綜合報導


  電影《捍衛任務4》（John Wick: Chapter4）距離上集已經20多年，請到老班底基努李維

  （Keanu Reeves）回歸，目前正在拍攝中，片商也搶先「空戰」釋出神秘網站，裡面竟有

  18萬種排列組合的預告，引起影迷討論。


  WhatIsTheMatrix.com從1999年第一部《捍衛任務》開始就存在，隨著《捍衛任務4》回歸

  ，網站也重新開啟。一打開，就會看到《捍衛任務》粉絲最熟悉的紅藍藥丸，和隨著不同

  選擇，也會出現不同的前導預告，總共有18萬種排列組合。


  「殺神」基努李維在《捍衛任務》系列中，以一頭飄逸隨性中分造型登場，這次回歸續集

  《捍衛任務4》的他，一樣維持經典造型現身，不過帥氣的背後，先前被捕捉到必須用「

  蝴蝶結髮夾」固定住兩側瀏海以維持造型，但因髮夾實在長得太可愛，意外引起討論。《

  捍衛任務4》正式前導預告也即將公開。





  挖草


  看過鬼扯的新聞 沒看過那麼扯的


  這記者怕是John Wick或Matrix都沒看過 整篇亂寫?


  編輯沒在看?



  --'
