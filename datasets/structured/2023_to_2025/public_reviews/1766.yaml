url: https://www.ptt.cc/bbs/movie/M.1658564326.A.007.html
title: '[新聞] 基哥《捍衛任務4》首張劇照曝光'
content: '殺神四度登場！基哥《捍衛任務4》首張劇照曝光

  新聞網址：


  〔記者許世穎／綜合報導〕由「基哥」基努李維回歸演出的《捍衛任務4》，今天曝光首

  張劇照，基哥4度扮演「殺神」約翰維克，在一片燭光之中低著頭。電影繼續由導演查德

  史塔赫斯基執導，先前受訪時也透露這部最新作品將會是「系列中最血腥的一部」，讓影

  迷相當期待。


  該片先前已於4月底的美國電影博覽會CinemaCon搶先曝光片段及橫幅海報，片段中揭曉此

  次的背景將會有一段在東京，片段中約翰正展開訓練，勞倫斯費許朋飾演的「包厘街之王

  」走進來問：「你準備好了嗎，約翰？」約翰表示：「是的，我要把他們全部都殺了！」



  還有伊恩麥克夏恩飾演的「溫斯頓」對他說：「約翰，我希望你能找到安寧…這條道路只

  會導向死亡。」片段中還可見約翰在一個藝廊1對2，還用雙節棍痛扁對方的臉，動作戲依

  舊相當火爆。


  除了基哥及上述的勞倫斯費許朋、伊恩麥克夏恩等原班人馬，本集還加入甄子丹、比爾史

  柯斯嘉、真田廣之等人參演，《捍衛任務 4》預計2023年3月全球上映


  --------------------------------------------------

  葉師父竟然也也加入了

  不知道會不會在裡面打詠春拳哈哈

  真田一臉腹黑，看起來就像最終大BOSS啊

  今年捍衛阿湯哥，明年捍衛基哥扛

  期待~



  --'
