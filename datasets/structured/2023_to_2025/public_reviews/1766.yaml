url: https://www.ptt.cc/bbs/movie/M.1680446212.A.3DC.html
title: '[討論] 捍衛任務4集怎麼排？？'
content: '如題


  今天晚上看完捍衛任務4


  視覺效果和槍戰和第三集比真的大大提升


  但只能說基哥真的老了


  雖然這一集已經少了很多第三集的套招現象


  但很多搏擊戰的部分都已經顯示基哥的老態


  幸好這部片已經大量減少這部分


  真的這部片可以值得誇獎的部分：


  1）劇情


  雖然很多人認為第4集的劇情很無腦


  但個人認為相較於第三集比已經豐富很多


  因為第三集劇情真的只是基哥被通緝被追殺而已


  所以個人認為第4集劇情真的比較順暢


  重點是相較於第3集的結尾


  結尾收的真的比較好


  2）人物


  只能說甄子丹演的盲人氣勢真的太強


  從頭到尾個人都很期待他的出現


  他的近戰動作真的比基哥流利太多


  或許是利用他盲人設定來debuff


  不然這集他的帥度我真的認為大於基哥


  但蠻失望的是大阪戰那邊


  真田廣之竟然只是一個小小配角而已QQ


  不然他的氣場跟帥度其實也很強


  沒想到那麼早就領便當


  個人覺得蠻可惜的


  3）動作鏡頭


  相較於第三集結尾的暗戰真的打到讓人疲乏


  第四集就增加了很多的新元素


  龍息彈讓視覺效果豐富很多


  最有趣的是長達2分多鐘的俯瞰鏡頭槍戰


  個人這輩子從來沒看過這種拍法


  很像以前電腦遊戲的槍戰模式


  讓視覺效果豐富很多


  總體來看


  個人認為四集的整體程度：


  4 = 2 > 1 > 3


  只能說第1集是敗在世界觀實在太小


  第三集敗在槍戰讓人太疲乏


  可能當初就是以小故事小劇情而已


  沒想到之後世界觀越做越大


  各位會怎麼排呢？



  --'
