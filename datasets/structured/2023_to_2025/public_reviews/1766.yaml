title: '[新聞] 基努李維拍捍衛任務4超寵劇組28萬勞力士'
content: '基努李維拍《捍衛任務4》超寵劇組　28萬勞力士錶送特技組人人有份




  基努李維(左圖) 正在巴黎趕拍《捍衛任務》系列第4集，他最近犒賞特技組成員每人一只

  要價28萬的勞力士潛水腕錶。

  圖片來源 : 蘋果新聞網


  57歲好萊塢巨星「基哥」基努李維（Keanu Reeves）最近正在巴黎趕拍他的招牌系列之一

  《捍衛任務》第4集，最近他為了謝謝特技小組，送給每個人一只要價7300英鎊（約28萬

  元台幣）的個人化勞力士潛水腕錶，手筆之大令人咋舌。




  基努李維以他招牌的「殺神」約翰維克造型拍最新續作。達志

  圖片來源 : 蘋果新聞網




  《捍衛任務4》的特技組成員Bruce Lee Conception在社群媒體分享收到勞力士厚禮的照

  片。翻攝keanucreeves.fanpage IG

  圖片來源 : 蘋果新聞網


  收到這份厚禮的其中一名特技小組成員Bruce Lee Concepetion在IG上分享收到勞力士錶

  的照片，根據報導，還有Jeremy Marinas、Dave Camarillo與Li Qiang其他3人也都獲贈

  名錶，每一只錶還有他給每個人的特別訊息，也讓人看到基哥不只大方，還很重情義的一

  面。




  基哥(右)與回鍋演出的伊恩麥克夏恩對戲。達志

  圖片來源 : 蘋果新聞網




  基哥(後排左三) 拍攝《捍衛任務》系列，與劇組人員打成一片。翻攝bruceleeconcepcio

  n IG

  圖片來源 : 蘋果新聞網


  基哥多年來曾參演過許多賣座系列，累積3.6億美元（約101億元台幣）身家，他對工作人

  員超慷慨的消息時有所聞，幾乎成了都會傳奇。


  他在拍《駭客任務》系列時，傳出他認為特效與服裝小組居功厥偉，他致贈工作人員每人

  一百萬美元（約2810萬元台幣）答謝，還送給特技小組每人一台哈雷重機。


  據說他還在聽說一名幫忙搭建場景的工人家裡出狀況後，給了對方2萬美元（約56萬元台

  幣）聖誕獎金紓困，有不少與他共事過或曾聽別人轉述的業界人士，都稱他是「好萊塢的

  大好人」。


  （李子凡／綜合報導）



  新聞網址：


  --'
