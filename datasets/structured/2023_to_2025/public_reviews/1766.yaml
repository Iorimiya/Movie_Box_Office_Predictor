url: https://www.ptt.cc/bbs/movie/M.1622217649.A.05E.html
title: '[新聞] 跌破眼鏡！《捍衛任務4》女主角是日裔女'
content: '跌破眼鏡！基努李維《捍衛任務4》的女主角是




  美國影視媒體DEADLINE報導：《捍衛任務4》女主角將由（Rina Sawa

  yama）擔綱，這也是基努李維繼2013年的《浪人47》與柴崎幸、菊地凜子合演之後，再度

  與日裔女星同台。



  ▲澤山璃奈外型超有個性美（圖∕美聯社）。



  今年30歲的澤山璃奈生於日本，5歲移居英國，曾就讀劍橋大學抹大拉學院，選修政治學

  、心理學，曾當過短期模特兒，之後加入嘻哈組合「Lazy Lion」，2013年推出個人單曲

  《Sleeping in Walking》，去年推出首張個人同姓專輯《Sawayama》，《捍衛任務4》是

  她首次主演好萊塢電影的處女作。



  連續執導《捍衛任務》4集的導演查德史坦赫斯基表示：「我很高興璃奈加入演出，她是

  很有才華的藝人，希望能為電影帶來許多驚喜」，但目前她在片中的角色尚未曝光。



  《捍衛任務4》預定今年6月在柏林、巴黎、紐約、日本拍攝，暫定明年5月27日在美國上

  映。







  --'
