url: https://www.ptt.cc/bbs/movie/M.1681297805.A.584.html
title: '[新聞] 吳宇森新片沒有一句台詞《捍衛任務4》'
content: '新聞網址：



  吳宇森新片沒有一句台詞　《捍衛任務4》團隊打造精彩動作鏡頭

  2023/04/12 14:28:37


  （記者張疏影／綜合報導）現年76歲的香港大導演吳宇森，繼2017年執導電影《追捕》後

  ，暌違6年再度推出新作《平安夜》（Silent Night），據悉本作早在近一年前，就已經

  宣告殺青，目前則在後製階段。本作最大的看點之一，除了精彩的動作打鬥橋段，就是全

  片沒有任何對白，令影迷非常期待。


  據外媒報導，《平安夜》將由《自殺突擊隊》系列男星喬爾金納曼（Joel Kinnaman）主

  演，劇情將描述一位父親，為死去的兒子復仇的故事。其他演員還包括了基德酷迪（Scot

  t Mescudi）、文尼奧布賴恩（Vinny O’Brien）和曾獲奧斯卡獎提名的哥倫比亞女星卡

  塔琳娜桑地諾莫雷諾（Catalina Sandino Moreno）。


  曾擔任《捍衛任務》（John Wick）系列製片的艾瑞卡李（Erica Lee），也透露：「《平

  安夜》全片沒有任何對白。」但本作並非是一部無聲電影，片中仍會有環境音和背景聲音

  。近日廣受好評的《捍衛任務4》特技團隊，也參與了《平安夜》的拍攝過程，設計出更

  多令人血脈賁張的武打鏡頭。


  艾瑞卡李受訪時，也表示：「《無聲夜》真的沒有任何一句對白，這是我拿到的另一個原

  創劇本，我看完後就在想，『這要不就是一個天才的決定，要不然就是一場災難，沒有其

  他可能性。』電影如何執行肯定很關鍵。」但她也盛讚吳宇森拍攝技巧傑出，並大讚男主

  角喬爾金納曼的明星魅力，坦言等不及讓大家看到了。


  據悉本作發生在美國東洛杉磯，劇中將會有大量的飛車追逐動作，以及許多動作場面，令

  影迷非常期待。本作也是吳宇森繼2003年的《記憶裂痕》（Paycheck）後，再度執導的好

  萊塢電影作品。目前《平安夜》的檔期尚未公布，但第一支電影官方預告片，應該會在今

  年夏天前公布。


  --'
