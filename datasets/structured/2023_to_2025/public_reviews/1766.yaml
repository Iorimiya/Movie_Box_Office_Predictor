url: https://www.ptt.cc/bbs/movie/M.1558150218.A.D08.html
title: '[討論] 有雷 亂編捍衛任務4走向'
content: '看到華卓斯基姐妹的採訪

  乾脆捍衛任務併駭客任務

  摻在一起做駭衛任務好啦


  接續本集結尾

  莫菲斯問wick是不是很不爽他回：yes

  第4集開頭莫菲斯就拿出了紅色與藍色藥丸

  於是wick離開母體世界，又重返錫安


  莫菲斯：祭司說，女人（崔尼蒂）讓你覺醒為救世主，但有毛生物會讓你版本升級，現在

  ，是時候讓你重新想起真相了！

  噔～～～～（漢斯季默重低音）

  下片名

  John Wick chapter 4: Back to Neo

  捍衛任務4:駭客重生


  (喔對了，隨劇情發展，荷莉貝瑞可以演祭司，程式再造，並且比照史密斯方式反向進入

  真實世界一起並肩作戰，Ruby rose原來是幹員身分。然後片尾彩蛋請到蒂坦史雲頓，再

  看DC還是Marvel出價比較高，併入他們宇宙）


  以上企劃。


  --'
