url: https://www.ptt.cc/bbs/movie/M.1680194851.A.5E9.html
title: '[好無雷]《捍衛任務4》回到水準 但缺點明顯'
content: '《捍衛任務4》回到水準 但缺點明顯 8/10分


  優點：


  ◎動作場面打好打滿，大概七成都是滿滿的動作戲


  ◎場景實在太美，每段場景都不馬虎，燈光、色調、擺設都美到不行！不管是日式風格、

  美術館、巴黎鐵塔、賭場…等，每段都是精緻到不行


  ◎甄子丹身為亞洲面孔難得沒有被矮化，甚至還放了一些個人招牌進去，雖然不像他在港

  片中打得這麼帥，還讓甄子丹秀了一句粵語，也算可接受了


  ◎許多動作戲都是長鏡頭，就像成龍說過的，剪接越少，越能凸顯動作戲的流暢度（之類

  的意思）


  ◎致敬了《殺破狼》、《龍虎門》、《導火線》…等片，很多橋段設計我都覺得很有意思

  ，在動作場面之餘，加入了很多不一樣的小巧思，像是翻牌決定規則、意想不到的槍戰地

  點、炫砲的武器、90年代的舞廳…等，都大大增加了這部片的豐富度


  缺點：


  ◎劇情最後根本有BUG吧！怎麼想都沒道理啊，整部片的劇情就敗在這裡（雖然前面劇情

  也有些瑕疵），但還是不及最後這點，不只是低級失誤，根本就是三小？？


  ◎打鬥時候雜魚實在太雜，主角一次面對超過三個人的時候，很明顯其他受傷的雜魚都在

  背景耍憨，直到主角解決眼前的敵人之後，又會突然好像神明附體一樣站起來受死，這集

  似乎比其他集更明顯，然後每個敵人都跟風暴兵一樣，準度有夠差的，笑死，還是這也是

  致敬《星際大戰》?


  ◎文戲實在偏無聊，即使拍得很美，但還是令人忍不住想打瞌睡，而且這集劇情其實很簡

  單直接，沒什麼太多的驚喜


  結論：


  比起第三集的冗長，這集回到了之前的水準，動作戲滿滿，其中有幾段令人眼睛為之一亮

  ，大部分雖然不到很屌，但也算行雲流水了


  劇情部分就差不多那樣，但沒什麼需要特別提及的，只有最後那個BUG我實在覺得很漏氣


  喜歡《捍衛任務》系列，或是對甄子丹打鬥有愛的都可以看，絕美的場景/攝影/燈光絕不

  會失望


  以上


  --


  無雷 電影/影集短評IG：




  --'
