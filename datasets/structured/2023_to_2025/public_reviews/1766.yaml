url: https://www.ptt.cc/bbs/movie/M.1679920371.A.D5B.html
title: '[新聞] 《捍衛任務4》ScottAdkins造型致敬洪金寶'
content: '新聞網址：



  《捍衛任務4》導演表示史考特艾金斯造型致敬《殺破狼》的洪金寶




  由基努李維主演的《捍衛任務4》，目前爛番茄新鮮度為 95%，IMDb 8.5 分，電影大獲影

  評人和影迷好評，延續《捍衛任務3》的劇情，約翰維克對「高桌會」的憤怒已達最高點

  ，但約翰維克的處境非常危險，首先是懸賞金額不斷提高，加上第四集來了一個殘暴的新

  敵人——「高桌會」的高層「葛雷蒙侯爵」（比爾史柯斯嘉 飾演），為了獲得平靜與自

  由，約翰維克將主動找上勢力龐大的「高桌會」對抗。






  雷
























  總不斷想著要讓系列邁向更好的查德史塔赫斯基，除了原班人馬外，更在《捍衛任務4》

  中找來了真田廣之、澤山璃奈、甄子丹、比爾史柯斯嘉、史考特艾金斯等人助陣，真田廣

  之在電影中飾演約翰維克的老友，大阪大陸飯店的負責人；甄子丹飾演的肯恩，同樣與約

  翰維克為舊識，但卻被強迫奉命殺了約翰維克，查德史塔赫斯基並沒有浪費這兩人的參與

  ，兩人在電影裡都有讓人目不轉睛的精彩打戲，特別是甄子丹的戲份又更重一些。


  值得一提的是這位，他是一位動作演員，從小就以李小龍為偶像，練習過柔

  道、巴西柔術、空手道、中國武術、近身格鬥、泰拳等……，曾在《浴血任務2》飾演反

  派赫克特，也曾在《X戰警：金鋼狼》擔任萊恩雷諾斯的替身。




  在演出《捍衛任務4》前，史考特艾金斯就先和葉師傅在《葉問4》中碰頭，史考特艾金斯

  飾演海軍陸戰隊軍官巴頓，和葉問有一場拳拳到肉的最終對決。史考特艾金斯曾表示自己

  是甄子丹的超級粉絲，也超熱愛香港動作片。


  而《捍衛任務4》裡史考特艾金斯飾演大隻佬「奇拉」，在賭桌上意氣風發，和約翰維克

  、肯恩、賞金獵人「無名氏」三人同桌交鋒。不過，「奇拉」這個角色是個不折不扣的大

  胖子，史考特艾金斯必須，才能有如此外貌。




  不過為何史考特艾金斯在電影裡的扮相要增胖？查德史塔克斯基在接受《Insider》的訪

  談時解答到了。其實「奇拉」的造型是在向他最愛的電影致敬，甄子丹甚至也有演過那部

  電影。


  「我一直以來都是甄子丹、洪金寶作品《殺破狼》的粉絲，在片中

  。」




  導演強調《捍衛任務》系列中每一部電影都是獻給幾部經典導演與電影的情書，這些電影

  都是《捍衛任務》系列劇組人員從小看到大的作品，


  「《捍衛任務》系列電影都是來自基努李維、我、我們的特技團隊以及創意團隊的情書，

  獻給王家衛、洪金寶、塞吉歐李昂尼、黑澤明、亞蘭德倫、『武士』、史蒂芬史匹柏及昆

  汀塔倫提諾，那些我們從小到大喜愛的人們。」

  此外，查德史塔克斯基也提到擅長拍攝西部動作片的導演華特希爾，


  「《殺神輓歌》，你知道的。我超愛那些傢伙。」

  《殺神輓歌》在 1979 年上映，改編 1975 年的同名小說，劇情描述紐約最強大幫派的黑

  幫領袖召開一場午夜峰會，邀請紐約所有幫派前來參加，不料卻被暗殺身亡，且其中一個

  幫派「勇士幫」(The Warriors) 被栽贓為兇手，這使得他們成為各路幫派的頭號目標，

  必須殺出一條血路才能平安返家。


  《殺神輓歌》中被各路人馬圍殺、需突破重重血海的過程，的確和約翰維克的處境相似。

  查德史塔克斯基表示自己雖然致敬許多敬愛的電影，但同時也和團隊隨時腦力激盪，希望

  在每個片段都能發揮創意，與其他動作電影有所區隔，像是約翰維克和奇拉的打鬥就熱鬧

  非凡，甚至有舞池中忘情跳舞的人們作為背景，


  「我們有一支全職特技團隊，在他們下班期間……好像，我發誓如果你來到洛杉磯的 87e

  leven。就是我整支團隊的樣子，他們成天都在構思一些超酷的玩意。那就是他們的工作

  ！」



  /


  今天終於去看了


  整場看基哥大殺四方真的爽翻天


  體感時間完全沒有近三小時那麼長


  看到片尾名單有Scott Adkins的名字


  還想說他是演哪個角色？



  後來查資料才發現是那個魔性笑聲的大隻佬


  落差有夠大XD


  --'
