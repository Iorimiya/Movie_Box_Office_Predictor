url: https://www.ptt.cc/bbs/movie/M.1680744698.A.A6A.html
title: '[討論] 捍衛任務4-一點問題及心得'
content: '防個雷






















  看完第四集覺得整體來說比第三的安排好很多

  雖然片長真的長但動靜安排還算好

  至少基哥為啥去殺人還有一點動機理由

  畫面設計也的確很美

  龍息彈那段也真的是很特別（友人覺得暈爆）

  但有一點點問題有點不解


  1.肯恩的部分大部分的討論是在大阪飯店還需要接待鈴

  為什麼後面就像開掛一樣見誰殺誰

  但我看起來的感覺是，因為他不想殺大阪飯店的人

  如果沒記錯他幾乎都是用擊倒的

  除了有一個是大腿兩槍一個是身上兩槍但不確定是不是打在防彈衣上

  所以用接待鈴的感覺是為了避免因為反射動作殺了人的感覺

  但我的疑問是，是他叫明活好找他復仇

  但我記得在梅田明有說要嘛基哥死要嘛肯恩死？

  那基哥都死了他還是殺去想幹掉肯恩的意思嗎？



  2.墓園的時候，丐幫幫主牽著基哥的狗

  然後突然有一瞬間狗狗突然很像看到什麼

  嗚了一聲頭抬起來看別的地方

  是不是代表其實基哥有活著？



  3.溫斯頓遞pk帖的時候走過長長的畫廊

  意識到到時候來不及看了

  牆上的畫是不是革命的過程還是什麼？

  只看到最後兩張一張是戰爭中一張是勝利女神



  感謝各位

  話說我去看的這場大家都超認真看

  吃東西的聲音或私下討論聲幾乎沒有

  而且都乖乖坐著看彩蛋

  出來才有人說怎麼摔都不會死太扯XDDD




  --'
