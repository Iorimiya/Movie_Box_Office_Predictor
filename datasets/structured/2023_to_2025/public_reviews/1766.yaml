url: https://www.ptt.cc/bbs/movie/M.1622809083.A.F72.html
title: '[新聞] 「捍衛任務4」甄子丹加入 要和基努李維共'
content: '新聞網址：


  完整新聞標題: 「捍衛任務4」甄子丹加入 要和基努李維共同抗敵

  新聞來源:UDN聯合新聞網

  2021-06-04 聯合報記者 蘇詠智 報導


  新聞內容:

  基努李維近年來最受歡迎的代表作「捍衛任務」系列，即將在明年5月推出的4集，宣布邀

  得華人影壇動作天王甄子丹加入，將在片中扮演男主角的友人、彼此有共同的敵人，有機

  會並肩作戰。導演很興奮表示能夠邀得甄子丹參與這部片感到幸運，很期待和他合作，製

  片也認為他將為片子帶來新的活力與刺激。


  甄子丹在美國待過很長一段時間，英語流利，因此陸續參與過不少好萊塢影片的演出，去

  年的迪士尼真人版「花木蘭」都有他扮演一位大將軍，不過他笑稱自己是去幫主角搭配，

  所以打戲不多、主要讓主角發揮。這一次雖然在「捍衛任務4」仍然不會搶走基努李維的

  靈魂人物地位，但因該系列出了名的打鬥激烈，不只基努需要大展身手，其他角色也常要

  打得血脈賁張，甄子丹絕對有機會再展自己的真功夫，必然會是一大看點。


  --'
