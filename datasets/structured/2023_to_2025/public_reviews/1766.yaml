url: https://www.ptt.cc/bbs/movie/M.1680885521.A.6AB.html
title: '[普好雷] 遺憾的捍衛任務4 ~無奈'
content: "看完之後\n\n深深覺得 第一集 真的是經典之作 難以超越\n\n當初被第一集魄力吸引\n\n之後再出多少集 說真的 也是會捧場看完\n\n但\
  \ 好不好看呢\n\n只能說2/3都很普 朋友甚至看到睡著 但好在有些亮點出乎意料\n\n\n\n被大家批評的點 其實差不多\n\n1 盲人設定超雞肋 很沒必要\
  \ 變胖的甄子丹 一直有老周-鄭肯的既視感\n\n2 大阪戰也超沒必要 只是在致敬第三集 沒頭沒尾 至少講一下基哥幹嘛來\n\n3 金牙胖子戰 也是在致敬第一集魔王戰\n\
  \n  金牙一下強 一下跑 真的搞不懂的矛盾\n\n4 轉場的太刻意且無言 被懸賞 結果卻在世界各地無障礙跑來跑去\n\n  真的就是為了各橋段的場面\n\n\
  \  沙漠長老當初找得要死 結果現在簡單騎馬追殺 XDDDD\n\n5 巴黎追殺也在致敬第三集大逃殺 但強度 殺手特色 都差太多\n\n  巴黎當地人全部像二戰巴黎人\
  \ 開的車居然都是BMW5系列 傻眼\n\n6 基哥的雙截棍 看新聞好像練了一個月 結果打出來\n\n  額~ 跟預期中差很多呢 XDDD\n\n7 高桌設定崩壞\
  \ 我猜是編劇本來就沒想那麼多\n\n  但賣座之後 應該也要找編劇補完 至少大家期待殺爆高桌\n\n  而不是用委託決鬥結束 (後來想一想 可能也沒更好改編了\n\
  \n\n\n令人眼睛一亮的點\n\n1 用撲克牌殺金牙胖子 當下真的不知道怎樣開戰 真的有出乎意料\n\n2 俯瞰槍戰 超讚 雖然有介紹中稍微知道 但實際看的時候超棒\n\
  \n  這片就這個橋段最突破 創新的點\n\n3 大阪戰 同樣很多玻璃櫥窗的打鬥設計 比第三集眼花撩亂好多了\n\n4 無名小卒 追蹤者 單純為了賞金 腳色設計不錯\n\
  \n  隱晦致敬帶出殺手間的敬重情誼也很棒\n\n  但爆蛋的梗用了三四次 就笑不出來了\n\n  跟基哥的纏抱摔一樣 用太多就沒感覺了\n\n5 結局一次解套兩個人\
  \ 也是沒猜到\n\n\n\n個人心得\n\n基哥理論上沒死 三槍都不是致命傷 而且有充足機會可以救助\n\n所以死不死 就看票房跟編劇了吧\n\n但同前言\n\
  \n出電影院 雖然有些失落\n\n不管怎樣批評 若是拍第五集 還是會力挺到底吧 XDDD\n\n--"
