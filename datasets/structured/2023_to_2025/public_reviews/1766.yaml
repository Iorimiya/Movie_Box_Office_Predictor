url: https://www.ptt.cc/bbs/movie/M.1679101805.A.15A.html
title: '[新聞]《捍衛任務4》上映前要角過世享壽60歲'
content: '《捍衛任務4》上映前要角過世享壽60歲　基努李維心碎致哀


  記者李子凡／綜合報導】美國黑人男星蘭斯瑞迪克（Lance Reddick）最近正在宣傳最新

  《捍衛任務4》，卻傳出他在加州家中猝死噩耗，根據媒體報導，警方初步判定死因是「

  自然因素」，與他合作《捍》片的「基哥」基努李維（Keanu Reeves）聞訊非常震驚與難

  過，他與導演發出聯合聲明表示：「我們對於失去摯愛的朋友與同事蘭斯瑞迪克深深感到

  難過與心碎，他是一名全面的專業演員、與他共事很開心，我們的愛與禱告，和他的遺孀

  、子女、家人與朋友同在，我們會深深想念他。」並表示電影將會獻給蘭斯瑞迪克。


  黑人男星蘭斯瑞迪克（左）曾與基努李維合作4部《捍衛任務》。



  蘭斯瑞迪克曾演過多部知名作品，包括《火線重案組》、《絕命警探》、《危機邊緣》，

  更在4集《捍衛任務》都可見他的身影。他出生於巴爾的摩，擁有耶魯大學藝術碩士學位

  ，後來成為演員。


  《捍衛任務4》將於本月22日搶先北美1天在台上映，瑞迪克最近與基哥都在為該片宣傳，

  但，不久就傳來過世消息，讓

  粉絲唏噓。


  蘭斯瑞迪克（左）曾出席基哥在中國戲院留手印儀式。達志




  --


  在捍衛任務裡面超喜歡他的說~~


  --'
