title: '[討論] 小活佛 iTines NT$90/捍衛任務4 新上架'
content: "特技演員出身的查德史塔赫斯基聯合好萊塢巨星基努李維，開創一集集獲\n得廣大支持的《捍衛任務》系列，自痛失愛犬尋仇的火拚起源，看著約翰\n維克面對各方要捉拿他的敵手，拿起武器親自應對的精彩搏鬥，到與甄子\n\
  丹同台對決的《捍衛任務4》，不難看出演員私下鍛鍊的付出。\n\n除冷酷動作片，論基努放飛自我的代表作，必須提起讓他日後接獲《捍衛\n戰警》主演契機的《阿比與阿弟》系列作品。不管是敢和地府使者開玩笑\n\
  的《阿比阿弟暢遊鬼門關》，還是找捷徑省時間寫歌冒險的《阿比阿弟尋\n歌大冒險》，和艾力克斯溫特組的搞笑拍檔，維持頑童心態到成家立業，\n也想出奇招展開趣味科幻歷險。\n\
  \n此外，願意嘗試各類戲路，好比當地方勢力首領暗示美國排外政策問題的\n《生存者》，及詮釋釋迦牟尼年輕苦行傳達佛教真諦的《小活佛》，能發\n現他願意幫導演一把的心思。\n\
