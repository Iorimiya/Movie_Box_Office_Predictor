url: https://www.ptt.cc/bbs/movie/M.1680683211.A.009.html
title: '[普雷]東方武俠式的浪漫─捍衛任務4'
content: '下方內容有提及電影劇情，介意者慎入!!








  東方武俠式的浪漫情懷


  我從還是很小的時候就很喜歡閱讀武俠小說，在看這部電影時，有很多角色或是場景一直

  讓我聯想到武俠小說中常見的元素。例如電影中自成一格的殺手世界──唯獨在這個世界

  才流通的貨幣與規則；就與武俠中的江湖規矩相輝映；當殺手們旁若無人的在街頭喋血，

  也讓我聯想到往往聚焦快意恩仇而淡化王法的江湖情調。


  類似的場景或是人物還有很多，例如甄子丹、真田廣之所扮演的兩位角色就具備濃濃的武

  俠味。先說說甄子丹飾演的盲人好了，這類的角色在武俠小說中屢見不鮮，就是直接寫一

  個「幾乎」行動自如的人，然後跟你說他是盲人；例如古龍筆下的艾天蝙、原隨雲、花滿

  樓。他們大多時候與明眼人無異，甚至會讓你懷疑到底誰才是瞎子，只會在一些很細微的

  地方會小小提醒你「雖然他很厲害，但他其實是盲人」。


  所以我對這個角色蠻能接受的，就好像電影中有很多細節或許經不起推敲，例如像這種因

  為票房而持續推出的續集，難免會有設定層層疊加卻難以自圓其說之處，但我還是深深著

  迷他的世界觀與設定，大概是有種雖然不講究卻難以言喻的浪漫吧，當然喜歡與否就還是

  見仁見智囉。


  電影中我最喜歡的角色就是真田廣之，雖然出現的場次不多，但寥寥數語就讓他的形象很

  鮮明。例如聽聞女兒評論約翰，語調瞬間嚴厲，說她沒有資格妄加評論；面對危機時也是

  果決明快，在得知高桌會爪牙上門便決心為了朋友與之周旋到底，他當然也想活下去，但

  為了朋友一死，又有何妨？


  這種古龍式的武俠情懷真的很吸引我，也許真的不合理，但很浪漫。或許也算是某種程度

  上的「細節不夠，情懷來湊」，氛圍、情調一旦足夠，細節上的粗糙似乎也不是那麼值得

  深究。


  雖然寫了大半篇對他的喜愛，但最終還是決定給普雷，我覺得還是有很多處理不好的地方

  。例如戰鬥情節的拖沓與重複，好比大阪飯店之戰，中間清鐵頭小兵那一段我覺得太冗長

  了，而且搏殺的方式大同小異，容易給人疲乏之感，尤其當約翰不用槍枝時真的很容易讓

  我出戲，比如說他耍雙節棍的時候，覺得打起來很沒有爽感，不是很喜歡；牌局那一段我

  也不太欣賞，這點也是見仁見智，我就看到有人說覺得那段拍得很有張力很喜歡，但於我

  而言實在步調太慢太無聊了。


  除此之外有一點可能我自己的問題，個人單純很不喜歡被車撞的環節，會讓我有情緒被中

  斷的感覺。例如後面車流中廝殺時，約翰每被撞一次我就覺得節奏被打斷，有種不上不下

  的窒礙感。


  話雖如此，如果還有續集的可能，我想我還是會準時到電影院報到的，因為真的很喜歡他

  的世界觀，如果你跟我一樣喜歡這種武俠元素，或許對你來說這會是一部更棒的電影。




  --



  這一點我深以為然，只要是近距離的拳腳肢接的武戲就讓我覺得套招感強烈，而且打起來很

  不流暢，雖然很多人覺得這一集有改善，但我覺得還是相當有限。'
