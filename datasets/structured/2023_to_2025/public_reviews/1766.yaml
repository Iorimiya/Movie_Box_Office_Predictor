title: '[新聞] 《捍衛任務4》將開拍 「離開紐約」全球多地搭片場'
content: "《捍衛任務4》將開拍 「離開紐約」全球多地搭片場\n\n2021/03/25 16:42\n\n\n黑色動作驚悚片《捍衛任務》2014年上映第一集後廣受各界好評，並接續推出續集。\n\
  （美聯社）\n\n〔即時新聞／綜合報導〕據《Collider》報導，《捍衛任務》（John Wick）第四集將於\n今年六月開拍，不同於前三部電影主要在紐約拍攝，第四集將飛往柏林、巴黎、日本等地\n\
  取景。除「殺神」基努李維（Keanu Reeves）確定回歸外，其餘卡司並未公布。\n\n\n除「殺神」基努李維（Keanu Reeves）確定回歸第四集外，其餘卡司並未公布。\n\
  （美聯社）\n\n黑色動作驚悚片《捍衛任務》2014年上映第一集後廣受各界好評，並接續推出續集。不過\n，造就電影風靡全球的幕後功臣之一，編劇戴瑞克柯斯達（Derek\
  \ Kolstad）卻沒有參與\n最新一集的籌備工作。第四集將改由《刺客任務：殺手47》（Hitman: Agent 47）的編劇\n麥克芬奇（Mike Finch）撰寫劇本。\n\
  \n戴瑞克近日在宣傳新片時坦言，若是20年前的自己遇到此事可能會深究下去，並且感到受\n傷，但現在的他早已清楚這是很正常的。他表示，合約本來就沒有規定非要他擔任第四集\n\
  的編劇，片商最後真的沒有來找他，這沒有關係。同時，他也透露自己與《捍衛任務》系\n列的雙導演仍保持聯繫，並為他們送上祝福、希望拍攝順利。\n\n--\n、。帝釋所問經講記77頁拆穿佛法的。\n\
  是 是菩薩成佛之道\n、、、、()、、是佛經。\n  是佛          是菩薩\n\n和破十方諸佛\n\n--"
