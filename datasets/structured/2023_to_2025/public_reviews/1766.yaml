title: '[新聞] 《捍衛任務4》劇組每小時輪班寵狗　基努'
content: '《捍衛任務4》劇組每小時輪班寵狗　基努李維被黃金獵犬「淹沒」融化網友


  新聞網址：



  2023/03/21 21:30


  【記者李子凡／綜合報導】好萊塢男星「基哥」基努李維（Keanu Reeves）主演的賣座系

  列新作《捍衛任務4》（John Wick: Chapter 4）即將上映，片中基哥飾演的退休殺手約

  翰維克，因愛狗遭殺一怒成為殺神，這集將小狗元素和劇情發展做結合，片中「追跡者」

  的得力助手比利時牧羊犬，在協助追擊約翰維克的同時，又將與其他殺手掀起腥風血雨的

  對戰，劇組找來5隻狗演員，根據不同特技場面與演出輪替，還每小時輪班陪5隻狗狗玩耍

  ，特技人員幾乎全天候陪在狗狗身邊，可說「地表最強愛狗電影」。


  基哥上吉米法隆主持的節目宣傳《捍衛任務4》，2人玩動物問答題，只要答對題目就可得

  到1隻黃金獵犬、答錯就由對手獲得1隻，最後基哥被狗狗們「淹沒」，他的神情溫柔與享

  受，也融化不少網友。


  該片最近在美國西南偏南影展（SXSW）以及海外首映後大獲好評，在爛番茄影評網站拿下

  94%超高評價，也是4集以來最高分，雖然片長長達2小時49分，但相信經過《阿凡達2：水

  之道》等片的「訓練」後，觀眾的膀胱忍耐度都已精進許多。


  《捍衛任務4》故事描述約翰維克（基努李維 飾）經歷上集的事件後，繼續與驅逐他的殺

  手組織「高桌會」展開對抗，隨著懸賞金額的不斷飆升，約翰維克將迎來他殺手生涯最強

  大的對手。3月22日搶先全球在台上映。



  Pup Quiz with Keanu Reeves



  --'
