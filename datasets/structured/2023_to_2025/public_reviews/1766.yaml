url: https://www.ptt.cc/bbs/movie/M.1679905791.A.BF4.html
title: 'Re: [好爽雷] 捍衛任務4 遠比預期的好看'
content: '首先

  按照片中說明

  防彈西裝是克維拉纖維做成的

  並不是什麼更屌的非牛頓流體

  或是什麼神奇的記憶合金之類的


  然後克維拉纖維這種東西

  他確實能擋下子彈

  但跟防彈背心或是片中的防彈頭盔的原理不同

  目前的防彈背心上會有塊抗彈板

  可能是金屬可能是陶瓷

  但當子彈擊中抗彈板的時候

  衝擊力會均勻分散到整塊板子上

  衝擊力會是一個面去分散


  而克維拉纖維他是一塊特別強的布

  子彈擊中時確實不會擊穿

  但並不像抗彈板衝擊力會分散

  他的衝擊力還是會有很大程度的集中

  而且布是軟的

  衝擊還是會由人體吸收

  片中也能看到

  就算只是被手槍集中

  還是會倒會是會有痛的反應


  阿如果做成貼身的面罩

  被擊中少說也跟被棒球擊中差不多

  改用西裝外套遮臉

  不只比較透氣比較帥之外

  更能避免較大的傷害


  -----

  Sent from JPTT on my Xiaomi 21051182G.


  --

  僕のSaber



  --

  被大谷投的球擊中我想也差不多了'
