url: https://www.ptt.cc/bbs/movie/M.1687266538.A.812.html
title: 'Re: [新聞] 金獎大導奧利佛史東轟《捍衛任務4》'
content: "捍衛任務前三集塑造的殺手社會，以及殺手社會之下每一個個體的遭遇\n理應成為個體對不合理制度的反撲\n暴力殺人只不過是在殺手社會下必然發生的「正常反撲方式」而已\n\
  \ \n但第三集結尾明明都給出了這麼好的暗示，第四集卻把重心都導向了決鬥上\n就有種偏離主線的感覺\n如果只有一集，說真的怎麼拍都行，但要拍成系列就一定要有中心主軸\n\
  \ \n再換種角度來說，決鬥確實也可以是一種「利用體制破壞體制」的方法\n然而即便基哥的角色心境一如往常\n但劇組卻沒有好好把重心轉移到「破壞了體制，之後體制要怎麼辦？改革？由誰來改？」\n\
  而是「一個小人物看似破壞了體制，沒了」\n \n結果就是基哥不知是死是活，忙了半天殺光了他想殺和堵住他復仇之路的人\n但那個產生出讓他必須要復仇、讓他想要退出的殺手世界呢？當然還是一如既往\n\
  \ \n當然我們也可以再換一個角度，說基哥最後的遭遇\n恰巧體現出一個扭曲體制下必然出現的受害者，因此才把敘事重心聚焦在基哥的遭遇上\n然而這樣看，反而破壞了前三集所塑造出來的個體與體制對立，氣氛僵硬一觸即發的那種感\n\
  覺\n而且第三集雖然仍然聚焦在基哥身上，但他在復仇過程中遇到不少幫助他的人\n其實全部都跟跟基哥一樣被體制迫害過\n \n正是這種同病相鄰的過去，讓這些活在難以建立互信的殺手社會裡的人仍然願意互相幫助\n\
  到了第四集，互信是建立了，但最終達成的，也只滿足了基哥的復仇，其他人呢？下一集會\n說嗎？\n \n前三集看完，我其實非常非常喜歡，也因此看完第四集讓我相當相當失望\n\
  希望第五集能多少拉回來一點吧\n----\nSent from on my iPad Pro (12.9〃) 4\n \n--\n無論什麼樣的制度都會有例外，現實一樣有能夠扭曲制度為其服務的人\n\
  但你至少不會說「那個人之所以可以成為例外，是因為有個神覺得他是世界的主角」吧？\n我不覺得劇組有故意讓基哥能機械降神，他們只是把焦點都放在主角身上而已\n第四集預告片看完我超期待\n\
  走出電影院卻只覺得有點空虛"
