url: https://www.ptt.cc/bbs/movie/M.1680530213.A.001.html
title: '[普雷]捍衛任務4－華麗場景可以掩蓋一切缺點'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~











  看完捍衛任務4之後，要一口咬定說是好看或是不好看，真的好難


  先說我覺得難看的地方，雖然看版上不少好雷都說動作場面很爽、很讚

  但我覺得這集很多動作場面都不太合格，第三集似乎就有這個跡象

  但第四集似乎就完全不管了

  像是基哥可能年紀又更大一些，整體動作看起來更慢了

  看他耍雙節棍的時候，不知道為何，內心都在擔心他甩到自己…

  另外，這集也加入幾位真的是能打的演員

  他們的動作真的很明顯就是比John Wick 更快、更好

  結果最後還是被主角威能打敗…


  動作戲普通之外，雖然知道看這部不用帶腦，但還是有些地方真的不吐槽都說不過去


  像那個防彈西裝，你要說能夠擋一般手槍的子彈就算了

  結果看到連霰彈槍都能擋住就有點扯了….

  還有像John Wick被車撞了好幾次、從好幾樓高摔下來

  還有最搞笑的從樓梯滾下來的畫面，John Wick竟然都能毫髮無傷！？

  就呻吟個幾聲、甩個投就又滿血了，我玩遊戲，也沒遇過鎖血鎖的這麼誇張的


  然後發生槍戰打架，人擠人的夜店還能裝沒事的跳舞？這點也很扯

  不過要裝也裝到底，都已經打到尾聲了，才一堆人到處逃竄也有點好笑

  還有那個空無一人的梅田車站地鐵以及沒有警察的巴黎，違和感實在太重


  不過說真的扣除掉這些，我真的覺得這集的畫面真的算是最好的一集

  尤其這一幕，真的超美，套上那種灰濛濛的濾淨，完全就是適合談判的氛圍



  另外，這個教堂的場景也有夠壯觀，不知道是哪個教堂？




  還有就是侯爵出現的各個場景，也都是浮誇到不行

  這個博物館是其中之一




  還有馬廄那哩，一時找不到圖，但那個也是壯觀到不行

  也順便稱讚一下Bill Skarsgard在那邊跟黑人有對手戲那幕

  完全讓人感受到他的狠勁，但也就僅只那一幕，實屬可惜


  包含像很不日本的大阪飯店在內

  真的不得不給這些找尋這些地點並打造這些場景的幕後人員掌聲

  上述這幾幕，真的是美到會讓人想要特地找出來到底在哪，實際去朝聖一下的

  也因為如此，才沒有讓這部片完全的讓我失望，至少還是有好看的地方就是了


  至於，結尾彩蛋也似乎暗示了會有下一集

  要說因為這集動作場面不好看就不看嗎？我自己覺得還是會乖乖進場支持

  （算是被漫威第四階段練出來的結果吧XD）


  --

  我是覺得風格很像<子彈列車>

  真的，每一個畫面都想截圖存下來'
