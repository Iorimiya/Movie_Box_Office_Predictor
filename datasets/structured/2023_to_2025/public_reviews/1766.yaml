url: https://www.ptt.cc/bbs/movie/M.1678810629.A.DE8.html
title: '[新聞] 捍衛任務4導演：奧斯卡應成立動作特技'
content: '《捍衛任務4》導演：奧斯卡應該成立動作特技獎項


  2023年3月12日 週日 下午3:36




  《捍衛任務4》（圖：Lionsgate）


  【文／血紅蘭姆】《捍衛任務》系列導演查德史塔赫斯基坦承，奧斯卡應該正視特技演員

  對電影圈所做出的貢獻。


  特技演員出身的導演查德史塔赫斯基已在好萊塢闖盪三十年，他不僅曾在《龍族戰神》中

  擔任過李小龍之子李國豪的替身，而在李國豪因為槍枝意外去世之後，當時也是由查德史

  塔赫斯基代打上陣，再透過特效疊上李國豪的臉孔。


  除此之外，查德史塔赫斯基也曾在《駭客任務》系列電影中擔任基努李維的替身兼動作指

  導，隨後更在《忍者刺客》中和同為特技演員出身的大衛雷奇聯手兼任第二組導演，兩人

  才在首集《捍衛任務》中一同正式升任導演。


  查德史塔赫斯基如今也向IGN談到了奧斯卡始終缺少動作特技獎項一事：「老實說，在我

  從事動作特技二十多年以來，常常都有人談到這件事。至於奧斯卡為何沒有動作特技獎項

  ，也有許多道聽塗說的理由。但就我所知，從來沒有人實際去這麼提議過。」




  《捍衛任務4》（圖：Lionsgate）


  「我不認為美國影藝學院內外有任何人會反對，我們屬於電影圈九大部門之一，而在每支

  預告中也都可以看得到動作特技。我們是很龐大的部門，在創作過程中也十分吃重。但有

  沒有記者或特技演員直接去公開找過美國影藝學院主席呢？」


  「不如我們就弄個房間，立刻邀請美國影藝學院出席，好跟我或其他特技界代表人士一起

  談談。我們都同意，這麼做才公平，但實際上到底要如何執行呢？該由誰來得獎呢？其中

  的狀況十分複雜。」


  「動作特技是個相當複雜的部門。好比動作特技究竟是由誰設計的呢？有時候是由我設計

  的，有時候是華卓斯基姊妹，有時候則是史蒂芬史匹柏或克里斯多福諾蘭。到底應該由設

  計動作特技的人得獎，還是表演動作特技的人得獎呢？」


  「至於武打戲呢？是表演者領獎，還是像袁和平這種設計武打戲的人領獎呢？這些都是好

  問題，但我們必須先展開這個對話。不管是我、特技界人士或美國影藝學院都沒有相關答

  案，但如果我們能坐下來把事情談清楚，一定會很棒。」


  「如果聰明人和聰明人一起促膝長談，通常都會想出聰明的決定。所以我們何不在雙方陣

  營中都找出聰明人來互相溝通，以善意為出發點來送出邀請函。如果你想讓奧斯卡頒獎典

  禮變得更刺激，我們這個部門通常都能把事情變得更刺激一點。」


  「我們已經在大銀幕上持續這麼做了一百年，大概也能為奧斯卡頒獎典禮如法炮製，讓音

  樂歌舞再加上特技表演。這對奧斯卡來說是雙贏，對我們來說也會是雙贏。」


  《捍衛任務4》將於2023年3月22日上映。



  新聞網址：




  --'
