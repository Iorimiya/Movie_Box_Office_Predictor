url: https://www.ptt.cc/bbs/movie/M.1679414247.A.22E.html
title: '[好無雷] 捍衛任務4 一直殺人一直爽'
content: '今天看了首映 盡量以無雷方式給觀望要不要去看的版友參考


  基哥真的跟第三集一樣，動作上就是有老了，對打時有套招感

  (但就不得不佩服更老的甄子丹跟真田廣之，動作比基哥都還要迅速俐落)

  尤其是跟甄子丹打戲時，真的那速度差有時候有點霸凌感XD


  不過這次所以導演改變了第三集的方式，第三集著重在個人與少數強將(通常也有名)對挑

  第四集就是趨吉避凶，減少這種基哥跟精英近身肉搏的戲碼

  改讓基哥回到最拿手的鎗神(真的是用槍殺人的100種方法)，

  然後幾個小頭目率領一堆嘍囉，讓基哥一直殺人一直爽，真正的一槍殺進去!!


  缺點當然就是單純看動作設計，以及喜歡個體強強對決的人會覺得較以前薄弱一些

  (平心而論，甄子丹自己來搞會好看很多，他在劇中其實也已經在壓抑自身威能了)

  但導演改用場面調度與設計，依舊還是給了愛狗人士很大的麻煩與觀眾很爽快的感官之旅

  (其實個體強碰的戲碼還是有，多半在前半部，只是從聚焦基哥也分散到其他人身上

  之前看影評盛讚澤山璃奈，嗯，真的直追追殺比爾栗山千明，以後或許拍她女殺神外傳?)


  同樣也是看過後才知道為啥之前影評會說片長很長但沒太大感覺，

  因為光最後一場巴黎大逃殺+_最終對決，大概整整就有50分鐘到接近1小時


  真的要特別推薦這場巴黎大逃殺~你可以看到捍衛關頭巴黎甩尾(基哥真可以加入玩命了)

  還有各種碰碰車，最後還有笑噴的階梯大戰(看完我好希望他們來烘爐地拍XD)


  至於最終決戰，其實方式會讓人有點納悶精彩的起來嗎？

  最後卻是給了一個出乎意料的爽快反轉，反而別有一番樂趣也值得推薦


  總之或許你對前面還是有點搔不到癢處的感覺，但沒有冷場的最後一個小時很難有人不嗨!


  其他優缺點


  -潘尼懷斯的反派演得很不錯~會讓人很不爽的角色XD

  -美術燈光攝影場景場面調度都非常強，這些都是讓戰鬥更出色加分的重要元素

  -這次有新增不少有趣的新道具讓正反派都升級，尤其有一把槍有夠屌有夠爽的!!

  -雖然老了俐落程度有差，但基哥真的很拼很苦，有夠敬業的QQ

  -撇開戲外，甄子丹算是演得駕輕就熟，根本俠盜一號+他港片角色mix，有原力都不意外XD

  -劇情就真的只是浮雲，其實有些台詞寫得不錯，但既然大家都知道要打要殺了，

  有時候那些鏡頭節奏跟角色情緒的鋪陳，真的好像沒什麼必要，也不是電影的錯，

  就觀眾真的會有點不耐，反正也都只是為了打殺找藉口，＂給我戰就對了!!!"

  -算是片中另一個對手的黑人，其實可以寫得更好一些(雖然有他重要呼應意義在啦)


  有想到再補充，就先給大家參考囉！


  --'
