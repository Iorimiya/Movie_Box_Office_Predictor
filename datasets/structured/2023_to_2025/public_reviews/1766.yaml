url: https://www.ptt.cc/bbs/movie/M.1682075139.A.135.html
title: '[好雷] 捍衛任務4'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~





















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  動作片類型有個都市傳說，是大概四、五零年代的男人，只要看到電影台在播史蒂芬席格

  的動作片就會停下來默默把片看完，俗稱「爸爸的最愛」。看完《捍衛任務４》，我覺得

  基努李維也許有機會成為我們這一輩的「爸爸的最愛」吧。


  基努李維的存在證明一件事情，就是「光靠帥就可以縱橫好萊塢」是可能的。老實說我覺

  得他的演技真的很不出色，甚至在刻意刪減對白到整部戲不到四百字台詞，特地塑造他冷

  酷寡言的狀況下，念台詞還可以這麼充滿棒讀感真的很神奇，甚至有種好像還想多講點話

  ，可是因為台詞只有這句，所以硬生生住嘴的樣子。但是他的：「Yah...」為什麼可以這

  麼帥？沒天理啊！


  而且他真的是拿槍無敵，不只是在電影中物理意義上的大殺四方，就連那個架式以及持槍

  散發出來的威嚇感，甚至是連拉西裝擋子彈這個其他人做起來充滿窩囊感的動作，他做起

  來就是很自然、很輕鬆寫意。或許跟人高又手長腳長有關吧。不過拿槍超帥，但做起武打

  動作就有種說不出但充滿整個空間的尷尬，尤其這一集多了很多地板技與寢技，可是很多

  時候他們做起來比較像兩個人在地上翻滾，動作很不流暢，我一直很好奇基努李維是不是

  比較少運動？動作常有不協調感。


  甄子丹這個角色在這樣的狀況下幾乎可說是整部戲近身搏鬥部分的救贖，大概真的是太習

  慣東方武俠片的節奏了，所以看到甄子丹的動作一直有種：「終於認真在搏鬥了」的感覺

  。而且他這次扮演的是盲劍客，多數時間用大大的雷朋墨鏡擋住眼睛和半張臉，也避免了

  他跟基哥對戲可能陷入演技比爛的窘境（對，甄子丹的演技也…）。更何況這次對盲劍客

  設定的一些小巧思相當有趣，譬如他還要隨身攜帶感應式門鈴來協助判斷敵人位置，或是

  當面對基哥時卻因為不確定基哥的呼吸聲而忍不住開口詢問他的死活。要是照以前座頭市

  的設定，或是《暫時停止呼吸》中的退休老兵，電影大概早就結束了。


  雖然很好奇日本是只剩下真田廣之可以打了嗎？但他實在是帥翻了！雖然不高是致命傷，

  但是帶頭發號施令的氣勢、揮刀的流利，而且帶眼鏡還可以帥成這樣真的太犯規了。也許

  之後可以期待看看佐藤健吧，但是他又缺少真田廣之的霸氣。不過電影中女兒明的演技相

  較之下就差了一大截，她應該是來幫基哥墊背的，尤其是兩個人在電車上交談的那場戲，

  我尷尬到手指蜷曲，甚至覺得車上這麼空都是因為乘客被尷尬的氣氛趕下車。


  電影的動作場面雖然因為美式風格或基哥的關係有點違和感，但整體設計還是非常精采，

  尤其是後面的凱旋門大戰以及在空屋中的俯視觀點，還有那條勘比《玩命關頭六》飛機跑

  道的樓梯，非常具有娛樂效果。而且還有很多演起來很認真，但是仔細想想充滿吐槽點的

  片段，例如夜店裡，就已經打成這樣了，旁邊舞池中人群一點反應都沒有，我正在想他們

  是不是嗑藥嗨過頭沒反應，結果突然開始跑起來了？剛剛你們不跑現在是在跑幾點的？還

  有凱旋門基哥右手開車繞圈左手持槍打怪實在是太歡樂了，他還要控油門耶？但最值得吐

  槽的應該是凌晨四、五點的巴黎人還這麼多喔？路邊咖啡廳坐滿坐到露天座位區耶？凱旋

  門車流沒停過耶？這些片段為電影增添許多歡樂之處。還不用提那個「無名之輩」，看完

  歸納他的角色大概是《玩命關頭七》裡的傑森史塔森吧，整部戲一直出來刷存在感，但你

  不知道他到底出來做甚麼的？


  但是最值得激賞的是這部片劇情方面也處理得很不錯，以往動作片多少都有不需要在意劇

  情的印象，甚至系列的前兩集也是這樣，但《捍衛任務４》是很認真的把一個故事說完。

  對，我想最大的原因就是他真的說完了 John Wick 的故事，而且有個非常符合故事設定

  ，也合情合理的完結方式，再加上最後黎明時的巴黎聖心聖殿，那個場景堪稱經典，是絕

  對值得收藏的劇照。結局寫得很美，衷心希望不要再開續集，這樣會破壞結局的近乎完美

  。


  --'
