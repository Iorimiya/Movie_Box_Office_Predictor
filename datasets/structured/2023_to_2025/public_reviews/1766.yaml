url: https://www.ptt.cc/bbs/movie/M.1679533137.A.EA7.html
title: '[好雷]【捍衛任務4】武打動作電影的文藝復興 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  身為一個生於1980年代，看武打片長大的世代觀眾，【捍衛任務4】實在給了我很大的滿

  足感，他只有簡單的故事架構，主角必須要躲避追殺，進而爭取讓自己獲得公平決鬥好讓

  自己平反的權力，然後就沒有然後了，一切就只剩下打鬥，但是這一場場的打鬥卻完全不

  會讓我看得疲乏，每到一個新的地方，新的角色出現，總是都能打得精彩又有創意，在

  2020年代這種為了顧慮各種意識形態，電影越拍越平淡無趣的時代，【捍衛任務】系列簡

  直就是武術動作電影的文藝復興。這個系列拍到第四集我仍舊感覺得到編導還有許多東西

  沒有玩夠，也還有許多東西仍想嘗試，他們是真心的喜愛打鬥與動作場面的團隊，而且也

  玩得讓我這個觀眾看的興奮開心又過癮。


  --


  男人是一種很悲哀又很容易控制的動物，因為他們往往拼了命的取悅異性，或是從各種媒

  介取得任何可以引起性幻想的事物，甚至還因而犯下強姦或是偷窺等大小不一的罪，但是

  追根究柢，目的卻只是想要從自己的身上擠出那麼5C.C的液體而已。

  粉絲團



  --'
