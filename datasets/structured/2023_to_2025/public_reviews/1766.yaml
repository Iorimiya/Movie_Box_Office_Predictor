url: https://www.ptt.cc/bbs/movie/M.1680093408.A.DBA.html
title: '[普雷] 捍衛任務4 (John Wick)'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  整部片近 3 小時，感覺劇情有點拖。


  雖然大家對 Keanu 的演技沒有太多要求，但總覺得劇情和節奏上可以安排更好。



  首先是沙漠酋長部分，


  片頭花很大篇幅在沙漠騎馬開槍追殺，但我看不懂為啥三個人要跑給一個人追，


  而且那一個人 (John Wick) 的槍法還很不準。


  感覺這部份改成 John Wick 突然現身然後秒殺一群保鏢還比較能顯示出殺手的實力。


  而且 John Wick 與酋長的對話也很虛。



  然後就是侯爵 Marquis，高桌給他無限權力解決 John Wick，


  但是他的氣場實在很弱，智力不強、武力不高、也沒謀略，


  看不出來高桌有什麼實力讓大家害怕。


  感覺整體高桌體系，就是幾隻羊帶領一群狼。



  John Wick (Keanu) 本身就沒啥表情，但前幾部戲都是靠配角情緒來帶動氛圍。


  然而飯店主人 Winston 和隨從 Charon 前 3 集的氣場表現都比這集的侯爵強。


  連沒什麼戲份的地下之王 Bowery King 都還比較有權威感。



  侯爵這個關鍵角色的帶動感實在太弱。


  例如 Mr. Nobody 去找侯爵時，手被侯爵捅了一刀，但還是感覺不出侯爵的狠勁。


  而且連最後要被單挑時的氣場也很弱。


  這公子哥的選角和角色設定，感覺還有提昇的空間。不然很容易一直出戲。



  相較之下紫色西裝的 Killa 的氣場反而比較適合當大魔王，去做最後單挑。


  Killa 的奸笑、武打、氣場都會很期待接下來劇情會有什麼轉變。



  甄子丹演盲劍客的劇情安排實在也是有點瞎，


  跟 John Wick 對打時，還不知道自己有沒有殺死 John。


  槍這種非常需要靠視覺瞄準的武器，光靠聽只能知道大略方向是不可能打準的。


  更何況還有穿一身防彈衣。


  在大阪大陸酒店第一次對打時，兩個人有邊對打邊對話的場景。


  當 John 回話時，我一直以為 Caine (甄子丹) 會直接朝講話的地方開槍，結果也沒有。


  然後最終之戰，要上演西部牛仔開槍對決戲碼，我還想說瞎子看不到，


  根本不知道一個方向的身影發出的聲音會是誰，會不會打錯人。



  最終之戰之前的爬樓梯也是，如果山坡、樓梯、地形對盲人都不叫做障礙，


  那這個盲人一開始在大阪的大陸酒店根本就不需要拐杖來聽聲辨位了。


  雖然要致敬座頭市、夜魔俠，但感覺這角色設定有很多互相衝突。


  還不如扮演獨臂劍客還好一點。



  整部片基哥的武打場景很多，參與場景和劇情很多，也算是給影迷回饋。


  不過因為穿防彈衣的關係，打鬥時間變得很長。


  這時 John Wick 在一打多的時候，我反而都在看被打倒反派如何站起來重新回戰場。


  結果不出所料，都是在東摸西摸，等 John Wick 回頭時，才開始知道要拔槍、起身。


  但以基哥的年紀，願意參與這種長時間的武打戲也滿足了影迷的期待。



  不過不管怎麼樣，都比駭客任務4好太多了。


  現在比較期待康斯坦丁2能夠開拍。


  --

  我還剛剛好有騎過幾次，馬跑起來之後，其實可以靠下半身吸收起伏，上半身穩定。

  快走時反而會比較晃。


  問題是整個追逐戲的設定一點都不合理，雙方都有槍，人多的跑給人少的追。

  你是不是沒看過騎馬射箭？

  那你應該是沒騎過馬，不知道保持上半身穩定是基本要學的。


  不懂的人是你吧，連馬都沒騎過，騎馬每個階段會遇到什麼問題、需要學什麼都不知道。

  然後就在鍵盤去嘴騎過馬的人。


  開槍比射箭簡單多了，不用雙手、不用出力。

  以前馬術到一定程度就要去練在馬上工作，套圈繩、古代射弓、開獵槍...等。


  這部戲連盲人都可以不用拐杖爬坡爬樓梯了，你還在這邊計較騎馬開槍。

  你先學會讓馬跑起來，再來談騎馬... zzzz

  什麼都不懂還硬要討論'
