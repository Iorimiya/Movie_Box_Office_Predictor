title: '[好雷] 捍衛任務4  基哥大殺四方!!!! '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  劇情一定有不合理  但看基哥大殺四方就是帥!!!




  趁今日衝完有印象 趕快把心得跟疑問條列式打一下




  1.前面的沙漠一度讓我想到神鬼傳奇1開頭 還以為印和闐要跑出來XD



  2.長老上去是不是還有高桌會的12員? 看上一集以為長老已經最大



  3.夏戎真的R.I.P.了  還真希望他是威斯卡的複製人



  4.大阪大陸酒店真的視覺效果滿分，滿滿賽博龐克配色


  真田廣之跟澤山梨奈都很吸睛!在飯店用日本和弓當成浪漫就好XD 不用管合理性



  5.侯爵的銀西裝侍衛隊防彈效果真的很謎，感覺是西裝+西裝褲都防彈了!?但又好像

  裡面塞鋼板...



  6.高層增援的部隊 明明就侯爵這邊的人  但造型很像第三集的防彈部隊套了一個

  日本鬼武者的皮膚XD



  7.這次真的很給葉師傅面子，戲份重+沒破格



  8.黑人追跡者腳色撇開政治正確~就帶出一個新職業 以後其他作品可發展



  9.龍息彈超帥!!俯視槍戰那一段 超像打GAME 滿分!!



  10.江威克終於安息~~~~



  以上   滿足的一晚!!!









  --


  --'
