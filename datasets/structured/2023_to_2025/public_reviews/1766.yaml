url: https://www.ptt.cc/bbs/movie/M.1679564319.A.BEC.html
title: '[大負雷] 捍衛任務4 找不到稱讚的點'
content: '雷文防雷資訊頁

  我不知道上一次看電影看到快看不下去是什麼時候，看完後想要說出它的優點都不知道能說什麼，我知道板上很多基努李維和捍衛任務的粉絲，歡迎在推文反駁我。



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  首先我對這部的片長就蠻有意見的，電影非常冗長，而我卻感覺不到拖那麼久的意義，整

  部都在打鬥我沒什麼意見，畢竟這就是觀眾想要的，但打戲真的說不上精彩，就是一直有

  雜魚出來送頭送補給(我知道這是動作片的通病，但不斷重複兩個多小時很疲乏)，你就看

  著基哥血條用不完一直打，敵人子彈只會射到防彈的部分，被揍馬上就能爬起來，被車撞

  像是被人撞一樣沒事，從三四樓跳下來還是能站起來趕路，從樓梯一直滾下來還是能再打

  ，滾樓梯的畫面久到我不知道導演是不是在做笑點。


  除此之外看電影的時候也感受不到緊張與刺激感，雜魚真的佔太大一部份了，真正能稱得

  上對手的幾個人卻只佔片長的一小部分，最後的決戰雖說緊張感有起來，但這種決戰方式

  只能說爽度不足。


  另外我想提一下後半部在老房子那個從高處俯拍的運鏡，老實說這運鏡是不錯且也不常在

  動作片上看見，不過有一個缺點就是看不太到人物在打什麼，只是那段也是在打雜魚而已

  ，不太需要正常鏡位來看打鬥的細節，所以我不太能說這算優點還是缺點。


  總結就是我真的不知道要稱讚哪部分，演員的演技沒有特別出色，劇情雖爛但可以理解，

  畢竟這不是這種電影的重點，最重要的打戲卻也不精彩，這就是一部能在兩小時內演完的

  東西，硬是要拉長拖到接近三小時的電影。


  --

  劇情不就一路打而已

  很帥，我整篇文都是針對電影而不是他'
