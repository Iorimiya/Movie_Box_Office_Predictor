url: https://www.ptt.cc/bbs/movie/M.1679488693.A.186.html
title: '[好雷] 捍衛任務4'
content: '捍衛任務4真是一部爽片，基努李維比起第3部的套招後慢吞吞的打鬥，在本片動


  作看起來流暢多了，片長169分鐘讓John wick的打鬥場景也變豐富了。




  大阪大陸飯店的人事物有點像子彈列車裡的佈景風格，有日式庭園、武士刀及弓


  箭、一堆花花綠綠的燈管搭配著浮世繪。而後段劇情回到柏林及巴黎，也就回到


  捍衛任務1~2集那樣寫實的畫面，教堂、夜店、大街小巷...還有車水馬龍繞來繞


  去的凱旋門。




  還有觀賞這部電影時，要帶有像是在玩遊戲的方式去思考。


  例如John wick被踢下那220階樓梯時，一直一直一直滾呀...滾到最後，之前他上


  樓梯時打倒的殺手們竟然全部都不見了，就像死亡後不久會自動冒成泡泡消失的


  NPC。


  以及在凱旋門那裡John wick和殺手們的對決，可以看到殺手們只要不留神，就會


  被行駛中的車輛撞飛。總之這裡的設定就是車子們都趕著回家，再激烈的槍戰也


  決不減速。不過看到那些人被撞得遠遠的，有點爽快沒錯~~




  真田廣之在本片的表現其實和子彈列車的長老差不多，雖然比起甄子丹出場的時


  間短，但是給主角的支持，就是有情有義是我兄弟。


  甄子丹飾演的凱恩雖然看不見，但感到編劇有用心塑造他的個性和打鬥方式，在


  片尾最後似乎留下凱恩會帶來新故事的伏筆。




  反派通常不是死於話多就是死於太笨，侯爵就是後面類型的一員。他最後想來撿


  便宜，結果便宜被John wick撿走了，在一堆殺手被John wick用刀用槍用雙截棍


  多重傷害並複雜的攻擊後死去，侯爵的死法是廉價且有效的「一槍斃命」。




  溫斯頓最後又回復紐約大陸飯店的主人位置，他也算是捍衛任務系列最聰明的人


  吧。回復一下各地給殺手們休息的大陸飯店：


  第1集出現紐約大陸飯店。


  第2集出現羅馬大陸飯店。


  第3集出現卡薩布蘭加大陸飯店。


  第4集出現大阪大陸飯店。


  聽說有些外傳還在籌畫，不知未來還會哪些XX大陸飯店會出現。



  --'
