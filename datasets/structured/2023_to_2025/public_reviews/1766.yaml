url: https://www.ptt.cc/bbs/movie/M.1679833363.A.90E.html
title: '[普無雷] 捍衛任務4'
content: '沒有邏輯可能已經成為這部作品的一個特色了 所以劇情的部分就直接跳過不討論（感覺這

  系列已經沒有打算要改善這一點了）


  打鬥的部分 有基努李維的場景 所有人用槍的動作幾乎都會慢好幾拍 然後永遠沒辦法靠運

  氣直接或是靠跳彈集中維克的頭


  這似乎也已經成為這部作品的特色了（感覺這系列也已經沒有打算要改善這一點了）


  要不是有甄子丹 不然我肯定是等上了NF再來找特別有耐心的日子來補這集


  真田廣之的動作也明顯偏慢 打得甚至比基努李維還難看 但演浩二女兒的那位看起來是挺靈

  活的 動作不差


  然後侯爵方的小Boss動作則是相當漂亮 每次看到他打架都可惜他沒有一張基努李維的帥臉


  對無名氏沒有太多的感想 感覺不算特別亮眼 但仍然是在基努李維之上


  給對前三部無感但對這集還在觀望的：要看基努李維以外角色打架的話還可以，但整部有超

  過七成都是基努李維在打架，所以通常會建議等上NF再耐心品味



  --'
