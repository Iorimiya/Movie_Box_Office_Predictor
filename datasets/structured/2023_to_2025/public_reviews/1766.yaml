url: https://www.ptt.cc/bbs/movie/M.1679670482.A.2C1.html
title: '[好無雷] 捍衛任務4 打好打滿 拍得很棒'
content: '這片片長2小時49分 真的要控制一下不要喝太多飲料 不然後面會很痛苦XD


  這次也是跟第三集一樣打好打滿 但導演應該有學到教訓 中間有補一些喘息的空檔不至於讓打鬥太過審美疲勞 上一集的話打完師徒又打師父那邊是真的會疲勞 這片就比較沒這問題


  覺得導演單純就是想弄一個很高檔、很有質感的神秘殺手組織 然後讓他們打到爽 我感覺這部分都做得滿成功的


  反正捍衛大家會看到4基本上劇情也不用動腦 本來就是純粹享受武打跟戰鬥才去看的 我自己是看的很爽


  中間有一段很神的一鏡鏡頭 打鬥都已經拍到有藝術氛圍了XD


  順帶一提那個沙贊有夠慘 上映才八天看起來像快下檔一樣 廳數吃光光






  --








  --'
