url: https://www.ptt.cc/bbs/movie/M.1624969217.A.2C2.html
title: '[新聞]《捍衛任務4》正式開拍 官方曝光「首張片'
content: '新聞網址：


  完整新聞標題: 《捍衛任務4》正式開拍 官方曝光「首張片場照」網嗨翻

  新聞來源: 自由時報電子報 2021-06-29 綜合報導


  新聞內容:

  獅門娛樂（Lionsgate）今（29）日曝光由「基哥」基努李維（Keanu Reeves）主演的《

  捍衛任務》系列第4集的首張片場照，宣告該片已正式開拍，讓全球影迷們嗨翻。


  只見一張印有「捍衛任務4」字樣的黑色導演椅，放置在打著綠光、空無一人的片場中央

  。除了椅背上首次曝光新片的商標設計外，沒有透露太多細節。雖然無法從此張片場照中

  ，看出第4集的故事內容，但對於該系列的粉絲來說，仍足以令人感到興奮。


  《捍衛任務4》將不同於前3部電影主要在紐約拍攝，將飛往德國柏林、法國巴黎、日本等

  地取景。港星甄子丹、日裔英籍歌手澤山璃奈（Rina Sawayama）也將參與演出。該片預

  計2022年5月上映。


  --'
