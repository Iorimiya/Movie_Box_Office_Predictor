url: https://www.ptt.cc/bbs/movie/M.1679845307.A.DDF.html
title: '[爽翻無雷] 捍衛任務4'
content: '以下無雷心得


  如果你喜歡爽片

  請絕對、絕對、真的絕對不能錯過捍衛任務4

  在這部片裡

  你會找你所有夢想中爽片裡的一切

  雖然降智但又說得通的劇情

  不甚合理但又莫名其妙看得很開心的戰鬥場景

  精緻美麗的攝影

  流暢的運鏡

  以及最重要的

  億萬動作巨星的風采

  雖然基哥年華老去

  但魅力依舊不減


  請注意

  看這部片是

  不用帶腦

  不需帶腦


  就用你的感官去感受電影裡的每一分每一秒

  好好邊吃著爆米花喝著汽水邊享受

  它沒有太多複雜、令人感到干擾的劇情

  也不需要在意劇情

  你只要專注在人物之間的各種情感演出即可

  這樣就安心的好好看完一部真正的爽片

  而不用去擔心「啊我明明就是來看爽片的，怎麼廢話那麼多？」


  捍衛任務4最大最大的優點

  就是它毫不掩釋它的

  大剌剌的表現出「對！拎北就是降智劇本！怎麼樣？但我知道觀眾要的是什麼！」

  札札實實的完全滿足影迷們對捍衛任務系列的期待


  非常簡單


  「我們不需要太多囉哩八唆的複雜劇情，我們只要看殺神殺翻全場！」


  一個人一生只要做好一件事就是功德圓滿

  一部電影跟人完全一樣

  有些電影就是說好一個故事

  而捍衛任務4就是拍好一部爽片

  如此簡單

  如此純粹

  明明片長將近三個小時

  卻讓觀眾每分每秒都能如癡如醉


  今年以來看過的許多電影

  阿凡達：水之道

  蟻人3

  沙贊2

  它們都有一個問題

  這幾部通通都很降智

  劇情設定都有一堆不合理之處

  但除了捍衛任務4

  其它人都太想要證明自己並不是降智片或爽片

  或不只是爽片

  很可惜

  這批人錯得離譜

  這些劇本通通都差不多一個等級

  都是只要你稍微智商上線就會看得很痛苦的那種

  它們明明就拍不出能通過智力測驗的電影

  但又硬是要自己去應考

  打腫臉充胖子的標榜自己除了特效與戰鬥之外還有其它的東西

  最後就是東缺一塊西缺一塊

  總是有某個部份沒做好

  或甚至通通都沒弄好

  就像那個沙贊還有那個沙贊對我就是在說你沙贊

  劇本智商大概只有60不到

  戰鬥也亂七八糟

  特效普普通通沒有新意

  運鏡剪輯也是卡卡不太順暢

  搞笑也多半有夠尷尬

  可以說是什麼事都想做但通通都沒做好的最佳代表

  希望這些有錢的電影公司老闆好好想想

  你們到底想拍什麼樣的電影

  想拍劇情片就好好專注劇情

  想拍爽片就好好讓大家爽

  什麼都要的片

  拍是拍得出來

  天時地利人和加上導演跟演員都人品爆發突然創意飆起

  人人有機會

  但個個沒把握

  不要在幻想自己神通廣大了

  專注把你要表達的重點做到100分

  其它都只有及格

  大家還是會給你點讚的


  --'
