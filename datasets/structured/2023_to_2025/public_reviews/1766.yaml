title: '[好雷] 捍衛任務4 心得'
content: '去看之前2-3位朋友都跟我說不好看

  但秉持著我是去看帥氣基哥的心所以還是去看了

  不知道是不是期待值下降了 所以覺得滿好看的!!

  片長出乎意料長 但動作打鬥部份真的是給好給滿

  唯一美中不足大概是我買IMAX座位有點買太近(G排中間)

  看到後面真的有點累









  以下有雷






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  大阪飯店那邊的打鬥很精彩

  不過浩二硬要送頭我自己有點不理解 肯恩已經要放過他了

  為甚麼還要硬送

  不過肯恩的打鬥的那段我個人覺得蠻新穎的

  我以為會像武士那種輕微聲音的聽音辨位

  結果是超級直白的感應器 隔天去家旁邊早餐店聽到歡迎光臨的感應器不小心笑出來


  賭場那邊也很好看 那個老大的人設弄得很棒

  本來以為他胖胖的不能打 結果意外蠻猛的


  以打鬥片來說 這部很爽


  --


  奇拉給人印象超深刻的


  結果直接突破眼界 超意外


  原來是這樣！'
