title: '[新聞] 捍衛任務4 首週就超過第一集總票房'
content: "殺神來勢洶洶！《捍衛任務 4》全球開片票房創系列新高、首週旋即超越第一集總票房\n\n\n\n（圖片來源：獅門影業）\n\n基努李維（Keanu\
  \ Reeves）四度領軍的《捍衛任務 4》（John Wick：Chapter 4）上週於\n各國盛大公映，而這部備受矚目的重磅續集也果然沒辜負各界的期望，首週即在全球吸金\n\
  \ 1.37 億美元票房，創下系列至今最高的開片成績。\n\n《捍衛任務 4》也是全系列目前製作成本最高，據說約耗費 9000 萬美元，亦有一說共花\n費超過一億美元，但無論哪個說法正確，這都超越前三集的預算規模，第一集當年是獨立\n\
  製片等級的小型動作片，僅花費 2000 萬美元左右，後來第二集則追加至 4000 萬美元，\n第三集則加碼到 7500 萬美元，如今則已晉升近億美元的 A 級製作。然而預算雖持續成\n\
  長，但票房也有大幅翻倍。\n\n\n\n（圖片來源：獅門影業）\n\n單論北美方面，《捍衛任務 4》首週收益高達 7350 萬美元，超越第一集首週的 1400\
  \ 萬\n美元、第二集的 3040 萬美元、第三集的 5680 萬美元，同樣是系列開片最佳。算上海外\n票房的 6400 萬美元，，第二集是 1.74 億美元，第三集則飆漲至\
  \ 3.28 億美元，依《捍衛任務 4》首週旋\n即超車第一集總票房的趨勢來看，最終要超車第三集總票房絕非難事。\n\n文：Joker\n\n新聞網址：\n\n\
  我沒衝首日 過幾天才看也滿廳 台灣票房也滿好的\n\n--\n\n\n\n\n\n\n\n--"
