title: '[好雷]  捍衛任務4'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  原本看到片長2小時49分不太想去看，


  畢竟3後面真的看到有點煩躁，


  不過看到車庫為了衝票房有189的預售票就去看了，


  劇情老實說沒啥好說的，就是毫無邏輯只是為了讓打鬥戲開始，


  像是去大阪除了害死自己老朋友之外看不到任何必要性XD


  但前兩段整體設計得非常好(大阪、賭桌)，


  可以說是非常精彩、充滿驚喜，


  但隨後到決鬥場地前3的味道又有點飄出來了，


  就是不斷打雜魚也沒甚麼特別和驚喜，


  但整體來說這次4還是算是不錯的爽片，


  如果是這系列愛好者不能錯過。


  --


  記錯了拉 更正一下'
