title: '[討論] 捍衛任務4 關於溫斯頓 (雷)'
content: '這裡提出一個想問已久的問題

  為什麼約翰這麼容易就原諒了溫斯頓

  照理說上一集溫斯頓為了保住飯店

  直接對約翰開槍打他 讓他從天臺摔到地上

  要不是約翰命大 被包厘幫撿了回去 早就掛了


  依照約翰這種有仇報仇的個性

  覺得他看到溫斯頓應該起碼罵個幾個 揍個幾下

  就直接跟他同仇敵愾  覺得有點怪怪的



  --'
