title: '[新聞] 金獎大導奧利佛史東轟《捍衛任務4》噁心'
content: '新聞網址：



  2023-06-20 08:16:49



  曾憑《前進高棉》（Platoon）、《七月四日誕生》（Born on the Fourth of July）兩

  度奪下奧斯卡最佳導演獎的奧利佛史東（Oliver Stone），日前受邀前往羅馬尼亞獲頒川

  西凡尼亞電影節的終身成就獎，而在領獎前，史東也接受了《綜藝》（Variety）的獨家

  專訪，並在對談過程當中順道分享了他對時下某些好萊塢商業大片的看法。



  史東坦言，他無法對當紅的流行文化作品產生共鳴，而《捍衛任務 4》（John Wick：

  Chapter 4）便是其一：

  。也許我小時候會看《特種部隊

  》卡通，但





  史東繼續批評：「《捍衛任務 4》已經和現實脫軌，或許觀眾很喜歡打電動吧，但我覺得

  很無聊。你是能撞毀多少輛車？你是能搞出多少特技？





  史東也對好萊塢各大電影公司當今的操盤模式感到不滿：






  這並非史東首次批評當代好萊塢娛樂片對暴力場面的詮釋，他過去就曾痛批，






  --'
