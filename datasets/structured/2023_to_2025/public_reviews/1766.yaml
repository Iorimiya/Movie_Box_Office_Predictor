title: 'Re: [新聞] 甄子丹談加盟捍衛任務4條件：須尊重中國'
content: '說到這部電影


  我記得第三集當初還是在飛機上看的


  不過看的時候有一個疑惑


  日本壽司殺手手下有兩個強將


  跟男主在飯店裡對決


  開始跟男主行禮我能理解


  畢竟男主殺手界大老的地位擺在那邊


  一交手


  很快就把男主角打趴下


  但非常奇怪的是


  他們倆個居然不是在男主爬不起來


  趁他病要他命


  居然是把男主扶起來再打過






  當然最後是男主獲勝


  也因此不殺掉兩人作為回報


  但是


  到底為啥這兩人開始能殺卻不殺呢？


  後面男主對上壽司老大


  雙方就往死裡打了


  但之前那場兩個小弟卻是點到為止


  就算男主是殺手界大佬


  但懸賞令都已經發布


  有甚麼理由不殺？


  劇情也沒有出男主對這兩個小弟有恩情過


  難道是壽司老大因為想跟男主打一場所以下令的？


  那為啥不直接下令放男主進來


  難道壽司老大想跟傳奇殺手對決


  還要先派兩個小弟消耗他的體力？


  有沒有人可以解釋一下這段劇情呢？


  感謝


  --'
