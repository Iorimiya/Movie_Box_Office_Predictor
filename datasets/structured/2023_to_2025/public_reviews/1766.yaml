url: https://www.ptt.cc/bbs/movie/M.1681320246.A.827.html
title: '[新聞] 捍衛任務4反派史考特 艾金斯曾感嘆：'
content: '《捍衛任務4》反派史考特 艾金斯曾感嘆：「超級英雄電影讓動作明星死亡！」




  《捍衛任務4》劇照


  【文／戴西福福】


  史考特艾金斯（Scott Adkins）在賣座大片《捍衛任務4》演出高桌會幹部「奇拉」，在

  電影中他必須一直穿著肥大的西裝，靠特殊化妝變成肥胖的樣子，每天得花三個半小時化

  妝，花一個小時卸妝，雖然化妝過程令人疲憊，但是他在《捍衛任務4》中的武打場面還

  是很紮實到位。


  史考特艾金斯近日在採訪中，透露了飾演「奇拉」這位肥胖殺手的技巧，「我們想出一個

  方式，讓他打鬥風格像是重量級拳王麥克泰森（Mike Tyson），擺動和迂迴，非常有力的

  拳打腳踢。我們想讓他像公牛般大、重、有力的攻擊，不是瘋狂翻跟斗或空翻，因為這不

  符合《捍衛任務4》的風格。」




  《捍衛任務4》劇照


  至於特殊服裝，是否有影響他武打的方式？


  他表示：「不像想像中糟，我穿著可以移動。」


  由於必須進行特技表演，服裝設計師必須確保穿著放西裝也可以飛踢，但是服裝畢竟有重

  量，還是會讓他不那麼靈活，所以他和劇組只能調整他的武打風格，以確保更適合「奇拉

  」這個角色。


  「奇拉」在精彩的戰鬥場面開始之前，與基努李維（Keanu Reeves）、甄子丹和沙米爾安

  德森（Shamier Anderson）有長達10中的對話戲份，令觀眾印象深刻，對此他說：「這對

  我來說是最興奮的部分，這更多是關於表演，而不是戰鬥。我引導很多對話，我很感激導

  演查德史塔赫斯基（Chad Stahelski）相信我能成功。他在我身上看到很多導演出於某種

  原因看不到的東西，我很高興他給我機會，證明我不僅僅是一名武打演員，而是一個演員

  。」




  《捍衛任務4》劇照


  ，對此他說：「目前，動作片處於很好

  的位置。我們有特技協調員出身的導演，比如查德和J J 佩里（J.J. Perry）、大衛 雷

  奇（David Leitch）和山姆哈格雷夫（Sam Hargrave），他們可以按照專業方式拍攝動作

  。80 年代、90 年代的動作明星會捲土重來嗎？我不這麼認為。我們現在有可以訓練演員

  的地方，如果他們願意的話，你可以在他們受注目的地方訓練他們。話雖如此，當你看到

  像甄子丹這樣的人繼續拍下去，沒有比這更好的了，所以總有一個地方，我認為會有適合

  我的地方。」


  新聞網址：





  --'
