url: https://www.ptt.cc/bbs/movie/M.1679823975.A.7B5.html
title: '[  雷] 捍衛任務4 真的比3好看太多了(爽好雷)'
content: "保密防雷人人有責\n-\n-\n-\n-\n-\n-\n \n \n開頭基哥先用了騎兵模式幹掉長老的人\n我覺得「長老」應該是凌駕於高桌會的存在\n\
  首先第三集的老長老就有說殺了溫斯頓\n我就解除你的合約、恢復你的會籍\n這是在高桌會的人已經被基哥斃掉之後的事\n這集又帶出高桌會有12席\n如果不是凌駕之上的位置應該不能說一不二\n\
  斃掉新長老也呼應審查員說的話\n「殺神沒死，你和高桌會的人都要擔心他半夜殺進你家。」\n基哥連在沙漠飄的長老都找得到了\n還怕摸不到高桌會的人嗎？\n \n接下來是大阪的殺手酒店\n\
  不得不說很有賽博龐克的風格\n整個畫面未來感搭上日本傳統感真的讚\n有人說基哥鐵粉浩二為了基哥被抄家很沒道理\n但個人覺得浩二早就知道\n今天基哥人在不在這裡\n\
  大阪酒店都是要被抄定了才決定起兵\n從後面大鬍子嘴侯爵大阪大屠殺很沒意義就知道這次抄家是必然的了\n \n打戲方面比3的套招感少了不少\n雖然能看出基哥疲憊感\n\
  但打起來反而俐落很多\n且大阪的雜兵都是重甲部隊\n不可以打盔甲縫隙根本沒傷害\n子彈打不穿的鎧甲弓箭卻能一發釘頭有點怪\n \n中間的玻璃櫃地圖還以為要出現3那種因為有玻璃櫃不撞破很可惜的畫面\n\
  但出乎意料的幾乎沒撞上\n值得誇獎\n小兵也變得像遊戲一樣\n掃完一波又從地圖旁邊生一波出來\n最後菁英王出現打了個55波退場\n \n浩二跟明的打戲也很讚\n\
  明打個大塊頭撲上去從腳跟刺到肩膀這趴狠勁有到 浩二的收刀也超帥\n \n再來是賭桌局\n這邊張力其實很夠\n胖子的瘋感有出來，喜感也夠\n \n在打牌的時候\n\
  基哥先開出two pair\n有玩過的人都知道這其實是已經接近必贏的手牌了\n結果盲人開鐵支\n旁邊的愛狗人士開個同花大順\n當每個人都覺得自己必贏的時候\n\
  胖子開一個不可能出現的五張同點通殺\n接著基哥一個翻臉就是開殺\n \n這邊是我覺得少數不合理的地方\n那些舞池的人看到旁邊鎗斧都掏出來了\n就一個Wow的表情就繼續搖\n\
  胖子的武力值也不合理\n前面跟俗辣一樣\n要單挑馬上就不俗了\n幾拳就把基哥揍下樓躺在地板喘\n身體素質那麼猛卻只吃基哥幾拳又俗了\n白白虧掉前面的那股瘋感和自信感\n\
  \ \n然後是巴黎大戰\nDJ聲音性感但讓人煩躁\n而且大阪戰打得是防彈西裝跟重甲部隊這種不是血條長就是防超厚的精英怪\n侯爵怎麼會覺得路邊野雞團能成功打贏基哥\n\
  凱旋門的路人車子也很識相\n知道基哥是主角不敢撞\n那些會撞到基哥的一定是敵人\n每個撞上來的都是下車開一槍就吃子彈\n \n室內戰基哥拿到龍息彈之後\n搖身一變變成火系法師\n\
  加上運鏡變成上帝的俯視視角\n一整個變得很遊戲風格\n雖然不是新的拍攝手法\n但也讓前面對槍戰有疲憊感的觀眾有新感覺\n印象很深的是有個路人吃了三發的散彈\n\
  應該是系列裡面死最慘的了\n \n樓梯戰原本以為那些雜兵會讓路\n結果還是沈不住氣\n被人詬病的滾樓梯也是在這\n說實在真的是滾的有點遠了啦\n \n最後是對決畫面\n\
  和大部分人的想法一樣\n基哥前面兩槍是故意不朝要害打的\n最後講個暗號賭盲人聽得懂\n成功反殺侯爵\n \n整體來說劇情不仔細推敲不會有太多漏洞\n而且打戲真的很爽\n\
  而且基哥不知道是不是丟東西丟上癮了\n雙節棍丟 斧頭丟 槍沒子彈了解體分兩次丟\n個人覺得沒有3那麼嚴重的拖沓感\n是值得一看的\n讚\n----\nSent\
  \ from on my iPhone 12 mini\n \n--\n基哥跟大塊頭PK只有第三集被全面通緝的時候打路邊一組相撲殺手組合而已\n \n我知道是胖子出千\n\
  黑桃皇家大順就是最大的\n牌型和規則上根本不會有5張同點\n這邊胖子想表達的就是\n不管你怎樣勝卷在握\n這個場都是他說的算\n \n我們這廳也有人笑\n我其實不覺得滾很長不好\n\
  畢竟這腳就是要讓基哥回原點\n但是有幾段明明要停了很明顯是基哥硬滾的\n很好笑\n \n現實兵器裡面是真的有龍息彈的\n打起來威力比電影誇張很多\n是已經被國際法禁用的彈種之一\n\
  的確\n而且第三集打起來真的很有套招感\n你在意劇情的話就要補一下\n畢竟世界觀其實蠻迷人的\n個人很推薦補完\n但如果只是想看基哥殺人那就沒差\n3的套招感跟乏力感都比4還重\n\
  圖書館揍巨人跟武器店扔飛刀都像在玩"
