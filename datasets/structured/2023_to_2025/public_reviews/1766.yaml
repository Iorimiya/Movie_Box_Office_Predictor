url: https://www.ptt.cc/bbs/movie/M.1679819949.A.AFC.html
title: '[爆爽好雷] 《捍衛任務4》眼裡只有真田廣之'
content: '捍衛任務系列是為打鬥槍戰而生的電影

  所有劇情瑕疵、邏輯不通都不用理會。


  基哥的帥我想不用多說，儘管感覺武打動作

  變慢了、永遠一號演技，但帥就完事了。



  但最重要的是真田廣之啊啊阿啊啊

  收刀動作有夠帥，每部有真田廣之的戲

  我都超期待他的收刀動作，雖然每部他的

  戲路就差不多這樣，但我超愛！！





  其他的龍息彈（根本CSO龍炮）、愛護狗狗

  、凱旋門車槍戰、美國洪金寶（導演致敬

  殺破狼）都是亮點。




  最後真的推中港新光LUXE廳的音效，開頭練

  拳打木板的環繞聲、基哥被摔地板的臨場感

  真的都調校的很棒，極推選擇音效好的廳觀

  賞。


  -----

  Sent from JPTT on my Xiaomi 21091116UG.


  --


  武士三人組



  二刷要去日新至尊廳了



  丹哥就...拿槍的葉師傅呀XDD

  丹哥真的也很棒，盲人殺手演繹的很好




  也想領養爆蛋狗狗



  畢竟是為了致敬殺破狼



  侯爵本體是時裝秀，穿著都很有品味'
