url: https://www.ptt.cc/bbs/movie/M.1679840823.A.6B5.html
title: 'Re: [好雷] 捍衛任務4 看得很開心 但還是想吐槽..'
content: '整部覺得劇組非常用心


  完全改善了基哥年邁武打動作不夠俐落的問題

  用更多特別場景跟運鏡來取代過多的近身格鬥

  增加趣味也維持緊湊度跟新鮮感


  跳下樓跟從樓梯翻滾兩段的惡趣味更是神來之筆


  但我唯一想吐槽的點就是甄子丹的設定


  盲人我覺得OK，不debuff ㄧ下丹哥的威力

  兩個人對打基哥應該只會被秒殺


  最開始出手用電鈴還算有趣

  那時我只心想那身上要帶多少電鈴


  結果後來根本和正常人ㄧ樣打得又準又快每槍必殺了

  這點就讓人覺得設計他為盲人實在有點多餘了

  身手還比明眼人強更多還完全沒用特殊道具

  因為事實上兩個人交手的橋段真的很少

  讓他是個正常人完全影響不了劇情發展啊


  --'
