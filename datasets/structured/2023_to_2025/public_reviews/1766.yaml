title: '[好雷] 捍衛任務4-基哥無雙'
content: "雷文防雷資訊頁\n\n\n想看基哥大殺四方就去看。\n以下部分劇情雷，慎入。\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\n\
  劇情大綱:基哥的基友陸續被肅清，反而讓基哥疊加更多怒氣值，\n         最後用真。規則殺把自己和對方一起帶走了。\n\n整體從頭開始就是為了完成主線(讓自己從高桌會的制約中解脫)，\n\
  不斷完成支線任務(A場景殺15~20分鐘，劇情推進一小段然後換B場景繼續殺)的循環，\n武打動作看得出基哥真的很吃力，已屆齡60的人來說體力真好，\n爽快度是有的，但是不免殺到中間會有點視覺&聽覺疲乏，\n\
  尤其針對每個小兵都確實補刀(槍)斃命的小細節，備感欣慰。\n\n幾個嘈點吐一下:\n一、真田廣之對決丹哥，明顯丹哥都不願下殺手，\n    要父女倆退出這趟渾水就放過你們了，何必又去送頭呢?\n\
  \n二、基哥上一集被放逐，這集為了利用規則去挑戰BOSS，又去加入家族，\n    是說你們這麼古老又講究規則的組織，這種BUG沒有立規範禁止進進出出的嗎?\n\
  \n三、追蹤者你老兄怎會認為BOSS那種7788的人會乖乖付錢給你，而不是跟你秋後算帳?\n\n四、終局的性命決鬥，主持方或雙方不安排個醫護小組在旁隨時待命，\n\
  \    輸的死了是應該，贏的卻也重傷掛了實在有點問號。\n\n補充五、基哥乃真心愛狗人士，要不是那條狗，追蹤者早掛了。\n\n題外話:\n進入階梯場景前的支線室內那段，槍戰畫面用俯角的運鏡去帶真的看起來相當的舒適。\n\
  \n\n\n\n\n\n\n\n\n\n\n--"
