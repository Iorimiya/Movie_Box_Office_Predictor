url: https://www.ptt.cc/bbs/movie/M.1680252375.A.083.html
title: '[討論] 捍衛任務4 海報'
content: '剛剛下午場跟朋友去看捍衛任務

  這周開始有送海報




  我看服務員是從兩個地方各拿一張

  不是一疊隨機出的

  但不確定規定是不是複數就拿均等的量

  奇數票也是平均拿，一種多一張


  本來聽說車庫送的東西品質可能不太好

  但至少這次的比較厚也比較硬

  算值得收藏



  而我朋友對非動畫的特典沒興趣

  所以兩張都讓我帶回家貼


  右邊那張的細節




  今天開始有去看得別忘了跟售票員索取





  話說我一直以為肯恩是鄭肯演的

  取名還特別留下"肯"字

  想說他戲路真廣，除了搞笑諧星

  武打片也能勝任

  而且動作都算流暢


  結果根本不是他XD



  --'
