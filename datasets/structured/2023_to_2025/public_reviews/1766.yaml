title: '[新聞] 捍衛任務4揭露副標題'
content: "原文標題: John Wick 4 Title Reportedly Revealed On Crew Wrap Gift\n原文連結: \n\
  報導引用原文:\n\n\n據外電(screenrant)報導，基哥領銜主演的捍衛任務第四集副標題\n已經在致贈給劇組人員的殺青派對禮物中透露。\n\n\n\n\
  「Hagakure」是客家話的「八家將」(大誤)\n\n《葉隱》（はがくれ=Ha-ga-ku-re）是日本武士道的經典，亦作《葉隱聞書》，\n因其成書的方式而又被稱作《葉隱論語》。\n\
  \n葉隱指的是「在君主看不到的地方也要盡忠」。\n\n此書由江戶時代佐賀藩的山本常朝、田代陣基根據其自身經歷以及當時聽人聞說所編纂\n，於1716年完成。成書的原因是山本常朝對當時武士道精神的萎靡不振有所不滿，進而\n\
  透過故事與例子闡述武士的精神與其當時現象的反差。\n\n主要內容講述武士忠君事蹟，核心即是提倡武士要為忠義之舉而毫不猶豫的奉獻生命，\n絕不偷生。\n\n《葉隱》（はがくれ）維基百科\n\
  \n\n老實說，這則新聞看似說了很多，但其實甚麼也沒說。\n\n但是，只要有基哥，就有光；不相信？看看基哥10月底在捍衛任務4外景拍攝現場\n幫忙劇組搬器材的影片吧(路人側拍)\n\
  \n\n或是2019年3月份基哥搭飛機遇到故障，跟整團路人一起擠小巴的暖心故事:\n文章代碼(AID): \n(movie) [ptt.cc] [新聞] 基努李維又親民了-2019年3月版\n\
  \n\n2014 Oct John Wick\n2017 Feb John Wick Chapter 2 殺神回歸\n2019 May John Wick Chapter\
  \ 3 -Parabellum 全面開戰\n                             (Parabellum拉丁文: 準備開戰=Prepare\
  \ for war)\n\n2021 Dec The Matrix Resurrections 捍衛任務之救世主復活(誤)\n\n2022 May John Wick\
  \ Chapter 4 -Hagakure(日文: 葉隱, 古時日本武士道著作)\n\n基哥一生推～\n\n\n--"
