url: https://www.ptt.cc/bbs/movie/M.1636302948.A.8C2.html
title: '[新聞]  甄子丹捍衛任務4戲分殺青 感謝基努李維'
content: '甄子丹「捍衛任務4」戲分殺青 感謝基努李維溫暖相待




  基努李維（左）與甄子丹合作拍片建立友情。圖／摘自IG


  2021-11-07 21:26聯合報 記者蘇詠智／即時報導


  甄子丹主演的動作片「怒火」還在台灣上映中，人已經在歐洲拍「捍衛任務4」拍了快4個

  多月，他的戲分近日終於殺青，他也在社群網站上發布短片，只見離開劇組返家前他和男

  主角基努李維、導演查德史塔赫斯基等都擁抱、道別，直呼這是他拍好萊塢電影最有樂趣

  的經驗之一。


  在「捍衛任務4」中，甄子丹扮演基努李維的老友，可能會是片中的堅強盟友，彼此之間

  應有不少對手戲，也各自有多場打戲。


  甄子丹為此從7月就飛去柏林報到，接著隨劇組轉赴巴黎，在拍片空檔也藉機遊歷兩大名

  城，發了好幾波照片在社群網站上。


  他提到拍電影不是件簡單的工作，尤其為了該片離家4個月，終於能夠收工返家，首先就

  要感謝基努和查德的溫暖相待，讓這段拍片的旅程充滿樂趣，而他們都是很謙虛、很尊重

  人也很有熱情的電影工作者，只想拍出最好的作品，他相信這一集會非常獨特，對他而言

  更多收穫是交了這些朋友。




  基努李維（右）和甄子丹擁抱道別。圖／摘自IG




  甄子丹趁「捍衛任務4」拍片空檔遊巴黎。圖／摘自IG




  甄子丹加入「捍衛任務4」，在歐洲拍了快4個月的戲後殺青。圖／摘自IG


  新聞網址：


  --'
