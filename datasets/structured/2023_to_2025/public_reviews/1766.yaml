url: https://www.ptt.cc/bbs/movie/M.1679678286.A.623.html
title: '[好雷] 超爽的捍衛任務4 (內有細節)'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  我只能說真的純粹爽片值得一看


  不要太在乎邏輯，享受最純粹的混戰與獵殺


  這幾天看的應該有拿到海報



  還有強烈建議看Imax，那個效果實在太讚

  全篇的運境、視角我非常喜歡!!!





  不想被雷的，現在就麻煩離開了，感恩!!









  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~








  以下大概細節說明


















  要離開的還可以把握!


















  片頭一開始在John用拳頭打樁訓練開始


  包厘幫之王進來放火，點起了反叛的怒火


  標誌著和高桌會的全面對抗開始


  這時候也拿到一件特製西裝





  畫面一轉來到沙漠


  在沙漠中的狂奔，John以騎兵模式解決了3個人


  並且來到長老這裡要回戒指，但長老說已經不在


  就算殺了他也沒辦法改變什麼，John一槍給了長老痛快






  接著來到紐約，狂人葛雷蒙侯爵現身，個人認為比爾·史柯斯嘉演的非常好


  把自大、瘋狂、危險、對人命不屑一顧的所有特質顯露的非常到位...


  沙隆接待員看到幾位高桌會的使者，也不禁震驚了一下



  接著畫面來到侯爵在看的到大陸飯店的某棟大樓裡召見沙隆和溫斯頓


  說他取得12個高桌會所有成員的同意，也開始調動資源


  要抹殺掉John Wick，



  而紐約則是亂七八糟，要加以整頓




  另一方面紐約大陸飯店曾在第三集幫助John，結尾時的開槍未殺死John


  因而被認定維反高桌會的命令，因此要被處理掉



  沙隆冒險發言認為都有照規則來，只是結果並非如其所料


  若照高桌會的規則，他們不應受罰，應有第二次的機會


  侯爵只說了第二次是弱者(這裡我有點忘了)，突然開槍打死沙隆...


  溫斯頓只能抱著沙隆無言.....讓活著的人蒙羞....



  (這裡的順序可能不對，有點忘了)

  接著侯爵在另外一處找來肯恩(甄子丹)，在整片中不時以女兒如何作無威脅


  要他去殺John，大概在殺手世界裡，他們倆是最頂尖的...







  畫面來到大阪的大陸飯店


  島津浩司(真田廣之)正在巡視飯店，這時候出現了一個本片新人物追蹤者


  帶著一隻狗想入住，接代員島津明(澤山璃奈，劇中為島津之女)

  確認一下後同意該員的入住，只是要狗不能亂跑



  接下來有父親和女兒的互動，很不錯


  這裡也談到紐約大陸飯店的問題，明很清處John和父親的交情


  但認為他會帶來周遭的死亡....，極力反對庇護他




  島津到頂樓時支開附近的人，和John見面，有談到殺長老鑄下大錯


  但看的出來是極力維護他，這時候在一樓，侯爵的人馬(高桌會)到了


  有強烈証據顯示對失格的人員提供服務


  明暗中要人員徹離，自己上頂樓找父親


  確沒想到John居然在這裡....，質問父親後島津只說我和John的交情非常深厚


  很簡單的講一下後自己先下樓，要john先離開，但能殺多少就殺多少


  去見高桌會成員的路上要底下的人準備好


  談判時面對侯爵的人馬也不退縮，可以搜索但要解除武裝




  侯爵的人直接將大陸飯店解除武裝，血戰開始


  弓箭、日本刀、槍等各種武器開始用上



  在頂樓John也開始獵殺，明也展露戰鬥裝扮開始共同對抗高桌會


  一陣激戰過後擊退第一波，開始下樓時爆發第二波戰鬥



  高桌會支援的人馬類似於第三集中重裝甲兵，但手槍支還是可以應付


  也是非常驚險，明在這邊受了一點傷，而肯恩這時正在廚房這吃東西


  被唸說認真點....，在這裡也展示了個人能力，用設備聽音辨位


  反殺大阪大陸飯店好幾個人



  這邊整體的戰鬥和第三集的飯店戰鬥類似、玻璃的元素相當多，但看了也很爽


  John對好幾個高桌會的重甲兵零距離射擊



  接著就和肯恩開打了起來，最後追蹤者的介入下戰鬥不了了之



  這時候島津和明也都有傷，撤離的時候遇到了肯恩



  其實肯恩沒想殺他，但島津主動挑戰，最後也被肯恩殺死


  明準備要拼死一戰，但被肯恩阻止，說珍惜生命，之後再來...




  明逃到了列車上又遇到了John，要他殺死殺他父親的兇手


  並說他沒有做到的話就由他來做 (這裡我認為同時是指高桌會和肯恩)





  畫面來到侯爵這，對於追蹤者能掌握行蹤感到很有趣


  找他來談談，卻被愚弄了一下，侯爵直接刀叉在追蹤者的手上


  並說他只有2條路可以走....



  接下來有點忘記，有一小段戰鬥，總之在這有殺掉侯爵軍團的高層，


  取得一個家徽作為線索





  畫面在回到接待員沙隆的墓，談了一下，用線索確認侯爵到底是誰



  溫斯頓則提到了規則的問題，古老的終極規則，


  可以在同是高桌會身份的前提下一對一單挑


  (這裡能看高桌會成員對於殺人這件事情號不在乎........)



  John的家族有這個資格，可以發起單挑，但首先John必須先回復到高桌會家族成員





  接著John成功回去看起來像東正教(實施上應該是天主教)的教堂，要見叔叔


  (會這樣說是因為John家族在設定上應是俄羅斯/斯拉夫)


  但卻被家族成員的卡蒂亞下令抓起來審問，並說明現在的狀況，殺長老這事鬧太大....


  想要回復身份就要先殺掉殺叔叔的仇人(忘記名子，先姑且稱鋼牙)



  在家族人引路的幫忙下來到賭場，殺父仇人也在眼前，但追蹤者、肯恩也一同現身


  提議玩牌，情勢詭譎，就在千均一髮之際狗先攻擊鋼牙的人馬



  一路混戰開始，追蹤者和肯恩的目標只是John，不準其他人殺他


  所以某種程度上也變成友軍，多少協助解決一些嘍囉


  Joh用撲克牌割傷了大鋼牙



  這裡的戰鬥也很精彩，雙截棍打起來超爽!!



  John也和大鋼牙打鬥，過成中也用刀叉到鋼牙的屁股、腿等，不過被他摔到幾層樓下



  起身要反擊時又解決嘍囉，追蹤者也刻意協助(目前是因為錢還不夠多)



  和大鋼牙對決時用了片頭鍛鍊的拳頭，幾乎可說是活活打死他


  拔下一小顆鋼牙做為證據，回到在柏林的家族並通過烙印，


  取回高桌會家族成員群的資格







  至此，John委託溫斯頓轉交決鬥挑戰書


  將依據古老規則決鬥，一開始侯爵認為根本沒資格談


  但溫斯頓告知侯爵John已恢復身份，在規則下你必須要接受



  決鬥的條件是John獲勝，將取得完全自由，


  不再需要聽從/服侍高桌會(這裡應該包含標記)


  而做為助手的溫斯頓則要求重新恢復紐約大陸飯店及經理的身份


  侯爵提醒溫斯頓如果John輸了你也得死





  接著就是雙方實際見面談決鬥條件


  用槍、聖心殿、清晨決鬥


  侯爵並威脅肯恩替代他與John決鬥.......






  畫面來到了巴黎的下水道


  包厘幫之王已經開始在這裡拓展勢力


  The King!!!!



  給了John一件西裝，並說男人最體面的時候，不是結婚，就是死亡



  出發的路徒上在小挺上也講了沙隆的墓誌銘-好友，以及John自己的lovely husband




  一路來到最近的下水道出口，很快的John出現在凱旋門


  通風報信的、想殺John發財的、侯爵高桌會成員都開始出現





  巴黎大亂鬥展開，這裡真的太精彩



  把街頭混戰的危險完美的表達，有不少嘍囉被撞倒、撞飛


  當然John自己也有被撞就是...，這邊John邊開車邊開槍的動作實在太讚!!!


  追蹤者亦敵亦友.....，想攻擊時被肯恩阻止，說John是他的...





  眼看一堆人失敗，侯爵把賞金加碼.....


  而JOHN進入室內建築


  展開我認為是本片最爽的一個橋段



  以上帝視角/一般視角呈現室內的槍戰



  這一段非常精彩，John也使用了威力非常強大的龍息彈


  這裡已經是在轟人了，這一段真的看的超爽!!!!




  就這樣一路殺出血路


  這時追蹤者認為有機可趁，也開始攻擊John，雙方也扭打



  狗則是去攻擊其他嘍囉，兩人扭打過程，John取得上風


  但看到侯爵軍團高階成員要射擊狗時，John搶先開槍打死高階軍團成員


  這時追蹤者大概已放棄殺John的唸頭



  最後John撞破玻璃從三樓掉到一樓，來到聖心殿的最後階梯


  又展開一場血戰，這時追蹤者也不時暗助John，並和侯爵敲竹槓要4000萬!!!



  John殺出一條血路後即將抵達，確被一腳踢下去，一路滾到最底層



  (個人認為只有這裡太扯，真的是致敬無敵風火輪)



  就在此時和肯恩會合，兩人一路殺上去，加上追蹤者幫忙


  侯爵的首席侍從分別和肯恩、John、狗等激鬥


  他的狗使出了要害攻擊，John也了結了這傢伙



  終於準時抵達決鬥場，這邊的畫面非常美，晨曦的巴黎美到忘我阿...


  宣達依照古律法進行決鬥，條件等後決鬥開始


  槍一次只能裝一顆子彈


  從30步、20步距離進行，雙方都沒打中要害(我認為是雙方都不想殺彼此)


  最後來到10步的距離，肯恩擊中了John，John側躺著掙扎



  此時侯爵認為決鬥勝出，可以擔保他女兒的安全，但他要親自徹底解決John，


  從肯恩手上拿到槍，要裝填子彈時溫斯頓罵了他是傲慢的蠢蛋，John剛才還沒開槍



  這時候John一槍斃了葛雷蒙侯爵，完全重獲自由，溫斯頓的要求也同意執行


  肯恩的女兒也獲得平安保證


  John要求溫斯頓帶他回家


  John沒走幾步就倒了下去..............



  最後畫面來到溫斯頓和包厘幫之王來到John的墓前，溫斯頓提到son.....



  這邊就結束了







  最後的彩蛋是島津明找上了肯恩


  而肯恩正拿著一束花朝女兒走過去......







  --'
