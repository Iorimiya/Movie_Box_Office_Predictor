url: https://www.ptt.cc/bbs/movie/M.1679917010.A.D5F.html
title: 'Re: [大負雷] 捍衛任務4 找不到稱讚的點'
content: '幫你補血

  我也是真的看不懂好看在哪































  防雷----------------









  結尾以為主角要復活

  接演康斯坦丁續集之類



  首先武打見仁見智

  我是覺得看到後來很麻痺

  都是普通小怪等級

  為了錢一直送頭 一直送頭 一直送頭



  第二個無法接受的是

  去日本那段

  太爛太自私了

  找最好的朋友是庇護？還是？

  還害好友掛掉

  另外

  這段射弓箭當然可以

  但對手都要大開殺戒了

  防守端至少要萬箭齊發去擊殺對手

  或是有鷹眼水準吧




  最後

  鋪陳了三集的龐大組織

  結果靠幹掉一個小屁孩侯爵翻轉

  與其說侯爵是被基哥幹掉

  不如說是被自己人玩死


  補充一下

  我整場都在擔心狗會死在槍口下

  沒想到大家都很愛護動物

  徒手跟狗狗對決



  當然很多人說不用管劇情邏輯

  就是覺得武打也很普通

  才順便吐槽劇情



  請鞭小力一點





  --

  原來還是有人在看劇情

  感覺組織黑手也是想侯爵掛掉啊

  所以跟一個高層公子哥單挑就可以洗刷一切殺戮仇恨，果真是難以理解的古老規則

  我無法忽略政斜的陰影'
