url: https://www.ptt.cc/bbs/movie/M.1679914761.A.5E5.html
title: '[好雷] 捍衛任務4'
content: '昨天在Netflix把3看完

  早上一到公司突然很想看4就立刻下午請假去看XD

  先說結論 真的很好看 也感人



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~










  這系列暴力場景真的很爽

  這次用車在那邊嚕來嚕去

  還有噴火的槍

  大阪分部還有用弓箭感覺也很猛

  中間有一段還把視角調到正上方

  感覺很不錯


  甄子丹的盲劍客概念也很棒

  用感應器測敵人走過

  但我覺得瞎子還這麼強有點玄幻了XD


  另外John跟甄子丹還有大阪酒店老闆也很感人

  都是為了家人才在殺人這條路上回不了頭

  彼此之間還有殺手這行少有的兄弟情

  甄子丹殺了大阪酒店老闆的時候還叫他女兒不要動手

  看了真的很感人 那一刻他應該是想到自己女兒了吧


  不免俗的這部戲還是狗的主場

  John為了救狗射侯爵手下那邊讓我會心一笑

  無名者救了John的時候也說誰叫他要射我的狗

  真的很喜歡這種劇情XD


  但我有個地方不是很懂

  溫斯頓後面的時候都叫John 強納森

  沒印象前面有這樣叫過他?

  另外在墓碑前面也說致吾兒

  該不會John是溫斯頓的兒子吧XD


  最後面彩蛋還有大阪酒店女兒要刺甄子丹的彩蛋

  該不會5以後換人當主角吧XD

  真心希望John是假死脫去殺手身分安穩的回憶老婆XD


  --'
