title: '[討論] 捍衛任務4結局版本二選一(有雷)'
content: '以下有雷，慎入


  上禮拜終於抽出時間去看捍衛任務4

  作為一個持續追捍衛任務系列的鐵粉

  如果這部不能在院線看我一定會很遺憾


  話說回來，最後的結局是Winston和Bowery King在John的墓碑前跟他道別

  John到底有沒有死也是眾說紛紜

  有人說他是真的死了因為重傷

  但也有人說John沒死 死的是作為殺手的他

  先不討論哪個版本為真，如果硬要選一個的話我會想要選第2個

  第1個讓劇情結束在這邊也很不錯，算是給系列化下一個不錯的Ending

  但私心還是會希望是第2個，很希望還有續集可以看


  不過導演和基哥在之後的採訪也都沒有明確的說明

  想知道各位比較prefer哪一種版本啊？

  是John真死的版本還是假死的版本呢？


  --

  在我觀察他之前..

  好像不錯耶

  笑死XD'
