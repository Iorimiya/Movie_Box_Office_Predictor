url: https://www.ptt.cc/bbs/movie/M.1677727490.A.615.html
title: '[新聞] 甄子丹:捍衛任務4原本仍有對亞裔刻板印象'
content: '新聞網址：


  原標題:



  Yahoo奇摩電影戲劇編輯部

  2023年03月02日



  【文／血紅蘭姆】亞洲動作巨星甄子丹透露，《捍衛任務4》原本仍對亞裔角色抱有既定

  的刻板印象，是在自己建議之下才有所改進。



  雖然是從香港影壇起家，但甄子丹對好萊塢可一點都不陌生，因為他在2000年代初期便曾

  先後為《超時空聖戰》、《刀鋒戰士2》擔任武術指導，同時也以演員身份在片中登場亮

  相，還曾現身於《皇家威龍》。



  更別提在《星際大戰外傳：俠盜一號》中，甄子丹還飾演了一名盲眼戰士席魯英韋，不惜

  為大義而拋頭顱灑熱血，隨後更在《限制級戰警：重返極限》中和馮迪索同場飆戲，在迪

  士尼大片《花木蘭》中也可以見到他的身影。



  甄子丹此番將於《捍衛任務4》中和基努李維交手過招，但他向GQ解釋道，好萊塢仍然對

  亞裔角色存有刻板印象，即便是《星際大戰外傳：俠盜一號》中的盲眼戰士一角也不例外

  。



  「我點出這個角色是出自一種刻板印象，典型的大師角色，從來不笑。」甄子丹於是建議

  讓席魯英韋一角改為盲眼，也為他注入了幽默感，甚至在拍攝現場上即興搞笑，才讓這個

  刻板印象就此搖身一變為全片的靈魂人物。



  到了《捍衛任務4》，





  「

  這是一部《捍衛任務》電影，每個人都應該既酷又很時髦。為什麼這個角色不能既酷

  又時髦呢？」



  在甄子丹據理力爭之下，導演查德史塔赫斯基終於決定修改這個角色的名字和戲服造型。

  甄子丹透露，凱恩一角經過修改之後的片中造型，有部份則是在向自己的偶像李小龍致敬

  。



  但甄子丹也強調，這不是在針對《捍衛任務4》，而是好萊塢長年以來始終根深柢固的現

  象。「《捍衛任務4》的拍攝經驗相當尊重人。整體而言，我拍起這部電影來十分盡興。

  」《捍衛任務4》將於2023年3月22日在台上映。





  --'
