title: '[爽雷]  捍衛任務4:爽度破表，美不勝收'
content: '各位，捍衛任務4實在太好看了



  以後我們不需要漫威宇宙那些垃圾東西了，我只想要John Wick Universe, 簡稱JWU



  不過還是先把缺點講一講好了，首先基哥的演技仍然沒有進步，雖然他只要帥就完事了，

  但還是抱怨一下



  還有基哥的打戲，感覺有點力不從心，套招感有點重，這點跟第三集一樣，相比起來其他

  角色的近身打戲更好看，基哥還是拿槍的時候最帥



  看片尾似乎之後要拍明子還有肯恩的電影，但問題是那個女的打戲套招感也是一樣重啊，

  要是未來真的拍以她為主角的電影，我很懷疑能否拍好看，甄子丹倒是不用擔心



  再來就是大家都吐槽的盲人殺手這個設計，如此設計的目的不用多說，就是為了一個帥字

  。寫實黑暗的夜魔俠影集大家都能接受了，在這個迷幻的殺手宇宙有盲人殺手應該一點都

  不覺得奇怪才對。



  我認為問題主要還是他出場第一段那個放逼逼扣的戲，完全就是畫蛇添足，因為就只有一

  開始這裡有顯現出他是盲人需要這東西，但之後完全就不需要了，這實在有點搞笑，如果

  沒這一幕戲，大家就當他是夜魔俠了，根本不會有人在乎。



  最後雖然沒有人在乎，還是稍微吐槽一下劇情部分好了。第一，上一集千辛萬苦跋山涉水

  ，註銷了家族成員又用了一個標記，才來到沙漠見到一次高桌會的人，這一集一個轉場就

  找到了，這丐幫幫主原來這麼大尾？



  第二，決鬥這回事溫斯頓你上一集怎麼不早講啦，害基哥白白又多了兩個烙印……很明顯

  這是後來才追加的設定



  老實說我感覺三四這兩集，很多世界觀設定都超級衝突，高桌會在第三集像神明一樣無所

  不知，到了這一集又感覺沒什麼用，侯爵號稱擁有高桌會的全部資源跟權力，結果除了升

  賞金之外也沒啥用，找人還得求助那個帶狗的自由業，上一集那個連醫生都要求約翰開他

  一槍才能避嫌的高桌會去哪了？走到哪都是殺手，沒有庇護就根本活不過明天的殺手社會

  去哪了？約翰被路人到處追殺的情況只出現在最後面，在這之前他都沒事人一樣到處跑是

  怎樣，只有巴黎跟紐約路上都是殺手嗎？



  我現在馬上能想到的劇情問題也就這樣，當然肯定漏掉很多，但是老實說我也不在乎，沒

  人在乎，大家只在乎爽不爽，而對此我只能說，真他媽爽爆了



  這集的槍戰武打都維持著一樣但某些地方又更上一層樓的水準，跟上一集一樣有許多特殊

  的環境戰鬥，更多元的武器，還加入許多防彈手段的對抗戲碼，這一集有很多人穿防彈西

  裝，甚至配上防彈面具防止被爆頭，為此也很合理的有人搞出噴火的散彈槍對抗防彈西裝

  ，這些細節都讓武打變得更刺激，畫面更有看頭



  在這之上這一集的攝影也更上一層樓，許多鏡頭不只打鬥精彩，畫面構圖也很美，同時也

  有更多元但不變的是仍然很清晰的視角剪接，譬如說廢棄房屋那段打鬥，像是電玩一樣，

  還有最後決鬥的場景，在美麗的日出還有教堂前對決，真的太美了



  這部片完全就是視覺的極致享受，相比之下那些只知道堆CGI的電影，什麼動畫螞蟻動畫

  巨嬰動畫外星人的，全部加起來都不夠打



  除此之外，這一集我認為相比第三集最進步的地方還是他的節奏感，每一段打戲以及每一

  種類型的打戲，其時長都經過很仔細的編排，每一幕甚至同一幕內都在對的時間點切換到

  不同的武器跟打鬥風格，不同的場景或者不同的運鏡方式，並且適當的安插不是打戲的文

  戲橋段，讓觀眾不會出現審美疲勞




  這點真的很厲害，我不知道他們是怎麼辦到的，沒有把電影反覆看個N遍不斷拉進度條，

  也沒辦法去分析其中的原理，但是很明顯的可以感受到，他們的編排上了一個檔次。第二

  集跟第三集都有不只一個橋段，是很明顯會讓人產生審美疲勞，只想要快進到下一段的槍

  戰或者打戲，但是在這集，我真的完全沒感覺到有任何一段是過度冗長的，真的很神奇



  這也是為什麼許多人都反應完全不覺得這部片有三個小時，導演對節奏的把握可以說是爐

  火純青。



  最後我還是要誇獎一下劇情我認為好的部分，對白寫得很有趣，裡面每個人都喜歡引經據

  典，話都不多，總是說重點。幾個主要角色也很認真去塑造，並不是說他們是多麼深刻的

  角色，但都至少是有型的，有自己的目的，行為準則跟價值觀，並且不需要透過長篇大論

  來表達，而是用行為去定義角色，這是我很喜歡的一點



  雖然結局約翰死了有一點可惜，不過這也意味著這個世界觀未來充滿著各種可能性，我是

  真的希望JWU可以繼續拍下去，就算不找在這些作品裡出現過的人物，拍沒出現過但同世

  界觀的角色也絕對OK，只要他的武打跟攝影能維持這個水準，這個JWU的潛力絕對不輸現

  在的MCU跟DCEU這兩坨巨型CGI答辯



  如今整個Holly Woke已經沒有多少系列作品，還願意如此認真的專注在娛樂觀眾，又做的

  如此之好，真要數的話也就只有捍衛任務跟不可能的任務系列。



  我衷心期盼這些優秀的創作者，這些優秀的系列，能夠繼續壯大，能夠出淤泥而不染，帶

  領我們走出無恥的覺醒大公司搶著端出狗屎，還逼你喊真香的黑暗時代



  最後請大家留言說一說你最喜歡的一句台詞，我最喜歡的一句是John Wick想要的墓誌銘

  ：


  A loving husband.


  --

  原來割彈頭還有這種功用

  Yeah.

  最好笑的是基哥還幫腔ww這電影世界觀每個人都講不知道多少種語言

  這系列本來就是來看殺人的，手法有變運鏡方式有變，就不會膩，同樣很長的打戲第三集

  打日本人迷弟那整段就很拖

  誰說電影的劇情就一定要合邏輯


  要我說現在好萊塢主流大片那些狂堆CGI，沒有實景拍攝沒有真實的構圖運鏡，沒有不摻C

  GI的人物表情特寫，連演員肌肉都不肯練的破東西，他們更不配被稱為電影

  去看第一集'
