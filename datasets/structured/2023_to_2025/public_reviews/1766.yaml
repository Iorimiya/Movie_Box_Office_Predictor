url: https://www.ptt.cc/bbs/movie/M.1679476862.A.020.html
title: '[普好雷]  殺手遲暮《捍衛任務4》'
content: '殺手遲暮《捍衛任務4》／《John Wick: Chapter 4》


  圖文好讀版：


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  在第四集中，仍然能看到最受歡迎的元素，大量的子彈揮灑，炫酷的打鬥場面，偶有停頓

  的套招感與可愛的狗狗，對，這仍舊是一部動物保護片。


  但長達近三個小時的片長，基哥與甄子丹兩種不同風格的對映，突然令我有種John Wick

  的美好正在流失的感受。


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  【甄子丹起到有趣的化學反應】


  老實說當初甄子丹的加入，令我擔憂這會讓整部作品蒙上濃厚的武術色彩，捍衛任務確實

  以動作戲為一大賣點，但相較於武術，捍衛任務在我看來更像是真實的暴力，如何殺人，

  如何讓人癱瘓，如何讓對手昏厥，這樣直接赤裸的魅力與甄子丹過去在螢光幕前展示的「

  武術」有很大的不同。


  俐落與笨拙交錯的動作與幽默的性格和那種決意的態度，都讓這個角色即便是初次登場，

  都有了非常強大的魅力，當然真田廣之同樣吸人眼球，兩人的對峙也令人屏息，從結果來

  看，這部片不僅沒有屈就了甄子丹的武術底子，反而用另一種更有創意性的方式發揮了出

  來，尤其是那個門鈴，拜託夜魔俠學學好嗎，有夠天才。



  【一隻狗，兩隻狗，我們需要更多的狗】


  可愛的狗狗也一直是《捍衛任務》系列受歡迎的原因之一，而這次電影狗狗們的戲份比我

  們想的還要多，作用也更加突出，有媒體報導這次的作品總共動用了五隻狗狗出演，大多

  是德國狼犬，並花了大量的時間進行訓練與陪伴，讓整個劇組都產生了愛狗氛圍。


  在電影中，狗狗們的作用也是十分顯著，無論是任務的執行、陪伴、令人吐槽或裝可愛，

  這些狗狗都讓人難以轉移目光，動物保護片的定位難以動搖，John Wick會用子彈證明給

  你看。



  【殺神遲暮】


  從紐約殺到摩洛哥，從大阪飛到法國，我們見證了John Wick連續四集的打打殺殺，也從

  中獲得了巨大的樂趣，但這次的作品，從中能感受到的不僅是槍林彈雨，不再是爽快的打

  擊，我們能看到的是John逐漸的疲憊，卻又不願放棄的意志力，這恰恰也呼應了《捍衛任

  務》系列一直以來對John的評價，強大的專注力。


  但在這麼長時間的掙扎後，John身上除了那傳奇性的色彩外，還瀰漫著濃厚的孤寂與疲憊

  。


  他就像是瘟疫，渲染著每個體制下的個體試圖做出反抗，但除了他自己外幾乎無一倖免，

  殺神還是瘟神，在不同的角度看來，John Wick能代表不同的意義，我們仍然能享受打擊

  的快感，更別說這次John還面臨了更多的挑戰，像是耍著看起來實在不怎麼俐落的雙截棍

  ，以及練習日語和粵語，還有樓梯，我保證這部電影有夠多的樓梯。


  在結局方面，電影給了一個我個人很喜歡，也認為應該如此的結局。殺神終究是人，神只

  是他傳奇性色彩的代稱，至少在他還是人的時候，能獲得應有的自由跟平靜，還有狗狗們

  的愛。



  片尾留了些懸念，我不敢保證還會不會有《捍衛任務5》或是《捍衛任務：外傳》之類的

  ，如果有，那拜託別再打擾基哥了，這麼長的打打殺殺，也該讓神休息一下了。


  --'
