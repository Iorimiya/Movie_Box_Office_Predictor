url: https://www.ptt.cc/bbs/movie/M.1678982798.A.537.html
title: '[新聞] 捍衛任務4導演：拍攝現場不該續用真槍'
content: '《捍衛任務4》導演：拍攝現場不該繼續用真槍


  2023年3月16日 週四 上午10:08




  《捍衛任務2：殺神回歸》（圖：Lionsgate）


  【文／血紅蘭姆】《捍衛任務4》導演查德史塔赫斯基直言，真槍不該再出現在拍攝現場

  上了。


  2021年在《Rust》拍攝現場上，亞歷克鮑德溫手中的道具槍意外走火，不僅射死了攝影師

  哈莉娜哈欽斯，導演喬爾蘇薩也連帶負傷，震驚了無數世人。


  不過在此之前，好萊塢便曾多次發生類似的不幸事件。


  在1994年電影《龍族戰神》中，受限於經費和時間不足之下，劇組自製的假子彈只移除了

  火藥、卻保留了雷管，因此在拍攝槍擊戲時意外誤射男主角李國豪，讓他才二十八歲便英

  年早逝。


  而在1984年影集「雙面諜」中，男星強艾瑞克海克遜則在拍戲空檔中拿道具槍大玩俄羅斯

  輪盤，豈料空包彈威力太強大而震碎了他的頭蓋骨，因此在傷後六天就被醫生宣佈腦死，

  得年二十六歲。




  《捍衛任務4》（圖：Lionsgate）


  特技演員出身的導演查德史塔赫斯基曾在《龍族戰神》中擔任過李國豪的替身，而在李國

  豪不幸身亡之後，也是由他代打上陣演完整部電影。因此談到這起槍枝走火事件時，查德

  史塔赫斯基也顯得深有所感。


  查德史塔赫斯基向好萊塢記者報解釋道：「關於《Rust》所發生的那起事件，我並不在場

  ，但我曾親自在場、目睹或參與過的所有意外事件，則全都是出自人為疏忽，而非機械問

  題。」


  「過去當一切才剛起步時，他們設計出了空包彈。空包彈是一種沒有彈頭的子彈，但劇組

  不能把你我放進同一個鏡頭裡，彼此相隔五英呎，然後由其中一人扣下扳機，從槍口冒出

  的衝擊力會震碎你的頭蓋骨。」


  「這種意外的確發生過，也有人因此而喪命。但過去十年來，他們設計出了電子槍、閉口

  槍（Plug Gun），槍口無法射出任何東西，完全都得靠電腦特效。這就是我們的拍攝方式

  ，這種科技已經問世了，任何人都可以使用。」


  既然如此，為何好萊塢沒有人人都從善如流呢？「就我看來，在拍攝現場上沒理由使用真

  槍。我們可以憑空打造出城市、太空船、哥吉拉等等，也擁有這種科技來對槍械如法炮製

  。可是過去一百年來，好萊塢始終都在用真槍。」


  「如果要讓道具廠、槍械師或供應商換過來，就會讓他們庫存的真槍毫無用武之地。事實

  就是，換槍會讓某些人花上好大一筆錢。沒有人想說出口，但這才是真正原因。你不需要

  真槍，換成其他作法只是會讓你花上更多錢。」


  《捍衛任務4》將於2023年3月22日在台上映。


  新聞網址：




  --'
