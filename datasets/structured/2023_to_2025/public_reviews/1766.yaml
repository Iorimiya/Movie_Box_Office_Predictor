url: https://www.ptt.cc/bbs/movie/M.1679470569.A.711.html
title: '[普爆雷]捍衛任務4-如同電玩般精彩但不經推敲~ '
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n本片除更多卡司及場景外，並未對前兩集有更多進步\n\
  劇情一樣經不起推敲，反派幾乎都是蠢死的\n是合格的爽片，但劇情真的沒有任何驚喜\n以下就主要演員進行評價\n\n基哥：以前可能基哥是最強的殺手可以無腦推進，但這部真不是，從頭到尾也沒有什麼謀略\n\
  \      但反派就是會作死最後劇情殺。\n\n甄子丹：雖然外媒給很高的評價，但卻是本劇最大BUG，一開始演瞎子的他還要感應器\n        定位射擊，但後面就不用了，原力感應嗎?。劇情相當於男二，如果這腳色不\n\
  \        特意設定成瞎子劇情會合理很多。\n\n日本女歌手：聽說外媒很驚豔，但除了脫外套露出緊身衣顯身材修長外，並沒有什麼\n            特別表現，劇情可有可無，長得太像某閃兵立委。\n\
  \n真田廣之：他在美國演的腳色9成都是這種設定.......\n\n史科特.阿金斯：為了證明演技故意扮醜搞笑，以為是像企鵝一樣扮豬吃老虎的腳色，\n     \
  \          有完爆基哥的肉搏力，但在劇情上只能蠢死。\n\n馬克.札羅：意外的戲份比想像中的多，全場壓著基哥打，然後劇情殺。如果BOSS找他當\n \
  \          最後決鬥審判的代理人，也沒有那麼多事....\n\nBOSS侯爵：捍衛任務的各路BOSS但凡有一點腦，不作死，基哥第一集就死了，本集的BOSS\n\
  \          再次表現出各種作死、拉仇恨值、無腦的行為。\n\n黑哥：劇裡自稱無名小子，演員還值真的是無名新演員，劇裡完全是攪屎棍，\n      BOSS沒殺他真的很不合理，但可能是本劇演技表現最出色的人。\n\
