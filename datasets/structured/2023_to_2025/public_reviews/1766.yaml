url: https://www.ptt.cc/bbs/movie/M.1687592322.A.9FF.html
title: '[新聞] 捍衛任務4導剪版製作中'
content: '《捍衛任務 4》全新「加長版」製作中！導演透露「追蹤者」戲份增加、未曝光角色將登

  場



  《捍衛任務 4》（John Wick：Chapter 4）在許多方面都是本系列之最，它不僅是四集中

  成本最高、票房也最高的一集，就連片長也是系列最長，總共 169 分鐘，但即使篇幅已

  經延展到將近三小時，《捍衛任務 4》依然刪減了不少素材，而查德史塔赫斯基（Chad S

  tahelski）日前接受《Comic Book Movie》採訪時則透露，他已經在著手將某些刪減掉的

  素材放回電影裡。


  史塔赫斯基表示：「是的，我一直在製作《捍衛任務 4》的導演加長版，而我們也快完成

  了，我想我們大約放回了 10 至 15 分鐘的內容，我們當初剪掉了柏林的很多戲碼，還整

  整剪掉了一個名叫『夫人』的角色，她和約翰（維克）的對手戲挺好笑的。還有約翰和追

  蹤者的對手戲、幾小段的動作戲也都放回去了。總是會有一些內容片段是因為和節奏不相

  容而被剪掉，但我覺得那些片段的品質都很高，我喜歡那些動作編排，我喜歡那些角色，

  但它們無法組成一個整體，那會改變整部電影的節奏。」


  《捍衛任務 4》目前已有院線版本的數位版、實體影碟可供購買，至於加長版本確切的發

  行時間，官方則尚未公佈。


  –


  登登登，世界的潮流就是導剪版！以後電影拍完沒有出個導剪版感覺都會被人家笑了。


  不過平心而論，追蹤者的確要多一點描述，不然看電影時一直覺得他只是一個亂入獸而已

  。



  --


  不然在樓梯中間塞十二宮好了，可以一關一關打上去XD'
