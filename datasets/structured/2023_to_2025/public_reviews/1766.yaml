url: https://www.ptt.cc/bbs/movie/M.1680269312.A.508.html
title: '[討論]捍衛任務4的翻譯是不是正常的水準'
content: "這幾年的英雄片 對 Marvel& DC 就是在說你們\n 翻譯幾乎都是啥 wu包辦的我記得沒錯吧\n 為了口語化還是接地氣翻得有夠low\n\
  \ 像啥讓我生氣氣 阿不就好棒棒..\n 這種討論區的垃圾語氣也好意思翻到大螢幕來\n\n\n 江維克的翻譯才顯得難能可貴吧\n 翻譯像是教課書或小說裡面的翻譯\n\
  \ 有點文學程度又不會文謅謅的在那邊之乎者也..\n 像肯恩有一句\n\n 字幕打 非我所願 如果正常翻成 這不是我願意看到的效果就有差距\n\n\n 順便疑問下\
  \ 真田廣之女兒在日本是很出名嗎\n 聽說第一次演電影 口條演技都挺不錯\n 比蠟筆小新還小新的朝天眉真讓人出戲\n 我本來以為是啥劇本人設需要 看了下本尊的眉毛差不多也是這種的\n\
  \ 比較潮的劉玉玲??\n\n\n\n 還有浩二跟女兒的服裝也是一言難盡\n 我不曉得跟日本文化有啥關聯..\n 感覺也不像真田廣之自己團隊拿來穿的\n 這部編劇算是真的很給足真田廣之面子\n\
  \ 比較像歐美化妝師自認為的日本黑幫文化的服裝\n\n--"
