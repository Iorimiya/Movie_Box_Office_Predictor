url: https://www.ptt.cc/bbs/movie/M.1679475751.A.70D.html
title: '[討論] 捍衛任務4好雷'
content: '好雷







  整部片大概就三段

  大阪飯店、胖子夜店跟巴黎大亂鬥

  這樣能搞三小時實在也是很驚人

  導演應該是捨不得刪掉每一個鏡頭

  連溫斯頓在美術館走路都可以走30秒


  大阪飯店那段一氣呵成

  甄子丹在餐廳後場那段一度讓我想起李連杰的龍吻

  完全讓他耍帥耍到爽

  連招牌的葉問連打跟導火線打東尼的轉手臂拳都用上了

  還沈浸在甄式武打中

  卻在基哥一登場之後整體動作開始slow mo

  玻璃場景+雙截棍跟第三集結尾87%像

  這段又臭又長


  然後到了胖子夜店之後

  賭桌那段如果少了黑人可能張力會再高一點

  而且實在也搞不懂發牌那段到底有什麼意義

  本來以為基哥會拿出瑞士銀行本票

  打胖子那段，胖子也是武打明星所以那個出腳

  很明顯也是可以把基哥踢死

  可惜也被莫名的打敗

  基哥只要每次不用槍，我都會覺得他被對手玩


  巴黎大亂鬥就滿驚豔的

  凱旋門那邊一直讓壞人被車撞真的很爽

  龍息彈那段也是很爽，是康斯坦丁2嗎

  但是這兩段也很明顯是有點太長

  感覺導演太喜歡捨不得剪


  不過樓梯那段就有點多餘

  敵人都雜魚

  然後烏漆嘛黑

  動作也很不俐落

  創意是有，但是就少了點什麼

  如果來個無敵風火輪利用侯爵雜魚的體重

  跟地心引力的turbo應該可以增加看頭


  整體來說就是很多地方都很冗

  但是是很有誠意的冗，所以就也沒啥好批評的



  話說那個黑人角色有夠多餘

  全部戲份刪掉也沒差吧

  ----

  Sent from  on my iPhone 12


  --'
