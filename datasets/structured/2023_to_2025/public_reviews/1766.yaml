url: https://www.ptt.cc/bbs/movie/M.1679554789.A.494.html
title: '[好雷] 捍衛任務4 個人會二刷的點'
content: '雷文防雷資訊頁













  ~~~~~~~~~~~~~~ 雷文 主文分隔~~~~~~~~~~~~~~~~~~~~~~~




  有的電影院可以憑票根換海報，記得要換啊！！

  4讓我覺得最精彩的地方是更加昇華的華麗，從不同家族的元素，個區域的武器和武打都

  很有特色跟很精緻。

  日本刀跟弓的破壞力帥到不行，相撲摑掌動作也把步伐跟整體身體律動打的很到位，Akir

  a很多貼身短兵器的操作也很流暢，真的是很實打實很誇張的動作指導。


  老千那段的醞釀也好喜歡，那段的節奏很有趣在於明明是一個動作都沒有的場景，卻讓你

  緊張到快閃尿，但全體人動作的時候又順暢到一瞬間爆發出來的緊張感，這是我覺得這一

  次在很多橋段上面很精心設計的觀影體驗。


  最後是自己很想二刷的廢老房戰，原本以為上樓梯的一鏡已經好優秀，直到變成跨房俯瞰

  視角直接起雞皮疙瘩（但是不習慣的人整個會暈爆），我一直在看切換畫面的機位設計邏

  輯，如果有美術設定輯一定會收藏。


  最後電台追殺那段也好喜歡，從音樂到節奏都非常用心，也是西裝防彈的最高潮。花式的

  防彈動作跟各種被撞飛彈起，也在這片終於不會再有車門撞爛一半在那邊甩的畫面，直接

  撞斷又帥又乾脆。


  之前跟會武打的朋友去看，總是會聽到很多動作指導解說，這次看完他出來一臉茫然地跟

  我說：「有的動作真的太快了，真的太炫。」


  整部片根本濃縮再濃縮，讓John wick好好的演出4部曲，各種特寫帥Cut也是大滿足。


  重要的不是整部片的邏輯，而是他在這個荒唐的過程裡面發生的故事還有帥。


  --

  那趴真的很用心，打戲很多到樓梯戰那邊真的好累，跟主角一樣累

  真的薄，櫃檯拿給我的時候就折到了

  通常IMAX跟其他都會是不同的版本

  塞了非常多的東西，家族設定、打戲、美術等等的都太澎拜了'
