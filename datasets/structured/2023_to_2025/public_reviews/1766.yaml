url: https://www.ptt.cc/bbs/movie/M.1695118486.A.B59.html
title: '[新聞] 基哥拍打戲拍到身心俱疲！捍衛任務4'
content: "基哥拍打戲拍到「身心俱疲」！《捍衛任務 4》製片人坦言：基努李維主動要求被賜死\n\n\n\n基哥拍打戲拍到「身心俱疲」！《捍衛任務 4》製片人坦言：基努李維主動要求被賜死（\n\
  圖片來源：獅門影業）\n\n 《捍衛任務》（John Wick）系列首部外傳影集 《刺客旅館：捍衛任務世界》（The Con\ntinental：From the\
  \ World of John Wick）即將在 09 月 22 日於 Peacock、Amazon 兩\n家串流平台開播，該劇的時空雖非設定在《捍衛任務 4》（John\
  \ Wick：Chapter 4）之後\n，但本系列製片人-貝索伊凡奈克（Basil Iwanyk，下圖右）受訪時，仍然被追問了關於\n《捍衛任務 4》最受影迷討論的「約翰維克」疑似的結局。\n\
  \n\n\n（圖片來源：Pinterest）\n\n連續執導四集電影的查德史塔赫斯基（Chad Stahelski）導演已多次解釋，約翰維克在《\n捍衛任務 4》的生死是刻意處理得偏向曖昧，重點在於表現出維克「已獲平靜」，至於肉\n\
  身是否真的死亡，他們則保留開放性的解讀空間。\n\n但  伊凡奈克在接受《Collider》採訪時則透露，基努李維（Keanu Reeves）最初其實是\n要求自己的角色被賜死的。\n\
  \n伊凡奈克回憶：「在拍完第二、三、四集之後 — 拍這些電影真的很累人 — 基努在生心\n理上都被操壞了。後來他總是說：『我不能再繼續拍下去了。』而我們也都同意他。\n\
  \n他整個人已經被掏空，已經操到極限。\n\n他說：『我想要在這集的結尾被徹徹底底地殺死。』而我們則告訴他：『我們還是會保留\n 10% 的一個小小開放性窗口的。』」\n\
  \n獅門影業五月時已宣佈確定會拍《捍衛任務 5》，但李維和史塔赫斯基並不急著執行，他\n們都打算先離開這個系列去做其它的項目。\n\n\n\n文：Joker\n\
