url: https://www.ptt.cc/bbs/movie/M.1558513745.A.A82.html
title: '[新聞] 繼續開戰！基哥捍衛任務4正式定檔宣布開拍'
content: "繼續開戰！基哥《捍衛任務4》正式定檔宣布開拍\n\n2019/05/22 15:05\n\n\n「基哥」基努李維在《捍衛任務3：全面開戰》中展現魅力。（威視提供）\n\
  \n〔記者許世穎／綜合報導〕54歲「基哥」基努李維3度演出的《捍衛任務3：全面開戰》在\n全球上映叫好叫座，目前累積票房已達9903萬美元（約新台幣31.22億元），片尾留下的\n\
  伏筆也讓影迷期待是否會有「第4章」，而電影公司也正式宣布開拍消息，將於2021年5月\n21日上映。\n\n該片在台上映首5日，全台票房便高達6640萬元，幾乎是上一集的2倍，北美首週末5702萬\n\
  美元（約新台幣17.9億元）的票房成績除了直接超越首集總票房，更是基哥從影生涯中，\n僅次於《駭客任務：重裝上陣》的次高週末開票紀錄。\n\n導演查德史塔赫斯基先前曾表示，只要觀眾支持就會開拍續集；基哥也表示不排斥再演出\n\
  動作片：「只要觀眾還想看到我，我就會繼續演下去。」粉絲們的期待果然成真。\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\
  \n\n\n\n\n佛法的。\n\n馬哈希尊者《毗婆舍那講記(含法的醫療)》說明如何修增加智慧斷除所有煩惱。\n\n\n\n\n\n\n--\n\n帝釋所問經講記77頁拆穿的。\n\
  毗婆舍那講記(含法的醫療)說明如何修四念處增加智慧斷除所有煩惱。\n  PTMC 寂靜禪園\n、、、、()、、是。\n  是    是\n\n--"
