url: https://www.ptt.cc/bbs/movie/M.1680263399.A.5EF.html
title: '[請益] 捍衛任務4 甄子丹&基哥 (有雷)'
content: '今天剛看完熱血沸騰的捍衛任務4！


  "殺神"超級強勢回歸！

  武打.槍戰.動作精湛！

  絕無冷場！


  看完之後，有兩個問題想請問：


  1.最欣賞兩人最後在聖心聖殿聯手合作一路殺上階梯的橋段！精彩絕倫！

  但兩人好不容易上階梯終於登頂了！

  為何甄子丹又要突然襲擊基哥？

  然後基哥被甄突襲、戳一下受傷後，

  甄又趕緊拿布給基哥包扎止血？@@"


  不太明白甄子丹這樣的心境轉折是什麼樣的變化？


  我只記得這一段的兩人對白好像有提到：

  「這樣你就沒欠我了?!」@@"



  2.基哥的墓碑最後立在愛妻的旁邊。

  但那只是墓碑，也沒看到基哥屍體真的下葬的過程。

  有沒有可能...未來還有伏筆?!

  搞不好"立個墓碑"這只是基哥終於重獲自由之身、所想出遠離塵世的障眼法?!




  特別備註：

  今天拿到超帥的基哥海報!!!

  質感真的超讚的啦!!!




  基哥大開殺戒的眼神 完全帥翻啊!!!



  如果這真的篤定就是完結最終章...

  那我想我會很懷念殺神基哥...QQ




  --'
