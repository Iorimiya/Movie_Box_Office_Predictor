url: https://www.ptt.cc/bbs/movie/M.1679498597.A.537.html
title: '[討論] 捍衛任務4的美杜莎之筏'
content: '勞倫斯(紐約酒店主)跑去找侯爵(替約翰)下戰書的那幕，背景有很多世界名畫


  在影院一邊留意文戲裡面的台詞時，一邊思索背景的畫是那些畫有啥涵意的時候


  只有幾秒鐘的畫面，沒仔細留意就這樣過去了


  直到侯爵要送客打發勞倫斯時，畫面停留的位置在勞倫斯身上，


  勞倫斯回應(小聲自言自語)道：「人生不就如此」(大意好像是這句，呼應前面下屬被殺)


  此時的電影畫面，勞倫斯背後的牆上掛著《美杜莎之筏》(The Raft of the Medusa 1819)


  美杜莎之筏這部畫的故事是法國的軍艦美杜莎號在海上失事的情節。


  美杜莎號當初沈船的時候，僅有150人倖存爬到逃生筏上，但當(12天後)救援船抵達時，

  逃生筏上只剩下15人的情景。


  但這幅畫當年1819年參展時，因為政治不正確的因素而遭到抵制且雪藏了起來。



  個人覺得電影顯示這一幕做對比勞倫斯跟約翰的心態猶如美杜莎之筏的倖存者在小船上爭

  奪逃生筏的空間來對比他們反抗高桌會不得不反抗的命運

  (如同美杜莎之筏畫作在大眾心中的副標題：黑暗中的希望)



  伯爵房間的其他畫作我就沒留意到了，不曉得其他板友有無留心到此幕情節的背景畫作的

  其他畫作的作品來解讀呢？


  --

  Sent from JPTT on my Nokia 3310


  --'
