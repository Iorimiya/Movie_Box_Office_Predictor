url: https://www.ptt.cc/bbs/movie/M.1679643587.A.E9C.html
title: 'Re: [討論] 捍衛任務4的幾個小問題（雷）'
content: '以下就我有印象的部分回覆

  有錯請指正



  我個人的理解是這樣

  現在高桌派來主事的候爵就是想斬草除根

  他一直強調從一件事的作法就能看到每件事

  我們看他殺溫斯頓的親信就能知道，滿門抄斬，株連九族，殺雞儆猴就是他的作法

  浩二老江湖了，一看到對方大陣仗的過來就知道他攤上了什麼事

  不管這裡有沒有找到基哥，都只是候爵開戰血洗的藉口

  所以浩二是別無選擇，即便基哥今天沒躲在他這裡，被找上門來清洗也是遲早






  其實我也一直在等他的真實身份是不是有埋什麼梗

  結果到最後好像真的就是殺手世界的卜學亮

  大家都知道有一位傳說中的追跡者找人很強這樣




  應該設定上就是智力點滿，武力值90以上的殺手

  除了看小冊子全片完全沒透露其他線索



  前面是沒有計劃的

  登上樓梯時肯恩只是想來個公平的勝負

  不想配合侯爵的小人，所以當候爵精神喊話的時候他也很不客氣的要候爵去旁邊烘乾

  然後從候爵要求刀劍對決，並一開始就決意要讓肯恩頂替上場就能看出肯恩擅長的是刀劍跟近身戰

  所以30步、20步之外基哥是跟他賭一把自己能在槍口下存活

  而前面兩槍基哥都準確的避開肯恩的要害

  這邊已經讓肯恩心裡有底

  不然憑基哥的傳奇身手，不可能會拖到三槍還沒決勝負

  以肯恩對基哥的了解，那兩槍「刻意」打在什麼部位他心裡有數

  直到第三槍來到靠近候爵的位子

  基哥先說了凡想活命者必喪命

  肯恩回應基哥，才確實完整計畫的全貌互相配合


  順便聊一下這裡有帶出基哥有沒有詐死的細節

  肯恩的下一句是「凡想喪命者，必將活命」

  他回應基哥的下一槍肯定也是避開要害

  所以我認為埋葬的是殺神

  但約翰維克活下來了

  從此不問世事，可能在某動物收容所當警衛安享天年




  應該只是視如己出

  基哥設定上是孤兒

  但溫斯頓為了他跟整個高桌槓上

  不惜失去大陸酒店讓自己一無所有

  這一句「再見，兒子」算是完整了整個故事的感情線

  其實老爸一直以來都在想辦法幫他擦屁股

  也讓殺神悲情的一生在最後增添了溫度

  我自己很喜歡這樣的安排

  好險不是硬插一句「再見我無緣的愛人」

  畢竟現在的好萊塢什麼事都做得出來





  -----

  Sent from JPTT on my iPhone


  --


  沒錯

  高手間就是以拳交心，以刀劍交魂

  如果他們要計劃好再上樓開幹，這樣就失去捍衛任務系列一直以來的武俠浪漫了

  現在還能看到這麼精彩的西部片對決，導演的功力真的深厚


  問就是原力


  本來以為他是聽音變位

  可是基哥趴在他前面喘的時候他又好像聽不到

  真的很謎啊


  候爵年輕人沈不住氣

  十拿九穩的情況下還是被一群老狐狸給陰了

  有這種結果候爵旁邊的助理也好像不意外'
