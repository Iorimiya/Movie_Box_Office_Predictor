url: https://www.ptt.cc/bbs/movie/M.1679669892.A.A20.html
title: '[好雷] 水準比前一集上升不少的捍衛任務4'
content: "有雷\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n\n\n雖然捍衛任務3滿爛的，但因為是大基哥演的片，還是一上映就手刀買票支持。\n\n這一集個人最喜歡的地方有兩個：\n\n其一是場景設計，有好幾幕都讓人覺得wow。\n\
  特殊的色調和充滿異世界感的畫面真的很棒!!\n\n其二是巴黎大逃殺中的廢墟戰，這段一鏡到底+切換成像電玩的俯角拍攝，\n配上龍息彈火光四射的效果，超讚超爽!!!!\
  \ \n( 這段真的好想多看幾次，非常精采的安排! 個人覺得第4集的精華就是這段!!! )\n\n\n武打部分，前面大阪飯店玻璃展示間那段套招感實在太重了。\n\
  看到好幾次被打倒的人站起來後先在旁邊暫停幾秒stand by，\n然後等基哥打完別人才再重新啟動衝向基哥被打，\n這種不連貫感真的看了會很想笑+皺眉。\n不過甄子丹出來後武打就變得俐落到不行，速度也快很多。\n\
  雖然看到他心裡就想到政協，但武打部分真的很厲害!\n\n另外巴黎大逃殺基哥被車撞那麼多次都沒事也太猛了吧!\n滾樓梯那段很搞笑，\n看的時候覺得\"欸滾這麼多階，差不多可以停了吧?\"\
  、\"中間有平台應該會停下來吧?\"\n結果還是一路往下滾到底，真的笑死XDDDDD\n\n\n結尾收得滿好的，我覺得這系列就這樣結束了也很不錯的那種好。\n\n\
  \n\n\n\n--"
