url: https://www.ptt.cc/bbs/movie/M.1697103601.A.FD0.html
title: '[好雷] 現在才看捍衛任務4會太晚嗎'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  現在才看捍衛任務，會不會太晚XD


  老實說現在因為網路看片實在太方便，已經好久沒有去電影院，想到要買票排隊都覺得好

  懶惰，很多大片都拖著結果都等到已經上串流了


  趁連假終於把捍衛任務4看了，很意外myvideo是月租也可以看的欸！


  而且片長也太長了吧，2小時49分鐘！




  本來擔心說第四集會不會走上系列續集爛掉的後路，看完只能說他們真的是下重本欸，什

  麼都丟進來了。


  總體來說就是前面三集有什麼打法，這集通通都來，不夠的話我還給你再多一些新的打法

  讓你們一次看個夠，雖然說片長很長，但整部電影毫無冷場，因為就是打架大爽片，對於

  連假在家看片不想思考真的很過癮。


  但以劇情層面來說，個人覺得沒有什麼劇情可言，已經沒有第一二集那種故事感跟神秘感

  ，第三集敗筆在打架太拖戲，第一集營造出主角的人設跟世界觀，第二集延續第一集的世

  界觀讓大家更了解，第三第四感覺已經停滯，劇情對於電影來說已經可有可無


  其他甄子丹的部分我不太理解為什麼設定要是盲人（俠盜一號也是盲人）why?

  拿開盲人對於這部電影基本上不會有影響～


  結局部分我倒是覺得導演這個收尾還不錯，不說破保有空間

  我個人是不希望再有第五集啦，再下去真的可以加入we are family


  但有點回到第一集，退隱的約翰被迫重出江湖，現在一切只有在真正的死亡才能劃下句點

  。


  總歸一句話：愛護動物，狗狗是無辜的！





  --'
