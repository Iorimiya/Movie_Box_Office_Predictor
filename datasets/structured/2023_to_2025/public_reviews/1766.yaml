title: '[選片] 沙贊2 vs 捍衛任務4 vs 再看一次鈴芽之旅'
content: "各位電影眾好,三月惹,電影市場也逐漸有大片上戲院\n本人喜好 劇情 動作 推理 動畫 喜劇 等等的片型\n\n沙贊2     說真的,超英片不只是越拍越膩沒有新意的問題\
  \ 對所謂續集的編排也不夠認真\n          像是《蟻人3》窩就沒去看惹,後來看YT爆雷感受也差不多\n=\n捍衛任務4 窩還記得第一集在美麗華AURO廳看,各種槍聲炸腦,這片推薦跑去青埔看嗎?\n\
  =\n鈴芽之旅  商映早場就去看了,屁孩在後面從頭笑到離場== 再看應該要看特殊聽了吧?\n\n擇一的話,各位會怎麼選擇呢?感謝~\n--\n20年前 對尼要不要出國阿~\
  \  小加蛋:好~就好壓\n\n 20年間,小加蛋賭對惹一支股,讓牠可以說嘴一輩子,工作只為踩步機\n\n如今,的小加蛋回臭牠的\n還勸:土Eason+七鵝港筷移民吧~\
  \    殊不知\n\n--"
