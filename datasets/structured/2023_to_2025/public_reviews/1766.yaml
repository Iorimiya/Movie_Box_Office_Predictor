url: https://www.ptt.cc/bbs/movie/M.1680899673.A.A28.html
title: '[負雷] 捍衛任務4 全面退化'
content: "為了看第四集，還特地用netflix複習了前三集，趁記憶猶新時寫個心得好了，想到什麼就寫什麼。\n\n\n首先講優點：\n\n\n確實像許多影評提到的，就是重頭打到尾，想看基哥怎樣無腦無雙動作大場面都有，喜歡武打動作\n\
  \n武士刀雙節棍盲人劍客摔摔打打的不會失望。\n\n\n\n但，也就差不多那樣了。\n\n\n對我來說，這是與前三部調性落差極大的續集。\n\n\n先說至少到前三集吸引我的點，在於它一步步塑造出了一個：神秘、嚴謹、無所不在、冷血卻又十分\n\
  \n日常的殺手宇宙，前一秒還在廝殺、下一秒同行在酒吧喝酒，牢騷幾句畢竟是工作嘛把恩怨帶過、前\n\n一刻只是壽司師傅，下一刻變成專業殺手，還像追星般對著要下手對象口若懸河。所做皆有規矩、所\n\
  \n為皆須代價。\n\n在這樣的冷血殺手宇宙下，看著john為了一隻狗放棄退休生活，各種衝動與血性交錯下，試圖在規矩\n\n中殺出條活路，是這系列我覺得最有趣的核心。\n\
  \n\n但這樣的調性，到第四集時卻幾乎趣味盡失。只剩下近乎濫情的江湖快意恩仇。\n\n\n先是接續在第三集後、第四集初的激昂。你以為伴隨著john的怒火，幹掉長老後，他會有個大Plane\n\
  \n於是先跑到大阪，想必要幹番大事...結果沒有，他只是跑去找朋友害死朋友。\n\n好，那他膽敢瀟灑對長老放槍，鐵定有B計畫...結果沒有，他連追殺自己的人是誰、在哪都不知道\n\
  \n一路殺到溫徹斯特這好用的NPC給消息、給情報，你才會發現JOHN根本腦袋放空什麼都沒在想...欸\n\n那開頭是急著跑去殺長老幹什麼？\n\n\n再來就是殺手組織的崩壞──前三集維持的那種神秘、強大感近乎蕩然無存，只剩送\n\
  \n一堆經驗包的功能。幾乎所有人都不太甩規則，隨便一句禁武令就解除了、信物、規矩這些\n\n前幾集斤斤計較的遊戲規則，在這集幾乎都只剩口頭隨口提及。被組織找砸了就挾怨報復(以\n\
  之前標準早該死幾百次了吧？)、\n\n被組織懲罰了就讓john殺組織的人回復信物再跟組織挑戰？(以前有人給了七顆子彈就被搞耶)\n\n幾乎每個要角都不服組織都在偷偷搞事，不是說這樣不行。但演到這樣已經跟尋常的「叛離邪惡組織後被組織追殺」的戲碼差不\n\
  \n多了，跟之前塑造起的「絕對不能觸犯規矩」「組織的無上權力」的印象，可說是完全崩壞了。\n\n尤其那根本為了讓john復仇而量身訂做的決鬥古法，細想就知道有多大問題──根本再鼓勵人搞事\n\
  \n更不用說那根本出來搞笑的侯爵了，被授予最高權限的負責人結果在那打電話跟一個賞金獵人般的路人殺手討價還價(扶額\n\n這組織形象爛成這樣John第三集哪需要卑微的犧牲手指頭？根本可以直接開殺談條件了吧。\n\
  \n\n我不知道有幾度期待第三集的審判官再次登場，她給予的那種壓力根本這集BOSS的百倍\n\n\n前三集中各種形形色色的殺手安排，到這集也是貧乏到不行。除了賞金獵人的黑人男出來\n\
  \n裝模作樣(這角色完全可有可無吧？就是晃過來晃過去要殺不殺要打不打的)外，幾乎就是黑道\n\n尋仇的清一色西裝筆挺，大阪那邊好些，但也就這樣了。看他們在講義氣談你不幫我報仇我就\n\
  \n要自己報仇，我差點以為自己再看行走江湖的武俠片。而不是那個廝殺完還抬槓工作嘛~無關\n\n私人恩怨、還會給同業福利的專業殺手業界。\n\n\n雖說打鬥畫面很多，但卻也沒有任何真正堪稱深刻的打鬥。所有人都想殺了john、但也幾乎所有人都在放水\n\
  \n最讓人費解的是跟盲人、帶狗黑人跑去執行任務的地方玩牌那段，在場所有人都要殺john也設好圈套等著他\n\n結果讓他輕鬆搞定任務跑掉？這根本不算鎖血，已經是玩遊戲把難度調到幼稚園的NPC了吧。\n\
  \n還有最後那段往聖心堂的打鬥，我不知道導演是覺得這樣很有趣還怎樣...闖關一般持續廣播\n\n追殺路線，但這根本拖時間吧？就好像怕決戰不夠精彩、打鬥不夠多一樣，硬要穿插一段毫無\n\
  \n緊張感與新意的飛車追逐。\n\n唯一讓我覺得有趣的是john對車抗性好像點的挺高的，其他人被車撞飛幾乎都是再起不能了就只有john飛起來後還能無傷般繼續跑\n\
  \n\n\n嗯就先差不多講到這邊，想吐槽的點很多，但最失望的果然還是殺手組織的神秘性幾乎蕩然無存。\n\n與其要看著到頭來殺手組織的最終BOSS是跟第一集席恩差不多的屁孩，那不如早早收尾吧。\n\
  \n確實john是真正倒下了、也十分慶幸他真的倒下，不會有後續了。\n\n\n--\n 你要看看凱旋門那段呀，挖靠那車輛對人載具SS的攻擊性這邊才表現得淋漓盡致，每個小怪都一車一隻、一波帶走\n\
  \ 我一直在看有誰是像基哥那樣被撞飛後拍拍屁股繼續跑，結果沒有一個能馬上再起的，基哥被撞了四集至此我才認\n 真意識到他絕對有點抗車耐性XD\n\n 對，做為普通觀眾而言，前三集我都還能好好欣賞武鬥互博的動作，但這集除了甄子丹那邊有比較認真\n\
  \ 外是真的沒什麼耳目因新的，大阪就...末代武士？w\n\n 致敬哪部？那邊也不是說不行，但「拖時間」感就真的滿重，同樣是靠懸賞讓真哥陷入絕境\n 第三集懸賞令一發出時真哥那倉皇逃走邊碰上路人殺手如驚弓之鳥的絕望感，跟這集闖關飛車開槍崩崩崩\n\
  \ 感覺實在差太多\n 對那邊頂端視角不錯，是後段少數讓我眼睛一亮的橋段\n 我會覺得就死吧。因為與之相對的殺手組織神秘性和權威已經蕩然無存了。\n 搞成這樣給他利用規則簡單脫身(還只是NPC動動嘴巴就給出的解法)，那這至少營造了三集的殺手\n\
  \ 世界觀是一點吸引力都沒有了。至少對我來說。\n\n正是「放棄思考」這點特別有違和感。想想第三集結尾「我現在超不爽」、第四集開頭一拳一拳打到滲血然後黑人高喊著口號出場...彷彿一場超華麗的復仇正要開使\n\
  \n結果？沙漠騎駱駝碰碰長老 > 基哥大阪找朋友 > 阿那個追殺我的是誰？他在哪？我要找他報仇\n\n有沒有發現...他的復仇到幹掉長老後已經結束了，後面是新主線？？\n\
  \n你要說他被追殺到放棄思考OK，但對比4開頭的醞釀就是很奇怪。尤其跟溫徹斯特見面，講了一個大部分觀眾至少在第2集就知道不可行的計畫，那邊看到真有點翻白眼\n\n\
  真的想要讓基哥放棄思考的路線其實也不是不行。\n\n\n我假設一下：\n\n開頭基哥沒殺長老，而是直接讓放棄思考的他往大阪找朋友被救起，讓那個野心BOSS為了上位趁亂弄死長老\n\
  \n再嫁禍給基哥，其他追殺劇情不變，黑人追蹤者其實是組織上層派來查清狀況的審判官，而最後的決鬥就變成組織半授意下讓基哥將功贖罪抵銷罪刑\n\n這樣脈絡的話是不是讓劇情邏輯變得更清晰了？野心BOSS怎麼輕易被老闆釣魚、殺手組織不會破格、基哥放棄思考流落大阪到溫徹斯特給意見的這些橋段，都能夠更好銜接而不致走到現在這尷尬的狀態\n\
  \n 囧...\n我在數那些車子的急殺率所以那邊看得算開心w\n\n 第三集至少有把高層追殺的恐怖感做出來，跟基哥再小的接觸都會引來無情的肅清，壽司店師徒也算有趣。但第四集扣掉大阪那幫人外實在沒什麼亮眼的...\n\
  \ 原來有這層致敬在，感謝解釋。不過那段真的是表現的很拖戲...\n 不得不說雙截棍那段是真的很可有可無\n\n 那個，並沒有，侯爵是被推舉出來的，死了還有下一個，就像飯店老闆說的殺之不盡。\n\
  \n而也因此更顯得兒戲，你整個殺手組織把權限全放給一個表現比第一集俄羅斯老闆還差、打電話跟一個\n賞金獵人討價還價的屁孩身上？？然後每個被沖康過的都反過來想沖康上層、每個組織都在偷幫john也\n\
  不怕報復了，就這種統御能力能維持這個組織權威壓住那些牛鬼蛇神的狠人？\n\n這種把高層的神祕感和權威性整個粉碎掉的編劇，才是讓我覺得4和整系列格格不入的原因。\n\
  \n 衣服跟武裝的防彈能力還真的很謎，第三集還能看挑盔甲缺口打。大阪戰平平同樣一把槍，給基哥開槍對方裝甲就跟紙糊的一樣躺，給其他開又瞬間變成防彈功能XD\n\n\
  第三集還是靠審判官的氣場在撐，執行肅清任務、裁決、最終飯店談判，都能看得出條件的苛刻和外交手段\n(王牌刺客一死立馬和談驅虎吞狼不做廢話)。雖然沒前兩集精彩，但至少組織神秘感沒破格，後續算好發揮。\n\
  結果第四集就整個變好萊屋黑幫槍戰動作片了\n好說好說"
