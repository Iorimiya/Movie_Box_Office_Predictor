title: '[不錯雷]  捍衛任務4-衰神'
content: "有雷\n\n\n有雷\n\n\n\n有雷\n\n\n\n\n有雷\n\n\n\n\n有雷\n\n\n\n「你所到之處只有死亡」-此名言出至大阪大陸酒店經理的女兒明。\n\
  \  意思就是你不要來找我老爸啦，會害我死全家啦～衰仔。\n\n心得如下：\n1.其實John wick也很無奈，高桌會就不放過他啊！\n\n2.不要享受劇情，享受片中的動作，是實戰來的，不是花拳繡腿打漂亮拳。（還有用開槍\n\
  的方式把利刃逼到脖子鎧甲裡，有趣）\n\n3.John wick換彈匣速度真的快，每場戰鬥都可仔細觀察，尤其是最後222階梯戰，換超快\n，是趕下班逆？\n\n\
  4.體力超好，近三個小時的電影，兩個半小時都在打架。一般演員可能沒辦法這樣操吧？\n肯定是打了針吃了藥 ......\n（電影拍攝期間都在動，如果我是李維哥，我以後要改拍文藝片。）\n\
  \n5.我覺得甄子丹比較強，如果他沒瞎的話更好。\n可能導演覺得這人不是瞎子的話，這戲沒法演，太強了。\n\n6.甄子丹的經典旋轉上勾拳，在其它電影也有出現過，有人知道是哪一部嗎？\n\
  \n其它有想到我再補充。\n\n總之這部片娛樂性保證是有的，花不到三百元進影院支持一下囉。\n\n\n\n--\n有一幕是wick龍息彈廢墟槍戰戲，導演用俯視畫面，其實挺有趣。\n\
  像電玩哦\n啊，對吼，你記得真清楚\n有，尿完再回來看都來得及\n謝謝你幫我想到這幕\n2,3要看哦，有劇情上的連貫性\n嘿啊，傻傻的，全員拿龍息彈來射才有勝算"
