title: '[討論] 捍衛任務4的幾個小問題（雷）'
content: '防雷



























  剛看完捍衛任務4

  幾個疑問想跟大家討論一下


  1.大阪大陸酒店經理浩二有必要跟侯爵的人馬開戰嘛？雖然我明白這是劇情需要 但從一開始女兒兼接待員的明都不知道基哥在這裡

  就算高桌會來搜查 酒店肯定有密道

  讓基哥從密道逃走再雙手一攤給他們搜

  肯定連根毛都找不到 浩二跟基哥雖然是生死之交但女兒還在現場的情況有必要冒險嗎？


  2.基哥本來的家族拉斯卡·羅馬（首領彼得叔叔後來是他女兒）跟在紐約的芭蕾舞團女總監的幫會是同一個嗎？基哥的家族是在尋求庇護時沒的?還是基哥更早以前因為金盆洗手退出了？


  3.追蹤者的真實身分是誰？戲裡沒明講

