url: https://www.ptt.cc/bbs/movie/M.1737137870.A.673.html
title: '[好雷] 【乖女孩】Babygirl or Baddog ?'
content: '‧


  是說不愛妳傷人？還是跟你做愛從來沒高潮比較令人心碎？


  甫為新科威尼斯影后的妮可基嫚，在這部【乖女孩】極為簡單的故事情節中，以極細微的

  表情顔藝，及充滿渴望突破道德的嬌喘，為這部情慾電影帶出了許多層次的深度；尺度雖

  然並沒有想像中大，但其主客互換的角色下，情慾渴望及道德枷鎖彼此拉扯，口嫌體正直

  的願意當讓人撫摸頭稱讚的Babygirl？還是床沿下的一條被情慾馴服的Baddog？



  ‧


  【乖女孩】完全是一部以妮可基嫚的演技而成立的一部作品，無論是高潮時的解放表情及

  吼叫，亦或是被支配時的傲嬌撫媚，都將一位渴望新鮮，卻不願摧毀家庭生活的事業女強

  人，演繹的相當淋漓盡致；加上與哈里斯迪金森充滿主傭情慾的對手戲，隨著一聲聲高潮

  喘息，劇情不疾不徐的讓觀眾迷醉其中。


  而另一最讚賞的地方，則是歌曲及配樂的相輔而成，無論是當下情境的音樂，或是放縱情

  慾時的歌曲歌詞，都相當契合劇情當下所釋放的情緒，片尾時的歌曲更是推薦聽完再行離

  場；而蘿米的服裝搭配也深具巧思，除了能反映當下心境外，也能透露出誰才是當下支配

  與被支配。



  ‧


  蘿米與山繆，誰為支配指導者的戲碼，不斷隨著主客對換，衝擊蘿米的內心，她在社經地

  位上，遠遠高於山繆，甚至眾人對她極為欽佩或尊敬，但她渴望被支配，想要突破情慾的

  翻新，隨著一塊餅乾的試探、一杯充滿性暗示的牛奶，徹底打破這一道名為道德的城牆，

  就算眾人力勸蘿米不要喝，但總敵不過渴望挑戰也希望被挑戰的慾望；山繆觀察入微的特

  質，卻也是能夠擄獲蘿米內心缺憾，他懂她要的，她也懂他想給的；山繆看似的欲擒故縱

  ，卻很是滿足蘿米心中並非直接了當的情慾探索，隨著不斷試探，欲拒還迎的她，最終得

  以打開雙腿那情慾應許之地，也願意像被懲罰的女孩，站在牆角等待主人的呼喚。


  而蘿米與雅各，則是傳統長年相處的夫妻伴侶所常面臨的問題，雖然擁有看似美好的富人

  家庭，但卻擁有著與丈夫性事方面的困擾，雅各是個充滿魅力的熟男，但過於紳士或一成

  不變的性愛，卻成了蘿米想逃離的藉口，她沒有不愛他，因為在這段情慾偷情中，她不曾

  對山繆說過愛；蘿米無法真正摧毀自己的家庭生活，但缺乏溝通甚至說不出口的坦承，都

  是壓垮兩人的稻草；這也證明了床笫問題之間，溝通治療的重要，只是對於深愛的丈夫，

  無法高潮卻也是很難輕易說出口；而最懂她的卻是自己無法理解的女兒，一聲妳還好嗎？

  徹底讓蘿米陷入進退兩難。



  ‧


  【乖女孩】雖然是部可能會被認為劇情過於簡單，而被批評的作品，但實際上，它內含了

  許多夫妻生活中所面臨的家庭及性事問題，以及雖然篇幅不大也未太深入的職權不對等所

  涵蓋的職場性騷擾問題，但依然還是能從中到一些東西。


  如果聖誕節降生的耶穌，是上天給予人民最好的救贖，那山繆也許就是蘿米在聖誕節中，

  一份意外且迫切需要的禮物；那杯在桌上的牛奶、那盤在地板的牛奶，是牧羊人給的養育

  ？還是山繆所渴求的母性之愛？在那最後虛實幻想中的高潮吼叫中，嶄露出蘿米可以是乖

  女孩，也可以是期待主人拿出餅干，等著被馴服的狗。



  ‧


  「觀影的樂趣在於能獨自在那裡冥想一刻鐘」





  --


  甘蝦，已修正

  手寫選字錯誤'
