url: https://www.ptt.cc/bbs/movie/M.1737296941.A.4CA.html
title: '[好雷]《乖女孩》：誠實面對內心的渴望 '
content: '雷文防雷資訊頁

  以下心得有部分劇情雷！



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  在觀賞《乖女孩》（Babygirl)之前，我沒有看過本片的電影預告

  完全是衝著三位重量級卡司：

  妮可基嫚、哈里斯狄金森以及安東尼奧班德拉斯的演技而去的。




  在今天觀影後，我給予本片好評

  很慶幸本劇的導演沒有浪費這三位主演的演技

  讓三位主角充分詮釋角色的人物設定。



  (圖片來源：IMDb)


  《乖女孩》可說是大女主電影，劇情圍繞著女主蘿米的戲份展開。

  不得不稱讚妮可基嫚在本片的演出

  她把事業有成的女CEO到渴望被粗暴支配受人擺佈...

  到最終誠實接受自己內心慾望的女性心路歷程演繹得很到位

  她能榮獲威尼斯影后殊榮實至名歸！


  《乖女孩》與《格雷的五十道陰影》同樣以「調教與支配」為主軸。

  不過在本片，性的掌控權不在上位「總裁」手中

  反而在「小鮮肉實習生」這方

  這樣的權力倒置可以展現出更多女主對於服從慾望與理智的掙扎

  整體呈現人物的內心比《格雷》更加寫實立體。

  最令我驚喜的是戲中竟然有搭配INXS的《Never Tear Us Apart》！

  這首歌也曾出現在《格雷的50道陰影：自由》電影中（由Bishop Briggs翻唱）

  同一首歌用來呼映兩部電影中沉淪情慾的男女主再適合不過。






  (圖片來源：IMDb)


  另外，哈里斯狄金森在本片的戲份也讓我十分驚艷！

  他和妮可基嫚的對手戲絲毫不遜色，能撐住支配者的氣場

  以四兩撥千斤的態勢從女主手中奪得掌控權；

  而讓有「拉丁情人」稱號的安東尼奧班德拉斯

  飾演無法讓妻子獲得性滿足的丈夫莫名有種黑色幽默XD


  綜上，《乖女孩》在各大影展頒獎季是具有獲獎潛力的佳作

  推薦給大家利用春節時間去觀影～


  P.S. 妮可基嫚快58歲了，依然維持纖細苗條的魔鬼身材

  真的超厲害，完全符合她戲中所說：「她不是普通女人」啊！


  --'
