title: '[新聞] 妮可基嫚《乖女孩》自願當鮮肉男星小狗'
content: '妮可基嫚突破生涯尺度！《乖女孩》自願當鮮肉男星小狗


  18:04 2024/12/27


  中時  杜欣穎




  妮可基嫚主演的情色驚悚片《乖女孩》將在台上映。（車庫娛樂提供）


  由奧斯卡影后妮可基嫚主演，於威尼斯影展獲得7分鐘熱烈掌聲，並勇奪最佳女演員后冠

  的情色驚悚片《乖女孩》（Babygirl）預告一出引發熱議，妮可基嫚在片中與飾演年輕實

  習生山謬展開一段禁忌關係，更有許多突破生涯尺度的表現，她坦言，從沒想過會在人生

  這個階段探索女性情慾。


  妮可基嫚在飯店房間表現如同守規矩的狗，尺度相當大，她說：「很多時候，女性在職涯

  的某個時期會因為性別而被拋棄，所以用這種方式被看見真的很美。從我讀到劇本的那刻

  起，我就想『這是我從未見過的聲音、從未去過的地方，我認為觀眾也沒有到過。』我的

  角色已經獲得了她這個階段所能擁有的所有力量，但她仍不確定自己是誰，她想要什麼、

  渴望什麼，儘管她似乎擁有一切。」


  她認為這部電影是一種釋放。


  導演哈琳娜瑞金也大讚妮可基嫚的敬業態度：「妮可從來沒想過要修改劇本，她真的臣服

  於這個企劃。」




  妮可基嫚與哈里斯迪金森在電影裡有許多令人臉紅心跳的場景。（車庫娛樂提供）


  片中有許多令人臉紅心跳的場景，因此與妮可基嫚上演對手戲的男主角尤其關鍵，本片飾

  演山謬的英國新生代演技男星哈里斯迪金森，以《黑魔女2》、《金牌特務：金士曼起源

  》的演出為人所知，2022年主演的《瘋狂副作用》更奪下了坎城影展金棕櫚，獲頒英國影

  藝學院電影獎明日之星，並曾執導過數支短片，身高188的他外型和才華同樣出眾，可謂

  目前影壇最炙手可熱的新星之一。


  當導演哈琳娜瑞金提出這個人選，妮可基嫚立刻就被收服：「我一看到他走台步的樣子，

  就知道他是完美人選，可以說他就是以山謬的形象出現。」


  兩人的互動相當親密，當被問及如何演出不同感覺的高潮場景時，妮可基嫚摀住臉說：「

  我還是臉紅！那太瘋狂了。但我認為這是一件好事。我對探索這些事情很感興趣，就像拉

  開神聖的帷幕。」


  而哈里斯迪金森也表示：「性愛的部分沒什麼問題，我們有很厲害的親密協調員協助拍攝

  。而哈琳娜掌握全局，了解每段場景的情緒及感受，所以我覺得實際拍攝的時候很輕鬆。

  」


  並表示自己相當景仰妮可基嫚，常常看她表演到入神。


  《乖女孩》預告結尾山謬在羅蜜完成他的指令後，稱讚她為「乖女孩」，讓眾多粉絲的內

  心瞬間沸騰，當被問到是否不希望粉絲要求找他說出這句心動台詞時，哈里斯迪金森表示

  ：「實際上，我不介意叫人家『Babygirl』。」


  讓一旁的導演和妮可基嫚感到相當驚訝。


  《乖女孩》故事描述一名位高權重的執行長與年輕實習生火熱外遇，將她的事業與家庭置

  於危險之中。




  妮可基嫚主演《乖女孩》，在坎城影展獲得7分鐘熱烈掌聲。（車庫娛樂提供）


  本片由《天黑請斃命》荷蘭導演哈琳娜瑞金自編自導，講述一段女強人與實習生之間關於

  支配與臣服的情慾探索之旅。


  《乖女孩》在今年獎季勢如破竹，獲得威尼斯影展金獅獎、哥譚獎最佳影片等多項提名，

  近期更一舉入圍金球獎戲劇類最佳女主角，奪冠呼聲極高，同時也是2025衝奧大熱門，外

  媒一片激讚更讓粉絲備感期待。


  《乖女孩》將於1月17日全台上映。




