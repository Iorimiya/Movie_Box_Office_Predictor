title: '[雷] 乖女孩觀後心得'
content: '先說我是為了妮可基嫚的演出進戲院

  如果只看演技的話免強算是普雷

  否則簡直慘不忍睹



  以下有雷






  這部片簡而言之就是

  中年婦女出軌最終找回自己然後充斥政治正確的電影


  電影圍繞在一個M屬性女主角（尼可基曼飾）

  在遇上鮮肉主角（哈里斯·迪金森）

  展開的一連串故事


  整場電影讓人看到一半就想離場

  除了劇情暗喻太粗糙

  包含主角在街上相遇、直接暗示女性渴望被愛憐與被支配的女主角

  以及角色定位模糊

  只是為了陪襯女主而硬塞的男主

  其餘角色幾乎不留空間給演員發揮


  剩下的只是所謂的「激情」片段


  整部片讓我以為在看台版八點檔


  只能說這是一部鼓勵婚後出軌的女性趕快回家坦承並且接受自己、老公和孩子以及家庭會包

  容並原諒


  整部電影打著尼可基曼還有有最大尺度的噱頭

  但是煮起來像一鍋雜燴、除了最後的「高潮」

  觀眾看完空虛不已


  --'
