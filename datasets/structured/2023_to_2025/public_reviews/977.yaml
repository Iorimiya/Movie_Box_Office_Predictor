url: https://www.ptt.cc/bbs/movie/M.1752125538.A.8B0.html
title: '[好雷] 《波紋》好雷影評：對待人的軟肋'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《波紋》好雷影評：對待人的軟肋\n\
  \n■ 無雷推薦語\n\n荻上直子非常擅長用奇奇怪怪的故事，寫非常深沉壓抑的悲傷。《波紋》除了剖開家人之\n間的不理解，也對「善良」做了我不停點頭的精妙詮釋。\n\
  \n（以下有雷）\n\n看《波紋》的時候，腦中一直冒出的問句是：什麼是善良？包括對他人和自己的善良。\n\n在這種探討善惡的電影中，通常會先讓你看到難搞、充滿地雷的刺蝟，後來再揭露苦衷，\n\
  帶出反差和反思。\n\n《波紋》也不例外。\n\n它描繪出沉迷於斂財宗教和報復念頭的妻子，以及多次逃離醫院的女同事。特別的是，前\n半段對於他們的傷痛與苦衷，近乎未提及，妻子遇到的家內性騷、被丈夫拋下的無助，都\n\
  用平鋪直敘或者簡短的畫面帶過。\n\n本來以為這是淡化，單純為後面的對比設計，後來我發現，這非常寫實。妻子與女同事，\n都用沉默和其他行動表達自己的悲傷。\n\n\
  \n「他們的心，死在那一天」\n\n後來女主角到住院同事的家帶走烏龜，看到凌亂不堪的家，忍不住哭泣，一直以來的防線\n終於潰堤。\n\n大地震帶走兒子的悲傷與孤單，女同事表達在對烏龜的份外疼愛；長年孤單持家的辛酸、\n\
  被公公欺負的委屈、對核電污染的擔憂，在丈夫離家那天，轉瞬化作女主角對宗教的偏執\n。\n\n他們的心都死在那一天。\n\n那激動的眼淚，是因為看到別人的苦衷，也藉機面對自己的心魔。\n\
  \n／\n綠命會的影片說：每個人都是水滴，我們的善舉會掀起漣漪，影響到周圍的人。\n\n，電影裡也有往這方向著墨。丈夫在死前終於願意陪妻子去\n一次聚會，也終於聽到了離家那天妻子的反應，妻子後來也花錢為丈夫治病。\n\
  \n善行與惡行都是波動，當我們交會，彼此的互動在水面形成波紋；當我們分離，水面會逐\n漸恢復平靜。\n\n《波紋》除了告訴觀眾：「每個人都有自己的苦衷，」要再加上一句「我也有我的。」\n\
  \n對自己善良\n，才不會被軟土深掘。\n\n默默付出、吞下委屈，結果還是不被丈夫和兒子理解，只看到為了解決焦慮與寂寞的宗教\n狂熱。\n\n也許我們應該向所愛的人坦露自己最非理性、荒謬的不安。但當怎麼溝通都是頭破血流、\n\
  彼此還是互相不理解的時候，不如暢快跳支舞吧。\n\n\n\n除了接納擁抱他人的弱點，彼此自轉祝福對方，也是一個善良的選擇。\n\n不同世界的兩個普通人，因觀念不同被彼此視為瘋狂。當你心中生起怨恨，請放下對這些\n\
  念頭的批判，畢竟想想不犯法。\n\n\n\n\n網頁好讀版>> \n\n\n>>荻上直子作品《河畔小日子》推薦<<\n\n\n–\n脆：\nIG：Fishpond_like\
  \ \n臉書：魚池 FishPond \n個人網站：\n\n--\n我有預感（？\n謝謝～唯一針對電影內容的回文XD"
