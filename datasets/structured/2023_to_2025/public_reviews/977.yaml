title: 〔包場〕6月1日《波紋》台北松仁威秀泰坦廳
content: '（代po)


  金馬奇幻影展觀眾票選獎最終排名第八名的電影《波紋》即將於全台上映，秉持著對日本

  電影的愛、對磯村勇斗的愛、對荻上直子導演的愛，我們聚集在此想合力完成這場大銀幕

  的放映，滿足沒能在奇幻影展看到泰坦廳的遺憾，這可能是唯一一場《波紋》的泰坦廳放

  映。歡迎看過的影迷朋友帶著新朋友前來二刷，也歡迎有興趣的朋友一同來體驗《波紋》

  的魅力。雖然距離上映還有一段時間，請大家踴躍報名，人數如果真的不理想只能忍痛換

  廳換地方了。


  台北松仁威秀泰坦廳包場報名連結：

  此連結也會同步放在我們instagram的個人檔案

  -----------------------------------------


  ▲活動日期：2024年6月1日(六)


  ▲活動地點：台北松仁威秀影城泰坦廳 (台北市信義區松仁路58號)

  泰坦廳目標391人，若未達包場人數門檻將會更換影廳甚至影院，屆時會再聯絡所有報名

  粉絲詢問意願，並退全額款項或差價，請務必提供正確的聯絡資訊


  ▲開演時間：預計13:00~15:00之間，具體時間待上映當週確認 (片長2時01分)


  ▲價格：400元/人 (不可使用預售套票)


  ▲劃位方式：依照付款順序由主辦方協助劃位，活動當日於現場排隊取票及領取特典


  ▲特典：

  神秘貼紙一款 (政駒提供之驚喜禮物)

  電影相關神秘特典 (非官方的自製週邊)

  日本版宣傳DM (數量有限送完為止)

  主要演員電影作品DM (數量有限送完為止)

  ...若有新增會再陸續公布


  ▲映後抽獎：

  《波紋》日版場刊1本

  磯村勇斗雜誌與作品相關週邊 (請於「為了誰來看這部電影的？」欄位勾選磯村勇斗，即

  有機會中獎)


  ▲注意事項：

  一、活動當週主辦方付款後若因個人因素不便出席，恕無法退款。

  二、電影開演後，為維持觀影品質，晚到者恕無法進場，請給予諒解，故請各位一定要提

  早取票。

  三、電影開演後到片尾字幕完全跑完前，請不要打開手機(建議關機)或任何3C產品影響其

  他粉絲觀賞電影，務必遵守觀影禮儀！

  四、映後於影廳內進行合影&抽獎約10分鐘。


  ▲當天會擺設*磯村勇斗祭壇*展示勇斗編的個人收藏，歡迎提早來觀賞拍打餵食(?)


  -----------------------------------------


  ▲另外 6月2日週日《波紋》也有高雄場的電影包場，報名連結如下：

  /qagJ9GvoLwZaLtuz5


  -----------------------------------------


