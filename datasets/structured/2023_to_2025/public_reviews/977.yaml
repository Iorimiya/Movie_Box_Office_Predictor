url: https://www.ptt.cc/bbs/movie/M.1739875212.A.97B.html
title: '[好雷] 波紋 (海鷗食堂的導演執導)'
content: '一直都很喜歡海鷗食堂

  但都不知道這導演有甚麼續作

  最近終於在藝術影院看到新作

  還是充滿這位女導演的喜劇風格

  以女性觀點看婚姻的觀點拍的片


  女主角是個已婚婦女

  每天在豪宅照顧公公做長照多年

  一直做到送走公公，她本身在超市打工

  老公在福島核災時跟別的女人跑了

  唯一的獨子則離家在九州念大學工作


  她的公公是大學教授

  死後留了大房子跟不少遺產給這個媳婦

  公公剛死不久，老公就跑回來了

  說自己得了癌症要跟太太要遺產治病


  太太說錢跟房子現在都是她的

  老公說要搬回來住，她也無可奈何

  太太問他說離家時都在幹嘛 ?

  老公說在當農夫，老婆問那個女人呢

  老公說沒了


  老婆就沒話說了，老公一回家就當大爺

  要老婆倒水倒酒，老婆一聽到就不爽

  拋家棄子還要我幫你這個混蛋倒水

  完全顛覆我們老外對日本女人的形象

  所以就倒一杯自來水怒氣沖沖的給老公


  老公跟兒子都離家時，他一個人照顧公公

  可能因為很孤單寂寞所以信了新興宗教

  是一個叫綠命會的信仰團體，把水當成神

  教大家要像水一樣乾淨清澈，所以都拜水

  在家裡供奉一顆大水晶球當作水滴來膜拜

  這些法器都是要錢的，還要買一堆綠命水

  都是好幾箱好幾箱當聖水大悲水來買的


  創會者是一個看起來像日本貴婦的阿婆

  會帶信徒們一起唱跳他們宗教裡的歌舞

  然後傳達水的信仰觀念，收入全靠捐錢

  還有一堆聖水跟周邊商品


  但太太的家裡也受到宗教的引響

  打掃的一塵不染，還有枯山水的庭園造景

  枯山水就是用砂鏟出水的波紋的日式庭園

  整個家就像是廟一樣非常的聖潔乾淨

  可見太太的信仰非常好


  而她在超市打工的清潔工的阿婆同事

  是常跟她一起午餐聊天的忘年之交

  也常一起去公共游泳洗三溫暖烤箱

  有天阿婆在游泳池昏倒被送去醫院


  她去阿婆家裡拿兩隻烏龜回家照顧

  還沒進門就出現惡臭，原來阿婆住在垃圾屋

  阿婆自己是清潔工，但家裡亂成垃圾山

  她發現阿婆的老婆跟小孩都死了所以很孤獨

  她就把兩隻烏龜拿回家在枯山水的沙畫上爬


  所以這些宗教雖然死要錢

  但對家庭生活還是有幫助

  不然應該也賺不到你的錢

  她如果也把家弄成垃圾屋

  她老公應該也不會想回家


  像她老公死賴在家裡當大爺

  她只能拿她老公的牙刷去刷水槽的汙垢

  這樣隔天看到老公拿牙刷刷牙就平衡點


  兒子有天跑回家帶一個女人說要結婚

  是她在九州認識的，32歲大兒子6歲

  還是失聰婦女，所以講話聲音不太正常

  媽媽看到就開始嫌棄這個媳婦，不想答應

  但媳婦說自己已經懷孕了所以侵門踏戶

  說如果媽媽不同意就帶你兒子回九州永遠不回來了

  媽媽看到老公兒子跟媳婦這樣對付她

  就開始努力膜拜水晶球希望能淨化心靈消業障

  老公說花我爸那麼多錢買這些水妳被邪教騙了


  但老公為了醫藥費不得已就跟老婆去信教

  在綠命會為了錢只好見人說人話見鬼說鬼話

  對信眾說的頭頭是道，老婆只得給錢治病


  但老婆看著點滴瓶的水滴，一滴就要十萬

  每滴一滴就10萬20萬30萬的用嘴往上加

  白色巨塔的醫療費比綠命會賣的水還更貴到爆


  老公在病床上就開始摸老婆的飛機場

  老婆說你跟你爸還真是親生父子

  可見她長照的公公也常會對媳婦毛手毛腳


  而且治癌症的錢好幾百萬花下去

  沒多久老公還是死了，錢也白花了

  最後葬儀社把老公抬棺抬出家時

  因為枯山水的石板不好走

  抬棺的人走一走就摔倒

  棺木就摔在枯山水上，屍體就翻出來

  太太就笑得很開心，葬儀社跟兒子都覺得瘋了

  但太太的確是看到老公死了才能真的鬆一口氣

  媳婦終於熬成婆，成為一家之主的慈禧皇太后


  兒子就叫媽媽跳以前最愛跳的佛朗明哥舞

  媽媽就在枯山水上川著黑色的和服跳西班牙舞

  很有海鷗食堂的感覺，只是海鷗食堂是芬蘭風情

  但這片是純正的日本片，但兩片都有游泳的橋段

  可見這個女導演很喜歡游泳


  日本電影以目前來講我最喜歡的導演就是北野武

  跟這位女導演荻上直子，期待她未來能有更多新作

  能像北野武、黑澤明一樣紅到歐美去當國際大導演


  結尾就是把水晶球神壇撤掉

  換上老公的骨灰當靈堂來貢俸

  也算是跟這個家族的血脈一脈相承




  --'
