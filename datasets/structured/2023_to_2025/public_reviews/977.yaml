url: https://www.ptt.cc/bbs/movie/M.1706496905.A.D88.html
title: '[好雷] 首爾之春~最後的波紋大家要把握'
content: '看之前版上好評 趁著最後場次還是入場

  真的是有夠好看 幾乎是這半年我覺得最好看的一部

  幾乎從頭到尾都沒有冷場 沒有一秒不刺激


  黃晟珉不愧是我最喜歡的韓國演員 連禿頭全斗煥都可以演成這個樣子

  鄭雨盛這幾年也幾乎成為韓影近代史劇的常駐名單

  不只是改編歷史 而且能改編的這麼好看 還這麼有商業娛樂價值

  那些雕琢過的攝影 分鏡 站位跟台詞...搞得鄭雨盛像是對抗薩諾斯的美國隊長

  只是結局不同 最後他那邊沒有政府軍Assemble

  然後劇情的情勢如果沒先讀過歷史 真的就是反轉反轉再反轉的刺激~


  除此之外 不只兩大主角 幾乎人人都有存在感 一堆硬底子演員

  不管是當時的副手盧泰愚 很機八保安局情報部中校

  闖進特戰部抓司令的那位 被霸凌的第二空降師旅長


  然後反對陣營盡忠職守的憲兵部 特戰部老大


  到讓人氣死的參謀次長跟國防部長(金義聖真的吃會演這種超想揍他的死老頭)

  當然老戲骨李聖旻總長被抓之前表現也是很精彩


  (但所以真的蠻意外 最後從總長到三大對抗首領 最後居然都只是勒令退伍沒殺掉)


  就算是插進來帥一下吸票房的李浚赫跟丁海寅 也都很有存在感


  民情不同 台灣大概也很難拍即便同樣都只是40來年前的近代史

  但所以真的很推把握最後機會 進去看一下

  去看那天以為沒人才要快下檔 沒想到小廳還有10來個人


  口碑好還是有差呀


  --'
