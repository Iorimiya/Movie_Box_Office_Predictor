url: https://www.ptt.cc/bbs/movie/M.1669719572.A.25C.html
title: '[情報] 筒井真理子主演《河畔小日子》導演新片《波紋》消息公開！'
content: '根據日媒的報導，台灣甫上映新作《河畔小日子》的日本女導演「荻上直子」將帶來另一

  部新片《波紋》。



  《波紋》由荻上直子親自編寫原創劇本，這回導演一改過往清新、溫暖的風格，將故事劇

  情聚焦在日本嚴重的新興宗教議題上，從釋出的特報影片中也可以看到較為驚悚的表現手

  法。


  女主角「須藤依子」是一位信奉新興宗教「緣命會」的中年主婦，每日在過著平穩生活的

  同時，也勤奮的祝禱和參與教裡的學習會。除此之外，依子每日早上必定在庭中照料「枯

  山水」，並在沙上畫上波紋。某日，依子失蹤多時的丈夫突然回到家中，並且讓社會中神

  秘的黑暗真實面隨之浮現，依子過去壓抑的情感也因而爆發。


  曾以《臨淵而慄》拿下日本多座影后的實力派女演員「筒井真理子」將在劇中飾演女主角

  須藤依子，其丈夫「修」則由資深綠葉男演員「光石研」演出。近來在《七五計劃》等多

  部電影中露面的「磯村勇斗」也將飾演兩人的兒子「拓哉」。除此之外則還有キムラ緑子

  、江口のりこ、平岩紙、柄本明、木野花和藤玉恵等多位演員參與演出。




  《波紋》預計 2023 年初夏於日本正式上映。



  --'
