url: https://www.ptt.cc/bbs/movie/M.1216718505.A.584.html
title: '[討論] 深夜加油站遇見蘇格拉底 名言'
content: "應該是無雷吧？(-.-) 僅僅分享佳句\n\n網誌圖文版 \n\n最近剛剛看完這部舊片，討論串也很少，在大家被黑暗騎士震撼力衝擊後，\n可以看看這部很不錯勵志性值得小品。以下就我所記的名句和大家分享\n\
  \n＊知識和智慧的不同處在於，智慧是身體力行的。\n\n＊拋開雜念，會對自己可以做到的事情嚇一跳。\n\n＊沉迷於過去榮耀的事，就是沒活在現在。\n\n＊每個動作進行冥想，放開多餘的束縛，擺脫令你沉迷上癮之物。\n\
  \n＊凡事均有意義，是否要去尋找他的意義，由你自己決定。\n\n＊從來不可能沒有事情發生，從來都沒有不平凡的時刻。\n\n＊你不可能更好，也不會比誰差。（恩～很玄）\n\
  \n＊習慣是個問題，你要對自己的選擇有自覺，並且負責任！\n\n＊每個行為皆有它的代價與樂趣，認知到這兩點，戰士會變的務實，負責任。\n（戰士在本片指你我吧）\n\
  \n＊死亡並不可悲，可悲的是有太多的人沒有真正活過。（很震撼力的一句話）\n\n＊最不容易被人愛上的，通常都最需要被愛。\n\n＊戰士不會放棄他的所愛，他在他所做的事中找到愛。\n\
  \n＊戰士並不是要盡善盡美，不是常戰常勝，也不是刀槍不入，他極其脆弱，\n  那才是唯一真正的勇氣。（很想接著大喊This is Sparta!）\n\n＊意外是你的訓練！人生是個選擇，你可以選擇成為受害者，或是你想成為的任何人。\n\
  \ （那我想當蝙蝠俠可以嗎？）\n\n＊戰士採取主動，傻瓜採取被動。（衝吧　阿斯拉！）\n\n＊從來沒有開始或是終止，只有過程（英文是說only doing）！（很喜歡這句）\n\
  \n＊如果你得不到你想要的你就會難受，甚至當你得到了你想要的，你還是難受。\n  因為你不能永遠擁有。\n\n＊生活有三條法則：矛盾，幽默，變化。\n　矛盾－生活是個解不開的謎，不要浪費時間試圖解開。\n\
  \n　幽默－保持幽默感，特別是自我幽默。\n\n　變化－懂得沒有事務靜止不動。（看著我的公仔，忽然覺得不寒而慄）\n\n＊旅程（過程）才是帶來快樂的地方，不是終點（結果）。\n\
  \n＊全心投入那一刻吧！\n\n\n本部片很大的重點在講活在當下，專心致志的道理。\n男主角挺會演的，是真的體操選手嗎？不然也太壯了吧！\n\n蘇格拉底這腳色也可以請　摩根費里曼來擔綱，不過他最近太累了。\n\
  一下子要去當蝙蝠俠的科技顧問，然後又要趕去刺客聯盟找新手。\n\n另外也要給這次中文翻譯拍拍手，英文原文片名叫做:Peaceful Warrior\n有矛盾的感覺，暨是戰士又得很和平，恩～看完就知道他的涵義了。\n\
  中文翻做　深夜加油站遇見蘇格拉底也很棒，很有意境。拍拍手！\n\n\n以上感謝收看\n\n\n--\n生活的沸點，生活的紀實。　\n\n\n\n--\n◆ From:\
  \ 125.224.88.182"
