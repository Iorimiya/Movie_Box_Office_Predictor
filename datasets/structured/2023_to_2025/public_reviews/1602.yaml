url: https://www.ptt.cc/bbs/movie/M.1509688534.A.700.html
title: '[好雷] 翻滾吧男人&深夜加油站遇見蘇格拉底'
content: "同樣是體操的主題\n        翻滾吧男人 與 深夜加油站遇見蘇格拉底\n\n        前者講面對失敗\n        後者講活在當下\n\
  \n        有意思的是後者是可以教育前者的\n\n        我就這樣問：\n        如果李智凱世大運沒有奪金，這部片還會不會繼續拍呢？\n\
  \        還是一直到2018亞運？2020東京奧運？直到奪牌為止？\n\n\n        如果金牌是終點，是必要之結果\n        那你說重要的又是什麼呢？\n\
  \n        其實過程才是最重要的\n        努力堅持的過程無法被量化\n        所以大家才會期待金牌、期待分數\n\n        記得深夜加油站遇見蘇格拉底有一段落：\n\
  \n        蘇格拉底帶著主角去爬山\n        說要帶他去看一樣很珍貴的東西\n        主角很興奮的一起去了\n        希望找到這個東西之後\n\
  \        他可以面對他失眠的問題(還有他的心裡的聲音)\n        路程遙遠艱幸\n        結果到了終點\n        蘇格拉底拿起地上的石頭說:這個給你\
  \ 這就是我想給你看的東西\n        主角說:蘇格拉底 你是認真的嗎? 我們走了這麼久 你卻只想給我看這個東西\n        蘇格拉底說:最重要的不是終點\
  \ 你這路程不是都很開心 覺得很美妙嗎?\n        主角思索了一下:是過程! 過程才是一切存在的理由\n\n\n        「過程才是意義所在。」\n\
  \                         ---《深夜加油站遇見蘇格拉底》\n\n\n        金牌很重要，但努力的過程一樣重要\n     \
  \   那些在你身上留下的傷痕與痛苦，都會留下來\n        相信自己可以的那份心情，在鞍馬上專注於自己呼吸的時刻\n\n\n        「This\
  \ Moment，Here , Now！」\n                            ---《深夜加油站遇見蘇格拉底》\n\n\n      \
  \  奪牌的感動，以及電影紀錄的過程都是很好的\n        挫敗感出現的時候，智凱默默無語\n        我想那個當下他是在跟自己對話，心智與他在打架\n\
  \        有很多的雜音在他心裡，他想說又說不出口的臭臉\n        看起來真的很無奈\n\n        雖然拿林教練比喻蘇格拉底不太好\n \
  \       但他們相似之處在於，都不會說好聽話 XDD\n        一樣都是給予體驗式的教育和引導\n\n\n\n        「你想要什麼導師，取決於你想要學什麼。」\n\
  \                               ----《深夜加油站遇見蘇格拉底》\n\n\n        黃克強的樂天與幽默，讓紀錄片不至於沉悶\n\
  \        小紅內褲也被完整紀錄下來，以及在宿舍打電動\n        與爸爸之間的互動，也是蠻有趣的細節 (黃爸爸是健身狂人)\n\n\n\n   \
  \     「幽默，尤其要能自嘲，這比任何方法都有效。」\n                               ----《深夜加油站遇見蘇格拉底》\n\
  \n\n\n         十五年的時間彷彿一轉眼\n         看完這部片你是否也檢視了這十五年來的變化？\n         人生本來就是充滿著矛盾，所以真的不用想太多，做就對了!\n\
  \         人生不過就是幾十個寒暑，活在當下\n         就跟智凱和克強一樣，翻轉在體操之間，繼續活耀在體壇吧！\n\n--"
