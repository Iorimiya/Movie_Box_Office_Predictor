url: https://www.ptt.cc/bbs/movie/M.1205590477.A.E23.html
title: '[影評] 《深夜加油站遇見蘇格拉底》為心靈加滿油'
content: '加油站，一個替愛車補充燃料的地方，眾所皆知。充滿燃料的車，既跑得好又跑得快；耗盡燃料的車，最後則淪為一堆爛鐵破銅。人們都知道要替愛車補充燃料，但是人們是否相對地遺忘，也必須為自身已經見底的「心靈」補充其燃料？


  在《深夜加油站遇見蘇格拉底》(Peaceful Warrior)當中，被男主角米爾曼(史考特馬其洛茲Scott Mechlowicz飾演)暱稱為「蘇格拉底」的這位加油站神秘老人(尼克諾特Nick
  Nolte飾演)，就扮演了「心靈加油員」這重要的心靈導師角色。


  初閱影片宣傳簡介，不免對這冗長又詭異的片名感到疑惑，再看劇情大綱，心中又暗忖該不會是部老套的體育勵志片。但種種猜測疑慮，直到觀影之後便瞬間灰飛煙滅，也赫然理解這中文片名的生花妙筆。細思《深》片之所以能夠跳脫體育勵志片既定框架的原因，就在於其中加進了「哲學思維」、「東方禪意」與「超現實想像」等等創意。隨著米爾曼這位體操運動員一次似真似假的奇遇，展開了一連串厚重卻又有趣、深沉卻也溫情的哲學之旅。



  學過哲學的人都知道，它並沒有一套標準答案，答案各在人人心中，必須倚靠自身苦悟去發掘其中涵義。就如同片中的蘇格拉底一樣，對於米爾曼的提問，永遠都以反問作結。隨著蘇格拉底的這些問題，觀眾也隨之進入一場心智與心靈的知性探索，企圖尋找出「人」活在這世界上的意義以及目的。片中的米爾曼，一如筆者在第一段所喻作的爛鐵破銅，縱使擁有俊俏臉龐、完美體態、優秀成績、富裕家境，然而卻還是於每個夜晚被惡夢驚醒。外在的虛榮，反映出他內在的貧乏，以此更可借喻為現代年輕人迷惘的心靈。那麼，「存在」是什麼？「人的價值」又是什麼？米爾曼越

  來越迷惘。而藉著蘇格拉底的循循善誘，米爾曼於是悟出全新的思想觀念：「活在當下，將個人意志凌駕於智慧之上。」這觀念，不僅適用於丹，更適用於普羅大眾。


  涉及哲學題材的電影，如果將基調過度背離大眾，稍有不甚便會走入雅套，令觀者疏離；如果再堆砌一些學院派的艱澀台詞，更是流於說教之嫌。幸好本片透過生活化的台詞，簡單扼要點明觀點；充沛的哲理密度，透過角色收放自如地傳達，於是顯得十分入勝，並不給人厭煩之感，反之心有戚戚焉，甚至不自覺莞爾一笑。


  本片之所以成功，除了良好劇情之外，導演維克多沙爾瓦(Victor Salva)更是功不可沒。執導過《毛骨悚然》(Jeepers Creepers)系列的沙爾瓦，於影片開頭就發揮驚悚專長，以超現實手法呈現出主角一段詭異的夢魘，著實給了觀眾一計下馬威。縱使筆者於觀影過程中數度感覺像在看驚悚片(音效真的太嚇人)，但依舊沉醉於導演那張力十足的敘事手法、精準的攝影構圖、復古的靛藍色調，以及適度的留白想像當中。全片沒有煽情的春風化雨灑狗血，有的只是無比真摯的情感及思維，使之成為筆者心中可閱讀性甚高的佳作之一。


  最後，筆者想與各位分享片中的一段對話：

  蘇：你身在哪裡？(Where are you)

  米：這裡。(Here)

  蘇：你身在何時？(What time is it)

  米：現在。(Now)

  蘇：你是誰？(Who are you)

  米：當下此刻。(This moment)



  這是影片結束前的最後一段對話，同時也是筆者最喜愛的一段對話。這六句話，如果沒有看過本片，或許會覺得平淡無奇，但等看完影片之後，自然就會通體領會其中意涵，感受到人生竟然是如此美好。《深夜加油站遇見蘇格拉底》替觀者已經匱乏的心靈補滿燃料，相信生命，體會稍縱即逝的當下，迎接即將來臨的挑戰，雖然體會各自不同，卻同樣都是點滴在心頭。







  --


  {寧可後悔做過的事.也不要後悔沒做過}


  --

