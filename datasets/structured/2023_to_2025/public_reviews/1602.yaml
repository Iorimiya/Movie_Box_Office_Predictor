title: '[極好雷] 深夜加油站遇見蘇格拉底'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~












  如果看一部電影可以讓你學到一點東西而且成長了

  那這部的確是一個很棒的作品


  無論有沒有蘇格拉底這個人

  最後他帶著dan去爬山那段


  了解自己所有正在進行的事物

  而且盡力去作好每個細節


  那件事情就是快樂

  就是生活


  lives out your live


  那個體悟就是dan所領悟到的

  "旅程"







  雖然片中一些豪洨片段

  不過那是導演想給dan車禍前後的一些對比


  彷彿你就跟dan一樣

  正在尋找自己 如何愛你所愛

  選你所選


  說出來都是雞湯

  實際上要做到卻是難上加難


  很棒的一部戲

  尤其是那塊石頭












  當tommy在上場前還在為了取悅裁判的那20秒而擔心

  為了拿下金牌如何改變自己的人生等等


  我想dan眼中所看到的 所體會的

  已經是完全不同的層面了


  大推!











  --





  --'
