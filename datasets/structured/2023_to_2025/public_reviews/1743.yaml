title: '[新聞] 【美麗的他電影版】萩原利久、八木勇征大'
content: '新聞網址：



  由萩原利久、八木勇征領銜主演的《美麗的他》，改編自2020年書店大賞獲獎作者凪良汐

  ，狂銷超過55萬冊的人氣BL小說傑作，更被觀眾封為「新一代日本BL劇天花板之作」。銜

  接戲劇版後續劇情的《美麗的他電影版》，也即將在4月7日於台灣、日本同步上映，讓兩

  位主人公的愛情邁入最終完結。近期積極參與宣傳打片的萩原與八木，也分別在上週五（

  3/24）與昨日（3/27）前往大阪與東京兩地，參與製作完成發表試映會。只見兩人一現身

  ，全場觀眾便陷入瘋狂尖叫，足見本片的超高人氣。兩人在大阪活動上，不僅用關西腔直

  呼「我超喜歡你」、「我愛你」緊緊抓住粉絲的心，在東京活動上，兩人更互相稱讚彼此

  的外貌，尤其現場還公開原著作者凪良汐寫給兩位演員的信，讓兩人聽著主持人閱讀的同

  時，不約而同落下感動的淚水。





  《美麗的他電影版》即將在台灣、日本同步上映，兩位男主角萩原利久、八木勇征也積極

  接受媒體訪問，並出席活動打片。兩人在上週五（3/24）前進大阪，參與製作完成發表試

  映會，一現身就獲得全場觀眾熱烈掌聲，讓八木害羞表示：「很高興能在這麼大的戲院裡

  舉辦活動，還有點緊張。」萩原也直呼有些坐立難安：「因為這是《美麗的他》一系列登

  台活動中，最大的會場。」當問及兩人在觀賞完電影後的感想時，萩原表示：「拍攝戲劇

  版第一季的時候，完全沒想到會拍成電影，因為是參與一年以上的作品，所以電影算是集

  大成之作，想要好好將這段旅程給走完。尤其這是大家在不斷嘗試錯誤之後，所製作而成

  的作品，所以能把在現場感受到的事物，進一步好好呈現出來，真是太好了。」八木也說

  ：「比起懷念的心情，我更想嘗試新的挑戰，因此在觀賞完成的作品時，我一邊單純地作

  為觀眾享受影像，一邊回想著拍攝過程，用不可思議的感情，觀賞了這部作品。尤其這次

  還能跟利久在《美麗的他》世界觀裡再次合作，真是非常愉快的回憶。」



  也因為兩人來到了大阪，當主持人問及「想說的關西方言」時，八木直接用關西腔說：「

  我超喜歡你！」只見萩原急著回應：「等一下，我也是想說這句！」於是補上一句：「我

  特別喜歡你！」萩原更還向觀眾席詢問要說什麼，觀眾席便不約而同傳來「我愛你」的大

  膽告白，讓八木也用關西腔說了「我愛你」，讓觀眾席再度爆出熱烈的歡呼聲。萩原也在

  大阪的活動最後說道：「這是一部越看越能讓人享受的作品，希望大家能多享受幾次。」

  八木也表示：「這部作品今後也會一直留存在我的心中。能夠跟利久相遇也是一個奇蹟，

  如果能得到大家的喜愛，我會感到非常幸福。」





  另一方面，在昨日（3/27）舉行的《美麗的他電影版》東京製作完成發表試映會上，只見

  萩原利久、八木勇征一上台就先互相稱讚。萩原稱讚八木的臉龐，無論何時都很美麗，讓

  對方不好意思地直說謝謝。而八木也說：「萩原的眼睛就像是黑豆一樣。」面對八木微妙

  的評論，萩原則反駁：「才不像黑豆呢，雖然最近很多人都說我眼睛像黑豆，但我一點都

  沒有這種感覺。」一席話也讓台下觀眾莞爾一笑。不僅如此，現場更公開原著作者凪良汐

  寫給兩人的信，讓兩人驚呼不已。凪良汐在信中表示：「當初聽到要改編真人化時，我真

  的很擔心要如何讓一個充滿女性夢想的虛構故事，出現在現實世界當中。不過等萩原先生

  和八木先生的選角一公佈，我的不安就完全消失了。兩人並排站著的樣子，正是《美麗的

  他》世界的本體啊。由萩原先生飾演的平良一成、八木先生飾演的清居奏，作為原著作者

  ，我感到無比幸福。不僅是我，兩位也給許多粉絲都帶來了幸福，讓我們看到如此美麗的

  夢想世界，真的非常感謝。」



  只見兩位男主角聆聽作者的這段話時，萩原不僅眼眶泛淚，八木更直接落下感動的淚水。

  八木表示：「真的很開心，腦海中閃現了不少的回憶，真的很高興也很感謝。有大家的支

  持，才有了第二季，還可以拍攝電影，把這部作品傳遞給大家，真的非常感謝。」萩原也

  語重心長地說：「我們也曾感到不安，原作真的很棒，要將這部作品給真人化，因為命名

  為《美麗的他》，想要呈現的視覺效果，或是角色的演繹，無論怎麼說，把這部作品給影

  視化都是非常困難的。多虧有非常棒的作者與團隊，還有觀眾們的包圍，才能夠走到這一

  步。」



  這部被封為「新一代日本BL劇天花板之作」的《美麗的他電影版》，即將在4月7日於台灣

  、日本兩地同步零時差上映。電影版劇情描述沉默寡言、在班上沒有朋友的平良（萩原利

  久飾演），對班上擁有無敵美貌、人氣爆棚的「國王」清居（八木勇征飾演）一見鍾情。

  幾經波折，兩人終於撥雲見日成為戀人，並展開幸福的同居生活。隨著大學即將畢業，平

  良開始擔任知名攝影師的助理，清居也成為新銳演員開始受到矚目，然而不想成為清居演

  藝之路絆腳石的平良，卻開始跟他保持距離…。將清居視為「神」一般尊貴存在的平良，

  和只想跟平良成為「普通戀人」的清居，因為無法填補不同想法所產生的隔閡，彼此的鴻

  溝也逐漸加深…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
