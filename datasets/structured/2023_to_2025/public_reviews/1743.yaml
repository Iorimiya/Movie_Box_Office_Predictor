title: '[新聞] 【美麗的他電影版】追加卡司4/7台日同映'
content: '新聞網址：



  由萩原利久、八木勇征領銜主演的超人氣BL作品《美麗的他第二季》，今日（3/1）凌晨

  一點已在friDay影音、MyVideo、GagaOOLala，以及將在明日（3/2）凌晨零點在中華電信

  MOD、HamiVideo與日本同步跟播最後一集，進入階段性完結，更將呈現兩位主角「平良」

  與「清居」舌吻到牽絲的火熱畫面，讓本集一舉衝上Twitter日本趨勢冠軍。製作團隊乘

  勝追擊，加碼甜進大銀幕，推出接續第二季後續劇情的《美麗的他電影版》，讓主人公的

  愛情也將邁入最終階段。發行商並正式宣佈電影版定檔4月7日，將於台灣、日本兩地同步

  零時差上映。此外，昨日（2/28）適逢萩原利久生日，八木勇征更在自己的Instagram上

  ，以「戀人視角」曬出萩原的睡顏照，並打上笑臉祝他生日快樂，而萩原看到也回應：「

  謝謝勇征！！！完全沒印象是什麼時候拍的。。。笑」八木則調皮再打上害羞符號回應：

  「那當然囉，因為你還在睡覺。」兩人一來一往的互動，也讓網友暈車直呼：「可以就地

  結婚！」「我的氧氣罩呢？」不僅如此，劇組今日更釋出電影版的首波劇照與追加卡司，

  將由曾主演《假面騎士》系列的「劇團EXILE」成員前田拳太郎飾演「桐谷惠介」；人氣

  音樂團體「世界末日」成員Saori的丈夫池田大，則飾演平良的攝影師助理前輩「香田」

  。





  由萩原利久、八木勇征主演的《美麗的他》，改編自2020年書店大賞獲獎作者凪良汐，狂

  銷超過55萬冊的人氣BL小說傑作。戲劇版《美麗的他第一季》自2021年11月起播出便引發

  轟動，不僅榮獲日劇銀河賞「MY BEST TV」，更獲2022年BL大賞「BEST映像部門」冠軍肯

  定，被觀眾封為「新一代日本BL劇天花板之作」。戲劇版《美麗的他第二季》也在今年2

  月播出後佳評如潮，每週都進入Twitter日本趨勢榜，最後一集更衝上日本趨勢榜冠軍。

  接續後續劇情的《美麗的他電影版》，則在今日（3/1）曝光首波劇照，其中可以看到清

  居忘我地從背後擁抱平良、平良深情地撫摸清居的手，更有熱愛拍攝清居的平良，以及清

  居轉身將目光投向平良的場面。此外，還有兩人在家中捏臉、共同頭埋棉被的甜蜜爆擊場

  面，讓人光看劇照就心跳加速。



  電影版除了集結萩原利久、八木勇征、高野洸、落合扶樹、仁村紗和、和田聰宏等戲劇版

  原班人馬，製作團隊更曝光追加卡司，由曾主演《假面騎士》系列《假面騎士Revise》，

  並在近期演出戲劇《女神的教室》五位主要學生之一的前田拳太郎，以清新魅力演繹跟清

  居同經紀公司的女前輩，她的人氣偶像戀人「桐谷惠介」。此外，曾執導人氣音樂團體「

  世界末日」多首歌曲MV，更是該團團員Saori丈夫的演員池田大，則飾演平良的攝影師助

  理前輩「香田」。





  對於有機會加盟演出《美麗的他電影版》，還得以登上大銀幕，前田拳太郎表示自己剛接

  到角色時，超訝異自己竟然是扮演人氣偶像：「演員與工作團隊的配合，以及拍攝現場的

  氣氛都非常好，讓我得以輕鬆演繹桐谷這個角色。希望透過電影傳達出桐谷的魅力，也請

  大家一定要進戲院觀賞。」池田大也表示：「我對兩位主演在戲劇版《美麗的他》的刻劃

  與趣味性感到印象深刻，所以很榮幸能以香田的身份參與電影版演出，也期盼觀眾能在戲

  院裡，體驗到這種希望一直持續下去的世界觀。」



  戲劇版《美麗的他第二季》，今日（3/1）凌晨一點已在friDay影音、MyVideo、

  GagaOOLala，以及將在明日（3/2）凌晨零點在中華電信MOD、HamiVideo與日本同步跟播

  最後一集。延續兩季劇情後續的《美麗的他電影版》，也即將在4月7日於台灣、日本兩地

  同步零時差上映。電影版劇情描述沉默寡言、在班上沒有朋友的平良（萩原利久飾演），

  對班上擁有無敵美貌、人氣爆棚的「國王」清居（八木勇征飾演）一見鍾情。幾經波折，

  兩人終於撥雲見日成為戀人，並展開幸福的同居生活。隨著大學即將畢業，平良開始擔任

  知名攝影師的助理，清居也成為新銳演員開始受到矚目，然而不想成為清居演藝之路絆腳

  石的平良，卻開始逐漸跟他保持距離…。將清居視為「神」一般尊貴存在的平良，和只想

  跟平良成為「普通戀人」的清居，因為無法填補不同想法所產生的隔閡，彼此的鴻溝也逐

  漸加深…。



