title: '[新聞] 【美麗的他電影版】勇奪台、日票房多冠王'
content: '新聞網址：



  由2020年書店大賞獲獎作者凪良汐，狂銷超過70萬冊人氣BL小說傑作改編，更被觀眾封為

  「新一代日本BL劇天花板之作」的《美麗的他電影版》，自上週五（4/7）於台灣、日本

  同步上映以來，目前在網路上完全「零負評」，更有不少台灣觀眾在觀賞過程當中，被兩

  位主角的愛情感動到淚灑戲院。這也讓本片在台灣、日本兩地的票房雙雙告捷。台灣部分

  ，不僅打破今年至今所有在台上映的真人日片票房紀錄，成為「今年至今最賣座的日本真

  人電影」，更在開片票房創下佳績，成為「亞洲電影纇開片票房冠軍」。日本方面，本片

  不僅勇奪「新片票房冠軍」，更在指標性電影網站「Filmarks」上奪下「初日滿意度冠軍

  」，多項冠軍也證明本片叫好叫座的超人氣。票房告捷也讓台灣片商順勢公佈第二、三週

  的「戲院限定入場特典」（）。此外，兩位

  主角近期也積極宣傳，上週末更與導演酒井麻衣參與日本的首映謝票活動。導演並透露如

  果再與兩人合作，想要挑戰懸疑類型，更強調：「萩原在劇情中段一定要墮落。」





  由日本新生代男星萩原利久、八木勇征領銜主演的超人氣作品《美麗的他電影版》，台灣

  上映三天便收穫近90萬票房，不僅成為首週末「亞洲電影纇開片票房冠軍」，更打破今年

  至今所有在台上映的真人日片票房紀錄，成為「今年至今最賣座的日本真人電影」。日本

  票房也同樣告捷，短短三天吸引近10萬觀眾入場，票房狂收1.42億日圓（約新台幣3280萬

  元），順利奪下日本「新片票房冠軍」。許多觀眾在觀賞後，紛紛在網路上留言：「絕對

  是近兩年的最愛神作！」「帥到瘋掉！好笑到瘋掉！」「全程姨母笑+讚嘆！」「兩個小

  時嘴角沒有下來過，看完當下覺得人生真快樂！」「誠意和色氣都滿點！畫面和音樂也滿

  分！」等好評盛讚。尤有甚者，不少觀眾更在觀賞過程中，被兩位主角的美好愛情給數度

  逼出淚水，這也讓本片以幾乎「零負評」的態勢，在網路上拓展極佳口碑。片商也積極呼

  籲已經觀賞過的觀眾，踴躍傳遞這部電影的感動與口碑，讓更多觀眾一同見證「平清CP」

  兩人美好的愛戀！



  此外，為了感謝台灣觀眾熱烈支持，片商也緊急公佈上映第二、三週的戲院限定入場特典

  。只要在本片上映第二週（4/14-4/20）購買本片電影票乙張，就有機會得到「電影限定

  明信片-合體款」。上映第三週（4/21-4/27）購買本片電影票乙張，就有機會得到「電影

  限定明信片-Q版角色款」，數量有限，送完為止，詳細活動辦法請見官方公告（

  ）。





  另一方面，《美麗的他電影版》兩位男主角萩原利久、八木勇征，上週末也與導演酒井麻

  衣共同參與日本的首映謝票活動。當主持人問導演目前的心情如何時，卡在「平清CP」之

  間的導演無奈笑稱：「我也不知道為什麼，會出現在他們兩人旁邊…。」此外，有人問到

  兩人演繹出來的感覺，是否跟導演想得一模一樣？萩原率先笑稱：「看來要變成反省會了

  。」導演則是力讚兩人的演技，比她想像中更好：「我最訝異平良給清居拍照的場面，只

  有平良才能拍出那樣的清居。」這也讓飾演平良的萩原表示：「導演經常讓我們自由發揮

  ，也正因為這樣，我們才能有各種嘗試，也偶爾覺得會不會演得太超過，但我們知道，無

  論怎樣演，導演都會呈現出最好的效果，讓我們彼此產生了信賴感。」八木則表示：「從

  讀本開始就有各種交流，對於如何演繹情感變化也獲益良多，所以第一次主演的作品，就

  是跟酒井導演合作，這真是太好了，能跟利久合作也真是太好了。」



  此外，也有人詢問導演，如果跟萩原與八木再度合作，會想要拍攝什麼類型的作品時，導

  演則透露想要挑戰懸疑類型：「想拍那種對立的戲，兩人原本是親友，但是萩原到後來開

  始墮落變得陰鬱，直到最後高潮戲時，八木則遇到危機，這時萩原還是選擇來救他，卻又

  在對方醒來之前悄悄離開；等八木醒來之後，四周已經沒有人了…。」腦洞大開的劇情，

  導演也強調：「萩原在劇情中段一定要墮落。」而八木反問觀眾想不想看時，更是獲得全

  場熱烈掌聲。



  這部榮登台灣今年至今最賣座真人日片，並被封為「新一代日本BL劇天花板之作」的《美

  麗的他電影版》，目前正在台灣好評熱映當中。本片劇情描述沉默寡言、在班上沒有朋友

  的平良（萩原利久飾演），對班上擁有無敵美貌、人氣爆棚的「國王」清居（八木勇征飾

  演）一見鍾情。幾經波折，兩人終於撥雲見日成為戀人，並展開幸福的同居生活。隨著大

  學即將畢業，平良開始擔任知名攝影師的助理，清居也成為新銳演員開始受到矚目，然而

  不想成為清居演藝之路絆腳石的平良，卻開始跟他保持距離…。將清居視為「神」一般尊

  貴存在的平良，和只想跟平良成為「普通戀人」的清居，因為無法填補不同想法所產生的

  隔閡，彼此的鴻溝也逐漸加深…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
