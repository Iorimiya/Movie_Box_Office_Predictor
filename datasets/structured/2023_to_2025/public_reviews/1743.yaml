title: '[新聞] 【美麗的他電影版】平清CP激愛尺度大升級'
content: '新聞網址：



  日本新生代男星萩原利久、八木勇征，兩人在超人氣BL劇《美麗的他》當中，展現出獨一

  無二的愛戀形式，不僅在日本，更在亞洲各地掀起狂熱。尤其日前戲劇版第二季播出完結

  篇，兩位主角熱吻到牽絲的畫面，更讓本作一舉空降推特趨勢冠軍。為了回應廣大粉絲期

  待，延續後續劇情、甜進大銀幕的《美麗的他電影版》尺度將飆車式提升，不僅將祭出霸

  氣撲倒、裸身滾床、鴛鴦共浴，甚至還有在氤氳繚繞中壁咚濕吻的激情開車場面。導演也

  絲毫沒有浪費八木勇征的精壯身材，將讓他在片中大秀飽滿胸肌、腹肌，勢必讓人看到血

  脈賁張、嘴角失守，甚至不禁尖叫，可說是近年來最有誠意的真人BL電影。尤其本片將在

  本週五（4/7）於台灣、日本同步上映，兩位主角更在百忙之中為台灣觀眾錄製影像留言

  ，除了用中文向觀眾問好，更期待大家都可以進戲院迎接主角「平清CP」即將成為永恆的

  愛戀。（）




  由萩原利久、八木勇征領銜主演的《美麗的他》，改編自2020年書店大賞獲獎作者凪良汐

  ，狂銷超過70萬冊的人氣BL小說傑作，更被觀眾封為「新一代日本BL劇天花板之作」。劇

  情描述沉默寡言、處在班上最底層又總是孤獨一人的「平良」，與在班上宛如國王一般、

  充滿極致之美又高冷的領導人物「清居」，兩人細膩又熱烈的愛情故事。而銜接戲劇版後

  續劇情的《美麗的他電影版》，也即將讓兩位主人公的愛情邁入最終完結。對於電影版當

  中的兩人關係，飾演「清居」的八木表示：「讀劇本的時候，感覺清居變成熟了，並不只

  是單方面去迎合平良，而是拉扯著對方，讓他跟自己走在相同的節奏上，這也是我在演出

  時最重視的一點。」萩原則說：「基本上，平良沒有太大變化，再度詮釋的時候，雖然並

  沒有下意識要特別去改變的地方，但這回更要表現出他與清居心意相通的前後差異。」萩

  原並進一步透露電影版的表演細節：「雖然對清居死忠的心態沒有改變，但他在戲劇版的

  表達方式相當侷限，而在電影版當中，兩人心意相通了，詮釋方法的幅度也跟著拓寬，可

  以從好多種正確的表演方法中，找到最合適的那一種，這也是和劇劇版演出最不同的地方

  ，同時讓我感受到難度。」



  對此，導演酒井麻衣也深表同感：「這也是兩人非常難表現的地方，因為好像成為戀人，

  又好像沒有。在戲劇版最後一集，他們有情人終成眷屬，但我個人卻感受不太到。在那之

  後，我想他們大概也不會有『我們終於兩情相悅了啊』這樣的想法。因為距離當時拍攝最

  後一集，已經間隔滿長一段時間，所以我對萩原與八木表達：『我想刻畫兩人在那之後，

  隨著歲月流逝後的模樣。』」導演同時也透露這回執導電影版，將更著重在畫面經營上面

  ：「希望包括攝影在內，能讓觀眾在銀幕上感受到本作的世界觀，從畫面中散發出兩位主

  角的氛圍。這次的電影主題之一是『兩人為了要永遠在一起，該怎麼辦才好？』我本身也

  強烈祈禱兩人都要永遠幸福！我覺得不論平良還是清居，兩人都是『美麗的他』，在感受

  兩人戀情的美好同時，該如何用畫面來展現彼此的情感，也是我追求的拍攝目標之一。」





  《美麗的他》可說是萩原利久與八木勇征的演藝生涯代表作，兩人也透過本作成為無話不

  談的好友。當問到兩人認為對方「什麼地方最美麗」時，八木表示：「利久的手指很漂亮

  ，手指很長，指甲也大，而且關節也很突出，感覺很有男人味。」八木更補充：「我也喜

  歡他的脖子，好羨慕他凸出的喉結，因為我的喉結並不明顯，好想要有這樣的喉結。」萩

  原聽到則害羞表示：「勇征最美麗的地方就是肌肉了吧，尤其胸肌特別棒。不過在能夠飾

  演清居這角色的前提下，他已經是美麗的綜合體了，就連站姿都非常漂亮。」八木則針對

  站姿補充：「我一直都覺得，清居並不是站姿筆直的那種類型，正如貓雖然捲曲著身體，

  但不經意還是可以感受到優美的姿態，我就是想像著貓的模樣，讓呈現曲線的身體仍能展

  現出漂亮的樣子，而且清居的個性也很像貓。」



  這部被封為「新一代日本BL劇天花板之作」的《美麗的他電影版》，即將在本週五（4/7

  ）於台灣、日本兩地同步零時差上映。本片不僅空降Yahoo!電影戲劇「網友期待榜」冠軍

  ，珍藏電影預售票目前更在「博客來售票網」熱賣中（

  ）。本片劇情描述沉默寡言、

  在班上沒有朋友的平良（萩原利久飾演），對班上擁有無敵美貌、人氣爆棚的「國王」清

  居（八木勇征飾演）一見鍾情。幾經波折，兩人終於撥雲見日成為戀人，並展開幸福的同

  居生活。隨著大學即將畢業，平良開始擔任知名攝影師的助理，清居也成為新銳演員開始

  受到矚目，然而不想成為清居演藝之路絆腳石的平良，卻開始跟他保持距離…。將清居視

  為「神」一般尊貴存在的平良，和只想跟平良成為「普通戀人」的清居，因為無法填補不

  同想法所產生的隔閡，彼此的鴻溝也逐漸加深…。



  欲知本片最新消息，

