title: '[新聞]鐵粉40刷<美麗的他電影版>,萩原利久曝這袋'
content: '新聞網址：



  目前正在台灣、日本同步上映的人氣BL電影《美麗的他電影版》，台灣累積票房已經直逼

  200萬，持續穩坐今年至今最賣座日本真人電影。日本票房也同樣勢不可擋，上映10天吸

  引近19萬觀賞人次，累積票房已經超過2.6億日元（約新台幣5900萬元），甚至還有鐵粉

  驚人40刷，展現本片的超高人氣！男主角之一的萩原利久，昨晚（4/18）應邀出席位在東

  京的熱賣謝票活動，不僅分享自己承襲前輩松坂桃李的方法，會把所有私人物品都裝在便

  利商店的塑膠袋中，一直把塑膠袋用到爛掉才會更換，甚至還透露在盛夏拍戲時，會給劇

  組全員買水喝，體貼行為也受到眾人愛戴。尤其現場更請出人氣角色「鴨鴨隊長」助陣，

  作為驚喜嘉賓現身，讓萩原為之興奮，也讓他在活動後，興奮地在自己的社群上貼文紀念

  ，吸引另一位無法到場的男主角八木勇征開玩笑回覆：「你不知道我在裡面嗎？」





  《美麗的他電影版》日本票房告捷，男主角之一的萩原利久，昨晚也應邀出席熱賣謝票活

  動。雖然「平清CP」另一位男主角八木勇征有事無法到場，讓萩原單打獨鬥，不過當主持

  人問及熱賣的證明時，萩原霸氣回應：「光看我今天一個人站在這裡就是證明。」他也感

  嘆：「平時我旁邊都有一個人（意指八木），沒想到會有這天，我居然要一個人站上舞台

  問候了。」不過他在現場並不孤單，劇組邀請到片中人氣角色「鴨鴨隊長」助陣，作為驚

  喜嘉賓現身，讓萩原為之興奮，甚至對著它驚呼：「好大！」只見鴨鴨隊長扭腰擺臀沒多

  做發言，還是讓萩原直呼好可愛。



  也因為首度跟「巨型鴨鴨隊長」相會，讓萩原事後在自己的社群上留言笑稱：「見到了鴨

  鴨隊長，雖然尺寸跟我記憶中的有點不一樣。」只見貼文一出，八木勇征立刻開玩笑秒回

  ：「你不知道我在裡面嗎？舞台問候辛苦了。」也讓萩原繼續回問：「那你為什麼不發出

  『呱』的叫聲呢？」八木再回：「這樣就露餡啦。」兩人雖然無法在現場實際互動，不過

  透過網路一來一往留言，也讓網友笑稱：「兩人真的好有愛！」值得一提的是，在昨晚活

  動上，也同時對觀眾進行調查。當問及觀眾看過本片多少次時，很多人舉手表達五次甚至

  十次，不過更有粉絲說自己已經看過40次了，也讓萩原驚訝表示：「太驚人的次數，真的

  很感謝！」





  此外，萩原利久在昨晚的《美麗的他電影版》謝票活動上，也透露自己都會拿著便利商店

  的塑膠袋，裝著自己的私人物品直接去拍攝現場：「就像手機、錢包、鑰匙、劇本，我會

  把所有東西都放在一起，而且之後還會重複利用塑膠袋，直到它壞掉為止。這是受到經紀

  公司前輩的影響，松坂桃李也是這樣。」而且本片是在盛夏拍攝，萩原甚至給劇組全員買

  水喝，可說是相當大的水量，他對此表示：「這是真的，但主要還是自己渴了想喝。因為

  經常在優秀的環境中，被人們溫柔對待，所以也想要對別人好。」不浪費又待人和善的態

  度，讓他因此受到劇組眾人的愛戴。



  這部榮登台灣今年至今最賣座真人日片，並被封為「新一代日本BL劇天花板之作」的《美

  麗的他電影版》，目前正在台灣好評熱映當中。本片劇情描述沉默寡言、在班上沒有朋友

  的平良（萩原利久飾演），對班上擁有無敵美貌、人氣爆棚的「國王」清居（八木勇征飾

  演）一見鍾情。幾經波折，兩人終於撥雲見日成為戀人，並展開幸福的同居生活。隨著大

  學即將畢業，平良開始擔任知名攝影師的助理，清居也成為新銳演員開始受到矚目，然而

  不想成為清居演藝之路絆腳石的平良，卻開始跟他保持距離…。將清居視為「神」一般尊

  貴存在的平良，和只想跟平良成為「普通戀人」的清居，因為無法填補不同想法所產生的

  隔閡，彼此的鴻溝也逐漸加深…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
