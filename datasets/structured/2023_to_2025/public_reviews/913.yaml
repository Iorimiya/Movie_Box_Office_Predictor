url: https://www.ptt.cc/bbs/movie/M.1720831505.A.C87.html
title: '[好雷] 飛月情海'
content: "雷文防雷資訊頁\n\n\n\n\n\n\n\n\n以下有巨雷！（很重要所以講3次）\n\n\n另外這純粹是個人超主觀觀影心得，如果您的看法與在下不一樣，一定是我看電影濾\n\
  鏡太厚的關係。\n\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n雖然在忙別的事情，但還是忍不住來推一下飛月情海這部片\n先說我當時想看就是因為史嘉蕾和查寧都是我喜歡的演員，我就是衝著兩個主角的\n\
  顏質去的。\n\n飛月情海的時間大概是在「關鍵少數」10年前後，也就是約翰葛倫成功進入地球軌道後\n大約十年內，美國太空總署遭遇瓶頸，但仍克服困難成功登月的故事。\n\
  \n（當年由葛倫‧鮑威爾飾演，對，就是捍衛戰士獨行俠裡面的劊子手，下個星期三換\n他的龍捲風暴上映，我好期待啊啊啊啊啊）\n\n\n\n這部片的內容就是在講擅長公關的凱莉，如何幫NASA熱話題，製造輿論，爭取到資金\n\
  繼續推動登月計畫的過程。\n\n雖然這部片基本上走小品路線，但是可以讓人們意識到「為善必須人知」\n之前NASA經歷一連串的失敗，加上內憂外患，很多人主張停止登月計畫，\n\
  政府希望至少能成功登月，在冷戰時代取得更優勢地位，所以政府派凱莉去裡面負責\n炒熱話題的工作，這也讓裡面這些只會埋頭做事、不知道怎麼行銷自己的工程師們\n很困惑。\n\
  \n雖然非行銷或公關出身，但同樣在講行銷，之前講Nike的「AIR」著重在\n爭取到麥克喬丹作他們的廣告球星；這部這是講將NASA重新推包裝、製造話題、爭取資金\n\
  把他們推到到人們的視野裡，讓人們重視到他們做的事情，承認他們做的事情意義重大，\n進而爭取到足夠的支持與資金來繼續計畫。\n\n我先說我無腦支持凱莉在這部片裡面的每一個造型，因為實在太美了！\n\
  （以下重複一萬次）\n這部片光是看凱莉換造型我就覺得好幸福QQ，孔雀色或桃紅色套裝不說，\n連那種很浮誇的橙色造型，或者鵝黃色水手服領洋裝，反正史嘉蕾沒有不美的！！\n\
  每個鏡頭都很美（朝天大喊）\n\n她的專長是行銷，她也常自嘲她都在騙，但是她在做行銷企畫的用心，對潛在客戶的深\n入調查，面對客戶時針對對方喜歡或感興趣的話題用心準備，可以看得出來她\n\
  既然付出心力就有努力成功的企圖心。\n\n凱莉是每個社畜的縮影（個人觀感，拭淚），只要接到工作，不管她喜歡與否，\n比如說她被逼得去要拍一個假的登月影片，她其實不願意做這件事情，但\n\
  \n但是一旦投入就全力以赴，鍥而不捨、一而再再而三地提出各種計畫與備案。\n想辦法克服各種困難，最後連柯爾都忍不住稱讚她，連地上的月球灰塵都做得這麼逼真XD\n\
  \n她這樣的毅力和能力，難怪能在事業上屢創佳績。\n\n\n史嘉蕾本來就是超女神美貌，加上那個年代的同色系衣、飽和鮮豔的色系，\n的套裝或連身裙、凱莉撐起每一套造型，讓她看起來野心勃勃又青春靚麗，\n\
  人們一看她就知道是個厲害角色，也知道她有所目的而來，但她\n就是會讓人們打從心理喜歡她。\n\n\n另外講一下，飾演男主角的查寧塔圖沒那麼多衣服好換（：D）不過，\n\
  我本來也就是為了看他才注意這部電影的。\n\n查寧塔圖一開始因為之前的意外事故，顯得非常陰鬱、封閉，而在穿著打扮上，\n為了顯露他跟其他工程師（白上衣黑領帶）不一樣，多少有些變化。\n\
  \n在穿著打扮上，查寧塔圖飾演的柯爾戴維斯很Star trek，因為他經常穿著黃色或深藍色\n線衫，基本上那就是星際迷航（或稱星際爭霸戰）裡面艦長和（指揮部門）和科學官的制\n\
  服顏色。反倒是穿正式制服或西裝的場景很少。\n\n阿不過查寧塔圖雖然是猛男身材，但線衫太薄，都會看到裡面搭配的吊嘎\n\n（星際爭霸戰裡面的上衣很顯然比較厚，有毛絨感，不會出現這種裡面有吊嘎的FU）\n\
  \n\n他在裡面擔任登月計畫的主管，因為自身身體狀況不能擔任太空人，又因為之前的阿波\n羅一號意外事故非常自責，所以把所有工作都投入在登月計畫裡面，所以他顯得處於保\n\
  守、不喜歡被過度包裝。\n\n這種實事求是的精神，跟凱莉那種隨時抓住時代潮流、推送人們感興趣話題的作風\n是截然不同的，所以在這部片裡面當然有很多衝突（不過都被淡化了）\n\
  這部片與其說是愛情片，不如說是兩個不同工作領域的頂尖人是因為合作共同計畫而一起\n努力、一起達成目標的過程，其實戀愛場景很少～～～\n\n\n但是裡面他也是有耍帥的部分，比如說開飛機去議員家吃飯那段：D\n\
  （但這部片我想到的是捍衛戰士獨行俠，湯湯是真的開自己飛機喔）\n\n但是他裡面代表的就是一種不屈不撓，努力達到高遠目標的那種精神，也是整個NASA\n對於登月計畫的執著，我想這也是為什麼他選擇以這兩個造型強化他的形象：\n\
  \n因為星際爭霸戰裡面最有名的一段就是由柯克艦長朗誦的一段話\n\n\n\nSpace, the final frontier. These are the voyages\
  \ of the starship Enterprise.\nIts five-year mission: To explore strange new worlds.\
  \ To seek out new life\nand new civilizations. To boldly go where no man (後來改成one)has\
  \ gone before\n宇宙，最後的邊疆。這是星艦企業號的航程。它的五年任務，是去探索這未知的新世界，\n找尋新的生命與新文明，勇踏前人未至之境（資料引自維基百科）\n\
  \n（「勇敢踏上前人未至之地」意義非凡，且頗有淵源，後來NASA在出版阿波羅回憶錄\n甚至又反過來引用了這段話）\n\n\n\n對整個NASA而言，數十萬人凝結智慧、精力與青春，直至阿姆斯壯踏上月球後所說的那\n\
  句話，就是他們承載夢想的那艘太空船，飛越天空，到達他們夢想所至、甚至往後更\n遠的地方。\n\n整體來說，這部片其實是一部輕鬆小品片，並沒有太黑暗的部分，就連逼凱莉接案子的\n\
  莫（由伍迪‧哈德遜），都有種星際迷航劇集討厭鬼Q的喜感，尤其他最後回答凱莉的\n問題時，真的讓人有點毛骨聳然：D\n其他的配角，比如工程師兩人組、或者超強助理小妹都很可愛！！！！！\n\
  \n\n非常建議大家週末有空看這部片，就算劇情是輕喜劇，光看史嘉蕾和查寧就很值回票價了！\n\n--\n江山易改，本性難移；江山縱改，本性不移。\n\n--\n\
  \n我覺得他主要是講當年太空總署在行銷部分的努力\n\n確實擔心它很快下檔，所以忍不住要推，光史嘉蕾的美貌就很值回票價\n\n\n感謝提醒，已經修正錯字。\n\
  這部片當然會受限於當時的一些觀念，比如凱莉第一次進去時，以三個男主管為是應徵\n打字員，或者深膚色的研究員和工程師好像沒有很多，但是因為劇情重心的關係\n是比較淡化，但我覺得這是好事，它就是抓住自己要講的點去發揮這樣。\n\
  \n\n 07/13 17:24"
