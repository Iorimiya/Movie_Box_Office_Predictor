url: https://www.ptt.cc/bbs/movie/M.1720605766.A.B3A.html
title: '[好雷]  飛月情海'
content: '防雷





















  是我喜歡的任務片種類   愛情不用太多 點綴就好


  類似關鍵少數跟絕地救援這樣


  本片也不用介紹到底怎麼升空  工程師職務  反正就是要飛  要廣告    拿錢這種人與人的方面的任務也不錯


  一條龍也沒額外生支    也沒有複雜的介紹  完全沒有理工畫面  就是要飛



  不過 為什麼男主角這個指揮官總是穿得跟別人不一樣  是故意讓人一臉就知道是主角 還是史實就是這樣呢？



  最後要吐嘈 ...莫他們的阿提密絲計畫應該是錄影完登月再放送啊  怎麼是同步直播.... 本劇最吐嘈的點      直播比完成任務還不可控吧  設備出包  人物出包之類的


  最後讓那隻貓做事...不過那隻貓有點假  可惜



  本來很期待他們要怎麼   追焦登月艙離開月球的那幕 結果就沒了    之後直接安全回地球   可惜...

  本片結束


  總體是好看的  而且史嘉蕾超好看  <3


  -----

  Sent from JPTT on my Sony XQ-EC72.


  --'
