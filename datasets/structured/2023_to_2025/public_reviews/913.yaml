url: https://www.ptt.cc/bbs/movie/M.1720991463.A.167.html
title: '[討論] 飛月情海-黑寡婦怎麼出賣月球'
content: "個人心得:  阿波羅13,關鍵少數,登月先鋒  沒著墨的部份\n\n\n黑寡婦怎麼出賣月球\n\nThe Women Who Sold the\
  \ Moon\n\n1969年 NASA阿波羅11登月的黑色喜劇\n\n特效:\n1.火箭發射升空\n2.登月(真假都有)\n\n比入場前預期要好\n這部片被片名,海報,預告給耽擱了\n\
  個人覺得啦...\n\n下面可能會劇透劇情  點閱慎入\n\n\n\n\n\n\n\n\n沒啥人提 但是驚喜蠻大的\n伍迪哈里遜!!!\n\n伍迪在哪裡? (喂)\n\
  \n伍迪哈里遜這次的角色是謎之黑衣男\n\n\n\n召募凱莉瓊斯(黑寡婦) [本圖中]\n加入NASA跟火箭發射總監柯爾(查寧塔圖) [本圖右]\n並肩作戰\n\
  \n\n幫NASA行銷登月\n向參議員爭取阿波羅登月計畫經費\n\n還有黑衣男確保登月直播畫面的備案計畫\n怎麼個\"確保\"怎麼\"備案\"\n這就是本片最好玩的地方\n\
  登月(真假都有演到)\n\n0\n\n那幾部電影沒拍到\n 但是很魔幻又很現實的場景\n\n眾所周知 NASA在佛羅里達有火箭發射場\n本片連佛羅里達另一有名特產\
  \ 鱷魚都拍出來了!\n又是火箭 又是海  又是鱷魚 的奇妙景象\n\n1.\n\n\n\n男女主角的服裝配色\n實在很難不跟Star Trek多作聯想\n看得我都以為他(她)們在演Star\
  \ Trek\n\n\n我在23世紀等你們喔~\n\n\n2.\nWhere no man has gone before\nwiki上有專門詞條...\n\n\
  \n\n部落客 Dwayne A. Day 表示，這句話摘自《外層空間簡介》，這是一本白宮於 1958 年\n出版的小冊子，目的是在人造衛星發射後為國家太空計劃爭取支持。\n\
  \n然後有部影集引用後發揚光大後又是另個故事了\n不過那篇文章都有介紹就是了\n\n3.\n看到水果店影這標題\n\n\n讓我想到某部水果頻道上的影集\n\n\n\
  特別是第1季60年代的時候\n\n\n--"
