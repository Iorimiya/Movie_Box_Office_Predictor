title: '[好雷] 飛月情海'
content: '防雷






































  聽說票房超級慘淡,正好蘋果串流免費就來看

  沒到很好看但一點都不難看

  真要說最大的缺點就是片長超過兩小時

  講故事不夠有效率跟俐落,110分鐘上下就差不多

  史嘉蕾喬韓森和查寧塔圖很明顯都不是演技派

  至少就是外貌賞心悅目,而且他們的火花是很不錯

  男帥女美那個火花基本上不會差到哪

  伍迪哈里遜戲份不多,也是錦上添花

  他這個角色不能說多反派,還是邪氣逼人

  他真的很適合演這種對立面的角色

  這部電影在講述登月時代的情懷也不錯

  我本身對這件事沒什麼感覺

  看的當下還是有股與有榮焉的心情

  不錯的復刻情懷,加上俊男美女的演出

  這部電影也許沒到優秀,絕對也不差


  ----

  Sent from  on my Samsung SM-S9280


  --

  我見過...你們這些人不會相信的事

  我目賭在獵戶座的邊緣著火的攻擊艦

  我看見C光束在湯豪色星門附近，在黑暗中閃亮著

  所有這些時刻都會消失...於時間中，一如眼淚...消失在雨中

  死期到了


  --'
