title: '[普好雷]《十分鐘新鮮事》，一段漫長卻溫暖的諮'
content: '部落格版：


  心理諮商師顏瑜慧曾說，「心理師不是裁判，而是協助你成為自己人生的翻譯者。」，她

  認為心理諮商就像長期健身，是需要累積信任、探索深層議題並穩定練習，才能帶來真正

  的改變。心理諮商與普通感冒不同，並不會立刻看到效果，而是一段需要耐心探索的身心

  旅程。在《為什麼諮商需要時間？》這篇文章裡，我喜歡心理諮商師顏瑜慧提到的兩點，

  她說來諮商室「就是面對真實的自我，但這份真實，需要一個安全的場域。」，而所謂的

  諮商「不只關注表面症狀，而是探究內在信念的源頭。」，如剝洋蔥般的向內深掘，隨著

  時間往往會發現到，許多問題來自於過去的創傷或者不愉快的經驗與回憶。當意識到問題

  所在，便能開始尋找適合自己的解決方法，在反覆嘗試、失敗與修正的過程裡，與諮商師

  共同討論並調整，從而達到真正的從心向外的改變。


  義大利電影《十分鐘新鮮事》我認為就像是這篇文章的實踐，諮商師布拉邦提對女主角碧

  揚卡提出的「十分鐘新鮮事」，是她在與碧揚卡經過數次的諮商過後給出的方法，讓碧揚

  卡每週花十分鐘去嘗試一件過去自己不曾做過的事情，看著碧揚卡從不理解、甚至誤解了

  布拉邦提的提議，到隨著這些「十分鐘」的不停累加，碧揚卡似乎開始能從中感受到了她

  也許還沒辦法清楚說明白，卻真真切切讓她跟過去有所改變的影響，而每個進場觀賞的觀

  眾彷彿陪著她進行了一場漫長的諮商旅程，每一件「十分鐘」既是新鮮的嘗試突破，也是

  「打開」碧揚卡內心的一把把鑰匙，讓觀眾也讓碧揚卡自己，逐步朝著她的內心深處走去

  ，回望自己的過去、正視自己的問題，整理正處於混亂的現在，找出可以重獲新生的可能

  。



  於電影的前半段，看著別人眼中正經八百、過於安全的碧揚卡，從簡單的首次美甲體驗開

  始，到參加路邊偶然看到的陌生人的告別式、和前男友相約對方工作室的一夜激情、百貨

  公司偷竊價格顯然不便宜的紅色大衣，還有央求同父異母的妹妹潔思敏讓她騎十分鐘的摩

  托車...，這些過去她絕對不會做的「脫序」行為，儘管牽扯到了犯罪問題，可卻著實滋

  潤了她枯燥乏味的生活，不曾有過的愉悅在她臉上表露無遺，而她從事前到事成的整個可

  以用欲拒還迎來形容的過程，也成了《十分鐘新鮮事》能讓觀眾會心一笑的橋段。只是當

  電影來到後半段，也就是在警察找上門後、潔思敏告訴警察碧揚卡生病開始，本以爲電影

  想走的輕喜劇風格逐漸轉了調性，悲傷於是逆流成河。


  原來碧揚卡曾經自殺未遂。跟著鏡頭的後退，觀眾更加認識了碧揚卡，知道她開始進行心

  理諮商的原因，與丈夫尼克的離開固然有關，可追本溯源，碧揚卡總是無意識只重自己感

  受而忽略別人的個性，才是讓碧揚卡把自己「活成現在的樣子」的主因。然而矛盾的是，

  尼克口中「完全沒注意到擺在門口一個禮拜的行李，還只想著要他幫忙開酒」的碧揚卡，

  聽來是相當自私的的人，可這樣的她卻也是個極度依賴別人才能生活的人。不過與其說她

  自私，我更覺得碧揚卡是「只看、只在乎自己想看、想在乎的人事物的人」，如美甲店的

  老闆跟碧揚卡說的，碧揚卡與尼克搬來這裡五年，每次經過店櫥窗都沒有抬起頭來看到裡

  面那個正在看她的自己，若不是這次十分鐘新鮮事的計劃，碧揚卡可能直到搬走都不會留

  意到每天回家的路上有著這麼一間美甲店。



  心理諮商的過程如此漫長，漫長到足夠讓碧揚卡比過去更認識自己，認識自己的不同面相

  ，認識自己藏在內心深處不願碰觸的脆弱。十分鐘新鮮事，有好的嘗試也有壞的體會，可

  不論好與壞都讓碧揚卡知道，如果不自己踏出那一步永遠不會知道結果是什麼，永遠不會

  知道原來自己一個人也可以辦到很多事，也永遠不會發現有些事情只有自己能夠替自己解

  決。尼克的離開源自於她的個性，她的個性源自於她的原生家庭，當碧揚卡最後選擇回到

  故鄉西西里島，向母親問出藏著好久的疑問，母親的回應與兩人的擁抱，是碧揚卡接納過

  去並與過去和解的證明，而她來到海邊走進海裡，宛如新生兒般徜徉大海，象徵著碧揚卡

  準備迎接全新的自己。


  前面提到過，諮商師顏瑜慧每個人前去尋求諮商的協助，無疑是想要面對真實的自己，而

  往往追求真實的同時需要的是一個安全的場域。在《十分鐘新鮮事》裡同樣的，布拉邦提

  負責碧揚卡的個案，她的職責不僅是引導碧揚卡去探究自己內心深處，也要保護著碧揚卡

  的安全。於是在最後電影給出了一個小卻充滿溫暖與愛的翻轉，在碧揚卡前去拜訪布拉邦

  提的時候，她才從對方的口中得知，不只是她的父母、潔思敏還有尼克，就連前男友都接

  受了布拉邦提的提議，在碧揚卡不知情的情況下在旁邊陪著她，替她建立一個安全網，在

  引導她的同時也保護著她。於是回頭想想，不管是潔思敏提議要碧揚卡與前男友重新聯絡

  ，或者是邀請碧揚卡參與劇團的朗讀等等，看似不經意的十分鐘新鮮事提議，其實都是出

  自於愛她而給出的有意引導。當想到這件事心裡頭就暖暖的，也更體會到或許心理諮商的

  過程漫長中偶有痛苦，但總是要記得自己並不孤單。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
