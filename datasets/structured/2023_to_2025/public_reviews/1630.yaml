title: '[好雷]漫談《御法度》－嚴律組織下的情慾與生死'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n《御法度》是一部日本導演大島渚，以\
  \ 司馬遼太郎著作《新撰組血風路》\n為底本編導的作品，主要劇情是，組織「新撰組」因美少年加納惣三郎(松田龍平飾演\n)的加入，隊內喜好男色的成員，為此爭奪嫉妒，引發一場腥風血雨的歷史片。\n\
  \n\n本片一開始，導演以直接的方式，介紹新撰組的入隊選拔方式。\n\n\n沖田總司(武田真治飾演)在以劍術一一考驗應試者，最後脫穎而出的是，加納\n以及粗獷的田茂彪藏(淺野忠信飾演)通過考核。\n\
  \n考核的過程中，總長近藤勇邊看邊詢問這些人的身家背景，以防他們是間諜、臥底之類。\n隨著木刀人影的一來一往，副長土方歲三(北野武大神飾演)，徐徐念出這些人的\n\
  身家過往，加納是京都商人之子，彪藏是下級流浪武士，如此，\n以便觀眾快速了解整個時代、主要人物背景。\n\n\n比試結束後，近藤問眾人有無意見，一旁的三把手(表面上的)伊東甲子太郎表示，\n\
  他一直反對新撰組純以劍術取士。\n\n註:武勇是武士道的內容之一，但是並不是唯一，最能體現武勇的方式就是劍術。\n\n北野武解釋道，新撰組本質就是斬殺惡人的殺人集團，最重要的當然是武力。\n\
  \n過後，兩位新隊員到總長的房間報到，近藤對加納青眼有加，對於則彪藏草草帶過。\n這裡有一個重要的鏡頭，導演聚焦到松田龍平狐媚攝人的眼角、白皙的臉頰、\n嬌嫩的櫻桃小嘴，這其實是告訴我們「總長」的眼睛在看哪裡。\n\
  \n於是有了北野武以下的內心獨白：「他很少這樣看人，難道他也好這口?」其實上述\n的鏡頭也是北野武眼睛的聚焦的鏡頭，觀眾跟北野武、近藤，一起「欣賞」\n這位美少年。\n\
  \n註：喜好男色在日本古代武士間相當寬容，也很流行。類似中國古代的孌童概念，\n不一定真的是單純男同性戀者，本身有家室的武士，好男色也大有人在。\n\n於是乎剛入隊的加納被任命當近藤總長的貼身保鑣，但彪藏只是當一班隊隊員。\n\
  \n彪藏與加納同回休息室，他們第一個話題便是，休息室內牆上高掛的隊規，\n也就是本片題目主軸之一的「法度」。\n\n新撰組的隊規殘酷嚴厲，脫離組織－－死\n \
  \                     組織私鬥－－死\n                      受取私財－－死\n                 \
  \     介入械鬥－－死\n                      違武士道－－死\n\n\n此時加納接到第一份差事，就是入隊隊員慣例要斬首違規隊員，一方面表現\n\
  個人的勇氣，一方面習慣血腥的日常，而彪藏再度受到冷落。\n\n當天晚上在大通鋪上，彪藏對鄰鋪的加納糾纏不清，原來他早已看上加納，\n加納不知是熟睡還是佯睡無視之。\n\
  \n隔天加納舉行處決儀式，眾人都期待他第一次殺人的表現，但是他的表現乾淨俐落，\n完全沒有任何緊張噁心或退縮，總長稱許之。\n\n只有北野武獨白：他的樣態不像第一次殺人，而且他不是有勇氣\n\
  而是其他更詭異的東西。\n\n此時彪藏違反行刑規定，闖入現場，理由是關心同期人的處刑表現。\n其實是關心「加納」的表現，因違反規定被禁閉五天，由此可以看出他\n\
  猛烈的追求，只為了刷一點存在感。\n\n出獄後，彪藏對加納的追求更加露骨，甚至說出「不惜生命也要換取與你共度一夜」\n，加納都以厭惡的表情回絕，久而久之，隊上出現許多謠言，有人說他們已經好上了，\n\
  在謠言的同時，隊上也有許多人迷戀上加納，隊內瀰漫奇異的氛圍。\n\n此時隊內的法度管理者，北野武，覺得無法置之不理，恐怕引起內鬥。\n於是他找了沖田詢問，加納與彪藏劍術孰高，沖田表示加納高。\n\
  兩人並閒聊，為何加納這種人會加入新撰組，北野武表示他聞到一種氣息。\n骨子底可能是血的氣息。\n\n沖田表示瘋子惜瘋子、英雄惜英雄，而你土方(北野武)是這群狂人的頭頭。\n\
  \n註：所以才要制定這麼嚴格的法度駕御這群嗜血狂人。\n\n北野武回到道場，先把加納喊出來切磋，一群皮膚黝黑，身穿黑色道服的月代\n頭武士之中，只有一位面色白皙，身穿白服，留著長髮劉海的美少年應聲而出。\n\
  跟北野武有來有往，過後北野武喊出彪藏來切磋，相比之下，彪藏遜色不少。\n\n北野武讓他們兩個比試，結果是彪藏大展手腳，木刀「狂戳猛送」，加納像隻\n無力的小白兔一樣蹦蹦跳跳，節節敗退，這兩個人「攻受分明」。\n\
  \n於是北野武領著觀眾得到以下結論：「這兩個人好上了。」\n\n\n於是謠言再起，隊內議論紛紛。\n\n\n加納在巡視的時候遇到一個其貌不揚的中年男子，輾轉得知他是近藤總長、\n\
  土方副長、沖田隊長的老鄉以及師兄，井上源三郎。\n沖田向加納叮囑，老師兄的武功很差，跟他交流多放點水。\n\n\n切磋交手的那天，加納上演了拙劣的放水戲碼，不巧有隊外人士大剌剌\n\
  地在窗外偷看，並丟下一句：「新撰組也沒甚麼了不起的。」揚長而去。\n此舉侮辱了身為武士的隊員自尊，眾人開始追查來人以及究責。\n\n加納表示一切的罪過都在他身上，請不要怪罪井上，隊內的湯澤\n\
  藤次郎，跑出來緩頰辯護，並邀請他晚上去喝酒。\n\n席間湯澤表達許多不滿，原來看似平等關係的隊內，實際上是由近藤、土方\n、沖田、井上的「天然理心流」主導，而井上只是靠此關係當上隊長，隊內其實\n\
  許多人對這樣的主導以及嚴格的對規不滿。\n\n俗話說的好，柿子挑軟的吃，由「劍術」取試進來的各式隊員們，當然對\n這個劍術不佳的關係戶老隊長，相當不以為然，也就有了井上自己洗衣服的情節。\n\
  \n但這些都是次要的，湯澤的主要目的是他也看上了加納，並說出「能跟你共度\n一晚，即使縮短壽命也無所謂。」加納面無表情地接受了。鏡頭帶到房外的\n庭院雨水景色，隱諱地帶過兩人的雲雨。\n\
  \n歸途上，湯澤確認了加納與彪藏的私密關係，並囑咐加納不要聲張，暫時讓他當\n「秘密情夫」。\n\n過後，隊員找到找到嘲笑新撰組的浪人老巢，井上帶著加納兩個人\n\
  展開捍衛尊嚴之戰。結果井上摔斷了腿，加納頭臉上挨了一刀，隊員聞風而至\n終於搶下兩人性命，加納躺在擔架上生死未卜，彪藏「護妻親切」一路在旁\n守護叫喚。\n\n\
  湯澤把一切看在眼裡，妒火中燒。\n\n不久，也不顧加納的傷勢未癒，湯澤跑去其床第，導演拍攝了第一場\n具體的男男床戲，而整個事態也終於檯面化。\n\n湯澤決定不當地下情人，橫刀奪愛，要斬斷他們兩人的情絲，決定去\n\
  斬殺彪藏。\n\n\n結果隊內得知湯澤橫屍街頭，隊內「御法度者」北野武展開調查，一切\n指向隊內糾紛，又指向圍繞加納的爭寵奪愛，近藤命令北野武去解決此事，\n\
  接著他又懷疑，總長也因妒火而想殺掉加納，但他又誤解了。\n\n\n他們決定「開發」加納身為男人的「正當」路。因為隊內「曾經」也發生過\n類似的事件，這次必須迅速解決。\n\
  \n北野武找來監察長山崎，因為看準山崎是個對男色毫無興趣的老實人，\n命他帶加納去歌舞町行「成人禮」。\n\n\n山崎開始對加納展開猛烈的糾纏，加納還是擺著那張漠然的臉孔，以為\n\
  山崎也是「追求者」之一，對這些夜晚的邀約一一回絕，隊員也對此側目，\n，山崎曾問加納為何加入新撰組?加納表示：「可能是因為可以殺人。」過了數月\n，山崎終於打動加納，加納對他回以「我喜歡你。」的對應。讓山崎不知所措。\n\
  \n山崎與加納前往歌舞町的路上，加納不停勾攝山崎，拉起他的手。\n山崎終於開始覺得自己變得「怪怪的」，希望自己能「把持住」。\n\n一切看似順水推舟般順利，隔天老鴇卻跑來報信，表示加納大鬧一場，\n\
  對女色毫無興致，「成人禮」當然也失敗了，但謠言並沒有終止。\n\n沒多久，山崎走在夜路上，莫名地遭遇襲擊，他奮勇打退敵人，並且\n在現場撿到一把短刀，經調查那把短刀是彪藏所有。\n\
  \n\n一切指向彪藏因妒火醋意而襲擊被誤會的山崎，也把湯澤之死一併算在\n彪藏的頭上，北野武及總長不得不暗中清理此事，否則隊內難以團結。\n\n總長意味深遠的指示北野武，命加納親自斬殺彪藏。由北野武\n\
  及沖田在一旁監視。\n\n\n加納約彪藏在夜半郊外，等待赴約的同時，北野武與沖田開始閒聊，\n沖田對加納親自斬殺彪藏有所疑問，表示總長是不是也喜歡加納，才故意\n\
  如此?因為他認為總長看加納的眼神「怪怪的」，北野武也是「怪怪的」。\n\n結果北野武居然回了一句：「你是不是忌妒加納？」\n\n註：這裡可以解釋為什麼前面北野武說過「以前也發生過類似的事情。」\n\
  沖田總司在過去的文學影視作品都是美男子形象，包括司馬遼太郎的作品。\n而本片也是找美男形象的武田真治飾演。所以過去類似的事情，其實就是指\n隊上也曾有人看上沖田(但他本人表示不好此道)，引發紛亂。\n\
  \n\n沖田否認後，沒想到他反問，那你跟近藤總長呢?你們之間有別人無法介入\n的默契，而成就了新撰組，任何人都無法介入。\n\n註：過去新撰組內有許多派系鬥爭，都想拉攏近藤總長，建立新的威權，\n\
  最後都被土方聯合近藤一一清除。\n\n\n沖田接著又說了書中一則故事「一位書生救了一位武士，兩個人成為生死之交，\n但武士要回國去參戰，因此訂下重陽之約，來日再會。但武士受困城中，\n\
  不惜自刎守約，以幽靈的身分赴約。」這是講信義守約的故事。\n\n沖田卻讀到，這是一則兩男之愛的故事，否則為什麼不惜自刎都要前來赴約?\n篇名「菊花之盟」也暗示著同性之愛。\n\
  \n\n此時北野武開始變得「怪怪的」\n\n(他腦中幻想身著白衣的加納等待守約的對象是他自己。)\n\n清醒後大喊不是，緊急否認自己的下意識。\n\n(接著他又想像其實加納的等的對象是同樣美男子的沖田。)\n\
  \n清醒後馬上質疑，其實沖田是愛加納。沖田再次否認。\n但北野武問他，為什麼沒事讀這種書?讀這種書為什麼會產生這種奇怪的想法?\n但沖田表示，他對故事兩人都討厭。\n\
  \n註：所以為什麼大島渚看了新撰組血風錄後，只記得加納的故事，而且產生這種奇\n怪的片子。\n\n(北野武又陷入幻想，這次是沖田等待(被追求方)，穿著鮮紅衣的加納\n\
  跑來履約(主動方) )\n\n清醒過後，彪藏終於前來。\n\n加納表示邀約意圖後，彪藏表示自己被背叛了，其實殺害湯澤的人是\n加納，而彪藏的短刀也被加納拿去嫁禍給自己。\n\
  \n一番搏鬥後，加納處於劣勢，關鍵的時候，加納向彪藏耳語，彪藏棄刀受死。\n\n註：根據此劇給的線索，耳語內容應該是「你曾經說過與我共度一晚死也甘願，\n此刻你應當履行承諾了。」武士道講求誠信，故彪藏甘心受死。\n\
  \n\n結束後北野武與沖田同行，沖田想起要事要辦，回去現場，北野武望著沖田的背影獨白\n:「不是你喜歡加納，而是加納喜歡你。」(上述中北野武最後的幻想)\n\n\
  \n(北野武變得越來越詭異了)\n\n北野武在一棵黑暗中凸出的櫻花樹下(就像道場中一團黑中的一套白衣)\n唾罵：「怪物。」\n\n此時遠方響起：「沖田先生?」(加納語)，然後是刀劍之聲與慘叫。\n\
  \n註：論證了北野武說加納喜歡沖田，所以對沖田毫無防備。\n\n「加納那個渾蛋，實在太美了。在不斷被男人褻玩的過程中，\n怪物就寄居到他身上了。」言畢，北野武拔刀斬斷盛開美麗的櫻花樹。\n\
  \n註：就像沖田狠心斬殺加納。\n\n其實除了狠心斬殺美麗事物外，我認為北野武斬殺的是他內心的幻想，\n與心魔。因為加納美得令一切接觸到的男人都「怪怪的」，他的潛意識\n\
  裡湧起了對加納難以言喻的情感，如同山崎，他們這些自認「正常」\n的男人們，都被這件「美麗的事物」，喚起了不該顯現的慾念，北野武\n透過不斷從質疑別人「好這口」，來達到轉移內心浮起的慾念。\n\
  \n所以這部片，執法者北野武，在「御法度」這件事情上，才做得不盡\n人意，因為大家都對加納這件「美麗事物」太過寬容，如果照新撰組\n以往的嚴格法度，加納早就伏誅了。\n\
  \n非得等到沖田這個「我兩個都討厭」的人出現，才能狠心摧毀這個「美麗的事物」。\n\n另外，加納說他自己加入是因為可以殺人，所以北野武才在入隊儀式中，\n聞到不尋常的氣息，而加納也在這些隊員之間，玩弄權術，順利達到\n\
  自己可以殺人的異樣目的。\n\n\n我對說這部片結尾是象徵武士道的衰亡這種說法，深不以為然。\n\n\n\n\n\n\n\n\n--\n導演覺得他有獨特的妖魅氣質...劇中也是這樣，不然我也認同武田比較帥\n\
  雖然發現北野武演土方我也很錯愕，但是北野武表現得很出彩"
