title: '[新聞] 章宇主演、《輕鬆+愉快》導演新片《東北虎》開拍！'
content: '新聞網址：


  因《我不是藥神》、《無名之輩》、《大象席地而坐》等作品走進觀眾飾演的演員章宇再

  出新作。由他和馬麗主演的電影《東北虎》在黑龍江鶴崗開機，並同步曝光海報。


  海報頗具質感，章宇和馬麗在破落的東北工業背景前，與大狗合拍了一張“全家福”，一

  向以短髮形象示人的喜劇女王馬麗留了長發，似乎“孕味十足”，此番造型頗為打眼。


  據悉，影片由耿軍（《錘子鐮刀都休息》、《輕鬆+愉快》）執導，講述一個屬於東北的

  黑色幽默故事。網友期待兩位實力派演員在這部電影中擦出別樣火花。





  --'
