title: '[普雷]《是誰搞的鬼》，我知道你去年夏天做了'
content: '部落格版：


  2025年新版《是誰搞的鬼》是1997年原版《是誰搞的鬼》與1998年續集《又是誰搞的鬼》

  的直接續集，基本上沒看過前兩集也沒關係，不認識兩位前作中的男女主角、同時也是當

  年事件倖存者的雷與茱莉也沒關係，因為在新版中事件發生後，主角群便藉著調查發現了

  1997年的連環殺人事件，等同於順勢向觀眾大概介紹了原版劇情，因此我個人認為直接進

  場觀賞2025年新版《是誰搞的鬼》不會有太大問題。而如果是對於看過原版的觀眾，新版

  《是誰搞的鬼》就像是《月光光新慌慌》、《陰間大法師BEETLEJUICE》或者《侏羅紀世

  界：統霸天下》等經典之作重啟或選擇性跳過中間某些集數、直接將新版接續在最初的原

  版之後，並且找來當年的主角繼續詮釋他們的角色，不僅能讓新觀眾重新認識這些經典，

  也能同時勾起老觀眾對電影的回憶，新舊主角的同框亦有種傳承與交棒的意義。


  《是誰搞的鬼》對我而言算是尚可的佳作，娛樂性我認為還是有的，舊作主角的加入我覺

  得也是加分。不同於《月光光新慌慌》中由潔美李寇蒂斯所飾演的洛莉在時隔多年後必須

  繼續面對當年追殺她的麥克，1997年首集中存活下來的茱莉與雷，在新版《是誰搞的鬼》

  中是新主角群求助的對象，有點像是《絕命終結站2》中金柏莉前往精神病院尋求《絕命

  終結站》倖存的克萊爾如何對付死神那樣。透過特地前來南港鎮製作與1997年有關的連環

  殺人案節目的Podcaster黛樂，艾娃等人發現現正發生的事情與當年如出一徹，從丹妮卡

  收到一封沒有署名、上面僅寫有「我知道你去年夏天做了什麼」的小卡開始，到被穿著雨

  衣、拿著鐵鉤殺人的人追殺，艾娃等人認為這不僅與一年前他們害死的男人山姆有關，也

  可能與1997年的事件有關...



  從英文片名「I Know What You did Last Summer」到中文譯名「是誰搞的鬼」都直接告

  訴觀眾電影的重點就是要觀眾去猜兇手是誰，而《是誰搞的鬼》確實也在這部分做得不錯

  ，主角群尋找兇手的過程延續了開頭的懸疑感，觀眾跟著不斷切換的鏡頭與偶爾被透露出

  的線索，能比主角群早幾步先將可能的兇手名單寫在心裡，靜待真相揭曉的那刻。當然免

  不了的，這類型電影總是會在有意無意間去誘導並且混淆主角群與觀眾，讓人總在對某個

  人產生懷疑後，又在下刻遭到真兇殺害，使觀眾對於兇手的猜測不斷地被推翻。只是同樣

  理所當然的，往往觀眾也都知道這些編排通常只是虛晃一招，真兇不太可能那麼早出來，

  也不太可能那麼容易被猜到，畢竟對於猜兇手這件事最期待的是能有個反轉。因此不論是

  前面眾人懷疑是泰迪為報復才寄小卡給丹妮卡、對1997年事件瞭若指掌的黛樂或者是為保

  利益而試圖掩蓋過去並將艾娃等人事情壓下來的葛蘭等人，都不太會是最後的兇手。


  當黛樂遭到殺害時，看到兇手的臉她曾說「原來是你...」，加上與女主角艾娃的關係，

  都讓我曾想過真兇是否是如《驚聲尖叫》那樣是女主角的男友、也就是曾與艾娃有段情，

  後來重聚後感情逐漸再度曖昧的麥洛？結果事實證明猜錯了。而當答案揭曉時，對於真兇

  我個人是有點驚訝但回頭想想卻也覺得合理，因為確實早在開頭多少就有些暗示了真兇與

  主角群過去的關係，後續揭露真兇與一年前因主角群而死的山姆有關聯，新仇加上舊恨進

  而導致真兇想要追殺主角群似乎就不太意外。只是這就要說到我認為《是誰搞的鬼》最為

  可惜的部分，前面有說過電影有著很好的開頭與懸疑感營造很好的中段過程，讓人有效順

  著劇情投入於其中並跟著猜測真兇，然而最後卻等到相當倉促且略微粗糙的不打自招，而

  在這更之後知道這樣的倉促與粗糙，是為了一個觀眾或許早就預料到的反轉時，就更對前

  半段感到可惜與浪費。



  真兇有兩個這件事並不稀奇，像《驚聲尖叫2》那樣。有對主角群懷恨在心的真兇，也有

  另一個是對過去事件痴迷與崇拜的模仿犯，而在《是誰搞的鬼》中也用類似的原因說明了

  原版男主角雷為何會成為當年追殺他們的漁夫殺人魔，只是這樣的編寫我不覺得是好事，

  至少對於老觀眾來說，如果當年的男主角回來幫助新主角群，逃過當年追殺卻逃不過現在

  於是犧牲，雖是遺憾可還算感人。未料結果卻是如此，多少影響甚至破壞老觀眾對雷前幾

  集的形象，相信許多老觀眾是不樂見看到雷的結局是這樣子的。此外，畢竟前面不論是艾

  娃在真兇手上劃了一刀、或者是遭到泰迪痛毆、砍傷，但新版真兇自揭身份卻沒有任何傷

  勢，加上前面幾次新版真兇在別處可仍有殺人魔出現時，就知道真兇從來不止一個。結尾

  的翻轉頂多是被雷是第二個兇手嚇到，而不是對「原來有兩個兇手」這件事。甚至我還想

  ，搞不好從頭到尾新版真兇殺的人其實只有丹妮卡的未婚夫？至於彩蛋的部分我只能說不

  予置評。


  整體來看，新版《是誰搞的鬼》是走過去熟悉的砍殺電影路線，有著某種程度的娛樂性，

  對於前作的致敬與情懷也有顧到，不僅雷與茱莉回歸，其他幾位1997年的角色、巴里、馬

  克斯與海倫也在不同的地方用不同的方式被提及與登場，熟悉的雨衣與鐵鉤同樣讓人懷念

  ，雖然幾乎沒有任何創新之處，不過套用原版模組這點就是確保了一定分數，中規中矩卻

  是聰明的選擇。電影有可以吐槽的地方但不多，都在能夠接受的範圍裡面，儘管我不太喜

  歡後半段的節奏與結局，不過《是誰搞的鬼》依然是近年重啟或者重拍續集中能被歸類在

  好的那邊。主角群的表現方面，給人印象最深刻的自然是戲份最多的丹妮卡，身爲主角的

  艾娃反而沒什麼記憶點，配角泰迪或許都還比她還要搶戲，我唯一能記住她的大概只有她

  長得像林小樓加諾耶米梅蘭特的綜合體吧。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
