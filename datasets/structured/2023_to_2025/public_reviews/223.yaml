url: https://www.ptt.cc/bbs/movie/M.1735394563.A.883.html
title: '[討論] 經典YA電影《是誰搞的鬼》洩出片場照'
content: "前陣子聖誕節，看到已經是辣媽的Jennifer Love Hewitt和現實中的老公\n\n合體演出聖誕電影The Holiday Junkie，有順便被問到是否參演\n\
  \n《是誰搞的鬼》（I Know What You Did Last Summer）的續集，\n\n\n\n\n但她太乖巧什麼答案都沒給，反而是小佛萊迪普林茲的太太\n\
  \nSarah Michelle Gellar 在IG意外貼出探班照片引熱議，也等同於\n\n提前為這部已經重啟過電影版和影集版的經典IP提前宣傳。\n\n\n\
  主持人有替Gellar緩頰說，在她IG貼的討論度也很高。\n\n\n\n\n是說這整件事也挺誤打誤撞的，還好沒被劇組要求刪除啊QQ\n\n\n續集新聞 \n\n\
  \n之前已經有一部很經典的I 'Still' Know What You Did Last Summer，\n\n當時年紀很小，只記得光是看到演員回歸就很感動了，劇情大致上都忘光光XD\n\
  \n--\n\n幻想●---------------☆\n/﹀\n/\\ \n\n按a加入最愛\n\n--\n剛剛補看了第二集，也就是I Still Know\
  \ What You Did Last Summer，\n\n其中主演的黑人女主角是歌手Brandy，小佛萊迪和珍妮佛都有演，\n\n第二集是Brandy抽中電台的巴哈馬之旅，結果殺手找上島去，\n\
  \n現在看起來覺得血超假，可能真的是青少年才會喜歡的元素吧，但看看懷舊氛圍仍滿分:)"
