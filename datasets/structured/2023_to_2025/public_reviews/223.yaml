title: '[好無雷] 是誰搞的鬼'
content: "1997年三部曲的新作\n沒有看過前作\n所以有沒有致敬看不出來\n但是不影響劇情理解\n\n劇情就跟英文片名一樣\nI know what you\
  \ did last summer\n主角5人去年的犯罪被發現\n兇手展開復仇殺人\n雖然故事有點復古\n但算是好看的砍殺電影\n很多營造緊張氛圍的橋段\n而不是只有使用jump\
  \ scare\n血腥程度倒是還好\n\n個人就喜歡這種純粹是人而非鬼神的連續殺人\n這類型電影就好像金田一或是柯南\n建議想看的人盡量別看影評\n提前知道兇手就不有趣了\n\
  --\n\nSent from \n\n--\n\n\n                                    07/18 18:58\n查了一下1997版的主角演員年紀不到20或20出頭確實是YA\n\
  2025都年紀都在20後段快30\n這樣還能算是YA嗎？\n\n原來如此"
