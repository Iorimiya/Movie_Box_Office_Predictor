title: '[情報] AXN將在本月播放《是誰搞的鬼》系列作'
content: "AXN將在本月播放《是誰搞的鬼》系列作\n\n\n    \n\n    《是誰搞的鬼》(1997)\n\n     播出時間 : 9/7(六)\
  \ 21:55\n\n\n  導演： 吉姆吉萊斯皮 Jim Gillespie\n\n  演員： 珍妮佛樂芙休伊  Jennifer Love Hewitt\n\
