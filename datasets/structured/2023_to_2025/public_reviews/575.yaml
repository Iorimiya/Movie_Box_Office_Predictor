url: https://www.ptt.cc/bbs/movie/M.1553858093.A.5A2.html
title: 'Re: [討論] 婁燁《風中有朵雨做的雲》中國疑似撤檔'
content: '婁燁的作品屬於經常被封殺的類型。

  他拍的超過一半都被封殺掉了，堪稱封殺王。


  《蘇州河》拿下鹿特丹，但沒過審，禁止拍片兩年。

  《頤和園》的時候被禁止拍片五年。

  《浮城謎事》被刪減場景，成為和諧版本，後來婁燁不屬名。


  台灣應該比較多是因為《推拿》認識他，但是推拿審查通過的時候。

  婁燁自己說了：


  「對我來說警報還沒解除，我不知道會出現什麼情況……」


  《風中有朵雨做的雲》在金馬看的時候，陳冠希鏡頭也基本上被刪光。

  還好已經刷完了，片頭的第二場抗爭戲碼拍的相當好，

  把手持鏡頭的運鏡特色和場景交融在一起，

  不知道會不會上其他通路，

  婁燁這是一部還滿值得刷的片啊！！









  --'
