url: https://www.ptt.cc/bbs/movie/M.1541439890.A.ED9.html
title: '[雷] 婁燁《風中有朵雨做的雲》不給浪漫 給血腥'
content: '影評來源：


  ------------------------------------------

  （提名：最佳導演、攝影、動作設計、音效）

  -------------------------------------------

  （微雷）

  中國第六代導演婁燁從《浮城謎事》開始，已逐漸脫離他原本一貫的文學腔調，從文青偏好

  的調性，轉入8點檔敘事的曲折戲劇張力；新作依然如此。其實全片風格並不如片名《風中

  有朵雨作的雲》聽來如情歌名字一般浪漫，而是部夾帶情慾與血腥的懸疑追兇片，並且帶著

  更多商業性，連陳冠希都客串一角。片中，宋佳、陳妍希和馬思純3姝對陣，表現出彩。


  故事發生在廣州某城市，秦昊飾演知名商業精英「紫金置業」老闆，暗裡官商勾結，牽動政

  府正執行拆建舊建築，大批居民抗爭暴動，公安鎮壓，媒體現場連線，城市建設委員會主任

  趕赴現場安撫民心，媒體追訪逼問；這些亂象，多像我們新聞台裡不時上演的畫面。


  不料，抗議當晚，建委會主任巡樓時獨自從天台墜樓身亡。飾演警官的井柏然欲追查，卻飽

  受壓力又被誣陷扯後腿，於是遭革職並被追殺逃亡香港。他發現死者的妻女並不單純，宋佳

  飾主任老婆、馬思純飾主任女兒，竟都跟死者不太親密；反倒這對母女卻跟「紫金置業」的

  秦昊有所牽聯。


  層層推理下，不到最後不知真兇。婁燁拍起警匪推理片，似乎沒有聚焦在高壓的緊繃逼人氛

  圍，反而依然在他擅長的「寫實」面上著墨，他讓官場行賄洗錢現形、探入珠海及港台的酒

  店文化，運用大量新聞訪問及播報內容來串連交代情節。


  重口味的畫面是必不可少。連環車禍、剪刀戳胸、利器叉眼，婁燁從不修飾殘酷的血色依舊

  閃爍；井柏然與宋佳和馬思純都有情慾迷障的激情；秦昊和宋佳、也和陳妍希飾演的神秘關

  鍵女子都有情慾戲；那個誰誰誰是利用或真心？用嘴巴說，都口不對心，難怪本片原名叫《

  地獄戀人》。


  婁燁此次新作，表面上將炮火對準貪利不惜犧牲無辜的黑心官商；實則用力戳破人性自私而

  偽裝的泡泡；尤其當一個個人物角色互相利用，再互揭瘡疤，人性如同「雨作的雲」如此脆

  弱不堪一擊。可惜，電影通篇敘事略顯流俗，刻畫得不夠深切，力有未逮。


  好在，婁燁調度演員的整體表演仍具水準：長期合作的奏昊自然默契十足；逐漸成熟的井柏

  然稱職。金馬影后馬思純戲分不多，仍把聰明心機的叛逆女孩掌握出色；陳妍希難得接到與

  過往不同的角色，陪酒出身轉進商界的複雜女子，因為愛而故作江湖世故，卻又傷痛最惨被

  遺棄；3女之中戲分最重的宋佳，將謎樣與情慾的內心糾結演繹到位；群體表演替此片的情

  緒起伏大為加分。


  值得一提的是，攝影鮑軒鳴全片以手持鏡頭游移穿梭於人物的善悪愛恨之間，即使幾場人數

  眾多的躁動激昂大場面，也持穩不失準；數個情緒深重的近焦凝視，多幅鳥瞰大景，都為故

  事增添了懸疑氛圍和情緒釀造。


  --'
