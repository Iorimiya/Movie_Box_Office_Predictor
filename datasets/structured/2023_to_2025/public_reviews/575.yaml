url: https://www.ptt.cc/bbs/movie/M.1553793066.A.A0F.html
title: '[討論] 婁燁《風中有朵雨做的雲》中國疑似撤檔'
content: '曾執導<頤和園>、<推拿>、<浮城謎事>的中國導演婁燁的最新作品<風中有朵雨做的雲>


  由井柏然、馬思純、陳妍希、秦昊主演



  早在2017年就拍攝完畢


  卻因為審查的問題，拖到去年金馬影展才能世界首映




  而好不容易今年4月4日中國也即將在院線上映


  但卻傳出4月1日的首映會被取消


  這部片形同撤檔



  至於撤檔原因則為"不可抗力"的因素







  唉  看來婁燁這回還是踩到了社會議題的底線了

  雖然審查過了，但說砍就砍還是不意外


  --'
