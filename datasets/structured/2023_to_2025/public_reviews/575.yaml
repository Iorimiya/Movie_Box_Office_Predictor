url: https://www.ptt.cc/bbs/movie/M.1542267056.A.5A0.html
title: '[普雷]《風中有朵雨做的雲》，一場遊戲一場夢。'
content: '部落格版：


  「風中有朵雨做的雲，一朵雨做的雲，雲在風裡傷透了心，不知又將吹向那兒去。」


  這是「天氣公主」孟庭葦收錄在1993年同名專輯的主打歌曲，而這也被大陸導演婁燁拿來

  當作新作品《風中有朵雨做的雲》的片名。聽起來頗具文藝氣息的片名，卻與電影本身風

  格完全不同，這是婁燁繼《浮城謎事》後再度拍攝懸疑類型電影，在本屆金馬獎一口氣入

  圍四項大獎，他本人也第三度獲提名最佳導演，連三部作品《浮城謎事》、《推拿》、《

  風中有朵雨做的雲》都獲金馬青睞，可見金馬評審對於婁燁的喜愛，不過就我本人來看，

  婁燁今年應該會再度與最佳導演錯身而過，單就跟在第51屆金馬獎上七提六中成最大贏家

  的《推拿》相比，《風中有朵雨做的雲》明顯就非婁燁的最佳狀態。



  以今昔交錯的敘事手法在許多同類型電影當中滿常見到，婁燁自然也將其運用在《風中有

  朵雨做的雲》裡頭，透過一名年輕警察的查案過程，慢慢地倒回、拼湊故事，繼而推動劇

  情發展，向觀眾透露更多訊息線索，藉以製造不可缺少的懸疑氣氛。婁燁導演再在最後收

  尾時，大玩劇情翻轉是有些給人訝異，但卻收的不夠好，並且在某種程度上來說破壞了整

  體結構，造成前後比例失衡，沒能讓《風中有朵雨做的雲》再往上一層級。此外，我個人

  滿欣賞前面開始的大量鏡頭晃動，那給人一種真實感、彷彿就在現場感受著那場引發一切

  開端的暴動，可惜到了後半段，由於光線亮度不足，許多在暗巷裡、高樓裡的追逐、動作

  戲沒法一時看得清，加上剪輯手法易讓人覺得紊亂，確實會造成成觀影上的一種障礙。




  電影開頭在一陣混亂之中，民眾和居民因為拆遷事宜和建商爆發衝突，而在過程中建設委

  員會主任唐奕杰從屋町墜落身亡，年輕警察楊家棟被指派調查本案。他從唐奕杰身邊的人

  開始調查，一路查到了和他交往甚密的紫金企業負責人姜紫成，以及她的太太林慧，接著

  他發現到他們幾個人有著複雜關係和過往，林慧曾因嚴重精神疾病住院治療、姜紫成創建

  的紫金企業規模日益擴大、他的太太兼合夥人連阿雲在2006年失蹤...，可是唐奕杰秘書

  與林慧卻聲稱曾在現場、以及其他地方看到過連阿雲，這讓小楊懷疑一切是否和連阿雲有

  關？


  「你們自己髒就算了，幹嘛拖別人下水？」


  當小楊挖掘越深的過往時，他自己卻也遭人設計，被偷拍下遭林慧強吻的影片，但他並沒

  有因輿論壓力而停止，反而更為專注在此案上。只是當他預備和唐奕杰秘書碰面、拿到他

  所拍到的連阿雲的照片時，卻發現秘書早已被人殺死，他則因被路人目擊錯被當成了兇手

  遭到通緝，後林慧給了他一筆錢，希望他能收手、躲去香港。可小楊並沒有打算停止，這

  都是因為他的父親，他認為多年前因車禍不得不提早退休的父親，之所以會發生意外，是

  因當時父親和私家偵探曾聯手調查關於姜紫成和紫金企業，雖說偵探沒有明言，不過小楊

  心裡有底，如果他破了唐奕杰的案子，或許就能讓他知道父親意外的真相...




  「所有事情都是這樣的，會過去、被忘記。」


  《風中有朵雨做的雲》有幾幕我很喜歡，一是姜紫成和林慧、以及後到的唐奕杰放火焚燒

  死去的連阿雲屍體，他們看著燃起的火焰臉上的表情值得玩味，唐奕杰什麼話都沒說僅笑

  著拍著姜紫成的肩也很有趣。假使四人的關係早就變了、變複雜了，但或許是在這裡才是

  真正扭曲的開始。二則是女兒小諾出現的幾場戲，包含她發現母親和其他人都在設陷害小

  楊時說的那段話，後面回顧片段她和唐奕杰發生爭執、崩潰倒地的那裡，可以說她的戲份

  不多，卻都非常抓人。


  認真說看完電影我是有點失望的，導演婁燁上部《推拿》太好，以至於會對這部電影抱有

  更高期待值，《風中有朵雨做的雲》沒有不好，但就是相比之下可以再好。電影裡主要角

  色們都表現很好，特別讓我驚艷的是三位女性演員，飾演小諾的馬思純、連阿雲的陳妍希

  ，以及林慧的宋佳，其中宋佳特別讓我印象深刻，她不惜裝瘋自殘再度被關進醫院，也要

  讓調查到她這裡結束，就為了保護其實才是真兇的女兒，那種母親的堅毅與堅定在她身上

  表露無遺，和她前半段有著強烈對比性，滿可惜沒能入圍最佳女配角，馬思純也有點算是

  微遺憾。


  原名《地獄戀人》是滿八點檔的，但改成《風中有朵雨做的雲》也沒比較好，和電影本身

  關聯性較小，劇中有出現的、陳妍希獻唱《一場遊戲一場夢》還比較適合，光就歌名就能

  和劇情有連結，揭穿了大人世界的一切其實就都是一場遊戲一場夢，林慧和姜紫成不想讓

  小諾也步上後塵，於是寧願犧牲也要保護，但最後小諾還是不得不踏入大人世界，成為她

  口中髒掉的一份子。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --

  不要這樣哈哈哈哈哈哈哈'
