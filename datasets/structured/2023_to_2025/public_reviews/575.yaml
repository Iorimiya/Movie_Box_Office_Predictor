url: https://www.ptt.cc/bbs/movie/M.1541845371.A.4FC.html
title: '[金馬影展] 風中有朵雨做的雲'
content: '1.影片名稱 : 《風中有朵雨做的雲》


  2.觀影時間 : 昨天


  3.觀影地點 : 日新威秀


  4.觀影方式 : 自行購票


  §其他防雷說明(非必要) :





  ~~~~~~~~~~~~~~~~~~~ 無雷 純心得文 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  金馬影展之一：《風中有朵雨做的雲》。


  之前看婁燁的《頤和園》、《浮城謎事》、《推拿》，覺最無感的是懸疑片型《浮城謎事

  》，所以對這次主打懸疑的《風中有朵雨做的雲》並不是太高期待。結果覺得雖大輸《推

  拿》、不及《頤和園》，但還不錯看，只是給我類似《浮城謎事》的感覺——少了點衝擊

  。


  比較喜歡的是選角。除了今年和《七月與安生》雙影后周冬雨和馬思純都對上戲男主角的

  井柏然我比較無感外(看的時侯一直在想前幾年演出《推拿》和《黃金時代》的黃軒去哪

  了？)，秦昊、宋佳、張頌文、馬思純都很棒，有陣子沒看到的陳妍希也出我意料地不錯(

  除了演唱〈一場遊戲，一場夢〉那段外)。遺憾的則是參與演卻被剪光(只剩一兩幕)的陳

  冠希(被剪光反而令人印象深，出場後也一路聽到有人討論)。


  還是覺得婁燁的群戲好看(跳舞也好看)，可惜這片沒那麼多群戲。錯亂的時序與追查過程

  沒能令人同理主角，懸疑是有(但顯得有些刻意)，卻少了些緊張和迫切。此外，也略覺可

  惜的一點是華南地方與政治經濟的設定想起來很合我胃口，但整部片下來卻似乎沒有得到

  很好的發揮(好像都有風有影，但沒有足夠力量的感覺)。


  不過片頭第二場戲、讓我超暈的抗爭場景，還是滿好。立馬喚起婁燁愛好手持鏡頭的印象

  (婁燁加上以手持跟拍長鏡頭聞名的包軒鳴，我暈也正常)。終究還是留導演特色的片子。

  喜歡手持鏡頭與婁燁導演的朋友可以看。


  #馬思純還是很正

  #主題曲不是風中有朵雨作的雲讓片名有點弱掉了

  #但片尾一場遊戲一場夢出來莫名覺得很合

  #不錯看但還是覺得各種可惜

  #金馬影展2018


  ***


  這裡是我的樂園:






  FB:














  --'
