title: '[情報] 2023 巴勒斯坦奧斯卡代表：《地中海發燒友》'
content: '巴勒斯坦在日前公布了將申報明年奧斯卡「最佳國際影片」的作品，將以《地中海發燒友

  》（Mediterranean Fever）作為代表。




  《地中海發燒友》為以色列裔巴勒斯坦女導演 Maha Haj 繼《家庭私篇》的第二部長片作

  品，同時也是他二度入選坎城影展「一種注目單元」的電影，並且拿下了「最佳劇本」的

  殊榮。該片於香港影展的國際新導演競賽也同樣獲得「火鳥大獎」的榮譽。


  「電影講述一名立志要成為作家的一家之主Waleed，他心中的寫作夢卻因為憂鬱症遲遲無

  法實現。因緣際會認識了鄰居Jalal，兩位都為生活所苦的男人產生了友誼的共鳴，但就在

  這段男人間的友情滋長的同時，卻也讓彼此陷入了非法危機…」（取自 東昊）




  這是導演 Maha Haj 首度代表巴勒斯坦征戰奧斯卡。巴勒斯坦雖然因為歷史政治等因素在

  奧斯卡上的報名次數並不多，但從 2003 年首次參與競賽以來已有兩部電影獲得提名，且

  都是來自名導 Hany Abu-Assad 的作品，分別是《天堂不遠》與《奧瑪的抉擇》。


  《地中海發燒友》已由東昊代理，正式上映日期未定。



  --'
