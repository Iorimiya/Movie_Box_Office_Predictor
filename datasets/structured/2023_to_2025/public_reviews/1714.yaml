title: '[普雷] 《地中海發燒友》友誼的空中鋼索'
content: '身份壓迫這心病，隔壁鄰人的未爆彈


  創作故事的友情通常很令人嚮往，通常它代表著一個理想的朋友之間的價值觀或合作關係

  。但同時有些故事也反映出人與人交際應酬的寫照，有時候朋友之間算計和真誠來往都無

  關好壞，而是一種相處之道，畢竟人總是會為自己多設想一點，故國與國的關係有時候也

  同友情博弈的翻版。


  以巴勒斯坦兩個男人的友誼為主題的電影《地中海發燒友》，敘述想成為作家的瓦力，受

  到憂鬱症之苦，隔壁新搬來的鄰居各種作為讓他看不順眼。在一場喬遷派對上，瓦力意外

  知道鄰居不為人知的一面，開始與鄰居有了更多接觸，兩個男人發展出奇妙的友誼、相互

  交心、同時也相互盤算著什麼？瞞著自家人展開一場秘密計畫。









  《地中海發燒友》是什麼電影？


  人與人相處有時候是一種緣份，有時候彼此相當契合、但也有可能水火不容，不對盤雖然

  有著彼此不順眼的地方，但有時後一些故事和彼此之間的交流就是從這樣的異同之處開始

  看清彼此，而有接下來與對方更深入的了解，通常不是更加厭惡、就是看見對方在既定印

  象之外，讓人意外的樣貌，這其實就是與人交往的有趣之處。


  而在一場人與人之間的交往中，有時候之間的關係是很難說得明白，如同在朋友定位之間

  兩人或多人所看待的立場都不同。


  例如：有人光是彼此認識或聊得上話就覺得是對方的朋友，但也有人是需要一些時間相處

  ，確認彼此的來往是舒服且愉快的，或是相互有來有往才能歸類為朋友，故當彼此的認知

  有落差，也為這段友情增添更多意料之外的變化，這也讓人與人的往來變得更難以捉模。










  少數以巴勒斯坦人物為題材，《地中海發燒友》是部描繪男性之間友情和算計的電影。故

  事以想成為作家的瓦力，寫作因憂鬱遲遲沒有成果。剛好新搬來的鄰居的好客個性成為他

  的眼中釘。


  在一場晚餐派對上瓦力意外的發現鄰居的秘密，假借寫作題材為由接近，意外的與鄰居達

  成一段微妙的朋友關係，兩位男性的友誼也在盤算和彼此吐露日常不悅心聲下漸漸走到一

  種微妙的境界，運量著後面瓦力計畫的到來。


  你的好友不是你認識的朋友，用這個有趣的主題勾勒出黑色幽默的導演瑪哈哈姬，再一次

  以巴勒斯坦日常與小人物為題材，以地中海中東特有基因突變疾病「地中海熱」為發想，

  講述兩位個性截然不同的鄰居所發生的故事，與上一部電影相比，這部電影更佳的隱晦並

  且隱含著當代巴勒斯坦政治與社會的縮影。











  《地中海發燒友》分析與延伸：


  國際上說到巴勒斯坦一定會連帶聯想到永遠的敵國－以色列。以巴衝突並不是單一的導火

  線，而是多方多年的矛盾下所產生的國與國、政治、宗教跟種族的對立。可以延伸為以色

  列猶太人和巴勒斯坦阿拉伯人兩邊的矛盾和衝撞。


  雖然幾乎是攻擊和激進行徑登上國際新聞，但兩方的確是還有人在努力溝通維持兩方和平

  。而現在有兩邊各自成為單一國家的兩國方案，與融合成一個國家一國方案都有待討論，

  但前提還是需要解決文化與社會對立衝突。


  電影《地中海發燒友》就是以這樣的背景下去做延伸，但並不是用砲火與戰爭，而是更加

  日常和隱喻的方式去表達巴勒斯坦人的憂鬱。並且以黑色幽默的手法呈現出，巴勒斯坦人

  的身份認同，用瓦力一家巴勒斯坦人的生活樣貌，和與鄰居的相處擴展出政治縮影這點是

  導演瑪哈哈姬想要詮釋的部分，也使電影的故事更呼應現代巴勒斯坦人們對國家的意識形

  態，內心對於生活的掙扎。








  導演瑪哈哈姬2016的電影作品《家庭詩篇》就以較為直接的方式敘述巴勒斯坦與以色列的

  關係，用婚姻夫婦和軍中士兵等，敘述關於兩國彼此不明的關係，政治與社會還有家庭成

  長等，對兩國人民成為一種栓著思考的枷鎖，讓人想逃。


  《地中海發燒友》某方面對於逃跑的詮釋變本加厲，但也將無奈感化作更抽象與隱晦的方

  式，互看不順眼的鄰居彼此越線，最後難以收拾與解釋的關係，像是意有所指的兩國故事

  。


  導演瑪哈哈姬表示，她想用電影以稍微詼諧幽默的方法詮釋：巴勒斯坦人不管是在巴勒斯

  坦還是以色列，許多政治與國情間的壓力讓這裡成長的人備受煎熬，並且想尋找一個解脫

  的空間，但卻無力也無法。身份認同與文化精神的各種鴨裡下導致人民的無所適從，藉由

  個性相異的鄰居之間相處，彼此亦敵亦友的曖昧關係，來讓觀眾認識巴勒斯坦的政治與生

  活寫照。










  《地中海發燒友》值得一看嗎？


  這部電影以兩個男人從鄰居、朋友、再到共犯關係這點，是滿有趣的安排，而且對於有兩

  位個性不同住在隔壁的鄰人，透過各種劇情來暗喻明喻巴勒斯坦與以色列的關係，或是跨

  越兩邊的巴勒斯坦人的身不由己，這些地方處理都相當巧妙，可以讓稍微對兩國之間的國

  際局勢有所了解的觀眾，可以了解導演在拍攝與編劇的巧思。


  用鄰居的表與裏來詮釋一個與隔壁國相處的關係，這想法比起上一部《家庭詩篇》來說更

  有日常感和詼諧幽默，也比較不會太過沈重，但我認為這部作品在許多方面還是可以看出

  來比較致鬱安排，例如色調和光影的安排就將主角瓦力的憂鬱感給詮釋的很到位，也把他

  與鄰居的區別做出強烈區分。而裡面也有相當直接點到關於種族議題，通常是在瓦力與家

  人相處的部分。











  不過因為較為日常的關係，前面有一部分很詳細的敘述關於瓦力的憂鬱，也有一大段在詮

  釋鄰居隱藏的那一面，而導致會後兩人一起計畫的因果。導演想用較為黑色幽默的方式去

  敘事，但我認為在幽默上的力度其實沒有很多，整體電影還是有點惆悵，但是結尾的一幕

  算是將故事從憂鬱中再次解放，而是否又會再次輪迴或是有全新的展開，就像是每次以巴

  衝突的結束。


  世界上很多戰爭與對立，都是有層層的歷史所累加而成。以色列跟巴基斯坦、南北韓、還

  有近年世界關注的台灣與中國對於國家問題，在拍攝這些故事時，歷史事件通常都會讓人

  喘不過去。


  而《地中海發燒友》的劇本我覺得是很有趣和能讓人融入故事中來延伸巴勒斯坦與以色列

  的問題，也許可以讓台灣在詮釋兩國故事或對立觀點時另一種創意發想，直白的確是種有

  衝擊的表現手法，但隱晦表達讓人可以思考，傷痛的歷史並非揭露傷疤，有些疤痕也能很

  藝術性的讓人留下深刻記憶。


  --

