content: '新聞網址：



  《魔戒》動畫《洛汗人之戰》劇照首曝光！12月上映 三部曲導演當製片



  《魔戒》宇宙最新動畫《魔戒：洛汗人之戰》（The War of the Rohirrim）預計將於 20

  24 年 。本劇將由日本動畫監督「神山健治」執導，故事背景設

  定在，將

  。


  根據外媒 IGN 報導，《魔戒：洛汗人之戰》將拓展《魔戒》宇宙，深入探索

  編劇 Phoebe Gittins 表示，Hera 在《魔戒》中扮演著重要角

  色，但從未有過名字，編劇團隊對她的身世和經歷感到好奇，因此決定賦予她名字和更豐

  富的故事。


  目前能確定的是，《魔戒三部曲》導演 Peter Jackson 與其妻子 Fran Walsh 將《魔戒

  ：洛汗人之戰》擔任動畫執行製片人，故事將聚焦在《哈比人歷險記》主角「比爾博巴金

  斯」展開冒險前 200 年的事件，動畫團隊表示會為觀眾呈現一個他們從未見過的《魔戒

  》故事。






