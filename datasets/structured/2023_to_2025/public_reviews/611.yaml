title: '[討論] 魔戒：洛汗人之戰 前八分鐘搶先看'
content: '背景設置在《魔戒電影三部曲》事件發生的250年前，講述了傳奇洛汗國王海姆錘漢德家

  族的命運。 聰明而冷酷的黑蠻地領主沃爾夫突然襲擊

  ，為父親的死報仇，迫使赫爾姆和他的人民在古老的角堡要塞——一座後來為人所知的強

  大堡壘——進行大膽的最後抵抗。 海姆之女赫拉發現自己陷入了日益絕望的境地，她必

  須鼓起勇氣領導抵抗運動，對抗意圖徹底毀滅他們的致命敵人。


  --'
