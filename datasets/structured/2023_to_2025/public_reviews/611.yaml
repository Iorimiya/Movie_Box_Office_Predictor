title: '[好雷] 魔戒：洛汗人之戰'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  整部片可以說是幾乎沒冷場


  從赫拉送肉給巨鷹


  再到胖國王找老國王單挑被一拳打死


  再到赫拉去狩獵，遇到長毛象卻被章魚吞掉


  再到戰爭前的準備，赫拉本來要當傳令後來也確實在打游擊


  再到胖國王他兒子我忘了叫什麼發動戰爭


  戰爭打得蠻有聲有色的一點都不冷場


  但到兩個兒子被殺退回堡壘後就有點涼了


  除了老國王挑掉半獸人魔並且在寒天雪地外一拳一個最後變結冰


  胖國王兒子等冬天結束之後要用攻城塔攻堡壘


  這裡我一直想到天堂二工匠能叫攻城高崙攻城的回憶


  最後在一個赫拉盾殺胖國王兒子呼應盾牌少女


  然後結局出現個薩爾曼還有提到甘道夫點出可能會有第二集


  就我所看過的電影來說，整體不算太難看


  俊男美女就值得給出好評了


  要說沒冷場，也不是沒有，進入堡壘後有比較冷場一點


  戰爭前的節奏都算快的


  --

  如果不好看的片我看到一半就會離開了'
