title: '[負雷] 又臭又長的 魔戒：洛汗人之戰'
content: '衝著日式畫風去看但劇情太平庸又演很久

  開頭聖盔國王一拳擊殺大將快笑死

  後面看他用拳頭跟半獸人和巨獸對打才知道…

  喔！原來一開始是在鋪陳啊

  聖盔真的天生神力能手撕敵人

  那沃夫還來報什麼仇 你爸自己蠢單挑輸了還賴皮啊

  死了變成冰雕也很刻意（雖然很帥啦）

  但就算暴雪上面還是能射幾支箭掩護吧

  你們就看國王守門被圍死…算了 我知道這是劇情殺

  再來講講女主

  就是耍帥、義正嚴辭講幹話、不認輸但很弱（除了最後3分鐘的打鬥）很多時候還是靠盾之女推進劇情…

  穿婚紗可以跳來跳去都不會勾到…太多可以吐槽

  再來談談配樂

  魔戒耶！配樂當然一定棒吧

  對！配樂不錯 但都在很平淡的劇情突然出現滂薄氣勢配樂

  接著…也沒有要幹嘛！真的沒要幹嘛！

  完全沒有史詩感！

  最後致敬聖盔谷騎兵突擊大概是全片最有氣勢一幕

  然後跑下去就沒了….

  整部又臭又長 很少有動畫片2個小時都那麼無聊的

  還有一堆吐嘈點

  像2個王子的低能死法

  很懷疑編劇是不是在挑戰觀眾智商

  唉


  -----

  Sent from JPTT on my iPhone


  --'
