url: https://www.ptt.cc/bbs/movie/M.1735130922.A.DD8.html
title: '[負無雷] 魔戒:洛汗人之戰 女強人再度崛起'
content: '雖然說原著只有一句話

  不過我們的赫拉女主角可是十項全能的女強人

  不願意隨便政治聯姻

  餵食大老鷹

  超強的戰略大師

  格鬥劍術也是屌打男人

  真正被做成雕像的戰槌大人無意義的壯烈犧牲

  而且最後決戰打的也十分短

  應該連三分鐘都不到

  真的是非常不過癮

  不過好歹是日本人做的

  女主還是夠正沒有肥醜

  應該要謝天謝地了


  中間放了很多想讓人想起魔戒的元素

  像是上面的老鷹還有戒指或是大象和沼澤大怪

  可是實在看不太出來這是魔戒世界觀的作品

  中間充斥著許多不必要的劇情

  長達兩個小時實在太長了

  也沒甚麼實質上的爆點

  魔戒粉也不推薦去看


  --'
