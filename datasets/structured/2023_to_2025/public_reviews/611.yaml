url: https://www.ptt.cc/bbs/movie/M.1736069293.A.134.html
title: '[極負雷] 時間多也不該看的魔戒：洛汗人之戰'
content: "先上入場證明\n\n\n這部片掛魔戒的名稱，是在污辱魔戒吧?\n\n但是這部片如果不掛魔戒的名稱，也不該叫什麼洛汗人之戰\n沒有什麼史詩戰役大場面，\n\
  沒有悲壯的生離死別，置之死地於後生，從絕境向生的描寫\n\n也沒有什麼...\n\n這部片到底適合什麼樣子的人啊...\n就算每天有48小時，也不該來看這部片吧...\n\
  \n或許，想看北斗神拳的拳四郎出現在中古奇幻故事的人...真有樣的人嗎(思\n\n還有就是抖M了吧?\n\n-----------------防雷線，以下大量吐槽，介意者慎入------------------\n\
  \n\n\n這部片如果改成叫做...\n\n「工具人之戰」或是「舔狗人之戰」\n\n勉強還算切題，\n是說除此之外可能沒有比較適合的標題了。\n\n畢竟敗者是工具人，勝者也是工具人。\n\
  \n先我流概述一下劇情：\n\n\n故事非常簡單，西邊的領主來謁見洛汗王，標準惡役臉，冷嘲熱諷之下\n\n洛汗王邀他出去單挑，西邊領主率先出拳揍了洛汗王，洛汗王曉以大義之後\n\
  \n回敬了一拳，西邊領主一個完美的弧線倒在地上就不動了，對，沒氣了\n\n領主兒子對著洛汗王說我一定會找你復仇，故事就這樣開始了。\n\n\n這次事件之後領主兒子失蹤，之後女主在一次遊獵時遇到一頭生化猛瑪\n\
  \n本來工具人二號的表哥要讓女主先逃，騎馬肉身引走了猛瑪\n\n但女主不聽，拿著撿到的號角吸引猛瑪注意，然後將猛瑪引進了叢林內\n\n結果猛瑪就被疑似是克蘇魯系的怪物吃了，\n\
  \n但女主這時被領主兒子的軍師發現，抓了回去。\n\n\n然後表哥跟退休的盾牌少女...奶奶，\n還有雜貨商(?)隨從跟蹤到了女主被關押的地方，\n三人就研議要去救女主，\n\
  在表哥跟盾牌奶奶開無雙，兩人殺進敵方大營救出女主\n女主騎著馬，\n敵方眾兵將也不懂斬馬腳就看著女主騎馬正面從自家大營出去了\n\n領主兒子說了句：「不用追了，她太快了。」\n\
  \n\n\n\n所以眾人就安然無恙回到洛汗，\n\n之後女主跟表哥對洛汗王進言說千萬不要小看那領主兒子，\n結果表哥被洛汗王吼了句滾回去連你表妹都顧不好，\n\
  女主的進言也沒傳達到洛汗王耳中\n\n洛汗王：「妳嫁人我才會高興啊，戰爭的事你不懂。」\n\n然後決議出兵正面討伐叛賊，\n\n盾牌奶奶還安慰女主說：\n「別擔心，你沒看過你父親年輕時怎麽一個人衝進我們村莊開無雙割草的」\n\
  \n\n可想而知，此戰必敗。\n\n\n\n\n\n\n\n洛汗王帶著大兒子和二兒子的軍隊在平原上直接吃了對方弓兵火箭雨一輪\n\n又被從側邊夾攻，洛汗王要兩個兒子回去找女主，\n\
  \n\n女主這時候呢，難得智商在線發現有內鬼，\n\n先疏散了平民，還燒了城門。\n\n\n敵方猛瑪駕駛兵：「猛瑪怕火阿，沒辦法前進阿」\n\n\n這應該多虧女主小時候都在外打野味的經驗吧，我猜。\n\
  \n\n然後大兒子回程開無雙，展現了跟他爸一樣力大無腦的本領\n一人砍倒了一隻猛瑪，然後站在猛瑪屍體上戰吼，\n瞬間被敵方弓兵從側方穿腦，卒。\n\n\n\n\n\
  二兒子是這部比較可以的角色，\n\n他找到了女主，但女主看到大哥被穿腦想回去救，\n\n然後女主就跟二兒子拉拉扯扯的\n\n最後洛汗王也回到本陣，被領主兒子嘴跑，\n\
  洛汗王看到大兒子陣亡加上精神防禦太低被定身的情況下\n中了敵方數箭\n結果還是被女主和二兒子救到，\n一行人準備撤退，\n\n但是二兒子的老母馬，累了，走不動了，\n\
  二兒子知道自己命不久矣，讓女主帶洛汗王先走，\n\n自己下馬後，留下來拍拍自己的好夥伴，之後抽箭矢拉弓。\n\n這幕算是個人覺得這整部描寫最好的一幕。\n\n\n\
  \n\n\n女主跟洛汗王撤退到山壁要塞，\n沒想到領主兒子追了上來，\n還抓了二兒子當人質，\n本來領主兒子的軍師想勸他交換人質，\n但他直接把二兒子殺了。\n\
  \n女主跟洛汗王崩潰，之後就是洛汗王在這要塞病倒不醒\n\n跟隨洛汗王的幾個將領說著信鴿都被擊落，要撐不過去了\n然後還繼續喝著紅酒，女主經過時看到立刻大斥一聲：\n\
  \n「不能放棄希望！」然後就走了，不知道在幹嘛。\n\n然後西邊領主勢力正在修建攻城塔準備攻城\n\n有天洛汗王從床上消失了，女主也找不到人，然後過了不知多久女主誤觸機關也消失了\n\
  \n\n\n來到了某個祕密通道，在外面發現了蒐集戒指的半獸人們\n\n\n結果女主白目從通道走了出去驚動半獸人，千鈞一髮之際，\n\n\n\n拳四郎...洛汗王從天而降，\n\
  \n\n靠著雙拳直接擊退體型較小的，\n還正面擋住體型大的轟天一擊\n隨後由女主補刀。\n\n之後兩人表現了刺客教條可能才有的特技：滑山坡。\n一路滑加跑要回要塞，被西邊領主兒子發現，\n\
  你追我跑的，眾人要開城門讓兩人進城結果城門受凍打不開，\n最後打開一個小縫讓女主進去，\n\n洛汗王直接徒手合上眾人都打不開的城門。\n\n\n\n\n\n\n\
  \n這邊要補充下，\n洛汗王從床上消失不知道過了幾天，\n在零下N度的戶外度過不知道幾天，\n可能有生吃敵方雜兵的肉當營養補充啦，\n之後一人在外開無雙，\n\
  靠著雙拳跟咱兵奮鬥了一天一夜，\n應該有幾百人斬吧我想\n最後在外面變成冰雕。\n\n拳四郎的一生就此落幕，\n史詩感有沒有(?)\n\n\n\n\n\n\n\n\
  \n接著女主奮起，大概是做了整部片唯一能稱得上智謀的舉動\n\n\n\n靠著兩隻槌子爬上懸崖跟巨鷹對話請求幫助這種奇幻故事基本款應該不用多講\n\n總之她是拿著洛汗王的盔甲去給工具人二號的表哥。\n\
  \n在最後戰役發揮奇效，\n女主憑藉工具人一號對自己的執著，\n一人拖住了反叛勢力全部軍隊，\n稱到表哥來救場，表哥穿洛汗王全套裝備登場時因為背光，\n叛軍都以為洛汗王復生或是亡靈來找他們報仇了，\n\
  嚇死的嚇死跑得跑，仗都不需要打了，女主一方就這樣贏下守城戰。\n\n堪稱死諸葛嚇走活仲達...但是這好像又直接侮辱了諸葛跟仲達...\n\n最後表哥登基洛汗王，女主去跟甘道夫遊山玩水，可喜可賀可喜可賀。\n\
  \n\n我們先來看看工具人一號，本作最大的輸家，左邊紅框這位\n\n因為是看日配，所以是津叔配音\n\n\n\n為什麼要讓津叔配一個小丑阿阿阿阿啊啊阿!!!!!!\n\
  \n整部片台詞幾乎都是重複的\n\n「我要復仇」\n「妳會後悔的」\n「我已經不是當初的那個男孩了」\n「繼續攻城」\n「你又想做我的王后了嗎」\n「想嫁給我了嗎」\n\
  「不然妳要嫁給誰」\n\n從一開始向女主求婚被拒之後，\n這個角色就只剩一個調性，\n\n\n\n\n想看洛汗王崩潰的樣子，\n想看女主崩潰的樣子，\n但是女主想回來當我老婆也不是不行啦，\n\
  \n最後攻城戰，女主一人出來談條件，\n還直接答應讓其他兵將都在後面看兩人單挑\n結果還挑輸，\n挑輸之後想要小人一下偷襲，被女主擋下，\n接著被女主用盾牌壓著壓到窒息死掉。\n\
  \n為什麼要讓津叔配這種小丑阿阿阿阿!!!!!\n\n整部片起於工具人舔狗求而不得最後還是不得作為主軸，\n\n所以才說斗M才會想看吧?\n或是喜歡看工具人一無所有的可能也可以看啦...可能(\n\
  \n\n\n\n\n\n\n\n\n\n這部片唯一的智商擔當就是右邊黃框的這個軍師，\n\n他教領主兒子怎麼樣可以當一個王，\n\n但是領主兒子只想要女主，其他啥都不要。\n\
  \n\n最後還被領主兒子直接捅死，不勝唏噓。\n\n\n\n\n\n\n\n\n工具人二號--表哥，本作大贏家\n\n(表哥...表哥的圖預告片看起來沒有)\n\
  \n\n跟盾牌奶奶殺進敵方領地救女主，\n\n被洛汗王吼了滾回去，\n\n還不生氣，說：「我的劍永遠為你效勞」\n\n\n之後繼續在自己的領地苦等消息，等到女主終於騎巨鷹來求援\n\
  \n然後穿上洛汗王全套裝備火速救援，最後登基成為新的洛汗王。\n\n\n但是戲份實在太少，所以工具人想代入也比較困難，是比較可惜的地方。\n\n\n\n\n\n\
  \n還有很多能吐的地方，\n洛汗王說詞反覆不一，\n一開始對女主說妳不懂戰爭，\n後來又說妳一出生我就是你的臣下。\n\n\n但累了，就這樣吧。\n\n\n這部片基本只靠音樂在撐，\n\
  聽著喜歡的聲優們講出各種不帶思考的台詞或跳針真的很難受。\n\n\n\n以上。\n\n--\n                                \
  \         01/05 17:28"
