url: https://www.ptt.cc/bbs/movie/M.1718457641.A.1DD.html
title: '[新聞] 《魔戒》三部曲前183年 《洛汗人之戰》12月開打'
content: "《魔戒》三部曲前183年 《洛汗人之戰》12月開打\n\n2024/06/15 05:30\n\n\n動畫電影《魔戒：洛汗人之戰》昨曝光首波劇照，帶領影迷回到《魔戒》壯闊的史詩世界\n\
  。（華納兄弟提供）\n\n〔記者許世穎／綜合報導〕原創動畫電影《魔戒：洛汗人之戰》由獲獎無數的名導神山健\n治執導，昨搶先曝光劇照，故事背景設定在《魔戒》三部曲的183年前，將帶領觀眾回到\n\
  改編自托爾金名著所創造出《魔戒》三部曲的壯闊史詩世界。\n\n該片講述傳奇洛汗國王聖盔鎚手的家族故事，為了替父親報仇，聰明又狡詐的登蘭德領袖\n沃夫突然發動攻擊，迫使聖盔與他的人民在遠古要塞號角堡面臨九死一生的背水一戰，此\n\
  強大的要塞也在日後被稱為聖盔谷。\n\n電影由《繼承之戰》布萊恩考克斯領軍配音，為強大的洛汗國王聖盔鎚手獻聲，曾在《魔\n戒》三部曲表現精彩、獲大獎肯定的米蘭達奧圖，再度回歸詮釋洛汗女戰士伊歐玟，並同\n\
  時擔綱片中的旁白。《魔戒：洛汗人之戰》預計12月在台上映。\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\
  \n\n\n--"
