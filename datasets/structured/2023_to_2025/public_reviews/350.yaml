title: '[好雷] 蝸牛少女回憶錄'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  今年的奧斯卡最佳動畫長片，除了皮克斯的《腦筋急轉彎2》、夢工廠的《荒野機器人》

  與最後得獎的《喵的奇幻漂流》之外，安錫動畫影展水晶獎最佳影片《蝸牛少女回憶錄》

  也很傑出。雖說看完之後個人還是覺得《喵的奇幻漂流》略勝一籌，但《巧克力情緣》的

  導演又再次以黑色幽默帶我們看見悲劇人生的新希望。



  想理解人生，需要回頭看；要過好人生，必須向前看！熱愛蝸牛、喜歡閱讀但人生慘到不

  能再慘的emo少女葛瑞絲，因父母早逝，她與相依為命的雙胞胎弟弟被強行拆散，送往不

  同的寄養家庭，孤獨的她只有蝸牛作伴，像躲在殼裡逐漸封閉自己。



  《蝸牛少女回憶錄》是一部定格動畫，除了主要角色以黏土呈現之外，全片的各種大小物

  件也看得到其他媒材，豐富、多元且細緻的零件讓觀眾在觀影過程中全然沉浸在葛瑞絲的

  世界。雖然動畫本就不是專為小朋友而拍攝，但本片卻是專為大人所製作。分級在台灣為

  輔導級，但在美國則由於內含性元素、裸露與一些暴力元素而分為限制級的R級，可能也

  是要心智夠成熟到足以觀看《蝸牛少女回憶錄》的觀眾，才能從電影當中領略導演的巧思

  。



  女主角葛瑞絲與雙胞胎弟弟吉伯特從小受父親影響，養成閱讀的習慣，首尾呼應的是德國

  哲學家叔本華的：「想理解人生，需要回頭看；要過好人生，必須向前看！（Life can

  only be understood backwards; but it must be lived forwards.）」當觀眾跟著葛瑞

  絲「回頭看」她「悲慘」的人生，真的是非常不忍心。出生就是唇顎裂寶寶的她，從小遭

  受霸凌，父母雙亡的死別之後姊弟還得面臨生離，雖說自己的領養家庭還不錯，但從信件

  得知弟弟生活在水深火熱之中，葛瑞絲心裡也不好過。結婚前夕弟弟逝世，好不容易找到

  的「真愛」卻沒想到是性癖怪異的變態，而她的人生走到這裡，雖然還年輕，但健康也早

  已出問題。



  幸好，葛瑞絲及時打住，果斷結束有毒的婚姻，為自己的身體著想開始減重，並戒掉囤積

  癖。當觀眾終於聽到故事發展到「現在」，也代表她不再是回頭看，而是向前看著目前自

  己即將過下去的人生。同樣首尾呼應的還有蘋琪臨終前的神祕遺言，彷彿《大國民》裡的

  「玫瑰花蕾（rosebud）」一般，不到最後一刻無法參透其意義。坐在花圃上對蝸牛與觀

  眾分享自己人生回憶的葛瑞絲，講完故事後，一「向前看」馬上領會蘋琪想告訴她的話，

  而已經把自己「整頓」好的葛瑞絲，這也才開始能夠「過好人生」。



  每個人一生中一定都有像蘋琪一樣的朋友，古怪又溫暖，而或許我們自己也都曾是別人的

  蘋琪。她們初相識是在葛瑞絲發現蘋琪誤將圖書館的書還至垃圾桶，但她好心提醒而非舉

  發讓兩人結下不解之緣。葛瑞絲很羨慕蘋琪，覺得她總是做很多很酷的事，在這段友情裡

  ，蘋琪與葛瑞絲可以說是互相接住彼此。蘋琪很有錢，但如果沒有葛瑞絲一起分享喜悅，

  她的冒險可能不會那麼精彩；葛瑞絲悲慘黯淡的人生，因為有蘋琪而開始出現許多亮點，

  在她失戀又失去至親的最低潮，也是蘋琪陪在葛瑞絲身邊幫助她、陪伴她、鼓勵她度過難

  關。人生能得一好友如蘋琪，夫復何求？相信葛瑞絲讀完蘋琪寫滿祕密的信，必定也會帶

  著對方的祝福過好接下來的人生。



  蝸牛在片中代表不少意象，葛瑞絲與吉伯特的媽媽是一位軟體動物學家，所以他們從小對

  蝸牛並不陌生，而葛瑞絲更是愛屋及烏，迷戀各種蝸牛造型的收藏品，直到她的身心出現

  變化進而轉為囤物癖。葛瑞絲喜歡蝸牛得以躲進殼裡，掩耳盜鈴般好像外面的一切不曾發

  生，但其實她最需要向蝸牛看齊的是牠們不走回頭路，永遠前進的心態。當葛瑞絲下定決

  心丟棄自己所有的收藏，她最後選擇留下父親送的蝸牛帽，懷念也好，紀念也罷，那都是

  葛瑞絲最初愛上蝸牛的起點。



  蝸牛產卵後有很大的機率會死亡，葛瑞絲認為媽媽大概就是太愛蝸牛，因此才會早早離開

  他們。不過，只要蝸牛的後代有獲得良好的照顧，蝸牛媽媽的犧牲就有價值。蘋琪死後，

  葛瑞絲決定放生自己心愛的蝸牛，而牠也產下後代，讓自己的生命生生不息。葛瑞絲或許

  不再囤積蝸牛收藏品，但她必定沒有停止喜愛蝸牛，反而會繼續勇敢前行，即便走得比別

  人慢，葛瑞絲終究會走到屬於她的幸福。



  《蝸牛少女回憶錄》不但是部令人感動、感傷的電影，更是一部笑淚交織的作品，尤其是

  片中令人意想不到的各種轉折，有時都讓人啼笑皆非。不論是爸爸的癱瘓與死亡原因，還

  是葛瑞絲與吉伯特分別受不同家庭領養後的狀況，明明都不是太開心的結果，但其中的荒

  誕還是讓觀眾忍不住哄堂大笑，這就是黑色幽默的魔力。



  當一家人準備歡喜迎接吉伯特到來，卻只盼到一紙捎來死訊的信，到最後揭曉弟弟其實沒

  死，而且還緊抓著對姊姊的承諾完成不可能的任務，跨越澳洲中部遼闊的沙漠，都是令人

  驚奇的轉折。甚至於葛瑞絲以為的真愛居然令人作嘔，其實轉念一想，這些誇張的人生挫

  折，可能會發生在每個人身上。當下看肯定是悲劇，但回頭看時由於我們已理解人生，反

  而能夠一笑置之。就像喜劇演員卓別林所說：「人生近看是悲劇，遠看是喜劇。」為了創

  造出更多屬於自己的悲劇也好，喜劇也罷，向前看，過好人生就是《蝸牛少女回憶錄》開

  給每位觀眾最好的人生處方簽。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
