title: '[極好雷]《蝸牛少女回憶錄》短評：小小的愛'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《蝸牛少女回憶錄》 極好雷短評：小小的愛\n\
  \n■ 無雷推薦語\n\n\n\n\n■ 殼內的溫暖，以及破殼而出的一道微光（有雷）\n\n《蝸牛少女回憶錄》讓我想起來小時候為什麼那麼愛讀小說。\n\n\n\
  電影非常擅長刻劃人物的細節，例如寫少女的父親，用甘草糖、彩票和掌聲，幾個細節就\n能拼出他的想望與生活（比超級英雄還立體！）。除了建構每個角色的動機，也讓人不知\n\
  不覺產生好奇與投射。\n\n看虛構故事的時候，一定會想說：現實有那麼光怪陸離嗎？\n\n但當你仔細看《蝸牛少女回憶錄》，車禍癱瘓、囤積症、皺的像長筒襪的皮膚.....每件\n\
  事情拆開看都不足為奇，但好的故事有股魔力，讓你打開感官和想像，去思索每個細節背\n後的意義與秘密。\n／\n\n\n\n我很愛作者諷刺正能量語錄，以及極端宗教人士的段落。面對人生的失落與無常，兩個家\n\
  庭分別提供了誇張的解方，最後都證明了他們的侷限性。\n\n\n\n\n支撐我們繼續向前的，往往是生活中不起眼的時刻，像是一起拍手讓爸爸不會提早離去、\n兩兄妹靜靜坐在沙發上閱讀小說。（諷刺的是惡念亦然。）\n\
  \n組成我們人生的每個碎片，講出來都小小的，卻讓人倍感溫暖。就像角色講一萬遍我愛你\n，還不如每次都及時遞出的香腸和薑糖餅。\n／\n\n\n人會老、陪伴我們的家人終將離開。\n\
  \n\n唯一能傳下去的，可能只有手牽手時殘留的餘溫，或是偶然幫流落街頭的人蓋暖被，這些\n短暫卻踏實的善意。\n\n\n／\n小記1：\n超愛片頭，堆滿蝸牛收藏品的房間怪奇又美麗（後來才知道，是殘酷又美麗\n\
  ），很喜歡在空間裡挖掘細節的\n過程。\n\n小記2：\n旁白跟音樂大加分，帶入感非常足。\n\n>> 網頁好讀版：\n–\n脆：\nIG：Fishpond_like\
  \ \n臉書：魚池 FishPond \n個人網站：\n\n--\n超有感啊～前面有些片段就已經開始哭了"
