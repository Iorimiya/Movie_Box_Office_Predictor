title: '[好雷]半生緣：不圓的緣 '
content: '張愛玲的作品比起白先勇難拍，難拍的是字裡行間多了太多太多的意象，具象的不是那麼

  多．構築滄桑的戰火時節，張愛玲寫下那些文字時人在香港，香港仍是英屬地，於她的作

  品裡，有著豪爽卻也有著屬於女性的小家子氣．上回看完半生緣是年約十七貼十八時，那

  時還生嫩，對於對話背後還不怎麼了解，到了今日看去，更深層的意涵直撲而來．


  曼禎先認識叔惠才認識世鈞的，叔惠個性愛熱鬧活潑，世鈞安靜地不像話，就是木訥．將

  三人扯在一起的機緣則是叔惠在一家食店裡看到曼禎，拉了世鈞共桌．食店有些髒，叔惠

  管文的愛乾淨，差使小二無果，拭不淨竹箸，就交由茶水．世鈞髒慣了，洗淨的筷又擱在

  案上．世鈞覺得羞赧，隨手抓起茶杯喝去．曼禎大笑，世鈞也笑著，也許那時曼禎就上了

  世鈞的心坎裏頭．





  曼禎的父親很早就去了，家裡本來就窘困，父親一去便是雪上加霜．那年，曼璐便離開學

  校，去舞廳作舞女．普通的舞女能掙什麼錢呢？曼璐早早就進不歸路，為了撐起一個家，

  讓家裡能不為錢煩憂．在父親去世前，曼璐有戀人叫做預瑾．曼禎年華正是時候，曼璐則

  是被年華褪去風采．曼禎談著戀愛，曼璐再也沒有戀愛可談．誰要她，要一個從舞女下來

  ，成了二線交際花的女人．曼璐聲音總是尖銳的，像是有人騷她癢掐她的肉，也許這都是

  偽裝，裝成別人至少讓自己比較快活．


  後來，曼璐嫁給祝鴻才，笑時像貓，不笑時像鼠，看起來怪不正經的人．曼璐的旺夫運帶

  起一個家，祝鴻才成了生意人，曼璐成了少奶奶．但她除了錢，什麼也都沒有，心裏都是

  空的．也許不是空的，曼璐的心裡一直有年少戀人預瑾．有朝預瑾到上海見曼禎一家人（

  他已是鄉下醫院的院長），母親沒和曼璐說，和預瑾則是草草地帶過曼璐．聽聞消息後的

  曼璐趕回家，尋預瑾一面，帶著滿是波瀾的心，忐忐忑忑地見他．


  預瑾說，回想過去，只覺得好笑


  母親則是對曼璐說，預瑾和曼璐的氣氛不錯．曼璐心裏燒了起來，她所寄託的過往碎的徹

  徹底底．總覺得，大概是那時曼璐就對曼禎起了妒心，才將她推給祝鴻才糟蹋．誰能真的

  懂曼璐，為了一個家只好作賤自己，賣身卻得不到尊敬．也因為自己，曼禎與世鈞的婚事

  才遲遲不來．也罷！那就和自己一起給祝鴻才糟蹋，借他者肚子，還得怕祝鴻才到外頭拈

  花惹草，自己的妹妹倒不用擔心，做大做小都好．


  曼璐對曼禎說「我家出了個烈女啊！我也是可以成烈女，但你們都得挨餓」


  曼禎對於曼璐有著太多的抱歉，對於別人總看不清他們家，也是無止盡的無奈．世鈞家裡

  只剩世鈞一人，大概自小在兄長的庇護下長大有些怕事，怕別人用異樣眼光看他倆．也許

  曼璐在外頭為了家犧牲太久太累，才扯下曼禎，讓她一起受罪．曼禎曾想逃脫，世鈞也去

  找她的，但都錯過，這一錯過就是十來個年頭．彼此的消息都是藉由旁人輾轉入耳，被曼

  璐蒙騙的世鈞一氣之下就和翠芝成婚，當天兩人都後悔．畢竟，翠芝心裏住的是叔惠，世

  鈞自始至終住的是曼禎．


  是誰負了誰，是時間來的早來的晚，才讓人不停地錯過．世鈞的腦裏總有尋曼禎的念頭，

  想豁出去找人，離開現在的家．翠芝很常鬧脾氣，遇上叔惠更是．叔惠離了中國去了美國

  ，娶了一名年輕有錢的小姐，脾氣有著翠芝的影子，但更倔更傲．


  「世鈞，我們回不去了」


  最後，曼禎對著世鈞說．手腕上一條長長的疤，是想離開祝家時打碎玻璃割的．時間讓兩

  人之間的鴻溝更深了，愛著卻更難一起生活，他們曾是彼此寄望所託，他們是彼此的夢，

  是夢就會醒的．


  十七十八時不懂，現在我想我懂了曼禎，一看到世鈞就像看到過往，愛戀的時間不長，長

  的是殘酷的生活，她為祝鴻才生下了孩子，離開祝家．直到曼璐死了，才回到祝家，和孩

  子和祝鴻才同住．恨一個人能多久呢？恨一個人和愛一個人一樣，很累很難堅持．





  「也許愛不是熱情，也不是懷念，不過是歲月，年深月久成了生活的一部份。」



  張愛玲的文本難以詮釋，拍成電影難，拍成電視劇更難，曖昧不明地還是交給電影好些．

  電視劇的曼璐不如梅艷芳飾演得來的有味道，看著梅艷芳的扮容，總覺得回到上海百樂之

  門．


  原著對上電影幾乎完完全全的搬上銀幕，不過小說開頭是交由世鈞說起，電影則是看淡一

  切的曼禎．很長的時間，我不懂曼禎為何不能像個女孩，直直地撲向世鈞，世鈞為何要賭

  氣，為何不多等幾日，偏偏選了和自己相仿的翠芝．人生本是鬧劇，在張愛玲的筆下，更

  是鬧得徹底．荒謬，荒腔走板的大時代下的愛情．




  --'
