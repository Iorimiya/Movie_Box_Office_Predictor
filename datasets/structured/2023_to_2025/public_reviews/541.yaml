title: '[情報] 松山研一將主演《海鷗食堂》導演新片《川邊牟呼栗多》'
content: '根據日媒的報導，以《海鷗食堂》和《當他們認真編織時》聞名的日本女導演「荻上直子

  」將睽違四年帶來新作《川っぺりムコリッタ》（川邊牟呼栗多）。




  《川っぺりムコリッタ》是荻上直子繼《當他們認真編織時》後久違四年的新片，這次將

  改編自己筆下在 2019 年發行的同名小說，依然由導演親自編寫劇本。


  《川っぺりムコリッタ》的故事描述男主角山田在北陸的一個小鎮當中的塩辛工廠裡找到

  了工作，並在一個名為「牟呼栗多公寓」的老舊便宜住宅區中開始他的新生活。盡可能不

  與他人有所牽連的山田在一日隔壁的鄰居「島田」來借廁所洗澡後有了巨大的轉變。兩人

  之間也因而逐漸開始萌生了友情。不過在一日，島田發現了山田不為人知的一個秘密...。




  上回在《當他們認真編織時》中找來了傑尼斯偶像男星「生田斗真」突破的飾演跨性別女

  性，具話題之外也受到了好評。而這回在新片《川っぺりムコリッタ》又請來了哪些演員

  呢？其中的男主角「山田」將由曾在真人版《死亡筆記本》電影飾演「L」而廣為人知的「

  松山研一（松山ケンイチ）」演出，至於鄰居「島田」則找來了以《勇者義彥》系列聞名

  的「室剛（ムロツヨシ）」飾演。


  荻上直子是日本中新生代備受矚目的女導演之一，曾經以《海鷗食堂》和《當他們認真編

  織時》兩度獲選為旬報年度十大日本電影。除此之外，他也相當受到柏林影展的器重，從

  第一部長片《吉野理髮之家》就入選柏林影展。此後還包括《樂活俱樂部》與最近一部《

  當他們認真編織時》都入選柏林的「電影大觀」單元，其中《當他們認真編織時》更在世

  界 LGBTQ+ 電影首屈一指的獎項「泰迪熊獎」中抱回了評審團大獎，比《以你的名字呼喚

  我》和《春光之境》等名作更受到評審團的青睞。




  《川っぺりムコリッタ》已於九月初於富山縣中開拍，預計在這個月中殺青。該片為角川

  所出品之電影，預計在明年上映。


  如同前段所言，導演荻上直子過往相當受到柏林影展的青睞，以拍攝時程來看，到明年的

  柏林影展前還有相當充裕的時間，或許導演有相當高的機率再度重返柏林。







  --'
