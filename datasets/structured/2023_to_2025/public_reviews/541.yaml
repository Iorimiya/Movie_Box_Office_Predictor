title: '[討論] Apple TV特價 幸福入場券/海鷗食堂/鳶'
content: '【2024/03/05 Apple TV 特價報】

  幸福入場券／瘋狂夜笑生／西西里的漫長等待／警網黑幕／埃及王子／鳶／海鷗食堂

  －

  今天的特價整理了環球的3部4K電影給大家，其中首推茱莉亞羅勃茲和喬治克隆尼在前年

  合作的《幸福入場券》。有些評論認為這部片的劇情偏老梗，但我覺得兩位超大咖主角都

  有被安排到適合的角色，如果是衝著演員來看的話應該是不會失望，要當成粉絲向電影也

  無妨，$90的價格也算是物超所值了。根據以往的經驗過幾天應該會再更新一波環球特價

  片單，大家可以拭目以待。

  －

  然後目前也有幾部難得特價的日本電影，阿部寬主演的「鳶》是改編重松清的著名作品，

  這部小說以前也曾被改成同名日劇，評價非常好。阿部寬把這位平凡真實的老爸詮釋得很

  好，片中的時代感也很到位，推薦給喜歡昭和風的朋友。另一部推薦給大家的是相當療癒

  的《海鷗食堂》，這部在以日常料理為主題的作品中算是很早期的經典，溫和悠閒的氛圍

  加上超棒的食物視覺呈現，是看起來很舒服的電影。

  －

  最後推薦給大家的是升級到4K的《埃及王子》，這部也是夢工廠的經典大作了，目前是小

  特價$350。比較可惜的是沒有中文字幕，不過以他的特價頻率來看，我覺得也是可以接受

  的收藏時機。

  －

  以上，祝大家看片愉快！

  －

  未特別註明 畫質皆為 HD

  4K = 4K 畫質

  HDR = HDR 動態範圍支援

