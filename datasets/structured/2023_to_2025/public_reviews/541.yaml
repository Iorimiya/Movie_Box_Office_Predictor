url: https://www.ptt.cc/bbs/movie/M.1622012302.A.0E3.html
title: '[情報] 滿島光加入《海鷗食堂》導演新片《川邊牟呼栗多》'
content: '根據日媒今日的最新報導指出，滿島光（満島ひかり）加入《當他們認真編織時》荻上直

  子導演的最新作品《川っぺりムコリッタ》（川邊牟呼栗多）。



  （圖片來源：網路）


  《川っぺりムコリッタ》是荻上直子繼《當他們認真編織時》後久違四年的新片，這次將

  改編自己筆下在 2019 年發行的同名小說，依然由導演親自編寫劇本。


  《川っぺりムコリッタ》的故事描述男主角山田在北陸的一個小鎮當中的塩辛工廠裡找到

  了工作，並在一個名為「牟呼栗多公寓」的老舊便宜住宅區中開始他的新生活。盡可能不

  與他人有所牽連的山田在一日隔壁的鄰居「島田」來借廁所洗澡後有了巨大的轉變。兩人

  之間也因而逐漸開始萌生了友情。不過在一日，島田發現了山田不為人知的一個秘密...

  。


  先前已經公布「松山研一（松山ケンイチ）」和「室剛（ムロツヨシ）」將分別飾演兩位

  男主角山田與島田。而今日的最新消息中則釋出了《愚行錄》實力派女演員「滿島光」與

  《福島50英雄》日本資深影帝「吉岡秀隆」也將在電影中飾演重要配角。


  滿島光將演出一位丈夫早逝並與兩位女兒同住的有錢人家「南詩織」，吉岡秀隆則飾演同

  住在該公寓中以販賣墓碑為生的男子「溝口健一」。


  這是滿島光睽違兩年演出的電影作品，上一回演出電影已經是 2019 年的《最高の人生の

  見つけ方》，再上一部則是 2017 年的《海邊的生與死》。近年鮮少亮相於大銀幕上。



  （圖片來源：網路）


  《川っぺりムコリッタ》預計在今年於日本上映，目前尚未正式定檔。


  ---


  結果柏林沒出現，坎城有機會嗎？







  --'
