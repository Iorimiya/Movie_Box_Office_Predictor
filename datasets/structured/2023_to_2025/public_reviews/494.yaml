url: https://www.ptt.cc/bbs/movie/M.1743858790.A.E09.html
title: '[好微雷] 366日:沖繩推廣好片'
content: '以下微劇透，手機排版與發文請見諒


  這部電影靈感取自於日本很紅的HY的“366日”這首歌，為了這部電影HY有再出新歌“恋

  をして”，個人更喜歡這首!


  這部電影在日本也相當受歡迎，已經銷售超過25億日元的樣子~



  先說結論，配樂跟音樂的切入點都超棒!

  HY總共有三首歌在電影中置入，三首歌穿插在前中後的位置各自代表了不同的心境，每次

  歌聲一下瞬間整個感染力都上來了，尤其天馬行空很讚的有翻譯歌詞，帶入感更強烈!!


  除了HY主題曲以外，配樂編排我也很喜歡

  像是沖繩有專屬的歡快主題曲，後面到東京之後，一聽到這個主題曲確實就感覺看到了沖

  繩的大海，整個轉換心情!


  拍攝畫面上都非常漂亮，充分展現了每個人的顏值，一直在感嘆他們的水煮蛋肌膚的透明

  感! 真的是美顏爆擊!



  視覺上非常享受，尤其空拍拉高的沖繩海景真的超級漂亮，閃閃發光的海面跟遼闊的畫面

  ，看完真的會蠻想飛過去的!


  飛過去更希望可以獲得沖繩的青梅竹馬~~

  電影中不管是大人組青梅竹馬還是小孩組青梅竹馬的互動都超可愛!

  而且現實中我也會比較喜歡守護天使琥太郎(齋藤潤)跟接盤俠琉晴(中島裕翔)類型XD



  現在、過去以及視角切換的剪輯節奏相當不錯，搭配上述的優點，雖然劇情有些吐槽點跟

  老梗，但整體劇情銜接很順、不會沉悶、渲染力也很高，覺得不吃虐戀這套的我還是哽咽

  到頭痛QQ


  男主角湊（赤楚衛二）以往哭戲跟內斂眼神的表演都相當打動人，這部電影裡面可以看到

  他被虐得悽悽慘慘，非常楚楚動人~~


  雖然湊不愛說話冷淡的樣子，讓他多了很多遺憾，但其實電影中算是蠻細緻的側面描述了

  他的心境以及為什麼會做出這樣的決定，所以其實仔細想想蠻能理解的，甚至電影最終給

  了巨大的圓滿交代


  我覺得每位角色都有各自的深度，蠻適合細細體味與換位思考的

  演員也都詮釋得很好，相當圈粉!橫跨20年的歲月，卻把高中青澀的模樣、以及出社會後

  歷練的眼神都表現的很好!!


  甚至感情上的小表情和互動都有看到細節，更能代入情緒，看他們相處和樂的樣子都會忍

  不住露出姨母笑，然後再被虐的係哩嘩啦QQ


  整體而言是觀感上十分舒服的一部片，適合沉靜心靈觀賞的電影，推推!


  最後附上幾版主視覺海報，覺得都很好看!







  --


  我覺得敘事節奏跟畫面配樂的搭配意外讓我整場都蠻專注的~

  但確實整部沒有大風大浪，所以心情波動不會太大XD'
