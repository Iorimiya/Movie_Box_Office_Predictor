url: https://www.ptt.cc/bbs/movie/M.1743695622.A.5C2.html
title: '[ 好雷]  日片366日 主角不是渣男啊！'
content: '前面心得無雷，後面有雷。


  本片以HY的同名歌曲為基礎靈感，看預告似乎充滿了各種日式老梗元素，以為會是又一部

  重病生離死別，結果意外的重病沒有著墨太多。

  雖然也是有誤會或”為了你好”而不說明白的劇情，但處理的讓我感到很舒服也不會覺得

  過於悲戀，相對的我也就沒什麼哭，不過也是聽到很多觀眾的吸鼻子聲!

  裡面的愛情不僅是男女之間，而更是人與人之間，每個人都是為他人著想的好人，所以也

  自己承受了痛苦，看完後覺得結局很好，而且漸漸感到一股後勁，回家後看主題曲的MV，

  想到男女主角的心境，竟然比看電影當下還難過，應該還會再去看一次，了解全貌後會更

  懂每個角色當下的心情。


  整體算推，適合約會也適合自己看，看完後可能會有點感觸，也可能當下就有很多感動的

  部分。

  附上主題曲的MV，也是366日這首歌的回應曲 ，然後後面的心得有雷






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看到中間覺得男主的分手方式就是渣男啊，對女主來說完全就是啊！男二看到他怎麼沒有

  揍下去XD


  但後來想想，不說可能真的是最好的，湊經歷過父母離世、照顧重病的人，他很清楚這種

  苦，不想讓美海也有這種經歷，所以不能說啊，一旦說了，美海的未來就會大轉變，面對

  殘忍的現實，即使選擇分手，那美海可能也會有愧疚感和罪惡感吧。那不如一開始就什麼

  都不說，自己離開美海，雖然也是讓美海痛苦，但比起來這比較不會拖累美海的未來，而

  美海也很努力的往幸福的方向前進了。湊真的是用心良苦，還各種被虐，不是渣男啊！


  而美海卻在被甩後發現懷孕，雖然是狗血老梗，但他也沒告訴湊，直到最後要結婚了才透

  過MD，這裡讓我想到日劇海的開始裡那個死去的前女友，一對比美海真的是人很好!美海

  好好育兒也好好往夢想邁進，也很幸運有琉晴！讓美海幸福的琉晴也是大好人啊，真的是

  無怨無悔守護美海一輩子！還好他有知道自己才是美海的終點！


  最後結局的海灘戲就是最大的回馬槍，原來當時有見面，我想也能解讀為他們的愛已經昇

  華了吧。




  --'
