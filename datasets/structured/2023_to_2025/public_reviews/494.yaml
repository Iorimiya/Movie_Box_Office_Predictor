url: https://www.ptt.cc/bbs/movie/M.1744179976.A.A49.html
title: '[無雷] 366日，不忘初心，方得始終'
content: '*感謝有愛的粉絲贈票活動，讓我能欣賞這部電影，謝謝



  故事大綱

  沖繩女孩美海(上白石萌歌 飾)，湊學長(赤楚衛二 飾)、青梅竹馬琉晴(中島裕翔 飾)，譜出一段酸澀的愛情故事


  電影採兩個時間軸穿插的敘事手法，老實說一開始有點搞混到底誰是誰


  這同時也是一部沖繩的觀光宣傳片

  似乎是為了體現當地人文的熱情開朗

  每個畫面幾乎都顏色豐富且光線充足，彷彿每一根髮絲都清晰可見

  我覺得這點非常可取，真的:)


  受時間軸穿插的影響，起承轉合多了一點命中註定的無奈感

  最後在配樂優美的歌聲下，曲終閉幕


  步出電影院，咀嚼回味整個故事

  心情該麼說呢? 或許是惆悵吧...


  愛會消失嗎? 我不知道

  在每道選擇題中，完美的解答可能不是必然存在

  但不要忘記自己喜歡的東西



  願所愛之人幸福，望摯愛之事綿長


  --'
