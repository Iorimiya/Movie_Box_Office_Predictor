title: 'Re: [ 好雷]  日片366日 主角不是渣男啊！'
content: '有雷，請注意。


  玩弄對方感情的叫渣男，湊專一木頭的要命，怎麼能說是渣男。

  頂多就是一個連善意的謊言都說的很差的人。

  除了不想自己的病造成美海的負擔，讓美海無法實現夢想外。

  面對陽葵的問題也能把自己退在後面，

  也深知生物學上的父親遠遠比不上養育的父親。

  一直犧牲自己只為了美海的笑容，超純愛。

  每次香澄出現我都覺得不會吧，還要走經典女二路線？

  好在這劇裡面的每個人都很善良，明明香澄有好多次機會，

  但是看到湊的專一後都會默默的在背後支持。

  我想香澄她的好勝心也不會想做第二。

  但是琉晴不一樣，什麼樣的美海他都可以接受，也不會想造成她的負擔，這實在是太過於完

  美的青梅竹馬了！


  --'
