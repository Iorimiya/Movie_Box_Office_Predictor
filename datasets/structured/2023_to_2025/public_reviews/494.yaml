url: https://www.ptt.cc/bbs/movie/M.1743931200.A.E1F.html
title: '[好微雷] 366日：無論如何都該愛一場'
content: "雷文防雷資訊頁\n\n電影《366日》，以HY樂團的《366日》歌詞作為構想\n以歌詞中未能描繪的男主角為故事的主角\n\n初戀，就是將滿溢的純真與熱情，全然獻給一個令你悸動不已的人\n\
  於是，毫無計算的初戀，最終會失敗\n\n\n\n影片預告 \n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n我很少看日本電影，尤其是純愛片，我甚至連最紅的《在世界中心呼喊愛情》都沒看。\n\
  \n如同很多人對日本純愛片的既定印象，清淡、無趣、安靜到可以睡著，\n沒有非得花錢進電影院看一部純愛電影的動機。\n\n《366日》確實是一部沒什麼大場面的電影，\n\
  說的也是極為平凡的相遇、相知、相守到分開，然後重逢的人的故事，\n但電影的敘事柔和，卻不會讓人感到無趣，也感覺不到時間的流逝\n\n這個故事，有令人難以言喻的酸澀滋味，也有令人動容的悸動和溫馨——\n\
  \n\n最初映入眼簾，少年（真喜屋 湊）奮力踩著腳踏車，在燦亮的日頭下，在一望無際的筆\n直公路上奔馳，沖繩美麗蔚藍的海平面作為故事的序幕，延展開來。\n\n\
  以日本知名樂團HY的音樂做為故事的骨架，少年總是天陰的世界，因為少女（玉城 美海\n）的開朗問候打開了一個縫隙，音樂如同暖和的溫泉流淌進少年孤獨的世界，開始鋪陳那\n\
  段相遇相知的故事。\n\n\n\n\n這是一個會讓我想起「人生初次的戀慕」的故事。\n\n我曾經也那麼期盼見到某個人，期盼他能因為我的陪伴而歡喜，因為我也是如此歡喜，在\n\
  每一次看見他唇邊的淺笑梨渦，悸動不已。\n\n這部電影，是相當適合以思慕的歌詞作為敘事。\n\n內容是「純粹的愛」──\n\n每個角色都想著一件事：\n\n「我該如何更愛他（她）？我該如何讓他（她）更幸福？」\n\
  \n所以這部電影，沒有醜惡的背叛，只有令人心疼的、拙劣的謊言。\n\n\n台灣人的我對日本名曲比較沒有共鳴，但看完電影之後，我想到兩首歌曲。\n\n女主角．美海的主題曲：梁靜茹《可惜不是你》\n\
  \n\n\n\n\n\n\n\n美海，是一個純粹的只知道付出愛的角色\n於她而言，無論故事的結局如何，她總是感謝並珍惜，來到她身邊的人。\n\n\n男主角．湊的主題曲，應該是蘇打綠的《我好想你》\n\
  \n\n\n\n\n\n\n\n\n湊對感情的選擇，代表他之前經歷所愛之人離去的傷痛未曾痊癒。\n\n比起自己不能幸福，他更害怕自己所愛的人，因為愛他，也要經歷他經歷的悲傷，\n\
  \n\n而那正是湊非常想要守護的東西──美海幸福的、沒有陰霾的笑容。\n\n\n電影中每一個角色都做出選擇，\n他們沒有上帝視角預知未來，他們都只能用自己微薄的力量，憐取眼前人。\n\
  \n這是一部酸的味道多於甜的電影\n\n也許看完這部電影，你會想起你曾經做過的某一個選擇，\n想起你的遺憾，但是你不會有後悔的心情。\n\n也許看完這部電影，也會想起這樣的詩句：\n\
  \n\n\n\n\n\n\n\n總會遇見一個人、一段感情，\n\n即便明知不會「永遠」，還是想要愛一場。\n\n\n\n--"
