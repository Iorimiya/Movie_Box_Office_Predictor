url: https://www.ptt.cc/bbs/movie/M.1744387233.A.EC3.html
title: '[好無雷] 366日：沖繩海的七色藍映進錯過的白雲'
content: '之前在板上舉辦粉絲發心的贈票活動

  其中一位受贈者回饋了很精彩的心得，已徵得原作者「茶太郎日常雜談」同意

  以轉載的方式分享電影心得


  原文 Dcard版有圖



  IG版



  以下節錄文字心得




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  366日有著滿多微妙的元素，主演的赤楚衛二及上白石萌歌，兩人的生日在2/28及3/1，中

  間剛好隔著劇中重要的2/29的閏年設定。


  劇中的角色名字，也是別有用心


  玉城美海意味著沖繩美麗的海洋

  嘉陽田琉晴代表著常年溫暖的琉球晴空

  真喜屋湊則是在沖繩有代表感謝的含義


  最終湊、美海、琉晴都是在這片琉球晴朗的天空藍下，溫柔包覆著美麗的海洋，而使得這

  些錯過與誤解，隨著沖繩海風，只有那感謝與思念的花香暗飄過。


  雖然與富士月九的TV版劇情完全不同，但366日電影版的確在赤楚衛二優秀演出中，打造

  出屬於自己路線的366日；


  雖然對於赤楚衛二並不陌生，從「表參道」一劇就有關注，當然後面讓他更被觀眾喜愛的

  「30歲還是處男」（日劇《如果30歲還是處男，似乎就能成為魔法師》），使得赤楚衛二

  開啟了更廣闊的戲路；


  而在「366日」中，卻稍微顛覆對他的印象，把真喜屋湊這位擁有獨特溫暖與笑容的角色，

  用以魅力十足的渲染力，成功傳達給觀眾，搭配著中島裕翔，兩人的暖力就如同沖繩常年

  的溫暖氣候，讓人忘了孤單而深陷其中。


  錯過與珍惜，我想是「366日」的劇情主軸，雖然整體劇架構，常看日劇的觀眾，可能會

  覺得是常見的模板套路，但「366日」意外的魔力，就是在所有能想到的劇情之下，這股

  沖繩暖風還是能吹得觀眾感動不已，甚至能夠輕易奪取你我的淚水。


  有些事，錯過就是錯過了，珍惜現有的人事物，或許才是對彼此最好的祝福；

  至少曾經能在每四年一次的366日，能夠多愛你一天，能夠把這份愛最大化；

  即使在海灘相視的一刻，在琉球晴朗的天空下，依然感激曾給彼此的愛。


  「366日」進入了第二週映期，雖然場次珍稀，但還是推薦給喜歡這類型題材的觀眾，畢

  竟赤楚衛二的眼神與笑容，無論男女都會被折服。


  加上對於老日劇迷來說，飾演美海父母的杉本哲太與國仲涼子，能繼續活躍在日本戲劇圈

  ，還是很開心的事情。


  --'
