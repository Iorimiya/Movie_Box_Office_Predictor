url: https://www.ptt.cc/bbs/movie/M.1740924896.A.BCB.html
title: '[好雷] 366日'
content: '前面無雷心得


  平常很少看日本電影，但因為喜歡主演赤楚衛二，所以稍微關注了一下上映的消息


  這部預計在4月初上映(赤楚3/31要來台灣宣傳~耶~)


  因為有赤楚3/1生日特別場，就先買票去看了



  劇情是個 非常有既視感的故事 大概就是看了前面就能知道後面會發生什麼事的老梗電影


  雖然有很多值得吐槽的地方


  但我還是從電影的一半就開始眼淚大顆小顆的掉

  (我本身哭點低 看淚之女王也是邊吐槽邊哭 大概是這樣)



  不過也是一定有很多觀眾覺得老梗到哭不出來啦...


  看完覺得還是可以給個好評~


  希望在台灣也可以有不錯的票房


  日本票房大概如下

  上映第一周票房排行 第5名

  上映第二周票房排行榜 亞軍

  上映第三周票房排行榜 冠軍


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  因為還沒正式上映，所以心得就簡短點


  沉澱了一天，得出了結論：這是兩個病人的愛情故事


  如果身體好一點就不會發生遺憾了XD



  故事劇情就是非常老梗的


  背景設定在沖繩，高一的女主(美海)在高三的男主 (湊)家人病逝之後，因為音樂拯救了頹廢的男主


  兩人互相喜歡，美海在湊畢業那天向他告白，兩人順利交往，這點不拖戲很棒


  然後湊就去東京讀大學了，時間快轉，美海也順利考上同一個學校，兩人過著幸福快樂的生活



  時間繼續快轉，湊已經畢業順利就職，但美海在畢業前夕的就職相當不順利，故事的轉折點就此開始


  相愛的兩個人怎麼會突然發生變化 顯然就是有個人突然得了重病


  完全就是看到一半就猜出來是發生什麼事


  後面劇情就先省略不提



  但不得不說，故事其實寫得不錯，不能說是老梗有寫出什麼新意


  至少是老梗寫的不會讓人生氣


  可以理解劇中角色做出決定的理由，也沒有人是幼稚的，雖然可能不是最佳決定


  但也不會讓人憤怒



  跟朋友看完，朋友們一致認為角色都是成熟的，雖然我們還是各種吐槽



  我對於有遺憾的故事實在是很沒抵抗力，搭配音樂 眼淚真是不受控制


  昨天看完刷MV看留言討論，有人在討論最後一段


  在沙灘上的男女主角到底有沒有重逢，有人說那是開放式的，可能有可能沒有


  不過昨天跟朋友看完倒是沒人覺得那幕是幻想


  我們一致的解讀是 他們在看到對方的時候已經做出決定了



  最後想說


  那個妹妹阿...以後要每年做體檢噢...


  妳爸媽不太健康啊...


  --'
