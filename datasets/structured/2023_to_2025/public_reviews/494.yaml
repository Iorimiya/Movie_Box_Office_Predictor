url: https://www.ptt.cc/bbs/movie/M.1744395025.A.A34.html
title: '[好雷] 366日'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  很榮幸有機會透過版上[366日]粉絲贈票活動觀賞了這部電影

  除了沖繩美麗的風景，還有感人的愛情故事

  首先先感謝贈票者

  然後在寫劇情和角色之前先寫上總結

  因為個人生活際遇，被劇情深深感動，很有感觸

  有些幸福錯過就不再，我也曾經錯過了

  我也像劇中男主角一樣祝福我愛(過)和愛(過)我的人都能過得幸福

  也會更加珍惜擁有的一切

  想去沖繩一趟進行拍攝點朝聖之旅了

  這部電影真的很棒，推薦給喜歡愛情故事的人



  一、劇情


  青梅竹馬、帥氣學長，常見的安排，意外的邂逅讓女主美海遇上了高冷湊學長

  MD牽起了雙方的緣分，美食起頭再透過音樂交流，雙方一起出門，曖昧在兩人之間產生

  劇情真的很甜，告白之後，女主送學長上車前一吻，讓我覺得公車司機和乘客也太有耐心

  沒人催促快點，兩人你儂我儂，十八相送


  女主東京找不到夢想口譯工作，給兩人甜蜜戀情起了波瀾，這點好寫實

  愛情與現實生活的衝擊，男主突然的分手宣言，一開始還以為是因為這個

  不料是八點檔最愛的疾病大魔王來也

  兩人都為了對方隱瞞了事情，男主病情，女主懷孕，為對方著想的心卻將愛情導向傷心

  都錯過了彼此


  持續在家鄉等待的青梅竹馬接受了受傷的女主，這段很八點檔，但還是很感人

  說真的我覺得自己沒辦法接受別人的小孩

  他沒跟女主再生其他小孩，沒特別提，不知有無考量女主和女兒的心情

  把全部的愛留給女主


  交錯的劇情解釋了一切，一連串的意外與互相的隱瞞，導致了兩人無法長相廝守

  但青梅竹馬感覺是真的愛他們，還是過了幸福的時光

  最後真相大白，彌補了一些遺憾，很感動，讓我落下了男兒淚

  日本電影對於這種感情戲真的很厲害，我喜歡

  比起某些片的奇妙特效來說，日本電影還是這種片拍攝得相對好


  二、角色


  1.青梅竹馬

  默默守護女主，裡所當然的陪伴，吞回去的告白，一開始才會輸

  接受懷孕女主很偉大，隱匿女主給男主的MD很過分

  但這安排我覺得很棒，因為這是人性，如果完美聖人放手，我會覺得很假


  2.男主湊

  選擇自己默默承受不知能否好起來的疾病，用梁靜茹歌曲「為我好」那套

  自己決定放手，不耽誤女主追夢，也在返鄉時成全女主與青梅竹馬

  某種角度讓人覺得傻，或該說壞心

  幸好最終彌補了一些遺憾

  要女兒繼續愛惜養父這點很偉大，繼續遠遠祝福曾經的愛人和無緣的女兒

  跟青梅竹馬看著前段學生時期他們戀愛類似

  愛就是看著喜歡的人幸福


  3.女主美海

  本作開心果，持續把笑容帶給周遭的人，溫暖了男主冷漠封閉的心

  上白石萌歌演的好好，可愛呆萌，為了夢想與愛人不斷努力

  勇敢生下女兒，最後解開與男主誤會，雖無見面，但能漸少遺憾

  離開前也給青梅竹馬丈夫真心的感謝，感謝包容與給予的幸福


  4.女二香澄

  一直以為會走傳統路線，陪男主治療後在一起

  很意外只成為工作夥伴，毫無感情糾葛，完全成為本作好人，給男主心靈慰藉


  5.女主女兒

  戲分少，我最大感想，演員好可愛

  小孩部分，在婚禮跟親生爸爸打招呼的樣子很呆萌可愛

  長大後，聽了母親錄製的MD，勇敢踏出一步，讓眾人都少了遺憾


  三、後記


  我也像男主一樣沒有當面面對遺憾，覺得男主是不希望打擾女主現在的生活

  我也是，也覺得自己沒有勇氣去面對，只能在心中默默替對方祝福


  劇中歌曲好聽


  最後的最後，再次推薦大家去戲院支持好作品

  也能夠珍惜擁有的幸福


  --'
date: 2025-04-12
