url: https://www.ptt.cc/bbs/movie/M.1743440770.A.ED1.html
title: '[好雷] 正宗日式純愛電影-366日'
content: '電影”366日”是為日本樂團HY同名單曲而打造的衍生劇。

  這首歌在日本超紅。

  17年前是日劇紅線的主題曲，2024年閏年也有一部366日的日劇上映，現在這部電影是這首

  歌的第三部作品了！

  這首歌詞就是說難以忘懷的戀情，分手後想你想到365天都不夠。


  電影366日講述了一對情侶因誤拿對方的MD卡帶（所以Sony也有參與製作）而展開的一段情

  感旅程，從甜蜜戀愛到最終生離死別，

  愛你愛到365天都不夠。


  這部電影到底有多”正宗純愛呢”？就是能在其中看到各式各樣的經典日式情節：萬人迷學

  長、戀人因病就要分手、難以忘懷的初戀、從小陪伴的青梅竹馬、一定要有的日劇跑，還有

  努力騎著腳踏車的高中生。

  但是，編劇又巧妙地注入了新鮮元素，最感動我的親情與劇末10分鐘出乎意料的轉折，層層

  堆疊的哭點讓人爆哭。


  赤楚衛二的眼神表演非常細膩動人，雖然主角湊沉默寡言，但在內心掙扎的瞬間，一個眼神

  就能傳遞出深沉的情感。另外，飾演美海的女兒陽葵的稻垣來泉非常可愛而且超會演。特別

  是在倒數第二幕與父親相擁的場面，真是哭死我。


  這部推薦給喜愛琉球大海美景、情侶檔、有難忘初戀，喜歡日式純愛，尤其是對”為了讓對

  方幸福而選擇退讓”很美的人。


  以下有劇情的一點雷








  劇中湊得了血癌，因為自己中學時就照顧得重病後來死掉的媽媽，所以深深的知道照顧一個

  人會犧牲什麼，尤其對方去逝後內心會有多痛苦。所以即使分手的時機莫名其妙也狠心跟美

  海提出分手，選擇默默自己抗癌。

  分手後美海發現懷孕，本來要跟湊說，結果看到湊一臉不願的神情也暗自下決心不要打擾他

  而獨自生下孩子。

  我覺得沒有了解日本人那種擅自體貼他人心意的人是無法理解的。

  這就是日式美學吧！

  令我疑惑的是日本高中生非常喜歡這種情節，why?

  跟朋友討論後覺得應該是現在缺少純愛了嗎？


  --'
