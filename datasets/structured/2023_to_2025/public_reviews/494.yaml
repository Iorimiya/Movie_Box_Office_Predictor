title: '[ 好雷] 366日'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n 看到電影裡女主角美海津津有味的吃著沖繩美食《沙翁》，還大力推薦給湊學長一起品\n嚐《沙翁》的摸樣，讓我真的很好奇到底有多麼好吃啊，真想吃看看XD\n電影裡拍攝的沖繩每一幕都非常漂亮，大海景色真的讓人詫異到怎麼會有這麼美麗的藍色\n\
  綠色，看完電影真想去沖繩旅遊，和男女主角去白色沙灘大口吃著美味的《沙翁》看著漂\n亮的海景。\n\n愛情電影總是要有選擇，話說湊學長得到的白血球疾病，正巧工作細胞真人版電影演得正\n\
  好是同一種病，可以聯想到他治療過程的艱難和勇敢，男主角主動離開女主角，一個人去\n面對病魔真的很勇敢，但是美海就很可憐了，幸好有男二陪伴著她，最後的結局雖然很遺\n\
  憾，但是也是不錯的選擇了。\n\n齋藤潤飾演的琥太郎，電影裡我完全沒有認出來是他，和電影去唱卡拉ok的形象差好大喔\n！是看到片尾演員名單有他的名字，我才發現到齋藤潤有演出。\n\
  \n感謝赤楚衛二粉絲贈票，讓我看見了一部優秀的愛情電影~\n\n\n--"
