title: '[情報] 爾冬陞將執導新片《海的盡頭是草原》'
content: '爾冬陞到內蒙勘景/拜訪耆老



  好久不見的爾冬陞導演，將執導內蒙題材陸片《海的盡頭是草原》，今日舉行開機記者會

  。


  由老戲骨陳寶國及新人演員馬蘇、阿雲嘎、王鏘、張銘恩等共同主演。該片根據「三千孤

  兒入內蒙」的真實歷史事件改編。


  *三千孤兒入內蒙（歡迎補充）

  1960年前後，中國物資短缺，上海孤兒院的孩子們面臨生存威脅。在總理周恩來和時任內

  蒙古自治區黨委書記、政府主席烏蘭夫的安排下，“三千孤兒”遠上內蒙古草原，交由牧

  民撫養。


  爾冬陞導演，四次入圍金馬最佳導演都鎩羽而歸。《新宿事件》之後，到大陸連續導了兩

  部陸片《我是路人甲》跟《三少爺的劍》。前者評價跟票房都很好，當年入圍不少獎項，

  後面那部就...


  這次是時隔6年後再度執導新片！





  然後講一下新人演員王鏘，他之前跟周冬雨一起演了《陽台上》（《鋼的琴》金馬提名導

  演張猛執導）個人覺得表現算不錯，跟周冬雨對戲氣場沒被壓掉（但冬雨這部戲份不多XD

  ）



  --'
