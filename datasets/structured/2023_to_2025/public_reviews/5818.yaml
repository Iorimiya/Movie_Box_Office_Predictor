url: https://www.ptt.cc/bbs/movie/M.1184184697.A.45C.html
title: '[好雷] 哈利波特 5 鳳凰會的密令 (大雷)'
content: "哈利波特的第五集。David Yates如何變化這個魔法世界？我相當好奇。所以第一天\n\n就開開心心的衝去看了。第五集認真說來，是為第六、七集的黑暗、悲傷以及最終大結局\n\
  \n鋪陳開頭，所以實在不會是什麼多溫馨的作品，導演在電影中可以參雜一些好笑的笑點真\n\n是不錯了。整部電影就像是上一集一樣，東西太多，又要刪減又要濃縮，就變成步調非常\n\
  \n緊湊快速，流暢度我個人是覺得還好，導演運用報紙這個手法讓許多銜接的地方看起來比\n\n較不顯突兀。這集同樣是緊抓著唯一主線進行，將其他的東西全部刪去，簡潔程度還不錯\n\
  \n，導演不貪心，沒有東提一點西說一些後來收不了尾。但是有些內心的東西我覺得就是少\n\n了一點，像是天狼星對於自己無法與鳳凰會並肩作戰的遺憾和憤怒、哈利對於朋友的掙扎\n\
  \n心理、以及最終哈利永遠失去天狼星的茫然、絕望等，這些如果可以多表現一點就會覺得\n\n這部電影更棒了！\n\n\n    打鬥的場面，算是普普，一開始在預言室的部分還不錯，尤其喜歡當所有人分散跑開\n\
  \n，在中間又相遇時，被彼此嚇到的感覺。後來的鳳凰會成員出現方式很酷，但是他們都沒\n\n有什麼鏡頭，後來天狼星、哈利等四個人在中間打鬥的部分，感覺天狼星用魔仗的樣子有\n\
  \n點花俏 -.-，死掉的部分可能沒有看過書的人，會一時反應不過來發生什麼事。而最後佛\n\n地魔跟鄧不利多的打鬥場景，就像有人說的，有點像是內功拼比，雙方一來一往，對我而\n\
  \n言除了步調有點快，有點還不進入狀況以外，都算是還不錯。哈利後來倒在地上時，我看\n\n到有一段讓我覺得很感動，哈利的記憶不段的被讀取時，鄧不利多一直說話鼓勵他，這時\n\
  \n他想起對他來說重要的人，我覺得在那一段回想非常棒，因為在短短的時間內，看到剪輯\n\n的畫面，真的可以讓我感覺到對於哈利來說，妙麗跟榮恩在他生命中扮演多重要的角色，\n\
  \n給了他多深的繫絆，他所回想到的幾乎都是他們的笑容，而似乎也真的沒有其他人，比他\n\n們兩人更可以讓哈利有繼續堅強的勇氣了。\n\n\n    至於結局，我們就別談了吧...這大概是整部電影我最討厭的地方。\n\
  \n\n    演員部分，其實我想哈利波特系列電影可以到後來有越來越好看的感覺，跟三位靈魂\n\n演員的成長是脫不了關係的。相較起一、二集的生硬，現在他們三個對於自己的演出似乎\n\
  \n越來越發自角色的內心了。Daniel在這集當中的情緒表現掌握的比之前好，掙扎跟憤怒的\n\n收放比起之前自然；Rupert就跟書中的榮恩一樣，不搶戲卻是哈利最重要的朋友之一，這\n\
  \n次戲份不多，但是一站出來維護哈利，級長跟好友的氣勢真的有出來；Emma從上集的小女\n\n人到這集漸漸成熟，咬字用力應該是習慣問題，妙麗在三人組中一直有穩定軍心作用的感\n\
  \n覺，這集中也可以感覺Emma在演戲上讓自己更為沉穩的去做出演出。這三人之間現在已經\n\n有了無法拆散的化學作用，三個人共同演出的和諧度越來越好。\n\n\n\
  \    硬底子演員真是一出手便知有沒有，恩不理居真的好到讓人氣的牙癢癢，不論是表情\n\n、語氣、後面爆發的情緒，雖然不是主角，但是每次出場，觀眾一定會隨著他的表演而心\n\
  \n情起伏，看到後來看到雙胞胎整他那段，真的是會忍不住想為雙胞胎的作為鼓掌叫好，因\n\n為恩不理居看起來實在太機車了！Emma Thompson少少幾幕，後來在中庭那段真的是動作\n\
  \n、聲音一出來，就會讓我看了都覺得感傷起來，彷彿他真的在那裡待了16年之久。\n\n\n    新演員中的Evanna Lynch，飾演露娜.羅古德，這個女孩真的有厲害！不知道是不是\n\
  \n因為是資深的哈利波特迷，所以對於角色的研究非常透徹，簡而言之，他飾演的露娜真的\n\n是太有感覺了！那種活在自己的世界裡優遊自得享受的樣子，還有輕輕的語調，迷濛的眼\n\
  \n神，真的是太神了！如果有人說 J.K. Rowling是用這女孩當作露娜的範本，我想我會忍不\n\n住要相信。至於其他演員，因為我沒有太多感覺，就先不寫了。\n\
  \n\n        最後一定要說    妙哩哩，我‧愛‧妳！ >////////////<\n\n--\n\n    有些人該\n\n          有些人卻\n\
