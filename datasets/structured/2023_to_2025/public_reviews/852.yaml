url: https://www.ptt.cc/bbs/movie/M.1724225632.A.9C2.html
title: '[普雷] 其實滿寫實的角頭-大橋頭'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~
















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  有人批評說


  王陽明的角色一開始好像很有想法很能打很強大


  結果後來就只是一個只會腦衝只會靠爸的阿斗


  啊這不就跟現實一樣


  本來以為那個89有奪會打奪厲害


  結果就只是一個小89


  不然你本來期待89要多有腦(不是)


  所以這邊覺得滿合理滿寫實的啦


  唯三想批評的點


  1.王識賢變成NPC，看不太到演技展現


  就真的只是到處救火的快打部隊


  僅有的亮點在知道猛仔因為聽他的話結果掛掉那裡


  有感覺到他複雜的情緒


  2.猛仔被捅的那邊我直接去上廁所


  因為很明顯那裡的劇情會拖很久


  果不其然上完廁所回來他還沒死


  拖得太刻意了


  3.雖然本來就覺得89就是髒話連篇


  但髒話也太多了吧


  多到你把髒話從電影裡拿掉


  就變成好像在致敬卓別林經典的默劇一樣


  根本沒剩什麼台詞了


  大概就這樣啦


  看老一輩的五個大老（五老星？）飆演技還是很過癮的


  至於其他


  嗯就89


  如果電影院真的沒別的可以看、周末晚上真的沒行程了


  還是可以考慮進場支持一下89文化


  --


  --'
