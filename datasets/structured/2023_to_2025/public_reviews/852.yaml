url: https://www.ptt.cc/bbs/movie/M.1725973994.A.A8A.html
title: '[新聞] 《角頭－大橋頭》3週破2億！王陽明親揭「'
content: '《角頭－大橋頭》3週破2億！王陽明親揭「票房公約」大稻埕集合了


  記者黃庠棻／台北報導


  《角頭－大橋頭》上映至今26天，全台票房突破2億大關，蟬聯4週全台週末票房冠軍、全

  台單日票房冠軍，不僅是《角頭》系列最賣座作品，穩坐2024年國片票房冠軍、暫居2024

  年真人電影在台灣票房第3名，同時超越好萊塢電影，榮登2024年拿下最多次全台週末票

  房冠軍、全台單日票房冠軍的電影，更是疫情後「限制級」電影票房冠軍。


  《角頭－大橋頭》上映以來26天，劇組跑遍全台各地戲院與觀眾見面，完成88場映前及映

  後座談，龍天翔説「參與這部電影是我一生的榮幸，很開心電影有這麼好的成績。」高捷

  表示「謝謝大家！我們繼續往苗栗三義（三億）邁進，到時候我們北館不會缺席，一定會

  再給大家一些表示（謝禮）。」


  喜翔則說道「謝謝你們成就我們的電影！」王識賢開心直呼「非常謝謝大家，有你們的支

  持，是我們繼續前進的原動力！」王陽明則公開兩億票房公約「爽！超級爽！你們懂的！

  票房2億我們真的做到了，非常謝謝你們，我們準備了煙火與大家慶祝，週四晚上期待你

  們來大稻埕碼頭，跟我們一起看煙火吧！」


  為了答謝粉絲一直以來的支持，《角頭－大橋頭》劇組走出戶外到傳統夜市，與粉絲近距

  離互動，上週六（7日）前往高雄瑞豐夜市掃街，粉絲一見到王陽明、張懷秋下車立刻團

  團包圍求簽名拍照，另一台車的龍天翔、高捷及王識賢下車同樣也被包圍，與粉絲一一擊

  掌、簽名及合照有求必應，上百位群眾沿途不斷有民眾狂喊「Michael哥」、「蠍子哥」

  、「KO桑」、「貴董」、「仁哥」等電影角色名字，演員走到哪裡、粉絲追到哪裡，人群

  一路蔓延到馬路上。


  台中粉絲的熱情不輸高雄，《角頭－大橋頭》隔天再度塞爆逢甲夜市，劇組一到大門口早

  已站滿粉絲等候，整條街的人潮一路蔓延到逢甲大學校門口沒有停止，沿路上求簽名、合

  照有求必應，網友狂讚「今天絕對是逢甲近期最熱鬧的一天」、「很久沒看過逢甲這麼多

  人了」、「這輩子沒看過逢甲這麼多人」、「逢甲盛況還得是角頭」、「角頭讓逢甲再一

  次人滿為患」、「我也在現場，超嗨」。


  到了平日的週一晚上也沒有減少粉絲的熱情，《角頭－大橋頭》在昨（9日）週一晚上特

  別加碼前往嘉義市宣傳，不只嘉義秀泰影城三場影人出席的場次一開賣就賣光，晚上到嘉

  義文化路夜市掃街更是人潮爆棚，從噴水圓環一路滿到民族路，平常只要5分鐘可以走完

  的一條路花了1小時才走完全程。


  高捷、王識賢、王陽明走到民族路時開心地與在場粉絲一起拍上大合照，甚至開心帶動大

  家一起狂跳慶祝一起掃街相見歡，王陽明開心表示「嘉義，你們真的太屌了！So Crazy！

  謝謝你們的愛和支持，我的新球鞋沒事，中南部的朋友都很乖，沒有被罵，我愛你們！」

  施名帥笑說「阿路勒？不是禮拜一嗎？猛猛猛！走這一段務要走一個小時？太猛了！好險

  前有蠍子後有潘帥，結果就是一直被喊飲料店那個不算喔！」


  《角頭－大橋頭》寵愛粉絲，王陽明說到做到，履行首映會許下的票房破億謝禮承諾，與

  劇組所有人共同準備價值十萬台幣的Tudor Ranger帝舵腕錶一支，於上週一網路直播抽出

  三位觀眾，並在確認獲獎資格之後，由第二順位來自嘉義的幸運得主蔡小姐獲獎。


  劇組特別前往她的家鄉嘉義市面交，不巧她正在花蓮實習，轉而電話聯繫在嘉義市從事美

  髮業的親姊姊代領，姐妹都是《角頭》系列的忠實粉絲。當劇組整團到髮廊時，整個髮廊

  員工在大門口迎接，髮廊老闆娘笑說：「原本還以為接到詐騙電話，她（指蔡小姐的姊姊

  ）説是真的，妹妹得獎了！」高捷笑回：「Promise Is Promise!」表示劇組一諾千金，

  說到做到。


  王陽明現場親自拿出禮盒，確認裝有手錶及保卡，蔡小姐透過手機視訊電話坦言「不敢相

  信！」並見證姊姊代領受獎的一刻，王陽明親自道賀「恭喜妳！這是所有人大家一起送的

  ！」王識賢打趣搶下手機入鏡對她說「妳不要也可以給我！」笑翻全場。


  施名帥強調抽到錶真的非常幸運，透露「我們都有參加抽獎都沒抽到，離蠍子哥（指張懷

  秋）遠一點，我保護錶！」幸運得主蔡小姐則是社群平台開心表示「真的超級激動的啦！

  雖然沒辦法親自到場領獎，但也很開心第一次跟這麼多大哥一起視訊，還是超級緊張的，

  很感謝榮獲這個獎。」


  把握《角頭－大橋頭》在嘉義宣傳的難得機會，片中飾演開設飲料店的「潘帥」唐振剛人

  帥心也帥，主動號召整個劇組團隊特地繞道前往嘉義東區宣信街的「阿婆粉圓冰」，給予

  高齡85歲的陳蔡愛阿嬤支持。「貴董」高捷貼心要阿嬤好好休息一下，主動站在攤車前擔

  任「一日店長」盛裝粉圓冰，一邊一熟練的手勢盛冰、一邊笑說「貴董沒有進入北館之前

  應該是賣冰的。」


  每一個演員吃到粉圓冰都讚不絕口，直呼「超好吃！」王陽明狂讚「好吃！真的好吃！特

  別是綠豆冰！阿嬤很辛苦，大家多來支持喔！」張懷秋感性表示「我們吃的不是冰，是阿

  嬤的溫暖。」王識賢、唐振剛輪流陪阿嬤聊天，逗得她開心不已，最後阿嬤收下劇組的大

  紅包，一度不好意思説「太多了」，在大家感謝之下她才收下表達感謝「功德無量喔！」




  ETtoday星光雲 | ETtoday新聞雲



  --'
