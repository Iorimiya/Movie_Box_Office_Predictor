url: https://www.ptt.cc/bbs/movie/M.1723169443.A.A1D.html
title: '[普無雷] 角頭-大橋頭'
content: '無雷心得...安心服用


  角頭大橋頭預定8/16正式上映，目前角頭有四集，角頭1&2，前傳浪流連，再加上本片大橋頭


  大橋頭時間點則又比浪流連更早一點，算是前前傳，所以沒看過前幾集的，不會有影響


  角頭一直拍前傳，大概是角頭2便當發太兇，一大堆主要配角都掛了，續集沒什麼發揮空間吧


  大橋頭主要劇情是在說角頭1的大反派，王陽明的成魔之路


  劇情上沒什麼特別，就是原本和睦相處的一群人反目成仇，前幾集其實也是這種套路


  由於是前傳，這集出現的人，不用想就知道，他們會在這集發生什麼事...


  這部時間長達130分鐘，節奏有點慢，鋪陳有點太久，這部是限制級，有非常血腥的畫面，這點要注意


  結論還是可以看啦，不過就是前幾集的套路，可以預期票房可能不會太好，畢竟就是前傳，劇情發展明顯會受限許多


  --'
