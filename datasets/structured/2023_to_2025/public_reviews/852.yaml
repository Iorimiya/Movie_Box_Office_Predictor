title: '[新聞] 角頭大橋頭「戲」加碼　客散場戲院打群架'
content: '新聞網址：



  角頭大橋頭「戲」加碼　客散場戲院打群架


  記者 何可妍 / 攝影 劉欣逵 報導

  發佈時間：2024/08/19 19:20

  最後更新時間：2024/08/19 19:20





  電影角頭大橋頭，十六日上映，三天票房破五千萬，吸引許多人觀賞，不過十八日晚間，

  基隆一間戲院卻傳出打群架，原來，電影結束時，有人提早散場，






  窄小的座位間，好幾人扭打成一團，疑似有人直接被抬了起來，雙腳懸空，有的助陣，有

  的勸架，仔細一看紅色的座椅，這不就是在電影院的影廳裡嗎，民眾拍下衝突這一幕，直

  呼難道是電影看得太入戲？


  電影角頭大橋頭，由王陽明、鄭仁碩、王識賢等人主演，16日正式上映，三天票房突破五

  千萬，吸引不少影迷，劇中幫派間的爭鬥，免不了打鬥場面，民眾看完電影，也血氣方剛

  上演全武行。


  原來沈姓男子，和女友到基隆一間影城看電影，散場時，王姓男子和親友從沈男椅子前經

  過，卻沒有禮貌打個招呼說借過，雙方愈吵愈激動，最後演變成肢體衝突。


  記者vs.學生：「(如果人家要過你會站起來讓他過還是)，我可能往後一點，我會站起來

  然後讓那個椅子後面，我通常都是，就是把自己捲起來，就腳收進去一點要過也是過的了

  。」


  第二分局信六路派出所所長鄭億宏：「警方到場後將沈、王2男，及王男之親友5人共7人

  帶回偵辦，訊後依刑法聚眾鬥毆傷害等罪嫌，移送台灣基隆地方檢察署偵辦。」


  原本開心和朋友看電影，兩方卻因為讓位問題起衝突，黑幫電影結束了，但動手的觀眾卻

  還加碼演出。



