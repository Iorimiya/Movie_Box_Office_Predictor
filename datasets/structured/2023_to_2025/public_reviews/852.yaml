url: https://www.ptt.cc/bbs/movie/M.1724326139.A.BBE.html
title: '[普好雷]角頭大橋頭'
content: '防雷
































  今天公司沒啥事 下午請了個特休去看

  這集還是有不少亮點啦

  只是因為前傳一直拍 有些吃書設定就是了


  某一次麥可搞事

  勇桑貴董 KO大坐在一起那邊

  KO大完全是見笑轉生氣欸

  明明就管教不方 貴董說了句白目就整個牙起來

  而且龍天翔大哥不知道為什麼 激動時台詞說的沒有很清楚

  這系列真的是一直補設定


  應該很後悔當初賜死勇桑 貴董

  以前傳這幾集來說勇桑都塑造的不錯 結果第一集死的好隨便

  懷秋演得不錯 只可惜你演越好

  就會讓我覺得第一集後來才跟麥可的許孟哲跟小煜顯得很便當角


  這集一大亮點是北城

  憨春配上大愷實在太鬧了

  還拿著麥克風逃命我快笑死



  第二亮點一樣是我們仁哥

  雖然被清楓嗆很無言


  然後施名帥感覺很盡力了 但好像撐不太起來

  鄭人碩很收斂 不然氣場都快壓過他了

  其實猛仔領便當時我還以為呂雪鳳演的阿嬤會出來客串


  喜爺的生日宴少了龍哥

  看幾個大佬一起演戲真得過癮



  最後泡湯KO大叫喜爺不要笑了

  那瞬間收起笑容嚴肅的臉真的好猛

  聽說後面還有影集

  蔡振南南哥的無償MV有哭著說哈達沒有給兄弟漏氣

  王識賢的新歌裡面一樣有這一幕

  還有一幕是喜爺去跟某人上香 說兄弟你先走 說不定後面我就來了


  南哥那首當初以為全部是影集的內容

  現在是兩首好像都有包含影集跟這集電影的內容

  依這集結尾來看 喜爺應該是去跟KO大上香



  然後人設差最多的應該是文正....

  第一集完全就是個白目仔

  這集那麼沉穩...




  --'
