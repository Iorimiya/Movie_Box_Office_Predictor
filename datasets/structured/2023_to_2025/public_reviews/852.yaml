title: '[普好雷] 《愛情算不算》，大橋頭的戀愛夢。'
content: '部落格版：


  （手機排版抱歉）



  先不管電影本身好不好看，我只覺得《愛情算不算》這名字也太像八點檔，原先名字《大

  橋頭的戀愛夢》還比較好聽。


  回到正題，出乎我意料之外的，《愛情算不算》滿好看的，或許談論愛情、高談論括著相

  愛是命中注定抑或人定勝天的理論爭辯並非此片為開例，但本片用著一點點俏皮、一點點

  溫馨、一點點感動，揉合成了一部輕鬆幽默的愛情小品，我不敢說會讓每個觀眾喜歡，可

  本片打著「台北愛情捷運」系列之一的名號，以大橋頭為起點，大稻埕為緣分的締結點，

  確實造就了一部小清新電影。


  至少我很喜歡本片就是如此純樸的氣氛，觀影過程欣賞著大稻埕的美，那種歷經歷史喜裡

  所散發出來的人文風情，而周幼婷與張翰這對也許不是如同最近剛結婚的黃曉明與Angela

  baby、王子與公主般的耀眼，卻也讓觀眾看見那個年紀的可愛與對愛情的想法，配角陸弈

  靜與謝瓊煖扮演雙方的家長，帶出父母擔心兒女終身大事的執著與焦急，一方面不斷安排

  相親、想讓孩子趕緊成家，另一方面又真的當緣分來了又多了別的看法，尤其陸弈靜的表

  現非常俏皮、活潑，我也好希望我媽媽有陸弈靜一半的俏皮就好了。



  《愛情算不算》丟給了觀眾可以思考的問題，世界上幾億人口，要在茫茫人海中遇到對的

  人，究竟是機率問題，還是緣分安排？


  命中注定還是人定勝天，每個人心中都自有答案吧，重要的是相遇之後，就是兩個人的事

  了，如同邱比特所說：「命運固然強大，但還是要靠自己爭取。」緣分到了、機率達到了

  ，把不把握就在各人了。


  「順其自然也是一種選擇。」這是整部電影我最喜歡的一句話，相親、聯誼、求神卜卦都

  是積極的表現，可順其自然不也是種自我選擇的生活步調？


  「如果有可能會分手，你還會想談戀愛嗎？」很多人都說談感情不要預設立場，先愛了再

  說，但是愛了之後呢？不是天長地久，就是曾經擁有，既然無法確定這段感情能走多久、

  這個人究竟是不是你生命中所謂的對的人，你還會想去愛嗎？



  本片主要是著墨在於愛情部分，儘管在親人部分描述不多，卻恰到好處，不管是陸弈靜或

  謝瓊煖甚至楊烈，所謂皇上不急急死太監，看見兒女對於結婚毫不緊張，自己都替他們著

  急，長輩似乎都會想著，要是自己離開了，孩子怎麼辦？而看見孩子遇見喜歡的、不喜歡

  的，那種直接的反應讓人好氣又好笑，或許嘴裡總是挑，但看見孩子找到幸福，那種放心

  寬慰的心情在臉上嶄露無遺。


  看見片中的長輩的純樸模樣，就讓我想見多年後我的父母大概也會這個樣子吧，到處拜拜

  、求姻緣，最後搞不好也真的會把我推去相親也不一定。



  另外，布魯斯飾演的月老雖戲份不多，但我認為倒也滿搶戲的，只要他出現的場合都會讓

  人笑出聲，非常討喜的長相，如果每個月老都長這樣，我想善男信女大概會從台北排到高

  雄吧。



  《愛情算不算》自然而又生動，不過分賣弄大道理，連理應大量出現的數學公式也鮮少出

  現，出現的都帶有想傳達的道理在，如同最後的歐拉恆等式，用幾個被視為絕不可能有關

  連的單位組合而成的公式，去比喻愛情，或許自己有理想對象的想像，也總是說著不可能

  和誰誰誰在一起，但當一切條件都成立了，該在一起的最後還會在一起，就是這麼一個奇

  妙的事情。


  單純、純樸，是這部電影的特色，也是電影主場景大稻埕的特色吧。


  --'
