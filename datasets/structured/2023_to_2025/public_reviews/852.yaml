url: https://www.ptt.cc/bbs/movie/M.1718101784.A.F72.html
title: '[新聞] 電影《角頭》問世10年再推《角頭—大橋頭》 回溯世界觀起源'
content: '新聞網址：



  娛樂組

  2024年6月11日 週二 下午4:23



  王陽明闊別10年終於重返《角頭》宇宙，再度演出Michael哥，與張懷秋（右）一起揭開

  世界觀的起源。（曼尼娛樂提供）



  電影《角頭》問世10年，不僅會打造演唱會，也宣佈再推新作《角頭—大橋頭》，回到整

  個世界觀的起源，演員陣容更把前兩集的名單一網打盡。




  。他坦言：「很多角頭的粉絲會問我，『Michael哥』到底在哪裡？

  他到底死了嗎？之前發生什麼事？『大橋頭』到底在幹嘛？」這些年來他與監製張威縯時

  常討論這些粉絲的問題，希望找到最好的時機點，等待好的故事醞釀出來，「所以現在我

  回來了，回來演Michael，

  ，將會解答所有《角頭》的粉絲關注的問題！」




  鄭人碩（左起）、施名帥、張再興、張懷秋、王陽明等一票男星共同亮相，堪稱滿足所有

  《角頭》粉絲的期待。（曼尼娛樂提供）



  《角頭—大橋頭》在故事時間回到「第一戰」，當《角頭》首集的「大橋頭」、「頂庄」

  、遇上《角頭2》的「北館」、「北城」，四方角頭秩序面臨重大挑戰，規模比以往還大

  。監製張威縯表示：「我們這次追溯《角頭》整個世界觀故事的源頭，在於『大橋頭』裡

  有個二代想把在外國的所見所聞、賺錢的方法帶回台灣，他的欲望已經龐大到小小的『大

  橋頭』容不下，但他的這些想法、欲望跟手法怎麼來的，都可以在這次的電影裡看到。」



  多年來粉絲都不斷敲碗、期待推出續作。監製張威縯坦言，從《角頭》首集的「頂庄」、

  「大橋頭」勢力之戰，到《角頭2》的「北館」抵抗「健合會」，這次《角頭—大橋頭》

  把世界觀建構起來，「大家會看見各方領袖、組織、他們的風格都定得很清楚，其實真的

  很不容易。」



  當《角頭》首集的「大橋頭」、「頂庄」遇上《角頭2》的「北館」、「北城」，四方角

  頭秩序面臨重大挑戰，




  --'
