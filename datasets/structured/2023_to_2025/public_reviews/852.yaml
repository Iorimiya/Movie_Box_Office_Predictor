url: https://www.ptt.cc/bbs/movie/M.1723903209.A.5C6.html
title: '[普好雷] 角頭-大橋頭'
content: '常常聽到台灣人說都拍這種題材

  教壞小孩怎樣怎樣的

  看看昨天午夜場 西門樂聲外面都是人

  就知道為啥台灣愛拍這種片

  角頭宇宙就是台灣的復仇者聯盟

  其他台片有這種號召力嗎？


  —以下有雷—

  這部片作為鋪陳後面的劇來說

  算可圈可點了

  有清楚介紹出每個地方的勢力

  跟彼此的關係 雖然我覺得結束的時候蠻莫名

  大概每個人看完都是 蛤？


  角色部分

  王陽明（麥可）很多人說是本色演出

  但他真的蠻適合這種角色的


  懷秋（蠍子哥）我個人是覺得很尬..

  感覺他是想演跟第二集的壞壞一樣那種

  壞又很瘋的感覺 但完全沒有那個味道

  看到他出現耍流氓都覺得怪


  有個小問題

  第一次憨春去牛排店找麥可

  是幫老爸哈達討

  還是他知道自己的場被麥克衝？

  這邊有點莫名 想說他幹嘛去找麥可


  是說流出腸子感覺有點多餘

  又有點噁 、算是勸人善嗎？

  另外這部不管打多久都看不到警察

  對我來說算是個小亮點 哈哈


  這部還有個小缺點

  感覺劇情有點跳 沒有很連貫

  常常一邊講完就跳去很不相干的另一邊

  再接回來 然後也不知道過幾天了...


  除了結局之外

  看完後算蠻期待後面的劇

  看四個角頭怎麼跟喜仔拼



  --'
