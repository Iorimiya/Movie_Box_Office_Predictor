title: '[好雷] 角頭大橋頭'
content: '戲裡面有個開飲料店的文青角色，

  他戲裡有個哥哥，兩人無父無母，

  哥哥就放棄升學去外面賺錢養家，

  才有錢讓弟弟上大學娶妻生子開店當老闆


  看到這想到每個看似正常的大學畢業生他們的家庭，

  會不會也有這個默默在外打拚，辛苦拿命養家的家人，

  但他們養家的工作可能是難以其齒不可告人的賺錢方式，

  可能是強劫販毒或是賣淫詐騙等犯法的工作等等等。


  只是希望自己的家人能過正常幸福的生活，

  不要像他一樣窮到走上江湖89這條不歸路。



  這MV裡面有很多電影裡面沒有的畫面

  像開頭的畫面，還有土狗幫關狗籠刑求的畫面

  還有後面勇桑大喊哈達的畫面，難道都是影集的畫面?


  --'
