title: '[普雷] <角頭：大橋頭>演技超爛+幹哩娘幹哩娘'
content: '這到底什麼超級搞笑片


  Michael根本是在諷刺孫安佐

  從美國回來，動不動就穿插英文以為自己很屌

  但是一直到處鬧事，最後還是要爸爸幫忙擦屁股


  以為王陽明演技已經很爛了，沒想到懷秋更爛，孫鵬也不知道在演什麼

  在其他爛咖襯托之下，我竟然有種王陽明還行的錯覺


  然後台詞從頭到尾就是一直幹哩糧、幹哩糧

  如果是要表達8+9的弱智那是滿成功的，畢竟都沒讀書嘛，開口閉口只能用幹哩糧表達


  以台灣電影來說看得出來有花錢啦，給個普雷

  當成搞笑片來看勉勉強強==


  --'
