url: https://www.ptt.cc/bbs/movie/M.1724057999.A.9AF.html
title: '[新聞] 《角頭－大橋頭》3天票房豪拿半個億　超越前作倍數暴增'
content: "新聞網址： \n\n《角頭－大橋頭》3天票房豪拿半個億　超越前作倍數暴增\n\n\n15:33 2024/08/19 中時 李承陽\n\n\n\n\
  《角頭－大橋頭》片中主演王陽明跟鄭人碩被現場影迷團團包圍。（李承陽攝）\n\n電影《角頭－大橋頭》16日上映，首周末票房出爐，竟完成3天半個億、突破5000萬票房\n\
  的傲人成績，監製張威縯上周末率領演員包括高捷、王陽明、施名帥、鄭人碩、懷秋等人\n前往台南、高雄跟台中各影城催票，片中飾演角頭老大「貴董」的高捷，在映後座談時放\n\
  話：「目標3億，不到算我的！」看來似乎一語成讖。\n\n《角頭－大橋頭》不負眾望收下今年國片首周開片票房冠軍，且離破億門檻只差臨門一腳\n，調查近年國片票房數據，去年上映由許光漢、林柏宏雙男神主演的電影《關於我和鬼變\n\
  成家人的那件事》，首周末票房開出全台4700萬佳績，最終以3.6億坐收；2021年邱澤跟\n許瑋甯主演的《當男人戀愛時》，首周末票房則開出5800萬，以4億收盤，由此可推估《\n\
  角頭—大橋頭》票房潛力十足。\n\n\n\n影廳內有不少死忠粉絲製作手牌來見偶像。（李承陽攝）\n\n同時《角頭－大橋頭》更打破系列IP本身的紀錄，超越前作2021年的《角頭－浪流連》首\n\
  周末全台票房2400萬、更勝同樣是限制級的2018年《角頭2：王者再起》首週末全台票房\n2050萬，倍數的成長也在暑期檔尾聲替戲院打了一劑強心針。\n\n\n\
  \n上周末劇組大隊到中南部催票，影廳幾乎場場爆滿。（李承陽攝）\n\n\n看起來這集真的有機會像貴董說的\n\n全台票房破3億台幣了\n\n--"
