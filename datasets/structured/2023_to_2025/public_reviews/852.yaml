url: https://www.ptt.cc/bbs/movie/M.1724306250.A.0F3.html
title: 'Re: [討論] 《角頭－大橋頭》惡意攻擊 X IP'
content: '基本上就是電影市場大環境不好


  但大家手上明明就有錢


  看中職票房蒸蒸日上 職籃還能繼續搞兩聯盟


  假日高級餐廳都爆滿就知道娛樂費用沒有下降阿


  只是沒人要看電影罷了 這點跟好萊塢有點像


  比如還錢我認為至少應該賣6-7000 破浪最少也3-4000吧


  但世道不好 去年到今年有賺錢的就鬼家人 富都吧


  富都還不是國片 周處如果不是中國大賣 也是慘賠


  BIG就不說了 我第一次因為討厭導演不去看國片


  結論台灣市場不行啊 所以只剩89跟同性題材可以賺錢


  因為只剩這個題材還有基本盤特殊族群支撐 就像以前豬哥亮的電影一樣


  我還是祝福角頭可以破兩億 這樣片商可以小賺


  就一定會繼續拍下去 但是不妨礙我看完後


  還是認為這部不精采 遠低於浪流連 不是爛片啦


  但這次是弱智的八九片 把八九拍得有夠弱智


  這樣算是歧視嗎


  --

  今年花在中職比電影多太多 中職九場大巨蛋+一場新莊部長首戰 週邊場內飲食

  加起來快兩萬了

  反觀電影票加上二輪 今年還看不到5000 反而買吃的遠遠超過

  在電影版這樣不好啦 棒球是我的生活 電影起點小說是我的精神食糧 我都喜歡

  老狐狸超好看 看海外能否回本'
