url: https://www.ptt.cc/bbs/movie/M.1724687192.A.603.html
title: '[請益] 角頭大橋頭的ko桑為何能返老還童?'
content: "角頭大橋頭的老大ko桑-許萬和\n\n  登場的時候有不少白髮\n\n  甚至打針的時候  臉上跟身上還有手上不少皺紋\n\n  且甚至手毛有部分是白的\n\
  \n\n  可是回頭看時間發展最晚期的角頭電影\n\n  裡面有大橋頭老大的告別式\n\n  有一幕則是麥克瞻仰他老爸的遺容\n\n  那一幕的許萬和(ko桑)\n\
  \n  比大橋頭的時期還要年輕多了\n\n  不但皺紋少很多  甚至頭髮還全黑的\n\n  而且身形更加苗條\n\n  請問ko桑為何可以駐顏有術  越活越年輕?\n\
  \n  但既然越活越年輕  確為何突然掛了??\n\n  這部分百思不得其解\n\n  葬儀社的化妝師也不可能強成這樣吧\n\n\n  另外勇桑的媽祖婆(陳孝萱\
  \ 飾演)\n\n  幾乎只都跟勇桑膩在一起\n\n  甚至勇桑只要跟兄弟吃飯喝酒\n\n  太太都形影不離\n\n  所以勇桑根本就沒有外遇的任何機會\n\n\
  \  角頭兄弟找妹喝酒開趴的時候\n\n  勇桑也沒有參與\n\n  可見勇桑真的是妻管嚴\n\n  再者阿雄的阿罵也是直接找勇桑的媽祖婆商討盡量讓阿雄平平安安\n\
  \n  更可以得證勇桑的媽祖婆幾乎也是地下老大阿...\n\n  依據角頭的對話\n\n  勇桑與媽祖婆年輕就已經在一起了 (媽祖婆:你年輕的時候跟阿雄最像)\n\
  \n  但大橋頭當中\n\n  勇桑身邊卻完全都沒出現他太太\n\n  請問這是怎麼回事呢\n\n\n  另外還有一個問題\n\n  如果角頭系列的那些角色哪天改變作法\n\
  \n  以考多益+微積分的成績來論高下的話\n\n  那第一名到底會是誰?\n\n  長年在美國長大的麥可哥?\n\n  健和會的劉健?\n\n  還沒吸毒前的壞壞(小陶)?\n\
  \n  劉健底下那個作國際貿易跟標哥平輩整天電話講不停的左右手?"
