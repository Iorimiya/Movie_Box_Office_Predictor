title: 'Re: [普雷] <角頭：大橋頭>演技超爛+幹哩娘幹哩娘'
content: '這部不怎樣

  王陽明更是演技爛到爆


  跟言承旭的醫生角色一樣，都是帥哥演戲的經典爛選擇的代表


  演啥像啥，演啥都他自己，其實都是種演技


  但演角色像來客串的，口條活像在念課本，還是背的很不熟的課本，就真的是強....


  最慘的是，有個叫懷秋的，原來天生就8+9長相，扮相弄上去後，加上不錯的演技口條，

  整部戲的看點就是看一個黑道懷秋跟一個路人王陽明在飆戲，但王陽明一開口就會把觀眾

  拉回現實~喔！現在是在看排練戲對吧？



  --'
