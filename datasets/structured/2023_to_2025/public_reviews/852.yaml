url: https://www.ptt.cc/bbs/movie/M.1724304726.A.587.html
title: '[普好雷] 角頭大橋頭'
content: '以下防雷









  挑了平日大遠百看

  沒+9  都是一些夫妻大學生當兵的

  算是很平靜


  看完之後覺得角頭這集是想交代一些前因後果

  像是五虎將怎麼進北館

  還有各大哥的一些介紹等等

  對麥口的大橋頭也有更深入的討論

  不過想交代歸交代 演的還是有點破碎破碎的

  潘帥哥哥翹掉之後也沒我想看的帥復仇

  麥口被打一槍之後又要回美國

  原本以為他是不是要把他爸打藥幹掉

  結果沒想到是溫情大回憶哈哈哈


  本片最讚的就是看各路大哥桌邊喬事情跟互動

  看振南一票大哥演戲真的很爽

  一個眼神一句台詞都很夠味

  另外也被潘帥哥哥驚艷到 查了一下演員發現不熟

  不過感覺他把哥哥那種不善言詞的關愛演的很好

  然後之前看文看到有+9看到哭

  想說怎麼可能哭

  不過看到三虎將跪著跟仁哥講話真的是有點傷感


  麥口哥部分看起來有點尬

  怎麼感覺九年前的他比較適合

  懷秋倒是嚇到

  以前感覺就是唱跳歌手

  沒想到會跨到這裡來

  不過還是比較懷念壞壞


  總而言之 看老演員跟識賢還有安佐爸演戲滿讚的

  不覺只有低端才想看

  只是劇情部分就破碎破碎的

  有點凌亂


  --'
