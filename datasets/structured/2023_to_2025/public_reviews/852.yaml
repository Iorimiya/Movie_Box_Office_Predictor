title: '[普雷] 角頭-大橋頭(內有雷請注意)'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  好了 結束~ 整部影片印象最深的就是這句


  抱歉抱歉XD


  認真評論一下


  角頭-大橋頭給我的感覺是反派真的太單薄也不夠謀略


  (可能鄒兆龍給我的感覺真的太震撼 那個模樣演反派就很狂)


  再來就是吐槽的點是 各種打架但卻永遠沒有警察...


  槍也可以隨便亂開  沒人會被罵



  可能為了彰顯這群老角頭的城府之深 只能去弱化反派吧?


  本來看到賭場被搶劫那一段我本欲吐槽


  但後來有給出了一個不算合理 但至少有解釋的解釋。


  阿仁有講要弄他們一下就找到了。



  劇情很平鋪直敘  但我期待下一集  至少是最像老大的喜翔跟龍天翔之間的決鬥


  至於王陽明... 欸都  還是算了吧  好爛QAQ


  就整場一直操英文單字  也沒啥作為  出門就被打爛  我真的不行


  人家已經說了那些老角頭每個都是老虎  自己還覺得他們老了沒用


  對 他們老了沒用了~  但你一直不殺掉他們阿 笨!  你就是多餘阿  多餘你啊~




  其實他可以大可賣毒  然後不要惹事就不會有事情了 還可以混得比其他角頭來的好


  至於孫鵬... 可能只是為了開槍才演這部片吧  因為傳聞他喜歡槍


  他的形象也是很單薄 出來就是為了開槍跟拿槍




  最後一問  龍天翔打的藥物是什麼?   英文沒記清楚  應該不是毒品吧?


  --

  喜歡機械的原因是它們不會講謊話，壞了就是壞了。

  對機械好，機械就會對你好。

  對人好，或許他只當是應該的。不會記得。

  更甚至對他好，他對你更不好。


  --

  所以是藥用嗎啡~ 感謝解答  嗎啡在上去是不是麵粉?'
