url: https://www.ptt.cc/bbs/movie/M.1724084687.A.92B.html
title: '[普雷] 角頭大橋頭-又好看又難看'
content: '這部優缺點蠻明顯的


  難以評價


  應該偏微負雷吧


  但又覺得有值得看的地方





  缺點


  1.新的三兄弟（猛哥）沒有感覺



  不知道是鋪陳不夠還是演員問題，反正這次土狗幫的感情完全被五虎當時海放，就算猛哥

  掛了也毫不感動


  只覺得腸子好噁心可以快轉嗎


  然後猛哥好歹也關過完全不知道猛在哪，打戲都像慢動作套招感很重，人也斯文斯文的很

  不像黑道



  2.反派爛到不行，爛透了



  蠍子跟王陽明一個個說


  -蠍子


  一直狂笑很明顯很明顯想複製白毛的定位


  但是同理完全不夠，不瘋也不狂，就只是一個跟班在狐假虎威而已完全0魅力




  -王陽明


  很多人沖著他來的，他當這部的最大反派撐不起來，講英文很尬很像在黑人MV學兩句的，

  帥不起來


  然後又好像想要很狂，不知道在狂什麼，沒點智力也沒點武力就是靠爸

  毫無威壓感，你從第一刻就知道他最後會被老頭們教訓



  說老實話我當下在戲院只有一個想法


  “王陽明就是比較帥的超哥”




  反過來回去看角頭2的反派


  哦真的是天差地遠


  我寧可看喜哥當boss，但感覺下一集應該就是了





  優點



  1.就是看這些老鬼飆戲



  我的媽呀這些老鬼，怎麼一個眼神，一個表情都這麼會演


  看了好享受


  覺得沒有看到蠻可惜的



  不用大吼大叫就感覺出他們的地位



  2.畫面好看



  不知道這次是怎樣


  感覺很多構圖跟配色都蠻美的


  畫面大部分都很好看





  總結我覺得優點無法蓋過缺點


  但缺點也不至於不去看這些老鬼飆戲


  還是各自判斷吧





  至於劇情的話，滿廢的


  與其把主軸放在三兄弟跟王陽明

  我不如看ko桑怎麼跟所有大頭對幹


  或是看喜哥為了建案會怎麼搞


  --'
