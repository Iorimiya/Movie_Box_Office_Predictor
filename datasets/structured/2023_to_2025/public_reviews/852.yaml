url: https://www.ptt.cc/bbs/movie/M.1724508314.A.1F3.html
title: '[新聞] 《角頭大橋頭》8天破億票房登冠'
content: "《角頭大橋頭》8天破億票房登冠\n\n王陽明孫鵬龍天翔掃街謝影迷\n\n04:10 2024/08/24 中國時報 李承陽 、 王思穎\n\n\n\
  王陽明魅力十足，在北中南宣傳均展現高人氣。（曼尼娛樂提供）\n\n\n施名帥（左）在生日當天公布結婚喜訊，與交往7年朱芷瑩結婚，甜曬婚紗照。\n（摘自朱芷瑩IG）\n\
  \n電影《角頭－大橋頭》上映8天全台票房破億，榮登2024國片票房冠軍、2024限制級電影\n票房冠軍，刷新《角頭》系列作品破億的速度，也是近5年來最快破億的台灣電影，監製\n\
  張威縯及全體劇組感謝一路相挺的粉絲支持，23日率龍天翔、孫鵬、王陽明、張懷秋、吳\n震亞、唐振剛、陳萬號、王宣等人在台北大稻埕掃街謝票。\n\n接著將於24日在台中、25日在台南及高雄舉辦見面會，答謝粉絲一路以來的支持，現場將\n\
  限量發放100張拍照號碼牌，憑上映後任1全台威秀影城《角頭－大橋頭》不限場次之票根\n，即可兌換1張拍照號碼牌，獲得與出席演員合照的機會以及電影限量海報乙張。\n\
  \n《角頭－大橋頭》串起整個《角頭》宇宙，許多觀眾看完電影後，回家重溫《角頭》系列\n作品，《角頭》首集在串流影音平台Netflix上霸氣回歸電影類別熱播排行榜第2名，外傳\n\
  電影《角頭—浪流連》也衝上電影類別熱播排行榜第4名。\n\n電影上映後，王識賢、王陽明、鄭人碩各有粉絲擁護，新加入的卡司懷秋、施名帥人氣也\n居高不下，片中金句也在社群平台成為熱門話題，最受歡迎的是王陽明飾演的Michael片\n\
  中招牌台詞「你知道大橋頭是誰的嗎？大橋頭是我爸的。」\n\n施名帥最近人氣旺，家庭事業都得意，他和女友朱芷瑩交往7年，昨他迎接42歲生日，無\n預警宣布婚訊，和朱芷瑩同步曬出婚紗照笑喊：「終於等到這一天，我要公布一個事實，\n\
  朱芷瑩不願意承認是她先跟我求婚的。」朱芷瑩也Po出貼文，表示施名帥求婚，她找不到\n拒絕理由，小兩口隔空打情罵俏，洋溢幸福。\n\n施名帥經紀人透露，2人去年520已低調登記結婚；朱芷瑩的經紀人也是被告知婚訊，強調\n\
  朱沒懷孕。\n\n#施名帥 #王陽明 #上映 #角頭 #粉絲\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\
  \n\n\n--"
