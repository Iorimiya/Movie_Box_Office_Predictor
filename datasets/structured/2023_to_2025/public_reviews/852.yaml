title: '[新聞]《角頭－大橋頭》票房賣破5458萬「凌晨1點'
content: '新聞網址：


  《角頭－大橋頭》票房賣破5458萬 「凌晨1點湧買票人潮」緊急加開還是滿場


  記者許瑞麟報導


  ，


  還有電影院一直到半夜1點仍有大批排隊買票人潮，緊急加開場次依然滿場，


  直呼，


  南投戲院更是排隊排到戲院外，出現盛況空前的觀影景象，




  劇組也勤跑戲院與觀眾見面，3天跑遍台北、台中、台南及高雄，共計25場放映場次，


  都受到粉絲熱烈歡迎，有粉絲穿王陽明以「Michael」電影角色自製的


  「Michael is Back」限量T恤當場獲得本人的簽名；


  鄭人碩的粉絲則是以他的大頭照自製應援手牌；王識賢的粉絲拿出LED應援板大方告白，




  女方也開心回應「我願意」，整個劇組更比出愛心與這對新人合照，


  留下難得的珍貴畫面。


  片中飾演北館大家長「貴董」的高捷親自主持25場放映活動，幽默笑稱：


  「希望這部電影開到苗栗三義（票房3億）。」


  大批影迷喜愛的「仁哥」王識賢感謝觀眾：「成績一次比一次好，真的非常感謝，


  希望成為今年最棒的電影。」


  睽違10年回歸演出的王陽明開心表示：「Michael is back！很開心拍這個很爽的角色，


  再演一次Michael非常棒！」


  鄭人碩看見許多《角頭2》、《角頭—浪流連》一路以來的粉絲，


  感動表示：「有大家一路以來的支持，我們一定會票房長紅。」


  張懷秋一出場，粉絲狂喊角色名字「蠍子哥」，


  讓他開心說：「每一個演員、工作人員都花了很多心力在裡面，很高興可以參與其中。」


  這次飾演「阿猛」的施名帥大展演技，幽默笑說：


  「謝謝電影把我拍得這麼帥，謝謝你們喜歡阿猛這個角色。」


  更打趣借用片中Michael的台詞說：「大橋頭是他爸的，大腸頭是我的！」笑翻全場。


  ---


  日本有人中之龍IP  台灣有角頭!


  --'
