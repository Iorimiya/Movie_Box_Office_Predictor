url: https://www.ptt.cc/bbs/movie/M.1723835337.A.06B.html
title: '[  雷] 角頭大橋頭並不是完整的電影'
content: '角頭大橋頭並不是完整的電影

  他至少是分成上下兩集的上集


  看片時覺得應該收不完

  後來果然沒辦法收完

  看來會有下集來收尾


  不得不說王陽明這角色超讚

  他的魅力撐起整部片

  可惜按劇情下集也沒他了


  整體而言

  角頭2>大橋頭>>>>>>>>浪流連+角頭1


  這部敗筆大概就混戰戲很多

  但又要讓各舊角色有戲份

  整個混戰就變得很拖


  本來看到浪流連導演整個沒信心

  還好這部娛樂性還行

  但應該直接掛上下集

  而不是到戲院才發現

  啊？怎沒了

  ----

  Sent from  on my iPhone 12


  --'
