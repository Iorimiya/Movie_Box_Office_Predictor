title: '[普雷] 大橋頭'
content: '在台中親親戲院看的

  推薦台中最便宜的戲院

  第一廳8排12、13號是最好的位子

  還可以免費連看好幾場不清場


  我看觀眾群蠻廣的，有流氓有良民

  我想多半跟我一樣是來看明星的國片迷

  這片的劇情越來越錯綜複雜

  一直說要拍影集但老是變電影


  還是比較喜歡顏正國拍的風格

  以前看角1時覺得拍的有夠爛

  但真正的土流氓反而最愛角1


  沒想到角2砸了重本請來巨星加盟

  讓這個系列有好口碑才能再拍兩集

  顏正國就像玩命關頭的林詣彬導演

  一出手就拯救了快完蛋的系列電影

  但願未來能再請顏導回鍋執導演統






  雷




  這集潘帥的哥哥掛了

  潘帥在角2也跳樓掛了

  我懷疑潘帥在對岸不是自殺

  而是被人丟下樓再偽裝成自殺

  不然實在不合理


  這集的喜哥

  演的還真像教父2裡的邁阿密角頭

  派殺手去殺教父的老臣再嫁禍給教父

  讓四大家族們自己狗咬狗天下大亂


  不知道這系列的製片張老闆

  是角頭系列裡面那個角色的原型？

  是北館阿仁？還是阿慶？胖達？宗保？


  潘帥跟他哥都掛了真是有夠慘

  還好潘帥老婆還有個兒子

  但長大後應該也會變流氓


  實在不喜歡王陽明

  但他在我可能部會愛你裡面演得很棒

  但這片跟角1應該是導演的問題

  所以才讓他演得有夠爛

  難怪他演完角1後就不想再演2了

  還是顏正國導的時候再來演好了

  姜導還是沒法拍出那股真正的江湖味


  這集很多人都沒出現

  像頂庄的叛徒張立東

  可能他陽光普照被砍手後

  就從良去做水電不想再做流氓了

  當勇桑保鑣的顏正國也沒演

  不知道是不是因為角2賠慘

  所以跟張老闆鬧翻了?


  小鬼跟南坑老大掛了就沒法再演

  那也無可厚非，柯叔元也換回原版阿仁

  原本以為柯叔元演年輕阿仁

  沒想到大橋頭時間軸比柯叔元更年輕

  那就算了，以後小鬼跟南坑老大應該也能換人演


  我覺得這集大反派喜翔演得最好

  希望以後能拍他跟麥可在美國的故事

  很想看台灣黑幫在美國的奮鬥史

  反派能演得好的大概只有古天樂

  還有孫紅雷，演反派也能有人愛

  對了還有曾江


  角頭要拍得像教父一樣

  就得拍得更國際化一點

  去對岸拍去美國日本韓國拍

  例如毒品從那一國來的等等等

  還有槍又從那一國來的之類的產業鏈


  還有這片跟台中兄弟片笨男人一樣

  從頭到尾完全沒有警察實在不合理

  周處有警察抓賊才能在對岸大賣


  --'
