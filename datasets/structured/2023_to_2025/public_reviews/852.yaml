title: '[情報] 《角頭－大橋頭》正式預告全面上線'
content: "08/16 暑假最強檔\n\n\n\n電影《角頭－大橋頭》正式預告\n\n\n\n角頭全新篇章 回到第一戰\n\n「大橋頭」第二代公子Michael（王陽明飾）虎視眈眈想要重整角頭的新秩序，與「土狗\n\
  幫」阿慶（鄭人碩飾）、阿猛（施名帥飾）、宗保（張再興飾）交換條件去突擊「北館」\n大哥仁哥（王識賢飾）的場子，此舉引來其他幫派大哥的不爽：「想要搶地盤？」\n\n\
  就連「北館」的貴董（高捷飾）也不諱言認為他「白目」。\n\n影片中蠍子（張懷秋飾）瘋魔耍狠、詭異模樣令人不寒而慄，Michael似乎也開始掌控不\n了他......\n\
  \n這預告太帥\n\n麥可哥這次玩得可大了\n你知道大橋頭是誰的嗎？\n我也想知道Who Fxcking died?\n\n\n電影《角頭－大橋頭》08/16\
  \ 尬天借膽\n\n出品公司 曼尼娛樂投資股份有限公司 、 影一製作所股份有限公司\n\n製作公司 巧克麗娛樂股份有限公司\n\n發行 威視股份有限公司\n\n\
  出品人張芷瑄\n\n監製 張威縯 、張文旗、張益誠\n\n導演 姚宏易、姜瑞智\n\n演員 蔡振南、龍天翔 、 喜翔 、 高捷 、 太保、 夏靖庭 、 孫鵬 、\
  \ 王識賢、 Sunny\n 王陽明 、 張懷秋 、 施名帥 、 鄭人碩 、 張再興 、 黃尚禾 、 吳震亞、 唐振剛、\n李銘忠、陳萬號\n\n資料來源：角頭文創\n\
