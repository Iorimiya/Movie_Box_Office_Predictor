url: https://www.ptt.cc/bbs/movie/M.1723825006.A.13F.html
title: '[好雷] 角頭-大橋頭'
content: '雷文防雷資訊頁






  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  我是看今天晚上大遠百20:35的那場


  基本上是爆滿


  其實蠻好看的因為戲裡戲外都是刺龍刺鳳的人


  影廳裡面感覺很多兄弟去捧場 蠻有臨場感的


  但我其實是衝著王陽明去看的


  因為他長得很帥又為了演角頭去刺了兩個大花臂 很敬業


  不過我看完的感想 就是王識賢跟懷秋演得真的很棒


  王陽明感覺真的是憑臉蛋拿到主角 演技還可以再更好一點


  我相信這部戲票房一定很好 因為王陽明的臉很帥 功不可沒


  影廳裡面很多女生看到哭 男女比例大概55開


  我想應該也有很多女生是因為王陽明去看的


  總而言之劇情很緊湊 緊張感、刺激感都有 蠻建議可以進場觀影的


  --'
