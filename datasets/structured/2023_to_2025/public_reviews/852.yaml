url: https://www.ptt.cc/bbs/movie/M.1736937272.A.FBE.html
title: '[新聞] 角頭 大橋頭 驚喜宣布重新上映 攻賀歲'
content: '《角頭－大橋頭》驚喜宣布重新上映 攻賀歲檔陪過新年


  2025/01/14 17:32 壹蘋新聞網 / 黃閔 綜合報導


  電影《角頭－大橋頭》全台票房突破2億大關，穩坐2024國片全台票房冠軍，也是《角頭

  》系列最賣座電影作品。


  今（14）日監製張威縯（宏哥）無預警宣布電影將於農曆新年前夕重新上映，陪大家過新

  年。




  王陽明與懷秋成為電影《角頭－大橋頭》中想擴大組織「大橋頭」版圖的推手。曼尼娛樂

  提供


  張威縯在臉書發文表示：「角頭～大橋頭1月24日全台院線再次上映！還沒有看過的朋友

  們可以一起去看看！我們也不知道為什麼？」


  《角頭－大橋頭》除了票房開紅盤，去年還入圍金馬4項大獎，而施名帥也擊敗勁敵抱回

  最佳男配角。


  《角頭－大橋頭》故事時間回到「第一戰」，當時「大橋頭」第二代Michael（王陽明飾

  ）橫空出世，瞞著父親（龍天翔飾），與兄弟（張懷秋飾）私下打算重整角頭新的秩序，

  惹火了貴董（高捷 飾）、仁哥（王識賢 飾）帶領的「北館」、勇桑（蔡振南 飾）、清

  楓（孫鵬 飾）帶領的「頂庄」、哈達（太保 飾）帶領的「北城」共同對抗，四方角頭正

  式開戰。


  新聞網址：


  賀歲大片這不就來了嗎？（誤


  --'
