title: '[選片] 異形VS大橋頭'
content: "覺得太久沒看電影了，想進戲院看場電影，自己一個人看。\n \n異形之前只看過普羅米修斯，覺得好看。喜歡科幻類型的片。\n角頭系列都沒看過\n \n\
  現在一個問題，影城普通廳最大廳都被大橋頭佔滿了，異形都被分到次一等的廳\n假如想看異形，又想要好一點的聲光，好像只能加錢上特殊廳了\n \n \n--\n在台中，新光影城普廳最大2廳大橋頭上星期早就排片。\n\
  昨天看日新異形還在至尊廳，今天我要看了就換成大橋頭\n親親1廳2廳雙主廳。各自上映。算平手吧。\n \n最後妥協在小廳選異形了\n其實不管選哪個都是妥協\n因為不是異形粉，所以就沒加價上特殊廳了\n\
  不過我可以想像用IMAX或4DX會更爽"
