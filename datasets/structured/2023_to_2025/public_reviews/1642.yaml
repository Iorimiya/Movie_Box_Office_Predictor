title: '[新聞]<厲嬰魂>「越南張東健」守護「越南孫藝真'
content: '新聞網址：



  取材真實駭人社會事件的越南年度懼片《厲嬰魂》，即將在本週五（5/26）於全台驚悚獻

  映。本片男女主角大有來頭，找來因亮眼外型而被喻為「越南張東健」的國輝（Quoc Huy

  ），以及「越南孫藝真」莊楊梨芳（Le Phuong）共組家庭，甜蜜相守，女方卻因為懷上

  小孩後，夫妻生活開始變調。演員們回憶本片拍攝花絮，都紛紛表示感覺有「看不見的人

  」在拍攝現場，只好找其他工作人員陪在身旁壯膽。此外，女主角莊楊梨芳不僅為戲在一

  週內瘦5公斤，還飽受精神折磨，更在現場莫名手臂脫臼、撞頭，頻頻不順又受傷的她，

  也餘悸猶存直呼：「以後不敢再拍鬼片了！」。





  《厲嬰魂》以一對渴望新生命到來的恩愛夫妻拉開電影序幕，不料離奇怪事卻在女方懷上

  孩子後陸續浮現。本片找來越南實力派演員國輝與莊楊梨芳擔綱男女主角，兩人也因為亮

  眼外型，在當地被喻為「越南張東健」與「越南孫藝真」！在片中結婚四年的兩人，甜蜜

  互動齊發，放閃吻戲沒有少，詮釋過著理想生活的恩愛夫婦。戲外同為人妻的莊楊梨芳，

  老公也常來現場探班，讓國輝在談到吻戲時，笑稱壓力超大：「我有請她先生先離開一下

  ，不要站在鏡頭後面看，不然我怎麼敢演！因為他們夫妻很常一起出現在片場，所以也怕

  他老公站在那邊會不舒服啦！」他也開玩笑補充：「上次看他老公練舉重，肯定可以舉

  100磅，讓我超害怕的！」





  《厲嬰魂》充滿毛骨悚然的驚悚氛圍，實際拍攝現場也很陰森。在拍攝祭拜戲時，只見莊

  楊黎芳穿著白色裙裝、披頭散髮進行拍攝，她憶起當下說道：「開拍前都沒怎樣，但等開

  拍後卻忽然感到很不舒服，有請化妝師待在身邊，不要讓我一個人站著，同場的女演員梨

  莊（Le Trang），也不停拍我肩膀，讓我感覺好一點。」同在現場飾演女傭的梨莊也不安

  補充：「總覺得眼前不只她一人，還有很多人在旁邊。附近又有很多樹，雖然看不到，但

  能感覺到莊楊梨芳的肩膀很重，尤其我又聽說會有『小孩』在肩上盪鞦韆的傳聞，所以才

  趕緊拍拍她。」而梨莊也透露常在拍戲時，從無人空間感受到視線的凝視，讓她特別請人

  站在附近以減輕不適感。



  此外，首度擔綱電影主演便接下沉重角色的莊楊黎芳，在片中從不信靈異現象，到後來逐

  漸產生恐慌，直到最後迷信沉淪，讓她不僅在一週內快速瘦下5公斤來呈現噩夢纏身的痛

  苦模樣，更因為入戲太深而飽受精神折磨：「本片拍攝近一個月，角色所有的感情、行為

  、習慣有時會跟著我回家而影響我的心情。拍戲的這段期間，我一直生活在恐懼當中，我

  也不知道自己到底在害怕什麼、為什麼會變成這樣，但我確實被角色所擁有的恐懼與執念

  給深深影響。」此外，她在拍攝期間也頻頻在嬰兒房中離奇出意外，導致頭部撞傷、手臂

  脫臼，讓她餘悸猶存直呼：「以後不敢再拍鬼片了！」。



  這部以嬰靈索命為題材的恐怖懼片《厲嬰魂》，即將在本週五（5/26）於全台驚悚獻映。

  本片劇情描述一對有理想生活、經濟穩定又相愛的夫妻「東」（國輝飾演）和「桃」（莊

  楊黎芳飾演），雖然已經結婚四年，卻始終沒有懷孕的消息。某天，桃終於懷上兩人的第

  一個孩子，在迎接新生命到來的同時，家中卻開始出現奇怪的笑聲，甚至閃過神秘小女孩

  的身影，以及種種無法解釋的離奇現象，讓一連串噩夢不斷縈繞在桃身上。桃認為有某種

  超自然力量在折磨自己，於是尋求巫師協助，希望自己跟肚子裡的小孩能夠平安。只是她

  意外得知，她所遇到的怪事，似乎跟她多年前一場失誤造成的事故，似乎有所關連…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
