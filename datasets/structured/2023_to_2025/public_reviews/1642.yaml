url: https://www.ptt.cc/bbs/movie/M.1684327383.A.A01.html
title: '[新聞] <厲嬰魂>嬰靈索命+駭人鬼娃嚇破248億票房'
content: '新聞網址：



  榮登越南首週最賣座恐怖電影，票房勇破248億越南盾（約新台幣3200萬元）的恐怖懼片

  《厲嬰魂》，即將在5月26日於台灣駭人獻映。本片是越南功勳藝人杏翠（Hanh Thuy）根

  據越南現況，取材社會驚人故事與人物困境，並依照過去曾參與的墮胎討論節目《讓種子

  存活》為經驗；尤其越南是全球墮胎率最高的國家之一，每年平均發生超過30萬件墮胎案

  例，也讓她以此為靈感，耗時七年打造出本片劇本。尤其製作團隊費盡心思，不讓「恰吉

  」、「安娜貝爾」等經典鬼娃專美於前，也替本片加入駭人鬼娃元素，乍看精美的洋娃娃

  竟然會半夜自動唱歌、叫媽媽，再透過陰森的燈光與造景，連演員們在待機時間都直呼毛

  骨悚然，再透過後製效果，勢必讓觀眾在觀賞本片時，會被全方位的驚悚感嚇到叫媽媽，

  孕育觀眾全新夢魘！





  擄獲影評、電影業內人士與觀眾積極好評，上映便空降首週最賣座恐怖電影的《厲嬰魂》

  ，是一部融合超自然恐怖和心理恐怖兩種類型的駭人之作，也是越南功勳藝人杏翠首度擔

  綱電影編劇的作品。全片以「嬰靈」為題，帶出越南現今的墮胎議題。根據世界衛生組織

  與《越南快報》資料顯示，由於越南社會傳統意識所造就的性別歧視、性行為年齡提早卻

  缺乏普及的性教育，以及當地對於婚前性行為的譴責與反對，造就越南成為全球墮胎率最

  高的國家之一，每年平均就發生超過30萬件墮胎案例。也因為這樣的社會現況，讓杏翠過

  去參與《讓種子存活》這個墮胎討論節目，並以製作期間所遇見的人事物為靈感，進而打

  造出本片劇本。



  杏翠對此分享：「拍完節目後，我在想還能做些什麼，這便是我決定要完成劇本的動力。

  劇本想法早在七年前就誕生，而且《厲嬰魂》不僅僅是劇本，而是一個生活故事，觀眾可

  以從中看見生活的一角。更重要的是，我試圖在片中以不同方式來講述那些決定墮胎的人

  ，他們的執念與折磨。我認為墮胎從來就不是可以簡單處理的行為。」對於充滿爭議的議

  題主軸，她坦言自己並非以猛烈攻擊的態度去描繪或譴責，僅僅希望能夠引領觀眾在觀賞

  後思考，並有權產生自己的觀點及感受。





  《厲嬰魂》不僅在「人性」刻劃上挑戰觀眾道德極限，也在製作上致力打造讓人毛骨悚然

  的觀賞體驗。為了完美呈現片中寬敞漂亮又兼具陰暗空間的房屋，劇組耗費數月時間謹慎

  尋覓，並在找到過後，再用數週時間重新設計房內空間，讓演員們在進入屋內後，紛紛起

  雞皮疙瘩，就連飾演男主角「東」的國輝（Quoc Huy）也直呼：「陰到骨子裡！」此外，

  女主角「桃」收到一個精美的洋娃娃，在片中也將變身駭人鬼娃，不僅半夜自動唱起兒歌

  、狂喊媽媽，甚至被丟掉後，還可以完好無缺地回到家中繼續坐等女主角，把女主角嚇到

  精神耗弱、噩夢纏身。而這隻「嬰」魂不散的洋娃娃，也是由劇組專門打造，讓飾演幫傭

  的黎莊（Le Trang）讚嘆：「每當看到那個洋娃娃，就一秒覺得那不是普通的洋娃娃，更

  像是個嬰兒，非常有靈魂，裡裡外外都非常真實，特別是眼睛的部分非常有神！」



  此外，導演也沒有疏忽色調與音樂細節，選以黑色與藍色作為本片主要色調，有效描繪出

  恐懼與冰冷的空間感，並在重要時刻採用紅色突顯視覺，創造強烈又刺激的印象；同時還

  將越南兒歌〈晚安曲〉旋律重新混音置入。透過視覺與聽覺的雙重驚悚效果，讓觀眾隔著

  銀幕也能感受被毛骨悚然氛圍包圍的恐怖體驗！



  這部以嬰靈為題，榮登越南首週最賣座恐怖電影的《厲嬰魂》，即將在5月26日於全台駭

  人獻映。本片劇情描述一對有理想生活、經濟穩定又相愛的夫妻「東」（國輝飾演）和「

  桃」（莊楊黎芳飾演），雖然已經結婚四年，卻始終沒有懷孕的消息。某天，桃終於懷上

  兩人的第一個孩子，在迎接新生命到來的同時，家中卻開始出現奇怪的笑聲，甚至閃過神

  秘小女孩的身影，以及種種無法解釋的離奇現象，讓一連串噩夢不斷縈繞在桃身上。桃認

  為有某種超自然力量在折磨自己，於是尋求巫師協助，希望自己跟肚子裡的小孩能夠平安

  。只是她意外得知，她所遇到的怪事，似乎跟她多年前一場失誤造成的事故，似乎有所關

  連…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
