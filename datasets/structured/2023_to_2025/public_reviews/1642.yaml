title: '[新聞] 越南《厲嬰魂》陰到骨子裡'
content: "越南《厲嬰魂》陰到骨子裡\n\n04:10 2023/05/20 中國時報 翁紫曦\n\n\n《厲嬰魂》劇照，以「嬰靈索命」為題，帶出越南社會嚴重墮胎現況。\n\
  （采昌國際多媒體提供）\n\n\n越南恐怖片《厲嬰魂》取材社會驚人故事打造而成。（采昌國際多媒體提供）\n\n榮登越南首周最賣座恐怖電影，票房勇破248億越南盾（約3200萬元台幣）的恐怖懼片《\n\
  厲嬰魂》，是由越南功勳藝人杏翠根據越南現況，取材社會驚人故事與人物困境，耗時7\n年打造出本片劇本，全片以「嬰靈」為題，帶出越南現今的墮胎議題。\n\n將於5月26日在台上映的《厲嬰魂》，不僅在「人性」刻劃上挑戰觀眾道德極限，也在製\n\
  作上致力打造讓人毛骨悚然的觀賞體驗。為了完美呈現片中寬敞漂亮又兼具陰暗空間的房\n屋，劇組耗費數月時間謹慎尋覓，找到後再用數周時間重新設計房內空間，讓演員們進入\n\
  屋內時都起雞皮疙瘩，連飾演男主角的國輝也直呼：「陰到骨子裡。」\n\n此外，女主角「桃」收到一個精美的洋娃娃，在片中也將變身駭人鬼娃，不僅半夜自動唱\n起兒歌、狂喊媽媽，甚至被丟掉後，還可以完好無缺地回到家中繼續坐等女主角，把女主\n\
  角嚇到精神耗弱、噩夢纏身。\n\n這隻「嬰」魂不散的洋娃娃，也是由劇組專門打造，讓飾演幫傭的黎莊讚歎：「每當看到\n那個洋娃娃，就一秒覺得那不是普通的洋娃娃，更像是個嬰兒，非常有靈魂，裡裡外外都\n\
  非常真實，特別是眼睛的部分非常有神。」\n\n拍攝《厲嬰魂》過程中，導演也沒疏忽色調與音樂細節，以黑色與藍色作為本片主要色調\n，有效描繪出恐懼與冰冷的空間感，並在重要時刻採用紅色凸顯視覺，創造強烈又刺激的\n\
  印象；同時將越南兒歌〈晚安曲〉旋律重新混音置入，透過視覺與聽覺的雙重驚悚效果，\n讓觀眾隔著銀幕也能感受被毛骨悚然氛圍包圍的恐怖體驗。\n\n#驚悚 #視覺 #洋娃娃\
  \ #雙重 #女主角\n\n--\n佛教經典的\n是 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
