url: https://www.ptt.cc/bbs/movie/M.1483370007.A.4D8.html
title: 'Re: [討論] 哈利波特 阿茲卡班的逃犯'
content: '大家好 我是湯姆瑞斗45 是佛地魔的第45個分靈體

  我最近買了全套的哈利波特小說 想從中找到可以對付波特那臭小子的方法

  所以剛好可以回答你這些問題


  破釜酒吧 是一個酒吧 只有巫師看得到 或是魔法生物

  這是錯的 因為在第六集 鄧不利多那個老瘋癲對小時候的我說明如何到斜角巷的時候

  有特別說到 麻瓜是看不到破釜酒吧的


  裡面可以喝酒用餐還供住宿 然後後門有一道牆敲特定的石頭 可以開啟通往斜角巷的路

  之前我都是一個人去那的


  小說中哈利之所以會先搭騎士公車到那 是因為他腦海裡面第一個想到的地點就是破釜

  而那邊又可以通往斜角巷 所以非常方便



  小說有提到那間是私人會客室 不是什麼辦公室

  是魔法道具 要申請才能用 是在魔法部的神秘部門的某一單位製作

  這在小說第五集有提到


  有喔 光輪兩千是麥教授買給哈利 在當時就是最頂級的掃把

  我個人是覺得麥教授這樣非常偏心就是了 因為小說有提到飛天掃把是非常昂貴的東西



  到了第二集 光輪系列又出一款新的 那就是光輪兩千零一

  小說有提到 史萊哲林代表隊整隊都是用這款掃把 而根據小說的描述

  雙胞胎兄弟去刺探史萊哲林的練習狀況後的感想是 史萊哲林的球員化成高速的淡綠色汙點

  所以光輪兩千零一性能應該是相當不錯



  而到了第三集 就出現火閃電這個更高端的掃把 這算是整個系列作最強的掃把了

  連國家代表隊都指定要用



  至於性能 嗯 有一段教飛行的胡奇教授在看到火閃電的時候大為讚嘆 然後在哈利第一次

  騎火閃電比賽的時候 比賽轉播員李喬丹也有一直介紹火閃電的性能 被麥教授吐槽是不是

  被火閃電花錢請來幫忙打廣告的



  之後 比較不一樣的掃把就只有第五集提到的榮恩的掃把了 好像是彗星什麼



  大概就是這樣了


  --


  --

  如果我遇的到他 絕對會過得很不好

  這不清楚 不過總是要讓老骨董葛林戴華德爺爺出來亮亮相吧

  如果是我登場 只會搶走他的鋒頭

  甜甜的 有氣泡

  第7個 不過這點很詭異 在分靈體的介紹中有提到 需要用個咒語才能把靈魂碎片安置在

  物品 可是哈利那臭小子 居然只是因為我的本體被反彈的魔咒打到 靈魂碎片飛到

  他的靈魂那 就變成分靈體 這也太方便了吧

  是買還賣?

  你想死嗎

  沒聽說過這回事

  ˊ_|ˋ 上個有膽開我鼻子玩笑的 鼻子的鼻毛都不知道長多長了

  其他還沒枯 我先枯了QAQQ

  我只是解答原PO的疑問

  你想死嗎

  喔 不重要 什麼榮波什麼哈恩的 不過就是另一個哈利臭小子的根班臭小子

  安安 沒看過劇情有提到後來哈利還有付錢 你是自己腦補嗎

  第三集說 他用別人的名字訂購 可是錢用自己帳戶的

  恐怕巫師社會並沒有凍結帳戶這種事

  不會  下一位

  不就天狼星騎走了?

  忘了不重要

  殺了那些嘲笑我鼻子和長相的

  真的QAQQ我被霸凌的好慘啊

  不好吧 會搶了老葛的鋒頭'
