  造謠王又要惱羞了～

  真的耶 CYKONGG的造謠紀錄查一下就知道

  蕃茄王是哪位

  不然要什麼分類？

  又再造謠喔？拿錢的是你吧

  好了啦幹嘛一直自介笑死'
