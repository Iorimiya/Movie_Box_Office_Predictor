content: '沒看過小說


  請問破釜酒吧到底是怎麼樣的一個地方?


  哈利搭上公車就直接指名到這裡


  而且魔法部長也在這裡 還看起來像是有專屬辦公室


  時光器這能算是魔法道具嗎? 有點太誇張了吧


  光輪兩千 兩千零一 火閃電


  JK羅琳有額外介紹這些東西嗎?


  譬如說速度 好不好騎之類的


  這集真的明顯比前兩集好看多了


  場景轉換不會轉的不知所云也很流暢


  但艾瑪華森還是好可愛喔


  --'
