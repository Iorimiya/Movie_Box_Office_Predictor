url: https://www.ptt.cc/bbs/movie/M.1698935413.A.6B8.html
title: '[新聞]國民初戀變身<凱蒂超殺女>,泰國錦榮秀巨肌'
content: '新聞網址：



  由泰國鬼才導演李通康（Lee Thongkham）執導，榮獲紐約亞洲電影節「最佳動作電影」

  肯定的《凱蒂超殺女》（Kitty the Killer），即將在明日（11/3）於全台震撼獻映。劇

  組為創造磅礡刺激的動作場面，在選角方面可說是精挑細選，不僅邀請到泰國「動作片專

  業戶」索姆查肯格拉（Tao），還有外表帥氣並神似錦榮的登坤恩加內特（Kuan），在片

  中大秀層次分明的健壯巨肌，劇組甚至還需要為身材勇猛的他額外準備大尺碼上衣。至於

  女主角，則請來跟南韓女團BLACKPINK成員Lisa神似而爆紅，之前更曾與男神馬力歐莫瑞

  爾（Mario Maurer）主演《見鬼的戀愛季節》的普洛派琳唐普萊帕彭（Ploy）演出。這也

  是Ploy首度挑戰動作片演出，她更是為戲自主密集訓練，務求動作場面都盡量親自上陣，

  敬業態度也讓前輩Tao大力稱讚。





  展現無包袱暴力美學的泰國動作強片《凱蒂超殺女》，將為觀眾帶來一場又一場的超狂打

  鬥，只有大銀幕才可以享受到的刺激滿點磅礡對戰，不僅在視覺與特效上下足功夫，演員

  群也都是精心挑選。不僅有前跆拳道選手俐落演出反派人物，還有演藝圈資深的「動作片

  專業戶」索姆查肯格拉（Tao）在雨中大戰。為完美傳遞動作與喜劇成分，劇組也找來在

  兩種類型都有經驗，並且外型俊俏、身材精壯，外表更神似錦榮的登坤恩加內特（Kuan）

  ，飾演從兩光魯蛇變身帥氣守護者的男主角「查理」。他在片中不僅無厘頭搞笑，還首度

  挑戰使用「武士刀」的動作戲，他對此帶有壓力地表示：「這次動作戲所使用的武士刀，

  和以往演戲會用到的刀器大不同，長度更長，又有它的使用技巧，所以非常具備挑戰性。

  」此外，他更在片中大方秀出勇猛巨肌，讓觀眾得以大飽眼福，劇組更因此需要準備大尺

  碼上衣，也讓導演忍不住調侃：「蛋白質吃很多喔！」





  刻劃美少女與殺手組織浴血之戰的《凱蒂超殺女》，女主角普洛派琳唐普萊帕彭（Ploy）

  因為與南韓女團BLACKPINK成員Lisa神似而爆紅，台灣網友更直呼她有台灣女藝人夏于喬

  的神韻。外型甜美又亮眼的她，這回首度挑戰動作片，為了呈現到位，她特地到擊劍教室

  進行自主訓練，更把刀劍帶回家練習，就連沒有戲的日子也會到工作室一練再練，她有感

  而發：「這是我最困難的作品之一，我從沒有挑戰過那麼多動作場面，更何況還要與Tao

  與Kuan熟悉動作戲的專業演員們搭檔，讓我充滿壓力，但還是希望能盡可能親自上陣！」

  全心投入的態度，也讓跟她有大量對手戲的前輩Tao大讚：「Ploy很有決心！花心思在這

  上面真是非常棒！」開拍前，劇組也花費時間與專業團隊規劃動作、培訓演員、排練走位

  ，對打鬥場面十分講究，讓演員們紛紛表示：「動作戲最困難！」值得一提的是，在導演

  的堅持下，演員們不論在練習或是正式拍攝時，所用的都是真實重量的安全型武器，也讓

  她們開玩笑喊道：「重量是真的，痛苦也是真的！」



  這部宛如《追殺比爾》混搭《格殺福順》，榮獲紐約亞洲電影節「最佳動作電影」肯定的

  泰國動作強片《凱蒂超殺女》，即將在明日（11/3）於全台震撼獻映。本片劇情描述蒂娜

  （普洛派琳唐普萊帕彭飾演）是個從小就接受精良殺手訓練的女孩，與代號「灰狐」的阿

  葛（索姆查格拉飾演）一起參與刺殺任務。某天，阿葛被組織背叛，慘遭殺身之禍。在逃

  亡過程當中，阿葛遇見不太正經的上班族查理（登坤恩加內特飾演），與他建立了特殊聯

  繫。臨終前，阿葛授權查理成為「灰狐」接班人。無奈之下，查理就這樣誤打誤撞進入了

  殺手組織「辦死處」，並接受殺手訓練，主要工作就是保護蒂娜免受組織殺害。一場殺手

  與殺手的激烈對戰就此展開…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。


  --'
