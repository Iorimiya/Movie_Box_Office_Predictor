url: https://www.ptt.cc/bbs/movie/M.1697728654.A.3F3.html
title: '[新聞] 【凱蒂超殺女】獲國際影展動作大獎肯定！'
content: '新聞網址：



  以《鬼侍女》（The Maid）打響國際知名度的泰國鬼才導演李通康（Lee Thongkham），

  全新推出的動作強片《凱蒂超殺女》（Kitty the Killer），即將在11月3日於全台震撼

  獻映。他以經典動作片《追殺比爾》（Kill Bill）與《刺客聯盟》（Wanted）為創作靈

  感，找來特技與視覺團隊，打造震撼又令人腎上腺素激增的泰國「好萊塢式」作品，讓本

  片再度驚豔國際，榮獲第22屆「紐約亞洲電影節」的「最佳動作電影」肯定。不僅如此，

  導演也在片中將泰國與日本文化融合，加入自己所熱愛的動漫元素，還在片中向愛作《七

  龍珠Z》致敬。全片超脫現實的漫畫感，更讓有如「泰國成龍」般的資深男星索姆查肯格

  拉（Tao）自曝就是接演本片的原因之一！





  年度最爽最炸的爆米花動作強片《凱蒂超殺女》，將為觀眾獻上一場美少女殺手與組織之

  間的浴血之戰。導演李通康透露以經典動作片《追殺比爾》與《刺客聯盟》為創作靈感，

  混和兩者的精神與風格，在片中展現毫無包袱的暴力美學，與爽度大開的刺激對戰，致力

  帶給觀眾「好萊塢式」的泰國作品。導演談及製作時表示：「我們的目標，是要製作出一

  部有令人腎上腺素激升的動作戲，還要有引人入勝的興奮感，同時又注入幽默劑量的電影

  。」



  為了確保動作場面能夠極具震撼力，本片也特地找來特技協調與視覺效果團隊密切合作，

  虛實融合加上演員們的精彩實力派演出，也讓本片在第22屆「紐約亞洲電影節」上榮獲「

  最佳動作電影」殊榮。在此之前，越南電影《怒火》（Furie） 與韓國電影《獵魂者》（

  Spiritwalker）都曾獲得本獎項肯定，為電影的精采程度作出了保證。本片導演李通康獲

  獎時也開心直呼：「他們一定從這部電影中，看見了特別或是不同的東西，或有別於其他

  泰國電影的新事物，我很榮幸能夠向大眾展示屬於泰國人的電影作品。」





  《凱蒂超殺女》除了向觀眾展現泰國特色，更將日本文化融合其中，像是能看到殺手們帶

  著「般若」面具登場，又或是手持「武士刀」揮砍激戰。劇組也特別請設計師專門打造獨

  特的「泰日風」服裝，特別的文化融合安排，讓導演李通康對此分享：「我喜歡各種類型

  的電影，我愛動畫，加進去！我愛《追殺比爾》，加進去！我愛武士！我愛泰國文化！」

  值得一提的是，片中為了幫助訓練受傷的男主角「查理」療傷，所使用到的「修復室」，

  導演對此透露：「我是動漫粉絲，也是《七龍珠Z》的粉絲，那就是在向『精神時光屋』

  致敬！」因此片中還出現大量漫畫表現手法，以及超現實的劇情安排，讓在泰國影劇與音

  樂圈皆十分資深，有如「泰國成龍」的動作片專業演員索姆查肯格拉（Tao）自曝接演原

  因：「我會演出這部電影，不僅因為這是動作片，裡面還有不同的故事線，更像一本漫畫

  ，以非常流暢的方式在輸出，而我們就是漫畫角色的一部份。」



  這部宛如《追殺比爾》混搭《格殺福順》，榮獲紐約亞洲電影節「最佳動作電影」肯定的

  泰國動作強片《凱蒂超殺女》，即將在11月3日於全台震撼獻映。本片劇情描述蒂娜（普

  洛派琳唐普萊帕彭飾演）是個從小就接受精良殺手訓練的女孩，與代號「灰狐」的阿葛（

  索姆查格拉飾演）一起參與刺殺任務。某天，阿葛被組織背叛，慘遭殺身之禍。在逃亡過

  程當中，阿葛遇見不太正經的上班族查理（登坤恩加內特飾演），與他建立了特殊聯繫。

  臨終前，阿葛授權查理成為「灰狐」接班人。無奈之下，查理就這樣誤打誤撞進入了殺手

  組織「辦死處」，並接受殺手訓練，主要工作就是保護蒂娜免受組織殺害。一場殺手與殺

  手的激烈對戰就此展開…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
