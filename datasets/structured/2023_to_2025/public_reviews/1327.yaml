  【】女星，獻上好萊塢式泰國動作大片！


  劇情簡介


  蒂娜（普洛派琳唐普萊帕彭飾演）是個從小就接受精良殺手訓練的女孩，與代號「灰狐」

  的阿葛（索姆查格拉飾演）一起參與刺殺任務。


  某天，阿葛被組織背叛，慘遭殺身之禍。


  在逃亡過程當中，阿葛遇見不太正經的上班族查理（登坤恩加內特飾演），與他建立了特

  殊聯繫。


  臨終前，阿葛授權查理成為「灰狐」接班人。


  無奈之下，查理就這樣誤打誤撞進入了殺手組織「辦死處」，並接受殺手訓練，主要工作

  就是保護蒂娜免受組織殺害。


  一場殺手與殺手的激烈對戰就此展開…


