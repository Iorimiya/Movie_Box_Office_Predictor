url: https://www.ptt.cc/bbs/movie/M.1702899366.A.5C9.html
title: '[ 好無雷] 旺卡-放鬆、有趣、感人'
content: '今天利用下午悠閒的時間，去看了旺卡，

  在我的童年回憶裡是強尼戴普較黑暗詼諧的版本，但新的甜茶版本，卻是很溫暖、有趣、

  令人舒適的！


  很好奇華納到底是怎樣的公司，超英片拍的很爛，但是對這種魔幻、繽紛的故事題材卻又

  拍的很好！整體敘事、音樂、畫面還有鏡頭搭配道具的出現跟演員的出場時機都令人引起

  舒適，這才是好萊塢的工業底蘊。


  其中不少頭尾呼應的片段，在歡笑過後的感人情節，一直都在意料之中，但還是很讓人感

  動，旺卡能給人情緒感染，沉浸其中，就是一部很適合跟朋友、或自己想找個樂子時，可

  以選擇的好電影！


  --'
