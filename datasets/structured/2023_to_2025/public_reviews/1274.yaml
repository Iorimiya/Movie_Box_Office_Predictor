title: '[普雷] 旺卡之我見'
content: '終於，我去看旺卡了……恕我直言，看完的當下心裡os好無聊喔，畢竟我已經不是學生了

  ……


  但整體而言，還算可以吧？這部已經上映一陣子了，似乎要下檔，還想說趁下檔前感受一

  下溫馨氣息……但時段幾乎沒得選，看完覺得很平靜，也已經晚上十點多，連走在路上都

  很安靜……沒有特別驚豔或覺得難看，有刷過評論，評價都蠻高的，如部份評論所言不能

  認真看，不然不合理的地方蠻多的，


  其中幾幕，我實在無言，例如：

  1. 都已經沒錢了，怎麼把巧克力店整理得這麼精緻


  2. 巧克力是怎麼被下毒的？如果是外加，可能性比加在原料高一些？若是加在原料到底

  是怎麼做到的？


  3. 最後分享給大家的巧克力，是他們泡在裡面過的巧克力嗎？


  最後的配樂Pure Imagination，其實第一次是在電影一級玩家聽到的，後來發現原來旺卡

  才是始祖……


  對我而言，唯一小小的亮點，就是發現小麵的身世，找到他的母親……


  題外話，我一度覺得如果小麵換人演，他們是不是會在一起？


  另外，除了經典台詞，我更喜歡寫在金卡上的句子關於分享……


  電影結束的時後，我有點os蛤？演完了？


  總的來說，這部是傳遞正能量的輕鬆小品，個人就覺得普普囉……


  --

  補充內文，其實類似的電影類型看過大娛樂家，單就唱歌的部份甜茶整個弱掉，顏值ok但

  個人覺得不是最帥，還有一點就是跟母親的情感連結，我覺得有點淡……應該說我可能期

  待太高，但場景跟流暢度還ok，整個來說就一般'
