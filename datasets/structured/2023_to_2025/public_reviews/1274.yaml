url: https://www.ptt.cc/bbs/movie/M.1701864963.A.959.html
title: '[好無雷] 旺卡 (整廳只有我一人)'
content: '我是在台中新光影城 看下午5點25分的那場 整廳居然只有我一人

  這是繼2008年的歌舞青春3之後 又再一次難得的經驗


  只能說這部電影讓人看完心情會很好 很適合陰雨綿綿的天氣 鬱卒的人來看

  只是我看的是國語發音 剛開始會有點突兀 但是就當在看動畫的感覺就慢慢適應了

  整部電影完全不用動腦 也不需要看巧克力冒險工廠 (旺卡是前作)

  光聽音樂看巧克力就讓人大飽眼福了

  只是我很納悶為什麼上映第一天居然只有我一名觀眾...


  我個人是很推薦啦 只是比較適合小朋友來看 (巧克力冒險工廠也是)

  只要你喜歡看巧克力冒險工廠 相信這部旺卡也不會讓你失望

  覺得310元花的值得 買到好心情


  --


  那個....那個.....實現我的夢想(小聲)  摸你的頭  欺負你到哭


  --'
