title: '[小好雷] 旺卡-不要認真看就可以看的普片'
content: '手機發文不能寫普雷 晚點回家改


  已經看完一陣子了


  因為沒什麼想法 就沒有特別寫


  直到刷到國外評論






  我覺得滿中肯的 旺卡就是一個可以看也可以不要看的電影


  要說很好看很精彩其實也沒有


  主要就是超現實的想像力跟歌舞


  讓你沈浸在一種比較無腦的氛圍




  故事裡面也有危機跟反派


  但是完全沒有努力跟成長的刻畫


  基本上旺卡出來就是天才


  做出來的巧克力各種奇蹟魔法



  雖然人很笨 但是最後還是成功了


  認真看簡直就是無腦蠢片


  不過放鬆來看的話卻又氣氛不錯



  所以不要期待太高 跟家人朋友都很適合看


  不會太尷尬也不會有什麼反思


  就是消化時間罷了 至少也是屌打國片


  以上提供參考


  回家後考慮補充更多吐槽細節XD


  --

  Sent from nPTT on my iPhone 11 Pro


  --

  是亮點但的確有點怪吧'
