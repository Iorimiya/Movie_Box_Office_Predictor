title: '[新聞] 《旺卡》破13.6億登全球全台雙料冠軍！'
content: '新聞網址：


  《旺卡》破13.6億登全球全台雙料冠軍! 神曲太洗腦搞笑又毒舌


  2023-12-12 自由時報電子報 記者 許世穎 綜合報導


  由「甜茶」提摩西夏勒梅主演新片《旺卡》，目前搶先全美在全台及全球上映，口碑及票

  房表現相當亮眼，不僅獲爛番茄新鮮認證，被大讚是今年佳節最暖心、最適合全家人一起

  看的電影，也一舉拿下首週全球及全台票房雙料冠軍，招牌「歐帕倫普人」洗腦歌更引起

  粉絲瘋傳。


  該片在全球（除北美外）首週開片票房4320萬美金（約台幣13.6億元），其中包括全台首

  週開片票房近台幣2500萬，創下導演保羅金在台最高開片紀錄，以及甜茶繼《沙丘》後在

  台最高開片成績。


  除了甜茶飾演古靈精怪的威利旺卡、魔幻繽紛的巧克力、無限的夢想與溫暖，由休葛蘭飾

  演的歐帕倫普人更是深受大小朋友喜愛，他搞笑又洗腦的招牌舞曲「歐帕倫普，咚帕迪滴

  」令人耳目一新，無論年齡都能從中獲得樂趣，讓觀眾走出戲院後心情愉悅，充滿希望及

  正能量。


  片中歐帕倫普人身高僅45公分高，有著橘色皮膚、亮綠色頭髮，擅長唱歌、跳舞，又搞笑

  又毒舌，只要一出場就讓全場笑聲不斷。導演保羅金也說，若是少了歐帕倫普人，就稱不

  上是威利旺卡的電影了，「在原著的描述中，歐帕倫普人包含許多頁長的詩詞和歌曲，他

  們很搞笑又很毒舌，他們非常歡樂愉快，同時說話又很犀利諷刺。」


  提到找來休葛蘭來飾演這個很高傲、又挑剔、又搞笑的角色，保羅金表示：「雖然歐帕倫

  普人的形象是橘色皮膚和綠色頭髮，但我在思考這個角色時，休葛蘭的聲音一直浮現在我

  的腦海裡，我一旦有了這種想法就揮之不去，所以我想要跟全世界分享這種形象。」《旺

  卡》中英文版全台上映中。


  --'
