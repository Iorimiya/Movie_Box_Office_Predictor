url: https://www.ptt.cc/bbs/movie/M.1701864675.A.268.html
title: '[好微雷] 旺卡'
content: '2023年的【旺卡】，由保羅金執導，提摩西夏勒梅主演，講述旺卡在成立巧克力冒險工廠

  前的故事。這部的風格算是較貼近1971年版本的【巧克力冒險工廠】，跟強尼戴普的無關

  ，但兩部都沒看過也不影響觀影體驗。

  -


  如果是看過預告、也看過導演的【柏靈頓熊熊】系列的人，大概就能想像【旺卡】是什麼

  樣的電影。編導保羅金擅於將傳統童話的風格真人化，他不用特地去解釋故事中的浮誇元

  素，也能讓觀眾馬上接受這些設定，還能從中製造戲劇效果。像旺卡千奇百怪的道具、長

  到不可思議的客房合約、旺卡與媽媽之間的約定等等，有些很幽默、有些很感人。


  劇情單純，主要是畫面的呈現天馬行空，而且很多幽默的頭尾呼應。歌舞橋段很多、整體

  很歡樂，我最喜歡的還是休葛蘭唱的經典矮人歌XD

  -


  男主角提摩西夏勒梅的魅力沒話講，但我覺得旺卡這類浮誇角色有點超出他的駕馭範圍，

  幾場戲演得用力過頭（法蘭西特派週報也有類似問題）。雖然這樣講，但回歸到肢體演出

  和情感戲時，他的演出還是動人，如果是單純去看他的粉絲包準開心滿意，像坐我後面的

  女觀眾時不時就在姨母笑XD其他大咖配角的演出也不錯，但重點還是在男主角身上。

  -


  基本上除了歌舞元素以外，這部和導演前作的風格一模一樣，畫面偏歐風、劇情帶有一點

  奇幻色彩、角色們都像卡通人物一樣。然後搞笑橋段也不像近年來的商業片硬塞冷笑話，

  而是帶有童趣的幽默，很適合闔家觀賞。


  要不是事前對【巧克力冒險工廠】有些認識，加上迪士尼最近又惡名昭彰，不然我還真有

  在看迪士尼電影的感覺，要是前面加上城堡logo也真的完全不違和。

  -


  P.S. 如果沙丘2沒延期的話，提摩西大概又靠這兩部衝一波知名度了XD（雖然沙丘2再3個

  月也要上了啦



  --

  對啊，我也覺得他天生適合抒情XD演太歡樂的反而有點放不開的感覺。'
