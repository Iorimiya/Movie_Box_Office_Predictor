content: "《旺卡》叫好叫座票房超旺！全球正式突破4億美金\n\n2024/01/04 07:20\n\n〔記者許世穎／綜合報導〕由「甜茶」提摩西夏勒梅主演新片《旺卡》改編自羅德達爾的\n\
  名著《巧克力冒險工廠》，描述威利旺卡在創立巧克力冒險工廠的奇幻旅程。電影在全球\n上映後叫好又叫座，經過耶誕、新年假期，全球累積票房也正式突破4億美金（約台幣\n\
  124.32億元）。\n\n\n《旺卡》全球票房突破4億美金。（華納兄弟提供）\n\n該片以深植人心的魔性歌唱舞蹈，加上夢幻的場景畫面，勾起回憶的角色，讓人沉浸在歡\n\
  樂的巧克力世界中。根據外媒統計，截至本週一（1日），該片北美票房約為1.4億美金（\n約台幣43.51億元），北美以外的海外票房則約2.53億美金（約台幣78.63億元）。\n\
  \n截至目前完整的全球票房數字尚未公布，但也已確定破4億，最終全球票房有望達到6億美\n金（約台幣186.48億元），全台票房目前約為8500萬台幣。《旺卡》全台上映中。\n\
