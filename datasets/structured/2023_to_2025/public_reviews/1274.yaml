url: https://www.ptt.cc/bbs/movie/M.1731399155.A.A63.html
title: '[新聞] 提摩西夏勒梅《旺卡》確定續集！導演親口曝光進度'
content: '提摩西夏勒梅《旺卡》確定續集！導演親口曝光進度


  新聞網址：


  由提摩西夏勒梅（Timothee Chalamet）主演的電影《旺卡》於2023年上映，在全球創下

  6.3億美元票房佳績，近來導演保羅金（Paul King）證實續集正在發展中。


  此前有1971年《歡樂糖果屋》以及強尼戴普主演的2005年《巧克力冒險工廠》，提摩西夏

  勒梅版本的《旺卡》描述年輕時的「威利旺卡」，在成立巧克力冒險工廠之前的旅程，年

  輕的他靠著對製作巧克力的熱誠和用心，打破腐敗的壟斷制度，電影上映後叫好又叫座。




  近來在《柏靈頓：熊熊去秘魯》首映會上，導演保羅金被問及《旺卡》續集狀況時，他向

  《Hey U Guys》透露，電影的製作工作仍處於早期階段，但已經完成一半的劇本，「我們

  有了一個我們很喜歡的故事，並清楚知道我們想把這故事走向帶到哪裡去。」他也笑說想

  帶著這角色帶離城市，出國旅行，「這應該是我能夠說的內容了」。






  —------------------------------------

  哇旺卡要有續集了

  這部片當初看很歡樂

  還蠻期待續集走向


  --'
