url: https://www.ptt.cc/bbs/movie/M.1702540046.A.7F1.html
title: '[普雷] 旺卡 為了甜茶看結果更愛小矮人'
content: '之前看海報就覺得甜茶很適合這造型

  劇中也很多個甜茶式笑容，可能比巧克力還甜

  真的很像童話故事裡走出來的人


  不過還是要說，還是習慣甜茶在沙丘裡的那種氣質

  旺卡這角色可能已經被強尼戴普的樣子植入腦中

  所以整體雖然溫馨歡樂，有夢想的感動

  不過跟期待有一點點落差，比想像中再更兒童向些

  但還是一部看完心情會甜甜的電影

  然後建議要看這部可以帶巧克力進場

  看到一半會非常想吃巧克力！


  以下有雷




















  故事劇情圍繞旺卡的巧克力追夢之旅

  巧克力企業大亨們為了霸佔市場而弄旺卡

  還跟整個大教堂的神父聯手

  原先不知道豆豆先生有演，看到得時候嚇一跳

  歌舞片段最喜歡長頸鹿動物園和氣球屋頂

  其他滿多歌舞片段都很歡樂但沒有超出期待

  可能是舞或音樂或排場不夠深刻

  然後意外最喜歡的是休葛蘭演的橘臉綠頭小矮人！

  怎麼可以這麼可愛，整個表情又欠打又討喜

  看完除了想吃巧克力以外，會想要唱矮人國的歌

  「歐帕倫普，咚帕迪滴」



  --'
