title: '[新聞] 《旺卡》北美票房逆襲《水行俠2》 上映'
content: '《旺卡》北美票房逆襲《水行俠2》 上映3周照樣奪冠


  Yahoo奇摩新聞（記者 許瑞麟）


  2024年1月1日 週一 下午2:24




  《旺卡》。（圖／華納兄弟提供）


  記者許瑞麟／綜合報導


  電影《》在2023年最後一周周末以2390萬美元的票房，在美國奪冠，反超《

  》，上映第3周票房不跌反升，美國票房已達1.42億美元，全球票房已達3.869億

  美元，成為這一年來除了《》以外最賣座的電影。


  《》周末三天票房為1950萬美元，上映2周後美國票房為8400萬美元，全

  球票房為2.58億美元，似乎也逃不了落得和《》、《》和《蟻人與黃蜂

  女：量子狂熱》等超級英雄片的慘澹下場。


  動畫片《》周末票房為1720萬美元，位居第三；票房和評價雙收的《

  》則以1300萬美元位居第四。


  值得一提的是，《》已在全美獲得4567萬美元票房，打入美國外語片票房前五

  名，接下來有望朝著《寄生上流》5336萬、《英雄》5371萬、《美麗人生》5756萬邁進。




  《水行俠 失落王國。（圖／華納兄弟提供）


  新聞網址：





  --'
