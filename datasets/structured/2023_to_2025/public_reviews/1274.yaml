content: "旺卡撈1440萬美元 穩居北美票房龍頭\n\n2024/1/8 14:24\n\n（中央社洛杉磯7日綜合外電報導）影視產業分析師今天表示，在好萊塢盼金球獎頒獎典\n\
  禮（Golden Globe Awards）能推升票房成績之際，奇幻歌舞片「旺卡」本週料將賺進\n1440萬美元，穩居北美票房龍頭。\n\n法新社報導，「旺卡」（Wonka）這部在耶誕季表現最好的電影，上映第4個週末美加總票\n\
  房突破1.65億美元，國際票房則衝破3億美元。\n\n北美院線聯盟（Exhibitor Relations）的報告指出，全新恐怖片「暗泳」（Night Swim\n\
  ）週末收下1200萬美元，在票房排行榜位居第2。\n\n分析師葛羅斯（David A. Gross）認為這樣的表現「尚可」，儘管影評和觀眾口碑「偏弱\n」，但這部片1500萬美元的製作成本可望得以回收。\n\
  \n葛羅斯表示，恐怖片在2023年整體表現不錯，全球票房總收入達20億美元。\n\n「水行俠 失落王國」（Aquaman and the Lost Kingdom）有1060萬美元進帳，排名第3，\n\
  迄今在北美累積1億美元票房收入。\n\n適合闔家觀賞的動畫「飛鴨向前衝」（Migration）本週以1030萬美元成績排名第4。\n\n「愛愛愛上你」（Anyone\
  \ But You）本週有950萬美元 票房收入，略高於上週的880萬美\n元。，排在第5名的位置。\n\n本週北美票房第6到第10的作品依序為： 「船上的男孩」（The\
  \ Boys in the Boat），\n600萬美元；「紫色姊妹花」（The Color Purple），480萬美元；「鐵爪」（The Iron\nClaw），\
  \ 450萬美元；法拉利（Ferrari），250萬美元；「可憐的東西」（Poor Things\n），200萬美元。（譯者：李晉緯/核稿：蔡佳敏）1130108\n\
  \n#北美 #北美票房 #旺卡 #葛羅斯\n\n--\n佛法的\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\
  \n--"
