title: '[好雷]《旺卡》內餡是想像力、夢幻感，和滿滿的甜茶魅力！'
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  1.影片名稱：旺卡


  2.觀影時間：2023/12/24


  3.觀影地點：信義威秀


  4.觀影方式：電影交換券


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  部落格圖文版：


  「世上所有美好的事，都始於一個夢想。」


  《旺卡》的視覺效果和想像力無庸置疑地引人入勝，無論是圍繞著巧克力的種種甜蜜「魔

  法」，或是具現化旺卡、Noodle各自開店、尋找歸屬的夢想與其成真時刻，在令人目眩神

  迷的同時也深具巧思。


  而電影中的歌舞更是十足夢幻，繽紛、魔幻的各式巧克力，跟在提摩西夏勒梅詮釋下旺卡

  天真爛漫的氣質相輔相成。就是歌曲在音域上不夠廣闊，總感覺聽得不夠過癮。（但休葛

  蘭的「歐帕倫普」真的超洗腦！）


  提摩西夏勒梅飾演的年輕旺卡，和2005年《巧克力冒險工廠》的強尼戴普版本在性格上天

  差地遠，在整部電影裡無時無刻地散發滿滿的正能量。雖然相比下少了角色的複雜性，然

  而甜茶可愛的真摯笑容，實在讓人很難不對這個版本的旺卡萌生好感。


  「重要的不是巧克力，是跟你分享的人。」


  比較可惜的是，電影裡旺卡的關鍵成長竟然是「識字」。在相繼中了洗衣店史瓜比太太，

  以及三大巧克力商中為首的斯拉華斯的詭計後，旺卡仍不改單純，以致最後差點淹死在巧

  克力裡。這凸顯了《旺卡》的一大問題：除了巧克力，矮小的歐帕倫普人這些元素，聰明

  但不慧黠、容易上當的旺卡，和我們所熟悉的形象是有差距的。


  幸好提摩西夏勒梅將旺卡蘊藏在對巧克力的追求裡，那份對母親的眷戀傳達的非常真摯。

  超喜歡旺卡同時理解並看懂了媽媽留下的字條的一幕，細膩地雙關直接讓感動度變成雙倍

  。也因此，看到旺卡和夥伴們分享那片媽媽的巧克力時，真的瞬間被情感爆擊>”<（媽媽

  「收到」的手勢也是超暖！然後媽媽寫字的金鋁箔紙，實在有夠像金彩票！）


  而由於本片的導演曾執導《柏靈頓熊熊》系列電影，兩片在風格上相當接近（特別是還有

  休葛蘭、莎莉霍金斯這些共同班底），可是《旺卡》感覺上還是收斂了些，如果再誇張一

  點，肯定能更具娛樂性，把我的莞爾，直接升級成捧腹大笑啦！（雖然警長身材的進化過

  程是夠誇張了啦XD）


  --


  部落格：

  FB：

  IG：


  --

  我覺得關鍵是「沒有量身打造」沒錯，年輕旺卡的角色還是適合他的，然而在成長弧線或是歌曲呈現上，都沒有足夠大的框架讓他發揮、展現其他面向。

  確實這樣看，才能專注在《旺卡》的魅力上～（但就是本來以為會更有熟悉感一些>"<）'
