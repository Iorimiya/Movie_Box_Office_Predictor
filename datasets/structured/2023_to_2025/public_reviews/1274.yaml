url: https://www.ptt.cc/bbs/movie/M.1702632631.A.0E0.html
title: '[好雷] 旺卡'
content: '聖誕節跟家人不知道要看啥的話就選這部就對了


  除非真的很排斥音樂劇形式的作品


  劇情不黑暗不深沉


  看完之後無論是故事劇情或是歌曲都讓人心情很好



  提摩西在這部飾演的青年旺卡很稱職


  那個外貌神情和肢體動作完全是個追逐夢想而想法單純的大男孩


  不識字的設定不只讓這份天真更添說服力


  也連貫起了整個劇情


  因為不識字才被騙


  但是因為小麵教他認字才有機會最後找到小麵的母親


  在夜晚的動物園唱For a moment那段


  很有大哥哥帶著小妹妹玩耍的溫馨感


  也特別喜歡旺卡經過紅鶴池說的那句


  "他們不飛只是因為沒人跟他們說可以飛"


  後來拉著氣球飛走的時候紅鶴還真的就跟著一起飛了



  巧克力集團的三人在地下室賄賂警長時唱的sweet tooth


  也把本來應該是大人汙穢的官商勾結場景的氣氛變得很歡樂


  三個大男人穿著西裝拿著扇子圍著警長誘惑他的畫面真的有夠好笑XD


  後面警長恐嚇旺卡的對話和之後吃到肥成一坨也讓明明是惡役卻有種莫名的可親感



  看過巧克力夢幻工廠就知道威利旺卡的工廠有各種神奇機關與糖果


  旺卡中的青年旺卡也已經嶄露頭角


  總是能變出各種奇妙的東西


  憑空拿出一罐子巧克力吃了還會浮起來


  攜帶式的巧克力製造機可以混出各種不可思議的配方


  即使被關在地下洗衣間


  都能弄出全自動洗衣機讓所有人能偷懶


  也靠著各種神奇的魔術和巧克力才能度過各種難關


  例如催眠動物園警衛


  讓長頸鹿願意被擠奶


  同樣催眠了地下室警衛還意外湊合了一對情侶XD


  劇情中總是能不斷期待旺卡還會再施展什麼樣的魔法


  最後變出巧克力工廠那幕配上和休葛蘭飾演的歐帕倫普人握手


  讓人有種一切雖然結束了但是也正要開始的感動



  歐帕倫普之歌也很洗腦


  最後跑製作名單時居然還能再唱一次真的讓人意外


  是說歐帕倫普人因為自己站哨睡死


  結果要旺卡賠他1千倍也是滿過分的XD


  不過也多虧因為要還1千倍


  吃了要還他的一罐巧克力的巧克力集團被加罰了整倉庫的巧克力


  旺卡也才能得救


  這部雖然劇情很童書(畢竟本來就童書)


  但是意外的有不少這種讓人驚喜的伏筆回收


  用薄荷引誘長頸鹿也是


  催眠巧克力的效果居然連在一起讓關妮回電話給巴索也是



  看完心情會很好的一部電影


  尤其很推這部的音樂


  像是For a moment或You''ve never had chocolate like this


  都是聽著會很愉快的歌


  --'
