url: https://www.ptt.cc/bbs/movie/M.1701874128.A.522.html
title: '[好無雷] 旺卡'
content: '週日下午的中文特映場

  本來聽到連歌都是中文配音有點擔心

  不過這部的中配表現真的還不錯


  個人只有在小時候看過《巧克力冒險工廠》的小說

  小說中對於壞孩子的懲罰其實有點驚悚

  而這次的前傳電影只有溫馨不會可怕

  但其實沒看過書或是前兩部電影不太有影響

  只要知道是帶有一點奇幻魔法的世界觀

  就能好好享受這部繽紛歡樂的電影

  很適合在聖誕節期間觀賞


  有空會想要再看一次英文版聽聽看原文歌

  很喜歡小矮人唱的《Oompa Loompa》後來發現1971年的電影內也有但略有改編


  12/7出版的小說《旺卡》也會想找來看看

  強烈建議看的時候務必帶巧克力進去

  唯一扣分的點是黑人小女孩的爆炸頭髮型'
