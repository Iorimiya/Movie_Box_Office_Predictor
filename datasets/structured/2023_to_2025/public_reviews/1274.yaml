url: https://www.ptt.cc/bbs/movie/M.1701990991.A.6E8.html
title: '[新聞] 提摩西演《旺卡》 以為只是噱頭'
content: '新聞網址：


  提摩西演《旺卡》以為只是噱頭


  2023-12-08 04:10 中時新聞網 翁紫曦


  27歲的「甜茶」提摩西夏勒梅近年是好萊塢炙手可熱的當紅男星，自2017年《以你的名字

  呼喚我》一片暴紅後，片約接不完，女友換過無數個，從「強哥」女兒莉莉蘿絲戴普換到

  名媛凱莉珍娜。近期，他以歌舞片《旺卡》中的表現大放異采，但他竟自曝：「本以為《

  旺卡》是另一部用來賺錢的電影。」但在看完劇本後，他認為自己想太多了！


  被譽為有「曠世美顏」的提摩西是哥倫比亞大學的高材生，專心投入拍片後很在意電影質

  量。提摩西表示，很害怕《旺卡》只是用噱頭吸引觀眾賺票房，他也委婉解釋：「因為好

  萊塢近年來熱中重啟各項企畫，重拍電影。」但看完電影的劇本、歌詞，甜茶大讚：「

  這不可能只是噱頭，劇本太有趣、迷人了！」


  《旺卡》改編自強尼戴普主演的電影《巧克力冒險工廠》，甜茶更直言：「我本來就好喜

  歡這部電影、這個角色，我真的不想搞砸它。」他還用「嚴肅到眉毛都擠在一起了」形容

  自己看劇本的心情，但顯然電影讓他十分滿意，也很開心能呈現給觀眾。《旺卡》全台上

  映中。


  --'
