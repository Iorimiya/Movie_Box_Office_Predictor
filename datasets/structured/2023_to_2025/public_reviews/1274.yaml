title: '[新聞] 《旺卡》狂吸61億票房 破甜茶紀錄'
content: "《旺卡》狂吸61億票房 破甜茶紀錄\n\n2024/02/01 05:30\n\n\n《旺卡》在北美刷新提摩西夏勒梅從影票房紀錄，全台票房也正式破億。\n\
  （華納兄弟提供）\n\n〔記者許世穎／綜合報導〕由「甜茶」提摩西夏勒梅主演的《旺卡》在全球上映後叫好叫\n座、票房表現亮眼，北美票房目前已突破1.95億美金（約台幣61億元），創下提摩西從影\n\
  生涯最高票房成績，台灣方面票房也正式突破台幣1億元。\n\n\n提摩西夏勒梅主演的《沙丘：第二部》備受影迷期待。（華納兄弟提供）\n\n《旺卡》預計下週將於北美突破2億美金（約台幣62.58億元），全球票房目前也已突破\n\
  5.52億美金（約台幣172.72億元），電影昨天於南韓上映，就預售表現來看前景看好，將\n助該片全球票房一舉突破6億美金（約台幣187.74億元）。\n\n\
  而萬眾矚目的《沙丘：第二部》於下月底登場，提摩西也已陸續展開宣傳，有首集好口碑\n加持，電影上週末在北美展開預售直接癱瘓訂票系統，有望為他的生涯紀錄再創高峰。\n\
  \n導演丹尼維勒納夫透露，《沙丘：第二部》結局將比原著更悲傷，並為預計發展的第三部\n打下基礎，「我們將構建出一種徹底的平衡，來幫在第三部完成保羅故事線的敘述。」\n\
  \n《沙丘：第二部》將於2月27日搶先在台上映口碑場，2月28日正式上映。首集《沙丘》也\n將於2月7至13日重返大銀幕，將包含第二部的獨家片段，讓觀眾再度透過大銀幕體驗史詩\n\
  冒險旅程。\n\n--\n佛法的\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
