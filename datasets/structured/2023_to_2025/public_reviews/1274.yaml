title: '[新聞] 聖誕節首選！《水行俠2》、《旺卡》票房持續發威'
content: "聖誕節首選！《水行俠2》、《旺卡》票房持續發威\n\n16:47 2023/12/24 中時 翁紫曦\n\n\n傑森摩莫亞主演的《水行俠 失落王國》在北美上映，開出亮眼成績。（華納兄弟提供）\n\
  \n《水行俠 失落王國》自20日上映以來，在台灣票房表現亮眼；北美比台灣晚了3天上映，\n但23日上映就開出不錯的票房成績，達1370萬美元（約近4億台幣）。根據外媒預測，預\n\
  計僅3天就能達3000萬（約83億台幣），4天約4300萬（約119億元）。\n\n同樣來自華納兄弟的《旺卡》也表現不俗，首日票房達650萬美元（約18億元），預計3天\n\
  總票房將達1880萬（約52億元）。若華納兄弟的《紫色姐妹花》能在聖誕日擊敗競爭對手\n，有望包攬假期框架前3名。\n\n#票房 #3天 #上映 #水行俠 #旺卡\n\
  \n--\n佛法的\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
