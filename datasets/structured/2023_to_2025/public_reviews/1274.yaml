url: https://www.ptt.cc/bbs/movie/M.1704685476.A.D43.html
title: '[雷] 普雷 非常兒童向的旺卡'
content: "周末才搭末班車看了旺卡\n左手邊坐了大概7歲的外國父子\n在看之前有稍微爬點文\n大家都說看了心情會很好 是保守的選擇\n沒看過強尼戴普的版本\n\
  所以本來想說不會有強尼的刻板印象應該可以很享受……\n也可能是因為對本作的了解不足導致有點失望\n\n只能說我真的是老了\n30歲了看到老闆們拿著槍決定用巧克力淹死人\n\
  時實在是白眼翻到外太空\n滿腦子都在想所以那些巧克力是全部要報銷還是……屍臭怎麼辦之類的問題\n身為巧克力業者怎麼會有用巧克力淹死人這種想法，這難道不會讓小孩做惡夢嗎\n\
  這麼多巧克力再也不能吃了好可惜啊\n老闆怎麼會這麼決定之類的\n要是能把這段刪掉就好了\n然後最後廣場上某一刻突然男女主身上的巧克力就全部消失了……嗯果然是魔術師呢\n\
  然後就在這麼出戲的時候媽媽登場了\n不過因為堆疊時間也不多我本來大概也不會太感動就是\nnoodle媽媽也是花三分鐘（總計）快速帶過\n\n還有老闆娘到底要怎麼下毒……雖然我也不知道打從一開始那些巧克力是怎麼蹦出來的就是\n\
  \ 雪人的淚這種聽起來很牛的材料一個鄉巴佬老闆娘信手拈來就是整店下毒的份量。\n\n撇開邏輯應該是能衝著休葛蘭給好雷的電影。\n已經抱著這齣略微兒童向的心理準備來看\n\
  結果還是準備不夠充分\n建議大家真的做足心理準備再入場\n\n這齣就是會有吃巧克力讓你飛起來這種快樂奇幻的事情發生的戲\n請接受一個賣巧克力維生的人拿著槍決定用自己偷工減料辛苦攢下來的巧克力淹死人這種事\n\
  情再入場。\n\n\n--\n\n\n這裡旺卡還說歡迎來吃我們的巧克力\n我想說怎麼變你的了……\n\n抱歉可能我看漏了，只記得就是幾加侖幾加侖的純巧克力\n\n\
  原來是這樣啊……你真聰明XD\n好像對編劇稍微釋懷一點點了\n\n漂浮開始覺得不妙 然後到了淹死整個崩潰的我\n我有看到這評論XD\n你說的我都沒有看過QQ 可能要等其他人解答了\n\
  這齣有一些想賺人眼淚的場景沒錯\n但我比較冷血一點沒被溫暖到\n\n所以為什麼要拿巧克力淹死人"
