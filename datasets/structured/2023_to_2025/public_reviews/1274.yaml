title: '[好雷] 旺卡，看電影就是應該這樣甜'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  無意中買了巧克力香味專場的票，本來沒有太大的期待，但看完之後覺得很久沒有享受到

  這樣單純而舒適的歌舞編排了。情節整體來說順暢且豐富。


  影片結尾尤其歡樂，休葛蘭飾演的橘色小人十分古錐，跑片尾名單時，滿滿的現場觀眾還

  捨不得起身離開。


  這部電影的導演和編劇都不是特別大咖，因此劇本寫的中規中矩，但對於Wanka身世的改

  編看得出特別調配過，為甜茶量身打造。哪怕沒有豐裕的物質，也從不缺少來自母親的愛

  ，因此可以說是一位樂觀有才華的青年呢！（雖然不識字…）


  電影的投資不算少，場景美輪美奐，其中動物園那場戲撫摸長頸鹿那場戲尤其唯美。其實

  男女主角並沒有什麼除了友情之外的其他情愫，但只屬於少年人那種有夢想的溫情很動人

  。


  總結來說，小清新的劇本，優秀的攝影和佈景，甜茶演技與顏值都給本片大大加分。作為

  第三代的威利旺卡意外的適合。令人期待這一系列可以繼續下去。


  另外，巧克力製造魔法行李箱大愛，假如會出周邊一定值得收藏。內部設計極為精巧充滿

  古典魔法機關。編劇跟導演都是作家，難怪台詞也寫的很有文學深度。


  很棒的觀影體驗！（雖然巧克力香味淡淡的，但很好的烘托了氣氛。）



  --'
