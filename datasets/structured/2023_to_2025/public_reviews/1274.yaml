title: '[選片] 看旺卡還是水行俠？'
content: '如果想要看完能夠開開心心

  要看旺卡還是水行俠？


  自己沒有很迷迪士尼

  反而比較喜歡漫威那種超級英雄電影

  (我知道水行俠是DC)

  水行俠第一集我可以看到哭的那種

  覺得主角跟媽媽的互動很感人

  然後超愛復仇者聯盟 之前上映曾經三刷

  但我知道最近幾年超級英雄電影越來越難看了


  但如果我是自己看

  只能挑一部

  要選旺卡還是水行俠呢？

  -----

  Sent from JPTT on my iPhone


  --'
