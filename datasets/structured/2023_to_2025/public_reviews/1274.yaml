url: https://www.ptt.cc/bbs/movie/M.1702141073.A.A48.html
title: '[睡著雷] 旺卡舊版Vs 新版 劇情差異'
content: '防雷 結局雷！




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  1.旺卡身世


  提姆版：和牙醫爸爸住在一起，很喜歡吃巧克力

  但爸爸不准，有心理創傷，最後逃離家裡。



  糖果版：和離群索居的媽媽在叢林生活，媽媽不曉得為什麼會有製造巧克力的技術，旺卡

  從

  小吃到大，媽媽後來病死後，為了尋找媽媽遺言的秘密（以及想再看到媽媽的思念之情）

  決定去「美食之地」找最好吃的巧克力。


  2.旺卡形象


  提姆版：陰鬱深沈、內心有創傷、遺憾的大人，怪異、亦正亦邪，令人摸不著頭緒的神秘

  工

  廠主人。



  糖果版：樂觀積極、在愛裡長大散發光芒，能幫所有人解決問題的萬事通、鬼靈精怪的創

  業

  家。



  3.周圍角色膚色變化


  不再是全白人。


  原本由原住民（？）種族來擔綱的小矮人角色，換成休葛蘭，也就是白人。


  主要的角色多了很多種族，有黑人有亞裔有西裔，黑人同時也能拉主key。


  4.巧克力的地位


  提姆版：巧克力是小矮人部落的信仰核心，珍貴的食材，但在旺卡世界只是甜食的一種。



  糖果版：旺卡世界中巧克力是政治與經濟的核心作物，可以用來操控人心與賄賂官員，像

  是

  石油一樣可被視為貨幣的存在。


  小矮人的島上只是世界觀中眾多產地之一（雖然對小矮人部落來說可可豆還是很神聖）



  5.角色變身的理由


  提姆版：道德訓誡貪婪沒家教的小孩，在工廠亂來就會變身成紫色泡泡糖球、竹竿人等等

  怪

  異的樣子。


  糖果版：只是買個巧克力就被下毒了QQ



  ———————


  以下心得：


  1.這部大人去看可能會覺得不夠精彩，是兒童向的，劇情高潮迭起的部分只要平時有在看

  電影都能猜到走向。所有角色好人壞人形象也非黑即白，非常容易看得出誰是壞人。


  2.小女孩猶如Dora般的台詞「旺卡 你在幹嘛」「旺卡 我們該怎麼辦」的時候真的很出戲

  ，華納兄弟的政確電影都很故意給有色演員弱智台詞。


  3.提摩西演得中規中矩，像多拉A夢正直無私。大家都知道是好人，但沒啥特色，歌舞表

  現也平平，還過得去。


  4奇幻感不夠，雖然旺卡是自稱魔術師，但變出的把戲真的都很平凡，新版看起來只是很

  有行銷創業家而已，變出的把戲，都不是那種會讓人驚艷的奇幻想像。



  本片適合給想感受歡樂劇情的人，想要不動腦開開心心看電影就選這部了。








  --

  有啦 有歡樂到 但劇情還是太讓人失望了

  原來這才是真正的原著改編阿！

  那原著好無聊喔'
