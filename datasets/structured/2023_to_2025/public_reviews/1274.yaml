title: '[好雷] 旺卡 - 比預期好看很多的歡樂電影'
content: '雷文防雷資訊頁


  底下有劇情雷！慎入！


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  第一次在電影板發文就給旺卡了、因為實在是超乎想像的好看

  希望有興趣的鄉民也可以進戲院欣賞

  喜歡音樂劇的人絕對也會喜歡這部電影


  今年因為演員的關係、開始進劇場看了不少台灣音樂劇

  音樂劇就成為新的心靈補品o(  ω   )o

  所以看到主角中文配音是周加寬、就決定要進戲院看中文版


  沒看過本傳的巧克力冒險工廠

  所以旺卡對我來說就是一部全新的電影

  劇情簡單說就是一位巧克力大師要進城賣巧克力、中途遇到困境跟一一克服的故事

  我覺得劇情蠻有驚喜感的

  主要是不知道接下來壞人會用什麼方法害主角XDD跟奇幻巧克力世界觀也有關

  中間壞人跳舞賄賂局長的部分我看得很開心XDD也太幽默

  也不會很有小朋友電影的感覺、大人看可以融入劇情沒問題

  最後看旺卡跟媽媽相遇還看到哭XDD


  畫面跟音樂配樂都讓我有種看音樂劇的感覺！

  畫面很繽紛、舞蹈呈現很豐富、音樂很好聽

  看中文版難免會因為嘴形對不上有點抽離

  不過聽到中文歌詞對我來說更容易融入劇情

  而且中文版的歌都唱得好好聽

  之後有機會也想再刷一次英文原版、相信會有更多驚艷的地方

  甜茶也真D帥


  總之是看了會蠻快樂的電影

  中間有劇情稍嫌枯燥的地方

  不過華麗的畫面跟好聽的歌都可以彌補這個缺點

  而且在看之前另一半還一直碎唸說幹嘛來看這個、他覺得前傳的巧克力冒險工廠很怪

  害我也不報什麼期待XDD

  不過看完之後我們都覺得不錯

  還忍不住一直哼「歐帕侖普、咚巴滴嘟」


  最後如果希望找一部輕鬆無壓力的電影、想看音樂劇歡樂唱歌的電影、甜茶迷妹、周家寬迷妹（？）

  旺卡是最佳選擇d(>w<)b






  -----

  Sent from JPTT on my iPhone


  --'
