title: '[閒聊] 【旺卡】與動感電影'
content: "剛才進板看見新聞才知道...很喜歡2019年版本，用當時的主題曲紀念她...\n\n\n\n周芷若時期看照片得知，對後來飾演滅絕施太比較有印象~\n\
  R.I.P.\n\n\n【旺卡】真的好看~溫馨激推！\n\n\n\n因為跟本身行業相關，所以早期強尼版本的就很愛~\n\n\n\n\n因為還沒看過\"甜茶\"\
  那部作品的角色，所以稱呼\"提摩西\"就好！\n看到演員想起【舞力全開2~5】的Moose，有莫名的吸引力~\n然後Come with me那首歌一直覺得很熟悉...\n\
  原來在【一級玩家】的預告有出現過~\n\n\n\n本來就是【巧克力冒險工廠】的插曲嗎！？\n《刷洗！刷洗》那首的相似度有其他鄉民先提了就跳過XD~\n\n\n\
  最後要聊的是\"動感電影\"，就是遊樂園或科教館搭配銀幕椅子會搖晃震動的那種！\n第一次搭乘印象深刻是小學終於身高達到110還是120公分可以進場~\n在九族文化村的星際旅遊，那時候模糊印象畫面是真實拍攝的樣子...\n\
  一列雪山火車用驚險的角度去呈現……\n然後就愛上這設施，當時隔陣子都會更換不同的影片~\n只要到遊樂園一定會坐上一次！畢竟自由落體類的搭過一次就不敢了XD...\n\
  水管還不普及的時候曾經在批踢踢發文請教過相關影片，但不了了之...\n因為後來一直維持日月潭追逐白鹿那部已經看到沒新鮮感的影片...\n加上震動調弱且延遲不同步，也比較少去了。\n\
  前幾個月在劍湖山久違再次踏入~體驗了飛越恐龍谷！\n雖然拜AR(擴增實境)、VR(虛擬實境)、MR(混合實境)等等新科技所賜~\n但個人還是偏愛早期那種感覺！\n\
  終於...透過關鍵字找到且蒐集了當時印象深刻的幾部：\n\n\n\n星際旅遊(有上傳自行編修過的字幕)\n\n\n鬼屋探險\n\n\n採礦歷險\n\n\n男孩房間\n\
  \n\n\n這幾部除了九族，在六福村、科教館看過的樣子~\n希望能勾起鄉民夥伴們的記憶！\n敘述幾部一樣是動感電影但還沒找到，想請大家協助補充分享的作品、片段...\n\
  \n1.太空彈珠台(好像跟賽車有關)\n\n2.電腦主機、晶片板旅遊(記憶中是一群小老鼠在跑)\n\n3.六福村的阿拉丁？(對精靈那中文配音：「看！B~B~彈！」最有印象)\n\
  \n--\n  17806     9/06 -            □ (本文已被吃掉)  \n  17807     9/06 -           \
