url: https://www.ptt.cc/bbs/movie/M.1711559743.A.7E9.html
title: '[新聞] 旺卡 沙丘系列接連大賣！華納兄弟樂得和'
content: '《旺卡》《沙丘》系列接連大賣！華納兄弟樂得和「甜茶」提摩西夏勒梅簽下多年新合約




  （圖片來源：Pinterest）


  人氣正旺的當紅新生代男星 （Timothee Chalamet）從去年到現在，連續主

  演了兩部的商業鉅作《》（Wonka）、《》（Dune：P

  art Two）通通都開出賣座佳績，影片本身的口碑也不俗，正式確立自己在主流市場的票

  房號召力，而也對他的表現十分滿意，準備再與他展開更長期的合作。




  （圖片來源：華納兄弟影業）


  今宣佈，他們已和簽署多年的優先合作協議，未來將一同製拍更多作品，

  而也會以製片人的身份參與其中，獲得更大的創作話語權。


  去年上映的《》最終在全球以 6.3 億美元的票房作收，仍在上檔的《

  》目前則累積至 5.7 億美元，連續兩部開紅盤，也勢必讓未來的片酬大幅增長，

  即將從百萬美元的薪資晉升千萬美元價碼的俱樂部。


  文：Joker


  新聞網址：





  --'
