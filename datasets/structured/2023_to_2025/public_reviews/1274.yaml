title: '[新聞]LABUBU真人電影版執導人選出爐！《旺卡》'
content: 'LABUBU真人電影版執導人選出爐！《旺卡》《柏靈頓熊》導演接手操刀


  上個月，外媒《好萊塢記者報》（THR）獨家披露，索尼影業已與生產 LABUBU 的 Pop

  Mart 公司正式簽署影視改編授權的協議，未來將準備推出 LABUBU 電影版。如今事隔一

  個多月，《好萊塢記者報》又再度補充，索尼已經找到負責掌舵的導演，也就是《旺卡》

  （Wonka）、真人版《柏靈頓熊》（Paddington）系列頭兩集的導演-保羅金（Paul King

  ，下圖）。




  保羅金對於處理知名 IP、兒童奇幻題材、翻拍卡通人物絲毫不陌生，也已有成功經驗，

  他一手孵育的《柏靈頓熊》系列，就廣受觀眾好評，被認為是動物擬人化的真人混合動畫

  電影中，最具指標性的高水準作品。隨後進入好萊塢主流片廠體系之後所拍攝的《旺卡》

  ，也同樣繼續重振《巧克力冒險工廠》（Charlie and the Chocolate Factory）的銀幕

  魅力，在全球熱賣超過六億美元。




  --'
