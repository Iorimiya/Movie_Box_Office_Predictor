title: '[請益] 璀璨女人夢值得進電影院看嗎？'
content: '這部片首先是在金球獎大有斬獲

  再來變成影評評價偏好，

  但觀眾評分極差的走向

  所以本來是完全不想看


  後續的奧斯卡前發生的爭議先不提

  但看到喜歡的影評人有推薦這部片

  說這部片有種荒謬的喜感

  再加上板上目前都是給好雷

  想問一下這部片值得看嗎？

  如果真的偏幽默就會想進戲院看了


  備註：已看過秘密會議、米奇17號

  所以暫不考慮「不如去看秘密會議」的選項


  --'
