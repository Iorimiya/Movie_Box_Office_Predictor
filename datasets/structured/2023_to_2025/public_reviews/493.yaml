url: https://www.ptt.cc/bbs/movie/M.1741232293.A.9F6.html
title: '[ 轉錄 ] 《璀璨女人夢》 好雷影評'
content: '看到 zoe saldana 幾乎橫掃所有獎的女配角

  坎城又得了評審團獎，三位女演員同時拿下女主角獎（一位是跨性別）

  奧斯卡得了最佳歌曲

  實在讓人好奇毒梟+變性+歌舞的片是怎樣呈現


  逛了一圈影評，目前台灣的都是持好評

  （國外有些被政確影響了）


  看起來雖然都有提到劇情很抓馬哈哈

  但都說是部很特別、比較難定義的片值得一看



  ———————轉摘錄分享udn線上影評文章


  賈克滂畯}亞（Jacques Audiard）擅長透過犯罪題材描繪社會議題，並以深刻的人物塑造

  展現角色的生存掙扎。他的電影如《大獄言家》（A Prophet, 2009）剖析監獄內的權力

  鬥爭，《流浪者之歌》（Dheepan, 2015）則透過突發暴力揭示移民群體的困境。作品在

  現實與寓言之間游走，讓暴力成為社會結構與個人命運的映照，而非單純的視覺刺激。


  不過，在《璀璨女人夢》中，他選擇了一條與過往作品截然不同的道路：以歌舞元素為核

  心，塑造一個視覺華麗、點綴超現實色彩的通俗劇（melodrama）。這不僅是風格的轉變

  ，更是一種敘事策略的革新。這部作品以一名毒梟的變性旅程為主線，若以傳統寫實手法

  呈現，故事可能會停留在暴力與社會悲劇的呈現方式，強調毒梟世界的殘酷與無情。歌舞

  化的處理不僅提供視覺與聽覺的雙重衝擊，更打破現實敘事的框架，使內在情感與社會衝

  突以更具象徵性的方式展現，讓觀眾得以不同的視角體驗劇情張力。


  文章來源：










  --'
