url: https://www.ptt.cc/bbs/movie/M.1740322620.A.9E1.html
title: '[好雷] 璀璨女人夢'
content: '今年奧斯卡最佳影片，或許是近年戰局最混沌的一屆 – 《懼裂》肉體驚悚可能讓評審卻

  步、《艾諾拉》後半段的喜劇橋段反應兩極、《巴布狄倫：搖滾詩人》音樂傳記的演員往

  往更獲注目、《粗獷派建築師》演員的 AI 校正口音爭議，也讓本來的領跑地位產生變數

  。

  .

  那麼入圍 13 項大獎的《璀璨女人夢》呢？雖然爭議也不遑多讓，從戲內的人設口音、導

  演對墨西哥文化的詮釋（故事設定在墨西哥，但電影主要在巴黎拍攝，且主要演員皆非墨

  西哥人，卻以西班牙文發音）到戲外演員的個人言論都屢屢成為焦點。

  .

  然而，在去年坎城影展就讓四位主角共享影后殊榮，到年初在金球獎音樂與喜劇類奪魁、

  橫掃英國影藝學院獎，搭上「面對自我、擁抱多元」的主流價值，的確也是最佳影片熱門

  人選。


  /


  墨西哥大毒梟馬尼塔斯決定放下血腥過去，展開極端的自我重塑計畫 — 委託曾經懷抱理

  想、卻對現實失望的律師莉塔替他安排變性手術 — 於是「馬尼塔斯」變成了「艾蜜莉亞

  佩雷斯」，無法無天的「他」變成為弱勢發聲的「她」。雖然改頭換面、並試著彌補罪業

  ，但往日的羈絆與恩怨卻像幽魂一樣，緊抓著她不放。

  .

  看完《璀璨女人夢》我並不反感，但也能明白引起反感的原因。之所以不反感，是因為法

  國導演賈克歐迪亞關注的議題，一直都是邊緣人的掙扎和身份重塑，包括《大獄言家》阿

  拉伯裔青年的監獄求生、《烈愛重生》身心受創的自我救贖、《流離者之歌》難民家庭的

  生存挑戰，無不圍繞著「蛻變」的核心精神。

  .

  本片介於戲劇與現實間的誇張敘事風格，以不輸八點檔的獵奇設定與異色美學，來展現對

  社會邊緣人的關懷與性別流動的探索，也讓人想起西班牙鬼才導演阿莫多瓦（西語發音當

  然也是原因）。

  .

  在《璀璨女人夢》裡，無論男人還是女人，真正的掙扎並非來自生理分類，而是社會如何

  用權力與暴力來規訓性別。曾立足於暴力之巔的男人拋下一切，試圖以女性之身重生，卻

  在被召喚回「父親」身份後陷入毀滅，無論江湖恩怨，最終得以延續的，仍舊是母職兩字

  。

  .

  馬尼塔斯的改頭換面，宛如東尼史塔克在軍火商和超級英雄間的切換，都是主角放下原有

  身份、為過去的所作所為自我救贖。只是變性手術畢竟不是穿上鋼鐵裝，它是不可逆的、

  明確切分兩種身份的，但也就更容易被套上性別政治的眼光來檢視。


  /


  而電影的爭議之一也就在此。過往以冷峻寫實聞名的歐迪亞，這次選擇極具視覺張力的音

  樂劇類型來詮釋角色內心世界。許多值得刻畫的衝突（比如莉塔在工作和私人生活的兩難

  ）都以炫目的歌舞場面帶過，結果就是未能真正探討角色標籤（比如跨性別者、職場女性

  ）的內心掙扎，反而強化了刻板印象。

  .

  因此，也讓前半段看似前衛的性別探討，最終仍回歸「以暴力對抗暴力」的敘事收尾。期

  待在本片看見更當代、更跳脫框架議題回應的觀眾，也就只能停留在演員表現的欣賞層面

  ，難免造成期待落空。

  .

  飾演艾蜜莉亞佩雷茲的卡拉索菲亞賈斯康入圍奧斯卡影后，本身就是跨性別者的她創下新

  猷，她的確也把男人生理變為女性之後、心理父系威權的作祟詮釋得頗為精準，角色悲劇

  般的宿命也印證了片中整形醫師所言：「我能為你改變身體、皮膚、骨頭，但我改變不了

  靈魂。」

  .

  但最搶眼的仍是柔伊莎達娜，近年在《星際異攻隊》《阿凡達》系列展現不讓鬚眉的形象

  ，加上從小學習芭蕾舞的俐落身段，讓在以律師莉塔為主要敘事者的前半段，鋒芒硬是壓

  下馬尼塔斯 – 不過莉塔在艾蜜莉亞變性後，角色逐漸變得功能性，也讓兩位女角成為雙

  后的存在，柔伊莎達娜在奧斯卡被歸類在最佳女配角提名，也有望讓苦熬多年的她抱回第

  一座小金人。

  .

  值得一提的是，聖羅蘭在 2023 年成立的 Saint Laurent Productions 也參與本片製作

  ，時尚美學也在戲服上顯而易見，尤其柔伊莎達娜的套裝都兼具帥氣與嗆辣，好看極了。


  更多影評推薦，歡迎按讚追蹤：

  NmphenNieWIybA==


  --'
