url: https://www.ptt.cc/bbs/movie/M.1738953233.A.FB8.html
title: '[討論] 《璀璨女人夢》女主角爭議及獎季後續走向'
content: '由金棕櫚得主，法國名導Jacques Audiard執導的《璀璨女人夢》於本屆奧斯卡獎獲得13項

  提名，為本屆獲最多項提名的作品，也創下奧斯卡史上獲最多項提名的非英語電影。而女

  主角Karla Sofía Gascón也為首位獲得演員獎項提名的公開跨性別演員。本片在獎季的

  走向也被看好衝擊多項獎項，尤其在最佳國際影片、最佳女配角、最佳原創歌曲三個獎項

  更是被看好能直接奪獎。但這一切在Gascón過往的發言爭議被挖出來之後都有可能生變。



  事情先是發生於Gascón批評了同樣以非英語電影《I''m Still Here》獲得女主角提名的巴

  西演員Fernanda Torres，並和她的影迷在推特/Ｘ上爭論，而後Gascón過往的發言動態一

  一被挖出來在網上瘋傳，像是對“Black Lives Matter”行動的不當言論、對穆斯林女性

  及伊斯蘭教的抨擊，甚至對2021年奧斯卡獎的頒獎結果大力批評。這些具有極高爭議性的

  發言全部被公開。


  而讓許多人驚訝的不只是這些爭議性言論，甚至是訝異網飛在今年如此競爭的獎季居然沒

  有先行調查，而是讓這些發文動態能一一的被挖出來檢視，這也大大的影響了《璀璨女人

  夢》在後續的相關造勢。



  在這些言論被公開後，Gascón先是發文道歉，後續則是直接關閉了推特/Ｘ的帳號。道歉

  聲明說道她是Fernanda Torres的忠實粉絲，能在這段期間認識她是非常美好的事。並對

  過去發文內的「錯誤」觀點感到抱歉，也提到了這些爭議部分歸因於社群媒體的有害氛圍

  。她還暗示，與她對立的聲音可能是一場蓄意阻撓她在奧斯卡競爭的行動。



  在隔天，本屆女配角的頭號競爭者也為同部演出的Zoe Saldaña隨即發表了對此事件的相

  關說明，


  「我對此事件感到難過，無法容忍對於任何族群的負面言論，與這部作品的所有參與成員

  都是存在著包容性、合作精神，以及種族、文化和性別平等。也感謝仍然支持這部作品的

  所有人，我們聚在一起講述這個故事，是出於愛、尊重和好奇心，而我們會繼續傳播這個

  信息。目前我們只能說這些。謝謝大家。」



  本片導演Jacques Audiard則是在日前與Deadline進行了一場獨家專訪，談論到了Gascón

  的爭議，說明了他已與對方斷絕任何關係。


  「我沒有跟她說過話了，而我也不想再與她有任何關係。她正走在一條自我毀滅的道路上

  ，我無法干涉，而且我真的不明白她為什麼還在繼續這樣做。為什麼她要傷害自己？我不

  理解。而我同樣不能理解的是，為什麼她要傷害那些曾經對她非常親近的人。我一直在想

  ，她這樣傷害別人，傷害劇組，以及所有為這部電影付出極大努力的人。甚至是我、Zoe、

  Selena。我真的不明白，為什麼她還要繼續傷害我們。」



  Gascón在事件發生後也是拒絕與網飛進行直接對話，僅透過經紀人代表。網飛則是決定

  與她切割，不再資助她到美國當地參與任何獎季相關活動，甚至把她從FYC的造勢廣告除

  名。但Gascón自身則還是能參與歐洲的相關頒獎典禮，像是歌雅獎或是凱薩獎。


  在Jacques Audiard的專訪之後，她則是發表了聲明將會退出任何獎季相關的活動，以避免

  影響《璀璨女人夢》在奧斯卡獎項的競逐。


  「在我看完了Jacques的訪談後，我決定為了這部電影、為了Jacques、為了演員們、為了

  值得這一切的出色劇組，還有我們共同經歷的美好旅程，讓作品本身來說話，希望我的沉

  默能讓這部電影被純粹地欣賞，因為它是一封獻給愛與多樣性的美麗頌歌。我真誠地向在

  這個過程中受到傷害的每一個人道歉。」



  在此事件發生之後的獎季整體走向，好萊塢報導者則是與一些有投票權的會員詢問，在這

  之後許多原本支持《璀璨女人夢》的會員在任何有提名的類別投票給這部都會變的困難。

  網飛目前則是將全力造勢在這部作品最有機會得獎的獎項，最佳國際影片、最佳女配角、

  最佳原創歌曲。


  而在今日早上舉行的評論家選擇獎，則是在1/10就投票結束，美國製片工會獎則是在事件

  發生時的1/30投票結束，這兩項重要的指標獎可能不會受到太多影響。但下週的英國電影

  學院獎就有可能決定後續獎季走向，《璀璨女人夢》獲得本屆11項提名。而奧斯卡獎投票

  則在2/11開始。



  在《璀璨女人夢》的爭議延燒之時，獎季的領先者《粗獷派建築師》也早早陷於使用AI的

  爭議，也使得本屆獎季變得更撲朔迷離。


  --'
