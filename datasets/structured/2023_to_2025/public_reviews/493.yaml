url: https://www.ptt.cc/bbs/movie/M.1741326230.A.ABD.html
title: '[好雷]《璀璨女人夢》，改變是條漫長的路，我們'
content: '部落格版：


  早在《璀璨女人夢》尚未有在台上映的消息時就相當期待這部作品，而當獎季開跑看著電

  影接連獲獎，甚至得到金球獎四項大獎肯定、於奧斯卡更一舉提名十三項打破非英語電影

  紀錄，讓人整個期待值拉得更高。然而後來的發展相信有在關注的觀眾都知道，《璀璨女

  人夢》的後續發展與氣勢簡直跟電影劇情同樣的像極八點檔。以其所飾演的角色「艾蜜莉

  亞佩雷斯」取爲電影名的女主角卡拉索菲亞賈斯康，不僅是坎城影展與歐洲電影獎首位獲

  得最佳女主角殊榮的跨性別演員，也在成功取得奧斯卡門票後寫下奧斯卡歷史新頁。本該

  成為見證世界已經改變、能夠包容與擁抱不同的代表，卻沒想到她自己卻是歧視他人、吐

  多元口水的那方，於社群網站抨擊伊斯蘭教與穆斯林女性，更酸第93屆奧斯卡頒獎結果讓

  她「不知道是在看非裔韓國人典禮、黑命貴示威運動還是國際婦女節」，還曾暗示同樣角

  逐影后寶座的巴西女演員費南妲托雷斯背地與團隊策劃詆毀她，過往各種仇恨言論遭到翻

  出，卡拉索菲亞賈斯康瞬間成為眾矢之的。


  卡拉索菲亞賈斯康的爭議無疑對《璀璨女人夢》造成嚴重衝擊，為了止血不只導演賈克歐

  迪亞和電影發行方與之切割，以此片入圍最佳女配角的柔伊莎達娜亦出聲譴責言論的不適

  當，卡拉索菲亞賈斯康則表示會退出後續所有造勢活動，也不會出席頒獎典禮（當然後來

  她還是有出現就是了）。而最後的結果就是，《璀璨女人夢》在最佳國際影片大熱倒灶敗

  給巴西代表《我依然在此》，在電影收穫包含金球獎、英國電影學院獎還有數個影評人獎

  的肯定後，遭翻盤丟失這個本該勝券在握的獎座，僅拿到最佳女配角與原創電影歌曲。當

  然演員問題是一個，不過後來導演賈克歐迪亞反覆的態度也遭質疑，在顯然是看誰更會公

  關更有機會得獎的奧斯卡上，《璀璨女人夢》的危機處理能力被視為是一次的公關災難。


  姑且不論電影外的爭議，先回到電影本身來看，在事前讀過不少國外的評價，打了好幾劑

  預防針後進場，意外的我還滿喜歡《璀璨女人夢》的，不認為電影有到那麼慘烈，或許是

  本身就很愛看台灣八點檔，能夠將犯罪歌舞電影拍得這樣狗血、離奇曲折到寫在一起卻通

  通合理的劇情，是很合我的胃口至少不會討厭。本來離開電影院的那天，我在想《璀璨女

  人夢》是部什麼樣的電影，導演賈克歐迪亞放入許多值得深究與探討的議題，從性向、性

  別到種族，觀眾看見許多壓抑的自我渴望得到釋放，對性別認同的困擾、對工作處境的不

  滿、對自由與愛情的嚮往...，只是當隔天一則推播的新聞剛好出現，讓我對《璀璨女人

  夢》有了不同的想法，也想起電影在剛開始沒多久，在替馬尼塔斯尋找能夠替他動變性手

  術的醫師時，麗塔與醫師的那場對話，還有後來艾蜜莉亞對麗塔傾訴的內心，是否「渴求

  改變」才是電影的核心？



  新聞提到警方在墨西哥一條公路上的廢棄車輛內找到九具遭到虐殺後分屍的屍體，推斷是

  上週結伴出遊卻失蹤的九名大學生。墨西哥長年籠罩在毒品的陰影之下，政府雖然曾展開

  大規模掃毒行動，卻遭致販毒組織與犯罪集團的反撲報復，亦有拒絕與毒梟合作或是出力

  打擊犯罪的市長遭到殺害，勢力不斷壯大的販毒集團甚至已可抗衡軍隊與政府，墨西哥人

  民生命與生活嚴重受到威脅，國家治安亮起紅燈，墨西哥國際地位逐漸下降、經濟發展出

  現困難，即使長達十多年的毒品戰爭宣告結束，不過軍方直至今日仍在努力打擊毒梟，就

  連新任美國總統唐納川普都出言逼迫墨西哥政府加強掃蕩毒梟力道。這樣一則九名大學生

  遭到綁架、虐殺然後分屍棄之荒野的新聞都來驚悚，卻是墨西哥日常的一處縮影，同時也

  和《璀璨女人夢》意外有了連結與共鳴。


  醫師說變性手術能夠改變的只有身體，卻改變不了靈魂。可是麗塔卻認為改變身體就有改

  變社會的機會，改變社會就能改變世界，改變世界就能改變一切，於是她說服了醫師為馬

  尼塔斯進行了手術，也讓改變成了電影的關鍵詞。《璀璨女人夢》中三個女人，曾為毒梟

  的艾蜜莉亞，懷才不遇的律師麗塔，還有感受不到再被丈夫愛著的潔西，她們都對現狀感

  到不滿與憤怒，說不出口的躁動推使著她們去改變，她委託她、她幫助她、她鼓勵她、她

  拜託她…，不論有意還是無意，她們確實助力對方去改變、給了對方勇氣與動力。正如艾

  蜜莉亞說的，她從來不缺少聲音，只是她無法高歌，她們不是不想改變，只是等不到機遇

  。而後來馬尼塔斯如願成了女人，開啟了救贖與回饋社會的事業；麗塔則因此得以伸張她

  過去無法伸展的報負與正義，潔西亦決定投入愛人的懷裡展開新的生活。


  然而改變這件事帶來的，是好的發展還是壞的結果，可能沒有拉到長遠來看沒人知道，又

  或者在某一刻陡然驚喜，改變或許從不是自認為的一時半刻就能成功的。如果說今年獲頒

  最佳影片的《艾諾拉》是灰姑娘大夢初醒的哀傷故事，那《璀璨女人夢》何嘗不也是她們

  甚至墨西哥低吟至今的一曲悲歌？艾蜜莉亞、麗塔與潔西付諸行動，如同後來艾蜜莉亞與

  麗塔創辦的非營利組織那樣，試著讓改變帶給自己、帶給他人、社會和世界點亮希望與未

  來的微光，即使改變總伴隨著犧牲與痛苦，也要奮力撕下過去迷惘的標籤，用改變翻轉人

  生。只是過去的生活依然影響著她們，她們極欲甩掉的那個曾經的自己還是不放過她們。

  麗塔最後站在山坡上，爆炸後的熊熊烈火映著她無聲的吶喊，只是眼淚擦掉她知道還是得

  再次站起，繼續為未完的改變再次奮鬥。



  我自己的角度來看《璀璨女人夢》，我會想電影中的女性既是她們自己，同時卻也是墨西

  哥這個國家的縮影。前面有提到，曾經有女市長上任後施行多項政策打擊毒品犯罪而遭犯

  罪集團盯上，經歷數次暗殺與數次德偉死裡逃生，即使丈夫因她遭到槍殺，自己也必須終

  身配戴結腸造瘻袋，她依舊堅持著她的信念。遺憾的是在最後一次對她的襲擊中，為了保

  護女兒，女市長選擇跟隨犯罪集團走，當她被發現時已成屍體，生前曾遭毆打、刀刺、焚

  燒等殘酷虐待。女市長之死震驚全國，她的犧牲雖顯露毒品暴力的殘忍，卻也給予墨西哥

  人民反抗毒品暴力的力量，她的精神無疑成了一道照亮明日的曙光。如果馬尼塔斯代表著

  的是毒品與犯罪的墨西哥，那艾蜜莉亞則是象徵希望與重生的墨西哥。看著人民最後為了

  艾蜜莉亞走上街頭高歌，憂傷中卻能聽見堅定剛毅，那刻起艾蜜莉亞彷彿成了那位女市長

  ，成了某種精神永留於人民的心中。即使只有觀眾知道艾蜜莉亞離開的真正原因，但至少

  人民這樣認為就好了，是吧？


  我喜歡導演賈克歐迪亞用歌舞片的方式來拍攝《璀璨女人夢》，不僅讓這樣通俗狗血的劇

  情娛樂張力更大，情感傳達與內心獨白的具象化也讓整部電影變得相當飽滿，既用演也用

  歌舞來推動劇情，在被製造出來的舞台空間裡，觀眾反而更可以專注在每句台詞（歌詞）

  與理解並感受角色，其傳遞訊息與想法力道亦比平鋪直述來得強勁。從開場沒多久的《

  Todo y Nada》、《Mi Camino》還有無疑是最高潮的《El Mal》都成功放大了角色的複雜

  情緒，雖然這部電影被罵最多的似乎也是這些歌曲，但我還是很喜歡。特別是《El Mal》

  這場戲，充滿著挑釁、批判與嘲諷，柔伊莎達娜表現得太好，是場讓人目不轉睛的舞台表

  演。基本上我覺得每回輪到歌舞時間就是柔伊莎達娜的主場，每首歌不論是快歌或是抒情

  都完全消化與掌控，其表現力之強到麗塔這個角色簡直為她量身打造，《璀璨女人夢》儼

  然都是她的舞台時間，能夠於獎季橫掃幾乎所有女配角獎甚至奧斯卡完全不意外。


  不過雖然我喜歡《璀璨女人夢》大部分的時候，但我不是很喜歡電影的剪輯方式還有收尾

  的部分。如我前面提到的，《璀璨女人夢》換個角度來看其實就像是墨西哥的處境，多年

  努力就為了洗刷掉毒梟王國的惡名，改變確實不容易，需要的時間也很長，不過至少就像

  女主角們踏出了那步一樣。所以我覺得如果後面艾蜜莉亞的遭遇真像那位女市長遭到犯罪

  集團報復，那麼她的犧牲與後續而起的悲鳴與革命是不是更具衝擊？那種「改變不容易，

  可至少我們走在了改變的路上」的感受會很強烈，但導演賈克歐迪亞卻選擇合理可相對無

  趣的以暴制暴，這是非常可惜的地方。整體而言，《璀璨女人夢》還是在我期待值之上的

  ，兩位主演卡拉索菲亞賈斯康與柔伊莎達娜更是其中亮點，我在想若沒有言論爭議，或許

  卡拉索菲亞賈斯康會是其他入圍者的最大威脅。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
