url: https://www.ptt.cc/bbs/movie/M.1697810818.A.FB8.html
title: '[好雷] 母女聯手爆笑出盜的《詐騙女王》'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  1.影片名稱 : 詐騙女王

  2.觀影時間 : 10/20

  3.觀影地點 : 台北西門in89

  4.觀影方式 : 自行購票


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  此區為發文防雷頁 可選擇性提供上列 1~4 資訊 或不提供亦可 觀影心得於分隔線下方發

  布即可



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  最近看到《詐騙女王》的預告片後，立刻決定下班帶我媽一起衝電影院！


  不知道大家有沒有覺得，後面的韓國電影表現形式與題材都越來越豐富了～


  以前看韓國電影很多都是那種政治間諜、社會犯罪、感情出軌……之類的當紅，


  但現在就連輕鬆向的電影，韓國也有越來越多不錯的作品出現了，


  而這一部電影從預告當中就可以明顯感受到那種愉快的氛圍，所以作為母女間的約會電影

  再好不過了！



  整部電影看下來有很多笑點(?)，特別是看到求婚的那一段，


  真的是讓人一整個社恐症強烈發作……當下真的可以說是與女主角極度共感，


  尷尬到一整個渾身發麻、只能用笑來掩飾的程度；


  但真的讓我看完之後覺得心情愉悅的，反倒是整部電影對親情部分的描述。




  從電影一開場雖然一連串看似非常帥氣、科技感十足，然後好像計畫縝密的偷竊行動，


  不過隨著事情的演變，大家開始有了跟女主角一樣的想法：事情怎麼好像沒有想像中順利

  呀……


  接下來情勢就有如不小心抽掉高疊餐盤塔的底盤，唏哩嘩啦～然後全部崩塌、摔個粉碎，

  完全一塌糊塗！


  最後再看到女主角那種已經＂老娘豁出去了＂的表情，以及放飛自我的奔逃模樣，


  觀眾們大致上也對女主角的職業技術水平有個了解。



  接下來透過女主角與情報頭子喬治的對話內容，大家也更加清楚女主角目前面臨的窘況：


  由於現在科技技術與防騙資訊日益發達，那些有錢人或是偷竊／詐騙的目標自我防護意識

  也很高，


  大大增加了女主角在自己老本行中想要成功的困難度與風險，


  要是還想用以前的一些老方法，有些明顯已經是行不通了！


  在這裡大家也約略感受到有一種：因為時代變遷，在社會中掙扎的成人們內心潛藏的一種

  焦慮！




  而女主角作為一名單親媽媽親手將孩子拉拔長大，雖然自己沒有什麼比較合乎社會期待的

  正當本事，


  但仍盡力給女兒最好的生活環境、滿足她的物質需求，無論私底下是否已經負債累累……

  .


  但對外依然光鮮亮麗，出外也能抬頭挺胸營造出一種符合社會＂成功人士＂觀感的形象，


  因為作為母親，她很清楚在當時的社會中，大家都是怎麼去評斷、看待他人的，


  所以她不希望她的女兒受到一絲一毫的委屈。



  但也正因為身為一位母親，她知道要是自己的職業曝光，絕對會讓女兒蒙羞，


  而且即便她一開始並不希望女兒繼承衣缽，但仍是無可避免的讓女兒學會了一些她本業的

  技巧，


  甚至更讓媽媽擔心的是……這些本事用的還挺好！甚至不輸自己當年！


  這一點也讓女主既替女兒感到驕傲，卻又相當自責，


  因為女主自己的人生也經歷過，當回歸現實、回歸到生活層面後，


  社會終究是不可能真正接納這些所謂＂不務正業＂的人，母親又怎會捨得女兒吃同樣人生

  的苦？



  所以這部電影的事件，就是女主角為了女兒也為了自己，決心幹一票大的！


  然後就此金盆洗手，不用再重操舊業，讓女兒生活無虞外也不用再提心吊膽過生活。




  由於這電影很大一部分是親情的描寫，所以自然也有不少畫面是以女主角女兒為視角的，


  而以女兒本人的立場來看，雖然平常嘴巴上會吐槽母親不務正業、跟不上時代，


  但看的出來她其實也相當愛護著媽媽，內心也深知媽媽為她付出了很多而疼惜著，


  不然也不會每次都自願幫媽媽處理偷盜過程中，那些媽媽永遠搞不懂、關於科技3C類的玩

  意兒，


  甚至在這最後一票大的生意中，原本媽媽極力抗拒她的入夥，


  但最終還是說服媽媽母女倆一起聯手比較好，這樣無論遇到什麼問題也才能一起克服！



  關於這一部分的情境，我自己也是看得非常感觸、相當心有戚戚焉的！


  可能因為小時候家庭環境的影響，所以我跟我媽一直都是那種有如朋友、有如閨蜜般的相

  處，


  因為我媽也是哪種大咧咧的粗線條個性，同樣對現代科技3C類的東西很不上手，


  我也如同電影中的女兒一樣，常常會吐槽她跟不上時代、腦袋太死板對新觀念的吸收慢，


  但是嘴巴上即便唸著她笨，還是會偷偷用我自己的方式去維護她，怕她被外面的人欺負！



  所以說電影裡面很多那些只是用演、但沒有說出來的情感表現，其實我都挺能理解的！


  特別是到了最後面，當媽媽要女兒自己先走，自己則選擇留下來去拯救搭檔多年的老夥伴

  ，


  但女兒最終也還是放不下媽媽，同樣出現在現場陪媽媽一起解決這次難關，


  換作是我，我也會完全做出一模一樣的選擇吧！


  ＂要是沒有了自己，媽媽老是笨手笨腳的，該怎麼辦才好呢？＂((嘆氣




  最後我真的蠻慶幸這次的電影，我是帶著我媽一起來看的，


  整部電影的氛圍既輕鬆又溫馨，不會有什麼太深澀的內容特別需要去解釋，


  兩個人看完之後都是那種愉悅又帶點感動心情，我還笑她說：你看！這不跟我們很像嗎？


  然後我們就一起在西門町找了間餐廳坐下來吃點宵夜、聊聊天再回家，


  這也是自從爸爸過世之後，我跟媽媽之間常有的一些生活小確幸～


  所以也將這部電影推薦給週末假日想要這種輕鬆愉悅又溫馨氛圍的看倌們！





  --

  如果另一半這樣跟我求婚，真的很社死......

  哈哈跟她說難得有機會請你看電影，給個表現機會孝敬一下！

  我懂！我也是一看到那幕直接眼淚止不住地往下流！

  我還偷偷的捏了我媽的手……QAQ'
