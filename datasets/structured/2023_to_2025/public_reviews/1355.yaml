title: '[請益] 詐騙女王，女主角怎麼發現___的？'
content: '可能有電影雷，一樣來個防雷頁







  ----












  如題，女主角最後到底怎麼發現金條的？

  我記得在電影前段的時候，

  確實有鋪陳過女主角的直覺很敏銳

  這個點我自己是滿可以接受的

  因為如果女主角沒有什麼過人之處

  看起來智力能力普通 武力能力普通 3C能力普通

  如果單純靠變裝能力優異就可以詐騙搞這麼多年

  也真的是把緬北當笑話了


  我記得在電影中段的時候

  喬治有一直問女主角說

  到底有沒有發現，或是有感覺黃金藏在哪裡

  女主角明明很清楚的說：「不知道，沒有感覺。」


  最後卻莫名其妙找到了？


  電影畫面有特寫女主角回想男主爸爸站在黃金前面注視的畫面


  但如果以實際常理來看，你怎麼可能因為有人站在那邊看就發現黃金


  這也太牽強了


  還是是利用這個畫面，表達女主角直覺真的很強很敏銳


  所以最後發現黃金？



  --

  原來還有偏光鏡這種東西 我一直以為只有那種透光玻璃 眼鏡也可以這樣搞就是了?'
