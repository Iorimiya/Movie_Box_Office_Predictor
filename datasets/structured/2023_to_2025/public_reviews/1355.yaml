title: '[好雷] 《詐騙女王》無厘頭的竊盜母女檔'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  先說結論 我認為《詐騙女王》值得一看


  他不是那種好萊塢堆疊特效的詐騙動作爽片

  而是把各種笑料元素結合 適合輕鬆的搞笑小作品

  不要用太嚴肅的心情去梳理劇情 會看的很愉快很放鬆


  可能某些劇情會讓你覺得很無厘頭

  看下來會讓你感到WTF?為什麼會這樣??

  但我認為正是這些莫名其妙的笑點

  穿插在本片中 把各種元素結合在一起


  另外如果你本來就很喜歡本片女主角-嚴正化

  我也蠻推薦可以來看看她的

  這算是我第一次在大螢幕上看她

  之前只看過她在網飛上的《車貞淑醫生》而已

  看完覺得她真的有撐起整部戲 服裝一套一套的換

  很生活化的演技 跟誰對戲都很有感覺


  不管是跟女兒的親情戲 跟喬治的老友戲

  或是隻身潛入反派大本營 跟壞人們的對手戲

  還有偷抓走貓咪 跟富二代在魚缸前那段邂逅(?)

  當你還在感動時 她又塞了一個笑點 表情也拿捏的十分到位

  只能說角色魅力真的很夠 看完真有被圈粉的感覺


  最後認為這部最厲害的是 明明劇情內偷竊詐騙是不對的

  但我在看的過程中 卻會默默希望女主這方贏(代表反派演的夠討人厭?

  也會被母女之情的互動所感染 很日常的情感不會太做作


  電影最後也不拖泥帶水 收的很乾脆

  看到黑道老大失智 大家終於發現黃金藏在哪

  迎來完美大結局時 真的會忍不住暗自叫好XD



  --



  我覺得這部還可以欸

  是吧 有血有肉 跑回來都浪費船票了(?)

  真的 在地下室被抓包那段真的有驚恐到 結果砍下去當下失智 到底XDD??'
