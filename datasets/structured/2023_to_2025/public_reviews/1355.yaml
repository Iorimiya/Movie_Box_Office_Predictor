url: https://www.ptt.cc/bbs/movie/M.1697551200.A.146.html
title: '[新聞] 嚴正化換穿近30套服裝變身【詐騙女王】！'
content: '新聞網址：



  接棒《特務搞飛機》、《樂透大作戰》的南韓年度犯罪喜劇《詐騙女王》，即將在本週五

  （10/20）於全台歡樂獻映。近期以戲劇《車貞淑醫生》與綜藝《唱跳歌手流浪團》廣為

  台灣觀眾熟知的嚴正化，將在片中化身擅長變裝術的「百變騙徒」，尤其將在片中換穿近

  30套不同服裝，從居家、清純、性感、俐落等不同風格，展現出華麗的變裝術和搞笑感，

  就連導演李丞駿都大讚：「嚴正化在片中展現出八色鳥般的魅力」。此外，本片還集結各

  式各樣的犯罪高手們相互過招，聯手將爆笑感推到最高點。尤其常在戲劇中飾演兇狠又嚴

  肅角色的朴號山，這回竟然逆轉形象，詮釋嚴正化的友人與犯罪仲介人，角色氣質優雅，

  甚至是個會差點比出蓮花指的大叔，也讓嚴正化笑稱：「跟號山見面時，就像毫無隔閡的

  閨密、一輩子都想見到的朋友一樣，以這樣的心情來跟他演出。」不僅如此，本片也吸引

  宋慧喬、華莎、泫雅等巨星搶看，尤其名人們好評如潮，更讓本片未演先轟動。





  嚴正化在最新主演電影《詐騙女王》中，飾演風格、髮型、語氣都可以隨意變化的華麗變

  裝術騙徒，也因為即將金盆洗手，讓她決定參與一生最後一次可以逆轉人生的600億韓圜

  超大型犯罪計畫，將為來到戲院的觀眾們帶來燦爛笑容。這是她繼《特務搞飛機》之後，

  睽違三年再度回歸大銀幕，只見她在片中變身百變騙徒，換穿近30套不同服裝，從居家、

  清純、性感、俐落等不同風格，展現出華麗的變裝術和搞笑感，她對此表示：「一開始讀

  劇本，就從頭到尾一口氣給讀完了。因為這個角色，是可以帶來多種變化的魅力角色，我

  覺得可以愉悅地拍攝，所以才決定演出。」導演李丞駿也稱讚：「嚴正化在片中展現出八

  色鳥般的魅力，是部可以充分感受到歡樂的電影。歡迎大家跟珍視的人一起到電影院，感

  受嚴正化的魅力，以及她跟名品演員們的合作。哪怕只是暫時的，也希望大家可以藉此感

  受到幸福快樂的氣息。」



  有趣的是，《詐騙女王》還集結各式各樣的犯罪高手，聯手將本片的爆笑感推到最高點。

  除了由嚴正化詮釋的變裝術高手之外，還有由宋詩曦飾演的社群經營高手、由方珉妸飾演

  跟嚴正化一起執行詐騙作戰的女兒、由朴號山飾演嚴正化朋友暨犯罪仲介人的優雅大叔、

  孫炳昊飾演擅長透過古董交易牟取暴利的掮客，以及由金才禾飾演的冷血神秘管家。只見

  這群前所未見的高手們相互過招，更讓人好奇嚴正化將在片中如何過關斬將，最終得手

  600億韓圜。尤其常在戲劇中飾演兇狠又嚴肅角色的朴號山，這回竟然逆轉形象，詮釋氣

  質優雅更差點比出蓮花指的大叔，散發出讓人發噱的氣質，也讓嚴正化笑稱：「跟號山見

  面時，就像毫無隔閡的閨密、一輩子都想見到的朋友一樣，以這樣的心情來跟他演出。

  」





  《詐騙女王》在日前的VIP試映會上吸引宋慧喬、華莎、泫雅等人共同參加，尤其名人們

  好評如潮，更讓本片未演先轟動。在戲劇《車貞淑醫生》中飾演嚴正化兒子的宋智浩比讚

  ：「應該會成為今年最棒的電影！」有「韓國瑪丹娜」之稱，近期與嚴正化合作《唱跳歌

  手流浪團》的知名歌手金元萱：「很高興看到美麗的嚴正化的百變樣貌！」歌手草娥說：

  「果然是我非常尊敬的嚴正化前輩！」演員與綜藝人洪真慶表示：「真的太棒了！所有演

  員的搞笑演技真的值得期待！」演員徐孝琳也直呼：「有趣的歡樂電影！」



  這部由《特務搞飛機》嚴正化領銜主演，爆爽娛樂超越《樂透大作戰》的年度犯罪喜劇電

  影《詐騙女王》，即將在本週五（10/20）於全台歡樂獻映。本片劇情描述智慧（嚴正化

  飾演）曾是以華麗騙術為特長的專業騙徒，只是目前有點江郎才盡，打算金盆洗手去作小

  生意。引退之前，她決定接下最後一項可能會改變她人生的任務：引誘古董富豪世家的兒

  子完奎（宋詩曦飾演），並偷走隱藏在他們豪宅地下室裡的巨額財產。她在女兒珠英（方

  珉妸飾演）的幫助下，不僅得先贏得對方家庭的信任，還要對付疑心病重的管家，還有正

  在調查她的年輕警探。智惠與珠英能否找到傳說中的巨額財產，展開嶄新的人生呢？



  欲知本片最新消息，

