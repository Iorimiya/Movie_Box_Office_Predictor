title: '[新聞] 嚴正化變身<詐騙女王>合體方珉妸、宋詩曦'
content: '新聞網址：



  獲譽為「韓國瑪丹娜」，演藝領域橫跨音樂、電影、戲劇、綜藝的全方位喜劇女王嚴正化

  ，繼2000年《特務搞飛機》之後，睽違三年華麗回歸，主演最新犯罪喜劇電影《詐騙女王

  》，即將在10月20日於全台爆笑獻映。這回她化身以華麗變裝騙術為特長的專業騙徒，試

  圖詐騙600億韓圜（約新台幣14億元）巨額財產，更與韓團「Girl''s Day」成員方珉妸（

  已正名，前譯方敏雅、方珉娥）、「演技派男星」宋詩曦（已正名，前譯又譯宋清晨）首

  度合作，透過愉悅的高度默契，為觀眾帶來捧腹爆笑的表演。值得一提的是，出道即將邁

  入31週年的嚴正化，每部作品的間隔並不密集，她坦言自己在等待作品的日子裡，難免會

  感到不安與焦急，但時隔三年終於透過本片再戰大銀幕，她也直呼：「很享受這段等待的

  過程」，並期望觀眾「都能愉悅地觀賞。」





  年度必看犯罪喜劇電影《詐騙女王》，故事描述由嚴正化飾演的「智慧」，曾是一位成功

  又美麗的騙徒，只不過目前有點江郎才盡，打算金盆洗手去作小生意。不過在引退之前，

  她決定去引誘古董富豪世家的兒子，並偷走隱藏在他們豪宅地下室裡的600億韓圜巨額財

  產，打算用這筆錢逆轉母女倆的人生。全片透過宛如超ㄎㄧㄤ版的《神鬼交鋒》（Catch

  Me If You Can）情節，透過詐騙、動作、喜劇、華服等多樣化看點，挑動觀眾捧腹大笑

  的神經。全片不僅將在大銀幕上展現痛快不已的詐騙場面，更將在放聲歡笑的同時，帶來

  驚心動魄的動作場面，讓觀眾在電影結束之前，一刻都無法移開視線。



  值得一提的是，她在片中不僅是江湖上擅於變裝的騙徒，更是一個熱愛女兒的媽媽，而飾

  演她女兒「珠英」的方珉妸，在片中也同時是她的「詐騙搭檔」，更是詐騙界的潛力之星

  ，讓人對這組「詐騙母女檔」的默契產生好奇與期待。嚴正化對此表示：「無需多言，我

  們兩人超合拍！從歌手活動時期就互相認識，雖然拍攝時才是首度見面，但彼此卻有很深

  的理解，所以很快就相處融洽。而且她的演技非常好，很有魅力與品味，所以拍攝起來真

  的很開心。」此外，在片中飾演兩光富二代，更熱愛在自己社群網站上炫富的宋詩曦，也

  即將面臨嚴正化施展「色計」詐騙的威脅。嚴正化對首度合作的宋詩曦大讚：「這個角色

  很適合他，合作起來很開心，特別是他的演技很難被定型，所以每次拍攝時，都期待他會

  呈現出怎樣的演技，觀眾們也將感受到他的全新魅力。」究竟宋詩曦將如何被嚴正化的變

  身所迷惑並洗劫，兩人在這過程中又會發生什麼爆笑的事情，也激起觀眾們的觀賞慾望。





  出道即將邁入31週年的嚴正化，1993年以歌手身份展開演藝活動，並持續以演員身份進行

  演技活動，在兩個領域都到達顛峰。不論是2020年電影《特務搞飛機》，或是近期獲得高

  收視率的人氣戲劇《車貞淑醫生》，都再度證明「喜劇女王」並非浪得虛名。即使這樣，

  表演作品間隔並不密集的她，也透露自己不得不忍受在空窗期等待作品提案的日子：「身

  為演員，在等待作品的過程當中，有時會感到疲憊，也會產生『難道已經到此為止了嗎』

  的恐懼，雖然《車貞淑醫生》受到了很多人的喜愛，很感謝很幸福，但之前因為等待作品

  的時間太長，所以心情只能變得迫切。我真的很想繼續做我喜歡的這份工作，但是我不得

  不等待。現在能夠擁有非常幸福、快樂、充滿希望的等待，真是太好了。」尤其接戲都有

  品質保證的她，時隔三年終於以《詐騙女王》重返大銀幕，嚴正化雖然緊張，卻也享受這

  段等待的過程，她也對觀眾催票：「因為是愉快歡樂的電影，所以希望很多人都能愉悅地

  觀賞。」



  這部由《特務搞飛機》嚴正化領銜主演，爆爽娛樂超越《樂透大作戰》的年度犯罪喜劇電

  影《詐騙女王》，即將在10月20日於全台爆笑獻映。本片劇情描述智慧（嚴正化飾演）曾

  是以華麗騙術為特長的專業騙徒，只是目前有點江郎才盡，打算金盆洗手去作小生意。引

  退之前，她決定接下最後一項可能會改變她人生的任務：引誘古董富豪世家的兒子完奎（

  宋詩曦飾演），並偷走隱藏在他們豪宅地下室裡的巨額財產。她在女兒珠英（方珉妸飾演

  ）的幫助下，不僅得先贏得對方家庭的信任，還要對付疑心病重的管家，還有正在調查她

  的年輕警探。智惠與珠英能否找到傳說中的巨額財產，展開嶄新的人生呢？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



