title: '[新聞] 嚴正化、方珉妸【詐騙女王】當母女喊羞赧'
content: '新聞網址：



  接棒《特務搞飛機》、《樂透大作戰》之後的南韓年度犯罪喜劇《詐騙女王》，即將在10

  月20日於全台爆笑獻映。本片昨日（10/5）在首爾舉辦媒體試映記者會與VIP試映會，導

  演李丞駿率領主要演員嚴正化、方珉妸（已正名，前譯方敏雅、方珉娥）、宋詩曦（已正

  名，前譯又譯宋清晨）、孫炳昊、朴號山、金才禾等人共同出席，也讓睽違三年再度演出

  電影的嚴正化直呼超緊張：「一想到好久沒和觀眾見面，內心就非常激動。」尤其身為「

  票房女王」的她再戰喜劇演出，她也掛保證直呼：「這真的是可以舒服地邊吃爆米花邊看

  的電影！」而方珉妸更為本片花費一個月時間練習攀岩，宋詩曦則師法朋友勤練社群經營

  技術，為的就是要讓自己的角色更盡善盡美。





  嚴正化繼《特務搞飛機》後，睽違三年回歸大銀幕的作品《詐騙女王》，故事描述以華麗

  變裝技術為主要特長的騙徒「智慧」，決定在金盆洗手之前，執行一場600億韓圜的大型

  詐騙計畫。本片昨日在首爾舉辦媒體試映記者會，嚴正化一開始就表示：「經歷疫情之後

  ，電影拍攝機會少了很多，在這種情況下收到劇本，讓我覺得更是一部別具意義的作品。

  因為想要愉快地享受，所以拍攝期間一直和演員們幸福地進行拍攝。」她接著說：「能夠

  上映，我感到非常高興，一想到好久沒和觀眾見面，內心就非常激動。」表達出強勢回歸

  的緊張感。此外，她也對在片中飾演她「騙徒界幼苗」的「女兒」方珉妸讚譽有佳：「見

  到珉妸演員後，自己變成了媽媽，剛開始有些不自在，但在拍攝和練習過程中配合默契，

  感覺自己真的就變成了媽媽，實在很有意思。」



  對此，方珉妸也有些難為情說：「嚴正化演員看起來不像媽媽，就像姐姐一樣，所以讓我

  有點難為情。即使降低我的年齡，我也想和姐姐在一起，雖然剛開始集中注意力需要時間

  ，但她在現場如媽媽一般引導我、照顧我，所以拍攝過程一直很幸福。」表達一起拍攝的

  感想。值得一提的是，方珉妸在片中的角色頗有攀岩天份，為了表現出這項才華，她也花

  費一個月時間進行攀岩訓練，她對此表示：「作為興趣似乎並不容易，尤其想起攀巖選手

  們要練習多久才能到達那個目標，就覺得很佩服。」接著，在片中飾演熱愛在IG上面炫富

  的宋詩曦，本人實際上其實不怎麼經營社群網站，他透露：「不知道什麼時候就沒有在玩

  社群網站了，不過為了準備角色，也看了熟人的網站而做了很多參考。」





  不僅如此，導演跟演員群也賣力為本片催票，嚴正化表示：「這真的是可以舒服地邊吃爆

  米花邊看的電影！」方珉妸則說：「這是適合跟同齡朋友與媽媽一起觀賞的電影。」宋詩

  曦也感嘆：「這是一部在艱難時期當中的喜劇電影，希望大家能多笑一笑。」尤其本片在

  試映結束後，更是獲得媒體一致推崇。《Xportsnews》力讚兩位主要演員：「無法討厭的

  可愛母女登場！」《首爾體育報》驚呼：「比起歡笑更讓人驚訝，比起喜劇更像是動作片

  ！」YouTuber「feeelthemovie」也直呼：「嚴正化和方珉妸母女的默契非常耀眼！」據

  悉，接在之後進行的VIP試映會，也看到歌手華莎、泫雅，以及演員韓多感、朴宣暎、韓

  成敏、蘇雅琳等人相繼出席觀賞，更是為本片增添人氣與話題。



  這部由《特務搞飛機》嚴正化領銜主演，爆爽娛樂超越《樂透大作戰》的年度犯罪喜劇電

  影《詐騙女王》，即將在10月20日於全台爆笑獻映。本片劇情描述智慧（嚴正化飾演）曾

  是以華麗騙術為特長的專業騙徒，只是目前有點江郎才盡，打算金盆洗手去作小生意。引

  退之前，她決定接下最後一項可能會改變她人生的任務：引誘古董富豪世家的兒子完奎（

  宋詩曦飾演），並偷走隱藏在他們豪宅地下室裡的巨額財產。她在女兒珠英（方珉妸飾演

  ）的幫助下，不僅得先贏得對方家庭的信任，還要對付疑心病重的管家，還有正在調查她

  的年輕警探。智惠與珠英能否找到傳說中的巨額財產，展開嶄新的人生呢？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
