title: '[情報] 【劇場版派遣女醫X FINAL】2/21台灣上映 '
content: '情報出處：采昌亞洲電影世界




  我，絕不失敗！


  【劇場版派遣女醫X FINAL】， 2月21日最終完結戲院見！




  ◎ 國民醫療劇金字塔首度電影化，輝煌12週年的集大成最終完結！


  ◎「日本奧斯卡得主」染谷將太 × 綾野剛 ×「浪花男子」西畑大吾全新加盟！


  ◎「兩屆日本奧斯卡影帝」西田敏行，演藝生涯最後謝幕之作！





  當今的日本，白色巨塔已然崩壞，本該是拯救生命的醫療體制，也被迫迎來弱肉強食的時

  代。在陷入危機的日本醫療現場，一群獨來獨往的自由醫生現身了，他們就像獨行俠般，

  不受體制牽絆，就像這位美麗性感的天才外科醫生大門未知子（米倉涼子飾演），她討厭

  成群結黨、討厭權威、討厭束縛，專業醫師執照與扎實養成的醫術，是她唯一的武器。



  這回，大門為了拯救某國總統的生命而離開日本。同時，才華洋溢且精通政商界的神津比

  呂人（染古將太飾演），被任命為東帝大學醫院的新院長；而他的雙胞胎弟弟多可人（染

  古將太分飾），則是一家有資金支持的醫療設備製造商執行長。比呂人徹底合理化醫院改

  革的作風，導致醫護人員紛紛請辭。這時，大門被過往的同事森本（田中圭飾演）找回，

  並與比呂人一拍即合。不過當比呂人見到未知子的恩師神原晶（岸部一德飾演）時卻臉色

  大變。另一方面，森本也前往廣島吳市，試圖一探大門神秘的過去…。



  精彩前導預告



  --'
