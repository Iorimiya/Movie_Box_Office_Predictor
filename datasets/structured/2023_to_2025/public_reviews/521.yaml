  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n本篇無雷，搶0221首映第1天想說拿拿海報，意外發現人好少orz\n\
  \n我去威秀看，用儲值金買完後，給店員看一下就可以拿紀念海報了(到0227都可以)\n\n下午兩點多的場次目測不到10個人看，真心佩服片商願意進XD\n\n派遣女醫陪伴了我12年，終於有個劇場版+完結篇可以好好修補這12年來的回憶\n\
  \n這是很推薦有在追本劇的人去看的，\n\n不論是追過一季或者像我這樣N季反覆當戲說台灣一樣看的重度者都很推薦看，\n\n尤其是重度者，哪怕是出現一瞬間的片段的人事物，\n\
  \n也會讓你想起當年某時某刻的珍貴回憶。\n\n看完帶著滿足的心情出場，有種把這12年補完的感覺XD\n\n青春一輪又過了XD\n\n--\n      的工作\
  \         \n                     是不求小主人的回報   \n           並且\n    輕輕的         \n\
