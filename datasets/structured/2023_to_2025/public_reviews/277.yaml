title: '[微雷] 拿坡里之戀'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《#拿坡里之戀》微雷觀後感：\n\
  罪惡之都、滴水之恩、人情之輕\n\n從表面市儈的人際關係，看到背後代表的人文歷史。退伍老兵到罪惡之都拿波里找失散的\n兒子，近乎身無分文的他們，能給的都是滴水之恩。\n\
  \n在不斷交換資源的過程，看見他們對美國的美好想像，也更了解彼此的生活。\n\n跨文化、語言的距離看似拉近，最難測的還是人心。這裡不是人情味重的臺灣，是物資稀\n\
  缺、龍蛇混雜的都市。只有看到最後，才能明白每個相遇、每個付出的重量。\n\n非常大人、適合配酒的電影。\n\n–\n脆：\nIG：Fishpond_like \n\
  臉書：魚池 FishPond \n個人網站：\n\n--"
