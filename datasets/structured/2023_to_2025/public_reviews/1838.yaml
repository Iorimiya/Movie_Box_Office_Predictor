url: https://www.ptt.cc/bbs/movie/M.1675385358.A.F90.html
title: '[負雷]敲敲門 '
content: '昨天承蒙公關公司招待，

  (我是幸運抽中的鄉民)

  久違地去電影院看了"敲敲門"的特映會，

  原本以為會是個很好的觀影體驗，

  可是看完後心裡只有一句感言--我他媽的到底是看了什麼?

  以下有劇透，

  請移駕到分隔線下去看:



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  首先，這部電影不是沒有優點。

  (一定要先說這句，不然我怕公關公司會QQ)

  奈沙馬蘭導演很一貫地呈現出他擅長的驚悚嫌疑氣氛，

  一步一步帶領讓觀影者進入劇情當中。

  尤其是那四個"神經病"企圖入侵房子那一剎那，

  更加扣人心弦。

  但之後悲劇就來了，

  主角是一對同志情侶就罷了，

  去孤兒院領養個華裔(應該是)身體有缺陷(兔唇)的小女嬰也很合理，

  怪就怪在中間還要穿插男2(應該是受)父母不認同他們關係的畫面，

  讓人忽然有種回到20年前，

  李安導拍攝的"飲食男女"或是"斷背山"那時候的年代背景。

  其實這也不是不行，

  也許他們所處的州民風就是比較保守也說不定。

  重點來了，

  那四個"天啟四騎士"的角色設定完全讓人感到莫名其妙，

  對於會挑選上他們一家人的原因更讓人無法接受。

  或許當事情一扯上宗教，就別想談什麼邏輯跟道理了，

  但對現代人來說，

  才不管什麼犧牲、奉獻的概念，

  把這個鍋硬砸到人的身上，

  基本上誰都是不服的，

  所以對於男2最後的選擇犧牲奉獻，

  原則上我也就相對無感，

  更何況最後男1帶著溫(劇中女兒角色)開車離開，

  也沒看出他們內心對男2的不捨與難過，

  (喂~你們還記得死的那個是你發誓要永遠在一起的伴侶，

  和最疼愛妳的爸爸嗎?)

  綜觀一整齣戲下來，

  我看不出編劇或是導演想要表達什麼，

  只能帶著滿滿的遺憾(傷害)離場。

  重點是奈沙馬蘭導演擅長的結局神反轉，

  在這齣戲裡完全沒有出現。


  如果，如果結尾可以改成這樣的話，

  那我想是不是會更好看一點:

  (以下是我自己作夢夢到的)


  其實這一切都是兩個男主暗中策劃的復仇，

  連新聞影片也都是找人假造的。

  男主1:人權律師，被男配1(榮恩所演)攻擊重傷。

  男主2:跟男主1到達醫院急診時，兩人同性伴侶的關係被女配1(黑人)歧視。

  男配2:溫學校不同年級的老師，戀童癖，暗中偷拍許多溫的照片被兩個男主發現。

  女配2:其兒子霸凌過溫。

  男主1傷重痊癒後，

  查到幾個配角都有上網找心理醫生諮詢的習慣，

  便賄賂醫生給他們下催眠暗示。

  當他們同時看到某特定新聞畫面的時候，

  就會引發他們的幻覺，進而啟動了一連串事件的發生。


  而故事最後所有配角都死光了，

  男主1才帶著溫去車上，

  假死的男2這才出現跟他們同車離去。

  -END-


  再說，

  上次看過的那場電影試映會是"迷霧驚魂"

  只能說兩者差別太大了......



  --'
