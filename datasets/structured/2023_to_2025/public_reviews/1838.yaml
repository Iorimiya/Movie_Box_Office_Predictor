url: https://www.ptt.cc/bbs/movie/M.1675529009.A.DE1.html
title: '[普雷] 敲敲門心得'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  我個人還算蠻喜歡奈沙馬蘭過去的作品，所以看到電影資訊後就去看了預告片。

  雖然預告片呈現出來的故事內容似乎稱不上非常有趣，不過這種故事還是會讓人想一探究

  竟。所以即使我已經知道這部片評價兩極，還是買票進場了。


  這部片的觀影過程是場很特殊的體驗，我就像那家人一樣手足無措。令人意外的，這部片

  沒有太多的鋪陳，很快的切入了故事核心，並開始慢慢抽絲剝繭。全程的末知與恐懼讓我

  像是被緊緊掐住神經不放。


  整部電影透過背景音樂的鋪陳，使得故事內容以及一家三口的決定都變得更加懸疑緊張，

  也使得觀眾更能夠進入電影的情節中。情節也結合了很多不同的議題，是部耐人尋味的電

  影。


  結論，這部真的不是爽片，請不要帶著看完會很爽的想法去買票。不過如果是喜歡動腦、

  議題思考或是單純對這種故事有興趣的朋友，我還是蠻推薦你可以去看，可以試著對劇中

  的靈魂拷問大難題作答，是你的話你會怎麼做？




  --'
