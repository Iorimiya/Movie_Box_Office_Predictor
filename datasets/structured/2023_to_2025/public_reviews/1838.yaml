title: '[好雷] 敲敲門'
content: '防雷


































  一直在期待反轉


  不過沒有


  但導演真的很會說故事


  你就是會想看下去


  一開始的他們是誰？


  慢慢的解答又給你更多疑問


  他們要幹嘛？


  他們說的是真的嗎？


  戴頭套又很恐懼是我想的那樣嗎？


  下一個是誰？


  他們到底是不是神經病？


  究竟哪一邊的人才是神經病？


  真的是整人報復嗎？


  一直到最後的他們會不會犧牲？誰會犧牲？跟怎麼面對結果？


  不知不覺就看完整部片


  雖然期待的反轉跟發現事實後發瘋的情節沒出現有點小失望


  但整體來說是個殺時間的好片


