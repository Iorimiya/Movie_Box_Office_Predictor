url: https://www.ptt.cc/bbs/movie/M.1675442235.A.6C2.html
title: '[重雷] 敲敲門重雷心得'
content: '以下有雷



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  當看到電影預告時，其實很難立即在腦中形塑出該片想表達的訊息，說是驚悚類卻沒有明

  顯的恐怖橋段及素材，反而因為沒有流露出任何劇情提示和端倪，讓人陷入沈思；同性戀

  家庭的設定要如何與驚悚題材結合並顯露其意涵也令人好奇。


  常常覺得最能讓人心靈顫抖的場景往往不是聲勢浩大、氣勢磅礴的戰爭場面，也非華麗絢

  爛的武打特技，而是讓所有情緒被壓縮在一個小空間中累積、昇華。《敲敲門》運用狹小

  空間讓觀看者將注意力聚焦於角色的表情變換及情緒，也因此給觀看者餘力去思考，將自

  己代入情節與角色同步陷入兩難和焦慮。


  看完這部電影後個人覺得有兩個面向可以討論：

  第一是關於以同性戀家庭為主角之用意，「深愛世人」的箴言，是沐浴信徒的光，同時也

  是懲戒同性戀者的荊棘，該片巧妙運用寓言故事和旁敲側擊的方式暗諷對大喊神愛世人，

  卻欺壓同性戀者的宗教份子。天啟四騎士則象徵宗教在信眾心中的定義：是引導者，是慰

  藉人民的庇護所，卻也是歧視的代名詞；也因此在片中四騎士彷彿在教化、感化的說服橋

  段，更呈現了宗教黑暗面的排他性。


  再來則是對生命重量及大愛定義的探討，個人一直都覺得人的自私是天性，而無義務要拯

  救眾人展現「大愛」，而願意自我犧牲的人想必他也為了達成某種自我實現才做出行動。

  雖這個無解之題在我思想中已有定見，但導演在短短100分鐘內將人性的焦灼以各種手法

  表露無遺，讓一個小小的木屋承載了全片的情緒重量及深刻的哲學問題，讓人相當佩服。


  這是一部結合探討現實面宗教議題、虛幻無解的哲學問題，也突破同志戀情主題只能於性

  、愛題材發揮的刻板印象的作品，值得大家觀賞並回味思考。


  --'
