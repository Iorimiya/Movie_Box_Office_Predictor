url: https://www.ptt.cc/bbs/movie/M.1479225420.A.E53.html
title: '[ 好雷] 怪物敲敲門，堅韌面對生活殘'
content: "圖文版請點入\n\n\n     看到片名想說是什麼怪力亂神的電影，看完電影才發現是溫馨感人，是一個關於離\n別與放下的故事，全片沒有說的一個愛字卻讓我感到滿滿的親情，父子母子還有隔代的外\n\
  婆也是，可怕的樹人加上治療成長的童話故事意外的深刻動容，地表最強老爸搖身一變成\n了巨大卻讓人勇敢的樹人，樹人不是可怕的代表而說出了三個故事讓小男孩面對人生面對\n\
  家庭的支離破碎和同儕的霸凌排擠，在最後一個故事由小男孩自己說出來誠實面對心中所\n想，一段包裹著樹人與寓意童話成長治療離別放下而面對生活的故事。找資料時。\n\n\
  \n     J.A. Bayona的電影原來我都有看，而且都很喜歡，靈異孤兒院，浩劫奇蹟包裹著災\n難片與驚悚片卻都是溫興趕人的親情，看到是滿滿的情卻又不灑狗血的呈現，導演接下來\n\
  侏儸紀世界2看似商業片不知道又會發展成什麼樣，令人期待。\n\n\n\n\n\n{以下開始打雷，不想皮皮銼別往下拉了嘿}\n\n\n\n故事的寓意:\n   \
  \  片中樹人所說的三段故事，第一個是因為國王死亡後被迫長大面對國家的王子，女\n巫後母掌權王子篡位害死了心愛女人的故事，沒有害人的女巫，不擇手段的王子，說明著\n\
  沒有絕對的好壞，奶奶看似毫不在乎想逼著小男孩搬去與奶奶同住，其實奶奶只是被現實\n壓迫堅強部人前流淚的女強人。第二個故事是新世代教會神父傳道排斥傳統巫醫，最後神\n\
  父因家人怪病纏身低頭失去信仰也換不回家人性命的故事，表示相信是一種信仰，但終究\n生命會離去。第三段故事出現在學校被同學霸凌後，隱形人不再隱形霸凌鍾就被反擊，一\n\
  反擊嚇得惡同學連學校都不敢來。\n\n\n\n     而第四故事樹人強迫小男孩自己說出來關於小男孩自己的故事，強迫面對自己與現\n實，實話一直都在心中深處只是相不相信而已，母親的離去，學校的霸凌，父母的離異，\n\
  生活一團糟充滿生離死別，但這就是生活累的時候休息片刻睡一下，再怎麼辛苦也是一樣\n。\n\n\n\n摧毀與復原:\n     砸爛摧毀破碎後再重新建立，人生往往也是如此，隨著樹人出現壯大心胸的小男孩\n\
  狠狠砸爛了奶奶客廳就像心中崩壞的樣子不再壓抑，雜亂的瘋狂後整裡客廳像是整理自己\n的內心，發洩過後的思緒又會意外的發現從來沒發現得自己，規規矩矩有條有理的奶奶看\n\
  到慘狀後沒處罰而是正視了孩子內心紊亂也象徵奶奶自己內心崩壞而逼自己面對女兒的疾\n病而重新整理自己內心利用一場破壞重建的祖孫的內心，而奶奶那複雜而痛苦壓抑的淚水\n\
  異形蕾普莉的那一個表情我真的很難忘記超級深刻。\n\n\n\n夢境與真實:\n     一直出現的教堂崩塌母親掉下地洞而救不回母親的夢境，說明母親終究會因為疾病\n\
  過世，小男孩不願放下讓母親安心離開，男孩心中一直知道的事實只是不願面對；電影的\n超美畫面，超威猛的鏡頭與轉場，樹人說的故事中畫面水墨水彩的畫風，穿梭真實與虛幻\n\
  的場景，帶出生活說不出的實話，正視內心真正的想法，電影的最後友說明了樹人與母親\n與小男孩的連結，原來樹人是媽媽的禮物。看著小男孩的故事，其實也認清每個人生活與\n\
  真實自己的故事，不要壓抑逃避勇於面對吧。\n\n\n\n一定要誇讚一下電影的轉場鏡頭，真的很厲害有創意，記得上一次讓我驚豔的轉場鏡頭是\n在羊男的迷宮，不過也真的挑戰演技，小男孩Lewis\
  \ MacDougall，康納的母親Felicity，\n還有異形雷普利的Sigourney Weaver演出都非常感人演技超群，這一部真的是意外中好看\n的電影。超級推薦\n\
  \n母親說著:「如果以後你因為自己這時候沒說話而內疚，媽媽會原諒你，不要內疚」\n這句台詞該是這陣子最印象深刻的一句話了。\n\n\n每個藝術家都有一個樹人伙伴。\n\
  \n--"
