url: https://www.ptt.cc/bbs/movie/M.1675322285.A.D0C.html
title: '[好雷] 敲敲門特映場心得'
content: '剛看完媒體特映場，忍不住上來抒發一下。


  坦白說，預告剪得太好了，幾乎全劇透了......


  但是或許我個人情感因素，我是真的把自己帶入了主角的世界裡，我可以感受到類似於主角

  的心情波動，所以我給這片好雷評價！


  但我想爛蕃茄應該會讓導演爛片清單再+1吧？哈哈！


  雷文防雷資訊頁





















  本片最大的雷，就是沒有導演擅長的「神反轉」，如果你一定要說有，那我會懷疑導演是不

  是江郎才盡了？這樣的轉折怎麼能讓人相信這是「靈異第六感」導演的作品？（反正導演近

  幾年的作品影評向爛片傾斜的很嚴重）


  不過本片的人文情感要素倒是比前幾部要「接地氣」一些，也就是更接近真實人生，不再刻

  意賣弄懸疑，回歸到「說完一個故事」的正軌。


  然而，本片依然有著導演極強的個人特色，請拋棄所有邏輯和合理性再進入戲院吧！


  最後一提，榮恩真的是亮點！


  哈利波特三小強只有他走出了陰影，有著讓人耳目一新的感覺（另外兩個應該是重大創傷走

  不出來），演的篇幅不算長但非常讓人驚艷！



  --'
