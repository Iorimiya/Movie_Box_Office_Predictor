url: https://www.ptt.cc/bbs/movie/M.1702556553.A.61D.html
title: '[普雷] 敲敲門'
content: '電影海報：



  【敲敲門】是奈沙馬蘭2023年執導的懸疑片，劇情講述一個家庭正在度假。四名陌生人來

  到他們所在的樹屋，要求他們做出艱難的選擇以阻止世界末日。



  無論喜不喜歡奈沙馬蘭，不得不承認他能夠把電影包裝得很吸引人，他的片子只要讀完劇

  情大綱就會讓我提起興趣，加上【靈異第六感】、【驚心動魄】、【靈異象限】都有打動

  我，就理所當然地成為他的鐵粉。即便他後來幾部連續失利，差點把自己的導演生涯搞掉

  ，是靠後來幾部小品驚悚片才稍微翻身，但我還是有持續關注他的作品。


  -


  這次【敲敲門】是他拿手的驚悚片，卻也很不像他的電影。它沒有【詭老】、【拜訪】的

  獵奇片段，也沒有他最招牌的劇情大反轉，就是一步步把劇情推到高點後就收尾結束，非

  常單純的小品懸疑片。片長100分鐘，去掉後面跑字幕大概只有90-95分鐘，以節奏來說也

  算快，開頭巴蒂斯塔跟小女孩的戲很有張力，而且他們對話完之後故事就直接切入主題。

  除了穿插的回憶片段以外，基本上劇情就一路衝到結尾，順順的就看完了。以過去曾經把

  自己的風格玩過頭的導演來說，這部能這麼收斂，我覺得也是另類的進步XD連他的客串角

  色也是歷年來最短之一（電視裡介紹氣炸鍋的主持人）。


  -


  演員方面，戴夫巴蒂斯塔是我目前最愛的摔角演員，沒有之一。他基本上允文允武，而且

  以他突出的外表與背景，能演好各種角色真是不容易。他在這部飾演小學老師，有詮釋出

  為人師長該有的溫柔與可靠，再對比他進行的任務，更凸顯他的悲傷宿命，是我整部最喜

  歡的角色。其他演員表現就中規中矩，演得都不錯但沒到驚艷。




  啊，其實整部就也中規中矩啦XD不會說它爛，但在這個串流當道的年代，應該很多人都會

  把它歸類在下檔後再看的電影。加上期待有大反轉的人應該會很失望，畢竟大家胃口也都

  被養大，什麼峰迴路轉的故事都看過了。除非這部片走出末日跟四人共謀以外的劇情，不

  然驚悚片迷是不會滿意的XD


  但如果純粹以看【黑鏡】、【陰陽魔界】的心態來看，就覺得不差啦，就是高概念的短篇

  故事，起承轉合也都有做到，個人覺得也比最近Netflix推出類似性質的【斷訊】來得簡

  而有力，各位有興趣還是能找來看看。

  -


  然後多產的奈沙馬蘭不只2024年又會推出作品【Trap】，他的女兒明年也要推出第一部長

  片【The Watchers】了。粉絲們明年可以期待一下XD


  他跟女兒的照片：



  --'
