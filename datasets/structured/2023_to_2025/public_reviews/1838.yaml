  駭客4反派最知名的角色應該是影集-破案神探的男主角\n謝謝提醒，已更新。\n感謝，已補上。\n我個人最愛驚心動魄跟靈異象限XD\n而且我覺得他早期拍的中小成本反而故事格局更大。"
