url: https://www.ptt.cc/bbs/movie/M.1675673365.A.6B3.html
title: '[討論] R:敲敲門 (建議無神論者不要觀賞)'
content: '首先對無神論者來說這是一部科幻片，如果你沒信仰又無法把背景設定當成架空世界，我

  建議你不要花冤枉錢，去電影院當M自虐。對信神者來說這是一部警世預言、懸疑故事性

  質的電影。總之它絕對不是恐怖片，這不是編導的問題，硬要說這是分類的傳播媒介理解

  錯誤。


  對於期待末日浩大場面的人，我建議再看一次2012比較實際，因為電影著重在描寫人心與

  面對命運的無力感，對能接受背設的人來說，很容易帶入角色心理，能夠體會其中的掙扎

  點。


  再來為何選擇這個家庭？其實就是命運而已，這也是電影小說的主軸想強調的，這個問題

  信者恆信。


  最後為何選同性戀家庭？


  1.我不是同性戀，但儘管近年在檯面上LGBTQ接受度更多了，我依然認為當我能選擇時，

  我會選擇共同點更多的異性戀，而不是同性戀當朋友。我也懷疑有父母相當"期待"子女是

  同性戀。


  2.四騎士都是異性戀，從片頭他們不斷強調自己沒有歧視，而非表明自己也是LGBTQ可以

  看出來。預告中雷納與溫以陌生人的身份握手也象徵壓迫者與被壓迫者的理解甚至和解。

  壓迫者請求被壓迫者的信賴也是關於犧牲與原諒這個主軸的重點。


  3.被壓迫者願意"原諒"壓迫者，這是犧牲中最重要的部分，如果是白人核心家庭就沒有原

  諒的問題了。(儘管近年有不少影劇都有為LGBTQ、亞裔與黑人、女權發聲，但我仍認為白

  人男性才是最強勢的一群人。)


  4.為什麼選同性戀與異性戀的對比，而非種族的對比？因為歷史上多數種族都曾壓迫過其

  它種族，也曾被壓迫過(日耳曼大遷徙、美國黑人對亞裔、華人對少數民族)。


  另外，關於預告是否全劇透的問題，我真的不了解怎麼有觀眾會把這當成批評的點？畢竟

  看電影一定是重視過程勝於結果，如果只想知道結果網路上一堆重雷心得和濃縮講解，何

  必買票進場呢？九成諜報片、尋寶竊盜片、漫改也猜得到結果啊～我印象中只有丹尼爾的

  007死掉而已。



  --'
