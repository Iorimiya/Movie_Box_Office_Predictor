url: https://www.ptt.cc/bbs/movie/M.1675787613.A.E31.html
title: '[好雷] 見證地獄版的聖經故事 - 敲敲門'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  一開始先從雷納一行人在門外說：

  「這是歷史最重要的一天」


  而男主角們回應：

  「見證耶和華的日子？」來揭開序幕。


  這部電影就是個災難版本的神蹟見證電影

  四個神蹟見證人要來說服人相信（傳教）

  只要信了，罪孽能被洗清、人類得以存活

  如果他們不信，就會迎來世界末日


  整部電影有幾個重要象徵


  同性戀情侶：一個象徵無神論者、一個象徵最終見證神蹟而相信的人


  天啓四人：耶穌出生前的指引星、牧羊人、像是神跡見證者、想讓別人也相信神、傳教者


  1. 雷納一開始跟溫在外面抓蚱蜢，

  要把蚱蜢放進瓶子時有說「不要驚動他們」

  雷納的本意也是不想驚嚇這家人，

  像他溫柔地對待蚱蜢一樣，原本也不想破門而入


  2. 假名、預錄節目

  為什麼電影要有「中間被無神論者不斷質疑，說一切都是預謀好的」的這段？


  這部分是代表就像聖經一樣，

  聖經也會被無神論者不斷質疑、抓小辮子

  若是live直播節目、可信度100%的話，

  他們應該會更快相信這一切，

  但偏偏是可信度稍微可以質疑的事，

  不相信的人當然會抓著辮子死打


  為什麼要使用假名？

  如果使用真名會對他們的「傳教」不利

  會被覺得是針對他們、並非真實神蹟

  即使一切是巧合，也容易被抓住小辮子


  但其他人都是用真名說真實背景

  因為他們也都是有血有肉的人

  除了聽起來有真實感、容易說服人以外，也容易操控人


  3. 無私 V.S. 有私的愛

  有點像是電車難題，有點像是駭客任務提到的（最後尼歐決定救自己的愛人而非全人類）


  我們畢竟是人，

  是人就無法像神一樣無私的愛願被釘在十字架上

  雷納提到他們不能殺他們、也不能幫他們選

  這一切都要他們自己去相信，然後選擇犧牲

  最後有人被犧牲了，災難也停止了


  4. 「難道都是巧合嗎？」

  最後有一個人開始相信了，

  並且說服對方這一切不是巧合


  這段讓我想到創造論與進化論

  進化論主張地球和生命的生成是因為天時地利人和（巧合）

  創造論則是覺得神創造人類、這一切不是巧合


  4. 結局

  我有點在期待結局會像迷霧驚魂那樣

  犧牲後發現其實全部都是假的、或是政府想出了對策

  讓角色們絕望到極點，

  也可以看出宗教是如何操控人的


  但最後的結局代表，見證了、信了、犧牲了，災難終止、人類不受到懲罰


  5.兩個人在暫停播放車上的歌代表父女的心境變化


  一開始爸爸先打開收音機聽到這首歌就馬上關掉

  這時他還無法接受剛剛發生的一切


  溫打開了又關掉

  溫想試著忘記剛剛的一切回歸正常生活的心，

  但又顧慮著爸爸的心情感受


  爸爸又小心翼翼地打開

  代表他決定試著忘記剛剛到一切

  兩人上路，跟溫回歸正常生活



  心得：

  這部我原本以為是像「柯洛佛地窖」那種緊張懸疑的末日電影

  但一直聽到「難道一切都是巧合嗎？」

  才發現原來這部是個地獄版見證神蹟的電影

  電影後半部也怕觀眾看不懂，

  直接提出天啓者與四人象徵的意義


  至於為什麼天啓者會看到異象

  電影中沒有解釋


  但我可以自己腦補像是康斯坦丁驅魔神探

  上帝跟魔鬼拿全人類打賭


  如果他們最後信了、犧牲了，世界就得救 XD


  覺得這部很適合在電影院看

  家裡看的話可能會看不懂XD




  --

  我改個標題好了'
