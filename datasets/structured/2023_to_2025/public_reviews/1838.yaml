title: '[負雷] 《敲敲門》'
content: '簡單說


  以驚悚片來說，驚悚程度是有的，也有一點

  血腥，有《靈異象限》的味道，但靈異象限

  好看太多，期待的榮恩也沒太多戲份。


  天啟四騎士為主要概念，劇情沒有甚麼奈沙

  馬蘭擅長的反轉劇情，所以沒有什麼讓人驚

  艷或驚喜的劇情，許多幕有大表情特寫，是有

  將壓迫感表現出來，但也就這樣而已。


  個人覺得不會列入奈沙馬蘭的經典好片中，

  甚至會歸於普通甚至爛片行列。


  最後劇中的同志設定及劇情發展，就看看會

  不會有政治正確的聲音出來....





