url: https://www.ptt.cc/bbs/movie/M.1675347937.A.A26.html
title: '[ 好雷] _敲敲門_特映會心得'
content: '小的有幸抽到特映會，上來分享一下心得


  首先先說自己是喜歡這部片子的，不會太拖沓，有了之前看奈導幾部作品的經驗，大概都

  有個底在。 雖然有在發摟他的人都知道，他的片是這部好，下部就會壞XD


  上一部詭老則是評價兩極，所以這次原本就是抱著不要太糟糕就好的心態來觀賞的。



  以下有雷


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  老實說這部看完預告大概就知道87趴的劇情了，只是還是想知道他要怎麼把一群說著幹話

  闖進人家渡假小屋的神經病德行為合理化。


  一群有著宗教狂熱的份子強迫你觀賞集體自殺秀，還把他們的死怪罪在你身上…..

  兩個字

  有病


  個人覺得奈導這次選擇同志伴侶來被審判實在是很敢XD  可以想像之後一定會有一堆謾罵

  的聲音～

  但Dave Bautista 的角色一上來就跟你說

  沒有喔，我們決不是帶有偏見或任何歧視的色彩找上你們的


  像Dave 一樣的彪形大漢在外面敲門，說我們只是想談談，是你你會開嗎？

  我是不會開啦～


  嚇都嚇死了好嗎～

  雖然裡面他是最反差的角色就是了


  榮恩則是一開場就領便當了，沒有太多發揮的空間，所以期待他表現的人可能要失望了


  黑人女演起來的角色歇斯底里，站在旁邊跟白人女左右護法的感覺讓我聯想到Us （我們

  ）


  奈導果不其然還是喜歡客串～ 我想應該非常的好認


  女友則是看到尾，幹到尾～覺得既然都被選中了，那我就是沒那麼偉大呀，我不想選擇

  咬我啊



  結尾沒有太大的反轉

  大概就是讓你猜患有同溫層「Echo Chamber」症候群的神經病們所言是真是假～


  結果是真的

  好

  沒了～



  不對！

  What?!


  所以從頭到尾覺得他們是神經病的我們才是神經病嗎？



  雖然吐槽點很多，但奈導在這部節奏的掌握還算不錯， 本來抱著下班可能睡死的心情卻

  沒有睡著～ 一小時40分鐘的片長不長不短，剛剛好。

  如果抱著雷片來看的人應該也不會覺得太浪費時間


  以上

  #


  丟下我自己去享受的人類們



  --'
