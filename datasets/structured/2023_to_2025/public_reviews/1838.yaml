url: https://www.ptt.cc/bbs/movie/M.1680507623.A.163.html
title: 'Re: [普雷] 《敲敲門》激發腦補，想找人討論~'
content: '抱歉原文吃光光

  這部有點時間了，查看討論串.這篇是最近的文.就借用回。

  前幾天因狒狒事件有稍微關聯提到[移除外來種]。想到一些人類為環保的[生物防制]手段

  。才忽然再閃過這片。

  想「神說要有光」於是就有了。但要滅世卻得一波波降禍.而不是念頭一起就寂靜了。

  簡直像祇要一對、甚至有時是一隻強勢外來種逸逃，生衍眾多後續要防制移除就得招式用

  盡，還不一定能成功。

  (這樣的[(動)物人關係]與故事中的[人神關係]頗有相似)

  總之，讓我想起這部電影。


  也才又想為什當時覺得雖不難看.但也就這樣，看過後心裡也沒留下什麼餘韻.就只是休閒

  消遣片。(不像[迷霧驚魂]確實因結尾留進心裡。)

  但真的就非得要有反轉、缺的就是神反轉嗎?我覺得倒也不盡然。迷霧驚魂本來就是迷霧-

  是未知、不明，所以嚴格來說也不必算是反轉。而這片不大一樣，是信與不信。最後(若

  是)信了，就還面臨"選擇"。

  我個人認為本片強度弱在選擇的難度不夠。比如若要求指定的犧牲是小女孩.會有大大的

  不同。

  片尾車上父女遺憾、失落.但很容易得到自我安慰、救贖，甚至對求仁得仁的他.還能頗有

  光榮感-畢竟是拯救了全 世 界啊。相同狀況.若是被要求親手將幼女俸上，(即使神蹟千

  真萬確)才真是困境吧。這樣不會有自我犧牲的榮光，還會有信不信的兩男衝突，而且做

  不做都必有無盡的罪責感。


  但只怕很難編劇就是了。


  --'
