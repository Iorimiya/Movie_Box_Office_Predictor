url: https://www.ptt.cc/bbs/movie/M.1675445754.A.2F1.html
title: '[好無雷] 敲敲門 - 重溫奈沙馬蘭的氛圍'
content: '《#敲敲門》7/10分


  ：重溫奈沙馬蘭的氛圍


  -


  奈沙馬蘭所有的片都是親自編劇的

  也難怪總能有各種意想不到的題材出現

  而且還很對我的胃

  　

  小時候看七龍珠

  總幻想著「精神時光部屋」如果是真的會怎麼樣？

  砰！

  《詭老》來了


  久久才見到面的外公外婆平常到底都在幹嘛？

  砰！

  《探訪》來了


  如果有人跑來跟你說要世界末日了，你信還是不信？

  砰！

  這次的《敲敲門》來了！


  -


  這些都是讓我一聽到 就會想一探究竟的故事

  所以即使奈沙馬蘭評價兩極

  還是可以讓我買票進場


  而這次的《敲敲門》沒有太多的鋪陳

  很快就切入故事核心 並開始慢慢抽絲剝繭

  一切到底是真是假？

  即使中間可能有一點點小拖

  但對於真相的好奇心還是壓過了這些小缺陷

  一邊看一邊猜測著到底是怎麼一回事

  隨著劇情 也會持續有線索或是新的橋段推動故事進展

  雖然不到緊湊 但也稱得上引人入勝


  -


  另外值得一提的是

  本片的攝影下了許多巧思

  不論是在構圖或是運鏡上

  都有許多充滿風格的畫面出現

  甚至有如大衛芬奇般的精準流暢運鏡

  即使劇情不合你的意

  每個畫面也是讓人賞心悅目


  -


  結論

  如果你要一部高潮迭起的片

  你會失望

  但若是這個題材是你有興趣的

  而且喜歡一步步看著事情怎麼發展的話


  《敲敲門》

  推薦給你



  --


  無雷 電影/影集短評IG：




  --'
