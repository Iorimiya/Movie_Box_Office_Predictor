url: https://www.ptt.cc/bbs/movie/M.1676101491.A.F6A.html
title: '[普雷]《敲敲門》激發腦補，想找人討論一下'
content: '先打個預防針~~不是推坑文


  朋友看完說很想找人討論，我去看後也是降。

  看了幾種版本的解析，都很有意思，

  沒有對不對，畢竟沒解釋的空間太大了。


  本篇就是我腦補，

  請有看過電影、真的想討論的大大再往下滑囉~





  ---防雷---





  我個人接收到這部電影的兩個核心：

  、


  劇情不太重要、僅是為了展現這兩個核心所堆出來。




  有一種“行為接觸”，不是張牙舞爪的惡意但也非善意，讓你有了警覺或不適，卻又會覺

  得「自己不該反應過度」。

  類似一種....微妙的界線侵犯”，就像敲門一樣，先知會、有禮貌的表示要進(侵)入了，

  但又由不得你拒絕。


  如果你拒絕了會有人因此不悅、甚至受到傷害。


  從情緒勒索到天災，只是表現戲劇張力的棋子，操弄棋子的人....導演奈沙馬蘭，試圖描

  繪一種之間的關係。


  天啟四人、神與宗教、房東與恐怖情人。

  They都象徵某種「帶來壓迫的群體」。


  同志伴侶、亞裔又裂唇的女性、被情勒的人。

  We都是象徵「被壓迫的群體」。


  在刻意友善與聲明的背後，隱藏動機是"我們不壞，所以你別反抗"。開門後有可能只是小

  風浪，也可能是大情勒。


  聽聞過


  《我的鯨魚老爸》裡面有個傳道士

  很想用自己的信仰去拯救(影響)別人。


  種族歧視者會說他們沒有排擠他人、

  只是有權利選擇要跟誰交朋友。


  過往曾有報導，基督教會要求母親

  帶同性戀的兒子接受治療。


  有如


  神降天災懲罰世人、宗教壓迫同性戀、

  白種人歧視黑人、西方歧視亞洲人、網美歧視醜....



  在法治社會規範下，大家行為收斂了些，不是持槍破門只是敲門。

  即使你已經很退讓很被動，如主角三人遠離世俗眼光躲入秘境那般。他們依然會找到你、

  告訴你得為了別人做犧牲。




  。

  「軟侵犯」是「洗腦」的開端，讓對方沒有及時逃跑或反擊。久而久之，弱勢的群體「漸

  進地」喪失了原先的理性思維，自我意識萎縮，開始合理化外界的一些現象。


  。






  表結局：


  兩位男主安德魯、艾瑞克最後竟在電閃雷鳴、風雨交加之下妥協，做了犧牲。

  在艾瑞克犧牲後不久，安德魯從新聞得知一小時前一切災害平息。


  確定是他們拯救了世界？？

  導演諷刺地讓一對同志伴侶的愛換得世界和平、讓深愛的女兒延續在完整世界。真的是末

  日要來嗎？

  神要這個家庭做出犧牲嗎？


  裡結局：


  天啟四禁錮同志家庭，但他們真的沒有針對。

  片頭兩個人抓捕蚱蜢，應該也不是針對。


  整部電影透露出來的諸多訊息都：


  是否針對同志家庭、

  到底雷蒙德是不是他們被追蹤的起因、

  災禍成因是不是倒果為因、

  艾瑞克是腦震盪出現幻覺嗎、

  到底光裡面有沒有人、

  犧牲拯救世界究竟是不是真的還是巧合？







  所以對我而言是有點反轉的：


  就是當我相信有世界末日，到結尾一切平息後發現不太對勁....





  以下是質疑：

  -沒有證據證明：是無人犧牲才導致災難持續

  -災難早在第一位入侵者死亡前就已發生

  -主角犧牲跟停止異象並無驗證關聯

  -有異象不等於一定走向世界末日

  -四位天啟真有其人，有講真話不代表沒病



  藉由雷納與安德魯的對話有兩種可能：


  天啟正確：一切都是真的，有末日有天災、有那四位真人。


  質疑正確：、撞到頭開始產生幻覺、充滿

  惡意的雷蒙德就是來報復、這些人就是針對同志伴侶。



  以下是對真相的猜測：

  -天啟四就是因為發現同志伴侶才追來

  -

  -神驅使天啟去拆解同志家庭並自我犧牲，才解除神罰


  有鑑於導演奈沙馬蘭擅長在超現實的浮誇設定中置入邏輯，看他的電影僅接收邏輯就好，

  無需顧慮寫實與否。


  我是先跟著艾瑞克一起被洗腦了，

  但聽了車內撥放的音樂產生α波、

  冷靜下來後回復原有的思考能力，

  發現這一切根本荒謬無言，

  如同存活下來的那兩人那般無言。



  總而言之：

  【真相根本難辨、何來拯救世界一說？】



  ---後記---


  這部電影看時有點不舒服，

  除了跟主角三人組一起被情勒以外，導演刻意用極近的特寫，讓許多對話鏡頭幾乎塞滿了

  某張臉。侵犯與壓迫感不只是呈現在敲門，靠太近也是。


  特別是巴帝斯塔的臉靠鏡頭這麼近時忍不住想後退，彷彿他鬍渣都要刺到人了= =

  能夠明白導演會選他、而不是甜茶那類外表的原因。




  另外就是雙方無法確實溝通、無法針對問題

  好好回應那種隔閡感。你說你的我講我的。我們在對話但不是溝通。


  實在是非常吃電波的電影，




  奈沙馬蘭的電影以往會有反轉，《敲敲門》是否有反轉？

  恐怕不在劇情中明示，而是在觀眾看完後在內心怎麼琢磨那股惡趣味了...



  全文發布於無廣告部落格：



  --'
