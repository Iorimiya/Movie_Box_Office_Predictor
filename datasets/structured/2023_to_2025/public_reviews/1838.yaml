content: "1. 筆者是奈沙馬蘭大粉, 但無奈這回還是很難吞下去\n   這部跟降世神通大概是唯二我不喜歡的奈沙馬蘭電影\n\n2. 預告已經把主軸的劇情跟點都交代的差不多\n\
  \   所以看的時候就是讓我感覺在跑劇情而已,\n   簡稱垃圾時間\n\n3. 相當遺憾的, 結尾還是很好猜到的\n   甚至不到一半時就有感覺結尾會是這樣子,\n\
  \   那不是整齣都在垃圾時間?\n\n4. 原本以為結局後還有一段,\n   可能會是像陰森林那樣的玩環境或其他有趣的梗\n   不過並沒有, 更讓人嘔氣,\
  \ 就這樣?\n\n5. 另一個給負雷的原因就是既視感太重了\n   整部電影的主線跟一些橋段跟2014年日韓合拍片\n   \"溫柔的殺人者記錄\" ( )\
  \ 都差不多,\n   (那片還有av女優葵司, 而且結局更精彩許多)\n   奈沙馬蘭並沒有為同樣的故事增加什麼精彩之處\n\n   想去看的朋友可以把票錢省下來,\
  \ 去找2014年的這部電影來看\n   該有的它也都有, 時間上還更加值得\n\n--\n就完全照4人組字面上意思啊\n三人中有人做出選擇犧牲自己世界得救\n\
  應該只是象徵爸爸的愛與大家同在吧\n我懂了 這部片不好看 也許也算是一種好看\n因為我預期會很好看 沒想到不好看\n也是中了奈沙馬蘭的一個翻轉 厲害了奈導"
