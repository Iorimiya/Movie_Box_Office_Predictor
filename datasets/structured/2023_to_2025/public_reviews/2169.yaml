title: '[普好雷] 最後超展開的鬼臥床'
content: '平實地說 前半段真的蠻無聊的

  就很一般這類型鬼片的公式 而且預告都說完了

  "一個懷孕的媽媽 住到一間有故事的老屋 發生了一些怪事"


  但最後30分鐘~ 開始有了超展開

  老屋故事跟你想的不一樣 人影跟你想的不一樣

  最後的鬥爭結束方式 也跟你想的應該也不一樣


  妙就妙在 這是鬼片

  但最後甚至有點溫馨 甚至心酸酸的


  最近沒這類型片 如果喜歡看這類型的朋友

  還可以看~ 不過稍微遲到一點點是沒差啦哈哈



  --'
