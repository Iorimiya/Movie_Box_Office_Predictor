title: '[好無雷] 《成為星星的少女》'
content: '多少有點都合主義了


  整片看起來的感覺是很舒服的

  或許是其他三位女角的個性太好

  讓我實在很難討厭主角

  主角逐夢的樣子雖然很笨拙

  但卻很切實

  其他三人或許早就發現主角在圖謀什麼

  不過並沒有直接說破

  直到後面才開始「做自己」

  這時候不禁讓人有些感慨

  主角究竟有沒有在反省呢？

  我想這會是大家對於這片的看法不同的最大關鍵點


  最後

  くるみ好可愛


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
