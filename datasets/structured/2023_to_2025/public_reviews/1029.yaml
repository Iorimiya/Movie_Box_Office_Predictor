title: '[片單] 類似貓的報恩的故事'
content: '最近看了貓了報恩，想請問版上神人：


  在各國電影（或電視）的創作中，類似這樣的故事（就是幫助了某人或某生物

  （異星生物也算 XD），然後他就回來化為人類，進行了一個＂報恩＂的動作，

  像這樣的電影或創作，有哪些是可以看的呢？


  好比說：Simon Pegg 的 Paul （我們撞到外星人），對我來說，好像也是同樣的電影

  －－當然啦，個人特別喜歡的，還是變身成為小蘿莉來報恩的那種 XD


  請各位大大推薦啦！




  --'
