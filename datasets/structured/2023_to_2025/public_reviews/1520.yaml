title: '[好雷] 夏洛克的孩子們'
content: "雷文防雷資訊頁\n\n夏洛克的孩子們\nShylock’s Children\n2023日本電影\nシャイロックの子供たち\n\n\n\n東京第一銀行的某家分行，一百萬現金憑空消失，為了釐清真相，分行的資深客服西木與\n\
  受到懷疑的女職員愛理、田端一起展開調查，不料，卻發現這只是這間大型銀行重大醜聞\n的開端。乍看平靜的分行，行員們卻各懷鬼胎：野心勃勃的分行經理九條、職權騷擾的副\n\
  理古川、被前客戶糾纏的王牌業務員瀧野，加上總公司派來進行調查的黑田讓事件更加錯\n綜複雜。隨著西木的突然失蹤，隱藏在現金遺失事件背後的巨大陰謀逐漸浮上檯面，令人\n\
  震驚的真相是？\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\n銀行員面臨的個人生存-利益及良心-一念之間的取捨。\n\
  個人滿意度80分（滿分100）。演員陣容精彩呈現，故事情節引人省思，有警世味，有人\n情味，有醍醐灌頂味？比較美化的結局？\n\n以下有劇透。\n\n\n\n\
  1.夏洛克是莎士比亞戲劇《威尼斯商人》中出現的債權人。 莎士比亞把債權人設，設定\n成了惡棍，但不還錢不是更糟嗎？ 故事就是從此展開的。\n我們是安東尼奧的孩子？還是夏洛克的孩子？\n\
  雖然一開始，夏洛克被描繪成一個性格貪婪的反派，觀看舞台劇的情侶之間的對話中，提\n到錢不還就更糟糕了，而且僅僅退回錢是不夠的。這二句話，是本片劇情的重點，揭開了\n\
  本片的序幕。\n\n2.故事描繪了一家如同夏洛克身分定位的銀行，促使企業向銀行借錢，以及每個銀行員工\n的光明面及黑暗面。本片改編自池井戶潤的著名金融小說，他的小說也被拍成了WOWOW平\n\
  台上架的電視劇版。同作者同名作品的電影版及WOWOW平台上架的電視劇版，還包括了《\n飛上天空的輪胎》，《彬與瑛》等等。\n\n3.一件事情的發生，背後隱藏著更大的事件。本片有一些困難的金融體系和術語，但並不\n\
  是太難。本片不像原作者大熱門作品《半澤直樹》，那樣愛惡分明及正反對決爽快，更多\n是流露出無奈、苦澀、悲傷的氛圍。\n本片業績落後的銀行職員遠藤（忍成修吾），遭遇權力騷擾和業績額度壓力的後果…起肖\n\
  了？\n本片掛頭牌的演員阿部貞夫，扮演西本，他後來洞察同事瀧野（佐藤隆太）的工作狀況，\n設了一個局，這橋段這真是令人興奮，看到了：借款客户石本（橋爪功）和分行行長九条\n\
  （柳葉敏郎）VS賣大樓的澤崎(柄本明)和主角西本，電影和電視劇中不可或缺的主謀之間\n的「對決」，本片的劇情高潮。\n\n4.本片的故事有趣，演員表演到位，有幽默有驚悚，看到了社會題材的殘酷寫實，銀行員\n\
  工背後的面孔，銀行業的黑暗角落…\n一旦開始觀看，就會像往常一樣被池戶井潤作品的金融題材娛樂所吸引。\n\n5.每個人都受金錢的擺佈。那麼，我們借款人安東尼奧就是被玩弄的嗎？\n\
  借錢的人、借錢的人、不還錢的人、偷竊的人、試圖從中獲利的人、伸出雙手的人…\n 這是「夏洛克的孩子」的貪婪所支配的金錢世界。\n看到這樣的世界，令人開始懷疑銀行和銀行員工是否真的值得信任？\n\
  透過本片的類型作品，認為本片試圖傳達的訊息，不僅僅是這些。\n那位銀行員，被小孩稱為英雄的劇設人設，出獄後的劇情畫面，令人有感，有家人的陪伴\n支持，為他感到慶幸。\n\
  \n6.本片雖然劇設人設結構，有些複雜，但伏筆逐漸顯露出來，最後有著令人驚嘆的爽快感\n！而且最後那些主要角色，有的失蹤，有的入獄，有的仍然堅守崗位...呈現銀行員的群\n\
  生相，各有千秋，令人玩味。\n\n\n--"
