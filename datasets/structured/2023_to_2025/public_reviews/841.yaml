title: '[情報] 曹政奭《變身機長》前導預告'
content: "他（她）回來了！！\n\n 《》領銜主演！\n\n《》( 前譯：)\n\n今年8月 在台上映\n\n  \n\n歡迎搭乘本班機\n我會安全的將各位送達目的地\n\
  \n\n《》今年8月即將在台上映\n\n《》領銜主演爆笑鉅獻！\n\n《菜鳥警校生》X《D.P：逃兵追緝令》製作團隊攜手打造\n\n《二十五，二十一》李宙明 X《酒鬼都市女人們》韓善伙\
  \ X《還魂》申承浩 精彩共演！\n\n一夕之間失業的明星機長，準備再次起飛！\n\n具備最強飛行實力的明星機長韓正宇（飾），受歡迎到還參加了有名的電視節目\n\
  ，沒想到卻因一時的失誤而瞬間失去一切，甚至還失業了！\n\n被列為黑名單的韓正宇，遭所有航空公司拒絕採用，陷入絕境的他竟以妹妹（韓善伙 飾\n）的身分完美變身，終於重新獲得機長一職。\n\
  \n然而，韓正宇又再次遭遇出乎意料的難關……\n\n希望人生能順飛的韓正宇，是否能順利起飛呢？\n\n #車庫娛樂 #機智醫生生活 #曹政奭 #二十五二十一 #李宙明\
  \ #酒鬼都市女\n人們 #韓善伙 #還魂 #申承浩\n\n資料來源：\n\n--"
