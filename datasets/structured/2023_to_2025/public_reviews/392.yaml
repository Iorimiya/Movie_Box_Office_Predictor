title: '[普雷] 罪人 觀後感：動聽直到黎明'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《罪人》觀後感：動聽直到黎明\n\
  \n1. 歌很好聽\n最喜歡 車上唱流浪（Miles Caton- travelin')\n跟\n中間瑪莉跑出去，三人組唱的(Will Ye Go,Lessie\
  \ Go)\n\n2. 音樂使人自由\n\n只有藍調是屬於他們的。在3K黨的殺戮遊戲前、在圈養的棉花田中、在被教義束縛成工作\n的奴隸後，那晚他們是自由的。\n\
  \n3. 吸血鬼\n\n我一直在想吸血鬼瑪莉的邀請：在成為白人的獵物前，何不先棄暗投明得到永生？\n\n為此去查了知更鳥的隱喻，看到一本書叫做 殺死一隻知更鳥，是在講述一個無辜善良的\n\
  黑人，因為種族歧視冤枉而死的故事。原曲中，知更鳥（Robin)象徵無力自保之人，藍樫\n鳥（jaybird)則是趁火打劫者，明顯對比電影中的主角群和和吸血鬼。\n\
  \n吸血鬼在黑人被3K黨屠殺前、最無防備之時，趁機亂入吸納更多的「家人」。做為代價，\n你必須放棄自己的靈魂。\n\n說到底，成為吸血鬼到底好不好？獲得永生且形體與之前無異，但只能活在夜晚，與日光\n\
  絕緣。要保有靈魂的死去（照劇情，就算沒有吸血鬼亂入，大部分人的結局都會是死），\n還是放棄靈魂加入吸血鬼，就此失根漂泊但活得長久？\n\n電影最後並呈了兩條路線。倖存的山米到老依舊彈唱充滿靈魂的爵士樂，史塔克和瑪莉則\n\
  享受融入主流文化的紅利（當然變成吸血鬼是被迫／潛移默化的過程，後續享有好處也是\n事實）。\n\n被文化殖民的人早已失去記憶，也沒有堅持，當然覺得沒什麼不好。《罪人》\n\
  讓每個吸血鬼重溫變身的過程，也從動人的藍調中，再次聽見身為人類的堅持。\n\n*自己覺得不用到imax，杜比可以考慮\n=\n\n脆：\nIG：Fishpond_like\
  \ \n臉書：魚池 FishPond \n個人網站：\n\n--"
