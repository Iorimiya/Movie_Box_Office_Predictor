title: '[新聞] 恐怖遊戲《直到黎明》真人電影首波花絮 '
content: '恐怖遊戲《直到黎明》真人電影首波花絮影片搶先看！《沙贊！》導演 x《安娜貝爾》編

  劇打造






  改編自索尼互動娛樂同名恐怖電玩的驚悚電影《直到黎明》（Until Dawn）今天首度釋出

  了幕後花絮影片，負責執導的《沙贊！》（The Shazam！）系列導演大衛 F. 桑柏格（

  David F. Sandberg）、負責編劇的《安娜貝爾》（Annabelle）三部曲編劇-蓋瑞道柏曼

  （Gary Dauberman）在花絮中簡談了本片願景。


  雖然電影與遊戲是設定在相同宇宙，調性也近似，但電影也有全新的擴張，桑柏格掛保證

  ，劇中角色每一次死而復生後的冒險，都會帶給觀眾宛如經歷著不同恐怖片故事類型的體

  驗。





  《直到黎明》主演卡司網羅：艾拉魯賓（Ella Rubin）、瑪莉亞米契爾（Maia Mitchell

  ）、歐德莎艾德蘭（Odessa A''zion）、威廉范德維特（Willem van der Vegt）、貝爾蒙

  卡梅利（Belmont Cameli）、麥可西米諾（Michael Cimino）等新生代演員，在遊戲中飾

  演「希爾醫生」的瑞典男星-彼得史托馬（Peter Stormare）則回歸繼續扮演相同角色。






  官方劇情簡介：姐姐梅蘭妮神秘失蹤一年後，克洛弗和她的朋友們前往她失蹤的偏遠山谷

  中尋找答案。在探索一個廢棄的遊客中心時，他們發現自己被一名蒙面殺手跟蹤，並被一

  個接一個遭殘殺，但醒來後，卻發現自己又回到同一天晚上。被困在山谷的他們，被迫一

  次次地重溫噩夢 — 只是每次殺手的手段都不同，每次的手段也都比上回更可怕。隨著希

  望愈加渺茫，這群人也很快就意識到，他們剩下的死亡次數已經有限，而唯一的生存之道

  就是撐到黎明。


  本片由道柏曼和《世紀婚魘》（The Invitation）編劇-布萊爾巴特勒（Blair Butler）

  合寫劇本，北美地區預定 04 月 25 日正式上映。






  雷米馬利克沒演真人版可惜


  --'
