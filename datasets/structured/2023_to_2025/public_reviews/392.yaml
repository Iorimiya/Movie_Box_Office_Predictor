url: https://www.ptt.cc/bbs/movie/M.1745757831.A.24D.html
title: '[爽微雷] 《直到黎明》沒記憶點的無腦爽片'
content: '本片講述女主角的妹妹一年前在一座渡假村離奇失蹤，女主角與朋友們前往當地尋找線索

  ，卻意外踏上了與她妹妹相同的命運。



  由原創生存遊戲改編成的恐怖片，也算是我期待蠻久的恐怖片，雖然本身也沒玩過遊戲，

  而且聽說電影情節和實際遊戲上還是有明顯出入，但是以這種主打商業性娛樂性質的電影

  來說，對於像我這種沒接觸過原作的觀眾，還是具有一定的滿足感的。



  整部片主要圍繞在主角群接連遇上無法解釋的靈異現象，前半段先簡單鋪陳，並以超自然

  、懸疑為主，中段開始則融合驚悚、血腥、動作以及不時插入的一些黑色幽默的元素，無

  時無刻帶給觀眾不同程度的刺激感受，甚至對於比較膽小的觀眾可能需要屏住呼吸的觀看

  的。



  角色方面，無論是情感之間的互動，或是生死關頭下因立場不同而爆發的衝突，都還算刻

  畫得蠻符合人性的，也沒什麼特別讓人出戲的降智行為。



  至於劇情節奏方面，緊湊度上也算是拿捏的非常剛好，音效與特效上也表現得不錯，雖然

  仍有幾處血腥和怪物鏡頭畫面稍微簡略帶過，但仍能成功營造出強烈的視覺刺激。



  只是比較可惜的是劇本兩大設定未能交代清楚，包含死亡輪迴的概念和無從得知反派的動

  機。而拋開遊戲設定不談，導演似乎想藉由怪物象徵人性的創傷與精神疾病，但很明顯在

  劇情上並沒有建立出一個完好的依據和支撐點。



  畢竟是一款遊戲搬上大銀幕的虛擬實境，自然難以在「真實世界」的環境下成就完整的劇

  情邏輯。不過對於單純享受營造氛圍、驚嚇與刺激、不太要求劇情深度的人而言，應該還

  是很能滿足這份期待的，觀影當下甚至還希望時間過慢一點不要這麼快結束，就是一部沒

  什麼記憶點的無腦爽片囉。





  滿分100分，我給75分






  C96


  --

  我也覺得是近期最刺激好看的，就是爆米花片，氛圍營造和主角思維模式我覺得都塑造

  的不錯，就是劇情設定沒交代好。'
