url: https://www.ptt.cc/bbs/movie/M.1745576987.A.B7D.html
title: '[普無雷] 直到黎明:跳嚇一時爽'
content: '一直跳嚇一直爽


  這部沒甚麼好雷的，因為基本沒劇情，也跟遊戲不一樣，就一群人被困在小屋

  每次被殺就會開啟時間輪迴，就這樣


  所謂沒劇情是說整部片基本上就是一直跳嚇，主角群一直被殺，各種死法，重點是

  完全沒有任何還手的餘地，就任怪物任人宰割，好久沒看到恐怖片有這麼被動的

  設定，說要振作起來出去打怪也是敲幾嚇斧頭就被狠狠打臉，最後就只靠一招

  陰了反派一次就全員得救，重點是這部片時長真的超長，90分鐘可以完事要拖到

  快兩小時


  討厭跳嚇的觀眾極度不推薦，因為除了跳嚇幾乎沒有任何嚇人的手法，角色之間的

  感情可有可無


  如果不是因為本身是導演大衛砂堡的粉絲應該是不會去看這部，導演有自拍照片

  貼在失蹤人口的布告欄上，前前後後大概拍了10次，就是中間最下面那個光頭

  蓄鬍子的大叔


  如果覺得改編電玩會成為未來趨勢還是再想想吧，別因為麥塊電影大成功就下此

  定論


  --

  確實'
