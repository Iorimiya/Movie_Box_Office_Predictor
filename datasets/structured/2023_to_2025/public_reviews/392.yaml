url: https://www.ptt.cc/bbs/movie/M.1745592442.A.5EE.html
title: '[普雷] 直到黎明 - 這是前傳嗎！？'
content: '先上一張10年前的獎杯圖，當初只玩了1、2個結局，因為一直被嚇太恐怖後來是關音效才玩完…



  我先說優缺點，看完後還想去看的話可以先跳出才不至於被爆劇情雷


  優點：

  用遊戲的世界觀改編劇情，讓玩過的人也不至於陌生

  一些有趣的死法

  像安海瑟薇的正妹女主角


  缺點：

  演技很糟，尤其是男主跟男配

  似乎有剪片有很多內容沒交代到

  前面很悶

  主角群的智商跟武力值前後差異太大


  說真的因為玩過遊戲有情懷加成

  要不然我會負評

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  玩過遊戲的話對後面冒出的”溫迪戈”一定印象深刻

  電影則是圍繞要如何用人為方式讓人成為溫迪戈

  但沒有交代醫生是如何讓人能不斷死亡復生來產生變化

  看起來這設定像遊戲裡玩家不斷重來嘗試的過程

  但這畢竟是電影沒交代看起來就很怪

  電影小屋跟遊戲是不同的（應該是為了最後彩蛋）

  還用下雨當結界開車出結界會看到巨大生物（其中一種溫迪戈型態！？）

  感覺編劇似乎有參考”詭屋”

  後面出現醫生跟監視螢幕

  還有一堆地底下生活的溫迪戈

  加上結界設定

  這些都有詭屋的近視感

  電影嚇人方式很老套就是Jump scare跟音效

  這方式雖然跟遊戲裡差不多

  但在恐怖電影裡就很老套

  而且溫迪戈都長差不多

  面具男又一直出現

  看幾次就無感了

  裡面有很多血腥鏡頭但也是看久就無感

  尤其人體爆炸很常出現

  多到主角群也無感


  至於為什麼會說像前傳

  因為結尾彩蛋的監視器螢幕上的房子

  超像遊戲中的那棟

  而且場景也是在雪地裡

  加上電影的主角群又跟遊戲不同…像電影沒有黑人還蠻驚訝的

  不知道是埋梗還是有拍續集的意圖…


  總結來說，索尼旗下遊戲改編的電影裡衰神德瑞克跟GT7都很好看，但這部很差強人意，其實不太需要進電影院看…







  -----

  Sent from JPTT on my iPhone


  --'
