title: '[請益] 賽德克巴萊 桃姐 讓子彈飛選哪部'
content: '如標題，2010應該是兩岸三地國片港片陸片強檔輩出的一年


  這三部放在各自的排名都可以排名列前矛

  賽德克有台灣史上算非常大手筆的場面，歷史大片


  桃姐有點像法外情外傳？XD

  不過是全新的故事，劉德華跟葉德嫻是品質保證


  讓子彈飛則是金句連發

  至今中國跟台灣都有不少人說話都會夾一兩句台詞


  如果只看一部或者安排順序觀影，大家會怎麼排呢？



  --'
