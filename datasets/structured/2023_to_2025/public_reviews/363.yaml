url: https://www.ptt.cc/bbs/movie/M.1505676870.A.B88.html
title: '[負雷] 桃姐-違反勞基法的慣老闆欺壓員工'
content: '最近勞基法吵得沸沸揚揚


  結果剛好又看到桃姐這部電影


  發現這部電劇情是根本是違反勞基法的慣老闆欺壓員工的故事


  結果還得到華人影圈那麼多影評人與觀眾的讚賞


  真是不可思議


  華人社會到底是怎麼了???



  借用一下維基百科的劇情介紹

  桃姐自13歲就到梁家當傭人，轉眼60年過去，她已伺候了梁家老少四代人。

  後來，梁家人有的去世有的移了民，近十年間只剩下桃姐和梁家少爺羅傑在一起生活。

  主僕兩人相處頗有默契但很少交流。

  後來有一天，桃姐突然中風，羅傑把她送去老人院，展開了一段觸動人心的主僕情。



  香港人移民去加拿大的


  都是身家破3000萬新台幣的有錢人才辦得到


  也就是劉德華演的富二代家裡至少有3000萬新台幣(大約港幣750萬)


  這麼有錢


  卻居然不讓桃姐過好一點的生活


  還讓她中風然後送去老人院


  (有錢人至少半年會作一次詳細的全身檢查  甚至還有砸錢請隨身醫師的


  老早就檢查出有中風的危險  老早就做好預防措施了)



  這叫觸動人心的主僕情?


  桃姐的工作時數跟薪資八成也不符合香港的勞基法跟最低工資


  根本欺負桃姐


  最後呢?


  富二代看著桃姐離開人世


  繼續回家抱著壓榨傭人與員工省下來的家產享福去了


  真是一部假柔造作的電影


  真的是負雷


  會讚賞這部電影的人大概都是有錢人


  所以想法跟劉德華演的富二代差不多


  對自己的傭人或員工八成也是這樣對待的


  所以才會覺得好看吧



  有人跟我有同樣的感覺嗎?


  --'
