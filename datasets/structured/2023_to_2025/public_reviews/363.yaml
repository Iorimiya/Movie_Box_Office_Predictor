url: https://www.ptt.cc/bbs/movie/M.1457202222.A.1B7.html
title: '[好雷] 桃姐 (2011) - 人生盡頭的尊嚴'
content: '導演：許鞍華

  編劇：陳淑賢

  演員：劉德華（梁羅傑/Roger），葉德嫻（鍾春桃/桃姐）

  取材自監製李恩霖的真實經歷


  人生走到盡頭時該如何自處？無伴、無子、無孫的桃姐，在傳統價值觀的審視下

  似乎略感淒涼。但膝下無子卻有人送終，謝幕之時又有好友獻花，在老、病、死

  的折騰之下，又走得比很多人來得更有尊嚴。桃姐的故事，平淡卻真誠。生有時，

  死有時，盼一切不早不晚，少點苦難，恰好及時。桃姐晚年的經歷不浮誇、沒特

  效，平淡如你我身邊的故事，也可能是你我未來的故事。


  如何？★★★★


  故事，畢竟是故事。桃姐最後反覆中風導致身體癱瘓、精神衰退，其實是許多老

  年人的晚年寫照。曾照顧過重病家庭成員的人都知道，這過程有多難熬。好像一

  次賠進了所有人的人生，但義務和情感迫使著仍健在的人無法設立停損點，繼續

  這樣拖拉下去。有經濟能力的人或許還能將病人送去養老院或看護院，但對於經

  濟能力不足的人來說，或許更絕望。


  《桃姐》講述一位僕人的晚年，卻也是一個病人的晚年。桃姐和Roger之間的關係，

  既像母子、又像主僕，對Roger來說桃姐某方面甚至親過自己的親媽，不但一手將

  他拉拔長大，到晚年仍以Roger為榮為傲，這何止主僕關係呢？


  我人生中也有位類似桃姐的恩人。跟桃姐一樣，總是不喜歡別人在她身上花錢，

  對於能負擔自己的開銷感到驕傲。靠自己掙來的錢養活自己，不靠人恩惠，是舊時

  代女性特別引以為傲的尊嚴。不論多苦，也不喜歡直說給旁人聽，一方面是愛面子，

  另一方面也是不想麻煩人。


  養老院裡的人物各有千秋，從賊頭賊腦的堅叔（秦沛）、性情乖戾的校長（梁天）、

  溫和傳統的金姨（許碧姬），到深受重男輕女之苦的金姨之女（江美儀），每個人

  在繁囂塵世中碰撞、生存。江美儀無疑是本片亮點之一，將一個不受寵的女兒的無

  奈和感傷演繹的扣人心弦。尤其是江在質疑母親那幕，不忍的苛責之中帶著對不平

  等待遇的怨，以及對母親無私的愛，讓人看得揪心。


  劉德華不知為何還是有種皮笑肉不笑的感覺，少了片場監製的手腕和搞電影藝術的

  狂浪或敏感，反而像個呆板書生，稍嫌不搭。葉德嫻的桃姐隱隱透出堅忍和淒涼，

  將老人的肢體語言和態度掌握得很好。可惜匠氣稍重，欠了點一生為僕的俗氣和老

  人的憋扭任性，演法太「溫和」和「安全」。拿Maggie Smith在The Lady in the

  Van的預告片之中的表現，她演繹的老人更讓我信服。


  這部片的題材非常值得社會大眾關注。透過桃姐的晚年，我們可反思自己年邁時對

  疾病及老年的態度和安排，也提醒我們多關注身邊老人家的身心狀態。取景於深水

  埗的養老院，也暴露出這長期被忽視的社會問題。老年人不能為自己發聲，年輕人

  又不懂養老院的弊病，讓這群社會弱勢被迫接受次等待遇。桃姐好福氣，乾兒子人

  脈廣、收入足才得以受到妥善照顧。試想那些經濟拮据的老人又是如何度過晚年呢？


  桃姐的謝幕，是成功、是無奈，見仁見智。透過桃姐，不妨回過頭來想想自己，若

  有幸活到耄耋之年，又會如何下台一鞠躬？


  --

  邊看邊大哭，真實最感人。:'')

  講到演技部分，想跟眾版友分享多一點點細節，以免詞不達意，讓人誤以為我刻意在

  酸或挑剔葉與劉的演技。葉本人的性格非常豪爽海派（有看過她演唱會的人朋友應該

  都記得她登台時有多花俏XD），所以能駕馭桃姐這個角色真的很不簡單。

  不過說到演技，我想我心目中的「好演技」大概分兩種：一種是透過技巧和觀察呈現

  出的可信度，一種是完全進入那個角色與其合而為一。至少我在觀看此片時，葉給我

  的感覺比較傾向於前者。例如她的佝僂的程度初到養老院的半身不遂在片中不是完全

  一致的，有時駝多一些、有時駝少一些，有時左手能動多一些，有時則動少一些。這

  對我來說都是前者演法的表徵。化妝部分我想也可以在她的手上多下點功夫，畢

  竟葉的設定是位曾服侍三代人的家傭，葉本人稚嫩的雙手和清澈的眼神太亮、像是受

  到長期滋潤的結果。不過這部片也走一點搞笑風，例如葉幫劉應徵新家傭以及結局看

  首映，還有穿插劇中的友情演出和笑點，都指向一點刻意幽默、詼諧的氣氛。所以若

  考慮到本片的架構和調性，葉的詮釋便可圈可點。

  劉則是一直都沒給我大製片的感覺，反倒是中後段有演出Roger的感覺。前半段在製

  片場的周旋，反而是洪金寶的表現最亮眼，完全跳脫演員的角色，活脫就是將一個

  幕後製作人的氣勢演出來。徐克本人雖然是導演，但演導演又是另一回事，相較之下

  便能看出真導演跟演導演所需的技術差異XD 不過戲中有幾個可以讓劉好好發揮的部

  分，可惜我覺得他沒掌握好，例如和母親那幕菊花蜂蜜水戲，可以演多一點兩人之間

  的親密或生疏，覺得可以被發揮到10分戲劉只演到6,7分，可惜那幾段台詞。

  個人淺見，歡迎各位參與討論，彼此學習，精進對審美和觀察的能力 :)'
