url: https://www.ptt.cc/bbs/movie/M.1609598884.A.7F4.html
title: '[好雷] 桃姐'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~











  好片我就不多說了

  主要是從roger在桃姐生病之後的對待方式來看


  雖然她不是你的母親

  但是從小是她把你拉拔長大


  除非你是個不知感恩無情的混蛋

  不然你怎麼可能會不想對她好


  再相對比roger與她媽媽的互動之中可以了解

  其實桃姐是跟他更親近的


  所以即使名義上 她是她家的傭人

  但是實際上，她們的互動跟關係連結

  就是親人一般








  再來就是桃姐在養老院後之後的事情

  各種影響，包括她也習慣了那些人 那個環境


  要不是我喝了幾罐台啤在看戲

  我應該是會狂掉淚吧


  尤其roger在看桃姐的眼神


  總之就是很貼近我們生活的一部戲

  都上映幾年了


  現在第一次看

  喜歡!




  --





  --'
