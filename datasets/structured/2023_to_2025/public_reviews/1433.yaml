url: https://www.ptt.cc/bbs/movie/M.1695176120.A.58D.html
title: '[好雷] 即使獨行：《善良的牧本先生》'
content: "內文有雷且具個人觀點，推薦觀影後再讀。\n\n　　　　本片場次有限，有意請把握。\n\n\n\n　　　　網頁版：\n\n　　　　\n\n\n　　　　預告片：\n\
  \n　　　　\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\n\n即使獨行：《善良的牧本先生》\n\
  \n\n\n　　看這部電影之前，只約略知道與孤獨、死亡有關，然後跟平常一樣，選\n\n了習慣的時段，沒想到進去的時候，前面竟然有人；更意外的是，那個人回\n\n\
  頭跟我打招呼：「我還以為會只有我一個人看！」\n\n\n\n　　這個特別的插曲果然很符合這部電影的調性，也因此結束後，我刻意轉\n\n頭整理得比較久，等對方離開的時候才離場。\n\
  \n\n\n　　然後在回程的路上，一度哭得不可自抑。\n\n\n\n　　牧本先生是庄內市役所送行股的公務專員，負責處理過世的獨居者，與\n\n警察合作尋找家人來領回骨灰，若無人認領便送到無主之墓。既是獨居，自\n\
  \n必無親無屬，或與親屬斷絕關係，牧本先生便常自掏腰包為他們舉行告別式，\n\n即使家人不肯前來，至少有他參加；而無人或拒絕認領的骨灰，他會收在辦\n\n公室與桌子底下，甚至偷偷藏在上司的櫃子裡，就希望有一天家屬會改變心\n\
  \n意。即使是特別交給他負責的送行股，牧本先生的特立獨行依舊令同事側目，\n\n直到新任長官看不過去下令裁撤，此時他受理的最後一位亡者，是住在他對\n\n面公寓、過去素不相識的鄰居……\n\
  \n\n\n　　牧本先生是「遲鈍」的人：反應慢、不懂得察顏觀色，無法理解他人話\n\n語行動的弦外之音，生活規律的他，除了工作外幾乎沒有與人交流的機會，\n\n\
  從他與旁人的互動，可以看到他缺乏足夠的經驗，一旦超出負荷，就會出現\n\n「在下牧本現在好亂啊！」的當機狀態。這樣單一直線的人，也固執地完成\n\n自己的任務。但死者家屬不肯領回骨灰，他也從不試圖道德勸說，畢竟每個\n\
  \n人的人生不同，死者生前可能是對生者的折磨，而對牧本而言，他比誰都明\n\n白「不受歡迎」的事實，不會因死而改變。保留死者的骨灰默默等待的他，\n\n或許一如他的新任長官所言，是一種自我的投射──或許有那麼一天，會有\n\
  \n人願意接受孤獨的他。在這同時，他為自己買好了墓地，作為最後的安身之\n\n所。\n\n\n\n　　直到他為鄰居蕪木先生一一尋訪他過去的家人、朋友，傾聽他們的感受\n\
  \n與故事，察覺到有些孤獨是出自於一種自我的擇善固執：蕪木先生在礦坑背\n\n著失明的朋友、踩著瓦斯爆炸身亡的同伴屍體逃出去，因為好友的境況無法\n\n安然接受自己的幸福；為了抗議公司的不公待遇，用向機械撒尿威脅上司改\n\
  \n善；因為海岸出現死人，漁人慶幸因此增加漁獲而憤怒出手，卻也因此無法\n\n再待下去而離開……\n\n\n\n　　過往的堅持與挫折在經過年歲與時間的淘洗下，有時並不會「進化」或\n\
  \n「成熟」，反而會變成固著的標記；一旦斷了與外界接觸的管道與可能，就\n\n會退縮進無可接觸的孤獨裡。「有做努力但不知道是否正確」，牧本先生如\n\n此自言，誰不曾如此？在堅持努力還是不停地撞到牆時，與其說「好累喔」，\n\
  \n不如對自己說「盡力了」。我想，那些懂得轉彎，或靈活地知道怎麼尋找正\n\n確路徑的人而言，會覺得這樣太傻了吧？怎麼會用這麼笨的方式去處理？怎\n\n麼會傷痕累累還繼續去撞呢？想那麼多做什麼？為什麼要這麼在意這些？但\n\
  \n一定會有不是那麼靈活的人，堅持用自己的方式前進，即使只能獨行，卻是\n\n唯一能夠認同的選擇了吧？\n\n\n\n　　這種「無效的努力」讓我想到《呼叫愛美子》。當電影裡呈現牧本先生\n\
  \n下班回家，孤獨地作菜、為今天接觸過的死者痕跡留下紀錄，餵獨養的一隻\n\n金魚時，都像是愛美子般，無聲地對寂寞說：我沒事的！就好像是用這種堅\n\n持告訴自己：就算對大多數人沒有價值，我也會努力把生命的價值發揮出來，\n\
  \n包括好好生活、好好工作，好好為自身一直以來的缺損，去為他人多一分成\n\n全。\n\n\n\n　　而牧本先生在為蕪木先生尋找過去的同時，彷彿從他的親友的敘述與回\n\
  \n憶、怨惱與懷念裡，拼湊出蕪木先生的樣貌，和牧本先生也不是那麼肯定的\n\n自己。是因為敬佩蕪木先生的固執，還是對「像自己的人」的肯定呢？即將\n\n失業的牧本先生讓出了自己的墓地，成功地讓蕪木先生的親友齊來參加他的\n\
  \n告別式，甚至他也從中感受到蕪木先生對天鵝的喜愛，得到蕪木先生女兒的\n\n感激，就在他買下相機，仰頭拍攝掠過青空的天鵝，想必是他人生中最快樂、\n\n美好、最肯定自己的時刻吧，在這一刻能對自己說「盡力了、盡力了」，毋\n\
  \n寧是將幸福結晶於至美的瞬間。\n\n\n\n　　虛假、謊言與傷害，無人能夠阻擋或避免；最美好的剎那終會寂滅；曾\n\n經的幸福與努力都可能因變化殞落，那樣的消逝甚至情有可原、無可怨懟，\n\
  \n不變的唯有孤寂，永遠必然相對的只有自己，那麼，在無常與無盡的苦惱裡\n\n持續本於真心、忠於理想的平衡，亦是終身必須背負的任務吧。和蕪木相似\n\n的牧本先生，儘管最終沒有生者為他舉行告別式，但比起蕪木的孤獨死去，\n\
  \n牧本先生肯定了自己的價值。他的善行像雨後的彩虹，雖然短暫且可能無人\n\n知曉與記憶，但會在他人生命裡留下一點點溫柔與感念的痕跡與延續，這會\n\n使他將與蕪木一樣，在最終必然的孤獨裡獲得安眠。\n\
  \n\n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\n            \
  \                      陳斐雯  貓蚤札（其三）\n\n--\n\n\n　　我也盡力了，看完的後勁很後，也很勁，所以努力寫下紀錄，希望對死亡\n\
  \n與孤獨感興趣的人不要錯過這部電影。\n\n　　謝謝推文。:\")"
