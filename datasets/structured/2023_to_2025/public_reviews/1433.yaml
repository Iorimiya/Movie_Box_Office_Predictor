title: 'Re: [好雷] 即使獨行：《善良的牧本先生》'
content: '在圖書館放電影時看的公播版

  看得觀眾都是退休阿公阿嬤

  這片是喪葬文學的片

  講如何對待沒親人的獨居老人

  一開始看覺得很無聊

  第一次看到主角是他演醫龍的麻醉師

  看這片想怎麼會找他來當主角?

  難道他是超級富二代?

  自己出錢拍電影當主角?

  感覺大泉洋也是這樣自己出錢當主角

  這片還找了一堆大咖來抬轎

  有宮澤理惠、國村隼、島田久作等

  還有最近日劇爆紅的滿島光

  看完這片感覺日本獨居老人越來越多了

  就像我的完美日常一樣，多半都孤獨死

  沒有喪禮就直接火化送進百姓公公墓

  主角扮演像聖人天使一樣的葬儀社員

  自掏腰包幫這些老人辦喪禮安葬

  他也一個人住，還幫往生者找家人

  他還把自己的墓地讓給往生者

  他死後會拜他的都是這些往生者

  台灣大概也快變這樣了

  小孩都不再親人身邊

  親人死了也找不到小孩來送終

  這樣就必須由政府來收屍

  原本政府是在推長照2.0

  結果卻演變成孔雀魚的人生清理員

  再來是安樂死才好幫這些孤獨老人送終




  --'
