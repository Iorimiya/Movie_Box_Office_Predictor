title: '[好雷] 客途秋恨'
content: "這是許鞍華的自傳電影\n陸小芬演許鞍華的日本母親\n二戰時全家搬去滿洲國生活\n抗戰結束要遣返日本人回國\n遣返的國民黨軍官是李子雄\n看上了陸小芬就相愛結婚\n\
  後來在遼寧生了了許鞍華\n1949年共產黨佔領中國後\n李子雄就帶全家搬去澳門\n\n然後就生了張曼玉演的許鞍華\n當時還是小孩的許鞍華很親公婆\n但他媽媽在夫家被公婆冷落\n\
  主要是不會說粵語所以溝通不良\n還有中國人對日本都有血海深仇\n而且她在日本時還是千金大小姐\n\n後來李子雄就跟陸小芬搬去香港住\n張曼玉就留在澳門給公婆隔代教養\n\
  後來在香港又生了一個妹妹\n\n張曼玉長大後去跟香港念大學住爸媽家\n但常常跟媽媽吵架，後來她爸才告訴她\n他媽媽其實是日本人，在中國很難適應\n國際同婚文化不同他媽媽受很多委屈\n\
  希望她能體諒她媽媽嫁來中國的難處\n\n後來李子雄過世，張曼玉去英國念完碩士回國\n妹妹嫁去加拿大，她在香港跟媽媽相依為命\n本來能在英國電視台工作，但選擇在香港生活\n\
  \n他媽媽帶張曼玉回日本探親\n看到他媽媽回到故鄉一整個如魚得水活跳跳\n瘋狂的說日文吃日本料理跟拜訪親友\n張曼玉說她不會日文像啞巴一樣\n待一天就想回香港了，他媽媽說\n\
  你現在知道我在香港有多苦了吧\n\n一聽到弟弟要把祖屋賣了拿去做生意\n就強烈反對，說賣了以後回日本沒家可住\n他弟就大罵她不忠不義竟然叛國嫁給國軍\n還有臉跑回日本來要房子，她就拿茶潑他弟\n\
  說你當神風特攻隊那麼忠肝義膽\n怎麼戰敗後不去切腹自殺\n\n探完親回香港\n張曼玉找到電視台的工作\n故事就結束了\n\n這個故事許鞍華導演的自傳\n像是TVB電視台某個女新聞高層的自傳\n\
  原來許鞍華是香港大學英文碩士\n還跑去英倫留學過念電影學院\n難怪會跑去日本拍極道追蹤\n原來許鞍華是中日混血\n\n這是我國小去出租店租的VHS錄影帶回家看\n\
  看到張曼玉就租來看看，老闆還懷疑說這是你要看的嗎？\n小孩子的確看不懂這片，只記得媽媽帶女兒回日本探親\n但故事內容看完就忘光光了，也不知道在演什麼\n只記得主題曲很好聽，還有拍得很文藝很舒服\n\
  \n多年後再看一遍就能體會自己母親跟上一代人的辛苦\n很多是小孩沒法理解的，大人也不知道該怎麼溝通\n想到我媽跟我外婆也是吵得很兇老死不相往來\n但願我媽看了這片能跟我死去的外婆和解\n\
  片中媽媽對女兒說「越親的越遠、越遠的越親」\n\n我外婆也是從上海嫁台灣\n一樣親日的台灣人很討厭中國人\n就像現在台灣人很討厭共匪一樣\n\n難怪她會找個台灣人來演日本人\n\
  我外婆也是不會台語像聾啞人士\n幻想浪漫的國際通婚也真不容易\n就像福原愛跟大S一樣\n\n這片在YT找得到，有興趣可以看看\n\n「客途秋恨」是粵曲的歌名\n\
  張衛健演韋小寶有唱紅過的台詞\n「涼風有信，秋月無邊，\n虧我思嬌的情緒好比度日如年，\n雖然我不是玉樹臨風，瀟灑倜儻，\n但我有廣闊的胸襟加強健的臂彎！」\n\
  \n\n  粵劇歌詞\n\n  國語主題曲\n\n金馬影后陸小芬\n\n主要這是許鞍華的爺爺奶奶愛聽的傳統粵曲\n他們都是異鄉人，因為內戰逃到澳門跟香港\n後來爺爺把許鞍華丟給她爸就回廣州老家去\n\
  但回到故鄉後也因為文革被紅衛兵鬥的很慘\n可能因為兒子是國民黨軍官所以算是黑五類\n許鞍華遺傳到爺爺跟爸爸勤工儉學書念得好\n妹妹則遺傳到媽媽會穿著打扮，嫁到國外去\n\
  難怪許鞍華一輩子沒結婚，就為了照顧媽媽\n不過女人學歷太高的確不太容易找到好老公\n她妹妹說跟媽媽最親的反而離得最遠\n跟媽媽離得最遠的姊姊反而走的最近\n他媽才說：最親的最遠；最遠的最親"
