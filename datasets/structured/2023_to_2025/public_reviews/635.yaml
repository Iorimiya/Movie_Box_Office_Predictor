url: https://www.ptt.cc/bbs/movie/M.1744560858.A.3E4.html
title: '[討論] 獵人克萊文男主角真的帥！想看第二集'
content: '獵人克萊文滿可惜的...男主角真的帥！


  題材很好看，劇情也算順，最大的看點是男主真的帥爆，


  整體造型都很適合這個角色，髮型跟衣服都很搭，導演把他拍的很帥，


  監獄追逐戲那邊動作很俐落，好像比在復二的時候壯？


  但他當時的造型真的太悲劇了，完全不覺得他帥，


  不過不知道是不是預算有限，跟大boss的絕戰還是讓人失望，


  boss 完全不強，特效也有限，一下就被打倒，不知到是不是以後的超英戲都是這樣...


  不過如果出第二集有點想去電影院看，不知道還有沒有機會出第二部...


  話說羅素克洛應該是死透了嗎？



  剛剛找到的 訓練宣傳影片 他的營養師也太大隻XD 難怪可以把他短短六個月練這麼壯



  簡介:

  女主（亞莉安娜·黛博塞 飾 黑人政確但戲份覺得不多）：巫毒女祭司，克萊文的情人


  男主爸（羅素克洛飾演）：毒品走私業者


  犀牛人 （反派 亞歷桑德羅·尼沃拉飾）：原是男主爸手下因被男主爸長期看不起一直想

  變強讓他看看，在參與了一次實驗中變成了犀牛人


  男主弟（狄米崔·史莫迪耶科夫飾演／之後會變成變色龍）：男主同父異母弟弟


  --'
