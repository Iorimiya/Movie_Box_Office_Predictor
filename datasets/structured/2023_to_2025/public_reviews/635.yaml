title: '[普雷] 獵人克萊文'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  優點：克萊文帥，追殺打鬥的部分算爽，動物可愛，整體節奏算順


  不優但勉強接受：女主角莫名在旁邊support，又給情報又當補師還打輸出(打輸出收掉異鄉人的部分不接受)


  大缺點：兩個反派輸的莫名其妙

  異鄉人那麼強把克萊文打趴直接劇情殺？？？

  犀牛人也把克萊文打趴最後被反殺？？？

  照理說犀牛皮那麼厚應該要用毒的用炸的吧


  前面克萊文各種獵殺的帥形象在兩個決戰都表現很差。


  題外話：這個犀牛跟驚奇蜘蛛人的裝甲犀牛漫畫是同一個角色嗎？還是漫畫就有兩個角色？


  -----

  Sent from JPTT on my Google Pixel 7.


