url: https://www.ptt.cc/bbs/movie/M.1734070005.A.F4F.html
title: '[好雷] 獵人克萊文'
content: '沒有片尾！但比蜘蛛夫人好看！











  好雷部分

  武打戲不錯爽快

  主角俄羅斯口音聽起來還挺像的

  (有特別練過？)


  特效部分就犀牛人看起來鳥鳥的

  慘遭真人化的犀牛人

  真的不好看醜醜的= =

  手遊未來之戰的犀牛人都比他好看


  有一個會催眠的傭兵？刺客？可能因為能力太強

  完全打趴主角

  下場被女主角一箭幹掉，這邊收得很爛


  有順便帶出另外一個反派變色龍

  可惜應該也是沒下文了



  最後還是要說

  克萊文比蜘蛛夫人好看！


  ----

  Sent from on my Samsung SM-S9080


  --

  最後一口氣了，標準可以降低很多

  我是覺得有，克萊文的武打戲好看

  因為是救命恩人又是真命天女，所以可以交心？

  大概要跟蜘蛛夫人和魔比斯放同一組，這樣比對的話克萊文好一點

  是，就是預告出現犀牛人那段。我是覺得結局打戲輸前面的

  克萊文獵捕自己的弟弟應該還有戲可看

  好太多

  比萌毒好

  電影版本的克萊文算是動保英雄兼任反英雄？

  可以進戲院看了

  某方面來講還真的比驚奇隊長2好看

  看完後還以為影評是收錢寫負面新聞的，走負面流量吸引人進場

  不看特效的話能力還挺厲害的說

  沒經費燒特效吧？這劇情出2也沒問題，第二集就出個獵人世家兄弟對決也行

  比萌毒3好

  對吧對吧，沒影評講得那麼差

  快進場看

  對吧看完電影後也是這樣想

  弟弟，在電影中會模仿對方聲音就跟變色龍一樣會適應對方，後來能力提升會變臉

  查維基是寫偽裝大師

  相同宇宙對比？

  劇情走向看來弟弟變壞很正常，如果有第二集的話就是獵人世家兄弟對決

  最後一口氣了，好心點吧

  加上近期超英電影還沒幾個好的？

  沒經費燒就是退步

  ？

  影評都要反著看了

  跟電影的俄羅斯人講起來語調很像

  對！

  都忘記他的快銀有口音了

  難怪！

  對，看完後就覺得影評收錢講爛，進場看就不會有太多期待的負面行銷'
