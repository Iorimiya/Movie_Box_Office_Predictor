url: https://www.ptt.cc/bbs/movie/M.1750737384.A.5EF.html
title: '[負雷] 魔比斯/獵人克萊文  可以結拜了'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n   \
  \                 同時有這兩部的雷\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n\n\n\n\n\n\n\n這兩部超英電影都是上映前就不被看好，上映後被各種嘲笑\n雖然明知道是爛片\n但我前陣子實在不知道要看什麼，就點開來看\n\n\n\
  先說魔比斯\n由我有點討厭的傑瑞德雷托主演（這人真的超級煩）\n但我儘量不帶成見的看這部片\n\n劇情相當好猜\n天才科學家為了醫自己跟兒時玩伴的病\n鋌而走險注入蝙蝠的基因，而獲得無法自控的超級力量\n\
  而剛剛說的那兒時玩伴，一看就知道會跟著入魔\n畢竟超英起源電影中，對抗同類型BOSS可是相當常見\n\n講完了XD\n\n其實說他爛嘛，但不如說是過分清淡\n\
  還有主要角色表現都蠻無力\n\n\n\n再來是獵人克萊文\n主角莫名其妙獲得超級力量後\n為了反抗暴君般的父親離家出走\n成為武鬥派的動保份子\n\n後來又捲入了兩個莫名奇妙的大中BOSS跟自己老爸的糾紛之中\n\
  接著就剷除了大中BOSS跟自己老爸\n過程真的蠻無聊的\n\n尤其是那犀牛，真的是超無聊的BOSS\n那最後決戰真的煩悶到炸XD\n\n最後弟弟入魔的點也很奇怪\n\
  一直說哥哥跟爸爸是同一種人\n實在有點牽強\n然而wiki上寫著\"他穿上背心，接受了弟弟對他的指控\".....\n好吧，他自己都接受了\n\n\n\n結論：在有預期是爛片的情況下\n\
  用配飯的形式分段看\n算是還可以順順的看完\n其實沒有我想像中的爛\n\n但這是月費串流加減看的情況\n如果我是花兩百多元X2去戲院看\n應該會超氣\n所以還是給負雷\n\
  \n\n剛提到結拜是指這兩片的際遇很像\n爛的方式也很像\n但後來又想到魔比斯後面的禿鷹揪團彩蛋\n後來不會真的結拜了吧\n\n--"
