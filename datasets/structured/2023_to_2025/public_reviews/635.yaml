url: https://www.ptt.cc/bbs/movie/M.1716394123.A.C71.html
title: '[新聞] 獵人克萊文延期 12 月原因曝光！索尼：'
content: '《獵人克萊文》延期 12 月原因曝光！索尼製作人：聖誕節陪親友一遍又一遍地重看




  今年四月，公布檔期異動更新。


  其中為了配合新版《》（Karate Kid）電影異動，蜘蛛宇宙新作《》

  （Kraven the Hunter）將檔期從 8 月延期至 12 月聖誕檔期上映。


  而近日索尼製作人說明了這項決策的「」原因。




  《》製作人 麥特托馬赫（Matt Tolmach，上圖）接受《Collider》訪問指出

  ：


  「《》將會改檔至聖誕節上映，我對此感到很興奮，因為聖誕節是最棒的檔期

  了，人們有機會和親朋好友一遍又一遍地回去看電影。」


  「這是工作室同仁對這部片的真實感受，我們真的很興奮，這個了不起的決定，反映了這

  部電影的調性。」


  《》目前排定 12 月 13 日上映，同檔期將會遇上 11 月底推出的《

  》（Wicked）以及在 12 月 17 日推出的《》（Mufasa

  」重看的贏家是

  誰了！


  新聞來源： Collider


  新聞網址：




  --'
