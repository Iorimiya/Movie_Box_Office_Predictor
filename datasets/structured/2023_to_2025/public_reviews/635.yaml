title: 'Re: [新聞]《獵人克萊文》慘賠 1.2億成本僅回收4200萬'
content: '索尼不是不會拍超英電影

  是不會拍超級反派電影


  猛毒就有這個跡象了

  只是大超英+復聯末期年代

  猛毒有吃到最後一波紅利


  魔比斯跟獵人克萊文還有猛毒都有這個問題

  明明是超級反派電影

  卻要搞一些輕描淡寫他們反派事蹟的東西跟偷偷洗白


  猛毒還算好

  只是要殺不殺很煩

  勉強還看得出是個反派


  但如果沒看過原作

  只看獵人克萊文電影

  應該很難想像這是個"超級反派"吧?


  本來就不是甚麼偉光正的角色

  又洗的不乾不淨

  整個角色就平板化的很嚴重

  連帶劇情變成白開水


  猛毒還算知名角色就還好

  至少吸引一些票房


  後面的魔比斯+獵人克萊文

  本身咖位已經夠小了

  還被這樣的魔改剝奪靈魂....


  以這樣的角色要扛一部電影


  連漫威本家都辦不太到了


  只有死侍這種咖位的超人氣角色才有辦法獨立電影


  甚至連冬兵這種等級的 都要依附在美隊電影之下


  索尼為什麼覺得自己可以從蜘蛛人裡面

  撿幾個很多人連聽都沒聽過的三流小咖

  然後魔改洗白來拍電影呢??


  我覺得他還不如降低預算

  反派火力全開盡情搞事亂殺一通

  然後拍成窮凶極惡PG15

  還比較有機會回本......


  --'
