url: https://www.ptt.cc/bbs/movie/M.1734932461.A.556.html
title: '[新聞]《獵人克萊文》慘賠 1.2億成本僅回收4200'
content: "新聞網址：\n\n原標題:\n\n\n2024-12-23\n\n\n索尼影業的蜘蛛人電影宇宙已迎來終局時刻，在《猛毒最終章：最後一舞》以全球\
  \ 4 億\n 8000 萬美元的票房作為系列句點之際，被寄予厚望的《獵人克萊文》卻迎來了史無前例\n的慘敗。這不僅重創了索尼的超級英雄電影版圖，更可能成為這個野心勃勃宇宙的最後一\n\
  塊拼圖，為整個系列劃下無奈的休止符。\n\n\n《獵人克萊文》由亞倫泰勒強森 (Aaron Taylor-Johnson) 主演，講述了俄羅斯貴族獵人\n謝爾蓋克萊文納維奇的起源故事。然而，這部電影在上映短短十天內，北美票房僅收穫\n\
  \ 1700 萬美元，海外市場同樣表現平平，僅有 2500萬美元進帳，全球總票房勉強達到\n 4200 萬美元。考慮到迪士尼的《獅子王：木法沙》和派拉蒙的《音速小子3》即將在年\n\
  末檔期推出，《獵人克萊文》的票房成長空間更顯侷限。\n\n\n\n《獵人克萊文》帶來巨大虧損\n\n\n。若再加上\n行銷宣傳費用以及電影院分帳等支出，本片恐將為索尼帶來巨額虧損。\n\
  \n\n回顧索尼蜘蛛人電影宇宙的發展歷程，頹勢其實早有跡象。2022 年推出的《魔比斯》由\n傑瑞德雷托擔綱，全球票房收入為 1 億 6000 萬美元，且外媒評價一面倒負評，認為這\n\
  是一場笑話。而今年稍早上映的《蜘蛛夫人》雖然有達珂塔強生主演，首週全球票房仍僅\n有 5000 萬美元，最終收益也僅達 1 億美元，差評比起《魔比斯》更是有過之而無不及\n\
  。\n\n在整個宇宙中，只有湯姆哈迪主演的《猛毒》三部曲取得相對成功的成績。2018 年的首\n集全球收穫 8.56 億美元，2021 年的《猛毒2：血蜘蛛》獲得\
  \ 5.02 億美元，加上最新的\n第三集，整個系列累積票房達到 18 億美元，成為索尼蜘蛛人宇宙中的獨特亮點。\n\n\n然而，\n\n\n下。\n\n\n\
  這樣的局面不禁讓人聯想到 DC 擴展宇宙的末期表現。華納兄弟最後一部 DC 擴展宇宙電\n影《水行俠與失落王國》同樣遇上票房滑鐵盧的窘境，目前影迷們對單純依靠特效和動作\n\
  場面的超級英雄電影已產生疲勞，要如何走出這樣的困境，成為了好萊塢各大製片廠不得\n不正視的課題。\n\n\n--"
