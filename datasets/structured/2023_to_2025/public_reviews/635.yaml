url: https://www.ptt.cc/bbs/movie/M.1687200337.A.7EF.html
title: '[情報] 索尼蜘蛛宇宙《獵人克萊文》首支預告'
content: '《獵人克萊文》由《三重邊界》、《暴力年代》導演J.C.錢德爾執導，劇本則由《絕地7

  騎士》編劇理察溫克、《鋼鐵人》編劇亞特馬爾康、麥特哈洛威共同撰寫。




  本片卡司包含了亞倫泰勒強森飾演的主角「克萊文」、亞歷桑德羅尼沃拉飾演反派「犀牛

  人」、佛列德海金傑飾演克萊文的同父異母弟弟「變色龍」、羅素克洛飾演克萊文兄弟的

  父親的，以及亞莉安娜黛博塞、克里斯多夫艾伯特、萊威米勒等人的加盟。


  本片是繼《猛毒》系列、《魔比斯》後的第四部《蜘蛛人》漫畫反派角色改編電影，預計

  於10月6日在北美上映。


  --


  主角前陣子才在CinemaCon證實了這一部會是R級。


  在無家日裡作為彩蛋一閃而過的剪影人物，究竟這次他的獨立電影會不會出現蜘蛛人呢？


  也希望這次能來一個更貼近原作的犀牛人了。


  --'
