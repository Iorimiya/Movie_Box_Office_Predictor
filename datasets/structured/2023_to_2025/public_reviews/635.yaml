url: https://www.ptt.cc/bbs/movie/M.1736087119.A.0B2.html
title: '[新聞] 《獵人克萊文》反派回應負評：我拍得挺開'
content: "《獵人克萊文》反派「犀牛人」回應外界的負評如潮：我其實拍得挺開心的\n\n\n\n索尼影業《蜘蛛人》（Spider-Man）配角宇宙的第六部電影《獵人克萊文》（Kraven\
  \ the\n Hunter）去年上映後，毫不意外票房淒涼、口碑悽慘，難逃這系列作品飽受觀眾唾棄的\n命運，而外界自然也好奇，該片演員對如此負面的迴響有何感想，在片中飾演反派「犀牛\n\
  人」的亞歷山卓尼沃拉（Alessandro Nivola）日前接受《好萊塢記者報》（THR）就被追\n問了相關問題。\n\n\n《好萊塢記者報》懷疑《獵人克萊文》可能是受索尼高層干涉，才害導演J.C.錢鐸（J.C.\n\
  \ Chandor）無法完全施展實力，而尼沃拉對此回應：「我真的不清楚檯面下發生什麼事，\n我們常聽聞很多關於這類電影的內部衝突，而或許就是因為主導這些電影的人太多了吧，\n\
  我不確定啦，我對於我自己演出經驗以外的製作流程不夠了解，而我參演這部的經驗是開\n心的，J.C.和克里斯多夫艾伯特（飾演另一位反派異鄉人）還有我之前就合作過《暴力年\n\
  代》，我們都認識彼此，所以 J.C.和麥特（托馬奇，製片人）都很信任我們自由發揮。\n」\n\n尼沃拉接著表示：「就像我演過的許多其它電影一樣，《獵人克萊文》的拍攝過程對我來\n\
  說充滿創意和樂趣，讓我度過了一段充實的時光，所以我沒感覺到幕後有發生任何困難，\n但有很多困難可能會在剪輯階段開始碰上，會有各方不同的意見開始相互衝突，所以我真\n\
  的沒辦法告訴你什麼，我只知道我在拍攝過程中度過了一段愉快的時光。」\n\n尼沃拉也坦承，「我沒有閱讀太多的評論，但我的經\n紀人有傳給我每則業界人士給予的評論，而這是我至今收過最好的評論之一，《IndieWir\n\
  e》還用了三頁的篇幅來評論我的表演，這挺棒的。但我其實不太關注外界的批評和粉絲\n的反應，因為它可能是個（會使你愈陷愈深的）黑洞，我之前在《紐華克聖人》就有過這\n\
  種經驗了。但《獵人克萊文》是另一種情況，。」\n\n\n\n\n--"
