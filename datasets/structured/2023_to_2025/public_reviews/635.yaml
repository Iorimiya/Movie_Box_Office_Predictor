title: '[好雷]  獵人克萊文 反派宇宙最後一舞'
content: '這部比起魔比斯 蜘蛛夫人 猛毒


  他的反派宇宙 系列 都好很多


  前面覺得打鬥稍微少一點


  但是後面打的很爽 中間還有赤腳追逐戰


  拉直升機 應該有致敬美國隊長


  而且克萊文真的超帥


  大概一陣子就秀一下身材


  基本上有把獅子的能力展現出來了


  父子三人感情戲 我覺得還可以


  表示他們其實也不是什麼好人


  也沒有這麼討厭他爸 還覺得他爸人也還不錯


  但是三個反派能力就很謎 犀牛人很怪異


  異鄉人剛出來 這什麼鬼能力


  後來看解說是催眠 還以為是可以加速三秒


  後面弟弟變成光頭 在變成克萊文


  還以為變成外星人了


  作為SONY宇宙收官之作我覺得還可以啦


  聽說導演還想拍一部續集 希望可以有





  --

  我覺得應該在猛毒 獵人克萊文  猛毒3

  剩下都差不多...XD'
