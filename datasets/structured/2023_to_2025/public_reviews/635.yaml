title: '[情報] 亞倫泰勒強森將主演 Sony 漫威反派電影《獵人克萊文》'
content: "根據綜合外電的報導指出，英國男演員 Aaron Taylor-Johnson 將主演由 Sony 開發的曼\n威超級英雄電影《獵人克萊文》（Kraven\
  \ the Hunter），飾演這名「蜘蛛人」系列的經典\n反派角色。\n\n\n（圖片來源：網路）\n\n本名謝爾蓋·克拉維諾夫（Sergei Kravinoff），是俄羅斯貴族後裔，為了找回貴族的榮\n\
  譽而開始進行狩獵。狩獵的熱情與才能將他引領到非洲，從而遇見了使用巫毒的女巫，並\n獲得了能夠延長壽命和猛獸般力量的神秘藥水。開始對一般狩獵感到無趣的他使用新的藥\n\
  水增強自己的能力，並開始狩獵蜘蛛人。（角色簡介取自百度）\n\n《獵人克萊文》將會是「索尼漫威宇宙」繼《猛毒》和《魔比斯》之後最新以反派角色為\n主角的獨立電影，目前也已經暫定檔\
  \ 2023 年 1 月 13 日上映。\n\n\n（圖片來源：網路）\n\n曾以《夜行動物》獲得金球獎的 Aaron Taylor-Johnson 在此之前就已經演出過\
  \ MCU 中的\n角色「快銀」，在《美國隊長2：酷寒戰士》中首次登場，並於《復仇者聯盟2：奧創紀元\n》擔任要角，卻也在該片中犧牲。而這回則睽違六年再度接下了漫威電影中的反派角色「\n\
  獵人克萊文」。\n\n《獵人克萊文》獨立電影劇本將由《鋼鐵人》編劇 Matt Holloway 和 Art Marcum，以及\n《私刑教育》系列編劇 Richard\
  \ Wenk 三人共同編寫。幕後則由《蜘蛛人》系列電影製片\n Avi Arad 和 Matt Tolmach 製作。\n\n導演方面，去年夏季時曾報導索尼有意找《三重邊界》導演\
  \ J.C. Chandor 執導，他曾以\n《黑心交易員的告白》入圍過奧斯卡編劇獎，不過目前還正式確認他是否接下導演大位。\n\nAaron Taylor-Johnson\
  \ 近來參予了《玩命關頭：特別行動》導演 David Leitch 動作新片\n《Bullet Train》的演出，據知情人士表示，製作團隊是看到 Aaron\
  \ 在片中與 Brad Pitt\n 的精彩對手戲而很快的決定聯絡並邀請他來演出《獵人克萊文》。\n\n\n\n\n\n--"
