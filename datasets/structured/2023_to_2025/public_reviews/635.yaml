url: https://www.ptt.cc/bbs/movie/M.1723656871.A.E5F.html
title: '[新聞] 《獵人克萊文》戰略性補拍！導演信能成功'
content: "《獵人克萊文》為品質進行「戰略性補拍」！導演自信稱：索尼有信心達到《猛毒》系列\n的成功\n\n\n\n雖然在年初推出了口碑票房雙雙翻車的《蜘蛛夫人》（Madame\
  \ Web）電影，但這並不影響\n索尼繼續擴展「蜘蛛宇宙」的毅力。即將在年底聖誕檔期推出的《獵人克萊文》（Kraven\n the Hunter）電影，據悉在早前經過了所謂的「戰略性重拍」而導演\
  \ J.C.錢德爾（J.C.\n Chandor） 相當有自信，認為將會帶來重大轉機。\n\n根據《Deadline》報導，索尼影業為了確保該片品質，與錢德爾簽訂了新的合約進行「戰\n\
  略性重拍」，並讓高層有信心《獵人克萊文》能夠再創《猛毒》（Venom）系列的成功。\n\n錢德爾透露：「我對我們在《獵人克萊文》上的努力感到非常驕傲，我相信當這部電影上\n\
  映時，將會讓很多人大吃一驚。至於我的下一步計劃，一切都要看電影之神的安排。」\n\n\n\n報導指出，錢德爾的下一步計畫會是一部現代驚悚片，內容涉及一個「富豪世家死亡事件\n\
  的調查」，該片將繼續與索尼合作。\n\n《獵人克萊文》目前暫定 12 月 13 日上映，由「快銀」亞倫泰勒強森（Aaron Taylor-J\nohnson）、亞莉安娜黛博塞（Ariana\
  \ DeBose）、羅素克洛（Russell Crowe）等人主演。\n今日稍早也釋出最新預告，其中可以見到 亞歷山卓尼瓦拉（Alessandro Nivola）飾演的\n\
  「犀牛人」首度現身。\n\n\n\n\n--"
