title: '[普雷] 獵人克萊文 （濃縮有雷心得）'
content: '爸爸：你弟弟是廢物 你才是繼承我家業的人 你千萬不要當一個廢物

  獵人克萊文：你爸爸是個罪犯，他才應該去死

  弟弟：我知道我是廢物 但我也不能沒有爸爸 我寧願被他罵廢物


  爸爸：廢物！廢物！廢物！ 我是為你好！廢物。

  克萊文：你才應該去死 我不會讓弟弟誤入歧途的（打打打）

  弟弟：我知道我是廢物 我也很想變強嗚嗚嗚


  犀牛人：要不要當我的夥伴

  異鄉人：1、2、3

  女主角：我不能讓你知道我家族的秘密，3？媽的法克


  結束。


  整部片就這樣


  結論 男主角好帥 反派演的跟正義英雄一樣不簡單

  其他都是配角 女主角也是多餘的 除了給藥水其他沒作用


  除了那一箭以外 還好有先看甄子丹的誤判才看克萊文

  不然直接恨死。


  -----

  Sent from  on my iPhone


  --


  --'
