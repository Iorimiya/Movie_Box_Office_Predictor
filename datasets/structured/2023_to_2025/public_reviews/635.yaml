url: https://www.ptt.cc/bbs/movie/M.1714317046.A.9FA.html
title: '[新聞] 《獵人克萊文》再延檔 改12月殘暴登場'
content: "《獵人克萊文》再延檔 改12月殘暴登場\n\n2024/04/28 05:30\n\n\n亞倫泰勒強森主演的《獵人克萊文》，昨再度宣布延到年底上映。（索尼影業提供）\n\
  \n〔記者許世穎／綜合報導〕由新世代男神、被視為下一任007接班人的亞倫泰勒強森主演\n的「索尼影業漫威英雄宇宙」電影《獵人克萊文》，昨再度宣布延期，將從今年8月暑假\n\
  檔一路延到12月上映，正好填補同時改檔到明年的新版《小子難纏》（暫譯）。\n\n該片主打限制級（美國R級）超級英雄，亞倫飾演的克萊文和「猛毒」一樣是蜘蛛人宇宙\n\
  中的反派角色，先前曝光的預告可見他狠咬敵人耳朵、捕獸夾爆頭，還有血肉橫飛的打鬥\n場面，呈現克萊文殘暴的一面。\n\n電影上映日更動不少次，最初訂於2023年1月上映，後來宣布延到10月，之後因為演員罷\n\
  工改到今年8月上映，沒想到昨天再度宣布延到年底。而索尼的漫威英雄宇宙今年初已推\n出《蜘蛛夫人》，除了延期的《獵人克萊文》，10月還有前兩集都有好票房的《猛毒3》\n\
  目前尚未有變動消息。\n\n--\n 佛教的\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
