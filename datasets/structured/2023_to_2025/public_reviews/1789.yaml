title: '[好雷] 尋找第5味 (尋鮮記Umami)'
content: '大鼻子情聖男主角的日法合拍片

  開場由柄本明以日語當旁白

  描述米其林三星主廚的故事

  情聖演法國名廚，拿過三星

  但原來三星是他老婆跟米其林老闆睡來的

  (難怪台灣米其林的餐廳都很難吃，給錢就給星)

  大廚拿星拿得很不爽，又要看美食網紅的臉色

  就把餐廳丟給兒子跑去日本透透氣

  因為有件往事讓他耿耿於懷

  年輕時在米其林比賽輸給一碗麵

  評審說從麵裡面嘗到

  酸甜股辣外的第五種味覺，就是鮮味

  他就跑去日本找那個打贏他的麵店老闆

  他想說他回日本一定發大財了

  因為他自己在法國就有錢到住在城堡裡面

  他老婆是他的經紀人把他捧紅成法國國寶

  但他找到麵店發現只是一間小拉麵店

  他感覺很錯愕怎麼可能打贏他的人沒發財?

  他剛到日本錯過了班車只能去睡膠囊旅館

  他睡在膠囊裡感覺像睡在棺材裡一樣

  柄本明從他隔壁的膠囊爬出來

  帶他去膠囊旅館的澡堂洗澡

  他不在法國，兒子罩不住餐廳

  因為客人只想吃她爸做的菜

  他只能一夫當關試圖取悅黑人美食網紅

  最後兒子改變傳統菜色贏得年輕網紅的味蕾

  因為兒子沒法複製他爸的菜色只能創新

  情聖在拉麵店跟老闆到處研究鮮味從何而來

  最後很滿足的回法國，解開了多年的遺憾

  很棒的日法和拍片，別有風味

  MOD看的到，這種好片都沒人寫真可惜


  --'
