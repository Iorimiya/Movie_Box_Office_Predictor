url: https://www.ptt.cc/bbs/movie/M.1759652199.A.FD8.html
title: 'Re: [普雷] 九龍城寨之圍城(莫非我跟不上時代了?)'
content: "現在才補看完\n\n想說這部確實好看，難得港片又有可看之作，應該沒什麼人不喜歡吧\n於是就搜尋了一下，找到這篇\n\n底下dufi的回文把城寨貶得一文不值\n\
  我本身也是很講合理性的人\n好奇他對於合理的接受度如何\n查了一下看到這個\n\n推  \n(\n\n嗯。既然這樣\n能帶入海賊的我就試著帶入\n來看看城寨劇情是不是dufi所謂的不合理、難看\n\
  \n\n羅賓哪來的魅力讓全草帽團願意犧牲所有來幫他\n微微哪來的魅力讓全草帽團願意犧牲所有來幫他\n這裡不開上帝視角，一個是當時向全世界宣戰，另一個是當時和七海武開打\n\
  向全世界宣戰的部分就不提了\n當時和七海武開打，魯夫頻死，騙人布、索龍重傷\n\n另外還有其他因素喔\n不要忘了九龍城寨是龍捲風地頭\n龍捲風是什麼? 是黑色會\n\
  你來我地盤要人，還在那邊叫囂，我就直接給你?\n今天大媽說他要一個白鬍子的團員，你白鬍子你心想嗯不想犧牲什麼然後你就交人給他?\n所以不是什麼主角魅力\n要我交人?\
  \ 我的地盤我做主，這樣算是瞎挺?\n\n\n寧願賠上整團的前程，也要守護剛認識的微微\n\n護主角的部分，還有上面說的，在我地盤鬧事，我當然選開打哪可能選全聽你的\n\
  \n有幾點提一下，要說膚淺也行\n他就是賣\"人\"的魅力，尤其是龍捲風(古天樂)\n從打工開始，龍捲風、信一就都看在眼裡\n直到龍捲風請主角吃叉燒飯，給他地方住不收租\n\
  信一才問他叫什麼\n這代表什麼? 代表九龍城寨龍捲風龍哥接受你了\n你是城寨的一份子，我不信你，也信龍哥。龍哥認你，我就認你\n所以城寨中的人會互相賣命，除了「你幫人，人幫你」之外\n\
  我認為更多是因為龍捲風在，有很多人是被龍哥救的，賣命正常\n「龍哥幫你，我幫你」(接下題)\n\n\n第一次還真是未知數\n龍哥身體虛，要保主角\n你看是不是像白鬍子渾身病，還是要救艾斯一樣\n\
  難道白鬍子海賊團都不知道會造成團員多大傷害?\n但是龍哥/老爹在硬撐，戰力是有，然後其他人也願意挺\n\n\n情感變化的重點如上面所說，在角色的魅力\n然後重點是，這不是在主角身上，是龍捲風串起大家的情感的\n\
  信一、四仔是龍哥親信\n十二少被龍哥救回一命\n主角也受龍哥救助\n就，大家信龍哥。龍哥認你，我們以後就是兄弟\n就，大家信白鬍子。老爹認你，我們以後就是兄弟\n\
  \n\n就是要頂著滅團風險救艾斯啊\n\n沒大肆破壞可以想成對龍捲風還有顧忌，真正開打前誰輸誰贏還不知道\n後面是不太合理，不過把目標分清楚會比較好理解\n目標一是龍捲風和主角和城寨的打手，這裡就不留情直接殺\n\
  目標二是要城寨的地，那民眾自然嚇嚇他們，趕走就好了\n他們是黑色會，不是恐怖分子殺人組織\n\n\n如上所述，另一種解釋是因為龍捲風，龍哥\n\n滿奇怪的怎麼怎麼看海賊不會出戲，這部就會?\n\
  漫畫篇幅長相處比較久是不錯\n可是和羅賓微微的感情有到賭上整團未來嗎?\n\n紅髮沒事幹嘛犧牲一支手去救一個小孩?\n如果海賊那段看得懂，沒有疑問\n那同理，對龍捲風來說主角就是小孩啊\n\
  \n在故事裡還真的是，30年前的嬰兒現在回來了\n\n是不是因為真人演出又是在真的地名，就讓人現實了起來?\n明明問題，不大\n\n--"
