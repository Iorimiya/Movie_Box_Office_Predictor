url: https://www.ptt.cc/bbs/movie/M.1734451289.A.F61.html
title: '[好雷] 九龍城寨之圍城'
content: '防雷


















































  之前上映時瞄了幾眼評價,說是以前港片味道回來了

  嗯,的確很有以前港片的味道

  因為沒有很明顯的中國痕跡和場景:九龍城寨

  這個地方之有名,連我沒什麼了解香港都知道

  在這座城寨發生的各種事情都是龍蛇雜處的印象

  的確每個角色一個比一個有爭議

  即使是相對正義的男主角那幫人也是非法之徒

  不過總是能更有帶入感,畢竟菁英階級就那樣

  而在底端求生存的人的故事更有血有肉


  我最期待的當然還是武打場面

  大部分的打戲都很讚,雖然洪金寶才打一場很短

  看到他們這些港片大佬交手還是很感動

  尤其是他們都老了（所以可能也有替身啦）

  只是最後跟大魔王打我的意見就比較多了

  我知道這是漫畫改編,但還是覺得很豪洨

  重點是前後調性因此而變了不少

  就算前面明顯有華麗過頭的招數,還是沒有後面誇張

  我會比較喜歡全面突襲那樣的拳拳到肉啦


  不過我還是要說,對於港片已死的這個時候

  這部電影的存在是格外重要

  不只是香港武打片的驕傲,更是香港人的自我認同

  我看的時候就覺得自己也是那個時空背景的一分子

  一架飛機從一堆違建上空飛過去真的經典

  聽說好像會發展成一個系列拍下去？

  希望能持續其優點,更能延續香港人的精神！


  ----

  Sent from  on my Samsung SM-S9280


  --

  我們不應該流淚，那對內心來說，等於是身體的敗北。

  那只是證明了我們擁有心這件事根本就是多餘的


  --'
