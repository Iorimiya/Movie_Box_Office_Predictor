title: '[普雷] 九龍城寨之圍城'
content: '本人沒看過原著漫畫,所以不知道味道有沒有相差太多


  主角是原著林峯演的陳洛軍不算古天樂,設定四個角色城寨四少


  但造型特地去google了一下跟漫畫都不像,林峯就一個小平頭


  沒像漫畫那種白長髮,可能特地一樣看了會很突兀不協調吧


  覺得武打方面還可以,大魔頭是伍允龍來扛,伍也是有武打底子的


  郭富城也有客串角色,導演鄭保瑞拍這方面的武打片還算有一定水準


  之前殺破狼2也拍不錯,覺得劉俊謙最近作品蠻多的


  以香港中青世代演員來說機會算蠻多的,之後也要拍寒戰前傳


  但感覺還不足以獨挑大樑扛票房,就演個戲份不少的配角這樣


  就看以後有沒有機會越來越紅,畢竟香港老演員佔據市場很久沒養新人出來


  整體來看還可以,在香港看的好像賣得還算不錯,不知大陸票房如何


  --'
