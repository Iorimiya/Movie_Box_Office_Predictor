url: https://www.ptt.cc/bbs/movie/M.1715862668.A.251.html
title: '[新聞] 男神劉俊謙自曝看完《九龍城寨之圍城》'
content: '四季線上/劉培玉 報導


  電影《九龍城寨之圍城》上映短短12天票房破4300萬港幣（約台幣1.8億），也登上香港今

  年度票房冠軍；中國累計4.7億人民幣（約台幣21億）。台灣5月17日即將上映，坎城影展及

  英法等國都將陸續亮相，年度大作萬眾矚目。日前，劉俊謙在台接受媒體訪問，爆料拍完最

  後一場戲「城寨4少」抱在一起哭，友誼感人。他更坦承自己看完電影又大哭，感受香港電

  影傳承力量，熱血悸動。




  劉俊謙日前在台宣傳《九龍城寨之圍城》 。照片:華映娛樂提供


  劉俊謙因此片的帥氣表現，讓網路近期湧現許多仰慕他的「劉太太」，不但他的角色「信一

  」成了搜尋關鍵字，threads（脆）也幾度爆現網友洗板熱議。



  劉俊謙（中）在《九龍城寨之圍城》裡有機車特技。照片:華映娛樂提供


  日前劉俊謙在台受訪，坦言看完《九龍城寨之圍城》放映後大哭，「很多情懷是很觸動的，

  長大了以後很少感受到很熱血，透過這部片，我找到那股熱血感。好像片中『就算要死，也

  要拿回九龍城寨』的激動。」


  問及片中飾演他老大的古天樂，劉俊謙笑說對方平時話不多，但仍對後輩很照顧，例如一場

  戲他倆分別在鐵門裡外，透過門縫說話，因為是分開入鏡，拍劉俊謙時，其實不會拍到古天

  樂，但「他每一個take都會給我100％的反應」，相當貼心。劉俊謙形容「男生很多事不會

  講，但這樣就能感受他愛我們了。」




  劉俊謙在《九龍城寨之圍城》裡的武器之一是蝴蝶刀。照片:華映娛樂提供


  明星陣容古天樂、洪金寶、郭富城、任賢齊全都有精彩打戲，飾演「城寨4少」的劉俊謙、

  林峯、胡子彤、張文傑更是從頭打到尾。劉俊謙提到胡子彤因戲受傷縫了15針，隔天照樣敬

  業繼續拍。



  劉俊謙露出為拍攝《九龍城寨之圍城》燙傷小腿的疤。照片:華映娛樂提供


  劉俊謙自己則因機車特技的戲吃盡苦頭，車很重、騎的走廊又很窄，掌控重心不容易；甚至

  他的腳被排氣管燙到，小腿至今還留著疤。媒體訝異他原來隱忍傷勢，他當場捲起褲管給現

  場媒體看，「拍戲是我們的工作，不會強調受很多傷。」



  劉俊謙在《九龍城寨之圍城》中飾演信一。照片:華映娛樂提供


  劉俊謙提到尾聲令人看得血脈賁張的天台決鬥重頭戲，他說總共拍了十幾天，每天從早拍到

  凌晨十數個小時，自己都「變動作男星了」，大夥處處是傷，每天化妝時間，「化妝師同時

  變成治療師，幫我們復健。」

  ________________________________________


  雖然台灣還沒上映，不過感覺香港從5/1上映以來

  票房跟口碑感覺都蠻不錯的，目前電影前傳好像也已經敲定了

  打算在17號上映那天去看一波

  之前一直覺得劉俊謙很可惜阿 帥不用說 演技也不錯

  但好像一直沒有太好的角色

  這次信一的角色感覺很有發揮空間

  可以表現的點看起來蠻多的

  希望他能夠把握機會 應該是香港新生代有實力的演員了



  --

  看完了 電影超棒 劉的動作戲也拍得很棒 小刀耍得很讚 動作也很靈活 這部電影應該可以

  成為他的代表作'
