url: https://www.ptt.cc/bbs/movie/M.1713280149.A.945.html
title: '[新聞] 古天樂興奮《九龍城寨之圍城》打進坎城'
content: "古天樂興奮《九龍城寨之圍城》打進坎城\n\n04:10 2024/04/16 中國時報 李承陽\n\n\n古天樂（左）跟林峯在《九龍城寨之圍城》有精采動作戲。（華映提供）\n\
  \n香港動作鉅獻《九龍城寨之圍城》，由鄭保瑞執導，古天樂、洪金寶、任賢齊、劉俊謙等\n實力派巨星演出，電影在上映前獲得國際肯定，入選坎城影展午夜展映單元，讓古天樂直\n\
  呼振奮：「證明香港的動作電影依然能打進國際市場，希望在各地上映都能獲得好口碑及\n票房。」\n\n香港電影上次入選坎城影展午夜展映單元，已是11年前劉德華與鄭秀文合作演出的《盲探\n\
  》，時隔多年再度入選坎城，導演鄭保瑞開心說：「這部電影充滿了香港獨有的特色，港\n產的動作片，可以被世界看到，是個很難得的機會。」\n\n主角古天樂大感振奮，「香港電影已經10多年沒有入選這個單元了，也希望在各地上映都\n\
  能有好口碑及好成績。」另一主角林峯則說：「很開心有機會演出這部電影，希望所有工\n作人員的努力可以被世界看見。」\n\n#展映 #香港 #上映 #主角 #開心\n\
  \n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
