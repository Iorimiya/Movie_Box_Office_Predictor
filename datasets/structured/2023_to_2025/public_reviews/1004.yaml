content: '「葉問」「殺破狼」的武打動作+滿滿兄弟情

  +完美重現九龍寨城，真的是很值得一看的爽片！


  全長2個小時，有1個小時都在打，打好打滿！

  簡單劇情、節奏緊湊全程無尿點！

  優質的港產武打動作片真的不多了

  黃金年代的香港巨星已經稱夠久了

  雖然大家都說香港電影看了20年都是同樣的人

  但很明顯這批人真的也老了，且看且珍惜



  PS.最後反派強到我以為他走錯棚，他演的應該是漫威英雄片


  PS.王九真的不是郭富城演的，真的超像


  PS.任何電影我看到任賢齊都超級出戲


  PS.古天樂不是男主角，看預告都會以為古是男主


  PS.林峯雖然是演城寨四少之一，但他其實也44歲了…


  PS.請關注伍允龍，他是真的會打，還曾是謝霆鋒的師父


  ----

  Sent from  on my Xiaomi 23049PCD8G


