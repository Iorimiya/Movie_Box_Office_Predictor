url: https://www.ptt.cc/bbs/movie/M.1744097448.A.6D0.html
title: '[請益] 九龍城寨之圍城～戰力問題'
content: '剛剛在網飛上看完這部去年頗受好評的電影，真的不錯，武打部分流暢，劇情不拖泥帶水值

  得給好雷。


  只是比較疑惑的是戰力的問題，

  這部戲看起來就是老大的戰力>>>>其他人

  而大老闆方一開始就有兩個老大等級的人物了

  為什麼還要懼怕龍捲風不敢進入九龍城寨？

  我一開始還以為城寨方戰力超強，

  結果中間城寨大亂鬥可以看出大老闆方根本是壓倒性勝利。

  除了龍捲風打傷大老闆之外，其餘手下全部都只有逃命的份，

  完全沒有還手的餘地，實在想不出他們有懼怕九龍城寨的理由。


  難道說龍捲風健康就能1扛2？ 實在看不出來，

  而且一開始說是顧忌九龍城寨，

  進去以後根本看到人就開幹了哪有在顧忌對方戰力？


  然後秋哥看起來身體不好吃了很多藥戰力變弱就算了，

  虎哥的戰力也太弱了吧，被陳洛君打到倒地不起，怎麼當上老大的啊？

  反派方1個可以扛4個陳洛軍沒被找到弱點都能贏吧。


  然後三少為了掩護陳洛軍跑走，回頭殺了進去，這邊到底怎麼活下來的我也看不懂

  以當時的戰況來看根本不太可能活下來吧，還全部活命。


  總覺得戰力設定跟劇情怪怪的，看了有點出戲。不過其他部分都很好看了很過癮就是了。


  --




  在反派方兩大Boss面前，店小二感覺算不上戰力…


  所以是原作戰力就失衡了，中間大戰看起來就只有3個人有戰力，其他人都是去送頭的…

  也看不出九龍城寨有哪裡讓人顧忌


  沒錯，前面鋪陳看信一出場那個逼格害我以為九龍城寨戰力超強，結果沒想到除了龍捲風沒

  一個能跟反派方打的。要是王九沒叛變我看我看四少再過幾年也報不了仇。'
