title: '[新聞] 《九龍城寨之圍城》夯爆 古天樂、任賢齊樂傳承'
content: "《九龍城寨之圍城》夯爆 古天樂、任賢齊樂傳承\n\n04:10 2024/05/12 中國時報 翁紫曦\n\n\n林峯（左）、古天樂11日在香港出席電影造勢活動。\
  \ （明報提供）\n\n\n任賢齊（左）、劉俊謙11日在香港與粉絲互動。 （明報提供）\n\n電影《九龍城寨之圍城》在港上映11天，截至11日下午，票房衝破3500萬港幣（約1.4億\n\
  台幣），在大陸則已破4.3億人民幣（約19億台幣），是近期話題度超高的爆款港片。\n\n該片監製莊澄和葉偉信、導演鄭保瑞昨率主演古天樂、任賢齊、林峯、劉俊謙等人現身香\n\
  港尖沙咀戲院，感謝影迷支持。古天樂直言，希望電影票房能像他在片中的名字「龍捲風\n」一樣，席捲全港、獲得出色成績，並讓香港電影更上一層樓。\n\n古天樂昨表示，對目前的票房成績感到滿意，希望可以繼續加油，「這部片讓香港觀眾對\n\
  香港電影有信心，如果成績理想，不排除開拍前傳。」他現在最希望的是大家支持香港電\n影，重點不在跟其它作品較勁。《九龍城寨之圍城》5月17日將在台灣上映，近日舉辦多\n\
  場特映後，佳評如潮。\n\n任賢齊特地赴港出席活動，在片中剃頭演出的他，直言若是開拍續集，不介意再剃頭；他\n也對在台灣發展的後輩劉俊謙讚不絕口，「俊謙是最新的頂尖演員，英俊、有型，女生都\n\
  非常喜歡他」，更坦言他從《梅艷芳》就開始關注劉俊謙。\n\n《九龍城寨之圍城》被盛讚是視覺及演技的享受，古天樂、任賢齊都抱持著傳承的心態接\n演，任賢齊表示，之前古天樂找他拍戲時，已討論過要讓年輕演員接班，讓他非常感動。\n\
  戲分頗重的林峯，被看好明年問鼎金像獎影帝，他昨說不敢多想，都是導演和監製的功勞\n，很感謝他們給機會。\n\n#圍城 #監製 #直言 #導演 #古天樂\n\n\
  --\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
