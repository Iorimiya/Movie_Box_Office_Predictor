title: 'Re: [普雷] 九龍城寨之圍城(莫非我跟不上時代了?)'
content: '防雷

























  要我說的話

  1. 龍捲風跟阿占我認為可以是生死之交，而陳洛軍又是阿占的兒子，故龍捲風對陳洛軍好完全合理。


  2. 男生之間的友情本來就容易一些小事變好朋友，四個人變成生死之交的契機不是一起去扁小女孩的爸爸，然後就變成好朋友了嗎？至於陳洛軍會變成中心領導這就是情節設計了，陳洛軍就是主角，很多作品都會這樣設計。


  3. 今天秋哥被殺的不是其他人，而是自己深愛的妻兒欸，當然你覺得復仇應該找當事人，但老婆小孩都被殺了我就不相信你不會希望對方家裡也死光光。



  --

  古天樂跟任賢齊的功夫動作讓我滿出戲倒是真的'
