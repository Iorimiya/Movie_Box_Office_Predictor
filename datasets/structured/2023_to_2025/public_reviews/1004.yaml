url: https://www.ptt.cc/bbs/movie/M.1715941803.A.095.html
title: '[好雷] 九龍城寨之圍城 Hen好看'
content: "1. 打得很爽, 比犯罪城市4還爽\n   打得哪裡爽呢, 每個角色是個個都能打, 而且打法都有各自的設計\n   像是信一就是蝴蝶刀, 小刀流\n\
  \   四仔(A片)就是拳術, 陳洛軍則是(天生神力+基因)亂打流\n   龍捲風的拳有種旋風效果, 看起來就像是高強內力在發勁一樣\n   連叉燒店老闆都能打,\
  \ 用雙刀流\n   (編按: 叉燒店老闆演員叫喬靖夫, 是香港歌壇填詞人)\n   大反派王九有氣硬功(鐵布衫風格)還有金剛指法當普攻\n\n2. 每個角色各有個的帥\n\
  \   就連(相對不帥)的任賢齊都讓他帥了一下\n   打得算好看\n   至於最帥的, 我投信一一票\n\n3. 原本以為九龍城寨比較像是背景, 美術組下去求其拍了\n\
  \   結果拍得比想像中細膩很多!\n   那種生活在城寨的日常感都拍出來了\n\n4. 從順流逆流後最精彩的城巷戰\n   不過當然還是順流逆流比較屌一點\n\
  \n5. 龍捲風掛那段我以為就是大決戰了, 相當悲壯\n   沒想到之後還有,\n   有種大戰之後還有劇情的平靜跟感動,\n   通常是超過2個半小時的電影才有這種感受的\n\
  \   不過這部也有\n\n6. 用麻將排成九龍城寨的意象我很喜歡, 很好看\n\n7. 伍允龍的大Boss威壓感, 絕望感都很強!\n   除了他一直在「呀哈哈哈」的笑我覺得有點浮誇以外\n\
  \   真的感覺四個年輕主角是沒有勝算的\n   而且這部在決戰前也沒有其他故事會有的修煉呀, 練功呀的橋段\n   憑著一股熱血就直接上了,\n   讓人都不知道要怎麼收拾大反派好!\n\
  \   結果是外面刀槍不入, 所以就從內部往外刺\n\n8. 最後四個人直接站在波浪板上波浪板不會撐不住嗎\n\n--\n除了我本身不是特別喜歡林峰外\n實在沒啥好挑惕的好看\n\
  我有看過他寫的一部誤宮大廈\n不過還是對他寫的詞比較有印象\n林峰看起來就是很不討喜\n他的臉跟剛出道什麼尋秦記 創世紀不太一樣啊\n提早20年到達古天樂現在的樣子.."
