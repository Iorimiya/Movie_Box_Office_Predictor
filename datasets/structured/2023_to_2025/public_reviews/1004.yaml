url: https://www.ptt.cc/bbs/movie/M.1716011114.A.972.html
title: '[好雷] 《九龍城寨之圍城》觀影心得+贈2個小彩蛋'
content: "文 : 牛哞羊咩\n\n我以前曾花了點時間了解城寨的形成、發展、文化背景，對於這裡的生活軌跡充滿敬畏，\n也曾實地走訪當地，追尋記憶中九龍城寨的樣貌，但如今這裡早已成為香港市民休憩、運\n\
  動、遛狗的大型公園，拆到只剩下地基和鋼筋供人追憶。\n\n看完之後已經敲碗想看他們開拍續集了，因為電影裡有幾個部份讓人印象非常深刻：\n\n一、 武術設計～拼命，是為了活下去\n\
  \n承襲港漫不拖泥帶水的特性，簡單、直接、狠勁的打法，讓人有拳拳到肉的感覺，密集而\n急速的拳腳功夫讓整個電影很有特色，最亮眼的角色是身手迅捷的龍捲風 (古天樂\
  \ 飾)，\n在與阿占 (郭富城 飾) 進行最後的生死對決中拿武器對砍時，兩人都是仍招招狠戾，在\n那種不要命的打法，讓人屏息靜觀，怕一眨眼就錯過了他的精彩招式。\n\
  \n二、 鏡頭剪接～原來他們那麼能打\n\n這次參與的演員，大概除了洪金寶之外，每個人都不是動作演員起家的，但是在這部片子\n中，無論是任賢齊、林峯、古天樂、劉俊謙．．．透過電影後製人員的剪接，讓我們看到\n\
  都市武俠片那種不認輸的精神，在各場戰鬥中失敗後還能再起身還擊，這種永不放棄的精\n神和勇氣讓人敬佩，印象最深的是城寨四子為龍捲風 (古天樂 飾) 報仇時，一同圍剿王\n\
  九 (伍允龍 飾) 的橋段，每人的武力值大爆發。\n\n三、 復刻場景～還原記憶中的老城寨\n\n場景的複雜程度甚高，劇組為了考究當時的生活場景，找到不少老街坊收集當時的故事，\n\
  或是參考外國攝影師的紀實攝影，另外也參考上個世紀時，一些曾在實地取景的香港電影\n，因此得以還原九龍城寨不規則的建築風格、陳舊破敗的街市、燈光灰暗的手作代工坊、\n\
  以及充滿電線喉管的小巷，高度還原當年實景，而這部巨資3億港元的電影，有5000萬是\n用在場景架設，這張是我覺得最有fu的劇照。\n\n四、 電影配樂～上個世紀的流行樂風\n\
  \n劇中裡最吸引我的反而是官方沒有提到的2首曲目，1首是開場時的音樂，另1首是王九 (\n伍允龍 飾)成功當上老大，成為九龍城寨的新話事人時在慶功宴上唱的歌曲，讓我深深印\n\
  在腦海裡，回家查後才發現劇組很用心，特別選了80年代時紅透頂的流行音樂。\n\n(1) 陳慧嫻－1986年專輯「反叛」收錄的「跳舞街」\n\n\n(2) 張國榮－1984年專輯「Leslie」收錄的「Monica」\n\
  \n\n綜觀以上四點，這部電影完全不會讓人覺得拖戲，太多讓人印象深刻的地方了，裡面的劇\n情非常緊湊而且武打動作很流暢，其實最讓我佩服的是美術竟然把這個沒落的城寨還原出\n\
  來，也圓了我想看到真實場景的心願，最後再送給大家2個小彩蛋，希望也能讓大家感受\n一點九龍城寨的氛圍！\n\n\n【彩蛋1】\n如果你很想要了解上個世紀香港人的家庭生活方式，可以深水埗靠近嘉頓山附近的「美荷\n\
  樓生活館」一探究竟，那邊的陳設會讓人非常有感覺，如同走進時光隧道一樣。\n\n【彩蛋2】\n如果你很想要體會道地的香港巨廈特色，可以到鰂魚涌的涌益昌大廈，在叮叮車「柏架山\n\
  道站」下車，那邊禁止喧嘩打擾住民的安靜，在這裡只接受安靜的沉浸式體驗，傍晚的飯\n點時間還會飄出各家晚飯的香氣，是很有趣的嗅覺饗宴，也是個不能錯過的城市奇景喔！\n\
  \n\n完整圖文  \n\n--"
