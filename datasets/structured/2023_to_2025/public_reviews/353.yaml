title: '[好雷] 第一夫人的逆襲'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  即便從20世紀中葉開始，女性擔任國家元首或政府首腦不再是天方夜譚，多數時候，女性

  仍舊扮演「輔佐」另一半成為政治明星的角色。甚至在女性擔任總督、總統或總理都已屢

  見不鮮的今天，即使本身也從政，倘若丈夫是政治人物，「第一夫人」彷彿變成女性所能

  擔任的最高「位階」。當光芒耀眼的第一夫人不受到總統的重視，才智雙全的她也需要來

  場逆襲。



  1995年的法國，貝娜黛傾盡心力為丈夫席哈克輔選總統。她的女兒決定聘請技術顧問，全

  力挽救貝娜黛「第一夫人」的形象，開啟逆襲之路。



  「我最快樂的一天，是我靠自己在地方選舉贏得勝利。」



  乍看之下，《第一夫人的逆襲》是一部女力電影，而主角貝娜黛在片中聚焦的90年代也的

  確是一位直言不諱、暢所欲言的「新」女性，她甚至在丈夫賈克任法國總統期間與卸任後

  ，都持續擔任柯雷茲省的議員。不過，從現在的標準來看，貝娜黛仍然屈服於不少父權壓

  迫，她純粹比較敢於爭取屬於自己的尊嚴。當同在政壇闖蕩的貝娜黛向丈夫提出政治建言

  ，對方不但不當一回事，就連整個顧問團都不認為她的話有參考價值，就算歷史一再證明

  貝娜黛的政治敏感度比眾人都高。



  職場上不容她置喙也罷，就連貝娜黛第一夫人的位子都有人覬覦。當黛安娜王妃出事，總

  統府上上下下遍尋不著賈克，甚至搞到全國人民都知道他出軌，賈克日後也還是不改與多

  名女子周旋的習慣。這件事本就讓她飽受委屈，但真正壓垮駱駝的最後一根稻草是發現丈

  夫的親信居然對貝娜黛的寶貝寵物龜小便。於是，她踏上為自己造勢的旅程，不再為別人

  而活，在當時絕對能夠被稱為新女性了。



  但是，看似女強人的貝娜黛也有不容妥協的一面，那便是她的母親身分。小女兒先是失去

  最要好的朋友，其丈夫又在兩人婚後沒多久逝世，為了讓女兒重拾笑顏與生活的動力，貝

  娜黛讓女兒與先生一起共事。即便賈克當選總統後，女兒把爸爸看得比媽媽還重，她也不

  以為意，認為只要女兒事業順心就好。貝娜黛從1994年開始支持「黃色零錢運動」，甚至

  為了她患有厭食者的大女兒興建一座醫院，而當公關建議貝娜黛公開女兒的病情，以避免

  被人認為沽名釣譽，她也堅決反對，只因這是貝娜黛與女兒的約定。



  「我始終認為席哈克家最偉大的政治家是您。」



  只可惜，身為政治人物的貝娜黛最後還是屈服了。多次拒絕消費女兒病情的她，在傳記出

  版前夕，遭到丈夫的前私人司機抹黑，只好臨時將這段家庭私事納入，為自己辯駁。雖說

  因而造成母女關係生變，但貝娜黛至少達到當下她所尋求的政治效果。即使是按自己的心

  意行事的期間，貝娜黛都不忘為賈克塑造好形象，要說是她讓賈克得以擔任法國總統12年

  （2002年前的7年任期與2002年後的5年任期）也不為過。就連最後，賈克由於健康狀況與

  醜聞纏身，不便再度競選連任，貝娜黛也為了不讓先生面臨牢獄之災而與繼任的薩科吉私

  下約定。



  其實，她根本無法讓賈克支持薩科吉，但貝娜黛在電影最後於薩科吉的競選晚會上站台，

  再對記者說自己從未做過未經先生同意之事，就以極為巧妙的方式讓賈克在非自願的情況

  下表達對薩科吉的支持。至於她要求保住科雷茲省議員一事，從貝娜黛在議會的同事與當

  地居民對她的態度來看，就算貝娜黛一再提起的高鐵始終跳票，她應該還算是受人愛戴的

  民意代表。可是，薩科吉在2012年的法國總統選舉失利，未能成功連任，而賈克也在2011

  年由於在擔任巴黎市長期間挪用公款與損害公信力遭判刑，成為第一位被定罪的法國前總

  統。與此同時，人氣居高不下的貝娜黛在78歲的高齡都還成功當選議員，直到83歲才正式

  退出政壇。



  「這次是拉格斐打來的，他聽起來很生氣。」



  《第一夫人的逆襲》以喜劇的方式呈現貝娜黛在丈夫擔任法國總統期間所面臨的公關危機

  與形象改造。起初是因為她在鏡頭前批評賈克的內閣，而讓女兒氣得跳腳，遂幫貝娜黛聘

  請一位公關顧問。一開始，她還百般不願，沒想到伯納與貝娜黛一拍即合，而且伯納是打

  從心底認同她的行事與為人，所以相當用心地為貝娜黛量身訂做改造計畫，其中更大大利

  用她直率的發言與率直的個性，把貝娜黛塑造為如同黛安娜一般人見人愛的政治明星。



  有趣的是，片中還刻畫出她與「老佛爺」拉格斐的好交情。從電影一開始，貝娜黛就展現

  出絕佳的時尚品味，只是她可能忙於政事久未添購新衣，讓時尚大帝氣得直跳腳，某次乾

  脆直接致電伯納，並帶上自己近年的最新服飾來好好幫貝娜黛改造一番，以免世人以為拉

  格斐從1998年之後就江郎才盡。靠著伯納與拉格斐的努力，她不但成為年輕人爭相接觸的

  政治人物，也一改過去暴躁、老氣、過時又嚴肅的負面形象。



  「我從未做過未經我先生同意的事。」



  不過，不論貝娜黛的外在形象如何改變，內心裡她還是十分傳統的女性。在《第一夫人的

  逆襲》，我們多次看到貝娜黛屈服於賈克的要求，就連身在丈夫競選團隊內的小女兒都問

  ，這些年來爸爸不斷外遇，為什麼她還不離不棄，貝娜黛只回答自己依舊愛著賈克。甚至

  在連任成功之際，整個顧問團都認為是她的功勞，要貝娜黛發表一段演說，賈克都遞上紙

  巾訊息要她閉嘴，而貝娜黛也乖乖照辦。在外人看來，她或許非常前衛，但貝娜黛也只是

  想好好扮演妻子的角色，無奈過去不受尊重才讓她不得不為自己發聲。



  即便如此，《第一夫人的逆襲》畢竟還是從貝娜黛的角度出發的作品，就像片中的合唱班

  所唱到，這終究還是電影，大家當作娛樂看看就好，一笑置之。即使賈克在片中的形象好

  像很負面，他依然是法國人心中第二喜歡的第五共和時期總統。不知道現年91歲高齡的貝

  娜黛會如何看待這部電影，但稱此為她精彩又傳奇的一生之濃縮寫照應該極為貼切吧。


  --

  Viola''s World：Screen Scream影迷尖叫屋


