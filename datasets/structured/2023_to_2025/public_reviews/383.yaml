url: https://www.ptt.cc/bbs/movie/M.1746439590.A.E74.html
title: '[普雷] 聖夜：惡魔都市'
content: '因為我很喜歡馬東石的動作片，所以這部當然也要看看



  結果非常失望


  以一部動作片而言，打戲沒多少是硬傷


  片長90分鐘，大部分的時間先角色背景跟事件起因就算了，但那個驅魔儀式明顯是拖時間吧


  為了不讓儀式順利，還安排老套的家屬降智搞破壞，最後還不是靠拳頭



  最讓我不滿的就是結尾，以為要戰鬥爽了就戛然而止，劇組明顯想拍第二部才這樣拖時間吧


  還是說劇組不是想拍動作片而是恐怖片？


  拜託，你們都請馬東石來拳打惡魔了，觀眾是恐怖的起來嗎



  如果是電視劇的第一集我會覺得很精彩，作為一部電影這樣不行












  --'
