title: '[無雷] 恐怖感恩劫'
content: "2007年昆汀・塔倫提諾拍攝了一部B 級電影［不死殺陣］。\n［不死殺陣］故意用B級的手法拍攝30、40年前電影的粗糙感，電影開始前還拍了一連串的假預告片，沒想到16年後真的有兩部假預告片被拍成電影了，這一部［恐怖感恩劫］就是其中一部電影。\n\
  \n這部電影出乎意料的大部分合邏輯、有創意，導演Eli Roth果然是剝削電影的專門戶。\n喜歡驚聲尖叫類型的人推薦去看。\n-----\nSent from\
