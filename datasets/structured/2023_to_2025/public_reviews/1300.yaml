title: '[普雷] 恐怖感恩劫     '
content: "1. 開場戲蠻不錯的, 用的是黑色星期五的搶購\n   留下了夠多的支線\n   讓觀眾猜誰是兇手\n   這就是90年代那種猜誰是兇手的電影\n\
  \   (驚聲尖叫 下一個就是你 到底是誰搞得鬼 活人破膽...etc)\n\n2. 當我發現有個角色好雞掰應該會被首殺時\n   她就被首殺\n\n3. 兇手不難猜\n\
  \   劇情也很爛的一下就把該刪去的人突然就刪去了\n   剩下的兇手名單屈指可數\n   原本還猜會不會有雙兇手之類的, 也沒有\n\n4. 兇手死掉的梗也不怎麼樣\n\
  \   青青菜菜的就照著鋪的梗被幹掉了\n\n5. Eli Roth真的不要在拍片了\n   專心當故事發想就好\n   他每部片都概念不錯 實際上電影卻不怎麼樣\n\
  \   (恐怖旅社 當辣妹來敲門 食人煉獄...etc)\n\n--"
