title: '[普好雷] 花便當的記憶 笑中帶淚'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  \n防雷區的無雷心得\n\n上週看完超越時空的初吻之後一頭霧水\n\n開始擔心自己是不是失去日本真人電影的鑑賞能力了\n\n(之前看超時空武士明明就看得很感動...)\n\
  \n還好這部讓我重拾信心XD\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n\n先說我是沒看過原著的觀眾,\n當初看到預告片覺得設定挺有趣的就看了XD\n整體來講不錯,\n以日本真人電影來講可以給好雷了.\n\n當然也有日本真人電影節奏過於拖沓的通病,\n\
  所以最終個人是給普好雷XD\n(個人較偏好資訊轟炸的片)\n(節奏慢可以\n 但給出來的資訊量要足夠)\n\n大概提幾個個人比較有記憶的點:\n\n-畫面漂亮,\n\
  \ 而且不會柔過度.\n 光影該有的氛圍都有辦法營造得很好.\n 尤其男女主角幼年時去找繁田爸爸那幕,\n 最終搭電車離開時那個月台畫面真的漂亮!\n (有小bug啦\n\
  \  那時候列車先行應該不是LED\n  不過這不是很重要XD)\n\n-搞笑與催淚比例很不錯,\n 比較不會膩,\n 而且衛生紙壓力沒那麼大(欸\n\n-男女主角與繁田爸爸演技真的不錯\n\
  \ 尤其爸爸那個最終新娘答禮時\n 祝福 -> 震驚(壓抑) -> 難過(壓抑) ->祝福\n 那個細微轉變真的滿不簡單\n\n-雖然我沒看過原著,\n 不過設定給完之後劇情就通通猜得到了XD\n\
  \ 算是小缺點吧.\n 像是最後繁田家搭電車回去那幕一出來\n 我就知道接下來要演啥了\n 而且一定會扣回花便當\n 不過本來這部賣點就不是轉折\n 而且處理得不錯有感人到\n\
  \ 不是什麼問題.\n\n-整體節奏還是慢,\n 不過既然都是日本真人電影了,\n 計較這個不如不看(唉\n (奇怪 日本動畫明明就沒這問題)\n\n-最後婚禮演講那段\n\
  \ 鏡頭聚焦在女主角臉上實在太久了啦XD\n 感動的心情都被稀釋了\n 我是覺得精簡一點果會比較好\n (而且一直拍正臉..\n  側臉好看很多\n  要不然不要用那個髮型嘛)\n\
  \n-女主角在杜鵑花田的鏡頭出現兩次\n (幼年與成年)\n 我本來期待會有像是模仿遊戲\n 主角在電腦前那段\n 透過調整景深的方式訴說女主角的心境/狀態\n\
  \ 但是沒有 可惜(欸)\n\n\n整體而言我覺得有一定水準,\n推薦給喜歡日本真人電影的觀眾.\n\nPS: 這部跟今年早些上映的超時空武士我覺得都不錯\n\n\
  \ 這部是整體而言處理都很不錯\n  沒有什麼太尷尬或是讓你觀影情緒斷裂的劇情\n\n 超時空武士則是重點處理的極優秀(武士對決的悲壯宿命感)\n  (嗯 但其他大部份都很尷尬XD)\n\
  \n--"
