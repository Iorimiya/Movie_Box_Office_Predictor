title: '[新聞] 井勇佑談《29號公路》 提關鍵角色非綾瀨遙'
content: "井勇佑談《29號公路》 提關鍵角色非綾瀨遙莫屬\n\n《29號公路》（Route_29）於6月27日於台北電影節舉行全台首映，導演森井勇佑（\n\
  MORII_Yusuke）特地來台與影迷見面。（台北電影節提供）\n\n【大紀元2025年06月29日訊】（大紀元記者馬維芬報導）日本電影《29號公路》（Route\n\
  29）27日於台北電影節舉行首映，導演森井勇佑昨天（28日）在中山堂出席媒體茶敘，分\n享本片創作歷程與拍攝幕後，他透露在劇本完成時，直覺的認定關鍵角色「非綾瀨遙莫屬\n\
  」。\n\n綾瀨遙在電視節目上流露最真實的樣貌，這讓導演明確感受到「她就像是獨立存在於世的\n個人，而不是明星的氣場特質」。\n\n本片由《呼叫愛美子》導演森井勇佑自編自導，以溫柔又幽默的筆觸描繪一段關於陪伴與\n\
  理解的夏日旅程。\n\n《29號公路》改編自中尾太一的詩集《二十九號公路，解放》，以日本實際存在的國道命\n名，講述一位沉默寡言的中年清潔工受託尋找一名女孩，兩人從姬路市出發，一路展開一\n\
  場漫無目的的旅程，途中邂逅各種看似平凡卻耐人尋味的旅人與風景。這段旅途不僅串起\n兩段孤獨的生命軌跡，也映照出導演對人際關係與生命狀態的細膩觀察。\n\n\n\
  《29號公路》（Route_29）於6月27日於台北電影節舉行全台首映，導演森井勇佑（\nMORII_Yusuke）特地來台與影迷見面。（台北電影節提供）\n\n\
  在拍攝過程中，綾瀨遙偶爾顯露對角色解讀的徬徨感，也讓導演更加篤定她和清潔工紀子\n的角色氣息不謀而合。他也分享與綾瀨遙及童星大澤一菜的合作溝通，是以不帶有「演戲\n\
  」的目的性，去感受和內化角色，讓角色自然成形。\n\n森井永祐還開心表示，他非常喜歡漫無目的在街頭亂晃，認為文．溫德斯的《公路之王》\n邊走邊拍攝是非常理想的創作方式，如有機會很樂意挑戰走路環台。\n\
  \n《29號公路》是森井勇佑繼《呼叫愛美子》後的第二部長片，再度攜手童星大澤一菜合作\n，並邀請綾瀨遙領銜主演，還包括市川實日子、高良健吾、河井青葉等實力派演員參與演\n\
  出。\n\n2025台北電影節6月20日至7月5日在台北市中山堂、信義威秀影城、光點華山電影館舉辦\n。\n\n責任編輯：劉宇涵\n\n\n\n--\n   \
