title: '[好雷] 絕美波麗露'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  全世界由於疫情停擺三年，但影視作品裡演員們各個脫下口罩拍戲，彷彿螢幕內外的世界

  真的完全不相關似的。義大利藝術電影《絕美波麗露》結合LGBTQ、疫情與音樂等過去三

  年間穿梭在我們日常生活中，但卻被刻意掩蓋的元素，交織出這部感官與視覺的藝術饗宴

  。



  本片獲得紐約影展最佳演員獎、美國奧斯汀影展國際影展最佳導演、女主角，《燦爛時光

  》影后莉迪亞‧維塔主演，電影在義大利Covid-19封鎖期間拍攝。



  影片以一座古老的教堂為背景，電影在義大利最先染疫的地點洛迪醫院的教堂實地拍攝。

  全片管風琴音樂充滿生動激昂的配樂，與銀幕上的頹廢視覺與主角之間不穩定的親密感互

  相呼應。



  女主角莉迪亞·維塔威嚴渾厚的嗓音和霸氣的表演，讓《絕美波麗露》呈現一種更強勁和

  壓抑的能量。



  片名採用法國作曲家拉威爾的《波麗露》，片中學徒女配角露西亞也在第一次見到這首曲

  子的樂譜就愛不釋手，不斷央求管風琴修復師羅克珊教自己彈奏這首樂曲。因為整首曲子

  ，小鼓自始至終都打著相同的節奏，而且從頭到尾不間斷，所以是一首負責打擊的樂手會

  瘋掉的作品。唯一的變化就是漸強，就像《絕美波麗露》的電影情節，層層堆疊，越來越

  強的感覺。



  探究這首舞曲隱含的情節會發現，故事裡酒店的酒客在最後情不自禁的與翩翩起舞的少女

  一起共舞，如同電影中羅克珊最終情不自禁地與露西亞共舞一般。這首樂曲是拉威爾的最

  後一部舞曲作品，也象徵變化無窮的新音樂與新音樂的時代，就像身處疫情風暴之中的主

  角們，理應期待著疫情撥雲見日後的新時代，卻陷入更恐怖的人性貪婪與黑暗，即便沒有

  確診染疫，每個人卻也再也回不去電影開始之初的樣貌。



  故事發生在教堂，算是對劇中不少情節安排的反諷。除了好心收留少女、金餐具還被洗劫

  一空的保羅之外，露西亞與羅克珊完全沒有由於接受洗滌人心的教堂樂音洗禮而成為更好

  的人。露西亞「打工換宿」的期間將腦筋動到教堂裡的名畫與金器銀器，但其實整座教堂

  也就三個人，疫情期間也沒有太多閒雜人等走動，保羅早早起疑；羅克珊則是從電影開始

  到最後都非常暴躁，充滿暴戾之氣，一點也不像長年在教堂內工作的人，最後甚至不分青

  紅皂白就醋勁大發，將露西亞的哥哥殺掉，讓神聖的教堂蒙上不潔的陰影。



  能夠有一部電影從疫情的角度出發是很好，而且還是在義大利最先染疫地拍攝，意義非凡

  。的確，全球停擺三年，但不論是何時出品的影視作品，劇中人全都若無其事地過著正常

  生活似乎有點超現實，但若只是消費疫情而不是真正將現實生活中存在疫情的事實融入電

  影當中，那倒不如好好拍一部疫情不存在的電影。



  故事裡基本上只有保羅、露西亞與羅克珊三人，而且他們共同生活在教堂這個屋簷下，的

  確像是一家人一樣，相處時不戴口罩似乎也滿合理，但電影一開始保羅明明時時提醒羅克

  珊要把口罩戴好，也叮囑初來乍到的露西亞，只要外出一定要戴口罩，回教堂後要進行全

  身消毒，但隨著劇情推展，劇中人再也沒戴過口罩，突然之間「疫情」在本片的存在感大

  幅降低。唯一與故事相關的大概就是教堂上掛著斗大的布條寫著「一切都會過去、會好轉

  。」而在《絕美波麗露》的世界裡，一切不但沒有過去、不會好轉，還完全變了調。



  不管是露西亞的貪念，還是羅克珊的嫉妒，都是慾念的展現。如同先前所說，這與教堂的

  背景設定形成強烈的對比，但細究這兩個角色的動機，似乎又難以讓人體會她們會做出相

  對應行為的原因。不來教堂寄宿的話，露西亞與哥哥相依為命固然可憐，而她又是瘖啞人

  士，可能不能像哥哥一樣去做其他的打工（那時候還有什麼工可以打也不得而知），但倒

  也不至於看得出露西亞會以竊盜教堂財物為目標的原因。至於羅克珊，固然欣賞露西亞的

  才華，對她從一開始的嫌惡到後來漸漸日久生情，但這段師徒之間的忘年之交比較像是家

  人與夥伴，除了管風琴課之外，兩人其實也沒有太多單獨相處的機會，最後怎麼會突然搖

  身一變變成愛戀，讓人想也想不透。



  不過，《絕美波麗露》的確有好好利用管風琴元素，除了羅克珊故意按壓管風琴琴鍵，試

  圖叫醒露西亞的刺耳巨響，以及管風琴課時的優美樂音之外，全片配樂也都有管風琴的悠

  揚樂音，在大銀幕上觀賞最能感受聽覺上的震撼。搭配兩位主要演員的精湛演技，一位收

  斂，一位外放，管風琴的配樂也時強時弱，不同的力度與角色的情緒起伏相輔相成，讓觀

  眾在欣賞兩位演員精彩飆戲的同時，能夠忘卻劇情發展上的瑕疵，瑕不掩瑜。


  --

  Viola''s World：Screen Scream影迷尖叫屋


