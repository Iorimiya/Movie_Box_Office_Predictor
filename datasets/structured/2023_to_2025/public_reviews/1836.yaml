  不想被劇透的記得回上一頁\n\n*新劇場版2/16最後一天\n想看還沒看的要抓緊時間了!!\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n電影開頭，就是新劇場版的回顧，畢竟這個新劇場版跨越年度十分之長。\n\
  回顧的都是重點\n\n新劇場版序\n1. EVA的真實身分，但是仍然沒有說清楚\n　　第一次衝擊也許是黑之月莉莉絲，\n　　而第二次衝擊則是葛城博士為了驗證學說，由四位光之巨人(亞當們)引發的，\n\
  　　而EVA是亞當的複製體、初號機是莉莉絲的複製體、\n　　初號機的核心裡面有自願當人柱的碇唯\n　　甚至，EVA(夏娃)這個寓意，當人柱的碇唯用意是要初號機保護兒子碇真嗣\n\
  \n\n2. 碇真嗣的被動懦弱、勉強自己以迎合他人的彆扭個性\n3. 碇源堂的冷漠與陰謀家的身分\n　　刻意安排綾波零去接觸碇真嗣，以達成自己的陰謀\n　　序當中一次，Q又一次，真的是所謂的計策翻來覆去就只有一種\n\
  　　但這個老把戲最後翻車了，新劇場版終第二次的與綾波零道別，\n　　沒有讓碇真嗣崩潰反而讓碇真嗣成長了\n\n4. 人類補完計畫第27次報告書 (舊TV版是第17次報告書)\n\
  　　和舊TV有許許多多細節上不同，表明了這是兩條不同的時間線\n　　在新劇場版破當中碇源堂和冬月耕造上月球時提到:\n　　現在的Seele已經不按照死海文書進行補完\n\
  　　而是依照死海文書外典，這造成補完計畫和舊TV差距的原因\n\n5. 綾波零的吸引力(2001/03/30)\n　　在新劇場版序與破當中，滿足14歲碇真嗣對母親需求的是:\
  \ 葛城美里與綾波零\n　　滿足對異性性吸引力的是綾波零與明日香，\n　　綾波零身兼雙重優點勝出，這個時間段的綾波零是無敵的\n\n(一)二子山屋島作戰對決第六使徒前，\n\
  　　擔任守護者的綾波零右手緊握裝有碇源堂眼鏡的眼鏡盒，\n　　月光下背對著碇真嗣說\n　　\"你不會死的，我會保護你。\"\n　　\"除了與眾人的羈絆之外，我一無所有\"\
  \n　　\"Sayonara\"\n\n\n(二)面對第八使徒的星塵作戰(X)衛星軌道下墜作戰時，\n　　坐在初號機插入栓裡面待機的碇真嗣感受到異樣的感受\n\
  　　感覺到安心感的碇真嗣有些疑惑: 好懷念的感覺，是媽媽的的氣味?\n　　而後碇真嗣緩緩睜眼，那是: \"綾波的的氣味\"\n　　(除了綾波零以外，媽媽也是綾波，綾波唯)\n\
  \n\n6. 葛城美里的補償心理(1986/12/08)\n　　幼時第二次衝擊帶來心理創傷，看到碇真嗣後對其產生心理投射，\n　　真心為了碇真嗣好，在碇真嗣勉強自己附和碇源堂的需求企圖獲得獎勵時，\n\
  　　告訴碇真嗣\"必須誠實對待自己\"\n　　直到新劇場版破最後，碇真嗣誠實面對自己想要拯救綾波零的心意時，\n　　葛城美里發覺碇真嗣那彆扭的心終於坦率了，讓碇真嗣順從心意。\n\
  \n\n\n新劇場版破\n7. 明日香的吸引力(2001/12/04)\n　　一開始就知道自己是複製人的傲嬌公主，但到了新劇場版終才揭露，\n　　第八使徒決戰後因為自己沒有強大到能單獨解決使徒，自尊有點受傷\n\
  　　跑去擠在碇真嗣床上，但卻發現碇真嗣因為被碇源堂誇獎發自內心的開心\n　　兩人之間的情愫從這裡開始，而後在煮菜事件後\n　　為了成全碇真嗣而在三角競爭中退讓，轉去駕駛三號機，\n\
  　　BGM響起林原めぐみ的今日の日はさようなら，歌詞唱到\n　　\"今日此時我們彼此道別，直到再會的那日，相信彼此永遠將喜悅呵護心中\"\n　　初號機咬碎了明日香的插入栓\n\
  \n　　連著EVA-extra-extra跟新劇場版看可以體會傲嬌公主的傲嬌魔力\n　　因為自己身世的緣故，明日香的個性脆弱又扭曲，表現的是強大自信有主見，\n\
  　　其實是掩飾自我彆扭的個性\n\n*新劇場版終，插入栓又一次被13號機咬碎...\n\n8. 渚薰(2000/09/03)\n　　神秘的人物，複製人的身軀但有著使徒的靈魂，與Seele的人類補完計畫目標一致\n\
  　　因為碇真嗣過早發動第三次衝擊，Seele與Nerv都還未準備好，\n　　於是由渚薰開Mark06在新劇場版破片尾中段第三次衝擊，\n　　這個不完整的第三次衝擊稱為\"\
  近三衝\"\n　　在初號機被封印的14年間發生了: Seele與Nerv翻臉由渚薰接替Nerv司令\n　　Seele/Nerv發動第三次衝擊，Dummy系統控制Mark06砍下白莉莉絲的頭\n\
  　　並與白莉莉絲融合，聯合國及加持良治與之翻臉，\n　　進攻Nerv並搶奪Wunder戰艦，之後渚薰留在Nerv\n　　\n*體內有S2機關的EVA冠有Mark字樣，正式冠名從Mark06開始，\n\
  四號機的實驗失敗所以沒有冠名(也就是直接拿使徒改造的EVA)\n\n\n9. 真希波瑪理(2001/03/31)\n　　神秘的人物，戲謔的語氣以及昭和時期的用語，對碇源堂的平輩稱呼，\n\
  　　透露了真希波的年紀，由於組織發展的歷史因素，隸屬Seele的諜報部門，\n　　但卻是繼承碇唯計畫及意志的執行者，\n　　雖然內容不詳但與Seele/碇源堂的不同\n\
  　　本體是1982年出生，與碇唯、冬月耕照、碇源堂十分熟悉，\n　　碇真嗣剛出生不久眾人在研究室有合影一張照片，真希波在右下角\n　　複製人的實驗者，晚綾波唯(綾波零)複製體一天出生\n\
  　　腳色的設計概念是讓庵野秀明能從EVA中解脫的人，是命運的破壞者以及旁觀者\n\n\n作為Q開頭作戰之前120分時的漫畫EVA-extra-extra大意劇情：\n\
  在新劇場版破的最後碇真嗣為了救綾波零，同步率達到400%的後果就是化為LCL\n14年後Wille為了對抗Nerv，安排二號機與八號機上衛星軌道將被封印的初號機帶回\n\
  準備給Wunder戰艦當作動力來源，看著載運八號機的火箭餘焰與煙塵\n一臉寂寞的明日香心中想的是14年前碇真嗣的笑容\n\n同樣的星空下，看著二號機與八號機飛上月球軌道還有在Nerv本部的黑衣綾波零\n\
  \n\n\n新劇場版Q\n10. 明日香的直拳\n　　激烈的感情才會想打人，不管是明日香、鈴原櫻、北川粉毛都是\n　　不管是愛還是恨\n\n11. 凌波零\n\
  　　黑衣的綾波零：碇源堂計畫中的棋子，為了達成目的，刻意用複製人早期型號\n\n12. 渚薰與碇真嗣的碰面\n　　對碇真嗣來說，履行了母親職責的是葛城美里，而履行了父親職責的就是渚薰\n\
  　　同時還身兼知心大哥哥的身分、一起寫在生命之書上的人，\n　　修好了\"逃避可恥但有用\"的隨身聽，從在月球上對著碇源堂喊爸爸來看，\n　　身體是複製人，DNA資料不是碇源堂就是碇真嗣\n\
  　　碇源堂計畫中的棋子\n　　渚薰一直說他與碇真嗣很像，但碇真嗣卻說渚薰像\"爸爸\"，\n　　這邊很難說到底是像父親還是像碇源堂呢\n　　我猜大概是碇真嗣的複製人吧\n\
  \n\n\n新劇場版終\n\n\n\n一. 巴黎作戰\n\nWiile為了取得必要的戰略物資修復受損的EVA強襲巴黎，並帶出\"L結界\"一詞\nNerv違反了聯合國梵諦岡條約，將EVA軍事武器化來遲滯Wille\n\
  巴黎作戰成功之後，反L結界柱啟動將巴黎淨化，\n赤木律子這才打開了面罩，透露出L結界就是那紅色的世界，未淨化前是有危險性的\n而葛城美理讓Wille搬運JetAlone的機體以及許多EVA零件，\n\
  JetAlone是舊TV版出現過的機器人，在稍後用來跟二號機縫合\n\n最後真希波站在八號機插入栓中講著: 無論你身在何方，我都會接你出來的，小狗君。\n\n\
  *真希波稱晚輩都用外號，整部新劇場版終只有四次稱呼碇真嗣為\"真嗣君/碇真嗣君\"\n，其他都是小狗君\n\n*舊TV中的JA代表的是人型機械與神經生物兩大理念的對決，\n\
  而在陰謀詭計之下JA失敗了\n雖然新劇場版沒有演出，但我認為這段也是存在於新劇場版的，只是沒演出而已\n舊TV中碇真嗣得知葛城美里要獨自進入高溫的核動力室中斷JA的暴走時\n\
  碇真嗣:\" 怎麼這樣，很危險的啊。\"\n葛城美里:\" 不用擔心，初號機會好好的保護你的。\"\n碇真嗣:\" 不是我，我是說你啊，這樣對美理小姐你太危險了。\"\
  \n\n\n二. 第三村\n\n由於計畫偏差，新劇場版破中最後綾波零出了意外\n導致其必須與碇真嗣觸發的事件無法達成，於是Nerv派出了綾波零(黑)，\n也一直故意不發命令，就是為了達成\"\
  觸發的事件\"，\n特地準備的綾波零早期型號由於沒有在學校社會化的經驗，言行舉止像工具多過人，\n綾波零(黑)在第三村是成為人的歷程\n\n相田劍介駕駛SUZUKI吉普車接明日香碇真嗣綾波零前往第三村，\n\
  這是一個由大多數第三新東京市存活下來的人組建的村落，反L結界圍繞的人類淨土\n\n在床上醒來的碇真嗣一睜眼，出現的是28歲的鈴原冬二，\n\n*在新劇場版序中因初號機作戰波及妹妹鈴原櫻，生氣的鈴原冬二出拳打了碇真嗣，\n\
  之後烏賊頭第五使徒入侵，鈴原冬二與相田劍介意外進入插入栓旁觀戰鬥，\n發現碇真嗣是強迫自己在自我崩潰的邊緣與使徒進行戰鬥，\n自此對碇真嗣抱有愧疚之情，\n14年後的兩人都希望能回報碇真嗣，讓他能夠自此安穩平靜的過日子\n\
  \n鈴原冬二接待了碇真嗣與綾波零並招呼他們一起回家。煮好晚餐端出來招呼眾人用餐\n端給綾波零(黑)的是一碗裡面有著蔥跟魚肉的稀飯\n\n\n*新劇場版破中，加持良治招待學生們去參觀海洋館，碇真嗣拿出準備的餐點，\n\
  明日香、加持良治、鈴原冬二與相田劍介均十分讚賞餐點的美味，\n加持良治對碇真嗣說:\"真嗣，會做飯的男人很受歡迎喔。\"\n鈴原冬二頭擺過一邊說著:\"我不認同，這不是男人該做的事情。\"\
  \n\n此時碇真嗣注意到一旁的綾波零並沒有吃，\n綾波零解答道:\"並不是不合口味，只是我不吃肉。\"\n於是碇真嗣遞給綾波零一碗味噌湯\n\n14年前後對比，鈴原冬二歷練後成為一個成熟的大人，\n\
  不是以前那個冒失去搶綾波零便當的小鬼\n還有那個冒著熱氣的端在綾波零(黑)手中的湯，一切這麼相似，卻又全都不同\n\n*雖然時間線不同，但是在看到洞木光幫鈴原冬二蓋被子時那溫馨的眼神，\n\
  覺得這個時間線太好了，\n舊TV版班長洞木光戀情一開始，就是鈴原冬二要開三號機而缺席。\n洞木光挑選做要給鈴原冬二便當的菜色時，初號機正拔出纂爆鈴原冬二的插入栓。\n\
  \n\n隨後相田劍介也來訪，並提議讓碇真嗣去相田劍介家中住\n回家路上的相田劍介一邊走一邊對碇真嗣聊天，\n其中提到的人名，只有對鈴原冬二叫\"冬二\"，其他人都使用姓來稱呼，\n\
  是帶有距離卻不會傷人的溫柔\n\n\n屋子還住著另一個駕駛員--明日香\n相田劍介介紹道\n\"這位是先來的客人，會暫時住一陣子，因為一些因素式波不能在村子露面\"\
  \n從舉動我是這樣解讀\n第一，明日香是客人，從稱呼上看二人並不是親暱的關係，至少相田劍介對明日香不是。\n第二，相田劍介希望碇真嗣長住於此。\n第三，相田劍介知道明日香的心理有問題，所以把碇真嗣帶回來。\n\
  \n碇真嗣的頹廢果然讓明日香看不下去，\n明日香會計算碇真嗣什麼時候該吃飯，會跟蹤碇真嗣跑去哪裡\n作為一個不被視為戰力資源的人來說，\n這些關愛並不是Wille的人該有的，也不是同事或同學該有的\n\
  是真的關心碇真嗣的人的表現\n(可參考鈴原冬二與其岳父對碇真嗣的態度差異)\n\n與綾波零交談時，提到綾波型號對碇真嗣的感情是設定造成的，\n為什麼複製人要有感情呢，明日香也好，綾波零也好\n\
  他們原本被製造出來是作為工具使用的，\n可是眼前的綾波零(黑)為了碇真嗣的去處憂慮\n自己這14年的繾綣愁思，哪一個不是被有了人心之後造成的呢\n\n*新劇場版終後半碇源堂自白時也提到\n\
  \"不確定碇真嗣對碇唯的再現是不是必要的\"，碇唯複製失敗的原因或許並不單純\n\n\n離家出走的碇真嗣又一次看到綾波零的幻影，代表碇真嗣又一次走上了命運舞台\n\
  不管是碇唯希望的，\n還是綾波零希望的。\n甚至也可能是碇源堂希望的。\n綾波零的幻影在舊TV到新劇場版都有出現，代表神諭之類的意思吧。\n\n耍孤僻的碇真嗣坐在Nerv第二支部N109遺址原地不知道幾十天，\n\
  期間PPT配著BGM: Hand of Fate\n歌詞同時指向碇真嗣與綾波零(黑)，畫面顯示綾波零(黑)不只一次去找碇真嗣，\n然後旁邊還躲著偷窺的明日香。\n\
  \n在碇真嗣被綾波零(黑)開導之後，回到相田劍介的家，與PPT時一樣\n貼心的明日香已經把DSS項圈遮起來了，居家時用的是圍巾，外出是高領戰鬥服\n當然實際不知道是心疼糧食還是不爽看到自己就嘔吐還是單純貼心，就各自解讀了\n\
  明日香意味深長地問了碇真嗣: \"早期款(綾波零)還正常嗎?\"\n明日香都知道綾波零(黑)是早期型號了，早期款的缺點自然也清楚，\n對必然會發生的事情已經預知到了\n\
  \n綾波零(黑)持續著日常生活，第三村的日子確實的讓她更有人味，\n比起母親鈴原燕更黏綾波零(黑)，而綾波零(黑)也很喜歡鈴原燕，\n前者可能是LCL跟莉莉絲的緣故，後者可能是碇唯的記憶造成母性的覺醒\n\
  綾波零(黑)享受著日常，但疑問也在心中滋生\n自己是只能活在培養槽的人，是需要回Nerv調整的，為什麼Nerv沒有傳來任何命令呢\n看著手上失去LCL平衡的病徵，綾波零(黑)也預知到了必然會發生的事情。\n\
