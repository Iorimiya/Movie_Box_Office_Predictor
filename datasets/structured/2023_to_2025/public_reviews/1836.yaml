title: '[好雷] 新世紀福音戰士新劇場版終 evangelion'
content: "雷文防雷資訊頁\n\n\n\n星期天二刷了新劇場版終，看的4DX版，可是沒有海報\n太難受了\n\n看完後去三創給咖啡廳騙錢\n順便曬一下CD\n\
