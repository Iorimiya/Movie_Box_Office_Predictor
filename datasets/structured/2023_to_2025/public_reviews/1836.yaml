url: https://www.ptt.cc/bbs/movie/M.1677499026.A.98D.html
title: '[普雷] 新世紀福音戰士新劇場版終'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看完只能說

  戀愛的美好，就讓它長存於心中無限回味

  不需要為了一個結果，而用婚姻葬送它阿

  舊EVA的迷人之處，是給人一種幽微、深沉的氛圍，如同日本文學、音樂

  劇情、人物性格的鋪陳，都是建立這樣的氛圍下慢慢的引出情緒的張力

  夏日的蟬鳴、夕陽下的電線桿、久久定格的沉默片段等，都是舊EVA的名場面

  簡短而發人省思的哲學及宗教對話，彷彿讓人的意識飄浮在空中流動

  這些都是EVA作為區隔其他動畫片的重要標誌


  但這些在終裡幾乎蕩然無存

  開場就直接開打，打完小囉囉換大魔王，是在打game嘛

  進到村子的劇情，開始無意義的冗言廢語，好像在跟這三大角說，尤其是真嗣

  真實的生活，就是在這些日常的對話、寒暄中度過的優

  你們不該再像舊EVA一樣，沉浸在自己內心世界，該長大了

  真得沒必要，看到快睡著，看EVA不是來看這種廢話的

  再來就是眼花撩亂的大開戰了，說沒鋪陳也不是

  就是鋪陳的太簡單了，為了阻止碇源堂引發第四次衝擊，這跟世界末日片有啥不同

  世界末日片還會鋪陳前段的緊張感，這緊張感0阿，大戰前培養點情緒不是常識嗎

  不然就像TV版使徒直接殺進來，也是一種緊張，閒聊一下就開幹真的大扣分

  打鬥畫面多半太過浮誇或無聊，瞬秒掉小摟摟跟父子換場打架真的是搞笑

  EVA標誌性的斷臂、噴血、啃食，主角受重創狂嚎還是奮力幹到底，全沒

  最後以誇張不明所以的方式阻止了末日，有人犧牲啦、有人從大戰中找到自己啦

  真嗣最後長大開朗了，不是跟喜歡的明日香，也不是跟很保護自己的零一起

  而是互動最少的真希波，哇靠，搞成商業片還硬要補個現實人生日常遺憾的註解耶

  這部片唯一讓人最有感的，就是宇多田片尾唱的太好聽了，讓結尾沾了點舊EVA味道


  離場時，坐在旁邊的年輕女生一直在啜泣，另聽到有個年輕女生說她有泛淚

  這是要哭什麼東西阿，套句這部電影台詞，所以我不喜歡年輕女生


  --

  要看人話去看鋼彈算了

  去看IMDB評論，雖然平均8顆星，但負評的評論分析的很透徹，盡是資深老影迷的滿滿失望

  正評講的就很單調，統計裡年紀越長分數也偏低，這部明顯瞄準的是年輕族群

  雖然取得商業成功，但很意外現代年輕人的口味這麼貧乏

  你回的也好有深度喔 可以分享一下你的深度優優優'
