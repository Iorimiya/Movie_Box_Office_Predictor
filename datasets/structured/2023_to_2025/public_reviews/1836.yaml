title: '[好雷] 新世紀福音戰士新劇場版：終'
content: '防雷



































  “再見了,福音戰士們”沒想到這句話會打動我

  這是一段跨越30年的旅程（對我來說不到一個月）

  一切的收束就在這部長達兩個半小時的劇場版

  我原本很緊張,最後這麼長,如果又跟Q差不多怎麼辦

  幸好我完全想太多,我相當享受,甚至一口氣看完

  基本上這是相當出色的收官之作

  這個作品的各個面向都結束的非常圓滿


  我最喜歡的是前一小時的各種日常

  遠勝過後面一大堆打來打去的片段

  對我來說新世紀福音戰士最核心價值在於角色心理

  這段日常則是圍繞在三個主角,乃至學校同學的補完

  讓真嗣喪志是個很高明的安排,一來很符合他

  二來帶出兩個男生甚至班長的後續,讓他們有舞台

  明日香我是覺得偏向中規中矩,他本身就搶眼

  綾波零的發展是最讓我舒服的

  說實在我還是不知道她的一堆細節還有存在意義

  但她在村子跟人相處我很為他感到開心

  溫暖程度絲毫不輸給經典的微笑鏡頭

  最後變成LCL也是很好的收尾（顯然真嗣不同意）


  後來的各種戰鬥我就不多加贅述

  我想特別聊的是碇源堂的部分,我個人很喜歡他

  總是高深莫測的睥睨一切,那副眼鏡根本他的本體

  所以他在Q外型變成那樣我是蠻不喜歡的

  重點不只是他是人類補完計畫的推手

  他內心世界可說是直接體現了跟真嗣的衝突

  這部劇場版甚至直白的朝這個方向發展

  後面父子倆的戰鬥看起來很滑譏

  卻有種‘’這不是鬧著玩‘’的訊息在

  可能也是因為我的人跟他很像

  那種遇到真愛的感覺是這麼寶貴

  尤其是我們這種不容易跟人建立關係來說

  所以我完全懂他對老婆的執念

  對真嗣的疏遠和對零的親近就是在說這些

  我很欣慰他最後跟真嗣的和解,也許來不及了

  亡羊補牢還是猶未晚也（我沒用錯成語吧？）


  啊我來稍微聊聊真希波這個角色好了

  我話說沒有很明白這個角色的定位何在

  她完全拿掉也不太會影響劇情什麼

  如果沒看到結局我會很果斷的這樣定論

  但我可以很直白的說,她就是為了跟真嗣在一起而生

  準確來說是重生的真嗣,他們完全擺脫了Eva

  開始過上了從頭開始的新生活

  真嗣在整部作品給人極深的印象

  而結局的他已經完全不再有這些,成了完全的白紙

  而真希波這類型的角色很適合為這張白紙

  增添各種新色彩,至於會怎樣我們只能自己想像

  我從不會非常在乎什麼cp黨爭,我覺得很白癡心

  就這段來說我會認為是神來一筆

  大家看了的反應就是最佳證明


  最後還是要好好說再見,我的Eva之旅可說是結束了

  該回去追看到一半的權力遊戲了（幹根本追不完）

  整體而言我認為Eva一部分的價值是過時的

  你必須是30年前的日本人才能完全體會他神在哪

  但這不影響他的有個性造就無可撼動的經典地位

  他依然是值得一提一看的作品

  就算是我的文章也有很多完全沒提到的點

  像是我蠻想單獨寫我對美里的心得

  她是我最喜歡的角色,我絕不會承認因為她是姐姐


  還有使徒到底帶給我什麼觀感也是很有趣

  （但我大概無法言之有物,我其實沒有很認真看）

  反正只要能想像自己操控初號機對抗未知

  被打成狗之際能夠400%同步的暴走

  這就是新世紀福音戰士給我上的一課

  這是個好作品,也許不完美,但就讓自己任性一次吧


  ----

  Sent from  on my Samsung SM-S9280


  --

  每當處在我人生的十字路口，我總是知道哪條路是正確的

  沒有例外，我總是知道，但我從來沒去做，你知道為什麼嗎？

  因為那實在他媽的是太難走了

  而現在的查理也正處在人生的十字路口，他選擇了正確的路

  一條通往原則、導向人格的道路。讓他繼續走完這旅程

  委員們，你們正掌握著他的未來。這會是個寶貴的未來


  --'
