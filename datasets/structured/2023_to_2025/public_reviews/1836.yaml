  不打電動打發時間則只會回想起14年前互動的往事\n\n只能打氣鼓舞自己\"一直都是一個人，一個人也很好\"\n\n就算想要找人發洩情緒，可是初號機插入栓裡面只有LCL\n\
  沒有綾波零，更沒有笨蛋真嗣\n\n14年過去，情感鬱結於心\n\n\n在幻象劍介安慰:\"明日香就是明日香，這樣就夠了\"\n\n\n於是28歲的明日香在紅潮的沙灘旁醒來，蹲坐一旁的碇真嗣看著明日香\n\
  \n\"太好了，能再見到你\"\n\"謝謝你，告訴我你喜歡我\"\n\"我也喜歡明日香你喔\"\n\n明日香聽到這句，怔了一怔，害羞的轉過身去\n\n決心自己承受痛苦的碇真嗣說道:\
  \ 再見了，明日香，替我向劍介問好\n真希波:\" 保重喔公主\"\n\n隨後，插入栓被射出，這時候13號機體內已經沒有使徒靈魂了\n\n*這邊明日香畫得特別漂亮\n\
  *真希波你哪來的...\n\n在這個時間線，唯二對明日香有特別含意的男性，其一是碇真嗣，其二就是相田劍介\n雖然序跟破把明日香對戀父情結的橋段拿掉，也把對加持良治的戀慕拿掉\n\
  但對親情的渴求明日香並沒有減少，只是用強大的內心武裝起脆弱的自己，長久以來掩飾\n得很好而已\n相田劍介就是能滿足明日香這需求的人，而相田劍介也以監護者的角度照護明日香\
  \ (與TV\n版的加持良治相同)\n所以最後碇真嗣把明日香委託給相田劍介。\n\n\n渚薰篇\n\n渚薰看著被射出的插入栓，對碇真嗣說:\" 她走了，你不寂寞嗎?\"\
  \n(暗示舊TV的結局，明日香與碇真嗣的沙灘)\n\n碇真嗣:\" 我沒問題的。\"\n\n\n渚薰:\"我就是你，我與你是相同的，所以受到你的吸引，希望你能幸福。\"\
  \n加持良治:\" 你期望的是自己的幸福\"\n渚薰:\"能消滅我的只有真空崩壞\"\n\n對渚薰來說，他所追求的是離開這個死循環，而只要碇真嗣幸福了，就能夠達到這個目的\n\
  但這次，不再是渚薰幫助碇真嗣完成願望了，要讓渚薰脫離死循環還有另一個方法\n\n碇真嗣:\n\"我曾經無數次與你相遇\"\n\"眼淚只能拯救自己，哭泣救不了別人，所以我不會再哭了\"\
  \n(舊TV，葛城美里中槍後在電梯旁對碇真嗣說的話)\n\n渚薰:\"雖然有點寂寞，但你真的長大了。\"\n\n\n鐵門拉下，也許如渚薰和加持良治聊天的內容，到了新世紀的他們能夠一起在鄉下種田吧\n\
  \n\n\n綾波零篇\n\n已經滿頭長髮的綾波零，手中抱著一個娃娃，那是凌波唯殘存的記憶\n娃娃就是碇真嗣，抱著娃娃的綾波零是母親。\n\n*許多朋友指正說娃娃其實是鈴原燕，子代的記憶回歸到本體\n\
  這段我的認知有問題，不過大家還是看看吧 ;P\n\n\n綾波零:\" 我希望碇真嗣你能擁有不用駕駛EVA的幸福\"\n\n從序對決第六使徒後，看到碇真嗣對自己的關心開始，原本眼裡只有碇源堂的綾波零\n\
  心中的位置就給了碇真嗣，純真的想要碇真嗣幸福\n努力地想要讓碇真嗣與其父親和好，想要碇真嗣再也不用搭乘讓他痛苦的EVA\n在破對決第十使徒時，碇真嗣已經逃避了痛苦，逃離了Nerv\n\
  綾波零為了徹底斷絕後顧之憂，拿著N2炸彈衝了上去\n機體沒有修復完整又怎麼樣呢，即使犧牲自己又何妨呢\n能為對方獻出生命的純粹的愛，綾波零的這份心意是絕無虛假的\n\
  \n\n碇真嗣:\"我會選擇不用駕駛EVA的生活的\"\n這時候，背景是順向撥放舊TV版的畫面一直撥到新劇場版\n\n碇真嗣:\"再說真希波會來接我的，所以，安心吧。\"\
  \n聽到這句話的綾波零，換回了短髮與校服，\n對著碇真嗣綻出笑容 \"謝謝你\"\n\n這個綾波零早已不是碇源堂企圖製造的綾波唯，他就是綾波零\n過往的一切都要終結，新的屬於自己的未來在等著自己\n\
  這個未來也會有碇真嗣吧\n畢竟他讓自己安心了嘛，那麼又何須掛懷呢？\n\n\n-終結-\n\n隨著明日香與其他人的補完，碇真嗣下定決心要創造新世紀，\n蓋烏斯之槍朝著初號機/\
  \ 碇真嗣的喉嚨插去\n(這時候的畫面就如同舊TV初號機化為生命之樹一樣，只是朗基努斯之槍插的是胸口)\n\n受難的人必須付出犧牲，犧牲的就是自己的生命，願望是有代價的\n\
  如同碇真嗣告訴渚薰、綾波零的那樣，\n蓋烏斯之槍可以讓其他人幸福，自己也不再需要駕駛EVA\n\n*沒有碇真嗣自我的補完，成長後的碇真嗣不再畏懼受傷\n只有自己的世界雖然不會受傷，但也沒有幸福\n\
  與親朋好友的過往回憶是他真正的慾望，\n與舊版碇真嗣回應莉莉絲的話呼應，他主動去承擔他人的苦，\n這時候的碇真嗣更想要的是他的親朋好友幸福\n\n\n就在槍要插入碇真嗣咽喉之前，有一雙手擋住了槍，\n\
  那是從被叫來搭乘初號機之後一直保護著他的媽媽\n碇唯的犧牲就為了這一刻，為了保護自己的兒子，只為了讓他能在新世紀生活下去\n\n這時碇源堂的13號機也浮現，碇源堂的一切謀算就是為了陪伴碇唯\n\
  自從知道碇唯並不是為了成神而是為了保護兒子之後，陪伴碇唯的目標也沒有改變\n既然碇唯要犧牲自己，那麼離開的時候，也要一起走的\n怎麼能像之前那樣只留下了自己呢?\n\
  \n13號機的兩隻手握住蓋烏斯之槍，另外兩隻手輕輕環抱著初號機\n將槍貫入了胸口\n槍尖隨之貫穿了每一台EVA，天空中的莉莉絲也失去形體，額外衝擊也停止了\n\n\
  \n而碇真嗣在負宇宙的海邊，靜靜地看著海，看到世界都變成線稿\n真希波駕駛著八號機出現，畢竟這裡是需要亞當的容器才能抵達的負宇宙\n在真希波跳下海中，八號機也隨之被蓋烏斯之槍創造的概念消滅\n\
  \n碇真嗣跑向真希波，真希波從海中站起，穿著制服將頭髮上的海水甩去\n\"讓你久等了，真嗣君\"\n\n\n突如其來的變化，再睜眼的碇真嗣已身處車站月台\n一身西裝旁邊還有公事包，這時隨著列車進站，\"\
  白鴿\"又飛過\n\n\n\"猜猜我是誰?\"\n經典問句，連同答案都曾經說過的\n\n隨後，真希波解開了碇真嗣的DSS項圈，她只是帶著碇真嗣離開負宇宙\n這月台還是那個有著EVA的世界\n\
  \n真希波伸出了手，要引領碇真嗣前往新世紀\n\"來，走吧，真嗣君\" (第四次的真嗣君)\n\n碇真嗣握向真希波伸出的手\n與以前14歲的碇真嗣懦弱的被動的不同，這個積極的主動的成熟了的碇真嗣，\n\
  迫不及待的反拉著真希波跑向月台出口\n\"恩，走吧！\"\n\n\n*對面的月台有在最左邊坐在椅子上的明日香，站在中間一起聊天的綾波零與渚薰\n*之前白鴿飛過都會出現幻影綾波零\n\
  \n\n鏡頭不斷拉遠照向車站周圍，碇真嗣與真希波也越跑越遠，從車站離開\n\n*這個結局有一點接回舊TV26話\n\n舊的故事結束了，碇真嗣放下了 ，從EVA的世界放下，回到真實的世界，\n\
  而能了解到這點的碇真嗣，開心的說出\n\"我只能是我，我就是我，我要做我自己\"\n\n說這句話時舊TV的分鏡就是碇真嗣準備用蓋烏斯之槍自裁時的分鏡，\n是那成為了神話的少年\n\
  \n\n\n\n\n在福音戰士這個講孤獨與寂寞為主題的作品，實在難以說上圓滿，我情緒總是有點抑鬱\n當年一起追舊TV的朋友，永遠看不到這個EVA世界的完結\n\
  謹以此文紀念當時追舊TV的樹安\n願你在天上一切安好\n\n\n\n*修正錯字 wiile ->wille\n\n\n**\n\n--\nPatch 5.3 Hotfixes:\
  \ July 3\n\nFixed an issue where Protection Warriors are unable to receive\nbonus\
  \ loot upon defeating Ra-den.\n\n--\n\n我補述上，我一直誤會那個是真嗣抱枕\n\n                   \
  \                   02/16 12:45\n\n我藍色窗簾的解釋\n1. 那並不是亞當在操縱複製體(二號機)，因為只有一隻停止插入栓對其沒有危害\n\
  2. 那並不是二號機在害怕亞當(13號機)，不然不用打同步率就掉了，\n   Q的時候也打過，當時並沒有發生二號機失控\n3. 二號機張開ATF時是停止插入栓要插入時，二號機要中斷的是這個操作\n\
  　雖然沒有智識，但有本能，所以對明日香反向張開ATF\n\nA. 私心的解釋\n二號機為了保護明日香，提醒他這樣會失去自我\n可惜二號機不會說話，所以沒有成功\n\
  \n\n\n我以為是碇真嗣抱枕XD"
