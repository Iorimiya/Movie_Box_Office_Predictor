title: '[好 雷]新世紀福音戰士新劇場版 終'
content: "雷文防雷資訊頁\n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n我又來努力賺P幣了，上次是金塊打雷霆吧，我賭金塊，結果bbq了。\n\
  2023年尾我開始追新世紀福音戰士然後在昨天看完全部，\n之前有看過是看解說加去院線看終的上映。\n \n那時候看會看不太懂，這裡要補充一些前提，新世紀福音戰士其實蠻基督教的\n\
  ，裡面很多寓意，例如墮天使、亞當莉莉絲，使徒，1-13的eva，或是朗基努斯\n之槍。\n \n今天又補了新劇場版的解說，別有一番感悟。\n \n \n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n \n舊版我是看tv1-24然後接air/真心為你，這樣是網路上流傳的舊版真結局(經費充足版)\n\
  因為當初eva上市時好像不紅，所以25-26集經費是不足的，但我蠻喜歡tv結尾歐美得多\n那一幕，很喜歡。\n \n舊版現在重看會覺得很煩躁，1.一直打巴掌 2.真嗣被瘋狂情勒\n\
  每個人物都有缺陷，綾波零跟機器人一樣然後寓意是像碇唯，不懂得情感。\n明日香很吵、自大、自私，有媽媽的創傷、有點戀父，對真嗣凶爆，很像吉娃娃，\n以天秤來講她就是極度有情緒。\n\
  真嗣的話我覺得他就蠻沒主見的，一開始他就沒什麼想法，跟父親狀況疏離，一來就被\n迫要駕駛eva，不開就是不認識的受傷女子開，然後後來你也可以不開，但我們整個城市\n\
  的人都得搬走，但我們同學看過你駕駛eva很痛苦的樣子，我們懂你。\n然後被老爸搞，逼迫害殘同學。這種情況下大家一直逼他又說他逃避，後來他還要催眠自\n己開eva是好事，典型的pua吧。\n\
  \ \n碇源堂自私，只是為了見碇唯，不過當初接近碇唯那邊動機還有待商確。\n美里、加持蠻感人的，舊版美里吻真嗣跟他約好回來繼續很催淚。加持其實也有點自私，\n\
  好像是律子說的，雖然看起來玩世不恭，但他其實很寂寞。\n律子也是悲劇人物，媽媽不愛，最後審判掉她。\n舊版泡腳那段蠻好笑的，塞了一些日常，但整體節奏偏慢。\n\
  \ \n新版有重塑過故事的重點，更側重在真嗣身上，舊版很難講說，喔最後是為了真嗣不逃避\n真嗣你要面對，因為前面根本不合理阿，只是塞了一堆情緒進去。\n新版一開始還是一樣被迫駕駛，還是有創傷橋段，但真嗣攻擊的人改成明日香，然後渚薰\n\
  一樣是聖母的角色，幫他戴上項圈，真希波變成新的一個沒有創傷，不需要救贖的人。\n \n黑衣綾波(簡稱黑零)，綾波跟明日香都是人造人系列，舊版綾波有因為律子毀掉而有限，\n\
  新版原本跟真嗣有羈絆、有人性、喜歡的綾波後來死掉，出現的替代品，就是黑零，\n在農村的時候她學會了人性，可是她卻要死了，我前陣子去日本玩有扭到她，原本我還覺\n\
  得是爛的，但現在我反而對她有感情了，因為她從零開始慢慢學會了情緒，知道微笑就可\n以，知道早安午安晚安，謝謝。有覺得開心的事，知道生活的樂趣，她學會了日常，卻也\n\
  步入了死亡。\n \n然後明日香現在也沒有舊版那麼暴躁，舊版最後是只活了真嗣跟明日香，最後明日香醒來\n說真嗣好噁，但原本真嗣希望她醒來時也說，你就算醒來罵我也好。\n\
  新版明日香還是有她很感人的地方，她很狂暴，她跟真嗣原本的定位都是需要長大的人，\n但她可能比較勇敢，最後她也救贖了她自己。\n \n真嗣這系列比較看的出來他的逃避，然後跟最後就是家族內鬥，跟爸爸打架，第一與第\n\
  十三使徒的打鬥，場景也放很多家裡之類的。但我這次覺得感人的是真嗣補完其他人的\n部分，補完純看解說你會很難知道是什麼意思，但舊版可以理解是大家重歸一體，lcl\n\
  人類或是使徒都有心之壁，全部融合，沒有隔閡。\n \n新版的補完是補上缺少的那塊，真嗣這裡真的很令我感動，他補了爸爸的，補了渚薰，\n明日香，黑零，美里大家的，他終於可以自己面對了，在舊版我會覺得不公平。\n\
  因為他突然被丟進來，就要他負責，還指責，還說他逃避，又要他面對。\n新版則是他有不甘心，他被迫進來，但他也有試著想做點什麼，所以他有了渴望。\n那就會想要改變狀況，可是發現超糟，開始逃避，這樣最後成長起來，接受愛人死了\n\
  (還瘋狂爆頭)然後成長到可以安慰別人，可以補完別人，這點我覺得非常感動。\n新版最後也有切回現實畫面，然後由真希波來救真嗣，爸爸媽媽不想走，還是留在了\n反天堂裡面，可以理解他們真的就想待在一起，那沒關係，真嗣最後也救贖他們了，\n\
  它們也用這點來補完真嗣，告訴真嗣他可以過自己的生活。然後地鐵時真嗣就是十四\n年後的身體，可以解讀成他長大了。\n \n真的很感慨，真的得要看過原本作品，再來看新版，才會感受到不一樣或是作品真正\n\
  傳達的能量是什麼。他圍繞著人性來寫，所以解讀永遠可以超深，因為他人物之間的\n互動跟動機都是人性，碇源堂搞一大堆就是因為他太想見碇唯，真嗣被牽著走，最後\n也獲得了面對哀傷，重新站穩腳步，長大的能力。\n\
  推薦大家要看，原作先補一補再看新劇場版系列\n \n那我自己平常也有錄podcast:嘻踢卡廢CT cafe\n各大平台都可以收聽，也有粉專，主要會提股票、音樂推薦、電影分享，或是趣事。\n\
  我會拿賺到的稿費去下樂透，希望越滾越大，謝謝大家收看~"
