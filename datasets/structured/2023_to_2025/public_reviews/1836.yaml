url: https://www.ptt.cc/bbs/movie/M.1675430865.A.1E3.html
title: '[好雷] 新世紀福音戰士新劇場版：終'
content: '雷文防雷資訊頁



  聽朋友說4DX效果極好，不過我是看一般數位，但也沒關係，畢竟已經完成我一個願望清單：「在戲院看新世紀福音戰士」。


  在戲院看也是跟一般電視串流看效果完全不同，音效、配樂、畫面等等，果然還是要在戲院裡體會，那是一種小時候到現在的感動。



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  該怎麼說呢...其實板上大部分應該都講得比我好，也有各自的分析理解，其實最近的灌籃高手我也有看，但我真的不愛；反倒是對於小時候看了幾眼就忘不了的福音戰士異常的喜愛，也許我本就喜歡這種科幻、機器人、神話預言相當著迷。


  小時候看不懂覺得初號機很帥，真嗣很廢、美里和明日香真的棒！長大後發現全然不是這麼一回事，完全可以理解真嗣的所作所為，在成年後的我回過頭去看，異常感慨。


  看過TV版、舊劇場版，再看新劇場版，老實說我覺得庵野秀明想表達的跟當時有所不同，同樣都是自我成長與救贖，但卻多了父與子的親情，同儕朋友間對真嗣在近第三次衝擊中的行動理解包容，這是在原動畫跟漫畫裡所沒有的，這大概是這些年之於庵野秀明上的心境變化。


  也不知道是小時候不懂，還是新劇場版真的有比較好懂，很多事情在10年後的我放到現在來看，幾乎都能理解感受了。至於我自己的感想是，有沒有看懂也不是很重要，因為每個人都有自己的看法跟解讀，我僅是完成我過去的願望，以及沉浸在EVA迷人的世界裡。


  畢竟電影結尾跟週邊封面也說了，福音戰士真的結束了，結尾也是回歸現實和真希波一起（果然還是要選大的）。至於真希波的來歷依然沒有說清楚，但在碇源堂跟唯的回憶中，有出現真希波的影子。


  無論痛苦快樂與否都是人生，接受它並面對它，逃避也沒關係，最重要的是你怎麼做，再怎麼絕望，也要懷抱希望活下去。對我而言整部片就是訴說這一個概念吧，用那些迷人的背景故事來帶入。


  最後在留言附上票根週邊

  看完發現有初號機公仔失控就買了...


  -----

  Sent from JPTT on my Sony XQ-BC72.


  --'
