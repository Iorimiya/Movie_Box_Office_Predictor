url: https://www.ptt.cc/bbs/movie/M.1727173035.A.C5B.html
title: '[新聞] 全球看見台灣！<台北追緝令>版權熱銷68國'
content: '新聞網址：



  集結好萊塢億萬製作團隊與卡司的《台北追緝令》（Weekend in Taipei），即將於明日

  （9/25）於全台盛大上映。本片是路克伊凡斯（Luke Evans）繼《玩命關頭6》（Fast &

  Furious 6）飾演「歐文蕭」之後，與「韓哥」姜成鎬（Sung Kang）再度合作電影，這回

  正反派角色互換，也成為電影一大看點，也讓網友開玩笑直呼本片根本就是「台版《玩命

  關頭》」！值得一提的是，本片是影史首部全片在台灣取景拍攝的好萊塢動作強片，電影

  版權已經熱銷超過全球68個地區，並還在持續熱銷中，也讓台灣之美即將讓全球觀眾看見

  。而台灣觀眾也將透過本片，看到諸多熟悉的台灣熱門景點，導演黃嘉智（George Huang

  ）、演員桂綸鎂與楊明偉（Wyatt Yang）也趁在台灣宣傳的週末時光，特別抽空進行一連

  串快閃掃街活動，走訪片中出現的西門町商圈、美麗華百樂園、大直植福宮，果然符合本

  片英文片名「週末在台北」，也期待台灣觀眾能在片中發現這些令人熟悉的台灣景色，也

  勢必將吸引粉絲來場「聖地巡禮」之旅！





  《台北追緝令》是路克伊凡斯繼《安娜》（Anna）之後，與監製盧貝松（Luc Besson）再

  度合作。他於本片再度上演精采動作場面，矯健身手與流暢打鬥，讓導演黃嘉智讚嘆連連

  ：「我的天，他非常專業！他都會與特技團隊事前準備，就像一場餐廳廚房大亂鬥橋段，

  只花四天就拍完。他的肌肉記憶使他能夠直接上場，這真的很棒，可說是每個導演的夢想

  ！」



  尤其本片也是路克伊凡斯與「韓哥」姜成鎬繼《玩命關頭6》之後再度合作。這回兩人角

  色形象對調，路克伊凡斯從反派「歐文蕭」變身成正義緝毒探員，而「韓哥」則成為戾氣

  十足的販毒集團首腦，角色形象的互換成為電影一大看點！能夠與路克再度合作，姜成鎬

  也開心表示：「能夠與老朋友再度共事，真的是最棒的事了，能和某些人再次工作是很難

  得的，而且現在角色還反轉呢！」





  《台北追緝令》是影史首部全片在台灣取景拍攝的好萊塢動作電影，片中囊括台北101、

  松山機場、北門、大直植福宮等眾多台灣民眾所熟悉的地方。繁華都市街景、古色古香傳

  統之美一應俱全，也讓本片截至目前已經狂銷超過全球68個地區，還在持續增加當中，勢

  必將讓世界各地看見台灣之美。值得一提的是，導演黃嘉智也趁日前來台宣傳時，與片中

  母子檔桂綸鎂與楊明偉再度走訪本片拍攝場景，從人潮熱絡的西門町商圈、擁有壯觀摩天

  輪的美麗華百樂園，再到展現傳統文化之美的大直植福宮，都期待觀眾能在電影中發現這

  些令人熟悉的台灣景色，更有機會在觀影之後來場「聖地巡禮」之旅。



  這部集結億萬票房製作團隊，讓全世界觀眾看見台灣之美的《台北追緝令》，即將在明日

  （9/25）於全台2D、4DX版本同步盛大上映。本片劇情描述美國緝毒局探員約翰（路克伊

  凡斯飾演），不僅是超強工作狂，更會犧牲一切、不擇手段，只為順利完成案件。不巧，

  在命運的捉弄下，他與思維敏捷又難以追捕的頂級「車手」喬伊（桂綸鎂飾演）墜入愛河

  ，最後卻捲入犯罪陰謀當中，迫使兩人分開。沒想到15年過去，約翰為了緝捕販毒集團首

  腦關（姜成鎬飾演）來到台北，原本預計停留一個週末的時間，但彷彿命運再度出手攪和

  ，讓他與喬伊奇蹟般地重逢，更發現她已經有個兒子雷蒙（楊明偉飾演）。此時，關的威

  脅伴隨而來，讓三人不得不攜手迎戰！



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
