title: '[負雷] 台北追緝令'
content: '尬到不行的台詞和橋段

  邏輯一團垃圾的劇情

  順便再塞點在左膠意識

  法國那邊真的就是來騙個補助閃人

  難怪會連殺青宴都直接不屑出席

  裝都不裝的


  這坨東西真的能宣傳台灣？

  ㄏㄏ

  賞車可以隨便開到路上飆一圈沒事

  撿到毒品最好藏起來不然會被警察抓

  果然是座落後的猴子島

  相信會給外國人記憶深刻的


  媽媽是個退役的運毒飆仔車手

  出生開始就給黑道老大養的小孩

  居然成長為愛護海洋生態的覺醒少年

  13.4歲進爸爸公司實習

  發現爸爸殺海豚

  決定大義滅清搞垮爸爸

  獨自打開保險箱偷走帳簿聯絡FBI

  想出這這設定的真是天才


  ----

  Sent from  on my Sony XQ-BE72


  --'
