url: https://www.ptt.cc/bbs/movie/M.1727750458.A.90A.html
title: '[好雷] 台北追緝令Weekend in Taipei'
content: '雷文防雷資訊頁


  台北追緝令

  Weekend in Taipei

  2024法國電影


  雖然網路上對本片的負評不少，但去看過的一位朋友line推薦文字：

  我覺得還不錯

  娛樂性佳

  梗很好笑


  所以內心定位是無腦爽片，後來也去看了。看完驗證是無腦爽片，一些橋段及畫面令我嘴

  角上揚            ，看完feel good及笑笑離座。個人滿意度80分（那麼高分，是因為

  有被娛樂到☺  ）。


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  以下有劇透。




  1.雖然沒有看本片女主桂綸鎂主演的影集〔台北女子圖鑑〕（貶諷遠大於讚譽的影片，人

  設劇設大吐嘈），所以看到本片有人譏諷為台北女子圖鑑的續篇電影，感覺莞爾一笑，哈

  哈哈，女主在本片演出亮眼，那麼俗套的劇情及人設，卻不會令我出戲，歸功於她詮釋角

  色太棒了。她片中飆車的表現，氣場超強，有夠帥。


  2.這片法國製作，主要角色的台灣人的英語對話能力好強，男主角色是美國FBI卧底探員

  ，另一男主是來當大反派兼苦情男來著。


  3.片中豪宅背景，懷疑有去取景近期新聞人物沈慶京建商精心創作的最貴豪宅：陶朱隱園

  ？



  4.盧貝松監製，本片五大看點：


  這些看點，可以增加一些對本片閒聊的話題。


  5.收尾的畫面，簡直是搞笑來的，男女主角的愛情結晶小baby,懷疑是AI合成來著，是我

  想太多了。哈哈哈。



  --

  未來將在美國上映，


  台北追緝令


  《台北追緝令》2024年9月25日在法國及台灣上映，11月1日在北美上映。'
