title: '[新聞] 強檔電影將上映！小丑.台北追緝令.流氓驅'
content: '新聞網址：



  強檔電影將上映！小丑.台北追緝令.流氓驅魔師夯


  影片新聞：



  -



  接下來又有很多話題十足的電影，即將在台上映！九月有桂綸鎂主演的「台北追緝令」，

  以及宗子杰和郭書瑤主演的「流氓驅魔師」；


  而「小丑」的續集，「」，還找來Lady Gaga一起主演，描繪他等待審判

  時，遇上真愛的故事。光是預告片釋出，就已經讓許多影迷相當期待。


  電影預告片：「你是小丑。」


  還記得他嗎，那個掀起轟動的小丑，電影預告片：「告訴我們你有什麼改變亞瑟，我告訴

  你有什麼改變，我不再是一個人。」


  因為當小丑所犯下的罪，他被送進精神病院，但在等待審判時，與真愛邂逅，電影預告片

  ：「我第一次看到小丑時，當我看到你時。」


  而且他愛上的女主角，由Lady Gaga飾演。


  電影即將在台上映的，還有這一部，電影預告片：「喬伊我的愛，生日快樂，我們破獲將

  近400公斤的海洛因。」


  由桂綸鎂扮演頂級車手的《》，描繪她和美國緝毒局探員，墜入愛河時隔15年

  在台北重逢，電影預告片：「媽媽他是誰，媽媽？你有小孩了？，約翰你有危險，雷蒙是

  你兒子約翰是你爸爸，什麼什麼什麼。」


  命運般重逢卻飽受威脅，兩人得攜手迎戰。


  電影預告片：「第一驅魔師李元傑，聽說你功力深厚，幫我兒子驅個魔。」


  由新生代男神宗子杰主演，改編亞洲驅魔大師的真實經歷，《》也讓郭書瑤，

  在《通靈少女》後再度挑戰靈異題材，新片各個話題十足，未演先轟動讓影迷引頸期盼。


  --'
