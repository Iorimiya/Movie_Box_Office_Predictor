  影城中庭廣場的世界首映紅毯見面會，開放民眾免費自由參加。\n\n美籍台裔導演黃嘉智表示，由於自身是亞洲人身分，在好萊塢時常無法感受到歸屬感，到\n台灣之後產生不同感覺，他感性分享：「當我來到台灣，我真的感覺到歸屬感，覺得我屬\n\
  於這裡，有融入的感覺，就像回家一樣。」他也說這次來台，要找機會再品嘗蛋餅、芒果\n雪花冰、刈包、滷肉飯等多樣美食。\n\n而去年曾來台開球的好萊塢巨星姜成鎬，當時在台掀起一股「韓哥旋風」，美好經歷讓他\n\
