title: '[新聞] 金鐘視帝視后加盟共演【台北追緝令】!'
content: '新聞網址：



  影史首部全片在台灣取景拍攝的好萊塢動作強片《台北追緝令》（Weekend in Taipei）

  ，即將在9月25日（週三）於全台盛大上映。本片不僅由《即刻救援》（Taken）、《玩命

  快遞》（The Transporter）億萬製作團隊打造，更集結路克伊凡斯（Luke Evans）、「

  韓哥」姜成鎬（Sung Kang）、楊明偉（Wyatt Yang），以及台灣女星桂綸鎂共同主演。

  值得一提的是，觀眾更將在片中驚喜見到多位熟悉的台灣演員共同演出，包括「金鐘獎視

  后」陸弈靜、「金鐘獎視帝」庹宗華，以及有「最強綠葉」之稱，這回卻逆轉形象詮飾反

  派隨扈的李沛旭等人。對於有機會跟台灣演員共事，導演黃嘉智（George Huang）也直呼

  ：「是我的榮幸！」





  《台北追緝令》不僅集結好萊塢億萬製作團隊，更與台灣演員攜手合作，片中可見多位熟

  悉的台灣演員面孔，讓人又驚又喜。首度跟台灣演員合作的台裔美籍導演黃嘉智也直呼：

  「能與這些台灣演員共事，是我的榮幸！」他並進一步表示：「對我來說，能和陸弈靜這

  樣的演員一起工作，是難能可貴的機會，她通常是跟蔡明亮導演一起合作的！還有演出過

  《模仿犯》和李安執導《色，戒》的庹宗華，只要他在片場出現時，就會為現場帶來份量

  感。」



  對於有機會參與好萊塢大製作電影，在片中飾演桂綸鎂祖母的陸弈靜也分享：「現場一切

  井然有序，拍攝工作的進行快、狠、準，好像參加一場『戰鬥營』，既興奮、刺激、暢快

  又有成長，很棒的經驗。」值得一提的是，本片也是她繼2016年於電影《德布西森林》跟

  桂綸鎂飾演母女後的再度共演，桂綸鎂談及跟陸弈靜再次合作的心情：「這是我第一次參

  加好萊塢製作，我們一起經歷非母語的創作，並與國際導演合作，那種激烈的緊張感，還

  有把自己準備好的緊張感，是我們兩個一同經歷的，有她在現場讓我很安心。」回憶起兩

  人再度相見，陸弈靜也笑說：「小鎂在梳化間看到我的時候，高興地跑過來，如往常一般

  地叫我『媽咪』，我笑笑地跟她說：『嘿嘿嘿，這次要叫我婆婆囉』。」





  同樣在《台北追緝令》獲得大量關注的台灣演員，還有在姜成鎬身邊飾演反派隨扈的李沛

  旭。有「最強綠葉」之稱的他，這回逆轉形象，光是在預告中以酷炫的臉部紋身，以及大

  秀麒麟臂的健壯身材，就引發觀眾熱烈討論。對於演出時的準備，他大方分享：「這次『

  外在準備』把身形狀態調整得更好！當時本來在健體備賽期，得知被選入這個角色後，也

  順勢把『備賽狀態』轉為『備戲狀態』。我在心中默默地想像，身為劇中老大的左手與外

  形，應該是相當精實且具有威脅性，所以就往這個方向前進！」用心的準備也獲得導演黃

  嘉智大讚：「雖然有著大塊肌肉，但卻溫柔又踏實，如此對比是種很特殊的感覺。老實說

  ，我覺得他會是未來的動作明星，我告訴他，我想為他寫些東西來展現他的才能！」



  此外，躍上國際的不只台灣星光，本片也與「台北萬豪酒店」合作，不僅有大量場景在此

  拍攝，台北萬豪酒店更為製作團隊提供住宿，讓導演黃嘉智感動表示：「台北萬豪不只是

  我們的第二個家，還幫助我們在片中加入許多場景，讓電影更加出色；它們在電影裡既是

  摩天大樓、角色的書房、房間，當然也以萬豪自己的身分出現。」全力的支持也讓共同監

  製維吉妮貝松席拉（Virginie Besson-Silla）讚嘆：「他們的熱情款待，代表著我們從

  台灣每個人那裡獲得的愛與支持！」



  這部集結億萬票房製作團隊，讓全世界觀眾看見台灣之美的《台北追緝令》，即將在9月

  25日（週三）於全台盛大上映。本片劇情描述美國緝毒局探員約翰（路克伊凡斯飾演），

  不僅是超強工作狂，更會犧牲一切、不擇手段，只為順利完成案件。不巧，在命運的捉弄

  下，他與思維敏捷又難以追捕的頂級「車手」喬伊（桂綸鎂飾演）墜入愛河，最後卻捲入

  犯罪陰謀當中，迫使兩人分開。沒想到15年過去，約翰為了緝捕販毒集團首腦關（姜成鎬

  飾演）來到台北，原本預計停留一個週末的時間，但彷彿命運再度出手攪和，讓他與喬伊

  奇蹟般地重逢，更發現她已經有個兒子雷蒙（楊明偉飾演）。此時，關的威脅伴隨而來，

  讓三人不得不攜手迎戰！



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
