title: '[負雷] 台北追緝令：劇情問題很大'
content: '戲中的反派總部（今周刊圖）


  桂綸鎂說她痛恨煙味，


  可是男主角到處討菸抽就可以


  肥宅boss就不行？


  韓哥權傾天


  撿到他的毒品交給警察會有事


  （這片應該在墨西哥拍吧！）


  最後因為爭風吃醋在鬧區鬥毆和隨身碟就被抓了


  連個反撲都沒有（FBI跟CIA、國際刑警差很多吧）


  是因為經費用盡了嗎？


  而且劇情空洞就靠一堆倒敘手法假鬼假怪


  場面也是頭重腳輕，越來越小


  、乖乖順敘也許還會同情一下女主角


  結果就台男最討厭的臭臉雙標闊太兼破麻樣板


  這是哪門子城市行銷啦(台女形象全球放送)


  取景就信義區＋西門町(交易地點華國美學陋巷XD)


  好歹也去北投泡個溫泉(黑金還有山上泡茶)


  101沒啥入鏡，結果海報放那麼大 XD


  、臥底還帶警徽出門幹嘛？(放低槍，我係差人)


  感覺編劇很多個，一會兒想走R級(韓哥殺自己手下倒是挺狠)


  一會兒又尷尬搞笑


  嘲點族繁不及備載。


  --

  辦公室看出去那裡嗎，一小景，還是機場降落時？

  我修一下

  那長串抱怨台詞好像不是這意思喔

  叫她拖延5分鐘的意義其實也有bug，又不是5分後美國警察就來救了，只是送件時間也來

  不及攔，那美克星喔

  臭臉試車那裡就叫人反感了

  說到痛處了，韓哥才會氣到殺小弟

  而且推銷景點手法就是台女與洋男的各種接吻地點，汗顏...

  花肥宅的錢花到離不開，還跟肥宅在浴室孕育下一代

  因為兒子叛逆才被迫離開，還好意思跟婆婆說我終於離開他了

  講得好像是自己下的決心；試車還臭臉脫鞋子要別人拿

  台女那麼醜陋的都屬罕見...'
