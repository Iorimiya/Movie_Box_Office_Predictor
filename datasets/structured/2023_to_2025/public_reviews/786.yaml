url: https://www.ptt.cc/bbs/movie/M.1727542415.A.03A.html
title: '[負雷]台北追緝令，一部獻給台灣爸媽的恐怖片'
content: '看完《台北追緝令》，查了一下他的英文片名叫Weekend in Taipei


  讓我深深覺得，這是一部獻給所有台灣爸媽的恐怖片，這個Weekend，妳那位就讀

  國小的兒子將會如有神助地找到他混蛋繼父的黑帳本，然後寄給美國緝毒局的探員

  ，並且成功約在台北面交，而繼父可是大企業家兼毒梟，能讓你們母子倆住在陶朱

  隱園，並且擁有一隊能在台北飯店以及街頭拿衝鋒槍隨便掃射的隨扈，但是他用來

  存放黑帳本的保險箱卻比我家第四台的免費成人頻道還好破解（四個零），而且

  母子倆好不容易逃脫回到北海岸的阿嬤家，妳那位英明神武的國小兒子，竟然還可以

  跟親戚騙到一台檔車，隨後一個人從北海岸直接騎回陶朱隱園，再度將繼父的黑USB

  弄到手，顯然上次繼父在對妳一念之仁被妳兒子趁機敲暈之前，所撂下的要將他

  「切成四塊」的狠話，被當成耳邊風，妳也被妳兒子這種毫無章法且過於頻繁的

  復仇行動，搞到差點沒時間跟美國緝毒探員前男友兼兒子生父溫存溫存，我說差點

  是因為，本片的結局，竟然是一個禮拜後，妳懷了第二胎！！！？？？


  --



  一開始有說下禮拜帶兒子去巴黎（還是下個月？），結局在巴黎，我就這樣子理解了XD'
