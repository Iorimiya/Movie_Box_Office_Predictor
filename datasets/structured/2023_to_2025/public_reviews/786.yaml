title: '[新聞] 【台北追緝令】12條台北道管創拍攝新紀錄'
content: '新聞網址：



  由「億萬票房名導」盧貝松（Luc Besson）監製、台灣出身的好萊塢導演黃嘉智（

  George Huang）執導，兩人攜手帶來將在9月25日（週三）於全台灣盛大上映的爆爽動作

  鉅片《台北追緝令》（Weekend in Taipei）。據悉，本片原定以香港作為故事背景，但

  因資金規劃變動，於是在盧貝松的大力推薦之下，促使導演黃嘉智在去年2月動身來台灣

  勘景14天，並在實際走訪各個城市之後，驚豔於台灣的美麗與多樣，決定立刻改寫劇本！

  尤其本片場景涵蓋整個大台北，並獲得臺北市政府、台北市文化局、台北市文化基金會，

  以及台北市電影委員會等各公單位支持，申請協拍的項目高達99項，甚至因為有大量飛車

  追逐場面，所以申請了12條道路管制拍攝，刷新在台北拍攝電影，申請最多道路管制的新

  高紀錄，也讓台灣美景即將透過本片，展現在全世界觀眾眼前！





  由路克伊凡斯（Luke Evans）、桂綸鎂、「韓哥」姜成鎬（Sung Kang）、楊明偉（

  Wyatt Yang）攜手主演，首部全片在台灣取景拍攝的好萊塢話題鉅片《台北追緝令》，最

  初原定以香港作為故事背景，卻因為資金規劃變動導致拍攝卡關。身兼監製與編劇的「億

  萬票房名導」盧貝松，過去因為來台拍攝好萊塢大片《露西》（Lucy），美好的拍片經歷

  ，讓他主動向執導本片的美籍台裔導演黃嘉智大力推薦：「我在台灣度過了一段愉快的時

  光，他們非常熱情。你去看看吧，探索整個台灣。」這也讓導演深受啟發，選在去年2月

  動身來台灣勘景14天。



  由於導演的父母親來自嘉義，過去他也曾跟隨家人返台探親，這次透過場勘深入走訪台灣

  各地之後，他也為之驚艷大讚：「這是我第一次實際看見台灣的一切，這是個非常適合拍

  攝的美麗之地，如此有電影感，如此多樣化。你先是在大型市區，但20分鐘後又能到有瀑

  布的山林之中，真是令人驚艷！」這也讓他立刻決定將背景設定在台北，重新改寫劇本！





  以台北市為主要場景的《台北追緝令》，在取景拍攝期間，臺北市政府、台北市文化局、

  台北市文化基金會、台北市電影委員會全力協調各公單位給予支持。本片場景分布涵蓋整

  個大台北，申請達99個協拍項目，也因為大量飛車追逐的劇情需求，申請在內湖、中山、

  士林、信義、中正、萬華、大同、大安等8區12條道路管制拍攝，締造在台北拍攝電影，

  申請最多道路管制的全新紀錄！



  值得一提的是，其中連續五晚在自強隧道單向調撥拍攝的難度最高，因為需要拍攝跑車追

  逐及撞車翻覆等情節，法國特技指導須於路面固定車用三角跳台；經過台北市電影委員會

  偕同劇組與新工處等相關單位，召開兩次跨局處會議，協調每夜的管制時間、安全且可行

  性作業方案，以及確保事後不影響車輛安全通行等事宜，最終順利拍攝，並由新工處委外

  配合的廠商完成道路舖面場復作業。期間，台北市電影委員會除了參與製作協拍之外，也

  提供演職員、後製等協助，並結合民間資源給予的器材、後製科技技術上的支援，後續也

  將在電影宣傳期協助上映宣傳等活動。



  這部集結億萬票房製作團隊，將讓全世界觀眾都看見台灣之美的《台北追緝令》，即將在

  9月25日（三）於全台盛大上映。本片劇情描述美國緝毒局探員約翰（路克伊凡斯飾演）

  ，不僅是超強工作狂，更會犧牲一切、不擇手段，只為順利完成案件。不巧，在命運的捉

  弄下，他與思維敏捷又難以追捕的頂級「車手」喬伊（桂綸鎂飾演）墜入愛河，最後卻捲

  入犯罪陰謀當中，迫使兩人分開。沒想到15年過去，約翰為了緝捕販毒集團首腦關（姜成

  鎬飾演）來到台北，原本預計停留一個週末的時間，但彷彿命運再度出手攪和，讓他與喬

  伊奇蹟般地重逢，更發現她已經有個兒子雷蒙（楊明偉飾演）。此時，關的威脅伴隨而來

  ，讓三人不得不攜手迎戰！



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
