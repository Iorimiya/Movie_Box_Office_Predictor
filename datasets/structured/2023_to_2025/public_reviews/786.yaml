url: https://www.ptt.cc/bbs/movie/M.1727854399.A.2FC.html
title: '[請益] 雷 關於台北追緝令最後的疑問'
content: '防一下雷











  其實整部電影都還算簡單易懂啦，

  足夠高爽度的打鬥戲，加上微灑狗血的劇情(我喜歡的那種)

  我覺得看下來很流暢，有一氣呵成的感覺，


  唯一到最後有點小疑問的是，

  桂綸鎂肚子裡面的小孩，到底是誰的呢？

  因為根據他們逃跑的過程整個故事，基本上就是發生在一個周末，

  真正可以色色的晚上，也就是假日回老家的那個晚上(?)


  沒意外的話只有一天(還兩天)的時間可以色色吧

  真的這麼準喔，每來一次台灣就懷一個www


  好奇問問各位覺得最後那個小孩，會是誰的？？


