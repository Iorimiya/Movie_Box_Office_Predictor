url: https://www.ptt.cc/bbs/movie/M.1727407932.A.225.html
title: '[討論] 台北追緝令在台拍攝地'
content: '盧貝松的台北追緝令破台北拍電影申請最多道路管制的紀錄

  本人僅看預告片，過幾天打算進戲院支持，看過的覺得如何?



  身為台灣人，來挖掘幾個拍攝地

  1.自強隧道

  聽說追擊翻車戰連續拍了五晚，每天上班經過的地方居然沒遇到女神





  2.重陽大橋

  在騎車殺手的大橋上取景，不知怎麼來個超跑追逐




  -


  3.信義金剛犀牛

  每次就只經過它去旁邊的一蘭，想不到這隻犀牛是個地標?!





  4.內湖JD RESERVA

  爬文找到的超跑聖地，裡面的跑車沒在開玩笑，買不起但用看得也很爽





  5.大直植福宮

  兩個人親親的地方，聽說大老闆都在這邊拜




  -


  6.還有一堆街頭飆車，我只看得出北車衡陽路就是了啦




  其他還有一些飯店的走廊看不太出來是在哪 等進戲院再來看看

  愛台灣，團結一心，住台北我驕傲


  --'
