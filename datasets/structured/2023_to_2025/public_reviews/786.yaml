title: '[  負雷] 台北追緝令破綻百出'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  台北追緝令破綻百出

  看完後覺得細節不夠到位

  劇情不合理很多人說了不用我重複

  但一些bug真的很讓人出戲


  一、2009-2011認識，竟然去了這三年內流行的韓系拍貼機


  二、住陶朱隱園，上樓後窗景卻猶如陽明山上，遠遠俯瞰市區


  三、辦公大樓在信義區，上樓後會議室窗景，101卻超遠超小地聳立......


  四、傍晚在家準備晚餐，外面天還亮，牆上時鐘顯示7:45-7:50左右的位置......


  五、鏡頭帶到松山機場飛機降落，下一秒主角出機場在桃園機場


  六、捷運廣播中正紀念堂到了，背後窗外月台卻是藍線（疑似板橋站）起身離開車廂後，

  下一秒出現在西門洛陽停車場


  類似的狀況還有很多，真的可惜了

  對於長期生活在台北的人而言

  真的是想幫電影袒護都難。


  --'
