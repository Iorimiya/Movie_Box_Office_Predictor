title: '[新聞] 盧貝松《台北追緝令》全片台灣取景！桂'
content: '新聞網址：


  盧貝松《台北追緝令》全片台灣取景！　桂綸鎂「街頭飆法拉利」尬韓哥


  記者蕭采薇／台北報導



  外，


  卡司還包括路克伊凡斯（Luke Evans）、「韓哥」姜成鎬（Sung Kang）等好萊塢巨星。


  《台北追緝令》公開首款海報與預告，充滿熟悉的台灣街景。


  姜成鎬化身反派，與路克伊凡斯刺激打鬥，更驚見桂綸鎂逆轉形象挑戰街頭飛車戲碼，


  以及李沛旭展露驚人壯肌手持雙槍掃射等精彩畫面！


  全片槍砲彈藥、飛車追逐、近身肉搏、情愛糾葛一應俱全，


  更


  盧貝松在2014年為執導《露西》來台取景拍攝，當時便對台灣讚譽有加，


  更曾允諾將再度來台拍攝。如今他信守承諾，




  ，帶著最新動作鉅片《台北追緝令》重返台灣。


  尤其本片是影史首部全片在台灣拍攝的好萊塢動作電影，


  集結《玩命關頭》系列（Fast & Furious）路克伊凡斯與「韓哥」姜成鎬，


  以及「金馬影后」桂綸鎂領銜主演。故事描述路克伊凡斯飾演的美國緝毒局探員，


  為了緝捕姜成鎬飾演的販毒集團首腦，選在週末時來到台北，


  卻意外與桂綸鎂飾演的頂級「車手」前女友重逢，




  值得一提的是，在《玩命關頭》系列以低調沉穩「韓哥」一角，


  廣為全球影迷喜愛的「姜成鎬」，這次將化身「大反派」詮釋販毒集團首腦，


  更頂著挑染造型與冷酷眼神，開槍絲毫不眨眼，更與路克伊凡斯近身肉搏，


  實在與戲外溫暖親切的印象相去甚遠，反差表現值得影迷高度期待。




  桂綸鎂先以以彷彿《第凡內早餐》（Breakfast at Tiffany’s）的造型優雅登場，


  沒想到下一秒就逆轉形象，開始駕駛法拉利在台北街頭急速狂飆，


  後續也將展現矯健身手，摔人、開槍樣樣來。


  桂綸鎂這回不僅逆轉過往形象，更將在片中以流利英文進行演出，


  勢必將讓觀眾耳目一新。電影將在9月25日全台上映。




  ----


  導演只用一行帶過去


  --'
