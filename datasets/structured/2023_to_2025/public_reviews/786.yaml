url: https://www.ptt.cc/bbs/movie/M.1729991374.A.A9A.html
title: （普雷）台北追緝令觀後感
content: '本來是帶著想被娛樂坐看無腦爽片的期待進片場，沒想到最後還是帶著失望的心情離開影

  院!

  這部片最讓人不解的是故事前後邏輯連貫的合理性:

  (1)槽點1:電影最後有提到桂倫美加入韓哥團隊的過程，既然韓哥沒蹦掉桂的外婆，而且

  也給了桂一份可以發揮她的開車專業且收不錯的工作，何來對韓哥的恨之有?男主角也是

  跟桂在追逐過程中翻車受傷的，也不關韓哥的毛事，韓哥啥也沒做就被桂跟她的兒子醜一

  ，真為韓叫屈!


  (2)槽點2:桂的兒子是從一出生就跟韓哥一起長大，就算只是養子，也不可能一點親情都

  沒有，但片中兩人互動給我的感覺，像是韓哥娶桂倫美時，兒子才剛死了親生老爸，所以

  才會對韓這個繼父充滿恨意，但故事又不是這樣安排，看了很不解。


  (3)槽點3:桂在片中是個充滿天份的賽車手，懂開車也懂機械原理，但片中對這部份卻著

  墨甚淺，看不懂編劇跟導演要表達什麼，說是賽車爽片，也沒玩命關頭有那種看了會讓人

  血脈噴張的追逐名場面。


  (4)槽點4:法拉利可以在台北街頭開到時速快200km/hr試車?這點可能要請有這種財力的大

  大來回覆，個人是覺得超不合理。


  (5)槽點5:男主角有什麼神通廣大的本領可以帶3箱軍火通過台灣海關，如入無人之地?第

  一個接機的朋友，戰鬥力也太弱，在飯店槍戰時，打沒幾槍就投降?


  總之不是部好看的電影，早知道就去看麵包超人 XD


  --'
