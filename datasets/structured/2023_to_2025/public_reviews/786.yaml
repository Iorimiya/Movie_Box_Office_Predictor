title: '[新聞] 【台北追緝令】加碼盧貝松夫婦再訪台灣！'
content: '新聞網址：



  影史首部全片在台灣取景拍攝的好萊塢動作強片《台北追緝令》（Weekend in Taipei）

  ，繼日前宣布導演黃嘉智（George Huang）、主要演員桂綸鎂、「韓哥」姜成鎬（Sung

  Kang）與童星楊明偉（Wyatt Yang）即將訪台宣傳的消息之後，不少觀眾紛紛留言，期望

  也可以再度見到擔任本片編劇暨監製的「億萬票房名導」盧貝松（Luc Besson）！而經過

  台灣發行商「采昌國際多媒體」與劇組的極力爭取之後，今日（8/30）確定加碼盧貝松與

  共同擔任本片監製的愛妻維吉妮貝松席拉（Virginie Besson-Silla），將共同加入訪台

  陣容，與台灣民眾近距離相會！眾人將在本週日（9/1）傍晚17:00起，出席位在台北信義

  威秀影城中庭廣場舉辦的「世界首映紅毯見面會」，現場也將準備精美小禮物贈送給參與

  民眾。尤其這是影人們此次來台宣傳，唯一公開與粉絲觀眾們相見的活動，敬請把握機會

  參與！《台北追緝令》日後也將在9月25日（週三）於台灣盛大上映。





  年度必看好萊塢動作強片《台北追緝令》，全片都在台灣取景拍攝。日前宣布台灣出身的

  導演黃嘉智、主演桂綸鎂、「韓哥」姜成鎬與童星楊明偉，將在本週六（8/31）重返台灣

  ，預計停留至9月3日，進行為期四天三夜的台灣宣傳活動。消息一出，許多觀眾也十分關

  心曾在台灣拍攝電影《露西》（Lucy），並在本片擔任編劇與監製的盧貝松，是否也會跟

  著一起來台灣宣傳？經過台灣發行商的來回溝通，如今劇組再度為台灣觀眾帶來驚喜好消

  息，確定擔綱本片監製的盧貝松與愛妻維吉妮貝松席拉，都將加入本次訪台陣容，也是兩

  人繼《人犬》（DogMan）之後，睽違八個月再度訪問台灣，與觀眾們再次相見！





  即將重返台灣的《台北追緝令》影人們，為了能夠與廣大台灣觀眾們近距離互動，一行人

  將在9月1日（週日）傍晚17:00起，出席在台北信義威秀影城中庭廣場舉辦的「世界首映

  紅毯見面會」！本場活動開放民眾免費參加、共襄盛舉，活動現場也將準備許多精美小禮

  物，致贈給熱情參與的大家。值得一提的是，這次的「世界首映紅毯見面會」，更是影人

  們在台灣唯一一場與民眾相見的公開行程，活動現場特別開放民眾能與影人們簽名互動，

  敬請把握機會參與，讓影人們感受台灣粉絲的熱情與支持！



  這部集結億萬票房製作團隊，將讓全世界觀眾看見台灣之美的《台北追緝令》，即將在9

  月25日（週三）於全台盛大上映。本片劇情描述美國緝毒局探員約翰（路克伊凡斯飾演）

  ，不僅是超強工作狂，更會犧牲一切、不擇手段，只為順利完成案件。不巧，在命運的捉

  弄下，他與思維敏捷又難以追捕的頂級「車手」喬伊（桂綸鎂飾演）墜入愛河，最後卻捲

  入犯罪陰謀當中，迫使兩人分開。沒想到15年過去，約翰為了緝捕販毒集團首腦關（姜成

  鎬飾演）來到台北，原本預計停留一個週末的時間，但彷彿命運再度出手攪和，讓他與喬

  伊奇蹟般地重逢，更發現她已經有個兒子雷蒙（楊明偉飾演）。此時，關的威脅伴隨而來

  ，讓三人不得不攜手迎戰！



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



