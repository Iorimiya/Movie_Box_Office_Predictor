title: '[新聞]【台北追緝令】影人訪台，9/1與民眾紅毯見'
content: '新聞網址：



  由「億萬票房名導」盧貝松（Luc Besson）監製暨編劇，影史首部全片在台灣取景拍攝的

  好萊塢動作強片《台北追緝令》（Weekend in Taipei），劇組今日（8/13）公開天大好

  消息，正式宣布導演黃嘉智（George Huang）將率領主要演員桂綸鎂、「韓哥」姜成鎬（

  Sung Kang）與童星楊明偉（Wyatt Yang），在8月31日至9月3日期間訪台宣傳！眾人不僅

  將參加記者會與媒體見面暢聊拍攝花絮，同時也將出席盛大的「世界首映紅毯見面會」，

  預計將在9月1日（週日）傍晚17:00起，在台北信義威秀影城中庭廣場跟粉絲們近距離相

  見，活動詳情請密切留意官方社群公告（）！即

  將再度訪台的主要影人們，也念念難忘當時的美好經歷與各種台灣美食，更期待此次訪台

  能再度跟熱情台灣民眾見面！《台北追緝令》之後也將在9月25日（週三）於台灣盛大上

  映。





  由台灣出身的黃嘉智，他所執導的好萊塢動作強片《台北追緝令》，去年在台灣拍攝時便

  引發高度關注，如今劇組也透過台灣發行商「采昌國際多媒體」宣布，黃嘉智導演將攜手

  桂綸鎂、「韓哥」姜成鎬與楊明偉，四人在8月31日至9月3日重返台灣進行一連串宣傳行

  程！尤其為了跟廣大台灣粉絲近距離互動，影人們也將在9月1日（週日）傍晚17:00開始

  ，於台北信義威秀影城中庭廣場舉辦「世界首映紅毯見面會」！為了讓觀眾與粉絲共襄盛

  舉，本活動將開放民眾免費自由參加！歡迎欲參加本活動的民眾們，可以提前到場找到好

  位置，與影人們近距離互動，也期待讓影人們再度感受到台灣粉絲的熱情與行動力！





  即將帶著《台北追緝令》再度訪台的美籍台裔導演黃嘉智，表示由於自身亞洲人的身分，

  在好萊塢時常無法感受到歸屬感，而來到台灣之後，則產生完全不同的感覺，他對此感性

  分享：「當我來到台灣，我真的感覺到歸屬感，覺得我屬於這裡，有融入的感覺，就像回

  家一樣。就算我不是本地人，卻像是歸屬於這裡，這樣的感覺真的很棒！」他也點名這次

  來台灣後，能找機會再度大啖蛋餅、芒果雪花冰、刈包、滷肉飯等多樣台灣美食。另一方

  面，當時在台灣拍攝掀起一股「韓哥風潮」的好萊塢巨星姜成鎬，去年也曾為棒球活動開

  球，美好經歷讓他念念難忘，他也期待此次訪台，能有機會體驗到更多不同的體育活動，

  並與台灣粉絲們再次相見！



  這部集結億萬票房製作團隊，將讓全世界觀眾看見台灣之美的《台北追緝令》，即將在9

  月25日（三）於全台盛大上映。本片劇情描述美國緝毒局探員約翰（路克伊凡斯飾演），

  不僅是超強工作狂，更會犧牲一切、不擇手段，只為順利完成案件。不巧，在命運的捉弄

  下，他與思維敏捷又難以追捕的頂級「車手」喬伊（桂綸鎂飾演）墜入愛河，最後卻捲入

  犯罪陰謀當中，迫使兩人分開。沒想到15年過去，約翰為了緝捕販毒集團首腦關（姜成鎬

  飾演）來到台北，原本預計停留一個週末的時間，但彷彿命運再度出手攪和，讓他與喬伊

  奇蹟般地重逢，更發現她已經有個兒子雷蒙（楊明偉飾演）。此時，關的威脅伴隨而來，

  讓三人不得不攜手迎戰！



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
