url: https://www.ptt.cc/bbs/movie/M.1678682746.A.DB5.html
title: '[新聞] 布蘭登費雪《我的鯨魚老爸》奪影帝 淚崩'
content: '新聞網址：


  布蘭登費雪《我的鯨魚老爸》奪影帝 淚崩大喊：老天爺！




  〔記者廖俐惠／綜合報導〕


  第95屆奧斯卡金像獎頒獎典禮在台灣時間今天早上8點登場，最佳男主角由《我的鯨魚老

  爸》的布蘭登費雪（Brendan Fraser）拿下，他在台上激動地直呼：「老天爺啊！謝謝影

  藝學院給我這個榮耀，我很感謝！」


  現年54歲的布蘭登費雪擁有《神鬼傳奇》、《森林泰山》等知名作品，但自從電影《決戰

  線》（2013）之後就沒再主演電影。他透露，過去曾遭到金球獎主辦單位好萊塢外籍記者

  協會前主席菲利普伯克 （Philip Berk）性騷擾，拒絕潛規則遭到業界封殺，加上母親過

  世、離婚等眾多打擊，布蘭登費雪也漸漸淡出銀光幕前。這次布蘭登費雪憑藉著《我的鯨

  魚老爸》中體重過重的生病英語教師查理復出，首度入圍奧斯卡最佳男主角並成功獲獎，

  走出人生低潮，迎來事業新巔峰。


  布蘭登費雪指出：「我很感謝導演戴倫艾洛諾夫斯基為我提供一條創意的生命線，把我拖

  上了『我的鯨魚老爸』這艘好船，這是由薩繆爾D亨特編劇所寫，他是我們的燈塔，你們

  把你們如同鯨魚般的心胸展現出來，使我們能窺探看到你們的靈魂，這是別人無法做到的

  。」


  布蘭登費雪有感而發稱：「我從30多年前開始從事這個事業，那對我來說並不容易，很多

  事情當年我不懂得珍惜，停了下來，我現在想要說謝謝你們的認可。」


  /


  恭喜費雪！


  --'
