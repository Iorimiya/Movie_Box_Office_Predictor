url: https://www.ptt.cc/bbs/movie/M.1679922830.A.DD7.html
title: 'Re: [好雷] 我的鯨魚老爸'
content: '妳的排版讓我好難回

  本來昨天也想發心得，但由於除了查理的，其他角色都還沒打，只好作罷

  純討論這個角色


  查理在整個劇情中，就是一個很廢但想把自己所有資源都給女兒的肥宅老爹

  這樣的情操是否是鯨魚的特性，我不太清楚，整篇下來最符合的應該是身型，臃腫、肥碩

  ，怎麼有辦法把自己撐成這樣?劇情慢慢地給出原因。因為情人艾倫的死，變得暴飲暴食

  ，呼應艾倫瘦了一噸的情況，而他的心情相當極端，整個家弄得亂糟糟的，卻只有艾倫的

  房間，整整齊齊，一塵不染，就像心底那最純潔無瑕的那個挪威的森林；有一幕是他在門

  口進不去只好深吸一口氣，一副十分滿足的模樣，有點變態...但又好像能夠理解，那是

  他心裡最純淨的地方。


  對於Ellie，他是心裡相當後悔的，沒有辦法盡自己照顧的責任，但又想獲得愛情，在最後

  臨走前他想見到他女兒，這是人性，希望贖罪，妳說他不後悔嗎?

  我想他非常的後悔，所以他才會一直以來存錢給自己女兒，並且鼓勵她，讚美她

  就連Mary說艾莉是惡魔時，他也站在艾莉那邊

  他很想修補這段關係，但卻苦於沒有任何的方式，只好試著用金錢來吸引她


  其中有一段，很好的演出了他對自己的自卑，當他看到丹在樓梯等著見他廬山真面目，

  他沒有閃躲，而是挺直身軀想打個招呼時，丹看著他的身型時，那錯愕中帶有失望的

  表情，他也疵了一聲，好似再說，有什麼了不起的，但就是這樣被瞧不起的感覺，深深

  刺痛他的心，音樂一轉，開始深沉，帶著心跳的節奏，開啟了暴食的模式，披薩一次好

  幾片一口咬下，寫郵件發洩，披薩味道不夠，還加上起士、美乃滋，直到吃到吐；接

  著湯瑪斯的出現再次刺激到他，他變得瘋狂


  我覺得查理是非常可悲的，並不是要認同他拋家棄子的行為

  而是他知道自己錯了，他喜歡的是男生，偏偏又想要找一個人幫忙生小孩

  想要關心自己的孩子，卻又被前妻阻擋在外

  身體不行，工作不行，婚姻也沒經營好

  除了失敗，他沒有其他可以說出嘴的事

  最關鍵的還是那句

  I need to know that I have done one thing right with my life.

  那一幕，我看到眼眶泛淚

  明知道自己走到這樣一整個窩曩

  但卻希望至少有一件事情，他做對了


  妳覺得他噁心，我不否認妳的看法

  但很多人都是這樣，一路走來犯了錯，總想彌補

  卻又不知道該如何彌補，既牽掛又只能在心理默默思念


  很悲情的一個角色


  --

  真的，可以感受男主對人生的絕望，卻又麻痺著活著

  呼應了女兒希望他往前走的劇情

  只有在死前，才有拚盡一切的勇氣，縱然是迴光返照

  [[很想返回大海，暗喻自己就是那條白鯨

  無法否認他的所作所為就是一團狗屎

  但每個失敗者又何嘗不是這樣'
