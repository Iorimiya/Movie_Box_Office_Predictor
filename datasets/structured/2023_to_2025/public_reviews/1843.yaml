title: '[偏好無雷] 我的鯨魚老爸-布蘭登費雪演技無敵了'
content: '我的鯨魚老爸 7/10分


  主要好評給布蘭登費雪

  他在這部片中的演技實在是不得了

  從一開始對他外觀的厭惡

  到最後開始同情他的遭遇

  從頭到尾都是深刻人心


  但故事重點太發散

  不知道主角到底要的是什麼

  親情?友情?愛情?

  都各來一點的感覺


  回到主角本身

  可以體會他對人生的無能為力

  以及走不出的陰霾

  單就以主角的角色塑造來講

  很深刻

  但可惜就如同上述

  重點太東湊西湊


  但仍是一部有可看之處的片

  光是布蘭登費雪為戲所做的特殊化妝

  就已經可以讓人歎為觀止了



  --


  無雷 電影/影集短評IG：




