content: "車庫今日正式公佈\n\n由Darren Aronofsky執導、Brendan Fraser主演的《The Whale》將由他們代理發行\n\n\
  台譯片名翻為《我的鯨魚老爸》 預計在2023年2月排映\n\n以下轉貼車庫貼文\n\n-----\n\n\n布蘭登費雪 強勢問鼎奧斯卡生涯代表作\n【我的鯨魚老爸】\
  \ The Whale 登全美2022年度單廳票房冠軍！\n\n【我的鯨魚老爸】 The Whale 上週末於北美戲院限定放映，單廳戲院平均票房約6萬美金\n\
  ，是導演 戴倫艾洛諾夫斯基 繼《黑天鵝》後最佳開片票房紀錄！單廳戲院平均票房更\n超越《媽的多重宇宙》，寫下 2022年全美單廳票房年度最高紀錄！\n\n口碑大爆棚觀眾感動淚推！\n\
  \ IMDb 高達8.4分\n 爛番茄爆米花指數94%\n\n「一次完全的勝利」\n「布蘭登費雪的演出值得一座奧斯卡」\n「強而有力且觸動人心的故事，你將會帶著淚水離開戲院」\n\
  「布蘭登費雪不同凡響的真摯演出，是今年看過最棒的電影」\n\n 《我的鯨魚老爸》\n 2023年2月全台感動上映\n\n打破《媽的多重宇宙》票房紀錄，坐擁2022全美年度單廳票房冠軍\n\
  《神鬼傳奇系列》布蘭登費雪強勢問鼎奧斯卡生涯代表作\n《黑天鵝》奧斯卡提名導演睽違5年最新感人力作\n《怪奇物語》人氣女星「麥克欣」莎蒂辛克加盟演出\n布蘭登費雪挑戰極限化身270公斤同志老爸\n\
