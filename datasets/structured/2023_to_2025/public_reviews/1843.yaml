title: '[ 好雷]我的鯨魚老爸 讓我想起為什麼我愛電影 '
content: "#我的鯨魚老爸\n\n這部電影整個就是讓我回想起\n為什麼我愛電影的原因\n整部人物不多 場景嚴格說起來 只有一個!\n主要人物2個 配角3個\n\
  就架構起了這部電影\n組合成 感人會讓我省思的電影\n有幾段眼淚還爆出來的那種\n非常推薦 心中有結 的人可以看~~ 超級推\n後面有雷 有看得再來討論囉\n\n\
  \n---------------------防雷----------------\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n整部電影以一個 微尷尬的開場\n但就這樣帶出了主角的性向(離開女兒的原因)\n帶入第一個宗教配角\n再過幾分鐘 另一個重要配角\
  \ 女護士好友也就出現\n因為這場意外 他知道自己已經時日不多\n\n他人生最大的遺憾剩甚麼呢 就是女兒了\n之前打官司時 有明令禁止他靠近女兒\n但將死之人有甚麼好怕的\
  \ 總之因為這個原因\n女兒這個腳色也很自然的被帶入\n\n 我喜歡這部電影處裡人物的關係\n 利用對白 帶入了很多重要的東西\n男主愛女兒的心\n(錢都不用\
  \ 醫院不敢去 因為男主覺得\n那是他唯一最實在可以留給女兒的東西)\n護士女友人 照顧男主的身心靈 一邊責備\n但當男主給她 那無奈的眼神\n她就心領神會的接續著\
  \ 做她願意為他做的事情\n\n女兒的叛逆 但心中是愛爸爸的\n不然電話可以不接 人其實是完全可以不用出現在爸爸家的\n她講話很難聽 因為她在八歲就被最愛的爸爸拋棄\n\
  那種痛 讓她隔絕了所有人\n而且因為媽媽當時離婚的不甘\n媽媽完全不希望爸爸出現在她們母女的生活中\n媽媽出現的那一段 也利用對白 說出了 她除了不甘\n更多的是\
  \ 不想讓男主 覺得她沒把女兒帶好\n女兒叛逆到身邊的人都覺得她沒救了\n她希望她至少可以維持著在前夫面前唯一的尊嚴\n\n我不知道三言兩語是否能將我的心情解釋出來\n\
  但所有人的關心\n透過對白 眼神 行動 在這部電影裡面 像空氣一樣\n那麼自然地飄進了我的內心\n很棒 我很喜歡 推薦大家去看\n\n--"
