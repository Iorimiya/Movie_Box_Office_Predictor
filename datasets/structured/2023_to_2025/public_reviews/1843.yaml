url: https://www.ptt.cc/bbs/movie/M.1713572079.A.323.html
title: '[巨宅負雷] 我的鯨魚老爸 肥宅甲甲 唉'
content: '這部片真是無聊死了


  在飛機看到差點睡著


  結果小模女友又一直搓揉我下面讓我硬到受不了


  真是的


  為了消腫


  只好起床把這部爛片看完









  以下有雷














  整部片根本超級爛


  到底是在搞什麼


  一個肥宅


  從年輕時


  就跟一個男的到處幹


  得了好幾次愛滋病跟梅毒 還有菜花的樣子


  幹一幹之後


  被男友甩了


  於是為了要有下一代


  就找一個女人結婚


  生下一個…


  不知道該怎麼說的女兒


  整天只會靠腰


  後來女兒八歲時因為前男友回來找他


  又拋妻棄子


  回去跟甲甲在一起了


  最後甲甲因為愛滋病死了


  所以肥宅就吃 一直吃 瘋狂吃


  結果…肥成200.300公斤


  最後沒辦法走路


  但沒想到


  出乎意料的是


  女兒最後在肥宅可能差不多要死的時候


  拿著散彈槍 一槍送他老爸上西天了











  這部片劇情就是這麼無聊又低能


  偏偏板上又是滿滿的好雷


  似乎是深怕奧斯卡得獎片


  不發好雷


  別人會覺得你看不懂似的


  但卻又誤導


  真正了解電影、懂得欣賞電影的人


  筆者認為十分可悲


  謝謝大家



  --'
