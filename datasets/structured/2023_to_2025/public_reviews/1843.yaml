title: '[討論] 我的鯨魚老爸 (有雷)'
content: '一開始看Liz對Charlie好像有點男女之情，尤其是她躺在Charlie肩膀的時候好像很享受


  一樣，後來隨著劇情演進感覺應該又像只是對哥哥的情感代償，沒有愛情的成分，不過


  她任勞任怨，即使得知Charlie不是真的沒錢還是照常來照顧他，即使知道對他身體不好


  還是幫他買三明治跟加量起司，看得出她滿溺愛Charlie的...



  前妻Mary跟Charlie兩個應該還是相愛著彼此，尤其是吵架那場戲，彷彿是「婚姻故事」


  重現，兩人都有些誤會也都有彼此的苦衷，說開了總感覺有可能復合？



  女兒Ellie到底是為了傳教士好還是故意的把他呼麻跟自白偷錢的部分傳給教會跟父母，


  如果依常理判斷應該是想看熱鬧，擾亂傳教士的生活，而不是Charlie說的是為了他好。


  依照媽媽對她的描述，應該是單純想搗亂？


  話說沒查不知道，傳教士本人Ty Simpkins還演過幾個很知名的腳色，例如鋼鐵人三的


  小男孩&侏儸紀世界女主的小外甥，沒想到現在已經長這麼大了XD



  最後沒想到結局是開放式的，不知道原著有沒有明確的結局？ 看起來感覺最後Charlie


  臉色蒼白體力不好的樣子，努力爬起身走向Ellie後就心臟不堪負荷就走了...



  --




  　　　　　　　　　　　　

  　　　　　　　　　　　

  　　　　　　　　　　　　　　


  --

  應該是

  殺鳥我沒注意到，只看到盤子被敲破，這樣說來FB的狗屍體照可能是在炫耀戰利品？

  仔細想想她有成為變態殺人犯的潛質XD'
