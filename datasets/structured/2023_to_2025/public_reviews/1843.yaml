url: https://www.ptt.cc/bbs/movie/M.1677644088.A.4C8.html
title: '[好雷]我的鯨魚老爸The Whale '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  想看程度排在《日麗》、《鬼家人》、《瑪琳艾索普：首席女指揮》之後，但因著室友弟

  弟助攻，在連假最後一天接受室友邀請而衝了京站威秀。


  確實好看。原以為會有點悶或虐，結果完全沒有。電影一氣呵成，緊張與放鬆之間，步調

  流暢到幾乎意識不到時間流動。一開始真的認為這部片可以超越前一天看的《日麗》，不

  過約三十分鐘的轉場間，忽然因它較為劇場的形式而被推到故事之外，接下來的心情便更

  偏向欣賞角色的表演，思考其中的議題，而無法情感共鳴。


  故事情節緊扣的美國社會／文化／信仰，時時讓我想到手邊正在讀的《高學歷的背債世代

  》中提出當代美國人可能面臨的種種問題：醫療（醫療保險與過高的醫療費用）、學歷（

  學校教育的目標取向）、信仰（家庭與人際關係）、性傾向（在出櫃之後，需要面臨的問

  題不比原來更少）、單親壓力（教養與自我形象），透過戲劇呈現得精彩萬分。


  「人無法獨活於世界」、「人不能拯救另一個人（愛也無法拯救人）」、「在死亡面前許

  多事才能搬上檯面」以及「如果沒有誠實，寫作都是沒有意義的」等，啟發性的思考接連

  出現，喜歡這類作品的人，不可錯過這部片（雖說光是布蘭登費雪就值得進場）。


  對我個人來說，比較可惜的是故事最終太理想（可能與偏劇場的呈現有關？），電影結束

  時覺得結束之處就是一個情緒上的昇華。在片尾時回想一切，難以撇開「問題無解」的想

  法。



  ***


  這裡是我的樂園:




  --'
