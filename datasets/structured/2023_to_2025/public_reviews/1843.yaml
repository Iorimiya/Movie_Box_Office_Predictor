url: https://www.ptt.cc/bbs/movie/M.1677990610.A.AAD.html
title: '[普雷] 我的鯨魚老爸-只是一部自我毀滅之路'
content: '防雷














  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看完覺得這部完全是靠演員

  電影的節奏很奇怪


  後來去查知道是舞台劇改編才比較釋懷


  原來讓我覺得奇怪的地方

  就是因為像舞台劇似的

  比如說女兒暴怒

  走到門口開門，被叫住她就停住


  一段戲接一段戲、角色走到定位、講話

  就像舞台劇似的


  如果要拍成電影不該讓觀眾感覺到這點吧

  這是我覺得這部電影有點讓我出戲的地方


  然後主角本身沒啥成長，個性也看似完美

  除了自殺式爆食跟拋家棄子以外

  但這些都是電影發生前的事情

  在這電影進行當中，主角卻完全沒有成長

  (除非你把"最後站起來走到門口"算成長)


  因為他根本沒有成長的空間

  有成長空間的都是別人

  他沒有走出失去摯愛的創傷

  也沒有真正幫到他的前妻


  只是說他不覺得他的前妻教育失敗

  雖然很正面，但我覺得這並不是事實

  艾利的教育的確是失敗了，你不能這樣嘴上說沒事

  頂多只能說艾利的失敗不能全怪在前妻身上


  然後就因為父親記得自己八年級的作文

  艾利的人生就得到救贖

  我是覺得力道有點不夠、沒辦法說服我


  青少年的偏差不是這麼容易就解決的

  艾利的反社會傾向、大麻問題、傷害衝動

  你這樣就讓他解決我反而覺得傷害到了那些為這些問題所苦的人

  有點太兒戲了


  我反而覺得看到自己父親最後死在自己眼前

  這根本只會讓他產生更多PTSD吧

  甚至是不是真的好心想幫傳教士這我也是打個問號


  明明有兩個小時的時間

  卻沒辦法好好把一段故事裡的角色都處理好

  我只看到大家演哭戲演得很用力

  但哭戲的背後仔細去深掘，卻好像挖不出甚麼東西


  比如說失去摯愛所以失控

  這是這部電影會存在的的原因

  難道不應該針對男友跟主角的感情多一點著墨嗎


  失去另一半就把自己搞得死去活來

  其實還蠻不健康的

  對於失去伴侶產生創傷這件事

  不同的人會有不同的感受

  有人可以感同身受、但也有人會覺得大驚小怪


  為了讓看這部電影的人價值觀調整到相近的高度

  這應該是電影應該要做的事情

  而不是把原因丟給觀眾，接受的就接受不接受的那我兩手一攤


  有病拒絕看醫生

  男主角的自我毀滅從開始到電影結束都沒有改變


  一直想教育女兒

  但卻沒辦法教育她最重要的事情:人面對挫折後該怎麼站起來

  我也不是否定他這樣不行，但這部電影說穿了就是在講一個


  失去摯愛絕望到不顧其他親朋好友的自殺實錄


  --


  然後不知道為什麼看到一半一直讓我想起鳥人

  叛逆的女兒，有問題的老爸

  吵起架來的鏡位、甚至最後都飛上天...XD



  --

  最後把自己的狀況秀給學生看

  其實我覺得不是誠實面對自己,而是絕望到老子無所謂了

  他的問題也不是不能面對自己,是不能接受男友過世啊'
