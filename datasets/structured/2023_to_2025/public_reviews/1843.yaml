url: https://www.ptt.cc/bbs/movie/M.1758961092.A.877.html
title: '[好雷] 我的鯨魚老爸：片刻的理解'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《我的鯨魚老爸》好雷：片刻的理解\n\
  \n1.你願意，讀一首沒用的詩嗎？\n\n《我的鯨魚老爸》直接挑戰觀眾同理心的魔王級題材：一個為愛拋家棄子的中年老白肥胖\n男同志，還不甩其他人幫忙執意暴食？說真的，到底誰在乎（Who\
  \ even care)？\n\n《我的鯨魚老爸》的敘述角度，從這樣悲慘、常人難以理解的視角出發，最後成功鬆開了\n一些成見（但還是很絕望就是了）。\n\n2.\n\
  肥胖之所以被貼上負面標籤，是因為我們會把身材跟自控力、生活自理能力劃上等號，而\n這也是外送員、女兒甚至是傳道的湯瑪斯一開始看到的解讀。\n\n往下挖掘，這些來自查理的焦慮性進食。逃離不了負罪感、他人的眼光等種種壓力源，他\n\
  只能這樣舒緩情緒，最後上癮。\n\n後來揭開男友艾倫，因為完全放棄進食而死。查理的暴食，又多了一層對稱和補償的意義\n。\n\n他用過份的吃向男友的決絕致敬，也是贖罪。\n\
  .\n女兒艾莉對整個世界的憤怒，好似出自於邪惡，或是青春期的叛逆。再往下深究，其實是\n不解自己為何被父親拋棄，難以排解童年失去父愛的缺憾。\n\n挖苦挖苦，人生就是越挖越苦，但情感越來越清楚。\n\
  \n3.\n電影除了呈現人為何自毀，也嘗試讓角色「透過幫助他人完成救贖」。\n\n先不提湯瑪斯透過死板灌輸的傳教，想要證明自己的價值。查理也在透過幫助女兒，想證\n\
  明自己至少做對了一件事，人生還有點意義。\n\n但《我的鯨魚老爸》呈現的世界令人喪氣。湯瑪斯最後被女兒艾莉的惡意（我不相信她人\n有那麼好，抱歉）意外拯救，查理則是到死都反覆記憶女兒的文章，從中得到虛幻的理解\n\
  和寬慰。\n\n真正的拯救僅有短暫存在，而且從未以你想像的方式到來。\n\n4.\n《我的鯨魚老爸》的矛盾，赤裸的讓人無語。\n\n查理為愛背棄信仰，又近乎信仰地復誦女兒的閱讀心得。\n\
  \n派一個自我厭棄至極的人，跟艾莉說她多美好、多漂亮；一個拒絕求助自我放棄到死的人\n，想說服女兒前面還有大好前程。\n\n憋到死前的「我就爛」，真的有比較好嗎？（雖然我在影廳哭得要命）脫離將死的框架，\n\
  不就是自我安慰的空話嗎？\n\n最後，還是放不下那些沒用的雞湯語錄，對吧？\n.\n\n\n人心時而自私時而無私，好像有些貢獻，又毫無長進。\n\n以為殺死鯨魚，就能解決問題；以為堅守信仰幫助他人，就能得到救贖。\n\
  \n最重要的問題，其實是：\n\n\n\n\n\n\n>> 網頁好讀版：\n\n–\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond\
  \ \n個人網站：\n\n--\n這片真的很厲害\n怎麼看男主角都有可憎之處，但廢到最後奮力起身，還是讓人鼻酸"
