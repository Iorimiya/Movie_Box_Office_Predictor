url: https://www.ptt.cc/bbs/movie/M.1678164862.A.D9D.html
title: 'Re: [微負雷] 我的鯨魚老爸'
content: 'A24信徒來回你



  這部電影主軸是在講「誠實面對自己」、

  「當自私的選擇自己所要，就容易傷害到一方」


  當然對於Liz，查理是自私的，但Liz從來沒有

  後悔，因為沒有血緣關係的親情，可能是最純

  粹的愛，（另部片《敲敲門》也有提到），查

  理對Liz而言，等同於親哥哥，也是因為感謝

  查理救贖了艾倫，縱使他還是自殺，但查理給

  了艾倫他需要的愛；所以Liz或許看起來是被利用，但對Liz而言，這是她心甘情願的付出，因為人無法不去關心自己在意的人。




  查理為何不花這些錢，除了固定贍養費外，

  主要是要讓女兒往後有一筆錢能運用生活

  同上面說的，這是人自私的後果跟選擇

  但Liz就算知道實情，也不怪查理，依然守護

  到查理最後一刻。而查理本就想慢性自殺，

  只是他只是想在最後為女兒做對一件事。




  在查理拋家棄子前，查理是積極向上的個性

  這點在瑪麗的對話中提到，查理已經放棄了

  自己的人生，但又不希望別人也如此，課堂

  的學生、邪惡的女兒，他都希望把他們導向

  好的方向。


  電影中的表現，是非常好的反差，原本內心是

  如此積極、講話溫文儒雅的查理，現在卻是遭

  受身心疾病的龐然大物。



  現實中，很多憂鬱症或其他心理疾病患者，都

  是會大量進食來療癒自己內心，Liz覺得這樣做

  能讓查理得到片刻的救贖，她也尊重查理意願

  ，畢竟誠實面對自己想走的路，對於兩個人來

  說，都是重要的。




  這就是傳教士跟外送員的「自私」


  一個只是為了心中教義

  一個只是好奇心

  但都不是真正的想深入關心


  就連課堂的學生都一樣，當查理露臉後，

  有的偷笑、有的拿手機拍




  不是死前想自慰，是因為自慰造成心臟無法

  負荷，想在死前聽女兒的文章




  沒有脫離現實太多，現在社會的角落充滿

  這樣的人生。。



  飛天意味著這「可憐的龐然大物」已飛向天堂

  的海洋，解脫悠遊著（片尾BGM有海洋聲)

  ，也是飛往那個查理家最幸福的那個海灘日。



  -----

  Sent from JPTT on my Xiaomi 21091116UG.


  --'
