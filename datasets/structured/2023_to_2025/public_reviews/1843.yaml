title: '[好雷] 我的鯨魚老爸'
content: '雷文防雷資訊頁


  "I need to know that I have done one right thing with my life!"


  (警告：以下有雷)


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  自認是個笑點高 哭點高的人


  多年的人生歷練下


  各種情緒的閾值被堆高


  殊不知 簡單的一句話


  淚腺失守


  原來呀 我也不過是個普通人



  主角是位老師


  擔任線上課程的講師


  曾有個美好的家庭


  但因為與男同學產生情愫


  他放下了太太 放下了八歲的女兒


  追求自己認為的真愛


  隨著後來男友自戕


  主角心力渙散


  即便是細讀了男友再熟悉不過的聖經


  仍無法得到救贖


  就此開啟了他自暴自棄 增重且無心回頭的故事



  其實影片看到八成


  沒有太多感觸


  不過是交代各個角色各自的心路歷程


  直至居家護理師受不了良心的折磨離去


  (看病患一天天發胖卻無能為力)


  女兒無法諒解而奪門而出


  (認為自己八歲時被主角自私的拋下)


  前妻對當初的委屈百般怪罪下


  (社會輿論下所背負的種種)


  主角概括承受了各方所安的罪名


  忍住喘不過氣的不適


  擠出一句："I need to know that I have done one right thing with my life!"


  (我要確定我這輩子至少做對了一件事！)


  與自己荒誕的人生擦出火花


  鼻頭一酸 實在擋不住啊



  人生


  有時候走著走著


  該偶爾停下腳步回首


  回想那些別人做不好的 別人所虧欠的


  回想那些自己做不好的 自己所虧欠的


  這麼多年了


  花了許多心力在工作


  花了許多心力在家庭


  花了許多心力在學習與人相處


  也花了許多心力在學習愛人


  但從來沒有一件事情


  讓自己能發自內心對自己說句："你做的很好"



  也幾度捫心自問


  會不會就此打住比較好


  讓自己製造的眼淚變少


  讓自己製造的傷害變少


  至少下一秒起


  任何人 任何事


  不會再因為我而受影響


  於是我反而感到安心


  至少有件事是自己能掌握的


  至少有件事是自己能確定的


  最後


  主角在心臟負荷不了的情況下


  起身走向門口淚眼唸著文章的女兒


  終於


  解脫了


  --'
