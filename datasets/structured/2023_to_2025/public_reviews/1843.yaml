url: https://www.ptt.cc/bbs/movie/M.1678161003.A.C8E.html
title: '[微負雷] 我的鯨魚老爸'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~











  拍寫 主角這個角色我無法有共鳴


  整部戲最慘的大概是liz


  到後面才發現原來男主錢多多哩

  說什麼沒錢 其實都是要留給女兒


  自己平常要上夜班

  還要在冰天雪地裡面走路來你家照顧你

  自私!


  最後一幕把自己搞成那樣

  還想要得到救贖


  同樣自私








  如果說找遠離賭城來對比


  人家是頹廢到底

  沒有在跟你裝積極正面的


  你一個肥宅

  明明有錢能處理好自己的生活

  照顧好自己


  不帶給別人困擾

  不讓liz為你這樣奔波


  這些就是你的人生


  可以留下來最好的禮物 最好的證明

  但並不是如此







  主角卻只想要浪費自己的人生

  有個教授的學歷 吃著一堆垃圾食物

  卻又想要別人積極向上


  笑死了

  這說服力完全沒有


  另外一個角度 liz也是自業自得

  明明要照顧他，卻也還是帶給他吃垃圾食物


  原本上半段我覺得還OK

  thomas的出現我以為能給主角什麼幫助


  沒想到主角就是廢

  而thomas也只是想從他身上得到自我滿足








  各個角色演技都還蠻不錯的

  dan外送員的角色是想表達什麼我不知道


  尤其是dan看著男主角的那個畫面

  那是一個鄙視的眼神 對吧??????


  我只知道

  charlie他不是鯨魚 他只是看起來像鯨魚


  我也無法從這部片中

  像ellie那樣得到任何正向的力量


  尤其中後段的步調拖拖拉拉

  還打出了friday 似乎大喇喇地跟觀眾說


  快結束了喔 你們再等一下







  我知道配樂很優美

  主角的幻想畫面也很棒


  他內心的世界也很溫柔、善良

  但是導演你想給觀眾更多正面的力量


  那可以少一點這種

  死前想自慰的男主角 念著女兒的信

  狂吃著披薩 虐待自己以及虐待周遭他人的表演方式


  整部片戲劇效果很強

  但是已經脫離現實太多了


  中後段 生硬的剪輯跟緩慢的節奏

  突然而來的男主角飛天 我.....不知道該怎麼反應


  --





  --'
