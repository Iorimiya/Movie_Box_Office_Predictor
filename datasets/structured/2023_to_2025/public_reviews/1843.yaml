url: https://www.ptt.cc/bbs/movie/M.1675352525.A.2AC.html
title: '[好微雷] 我的鯨魚老爸-別吃太肥呀各位'
content: '嚴格說起來~ 這並不是一部格局多大的電影

  就是在講述人生故事的小品 但透過不俗的劇本跟稱職的演員

  成就了一部真的很能讓觀眾動容的電影


  劇名取我的鯨魚老爸 其實會有點標題殺人

  "鯨魚"是劇中貫穿全劇很重要的象徵 跟白鯨記有關

  主軸確實也可以說是父女之情 但這劇名反而有點反客為主

  嚴格說來 父女情只是主角其中一段糾結

  實則是他為何變成如此~ 以及背後的悲傷故事及如何在生命可能盡頭找到出路


  電影大致上就是5個人拍成的故事

  布蘭登肥雪演的老爸

  長得很像艾蜜莉布朗特aka陳亞蘭的女兒

  主角看護嘴有點壞但實則很溫柔的亞裔看護好友

  一個亂入但為這個原本破碎家庭帶來契機的傳教士(?)

  以及主角的前妻女兒她媽


  但是透過5個人故事 不斷拆解彼此間的心結

  5個人都演得很不錯(嚴格說來我覺得就傳教士弱了點)

  就構成了一個 讓人心碎 卻又彷彿看到一道光的生命故事


  其中當然是費雪演的最讓人動容~ 儘管他因為生病體態有變

  但這個角色回想起他是那個神鬼傳奇的颯爽男主角 出場後還是會目瞪口呆

  特別是如果要我挑剔~ 我個人真的對主角特殊化妝的體型太震驚了

  甚至覺得也太超現實的胖了!!(不過我相信真實確實有這麼肥的)

  簡直可以無縫接軌直接換他去演沙丘那個肥仔


  但是透過費雪的演出 他將這個因為悲傷過往與自覺責任

  因而決定讓自己自暴自棄成這樣 甚至眼看就要葬送生命的角色

  詮釋的讓人心痛不捨 也因此更能真切感受到他的痛苦與掙扎


  特別推薦開場唸文章的詩意表現

  與女兒拉鋸爭執的崩潰

  以及令人欲淚高潮的結尾戲


  不過另外也想提提.........看這部片真的會給人一點陰影

  因為自暴自棄 主角在劇中明明就健康超糟 卻還一直吃垃圾食物

  偏偏看護又一直幫他量各種數據 在在顯示他健康超糟糕的

  然後主角已經肥到變形了還一直吃 一直不舒服 一直說快死了


  幹不騙大家 我本來有帶包零食邊吃邊看

  開場我看10分鐘只吃了1/3就把他丟了 不敢再吃了...........


  他還曾這麼說:我這些年都在家裡 只有花房租 網路費跟食物........

  幹你各位呀! 拜託出來動一動呀 如果繼續大吃大喝不節制又不動


  哪天你的命運會跟主角差不多 很可怕的啊啊啊!


  --'
