title: '[選片] 鈴芽之旅/鬼滅/我的鯨魚老爸/人肉搜索2'
content: '目前片單有這四部

  1.

  鈴芽之旅

  新海誠最新作品

  主題曲好聽又洗腦

  劇情好評

  還有招牌的精緻風景

  那個光那個影


  2.

  鬼滅

  有看完全部漫畫

  無限列車看到爆哭

  但看預告是遊郭加刀匠村前面

  感覺演不到刀匠村精彩的地方（？


  3.

  我的鯨魚老爸

  布蘭登費雪回歸作

  關於救贖自身的故事

  感覺很適合一個人沉靜看


  4.

  人肉搜索2

  有看過1，電波有點沒對到

  不過第二集也是好評如潮

  願意再給一次機會


  這四部未來應該都會上串流

  所以主要想問這四部有沒有哪些是「不在電影院看會很可惜的」？

  先感謝推薦~


  -----

  Sent from JPTT on my Google Pixel 3a.


