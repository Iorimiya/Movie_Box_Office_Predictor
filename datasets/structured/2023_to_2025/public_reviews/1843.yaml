url: https://www.ptt.cc/bbs/movie/M.1679901037.A.C93.html
title: '[好雷] 我的鯨魚老爸'
content: '這部片大力推薦每個人都去看

  以下有雷









  我整部片從噎到


  就開始哭到底


  Liz害怕目睹Charlie的死亡


  為何他活著的意識那麼微弱


  要讓他人承擔


  Liz整部戲裡都從一而終的


  努力活下去


  不愉快的童年


  經歷親人自殺後


  陪在在慢性自殺的人身邊


  仍然堅強，對現實妥協


  即使感覺被背叛


  仍然回到屋內正面對決


  她的每一句台詞


  都打動我


  Ellie內心的矛盾跟仇恨


  地下埋著匱乏跟缺愛


  但是她內心的傷痕已經沒有辦法完全消失


  永遠都會在了


  她人生的課題都會是與之共處


  Thomas的天真與罪惡


  都如此荒謬


  荒唐到一瞬間看起來很可愛


  下一場戲看到他


  又覺得很氣憤


  他是Charlie最簡單應付的對象


  在這幾天裡


  對他最沒有殺傷力的人


  不管他說什麼做什麼


  都只是孩子的茫然懵懂


  未來重塑的可能性很大


  他是個點綴


  讓Charlie相信Ellie是想幫助她


  我認為Ellie是想血流成河


  不過Ellie這種程度的邪惡


  也只是把事實暴露出來罷了


  Charlie完全可以接受誠實


  不在意毫不修飾的言詞公布在網路上


  我隨著每個角色的悲傷挫折在起伏


  但是唯獨Charlie


  儘管理智知道這個故事敘述了他的價值觀與為人


  在肥胖底下的那顆心


  如同Charlie對Thomas說的我並不是一直都這樣胖


  劇中多數人都沒認識到這個樣貌底下的Charlie


  直到故事完整述說後


  觀眾們也許可以抓到些許他噁心外表下的本性


  但我情感面無法共鳴


  他做的跟說的都不一樣


  他告訴Ellie很愛她


  但他拋棄她卻是鐵錚錚的事實


  他在享受自己的愛情時


  也沒有抽出一點空檔


  拿出一點能力


  去給Ellie真實的陪伴


  真實的陪伴才能讓人感覺到被愛


  為什麼離婚就要跟小孩切割


  又不是跟小孩離婚


  Mary說的沒錯


  他有段時間就是很快樂的享受拋棄妻女的好


  他展開新生活


  享受他的愛情生活


  Ellie的恨意完全其來有自


  她又能怎麼去消化或自處


  她只是小孩


  而在童年身為小孩的過程裡


  她都沒辦法去理解為什麼這個男人


  還會很怡然的說得正向樂觀


  Charlie嘴巴說出來都是美麗的語言


  漂亮的樂觀話


  但是做的卻是悲慘惡劣的自我糟蹋


  這樣的自殺傾向很隱晦


  恐怕是失去男友


  影響力之劇


  女兒不是他的生存意志來源


  男友離世後


  深陷在自我的悲劇裡


  死前一週才打破協議接觸女兒


  這種進度條是非常自我中心的


  要彌補


  或是真正要讓女兒挖掘自己內心的良善


  難道不需要時間嗎


  最終


  還是讓女兒目睹了他的死亡


  而他死亡那刻看見的海邊情景


  也只有他一人看見


  後面的一切


  都再也與他無關


  他再也不需要為任何後續的事情付出努力


  一如他活著時一樣


  這部片紀錄了他膽小如鼠的


  花數年時間去推疊悲劇


  然後數天的時間


  用微博無力的身軀


  去努力


  最後沒有了


  這是一部精彩的電影

  卓越的劇本

  實至名歸的演技

  每個角色都很動人

  我非常推薦每個人都去看

  -----

  Sent from JPTT on my iPhone


