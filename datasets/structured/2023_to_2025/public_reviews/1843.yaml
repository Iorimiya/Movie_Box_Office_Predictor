url: https://www.ptt.cc/bbs/movie/M.1676451019.A.56F.html
title: '[好雷] 我的鯨魚老爸 - 唯有真誠，才有救贖'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~













  身為一個極不專業的業餘觀眾，對於本片導演 Darren Aronofsky的印象，

  就是他非常擅長刻畫極端且詭異的心理狀態和生活方式。

  上一部我看過的作品是"黑天鵝"，就是一部把人折磨到快死的片。

  帶這這樣的記憶進場觀看這部片，會發現這片真是輕鬆可愛而且溫馨XD

  而且我們這場真的很歡樂，

  每次只要布萊登肥雪飾演的查理挺著癡肥的體態到處亂晃或撞到東西，都有人會笑出聲！

  所以看起來大家都是帶著輕鬆愉快的心情來看這部片！

  (也可能是情人節會帶另一半來看這種片的人都有點異於常人......)


  說到肥雪，我看完真的覺得今年奧斯卡他十拿九穩了！

  以前只看他搞笑和秀肌肉，從來不知道他這麼會演！

  可能他這幾年際遇和人生經歷讓他變得更加深沉老練。

  以前叫他肥雪是在揶揄他，看完這片再叫他肥雪可是帶著滿滿的敬意！

  看起來他極有可能跟黑天鵝的Natalie Portman一樣，

  靠著Aronofsky的片拿到生平第一座奧斯卡獎！


  說實在，這片真的不會是每個人的菜，

  裡面很多看似濫情的情節或是負面消極的態度，劇情稍嫌鬆散，節奏也緩慢，

  裡面除了查理外的每個角色，

  一有機會就會咭哩瓜啦把自己身世和祖宗十八代交代的清清楚楚，

  從舞台劇改編的痕跡非常明顯！

  要不是幾位演員的演技都夠強悍，這樣的表現方式應該是得不到一般觀眾的認同。


  不過這片真正最扯的地方不是這些，是查理教得這班可是星期一到星期五天天有課，

  而且還每天要寫作文阿！連我們的大學指考衝刺班都沒有這麼密集了，

  美國是有哪所學校或學生這麼神經病跑去選這種課！

  然後查理最後應該不是肥死是改作業改到過勞死吧XD


  然後整部看下來發現照顧查理的莉茲根本是大反派！

  明明知道查理快死了還幫他買三明治加大量起司，一副就是"我就是要看你肥死"的嘴臉XD

  還想阻止查理和女兒的相處！

  這位大姊真是有夠黑心的XD


  言歸正傳，

  我想在這部片中，

  我看到的是每個人都試圖把自己從悲慘及苦難中解救出來所做的各種努力和掙扎，

  而他們之所以感到痛苦，是因為他們總是在逃避或不願面對真實的自己。

  但到了最後，他發現要得到救贖，唯一的方式就是真誠地接納自己。


  我們可以看到片中角色做事幾乎都有相同的動機，

  那就是在逃避問題，或說是一種欺騙。


  以主角查理來說，

  他一直在逃避就是他真實的性取向、

  婚外情帶給他原本家庭的傷害、自己的健康狀況以及他自己的內疚感。

  從電影中可以看出其實查理之所以會落到這種地步，

  可以說就只是因為他和自己學生發生不正常關係，導致家庭破碎，前妻女兒都討厭他，

  他自己也因此罹患暴食症，導致體重異常，更加深了自己的自卑感。


  其實仔細想想，如果他早就正視自己的性傾向，或許就不會有這段婚姻；

  如果早點和女兒前妻溝通，對於他的身心健康會有幫助的；

  如果早點尋求醫療幫助，他不會暴肥，

  但他沒有選擇這麼做。


  所以查理是怎麼面對這些問題的？


  他其實有存錢，甚至還有工作！這已經是相當有利的條件了阿！

  但他沒有選擇用這些條件改善他的問題，而是認為應該把錢存起來，最後留給女兒艾莉。


  他這麼做是希望可以弭補對艾莉的虧欠，但事實上這無濟於事。

  查理真的需要的是能和女兒重新建立關係，艾莉需要的則是父母的關愛。

  從這點來看查理的作法只是一廂情願，並沒有改善任何事，

  甚至讓他忽視自己的身心健康，

  他罹患暴食症後，更把自己關在家中不與人接觸，反而讓自己的狀態更加惡化，

  並讓自己更加自卑。


  而其他角色也用相同的在面對問題，

  來傳教的小子湯瑪斯，真正的動機並不是他真的多虔誠，

  而是與家庭和教會的代溝，導致他偷了教會的錢後離家出走。

  他名義上是在傳教，

  但很清楚地可以看出他是在對自己的面臨的問題做無謂的掙扎，

  他對信仰的熱誠只是一種欺騙自己的表現而已！


  女兒艾莉的問題除了一般青春期的叛逆，

  也因為家人在她的成長歷程裡長期缺席，導致他自暴自棄和難相處的態度。

  其實可以看出艾莉在寫作上頗有天分，

  就連隨便亂寫的句子都還能遵守英文詩的格律，

  而且八年級看完白鯨記能有這樣的體悟也的確是頗強的！

  但她這種態度長遠來看只會傷害到她自己和家人！


  前妻瑪麗則是不希望查理在參與女兒的成長，認為自己就有辦法了，

  而完全沒有顧及到小孩成長的需要。

  其實看她與查理的關係並沒有那麼糟，

  但或許因為監護權官司讓她無法再拉下臉來與查理重修舊好，

  反而讓身邊的人，包括查理和艾莉的生活越來越糟！


  可以看到這些角色在面對自身問題時，

  所選擇的應對方式往往是以一種欺騙的方式在進行。

  不是那種對其他人說的謊言，而是對自己不誠實。

  都把自己真實的想法感受放一邊，然後用一廂情願的方式來處事或對待其他人。


  這片把查理設定成一名作文老師，教學生怎麼用文字表達自己，但

  有學校作文往往不是在寫真實的感受，而是要迎合考試標準。

  最後查理發現這些文章或許寫得很好很標準，

  但往往不是學生真正想要表達的東西，

  反而是女兒艾莉的文章能從白鯨記中感受到自己生活的處境，

  讓文章看起來更加的真實，同時也點出了查理的處境。


  而就想那篇白鯨記的文章所說的，白鯨是沒有感情的，

  所以向白鯨復仇對亞哈船長來說並沒有什麼實質上的幫助，

  但船長卻一意孤行要獵殺白鯨，導致他的各種痛苦及最後的悲劇，

  而唯有在閱讀關於鯨魚的章節，了解鯨魚的時候，才是真的從悲劇中解脫的時候。


  白鯨代表的就是角色面臨的問題，對查理來說就是與女兒的關係，

  而他認為他可以獵捕白鯨，

  可以封閉自己，欺騙自己在為孩子努力工作就可以弭補自己過去的錯誤，

  這反而讓他斷絕了與其他人的聯繫，讓他越陷越深，造成最後的悲劇。

  而他在人生中最後一個禮拜體悟到過去的事是無法補救的，

  他需要正視自己心中的白鯨，找到方法與女兒重建關係，才能從痛苦中解脫。


  而這種解脫不是來自於什麼宗教或是外部力量，

  來傳教的湯瑪斯就是最好的證明。

  他一開始也是在獵捕白鯨，不願面對自己和家人間的摩擦，

  而是相信信仰可以改變他的處境，

  只有當艾莉把他的消息透漏給他的家人後，

  才發現其實沒有想像的那麼糟，家人還是願意接納他的。

  其實不論湯瑪斯家人的反應如何，

  只要能坦承面對自己的處境，

  就至少可以確定他不會步上查理的後塵，在自我欺騙中度過人生，


  而查理最後應該也是體悟到的這點，

  才故意把艾莉的作文換成她的白鯨記的心得，除了提醒她其實是一個不錯的學生外，

  也是在跟她說：

  如果妳覺得家庭是個問題，那我們就找個時間多相處吧，

  學校課業什麼的現在對妳也不重要

  (而且別人代寫的作文連看都沒看就直接交出去了表示是真的不在乎嘛XD)，

  我們花時間把過去的問題都處理好，就不要再拿來當傷害自己的藉口了！


  這讓查理對女兒的關愛不再只是金錢或幫忙寫作業這種表面又沒有實際意義的舉動，

  而是主動對自己女兒表現關愛，

  並盡身為一個父親的義務，給艾莉提供寶貴的人生建議。

  而這建議還意外地是艾莉自己的體悟，

  可以用來證明艾莉真的是頗優秀！


  所以真正的救贖，是要能找到讓自己不幸的來源，

  並且不為這種不幸找藉口或是騙自己可以繞開它，

  而是真誠的面對並接納這個不完美的自己。


  這片雖然裝得很沉重，其實想一想劇情其實還蠻正向的！

  雖然表現方式讓人有點難捉摸，整體而言是部相當出色的電影！


  --


  選字坑我XD'
