url: https://www.ptt.cc/bbs/movie/M.1676607117.A.D28.html
title: '[好雷] 擱淺《我的鯨魚老爸》'
content: '擱淺《我的鯨魚老爸》


  圖文好獨版:


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  《The Whale》帶給我的感受不亞於我當時花了四個小時看完《大象席地而坐的惆悵》，

  布蘭登費雪回歸大螢幕帶來的是與過往不同，從表面轉往內在的波瀾壯闊，更在同志議題

  的處理上是如此的自然且動人，小成本成就了令人過目難忘的作品，令人淚腺失守。


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  【簡單卻令人動容】


  《The Whale》講述失去伴侶的同志父親因悲慟過度造成暴飲暴食，令自己成為體重高達

  272公斤的高危族群，在身體不段釋出警訊後，他嘗試修復與女兒的關係，並試圖面對自

  我過去的一切行徑。


  香港將這部電影翻譯為《鯨》，相較於台灣的翻譯，我更喜愛《鯨》這個譯名，在《The

  Whale》中，我們能看到的不僅是布蘭登費雪飾演的查理試圖修復父女關係，更多的是查

  理在面對了解他的人，試圖了解他的人與不了解他的人時，那種釋然，從逃避到坦然的過

  程。




  【周洪的演出令人印象深刻】


  作為一名亞裔臉孔的好萊塢演員，周洪雖然較少擔當主角，但在作品中流露的情感卻是極

  具說服力，無論是在《五星饗魘》中表現的偏執，又或是在《The Whale》中面對親人與

  好友的離去和任性，都能說服自我成全放手的釋然與過程中強烈的保護慾。都能強烈的令

  人感受到周洪在角色情緒醞釀上的厚度。


  當中他與布蘭登費雪的數場對手戲都能看出兩人都是極盡心力的為了彼此去著想，即便需

  要橫跨大雪為對方買來物資也在所不惜，在周洪飾演的麗茲身上的，似乎是她極盡全力的

  在幫助著查理。但回頭看看，被家庭拒於門外，痛失手足無能為力，查理似乎成了這個世

  界上唯一能讓麗茲痛哭的那棵樹洞，相較於無名的父母，找到方向的哥哥與查理似乎更像

  是她的家人，二度讓家人在自己眼前以極近自虐的方式離世是多麼悲痛的體驗，或許是更

  難令人想像的。




  【白鯨記】


  比起藥物，美麗的文字更能平復查理高血壓帶來的心臟絞痛，而最有效的，則是女兒八年

  級時撰寫的文章，該篇文章是世界名作《白鯨記》的讀後心得，在文字中，查理的女兒艾

  莉將白鯨莫比迪克形容為蒼白龐大的怪物，這樣的描述似乎也與查理的外在形象不謀而合

  ，蒼白且龐大，如同怪物般令人畏懼，甚至連查理巨大的哮喘，都與鯨魚的低鳴不謀而合

  ；但在這高聳遮光的身軀中，又有誰願意停下來了解怪物內在的脆弱，又或是大多數都像

  是披薩小哥一樣，留下一句「Oh！My God」


  整部電影僅用了極低的預算（300萬美金）進行拍攝，也因此所有的場景都在查理的小屋

  中進行，若仔細觀察就會發現，小屋中陰暗且髒亂，房間內四處懸掛著讓查理能夠順利起

  身的巨型拉環，在電影前期屋外的天氣也都以陰天和雨天交織，麗茲更在不經意間透露出

  這棟房子宛如監獄這樣的話語，彷彿形容查理是被囚禁於此的怪物，也暗顯著查理千瘡百

  孔的內心世界。


  唯有與過去伴侶生活的房間純潔無邪，也是房內唯一上鎖，不得觸碰的軟肋。




  【真切的多元性別議題處理】


  與其他刻意美化或是強調多元性別議題的電影橋段不同，《The Whale》在這部分的情感

  處理上特別直接且真切，不刻意賣弄兩人間的美好，也不美化雙方情感的純粹，查理與愛

  人的感情如此簡單與直接，約會、擁抱、接吻，即便家人以異樣眼光看待，雙方卻能感受

  到彼此內心的溫度與真實的心跳。


  這樣有厚度並真實的愛情，恰恰給人能夠同理的切入口，這些年多元性別題材盛行，與其

  在這個議題上過多著墨，反倒是查理這種僅透過回憶，簡單日常事物去呈現兩人間親密互

  動的安排，更顯得自然與得人心。




  【家人是什麼？】


  而即便自己勇敢地追求了真實的自我，查理最終沒脫離社會框架的束縛，在這點上，我反

  而更欣賞麗茲，至少在電影中，無法接受家族信仰的麗茲，勇敢的切斷了聯繫，為自己而

  活著。


  而查理在生命的最後，卻仍舊為了女兒的將來去彌補，去努力，以至於在電影的最後，他

  為了自己打開了攝像頭，卻為了女兒邁開步伐。


  查理是個喜愛真實的人，女兒艾莉的文章並非文采非凡，但能觸動查理的理由除了是自己

  的女兒外，真實的感受也是其中原因，而在人生的最後，查理也是在為所謂的家人而努力

  著。


  可我換個角度想，在查理失去所愛後失去生活能力，陪伴與照顧他的麗茲，難道就不是家

  人嗎？


  查理做的是彌補？還是拘泥於血緣？或許我是個較為自私的人，對我來說，麗茲的甩門是

  如此的應當，麗茲的陪伴又是如此的令人不捨，這難道不是家人嗎？




  【布蘭登費雪】


  自從12年背部受傷後，布蘭登費雪逐漸淡出了大螢幕，但在那之前，布蘭登費雪就因為自

  己沒有挑戲的眼光而飽受抨擊，在他失去動作明星的光環後，自然也被人逐漸遺忘，但從

  《神鬼傳奇》到《墨水心》，從《末日巡守隊》到《The Whale》，我們迎來的是一個從

  動作俐落轉化為內在波瀾壯闊的演員，他的情感厚度，眼神傳達，都已非過去所能比擬的

  。


  在《The Whale》中，費雪的眼神在真摯與迷惘間擺盪，你能感受到角色的憤怒，更多的

  是角色的無奈！


  《The Whale》電影中的時間是查理生命最後的一周，但也因為這一周，更能令人感受到

  查理在每天如行屍走肉的生活中，唯一想抓住的自我救贖感，而他在電影中那最後的吶喊

  ，透過燻紅的眼眶與令人悲痛的嗓音，將情緒如同瀑布般席捲出來，即便透著螢幕，都能

  感受到角色的撕心裂肺與最後一搏的奮力感。


  《The Whale》不是一部看完會令人心情愉悅的作品，它充斥著壓抑、疲憊、謊言甚至帶

  一些邪惡與恐懼，但它卻也真摯，豐沛，大量的情緒濃縮在這兩小時中，會讓你在看完電

  影後格外倦怠，但也因為如此，這部作品才如此深植人心。


  --'
