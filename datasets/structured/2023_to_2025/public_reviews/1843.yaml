url: https://www.ptt.cc/bbs/movie/M.1675604190.A.607.html
title: '[好雷] 《我的鯨魚老爸》對不起，費雪'
content: '對不起，布蘭登費雪


  多年前曾經因為你變胖，而調侃你肥雪

  後來才知道你經歷了人生許多大事


  曾經以為你只是個很帥的花瓶演員

  但沒想到你這麼會演。


  原本以為科林法洛在《伊尼舍林的女妖》中

  表現已經很穩了，但是真心真心真心希望布

  蘭登費雪能拿下奧斯卡影帝。


  《我的鯨魚老爸》是A24難得不那麼吃電波

  的作品，但全片90%在同一個封閉場景，加

  上主角體型龐大，畫面上帶來了不小的壓迫

  感，中文片名稍微沒有那麼貼切，因為並非

  太過著重在父女情感上，導演藉由鯨魚的意

  象，帶出一層又一層的隱喩及真實中你我都

  可能遭遇到的困境。


  「拯救與拋棄」


  查理不斷的不健康進食，雖然暫時拯救了需

  要療癒的心，但同時也拋棄對人生的期待，

  狼吞虎嚥般的進食如同將自己的生命吞噬殆

  盡。


  Liz想拯救查理，不斷提醒他健康亮起了紅燈

  ，因為她把查理視為朋友視為家人，內心深怕

  查理拋棄了她，但她知道幫助查理慢性的自殺

  ，才是對查理真正的拯救。


  查理拋棄了妻子女兒，雖然妻子女兒多年來選

  擇不原諒，但最終妻子的擁抱肯定盡力了、女

  兒最後的讀文章，拯救了查理的部份心靈。


  但也是有反向的一面，也是社會面的現實


  披薩外送員看似關心房內查理的狀況，但實際

  上當看到查理的真面目後卻逃跑。


  傳教士不斷用宗教的思想，想要來拯救查理，

  但卻因為同性關係，最後甚至感覺查理噁心而

  暴走。


  「週一至週五」


  全片有部份劇情著重於線上課程上，這段覺

  得滿有巧思，查理不斷的教導學生如果寫作

  欣賞文章，但到最後一堂課才明白，誠實的

  面對自己，別關閱讀了別管寫作了，不受社

  會的框架拘束，這不僅是查理帶給學生的最

  後一堂課，也是查理人生中的週五的最後一

  堂課。


  「悠遊於大海」


  查理最後的醒悟，決定更誠實的面對自己一

  切，希望將死之際，能夠在聽女兒寫的文章

  ，雖然結局是戛然而止，但配合片尾的海浪

  聲BGM，讓觀眾知道，查理這隻溫柔的大鯨

  魚已經解脫，悠遊於大海，抽離了這悲的慘

  人生之中。




  非常值得推薦的影片，雖然A24的作品一向

  不是很輕易的能夠看完及理解，但這部有許

  多的議題，如疾病、宗教、同性等，都值得

  進場觀看。





