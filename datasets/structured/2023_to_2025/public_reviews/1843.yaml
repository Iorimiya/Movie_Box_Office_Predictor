title: 'Re: [好雷] 我的鯨魚老爸'
content: 'A24信徒來補充一些



  片名為什麼叫《The Whale》，有幾個面向來

  看。


  （1）聖經

  在劇情中傳教士角色，可以知道聖經這本劇

  中有一定的意義存在，在「約拿書」中曾經

  被一隻大魚拯救（一般認為是鯨魚），約拿與

  鯨魚的故事，大致是要我們聽從神的旨意，就

  如同後段傳教士不斷要教義，勸查理要遵從上

  帝的旨意。


  （2）自然

  鯨魚是被公認世界上最大且溫柔的動物，且

  母鯨與幼鯨關係是非常密切


  （3）白鯨記

  女兒的白鯨記閱讀心得，對於查理而言是片刻

  的救贖


  所以宗教、自然（親情）、得到救贖，這三面

  是查理在生命的最後需要面對到的事。





  老實說是噁心的，但是是自私帶出來的噁心

  本部電影的核心是誠實面對與自私，當你

  誠實面對自己後，可能就會因為自私傷害

  了周遭其他人。


  傳教士為了傳教義的自私，在我看來是噁心

  外送員滿足好奇心的自私，在我看來是噁心

  查理為了誠實面對自己，放棄家庭甚至利用Liz，在我看來也是噁心


  瑪麗、女兒、Liz、艾倫這些人誰都不是為了

  自己自私？


  但我們是上帝視角在看這部電影，我們會覺得

  查理的選擇是情有可源，會同情他，但如果是

  我們身陷其中，我們還是會覺得他們只是誠實

  的面對自己而已嗎？也許我也會跟瑪麗一樣，

  還是無法原諒查理、也許我也會跟女兒一樣無

  法諒解走偏。


  所以這部電影能講得實在太多

  人在自私下，會如何傷害的周圍的人

  人要如何的誠實面對自己

  人要如何去原諒曾經傷害過你的人


  最終得到解脫，就像象徵同志的七彩顏色

  一樣，融合在一起就會變成白色，如同片

  尾昇天畫面XD


  如何能讓你所關心的人感情融合互相理解，

  也才能解脫，得道救贖昇天wwww





  -----

  Sent from JPTT on my Xiaomi 21091116UG.


  --'
