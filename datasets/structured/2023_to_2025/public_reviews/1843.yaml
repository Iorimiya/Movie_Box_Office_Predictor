url: https://www.ptt.cc/bbs/movie/M.1677254952.A.34B.html
title: '[好雷]愛妳如此的真誠坦率《我的鯨魚老爸》 '
content: '這部電影的觀影門檻不低，票房不高，但真的是佳作~



  (防雷)



  採1.33：1的特殊畫面尺寸，

  讓全片的空間狹小、更凸顯查理體型之巨。

  暴食、肥胖有如背負著痛苦，讓人不良於行，

  即使不需要嗅覺的描述，光用視覺帶過查理

  的狀態與嘔吐物，就在訴說著這是個令人想逃離的房間。



  如查理所說：誰會想要我這樣的人參與他們的人生？

  但查理肯定是個溫暖又樂觀的人，總是有人一次次踏入。


  而昏暗低靡的房間、偶會因為大門的開啟，

  有耀眼的光芒從門外照射進來。


  每個人的行為和性格顯現極端的對比。

  憤怒的母女、溫和的查理；

  呆氣的湯瑪斯、鬼靈精的艾莉；

  積極的麗茲、消極的查理。


  唯一的共通點就是：他們都充滿關懷別人的心。


  嘴上叨唸著，心裡掛念著。

  渴望得到救贖的人們走進房間，

  他們全都是失親、失根之人。

  都在失落的生命中茫然、渴望有人把他們抓住，

  但反應在外表的多是憤怒與謊言。





  查理一次次要求女兒寫下內心的感受，

  讓女兒脫離防衛與裝飾，用外在的角度檢視自己。


  .



  電影開頭埋下的伏筆，在結尾展示。

  讓查理視為寶貝的那篇作文，是艾莉以前寫下的，

  如此真實直白、毫不掩飾地表達感受甚至批判....

  還有對作者的同理。那，

  沒有華麗詞藻裝飾還如此直接？在教育體制下形同叛逆。






  查理很欣喜女兒是個如此真實又寶貴的人，

  她不是活成體制下的一分子！


  如果社會教育體制與自我之間要做一個選擇，

  那寧可選真實的自己、對體制叛逆吧！


  「對自己叛逆」實在太累太壓抑了，

  就像查理的學生戀人艾倫那般....認可反同教會、否定自己，

  於是用極端的方式來處理自己的"叛逆"




  ---鯨魚‧船長，老爸‧女兒---


  許多人窮極一生都在對抗讓內心充滿恨意的源頭。

  《白鯨記》裡的船長亞哈為了向白鯨復仇而殞落。

  很慶幸艾莉不是！她反倒在白鯨(查理)的循循善誘之下走向生處。

  讓她知道自己從未被拋棄、一直都被愛著，

  千萬別用叛逆阻擋這個世界。






  在電影的末段會感受到查理這個父親如此的用心良苦，

  那個惡臭幽暗的房間竟充滿了愛。

  將房門(心門)打開，是一條和解之路。


  .



  麗茲的愛與奉獻，隱約也包含控制與占有。

  瑪莉是愛與恨同行。

  艾莉有反感、卻也難掩關心。

  傳教士的對查理的關切、很大層面也是為了自己。



  另外，關於布蘭登費雪最後一場哭戲，

  老實說....我感受到他是真的在哭不是在演。

  選他擔任查理這個角色，除了角色需有的特質"可憐但和善"外

  導演是否也有將演員本身的遭遇考量進來呢？



  這部片的觀影門檻不低，需要一點年歲的經歷，

  或是會試圖向內探索、接觸過心理學的人來細細品味。

  由舞台劇改編成的電影，依然將場景侷限在一處，

  觀眾僅需要咀嚼每一句對話的潛在想法，以及各種意象...



  當初看完時觀眾幾乎都不離座，還有不少啜泣聲，

  或許因為每個人內心都曾有“白鯨”，也等待著救贖?

  成為社會人士後的我們、能一直誠實的對待世界嗎？

  脫離過往的創傷了嗎？


  .


  當創傷與苦痛伴行時，請拋下拐杖、用自己的雙腳前行吧！

  當你選擇對自己誠實、大聲說出真心話，就是人生的主角。



  查理向女兒傳遞了愛並邁向了和解，

  門後的那道光芒這麼近、卻走得如此艱辛！


  究竟是布蘭登演活了鯨魚老爸，還是鯨魚老爸救贖了布蘭登，

  只有他自己知道了。


  ---


  無廣告全文部落格：



  --'
