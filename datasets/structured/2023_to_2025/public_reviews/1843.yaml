title: '[好雷] 我的鯨魚老爸-我爛到底，因為我很溫柔 '
content: '網頁版好讀版：



  如果你現在人生陷在泥淖裡，覺得自己又廢又累又爛，那剛好去看這部片，你會覺得更悲

  傷；這是稱讚的意思，要能夠將你深陷的情緒拍到極致，才能使已經很悲傷的人足夠信服

  。這部片最常出現的其中部分台詞是《白鯨記》的閱讀心得：




  「那些介紹鯨魚的無聊章節卻最讓我感到難過，因為我知道作者只是想『把我們從他的悲

  傷故事中拯救出來』、讓我們短暫抽離，這本書讓我想起自己的人生......」


  男主角在電影中自己唸了、要求別人念了這段稿子無數次。而這將是貫穿整個故事的主軸

  之一。他只是做錯了一件事、遇到了一件慘事，從一個溫柔的男子成為一個溫柔而人生爛

  到底的男子，也讓他的台詞「對不起」成為電影台詞出現次數第一名的字。




  片中沒有人成功從悲傷中抽離，但電影要表達的意念，

  成功讓戲外的我暫時抽離我的悲傷。

  --------------以下大雷------------------------




  電影從男主角查理（布蘭登・費雪飾演）線上授課開始，他卻是一個唯一不開鏡頭的人，

  也告訴學生：他鏡頭壞了，而且看不到也沒錯過什麼。接著畫面看到查理是個癱在沙發上

  、體重破270公斤，連移動都很困難的男子，你立刻明白他刻意不讓人們看到自己。他看

  著gay片打手槍，射精後，他拿起一篇文章，第一次唸出有關《白鯨記》的閱讀心得。邊

  唸著手機邊摔了出去，他完全無法起身撿起，甚至開始嚴重喘鳴（註1)。



  在這部影像比例用傳統1.33：1的電影中，查理足不出戶，體型龐大，佔滿整個螢幕，故

  意在螢幕上製造這種壓迫感是有道理的，你的確會開始思考：他感覺原本是個文質彬彬的

  英文寫作教師男同志，為什麼會變這樣？



  接著電影步調快了起來。有人突然按鈴且直接闖入了，是個自稱是新生命教會的傳教士湯

  瑪士，他看到gay片傻眼，卻發現眼前的人身體狀況不太對勁，想幫忙卻吞吞吐吐，查理

  才意識過來，對眼前這個恐同的小傳教士說：你只是個孩子，我對你沒有性趣，請你幫我

  撿起手機好嗎？查理的好友護理師麗茲隨後趕到，檢查他的狀況之後，露出極度擔心的表

  情，並把傳教士轟出去。之後的劇情中，麗茲直接告訴傳教士湯瑪士：她的哥哥，也就是

  查理的前男友，就是不被教會接受才被逼死的。



  隨著劇情拼湊，可以開始理解：查理知道自己什麼樣子，他知道自己的爛樣，他不需要也

  不想要被別人看到或同情，他甚至直接跟女兒說：誰想要我這樣的人參與他們的生活呢。

  但這部片中除了自己的照護者也是唯一的朋友麗茲，其他都是直接闖入他的空間。




  他卻又常常對所有擅闖者說：對不起。



  我太爛了，我很噁心，被你們看到了，對不起。



  如果真的很爛，那他為什麼拼命工作？



  接著闖入他空間的，是他朝思暮想多年不見的女兒艾莉，卻是直接要他幫忙完成高中英文

  作文以防被當，原本完全不想留下的她，聽到查理留給她十二萬美金勉強坐了下來，

  卻偷拍查理照片並寫出惡毒的評論、迷昏查理、引誘湯瑪士吸大麻並偷偷錄音湯瑪士的秘

  密，傳給他的家人，想害他被教會抓包。

  就像她母親所說的，這個女兒根本是邪惡的化身。

  艾莉把自己的怒氣歸咎於爸爸在八歲時為了男人拋棄她，但真的是這樣嗎？



  原來，查理不願意花醫藥費，欺騙好友麗茲自己沒錢，都是為了把錢留給像惡魔一般的女

  兒。那個中年才愛上男性學生而拋家棄子的內疚跟痛苦，在男友因為不被原生家庭跟教會

  接受而患上厭食症去世後，他相反的得到暴食症，並且一去不回頭。


  人類本來就是需要歸屬感的，當原生家庭跟教會給你龐大的支持跟安全感後，卻又不認同

  你的本質，直接抽掉你的所有你的根基，這才是最可怕的。本片不只一個人因此而死，還

  有湯瑪士也因為做法跟教會不同而逃走。本片中宗教所謂的包容性，是你一切遵循他的規

  則，他才給你包容跟溫暖。



  由於查理的自覺，他不出門也不跟外界接觸，固定在信箱放紙鈔叫披薩外賣，外送者每次

  都跟他搭話並且關心，查理都敷衍以對。直到有天他照常等外送員離開才出門拿披薩，看

  到外送員偷偷在外面等，對方看到查理的樣子說了：Gosh！立刻逃之夭夭。



  沒有任何溫和柔軟的人受得了那種目光。查理開始爆吃。這裡的配樂非常精彩，急促詭譎

  配合爆吃的速度跟食量，讓人胃揪在一塊，所謂人類的「關心」到底是窺探還是好奇？



  查理唯一主動跟外界接觸的，是窗外那隻鳥，他難以移動，卻屢屢細細切碎水果定期放在

  窗台上的盤子。鳥不會評斷他的外貌，不會說他很臭，不會問他為什麼變得這麼胖，只是

  輕盈地飛來，讓他看到一點點生機。



  而他女兒艾莉，用安眠藥把他迷昏後，把窗台的盤子打破了。



  惡魔艾莉的媽媽終於來到，本片其中之一的高潮，是他們兩個互相指責：

  你從來沒有問過我，你好嗎？

  兩人之中充滿矛盾，自己的老公因為是同志而逃離，身為單身母親壓力之大，

  前夫卻永遠只關心女兒，如果自己坦承女兒是個會霸凌老師同學的惡魔，自己該如何是

  好？

  查理震驚於這麼多年來，前妻因為怕自己責怪她不是好母親而不願坦承情況之糟糕，

  對於柔軟如他多麽的打擊，他寧願不要命也只是為了存錢給女兒，他需要相信女兒是好的

  ，會步上正途，在此他大吼：



  「我需要知道自己至少做好了一件事情！」



  這是一個失去所有東西所有希望，一個被人覺得噁心的男子最後生存的意義，他需要相信

  女兒是個好人。前妻輕輕的倚在他的胸膛，回憶起過去往事，查理真的不壞，他只是選擇

  了別條自己喜歡的路，傷害了別人，自己也重傷。



  可是我們誰沒有選過別的路？沒有傷害過別人？



  他說，人是不可能不關心別人的，受過這麼多傷的他，這麼努力只求自已的女兒能夠學會

  關心別人，這是怎麼樣的心，才會有這種最後的希望？



  湯瑪士突然回來，他感謝惡魔艾莉故意錄下他偷教會錢的自白，甚至找到他的教會跟父母

  ，「故意」把證據寄給他們，沒想到教會跟父母只是說：那不過就是錢罷了，回家吧。他

  認為他會來到查理家是有意義的，他拿出查理前男友的聖經並說：你前男友認為肉體比上

  帝重要，只要認為上帝可以拯救你，你就能脫離這副肉體而得救！



  穿著極重肉裝又坐在輪椅上的布蘭登費雪，此時就是用表情跟聲音在演戲，他慢慢的加大

  音量，說：你的意思是我男友是因為愛我，上帝才懲罰他？你知道他曾經因為「我很美」

  而愛我嗎？我們會做愛，我們相愛，而我現在變成這樣。恐同的湯瑪士越退越後面，查理

  音量來到高峰：我們做愛，我們相愛，我現在變成這樣，我不噁心嗎！我不噁心嗎！



  終於逼得湯瑪士說實話：你噁心死了！查理只說：你可以回家了。湯瑪士跟送貨員所謂的

  「關心」，到底是為了自己還是為了什麼？



  如此有自覺的查理，他知道自己在世人的目光是什麼樣子，他已經好努力的把自己藏起來

  ，努力做到自己能做的賺錢留給小孩，為什麼要被所謂的「關心」羞辱？他憤怒傳送授課

  訊息給大家，要求學生寫出真正「誠實」的文字，然後開啟了鏡頭，甚至拍攝了全身。果

  然，視訊上的學生紛紛露出噁心、不可思議的表情，還有好幾個人拿出手機拍照。最後，

  他狠狠的把筆電摔爆。這世界上只有麗茲，自己曾經的愛人的妹妹，真正關心自己。而他

  跟前男友的房間，也是整層公寓中唯一清潔乾淨無瑕的地方，如同他的心一樣。



  電影從星期一開始，這天已經是星期五。



  他臨死前，還在跟唯一愛他的摯友麗茲說：是艾莉救了湯瑪士，她是善良的。此時艾莉怒

  氣沖沖闖入，質問為何他幫忙寫的作文被老師fail了，查理說，妳根本沒看，那是一篇很

  好的文章，開始唸吧。艾莉打開愣了一下，擁有過目不忘本事的她，知道那是爸爸珍藏

  自己八年級時的作文，也就是她自己的《白鯨記》閱讀心得：



  「『那些介紹鯨魚的無聊章節卻最讓我感到難過，因為我知道作者只是想「把我們從他的

  悲傷故事中拯救出來」、讓我們短暫抽離，這本書讓我想起自己的人生......』」



  此時我們終於明白，艾莉一直憤怒地活在悲傷故事之中，她的尖刺來自無法抽離，她的痛

  苦讓她變成惡魔。湯瑪士尚未知道回去原生家庭會不會真的被接納、麗茲又要接受一次摯

  愛的死亡、前妻瑪莉仍是辛苦又濫用藥物的單親媽媽，沒有人可以從悲傷中被拯救。



  就像麗茲說的：我真的不覺得有人可以拯救另一個人。

  這也是我最喜歡這個角色的原因。



  她邊唸，邊看著留著自己八年級作文的老爸，用盡全身最後力氣，拼了命站起來，就為了

  靠近她。靠近那個他永遠相信她是好孩子的女兒。



  龐大身軀像是在海裡的鯨魚一樣，只是擱淺了。



  誰說白鯨是最沒有感情，他只是躲藏在深海裡，不願被人看見，因為一旦躍出海面，就有

  可能受傷；但他如同大海一樣包容溫暖，所有人都可以投入其中，無論污染傷害，他一概

  接受。



  這是一部，很悲傷的電影，但表達的手法直擊我心。因為我們所有人或是身邊人都可能跟

  查理一樣，因為一件事而一蹶不振，自己心裡清楚是怎麼一回事但永遠無法回頭。願所有

  正在擱淺的人，希望你知道，也許你只是因為太溫柔。



  註1：喘鳴為心臟衰竭前嚴重徵兆，查理從第一天即開始喘鳴，意即他跟麗茲都知道他將

  不久於人世。





  --'
