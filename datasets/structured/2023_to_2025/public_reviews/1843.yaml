title: '[好雷] 我的鯨魚老爸-我好難喜歡又好愛的片'
content: '看完的時候

  我情緒很難抽出來

  從劇情來講，我很難喜歡這部片

  兩個詞，現實與無奈

  但同時，我又好愛這部片

  費雪的演技把我整個人帶到他的現實裡

  當電影最後的字幕跑完

  我還是很難從座位會爬起來回到這個世界



  以下防雷








  我朋友聊天聊到這部片的第一個心得是

  這部片很「公視」的「人生劇展」

  但是布蘭登費雪把電影昇華到另一個層次

  讓我不覺得是在看電影

  查理也不是電影中的角色

  而是有血有肉真實存在的人類

  看著他在生命的最後幾天

  想要攫住希望的掙扎和對絕望妥協的無奈來回擺盪

  甚至讓我不斷去想

  如果我是查理，我會怎麼做


  查理真的很像我們常見的人

  有喜怒哀樂、有七情六慾


  他愛著他男朋友，這是無庸置疑的

  只是編劇很刻意的讓他們一個厭食症一個暴食症

  因沒經歷過所以我無法想像伴侶死亡後的心境

  不過一定是愛得很深才會痛得更深吧

  把過去的房間上鎖，怕觸景傷神

  直到知道自己快死了

  才想再進去一次


  愛著莉茲

  整部片中

  查理一直對她說對不起

  也真的是最該說對不起的人

  莉茲是最愛他的家人

  卻被查理哄騙幫助自己慢性自殺

  看到這橋段不禁想台灣健保真的是福份

  如果是我，我真的很難騙莉茲

  如果我是莉茲，我應該死也要拖查理去醫院


  愛著女兒

  女兒是他的希望

  是他的潘朵拉盒子

  他會看不出來女兒的本質嗎

  但他希望女兒能變好

  不，他要她一定要好

  因為他希望他的人生能做一件對的事

  臨終前的查理已經是自卑感的凝聚體

  他需要抓到一個浮木

  證明他不是全然的廢渣

  而艾莉真的壞到骨子裡了嗎？

  我覺得直到最後一幕，才激起她的惻隱之心

  艾莉是聰明的，也是帶著恨長大的孩子

  偏激、偏執、作怪、破壞

  不論是對待同學、老爸還是湯瑪斯

  根本來說都是惡意的

  會讓我想到日本一些描述「絕對惡」孩童的漫畫


  愛著前妻

  在前妻來訪時的互動

  從費雪看她和莉茲的眼神差異

  可以理解查理真的愛著前妻

  只是遇到了另一個摯愛

  一個世俗眼光中不被接受的摯愛

  讓他變成一個拋妻棄子的人渣

  他也是懷著這種愧疚感攢錢給女兒


  愛著他每一個學生

  從對每個學生的叮囑就可以知道

  他是個認真的老師

  只是他一直自卑感很重不敢露臉

  同樣也不敢面對披薩小弟

  這裡我一直想不透

  為什麼丹看到查理要烙跑


  而且我認為

  他依然愛著神

  即使宗教間接害死了他男友

  他心底還有一絲對神的寄託

  所以他才會讓湯瑪斯闖入他的生活

  所以湯瑪斯在對他佈道的時候

  他還能記住每個章節

  所以在最後一刻蒙主召寵

  他還是邁向聖光


  其實最後一幕我很出戲

  誠如前面所說

  這是一部很寫實的戲

  但是最後超現實飛起來

  對我來說超反感的

  在前面查理開始邁開步伐

  穿插艾莉童年海灘的片段

  呼應一開始艾莉叫查理向她走去

  那個情緒的堆疊和鋪陳已經非常之滿

  就在淚水要潰堤的邊緣突然？


  我曾經想過如果那一幕最後直接畫面全黑、音效全關

  大概隔五至十秒後一聲巨響

  然後配樂下開始跑字幕

  我覺得我會直接飆淚XD

  飛起來我真的過不去耶


  不過不管怎麼說

  費雪在這部片真的是原地封神了

  但就像標題說的

  我很難喜歡

  入戲太深

  幾乎每個人都想扁下去

  我看不慣這些人的個性

  角色設定太極端了

  唯一比較真實的是湯瑪斯


  湯瑪斯是虔誠的是熱心的

  是真的想幫助人的

  才會在家鄉看不慣那些敷衍的教友

  他是真的想要幫助查理朝向他所相信的真實

  但他也在學習神說的不是絕對

  他是真誠的

  在查理的逼迫下說出他覺得同志很噁心

  但是馬上改口

  我從不覺得討厭和歧視可以畫上等號

  討厭就是討厭，為什麼要昧著自己的心說不討厭呢

  只要給不同於自我的人事物給予尊重

  為什麼不能討厭呢？

  在劇中湯瑪斯也是查理的對比

  對比查理的悲觀，湯瑪斯是樂觀的

  才會連艾莉的惡作劇都能正向看待



  --'
