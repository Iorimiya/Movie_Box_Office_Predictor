url: https://www.ptt.cc/bbs/movie/M.1679990654.A.298.html
title: '[好雷] 我的鯨魚老爸'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  很少會有電影帶給我這麼「震撼」的感受，尤其是一部場景只有一間房與一片海灘的小成

  本電影，甚至就算看完電影，我也還深陷在彷彿被鯨魚掃尾打中的衝擊中許久。電影剛進

  入正片時我手上拿著半個潤餅打算吃，那個潤餅大概是我有生以來最因為畫面而食不下嚥

  的東西了，我很難得認真思考暴食這件事的影響，這部片的警世程度應該不下《噩夢輓歌

  》吧，猛然發現是同一位導演。


  這部片最大的亮點應該就是布蘭登費雪了吧，雖然他並沒有達到將查理這個角色轉化成非

  他不可的境界，但他仍舊表現出查理這個角色在面對隨暴肥而來的自卑感、對八年不聞不

  問的女兒的虧欠、在生命最終一刻的覺悟與試圖獲得救贖，並據此拿下了奧斯卡影帝。其

  實這屆奧斯卡的影帝影后之爭，我覺得是蠻經典的範例：表演功力深厚的柯林法洛與凱特

  布蘭琪，對上表現突破過往框架的布蘭登費雪與楊紫瓊。最終的結果展現了當演員有亮眼

  的突破，帶來的印象絕對會比強者的穩定輸出來得深很多。反而像凱特布蘭琪這類演技維

  持一定高水準的演員，雖然演技好，但評審與觀眾心中也早就預期他們表現好，他們會得

  獎多半是對手不夠搶眼，甚或是多次落榜陪榜的累積與補償，結果得獎的反倒不是他們最

  為人稱道的那部作品。不然舉例舉不夠，可以再想想李奧納多（每次都拉他救援）。


  我覺得這部片的配樂是另一大亮點，雖然沒有令人印象深刻到可以獨立出來的主旋律，但

  配樂很成功的襯托電影情節的氣氛，甚至在視覺可見的電影布景外，也營造出一種具想像

  空間的背景。就像查理站起身的時候，我彷佛看見一隻鯨魚浮出水面，而配樂塑造出他身

  邊海浪一波波往外擴散的景象。能用音樂做到這種呈現方式我覺得很猛。


  而電影的劇情，除了對於暴食症的警世意味之外，感覺電影也試圖諷刺宗教的...虛無感

  嗎？雖然片中用一個鼓吹末日降臨的分支作為代表，但感覺上是為了避免正面迎戰更廣泛

  的天主教信仰，才拉這個比較偏激的分支出來鞭。上門傳教的湯瑪斯雖然滿口上帝必將救

  贖面臨末日威脅的信徒，但對眼前查理的困境卻完全沒有任何一點幫助，嘴上說著他相信

  必定是上帝的指引讓他來到查理的面前，但最後得到所謂「救贖」的，好像反而是他自己

  ，彷彿可以聽到上帝說：「小屁孩，我讓你來找他，是為了讓你知道你在做甚麼蠢事。」


  剛看完電影後，原先我曾沉浸在電影的時間點中，所呈現出查理在人生末端展現的懊悔、

  覺悟，與試圖獲得原諒和心靈救贖的心情。看著查理陷入失去愛人而自暴自棄的情境中，

  甚至當莉茲反問查理該不會覺得他哥的死是查理造成時，他臉上默認而哀傷的神情，也難

  怪在前妻質問他為什麼還要將救命錢留給艾莉時，他會說出：「我要確定我這輩子至少做

  對了一件事！」也許多少呼應了新生活教派的理念，在查理的末日來臨時，他奮力不靠輔

  助器站起身，走向屬於他的上帝—艾莉，他的女兒—在配樂凝聚的高潮中迎向他的救贖、

  飛升與生命的終結。


  但是隨後與朋友的討論中，我卻迎來了另一波震撼。在查理的人生中，他為了愛人離開前

  妻與女兒；在和愛人恩愛共度生活時也沒有在意往日的家人；愛人死了他自暴自棄把自己

  吃成近三百公斤的巨鯨；愛人的妹妹莉茲不斷勸告他要去看醫生要注意健康，但他卻隱瞞

  自己還有錢的事情拒絕治療；臨死前才聯絡艾莉試圖彌補父女關係。這一切都和前妻瑪麗

  說的一樣，查理終究是個自私的人。雖然查理拒絕治療是為了將存下的錢留給艾莉，但這

  些錢又能彌補甚麼呢？它彌補不了在艾莉心中八年來所受的創傷，彌補不了被拋棄者心中

  永遠隱藏的自我否定，世上有任何事物能夠「彌補」失去的時間嗎？對一般沒有這些經歷

  的人來說，或許會被查理最後認錯試圖補償的心情打動。但對真正曾經被拋棄的人而言，

  原諒是極其困難甚至不可能發生的事情，那是會留在心中數十年不曾消退的傷疤，甚至連

  艾莉最後展現出對查理的關心，或許也僅出自人類最基本的同情心，而與所謂的原諒、釋

  懷沾不上任何一丁點關係。


  更甚者，或許當人們感動於這些有關原諒的故事時，不只是出自於沒有親身經歷過，不了

  解其中痛楚而展現出來的天真想法；甚至人們之所以想接納、相信這些故事，是希望有一

  天當自己做出了類似的事情，也有獲得原諒的可能。


  但，無論如何，我還是很喜歡電影中那篇有關《白鯨記》的心得。


  --'
