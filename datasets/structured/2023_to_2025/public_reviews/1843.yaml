content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n分了兩天看完，基本上還算緊湊（跟別的警世呻吟劇比的話）\n\
  \n電影一開始是星期天 咦跟聖經一樣 但整劇一直在噴教會 然後每天都有不一樣的事發生\n最後在星期六上天堂了 這倒是很奇妙的安排 那上天的感覺也拍得很美 大概是全劇最亮\n\
  的一幕（物理）\n\n\n本劇亮點：妹子，永遠是妹子 女兒演技很好 看的很心跳加速別誤會是心情跟著主角起伏\n 有個感想一定要提：她跟三天前追的某netflix台劇主角群比起來就是大學生跟小學生的\n\
  差別\n\n配角們：男友的妹蠻稱職 就也是自暴自棄那種 只是不知道為何要一直餵食垃圾食物 老\n婆一出現那種怨恨感真的爆出螢幕 又很可憐 偷錢假傳教士也還不錯\
  \ 完美詮釋少不更事\n好心年輕人 送pizza的就不提了\n\n得到小金人的鯨魚爸 整部劇就是一直掛念女兒 真的很難想像他會遺棄女兒 然後死前堅\n持要救贖女兒\
  \ 這點很怪 好吧可能看到女兒很正 不過我一直不覺得那有發揮什麼演技 因\n為整部片看他的肚子就出戲了 覺得噁心 或是有一種莫名喜感 我知道要詮釋這個人病入\n\
  膏肓 但應可要用另一種方式 例如吃到臉都歪了這樣（譬喻） 反而他還是白白胖胖眼睛\n囧囧有神覺得有點無法接受\n\n整部片要講的東西有點混亂 救贖嗎也不對 要善待社會其他族群嗎好像是\
  \ 還是暗喻社會\n上某些心理有病的人 需要大家關心嗎 不太懂\n\n總結：不推薦啦 我後來電視沒關直接看Disney 蟻人3覺得想像力蠻豐富的 覺得應該先看\n\
  蟻人 哈哈\n\n\n\n\n\n\n\n\n--\n我又沒寫女友兩字 你還好嗎 XD"
