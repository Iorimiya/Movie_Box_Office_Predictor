title: '[極負雷] 我的鯨魚老爸'
content: '雷文防雷資訊頁


























  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  很久沒看這麼爛的片了


  寧可去看片三流恐怖片，一開始就知道誰會先死什麼時候刀會砍下來


  至少還可能有幾個青春的奶子讓人張開眼睛



  怪就怪我


  相信imdb的分數.....



  劇情很刻意，演出很刻意，就是整部片


  簡單的說，就是個拋妻棄女的噁爛男


  為了小三領便當後難過到把自己吃成肥宅之王


  然後快死了突然跟女兒有了聯繫


  存了一大筆錢死不去醫院然後要說服他父愛滿滿


  只會超無敵正面的拼命說服身邊的人還有觀眾她的垃圾女兒是完美的


  怎麼看怎麼尬



  隨便挑幾個細節講



  女兒突然莫名要他走到門邊，結果只是為了讓他劇末自己站起來埋的爛梗


  一點都感動不起來，只會覺得處處刻意


  口口聲聲說存那十幾萬是為了女兒不能動用更是會給人笑死


  真的那麼愛女兒就不會被小頭牽著走好嗎?


  今天不是一時出軌求老婆小孩原諒接納不被接受


  是自己拋棄妻小耶?



  Pizza小弟跟他線上教學的學生發現他是肥宅後的表情


  根本不是普通人會有的表情好嗎?


  尤其在米國現在social justice這麼猖狂的地方


  覺得你噁心也是心理覺得，不會震驚在臉上給你看


  更不會全班表情都是一個樣



  然後前妻莫名其妙地出現


  莫名其妙地好像又有愛


  講個話要整個房間亂晃，晃的我腦袋都暈了


  什麼鬼啊



  而且那個小三還是自己的學生


  這要是發生在現實，上個新聞，要有多少人吐一口口水不夠還要回頭吐


  換成是布蘭登費雪演出就變成好故事


  真的是唉呀我的媽


  比韓劇還灑狗血


  比周星馳的片還無厘頭


  還刻意上個同性戀的buff


  還有個肥胖的buff


  這肥胖還不是什麼病，是為了小三掛點難過自己吃出來的





  沒看過的別浪費時間了


  不用謝我



  --


  小時候住過就不要拿出來講了


  你要真的在美國"生活"就會懂我在講什麼


  那個傳教男孩的反應還正常些，肥宅不逼問他還裝不噁爛


  更何況，美國這種去Walmart就能看到滿坑滿谷胖子的國度


  Pizza boy那種目瞪口呆的反應比吃到600磅還不正常好嗎?


  而且還是友善的常客，為了小費裝也要裝沒事


  線上學生的反應更不會那麼一致


  多的是那種who cares的反應



  女兒反社會是因為從小被拋棄還可以理解


  其他人根本莫名其妙


  男主的人生順不順遂又不是被逼的


  不就是自己渣出來的



  Seven Pounds我就覺得有點刻意了


  但是至少還營造得不錯


  沒有開頭就告訴你這片處處要灑狗血


  比起來這片根本糞


  你是不是只會人身攻擊啊?


  難怪看不懂



  文筆很好還是文筆很差


  在美國是個胖子都不會令人驚訝



  部分? 哪個部分不是刻意營造?


  電影當然是創作


  但是好不好，就在於斧鑿得不留痕跡還是處處都宣告他在灑狗血


  講什麼人都有黑暗面的才真的搞不清楚狀況


  要是真的被黑暗過，看這片子大概會被主角噁心到吐



  外遇拋妻棄女噁心出軌男突然聖光一照就洗白了?


  天外來一段沙灘回憶就表示他好念舊好棒棒感人肺腑


  人生過得太順遂才會那麼天真



  先上個LGBT buff降低出軌傷害


  再上個肥仔 buff，煽情到不用腦的話聖母心就被激發


  然後宣傳再炒一波布蘭登費雪的悲慘人生


  突然拋妻棄女吃學生也不怎麼罪過了


  完全不是現實人生的正常反應


  換個場景，別說自己的家人


  隔壁鄰居太太的老公偷吃同性學生丟下八歲女兒跑了


  正常人聽了會說是好雷?


  鄰居太太說到恨處，聽者會不附和兩句天打雷劈??


  女兒叛逆到邪惡的程度，周圍的人不會想到她八歲以來日日夜夜嚙心之痛?


  肥仔口口聲聲無比正面的出現，就如地藏王菩薩般化解了世間萬惡


  除了糞沒啥好說的


  會得獎不過就是美國電影圈又一波假掰


  顏色對了buff上滿屁都能說成香的


  偏偏就有一堆人愛吃這套，跟著聞還說好香好香'
