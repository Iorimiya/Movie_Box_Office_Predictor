title: '[好雷] 我的鯨魚老爸'
content: '雷文防雷資訊頁


  看完了鯨魚老爸


  出戲的地方稍微有點多


  為甚麼鏡頭常帶到窗外的飼料盤


  是吃飼料的鳥有甚麼涵義嗎?


  還有為甚麼盤子碎掉查理看起來很傷心


  查理就算這麼胖耳朵還是很細又很尖


  差一點就以為他是精靈嘔嘔嘔


  從來沒看過這麼肥的精靈


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  就算出戲的部分有點小多


  看完還是必須說


  我的情緒完全被電影帶著走


  久久不能平息胸中翻湧



  對事來說


  我完全不會同理查理


  他在女兒艾莉八歲的時候拋妻棄子


  就因為愛上自己的學生艾倫


  過了快樂的幾年


  但是艾倫還是自殺了


  之後他就過了自暴自棄的慢性自殺生活




  這個人真的很矛盾


  心理的聲音有時提醒自己不要再繼續下去這樣的生活


  但又會因為上網查詢自己的病症


  知道自己真的時日無多


  更激烈的報復自己的身體




  這樣的矛盾在電影中也隨處可見


  明明當年拋下自己的家庭只為了追求愛情


  後來經歷了失去之後又期望能重新跟自己的女兒連結上


  電影中一幕讓我印象很深刻


  前妻跟他在爭論為甚麼不讓他參與女兒的人生


  "But you didn''t have to cut me out of her life like that."


  "Oh, please. You were more than happy to forget about us for a while. You


  know that."


  "I know I made a lot of mistakes. But I just wanted to see her, Mary. I''ve


  always just... Just wanted to see her."




  "It''s all about you. Even now, huh?"




  貪婪 懦弱自私卻又矛盾


  這就是我在查理身上看到的


  醜陋 令人噁心




  情緒上卻沒辦法不喜歡上這樣的角色


  這我自己真的也解釋不了


  也許他的表現就是人類的本性


  正常人從小接受教育要克己復禮 卻無法表現真實的自我


  查理真的是這部電影裡我覺得表現出最真實的自我的人了


  想做甚麼就做 做了之後又後悔 後悔之後又想彌補


  沒有辦法不看著這麼令人討厭卻又充滿情緒的角色



  最後一幕也讓人印象深刻


  查理用著最後一口氣站起來


  聽著女兒讀著他最喜歡的文章


  隨著配樂一陣一陣的拍打


  他的腳不再是踩著破舊公寓的地板


  而是踏著冰涼的海水和沙子


  好像在人生的最後回到了那個一切都還如此美好的夏日沙灘



  我真的非常喜歡這樣意象般的表現手法


  喜歡透了



  我覺得是一部還不錯的電影


  適合半夜兩點睡不著可以看看


  雖然看完可能會因為心情過於激動所以更睡不著


  --'
