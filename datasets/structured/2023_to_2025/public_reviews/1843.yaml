url: https://www.ptt.cc/bbs/movie/M.1675401019.A.807.html
title: '[好雷]《我的鯨魚老爸》，渴望從拯救當中獲得넠'
content: '部落格版：


  記得前幾天看完《伊尼舍林的女妖》時，感想就是「柯林法洛穩了」，然而看完《我的鯨

  魚老爸》之後，我的心整個轉往支持布蘭登費雪。不僅僅是因為如果看著他上台領獎，就

  好像前幾年以《茱蒂》順利封后的芮尼齊薇格那樣，承受住來自外界的審美眼光與輿論壓

  力，接受自己、擁抱自己，然後再次風光站上舞台享受眾人掌聲，讓人感到振奮且勵志，

  也是因為布蘭登費雪確實將《我的鯨魚老爸》中那多年來為了愛拋妻棄女而背負著罪惡感

  ，後又面對愛人不幸離世的痛苦與悲傷，於是選擇封閉自己、逃避世界，足不出戶只是一

  直吃一直吃，吃到後來卻因飲食失調造成身材劇烈改變，自此後又多了害怕外界眼光的恐

  懼，在身與心的反覆煎熬之下對人生感到絕望，抱持著若是真把自己吃死也無所謂的消極

  靜待死亡，可當真的被告知來日不多時，卻反而開始渴望著能夠被拯救、或者說是很想要

  在早已被認為是充滿著錯誤決定的人生中「最後做對一件正確的事」好讓自己得到救贖的

  父親查理一角詮釋的動人心弦。


  改編自美國劇作家山謬·D·杭特同名戲劇的《我的鯨魚老爸》有著不少赫爾曼梅爾維爾

  經典作品《白鯨記》的影子，電影中的角色設定與登場安排，都隱隱透著對歧視、社會地

  位、正確與不正確、善惡與上帝是否存在等議題的探索與投射，基本致敬意味濃厚。而那

  篇貫穿整部電影的、出自女兒艾莉的對《白鯨記》的再創文章，亦是呼應著她與父親查理

  間的關係，她對父親的情感、對父親的形容，同時也在有意無意間成為了查理現況與處境

  的描述，最後更是父女和解、讓查理獲得救贖的關鍵轉折。不過即便對於《白鯨記》不熟

  悉也沒關係，因為《我的鯨魚老爸》最為重要的是，利用沒有任何情感的白鯨來凸顯、強

  調出人類的豐沛情感，對於活著儼然已倦的查理，從憤世嫉俗的疏遠女兒艾莉身上看到了

  自己，他們都將自己隔絕在世界之外，可是原來他們都在等待有人能夠突破防線，伸手將

  他們的情感開關給打開。能將經典文學巧妙引用且融入電影裡，還能闡述自己的論點與理

  念，沒能入圍最佳改編劇本有點可惜。



  「妳覺得有誰會想要我這樣子的人參與他的人生？」


  八年不見的女兒艾莉問著查理，為什麼到現在才要來關心她？為什麼到現在才想到來參與

  她的人生？難道是歉疚感讓他想到必須彌補嗎？查理的回答惹人心疼。他何嘗不想當個盡

  責的父親關心女兒的成長，將前妻不讓他們見面的理由搬出搪塞，但另有原因的是，誰會

  想讓女兒看到自己變成重達200多公斤，連起身都成困難的糟糕胖子？早已恨他好多年的

  艾莉在首次踏進父親的公寓時，開口就是一句傷人的「難道我以後也會變成這樣的死胖子

  嗎？」，雖然查理是選擇一笑置之，看起來大方的面對這樣子或許早已聽到習慣的冷嘲熱

  諷，但慢慢的觀眾可以從他的言談間，還有他視訊課程不露臉、總等披薩外送員走了才去

  取餐的動作來看，查理其實不只因為行動不便，而是很在意旁人看他的眼神。後面一場披

  薩外送員丹假裝走掉實際上是在樓梯口等著查理出來拿餐點好看他長怎樣，結果看到本人

  後驚呼一聲「天啊」然後快速跑掉、讓深深被刺傷的查理自暴自棄的暴飲暴食直至全吐出

  來為止的戲，是證明了查理的擔憂，也是直直道出了擁有同樣煩惱的人們的心聲。


  我想之所以布蘭登費雪能將查理演活，更多的是他對角色的感同身受。曾經帥氣而且身材

  精壯的他是許多人的夢幻男神，然而幾個原因讓他的演藝事業走下坡，外貌與身材亦跟著

  走樣，沉寂多年過後，布蘭登費雪挺過了這些惡毒傷人的評論，以他喜歡的自己的樣子重

  返大眾視野，但並不是每個人都能將之消化與吸收。《我的鯨魚老爸》沒有拍到的是，查

  理變成如今重達百公斤模樣的過程，從他輕描淡寫的口氣裡能知道是愛人的離世對他打擊

  太大才讓他暴食到出現飲食失調，而當他暴肥之後就算沒有自覺，總是陪著他、照顧著他

  的愛人妹妹莉茲也是耳提面命要他注意健康，只是在他企圖振作之前，也總是有人、例如

  外送員丹還有在他終於打開視訊鏡頭之後馬上拿出手機拍攝的學生們，以嫌惡的表情與語

  氣提醒他他現在有多糟糕。


  於是又再度的自暴自棄、放縱自我，當下次又意識到這樣下去不行又力求振作時又再次被

  傷害，好似永無止盡的傷心輪迴。這是普遍與查理同樣的人面臨到的問題，《我的鯨魚老

  爸》將這樣子的不友善與社會對不同於自己的低包容性放入電影中，既殘忍又真實又充滿

  無奈。但慶幸的是這是部電影，所以能夠過編排與角色安排，來適時的對查理伸手援手，

  有的人離開之後卻又選擇回來，有的人則讓他知道自己並不孤單，是有人想要理解他、幫

  助他、接受他然後愛他的，那些若有似無的善意與暖意依然的穿透過銀幕，令人感受到、

  捕捉到，相信終有天這樣善的循環會去阻斷惡的輪迴，為查理等痛苦的人帶來實質上的幫

  助與改變。《我的鯨魚老爸》在主軸之外放入了對相關議題的關懷，讓劇情多了不同面向

  的可看性，也讓角色們壓抑後所釋放出的情感變得更加濃郁。



  「我要確定我這輩子至少做對了一件事！」


  回到《我的鯨魚老爸》的主軸，說的是一個關於拯救、關於救贖的故事。電影裡的每個人

  、主角查理、莉茲、傳教士湯瑪斯，或者是那討厭所有人、憤世忌俗的女兒艾莉，甚至連

  查理的前妻瑪麗，他們其實都在等待著被救贖。曾經錯過、曾經遺憾過、曾經恨過，他們

  都曾經因為不同原因被傷過也傷害過人，而這些「曾經」多年來不斷地侵擾著他們到已經

  成為了某種痛苦，於是他們都渴望著減輕或者舒緩這些「曾經」對他們造成的影響，因此

  他們不約而同想到的解套辦法，就是轉守為攻的去拯救另一個人，好似如此一來他們就能

  好過一點。其實我想，他們拯救這個行為背後的執著，更多的是想要有人在接受或是婉拒

  自己好意的同時，可以輕聲安慰著自己、告訴自己「嘿，這並不是你的錯」、「你已經努

  力過了」、「你可以放過自己了」，彷彿如果沒有人這樣告訴他們，就真的是在否定自己

  的信仰、說明自己真是個失敗的母親、被時刻提醒自己怎麼沒有察覺哥哥的不對勁好即時

  阻止憾事發生，還有確定自己真把人生過得充滿著錯誤，糟糕透頂。


  查理始終堅信自己可以將艾莉拉出泥濘沼澤，這樣莫名的堅信除了因為父親對女兒的愛與

  歉疚，更有大部分是為了自己。如同湯瑪斯堅信著自己能夠拯救查理，是為了證明他那和

  教會有所分歧而產生紛爭的信仰認知是對的，他是真的可以靠他的信仰去拯救別人的，他

  和查理都是「害怕被否定的人」。這也是在散場之後我和朋友討論的，我的想法是查理的

  樂觀正向其實並不是真的相信艾莉能成為更好、更棒的人，而是他「不得不去逼自己相信

  」艾莉真能變得更好、更棒。拋妻棄女、和男人在一起...，他好像從來都在做被認為是

  錯誤的事情，如果最後就連女兒都變成別人眼裡的失敗，那不就是真的徹底否定了他？因

  此很多後來的發展都才被他看成是某種希望。例如艾莉把湯瑪斯對他的自白偷偷錄下並寄

  給教會跟他的父母，意外促使了湯瑪斯與他們的和解，查理聽聞之後為此感到興奮，畢竟

  這顯然是他所期望看到的、女兒的轉變，不過想想，這是否只是他套上「渴望獲得救贖」

  後的濾鏡而將可能只是歪打正著的結果給正向化的結果？


  最後，當艾莉唸著那首她寫的文章，而查理這次吃力卻奮力的站起身，然後用盡全力的朝

  著艾莉走去，隨著步伐而陣陣襲來的浪潮，衝擊著每個與艾莉看著相同景象的觀眾，當兩

  人終於靠近，查理仰頭笑著迎接從天射下的光束，那個瞬間心中有個什麼被沖散了，查理

  總算如他所願的獲得救贖了。


  《我的鯨魚老爸》超脫了和解、來到自我救贖的範圍，查理說過「人是無法不去關心他人

  的」，而與之相對的，是他們都在期待被關心，猶如那隻發出不尋常52赫茲聲音的鯨魚，

  孤獨的等待著別人能夠聽見自己，將自己救出寂寞深海。《我的鯨魚老爸》寂寞的讓人喜

  歡，查理這個角色令人心碎又心疼，布蘭登費雪時時刻刻牽動著觀眾的心，他把觀眾直直

  拉進電影裡，與之感受共同的喜怒哀樂，真沒想過會被他惹哭，由衷希望他能夠站上奧斯

  卡。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
