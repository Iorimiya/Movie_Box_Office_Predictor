title: 'Re: [討論] 我的鯨魚老爸 (有雷)'
content: '查理：「我很擔心她忘了自己是多棒的人」


  在查理心中，至少在離開年幼的艾莉之前，

  艾莉是個很棒且善良的孩子，但無奈因家庭

  變異，加上父親離開的原因是因為愛上其他

  男人，這使得原本身處在叛逆期的艾莉，更

  加憤世嫉俗。


  艾莉是否幫助傳教士？如果以查理觀點來看

  ，人性本善，人是無法不去關心別人的，在

  在說明，他相信艾莉是真心想幫助傳教士，

  教會傳教士要誠實的面對自己跟過錯，只是

  艾莉還不願誠實的面對自己、忘記找到最初

  的自己。


  但沒有人相信，媽媽瑪麗更是以邪惡形容，

  FB好友更是因為查理的關係，把艾莉當成拉

  子，只有查理相信艾莉的本性，就算她敲破

  餵食鳥的餐盤，我想他也不認為她會殘殺鳥

  ，就算知道曾在FB上放上狗屍體照片。


  所以如果你是以查理的觀點來看，艾莉是善良

  的，就算她現在學壞或走錯路，也不要放棄她

  ，但就旁人而言，人之將死，會對過往的行為

  做補償，無論是留遺產、幫忙寫文章，查理都

  只是想確保艾莉能好好的生活著，為自己曾經

  造成的傷害，做點補償。


  但艾莉是善良是邪惡，導演不說破不點破，交

  由觀眾自己決定，也許你身為查理的立場，會

  覺得「我的孩子原本很乖的」，相信他會改過

  從善，但如果從其他人立場來看，也許艾莉真

  的很邪惡，只是誤打誤撞拯救了傳教士。



  但我相信艾莉從頭到尾都是善良的


  從他的文章可以很明顯的看出，亞哈和白鯨

  等同於父親與她自己，她認為白鯨是體型巨大

  可憐的動物，而亞哈始終殺不了白鯨喔


  父親就像白鯨一樣，體型巨大又可憐，雖然

  拋棄了他們母女，可是他是既善良又愛她的

  人，瑪麗也曾說過，查理與她都已經盡力做到

  能做的事；所以如果艾莉能夠忘卻自己父親，

  也許自己能夠有更好的人生，但事實卻非如此

  ，就算忘了父親，人生並不會比較好。


  最後的一幕，艾莉沒有忘了（殺）父親，

  而是放他自由，悠遊在海洋之中（片尾BGM

  海洋聲可以對照），讓他於這個社會框架中

  解脫。




  -----

  Sent from JPTT on my Xiaomi 21091116UG.


  --'
