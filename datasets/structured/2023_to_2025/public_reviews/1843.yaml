title: '[討論] Apple TV特價 綠洲超音速/我的鯨魚老爸'
content: '【2024/09/10 號外特價報】

  綠洲超音速／我的鯨魚老爸／不可侵犯：溫斯坦性醜聞／克莉絲汀／北方人／迷離世界／

  惡獵遊戲

  －

  今天簡單整理一些遺珠特價與不錯的特價片，首先綠洲合唱團的復出應該是最近樂壇的數

  一數二大的重磅消息了，Apple TV目前也順勢特價了他們的紀錄片《綠洲超音速》，建議

  樂迷們可以把握機會，收藏這對兄弟的傳奇故事。另一部紀錄片則是關於演藝圈世紀醜聞

  的《不可侵犯：溫斯坦性醜聞》，本片透過大量的訪談揭露了以往鮮為人知的真相，也值

  得考慮入手。

  －

  《我的鯨魚老爸》則是布蘭登費雪近期的經典表演，大量的對話與細節演出讓人印象非常

  深刻，我個人大推。另一部《克莉絲汀》則改編自70年代的知名社會新聞，也是相當厲害

  的作品。環球特價的部分，《北方人》又重回本周特價之列，《分裂》和《惡獵遊戲》也

  都是值得入手的名作，由於已經特價好一陣子了，想收藏的手腳要快。

  －

  最後想特別介紹一下新上架的新片《帝國浩劫：美國內戰》，這部我自己有進場看，是以

  戰地記者為主角的公路電影。雖然沒有特別壯闊的戰爭場面，但透過戰地記者的貼身視角

  ，將戰爭的壓迫感表現得淋漓盡致，我自己非常喜歡。雖然沒特價但還是推薦給大家，之

  後也會幫大家追蹤價格。

  －

  以上，祝大家看片愉快！

