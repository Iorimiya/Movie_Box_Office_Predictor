title: '[  雷] 我的鯨魚老爸'
content: '防雷






















































  這部電影的一切基本上都在我預料之中

  但實際上看的過程真的很吃力,我分成好幾次才看完

  一切都好窒息又難耐,而且越看越覺得好負面

  我上次感覺到這樣是看大象席地而坐吧

  那種窮途末路的帶入感非常足

  彷彿我們也跟布蘭登費雪一樣穿上肥胖衣


  說到他,他的演出絕對要給他拍拍手

  對比他真實的遭遇就更難過了

  結局他用盡最後力氣站起來就像是為了自己

  不求重回20年前的榮耀,這樣就夠了

  至於有些人不喜歡這部電影也算能理解

  這個男主角其實做的爛事也是有

  但他有缺陷也代表他身上是有東西可以說的

  他可能很爛,但可能爛的讓人同情,可能爛的讓人嫌棄

  我不知道,至少我是對他有興趣的


  其實這點他女兒也很符合

  跟男孩的相處也是個很棒的延伸

  也帶入了這個導演喜歡的宗教元素

  他上次在母侵有點太放飛自我了

  這次就控制的不錯,都有平均分配

  雖然這部電影從頭到尾幾乎都很負面

  但奮力去尋找救贖還是讓人淚目

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  我們不應該流淚，那對內心來說，等於是身體的敗北。

  那只是證明了我們擁有心這件事根本就是多餘的


  --'
