title: '[情報] 《我的鯨魚老爸》全新預告'
content: '最新預告：


  前導預告：


  改編自同名舞台劇，由 Darren Aronofsky 執導、原作者 Samuel D. Hunter 撰寫劇本、

  布蘭登費雪主演的《我的鯨魚老爸》，今日釋出了最新預告。


  劇情講述獨自居住在愛達荷州某公寓、體重高達600磅（約272.2公斤）的中年男子查理，

  試圖與失聯多年的女兒艾莉（由 Sadie Sink 飾演）重新修補感情，當年查理為了自己的

  同性伴侶而與家人斷絕關係，但在伴侶去世後，查理因為痛苦與內疚而開始暴飲暴食，更

  在與女兒重逢後，發現如今的她已然成了一個鬱鬱寡歡、尖酸刻薄的少女。


  本片預定在今年12月9日於北美上映。


  --


  前導預告就足夠讓人驚艷，看完新的預告又更加期待了！


  -----

  Sent from JPTT on my Samsung SM-N9810.


  --'
