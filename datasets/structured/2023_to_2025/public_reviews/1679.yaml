title: '[好雷] 萊拉兄弟'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  伊朗新銳導演薩伊德‧盧斯塔伊的第二部劇情長片《緝毒風暴》，講述毒販與警察間的鬥

  爭，以及伊朗國內的毒品氾濫與貪汙瀆職問題。去年執導的第三部劇情長片《萊拉兄弟》

  ，則直指伊朗的父權制度與傳統陋習，遭到當局全面封殺，但卻獲選為坎城影展正式競賽

  片，也奪得當屆的費比西國際影評人獎。



  年近40的萊拉，花費大半輩子照顧年老的父母與四個兄弟，獨自一人維繫起家庭生計，卻

  因突如其來的龐大債務引發家庭崩潰的危機。



  導演的前一部作品《緝毒風暴》點出的是人民公僕賄賂成性的醜陋，而在聚焦庶民生活的

  《萊拉兄弟》裡，小至擔任廁所清潔工的帕維茲，都會以職務之便向不願等待地板風乾的

  使用者收取額外的清潔費，大則婚禮禮金也會浮報以讓家族族長從中抽成。市井小民如此

  ，更遑論政府高官內部的貪汙情況，國際透明組織發布的清廉印象指數中，伊朗在180個

  國家裡排名第150。雖說這份評價只是由各國的國情分析師、學者與商人，針對各國的公

  務人員與政治人物進行的評比，但仍有一定程度的參考價值。



  雖然從片名、海報到敘事與主題都明顯指出本片的主角是萊拉，但在這部批判父權，鼓吹

  女性自主的電影當中，導演最終還是將擔負英雄旅程（Hero''s Journey）的重責大任交給

  大哥阿雷薩。他從本來怕麻煩、怕事的懦弱個性，到為了家人、為了自己挺身而出，最後

  甚至願意在爭取勞工權益上大力發聲，甚至拿起滅火器砸碎玻璃，代表阿雷薩已經走上與

  其他甘願只領部分欠薪者不同的道路。即便貫串全片的點子製造機是萊拉，但除了掌控全

  家的爸爸之外，推動劇情前進的是阿雷薩，而這一切都始於萊拉與阿雷薩在醫院的一場戲

  。阿雷薩開始願意聆聽不但拉近兩人之間的距離，也象徵他踏出改變的第一步。



  即使故事圍繞在這一家人困頓的生活，在一遍遍的轉折中，仍舊保有希望。在百貨公司擔

  任秘書的萊拉由於工作的關係，事先得知廁所將要改建成商場的情報，這個消息對窮困的

  他們來說便是「苦過去海闊天空」的希望。情節的安排讓人本以為導演想告訴觀眾的是，

  窮人之所以歷代無法翻身就是如同《做工的人》所演繹的，會一再受騙上當或做出錯誤的

  投資選擇。這份希望曾降臨這個家，但最後因為種種原因而溜走，就像帕維茲明明沒錢，

  卻與妻子生下一堆女兒，為的就是給老父親「擁有孫子」的希望。



  沒想到，伴隨這份希望而來的是永無止盡的情緒勒索，甚至還包括以對這個家庭不聞不問

  的已逝家族族長為孫子命名。朋友在觀影後不禁認真提出疑問，為何這第三代唯一的男丁

  只在出生那一刻出現，之後便再也沒以任何形式出現在畫面裡。不過，以這個角度來說的

  話，孩子沒在最後老爸爸過世的生日派對上現身稍嫌可惜，可能也代表著獲得孫子對這個

  家來說只是一閃即逝的希望而已。



  將近三小時的片長裡，除了有精彩絕倫的大量對話之外，導演的場面調度（Mise en scè

  ne）也非常精湛。導演必須巧妙地將每個畫面的布景、服化、光影與空間安排得當，同時

  能好好地利用自己設置出來的視覺主題來說故事。《萊拉兄弟》中的大場面有二：其一是

  開場的罷工衝突，不僅要掌控大量臨時演員，還要透過鏡頭調度，利用畫面中角色的動態

  變化來呈現出劍拔弩張的情緒；其二則是前族長孫子的婚禮，清一色的男性在高級飯店裡

  狂歡，紙醉金迷且鈔票滿天飛的景象讓人差點忘記這個故事圍繞的是一個有經濟困難的家

  庭。



  小場面則從萊拉與兄弟間大大小小的爭吵到深入各個角色情緒的臉部特寫都有。全片不斷

  出現的爭執可不是唇槍舌戰而已，上演全武行也不在少數，當這些場景都在這家人不大的

  陋室中發生，不同的視角與攝影機方位的變化便顯得更為重要，讓觀眾彷彿置身現場，近

  距離感受角色間的緊張氣氛。至於各種臉部特寫，則是導演展示人物關係與演員演技的完

  美結合，每個角色深情凝望鏡頭的瞬間，觀眾都能瞬間被擄獲而同理他們的心境。



  雖說《萊拉兄弟》講的是這家人的故事，但其實導演控訴的是投射到整個伊朗社會的父權

  。萊拉的兄弟並非全部好吃懶做，但階級複製本就比翻轉階級更容易。除了原本在工廠全

  職工作的阿雷薩之外，其他三個兄弟只能靠打零工或從事非法的詐騙工作過活。就算萊拉

  已經是家庭裡的經濟支柱，她在家中的話語權還是低落得可憐，從片中五人的互動也能看

  出，即便手足之間的情感讓兄弟大致還算支持萊拉所提出的想法與意見，但只要老父親一

  聲令下，已經簽約的店面也得厚著臉皮去毀約。



  導演將萊拉塑造成一位獨立自主的新女性，即使知道爸爸從中作梗自己的婚事也沒有真的

  怎麼埋怨，對於待在家裡一肩扛起眾人生計，她的態度就好像「就算苦終究是自己的家」

  。但老父親過分的是，一次次破壞孩子們或許有天能夠擁有的美好：不讓阿雷薩娶心愛的

  女人、不讓最聰明的馬努切去讀大學、不讓帕維茲自己為兒子取名，而且明明有錢卻也不

  願讓家人的日子好過一點。



  當萊拉發現爸爸的金幣並非抵押房子所得，憤而打他一巴掌，若非其他兄弟攔阻，最為愚

  勇的兄弟法哈德早就教訓萊拉一頓。即便老父親真是抵押房子換取金幣，平白送給親戚當

  作婚禮禮金進而當上族長，也不比買下象徵未來希望的店面更能改善這家人的狀況，但萊

  拉的兄弟仍然在本質上受到父權影響。就連最後發現爸爸過世的都是已經完成英雄旅程、

  成功蛻變的阿雷薩，代表最後推翻傳統陋習、改變這個家的依舊是男性。



  就像萊拉出場時使用震波治療腰痛與阿薩德的工廠暴動之間，以槍聲互相呼應，家庭中的

  父權就如同鎮暴的槍枝一般，狠狠打在萊拉身上，即使電影結束在萊拉含淚的微笑，伊朗

  的未來也不見得可以脫離父權的掌控。


  --

  Viola''s World：Screen Scream影迷尖叫屋


