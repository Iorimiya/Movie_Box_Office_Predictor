title: '[好雷] 虎紋少女'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  成長令人期待，但也充滿驚奇與未知。《虎紋少女》將青春期少女的身心靈變化，以奇幻

  與肉體恐怖的方式呈現出來。不但在坎城影展的「國際影評人週」單元競賽項目拿下最佳

  影片，也入圍今年台北電影節的最佳國際新導演，更將代表馬來西亞角逐奧斯卡最佳國際

  影片。



  吒凡在同學面前是個熱情洋溢、毫無拘束的活潑女孩，與同班同學法菈、瑪麗安是無話不

  談的死黨。



  本該踮起腳尖迎向女性萌發新階段的吒凡，但身處穆斯林世界的她面對初經乍到卻總有種

  種不安與惶恐。馬來西亞新銳導演余修善將青春期蛻變狀態以「小題大作」為起手式，結

  合馬國民間傳說「虎人」幻化一幅女性成長圖鑑，集結可愛、野性叢林於一身綺麗兼具的

  肉體恐怖電影。



  初經到來固然是《虎紋少女》裡非常重要的主題，但其實整部電影講述的無非是整段青春

  期的徬徨。片中雖沒有明講，但能夠看出不少父母口中的「叛逆期」其實只是沒能與子女

  好好溝通。吒凡擁有自由的靈魂，不喜歡被拘束，但身處穆斯林世界的她不免要遵循一些

  儀軌。放學後與好友到小溪裡玩耍，弄得全身濕在所難免，但將濕漉漉的校服脫下再走回

  家，便惹來一身罵，即便吒凡當時還不算是「完全長成」的女人，只是個小女孩，仍舊被

  認為是不得體的行為。但等到她對於青春期的身體變化感到迷惘與害怕，吒凡連在家都身

  著頭巾與罩袍，卻也受到母親的責罵，認為她在家還穿成這樣，好像故意跟媽媽唱反調似

  的。



  不過，媽媽卻不曾試圖了解吒凡這些行為背後的原因，至少在電影裡沒有看到。片尾瑪麗

  安趁父母熟睡時偷溜出去與在山林間自在生活的吒凡相見，如果被發現，應該也逃不掉挨

  罵的命運，但是，從瑪麗安面對青春期反應比較不激烈來看，可能她的父母比較會聆聽孩

  子心裡的聲音。



  除了月經來潮之外，女孩在青春期時所要經歷的第二性徵變化還包括腋毛與陰毛的出現。

  電影以少女漸漸變成老虎來呈現真是太貼切了，雖說片中呈現出來的是吒凡看到鏡中的自

  己長出不知道是鬍子還是虎鬚的毛髮，嚇到奮力拔除而血流不止，但那個時期身體熟悉的

  部位開始長出陌生的毛髮，的確是滿嚇人的。另外，當然就是日漸豐滿的乳房。吒凡不僅

  是全校第一個來月經的孩子，大概也是第一個開始穿內衣的學生。《虎紋少女》裡的校園

  雖然只是國小，但已是全女校，這還已經免去呈現女孩通常發育較早，身高較高加上開始

  發育的胸部，讓很多害羞的孩子就此養成駝背的習慣，深怕自己的身體變化被看到。



  這些驚奇又未知的身體改變也延伸到本片的肉體恐怖，作為一部希望青春期少年少女可以

  觀賞的輔導級電影，其實片中的肉體恐怖並沒有到嚇人的地步。既沒有明確的變異、殭屍

  化，也沒有肢體錯置或肢體殘缺，最讓人不敢直視的就是預告片就已出現的拔指甲段落，

  還有吒凡逐漸變為虎人而開始掉髮，以及她不合常理的爬樹動作。畢竟導演的本意也不是

  要將電影拍成恐怖片，但青春期的變化的確就是這麼可怕，只是用比較奇幻的方式呈現而

  已。



  除了吒凡自己的身體變化之外，她在學校的生活也由於遭受霸凌而產生天翻地覆的改變。

  一開始穿內衣是極為酷炫的事情，法菈也搶著想要穿穿看，彷彿大家對「長大」都有美好

  的憧憬，但被老師公開責罵之後，法菈也改口說「蕩婦才穿黑色內衣」。整部片從頭看下

  來，不論是受歡迎程度還是在校成績，法菈都在吒凡之下，雖說兩人是好朋友，但她並不

  甘於老是當老二，所以一切就在吒凡的初經來臨之後爆發開來。不管是經期間不能祈禱，

  還是嘲諷吒凡的體味，霸凌一發不可收拾，這還只是在純女校的環境，更不用說男女混校

  還會有彈肩帶、經血不小心沾到衣物的尷尬與裙底走光的問題。



  《虎紋少女》當然是以比較恐怖、驚嚇的方式來呈現月經來潮，畢竟是第一次經歷的青春

  期，但觀影過程想必有月經的觀眾都心有戚戚焉。即便父母性教育做得好，當事人早有心

  理準備月經終有一天會到來，第一次出現的時候還是會嚇一大跳，畢竟實際看到自己的內

  褲滿是血還是會措手不及，更不用說有些人初經後還不會進入穩定的週期，便會經歷一段

  不知道多久的驚嚇期，總是說來就來，說走就走。日本電影《每個月來訪一次的月經醬》

  就是用可愛的喜劇來講述月經這個令人又愛又恨的現象。



  電影將青春期的轉變與成為虎人的過程連結在一起，象徵外人一方面覺得這些變化很美麗

  ，但一方面又覺得害怕，不敢靠近。無論是脫髮、特殊化妝，還是額外長出的腳掌與長爪

  ，都充滿濃濃的手工感。因為導演特別喜歡邵氏兄弟早期許多低成本的動作片與恐怖片，

  因此她希望在致敬這些老電影的同時，為電影恐怖又嚴肅的議題增添一點輕鬆與幽默的感

  覺。變身完成的吒凡在片尾前後呼應地跳著舞，好似在告訴觀眾，身體會改變、會成長沒

  錯，但脫下皮囊，裡頭的那個人還是原來的她。此時此刻，同樣經歷身體轉變（開始戴上

  手套）的瑪麗安完全能夠理解吒凡所經歷的，兩人又再次回到往日相知相惜的時光，這就

  是成長的滋味。


  --

  Viola''s World：Screen Scream影迷尖叫屋


