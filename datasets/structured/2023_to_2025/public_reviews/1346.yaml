title: '[新聞] 台跨國合製電影《虎紋少女》獲坎城影展大'
content: '台跨國合製電影《虎紋少女》獲坎城影展大獎！


  新聞網址：



  記者許逸群／台北報導


  第76屆坎城影展於台灣時間28日凌晨落幕，其中由文化內容策進院投資及合作的3部電影

  都表現亮眼。《虎紋少女》獲得國際影評人週最大獎「最佳影片」、《殖民之路》則拿到

  「一種注目：費比西國際影評人獎」；而坎城電影市場展紀錄片單元提案競賽，台灣首次

  參加，紀錄片《大風之島》就一舉拿下最大獎「1萬歐元現金獎」。



  ▲《虎紋少女》獲得國際影評人週最大獎「最佳影片」 。（圖／前景娛樂提供）


  《虎紋少女》由台灣與7國共同合製，在台灣時間25日舉辦的影評人週典禮上，從激烈競

  爭之中脫穎而出，一舉拿下該單元最佳影片獎項。馬來西亞女導演余修善表示：「我很感

  謝支持這部片的合製製作人、演員跟團隊。我特別感謝這部電影裡很棒的女孩們。她們充

  滿了力量。這部電影讓我們擁抱我們內心的那隻老虎、內在的怪獸，讓我們大聲吶喊，對

  自己感到非常非常驕傲。」



  ▲《殖民之路》 獲「一種注目：費比西國際影評人獎」。（圖／文策院提供）


  坎城影展的費比西獎在「一種注目」單元裡，由《殖民之路》獲獎，此片獲文策院資金挹

  注並由台灣、智利、法國、英國、德國、阿根廷、丹麥和瑞典共同出品。在製作上，不只

  台灣「飛望影像」參與製作，還有由金馬得主杜篤之與杜則剛操刀後期擬音與混音。至於

  獲獎理由為，「用巧妙的方式講故事，揭示了拉丁美洲殖民歷史中重要且經常被忽視的社

  會政治衝突。」


  此外，在坎城電影市場展紀錄片單元提案競賽，不僅首次有臺灣作品代表參展，更一舉拿

  下IEFTA （the International Emerging Film Talent Assn.）所贊助的現金獎1萬歐元

  （逾32萬台幣）。《大風之島》導演許雅婷耗時長達20年拍攝，完整記錄樂生療養院事件

  ，製片黃胤毓與法國製片Baptiste Brunner的加入，讓作品走向國際市場尋求資源。



  虎紋少女



  --'
