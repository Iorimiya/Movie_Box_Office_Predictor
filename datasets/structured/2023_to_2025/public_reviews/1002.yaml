url: https://www.ptt.cc/bbs/movie/M.1716383441.A.1B7.html
title: '[好雷] 芙莉歐莎：瘋狂麥斯傳奇篇章'
content: '瘋狂麥斯 憤怒道 第88屆奧斯卡 入圍10項 得獎6項


  得獎的分別是


  最佳服裝設計

  最佳美術設計

  最佳妝髮設計

  最佳剪輯

  最佳音效剪輯

  最佳混音


  看起來 芙莉歐莎：瘋狂麥斯傳奇篇章 參加奧斯卡 技術獎應該還是可以拿大宗


  美術是強項 , 整個主題圍繞在芙莉歐莎


  整體動作雖然不少,但還是沒有憤怒道 多


  本來以為結尾會有大戰 , 但只有一小段小動作


  但中間有一場比較長的卡車追逐戰


  因為憤怒道 芙莉歐莎 只有一隻手


  所以我一直在注意這一集怎麼交代那隻手


  喬治米勒 雖然80歲了 , 但這種風格的片 沒有人可以拍贏他


  整體還是不錯


  想看的 放心去看吧


  評分 85/100



  --'
