  整體還是很棒世界觀依舊迷人補足很多設定細節滿滿，以下是個人感受覺得童年芙莉歐莎

  的臉有點恐怖谷效應…….對不死喬的好感度提升了，感覺不死喬死後堡壘應該很快就不

  行了，動作戲也還是很爽，但片尾一放第四集高下就出來，上一集的實景感太經典，這次

  的特效多了點，看完好想在imax看上一集～






