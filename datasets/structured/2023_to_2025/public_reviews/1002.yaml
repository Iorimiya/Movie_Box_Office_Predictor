url: https://www.ptt.cc/bbs/movie/M.1717935827.A.0AF.html
title: '[普雷]芙莉歐莎:瘋狂麥斯傳奇篇章 不上不下 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~









  不重要的前情:



  整個系列小弟只看過憤怒道

  這是我最喜歡的電影之一

  人生唯一在電影院看四次的電影

  電視有播一定看完








  這次新的芙莉歐莎

  趁連休去看了

  以下簡評：


  1.

  同行兩個友人都沒看過任何一部瘋狂麥斯

  兩人的評價都是非~常~好


  普遍覺得節奏和畫面都不錯

  看完去吃飯有討論了好一陣子

  害我超想雷他們(?


  友人:芙莉歐莎下一集就回去故鄉了吧 對吧對吧(燦笑

  我:...喝酒、喝酒吧~



  2.

  跟憤怒道相較之下芙莉歐莎...

  大場面、追逐都少了很多(憤怒道根本從頭追到尾)


  這集補了更多的背景讓世界飽滿

  不過比例沒抓好 我想要更多的爆炸和飛車啊啊


  中間芙莉歐莎的成長日記是不難看

  讓人明白她一路走來的轉變

  但...我不是來看這個的啊啊啊QQ


  我期待更多阿...



  3.

  看到滿多老面孔

  憤怒道接生的醫生、不壯的瑞塔斯、

  好像還有瞄到憤怒道芙莉歐莎的副官?




  4.

  劇情跟我想像的不同

  看憤怒道裡面對不死老喬的殺意


  我以為老喬把那隻手砍下來當成地圖殺去毀了故鄉XD

  結果也不是，所以那麼恨老喬幹嘛呢QQ

  明明待遇不錯說




  5.

  有幾個小地方有點BUG

  比如芙莉歐莎不見了為啥沒人去找@@?


  老喬特地把作為完美人的她留下來的

  沒播種就算了 不見了都沒企圖找人嗎?




  切掉手那邊也有點瞎

  圍成一圈斷手沒人看到就算了

  還該死的被她弄到一台機車??? 蛤??


  然後還被衝出圓陣??? 唉唉唉唉




  至於那個PPT戰爭就不提了哈哈哈

  好失望，很期待像流星錘啦電風扇飛天那種怪兵器的XD






  結論..


  不上不下，看過前面作品的粉不是要看這個

  新人又吸不進電影院看(朋友們是因為我說要看才去的)

  就變成票房大爆炸囉


  電影本身不差

  至少看的時候是順暢的

  片長偏長但體感還OK



  若有辦法像憤怒道那樣慢慢把人吸進去看

  應該還有救?









  --'
