url: https://www.ptt.cc/bbs/movie/M.1716854983.A.B68.html
title: '[好雷] 芙莉歐莎：瘋狂麥斯傳奇篇章'
content: '我個人蠻喜歡這片的

  基本上從頭到尾只講故事與人物

  沒有什麼前後矛盾的大道理


  死神幫中間那段是真的非常精彩

  看到反派用各種方式來攻略卡車

  彼此這種應對進退相當有趣


  很多人不喜歡雷神飾演的反派

  但我卻覺得他演的非常到位


  很多人可能想看非常有內涵又壞的反派

  但雷神在劇中的設定

  很明顯就不是這種傳統反派


  而女角最後撿尾刀

  我覺得很符合末世設定

  女角並不是什麼超人或天才

  我覺得她沒開外掛反而是一個亮點


  我猜想這部票房會失利跟評價差的原因

  可能一部分跟劇情走向有關

  這部不算傳統的那種王道路線

  沒有特別大快人心的對決與正義制裁

  但觀看過程中

  我能感受那種末世存活的掙扎

  武戲也完全沒有重複感

  而且每個環節都處理的很精緻

  當下緊張肅殺的氣氛很夠

  每段劇情其實張力都很足


  我個人也覺得有一個大戰被簡略帶過算可惜

  但真的加進去 電影長度又太長

  每部電影多少都有遺憾之處

  對這點我是不會特別去扣分


  8.5-9.0/10


  -----

  Sent from JPTT on my Google Pixel 5.


  --

  這在電影中算基本的

  會受傷要死不活 基本上當沒開掛

  我覺得不算特別王道

  因為女主還是委屈自己在軍閥下工作

  我覺得很棒

  很多人會覺得雷神明明作為領袖

  但好像領導能力不強

  其實劇中很多地方已經透漏

  他心死 而他根本對什麼都不在乎'
