title: '[好雷] 芙莉歐莎：瘋狂麥斯傳奇篇章'
content: '沒看過第一集


  下班後直接看


  順順看幾乎沒有會卡住的地方


  整部片就是轟隆隆的聲音貫穿全片


  以及人類滿滿的惡意


  劇情緊湊 片長也蠻長的 建議不要喝太多水


  如果要抓尿尿時間 看到章節 回家 出現就可以出去尿尿了


  這一段沒啥特別的地方 如果有更好的尿尿時機點 請推文分享


  裡面有部分噁心的畫面 請大家要做一點心理準備


  我想海塔都會被噁心到


  女主角安雅的大眼睛在某些片段特寫有夠水汪汪的 很像CG 但並不是


  我覺得這部片算精彩 但我不算喜歡 買票進戲院看倒是絕對不算虧錢


  不建議帶小孩以及情侶一起看 但是如果另一半喜歡吵鬧的片就例外



  --'
