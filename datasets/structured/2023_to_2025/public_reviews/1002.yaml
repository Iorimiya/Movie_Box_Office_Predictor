title: '[微負雷] 芙瑞歐莎：瘋狂麥斯傳奇篇章'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n結論 : 看完後，只覺得沒有後傳那麼緊湊、好看。\n\
  \n\n給負雷的原因 :\n\n\n1. 因為這次的交通工具沒有上集那麼炫酷。或者說\n\n   驚喜感嚴重不足，照理說迪門特斯的摩托戰車是\n\n   值得一個亮相機會的。我原本以為中間那台可以\n\
  \n   有甚麼變形或基本的噴火加速的，畢竟歷史老頭\n\n   都專門介紹了，結果沒有......就是掉進流沙。\n\n\n   摩托車拖繩索讓攻擊人員上天的主意看似不錯，\n\
  \n   但仔細想想也就是個帥而已。而且這部的大卡車\n\n   也沒有後傳那麼有存在感，上面還有精心裝飾，\n\n   但也沒甚麼幫助。\n\n\n\n2.\
  \ 時間感是不是出問題了 ??? 我沒看過全系列，\n\n   但我知道劇中的老年角色大部分曾生活在正常的\n\n   世界中，可又感覺劇中世界已經幾百年過去了，\n\
  \n   戰爭前的一切都化為泡影了，那他們怎還記得 ?\n\n\n\n3. 老喬的兒子是不是少了一個 ??? 憤怒道的那個\n\n   畸形兒應該也是老喬的兒子吧\
  \ ? 人呢 ?\n\n\n\n4. 演員演技。克里斯和安雅沒有撐起角色，但也\n\n   不只他們而已，除了賈巴薩女士的演員，覺得\n\n   她演的不錯。\n\
  \n\n\n5. 居然把四十天戰爭縮成四十秒。\n\n\n\n\n這次沒有折返跑，但卻讓人覺得煩悶，可惜啊 ~\n\n\n\n--\n一日，失智、糖尿已久的董坤被兒子脣脣帶去醫院檢查。\n\
  \n檢查結束後，董坤用盡最後的理智問 :「醫生怎麼說 ?」\n\n「Doctor !」脣脣想著又可以來玩三十分鐘糖尿人嘍 !\n\n--"
