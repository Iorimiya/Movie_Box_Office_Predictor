title: '[超好雷] 芙莉歐莎：瘋狂麥斯傳奇篇章'
content: '防雷





































  好久沒看到這麼好看的電影了


  上一部讓我有這個感覺的是子彈列車


  最近一直對於看電影這件事提不起勁


  片單累積的電影越來越多


  好不容易點開來看


  卻又馬上就關掉


  水行俠、量子狂熱、灌籃高手我分了四五次來看


  到現在還沒看完


  但是這部電影卻讓我想一直看下去



  芙莉歐莎台詞超少


  小時候跟長大都一樣少


  完全依靠肢體語言跟眼神來演戲


  本片也沒有拖泥帶水的流水帳式無用劇情


  每個片段都有意義


  前面的飛車追逐一槍一個


  中間還有兩段本片最精彩的武裝運輸車動作戲碼


  再加上最後凌遲仇人的手法


  整個觀影過程真是讓人通體舒暢


  這就是我們觀眾想看的動作片啊



  現在很想找時間複習憤怒道


  然後再看一次傳奇篇章


  看了傳奇篇章又會想看憤怒道


  然後再看一次傳奇篇章


  又接著看憤怒道


  傳奇篇章


  憤怒道


  傳奇篇章


  憤怒道


  傳奇篇章


  憤怒道


  ...


  --'
