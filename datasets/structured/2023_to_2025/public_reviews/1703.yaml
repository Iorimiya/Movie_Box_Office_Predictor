url: https://www.ptt.cc/bbs/movie/M.1683511971.A.2C6.html
title: '[普雷]寶可噩夢'
content: '防雷


















  確實是一場三小時的噩夢


  不論是噩夢般的居住環境、噩夢般的詭異家庭

  噩夢般的自我投射、噩夢般的陰影意象化


  更噩夢的所在是,由於自己的選擇而要跟噩夢的主人一同分享這個噩夢


  那一切沒有脈絡的脈絡只屬於他,如同我那沒有條理的噩夢之中的條理只屬於我


  當你以為自己已經掌握並能用言語解釋一切時,這樣的自信在下一秒又被完全推翻


  而阿寶那懦弱的個性、接近破碎的囈語,如同噩夢的主人在夢中無能為力的被一切虛幻的現

  實蹂躪,這樣的焦躁感對電影是加分的,但搭配上相當意識流的敘事,便讓坐立難安成了想直

  接走出電影院的意思


  不能用理性去理解,確實是噩夢的本質,但作為電影這個載體就不好說了,比起用腦袋理解故

  事,不如說是去感受噩夢帶來的一切不適,體會吧！那比思考更能接近噩夢


  （PS:劇中藉由快轉暗示結尾場景,以及片頭從產道出生呼應片尾自產道回歸母體接受審判並

  被處刑，這兩個表現手法我挺喜歡的）


  --'
