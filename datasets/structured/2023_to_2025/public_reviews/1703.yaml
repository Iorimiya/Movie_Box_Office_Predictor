url: https://www.ptt.cc/bbs/movie/M.1713797685.A.F2E.html
title: '[請益] 寶可噩夢看不懂正常嗎？'
content: '寶可噩夢看完的當下是覺得很屌


  不明覺厲


  我看完以後為了驗證自己的理解


  還上網去找了一些解說


  但發現主流觀點與我個人觀點完全不同



  防雷















  我的觀點是寶本身應該是精神疾病的


  他並不是住在治安不好的街區


  而是住在母親開設的療養院 但他患有嚴重精神疾病與被害妄想


  所以會將外人的舉止放大為惡意 甚至憑空捏造想像的畫面


  例如一堆人跑進他家裏開趴 以及有個人雙手撐在他浴室的天花板上


  我實在不明白為什麼一群人要衝進他家開趴 為什麼有人要撐在別人家的天花板上


  網路上的解說認為是因為他媽要刻意逼寶 所以讓員工惡整他




  本作的第二個重要橋段是寶被車撞以後被好心人家收留(當然也是他媽的員工)


  這段我的解讀是寶其實是因為傷勢被轉移到另一個比較高級的治療中心


  因為就這戶人家庭院的擺設 實在是太像養老中心或精神病收容機構的擺設


  當然我的理解也有十分說不過去的解釋


  為什麼會有人讓未成年的少女跟一群神經病住在一起？(還是說少女也只是病患？)


  以及為什麼最後追出來的殺手 到底是真實存在的


  還是跟大屌怪一樣只是寶的某種符號投射



  第三段的話劇要傳達的意義是什麼？是對寶人生期待的解釋還是現實情況的影射


  第四段乍看之下似乎可以解釋整部電影的陰謀 也就是一個控制狂老媽控制的故事


  但又令人費解 如果你老闆逼你跟某個胖肚中年老人做愛 你會願意？


  假設是老媽出了很多錢收買員工


  但好像也無法解釋要怎麼利用一個複雜婉轉的殺人計畫 讓女員工做到一半全身僵直死亡



  我的看法是這部戲只有20%是真實發生的事


  剩下80%的事情很有可能是寶融合現實情境放大而產生的錯覺


  這種觀點似乎很不負責任(所有事情都是幻覺 那就什麼都不用解釋)


  但我真的無法解讀這部電影80%發生的事 太魔幻了


  而解說影片的主流觀點似乎是把60~70%發生的事情視為老媽安排設計而發生的事


  但我覺得還是太他媽超現實了



  有沒有大家看過覺得比較合理或深入的解說可以讓小弟我拜讀拜讀的


  還是說這部電影本來就應該看不懂



  --'
