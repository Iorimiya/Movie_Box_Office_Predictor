url: https://www.ptt.cc/bbs/movie/M.1680014025.A.C6E.html
title: '[新聞] 瓦昆菲尼克斯為《寶可噩夢》吃肥'
content: "瓦昆菲尼克斯為《寶可噩夢》吃肥\n\n04:10 2023/03/28 中國時報 翁紫曦\n\n\n《寶可噩夢》海報，由奧斯卡影帝瓦昆菲尼克斯擔綱演出。（台北双喜電影提供）\n\
  \n「奧斯卡影帝」瓦昆菲尼克斯（Joaquin Phoenix）重磅回歸，攜手《宿怨》、《仲夏魘\n》鬼才導演亞瑞阿斯特（Ari Aster）以及《媽的多重宇宙》金獎製造機A24，打造腦洞大\n\
  開的驚悚電影《寶可噩夢》，台灣將與美國同步於4月21日上映，挑戰人們最深沉的恐懼\n。\n\n瓦昆菲尼克斯2018年為了《小丑》狂瘦24公斤，2021年演出《寶可噩夢》又將自己吃得超\n\
  肥，堪稱胖瘦自如的「橡皮人」，隱藏影帝鋒芒變成路邊阿伯，頂著大肚腩外加快禿的稀\n疏白髮，驚人的大變身可能連媽都無法認出兒子，一起合作過《抹大拉的馬利亞》的影帝\n\
  丹尼斯曼努奇（Denis Menochet）就分享在片場遇到瓦昆的趣事：「這位禿頭老人走來給\n我一個大大的擁抱，我心想『他Ｘ的，這是誰啊？』角色改造十分成功。」\n\
  \n《寶可噩夢》劇情敘述一名充滿焦慮的中年男子阿寶（瓦昆菲尼克斯飾演），在回去探望\n母親的路途上，面對內心最黑暗的恐懼。亞瑞阿斯特再度透過「家族」等題材，為瓦昆菲\n\
  尼克斯量身打造一個極具驚駭美學的新境界。\n\n#瓦昆 #恐懼 #噩夢 #菲尼克斯 #亞瑞阿斯特\n\n--\n佛教經典的\n是 是菩薩成佛之道\n     \
  \   是 佛經\n  是 佛      是 菩薩\n\n\n\n--"
