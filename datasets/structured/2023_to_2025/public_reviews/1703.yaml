url: https://www.ptt.cc/bbs/movie/M.1682538552.A.3F4.html
title: '[好雷] 寶可噩夢'
content: '今天在公館看晚場的寶可噩夢，小廳裡面只有五名觀眾，對於一部剛上映的院線片來說，

  真的有些乏人問津。


  我很喜歡導演 Ari Aster 的前兩部電影，《宿怨》給了我在電影院嚇到心悸的久違體驗

  ；《仲夏魘》的電影色調每幀都美得像畫，更別提令人如坐針氈的詭異氣氛。


  但是《寶可噩夢》我只能套一句李安的台詞：「我看不懂，但我大受震驚。」


  該說導演放飛自我了嗎？


  在長達三小時（體感時間更久）的電影裡，雖然有許多令人享受之處，但我感受更多的是

  如夢境般破碎的劇情。


  就像黑澤明的《夢》一樣，如果這部電影是一場夢，那每個令人覺得突兀之處，都能夠獲

  得解釋，因為很明顯地，這部電影並沒有試圖解釋任何謎團，而是不斷推進阿寶惡夢般的

  返鄉之旅，每個場景都比上一個更加危險與詭異。






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  《寶可噩夢》的主線劇情很明確，主角阿寶是一位獨居、缺乏安全感、對任何事情都躊躇

  不決的中年男子，在答應媽媽要回去見她的那一天，得知媽媽遭遇死亡意外，死前還跟律

  師要求若阿寶不在場，決不下葬，阿寶因此踏上奧德賽式的返鄉旅程。


  在與心理師的第一場戲，我們就能知道比起待在媽媽身旁，阿寶更希望跟母親保持距離，

  從心理師問阿寶希不希望母親死掉的反應，可見阿寶對母親依然保有家人之愛，但同時阿

  寶極度在意母親的想法、言語和行為，成為他精神焦慮的來源。


  現代人見到阿寶這樣子，脫口而出的第一句話大概是「媽寶」，畢竟到了這把年紀，連鑰

  匙弄丟該怎麼辦都要問媽媽，很難不讓人感到可笑。但片中穿插的回憶場景，可見母親的

  強勢與保護傾向，當少年阿寶遇見心儀女性時，叮囑他只有女人才懂女人，你這男孩可別

  被玩了。她甚至灌輸阿寶一個荒謬的謊言，使他相信自己罹患一種遺傳性疾病，會在交配

  過程中死亡，就像他的父親一樣。


  在驚悚的返鄉旅途中，阿寶首先遇見羅傑與葛麗絲一家人，因為兒子奈森在服役期間過世

  ，而試圖「領養」阿寶，千方百計希望他留下，但他當然不想因此擱置旅程，也不想成為

  新的兒子，在悲劇造成的混亂下，他逃離了那裡，在森林裡遇見巡迴的孤兒劇團。


  森林的這場戲是我最喜歡，卻也最難以理解的一段，阿寶在這裡看了一齣特別的戲劇表演

  ，他不只是觀眾，也是主角。戲劇表現的方式非常有趣，非現實的劇場舞台與主角融合、

  在虛實之間切換，起初我覺得戲劇似乎打算用預言來表現阿寶的返鄉之旅，卻又在下個場

  景把劇情做個翻轉，讓人摸不著頭緒。在看電影預告時，這一段最令我期待，在大螢幕上

  的表現也很棒。


  最後，他終於來到母親的家，雖然葬禮已經結束，但他認為自己已經完成母親的遺願，讓

  她能好好安葬。正當我以為一切就要結束時，劇情就在這裡急轉直下，母親不但沒有死，

  整趟旅程根本就是母親對兒子的試金石，以為阿寶是返鄉的奧德賽，沒想到卻是被賦予試

  煉的海力克斯，且在母親的眼中，他是個極其失敗的受試者。


  在電影的前半段，我們只能從阿寶的回憶去推敲母親是個什麼樣的人，在這段劇情——可

  以說是整部電影的高潮——則是母親強烈地控訴阿寶永遠都用漫不經心的敷衍來回報母愛

  ，她付出一切，阿寶卻連母親節禮物都總是送得不合時宜，這不敷成本的付出汲乾了她的

  人生，使她安排片尾的這場公審大戲。


  這一切是真的嗎？這場戲有太多如夢似幻的地方，就像我們所熟知的惡夢，總是在你腦中

  想著「這合理嗎？」的瞬間，畫面就來到下個場景，即使是極度脫離常理的場景，對做夢

  的人來說，卻是再真實不過。也許阿寶偶遇的初戀情人根本沒有留在大宅裡，是真的叫

  Uber 回家了，後續都是阿寶因為對母親的恐懼而幻想出來的惡夢，是阿寶與內心母親陰

  影的對抗。


  在電影一開始，阿寶本來的計劃是搭飛機回家，卻因為鄰居擾眠、睡過頭、鑰匙被偷而錯

  過班機，他打電話向母親報告時，他非常擔心母親會因此生氣或失望，當母親說：「那只

  好下次再見了。」阿寶非常著急地想找出一個讓母親滿意的解決方案，他可以訂下一班飛

  機、他可以用別的方法回去等等 ...


  就像前面提到的，母親任何一絲語氣的變化，對阿寶來說就像是天崩地裂。


  在這樣緊繃的母子關係下，阿寶卻連母親的葬禮都沒有到場，母親的遺體沒有臉，所以阿

  寶也無從得知母親最後到底是什麼樣的心情，是釋然、沮喪，還是勃然大怒？如果母親的

  離世讓他感到如釋重負，這是不是代表他用最糟糕的方式背叛了母親的愛，甚至到了無法

  為自己辯解的地步？他再也沒有機會知道母親會如何責備他的無能，餘生帶著無解的恐懼

  與擔憂，這沒有出口的地獄擊潰了他。


  雖然在這部電影裡，真實與否始終不是最重要的事情，但最後一幕對我來說，是阿寶因為

  背叛母親的恐懼（或是內疚），而建構出的一場審判大戲，而在結局，他也為自己做出了

  判決。





  --'
