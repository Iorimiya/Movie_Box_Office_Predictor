title: 'Re: [好雷] 寶可噩夢'
content: '這片在電影院看算是半懂。 回來看影評覺得很有道理。 有兩個重點unreliable narrator 和本片的宗旨是 guilt. 用下列兩點去看就很容易看懂。
  基本上這可憐人一生被老媽恐嚇 導致一生生活在恐懼跟內疚當中。


  然後影評點出 Beau 他要去找媽媽的旅程其實是引用Odysseus 史詩的過程，讓整個劇充滿奇幻點。


  外加Beau 他本身是個unreliable narrator, 可以從他住的地方被入侵有幾十人在他家開趴。甚至最後發現那整棟樓都是他媽的就可以理解很多演出並不是真的，只是在他腦海發生的。


  這可憐蟲，射精一次後終於把他媽幹掉。 然後自殺結束了悲慘的一生。

  -----

  Sent from JPTT on my iPhone


  --'
