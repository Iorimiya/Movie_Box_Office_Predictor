url: https://www.ptt.cc/bbs/movie/M.1694363262.A.FB4.html
title: '[普雷] 《寶可噩夢》- 想像豐富，現實貧乏 '
content: '今年四月上映過

  A24強打 亞瑞阿斯特導演三小時嘔心瀝血之作

  說起來本人其實沒有特別喜歡A24的電影

  若有A24粉可以略過，或不用太放心上喔


  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~







  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  如果說是B級片惡搞的部分完全沒意見，不要說我太嚴肅。


  但顯然沒有甚麼新意的部分在於《寶可噩夢》雖然利用主角與母親的關係構成的夢境形式

  ，盡管光怪陸離的（夢境）內容頗有瘋狂想像與好笑但緊接而來的影射意味馬上就弱掉。



  如果像是柯能堡那種無意識的《夢遊大都會》後現代崩壞，但可能又太抽象，就不夠A24

  。



  乃至於在三個小時的「史詩」長度，試圖在基本的親子關係中，試圖對美國國家的反諷，

  從開頭的神經病與藥物、典型中產階級的虛假，中段影射宗教聖母主角像是耶穌受難，人

  類的七情六慾其實是母親身為資本家在後面「宏觀調控」， 乃至於結尾像是法庭與直播

  頻道談論罪惡與救贖，嘲諷感的對立面，其實是說教意味十足。



  套句Zizek說的：「電影本身就是最色情、最變態的形式」。因為從體現了人的觀看慾望

  ，並達成了現實中無法實現的幻見（fantasy），於是「真實」是我們必須靠著想像力的

  填補現實空缺、不滿的慾望總是被懸置。



  另一方面，夢境的形式體現了現實的不滿足的慾望（內容），那麼看似想像力豐富的《寶

  可噩夢》，但當下的（現實）世界卻是過於樣板貧乏（導演太過理性控制），於是根本沒

  有什麼需要意義的消解與懸置，只有想像力不斷給出解釋意義的矛盾，也就是電影至始至

  終如主角一般逃不出的邏各斯（LOGOS）是最大失敗之處。



  --


  拉特飯 - 以商業力量進入獨立市場

  (剛搬家內裝待修)


  --'
