url: https://www.ptt.cc/bbs/movie/M.1722797060.A.788.html
title: '[  雷] 寶可噩夢'
content: '防雷




























































  我真的覺得這部電影有點難評價

  以至於看完一個禮拜後才寫點什麼

  他要說好看嗎？我分成三次才勉強看完

  他要說難看嗎？我覺得他有好多想表達的

  可能是表達的方法都很要死不活吧

  男主角那媽寶的若隱若現就很讓人點點點

  由此延伸出去的各種創傷也就跟著煩躁了起來

  這些傷害理應被好好審視吸收

  對一些觀眾卻成了無病呻吟的鬧劇

  結尾更是不謀而合的說明了這個現象

  我個人覺得還是有很多值得細細觀察品味的地方

  不然瓦昆怎麼會接演呢？他好像蠻挑劇本的

  至少我對男主角童年的愛情很感興趣

  回家後跟童年的愛在門口的對話也溫存了很久

  可能是因為這是少數能讓人放鬆的地方吧

  不然這個人是真的慘,一直在飄盪回不了家

  總之看能否接受導演的強烈藝術風格

  不然觀看門檻是高的,就自己想想看囉

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  我見過...你們這些人不會相信的事

  我目賭在獵戶座的邊緣著火的攻擊艦

  我看見C光束在湯豪色星門附近，在黑暗中閃亮著

  所有這些時刻都會消失...於時間中，一如眼淚...消失在雨中

  死期到了


  --'
