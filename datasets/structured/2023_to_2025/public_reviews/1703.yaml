url: https://www.ptt.cc/bbs/movie/M.1680231650.A.FD2.html
title: '[新聞]消費寶可夢?小丑瓦昆新片《寶可噩夢》惹議'
content: '消費寶可夢？「小丑」瓦昆菲尼克斯新片台譯《寶可噩夢》惹議 網：老任法務蠢蠢欲動

  -





  飾演《小丑》主角的「奧斯卡影帝」

  瓦昆菲尼克斯（Joaquin Phoenix）

  新片《寶可噩夢》（Beau Is Afraid）

  將於 4 月 21 日在台上映，

  台灣代理發行商台北双喜電影

  日前公布電影海報，

  卻引來民眾批評片名翻譯有問題。


  《寶可噩夢》由《宿怨》、《仲夏魘》導演

  亞瑞阿斯特（Ari Aster）以及《媽的多重宇宙》

  的 A24 聯手打造，敘述瓦昆菲尼克斯飾演的

  一名焦慮中年男子「阿寶」，

  在回去探望母親的路途上，

  直面內心最黑暗的恐懼。


  電影預告《寶可噩夢》4.21 聽媽媽的話



  雖然坐擁超強卡司，不過消息發布後

  觀眾的重點卻聚焦在台譯片名「寶可噩夢」上。


  若不細讀電影介紹，單看中文片名，

  可能會直接跟遊戲大廠任天堂旗下

  IP《寶可夢》產生聯想。


  然而，就現有的內容來說其實跟成為

  神奇寶貝大師的兒時經典搭不太上關係。


  有鑑於此，大批網友開始針對中譯片名砲轟，

  留下：



  「台灣片名翻譯全地球最爛」

  「從片名開始超譯」

  「為了增加討論度而取這個名字，這樣好嗎」


  等等批評，基本上清一色對於譯名有意見。


  或許是過去曾出現過《媽的多重宇宙》的

  翻譯爭議事件，有網友吐槽：


  「沒有旁白鴿的超譯，我可是不看的喔」

  「看到電名讓我好奇這部片的譯者是誰」


  另外，有人認為含有「寶可夢」

  關鍵字的片名可能會觸動版權雷區，

  於是出現：






  等發言。


  --

  同意

  哈哈哈

  結果每次反彈都會變成超大宣傳

  這部片不知道是什麼分級的電影？

  阿寶總動員

  阿寶傳說

  捍衛阿寶

  阿寶起源

  無腦留言不意外 真口愛哎 笑死 哈哈哈 wwww

  說別人沒媒體識讀的能力之前，先學會看字吧。


  還不錯哎哈哈哈

  無腦留無腦留言不意外 可憐哪

  哈哈哈 那真的是噩夢XDDD'
