url: https://www.ptt.cc/bbs/movie/M.1682873798.A.461.html
title: '[普雷] 寶可噩夢，瓦昆演的真好啊！'
content: '雷文防雷資訊頁


  注意　本篇含有大量雷點


  如果不怕的板友可往下繼續閱讀


  謝謝


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  因為不想要感想只有瓦昆演的真好啊


  所以上來發文同時也是希望板友們能幫忙解惑


  看完回家馬上憑印象寫文，


  怕比較流水帳，請大家見諒。



  首先劇情開始到阿寶在路上配水吃藥，


  在集市攤商上買了母子小紀念品，


  湊熱鬧看有人說要跳樓


  畫面卻切到一個混亂的末日社區一般，


  滿身刺青的男人沒追上阿寶，


  阿寶率先搶進大門自保。


  （這段我就覺得有點怪怪的，是在象徵什麼嗎？）




  再來阿寶回到家裡睡覺，


  卻一直被惡鄰居吵到夜不能眠，


  睡過頭要趕去機場，


  鑰匙跟行李卻被人偷走。


  阿寶問了路人，路人回答得很不友善就逕自離去，


  別無他法的阿寶只能打電話回家給老媽，


  兩人的對話都能感受到彼此的不愉快，


  中間還穿插了阿寶怕會有不良份子闖入，

  （這段很容易看出是想像的）


  下意識拉沙發擋門，不小心卻有點恐慌發作的症狀，


  趕緊吞了兩顆藥物，但卻發現家裡沒水喝，自來水也中斷。


  迫於無奈的阿寶還上網搜尋如果吃藥不配水會怎麼樣？


  會怎麼樣？結果搜尋第一行說會死！


  阿寶只得離開家，戰戰兢兢地下樓，


  要開大門前還拿了中華黃頁擋門，


  牙一咬！心一橫！趕忙衝過馬路躲避不良分子，


  隨手在小賣店拿了水喝了起來，


  店員說卡刷不過


  離奇的事情開始發生了


  街上的各種壞、怪份子快速地進入阿寶住的公寓大樓，


  阿寶很擔心進入的人越來越多，


  但店員一直催促著錢不夠。


  等到阿寶勉強結帳完成，街上的人移動完畢，


  還順手移走了中華黃頁。


  （因為阿寶鑰匙被幹走，沒辦法回家）


  看到這邊我也覺得怪，阿寶家是有多好玩？

  怎麼大家都搶著去他家？



  阿寶孤身一人在大樓外等到晚上，


  迫於無奈只能爬上逃生梯，


  一堆陌生人在阿寶家開趴及破壞，


  阿寶只能半臥在逃生梯上。


  隔天一早，阿寶被施工工人的木屑給弄醒，


  回到公寓社區大樓，發現一樓大門被破壞，可以自由進出了



  到自己的租屋處，發現有屍體拿著他的手機要打９１１


  阿寶拿回手機，進門看到一片狼藉，


  勉強邊整理著，還準備刷浴缸，


  邊拿起液晶螢幕，重新訂票卻發現信用卡刷不過，


  此時打媽媽的手機號才發現媽媽意外過世？


  阿寶從早站到晚，浴缸的水直流到腳邊才知道要關水


  關水的同時想說順便泡澡，


  結果天花板上撐著一位大漢，


  大漢滿身大汗，氣力放盡，從天花板跟泡在浴缸裡面的阿寶摔在一起，


  阿寶緊張過頭，光著身子跑到社區外，


  結果社區外有個上新聞的裸體殺人犯，


  裸體殺人犯一看到阿寶就把它當作目標，


  阿寶邊吼邊叫的找警察求救，結果警察誤認他是裸體殺人犯，


  警察開槍射擊，阿寶萬不得已又拔腿要跑，就被車撞到昏了過去。



  不好意思，我寫到這邊時發現就是腦袋想什麼就打什麼，


  我簡單扼要說一下


  這段就是阿寶到了外科醫生的家中，

  （外科醫生以前演過捕鼠氣，如果你看過那你可能快40歲了）


  這段我看的很吃力，主要就是：


  老婆講著不明所以的話，好像一直瘋狂暗示什麼，


  但我越聽越模糊。


  老公好像很願意幫阿寶，但遇到事情又把阿寶放在第二順位，


  女兒我完全不知道幹嘛，還喝油漆而死？失心瘋？


  還有一位精神失常的大漢，


  你乾脆跟我說這一家人有毛病，


  失常大漢其實是自己兒子但不願意承認之類的，


  阿寶破門逃離外科醫生的家，自顧自地跑起來，在樹林裡迷路，


  遇到一個森林劇團。


  （我覺得這段很不錯，口白搭配演技，看得蠻舒服的）


  這段我認為是在完整阿寶的人生，夢想有三個兒子、當個爸爸組織家庭


  這段也是我最投入的一段。



  最後就是原來阿寶他媽詐死，原來阿寶他爸是大屌怪，


  操，我還以為是彼岸島邪鬼咧，


  鏡頭時間往前一點，旁邊的老人是不是才是阿寶他爸？


  我認為不是，那是阿寶口中所說的比較勇敢的自己。



  最後就是阿寶跟媽媽起爭執，阿寶不小心殺死了他媽


  （但是到底有沒有殺死他媽　我好亂啊！）



  阿寶疑似殺死他媽媽之後，眼歪嘴斜跑到岸邊，駕起一艘小船，


  突然開始有人跟阿寶媽在審判著阿寶的一生


  我覺得這段是象徵阿寶在與內心及罪惡感拉扯，


  在無比愧疚的同時也在尋求著脫離束縛的方式吧？




  打得有點混亂，重新回憶情節也讓我頭好痛，


  大家晚安


  我是上校56



  --'
