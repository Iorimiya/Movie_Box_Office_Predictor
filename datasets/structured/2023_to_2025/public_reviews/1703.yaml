url: https://www.ptt.cc/bbs/movie/M.1712730536.A.A83.html
title: '[普雷] 寶可噩夢 上網飛了'
content: '當初上映的時候在忙沒有去電影院看

  現在想想有點慶幸哈哈哈哈


  因為前兩部 尤其是仲夏魘 變成 a24 跟 Ari aster的粉絲 這片還沒中文譯名的時候有打算

  去看 中文片名到底是三小硬要搞笑是不是


  這一片節奏特慢 片長也長 而且可以說沒有劇情？ 就像是一堆胡言亂語


  劇情雖然讓我想負雷

  除劇情以外的各項元素都很厲害

  演員演技超神 尤其瓦欽成功說服了我：主角阿寶真的被媽媽養成一個半殘的廢人


  媽媽也是超級讓人窒息 我昨天看的時候真的從頭到尾都在為了這個究極情緒勒索怪瑟瑟發

  抖


  美術非常精緻，調色也好看，特效完全沒問題、好幾個繞半圓的運鏡用的很好。


  讓我最覺得可惜的是 a24 出品幾乎都有的：如絲般順滑的流暢剪輯

  這次寶可惡夢沒有給我相同的感覺QAQ



  最後一個小細節：媽媽喪禮佈置有一個一堆員工大頭貼拼成的媽媽肖像，其中有外科醫生欸

  ，所以是說前面的雞巴事情都是媽媽搞的？！



  --'
