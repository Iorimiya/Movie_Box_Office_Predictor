title: '[好雷] 寶可噩夢'
content: '雷文防雷資訊頁



  內有劇情


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~



  整部片的觀影體驗如經歷一場惡夢，不合邏輯、荒謬，導演Ari Aster的偶像是不是包括

  大衛林區？這部片「假假」的感覺，以及無時無刻跑出的故事支線，頗有大衛林區（

  David Lynch）的影子。


  一開始還想認真，寶（Beau）住在一個可怕的社區，燒殺擄掠，回個家還要跑步衝刺，避

  免刺青男尾隨闖入。寶有恐慌症，住在這種環境，誰沒有恐慌症？外頭還有莫名其妙的裸

  男持刀隨機殺人，不禁開始思考這是美國哪一城市，導演明示美國的治安已經糟到這種程

  度？等到寶的鑰匙不見，街上的怪人全部走入他家…瞬間，寶的家是全世界最危險的角落

  ，而他家以外，安全無比…就知道不要把現實邏輯套到這部片，這是一場夢。


  導演有些惡趣味，仲夏魘（Midsommar）的阿嬤推屁股包生子，這部片有裸男與怪人糾纏

  ，到裸男與刑警對峙，刑警的被害妄想美國人應會心一笑。中間被運去外科醫師家的旅程

  實在超脫了，但以一個夢的邏輯標準來說，又還說得過去。退伍老兵是不是隱喻社會問題

  ？更明顯的是韓流、TilTok在美國青少年真的很紅，孩心不古。進入森林的那一段，有韋

  斯安德森（Wes Anderson）的風格，2D動畫與真人結合效果好，充滿童趣，只是也充滿惡

  趣味：既然做愛會馬上風掛點，那麼，老爸，你為什麼還活著？


  說到底這部片是一個「虎媽」的故事—虎媽的控制欲。影視作品也不乏這類的題材，但更

  多的是站在小孩的立場，強調小孩的反撲，像是台劇「你的孩子不是你的孩子」; 這部片

  ，弔詭地呈現虎媽視角，站在虎媽立場，從一開頭產房的鏡頭，虎媽聲嘶力竭：「你是不

  是把我的寶寶摔到地上？」、「他是不是沒呼吸？」、「你為什麼要倒吊他？」可以感受

  到虎媽歇斯底里的保護慾，即使是街頭的鏡頭也可以看見兇悍的路人母親抓住貪玩小孩…

  很懷疑導演是不是把童年經驗用在這部片，導演也有個虎媽？


  只是虎媽的奉獻不是無私，背後藏的是斤斤計較。男主角大大小小叛逆之心全被記錄，虎

  媽憤怒、虎媽咒罵，發洩完還是要保護媽寶（男主角），只是男主角成長得太違背虎媽意

  願，最後還有殺虎媽的念頭，虎媽不得不大義滅親（？），最後還來一句「我的寶（Beau

  ）啊～」


  極吃電波的一部片，當作一場夢，徹底放棄邏輯很快樂。別去在意男主角的爸爸為什麼長

  得像一根Ｘ莖，別去在意馬上風的居然是女的不是男的（這男主角不就絕後惹？）。快樂

  的媽寶是符合媽媽期待的媽寶，而不符合媽媽期待的媽寶不快樂，這部片告訴我們不快樂

  的媽寶會有什麼下場，的確是媽寶惡夢。


  這部片也領教瓦昆影帝厲害之處，好演員不只演技如真情流露，還包括，腳本的解讀能力

  。Ari Aster的劇本天馬行空的寫法不是每個演員都能承受，普伊在仲夏魘的情緒斷斷續

  續，連帶觀影也有點斷斷續續，連不上戲的感覺；瓦昆表情到位，從頭到尾非常連貫、完

  整，拿到這種劇本，瓦昆真的知道劇本在寫什麼嗎？服了。



  看完後，伴侶問，他在思考，這部片跟湯米維索的The Room差在哪裡？我說，不覺得很厲

  害嗎？同樣很荒謬，The Room看起來就一群正常人在不正經、惡搞；這部片，就是十足十

  的夢境，場景設計、美術極佳，甚至還言之有物：虎媽逞罰不長進的媽寶，比抓狂美術館

  的魯本還好懂。語畢，伴侶沈默惹。



  --'
