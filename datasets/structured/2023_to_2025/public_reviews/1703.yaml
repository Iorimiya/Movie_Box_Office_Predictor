title: '[偏好雷] 寶可噩夢Beau Is Afraid'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  暴力、瘋狂，深陷地獄卻連死都怕。《宿怨》、《仲夏魘》導演的新作，原在上映當週就

  有動念想看，被春雨打亂，有點忘記的狀態下進入了五月。室友忽然午間忽然訊問是否要

  衝一波，我答應了，沒有任何猶豫。


  週二接下午場次，意外還有好些人看。室友說：因為一天只有一場啊。我：畢竟又是一部

  三小時的電影。結果是：因《宿怨》而來的觀眾們，大約二十來位之中，中離了三位（剛

  好都從我這邊經過）。


  不好看嗎？悶嗎？其實不會，但是怪，非常怪。跟著瓦昆進到那個世界的話，所有不可理

  喻的事物都會得到解答（只是不是你想要的那種合理有邏輯性的解答）。


  中途想到幾次拉斯馮提爾，不能說像，但那種強烈令人不適的感覺，就是會讓你有此聯想

  。



  ***


  這裡是我的樂園:




  --'
