url: https://www.ptt.cc/bbs/movie/M.1682927629.A.4F2.html
title: '[負雷]寶可噩夢'
content: '衝著瓦昆主演，啥也不管的就直接衝了


  但是這卻是個不知所云的故事

  而且片名是完全意圖誤導

  跟寶可夢沒有任何關係

  除了主角的名字寶


  大概是這部片除了瓦昆，沒有任何值得成為看點的部分，所以只能取這樣的名字


  雖然劇情很明顯

  跟小丑有著相近的故事背景

  一個有著強烈控制欲甚至精神病的母親

  跟她也被搞到神經失常畏畏縮縮的兒子


  而兒子不太確定到底是單純分居還是在療養院

  主角也演的非常逼真

  但是

  整部片完全好像沒有一個目的

  一整個混亂沒有重點

  也不是主角追尋救贖自由

  也不是主角跟母親和解


  而是一整個主角也精神混亂

  其他人也精神混亂

  整個故事的發展荒謬離奇

  就好像畢卡索的畫

  找不到導演或作者想要呈現的目的或闡述的目標

  特效也奇葩 什麼雞雞怪啊

  還要看瓦昆還有一位奶奶級演員的裸體

  雖然說是年少的夢中情人

  但似乎也只是主角母親找來的演員

  尤其xx的部分熟練的不像一個正常人


  如果硬要說 就是展示一對精神病母子的精神世界吧！


  如果要說有什麼優點

  大概就配樂 中尾段配樂選的非常的不錯

  非常的抒情好聽

  但是應該不是原創吧！


  再來瓦昆再次接的居然是這樣的片子

  整體劇情細碎冗長而且角色重複定型

  而且感覺為裸而裸，還是又老又禿又肥的裸

  感覺正常有點地位的演員都不可能接這樣的片


  讓我擔心 瓦昆會不會不是演的，而是到現在還沒出戲


  --'
