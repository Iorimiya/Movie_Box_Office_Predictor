title: '[新聞] 《綠騎士》《寶可噩夢》等文藝片都賠錢'
content: "《綠騎士》《寶可噩夢》等文藝片都賠錢！A24 影業轉向拓展「商業動作片、系列電影」\n市場\n\n\n\n（圖片來源：A24 影業）\n\n美國獨立電影公司\
  \ A24 近年發行了《不存在的房間》（Room）、《仲夏魘》（Midsommar\n）、《燈塔》（The Lighthouse）等多部深獲好評的中小型電影，今年更成功將全球票房\n\
  熱賣的《媽的多重宇宙》（Everything Everywhere All at Once） 送進奧斯卡殿堂，一\n路橫掃多達七項大獎。種種亮眼的實績，使 A24\
  \ 成為許多影迷心目中「佳片保證」 的指\n標性片商。\n\n不過，雖然 A24 發行的作品屢獲優良口碑，但也不見得每部都能替他們盈利，而現在他\n們財務狀況透露的警訊，似乎將影響日後公司的經營方向。\n\
  \n\n\n（圖片來源：A24 影業）\n\n外媒《The Wrap》日前獨家報導， 今年夏天花了很多時間在物色適合收購的「」和「」項目，將業務範圍從導演個人風格鮮明、聚焦角色內心的文藝劇情片\n\
  ，擴展到。\n\nA24 仍然會繼續發行他們招牌的非主流電影，只不過數量會減少。\n\nA24 之所以轉向經營主流商業片，部份原因是近年成本較高的《》（The\
  \ Green Kn\night）、《》（Beau Is Afraid）等片票房都不佳，甚至導致了財務虧損，這讓\n A24 不得不開始兼顧主流市場，維持公司的收益。\n\
  \n\n\n（圖片來源：Smithsonian Magazine）\n\n一位匿名的發行商主管向《The Wrap》表示：「獨立製片圈的每一個人都知道，A24\
  \ 除了\n經營藝術片之外，也必須轉向產出更多商業性的電影。」\n\n一位匿名的業界經紀人也認為：「。」\n\n他強調：「。」\n\n前陣子傳出，A24 正與好萊塢其它片廠競標《》（Halloween）的版權，讓\n\
  有些影迷聽聞頗為驚訝，因為 A24 不像是會想爭取製作《"
