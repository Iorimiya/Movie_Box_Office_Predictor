title: '[無雷] 寶可噩夢 身歷奇境的噩夢體驗'
content: '關於親情、情緒勒索、焦慮與童年創傷，但這都還只是本片的背景元素，真正的核心就是片

  名中的後兩個字「噩夢」。


  你是否曾經在某些電影中看過導演在其中安插某個人物做惡夢的片段(最多10幾分鐘吧)?但

  本片的本體就是那段惡夢，而且它從開頭到結束就只單純表現惡夢本身，而該死(非貶義亦

  非讚揚，純粹中性詞)的是這個惡夢片長3小時整。所以，若想要看此片，請務必進電影院看

  (如果能挑越冷門的時段越偏僻的影院越好，最好全廳只有你一人)，否則若等串流上線在自

  己家裡看，你一定沒看多久就放棄而結束這一切(這部電影)。因為惡夢的本質就是一個你無

  法控制，想要結束卻一直結束不了的困境，因此把自己困在黑暗的電影院3小時才是自願做

  惡夢(看這部電影)的最佳方式。


  不過，在週六下午，特地花錢進電影做3個小時的惡夢的我，好像有些自虐就是了XD


  --'
