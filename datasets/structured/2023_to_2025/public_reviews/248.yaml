title: '[好雷] 鹽路上有你'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  改編自2018年同名回憶錄的《鹽路上有你》，從主角夫妻的角度，輕鬆詼諧地看當年家庭

  遭逢巨變時，他們踏上這條神奇的旅程後所遇見的一切，探討家的本質、人生與愛，是一

  部笑淚交織的動人作品。



  蕊娜與莫思結縭數十年，原本經營一間農場民宿，過著寧靜而知足的生活。雪上加霜的是

  ，莫思同時被診斷罹患罕見的腦部退化疾病，醫生甚至宣告他已時日無多…。在這趟橫跨

  630英里的艱難旅途當中，他們重新學習如何活下去，並攜手走過絕望，走向希望。



  開始徒步旅行之後，蕊娜對於失去家園仍舊耿耿於懷，所以碰上任何擁有「房子」的機會

  ，她都不會放過。莫思自主停藥之後，兩人暫時停下腳步，在原地紮營多日，蕊娜每天都

  會到海灘另一邊的小營地，躲進無法遮風避雨的小空間。對她來說，即便是這個小營地，

  都已經是很溫暖的「家」。蕊娜跌進黑刺李樹叢後，獲得附近聚居者的幫助，她馬上表現

  出興趣，並透露自己失去住處，而當對方表達他們暫時無法再收留更多人，蕊娜的失望之

  情溢於言表。



  某天，兩人紮營處過於靠近海邊，漲潮後海水灌進帳篷，莫思與蕊娜趕緊慌亂地收拾家當

  ，準備往內陸移動。本來蕊娜還叫莫思放棄笨重的帳篷，但莫思大聲地回答：「這是我們

  的家，我要用我的生命捍衛它！」明明自己手腳都不太方便，他還是扛著早已溼透的帳篷

  ，抵達安全的地方。不過，兩人對「擁有家」的慾望還是很強烈，因此當蕊娜的朋友表達

  願意提供他們棲身之處，莫思與蕊娜二話不說就答應了。只是，後來發現寄人籬下總是有

  諸多不便，兩人也才決定要往人生的下一篇章邁進。



  「如果能夠重來，除了生病，其他我什麼都不會改。」



  遭到好友背叛，失去賴以為生的農場民宿，由於那同時也是多年來的家，莫思與蕊娜頓時

  變成無家可歸的無業遊民。當時，蕊娜看到一本舊書《遛狗五百哩（Five Hundred Mile

  Walkies）》，興起與丈夫徒步旅行、整理心緒的念頭。禍不單行的是，兩人的旅程才剛

  開始，觀眾便跟著蕊娜的回憶得知，莫思才剛確診關節疼痛的狀況並非關節炎，而是罹患

  名為「皮質基底節退化症」的非典型帕金森氏症，且將不久人世，所以把握時間與丈夫一

  同旅行，可能是蕊娜在這個時機點最大的心願。



  但是，經歷過這些不順，莫思居然說自己只會想改變「生病」這件事。的確，生老病死無

  法避免，也正因為無法避免，人很難轉念，或以樂觀的態度看待，但失去家園，看似嚴重

  ，意外獲得的徒步旅行，也讓莫思樂在其中。錢不夠用又如何呢？茶包輪流泡、省吃儉用

  ，總是過得去，陡坡再多、過程再苦，嘴上唸一唸，兩個人還是又攜手前進下一段路途。

  唯有生病，是無法靠意志改變的，即使莫思現在仍與他的罕見疾病共存著，誰也不知道明

  天與死亡，何者會先到來，「唯一想改變的事物」或許就是莫思看待自己病情的想法吧。



  「你就是我的家。」



  電影最後，蕊娜看著莫思的背影，流下淚如此說。兩人走過大半個英國，最後終於體悟到

  ，只要有彼此在的地方，就是最溫暖的家。莫思與蕊娜這趟旅程，也並非完全沒有口角，

  但至少從《鹽路上有你》來看，只有一次互相責怪莫思愚蠢的投資，以及蕊娜沒有及早提

  交足以證明無負債的信件。其他時候，就算小有口角，也是很快就淡忘，莫思永遠是那個

  記得幫妻子泡一杯茶的老公，而蕊娜也仍然是那個自己吃不飽也怕丈夫餓著的妻子。



  《鹽路上有你》明明不是浪漫愛情電影，但從銀幕上流洩出的是滿滿的愛意。當蕊娜自責

  忘記取消房屋保險，導致救濟金遭扣除，莫思沒有責怪，只表示現在取消就好了；看到蕊

  娜盯著美食流口水，莫思三步併作兩步地抓起路邊的箱子，站上去開始當起說書人，為兩

  人籌措到得以揮霍一小餐的旅費。電影看似只呈現出莫思對蕊娜的愛，但其實這本回憶錄

  本就是從蕊娜的角度出發，來自老公滿滿的粉紅泡泡也是正常的，而回憶錄也是她在徒步

  旅行後，整理給莫思的生日禮物。兩人的愛雖說不是轟轟烈烈，但卻是最完美的老夫老妻

  的陪伴。



  「介於完熟與腐敗之間，是最完美的滋味。」



  英文片名就是兩人走的「鹽路（The Salt Path）」，正式的名稱是「西南海濱小徑（

  South West Coast Path）」。這條全長1014公里，位於英國西南部的步道，是英國最長

  的國家步道，相當於台灣環島海岸線的長度。由於這是一條濱海道路，因此稱為「鹽徑」

  。兩人在路途中曾經遇到剛游泳完的路人，興奮地與他們分享自己以海水鹽漬的黑莓。直

  接把鹽吃進嘴裡，滋味不怎麼好，但若是能與其他素材混合，再適當地等待時機，完美的

  蜜餞就此產生。經營農場的經驗，讓蕊娜勝任本不接受女性的剪羊毛工作，賺得一筆不小

  的數目，而莫思天外飛來一筆就讀永續農業的想法，其實也與他們的過去相關，並非異想

  天開。



  走完這條鹽路，兩人不但療癒彼此因為失去家園而受到的身心靈傷害，也真的整理好思緒

  ，做好準備，邁向未來。對莫思與蕊娜來說，英國的西南海濱小徑就是「朝聖之路」，他

  們在這趟旅程裡找到家的本質、珍惜人生的美好，也認識彼此無價的愛。片尾也告訴觀眾

  ，兩人目前住在鹽路終點不遠處，也是莫思完成大學學業的地方，他們現在三不五時也還

  會去徒步旅行。莫思與蕊娜從一開始背著笨重行李要經過步道閘口時，都會不知所措地卡

  住，到最後找出最好的通過方式，俐落優雅地三兩下就翻到另一邊。這些意外的收穫，可

  能就像莫思所說，是踏上旅途之前意想不到的「自由」吧！


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
