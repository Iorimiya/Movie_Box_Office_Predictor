title: '[新聞]<X檔案>視后素顏詮釋<鹽路上有你>人生絕境'
content: '新聞網址：



  由真人真事改編，將全球暢銷百萬冊回憶錄搬上大銀幕的感人新片《鹽路上有你》（The

  Salt Path），即將在7月4日於台灣感動獻映。本片請來以《X檔案》（The X-Files）榮

  登「金球獎視后」寶座的英國女星吉蓮安德森（Gillian Anderson）領銜主演。本身就是

  原著粉絲的她，早在劇組籌備期間，便開始尋找取得版權的方法，渴望有機會將本書給影

  像化，更在後續與劇組聯繫時，自薦演出主角「蕊娜」。由於本作描繪一對夫妻在失去所

  有後，徒步走上英國西南海濱小徑，經歷絕望，找到希望的救贖之旅，而吉蓮希望能挑戰

  有別於過往強大的人物形象，因此毫無保留地演出本片，甚至素顏上陣，盡可能貼近角色

  原始模樣。當角色本尊觀賞本片之後，也大讚吉蓮：「非常有力量！」更因為電影太過真

  實，讓她忍不住從頭哭到尾。





  《鹽路上有你》原著回憶錄曾榮獲《衛報》、《華爾街日報》等國際媒體盛讚，更在全球

  暢銷百萬冊，如今改編成最新電影，請來「金球獎視后」吉蓮安德森領銜主演。本身就是

  原著粉絲的她，在劇組籌備期間，便開始尋找取得版權的管道，渴望有機會將本書給影像

  化，她對此表示：「當我讀完這本書後，幾個星期都無法從腦海中抹去，它改變了我對無

  家可歸者的看法，也讓我深刻體會到，我們任何人，在任何時刻，都可能變得一無所有。

  」後續當她與劇組聯繫時，更自薦希望能演出主角「蕊娜」。導演瑪麗安妮艾略特（

  Marianne Elliott）對此分享：「我知道這個角色對她意義重大，並對她的個人層面有某

  種共鳴，因此我跟她談了我希望呈現本作的方式，以及對角色的想法，而她也非常願意投

  入其中！」



  由於吉蓮安德森過去演出的角色形象，大多屬於強大、光鮮亮麗的人物，諸如《X檔案》

  的FBI探員，或是《王冠》（The Crown）的柴契爾夫人，讓她希望能挑戰有別於以往的演

  出，她回憶：「我沒有經歷過他們那樣的困境，但我曾在早晨醒來時心悸不已，擔心這一

  切會不會就這樣消失。能夠演繹各種形式的人性，對我來說真是一種榮耀。」為此，她毫

  無保留地演出本片，尤其角色失去一切，在徒步的過程中也相當狼狽，她為此甚至素顏上

  陣，讓導演不禁讚嘆：「她詮釋出角色的狼狽、失落，甚至覺得自己醜陋、失去自我的模

  樣。她一點也不在意名氣，毫無保留地呈現真實的一切，什麼都沒修飾，沒有化妝，她完

  全不在乎自己看起來怎樣，這點真是太棒了！」





  改編自感人真實故事的《鹽路上有你》，描述一對失去所有卻仍不放棄彼此的夫妻，踏上

  長達630英里的旅程。沿途，他們用雙腳走過絕望，用愛撐過崩潰邊緣，在困境中展現出

  動人的深情，也令觀眾看得熱淚盈眶。原著作者、同時也是故事主角的蕊娜文恩（

  Raynor Winn），在得知吉蓮安德森會詮釋自己時，震驚表示：「怎麼可能？一個這麼漂

  亮、光鮮、完美的人，要怎麼演出我那種最低潮、最赤裸的狀態？」而當她觀賞完本片之

  後，對吉蓮的精湛演出大讚：「我覺得吉蓮完美捕捉到我迷失的感覺，不是迷失在路徑上

  ，而是迷失在人生中。她在對白與行動之間的空隙裡，展現出高度力量！」不僅如此，當

  她觀賞時，更因為片中場面太過真實，讓她情緒一度難以消化，忍不住從頭哭到尾：「從

  一開始的場景，就讓我回到人生中一段非常艱難、真實的時刻，接著整部電影讓我重回當

  時那股情緒的洪流。」她也讚揚：「看他們如何捕捉那條小徑的精神，真是太棒了。他們

  創造了一部對白簡單，情感卻非常濃烈，並促使每個人專注在當下的作品！」



  這部細膩刻劃人性，在各國票房創下票房佳績與好評的療癒勵志之作《鹽路上有你》，即

  將在7月4日於台灣感動獻映。本片劇情描述蕊娜（吉蓮安德森飾演）與莫思（傑森艾塞克

  飾演）結縭數十年，原本經營一間農場民宿，過著寧靜而知足的生活。沒想到一場突如其

  來的背叛，讓他們傾家蕩產，連家園跟農場都遭到法院查封。雪上加霜的是，莫思同時被

  診斷罹患罕見的腦部退化疾病，醫生甚至宣告他已時日無多…。一夕之間失去所有的這對

  夫妻，做出看似瘋狂的決定——帶著一本地圖書、一頂帳篷和一些必需品，踏上全英國最

  長、最崎嶇的國家步道「西南海濱小徑」。在這趟橫跨630英里的艱難旅途當中，他們重

  新學習如何活下去，並攜手走過絕望，走向希望。



