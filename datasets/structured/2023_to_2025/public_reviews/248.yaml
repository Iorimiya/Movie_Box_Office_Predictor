url: https://www.ptt.cc/bbs/movie/M.1751463230.A.4E7.html
title: '[新聞] 傑森艾塞克顛覆反派形象演【鹽路上有你】'
content: '新聞網址：



  改編自真人真事、回憶錄暢銷全球，並榮獲無數國際媒體盛讚的感人新片《鹽路上有你》

  （The Salt Path），即將在本週五（7/4）於台灣感動獻映。本片請來演過《哈利波特》

  （Harry Potter）、《決戰時刻》（The Patriot）、《白蓮花大飯店》（The White

  Lotus）等作的英國資深男星傑森艾塞克（Jason Isaacs），飾演無家可歸又罹患絕症的

  真實人物「莫思文恩」（Moth Winn）。因為之前多演出反派人物，而被稱為「反派專業

  戶」的他，自認終於演到「真正的好人」。在詮釋上，他最在意的就是如何精確呈現生病

  且行動不便的身體變化，為此他花了大量時間與莫思本人討論動作，也與飾演他老婆的吉

  蓮安德森（Gillian Anderson）不斷排練。當他實際走上英國最長國家步道拍攝時，不僅

  得要用單腳攀爬各種山丘與地形，更親自幫劇組搬運設備，艱辛程度讓他一度直呼：「太

  荒謬了！」但一想到這是莫思的真實經歷，便認為自己毫無資格抱怨。值得一提的是，本

  片日前在英國上映後，首週末便創下147萬英鎊（約新台幣5900萬元）的驚人票房佳績，

  累積至今更突破700萬英鎊（約新台幣2.7億元），超過許多主流電影，也成為本年度最成

  功的英國獨立電影之一。





  由真人真事改編，將動人回憶錄搬上大銀幕的《鹽路上有你》，請來擁有「反派專業戶」

  之稱的英國資深男星傑森艾塞克領銜主演。雖然這並非是他首度演出真實人物，但卻是他

  自認終於演到的第一個「好人角色」，他表示：「我從來沒有演過一個『真正很好的人』

  ，我以前演的角色都比較複雜、有問題。而這次，我不僅要正確詮釋他的病情，還要誠實

  呈現他向我分享過的脆弱面。」也因為如此，他認為此次背負著更沉重的責任感，坦言：

  「他卸下層層保護，讓我看見真正的他，這對我幫助極大，但也讓我感到一種非常強烈的

  責任感，要把自己退到一旁，盡力說好他的故事！」



  由於莫思罹患罕見退化疾病，不僅導致他行動不便，更被宣告時日無多。傑森對於揣摩莫

  思身體上的變化，十分在意並講求精確：「我只是想把細節正確呈現，精確表現出莫思到

  底能做和不能做的事。由於拍攝不是照著順序進行，我得努力去拿捏症狀的程度，好讓觀

  眾看出他身體上的變化。」為此，他也花費不少時間跟莫思討論動作，來回交流當時的挑

  戰與心情，也與飾演他老婆的吉蓮安德森，兩人在開拍前不斷排練，他分享：「因為莫思

  有一隻腿與一隻手是不能動的，大腦也開始退化，他的老婆每天早上都得把他從床上扶起

  來，幫助他完成所有日常生活動作，所以我們必須學會，如何去呈現這兩位非凡人物的故

  事。」





  《鹽路上有你》完美捕捉英國西南海濱小徑的壯闊美景，由於本片是實景拍攝，劇組們必

  須攀爬各種山丘與地形。傑森艾塞克為了詮釋莫思的病症，必須以單腳爬上爬下，更在戲

  外親自幫劇組搬運器材設備，艱辛的拍攝過程，讓他直呼：「我們得攀爬那些極其艱難的

  山丘、翻越各種地形，而我得靠單腳完成這些。有時候我們到達某些拍攝地點時，我真的

  會想『他根本不可能走過這裡，太荒謬了！』」但當他想起這一切都是莫思的真實經歷，

  便自認毫無抱怨的資格。



  值得一提的是，本片日前在英國上映後，首週末便創下147萬英鎊（約新台幣5900萬元）

  的驚人票房佳績，累積至今更突破700萬英鎊（約新台幣2.7億元），超過許多主流電影，

  也成為本年度最成功的英國獨立電影之一。觀眾紛紛好評盛讚：「重新找到自我的方式，

  深深觸動了我！」「難以置信，他們的旅程令人感動！」「不用過多言語，卻表達豐富的

  訊息！」「是一部溫柔之作，向我們傳遞希望！」



  這部細膩刻劃人性，在各國票房創下票房佳績與好評的療癒勵志之作《鹽路上有你》，即

  將在本週五（7/4）於台灣感動獻映。本片劇情描述蕊娜（吉蓮安德森飾演）與莫思（傑

  森艾塞克飾演）結縭數十年，原本經營一間農場民宿，過著寧靜而知足的生活。沒想到一

  場突如其來的背叛，讓他們傾家蕩產，連家園跟農場都遭到法院查封。雪上加霜的是，莫

  思同時被診斷罹患罕見的腦部退化疾病，醫生甚至宣告他已時日無多…。一夕之間失去所

  有的這對夫妻，做出看似瘋狂的決定——帶著一本地圖書、一頂帳篷和一些必需品，踏上

  全英國最長、最崎嶇的國家步道「西南海濱小徑」。在這趟橫跨630英里的艱難旅途當中

  ，他們重新學習如何活下去，並攜手走過絕望，走向希望。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
