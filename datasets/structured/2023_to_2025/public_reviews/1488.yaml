url: https://www.ptt.cc/bbs/movie/M.1692247787.A.98E.html
title: '[普雷] 《逃出寧靜海》，Mayday, Mayday, Mayday'
content: '部落格版：


  本以爲《逃出寧靜海》和先前Netflix影集《寧靜海》有相關聯，後來才知道所謂的寧靜

  海指的是月球上的靜海，是一座坐落在月球靜海撞擊盆地內的月海，是由兩位義大利天文

  學家在1651年命名的，而月海亦是人類的首次登月著陸點，所以《逃出寧靜海》其實指的

  是「逃出月球」的意思。雖然從劇情上看《逃出寧靜海》比較近於前陣子兩岸電影展選映

  過的中國電影《獨行月球》，主角獨孤月與《逃出寧靜海》主角黃善宇同樣在執行任務的

  過程中因故被獨自留在了月球上，不過相比《獨行月球》是走開心麻花影業向來擅長的喜

  劇路線，用有趣荒唐的橋段與對白來淡化「被獨自留在月球上孤立無援」這件事本該會有

  的孤獨與恐懼，《逃出寧靜海》給我的感想反而更接近之前由麥特戴蒙主演的《絕地救援

  》，兩部作品的劇情架構基本相似，差別只在於劇本是出自文組還是理組之手。


  相對《絕地救援》或許會在最後冷靜的去面對可能的失去，承襲著韓國災難電影特有風格

  、也就是藏有超多韓式洋蔥的《逃出寧靜海》顯然是感性更重於理性，隨著劇情不斷積累

  、直至後段爆發的情感，從個人拉升到整個國家最後甚至是全世界，都讓觀眾即使等不到

  黃善宇平安回到韓國，依舊會被電影襯著配樂渲染開來的情感給打動。早從《與神同行》

  就能知道導演金容華對於人性刻劃與情感描寫上的能力，而他尤其會在劇情中間不斷埋梗

  ，到最後會逐步揭曉真相並將始末交代，接獲資訊上的翻轉都讓藏於其中的複雜情緒與情

  感被更有力的推送出來，不論是《與神同行》中金自鴻在審判過程中那些被判定有罪的犯

  行真相，或者是《逃出寧靜海》裡金載國為何不放棄救援已失去求生意志的黃善宇的理由

  等等，都成了給予觀眾最強而有力的一擊。



  當電影半數時間都在輸出情感、讓情感成為電影的主要推進器時，《逃出寧靜海》就不會

  是一部難以入口消化的作品，雖然電影就和《絕地救援》、《地心引力》等作同樣有些專

  業詞彙與看似艱澀的理論，但並沒有重到沒有相關背景的觀眾無法負荷的程度。《逃出寧

  靜海》劇情簡單直接，電影開頭幾分鐘不到就簡短交代了五年前那來號的事故，以及幾年

  下來韓國正面臨著的挑戰、還有積極重返國際相關組織的決心，而接著展開的就是主線劇

  情，三位太空人獲遴選乘上名為「宇里號」的月球探測器，欲繼續著五年前未完成的任務

  ，讓韓國成為繼美國之後第二個登陸月球的國家。


  然而意外造成兩名太空人不幸喪生，唯一倖存的黃善宇與羅老宇宙中心的連線畫面又因撞

  擊失去通訊，讓在場所有人認為是凶多吉少，直到接收到黃善宇求救訊號才又再度燃起希

  望，為了修復損壞嚴重的探測器，他們不得已找回當年為了任務失敗負起責任離職的前負

  責人金載國，而當黃善宇堅持繼續任務且成功完成登陸月球讓全國沸騰不已時，一場不在

  預料內的流星雨再次讓黃善宇陷入危險...



  《逃出寧靜海》整個劇情發展都是可以被猜想到的，包含救援黃善宇的那些反覆的突發事

  件與解決過程，還有前面提到過的角色行動與想法上的翻轉，確實都是韓國災難電影很標

  準的公式與套路，因此觀賞下來會比較沒有驚喜。但幸好的是，電影足夠寫實的宇宙場景

  與極具水準的特效，還有和配樂搭配有起到加乘效果，加上一百分鐘的片長編排緊湊，某

  方面來說是能轉移觀眾的觀影重點，不會特別去在意單論劇情與敘事稍微貧乏與老套，並

  且《逃出寧靜海》所帶給觀眾視覺與聽覺上的體驗，亦能起到稀釋與中和稍嫌過多的韓式

  情感戲的作用。只是儘管如此，難免還是會覺得電影太把情感當作工具、武器，太多的精

  神喊話與情感勒索偶爾還是會讓人受不了，特別是遠在NASA的金載國前妻尹文英這部分的

  戲，能理解是整個救援行動得以成功的關鍵，但多了仍會讓電影脫離現實。


  就如《絕地救援》後來有了中國國家航天局的協助，在《逃出寧靜海》裡羅老宇宙中心也

  得到NASA的幫忙。導演金容華借助網路力量讓美國不得不在輿論的壓力下促成這次兩國合

  作，不過又很巧妙的讓這被動的援手變成主動的選擇權丟還給美國，更在最後順勢給出他

  自己所抱有的想法，以及探索月球、探索未知的結論，也就是當有人需要幫助時，他始終

  相信人性的善良會驅動人們跨越一切的不同去伸出援手；而面對只有一個的地球，生為地

  球人的我們都應該要攜手合作、資源共享，方能保護且延續地球的生命。就結果來看是有

  些矯情，可又相當符合導演金容華在作品中所帶有的特點。


  --'
