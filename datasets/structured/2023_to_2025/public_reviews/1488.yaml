url: https://www.ptt.cc/bbs/movie/M.1692524832.A.836.html
title: '[好無雷] 逃出寧靜海-太空十大酷刑'
content: '這是部韓國太空災難片，


  就是在講「月球我來了~我又走了」的故事。



  這次不得不說句厲害，


  太空場景已經拍得沒太大違和感，


  (感覺比勝利號更好)


  太空船和指揮中心設計也是煞有其事。



  男主角很可愛，圓圓眼睛骨碌碌，


  而且就是個廢話不多但很有禮貌的太空人。


  配角也是大咖前輩，


  (我願意為了聽金喜愛說英語再看一次！)


  --以下有無劇情但可聯想之雷請慎入--






  劇情組成大概如下：


  玩命關頭 10%：扯


  2012 10%：扯


  絕地救援 20%：故事結構類似


  星際效應 10%：是指某個「角色」與某個情節


  挑戰者號/哥倫比亞號悲劇 15%：莫再提唉


  滿清十大酷刑/還珠格格 15%：不是開玩笑


  韓劇狗血元素 15%：明知煽情還是會哭


  千萬別抬頭 5%：總是有討厭鬼



  雖然劇情大意如此，


  但還是別出心裁，


  因為太空災難片好看的地方就在於，


  太空中有各種意想不到的災難與死法，


  但也會有各種傾盡智囊的創意拯救方法。



  大概是這樣，


  雖然感覺票房不會太好，


  但場景和狗血配樂的確是可以進戲院欣賞和聆聽的，


  有一幕美到哭。


  沒去戲院看的話，


  上串流時記得別錯過喔。



  最後給這部韓片加個0.1分，


  原以為是自大，


  結果是自婊和自省，


  還是有進步啦。



  推薦給：


  跟我一樣，


  覺得現在的自己好沒用，


  懊悔做過的那些蠢事，


  想去死又怕麻煩到別人，


  最後只能痛哭一場的人。



  --'
