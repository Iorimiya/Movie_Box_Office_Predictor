url: https://www.ptt.cc/bbs/movie/M.1693822034.A.444.html
title: '[好雷] 逃出寧靜海~人家可以拍月球片了'
content: '儘管"逃出寧靜海"前半段確實有一些剪輯上的問題

  而事實上這種片子 除非像流浪月球那樣喜劇化

  不然本來就很吃電波 畢竟就是一個演員在密室裡自己做反應

  所以也很能理解...有人覺得不錯有人覺得悶

  但客觀來說 都敬秀已經演得很不錯了~ 足夠交代了


  對我來說 最大的瑕疵反而是那個部長搞笑化的太嚴重了

  跟整部算寫實的步調 實在有點違和~


  但無論如何看完真的都不得不拍手給好雷

  預算換算成台幣大概6億多(比某導還少) 但已經能做出這種等級的

  外太空的 月球的 很不錯的特效~整部的特效鏡頭跟動畫應該超多的


  真的不禁感嘆... 現在人家連這種層級的特效大片/商業類型片

  都已經可以站上世界水準了... 或許剛開始還不臻滿意

  但所有商業類型大片的開始 真的最重要的就是要有人踏出第一步


  從去年外星人+ 今年水泥烏托邦 到現在逃出寧靜海

  真的是感嘆聲越來越大呀..............


  --'
