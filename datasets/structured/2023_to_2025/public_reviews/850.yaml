url: https://www.ptt.cc/bbs/movie/M.1547062450.A.3F6.html
title: '[新聞] Kobe拍電影奪奧斯卡獎 自白：不是贏家'
content: "新聞網址：\n\n2019-01-09 21:33 聯合報 記者杜沛學╱即時報導\n\nNBA傳奇球星Kobe Bryant接受「GQ」雜誌專訪，分享退役後的生活，每天除了到工作室上\n\
  班，其餘的便是打理老婆、孩子們的生活，包括運動、接送孩子上下學、一起吃飯、幫孩\n子洗澡，被問到事業成功、家庭美滿之外，還有什麼想要的？他說：「做為父親，我和太\n\
  太總期許將孩子撫養成優秀的世界公民。」\n\nKobe Bryant分享對孩子的教育方式：「我一直思考：我們是否在做正確的事？我們是否\n用正確的方式溝通？我們是否以身作則？這件事有點困難。許多名人有能力影響世上幾百\n\
  萬個人，卻無法影響家中的孩子，我並不想這樣。我打造的故事當中，有許多是我試圖和\n孩子們溝通的觀念，但以父親的角色去說，他們會感到厭倦。如果我能打造出他們也享受\n\
  的故事，並將經驗轉換到其中，就不會像是在教訓他們，而變成他們自己想學習的功課。\n」\n\n卸下籃球夢之後，Kobe Bryant表示目前的夢想是將Granity\
  \ Studios影視公司做好，「我\n愈認識這個產業，愈發現許多公司並沒有將『族群多元化』做為重心，導致許多聲音被掩\n蓋。我認為這減少了提供青年擁有夢想的機會，也限制了傳播不同面向的聲音與經驗。我\n\
  希望能打造出一個跨種族文化的工作室，讓還沒被看見的故事與經驗能被大聲播放。希望\n那些聽著我們工作室作品長大的孩子們，在10年後能因此成為更好的人。」\n\n\
  是否還想再贏一座奧斯卡獎？Kobe Bryant表示：「在這個領域並沒有所謂的『贏家』，\n因為這是藝術，它是主觀的。」、「我們很幸運地以『親愛的籃球』一片贏得奧斯卡獎，\n\
  確實是很不可思議的經驗，但我們並不以得獎為目標，只是想做出很棒的作品。」\n--\n\n    \n\n ; \n\n\n--\n              \
  \                          01/10 09:50"
