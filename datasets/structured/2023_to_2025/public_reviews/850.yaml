url: https://www.ptt.cc/bbs/movie/M.1543670921.A.EA4.html
title: '[負雷] 與神同行2—地獄是審判，還是自白？'
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  1.影片名稱 : 與神同行2：最終審判


  2.觀影時間 : 2018.12.01


  3.觀影地點 : 住家網路


  4.觀影方式 : 網路


  §其他防雷說明(非必要) : 文長，有雷




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  先說結論好了，看完覺得很失望，如果沒有河正宇，還真難想像這部電影會走向哪種崩壞的程度。





  電影很長，約2個半小時，跟第一集不一樣的是，第一集描述了地獄的樣貌和審判過程，並把重點放在貴人「金自鴻」身上，特效很酷炫且劇情也算灑狗血；第二集回溯到了使者們的故事，揭開千年來的疑問，以及江林使者、解脈怨、和李德春的三角關係（大誤）





  之所以說失望，是因為笑點不夠，哭點也不夠，還參雜太多惡趣味但我一點也不覺得有趣，從一開始閻羅大王彈手指要判官閉嘴那裡，我隱約覺得接下來的笑點都不妙了XD





  於是當侏羅紀的恐龍們冒出來，我真的是滿滿的問號，好吧有迅猛龍（小藍呢？）就會有暴龍，然後連滄龍也要來湊一腳，出場畫面還都跟侏羅紀一樣，我都懷疑我看錯電影了，而且滄龍的功能不是要把他們消化掉，反而讓他們順利抵達下一個審判地點？怎麼有這麼方便的交通工具，順帶一提，待在裡面的話，那些要來追殺冤死鬼的奇怪生物都不會出現了呢，滄龍公車真的好方便（大推）








  故事分為兩邊進行，一邊是江林使者帶著金秀鴻進行審判，另一邊是解脈怨和李德春與成造神的說秘密時間。





  先說江林使者線好了，他和金秀鴻在地獄的推進中，金秀鴻一直在問他關於冤死的秘密以及他不惜喪失使者身份也要幫忙的原因，當金秀鴻推論出其實江林使者只是在利用他想要消去自己的記憶的時候，我倒覺得情有可原也沒什麼好驚訝的，因為本集重點的確不在金秀鴻身上。




  我覺得，江林使者作為辯護律師，在這次的詰問過程是有瑕疵的，特別是在詢問元東延的那一段，他一直想證明金秀鴻是被活埋的，但好像除了咄咄逼人之外，沒有別招了（攤手），在第一集裡，他還可以跟審判的大王們動之以情，說明家庭的狀況以及金自鴻的選擇多麽無私，但到了這一集，他其實可以好好讓元東延回想金秀鴻對自己的好，讓元東延說出真相（畢竟他也知道元東延需要循循善誘才會聽話），怎知因為時間來不及結果證人還當庭死亡了。




  而最後傳喚樸武信的審判，是整部電影的高潮沒錯，江林使者用自己的自責及懊悔，要讓冤死的真相大白，連閻羅大王也可以當作證人呢這樣公器私用（？）可以嗎。這邊河正宇的演技很好，但卻不深得我心，我一直覺得他們都「演」得很好，故事卻沒有辦法觸動我，主線跟支線的分界不清，一邊跳到使者們的恩怨情仇又要一邊解決金秀鴻的冤屈，兩者牽連起來所要述說的「請求原諒」，力道仍不夠深。








  再來是家神「成造神」線，這邊我不得不說，把一億元拿去買基金跟股票還跟高利貸借了三億元，是傻子嗎（翻桌），如果真的是要批評資本主義之下的經濟蕭條以及窮人的困境，把錢投到資本世界裡本身就很弔詭了啊…而且家神啊，如果你沒有把錢砸下去，而是讓爺爺和孫子用這一億元搬去其他地方住，他們兩個人現在是不是就可以活得很好了呢？




  這裡不時帶出的畫面是，他們所身處的像廢墟的地方以及身後高樓大廈的對比圖，從家神在屋頂上的基金股票自白開始，送走奶奶並講著「會者定離，去者必返」，到家神成為監護人並講著Steve
  Jobs的「Stay Hungry, Stay Foolish」，到底為何明明有一億元的賠償金還會變成這樣。




  我原本還以為是有什麼感人的原因你才要守護爺孫倆人，結果！根本自作自受啊還以為是在看什麼血淋淋的投資客電影最後翻身的故事呢…








  總的來說，可以吐槽的地方太多了，這部電影講的是千年以前，江林使者和解脈怨的兄弟情結以及心地善良的李德春故事，講求的是「原諒」，對自己所傷害的人要說出真相和道歉是多麽不容易，寧可記著悲慘的過往蠶食自己，也沒有勇氣面對，對江林使者如此、對解脈怨來說也是，更深來說的話，對閻羅大王也是，最無害的還是都只在乎別人不顧自己的李德春啊。




  而閻羅大王就是江林使者的父親這點，好像從第一集開始就覺得不單純了，在這部電影最後的審判中，江林使者說出了自己千年以來的內疚，他所隱藏的真相透過對金秀鴻的審判而全盤說出，我想他是知道的吧，他說千年以來活在後悔中並非地獄，而是因為父親的死亡讓他再也無法請求原諒，才是最大的地獄，所以這次把閻羅拉來當證人就能讓他說出道歉，還能讓金秀鴻的冤屈得到伸張，真是可喜可賀。






  電影在最後又埋了梗，看來有可能出第三集，但我說那個貴人會不會太多了，每天死掉的人那麼多，這三位陰間使者光忙這條線就夠了，而且最後把閻羅身份揭發出來的畫面好像又有點多餘了，試著想想，如果閻羅大王不是江林使者他爸，怎麼能讓他在地獄這麼亂來（被拖走）


  --


  只是想要寫點什麼，一點都不絢麗與花俏，只要用文字就好。


  節骨眼的觀後感：


  --'
date: 2018-12-01
sentiment_score: 0.25
