title: '[雷] 波西米亞狂想曲：布萊恩辛格的鏡像自白'
content: '波西米亞狂想曲：布萊恩辛格的鏡像自白


  布萊恩辛格和瑞恩莫非

  是福斯體系下對lgbt有深入探討的2巨頭

  特別是前者

  利用x戰警

  成功改寫超英片的陽剛主義與二元對立面

  順利帶入性別多元的種種矛盾


  所以

  波西米亞狂想曲真的要拍

  那個備受爭議的主唱佛萊迪麥邱李

  是最佳賣點

  也是布萊恩辛格這些年對自己演藝生涯的鏡像自白


  兩人仔細看

  人生路上其實很相似

  渴望家庭卻又疏離家庭

  年紀輕輕俊美又才華洋溢

  當然，憑藉這些優勢

  吃遍了大葛格和小底迪就不用說了


  可是

  在他們內心深處

  渴望家

  會渴望和主流社會融合

  會忌妒主流價值觀

  然後又酒池肉林麻痺自己

  惡性循環


  所以，選角真的很重要

  主角Rami Malek雖與佛萊迪相去甚遠

  但他那雙大眼睛矮個子

  時時透露出一股稚氣

  無論台前多風光

  下台後他終究是個孩子

  想要結婚生子

  想要被愛，想要和團員更 深入

  可是同志身分是不可能的

  於是他和保羅成為某種買賣關係

  不可自拔，


  直到瑪莉點醒了他

  有一句話實在是點題之句

  一個人如何知道自己腐敗

  就是果蠅飛出來的時候

  他坦承是自己自甘墮落

  也不忍心和保羅惡言相向

  這是他那雙大眼睛透露出的善良

  他離開了對他事業有幫助但帶壞他的經紀人

  選擇了拒絕他性騷擾的平凡理髮師

  而他和保羅的恩恩怨怨

  布萊恩辛格輕輕帶過了


  然而

  八零年代最被汙名化的 同志癌

  還是沒放過曾經墮落的他

  他的選擇是

  把握剩下的時間燃燒自己

  二十分鐘的非洲慈善演唱會實在是精華

  呈現的是他這些年的好與不好

  we are the champions這首看似自大的歌

  這裡蘊含多少的對病魔的抗爭與無奈

  於是，世界第三大搖滾現場正式誕生


  在辛格開拍波西尼亞狂想曲的時候

  瑞恩莫非也開拍了八零年代跨性別者與愛滋病患的 姿態

  八零到九零年代真是一朵異樣的花

  它有著最強大的創作力、巨星光芒

  卻也有最卑劣的歧視、性別爭議

  透過波西米亞狂想曲的鏡像書寫

  是否也能成為21世紀酷兒們前進的養分呢


  ps

  小彩蛋

  一位知名美國出櫃歌手也客串了佛萊迪的獵豔對象

  大家猜


  --

  那為何是布萊恩辛革導演的

  同是同志導演

  id4場面更恢宏

  美女與野獸真人歌舞秀更精采


  在 me too事件中

  布萊恩的名聲已臭名遠播

  為何還是要他導

  可見大家都知道他在同志議題能做出哀而不傷

  更體現 queen的精神

  id4很成功

  但石墻真的好差

  美女與野獸號稱是有帶同志議題

  也是雷大雨小


  我覺得可能也是因為資方壓力

  讓導演身手放不開

  不能如葛斯范桑

  用獨立製作 自由大道


  所以我覺得能遊走資方和觀眾間

  還可表達意見者的導演

  真的還是布萊恩惹

  也是啊！

  但異性戀不約炮嗎？

  也約啊！

  我們都一樣啊

  差別在當時同志就是不能婚配

  讓佛萊迪嫉妒啊！


  不然你讓 al不唱歌

  只演一個炮友

  意思很明白了


  難道你要讓瑪莉形婚下去也可以

  但值得嗎'
