url: https://www.ptt.cc/bbs/movie/M.1495166973.A.EE4.html
title: '[問片] (已解決)一部關於妹妹自白的電影(有雷)'
content: '突然想起這部想看，但只記得開頭和尾巴劇情(可能有部分誤差)，

  搜尋也找過了沒看到，所以來麻煩大家了~


  我記得是在一個小鎮上，妹妹發現了姐姐的情人，

  她討厭那個人，所以後來鎮上發生了一個性侵案件妹妹就誣賴是姐姐情人做的，

  造成姐姐和她的情人分開，姐妹之間感情也有裂縫了。


  後來中間都不記得，跳到妹妹長大後參加那個性侵被害人的婚禮，

  發現新郎就是那個犯人，妹妹因此想起來她誣賴姐姐情人的事情，

  之後去找姊姊，發現他們復合了，便請求他們原諒。


  最後結局是跳到多年後妹妹變老好像把這些事出書，接受訪談，

  然後自白說其實她就是書中的妹妹，但是現實中沒有被原諒，

  因為姊姊和情人沒有復合也沒在相見過，一切都是妹妹的奢望才那樣寫書。


  這是我所記得大部分劇情，不知道有人知道片名嗎?


  --'
