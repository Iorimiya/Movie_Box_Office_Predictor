title: '[新聞] 曾志偉 「配合調查」滅性侵疑雲 自白endi'
content: '新聞網址：


  曾志偉 「配合調查」滅性侵疑雲 自白ending奔馬場鬆一下


  【張力文╱台北報導】64歲的曾志偉上周三因網路瘋傳影片而捲入性侵藍潔瑛疑雲，他雖

  當天就發聲明澄清，不料號稱中國「金牌模女教母」的韓穎華隔天又跳出來指控他「不止

  1次性侵女藝人」，還聲稱他變相在KTV拉皮條，事件延燒7天後，曾志偉昨午終於開記者

  會說明，表明性侵藍潔瑛是遭捏造，也將控告韓穎華不實的指控，還說：「我配合任何形

  式調查。」9分鐘內以粵語、國語雙聲帶發表聲明後隨即離開，搭乘7人座保母車前往九龍

  塘業主會及沙田馬場。


  曾志偉昨午4點40分於香港開記者會，在律師陪同下現身的他表情嚴肅但仍保持風度，拍

  照時也禮貌微笑，導演兒子曾國祥一同到場，雖未發言，但爸爸讀聲明時，他在台下堅定

  守望，表明立場。


  自責連累親友

  記者會全程約9分鐘，不開放記者提問，曾志偉先後用粵語、國語澄清，「針對以前網路

  上流傳曾志偉性侵藍潔瑛這些報導，我可以告訴大家，完全是捏造的，尊重女性是我堅持

  的原則，我願意配合任何形式的調查，我也堅持用法律手段維護我的聲譽，對於那位韓女

  士在新浪微博對我的不實指控，我將起訴（提告）韓女士，目前已經走法律程序中」。

  曾志偉難過表示「連累我身邊的朋友、我摯愛的家人、我的子女」，而韓穎華指控他與譚

  詠麟組成的明星足球隊其實是去中國尋歡，對此曾志偉也嚴正表示：「這些不實的報導在

  2006年已經有人在報導，而且我們已經控告他，對方也敗訴，他也已經做出賠償。」現在

  再被有心人拿出來抹黑，讓他相當生氣。


  盼法律還公道

  他表示一向不理睬不實報導，盼清者自清，「為什麼要給他炒作、達到他的目的」，但性

  侵疑雲越鬧越大，他決定不再忍讓造謠者，發狠表示：「你不讓他們付出代價，只會讓網

  路暴力越演越烈。」盼法律還他公道，往後將不再對此作回應。

  結束記者會後，他搭7人座保母車前往九龍塘業主會，下車2分鐘後又從後門上車，直奔沙

  田馬場，應是前往參加飯局或散心。

  面對曾志偉喊告，韓穎華沒再怕，昨午繼續在微博放話：「他澄清是他的事，關我啥事？

  他不澄清才怪！老婆子學生的事與『藍』無關。」還反問網友開新聞發布會就是正人君子

  ？強調「老婆子敢公然批評，實在有這檔子的事，控告老婆子，坐等」。


  桃色風暴席捲中港演藝圈

  ●1/10 影片瘋傳

  微博瘋傳「藍潔瑛指控曾志偉性侵」影片，點名已故鄧光榮和曾志偉性侵藍潔瑛，但曾志

  偉透過律師嚴正否認

  ●1/11 韓姨指控

  自稱中國「金牌模女教母」的韓穎華指控曾志偉「不止1次性侵女藝人」，稱有學生去香

  港發展，被他帶去KTV拉皮條

  ●1/13 戰火延燒

  韓穎華指「譚詠麟同曾志偉創辦過明星足球隊，表面上來內地踢表演賽，但是全香港市民

  都知道他們到內地尋歡」

  ●1/15 阿寶無奈

  曾寶儀錄中國節目《2018聽我說》主動表示相信爸爸，也提起在事情未被查清前，「我已

  經迅速成為『強姦犯女兒』」

  ●1/17 現身喊告

  曾志偉開記者會強調性侵傳言不實，並提告韓穎華，也願意配合任何形式調查


  --

  我是男生，只愛男人。我是純真、開朗的0號男同性戀。希望將來能和彼此相愛的男人結婚


  喜歡和不同國籍、類型的帥哥猛男型男交友約會。已記不得、數不清和多少男人交往過了


  --'
