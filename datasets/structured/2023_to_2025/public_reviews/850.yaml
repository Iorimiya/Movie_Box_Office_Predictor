title: '[討論] 李安的自白 爛番茄89%'
content: '亞曼達賽佛瑞飾演李安

  這部作品由曾執導《粗獷派建築師師》（The

  Brutalist）的獲獎編導蒙娜·法斯特沃（Mona Fastvold）執筆並執導，講述了震教徒（

  Shakers）這一虔誠教派創始人李安（Ann Lee）非凡且傳奇的真實故事。


  奧斯卡金像獎提名女星阿曼達·塞佛瑞（Amanda Seyfried）在片中飾演這位堅韌不拔的

  震教領袖。她生前致力於宣揚性別與社會平等，並深受追隨者的推崇。《李安的證詞》

  捕捉了她建立烏托邦過程中的狂喜與煎熬。片中收錄了十幾首傳統震教讚美詩，並由席莉

  亞·羅森-霍爾（Celia Rowlson-Hall，作品見《光之聲》）重新編排為令人陶醉的舞蹈

  動作，配樂與原創歌曲則由奧斯卡得主丹尼爾·布隆伯格操刀。


  大家想看金髮大正妹李安嗎?


  --'
