url: https://www.ptt.cc/bbs/movie/M.1765462923.A.935.html
title: 'Re: [普雷] 突破：三千米的泳氣'
content: '剛看完，感想是李羅找錯導演了

  她女兒很漂亮，被他養成大美女

  還是師大國文系的學霸

  找來一堆大明星來助陣

  有言承旭 太保 范逸臣就有點電影感

  但這導演看他代表作都偶像劇

  導的實在很尷尬，李羅不懂電影

  才會找這票本土劇劇組來搞電影

  裡面一堆海尼根跟置入商品

  好像還有賣藥的保健食品

  蕭煌奇的柔道橋段演得好

  黑幫戲也都安排的還不錯

  但一拍到感情戲就尷尬了

  主要是畫質也不是很有電影感

  但配色還不錯，桌上的菜都很鮮豔

  買車還買粉紅麵包車

  但編導就真的非常三民本土劇

  尤其是裡面演過康安的教練

  我覺得他演的最差

  他在劇組應該也是這樣做人

  應該沒幾個人敢喬他怎麼演吧

  李羅應該也是，所以都演的很尷尬

  最好找個專業的電影導演來導

  像角頭的姜睿智或鍾孟宏

  找電視導演大家只會想看電視

  不會想買票看電影

  還有我常在碧潭游泳

  女主角在分享會說碧潭很臭

  這點就踩到我的地雷

  不常在戶外游泳的人才會覺得臭

  他實在不適合演這個角色

  他爸爸幫她找錯劇本了

  拍部黑幫片或許才會大賣

  這導演拍過鬥魚，也是不怎麼樣

  翻拍成電影也是沒什麼人看

  不過如果拍純黑幫片應該

  能跟角頭系列一較高下

  李羅是我們新店人

  我們新店跟三重一樣

  就是當鋪多兄弟多黑道多

  希望能多在新店拍戲

  多多推廣新店碧潭的觀光

  但要找對電影導演才行

  這片純粹就是找錯導演拍而已




  -----

  Sent from JPTT on my Samsung SM-X210.


  --'
