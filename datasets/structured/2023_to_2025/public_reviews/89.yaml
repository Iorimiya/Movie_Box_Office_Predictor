url: https://www.ptt.cc/bbs/movie/M.1759487311.A.114.html
title: '[普雷] 突破：三千米的泳氣'
content: '==簡介==

  《突破：三千米的泳氣》改編自真實事件，2020年七位視障者成功泳渡日月潭3300公尺

  的故事。


  導演：安景鴻

  主角：李 王羅、范逸臣、李紫嫣、翁家明、吳鈴山、馬國畢、翁琪兒、米可白

  客串：言承旭、春風、蕭煌奇、太保、荒山亮


  ==心得==

  很多事情沒有發生在自己身上的時候，也許真的很難以當事者的立場去感受那一切；例如

  失去太太的感受、失去女兒的感受、失去寵物的感受，或是失去感官功能的感受…


  只給這部片普雷，是因為前幾週看過太多好看的國片，感覺同樣的情感對戲內容，其他部

  片所呈現的方式更加深入人心。(我知道這樣的比較不太公平)


  不過看完這部電影也並不是沒有收獲，看到視障朋友可以組團玩音樂、坐火車看日出、游泳

  渡日月潭之後，在需要有所堅持的事情面前，別忘了：給你自己一個機會！


  --'
