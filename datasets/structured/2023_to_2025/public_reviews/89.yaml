url: https://www.ptt.cc/bbs/movie/M.1757348361.A.5BD.html
title: '[討論] 【突破：三千米的泳氣】'
content: '今天收到家人分享才知道有這部國片…

  也是因為家鄉之前在某數字巧克力上班的老闆有入鏡客串所以好奇～




  板上好像沒有相關文章！？

  預告看完你們會有興趣嗎？


  個人支持與喜歡的國片類型像是【一家之主】、【老大人】、【下半場】、【BBS鄉民的

  正義】、【極樂宿舍】、【聽見歌再唱】、【只要我長大】、【看見臺灣】、【九降風】

  、【爸，你好嗎？】、【不老騎士】、【紅衣小女孩1、2】 ......


  近期【96分鐘】也因為板上推薦有興趣會在這幾天買票進場～


  印象深刻老闆那時包場邀請吳寶春師傅和大家一起觀賞【世界第一麥方】。


  之前有討論過翻譯字幕議題，最近看的電影我覺得黃文俊翻譯得都還不錯～


  而現在炎上的文章畢竟不是現場看到所以無從評論…

  但親身經歷分享兩則，有一次在老家唯一戲院，因座位前後排數高低落差很容易被擋住…

  前面坐直挺的男性已觀察至少五分鐘確定都沒動作，直接拍他提醒「擋到了，請往下點。

  」有立刻道歉與配合；第二次則是正片開演十分鐘以上一對情侶慢悠悠牽著手、開著手電

  筒走過來又繞過去找位子，找到後男生站著慢慢放包包跟零食、飲料…我直接喊「前面的

  快點坐下啦！」才趕緊坐下然後轉頭幾次想要看聲音來自何人…而周圍傳來了竊笑聲與「

  水啦～」


  這些需要慢慢克服與識時務～

  祝我們觀影體驗都能維持良好。


  --

  謝您'
