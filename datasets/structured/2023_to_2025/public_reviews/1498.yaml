content: 'NSO x NTU D-School歌劇響宴 | 大樹公下落地掃 ROLL THE SAUCE 音像展


  ▎節目時間與地點資訊

  2022 / 7 / 21 ( 四 ) @國家音樂廳一樓大廳


  開幕式暨電影放映 【 薛平貴與王寶釧 】（下午電影場）


  免費索票連結：

  活動頁面：


  13:30 開幕式與NFT鑄造

  14:00 電影放映與映後座談

  映後座談人 | 曾吉賢 主任、謝筱玫 教授


  1956年由拱樂社拍攝的《薛平貴與王寶釧》，

  是臺灣第一部本土35mm歌仔戲電影，

  取自廣為流傳的民間故事，是早期珍貴的電影及歌仔戲史料。

  然而在過去一段時間中，關於本片的資料只見於文字敘述，影像則被註記為佚失。

  2013年7月，《薛平貴與王寶釧》拷貝片被國立臺南藝術大學

  音像紀錄與影像維護研究所團隊發現，隨後並開始著手數位修復工程。


  本次我們邀請國立臺南藝術大學音像藝術媒體中心於展間放映《薛平貴與王寶釧》數位修

  復版，誠摯邀請您一同前來見證臺灣早年歌仔戲電影的風華，以及文史保存背後的努力。



