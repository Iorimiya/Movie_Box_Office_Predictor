url: https://www.ptt.cc/bbs/movie/M.1676004214.A.9BD.html
title: '[問卷] 數位修復版電影觀後感受調查'
content: "0213更新：已截止回收，謝謝大家的幫忙\n本週會亂數抽出電影票得獎者公佈於留言區\n再次感謝電影版協助填寫問卷的大家\n\n—\n\n電影版的版友們大家好\n\
  \n有一份學術問卷需要大家的幫忙填寫，\n本問卷目的是想了解觀賞數位修復電影的懷舊感與幸福感之關係，\n本問卷採匿名作答，所得資料僅用於學術分析研究，不作其他用途，\n\
  您的作答將對本研究極具價值及貢獻，敬請您就個人實際情況與感受安心填答。\n\n  （0211）更新填答對象條件：在電影院之外的其他平台觀看過數位修復電影的觀眾\n\
  \n若您完整填寫問卷，並經確認為有效問卷，即可獲得抽獎資格。\n\n本研究將抽出威秀影城電影票10位得獎者\n希望大家能協助幫忙填寫問卷，也歡迎邀請其他朋友填寫\n\
  謝謝大家\n\n問卷連結:\n\n\n--\n\nP.S.為感謝批踢踢電影版在我無論是在觀影選擇、工作以及學術研究上一路陪著我\n歡迎填完問卷的大大們可以留言\
  \ done，我會另外抽出三位得獎者獲得威秀影城電影票\n待有效問卷收齊後即在留言區公布得獎者\n\n\n--"
