title: '[討論] 星戰本傳三部曲數位修復版有機會上映嗎？'
content: "最近因為疫情的關係，不少大製作的電影都延期上映，\n\n導致這一陣子台灣的片商只好把一些經典電影重新上映，\n\n星際大戰本傳三部曲似乎曾在1997數位修復並重新上映，\n\
  \n這三部電影應該算是這系列的經典之作，\n\n不知道片商有沒有打算把本傳三部曲的數位修復版重新上映，\n\n不過看樣子疫情趨緩，連花木蘭都要在七月上映了，\n\
  \n再過一陣子經典電影要再上映的機會似乎越來越少了，\n\n所以如果星際大戰本傳三部曲數位修復版重新在大螢幕上映，\n\n大家會去看嗎？\n\n--\n   \
