url: https://www.ptt.cc/bbs/movie/M.1630232175.A.549.html
title: '[討論]會去看數位修復版的原因是什麼？'
content: '因為疫情關係

  這一兩年數位修復版真的很多

  我自己也去看了幾部

  不過原因都是因為找不到哪裡可以看

  如果正版串流有 我不介意在家看

  然後如果是之前看過的

  再出數位修復

  目前我是沒有還沒重刷過…


  不知道其他人去看數位修復的原因？

  跟我一樣沒看過找不到嗎

  還是要享受電影院的感覺


  PS 聽說告白好像要重上

  當年看完小說再去看的我…滿傻眼的


  --'
