title: '[情報]《盛夏光年 15週年4K數位修復版》8/27上映'
content: '《盛夏光年：15 週年 4K 數位修復版》｜8.27 重返光年


  那年夏日的青春裡...

  　無悔嗎？愛過嗎？

  　

  　那個你一直靜靜守候的人...

  　有勇敢讓他知道了嗎？


  　——————————————


  《誰是被害者》張孝全《第二名的逆襲》張睿家

  　　兩大男神初試啼聲純愛經典


  「亞洲第一搖滾天團」五月天 Mayday

  　　同名原創歌曲 傳唱感動數世代


  《重返 20 歲》億萬名導 陳正道 成名代表作



  第 43 屆金馬獎 4 項提名！榮獲最佳新演員獎 張睿家

  第 8 屆台北電影節 正式入選

  釜山國際影展 New Currents 單元

  東京國際影展 最優秀亞洲電影賞入圍



  守恆就像恆星一般，永遠自信，總吸引所有人的目光。正行就像行星一樣，安穩自愛，一

  直圍繞在守恆身旁。兩個男孩，就這樣從鄉鎮到城市，一同並肩成長。直到有天，一個像

  彗星般的女孩惠嘉闖入他們的生活。整個宇宙瞬間變動，那個宇宙很小，只有他們三人，

  卻是他們的全部。秘密慢慢拉開三人的距離，愛情跟友情都被重新定位，最親暱的夥伴都

  在青春中被拉出如光年般遙遠的距離...



  《盛夏光年：15 週年 4K 數位修復版》將由前景娛樂發行 8/27上映


  --


  --'
