url: https://www.ptt.cc/bbs/movie/M.1729523083.A.18B.html
title: '[新聞] 《孽子》數位修復版・ 世界首映 '
content: "「我心好痛.」挨了多刀的《孽子》修復重返\n\n  「本片雖無刻意描繪色情或暴力之鏡頭，但以青少年同性戀為背景之變態情節，恐對心\n智發展尚未成熟的少年或兒童心理有傷害之虞\
  \    」—                      年 #新聞\n局影片檢查建議。\n\n1989年群龍影業向新聞局申請《孽子》准演執照，在經八位委員、往復三次的送檢紀錄後\n\
  ，被新聞局要求 #刪減了21個片段，被剪掉的部分也都被沒收。\n\n《孽子》改編 #白先勇 經典同名小說，導演虞戡平勇敢挑戰尚在戒嚴時期的保守社會，\n在原著問世短短三年後，便把這個無比禁忌的故事搬上大銀幕，成就台灣首部同志電影。\n\
  \n片中展現對同性戀的人道關懷，及描繪出在當時台灣社會中，被迫離家出走的同志經歷與\n慾望， #孫越 和  #李黛玲 兩位資深演員更以動人演出貫穿全片。\n\n\
  《孽子》作為台灣同志電影的先鋒，當年歷經 #電影檢查制度 被身砍多刀，而這些傷痕\n，隨著數位修復的完成，轉化為象徵多元平權的彩虹，在今年同性婚姻合法五週年、原作\n\
  《孽子》出版40年，修復上映，格具意義，邀請大家見證！\n\n♡ 10.25場次更特別邀請主創團隊  #白先勇、#虞勘平、#廖慶松、#蘇明明 映前座談！\n\n\
