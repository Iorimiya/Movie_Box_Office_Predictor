title: '[情報] 《噩夢輓歌 4K數位修復版》電影預告'
content: "網友列為「世界十大禁片」！《》\n\n金獎名導代表作【】\n\nRequiem for a Dream \n\n\n3/17 (五)台灣院線首度上映\n\
  \n長年列為「世界十大禁片」！\n\n、轉型演技派代表作\n絕對不可錯過的 大銀幕 震撼體驗！\n\n\n《》\n3月17日 (五) 台灣首度院線上映\n\n\
  《》《》\n金獎名導成名代表作\n\n《大法師》奧斯卡影后再創演技新巔峰\n\n《》、《》超尺度演出\n\n2001 奧斯卡金像獎 最佳女主角 入圍\n2001\
  \ 金球獎 戲劇類電影最佳女主角 入圍\n2001 美國電影學會獎 年度十大電影\n\n獲得全球近40個獎項肯定，網路流傳「#十大禁片」之一\n\n對藥物成癮者心理狀態描寫最細膩、最驚世駭俗的電影\n\
  \n 全球最大、最具指標性電影網 IMDb 均分8.3高分神作，名列影史排名第85名佳片\n\n\n寡婦莎拉（飾）夢想穿著年輕時的紅洋裝上電視，於是決定靠藥物來瘦身。\n\
  與此同時，她的兒子哈利（飾）和朋友泰隆（ 飾）希望透過販售\n海洛因致富，哈利的女友瑪麗安（飾）也加入他們的計畫。這時四人還不\n知道，藥物將使他們的人生走向不可挽回的境地……。\n\
  \n\n\n\n資料來源：\n\n--\n有提到阿，我有上色了"
