title: '[好雷] 革命前夕的摩托車日記 數位修復版'
content: '雷文防雷資訊頁


  哈拉


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  這是一趟壯遊

  兩位主角 一位胖切一位瘦切 分別是生化專家與差半年沒念完的醫學生

  從家鄉阿根廷出發 騎著漏油的破摩托車 一路摔車  打炮  混吃騙喝

  然後隨著逐漸進入安地斯山的核心

  他們逐漸看到了他們從來沒有認知的另一面


  治不好的病人 土地被大公司兼併的原住民 眼神無光的共產黨員   被

  亞馬遜河隔離的痲瘋村

  徹底改變了兩人的思維

  尤其是瘦切 也就是後來的切格瓦拉


  不過劇中沒有很著墨後來的這部分 畢竟現在也已經不是革命的時代了

  共產主義後見之明也是蠻多問題的

  但是劇情還是蠻有浪漫主義的味道

  就像一個大學生 出社會就想要改變世界那樣浪漫


  還有就是單純的跟好朋友出來壯遊看世界 看大南美洲 爬安地斯山 馬丘比丘打卡

  有點以前跟朋友去埃及開眼界的那種感覺

  還蠻有共鳴感的 這種旅行電影 也是大螢幕看起來才爽

  可惜整廳只有兩人 好可惜啊



