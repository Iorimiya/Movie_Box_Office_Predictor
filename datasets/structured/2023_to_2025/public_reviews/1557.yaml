title: '[好雷]《銀平町的電影時光》電影牽起的緣'
content: '苦與樂都在影廳裡，每個看電影的人


  電影娛樂到今約一百多年，除了改變人們的娛樂方式，也讓許多視覺創意得已被發展到龐

  大和全球化的規模。在過去連鎖電影院還未發展的年代，各地方常常有各式各樣玲琅滿目

  的小戲院。


  台灣受日治時代的影響也有著許多播放電影的「映画館」，但如今這類型的小型影廳、二

  輪影院已經越來越難見到，漸漸成為一個時代的縮影。


  《銀平町的電影時光》是一部圍繞日本小影院的小品故事，欠債的近藤在與友人借錢失敗

  後，遇見了一位愛看電影的流浪漢，在缺錢無居的情況下，暫在商店街小影院老闆梶原那

  處打工，而因為電影院的關係認識了許多不同性格且喜歡電影的人。某天，梶原老闆喝醉

  闖入了近藤的小房間，發現近藤電腦中有著一段段未完成的電影毛片……







  《銀平町的電影時光》是什麼電影：


  對喜愛靜態活動的我來說，過去學生時代最好消磨時間的活動，一來是租書店、二來是網

  咖、再來就是電影院。雖然學生時代不是什麼影癡，但是學校附近那便宜的二輪影廳還是

  很吸引人的，80塊錢可看兩部片，甚至還有月票可以買，對學生來說可是便宜又大碗的選

  擇。如今工作後沒有幾年，那學生時代老舊的二輪戲院已經不在了，而成了一座又新又大

  的地方新戲院，也許會成為新一代學生的求學回憶吧？


  台灣最早放映電影的場所為代1900年日治時的台北「十字館」，是由法國自動幻畫協會與

  日本大阪商人大島豬市請人來台放映法國盧米埃電影。當時以西門和北門這兩地為中心「

  吉川亭」、「十字館」、「台北座」等多家戲院演出戲劇與播映電影。


  1908年西門戲院「芳乃亭」改建「新高館」，成為台北第一間專門放映電影的電影院（今

  為國賓戲院）。可以看出日本的觀影文化在上個世紀就在台灣本地活絡，地方戲院依舊各

  自獨立於各方，直到1996年華納與威秀集團成立連鎖影院後，台灣才正式進入連鎖影院時

  期。







  在日本也是如此，雖然日本電影、動畫在世界各地有受到好評，但在地方上小戲院也慢慢

  的隨著商店街沒落，電影《銀平町的電影時光》中的小影院也是如此。主角近藤因為欠債

  無住所的情況下被地方電影院小老闆梶原收留在影廳內打工。


  雖然電影院沒多少客人、又常遲發員工薪水、但還是苟延殘喘在那邊，但與電影院裡的人

  交談，常讓近藤覺得心裡平靜，尤其是喜歡看電影的無業遊民佐藤大叔，近藤感受到他滿

  滿對電影的熱愛。


  隨著電影院每況愈下的人次，為了不讓電影院歇業，常客和工作人員們打算想出點辦法招

  攬客人、藉由影院的周年刺激消費，但此時卻出現了很多意料之外的狀況。近藤大叔身體

  狀況越來越糟、年輕少女毛遂自薦的想要播放自己做的電影，被發現身份的近藤也需要貢

  獻出那部未完成的作品，而在此時意料之外的人出現在電影院外，也間接道出近藤內心裡

  那想逃避電影與自責的過去。










  《銀平町的電影時光》分析與延伸：


  這次電影除了過去參與許多知名日劇的演員回歸之外，最讓影迷注意的其實是《銀平町的

  電影時光》拍攝電影院場景「川越斯卡拉」。與台灣日治時代的電影院的開端相同，川越

  斯卡拉前身也是劇場，1905年開業為表演雜耍劇場「一力亭」，而後在1963年，才成為專

  門播放電影的川越斯卡拉劇院。


  和許多地方電影院一樣2007年川越斯卡拉因為不敵連鎖大影廳而歇業，但透過非營利組織

  的幫忙下，以藝術電影、小眾電影廳籌資後重新開業，目前也是日本很指標性的藝術電影

  院。


  川越斯卡拉這類的獨立電影院，實為「社區電影院」，是日本地方政府過去傳遞藝文的重

  要影視活動地。日本電影放映網路會在2003年時曾經做過調查，發現有九成的電影只會在

  東京上映，地方上映不到一成，故跟政府提出了「社區電影院」的想法。但有想法是好事

  社區電影院的經營卻是相當困難的，許多地方電影院，並沒辦法像川越斯卡拉轉換成藝文

  電影那樣有效的轉型成功。







  現代產業的衝擊不只有電影院，2020年日本紀錄電影《踊子》就拍攝地方過去風光一時的

  脫衣舞產業，這帶有半情色半藝術脫衣舞，如今已經被許多燈紅酒綠的紅燈區和網路媒體

  所取代，觀眾和表演環境也大不如前。這種小型情色舞台演出與地方電影院的經營某方面

  有著一些雷同之處，例如沒有能吸引現代人的節目（電影），且也因為多半於東京和大城

  市之外的鄉鎮，但無法轉型與善用網路行銷與推廣而走向結束。


  在網路影視平台和主流企業大影廳的夾殺下，像電影《銀平町的電影時光》中的地方戲院

  生存相當困難，近年許多獨立電影、私電影和地方政府合作，會選擇在地方播映電影院而

  保留觀眾。


  但沒有從根本上維持長久的戲院消費根本無法承受赤字和影院維護、甚至購買新電影，整

  體上像是慢性病的病人一樣只能緩慢的靠名為政府補助的藥物拉長存活時間。但也有轉型

  成觀光與打出名號的電影院如今還是以地方藝文影廳活動著，如打著復古藝文影廳的「川

  越斯卡拉」，也許做出特色點，才是獨立電影院可以存活的關鍵。









  《銀平町的電影時光》值得一看嗎？


  在2021年電影院川越斯卡拉就曾經拍攝過另一部也是以講述電影熱愛為主題電影《電影之

  神》，而2023年電影《銀平町的電影時光》再次選擇此地拍攝，主要是這地方真的保留著

  昭和時代日本商店街電影的特色與特徵。


  《電影之神》中因為主題是電影導演的主角本身，故還未能感受到太多，但《銀平町的電

  影時光》則是以電影院興衰為主題，整部電影可以感覺到濃厚的被這個時代拋下，停在某

  個時間的影院光景。


  《銀平町的電影時光》整體的故事我覺得是日本電影很擅長的小品與小人物所串接起來那

  種日常與平凡，但又帶點感動與感傷的故事。如今許多國家的電影裡，日式電影在拍攝這

  樣的地方故事與平凡人的小事還是佼佼者。沒有驚心動魄的大場面，或是翻轉再翻轉的神

  展開，但卻讓人忍不住想繼續看下去，這不只是《銀平町的電影時光》的魅力，也是許多

  日本電影說故事的魔力。








  在這部電影中會讓人找回過去90年代前在學校、老家、甚至小公司附近的地方電影院打發

  時間看電影的感覺。沒有很多東西可以選擇的小販部、印刷不精美甚至是手寫的回數卷、

  老電影與畫報、還有空位很多任選，畫質有點難過的電影帶等。雖然不是多麼高級與舒適

  的戲院，但卻會讓人回憶起一些小戲院已經不在的事實。現在是追劇一整天，過去則是連

  看四部二輪電影從白天到天黑。


  電影《銀平町的電影時光》有讓人穿越的時代感，不管是主角的電影、或是戲裡戲外呈現

  的氛圍，都透露著一股懷舊但又不賣弄情懷的扎實故事。從主角近藤為何到電影院，再到

  每個角色之間那淡淡的情愫與相知相遇。有些留在過去保有遺憾的，電影將他留下來。


  台灣每幾年也有獨立電影院將歇業的消息，以我那本來就不繁華的老家也只剩兩間地方電

  影院還在，距離上次已經多久沒走進這些電影院看一部片，而下次想到時，也許它已經不

  在那裡。


