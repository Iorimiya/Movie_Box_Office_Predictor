title: '[請益] 再問《地獄怪客：歪曲人的詛咒》'
content: '之前有人問到底好不好看結果一直被洗向小丑2的難看

  小丑2我已經看過了看完了也很氣

  一大早花了我兩小時多的時間還有零用錢去看一個神經病的自我獨白

  然後最後告訴你對根本就沒有小丑只有一個沮喪的神經病

  然後最後安排一個要拋梗的二百五猝不及防

  讓我們的主角戳戳樂一下倒在地上呈現漏尿狀的抖兩下

  結束，登愣！

  哇糙沒放到颱風假已經很不爽了還要被這樣羞辱

  真的只有氣氣氣氣氣

  但這禮拜還是想要娛樂一下

  有看到《地獄怪客歪曲人的詛咒》這次好像是走解謎和恐怖對峙的走向

  小弟是真的想要再問問有看過的人到底解謎的部分算不算多？

  啊還有最重要的是，這次結局刺不刺激？

  打的多嗎？預告有看到火車的戲是結局戰嗎？

  這種類型電影要是第三幕結局戲不刺激的話真的就是爛到底了

  例如我們的小丑2，不要以為把法院炸掉就是對觀眾有個交代

  可憐



  --'
