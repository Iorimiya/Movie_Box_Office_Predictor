title: '[好普雷]長椅小情歌：看似清新日常實則隱喻不斷'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  \n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n圖文好讀版：\n\
  \n\n\n\n\n\n電影設定是這樣的：五個小短篇章節，單篇約15min上下，串起全片，\n演出只在一張老舊的長椅凳上，毫無場景切換，長鏡頭走完全程，\n沉浸式地承載著不同人們情緒，有曖昧對象、情侶、姐妹、謎之人類？等等…，\n\
  看似清新小品，實則隱藏後座力極強的情緒級核彈。\n\n劇情走向一層一層堆疊上去，剛開始很甜，就小情小鬧、溫馨感，甚至些許令人莞爾，\n後頭轉為長椅即將迎來重大事件，隱喻開始瘋狂噴出，霹靂啪啦亂炸，\n\
  席間觀眾開始啜泣，筆者也收下不少金句：\n\n\n\n    老舊的長椅，對某些人很重要，不能拆除。\n\n    地球人為什麼要把感覺和語言分開呢？\n\n\n\
  \n<第三編 看守的責任>，由森七菜飾演的妹妹，和離家出走流浪姐姐之對手戲，\n張力十足，有別於もりなな以前戲路，原來兩人都只為了守護自已在意\n對象所留下的念想；最喜歡要屬<第二篇\
  \ 不旋轉的壽司>，隱喻有趣，\n年輕小倆口即便吵架鬥氣互動亦甜，全程放閃。\n\n\n久別重逢、在意、壓抑、親情、愛情、惡趣味，日式電影擅長的元素集於一斯，\n\
  依觀影者當下心境油然而生不同詮釋；本作集結不少大咖演員讓小品不簡單，\n它絕非簡單小情歌，是一團未能全解開的沉重迷霧。\n\n\n\n\n\n--\n\n\n\
  「喂，聽說秒速五公分。」\n「什麼？」\n「櫻花落下的速度呀，每秒五公分。\n\n\n--"
