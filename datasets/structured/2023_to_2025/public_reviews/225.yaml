title: '[好雷] 長椅小情歌 別被情歌騙了 舒服好看短篇'
content: '看之前我都忘了當初預告看到什麼讓我想看

  反正票都訂了

  結果開播我才知道是短篇集


  很久以前看了104號房

  我的心裡大概有留下一點對這架構的愛

  到現在看長椅也有相似的感覺


  短篇的特色跟優點就在於短

  不用鋪陳還有過度強調細節

  主軸 完全不容任何偏移的主題

  所以精煉 毫無多餘的精彩


  長椅這部就是如此

  每個篇名都下的好到不行

  在日常對話中 藏在字裡行間的暗示跟韻味

  尤其能在開頭跟結尾兩個故事看出來

  再用定點的人物和風景展現出來

  很美的側臉跟陽光 舒服的節奏


  當然最吸引我的是中間三個故事就是了

  每個都好好看

  外星人講的語言的美妙

  還有破牆又把牆塞回去的故事結構

  最後的故事又像是玩弄觀眾的名字


  痛擊我性癖的姐妹百合

  跟整部調性對比的衝突感強烈的快速晃動鏡頭

  那個暖暖包 我整個人笑到停不下來


  但


  那個第二篇


  まわらない 不會轉的壽司跟大腦

  超級強 這短篇我會記得永遠 太神

  每個元素 對話的利用跟暗示

  突然插入的不認識的大叔爆吃你的壽司

  邊笑又能邊愛上這麻煩的要死的女人





  結論

  好看

  超值




  --'
