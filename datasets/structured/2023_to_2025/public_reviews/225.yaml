url: https://www.ptt.cc/bbs/movie/M.1752854398.A.DDF.html
title: '[好雷] 《長椅小情歌》好雷觀後感：想一直陪你'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《長椅小情歌》好雷觀後感：想一直陪你笑、看你哭\n\
  \n▎ 無雷推薦語\n\n\n\n\n（以下有雷）\n\n一、那些被剩下的\n\n「通常長椅都是兩張成一對，但這一張被留下來了。」以此情節做為故事標題的點題，除\n\
  了表達人心與事物變遷的徵兆難以察覺，也在講利子跟阿德，這對青梅竹馬的感情，在物\n換星移中被保留了下來。\n\n我們都不知道何時會離別，但就算我有另一伴，還是會找你過來，只因為這張長椅。看他\n\
  們一直借題發揮、問A答B甜蜜放閃，我真的可以看一整天。\n\n二、不旋轉的壽司\n\n這題用吃壽司比喻，講很可愛又實際的狀況：沒有什麼大毛病，但就是想分手怎麼辦？\n\
  \n「如果我的個性夠直率，就不會忍到今天才講了。」當女朋友講出這句話，站在男方的角\n度一定覺得對方「毛很多」。這邊顯示兩邊愛的方式不同，女方覺得委屈忍耐小事就是付\n\
  出，男方則希望對方積極提醒跟溝通。應該戳中很多情侶的溝通盲點。\n\n後來偷聽大叔搞笑亂入，把已經滿的壽司吃掉了幾個，戀情又順利度過危機。有夠像說八\n百年要分手的朋友\
  \ / 要離職的同事，吐吐苦水之後就會繼續頭鐵忍耐了。(旁邊親友辛苦\n了)\n\n三、看守的責任\n\n「我就陪你傻一次。」\n\n哭最慘的故事。前面只覺得兩姊妹都在大吼大叫好吵，結果當姊姊放下戒心，講出自己可\n\
  能很瘋狂卻誠實的理由，眼淚就不停地流下來。\n\n吵架最怕不肯誠實溝通，姊姊非常重視自己的意見跟選擇，於是鎖住心門守住自尊，是人\n之常情。畢竟誰也不知道亮出底牌，是被好好接住、還是無情嘲笑。(這也讓我想《波紋\n\
  》這裡寫人的軟肋：\n\n當姊姊坦白說出，自己正在為了不認真的男人，用等待來止痛療傷，妹妹說：「我不知道\n你在等什麼，但我願意陪你等。」妹妹用一樣的方式，讓姊姊理解了她的愛。\n\
  \n明明不合理、可能被對方討厭卻還是執意付出、為你好，我想這就是愛吧。\n\n誰沒有傻過一回，但有個知道你笨，還是願意陪你傻的摯友，十分難得。(真的是被這故\n\
  事打到淚腺，哭到第四個故事還沒停)\n\n四、最後一場戲\n\n無感。\n\n五、寂寞會延續\n\n繼續嗑利子和阿德cp，全糖真的好甜。主要寓意是對事物的想念和道別，自己覺得「對各\n\
  種本來討厭的事物，道別時都只有感謝」有點矯情。可能是把解脫的放鬆跟心裡的原諒混\n在一起了。\n\n所以我同意：能對各種事物都產生「捨不得」的思念之情，真的是幸福的產物。要不是為\n\
  人很善良，就是腦袋很活超級會轉念。\n\n>>網頁好讀版：\n–\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\
  \n--\n他大部分隱喻有重複出現，自己看的時候比較多在看整體意象"
