url: https://www.ptt.cc/bbs/movie/M.1692446010.A.E42.html
title: '[雷] 《之前的我們》發乎情，止乎禮的成熟大人'
content: '防雷











  沒想到看完這部電影，出了影廳眼淚還止不住；也沒想到這麼一個cliche的故事，可以透過

  鏡頭的運用，變成這麼美的電影語言。


  即使人生中沒有如同海聖般擁有未竟的初戀遺憾，但身為亞洲人，還是不免俗的代入這個角

  色的心境多一些，以致三人在酒吧的場景，我從海聖的眼神裡看見了幾乎滿溢出螢幕的情感

  。


  我猜想海聖在韓國的生活一點都不快樂，在人生每個難以度過的時刻，能支撐他繼續下去的

  是兒時那段青澀的初戀回憶，這份情感雜揉了思念、初戀未竟的遺憾、對另一種生活的嚮往

  ，沈重到令他總是有好多話想傾訴，卻如鯁在喉。


  他可能也因為心中始終藏著這份美好，所以接下來的交往對象總是會與初戀比較，無法擁有

  完全滿意的親密關係，抱著一絲絲希望來到紐約尋找他心中缺失的那一角，再次遇見Nora後

  ，他終於明白，不管他們是否相守，她都會離去。


  他溫柔的的眼神什麼都有，就是沒有一匹野馬可以奔馳的草原。


  Nora對海聖的情感，比較像是對老友及故土的思念，透過他加深已不熟悉的韓國文化的連結

  。


  在旋轉木馬前、在看自由女神的渡輪上、在海聖搭上Uber前，兩人曖昧的眼神流轉是最有戲

  的地方，即使聊著不著邊際的話，蠢蠢欲動的肢體靠著理智約束，滿溢的情感已無須多言。


  喜歡結尾一點都不煽情，即使懷揣著淡淡憂傷，兩人還是必須道別，然後回到各自的人生，

  畢竟當下擁有的，才是最真實且重要的。


  知道在這世界上某處，還有一個人代替你記得小時候最純粹的你，已是最美好的事情。





  --'
