title: '[好微雷] 不落俗套的之前的我們'
content: '看演員陣容以為是韓影 但嚴格說來完全是美國電影

  不過多少還是有韓影的味道~ 更主要是劇本真的寫的蠻不錯的


  前面是俗套的劇情 移民的女孩 還在原地的男孩

  而後有機會重逢 卻因為彼此的身不由己

  終究無法更進一步... 而後更因為彼此的失意 另外做了抉擇~


  中間的劇情 一個結婚一個未婚但迷惘

  兩人終於見到面了... 接下來一段彷彿就是"愛在巴黎日落時"的散步對話電影


  正當觀眾猜想會不會往愛在希臘的方向走

  一般愛情電影大概也是這樣 電影中也讓女主角的老公吐槽了一番


  但 這部片得到好評的就是 最後並不是往Happy Ending的方向走

  更寫實的描述了 當年是當年 現在是現在 雖然殘酷

  一個已經往前走了 一個留戀的只是過去的不甘心與幻影


  儘管最後雙方還是傷心 但這就是現實 人生也因此才會有惆悵.....


  後面1/3是本劇精彩的地方 主要原因是畫龍點睛加入了第三人老公

  其中一段三個人在酒吧聊天 聊到最後只有男女主角在畫框中 老公完全變電燈泡的安排

  相當有趣~ 也正因為有這個角色 故事才有醍醐味 這段戲非常推薦一看!


  也沒意外的 今天居然同廳有3~40人一起看 本來想說只是小品而已說 演員也不算太有名呢


  --'
