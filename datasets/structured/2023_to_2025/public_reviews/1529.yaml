url: https://www.ptt.cc/bbs/movie/M.1696980077.A.ACF.html
title: '[好雷?] 之前的我們'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~












  我先講一個缺點好了

  就是導演省略了一些細節


  只把nora跟hae sung好的一面表現在螢幕面前

  中間消失的時間只用很簡短的描述就帶過了


  整部片步調很慢

  這部戲也很挑觀眾


  還講因緣這點

  我想很多人看到後面一定覺得

  "所以哩 你要跟我們講什麼 快點好嗎" XD











  整部戲分割成三個階段

  年少、青年、成人


  年少我是最喜歡年少時期

  單純又沒有太多雜質的時光


  青年部分，兩個人交流的內容只停留在日常瑣事

  但是這個階段，nora有進步了


  她認清事實 this ain''t gonna work

  而男主角卻還沒察覺到那部分的她


  所以兩人分開了

  而就如女主角所說的


  男主角那裏理想中的愛

  只停留在過去那段單純的年少時期






  但我覺得

  男主角在第三階段，也有進步


  一來他知道女主角已經結婚的事實

  可是還是鼓起勇氣來面對她


  再來就是最後等車那糾心的一幕


  即使最後面對面了

  把所有心裡面的話都講出來

  但是彼此都知道，那條線誰都不能跨過去












  導演在後段安排三人坐在酒吧裏的片段

  真的是尷尬到無法言語


  我如果是arthur大概會直接走人

  尤其看到nora跟男主角聊天時的一些肢體語言跟身體接觸


  兩人之前在那邊調情互訴愛意

  是我 我沒辦法忍啦


  nora應該要劃清界線

  只在電話中表示，自己已經結婚

  沒辦法跟他見面才對


  當然arthur也是個成熟男人了

  他接受了nora的這個舉動


  我想知道

  版上有多少男生能很輕鬆地讓自己處在arthur的立場XD





  所以這部戲真的很挑觀眾

  每個人對愛的感受不同，理解程度也不同


  步調真的很慢


  但這部片就是需要觀眾慢慢地去咀嚼

  才能理解男女主角兩人心理狀態的改變跟想法


  片尾那個等車畫面真的很棒

  三人酒吧的場景也真的是尷尬


  這部戲 比較適合注重在心靈方面跟對象交流的版友來觀看


  有點微甜 帶點酸，多點苦

  是個大人才能比較理解的味道



  --





  --'
