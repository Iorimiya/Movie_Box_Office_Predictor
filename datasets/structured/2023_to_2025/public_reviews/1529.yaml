title: '[好雷] 《之前的我們》，世上沒有對的人，只有注'
content: '部落格版：


  在不同的年紀看同部電影，往往會有不同的感受與感觸，或許曾經20歲時的自己所認為的

  ，會被30歲的自己給否定掉。隨著年紀漸長而多出來的從來不只有臉上的皺紋，更還有的

  是不斷堆疊的經驗，從工作到感情再到其他，都在不知不覺間豐厚了我們，也影響了、改

  變了我們。記得前幾年看到一篇新聞，內容大抵在說許多人年輕時在看《惡作劇之吻》都

  很討厭裴子瑜，覺得她想要破壞江直樹和袁湘琴的行為很過分，然而長大之後、來到裴子

  瑜這個年紀甚至超過了幾歲，反而欣賞起了裴子瑜這個人，她敢愛敢恨又絕對的拿得起放

  得下，喜歡江直樹卻從不會為了他放棄自己的人生，即使認為為愛放棄什麼是件傻事，不

  過她也沒有因此去否認掉袁湘琴因愛而出現的行為，只是對她而言「跟著一個人的腳步去

  決定自己的路，我不做沒有把握的事情。我有我自己的人生，想要做的事情還是會去做。

  」


  多年再回想起當年看《惡作劇之吻》時的心情，並不會覺得當年喜歡為愛不顧一切的袁湘

  琴的自己很蠢，畢竟那代表著那個人生階段的自己，只是跟著時間淬鍊與沉澱，才逐漸將

  心轉向了裴子瑜，也沒人能說準會不會再過個20年看法又變了。回頭來講愛情電影，十幾

  歲時的自己對愛情總是有個美好想像，從童話故事到言情小說、偶像劇，慣了我們對有情

  人終成眷屬的深信不疑與對之嚮往，不過身邊朋友幾場戀愛還有自己親身經歷幾段後會懵

  懵懂懂的意識到，愛情原來不是只有歡樂結局，有些愛情注定適合遺憾收場。這些體悟都

  在導演李察林克雷特的《愛在》三部曲裡變得更為強烈，長達18年的跨度將傑西與席琳打

  磨成趨近於現實的樣子，年輕時邂逅與重逢因浪漫作祟下的愛情，終在步入中年後被現實

  轟得遍體鱗傷，當年眼神裡的熾熱如今都折騰成了怨懟。後來想過，如果早知道多年後的

  他們依然相愛卻傷痕累累，傑西和席琳會不會就會選擇讓愛情留在最美好的那刻？要是導

  演席琳宋可能會說「不會。」



  在平行時空、多元宇宙流行的現在，導演席琳宋在柏林影展大放異彩的《之前的我們》，

  就好像是有著相似開始與過程可卻不同結局的《愛在》三部曲，愛著愛著卻沒能走到最後

  的娜英與海聖，彷彿是另一個宇宙裡有著不同名字的傑西與席琳，某方面來講《之前的我

  們》滿足了觀眾如我對於《愛在》三部曲後來「傑西和席琳如果愛到後來沒有在一起會是

  怎麼樣子」的想像，於是我們也可以反過來想像，如果娜英與海聖後來真的成了情侶、結

  了婚，「會不會就像傑西與席琳那樣愛到後來受盡對愛情美好幻想與現實生活間落差的痛

  苦？」。誠如海聖終於在24年之後問出口的，「如果妳沒有離開首爾，我還會繼續尋找妳

  嗎？我們會在一起嗎？會分手嗎？會結婚嗎？我們會有小孩嗎？」，會嗎？海聖想知道、

  觀眾也想知道，只是人生終究沒有那麼多的如果，每個問號不過都只是漫漫人生路上的一

  個逗號或者是頓號，那些選擇看似改變了故事的走向，但其實這些發生都是命中注定，不

  過是時間早晚的問題而已。


  「我早就已經在20年前就把她留在你身邊了。」


  佛說世界上沒有偶然，有的只是必然，緣起緣滅一切皆是定數，不論是傑西與席琳還是娜

  英與海聖，他們每個相遇與分離都是天意，這是導演席琳宋口中的「因緣」。人與人之間

  的關係何時開始又何時結束都是注定好的，《山河故人》裡說「每個人只能陪你走一段路

  ，遲早是要分開的。」，《新娘大作戰》裡當艾瑪和未婚夫選擇分開，面對抱著歉疚前來

  安慰的麗芙她笑著回「如果我和他是天生一對，無論如何都是拆不散的。」，可是他們沒

  有，那是不是代表著她和他這一世的因緣就注定到這為止了？回過頭來看娜英與海聖，他

  們何嘗不也是如此？24年的時間說長不長、說短不短，卻已足夠讓他們長大到能成熟的去

  看待因緣，而坐在銀幕前面的我們，則跟著電影裡時間的流動感受他們身上的變化，亦從

  他們的對話裡意識到他們是真的體悟到因緣帶給他們的美好與遺憾，並且學著接受、釋懷

  然後放下。



  「妳從我的人生中消失無蹤，我只是想把妳找回來。」


  「為什麼？」


  「我也不知道。」


  前面說到的，不同的年紀會讓看電影的心境跟著不同，十幾二十歲出頭時看《愛在》三部

  曲只覺得悶，前些年近三十重新上映再看一次，即便尚未進入到人生下個階段，卻仍感覺

  電影多了很多味道。慶幸是在這個年紀遇到《之前的我們》，花了些時間去沉澱、去咀嚼

  ，不再搞不懂為什麼相愛的兩個人卻走不到一起這件事，而是可以去想娜英與海聖每句話

  、每個決定的心情，12年前重新聯繫上的喜悅，12年後告白後道別的不捨，本來我想海聖

  只是放不下兩人的關係，但從娜英這邊我才理解到，海聖心裡其實早就知道他和娜英這輩

  子的因緣早在當年她離開首爾的時候就結束了，他僅僅是想親耳聽到娜英告訴他這個注定

  好的結局，就算24年前娜英沒有移民，23年前、22年前甚至是1年前，娜英終究還是會離

  開首爾、會和現在的丈夫結婚、會和他在某一天像這樣子，面對面的好好說聲再見，讓24

  年前的他和她好好的留在最美好的時間裡。


  「如果兩個陌生人在街頭擦身而過，兩人身上的衣服意外拂過，代表他們經歷過8000次因

  緣輪迴，在兩人之間。」


  《之前的我們》劇情簡單卻讓人深刻，它講述了一個或許不是每個人都有過的故事，但導

  演席琳宋藉著將「因緣」的概念導入這段關係裡，頓時讓娜英與海聖間緣分的開始與結束

  有了很浪漫的註解。而電影就像《愛在》三部曲，動人揪心的是那些對白台詞，字字句句

  都緊扣著因緣二字，「如果把這一世視為前世，那麼下一世我們會不會不一樣？到時候見

  。」，如果下一世再無法在一起，那就在等下下一世、下下下一世，終有一天會穿越8千

  世、8千層因緣走到一起，對吧？把一段關係的遺憾最後圓滿成最好的約定，讓電影有了

  最適合這部電影的結尾。《之前的我們》裡對話並不多，可已足夠推動著劇情、撩動著觀

  眾情緒，導演席琳宋藉著這個故事告訴了觀眾，也許這個世界上從來沒有所謂對的人、適

  合的人，只有注定好的人。


  好喜歡葛麗塔李與劉台午這對組合，不僅是新鮮而是有著微妙的化學反應，嚮往著未來的

  娜英與佇足於過去的海聖，兩個人剛剛好的碰撞、剛剛好的找到平衡，從眼神到肢體都是

  戲，實在很喜歡導演席琳宋這次的選角，完全就是《之前的我們》的加分項。


  --'
