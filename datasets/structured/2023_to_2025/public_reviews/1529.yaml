url: https://www.ptt.cc/bbs/movie/M.1706072375.A.EB3.html
title: '[普雷] 之前的我們 Past Lives'
content: '看到這部入圍了奧斯卡，一片好評。剛好之前在飛機上看了，有些想法。

  以下有雷



  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  在看全片以前就看到各方好評，不過其實我看到這部電影第一個評論是在推特的微負評。

  有個網友說「這部電影要講的是，你只能當亞洲人或者美國人，兩者擇一。」在看之前我

  也跟一個華裔美國人朋友討論，他表示覺得滿失望的。不過在飛機上看到有這部我也還是

  看完了，而且看到最後我也哭了。但我突然有點懂那個推特在說什麼了....。


  首先先說幾個我覺得不合理之處好了：海聖到底為什麼這麼喜歡諾拉？我覺得電影沒有交

  代。我個人不相信什麼小時候的青梅竹馬跟一見鐘情說。我小時候也有crush啊，現在對

  那些人一點興趣都沒有（笑）。而且他們那個年紀不是小男生小女生都會互相討厭的階段

  嗎w


  再來，我能理解諾拉的因緣說，但我覺得海聖跟諾拉不是緣分不夠，而是努力不夠。諾拉

  曾經說，說她移民了兩次為了在紐約發展夢想，但是她卻因為一直要跟男主角聊天而被拖

  累腳步 。而諾拉遇到亞瑟之後竟然也可以為了綠卡閃婚，代表她其實也沒多喜歡海聖。

  反之，海聖的角色偏偏要是一個「典型的」韓國人，雖然心裡愛著女主角但是沒有勇氣跨

  出那一步。其實看到最後，我真不明白海聖為什麼可以去中國留學，而不去紐約？諾拉都

  發出邀請了。如果片中有解釋說有成本因素那還可以理解，但海聖的原因是他一直都想學

  中文（謎之音：工程師為什麼需要學中文？不是更應該去美國嗎！）如果是這樣，那代表

  他其實也是有夢想的，偏偏電影對海聖的描寫就很薄弱。他的功能就是象徵著在韓國過著

  沒有希望人生，卻無可奈何的那種人。


  最後，片中對於韓國（或者可以代換成另一個亞洲國家）的描述也很過時。記得在酒吧的

  對話有提到，諾拉一定要移民才能完成夢想。看到這邊我內心忍不住吐槽，明明現在老美

  愛韓劇愛成什麼鬼樣，是活在平行時空？（當然劇情中最後一個時間線未必是我們現在的

  時間線，但是Kpop也紅很久了欸。）這種描寫是很標準的亞裔美國人回來看亞洲，覺得啊

  雖然移民很辛苦但還好我移民了。而且說真的這套論述也已經過時了，是我在美國遇到韓

  國阿嬤會在說的那套 XD 現在看到更多的是亞裔美國人「回」亞洲探索，甚至是直接移居

  回來的。如果諾拉能做點這樣的掙扎（在美國發展不好，同時韓國的文學跟戲劇正在進步

  ），或許會更飽滿一點。


  其實我可以理解導演想要表達的訊息，就是當一個人選擇移民，注定要失去些什麼。電影

  的最後，諾拉放棄海聖，似乎也象徵她放棄了她對過往自己的最後一絲留戀。只是，作為

  一個也在美國發展但是常回台灣的人，其實我確實覺得「美國」跟「故國」不需要二擇一

  啊。其實，我平常讀很多亞裔美國文學的論述，都會感到非常的無奈，因為內容大概就是

  差不多：他們在美國不被認可，然後回來亞洲又格格不入，結果就是很多論調就是為了安

  慰自己只好說服自己啊離開亞洲「母國」是正確的，雖然嘴巴上沒說但是事實上就是渴望

  被美國白人認同。每次看到這種論述都覺得亞洲社會即是很多問題，但不是你們自我安慰

  的工具好嗎（嘆


  還好諾拉最後還是跟亞瑟在一起，我真的覺得他好可憐喔，雖然海聖是比較帥沒錯（大誤

  ）。





  --'
