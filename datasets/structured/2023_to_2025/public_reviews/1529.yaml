title: '[  雷] 之前的我們'
content: '防雷










































































  啊～一陣子沒看完一部電影通體舒暢的了

  劇情上多少有那麼一點灰色地帶的發展

  但從頭到尾都是以溫柔的手段去處理

  他很貼心的顧慮到每個角色的心情

  連同觀眾的感受都盡量照顧到（每個人道德標準不同）

  我們會真的聚焦在男女主角的錯過和遺憾

  而不是餘情未了又有所愛的爭議

  每句對白也都打動人心似的深入其中

  我最喜歡老公說女主角夢話都說韓文那段

  很能感覺到他的為難,身為一個丈夫

  要面對另一半的過去,又要不失風度的面對

  這是相當重要容易的過程,幸好他最後苦盡甘來

  沒想到A24出品的電影還有這麼情感豐富的

  老實說很意外,但也再次證明這間的能力

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  要是人生有五次就好了。

  這樣的話我五次都要住在不同的地方

  五次都要吃不同的東西吃的飽飽的

  五次都要做不同的工作

  然後五次都要，喜歡上同一個人


  --'
