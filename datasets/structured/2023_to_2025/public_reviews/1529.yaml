url: https://www.ptt.cc/bbs/movie/M.1691902723.A.AC6.html
title: '[好雷] 之前的我們-原來這就是有緣無分啊'
content: "原文 \n\n\n我想，這才是最貼近現實的「初戀電影」吧。\n\n初戀之所以美麗，命運之所以離奇，是建構在我們對於緣分的浪漫想像。第一個喜歡上的\n\
  對象就能長相廝守、失聯好幾年還能再重修舊好、建立多段關係後仍不敵最初的美好，這\n些故事需要極低機率的巧合才會發生，到最後只有緣份可以解釋如此難以解釋的初戀。\n\
  \n《之前的我們》故事描述諾拉與海聖是小時候的青梅竹馬，但因為諾拉家的移民，讓兩人\n的聯繫因此中斷。12年後兩人因緣際會在網路重新連繫上，之後又在24年後相約在紐約見\n\
  面，許久不見除了停不下來的敘舊，也討論起兩人曾經的可能性，那情愫的火苗悄悄地被\n重新點燃...\n\n（以下有雷）\n\n相隔24年才真的見上一面，就算大多時候都在尷尬的笑，但還是能夠感受到波濤洶湧的情\n\
  緒衝擊著彼此。只是他們都已經有自己的生活圈，就算知道眼前是個美好的可能，仍然沒\n有做出衝動的決定。諾拉沒有打算拋下丈夫，和海聖遠走高飛，海聖也沒打算放棄他的工\n\
  作，為了諾拉飄洋過海來美國。\n\n之所以說《之前的我們》是初戀最真實的樣子，是因為電影雖然建立在「因緣」的浪漫基\n礎上，但最後還是回到現實的考量來應對難以掌握的因緣，間接肯定了人生是因為不同選\n\
  擇造成的結果，而不是命運隨機的安排。\n\n電影前段皆是雲淡風輕，沒有像《愛在三部曲》那樣的風趣交流，也沒有像日本影集《初\n戀》那樣的深刻揪心，《之前的我們》將久別重逢的難得，在輕鬆的交談中化為千頭萬緒\n\
  ，又將這樣濃厚的情感壓抑成平淡。直到最後諾拉和海聖再次離別後，諾拉走回住處大哭\n失聲，電影就在這樣令人百感交集的畫面中結束。\n\n最後諾拉的大哭是為了什麼？\n\
  \n「如果兩個陌生人在街頭擦身而過，代表他們兩人之間，經歷過8000次因緣輪迴。」\n\n是因為被因緣捉弄而大哭嗎？在12年前諾拉第一次重新與海聖聯繫上時，兩人相談甚歡，\n\
  但因為海聖無法（或沒有打算）拉近地理上的距離，諾拉也有明確留在美國的目標，所以\n諾拉決定切斷與海聖的聯繫，放棄在視訊螢幕上的蹉跎。要是諾拉當時沒有決定斷聯，兩\n\
  人的關係會不一樣嗎？\n\n離別前海聖說了「到時候見」，說的是下個24年，還是下輩子？我想不論兩人關係是朋友\n還是戀人，要和能與自己心靈相通的對象，道出不知下次何時再見的告別，這樣的有緣無\n\
  份論誰都會感傷吧。\n\n「妳開闊了我的人生，而我是否也能開闊你的呢？」\n\n是因為怕做出後悔一輩子的決定而大哭嗎？若按照愛情電影的公式，或是聽從內心聲音做\n\
  決定的論述來發展，諾拉這時候應該跟著海聖回韓國才對，但她卻沒做出這樣的決定。\n\n24年後的諾拉雖然不如小時候那樣大放光彩，但也已經是個拿到綠卡、有了美國老公、想\n\
  拿東尼獎的美國人。小時候放學和海聖到了道別的路口時，相對於海聖是水平的往前走，\n諾拉是往高處走，暗示導演的立場認為移民是個相對「向上」的選擇。雖然諾拉在睡夢中\n\
  只會用韓文說夢話，在他內心最深處並沒有認同美國就是自己的家鄉，但在各種考量下她\n沒有任何理由回韓國。\n\n所以她和12年前一樣，拒絕因緣將海聖送到她身邊的「好意」，想到不可能再有第三次機\n\
  會，再次親手切斷緣份的她不免迷惘及感傷。\n\n「兩棵樹種在同一個盆栽裡，彼此也都需要空間。」\n\n還是因為覺得對不起亞瑟而大哭呢？亞瑟身為這段關係中的「第三者」，擔心自己走不進\n\
  諾拉的內心世界而學韓文，他害怕自己在命運中是個誰都可以替代的角色。他相信因緣，\n只是他怕的是自己在這輩子的因緣，比不上諾拉和海聖來的深。但就算如此，他還是讓諾\n\
  拉去見海聖，甚至還三人一起吃飯，讓自己被諾拉和海聖晾在一邊，經歷了這些他還是在\n最後接住了諾拉，讓她宣洩與海聖告別後的複雜情緒。\n\n雖然亞瑟像是個工具人，但我覺得他有著更高的思維，他知道自己有哪裡不足，但並沒有\n\
  因此沒自信，也沒有用自己的不足去限制或勒索別人，更是看開了一個人在命運中是如此\n渺小。亞瑟這個角色讓人體悟到，沒有得到的愛情總是最深刻，但卻不代表最珍貴，他可\n\
  能不是諾拉這輩子最愛的人，但卻是可以一起生活下去的人，這可能才是隨著年紀漸長，\n對於愛情的期望吧。\n\n「若是將這一世視為前世，那你覺得我們的來世，會是什麼樣的關係？」\n\
  \n在因緣裡有太多假設性問題，讓我們腦補了許多遺憾，甚至想到下輩子會是如何發展，但\n要是這真的就是最後一輩子了呢？《之前的我們》雖然有著美麗與哀愁，但若是能換個角\n\
  度來看，諾拉和海聖在多年後的彼此身上找回多年前的自己，就像找回曾經遺失的生命碎\n片一樣，讓自己可以更加完整地過完這輩子，這不也是因緣帶來的贈禮嗎？\n------------------------------\n\
  很好奇導演也叫Celine，那他有沒有受到《愛在三部曲》女主角Celine的啟發呢？\n\n\n\n--"
