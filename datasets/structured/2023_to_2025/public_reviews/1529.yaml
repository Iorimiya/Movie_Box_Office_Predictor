title: '[好雷] 之前的我們'
content: '很喜歡這部細膩的情感

  全片的節奏十分緩慢

  但也像兩人間的思念一般綿延

  導演利用長鏡頭 在固定鏡位的同時拉近鏡頭

  讓我們可以完全感受到人物表情的微小改變及複雜情感

  像是在男主角20年後到美國與女主的相逢

  男主角的手微微發顫、眼神恍惚

  再到抱著女主、眼裡充滿笑意

  這些細微的捕捉讓此刻的重逢顯得更加深刻


  而我最喜歡的是酒吧的三人談話場景

  導演十分高明的營造了三人略顯尷尬、卻勉強聊著天的氛圍

  在一開始男女主還是想要照顧著老公的心情，談論著一些表面話題，再由女主翻譯

  直到話題越發深入，漸漸地演變成只有男女主的談話

  談論著對彼此往事及前世因緣的話題

  很明顯可以看到男女主還是如此的契合，絲毫感受不到這兩人隔了這麼久沒聯絡


  很喜歡這部片所探討的身份、過去、愛情之間緊密不可分的關係，也讓我們確實地體會到

  了能在對的時間遇到對的人有多麼不容易，世界上不會有如果，不會有時光機，彼此相愛

  的兩人過了該交往的時刻，任誰也無法挽回。


  --'
