url: https://www.ptt.cc/bbs/movie/M.1707325925.A.159.html
title: '[情報] 《之前的我們》導演 A24 新片將由達珂塔強森、克里斯伊凡主'
content: '根據 Deadline 的最新報導指出，甫以首部長片《之前的我們》獲得奧斯卡提名的韓裔加

  拿大女導演 Celine Song 將再度與 A24 攜手合作新片《The Materialists》。




  《The Materialists》將會是一部浪漫愛情喜劇，由 Celine Song 繼續親自執筆電影劇

  本。目前劇情仍在保密當中，但據知情人士表示，故事似乎是描寫一位專業的媒人正在和

  一位有錢男子交往，但仍然對另一位兼職服務生又一文不名的小演員抱有情感。


  在演員方面，目前已經有多重量級明星正在洽談演出，包括即將帶來超級英雄電影《蜘蛛

  夫人》的 Dakota Johnson，卸下「美國隊長」身分後正積極尋找演員生涯新代表作的

  Chris Evans，以及近來以電視劇《最後生還者》創下事業巔峰的智利裔美國男演員

  Pedro Pascal。


  《The Materialists》除了 A24 之外，也再度由《之前的我們》背後的製作團隊打造，

  包括以該片獲得奧斯卡最佳影片提名，來自製作公司 2AM 的 Christine Vachon 與 Pam

  Koffler。


  《The Materialists》即將在柏林影展的歐洲市場展上尋找國際買家，目前已經成為了熱

  烈討論的項目，而該片瞄準在今年春季開拍。




  --'
