url: https://www.ptt.cc/bbs/movie/M.1723774370.A.B3F.html
title: '[好雷] 之前的我們Past Lives'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  《之前的我們》在院線的時候，就看到不少人好評推薦，並且一週比一週多。當時看了很

  多次預告，都沒有任何心動，總覺得故事對我來說少了點吸引力。又看到許多好評都拿「

  因緣」詮釋展開，心裡覺得實在膩。


  放了好久，久到室友忽然訂了車庫。無聊的平日晚上，《夢想集中營》太悶、《破墓》片

  長太長，這部片閃過眼前，片長兩小時內，堪稱完美。


  第一幕，那個聲音從問觀眾，你覺得他們三人什麼關係？整個興趣都來了。接著進到回憶

  ，不拖也不煽情，把人生前半分成三個十二年，然後靜靜地拍兩人關係在時間之中流變。


  說是愛情嗎？是，也不全是。是愛情的部分大概就是第二段，不是的部分是其他全部。而

  最令我印象深刻的是留在韓國的男孩長大成人，往紐約找長大成人的女孩，說起自己是獨

  子，沒有更多錢和地位不能結婚。


  他們之間的對話不多，不像是真有什麼火花，要也是純然喜歡的情感。男子第一次是因為

  當兵時想起女孩，第二次是因與論及婚嫁的女友分開想起女孩。從他們少少的話中，可以

  感受到女孩清楚知道自己要的是什麼，勇敢向前進，逐夢踏實，而男孩喜歡上的是她那樣

  的特質。多年前他沒法說什麼，多年後他仍無法說。


  作為一個看故事的人，我不能不去想這對於韓國社會或思想對比於美國（也許還有加拿大

  ）社會與思想之間的落差。女子跟丈夫說男子是非常韓國的韓國人，跟他一起時，總覺得

  自己沒那麼韓國，又好像更韓國一些。


  亞裔美國人近年正夯，原以為這片就是一部類似這樣那樣的愛情故事。沒想到全可連上亞

  裔美國整體討論的範圍中去想：移民第一代的心境，與見證移民第一代人的感受。


  女子跟男子說，她已經把小女孩留在男孩那裡。男孩長大成人，來找的她，已經不是原本

  那個女孩。移往多倫多，再移往紐約，結了婚，拿到綠卡，成為美國人。韓語只有用在媽

  媽與兒時玩伴對話與夢中，英語才是她熟悉的日常。男子則是中規中矩，當了兵，讀完書

  ，學了工作會用到的中文，交了女友，論及婚嫁時仍住在家中。兩個人的人生，美加與韓

  國的人生，不是哪個比哪個好，而是每個人有自己的路。走著走著，也許還能刻意的見面

  ，但見了更明白，過去就像夢或是說前世一樣。在這一世，他們就是只能如此。最後男子

  說，來世再見。



  ****


  這裡是我的樂園:




  --'
