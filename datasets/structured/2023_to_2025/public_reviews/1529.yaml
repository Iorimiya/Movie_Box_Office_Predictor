url: https://www.ptt.cc/bbs/movie/M.1693677964.A.8F2.html
title: '[普雷] 《之前的我們》-膚淺的因緣 '
content: 'A24的文藝愛情片!

  一個月前上映過

  普遍評價不錯

  個人稍微有些反指標的觀點

  參考參考





  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  吐槽的點還不少。基於自己小學沒有啥青梅竹馬，加上當時孩子沒智慧型手機比較晚熟。

  無法感受那種幼時的愛情會有多令人深刻，以至於長大成人還牢記於心，乃至於12年後藉

  由視訊見面那樣的情愫很讓人不可以思議。



  即使上述是個人主觀意見，整個來看以導演小時候從韓國移民到西方社會的經歷的自傳性

  色彩，觀點還停留在淺薄的文化差異，東方文化西方詮釋，愛情電影中談論「因緣」，直

  接跳到輪迴因果變得有點賣弄與尷尬，大概就是什麼：十年修得同船渡、百年修得共枕眠

  那類像是喜餅廣告的說詞。如此過於表象的宣稱，劇情只是在糾結於當初怎樣會怎樣，一

  直膠著在情感上緣分，聽起來好像是朋友跟別人分手安慰的話那類。



  也許《之前的我們》畢竟還是愛情電影，就算那片名帶有宗教意味past live：前世，只

  不過是自己畫錯重點。也所幸電影良好的技術層面，韓國演員的演技拿捏得宜，掌握東方

  溫柔含蓄的調性，寫實直球對決（不以片中提及《王牌冤家》消除記憶的技術）。12年後

  結構設計的淡淡情感，雖然最近剛好看了《非甜蜜生活》（Tre piani）用了「五年後」

  的劇本結構。但相對《之前的我們》劇本以12年為生命週期，於是電影今生中意味著12年

  前世可以讓人直接明白理解也算是高明。



  也許真的不用太嚴格看待《之前的我們》，即使算是很懷疑那種一直保持聯絡的同學，意

  味著自己那些過往太多已不在聯絡的朋友，哪有甚麼前世今生，也許擦肩而過的陌生人之

  間才是自己看待人與人相遇最深的情感。



  很久以前去參加喪禮，聽過一句話，因為上輩子怎樣怎樣，這一輩子才會在一起變成家人

  ，這些安慰死者親人節哀順變的話，如今覺得又好像隱隱透露出，每個人本來都是獨立的

  生命這一回事。（註）




  （註）引用之前寫的文章末段



  --


  拉特飯 - 以商業力量進入獨立市場

  (剛搬家內裝待修)


  --'
