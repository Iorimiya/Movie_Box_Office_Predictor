url: https://www.ptt.cc/bbs/movie/M.1691158944.A.6F7.html
title: '[影評] 今年最催淚的電影《之前的我們》：後來的'
content: '影評｜今年最催淚的電影《之前的我們》：後來的我們失去了彼此，也沒有達成夢想


  04 Aug 2023 | by Billy


  繼《媽的多重宇宙》、《我的鯨魚老爸》後，美國獨立製片娛樂公司 A24 迎來新作《之

  前的我們》（Past Lives），這部電影在國外上映後引起廣大迴響，並創下不錯的票房成

  績，影評網上的評價都在水準之上。如今，這部電影在台灣 8 月 4 日正式上映，值得你

  走進戲院。這或許是，你今年看過最催淚的電影。







  一段跨越二十年的愛情故事




  《之前的我們》由韓裔美籍劇作家席琳宋（Celine Song）編劇兼執導，找來韓裔美籍女

  星葛麗塔李（Greta Lee）飾演女主角「諾拉」（Nora）、韓裔德籍男星劉台午飾演男主

  角「海成」（Hae Sung）。劇情描述，兩個失聯的「青梅竹馬」朋友，長大後，重新聯繫

  到彼此，並展開一段跨越二十年的愛情故事。




  這部電影被定調為「浪漫劇情片」，沒有花裡胡哨的視覺衝擊，卻帶著一抹淺淺的美麗與

  哀愁，很多人事物被輕描淡寫著，但畫面與台詞卻如此深植人心。看完，後座力極強。直

  接電影結束、戲院的燈光緩緩地明亮之際，這才意識到，眼淚已經不自覺地流下。因為你

  會在主角的身上，看見那一個「自己」…


  說「再見」以後，就是「兩個世界」了




  諾拉和海成從小就生活在一起，每天一起走路上下課，直到有一天，諾拉要和家人移民、

  離開韓國，讓她不得不與海成分開。懞懞懂懂的海成，根本還不知道什麼是愛，他背著書

  包和諾拉一起走回家，他知道那是最後一次，但全程低著頭，不發一語。離別前，他僅僅

  說了「再見」。而後，就是「兩個世界」。




  十二年後，諾拉和海成透過臉書聯繫上彼此，兩人透過視訊聯繫彼此，但這段關係並沒有

  持續很久。諾拉毅然地決定停止與海成斷開聯繫，希望更專注於自己的「夢想」上，不想

  要老是守在螢幕前面，苦苦等一個人。然而，時序又經過了十二年，諾拉結婚了，但對方

  不是海成，而是一位名叫「亞瑟」的作家。


  後來攜手共度餘生的人，是真的愛嗎？




  《之前的我們》環繞著一個核心的理念：因緣（意旨，前世羈絆的概念）。如果一個人遇

  見某一個人，即使只是短暫的時光，也意味著雙方在前世，曾見過彼此。如果兩個陌生人

  在街頭擦身而過，代表他們經過八千次「因緣輪迴」。若是兩人最後可以結婚，是經過了

  八千世、穿過八千層因緣才來到彼此身旁。




  但後來，攜手共度餘生的那一個人，真的是最愛的那一個人嗎？亞瑟告訴妻子諾拉：當她

  在入睡時，說得夢話都是在講「韓語」。那是他不了解的語言 ，也如同他始終到不了諾

  拉的內心世界。即使諾拉嫌棄長大後的海成，完全像個普通的韓國人，但事實是，就算拿

  到「綠卡」的諾拉，骨子裡依舊是韓國人。


  這部電影不談遺憾，而是「真實」人生




  看完《之前的我們》，不禁想起另一部電影《樂來越愛你》（La La Land），都在談因為

  「夢想」而分開的兩個人。但《之前的我們》描繪地更接地氣。事實是，後來的我們失去

  了彼此，也沒有達成夢想。諾拉一開始想拿諾貝爾奬，之後，又說想拿普立茲獎，但最後

  什麼都沒有拿到，更不知道夢想是什麼了。




  海成最後笑著告別諾拉，但諾拉轉身後，卻哭了出來。兩個人這次說再見，應該是再也不

  見了。《之前的我們》沒有開放式結尾，更像是你我真實的人生。我們都錯過了，也盡力

  了。然後，我們選擇回到彼此的生活、各自安好著。現在的我們過得幸福嗎？或許，人來

  到了某一個階段以後，只想追求平穩罷了。


  Source：之前的我們／車庫娛樂






  Bella 儂儂



  --'
