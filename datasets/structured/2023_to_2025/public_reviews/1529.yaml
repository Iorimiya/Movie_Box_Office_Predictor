content: '根據 Deadline 最新的獨家報導指出，SONY 已經買下了全球除了日本、中國、俄羅斯和美

  國以外的發行權！


  SONY 很快的以 8 位數的高價包價以《之前的我們》入圍奧斯卡的導演 Celine Song 的這

  部浪漫喜劇新片《Materialists》的國際版權，也就是屆時台灣的發行權也在 SONY 手上

  。


  ---


  以這部片的卡司看來，只要評價沒爆的話應該是會正常上映的吧？


  就算 SONY 自己不發，我自己最近觀察發現，如果我沒判斷錯誤，SONY 有在和本土的獨立

  片商合作發新電影。包括阿莫多瓦的《荒漠斷背情》和盧貝松的《人犬》似乎版權都是 SO

  NY 的，但他們沒有親自處理台灣的院線發行，而交給傳影，但他們還是會在粉專協力宣傳

  。也有可能是這幾部片在台灣 Theatrical 是被分開的原因，被傳影買下？


  不管怎樣總之樂見，總比被丟到影展只放個兩三場，或是直上串流好（看像某U）





