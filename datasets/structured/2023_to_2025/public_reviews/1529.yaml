title: '[好雷] 沒有我的遠方：《之前的我們》'
content: "本文涉及劇情，推薦觀影後再讀。\n\n\n\n　　　　圖文網頁版：\n\n　　　　\n\n\n　　　　預告片：\n\n　　　　\n\n\n\n\n\
  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\n\n你想前進的是沒有我的遠方：《之前的我們》\n\
  \n\n\n　　在買電影票時，我一時忘了片名，抬頭往上看才確認。看完也就知道：\n\n他們只有之前，沒有之後。\n\n\n\n　　《之前的我們》（Past Lives）由韓裔美籍導演席琳宋（Celine\
  \ Song）\n\n初次執導，鏡頭、細節與對話有著驚人的細膩，比起愛情，或許更接近導演\n\n將移民經驗的得與捨，梳理出回首故土的不得與不捨。電影的開頭，是餐廳\n\
  \n裡的兩名客人，猜測海聖（劉台午飾）、諾拉（葛莉塔．李飾演）與亞瑟\n\n（約翰．馬加羅飾）之間的關係：宛若翻譯的諾拉，與海聖談得熱絡，亞瑟\n\n卻只像帶他們來此的導遊；或者是聚餐的同事，或者，亞瑟是他們的美國朋\n\
  \n友……即使是外人也看得出他們親疏難辨、似親實疏的關係，而三角關係最\n\n有趣的，就是看他們之間的距離，以及決定距離的位置。\n\n\n\n　　如今回想起來，那是跨越時空的重會：海聖和娜英在過去（Past\
  \ Lives），\n\n諾拉與亞瑟在現在。\n\n\n\n　　看完之後我一直在想：海聖和娜英，究竟算不算戀愛過？怎樣又算「戀\n\n愛」？向來安慰娜英眼淚的海聖，卻為她落到第二名而哭感到氣憤的時候嗎？\n\
  \n當他們在兩位母親的允許下第一次約會，在公園遊戲區臉對著臉的裝置藝術\n\n遮擋大半身體，娜英知道「他喜歡我」而海聖也知道「我喜歡她」，卻總是\n\n只能看見彼此一部分的時候嗎？又或者是在娜英與父母移民前選好名字，最\n\
  \n後一天一起回家前的路口，海聖捏著手上的球，末了只能說「再見」，讓娜\n\n英往上離開，從此分隔兩路的時候嗎？\n\n\n\n　　當他們時隔十二年在網路上恢復聯絡，因為新奇分享各自生活的大小事，\n\
  \n直到新鮮褪去，距離成了距離，時差再難憑意志獲得聯繫，諾拉不願回韓國，\n\n海聖無意來紐約，最後只能答應暫時不要聯絡的時候嗎？\n\n\n\n　　年少的娜英什麼都想要，不惜搶妹妹施晗選好的名字，父親給她覺得更\n\
  \n好的「諾拉」才願接受──海聖在她心裡，始終不是「更好」的。他們的兩\n\n次分別，為的都是他們無法到達一個共有的未來，也無意改變所有的現在；\n\n在二十四年後的相聚，則因他們共有的過去已經太過遙遠，對諾拉來說更是\n\
  \n恍如前世，畢竟她經過兩次移民才來到紐約，獲得想要的作家工作，提早結\n\n婚才取得了綠卡，年少的雄心壯志早已在其筆下「漫長的腐朽旅程」、以一\n\n生付出代價的移民裡銷磨成平凡，曾想在美國獲取諾貝爾獎的娜英，今已自\n\
  \n覺是「來自韓國的女孩」諾拉，與丈夫亞瑟的生活，則是如同種在同一個盆\n\n栽的兩棵樹，樹根各占空間而不免產生磨擦，看似平凡，卻是能向彼此坦承\n\n的婚姻關係，他們不需要去看自由女神像，因為美國就是他們共同選擇的生\n\
  \n活。而海聖，在十二至三十六歲，留在他心中的始終是「韓國關不住雄心壯\n\n志」的娜英，是他追之不及、也從未真正追趕的對象，是他保留在心底、只\n\n有他能照顧的十二歲愛哭鬼。電影裡我印象最深的畫面，是海聖成年後常來\n\
  \n紐約，卻屢遇暴雨，當他終於遇到晴天，諾拉也終於能赴約時，鏡頭從下而\n\n上的是臨池的綠植倒影──雨終於停了，海聖終於遇見了諾拉，但他看見的\n\n仍然是倒映在池上，他心裡的娜英；他嚮往的自由女神，則在此次相見後，\n\
  \n才看到他過去看不見的背面陰影。\n\n\n\n　　也許人生就是這樣，無論是諾拉或海聖，都在反覆回憶時清楚知道當初\n\n為何沒有選擇對方，正因曾經想要，才在生命裡留下捨／不得的獨有痕跡，\n\
  \n一如海聖假設的如果，始終是娜英不想要在韓國度過的人生；海聖是不跟女\n\n友吵架的「理想主義者」，即便在對的時空遇到的女友，最終仍因自己太平\n\n凡，她應該「找條件比我好的人」而分手，一再為相同的魔咒所囿。諾拉因\n\
  \n為有失，才能有得，她無意替換她的得失；如果一開始就明知不得，卻若有\n\n所失，就會像海聖那樣留在原地，徬徨踟躕吧。\n\n\n\n　　海聖眷戀的是曾在他身邊的娜英，他不曾來到二十四歲的文諾拉身邊，\n\
  \n三十六歲才終於看見面前的她，卻一如小學唯一的約會般只有片面，只是過\n\n去的他看不到她的未來，現在的他看不到她的曾經。即使仍然極力去找「你\n\n都沒變」的證據，也不能不意識到，那不再是他深愛的女孩。而娜英，則是\n\
  \n在無數次的追尋、什麼都想要卻只能緊緊把握來到身邊的可能後，那些她最\n\n早放棄的、故鄉的回憶，就只能在夢迴重見；海聖是從那個故鄉之夢裡走出\n\n來最完美、且仍然在乎她過去的投影，但即使那個投影是她的來處，她也從\n\
  \n不願走回頭路。對她來說，亞瑟已是她用盡一切努力所得到最好的歸宿，是\n\n能擁抱她過去的現在，她甚至比海聖清楚他拒絕看見現在自己的平凡，那又\n\n怎麼能捨下一切回到她不再想要的過去？\n\
  \n\n\n　　電影裡以「因緣」解釋所有的相遇與牽繫，但如何延續這份牽繫，終究\n\n來自各自的環境與選擇。或許娜英與海聖的初戀曾有過一無所求的純粹，但\n\n\
  在選擇所求的那一刻早已消止，年少的眷戀只能留在前世，長成後的抉擇是\n\n磨過稜角的自己，並和過去好好道別。未來還能如何？「到時候再見。」故\n\n而這一刻諾拉的眼淚，只能由身邊的亞瑟擁抱了。\n\
  \n\n\n　　畢竟我們能珍惜的，只有已然經過選擇的現在。\n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\
  \n                                  陳斐雯  貓蚤札（其三）\n\n--"
