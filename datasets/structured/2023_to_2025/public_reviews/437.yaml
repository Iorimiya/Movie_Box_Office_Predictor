url: https://www.ptt.cc/bbs/movie/M.1743593806.A.7C6.html
title: '[負雷] 曼谷淪陷'
content: '千萬不要被中文片名騙了


  英文片名是 Home sweet home


  中文片名是曼谷淪陷


  兩者質感差真大


  畫質不清晰  內容過度跳很大  連接處理沒有很好  讓人一頭霧水


  還有可以看到很多電影的"影子"  什麼奇異博士 進擊的巨人之類設定


  演員演技不太順  讓人觀影體驗常常出戲


  而且裡面常常有很多奇怪的地方


  總之  imdb 我覺得大概會落在4.5分到2.5分之間


  優點就是  =.= 等等想到我再補充!!


  我承認我是被中文片名騙去看得




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  最後面  奶奶歡迎小女孩跟媽媽回家的臉  我還以為世界和平


  畫面跳轉進屋內  又不是這麼一回事


  演技真的要有特別指導


  小女孩一直提到外婆  我老覺得這是小紅帽嗎!



  --'
