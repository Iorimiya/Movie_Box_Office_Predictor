title: '[爛雷] 曼谷淪陷 該改名叫錢包淪陷'
content: '‧


  很難得在散場後的電梯裡，都是同場的觀眾，全部異口同聲都覺得爛到崩潰，也完全不知

  威視電影進片到底有沒有先看過，進這種片是在開觀眾玩笑嗎？今年目前在院線看了快50

  部電影，曼谷淪陷絕對是我心中截至今天，不分類排名的最爛片。


  完全魔改了Home Sweet Home這款評價還算不錯的恐怖遊戲，更精確來說就像是款極爛的

  換皮免洗遊戲，劇情中只有少數內容才有跟遊戲掛上鉤，其他完全是亂拍、亂演，看得我

  白眼翻到出入口，煩躁到整場嘆氣到快缺氧。



  ‧


  每個演員演技都有夠生硬，唯一就只有小女孩顏質很精緻可愛，特效上就普普通通，其他

  無論剪輯、劇情、音樂，完完全全是下等貨。


  先說角色之一的僧侶，雖然也是在遊戲裡出現的角色，算是被動性隊友，但電影一副看起

  來要營造出是曼谷奇異博士或是泰國古一大師那樣，但實際上就是跟電玩一樣的指路人，

  用一句「我被禁止使用暴力」來解釋他的能力不能在電影中使用，OK我接受，但畫面一轉

  ，我靠！居然拿拐杖在打惡魔，你當這立法院啊？還是惡魔沒人權？說好的不能用暴力呢

  ？


  再來就是雙標爸傑克，商場發生槍擊事件，在那邊聖母心要拯救大家，拋棄自己妻女；等

  到整個事件發生後，知道了自己是救世主、地獄守門人，又在那邊靠北為什麼是他？你剛

  剛的聖母心是放在商場置物櫃裡了嗎？終局時，還對自己妻女說「我害怕愛人，所以沒有

  陪伴你們」之類的話，WTF！？要不要聽聽自己說了什麼？這根本渣男廢爸軟爛丈夫的語

  錄吧！


  太太也是莫名其妙，一場由上往下打的手扶梯戰，你居然先把女兒從旁邊坐溜滑梯先滑下

  去，然後被圍攻，自己在上面慢慢打下去，女兒一定不是親生的是吧？不是應該讓她躲背

  後在行動嗎？


  在公車橋段，一位大叔救妳一命，妳卻連演都不演一下，至少假裝要去救，然後被阻止才

  不得不放棄吧，門關了整車高歌離席；然後公車上的阿婆臨演，可能是沒領到便當，神情

  就好像只是遇到曼谷塞車的狀態，阿婆！曼谷炸成那樣，喪屍跑成那樣，演一下啦幹！


  最後是最終Boss，「死於話多」就是最好的例子，都要殺了主角女兒完成祭祀了，還在等

  其他人打好打滿才要開始，這段時間都可以捅個200刀了，能力也是鳥到不行，瞬間被秒

  殺退場，果真有其父必有其子，對了前面說的僧侶就是他兒子，真是一家廢了兩代。


  劇情的最後感覺還要拍續集，最後出現的女生，大概率是長大的女兒，但靠北就這樣突然

  出現沒解釋就進Roll card，我滴媽！


  ‧


  曼谷淪陷完完全全是一部世間大爛片，雖然有出現電玩裡的美工刀小姐姐、巨餓鬼、泰舞

  人像等，但完全背離魔改了電玩劇情跟元素；什麼曼谷淪陷，是觀眾的錢包淪陷才對啦！


  我推薦大家去看，從此不怕再看到其他爛片。



  ‧



  追蹤茶太郎IG



  --


  補充一下，查了一下才知道男主角是納尼亞傳奇的大哥；然後據說此次電影劇情是電玩之

  後出第三代的劇情改編。'
