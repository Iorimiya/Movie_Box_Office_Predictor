title: '[新聞] 《淨化論》還原歷史最驚悚會議'
content: "《淨化論》還原歷史最驚悚會議\n\n04:10 2023/06/17 中國時報 李承陽\n\n\n《淨化論》是影史上第3度改編真實存在的納粹「萬湖會議」。（海鵬提供）\n\
  \n為喚醒世人對80年前影響歷史重大的「萬湖會議」記憶，德國兩大製片廠聯合製作了一部\n全新驚悚電影《淨化論》。劇情由15位舉止優雅、穿著帥氣的德國納粹高階菁英，陸續進\n\
  入位於柏林萬湖區的一棟豪華別墅展開，全片不見一具屍體、一滴血，他們只是喝著咖啡\n、輕鬆聊天，隨後便將全歐洲為數1100萬的猶太人送進了地獄。\n\n片中展示一種可怕的邪惡，揭露什麼叫做「人性與惡最近的距離」，與會15名納粹高官，\n\
  無一不是菁英，其中3分之2來自法律界，擁有博士頭銜更達8人，他們本該以自己的學識\n與邏輯思維，捍衛法律公正、社會正義，卻不論是非成了納粹幫凶，主動獻計獻策，想盡\n\
  辦法把殺人做得「漂亮」，討論過程讓人不寒而慄，片中還原這場史上最驚悚會議，呈現\n納粹對猶太人屠殺高度細化的分工。\n\n將於21日上映的《淨化論》，全片都在柏林拍攝，有些關鍵戲更直接在「萬湖會議」別墅\n\
  原址，現今的大屠殺紀念館實景拍攝，劇情核心則鎖定該場90分鐘的會議，並嚴格要求全\n體演員的演出默契，才完成這部極其特殊的電影。\n\n電影導演導演馬蒂格諾勒克形容：「最讓我震驚的，是這些與會者並沒有任何良心或道德\n\
  上的顧慮，他們實事求是進行這個流程、像是在開一場『生產會議』一樣，充滿了高層之\n間的合作、時間周期的約定、對受害者的圈定，以及對可接受的謀殺方式的討論等。」\n\
  \n特別的是，馬蒂格諾勒克有訂下一個準則，就是這部電影裡必須沒有任何音樂，「音樂具\n有煽動性，透過音樂，你可以嚴重影響觀眾的感受，這就是為何音樂是如此的危險，但同\n\
  時又非常有利。」不希望透過音樂操控觀眾的情緒。\n\n#驚悚 #萬湖 #音樂 #觀眾 #納粹\n\n--\n佛教經典的\n是 是菩薩成佛之道\n       \
  \ 是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
