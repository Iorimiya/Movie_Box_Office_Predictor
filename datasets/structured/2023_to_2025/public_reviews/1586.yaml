url: https://www.ptt.cc/bbs/movie/M.1685892815.A.484.html
title: '[新聞]《淨化論》獲德總統推讚還原史上最驚悚會議'
content: '《淨化論》獲德總統推讚 還原史上最驚悚會議


  15:16 2023/06/04 中時 翁紫曦



  《淨化論》在「萬湖會議」別墅原址實景拍攝（海鵬影業提供）



  《淨化論》有些關鍵戲直接在「萬湖會議」別墅原址－現今的大屠殺紀念館實景拍攝（海

  鵬影業提供）



  《淨化論》參與拍攝演員均為德語影壇一時之選，奧地利男星菲利普霍賀麥爾（Philipp

  Hochmair



  右）更獲法國影媒盛讚「演技精湛出色」（海鵬影業提供）



  《淨化論》敘事冷冽驚悚被奉為「神片」獲德國總統史坦麥爾（Frank-Walter

  Steinmeier）掛保證是「最精確的版本」（海鵬影業提供）.jpg


  為喚醒世人對81年前影響歷史重大的「萬湖會議」記憶，德國兩大製片廠「全球銀幕電影

  」與「康斯坦丁電影」，聯合製作了一部全新驚悚電影《淨化論》。該片劇情由15位舉止

  優雅、穿著帥氣的男士，陸續進入位於柏林萬湖區的一棟豪華別墅展開，他們個個來頭不

  小，全都是納粹德國的高階菁英。全片不見一具屍體、一滴血，他們只是喝著咖啡、輕鬆

  聊天，隨後便將全歐洲為數1100萬的猶太人送進了地獄。《淨化論》連霸德國電影三週口

  碑榜首，除敘事冷冽驚悚被奉為「神片」，更連續勇奪包括德國古恩特榮巴赫電影獎、西

  班牙巴塞隆納聖喬治電影節、奧地利羅米獎、歐洲歐羅巴獎，以及德國公民媒體獎等5座

  最佳影片大獎，獲國際媒體【Stuff】盛讚為「今年最好看的電影之一」。


  這部由德國名導馬蒂格諾勒克所執導的驚悚片《淨化論》，是影史第三度改編「萬湖會議

  」的電影。該片劇本基於當年「上級突擊大隊長」阿道夫艾希曼不慎遺留的關鍵史料「萬

  湖會議機密紀要」所改編。參與拍攝演員均為德語影壇一時之選，其中飾演國安部長海德

  里希的奧地利男星菲利普霍賀麥爾優雅迷人、不怒而威，不僅獲法國影媒【Cinedweller

  】盛讚「演技精湛出色」，更一舉擊敗入選奧斯卡電影《愛你讓我自由》兩大演技巨星法

  蘭茲羅戈斯基及喬治佛瑞德區，榮登奧地利羅米獎影帝寶座。


  《淨化論》全片都在柏林拍攝，有些關鍵戲更直接在「萬湖會議」別墅原址－現今的大屠

  殺紀念館實景拍攝，劇情核心則鎖定該場90分鐘的會議，並嚴格要求全體演員的演出默契

  ，才完成這部極其特殊的電影。片中展示一種可怕的邪惡，與會的15名納粹高官，無一不

  是精英，其中三分之二來自法律界，擁有博士頭銜更達8人。他們本該以自己的學識與邏

  輯思維，捍衛法律公正、社會正義，卻不論是非、成了納粹的幫凶。片中他們頭腦靈光、

  積極創新，熱切討論、主動獻計獻策，想盡辦法把殺人做得「漂亮」，討論過程讓人不寒

  而慄，獲德國【週日世界報】誇讚「題材宏偉地令人清醒」。


  電影《淨化論》戰慄還原了這場史上最驚悚會議，片中呈現了納粹對猶太人屠殺高度細化

  的分工，除獲德媒【法蘭克福匯報】讚嘆「拍攝手法精準驚人」，連德國總統史坦麥爾看

  完都掛保證是「最精確的版本」，推讚是場「成功的演出」。當一個民族可以瘋狂仇恨另

  一個民族到這般地步；當人類為了一己私慾，可以輕易放棄底線和原則；當溫和善良的普

  通人，在得到不受約束的權力後，可以變成殺人猛獸…。隨著科技進步，只要按下按鈕，

  便能輕易奪走千萬人的生命。「萬湖會議」三度被拍攝成電影《淨化論》，有種令人驚恐

  的現代性與當代性，除提出對歷史更深遠的注視與警惕，也對現今世界局勢有著敏銳超前

  的反思與儆醒，將於端午連假6月21日起全台驚悚上映。


  中時



  --'
