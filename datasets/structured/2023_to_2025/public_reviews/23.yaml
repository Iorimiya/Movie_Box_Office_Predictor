url: https://www.ptt.cc/bbs/movie/M.1762858499.A.1A6.html
title: 很推自殺通告內容有劇透
content: '#自殺通告

  #黃秋生

  #自由

  #社會只選擇優秀的人

  #沒有人在乎孩子的健康快樂

  一分鐘前看完了自殺通告，其實感觸很深，劇中演學生會長的男同學台詞真的醒思，“哪

  一次不是比誰優秀”，一群考生為了考好成績，未來出社會有好工作，所以私下吃了所謂

  聰明藥，就是能讓注意力集中能提高成績，但副作用就是不能睡覺不能吃飯尿多等等傷害

  身體健康的藥，劇中身為校長的黃秋生跟另一名女老師非常反對這種行為，強制在考試前

  驗尿，劇中演學生會長的男同學說，幼稚園考試，小學考試，國中考試，高中考試，大學

  考試，為了進好公司，哪一次不是比較誰更優秀，一星期內校內死了兩個同學，沒有學生

  覺得有問題，還是決定要吃聰明藥考試，劇中一開始時有一位小孝老師因為是D班輔導班

  的老師，為了保住飯碗也是吃各種憂鬱症安眠藥讓學生們吃藥，但是他沒有逼迫學生們吃

  聰明藥，但劇中校長黃秋生非常生氣，覺得這樣不公平直接要開除他，劇中第一個自殺品

  學兼優的女學生，拿了空針注射空氣自殺了，留了一封信給劇中另一個夢想當農夫的孤兒

  同學，信件內容也真的心酸，她說她從小到大都是第一名等等，但她沒有未來的想法是一

  個空殼，所以反而羨慕成績不好的孤兒同學，早就知道自己愛花花草草要當農夫，而她全

  家人都是醫生，所以她也要當醫生，但為甚麼要當醫生她也不知道，另外有一個被霸凌的

  過動症學生，因為成績不好也時常被捉弄可以加時間考試，在大考的當天因為要求不加時

  考試，但他真的寫不完考卷，直接在大考當天拿著沒寫完的考卷直接跳樓，他的死最讓我

  遺憾，因為他過動症成績被分在D班，也只有小孝老師關心他，而且全班甚至全校700多人

  都知道他被欺負，但沒有一個人對他被霸凌時伸出援手，總之我算非常推這部電影，雖然

  看完心情略沉重，且現實社會就是這樣，什麼都是要最優秀的，健康快樂長大什麼的真的

  是廢話和幻想，整片都是講國語不是廣東話，本來想說黃秋生普通話再怎麼好，也沒辦法

  演出母語廣東話的fu，但看完電影直接被打臉，孩子們學生們健康快樂長大雖然重要，但

  出社會的現實真的就是要優秀才能生存，我只能說電影理念是好的，但真的不切實際。



  --'
