content: '優點：


  整體氛圍不錯，壓抑灰色


  故事流暢好懂，反轉有驚豔到，不牽強


  老師林予晞、學生會會長演超棒


  缺點：


  全片場景沒幾個，有些設施有一點假


  白潤音演技堪稱災難，尷尬到不行；黃秋生演出不慍不火，平平板板


  講的是教育界常常在討論的議題，有點老掉牙，部分橋段又用力過猛偏浮誇



  整體評分：6.8/10


  娛樂性尚可，演技參差與題材老套扣點分


  是不糟糕也不會到太精彩的片子


  -----

  Sent from JPTT on my Samsung SM-A5660.


