url: https://www.ptt.cc/bbs/movie/M.1763033925.A.218.html
title: '[好雷] 自殺通告'
content: "一個人去看了《自殺通告》。\n\n在升學壓力下的老師與學生，各有不同的處境與煩惱，看完覺得很沉重，也覺得發人省思\n，想為它留下一點什麼，因為議題很多，所以以角色來撰寫感想，以下有雷，慎入。\n\
  \nMiss Tien–身為菁班導師的Miss Tien，一開始是如同機器人一般的存在，符合iSmart好\n老師的定義，會教書，把學生的成績推向極致。但是，這個機器人的面具隨著劇情推演一\n\
  步步的崩壞，首先，她有個不適應升學制度的女兒，其二，當梁珮晴看了自殺通告想找她\n聊聊時，她正在與國外的學校面試，因此拒絕了學生提出的邀請，梁珮晴在隔天升旗時自\n\
  殺，Miss Tien看著珮晴被收乾淨的鐵櫃，非常、非常懊悔自己沒有接住學生。得知同事\n高宏孝老師為了讓學生進步而給予學生藥物，她知道是不對的，而越來越鬆動了。過動症\n\
  學生李恆對她喊著：「我就是過動兒。」她重複說：「你是李恆、你是你自己。」我們可\n以看到Miss Tien已經再也隱藏不了她的人性，因此當李恆墬樓，董事會仍要舉行終考時\n\
  ，她激動地喊：「如果可以救一個學生，停止終考不值得嗎？」這是老師的困境，什麼是\n好老師？當老師也要被系統評價、依得分決定去留的時候，他們會專注於自己的分數，還\n\
  是學生的心理健康？我覺得Miss Tien這個人物是有層次的，那個接不住學生的懊悔，非\n常明確及令人痛心。而學生的求助通常是很幽微的。\n\n高宏孝─一開始看起來人性化的老師，不一定是真的好老師，我覺得劇中一直在製造這種\n\
  類似的衝突。阿孝關心學生是真的，但是他拚了命也要把輔導班(D班)的學生的成績救起\n來，不惜給他們藥物也是真的。他希望D班的成績有救，可能不是為了學生，而是為了自\n\
  己的生計，因為他真的需要這份工作。他知道自己的做法不對，但他別無選擇。他說他跟\nD班的學生一樣，就是能力不足，這是他的困境及悲哀。\n\n莫哲瑋─學生會會長，賣「聰明藥」給同學。他是那種典型不需要擔心成績的學生，即便\n\
  同學吃了聰明藥也追不上他的程度。他賣藥，因為他自以為是救世主，他要幫忙這些同學\n，讓他們專注力提升，好應付一天又一天的考試。我覺得全片最慘的人就是他，他已經徹\n\
  底淪為考試機器，他相信社會只看成績，他對自己的評價也只剩成績。他不覺得賣藥是錯\n的，即便可能會傷害他人身體，他卻認為自己讀過很多文獻，對於這種新藥了解甚多。(\n\
  但事實真是如此嗎？)\n\n邱俊成─與莫哲瑋完全呈現對比的人，就是邱俊成了。應該說，他是整個學校學生中的異\n類。他不在乎成績，他不想上大學，他喜歡種植植物而決定當一名農夫。他也不接受Miss\n\
  \ Tien出國讀書的建議，因為他喜歡他成長的地方「家裡髒了就打掃、東西壞了就修」這\n或許與他孤兒的背景有關，他更珍惜人、珍惜身邊的事物。放自殺通告的是他，他以為可\n\
  以改變一些什麼，但他沒想到的是他什麼都改變不了，大多數的學生希望終考，希望透過\n終考上大學、進入社會。卻也間接促成了梁珮晴的自殺。\n\n廖若嫣─一直想要得第一名，卻永遠比不過梁珮晴。為了得第一名她永遠都在念書，拚了\n\
  命的念、吃藥不眠不休的念。但她的壓力卻也很大，大到需要自殘的程度。但她是為了自\n己才想要得第一名嗎？我看未必，她只是想符合母親心中那個好女兒的形象。母親說這樣\n\
  可以從社會底層翻身，她就去做。「我原本想得到第一名之後再死的。」可以看出她也喘\n不過氣了。但母親是天下最不可違逆的人之一，她為了母親還是照做了。她是電影裡面聲\n\
  音很大，卻不是代表自己聲音的人。\n\n梁珮晴─前半段，我認為她一個人很迷樣的角色，直到她寫給邱俊成的信的公開，我們才\n得以知道她的想法。邱俊成應該是她暗戀又仰望的對象吧，那麼無拘無束、那麼自由。在\n\
  他面前，她自慚形穢，她覺得自己是空洞的，想當醫生的梁珮晴其實不是她自己，而她自\n己是誰，她也不確定。所以她選擇死亡，選擇一個，至少肯定的答案，很傻，但也很真實\n\
  。\n\n老實說，這部片我最震撼的，是學生們一個一個站到椅子上，大喊「我要考試！」的情景\n。估且不論同儕效應，如果這個「我要考試」是他們的心聲，他們被所謂的「教育」荼毒\n\
  得有多深可見一般。反思到現在的學習風氣，小時候一定要學才藝，進到正規教育系統以\n後就一定要上安親班、補習班，現在的孩子真的有快樂的童年嗎？當他們不知道如何快樂\n\
  ，要如何走過漫漫人生？良性競爭是好的，但過度是毒。所有的家長跟教育工作者，都應\n該謹慎為之。\n\n\n--"
