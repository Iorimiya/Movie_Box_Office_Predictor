title: '[情報] 幻愛導演【自殺通告】 前導預告 11.7上映'
content: '【自殺通告】11月7日 (五) 求救倒數


  震撼新作！

  金馬影帝加盟台灣拍攝團隊，全片在台取景拍攝。

  實力派演員、金鐘獎迷你劇集男配角精彩共演！

  人氣新秀演技大爆發。


  ｜劇情簡介｜

  一所成績至上的高級私立名校，學生們每天不停地唸書考試，為成績和排名所苦。學年終

  考前，一張匿名通告信被大量複製，灑落校園各地，上面威脅警告：七日後將有自殺事件

  發生！


  自殺通告的出現，連帶效應接踵而來。校長（黃秋生飾）、老師（林予晞、黃迪揚飾），

  必須趕緊查出發出的通告的人是誰。同時面臨社會價值觀、家庭與學校的壓力，讓他們反

  思自己的教育信念，每個人必須做出抉擇。


  隨著期限一天天倒數，匿名者的身份即將揭曉，他動機為何？

  面對高壓的教育制度，誰能扭轉改變這一切？


  ｜導演｜周冠威

  ｜主演｜黃秋生x林予晞x劉敬x邵奕玫x白潤音x張豐豪x黃迪揚x戴雅芝 精彩共演

  ｜發行｜威視電影

  ｜製作｜本萃電影


  *提醒您，珍惜生命，自殺不能解決問題，生命一定可以找到出路。若需諮商或相關協助

  可撥生命線專線「1995」、張老師服務專線「1980」或衛福部安心專線「1925」。


  --'
