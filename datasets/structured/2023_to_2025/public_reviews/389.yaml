title: '[好雷] 歌劇生死戀 我喜歡這種腦洞組合'
content: "總之先防雷XD\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n\n首先這片我真的覺得是導演某天靈機一洞:\n\"我們不如把希臘神話悲劇跟普契尼悲劇湊一桌順便加點韋瓦第比才還有那個跟這個歌劇大神\"\n然後這片就出現了XD\n\
  \n英文片名是 \"The Opera!\"\n不過我覺得副標更切合內容: \"Arias for an Eclipse\" \"日蝕中的詠嘆調\"\n\n劇情基本上就是希臘神話奧菲斯與尤麗狄斯的故事現代化版本,\n\
  利用一個刻意的日蝕期間串接各個不同的詠嘆調推進劇情.\n\n故事先從現實生活開始, 由槍聲與血跡斑斑的超市拉開序幕,\n接著趁觀眾還搞不清楚狀況的時候鏡頭一轉,\
  \ 直接代入壁上的畫作進入歌劇的世界.\n\n在那裡, 女主角尤麗狄斯在婚禮之日(剛好是個日蝕)也很巧的遭到槍擊並被冥王帶走,\n男主角奧菲斯震驚之餘, 隨手招來一輛計程車(還剛好是卡隆開的XD)一路追到冥府(X)冥界大飯店(O)\n\
  ,矢言討回他的未婚妻.\n\n當然在這大飯店中免不了受到一干看好戲(?)的希臘神祇出來銃康(X)飆歌劇(O)\n以及與冥王的對峙(X)飆歌劇(O)\n隨著一幕又一幕的更迭,\
  \ 也象徵著奧菲斯在冥界一段又一段的旅程,\n(當然尤麗狄斯也化身為這些歌劇的女主角死了一次又一次(X))\n過程中尤麗狄斯也逐漸忘記了奧菲斯的名字, 但仍為他歌唱.\n\
  這段把這些歌劇最精華的部份用巧妙的方式串接在一起, 再配上超現實基調的背景, 看起來非常過癮.\n\n最後如同原作, 冥王給了奧菲斯一個考驗, 若他成功就可以把尤麗狄斯帶回人間;\n\
  在這個世界的考驗當然就是: 飆 歌 劇 !\n如果唱完還記得是為誰而唱的話就算通過考驗.\n於是奧菲斯唱起了<公主徹夜未眠>,\n結束之後尤麗狄斯來到後台獻花,\
  \ 此時奧菲斯卻早已忘記她是誰...\n就像原作般的悲劇結尾:\n尤麗迪絲邊唱著 \"請記得我 但請忘記我的命運\" 下墜 落水 消失在奧菲斯的眼前\n\n\n\
  鏡頭拉回現實,頭髮半白的男主角奧菲斯(Alfredo)帶著女主角尤麗狄斯(Mimi)的禮服去洗衣店,\n老闆娘瞬間理解了那正是\"那件結婚禮服\", 並表示會把它清洗乾淨.\n\
  \n接著Alfredo搭乘計程車(人界版)來到了現實的冥界旅館---醫院,\n進入了病房, 映入眼簾的正是躺在床上逐漸衰老卻一直沒有醒來的Mimi.\n\n回到片頭的超市,\
  \ 原來當年她在超市被捲入槍擊事件之後便再也沒有醒來.\nAlfredo(現實中他們已結婚)多年來都會不間斷地帶各種不同音樂探望她,\n並用耳機為她播放,希望她能醒來..\n\
  \n而開頭代入的那幅畫作正是掛在病房內的那幅.\n\n鏡頭回到了現在: 今天是個特別的日子\n在與主角母親、護理人員與主治醫師一一握手後,\n男主角獨自待在病床邊唸著這個故事的結局:\n\
  \"奧菲斯終究忍不住回頭了, 而尤麗狄斯則重新墜入了冥界...\"\n....\n變形記闔上了, 而她的生命也消逝了.\nAlfredo吻了病床上的她後緩慢離開病房走出醫院,\n\
  最終鏡頭飛向天空, 這似乎也意味著他終於可以放下讓她離開了...\n\n\n\n整體而言我很喜歡冥界大飯店的創意, 以及隨著劇情推進插入合適詠嘆調的巧思.\n\n\
  而對話使用英語, 歌唱使用義語其實也暗示了現實的狀態,\n雖然我一開始的理解是義大利歌劇用義語很合理 XD\n\n前半那些歪斜的背景帶有某種超現實主義的氛圍,\
  \ 個人很喜歡那幾幕的基調.\n\n總之是部腦洞有點大的作品, 推薦對歌劇有點興趣或是喜歡超現實氛圍的人~\n就算你都不熟這些歌劇也沒關係,\n入場之前我只依稀記得\
  \ <公主徹夜未眠> 跟 <今夜星光燦爛> 而已, 也是看得很開心XD\n如果你對這些歌劇有點研究的話肯定能看得比我更開心w\n\n而男女主角的唱功我認為也是沒有問題的,\n\
  當然你不能要求三大男高音那種等級, 但以這部作品的演繹很足夠了.\n\n\nPS: 另外有一些小細節滿有趣的\n- 冥界大飯店(Hotel Hades)在現實上為一座醫院,\
  \ 但仔細想半秒好像也滿合理的\n- 看完之後查資料 茶花女男主角叫Alfredo 波西米亞人女主角叫作Mimi\n  我還沒參透為什麼選這兩部作品的名字不選其他的XD\n\
  - 卡隆(Charon)在一開始計程車追逐戲中碎碎念冥王的具現化方式其實就是這些歌劇的女主角死法(汗\n\n\n--\n這部真的滿有趣的 推薦!\n就..真的都在飆歌劇阿ww"
