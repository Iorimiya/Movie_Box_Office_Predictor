title: '[好雷] 飛舞人生 Fly (2021 德國片)'
content: '好久沒上戲院今天來衝《飛舞人生》Fly (2021)早上第一場！本片是今年院線第二部歐陸舞蹈片，演員是我心目中拿光劍最帥的粉絲版星戰正妹 Svenja
  Jung、導演是此前十年以少女小馬跑片《馬麻吉》系列打開兒童市場的中老年導演 Katja von Garnier，有時看片中舞者長髮飛揚水花四濺簡直有種「拍人如拍馬」的似曾相識頗令人莞爾
  XD 不過這應是導演離開兒童片型回歸年輕戲路的再出發之作：她年輕拍的《碧波女賊》Bandits (1997)談四個重刑女犯透過矯治計畫組成樂團越獄的故事、這次《飛舞人生》也在談一群假釋犯緩刑犯與受刑人透過矯治計畫練習街舞的故事。




  這次的主角們倒都不是重刑犯而都乖乖配合等服刑期滿，只是這「配合」一開始非常消極只按表操課，還需名師點通才知「舞蹈治療」可以「興觀群怨」讓自己脫胎換骨重返社會展開新人生！飾演名師的
  Jasmin Tabatabai 飾演計畫主持人的 Nicolette Krebitz與飾演獄中心輔官的 Katja Riemann都是導演當年《碧波女賊》老班底，現在她們當中年配角則要為二三十歲青年世代抬轎：專業街舞舞者有土阿伊非越日等多族裔面孔、他們以群戲為主話不多說幾乎全靠街舞說故事；唯一的專業演員
  Svenja Jung則以芭蕾底子稍作街舞轉化，並擔綱女主角訴說罪犯的心理重建。



  這群各自有街舞或舞蹈底子的年輕配角犯了什麼罪？有人當傳統扒手、有人做網路詐騙、有人聚眾打群架、有人跟幫派暴力討債... 其實都仍是小罪只是若無心理重建回到社會只怕很快又誤入歧途！而一堆緩刑犯與假釋犯間唯一一個目前仍在獄中服刑的女主角
  Bex，她的罪以一般警匪劇標準來看算是最無辜，但由於她背景最清白因此犯了罪後「罪疚」最深重：她曾在柏林橋上被人超車時被挑釁起來、一時快意失控令她自己和另一車雙雙落河、她有驚無險入獄服刑但另一車主殘障一生！雖以司法來說服完刑了就算清白了，但她良心難解罪疚而自命已爛命一條。




  電影對這「罪疚」的視覺處理就是不停上升滿溢囚室的洪水！這既是 Bex車禍時河水淹入車中的餘悸猶存、又是 Bex的自罪自責自暴自棄滿溢腦中、彷彿自己將永遠封閉自己留在一生的囚牢！這當然是她腦內意象、對觀眾與其他角色來說都是超現實，但本片從不吝於將這超現實的「水」意象融入一場場舞蹈當下讓他們玩水划水掠水濺水、更在主角一人體悟時讓水傾瀉而出流經大地化作甘霖點通眾人！本片的主配角們失敗落寞憤世嫉俗都需要療癒再起、再起苦路上的喜怒哀樂點點滴滴都要靠舞蹈探索、而片末一間教堂廢墟也要舞蹈介入「老屋新生」推己及人促成社群的新生。



  本片故事簡單省話階段清楚發展快速，觀眾如以一般劇情片或舞蹈勵志片標準來看恐會覺得「缺乏鋪陳」，但它總是省話台詞簡單點題丟出一個待解衝突、隨後二話不說展開一場舞蹈靠肢體語言與身體對話解決那衝突。以一群憤世嫉俗自暴自棄的年輕犯人們來說，第一階段是「信任遊戲」你要相信講師相信彼此未來才可能相信這社會、第二階段是「相信自己」你們各有才藝潛能也各有憤懣苦衷值得大膽分享秀出來、第三階段是「走進社會」與人尬舞各種歧視鄙視敵視蔑視紛至沓來要以舞面對、第四階段是「群策群力」截長補短團結一體超越極限就是舞蹈
  synergy！




  而經歷中段幾次藝廊官署「舞蹈介入空間」體驗社會呼吸脈動大放異彩後、中後段也不能免俗地陷入個人與集體的落寞沈潛：本片舞蹈更生人們再自立自強重建人生滿懷熱情參與社會、這或保守庸碌或高高在上的社會總對他們早有成見，但復原重生的旅程絕不可一次就放棄而必須再接再厲！而對女主角
  Bex個人來說，也許本來覺得打開心窗找到新生就能放下罪疚揮別過去？但冥冥天意過去罪疚一定好死不死如影隨形追到妳新生！在此 Bex好不容易過舞蹈療癒重建人生自信、還與舞蹈帥男
  Jay以舞交心展望美好未來、誰知過去自己害到殘障的車禍受害人就是他哥哥？



  Bex 要怎樣面對罪疚痛定思痛與舞蹈帥男和解？全體舞者們要如何推陳出新另闢蹊徑撼動人心？柏林那間荒煙蔓草的教堂廢墟該如何以舞重生？而下要照顧年輕舞者上要周旋傲慢官僚的舞蹈名師與計畫主持人又該怎麼達成圓滿平衡？本片幾乎所有的心結都字字珠璣耍酷省話點到為止、剩下的都交給舞蹈解決身體對話開發肢體語言，這種肢體語言從全片開舞的「金木水火土」開始每人就都有不同詮釋切入令彼此猜心、但隨著角色們共舞久了觀眾也看舞久了慢慢都成了意在言外的默契...
  以舞蹈片應由「舞蹈說話」的眼光來看，此片在舞蹈片型中真行雲流水脫穎而出！




  回想我們對美式「街舞片」的印象模板為何呢？大概不外就一群平常被人瞧不起的街頭孩子們、以街舞交友發揮才能建立自信，遇上街舞菁英尬舞一場怒氣沖沖、最終群策群力光榮奪冠獲得人生救贖？本片與這類美式街舞片精神類似但田野不同、不以對外尬舞為主而以向內自省為主，它的舞蹈並不重視寫實性完整性與連續性而時常大量剪接重組、但片段影像的重組配上精選德國嘻哈一首首都如
  MV 般行雲流水令人遙想！而它講一小段話跳一大段舞的構成，總令我覺得不太像在看劇情片，還更像在欣賞一齣舞劇只是劇場換到了城市大舞台... 推薦舞蹈片觀眾院線欣賞！




  --

  本來今天興沖沖想連看兩片，沒想到期待已久的《青春來接招》居然不見了...



  --'
