title: '[普雷] 屁屁偵探：天才惡人屁屁亞蒂'
content: "雷文防雷資訊頁\n\n\n\n簡單來說～\n受不了臭屁攻擊的爸媽真的不建議帶去看XD\n\n可以忍受的話，小孩會很愛T^T\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\
  \n試圖傳遞「勇氣」與「鬥志」的兒童電影\n\n\n\n有些動畫電影不僅適合孩子觀賞，\n陪看的大人也能很有收穫，\n例如《冰雪奇緣》、《歡樂好聲音》（兩部續集都好看！）\n\
  　\n有些電影則真的是「小孩限定」，\n大人切莫抱著會獲得什麼體悟的期待觀賞以免失望，\n大半巧虎電影屬於這一類，\n這一部屁屁偵探也是如此…\n\n若純粹當成陪伴孩子共度愉快時光，\n\
  仍舊是很棒的收穫啦！\n　\n－\n　\n在今日不到十度的低溫中，\n堅持帶小子在外面遊蕩的選擇，就是到電影院囉！\n可惜少爺對灌籃高手完全沒興趣，\n毫不遲疑地選了這部屁屁偵探～\n\
  　\n　\n　\n\n　　\n屁屁偵探與助手布朗借用了福爾摩斯跟華生的搭配，\n這一回的大反派，更是致敬福爾摩斯勁敵莫里亞蒂教授，\n就是這點讓我抱著錯誤期待進入戲院…\n\
  　　\n\n故事切成兩段，\n先是《夢想的巨無霸地瓜派園遊會》，\n看得吾兒哈哈大笑，但劇情起伏不大，\n因此當這一趴結束時媽媽有點無言，\n幸好與後面主要篇章還能算是有關聯；\n\
  　\n\n第二趴才出現反派首領～屁屁亞蒂教授，\n神出鬼沒，手下們無不對他充滿敬畏；\n誠如每個遊戲中有著堅定目標及鋼鐵意志的反派，\n一出手，就是針對汪汪警察的超級絕招，\n\
  就連國際警察也沒轍，堪稱無敵，\n唯有屁屁偵探勉強能與之抗衡。\n 　\n只是那單挑方式…雖然在預期之中，\n但實際看到屁屁對決的場景出現在螢幕上，\n還是忍不住產生：\n\
  「我是誰？我怎麼在這裡？」的荒唐感受……\n誰來救救我的眼睛～\n　\n　\n　　\n無論是屁屁偵探：「抱歉，請容我失禮了！」\n或者屁屁亞蒂：「抱歉，請容我無禮了！」\n\
  你們根本一點都不抱歉吧！？\n　\n真心建議受不了臭屁攻勢的爸媽們就別帶孩子去看了\n太鬧啦！\n　\n\n#吾家七歲兒表示：哈哈很好笑啊！好看！　\n\n－\n\
  \n一如《屁屁偵探》系列的書籍與影片，\n觀影中讓我們順便搜尋７個屁屁的設計還是不錯，\n傳遞「勇氣」與「鬥志」的用心及小鎮的團結也很棒，\n尤其要稱讚反派－屁屁亞蒂的配音，未免太好聽了吧！\n\
  帶點憂鬱、優雅又瀟灑，\n查詢才發現居然是修杰楷初次嘗試配音，厲害。\n\n\n最大問題仍出在「對戰狀態」，\n但那本來就是屁屁偵探的設定，\n應該沒可能改變，該改變的是我的心態啊（自暴自棄）\n\
  畢竟，孩子真的看得很愉快！\n沒辦法享受其中確實是我的問題也不一定～\n歡迎有看過的爸媽分享你們的感受，急需同溫層Q_Q\n\n整體來說，距離《鞋貓劍客》等級還是很遙遠，\n\
  誠心建議，未來電視有播在家看就好……\n不如趁鞋貓劍客還沒下檔，把握機會去看吧！\n\n--\n\n\n\n--"
