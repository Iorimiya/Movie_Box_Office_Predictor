url: https://www.ptt.cc/bbs/movie/M.1692433801.A.28C.html
title: '[好雷] 來自雪國的遺書'
content: '大部分人第一次看到二宮和也

  大多是因為好萊塢拍的【硫磺島的信】

  所以看他有演就想找來看看

  之前他演的我的長崎母親也是講核彈

  我想他可能要演一輩子二戰片吧

  就像庹宗華演小畢跟報告班長後

  要一輩子軍警跟流氓一樣


  裡面的男配角桐谷健太最近也常看到

  第一次看到他是在NHK六點晨間劇

  【萬福】裡面演個配角跟丑角


  二宮演全家住在滿州國的皇軍俄文翻譯

  日本戰敗後就被送去西伯利亞勞改10年

  後來知道快要戰敗，就把妻小送回日本

  沒多久就戰敗了，然後就拍他們關10年


  這是真實故事，裡面被關完的人

  10年後被日本政府救出來後寫的自傳

  為了紀念在牢裡當翻譯而犧牲的主角


  畫面很像電視電影，不太有電影感

  可能缺錢所以畫質想在看公視斯卡羅

  但這個故事一樣是在講日軍的反省


  配角桐谷健太演一名日軍

  被長官指使必須要拿刺刀處決中國人

  不然就會被依軍法切腹斬首或槍斃

  你不殺戰俘、長官就會殺你

  也演出小日本初次殺人的震撼跟恐懼

  就像管虎的八佰也有處決日本鬼子的橋段


  但願未來管虎或李安、克林伊斯威特

  能中台韓美日一起合作一部真正的二戰片

  或是國共內戰片，但願還年輕的魏導也能來拍

  把國共內戰拍得像賽德克巴萊一樣該多好

  一定比長津胡那三大導演拍得更好看更賣座

  一次就回本大賣然後退休當老闆培養新秀







  --'
