url: https://www.ptt.cc/bbs/movie/M.1692987739.A.ED9.html
title: '[普雷]《來自雪國的遺書》一生懸命的活著'
content: '大雪紛飛時，零下六十八度止不住的思念


  第二次世界大戰的結束，不只有改變世界局勢，也讓人再次知道戰爭所帶來讓人悲痛的代

  價，其中不管是歐美或當時帝國主義盛行的日本，最終如今在追思當年的戰亂時代，都體

  會到「和平」的意義。


  但世界還是有著大大小小的戰爭，如俄羅斯侵略烏克蘭的影像放送到世界各地，戰火與戰

  俘的樣貌，不僅讓人想起過去留在俄羅斯那些東亞軍人的故事。


  《來自雪國的遺書》是改編日本文學作品《収容所から来た遺書》，故事敘述滿州國的日

  本軍人山本幡男投降後，被俄羅斯軍方強制送往西伯利亞的戰俘營進行勞改。在極地裡他

  面對許多同胞死於營養不良、自殺逃跑、或階級內鬥中，仍保持回去日本的希望，終於盼

  到可以返家的那天，他卻因為精通俄語被懷疑是間諜而被阻斷回國的道路。







  《來自雪國的遺書》是什麼電影：


  2021年時，台灣研究者陳力航整理自己祖父陳以文留下資料，並且配合許多歷史文獻和紀

  錄出版了《零下六十八度－二戰後臺灣人的西伯利亞戰俘經驗》，開啟台灣人較不熟悉，

  台籍日本兵在滿州國和被俄羅斯軍方俘虜，屬於台灣少數人的歷史一頁。在日本二戰投降

  後，約有60萬人被強制送往西伯利亞的戰俘營，這其中除了日本人外，一些日本殖民地的

  軍人也在其中，台灣人也是其一。


  在書中有詳細描繪關於當時日本兵戰俘在西伯利亞集中營的生活，並且也提到多位當年的

  日台軍人在幾十年後又重新回去那曾經難忘記憶的地方，可惜已經人去樓空，當年戰俘營

  已經不見蹤跡，只剩下被埋在此地為戰爭犧牲的人們。


  電影《來自雪國的遺書》則是藝文作品，透過一位在俄羅斯死去的軍人的多張遺書，來還

  原當時他們思念家鄉、親人愛人的情緒，可以說代表著數以萬計被滯留於雪國軍人的心情

  。








  《來自雪國的遺書》是由女性作家辺見じゅん創作的小說，辺見じゅん是角川書店創辦人

  －角川源義的女兒，從小就受到父親的影響對詩歌、俳句等文藝作品很感興趣，也創作多

  部以日本軍旅、戰後故事等為題材的反戰小說獲得許多小說獎項。


  其開端是因為在散步時遇上一位因大和號失去兒子的母親，而在訪談多位大和號的相關家

  屬後，寫作出《男人們的大和》，還加入海墓調查委員會，成功查到大和號沉沒的地點與

  沉入海裡船體的位置。


  在1993年終戰48年時，《來自雪國的遺書》以特別企劃的形式改編成有著電影長度的電視

  劇，得到日本放送文化基金最高本賞的獲獎肯定。在之後也被繪製成漫畫作品，漫畫則是

  以山本幡男的視角解說他們在西伯利亞發生的故事，包含一些電影與電視劇沒有的細節。

  而作家辺見じゅん在寫作《來自雪國的遺書》曾描繪許多日本軍人面對自尊的掙扎，在訪

  談一些戰後生存下來的人，她也不斷在生前找尋「人的尊嚴究竟是什麼？」、「為了尊嚴

  而死去值得嗎？」如此的自省。









  《來自雪國的遺書》分析與延伸：


  辺見じゅん在創作《収容所から来た遺書》時，與《男人們的大和》、《女人們的大和》

  、《昭和的遺書》等作品一樣，都是以訪談調查的方式所寫作出這部軍旅小說。


  這部電影與小說的故事是完全有真人真事的模板，其所有的經歷來於當時的一般兵山本幡

  男的經歷來改寫，除了山本家人與妻子小孩收到許多戰友給予的遺書之外，也透過查訪這

  些經歷過西伯利亞集中營的戰友，來完整整個戰俘營的故事與發生之事。


  山本幡男是在輟學後前往當時日本在中國東北建立的滿州國作為鐵道員，而因為在日本時

  山本幡男對於社會主義、左派運動很感興趣故大量的閱讀了一些俄羅斯左翼作家、詩人的

  作品，故在工作期間俄羅斯的主管對他相當驚豔，並且對於其他國際社會脈絡、知識、和

  各國語言也都有涉略，並且反斷日本當時的軍國主義思潮，但最後還是在二戰受到國家徵

  召入伍，而在戰後被蘇聯俘虜進集中營。









  《來自雪國的遺書》電影中雖然沒有特別提到，但在原作中卻有提到當時被以戰爭犯逮捕

  後，幾乎終生不能回國，山本幡男除了對妻子與孩子的寄託外，是以創作日本短歌和俳句

  堅持下去，故電影中一些出場的軍人角色除了是山本幡男所見到的日本兵被俘虜的樣貌外

  ，某方面也有一些人代表著他自己對日本文學的熱愛，這也剛好跟作者辺見じゅん不謀而

  合，描繪山本幡男的故事某方面也讓一樣喜歡文字創作的辺見じゅん有更多思考。


  在電影裡有幕一位士兵因為會寫字而開心，這是因為山本幡男在集中營裡私下偷偷舉辦文

  化學習會、並且講述一些日本古老的詩歌故事和佛教經典，讓士兵們增加有活下去的希望

  與動力。


  甚至用工作的水泥袋和私藏的鉛筆偷偷創作同人誌、寫下文章讓士兵們傳閱，並也利用當

  時俄羅斯想跟日本人共產宣教時，在不激怒俄羅斯軍人的狀況下以幌子繼續集會、寫作與

  創作各種經典文學娛樂。山本幡男不斷鼓舞日本兵回國希望，直到送走最後一批日本戰俘

  。









  《來自雪國的遺書》值得一看嗎？


  電影《來自雪國的遺書》是翻拍經典的日本反戰文學作品，也是辺見じゅん透過撰寫山本

  幡男的故事不斷思考「生而為人的尊嚴」這個問題，對於日本軍國主義戰爭所作所為帶來

  的結果與被無故犧牲的各種人失去生命與尊嚴的批判。


  根據與《零下六十八度－二戰後臺灣人的西伯利亞戰俘經驗》作者陳力航簡單交流，陳力

  航認為電影還原近乎七成的還原度，一些看似荒謬的場景如唱民謠歌曲、舞台上共產主義

  的推廣，其實都是真有其事。


  但《來自雪國的遺書》很可惜的一點是整體像是拼拼湊湊出來的片段，在轉場與故事敘述

  上沒有做好同整，讓如果不熟悉這段日軍在滿州國歷史的人會有點不知所云，要不之前有

  先讀過相關書籍，不然恐怕在看電影時無法很快進入狀況，這也是《來自雪國的遺書》很

  大的遺憾，應該要再增加一些故事的細節去讓觀眾了解，而不是將許多名場面寫實化就完

  事。








  我認為從故事和歷史上集中營的戰友敘述，可以了解為何這些歸國的軍人會願意將山本幡

  男的遺書背誦，並要傳達給他家人，可以說在集中營山本幡男擔任兩方協調的角色，也是

  不斷去支持他人讓他們活下去的動力之一，透過文字、故事、戲劇、運動組織的方式，讓

  他人感覺自己可以繼續活著。雖然這樣比喻有些不合適，但就像許多動漫宅也是透過看自

  己喜歡的作品連載，繼續努力生活，人的生存往往需要一種寄託。


  而收穫最多的可能不是別人，而是撰寫這篇故事的作者辺見じゅん，她表示這個真人真事

  的故事讓她看見真的有人可以在極端惡劣的情況下堅持自己的信念，而且他不是什麼特別

  之人，只是個被戰爭牽連普通的士兵。


  文化是有力量的，就像山本幡男對那些一樣被俘的軍人說：「人只要能活著，就是快樂的

  。」透過文字與故事，這些特點其實是《來自雪國的遺書》的核心，但電影卻只剩下遺書

  的文字渲染情緒，真的可惜了。


  --

