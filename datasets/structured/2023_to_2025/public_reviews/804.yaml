title: '[討論] 鬼花園詛咒有劇透'
content: '這鬼片好可憐，一個被80的女學生上吊自殺被男主角碰巧救活，然後婚外情，還罵她只是

  想勾引他的婊子，反正男主因不小心殺了女學生後覺得自責內疚想解脫，在女主面前上吊

  自殺，然後發生一連串的怨念殺人，最後女主包容了女學生（其實是女鬼）但電影最後我

  是沒看懂，女主角懷孕了，她老公就死了是怎麼懷孕？這女學生也只是想融入朋友圈，結

  果被灌酒下藥迷奸，反正就是一個得不到幸福的人，看完只覺得願世界善良待人。


  --'
