url: https://www.ptt.cc/bbs/movie/M.1749737208.A.F46.html
title: '[新聞] 瑞貝爾威爾森變身<超硬伴娘>拍到爆血送醫'
content: '新聞網址：



  以《古墓奇兵》（Lara Croft: Tomb Raider）、《浴血任務2》（The Expendables 2）

  等票房動作鉅片聞名的導演賽門魏斯特（Simon West），帶來最新動作喜劇《超硬伴娘》

  （Bride Hard）硬派回歸，台灣也將與美國同步在6月20日爆笑獻映。本片講述一位身懷

  絕技的特務伴娘，為了守護閨蜜婚禮順利進行，緊急出手營救被恐怖份子劫持的賓客，力

  抗全場、拳拳到肉。尤其全片動作場面高潮不斷，簡直就像《伴娘我最大》（

  Bridesmaids）開外掛升級版！全片找來「喜劇女王」瑞貝爾威爾森（Rebel Wilson）領

  銜主演，得知能與賽門魏斯特合作，甚至變身女打仔上演動作戲，她毫不猶豫點頭接演，

  更親自上陣演出高難度動作特技，大展硬派身手。不過在拍攝過程當中，本來相當自豪可

  以毫髮無傷的她，卻在最後一場殺青戲，不小心被槍托狠狠擊中臉，血流如注到必須緊急

  送醫縫合，但面對這個突如其來的「壓軸意外」，她仍然樂觀表示：「至少現在可以說，

  我和湯姆克魯斯（Tom Cruise）、丹尼爾克雷格（Daniel Craig）一樣，在拍動作片時也

  受過傷！」





  今夏最狂動作喜劇《超硬伴娘》，由執導過《古墓奇兵》、《浴血任務2》等動作片的名

  導賽門魏斯特擔綱導演，將火爆場面與無厘頭笑料完美結合，打造年度最瘋狂、最爆笑的

  婚禮現場，勢必讓觀眾在歡笑與腎上腺素飆升中雙重暴擊！全片充滿超狂動作場面，不論

  是大甩電棒雙節棍、高級酒瓶成爆頭武器、火箭炮發射不眨眼，簡直就宛如《伴娘我最大

  》開外掛升級版，保證讓觀眾在大銀幕前笑到噴淚、驚呼連連！



  究竟是誰化身片中的頂尖特務，捍衛閨蜜的大喜之日？本片請來以《歌喉讚》（Pitch

  Perfect）走紅、被封為「喜劇女王」的瑞貝爾威爾森爆笑主演。得知能與賽門魏斯特合

  作，並變身女打仔上演動作戲，吸引她點頭接演。為此，她進行大量的動作排練，更親自

  上陣特技戲碼，她對此分享：「真的很好玩，讓人覺得很有力量。其實以前我學過空手道

  ，所以還算是知道如何出拳踢腿，很多動作戲就像跳舞一樣，有點像舞蹈編排，所以學那

  些動作、演出來，其實真的很好玩。」





  在拍攝《超硬伴娘》的過程中，瑞貝爾威爾森原先相當自豪，覺得即使挑戰大量動作戲，

  但她依然能夠毫髮無傷地完成拍攝；沒想到她卻在最後一場殺青戲發生意外，她回憶分享

  ：「最後一場戲，一把槍不小心擊中我的臉，整個鼻子被劃開，真的裂開來，當時血流如

  注，很嚇人。我被緊急送醫，他們還叫一位整形外科醫生幫我縫了三針。那時我才明白，

  當動作英雄真的會出事！」雖然這場意外確實嚇到了她，但她最後仍樂觀看待，並表示：

  「這讓我多了『動作明星』的聲譽，至少現在可以說，我和湯姆克魯斯、丹尼爾克雷格一

  樣，在拍動作片時也受過傷！」



  這部爆笑過癮，打鬥、槍戰、爆破一應俱全的暑假必看動作喜劇《超硬伴娘》，即將在6

  月20日於台灣爆笑獻映。本片劇情描述身經百戰的頂尖特務珊（瑞貝爾威爾森飾演），從

  未失手的她，竟因為一項看似「和平」的任務而踢到鐵板──擔任閨蜜的婚禮伴娘。在這

  場超奢華婚禮當中，她不僅要適應伴娘職責，還得與三位個性浮誇、又像塑膠姐妹的伴娘

  團共處。此時，一場突如其來的危機降臨：一群恐怖分子闖入，挾持現場的富豪賓客，讓

  婚禮瞬間成為人質危機現場。這讓珊被迫重返特務模式，優雅揮拳、含笑出招，一邊即刻

  救援、一邊捍衛閨蜜的幸福之日…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
