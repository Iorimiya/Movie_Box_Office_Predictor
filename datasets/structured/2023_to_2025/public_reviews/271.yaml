title: '[  雷] 超硬伴娘'
content: '雷文防雷資訊頁





  雷文防雷資訊頁





  雷文防雷資訊頁





  從預告看起來感覺應該是很爆笑貫穿整部片的電影


  但是怎麼前半段一整個煩躁感，講了很多拖時間的話，就是幾個伴娘聊天聊很久對於建構世

  界觀只有一點點的幫助。後半段恐怖份子開戰之後笑點也沒想像中的多


  感覺搞笑的精華大概都在預告裡面了

  翻譯跟預告不一樣。那句阿湯哥的翻譯在正片變成正常的翻譯了


  歌舞部分有達到水準，總結就是可看可不看的喜劇


  喜劇的預告本來就很難做，放太多梗真正進場假如只是重複會失望，放太少又難以吸引人


  希望暑假另一部搞笑動作片「脫線神探」能夠達到我的期望



  --'
