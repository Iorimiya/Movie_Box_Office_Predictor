url: https://www.ptt.cc/bbs/movie/M.1750413776.A.516.html
title: '[普雷] 超硬伴娘'
content: '雷文防雷資訊頁


  其實最近看了幾部片，只是剛好都懶得寫心得，


  今天請個特休，在看電影場次的時候偶然看到這一部片


  想說很久沒看喜劇片了，剛好也沒啥人，就買片進去看了


  目前在想要吃啥晚餐的時候順便發個心得廢文



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  如題


  超硬伴娘看預告片就知道是喜劇片


  只是刻意挑了一位，照理說不會被選上動作片的女主角來飾演特務而已


  感情戲勉強過關，不會有種精神錯亂的感覺，但是有些部分演得有點刻意就是了


  打鬥的部分看的出來想拍出一種專業但又不想太嚴肅的感覺，


  主要是模仿Yeah師傅可以隨手抄東西來扁人


  這就不得不提到把電捲棒當雙節棍甩，敵人握到燙傷的時候還被開嘲諷說


  " 好可憐喔，以後都不能用這支手去尻尻了 "


  有結合到搞笑的部分就超G8的


  而主要搞笑的部分就見仁見智了


  因為很多其實都在講黃色笑話，或是我們已知的刻板印象來進行嘲諷


  所以應該有某些特定團體不會喜歡這部片


  -----------------------------------------------------------------------


  最後總結一下，如果預算有限，這部片我不會特別推薦，因為不需要進電影院看


  可以等串流再看就好了


  除非你有閒又有錢，目前處於片荒又一定很想要找一部片來看的話，我才會推薦你看




  --'
