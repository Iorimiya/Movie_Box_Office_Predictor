url: https://www.ptt.cc/bbs/movie/M.1750340281.A.BA4.html
title: '[新聞] 【歌喉讚】閨密合體【超硬伴娘】掀話題！'
content: '新聞網址：



  「喜劇女王」瑞貝爾威爾森（Rebel Wilson）繼《歌喉讚》（Pitch Perfect）之後，與

  閨密演員安娜坎普（Anna Camp）兩人再度合體，演出最新動作喜劇《超硬伴娘》（

  Bride Hard），台灣也將與美國同步在本週五（6/20）爆笑獻映。當瑞貝爾接獲演出邀約

  後，一看到閨密團角色，便火速邀請已經相識14年的好友安娜坎普一起演出。兩人不僅在

  片中狂歡、飆車，戲外的玩笑話更是毫不間斷，展現超高默契。對於多年後再度共演，安

  娜也笑稱：「我們根本就是動作版的《歌喉讚》美麗女聲！」值得一提的是，本片在美國

  編劇協會罷工期間製作，由於當時不能有任何正式寫作行為，讓演員們得在片場即興發揮

  ，也讓觀眾見證她們的即興搞笑功力，而全片爆笑與動作兼具的爽快體驗，更是獲得觀眾

  的好評推薦！





  今夏最狂動作喜劇《超硬伴娘》，是瑞貝爾威爾森與安娜坎普繼《歌喉讚》系列後的再度

  合體！當瑞貝爾接獲演出邀約時，一看到閨密團角色，便火速邀請14年好友安娜坎普共同

  演出，瑞貝爾對此表示：「她是戲路非常寬廣的演員，任何角色都能勝任，但後來我還是

  最想要她來演那個『最佳閨蜜』。我們認識很多年了，演出閨密對我們來說非常自然！」

  兩人不僅在片中舉辦巴黎狂歡單身趴、飆車狠追敵人，戲外更是玩笑話不間斷，安娜坎普

  也回憶：「不管我講什麼笑話，她都能馬上接住還升級回來，然後我再接著丟回去。我們

  從《歌喉讚》第一集就認識，至今已經14年了，所以在喜劇節奏上，我們有一種不用多說

  就懂的默契，這讓拍攝現場根本不像在工作，完全就像在玩！」她更笑稱：「我們根本就

  是動作版的《歌喉讚》美麗女聲！」





  值得一提的是，《超硬伴娘》製作期間，正值美國編劇協會罷工活動，由於罷工規定嚴格

  ，無法有任何正式寫作行為，讓演員們得在片場即興發揮。這也讓瑞貝爾威爾森發揮「喜

  劇女王」本領，身穿豪華禮服、綁著高馬尾，幽默自嘲：「我像亞莉安娜（Ariana

  Grande）去參加《比佛利山貴婦的真實生活》（The Real Housewives）！」憶起拍片當

  時，瑞貝爾也分享：「我根本沒辦法事先想好要怎麼呈現自己，所以我面對鏡子編出十個

  和我外表有關的玩笑話，最後選出這個版本。」並接續說道：「那時候完全不能寫劇本，

  不過可以做的，就是直接在鏡頭前即興發揮，所以片中許多段落，都是我當下編出來的！

  」



  全片爆笑與動作兼具的爽快體驗，也讓本片在美國與台灣舉辦試映會後，狂獲觀眾好評推

  薦：「好久沒看到這麼好笑的女特務電影！」「無厘頭演出與驚人動作戲，讓人笑到流淚

  又熱血沸騰！」「演員們的喜劇魅力與特技表演相當成功！」台灣觀眾們務必進戲院見證

  《超硬伴娘》的搞笑功力！



  這部爆笑過癮，打鬥、槍戰、爆破一應俱全的暑假必看動作喜劇《超硬伴娘》，即將在本

  週五（6/20）於台灣爆笑獻映。本片劇情描述身經百戰的頂尖特務珊（瑞貝爾威爾森飾演

  ），從未失手的她，竟因為一項看似「和平」的任務而踢到鐵板──擔任閨蜜的婚禮伴娘

  。在這場超奢華婚禮當中，她不僅要適應伴娘職責，還得與三位個性浮誇、又像塑膠姐妹

  的伴娘團共處。此時，一場突如其來的危機降臨：一群恐怖分子闖入，挾持現場的富豪賓

  客，讓婚禮瞬間成為人質危機現場。這讓珊被迫重返特務模式，優雅揮拳、含笑出招，一

  邊即刻救援、一邊捍衛閨蜜的幸福之日…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
