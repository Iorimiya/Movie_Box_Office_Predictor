  這是一場夢幻旅行，這裡媲美天堂，白天陽光普照，夜晚享樂狂歡\n\n不過詭異的事件陸續發生，菲達開始質疑眼前的現實\n她發覺這個地方不太對勁，但如果她想要活著離開這裡，她就必須揭露真相\n\
