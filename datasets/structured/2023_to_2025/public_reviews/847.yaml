url: https://www.ptt.cc/bbs/movie/M.1724387902.A.60E.html
title: '[負雷] 求救眨眨眼 女權：不想工作被幹 但分我錢'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  這部極度降智......


  跟以前那個笑話一樣


  開門有坨屎 我大吃一斤......


  我昨天沒有看簡介就去看


  單純就隨便看一部打發時間


  想不到就吃了口屎




  女主角跟女二剛剛一出場


  我就知道這是 SJW 電影


  因為這模樣就是完全 SJW 喜歡的黑肥醜


  屎味直接飄出來


  我都不知道現在片商有什麼毛病


  搞到我幾個鏡頭就知道這是 SJW 電影


  他們的電影票售賣畫面還完全沒有女主角


  怎麼就對 SJW 審美這麼沒信心嗎?




  前幾分鐘


  大概就是讓觀眾知道


  男反派深陷醜聞 (沒明講 應該是性騷擾那種)


  於是被迫辭去原本的 CEO 工作


  改成立一個基金會在募款


  大家也知道嘛 就是募款嘛


  帳目不清 錢都跑到自己口袋那種


  然後故事開始男反派就在餐會與募款演講




  然後女主角與女二


  她們原本是服務生之類的


  喬裝打扮混進了這個有錢人餐會想釣有錢男性


  女二還一直問女主角要到電話了沒


  Excuse me?


  一個 SJW 電影


  女性成功的方式是要結交有錢男性 混進有錢人派對?


  我是不是對女性主義有什麼誤解


  還是說現在的女性主義都是鼓勵女性去騙男性錢 我落伍了?




  然後男反派邀請女主跟女二


  (以及另外一群女的)去他的島 Happy


  在去島之前就有說


  傳言男反派都在島上辦吸毒性愛趴


  然後女主跟女二愉快的同意了(??)


  到了島上以後


  才發現原來只有一直吸毒 沒有性愛




  故事中間 女二突然失蹤了


  然後到了解謎的階段


  原來從頭到尾一直都是吸毒性愛趴 而不是只有吸毒


  震不震驚 !!!!!!


  只是男反派他們用了特殊的毒品


  會使部分記憶喪失


  女性們極度氣憤


  開始大開殺戒


  我們只有同意吸毒趴的部分


  沒有同意性愛趴的部分!!




  （女二失蹤是因為被蛇咬了


  蛇毒能讓喪失的記憶恢復


  她就被男性們殺了


  另外女主角以前就來過這島參加過吸毒性愛趴了）





  電影結局更是極度強化仇女派對極端女權的刻板印象：


  懶惰 要錢 要尊嚴 不工作


  最後女主角跟女三殺爆了整座小島


  但是女主角卻把男反派救下來


  女三：你知道你在做什麼嗎?




  鏡頭一轉 男反派跟女主離開了小島


  男反派依舊在演講


  但是眼神呆滯 疑似被女主角控制


  女主角穿著禮服喝著美酒


  身邊的人尊稱女主角社長夫人......


  好喔 完美符合仇女派心中的女性


  想要錢 不想工作 最好都男性工作 女性享樂


  我都分不清楚這部電影是不是來反串的了




  喔 對了 這部音效很噁


  故意放大生活中那些很噁心的聲音


  像是蚊子聲 刮地板的聲音 門轉動的聲音


  你就想你聽了兩個小時的指甲刮黑板就對了




  假如你真的是想看一部女性主義電影


  去看異形比較實在


  這種一邊批評男性都是性侵犯


  一邊鼓勵女性騙男性錢的電影


  少數人被騙去吃了幾口屎就好了


  其他人就別再去看了




  --'
