title: '[微雷] 求救眨眨眼'
content: "求救眨眨眼：\n1.一部驚悚、懸疑的小品電影。\n2.從預告你就大概猜的出來故事的走向，而且導演拍的非常的普通，沒有太多的驚喜感。\n3.女主角選了一個很有特色的黑人，我不曉得這是因為政治正確？否則看起來不太搭。\n\
  4.因為男主角查寧坦圖是很帥的白人，感覺受害的女主角應該是很漂亮的女性。\n5.不是說不能找黑人女主角，不過這部片的女主角不漂亮，但是有特色。\n6.電影最後，女性們開無雙，一群大男人被追著跑，這很不合理。\n\
  7.很普通、公式化的懸疑小品，除非你很喜歡查寧坦圖，或是很少看電影。否則你應該會對這部電影感到失望。\n-----\nSent from JPTT on my\
