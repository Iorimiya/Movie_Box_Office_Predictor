title: '[負雷] 求救眨眨眼 有夠難看 '
content: '非常難看

  我是說女主





  科技業億萬富翁史萊特金（查寧塔圖　飾演）在他的募款晚會上，遇見了雞尾酒女服務生

  菲達（娜歐蜜艾基　飾演），兩人產生了火花；史萊特於是邀請菲達，跟他和一群朋友去

  他的私人島嶼。這是一場夢幻旅行，這裡媲美天堂，白天陽光普照，夜晚享樂狂歡，所有

  人都玩得很盡興，大家都捨不得離開。不過詭異的事件陸續發生，菲達開始質疑眼前的現

  實，她發覺這個地方不太對勁，但如果她想要活著離開這裡，她就必須揭露真相。











  劇情極度不合理


  女主角又走召酉鬼(強調 不想人身攻擊 但..)

  待我道來






  這個是男主角查寧塔圖

  高富帥帥企業家




  這個是女主角娜歐蜜艾基

  黑人服務生








  故事就這樣開始

  男主角主動邀約女主跟他朋友一起去小島happy一起去小島happy

  白天每對情侶休閒游泳喝酒調情吸毒

  晚上玩強暴SM

  但她們被下藥噴香水會忘記痛苦的事情

  所以對他們來說 晚上殘暴的事等於沒發生

  白天醒來又是快樂的一天 就這樣玩好幾天



  重點是

  高富帥查寧塔圖

  為何要執意在這酉鬼女主 (她以前就被男主帶來過1次這小島)







  有幕女主角游泳完浮出水面

  結果水就從她門牙縫流出來...

  不然就要表示恐懼情緒一直特寫她門牙

  導演是跟她有甚麼仇






  製作可以忘記痛苦的藥就算了

  結果島上的蛇毒是解毒劑(甚麼設定)

  被咬到 或喝下蛇毒酒就可以解毒




  女主就意外下喝到蛇毒酒

  就慢慢想起那些晚上發生的事情

  跟另外一個女生說明 喝了酒

  她也回想起後開始反殺



  島上一堆男的有的還有槍

  被這些女的打假的







  這片從一開始設定 選角

  就不合理

  高富帥有必要千方百計騙一個普女

  突然覺得

  小鯰人魚

  黑雪公主的女主角

  是正妹!!!


  --'
