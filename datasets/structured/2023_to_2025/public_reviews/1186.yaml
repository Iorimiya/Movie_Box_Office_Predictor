title: 'Fw: [新聞] 《少女與戰車 劇場版》官方宣布 4DX 將'
content: "作者: gonghigh (Justin lee taiwan李宗瑞) 看板: Gossiping\n標題: [新聞] 《少女與戰車 劇場版》官方宣布\
  \ 4DX 將\n時間: Sat Jul  2 22:41:02 2016\n\n\n\n《少女與戰車 劇場版》官方宣布 4DX 將於 7 月 7 日再度在台上映\n\
  \n（GNN 記者 Akito 報導） 2016-07-02 22:05:22\n\n　　五月底於日本發售 BD/DVD 的《少女與戰車 劇場版》，日前在台連續上映多週下檔\n\
  後，今（2）日電影代理商又水整合宣布將於 7 月 7 日再度於台灣 4DX 影廳推出的消息\n。\n\n　　以「戰車道」為主軸，描述少女們以全國大賽為目標邁進的《少女與戰車》，劇場版\n\
  動畫去年11 月於日本上映至今仍有日本戲院持續上映中，而日前在台上映後也持續上映\n多週後於日前正式下檔。\n\n　　今日電影代理商又水整合宣布，《少女與戰車\
  \ 劇場版》將於 7 月 7 日於台灣 4DX\n影廳再度上映，目前關於上映的戲院、以及場次尚未公布，對於電影有興趣的人，可注意\n官方網站或 4DX 相關場次情報。\n\
  \n--\n\n會去看的都是宅男吧 臭死了\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n沒看過TV版建議去看嗎QQ\n\
