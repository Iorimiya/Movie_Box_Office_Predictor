url: https://www.ptt.cc/bbs/movie/M.1705665969.A.573.html
title: '[爽雷] 少女與戰車 劇場版4DX'
content: "上人權照\n\n設防雷頁\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  我第一次接觸少戰是玩戰車世界的時候\n但實際上動畫 是疫情初期\n在家沒事幹的時候補完的\n那時候已經錯過最終章第一話了\n而4DX是最終章1+2才親身體驗\n\
  那時真的是爽 但在旁邊的朋友說 劇場版才是真正爽\n等了兩三年 總算期盼到劇場版的重映\n趁今天休假 直接衝首場\n\n其實劇情也蠻簡單的\n沒看過動畫也可以馬上入戲\n\
  歷史梗很多 要對歷史跟戰車有初步研究的\n才會覺得對話有多白癡\n尤其是知波單 西隊長說\n“經過我的深思熟慮之後 我認為還是突擊最有效”\n這句話真的全場都笑出聲wwwww\n\
  而卡爾臼砲跟T-28出場\n是真的能體會出4DX的真正威力\n總算真的能理解朋友說的 劇場版才是最爽的\n\n另外在劇中出現的場景\n在我去年底大洗巡禮時出現\n\
  真的有種莫名的懷念感\n像這裡 大洗磯前神社\n\n\n現實這坡度戰車開下去準翻車\n\n大洗站\n\n還有這個 大洗海邊飯店\n\n話說喀秋莎打的穿甲彈\n\
  正穿過我住的那間房間（驚\n舊上岡小學\n\n\n\n\n其他巡禮的照片 來日再另PO文章介紹\n\n總之 沒看過這部作品的也沒問題\n馬上可以入戲 而且4DX真的爽=3=b\n\
  聽說只到1月30日 在那之前我應該會再刷個兩三次\n另外 劇場版沒特典 不要跟我一樣傻傻地帶海報筒過去Orz\n\n\nモクローこれ好き！\n這條毛巾是在大洗海邊飯店買的\n\
  安康魚可以畫的這麼可愛 水島真有你的\n\n安康魚真好吃=U=\n\n\n-----\nSent from JPTT on my Google Pixel 6a.\n\
  \n--\n\n   \n  \n  \n  \n \n\n--"
