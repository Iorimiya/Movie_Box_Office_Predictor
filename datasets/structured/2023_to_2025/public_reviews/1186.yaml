url: https://www.ptt.cc/bbs/movie/M.1457880250.A.105.html
title: 'Fw: [閒聊] 『少女與戰車 劇場版』4/15全台公開上映'
content: '作者: whatabirday (-) 看板: C_Chat

  標題: [閒聊] 『少女與戰車 劇場版』4/15全台公開上映

  時間: Sun Mar 13 16:33:08 2016


  有在看日本動畫新番的朋友一定不能錯過


  根據在日本已經欣賞過的鄉民們表示


  此片應該為十年難得一見好看的動畫劇場版




  　　完全新篇電影『 ガールズ&パンツァー劇場版』（少女與戰車劇場版）日本於2015年

  11月21日上映到目前票房數字已經突破多項紀錄至今仍然繼續上映當中...台灣地區電影由

  「又水整合」代理發行，4/15全台公開上映！


  　　「少女與戰車劇場版」故事就在電視動畫版完結之後，雖然大洗女子學園在第63屆全

  國戰車道大賽中拿得冠軍，但文部科學省違背承諾，仍決定要大洗學園廢校。不過，官員

  們仍給大洗多一次機會，就是要大洗戰車道部和大學生選拔隊來一場對戰。可是，大學生

  選拔隊的實力比一般高中生戰車道隊強很多倍之外，她們所使用的戰車比高中生們所用的

  更先進，此外，隊長還是西住流旗鼓相當的戰車道世家—島田流出身……不過，美穗等人

  得到各個學園艦的戰車道部出手支援，一起為守護大洗學園而並肩作戰。　　


  　　「少女與戰車劇場版」由水島努擔任導演，以「戰車道」為主題，描寫主角西柱美穗

  帶領著大洗女子學園的隊員們一路過關斬將、並且藉由戰車團結一心，以戰車道與其他學

  校以戰車交心的作品。其動畫過去廣泛與各界合作，不僅成功帶起大洗當地觀光，還與網

  路遊戲《戰車世界》推出一系列合作企劃。《少女與戰車》在電視動畫結束後，曾推出短

  篇 OVA 作品，劇場版的推出，已距離電視版結束相隔兩年。這次劇場版將新增 11 位角

  色，也讓整部作品的參與聲優達到 60 名以上。「少女與戰車 劇場版」台灣預定將於4月

  15日全台盛大上映。




  --'
