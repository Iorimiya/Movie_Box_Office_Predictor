content: '華藝電影FB：


  不讓大家等太久…先來公布…

  《少女與戰車 劇場版》十週年紀念上映

  2026.01.16 全台4DX、MX4D同步震撼大銀幕

  （本次將以 #極爆效果版 與大家見面）


  台灣影史4D票房冠軍

  《#少女與戰車劇場版》即將重磅回歸

  加碼MX4D版本同步震撼大銀幕



  4DX效果的最佳示範片，沒有之一

  這次多了MX4D版，想當初我台中跑到新竹三刷4DX

  而且不用看過TV動畫版（有的話更好）也能很享受

  本次是第12次上映，不知道會排多久就把握機會吧！


  --'
