url: https://www.ptt.cc/bbs/movie/M.1703761576.A.488.html
title: '[新聞] 《少女與戰車 劇場版》宣布 4DX 版 2024 '
content: "新聞網址：\n\n\n由水島努擔任導演的原創少女戰車競技動畫《少女與戰車》，華藝電影宣布《少女與戰車\n 劇場版》4DX 版將再度回歸戲院上映的消息。\n\
  \n\n\n　　《少女與戰車 劇場版》故事在電視動畫版完結之後，雖然大洗女子學園在第 63 屆\n全國戰車道大賽中拿得冠軍，但文部科學省違背承諾，仍決定要大洗學園廢校。不過，官\n\
  員們仍給大洗學員一次機會，就是要大洗戰車道部和大學生選拔隊來一場對戰。可是，大\n學生選拔隊的實力比一般高中生戰車道隊強很多倍之外，她們所使用的戰車比高中生們所\n\
  用的更先進，此外，隊長還是西住流旗鼓相當的戰車道世家—島田流出身……不過，美穗\n等人得到各個學園艦的戰車道部出手支援，一起為守護大洗學園而並肩作戰。\n\n\
  ꀊ\n　　《少女與戰車 劇場版》是 2015 年推出的劇場版作品，作為電視動畫的續集，當初\n在戲院上映時 4DX 版的表現十分讓人驚豔，也造就劇場版多次重新在台上映的現象。而\n\
  華藝電影昨日晚間宣布，《少女與戰車 劇場版》將重新於 2024 年 1 月 12 日在台上映\n的消息，這次將是本作第 11 次在台上映。\n\n\n--"
