url: https://www.ptt.cc/bbs/movie/M.1719193211.A.E6C.html
title: '[新聞] 「乒乓男孩」揭幕北影 桌球童星從500人脫'
content: '「乒乓男孩」揭幕北影 桌球童星從500人脫穎而出



  2024/6/21 19:54（6/21 20:31 更新）


  （中央社記者王心妤台北21日電）台北電影節今天以「乒乓男孩」揭幕，童星彭裕愷及李

  星緯從500人海選中脫穎而出，李星緯自揭其實左打只有20人，所以難度不高。他們雖是

  首次演戲，但監製唐在揚稱讚表現好。


  「乒乓男孩」監製唐在揚、梁宏志及導演洪伯豪，帶著演員徐若瑄、鄭人碩、施名帥、魏

  蔓、彭裕愷和李星緯，出席北影放映並分享拍攝心得。


  洪伯豪說：「第1次在中山堂跟近千觀眾看自己的作品，心情很緊張，希望這部片能讓觀

  眾回憶起孩童時期最純真的夢想。」


  洪伯豪表示，當時是從500名會打桌球的小朋友中選出彭裕愷及李星緯，是精挑細選才選

  出他們。李星緯笑說：「我覺得滿容易的，因為左打其實是只有20個人。」徐若瑄在片中

  飾演李星緯的媽媽，她說，兩人演戲很有火花，當時也是在1群小朋友中相中李星緯演出

  。


  鄭人碩飾演彭裕愷的爸爸，但在訪問時被彭裕愷笑虧：「我跟他說想去麗寶樂園玩，但他

  （鄭人碩）說要拍戲，結果那天明明沒有拍戲，沒有帶我去玩。」鄭人碩聽完笑認，當天

  是在房間睡覺。（編輯：管中維）1130621



  新聞網址：




  乒乓男孩(Doubles Match) 預告:



  --'
