title: '[新聞] 《乒乓男孩》熱血逐夢 兩個角頭當推手'
content: "《乒乓男孩》熱血逐夢 兩個角頭當推手\n\n2024/08/31 05:30\n\n\n彭裕愷（左）、李星緯在《乒乓男孩》飾演為了夢想而努力不懈的桌球小將。\n\
  （華納兄弟提供）\n\n〔記者許世穎／台北報導〕台片《乒乓男孩》昨曝光正式海報及預告，童星彭裕愷、李星\n緯在片中飾演從小就對乒乓產生濃厚興趣、目標成為全世界最強的雙打組合，施名帥、江\n\
  宏傑化身兩人教練。除了熱血情節，新生代超人氣男團Ozone成員佳辰首度為電影創作的\n插曲《貝貝我不會再耍廢了》也在預告中曝光。\n\n\n鄭人碩在《乒乓男孩》一改《角頭》的黑道形象，變身桌球小將的慈父。\n\
  （華納兄弟提供）\n\n導演洪伯豪透露故事靈感來自於一位台灣父親的親身經歷，「台灣運動員的訓練過程中，\n有很多因素都考驗著選手與家長堅持下去的意志力。我希望《乒乓男孩》這個充滿歡笑和\n\
  淚水的故事，能帶來積極正面的影響」，希望觀眾能更貼近運動場上的熱血與美好，也看\n到選手培訓背後的艱辛，希望台灣體育環境可以變得更好。\n\n\n先前在《角頭—大橋頭》飆演技的施名帥，在《乒乓男孩》變身桌球教練。\n\
  （華納兄弟提供）\n\n片中不僅可以看到兩位小選手為了夢想而努力不懈的過程，也可以看到飾演選手父親的鄭\n人碩、施名帥繼《角頭－大橋頭》後再度同台飆戲，一起做為小選手們榮耀背後的推手。\n\
  《乒乓男孩》10月25日在台上映。\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
