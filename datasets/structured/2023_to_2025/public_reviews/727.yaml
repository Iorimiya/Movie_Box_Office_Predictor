  安麗盃桌球比賽鄉下學校跟乒乓球名校對決整個都是只撥出黃軒跟雙打幾球畫面

  黃軒轉學到乒乓球名校訓練方式跟器材和鄉下學校有差別

  國手選拔比賽也是一樣比到2比2比到最後一球黃軒跟胡冠宇和好

  看完的感想就是好無聊的電影



