url: https://www.ptt.cc/bbs/movie/M.1715228114.A.366.html
title: '[新聞] 台北電影節開閉幕片 《乒乓男孩》《非普'
content: '新聞原標：《乒乓男孩》《非普通家族》獲選北影開閉幕片　韓女星金喜愛將隨片登台


  新聞網址：



  開幕片《乒乓男孩》是金獎監製唐在揚、梁宏志，攜手獲台北電影獎最佳劇情片

  ，由《孤味》億萬票房女星、《角頭2：王者再起》北影

  最佳男配角及實力派演員、共同演出。故事描述由飾演

  的桌球小將力爭上游、矢志成為頂尖桌球國際賽選手的熱血故事。


  本屆由韓國愛情電影大師許秦豪最新力作《非普通家族》擔綱閉幕片。該片根據荷蘭作家

  荷曼柯赫的暢銷小說《命運晚餐》（The Dinner）改編，由

  。前者在片中飾演唯利是圖的律師哥哥，後者為正直不阿的醫生弟弟，價值觀截

  然不同的兄弟，卻因雙方子女涉入一場意外，讓家族晚餐演變成一場場複雜的良心攻防戰

  。在片中與張東健飾演夫妻，她極致細膩的詮釋帶動全片情緒，充分展現影后的表

  演實力。


  導演許秦豪善於以平實手法描繪人與人之間複雜又牽一髮動全身的情感交流，能從細微的

  日常生活及四季更迭中映照出角色的起伏波動，讓觀眾在不知不覺中理解並與角色產生共

  鳴。此次影展也選映他不同時期的四部電影，包括首部作品、

  （Christmas in August)；李英愛主演、榮獲青龍獎最佳電影的的《春逝》（

  One Fine Spring Day）；助攻孫藝珍獲得亞太影展影后之作的《外出》（April Snow）

  ；以及由韓石圭、崔岷植等主演的古裝同志大片《天文：問天》（Forbidden Dream）。


  2024台北電影節將於6月21日至7月6日在台北市中山堂、信義威秀影城、光點華山電影館

  舉辦，精彩片單與活動將陸續公布，「國際新導演競賽」、「台北電影獎」雙競賽入圍名

  單將於揭曉，詳情請密切注意官方網站


  --'
