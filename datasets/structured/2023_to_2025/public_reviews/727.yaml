content: "★ 熱血與感動一次滿足\n★ 汗水、淚水交織而成的青春成長故事\n★ 徐若瑄、鄭人碩、施名帥、江宏傑等超強卡司陣容\n★ 電影預告：\n★【乒乓男孩】[普遍級]\
  \ 10月25日 (週五) 最強雙打\n\n今年最熱血的成長故事，描述兩位男孩胡冠宇、黃軒從小就對乒乓產生濃厚興趣，目標成\n為全世界最強的雙打組合，過程中經歷家庭、友情、受傷、分離等不同的考驗，其中胡冠\n\
  宇的父親及黃軒的母親就有不同的教養觀念及方式，除了彼此之間也產生摩擦，也讓胡冠\n宇及黃軒之間的關係生變。\n\n\n導演｜ 洪伯豪\n演員｜ 彭裕愷 李星緯\
  \ 徐若瑄 鄭人碩 施名帥 魏蔓 江宏傑 百白\n主題曲｜徐若瑄〈接住我〉\n插曲｜ Ozone 佳辰 原創獻聲〈貝貝我不會再耍廢了〉\n\n《抽獎方式》\n\
  10月12日 23:59前，推文留言你想要【乒乓男孩】原因，就有機會獲得電影特映券\n（如：台北場，我想看【乒乓男孩】，想知道乒乓小選手如何成為最強雙打)\n\n\
  \n《獎項內容》\n【乒乓男孩】電影特映券（一組2張）\n\n\n《特映會場次》\n台北場：10/16（三） 20:00   台北in89豪華影城 X 25 組\n\
  高雄場：10/17（四） 19:30   高雄SKM Park國賓 X 15 組\n\n\n\n《中獎通知》\n10月13日公布中獎者於回文內，並寄站內信通知得獎者得獎事宜。\n\
  10月14日12:00 前，請各位中獎人務必回覆領獎資訊，恕不接受逾期回覆。\n\n\n《注意事項》\n1.特映券為非賣品，嚴禁兜售等圖利行為。\n2.請準時入場觀賞，電影開演後10分鐘戲院與主辦單位有權謝絕入場。\n\
  3.如本活動因不可抗拒之特殊原因無法執行時，主辦單位有權決定取消、終止、修改或暫\n停本活動與延遲得獎公告。\n更多電影資訊：華納兄弟台灣粉絲團 \n\n\n\n\
