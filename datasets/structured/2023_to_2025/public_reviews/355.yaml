  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n 《對街的小星星》觀後感：在我心上劃一刀\n\
  \n這部片英文片名叫Solitude，男主角完全演出了這樣的形象。孤獨是現代的文明病，所以\n每個人都能在他身上看到自己的影子。\n\n獨自看著街上熙來攘往的人群，總是眺望遠方，期待一個簡單的關心、一個理解的眼神，\n\
  或是不會回頭的曾經。\n\n全片最後的轉折扎心又無奈，是獻給所有荒野孤狼的療癒之作。\n\n所以，什麼才是孤獨的解藥？\n\n–\n脆：\nIG：Fishpond_like\
  \ \n臉書：魚池 FishPond \n個人網站：\n\n--"
