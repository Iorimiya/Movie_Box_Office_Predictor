title: '[普雷] 《名偵探麻里子最悲慘的一天》，船到橋頭'
content: '部落格版：


  連續兩週看了兩部相當吃觀眾電波的電影，韓國的《雉岳山怪談》和日本的《名偵探麻里

  子最悲慘的一天》，兩部作品走的風格不同，論類型的話後者顯然相對較好入口，不過也

  只是和前者比的話。由內田英治與片山慎三兩位導演共同執導的《名偵探麻里子最悲慘的

  一天》踩著異色喜劇的節奏，從「尋找外星人」這樣超現實卻目標明確的主線為起點，向

  後延伸出了「尋找『某種東西』」的多條支線，將主場景設定在龍蛇雜處、即便到了深夜

  依舊燈火通明，有著「不眠之街」之稱的東京新宿歌舞伎町。巧妙利用歌舞伎町本身的獨

  特氛圍，來讓電影的荒誕劇情莫名得以成立，走在街道上的不僅有牛郎、酒店小姐與黑道

  分子、AV女優、導演，藏身於巷弄裡的更還有名偵探、殺手姊妹與忍者、連環殺人魔，眾

  人在街道與巷弄交錯擦身，在不斷來回的穿梭裡尋找著什麼，可能是愛、是夢想、是家人

  、是贖罪機會，是繼續活著、好好生活的理由。


  《名偵探麻里子最悲慘的一天》就好像是怪奇版的《解憂雜貨店》。同樣分為好幾個章節

  ，每個章節是不同的主角，看似各自獨立的故事實際上卻有著關聯性，並非是主角與配角

  的主戲與客串，而是兩位導演內田英治與片山慎三拆解主題的敘事方法。獨自經營著小酒

  吧卡爾莫爾的麻里子，平時會以店長身分在吧檯邊上聽著客人傾訴煩惱，私下則以麻里子

  偵探社名義替人解決疑難雜症，麻里子就好像是浪矢爺爺。偶爾會聚集在卡爾莫爾的每個

  人，不論是酒店小姐絢香、前黑愛道戸塚、殺手姊妹茂美與貞美，就連麻里子自己都有著

  各種煩惱，而他們或她們為了這些煩惱奔走、忙碌著，好似不趕快解決就會對他們往後人

  生造成很嚴重的影響。



  只是如同《解憂雜貨店》試著告訴讀者與觀眾的，是沒有人能告訴自己標準答案，只有相

  信自己才能選出正確解答這件事，《名偵探麻里子最悲慘的一天》想讓觀眾明白的是，遇

  到問題時不需要過於去糾結與煩惱，因為當過度去在意與放大問題，就成了偏執反而會更

  加困住自己，有時候必要的放寬心才對事情有所幫助，反正車到山頭必有路，船到橋頭自

  然直。《名偵探麻里子最悲慘的一天》裡居住在歌舞伎町的人們，雖然都有著無法被歸類

  到正常的身分與想要隱瞞與抹煞的過去，但所有人現在都為了生活與某個目標而各自努力

  著，這樣的他們換個角度來看不也就是過去兩位導演內田英治與片山慎三總用來當作主角

  的社會底層小人物？而《名偵探麻里子最悲慘的一天》確實融合著兩位導演各自過去作品

  中最讓觀眾喜歡的部分，在導演內田英治腦洞大開的劇情之上，是導演片山慎三對人物情

  感的細膩描寫。


  只是與此同時的，觀眾或許反而難去喜歡這次兩位導演的合作，那種不喜歡來自於電影給

  予觀眾的破碎感。誠如上面提到的電影儘管有著同條主線墊在下面，但依然還是數個短篇

  故事拼接在一起，而這些短篇故事裡的主角通常都是到了下個章節就沒了戲份，例如在一

  篇裡愛著牛郎星矢愛到想要佔有他、甚至不惜引火與他同歸於盡的絢香，明明麻里子才在

  電話裡說著大家都很想她、和她相約再聚卡爾莫爾，到了下個章節就再也沒有提過絢香這

  個人了。茂美與貞美雖然後續還有繼續登場，但同樣的在姐妹情深過後，就再度成為了卡

  爾莫爾的客人，與主線劇情再無任何關係。如此有著關聯性卻相當薄弱的故事線，加上每

  個登場角色都因篇幅而厚度不足，無疑會讓觀眾數次被中斷、或者無法堆疊並且延續情感

  ，這對喜歡《海角上的兄妹》裡寫實而又深刻的兄妹情感刻劃的我來說是件很可惜的事。



  而和過去幾部作品相比，導演內田英治同樣沒辦法有著很好的發揮，從其他作品裡能感受

  到的、對於現實人生的濃重無奈與無力，在《名偵探麻里子最悲慘的一天》中也被稀釋，

  即使戲謔與自嘲依舊，卻總感覺少了點味道。不過我想之所以會這樣，除了電影是用章節

  式敘事，另一原因大概就是電影真正的主角其實不是「生活在歌舞伎町的人們」而是「人

  們所生活在的歌舞伎町」。人們的故事不重要，重要的是發生在歌舞伎町裡的事，那些追

  逐、奔跑、相遇和再見都是用來提味的調味料，提出歌舞伎町獨有的百態滋味。外星人搭

  著飛碟離開地球，總是會再來下一個；連環殺人魔被殺手姊妹幹掉了，總是會再來下一個

  ；名偵探將委託的案子破完了，總是會再來下一個，只要歌舞伎町繼續存在，生活在此的

  人們自然會有新的故事可說。


  《名偵探麻里子最悲慘的一天》你說好不好看？不曉得。電影怎麼看怎麼怪，強烈建議有

  些精神渙散進場觀賞，我想才可以在恍惚之間被電影偶爾天外飛來的一筆給打到，兩位導

  演內田英治與片山慎三這次選擇放飛自我、恣意妄為，帶來與過去不同的作品表現，吃不

  吃得下去全看觀眾個人。《名偵探麻里子最悲慘的一天》不是部好理解、也不需要被理解

  的作品，下班或是休假看電影偶爾就是需要這樣能讓腦袋關機的電影，如果還是很介意看

  不懂這部作品？沒關係，反正就像這部電影自始至終都在說的、船到橋頭自然直，或許某

  天就會突然想通了也說不定。


  --'
