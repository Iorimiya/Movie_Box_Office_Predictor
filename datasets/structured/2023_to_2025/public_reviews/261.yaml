url: https://www.ptt.cc/bbs/movie/M.1751271301.A.A83.html
title: '[普雷]《民主，練習中》理想很大但現實那麼傷'
content: '抗議了然後呢？政治菜鳥的抱負、改變和妥協


  「不要碰政治」、「政治很髒，水很深」。這是老一輩的人常常跟年輕人說的話。台灣經

  歷過．很長一段時間的殖民、統治的黑暗時期，不管是日治時代或是國民政府來台，台灣

  的政治永遠伴隨著血淚，躁動與不安分。


  在當代下台灣解除戒嚴、報禁、黨禁，轉變成為民主國家，也讓更多人投入政治與社會運

  動，並且組織新的黨派，或是在政治舞台為和自己有一樣際遇的人民發聲。但理想很豐滿

  ，現實卻往往打臉，好不容易作為政治素人初登舞台，立刻能理解這裡的水深不只過腰，

  還可能讓人喘不過氣。


  《民主，練習中》是以新生代投入政治舞台為主題的紀錄片，敘述參加太陽花學運的阿賢

  、小花、西瓜三位年輕人，從街頭運動後投入政治舞台的十年來的經歷。阿賢意外當選議

  員與幕僚小花一起投入雲林政治，卻經歷地方勢力的洗禮，另外在宜蘭加入政黨的西瓜在

  政治之路不順遂而開了小吃店，三人都對台灣有理想，但現實卻不美好。





  《民主，練習中》是什麼電影？


  在現今民主的台灣，每個台灣人都有表達自己的意見和理念的權利，雖然過往台灣的歷史

  都是以殖民統治為主，但對於民主的概念「台灣是台灣人的台灣」的想法根深蒂固。在日

  本統治時1921年，台灣蔣渭水、林獻堂就曾跟日本政府主張台灣要設立自己的議會，這一

  抗爭就是14年，年年上京（東京）但並未被日本政府接受，這舉動不但沒有讓台灣知識份

  子和群眾失落，反而投入更多，台灣文化協會、農民運動、30年代的台灣地方自治聯盟成

  立，儘管受到日本政府的干預，但依舊可以看出台灣對於主權的追求。


  在1947年，中華民國政府接管台灣後爆發228事件、讓台灣民主化進程停滯了幾十年，但

  這之中仍有大大小小民主運動產生，其中像是高雄的美麗島事件就是具代表性的民主抗爭

  ，與台灣人追求自由的決心。1987年台灣解嚴後，這樣民主追求依舊持續著，90年代的「

  野百合學運」讓隔年終結台灣的萬年國會，並推動總統民選，這也讓2000年台灣迎來政黨

  輪替。


  紅杉軍抗議總統貪汙、太陽花學運抗議兩岸服貿協議黑箱佔領立院，一直到2024年青鳥運

  動抗議立法院「國會擴權」法案，其中，中國1989年6月4日的天安門事件，也加速台灣人

  民對於民主的認知。大大小小的運動，讓台灣的民主呈現「雖然不完美，但勇於發聲追求

  」的人民主權。





  紀錄片《民主，練習中》並不是以政治宣傳為主的電影，而是以沒有政治背景、資金的普

  通政治素人加入台灣政治會面臨到的狀況為主題拍攝的紀實故事。主要是以，前雲林縣議

  員－廖郁賢，參政和競選的過程為電影主要內容，帶出關於地方政治中理想與現實的差距

  。


  這些年輕人加入政治如何學習、碰撞，並且對於地方政治的弊病和怪異之處做出反駁。但

  現實往往讓人受傷，不管是議院地方派系的把持、家庭狀況和自我生活，甚至是看到自己

  過去支持的政黨人物的淪陷，社會運動的口號，似乎與投入現實政治的差異性逐漸擴大。


  「在一場社會運動結束後，年輕世代能改變什麼？地方政治會改變嗎？」這是導演－楊正

  欣在拍攝《民主，練習中》所思考，想呈現的地方。過去的紀錄片常常會拍攝對於街頭抗

  爭與運動的激情、開始與結束，但鮮少有人追蹤，社運青年後的狀況。尤其在這些人加入

  現實政治場域後的難堪、碰撞與妥協，甚至立場動搖與變動。呈現出台灣民主在雖然看似

  停滯，但還是有新的人正在試圖做出改變，而這些人是完全的政治素人，不管菜鳥還是政

  治新星，最後會清高絕俗或同流合汙？都是在對民主的一場練習。









  《民主，練習中》分析與延伸：


  社會運動與實際政治的差異性，很大一部分在於「理想」和「落實」之間的差距。有時候

  社會運動像是在造夢，並且對於不公平、不完美的事物試圖做出改變，號召有同樣想法的

  群眾一起發起變革，是展現人民對自己生活、國家或公共事務的一種行動力。但不像社會

  運動需要熱情與衝勁，在實際的政治上需要思考很多面向，例如立場的不同、法規與預算

  等，甚至有些政治人物也會考慮自己的政治生命、地方民意基礎、還有失敗的副作用等。

  也可以說社會運動是一種想法，而實際政治則是落實和角力，甚至還得思考自己的定位與

  政治生涯。


  這也是為何許多年輕群眾會參與社會運動，但較少人走向政治的道路，甚至無法適應政治

  工作之故，從社會運動走向政治，如同當興趣變成職業一樣，曾經的激情、悸動與滿腔熱

  血，很容易被現實擊垮消散。


  實際的政治與改革並不特別美好，甚至有著黑暗面，這是一群年輕人在成長或是加入政治

  的素人必須要有的衝擊，也就是不會有完美的政治人物，也不會有百分百政治與改革，這

  之中各種的妥協、制度流程、資源分配等，都需要不斷思考與周旋在多方之間。現代政治

  可以看做是一場不流血的戰國時代，走錯一步都很可能斷送政治生命與舞台。






  但是這不代表社會運動就是天馬行空的無用之物，社會運動代表的是生活在這土地上人民

  的訴求，它可以只是小貓兩三隻，也可能如潮水般生生不息，甚至壯大聲勢，就像是一場

  對於理想的碰撞。畢竟如果人要在天上飛，沒有想飛的念頭就不可能製作出飛機，先想飛

  了，我們才會去想如何飛。


  就像知道錢可以買到想要的東西，才會想說如何賺錢？如何更有錢？如何買到更好更實惠

  的東西。社會運動是一種對於社會美好的憧憬與想像，才會藉由政治期待去實踐，而電影

  《民主，練習中》則在說是一場實踐夢的過程，縱使它可能是場惡夢，但還能擁有夢想，

  並可以表達訴說出來，這本身就是民主存在有意義的地方。


  《民主，練習中》起於太陽花運動的街頭抗爭之後，社運青年對於理想政治的延續，素人

  投入政治舞台，發現地方派系盤根錯節，也發現如何爭取選民支持步履艱難。雖然理想與

  現實差距頗大，但台灣年輕一代依舊在挫敗中相信民主，畢竟過去不管日治時代屢屢挫敗

  的前輩、或是民國時期被設計、殺害的民主前輩，如今民主化的台灣，遭遇挫敗的新生代

  ，我們有機會反思台灣民主的可貴，與如何延續我們的理想政治。也因為民主還在，街頭

  運動不會結束，新一代加入政治染缸中的人還會繼續出現，接受洗禮繼續在這複雜的生態

  圈中奮鬥。







  《民主，練習中》值得一看嗎？


  這部紀錄片，我覺得是很有意思的。可以看到從社會運動出來的年輕人，帶著熱情但卻遭

  受到現實政治圈內的衝擊，和思索自己當初投入政治事業的決定是對的嗎？還是終究是錯

  付了。藉由年輕女性阿賢，有著現代女性自主的價值觀、認同兩性平權、支持LGBT族群，

  並且在議會表達自己看不慣、無法認同的事物，而跟老議員產生衝突，試圖改變台灣雲林

  地方的議會生態。這是一部很台灣，也有地方風味的紀錄片，裡面可以看到很多台灣有別

  於台北，中南部的特色，也可以看出鄉下縣市出生的年輕人對於自己出生地方的改革熱情

  。


  撇開紀錄片主角廖郁賢本人的立場，看完電影我會覺得這不是替某個政黨說話的紀錄片，

  並且也與台灣最主流的藍、綠、白黨派沒有太多關係，如果說比較有關的話反而是「時代

  力量」這個太陽花運動嶄露頭角的小黨比較有關，但更聚焦於阿賢和小花，兩人的故事，

  偶爾提到時代力量另一位新生代政治素人西瓜。


  三人都不是政治世家、父母也非律師、醫生，是普通的一般人走入政治，發現政治與自己

  想得不一樣，他沒有社會運動的激情，反而像激情完後需要考量如何面對現實，並實踐自

  己想法的腦力激盪，而且還必須承受其他人給你的政治衝擊。






  這也符合這部電影的片名《民主，練習中》，雖然片中明顯是以年輕素人的打拼為主題，

  是呈現這幾年下來，他們努力過、也想過要如何實踐當初自己街頭運動、地方改革的想法

  ，雖然可能與他們想像的政治有些不同，甚至有所衝擊，但仍然在學習。但，除此之外，

  民主練習中要練習的是否只有年輕的政治素人，要說的話，民主的政治遊戲並不像極權國

  家一般只落於掌權者的家族派系鬥爭，而是一場全民的博弈和「想要把國家帶往哪裡？」

  的多數決。故需要練習民主的，也許不是要投如政治職業的政治家，而是台灣全民都仍要

  持續練習如何民主？民主是是什麼？我的民主想像能託付給誰，這是一場寫不完的練習題

  本。


  生活亦政治，有時候我們民眾所說的不要政治，其實只是不要將政黨政治、或只用政黨的

  角度立場去詮釋事情。但我們的生活任何時候都跟政治相關，而投如政治行列，就如同宣

  告我從業餘走向專業，就像一部電影，地方學生製片和大螢幕院線片，我們所審視的角度

  、要求的專業度是完全不同的。


  《民主，練習中》正是告訴這些政治素人或年輕人，民主就是一件不簡單的事，且不完全

  美好，但為什麼你會持續相信民主可以改變什麼？那絕對有你的理由和性念，而這些想法

  也有著許多台灣人跟你抱持相同的執著，故台灣的民主才會一直在那裡。但就跟系統更新

  一樣，不只年輕人要練習民主，老年人也得適時往前看看，新的民主已經走了多遠？




  --

