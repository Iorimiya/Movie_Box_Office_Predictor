title: '[新聞] 導演楊正欣花十年拍攝《民主，練習中》…'
content: '新聞網址：



  導演楊正欣花十年拍攝《民主，練習中》…社運青年返鄉參政遭威脅、揭台灣地方政治黑

  暗面…盼「公民多談話」！喊話所有被罷立委「包場對話」


  導演楊正欣花費十年時間，拍攝紀錄片《民主，練習中》，講述三位參加過太陽花學運的

  台灣青年廖郁賢（阿賢）、傅銘偉（小花）、郭稟翰（西瓜）返鄉從政，從社運走進地方

  政治，挑戰地方勢力的經歷。對此，楊正欣今（4日）於電台節目《新聞放鞭炮》喊話，

  歡迎所有遭到罷免的國民黨立委包場觀看，「我很願意跟他們溝通、對話」。


  針對外界由人提出質疑，認為此紀錄片上映時間正逢大罷免，是為了大罷免而拍攝，楊正

  欣強調，這個紀錄片已經拍了10年，一直拍到青鳥、大罷免，「真的是巧合」。她表示，

  去年（2024）拍攝要準備結尾時，團隊就一直在思考從太陽花一路進展至今，要如何結尾

  ，「結果剛好發生青鳥，就想著故事終於有一個完整呈現後，今年推出又發生大罷免」。


  楊正欣反駁，這部片不是為罷免做準備，也沒有收罷團的錢，「這就是時勢所趨，台灣的

  民主就是發展成這樣」。談及上映時間，楊正欣指出，7、8月是好萊屋強片上映時間，所

  以要趕在這之前，而10、11月則是金馬獎，是另一波藝術大片時間，所以才選在現在上片

  。


  而有關拍攝紀錄片初衷，楊正欣表示，自己是想要拍「女性參政」為主題的大河劇，但因

  為難度比較高，所以後來就慢慢演變成《民主，練習中》。不過，楊正欣說道，台灣的女

  性真的很了不起，她也期望下一部片，就能拍女性大河劇。


  針對拍攝的主角，並不是太陽花學運的當紅人物，如現任民眾黨主席黃國昌、前民進黨台

  北市議員林昶佐等人，楊正欣指出，當初的想法就是想以素人為主題，「素人才是一般人

  ，就跟我們一般人的遭遇、想法一樣」。楊正欣說道，希望能透過三位台灣素人青年返鄉

  從政，遭到地方派系威脅的黑暗面，告訴觀眾，「第一、台灣地方政治其實是深根蒂固的

  地方勢力，剛好近日大罷免讓大家慢慢體會到，而我們影響也正好紀錄到；第二、青年參

  政只要準備好，就沒有不能做，但會遭遇到什麼，我們就是拍出來，給年輕人一個參考」

  。


  同時，楊正欣也提到，太陽花學運不久後，台灣出現以第三勢力為號召的政黨——時代力

  量。但台灣是否有第三勢力的空間，楊正新表示，「我並不是專業的，無法從政治局勢分

  析，但從我拍攝的影片來看，這三位主角離開了時代力量後，其實是悲觀的，最後都還是

  必須回歸兩大黨（國民黨、民進黨），才能實現他們的理想」。


  而談及這十年來，台灣的政治是否有什麼變化，楊正欣說道，「有大罷免就是一個很好進

  步、很好的發展」。她說道，「罷免對我來說，是非常有希望的，因為我們終於開始行使

  創制、複決、罷免的權利，這對公民社會的形成非常重要」。


  楊正欣也分享，自己希望透過這部紀錄片，展開對話。她說，台灣非常需要公民對話，放

  片更希望是以包場的形式進行，「希望能以包場的方式舉行座談，在電影結束後舉行QA」

  。楊正欣更說道，歡迎所有被罷免的國民黨立委包場觀看，「我很願意跟他們溝通、對話

  」。



  --'
