url: https://www.ptt.cc/bbs/movie/M.1751449782.A.E38.html
title: '[新聞]紀錄片《民主，練習中》上映 探討台灣民主'
content: '新聞網址：



  紀錄片《民主，練習中》上映 探討台灣民主進程




  【林宜瑩新北報導】記錄三位太陽花世代年輕人，從各樣社運現場走進地方政治，如今又

  投身大罷免的《民主，練習中》紀錄片，6月27日起在全台各大院線影城上映中。


  替《民主，練習中》紀錄片配樂的朱約信，於6月26日晚間在台北中會雙和教會舉行《民

  主，練習中》紀錄片專場，邀請該片監製林正盛、導演楊正欣、製片游惠貞擔任與談人，

  強調該片是「到電影院上一堂台灣人的公民課」。


  林正盛表示，台灣從警民衝突的街頭抗爭運動，讓戒嚴走向解嚴，在民主進程中，走向愛

  與非暴力的抗爭，從太陽花運動到如今的大罷免，可見大家都在民主過程中不斷練習。


  他坦言，太陽花運動雖然造就了柯文哲、黃國昌等政治人物，但他也肯定當時的太陽花運

  動擋下了海峽兩岸服務貿易協議（服貿）。




  林正盛認為，大罷免運動從一階、二階有31位國民黨立委達被罷免門檻，如今到7月26日

  即將要進行第一波三階同意罷免投票，在一月時，誰敢想說大罷免會大成功？


  連北市大安羅智強、文山賴士葆、新北新店羅明才、永和林德福、淡水洪孟楷都達二階送

  件門檻，「這就是公民的力量！大家要有信心。」


  針對中共不斷軍演威嚇要拿下台灣，民主練習是否真的能慢慢來？


  林正盛回應，還是要「緊事緩辦」。他解釋，因大罷免可能導致台灣社會對立劇烈，但若

  因中共在旁煽風點火，導致台灣國內混亂，豈不讓中共有了趁機攻打台灣的藉口？


  他認為，所謂的民主，就是大家必須一起坐下來「參詳」，要與意見不同者不斷溝通、在

  異中求同，唯有穩住不亂，民主才能持續往前。




  楊正欣認為，民主就像身體健康必須慢慢「養」、「調理」出來一樣，假使身體（民主）

  沒有健康，一旦遇到COVID-19病毒侵襲，身體就無法抵抗、就會生病。


  游惠貞也說，台灣社會多元的韌性往往會給大家意外的驚奇，大家一定要對台灣公民素質

  有信心，只要從容以對，台灣民主就能持續傳承下去。




  朱約信則分享在替《民主，練習中》紀錄片配樂時，製作了好幾條不同曲風的配樂，也不

  斷與參與配樂的樂手溝通。楊正欣坦言，最後僅採用三首配樂於片中，但主旋律確實是採

  用朱約信所創作的樂曲。


  朱約信也預告將於7月10日晚間7點半在野地方Wild Lab（台北市杭州南路一段147號B1）

  舉辦「《民主，練習中》電影音樂會」，採售票方式。


  《民主，練習中》紀錄片，主要以廖郁賢（阿賢）、傅銘偉（小花）、郭稟翰（西瓜）三

  位從太陽花運動出身的年輕人為主角，記錄他們各自返回家鄉投身政治，甚至有人還遭受

  人身威脅，卻從未因此畏懼退縮，仍舊在往前奮鬥，甚至當大罷免運動如野火蔓延開來時

  ，他們還義無反顧地支援各罷免團體。


  透過楊正欣從太陽花運動一路跟拍到如今的影像，讓大家在台灣民主路程中看見無限的盼

  望，欲知《民主，練習中》紀錄片戲院時刻表，可至「民主，練習中」Facebook粉絲專頁

  查詢。


  --'
