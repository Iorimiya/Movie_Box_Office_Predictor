title: '[LIVE] CatchPlay電影 21:00 超級殺(Wake Up)'
content: "CatchPlay電影\n超級殺(Wake Up)\n1/04(日) 21:00\n\n導演：法蘭西斯西蒙\n      安娜惠索\n    \
  \  尤安卡爾惠索\n演員：圖洛康維里\n      班尼O亞瑟\n      潔奎琳莫爾\n      湯姆古爾德\n      艾蕾西亞約哥豐塔納\n  \
  \    凱爾斯庫德\n\n當狂熱份子遇上嗜血保全，一場獵人與獵物的戰鬥即將展開，當抗議行動變成血腥噩夢，\n一場殘酷屠殺生死鬥即將血淋淋登場，歡迎光臨！殺戮賣場營業中\
  \ 獵殺遊戲不打烊....\n\n《駭人骨娃娃》、《血腥夏令營》編劇亞柏托馬里尼Alberto Marini聯手《渦輪小子》系\n列電影導演群蘭西斯西蒙(François\
  \ Simard)、安娜惠索(Anouk Whissell )、尤安卡爾\n惠索(Yoann-Karl Whissell) 共同打造，將虐殺尺度推上新高峰，展開一場弒血屠殺生死\n\
  鬥。\n\n一群年輕人為了表達自己的環保訴求，決定在家居賣場打烊後偷偷大搞破壞，沒想到卻引\n來了嗜血保全的瘋狂殺戮…\n\n將日常生活場景打造為屠殺戰場，製作團隊表示這是一個他們非常喜歡的概念，並且還能\n\
  透過這個場景，藉此呼籲相關議題，導演尤安卡爾惠索分享：「電影中除了砍殺元素，還\n有我們非常重視的環境議題，這是我們團隊想透過電影留給這個世界的強烈訊息。這們認\n\
  為這是一個非常強大的組合，通常在砍殺電影中，你會看到一群只想派對的年輕人，但我\n們的主角，這些孩子們知道自己的使命，這就立刻變得不同了，我們都非常喜歡這個概念\n\
  。」導演也強調：「我們的工作是娛樂大銀幕觀眾，所以，我們的電影絕對能達到娛樂觀\n眾的目的，再來聆聽我們放進電影裡的訊息。」\n----------------------------------------------------------------------\n\
  AMC\n幻影入侵\n1/04(日) 21:00\n\n--\n   \n\n--"
