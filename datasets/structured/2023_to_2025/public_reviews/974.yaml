title: '[普雷] 穿越給自己人的入口：《環南時候》'
content: "內文有雷且具個人觀點，推薦觀影後再讀。\n\n　　　　本片目前場次有限，有意還請把握。\n\n\n\n　　　　圖文網頁版：\n\n　　　　\n\n\
  \n　　　　預告片：\n\n　　　　\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  \n\n穿越給自己人的入口：《環南時候》\n\n\n\n　　《環南時候》去年在高雄電影節上映時就被影友推薦，只是時間地點不\n\n允許，之後府中15放映也搶不到票。一刷之後讀了導演的訪談，隔週又看了\n\
  \n一次，覺得雖然導演的意圖鮮明，畫面可見用心，但因為敘事基礎不穩，以\n\n致角色表現出來的互動與情感雖然可以試圖理解，但不易連結與堆疊，也就\n\n難以凝聚足夠深刻的感受。\n\
  \n\n\n\n\n「懂愛」的成長之旅\n\n\n\n　　故事敘述陳耀華（夏騰宏飾）與失憶的父親陳保定（單承矩飾）在環南\n\n市場相依為命，但無法互相理解與關心，直到俞康敏（王渝屏飾）時隔三十\n\
  \n年來訪，在因緣際會下，陳耀華穿著父親保留繡有劉永輝名字的軍服外套，\n\n穿越回１９９１年五月的環南市場，成為劉永輝，打入了俞康敏、陳保定\n\n（宋柏緯飾）與張安健（初孟軒飾）之間，一起打過橄欖球對抗黑衫軍與學\n\
  \n長小煜（余晉飾）後，結拜成為「環南四少」。在建立友誼的同時，陳耀華\n\n／劉永輝揭開父親與張安健心中與身體的秘密，也和俞康敏產生了戀愛情愫。\n\n當陳耀華回到２０２２年，確認無法改變張安健早逝的命運後，他對父親有\n\
  \n了深刻的理解與連結，也和三十年後的俞康敏有再次結緣的可能。\n\n\n\n　　這部電影宣傳雖以ＢＬ為賣點，但鋪陳最仔細也最動人的是陳保定與陳\n\n耀華的父子之情。失憶的陳保定不僅與兒子情感疏離，甚至拒絕承認陳耀華\n\
  \n是自己的兒子。但在穿越過後，觀眾能跟著陳耀華目睹陳保定在戀愛、出櫃\n\n與父親決裂，與張安健生死離別，又不斷向人生妥協之後，理解他在晚年只\n\n想沉湎在回憶裡的心願，所以他一遍一遍聆聽當年偷錄張安健的聲音，和年\n\
  \n少時成為乩童，被父親與張安健在背後的撐持──那是他人生裡擁有最豐足、\n\n最快樂、最做自己的時刻，就算此刻的他忘了，但當他哼歌、起舞之時，\n\n「他的身體會讓他記得他是誰，甚至讓他記得，他愛過誰」，便能回到短暫\n\
  \n的燦亮與依靠。陳耀華也認識了父親的愛人張安健，有一起洗澡、飆車、抽\n\n菸、追求所愛、達成協議的互動，故而之後父子的洗澡戲平淡卻份外動人，\n\n穿越過的陳耀華，藉由曾經三人一起洗澡的記憶，用張安健的方式和父親玩\n\
  \n鬧，為父親洗澡，喚醒了陳保定的身體與情感記憶，在那一刻，彷彿張安健\n\n／陳保定穿越時空，來到彼此身邊，那是戀人間思念的再見，也是父子間理\n\n解的會面－－原本這個時代的陳保定，可能年少時既不被父親諒解，年老時\n\
  \n也無法被兒子理解，但陳耀華的穿越，讓他的沉湎有了被陪伴的機會。\n\n\n\n　　陳耀華更認識了俞康敏，這個因愛、為友情無私付出，卻也因此百般掙\n\n扎的女子。俞康敏雖然出身富家，但在什麼都覺得「（中國）大陸比較好」\n\
  \n的父母心中，她是次等的；在陳保定與張安健這兩位將彼此視為第一的朋友\n\n心中，她也是次等的。為了維繫這段友誼，她總是等待，總是當照顧人的那\n\n一個，總是口是心非地表露想被在乎的心願。直到陳耀華／劉永輝出現，劉\n\
  \n永輝有了付出、照顧的對象，而俞康敏則有了會將她視作關心首位的同伴──\n\n儘管之後又是三十年的等待與折磨。\n\n\n\n　　《環南時候》是陳耀華「懂愛」的成長之旅，穿越而與年少的父親相識，\n\
  \n令我聯想到瑟琳．席安瑪的《親愛的童伴》，只是這對父子是即將成年的青\n\n春期，陳耀華／劉永輝甚至成為他們的「大哥」；與俞康敏的關係，則既是\n\n她曾無望單戀父親的見證，是照顧陪伴的對象，是戀愛，也是目睹陳耀華這\n\
  \n段旅程為真的證人。\n\n\n\n\n\n難解的遺憾\n\n\n\n　　如果劇情鋪陳足夠的話，這部電影的每一條線都應有動人之處，但同時\n\n設定了１９９１年環南市場的背景與出身，穿越的設定，環南四少各自的友\n\
  \n誼與愛情線，陳氏三代父子與母子之情，同性戀情的艱難困境，陳保定作為\n\n神明代言人「回應人類願望」卻不能面對個人欲望的身不由己，雖然劇情試\n\n圖穿插彼此襯托，但仍有許多地方鋪陳受限，懸疑的空缺令人從好奇變成困\n\
  \n惑，例如「劉永輝」作為熟到性侵陳保定的軍人，卻不曾出現，張安健、俞\n\n康敏亦不識其人，只堪被陳耀華取代，以成就「永、保、安、康」的祝福。\n\n陳耀華為陳保定的兒子，俞康敏暗戀陳保定，既曾挺身為他擋下出櫃的危機，\n\
  \n也試圖與他一起彌補失去兒子的張安健父親，雖然都被拒絕，但之後三十年\n\n都沒有與陳保定聯絡，也不知道他結婚生子，有違她的人設和情感，以為成\n\n就三十年後與陳耀華的一眼牽纏。而陳保定是陳耀華的父親，母親是誰？在\n\
  \n電影場景與陳耀華的記憶裡，她都像不曾存在，彷彿只是證明陳保定屈服世\n\n俗、為他留下後代的生產工具；若是收養關係，兩人的疏離與親密程度也無\n\n暗示或符合之處。這三個設定的意圖大於情感邏輯，以致使故事的合理性有\n\
  \n所不足。\n\n\n\n　　此外，一般來說要敘述故事，鋪陳背景的同時亦須堆疊情感，如果要製\n\n造懸疑，至少要有一項交代清楚，以為推測的憑依。以陳耀華穿越到１９９１\n\
  \n年的場景為例：除了「劉永輝」的疑問，陳耀華雖然穿著軍裝外套，但一頭\n\n長髮的他，怎會被認為是同一個人？俞康敏買冬瓜茶意外遇到陳保定好像很\n\n熟，陳保定何以躲躲閃閃？這些疑問沒有交代，三人就去看張安健比賽，見\n\
  \n面後疏離感未減，還略顯尷尬，張安健更隨意拿俞康敏跟學長打賭，接著就\n\n進入了橄欖球比賽ＰＫ，來表現「環南人不甘被輕視」的背景，以及四人之\n\n間的關係，每一場戲都表現出這些主角的個性和如何看待彼此──但這都在\n\
  \n二刷弄清楚整個故事之後，再看這段才能了解，接續他們要去澡堂洗澡的理\n\n由（延續環南人的特殊，也與後面父子洗澡呼應），俞康敏「用錢買朋友」\n\n的疑慮，來與劉永輝／陳耀華建立彼此理解的契機。\n\
  \n\n\n　　如果這些設計有一項足夠協助理解的線，其他就可以依此推理。但因為\n\n每一條都是懸而未決，過久的延宕在橄欖球賽這麼多人的場景裡，其實並不\n\n\
  容易理解；而這個場景裡看似重要的學長，後面又未再出現，讓人覺得只是\n\n為了使場景、對話成立，卻沒有為此建立完整的情感關係。\n\n\n\n　　也因為如此，保、安、康三人的友誼深淺不一致：陳保定心知俞康敏的\n\
  \n暗戀，與她保持距離；張安健卻坦然拿她打賭，用她的錢，出櫃危機時又拿\n\n她當擋箭牌，當工具頗為順手，但劉永輝／陳耀華一提議卻很乾脆答應，劉\n\n永輝／陳耀華曾說俞康敏對張安健最無私，某種程度上是彼此利用；最後為\n\
  \n了與陳耀華只能存留一人的掙扎，張安健不得不離世，海邊可以看到俞康敏\n\n的私心，但不免使張安健的角色塑造上略顯單薄：他的死是為了救人，還是\n\n因為對未來絕望？在角色的行動上沒有足夠情緒上的掙扎，像是為了成就悲\n\
  \n劇而死。而俞康敏的存在感雖強，但她的人生彷彿都在為男人想辦法、照顧\n\n男人，即使她擁有能力與資源，卻更執著於被愛以得認可，所以她雖然情感\n\n豐沛強烈，行事動機卻相當單一。也因為她與保、安之間的距離，這段友誼\n\
  \n像是她苦求得來，她愈努力、付出愈多，回想起來愈覺悲傷。\n\n\n\n　　《環南時候》設定既多，野心亦大，但鋪陳與情感未所能及，以致每個\n\n場景演員表現出來的情感雖然豐富，但大多缺乏層次，對我來說只能理解而\n\
  \n無法感受。或許每一條線的情節設計，都有給自己人看的私密；每一個設計\n\n的「時候」，都有一個穿越的入口。那麼，不在自己人的範疇，沒有找到那\n\n個入口，就只能像陳耀華仰視著頂樓的陳保定，用記憶的相機，留下那個足\n\
  \n以留存的畫面──\n\n\n\n　　如果不能，就會只是一個難解的遺憾。\n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n\
  有時候，眼睛只肯告訴我這麼多。\n\n                                  陳斐雯  貓蚤札（其三）\n\n--"
