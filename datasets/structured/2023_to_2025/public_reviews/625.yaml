url: https://www.ptt.cc/bbs/movie/M.1767077422.A.B5B.html
title: '[好雷] 不認識也會哭的紀錄片：PTP 永遠不滅'
content: '前陣子偶然點開了這個friday獨播的日本樂團紀錄片

  不看還好 一看我就掉進了PTP的宇宙裡了...

  內容大概是由成員親述PTP成團以來的點點滴滴

  我原本完全不知道他們是誰 也沒聽過他們的音樂

  卻因為這部片開始一點一點了解他們

  片中不乏帶到一些團員的日常相處、音樂信念 也有很多珍貴的團練畫面

  後面也記錄到主唱K生病、離世 感動的層面也很到位 整體看下來也很流暢 不會冷場

  算是適合老粉也適合新粉的一部紀錄片


  看完片之後開始聽他們的歌

  每首都非常好聽 但我最喜歡的還是Pictures



  歌詞超級觸動又好有畫面感 百聽不厭

  可惜我太晚認識你們了 好想去12年的大港聽一次現場啊!!!


  --'
