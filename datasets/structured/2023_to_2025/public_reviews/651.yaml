url: https://www.ptt.cc/bbs/movie/M.1734782202.A.0E7.html
title: '[情報] 《新里見八犬傳》修復版 1月3日 上映'
content: '預告：



  英文片名：Legend of the Eight Samurai

  類型：修復重映 / 時代 / 經典小說改編

  導演：深作欣二 FUKASAKU Kinji

  原作：《新．里見八犬傳》鎌田敏夫


  1985 日本電影金像獎最佳導演、男主角、女配角提名

  1985 法國 Avoriaz 奇幻影展

  ★ 名導深作欣二雜揉東方傳奇、西方美學的劃時代經典鉅作

  ★ 美國歌手約翰班諾演唱經典電影主題曲〈Satomi Hakken Den〉，開創經典、轟動影壇

  ★金馬影展修復經典重現後再掀討論巔峰，跨時代經典再連結


  【演員卡司】

  《W的悲劇》藥師丸博子

  《末代武士》真田廣之

  《追殺比爾》千葉真一

  《柳生家族的陰謀》志穗美悅子

  《愛之物語》萩原流行


  【故事簡介】

  忠犬降妖伏魔、真愛領路前行，華麗之役即刻開戰。


  煙硝四起，館山城主里見家遭仇家攻陷，幾乎滅族，唯獨靜姬公主倖存，仇家誓言斬草除

  根。公主獨自逃亡，為孤兒親兵衛所救，而身懷神珠、散落各處的八名將士們也一一聚首

  。世紀之仇重啟，百年傳說成真，舉世生靈塗炭、怪物肆虐之時，親兵衛與靜姬的愛情正

  悄悄萌芽。


  《新・里見八犬傳》是依據日本作家鎌田敏夫所撰寫的同名神怪小說，1983 年於日本上

  映時一度造成轟動、創下23億日幣影史票房紀錄。由《水手服與機關槍》聲名大噪的藥師

  丸博子，聯手影帝真田廣之共譜百年宿命的青春愛戀，名導深作欣二的劃時代經典雜揉東

  方傳奇、西方美學，古裝奇幻混搭西洋搖滾，破天荒邀請美國歌手約翰班諾演唱主題曲〈

  Satomi Hakken Den〉，如此雜揉東西方文化的呈現方式，乃是當時的首度創舉，影響日

  本往後電影或電視劇的製作基礎。如今以4K修復之姿世紀回歸大銀幕，前衛風格與華麗視

  覺重磅再現！


  --'
