url: https://www.ptt.cc/bbs/movie/M.1738344892.A.AD1.html
title: '[討論] 有雷，八犬傳之沿革'
content: '有雷，八犬傳之沿革

  《紅樓夢》55回目賈母分析故事結局，說道：


  「這些書都是一個套子，左不過是些佳人才子，最沒趣兒。把人家女兒說的這樣壞，還說

  是佳人，編的連影子也沒有了。開口都是書香門第，父親不是尚書就是宰相，生一個小姐

  必是愛如珍寶。這小姐必是通文知禮，無所不知，竟是個絕代佳人。只一見了一個清俊的

  男人，不管是親是友，便想起終身大事來，父母也忘了，書禮也忘了，鬼不成鬼，賊不成

  賊，那一點兒是佳人？


  缺甚麼就寫甚麼，大抵如此，八犬傳最初也不例外


  我最早是接觸深作欣二版，

  當時只被特效吸引，忽略了真田廣之和藥師丸私奔，是如此大逆不道

  何況真田廣之演出的親兵衛最初還是盜盔甲裝武士，把八顆寶珠比喻成睪丸的鄉野匹夫

  不過我佩服深作欣二，藥師丸博子不是傻，而是逃出封建的勇者

  讓博子放箭終結玉梓，堪稱一絕


  湯淺正明的動畫卻直指一個可悲事實，八犬士就算是武士，還不就是里見家的狗嗎

  想當初湯淺正明真是破釜沉舟，直指對玉梓背信的里見家也不是好人

  解除里見家現存危機，八犬士也各自逍遙了，老子自由了！


  瀧澤秀明日劇版做出了大革新，伏姬和玉梓百合了

  我實在看不起瀧澤秀明的演技，因為菅野和仲間演技超神，

  就算結局是蕾絲邊我也興然接受


  而這是站在瀧澤馬琴眼中看故事

  我卻有許多無奈

  原來玉梓是他的平民老婆阿百

  伏姬其實是他的長子瀧澤宗伯

  終究，瀧澤馬琴最在意的是武家夢

  他是被八犬士擁上天國

  但那裏沒有伏姬＝宗伯


  --'
