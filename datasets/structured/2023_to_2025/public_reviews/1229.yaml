title: '[好雷] 《銀河鐵道之夜》-「孤獨又共享」的生命 '
content: '或許朋友們有看過書


  這部古早動畫目前YT電影和中華電信Hami Video都還看的到










  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  刊登於方格子的原文 (含劇中人物貓咪劇照)




  《銀河鐵道之夜》1985 動畫，宮澤賢治1934年出版知名文學改編，文本與其說是兒童故

  事，倒不如說「回到原初」。例如《小王子》說是兒童文學，但有人說沒過什麼人生經歷

  ，怎能體會箇中深刻道理；如晚餐幫家人買飯，在客廳吃便當看著三立「超級紅人榜」不

  到十歲小孩唱著陳一郎的滄桑的成名曲：《紅燈碼頭》同樣的疑問？但唱得也是有模有樣

  ＸＤ。



  也許正是那既深遠又簡單的道理（正如在《地獄使徒》文中說過，抽象的必要性，意味最

  終並非是劇情、議題的複雜度，而是，道─意義─邏輯上的有跟無）。故事描述主角晚上

  無意搭上了周遊銀河鐵道上的火車，並且與一位朋友一起冒險，後來才知道朋友在現實中

  意外死亡，而才知道此「銀河之旅」他再煤 袋星雲下車，頭也不回的道別之旅。

  《銀河鐵道之夜》並非當今科學劃分現實世界：階層、尺度、大小清楚分明，而是太空─

  銀河─星星與村莊─河流─人跟人交會，不同限度的微觀和宏觀都像是同一件事情，一如

  曾經說過：任何地方、任何時間，蘊含了一切、所有 。



  時代性動畫（細野晴臣配樂）有其必要（貓咪造型天真可愛有夠加分），過往時代的迴返

  ，像是入秋的微涼，記憶空氣共振的昭和感，像是台灣人命運藏在自身成長的血液中，到

  頭來也覺得像是一種輪迴。



  動畫並不以炫目的視覺感，而是運用黑色陰影，神秘、玄妙：世界本來不就是黑的？以靜

  態繪畫感的些微變動點綴，反映習佛的宮澤賢治的大智慧，並以小故事結構寓言，如：莊

  子。



  真理是既遮蔽又開顯，好像比較用來描述真理的不可見，但最近在想「遮蔽」在這句話的

  必要性，因為我們人類始終沒有讀心術嘛~無非揭示了語言的侷限與困境，表象的必須（

  會說話的人總是在社會中佔上風 ），也是人類的悲劇性。



  有些扯遠了，《銀河鐵道之夜》在旅途中層層開啟相遇的路人智慧，在時間即是空間，星

  點即是塵埃（萬物最終都化成了 碳）。電影最終以伴隨銀河列車送行 死去好友過程體會

  「孤獨又共享」的生命，如同自己早已覺悟，堅信著身為藝術家燃燒自我，僅僅為那天空

  繁星中的點點星光，也不管到底誰看見了那細微閃爍。



  --


  拉特飯 - 以商業力量進入獨立市場


