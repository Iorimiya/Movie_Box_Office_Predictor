title: '[普好雷] 《離不開你的依賴》，對不起我還活'
content: '部落格版：


  若從片名與預告來看的話，確實會將《離不開你的依賴》想成是一部愛情電影，實際上它

  似乎也真的是部愛情電影，至少觀眾所看見的，是愛情電影的外包裝。只是藏於男女談情

  說愛之下的，是導演山口健人真正想透過電影說的，關於現代社會上越來越普遍的一種生

  活態度，而這種新式生活態度卻是和過去大眾更為追求的生活態度處於這兩種極端，用個

  比較不精準的形容就是積極與消極。從小總被長輩教導凡事都要全力以赴、不留遺憾，不

  論是在學習上或是職場上，甚至是在追逐夢想的路上，都不該遇到挫折就輕易放棄，於是

  我們可以想成，這樣努力認真的面對生活，也許才是符合期待。只是當時代變遷，這種生

  活態度不再是唯一，對生活不再抱有熱情，字典裡沒有不枉此生四個字，認為只要有好好

  活著就好的人越來越多。當兩種極端生活態度相撞，互相無法理解與忍受的矛盾，無疑成

  了拋給觀眾去思考的一個有趣問題。


  其實剛開始很討厭女主角莉奈，幾乎無法忍受她軟弱的性格、軟爛的生活方式，會不曉得

  為什麼男主角修一可以這麼久還沒跟她分手？而奇怪的是，看到後來反而會逐漸對修一感

  到厭煩，那股莫名的煩躁感隨著劇情到後來才終於有了頭緒，原因或許都來自於兩人的生

  活態度。莉奈其實就是上面提到的，近年來在現代日本社會越來越多年輕人所有著的新生

  活態度，以近乎虛擲光陰的消極面對生活，不刻意去追求什麼而是就這樣讓日子一天一天

  的過去，不張揚、不低調，安安穩穩的過著自己的生活。看似沒什麼問題，但無奈問題就

  是這樣的生活態度和你我認知的、所謂的活著「該有的」樣子不一樣，莉奈這種同樣是正

  確的生活態度對過去我們認為的正確的生活態度造成衝擊，一時半刻的難以接受化成了對

  莉奈的討厭。直到莉奈問著修一她的問題、問著「好好活著不就好了？」時，對她突然就

  無法討厭了。


  是啊，為什麼人不能好好活著就好？為什麼非得要有熱血充實的人生、或者要有個明確為

  生活奮鬥的目標，才能算是有活著的感覺？難道單純就為了活著而活著不行嗎？當想通了

  這點，對莉奈的生活態度似乎也能慢慢認同。當然莉奈過分的不諳世事確實不討喜，然而

  看著她後來的改變再對比著前半段，會發現她是用著過就連自己都到後來才搞懂的態度過

  生活，她與修一的關係不僅是建立在相愛之上，能讓她這樣子依賴著修一過日子，更大的

  原因是因為兩人的生活態度恰好的能夠達到微妙的平衡，既是一個願打一個願挨，又是有

  能力者對需要照顧者的優越感使然。但隨著兩人逐漸走向交叉點，這才意識到修一之所以

  不斷的原諒、包容莉奈，是他始終深信著自己的生活態度才是對的，把自己逼到緊繃、把

  壓力扛在肩上，是因為他相信在挫折與磨難之後，會是夢想成真的海闊天空。直到莉奈輕

  易的得到了他努力想得到的，挫敗感動搖甚至摧毀了他的堅信不疑，對莉奈的態度丕變，

  原來他始終都看不起莉奈。



  「你到底喜歡我那一點？」


  「妳看起來很可憐。」


  如同前面說到的，莉奈和修一兩人之所以能夠至今相安無事，是因為兩人的生活態度剛好

  的達到平衡，但當這個平衡失衡，兩人關係自然會有了裂痕。陰錯陽差之下，莉奈成了修

  一所待出版社的員工，更莫名的得到了負責作家的青睞，隨著莉奈收穫更多讚美、取得更

  好成就，修一的危機感可以說是逐日上升，自己比莉奈好的優越感受到打擊，所以當莉奈

  終於把自己過得更像是「有活著的感覺」時，修一那比起不滿更像嫉妒的情緒於是宣洩。

  「你就不能為我加油嗎？」，莉奈自此決定離開修一，不再依附修一而活，明明當初是修

  一留下了她、明明當初修一也希望她變成他期望中的樣子，怎麼現在反而走到分開這一步

  ？


  「你覺得這裡可以一起走過去的嗎？」


  莉奈和修一最後就好像《七月與安生》裡的七月和安生，他們都在後來活成了對方原本的

  樣子，修一成為作家的夢想被莉奈實現了，而莉奈只想好好活著就好的生活態度被修一繼

  承了。一年後的重逢，聊著聊著莉奈逃離了那間兩人當初認識的燒烤店，然後停在了平交

  道前，問著修一一個問題之後便跑了過去，留下修一在平交道的另一頭，電影停在這裡。

  散場之後我始終在想，修一有沒有繼續追上去？而莉奈又是怎麼想的？導演山口健人沒有

  明確答案的結局其實有點感傷，我想莉奈還是愛著修一的，說實話如果修一開口說復合她

  是會留下的，可是在燒烤店看著成為過去自己的修一，莉奈心裡肯定難受，如果過去的日

  子裡，兩人會因為這些事爭吵，那即使復合了是否會重蹈覆徹？不過是關係上互換而已。

  電影裡兩場爬上超長階梯到高點眺望整座城市的戲，修一和莉奈誰前誰後的配置，似乎直

  指了這段關係裡的變化，莉奈口中問著的「一起走過去」充滿遺憾。



  導演山口健人用男女關係裡的變化來探詢著對現代人生活態度的轉變帶來的影響，而像是

  為了讓觀眾能更加清楚的知道他想表達的，他更用著修一所喜歡的純文學和莉奈擅長的心

  情隨筆等兩種不同的文學風格，隨著時代變遷喜歡的人與重視程度的減少與增加，來比喻

  著兩種生活態度的消長，同時也是讓觀眾清楚感受心裡後來對莉奈的共鳴所為何來，因為

  隨性不拘的心情隨筆比起純文學更能在這個網路世代引起共鳴，我想這也是為什麼莉奈能

  以就連她自己說的「沒什麼文筆」出書成為作家、甚至成名的原因，修一過於被「符合期

  待的樣子」給束縛住了。只是我認為可惜的地方是，觀眾雖然早早就知道莉奈就是網路紅

  人不該活子，也藉著約莫三篇的文章內容知道她講她對生活的態度反映在了文章上頭，成

  功引起了現代與她同樣的人的共鳴，但這些本該可以讓觀眾更貼近莉奈、更清楚她整個人

  對這段感情、對她自己、對整個人生的想法，結果電影有些簡單帶過，如果內容能放在多

  篇點也許更好。


  《離不開你的依賴》既是愛情電影卻也不是愛情電影，至少它不會是多數人預期會看到的

  那種愛情電影，日本原來的片名「生きててごめんなさい」直譯的話是「對不起我還活著

  」，這其實比較趨近於導演山口健人更想藉由電影探討的部分。不過這並不表示電影的表

  現會讓人失望，劇中莉奈和修一的關係確實也相當貼合中文片名「離不開你的依賴」，因

  此可以想成《離不開你的依賴》不論是從愛情電影的角度或是劇情片的角度切入都會有不

  同的收穫與感觸。


  --'
