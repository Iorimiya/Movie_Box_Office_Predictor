  \n《臨時空缺》是羅琳完成《哈利波特》系列後的第一部小說，以成人為主要目標讀者，故\n事背景設定在一個名為「Pagford」的英國小鎮，表面上看來是風景美麗純樸的鄉村，背\n\
  後卻隱藏著包含政治、種族、娼妓、毒品等各種社會議題。坎邦在劇中飾演主角霍華莫里\n森（Howard Mollison），該劇由BBC和HBO共同製作，所以未來不只英國，在美國的觀眾\n\
  也有機會收看。\n\n\n\n--\n                                                            \
