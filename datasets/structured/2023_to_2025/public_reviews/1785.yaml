title: '[新聞] 再續前緣!美國隊長、黑寡婦新片浪漫冒險'
content: '再續前緣！美國隊長、黑寡婦新片踏上浪漫冒險


  新聞網址:


  在告別漫威銀幕宇宙之後，「美國隊長」克里斯伊凡和「黑寡婦」史嘉蕾喬韓森將在新片

  中踏上一場浪漫冒險之旅。


  克里斯伊凡和史嘉蕾喬韓森的合作經歷十分豐富，除了四部《復仇者聯盟》和《美國隊長

  2：酷寒戰士》、《美國隊長3：英雄內戰》之外，兩人還曾在2004年電影《極速A計畫》

  和2007年電影《豪門保姆日記》中一起同場飆戲。


  在《復仇者聯盟：終局之戰》落幕後，「美國隊長」克里斯伊凡回到過去跟佩姬卡特共度

  一生，「黑寡婦」史嘉蕾喬韓森則為了靈魂寶石而英勇捐軀，兩人都頭也不回地離開了漫

  威銀幕宇宙，邁向下一個階段的演員生涯。


  根據Deadline報導，浪漫動作冒險新片《Ghosted》請到了兩人聯手主演，並由《飛躍奇

  蹟》、《火箭人》導演戴克斯特佛萊契執導，劇本則是出自《惡棍英雄：死侍》、《屍樂

  園》編劇搭檔保羅韋尼克和雷特瑞斯之手。


  我們目前對劇情細節仍一無所知，但可惜的是，觀眾將無緣在大銀幕上看到兩人共譜戀曲

  ，因為本片是由Apple TV+和天舞媒體所操刀製作，屆時只有在Apple TV+上才能欣賞到本

  片。


  由甲骨文公司創辦人之子大衛艾利森所成立的天舞媒體近來動作頻頻，不斷挖角漫威影星

  來跨刀演出，「齊爾蒙格」麥可B喬丹主演的《冷血悍將》、「星爵」克里斯普瑞特主演

  的《明日戰爭》便是絕佳例子，如今又力邀克里斯伊凡和史嘉蕾喬韓森攜手合作，顯然有

  意在後終局之戰的好萊塢中大顯身手一番。


  --------------------------------------------------------------------------

  從漫威宇宙畢業後 以為合作會變少

  沒想到這麼快就有消息了

  真期待他們後續的合作


  --'
