title: '[新聞] 兩代龐德與龐德女郎【暴動之城】再續前緣'
content: '新聞網址：



  「全球最性感大叔」丹尼爾克雷格（Daniel Craig），因為演出《007》系列電影，成為家喻戶曉的一線男星。不僅如此，根據《綜藝》（Variety）雜誌調查，丹尼爾以第25部「007」電影的2500萬美元片酬，登上「好萊塢新片片酬排行榜」冠軍，成為當今全球片酬最高的明星。令人驚訝的是，身價如此高的丹尼爾，竟為了參與奧斯卡提名女導演的新片《暴動之城》（Kings），甘願降價演出，在片中飾演一位全心保護孩子的廢柴大叔，並展現出他從影以來最暖心的演出。值得一提的是，和他搭檔的女主角，則找來曾在《007誰與爭鋒》（Die
  Another

  Day）飾演「龐德女郎」的奧斯卡影后荷莉貝瑞（Halle Berry）擔綱。雖然當時和她共演的是前代「007」皮爾斯布洛斯南（Pierce Brosnan），但《暴動之城》也意外促成隔代「龐德」與「龐德女郎」的全新合作，讓本片備受影迷期待。《暴動之城》即將在6月1日於台灣動人獻映。





  現年50歲的丹尼爾克雷格，十多年來已經主演四部龐德電影。雖然當初他接演龐德一角時，曾被看衰、甚至被冠上「史上最醜007」、「最矮龐德」等稱號，但電影問世之後，他為龐德塑造的全新硬漢形象，也獲得廣大好評，尤其2012年的《007：空降危機》（Skyfall）更在全球大賣11億美元，讓他成為「史上票房最高的龐德」。他深刻內斂的演出，也被影評人讚許為「史上最會演戲的龐德」。除了007系列電影之外，他也積極參與許多其他電影作品，展現多方位的演技實力。尤其《暴動之城》的導演，就是曾以《少女離家記》（Mustang）提名奧斯卡最佳外語片的女導演，ꘊo最新執導的英語新片，也因此受到丹尼爾的青睞，甚至願意為了本片降價演出。



  本片以1992年震驚全球的「洛杉磯暴動」作為故事背景，丹尼爾在片中飾演一位脾氣火爆的廢柴大叔，與飾演鄰居的荷莉貝瑞互看不順眼；但在「洛杉磯暴動」期間，卻幫助她保護孩子們，與荷莉貝瑞培養出動人牽絆。丹尼爾層次豐富的演出，讓人見識到他鐵漢柔情的一面，也難怪曾與他共演的男星查寧塔圖（Channing
  Tatum）也大讚：「丹尼爾克雷格真的太讚了！他不只是007龐德，他可以讓任何角色成真！」





  值得一提的是，丹尼爾克雷格與愛妻瑞秋懷茲（Rachel Weisz）結婚7年後，瑞秋終於在今年宣布懷孕。雖然他與前妻也育有一位25歲女兒，但即將再度當上爸爸，還是讓他喜出望外。瑞秋懷茲日前接受《紐約時報》（The
  New York

  Times）訪問時表示：「丹尼爾跟我都非常開心，我們家裡即將要有一個小寶寶，我們真的等不及想見到她（他）了！」也正因為如此，對照到丹尼爾在《暴動之城》的角色時，反而透露出他「慈父」的潛力。片中他將帶著孩子們一起玩樂，並在險象環生的暴動當中，英勇保護這群孩子們。時而嚴厲、時而溫柔的奶爸模樣，演來完全不費功夫，也讓本片勢必成為他從影以來的最暖心作品。



  這部以「洛杉磯暴動」為故事背景的《暴動之城》，即將在6月1日於台灣動人獻映。本片劇情描寫一位充滿愛心、堅強善良的單親媽媽蜜莉（荷莉貝瑞飾演），收留了八位無家可歸的孩子，並計畫收留更多孩子。她們居住在全是非裔、拉丁裔與韓裔居民的社區當中，鄰居歐比（丹尼爾克雷格飾演）是這個社區唯一的白人住戶。這段期間，一位非裔平民被四位警察以不當武力對待，不過這四位警察卻被法院無罪釋放，此舉讓社區中的不滿與憤怒達到顛峰，進而引發一連串暴動。這使得蜜莉不得不與歐比聯手合作，設法在混亂的環境中保護她的孩子們，並將孩子安全帶回家…。



  欲知本片最新消息，

  請上電影官方部落格

  與臉書粉絲團查詢。



  --'
