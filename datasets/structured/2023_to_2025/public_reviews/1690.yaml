url: https://www.ptt.cc/bbs/movie/M.1683627037.A.749.html
title: '[好雷] 危險療程-很不大衛柯能堡?'
content: "衝著大衛柯能堡跟卡司去看\n第一時間還沒認出亞拉岡 儘管整部片似乎不太大衛柯能堡\n其實還蠻線性照時間的敘事 但確實把一樁史實的恩怨拍的蠻好看\n\
  \n當時的綺拉美色動人 或許掩蓋了點身材似乎說服力不足以讓榮格瘋狂的\n不過前半段演精神有問題還沒有說服力的\n前面有一段演的有夠像猩猩我都想當時年華的她好像沒必要犧牲成這樣啊啊\n\
  \n大抵上就是榮格與女主角的情怨恩仇\n當扯上了伊底帕斯情結的佛洛伊德 整個恩怨鮮活了起來\n\n演員演技也都好 只可惜因為電影的表現方式跟篇幅\n似乎短短時間內不足盡數三者間恩怨的細節\n\
  只能刻意省略某些部分 也避免變成流水帳\n\n\n 網路上找到兩篇蠻詳盡的補述\n看完電影有興趣的版友們 不妨參考~\n\n--"
