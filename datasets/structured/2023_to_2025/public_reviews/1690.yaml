url: https://www.ptt.cc/bbs/movie/M.1747177240.A.1B9.html
title: '[普好雷] 危險療程'
content: '防雷




























  大衛柯能堡的電影我好像嚴重水土不服

  這次感覺有比較通俗一點了,但還是差不多

  聽說綺拉奈特莉有露點,那我就不客氣了

  這次她瘋癲的演技倒是蠻新鮮的

  跟過去我看過的氣質出眾的他來比的話

  我是沒那麼喜歡,這種表演難度本來就高了點

  倒是麥可法斯賓達的表演有比較吸引我

  那種遊走在道德邊緣的掙扎真是精彩

  不只是婚姻的道德,更是牽扯到醫德

  跟維果莫天森的對手戲,那個思辯也很有意思

  你是該以性這個佔很大比重的現象看待一切

  或者是能考慮用其他比較隱晦的方式

  這部電影可以多少讓你思考這些事情

  所以也就比較通俗一點

  這些人在歷史上最後的結局也是各有所屬了

  所以說心理學嘛,真是足夠有趣


  ----

  Sent from  on my Samsung SM-S9280


  --

  要是人生有五次就好了。

  這樣的話我五次都要住在不同的地方

  五次都要吃不同的東西吃的飽飽的

  五次都要做不同的工作

  然後五次都要，喜歡上同一個人


  --'
date: 2025-05-14
