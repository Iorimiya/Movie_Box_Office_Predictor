title: '[選片] 寂寞公路/危險療程'
content: '週末電影夜自己在U2候位


  猶豫著要看危險療程還是寂寞公路，距離預約時間還有一小時，故來請教各位鍵盤奧斯卡

  評審推薦。



  如果有其他建議也很歡迎～


  希望風格：

  婁燁滅[和園（蠻適合今天六四觀看，但我已經看過兩次了）

  王家衛概琲甄鑑讞]


  其實很想看婁燁的「花」，不過電影院沒有...（哪裡可以看得到啊？）


  謝謝各位評審（鞠躬）


  --'
