url: https://www.ptt.cc/bbs/movie/M.1714968318.A.BC6.html
title: '[好雷] 帝國浩劫：美國內戰─真的不是戰爭爽片'
content: 'A24史上最高成本的《帝國浩劫：美國內戰》（Civil War），

  是我今年看過最精彩震撼的作品之一，個人大愛。


  但要再強調一千遍，這真的不是戰爭爽片，

  不是諾曼第大空降、黑鷹計畫、搶救雷恩大兵......

  而是以內戰為背景的公路電影。

  喜歡劇情片的人應該能享受其中，

  如果是新聞傳媒從業人員更會深受重擊。


  導演Alex Garland過去的編導作品我都滿喜歡的，

  包括執導的《人造意識》、《滅絕》、《們》，

  以及擔任編劇《28天毀滅倒數》、《太陽浩劫》等。

  這次果然沒失望，很推薦去大銀幕享受音效。



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  美國內戰開打後，

  4位戰地記者試圖從紐約穿過重重險阻前進華盛頓特區，

  目的是為了成為十多個月來，

  成功採訪到躲在白宮進行困獸之鬥的美國總統的第一組人。


  這一路上，透過老中青三代戰地記者的不同心境變化，

  看見新聞攝影的力量與極限、社會的對立與漠不關心，

  更觸及何謂美國、何謂美國人的敏感帶。

  當然更有初生之犢的誕生，以及大師情怯殞落的殘酷對比。


  雖然戰爭場面只是這部電影一小部分，

  但拍得扎實驚人、逼真動魄。

  無論是攻堅、炮擊、巷戰、移防還是對峙，

  幕幕張力十足，坐在銀幕前有如戰地記者般置身現地。

  我自己真的是很享受這部電影，

  但看到負雷不少，果然A24的片很吃電波？

  或是片商的行銷方向讓人有太多錯誤期待了？



  --'
