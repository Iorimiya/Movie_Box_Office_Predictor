url: https://www.ptt.cc/bbs/movie/M.1715586798.A.699.html
title: '[詭雷] 帝國浩劫 美國內戰'
content: '有劇情雷

  =========================







  咪卡羊




  排雷中








  =========================

  個人視角：


  記者，a.k.a 世界亂源

  在架空的美國內戰尾聲

  決定大冒險去採訪總統

  出發前把不要命的蔡比八也捎上

  團隊組成計有：


  智障

  智障

  母

  一路雷

  設定23歲像個中二生

  在公路上耍完白癡後跟其他記者被叛軍抓走


  智障男女記決定用無敵記者證上前阻攔

  路上遇到的同事們就被一槍打死


  死命把團隊帶出來就死了

  在車上大特吐吐


  聽聞華盛頓特區近乎投降

  情緒激動表示

  「Too late,  didn''t die for anything good!」




  場景換到圍攻白宮

  開始耍雷

  活像《搶救雷恩大兵》厄本


  最後在耍智障人立拍照時幫擋了子彈

  死得其所


  影片在美國總統死後

  深沉的凝視中結束



  =========================


  觀後感：

  看不懂寓意，沒有娛樂性，這有反戰？

  記者do nothing good

  以為記者證無敵

  在戰地死了不是剛好

  加上每個橋段結束前都有的神奇插入配樂

  我又花錢看了三小


  =========================


  高亮點：

  記者被處決

  屋頂迫擊炮

  武裝直昇機全彈發射


  =========================


  客觀評價：


  如果主旨是表達「記者是該死的亂源」

  →我予以好評，不過還有2個活著


  不是的話

  →這什麼大便


  =========================




  --'
