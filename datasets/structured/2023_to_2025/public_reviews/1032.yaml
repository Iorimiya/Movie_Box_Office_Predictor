title: '[討論] 美國內戰導演「戰爭」爛番茄91%'
content: '台灣沒上映計畫

  《美國內戰》導演，任霹靂火、亞當術士等《戰爭(Warfare)》預告



  《帝國浩劫：美國內戰》（Civil War）導演艾力克斯嘉蘭（Alex Garland）的最新戰爭

  力作《Warfare》稍早釋出首支預告，本片由嘉蘭和《美國內戰》的軍事總監-雷曼多薩（

  Ray Mendoza）共同編劇及執導，這也是嘉蘭暫時卸下導演身份前的最後一部執導作品


  《Warfare》主演卡司網羅了：基特康納（Kit Connor）、亨利札加（Henrique Zaga）、

  威爾普爾特（Will Poulter）




  威爾普爾特最近真的蠻衰的，獨角獸之死和這部台灣都沒上映


  另外這禮拜有不錯評價的小片，無線殺機爛番茄89%，雷米馬立克的復仇反擊戰76%

  雖然有平價說復仇反擊戰有一半的復仇畫面都在預告了，蠻悽慘的


  --'
