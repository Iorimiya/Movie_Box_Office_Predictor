url: https://www.ptt.cc/bbs/movie/M.1715077178.A.D83.html
title: '[好雷] 帝國浩劫：美國內戰--也算是爽片'
content: '因為它不說教XD


  它只是呈現出來，一段老中青記者的公路旅程，所遭遇到的種種


  一開始跟朋友一起嘲笑這部預告看不懂，名不符實等，但在看了版上幾篇好雷後，起了點興

  趣剛跑去看，結論：好看！


  一段接一段的故事，卻完整而不零碎，對話也很自然，全途沒有讓我出戲，雖比不上戰爭片

  ，但結尾的戰鬥畫面也是很有魄力。


  主角們有攝影記者，所以滿常穿插定格畫面來表現所拍到的照片，很棒。聲音的處理也很讚

  ，時而靜音，時而原音呈現，時而切換成音樂歌曲，引導觀眾情緒的功力很好。


  有幾幕特別喜歡：(雷)


  --

  一行人遇到兩方對狙，男記者問一軍人說你怎麼知道躲在屋裡是誰，該軍人轉頭問另一邊的

  小記者，那邊有什麼，小記者回：那邊有人在開槍。

  (事情就是這麼簡單，先能自保再說)


  --

  一行人來到一個小鎮，那裡平靜到彷彿沒有戰爭一樣，他們到一個服飾店問女店員，妳們不

  知道在外面發生什麼事嗎？店員回你說新聞報的那些？知道啊，但我們選擇不理會它。在服

  飾店度過一段開心的時光後，女記者出來與老記者語氣深長的對話，詳細忘了，但鏡頭稍拉

  高，附近房子的樓頂站了兩個拿槍的人(和平是有代價的, 只是付的人是誰)



  原文片名「Civil War」(內戰)，其實滿恰如其份的(看完之後覺得)，然後想再吐嘈一次：

  帝國浩劫是沙毀啦XD~



  --

  原本還感動於這兩句台詞，結果下一秒好像老記者說了句：還是有熟悉的事物，然後鏡頭帶

  到屋頂，我整個wtf，從烏托邦掉回人世間'
