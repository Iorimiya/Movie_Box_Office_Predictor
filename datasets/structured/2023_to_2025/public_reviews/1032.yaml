url: https://www.ptt.cc/bbs/movie/M.1714762042.A.C12.html
title: 'Re: [無雷] 帝國浩劫：美國內戰 不錯看其實'
content: '同意，可能很多人被帝國浩劫、美國內戰騙進去以為是什麼宏大敘事

  美軍互幹、愛國心大爆發、滿滿爆破打爽爽的好萊烏式爆米花片


  但問題它不是


  更像是一個美國內戰為背景，真實惶恐到不行的公路電影


  一開始確實有點難調適，但還好我也不討厭公路電影


  電影裡其實一直有個若有似無的主軸「記者」「攝影」「暴力」間的關係


  其實挺有意思的


  有些人認為「攝影」是非常具有侵略性，極度暴力的行為。因為你就是透過鏡頭，將自身


  置身於一個安全的角度在觀看著種種面對鏡頭的照片


  蘇珊桑塔格，一個曾經歷賽拉耶佛圍城的女性作家，也曾在戰爭攝影的書中提及過：另情感麻木


  的原因，不是因為習慣，而是因為有所感而無所作為


  記者的「攝影」鏡頭下，藏著這些蛛絲馬跡


  然後可以去對照裡面出現的各種照片鏡頭


  對照每個角色的變化，尤其女主角和小女生從手持相機到XXXXX的變化，滿有趣的


  有機會有建議可以看看「旁觀他人之苦痛」「明視攝影手札」這類談論攝影的書，再來咀嚼這部片

  應該會多出不少心得


  --'
