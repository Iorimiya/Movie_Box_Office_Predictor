title: '[無雷] 評價兩極的帝國浩劫：美國內戰'
content: '這部片的主軸是美國在打內戰，勢力很強大的叛軍，正在跟美國正規軍打仗


  不過不是像白宮末日或者首爾之春這一種，今天判軍進攻哪裡哪裡，防守方用什麼戰術與武器來守之類的


  他主要是利用戰地記者跟小人物的角度，來表達全國上下人心惶惶、草木皆兵的高壓氛圍，而且呈現的非常好


  可以想像一下台灣如果15個縣市要推翻政府，各地軍團聯合起來跟國軍打起來，社會會呈現什麼樣的樣子，大概就是那種感覺


  可以理解很多人覺得他很難看的原因


  如果要從戰爭片或英雄片的角度來說他真的沒有什麼，很多橋段也有點刻意


  但看這部片不要想太多背後的原因，主要感受的是那一種氛圍


  當然不可免的有拍戰爭的部分，雖然畫面集中在最後面，篇幅也沒有到太多，但這部片處理起來也是非常棒，音效一級棒，臨場感很強，士兵們的專業度也都有出來，非常推薦


  評分8.1/10





  -----

  Sent from JPTT on my Google Pixel 6a.


  --'
