url: https://www.ptt.cc/bbs/movie/M.1714559616.A.4FF.html
title: '[大負雷] 帝國浩劫 美國內戰'
content: '這部就是精彩片段都在預告

  差不多有50分鐘都很悶

  聽鄉村歌謠、看風景、聽各個角色講很有意境的台詞

  最糟糕的是

  預告跟海報宣傳都認為是戰爭片

  英文片名也是Civil War

  戰爭內容卻少之又少

  劇情很A24

  畫面很A24

  風格很A24

  那就不要當戰爭片宣傳啊

  能救一個是一個

  想看戰爭片的千萬不要花錢去看！




  補充一下：

  A24的電影看過不少也不覺得差，但預告誤導成戰爭片就是有很大落差因為跟期待完全不同，我看的這場也是有人中途就離場

  看了一下送的海報，上面是兩個狙擊手在自由女神的火炬上瞄準…宣傳海報也是像戰爭片…



  -----

  Sent from JPTT on my iPhone


  --'
