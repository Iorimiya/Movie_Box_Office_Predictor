url: https://www.ptt.cc/bbs/movie/M.1713806494.A.069.html
title: 'Re: [負雷] 美國內戰：別浪費時間看'
content: '這部只能在電影院看 因為他的音效有著非常誇張的 dynamic range


  但是想看大場面而去看啥max之類的就可以省錢了


  小女孩完全不必要 反正記者就只是代替觀眾身歷其境用的


  有點像 Sicario 女主角的功能 但 Sicario 好歹有女主抽絲剝繭的節奏


  這部完全不想跟你揭露啥 角色台詞也早說了 記者只紀錄 讀者自行發問


  (甚至我認為很多人反而會因為小屁孩亂搞而厭惡


  對啊 前一秒有人因就你而死而哭泣 下一幕又繼續搞事害死更多人 重複數次)


  畫面 節奏 電影語言 就非常 A24 ~~ 玩高概念 悠悠慢慢 人淡如菊


  反正不建議當戰爭片或動作片看 公路電影或偽紀錄片也勉強


  建議當 MV 看


  (構圖是不差  可是 Deakins 掌鏡的 Sicario 明顯更厲害)



