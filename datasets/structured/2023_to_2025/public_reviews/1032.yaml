title: '[負雷] 美國內戰：別浪費時間看'
content: '前兩天去看完這部爛番茄評價很高的

  只能說基本上只要幹美國政府的電影

  美國人就能把評價洗的不低

  哪怕本質上是爛片

  （世界第一強國的傲氣？）


  先說，我個人認為

  主線劇情是電影的生命線

  沒主線的電影就是垃圾

  跟你寫作文然後連題目都沒令好一樣


  主線可以低俗、直白、簡單、無腦

  但你不能沒有主線劇情

  可惜這部片真的沒有


  一開始直接說美國內戰了

  也沒講為什麼內戰只講分裂了

  然後鏡頭就帶到一個大媽記者

  你以為有什麼劇情要交代嗎？

  沒有，她就去拍照片的而已

  然後偶遇一個屁孩覺得大媽拍照很帥

  想要跟大媽一樣拍就死纏爛打


  然後突然的大媽就跟同事說要去找總統interview

  然後大媽就帶著同事跟屁孩開車上路華盛頓


  一整個莫名其妙的劇情轉折

  還什麼都沒解釋就開始空拍

  空拍的景還不錯看啦

  但細想的話還是莫名其妙


  最後就到華盛頓了

  然後白宮就被幾台大車攻破了

  沒什麼打戲也沒什麼渲染

  就是純粹的空洞又打的不好看

  然後大媽就跟著大兵衝進白宮

  然後屁孩愛拍照差點被射到

  大媽去擋槍就死了

  然後大兵槍決總統

  一整個莫名其妙到底

  什麼屁都講什麼主線都沒推

  純把觀眾當盤子在薛錢


  導演根本心中沒有一個想講的故事

  就突出一個無欲則剛

  反正我錢拿好拿滿

  你愛看不看隨便你


  很多人應該是看預告那個

  你是哪種美國人才有興趣的？

  我跟你講他電影真的就是這句而已

  後續跟太監一樣

  下面就沒有了


  我看有人說三小這是紀錄片形式

  媽的紀錄片會有起承轉合

  會有主線會有反思會有後續影響

  這部全都沒有齁


  還有人說這是戰爭片

  達文西密碼裡面射的子彈都比這部多

  戰爭片打的比劇情片還爛也是難得

  你他媽什麼時候看過這麼空洞的戰爭片？


  這部真的空洞到我都不知道怎麼噴

  之前華納的蝙蝠俠至少人家有核心

  只是核心跟敘事方法爛

  這次直接突出一個什麼都沒有

  跟我是太監你就不能騙我雞雞一樣


  別浪費生命去看

  去看a片都更有收穫


  ———————————-

  更


  忽然想到有些觀眾應該是喜歡設定跟畫面

  就是那種設定有趣畫面好看故事沒差的那種

  如果你是這類的影迷的話

  我個人推薦去看使命召喚的CG

  基本上你想在這部看到的使命召喚都有…

  不只都有還做的更好


  -----

  Sent from JPTT on my iPhone


  --

  我是覺得這部沒想那麼多啦

  完全沒有阿，整部就是在空拍美國公路而已

  這到沒有，有白爛說教的話我早就每句細細品味來爆噴了，但這部空洞到連說教都沒有，拍

  的比國家地理頻道的風景介紹還爛的糞片一部

  嘻嘻，電影也沒講，就很突兀的轉到她們到華盛頓然後崩崩幾聲就衝進白宮了


  騙一個是一個，片商賺爛

  我是覺得其他國家不會愛這部，因為這部的美國沒多慘

  真的，啥屁都沒探討到還沒頭沒尾，前因後果都沒有。

  我不會說完全沒打啦但打的很短又很爛，就像我前面打的，子彈射得比劇情片還少

  就只有走來走去啊XD

  我有講空拍的不錯，演員我覺得還好，沒主線很難看出演員到底演的好不好

  這部沒有什麼道德抉擇，就什麼都沒有。

  沒有主線那導演想表達什麼？不就是用鏡頭說故事的能力有問題才會變成沒主線= =

  我能接受沒大場面，之前像是什麼愛的萬物論、氣象學家那種劇情片我也很喜歡，但我真的不能接受一個莫名其妙的東西，老話一句你要有個主線才展開所有故事而不是主線沒有，故事也沒有，就隨便拋個設定然後拍點風景

  看完記得分享感想XD我其實蠻好奇其他人看完的完整想法的

  兄弟歡迎移居新墨西哥州，保證現實的槍戰比電影刺激XD

  call of duty'
