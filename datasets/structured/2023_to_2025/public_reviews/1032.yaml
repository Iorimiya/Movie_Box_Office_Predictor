title: '[好雷] 帝國浩劫: 美國內戰  美國人臭自己? '
content: '一場沒告訴你為什麼開始


  開始時你已經身在其中的內戰


  久到成為知名戰地記者


  久到忘記正常生活該有的樣子


  久到加州德州為什麼會聯合起來跟聯邦打起來也不知道




  倒是沒忘記嘲諷美國人連自已國家也搞不清楚


  佛羅里達在美國中部? 所以你是道地美國人


  密蘇里為什麼叫索證之州不知道? 所以你是美國人


  你是科羅拉多人? 所以你美國人ok啦




  結尾的華盛頓DC攻防戰倒是給了我們戰爭片的渴望


  不過也似乎是單方面的兵力優勢


  加州德州進攻方只損失了一台悍馬上的兵力+中間加入的記者


  隨著一發子彈射到總統身上後畫上句點


  片尾上了底片沖洗過程


  拍的是加州德州聯軍在總統身旁比YA的照片


  還是沒人告訴我為什麼打起來啊?


  算了


  下個入主白宮的大概也會說


  讓美國再次偉大或之類的話吧?


  --'
