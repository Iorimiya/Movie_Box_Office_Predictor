title: '[ 普好雷] 美國內戰'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  前幾個禮拜看到預告的時候被題材吸引到

  因為第一次看到這種現代美國內戰情節

  今天有時間就去看了一下


  這部片不是什麼好萊塢槍戰子彈橫飛那種類型

  是以戰地記者的視角來看內戰

  拍攝手法滿唯美的 前中部分也給人蠻大的窒息感

  不論是以相機角度描繪出戰爭殘酷跟人性

  或是在小鎮遇到屠殺狂（這部分看的很窒息 演得很好

  都給人喘不過氣的感覺



  到後來攻入dc之後真的不知道在演什麼

  小女生莫名奇妙還是老杯杯跟女主

  然後還拍了一堆為了救他中槍的畫面

  我心中有股 看了三小的感覺

  然後最後遇到總統也是

  莫名奇妙一槍斃掉 感覺男記者也蠻開心的

  後面不知道演什麼 可能我不懂的藝術


  總而言之 題材新穎 前面運鏡配樂很不錯

  後面不知道在演什麼

  大概是這樣


  --'
