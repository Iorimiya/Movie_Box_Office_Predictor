title: '[  雷] 美國內戰,完全看不懂的一部片'
content: '美國內戰,完全看不懂的一部片


  原本是要想說看"哥吉拉大戰金剛"  >>但想說好久沒看戰爭片


  為了看這部片,還特地休假等了2小時時間


  以為大型的戰爭片,看到中間要睡著了,一直期待中間會來個高潮點


  但~完全沒有任何新的讓我覺得來看的理由.


  之後結局也完全超鳥的,一槍打死總統就結局,沒交待什麼,覺得傻眼


  可能我悟性太低,完全看不懂,可以說是近20年最雷的一部


  早知道先來這版看心得一下,真的有點覺得浪費我時間.


  應該要去看"哥吉拉大戰金剛" > 之後補看,果然好看'
