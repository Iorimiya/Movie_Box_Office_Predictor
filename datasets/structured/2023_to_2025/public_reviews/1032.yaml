title: '[  雷] 帝國浩劫：美國內戰'
content: '本來看預告片一個多月


  都滿懷期待的想要看這部電影


  今天來秀泰巨幕廳看


  只能說千萬不要被預告片騙了


  基本上精彩的地方都在預告片


  整片節奏都沉悶


  沒有交代為什麼內戰


  也沒有交代雙方的理念為何


  只是穿插一些嚇人的子彈聲音而已


  很像在看戰地記者紀錄片


  如果期待戰爭場面的人不用來看


  真心覺得今年目前最浪費錢的一次…


  --'
