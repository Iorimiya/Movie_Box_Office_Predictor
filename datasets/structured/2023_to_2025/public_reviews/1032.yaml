title: '[好雷] 帝國浩劫：美國內戰 Civil War'
content: "~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n美國內戰\
  \ Civil War\n就像做了一場戰地記者的夢\n女主一樣用SONY A7\n卻是在生死瞬間追逐快門瞬間\n華盛頓大戰就像Call of Duty\n最終戰的關卡氛圍\n\
  抑或是這樣的超現實\n斬首總統的行動\n以往只有3A遊戲呈現得出來\n片尾西軍在總統Body前開心合照\n用底片曝光地緩慢成像出細節\n年輕女主用底片拍攝這樣的生死瞬間\n\
  一樣充滿超現實夢幻的美感\n配樂充滿美式鄉村小調\n妥妥在末世之下 美國夢又可再次被重現\n用裝甲車包夾彈襲總統座車\n黑頭車開門 後座穿著高級套裝的女政要\n\
  高喊 Don’t shot 卻馬上被擊成蜂窩\n充滿超乎現實的荒謬之美\n片尾女主倒地\n男主卻恍若無事\n彷彿心中早已演練了千遍\n自若地走向總統 要他說出遺言\n\
  \n\n\n就像做了一場戰地記者的夢\n而且最終拍到美國總統的斬首行動\n或拍到女主的倒地瞬間\n從女主刪除老主編倒於車座上的照片後\n似乎內心的原則就產生崩解\n\
  不願再面對死亡\n所以最終選擇救下年輕女主\n喜歡這樣的轉折安排\n年輕女主就像女主年輕時\n繼續堅毅地拍下一切\n還好 我終究不會成為戰地記者\n還好 這一切就如3A大作真實呈現在眼前\n\
  還好 戰爭的荒謬聲響似乎只在重低音喇叭中迴盪\nThank God. We are so peace. That’s really good movie.\n\
  We love A24. Sincerely recommend.\n\n--\n      Dear  :\n           你要把人生看得透徹，一定要真實地面對人生，了解人生的本質，\n\
  \           當你終於了解人生，你就能真正地熱愛生命，然後才會捨得放下。\n           記住我們在一起的這些年，永遠不要遺忘，\n    \
  \       永遠記得我們的愛，永誌不忘，生命中的時時刻刻:\n\n\n--\n\"What Kind Of American Are You\""
