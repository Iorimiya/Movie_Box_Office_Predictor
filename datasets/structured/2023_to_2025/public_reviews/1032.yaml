url: https://www.ptt.cc/bbs/movie/M.1714669842.A.1D1.html
title: '[無雷] 帝國浩劫：美國內戰 不錯看其實'
content: '帝國浩劫：美國內戰

  先別被片名騙了

  他不是什麼全面攻佔 搶攻白宮那個系列的電影

  也不是現代戰爭片(call of duty)


  其實片子的主軸是圍繞在第一代蜘蛛女飾演的戰地記者的公路之旅上

  藉由戰地記者的視角去看一場美國人內戰(戰亂)的故事

  雖然大部分時間的確沒甚麼戰爭畫面

  但你要說他沒有戰爭場面嗎 其實還是有 而且後面有一段蠻長的 拍得也很好

  總體篇幅不多 但幾場戲給人心裡的震撼都還蠻充足的


  這部的演員表現 畫面 配樂 流暢度 都是上流水準


  我會看這部是也衝著導演去的

  他的滅絕 人造意識 我都還算喜歡


  我自己是覺得還蠻好看 也蠻享受

  不會想睡覺  看到後面也是蠻緊張刺激


  不過非常可以體會很多人覺得難看或什麼的

  畢竟這不是一部討人喜歡的電影


  老實說你對這些角色很難喜歡起來

  甚至某些角色感到極度厭惡

  劇情也有點莫名其妙

  很多畫面又很像在看風景畫  然後結尾應該超多人不爽


  儘管這樣  我覺得這部的題材  從這個角度出發

  來描繪不管是戰地記者  美國內戰的故事  還是蠻有趣 拍得蠻好


  我覺得推薦給想看不一樣風格的公路電影的影迷來看


  以上


  --'
