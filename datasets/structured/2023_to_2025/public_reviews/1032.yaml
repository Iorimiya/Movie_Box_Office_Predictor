title: '[超好雷] 帝國浩劫：美國內戰'
content: '防雷































  對你來說美國代表了什麼？

  世界上最強大的國家？最沒有極限的國度？

  我想以上皆是吧,美國是個好壞極其明顯的地方

  這部電影一看就知道是要拍出美國不好的一面

  就這點他的表現入木三分

  很好的點出美國的部分問題

  還有身為記者在職業和個人之間的掙扎

  基本上中年和年輕記者的戲份扛起了這些

  後面兩人個性彷彿切換也很精彩

  但也暴露了中年記者的鋪陳很不足

  她後面的戲份很像是跳過幾個片段

  只有這個是比較明顯的缺點,其他我都喜歡


  很多人詬病的場面問題我是覺得還好

  槍戰都滿寫實,最後攻堅也很精彩

  應該是說比起這些槍戰

  那些在路上驚心動魄的過程才是精髓

  無論知不知道對方身份都要開殺

  中間的安寧插入的很不自然（讚美

  原來是出賣自己的自由換來的！

  這些片段都精準打在我的點上

  我不知道美國乃至全球以後會不會走到這步

  我只知道在我們左腳已經踏入混亂的此時此刻

  該如何避免事態越來越嚴重,這時多來些警示總是好


  ----

  Sent from  on my Samsung SM-S9280


  --

  如果我是那雨滴的話...

  那麼，我能夠像把不曾交會的天空與大地連接起來那樣...

  把某人的心串聯起來嗎？


  --'
