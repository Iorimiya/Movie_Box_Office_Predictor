url: https://www.ptt.cc/bbs/movie/M.1715242524.A.7CB.html
title: '[雷] 美國內戰 不是戰爭片的戰爭片'
content: '這部劇情和敘事方式個人覺得不差，但預告片和海報圖都包裝的像大場面戰爭片，實際上就

  是一群記者的公路之旅和路上的所見所聞


  雖然說中間和尾段都有一些交戰的部分但並不是本片的看點，所以是懷著看大場面的人應該

  會看的很幹


  這部前中期敘事比較慢，大多賣點都是在人物的台詞上和小女角的心理狀態變化，從一開始

  看到屍體嚇得不清到可以將生死置身於事外的不要命跟拍，比較有趣的是電影中一些瑣碎的

  劇情，但論劇情深度感覺又不夠深入


  個人唯一反感的地方就是整部電影的配樂都在很奇怪的橋段穿插，而且好幾首歌我覺得是難

  聽到不行又配不上畫面，音效的部分感覺中間幾幕聲音大到像Jump scare，不知道是不是影

  廳的問題...


  --'
