url: https://www.ptt.cc/bbs/movie/M.1714923152.A.6A3.html
title: 'Re: [負雷] 美國內戰：別浪費時間看'
content: "因為想寫的跟原Po那篇文章&留言的主軸不太有關\n\n所以另寫一篇\n\n啊這篇跟電影的關係...大概就只是從學理上補充背景一些的合理性啦...\n\
  \n\n----\n\n\n\n\n關於E大寫的這點，\n\n我相信部分州聯合對抗聯邦一事，大家不太有爭議，畢竟歷史上就有發生\n\n主要會引起討論的是加州跟德州聯合一事\n\
  \n\n從現在看來，認為非常荒謬/好笑很合理，\n\n畢竟這便是2000年到現在，美國總統大選的格局——關鍵在搖擺州\n\n只不過呢...歷史上並不一直是這樣的\n\
  \n\n到上世紀30s、40s左右，\n\n美國南方州可以說是民主黨的天下，\n\n而共和黨掌管著北方州\n\n\n不過，在時代使然的人口遷移下(這是最簡白的敘述，當然有更多細節)\n\
  \n從北方州移動到南方州的家庭將原先的政黨傾向一同帶到了南方\n\n使得美國政治版圖出現一點鬆動(但還不能說是改變)\n\n這整個現象被政治學者稱為政黨解組Partisan\
  \ dealignment\n\n\n~~~(時間快轉)~~~\n\n\n60年代時，民權運動的興起加速了政黨重組Partisan Realignmnet的發生\n\
  \n----小視窗--------------------------\n\n當時南方的趨勢是民主黨有衰弱，但共和黨能否控制還不確定\n\n因此稱作dealignment\n\
  \n後來代表著共和黨取代民主黨的翻轉，意味選民有了新的傾向\n\n因此稱作realignment\n\n-------------------------------------\n\
  \n之所以民權運動會是關鍵，\n\n簡單說是因為當時南方選的民主黨的總統Johnson\n\n居然簽署了民權法案....讓南方人深感背叛\n(要知道這玩意更早的源頭就是讓南方州脫離聯邦的原因)\n\
  \n所以在一系列的發展下，民主黨與共和黨的定位互換了\n\n政治版圖也大幅度更迭\n\n\n而這還只是總統大選的層面喔\n\n加州在2003年選了那位終結者當州長\n\
  \n那位終結者是共和黨籍的喔，還當了兩任呢(雖然有被批評當的蠻爛就是)\n\n----\n\n因此，德州跟加州從來都不是不可能合作\n\n\n最後最後，如果讀完以上實在仍難以用美國的脈絡去理解\n\
  \n那就想一下，林肯的黨派是哪一黨?\n\n他是共和黨人喔~~~\n\n-----\n\n--\nㄜ.....我部份同意你說的，關於以自身經驗去反對那段\n但這裡美國政治版圖變化的邏輯/脈絡\n\
  跟選舉時台灣政治兩黨對抗以及合作的邏輯完全不一樣喔\n\n                       ^^^^^^^^^^^^^^^^^^^^\n這句我真的看不懂，可能要請你多解釋\n\
