url: https://www.ptt.cc/bbs/movie/M.1705069719.A.6EE.html
title: '[新聞] 《帝國浩劫：美國內戰》德州加州結盟鬧獨'
content: '新聞網址：



  《帝國浩劫：美國內戰》德州加州結盟鬧獨立「對抗總統」 預告掀熱議


  記者許瑞麟／綜合報導


  電影《帝國浩劫：美國內戰》由《人造意識》、《滅絕》導演艾力克斯嘉蘭（Alex

  Garland）執導，耗資7500萬美元（約23億台幣），為A24史上最高成本的作品，故事描述

  距今不久的未來，美國爆發史上最嚴重的內戰，一群戰地記者因此踏上驚險的旅程。


  其實本片劇情細節至今仍未曝光，但它腦洞大開又緊張刺激的前導預告，讓許多權威媒體

  都將本片列為「2024最值得期待的電影」。片中最令人好奇的部分，就是加州和德州竟然

  結盟，帶領19個州脫離聯邦，對抗美國總統，政治光譜截然不同的兩個州，究竟為何會站

  到同一陣線，已經成為熱議焦點。還有陰謀論者認為，《帝國浩劫：美國內戰》其實是「

  影子政府」的「預示性調控」（Predictive Programming），讓美國民眾為即將到來的真

  正內戰做好心理準備。


  《帝國浩劫：美國內戰》卡司囊括《貓王與我》卡莉史派妮（Cailee Spaeny）、《蜘蛛

  人》克絲汀鄧斯特（Kirsten Dunst）、《毒梟》華格納莫拉（Wagner Moura）等演員，

  將於4月26日在台上映。







  怕…


  --'
