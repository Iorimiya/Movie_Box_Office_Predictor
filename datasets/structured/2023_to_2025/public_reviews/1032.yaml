title: '[好無雷] 帝國浩劫：美國內戰'
content: '個人無雷心得：


  曾經人們相信，真相來自資訊的流通；而新聞媒體是監督、溝通的重要角色。


  但這部片啪啪打臉上述一切：儘管都手持難以輕易變造的傳統相機、儘管記者如實記錄起每

  聲槍響、每具倒地的屍體，但片中大家仍然自顧自地做自己想做的事（殺人的殺人、吃瓜的

  吃瓜...），矛盾也沒有消解的跡象。


  這不正是當代社會的困境嗎？


  其實片裡，老一輩記者似乎終有領悟，瞭解到自由與對話倚靠的不只是手上的相機（最老的

  那位連相機都沒帶），而是一顆人本的心。



  獻出心臟吧！（錯棚）



  --'
