url: https://www.ptt.cc/bbs/movie/M.1726423200.A.6F5.html
title: '[好雷] 和我想像中不同的美國內戰 : 帝國浩劫'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  在朋友的推薦之下看了這部爭議之作


  和我想像中的完全不同，也許是電影的中文譯名給人帶來的錯誤印象


  不過確實是很A24的一部片


  我很喜歡他簡潔有力 但是卻豐富多層次的寓意傳達


  像是片中紅色眼鏡軍官殺男主朋友那邊，我自己解讀是這樣的：


  對某些美國人而言，你真正來自哪裡其實不重要


  中國還是香港都無所謂，反正你看起來不是美國人，美國以外都一樣


  另外我也很同意版上之前有人講的，整部電影就是女主從保持堅強的外殼直到崩潰


  而女二則是從一開始的慌亂無助逐漸成長為一個攝影的機器


  最後女二走到走廊正中間拍攝，女主犧牲自己性命救下她


  我認為是這部片最荒謬的橋段　我有點不曉得該怎麼解讀這裡


  但或許女二從進入白宮開始，她的自毀傾向就已經越來越明顯


  從她直接闖入房間拍攝，連掩護也不怎麼找就能看出來


  可以說她為了攝影已經什麼都不管了，也不想/不能去在乎了


  但女主的自毀傾向比她更強烈，也在最後成為光譜的另外一端，徹底違反戰地記者的原則


  做出最強烈的干涉　用自己的性命去交換女二的


  她本可以抱著女二衝進掩體，但取而代之的卻是很刻意的把女二推開之後站在原地


  而女二只是忠實地用鏡頭記錄這一切


  這一切是很荒謬的　但是在這荒謬的世界才是合理



  --'
