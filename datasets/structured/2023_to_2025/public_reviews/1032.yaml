url: https://www.ptt.cc/bbs/movie/M.1715571704.A.A2D.html
title: '[  負雷] 美國內戰'
content: '看這部之前，有稍微爬文看了某篇評論，知道這是部反戰的劇情片。沒有大場面戰爭，所

  以已經打預防針把這部當劇情片看。

  結果看完覺得，電影百分八十趴都是b級電影的劇情畫面。

  劇情空洞沒邏輯性，只有搭配上反戰思維略有加分。

  電影節奏緩慢，搭配上不斷切換公路場景，喜歡的人會說很有氛圍。


  不過某幾個畫面拍得很美。


  配樂穿插著鄉村音樂，然後一下安靜，一下突然進入爆音的機槍掃射聲，配樂很棒？？




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  最後的大場面來了。

  原來不是戰爭，只是巷道之間的攻防戰。

  然後最後是大樓間的攻堅戰。這段大概是整部片最大敗筆，一點緊張熱血的氛圍都沒有，

  看了只覺得尷尬。

  對照另一個電影全面攻佔：倒數救援，就知道這段劇情有多無聊。



  建議真的不用花錢去電影院看……



  --'
