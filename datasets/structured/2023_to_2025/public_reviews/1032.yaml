url: https://www.ptt.cc/bbs/movie/M.1715441315.A.B2B.html
title: '[普好雷] 美國內戰 屁孩滾啦!'
content: '如果很多人批過的


  最好看的戰鬥都在預告片 剪接真的能搞出完全不一樣的鬼東西

  然後實在就是公路電影 跟內戰本質其實也好像沒太大關連


  我個人其實是喜歡他講述的主題

  所以就算是電影名稱跟標題詐欺 也還能接受

  攝影美學做的還不錯 最後的城巷戰也算精彩


  不過真的還是有不少想讓人吐槽的地方

  以A24號稱花最多預算 實在應該更好


  首先 德州跟加州會走在一起對抗華盛頓本身就很難接受

  保守派大本營跟SJW大本營 華爾街就算了 華盛頓到底是怎樣會被兩者圍攻


  然後美國打內戰最好是只有這樣 美國都可以一打十了

  西軍起碼可以單挑中國了好嗎 會是這樣坦克小打小鬧?


  殺中國香港人那邊 如果是想隱喻港人衰洨

  但如果只是膠到想特別無差別同情中國人 實在太天真了


  最重要的... 我最討厭的美國電影的窠臼


  他X的常常編不了轉折 就會相當刻板無趣的"又一個白目孩"


  媽的 這女生是什麼老闆女兒嗎 硬要差這麼平版的角色

  就一個很想自己很屌的女生 其實根本只是不懂秤自己斤兩


  然後劇情又很硬要 突然人設大轉的跟個瘋婆娘就跟連哪裡人都不知道的華人換乘

  被抓為了救他 差點所有人團滅... 結果是出乎意料的老人白死


  最後又是硬要搶功白目的衝出去送頭

  科科 女主角也死了... 蜘蛛人又可以再崩潰一次了


  然後莫名其妙就變成冷酷記者女王


  沒有這麼刻版白目角色 我本來會給好雷的

  真的看到氣氣氣氣氣




  --'
