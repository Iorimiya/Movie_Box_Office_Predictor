url: https://www.ptt.cc/bbs/movie/M.1717208170.A.70F.html
title: '[ 微雷] 美國內戰該有情還是無情？'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  戰地記者該是有情還是無情？


  在各種情緒撲面而來的當下


  如果不夠冷血怎麼還能鎮定拍出有張力的照片


  但是真的冷血了 又怎麼能確認照片中能帶給人情緒的延伸？


  所以記者的心就是在兩個極端之間拉扯著


  老中青三代


  面對對同樣場景出現不同反應


  影片之初小的還只能感受到情緒的拖累


  中的卻已經能在幹大事的時候阻絕情緒牽制


  而老頭只剩緬懷過去 想抓住一點青春的尾巴 是最矛盾的一個角色


  片中一直在想是不是冷血的人更適合當戰地記者


  更能處變不驚 從容的拍出血淋淋的現實


  這時候就有點出戲了


  開始想或許天生我才真的有用


  硬要說嗜殺之人也可以當劊子手吧


  但記者心境的轉變卻不同於殺手


  就像john wick等一眾殺手


  年輕只管執行命令 步入中年才開始感到愧疚或各種相對於冷血的感受


  跟戰地記者步入中年對血腥感到麻木是南轅北轍


  戰地記者可以越拍越冷血旁觀


  殺手不更該越殺越冷血嗎


  人性沒有套一體適用的標準


  或許商業電影就是要有反轉才精彩吧







  --'
