url: https://www.ptt.cc/bbs/movie/M.1713234226.A.5B9.html
title: '[好雷] 美國內戰'
content: '雷

























  個人蠻喜歡劇情切入的角度


  沒有什麼鋪天蓋地的新聞畫面介紹戰爭的主因跟過程


  也沒有用主角群對戰爭的回憶來解釋


  一切都已經是理所當然


  從戰地記者的視角觀察美國內戰


  微觀的角度看這個虛構事件


  在這幾年的俄烏戰爭中


  世界看到了現代戰爭對戰場人民生活造成的影響


  配合美國的街景一切看起來不可思議卻又毫無違和


  劇情主線很簡單


  是主角一行人要到行政首都找總統的過程


  過程中經過各種你可以想像在戰爭中的街景市景


  不同的人群


  看似對戰事已經不以為意但死亡隨時都在身邊


  上一秒說笑的朋友可能隨時都會離開你



  喜歡男主角後面友人死亡後崩潰失神橋段的演技


  感染力很強


  整個事件有點荒誕的結束


  也不知道之後美國的走向為何


  跟本劇的敘事角度一樣


  不注重這場戰爭的成因跟發展


  而是小人物在戰時的生活


  如果賣得好這個世界觀很有繼續發展的空間


  不過整部電影沒有太著重在大場面


  如果是期待看到強國內戰各種很屌的武器互轟的觀眾可能會有點失望




  話說被打死的亞洲人自稱香港人


  但是在車子那段我有聽到他說中文近一點近一點


  而不是粵語 不然就是駕駛只會說普通話囉


  還是其實二等兵陶德理解正確 他就是中國人lol

  -----

  Sent from JPTT on my iPhone


  --'
