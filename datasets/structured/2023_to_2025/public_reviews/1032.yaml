title: 'Fw: [問卦] 帝國浩劫美國內戰會不會是預言片？'
content: '作者: amidha (東岐明) 看板: Gossiping

  標題: Re: [問卦] 帝國浩劫美國內戰會不會是預言片？

  時間: Sat May  4 23:50:03 2024



  不是預言片，而是美國政府推動的宣導片，用來警告美國民眾若有內戰的恐怖。

  片中情節根本支離破碎，整片重點就在表現內戰的荒謬與恐怖。

  所以這片的劇情貧乏，主要是在宣傳內戰爆發的社會後果，作為警告教育。


  --


