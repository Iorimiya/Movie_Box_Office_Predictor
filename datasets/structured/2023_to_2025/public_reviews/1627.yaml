url: https://www.ptt.cc/bbs/movie/M.1685715400.A.D46.html
title: '[新聞] 《新．假面騎士》正式上映粉絲變身燃爆特'
content: "新聞網址：\n\n特攝粉絲期待已久的《新．假面騎士》電影即將於6月2日正式上映，而此次《新．假面騎\n士》更是假面騎士系列首次同步推出4DX版本，觀眾可以透過4DX的動感座椅、風吹震動、\n\
  水花等特效，可以親身感受在空中「騎士踢」的震撼，以及與旋風號一起奔馳的快感，仿\n佛置身於假面騎士的戰鬥現場。《新．假面騎士》特映會在昨晚（5/31）舉辦，即使颱風\n\
  大雨仍然澆不熄粉絲的熱情，精心打扮成喜歡的角色出席。許多忠實粉絲觀影後更表示「\n喜愛假面騎士的老朋友們一定要進場，絕對熱淚盈眶！」，而在片尾更驚喜播放了三首《\n\
  假面騎士》經典主題曲，不僅喚起粉絲的假面情懷，現場觀眾也隨著當年的歌曲熱烈鼓掌\n了整整三次，氣氛相當感動！\n\n參與特映會的粉絲除了盛裝打扮，也模仿了假面騎士們與「修卡組織」的對決場面，合照\n\
  時一起大喊假面騎士經典台詞「變身！」，全場一起進到假面騎士的世界，場面令人振奮\n！其中現場還有一個亮點，台灣單口喜劇演員「喬瑟夫」（ChillSeph）因外型酷似海報\n\
  上主演男星「池松壯亮」，在電影上映前已經吸引不少粉絲注意，也前來特映會到場觀影\n，粉絲更大方出借紅圍巾與角色腰帶，喬瑟夫與背板合照瞬間炒熱了現場的氣氛。\n\n\
  而此次的《新．假面騎士》粉絲也提到幾個看點，女主角「濱邊美波」出色的演技，詮釋\n和以往不同的酷妹形象，在片中的反差和心境演出令人感到印象深刻。同時，電影更呈現\n\
  了導演庵野秀明獨特的美術風格，追求完美的庵野導演在場景和服裝都有自己的堅持，戲\n服的顏色以及線條都由導演用馬克筆親自描繪，許多場景更重新回到當年的拍攝地點，希\n\
  望能用自己的喜愛詮釋出新的假面騎士，想要一起感受假面騎士帥氣的粉絲，趕緊進戲院\n支持《新．假面騎士》吧！\n\n\n\n--\n              \
  \                   06/02 22:16"
