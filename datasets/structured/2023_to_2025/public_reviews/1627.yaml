title: '[好雷] 挑觀眾的新．假面騎士'
content: '沒什麼雷

  就不防了


  看了新假面騎士

  昭和感非常滿


  吃電波沒錯

  我覺得很挑觀眾

  如果是1990、2000以後出生的觀眾

  有可能不易理解鏡頭晃來晃去、那些奇怪的姿勢跟飛踢、奇怪的劇情節奏在幹嘛

  說不定會笑出來、或生氣


  但1980或更早出生的，浸淫過昭和時期那種苦悶又荒謬又沒有網路的時光

  又看著昭和特攝長大

  就會秒懂庵野的浪漫在哪，知道他要傳達的是什麼

  因為那些怪、尬、卡、有些突兀的節奏、傻氣的正義、各種鏡頭語言、鏡頭的設計

  甚至角色牽強但又不是沒道理的怪人，林林總總

  的確就是勾起當年看特攝影片的感覺


  猜測庵野導演，目標就是想要重現當年昭和時代，看特攝片的悸動


  以不三不四的比喻來說，大概就是弄出一個4k版的川島和津實影片

  用當年的方式重拍一片薄碼....在場老肥宅莫不震動

  （但年輕人如果會懂，應該是相當特別有點怪的年輕人…）


  總之本肥宅主觀認為：

  新假面騎士就是....讓昭和阿北大嬸，感受浪漫用的

  庵野阿北帶你做了一場穿越古今的美夢


  真想再去刷一次、甚至刷三次，可惜家務繁重，只能之後看家中螢幕回味...

  是的，昭和時期的孩童，如今上有長輩，下有小孩，要上班，房屋還要修繕

  只能騎機車時帶上安全帽，幻想自己也是主角，騎入車陣之中



  --'
