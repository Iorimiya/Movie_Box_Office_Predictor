url: https://www.ptt.cc/bbs/movie/M.1684942016.A.0D4.html
title: '[新聞] 《新．假面騎士》打進2023年前十大日本電'
content: "新聞網址：\n\n由庵野秀明擔任導演及腳本的《新．假面騎士》電影將於6月２日在台上映，本片在日本\n突破20億票房，成為假面騎士系列影史排行首位，更獲得2023年排行前十大日本電影票房\n\
  的佳績，為紀念假面騎士50周年特別計畫，將昭和時代的初代假面騎士融合現代元素，透\n過庵野秀明導演的視角，為當年的假面騎士補完角色的設定以及故事劇情，希望能勾起初\n\
  代觀眾滿滿回憶！《新．假面騎士》也是庵野秀明「新·日本英雄宇宙」系列的壓軸作品\n！而台灣更準備了初代假面騎士的電影限定A3透明海報為首週入場特典，喜歡假面騎士的\n\
  朋友千萬要把握首周觀影！\n\n《新．假面騎士》是庵野秀明，做為英雄宇宙的收尾作品，導演被問起感想時，透露了此\n作在周遭朋友們間喚起了熱情，陸續收到「哇！哭了」，或是非常激動的感動回覆等，讓\n\
  導演不禁感嘆道，能夠將這部電影帶給大家真的是太好了！雖在製作過程中倍感壓力，但\n仍想給觀眾更多與眾不同的感受，例如原本用於片頭曲的畫面，因為時長超出，以特別影\n\
  片形式作為宣傳，除外，近期在日本推特也釋出許多未公開影像，成為本作的驚喜彩蛋。\n\n《新．假面騎士》是講述男主角本鄉猛和女主角綠川瑠璃子，從神祕的組織「修卡」叛逃\n\
  後被追殺，為了逃離追捕，本鄉猛在戴上頭盔變身後，發現自己壓抑不住體內的暴力衝動\n，將修卡組織擊退。在經歷一番心路歷程後，本鄉猛誓言對抗修卡組織，並給自己『假面\n\
  騎士』的名號。為了紀念50週年的作品《新．假面騎士》，5月19日開始於「博客來售票\n網」線上獨家販售-電影首輪預售票 250元/張。而粉絲們期待已久的台灣限定首週入場特\n\
  典正式曝光，凡於6月2日至6月8日，至電影院劃位入場觀賞，即可獲得《新．假面騎士》\n限量電影限定 A3 透明海報！想要的朋友千萬不要漏掉訊息！敬請密切關注「MUSE木棉花\n\
  」官方社群的消息，就能即時獲知最新電影情報。\n\n--\n                                 05/24 23:26"
