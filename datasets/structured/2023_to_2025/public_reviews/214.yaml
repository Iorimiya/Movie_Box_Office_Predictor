url: https://www.ptt.cc/bbs/movie/M.1753978158.A.9B5.html
title: '[普好雷] 驚奇四超人：第一步'
content: '防雷




















  15版本評價太爛所以乾脆不看

  05版本兩集都看過,就是中規中矩而已

  至少選角和娛樂性還有及格

  至於這次的驚奇四超人我比較期待能大破大立

  至少希望能像雷霆特攻隊那樣的程度

  顯然這部電影讓我的期待落空了

  我是不討厭他的復古風格,甚至頗吃這套

  只是我必須說他當真沒什麼娛樂性

  沒有刺激場面,至少該展現四人力量的場面極少

  比較有的也就是家庭倫理而已

  玩命關頭在這部分還比較有趣

  至少能肥牡蠣的一直嘴,還蠻好玩的


  演員我只認識佩卓帕斯卡和凡妮莎寇比

  坦白說佩卓帕斯卡給我點複雜的感覺

  他的演技絕對是能撐起驚奇先生

  但外表形象違和感不低,05版樂勝

  凡妮莎寇比很美,我認為跟潔西卡艾巴不相上下

  只是劇中表現比05版普通,這部分可惜了點

  其他像是霹靂火還ok,石頭人很普通

  銀色衝浪手倒是有點小亮點

  大概是這樣,整體而言這部串流打發時間就好

  這就是所謂的期待越大,失望越大吧

  頂多最後末日博士出現可以期待

  我也很好奇小勞勃道尼會怎麼出現了


  ----

  Sent from  on my Samsung SM-S9280


  --

  如果我是那雨滴的話...

  那麼，我能夠像把不曾交會的天空與大地連接起來那樣...

  把某人的心串聯起來嗎？


  --'
