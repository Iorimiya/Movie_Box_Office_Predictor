title: '[情報] 《驚奇4超人：第一步》預告首播'
content: '《驚奇4超人：第一步》（The Fantastic Four: First Steps）首支預告：






  預告首播回放：




  電影故事設定在以 1960 年代為靈感的復古未來世界，漫威工作室的《驚奇 4 超人: 第

  一步》中漫威的第一家庭－「驚奇先生」李德理查斯（佩德羅帕斯卡飾）、「隱形女」蘇

  史東（凡妮莎寇比飾）、「霹靂火」強尼史東（喬瑟夫昆恩飾）和「石頭人」班格林姆（

  艾邦摩斯貝克許飾），面臨迄今為止最艱鉅的挑戰。他們必須在英雄角色和家庭關係之間

  取得平衡，同時保衛地球，抵禦名為「行星吞噬者」的貪婪宇宙神及其神秘的使者「銀色

  衝浪手」。而當行星吞噬者計劃吞噬整個星球及所有人，沒有人可以置身事外。


  前導海報：







  （劇情大綱引用自GNN：）


  --'
