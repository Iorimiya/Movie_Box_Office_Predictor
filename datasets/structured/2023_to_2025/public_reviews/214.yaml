url: https://www.ptt.cc/bbs/movie/M.1755416445.A.879.html
title: '[好雷] 驚奇4超人：第一步'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  經過十部水準參差不齊的電影之後，漫威終於以《雷霆特攻隊*》與《驚奇4超人：第一步

  》證明自己，拍出有史以來最好看的「漫威第一家庭」。



  故事設定在以1960年代為靈感的復古未來世界，隆重介紹漫威的第一家庭：「驚奇先生」

  李德理查斯、「隱形女」蘇史東、「霹靂火」強尼史東和「石頭人」班格林姆，他們面臨

  迄今為止最艱鉅的挑戰。而當行星吞噬者計劃吞噬整個星球及所有人，沒有人得以置身事

  外。



  與其他版本從起源故事開始不同，《驚奇4超人：第一步》以旁白與蒙太奇快速帶過第一

  家庭獲得超能力的過程與他們至今曾經征戰過的敵人，而將故事的主軸放在蘇成為母親後

  的轉變。就像《暮光之城》裡，貝拉與愛德華有了愛的結晶之後，從一開始的喜悅到擔心

  孩子異於常人，李德與蘇也有一樣的擔憂，畢竟這個寶寶的父母是在太空照射到輻射之後

  才獲得超能力的，他若有什麼病變也很合理。



  作為地球828已知的唯一超級英雄組合，當行星吞噬者都已經派銀色衝浪手來宣告毀滅的

  計畫，驚奇4超人顧不得蘇懷有身孕，還是全員出動。此時的蘇，早已將全人類的福祉看

  得比自己的孩子與健康重要，但當行星吞噬者要求孩子當作拯救地球的籌碼，身為母親的

  蘇斷然拒絕。回到地球後，驚奇4超人開誠布公地告訴大眾談判的內容，馬上引起反彈。

  的確，一個人換全人類，怎麼看都很划算，但即便是平行宇宙，這裡畢竟是《搶救雷恩大

  兵》的美國，每個人的生命都同等重要。



  蘇抱著富蘭克林出去迎接抗議民眾一幕尤其感人，她直截了當告訴大家，要她犧牲兒子換

  地球是不可能的，但她也絕不會犧牲地球只為保全自己的兒子。最後當李德想到一個好方

  法，可能也是唯一的方法，蘇也毫不猶豫決定讓富蘭克林擔任誘餌，而當計畫不如預期，

  她為了保護兒子耗盡體力把行星吞噬者推向傳送裝置，不但扮演好一名好媽媽的角色，也

  符合世人對超級英雄的期待。



  除了蘇的媽媽身分在過去的《驚奇4超人》電影當中從未見過之外，《驚奇4超人：第一步

  》也有不少新的未知元素。讓蘇成為媽媽的富蘭克林就是一個有趣的角色，這一集他還只

  是個小嬰兒，但在電影最後卻成為拯救媽媽的英雄。漫畫中的富蘭克林能夠創造宇宙，時

  空旅行，操縱現實、時間與因果關係，確實像是爸媽能力的綜合體，但這些能力無法解釋

  他是如何讓媽媽起死回生，留下一個待解的謎團。



  另外，銀色衝浪手的角色也不再是大家熟悉的諾林‧萊德（Norrin Radd），而是一名神

  秘的女性。靠著強尼的翻譯，電影後段揭露這位神祕女性其實是諾林的愛人莎拉‧巴爾（

  Shalla-bal）。雖說目前尚不知道，MCU（漫威電影宇宙）是否有意將漫畫裡的這層關係

  在後續的作品連結與呈現，但莎拉確實有追隨諾林成為另一位銀色衝浪手。



  既然這一集也有富蘭克林這個新的未知元素出現，或許漫威故事的某個支線會是未來發展

  也說不定。在某個平行宇宙中，諾林與莎拉都是第二位行星吞噬者──富蘭克林──的銀

  色衝浪手，而另一條漫畫的故事線裡，莎拉甚至嫁給末日博士，這也可能與我們在片尾段

  落中看到的背影有關。不過，在驚奇4超人出現在第六階段的其他作品連動之前，都尚無

  法確定這些新的未知元素將會如何互相交織。



  《驚奇4超人：第一步》的背景設定在地球828，也就是「驚奇4超人」的主宇宙，與我們

  熟悉的地球616不同。雖然MCU早已打開多重宇宙，但光從這一集看不出未來將會如何與系

  列其他作品連結。呈現在觀眾眼前的是設定在1960年代的未來城市，復古的元素貫穿全片

  ，從開場片頭、巴氏大樓裡的家電與家具，到1991年倒閉的泛美航空大樓、取材自美國50

  、60年代的綜藝節目主持人艾德‧蘇利文的《泰德‧吉伯特秀》，都是把觀眾從電影院帶

  回1960年代的復古細節。



  其實，《驚奇4超人：第一步》最棒的地方在於，漫威終於久違地拍出一部名副其實的「

  獨立」電影了。觀眾不必在擔心自己沒看過前面36集大型預告片，即使不是漫威迷也能好

  好享受這部好好把故事講完的作品。雖說在新聞與綜藝節目的畫面，仍舊有提到四人的稱

  號，但比起2005年版本中不斷叫喚，這一次重啟的驚奇4超人更貼近普通人。他們只是一

  群剛好在出任務時發生意外的太空人，坐在電影院裡的我們也只是在窺視一個平凡家庭的

  日常生活，以及突如其來的危機出現時，這群意外獲得超能力的太空人如何應對。



  漫威在前幾部作品失利時，很多人說那是他們過度重視政治正確的報應，但其實漫威只是

  沒能說好故事而已。早在1990年代的《X戰警》動畫裡，他們就非常積極宣揚包容與多元

  ，所以近年來的滑鐵盧只是漫威忘記怎麼好好講述一個簡單故事罷了。在《驚奇4超人：

  第一步》中，那種自然帶出「團結」的感覺又回來了。就像我們所處的現實社會，正急需

  團結互助，而驚奇4超人作為地球828唯一的超級英雄組合，不靠眾人的幫忙，他們根本不

  可能成功。



  不論是放下本位主義，試圖理解莎拉‧巴爾的語言，還是計劃必須耗費大量能源，全世界

  一起共體時艱實施節電，抑或是引誘行星吞噬者時，無可避免會有人員傷亡，而求助明明

  是超級反派的地底世界代表──鼴鼠人，在在都顯示出漫威仍未放棄宣揚多元文化與團結

  一心，但這次他們終於再次成功以符合劇情常理發展的方式，在單純簡單的世界裡安排進

  當下最合理的選擇。就算《驚奇4超人：第一步》跟黃金十年的作品比起來，還稱不上令

  人嘆為觀止，但作為第六階段的開場片，絕對可以說是驚奇出色的一部。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
