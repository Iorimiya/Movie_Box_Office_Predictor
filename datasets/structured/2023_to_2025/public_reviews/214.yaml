title: 'Re: [好無雷] 牠:戰勝心魔是成長的第一步'
content: '外國鬼片，會遇到鬼的多半有一些特質，像是有憂鬱症等精神病，心靈曾有創傷，重病或

  重傷的生死交關的時候，時運低落的與小孩等。

  歐美導演導的鬼片都比溫子仁兇，溫子仁的鬼片幾乎人畜無害，而新安娜貝爾就變得更兇

  狠。


  回正題，It的小孩也多有現實殘酷的遭遇，像霸凌，家暴，鬼父，控制慾強大的媽媽等等

  。最後，小孩們終於戰勝心魔，團結對抗惡靈。

  只能說，尊師重道，孝順真的是一種奴化，一種禁錮，或者是因為時代變遷，人心不古了

  ，現代人愈來愈邪惡，連老師甚至是親生父母都會侵犯孩子，多數孩子卻不敢反抗。















  過

  亂

  一

  。

  較

  磨

  一

  害

  地

  讓

  夠

  不

  迫

  讓

  現

  一

  重

  。


  --'
