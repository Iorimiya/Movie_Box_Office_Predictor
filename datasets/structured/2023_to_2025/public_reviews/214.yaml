url: https://www.ptt.cc/bbs/movie/M.1753589808.A.7B1.html
title: '[好雷] 驚奇4超人:第一步 大滿足'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這是電影院值得一看,如果過一陣子發現電影台有撥也可以再看一次的好片子


  驚奇四超人這作品我完全不熟,以前電影也只有稍微喵過美國隊長還在當火人的那部

  所以這次電影一開始就給我一個美國50年代幻想未來風格的世界真的感覺很新奇


  作為新的驚奇四超人起源,

  他也是有用快速但是還算好理解的方式跟新觀眾如我介紹了這四人是誰,能力是啥

  還有他們其實已經在這社會打下一定程度的好名聲,受大家歡迎 甚至還有專屬卡通


  劇情就不特別敘述,

  不過跟超人比起來,這部帶給我的情緒波動比超人強烈太多了

  特別是最終決戰那邊,真的有種一群人拚下去的感覺

  (好 我知道似乎有人對這邊演出很不滿,不過我是覺得很滿意的那邊

  畢竟他成功騙到我的眼淚了)

  而且劇情展開上也沒有特別讓人覺得不合理的程度

  至少都是劇情中可以解釋的演出,而且也是可以單看這部就能自己完結的完整度

  (扣掉最後某個披著綠色披風的傢伙的背影)


  整體下來這片滿分100我會給85分

  雖然還不至於會去二刷,但是可以跟沒看過又喜歡超級英雄片的朋友推薦的程度


  真要說不滿的話,他沒有直接演到穿越到主世界我覺得很可惜

  當初雷霆特攻隊看到他們的飛船就很好奇是怎麼來的

  結果居然沒提到


  最後

  這火男你可以再帥一點


  美國隊長版的火男的痞子感很重

  這次的火男則是有點痞,但是有情有義而且智力還很高

  特別是最後那邊為了夥伴,準備要來一發特攻那邊

  台詞真的帥到掉渣了



  --

  我不太清楚設定 不過這吞星者感覺也不是邪惡屬性

  比較像是變成非自願自然災害的感覺


  看他搶下小嬰兒的說法也就只是"給我救贖"


  其實他也很不想當吞星者?

  精神攻擊這招挺不錯的

  抓對方還有良心然後從這點猛打 打到對方崩潰跑走

  而且最後那一撞如果要凹還是可以回來吧

  這邊剛剛好隔壁棚超人跟這邊驚奇四超人都有類似橋段


  平常救命說謝謝 但是有啥麼問題突然翻臉比翻書快


  真要說民眾不道德 真的兩部作品都在拚下限的


  就算這樣還願意救人的英雄真的是英雄

  美國隊長火人太正經聰明反而覺得很怪

  他應該就是要那個皮皮的樣子才是美隊火人

  (就是要像死侍彩蛋裡面那樣 這才像話咩

  吞掉的星星是要拿去回收做成其他星星之類的自然機制?

  我看那邊的時候也是這樣想 為啥你要呆呆的直接說出來

  大部分的作品好像都這樣演

  要你拿兒女 妻子女友之類當人柱換取和平

  正常向一點的作品應該都會讓主角想出好點子逆轉的


  只是這次民眾真的有點過分,你是要一個母親犧牲自己兒子耶 這還有沒有人心阿'
