url: https://www.ptt.cc/bbs/movie/M.1749229795.A.0A7.html
title: '[新聞] 《驚奇4超人：第一步》首日預售打破紀錄'
content: "《驚奇4超人：第一步》首日預售打破紀錄，成為今年之最！「銀色衝浪手」正臉外觀曝\n光\n\n\n\n《驚奇4超人：第一步》（The Fantastic\
  \ Four: First Steps）是一部即將在 7 月 23\n日上映於台灣的漫威電影宇宙（MCU）新片，緊接著《雷霆特攻隊*》之後，同時也是今年\n最後一部的\
  \ MCU 電影。影迷下次要在大銀幕上看到 MCU 電影還得等到 2026 年 7 月 31\n 日上映的《蜘蛛人：重生日》，兩者映期隔了整整一年。\n\n而在北美時間的\
  \ 6 月 4 日，《驚奇4超人：第一步》正式展開預售。根據美國票務公司\nFandango 統計，該片首日預售成績打破紀錄，成為今年（2025）首日預售賣最好的作品\n\
  。\n\n\n\n同時，英國電影雜誌《帝國》（Empire）也出版了《驚奇4超人：第一步》的特刊，揭示\n了由茱莉亞加納（Julia Garner）飾演的「銀色衝浪手」的正臉高畫質照片，讓影迷搶先\n\
  一窺這位高人氣角色的帥氣面容。\n\n\n\n《驚奇4超人：第一步》由《汪達幻視》導演麥特夏克曼（Matt Shakman）執導。故事被\n設定在另一個多重宇宙中，在那裡時間點似乎停留在\
  \ 1960 年代，此處的世界可能沒有發\n生過「戰爭」及「冷戰」使得科技高速發展，即使是六零年代文明水準也遠超現實中的二\n十一世紀，類似於「復古未來主義」。\n\
  \n\n\n本片卡司包含：「驚奇先生」佩德羅帕斯卡（Pedro Pascal）、「隱形女」凡妮莎寇比（\nVanessa Kirby）、「霹靂火」約瑟夫奎因（Joseph\
  \ Quinn）、「石頭人」艾邦摩斯貝克\n許（Ebon Moss-Bachrach）、「銀色衝浪手」茱莉亞加納（Julia Garner）以及「行星吞\n噬者」拉爾夫尹愛森（Ralph\
  \ Ineson），此外據傳小勞勃道尼（Robert Downey Jr.）飾\n演的「末日博士」將在本片片尾片段短暫登場。\n\n《驚奇4超人：第一步》將於\
  \ 2025 年 7 月 23 日搶先於台灣上映。\n\n\n\n\n--"
