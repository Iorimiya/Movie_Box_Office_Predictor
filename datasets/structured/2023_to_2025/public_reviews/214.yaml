url: https://www.ptt.cc/bbs/movie/M.1754304832.A.E3E.html
title: '[新聞] 小島秀夫盛讚MCU《驚奇4超人：第一步》'
content: "小島秀夫盛讚MCU《驚奇4超人：第一步》風格出眾　稱其為系列「真正的重新出發」\n\nMin-El\n\n繼上回的 DCU《超人》（Superman）觀後影評後，日本知名遊戲創作者小島秀夫近日在\
  \ X\n（前 Twitter）發文大力讚揚漫威新片《驚奇 4 超人：第一步》（The Fantastic Four:\n First Steps），不僅形容本片是「真正的\
  \ Fantastic」，更稱其為一次成功且風格獨特\n的系列重啟。\n\n此番評論正值該片面臨第二週票房大幅下滑之際，小島的力挺格外引發話題。\n\n\n\n\
  小島在貼文中細數電影對 1960 年代未來想像的細節處理，從服裝、色彩、設計、街景到\n電視節目與食品品牌，甚至包括磁帶與光碟等儲存媒體，全都展現出極高的一致性與風格\n\
  掌控。\n\n「不只是服裝、配色、設計、街景、電視與動畫節目、戲服與太空衣、火箭、汽車，就連\n企業名稱、食物（像是麥片、汽水）和儲存媒介（磁帶、磁碟）等，都徹底貫徹了60年代\n\
  的造型與未來感。」小島說。\n\n\n\n他也提到電影整體氛圍讓他聯想到童年時的影集《神仙家庭》（Bewitched）以及以家庭\n為核心的動畫電影《超人特攻隊》（The\
  \ Incredibles），指出這類懷舊又溫暖的色彩，\n是後疫情時代超級英雄電影的新趨勢，與過去陰暗寫實的路線漸行漸遠。\n\n在敘事結構上，小島認為本片最聰明之處在於透過片中一段虛構電視節目帶出角色的能力\n\
  與背景，而非冗長的起源說明。\n\n\n\n「若從頭開始鉅細靡遺地描述他們如何變成超人，反而會變得太過解說、節奏拖沓。像《\n超人》也很聰明地略過了這部分，觀眾可以直接從他們即將迎接『新家庭成員」』（也就\n\
  是混亂與危機的開端）這個節點切入劇情，這樣的鋪陳安排得很順暢。\n\n作為這個系列的『重啟起點』，這部作品的確稱得上是『驚奇』的第一步。」小島說道。\n\n然而，即便擁有高度口碑，《驚奇\
  \ 4 超人：第一步》票房卻面臨壓力。\n\n第二週預估票房下滑至 4200 萬美元，較開片週大跌64%。\n\n但截至目前為止，該片仍已突破 2 億美元票房，成為今年\
  \ MCU 票房最高作品，表現超越\n《美國隊長：無畏新世界》（Captain America: Brave New World）。\n\n\n新聞網址：\n\n\
