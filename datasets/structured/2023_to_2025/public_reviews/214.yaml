content: "個人只看過潔西卡.艾芭版的第一集,第二集銀衝甚至沒看完\n\n中間那葛重啟的,評價爛到好像不用去看,就沒看惹\n\n上映前導演就有說惹\n\n\
  同樣是跳過起源故事+擁有多名英超/反派腳色,\n這部觀影感受比岡版《超人》舒服太多..\n\n(防雷頁)\n\n對惹,預告真的有《阿凡達三》的預告,基本上又是部落衝突,劇情有說=沒說\n\
  \n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文\
  \ 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n雖說是跳過起源故事,電影中仍然不時插敘幾秒上太空事故的泛黃回憶片段,\n\
  \n班對於面容的遺憾,幾個定格就清楚說明;\n\n這次強尼除了花花公子形象,對女銀衝解密動作,大大提升霹靂火的腳色深度與用途.\n\n看完本片,尼可以感覺到此片專注在解決一個\"\
  吞星者入侵事件\"的過程,是流暢舒服的\n\n  問題->設法解決>遭遇意外突發->臨場解決->下個問題->loop  這種套路的節奏\n\n以前有大導演說:超英電影比較像遊樂園\
  \  窩是覺得除了特效外,劇情安排的好也有可看處\n\n而此片也是有大美國思想+時代廣場阿  所以有可能因為反美情緒導致票房不+..(ry)\n\n--\n\n\
  \ \n\n--"
