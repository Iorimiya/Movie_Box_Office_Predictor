content: '《驚奇4超人：第一步》曝全新預告！多款 IMAX、4DX、Screen X 等「特殊放映版」海報

  同步亮相



  《汪達幻視》（WandaVision）導演-麥特夏克曼（Matt Shakman）掌舵的《驚奇4超人：

  第一步》（The Fantastic Four：First Steps）的北美預售票正式啟售，官方也同步釋

  出一支新預告，以及多張特別用來宣傳 IMAX、4DX、Real 3D、Screen X 等「戲院特殊放

  映版本」的專屬海報（下圖）。




  《第一步》編劇陣容集結了：《阿凡達：水之道》（Avatar：The Way of Water）共同編

  劇-喬許費里德曼（Josh Friedman）、《汪達幻視》共同編劇-彼得柯麥隆（Peter

  Cameron）、《黑寡婦》（Black Widow）共同編劇-艾瑞克皮爾森（Eric Pearson）、以

  及來自獨立製片界的編劇搭檔 — 傑夫卡普蘭（Jeff Kaplan）和伊恩史普林傑（Ian

  Springer），這些人各自在不同籌備階段，撰寫了不同版本的劇本。北美預定 07 月 25

  日上映，台灣則於 07 月 23 日搶先登場。





  本片主演卡司網羅：「驚奇先生」佩德羅帕斯卡（Pedro Pascal）、「隱形女」凡妮莎柯

  比（Vanessa Kirby）、「霹靂火」喬瑟夫奎恩（Joseph Quinn）、「石頭人」艾邦摩斯

  巴克拉克（Ebon Moss-Bachrach）、「行星吞噬者」雷夫伊內森（Ralph Ineson）、銀色

  衝浪手「莎拉芭爾」茱莉亞嘉納（Julia Garner），角色未公開的則有：娜塔莎雷昂（

  Natasha Lyonne）、保羅沃特豪瑟（Paul Walter Hauser）、約翰馬可維奇（John

  Malkovich）等人。




  --'
