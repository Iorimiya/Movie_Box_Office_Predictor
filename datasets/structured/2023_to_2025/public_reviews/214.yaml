url: https://www.ptt.cc/bbs/movie/M.1753454989.A.2AD.html
title: '[普雷] 驚奇4超人：第一步'
content: '以下雷






  第一次接觸驚奇4超人，是小時候在電視上看2005年版的真人電影，當下就被四個人的超

  能力和團隊感吸引，角色塑造和選角都很成功，


  其中對石頭人Ben獲得超能力及外觀產生巨變的描寫特別印象深刻，


  特別是他獨自站在家門口，伴侶就在屋內，卻沒有勇氣讓她見到自己的模樣，


  石頭大手也撿不起掉落的婚戒，那個孤獨感真的描寫的很棒。


  後來也忘記在CN還是迪士尼頻道看了動畫影集，所以對這個英雄團體也不算陌生。


  2015年，由《超能失控》導演喬許傳克執導的重啟版看得出導演的野心，


  但幕後那些片商干預、導演在片場酗酒、職場霸凌的鳥事，讓這部片最終被玩成虎頭蛇尾

  的失敗作。


  然後又過了10年，才等到再次重啟的《驚奇4超人：第一步》。


  我覺得近代的三個版本的F4都有拍出其特別的風格，


  2005、2007年版用漫畫/卡通的手法來拍真人電影；2015則是採用寫實沈重的基調；這次

  的新作則是發生在平行時空的復古未來主義世界。


  全片採用乾淨明亮、色調和諧的美術風格，整體視覺看起來很舒服，各種載具、科學儀器

  的設計也都很有特色，很有迪士尼《明日世界》的感覺。


  四位主角方面，

  Pedro Pascal演驚奇先生還是覺得有點不習慣，或許是他的外型太有特色，


  看到他都會覺得「就是Pedro Pascal」，然後才意識到他現在在演的是驚奇先生。


  先不論他提出的計劃如何，電影給了他很多作為智囊的戲份，但離智力頂天的感覺還有段

  距離，希望未來能多加著墨這一面。


  石頭人的部分這次的描寫不多，僅止於他是親民且可靠的家人，但外貌對他內心造成的影

  響在這片則是幾乎完全拿掉，只用了一兩個鏡頭帶過，相比之下2005年版的描寫實在細膩

  很多。


  霹靂火這次的塑造像是活潑的鄰家大哥，愛開玩笑鬧朋友，但該認真的時候還是很可靠，

  故事也安排了他的高光時刻，對比克里斯伊凡版那種張狂愛現的性格，我更喜歡這版本的

  霹靂火。


  凡妮莎科比的外型很適合蘇史東這個角色，而劇情著墨她身為人母，一心想保護孩子的溫

  柔堅毅，得知吞星想以她的兒子交換地球和平，面臨世人的口誅筆伐，背負龐大壓力，仍

  選擇走出大廈動之以情（雖然那段演說可以處理得更好），最後面對吞星也展現出為母則

  強的一面。


  銀色衝浪手的動作設計很不錯，追逐戰的速度感有做出來，而且很流暢，只可惜身體特效

  輸了道格瓊斯版ㄧ大截；吞星者初登場時有感受到其威壓感，第二次現身卻變成行動緩慢

  的龜速巨人，少了股毀天滅地的絕望感。



  全片的攝影、復古未來的世界觀、乾淨的美術風格和配樂我都蠻喜歡的，但文戲的比重偏

  多，著墨在四人的互動，


  主要的動作戲只有兩場：上太空和銀色衝浪手的追逐戰及最後的吞星者入侵，抱著看爽片

  的心態入場可能不會那麼爽。



  --'
