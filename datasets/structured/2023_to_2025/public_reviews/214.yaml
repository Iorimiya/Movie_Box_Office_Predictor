title: '[普好雷] 驚奇四超人：第一步 '
content: '以下有雷!!



  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  今天下午在台中看這部電影，驚奇四超人：第一步


  預告片沒有很多~



  正片開始的好突然!!


  美術風格與各種角色的穿搭很有復古感


  配樂也不錯



  黑洞追逐的那段畫面很狀觀耶，這段的特效看的好爽喔!!


  然後隱形女在太空船上生產的過程感覺好痛啊囧


  行星吞噬者出現時也是很有壓迫感!!



  霹靂火的個性很活潑，劇中也算是有所發揮


  但比起來，石頭人好像沒什麼太重要的戲份?


  甚至隱形女在最後的力場都比石頭人還強大的感覺了


  那這樣


  劇中有強調驚奇先生很聰明，也會作好事情最壞的準備的打算


  啊那個，難道你都沒有想過，調包富蘭克林的計劃


  如果被行星吞噬者發現的話，備案是什麼嗎...


  要不是最後靠隱形女的強大力場，就完蛋了耶囧


  不過這樣感覺最後反派也是有點降智就是了




  對了，後續竟然沒有連結到雷霆特攻隊*的片尾


  然後，第一個片尾算滿重要的


  第二個片尾可以不看沒關係




  --'
