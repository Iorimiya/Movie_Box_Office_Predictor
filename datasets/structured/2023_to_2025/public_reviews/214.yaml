url: https://www.ptt.cc/bbs/movie/M.1753662365.A.AC3.html
title: '[普雷] 驚奇4超人：第一步'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  嗯，


  我其實滿喜歡這部作品的美術，


  營造上世紀六○年太空時代(Space Age)的美術風格，


  連妝髮也是敬致那個時代，


  音樂就普普，甚至完全沒有印象。


  但劇情方面，也很像上世紀的驚奇4超人動畫。


  小時候有看過最早的美版動畫的人應該懂我說什麼。


  很多人說動作場面很爛，不是爛，是基本上沒有用。


  驚奇4超人對付對手都是靠智取居多，


  而不是用武力值輾壓。


  但我不覺得現代觀眾在經過漫威前三階段洗禮後，


  看得下這部。連美1都打得比這部精彩。


  文戲不錯，強尼的表現也比之前兩部表現更好，


  雖然神奇先生很聰明，但強尼其實也是高材生。


  真的很像在看動畫的真人版…


  就很平淡，不難看，但也沒稱得上精彩。


  真的很適合閣家觀賞的電影，我是覺得這個製作水準，


  拿來放電視電影還比較行。


  然後看片尾第一個彩蛋就夠了。


  第二個彩蛋純粹浪費你生命中的五分鐘。(包含字幕跑馬燈)



  --'
