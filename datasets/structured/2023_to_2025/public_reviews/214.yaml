title: '[好無雷] 《驚奇四超人：第一步》'
content: '哇，沒想到我居然會覺得好看

  是不是觀影前放低太多期待了？

  我還特地把工作面試推延


  每個角色的智商都在線

  真的是非常爽的一件事

  至少沒有什麼無腦舉動

  戰鬥時每個人都有表現

  非常棒的戰鬥模式，不會因為四個人就分成四種戰鬥，反而會覺得真的像是一個團隊的戰鬥


  而且行星吞噬者的強大也有做出來

  故事是非常飽滿的

  角色也是

  當然爽度也有

  年代感也有做出來，不過並不影響整齣電影太多


  能的話，我會覺得今年漫威這片是值得一看的


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
