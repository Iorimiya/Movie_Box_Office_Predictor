title: '[新聞] 驚奇4超人：第一步導演有望回歸執導續集'
content: '《驚奇4超人：第一步》導演有望回歸執導續集




  《驚奇4超人：第一步》劇照，驚奇4超人中的霹靂火。（迪士尼提供）


  【大紀元2025年08月08日訊】


  （大紀元記者葉子杰編譯報導）


  截至當地6日，《》全球票房達3.82億美元，雖然第二個週末北美票房

  大幅下滑，然而，。


  另外，傳出。


  《》（The Fantastic Four: First Steps，陸譯，神奇4俠：初露鋒

  芒）在北美上映第二個週末位居票房榜首，但相較於首週跌幅達66%，表現並不佳。


  據Box Office Mojo統計，截至週三，全球票房已達3.82億美元。


  據《Variety》報導，迪士尼週三上午舉行了一次重要的財報電話會議，執行長巴布 艾格

  （Bob Iger）認為，該片「）」

  。


  《》在迪士尼接手驚奇4超人的版權之前，該系列已有三部真人版電影

  。


  而《第一步》已成為該系列中票房最高的電影，截至今日，影評網站「爛番茄」影評員與

  觀眾分別也給予86%及91%的新鮮度好評。


  艾格說：「我們越能發掘並開發原創作品就越好。當然，我們正在20世紀製片廠和探照燈

  品牌下開發原創作品。而且，你甚至可以說漫威一直在挖掘其角色庫，尋找原創作品。儘

  管例如之前已有《驚奇4超人》的電影，但我們從很多方面來看，這次的版本算是一部原

  創作品，因為我們把這些角色介紹給了那些完全不熟悉他們的人。」


  另據《ComicBookMovie》《ComingSoon》報導，儘管官方尚未宣布《驚奇4超人》續集的

  任何消息，但預估可能很快就會宣布。


  因為知名內部人士傑夫 史奈德（Jeff Sneider）聽到，「（《

  」。


  至於電影的票房問題，史奈德提到，儘管這部電影的票房表現並不出色，但漫威高層相信

  ，在接下來的兩部《復仇者聯盟》電影《復仇者聯盟5：末日之戰》（Avengers: Doomsda

  y，暫譯）和《復仇者聯盟6：秘密戰爭》（Avengers: Secret Wars）中，驚奇4超人的出

  現會為續集帶來更好的票房表現。




  2024年7月27日，（左至右）「石頭人」艾邦 摩斯-貝克許（Ebon Moss-Bachrach）、「

  霹靂火」喬瑟夫 昆恩（Joseph Quinn）、「隱形女」凡妮莎 寇比（Vanessa Kirby）、

  「驚奇先生」佩德羅 帕斯卡（Pedro Pascal）和導演麥特 夏克曼在加州聖地牙哥SDCC

  的H 廳漫威影業小組會議上發表演說。（Jesse Grant/Getty Images for Disney）


