title: '[新聞] 《驚奇4超人：第一步》試映 媒體給出評價'
content: "《驚奇4超人：第一步》試映 媒體給出評價\n\n【大紀元2025年07月20日訊】（大紀元記者葉子杰編譯報導）當地19日，《驚奇4超人：\n第一步》試映評價出爐，影評員表示，該片是以家庭為中心的故事，電腦特效技術及風格\n\
  是1960年代風格。據一份新報告，該片製作成本比《雷霆特攻隊*》更高。\n\n據《Variety》報導，《驚奇4超人：第一步》（The Fantastic Four:\
  \ First Steps）的\n製作成本超過2億美元，與《死侍與金鋼狼》相似，算是漫威的中等預算，高於《雷霆特\n攻隊*》的製作成本1.8億美元。只有三部漫威電影超過3億美元，分別是《復仇者聯盟：\n\
  無限之戰》（3億美元）、《復仇者聯盟：奧創紀元》（3.65億美元）和《復仇者聯盟：\n終局之戰》（4億美元）。\n\n《驚奇4超人：第一步》距離上映日剩不到一週。與其他大片一樣，一些媒體人已經搶先\n\
  觀賞體驗該片，並且他們在社群媒體X上分享了評論。整體來看，媒體人普遍對片中主演\n陣容給予高度讚譽，同時也肯定了導演麥特‧夏克（Matt Shakman）在電腦特效上的呈現\n\
  ，還稱讚片中以1960年代為背景的風格。\n\n《Next Best Picture》主編馬特（Matt Neglia）在X上（點這）表示，四位主演員表現\n\
  出色，配樂充滿活力，視覺效果賞心悅目。馬特說：「故事聚焦於家庭主題，在當前的漫\n威宇宙中或許稍嫌老套，反派角色也不是最吸引人，但演員們付出很多，讓你深切關注這\n\
  些角色、他們之間的關係以及他們所面臨的世界末日危機。」\n\n《Phase Hero》的布蘭登（Brandon Davis）在X上（點這）說：「《驚奇4超人：第一步\n\
  》在視覺效果上是漫威最出色的作品之一。部分片段讓人聯想到《星際效應》（\nInterstellar），非常適合IMAX觀賞。行星吞噬者非常厲害，銀色衝浪手的造型看起來非\n\
  常棒。視覺特效精緻無瑕。在宇宙和地球兩上，麥特‧夏克曼帶來了一場視覺饗宴。」\n\n\n《驚奇4超人：第一步》電影海報。（迪士尼提供）\n\n《Screen Rant》的艾許（Ash\
  \ Crossan）在X上（點這）說：「《驚奇4超人》視覺令人驚\n豔、風格鮮明、故事豐富，也很容易入戲。我看這部片非常過癮。復古未來主義風格真是\n賞心悅目。最讓我印象深刻的是凡妮莎‧寇比（Vanessa\
  \ Kirby）飾演的蘇‧史東，寶貝\n，我願為你付出生命，你簡直太完美了。」\n\n《ComicBook》的克里斯（Chris Killian）在X上（點這）說：「《驚奇4超人》真是太棒\n\
  了！比起以往任何漫威電影，這部片更像是將（美國漫畫家）傑克‧柯比的想像力真實地\n呈現在大銀幕上。2025年在這部片和《超人》上映期間，或許是電影終於採納了漫畫書那\n\
  一種奇妙怪誕風格的一年。」\n\n電影製片人布萊恩（Brian）在X上（點這）說：「我來的時候心情不太好，但《驚奇4超\n人》真的是漫威宇宙回歸巔峰之作，開場幾分鐘在IMAX中讓我驚豔不已。加納（Garner，\n\
  飾演銀色衝浪手）和昆恩（Quinn，飾演霹靂火）的表現最讓我印象深刻。行星吞噬者賦\n予了這部電影真正的意義，他的存在感即使在銀幕外也能感受到，微縮作品製作得令人難\n\
  以置信！」\n\n製片人戴維斯（Brandon Davis）在X上（點這）說：「在《驚奇4超人》中，演員和角色\n的表現相當不錯，但凡妮莎‧寇比（Vanessa\
  \ Kirby）飾演的蘇‧史東是這部電影的靈魂\n與核心。強尼‧史東（霹靂火）可能是我最喜歡的角色。另外，特別要讚賞美國男演員保\n羅‧華特‧豪澤（Paul Walter\
  \ Hauser，角色未公布）很搶戲，為電影注入了巨大的能量\n！」\n\n影評人基里安（Chris Killian）在X上（點這）說：「我只有一點小抱怨。和《超人》一\n\
  樣，有些電腦合成影像（CGI）嬰兒的畫面有點生硬，可能會讓你做惡夢。我不明白對動\n畫師來說，為什麼逼真的嬰兒動畫這麼難做到，我寧願演員們直接用毛毯包著足球，然後\n\
  假裝那是嬰兒。」\n\n據外媒報導，預計《驚奇4超人》北美首映週末票房收入約在1億至1.1億美元，低於《超\n人》首映週末票房1.25億美元。《Deadline》報導，《驚奇4超人》的預售票房也比《超\n\
  人》低了20%。另據報導，《驚奇4超人》有兩個片尾彩蛋。\n\n《驚奇4超人：第一步》7月23日在台灣上映，7月25日在美國上映。\n\n責任編輯：蘇漾\n\n\
  \n\n--\n                 \n   \n\n\n\n--"
