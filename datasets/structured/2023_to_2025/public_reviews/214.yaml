url: https://www.ptt.cc/bbs/movie/M.1504792071.A.CF2.html
title: '[好無雷] 牠:戰勝心魔是成長的第一步'
content: '網誌好讀版






  記得小時候有轉台看到舊版的，那時的小丑整個就長得很歡樂，動作也有點無厘頭，不過


  驚悚的就是在那看似搞笑的情境下有著極為不舒服的反差，而且都是在光天化日從一些亂


  七八糟的地方竄出來嚇人，彷彿就真的是馬戲團的小丑一樣，整個營造最成功的就是那一


  副尖牙，真的有讓小小心靈的我揪了一下。



  這次2017年的重拍版本，由於電影科技的發達，這個"丑八怪"的嚇人程度更是直直上升。


  那個尖牙更是會讓有密集恐懼症的感到不舒服，小丑的反差感依然存在，嚇人的方式比較


  偏多在落入俗套的回馬槍或音效加上搖頭晃腦暴衝(其實有點好笑?)，不過看著小丑琢磨


  不同角色恐懼所幻化出來的嚇人梗倒也引人入勝。尤其有幾幕更是比想像中的口味稍重一


  點。比起其他恐怖片的鬼那稍微保守一點的舉止，小丑直接就是有辦法對你造成肉體傷害


  ，而且不分晝夜隨時隨地有可能出現，整個帶給人的不安感比什麼安娜貝爾重太多了。



  其實比小丑更值得一提的是這次的小孩角色群，編劇很用心的描述小孩的心魔，更巧妙地


  融入諸多議題，舉凡霸凌、歧視、家暴、媽寶、青春期議題、初戀、勇氣等成長元素，讓


  整部片層次不單純只是嚇人，雖然角色群是小孩，但卻是設定給大人看的，也很容易能夠


  與裡面的情節連接產生共鳴。其中這些小孩有許多超齡的台詞設定，甚至有些舉止也都不


  是一般好萊屋電影會給小孩的設定，更讓那不舒服的反差感加大。



  對於小丑的緣由倒也沒有講得很清楚，不過史蒂芬金大概主要擅長在營造反派角色的壓迫


  力。這次的宗旨，必須突破自己的心魔才能擊倒外在更大的恐懼這個設定也貫穿全片，讓


  整部片的鋪陳更加細膩。運鏡手法上也相當成熟，把小丑那陰魂不散如影隨形的特點表現


  得很好。



  如果能夠把小孩的角色再刪減一點，更加重描寫他們的心魔我覺得會更加精采，畢竟有一


  兩個角色確實稍微路人一點。至於小丑究竟是什麼，一些比較詳細的目的大概就也不算重


  點了，撇除掉一些小bug，<牠>仍然是近來能讓觀眾引起共鳴，帶有自己特色的恐怖片。



  期待續集的推出阿!!



  評分:7.5/10


  --'
