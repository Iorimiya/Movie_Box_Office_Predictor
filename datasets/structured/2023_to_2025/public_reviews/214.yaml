url: https://www.ptt.cc/bbs/movie/M.1753247583.A.E21.html
title: '[好雷] 驚奇4超人 第一步：喜歡這版的霹靂火'
content: '(防雷)

  無雷簡述：

  闔家歡、輕鬆、無壓力、家庭式娛樂片






















  快速打幾個看完想到的，雜亂想到的沒有順序



  1.一開始跳過起源節奏還不錯


  但是接下來有段文戲有點拖，


  一直到衝浪手現身才比較帥



  2.行星吞噬著登場威壓感蠻強的，可以


  3.在尋找吞噬著後跟銀色衝浪手的脫逃動作戲，


  這段好看，跟隱形女要生小孩的交錯緊張感


  還是銀衝的動作挺帥的，這段拍得不錯



  4.這版Joseph Quinn的霹靂火絕對是亮點，


  個性活潑討喜，而且不會過度腦衝有責任感


  劇情中一直想探討銀色衝浪手的衝浪板是不是身體一部分超好笑



  而且最後看到吞星要跑出來時那句


  「告訴富蘭克林他叔叔愛他」超帥！



  5.石頭人感情戲碼我自己覺得很多餘，但有人覺得喜歡XDD



  6.我不喜歡讓Reed在返程記者會上說出「他要我們的孩子就放過地球」這劇情


  太不合邏輯，可以理解劇情設定想要製造衝突


  地球上的人當時什麼都不知道


  根本沒有必要自爆，


  但是如果這句話讓一開始


  銀衝造訪時給全世界的人來講感覺會更好


  真的太難想像Reed會說這樣的話



  7..瞬移地球的解法我覺得真的太荒唐XD


  當時腦海中跑出來的想法是這不是派大星嗎？


  派大星的那句話


  「我們應該把比奇堡移到旁邊去！」很有異曲同工之妙


  但在劇情中可以理解只是真的很荒唐XD


  8.片尾畫面2個

  (1)只給看面具的末日博士

  (2)卡通


  9.一開始好像只有簡單驚奇四超人版本的片頭，


  沒有那個「登、登登登登、登登登登」然後一堆畫面刷下來的Marvel





  大概這樣吧想到再補，


  整體而言蠻喜歡這部的，小缺點有


  但整體真的是一個蠻不錯的第一步


































  --

  這版銀衝真的也很帥(忘記強調

  那段脫逃追逐銀衝很強~'
