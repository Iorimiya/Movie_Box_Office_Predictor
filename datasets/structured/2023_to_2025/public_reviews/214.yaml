url: https://www.ptt.cc/bbs/movie/M.1183533194.A.B4B.html
title: '[好雷] 只賣有機肉＊人肉只是踏上成功的第一步'
content: "網誌版：\n\n\n\n        只賣有機肉＊人肉只是踏上成功的第一步\n\n\n        一開始只是因為片名和簡介買了這門票\n\
  \        後來才發現\n        原來這片中有許多丹麥的大牌演員演出\n        電影裡的兩位主角\n        一位是主演過《愛情拼圖》的Nikolaj\
  \ Lie Kaas\n        另一位主角則是演過《007皇家夜總會》的Mads Mikkelsen\n        Nikolaj Lie Kaas飾演愛將自己宰過的動物做成骨骸標本的屠夫「畢亞」\n\
  \        Mads Mikkelsen則是飾演因太容易流汗而遭他人厭惡的賣肉商人「史凡」\n        故事就從史凡不願區居於討厭他們的老闆「漢頓」手下\n\
  \        想自己出來開業的那天起.....\n\n\n        整部片子瀰漫了一種黑店式的幽默\n        在一個不停失敗者的面前\n  \
  \      突然出現希望\n        我想任誰都會想要把握住吧！\n        人類為了成功努力不懈\n        只是\n        在這裡使用了黑暗的做法\n\
  \        陰錯陽差之下\n        人肉雞小排的推出\n        成為小鎮上的新寵\n        史凡也第一次嘗到被人需要、被人尊重的感受\n\
  \n\n        令人驚恐的是\n        本來似乎存在一絲的道德感\n        卻在成功、金錢、渴望、受寵之下殺紅了眼\n        原本的不小心\
  \   害怕與罪惡感\n        轉變成故意   忽略與冷靜\n        好像任何一個人都只是人肉的聚合物\n        都只是可以肢解的肉品\n\
  \        夜晚的肉店張開了他的冷凍庫大嘴\n        悄悄將落單的人凍成肉塊\n        從不認識   到認識   直至過去曾喜歡的對象\n\
  \        都變成櫥窗裡販賣的商品\n\n\n        以為這最後應該演變成玉石俱焚的結局\n        卻沒想到\n        連續的碰巧導致想像不到的溫馨結局\n\
  \        畢亞在生死交錯的關頭\n        喚醒了自己的良知\n        才發覺自己是需要愛人也可以原諒他人的\n        而雙胞弟弟帶來的雞肉\n\
  \        也恰巧地躲過了政府食品處的檢驗\n        史凡才終於知道\n        人們會來排隊買肉是由於他自己的進步\n\n\n     \
  \   最末\n        導演用一種世界重見光明的手法\n        讓一切回歸於和諧與平靜\n        刻意忽略黑暗造成的後果\n     \
  \   也許\n        是要告訴我們\n        不管是在哪裡\n        世間並沒有絕對善惡有報這回事吧！\n\n\n\n\n\n--\n\
