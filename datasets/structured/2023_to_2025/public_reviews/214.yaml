content: '看到新的預告, 我也猜到電影版會有什麼留言

  還是來介紹一下這個銀色衝浪手吧

  為了避免被打成Marvel吹, 以下有兩種介紹, 大家挑自己喜歡的


  真的想知道背景的:

  有看過預告的大概就知道, 這片的背景不在MCU主世界

  所以銀色衝浪手也不是主世界那個

  而是Shalla-Bal, 這角色不但原本就在漫畫了

  而且是196x年就出現了. 1982年時變成銀色衝浪手

  不是Marvel 為了換成女人才創造出來


  想靠么Disney的:

  DEI啦!! WOKE啦!!

  漫畫就出現又怎樣?

  電影觀眾知道的銀色滑板就是個男的!

  平行世界又怎樣?

  就是為了讓女人演, 為了這碟醋包了盤餃子


  --

  就醬, 自己挑自己喜歡的答案看就好.. 別戰


  --


  --'
