url: https://www.ptt.cc/bbs/movie/M.1753284499.A.7A7.html
title: '[討論] 驚奇四超人:第一步的編劇漏洞&腦補(全雷)'
content: '先說結論

  從目前編劇的缺陷來看

  強烈懷疑這部的劇本其實寫好很久了

  而且還可以是接近星際效應那種 給復聯五一個強大的起頭那種

  當初可能是要用來引入LOKI讓多元宇宙開啟之後最強的那個Kang

  而不是現在的Doom

  也就是說這部本來應該會與各個前作有強烈聯繫

  只是前面幾個作品爛到不行 為了切割 只好臨時改成現在這樣


  這部比較重要的前提有三個

  (一)F4成為英雄最多不到五年

  (二)F4是這個宇宙唯一的英雄(不是唯一的超能力者因為Doom和各種反派存在)

  (三)多元宇宙在這個世界目前只是理論成立且被接受


  以下是目前幾個有明顯缺陷的劇情



  1.來自深太空的訊號


  Reed一直有在觀察 但卻不怎麼關心

  收到的時候還一副緊張的樣子 結果反而是團隊中跟科學最無關的Johnny最關心

  這部分劇情完全沒有解釋

  後續則用來洗白衝浪手


  其實可以把這部分改寫成四超人當年上太空的原因

  e.g.Reed不斷從外太空收到神秘訊號 協助他持續發明出劃時代的發明

  逼得他實在很想上去一探究竟 這才把幾個朋友拉上太空 才出事

  這部分其實挺重要的 前兩個版本也著重描述了上太空的原因

  因為這是讓Reed內心產生內疚的最大根源 大多時候也會是他的行為動機

  電影的第一幕也把這當作懸疑點 但真相卻不怎麼重要

  只是死亡星球的殘響跟衝浪手故鄉的感謝

  實在浪費了這個很可能貫穿全片的懸疑點


  2.銀色衝浪手的身世

  完全沒必要 在這個宇宙中嚴格來說還沒有任何外星人

  世界也只有F4這一組超級英雄

  這裡突然引入外星人

  還念了一堆外星球的名字 完全不重要 也沒人記得

  然後F4就這樣接受了

  銀色衝浪手有甚麼能耐被招募成諭示者也沒講

  (諭示者Herald,古代負責傳遞帝王命令的官員,LOL裡的那隻大蟲也叫這名字)

  在最終戰鬥中衝浪手甚至可以說全程掛機 最後還坑老闆

  讓這個腳色只有很淺薄的改邪歸正 這種俗套的反轉


  3.行星吞噬者的來歷&動機

  在劇中只有幾句他自己碎碎念的獨白說自己曾經也是凡人

  是被.另.個.世.界.的人改造成這樣

  除此之外也沒有明確他的能力

  目前這樣寫其實就是個開大飛船的巨人

  另外也沒有講銀色衝浪手選到地球的動機 如果都要把選擇的責任丟給衝浪手

  必須要有一個很強大的理由才能讓觀眾信服


  4.鼴鼠人&紐約疏散

  這部分是想塑造Sue是F4對外的主要窗口沒問題

  但搭公車疏散到地下世界是幹嘛

  能搭到地底 都能搭到隔壁州了 所以疏散這部分完全失去意義


  5.富蘭克林的能力和價值

  在這部片就很廉價且不明朗的用掉

  他的能力到底是甚麼 語焉不詳

  本來還以為編劇終於要出重手 結果還是活過來了


  6.最終決戰的邏輯缺失

  一來行星吞噬者沒有理由自己出手 讓衝浪手去虐菜就行

  二來沒有好好鎖定富蘭克林

  三來大可以直接把星球吞了再搶小孩 完全沒必要直接搶


  7.無法解釋Doom為何不出面

  宇宙級別的事件

  為什麼Doom不出手

  本片利用不同宇宙逃離了616中的薩諾斯出現時這人在幹嘛的問題

  但沒有解答這個問題


  8.其他

  .黑人女局長or官員?定位不明 完全不知他代表的是甚麼

  .新聞畫面帶到拉脫維亞代表缺席 卻沒有繼續提到Doom的存在

  .石頭的自卑心態在這集只有用很經典的電視螢幕倒影呈現 但力道明顯不足

  .這個世界的科技風格 對這個英雄組合幾乎沒有價值觀或戰鬥方面的影響

  只是讓觀眾能區分這個宇宙和616的差異 實在很可惜

  .把地球傳送走完全就是搞笑 人家早就超光速飛行 隨便都能找到你

  連帶導致全球限電是個蠢行為 唯一作用只有讓石頭人長出鬍子

  但你是不會在白天刮鬍子嗎

  不如讓F4毫無辦法背水一戰 增加後續劇情反轉的張力


  綜合以上的缺陷

  腦補仔再試著把前作的重要元素加進來

  就會有這樣一個版本:

  -------------------------------------------------------------


  Reed在做研究的時候接收到來自深太空的訊號

  這訊號幫助他開發出了許多劃時代的發明和一些神秘的儀器

  也讓他對其產生好奇

  於是決定帶著隊友去到這個訊號的根源一探究竟

  結果在該處遭遇宇宙輻射 原來訊號的根源是一個跳躍點

  (驚隊2的梗,MCU將其設定為接近蟲洞 原先只是交通用

  但在驚隊2中也成了多元宇宙的樞紐)


  而神祕訊號讓他製造的一些神秘儀器發出的訊號

  讓行星吞噬者認為改造他的人就在地球

  這個人改造他的目的是逼他吞噬行星產生能量(永恆族)

  就決定到地球一趟

  於是派出衝浪手 中間部份就與原片一樣 出發打怪獸 被虐 逃跑 生小孩

  回到地球 吵架 抗敵


  這時候衝浪手直接殺過來 戰鬥之餘發現當時吞星的能量

  居然能啟動神秘訊號讓他打造的那些神祕儀器

  還可以讓銀色衝浪手失去戰鬥能力(艾芭版四超人2的引用)

  吞星失去幫手 冷靜決定省事點 先把地球吞了再抓小孩

  於是F4拯救地球失敗 絕望之際神秘訊號再現 並叫了Reed一聲先祖

  和他說只要啟動這個儀器 就能打敗吞星

  (原著Kang就是Reed的後代 他也來自這個宇宙 所以TVA的科技風格才跟F4這麼接近


  於是眾人開始守護女神 為的是讓神祕儀器啟動

  最後儀器啟動 出現的居然是Kang

  原來這個訊號是困在未來的Kan透過多元宇宙傳給Reed的 一切都是他的計畫

  也透過和驚奇少女/十環相似的神祕儀器

  讓F4可以和吞星對抗

  也讓Kang從某個宇宙逃回來(蟻人2的梗)

  (Kang也正是當時改造吞星的人)

  Kang的儀器讓眾人輕鬆擊敗吞星 塑造Kang的強大感

  但這個地球已經被吞星吞沒了 即便他們打敗了吞星 這宇宙也註定消亡

  為了孩子 一行人決定用那些神祕儀器穿越多元宇宙去到616

  殊不知去到616就是Kang的最終目的

  到此就與雷霆小隊的片尾接上了


  最後片尾讓死侍從立體門跑出來找616隨便一個人傳遞危機感 結束

  因為當時的TVA就是在監控各個時間線的Kang 所以他們第一個發現也是很合理的


  這樣就把蟻人2/驚隊2/Loki/死侍/永恆族/尚氣/06版四超人連在一起

  用一個宿命(Kang讓自己先祖成為英雄好拯救自己)

  然後悲壯(F4宇宙毀滅)的結局 順理成章的打開復聯5

  ---------------------------------------------------------------------


  這樣一來First step 其實指的也不是F4的 因為片中他們也不是First Step

  這個First step 指的是Kang宏大計畫的第一步

  就能讓Kang這個反派終於被塑造出一點樣子

  其實目前也看得出本片很努力想跟很爛的前作切割

  所以選擇目前正片這樣的處理

  但要是真的有類似腦補內容的大一統 感覺還真不錯



  --'
