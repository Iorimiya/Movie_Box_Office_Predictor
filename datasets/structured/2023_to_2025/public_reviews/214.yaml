url: https://www.ptt.cc/bbs/movie/M.1674559401.A.4DF.html
title: '[討論] 小藍 成年的第一步'
content: '導演李怡芳的《小藍》

  講述青春期探索未知領域的故事


  以下無雷，純個人心得分享


  劇中人物的台詞寫得很好

  也很有共鳴

  導演說她為了更了解年輕人在想甚麼

  會上D卡跟交友軟體「田野調查」（還有西斯版）

  她也身為人母喔，真是有趣

  難怪《小藍》會進榜學生最愛2022國片前十名


  看完電影不禁想

  學生時期的我們

  在父母的要求下必須「純淨的像張白紙」

  但驪歌一響

  紙上得要擁有豐富的顏色

  完全沒有一個過渡期，或是被人教導

  那個落差感，再加上略為晃動的鏡頭

  把迷茫、困惑的情緒渲染給觀影者

  電影中用更直接的「性」的議題去探討

  我覺得挺好


  我是在CATCHPLAY+串流平台看到獨家

  被吸引才點開來看

  沒想到意外發現一部好電影



  題外話

  我很喜歡劇中飾演媽媽的涵冷娜

  她的脫口秀真的很有趣XD


  --'
