title: '[極好雷] 【驚奇4超人：第一步】'
content: "昨天休假臺中的氣候很妙(已過00:00)~幾乎半小時左右陰晴輪替...\n逛百貨時想說看部電影，直覺就挑了4超人！\n多年前的銀色衝浪手印象深刻且覺得不錯，第一次重啟版沒看...\n\
  且之前雷霆彩蛋看完多少好奇這次的重啟...\n如其它篇討論過的，預告配樂與歌曲很洗腦！\n\n這回進場耳邊傳來熟悉的音樂...\n原來是《楓之谷》20周年輪播！非常喜歡~致學生時期的美好回憶。\n\
  \n也很喜歡這次用【角頭】來提醒觀影需知(之前是間諜家家酒)~\n剛好前排的遲到觀眾用手機照明在找座位時聽到\"別用手機啦！\"嚇一跳XD！\n\n正片開場挺突然的，剛開始對角色停留在【金牌特務2】、白寡婦、\n\
  有點像薩諾斯(留鬍子)、看手繪海報以為霹靂火是女演員...\n後來發現劇情很順跟著融入後越來越喜歡這部~每位平均發揮魅力又不搶他人鋒頭！\n\n黑洞的時間問題略過，在既復古又高科技並存的衝突感實在引人入勝~\n\
  片中穿插的名言也會使用引號，描述為母則強與感性、化敵為友。\n\n劇中會心一笑的點看頻率，個人蠻喜歡霹靂火與石頭人描述衝浪手互相吐槽時、\n以及隱形女閃現、寶寶出生時特寫\"\
  5\"\n\n用真人寶寶給推~雖然沒有哭，但在蘇抱著富蘭克林說服眾人時有感動到！\nCPR那段則在【不可能的任務3】才讓我淚崩...\n\n片尾沉浸在配樂也有將兩段彩蛋看完，如果前後彩蛋互換是否會更好些？\n\
  雖然慢了幾天才看，這部一樣推薦給還沒看過的朋友們~\n\n\n\n\n\n\n\n\n\n\n\n有喜歡的會持續進電影院捧場~彩蛋有黑絲給推！\n\n--\n\
