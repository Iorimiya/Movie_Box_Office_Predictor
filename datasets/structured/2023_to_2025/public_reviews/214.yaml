url: https://www.ptt.cc/bbs/movie/M.1750588977.A.EDD.html
title: '[新聞]《驚奇4超人：第一步》事件將連向《復仇者5'
content: "《驚奇4超人：第一步》事件將連向《復仇者5》\n\n【大紀元2025年06月22日訊】（大紀元記者葉子杰編譯報導）如果想看明年上映的《復仇\n\
  者聯盟5》，《驚奇4超人：第一步》可能是必看的電影。據報導，《驚奇4超人》中發生\n的事件與《復仇者聯盟5》有直接相關，並且續集可能已經在籌備中。\n\n上個月底才傳出，漫威在美國洛杉磯舉辦《驚奇4超人：第一步》（The\
  \ Fantastic\nFour: First Steps）試映會後，片尾彩蛋也在網上流出，其中出現了《復仇者聯盟5：末\n日之戰》（Avengers: Doomsday，暫譯）中的大反派「末日博士」。（先前報導：《驚奇\n\
  4超人：第一步》試映會片尾彩蛋遭洩漏）\n\n據《Deadline》報導，18日在CineEurope的主要製片廠展上，展商們觀看了由漫威影業總\n裁凱文‧費吉（Kevin\
  \ Feige）介紹的新預告片《驚奇4超人》，費吉還透露了《復仇者聯\n盟5》正在倫敦拍攝，預計於2026年12月上映。他表示，《驚奇4超人》中的事件將直接引\n\
  向《復仇者聯盟5》。\n\n目前《復仇者聯盟5》細節仍然保密，漫威尚未發布關於劇情的任何資訊。不過，據《\nComingSoon》報導，有人推測小勞勃‧道尼（Robert\
  \ Downey Jr.）的「末日博士可能會\n以某種形式出現或被暗示，或者《雷霆特攻隊*》（Thunderbolts*）的片尾彩蛋也可能會\n以某種方式得到回應。\n\
  \n5月，《雷霆特攻隊*》結束漫威電影宇宙（MCU）的第五階段後，正準備於7月以《驚奇4\n超人》開啟第六階段首部電影。據《Variety》的消息，漫威正在「開發」《驚奇4超人》\n\
  續集。\n\n在重啟電影《驚奇4超人》上映之後，將接連推出《蜘蛛人：重生日》（Spider-Man:\nBrand New Day，暫譯）、《復仇者聯盟5》、《復仇者聯盟6：秘密戰爭》（Avengers:\n\
  Secret Wars），以及可能還有一部神秘的漫威電影，這些作品將共同完善第六階段多元\n宇宙的篇章。\n\n\n《驚奇4超人：第一步》（The Fantastic\
  \ Four: First Steps）劇照，驚奇先生。\n（迪士尼提供）\n\n隨著《驚奇4超人》即將上映，片商也推出電影相關的周邊商品，其中一桶獨家爆米花吸\n\
  引了漫威粉絲的眼球。新款爆米花桶設計（點這裡看照片）體現了驚奇先生經典的力量：\n一隻細長的手臂環繞著桶，這是向驚奇先生的彈性、延展性和耐力致敬。他的四肢、頸部\n\
  和軀幹可以伸展到不可思議的長度。\n\n桶子上還飾有復古風格的圖案細節、新制服，以及他們在影片中扮演重要角色的飛船「精\n進號」（Excelsior）。\n\n\
  費吉接受《帝國》雜誌採訪時澄清《雷霆特攻隊*》片尾彩蛋中出現的驚奇4超人的太空船\n與《驚奇4超人》中的飛船不同。他5日表示，他們的飛船名為「精進號」，是的，MCU中\n\
  會有一艘驚奇4超人的飛船，但它不一定和《雷霆特攻隊*》片尾彩蛋中出現的那艘是同一\n艘。（先前報導：《復仇者5》導演執導了《雷霆特攻隊*》的片尾）\n\n《驚奇4超人：第一步》7月23日在台灣上映，7月25日在美國上映。\n\
  \n責任編輯：蘇漾\n\n\n\n--\n                 \n   \n\n\n\n--"
