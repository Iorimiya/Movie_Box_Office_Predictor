title: '[普雷] 驚奇四超人：第一步 串流觀後心得'
content: "驚奇四超人上D+串流了，看完了之後其實覺得還行\n我是很喜歡這個IP，畢竟有個情懷的加持\n看都看了還是分享一下心得\n\n這次最喜歡的角色真的非霹靂火莫屬，喬瑟夫·昆恩的表現真心不錯\n\
  個人覺得不輸克里斯·伊凡的版本，甚至刻劃的還更深入一點\n (克里斯·伊凡在死侍金鋼狼的客串我也超愛FLAME ON\n這版除了原本放蕩不羈的樣子，更多了責任感的表現\n\
  對家人的責任、作為超級英雄的責任、成為the BEST Uncle之後的責任\n真的都描寫得很不錯\n\n這版雖然對家庭、情感的描繪變多，但劇情真的偏可惜\n\
  只能期待Doomsday中這個第一家庭可以表現多一點\n畢竟他們也是後續的主線之一，拜託了羅素兄弟...\n\n--"
