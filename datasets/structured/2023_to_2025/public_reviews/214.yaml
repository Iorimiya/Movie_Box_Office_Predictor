url: https://www.ptt.cc/bbs/movie/M.1751447929.A.EEB.html
title: '[討論] 小勞勃道尼會登場驚奇4超人第一步嗎？'
content: '不知道這次的驚奇四超人電影末日博士會不會出場？

  自從公布末日博士是由小勞勃道尼飾演後，就一直在想漫威到底要用什麼方法讓他進入

  MCU

  畢竟末日博士就是F4裡面的其中一個最大反派也是驚奇先生的宿敵

  從這部電影作切入可以說最適合不過


  不得不說還蠻驚訝漫威選擇小勞勃道尼演末日博士

  在選角這Part只能說是精美的一手，感覺或多或少都會為這次F4加分

  也可賺一波聲量，我自己也是很期待小勞勃道尼回歸MCU


  但從預告來看，這次的反派應該會著重在吞叔跟銀色衝浪手

  更重要的是富蘭克林出生了，這個角色在漫畫裡也是能力最強的變種人之一

  可能末日博士要透過他來做壞事？這樣感覺可以很直接帶出他的陰謀

  那如果這部沒有末日博士的出現，那在復聯5要如何直接銜接也是個看點...

  但無論如何，感覺這版F4提到蠻多重點也會直接影響後續復聯的發展

  而且電影風格也走復古未來風，確實也很有特色(畢竟是平行時空的故事

  終於漫威要慢慢收縮從復聯4就展開的多元宇宙故事



  還有最新釋出那版預告，霹靂火一直問石頭人現在幾點，蠻好笑的

  反正最後一定也會說，還是漫威這次預判大家的預判到電影最後都沒說也有可能

  希望末日博士可以登場，或是彩蛋也可以啦


  --'
