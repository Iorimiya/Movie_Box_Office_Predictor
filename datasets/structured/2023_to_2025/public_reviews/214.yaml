url: https://www.ptt.cc/bbs/movie/M.1753241990.A.851.html
title: '[好有雷] 驚奇四超人：第一步'
content: '節奏明快

  只有大概進度條30–40%的時候會有點拖

  不算超級英雄片

  更多是在刻畫家庭的羈絆之類的

  中間演講稿可以列入公關教材

  接近美隊2的隊長廣播水準


  有幾處畫面暗示毀滅博士的存在

  但也只是帶過


  沒什麼大場面或戰鬥

  中段的蟲洞戲有拍出緊張感

  後段大戰也只是點到即止 邏輯稍微有點缺失


  四個人各有特色

  全員都算有帶腦

  但石頭人的部分稍弱


  除了片尾畫面

  基本沒有特意帶到漫威其他作品

  是獨立性滿高的一部電影

  算完美避開原宇宙中

  「這群人以前躲哪了」的難題



  可惜的是沒有讓人震撼的猛料或劇情轉折


  配樂是蜘蛛人的Giacchino做的

  動機曲調那四個音符非常明顯 以弦樂和人聲為主

  但多到讓人有點疲勞


  以Feige重新拿回大權後的第一部

  及格 不到很優秀

  但不會有美隊四和雷霆那種看完讓人噁心的感覺

  給過




  --

  邏輯缺失就是沒解釋為什麼吞星要自己下來

  叫衝浪女出手也行

  把嬰兒移走也蠢 如果人家全程鎖定 那不就做白工

  他甚至可以先把地球吸了再抓人

  所以我本來以為他會這樣做 逼F4穿越多元宇宙

  連到雷霆片尾 真這樣就挺猛的'
