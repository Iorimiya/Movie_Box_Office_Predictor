url: https://www.ptt.cc/bbs/movie/M.1744393711.A.957.html
title: '[普雷] 復仇反擊戰:先說好這是業餘的'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  復仇反擊戰是雷米馬利克主演的最新諜報片，講述一個中情局後勤人員妻子遇害，

  男主下定決心從後勤人員轉上前線，親自解決殺人兇手


  本片英文原名「新手」或是業餘愛好者，原本是講說男主角是新手前線人員，沒想到

  指的是導演也他媽業餘的，這諜報片從頭到尾就一次近身肉搏，還是勞倫斯費許朋上場

  一次飛車槍戰戲，沒了，剩下都是炸彈，最慘的是一半的炸彈都在預告透露了，所以

  想看動作片的一定會無聊到想閃人


  不過因為事先得知這件事情，所以真的開始看反而開始欣賞不是戰鬥爽的部分，男主

  要蝦仁豬心，而劇本聚焦的是豬心而不是蝦仁，可以理解是小說改編會變成的結果

  就以大反派下場為例子，大反派親自把手槍交給男主要他開槍，笑他不敢，男主真的

  沒有開槍，但是他叫了國際警察將反派逮捕，真正做到豬心


  事實上反派說的近距離殺人受到創傷是真的，可以去看「論殺戮」這本科普，由西點

  軍校老師撰寫的，近距離開槍殺人和遠距離發射飛彈，心理創傷是完全不能相比的

  不過男主身為後勤宅宅，運用了自己的智慧，一個一個把反派給解決掉


  所以這是一部劇情片而不是動作片，雖然預告根本擺明就是來詐欺就是了


  是說罰叔真的是出來給大家興奮一下，根本啥事都沒做


  --'
