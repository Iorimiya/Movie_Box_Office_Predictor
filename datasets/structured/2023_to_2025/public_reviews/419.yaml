url: https://www.ptt.cc/bbs/movie/M.1744651448.A.A4E.html
title: '[雷] 復仇反擊戰 大家人都很好'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  我覺得過程中都算不錯看

  但覺得這部壞人也太不壞了吧


  花粉妹不趁勝開槍打死主角，只會拳打腳踢然後一心只想落跑


  游泳哥是真的沒得反擊這邊不怪他


  爆炸哥看到主角已決定不解除炸彈後悠閒慢慢走掉，為什麼不拔槍射主角，或是主角靠近時

  乾脆一起爆一爆同歸於盡


  上述都還在可接受的範圍內

  最不懂的是最後的主犯，一開始幹嘛還要敲頭抓主角，直接射死就好，好可能要抓走凌虐或

  是有問題要拷問，但抓走後不但沒對主角做什麼，還拿槍給他射，如果真的射，啊主犯不就

  掰掰了...



  我不太懂主犯下跪想讓主角殺的原因是為什麼?


  然後壞人發現船被控制後很急很生氣，一樣也不對主角開槍，乖乖束手就擒等待國際刑警到

  來，是我就氣死了把主角打成馬蜂窩，到底是什麼東西，這是壞人嗎？


  結尾真的不太懂，如果是其他動作片的壞人，這主角後面應該死好幾回了。





  --'
