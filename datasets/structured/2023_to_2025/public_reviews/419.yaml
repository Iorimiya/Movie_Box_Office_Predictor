url: https://www.ptt.cc/bbs/movie/M.1744374296.A.422.html
title: 'Re: [ 負雷] 有夠Peace的復仇反擊戰~'
content: '他要找的人有4個，每個都有演如何找到及殺人手法

  一開始主角用他調查及分析的天賦找到一個相關女性，查出他常出沒店家由此延續下去


  第一個死的女角：他把花全部買下，因為有演她有支氣管疾病所以趁她密閉治療時潛入，不讓她出去灌花粉逼她招出開槍者下落，但她不從主角一時心軟放出來就一陣扭打女角逃跑時被車撞死，主角撿了她的手機後逃跑，但手機後來沒派上用場還害主角被黑人教官追蹤（這段有秀一下主角做的炸彈真的會爆）


  第二個死的男角：主角靠線人幫忙找到，知道他會單獨包下高空泳池，所以他潛入飯店安裝加壓器，等他在游泳時主角現身要他招出下落，但他說都只跟另個人聯絡（這段有點模糊），之後跟他說你趕快游上岸可能不會死，講完就用壓力讓泳池碎裂他就摔死了

  第三個死的男角：假裝要賣飛彈給他把他釣出來，但主角在飛彈箱子裡裝上一堆感應設備的炸彈，他招出主嫌只會在船上跟港口位置還有跟那2個人聯絡，主角要他交出手機後跟他說你跑快點可能不會被炸死，接著就出現大爆炸～


  第四個沒死的主嫌：這段主角遇到開頭那位他自己認為看不起自己是內勤的特務同事，但特務說是因為關心主角才獨自來找他並不是要抓他，跟他分析繼續殺人的下場會如何後離開，之後主角故意跟港口搬貨的人搭訕，就突然有人把他打昏載上船跟主嫌見面，主嫌知道是他殺了前3位以為他是特務，但主角只說是為了老婆來，主嫌才知道他是獨自來復仇的一般人就說出和教官類似的話，認為他用間接手法殺人是因為沒法面對面下手，所以做出和教官相同的是要他拿槍對他開槍但主角無法下手（這時旁邊都有人拿槍指著主角），接著就是內心戲跟對話然後主角說出我只是要拖긊伅﹛A因為我破解船上電腦讓他開去芬蘭，我自己就是破解的發射器也早通知警察要他們來這裡（這段有反轉到，前面雖然有演一些計劃片段但本以為主角會同歸於盡之類的，可能是遇到特務同事後改變想法吧）

  最後主嫌看到被特種部隊包圍或認為寡不敵眾就舉手投降，主角也活了下來….剩下的劇情我也懶得說了



  這裡是演殺手、特務他們真的會殺人，但就是看不起一般人真的會開槍殺人，不過他們也不會隨便動手殺一般人，就像主嫌說殺他老婆是因為有其必要原因才會下手



  很多內容電影都有演出來也有前後呼應，如果看完就忘的話希望我寫的這些能喚醒記憶，目前IMDB有6.7，爛番茄65爆米花89應有其原因

  老實說看到斷章取義、沒頭沒尾就負評對這部片還挺無辜的


  -----

  Sent from JPTT on my iPhone


  --'
