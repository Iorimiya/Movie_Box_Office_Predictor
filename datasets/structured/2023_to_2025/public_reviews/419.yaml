url: https://www.ptt.cc/bbs/movie/M.1744429858.A.F1E.html
title: '[普雷] 復仇反擊戰--輸重案對決15年 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


























  我能理解想要表現主角就是普通的科技宅

  但是手法一樣能拍得讓人很爽，好嗎


  重案對決也沒哪個是用打鬥技巧或武力讓目標掛掉

  每個環節觀眾都看得清清楚楚


  這部片把時間放到主角的哀傷，然後小細節不處理

  事後回顧也行啊


  例如說第一個女的死於花粉

  大概是她有花粉過敏之類的吧

  可以多一個查到資料有花粉症過敏之類的

  還有再多一個診所構造

  不然進去發現門不能反鎖，是在搞笑喔


  從照片找到第二個歹徒的細節這樣的劇情就很ok




  然後與其要讓主角留她命問其他人下落

  改成乾脆點駭入儀器直接弄死她還比較爽

  絕命終結站的日曬儀抄一下啊

  看到智商170的主角放他出來，整個無言



  被炸死的也很奇怪

  明明有同夥

  主角還讓同夥能離開


  我看到真的翻白眼

  主角不怕同夥繞出去用槍威脅他喔


  欸......還真的沒有欸


  三小??




  優點也是有啦

  那個駭入系統讓全世界都拍到他

  和最後把船開去芬蘭，我是覺得不錯


  但節奏真的是很悶












  --'
