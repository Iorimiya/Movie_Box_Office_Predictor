title: '[包場］1222 【罪惡對決】長春國賓包場'
content: '幫友代PO


  電影包場宣傳～



  【罪惡對決】(In the land of Saints and Sinners)在2023威尼斯影展首映，爛番茄評價

  超過80分，上架多國串流平台後皆是電影榜第一名!


  這部是以1970年代愛爾蘭為背景發生的劇情動作片。由連恩尼遜【即刻救援】、凱利肯頓【

  伊尼舍林的女妖】、希朗漢德【貝爾法斯特】、傑克葛里森【冰與火之歌】領銜主演。


  歡迎有興趣的粉絲一起來參加，也希望大家會喜歡這部電影。


  下方有報名表單，請匯款後再填，也歡迎多多分享本活動。


  日期：12月22日(日)


  ●活動地點：長春國賓影城(台北市中山區長春路176號）

  ●電影分級：輔12(請參加者自行斟酌)

  ●開演時間：14:00~15:00  (片長106分，待12/18影城排場次後確認開演時間)

  ●價格：300元/人

  ●預計當天開演四十分鐘前於攤位桌前劃位，亦可代領，但須提供代表人姓名以及電話確認

  ●預計於12/19(四)晚間寄出活動行前通知


  主辦聯繫email: re.huang1647@gmail.com


  --'
