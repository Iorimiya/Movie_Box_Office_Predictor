title: '[微雷] 東京牛仔很忙 觀後感'
content: '無雷：

  「凝望蒙大拿的壯闊美景，讓人想奮不顧身再來一次。」


  微雷：

  人生總有毫無進展、無限兜圈的時刻。不僅腦袋固化撞牆，事情發展也極盡荒誕。


  每個陷入存在危機的上班族，也曾想到一樣的解方：出國。


  換了一個國家、觀看別人的生活，我們又開始發揮過盛想像力、忍不住心生嚮往。只因眼

  前風景實在太美。


  即便能力有限、道路充滿險阻，也想盡情馳騁一次。


  這次能走到不同的遠方嗎？陪東京牛仔再次找回自己的人生。


  --'
