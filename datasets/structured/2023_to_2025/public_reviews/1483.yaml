title: '[好雷] 女稅務員2'
content: '第一次看伊丹十三的片就是女稅務員

  當時看完馬上被伊丹十三大導演圈粉

  之後又看了民暴之女跟超市之女

  都超好看，最近才有機會再看到續集


  沒想到續集看完真的有夠無奈

  不過還蠻因應時事的，就是邪教治國

  我想可能各國都有這種社會結構吧?


  這片一開始就講建商們

  如何吃香喝辣的草菅人命

  後來發現建商的錢都從邪教來的

  這戲好像是在奧姆真理教之後拍的

  之後伊丹十三的片都跟反邪教有關

  但最後伊丹十三也死於非命

  說是自殺，但也不知道是不是被自殺?

  還好他唯一的女主角兼老婆宮本信子還活著

  而且他也有繼承人，像黑澤清、周房正行等


  這片把政治、黑道、建商、宗教都綁在一起

  有點像是國片情義之西西里島(黑金)的感覺

  可能黑金導演麥當雄有看過女稅務員2吧

  但台灣人看過這部片的人好像不太多


  反正最後這票共犯結構還是逍遙法外

  想到有次新聞報導立法委員想立宗教管理法

  但怎麼提案都無法通過，原來很多立委都是信徒

  所以他們的支持者都是宗教家，所以宗教在法律之上

  看每個政客選舉時都要去拜拜才有選票

  那如果宗教法通過，他們下屆一定選不上


  日本感覺應該也是這樣，新興宗教一大堆

  結合建商跟政客跟黑道從事土地都更開發案

  法律管不到這些身世名流達官貴人

  頂多只能管管小老百姓


  如果對於最近很紅的網飛紀錄片很有興趣的人

  可以去看看女稅務員2，等於是把紀錄片拍成電影

  而且這些日本新興神道教還傳了好幾代目

  很多政商名流高知識份子都是信徒

  就像謝長廷信宋七力一樣


  可能因此共匪才想打倒一切牛鬼蛇神

  讓共匪成為中國唯一的宗教跟黑道吧

  但結果就是像改革開放前大家窮得很開心

  反而民主國家宗教經濟自由就會出現這種現象

  所以這些宗教都是有政府高層當後台的

  所有的證人都會被不明不白的給暗殺掉


  宗教信徒多，出錢幫助政客參選

  政客拿政治獻金用黑道幫建商跟宗教

  擺平一堆釘子戶跟絆腳石

  這應該算是社會學的一環



  【女稅務員2】東寶公司預告片




  --

  那你應該有看到宮本信子本人，聽說他有來映後'
