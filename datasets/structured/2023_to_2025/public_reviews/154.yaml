  \n華倫夫婦不再接案，但他們又被這次案件拉回局中，而這最後一件案子很有可能會毀掉他\n們” - 導演 / 麥可查維斯\n\n《抽獎方式》\n8月29日 23:59前，推文留言分享想看的原因，就有機會獲得電影特映券\n\
