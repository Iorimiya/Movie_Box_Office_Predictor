url: https://www.ptt.cc/bbs/movie/M.1757854147.A.D9C.html
title: '[好雷] 厲陰宅-最終聖事，看個溫馨感'
content: '先說我覺得好的地方

  算是個人主觀喜好這種溫馨大結局的方式

  而且也是系列作最後了

  看完是覺得心情還不錯


  那至於恐怖片的部分

  個人是覺得還好

  自己覺得恐怖片應該是以暗示，意象的畫面或聲音

  來帶給觀眾恐懼的感覺

  但中後期可能惡魔跟鬼都具象化

  有一種集合打王的感覺

  反而恐怖的感覺都沒這麼多了

  但畢竟是系列作的最後

  其實還是蠻推薦大家去看一下結局的

  最後場景所有認識的都出現

  場面讓人有點感動




  —-以下有雷——























  看完後還是有點好奇


  安娜貝爾到底出現在那一家要幹嘛啊

  我一開始以為

  這集惡魔超級強

  所以會出現漫畫裡過去的敵人變成幫手的橋段出現

  但最後看起來沒有


  然後最後惡魔莫名其妙就被封印了

  有人看得懂其中的劇本邏輯嗎？



  -----

  Sent from JPTT on my iPhone


  --'
