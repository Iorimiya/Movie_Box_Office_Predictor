title: 'Re: [普雷] 厲陰宅最終聖事～安娜貝兒是好鬼'
content: '其實裡面說到的很多場景並不是真的惡魔在嚇人

  而是他們母女的靈視能力

  靈視能力可以預知未來，可以感知危險，但都會用很恐怖的畫面出現


  像洗水槽那裡就很明顯是靈視，感知到朱蒂跑去送死


  然後安娜娃娃幾次出現，前面在家裡被騷擾應該也是靈視，在暗示朱蒂有危險逼近


  只有最後面閣樓跟巨大化那邊才是真的惡魔，但不是安娜貝爾裡面那隻，應該是鏡子惡魔

  ，但不知道為什麼要用安娜貝爾的招數，可能懶得想新的梗吧


