title: '[普雷]'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  觀影證明：


  由於時間因素想衝首日不然真的不想看螢幕X，小弟覺得這個設計真的很杯具。


  前言：

  看著自己喜歡的演員多了歲月痕跡真的蠻心疼的，小弟也是華粉；有他們在就有光有愛雖

  然他們現實不是夫妻但也把這角色飾演的很好，未來可能就不會不再以主角出現在厲陰宅

  系列了，但只要有以本人方式客串都會進場觀賞。


  劇情心得：

  開場以為是AI修復現在的派翠克跟法蜜加，原來是真演員沒想到找的還不錯神韻感覺有到

  也有年輕時比較不熟練的應對；不知道現在媽媽生小孩還得這樣嗎？看了實在媽媽偉大，

  從手術室被惡魔干擾而沒有生命徵象的嬰兒被羅琳喚回生命眼淚就噴了、劇情轉到煤礦年

  代的賓州小家庭，蘇西那個娃娃很可怕只有黑眼珠應該是電影效果沒有小女孩會喜歡這種

  娃娃吧，感覺這次劇情跟轉場都有點零碎小弟(現年38）注意力不太能集中好像情緒要到

  了突然換場景，而且感覺演了很久怎麼還沒到高潮原來只有後面15分鐘左右吧，這次發生

  的異象跟靈動也比以往壓迫感低，最後驅魔高潮沒有前面三集好，首集地下室對抗，次級

  羅琳鎮壓鬼修女瓦拉克，第三集因魔王算是人型女巫所以還好但中間的客廳小孩附身，桑

  尼盤旋還有羅琳中斷黑魔法都震撼感很強！最終聖事就三人合力推碎鏡子把惡魔從氣窗打

  出去？就結束惹～不過結尾的婚禮場面有很多客串，溫導站在第一集媽媽後面，中間除了

  烤牛肉的警察客串還有神父其它的不太記得，但就是可惜神父比較冤枉因為華倫夫婦沒給

  他報仇。XD


  結語：

  雖然這次有點不符合預期，但有華倫夫婦真的才是經典，經典也只會有一個！很喜歡艾德

  講（房間內的東西不要觸碰，這些物品….後面忘了）。^^”



  --

  按理謝幕要好好謝，真D感覺沒到(位)。XD

  那沈浸感真心不是在串流上看能感受到Der。

  第二集結尾畫面爆哭、好比史提夫跟卡特。

  9…女兒跟女婿可以好好傳承華倫夫婦的精神。

  3也要抗R～

  真的だめ！做為華粉這集有點小失望。XD

  這個嘛，小弟不知道怎麼回，但謝謝觀看。XD

  真的！這種效果不是在家等串流能感受到。

  沒關係！就跟前面有一篇作者一樣小弟是衝喜歡華倫夫婦。

  改為人型女巫確實比較沒那麼可怕但中間橋段還是有相當的壓迫感，最愛那集羅琳強大中

  斷黑魔法儀式的段落。

  謝謝指教。（跪）'
