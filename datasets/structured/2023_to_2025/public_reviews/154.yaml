url: https://www.ptt.cc/bbs/movie/M.1757160188.A.03D.html
title: '[普偏負無雷] 《厲陰宅：最終聖事》'
content: '#無雷





  身為厲陰宅忠實觀眾，從五月份發布首支預告以來便開始引頸期盼，只是如今看完心情卻

  顯得五味雜陳，可惜了在最終章沒能再創巔峰！



  如果有追隨這系列的電影，很明顯本片延續前作的靈異手法來詮釋史慕爾家族鬧鬼案，只

  是可惜了，不是溫導的果然還是有差，因為這集的真實度和整體氛圍的佈局是大不如前（

  但同為麥導前作的《鬼修女2》又私心覺得很經典）。



  在鋪陳方面，劇情被過度豐富化，各種話癆、各種感應，卻沒有幫助劇情推進，甚至整體

  鋪陳量可以說硬生生拉到以往的2.3倍之多，但處理不好就等於在畫大餅，東沾西沾、卻

  始終缺乏核心，導致劇情結構鬆散、銜接不順，不但難以集中注意力，也時常一次次打斷

  觀眾原本已堆疊好的情緒。



  然而，想將「史慕爾事件」中的惡魔塑造的更加兇猛，但卻無意經營這個主體，一心只把

  重心放在家庭互動上，就這樣2小時15分鐘的片長，原以爲可以像同樣片長的《厲陰宅2》

  一樣惡狠狠凌虐觀眾一番，結果惡魔出現頻率少之又少，把大半時間耗在兩個家庭的「扮

  家家酒」，都不知道我是來看華倫夫婦驅魔的還是在看他們兩家親情倫理大戲。



  而且，最後重點的驅魔橋段也只是三兩下就輕易結束，不但少了系列應有的爆發力和震撼

  感，還凸顯前面開頭哽的設定更加多餘，只能說想豐富華倫夫婦的故事但卻忽略了好好交

  代一件事。而這也不禁聯想到最近的《凶器》，同樣因大Boss太慢出場而遲遲未交代，但

  前者至少在結局片段還能製造出個爽感來，但這部無論劇情、氛圍還是爽度，都平庸至極

  。



  也由於營造的氛圍都被失焦的劇情破壞光光了，所以恐怖程度也只能算勉強及格的「小兒

  科等級」。只是不知道是不是我看的版本是IMAX，整場都感受到超賣力的音效在耳邊伺候

  ，還有幾幕毫不手軟的突發驚嚇真的是會被嚇壞。






  總之，雖然還不到完全崩壞，但也談不上任何精彩，介於「普通偏難看」的中下程度，算

  是整個系列當中跟《厲陰宅3：是惡魔逼我的》並列難看的作品，但也許帶著情懷去看就

  不會太難受。只是就算再怎樣難看，本片也因為有華倫夫婦的支撐而勉強及格，我想這也

  就值得了！



  雖然不太想推薦，但如果身為厲陰宅忠實觀眾，有興趣還是能進場觀看，畢竟來到本傳完

  結篇了，而且最後結局的彩蛋真的會浮現滿滿的回憶，可惜是一部出了影廳卻也帶不走一

  片雲彩的電影。










  安娜貝爾陪場




  老婆婆每出現一次我就想笑一次，每個鬼都要被《微笑》病毒感染就對了～如果搞個同宇

  宙應該不錯XD



  3ad






  --

  溫有回來當臨演XD

  我覺得第2集最好看 鬼修女完勝這部只會躲在鏡子裡的惡魔'
