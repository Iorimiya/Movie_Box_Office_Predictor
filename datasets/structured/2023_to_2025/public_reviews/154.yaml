url: https://www.ptt.cc/bbs/movie/M.1756918634.A.CB1.html
title: '[好雷] 厲陰宅：最終聖事'
content: "雷文防雷資訊頁\n\n剛去美麗華看完1+4的聯映\n\n這延續12年的宇宙算是有個中規中矩的暫時中止線\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n以下是雷\n\n~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  西元1974年\n\n劇情先從華倫夫婦在某間古董店遇到一面鏡子開始\n\n跟1開頭闡述安娜貝爾會引發很多怪事一樣\n\n4開頭也是某位被靈騷的當事人說明那面鏡子有多怪\n\
  (上面還有三個嬰兒的臉真的有夠詭異的)\n\n那時蘿琳還在懷孕，當她碰觸到那面鏡子時，鏡子馬上產生裂痕\n\n蘿琳當下立馬感覺快生了，到醫院時，女兒茱蒂差點成為死胎\n\
  \n\n電影說那是他們第一起案子\n\n但之後他們卻沒再去古董店處理那面鏡子\n\n\n\n\n時序來到1986年\n(沒特別提1、2、3的案件)\n\n華倫夫婦老了，艾德因為心臟出狀況，夫婦倆決定不再接案\n\
  \n茱蒂長大，交了男朋友東尼，但因承襲母親陰陽眼，不時還是會遇到怪事\n\n只能都先透過母親教的口訣去規避\n(話說安娜貝爾真的有夠煩的，看起來很喜歡茱蒂)\n\
  \n在艾德的生日派對上\n\n東尼表明自己想娶茱蒂的決心，蘿琳欣然同意，艾德一整個半推半就地同意\n\n前幾集有出現的高登神父也來了，他還是希望華倫夫婦能繼續幫忙超自然事件，但被拒絕\n\
  (當然1的警探和助手也有出現)\n\n茱蒂開始籌備婚禮了，但也開始牽連本集主角史慕爾一家人的故事\n\n\n史慕爾一家人總共8口人，除了祖父和爸爸，其他全是女生\n\
  \n在二女兒的成年受洗之日，祖父母買了面鏡子給她當禮物\n\n好死不死就是那面詭異的鏡子\n(到底誰會買那種有裂痕的鏡子啦齁)\n\n怪事開始發生啦~~以下沒特別用順序排列，總之一家人都出過事\n\
  \n1.養的狗一直吠\n(不過別擔心，牠不像1一樣有S)\n\n2.在要吹生日蛋糕的蠟燭時，被莫名的先被吹熄了\n\n3.媽媽在講電話時電話線總是被莫名拉緊\n\
  (那時候的電話線也太長了吧)\n\n4.小女兒的娃娃莫名的自動消失又自動出現，還被她看到一個老太婆拿著它\n\n5.爸爸某天睡覺先被鬼壓床然後在被鬼拉高高，差點被掐死\n\
  \n6.祖母意外摔下樓梯送醫院\n\n7.大女兒最慘，因為她和二女兒都覺得那面鏡子擺在房間很毛\n  所以聯手二女兒一起拿去丟垃圾車\n  隔天吃早餐時，當那面鏡子被車車壓碎碎時，大女兒居然吐出血，還含有玻璃的渣渣\n\
  \  (看了都覺得痛)\n\n史慕爾一家在發生怪事的同時，也有上媒體請求幫助\n\n直到變成全國轟動的事件後，好好先生高登神父才決定偷偷來幫忙\n\n但最後卻變成自己的死劫\n\
  (這邊就去電影院看吧，整個過程還滿精彩的)\n\n而那也引起華倫一家親自去看\n\n茱蒂先去探探狀況，因為在試新娘禮服的時候就遇到那個家的老太婆了\n\n華倫夫婦一到現場本想馬上帶女兒離開\n\
  \n但茱蒂的堅持還是讓他們留下來幫忙\n\n之後驅魔的過程就不多做說明了，因為用講的其實一句話就帶過了XD\n\n最後茱蒂和東尼順利結婚，1和2經歷鬧鬼的主角也是座上賓(算是小彩蛋)\n\
  \n\n心得：\n\n看完才懂為什麼片商特別搞1+4的聯映\n\n因為4的拍法跟1幾乎一模模一樣樣~~\n\n一樣是一個大家子(8口人)鬧鬼\n\n一樣是沒錢搬家只能乖乖被騷擾\n\
  \n一樣是家裡只有爸爸和祖父是男生\n\n一樣是惡靈鎖定某人要附身(上次是媽媽，這次是茱蒂)\n\n一樣是用摸摸就把惡靈驅除了\n\n嚇人的手法我覺得被1的拍拍手洗禮後，4的反倒直接一點\n\
  \n所以個人觀感沒那麼恐怖\n\n總之喜歡這個系列的「嚇法」的人應該也不至於不滿意\n\n還是值得一看的\n\n--"
