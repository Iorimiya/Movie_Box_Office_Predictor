content: "防雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n這集著重在靈騷現象 製造強烈動靜來呈現惡靈很兇悍 而非惡靈附身宿主後做出一些奇怪的\n\
  動作或是發出驚悚的聲音 然後進行驅魔 跟第一集的風格比較差很多 而且不知道是不是現在\n影視追求高清的結果 導致這惡靈形體過度細節變得一點也不恐怖 要是不說這是部鬼片的話\n\
  \ 且排除靈騷現象的畫面 我還以為這是殺人魔題材的電影 整體呈現出來的效果都不是很好\n還有羅琳教珠蒂唱歌那段出現後就感覺不太妙了 後面一定又會有尷尬的唱歌橋段\
