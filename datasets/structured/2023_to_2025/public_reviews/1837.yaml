url: https://www.ptt.cc/bbs/movie/M.1677649011.A.3E4.html
title: 'Re: [討論] 有人去看火線交涉了嗎？'
content: '感覺韓片就像當年的港片一樣

  韓國靠家電手機經濟大好

  就有錢能投資電影文化產業

  電影跟國家財力息息相關

  窮國還玩不起電影這行

  就算有人才也找不到錢拍片

  看這片就想到以前港片的衛斯理傳奇

  還有國片的阿里巴巴，都是在中東取景


  能有錢去國外拍的都算大片

  這個故事看來是真實故事

  所以才平鋪直述拍的很無聊

  本以為這片是以前2004年

  韓國人被綁架斷頭的事件


  沒想到這是這事件之後2006年發生的

  片中也有提到2004人質被斬首的事件

  玄彬當時就是來交涉，但交涉失敗


  塔利班首腦要求釋放人質

  實際上是想要錢才能養兵打仗

  但下面的兵都是為了信仰而戰

  首腦顧及手下只能說是為了釋放同袍

  如果說塔利班是綁匪會是侮辱塔利班


  拍到這裡感覺好像在寫共匪的感覺

  以前共產黨打游擊也常常擄人勒贖

  綁軍官要求政府付贖金才有錢打仗


  這片大概知道故事就好，拍的不怎麼樣

  有點像中共的主旋律電影，為政府拍的片

  找最好的演員跟最便宜的導演來拍大片

  導演拍過小森林，很溫馨的鄉村小品


  一次要讓他拍國際大片當然招架不住

  就像郭帆只拍過校園愛情片

  就被抓去拍科幻片流浪地球

  張藝謀只拍過鄉野農村劇情片

  就被抓去拍史詩武俠片一樣


  玄彬現在最紅

  這片還把他包裝的像韓國江湖大俠一樣

  哪天可以跟日本的岡田准一、台灣的邱澤

  一起合演一部片，這三位都是台日韓的男神代表

  一起拍一部亞洲諜報動作片應該能賣不少錢




  -----

  Sent from JPTT on my iPad


  --'
