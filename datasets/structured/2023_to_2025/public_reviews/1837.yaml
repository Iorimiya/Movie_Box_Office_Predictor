url: https://www.ptt.cc/bbs/movie/M.1675529458.A.639.html
title: '[普雷]  有點失望的火線交涉'
content: '先上個圖


  雖然我是給普雷但是我是蠻失望的

  主要有兩點

  1、節奏拖泥帶水，其實我有先看雅虎評論想說4.7顆星這麼高？

  評論號稱絕無冷場而且會想讓人想二刷

  結果我跟我女友中途都在放空只有最後10分鐘有精神


  2、主角之一玄彬完全沒有作用

  除了中間有一段把100萬美金搶回來以外

  其他全部就是耍帥躺分而已

  而且100萬還是因為他自己的問題才被騙

  開場介紹是國情局要員好像很厲害期待反轉

  結果還真的躺到結尾

  原本以為是帥氣救人一打一百的爽片

  可惜都是在說話而已

  而且幾乎都是不重要的廢話


  其他哩哩叩叩鬼打牆內容就不贅述了

  我是建議可以不用去電影院看啦

  內容不到兩小時但是體感超長

  以上


  --

  樓上各位賣阿捏啦，因為其他地方沒什麼評價能參考啊XD只能看到雅虎了'
