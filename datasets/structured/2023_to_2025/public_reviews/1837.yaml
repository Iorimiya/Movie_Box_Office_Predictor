title: '[普雷]看了火線交涉 真的挺失望的 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  本來看預告片還很期待

  前天下班還趕去電影院看

  但真的空虛的

  雖然我是沒睡著啦 不過就沒有特別緊張橋段

  交涉過程也潦草帶過的感覺

  極智對決裡的談判還好看一點


  如果說是純支持演員買單就花錢吧

  但如果在意好不好看的話那真的可以等下檔在看

  不用花錢進去看

  本來以為玄彬會有很帥的打戲之類的

  結果只有一小段跟搶匪打鬥片段 其他就沒了..

  真的是空有"國情院探員"的稱號XD



  --'
