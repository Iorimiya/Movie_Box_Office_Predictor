url: https://www.ptt.cc/bbs/movie/M.1704538537.A.5A4.html
title: '[普好雷] 中規中矩卻不失娛樂性的叛諜檔案'
content: '前幾天去電影院看旺卡的時候看到叛諜檔案的海報，感到某種熟悉感，仔細一看發現是全

  面攻佔的團隊新作，立刻就安排時間去看了～



  怕雷的人可以先看這段：

  總體來說我覺得算滿不錯的，人物情感轉折有時候會有點快所以不好入戲（畢竟整體片長

  不到兩小時，我個人的標準覺得已經給過了），但動作戲的部分滿有力也很精彩

  開頭就很精彩也很有張力，作為娛樂動作片算是中上

  題外話是我回家之後有去查了一下這部原作，發現作者是前 FBI 探員，算是個小小驚喜

  發現！


  以下有雷


  故事的開頭就是一樁命案，然後不免俗的又是一個跟 CIA 有關的案子（我怎麼會說又呢

  ）

  但這邊的第一部追查就很有趣，兇手竟然立刻連結到了一個已經死去的前特務

  接下來的場景就是不停地找到線索追查，這邊很喜歡的是各種場景的轉換，希臘真的有夠

  美欸


  劇情部分還滿環環入扣的，隨著故事的進展，除了打鬥場面的升級（槍戰、飛車等等應有

  盡有），國際陰謀層層揭開的劇情也很引人入勝，電影節奏很棒，可以一路沉浸劇情到結

  尾

  我對主角看待工作這件事有厭倦感的點還滿喜歡，對於高層有些無力改變的心境也很容易

  同理，身為社畜的我也對這部分心有戚戚 XD

  整體來說是一部蠻不錯的片，喜歡看動作戲的人應該會喜歡～


  --'
