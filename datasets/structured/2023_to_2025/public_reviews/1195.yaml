title: '[好雷] 叛諜檔案'
content: '前幾天去看了試映，放個劇照防雷，

  雖然預告片其實就已經有雷了XD


















  ——————————————————————————————————


  直接講結論，看完試映以後，這部我滿推的。

  好看且全程無冷場，同時大量使用了「泥水匠」這個詞彙當成主要的意象。




  （畢竟它的原片名是The Bricklayer）


  其實預告片裡頭是直接暴雷了XD



  故事背景是CIA面臨史上最大危機，有犯罪集團想陷害CIA。

  有份「機密檔案」不能洩漏，一旦洩漏會毀了美國，甚至造成世界大戰。

  這份機密檔案是和「全球臥底身份」有關。


  所以……男女主角出任務要阻止機密檔案洩漏XDDD


  男主角是艾克哈特演的，就全面攻佔的主角。

  女主角是妮娜．杜波夫，美劇吸血鬼日記的女主角。


  故事從位於希臘的外國記者慘遭槍殺開始，

  隨即所有的線索都指向是CIA的探員殺了人。


  在各種大人的理由，以及勢力的交織之下，

  CIA老大找回已經退休的特務瓦爾（Vail）回來和部下凱特一同調查黑幕XDDDD


  差不多開場十分鐘內，就把這一些背景就交代的很清楚了


  他們鎖定了一名叫做維多拉德克的目標，他是主角瓦爾曾經的搭檔，

  過去兩人一起為CIA效力，

  直到拉德克的妻女在臥底任務中慘死後，

  拉德克變得偏激，當時CIA要求瓦爾解決掉拉德克，

  但瓦爾卻私下放過了拉德克


  然而在主角瓦爾還沒前往希臘尋找拉德克之前，

  便遭遇了拉德克勢力的連環槍擊，這場雨中槍戰是第一幕衝突，

  而後面整部電影該有的動作戲都相當流暢，90%都是近身肉搏，拳拳到肉


  男女主角的內心戲描寫與價值觀衝突矛盾也都處理的相當精準。



  我個人印象最深刻的兩幕是瓦爾和拉德克相互對峙時，

  最終瓦爾拿起拉德克一家的照片凝視著，

  以及最終CIA老大奧馬利詢問瓦爾為什麼退休後去當泥水匠時，瓦爾的回應。




  其實我覺得這部片還是原名The Bricklayer比較有韻味，

  畢竟Bricklayer在整部片中的涵義滿深的，

  但真的叫泥水匠大概沒人會進場看就是了wwwww



  如果有去看的人可以特別注意一下這部份

  電影最後關於黑幕的揭露和反轉並不好猜，


  雖然是意料之外，但仍在情理之中就是了XD

  是值得推薦的一部好片～


  --'
