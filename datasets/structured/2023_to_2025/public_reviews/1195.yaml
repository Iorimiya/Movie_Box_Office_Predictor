title: '[好雷] 叛諜檔案：史上最強砌磚工 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  《叛諜檔案》英文片名就叫做The Bricklayer，砌磚工的意思，

  這位砌磚工可稱得上是史上最強啊。


  原著小說改編，全面攻佔的原班人馬，導演是雷尼哈尼，其中一位監製也大有來頭，是三

  百壯士斯巴達的傑瑞德巴特勒（Gerard Butler），據說他原本要親自演出的，無奈檔期

  卡到另一部電影，只好請他的好友亞倫艾克哈特（ Aaron Eckhartr） 來演出主角Vail，

  另外一個女主角Kate則是妮娜杜波夫（ Nina Dobrev）擔當演出，兩位我都挺愛的。故事

  簡單的說是犯罪集團殘忍殺害外國記者，藉以栽贓敲詐美國CIA的故事，但劇情卻不單純

  。


  開始就預埋伏筆，究竟，可以讓美國大崩壞的爆料秘辛是啥?究竟內鬼是誰?兩位主角就這

  樣不斷抽絲剝繭地讓答案慢慢明朗化。這部最讓人吸睛的，就是超多的武打動作，首先登

  場的就是在雨中的肉搏戰，就拍攝的技巧來說，這真的是超難拍的。然後，就是該有的險

  象環生的劇情都十分到位，例如飛車追逐，還有好幾幕爆破橋段，都讓人熱血奔騰。喜歡

  爵士樂的人大概也會耳目一新，因為Vail可是Miles Davis頭號樂手跟音樂的發燒友。


  Miles Davis說：“If you understood everything I say, you’d be me!”砌磚工這麼

  好猜的話，就不叫 Aaron Eckhartr了啊～搶在年末新春登場，堪稱年度最佳特務無誤。






  --------------------------------------------

  【當世界都在跟你說教】



  --'
