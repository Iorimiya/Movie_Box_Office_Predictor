url: https://www.ptt.cc/bbs/movie/M.1704667841.A.498.html
title: '[普負雷] 叛諜檔案'
content: '雷文防雷資訊頁



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  我先講結論，劇情了無新意沒啥爆點，一點緊張刺激感都沒有，然後主角被找出來出任務

  ，拎著一包超級突兀的水泥匠工具包，結果反派還很剛好的把東西藏著牆壁的磚頭裡面，

  說多刻意就有多刻意...，然後該工具包就沒戲份了


  中間還有一幕是女角被抓，反派以此為威脅叫主角出來贖人，結果剛剛交頭接耳互相道別

  完，下一秒一包炸藥包扔出去主角開槍砰砰砰，反派全部死光，女角連車都還沒發動事情

  就解決了...


  最後真正的藏鏡人叫了一群殺手來處理主角的時候主角隨手拿起不知道是唱片還是什麼食

  物塞進微波爐，沒幾秒就炸掉整個房間，連動手都免了，真是小氣，同樣的處理，傑森包

  恩拿雜誌塞麵包機開瓦斯還比較合理一點，如果要拍裝備精良的大陣仗反派突襲的片段就

  不要死的那麼隨便阿...


  劇中應該還有其他可以吐槽的點，但因為不是很好看加上過了幾天所我印象比較深刻的傻眼

  片段只剩這些



  不過劇情在動作片中對我來說是可有可無，就算沒劇情沒高端操作從頭打到尾，只要打得

  好看基本上我也接受(全面突襲?)，但是這部戲的打戲對我來說不太合格，大概就是普通偏

  爛


  這部的打戲最爛的一點在於它大量剪接但是剪接給我的感覺沒辦法把動作連貫在一起，開

  頭雨中搏鬥的打戲中，有一幕 A 在左邊對 B 揮拳，結果下一秒的畫面兩個人位置是相反

  的，沒辦法給我一個流暢合理的動作說明是一大缺點，我覺得剪接不是問題但這種拼貼實

  在不 OK


  主角本身出拳的力道和流暢我也覺得演的不是很好，這點我覺得沒啥好苛求的，畢竟不是

  每個人都武打演員出身，只是原本應該要用剪接來掩蓋的事情蓋不住變得特別明顯


  總結：

  如果你有兩三小時的空閒又突然想看電影口袋剛好還有不在乎的幾張鈔票腦袋又想放空，

  那再來考慮叛諜檔案


  --'
