content: '最後面兩軍對陣

  我原本很期待可以打起來

  雪恥第一集沒有攻入羅馬的遺憾


  結果黑人執政官直接衝到最前線

  連主角都直接從敵軍中衝出來

  途中都沒有敵軍阻止他


  最後他們兩個單挑的時候

  也沒有人去幫忙帝國執政官

  就讓他這樣被殺死是？？


  覺得大魔王死得很隨便



