url: https://www.ptt.cc/bbs/movie/M.1718291970.A.9C1.html
title: '[新聞] 缺席神鬼戰士2 羅素克洛:對此有點不是滋味'
content: '新聞網址：


  原標題:



  Yahoo奇摩電影戲劇編輯部

  2024年6月13日 週四 下午8:50



  【文／血紅蘭姆】談到這次未能回鍋演出《神鬼戰士2》，羅素克洛坦承，自己的確感到

  有點吃味。



  在苦等二十四年之後，《神鬼戰士2》如今終於要重返大銀幕跟觀眾見面。由大導雷利史

  考特回鍋執導，除了邀得保羅梅茲卡爾、丹佐華盛頓、佩德羅帕斯卡拔刀助陣之外，首集

  卡司「露西拉」康妮尼爾森和「朱巴」吉蒙韓蘇也都將回鍋亮相。



  《神鬼戰士2》將聚焦於露西拉之子盧賽斯身上。在康莫德斯謀害親父、篡奪皇位、甚至

  企圖染指姊姊露西拉之後，盧賽斯至今已銷聲匿跡長達十五年，一直在野外獨自求生，就

  連母親都以為他早已不在人世。



  然而首集電影的兩位關鍵人物卻無緣在續集中登場，那就是「麥希穆斯」羅素克洛和「康

  莫德斯」瓦昆菲尼克斯，因為兩人早已在首集片尾雙雙喪命。而談到此番缺席自己生涯代

  表作的續集電影，羅素克洛也感到有點不是滋味。








  「關於我所聽到的一些事，讓我不禁心想：『不不不，這不在該角色的道德之旅中。』但

  你知道的，我什麼都不能說。我沒有那個立場。我已經埋在六呎之下了。所以我們就等著

  瞧本片拍出來會是什麼樣吧。」



  「我忍不住回想起自己在拍攝首集電影時的年紀，在那之後又遇上了哪些作品，而本片也

  為我打開了許多扇門。說實話，我心中肯定對此浮現了一抹憂鬱、一抹妒忌。因為我仍記

  得自己肌腱還管用的年代。」《神鬼戰士2》將於2024年11月22日在美國上映。


  --'
