title: '[雷] 中規中矩只能看一次的神鬼戰士2'
content: "剛看完第一手心得，總結是一部劇情轉折有點發散，賣情懷的續集，跟阿凡達2 有點雷同。\n\n\n\n以下有雷\n以下有雷\n以下有雷（怕雷別看喔）\n\
  \n\n\n\n1. 盧修斯是麥克希穆斯兒子這件事\n\n這在第一集就有很明顯的暗示了，這只是做實猜想而已。\n\n第一集老麥跟公主就前男女友關係，加上盧修斯明顯比老麥孩子大幾歲。\n\
  \n叫他們分手後，公主發現懷上了，但礙於身分又不可能公開，在加上後來老麥有了家室，這\n件事情塵封心裡是很邏輯的事情。\n\n第二集公主沒了其他罣礙，而且兒子下一場搞不好就掰了。這時認祖歸宗也算合理，不懂為\n\
  啥大家說人設崩壞？ 相反讓第一集兩人相處時的克制跟拘謹與對盧修斯的關懷有了合理的\n解釋。\n\n2. 羅馬競技場是真的有海戰，且有把當時海戰細節演出。\n\n\
  羅馬競技場歷史上的確辦過幾次海戰，現在也還有水管通道，但因為成本太高，只辦了幾次\n，這次電影很好地讓觀眾知道這件事。\n\n另外當時海戰會以 90 度往敵船衝去，用撞角摧毀後再接戰，不是其他電影是平行用橋登船\n\
  ，這算是基於史實，我覺得不錯。\n\n3. 畫面算灑狗血，打鬥都有致敬第一集，情懷賣很深，但點到為止。\n\n4. 但劇情走向轉折有點過硬：\n大將軍戰敗投降，盧修斯突然就放下仇恨，這轉折很突然。\n\
  \n盧修斯從復仇到最後轉折成推翻暴政，也莫名其妙。\n\n5. 反派丹佐演技很好，我整場幾乎都在看他，他比主角更像主角，推薦版友多花心思在他\n身上，人物性格到位，但缺點是沒有講他過去發生什麼，什麼造成他現在的作為，人物失去\n\
  一點靈魂，有點扁平，是美中不足的地方。\n\n6. 兩個皇帝的塑造太過刻意，有一種為了反派而反派的感覺，一個像白癡一個像躁鬱症發\n作，但都太用力了。\n\n\
  7. 公主一樣是廢物。\n第一集是公主告狀，讓康茂德先發制人，第二集是她執意提早行動又沒有做好保密，根本可\n以說老麥跟將軍都是被他害死的，完全是禍水。\n\n\
  8. 最後摸草根本莫名其妙，多此一舉，畫虎不成反類犬，拿掉根本不影響，加上只是拉低\n電影評分，完全不懂。\n\n想啥打啥，一點感想\n\n--\nSent from\
  \ my iPhone 14 Pro Max\n\nPiTT \n\n--\n\n\n--"
