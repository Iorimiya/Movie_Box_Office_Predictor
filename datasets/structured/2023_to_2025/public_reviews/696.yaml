title: '[微負雷] 神鬼戰士2'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  跟第一集一樣都是從Max看的，看了有幾個奇怪的點。


  1. 我看主角並沒有展露什麼領導能力，大家怎麼都這麼聽他的話，只是因為他會咬猴子嗎？


  第一集Maximus決戰扛著一個傷口還打贏，這集被打到靠+10神裝跟偷襲才贏，然後他說自己是王子大家就信嗎？我是士兵一定想說你誰啊？我也要說我是Maximus的兒子。


  假如阿卡修斯有大聲介紹他那就算了，但他那邊用氣音，該不會大軍只看戒指就認人吧。


  2. 然後公主怎麼可以這麼雷啊，上集被跟蹤讓Maximus逃跑計畫失敗，最後透過Maximus殺掉皇帝保住自己兒子。


  這集為了兒子，又讓自己老公趕緊去被抓，最後還是靠老公的軍隊讓自己兒子上位。重點是這老媽之前把這個兒子送走以後，還直接給忘了。


  怎麼感覺她為了自己兒子，一直送愛人去死。明明好好籌備，這兩位將軍都能親自率軍反攻的。


  公主是不是把這兩個將軍當工具人。


  -----

  Sent from JPTT on my Samsung SM-S9260.


  --'
