title: '[新聞] 羅素克洛對《神鬼戰士2》很反感 嘆自己'
content: "羅素克洛對《神鬼戰士 2》很反感！嘆自己「死了沒有決定權」、也稱拍漫威電影「就只\n是工作而已」\n\n\n\n由（Ridley Scott）執導的《》（Gladiator）即將推出續集，不過\n\
  首集中已經戰死的主角 （Russell Crowe）想當然耳將不會回歸，將交由新生代\n男主角 （Paul Mescal，下圖）接替主演。\n\n\n\n對此，近期在\
  \ Podcast 節目上表示，他對於繼續拍攝《》續集的想法\n「」：\n\n「就因為我死了，所以我對一切都沒有話語權了。當我聽到續集的一些事的時候，我會覺\n\
  得，『不，不，那不符合那個角色的道德旅程。』但你知道，我沒辦法說什麼，這不是我\n的範疇，我已經入土為安了。所以我們拭目以待吧。」\n\n他也承認，自己對於新任男主角有點嫉妒，因為這使他回想起自己當年出演《\n\
  》時的年輕歲月，以及那段經歷對他人生的重大影響。\n\n\n\n除此之外，也將在今年「」電影《》（Kraven the Hun\nter）中登場，兩度參與漫威電影的他，日前在英國《GQ》訪問中被問到對早前\
  \ \n（Dakota Johnson）批評自己主演的《》（Madame Web）有什麼看法，他這樣\n表示：\n\n「我不評論別人說過的話、或是他們的個人經驗，但我覺得你的問題很有趣。你告訴我你\n\
  加入了一部漫威電影、一個充滿虛構人物的宇宙，然後跟我說它缺乏溫情嗎？不知道該怎\n麼做你才比較高興？但這就是一個巨大的機器，它們以一定的規模製作電影......\
  \ 這些\n就是工作。你知道：這是你的角色，演好它就對了。如果你期待一個改變人生的事件，我\n覺得你來錯地方了。」\n\n他也承認拍攝超級英雄電影「」，因為需要在綠幕前工作，你需要說服自\n\
  己相信的事遠遠不及角色的內心。但至少對他來說，不論是在《》（\nThor: Love and Thunder）或是《》的拍攝環境，都是輕鬆愉快的。\n\n新聞來源：\
  \ GQ\n\n新聞網址：\n\n\n\n\n--"
