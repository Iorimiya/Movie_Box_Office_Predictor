url: https://www.ptt.cc/bbs/movie/M.1765449894.A.7A7.html
title: '[新聞] 羅素克洛批《神鬼戰士2》忽略主角道德核心'
content: "羅素克洛批《神鬼戰士2》忽略主角道德核心\n\n【大紀元2025年12月10日訊】（大紀元記者葉子杰編譯報導）曾在2000年電影《神鬼戰士\n\
  》（Gladiator）中飾演主角「麥希穆斯」的男星羅素‧克洛最近批評該片的續集《神鬼\n戰士2》忽略了麥希穆斯的道德核心。\n\n61歲的紐西蘭男演員羅素‧克洛（Russell\
  \ Crowe）主演了第一部電影，但他並不喜歡這\n部續集《神鬼戰士2》。克洛在接受澳洲廣播電台Triple J的採訪時（點這）表示，顯然\n《神鬼戰士2》完全沒有繼承第一部電影主角的道德核心，而這正是第一部電影成功和產\n\
  生影響的關鍵。\n\n\n2018年6月5日，紐西蘭裔澳洲演員羅素克洛（Russell Crowe）參加羅馬舉行的《神鬼戰\n士》（Gladiator）慈善放映宣傳活動。(TIZIANA\
  \ FABI/AFP via Getty Images)\n\n克洛說：「我覺得那部最近的續集，你知道的，我們不用明說電影名字，真的是個很遺憾\n的例子，連創作團隊裡的人都搞不清楚第一部電影的精髓所在；不是那些華麗場面，不是\n\
  情節安排也不是動作戲，而是它的道德核心。」\n\n對續集劇情走向不滿的克洛說，電影對「麥希穆斯」這個角色做了許多改變。尤其是，續\n集引入了一條新的故事線，將「盧賽斯」（保羅‧麥斯卡\
  \ 飾）設定為麥希穆斯的私生子\n，而這一點在第一部電影中並未提及。\n\n克洛批評這些改動，他強調新故事影響了麥希穆斯的道德形象，而麥希穆斯原本致力於為\n\
  妻兒復仇。他回憶說，在第一部電影的製作過程中，他一直拒絕加入與麥希穆斯相關的愛\n情戲份，因為他認為這些戲份會削弱麥希穆斯的道德形象和力量。\n\n克洛說：「事情是這樣的，拍片現場每天都在為這件事爭論，每天都得為保持角色的道德\n\
  核心而奮鬥。他們建議給麥希穆斯加什麼性愛場景之類的，這根本是在削弱他的力量。你\n是說他同時有老婆，還跟別的女生亂搞？你到底在說什麼啊？太荒謬了。」\n\n2020年，克洛曾對《帝國》雜誌說：「我記得（導演）雷利‧史考特當時過來跟我說：『\n\
  你看現在這劇情發展，我真不知道你怎麼活得下去。這角色的動機就是為了妻子和孩子復\n仇，復仇完成後他還能做什麼？』」\n\n克洛說：「我當時還開玩笑說：『對啊，麥希穆斯接下來幹嘛？難道最後會在羅馬競技場\n\
  旁開披薩店？』他只有一個目標，就是在來世與妻子相見，並為沒能守護她道歉。就只是\n這樣。」\n\n儘管去年上映的《神鬼戰士2》全球票房超過4.62億美元，但該片評價卻褒貶不一。美國\n\
  網路電影資料庫（IMDb）滿分為十分，截至今日，獲得觀眾6.5的普通評價；影評網站「\n爛番茄」影評員與觀眾分別給予70%及81%的普通評價。克洛沒有演出該片。\n\
  \n\n《神鬼戰士2》電影劇照。（UIP提供）\n\n今年8月，導演雷利‧史考特（Ridley Scott）曾向《衛報》確認他《神鬼戰士3》正在製\n作中。\n\
  \n責任編輯：蘇漾\n\n\n\n--\n 神韻晚會觀眾反饋（2025）\n\n--"
