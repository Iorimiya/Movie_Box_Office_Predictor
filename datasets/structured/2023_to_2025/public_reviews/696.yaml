url: https://www.ptt.cc/bbs/movie/M.1764218876.A.A2E.html
title: '[普偏好雷] 神鬼戰士2'
content: '防雷




























  看神鬼戰士是多年前的事情

  羅素克洛那盪氣迴腸的身影搭配競技場自成寫照

  一個熱愛羅馬卻有著不得不的將軍,夠悲劇

  通常這種經典出第二集會壓倒性不被看好

  問世前基本上就幾乎確定是狗尾續貂

  看完後簡單點總結一下大概是：

  多少還算有點東西,但很吃第一集老本

  基本上都是在第一集就有的東西下去做延伸

  加上雷利史考特功力多少還在,所以前面我覺得還行

  娛樂性也比想像中多,那個水上競技場超酷

  還給我引進鯊魚,這點子我很喜歡


  中後段丹佐華盛頓那個角色開始機掰後就走味了

  我還滿喜歡這個角色,歸功於丹佐華盛頓的演技

  更加深後面他跟皇帝之間不知道在衝三小

  其實後面整體都不是看很懂

  主角的血統也完全意料之中

  應該說沒這個設定還比較新鮮

  就當作在替前面還算有點價值的地方收尾吧

  這種古裝類型的就算表現普普也是看一部少一部

  也不知道雷利史考特還能拍多少年呢


  ----

  Sent from  on my Samsung SM-S9280


  --

  我見過...你們這些人不會相信的事

  我目賭在獵戶座的邊緣著火的攻擊艦

  我看見C光束在湯豪色星門附近，在黑暗中閃亮著

  所有這些時刻都會消失...於時間中，一如眼淚...消失在雨中

  死期到了


  --'
