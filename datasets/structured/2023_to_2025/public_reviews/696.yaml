url: https://www.ptt.cc/bbs/movie/M.1732297965.A.E9B.html
title: '[ 好雷] 神鬼戰士2, Make Rome Great Again'
content: '文中爆雷，不喜勿入






  ---------------

  破題，這是一部影射美國現狀的電影

  我簡單列舉以下幾點：


  一、

  整部劇的大綱就是Make Rome Great Again

  不只男主角說過，每個站在男主身邊的人

  都有這個願景與理想

  不斷的提到要讓羅馬重生，要讓羅馬再次強盛

  這不就是現實中川普常提到的MAGA?


  二、

  丹佐華盛頓的角色也在劇中提到

  「羅馬是讓我從奴隸可以努力，最終變成現在（執政官）成就的地方」

  這妥妥就是人們口中的American dream美國夢

  憑著自己的努力

  最後變成富人階級或者是高級官員


  三、

  這一點有點隱晦, 又或是我想像力太豐富

  就是丹佐華盛頓的角色傀儡智障皇帝

  成為真正掌權的幕後主使的這段戲


  放在現代的美國來說

  智障魁儡皇帝就是拜登

  而丹佐的角色對比，大家應該都知道她是誰了


  四、

  最後那段決鬥戲

  一個原本應該要繼承王位的“trump“ “Champion”

  （譯王牌/冠軍，劇中一堆人對男主角喊過）

  擊敗竊取政權的黑人幕後主使

  還成功讓原本要打起來的禁衛軍與勤王軍團合眾一心


  這還用說嗎

  這就是不久前美國選舉的狀況啊

  川普上演王子的復仇，擊敗他口中竊取政權的對手



  最後，我想說

  沒想到好萊塢可以拍出這麼右的片






  --'
