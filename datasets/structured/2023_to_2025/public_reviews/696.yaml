title: '[新聞] 雷利史考特回歸執導"神鬼戰士2" 檔期敲定'
content: '新聞網址：


  原標題:


  2023-02-04 10:47:50




  （圖片來源：環球影業）



  終於確定要開拍的《神鬼戰士》（Gladiator）續集，在一月初被媒體爆出新

  任主角接班的消息，而剛憑《日麗》（Aftersun）入圍本屆奧斯卡最佳男主角的的愛爾蘭

  新星-保羅梅斯卡（Paul Mescal）是最可能接下此角的人選，如今事隔近一個月，



  （圖片來源：GQ）




  ，也就是在首集飾演「露西拉」的康妮尼爾森（

  Connie Nielsen）戲裡的兒子。《神鬼戰士 2》劇本由曾替史考特撰寫《金錢世界》（

  All the Money in the World）的大衛史卡帕（David Scarpa）執筆，但故事走向仍被保

  密中。



  --'
