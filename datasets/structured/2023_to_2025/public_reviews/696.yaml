url: https://www.ptt.cc/bbs/movie/M.1733231588.A.83D.html
title: '[負雷] 神鬼戰士2'
content: '跟第一集一樣，去電影院看完了，



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  1.本片很大程度是依賴丹佐華盛頓一人的演技。


  2.整個敘事是將數十年間發生的歷史壓縮到很短時間，然後加一點虛構。


  3.男主角演技不佳。差羅素克洛一大截。不能太要求上一集兩個影帝的等級。


  4.配角群沒有存在感，除了上一集的原班人馬。


  5.戰爭"特效"華麗，包括海戰，競技場水戰，個人搏擊也很到位。


  6.以續集來說，只能是尚可，第一集實在太華麗，太完美了。


  7.個人還是最期待Rock即將演的漢尼拔，此人是羅馬從王國到共和國到東西帝國，一千多年歷史最強的敵人。


  8.今年最讓人亮眼的電影個人認為還是懼裂。說不定黛咪摩爾可以得個奧斯卡獎之類。


  --'
