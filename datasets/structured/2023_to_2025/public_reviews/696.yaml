url: https://www.ptt.cc/bbs/movie/M.1732114782.A.3BA.html
title: '[負雷] 神鬼戰士2'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  一直非常喜歡史詩片

  雷導的神鬼戰士和王者天下導演版一直是我最愛的一二名

  DVD.導演版DVD.電影製作書.小說.原聲帶都早就收藏了

  近年來史詩片沒落 好不容易熬到神鬼戰士2

  抱持著雷導片.史詩片看一片少一片的心情進戲院 不期不待

  當然雷導的中古場景沒話說

  但還是得說主角和劇情真的太不行了


  對主角本來就不期待能有第一集羅素克洛的表現

  (至今是我心目中將軍形象的最佳代表)

  不過想說好歹有奧蘭多布魯在王者天下的樣子就好

  結果氣場完全撐不起來......

  向第一集致敬的strength and honor.摸沙.雙手持劍砍頭

  有看過第一集的人應該都會覺得感覺差好多

  最後兩大軍陣前說話  讓人尷尬癌都發作了


  講到劇情 好多東西都欠缺鋪陳

  主角怎麼從討厭媽媽到愛媽媽? 怎麼突然就認同羅馬?

  第一集片尾結束 皇帝死掉 明明元老院和禁衛軍都挺皇后

  看起來就要恢復共和 怎麼會突然說有危險要把小孩送走?

  阿就算送走 皇后應該也多的是有辦法知道小孩在哪

  搞到十幾年都下落不明?


  然後皇后第一集氣度不凡 第二集變成腦波弱?

  上次叛變都已有慘痛經驗 第二集都沒精進叛變計畫?


  主角找醫者去討軍隊也很瞎

  一來根本大家都不知道國王的孫子還活著

  二來要討軍隊 大家必須對討軍隊的人和信使/信物有認同感

  第一集Maximus本來就是軍隊的將軍

  派去討軍隊的人是身邊的親信 軍隊都認識 所以很合理

  但這次誰認識醫者阿?

  信物也不是像軍符那種大家都知道的東西

  拿個戒指裡面刻國王.Maximus姓名就可以調動5000大軍?


  最後要讓兩軍都認同主角的血統 必須要是有威望.大家都認識/認同的人出來喊

  這樣的人有1.將軍 2.皇后 3. 元老院議員Gracchus

  問題是這三人在之前就都死了!!!

  就莫名其妙在那邊精神喊話 兩邊加起來上萬人就說好耶~~~


  有太多太多吐槽點了

  唉 還是再回去把神鬼戰士和王者天下導演版多看幾次吧


  --'
