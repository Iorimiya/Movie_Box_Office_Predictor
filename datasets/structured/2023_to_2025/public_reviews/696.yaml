url: https://www.ptt.cc/bbs/movie/M.1632985481.A.C6C.html
title: '[新聞] 雷利史考特透露"神鬼戰士2"進度:準備啟動'
content: "新聞網址：\n\n2021/09/30｜新聞快訊\nby hsphere\n\n\n縱然已經 83 歲的高齡，英國著名導演雷利史考特（Ridley\
  \ Scott）的創作力與動能依舊\n相當旺盛，除了即將在 10 月 15 日上映的《最後的決鬥》（The Last Duel）外，11 月\n還有一部由女神卡卡（Lady\
  \ Gaga）主演的真實改編作品《Gucci：豪門謀殺案》（House\nof Gucci），手邊還有一堆監製、導演計畫準備執行，不過其中最讓人關注的無非是傳了\n\
  很久的《神鬼戰士2》，雷利史考特在接受帝國雜誌訪問時透露了最新的進度：\n\n\n\n\n\n\n這裡提到的拿破崙電影是由瓦昆菲尼克斯（Joaquin Phoenix）主演的《Kitbag》，片名\n\
  取自俗諺「每個士兵的背包裡都裝有將軍的權杖」（There is a general’s staff\nhidden in every soldier’s kitbag.），將描述拿破崙的來歷與他快速崛起成為皇帝的\n\
  故事，以及他與妻子之間的關係。（延伸閱讀：瓦昆菲尼克斯將主演雷利史考特執導拿破\n崙傳記電影《Kitbag》）\n\n\n\n，到了 2018 年的時候則是找到了《竊盜城》（The\n\
  Town）、《飢餓遊戲：自由幻夢》上下兩部的編劇彼得克雷格（Peter Craig）執筆劇本\n，不過故事線將會聚焦在盧賽斯（Lucius），該角色是康妮尼爾森（Connie\
  \ Nielsen）在\n首集飾演的露西拉（Lucilla）的兒子，也就是瓦昆菲尼克斯（Joaquin Phoenix）所飾演\n的康莫德斯（Commodus）的外甥，為羅馬帝國皇帝之子。2019\
  \ 年原製作人蘿莉麥唐納（\nLaurie MacDonald）、沃特帕克斯（Walter Parkes）表示透露續集將發生在原電影的\n 30 年或 25 年之後。\n\
  \n\n《神鬼戰士》（Gladiator）由羅素克洛（Russell Crowe）主演，故事主要描述一名羅馬\n將軍為了被謀殺的家人以及淪為奴隸的自己而對皇帝展開復仇，於\
  \ 2000 年上映過後抱回\n了五項奧斯卡大獎，其中包括了最佳男主角與最佳影片。\n\n--\n\n當年神鬼戰士\n\n預算 $1.03  億美元\n票房 $4.605\
  \ 億美元\n\n--"
