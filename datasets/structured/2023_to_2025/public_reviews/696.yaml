title: '[新聞] 《神鬼戰士2》羅素克洛不回歸！'
content: '新聞網址：



  TVBS新聞網

  2023年01月07日



  2000年國際名導雷特史考特（Ridley Scott）經典作《神鬼戰士》，在當時抱回5座奧斯

  卡，主演男星羅素克洛（Russell Crowe）的星路也就此起飛，不過在確定他是否會回鍋

  主演續集的同時，



  《神鬼戰士2》（暫譯）不再由羅素（左）主演續集。（圖／翻攝自IMDB）



  《神鬼戰士》在2000年抱回5座奧斯卡。（圖／翻攝自IMDB）




  。在去（2022）年年底，導演表示已經著手腳本，宣

  布在拍完下一部史詩片《拿破崙與約瑟芬》（暫譯）後啟動。關於目前最新進度，




  保羅麥斯卡、安潔莉娜裘莉以及她的女兒在咖啡廳聊天。（圖／翻攝自best of

  angelina jolie推特）



  由誰擔任主角？《綜藝報》宣稱，曾主演美劇《正常人》的保羅麥斯卡有望主演，正與導

  演洽談，在2022年，他憑《正常人》入圍艾美獎你影集或電視電影類最佳男主角。在日前

  ，外媒傳出他與安潔莉娜裘莉互動頻繁，被拍到兩人在倫敦某咖啡廳談天說地，在一旁的

  安潔莉娜女兒韋爾裘莉彼特（Shiloh Jolie-Pitt）也參與其中，加上兩人還進行晚餐幽

  會，不免讓外界揣測是戀人關係。


  -


  2000年  神鬼戰士  預算1.03億  票房4.57億


  --'
