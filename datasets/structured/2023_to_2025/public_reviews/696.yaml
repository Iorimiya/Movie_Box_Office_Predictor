title: '[新聞] 《神鬼戰士2》片場驚傳意外！6人緊急送醫治療'
content: "《神鬼戰士2》片場驚傳意外！6人緊急送醫治療\n\n2023/06/11 14:18\n\n〔記者廖俐惠／綜合報導〕由雷利史考特回歸執導《神鬼戰士》（Gladiator）續集，日\n\
  前傳出片場發生意外，有幾位工作人員在拍攝特技鏡頭時受傷，所幸並無大礙。\n\n\n2000年推出的電影《神鬼戰士》，暌違20多年將推出續集。（翻攝自imdb）\n\
  \n根據《綜藝報》報導，《神鬼戰士2》在本月7日於摩洛哥進行拍攝時，有幾位劇組工作人\n員受傷，據悉有6人送醫，2人已出院，其中4人仍在醫院觀察。據一名知情人士指出，受\n\
  到此次意外影響的工作人員接受了燒傷救治，沒有任何演員受傷。\n\n對此，派拉蒙影業發聲明證實，在拍攝期間確實有幾名工作人員受傷，但沒有生命危險，\n「現場安全以及醫療團隊迅速採取行動，緊急對傷者進行處置，他們都處於穩定的狀態，\n\
  繼續接受治療。」派拉蒙也強調，演員以及工作人員的人身安全最為重要，將繼續監測狀\n況，採取必要的預防措施。\n\n《神鬼戰士》在2000年上映，該片由金獎名導雷利史考特執導，羅素克洛、瓦昆菲尼克斯\n\
  等人主演，該片在當年獲得奧斯卡12項提名，最後抱走最佳影片、最佳男主角等5項大獎\n，一舉將羅素克洛推上影帝寶座。20年多後，《神鬼戰士》將開拍續集，預計在2024年上\n\
  映，雖然雷利史考特確定再執導，不過男主角換人當，羅素克洛則確定不會回歸，透露續\n集與他無關。\n\n--\n佛教經典的\n是 是菩薩成佛之道\n      \
  \  是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
