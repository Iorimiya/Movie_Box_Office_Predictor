url: https://www.ptt.cc/bbs/movie/M.1733618463.A.A97.html
title: '[普狂雷]神鬼戰士2最大的敗筆是主角吧! '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  這部神鬼戰士上映前看預告

  應該很多人看到主角演員一臉東歐路人臉，心理的OS大概就是這誰啦!

  然後看了電影主角也真的很沒有魅力

  演員一臉苦瓜像，全靠反派各種降智行為活到最後。

  最誇張的是

  打仗能力被將軍完虐，單挑也不如將軍，就靠將軍工具人設，劇情殺!

  最好笑的是最後打老扣扣的丹佐也是處下風，靠穿皮甲優勢跟主角威能反殺!


  導演要魔改歷史也不是不行

  大該也知道整部電影只有丹佐華盛頓有票房號召力，所以強行加戲安排最後單挑。

  有趣的是我去查了卡拉卡拉大帝的資料

  雖然19歲就葛屁的長了一臉大鬍子猛男樣

  明明就可以安排片尾男主大戰雄壯的卡拉卡拉大帝，比較有看頭

  結果卡拉卡拉大帝直接改編成娘炮腎虛甲甲

  然後安排了一段超級尷尬的最終決戰

  .........

  整部戲超過3億美成本，就這卡司....看票房應該是穩賠了


  --'
