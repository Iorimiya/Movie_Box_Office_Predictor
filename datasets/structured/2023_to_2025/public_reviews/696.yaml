url: https://www.ptt.cc/bbs/movie/M.1732080816.A.78E.html
title: '[好雷] 神鬼戰士2'
content: '還好沒聽負評浪潮跑去看

  我真的覺得超好看的

  片尾看得我痛哭流涕

  一直坐到最後字幕放完

  聽聽雄壯的交響樂很感動


  我覺得比第一集都好看

  通常我看這種史詩片跟科幻片一定睡

  可能第一集我還小看不懂

  但第二集我老了就終於看懂了


  感覺很像香港古裝武俠片

  在牢裡一放箭就全部倒地

  主角出手也都很講武德

  精神喊話配上交響樂很催淚


  重點他的話能讓武士收刀入鞘

  平息戰爭帶來和平，不用戰死


  讓我腦補現在美國就像羅馬一樣

  所以導演才會拍這片來隱射美俄

  也是到處在烏俄跟以巴引戰

  不給武器就不會打個沒完

  但都期盼一個人能帶來和平

  還有縮短國內的貧富差距

  不會只有達官貴人在享樂

  貧民奴工社畜都過的很囧


  丹佐華盛頓的角色

  讓我聯想到我們的館長

  也是底層出身，辦格鬥賽的組頭

  因為賭地下拳賽

  讓立法院長韓國瑜欠他錢

  就像黑道一樣的來要債

  最後用計幹掉皇帝謀朝篡位

  還找個黑人來演黑道


  這片男主角真是戰神，演的真感人

  就像打贏泰森的那個白人網紅一樣

  我不認識他，但也算是世代交替

  等於是羅素克洛的接班人

  一堆大明星為他抬轎

  青出於藍甚於藍


  那些像鬥蟋蟀的神鬼戰士

  每個都像泰森或MMA的格鬥明星

  主角說在競技場只有死才能自由

  突然感覺那些格鬥選手或運動員

  想到剛掛掉的職棒明星張誌家


  像大家看的12強棒球賽

  整個大巨蛋就像羅馬競技場一樣

  球員就像鬥蟋蟀的神鬼戰士一樣

  大家都在賭誰會贏，希望能贏錢

  提早退休當貴族不用辛苦工作


  整個羅馬就像皇帝玩猴子(總統玩狗)

  帶大家鬥蟋蟀賭錢玩物喪志

  跟晚清一樣，最後羅馬才會亡國

  有部片叫風暴佳人，就是講最後凱薩要聽百姓的

  羅馬最後就被信教的暴民給推翻了變天主教國家

  如果他皇帝真的英明神武讓天下百姓豐衣足食

  誰還會想要去花錢信教入黨搞革命求平安


  --

  不是反串，真這樣想，這片的武術指導

  感覺一定有承襲香港武行班底，很像龍門飛甲'
