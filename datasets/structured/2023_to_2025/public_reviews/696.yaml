url: https://www.ptt.cc/bbs/movie/M.1721348455.A.268.html
title: 'Re: [新聞] 神鬼戰士2預告片遭狂灌倒讚！網友抱怨：'
content: '剛剛大致看了一下英語預告片的評論區，不少負評都是衝著黑人文化元素而來的。

  有的人針對那首歌「No Church in the Wild」，有的人針對Danzel Washington。

  感覺是反Woke、SJW那群人不明就裡上來惡搞。


  首先，這部片還不夠黑。Danzel飾演的Marcus Opellius Macrinus歷史上本來就是

  黑人皇帝，羅馬帝國歷史上的黑人皇帝也不只這一位。我為什麼說不夠黑呢？因為

  影片中的兄弟皇帝Geta、Caracalla的父親、上一任皇帝Septimius Severus也是黑

  人皇帝，所以這對兄弟應該至少是黑白混血。因此本片沒有用黑人洗歷史的疑慮。


  至於洗配樂就更莫名其妙了，預告片的配樂通常不會用在正片，而且Kanye West &

  Jay Z這首「No Church in the Wild」的歌詞非常契合本片的主題，有興趣的版友

  可以到這個網站看一下中英對照歌詞


  我個人是很期待看到雷導如何改編那段期間的歷史。史實上，兄弟皇帝共治沒多久

  就開始內鬥，由Caracalla獲勝，頒佈著名的Edict of Caracalla，廣泛授與帝國

  境內民眾「羅馬公民權」，導致羅馬帝國因稅收減少而邁向沒落。隨後他被Danzel

  飾演的Macrinus謀殺取而代之，後者和兒子共治不滿一年又被推翻。從這段史實，

  可以看得出來導演改編的空間很大，可以好好期待一下。


  --'
