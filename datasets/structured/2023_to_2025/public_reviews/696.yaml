url: https://www.ptt.cc/bbs/movie/M.1731562671.A.C76.html
title: '[血腥雷] 神鬼戰士2-普雷 偏血腥'
content: '剛看完 大螢幕看這種真的蠻爽的


  血腥的部分


  影片有斷頭、砍斷手臂、拿箭插耳朵什麼的


  也有拿一個人頭 轉來轉去玩耍的畫面（？


  最後幾幕還有內臟跑出來什麼的


  所以如果要帶女朋友去看的


  可能要確定能不能接受XDDDD


  以下有劇情






  防雷







  先講優點


  競技場變蠻特別的 跟以往看到的不一樣


  競技場還可以出現海戰XDDD


  音樂、動作設計什麼的也都還不錯


  去電影院看蠻值得的


  再來劇情就偏普通


  有一種王子復仇記的感覺


  私生子在外流浪 因為羅馬的征服成為奴隸


  然後被賣到奴隸主（？那邊


  競技場一關一關過 最後重回羅馬


  找到媽媽 間接殺掉原本以為的壞人


  再殺殺殺  然後重新登基這樣（？

  ————————————————————————

  缺點的部分


  可能是因為片長問題


  角鬥士之間的「激情」沒有什麼感覺到


  不像第一集有刻畫角鬥士互相幫助之類的


  這集就純粹主角光環


  因為我很強 所以底下都支持我

  （不支持的就死了）


  然後看到後面


  就在想羅馬那時候「血緣」真的這麼重要嗎


  只要說我祖父、我爸是誰


  隨便一個人拿著戒指就可以調動一支軍隊


  還差點讓這支軍隊跟羅馬禁衛軍打在一起？？


  不過整體還蠻推薦去電影院看的


  大螢幕看蠻爽的


  以上分享～


  --'
