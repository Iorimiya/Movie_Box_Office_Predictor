title: 'Re: [新聞] 缺席神鬼戰士2 羅素克洛:對此有點不是滋味'
content: '現在神鬼戰士2已經上映了，


  大家覺得羅素克洛講：續集違反他的角色的「道德之旅」是什麼意思？


  我還上網查原文是什麼意思，好確定中文沒翻錯，原文是：


  A couple of things that I’ve heard, I’m like, ‘No, no, no. That’s not

  in the moral journey of that particular character.’


  所以中文沒翻錯。


  我猜他是不是指「主角有私生子」這件事？


  所以在羅素克洛的心中，他拍第一集時從來沒把王子當成他的兒子，


  這違反很多人說「第一集有暗示王子是主角的兒子」，


  我前陣子重看加長版跟戲院版，發現兩個版本也是都沒暗示王子是主角的兒子。


  --'
