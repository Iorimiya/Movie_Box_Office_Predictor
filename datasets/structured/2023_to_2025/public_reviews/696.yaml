url: https://www.ptt.cc/bbs/movie/M.1633623684.A.3C6.html
title: '[新聞] 導演確定開發《神鬼戰士 2》網友：可是'
content: '導演確定開發《神鬼戰士 2》，


  網友：可是男主角羅素克洛已腫成另一個人...


  今年已經高齡 83 歲的英國影史大導演雷利史考特（Ridley Scott）長年保持著高產量，

  在麥特戴蒙、班艾佛列克、亞當崔佛、茱蒂康默眾星一起主演中世紀大片《最後的決鬥》

  （The Last Duel）預計明年在台灣上映。


  不過你還記得雷利史考特導演生涯最具代表性的古裝史詩大片《神鬼戰士》（Gladiator

  ）嗎？


  本周雷利史考特在宣傳《最後的決鬥》之時，就親自證實睽違 21 年《神鬼戰士 2》已經

  在開發動工！




  ▼羅素克洛曾憑藉《神鬼戰士》獲得當時好萊塢最性感男性封號。




  神鬼戰士

  圖片來源：sickchirpse




  當年的《神鬼戰士》導演 Ridley Scott 與 Russell Crowe

  圖片來源：lwlies.com


  導演雷利史考特在接受英國知名影視雜誌 Empire 最新專訪時，親自證實續集劇本已經開

  工：「我正在寫《神鬼戰士  2》的劇本，如此一來當我完成拿破崙傳記電影《Kitbag》

  後，《神鬼戰士  2》就可以開拍。」


  不過當年《神鬼戰士》在全球收穫 4.5 億美元票房並贏得 5 座奧斯卡，其中羅素克洛更

  拿下職業生涯第一座奧斯卡影帝。


  但這位身高 182 公分的肌肉男主角在《神鬼戰士》之後就迅速身材發福，在今年他飛往

  澳洲與克里斯漢斯沃（Chris Hemsworth）一同看球時更是留滿了白色的落腮鬍。


  同時他也要加盟漫威：《雷神索爾 4》豪華卡司再 +1！


  羅素克洛加入 MCU 神祕新角：「粉絲肯定會很驚喜！」




  今年去澳洲看球的 Russell Crowe

  圖片來源：independent/Getty Images




  羅素克洛 2019 年

  圖片來源：thesun.co.uk/


  因此當雷利史考特宣布要拍攝《神鬼戰士 2》之後，許多國外網友反而都把焦點放在外型

  變化比導演雷利史考特還要劇烈的男主角羅素克洛身上，而紛紛笑說：「羅素克洛想要客

  串一個鏡頭都不行！」、「當年誰能想到《神鬼戰士》會變成這樣？」


  不過在第一部結尾男主角羅馬帝國將軍 Maximus 已經死亡，因此續集羅素克洛完全不露

  面是理所當然的，續集預計將以羅馬帝國皇帝 Lucius Verus 之子 Lucius Verus 為主角

  。


  亦可延伸觀看花絮新聞：當年還不夠紅！「胖艾美」瑞貝爾威爾森曾因上前問好，卻被羅

  素克洛吼「給我滾開」！




  羅素克洛《神鬼戰士》

  圖片來源：thesun.co.uk/

  Source：empire



  新聞網址：


  --'
