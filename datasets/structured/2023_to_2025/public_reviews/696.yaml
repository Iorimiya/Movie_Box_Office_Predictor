title: '[  大負雷]'
content: "雷文防雷資訊頁\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n第一次電影版發文。\n\n身為一代老粉，看了不下十次，只能說走出戲院的時候既憤怒又感傷，真的是被餵了一大\n坨。\n\n整部電影的劇情、人設、動作完全讓人摸不著頭緒：\n\
  \n1. 電影全程強調“力量與榮譽”，但男主角卻是最沒有力量和榮譽的那個。說到力量，\n連七旬老漢（雖然他是前中情局特工）單挑都打得滿頭大汗，最後還是靠偷襲才贏。多打\n\
  少、隊友助攻、靠老爸神裝，比賽結果也是靠偷襲才勝出。再說到榮譽，男主整部片的勝\n利幾乎都靠下三濫的手段，例如水中抓石頭尻頭、假投真偷襲，最後還靠鐵門偷襲殺\n\
  死角鬥老師。\n\n2. 呼籲角鬥士同胞一起起義反抗，最後卻丟下隊友逃跑，放任他們被趕來的禁衛軍屠殺\n，這算哪門子的榮譽？至於偷襲殺角鬥老師更是匪夷所思。老師從頭到尾對他都很正常，\n\
  並未刻意羞辱。男主自己嘴賤惹事，教官正常處罰，這有錯嗎？整個過程讓人黑人問號。\n有人能告訴我教官到底哪裡惹到他了嗎？\n\n3. \n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n願有看懂的版友指點上面不合理的點\n\n\n--"
