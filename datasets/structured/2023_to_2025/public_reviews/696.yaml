url: https://www.ptt.cc/bbs/movie/M.1747929744.A.A42.html
title: '[新聞] 《神鬼戰士2》主角表示電影正擺脫大男人'
content: '新聞網址：



  《神鬼戰士2》保羅麥斯卡表示電影正擺脫大男人主角，稱將《寂靜之聲》比作《斷背山

  》是「懶惰且令人沮喪」


  保羅麥斯卡在坎城影展《寂靜之聲》記者會上，針對電影中的男性氣概發表看法，他認為

  電影界正「擺脫」傳統大男人角色。麥斯卡與喬許歐康納在奧利佛·赫曼納斯執導的這部

  同志愛情片中飾演音樂家。


  麥斯卡說：「這是一個不斷變化的過程。我認為在電影中，我們可能正逐漸擺脫傳統、大

  男人的主角形象。」


  這位演員也針對將這部電影與《斷背山》進行比較表達了不滿，稱其「懶惰且令人沮喪」

  。包括《綜藝》雜誌在內，有幾篇對《寂靜之聲》的影評都將兩部電影聯繫起來。


  他說：「我個人完全看不出與《斷背山》的相似之處，除了我們曾花了一些時間待在帳篷

  裡。」這句話引得現場一片笑聲。「《斷背山》是一部很棒的電影，但它探討的是壓抑的

  概念……我覺得這些比較相對懶惰且令人沮喪，但在大多數情況下，我對這部電影的關係

  源於它是一部頌揚這些男人之間愛情的作品，而不是壓抑他們性慾的作品。」




  說得太好了，羅素克洛太陽剛，後世會記住他的神鬼戰士，而不是你的，需要丹佐華盛頓

  和佩德羅帕斯卡幫忙抬轎的軟弱續集，羅素克洛曾經說要「雙手殺製片」，實在太有毒了

  ，男子氣慨壞壞


  斷背山的爛番茄88，遠高於你演的同志片76，歷史會記得斷背山的奧斯卡，你最好也去拿

  一個，不然你有種族歧視的嫌疑


  平常我都從那些專門臭老鼠的頻道獲得新聞資源，沒想到好萊塢明星就是這麼的無情地招

  黑機器


  綜藝報紙好壞，自己被罵就把這則新聞放在網站頭條，根本想幫這位男星招黑


  --

  當然不值得學習，但隨著時代進步，陰柔特質的男演員達到羅素克洛的高度，真的不多

  提摩西夏勒梅?反倒是今年影帝安卓亞布洛迪，勇敢講出不要歧視，還有中國彈幕說

  甚麼他不該這樣致詞，重點是在全世界盯著你鬧笑話的時候，勇敢地說出自己的心聲

  這才是勇敢的男性特質，得到所有立場影評一致讚賞


  英文原文叫做阿法男，基本上台灣影評界一致批判，是誰就不講了，阿法男在生物中

  確實存在，但不是社群媒體稱呼的那樣毒，實際上猩猩社會的阿法男是會展現溫柔

  特質的，搜尋TED演講就可以找到


  這是影展片，連預告都沒有，全憑工作人員自己說，誰知道像不像斷背山?

  最後，台灣人常說要有國片驕傲，卻連李安的得獎片被這樣說還沒炎上，真沒尊嚴'
