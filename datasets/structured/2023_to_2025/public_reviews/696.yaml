url: https://www.ptt.cc/bbs/movie/M.1731735864.A.207.html
title: '[大負雷] 餵老觀眾一坨答辯之 神鬼戰士2'
content: "這邊先講無雷的結論:\n\n1. 本片劇情轉折走向毫無邏輯，讓人傻眼\n\n2. 羅馬競技場沒有像第一集戰車那樣有像樣的大會戰\n\n3. 本片一定要看完第一集否則不了解劇情\n\
  \n   對新觀眾非常不友善\n\n   但對有情懷的老觀眾，這部無疑是餵了一坨答辯\n\n\n\n\n防雷頁\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n神鬼戰士續集原本要求不高\n\n可惜讓人印象深刻的只有大白鯊在古羅馬競技場吃人\n\n其他毫無亮點，且劇情承接各種瑕疵\n\n\n1. 打地區型競技場\n\
  \n羅素克洛打了2場，其中一場還是1打全部成名\n\n讓觀眾看得爽又熱血沸騰\n\n反觀本片主角打一堆 Monkey\n\n主角才打死一隻比賽就瞬間結束?\n\n\
  其他 Monkey 瞬間死光? 非常突兀的劇情設定\n\n\n2. 皇帝問主角哪裡人\n\n主角突然化身街頭詩人吟詩，場面一度十分尷尬\n\n本片像這樣經常出現意義不明橋段\n\
  \n純粹就只是要硬接後面劇情\n\n\n3. 羅馬競技場死鬥\n\n本片最讓人失望地方，完全沒有像第一集戰車會戰大場面\n\n開頭首戰居然是主角少數人大戰1隻犀牛鬥士?\n\
  \n幾個人小打小鬧\n\n而且鬥士摔下來跟主角對決時，隊友都不見了?\n\n\n再來一場是競技場變成深海打海戰?\n\n然後居然還有飢餓的大白鯊在游泳?\n\n\
  挖靠  競技場有無數隻大白鯊你敢信!\n\n這麼蝦又腦動大開的設定\n\n不說我還以為在看 Sharknado 續集之古羅馬版\n\n\n最後6000人打5000人我以為有打仗大場面\n\
  \n結果又變成 1V1，爛透了\n\n很難想像好好的一部續集居然被這樣糟蹋\n\n\n\n結論:\n1. 本片劇情轉折邏輯各種不合理，要有心理準備\n\n2.\
  \ 賣點競技場毫無大場面，讓人失望\n\n3. 本片一定要看完第一集否則不了解劇情，對新觀眾不友善\n\n   但對第一集有情懷的觀眾，這部無疑是餵了一坨答辯\n\
  \n--"
