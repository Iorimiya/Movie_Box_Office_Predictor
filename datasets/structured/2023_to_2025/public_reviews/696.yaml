url: https://www.ptt.cc/bbs/movie/M.1732689815.A.C51.html
title: '[普無雷] 神鬼戰士2 - 劇情平淡的爽片'
content: '24年前去看電影院看這片，整場豪無冷場，續集實在是差強人意。


  我本來還以為，電影公司耍笨，不讓大導雷利史考特續導，回家一查才發現我錯了，

  導演還是雷利史考特 -_-



  這片特效實在下足了重本，在競技場的打戲沒話說。

  但劇情常轉的之餘，為誰而戰的、為何而戰的經過，都草草帶過。


  男主角照理來講飽經風霜，但扮像在我看不是很及格，身上大多時間乾乾淨淨的。

  我看的當下，常和十幾年前的影集斯巴達克斯，也是演角鬥士來比較，

  男主角的像和氣場，真的差滿多的。





  我覺得BGM也算滿失敗的。




  我以為打鬥的BGM，好歹也call back一下以前第一集的BGM



  我猜大概是之前常被吐嘈，太像神鬼奇航的BGM





  結論，我是不至於覺得花錢進劇院浪費，但期望值要降低，當作是看完就忘的爽片即可。


  --

  你們這些抓著時間，這麼不重要的點在那自以為是的，卻不知這兩個電影的作曲家都

  是Hans Zimmer.


  還蠢到說"誰學誰"，透露自己的無知。


  是說你們真的對電影配樂有那麼一點熟悉，更早的電影 絕地任務，Hans Zimmer的

  配樂也是那調調，很好認。



  你們就真的不知道，都是Hans Zimmer的作品，是不能講喔，說你知知剛好。'
