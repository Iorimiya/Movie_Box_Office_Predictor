title: 'Re: [情報］神鬼戰士2定裝照'
content: '可能編劇上會採用 改寫 或照史實拍


  所以也許會有劇情雷:





























  丹佐華盛頓的腳色 Macrinus


  出生於阿爾及利亞 非洲柏柏人後裔



  是羅馬皇帝卡拉卡拉旗下的禁衛軍長官


  皇帝卡拉卡拉與皇帝Geta為當時羅馬共治皇帝


  但發動政變暗殺了Geta (他們是親兄弟)


  還對支持Geta的城市發動屠城



  最後Marcrinus 據說發動政變


  挑撥卡拉卡拉身邊的侍衛殺了卡拉卡拉


  後來取而代之和兒子共同擔任羅馬皇帝


  為羅馬帝國史上第一個


  終其一生沒進過羅馬城和得到元老院同意的皇帝


  --

  為了回應前面推文感嘆安插一個黑人角色

  還疑似是羅馬皇帝=政治正確這個條件反射

  有多麼愚蠢'
