title: 'Re: [大負雷] 餵老觀眾一坨答辯之 神鬼戰士2 '
content: '欺騙我的感情，大爛片


  幹爆多不合理，轉很硬



  -----防雷------
















  一開始的海戰，男主喊話完全沒激勵感

  演技不好，長的也有點瘦弱


  一開始就出戲了，怎麼會瘦瘦刺青女

  在城牆射箭？


  古代戰場怎麼可能有這種廢物，

  這種第一個被殺，瘦女怎麼拉弓，不合理



  然後男主摔到海裡醒來後，去找老婆屍體


  2個羅馬兵去接他回來，靠夭，你是戰俘耶

  2個羅馬兵不知道在禮遇什麼，極度不合理



  然後進去鬥獸場，怎麼會有這種狒狒狗？

  這是哪裡來的生物，電影一定要這樣鬼扯？


  勒死一隻狒狒狗就全場歡呼，

  這些觀眾是吃錯藥嗎？ 英雄光環在哪？



  第二場，騎犀牛？哇靠犀牛怎麼可能那麼乖被騎？歷史也沒這種搞笑戰鬥



  第三場，羅馬競爭場，有水戰？互相放箭

  觀眾都要被射死了吧，互撞然後戰鬥就結束了


  哪裡來大白鯊？羅馬有這種養殖技術？

  從海裡補回還能養到上競爭場，扯中之扯


  黑人還有雷鬼頭，能不能有點像奴隸的樣子

  全部人的造型都太帥服裝太華麗，現代感很重

  這些人是奴隸角鬥士耶，怎麼一副要走秀

  乾乾淨淨的？


  明明2000多年前的羅馬，現代感很重


  這些打鬥也太無聊了吧

  我以為要高潮時，又結束了，

  我期待的競技場，太掉漆了


  2個王子，化的怪妝不男不女的，出戲


  最後要政變之戰

  心想終於有大場面了


  哇靠，怎麼又變1對1，除了砍一隻手臂有點

  驚豔，還期待下一幕，天啊，怎麼又死了

  戰鬥又結束了



  然後雙方歡呼又結束了


  整部片到底在演什麼，轉的很硬


  我不知道整部片的重點是什麼

  打鬥也不精采，也沒什麼戰爭技術點


  男主的手臂很細，像個戰士嗎？

  除了臉像羅馬人之外

  身材頂多像個打網球的普通運動員而已


  威猛感在哪？



  神鬼1  如果是10分

  神鬼2大概2.5分吧



  真的不ok



  --'
