url: https://www.ptt.cc/bbs/movie/M.1732097361.A.50B.html
title: '[ 好雷] 神鬼戰士2 緊扣羅馬建城神話的故事'
content: '要說什麼意象貫穿整部神鬼戰士2

  我覺得是被母狼養大的羅穆盧斯與羅姆斯兄弟

  劇情當中交代了傳說的前半段：

  一對被棄養的兄弟被母狼扶養長大

  但卻沒說這對兄弟的下場

  兄弟長大後想要建立一座城市

  然而對於該選址何處起了爭執

  最後羅穆盧斯殺死了羅姆斯

  羅馬城就是在不祥的兄弟相殘中建立


  卡拉卡拉跟蓋塔

  漢諾跟馬克里努斯

  上演相同的羅馬人相殘戲碼

  最後兩軍在雙子母狼的城門前對壘

  不斷強化了這個意象

  但最後透過漢諾

  迴避了另一場羅馬內戰

  兄弟相殘是羅馬的開始

  卻不必是羅馬的是宿命


  另外故事也充分展現當時的羅馬

  體量大到沒有外部威脅足以挑戰他

  但內部的腐朽卻讓帝國陷入無止盡的腐敗與紛爭

  進入可持續性的亡國

  在希望與墮落中輪迴交替

  獨特的風格讓後世許多作品以羅馬帝國為藍本

  例如40k的人類帝國


  至於負評的地方

  羅馬人婚外情那根本是正常社交活動

  我覺得無損麥希穆斯的形象

  整體而言雖然小地方的邏輯有點便宜行事

  但不失為一部佳作


  --


  --'
