title: '[新聞] 漢斯季默無緣回歸《神鬼戰士 2》 '
content: '漢斯季默無緣回歸《神鬼戰士 2》！續集配樂大任交由「他的這位徒弟」接手




  金獎配樂大師-漢斯季默（Hans Zimmer，下圖右）替《神鬼戰士》（Gladiator）譜寫的

  樂章，至今仍是令廣大影迷不斷回頭重溫的曠世鉅作，但很遺憾地，現正拍攝中的《神鬼

  戰士 2》並不會交由他續寫新曲目。


  《綜藝》（Variety）報導，師承季默的《史瑞克》（Shrek）系列配樂家-哈利葛瑞森威

  廉斯（Harry Gregson-Williams，下圖左），將接棒他的師父為《神鬼戰士 2》 譜曲。

  威廉斯與本次回歸執導《神鬼戰士 2》的雷利史考特（Ridley Scott）早有多年共事經驗

  ，史考特的《絕地救援》（The Martian）、《王者天下》（Kingdom of Heaven）等多部

  作品的配樂都是出自威廉斯手筆。


  威廉斯和史考特的已故弟弟東尼史考特（Tony Scott）也有長年合作關係，他替東尼譜寫

  過《女模煞》（Domino）、《煞不住》（Unstoppable）、《火線救援》（Man on Fire）

  等片。




  《神鬼戰士 2》卡司網羅：角色身份尚未公佈的佩德羅帕斯卡（Pedro Pascal）與丹佐華

  盛頓（Denzel Washington）、在首集飾演「露西拉」的康妮尼爾森（Connie Nielsen）

  和飾演「朱巴」的吉蒙翰蘇（Djimon Hounsou）、飾演第 22 任羅馬皇帝「卡拉卡拉」的

  喬瑟夫奎恩（Joseph Quinn）、飾演卡拉卡拉的弟弟「蓋塔」的佛烈德海金傑（Fred

  Hechinger）、以及飾演新主角「盧修斯」的保羅梅斯卡（Paul Mescal），此角正是露西

  拉的兒子。


  本集劇本由曾替史考特寫過《金錢世界》（All the Money in the World）、《拿破崙》

  （Napoleon）的大衛史卡帕（David Scarpa）執筆，北美預定今年 11 月 22 日正式上映

  。





  --'
