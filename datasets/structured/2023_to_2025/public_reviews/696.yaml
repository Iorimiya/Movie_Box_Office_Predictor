  是誰嗎？


  最後單挑結束，登高一呼，兩軍就認同他是新皇帝....


  任何英雄類型的電影都是這樣，做了某些事跡得到認同，才可以領導眾人，前面舖成力道要

  夠大，只靠血緣關係就有認同感，那就跟兩位皇帝可以領導羅馬是同一個邏輯，導致後面劇

  情需要他是一個領導者，變得超級尷尬


