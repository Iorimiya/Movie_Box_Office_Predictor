title: '[負雷] 神鬼戰士2 還好沒花錢去電影院'
content: '雷文防雷資訊頁







  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  用MAX觀看，分兩天才看完，看完沒什麼記憶點




  開頭的自由都市被將軍攻擊 ，死老婆然後自己被抓起來當奴隸



  想比第一集，羅素帶兵攻打日爾曼人，那個戰鬥搭配BGM感覺差好多


  第二集有印象深刻的BGM嗎？



  羅素本身就受到士兵的信賴，帶兵技術一流，即使成為角鬥士也是很快又合理的受到信任



  這集的主角，前面還在被當猴子，突然的受到信任，才贏兩場就是無敵冠軍，羅馬群眾愛

  死他


  明明打贏都像運氣好，最後決戰沒有張力，像小朋友在打架，打完之後，嘴砲兩句就全部

  的羅馬士兵支持了？


  板上吹捧的海戰，或許不是在電影院看，感覺就是沒有非常好


  總之，很難相信這是同一個導演拍出來的



  最後，或許是科技進步的關係，第二集相對第一集畫面亮很多，讓人沒有古裝片的快感，

  魔戒三部曲跟哈比人三部曲也有一樣感覺





  --'
