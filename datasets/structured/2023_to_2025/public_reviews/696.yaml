  丹佐反派演的不錯

  2個皇帝的昏庸中二樣也到位

  猴子也有不少戲份

  也有些血腥片段


  不過劇情看起來很硬要

  演到後面第一集的老演員都死了

  這樣應該不會有第三集了吧

  整場2個多小時沒什麼冷場至少不會睡著


  -----

  Sent from JPTT on my iPhone


