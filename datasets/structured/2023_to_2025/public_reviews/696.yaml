title: '[新聞] 《不可能的任務 8》《神鬼戰士 2》《猛 '
content: "《不可能的任務 8》《神鬼戰士 2》《猛毒 3》等片全停拍！《哥吉拉大戰金剛 2》暫停\n宣傳\n\n\n\n美國演員工會昨日宣佈罷工，頓時讓好萊塢多部影視作品的拍攝及宣傳工作不得不臨時喊\n\
  停，因為在罷工期間，所有超過 16 萬名的工會成員都得遵循罷工規定，不能履行參與宣\n傳、試鏡、排練、洽談或簽定合約，當然更不能參與電影和電視劇的拍攝與配音。\n\
  \n據《好萊塢記者報》（THR）的了解，目前已經停拍的電影包括：《神鬼戰士》（\nGladiator）第二集、《死侍》（Deadpool）第三集、《猛毒》（Venom）第三集、《星際\n\
  寶貝》（Lilo & Stitch）真人電影、《不可能的任務：致命清算 — 第二章》（Mission\n：Impossible — Dead Reckoning\
  \ Part 2）、以及布萊德彼特（Brad Pitt）監製兼主演\n的未定名 F1 賽車電影。\n\n\n\n動畫方面的製作暫時比較不受波及，因為動畫師通常會先讓自己、或是身邊的同事負責配\n\
  音，作為方便他們在工作時參考的臨時性音檔，之後才會交由專業演員錄製真正的最終版\n本，但在罷工結束前，原本已經預定要為這些動畫配音的演員能否如期進錄音室上工，暫\n\
  且就不得而知了。\n\n動畫長片方面，目前可能需要在近期正式錄音的，多半是明年準備上檔的作品，例如排定\n明年 03 月 08 日上映的《功夫熊貓》（Kung\
  \ Fu Panda）第四集、排定 03 月 29 日上\n映的《蜘蛛人：超越新宇宙》（Spider-Man：Beyond the Spider-Verse）、排定明年\n\
  \ 07 月 03 日上映的《神偷奶爸》（Despicable Me）第四集、以及排定明年 09 月 13\n日上映的《變形金剛》（Transformer）前傳電影《Transformers\
  \ One》。\n\n此外，華納兄弟與傳奇影業合作的《沙丘：第二部》（Dune：Part Two）和《哥吉拉與金\n剛：新帝國》（Godzilla x Kong：The\
  \ New Empire）也不會參與聖地牙哥動漫展的造勢\n活動，因為主要演員都因罷工運動而無法配合到場，他們連在社群媒體上貼出相關宣傳素\n材都是被禁止的。\n\
  \n\n\n\n--"
