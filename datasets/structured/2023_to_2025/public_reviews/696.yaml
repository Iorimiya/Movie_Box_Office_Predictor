title: '[新聞] 神鬼戰士2預告片遭狂灌倒讚！網友抱怨：'
content: '《神鬼戰士2》預告片遭狂灌倒讚！網友抱怨：「硬塞饒舌音樂」、「這部片從來就不需

  要續集」




  睽違了整整 24 年後，由雷利史考特回歸執導的《》終於在日前公開了首支預

  告片，然而，許多影迷似乎對於《》預告片所呈現的內容以及行銷的方向感到

  有些不滿，並紛紛湧入 YouTube 平台公開的預告片（英文版）中按下了。




  雖然這支預告片確實向觀眾們展現了《》史詩又磅礡的精彩內容，但以目前來

  說，這支由派拉蒙官方 YouTube 頻道公開的《神鬼戰士2》卻獲得了高達近 13 萬個「

  」，而按讚的數量則僅僅只有倒讚的一半。


  公開的兩天內，《》已經累積了超過 1300 萬次的觀看次數，可以確定的是，

  這確實成功在影迷之間引發了不小的迴響與討論，然而，影片中的部分內容以及呈現方式

  很快地衍伸了不小的反彈，尤其是選曲的部分。


  派拉蒙影業的行銷團隊為這支預告片選擇了 Jay-Z 以及肯伊威斯特的歌曲〈No Church i

  n the Wild〉，可想而知的是，

  ，甚至有影迷推測團隊會選擇這首歌曲的原因僅僅是因為歌詞中提到了「」

  ，或是有參與演出而已。


  「這首 Jay-Z 歌曲提到了『競技場』，那就塞到預告裡吧？」




  某位網友在留言中嘲諷地模擬了行銷團隊內部的對話，並獲得了 1.4 萬人按讚。


  另一則獲得 2.5 萬個讚的留言寫道：


  「『我們這部電影裡只有一個黑人耶，老闆。』『那就在預告裡塞一首饒舌歌吧！』」




  除了配樂問題之外，也有不少影迷質疑了這部續集存在的必要性。


  「。」


  或是


  「。」




  這支《》預告片也出現了展示太多內容的問題，

  。


  考慮到這是一部預算高達 3 億美元，睽違了整整 20 多年的經典史詩電影續集，這樣的

  行銷似乎已經帶來了一些負面的影響。


  除了外，《》演員陣容還包含、與

  。




  《》將於 11 月 22 日上映。



  新聞網址：










  --'
