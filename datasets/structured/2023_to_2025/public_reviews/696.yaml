title: '[負雷] 神鬼戰士2 結構鬆散 莫名其妙'
content: '兩個半小時的片長 但內容跟流水帳一樣


  主題很明確 為了羅馬帝國的理想而戰

  好OK 但是這中間的過程 角色動機完全沒演出來

  通通都是用對白來推動


  什麼事情都是由角色講台詞“告訴”你的

  然後角色間彼此的衝突

  也是靠說一說就想通了？


  講了兩個半小時的羅馬價值到底是什麼？

  為了脫離獨裁？ 為了推翻皇帝的暴政？

  好OK 你倒是把它拍出來


  皇帝怎麼欺壓百姓的 百姓過得多慘 快滅國了？

  沒演啊 我看到的是百姓過得挺爽

  街上井井有條

  打仗出征亂贏一通


  一直打仗財政可能存在問題 不能拍嗎

  百姓給權貴欺壓 被佔便宜 不能拍嗎

  一直打仗 丈夫沒辦法回家 不能拍嗎


  這些稍微著墨一下就能幫助觀眾更理解故事背景

  以及為什麼此刻的羅馬需要改變！


  很可惜上面這些都沒有

  主角群說目前羅馬很爛

  需要有新秩序

  要記得老皇帝的教誨

  聽我的準沒錯

  大家跟我來！


  劇情的推動就是這麼一回事

  主角喊聲下面就會自動自發跟上

  甚至不會過問 主角甚至算外國人了？


  底下還有一堆根本不是羅馬人的戰俘在那邊喊羅馬精神

  幹笑死



  回來聊角色設定 本劇的角色設定真的很莫名


  三位主要人物 主角 將軍 奴隸主


  首先主角從一開始備戰的戰前演說

  看起來胸有成竹的樣子


  結果老婆被KO之後 人直接斷線發呆

  這像是一個所向披靡的戰場指揮官？


  接下來為了幫老婆復仇開始當鬥士

  但當到一半突然愛國心覺醒

  格局大了 看到殺妻仇人道歉一下就豁然開朗

  對老媽也諒解了


  老婆都不用管就對了？？？



  再來將軍


  他應該是見過羅馬帝國內部最多腐敗事情的人

  應該讓觀眾透過他的視角去看到底羅馬有什麼問題

  結果只是讓觀眾看到他的苦瓜臉

  浪費Pedro的演技

  讓這個角色看起來像跑龍套的


  最後奴隸主


  不得不說丹佐的氣場完全壓過了主角

  導致這部片已經失焦了

  算是非常大的問題

  搞得他才像是主角


  可惜被垃圾劇本害到

  不然這位奴隸主的背景故事是觀眾會有興趣的



  最最最後大混戰


  我覺得這些人馬根本不知道自己在幹嘛

  莫名的變成二人單挑

  超級問號



  結論


  各位可以省下300塊錢了 真的不值得

  進場就是看這些人一直消費第一集

  光摸土這個動作就三四次

  怕觀眾忘記這個IP

  不說了 我要去複習第一集了


  感謝耐心看完：）




























  --

  真的超問號 那些角鬥士大概八成都外國人 想回家都來不及了 還在那邊聽你吹喇叭 陪你打仗

  第一集的麥西穆其實很被動 從頭到尾就是有人要搞他 麥西穆也沒有想要革命什麼的 他只是很感慨老皇帝的德政 一直最在乎的都是家人 死前都是想到家人 妻子小孩都掰掰之後
  只訴求抬頭挺胸的走完接下來的路 就算變成奴隸 還是展現勇氣 拚命到最後一刻 光榮離開 但世人看到他背後展現的價值 他可沒有整天在那邊打嘴砲

  第一集聚焦在皇帝跟麥帥的對抗 花了很多篇幅 在刻畫皇帝的心狠手辣 所以麥西穆贏的時候觀眾多麼感動 他終於為家人報仇 也解放了他的兄弟 第二集一開始要為妻子報仇
  中間又要革命 心境轉變什麼的都沒拍 講話講一講劇情就順下去了 花最大篇幅在消費第一集 講一些麥帥回憶錄'
