title: '[好微雷] 神鬼戰士2'
content: "預告看到在羅馬競技場內打海戰就決定要進電影院看這部了\n劇情確實有些瑕疵\n但我覺得戰鬥場面很適合在大銀幕觀看\n開場羅馬將軍阿卡修斯率領戰艦進攻努米底亞最為盛大\n\
  展現攻城守城雙方的戰術手段\n再來是主角漢諾被俘\n在地方的競技場對上狒狒\n導演說靈感來自他看到真實紀錄南非遊客被狒狒群攻擊的影片\n但這狒狒怎麼看都像是異形啊\n\
  之後在羅馬競技場的幾場戰鬥也很精彩\n漢諾打犀牛騎士、海戰都有運用到一些謀略很有看頭\n阿卡修斯電光火石間放倒四人也很厲害\n但結尾的對決就有點可惜\n原本預期漢諾決戰阿卡修斯會是最後一戰\n\
  結果卻是中間就打完了\n而最後的對手都多久沒戰鬥了怎麼可能打得贏現役角鬥士的主角\n也沒有出現如片頭般震撼的大決戰\n\n由於沒有IMAX畫幅\n建議是找銀幕大音響好的影廳觀賞\n\
  今天在美麗華IMAX發現畫面中間居然有灰點\n從預告開始到片尾結束都有\n不曉得是銀幕還是放映機的問題\n早知道就去看Dolby廳\n為了拿到美麗華獨家角色海報還跟朋友各買IMAX跟Dolby\n\
  \n之前看《捍衛戰士獨行俠》的時候有播一年後上映的《不可能的任務7》的預告\n上週《不可能的任務8》的預告公布後就在期待派拉蒙這次也會先播預告\n果然還真的猜對了\n\
  想搶先在大銀幕看阿湯哥要把握時間\n印象中之前那次的預告好像只有前一兩週有\n--\n\nSent from \n\n--"
