url: https://www.ptt.cc/bbs/movie/M.1679156090.A.F64.html
title: '[新聞] 丹佐華盛頓驚喜參演《神鬼戰士 2》！'
content: "丹佐華盛頓驚喜參演《神鬼戰士 2》！雷利史考特導演為他「量身打造」新角色\n\n\n\n（圖片來源：Pinterest、夢工廠）\n\n開拍在即的《神鬼戰士》（Gladiator）未定名續集，這兩個多月以來已陸續鎖定保羅梅\n\
  斯卡（Paul Mescal）、貝瑞柯根（Barry Keoghan）兩位愛爾蘭男星加入演出，而今天外\n媒《Deadline》則再度獨家爆料，與本次回歸執導的雷利史考特（Ridley\
  \ Scott）合作過\n《美國黑幫》（American Gangster）的奧斯卡影帝-丹佐華盛頓（Denzel Washington）\n也已應邀參演。\n\
  \n\n\n（圖片來源：環球影業）\n\n《Deadline》透露，華盛頓預計演出的角色是史考特專為他量身設計的，早在劇本構思階\n段，史考特就已設想該角是華盛頓的形象。\n\
  \n據悉，派拉蒙影業高層原本對於邀請華盛頓參演並不抱太高期望，因為華盛頓是出了名的\n挑戲，但所幸華盛頓讀完劇本後非常喜歡史考特為他打造的新角色，幾乎一口就答應。\n\
  \n目前雙方的洽談已進入最後階段，基本上已拍板定案。\n\n《神鬼戰士 2》由新任主角梅斯卡擔綱演出「盧修斯」一角，也就是在首集飾演「露西拉\n」的康妮尼爾森（Connie\
  \ Nielsen）戲裡的兒子，而柯根則飾演羅馬帝國的第 23 任皇帝\n「蓋塔」。\n\n《神鬼戰士 2》劇本由曾替史考特撰寫《金錢世界》（All the Money\
  \ in the World）的\n大衛史卡帕（David Scarpa）執筆，但故事走向仍被保密中。本片現預定 2024 年 11 月\n 22 日上映。\n\
  \n文：Joker\n\n新聞來源： Deadline\n\n新聞網址：\n\n\n\n--"
