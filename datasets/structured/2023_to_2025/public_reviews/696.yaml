title: 'Re: [新聞] 神鬼戰士2預告片遭狂灌倒讚！網友抱怨：'
content: '就黑人的部分說明一下好了，

  這些資訊維基百科都查得到，

  根據維基百科 ，

  Marcus Opellius Macrinus 是Berber (柏柏爾人)，

  又根據維基，柏柏爾人雖然是北非當地原住民，

  但同時混了很多外來民族的血統，

  包含高加索人種的義大利和日耳曼人等

  因此已經不是典型的黑人外觀，

  更何況北非原住民和我們認知的中非黑人應該還是有差別，


  上面是一個介紹柏柏爾人部落的網站，

  有不少照片可參考

  同時可以參考維基上的本人的雕像照


  至於 Septimus Severus 應該更不是黑人，


  看雕像照應該很明顯不是，

  維基: “他的母親有義大利羅馬血統，

  而他父親則是布匿克人、

  也許也是利比亞人的後裔。”

  所以他本身就是混血，

  而且布匿克人主要是閃族人移民到北非，

  閃族是中東來的。

  怎麼說和所謂的中非洲黑人應該還是有點距離。


  所以我個人覺得，政治正確的成分還是有的，時勢所趨其實也沒辦法。






  --'
