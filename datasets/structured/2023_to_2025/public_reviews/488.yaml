title: '[討論] 米奇17號與奉導過去作品比較？'
content: '算有雷，防雷一下





  以下是個人覺得跟米奇17號的風格有些許重疊的作品，殺人回憶、非常母親、寄生上流都

  未列入


  1. 駭人怪物：人面對未知生物的威脅

  2. 末日列車：主要角色直接挑戰上層階級

  3. 玉子：人自認可以操弄其他生物


  可以看出米奇17跟這三部有做出風格差異，我個人是覺得奉導在米奇17這部的角色設計都

  很有趣，看的時候也很期待角色之間的火花。但最後卻收的很保守，結尾雖歡樂但歌舞昇

  平(偏貶義），還算是好看的一部片


  還是懷念末日列車、駭人怪物，比較現實、殘酷、有無力感的收尾


  個人喜好是：駭人怪物>末日列車>米奇17>玉子


  --'
