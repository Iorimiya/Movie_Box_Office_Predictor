title: '[新聞] 韓國於2月28日搶先上映《米奇17號》'
content: '新聞網址：


  《米奇17號》韓版海報



  奉俊昊導演的新片《米奇17號》將於韓國搶先上映。


  《米奇17號》將在2月28日於韓國上映，早於全球上映日3月7日，韓國觀眾將提前觀賞。


  此外，在片中飾演米奇的羅伯派汀森將於本月20日訪韓，親自與韓國媒體及影迷們見面，

  《米奇17號》的國際宣傳活動也將從韓國開始。


  這將是羅伯派汀森首度造訪韓國，電影預告片曝光後，他的演技引發熱烈關注。本次宣傳

  行程是由於羅伯派汀森本人即便忙於下部作品的拍攝，仍表達了想拜訪奉俊昊導演的故鄉

  韓國的強烈意願進而促成的。而《米奇17號》的全球上映活動也於韓國展開。


  奉俊昊導演與羅伯派汀森將於《米奇17號》片段試映後與韓國媒體進行對談，分享關於電

  影的各種故事，並預計舉行影人出席場等活動與粉絲面對面。


  《米奇17號》講述羅伯派汀森飾演的米奇在死後會複製出一個與他一模一樣的複製人，而

  他被當作高風險任務的消耗品。某次任務中他經歷第17次死亡的危機，以為他已經死亡後

  米奇18號被複製出來，繼而展開一段無法預測的故事。


  --'
