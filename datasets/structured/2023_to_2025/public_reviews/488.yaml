url: https://www.ptt.cc/bbs/movie/M.1741271597.A.ACE.html
title: '[請益] 米奇17號中的一段音樂（有劇透）'
content: '說是音樂也不完全是，比較像清唱。

  出現的片段是米奇在講述他和娜夏相識相愛的過程。


  之所以說是，是因為我被這段清唱嚴重干擾，導致對那段劇情很模糊。

  是事後問了同去的友人才知道是哪段劇情。

  不過友人說那段音樂是哼唱。


  最初這段清唱出現的時候，我以為是前幾排有觀眾發神經，

  莫名其妙唱起歌來，還愈唱愈大聲，很想找工作人員來處理。

  但節拍音高都不差，像是有練過，於是推測會不會是誰的手機響了關不掉？

  （因為特映會進場前工作人員有要求手機關機，並用破壞袋包起來）


  直到後面劇情，指揮官怒吼的聲音從遙遠的左側喇叭傳來，並帶來震撼的臨場感＆距離感，

  我才意識到剛剛那段清唱或許是電影裡的？

  （我坐在面對螢幕的右側，第四排的座位）


  但我已經被嚴重干擾了啊！

  雖然努力強迫自己專注劇情和畫面，但總是一直被清唱分走注意力。


  我推測被干擾的原因，可能是清唱的聲線完全不是畫面中的米奇或娜夏。

  而且我記得米奇是有講話的，清唱就顯得很突兀，沒有搭配到畫面。

  不像後面指揮官怒吼那樣畫面和聲音有搭配，讓我明確知道聲音來自電影。


  我想找到這段清唱的原曲（如果有的話），好確認真的是電影裡的音效。

  這裡會有人知道嗎？




  --

  　

  感覺不太像，但謝謝提供線索。

  當時被嚴重干擾，不論是電影或清唱，都只留下模糊印象。'
