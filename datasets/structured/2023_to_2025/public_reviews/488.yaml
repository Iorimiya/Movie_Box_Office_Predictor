url: https://www.ptt.cc/bbs/movie/M.1741191277.A.DF2.html
title: '[好無雷] 【米奇17號】羅伯怎麼可以這麼可愛！'
content: '‧


  二刷了【米奇17號】，兩次都帶給我不同的感覺，而羅伯完完全全是本片超級MVP ，不管

  哪

  個版本的米奇，都可以演繹的相當具有魅力，有時可憐楚楚眼神，有時則是堅毅無比的果

  斷抉擇，不僅帥氣，還帶有許多可愛的一面，甚至在他生涯作品演出，能排上前幾佳都不

  為過，也許非常有可能在今年的獎季，能夠獲得不少的肯定。


  其餘主要配角的刻畫，也是相當令人讚賞，馬克盧法洛同樣把出自骨子裡的壞，飾演的可

  愛、魅力及諷刺味十足，雖然不及「可憐的東西」那樣的表現，但在不搶走羅伯的光采下

  ，又與飾演妻子的東妮克莉蒂一搭一唱，完全不輸給羅伯劇情線的表現；其餘配角史蒂夫

  連與娜歐蜜艾基也都非常稱職的扮演好各自角色。



  ‧


  雖然整體並沒有寄生上流那樣的高度，但節奏快慢得宜，【米奇17號】並非是部單純以科

  幻

  、爽快來取悅觀眾的作品，相反的是以科幻的外皮，來闡述政治諷刺、宗教信仰、有點BL

  (笑）、資本勞方關係、階級差異、掌握權力、人類貪婪、科學造成的道德問題等，這樣

  多種議題藏於之中，當然這是奉俊昊一向拿手的手法，將問題丟回給觀眾，給予觀眾不斷

  反思與電影之間的議題挑戰。


  雖然有些觀眾認為步調緩慢，但我認為【米奇17號】利用了許多黑色幽默，來提升觀影的

  情

  緒，甚至許多台詞像是用「正經的臉說幹話」的方式，讓觀眾能夠會心一笑，使整體劇情

  不枯燥乏味。



  ‧


  兩代米奇的差異，也是能夠欣賞羅伯演技的最大看點，迎向劇末的一幕，兩代米奇的表情

  ，更是證實羅伯在演技上的突破，當然也造就成觀眾間互相爭論的要素；到底聖母孬孬米

  奇是正確的？還是果斷抉擇的帥帥米奇？這兩代米奇，就像是人們身邊的好天使與壞惡魔

  ，牽引著對善惡人性的選擇，當然這不是什麼太有新意的設定，早期2005年寡姐飾演的「

  絕地再生」就有類似的設定與議題，只是奉俊昊對於米奇人物的刻畫，加深了這場科學實

  驗的瘋狂與思辨。



  ‧


  走入好萊塢的奉俊昊，首部全英文執導及編劇的作品，雖然沒有【寄生上流】那樣的令觀

  眾折服於他，甚至沒那麼奉俊昊，但以科幻為世界觀之下，還是部相當優秀的電影作品，

  【米奇17號】並不是部能夠娛樂所有人的科幻電影，但其整體魅力，還是非常推薦進場觀

  看

  。


  至少馬克盧法洛壞的很諷刺


  至少充滿性慾的羅伯派汀森，很值得進場欣賞他的可愛、演技及屁股


  至少長得像跳蚤、鱉，或是像風之谷的王蟲、星際戰將「亞瑞克尼蟲」的可愛伏蟲，請趕

  快在台灣出週邊！



  ‧




  追蹤茶太郎IG




  --'
