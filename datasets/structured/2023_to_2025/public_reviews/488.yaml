url: https://www.ptt.cc/bbs/movie/M.1735474087.A.B37.html
title: '[新聞] 《米奇17號》四次更改發行日期 羅伯派汀'
content: '《米奇17號》四次更改發行日期 羅伯派汀森主演




  （大紀元記者葉子杰編譯報導）當地27日，由英國男演員羅伯‧派汀森主演的科幻喜劇片

  《米奇17號》（Mickey 17）再次更改發行日期，但這次是好消息，從之前的復活節週末4

  月18日提前至2025年3月7日在美國上映。


  據《Deadline》《ScreenRant》報導，由好萊塢男星羅伯‧派汀森（Robert Pattinson）

  主演、《寄生上流》（Parasite，2019）導演奉俊昊執導的《米奇17號》電影經過了多次

  推遲後，這次華納兄弟宣布這部電影將於2025年3月7日上映，比之前的上映日期提前了一

  個多月。


  據報導，《米奇17號》是奉俊昊繼《寄生上流》在奧斯卡獲獎之後的第一部電影，於2022

  年1月進行開發。在確定派汀森主演後，這部電影於2022年8月2日投入製作，並於同年12

  月殺青。原本定於2024年3月29日上映，但由於2023年的美國編劇及演員罷工事件，該片

  刪除了上映日。


  華納兄弟在2月宣布，該片推遲至2025年1月上映。今年11月，華納兄弟為求該片在IMAX影

  院和高級大銀幕上映，再次更改日期，推遲至2025年4月18日上映。如今好消息是上映日

  提前至3月7日。今年10月，奉俊昊曾向《帝國》雜誌表示，因為製作過程中他和工作室之

  間有很多不同的意見，才延遲上映。


  《米奇17號》製作成本為1.5億美元，改編自愛德華‧艾希頓（Ashton Edward）的2022年

  科幻小說《米奇7號》。故事講述了一個出乎意料的英雄米奇巴恩斯（派汀森 飾），他發

