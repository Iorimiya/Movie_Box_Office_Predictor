title: '[普雷] 米奇17號-不功不過'
content: "1. 沒看過小說\n2. 羅伯派丁森演技真好，不同的性格人物用眼神、表情就可以區分\n3. 整體的節奏對我來說有點慢\n4. 伏蟲剛開始覺得怪醜的，看久了卻覺得有點可愛\n\
  \n\n\n\n雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n5. 米奇保留每一次記憶卻沒有PTSD真是佩服\n\
  6. 凱在米奇還有瘋狂夫妻聚餐時表現出對米奇這個複製人的同理心時，本以為會\n   帶到些什麼議題，後面發現兩個米奇時，他提出想要17號，也以為編劇、導演\n\
  \   會怎麼處理，結果隨著18號炸死，直接不了了之...看似伏筆卻又沒了...\n7. 娜夏的人設也很謎，前半段都在和米奇探討人體功學，後面在瘋狂夫妻面前突然\n\
  \   義正嚴詞，然後，更謎的是幾個護衛說著瘋狂夫妻一直在濫用權力，需要召集\n   人手，結果後面衝進來幾個人就可以控制場面了，這反轉的我還沒反應過來...\n\
  8. 提莫還是趁早弄死他吧，不然總有一天真的被他賣了\n9. 感想就是整體不差，但沒什麼特別記憶點\n\n--"
