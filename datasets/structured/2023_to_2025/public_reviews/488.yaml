url: https://www.ptt.cc/bbs/movie/M.1741541647.A.9CC.html
title: '[普雷] 從新意到了無新意的《米奇17號》'
content: '--

  無雷的部分

  --

  評分: 7/10


  《米奇17號》的主題是複製人(或者說重生人)，主角 Mickey 在太空任務中擔任

  拋棄品的角色，專門做會危及生命的任務，記憶隨時上傳雲端，死後透過3D列印

  重新製造肉身並注回記憶復活，每復活一次名子就加一，直到 Mickey 17號。



  整體來說，他的娛樂性豐，主題有新意，喜劇效果佳，畫面氣氛聲音處理和剪輯

  的方面偶有瑕疵卻瑕不掩瑜，表現中上。


  但主線劇情發展的選擇十分可惜、政治幽默的喜劇處理效果不佳，種種可惜的地

  方讓他變成一部平庸的作品。整體來說只能說是中規中矩之作，但他還是富有娛

  樂性值得一看，只要期待不要太高，從單純娛樂的角度來看，他還是一部中上之

  作。




  --

  以下有雷

  --










  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~












  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  《米奇17號》最大的問題在於主線劇情的發展，重生人的設定應該可以有更多的發

  揮。重生人是本片最重要且最有新意的設定，預告片講的也是重生人，主線劇情原

  本是按照設定在走，在介紹重生人的同時也碰觸了靈魂、痛苦、生命的議題，發展

  到兩個Mickey、不再永生的問題。


  這個主題本來發展順利，令人期待到中後高潮導演會怎麼處哩，但萬萬沒想到被一

  刀斷了! 演到中段這個劇情就突然斷了、沒了! 整部片的主線直接變成殖民/反殖民

  、高壓統治/反高壓的套路，而且是最基本沒有新意的那種。本來以為是主題的重生

  人的設定再也沒有發揮到，變成單純的犧牲小我完成大我、殖民者好壞壞、瘋狂領導

  人被推翻的陳老議題。


  可能是怕主題發展到後面收不回來，所以就直接給他斷掉? 無論如何，被視位本部片

  最大新意的設定，前面花這麼多時間形塑與發展劇情，結果在中段以後被完全拋棄，

  實在是太可惜了，甚至令人覺得有點憤怒。


  另一個問題是政治喜劇的品質，導演的前作《寄生上流》是用隱喻處理政治問題，把

  政治諷刺放在劇情、畫面、聲音、情節安排中，而《米奇17號》則嘗試使用更直接的

  手法，透過喜劇式的角色塑造、對話及演出直接演出政治諷刺。


  這個手法選擇本身沒問題，然而可能囿於經驗或能力，在處理上雖然很用力但是並不

  成功，許多情節好像該笑但又沒有那麼好笑，知道想表達什麼但又沒搔到癢處，陷入

  了一個尷尬的局面，政治諷刺喜劇最怕的就是尷尬了，看過粗糙的單口喜劇的人應該

  都懂。簡言之，就是編導能力不夠駕馭這個手法，勇氣可嘉能力不足，這方面需要更

  多打磨。


  雖然政治幽默喜劇的發揮有點可惜，但其他喜劇情節的效果大致上還是不錯的，演員

  也有水準發揮，劇情上除了大情節的問題之外，其他的細節發展有少許瑕疵但不影響

  整體體驗。整體畫面氣氛打造佳，音樂聲音處理有亮點，節奏掌握不錯，除了有點冗

  長--但這又回到主線劇情的發展問題了，你到底想說什麼?


  只能說，拿到重生人的設定卻沒有好好發展、最後被塞了一個老套劇情，是這部片最

  可惜的地方了，基於整體的品質，我還是會給7/10的評分，但只能說是可惜了。


  --'
