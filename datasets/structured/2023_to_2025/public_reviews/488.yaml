url: https://www.ptt.cc/bbs/movie/M.1741242890.A.521.html
title: '[雷] 米奇17號 蟲蟲可愛'
content: '沒看過小說，單純以自己的觀影體驗來說：


  奉導的片我看過不少部，他與好萊塢演員合作已經不是第一次了，但這次的《米奇17號》應該算是第一次嘗試完全以好萊塢的規格製作（有錯請指正），不過主題依舊離不開他常拍攝的階級對抗，把小人物與最上層的人物放在對立的位置。


  故事雖然是科幻背景，但並沒有太多複雜、燒腦的劇情，少了些科幻電影那種神秘、宏大的感覺，但也因此觀賞起來蠻平易近人的，也有很多的黑色幽默橋段，沒有科幻電影常有的冷冰冰的觸感，人性刻畫下都顯得特別真實。不過電影的前半段我覺得稍嫌拖沓了一些，因為前半段都把角色的來歷、整個移民計畫什麼的都交代得一清二楚，少了點觀眾自己想像的空間，而非完全靠影像說故事，比較可惜。


  後段劇情才開始加速，到雪地上與伏蟲的對話我很喜歡，那些蟲蟲真的是意外的可愛，它們被塑造得很有靈性，而且視覺上也相當壯觀。不過比較可惜的是，下層階級的人們反抗、與伏蟲大軍的衝突並沒有想像中激烈，算是用相對和平的方式解決了紛爭，讓衝突的堆疊沒有完全釋放出來，有點不過癮。但即便如此，最後18號犧牲的慷慨赴義，還是讓人頗為鼻酸。


  羅伯派汀森算是這次電影最大的亮點，演技真的很優秀！憤怒、驚慌、悲傷的表情一個個都很抓人眼球（有一段18號氣到講話講不清楚我快笑死），還得一人分飾兩角，我都怕他以後精神分裂XD。也難怪成為近年來好萊塢各大名導看中的熱門人選，我覺得就算只為了他來看這部也很值得！


  奉導在與好萊塢演員合作的時候，常常會讓他們（尤其是反派）演得比較戲劇化、用力一點，例如《玉子》的傑克葛倫霍，或是《末日列車》的蒂妲史雲頓，這次這個任務則是交到了馬克盧法洛飾演的議員身上，醜惡至極，完全沒有要讓你喜歡這角色的意思。雖然我自己還是有點不喜歡這種演戲方式啦，感覺有點刻意，但沒辦法，這已經成為奉導的特色了。


  總之，還是算不錯的一部電影，滿滿黑色幽默與人性的反思，但節奏掌控上個人認為確實不是奉導最好的作品。期待他能繼續在好萊塢影壇發光發熱！


  （哪裡買得到蟲蟲的周邊，我一定要去買一個……）



  --




  --

  你沒看我的字嗎，我說很平易近人啊，科幻只是皮而已，不是主題

  鏈鋸人'
