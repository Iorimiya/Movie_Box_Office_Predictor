title: '[普 雷] 米奇17號..'
content: '雷文防雷資訊頁























  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~
























  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看完米奇17號

  只覺得每一個米奇都是獨立的個體而不是米奇一號的延續

  如果是米奇一號的延續，那就不應該會有每個米奇有不同的個性

  所以我當米奇是複製人，有一號的外表和記憶而已，但是不同的人

  劇情上也有個小地方覺得有趣

  米奇18號和娜夏要回房間打炮，17號追上去但在樓梯間被邀去吃晚餐

  樓梯旁邊的燈光好像透漏有其他人也在打炮的影子(或是我看錯了)

  所以指揮官呼籲不要打炮浪費身體能量，根本沒人在聽

  他們到達尼福爾海姆星球後，17號和其他人在星球探勘

  其他人也是說為什麼還不開始開墾和繁殖

  果然人類還是繁殖最重要


  外星蟲也很有趣，不是只有人類會吹牛，所以那個病毒是真的會把他們滅族的


  當我看完電影

  我朋友問我如果可以像電影一樣，死了又列印出來你要嗎?

  我是不要，因為我覺得二號只是有我的外表和記憶而已，而不是我

  如果是單純的更換器官或是軀體，大腦是原來的，那或許可以


  --

  靠杯勒  怎那麼衰小出生在這島啦??

  不就跟房地產一樣在亂喊價!!??

  你水岸格局第一排、捷運站樓下門口 開5000萬我認了

  現在不是...連那種住金山 通車要一小時起跳 建案旁還有靈骨塔相伴 也跟人家開4500萬

  你怎不去吃屎啦


  --'
