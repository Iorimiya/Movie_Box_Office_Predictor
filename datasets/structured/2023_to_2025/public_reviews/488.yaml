url: https://www.ptt.cc/bbs/movie/M.1741097027.A.08E.html
title: '[好雷] 米奇17號'
content: '防雷






























  睽違了六年,我們奉俊昊大導演終於端出新作品

  本質上來說是好看的,越到後面越是倒吃甘蔗

  有點讓我想起當時看末日列車的感覺

  後面他個人的風格完全出來了

  前面的鋪陳我覺得有點太長,男主角是個免洗筷

  我會覺得可以不用花太多篇幅,這讓前面節奏不夠快

  有點只有推動劇情的意味在

  這部電影比較適合著重在故事而非角色

  我想這種探索未知的題材都亟欲知道更多世界觀

  放在未知的事物,比起已知的人


  羅勃派丁森真的又帥又可愛

  最後18號犧牲自己的從容感讓我想起天能

  那個黑人女根本是女版艾迪墨菲吧！

  沒錯看她破口大罵都覺得很逗趣

  馬克魯法洛充當這次反派還不錯

  只是他是當喜劇在演嗎？有點浮誇

  史蒂芬元我原本很期待,表現是比較普普

  而且17、18號在爭霸要不要推他下去那段

  如果可以讓兩人輪流在洞口演出就更棒了


  總結來說這部是用人性包裝成的科幻片

  我們幾乎都沉浸在人吃人互相剝削的世界

  其中很多已經討論多次的人權道德議題

  類似的梗奉俊昊以前就玩過

  這次是還不錯,但還能更好的一次

  這方面的嘗試我覺得做的最好的還是玉子

  不到很高分,還是有他水準之上的作品

  是可以一看的,光是羅勃派丁森的帥就值得


  ----

  Sent from on my Samsung SM-S9280


  --

  萊斯特在最後敘述中講述了生活中有意義的經驗，他說，儘管他死了，他還是很高興，因

  為這世界上有這麼多的美


  --'
