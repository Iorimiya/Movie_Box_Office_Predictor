content: "★ 爛番茄衝上88%超高分\n\n★《寄生上流》導演 奉俊昊全新作品\n\n★ 改變自暢銷小說《米奇7號》\n\n★  羅伯派汀森 飾演 宇宙級社畜\n\
  \n★  電影預告：\n\n\n《#寄生上流》導演 #奉俊昊  首部好萊塢大作\n\n羅伯派汀森、娜歐蜜艾基、史蒂芬元、東妮克莉蒂、馬克魯法洛\n\n\n接下新工作，挑戰極限人生\n\
  \n上班一定有風險，簽約前應詳閱條款與協議\n\n米奇巴恩斯（羅伯派汀森 飾）報名擔任新計畫的「消耗工」，他若是因任務死亡，公司\n就會重新列印出新的他，繼續執行眾人避之唯恐不及的超爛任務，看似是重獲新生，實際\n\
  上卻是無止盡的社畜輪迴。\n\n更倒楣的是，有天竟同時出現兩個一模一樣的「他」，礙於公司規定「複數人必須被消滅\n」，讓原本自認死不足惜的米奇，這次得為了活下去，依靠彼此找出生存關鍵。\n\
  \n\n雙倍羅伯派汀森的精彩演出，一張票價雙重享受 - TIME OUT\n\n導演奉俊昊再度奉上傑作 - SLASHFILM / BJ COLANGELO\n\
  \n\n\n《抽獎方式》\n\n2月28日 23:59前，推文留言分享想看的原因，就有機會獲得電影特映券\n\n（如：台中場，我想看米奇17號，想看宇宙級社畜上班上到掛\
  \ ）\n\n\n\n《獎項內容》\n\n【米奇17號】電影特映券（一組2張）\n\n\n\n《特映會場次》\n\n台中場：3/5（三）晚場   MUVIE CINEMAS台中TIGER\
