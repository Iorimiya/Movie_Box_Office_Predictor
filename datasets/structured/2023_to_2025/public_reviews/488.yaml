title: '[普雷] 米奇17號 怎麼改寫會更好？'
content: '這部應該有很多人是衝著男主角羅伯派汀森和導演奉俊昊來的吧

  題材也算是蠻新穎的商業科幻大片


  －－－－－－－防雷－－－－－－－






  劇情前半段都在鋪陳預告中已經知道的劇情

  再加上由星艦裡的老大和他老婆所組成的夫妻檔

  越看越噁心的部分倒是營造的蠻到位

  但篇幅好長 也沒有起到太大意義

  看到後半段就開始覺得無聊、不耐煩


  而且劇情涵蓋好多支線 但總覺得廣而不精

  像是凱的身份背景和後續發展 反派夫妻檔之間的關係

  甚至是男主角與好友一開始債主 - 變態分屍癖阿北

  好像看到了很多角色、很多劇情支線 涉及很多議題

  但好像都沒有很到位 或是可以引起觀眾共鳴的點


  想知道如果可以刪減篇幅或是把某幾個支線寫的更加深入

  好奇大家覺得怎麼改寫電影會更好？


  --'
