title: '[普無雷] 《米奇17號》'
content: '在看完《秘密會議》之後接著看《米奇17號》

  可以感受到很普通這一點

  不過普通不是什麼貶義詞

  要去思考

  「普通」和「理所當然」是什麼呢

  這部片很平鋪直敘地描述了米奇的故事

  雖然有提到為什麼上太空

  但當消耗工彷彿是理所當然的事情

  這裡電影沒有進一步描述死亡這件事

  我覺得很可惜

  沒有更深一步去探討

  消耗工所帶來的各種倫理

  還有複數人這件事所存在的各種問題

  純粹讓這一部電影變成一部有些空泛的喜劇


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
