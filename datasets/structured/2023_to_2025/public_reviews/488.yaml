url: https://www.ptt.cc/bbs/movie/M.1750144916.A.5A6.html
title: '[普雷] 米奇17號'
content: '最近因為看到前陣子才剛上戲院的米奇17號已經上了串流平台，於是就趁機看了一下。整

  體節奏偏慢，劇情發展缺乏明顯的高潮、爆點，讓整部電影在推進時少了些張力。雖然角

  色的心理層面有在逐步鋪陳，尤其是主角Mickey17和18之間的對話與衝突，但這種探討多

  半停留在理論層面，缺乏更生動或情感強烈的表現


  也將科幻元素和黑色幽默結合，這點算是亮點，但黑色幽默感不算突出，反而讓整體氛圍

  顯得有些沉悶。在哲學思辨方面有其價值，讓觀眾思考什麼是自我、記憶與身份的關係等

  深層問題，但它缺少讓人印象深刻的戲劇張力和情感共鳴。看完後難免會讓人有空虛的感

  覺


  --'
