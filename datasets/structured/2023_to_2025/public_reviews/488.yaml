url: https://www.ptt.cc/bbs/movie/M.1726621193.A.458.html
title: '[情報] 米奇17號 官方預告'
content: '中文版



  韓國版（預告不一樣）



  死掉的感覺如何？


  《#寄生上流  》導演 #奉俊昊   全新作品

  【#米奇17號  】2025年1月 春節大銀幕見


  【米奇17號】是奧斯卡金像獎得主、【寄生上流】編劇/導演奉俊昊帶來的全新突破性電

  影作品。故事講述了一個出乎意料的英雄米奇巴恩斯（羅伯派汀森 飾），他發現自己陷

  入了一個極不尋常的處境：為了完成僱主的要求，他必須不斷經歷死亡，才能換取生存。



  【米奇17號】由奉俊昊自編自導，並由羅伯派汀森（【蝙蝠俠】、【天能】）、娜歐蜜艾

  基（【STAR WARS：天行者的崛起】）、史蒂芬元（【不！】）、金像獎提名東妮克莉蒂

  （【宿怨】）以及馬克魯法洛（【可憐的東西】）主演。


  這部電影的製片包括蒂蒂嘉納與傑瑞米克雷納（奧斯卡獎最佳影片【月光下的藍色男孩】

  、【自由之心】）以及奉俊昊與崔斗浩（【玉子】、【末日列車】），劇本改編自愛德華

  艾希頓的小說《米奇7號》；執行製片包括布萊德彼特、傑西厄曼、彼得達德以及瑪麗安

  詹肯斯；幕後工作團隊則包括攝影指導達瑞斯康第（奧斯卡獎提名【中有，部分真實的偽

  記事】、【玉子】）、美術指導費歐娜克倫比（奧斯卡獎提名【真寵】、【時尚惡女：庫

  伊拉】）、剪接師楊勁莫（奧斯卡獎提名【寄生上流】、【玉子】）、視覺特效總監丹葛

  萊斯（【怪獸與鄧不利多的秘密】、【玩命關頭：特別行動】）以及服裝設計師凱薩琳喬

  治（【玉子】、【末日列車】）。


  華納兄弟影業呈獻、Plan B娛樂製片公司、Offscreen Production/ Kate Street Pictur

  e Company Production製作、奉俊昊作品，【米奇17號】將由華納影業負責全球發行，台

  灣將搶先全美於2025年1月28日農曆春節大銀幕上映。


  --'
