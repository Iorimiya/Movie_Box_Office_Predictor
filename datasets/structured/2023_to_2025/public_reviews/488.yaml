title: '[普偏負雷] 太多無意義情節的米奇17號'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  奉導的電影我只看過寄生上流

  老實說真的很難相信這兩部電影是出自同一人

  相比寄生上流的深度與精緻度

  米奇就是一部超級粗糙又搔不到癢處的平庸之作


  一個好的故事裡的每個情節都應該是環環相扣的

  所有的事件都應該在推進劇情或角色成長上起到某個關鍵作用

  否則這個事件就不該發生

  寄生上流做得非常完美

  但米奇17號就是充滿著超多這種沒意義的情節


  首先是米奇的合夥人

  這角色佔了不算少的篇幅

  但老實說我真的不知道他的作用是啥

  就算把他直接砍掉也完全不影響主線

  一開始跟18號打鬥沒意義

  販毒支線沒意義

  被債主追殺所以要來殺米奇這段也沒意義

  他所有出場的鏡頭都沒有對主線產生任何影響

  唯一作用就是讓米奇投資失敗

  但這段也完全可以掰個其他理由讓米奇欠錢就好


  再來是凱 這個角色更是沒有意義

  晚宴開嗆反派富豪還以為是個重要角色

  結果下一幕被富豪嘴一下又服服貼貼

  中間和主角差點發展出感情線 以為會帶來主角和女主角的關係轉折

  結果和女主角講了幾句話就不了了之


  再來是毒品 這個支線也不知道為何存在

  三番兩次提到這艘太空船上有走私毒品問題

  而且未經過濾的貨很猛

  結果就沒有下文了


  最後是故事最重要的消耗工設定

  基本上應該也是大部分觀眾進場看這部片的理由

  電影裡一直有人問主角死掉是什麼感覺

  這其實也是作為觀眾的我非常好奇的

  對他來說 死掉是什麼 活著是什麼 我又是什麼

  結果他的答案就只有死掉好可怕

  而電影對18號的描寫更少 實在很可惜

  常理來說既然17號沒死 18號就是一個本不應該出現的人

  他看到17號的第一個反應是想殺了對方 這很合理

  因為17號的存在本身就是對他的否定

  我不太能理解為什麼後來他願意屢次為了17號犧牲自己


  17號對18號說 我本來覺得死掉沒什麼 但現在不一樣了 因為我死了就真的消失了 會留下來的是你

  這段是我在觀影時少數覺得很深刻的地方

  電影中的消耗工技術只是人體列印搭配記憶備份

  那並不是永生

  17號本身只是擁有死亡記憶的一般人類

  對他這個個體而言 死亡依然意味著死亡

  就像他先前的16個米奇也都是真的死了

  18號的出現讓17號自我的意識覺醒

  那一刻開始他不再只為了米奇這個概念服務

  這是全片最重要的命題 最後秀出的全名也與此相呼應

  可惜除了這兩處外電影就沒再有任何延伸了

  如果可以把上面那些沒意義的劇情刪一刪

  把篇幅專心著墨兩個主角

  這部電影一定會更有趣


  不然你用了這麼特別的設定

  卻只是要說個跟外星人好好相處打倒邪惡有錢人的故事

  實在殺雞焉用牛刀



  -----

  Sent from JPTT on my iPhone


  --'
