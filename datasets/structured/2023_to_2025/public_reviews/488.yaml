title: 'Re: [負雷] 米奇17號 所以那個醬汁呢'
content: '來回覆一下海報的問題，會有劇透


  ‧

  ‧

  ‧


  上週看完後跟一些國外觀眾討論，米奇的海報其實有幾個版本；有15位的也有18位。


  15



  18



  共同點都是死掉的米奇眼睛都會有XX，唯獨米奇13號被裁掉，沒有看到死亡XX，


  但為什麼是13號？猜測可能是致敬阿波羅13號的名言「we have a problem」，暗示不斷

  被複製的米奇，已經開始慢慢出現錯誤的問題了。


  這點也可以從生物列印機看到，在列印過程時不時頓一下，就像印表機噴頭或零件出了問

  題時一樣，在每次的列印過程都出了點小問題。


  國外也有眼尖的網友看到場景監視器中，有顯示某號米奇尚未被找到，說不定是13號還沒

  死掉，但這點尚待查證。


  但這些都只是猜測，還是必須等劇組解釋。


  小弟有在Dcard寫10個小細節，無聊可以來看看。



  313


  --'
