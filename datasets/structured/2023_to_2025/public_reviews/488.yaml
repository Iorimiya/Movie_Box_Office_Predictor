url: https://www.ptt.cc/bbs/movie/M.1741856018.A.86A.html
title: '[好雷] 米奇17號 人性探索與反思'
content: '我很喜歡這部電影，

  隨著觀看的次數越多就越愛這部片

  這是一部具有小眾的美感，披著科幻皮，富含人味的電影







  ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  如果說原作《米奇7號》是一部科幻小說，

  那麼《米奇17號》則是一部以科幻為幌子，談論探討「生而為人」定義的電影

  奉導透過《米奇17號》為觀眾寫下的省思，要觀眾去思考生命的價值與意義


  就如奉導訪談時所說的

  「我希望大家可以單純地享受電影，但也花一點點時間思考，我們身為人應該做什麼來保

  持自己的人性，是什麼真正讓人類成為人？大概三分鐘就好！」


  這部雖然用不一樣角度去詮釋，但有把故事說完整，說的精彩，奉導大部分電影的特色一

  直都是以黑色幽默剖析社會，並在絕望中點亮那道微光，這次的《米奇17號》依舊是一部

  充滿人性的故事

  這部跟奉導以往的電影相比，確實在諷刺的力道上不夠犀利，應該說以前是直接把強烈對

  比演出來給觀眾看，這次則是在畫面之後，需要觀眾沉澱省思的故事


  我很喜歡這部除了奉導過往所探討人性的殘酷外還有人性和永恆的美麗的二元性


  在財富、階級與權力所帶來的盲從與貪腐，以及諷刺人性的傲慢與刻板而帶來自我毀滅之

  中，再注入人性光輝以及跨越物種那單純的愛與善良


  米奇即使經歷了這悲慘的一切，仍然能見到人性溫柔的一面，娜夏對於米奇的愛，那堅定

  不移的愛，也是米奇能活下去的動力


  片中每一個死去的米奇，其實都是米奇的某種情緒和想法的化身：愛抱怨的米奇、懦弱的

  米奇、消極的米奇等等，不管米奇有多少種模樣(性格)，那都是米奇，而娜夏都同等的愛

  著他們，因為對娜夏來說，他愛的是米奇的全部，並包容米奇的多面向

  在實驗室娜夏抱著即將死去的米奇真的很令人感動，雖然看電影前因為看過原作和小說作

  者的訪談，知道這一段一定會演出來，但沒想到奉導把這段拍的這麼美



  說到小說，雖然電影改編了很多地方，但有2個追加/修改設定我非常喜歡

  當然也有些設定和人設改掉我覺得蠻可惜的，這邊就不另外提，但也可以理解電影時長和

  媒介關係沒辦法完全照搬，又或是為了配合電影要探討的主題而做修改


  我最喜歡電影新增的2個設定是

  *紅色按鈕的設定

  *17號跟18號個性完全不同


  小說裡米奇在掃描記憶時也有回想起母親

  但不同的是母親是在米奇7歲時偷開飛機去兜風，意外過世，而劇情後面也沒有再提起，

  所以小說的米奇並沒有因為母親的死而感到內疚和責怪自己


  另外小說裡每代米奇的個性基本上都是一樣，要說不一樣的話就是8號(電影裡是18號)比

  較機掰一點，常常會喊說我好累我剛印出來，7號要讓著他

  不過後半段7號從8號身上看到過去自己的身影也是蠻有趣的切入點(小說裡米奇很常會抱

  怨現在的遭遇都是別人害的)或者說，因為7號被伏蟲拯救和做了關於伏蟲的夢，所以個性

  有漸漸變的比較不一樣

  但小說裡8號真的很不討喜，連死都死的很隨便


  扯遠了，回到電影

  電影裡18號個性會差異如此之大的原因其實電影最一開始有演出來，白衣工作人員不小心

  把其中一條線給踢掉，所以18號人格差異會那麼巨大

  至於為何前面幾個都有微妙的不同，從醫務部除了桃樂絲外幾乎每人上班都在打混就能猜

  出一二，官方美術設定集裡面到是有明確提到18號的前額葉皮質有輕微的損傷，導致抑制

  力下降，所以他並不會壓抑自己身上的憤怒


  17號經歷一次又一次的折磨與心靈創傷，以至於他失去了自尊又沒自信，18號就像是17號

  沒有處理好自己的情緒以及童年創傷而產生的另外一個人格

  電影名稱會把小說的7號跟8號會改成17號和18號是因為在美國和韓國(及大部分的國家)17

  、18分別是未成年跟成年的年齡，17是內心還沒成熟的那個少年

  就如羅伯訪談時所說的「18號是17號內心的另外一個聲音的化身」


  因為童年創傷的關係，每次17號都會說這是對我的懲罰，最後出任務時，也說一切都是因

  為5歲時按下了按鈕害母親死去，18號安慰他：「5歲發生的是場意外，你要我跟你說多少

  次？」

  18號的話是米奇內心深處最想聽到的話，而比任何人都清楚這一點的人就是米奇自己，其

  實也暗示這麼多年來米奇心理淺意識也知道母親的死是個意外，但他無法原諒自己，他不

  斷在自己掙扎，自我安慰，同時最深的創傷，也只能靠自己來安撫


  一切的起點是5歲時的那顆按鈕

  一個代表創傷與死亡的按鈕

  到了結局，米奇按下炸毀3D列印機的紅色按鈕，也代表他從創傷中自我解放

  那顆曾經帶來傷痛的按鈕，如今卻變成了幸福的按鈕，從死亡轉向生命



  另外來談一下18號

  在最後1號自殺前，對伏蟲媽媽喊到「一個人類」

  但18號是選擇同歸於盡，那麼為何又會說到「一個人類」？雖然是藍色窗簾，但我自己個

  人的理解是這樣：也許18號，並沒有把自己當人類，心底不認同自己是個人，他說的一個

  人類，是指馬歇爾

  他明明知道即將去死的是他們兩個。而馬歇爾對18號說「你也很害怕，那代表你也是個人

  類」

  18號轉頭看向了17號和娜夏，露出了微笑，為了保護自己所重視的人，用死亡展現出他生

  而為人的證明


  奉導在結尾時治癒了17號，讓他理解，母親的死不是他的錯

  也在18號赴死之前治癒他，他也是個人類

  最後，他按下了按鈕，18號的死，象徵了米奇這個人潛意識渴望成為的樣子和救贖，也讓

  原本不重視自己的17號意識到米奇生命的重量


  最後一幕畫面，英文片名出現在銀幕上，名稱在《Mickey 17》和《Mickey 18》之間轉換

  ，最後片名落在米奇的全名《Mickey Barnes》

  在這一刻，米奇不再只是一個代號，而是成為了米奇巴恩斯

  完整了17號的人格，最後17號的眼神裡可以看到18號的影子，羅伯的演技非常厲害


  我很喜歡電影裡對米奇全名出現時機的安排

  第一次是在米奇還沒成為消耗工，在申請表單上填了全名(但並沒有唸出來)，而觀眾真正

  第一次知道米奇的全名是在劇情後面，娜夏對馬歇爾吶喊，最後則是電影最後的一個畫面

  這安排真的後勁很強，

  被戳到淚點的我，即使已7刷，每次都還是默默的哭了



  當然對奉導來說，如果只描繪充滿希望的未來，這樣是不負責任的，必須真實描繪將來會

  人們會經歷的困難和恐懼(惡夢場景)因為歸根究底，這是人類的問題


  夢境的意象就代表機器可能再造、複製可能再次發生，地上的醬汁和伊兒法手裡的血液也

  代

  表造成米奇過去創傷的那顆紅色按鈕

  奉導在訪談裡有談到惡夢的涵義「在世界各地都發生了很多奇怪的事情。每個人都感到害

  怕，我們感到渺小和無助。我們對彼此的仇恨、蔑視和鄙視進一步加劇了這種恐懼。」


  夢境的最後，米奇拒絕了這一切，也克服了對按鈕的恐懼

  如奉導在訪談時裡所說「如果最無助的弱者也能克服恐懼，找到希望並對抗世界的惡意和

  仇恨。也許這就是我們在這個瘋狂的世界裡所能做的一切以及我們所能希望的。」


  雖然這部的確有些缺點和可以改進的地方，但這些都不影響我對這部電影的喜愛

  越想越喜歡、越想越珍惜，也許其中一個原因因為這是奉俊昊第一部有美好結局的電影


  我很喜歡這個充滿希望結局，17和18在最後都得到了救贖

  電影結束後，也依舊保有奉導引人深思的韻味


  我喜歡這部電影，

  因為這部電影在最後讓我感到很溫暖，讓我思考很多，也為米奇感到開心


  --

  只是蠻好奇為何18號會說1個人類而不是2個人，當然也有可能是我藍色窗簾

  是的，奉導是為了符合電影要探討的主旨才改成17跟18

  身為一個多年奉導粉真的很珍惜這個結局

  謝謝~看完真的很喜歡這部，小說調性跟探討的點跟電影不太一樣，小說是個輕鬆科幻小

  品，主要是探討科學和哲學類的硬科幻

  我內文也有說到這部有缺點但不影響我的喜歡，某m真的不需要每篇文都要留言告訴全世

  界你覺得這部有多糟，從當初1月訂檔就一直看到你唱雖

  也是首映第一場就衝了~最後標題和夢境真的是點睛之筆

  雖然作品內核還是很奉導，但畢竟用歐美的框架去詮釋亞洲議題和內核多少還是有些需要

  磨合的地方

  謝謝~這部看完後真的很多值得回味的地方

  如果您覺得前面被冒犯的話我這邊跟你道歉，電影部分就不另外討論了

  感謝S大！已修改~奉導的電影總是有很多值得深挖的巧思

  奉導訪談有說馬歇爾設計主要是參考各地的政治家和歷史上的獨裁者，夫妻形象則是參考

  齊奧塞斯庫夫婦和馬科斯夫婦，不過因為演員是美國人的關係，所以我不確定他在演的時

  候淺意識有沒有刻意模仿

  我當初一刷的時候也確實覺得“原來這就是羅伯說的藝術A片”（並沒有）

  謝謝，看完真的很感動

  奉導本意也是希望大家單純的享受電影，所以解讀不同也很正常

  18的按鈕是白色的，17才是紅色，代表紅色對那時17來說還是死亡的象徵

  我想奉導也許是想把整個社會的縮影塞在這部電影吧，也許節奏可以再改善，不過我蠻享

  受這2小時17分鐘的

  我也是因為看到很多負雷加上沒幾篇好雷才打算自己來寫一篇~反派部分有趣的是不同的

  人看會覺得諷刺的人不同

  每個都是米奇不同的面向~

  謝謝~

  吃飯的是指凱嗎？不過也是因為娜夏包容所有的米奇和對他的愛才能讓米奇堅持那麼久，

  凱在跟娜夏分配米奇時其實就是在物化米奇

  感覺也有這個可能！而且18在死前望向17和娜夏的那個笑容，也與溫柔的17有那麼一點點

  短暫的相似

  畢竟這角色身上有很多政客的影子，我的每個朋友對馬歇爾的影射的人也都有不一樣的想

  法，很有趣

  謝謝~真的很喜歡這部電影~也希望能讓大家更了解這部電影跟導演在故事背後所要傳達的

  理念

  是啊，每人主觀喜好不同~很開心你選擇觀看和喜歡這部

  不會~您的心得也總結的很好，這部電影其實就像是一部帶點殘酷和純粹與永恆愛的成人

  童話'
