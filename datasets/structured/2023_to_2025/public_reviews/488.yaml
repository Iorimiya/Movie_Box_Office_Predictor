title: '[討論] 米奇17號 爛番茄86%開盤'
content: '《寄生上流》導演奉俊昊全新科幻電影，改編自愛德華艾希頓的2022年小說《米奇7號》

  ，《蝙蝠俠》羅伯派汀森主演。


  米奇巴恩斯，為了逃離人類難以居住的地球，報名擔任宇宙探索星艦計畫的「消耗工」，

  他若是因任務死亡，公司就會重新列印出新的他，繼續執行眾人避之唯恐不及的超爛任務

  ，看似是重獲新生，實際上卻是無止盡的社畜輪迴！更倒楣的是，有天星艦上竟同時出現

  兩個一模一樣的「他」，礙於公司規定「複數人必須被消滅」，讓原本自認死不足惜的米

  奇，這次得為了活下去，依靠彼此找出生存關鍵。


