url: https://www.ptt.cc/bbs/movie/M.1741878667.A.3D4.html
title: '[普雷] 中規中矩的《米奇17號》 '
content: '不用多說

  院線熱映中





  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  《寄生上流》後的近作。相較奉俊昊的南韓作品帶有社會現實指涉且游刃有餘，好萊塢的

  作品作為創作者的鏡像閱讀，是奉俊昊更為雅俗共賞的姿態，看得出來比較chill因為比

  較不care論述基礎但看似更有「創意」的另一面，往往是更為瘋狂中帶有的通俗性置入政

  治隱喻。



  這次明顯與《玉子》暗酸行動主義分子的政治轉向，可能是反映著美國川普與馬斯克的科

  技民粹氣氛，電影明顯較為政治正確地往進步派靠攏，主角身為可複製消耗工的弱勢勞工

  權益，主角女朋友黑人權益，與「原住民」問題等等。



  雖在明確的善惡好壞劃分的情節中，嘲諷過度有便宜行事之嫌，比較納悶是關於劇本上敘

  事尺度的混亂，在17號與18號共存段落開始，從原本是關心著殖民星球的大視野，一度變

  成男女個人情愛的drama，這點在《寄生上流》中家教與有錢學生的兒女私情相較之下倒

  是在整個寄生計畫中毫無違和之感的，「集體現象與個人存有關係」，似乎是為了《米奇

  17號》引渡複製人的存在主義思考而來的情節，卻比較會讓人質疑，關於個性能否複製這

  件事情，似乎也是電影必須更進一步以劇情來描述或者提問複製人的道德問題，卻只見電

  影演變成無關痛癢的戲謔劇碼，而非有更深刻的提醒，於是在劇本結構上變成看似小小的

  亂流，為了只是在鋪成結尾伏蟲與人類決鬥（or 溝通）。



  不過個人還是對伏蟲行為的描述給予正面肯定，令人想到之前看的鯨魚紀錄片，談到牠們

  的發聲模式傳遞可以跨越幾千公里，相信人類察覺不到的生物遠距共感這件事情，有一些

  非人思考的企圖。還有結尾炸掉人類複製列印機器，象徵回到傳統，也在看似回不去科技

  的線性時間成為某種「回返」．



  --


  拉特飯 - 以商業力量進入獨立市場


  --'
