url: https://www.ptt.cc/bbs/movie/M.1741676843.A.3A6.html
title: '[普無雷] 米奇17號，題材不錯，劇本可惜'
content: '用譬喻來說的話

  導演即廚師，劇情即食材


  知名廚師開發新料理

  吃過過去廚師手藝的人，一定會帶點期待感來嚐鮮

  但這次的作品，落差有點大

  導致部分影迷失望


  小丑，鐘點站皆是如此

  很棒的題材，卻被劇情搞砸

  有點恨鐵不成鋼的感覺


  看完電影的心得，預告剪的很厲害

  感覺很讓人期待

  但看完後的心得感想是...

  美隊4好像也沒這麼差？（對我來說，美隊4也是普普）



  這部完全沒有想二刷的感覺

  但值得說的是

  男女主角的演技跟氣勢都不錯

  對電影有加分


  結論是：可以去電影院看一次

  但別太期待劇情：）


  -----

  Sent from JPTT on my Sony XQ-DQ72.


  --'
