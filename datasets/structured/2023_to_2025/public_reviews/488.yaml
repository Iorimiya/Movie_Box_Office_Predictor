url: https://www.ptt.cc/bbs/movie/M.1741485137.A.C39.html
title: '[普無雷] 米奇17的平庸科幻之旅'
content: '直接講結論，還蠻失望的，老實說我也沒有期待看到甚麼科幻大作

  絕對也不是甚麼期望越高，失望越高這種言論

  但奉俊昊拍出這麼平庸的作品，還是令人蠻失望


  老實說這種劇本設定，在好萊塢已經不算稀奇，但奉俊昊還把原劇本改編的更平淡

  就是一部順順，劇情沒有意外的科幻娛樂片

  腳色刻劃也都過於死板，整部片好像剩男主角演技在撐場

  馬克盧法洛與東妮克莉蒂的演法雖然很認真 但這種劇情走法演到後來真的很煩

  我甚至期望奉俊昊直接照原著拍就好了 原著的面相還更多元有趣

  改到現在就是一部好萊塢公式化娛樂片


  看YT有些看試映給好評的youtuber

  真的覺得也是蠻....

  說甚麼這部片很發人省思，有很多議題可以討論


  沒錯 那這些身份認同、生存意義、科技倫理以及階級壓迫等等的議題

  奉俊昊過去哪部電影沒提過  但過去的拍法都高明多了

  米奇17去探討這些議題的方法非常平庸 甚至毫無新意


  米奇17整體美術視覺OK，但也沒驚喜

  視覺效果算是合格，好萊塢A級預算該有的水準還是有，外星環境、飛船內裝、克隆技術的呈現都不錯，但少了點特色，沒有讓人驚艷的畫面，我甚至覺得再看一遍風之谷的震撼可能都多過於米奇17


  總結來說，《米奇17》不是爛片，但也絕對稱不上佳作，對於奉俊昊這種級別的導演來說，這部片甚至可能是他的最低標，如果你是科幻片愛好者，可以當成平日無聊打開電視背景片看看，但如果是抱著看一部新的經典科幻的期待，那還是省下票錢吧。


  --'
