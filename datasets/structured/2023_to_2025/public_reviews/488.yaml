url: https://www.ptt.cc/bbs/movie/M.1729641320.A.EE3.html
title: '[新聞] 《米奇17號》推遲上映 奉俊昊：剪輯過程'
content: '《米奇17號》推遲上映 奉俊昊：剪輯過程漫長




  （大紀元記者葉子杰編譯報導）《米奇17號》（Mickey 17）原定在今年3月上映，但華納

  兄弟將上映日推遲至明年初。近日，導演奉俊昊談到推遲的原因，他提到他與華納兄弟間

  存有不同的意見，所以電影的剪輯過程很漫長。


  奉俊昊曾編劇兼執導動作冒險片《玉子》（Okja，2017）以及《寄生上流》（Parasite，

  2019），並且憑藉《寄生上流》獲得奧斯卡最佳影片獎和最佳原創劇本獎。時隔五年，他

  自編自導的美國科幻片《米奇17號》也即將上映。該片原本排定於2024年3月29日在美國

  上映，但華納兄弟在2月宣布，推遲至2025年1月上映。


  18日，導演奉俊昊向《帝國》雜誌解釋延遲上映的原因，他表示，因為製作過程中他和工

  作室之間有很多不同的意見。雖然這段剪輯過程漫長，但他擁有最終剪輯權。他想讓觀眾

  知道，《米奇17號》是他親自製作的導演剪輯版。


  奉俊昊說：「從《玉子》到現在的《米奇17號》，我是有最終剪輯權的，工作室尊重我的

  最終剪輯權。當然，這並不是說過程沒有一些反覆（剪輯修正），在剪輯過程中會有很多

  意見和討論。」他繼續說：「但這部電影就是我剪輯的，我非常滿意，這是一段漫長的過

  程。不過，一直都很順利，也備受尊重。」


  據報導，這並不是第一次遇到剪輯意見的問題，奉俊昊首部英語電影《末日列車》（

  Snowpiercer，2013）的剪輯過程就曾發生過激烈的爭論。另據《IndieWire》報導，此前

  就有傳言稱，華納兄弟對奉俊昊早期的《米奇17號》導演剪輯版提出異議，聲稱觀眾無法

  「理解」早期的剪輯版本，所以推遲了上映日。


  《米奇17號》故事講述了一個出乎意料的英雄米奇巴恩斯（羅伯‧派汀森 飾），他發現

  自己陷入了一個極不尋常的處境：為了完成僱主的要求，他必須不斷經歷死亡，才能換取

  生存。


  英國男演員羅伯‧派汀森（Robert Pattinson）也向《帝國》雜誌提到了導演的最終剪輯

  權，他說：「製片廠拍了這部電影真的很酷，而且奉俊昊還主動取得這部電影的最終剪輯

  權，拍出的東西確實讓人覺得非比尋常。」


  除了派汀森外，主演員還包括英國女演員娜歐‧蜜艾基（Naomi Ackie）、韓裔美國男演

  員史蒂芬‧延（Steven Yeun）、金像獎提名的澳洲女演員東妮‧克莉蒂（Toni Collette

  ）以及美國男演員馬克‧魯法洛（Mark Ruffalo）。


  《米奇17號》將於2025年1月28日在台灣上映，2025年1月31日在美國上映。


  --'
