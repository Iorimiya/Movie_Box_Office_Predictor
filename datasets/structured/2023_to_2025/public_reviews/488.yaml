title: '[新聞] 羅伯派汀森米奇17號北美票房遠低預期！'
content: '羅伯派汀森主演《米奇17號》北美首週票房遠低預期！2 億美元成本恐難回收





  金獎導演-奉俊昊號召羅伯派汀森（Robert Pattinson）、


  馬克魯法洛（Mark Ruffalo）等實力派演員齊飆戲的科幻喜劇《米奇17號》


  （Mickey 17）上週終於在北美與台灣等地上映，開盤的票房數字也剛出爐。



  據估計，《米奇17號》在北美首週以 1910 萬美元奪冠，海外地區則斬獲 3420 萬美元，


  全球首週總計 5330 萬美元。IMAX、杜比廳等特殊版本則佔了 47 % 的票房。





  如果《米奇17號》是小成本的非續集電影，這成績不算太差，


  但由於《米奇17號》有不少明星掛帥，製作成本高達 1.18 億美元，


  行銷成本則約 8000 萬美元，合計將近 2 億美元，


  根據一位熟悉這類大型製作的另一家影業高層粗估，本片起碼要賣到 2.75 億至 3 億美元

  ，


  才能在院線上映期間打平成本或實現盈利。



  而就當前走勢來看，《米奇17號》要賣到 2 億美元的門檻都有點困難。





  --'
