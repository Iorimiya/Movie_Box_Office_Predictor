url: https://www.ptt.cc/bbs/movie/M.1741368144.A.D46.html
title: '[普偏負雷] 米奇17號：所有主題我都想碰一點點'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n奉俊昊的電影，沒問題的吧！我是這麼想著的。結果剛剛看完出來，我個人跟我朋友實在都\n\
  不是很喜歡…我覺得這感覺就很像是當初相信著Taika Waititi的《雷神索爾3》，想著《兔\n嘲男孩》走進電影院，卻被強迫餵入充滿低級笑點的《雷神索爾4》一樣…這樣的相信就是\n\
  愛太深會讓人瘋狂的勇敢嗎？\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n在進電影院之前有看過預告，大概知道是有關複製人的電影。\n\n電影一開始從米奇17號執行的任務揭開序幕，劇情似乎在暗示米奇的朋友、甚至是米奇自己\n\
  好像都不太在乎自身的生死，因為米奇是個 Expendable（我忘記字幕翻譯什麼了）原來米\n奇是因為聽信朋友提莫的讒言，一起去跟高利貸借錢開馬卡龍店，結果就是慘賠一筆，還被\n\
  抓去威脅要砍手手、斷腳筋，高利貸甚至拿著電鋸在米奇前面說即使跑到地球的天涯海角，\n我們都有辦法找到你。\n\n既然地球的天涯海角你都找得到我，我又沒錢但又不想被鋸成兩半，那唯一解似乎就是離開\n\
  地球啦！米奇的如意算盤這麼打著，於是在一陣糊裡糊塗之下，毫無專長的米奇就這樣申請\n了Expendable的職位，眾人驚呼著。\n\n從這邊大概就可以知道整部電影的基調就是科幻包裝的荒謬黑色喜劇，行吧！我覺得科幻電\n\
  影用黑色喜劇的方式呈現（或是相反，黑色喜劇用科幻電影包裝）都是很有趣的嘗試，我很\n期待接下來的角色衝突。\n\n接著米奇17號卻不小心在任務中生還了？原本毫無求生意志，還盼望著能一死痛快的他，卻\n\
  被其實毫無殺戮之心的星球原住民蟲蟲Creepers救了回來(Creepers好像狗狗套著鼠婦套皮)\n這時才發現跟18號重複的multiples了！而產生Multiples的解決方法就是兩個人的存在都必\n\
  須被抹除。然後米奇又開始回溯解釋為什麼產生Multiples就必須通通抹除。然後兩個人開\n始打架，我才是該活下去的那一個！不，我才是！\n\n這裡大概就是衝突點。但電影總共有兩小時，花了一小時好不容易走到了衝突點，結果這一\n\
  小時全部都是米奇口述故事背景，呃…嗯…也行吧…期待這個衝突帶給劇情後續的發展是什\n麼，會是複製人的自我認同嗎？還是如忒修斯之船一樣的哲學命題？\n\n再來就是Mark\
  \ Ruffalo跟 Toni Collette飾演的荒謬夫妻檔落選議員（我甚至一度懷疑Mark\n Ruffalo在模仿川普，手勢嘴型跟語調都太像了），這對夫妻檔從一開始就很荒謬了，而且\n\
  是只有他們很荒謬，電影裡其他角色沒有人看出來他們很荒謬，還有很多盲目的跟從者，一\n些側面資訊還可以知道這些盲從的人還是社會中的精英。\n\n或許是想諷刺社會現狀吧！行吧…期待劇情怎麼解構這個議題，或是用什麼更荒誕的方式呈\n\
  現社會現實的盲目，行吧…行吧…我不斷告訴自己，再等一下。\n\n接著中間演了一小段變成Multiples的米奇的小插曲。米奇在剛上太空船的四年間認識了 Na\n\
  sha，彼此有了邂逅，Nasha 也一直很照顧身為Expendables的米奇。後來因為一些原因，在\n任務痛失伴侶的英國腔探員Kai也有點喜歡上了米奇17號（也差點上了），與此同時，Nasha\n\
  \ 一發現有兩個米奇時，內心也因為毒品放大了喜歡的情緒，高興的不得了（畢竟誰能拒絕\n兩倍的羅伯派丁森呢？甚至是溫柔的派丁森跟霸總的派丁森呢，連筆者都有點春心蕩漾了呢\n\
  ！）最後Kai跟 Nasha 協議，好，17號給你，我要18號。霸總18號不爽夫妻檔，掄起手槍要\n去宰了那對兔崽子，溫柔17號用盡全力要阻擋霸總18號\n\n\
  我很喜歡這裡的小插曲，覺得可愛。這裡稍微可以感覺到電影好像想討論「即使記憶相同，\n仍然會導致不一樣的性格，但是每個人的本性是不會改變的」，之前好像有哪部電影的命題\n\
  也是這個，但是我想不起來。我原本也很期待兩個米奇跟 Nasha 還有英國腔探員Kai之間的\n互動跟火花。但我怎麼也沒想到，英國腔探員Kai下一次的出現已經是最後一幕了顆顆。\n\
  \n接著霸總18號要殺荒謬議員時，一群人意外地從運回來要在慶典使用的石頭裡發現了Creepe\nrs寶寶，一隻被射成肉醬，另一隻則被活捉。接著主角群們發現，原來Creepers從來沒有想\n\
  過要傷害人類，但荒謬夫妻檔執意要釋放毒氣殺光那些因為蟲寶寶盧克的死憤而包圍太空船\n的蟲群跟蟲媽媽，而另一面，蟲媽媽則要求人類把另一隻蟲寶寶祖克帶回來，然後一命換一\n\
  命。荒謬議員出去談判邀功，留著對Creepers尾巴打成的醬汁情有獨鍾的荒謬議員夫人。\n\n\n前面吸毒的Nasha，這時義正詞嚴地指出荒謬議員的荒謬行為，與此同時太空船裡的人們這\n\
  時也才突然大夢初醒，荒謬夫妻檔前面的荒謬行為這時在他們眼中突然變得荒謬了，一行人\n對荒謬議員夫人群起而攻之。這麼突然的劇情轉折顯得這一切實在太荒謬，荒謬到不知道是\n\
  導演刻意為之，還是大家都覺得這樣沒問題？還是是我的問題？荒謬要好笑，像是噬婚遊戲\n第三幕、或是懼裂第三幕那樣，至少我個人是不太能接受這樣的轉折。\n\n原本好像跟溫柔17號格格不入的霸總18號，最後談判時也突然覺得自己應該要為17號犧牲。\n\
  還是說可能太想殺了荒謬議員嗎？我不曉得。所以就跳到荒謬議員的戰車上跟荒謬議員自爆\n。說「是時候說再見」那幕不知道為什麼想到天能最後。但其實這一整段也很荒謬，顯得荒\n\
  謬夫妻檔其實好像沒那麼荒謬了。反正最後溫柔17號跟 Nasha 解決問題，但善於解決問題\n的霸總18號犧牲了，除此之外，人體列印機炸掉了、荒謬夫妻檔下台、英國腔探員Kai找到\n\
  新伴侶，皆大歡喜（撒花）\n\n但有人能告訴我最後米奇做的夢境是什麼意思嗎？還是想表達什麼？原本以為會有什麼巨大\n爆點或轉折，結果看完之後覺得不演這段也一點關係都沒有。\n\
  \n原本猜測可能會探討的議題或表演型態有複製人的忒修斯之船議題、荒謬黑色喜劇、諷刺喜\n劇、複製人與人之間親密關係相處上的碰撞與掙扎、記憶與自我形塑、小時覺得自己害死媽\n\
  媽的救贖，每個可以討論的命題都好像只有碰到一點點，就再也不提起的感覺。好吧，或許\n本來電影就沒有一定要傳達什麼認真的議題，但也要無腦的好笑吧？好笑嗎？說真的其實也\n\
  還好。還是有沒有《米奇7號》的讀者告訴我原著想表達的可能是什麼。\n\n《米奇17號》不算是一個真的很差的故事，因為其實算有頭有尾結構完整，但我對奉俊昊的\n\
  期待不是只有把故事講好，還必須要講得漂亮、講得精彩。\n\n我還是對奉俊昊有信心，只是我不是《米奇17號》電影的大粉絲就是了。\n\n--"
