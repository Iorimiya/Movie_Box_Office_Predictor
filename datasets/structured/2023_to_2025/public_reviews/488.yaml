url: https://www.ptt.cc/bbs/movie/M.1741612400.A.6A5.html
title: '[負雷] 米奇17號 所以那個醬汁呢'
content: '不是

  你不是搞笑科幻爽片嗎

  幹嘛搞成好像能討論什麼人類意義 複製人靈魂

  結果都摸個邊 什麼都講個隨便

  那你拍一堆沒意義的慢鏡頭有個狗屁意思


  一大堆設定都丟了就忘記

  不重要 不用講

  然後給你一堆錯誤引導

  讓你覺得白癡都知道是伏筆

  結果原來我才是想太多的白癡

  你以為眼鏡光頭是幕後黑手

  你以為總統生病了

  你以為醬汁有問題

  你以為地球方還會有政治戲碼


  你以為18號是因為做出印表機的連續殺人犯的記憶載入到他腦袋裡面才會變這樣的

  還在滿心期待他會出場當最後大魔王？？？？？


  我最後打開手機看這東西演了兩個小時

  還在想18號什麼時候會再跳出來當最後boss

  這樣我就能接受那兩個故意演成白癡的夫妻有多刻意愚蠢難看

  結果啥小都沒有

  給了我一個爛夢


  嗯

  跟這部整體觀感差不多


  整部片精華是苦力怕開嘴巴露出眼睛的十秒鐘

  跟開頭到片名

  剩下黑人女當總統對抗白人就不用看了


  還有到底為啥海報上只有15個米奇

  到底

  這種垃圾就不用送我硬紙了好嗎 威秀


  --

  我從頭到尾都覺得他搞笑場面的配樂都亂放一通

  我根本不知道他想不想讓我笑

  整部我都沒笑過半次

  複製人就一點都不適合真的要很嚴肅很難過的黑色喜劇

  複製泰勒還泰朗那部都比這部好幾百倍

  至少比較好笑

  我覺得要噁不噁 要可愛又沒真的水熊蟲可愛

  要克蘇魯又加了個最後吐槽 定位莫名其妙'
