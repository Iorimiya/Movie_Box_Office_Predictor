url: https://www.ptt.cc/bbs/movie/M.1741100328.A.295.html
title: '[普無雷] 米奇17之玉女心經'
content: '無雷心得

  安心服用


  奉俊昊自從寄生上流後，久違的大作，等了好久好久...


  光是用奉俊昊三個字，不用看原告或題材，就能讓人可以直接買票進場


  這部米奇17的預告片，讓我以為可能是科幻大片，或者是有點燒腦的穿越什麼的


  就算沒有都不是，也至少有奉俊昊一貫的寓意和含意，比如說末日列車和寄生上流，滿滿的階級鬥爭和對立，貧富差距的衝突


  但今天的米奇17看完，充滿很多的黑人問號，或許是我天份不夠看不出來，還是這部片就沒有想表達的寓意？


  節奏非常慢超級慢，又有非常多的定點對白，前面至少花了45分的時間，來介紹複製人的由來，花這麼多時間，還沒進入到重點，心想這部片不太妙，果然...


  不過整部片最大亮點，是羅伯派汀森的演技，有很多的獨角戲自白，再加上一人分飾兩角，有發揮到個人特色


  劇情非常簡單，沒有很難理解的細節，也不用動什麼腦，有很多黑色喜劇的笑點，如同標題下的玉女心經，滿有趣的笑點...不過全場笑的人沒很多就是了


  奉俊昊睽違多年的作品，著實讓人有一點失望，幸好有羅伯派汀森撐場面，不然整部片真的沒什麼可看之處，只能勉強給個普雷


  -----

  Sent from JPTT on my Samsung SM-S9310.


  --

  韓國人和你血海深仇膩？什麼板都有你在噓韓國'
