url: https://www.ptt.cc/bbs/movie/M.1450057098.A.533.html
title: '[專欄] 幕前幕後兩三事：《驚爆點》（1991）'
content: "【幕迷影評】電影知識 專欄分享\n\n\n[知識] 幕前幕後兩三事：《驚爆點》（1991）\nby 壕G\n\n\n網頁版文章（有圖文解說）：\n\
  \n\n\n\n\n今天先讓我們跳離「飢餓遊戲」系列作，來看看基奴李維於1991年的作品《驚爆點》（\nPoint Break），為何要來聊這部電影呢？因為這禮拜上映的《飆風特攻》（Point\
  \ Break\n）就是它的翻拍作，光看預告似乎非常有極限運動風味的警匪特務片，又標榜著全實景拍\n攝無綠幕演出，不禁讓人好奇當初的基奴李維版本又是如何。\n\n\
  感想讓我們稍後再聊，先來熱身一下。\n\n\n\n一、極限精神\n\n不論是當初的《驚爆點》還是新版的《飆風特攻》，這部電影的主打就是極限運動的精神\n和浪蕩青春的男性友誼，尤其是那些在女性眼裡看起來超級沒有意義的事情，總是能被這\n\
  電影用來襯托男一與男二間的靈魂交流。但話要說從頭的話，這部電影的構想是來自有一\n天，共同製作人的瑞克金恩躺在加州的某個海灘上耍廢，並且手中拿著「加州周報」，報\n\
  中有著不少社論述說關於加州是美國第一搶劫之州，於是他心中就想起了一個小點子：如\n果能夠將他眼前的這片熱情大海與搶劫合而為一，講述一個FBI探員臥底衝浪團體偵破搶\n\
  劫案的故事的話？\n\n建立於衝浪的基底，極限運動的構想也越來越擴大，搞到最後整部片的劇情和演技其實一\n點也不重要（根本爛透了，基奴李維的演技也爛透了），當中對於體育運動的拍攝反而喧\n\
  賓奪主。\n\n先從衝浪手說起。為了講求真實拍攝的效果，他們找來了一群真正會衝浪的演員們，在主\n角兩人身邊打轉的小臨演們當中就有兩人是職業衝浪選手，分別是波傑西克里斯多福以及\n\
  約翰菲爾賓，片中大量的金髮帥哥滑浪鏡頭幾乎都是靠他們代工上陣完成，尤其是最後史\n威茲挑戰五十年巨浪的橋段，更是請到了真正的傳奇巨浪征服者戴瑞克多納（ Darrick\n\
  Doerner）來實際挑戰巨浪拍攝。至於基奴李維則是為了拍攝這部電影才開始學衝浪，學\n會後反而成為了他的習慣，到現在依舊還是將衝浪當成休假時的興趣。\n\n\
  另外跳傘更也是當中非常經典的一幕，在1991年時並沒有類似Go-Pro那種自拍用小型攝影\n機，更沒有普及的Youtube或FB讓許多人分享跳傘的影片，於是乎想看跳傘畫面的人，通\n\
  常都得到電影院才有機會看的到，在當時跳傘畫面有八成以上都是真實的拍攝，於是有人\n問啦，不過就是拍跳傘，有什麼難的？跳傘可不像阿湯哥的「不可能任務系列」綁上安全\n\
  索後一切靠膽量硬上，跳傘的拍攝過程演員必須百分之百靠自己，空中維持平衡不說，在\n哪個高度時間點不慌不忙拉開傘包，這點可沒幾個演員有那膽量做到，就算有膽量，也不\n\
  見得是合法的行為，因為沒有相關執照不會有飛機輕易載你上天丟你出艙門，甚至光要將\n降落傘包弄到手都會有困難。於是很明顯的，基奴李維的片段擺明就是假的，但男二派屈\n\
  克史威茲熱愛跳傘，平時也常參與跳傘活動，他的片段全是真實拍攝。原本基於保險金問\n題製作方認為全部以假畫面替代就好，但有大量跳傘經驗的史威茲說服了劇組至少要有一\n\
  名演員進行真實的跳傘拍攝，劇組被說服了，於是出現了那段\"Adios amigo!\"然後滾出飛\n機外的真實一刀未剪演出。\n\n\n二、兩顆明日星\n\n\
  雖然說跳傘畫面是由史威茲本人拍攝，但偏偏跟基奴李維有大量對戲的徒腳追逐戲碼反而\n不是他演出，因為他當時正在歐洲宣傳自己的另一部新片，你們猜是哪部呢？提示：常歡\n\
  與郝來玉。答案是人鬼情未了！也就是《第六感生死戀》（Ghost）。喔喔喔，看史威茲\n衝浪時的帥氣樣，不仔細回想一下還真是會忘記他當年是性感男星出身呢。\n\n\
  基奴李維也不是第一次與史威茲合作體育類型的拍攝畫面了，1986年《血性小子》（\nYoungblood）講述冰上曲棍球的故事，就已經事先替波帝與猶他兩人建立一段歷史。但我\n\
  們再跳回到現實世界，基奴李維飾演的是因膝傷退出美式足球界的FBI探員，實際上他本\n人就是因膝傷退出冰上曲棍球界後的演員。\n\n\n\n\n三、後續節目\n\n\
  《驚爆點》在當年還在撥接速度的時代掀起了極限運動搭配電影的熱潮，那就好比九零年\n代所有人都被麥可喬丹給迷倒進而大量推廣籃球運動的狀況一樣。在那之後更有電視台推\n\
  出了以《驚爆點》為故事背景的綜藝節目《Point Break LIVE!》，主要就是挑幾幕戲來\n重演一次，並讓臨演們搭配一名隨機選出的觀眾，由那位觀眾來飾演主角強尼猶他，也因\n\
  此這名主角必須負責所有基奴李維的台詞。\n\n這節目雖然一聽就知道絕對是活不久的那種，但還真是有不錯的收視率以及參與度。因為\n男孩心裡都有個極限魂啊，不然王道漫畫裡誇張的戰鬥畫面怎會讓男孩子熱血沸騰咧。例\n\
  如魯夫的槍亂打啦、琦玉的一拳斃命啊、死神的瞬步啊、進擊的巨人的立體機動裝置啊（\n噗嘻～噗咻～）等等的，但因為我們很清楚自己絕對做不到而且也懶的練習，所有就用看\n\
  的來內體自然假熱血，女人怎麼能懂我們愛看體育頻道的心情哼哼。\n\n\n四、玩命關頭驚爆點\n\n看完這部電影的你與你與他，我想都感覺這劇情根本似曾相似？沒錯啊，極限運動、臥底\n\
  、交到極限好朋友、臥底被揭穿、抓與不抓的抉擇等等，不正是2001年《玩命關頭》（\nThe Fast and the Furious）的劇情嗎？當然也有不少網友猜測《玩命關頭》其實就是《\n\
  驚爆點》的翻拍，但這點始終都只是流於猜測而已。\n\n有趣的是，基奴李維在搶劫戲碼時於銀行對面點了一個鮪魚三明治，相同的保羅沃克也向\n他的戲中女友喬丹娜布魯斯特點了鮪魚三明治。\n\
  \n\n五、隱藏角色\n\n不出現在銀幕上，也不出現在名單之中，電影有位極大牌人物偷偷影響了整部電影的走向\n，那位大人物就是詹姆斯卡麥隆。\n\n在《魔鬼終結者2》（Terminator\
  \ 2: Judgment Day）的DVD幕後花絮導演訪談中，詹姆斯\n卡麥隆便向觀眾坦承前一年上映的《驚爆點》片尾結局其實曾經由他改寫過，而那段結尾\n留下一些伏筆讓不少觀眾猜測不斷，他也坦言說明，史威茲飾演的波帝確實藉由巨浪自殺\n\
  了，而主角強尼猶他也非常清楚他的目的，因為同樣愛上衝浪的這名角色，看得出五十年\n巨浪的能耐。這段最精彩的莫過於，最後那巨浪吞噬掉波帝時，徹底透漏人類追求極限刺\n\
  激的最終，或許也一直存留著被極限吞噬的可能性，而只要我們持續不斷的挑戰極限，那\n可能性就會永遠存在。\n\n\n\n以上就是咱們這禮拜即將上映的《飆風特攻》原著電影，希望各位看完後能對新版有更深\n\
  一層的認識，並能了解為何這部電影會主打真實拍攝，甚至要用大量的極限運動特技來形\n塑「特攻」的風格。\n\n最後讓我們用這影片來收尾，並讓各位來找找看有個超級大亮點。\n\
  \n\n\n解答公布：那個歪嘴笑的很機歪、被基奴李維過肩摔的辮子頭其實是「嗆紅辣椒」的主唱\n安東尼凱迪斯！\n\n至於這部片的感想嘛…的確以年代背景來說各種極限運動的畫面拍攝是非常出色的，的確\n\
  類似於第一次看到《玩命關頭》時的興奮感，更何況電影上映時我還一歲不到，天啊我一\n歲不到時家裡連電腦這東西的存在都不知道，蘇聯才剛倒，撥接是沙小？讀大學就是光宗\n\
  耀祖的那個年代耶！仔細想想後，也難怪這電影能夠造成這麼強烈的熱潮了。\n\n講這麼多我的意思很明顯，整部電影其實沒有很好看…。\n\n\n相關參考圖片與資料\n\
  \n一、IMDb\n\nPoint Break (1991) on IMDb 7.2/10\n\n\n\n\n\n二、開眼電影網\n\n\n\n三、《驚爆點》DVD特別收錄與幕後花絮\n\
  \n\n\n\n\n\n\n--\n\n===================== power by =====================\n     \
