title: '[討論] 基努李維經典片【驚爆點】重拍版'
content: "劇情簡介\n\n新版《驚爆點》由Ericson Core執導，片中另一男主角“強尼”將由澳大利亞男演員Luke\n Bracey飾演。一位年輕的FBI探員滲入一個非凡的極限運動團隊，他懷疑這個團隊策劃了\n\
  前所未有的前所未有的企業搶劫案。\n\n這個故事是由1991年《驚爆點》這齣經典的電影啟發，而拍攝地點也拓展到了德國、奧地\n利、瑞士、意大利、中國。\n\n\
  本片由龍祥發行，2015/12/25上映。\n\n--\nSent from my Android\n\n--\n這讓我想到Nick Frost在終棘警探也有做"
