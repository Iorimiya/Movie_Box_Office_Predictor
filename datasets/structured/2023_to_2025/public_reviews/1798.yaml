url: https://www.ptt.cc/bbs/movie/M.1507981870.A.549.html
title: 'Re: [討論] 刺激驚爆點 真假問題'
content: '其實很多人都說史貝西從頭到尾在說謊，我一定要為他平反一下。


  這裡先定義一下什麼是謊話什麼是真話，我認為真話是全部都是自己知情，然後不加修飾

  也毫無保留，知道什麼說什麼，真實度百分百；至於謊話，則是有程度之分，例如幾百句

  話裡面摻雜幾句假的，是謊話，全部都假的，當然也是謊話。


  到這裏你應該會認為：那他就是從頭到尾在說謊啊。不是的，原po想問的是哪些事情跟人

  物是真的，劇情內容實在非常值得

  討論；首先人物上我認為幾乎沒有虛構而是全部都存在的，律師小林、老大紅足也是，不

  同的是名字不對，這個大家跟海關專員在之後都發現了。仔細看劇情，史貝西的故事從一

  堆警察、檢察官到警察局長、FBI跟海關專員都在聽，細節稍有差池早就被繼續拘留了，

  州長再來講可能也無用。


  而大家講的其實也沒錯，他大概是世界上最高明的說謊者，只是他講的是那種非常接近真

  實的謊，也就是幾乎都是真的，細節也是真的，只有在別人不知道但是他知道的地方講假

  的，如果他自己暴露出來那就會追查到他的真實身份。因此五人組被聚在一起是真的，搶

  劫警車是真的，到洛杉磯避風頭是真的，律師出來恐嚇他們是真的，攻船當然也是真的。

  至於說服基頓入伙的真的是馬努嗎？不是，我們看到去他家被打是跛子；匈牙利人殺他全

  家的事情上真的嗎？無人得知，我們只知道第一個認出匈牙利語的是跛子；律師威脅五人

  組的事情是真的嗎？只有四個人是真的，跛子的往事太細微了沒人記得。


  攻船的事同樣有真有假，假的當然是他們讓跛子殿後三人殺進去，而真實是他在背後把三

  人慢慢收拾(可惜留下一個活口)。至於說跛子從頭到尾都在說謊，那也太小看那群偷聽的

  傢伙了。


  --'
