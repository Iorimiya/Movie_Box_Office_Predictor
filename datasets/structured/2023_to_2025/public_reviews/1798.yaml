title: '[討論] Apple TV 特價 驚爆點/龍兄鼠弟/終極天將'
content: '【2024/08/20 Apple TV 特價報】

  驚爆點／深夜加油站遇見蘇格拉底／愛在心裡怎知道／垃圾頭／衝出康普頓／良種動物／

  龍兄鼠弟

  －

  今天的片單整理大量的$90遺珠給大家，首先推薦的是基努李維的成名之作，經典動作電

  影《驚爆點》。還有勵志劇情片《深夜加油站遇見蘇格拉底》也在特價之列，已經特價一

  陣子了，建議大家趕緊把握。喜歡奇幻冒險的朋友不容錯過的還有4K的《終極天將》，這

  部1988年的老片改變知名童書，描述了孟喬森男爵的各種奇遇，童趣的橋段相信會讓不少

  影迷會心一笑。

  －

  環球特價的部分則有不少4K作品入列，巨石強森早期主演的《毀滅戰士》應該算是粉絲必

  收的一部了，還有嘻哈迷一定要朝聖過的N.W.A傳記片《衝出康普頓》與安雅泰勒喬伊主

  演的《良種動物》都非常值得收藏。阿諾史瓦辛格和丹尼德維托共演的《龍兄鼠弟》也是

  歷久不衰的話題之作，一樣是特價好一陣子了，想收藏的別猶豫太久囉。

  －

  以上，祝大家看片愉快！

  －

