title: '[討論] 快一秒的他之外 宮藤官九郎其他作品推薦'
content: '身為宮藤官九郎頭號鐵粉的我

  當初北影沒搶到快一秒的他首映的票真的快嘔死

  還好台灣有片商進

  我本人上映第一天就衝了


  果然是從畫面到台詞都超級日本！XD

  整個改編就是很標準宮藤官九郎（？

  總會能邊看他的作品邊對日本更了解呢

  像是經典的虎與龍 就加入了”落語”這個文化背景

  快一秒的他則是整部都在京都拍攝之外

  還在本裡面加入了很多日本元素 讓整個改編更符合日本當地觀眾口味

  如果跟我一樣愛日本文化的人應該都會會心一笑～


  像是故事都圍繞著京都的知名景點天橋立 超級～美～


  還有男主妹妹&妹妹男友都是109辣妹（？

  還有故事發生的當天剛好是花火節等等...

  就不爆雷了！大家可以自己去看XD

  那既然有笑有淚的劇人人都愛

  接下來就推薦3部我覺得必看的 宮藤編劇作品給大家！


  1.地獄哪有這麼嗨


  超獵奇！超搖滾！的純愛系（？電影

  劇情主要是在講因為遊覽車車禍意外身亡的年輕主角，

  為了想對同學告白，挑戰重返人間的故事！

  標準的笑中帶淚 好好笑又好好哭的一部


  2.寬鬆世代又怎樣


  這部雖然原本是劇集 但10月會有電影版上映（不知道台灣會不會進！

  這真的可以說是我最喜歡的一部日劇

  （by the way 也是岡田將生主演的喔！）

  寬鬆世代指的是有點像最近流行的”躺平主義”

  就是年輕人不想努力只想耍廢的狀態

  非常社會寫實 很適合像我這種剛出社會沒多久的人看哈哈哈哈哈哈

  會默默地被點醒很多事


  3.我家的故事


  這部應該可以算入坑宮藤必看的！（新手向XD

  超好笑又超好懂的劇情

  看完真的會深深思考家庭的意義

  一樣有融合日本文化元素「能劇」

  是一種日本特有的戴著面具唱歌起舞的表演

  宮藤把西方的摔角文化和能劇做了很好的融合

  最後的結局也是讓人大吃一驚 意想不到


  最後再回來小分享一下

  快一秒的他整體跟台灣原版一樣都是笑中帶淚

  不同的是比起陳玉勳導演特有的魔幻寫實

  （蜥蜴先生這段被拿掉好可惜！）

  日版加入了很多解釋性對白 讓整個故事更有邏輯

  而且很多笑點都很漫才梗（好多吐槽哈哈哈哈哈哈）

  清水健飾演的妹妹男友也是有夠搶戲我愛死


  但最讚的當然還是岡田將生了！

  覺得他完全演出日本男生版大霈在我心中想像的樣子


  岡田本人給人的感覺是很內斂安靜的

  但是這個角色又很活潑很鏘

  這個反差真的有夠讚<3

  推薦大家都去戲院笑一笑哭一哭 有益身心健康～（？



  --

  09/03 21:52'
