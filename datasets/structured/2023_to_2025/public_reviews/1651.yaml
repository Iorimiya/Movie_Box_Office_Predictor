url: https://www.ptt.cc/bbs/movie/M.1693654034.A.9F5.html
title: '[好雷] 《快一秒的他》 '
content: '雷文防雷資訊頁


  快一秒的他 日文推特(X)：





  從日本準備翻拍這部時就相當期待，


  所以當台灣上映這部時，便馬上去看~~


  以下有雷

  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~






















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  劇情走向跟《消失的情人節》差異不大，



  有差異的像是男女主角性轉、地點從台灣變成京都


  果耶飾演的角色從公車司機變為大學生(公車司機由其他人飾演)，


  詐騙方從跳舞男老師變成街頭女藝人、時停那天還能動的多了公車司機等等




  如原版的聖地巡禮一樣，電影中的場景也有滿多值得去實地考察的地方




  另外和原版不同的是，這部女主角對男方像是童年玩伴般的關心。


  最終男女主角在童年約定的郵局地點相遇，並相視而笑，迎來最棒的結局。



  另外這部電影的主題曲為幾田りら的「P.S.」


  其MV有著電影沒有的珍貴畫面




  女主角童年一跛一跛的樣子，可以對應到電影最後女主角一跛一跛的樣子


  除此之外還有兩人童年在醫院的許多互動劇情。


  建議看完電影後再看這支MV會更有感觸。






























  --'
