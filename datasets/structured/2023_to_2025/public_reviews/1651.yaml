url: https://www.ptt.cc/bbs/movie/M.1692627406.A.9DD.html
title: '[新聞] 《快一秒的他》重頭戲有絕配 盡顯京都復古美'
content: "《快一秒的他》重頭戲有絕配 盡顯京都復古美\n\n2023/08/21 05:30\n\n\n岡田將生（右）、清原果耶在《快一秒的他》演出「快男慢女」CP。（甲上提供）\n\
  \n〔記者鍾志均／台北報導〕日本愛情電影《快一秒的他》改編自陳玉勳執導的台片《消失\n的情人節》，集結岡田將生、清原果耶飾演「快男慢女」CP，設定角色性別翻轉，並將舞\n\
  台搬至古城京都，片中人文風景極具特色。\n\n編劇宮藤官九郎透露，原作《消失的情人節》一場公車開到海邊的重頭戲，因京都著名景\n點「天橋立」完美符合該場景條件，因此劇組確定前往京都拍攝，將美景盡收眼底。\n\
  \n\n《快一秒的他》至京都取景，呈現濃厚復古元素。（翻攝自推特）\n\n日前宮藤官九郎來台和陳玉勳對談，忍不住向他「表白」：「我沒有看過這樣的喜劇，很\n驚訝台灣竟然有這樣的電影！」\n\
  \n導演山下敦弘則形容電影籌備過程像在拆解一道難題，再加入自己的原創性，表示：「主\n角在親情和家庭的部分改編最多，日版後半段能看到加入許多親情的比重。」《快一秒的\n\
  他》9月1日全台上映。\n\n--\n佛教經典的\n是 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
