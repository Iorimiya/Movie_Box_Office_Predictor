url: https://www.ptt.cc/bbs/movie/M.1693565674.A.56C.html
title: '[微好雷]《快一秒的他》，你要好好愛自己，因갠'
content: '部落格版：


  導演陳玉勳於2020年推出的作品《消失的情人節》，在當年金馬獎上大放異彩，不僅獲得

  十一項大獎提名，其中包括讓男、女主角劉冠廷與李霈瑜雙雙獲得首次的男、女主角提名

  ，最終在典禮當晚五項大獎入袋成為最大贏家，導演陳玉勳更是奪下人生首座金馬獎最佳

  導演肯定，其所寫下的這部電影同樣得到最佳原著劇本殊榮。而時隔兩年，由導演山下敦

  弘執導、宮藤官九郎擔任編劇、岡田將生及清原果耶擔主演的日版《快一秒的他》先在今

  年台北電影節上星光首映，後於本週正式在台上映。


  在觀賞完《快一秒的他》後，回家再重新溫習了一遍《消失的情人節》，試著想要為兩部

  作品進行比較，發現日版的故事情節與台版幾乎無異，最大不同、同時也是多少能夠降低

  台版後段最為人詬病的恐怖情人疑慮的設定，就是將角色性別翻轉，台版原來感覺消失一

  天的是女主角曉淇，在日版裡為此困惑的則是男主角皇一。


  這項設定上的更動我認為相當聰明，至少某方面來看確實讓《快一秒的他》比《消失的情

  人節》討喜不少，先姑且不論觀眾因角色性別上而對其動機與後續動作所感受到的不舒服

  感，日本演員向來浮誇的演技被運用在這裡意外成了加分項，原來台版中李霈瑜飾演的曉

  淇轉由岡田將生來詮釋，讓皇一這個角色因語調浮誇、表情浮誇、動作浮誇而比曉淇更具

  喜感，而性別印象亦連帶使得這個角色多了嬌羞與可愛，那種反差萌讓觀眾基本上很難不

  去喜歡皇一。


  至於女主角清原果耶飾演的麗華由於角色設定，她或許是整部電影最不浮誇的角色，比起

  其他人她更多是用表情來表現她的情緒與反應，只是相對於岡田將生比李霈瑜「多」，清

  原果耶反而「少」了劉冠廷的憨傻與羞澀，也就是較沒有角色魅力。除了不同於台灣演員

  的表演方式與節奏，故事場景從台灣嘉義移到日本京都，濃郁的古都氣息確實讓《快一秒

  的他》比《消失的情人節》再多了恰好的怡人氛圍。



  回到劇情上來看，《快一秒的他》其實就是將《消失的情人節》故事照搬過來，主要的改

  動就是上面提到過的角色性別翻轉，其他小地方則像是原版中的阿泰本就是公車司機，最

  後也是他自己在暫停的世界裡開著公車載著曉淇前往嘉義東石，但在日版中的麗華是喜愛

  攝影的大學攝影社社員，載她與皇一去到天橋立的是日版新創角色、同樣和麗華慢一拍的

  公車司機。在台版的故事裡，阿泰載著曉淇前往東石的路上，說著他的童年遭遇和兩人在

  醫院的邂逅，而來日版裡不再是單方面的傾訴，公車司機成了麗華心事與告白的傾聽者，

  偶爾的回應讓電影有了對話感。


  可是雖然這個角色的安排是後半段的一個小亮點，但與之相對的是日版刪去了替台版本就

  奇幻的情節更添魔幻的壁虎伯角色，這是我認為最可惜被改掉的地方。幾乎同個時間登場

  的，是皇一不告而別的父親，他在公車上與麗華分享著自己當年為何離家，以及這幾年下

  來的心境變化，看似很莫名的展開也都多虧了前半段皇一在廣播節目上聊著愛人與被愛、

  聊著最近喜歡上的女孩還有離家多年的父親，長期陪伴下來讓觀眾對皇一理解了他對父親

  的情感，於是當聽著皇一父親一番告白自然是有了更深的感觸。


  不論是台版還是日版，其實觀眾都能感同身受麗華和阿泰的心情，在同樣不管他們在時間

  暫停後做的事情的話。麗華和阿泰始終惦記著小時候的通信約定，即使對方早已不記得了

  ，觀眾聽著他們說著這段往事，感受著他們對這段緣份失而復得的欣喜與感動，和台版男

  方對女生的暗戀不同，日版反而更像是妹妹對哥哥的情感，這點差異性也是我認為日版會

  比較沒有爭議的關鍵，也讓我比起曉淇更能認同皇一在得知與麗華的淵源之後，他的後續

  動作與心境轉折。


  雖然跟台版同樣的，皇一不像麗華記得小時候的事情，他不記得麗華這個人也不記得通信

  約定，所以對他來說麗華是個在郵局認識的女生，就算他後來想起了「原來他早就認識麗

  華」也無法彌補他中間這段沒有和女方有再多認識的空白，因此在這「消失的一天」之後

  重新憶起了麗華，以及知道她為自己做的事情要說有多感動不太可能，可對於父親離開他

  們的皇一來說，他這幾年與母親都在等待著父親回來的心情，不也就是麗華多年來對於他

  這個離開的哥哥的心情？或許正因為如此，才讓他能對她產生共情，對緣分的珍視與珍惜

  用不同於台版的解讀「你要好好愛自己，因為有人愛著你。」這段話的感動，跟著讓皇一

  後來的尋找與轉調分局的等待變得更為合理化。



  散場後，和朋友討論最多的還是電影裡頭對時間的解釋，這大概是在《消失的情人節》被

  我忽略的問題，在《快一秒的他》重新想起。電影雖然有明確解釋麗華為何會「獲得」一

  整天的原因，是她多年下來就少一拍的累積後的歸還，但卻無法說明為什麼她會和公車司

  機還有皇一父親「同時」獲得這被歸還的一天？基本上怎麼想他們三人的年紀就不同，既

  然年紀不同那麼也就表示慢一拍的時間累積的量就是不同，為何他們會在同個一天獲得這

  一天？而據皇一父親說這是他第二次遇到這種情況，第一次就是離開家的那一年，那麼問

  題就來了，十幾年前是第一次，十幾年後是第二次，可以說是十幾年的時間能累積成一天

  還給皇一父親，真要是這樣至少五、六十歲的他怎麼會只經歷過兩次？這是觀賞完《快一

  秒的他》後最讓我想不通的部分。


  即便我對電影裡就時間解釋上的邏輯不太理解，刪去壁虎伯的魔幻橋段也稍微可惜，但整

  體來說《快一秒的他》還是略勝《消失的情人節》的，能夠在保有台版優點的基礎上多增

  加屬於日版的特色，並且將台版缺點適度修正，光是角色性別翻轉這點就成功加到分，就

  親情的描寫上亦更深刻，比起台版中阿泰僅幫曉淇與她父親合照，我更喜歡宮藤官九郎讓

  皇一父親能與妻子重聚的編寫，母親與妹妹角色戲份上的增加也是。此外，電影的色調是

  溫煦的日系暖色調，對京都這個城市的介紹還有對京都人的性格與日常之呈現，再加上與

  歌曲的搭配，都讓《快一秒的他》成為一部很有日本風味的作品，是相當成功的改編。


  記得當時看完《消失的情人節》後跟朋友找了一天去到嘉義東石白水湖壽島，這次看完《

  快一秒的他》也讓我很有衝動想買機票飛往京都，去親眼看看被譽為日本三景之一的「丹

  後之天橋立」有多美，這是我覺得電影成功的地方，因為它確實引起了觀眾在電影之後的

  興趣，真心會將下次到京都旅遊時把天橋立放入行程裡，然後揹著電影裡清原果耶總是不

  離身的底片相機，拍下那條猶如往天上斜伸而上的橋樑的長條沙洲。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
