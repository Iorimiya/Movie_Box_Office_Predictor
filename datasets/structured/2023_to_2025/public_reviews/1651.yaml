title: '[ 好雷] 快一秒的他'
content: '昨天兩場電影


  <渴水>跟<快一秒的他>


  快一秒的他有趣很多


  場景在京都


  市區的景點比較少


  反而較遠的宇治跟宮津（天橋立 伊根）推動劇情前進


  然後龜岡（嵐山）躺著中槍



  有雷注意









  標題詐欺


  真正的劇情發生在比別人慢一拍的角色


  神明會把時間還給他們 很隨便的設定




  劇情翻轉真的很好笑


  回顧消失那一天發生 一家合照又覺得很溫馨


  不過京都地區的捏他太深


  一般人會比較難理解




  看完好想再去天橋立跟伊根


  為什麼劇中可以拍這麼漂亮


  我去都會陰天







  幾個疑問


  1. 所以櫻子借40萬 真的有需求嗎？ 還是詐騙？


  2. 皇一從洛中到天橋立 再從宇治天橋立來回 為什麼天色還是亮的


  3. 洛中真的會歧視洛外的人嗎？


