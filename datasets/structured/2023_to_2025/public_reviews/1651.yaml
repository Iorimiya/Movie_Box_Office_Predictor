url: https://www.ptt.cc/bbs/movie/M.1685512343.A.237.html
title: '[新聞] 《快一秒的他》改編自國片台北電影節放映'
content: "非原標\n\n《快一秒的他》導演編劇男主角來台　參加台北電影節首映\n\n新聞網址：\n\n\n日片《快一秒的他》，翻拍2020年台灣電影《消失的情人節》，台北電影節邀請導演山下\n\
  敦弘、編劇宮藤官九郎及男主角岡田將生，進行6月23日中山堂放映，舉行全台首映。\n\n\n\n《快一秒的他》由男星岡田將生、女星清原果耶，分別飾演動作一快一慢的男女，承襲原\n\
  作描繪兩人在消失的一天所經歷的奇幻愛戀，且故事舞台搬至古城京都，以輕快復古元素\n引爆浪漫氛圍。導演山下敦弘2019年曾擔任台北電影節的國際新導演競賽決選評審，他表\n\
  示：「非常榮幸今年能帶新作參與台北電影節，更記得當初看完《消失的情人節》馬上想\n著『好想去台灣啊！』，假如台灣觀眾看完《快一秒的他》後冒出『好想去京都啊！』的\n\
  想法，我一定會非常開心。」\n\n此外文化部影視及流行音樂產業局主辦、台北電影節執行的「2023國際提案一對一工作坊\n產業課程」也將邀陳玉勳、導演山下敦弘與編劇宮藤官九郎同台開課，暢聊文本改編。該\n\
  工作坊今年講師還包括朱鎮安、楊鎧宇、郝柏翔、賴逸芳、余修善、傅慧齡、傑森葛雷（\nJason Gray）、潘燈貽（Dang Di Phan）等海內外電影專業人士，課程6月23日到6月25日\n\
  為期3天在中山堂光復廳進行。\n\n今年台北電影節放映作品多元，網羅各國影人佳作，《她和他的女兒》（Other People's\n Children）、《一個人的朝聖》（The\
  \ Unlikely Pilgrimage of Harold Fry）、《回不\n去的那座山》（The Eight Mountains）、《我恨我自己》（Sick\
  \ of Myself）、片長長\n達260分鐘的《聽說蘿拉不見了》（Trenque Lauquen）、《世界上最幸福的人》（The Ha\nppiest Man\
  \ in the World）、《熱戀慢慢來》（Slow）、《捎來幸福的紅帆》（Scarlet\n）、《換乘公寓》（A Room of My Own）等。台北電影節從6月22日至7月8日，在臺北市\n\
  中山堂、信義威秀影城、光點華山電影館盛大舉行，票券6月11日在OPENTIX兩廳院文化生\n活正式開賣。\n\n\n--"
