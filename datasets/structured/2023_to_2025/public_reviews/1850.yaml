title: '[好雷] 片場風暴 (world war 3)'
content: '雷文防雷資訊頁











  雷雷雷






  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  片場風暴是一部伊朗的劇情片，


  故事描述一個去片場打工的打工仔，


  意外成為要角，


  最後又因為各種意外身陷風暴之中，


  最後導致一個無比意外的結局。





  劇情我覺得蠻有趣的，雖然略為誇張，


  另外是伊朗演員的演出我覺得都蠻有逼真感，


  故事也蠻容易獲得共鳴。



  個人覺得伊朗拍的電影有不少佳作，


  很擅長編織複雜的劇情，讓觀眾體驗世事的複雜，


  很難簡單劃清是非黑白。


  之前有部 分居風暴，印象就頗深刻，在IMDB上也有不錯的評價。




  片場風暴這部片的結尾也算相當獵奇，不想再爆太多雷。


  有興趣的朋友推薦值得去觀賞一下。





  --


  君問窮通理 漁歌入浦深






  --'
