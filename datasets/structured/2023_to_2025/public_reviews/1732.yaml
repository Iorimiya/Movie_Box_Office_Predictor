url: https://www.ptt.cc/bbs/movie/M.1680894618.A.EAA.html
title: '[普好雷] 《疫起》我們是護士，不是神'
content: '跟考慮要看的你


  原本預想是人性鬥爭的抓馬驚悚片，但沒想到其實更像是沈重現寫實職人電影，更關注底

  層人物視角，醫療題材在台灣電影少見，所以很難形容這部電影類型。

  配樂、美術、攝影、聲音沒話說，轉戰電影圈的薛仕凌戲份不多卻交出很好的成績單，王

  柏杰、曾敬驊也都拿捏得不錯，張永正也讓人印象深刻，可惜劇情過於工整議題不夠深入

  ，沒有把格局做更大，顯得有電視影集的影子。

  ———————————————————————-

  有雷







  電影選擇SARS封院為文本，去展現群像視角，不單單只是展現醫療人員困境，醫護、媒體

  、管理者、局外人、醫病相互交錯，可以看出導演對於角色關係及塑造的野心。原以為這

  題材會有很多的批判，但沒有過度的賣慘和鬥爭，更多是在記錄封院期間故事之中，所有

  小人物的困境無奈和掙扎求生，但也有可能什麼都想要講述一些，導致情感塑造和人性刻

  畫都僅點到表面。

  劇情是以對於職業倦怠在工作和家庭兩難的醫生為主軸，去交代醫院發生不明感染而封院

  的事件，藉此旁敲側擊每個院內人物的關係、動機、視角，情節直觀每個人必須在自保和

  奉獻做出選擇，但要在短短近2小時交代這麼多人物，實在篇幅不夠，所以很標準的狀態

  下收尾尤其可惜。


  不得不說這次演員的挑戰相當的高，電影裡很少有激昂的對手戲能表示角色心境，更多的

  是獨角戲表現出心理狀態。

  王柏杰飾演一個從自私想逃避的的夏正醫生，到後來選擇接受貢獻，這之中要詮釋相當程

  度的猶豫和崩潰複雜情緒，尤其還有眾多技術性的手術戲，表演卻能收能放相當亮眼。曾

  敬驊則飾演正義無私卻有創傷的安泰河護士，呈現極為內斂的黑暗面跟卑微及退讓，實在

  讓人難過可圈可點。

  不過個人最喜歡還是薛仕凌飾演看似不擇手段實為願意身處一線追求事實的記者，做到能

  讓觀眾從負面變成正面印象實在驚人，能塑造一個兼具自私與無私關係的立體角色，尤其

  是一場電話戲足以讓他有機會提名今年男配角。

  此外雖然戲分極少的張永正飾演憨厚老實的計程車司機也印象深刻，更顯現沉重黑暗的氛

  圍有了人性的光輝，項婕如飾演對於正義吶喊的醫生學妹可看出她的進步，只是覺得愛情

  橋段在對於電影的調性顯得格格不入。


  而這次終於從電視圈回到電影拍攝的導演林君陽，整體有好也有壞，相比愛的麵包魂還是

  成熟不少，有些大場面還是調度不錯，也有令人印象不錯的鏡頭，像是運用沈重的呼吸通

  往B棟那人間煉獄的沉重氛圍卻巧妙地展現護理師的光芒，以及拼命急救和在隔離病房外

  大喊的女兒，這極為深沉直擊內心的拍法相當有趣。只是如果導演不這麼貪心，要用交叉

  手法交代那麼多群像議題，在更聚焦於影像故事，或許可以更好。


  我個人蠻喜歡電影中用了許多磅礡的音樂，卻絲毫不感到疲憊，也襯托許多角色心境。還

  有那些以假亂真的血肉跟地獄般的隔離病房，為恐懼沉重的電影定調，而且還要還原20年

  前的醫院設備、手機、電視相當多困難的細節，整體電影的技術項紮實也相互配合。


  --'
