url: https://www.ptt.cc/bbs/movie/M.1682393710.A.6C2.html
title: '[雷]《疫起》剛看完覺得還行 但越想越不對勁'
content: '~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  先說我最喜歡本片的是配樂

  看片尾字卡知道是盧律銘時

  內心想法是"喔喔~~ 難怪"


  接下來直接說我覺得有問題的地方

  1.曾項感情線是在哈囉???

  劇組訪問我看了不少

  導演有說明不拍政治人物及著重醫院高層是為了避免失焦

  劇情歪掉變成控訴、批鬥大會(大意如此)

  要把電影聚焦在醫護


  阿請問安泰河是921遺族的設定對本片有何作用??

  他想加入無國界醫生對劇情的幫助是??

  曾項感情線對本片就沒失焦?就不歪掉?


  2.李心妍情緒勒索控訴罷工醫護

  這點我在臉書上看到有人在吵

  至今也沒有看到導演令人滿意的解釋

  我覺得創作者最好不要用我拍的時候沒有那個意圖來辯解

  因為觀眾看到電影就是這樣演

  內心就是覺得李心妍在情勒

  就算拍者無心，但觀者有意

  如果導演真沒有那個意圖

  那只能說林君陽你的技術未達標


  A想對B說話安撫

  B卻覺得A句句機鋒、冷嘲熱諷

  這代表要嘛A是故意假好心

  要嘛是A不懂的說話的藝術

  這道理套在這部電影一樣成立

  到底是哪一種?

  林君陽你自己選一個吧


  特別是最終李雪飾演的罷工醫護領導人竟然回到了岡位上

  前面項婕如在情勒控訴時

  她明明還說不能認輸

  然後也沒有多拍她幾顆心境轉折的鏡頭

  就真的認輸回去工作


  把李雪當作反派的處理方式

  真的很糟糕


  3.夏正染疫

  夏正在電影末段良心發現

  放棄優先撤離醫院的資格主動幫染疫病患開刀

  這段對於他的心境變化有足夠的描繪

  所以沒有問題可挑剔的


  但是又突然一個轉折

  原來夏正在電影開始尚未封院時

  就已經接觸到染疫者

  這點對於夏正從一個只想閃躲飄的利己醫生

  轉化成一個願意犧牲奉獻的大愛醫生來說

  實屬多餘

  而且反倒產生另一個疑問

  那就是林君陽你個人立場是贊成封院的嗎?

  想想要是沒封院

  夏正直接離開醫院幫女兒慶生

  不就有機會把病毒傳播給他女兒、擴散到社會中??

  導演是單純想在電影末段塞爆點而沒意識到這點??


  其他還有幾點比較小的

  例如導演受訪時說原本劇本主線有七八條

  最後是刪成兩條主線

  但我覺得還是刪不夠乾淨

  例如護理長的女兒

  她ICU門前那段劇情是很煽情啦

  但我只覺得她好吵

  就已經跟你說了你媽生病了

  你還在那邊"我要找媽媽"

  死屁孩耶


  為何不把一條主線設置在染疫區的B棟?

  明明B棟是染疫風險最高

  醫護罷工更激烈的場景

  要是我會在一開始就把安泰河那條線直接設定在B棟


  最後好奇為何要把醫院改名成北台聯合醫院?

  明明經歷過那個年代的人都知道是台北市立和平醫院

  改名後反倒讓我很出戲

  到底不改名是會被告還是怎樣嗎?

  何時台灣影視作品在改編真實事件時

  能停止架空改名的行為?


  --

  我表述錯誤

  應該是如果一開始沒封院

  染疫的夏正直接就回家幫女兒慶生的話

  這大概就是國片現在是三大影展絕緣體的原因吧

  創作者心中都有小警總

  自我審查喔

  比《幻術》這種明目張膽

  直呼政治人物其名的架空創作都不如

  就是李雪阿

  還有她不是阿長

  只是學姊吧

  我當然知道真實世界的罷工護理人員他們不是反派

  問題是電影的設置讓他們成為反派

  先是疑神疑鬼排擠泰河

  接著罷工

  然後安排陳家逵的父親上吊來不及急救

  項捷如救人失敗拍門情勒控訴他們不是好醫護

  這一連串的設置就是把他們當反派塑造

  所以我說林君陽假如真沒有這個意圖

  但是他拍出來會讓觀眾如此感受

  那也是他導演技術不達標

  那導演就不要讓泰河被如此赤裸的趕去B棟阿

  大可以安排泰河上廁所時聽到同事談論懷疑他有染疫

  覺得心理不安都不太敢靠近泰河

  然後泰河聖光發作決定自己去B棟


  也可以安排一場戲例如李雪跟家人對話

  媽媽要李雪好好保護自己

  李雪才因此鼓動罷工


  項婕如控訴他們罷工是不良醫護時

  李雪開門跟她對嗆

  "我家只靠我在賺錢，我死了你要幫忙養我媽嗎?

  沒良心的不是罷工的我們，而是沒有配套隨便封院的高層"

  而不是項婕如單方面輸出


  導演這樣拍就不會讓人覺得罷工醫護是反派

  有誰說一定要有反派嗎?

  "販賣眼淚"這真的是在稱讚嗎??

  為何政治批判就會俗氣?

  談情說愛就不俗氣?'
