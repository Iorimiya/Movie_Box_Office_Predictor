title: '[負雷] 疫起'
content: "雷文防雷資訊頁\n\n\n\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\
  身為現職醫護\n一開始電影要上映前我超級期待\n但後來因為工作忙沒去電影院\n上了Netflix立刻點開看\n看完卻覺得沮喪\n\n我有先看過版上的心得還有新聞\n\
  我很喜歡和平歸來\n但我知道這兩部不能直接比較\n時長不同 能拍的內容量就差很多\n所以每一個故事或人設都很蜻蜓點水\n我就當成是因為篇幅不夠造成的遺憾\n\n\
  只是我真心覺得劇本太灑狗血了\n可能看在大眾眼中覺得好感人、好熱血\n但很多地方不符合臨床上的邏輯\n真的就是加很多調味料在一塊沒有肉的炸雞上\n\n已經在封院了還讓一個小女孩一路跑進醫院\n\
  而且還能想跑去B棟就去B棟\n看在愛喝雞湯的人眼中會覺得妹妹為了媽媽跑進去真的好感人\n但其實在現實世界這種事不可能發生\n所以對我來說就是為了讓人感動硬安插進去的episode\n\
  \n有人說夏醫師最後有洗白\n我是覺得還是灰灰的沒有到很白啦\n因為沒有演出來的心境轉變\n很有可以探討的空間\n\n除此之外還有一些醫療上的bug也讓我很出戲\n\
  （到底為什麼不能找一下醫療顧問啊我的天）\n\n最讓我沮喪的點\n就是那個女醫師跟男護師\n\n首先\n男護師人設：921受災戶>大愛的所有者>想參加MSF\n\
  其實不管抽掉哪一塊都不影響劇情推進\n他在劇中跟病人家屬談話那邊\n不需要是921受災戶也可以說得出來\n離開醫院後想跟女友去做什麼事都行\n硬要加上MSF會讓我覺得他想塑造醫護人員大愛的形象\n\
  \n其實導演應該要描寫的不是醫護人員有多偉大\n擁有無上的使命感、願意為世間所有人犧牲奉獻的護理師\n除了南丁格爾之外真的沒有那麼多\n對其他人來說\n其實這就是一份工作\n\
  在遇到新興傳染病的時候我們也會害怕\n但是這是我們的工作\n我們會害怕 可是我們還是要做好我們該做的事\n才能抵擋住前面的挑戰 保護後面的國人\n過程中我們遇到的實際的困難跟心理上的困難\n\
  民眾的恐慌、給醫療人員的壓力、我們遇到的歧視\n甚至可能是來自我們自己人的歧視(i.e.男護師支援過B棟被擠走)\n這些才是應該描述出來的\n\n還有夏醫師送便當時看到有人跌倒\n\
  那人叫他不要過去 還比了個讚\n或是男護師拖著病體去CPCR那邊\n認真覺得太狗血@@\"\n\n再加上後來女醫師去拍門講那些冠冕堂皇的話\n我看完只覺得他在道德勒索\n\
  \n「醫療人員你們真的辛苦了！」\n「但你們就是應該犧牲奉獻、做功德！」\n「罷工？怎麼可以這麼不道德？」\n\n我們也是人 是人就會怕\n更何況是當初那個沒有任何前例可循的時代\n\
  用罷工這種橋段並不能彰顯困在那裡的糾結\n或任何辛苦\n\n--\n [10/10/2008 13:45:02]\nTO XiahJunsu: ......找死嗎??\
  \ = = [10/10/2008 13:45:34]\n [10/10/2008 13:46:09]\nTO HeroJejung: ..............想被掰脊椎嗎??\
  \ =.= [10/10/2008 13:46:23]\n [10/10/2008 13:51:17]\nTO UknowYunho: ........................(崩潰)\
  \ [10/10/2008 13:51:26]\n\n--\n\n我跟同事都覺得好險當初太忙沒空去@@\"\n現在串流看一下就好\n\n不過我有看人選之人跟與惡\n\
  我對人選之人的職業內容不熟\n不知道會不會一樣有「圈內人看漏洞百出、圈外人看痛哭流涕」的問題\n\n\n抱歉讓你生氣了\n我本來下的標題是微負雷\n但因為怕其實不喜歡的點很多會被人家說幹嘛假中立加個「微」才刪掉\n\
  可是就算北影獲獎\n也不代表別人不能對這部片有不同觀點呀\n\n而且我去查了一下\n疫起得獎的是導演、男主角、視覺效果、美術設計、還有傑出設計耶\n畫面很美 可是這個劇情我實在母湯\n\
  \n還有就是你提到的Netflix進榜\n頂多代表很多人把他點開來看完\n我也是對這部片很有興趣 把他點開看\n之後卻發現很失望\n那我貢獻的這次觀看次數又代表什麼呢??\n\
  \n要寫全國人民記憶點那麼強的重大事件\n花了那麼多錢\n還找了很不錯的演員\n而且我覺得畫面也拍得不錯\n只是這樣的敘事真的可惜了\n\n\n謝謝你的告知\n\
  我看到你的回覆才知道原來編劇也是護理出身\n但看了他的Linkedin我蠻意外的\n他好像近年還有在執業\n結果電影一開頭(10分鐘不到)就寫出插完尿管後轉身幫隔壁床削蘋果的劇情\n\
  即便是SARS還沒發生的時候\n護理學生都知道做無菌技術前後要消毒性洗手\n而且戴手套不等於不用洗手\n看著那個阿伯抗拒的表情\n是我我也不敢吃那顆蘋果XDDDDD\n\
  也讓我更相信許多不合理的劇情只是為了堆疊感人氣氛\n\n\n真的!!!!憑什麼!!!!!\n如果要給女醫師1分40秒在走廊大聲說教\n就不該只給罷工那群人一句「他是激將法！出去就輸了！」的時間\n\
  \n\n我看著拿拒馬的警衛「看著」小女孩往裡面走超傻眼\n\n\n我看到謝盈萱的臉很開心\n結果他讓我印象最深刻的就是打電話跟吃便當\n我流淚\n\n\n哈哈哈哈哈\
  \ 那邊他貼上lead先是心跳停止\n先壓胸之後接上電擊器變VF開始電擊我還算可以接受\n但是確診者在CPCR\n再怎麼人手不夠\n接上電擊器後第二人只是站著握住推車把手我不行XDDD\n\
  男護師拿針去戳免針式bag我更不行~~~\n\n\n小女孩一個人在ICU外\n有口罩可以替換卻沒有人把他帶走也很不合理\n不過如果他被帶走就不能演後面的催淚戲了\n\
  \n\n別生氣啊 T^T\n我只是寫寫自己的心得啦\n\n\n完全同意!!!!!\n一想到送便當的前路都暗咪摸\n結果小女孩跟老阿伯就這樣突破了\n我真的無語\n\
  \n\n其實我不反對把重大災難事件拍成文藝愛情片\n但不要打著前者的旗 偷渡小情侶上班談戀愛\n還在討論室偷親親!!!!!!????\n連主治醫師級都會選在樓梯間了\n\
  真的不怕死耶~~\n\n\n沒錯!!!我也是這樣想!!!!!!\n實際經歷過COVID-19後我更同意你的說法\n那個女醫師只有一句說對了「病毒可怕、我也怕」\n\
  其他的情勒台詞大可不必\n\n\n是真的蠻促咪的XDDDDD\n穿上兔寶寶急救後連一般講話跟活動都吃力了\n那個護理師真的很活潑熱情XDDDD\n\n\n還是可以看一下啦～看看不同的呈現方式啊！\n\
  \n\n你是在說我公審嗎T^T\n我沒有啊~~~>\"<\n\n然後看到大家的推文\n只希望大家不要因為這部電影的部分內容被影響\n特別是非醫護的民眾\n我們也是一般人\
  \ 不是聖人\n你給我足夠的裝備我就能為你們打仗\n你給我足夠的資訊我就能更有信心\n\n這幾年的COVID-19\n我們遇到確診或是一開始遇到疑似個案也很人心惶惶的時候\n\
  大家都覺得只要物料充足 做好感染控制\n殺進負壓隔離房也不是太可怕\n\n但SARS那時候並不是這樣的時空背景\n真的不應該對那群掛白布或是罷工的人\n用這樣的方式指責他們"
