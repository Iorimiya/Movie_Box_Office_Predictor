url: https://www.ptt.cc/bbs/movie/M.1682255101.A.9A3.html
title: '[微好無雷]疫起 感性有餘而深入不足 '
content: '整體來說不算難看



  從角色設計、結合史實到劇情鋪陳、演出、口條都有不錯的表現，不會有讓人覺得煩悶or出戲的地方



  在武肺疫情過後的今日看起來略有番奇妙趣味



  尤其真實的手術房與醫院濺血等各種場面，感覺得到用心。



  會怕濺血手術場面的人最好得斟酌下




  but



  也如同標題寫的一般，其實會總覺得欠缺了些什麼


  應該經歷過那段時期的大部分人都知道，封院事件更多的問題其實與政治決策與有關


  但劇中卻極少去處理這部分，讓溫情與感性戲碼比例遠大於那樣的社會背景


  少了這樣的磨合，難免讓許多劇情角色如記者、護理長、院長等人的行事動機


  變得不明，甚至讓整部變得過於流於濫情


  太輕易的導向:醫護救人天經地義 的聖光走向，遮蓋了其他議題，覺得是有點可惜的。


  順便吐槽下小女孩的戲分實在有點太扯XD


  因為我媽是醫護所以我以前也是這樣在醫院晃，為不暴雷就不多說但


  真的表現的太浮誇了


  -------------

  補個SARS的題外話


  我媽事後才跟我說當年SARS期間，醫院回家後機車被害怕的鄰居潑了漂白水


  人心的恐懼有時是很恐怖的


  武肺時到不敢潑了，可能因為當年幾隻幼崽都長成大熊了


  雖然他們還是會蠢到拿整桶沒稀釋過的漂白水拖樓梯間= =



  --'
