url: https://www.ptt.cc/bbs/movie/M.1676005966.A.C41.html
title: '[新聞] 不知名病毒各大醫院爆發！《疫起》首創共'
content: '記者許世穎

  不知名病毒各大醫院爆發！《疫起》首創共感式衝擊震撼


  全台首部共感式衝擊震撼電影《疫起》，由打造，今（10）日釋出前導預告與海報，該片集合包括及特別演出的金馬獎最佳女主角等超強陣容一同飆

  戲，描述被病毒壟罩而受困在醫院的所有人，即使身陷擴散的恐懼中，也必須勇敢面對自

  己的不敢面對。


  飾演胸腔科醫師夏正的王柏傑是片中將每一個角色串聯起來的核心人物，他表示：「這部

  電影的每個角色都充滿故事。」開拍前他透過實地到醫院實習，深入觀察醫生這個職業的

  真實面貌，看到許多堅守信念的醫師，感動之餘也將這份感動化為表演的一部分，傳遞給

  大銀幕前的所有觀眾。


  曾入圍金馬獎最佳新演員的曾敬驊則飾演懷抱滿腔熱血的醫護人員，他說：「因為這部電

  影，讓我更欽佩所有的醫護人員，有他們的犧牲與付出，才有今天的大家，也希望觀眾看

  到我不同以往的演出。」


  與曾敬驊有精彩對手戲的項婕如在片中身在危險風暴，挺身而出對抗未知的病毒，並且堅

  守到最後一刻，她說：「相信觀眾可以透過這部電影，理解那些別人的無能為力，以及同

  理每個人的困難處境。」金鐘戲王薛仕凌飾演為調查病毒真相，不惜捲入封院風暴的記者

  ，直說：「我的使命，是將真相抽絲剝繭為社會大眾報導事實，戰場上每個人都有自己的

  位置，觀眾可以透過《疫起》這部電影，反思若是你身陷其中，會做出什麼選擇？」


  導演林君陽表示：「我希望大家可以一起進電影院支持《疫起》，重拾你對未來的期待，

  雖然我們都回不到過去，但永遠要相信明天！」監製李耀華也感性地說：「希望《疫起》

  能帶給大家希望的曙光，以及在生死面前我們都必須勇敢的意念！」《疫起》將於4月14

  日在台上映。


  ==


  【疫起】Eye of the Storm 前導預告








  --'
