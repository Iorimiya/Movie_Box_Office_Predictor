url: https://www.ptt.cc/bbs/movie/M.1680889218.A.F25.html
title: '[好雷]疫起-謝謝有你一起對抗疫起'
content: '搭配青峰演唱的主題曲




  因為疫起 我們一起



  因為機緣拿到了首映會的票，因為是本身是敬驊粉絲，所以自帶濾鏡給極好雷，

  故事原型是大家都不陌生的SARS和平醫院，經歷過SARS時代的我們，

  當時從電視新聞之中看到的畫面都不陌生，

  而近年的Covid-19，又讓人不禁回想起當年的情景，

  過了將近二十年後的今天，我們是否有足夠的勇氣與智慧去對抗病毒？

  　

  　

  導演林君陽，從我們與惡的距離就可以看出，很會刻畫社會寫實的故事，

  如果你是醫護人員或是家屬，相信這部片能帶給你更多的感觸，

  突然的無預警封院，面對未知的病毒，也擔心傳染給自己的家人，

  如果你是醫護人員，該先自保還是救人？

  　


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  電影從許多不同的角色角度來看這疫情，

  醫生、護士、記者，每個人都有自己的戰場，

  穿插著不同的故事線，而很多很多聲音也是非常寫實，

  像是要安排誰去重災區的B棟，

  A、B兩棟就像有一條鴻溝，雖然同屬一間醫院。

  　

  　

  安泰河的劇情線，在沉重疫情中給了我們一些希望，

  「你還好嗎？」

  「我很好，你呢？」

  不論發生什麼都還是說著我很好，然後一個人默默承受著一切，

  生了重病也是點滴自己來，

  最後並沒有結局，也因為這樣讓觀眾可以自由想像。

  　

  　

  最後謝幕名單搭配的青峰的"是我的海" 在電影最後眼淚也潰堤了，

  面對著致死率極高的病毒，我們當時的準備與所知真的遠遠不足，

  二十年前第一線的醫護人員，一定比我們看的電影感受到更大的心理壓力，

  謝謝有你們一起對抗疫起。



  --'
