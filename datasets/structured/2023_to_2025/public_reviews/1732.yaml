title: '[討論] 《疫起》電影視覺特效幕後拆解 Showreel '
content: '電影《疫起》 Eye of the Storm 視效幕後 VFX Showreel





  《疫起》主打「共感電影」根據史實編寫呈現SARS疫情，


  全片特效竟然有200多顆視效鏡頭！！


  戲中使用3D技術創造20年前車水馬龍的台北市環境，

  包含建築馬路、和台灣特色機車騎士，大量應用在所有戶外跟窗外畫面。


  也特別挑戰3D CG群眾的表演，不只增加人群數量，

  還調度這些群眾，像是集體擋警車，在突然大雨時有開傘和避雨等表演走位


  劇中主要場景「北臺聯合醫院」，都是在不同地點拍攝再交由視校整合，

  像是夏正從手術室出來的場景就由３所中南部廢棄醫院取景而成。



  總結 :

  一部看不出來的寫實特效，才是特效的最高境界 !!





  --'
