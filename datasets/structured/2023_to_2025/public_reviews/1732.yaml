url: https://www.ptt.cc/bbs/movie/M.1681437536.A.864.html
title: '[無雷] SARS 和平醫院 封院隔離事件 《疫起》 '
content: '周一包包粽


  這是一部改編自20年前

  台灣SARS疫情時發生的和平封院隔離事件的電影。


  其實電影的一開始我就被整個年代氛圍震懾。

  人群沒有戴著口罩，

  有人咳嗽依然可以自然對話彼此毫不遮掩；

  人之間的交集用現在的眼光

  可以說是單純的不可思議，也難以想像。

  這幾年的疫情真的不知覺得影響我們好多。


  這部電影的故事背景，和平封院的時候我還在小學

  （可能有些進戲院的人那年還是個寶寶還沒有意識（啊啊啊！

  但那時對於整個事件的理解

  都只是透過電視新聞片面的角度，

  不過當時對全台灣社會的震撼，

  我想都十足的影響了二十年後的現在

  群體第一時間面對病毒的警覺性。

  可是時間真的會漸漸刷淡很多的細節，

  能看到電影裡面的真情詮釋真的是既感慨又感動，

  感動能有機會更認識那些容易被人們逐漸淡忘的事。


  真的很精彩～

  雖然整部很寫實，氣氛也很緊張，

  不過裡面還是有安排一些

  讓人喘息的空間（大家自己體會


  假如你想要更深入的認識二十年前

  台灣病毒意識的疫苗

  那推薦大家可以去戲院打劑強心針。


  ------------------

  話說因為首映剛看完

  想急著想大家分享感想跟圖

  一整個晚上通宵把他趕完

  來不及花時間想該怎麼刻畫柏傑的帥，

  所以直接把原本鏡頭裡的王柏傑

  改成包包粽

  希望柏傑不要介意（？？？）







  --'
