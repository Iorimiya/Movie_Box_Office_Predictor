url: https://www.ptt.cc/bbs/movie/M.1683365613.A.5B7.html
title: '[新聞] 項婕如見專責病房壓力大 拍《疫起》入戲'
content: '完整標題：

  項婕如見專責病房壓力大 拍疫起入戲深到止不住淚


  中央通訊社 CNA / 新聞網址：



  -


  演員項婕如（左）跟曾敬驊（後右）

  在電影「疫起」中分別飾演年輕實習醫生及

  護理師，兩人受訪時回憶，電影拍攝時正好

  是台灣疫情嚴峻時刻，劇組又選在真實醫院

  內取景，格外有壓力。（CATCHPLAY提供）

  中央社記者王心妤傳真 112年4月29日


  （中央社記者王心妤台北29日電）

  曾敬驊、項婕如演出電影「疫起」。

  項婕如表示，拍片時正好是台灣疫情嚴峻時刻，

  常會看到隔壁棟專責病房狀況，格外有壓力，

  尤其一場對其他醫護大吼的戲更是哭到停不了。


  「疫起」以2003年的醫院封院事件為藍圖，

  刻劃人性衝突。項婕如片中飾演年輕實習醫生；

  曾敬驊飾演護理師，兩人在片中有不少

  感情對手戲。


  項婕如接受中央社記者專訪表示，

  一開始收到劇本時，前兩三次看都不停落淚，

  觀影時會被角色情緒牽引到想哭，


  「」


  曾敬驊說，一開始收到劇本就覺得描述的

  故事很真實，並非要帶著觀眾以上帝視角

  談當時事件，而是用故事與情緒跟觀眾連結，


  「」


  兩人回憶，拍攝「疫起」時正好是台灣疫情嚴峻時刻，劇組又選在真實醫院內拍攝，格外

  有壓力。項婕如坦言，拍攝過程會感到害怕，「我們肉眼可見對面大樓就是專責病房，我

  們拍攝是假的，旁邊是真實的，尤其是當時不知道疫情何時會結束，衝擊感真的很大。」


  曾敬驊則是確診COVID-19後進入拍攝，


  「」


  這樣的身體狀態讓他對醫護人員更有共感。


  片中除了有盡力奉獻的醫護人員，

  也有陷入掙扎暫時罷工的醫護人員，

  一場項婕如崩潰敲打休息室門口喊話的戲，

  讓她印象格外深刻。


  項婕如分享，拍攝這場戲之前有另一場急救戲，


  「

  」


  項婕如當時因為太過入戲，連導演林君陽喊卡，她仍止不住情緒，蹲坐在地板哭了許久。


  對於演出後最深的感受，曾敬驊殺青後回想

  飾演的角色「安泰河」，認為這個角色更多

  的是有聖光感，又不像拯救世界的超人般強大，


  「」


  至於現實中會做出什麼選擇，曾敬驊笑稱自己

  不會想「死得這麼浪費」，會受到群體影響

  幫助身邊的人：


  「」


  「疫起」全台上映中。（編輯：李亨山）



  演員曾敬驊（右）與項婕如（左）在

