url: https://www.ptt.cc/bbs/movie/M.1692078271.A.CDE.html
title: '[新聞] 國片大戰進入線上串流《疫起》《鬼家人》'
content: '國片大戰進入線上串流《疫起》《鬼家人》Netflix獨家播放



  全台首部共感式衝擊電影《疫起》由金獎導演林君陽，攜手王柏傑、薛仕凌、曾敬驊、項

  婕如，以及特別演出的謝盈萱等大勢卡司共同呈現，更一舉榮獲今年台北電影獎「最佳導

  演」、「最佳男主角」等多項大獎肯定。，準備引領全球觀眾體驗當年SARS台灣人面臨的人性危機及突破性的勇敢

  。


  王柏傑坦言演出《疫起》對他而言實在充滿突破，困難的部分實在太多了，但最難的還是

  手術畫面的詮釋，他也為真實呈現下足苦功：「一開始先是拿人工皮縫合、打結，後來進

  階到把豬皮和內臟放到一個假人型裡練習，甚至還買了一組器材，每天在家練，一邊看電

  視，手也要練綁線，就是要熟到眼睛不用看著，也可以完成那些動作才行。」對於王柏傑

  的分享林君陽導演分享說：「王柏傑在夏正這個角色裡把一個大醫院小醫師的無奈層次處

  理得非常豐富而且真實，我一直覺得真誠的表演才能動人，我相信在這個角色裡他交出了

  自己。」


  此外，多次與曾敬驊合作的林君陽表示「這幾年和曾敬驊的幾次合作，都感受到他愈來愈

  成熟的表演與明星氣質，安泰河（角色名）這個角色處於天真與世故之間的摩擦，敬驊在

  無數次的自我質疑中打磨出了這個角色，相當紮實。」曾敬驊也坦言安泰河那份「雖然很

  害怕但還是願意挺身而出守護一切的勇敢」，是他認為這次在角色詮釋上的最大挑戰，同

  時也是他最想讓觀眾感受到的角色情感。


  飾演真實歷史上不能提的記者


  《疫起》之所以能傳達當年的疫情恐慌，薛仕凌的表演功不可沒。演出宛如身陷戰地，隨

  時面臨危險的專業記者，薛仕凌呈現出每位認真在工作崗位的的媒體人心中對新聞自由的

  熱情與渴望。薛仕凌分享：「基本上金有中（角色名）的狀態就是要鬆啦，因為他本身的

  存在和醫護、家屬間就是非常突兀，所以我當時在處理角色很重要的就是要創造他和其他

  角色的反差感，金有中就是越鬆越油條越好。」同時薛仕凌也透露他在片中和對手演員王

  柏傑，一邊是狗仔記者一邊是醫護人員，好像互利共生卻又說不上是夥伴的微妙關係很精

  彩，當中很有戲劇性的拉扯也是一大看點。



  《鬼家人》刷新國片歷史


  此外，

  。《關於鬼》的主演們也推薦出各自的Netflix鬼月片單，與大家共度農曆7月。許光漢推

  薦Netflix日本懸疑電影《夜霧村莊》希望在鬼月能夠讓大家沉浸在藤井道人導演的世界

  裡 ；而林柏宏推薦Netflix科幻單元影集《黑鏡》，他表示：「我覺得《黑鏡》呈現的氛

  圍還蠻符合鬼月氣氛，有種另類的驚悚和反思。」希望可以在鬼月帶給觀眾不同於以往驚

  悚片的觀影體驗；王淨則是推薦改編自日本漫畫的《今際之國的闖關者》，王淨也坦言自

  己其實並不太愛看血腥片，但《今際之國》中精彩、熱血沸騰的劇情是能夠讓她一直看下

  去，非常推薦給想要在鬼月氛圍中熱血一波的觀眾。






  --'
