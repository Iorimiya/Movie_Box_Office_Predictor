url: https://www.ptt.cc/bbs/movie/M.1681359862.A.DED.html
title: '[好雷] 憶起一起度過的【疫起】 '
content: '榛果H @ HKese


  觀影前，我思考過，雖然有很多醫療劇有我喜歡的演員演出，作為一個電視兒童，追劇、

  追星，向來稀鬆平常，但近年來，一起追劇的媽媽，排斥醫療劇，因為人生已有太多無奈

  ，追劇本是娛樂，無須添加傷痛。


  而我，要因為這是可以免費看電影，就無懼傷感襲來嗎？或許映前林君陽導演、李耀華監

  製、劉存菡編劇到場的介紹，已經給了答案：因為那是我們走過的路，應該有感。我決定

  勇敢面對它。



  關於電影背景SARS，我的記憶：我當年小學五年級，我記得原本我們要在禮堂的畢業典禮

  上，歡送六年級的學長姐畢業。不過，因為疫情，所以畢業典禮取消。是不是也沒有畢業

  旅行？我忘記了，只記得還好學校有一個400公尺跑道的運動場，所以在空曠的操場上，

  簡單給應屆畢業生辦了小小畢業儀式吧！


  那時候我有在補英文，補習班開始會量體溫，還對小小張的體溫卡有印象。背景中真實事

  件：和平醫院封院，有在電視新聞上看到。


  明明是經歷過的人，小學五年級，也不小的年紀，記憶隨時間遠去，我更感受到《疫起》

  的意義：不該遺忘犧牲者。





  時光倒流回去20年前，相對地，資訊匱乏，什麼都不得而知，我們因未知而惶恐。然而，

  現今人手至少一臺智慧型手機，各種資訊如雪片飛來，我們忙著過濾孰真孰假？無論何時

  ，我們都有機會面對恐慌，如何心靜而順其自然？




  連通A、B棟，通道燈光隨邁向疫區熱點而黑，生與死，恰似只差指縫。沒有辦法，拖著病

  體，也要盡一份力救人，閃過的死別，讓求生的意志更加堅定。隔空喊話，一句沒事，只

  為讓心愛的人安心。




  素昧平生的人們，因緣際會困在一起；彼此加油打氣，小小身軀可以有大大力量，你不會

  是孤獨的。




  汶川大地震時，犧牲自己，勇救學生的老師被追思為英雄，自己趕緊跑的老師，倍受責難

  ；然而，激情過去，老師也是人家子女、父母，是很多人重要的家人。健康幼稚園火燒車

  ，奮不顧身救孩子的林靖娟老師，入祀臺北市忠烈祠、銅像、「靖娟兒童安全文教基金會

  」成立；然而，就像林媽媽淚眼憶女，靖娟老師救了別人的孩子，但她的孩子，卻再也回

  不來！以及臺灣第一位在SARS事件殉職的醫生，林重威醫生的父親林亨華說：「我情願有

  一個活著的兒子，不要一個死去的英雄。」



  影透，一句電影中的台詞。確實，我們想要顧全的事情太多，很多時

  候，多的是無力。


  人可以脆弱如掉進深淵，見不著一點光；人同時又可以堅強如鋼鐵穩固，勇敢承擔天職而

  不膽怯！


  這是一部有代入感，讓你熱淚盈眶，但又不至讓你淹沒在淚海，有血淚、有致敬、有希望

  的好電影。





  --'
