url: https://www.ptt.cc/bbs/movie/M.1681884433.A.938.html
title: '[好微雷] 內斂卻深刻的疫起'
content: '我知道這部片對於很多觀眾來說是沒有吸引力的，

  相較之下進戲院笑一笑、被鬼嚇或是被引擎聲炸聾會更有娛樂效果。

  然而除了娛樂效果之外，我只能說這是一部好電影。


  和《返校》一樣，故事中段就開始落淚，

  一方面是因為故事與畫面的渲染力，

  有場王柏傑去被封鎖的醫院B棟送便當，

  胖護士摔倒後叫他不要過來，自己站起來比YA說我很好，

  我當下淚腺失守，當時就是這些人幫大家撐住，

  直到十多年後，還是這些醫護為大家撐住；


  另一方面也為了這是真實發生在台灣的憾事而哭。

  觀影過程中好幾次透過人物的經歷，

  提醒我撐過疫情還能與身邊人共處是多麼得來不易。


  或許有人會覺得電影沒有把當時下錯誤決策的政治層面狠狠揭出來，

  但影劇創作又真的需要面面俱到的負起所有社會責任嗎？

  在《疫起》裡面，我們看到的是事件發生的錯愕、絕望與真實，

  有的人選擇逃避，也有的人經歷自私以後艱難地站了出來，

  可以推論這些面對不堪後挺身的英雄下場也不會太好，

  這已經是某種程度的寫實了。


  而每場高層會議裡面聽到無奈的「上面決定」、「上面要求」等等，

  會讓觀眾去思考，上面是誰？上面出了什麼問題？對我而言已足矣。


  故事之外，本片的手術場面非常寫實，比大門未知子還要更凌亂、逼真，

  攝影與剪接的基調把恐懼具象化、被封鎖的B棟拍得像惡靈古堡般驚悚，

  而盧律銘的音樂更在氣氛渲染上推波助瀾，完成度極高。


  王柏傑飾演從小我走向大我的醫生，全片是他的英雄旅程，

  雖然他只有33歲，卻演出了40以後的滄桑糾結。

  大家的偶像薛仕凌這次表現比較收，沒有《做工的人》或《茶金》這麼爆發，

  感覺他的演技逐漸打磨得更內斂，外型不知為何有松山健一的味道。

  脣紅齒白王者曾敬驊的熱血小鮮肉說服力十足，

  這是他第二次接演有關台灣黑歷史的題材，很欣賞他。

  女主角項婕如把衝勁、愛戀與痛心演得恰到好處，

  我與太太從戲院出來同時說「他更適合演《模仿犯》的小路」。

  另外還注意到一個叫做許築婷的演員，飾演沒有罷工的過勞護理師，

  戲份不多，卻也很亮眼。

  整體看完覺得林君陽真是近年穩扎穩打，拍什麼像什麼的厲害導演。

  期待人選之人。


  如果你是喜歡劇情片的人，真心推薦去重溫這段歷史，

  那年我才21歲，一點都不關心社會，

  如果人生有可以重補修的機會，或許就是現在了吧。



  --'
