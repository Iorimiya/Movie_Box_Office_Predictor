url: https://www.ptt.cc/bbs/movie/M.1681468188.A.7BC.html
title: '[好雷] 其實也沒人想當英雄 《疫起》《和平歸來'
content: '彭子珊

  「其實也沒人想當英雄」 《疫起》《和平歸來》重現SARS封院14天


  這個4月，SARS回來了，但這次要攻佔的不是你的肺，而是你的心。


  20年前的此刻，台北市立和平醫院院內出現SARS群聚感染，被迫封院14天，上千名醫護人

  員和病患強制集中隔離。最後造成57名醫護人員、97位民眾染疫，共計30人死亡，還有一

  位選擇在院內自殺。


  封院隔離的慘痛教訓，儘管早已有許多小說、影劇改編作品，但最新兩部以和平封院為靈

  感原型的作品，在新冠疫情趨緩的此時上映，看起來格外深刻。


  電影《疫起》聚焦在拉起封鎖線之後，未知病毒當前的人性糾結；劇集《和平歸來》則更

  像是前傳，回頭剖析封院的起源和衝突。




  《疫起》故事描述，對工作失去熱情的胸腔外科醫師夏正（王柏傑飾），只想趕快下班回

  家為女兒過生日，卻意外碰上「北臺聯合醫院」封院的決定。而他的患者之一，記者金有

  中（薛仕凌飾）則裝病住院，千方百計要挖出院內感染的獨家新聞。


  面對SARS病毒快速擴散，一切以病患優先的男護理師安泰河（曾敬驊飾）和實習醫生李心

  妍（項婕如飾），不僅要盡力搶救手中的病患，還得處理醫護同事不斷高漲的憤怒情緒。


  《疫起》的英文片名「暴風眼」（Eye of the Storm），就暗示了曾執導《我們與惡的距

  離》、《茶金》等熱播台劇的導演林君陽，為什麼用虛弱的呼吸聲、全黑的院內通道，領

  著觀眾走進封院後的禁地。


  如果看完近2小時的《疫起》，對於當年的和平封院還有太多疑問與感動，可以接力播放

  政治劇集《國際橋牌社》系列外傳《和平歸來》，從台灣的國際處境、政治生態，來回溯

  那段歷史。




  同樣設定在2003年，《和平歸來》描述的則是台灣SARS防疫成績優異，試圖以零死亡、零

  輸出、零社區感染的「三零」戰績加入世界衛生組織（WHO）的關鍵時刻，卻碰上第一個

  確診病例出現在台北市「博愛醫院」。


  一心想救更多人的急診醫師羅士凱（柯宇綸飾），偏偏在此時調任負責防疫的北市衛生局

  第三科科長。他夾在博愛醫院院長唐榮康（陳以文飾）和衛生局長許書華（張詩盈飾）之

  間，還得盡力保護自己的未婚妻，同樣是博愛醫院的住院醫師陳郁美（鍾瑤飾）。


  觀眾就跟著蠟燭三頭燒的羅士凱，看著中央與地方政府爾虞我詐，放任SARS從博愛醫院內

  急速蔓延，忠心的醫護一一倒下。有人罹患SARS要不要向上通報？通報完要不要受理，正

  式成為第一個SARS確診患者？每一關都有逃不過的政治考量，寫實的人性博弈與算計。




  從《疫起》到《和平歸來》，兩部作品描繪醫療現場都是臨場感十足，因為背後的智囊團

  ，幾乎台灣從南到北都有醫護人員鼎力相助。


  《疫起》除了用4個廢棄醫院的場景拍攝，編劇劉存菡自己就是護理師出身，也透過大量

  田野調查讓片中的醫院生態更加鮮活。飾演胸腔外科醫師的王柏傑，也曾在映後座談時提

  到，拍攝前就把手術器具帶回家天天練習，要練到可以邊看電視邊縫合的地步。


  《和平歸來》更是每集都有執業醫師客串，就連當年和平醫院的消化外科主任周經凱也加

  入演出。因為20年前，收到封院通知後的他發現，WHO的建議是疑似個案應居家隔離10天

  ，他便設法說服北市政府收回成命，但最後仍遭到記大過革職、停業罰款及輿論追殺。


  多年過去，不只周經凱現身說法，《和平歸來》每集最後都會請到一位當年和平醫院封院

  時期的醫護人員，在鏡頭前分享自身經歷，以及給後人的提醒。


  因為唯有不忘歷史，才能避免悲劇重演。就像時任和平醫院新陳代謝科主任蘇瑞珍在片尾

  說的，雖然當年許多醫護人員一起撐了下來，但願若是未來類似情節再次發生，「不要再

  有所謂的英雄，因為其實也沒有人想當英雄。」





  --'
