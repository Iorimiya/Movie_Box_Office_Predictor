url: https://www.ptt.cc/bbs/movie/M.1694610034.A.47B.html
title: '[雷] 超負雷-一起無腦的疫起'
content: '手機不能選負雷 所以只好先這樣

  原本想要標題打絕命負雷

  因為這部太屌了 負雷到絕命的地步


  也許我們都以為自己認識 無聊透頂這個成語


  那是我們太愚蠢了 太無知了

  因為疫起 告訴我們 無聊透頂的定義是

  花時間品味、觀看這部蠢電影


  從第一秒到最後一秒 你深刻體會到死亡的愉悅

  死了什麼都沒了

  就不用去被故事裡面無聊再無聊的劇情折磨



  男主角莫名的煩躁 從第一幕他就沒好氣

  請問一個醫師你他媽在煩殺小 疫情都還沒演

  你就在那邊雞巴態度幹嘛 很煩

  觀眾要花兩小時看你這種臭臉大便比較煩


  故事線幾乎是零


  沒有任何主題 好像紀錄片卻也沒有紀錄片的真實

  硬是添加無腦小妹妹還有送便當的劇情

  難道這樣很感人嗎 在醫院卿卿我我很浪漫嗎

  這完全透露這部電影沒有思想

  就只是想拍 就只是想蹭疫情的一個話題



  角色沒有內心話 故事沒有情節 根本無話可說

  也沒有真實人性的糾葛

  也沒有大畫面的觀感享受


  整個在那邊瀰漫疫情的苦悶 也拍不好

  林老師我們親身體會過三級警戒

  他媽的我們親自中獎過 發燒過

  有人活在其他國家可能封城過咧幹你娘


  你拍SARS可以 但你的故事是什麼？

  疫情很可怕？

  醫護很辛苦？

  人民很難受？

  政府很無能？


  可不可以至少挑一個來寫？不是取名疫起就好

  也不是背景時空挑在醫院就好

  一個故事核心是價值觀 是故事內容 是人性

  是衝突



  我保證拍這部蠢片

  不如去拍一個瘋子對鏡子自言自語都比較好看

  我可以忍受單調的場景跟人格

  但是瘋子還可以展露人性的糾葛與荒誕



  為什麼到底連一個劇本都沒有還硬要拍？


  沒有故事還硬拍就是一種折磨

  對觀眾是一種折磨 對導演與演員也是折磨

  這種折磨還不如你拍火車經過 拍老人釣魚

  起碼觀察到了這個世界的真實


  而不是僅僅只是蹭著一個表面話題

  內部囈語一些不明所以的噪音

  真的從頭到尾都很沒意義



  想自殺的人 請播放疫起給他看

  讓他知道珍惜生命

  原來人生就算只會打手槍也比這個電影有趣

  太棒了這部片至少可以救人命



  國片真的要加油

  不要哭沒錢 有時候是有錢也沒腦

  想讓自己變得無腦嗎各位

  讓我們一起享受 疫起吧！


  -----

  Sent from  on my iPhone


  --'
