title: '[新聞] 改編SARS封院國片《疫起》預告釋出 謝盈萱'
content: "熊景玉\n改編SARS封院國片《疫起》預告釋出　謝盈萱客串撤離關鍵人物\n\n國片《疫起》公布預告，男主角王柏傑、曾敬驊身穿防護衣及口罩，站在通往醫院B棟\n\
  走廊，揭開無預警封院，醫院劃分AB兩棟管制病毒感染擴散的未知恐懼。由王柏傑飾演\n的經歷生死第一線醫生，對電話中的家人說：「爸爸要等病人好了以後才可以離開」，\n\
  而曾敬驊飾演的醫護人員臉上露出滿滿口罩壓痕，真實氛圍令人不捨。\n\n金馬、金鐘雙料影后謝盈萱在片中客串飾演外科主任，成為緊急封院時刻掌握撤離的關鍵\n人物，被飾演胸腔外科醫師夏正的王柏傑私下求助列名第一批撤離名單內，逃離被病毒恐\n\
  懼壟罩的醫院；曾敬驊、項婕如這對醫護戀人面對隔離的困境互相支持彼此，盼望解除隔\n離，回到從前的生活；而飾演記者的薛仕凌則不擇手段潛入醫院，冒著染疫風險，為疫情\n\
  擴散做真實報導，他說：「這裡就像戰爭一樣，我在第一線，很幸運。」\n\n《疫起》取材自20年前的SARS封院事件，透過身處院內的醫護、病患、家屬等人，從掙扎\n\
  害怕，到挺身而出、犧牲守護，來詮釋「面對的勇氣」。\n\n導演林君陽有感而發：「這部電影帶給大家的共感，不論是20年前或是現在，我們都曾經\n歷面對恐懼的共同感受，但因為勇敢，我們挺過來了。」該片將於4月14日上映。\n\
  =\n\n\n《疫起》正式預告  \n\n\n\n\n\n--"
