url: https://www.ptt.cc/bbs/movie/M.1689833017.A.DEC.html
title: '[新聞] 《疫起》8月15日 Netflix 全球獨家上線'
content: '重現20年前SARS封院事件　《疫起》8月15日Netflix全球獨家上線



  電視劇《人選之人 -造浪者》引爆了台灣的「#MeToo運動」，至今尚未平息，也先後登上

  CNN、《紐約時報》、《華盛頓郵報》、BBC等國際媒體，報導Netflix電視劇如何撼動了

  整個台灣社會。而《造浪者》導演林君陽執導的電影《疫起》，也宣佈8月15日於Netflix

  全球獨家上線，重現20年前SARS封院事件。


  取材自發生於2003年，SARS病毒引發的封院事件，電影《疫起》細膩勾勒大難當前，醫護

  人員、病患、媒體記者等不同身份立場角色的內心掙扎、善惡抉擇。日前更入圍台北電影

  獎多達13項獎項，榮獲「最佳導演」、「最佳男主角」等大獎肯定，準備登上Netflix，

  有望與全球逾190個國家與地區觀眾產生疫情共感，重回20年前的SARS時空。


  導演林君陽分享：「全球的人們都在過去幾年一起經驗了超現實的疫情封鎖，於是這部電

  影不只記憶了從前，也同時為剛過去的疫情裡與病毒戰鬥的我們留下一段故事。我希望透

  過這個故事，我們都能記得那些看得見或看不見的犧牲。很興奮可以在Netflix上和更多

  觀眾見面！」


  而在片中挑戰串起整個故事核心，詮釋站在第一線的胸腔科醫師角色，爆發性演出一舉榮

  獲台北電影獎最佳男主角的王柏傑，同樣表示非常開心和榮幸作品能登上Netflix，除了

  希望《疫起》能被更多觀眾看見，也有感而發地說：「希望大家不要忘記20年前曾經發生

  過這樣的事，希望這部作品能讓大家認識到，當初有這麼多英雄默默付出，他們是多麽偉

  大的做出犧牲。」


  在片中詮釋熱血護理師角色、也是站在最前線的醫護人員，曾敬驊表示希望觀眾會喜歡這

  部作品，也延續角色溫暖分享：「護理師安泰河相信世界上存在良善，每個人都有共情能

  力，在面臨災難危機，他願意捨身救人是我最希望傳遞給觀眾的。」


  電影除了以第一線醫護人員的視角看待封院事件，還加入薛仕凌所飾演的狗仔記者擔任故

  事關鍵要角，這不僅創造了角色不同立場間的衝突火花，也是呼應當年曾發生過的真實事

  件。因扮演狗仔記者而入圍台北電影獎最佳男配角的薛仕凌談到，「在這個事件裡，每個

  角色的立場都不太一樣，加入媒體元素、透過故事觀察身為狗仔記者的金有中，在院中和

  其他角色看似利益共生，又看似擁有衝突的狀態，是非常有趣的，整個作品感覺很像是我

  們在還原這個事件的同時，架設了一個監控攝影機，讓大家可以更貼近地去看當時的院中

  百態。」他也很期待作品在Netflix上線後，獲得更多不同的觀眾反饋。



  =====


  鬼家人 是 8/10  也是 N家 全球獨佔






  --'
