url: https://www.ptt.cc/bbs/movie/M.1680787025.A.095.html
title: '[影評] 彭紹宇／《疫起》：病毒暴風眼中的人性'
content: "彭紹宇／《疫起》：病毒暴風眼中的人性幽谷\n  聯合報／ 彭紹宇\n\n4月是春天的季節，天氣逐漸轉暖，卻又不至於太過炎熱，一切如此舒適剛好。但或許有\n\
  人記得，二十年前的4月卻是個令人難熬的春天──2003年4月，SARS病毒在台灣迅速傳播\n爆發，最終奪去許多生命。\n\n我們對SARS的集體記憶，因近年新冠疫情又再次被喚起，當生活逐漸回歸正軌，回望過去\n\
  三年被病毒籠罩的世界，不免覺得恍如隔世，但大疫為社會留下的創傷，似乎又需要好多\n年才得以真正結痂。\n\n以SARS疫情為背景的台灣電影《疫起》選擇在事件發生二十年後的同月上映，此時此刻正\n\
  逢新冠疫情結束，電影出現時機著實巧妙。\n\n\n《疫起》敘述當年震撼的醫院封院事件，藉由一位胸腔科主治醫師視角，看盡疫情底下脆\n弱的人性與眾生相，也望見災難中不同人物的樣貌──無論是草率完成工作只想提早回家\n\
  的醫師、為了挖掘獨家而故意住院的媒體記者、用心照顧病人的護理師，以及堅守崗位的\n實習醫生等等，每個人物都充滿自身故事與性格，而非只是扁平的角色書寫。\n\n\
  一旦角色書寫不扁平，我們便可發覺某些人物在這場災難中的轉變，從完全自私到冒險救\n人，又是為何產生如此改變？導演林君陽曾說：「希望這部電影是一抹溫暖。」但如此溫\n\
  暖不是來自蒼白理想或虛無縹緲的大道理，而是他試著從那些走一遭人性幽谷的平凡人中\n，尋找潛藏其中的善，這才是黑暗中的光──是經歷恐懼與人性拉扯後，依然願意挺身的\n\
  光。縱使外界仍舊黑暗，那道光依舊在那兒。\n\n《疫起》的英文片名“Eye of the Storm”，亦即暴風眼。\n\n在一場暴風雨裡，中心是最穩定的地帶，但無風無雨其實是山雨欲來的致命寧靜。呼應著\n\
  醫院封院現場，本是救人場所，卻成為被迫共同邁向死亡的牢。一切運作都仰賴每個小人\n物的抉擇，人性的坍塌，也將輕易使一切如骨牌般邁入失控。而「眼」也存在雙重意涵，\n\
  這場暴風雨帶我們看見什麼，都悄悄埋藏在作品當中。\n\n由《我們與惡的距離》、《茶金》導演林君陽睽違八年再度回歸電影導演，經歷這些年在\n電視劇的洗禮與磨練，無論是職人、社會寫實或時代劇，林君陽深諳劇情節奏與人物刻畫\n\
  ，這回《疫起》再度展現他在社會議題上的熟練發揮，也是過往經驗的扎實累積。\n\n不僅導演調度功力，敘述這類亟需醫療專業內容的作品，編劇角色至關重要。《疫起》編\n\
  劇劉存菡身分特別，她曾擔任急診室護理師，擁有第一線經驗外，開拍前更進行了三年田\n野調查，為作品定下不可或缺的錨。電影裡加入許多專業醫療術語，卻不致使觀眾困惑，\n\
  反倒加深劇本說服力道，模糊那條真實與虛構間的疆界。\n\n此外，影視作品試圖觸碰如此重大且真實的歷史事件，著實是件吃力不討好的事，因此《\n疫起》捨棄過多事件細節，而將故事線聚焦於幾位主要醫護人員身上。全片場景也發生於\n\
  封閉醫院環境中，又運用紀錄片手法，時而穿插日期時間與類新聞畫面，透過刻意不穩定\n的手持鏡頭，塑造事件進行式的未知與臨場感。\n\n社會寫實劇要能成立，除了堅實的幕後團隊，演員群實力也備受考驗，這次也不例外。集\n\
  結王柏傑、曾敬驊、薛仕凌、項婕如與謝盈萱等一眾演員，實為近年台灣優秀演員大集合\n，其中王柏傑受惠於戲分與角色深度，角色弧線（character arc，編註：意即一個角色\n\
  變化的過程）明顯，表演轉變格外令人印象深刻。曾敬驊身為年輕護理師，也展現滿腔熱\n血外的脆弱與掙扎。整體而言，比起單獨給予哪位演員光芒，電影更以群戲為重，唯有眾\n\
  人共同成就，才得以將這座醫院從內到外，如實建構而成。\n\n回看過去產業動態，新冠疫情不僅為電影產業帶來巨大影響，更催生許多以疫情為題的台\n灣電影，包含2021年的《瀑布》與《美國女孩》。這次《疫起》更直面疫情本身，而非只\n\
  是背景設定。我幾乎可以想像這類疫情電影在一些國家將成某種宣傳工具，過度美化現實\n就像上了太厚的濾鏡，縱使完美無瑕，人們一看便能輕易發現其中的不真實。\n\n\
  《疫起》作為一部以醫護人員為主體的電影，不是一味強調醫護人員的勇氣或偉大，而是\n將他們回歸為人──是人，也就有恐懼的權利。因此，有人保護自己，有人冷眼看待，有\n\
  人則不顧生死，只為對得起身上那件白衣。其實都無對錯，我們身為旁觀者習慣抽離一切\n，彷彿那些都與我們無關，不過試想當身處如此困境，我們是否有勇氣跨越利己主義，做\n\
  出選擇？\n\n這部電影不是重構歷史，而是一次歷史再譯──二十年後，當全人類又經歷一場如此相似\n的大流行後，我們又學到什麼？最致命的往往不是病毒，而是過於殘酷的人性試煉，正因\n\
  它將撕裂人與人之間的關係，讓社會在這場仗尚未開打之前，就已無力再戰。人們在SARS\n經歷過一次，新冠疫情中又再次見證這般光景，那麼下一場疫情來臨之時，我們是否有能\n\
  力撐過暴風眼外的世界？\n\n《疫起》重現那場離我們不遠的危機，也預示可能發生的未來，除了試圖探尋人性光明，\n告訴我們暗處總會有光，也是一次溫柔告誡。在走出疫情陰霾之際，遙望往日創傷，為此\n\
  刻添增一絲同理與包容。讓我們在災難面前，足夠堅韌，也足夠勇敢。\n\n\n\n\n\n--"
