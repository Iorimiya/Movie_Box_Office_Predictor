title: '[新聞] 《疫起》勇奪新片票房冠軍！歪哥扮計程車'
content: "《疫起》勇奪新片票房冠軍！　歪哥扮計程車司機暖哭觀眾\n   記者 羅子欣 報導\n\n國片《疫起》上週五（14）全台上映，勇奪全台新片票房冠軍，演員們也勤跑映後宣傳，\n\
  遇到許多觀眾感動反饋，表示被片中王柏傑和女兒的對話感動到淚崩，也有觀眾因曾敬驊\n、項婕如的愛情戲動容，最溫馨的是有醫護人員表示導演有拍出他們的心聲；另外，由張\n\
  永正飾演計程車司機「老江」也令人印象深刻。\n\n首週影人電影院QA現場，飾演實習醫生的項婕如也分享對「老江」這個角色的感動：「有\n時候一份這種陌生的善意，一份體貼的心，更顯現沉重黑暗的氛圍有了人性的光輝。」導\n\
  演林君陽也表示：「老江代表著安定與溫暖，即使在艱困的環境下，依然能傳遞善良的信\n念來感染旁人。」\n\n除了計程車司機老江的暖流，「婕敬CP」曾敬驊與項婕如飾演的醫護戀人，也成為電影中\n\
  的浪漫，曾敬驊說：「拍攝時感受到現場專注與嚴肅的氛圍，只有在拍愛情戲才有比較輕\n鬆的氛圍。」項婕如也分享，兩人偷偷地在醫院辦公室接吻的那場戲很有趣，她說：「我\n\
  自己在大銀幕上看《疫起》的時候，就覺得這一段非常可愛，電影不僅讓觀眾沉浸式體驗\n封院的感受，愛情戲也讓人有一種沉浸式談戀愛的氛圍！」《疫起》全台熱映中。\n\n\
  \n\n\n--"
