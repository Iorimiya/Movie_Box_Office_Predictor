url: https://www.ptt.cc/bbs/movie/M.1680945159.A.A74.html
title: '[普雷]疫起'
content: '《疫起》在現代肺炎疫情的背景下改編當年2003的聯合醫院封院事件

  透過院內醫護的角度重現當時院內壓抑恐懼人心惶惶的情景。


  劇中不斷強調疫情底下的人性掙扎與光輝，特別是醫護面對隨時可能喪命的威脅時

  他們還是堅守崗位成為黑暗中的曙光


  感謝所有第一線的醫護人員及院內員工的努力






  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  題材選的很好，但太強調表現情緒張力了，各種營造都超用力中間段落又充滿說教

  導致很多地方都讓我有些出戲無法融入劇情，雖然整體感受普但還是有很多優點

  個人感受供參考。


  劇裡有兩條主線，分別是夏正醫生跟安泰河護理師。

  夏正所呈現出的是從一開始對病患漠不關心到面對SARS的恐懼、病人自殺、與記者追查源頭

  到最後放棄第一批撤離的機會決定留守病院救治SARS病患。


  安泰河則是一個滿腔熱血想進無國界救援組織、救人為大病患至上的護理師

  戲中與李欣妍醫生是對戀人

  在劇的最後，即便發燒也不顧自己身體努力救人的樣子與最後的夏醫生形象重疊

  兩人眼神對上的瞬間展現出醫護無私的精神。



  關於優點：


  薛仕凌飾演的金記者非常優秀，把那種不管規定只顧追查真相的痞痞記者形象演的超好。

  一開始會覺得他是個為求版面亂寫報導的爛人，但在夏醫生一次次跟他的對談過程中得知

  他有熱忱也夠敏銳，賴在醫院只為找到SARS源頭，是個真記者。

  與夏醫生行動時的節奏也夠緊湊且流暢，那種緊張的氛圍恰到好處。

  其他配角如護理師們的不安情緒跟阿長一開始對安泰河對語重心長的表演都很到位！

  更不用說來客串的謝盈萱，超棒。


  -


  劇中美術的部分，開刀時開腸破肚的畫面實在逼真，看到一度吃不下薯條。


  ——————————————————————-


  關於缺點：


  很多地方都好用力，在某些呈現人被SARS恐慌到的聽不到別人聲音的地方用了很大聲的音效

  可是感受上比起感同身受更多的是音效大聲到干擾


  當夏正被派去隔離SARS病患的B棟送便當時，導演把恐懼的氛圍營造到像恐怖片一樣

  很怕他畫面一個晃動就有殭屍撲過來，不說還以為是惡靈古堡


  小妹妹去B棟找媽媽那裡也很問號

  前面把B棟封起來演的多震撼，妹妹隨便就進B棟找人那裡就有多隨便

  導致後面得知媽媽沒撐過去那裡應該是要哭的但我整個？？？？


  -


  說教橋段


  自己蠻忌諱說教的，偏偏這部把說教用好用滿，除了安泰河對癌末病患家屬的說教之外

  （人家家屬已經公司醫院兩點一線累成狗想消極治療你還跑去說教真的很靠腰）


  可能還想要呈現極端環境下的人性險惡吧

  用了一個把安泰河因為去過B棟支援所以讓護理師排擠他把他趕去B棟的橋段

  並搭配把護理師分成

  好人（努力救人、站在安泰河那裡）

  壞人（認為封院配套不夠而罷工、趕走安泰河）的作法後再對後者說教。


  Emmmmmmm

  說真的我不喜歡這個安排。


  把罷工的護理師都用說教貼上不配的標籤就算了

  讓一個前面花大量時間談戀愛的李醫生出來崩潰痛罵罷工護理師不夠格時差點走出影廳。


  導演你認真？


  -


  戀愛線


  我覺得是這部最大的敗筆，所有談戀愛的橋段都想快轉掉

  但敗的原因並非只是談戀愛

  而是與安泰河跟李欣妍兩人的人設催化下形成了擊敗說教情侶組合


  特別是李欣妍這個角色戲份多到讓我很不明白

  他除了一開始在手術房對夏正表達想更有上進心被夏正嗆爛外

  其他時間不是膩在安泰河身邊談戀愛就是對罷工護理師崩潰說教。


  對，我看完對他的整體印象只有兩個，戀愛腦+崩潰說教。


  尤其李聽到安泰河想去無國界從原本很難過

  到之後也想一起去無國界的轉變很沒說服力

  只感覺他根本戀愛腦不想跟男友分開而已。


  如果說金記者的劇情安排是多足多內斂

  那李這角色的劇情就有多膚淺多表面。


  再加上有護理師水深火熱哽咽痛苦與家人通電話想出去不能出去

  下一幕就接他倆談情說愛置身世外般的橋段


  好了，不要再談戀愛了。


  --'
