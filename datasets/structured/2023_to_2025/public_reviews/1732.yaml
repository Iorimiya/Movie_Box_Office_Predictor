url: https://www.ptt.cc/bbs/movie/M.1681205519.A.EFE.html
title: '[好雷] 「疫起」：每個人心中都有恐懼 /塗翔文 '
content: '塗翔文／「疫起」：每個人心中都有恐懼


  就在我們即將正式在生活中暫別口罩的前夕，迎來了「疫起」這部電影。它以20年前的

  SARS封院事件為基礎，描述了那段許多人都歷歷在目的記憶。當年事件的爭議與轟動程度

  ，眾所周和，要以戲劇改編，可有無數切入甚至批判的角度。


  故事從封院前的那一刻開始，鏡頭跟著王柏傑、曾敬驊飾演的醫生與護士兩個主角，進入

  了突然被封院的醫院內部。兩個角色互為對照，一個如平凡人般地對眼前的進退充滿猶豫

  ；另一個則因為曾有過的傷痛而義無反顧。其實隨著故事的進展，電影環顧周邊的眾生相

  ，當然亦包括那些抗議方的醫護與慌張失序的老百姓。

  ，即便是李雪為首的罷工護士們

  ，最終也還是會有人克服了自己內心的恐懼而做出對的選擇。這種心境上的困境與轉變，

  主要全都聚焦在夏醫師一角身上。從一開始急著想脫身，到最後的挺身而出，這個角色體

  現了全片最重要的中心精神所在，也讓王柏傑演出了生涯的代表作。


  攝影出身的林君陽從小螢幕回到大銀幕，再次證明了他的導戲與統合能力。；當然各方面技術上的完整配合，也都呈現了一定程度的電影質感。


  更重要的是，在台灣的影視工業正在漸漸向上，亟欲

  追趕日韓與好萊塢的此時此刻，這應該是部予以正面鼓勵與肯定的作品。





  --'
