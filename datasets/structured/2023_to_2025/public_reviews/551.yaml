url: https://www.ptt.cc/bbs/movie/M.1554032575.A.203.html
title: '[好雷] 庫爾斯克號：深海救援-改編現實災難片'
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  1.影片名稱 : 庫爾斯克號


  2.觀影時間 : 3/27


  3.觀影地點 : 台南focus


  4.觀影方式 : 自行觀影




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  此區為發文防雷頁

  可選擇性提供上列 1~4 資訊  或不提供亦可

  觀影心得於分隔線下方發布即可


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  改編自真實事件的電影

  所以好像也沒什麼劇透不劇透的問題XD


  不過此片不偏重船員在危難中的應對

  重點在船員的家人感情描寫，片頭即有船員家人溫馨團聚的畫面

  也淡淡的訴說身為船員家人的不得已


  對比黃金救援時期，面對外國伸出援手

  政府卻出於政治考量，耽擱了救援時間

  （對比船員擔心再一次的車諾比核災而不走..真是令人唏噓）


  面對政府的不作為

  船員家人的憤怒，無論是聲嘶力竭的怒吼，

  或是默不作聲地表態都鏗鏘有力

  堅毅的令人不忍QQ


  雖然不免想罵，一場意外的發生就是會有幾個豬隊友害死了他們

  最後那場爆炸也用了幾次的暗示，

  看著明知悲劇會發生但來不及阻止這種無力感…


  雖然豬隊友害死自己的性命，

  但水手們仍然互相包容，互相扶持到最後一刻

  非常令人動容


  作為一部真實事件改編的電影

  不沉悶，節奏拿捏恰當，情感渲染也恰到好處

  必推!!


  --

  我的沉悶不沉悶是跟紀錄片相比啦，我覺得比起紀錄片算好吸收的片了，不過電影本來就是有各種口味XD

  我覺得應該也是，鋪陳的略為刻意，營造戲劇化的結局，但我接受xd

  這部分美國的指揮官也說，俄國就是想讓輿論導向外國救援但救援不力吧...也許就是刻意讓這個事件想成為一個導火線也不一定

  這部份看懂俄國政府的刻意就更覺得哀戚了

  這部分查了一下是有成立事故調查委員會，打撈模擬測試當時情況的，當然情感的部分應該是多的編造啦..

  這點的確是蠻重要的，歷史教訓需要被銘記!!

  我只查到是說有兩次大爆炸，但原因不明....

  不過他們避免了一次大型核災的可能，令人敬佩QQ'
