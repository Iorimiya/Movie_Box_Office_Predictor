title: '[好雷] 深海終劫站  過年動作驚悚片就是看這部了'
content: '================以下無雷心得================





  劇情簡單來說就是深海鑽油場因為不明原因爆炸，主角一行人要設法逃脫，途中卻發現要活命不只要逃離水壓這麼簡單


  大致上這部片就是在講這些，再多也沒有了，而且開場三分鐘直接進主線也沒在給你角色設定跟鋪成直接開跑


  儘管沒什麼劇情但我依舊是給好雷


  原因是一個半小時的片基本上動作滿檔沒冷場，對我來說以一部動作片來說這樣就可以給過了


  超現實主題不要深究太多對精神比較好，海底工作站的場景描繪寫實畫面調色也很不錯也容易讓人帶入這點也是加正分



  便當部分，每個角色會退場都是敗給未知跟環境，而不是為了推進劇情而讓角色失智死掉，這部片一個都沒看到這點我很滿意


  這種災難片(？)我最怕的就是編劇明明有一個很好發揮的題材讓角色死掉卻是讓他們犯傻，這會讓我看的很鬱悶


  請讓環境跟怪獸做好他們的工作謝謝


  這點深海終劫站就做的很不錯，基本上每個人都是硬漢，智商在線


  就連克莉絲丁史都華也是硬漢


  如過妳是從暮光之城到霹靂嬌娃一路看過克莉絲丁的電影，我相信你會跟我一樣很驚異與她越來越跳脫卻也不得不說很適合她的戲路轉變


  這種兼具女性聰穎堅毅的角色很適合她


  最後如果真要說這部片有什麼缺點的話，有些畫面因為海底很混濁也沒什麼光源，晃動的鏡頭下讓人有些難抓到焦點


  海底怪獸的設定基本上不太能說是怪獸，比較像克蘇魯的召喚之類的，人類無法抵抗的


  常常怪獸出現的時候不是被Jump screen嚇到而是被他的畫面設計毛到...


  雖然海底一萬多公里本身就是人類不太能輕易觸及的地方啦


  深海終劫站，推薦給過年不知道要看什麼電影的你


  不過帶小孩可能就不太適合就是了




  -----

  Sent from JPTT on my iPhone


  --

  喜不喜歡見仁見智，但這部看到睡著可能要掛號檢查一下

  感謝糾正XD

