url: https://www.ptt.cc/bbs/movie/M.1738143351.A.7D3.html
title: '[好雷] 【深海】成為向光而生'
content: '‧


  原以為會是一場胡鬧歡樂的海洋冒險，但卻是部在帶點遺憾、帶點難過之中，得到救贖光

  明的一部動畫作品；如深海般深層敘事，確實為此部作品後期轉折提升了層次，並為所有

  成長中遭遇挫折、孤獨的觀眾，給予了讓陽光照射進暗夜深海中的力量；觀眾隨著參宿與

  南河，進行一場五彩繽紛中，但暗藏灰幽的心靈之旅。


  ‧


  你看，有星星。


  參宿與南河，一個父母離異，被迫加入新家庭後失寵的女孩，一個為了藝術離鄉背景的街

  頭小丑藝人，兩顆原本距離數光年的星星，卻在天王星號中相遇。


  在天文學中，參宿四是顆巨大的紅超巨星，甚至被認定是一顆孤獨的恆星，在即將的未來

  ，不斷膨脹後，最後爆炸結束自己生命；就如同劇中患有憂鬱症的小女孩參宿，帶著極度

  壓抑的情緒，經常有著炸壓力鍋的失控；而同為冬季大三角的南河三，即使參宿四即將迎

  來生命終點，卻依然伴隨左右，與之發光燦爛。


  參宿與南河在深海中也是同為伴星的存在，在故事的前期，也許稍微過度雜亂的劇情線，

  卻是鋪陳最後參宿與南河的關係，參宿在瀕死之旅中，南河的捨身相教，讓她得到了向光

  而生的信念。




  ‧


  【深海】有著極為令人歎為觀止的3D動畫技術，使用了粒子水墨技術，每一幀畫面都美得

  令人幾乎窒息，眼花撩亂的繽紛特效加上波光粼粼的海底世界，絕對能夠滿足觀眾視覺上

  的享受；雖然有著「神隱少女」混合「霍爾」、「紅豬」的影子，但始終在最後轉折處走

  出了自己道路，無論是在家庭關係以及心理健康上，都有闡述出獨特的希望與溫暖；雖然

  整體劇本尚有缺陷之處，但動畫的呈現完全值得給予好評的價值。


  這場深海號前往的冒險旅程，可以說是女孩的幻想夢，也能是一場前往地府的旅程；我們

  可以從深海號上的細節，看到地府領路者黑白無常的元素，也能從不斷出現「晦氣」一詞

  中，看到在春節上映時，不應出現生死議題的反差，而產生的喪氣鬼正如女孩因憂鬱症產

  生的產物，對比劇情前段登場的海精靈，則是暗喻可以治癒女孩或其他人的快樂藥物；但

  這些藥物則是帶點虛幻的副作用，諸如此類的【深海】細節，都呈現在深海中的各個角落

  。



  ‧


  【深海】是部需要去思考且極具細節的動畫電影，擁有憂鬱症的孩子，該如何讓光線照進

  他黑暗世界之中？並且利用各種隱喻，讓觀眾更透過一場冒險之旅來更認識憂鬱症患者的

  各種傾向。


  南河在參宿臉上畫下了小丑笑容，他知道她並不開心，雖然深海世界中絢爛繽紛，對比真

  實世界的灰暗抑鬱，也因如此，南河是參宿想突破內心世界的投射，南河的作為，是讓參

  宿有著繼續努力「活下去」的意義，及成為像南河一樣的人，那樣向光而生的人。


  今天妳微笑了嗎？



  ‧




  追蹤茶太郎IG




  --'
