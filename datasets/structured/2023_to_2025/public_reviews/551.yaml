title: '[好雷] 庫爾斯克號：深海救援'
content: '軍事演習的災難發生，是人為還是過失？










  ——————————防雷—————————










  這部電影已點名為事實事件改編，改編就是哪裡非真實事件我們不一定知道。但我看完馬

  上網路上查到，其實這個事件的發生在西元2000年，並非救援技術不足的很遙遠的年代，

  且有部分考證，比如魚雷的爆炸事件，以及後續仍有20多人尚倖存數十小時後才死亡的；

  且當時事件發生有多國表示願意伸出援手，但俄國軍方直至潛艇已沈沒96小時，才應允同

  意他方協助搜救。難以想像當年倖存者在這煎熬的數十小時如何由希望直至絕望地度過。


  以下心得僅就電影本身討論，這部電影並非由好萊塢傳統出身或者俄羅斯裔導演，而是丹

  麥的湯瑪斯凡提伯格導演，我想也許也是因為這樣，並非一般我們看到的商業片的刺激情

  節及較高幅度的情緒渲染，其實電影本身調性一直都是很冷靜的鋪述整個事情的開始、發

  生及結果。


  另外我想插個話題，迷妹專屬！因為個人習慣幾乎先不查資料進去電影院，由演員們與劇

  本來帶給我我最真實的驚喜，所以我有看到蕾雅瑟杜（全劇頂著個肚子的少婦還是好正啊

  ）但沒特別注意其他名單，所以當柯林大叔出來時整個花痴大開！柯林大叔的海軍將官服

  實在太正點了！感謝電影選角正確！軍裝柯林大叔＋50分（誤...


  好回正題，其實電影很快就進入主題了！大概交代一下大概主要人物生活，上艦檢查員就

  開始在反映魚雷溫度過高，但其實一直沒有太多人很介意這點；直到第一個人為災難前：

  檢查員報告已過溫請求提早發射，但高層並不當一回事要他們再等指示，於是第一個災難

  發生，過溫的魚雷於是爆炸了，理所當然其餘的魚雷接連引爆；即使當下於艦內剩餘人員

  皆以正確方式應對關艙隔離，甚至於引爆區域的人員提到為避免再度發生車諾比類似事件

  ，已註定殉職方式決定守住雷區以降溫冷卻避免其餘的爆炸污染；但當對比到影片後段，

  安逸於岸上的高層，卻遲遲無法作出有效救援的決定造成悲劇的發生，實在唏噓。


  影片有兩部分令我覺得特別有意思的：一是岸上罹難家屬，有一人是父親從軍罹難，但後

  來軍方有派援助並歷劫歸來，兒子也再從父職，所以父母是非常信任軍方的，因此當第一

  次家屬抗議軍方時,該家屬提出「你們應該要信任軍方的！」但是後來的演變是，心急的

  家屬們眼見各國皆已表態願意援助，可軍方仍完全封鎖消息，沒有任何幫助的感覺的時候

  ，該名母親終於起身抗議崩潰了！我想這對老軍人無疑是沈痛的背叛與打擊；軍人們上戰

  場最大的依靠便是國家，相信自己遭遇不幸，國家仍然會竭力為了戰場上的士兵著想。但

  今天的場面卻是高官只想息事寧人，推矮罪過（包含爆炸的發生及因設備皆變賣,剩餘物

  資並不足以達成這次救援任務）及保持官方的面子（不想讓人知道自己國家軍艦因自己的

  失誤而爆炸且竟無力救援），甚至用權威鎮壓面臨可能喪失親人的悲痛心急的家屬們。


  另外透過男主角的兒子，在一開始船艦出港的時候，眾人的祝福追逐中，只有這名男孩眼

  眺遠方，一方面像是預言此次的出海不順，另外我想也點出了軍人為國的犧牲，甚至無法

  好好陪伴孩子成長，以及後來一件一件事件，即使母親使他另外安置，但眾人的言語及官

  方的推託，其實皆深深烙入孩童心裡，直至最後用著憤恨的眼神看著發言人高官，即使是

  最弱小的孩童，但也亦是用他僅有的武器，憤恨的眼神及無需給予虛偽任何的面子，來對

  這太過複雜心機的大世界做小小的對抗吧！


  這部片不能說是爽片，但我卻非常開心沒有錯過它！除了他冷靜的描述，也給了很多反省

  的空間。人類有多少悲劇是由於野心的軍事造成的，又有多少的悲劇是為了自私及其餘政

  治理由，將生命與之放在對等天秤上後，甚至犧牲了他人生命。


  這個事件，這部電影，我想比起疏忽，更多是人為且原可補救的悲劇，我想這才是全部裡

  最可悲的...


  --'
