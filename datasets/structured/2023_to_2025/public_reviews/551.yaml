url: https://www.ptt.cc/bbs/movie/M.1585572376.A.586.html
title: '[負雷] 深海終劫站 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這部片的過程不太科普，細節沒描寫到多少，


  浪費在海底深處的巨大潛艇或探勘場這個設定，


  動作場景都拍的太近太混亂，然後每個人都穿一模一樣的太空衣，


  妳根本看不懂哪個人在幹嘛，


  怪物長得很像咕嚕，出現的莫名其妙，


  怪物兩次吞女主角的頭罩都壓不出一咪咪的裂痕，讓我覺得怪物是不是很爛?


  可是話說前面有個男的的太空衣被怪物從背後弄破耶，所以這是???


  一開始的黑人便當發的有夠隨便，你拿個爛頭盔還敢去深海探險啊?


  中間白人男子就是太空衣被怪物弄破那個，也是為了增加驚嚇感而死，


  船長也是白死了，最後面女主角被怪物整個吞進去，結果從怪物的胃開槍怪物就死了，


  所以說船長為了救女主角而死也是白犧牲，因為怪物不合體就是這麼廢。


  我完全看不懂場景是從哪裡移到哪裡，因為都是特寫拍太空衣誰知道旁邊長怎樣。


  最後面怪物大合體變成大怪物，我以為在看血源詛咒還是邪靈入侵，


  三個太空艙壞一個，老梗、女主角留下來，老梗、女主角自爆潛艇幹掉大怪物，老梗。


  看完我只記得女主角是暮光之城女主角，為了改變形象接了女大兵形象的角色。


  船長是瞞天過海2的飛狐嗎?感覺有點像。


  華人女該不會是景恬吧?不太像，不然又多了一個景恬宇宙。


  如果是什麼深海幾千年以來的大怪物之類的還有帶入感，


  這個天外飛來長得像咕嚕的怪物在深海裡我真的沒有辦法有帶入感。


  --'
