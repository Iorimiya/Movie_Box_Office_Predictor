url: https://www.ptt.cc/bbs/movie/M.1580041541.A.17F.html
title: '[好雷] 深海終劫站 適合喜歡深海的人'
content: '想發文為這部平反一下


  不知道這邊有沒有人玩過玩過SOMA或Narcosis

  深海一直都是很棒的恐怖題材

  這部深海恐怖我覺得都表現的很好


  電影開頭完全不介紹角色直接炸掉我就很喜歡

  省略了怪物類型電影最無聊的地方

  說真的 我也不怎麼在意角色

  角色個性出來而且行為符合就夠了

  而且不管是隊長女兒還是女主角老公後面都有提到

  因為隊長死了的情緒轉折也有

  以一部怪物電影裡面的角色我覺得很夠了


  深海的恐怖方面真的很棒

  完全的黑暗 未知的生物

  只有呼吸 心跳 還有水流聲

  深海極限的心理恐懼

  尤其是第一次開門要出去的時候

  黑人直接在門口炸掉的部分

  沒有人知道自己的頭盔到底撐不撐得住

  只要有小小一個洞或裂縫就馬上會被壓扁

  這段超棒的

  原本我覺得炸掉之後的沉默是擔心自己

  結果是黑人自己換的倒是蠻意外的


  怪物的話要說克蘇魯其實還是有講是挖到一個海底的熱水洞裡面的能自給自足的怪物跑出

  來

  怪物整部佔的比例沒到很多

  但是出場的地方我很喜歡

  第一個小隻的跳出來蠻無聊就是了

  後面第一次真的出場的地方真的驚艷

  應該說在深海看到人型的怪物真的出乎意外

  燈光照不到的地方有兩個眼睛發光的東西在跳動

  那個跳動的方式我禮拜四看現在還記得

  後面被拖到平台上後爬上來才真正看到整隻的外觀

  慢慢爬過來秀出整隻的樣子

  這段我整個人跟女主角一樣呆到完全不會動 讚到不行


  後面最大隻的出場很有魄力

  尤其是出場前因為深海黑暗看不到

  用信號槍(？)出場的方式真的很不錯

  不過沒太多戲份很可惜



  其他地方我覺得都沒什麼不好

  氣氛 劇情 結局我都沒太大意見

  光是上面我提的幾點我自己就覺得值得了

  板上文似乎跟我想的差很多

  其實這部我看起來沒啥環保意識

  比較像是絕望的時候找的理由而已

  還有其他幾點我也講了

  反正我很喜歡這部

  負雷的人我搞不懂你們

  也許我個人喜歡的點你們都討厭

  對題材有興趣的話看就對了


  --'
