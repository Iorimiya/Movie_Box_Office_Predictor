content: "雷文防雷資訊頁\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n1.影片名稱\
  \ :水行俠\n\n2.觀影時間 : 12/12 20:00\n\n3.觀影地點 : 新光4DX\n\n4.觀影方式 : 自行購票\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  此區為發文防雷頁\n可選擇性提供上列 1~4 資訊  或不提供亦可\n觀影心得於分隔線下方發布即可\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線\
  \ ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n        盧卡斯曾說過：「星際大戰是一部肥皂劇，只不過以太空為背景。」，那水行俠\n\
  則完全可以譬喻為深海的星際大戰。\n\n        尤其在文戲方面，以一個字來形容的話，就是Cringe。不過是個100分的Cringe-\nWorthy。像是與武爾科回憶的橋段明顯有參考鋼鐵英雄，但不確定是不是因為配樂、對白\n\
  的關係，完全沒辦法讓我像觀看超人時一樣感動。或者是最後歐姆請求亞瑟殺死自己，女\n王前來阻止的出場，真的只有滿滿的尷尬。坐在我後方的觀眾還直接笑了出來。\n \
  \       不過慶幸的是，電影在節奏方面算抓的剛剛好。內容豐富但不會有像自殺突擊隊\n以及正義聯盟中非常嚴重的問題。\n\n        故事分了兩條主線，分別是亞瑟線及歐姆線。雖然每個角色的塑造都非常的有特\n\
  色。但同樣的，因為對白及演技的差距。亞瑟、梅拉、黑蝠鱝整個被歐姆、卓哥及綠惡魔\n力壓下去。\n        黑蝠鱝對水行俠見死不救及父親自殺的憤怒表達讓我以為他在演舞台劇，梅拉真\n\
  的正、好正、超正，但她的演技真的完全沒辦法與另外三位相比。尤其是她在宣告亞瑟為\n新國王那段，整個只有尷尬。亞瑟的問題則基本上與梅拉差不多，但相對來說較好一點。\n\
  \n        好在兩方碰面的時候，基本上就是動作戲與CGI大戰了，這次的王位爭霸戰真的\n是我看過超英片中最棒的之一。僅次於鋼鐵英雄的smallville大戰以及BVS的蝙蝠俠打戲\n\
  ，動作戲也是非常俱可看性。CGI大戰更甭說了，美麗、爽度及震撼面面俱到。\n\n        總結來說，溫子仁這次繳出了一個非常亮眼的作品，塑造了一個美麗已及壯觀的\n\
  海底世界。雖然文戲有些許問題，但水行俠的可看性真的非常高。不得不說亞瑟的經典套\n裝，在片中的呈現整個帥到爆炸啊！\n\n\n 然後也希望溫子仁別在超英片玩音效嚇人梗了QQ\n\
  \n--"
