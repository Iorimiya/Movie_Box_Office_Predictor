url: https://www.ptt.cc/bbs/movie/M.1210172110.A.6DC.html
title: '[影評] 傻愛成金》：當絕配冤家深海尋寶'
content: '看完感覺還OK  其實沒那麼差阿  光看海天一色也頗舒服的

  推薦給那位想約會的朋友^^



  《傻愛成金》看起來是一部很適合給約會的電影作品，男女主角凱特哈德森、馬修麥康納早就在絕配冤家中合作過，加上導演又曾經指導過浪漫愛情喜劇全民情聖看來十分有看頭，很內容也類似著深海巡寶加上《六天七夜》的東西。



  故事描述馬修麥康納以尋寶為重心，一直企圖尋找1715年18世紀皇后遺失的寶藏，婚姻跟生活幾乎可以說是一團糟，因此凱特哈德森跟他離了婚。馬修為了尋寶有足夠的資金，於是找上了富翁唐納蘇德蘭，此時又遇上了凱特哈德森，兩個人也一起開始尋寶的旅程。


  這部電影基本架構其實很類似深海巡寶，只不過加上許多搞笑愛情元素，然而海底尋寶電影本來就不是很好拍，在水中拍攝很容易導致劇情拖泥帶水，深海巡寶就是前車之鑑，而在本片裡頭的基本要素也跟深海極為類似，或者是類似著其他尋寶電影，尋找各種線索找尋寶藏位置，各路人馬也都想要來搶，然而本片也是犯了在水中拍戲的毛病，在尋寶過程中劇情其實不太緊湊，每一段的劇情很像是拼湊在一起，甚至有時候會覺得導演是不是沒有把電影給剪接好，把一些多餘的劇情全部都剪進去，比方主角在敘述寶藏的來源就顯得很囉哩囉唆，更何況在水中拍戲就很容易把電影

  步調拖慢，本片也犯了此錯誤。


  凱特哈德森跟馬修麥康納之前合作過《絕配冤家》，在前作可以看到兩個人合作十分速配，到了本片裡頭雖然還是歡喜冤家，因為劇情的關係總覺得兩個人的愛情有點略顯刻意，失去了上一集兩個人的那種銀幕化學反應，何況兩位主角大多是呈現溼答答狀態，想要美美的拍戲實在很難，一些比較厲害的笑點也大多都是在預告裡面，使得這部尋寶愛情電影已經不像是絕配冤家那樣有趣，讓人失望許多。


  電影大多靠著主角本身魅力來吸引，凱特哈德森在裡頭演出還是很甜美，即使這次不能穿著時尚的服裝，原本就很擅長愛情喜劇的她而言算是輕而易舉，而馬修麥康納其實演過很多愛情電影，他很擅長演出那種放蕩不羈卻又是好男人的角色，其實他在裡頭演出也不錯，何況兩個人老是要上山下海看得感覺就很辛苦，除了這兩位主角以外，其他演員幾乎是無從發揮，老牌演員唐納蘇德蘭在裡頭明明很會演戲，可惜被角色設定。我不知道編導為什麼要特意描寫富翁跟女兒之間的關係，顯得很多餘，我一直都覺得飾演女兒的配角有點不會演戲，刻意裝笨的感覺多少有點效果，只是

  不知道是裝笨還是真笨就是了。


  電影雖然缺點多多，但是整體而言還不會爛到哪裡去，後半部壞人追殺還蠻緊湊跟搞笑，或者是瀑布的效果也還不錯，如果在情人節想要看個約會電影，本片尚可選擇，但是比起兩個人的前作，《絕配冤家》可是比這部電影好看多了
  。






  --

  永保赤子之心!

  SO. LET US BE OURSELVES!


  --

  ◆ From: 220.141.44.202'
