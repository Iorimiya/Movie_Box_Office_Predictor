title: '[好雷]庫爾斯克號：深海救援—對誰而言究竟為何'
content: '原本在考慮要看"我們"還是"庫爾斯克號：深海救援"，但是由於本人俗辣一枚QQ


  實在不想付錢被嚇，所以就挑了從預告片就很吸引我的庫爾斯克號來看了。










  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~










  "庫"片在以小寓大這方面做得十分優秀，可以從影片各段逐漸拼湊出整個大時代


  的樣貌，前面已經有人說過，所以就不獻醜了。這篇主要是從"To Whom They Are"


  的角度出發，簡單來說，個人認為"庫"片之所以動人心神，是因為片中受困者，


  對外界角色的意義不盡相同，在無可避免的碰撞下，所激發的火花。









  ------------------------------再防雷一次------------------------------









  海軍世家，代代奉獻，經歷喪偶之痛後，如今連兒子也難逃一劫，儘管心急如焚，


  Oksana仍然在一片混亂中率先跳出來安撫情緒，3個禮拜後的平安歸來，無疑是給


  所有人打了一劑強心針，但其實她心裡的著急，一點也不亞於無助的妻子們。


  強押著心中的不安，焦心等待後，卻換來第二次會議上高階將領的睜眼說瞎話，


  至此她終於按捺不住，聲嘶力竭的指控，全然把先前對Tanya的埋怨拋諸腦後，


  不只是針對席間的官員，更像是對這世代詛咒的悲鳴，激烈到只得用麻醉才能


  將她帶出場外，也激烈到全場無不為之氣結，只因對母親而言，那是親生的骨肉。





  對比司令到場前的整肅以待，在場時的戰戰兢兢，那收到敲擊聲時的失態、


  在搶救艇對接裝置不管用的情況下，依然多次下水，不顧電量告急，那沒連結上


  誓不離開的決絕、在演習途中毅然決然關閉引擎，只為捕捉一絲希望的決定、


  收到上級禁止外援的指令，不惜頂上烏紗的悍然抗命，主角曾對妻子說過：


  「大海會改變一個人，所以水手絕不會對水手見死不救。」他說對了，因為直到


  最後一刻，他們都沒有放棄，只因對船員而言，他們同是水手。





  准將在全片中，說是最接近現實的人也不為過，他把局勢看得一清二楚。他明白


  俄國不會輕易讓他們介入，卻仍第一時間要求各據點準備隨時出發，他了解俄國


  心存顧忌不干示弱，所以他放低姿態，懇求著上將接受協助，也因為這些種種，


  當艙蓋掀起的那一刻，他的泛紅眼眶更讓人揪心，清醒作為最大的夢魘，在他身上


  嶄露無遺，明明每一步都做對了，結果卻苦澀到讓人鼻酸，對准將而言，那是


  他屢次的妥協，卻未能救回的人命。





  受困深海的恐懼始終縈繞不去，在難以獨自承受的壓力下，從井然有序的指揮，


  到以身作則的犯險，到打成一片的揶揄，到生命盡頭的合唱，求生意志下的崩潰，


  更換匣箱時的失誤，中間並非毫無顛簸，但在互相扶持之下，他們更加凝聚在了


  一起，最極端的險境，卻也散發出了最溫暖的光輝，Here''s My Heart And Here''s


  My hand. 對彼此而言，他們是兄弟，更是一體。





  從開頭婚禮上，主角對Darya的一席話，受困時對Oleg的提問，以及最後留下的遺書，


  才真正體會到，儘管片中著墨極少，卻潛藏著一種極其隱晦，卻無損半分的愛。


  遺書中有句話是這麼說的：「沒人能擁有永恆，我想給你更多，你就是我的永恆。」


  從中透露出一股尚未付出所有的無奈，但當你把對方視作永恆的時候，你怎麼可能還


  有所保留呢？那短暫的時光，對妻兒而言，已是一切，亦為永恆。





  老實說看完整部片，最主要的感受是滿滿的悲哀，片中角色們是軍人，是丈夫，


  是父親，是兒子，是同袍，是水手，但最後都被棋子這角色給抹殺了，那是一種


  對實際政治的妥協，可以理解，但同意與否，終究是由自己決定，人有著千百面貌，


  但不能忽略他的本質，不然跟否定了自己有什麼兩樣呢？






  --'
