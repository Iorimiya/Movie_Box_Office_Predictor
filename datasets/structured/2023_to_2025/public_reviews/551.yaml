url: https://www.ptt.cc/bbs/movie/M.1449520839.A.992.html
title: '[純心得無雷]深海攔截大海怪'
content: '大家好

  我是專看恐怖片的LittleDiDi

  我又來跟大家介紹恐怖片了



  Blog圖文版會更精采



  年份：1998


  國別：美國


  類型：怪物


  導演： Stephen Sommers


  [劇情簡介]


  一艘遊輪被貪婪噬血的怪物所盤據，受僱走私的約翰費尼根（崔特威廉斯飾）領隊的「塞

  班號」恰巧接近這艘郵輪，他的船員包括凱文歐康諾飾及大副萊拉（伍娜戴蒙飾）。當費

  尼根將他破損的「塞班號」停泊在「亞格遠征號」旁並攀爬上船時，發現處處都是遊輪遭

  到襲擊的痕跡，甲板上到處都是血，空氣凝重，靜默中充滿詭譎的氣氛。


  貪婪噬血的怪物開始了牠們無情的攻擊，一個接一個地攫取還活著的人。遭到偷襲的人們

  陷於無路可逃的絕境，時間分分秒秒地過去，即使最後倖存的人也將難逃，遊輪上現在只

  剩下費尼根、珠寶大盜崔琳（芬柯傑森飾）、船長（德瑞克歐康諾飾）、遊輪老闆坎頓（

  安東尼希爾德飾）及凱文歐康諾。他們活著離開已經變成不可能的任務。




  印象中網友的點播，自認怪物片寫得也比較少，就趁這個機會寫一篇囉。蠻特別的一部怪

  物片，走的不完全是傳統怪物潛伏吃人的套路，劇中人物除了要避難外，還各各心懷鬼胎

  ，讓電影多了分濃濃的衝突氣息。


  若非充斥太多導演自以為是的幽默，我覺得還算不錯看。


  《深海攔截大海怪》是導演Stephen Sommers成名前自編自導的作品，作品不多，但也都

  小有名氣，神鬼傳奇》、《神鬼傳奇2》、《凡赫辛》、《特種部隊:眼鏡蛇的崛起》這些

  ，還算有點功力。不過不諱言，雖然本片有場景有爆破，還有現在看起來很鳥的特效(就

  當時看應該也是很鳥)，能拍成這樣的成本卻不算高，但是票房卻更為慘不忍睹。


  本片大致可以可以分為三個陣營，一則為美輪美奐的豪華郵輪上，滿山滿谷的有錢人在裡

  頭開趴賭錢好不愉快，然後來點懸疑的元素，某不知名人士用了些old school的手法就把

  郵輪給癱瘓了，當然怪物不可能跟人類串通，只是剛好這個時候怪物就進來趁火打劫了。


  另外一個陣營就是弱到不行的主角群，主角經營的應該是某種營利至上的特殊貨運船，這

  趟載的是一群牛鬼蛇神的第三方陣營，目的當然就是那艘郵輪，所以很簡單地觀眾應該就

  可以把劇情給搞清楚了。另外一條小小小小的支線就是女主角，得了不偷東西會死的強迫

  症，看他秀了幾手就被抓包了這樣。


  會說這部片有點特別，主要是因為幾點算是有點顛覆傳統怪物片的公式。首先，我曾經說

  過，怪物片很大的罩門在於，電影為了營造步步進逼、節節升高的危險氣氛，一向只能選

  擇用前期偷偷來後期就整碗端走的方式在吃人。為了免除這種尷尬期，本片則是設定了讓

  一票心懷不軌的特種部隊，各表其強大的人物特性，也因此造就本片的反派腳色風采遠比

  主角鮮明的奇觀。


  這段時期看得見的就讓主角與反派一開始就同舟共濟並衝突不斷，另一端看不見的則讓怪

  物撕裂郵輪，某本小說課曾經說過這種敘述法好比《三國演義》中的「溫酒展華雄」，只

  給你頭給你尾，中間精采的全讓觀眾自行腦補，確實也是一種規避前期過度無聊的好方法

  ，不會有那種怪物明明就很OP卻在那邊「夭鬼假細禮」的違和感。


  怪物的表現終究還是決定本片價值的最大主因，所以我們就來看看導演怎麼處理了。


  先來檢視怪物的戰鬥力，本片的怪物可以說非常猛到有點誇張，不僅利用地形環境猶如飛

  天遁地，最危險的就是走在水裡隨時可能會被拖走，走在高空鐵架也不能掉以輕心，一旁

  隨時可能也會有觸手過來吞人；幾個死亡場景都透露了「沒有任何可以認為是安全的地方

  」，並且死亡人數眾多，緊張的氣氛足令觀眾如坐針氈。


  剛剛說過了，本片的反派腳色風采遠比男主角鮮明的奇觀，特此來說明一下是什麼情形。

  首先，我得說本片的男主角大概是我看過最路人，說帥嘛......好像也還好，說有啥特別

  長處嘛......在這麼OP的怪物面前你叫藍波來應該也是個屁，但就因為他是男主角，便配

  了個女主角給他，順便給他甚至被抓了怪物也想拿到眼前欣賞幾番自表的蠢橋段。


  相比於男主角，反派腳色群可就各各有個人特色多了，可惜的是導演的安排下，十個有八

  個都死得很蠢，因為真的太蠢了，我打算在後面給個人物列表，好好介紹一番。不過死得

  很蠢也可能是導演自己的妄自菲薄，將本片定位在B級片，因此許多人物的情感反應，看

  了實在都覺得既傻眼又多餘，。


  比如說看到誰蠢死了，主角與女主角還會互望來個「oops!!」挑眉。哈哈，怪物沒把你們

  吃掉真的只是主角們威能啊。


  另外在本片可以看到許多其他經典電影的影子，比如說郵輪本身就是《鐵達尼號》變成《

  嚇破膽》(但後者比本片晚)，滿是血肉的長廊就想到《鬼店》，水中潛伏逼近則想到《大

  白鯊》，觸手吞人則是《大蟒蛇:神出鬼沒》，水中通道與《異形4》的經典片段如出一轍

  (但私心覺得異形游泳壓迫感強大多了，不是本片怪物弱，是被抓根本就沒救了，看死人

  跟看逃命差很多)。


  整理來說還算不錯看，沒有什麼冷場，死亡人數多不勝數，怪物也不是省油的燈。只是本

  片滿滿充盈了B級片的味道，人物對話與情感描寫都很無腦，差不多就是看怪物吃人與主

  角沒能力有強運的電影。


  B級片專映電影台有機會遇到真的可以看看，但不要看很多次，我會覺得很瞎。


  即刻短評


  劇情：  3.5       >>不單單是部吃人的怪物片，還有正反派的爭鋒相對

  結局：  3         >>怪物有必把食物拿起來欣賞耍蠢嗎?

  血腥：  3         >>不算很血腥，用餐處滿山滿谷的屍骨有點屌

  氣氛：  3.5       >>頗刺激沒什麼冷場，只是B級片限定

  推薦：  3.5       >>還算不錯看啦，但我不會想再看第二次


  --

  哈哈，可能我對怪物片比較沒fu


  我沒講到結局吧

  聊點劇情就叫爆雷

  有事嗎?

  還是我講這片會死人很意外?


  笑了

  點到為止而已

  那電影公司都不要寫劇情簡介

  也不要做花絮

  不然全都爆雷了

  標題已改

  認真覺得劇情僅點到為止

  要重點有重點

  該保留有保留

  本人旨在介紹電影

  不曉得在這種地方小題大作有何意義

  反正2是自由的'
