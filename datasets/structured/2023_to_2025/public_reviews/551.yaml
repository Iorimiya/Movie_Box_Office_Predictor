title: '[好雷] 《庫爾斯克號：深海救援》政客下的犧牲品'
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  1.影片名稱 :庫爾斯克號：深海救援


  2.觀影時間 : / 3.19 19:00


  3.觀影地點 : 戲院名稱 / 住家網路 / 其他等地點 (單選:自行刪除選項) / 絕色


  4.觀影方式 : 自行購票 / 片商(商家)邀約 / 電視 / 網路 (單選:自行刪除選項) /特映

  會


  夾銗L防雷說明(非必要) : n刷等其他說明請於此區說明....可留空




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  此區為發文防雷頁

  可選擇性提供上列 1~4 資訊  或不提供亦可

  觀影心得於分隔線下方發布即可


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  人生難得有幾次的恐懼，是比絕望還要絕望的境地...


  改編自史上最嚴重艦艇沉沒事件，場景發生困在深手不見五指的海底，《庫爾克斯號：深

  海救援》就是一部沉重、寫實、卻也揭發政府官員種種無能的作為和愚蠢的官僚制度，罔

  顧保家衛國的前線作戰士兵，十足的政客操弄讓遺孀們感到心寒...




  故事大綱：俄羅斯一年一度的演習，庫爾斯克號內部魚雷因化學溶劑外露導致自爆，造成

  潛艇內部重大傷亡，118名船員僅剩23名倖免逃過爆炸，艦艇沉沒在巴倫支海2000呎深處

  ；岸上的家人不斷拼命地與官僚鬥爭，船員們依靠僅存的糧食與氧氣等待救援...


  以下有雷，請自行斟酌
























  2000年8月10日，超過兩個足球場大的庫爾斯克號，這艘號稱“永不沉沒”的驕傲艦隊，

  在俄羅斯北部進行海軍訓練。這是俄羅斯十年來第一次演習，共有30艘船和3艘潛艇參與

  。兩天後，庫爾斯克號發生兩次內部爆炸，艦艇沉沒在巴倫支海北極水域的底部。船上的

  118名船員中只有23名倖免於爆炸。在接下來的九天黃金救援期，全世界都開始關注，但

  救援行動和外國援助都被俄羅斯政府嚴正拒絕，所有船員命懸一線。


  《謊言的烙印》丹麥籍導演-湯瑪斯凡提柏格（Thomas Vinterberg）拍攝《庫爾斯克號：

  深海救援》是他第二部挑戰英語長片電影，可惜的是因為筆者之前看過《潛艦獵殺令》，

  對於俄國人就應該講俄語的觀念有點根深蒂固，稍嫌覺得美中不足，然而在電影劇情，本

  片其實從開頭小孩子沙夏的憋氣就已經為後續劇情走向鋪路。


  雖然電影中段故事未免有些冗長，幾度差點以為要救援的片段都再再挑起我和振奮我內心

  的情緒，不得不說導演和《搶救雷恩大兵》編劇-羅伯特羅達特（Robert Rodat）執筆，

  由法國製片公司「EuropaCorp」製作，《攻敵必救》的執行製作人-亞歷桑頓擔任製片，

  真的很會掌控觀眾的心。


  主線雙視角，一是被困在海底的男主角（身材好又長得帥），另一方面是從眾太太們與俄

  國軍事家希望從中獲得「交代」，卻不斷得到官方說法的回應，應證了民主國家沒有政治

  家、只有政客這回事，想做事的人最終只有被奪權的份...


  當然本片最大的驚喜莫過於來串場的奧斯卡金獎影帝-柯林佛斯、《紅雀》馬提亞斯修奈

  爾飾演電影中的主要角色，還有他的妻子蕾雅瑟杜（你肯定想不到她之前是演007的性感

  女星呢XD)敬業精神相當令人佩服



  這部電影的結局其實上網google就能知道，然而看到的當下依然沉重萬分，腦海裏滿是如

  果再早一點接受外援就好，甚至覺得俄國政府把軍備當作兒戲，如此的電影相信在俄國應

  該是會被禁播的...回歸到歷史層面，當時許多國家和非官方機構曾經提出幫助，但均被

  俄羅斯政府拒絕了，因此也被民眾抨擊是場『政治謀殺』，存活下來的遺孤總共有71名，


  在接近片尾的時候還能感受到上將的名望掃地，連遺孤們都不願向其致意，孩子的單純果

  然是最能直接分辨善惡的，裡頭我最表揚孩子的演技，尤其是爸爸出航後前後性格的高反

  差...母親們的真摯演出也是相當動人，挨針那一幕我不禁泛淚，這就是極權政府假民主

  之義行專執之實，就因為如此，這是部多元性質的走心片，非常推薦給喜歡看劇情災難片

  的影迷，希望你們會喜歡～


  PS 海軍唱歌那一幕，和北極熊這兩段，建議一定要專心看


  --'
