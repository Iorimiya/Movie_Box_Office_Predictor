url: https://www.ptt.cc/bbs/movie/M.1593764939.A.DE7.html
title: '[負雷] 千萬不要帶腦看的  深海擴散 Sea Fever'
content: '雷文防雷資訊頁


  開頭碎碎念：

  原本去台東玩的，因為那時太陽正刺人，不適合戶外景點（我就怕熱）

  於是朋友就提議去秀泰，朋友就提議看這部了，跳過了死侍２、羅根、音速小子。

  我當時看完後，真的想掐死提議看這部的朋友。


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  時間：2020.06.27 14：00

  地點：台東秀泰影城

  票價：學生票230

  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  OK，當初看的時候可以發現開頭環繞著幾個主題，後來卻隨著劇情逐漸失焦，

  最後看到的就是跟這船一樣，一團亂。

  主角西沃恩的不善與人相處的症頭、深海未知生物的恐懼、愛爾蘭的民間傳說、環保議題？

  紅髮女子出海的禁忌？最後再加一點，要選擇自我犧牲還是全世界的，道德困難選項。

  BlaBlaBlaBla.....這些充其量是個點綴，或是很好的題材，但是都被玩砸了。


  中途一連串角色們的降智行為，讓我覺得這艘船會死到最後剩兩人，是自找的，

  裡面的超深淵生物，抱歉，我都叫祂深海大菊花。

  先是女船長，很珍惜船員跟船，所以看到要電船時，還哭著反對，

  雖然是要強調她很珍惜船，但是看來有些矯情，尤其是結尾又安排她棄船的橋段。


  副船長，老梗的恐怖片中會有的不信邪的傢伙，帶著一堆老梗戲碼，執意要去經濟海域、

  在另一艘船發現不對勁，卻選擇隱瞞。


  其他還有看起來很像一家人的船員們，但是說真的，讓我以為在看玩命關頭，

  只差船長沒喊出Family了。


  西沃恩，有太多欠人吐槽的舉動了，就說她為了要讓全船強制在海上隔離，

  就弄爆引擎的舉動，不知道她有沒有想過之後的配套。

  最後感染了於是她選擇自殺？What the Fu......妳只是有傷口，連感染都說不上好嘛。

  我本來想大聲斥責她，但她實在太大了，就這樣吧。

  即便是看完後的現在，仍會不時回想那90分鐘的劇情，我看是劇情在我的腦袋裡擴散吧。


  --

  你知道他們想要什麼？他們想要埋頭苦幹的工人、乖乖聽話的工人。

  這些人足夠聰明去操作機器和處理文書。

  而且蠢到能甘心接受那糟糕無比的工作、微薄的薪水、超長的工時、無償的加班。

  　　　　　　　　　　　　　　　　　　　　　　            —喬治‧卡林


  --

  真的，本斥但大。

  從感染到眼球爆開還有段時間阿。

  最早死的水手，不是整隻手嘎到機器裡，更不用說副船長感染了，還活蹦亂跳的。

  西沃恩自己也只看到傷口，也不太確定是不是感染阿，當時救援船也來了。

  我指的是結局自殺潛回去，真的不是唯一選擇，讓觀影的人覺得莫名其妙。'
