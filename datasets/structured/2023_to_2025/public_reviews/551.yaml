url: https://www.ptt.cc/bbs/movie/M.1579804291.A.E81.html
title: '[無雷] 深海終劫站 克蘇魯系佳作'
content: '當初看到這部的預告就很有興趣了，

  上映當天就馬上去看。



  以下單純是個人心得，

  無重大劇情雷，大家可以參考一下。



  開頭完全省下了主要角色的背景故事鋪陳，開頭不到五分鐘就馬上進入狀況，以女主角逃

  生的視角一一帶出其他角色，並且很快勾勒出每個角色的個性。



  但也因為主線劇情簡單扼要，所以也不必期待有什麼深度劇情，這既是優點也是缺點。



  全片都是在海底基地以及伸手不見五指的海中進行，和《異形》、《顫慄異次元》一樣壓

  迫感超重，充滿了密閉空間式的恐懼。



  坐在影廳內，感覺就像和片中角色一起身處在孤立無援的汪洋深處，不需要使用現在泛濫

  的jump scare就有滿滿的驚悚感。



  也能感受到美術的用心，從畫面色調、深潛裝的設計到怪物造型都很有質感，



  全片的呈現真的很有洛夫克拉夫特式的未知恐懼感，怪物第一次出場時，我的第一個想法

  就是「這東西到底是三小？」。



  最值得讚許的，就是整部完全沒有一個是因為自己耍腦殘而領便當的角色，這點對這類型

  的怪物片而言真的是很不容易的，劇中角色的死亡都是合情合理。



  總之如果喜歡重於氣氛鋪陳、喜歡克蘇魯風格的怪物電影，那麼我很推這部片。



  不過我也能理解有人會覺得很沈悶啦，這見仁見智。




  最後祝大家新年快樂。








  推文防雷





  --

  打太快沒發現xD

  「克蘇魯風格」這句哪裡有問題？'
