title: '[好雷] 庫爾斯克號：深海救援─令人無奈的救援過'
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  1.影片名稱 : 庫爾斯克號：深海救援


  2.觀影時間 : 前幾天


  3.觀影地點 : 戲院


  4.觀影方式 : 特映會





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  此區為發文防雷頁

  可選擇性提供上列 1~4 資訊  或不提供亦可

  觀影心得於分隔線下方發布即可


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  過去已有許多類似劇情主題的電影，每一部都有自己主要想表達的涵義。而深海救援的主

  題關於沉重的無力與憤怒。電影花了許多時間停留在男主兒子米夏的眼神上，好像試圖讓

  人們從孩子的角度來看這場大人的鬧劇。


  從這場令人深感惋惜與遺憾的災難，看到蘇俄一開始就呈現出無能、無力、無奈的狀況，

  後續拒絕他國救援的政策也就符合了這樣的期待。當俄國投射出的預期是無力的，當然就

  得到一個無力的結果。


  在電影院看這部電影相當震撼，每一次的爆炸都伴隨座位的震動，幾次被嚇得跳起來。看

  完的感覺並不是難過，而是深深的無奈，原本可以救得回來的一船艙的人，卻因為一連串

  的判斷錯誤、國家利益考量，失去了寶貴的搶救時間。











  --'
