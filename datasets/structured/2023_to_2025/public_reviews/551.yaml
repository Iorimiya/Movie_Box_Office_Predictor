url: https://www.ptt.cc/bbs/movie/M.1599515099.A.490.html
title: '[問片] 找一個跟深海異形有關的電影'
content: '找一個舊片

  小時候看的(可能是DVD剛開始流行的那些年)

  大略的劇情忘了(演員也不記得有誰了)

  不過我盡量將想到的瑣碎資訊提出來



  應該是好萊塢的電影

  整個故事都在深海的(類似科學用)潛艇內發生

  他們在深海活動的過程中遇到異形(或外星人之類的)

  有點忘記那異形是否明顯有形體的


  但重點是那個異形可以寄身在人類體內

  並且能夠控制整個人

  差不多就像鬼附身那樣

  不會有類似殭屍的反應

  反而像正常人一樣

  差別只是說比較精明、邪惡，想進一步侵略所有人類


  電影主軸大概就是人類發現有這狀況後

  開始對抗這些異形以及被寄身的人


  一直到電影要結束時，經一番大戰

  讓觀眾以為看似人類贏了

  結局卻是你以為那個活下來的人類，根本就被異形寄身了


  而這個存活又被寄身的人類則搭著潛艇慢慢浮上

  (電影結束)


  結束的部分也暗示這被異形寄身的人上岸後整個人類世界就慘了

  整個就是悲劇收場



  這片我有試著去Google看看

  用了類似的關鍵字：海 寄身 異形 潛艇

  深海異形的電影滿多的，不過找了很久都沒找到

  不曉得是不是我以前看的這片評價比較差或不有名所以不好找


  希望神通廣大的板友知道的話可以跟我說這部片名

  拜託了

  謝謝!


  --'
