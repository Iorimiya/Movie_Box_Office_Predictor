url: https://www.ptt.cc/bbs/movie/M.1580109043.A.A20.html
title: '[好雷] 深海終結站—面對未知的選擇'
content: '開頭無雷簡單介紹一下。


  深海終結站顧名思義是在深海裡發生的故事，背景是一家原油鑽探公司位於海下十公里的

  探測站。


  女主角諾拉（克莉絲汀史都華飾）是隸屬於探測站的一名機械工程師，和其他許多員工共

  同長時間居住在深海下。


  和許多驚悚片一樣，本片有災難元素也有怪物。如果熟悉H.P.洛夫克拉夫特的克蘇魯神話

  ，在怪物們出現時會感到非常熟悉，其外形相當還原神話體系中的對應神與眷屬。


  當然，不熟悉克蘇魯的也沒有關係，《深海終結站》拔除這點毫無影響，劇情主要著墨於

  主角隊伍面對未知恐懼時的應對，以及如何做出選擇。


  全片沒有冷場，開場直接進入正題，全員智商在線無豬隊友，深海內壓迫感營造得非常好

  。


  以下有雷。


  —


  這片最有趣的地方在於，主角隊伍在每個分叉點做出的選擇。有別於怪物一直追的一般驚

  悚片，片中絕大多數時間都是由主角們冷靜決定此刻該做些什麼。


  我並不認為此片沒有人物刻畫，並不是只有透過劇情堆疊才算進行刻畫，面對危機時的反

  應正是人最原始的性格呈現。


  主角諾拉因未婚夫的意外事故，對於親友的離去最有陰影，一路上不斷看著隊員死在眼前

  ，是全員中最早也最明顯出現應激反應者，在隊長的安撫下才和緩，這樣的性格也預言了

  她最後捨己為人的選擇。


  隊長則是非常堅守他的責任，在送了22人上岸後拒絕自救，留在探測站等待其餘隊員，一

  路上是最為冷靜可靠的指導者，冷靜到近乎冷酷。


  諾拉最開始不能理解他明明有個女兒卻不率先上岸，隨劇情往後發現隊長甚至忘了女兒如

  今已經長大成人，只記得她十四歲。猜測很可能他已經在海下待得過久，犧牲了太多相聚

  而失去時間概念。相比起放在心中的女兒，隊長選擇的是對眼前的隊員負責。


  史密斯與艾蜜莉是一對情侶，女方是一名海洋生物學家，也是這一隊冷靜異常的隊伍裡反

  應最像常人的：尖叫否認。然而她雖然害怕，卻也有著堅韌的一面，在最後一段路選擇獨

  自拖著無法動彈的史密斯在海床行走，逃生艙前要不是被諾拉揍一拳，也會堅持要與她共

  進退。


  而保羅則是不著痕跡地在暗戀著艾蜜莉，在她尖叫時發揮冷笑話笑匠本色，在覺得自己可

  能有危險時將重要物品託付給她。


  如果更仔細看會發現，保羅在犧牲前，排隊過通道的順序也是有巧思的：諾拉最嬌小率先

  探路、隊長最重要第二過、隨後才是艾蜜莉與史密斯、最後是保羅。讓艾蜜莉先過是因為

  剩下兩位都注重她的安危，而在史密斯與保羅之間，肯定是保羅會讓史密斯先行會緊鄰艾

  蜜莉，才會變成保羅殿後。


  可憐的保羅，在通道前只有他和史密斯時才終於開口透露：「她是個很好的女孩，你很幸

  運。」隨即被這個插得不淺的旗反噬。


  —


  最後講講田氏工業。鏡頭時不時會帶出探測站內張貼的各種海報，無一例外是強調「團結

  一心」、「只有團結才能度過難關」，顯示這是非常注重團結到了有點病態的企業文化，

  側目說明了為何這隻隊伍剩餘的所有人會如此緊密，很可能在長期隔離的共同生活下已經

  被潛移默化。


  然而在張惶逃命時不斷看見這些海報，又不啻非常諷刺：原油開採所喚醒的這些怪物，已

  經超出了人類團結可以應付的範圍。喊著團結的對象和因此得利的對象是同一方，陷入危

  機甚至殞命的則是渺小的員工們。


  田氏不知道深海挖得太深可能有問題嗎？


  或許知道，或許不知道。


  最後引H.P.洛夫克拉夫特書中的一句話作結。


  「人類居住在幽暗的海洋中，一個名為無知的小島上，這海洋浩淼無垠、蘊藏無窮秘密，

  但我們並不應該航行過遠、探究太深。」——《克蘇魯的呼喚》


  --'
