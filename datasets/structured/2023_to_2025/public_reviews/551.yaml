title: '[好雷]《深海終劫站》對地球資源強取豪奪的代價 '
content: "以下可能有雷\n\n圖文好讀版：\n\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n《深海終劫站》是一部美國科幻驚悚電影，由威廉尤班克執導，克莉絲汀史都華，傑西卡\n\n亨維克、文森卡索、TJ米勒主演，劇情講述一場地震讓駐紮海溝的工程師諾拉受困在即將\n\
  \n被淹沒的研究設施，唯一出路只剩下跟同伴徒步走到遙遠的廢棄鑽井臺，而在這充滿挑戰\n\n的旅途中，他們很快就意識到克服缺氧危機，某種前所未見的致命掠食者也將他們當作獵\n\
  \n物追捕。\n\n\n\n一直以來，人們遭遇生物獵殺的災難電影都是我非常熱衷的故事題材，是透過潛藏暗處不\n\n知道何時才會現身的怪獸來感受全片驚悚氛圍的鋪陳，或者在面臨困境時各個角色不同的\n\
  \n反應與後續應對方式，都能藉由生死交關時刻呈現最原始的根本人性，並賦予這類型電影\n\n除了驚險刺激的冒險（逃難）之外，也在劇情部分有更多不同面向，能夠通過一場危機去\n\
  \n延伸探討的主題。\n\n\n\n就一位大學四年都處在海洋研究領域的影迷而言，《深海終劫站》光是把故事設定在距離\n\n海平面以下超過一萬公尺的馬里亞納海溝就讓我產生相當大的興趣，雖然現階段人類對海\n\
  \n溝底部環境狀態的瞭解還十分有限，但正因為如此，《深海終劫站》透過目前地球資源日\n\n漸匱乏的問題，對未來在科技進步之後，我們能否到海溝底部鑽探原油或天然氣提出一個\n\
  \n可能的猜想，並結合了人類因為過度開發而驚動深海怪獸的災難性後果，為電影建構了一\n\n個非常吸引人的故事背景。\n\n\n\n儘管《深海終劫站》的片長只有短短\
  \ 95 分鐘，但整體故事緊湊，絲毫不拖泥帶水在開場\n\n 5 分鐘就進入狀況。位於海底的鑽探設施因為突如其來的地震導致結構損毀，讓上一秒\n\n還對自身充滿懷疑的女主角諾拉馬上需要起身逃難，面臨跟時間賽跑，不知道自己是否安\n\
  \n全，只能眼睜睜看著同伴在面前喪命的處境，使得《深海終劫站》在重點怪獸還未正式現\n\n身之前，就已經透過這種心理層面的衝擊帶給主角跟觀眾難以適應的沉重壓力。\n\
  \n\n\n在迪士尼與福斯的更名事件之後，《深海終劫站》作為最後一部由「二十世紀福斯」發行\n\n的電影，找來了曾以科幻電影《詭異訊》在日舞影展大獲好評的導演威廉尤班克，就如同\n\
  \n許多類似題材的電影，《深海終劫站》也以這些受困於海溝之中，在逃生艇已經離開、通\n\n訊設備損毀，唯一生存手段只剩從深海徒步前往另一座鑽探設施的情況下，透過深海水壓\n\
  \n限制與周遭未知怪物的襲擊，都成功以進退兩難處境製造出強烈的幽閉恐懼，完全展現導\n\n演對於電影的氣氛營造與節奏掌握的高度水準。\n\n\n\n值得稱讚的是，《深海終劫站》即使情況看似危急、隨處充滿危機，但也能在一波三折的\n\
  \n逃難過程中找到機會交代角色的性格與背景，不僅讓嘴砲王保羅擔任紓解觀眾緊張情緒的\n\n角色，也以生物相關的研究助理艾蜜莉呈現一般常人遇到災難時內心瀕臨崩潰的真實反應\n\
  \n，都能感受出就算《深海終劫站》沒有太多跟海底怪物搏鬥的動作場面，這種人類無法在\n\n其中生存的險惡環境，加深角色孤立無緣的絕望，帶來的壓迫感還是足以讓觀眾滿意。\n\
  \n\n\n在 2008 年以《暮光之城》女主角的貝拉廣為人知，這幾年多半接演藝術電影的克莉絲汀\n\n史都華，雖然近期接連拍了《霹靂嬌娃》和《深海終劫站》兩部商業片，但就如同她時常\n\
  \n為性別平權發聲，對自己充滿自信的外部形象，也能從中發覺她選擇演出的角色都是屬於\n\n能夠自力更生，在困境中掌握人生主導權堅強女性的共通點。\n\n\n\n\
  因此《深海終劫站》以「無力感」作為電影的核心，無論是人類總認為自己無所不能，但\n\n碰上意外只能聽天由命，或者女主角諾拉沒能拯救同伴，接連看著他們死去，甚至是她無\n\
  \n法消除內心深處因為失去未婚夫所留下的陰影，這些發自內心的「無力感」都因為身處於\n\n海溝之中面對深海惡劣的外部條件、伸手不見五指的黑暗，加上周遭伺機而動的怪獸而被\n\
  \n更加放大。\n\n\n\n我很喜歡《深海終劫站》電影最後 30 分鐘令人驚豔的劇情轉折，完全把電影提升至不同\n\n層次。看著諾拉從失去隊長的悲痛之中振作，前往拯救孤身一人、因為絕望而放棄生命自\n\
  \n言自語的艾蜜莉，再到最後即便身為一位微不足道的人類，也依舊頑強抵抗身形跟自己有\n\n著天壤之別的怪獸。到頭來，《深海終劫站》其實也是透過諾拉的心境轉變呈現我們面對\n\
  \n人生眾多磨難的方式，觀眾可以把片中角色所經歷的危機套用在生活中任何困境與挑戰之\n\n上，或許也能從中獲得不一樣的啟發。\n\n\n\n就我個人而言，看《深海終劫站》這種把不切實際的內容建立在真實背景之上的科幻電影\n\
  \n，最重要的就是抱持著開放與接受的態度。不可否認，電影裡或多或少一定會有邏輯與設\n\n定上的漏洞，但我們是否能以沉浸在電影世界觀、享受導演塑造的驚悚氛圍，來取代質疑\n\
  \n角色所作所為，或者不斷糾結怪物從何而來？牠們平常吃什麼的不合理之處？我認為這都\n\n是欣賞這類型電影的基本前提。\n\n\n\n整體而言，《深海終劫站》的高明之處，就是導演能在快節奏、毫無冷場的故事裡也顧及\n\
  \n對角色性格與彼此互動關係的描寫，並且在我們都不甚了解的海溝深處，透過片中人類貪\n\n得無厭地對地球資源強取豪奪，最終引發大自然的無情反撲，給予觀眾一個「不是不可能\n\
  \n發生」的警惕，讓我們重新思考自身對環境的影響，即便這次能安然度過，那下次碰到又\n\n該怎麼辦？或許這看似千篇一律，但需要被再三提起，不正也顯示出它不容被忽視的重要\n\
  \n性嗎？\n\n\n--\n\n歡迎追蹤我的FB或IG專頁\n\n\n\n--"
