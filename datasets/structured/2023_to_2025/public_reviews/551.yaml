url: https://www.ptt.cc/bbs/movie/M.1592063368.A.FD3.html
title: '[好雷]《深海擴散》從冰冷科學裡找到唯美與浪漫 '
content: '以下有雷


  圖文好讀版：






  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  《深海擴散》是一部愛爾蘭科幻驚悚電影，由妮莎哈迪曼執導，妙麗克菲爾德、道格瑞史


  考特、康妮尼爾森主演，劇情講述海洋生物學家西沃恩跟隨著漁船出海展開為期一週的研


  究，原本單純的任務卻在漁船誤闖大西洋的深海禁區後，陷入不明海底生物的陷阱，不僅


  船員接連遭到感染，彼此的衝突爭吵也隨之展開。




  海洋占整個地球表面的百分之七十，除了廣大面積讓它有著似乎永遠無法了解透徹的神祕


  感之外，當人們身處於汪洋大海，腳底下深不見底的海水也都不禁讓我們肅然起敬，轉而


  對大自然抱持著謙卑與尊重的態度，而《深海擴散》作為一部以深海怪獸為主題的災難驚


  悚電影，非常精準地利用海洋的深不可測，以人類面對大海的無力感給觀眾帶來最真實的


  絕望和恐懼。




  如果說由克莉絲汀史都華所主演的《深海終劫站》藉由鑽油井意外驚動海溝巨獸，講述人


  類因為科技高度發展，過於自大而引發大自然的反撲，那這次《深海擴散》就是從大自然


  的基本運作模式出發，藉由性格孤僻的女主角西沃恩原本只為完成博士研究而出海的單純


  旅程，因為碰上未知生物無預期的入侵，深陷不僅要面對外部環境威脅，內部同伴的質疑


  與爭吵也讓情況更加危急的險境，呈現出人們碰上危機的應對方式與生命受到威脅所產生


  的人性根本矛盾。




  就我一個在大學也曾搭著研究船出海收集數據的影迷而言，《深海擴散》完全讓我想起自


  己當時站在甲板上油然而生的孤獨感，光是面對一望無際的海面就深刻體認到自身的渺小


  ，更不用說那身處遠洋的茫茫大海，不僅海底下有著能致人於死的怪物，船上人們還因為


  無線電損壞而孤立無援，只能用盡所有辦法來抵抗怪物入侵，這種無處可逃的絕望與幽閉


  恐懼就是《深海擴散》電影的精采之處。




  因此對許多漁民來說，在只要出航就等於把原本由自己掌握命運交給大海的情況下，宗教


  信仰和迷信也變得更為重要。《深海擴散》以缺乏實務經驗、代表理性思維的科學家跟富


  有經驗船員所引發的碰撞來試圖解析這片未知的海域，無論是認為紅髮可能招來厄運，或


  者研究深海生物行為模式的科學角度，都為《深海擴散》故事提供了更多值得我們去探討


  的可能。




  我非常喜歡《深海擴散》結合海怪與神話故事的設計，一直以來，許多現今科學能解釋的


  現象背後都有一個古老浪漫的傳說，就如同片中以像是馬祖「藍眼淚」的夜光浮游生物來


  帶出愛爾蘭公主「妮亞芙」為她所愛而投身海洋，從此髮絲便永遠在海面上飄揚照亮所有


  人的傳說，不僅為海怪增添了許多神祕的美感，也以此呼應女主角西沃恩的最終結局。




  儘管海洋表面看似夢幻美麗，引發我們心中無限的遐想與好奇，但卻也從來都不會知道在


  那些人類未曾探索的區域之中，究竟潛藏著多少難以應付的危機？而《深海擴散》巧妙地


  透過人們面對不明生物的恐懼，從海中有如巨型腔腸動物的觸手、能改變無機物木質紋理


  的詭怪黏液，到能從傷口進入人們血液之中，在體內裡孵化成長，並殺死宿主的蟲卵幼蟲


  ，把深海水母巨獸與寄生蟲疾病題材做出很好的發揮。




  《深海擴散》電影英文片名取為《Sea Fever》，正是以「海洋熱、海熱症」這種水手在


  航海中缺乏睡眠，只要有人失控像野火般蔓延的虛構病症跟像是寄生蟲般的海怪互相結合


  ，進而探討恐懼傳播與面臨生死存亡之際的人性考驗。在緊急狀態我們會選擇自私地存活


  下去，或者無私地為更多人的性命犧牲奉獻？而這種人們因為彼此價值觀差異無法互相理


  解而產生的許多矛盾衝突，正是所有災難片最迷人的地方。




  《深海擴散》作為一部獨立製片，電影格局比起題材相似的《深海終劫站》要小得多，怪


  物部分雖然導演呈現地極具吸引力，但整體點到為止，反而在故事情節與氛圍鋪陳方面下


  了比較多的苦心，從思考如何對付怪物蟲卵的方法、是要船上自我隔離或上岸接受治療的


  兩難，到最終船上兩位女性分別做出不同的成長選擇，視船為己命的女船長在跟先生道別


  後決定棄船駕著救生艇離開，而博士生西沃恩則從原本理性孤僻的性格到願意捨身救人，


  都讓《深海擴散》角色變得多元立體。




  飾演女主角西沃恩的演員妙麗克菲爾德展現出相當迷人的魅力，將角色那種科學家的冷靜


  與理性思維，但也不可避免地深陷疑問與矛盾之中的狀態演得相當到位，雖然她不善於表


  達自身意見及情感，卻有著能對自己與他人負責的堅定意志與信念，《深海擴散》最終在


  她游向深海觸手，留下妮亞芙公主所散發的光芒之後嘎然而止，能在一部怪獸驚悚片看到


  如此浪漫美妙的開放性結局，誰還在意她們能不能活下來？人類會不會因此滅亡呢？




  《深海擴散》讓我想起自己喜歡看電影的原因。到頭來，我們不必把劇情講得很明、讓觀


  眾完整看見故事的全貌，而是讓它們保留一定程度的朦朧美感，激發觀眾內心的想像與感


  受。電影結束後由英國獨立樂團「女兒樂團」所演唱的片尾曲《Swallows》，憂鬱感十足


  的迷幻搖滾，搭配女主唱那帶有點呢喃的唱腔，完美呼應《深海擴散》整部電影的神秘調


  性和主題，每種生物都有不同的存在價值，如果沒有，其實只是你待錯地方或還沒找到而


  已啊。




  整體而言，我完全能在《深海擴散》中感受到妮莎哈迪曼這位愛爾蘭女導演的創作能量，


  不僅在有限的預算資源下，利用最少的怪獸畫面為觀眾帶來最大程度的恐懼與神祕，更結


  合講求分析驗證的理性科學、浪漫唯美的神話故事，還有放到現在十分應景的防疫隔離等


  元素，完成了一部兼具商業、藝術與角色價值觀衝突辯證的災難驚悚片，非常值得我們給


  予肯定和稱讚。



  --


  歡迎追蹤我的FB或IG專頁



  Telegram頻道：


  --'
