title: '[好雷]《庫爾斯克號：深海救援》無法量化衡量生命價值'
content: '~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  1.影片名稱 : 庫爾斯克號：深海救援


  2.觀影時間 : 3/22


  3.觀影地點 : 京華城


  4.觀影方式 : 自行購票



  痞客邦圖文版：



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  《庫爾斯克號：深海救援》是一部比利時災難劇情電影，由湯瑪斯·凡提柏格執導，馬提


  亞斯·修奈爾、蕾雅·瑟杜、柯林·佛斯主演。故事講述原本正在進行作戰訓練的庫爾斯


  克號，由於內部的魚雷自爆而沉沒，幸運逃過爆炸的船員被困在由隔艙門擋住海水的小空


  間內，等待著政府軍方所組織的救援行動。




  就像大部分「優秀」的災難電影，《庫爾斯克號：深海救援》在進入故事前，先利用一小


  段家庭溫馨互動、為了好朋友集體賣錶，還有一場和樂融融的婚禮來建立男主角跟家庭、


  同僚之間關係，都成功讓觀眾更加在意這幾位角色，更加關心他們後續所遭遇的悲劇事件


  。



  《庫爾斯克號：深海救援》改編自2000年庫斯科號沉沒的真實事件，雖說經過事後調查，


  爆炸主因源自於人為的疏忽，先前魚雷也有不斷釋出警訊，但由於船員們身處於體制內，


  一切必須按照規定行動才造成這場遺憾的意外事故。至此導演就為電影訂下一個非常重要


  的主軸，不僅多次在片中丟出問題，讓角色做出判斷，或選擇自己該相信的事物，更透過


  這些選擇探討著在面對可能威脅生命安全的事件時，我們究竟該聽從命令？或者要依照自


  身的想法行動？




  當意外發生好友在我們面前死去，自己作為長官背負著身邊許多同僚下屬的性命時，該如


  何調整好自己的心態和情緒，不自亂陣腳做出最正確的決定？而倖存船員們在努力維持基


  本生存條件，也同樣面臨到該相信長官、相信軍方會前來救援，還是因為等待時間過長而


  傾向思考該如何自救、是否能靠自己逃出生天的兩難處境，這些都是無數個未知的選擇題


  。




  這正是《庫爾斯克號：深海救援》最吸引我的地方，它不但是一場悲劇的意外、是人類與


  大自然的生死爭鬥，更是對人性的一次重大考驗。作為船員的親屬，在得知自己家人可能


  身處險境時，有人不斷嘗試想得到目前官方所隱藏的情報，對他們提出質疑，而有些人則


  不被情緒左右，選擇百分百相信官方的發言，同樣都擔心著自己的親人，卻有著兩種完全


  不同的思考方向。




  不過隨著故事進展，《庫爾斯克號：深海救援》逐漸淡化這些矛盾，轉而把焦點放在更高


  位者的決策上，是電影較為可惜的地方。俄國救援潛艇因為年久失修而無法順利執行救援


  任務，因此受困生還者只能依靠北大西洋公約國的支援來獲救，但考慮到國家機密情報與


  承認自己失敗等問題，雙方的合作也變得更為敏感。就因為如此，與其說這部電影的重點


  是俄國軍方能否將他們成功救出，倒不如說是看俄國官方決定是否要拿自己國家尊嚴來換


  取他們的性命。




  這其實相當諷刺，原本站在國家最前線的軍人，在發生意外事故後，卻也是第一時間被國


  家給犧牲，儘管我們為此感到憤怒、感到無奈，但這也是無法否認的事實。我承認《庫爾


  斯克號：深海救援》全片以英文發音或多或少都有立場偏頗，沒辦法完全以客觀角度講述


  這次事件的過程，而且直到最後依然離不開對當權者的批判，但就我而言，各國政府該如


  何在人民權益與國家面子之間找到一個恰到好處的平衡點，我想才是這部電影最想傳達的


  訊息。




  整體而言，《庫爾斯克號：深海救援》是非常容易被忽略的佳作，雖說它觀點部全面、劇


  情也傾向商業，但作為一部真實事件出發的災難電影，這種小型格局卻意外有著豐富的故


  事內容還是值得肯定。扣除幾個讓人恨得牙癢癢的橋段，電影本身著重在對他們至死也重


  視軍人身分的精神、同袍苦中作樂的兄弟情，還有父子與夫妻之間的深厚情感連結，看著


  片尾二十多個人唱著那首《水手樂團》、信中寫著：「妳的一瞬間就是我的永遠。」更不


  用說孩子戴上父親留下的那只手錶，這些讓人淚流滿面時刻真的都幫電影加分不少阿。



  --


  歡迎追蹤我的FB或IG專頁




  --

  俄羅斯就不會講英文了吧

  怎麼會浪費，有新的嘗試是好事阿～'
