url: https://www.ptt.cc/bbs/movie/M.1646825617.A.E9D.html
title: '[問片] 問一部跟深海有關的電影'
content: '大家嗨嗨

  朋友問愛看電影的我知不知道這部片

  我還真的不知道

  關於深海的一部片子

  怕暴雷



  防




  雷




  一



  下

  下




  朋友的敘述：

  「有一群人 到深海裡 不知道是做任務還幹嘛, 做那種潛水倉下去  然後他們要上來的時候,發現有怪物！


  就覺得很奇怪怎麼會有, 然後某人想到說 ，是因為其中一個人腦裡的想法會變成真的


  所以就叫大家不要想


  然後要上來的最後幾秒 又有怪物 就有人說 是誰又想了」


  我真的是不知道是哪一部

  求板上強者

  感恩


  題外話

  她順便問我知不知道什麼深海的電影


  我說：尼莫算嗎


  兩集我都看


  她說動畫不算

  哭哭


  --

  Sent from nPTT on my iPhone


  --'
