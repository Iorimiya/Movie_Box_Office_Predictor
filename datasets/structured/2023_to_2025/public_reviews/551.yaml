url: https://www.ptt.cc/bbs/movie/M.1588298734.A.37C.html
title: '[好雷]深海終劫站Underwater '
content: '雷文防雷資訊頁




  (本文有雷,未看勿入)









  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  《深海終劫站》日前在台上映時是有想為了克莉絲汀·史都華去電影院看的，但拖了一兩

  週後就沒有理想的場次。最近在師大白鹿洞粉專上看到這部DVD出的消息，跟室友到比較

  常去的政大展燕亭看看有沒有片，沒想到不單有片，還有藍光。


  《深海終劫站》基本上如室友所說，像是深海版的《異星智慧》或《異形》，但在展示人

  類在地底空間裡的脆弱、影射中國企業秘密研發某種生物與最後結局方面，深得我心。克

  莉絲汀·史都華在電影裡的演出也令我感到滿意—雖然她個人經歷和背景只有一兩句，卻

  可以在整個逃亡的過程感受到她的心理創傷與在強大壓力中的堅強意志。此外也喜歡像是

  預言者一樣的角色保羅與他的兔子玩偶「小保羅」，為這高壓的驚悚片加添了趣味。


  不過為了展現深海逃亡現場，電影有許多手持鏡頭拍角色在黑暗中奔跑晃動...讓我覺得

  還好沒有去電影院看（容易暈的體質）。


  #在家看就沒有覺得那麼暈了

  #本來是福斯後來變迪士尼發行的電影



  ***


  這裡是我的樂園:




  FB:




  --'
