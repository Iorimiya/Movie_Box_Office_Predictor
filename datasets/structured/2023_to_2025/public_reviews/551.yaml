url: https://www.ptt.cc/bbs/movie/M.1579829331.A.FDF.html
title: '[負雷] 深海終結站'
content: '整部片很像一張導演要做的check list


  1.莫名奇妙每個人都超高尚的情操 Done


  2.隨便刻畫出角色的個性 Done


  3.從A點 走到B點再走到C點的冒險路程 Done


  4.深海大怪物 Done



  就像開頭五分鐘就馬上進入重點一樣…

  完全沒有鋪陳的劇情

  沒辦法讓觀眾有太深的入戲和感動

  難怪回來之後看到電影版上很多人說看到睡著


  又看了暮光女演的一部爛片……


  下次要避開她演的電影了



  --




  對!她的演技其實看得出來有變好，比較不會像之前那麼容易讓觀眾出戲了…

  可能也是因為金髮平頭的人設比較適合她吧…'
