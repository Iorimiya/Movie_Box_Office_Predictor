url: https://www.ptt.cc/bbs/movie/M.1580130049.A.543.html
title: '[有雷]  深海終結站 導演訪談'
content: '下面有雷




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



















  有鑒於我跟一起看的朋友因為「到底是不是克蘇魯」吵到快拿叉子跟筷子互戳


  結果就是很幸運的居然可以在K島找到那麼詳細的訪談


  導演訪談：




  K島原串：




  有興趣的可以看一下導演訪談




  這邊也放一下好心人節錄的導演訪談：


  最後出現的大海怪真的就是克蘇魯

  原本是要做成鯨魚型怪獸，後來改成克蘇魯


  預告有隱瞞克總的出現


  原本的鯨魚狀生物是想致敬貝西摩斯

  後來威廉尤本克覺得克蘇魯比較有神秘感就替換成它

  連原本襲擊諾拉他們的魔改深潛者應該是完全烏賊狀的

  但因為導演覺得烏賊根本不恐怖所以改成偏向克蘇魯的人形生物


  原設的烏賊生物則以魔改版深潛者的幼體做為彩蛋出現在正片裡

  另外魔改深潛者住在克蘇魯身上的設計是參考負子蟾


  導演有提到劇中被廢棄的謝伯德站之前就是受克蘇魯影響，隊長等人員才撤走

  在沒加入劇本的創意裡有隊長在謝伯德站被克蘇魯精神污染

  進而看到死去女兒出現幻覺的劇情

  導演還提到故事設定時空似乎是在不久後的未來，可以解釋劇中怎麼會出現這麼規模巨大

  的鑽探站，每站自帶核反應爐

  主角他們開採的也不是石油，而是某種礦石類的高效替代性能源

  謝伯德站在原始創意裡，還是有機器爪可跨越地形的移動式鑽探站


  不知道電影會不會有第二集

  據導演說克蘇魯是舊神無法被殺死的，會以某種方式回歸




  真的超級詳細的……

  希望這個導演能越來越紅啊


  --'
