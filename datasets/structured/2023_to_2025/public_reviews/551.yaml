url: https://www.ptt.cc/bbs/movie/M.1553608480.A.D73.html
title: '[好雷] 庫爾斯克號：深海救援-在希望與絕望之間 '
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  1.影片名稱 : 庫爾斯克號：深海救援


  2.觀影時間 : 拒答


  3.觀影地點 : 中和環球國賓影城


  4.觀影方式 : 電影贈票


  §其他防雷說明(非必要) :



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  此區為發文防雷頁

  可選擇性提供上列 1~4 資訊  或不提供亦可

  觀影心得於分隔線下方發布即可


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  進戲院前看了海報和簡介，只預想這會是部災難救援電影，沒想到除了有影帝柯林佛斯和

  馬提亞斯修奈爾兩位男神加持外，劇情格外地寫實、感人！


  電影改編自歷史真實災難事件，描述冷戰後一艘奧斯卡級的俄羅斯核潛艇「庫爾斯克號」

  因事故沈船，卻因當時英俄政治局勢拉鋸，讓倖存的船員歷經長時間受困船艙、等待求援

  的過程。


  本片有災難片一貫史詩般的格局（據導演說本來不加特效，因太喜歡這部片還是加了），

  情節也環環相扣、節奏緊湊，從一開始和樂融融的家庭場面、好朋友辦婚禮，到例行出航

  ，直到魚雷爆炸、船員被困、開始計畫求生。整個過程中，對比倖存者在深海船艙內，靠

  著彼此打氣、回憶家人，努力懷抱希望、堅守求生意志，在陸地上操弄政治、耽誤救援時

  間的政府官員，簡直冷血無情、毫無人性。當越感受到船員的恐懼和無助，便越會對官僚

  的嘴臉感到憤怒！


  但電影也跳脫典型災難片的敘事格局，在悲劇中仍保有海軍的幽默和勇氣，在如此未知與

  無奈的處境下，船員們還能用玩笑話展現內心的強大無畏，只是隨著一次次的官方救援行

  動失敗，所有人的生命與信念，也就在這悲喜之中、希望與絕望之間，漸漸走向幻滅。尤

  其當好不容易取得氧氣板，船員卻意外掉落釀災的瞬間，那一刻有多麼讓人悲傷和心碎！


  而就像是每次低沉的電影配樂揚起時，彷彿預告悲劇就要發生，在觀影後我想起了電影第

  一個畫面，小男孩在水中練習憋氣，那似乎註定了，在父親永埋冰冷的深海後，他要繼承

  父親海軍榮耀的遺志。也還好那支手錶回到小男童手中，若是船員沒有因為婚禮賣出錶，

  困在船艙內的時間該有多難熬。


  最後看完電影，想為船上所有118名壯烈犧牲的船員哀悼，感謝導演拍出這部好作品，才

  能讓世人知道庫爾斯克號和倖存船員的事蹟，還有那封最終沒能親手交出的信，竟也是歷

  史事實，真是讓人哭慘。


  --'
