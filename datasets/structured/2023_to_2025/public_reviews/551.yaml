  小北極熊的故事很是深刻，真的覺得身邊很需要這種，即使處於劣勢還是保有信念與幽默感的人，堅定自己並鼓舞別人！故事中傳達著存在與傳承的重要以及永恆的智慧，這部片在在體現『水手了解水手，水手會去就水手』的海軍精神非常令人感動。小型救援艦多次嘗試，即時在最後潛水伕終於打開艙門，心中還是抱有一絲希望，就在螢光棒投下後照亮那一幕，眼前是一片的靜默，令人錯愕及不捨！










