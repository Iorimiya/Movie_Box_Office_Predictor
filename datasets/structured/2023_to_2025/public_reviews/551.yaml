url: https://www.ptt.cc/bbs/movie/M.1553573850.A.D13.html
title: '[好雷] 庫爾斯克號：深海救援 Kursk'
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  1.影片名稱 : 庫爾斯克號：深海救援 Kursk


  2.觀影時間 : 03/24


  3.觀影地點 : 喜樂時代南港


  4.觀影方式 : 自行購票




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  庫爾斯克號，2000年俄羅斯北方艦隊軍演意外，理論上俄羅斯海軍自己應該很好救、就算自己不行近處也有他國資源可協力救助，結果怎麼人多起來湯圓一搓就遲遲沒了個下文？拖了
  96 小時不該錯過的全都錯過了？全數船員罹難，這是個歷史悲劇，而且還是在冷戰後都過了十年的承平年代別說戰爭連敵人都沒有，這叫罹難者家屬情何以堪、俄羅斯軍方又如何見人？這樣的題材，當然難期待俄國自製俄語電影，幸好還有這部
  EuropaCorp 領軍的法比盧聯合製作，基於英國記者研究與美國編劇，還有丹麥導演多國演員與幕後，他們拍起俄羅斯故事時一種混血感是難免的：


  蕾雅瑟杜為首演俄羅斯軍眷社群很有戲、取景法國社會住宅的港邊水手社區很有感覺、開場終場一喜一喪的東正教堂與點到為止的三角琴配樂也頗有風情、馬提亞斯熊奈特為首的男人們那有點潦倒士氣不太高但彼此親愛的感覺很迷人、高官們以麥斯馮希朵為首令人看到痛恨也是難忘、柯林佛斯周邊英國人演英國人則最四平八穩...
  比較令我出戲的是客串的兩位德國當紅小生 Matthias Schweighoefer & August Diehl，聽他們講英文還學俄腔真是不適應；還有那首水手歌
  “Oh Sailor Band” 一聽就完全是德國旋律英國歌詞，實在很難想像它的俄羅斯土壤。




  跟著拉斯馮提爾一起從丹麥 Dogma 95 發跡的 Thomas Vinterberg，除了台灣最熟的《謊言的烙印》外近年還有《遠離塵囂：真愛相隨》與《丹麥共居生活》，算是獨立製片與英語商業片都練過刀越練越大之後，才成就這部有海軍有潛艇還有多個大場面切換的跨國聯合大製作。他的筆觸令這部片在各種類型中都有點特別：


  以救難片來說，它很獨立製片，拍生活對話通信與政治多、拍災難與救援動作極少；以政治片來說，它冷冷地靜觀現象穿針引線，較少醞釀高潮製造驚天爆點；而以一場拍兄弟拍姐妹拍親情的社區家庭片來說，那獨立製片的寫實筆觸用在歐洲演員一齊講英語的場合上，是不免有點怪怪的，不太像過去的
  Vinterberg 那樣自然，不過也沒關係適應一下就好。




  此片據說剛到 EuropaCorp 手上時，老盧希望把它拍成一部救難動作片？少談點政治爭議免得惹到俄羅斯人被網攻？無論如何最後還是朝向政治風雲的方向拍了，還好
  Vinterberg 拍警世故事與道德訊息向來都是靜靜旁觀不多說，這次很明顯讓俄羅斯軍方官僚層層阻撓、最後讓麥斯馮希朵當大魔王現形、甚至片末還給了個如過街老鼠般的
  walk of shame... 我想應該已經是能做到的最大尺度了。這俄國軍方的傲慢，算是在此片被描繪成一個「後蘇聯時代」改朝換代青黃不接甚至不知敵人何在的結構性焦慮，致使資源缺乏軍備老舊但老蘇聯榮光這面子不可動搖，才導致悲劇。


  不過以一部政治批判的電影來說，我覺得此片議題太簡單太輕鬆了，這事件誰是誰非很鮮明、誰積極誰阻撓也很清楚、兩邊基本沒什麼模糊空間、每個角色都沒有面臨道德難關的掙扎抉擇、都只是各自堅持著初衷搬到談判桌上看能怎麼辦。也難怪，相較於
  Vinterberg 過去《謊言的烙印》之驚悚冷峻、《丹麥共居生活》之沈重失落、甚至調性溫暖如《遠離塵囂：真愛相隨》亦有的誘惑考驗，此片的政治批判黑白分明只算是個
  easy target，警世訊息幾乎人人早就都知不用多說。我覺得電影較用力而效果也較感人之處，倒是在於遇難者們本身了。


  水手社群、水手教堂、水手之心、水手世代，這是本片處處頭尾呼應最強調的精神，在地面愛人愛家的「水手」身影遠遠大於在高空英勇愛國的「海軍」身影。一般潛艦電影或海軍電影一定紀律嚴明軍威壯盛、敬禮一定精神抖擻報告一定鏗鏘有力，這一切在此片都沒有，我們這群潛艇主角最挺拔的時候是穿著軍禮服參加婚禮時，而且他們當海軍當得薪餉拖欠苦哈哈，平日在社區守望相助執勤時專注任務都不拘小節，甚至制服也不甚整齊軍容也不甚俐落，熊奈特演起長官甚至像個好好先生渾沒點長官威嚴，尤其我們去年底才看過超級艦長傑拉德巴特勒，兩者完全沒得比。




  但談到任務，各種紮實的檢測管控呈報命令指揮，語氣隨和姿態日常之餘內容卻是一點不馬虎，長官平日和大家好好先生但到緊要關頭指揮若定人人聽令，把事做好的精神光是「水手」就已不輸軍人，這群人顯然平日連結聽令靠的基礎也不是嚴明軍令而是水手社群一條心。我自己也沒海軍或眷村的經驗，這樣和一般潛艇片截然不同的生活化筆觸寫不寫實我說不上來，但很顯然
  Vinterberg 指揮演員們要打造的這水手小世界是這樣構成的。


  同樣地，男人出任務時留在家中的女人與孩子們也自成兩個緊密連結的網絡，女人絕不乖乖聽話坐以待斃而是整個指揮系統一樣迅速動員正面出擊。孩子儘管平常只是玩在一起睜大眼睛看世界，但孩子的默契就在平日你我互帶爬上跳下玩耍中建立起來，片尾真正面臨大敵時可是一呼百應不須隻字片語，片中更是時時一雙犀利眼神如偵察機般令鬼影幢幢的政治角力無所遁形。


  而孩子在水手社群裡的「傳承」，就不只是小孩子對水下大人們的思念了，而是家家戶戶世世代代都有的共同經驗：三歲時喪父？對他記憶零？但他已成為我的一部分，不知不覺地我也成為潛艇兵，走上他道路。




  電影最令我鼻酸的當然是末艙內存活 25 人的漫長等待，他們從鎮定等待抱持希望、到一次次落空焦急、到幾次瀕臨崩潰軍令無用只能靠擁抱... 誰知到最後越接近絕望時，那彼此團結一心攜手走一回的「生命」價值愈發清楚，那人人都虧的光棍弟兄「我可還沒放棄希望」開始及時行樂享受人生，重新以故事笑話食物與光喚回彼此同甘共苦的人性、而非遵照教範耐心等待的軍心。


  到最後，那陣燒光氧氣的火， Vinterberg 給了本片唯一非寫實而神光乍現的一刻：上方是火海燒掉最後一線希望、下方卻是終於坦然接受命運的平靜，我們擔心我們的遺言與足跡再也傳不下去，其實早就世世代代傳到我們身上也必會傳下去。電影標語
  Ensemble jusqu''au bout 「團結一起直到潛艇」，這團結不只是兄弟團結、姊妹團結、家庭團結、社群團結、異國友人的團結、乃至世代的團結，即使孤身海底，彼此仍知道我們在一起。


  那父親傳承給孩子的，不是什麼勳章軍服或豐功偉業，只是個親愛團結彼此相挺當掉的一支錶。「水手了解水手、水手會去救水手、即使是敵軍」，我真心覺得 Vinterberg
  不是個拍軍事片的料，他整顆心在拍的都是地面的水手社群、對比天上的軍政意識形態，都在拍水手們的日常互助、對比軍容抖擻語氣威嚴的高層官僚。甚至到結語，也是具體以互助的「水手」對比對立的「軍人」，這個簡單的概念，如果這些軍政意識形態的保守幽靈能放鬆一點快想通，軍裝帥出新高度的柯林叔幾小時就大顯神威救給你們看呀...




  《庫爾斯克號：深海救援》我覺得是 Vinterberg 片單當中相較不算太精彩的一部，畢竟它故事有點大、世界觀中的場景有點多、牽涉其中的多方角色也有點雜，好像每個部分都該拍一下、但也不太容易聚焦在誰身上，而那軍政意識形態的幽靈就放在那很清楚人人喊打、也沒什麼好多談的，更不像他的舊片隨時會出來誘惑主角考驗其貞定令觀眾倒抽口涼氣。不過，我仍是很樂見這種大規模軍事題材電影找到了他，拍出了他所關切的價值，面面俱到該拍的都拍到之餘，仍靠著天上地下兩個世界靜靜呈現了他關切的價值。


  推薦喜歡劇情片的、喜歡柯林叔的、喜歡熊奈特的、喜歡蕾雅瑟杜的及喜歡 Vinterberg 作品的觀眾來瞧瞧。但愛潛艦戰爭片或政治驚悚片的觀眾嘛，我建議慎重考慮，它不是沒拍這兩面，但這兩種類型電影通常令人熱血沸騰的爽感，在此片恐怕都只（很有意識地？）拍成了冷感，因為它想說的另有其事。



  --

  也是我最愛！他風格多變什麼都可以，給每部片都畫龍點睛！當然偶爾也有偷懶交差時XD'
