url: https://www.ptt.cc/bbs/movie/M.1684635357.A.CA0.html
title: '[好雷] 深海尋寶（Into The Blue）艾芭與沃克'
content: "這部2005年的片，一直是我的心頭好，隨著時間已慢慢進入夏天，\n\n看到潔西卡艾芭和保羅沃克的完美身材與配得上這深刻劇本的演技，\n\n都覺得心頭一陣沁涼。仔細查了一下才發現這部票房居然不好？？\n\
  \n可是卻能在2009推出由另一批人馬拍的續集？\n\n\n\n\n片中的男女主角本來在巴哈馬過著與世無爭的藍領生活，\n\n只要有愛萬事足，但被慫恿之後加入了尋寶的行列，才發現所謂的寶藏內幕並不單純，\n\
  \n不只是Body Goal還是Relationship Goal，男女主角情比金堅的浪漫和冒險都\n\n集本片於一大成，本片是在Nassau拍攝，查了一下才發現這部片算是\n\
  \nThe Deep（深深深，1977）（也有同名小說）的變形體，只是深深深是旅行中\n\n的情侶遇到探險的機會，而本片Into The Blue的主角則是本來就定居在群島上。\n\
  \n\n這部也算是我個人最愛的保羅沃克片。\n\n--\n\n幻想●---------------☆\n/﹀\n/\\ \n\n按a加入最愛\n\n--"
