title: '[負雷] 深海鯊機'
content: 'Good evening，我是小洋。




  當初看到這部片預告覺得似乎不會太差，但看完了真的覺得很失望。


  一開始是很平鋪直敘，但從討論要去玩這項籠子裡看鯊魚的挑戰到了真正要下海前，


  這一大段是還算不差，至少失戀女不斷表現緊張是有帶到一些氣氛。


  不過到了下海後，我感覺一直在拖戲，鯊魚出現的時間也太少了，


  而且很多時候女主或二女在海底要跑出籠子拿東西或找人的的時候也都有點扯，


  這樣大剌剌跑出來完全沒有半隻要鯊魚過來。


  這部不是深海鯊機嗎，我當下真的以為在看深海尋寶。


  而到後半段我認為一直在拖戲，第一次快上來水面時又掉下去就算了，但後來


  一直光在水裡游來游去就重複好幾次。


  前陣子的絕鯊島真的大贏這部，雖然絕鯊島主角只有一個，但畫面演技劇情完全大勝


  這部片，不過深海鯊機在幾乎全海裡拍攝這部分還是該給點鼓勵。


  結論，可以等DVD或電視播就好，不用花這個錢進影廳。


  有個問題，船長在他們下海前用個很怪的眼神看著女主角，但後來也沒交代船長


  這眼神是否有什麼意涵，有人知道嗎？ 還是只是導演只不過想塑造懸疑感罷了。


  --


  我是小洋，只是個平凡的臺灣人。


  --

  我覺得是救上去了吧？ 但他妹應是真的死了。

  已更正

  的確蠻暗的，在水裡拍攝似乎真的有難度，音效部分我覺得很不錯。

  認真覺得不值得，非死不可這部我覺得雷聲大雨點小，預告剪得不錯但看完覺得有點虎頭

  蛇尾。

  我覺得前半段蠻好看的，但到後來快結尾的地方個人覺得有點芭樂，就一群朋友死光光了

  ，不過描述網路霸凌這議題我覺得倒是不錯，對了女主角蠻有氣質的是真的。

  的確。

  是啊不過倒是學了不少潛水的知識。

  真的少得可憐，絕鯊島大勝這部。

  我也是。

  我認同黑暗海底這部分，但我私心覺得還是出現太少主角與鯊魚的動作面。

  推絕鯊。

  我也覺得第一次或第二次上去就可以了。

  的確片名比較是在說深海危機之類的。'
