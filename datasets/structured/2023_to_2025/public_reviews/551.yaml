url: https://www.ptt.cc/bbs/movie/M.1620034443.A.C17.html
title: '[問片] 一部深海驚悚片; 一部家庭倫理片'
content: '第一部是小時候在電視上看過兩三次的。


  片子背景滿公式的：一群技術人員被困在深海，然後發生奇奇怪怪的事


  好像在海底看過什麼東西後，心中所想或恐懼的就會具現化


  但具現化的過程還滿低調的，不是說想像大章魚就會有大章魚出現在螢幕上嚇觀眾


  印象中有一幕是兩個角色在類似倉庫的地方對話，談到書什麼的


  然後其中一人就打開置物櫃，發現裡面全部都是那本書


  影片最後死到剩兩男一女被營救上岸


  在被官方問話前，三個人手拉手，用在海底獲得的意念操控法，集體忘記發生過的一切


  概念是：既然我們心想什麼就會成真，那就集中想著忘卻吧


  三個人睜開眼後互相問：你幹嘛拉我的手？


  -完-



  第二部疑似是西語片或葡語片，應該是在伊比利半島或拉美


  但也有可能是東歐，真的記不太清楚 @_@ 因為是聽不懂的語言


  家中成員有爸、媽、青少年兒子，和一個剛出生的小 baby


  有一幕全家人在吃早餐，寶寶坐在兒童餐椅上


  有一幕是兒子躺在媽媽腿上看電視，沒有很明顯的性暗示


  另一幕是兒子在沖澡，爸爸進來開始撫摸他的身體


  兒子的表情和肢體都呈現緊繃狀態，應該是第一次發生這種事


  但他之前已經略有察覺爸爸對他有意圖，沒有激烈的反抗


  極少見的的父子亂倫片，結局也忘了


  只記得片子的節奏偏慢，醞釀期很久


  -完-



  以上兩部希望有神人可以解惑，謝謝！


  --


  謝謝！剛 google 了一下，大部分評論說原作等級太高改編不易 XD'
