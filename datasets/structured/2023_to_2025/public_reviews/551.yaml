url: https://www.ptt.cc/bbs/movie/M.1580019070.A.79C.html
title: '[普雷] 深海終劫站'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  我滿喜歡看這種公式的驚悚片


  爆炸 逃跑 配角領便當 怪物攻擊



  但這部電影給我的感覺有點弱

  一開始刷牙看到蜘蛛 然後莫名就開始炸

  怪物沒交代清楚 沒頭沒尾

  以及 突然插入人類取得太多的環保意識很硬要

  情感沒有鋪陳的很好 劇中很多感情都太薄弱了



  再來說說好的部分

  劇情很緊湊 偶爾嚇人 每個人都死法都還可以接受

  沒什麼失智的配角 頂多就那個女生滿吵的

  劇情很簡單 就跟預告片說得差不多

  就照著災難驚悚片的公式順順走完

  場景拍得還不錯 畫面的部份給正評

  想要從電影領悟什麼道理的話不推薦

  但過年要找爽片看的話這部滿適合的



  看不下地心引力的建議不要進去看 海底有些部分滿悶滿壓迫的

  以上謝謝  新年快樂


  --

  主角死我覺得滿不錯的 喜歡這個結尾

  中間突然說 我們取得太多了 最後結尾又說上級機關打算隱瞞事件 繼續開採 這都是很突

  兀為塞而塞的環保意識'
