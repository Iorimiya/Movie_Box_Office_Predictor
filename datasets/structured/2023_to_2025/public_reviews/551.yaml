url: https://www.ptt.cc/bbs/movie/M.1578901146.A.EF0.html
title: '[好雷] 深海終結站 Underwater心得'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  在越南上映的時間比台灣早，趁著周末就衝了一波。


  整部片都圍繞在女主角克莉絲汀史都華身上，發生在馬里亞納海溝的海底探勘基地很

  特別的是，原本以為會有一些前言鋪陳人物刻劃，結果影片開始不到十分鐘就進入災

  難環節，瞬間把情緒拉到緊繃。


  過程中女主角邊逃邊收獲一些同事，最後協同隊長的指示一行人開始下水前往有逃生艙

  的另一平台，並開啟了多災多難的路程。



  觀影的過程發現整部片只要切換到水下，或是潛水衣的內部，都會讓人有一種壓迫或是

  幽閉恐懼症的感覺，不得不說導演在視覺和音效的設計蠻厲害的。特別是女同事Emily以為

  其它人都死光剩自己拖著屍體發瘋似的自言自語，往前走的樣子，完全可以讓人感覺到絕

  望。


  片段裡面對於血肉和怪物的描述也是非常細緻，讓人看得特別過癮。看片的過程甚至有一

  度覺得安靜、絕望的壓迫感太重，想出去外面透透氣。發現導演能營造出來這樣氛圍基本

  上本片就成功一半了。


  美中不足的地方大概就是，片長太短感覺看了不過癮，隊長領便當以後，主角們後半段到

  逃生平台的路程太順利，沒有繼續堆疊緊張的氣氛就直接打王了。


  還有結局我也不喜歡，沒有像異星智慧的那種大轉折，反而是英雄式的結局有點太俗套。

  但整體來講做為科幻驚悚片，整個氣氛營造上還是挺不錯的。


  --'
