title: 大白鯊：永遠的深海驚魂
content: "因為這部片，鯊魚成為我小時最喜歡的動物，那時的我認為擁有多排利齒的鯊魚實在\n　　是天底下最美麗的生物，游過海面的鯊魚以充滿威脅感的背鰭激起白色水花的景象，\n\
  　　至今都令我我覺得萬般迷人，或許沒有海豚的俏皮或鯨魚的優雅，然而那是海豚與鯨\n　　魚都沒有的、毫不扭捏的直線逼近，波紋的深淺隨著鯊魚的體型而異，也暗示著來自\n\
  　　水底不同等級的致命殺氣。\n\n　　也因為這種曾對鯊魚有過的情有獨鍾，我對晚近出現的大多生物災難片皆難以感動，\n　　蟒蛇、狗（到底哪個傻瓜想出來的笨點子）、蜘蛛、殺人蜂、食人魚不用說，連以更\n\
  　　進步技術拍攝的【水深火熱】也不例外－不是說該片不好看，只是我覺得【大白鯊】\n　　更有味道－如果每個人心目中都有部唯一生物災難片的經典，【大白鯊】就是我心目\n\
  　　中最精采的極限。\n\n　　小時後，我有一捲從電視錄下的【大白鯊】錄影帶，據說我曾完整看過那捲帶子不下\n　　二十次，而且喜歡在客人來時主動放給他們看，顯然爸媽的朋友多少都覺得我有心理\n\
  　　變態：這小孩不看維尼熊、不玩米老鼠，沒事幹麻重複看鯊魚吃人，將來一定會長成\n　　正港變態。\n\n　　總之年紀小小的我，就這樣和鯊魚有了點緣分，小學四年級初次去環球影城，看到那\n\
  　　隻半大不小又有點失真的鯊魚從水裡冒出頭來胡亂鬼叫，心裡悵然的失落實在是一言\n　　難盡，原來這就是銀幕上威震八方、殺人如麻的王者，原來這點長度就是恐怖水妖的\n\
  　　真實尺寸，遠觀永遠比較美好，虛幻的東西總是更為神妙。\n\n　　然而，【大白鯊】依舊是一部劇力萬鈞的電影。現在的觀眾，大概會覺得這部鯊魚沒\n　　冒出頭來幾次的電影很悶、很慢、很無聊吧，如果我晚個十年出生或許也會這麼認定\n\
  　　，但對我來說，這部電影的每個橋段都很有趣，連布洛迪警長和孩子的小動作都很吸\n　　引我，我甚至覺得胡柏在船上喝的汽水好像很可口，有一陣都覺得汽水要一口氣喝乾\n\
  　　才真正夠味。\n\n　　另外，約翰威廉斯的古典風配樂也真是功不可沒，這年頭越來越少如此富旋律性的電\n　　影音樂了，因為敘事結構的變化與剪接技巧的強調讓需要時間醞釀氣氛的配樂沒有空\n\
  　　間，或者說，配樂烘托電影氣氛的力道被阻礙了因而徹底淪為二線的配角，在這樣的\n　　時代回頭看以前的老片，單純的片段配上緊緻的樂章，純粹只為了描寫海灘風情、家\n\
  　　庭溫馨或船上點滴的橋段，正是約翰威廉斯華美配樂大顯身手的舞台。\n\n　　驚險場面雖然極少，但量少質精而以氣氛取勝，鯊魚隱而不顯的逼近，根本無須現出\n　　鯊魚的全貌即可製造壓倒性的恐怖感，事實上全片鯊魚最清楚的畫面只出現在昆特船\n\
  　　長被咬死以及布洛迪以魚叉刺擊鯊魚頭部的橋段而已，剩下的部分多是一閃即逝或形\n　　貌模糊，胡柏在水中與鯊魚的亂鬥甚至只看到氣泡中的眼睛、牙齒與鯊魚約略的輪廓\n\
  　　，然而這絲毫無減每個驚險片段的品質，多年後【水深火熱】連鯊魚的細部動作都想\n　　仔細詮釋，看起來卻比不上舊片若隱若現的迷人。\n\n　　至於片末布洛迪與鯊魚的對決自然是經典中的經典，「笑啊，你這個婊子養的！」然\n\
  　　後一槍命中，血肉紛飛，那一幕到現在都如此震撼，好像被炸得粉碎的鯊魚肉塊都跳\n　　舞著慶祝著警長的勝利似的，約翰威廉斯澎湃熱血的配樂百聽不厭，到【大白鯊二：\n\
  　　神出鬼沒】裡布洛迪以高壓電纜單挑鯊魚時又再現了一次令人絕賞的高潮，可惜這種\n　　境界在【大白鯊三：一柱擎天】與【大白鯊四：驚海尋仇】就完全失去了。\n\n\
  --\n\n            文字是迷途者在黑森林中唯一的慰藉。\n\n            我的網誌：\n\n　　　　　　批兔個人板：SeanW\n\n\
  --\n◆ From: 59.117.110.30"
