title: '[新聞] 馬克華柏格《深海地平線》首張劇照'
content: '文/Jean


  獅門娛樂籌拍的真人實事改編電影《深海地平線》（Deepwater Horizon）原本計畫由《

  海上求生記》（All is Lost）導演J.C.錢鐸（J.C. Chandor）執導，但因理念不合退出

  後由《紅翼行動》（Lone Survivor）導演彼德伯格（Peter Berg）接手，目前正在紐奧

  良拍攝中，雖然距離上映時間還有一年半，但今天率先公佈了首張劇照。


  此片是根據真實社會案件改編，描述2010年所發生的一起墨西哥灣漏油事件，一間名為「

  深海地平線」的英國石油公司在墨西哥灣外海的鑽油平台因故障爆炸，造成11死17傷的重

  大事件。


  主演卡司包括馬克華柏格（Mark Wahlberg）、狄倫歐布萊恩（Dylan O’Brien，移動迷

  宮）、寇特羅素（Kurt Russell，玩命關頭7）、約翰馬克維奇（John Malkovich，變形

  金剛3）、凱特哈德森（Kate Hudson）以及吉娜羅德里奎茲（Gina Rodriguez，喜劇影

  集Jane The Virgin），將於2016年9月30日美國上映。


  ------------------------------------------------------------------------------


  心得：喜劇、動作皆能演，馬克的下一步是積極進軍奧斯卡？


  --'
