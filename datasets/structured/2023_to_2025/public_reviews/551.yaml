url: https://www.ptt.cc/bbs/movie/M.1554263766.A.E5D.html
title: '[好雷] 深海救援'
content: "雷文防雷資訊頁\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n1.影片名稱\
  \ :深海救援\n\n2.觀影時間 :20190402 1935\n\n3.觀影地點 : 桃園統領威秀\n\n4.觀影方式 : 自行購票\n\n§其他防雷說明(非必要)\
  \ : n刷等其他說明請於此區說明....可留空\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n十幾年前好萊塢流行拍潛艦片\n像紅色十月 U-571 K-19\n都是一等一的好片\n但又消聲匿跡一陣子\n\
  去年的潛艦風雲後\n又跑出這部潛艦\n所以就去刷來看\n\n背景是蘇聯解體後\n北方艦隊的最新潛艦的庫斯克號\n因為演習魚雷的爆炸意外\n使得潛艦沉在海底\n\
  而主角群抱著一絲希望\n希望軍方能跟他們一樣\n看到自己的同袍受困\n一定會想盡辦法救他們\n\n結果事與願違\n上面的長官仍沉醉在昔日蘇聯的威盛\n而看不清自己老早已日落西山\n\
  明明有很多機會請其他國家幫忙\n但卻拉不下臉 同時也怕機密外漏\n而放任自己的同袍在水下等死\n三次的救援行動都因設備破舊而失敗\n前面婚禮時 童唱團跟水手合唱團在高歌\n\
  對比劇終喪禮 只剩下童唱團及遺孀\n真的讓人看了不免鼻酸\n\n劇情其實是三個方向在走\n一是水手受困 對於求生的掙紮\n二是親友為了尋求真相及求援 到處奔波\n\
  三是軍方的救援行動及政治角力\n\n這三條線 到了第二場記者會\n整個交織在一起 達到本片的高潮\n而北海艦隊的司令也因此動用私人關係\n求救於英國海軍\n無奈最後還是因為官僚\n\
  害死了這些水手\n\n總之 這部片劇情非常流暢\n毫無冷場\n不知道背後故事的觀眾\n應該對高層的官僚恨的牙癢\n而也對水手的處境捏了好幾把冷汗\n演員的演技都是高水準\n\
  尤其是男主的兒子\n一開始與家人和睦\n到事發後 從頭到尾的壓抑情緒\n真的讓人很不捨\n配樂也是一流\n婚禮跟葬禮的音樂\n可以收藏起來慢慢欣賞\n如果滿分10分\n\
  我打這部8分\n\n\n\n\n\n\n\n\n\n\n-----\nSent from JPTT on my Asus ASUS_Z012DA.\n\n--\n\
  \  如果我們要把磁鐵棒放進線圈，                        　\n　線圈會說「不!!不要過來!!」而發出阻力不讓磁鐵棒靠近。\n　但是如果我們要把放進去的磁鐵棒從線圈拿走，　　　　　　　　\
  \      「傲嬌是一種\n　線圈反而會說「我…我又沒有叫你走!!」而發出阻力不讓磁鐵棒離開。　　自然現象」\n　這種現象不就是傲嬌嗎！　　　　　　　　　　　　　　　　　　　　\
  \  新科科人雜誌\n　所以傲嬌這東西根本不是新梗，19世紀就有科學家發現傲嬌了。　　　　　／民明書房\n\n--"
