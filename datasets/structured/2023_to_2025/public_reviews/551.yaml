title: '[爛雷] 深海終結戰'
content: '真的是爛到無法言語

  過程中一直向離場

  整部片沒有什麼重點

  要驚悚沒驚悚

  要爽片沒爽片



  還是勉強來說優點

  深海動畫不得不說真的很好

  前半部有稍微一點氣氛

  強調是”稍微”

  女主角很會演  那種內心恐懼有演出來


  結論是等DVD再來看好了

  除非你是深海控 不然不值得進去電影院





  -----

  Sent from JPTT on my iPhone


