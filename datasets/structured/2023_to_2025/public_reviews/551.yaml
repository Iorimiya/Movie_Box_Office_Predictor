content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  1.影片名稱 : 庫爾斯克號 深海救援


  2.觀影時間 : 2019/03/22


  3.觀影地點 :


  4.觀影方式 : 自行觀影


  夾銗L防雷說明(非必要) :




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  此區為發文防雷頁

  可選擇性提供上列 1~4 資訊  或不提供亦可

  觀影心得於分隔線下方發布即可


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看電影之前，先跟我大喊一下

  我愛柯林佛斯，柯林佛斯超帥

  西裝柯林佛斯、毛衣柯林佛斯、眼鏡柯林佛斯都超帥

  但軍裝真是帥出一個新高度

  他真的是我這輩子看過最適合穿正裝的老帥哥了


  咳，好，正題開始



  其實剛剛想標題想了很久，有點掙扎到底要給好雷還是普雷

  猶豫地點主要是因為這個故事實在太悲傷了，看完之後真的心情、挺複雜的

  原本就知道這個歷史事件

  因此也做了好可能會看到很多犧牲的準備買了票

  本來抱著一點點微小的希望會有個還算不那麼令人難受的結局

  但果然真的是難過到不行QQ


  故事的部分其實都可以上網google一下這個事件

  這裡就不多做贅述

  想先講一下畫面的部分

  原本我預設的深海畫面其實是很昏暗的(大概DC那種?)

  結果其實出乎我意料的還不錯

  視覺效果跟配樂都很棒

  當然也是因為這樣更讓人可以深刻地感受到情緒

  以至於一次次的得救機會消失後，那種失落感又更大了…….


  看完電影後，我覺得最難受的部分是俄羅斯政府對於搜救的態度


  不論是對家屬們的說法或是有人主動提出想要幫忙搜救的時候都是

  可以理解政府高層有需多政治面的因素考量

  但，在整體利益面前，人命難道就是這麼不堪的存在嗎？

  這麼不重要嗎？

  當大家在緬懷、在歌頌以往的榮光

  卻忘卻眼前最需要拯救的人

  這真的是我們希望發生的事嗎？

  讓我不禁聯想到社會的現況

  大家都想偉大、都想成為舉足輕重的人

  卻總是看著那個遠大的目標，而忽略了我們現在最該伸出援手的對象

  未免也太悲傷了，不是嗎？


  --'
