title: '[請益] 深海擴散的結局'
content: '以下的討論有雷

  ...

  ...

  ...

  ...

  ...

  ...

  ...

  ...

  ...

  ...


  我知道裡面有提到一個神話

  所以最後被感染的女主角跳進去海裡面游向怪物

  然後最後的男性倖存者坐在小船上，小船底下出現了一堆藍藍的藍眼淚

  跟神話的故事很像


  可是

  可是

  可是

  我看完有不同的觀感耶


  因為船底下散發出的顏色，跟水底下的怪物的顏色明明一模一樣呀

  所以我當下的感想是，倖存者船下出現一堆這樣的怪物，而且慢慢地浮上來

  因此那個男倖存者才會坐在船上向遠方招手呼救~


  不知道有人跟我的想法是一樣的嗎?










  --

  Sent from my Windows


