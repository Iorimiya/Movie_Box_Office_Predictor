url: https://www.ptt.cc/bbs/movie/M.1717185404.A.4EF.html
title: '[好雷] 負1哥吉拉之深海大貓咪'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  真不愧是期待很久的神片，光有經典配樂就80分了，開場的絕望感就滿滿的，跟美國猩猩

  大戰的感覺，真的高下立

  判.....

  但是跟正宗哥比起來，負1哥的行為真的討喜多了XDD，根本就是貓咪!!!從咬火車那邊，

  再到隨著後段主角戰機，被他逗弄然後追隨他，根本逗貓棒，就連破壞銀座那邊，也覺得

  真的好萌，只是他大隻了一點，還有無敵BUFF




  一開始在島上其實完全可以理解男主角的心境，這麼近到底誰敢開槍，隨著劇情演進，才

  知道男主角是神風特攻隊，只不過他因為害怕逃避了他原本的任務，所以他基本上已經逃

  避了兩次，而且兩次都讓他有滿滿的罪惡感，加上PTSD，後來終於口爆哥吉拉，救贖自己

  ，雖然說皆大歡喜的大結局很快樂，也有往前邁進的感覺，但總覺得有點太美好了，主要

  出現的角色幾乎都是存活的XD

  連女主角也沒賜死，只能說太神了，得有續集吧!!



  btw，銀座男主角跟女主角眼睜睜看著哥吉拉噴出射線那段，雖然說有點事後論，但怎麼

  說那個情況也應該繼續逃吧，居然就站在原地看，也不找遮蔽物，害女主直接被熱風捲走

  XD



  最後感謝Netflix,真的是太驚喜的上架了！



  --'
