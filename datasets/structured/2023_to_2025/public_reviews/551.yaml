content: "雷文防雷資訊頁\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n1.影片名稱\
  \ :   庫爾斯克號：深海救援\n\n2.觀影時間 : 0328\n\n3.觀影地點 : 絕色影城\n\n4.觀影方式 : 自行購票\n\n§其他防雷說明(非必要)\
  \ :\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n此區為發文防雷頁\n可選擇性提供上列\
  \ 1~4 資訊  或不提供亦可\n觀影心得於分隔線下方發布即可\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n在看這部片的時候，其實我一直不太確定到底是為什麼而難過，是看著希望一次又一次的破滅終成了絕望，還是所有的遺憾其實並非不可挽回著？\n\n人為災難的發生，往往就是從一個細小環節開始脫落，然後層層連鎖，於是那就會演變成爲了一場悲劇。\n\
  \n而這樣的災難是否可以預防其發生呢？答案是可以卻也同樣是不可以。\n就像電影裡早已測得魚雷溫度不正常升高著，而我們卻還是選擇遵守著制度、相信著規範，畢竟還沒到那爆炸的警戒值，不是嗎？\n\
  直至發現機器早已失靈，碰的一聲炸開了所有危機\n\n而在如此絕望的處境之中，我們能做的到底又是些什麼呢？\n答案是相信。我們必須甚至是也只能這麼相信，一定會獲救的！與其說那是因為不想死，倒不如說是想活下去的念頭更爲強烈\n\
  \n如果知道前方是個需要喪失著生命才能守護的東西，仍能如此義無反顧選擇去守護嗎？\n我不知道，但當我們做出如此抉擇的時候，那不僅僅是因為盡忠職守，也非只因為勇氣而已，更重要最後會被遺留下來的總是愛，請告訴我的老婆，我愛她。\n\
  \n電影裡有個北極熊的笑話，小北極熊一再確認自己是不是北極熊這段，與後來的電影結尾的一段台詞：「水手會去救水手」，對比著船艙外頭政治世界複雜的考量，以及政府發言人所說：「當初從軍之時，那些年輕人都早已立下誓言，要用生命捍衛國家。」如果早知會有今天這場災難，我不太確定那些受困船艙等待救援的人們是否還能無悔當初的決定，可我們都更想相信「水手會去救水手」。\n\
  \n就像我早已知道這部電影結尾會是些什麼，當救援團隊終於打開了船艙時候，投下了螢光棒的那幕，即使知道早已不可能，卻還是想去相信，所以眼前那靜默的畫面才會如此讓人難以承受吧\n\
  \n\n\n\n\n-----\nSent from JPTT on my iPhone\n\n--\n人生有許多的可能和不可能\n\n        別讓你以為的不可能限制你的可能\n\
  \n--"
