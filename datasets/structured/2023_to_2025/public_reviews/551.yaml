url: https://www.ptt.cc/bbs/movie/M.1579864074.A.78B.html
title: '[負雷]  深海終劫站'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  一開始看了板上的評論有點兩極，想說衝著克蘇魯以及克莉絲丁史都華去看看，沒想到整

  部片好看的地方只有前十分鐘...



  是不是整部片的經費都拿來請克莉絲丁？感覺的出來導演很想營造深海那種幽閉的恐懼，

  很遺憾整部片我完全感覺不出來任何緊張的感覺，怪物是很神秘啦、神秘到看完幾乎沒印

  象，氣氛營造也沒有巨齒鯊那種明明知道怪物就在外面但還是很緊張的畫面，情感刻劃真

  的0分



  劇情也是爛到爆，可以比拼我心中第一爛片第七傳人的那種爛，本來以為會在一站一站的

  關卡中慢慢讓觀眾了解到這些怪物的線索，結果完全沒有，起、承、轉、合 只有做到起

  。


  一開始心中推敲的劇情以為會像侏羅紀公園那樣，某人帶走那隻寶寶怪物要做研究，然後

  外面的大怪物知道了開始窮追不捨，最後不得已只得歸還寶寶，最後怪物回歸到幽暗的深

  海中，如果劇情像我這樣想還不會這麼難過，這部片水準就是有克莉絲丁的B級片，拿掉

  克莉絲丁這部片就什麼都沒有了，整部片幾乎撐著眼皮忍住睡意看完，看完真的很像掐死

  自己為什麼花1小時40分來看這種片。










  --'
