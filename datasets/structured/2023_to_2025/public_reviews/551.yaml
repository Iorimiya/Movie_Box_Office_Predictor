title: '[好雷] 庫爾斯克號：深海救援：一切都是人禍'
content: '1.影片名稱 :庫爾斯克號：深海救援




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  觀賞【庫爾斯克號：深海救援】是一個相當悲傷的觀影體驗。


  2000年的時候，當我看到庫爾斯克號船難發生之時，相當恰巧的，我才剛剛看完湯姆克蘭

  西的小說改編，約翰麥提南執導的電影【獵殺紅色十月】，當時，看到電影當中蘇聯高層

  為了隱蔽紅色十月號的叛逃，而向美國宣稱紅色十月號發生了意外，對比了現實世界的事

  件，真是巧合的不寒而慄。


  在當年，庫爾斯克號最令人震驚的消息，是這艘潛艦在意外發生之後的數小時後，仍舊發

  出敲擊聲響，這代表艦上仍舊有生還者。然而悲慘的是整個俄羅斯搜救隊的進展緩慢，因

  此當最後救援隊終於進入了艦內時，庫爾斯克號的倖存者已經全數罹難。


  而在19年後，盧貝松製片、湯瑪斯凡提柏格執導了【庫爾斯克號：深海救援】，就像【聯

  航93】一般，這部電影結合了在船難過後數年後的調查報告資料，以及一些戲劇上的杜撰

  ，將庫爾斯克的船難呈現在大銀幕上。


  俄羅斯北海艦隊庫爾斯克號的成員，在2000年出航的前夕，生活並不優渥，甚至還頗為拮

  据，主角麥奇狄米崔甚至為了幫同袍張羅婚禮，得賣掉自己的潛水錶，電影的前半截花了

  二十分鐘鋪陳庫爾斯克號的艦員在岸上的日常生活，為了就是讓觀眾更貼近艦員。


  故事進展到潛艦出航演習後，俄羅斯在蘇聯解體後軍備費用緊縮的壓力之下所暴露出的窘

  迫就更加體現，庫爾斯克號雖貴為前蘇聯最高技術結晶的產物，然而運載的魚雷卻極不穩

  定，魚雷室的船員在搬運魚雷之時，都還要不斷的檢測溫度，一旦溫度過高，就有爆炸的

  可能，一群船員忐忑不安的極度希望這顆魚雷能夠儘快發射，但是事與願違，忠誠的俄羅

  斯海軍堅持遵守規定，因此災難就在多等個幾分鐘之後無奈的發生了。


  災難總是在一切還沒準備好之前猝不及防，船員們連話都來不及說完，爆炸就發生了。


  而在事件發生之後，電影的重頭戲才登場，可是劇情是如此的沈重，俄羅斯官方在事件發

  生之後並沒有立即派遣搜救船出海。是在事故發生之後十二個小時後，聲納員聽到了敲擊

  聲，確認艦內有生還者才開始搜救。


  悲慘的是，由於經濟不景氣，俄羅斯僅有的三艘搜救潛水艇只剩下一艘可出海，而且老舊

  不堪，下海一次，電池用完還沒有備用的替換品，得充電十二個小時才能再次下海，眼見

  著黃金救援時間越來越短。


  而製作團隊的編劇所描繪的艦內成員求生過程，諸如強打精神說笑話、阻止急著求生的船

  員打開艙門、為家鄉的孩子寫信、或是在最後一刻為了打破絕望吃起了存糧的描述，都越

  發使人心酸。


  即使知道最終的結局是個悲劇，這個故事仍舊能拍的令人動容。


  因為在內心深處，作為一位觀眾，我是那麼的希望這些擁有手足情深又堅定求生的船員們

  能夠獲救。


  特別在這些人真的有希望獲救，卻被高層緩慢的政治決定所害，讓整個俄羅斯艦隊的成員

  與鄰近海域的搜救船隻眼睜睜地看著這25個船員活活的溺死之時。


  當挪威與英國聯合搜救隊終於獲准下海，打開庫爾斯克號的船艙時，已經是事故發生後九

  天了。


  這個船難的起因雖是個意外，但是造成悲劇的結果卻是實實在在的人禍啊。


  【庫爾斯克號：深海救援】中文預告



  國家地理頻道所製作的庫爾斯克特輯



  探索頻道也有製作一支打撈庫爾斯克號的節目

  Discovery 打撈庫爾斯克號












  --


  男人是一種很悲哀又很容易控制的動物，因為他們往往拼了命的取悅異性，或是從各種媒

  介取得任何可以引起性幻想的事物，甚至還因而犯下強姦或是偷窺等大小不一的罪，但是

  追根究柢，目的卻只是想要從自己的身上擠出那麼5C.C的液體而已。

  粉絲團



  --'
