  故事改編自俄羅斯潛艦K-141 庫爾斯克號災難事故，當時進行作戰訓練的庫爾斯克號內魚雷自爆，造成潛艦內部重大傷亡，118名船員中倖存的23名逃過爆炸，但潛艦沈沒在巴倫支海2000呎深處，命懸一線的船員們只能依靠僅存的糧食與氧氣等待救援，俄羅斯政府卻拒絕外國推進援助......


