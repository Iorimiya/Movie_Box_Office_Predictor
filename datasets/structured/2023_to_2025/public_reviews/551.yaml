title: '[好雷] 深海擴散 Sea Fever'
content: "《不可能的任務：失控國度》唱片行正妹 Hermione Corfield主演新片上映了、在台灣廳數竟還排第二、像我一樣對她念念不忘的觀眾一定要把握機會呀！記得幾年前她還是專任片頭客串的便當戶，現在也終於開始主演小成本電影練習挑大樑。不過當然年輕美女的出道戲路以驚悚片優先，她在上一部《鏽溪驚魂》飾演被追殺的田徑女大生、在森林裡給凶神惡煞追著跑，在這一部《深海擴散》則飾演被異種糾纏的博士生、在海中潛水與海怪周旋...\
  \ 不知道，她有沒有機會繼 Kaya Scodelario之後成為下一位英國銀幕運動正妹呢？\n\n\n這部倒不是英國片，是蘇格蘭瑞典比利時愛爾蘭合製，故事設定在愛爾蘭漁村，Hermione還特別染了一頭紅髮學了一點口音裝愛爾蘭人，可惜愛爾蘭招牌紅頭髮\
  \ redhead在愛爾蘭漁村卻是大不吉：漁船要出海、紅髮女子就是凶兆！尤其這艘漁船名取自愛爾蘭神話名叫「金髮妮亞芙」Niamh Cinn-Oir/Golden-haired\
  \ Niamh，女子唯金髮才是王道、而且來自北歐的維京船長就是金髮！至於男性船員呢，那倒隨性多了，要棕髮還是黑髮從哪裡來都沒關係，這裏還有敘利亞高材生難民呢，剛好這和「金髮妮亞芙」的人類情人\
  \ Oisin形象相吻合...\n\n\n\n\n會引入這種浪漫神話典故，這初次拍劇情片的愛爾蘭編導 Neasa Hardiman 的確是很浪漫也很細心的，她拍這種「深海異種」類的恐怖片一點都沒要獵奇嚇人的意思，反而更傾向要藉由面對異種來探索自然、探索人文、探索神話、探索感情、也探索倫理。在方面，自毋待言，就是要來探索深海未知生物的：女主角\
  \ Siobhan「小芳」（字幕翻「西沃恩」但我都稱「小芳」）本是大學研究室裡的宅女博士生，對科學研究百分百專注、與研究室同儕幾無任何私交與社交，教授終於看不下去了把她踢到漁船上做研究實習：「下個田野、把手弄髒、交交新朋友。」\n\
  \n\n結果在探索到自然異種、甚至開始抓到些漁獲可觀察之前，她要先：漁船，是跟她天差地遠的傳統漁村小世界！小芳在研究室就已經離群索居不善與人打交道，在這艘船上七人小世界裡這麼多天怎麼存活？說實話，看\
  \ Hermione 氣鼓鼓地一個人帶了麵包躺在床上慢慢嚼，那吃相也挺令人怦然心動！無法融入人群，一開始看似小芳的致命傷，但臨危才發現這正是她強項：當這群傳統漁民們事事只想求個吉利、有異狀只想告訴自己沒發生、發生了事情只想訴諸上帝保佑圖個心安時，只有小芳能冷靜理性以科學領導，還真的一步步讓迷信的漁民們相繼折服。\n\
  \n\n這漁村人文儘管保守排外充滿迷信，但那迷信也是種文化、而且相當美麗也有其啟發，只是那冥冥之中呼應處境的「啟發」，小芳直到片尾才會恍然大悟、毅然做下終極之舉。小芳跟著船長\
  \ Freya，就從一場海上異象的解讀開始：對小芳來說很理所當然，第一直覺的判讀就先假設是海中生物的發光；但浪漫感性的 Freya娓娓道來「金髮妮亞芙」神話：妮亞芙為了拯救愛人、毅然跳進海裡犧牲了自己，但她並不是犧牲了生命、而是永存大海中發光照亮著人們。嗯，科學基本教義的博士生本該嗤之以鼻，但看見\
  \ Freya那虔誠讚嘆的臉龐，還能不為之動容嗎？\n\n\n\n\n話說神話的金髮女神妮亞芙，是與凡人肉身的人類王子相戀，那這艘船上卓然出世的紅髮科學家小芳，也將與這群看似天差地遠的漁村鄉民交心一場嗎？當小芳悄悄開始時，我們都會開始對船上帥男點個兵，除了老廚娘與船長夫婦外，剩下三位個個是純樸可愛心懷理想的鬍子男、而且還各有飄洋過海追逐夢想的滄桑故事呢，到底誰有幸一親正妹芳澤呢？很遺憾，恐怖片公式，最有機會相戀的、通常也都最先立起那面旗...\
  \ 無論如何這些膚色黝黑令人心動的年輕男子們，都是小芳這女科學家要下凡拯救的，正如女神妮亞芙拯救凡人愛人 Oisin一般。\n\n\n本片核心的「深海異種」相關情節，我就不爆雷、請觀眾自己去看，只能說真嚇人的場面少，倒是一次次緩慢的緊張與未知的神秘，靜靜考驗著主角們的應變與自處、也靜靜勾動觀眾憂慮的心弦。最終很應景地，要了：這艘努力逃離異種想要回家的小漁船，也面臨了今春世界許多郵輪面臨的\
  \ quarantine 「隔離」問題，別說像古威尼斯人隔離四十天了，這群漁民們隔四十小時都不願！的確，隔離這件事是需要大視野的，它保護的已不是一人一船的生命，而是親友城市乃至整個愛爾蘭島的生命！人情互助的漁民們都聽不進、唯有科學家小芳能壯士斷腕...\n\
  \n\n這場倫理辯論，不只是專屬科學家的自然辯論，最終還是科學家與漁民之間的文化辯論：理性地自毀救人類也救地球、你們卻感性地相濡以沫只想救眼前的人？電影最後，兩邊的兩位女性都做出了彼此學習的超越：最傳統最鄉愁愛船如愛女兒般的船長\
  \ Freya，大膽放下了一切文化包袱展望了未來；反而最冷酷理性大局為重的科學家小芳，也在最後放棄理性擁抱人情做出了屬於她的「信仰躍」Leap of Faith\
  \ ！原來，愛爾蘭傳送數千年的「金髮妮亞芙」捨己為愛之神話，都會成真的！\n\n\n\n\n一部深海異種恐怖片，能夠有這樣絢爛瑰麗的結尾、有正妹成仙的奇異恩典、耳邊響起蕩氣回腸的「女兒樂團」片尾曲\
  \ \"Swallows\"...  這真是我近年見過最異色浪漫的恐怖片了！話說「金髮妮亞芙」的神話真是如此說的嗎？查一查就知好像不盡然，就像此片許多的漁民文化與生物學知識都令人半信半疑地\
  \ XD 不過此片認真紮實說服我們一切為真的誠意十足！在漁船的汗水淚水髒污腐朽等質感都歷歷在目、佐以漁民時而親切時而頑劣都栩栩如生，簡直帶我們跟著小芳跑船一遭呀！\n\
  \n\n《深海擴散》對我來說是一部影音的饗宴、是一場文化神話的洗禮、也是一場理性感性的辯論、當然最重要的是文武雙全正妹演員 Hermione Corfield發揮演技散發魅力的舞台！它是深海異種片，但這深海異種儘管是我們的敵人、卻瑰麗絕美令人好奇、最終也與正妹天人合一了...\
  \ 這位愛爾蘭女性編導拍起恐怖片來，結合了文化科學神話愛情、以及疫情當頭應景的人與自然之倫理、是我心目中「浪漫主義恐怖片」的文藝復興！推薦看恐怖片樂於欣賞正妹享受浪漫的觀眾來看看。\n\
  \n\n\n\n\n--\n最後，整理一下正妹新星 Hermione Corfield的歷次精彩演出：\n\n 0. Schweppes 薑汁汽水廣告 (2014)\n\
  還沒演電影還在當模特兒拍廣告時，就被西班牙天后小潘潘看上了！\n\n\n 1. 不可能的任務：失控國度 Rogue Nation (2015)\n一演電影開始當「片頭便當正妹」，就擔綱阿湯哥魂牽夢縈的「湯女郎」！\n\
  \n\n 2. 傲慢與偏見與殭屍 Pride and Prejudice and Zombies (2016)\n「片頭便當正妹」戲路演到古裝去，比同片女主 Lily\
  \ James 還惹人憐愛！\n\n\n 3. 墮落天使 Fallen (2016)\n二線反烏托邦少女片，終於得到個有點戲份的角色，只不過是欺負女主的女王蜂...\n\
  \n\n 4. 限制級戰警：重返極限 Return of Xander Cage (2017)\n「片頭正妹」不再領便當！出水芙蓉的少女駭客宛如馮迪索的大姐頭！\n\
  \n\n 5. 星際大戰 8: 最後的絕地武士 The Last Jedi (2017)\n星八少數令我熱血沸騰的空戰，她就有參加！只是帥完後又當起「片頭便當正妹」了...\n\
  \n\n 6. 翡翠酒店 The Halcyon (2017)\n終於在 ITV時代劇演到了主角！風雲薈萃二戰大旅館，戰爭與和平都操在她手上！\n\n\n 7.\
  \ 屠宰場守則 Slaughterhouse Rulez (2018)\nSimon Pegg & Nick Frost 又一部英國黑色喜劇，她演個花瓶倒也演得很用力...\n\
  \n\n 8. 蜜蜂釀蜜 Bees Make Honey (2018)\nAlice Eve 與導演弟弟的派對電影！要搭擋派對女王重現戰間期風華，就要找 Hermione！\n\
  \n\n 9. 鏽溪驚魂 Rust Creek (2019)\n第一次擔綱主角的電影！要跑要打要磨演技也要操體力， Hermione 統統做到了！\n\n\n\
  10. 生即是王 Born A King (2019)\n沙烏地王室片，小酋長出訪英國邂逅了瑪麗公主。希望 Hermione 藉此打開阿拉伯市場。\n\n\n\
  11. 深海擴散 (2019)\n第二次擔綱主角的電影，我覺得也是歷來最美的一次！喜歡 Hermione 的觀眾快來看！\n\n\n--\n我覺得結尾有一種莫名的感動，我還在想哪個措辭比較準。好像是溫馨？好像是暢然若得？或是悵然若失？突然覺得找不出言語來形容的，更美。\n\
  的確，這就是一場古代保守鄉民 vs 激進道德魔人的文化衝突。不過就算未必認同，我也一直都是很敬佩道德魔人的，前提是道德真是他們不惜放棄一切的真正目的、而非他們暗地自利的表面手段。\n\
  的確是有點太聖母，已經聖到愛爾蘭傳說「金髮妮亞芙」的神話地位了 XD\n不過在這疫情期間，我們也已趁機回顧過許多活屍片與疫情片的「人類豬隊友」們...\n人人對未來都只是未知摸索，要當諸葛總只能等事後，\n\
  我是覺得兩種極端意識能激辯一場、甚至如本片最後能放棄原則互相學習，都是好的，\n至於結果成不成功呢，聽天由命吧。\n在當代，有時候，我覺得不紅片的品質，還比大紅的（好萊塢商業大）片來得穩定呢\
  \ XD\n當然獨立小片很多，要選到好的需要挑劇本挑團隊，我覺得她主演的這兩部都頗有水準\n謝謝！我幾年前也被指控過「業配」，現在換了個詞改被指控「寫手」，以前也許還會驚恐一下下，現在只覺得笑一笑就忘光光。話說那一次之後我才慢慢開始認識「業配」這東西是什麼，不過這次我仍然不知「寫手」這東西是什麼\
  \ XD\n當不合（某些被視為放諸四海皆準的）「理」時，我們就知道編導重的是「情」了：每一個情都可能有一個屬於他的理，針對這位 Siobhan電影也從頭到尾拍下來步步建立了，就看我們想不想傾聽、傾聽完了又願不願接受。"
