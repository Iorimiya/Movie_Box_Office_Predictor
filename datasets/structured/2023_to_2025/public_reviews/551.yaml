content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  1.影片名稱 :《庫爾斯克號：深海救援》


  2.觀影時間 : / 拒答


  3.觀影地點 :  / 拒答


  4.觀影方式 :  / 拒答


  §其他防雷說明(非必要) : n刷等其他說明請於此區說明....可留空




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  此區為發文防雷頁

  可選擇性提供上列 1~4 資訊  或不提供亦可

  觀影心得於分隔線下方發布即可


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  圖文完整版：


  在沒有看過預告片段和電影介紹的情況下，只看到電影海報上寫著「水深2000呎、23名倖存軍官、黃金救援216小時」，抱著像其他災難電影故事末可以看到生還的希望進行觀影，卻隨著故事推進很多情緒漸漸被堆疊起來。


  《庫爾斯克號:深海救援》劇情改編自歷史俄羅斯潛艇K-141庫爾斯克號真實災難事件，該潛艇隸屬俄羅斯北方艦隊，艦隊裡軍官彼此情誼深厚，為了夥伴的婚禮二話不說典當身上重要的潛水錶，在婚禮上也可以看到水手們為身為水手而驕傲，家眷也是如此。


  結果出航演習後潛艇內魚雷不斷升溫，雖在安全溫度內卻還是意外爆炸，導致潛艇沉入深海之中，僅有少數人員逃過這一劫躲到船尾等待救援，期間家眷們也不斷和官僚抗爭，但官僚一直避重就輕。


  由於庫爾斯克潛艇難以被偵測到存在，而擁有奧斯卡等級的美譽，原本還在猜想是不是發生災難後會因此拖延到救援時間，結果卻是官僚文化為保護國家機密與維持國際情勢，遲遲不願接受他國協助，看到這裡著實很讓人感到憤怒，同時看到水手們那相互依存的情懷也有些感人。


  俄羅斯自己派出的救援艇，由於設備老舊每次抵達船艙口時，總電力就會不足25%而被迫折返，庫爾斯克號內的船員前兩次還開心地拼命敲打，希望能夠被知道他們還活著，連某位水手也開心到忘記手中拿著遇水易燃的東西，看到這裡也很為他們捏把冷汗。到後來等待被救援的船員們只能苦中作樂，上一秒開心吃著所剩食物開著玩笑，下一秒遇水易燃的東西還是不慎落水引發火災，雖沒有人員傷亡仍造成艇內氧氣大量減少，最後看到他們一群人唱著軍歌貌似為彼此告別的模樣，有種說不出的無奈和心酸，故事最後俄羅斯終於接受他國的協助仍為時已晚。


  整部電影故事節奏和視覺效果都算恰當，在關鍵時刻都能讓觀眾做足心理準備，觀眾可以很容易地隨著故事線發展跟著主角們的遭遇而入戲，從電影之中也看到不少赤裸裸的人性，在事件發生當下要如何選擇就顯得相當重要，例如等待命令才能發射魚雷，或必須得到司令同意才能救援，導致軍官部屬們的盡忠最後好像只能淪為愚忠，無奈外也多麼諷刺。



  -----

  Sent from JPTT on my Asus ASUS_Z017DA.


  --'
