url: https://www.ptt.cc/bbs/movie/M.1507794525.A.9F7.html
title: '[好雷] 《深海謎情》(The Deep Blue Sea) '
content: "◎《深海謎情》(The Deep Blue Sea) - 你明知永遠得不到的那個人\n\n圖文完整版： \n\n有句話說\"caught between\
  \ the Devil and the deep blue sea\"，意指進退\n維谷、兩種選擇都很糟。由瑞秋懷茲、湯姆希德斯頓主演的《深海謎情》，\n英文片名\"\
  The Deep Blue Sea\"正是來自前述的慣用語。故事背景設定於\n1950年左右的倫敦，Hester（瑞秋懷茲）是法官William（賽門羅素貝爾）\n\
  之妻，但她與前戰鬥機飛行員Freddie（湯姆希德斯頓）外遇並已同居數月\n。電影開始於Hester生日這天，她在與Freddie同住的家中意圖自殺。\nHester究竟如何走到這一步，其後又該何去何從？\n\
  \nHester（與霍桑小說《紅字》女主角同名）的困境，與她的時代緊緊相連。\n從最個人的層次來看，她對生活不滿足，被禁錮的人生充滿無力感，於是對\n幸福愛情的渴望，幾乎成了她唯一的出口，如果將Hester擺在現代，你可能\n\
  會要她學學布莉姬瓊斯（Bridget Jones），專心工作、做些蠢事、跟朋友\n玩樂，但50年代的女性世界是另一種光景，愛情、婚姻與生活沒那麼自由，\n處處是限制。在《深海謎情》裡頭她總是望著窗外、看著街道，望著某種不\n\
  屬於她的自由自在。\n\n更大格局看到的層次，是二戰戰後英國面臨的情境。剛進入50年代的倫敦，\n市民與都市都還未完全擺脫戰爭陰影，街區還有被轟炸後沒處置整理的廢墟\n\
  ，有些人也還沒從戰爭中回過神來，例如Hester深愛著的Freddie，就仍被\n戰時經驗影響，一方面懷念著過往榮光，另一方面得靠酗酒享樂來撐過戰後\n生活。這是人們都還在摸索如何向前走的時代，一不留神可能就有人在途中\n\
  摔得粉身碎骨。\n\n夾在愛她但她不愛的男人、與她愛但不愛她的男人之中，Hester必須從一無\n所有之中走出來，就像二戰後的英國。\n\nFreddie與Hester的感情，則是擺在哪個時代都很常見的。我想Hester心中\n\
  早就明白，她愛Freddie永遠比對方愛她多，而且兩人並不相配。電影前段\n，他倆全裸躺在床上的畫面性感又和諧，但其他方面兩人都有距離，例如去\n酒吧、去藝廊，都看得出彼此的勉強。\
  \ 只是生活貧脊的她，像個將溺水的\n人，抓到任何可能救命的物品都死命不放手，也不想面對現實。\n\nFreddie自認問心無愧，因為他從沒騙過Hester，從未掩飾自己不想承擔\n\
  Hester的心情起伏。身為觀眾，看著Hester的依賴與無理取鬧，我可以理解\nFreddie為何想逃避。雖然Hester或許是時代背景的受害者，但她總是散發\n\
  的「必須依附些什麼才能生存」信號，尤其是自殺舉動，讓Freddie更想逃\n避，畢竟他自己都還在調適戰爭帶來的個人影響。Freddie不僅沒法讓她快\n樂，甚至無法讓自己快樂。\n\
  \nHester與丈夫William則是相敬如賓／冰的關係，尤其William雖貴為法官，\n但仍受母親控制，任憑她影響自己小家庭的和諧。Hester與丈夫並非沒有溫\n\
  暖回憶，只是太過「家人」，太過冷靜，因此當Hester遇見Freddie，等於\n是個中年女人在談初戀，感受特別深、受傷也特別重。\n\n本片原是英國劇作家Terence\
  \ Rattigan在1952年的舞台劇作品，後來有各種\n不同版本，《深海謎情》是Terence Davies改編並導演的電影版本。\nRattigan與Davies都是同性戀，片中Hester一角雖是女異性戀，但處境與同\n\
  性戀有相似之處，生活如躲在櫃子裡，遮遮掩掩，躲躲藏藏。若以同志的角\n度來欣賞本片，在情感上也是說得通的。\n\n《深海謎情》在技術上成就非凡，尤其攝影極為優美，從開頭戲就美得驚人\n\
  。點著香菸的菸繚繞、光線中的灰塵浮沉，製造出如夢似幻的懷舊感。\nHester第一段自殺戲，特意使用淡出與融接（dissolves）等技巧，產生「\n時間長短模糊化」的效果，也製造出彷彿在睡意中打起精神的感覺。電影開\n\
  頭，鏡頭從晚間的市區廢墟一路推至Hester住家的窗戶，與之呼應的電影結\n尾，則讓鏡頭在白天由Hester家窗戶推移至街上、止於廢墟，這一回充滿光\n線，而且先是拍到了嬰兒車、再拍到幾個小孩在斷壁殘垣間打鬧玩樂，暗示\n\
  著城市甚至包括Hester都有走出陰霾的機會與希望。\n\n音樂的使用也是一絕，從開頭美國作曲家Samuel Barber的Violin Concerto\n\
  、Hester與Freddie共舞時的酒吧客人合唱版\"You Belong to Me\"、以及\nHester與丈夫在二戰時期躲在Aldwych地鐵站時旁人唱的\"\
  Molly Malone\"，\n搭配人物彼此的互動，美得令人目不轉睛，也透露許多不需言語的情感。尤\n其後面兩例，特別令我感觸深刻：在古代（欸），音樂大多是用來凝聚人的\n\
  ，不像現在一人一副耳機，音樂常被用來避開他人。\n\n女主角瑞秋懷茲演得精彩，越內斂的戲越動人，像她最後一次替某人擦鞋的\n那幕，表面很平靜，但背後的痛苦幾乎讓人不忍心看。不過她的弱點反而在\n\
  於外表太年輕漂亮。這故事文本的中年女主角，年紀比情夫大了一段距離，\n又比丈夫小了約十年，尷尬的年紀差距讓Hester在丈夫那兒找不到她想要的\n激情，面對年輕情夫又充滿不安全感。瑞秋懷茲的確大了湯姆希德斯頓快十\n\
  一歲，問題是外表看不出來啊！根本像同齡，也稍微減損了Hester角色的悲\n哀。不過，愛看俊男美女的話，這版本絕對可以滿足你。\n\nmyVideo馬上看：\n\
  \n--\n\n我的部落格 \nFB粉絲團  \n\n--"
