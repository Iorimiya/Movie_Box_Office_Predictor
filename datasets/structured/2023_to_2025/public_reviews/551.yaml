title: '[ 好雷]深海終結站 我的平胸小妖精 '
content: '圖文運動內衣版







  我的平胸小妖精不是我說的，是劇中的的角色說的，


  但是基本上已經是整片的重點了。



  自從暮光之城被女主角演技嚇到以後，


  看到她的戲都會直接跳過，


  就算看到有人說她演技有變好還拿什麼什麼獎也沒有多大在意。


  但是最近又看到霹靂嬌娃重啟版的預告覺得這位女星又重新吸引到我的注意，


  不過霹靂嬌娃不管哪一版我都沒有興趣所以又繼續pass，


  直到發現克莉斯汀史都華主演了這片，深海終結站的預告以及劇情是有吸引到我的。



  電影一開始就讓我確定我不會多在意劇情了，


  因為就是一場運動內衣美女的表演秀，


  連她背景在說什麼都沒有太注意，


  因為反正劇情也沒有意義就是個設定而已，


  但是視覺上的體驗真的好看，


  就看她穿運動內衣在刷牙、沒有什麼含意的救蜘蛛，


  然後就乒乒乓乓一堆爆炸反正也不用太在意原因，


  就是個美女穿著運動內衣在海底基地逃跑就很好看了。


  不知道運動內衣有沒有業配。



  在逃跑的路程遇到一個 黑人、一個白人、一個死人，


  運動內衣女神跟黑人白人又找到了一對演起來很不像情侶的情侶


  (我覺得這對設定特別差，不知道是人設問題還是演技問題，


  超不像情侶談起戀愛也超沒感覺)



  還有我一直覺得超帥的文森卡索。



  於是大家開始研擬逃難的方法，


  然後因為黑人必須死，所以讓黑人當了一下好人，


  死得不太有痛苦，死法也頗絢爛的；


  然後大家在有點發神經的白人不斷的搞笑下往下一步走，


  因為白人一直立旗所以大家知道接下來就是他了。


  裡面唯一劇情不是那麼好猜的就是情侶男說那麼大的一隻鑽油鑽頭，


  是怎麼被弄爛成這樣的，


  到後面出現那隻巨型怪物以後就知道為什麼，


  會再去回想他當初講的那句話，不過好像就這樣而已。



  因為其實預告就把劇情講得差不多了，


  所以大概就是盡情享受他的視覺跟體驗電影帶來的恐懼，


  本來覺得最後運動內衣女神有辦法反轉這一切的。



  算是很有娛樂性的作品。


  --'
