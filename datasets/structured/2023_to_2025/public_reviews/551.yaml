url: https://www.ptt.cc/bbs/movie/M.1554739320.A.F92.html
title: '[無雷] 誰能比我慘的庫爾斯克號：深海救援'
content: '這是個看完會想要砸螢幕的電影


  這是個看完會讓人很生氣的電影


  這是個看完會讓人很痛苦的電影



  不是因為他拍得很爛或是故事邏輯很低能


  而是因為劇情實在是太悲慘了  但邏輯跟故事卻沒甚麼問題  所以才不忍直視




  整場電影像是精神虐待



  給你一個希望  然後抽掉


  再給一個  再抽掉


  不斷的抽  抽到都想問候老師了還在抽..


  乾脆一槍斃了比較快






  看膩了好人打贏反派的電影  看完這部後會覺得  還是看好人打贏反派吧


  至少看完兩小時後會高興點



  與其選擇深沉的痛苦  還是選能哈哈大笑或是覺得讚讚讚的娛樂吧


  這部絕對不是看完會還會哈哈大笑的電影


  也很難覺得讚讚讚...雖然某些劇情還滿溫馨的



  但是劇情的本質就是  一個大大 慘 字



  還沒看但是想去看的鄉民  我個人真心建議換一部會更好






  --



  NieR:Automata - The Weight of the World


  --'
