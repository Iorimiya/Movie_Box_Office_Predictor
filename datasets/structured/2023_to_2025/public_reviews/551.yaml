url: https://www.ptt.cc/bbs/movie/M.1552894778.A.842.html
title: '[情報]2019真實磅礡災難電影 《庫爾斯克號:深海'
content: '網址:



  《庫爾斯克號:深海救援》改編自史上最嚴重艦艇沉沒事件:俄羅斯潛艇“K-141庫爾斯克

  號”災難事故。當時進行作戰訓練的庫爾斯克號內魚雷自爆，造成潛艇內部重大傷亡，

  118名船員僅剩23名倖免逃過爆炸，艦艇沉沒在巴倫支海2000呎深處；岸上的家人不斷拼

  命地與官僚鬥爭，船員們依靠僅存的糧食與氧氣等待救援…


  性格男星-馬提亞斯修奈爾，在片中擔任艦艇小隊長，與最後倖存軍官共同度過艱難時刻

  。片中他更大展姣好身材，大秀泳技，常常只穿四角褲在拍片現場跑來跑去，不時因為太

  專心拍攝，而四角褲掉至腰部以下，驚人的小馬提引得劇組演員鼓掌；。馬提亞斯修奈爾

  笑說：「這部戲有一半時間都泡在水中，小馬提時常凍傷，需要長時間復原，沒大家說的

  那麼誇張。」




  《謊言的烙印》導演-湯瑪斯凡提柏格傾力執導。這也是導演第二部英語長片作品，他曾

  經導演誇下海口拍片絕不使用特效，但在這部影片中卻食言了，導演表示：「自己實在太

  喜歡這部作品，但許多鏡頭實在無法真實呈現，所以請粉絲原諒我這次的行為!」


  電影劇本由《搶救雷恩大兵》編劇-羅伯特羅達特（Robert Rodat）執筆，由法國製片公

  司「EuropaCorp」製作，《攻敵必救》執行製作人-亞歷桑頓擔任製片，除了《紅雀》馬

  提亞斯修奈爾飾演電影中的主要角色，其妻子則為007性感女星-蕾雅瑟杜，更在片中不惜

  扮俗，奧斯卡影帝-柯林佛斯更加盟演出。




  電影《庫爾斯克號:深海救援》除了描寫船員在潛艇中試圖尋求一線生機的可能，並同時

  聚焦於陸地上的家屬們為了拯救命在旦夕的家人們與政府官員們的抗爭，更揭發政府的種

  種疏忽。電影將在2019年3月22日在台上映。


  雖然本身沒什麼在看這類型的片子，但看完預告之後就有些希望能夠了解當時是怎麼去搶

  救的部分，那過程想了解


  --'
