title: '[贈票] 深海鯊機廢圖王贈票活動'
content: '《深海鯊機》贈票活動

  專業的廢圖就靠大家的響應


  詳情請見


  ↓↓↓↓↓





  --


  《3D 食人魚》億萬製片再次打造全新戰慄鉅作！

  受困深海47米、氧氣僅存1小時

  鯊魚環伺 你永遠游得不夠快！


  #深海鯊機 劇情簡介：

  麗莎（曼蒂摩兒 飾）與男友分手後心情低落，妹妹凱特（克萊兒霍特 飾）邀她至墨西哥

  渡假散心，兩人進入巨大鐵籠潛入海中觀察鯊魚時，卻遭遇繩索斷裂意外，她們隨著鐵籠

  墜落至深達47 米的海底，不僅身上有近百公斤的深潛設備，氧氣存量更不到一小時，

  面對身旁虎視眈眈數十隻巨鯊的環伺威脅，兩人除了挑戰體力極限，以及深海壓力的限制

  外，她們必須在有限的時間內，想辦法逃出生天…..


  --


  威視電影的《深海鯊機》即將在 6 月 30 上映， FilmFilm 菲林菲林為粉絲謀到福利，將要送出 15 組電影特映票券，讓大家可以在炎熱的夏天，躲到電影院去感受清涼海底被鯊魚圍繞的空虛寂寞覺得冷。


  特映時間為 6/27 晚間 19：00 在台北信義威秀影城(詳細取票地點另行公佈，由得獎者現場取票)。


  --


  ★贈票規則：


  活動時間：即刻至 6 月 26 日 (一) 下午 17：00 止

  活動辦法：請在本預告片下留言， tag 一位願意跟他一起被困在海底 47 公尺的鯊魚籠裡

  的朋友，並在留言中 PO 出一張把自己 或 該朋友的 Facebook 頭像加入籠子或鯊魚的

  圖片(合成、插圖、塗鴉、貼圖皆可，從寬認定)，即可獲得參賽資格及抽獎號碼。


  (請見留言處由小編親身示範)


  我們將於活動截止後，於 6/26 下午 19：00 前選出 5 組最有創意的圖片，以及另外隨機

  抽出 10 位參賽的幸運兒，每位可以獲得兩個《深海鯊機》特映席次。



