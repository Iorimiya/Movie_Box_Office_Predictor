title: '[新聞] 轉貼~《深海救援》劇情真實上演！ 郵輪傾斜擱淺等候海上救援'
content: '新聞網址：


  《深海救援》劇情真實上演！ 郵輪傾斜擱淺等候海上救援


  21:292019/03/25 中時  徐桐炘




  柯林佛斯飾演援救軍艦指揮官。（海樂提供）



  上周六在挪威西部外海，一艘載約1300名乘客與船員的「維京天空號」郵輪因引擎突然故

  障，加上海象惡劣，船隻嚴重傾斜隨時會擱淺，當局出動直升機和船隻展開救援，幾乎無

  人傷亡，電影《庫爾斯克號：深海救援》同樣在描寫船難救援，則是改編史上最嚴俄羅斯

  潛艇「K-141庫爾斯克號」災難事故。


  當時進行作戰訓練的庫爾斯克號內魚雷自爆，造成潛艇內部重大傷亡，118名船員僅剩23

  名倖免逃過爆炸，艦艇沉沒在巴倫支海深處；岸上的家人不斷拼命地與官僚鬥爭，船員們

  依靠僅存的糧食與氧氣等待救援。


  劇本由《搶救雷恩大兵》編劇羅伯特羅達特執筆，由《攻敵必救》執行製作人亞歷桑頓擔

  任製片，除了《紅雀》馬提亞斯修奈爾飾演主要角色，其妻子則為007性感女星蕾雅瑟杜

  ，奧斯卡影帝柯林佛斯更加盟演出。


  該片除了描寫船員在潛艇中試圖尋求一線生機的可能，並同時聚焦於陸地上的家屬們為了

  拯救命在旦夕的家人們與政府官員們的抗爭，更揭發政府的種種疏忽，片商上週特地到成

  功嶺舉辦首映會，現場近千名軍士官眼眶泛紅哭成一團，著實感受電影的渲染魅力，電影

  全台熱映中。


  (中時 )


  #庫爾斯克號：深海救援


  這題材算是災難片類型吧

  大家會想進戲院看嗎?

  我覺得海上的災難場景一定要夠震撼才會吸引到我


