url: https://www.ptt.cc/bbs/movie/M.1717398329.A.692.html
title: '[好心得雷]《Yannik》—藝術恐怖份子的結局 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~













  《Yannik》—藝術恐怖份子的結局


  致謝 虛詞．無形 刊登本文： （&

  picture credit）



  若把電影視作文本，那《Yannik》肯定是絕佳的極短篇小說。小說的長中短各有千秋，即

  便作為虛構文本也仍然呈顯出不同的特色，全非僅以字數多寡定其優劣。只有比一小時多

  出幾分鐘的片長，相較於動輒兩三小時的「大作」，以簡鍊的篇幅以及如同希區考克的《

  後窗》只發生在一處的場景，這部作品探討了真善美以及權力等大哉問。


  Yannik 是主角的名字，完全不重要的小人物，一個夜班保全，在假期選擇觀賞戲劇，破

  格的是在劇演到中途時，突然站起來批評起「現在進行式」的表演。他說台上的演出是坨

  大便，在一個勞動階級必須花上僅有的（自由）時間—搭了四十五分鐘的車、走了十五分

  鐘的路，卻要看到這樣的東西？


  搭電扶梯應該要走右邊、博愛座應該要讓給老人，諸如此類種種都如同觀賞戲劇時應保持

  肅靜一般，係業經被社會大眾奉行許久至深信不疑的「傳統」。但傳統這回事，正是毋庸

  探究正當性的來源，僅因行之已久即具權威性，惟若對其深究將會發現內裡空無一物，不

  過，這個特質也正是為何社會中堅份子—或說既得利益者—會反對人民挑戰傳統的緣由，

  畢竟，維持現狀對作為既得利益者的自己最有好處了，不是嗎？


  當然地，背離於社會通念的舉止不僅被觀眾吐槽，更被台上的演員戲謔式地醜仿 Yannik

  離經叛道的舉動，然而卻正好被甫經攆出的他走回劇場給撞見。而 Yannik 手上有槍。整

  齣電影在揮舞著手上火砲的 Yannik 卻伴隨著他講著自己的人生大道理而充滿黑色幽默，

  頓時這成為一齣荒謬劇。他開始說著為何要等到手上有槍才願意聽別人說話？整齣劇（中

  劇）爛得透頂為何不能說？有些人如同自己是把被榨取到所剩無幾的時間投注於此，被「

  即便是爛表演也不該打斷」這種習俗給約束的觀眾們，跟當下被槍脅持著的大家，有什麼

  差別嗎？


  在原先問候他的櫃檯正巧走入劇場關心何以時間已晚卻還未散場時，Yannik 要求要一台

  打字機，他要創作一個比現在這坨屎更優秀的作品。他點了菸，一字一字慢慢打下誕生中

  的作品，同時，所有人都作為人質在如同被歹戲給拖棚一般綁架在現場。幽默是必須要被

  意會的，而不是被理解的，也因此那些有趣的互動與對白就只能透由電影本身來觀看，這

  裡所想聚焦的是在角色之間行為的動機及其分析故而只會論及重要的情節（plot），同時

  這也能避免搞砸了電影本身的驚喜。


  在故事的進行中的重要轉折在演員之一的 Rivière 在另一女演員的要約下，即若能成功

  搶走 Yannik 的槍就跟他上床，要怎麼搞都行。因此被點燃的男性氣概，使得 Rivière

  成功奪槍。乍看是具有勇氣的德行，但實際上可能不過是精神衝腦—性驅力而已，更見血

  的是拿到槍的 Rivière 不僅不是儘速報警，卻是反倒持著槍要 Yannik 做各種動作服從

  自己，換句話說就是把稍早的憋屈給發洩，填補受損的男性尊嚴。


  這裡我們可以看到 Joaquin Phoenix 在二零一九年所飾演的《Joker》中，槍本身所具有

  的象徵意義：權力。在這裡，槍也代表著權力，如同《蒼蠅王》的大海螺，有槍者有話語

  權，而絕對的權力則會使人絕對的腐化。但耀武揚威的 Rivière 也正因其肆無忌憚而吐

  真言，是的，他們稍早演的東西爛透了，透過這段對白，讓原先 Yannick 不惜打破規矩

  吶喊的批判獲得客觀（至少間主觀上）的證成。


  囂張沒有落魄得久，命運的偶然就像電影中編劇的筆，寫出了過路人看到被綁架的劇場時

  ，誤以為 Rivière 才是犯人，拿起滅火器敲倒他後，讓 Yannick 重拾話語權（手槍）

  ，雖然文字在描述這齣劇中劇肯定會抵達極限（幽默的不可理解性），重要的是這個臨場

  誕生的作品相較於台上演員原先表演的肥皂劇，不論對於劇中劇的觀眾，甚至對於劇的觀

  眾（也就是我們作為觀者）都是更為有趣得多，比如融合進了其中一個演員確實帶有體臭

  的這個特徵成為絕妙的笑點（雖說有些惡趣味）。但在這成功的表演之時，Yannick 流淚

  了，伴隨著即將攻堅的特勤小組，電影結束於斯。


  Yannick 追求美，所以他創作出讓眾人滿意的劇作時感動而泣；Yannick 追求善，所以他

  就打破毫無意義的社會習俗進而表態；Yannick 追求真，所以他說出了他所相信實在的話

  語（也在劇情中被第三人— Rivière 客觀地驗證，也就是原先的演出簡直爛透）。但這

  樣的人，卻可能會被「視為」—亦即至多是推定，卻未被證明—恐怖份子，是一個拿槍的

  瘋子，是一個綁架所有人的罪犯。但故事中我們可以看到，他甚至沒有阻止觀眾離席（有

  位屢次反唇的觀眾也未被阻撓離場），相較於那種「電扶梯要站右邊」的社會心理強制力

  ，是否 Yannick 真的是更加令人恐懼的呢？


  權力（Power）本不限於有形，甚至在權力的分析上有形的權力是最為表淺的，而更為深

  層的是決定議程（genda）的權力，甚至是鑲嵌在結構（因而隱身）的權力更然。但所有

  人總是眼見為憑，沒有槍就沒有威脅一般，卻可能深陷於虛假意識（False conciousness

  ）也從未自知，就如同因為所以一樣自然，因為大家都站右邊我就應該要站右邊，全然未

  慮及這顯然涉犯自然主義的謬誤（Naturalistic fallacy） 。但眼見真的為憑嗎？那麼

  在水中折射的吸管到底是彎的還是直的呢？


  我們看到 Yannick 雖然持槍，但他所擁有的權力不僅不比社會習俗的強制更多，甚至在

  結束時，國家（State 相較於 Society）的強制力—特勤小組，更是壓倒性地優越於一個

  拿著手槍的怪胎。如同前述地電影結束於此，但這完全不是一個開放式的結局，卻是可想

  而知的。而這，就是一個藝術恐怖份子的結局。


  （註：台灣就此電影譯為《衝三小劇場》，各種層面上都是十分優秀的翻譯，不僅對應到

  內容，更符風土。只不過本文認為原文《Yannick》更加能凸顯片名與主角作為故事核心

  的特徵，故擇用之。）


  --


  エル・プサイ・コングルゥ


  --'
