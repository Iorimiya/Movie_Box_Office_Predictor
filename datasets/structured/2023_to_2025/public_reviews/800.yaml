url: https://www.ptt.cc/bbs/movie/M.1513216419.A.C71.html
title: '[新聞]克里斯漢斯沃騎馬打5萬恐怖份子'
content: '新聞網址：


  近來因美國宣布耶路撒冷是以色列首都，引發全球譁然，也造成美國與中東劍拔弩張，而美

  國與中東的關係複雜，除了有緊張的敵對交鋒，卻也曾祕密合作，共同鞏固和平政權，如今

  這項機密任務即將揭密，改編為電影《12猛漢》（12 Strong）揭露911恐攻之後，首批祕密

  進入中東地區的美軍「綠扁帽」特種部隊12人小隊如何與中東反恐陣營合作，同仇敵愾擊退

  恐怖分子。


  《12猛漢》由「雷神」克里斯漢斯沃（Chris Hemsworth）飾演的隊長所率領的12人「綠扁

  帽」菁英小隊，在毫無後援下，冒險潛入中東地區，在短短3週之內，突破民族、宗教和語

  言隔閡，與當地反恐陣營的民兵攜手合作，更因地勢不利，以騎馬作戰的方式攻破恐怖分

  子的5萬大軍，致力維護中東和平。


  談到《12猛漢》真實事件，克里斯漢斯沃表示：「這是歷史上最偉大也最成功的軍事任務

  之一，這12人潛入中東並不是為了占領當地，而是想要取得當地反恐陣營的信任，與當地

  人結成同盟，合力阻止恐怖分子統治中東。」


  為求逼真詮釋「綠扁帽」特戰部隊的英勇行動，飾演12人小隊成員的克里斯漢斯沃、《夜

  行動物》麥可夏儂（Michael Shannon）、《蟻人》吸睛綠葉麥可潘納（Michael Pena）等

  人一起接受真正的美軍部隊成員嚴格訓練，包括武器操習、地勢推演和帶槍騎馬等。


  被問到在片中的騎馬戲是否艱難，克里斯漢斯沃笑說，自己演其他電影時已有騎馬經驗，

  但其中有許多演員是第一次騎馬，「不過在真實事件中，這些『綠扁帽』成員可能也是第

  一次騎馬，所以剛好符合角色設定。」


  《12猛漢》描述美國遭受911攻擊事件過後，祕密派遣一支俗稱「綠扁帽」的陸軍特種部隊

  潛入阿富汗，聯手當地北方聯盟，對抗阿富汗恐怖分子「塔利班」和蓋達組織，為配合阿

  富汗地形和攻敵戰略，特種部隊們駕著馬匹化身騎兵隊，在險惡的山區追擊敵軍，一連串

  生死交鋒的激烈戰爭一觸即發。電影預計2018年1月19日上映。


  --'
