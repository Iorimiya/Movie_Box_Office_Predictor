url: https://www.ptt.cc/bbs/movie/M.1471606464.A.B72.html
title: '[好雷]【妮嘉】空姐硬碰恐怖份子之絕地救援 '
content: "網誌多圖無廣告版：\n　　\n 　\n\n　\n　\n▇ 前言 ▇\n\n距離上一次看印度片應該是【帝國戰神：巴霍巴利王】( Baahubali:\
  \ The Beginning,\n2015)的時候吧，再更之前也是看一些動作片或是勵志片，如【三個傻瓜】( 3 Idiots,\n2009)，通常要嘛是動作超扯，不然就是時常有歌舞片段出現，而這次的【妮嘉】，看完\n\
  後對於印度的電影又有不一樣的認識了。\n\n***** 以下有劇情雷 ******\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n▇ 本片背景 ▇\n\n【妮嘉】是一部真人真事所改編的電影，描述一名年僅23歲的空姐妮嘉，搭上一班從孟買\n飛至紐約的班機，而在巴基斯坦轉機時，遇上恐怖組織劫機要往以色列交換被關的夥伴，\n\
  而憑著妮嘉的勇氣與智慧，在最後成功救出了359人，但自己為了救小孩卻不幸罹難，而\n成為印度歷史上的大英雄。\n\n▇ 觀後感 ▇\n\n有別於一般好萊塢的商業片公式，【妮嘉】在許多地方的設定上都令人眼睛為之一亮：\n\
  \n●關於女主角\n\n-經歷\n\n雖然劇情主軸是圍繞在劫機事件上，但導演花了不少篇幅描述女主角的個性以及過往，像\n是在空姐前曾是當紅的知名模特兒，之後奉命成婚卻因嫁妝問題，而時常被丈夫辱罵、虐\n\
  待及瞧不起；從這些片段可以感受到妮嘉在當時的無助以及徬徨感，也延伸到之後妮嘉對\n自己能力甚至是愛情的懷疑和沮喪；也許外表光鮮亮麗，但內心的懦弱和折磨只有女主角\n\
  明白。\n\n-感情\n\n而女主角後來瞞著父母逃婚，原以為會遭到父母的責難，但父母都選擇諒解並支持女兒，\n也讓妮嘉發誓要成為一個能讓父母親驕傲的女兒；妮嘉就如同我們一般人一樣，也是會有\n\
  脆弱、無助的時候，家人就是她背後最大的支柱，而導演將妮嘉與家人的良好互動，用不\n多的篇幅細膩交代給觀眾。\n\n-結局\n\n而最後的結局，在妮嘉不幸罹難後，導演用簡單卻深刻的方式，拍出家人的不捨與釋懷，\n\
  以及眾人的思念；尤其有一段是母親在妮嘉逝世一周年的追思會上，向當年因妮嘉而獲救\n的乘客們致詞完畢時，母親眼泛淚光回頭一看，妮嘉就在身邊，給了她一個深深的擁抱，\n\
  這幕實在是太催淚啦！\n\n▇ 吐槽 ▇\n\n我想這是我看過第一部飛機連起飛都沒有的劫機電影吧，不像一般常見的歹徒挾持機師威\n脅飛行，而是在歹徒一衝上飛機的時候，妮嘉就臨機應變的立刻通知駕駛艙中的人員，而\n\
  機師也很聰明的趕快開天窗先閃人啦！結果當然就變成....\n\n\n\n恐怖份子劫了一架沒辦法起飛的班機！\n\n\n所以手上的籌碼就只剩飛機上的乘客。\n\n\
  ▇ 真實感 ▇\n\n另外覺得電影中很真實的一點是，每個飾演恐怖份子的演員都像是來真的啊！不論是罵空\n姐、揍乘客，或是憤怒急躁的時候打空姐、殺乘客，完全沒有在客氣的啊！雖然角色是壞\n\
  人，但邊看的時候心裏邊想：\n\n「對嘛！這樣才叫恐怖份子啊！誰在跟你那邊好聲好氣的？！」\n\n但也不知道是因為女主角人太好、還是夠膽量、又或只是恐怖份子太驚慌，在好幾次的緊\n\
  張場面之下，妮嘉竟然都毫髮無傷，甚至恐怖份子還同意讓她幫乘客倒茶送食物\n挖靠你這樣也當恐怖份子啊！\n\n所以整部看下來還是覺得恐怖份子有點有勇無謀，再加上彼此之間的不合，以至於最後仍\n\
  是以失敗收尾。\n\n▇ 剪接手法 ▇\n\n另外導演在前半段將女主角和恐怖份子兩邊都準備從家裡出發要前往機場的過程，穿插的\n剪接在一起，這段滿有趣的，看兩邊一起起床盥洗、信心喊話、道別後出發等，這種手法\n\
  也讓恐怖份子看起來有一種使命感\n\n「妳為妳的工作盡心盡力，我也是豁出去要救我的兄弟們啊！」\n\n▇ 結論 ▇\n\n劇情沒有太多的峰迴路轉或是大場面，在飛機上的對峙也不像一般商業片的緊繃氣氛，但\n\
  導演將一個集智慧與勇氣於一身的女主角，刻劃的非常深刻，而且帶給觀眾不灑狗血的感\n動，以最真實的方式將妮嘉的英雄事蹟呈現在大銀幕上。\n\n▇ 打分數 ▇\n\n\
  如果滿分是 10/10 位空姐 的話\n\n那這部片我給…\n\n\n\n8.5/10 位空姐\n\n其他1.5 位空姐排休中\n\n▇ 觀影比例圖 ▇\n\n\
  \n\n▇ 女主角 v.s 妮嘉本人 ▇\n\n●女主角\n\n　\n（見網誌）\n\n●妮嘉本人\n\n\n（見網誌）\n\n▇ 更多真實故事 ▇\n\n\n\
  \n\n以上\n\n如果喜歡的話就到 M.T.M.I 的 臉書粉絲團 按個讚吧！\n\n謝謝大家！\n\n\n--\n\n○M.T.M.I-FFD 電影心得分享\n\
  \n部落格：\n\nFB粉絲團：\n\n--"
