title: '[閒聊] 國片"恐怖份子"李立群 顧寶明 金士傑1985'
content: "推薦一部老國片，恐怖份子，由李立群、顧寶明、金士傑主演，\n\n 作家小野的編劇，劇情好看,再加上三個硬底子演員，在同一部電影演出，現在很少見了\n\
  \n 現代商業社會，每個人都有各自的生活煩惱和壓力，婚姻的脆弱，職場競爭的暗黑，\n\n 日復一日，人生似乎沒有出口...\n\n\n 這部電影在1985年就拍完了，\n\
  \n 因為當時是戒嚴時代，上映前要先送新聞局審查，結果被新聞局以有害社會風氣打回票\n\n 只好更改部分劇情，重拍之後，才在1986年上映。\n\n\n 男主角李立群，年輕時很帥\n\
  \ \n\n\n [影片] 恐怖份子的預告片\n \n\n\n 恐怖份子，藍光DVD 數位修復版\n \n\n ★ 金馬獎 最佳影片　　　　\n ★ 盧卡諾影展\
  \ 銀豹獎\n ★ 亞太影展 最佳編劇\n\n\n 【故事簡介】\n\n  一對結婚七年的夫妻，因素昧生平的不良少女的惡作劇電話，讓長年累積的婚姻問題\n  ，一夕之間浮上檯面，暗潮洶湧的婚姻危機宛如一場噩夢般，讓觀影者分不清究竟是\n\
  \  虛擬還是真實...。\n\n  楊德昌導演冷眼捕捉都會人們在壓抑生活中，內心尋求解脫的渴求，探究真實和虛假\n  中的灰色地帶。\n\n--"
