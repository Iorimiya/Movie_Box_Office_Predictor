title: '[好雷] 虛實之間的「恐怖份子」'
content: '有劇情






  都市的大家，都是彼此的恐怖份子。人沒有純粹好壞，但都可能在別人的生活造成致命破

  壞。一直鋪墊虛實的陳述，累積到結局爆發！


  第一個上演的是李立群的腦內小劇場w拿槍去殺情敵、上司。像黑道電影男主角槍法如神

  。砰砰砰。再去西門町找認為亂播電話導致婚姻破裂的淑安報復。（唏噓的是連幻想都沒

  殺了老婆欸，他是真的愛她。但完全沒精神交流…）


  第二個是現實。他現實就個懦弱小職員，上述報復他還是做不到，於是他選擇，不，該說

  「只能」做到傷害到自己，趁著酒意往自己頭開了一槍…


  兩種之外。也還有「可能」。周韻芬的驚醒。到底剛剛的都真實發生嗎？或許這是她的夢

  ？或是她的小說內容？這帶著曖昧的開放式結局完美呼應了整部電影！


  是說，李立群最後去找顧寶明，卻說不出實話，說謊道：「我升職了」那幽幽的神情，是

  真恐怖…QQ




  --'
