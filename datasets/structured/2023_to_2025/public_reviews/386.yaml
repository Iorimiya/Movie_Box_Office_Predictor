title: '[普好雷] 復活劫 蠻驚喜的一部'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《復活劫》有雷觀後感：\n當思念翻湧成河\n\
  \n很浪漫的一部電影。\n\n整部電影慢節奏，籠罩在悲傷的情緒中，搭配明顯的歌曲清楚點題，最後幾幕將情緒張力\n瞬間催到最滿（配樂這時最強）。\n\n死去的家人歷劫歸來，另一邊孩子正在慶生。電影裡用非常多鏡頭進行生死對比，讓觀眾\n\
  同時感受活著的欣喜，還有對逝者無盡的不捨，成功創造思索空間。\n\n《復活劫》看似拋出了大開腦洞的問題：如果死去的親人回來了，你會如何反應？但其實\n背後的議題非常落地：你什麼時候真正接受摯親離開？\n\
  \n比起被殭屍吞噬，再次意識到親人已逝可能更加震撼，但這也是生者的窗口，讓我們站上\n十字路口，再次選擇如何面對失去的哀傷。\n\n推薦《復活劫》給有生死議題／經驗的觀眾，會對三個家庭的遭遇有很多共鳴與感動。\n\
  \n=\n\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n--"
