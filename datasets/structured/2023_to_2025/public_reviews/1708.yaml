title: '[  雷] 日本樂團Fishmans 紀錄片   觀後感'
content: '#呼朋癮伴 #朋の影癮


  “淺白”Fishmans Fishmans，2023

  大概再過十到二十年，這個樂團還是會有無比巨大的影響力吧，但看著佐藤在舞台上的身影

  ，感覺與那音樂的好、逐漸攀升的名氣成反比的，是那逐漸消散的寂寥。


  從一開始的五年、轉換廠牌後的作品、團員的相繼離開到佐藤的不告而別。大概每一小時切

  成一個篇章，將眾人心目中的佐藤伸治描繪出來，同時也透過他的字一窺他理想中的Fishma

  ns。


  尤其難得，能聽到那麼多曾經的團員談及他這個人，這些人於他最後玩團的時光並未攜手，

  讓他無奈地在最終巡演時說出：「讓我們看看十年後還有誰在這個樂團裡  我也不想這樣說

  ，但大家都離開了。」這樣的話。然而他們都深深尊敬著作為創作者的佐藤，因此也才都能

  在他最後的典禮上齊聚一堂吧，儘管晚了一些、但還是完成了男人們的告別。


  那些最真實的訪談、說出創作過程中的煎熬、佐藤在筆記本上寫出的自白、用力表演的樣子

  ，都緩慢沈入黃昏，搖曳在他在台上注視著的空氣。


  ゆらめき IN THE AIR

  ----

  Sent from  on my iPhone 12 Pro


  --'
