title: '[好雷] 五月的你，十二月的她'
content: '雷文防雷資訊頁


  五月的你，十二月的她

  May December

  2023美國電影




  二十年前，36歲的人妻葛蕾西（茱莉安摩爾 飾）因為與13歲的中學生喬（查爾斯梅爾頓

  飾）劈腿，而成為全國人民的八卦焦點，兩人幾經波折後，最終仍順利走向婚姻。如今，

  好萊塢明星伊莉莎白（娜塔莉波曼 飾）為了在大銀幕上飾演格蕾西，而前來拜訪這對夫

  婦，結果意外造成這個家庭內部的分裂……。





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  因為二位女主Natalie Portman和Julianne Moore的演出而追看的影片。導演Todd Haynes

  的作品特色及風格，了解的人？也許看完本片，又是佳作的累積？看完本片，收尾迷濛，

  懂或不懂，都無所謂了。女主Natalie Portman戲份最重，從頭到尾的演出，人設令人迷

  惑，但另一位女主更是撲朔迷離。


  個人滿意度80分（滿分100）。


  以下有劇透。




  1.令人不安的真實角色人物研究的意義何在？

  本片講述的是一名女演員正在研究一部電影中的角色，她將扮演一名36 歲的女人，她與

  一名12 歲的男孩有染，然後結束了嫁給他。

  本片被宣傳定位為一部黑色喜劇？從傳統意義上來說，這片並非喜劇，但我認為演員的世

  界，以及他們如何準備角色有一個特定的（極其黑暗的）笑話，是一種暗喻的諷刺笑話？

  Natalie Portman飾演的女演員Elizabeth角色表面上做了大量研究，因為她想真正了解Gr

  acie(Julianne Moore)性犯罪者，並表現出富有同情心的一面。 但在電影的結尾，女演

  員以及我們，電影的觀眾，並沒有比一開始，更接近真正理解Gracie。 那麼女演員到底

  在做什麼呢？所有這些「研究」？ 了解Gracie如何化妝對於她了解這個女人和她即將到

  來的表演真的很重要嗎？ 我想這部電影對電影業的人來說，可能比對娛樂電影觀眾，更

  有一些耐人尋味的意思。


  2. 本片之所以如此令人不安，是因為這一切的中心是那個男孩Joe Yu(Charles Melton)

  ，他現在已經是一個成年人了，但在許多方面仍然停留在十二歲。 關於此類主題的電影

  是否真的像他們聲稱的那樣試圖了解“真相”，還是在利用他人的痛苦？ 如果是後者，

  我們身為觀眾在參與這種剝削中，扮演什麼角色？ 在我看來，這似乎是導演在這部電影

  中探索的癥結所在？但並沒有得出結論。 它提出了這個問題並讓我們思考。


  3.三個主要角色Elizabeth, Gracie, Joe三人組演員，在這部電影中都表現出色。 Graci

  e的人設尤其令人著迷或費解。 如果這個女人沒有女演員努力解開的深度呢？ 如果她實

  際上只是一個蹩腳或惡質的人，該怎麼辦？ 女演員和她說故事另一面的願望，又將何去

  何從？ Gracie的角色中行走在刀刃上，我們永遠無法完全確定她是惡棍還是受害者？ 女

  演員獲得了屬於自己的奧斯卡時刻，她的獨白直接呈現在銀幕上。 她是一位真正致力於

  自己事業的女演員，還是只是一個利用別人的痛苦和困惑，來謀取私利的自戀者？ 所有

  演員在某種程度上都自戀嗎？ Joe有一些令人心碎的脆弱時刻，迷失的小男孩從男人的外

  表中探出頭來。


  一部有趣的電影，三人的人設及表現，是本片的看點。看完後有很多值得思考或回味的地

  方。


  #五月的你十二月的她

  r

  #美國電影2023

  #女演員和扮演角色真人

  #36歲女12歲男的相遇

  #女大男小配


  tman

  ore

  #Netflix影片在台灣MOD先上架


  --


  謝謝P大留言，你說的很對，哈哈哈，女主超抓馬的故意！女演員的演出收尾，有點不入

  戲，所以最後才安排導演喊OK,她卻要求再拍一次，認為自己已經抓到更多入戲精髓了。


  這片就是看二位女主的真真假假，虛實穿插，禮貌以待及暗中較勁之間啊。




  嗯嗯，這片靠二位主角的吸引力，先引人去看！看完則在編導演三方面，各有不同人味口

  不同的評價。



  的確有這樣的感覺啊。選角夠力！



  的確有一些如此的評論，正負評價都存在，只是好評的勢力比較大一些。



  是啊。個人的胃口不同。



  男主就是内在矛盾糾結，但沒有適合的出口宣洩，和女主演員二人剛好碰出火花了。



  很會形容！



  說的好，很有共鳴！點頭稱是，呵呵。'
