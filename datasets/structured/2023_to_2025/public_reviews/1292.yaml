url: https://www.ptt.cc/bbs/movie/M.1701849102.A.51E.html
title: '[好雷] 五月的你，十二月的她 May December'
content: '原本看維基以為〈五月的你，十二月的她〉會在 Netflix 上映，今天沒什麼行程安排想

  說可以來好好觀賞，結果 NF 找不到，才發現原來只有北美 NF 有上，查詢高雄僅剩喜滿

  客總圖有場次後就趕快出門了！


  ----------


  防雷


  ----------


  前一篇網友的心得分享超好，看完情緒很滿也想抒發一下觀影心得，套其中一句台詞形容

  ：

  The tension never breaks.


  整部片中不停被娜塔莉波曼和茱莉安摩爾的演技震懾，尤其喜歡兩人在鏡子前的兩場對

  手戲，塗口紅的片段張力十足、畢業餐聚的洗手間對話更是一絕。


  最喜歡娜塔莉波曼在儲藏室的想像演出和看完年輕 Gracie 寫給 Joe 的信件後的獨角戲

  ，明知道是在演戲，但她哭的情緒、講得哽咽、吞嚥口水、擤鼻子和抹去眼淚的時機點都

  恰如其分，實在精湛。


  茱莉安摩爾的部分則是很愛 Joe 出軌後和她攤牌時的反應，還有最後畢業典禮上給 Eliz

  abeth 的震撼彈，強烈的印象令人揮之不去。


  男配查爾斯梅爾頓也詮釋得很不錯，特別喜歡他放出蝴蝶時的小心翼翼和嚮往感。


  總之真心很推這部電影！場次好像都剩不多了，希望台灣 NF 之後也可以上架，一定會想

  再觀賞一次。


  ----------


  上週在電影板首 PO 就被酸業配，雖然知道網路上酸民本來就不嫌多，但還是附上票根好

  了




  --'
