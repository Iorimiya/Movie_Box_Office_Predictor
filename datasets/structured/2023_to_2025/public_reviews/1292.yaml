url: https://www.ptt.cc/bbs/movie/M.1701184497.A.2B0.html
title: '[好雷]五月的你，十二月的她：每秒鐘都屏氣凝神 '
content: "好讀Medium網誌版: \n\n一開始注意到這部電影，自然是因為兩位影后的海報相當吸睛。即使不知道劇情，也想看\n她們在大螢幕上的演技交鋒，而這部分確實沒讓我失望——不少國外網友甚至評論這是她\n\
  們的生涯最佳表演（是不是事實端看個人，但確實是相當內斂卻到位的演出）。\n\n原片名《May December》是一句英文俚語，指雙方年紀相差甚大的戀愛或婚姻，當然也開\n\
  門見山指出本片的核心人物：Gracie和老公Joe的關係。\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n電影開頭是在一處民宅小別墅，年輕人三三兩兩的笑鬧著、大人則準備烤肉，印象中畫面\n是有點柔焦的處理，照理說應該是很放鬆、甚至唯美的畫面，但卻帶給人滿滿的不協調感\n\
  。\n不協調感可能來自Gracie與丈夫、小孩都顯然太大的年齡差距，或是她對丈夫拿取第二瓶\n啤酒的叨唸（簡直是在管小孩，而我們很快就會發現她就是個超級控制狂），也可能來自\n\
  總在不經意之間繃緊、彷彿在暗示著有事要發生的背景音樂。\n\n而Gracie對演員Elizabeth的笑裡藏刀，自然是讓氣氛更加古怪。要怎麼拿捏採訪、取材\n\
  跟探人隱私之間的差異？儘管在表面上彼此客客氣氣，但餐桌上兒子明顯表達出對外來者\n的不歡迎，Gracie更是直接在她提問電影時間軸之外的事情時，毫不客氣地反問「為什麼\n\
  要問這個」？\n\n從很多小地方可以看出Gracie想要控制他人的慾望。除了開頭管老公喝啤酒，在陪女兒\nMary看畢業禮服時，她針對Mary喜歡的小禮服說：羨慕你有勇氣可以這樣露出手臂，你是\n\
  新時代的女性了。\n這段話乍聽是讚美，卻更像暗示女兒手臂不好看，但因為勇於做自己（手指引號）才敢這\n樣穿？果不其然Mary就進去換了另外一件遮住手臂的。\n\
  Mary並沒有表現出不滿，甚至如果問她本人，我想她一定會認為媽媽並沒有強迫她換、是\n她自己的意思，但這種暗潮洶湧的意識操控更為恐怖。\n\n但說到意識操控，最大的苦主自然是Joe。\n\
  我認為導演真的把這個角色寫得超好，從一開始的完美夫妻假象，到中間慢慢嶄露出外遇\n的渴望（跟昆蟲社團女生的文字聊天，一個人反覆看Elizabeth的廣告錄影等），在屋頂\n\
  上跟兒子的崩潰，最後真的肉體出軌、卻意識到沒有人真心懂自己，因而崩潰回去找\nGracie攤牌，最後還是被剝奪脆弱的權利，溝通無果，永遠被鎖在強迫情緒勞動的牢籠裡\n\
  。\nGracie談到前段婚姻為何選擇前夫時，輕描淡寫的說自己當時太年輕了，要的東西不同；\n但在Joe崩潰的說「我那時候可能太小了」時卻怒不可遏，彷彿認為這是他對感情的不忠\n\
  。\n\nJoe培養蝴蝶的渴望，彷彿是一種對弱者的關懷跟憐憫，又隱約暗示他仰慕從幼蟲到破繭\n而出這樣正常的變態、成長；36歲其實已經是一個成熟男性的歲數，但他連抽菸的動作都\n\
  生疏而怪異，彷彿13歲那年跨越禁忌柵欄，就已經是他最大也是最後的成長，此後便一直\n被壓制在Gracie想要他長成的模樣。\n\n這部電影提供的線頭很多，也一一帶著觀眾去抽絲剝繭，但導演始終把真相壓在一塊毛玻\n\
  璃下面，我們看不清楚、卻看得到，不至於覺得故弄玄虛，我覺得在故事到底要說到多白\n的拿捏，算是做得很不錯。\n我們一步一步發現Gracie的瘋狂，例如所謂忙碌的日常，其實只是一群看她可憐的熟客不\n\
  停回購她的烘焙甜點；而任一個客人不論是用多冠冕堂皇的理由停止購買，都是壓垮她的\n稻草，彷彿她那費力維持的日常又被抽走了一根樑柱（雖然她自己不會承認）。\n\n\
  她喜歡打獵，尤其對全家人來說最重要的畢業典禮當天（也就是跟Joe大吵後）她更是一\n聲不吭的跑去狩獵。這裡跟興趣是復育蝴蝶的Joe形成生/死、掠奪/保護的對比，且Joe有\n\
  辦法跟他人說明Gracie的打獵技術有多高超，但Joe的興趣在Gracie眼中卻只是「蟲子」\n，足見兩人對所謂愛的表達差距之大。\n\n而Elizabeth的存在本身，對Gracie來說可能就是一種罪孽。她的在場就是那場醜聞的提\n\
  醒，暗示了他們現在營造的虛假日常全都來自於「不正常」、「犯罪」的過去，而\nElizabeth的目的甚至是為了重現那段髒汙的過往，更別提Elizabeth對Joe若有似無的勾\n\
  引（在Gracie面前她都藏得蠻好，但很喜歡前半段Joe送她出去後二樓的燈正好亮起、是\nGracie在監視兩人這一幕）。\n\nElizabeth是穿針引線的人，也是慾望的化身，有對事業的慾望、性的慾望、對真相的慾\n\
  望（在寵物店儲藏室現場取材那場戲，雖然稍有預料到，但仍是蠻大膽的表演），在審視\nJoe的演員試鏡時，甚至說出這些男孩都不太性感這種評語，雖然可能只是想要拍出一部\n\
  夠吸引人的作品，或讓自己的演技更具說服力，但這種略有性化兒童之嫌的對白放在這裡\n，格外帶了點諷刺。\n\n她跟Gracie兩人面對鏡子化妝那段戲，有種莫名的情慾張力（即使她們對彼此都抱持著反\n\
  感），然而情慾張力的另一面是滿滿的威脅感，根本不知道下一秒她們會吻下去還是殺了\n對方，那種命懸一線（？）的氣氛真是刺激。\n\n後來有一顆長鏡頭是Elizabeth獨腳戲詮釋那張Gracie給Joe的信紙，這邊是我覺得娜塔莉\n\
  波曼演技最精采的地方，從講話語氣、嘴型、自然的哭泣都把Gracie重現得真好。想像如\n果她到時若真的把這段（哪怕是一點點）搬上大螢幕，會如何毀滅式的崩解兩人的關係?\n\
  \n至於電影最大疑點：前夫兒子Georgie暗示Gracie曾被自己的親兄弟輪暴，是真是假雖不\n可考（後來他要求音樂總監的位置，使這個資訊因買賣的意味而降低真實性），但我認為\n\
  Gracie說她跟兒子每天都有聯絡應該是騙人的，她極有可能只是料到Georgie會出此招，\n才先下手為強。畢竟Georgie如果真的想賣情報給Elizabeth，又怎可能會傻到秉告給\n\
  Gracie聽？\n\n這部電影的劇情乍看有點狗血，但腥羶味的畫面其實都只有口述，且許多細節點到為止、\n讓人有很多思考跟遐想空間，不愧是《Carol》導演Todd\
  \ Haynes的作品。這部雖是\nNetflix出品，但台灣似乎還沒被排進上片國家，希望之後有機會上串流讓更多人看看這\n部好片。\n\n--"
