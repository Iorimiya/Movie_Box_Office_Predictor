title: '[新聞] 窒友梅根宇宙色情機器人取消上映'
content: "新聞網址：\n\n \n《窒友梅根2.0》票房大縮水、害「情色風格」外傳《Soulm8te》取消上映！製片方另尋\n發行商接手\n \n黑色恐怖喜劇《窒友梅根》（M3GAN）三年前僅耗資\
  \ 1200 萬美元製作成本拍成，上映後\n全球熱賣超過 1.81 億美元，讓製作方布倫屋影業和發行方環球影業樂得立刻投入籌拍續\n集《窒友梅根2.0》（M3GAN\
  \ 2.0）和外傳《Soulm8te》。但遺憾的是，《窒友梅根2.0》\n上映後竟熱度大減，票房這次縮水到只剩 3910 萬美元，而這慘膽成績，如今也威脅到《\n\
  Soulm8te》的生存。\n \n外媒《Deadline》今日獨家報導，原定要在明年 01 月 09 日上映的《Soulm8te》現已臨\n陣撤檔，而且環球也不打算繼續負責本片的發行工作，因為《Soulm8te》已經準備尋找其\n\
  它發行商接手。《Soulm8te》的故事是敘述，一位男子為走出喪妻之痛而購買了一個人工\n智慧機器人，而他為了將其打造成真正具有感知能力的伴侶，卻意外釀禍催生出致命的靈\n\
  魂伴侶。據悉，該片的靈感是來九零年代盛行的情色驚悚電影。\n \n \n該死，我很期待地說，布倫屋高層罪大滔天\n \n--\n \n考量到現在版主的名聲，你多貼一點"
