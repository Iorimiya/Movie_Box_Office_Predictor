url: https://www.ptt.cc/bbs/movie/M.1674664135.A.1CF.html
title: '[雷] 《窒友梅根》 一部不錯的科幻片'
content: '剛去電影院看完窒友梅根，原本以為是恐怖片


  但是看完後認為是一部有恐怖要素的大團圓科幻片，甚至最後還讓我看出一點超級英雄片的

  味道


  就是機械有了自己的意識開始傷害人類，真是科幻的經典命題XD


  這部算是有內涵、能引人深思的電影，除了科幻的部分，裡面還有探討如何面對傷痛、育兒

  、甚至霸凌


  說到育兒的部分，導演把一個失敗的監護人刻劃的很成功


  我也有跟故事中小女孩差不多年紀的親人，這位小妹妹跟我家那隻混世魔王相比乖到爆好嗎


  主角連當這種乖小孩的監護人都可以這麼失敗也是不容易啊= =


  以至於梅根嗆主角是個機掰人的時候，我不管是外在表現還是內心都在瘋狂點頭


  不知道是不是因為主角讓人不爽，我看完電影還是覺得梅根人不錯欸，她害人比較像防衛過

  當造成的悲劇（那些人真的很機掰啊），完全沒有大魔王的感覺www



  --'
