title: '[新聞] 溫子仁繼安娜貝爾後再造鬼娃 窒友梅根首'
content: "新聞網址：\n\n\n\n《窒友梅根》由執導過影集《西方西遊記》的傑拉德強斯頓執導、《疾厄》編劇-阿奇拉\n庫柏執筆劇本，本片故事發想自溫子仁，他同時也擔任監製。主演卡司則囊括：《逃出絕\n\
  命鎮》艾莉森威廉絲、《安眠醫生》童星-薇樂麥格勞等人。北美預定 2023 年 01 月 13\n 日上映\n\n官方劇情簡介：梅根（M3GAN）是一個具備高度人工智慧、栩栩如生的玩具人偶，被設計\n\
  成小孩子最好的玩伴和令家長最安心的盟友。這款玩具人偶由一名玩具公司傑出的機器人\n專家潔瑪精心設計，梅根能夠藉由聆聽以及觀察學習人類行為，並且成為她照顧的小孩的\n\
  朋友、老師、玩伴和保護者。\n\n當潔瑪突然成為她失去雙親的八歲大姪女凱蒂的監護人之後，潔瑪並不確定也沒有準備好\n能夠成為一個好的家長，加上她的工作壓力非常巨大，於是就決定將她設計的人工智慧玩\n\
  具人偶梅根的圓型和凱蒂配對，試圖解決照顧凱蒂這個孤兒和紓解她工作壓力這兩個問題\n，但是她的這個決定卻造成無法想像的嚴重後果。\n\n你們恐怖片裡的人物總算審美正常了是ㄅ\n\
  \n\n\n雖然她有些角度讓我想到史嘉蕾喬韓森...\n\n--\n\n\n\n\n\n\n\n--"
