url: https://www.ptt.cc/bbs/movie/M.1671756289.A.074.html
title: '[新聞] 《窒友梅根》掀話題！魔性舞蹈超洗腦...'
content: '新聞標題：《窒友梅根》掀話題！魔性舞蹈超洗腦...最新預告曝光


  TVBS新聞網址：



  影片：當前最紅抖音舞蹈是這個! 竟是從9秒電影預告片變成全民風潮｜TVBS娛樂頭條


  ＊看沒有人貼過就附上影片了


  -



  導演溫子仁、布倫屋製作公司傑森布倫，

  共同打造全新恐怖片《窒友梅根》。


  《窒友梅根》於10月11日首支驚悚預告曝光後，引爆超高話題討論，粉絲和網紅們不約而

  同裝扮成梅根，還模仿起梅根跳的魔性舞蹈。


  TIKTOK舞蹈的影片「Stop using for megan doll」

  ＊音樂為 Lady Gaga - Just Dance 混音版

  （上面影片報導中的跳舞影片可以在這找到）



  幕後拍攝影片：



  電影《窒友梅根 M3GAN》迷因舞蹈！原來是這樣拍的！？真的太厲害啦！【BTS幕後花絮

  影片】



  -



  電影8日釋出最新預告，影片中明確解說梅根的操作模式和主要任務指令，梅根超級盡忠

  職守不眠不休，梅根會跳舞唱歌彈琴玩遊戲，梅根還會把握時間學習和吸收新知識，最重

  要的是梅根懂得陪伴和聆聽，但卻過度保護她的摯友，使得梅根開始殺人不眨眼，手段相

  當兇殘，


  反差極大，這一切只為挺摯友。




  《窒友梅根》故事敘述，一個具備高度人工智慧、栩栩如生的玩具人偶「

  」，被設計成小孩子最好的玩伴和令家長最安心的盟友。這款玩具人偶由一名玩具公司傑

  出的機器人專家潔瑪精心設計，梅根能夠藉由聆聽以及觀察學習人類行為，並且成為她照

  顧的小孩的朋友、老師、玩伴和保護者。




  故事提到，當潔瑪突然成為她失去雙親的八歲大姪女凱蒂的監護人之後，潔瑪並不確定也

  沒有準備好能夠成為一個好的家長，加上她的工作壓力非常巨大，於是就決定將她設計的

  人工智慧玩具人偶梅根的圓型和凱蒂配對，試圖解決照顧凱蒂這個孤兒和紓解她工作壓力

  這兩個問題，但是她的這個決定卻造成無法想像的嚴重後果。《窒友梅根》將於明年1月1

  3日上映。


  --'
