url: https://www.ptt.cc/bbs/movie/M.1676449742.A.559.html
title: '[好雷] 窒友梅根 老闆真的滿衰的'
content: '當天去看的時候整個大滿場 第一間電影院還說要分開坐 只好換一間 想說都被刪到一天才四五場而已了 快下檔的電影應該沒人看 結果第二間進去也幾乎滿滿滿==




  其實電影還不錯 歐美評價高可以理解 劇情上也幾乎沒什麼問題 如果還有場次或上串流是滿值得一看的電影




















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  整部劇情的邏輯都還滿正常的 心理治療師會擔心依賴過度 小孩子的情緒反應那些都很可以理解


  只是有些伏筆收的比較差 像是一開始助理在盜取資料的部分 聽到老闆(還是股東？)說要封鎖消息的時候 以為是他要外流 結果也沒有 照梅根的說法他資料只是偷好玩的==


  老闆是真的滿衰的 路過就被宰了 明明梅根邏輯上完全沒有宰他的必要 跑掉就好了XD


  要是最後即使被凱蒂砸了也仍然愛著凱蒂而表示不解的話我覺得可以收的更好一點


  結果她就直接飆人婊子了XDDD


  電影本身滿好看的啦 驚嚇畫面也不多 血腥畫面也有點刻意隱藏掉了 像是用強力水柱的那段也最後也只看到地上的水變色 抹助理脖子那個也很快就帶過了


  結果全劇最恐怖的是那隻狗==


  --








  --'
