url: https://www.ptt.cc/bbs/movie/M.1674992062.A.69D.html
title: '[好雷]窒友梅根'
content: '以下有雷


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  終於看到梅根本人了！一直以來都很愛殺人機器人主題的恐怖片，梅根在初期

  上電影預告片的時候就很吸眼球，加上那個迷幻舞蹈瘋傳各大社群，堪稱今年最迷人的恐

  怖角色吧


  故事的脈絡滿清晰的，從頭至尾都十分強調梅根對於一家人的重要性。凱蒂的雙親去世，

  潔瑪成為她的監護人，因未曾擔任為人父母，又同時有工作壓力下，潔瑪創造了AI機器人

  「梅根」，乍看之下是創造了世紀之作，但某方面來說是在逃避父母該給予的陪伴與教育

  ，透過梅根無時無刻的愛與呵護，凱蒂逐漸將心給了梅根，也在片中不斷強調「梅根不只

  是個玩具，而是這個家的一份子。」


  和過往的殺人娃娃比較下來，梅根的特殊之處在於，有了高超的科學技術奠基，她對小主

  人的控制更加容易，所有生理、心理上的變化都在她的認知範圍中，甚至衍生出了「自我

  」要素，在結尾露出本性，認為不該受人所控制，她是個完整的個體。


  只能說以投資的成本來看，這部片真的相當成功，在各方面的表現都十分出色，除了結尾

  的節奏稍微快速，有些劇情還沒交代完成之餘，其他都滿推薦進影廳觀看，除了有令人讚

  嘆的科學技術外，更多的是探討家庭與自我的教育與關係培養議題，很推推！！


  --'
