title: '[好雷] 窒友梅根、過年太閒跑去三刷'
content: "~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n唉，怎麼辦，看了三遍，這部有夠對我電波\n\
  \n我是不是跟凱蒂一樣離不開梅根了\n\n這部BD會不會出阿，我等不及了\n\n\n這一次主要是來看梅根眨眼睛\n\n每次梅根眨眼睛之後都有高機率開始裝傻，轉移話題的功夫有夠流暢\n\
  \n\n然後幫大媽沖澡那邊似乎有個轉折，\n大媽問他: 你到底是什麼 、 梅根說: 我最近也在想這個問題\n\n唉，他開始思考跟發展人格了阿，梅根的脾氣也不比凱蒂小，兩個也一樣夠偏激\n\
  果然是在一起生活的\n\n\n而最後可能因為凱蒂做出攻擊梅根的動作，才導致凱蒂自己喪失對梅根的主控權\n\n然後梅根剩半截爬到凱蒂前面的時候\n我本來以為他要揍凱蒂，結果好像也只是罵兩下，念一念而已，只是表情比較兇\n\
  \n梅根雖然又病又偏激，不過該放感情的時候又超投入，這個反差感實在太有特色\n而且他生氣的時候，臉雖然不會動，不過那個不爽的感覺真的有夠明顯\n\n如果凱蒂不喜歡的東西都得死，那梅根搞不好最後直接幫凱蒂征服世界\
  \ = =\n\n\n最後覺得凱蒂這位小妹妹的童年也太慘\n\n父母雙亡、被車撞、被狗咬、上學陷入凶殺案、最後還要把好朋友撕成兩半\n\n這個小妹妹以後是要他怎麼辦\
  \ = =\n\n\n自從看過勵陰宅之後\n\n這幾年的溫子仁恐怖片作品，我有空絕對都進電影院看，做個有看過的喜好排序\n\n第一: 安娜貝爾2  每分每秒都在恐怖緊張狀態，毫無喘息時間\n\
  \n第二: 勵陰宅2    完整又有層次的大型恐怖故事\n\n第三: 安娜貝爾3  稍微無聊\n\n第四: 勵陰宅3    有點無聊\n\n第五: 鬼修女  \
  \   看到睡著\n\n不知該算什麼片: 疾厄   前半懸疑、中間老梗、後半變捍衛任務\n\n聽說勵陰宅跟鬼修女都還要出續集，到時候應該還是會去看啦\n\n--\n\
  我個人偏好恐怖片或是人x機片(艾莉塔、Ex Machina)這種\n人機片電影有時太強調設定跟世界觀導致看得很累\n\n梅根這片就讓我看得很輕鬆，本質還是驚悚片，不過影片該帶到的矛盾也都有\n\
  他如果第二集變成洽吉那種我可能就會有點失望 = =\n o4o，真的假的，哈瞜哈摟哈摟哈摟\n\n那個看盜版的不低調一點還跑上來噓買票的，真的是有夠哈摟"
