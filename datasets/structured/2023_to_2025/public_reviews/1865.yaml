url: https://www.ptt.cc/bbs/movie/M.1673276002.A.03E.html
title: 《窒友梅根》10歲女童星沒說錯一句台詞！溫子仁
content: '記者 廖俐惠記者廖俐惠／綜合報導


  ▲《窒友梅根》在美國首周末以3020萬美元登上新片票房冠軍。（圖／UIP提供）

  《窒友梅根》上週在美國上映，立即吸引一票喜愛恐怖驚悚片的粉絲進戲院支持，首周末

  以3020萬美元登上新片票房冠軍。製片溫子仁特別發了一篇感謝文，說：「感謝所有支持

  和喜愛《窒友梅根》的朋友們，讓這小娃娃一夕爆紅。雖然現在原創或是新的IP電影都很

  難突破，但恐怖片粉絲們一次又一次的用行動來證明了為什麼他們是最棒的。如果不是導

  演傑拉德約翰史東執導這部極其恐怖、活靈活現和富有感情的電影，編劇愛珂拉庫珀帶來

  詭異驚悚和黑色幽默的劇本，超級才華洋溢的演員卡司和特效團隊為M3GAN梅根注入如此

  多變的個性，這一切都不可能發生。」

  溫子仁表示，要找到一位能完美詮釋潔瑪這角色的演員是一項艱鉅的任務，最後他們找到

  了愛莉森威廉絲，「我們需要一個能展現強烈事業心、能說服觀眾她是機器人工程師的演

  員」，溫子仁說道。

  「潔瑪雖然在玩具公司工作，但她其實是個科學家，同時她有她的弱點，為了成為一名等

  同父母的監護人必須跟自己的心魔天人交戰，我們很幸運能找來愛莉森威廉絲飾演這個角

  色。」


  ▲《窒友梅根》即將在台灣上映。（圖／UIP提供）

  愛莉森威廉絲同時也是這部片其中一名監製，她很喜歡片中審視人類與科技之間互動的概

  念。「當我們用科技或某種機械人取代人類時，這就是事情開始出錯的時刻，」愛莉森威

  廉絲表示。「這部電影更讓我們省思了人與人之間真正的關係所在。」

  凱蒂這個角色製作團隊找來薇樂麥格勞接下重任，導演傑拉德約翰史東表示，「要找到符

  合這部片要求的10歲小孩是一大挑戰，但薇樂讓事情變得簡單。她超級專業，從沒說錯一

  句台詞，是我見過唯一說哭就哭、說睡就睡的女演員。」片場沒人比愛莉森威廉絲更愛這

  位小演員。

  愛莉森威廉絲說到，「薇樂的幽默真的會讓我措手不及，她的笑話一堆、妙語如珠，從一

  開始就會開玩笑吐槽我，花了一段時間才適應，後來這已經成為我們之間的默契，玩得很

  開心。」薇樂麥格勞則開心說：「我超愛愛莉森，她真的就像是我的媽媽一樣，人超好，

  更是一位超讚的演員。」

  《窒友梅根》將在1月13日上映。


  --'
