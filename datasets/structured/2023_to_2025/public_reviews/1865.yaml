url: https://www.ptt.cc/bbs/movie/M.1750958426.A.57A.html
title: '[新聞] 窒友梅根2.0爛番茄開盤分數遠低於首集'
content: '《窒友梅根 2.0》爛番茄開盤分數遠低於首集，影評批導演「根本搞不清楚第一集受歡迎

  的原因」


  2025-06-26電影神搜




  環球影業的恐怖片續集《窒友梅根 2.0》目前正走上一條「嚇人」的道路——


  但不是它原本想嚇的方式。


  根據首波影評，這部即將上映的續作難以延續前作兩年前所締造的高口碑與票房熱潮。


  根據爛番茄網站的資料，《窒友梅根 2.0》開盤分數為 56% ，相比 2023 年上映、獲得

  93% 高分的前作來說，這分數顯得黯淡許多。


  有些評論更是毫不留情。


  愛爾蘭《Irish Times》評論人唐納克拉克就直言《窒友梅根 2.0》「 (absolutel

  y T3RRIBL3)」，並批評原班人馬包括導演傑拉德約翰斯通在內，「

  」。


  《Mashable》的克莉絲蒂普奇可則形容這部續集是「」，雖

  然偶爾有些荒謬突出的瞬間，整體仍「」。


  《Screen Rant》的瑪莉卡瑟爾則給予相對溫和的評價，稱續集比前作「更精緻成熟」，

  但也承認它「不再那麼容易融入第一集那種傻裡傻氣的幽默感」。




  《窒友梅根 2.0》（圖片來源／IMDB）


  《窒友梅根 2.0》延續了前作的故事，描述那位具備自我意識的 AI 娃娃梅根（全名：Mo

  del 3 Generative Android）如何對抗任何試圖與她的人類夥伴介入的人。然而，續集設

  定讓她被重建後，迎戰另一台由她技術衍生而來的軍事用人形機器人「AMELIA」，這名新

  角色意圖發動一場 AI 起義。


  前一集《窒友梅根》因其獨特的恐怖風格而大獲好評——


  梅根為了保護夥伴而不擇手段，甚至一路殺到底，最終被關機。


  然而，續集走向科幻與喜劇的混搭風格，試圖讓梅根成為一個更「可被原諒」的主角，並

  試圖阻止另一個邪惡機器人。


  這樣的風格轉變，使得原本喜愛第一集的觀眾與影評人出現明顯分歧，這也反映在爛番茄

  上的評價落差。




  《窒友梅根 2.0》怪獸版海報（圖片來源／布倫屋官網）


  除了之外，《窒友梅根 2.0》還面臨的壓力。


  根據目前的推估，該片首週北美票房可能只有 2,000 萬美元，遠低於前作首週開出 3,04

  0 萬美元佳績的表現。


  更別提第一集最終以 1,200 萬美元預算，斬獲高達 1.818 億美元的全球票房。


  本片主演包括艾咪唐納再度飾演梅根，以及珍娜戴維斯為角色配音。


  《M3GAN 2.0》將於 2025 年 6 月 27 日正式上映。



  新聞網址：





  --'
