url: https://www.ptt.cc/bbs/movie/M.1717790145.A.DD6.html
title: '[普好雷] 窒友梅根 - 教你怎麼顧小孩'
content: "大家好\n我是專看恐怖片的LittleDiDi\n我又來介紹恐怖片了\n\n今天帶大家用我的角度看這部蘿莉控片\n\nBlog圖文版會更精彩\n\
  \n\n\n年份：2022\n\n語言：英文\n\n類型：劇情、科幻、驚悚\n\n導演：Gerard Johnstone\n\n\n[劇情簡介]\n\n梅根（M3GAN）是一個具備高度人工智慧、栩栩如生的玩具人偶，被設計成小孩子最好的\n\
  玩伴和令家長最安心的盟友。這款玩具人偶由一名玩具公司傑出的機器人專家潔瑪（愛莉\n森威廉絲飾）精心設計，梅根能夠藉由聆聽以及觀察學習人類行為，並且成為她照顧的小\n\
  孩的朋友、老師、玩伴和保護者。\n\n當潔瑪突然成為她失去雙親的八歲大姪女凱蒂（恐怖影集《鬼入侵》薇樂麥格勞 飾）的\n監護人之後，潔瑪並不確定也沒有準備好能夠成為一個好的家長，加上她的工作壓力非常\n\
  巨大，於是就決定將她設計的人工智慧玩具人偶梅根的圓型和凱蒂配對，試圖解決照顧凱\n蒂這個孤兒和紓解她工作壓力這兩個問題，但是她的這個決定卻造成無法想像的嚴重後果\n\
  。\n\n(以上引用自開眼電影網)\n\n最近有人讓我推薦一點都不恐怖的恐怖片，最好還要有點搞笑，這種要求還真是有點難度\n啊，我思來想去，直覺想到的就這部《窒友梅根》了。說起來這部片不僅僅適合恐怖片幼\n\
  幼班，難得的在保留娛樂性之餘還能言之有物，頗有達到寓教於樂的性質。\n\n--\n\n雖然說這部片的調性應該是挺好猜的，但還是恕我表述一下這部片在演些什麼。女主角潔\n\
  瑪是一家玩具公司底下的開發工程師，他原本有個前衛獨到的產品構想，但卻與頂頭上司\n想走削價競爭的理念相違背，正愁著不知道怎麼辦，又傳來姐姐一家人遭遇嚴重車禍的噩\n\
  耗，唯一倖存的姪女只好託付了給她。\n\n--\n\n頂著老闆push schedule的壓力，工作狂的她也不懂得怎麼照顧小孩，焦頭爛額之際，想\n到要不把之前爛尾的「梅根」拿出來應急吧。「梅根」是一部陪伴型機器人，除了高仿人\n\
  類的面容外，還用上鈦合金打造，不怕猴死囡仔破壞，最強的是搭載了一顆強力計算核心\n的人工智能，具有高度的的學習能力。\n\n簡單說，就是一部具有思考能力的T800，聽到這裡應該就覺得有些可怕了吧，實際上除了\n\
  體型為了商業用途設計成兒童比例，不若阿諾機孔武有力之外，其實許多能力是有過之而\n無不及，這個我們後面再說。\n\n--\n\n由於梅根發揮其強大的功能性，讓姪女重新恢復活力，但隨之也帶來了副作用，那就是姪\n\
  女對梅根的依賴性遠超過潔瑪的預期。同時，潔瑪的身邊陸續發生命案，種種跡象顯示與\n梅根有關，讓潔瑪很難不懷疑梅根是不是遠把他想像的可怕，但同時，梅根的新品發表會\n\
  在即。\n\n--\n 劇情大概就是這個樣子，好像也沒什麼好說的，甚至我說梅根後面會牙起來大開殺戒應\n該都不算暴雷(不然你想期待什麼)，只不過如果單純把這部片當人工智能反撲的驚悚片看\n\
  待，那可能會覺得有些無聊，但如果能去理解這部片子背後想表達的內涵，會發現其實還\n是挺深入人心的。\n\n--\n\n首先，就是關於人工智慧的反思。從《魔鬼終結者》到《機械公敵》，好萊塢的製片們透\n\
  過想像力表現出人工智慧過於開放的嚴重與可怕，但說起來也只是展現人工智慧具有自我\n意識這件事情而已，而「梅根」的出現，更是將人工智慧提升到另一個高度，那就是人類\n\
  遙不可及的學習能力。\n\n起初梅根確實被賦予了照顧姪女的任務，但是當照顧這個指令沒有被嚴格定義，再加上人\n類有意無意地惡的展現而學壞，就有可能變成為了排除威脅而傷人，當然，作為工科出身\n\
  的我簡單認為，要規避這類事情就是要做好防呆機制，譬如說不能傷害人類，但電影中也\n說了，人工智慧因為具有超強的計算能力，並不是單單規避一些功能性防呆就能完全防止\n\
  人工智能的失控，照他的反應能力，肯定能鑽到人類想不到的漏洞，進而毀滅人類，這點\n是我剛說單從武力上體現的阿諾機看不到的事情，非常值得我們省思。\n\n--\n\
  \n再說另外一個論點，就是電影強烈地反映出孩童過度於依賴3C產品的危害。潔瑪由於工作\n壓力無法親力親為地照顧姪女，只好透過「梅根」來代替陪伴的任務，這樣的過程某種程\n\
  度也是在象徵不少父母可能因為工作忙還是怕麻煩，就給小孩整天玩手機看電視，因為整\n個人已經深陷，等到被剝奪就跟失去性命一樣焦慮，姪女在車上暴走的情形估計也是許多\n\
  父母真實情況的寫照。\n\n本片提出的依戀理論令人印象深刻，以往電影中出現心理學家還是心裡諮商師，可能是因\n為常給出沒營養的建議被當砲灰，唯獨這部片能全身而退，也算是溫子仁對該職業給足了\n\
  尊重吧。\n\n--\n\n過於嚴肅囉唆感覺都不像我了，那就來講這部片的娛樂面吧。\n\n由於電影為了陳述先前所說的理念，所以用了不少的篇幅在鋪陳這方面的事情，所以某種\n\
  程度來看是比較偏劇情片多一些，反而驚悚橋段的置入是少得可憐， 即便有死人但也不\n多，也沒有什麼太血腥的畫面，還是重申那句話，這部片子更多的是想透過「梅根」表達\n\
  人工智能的發展必須加以限制功能性，以及育兒陪伴的重要性，如果只是想當驚悚片來看\n，是一定會大失所望。\n\n--\n\n最後來講回「梅根」，我想當初這部片給大家的第一印象，應該是看到預告片上梅根魔性\n\
  的舞蹈，然後提起大刀準備大開殺戒，說到這不得不稱讚扮演者Amie Donald，把介於人\n與機器人之間肢體動作詮釋地相當精湛，造型也讓人印象深刻，本體的臉有幾分神似黑寡\n\
  婦，穿著也相當高貴時尚，現實如果片商跟日昇一樣，拍片只是順便賣玩具才是本體，相\n信銷量應該也會不錯才是。\n\n當然看梅根教訓小屁孩惡鄰居壞上司也是挺爽的，說到這個壞上司是脫口秀演員Ronny\n\
  Chieng，這部片絕大多數的笑點也是靠他。\n\n--\n\n最後來總結一下，《窒友梅根》是一部夾帶思考議題的劇情片為主，喜劇片、驚悚片為輔\n，如果想看這種為血漿而血漿的砍殺片，那我還是推薦你去看鬼娃恰吉吧，但重點是「梅\n\
  根」是蘿莉啊。\n\n血漿片看多了，偶爾看看這種有點內涵的清流，換換口味也是挺不錯的。\n\n即刻短評(滿分5)\n\n劇情： 3.5     >>骨子是人工智能反撲套路片，但有些內涵在裡頭\n\
  結局： 3       >>無所不用其極地留後路是吧\n血腥： 2       >>沒啥，就拉耳朵有點痛\n氣氛： 3.5     >>梅根太魔性了，壞上司很搞笑\n\
  推薦： 3.5     >>難得老少咸宜還具有教育意義\n\n\n\n\n--"
