title: '[新聞] 《窒友梅根》票房大賺14倍！導演曝梅根'
content: '新聞網址：



  《窒友梅根》票房大賺14倍！導演曝梅根獨特魅力：人們就是喜歡她


  記者蕭采薇／綜合報導


  《厲陰宅》

  導演傑拉德強斯頓（Gera

  rd Johnstone）歸功於「梅根」的獨特魅力，「她不像恐怖谷理論所說的會讓人厭惡。」




  《窒友梅根》在過度

  保護主人下引發一連串的恐怖結果。談到該片受到大多數觀眾喜愛，導演傑拉德強斯頓說

  ：「她（梅根）不像恐怖谷理論所說的會讓人厭惡，她反而很迷人又很有趣，人們就是喜

  歡她。這也是我拍攝這部電影的初衷，想讓她盡可能的有趣，包括她的行為、表情、舞蹈

  、聲音等，看到觀眾有同樣的感受真是太令人欣慰了！」




  AI娃娃「梅根」因電影在全球爆紅，不少影迷拿梅根與經典鬼娃「恰吉」作比較，有外媒

  詢問導演：「如果梅根和恰吉進行鬼娃大戰的話，誰會贏？」傑拉德強斯頓毫不猶豫地回

  答：「是梅根！」他笑著解釋：「我知道她會找到辦法的，也因為她是最新版本的娃娃，

  所以她會得到最多的升級，而且她真的很聰明。」




  至於兩大鬼娃是否有機會跨界合作，傑拉德強斯頓不排斥任何可能，「

  我認為把梅根放進任何電影，都會非

  常有趣。」




  雖然導演替「梅根」注入了有趣的元素，但大眼睛的外貌和深不可測的隱藏個性，仍令人

  不寒而慄，在片中與梅根有不少對手戲的演員愛莉森威廉絲（Allison Williams）就坦言

  ，她首次見到梅根娃娃本尊時，感覺到非常詭異，「我第一次看到娃娃時，是在做攝影機

  測試，我進到空曠的攝影棚，看到她歪著頭站在一旁，我當時心想『這會是我一生中最恐

  怖的經歷』。」




  除了《窒友梅根》劇情層層翻轉的 《人肉搜索2：失蹤搜救》搶先

  版、愛情喜劇《劫婚大作戰》、獲得坎城影展最佳影片金棕櫚獎的諷刺喜劇《瘋狂富作用

  》、柯林法洛榮登威尼斯影帝的黑色電影《伊尼舍林的女妖》、松隆子主演的療癒小品《

  舌尖上的禪》、福山雅治科學辦案的懸疑燒腦片《破案天才伽利略：沉默的遊行》、韓式

  喜劇片《大明星多重宇宙》、《巫師靈不靈！？》、入圍金馬獎4項的新加坡溫馨喜劇《

  花路阿朱媽》、人氣動畫《角落小夥伴電影版：藍色月夜的魔法之子》等，


  -----

  Sent from MeowPtt on my iPhone



