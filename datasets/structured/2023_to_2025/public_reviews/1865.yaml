title: '[新聞] 「愛愛機器人」失控！《窒友梅根》宇宙'
content: '「愛愛機器人」失控！《窒友梅根》宇宙推出「情色驚悚」新作定檔 2026 年上映




  《》（M3GAN）在全球票房大獲成功，票房超過1.81億美元，讓這部科幻恐怖片

  成為近年來的熱門話題。


  除了正在開發中的《》（M3GAN 2.0）續集外，（James Wan）與也正在積極拓展這個電影宇宙，推出一部名為《》（Soulm8te）的全新「情色

  驚悚」（erotic thriller）衍生作。


  根據報導，《》講述一名男子為了應對喪妻之痛，購買了一個具有人工智慧的愛

  侶機器人。


  然而，在嘗試創造一個真正具有感知能力的伴侶時，他無意中將一個無害的愛情機器人變

  成了一個致命的靈魂伴侶。


  這部影片被形容為具有 90 年代家庭驚悚片的傳統，但融入了現代技術元素。


  導演凱特 多蘭（Kate Dolan）將執導這部影片，已將上映日期定於 2026 年 1

  月 2 日。


  多蘭改編由編劇 拉斐爾 喬丹（Rafael Jordan）、、與英格麗德 畢蘇（Ingrid B

  isu）共同創作的初稿。


  除此之外，《》則將在 2025 年 1 月 17 日上映。


  新聞來源： Variety


  新聞網址：











  --'
