url: https://www.ptt.cc/bbs/movie/M.1673601552.A.AA7.html
title: '[好雷] 窒友梅根 M3GAN, 2023'
content: '雷文防雷資訊頁


  窒友梅根

  M3GAN

  2023美國電影




  劇情簡介：


  《安娜貝爾》導演溫子仁最新監製作品，《逃出絕命鎮》愛莉森威廉絲、《黑死性高潮》

  金柏莉克羅斯曼主演，一名在玩具公司上班的工程師，打造了一個具有自我意識的擬真機

  器人。


  梅根（M3GAN）是一個具備高度人工智慧、栩栩如生的玩具人偶，被設計成小孩子最好的

  玩伴和令家長最安心的盟友。這款玩具人偶由一名玩具公司傑出的機器人專家潔瑪（愛莉

  森威廉絲飾）精心設計，梅根能夠藉由聆聽以及觀察學習人類行為，並且成為她照顧的小

  孩的朋友、老師、玩伴和保護者。


  當潔瑪突然成為她失去雙親的八歲大姪女凱蒂（恐怖影集《鬼入侵》薇樂麥格勞 飾）的

  監護人之後，潔瑪並不確定也沒有準備好能夠成為一個好的家長，加上她的工作壓力非常

  巨大，於是就決定將她設計的人工智慧玩具人偶梅根的圓型和凱蒂配對，試圖解決照顧凱

  蒂這個孤兒和紓解她工作壓力這兩個問題，但是她的這個決定卻造成無法想像的嚴重後果

  。


  《窒友梅根》一片由傑森布倫和溫子仁製作，並由獲獎導演傑拉德強斯頓（《嚎宅禁地》

  ）執導，編劇則是愛珂拉庫珀（《疾厄》、《鬼修女2》），根據愛珂拉庫珀與溫子仁的

  原創故事改編。


  這部電影的演員陣容還包括錢信伊（《尚氣與十環傳奇》）、布萊恩喬丹艾瓦瑞斯（喜劇

  影集《威爾與格蕾絲》）、珍范埃普斯（Netflix影集《星際牛仔》）、洛莉丹吉（《魔

  戒首部曲：魔戒現身》加長版）以及史蒂芬嘉諾蒙頓（影集《Straight Forward》）。




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  去年十月看到好有趣的預告片，驚喜逗趣舞蹈畫面搭配了泰勒絲的歌曲It''s Nice to Hav

  e a Friend，




  令我期待度大增，電影今天一上映，就去電影院看了。


  但是就是因為有所期待，所以看完後，感覺只是符合期待，沒有超乎預期的驚喜。


  全片劇情平實可預期，有時甚至很有趣，片子開頭的那玩具就是二十多年前的玩偶Furby

  啊？本片就是恐怖Chucky恰吉玩偶的美女版融合AI終結者的故事啊？一部有趣的、不用看

  得太認真太嚴肅的電影。儘管如此，它還是通過有意和無意的喜劇，為恐怖/喜劇類型增

  添了自己的特色。就我而言，本片沒有任何令人驚訝或新奇的東西，本片大多數的戲劇元

  素，從一開始就是相當可預測到的：哪些角色可能會領便當？結局可能是主角全滅或存活

  ？這並不總是一件壞事，因為大多數人都喜歡可預測性，和知道電影的發展方向。總之，

  這部恐怖電影的娛樂性足夠，我看完後的滿意度70分（滿分100分）。


  這片的女子名字Megan和Cady的發音，令我聯想到英國皇室的王妃Meghan和Kate，還有Meg

  an的長相和女明星Elizabeth Olsen的相像，挺有意思的。


  以下有劇透及爆雷。




  1.預告片吸引我的，只有M3gan的奇特舞蹈和逗趣動作姿勢的場景，對 M3gan 幾乎就沒有

  任何其他更多期待了。我認為這部電影完成了它所要傳達的信息？例如：若父母在撫養孩

  子方面表現不佳，沒有父母形象可能會有不好的結果？因為孩子會依戀任何向他們表達愛

  意的東西，比如本片的Cady依戀M3gan.雖然後來Cady也運用了另一機器人Bruce對抗M3gan

  .


  2.混合 Chucky 和     Terminator 會得到什麼？就是本片的 M3gan: 一個高度智能的AI

  娃娃，她無論如何都會保護和其產生連結的用戶。M3gan並不是一個完全獨特的概念，但

  仍然非常有趣。


  3.本片的Cady父母車禍意外去世後，Cady（Violet McGraw飾）被她的阿姨Gemma（Alliso

  n Williams飾）監護，試圖幫助她的侄女應對她父母的去世，她發明了 M3GAN (Model 3

  Generative Android)，叫做Megan。Allison Williams 和 Violet McGraw 表現出色，他

  們的演出非常令我入戲。儘管這片最引人注目的顯然是由兩位不同的女演員 Amie Donald

  （童星的肢體動作） 和 Jenna Davis （聲音）扮演的 M3gan，但她們作為這個人工智能

  機器人的表現都非常出色。他們在如何移動，和說話方面都非常有說服力，無論是看起來

  還是聽起來都非常機器人化。本片中的一些橋段，真的很好，充滿了很棒的故事描述、台

  詞和演出，但一些橋段，令人開始感覺over到遺憾。M3gan 傷害的前幾個受害者，她殺死

  他們是有目的而為之，因為她認為他們是對她的用戶 Cady 的身心健康的合法威脅。但在

  後面橋段中，她開始殺人害人，充滿心機，這可以身圓其說，為了她自己求生存？但這與

  電影的前面保護Cady的劇設，格格不入。


  4.瘋狂的開場序，有意思地定下了本片基調。一個三口之家（丈夫、妻子、小女孩Cady）

  似乎正迎頭趕上一場大暴風雪。當觀眾試圖理解這一點時，妻子斥責丈夫向警察撒謊說汽

  車是四驅車——但事實並非如此！當暴風雪完全籠罩汽車時，妻子要求丈夫停在他所在的

  地方:在路中間！這樣他們就可以解決他們的爭論。如果你結婚了，也許這對你來說有點

  意義，但這是本片開場的一種方式。幾秒鐘後，一輛迎面而來的卡車撞上了他們——砰—

  —這個小女孩現在成了孤兒。這開頭很值得玩味。


  5.M3gan是人工智能的奇蹟，是一個栩栩如生的玩偶，被設計為孩子最好的伴侶和父母最

  好的盟友。M3gan 可以聽、看和學，它扮演著朋友和老師、玩伴和保護者的角色。當安排

  設定不夠周全之下，混亂接踵而至！本片再度呈現AI失控的類型電影，是一部關於人工智

  能潛在到實際危險的有趣電影。若一切控制良好，M3gan 是一個完美的朋友，是一個旨在

  玩耍、傾聽孩子，且耐煩指導小孩的機器人，同時也減輕了父母在教育方面的負擔：她不

  累，她不吃飯，她不睡覺。 她很完美，善於傾聽，不斷學習，隨時準備做任何事情，讓

  她的“主要用戶”開心，即使這意味著在不質疑她的選擇的情況下，做出了可怕的行為？

  而且逐漸取代父母的功能？“通往地獄的道路，是用善意鋪就的”這句話的印證，呼應了

  本片M3gan的劇情。這部電影的寓意很好，展示了另一種未來，技術的進步確實可以帶來

  這種“機器人玩具”，但不管M3gan失控與否，它產生可能的結果，可能與其原先的主要

  目的背道而馳。可能造成利己（使用人）不利人（對使用人不利）或父母失能（M3gan取

  代父母陪伴-傾聽及指導小孩）。


  6.這部片不知道是否將會有續集？若有，我腦補如下:

  a.會是那位被M3gan陷害殺死老板CEO的員工洩密給其他公司，而再度製造另一類M3gan？

  b.M3gan早已在女主Gemma家的智能系統中，backup自己的分身？

  c.Gemma捲土重來製造另一改良版M3gan？


  窒友梅根

  M3GAN

  美國電影


  --


  的確是黑色喜劇啊。新奇有趣的感覺，大於恐怖驚悚的感覺。



  呵呵。很會牽扯。

  哇




  以上的發展，都有看頭吔。我都有興趣看，哈哈哈。



  是啊。天網。



  呵呵，同時也很像漫威黑寡婦的Scarlett Johansson.



  同意樓上的見解，的確有看頭。



  是啊，本片是黑色喜劇，呵呵。那耳朵的劇設狀況black comedy。



  嗯嗯。希望有續集，將持續去捧場。



  謝謝樓上分享影片，好有趣。哈哈哈。'
