url: https://www.ptt.cc/bbs/movie/M.1673261044.A.F03.html
title: '[新聞] 《室友梅根》首週全球4500萬美金超越預'
content: '《窒友梅根》有續集規畫！首周票房就打破製作成本


  記者許瑞麟／綜合報導


  恐怖片《窒友梅根》以魔性舞蹈掀起話題，除了獲得好口碑，上映首周更在北美獲得3020

  萬美元票房，遠遠超出原先預期的1700萬至2000萬美元，目前全球票房達到4500萬美元，

  尤其製作成本僅有1200萬美元，可說是一大票房黑馬，監製溫子仁先前受訪時，也坦言有

  續集規畫。


  由於溫子仁先前創造出「安娜貝爾」如此經典的角色，此次又以「梅根」掀起熱潮，被觀

  眾戲稱專門製作鬼娃娃電影，他笑說：「在我以前的玩偶電影中，它們不會殺死任何人。

  安娜貝爾從不會站起來四處走動，每個人都說我是娃娃殺手，所以我決定，要為新世代拍

  一部這類型的電影，現在的孩子不像我們有恰吉陪著一起長大。」


  溫子仁希望梅根在不同的層面上發揮作用，「同時具有可怕、令人毛骨悚然，但也有感人

  和情緒化的特點，我們希望更傾向於技術導向的東西，而不是超自然的事物。」他透露有

  在討論續集，「在我的任何一部電影中，無論是《厲陰宅》、《奪魂鋸》、《疾厄》或是

  《窒友梅根》，我們都喜歡想像一個更大的世界。對我來說，這是關於創造世界，理解角

  色、發展故事可能的走向，建立並進入那更大的世界，並繼續下去。」最後他說道：「因

  此如果我們有幸拍到續集，必須對故事有充分的想法。」


  網址：《窒友梅根》有續集規畫！首周票房就打破製作成本

  -032430125.html


  心得：突然很想看了，每個人都需要一個梅根吧



  --

  抱歉改好了

  01/09 19:35'
