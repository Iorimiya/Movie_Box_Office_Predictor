url: https://www.ptt.cc/bbs/movie/M.1697184748.A.5D4.html
title: '[討論] iTunes特價報 窒友梅根/告白/逃出絕命鎮'
content: '【2023/10/13 iTunes特價報】

  告白／朵拉與失落的黃金城／窒友梅根／逃出絕命鎮／恐怖大媽／鬼玩人：4K數位修復版

  ／隔壁的男孩殺過來

  －

  本次的特價報主打的是恐怖驚悚類型，這也是iTunes每年萬聖節前夕會推的檔期。首先要

  推薦給大家的是湊佳苗小說的經典改編電影《告白》，由松隆子飾演痛失愛女的女教師，

  冷冽的氣氛和情節對照本應朝氣十足的國中校園，在當時引發不小的討論，可說是日系驚

  悚片代表作之一。不過要提醒一下大家，這部片是重新上架的版本，所以購買前建議可以

  先看看自己的片庫裡有沒有之前的，以免重複購買。

  －

  緊接著要推薦大家的是首次特價的新番恐怖片《窒友梅根》，這部結合現代科技與恐怖題

  材電影是去年年底的話題之作，整部片幾乎沒有浪費這個新穎的題材。戲裡各種吸睛的演

  出搭配黑色幽默，戲外甚至還成為迷因，讓梅根成為繼洽吉和安娜貝爾之後的新世代恐怖

  偶像，是非常值得收藏的一部。

  －

  最後是超多部特價到$90的恐怖片，其中以環球的片單為主，有讓人回味無窮的《隱形

  人(2020)》以及喬登皮爾的成名作《逃出絕命鎮》都是久違特價的老面孔。還有《無限殺

  戮日》等多部經典系列的續作，而且4K非常多，是可以補齊恐怖片單的好機會。

  －

  以上，祝大家看片愉快！

