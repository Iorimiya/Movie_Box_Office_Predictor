title: '[新聞] "窒友梅根"全球票房超1.24億美金 大賺10倍'
content: '新聞網址：


  原標題:



  Yahoo奇摩電影戲劇編輯部

  2023年01月27日



  【文／太空小姐】溫子仁監製、傑拉德約翰斯通（Gerard Johnston）執導的驚悚片《窒

  友梅根》（M3GAN）在全球創下票房佳績，並且持續在國際票房上佔領主導地位。該片在

  國際票房上突破5130萬美金，

  電影在全球超過30個國際市場

  上映，上周末則在巴西與阿根廷與觀眾見面，延續先前《微笑》、《隱形人》、《闇黑電

  話》、《月光光新慌慌：萬聖結》等口碑好片所創下的恐怖氛圍。



  在巴西，《窒友梅根》首周末就達到140萬美金票房收入，成為疫情大流行期間首映日票

  房第三高的恐怖電影，僅次於《厲陰宅3：是惡魔逼我的》以及《孤兒怨2：最黑暗的過去

  》。《窒友梅根》甚至在週六入場人數上還超越了《阿凡達：水之道》！



  《窒友梅根》在巴西威力猛烈，首映三日的表現幾乎是在假期上映的《闇黑電話》的兩倍

  ，而假期通常是民眾湧入戲院的關鍵時間；至於在阿根廷，《窒友梅根》的票房收入也位

  居第三，上周末達到40萬美金，同樣高於《闇黑電話》與《微笑》兩倍之多。



  同時在英國與愛爾蘭上映邁入第二個周末，《窒友梅根》不僅票房攀升到第二名，達到

  570萬美金，還超車新上映的《巴比倫》；在德國與澳洲，《窒友梅根》則在第二個周末

  分別達到280萬美金與290萬美金票房成績。



  另外在西班牙的290萬美金、義大利的220萬美金、荷蘭100萬美金、法國350萬美金票房，

  都已是到了第三個周末的票房收入表現，可說是相當強勁。



  在後疫情時代，恐怖片主導了國際上大多數的票房好成績，且短期內沒有放緩的現象。《

  窒友梅根》當中的殺手機器人梅根，儘管片中設定是AI人工智慧，但由於她怪異的舞蹈動

  作、時尚感、可怕的忠誠度而使她成為新一代的「網路紅人」。



  如此精湛的票房表現也為電影續集開了綠燈，




  --'
