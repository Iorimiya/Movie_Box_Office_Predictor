  未演先轟動的原創恐怖喜劇《窒友梅根》（M3GAN）問世前即靠著爆紅的「梅根熱舞片段

  」炒足話題，而


  。眼看成績如此亮眼，發行方環球影業、製作方布倫屋影業今天也趁勢宣佈

  啟動續集的製作。



  其實早在《窒友梅根》上映前，環球和布倫屋就已經在商討續拍《窒友梅根 2》的可能性

  ，身為監製的溫子仁和傑森布倫（Jason Blum，上圖）等主創們也都對開拍續集抱持十分

  樂觀的態度，而直到今天則是總算拍板定案，並揭露




  此外，首集的兩位主角 —「潔瑪」艾莉森威廉斯（Allison Williams）、小童星「凱蒂

  」薇奧拉麥格勞（Violet McGraw）均確認回歸演出，阿奇拉庫柏（Akela Cooper）亦確

  認回歸執筆劇本，但導演傑拉德強斯頓（Gerard Johnstone）是否會跟著歸隊，目前則未

  知。



  --'
