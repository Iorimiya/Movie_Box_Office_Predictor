url: https://www.ptt.cc/bbs/movie/M.1675307589.A.7E0.html
title: '[普雷] 窒友梅根'
content: '上映一陣子了，板上也不少心得文。以下直接有雷的心得分享。





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  覺得這部和粗製濫造的B級惡搞片很像，


  低成本製作、配角演技尷尬、劇情吐槽點多、劇情充滿既視感，


  但能讓它和其他惡搞片有明顯區別的地方在於靈魂人物梅根，


  她從外型設計、動作敏捷度、到角色個性一點都不馬虎，


  讓這部電影瞬間升級成大眾商業片。

  -


  不同於安娜貝爾那邪氣滿滿的臉（誰會喜歡這種醜玩偶），


  梅根長得可愛討喜，且處處為小女孩凱蒂著想。


  我說這種優質玩具一上市，應該會被一堆變態採購一空吧XD


  很喜歡梅根聽到凱蒂父母意外身亡後那一段，


  當中她說了一句「我會死嗎？」從這之後，電影就常常帶到梅根靜靜坐著，


  彷彿她正在思考這個問題，以及這個問題所延伸的更多問題。


  也是這個問題，讓她從為陪伴小女孩而生，變成一個有情緒、能自主思考的個體。

  -


  中後段讓她暴走的理由合情合理，但稍嫌爽度不夠。


  而且我不喜歡梅根最後也把凱蒂看作她的敵人，


  有點把她變成單純殺人機器的感覺。


  最後的伏筆暗示梅根早就幫自己備份了，如果是這樣的話，


  這個梅根沒有跟凱蒂結仇的記憶，續集也有很大的發展性。

  -


  不得不說布倫屋真有一套，新瓶裝舊酒能玩出新花樣，


  【窒友梅根】這題材一不小心就會淪為好萊塢電影台的電影，


  但最後的成品迴響熱烈，甚至在上映前就準備發展成系列作，真的厲害。

  -


  希望續集可以玩得更大，來個梅根大軍之類的（？


  然後最後派出變態大軍解決她們（嗯？



  --

  你就是我內文說的變態XD

  確實，他們不但很會控制成本，在選劇本跟導演上也很有眼光。'
