title: '[微雷] 窒友梅根2.0 (M3gan 2.0)霹靂遊俠小彩蛋'
content: '雷文防雷資訊頁




















  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  ~~~~~~~~~~~~~~~~~~~ 微雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  我猜這導演，大概也是看這80年代熱門影集長大的。


  當AI梅根，要駭進豪車，準備載Gemma和Cole回家，對抗另一個雙生機器人Amelia時，

  那音效真的實在太耳熟了。




  題外話，我去看YT各大影評時，才發現第一集的預告片中，梅根配合北景音樂

  ，跳著可愛的舞，但最後抄起家伙，追著Ronny Chieng




  可惜正式影片，就沒有這樣表現。


  然後這首歌也沒有正式舞蹈MV，有些可惜。


  --'
