content: '電影宣傳成本這麼高

  奧斯卡獎是不是真的照之前傳出的

  改成像tga那種形式比較好？

  tga就是電玩界的奧斯卡

  但是遊戲界沒有什麼明星

  沒有人會出來脫口秀表演

  所以頒獎的間隔就是一堆宣傳預告輪播轟炸

  十個預告裡面大概有一個是真正的大作

  現場的媒體跟線上觀眾其實也樂得看新作品

  奧斯卡也改這樣是不是增加新電影的曝光率

  電影業賺錢自然有更多的好電影參展

  有好電影，奧斯卡收視率也會提高

  雙贏何樂不為？

  再怎樣也比被調侃到不爽上台打巴掌強吧

  電影獎不幫自己的行業

  反而讓自己人被超級盃財團爽賺你廣告費

  是不是莫名其妙？


