title: '[好雷]微雷 窒友梅根'
content: '以下微雷

  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  從這部電影剛釋出預告我就超級期待，一方面是因為這部片是溫子仁出品，另一方面我真

  的超想知道這個機器妹妹到底有多猛！

  結果他真的超讚，梅根不只是會殺人，他還有一副好歌喉跟好舞藝（？


  我覺得窒友梅根是部好看的驚悚片，該有的驚悚情節及音效都做的相當到位，也有一些致

  敬其他恐怖電影的橋段，讓人回憶殺滿滿。

  另外雖然他是驚悚電影，卻也不僅僅是一部驚悚電影，他也集結了搞笑與溫馨氛圍，還有

  科技發展讓人類去反思的內容。真的是部非常值得觀賞的電影！


  講完了優點之後當然還是要提到一些可以改進的部分。

  首先就是預告片的篇幅，預告片把蠻多精彩片段都截取出來了，會讓看過的人對於劇情的

  發展比較容易預測。

  加上結尾情節進展的比較突然，劇情推進的節奏可能要再拿捏一下，不然會顯得有點頭重

  腳輕。


  結論

  這部電影在各個部分都相當到位，推薦大家可以看一下，也可以去模仿跳那個舞


  --'
