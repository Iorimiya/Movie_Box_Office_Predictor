url: https://www.ptt.cc/bbs/movie/M.1751291276.A.56E.html
title: '[情懷好雷] 窒友梅根2 向40年科幻及動作老粉遞交的情書'
content: '雷文防雷資訊頁


  或許或許有一點爆雷???

  那還是防一點點點吧




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  滿滿的致敬懷舊  但不是懷舊第一集 因為我自己也沒看過第一集XDD


  這部片主軸我認為是用還算順滑的劇情，

  和所有度過40年來看了一大堆科幻&動作電影的老粉遞上情書


  我是衝著看月初看預告發現(猜測)窒友梅根一二集的關聯有一點像魔鬼終結者一二集，

  身為魔鬼終結者腦粉才衝去看，電影院人真少QQ 大家下檔前多多支持吧


  看完結果大驚喜，這編劇和導演肯定是嗑了什麼，

  如果你是魔鬼終結者系列，葉問，武狀元蘇乞兒，小鬼當家，霹靂遊俠（霹靂車），

  迪士尼動畫，機器戰警，不可能的任務，阿達一族(感謝版友補遺!!)，

  鬼娃恰吉的沾到邊小粉，必看啦啦啦！

  導演的分鏡會讓你腦海裡響起喔喔喔喔就是這個對不對的情緒，三不五時笑一下


  可惜同場附近坐的小朋友常常沒反應到， so sad 門檻有點高QQ 評價應該會兩極


  不會恐怖，也偏向幽默，血腥度極小







  --

  I know we could both go on with our lives, and we''d both be fine.

  But I''ve seen...what we could be like together.

  And I choose us.


  You can always go to Paris.

  Just... please,not tonight.


  --

  哎呀呀應該沒接收到 是甚麼呀?

  全片梗太多 網友趕快幫補補


  我覺得不是  電影裡說1984 我猜是致敬魔鬼終結者第一集 也留了腦晶片'
