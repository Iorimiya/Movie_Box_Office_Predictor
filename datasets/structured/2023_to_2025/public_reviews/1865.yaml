url: https://www.ptt.cc/bbs/movie/M.1704799005.A.3F1.html
title: '[新聞] 安娜貝爾 窒友梅根一家親！溫子仁公司'
content: '安娜貝爾、窒友梅根一家親！溫子仁公司與布倫屋恐怖片兩強合併


  Yahoo奇摩電影戲劇編輯部


  2024年1月9日 週二 下午12:56




  《窒友梅根》《安娜貝爾回家囉》劇照


  1.好萊塢最會拍恐怖片的布倫屋與原子怪獸兩公司在新的一年正式合併！


  2.兩公司曾有《陰兒房》、《窒友梅根》合作成功前例


  3.影迷敲碗安娜貝爾對決窒友梅根有望成真？！


  【文／搖滾貝琪】


  好萊塢兩大恐怖片推手——


  傑森布倫（Jason Blum）與，最近正式達成協議，布倫的Blumhouse（布倫屋製片

  公司）公司與溫子仁的Atomic Monster（原子怪獸影業）公司已經完成了合併交易，布倫

  透過X（前Twitter）分享了包括《厲陰宅》、《窒友梅根》與《逃出絕命鎮》等片段的影

  片宣布：「恐怖片的卓越製作公司，現在都在同一屋簷下。」


  也就是分屬兩公司的「安娜貝爾」與「窒友梅根」招牌角色成了一家親！


  布倫屋早期以低預算恐怖片打響名號，知名作品包括《》、曾入圍奧斯卡

  最佳影片的《逃出絕命鎮》等片，去年推出的《窒友梅根》與《》

  都在票房小兵立大功；溫子仁的原子怪獸影業，則以《》系列、《》系列著

  稱。




  《安娜貝爾回家囉》劇照


  兩家公司2010年首度合作《陰兒房》系列測試默契，之後再接再厲打造出賣座電影《窒友

  梅根》，最新合作的《》也上映在即。


  根據協議，布倫屋與原子怪獸將以獨立的廠牌名稱繼續合作、保持獨立創作性，由持有主

  要股份的傑森布倫、溫子仁與美國有線電視（NBCUniversal）的母公司Comcast三方共同

  擁有所有權。




  《窒友梅根》劇照


  溫子仁與傑森布倫表示，兩公司合併後將促進雙方更深入的合作，也可能象徵產量的增加

  。


  布倫曾向《好萊塢報導》表示：「我們一年通常不會推出超過三或四部電影，我希望和溫

  子仁合作能夠把發片量增加到六到八部。」


  先前影迷曾許願看到安娜貝爾與窒友梅根對決，現在既然成了「family」，似乎並非不可

  能。


  隨著續集片與超級英雄電影片去年紛紛失去昔日賣座光環，仍是少數可靠的吸票保

  證片型，除了布倫屋與原子怪獸強強相加的成效值得期待，最近好萊塢也積極招攬恐怖片

  的人才，包括《》的編劇Gary Dauberman與索尼影業簽署優先合作契約，派拉蒙影業與

  《》導演帕克菲恩也簽優先合作契約。


  新聞網址：




  想看安娜貝爾與窒友梅根對決～




  --'
