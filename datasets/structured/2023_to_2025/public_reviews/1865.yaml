title: '[新聞] 《室友梅根》首支預告'
content: '新聞網址：



  《窒友梅根》由執導過影集《西方西遊記》的傑拉德強斯頓執導、《疾厄》編劇-阿奇拉庫柏執筆劇本，本片故事發想自溫子仁，他同時也擔任監製。主演卡司則囊括：《逃出絕命鎮》艾莉森威廉絲、《安眠醫生》童星-薇樂麥格勞等人。北美預定
  2023 年 01 月 13 日上映


  官方劇情簡介：梅根（M3GAN）是一個具備高度人工智慧、栩栩如生的玩具人偶，被設計成小孩子最好的玩伴和令家長最安心的盟友。這款玩具人偶由一名玩具公司傑出的機器人專家潔瑪精心設計，梅根能夠藉由聆聽以及觀察學習人類行為，並且成為她照顧的小孩的朋友、老師、玩伴和保護者。


  當潔瑪突然成為她失去雙親的八歲大姪女凱蒂的監護人之後，潔瑪並不確定也沒有準備好能夠成為一個好的家長，加上她的工作壓力非常巨大，於是就決定將她設計的人工智慧玩具人偶梅根的圓型和凱蒂配對，試圖解決照顧凱蒂這個孤兒和紓解她工作壓力這兩個問題，但是她的這個決定卻造成無法想像的嚴重後果。


  ---------

  這個機器人我可以


  沒什麼恐怖谷的不適感



  -----

  Sent from JPTT on my Alldocube T803.


  --

  嘿嘿…但我....

