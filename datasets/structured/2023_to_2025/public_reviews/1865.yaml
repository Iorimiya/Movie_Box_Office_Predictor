url: https://www.ptt.cc/bbs/movie/M.1751428170.A.AD9.html
title: 'Re: [超好雷] 窒友梅根2意外地好看'
content: '我也覺得意外的超好看爆米花片 節奏非常棒 大推


  看過第一集 恐怖驚悚片 結局都收官了 以為有啥好狗尾續貂?



  看完這部續集 原來是我們這個時代的終結者二啊 恐怖片大轉型


  台詞有趣 劇情諸多反轉 動作戲流暢有特色 文戲也出乎意料的好


  同樣討論AI 比那啥不可能任務強太多了 MI我只記得大反派一直呵呵哈哈哈嘲笑臉


  (終結者時代 我們以為AI只懂計算不懂感情 表達刻意僵硬冰冷 以T800鐵漢柔情為代表


  現在我們見識過GPT 知道LLM最會嘴 所以梅根臭嘴機器人設毫無違和又好笑)




  因為劇情伏筆多反轉多 就不細細展開


  這麼說吧 有個潛行任務 解鎖要 heat signature (單指紋不行 要有體溫)


  由於看過第一集恐怖驚悚片 觀眾很自然想到___來開鎖


  結果兩隻同源的AI機器人給出了完全不一樣的解鎖方式


  符合人設 也替劇情反轉合理化


  最重要的 女主科學家 一直沒有真正被梅根多次嘴遁說服


  直到兩隻同源的機器人卻走向完全不同的路 呼應了本片後天(父母)教育的主題


  也讓女主看到了未來不同的可能 真正相信梅根的不同



  簡言之 當爆米花片看很開心


  各種傳統上的相信我之術和嘴遁不但不落俗套還頗有巧思新意


  如果看過第一集 更容易懂各種經典橋段笑點(唱歌等) 還有為何主角群遲遲不相信梅根


  --'
