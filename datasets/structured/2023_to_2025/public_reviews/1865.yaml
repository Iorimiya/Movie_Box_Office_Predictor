title: '[ 好雷] 窒友梅根-有點恐怖'
content: '以下會討論到劇情

  不想被爆雷的 就不要看唷









  --------------------------


  看預告片以來，就一直就很想看這部片

  看完之後

  覺得是一部成功的驚悚片

  恐怖氣氛營造的很不錯

  也有血腥的部分



  前幾年我看過最新版的恰吉

  跟這部比起來

  還是ai恰吉比較恐怖 哈哈




  扯遠了

  回到電影本身


  我看電影的當下

  覺得電影有簡單帶出一個議題

  就是3C育兒



  另外

  梅根好聰明

  我覺得她學得好快

  如果我現在是小孩

  有這樣的玩具

  我會很高興XD




  最後的結局打鬥

  有點出乎我意料之外


  竟然是布魯斯！！！

  為什麼主角小女孩那麼會操作布魯斯

  又那麼勇敢

  沒被嚇壞

  真的是太強了




  機器人布魯斯我想起另外一部電影

  湯姆漢克斯演的

  芬奇

  未來機器人真的會那麼發達嗎？

  感覺機器人很可靠啊


  因為看過AI恰吉

  所以覺得這部真的是相對溫馨很多




  題外話

  泰勒絲it''s nice to have a friend

  跟Bella的dolls好好聽

  意外的收穫


  --

  你們好厲害！

  前面機器人出現的時候，我以為只是想表達女主是個很厲害，事業心很重，很專業的女生

  沒有聯想到後面


  所以最後打鬥的場面

  小女孩說 我們家還有一個成員

  跳出布魯斯，我真的嚇一跳 很驚喜'
