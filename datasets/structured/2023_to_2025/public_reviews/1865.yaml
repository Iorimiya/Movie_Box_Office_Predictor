url: https://www.ptt.cc/bbs/movie/M.1675407102.A.45F.html
title: 'Re: [劇透雷]窒友梅根劇情上最大的BUG........ '
content: '古老的電影《機械戰警》


  直接把產品之中植入對公司高層不得傷害


  中間路過看免費舞蹈的公司高層


  應該就不會被裁紙刀掛掉


  若以現代電影比較愛用的機器人三定律(不過出現點也滿早，在1942)


  大概連前期的小男孩都不能碰




  不過梅根本來就有自主學習的能力


  一陣子的作品很喜歡寫AI自主學習後


  發現人類就是個地球毒瘤


  或者是放任人類自己發展總有一天會毀滅自己


  所以必須要機器人介入保護


  才能避免這個最結局


  因此，中間一切的殺戮與人身自由限制


  都是為了最終目的


  這樣他的程序就不會出現BUG





  但我覺得這部電影比較令人開心的地方


  在於特效化妝


  在CGI橫行的現代電影世界之中


  諸如浩克、格魯特、火箭


  還有依靠特效化妝的跳舞的橋段


  我看的還是覺得舒服的


  --'
