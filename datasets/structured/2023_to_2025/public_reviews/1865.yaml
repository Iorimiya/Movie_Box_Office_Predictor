url: https://www.ptt.cc/bbs/movie/M.1681471385.A.CB0.html
title: 'Re: [新聞] 仍得靠廣告！《媽的》《窒友梅根》宣傳'
content: "這篇蠻有趣的 我還跑去看Deadline的原文:\n\n\n\n目前一般預估收益線，是票房必須要是的3倍，\n\n票房低於這個數字大抵為賠，票房高於這個數字才能賺。\n\
  \n這篇報導的意思是，如果是小成本電影，\n\n那的比重將會大大提高，甚至高於製作成本數倍。\n\n\n\n所以小製作電影的票房表現必須遠遠高過製作成本才能獲利。\n\
  \n以窒友梅根而言\n\n製作成本        12M\n\n行銷成本        75M\n\n總票房       176.1M\n\n院線收入    \
  \    80M\n\n家庭娛樂收入    45M (這是指DVD、串流租片、實體租片等)\n\n串流電視收入   100M (這是指串流平台與電視、第四台等播映的授權費用+串流收入)\n\
  \n淨收入        78.8M\n\n\n可以看到，總票房是製作成本的約\n\n但是如果只看院線，票房分潤甚至無法打平製作+行銷成本，\n\n所以依靠的是串流與電視播映的授權費用，以及DVD\n\
  \n\n\n窒友梅根的總票房/製作成本比是15\n\n          淨收益/製作成本比是 6.6\n\n所以這部的總票房必須高出製作成本非常多倍才能打平。\n\
  \n\n\n至於最終收益比是多少呢??\n\n225.0/146.2 = \n\n這個數字就很直觀了，對發行商/製片方複合體來說，\n\n他們每花了1塊錢，最終賺了1.54元。\n\
  \n\n\n那三倍線的依據是什麼呢??\n\n基本上三倍線是對大片的變量進行簡化的結果\n\n1.製作成本 X\n\n2.行銷成本 0.5X (大片的行銷成本比重會比小製作低，比重低但是總量依然很驚人)\n\
  \n3.院線拆帳:50%\n\n若院線收入=總成本，則回本。\n\n所以製作成本+行銷成本=總票房*拆帳比例 則回本\n\nX+0.5X=aX*0.5=1.5X\n\
  \n所以a=3\n\n\n\n以黑豹2為例：\n\n總票房     859M\n\n製作成本   200M\n\n行銷成本   140M (0.7倍製作成本)\n\
  \n院線收入   425M (約0.5倍總票房)\n\n家庭娛樂   155M\n\n串流電視   170M\n\n淨收入     259M\n\n\n\n由此可知，\n\
  \n三倍線基本上還是成立的，\n\n因為大製作的行銷費用雖然相當可觀，但是跟製作費用不會嚴重失衡，\n\n黑豹2的總票房/製作費比是4.3，\n\n     \
  \  淨收入/製作費比是1.3，\n\n所以依然有賺。\n\n\n\n問題是Deadline的報導有提到，黑豹2的主要串流收入是D+，\n\n所以是迪士尼的D+，付了一筆錢給迪士尼旗下的製片方漫威影業/發行商迪士尼，\n\
  \n所以這個170M有多少是水分，有多少是真金白銀，很難說。\n\n\n\n這就跟迪士尼給了ABC一千萬美金，讓小美人魚能在奧斯卡金像獎的時段打廣告，\n\n\
  所以是迪士尼左手交給右手嗎??是\n\n所以ABC有賺錢嗎??有，賺了廣告費一千萬\n\n所以迪士尼有花錢嗎??有，花了行銷費一千萬\n\n\n\n那到底是迪士尼賺到了小美人魚行銷與曝光的機會，\n\
  \n迪士尼的ABC賺到了廣告錢，迪士尼贏兩次，\n\n還是迪士尼多花了一千萬的行銷費，\n\n又讓迪士尼的ABC白白錯失了來自其他廣告商這個時段廣告費的機會成本，\n\
  \n迪士尼輸兩次呢??\n\n這只有迪士尼的會計師知道。\n\n\n\n我只知道，三倍線對這種已經形成行銷模式的好萊塢大片，\n\n依然還是有指標性的數字，\n\
  \n粗略，但是還是有其指標性。\n\n\n\n\n--"
