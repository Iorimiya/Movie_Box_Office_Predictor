url: https://www.ptt.cc/bbs/movie/M.1751385188.A.F68.html
title: '[超好雷] 窒友梅根2意外地好看'
content: "防個雷\n\n雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n\n\n 之前因為無聊所以看一\n 這次其實沒有抱太大的希望\n\n 看到有些影評說「製作團隊根本不知道第一集成功的理由」\n\n 甚至一度考慮不看算了\n\
  \n\n 看完以後只覺得\n 製作團隊不是不知道第一集成功的理由\n 而是知道比第一集更成功的理由\n\n\n 一開始的梅根歸來就直接開臭\n AI嘴臭起來真的是賤到不行又鞭辟入裡\n\
  \ 天線寶寶梅根超可愛\n 表情超有戲\n\n 像前面很多人發文的\n 霹靂遊俠、阿達一族、鬼娃恰吉都是老人看了會心一笑的點\n 我又是那種曾經無聊到把史蒂芬席格後期的B級片看一堆的人\n\
  \ 聽到煩躁阿姨在那邊念片名的時候\n 真的好笑到尷尬\n\n 片長兩小時\n 但是節奏緊湊到完全不覺得有拖沓的地方\n 現在看電影很重視節奏\n 有時候甚至覺得有些電影片長短一點可以更好\n\
  \ 而梅根2完全不會有這樣的感覺\n\n\n 至於深度方面\n 我很喜歡在探討帶小孩的時候\n 是否適度地放手\n 以及我自己覺得啦\n 承認某些事對彼此留下傷痛\
  \  才是成長\n\n 我很喜歡梅根跟她媽說的\n 阿就是崩潰\n 這就是媽媽\n\n 其實這也就是人生啊\n\n 然後原本應該很感性的台詞\n 又用超靠盃的迪士尼唱歌環節帶過\n\
  \ 反而讓人笑出眼淚\n\n\n 最近看了四部電影\n 捍衛任務外傳\n 馴龍高手真人版\n F1\n 窒友梅根2\n\n 目前最想推給身邊朋友的是梅根2了\n\
  \ 會讓人反差感最大\n\n--"
