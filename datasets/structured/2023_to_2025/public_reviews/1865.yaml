url: https://www.ptt.cc/bbs/movie/M.1673873228.A.F7F.html
title: '[雷] 《窒友梅根》很好看但結尾小失望'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~












  前面有不少人分享過了 主要劇情我就不說了


  但是那個結局 我真是有點小失望


  凱蒂看到梅根在殺阿姨 竟然就倒向阿姨這邊助殺梅根了～～


  凱蒂本來那麼愛梅根 而且她的性格就是叛逆


  之前阿姨把梅根回收 就氣到要拿剪刀傷人了 如果我是凱蒂 我應該不會倒向阿姨那邊


  （阿姨不在梅根就可以繼續陪我了）


  但我會叫梅根不要殺阿姨


  （不然梅根的刀疤禿頭沒人幫修）



  雖然不排除看到梅根毀容變恰吉變心了 也有可能看到恰吉要殺阿姨突然想通了


  但我是覺得那個年紀放在叛逆期小孩、又那麼依賴梅根的前提下 如果是台灣屁孩 應該會

  幫忙殺阿姨吧哈哈…



  除了這個之外 真的是滿好看的 結局有點突然就是了（警察來了就突然結束了 啊那個梅

  根殺的人是不是要算在阿姨頭上沒說）



  然後梅根好漂亮好溫柔 看完我也好想要有一個梅根喔


  --


  話說奪舍這個我不是很理解 晶片本體已經壞了 梅根就算之前能操縱小艾 但本體（思想

  ）已毀損 不太可能小艾會變成梅根


  沒有梅根晶片 小艾不過就是梅根的雲端備份而已 她不太可能變成梅根去思考才對


  欸你們都誤會了 我失望的不是警察來那邊（那裡只是順路一提）


  我失望的是凱蒂倒戈站隊潔瑪



  如果小艾的晶片跟梅根一樣 或許說得通'
