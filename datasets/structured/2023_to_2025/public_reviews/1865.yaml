url: https://www.ptt.cc/bbs/movie/M.1681467916.A.591.html
title: '[新聞] 仍得靠廣告！《媽的》《窒友梅根》宣傳'
content: '仍得靠廣告！《媽的多重宇宙》、《窒友梅根》宣傳成本比製作成本高




  《媽的多重宇宙》（圖：A24）


  【文／血紅蘭姆】


  好萊塢雖然不乏許多小兵立大功的電影，但這些作品終究得靠大肆宣傳來殺出重圍。


  自從疫情爆發以來，所有商業大片的票房數字都受到重創，就連現今當紅的超級英雄電影

  也不例外，卻唯有一種特定類型的電影仍然有辦法大鳴大放，那就是成本和規模都較小的

  電影，其中尤其以為大宗。


  從《》、《》、《》到《》，這些小型恐怖片無

  不在疫情期間開出了亮麗的票房數字。


  儘管世間咸信，一部電影的票房數字必須是製作成本的二點五到三倍才有辦法打平，但這

  套公式顯然不適用於小成本電影上。




  《窒友梅根》（圖：Universal）


  在統計出的上，這些小成本電影自然也不會缺席。


  其中《》賺進了七千八百八十萬美金、《》賺進了七千四百七十萬美

  金、《》賺進了六千七百八十萬美金、《》賺進了五千六百七十萬美金

  ，《》則賺進了三千兩百萬美金。


  不過更令人意外的是，這些小成本電影雖然製作起來極為低廉，片商卻砸了更多資金在宣

  傳行銷上。其中《》的製作成本是一千兩百萬美金，宣傳成本則是七千五百萬美

  金，足足是前者的六倍之多。


  在此同時，《》的製作成本是兩千四百萬美金、宣傳成本則是五千五百萬美金

  ，《》的製作成本是一千八百萬美金、宣傳成本則是七千兩百萬美金，《

  》的製作成本是兩千四百萬美金、宣傳成本則是六千萬美金。


  即便是獲獎無數的《》，相較於兩千五百萬美金的製作成本，片商則花上三

  千兩百五十萬美金來宣傳本片。


  。


  新聞網址：




  --'
