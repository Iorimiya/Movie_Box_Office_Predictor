title: '[普雷] 《窒友梅根》梅根真的很婆呀！'
content: '簡短評價，不是部非一定要進場觀看的

  電影，所有精彩、驚悚、嚇人的片段，

  90%都在預告裡出現過了，爛番茄指數

  那麼高，有點誇大了，大概75%左右覺

  得合理。


  如果期待有大虐殺、血腥、嚇人、驚悚

  ，這部可能會讓人有點失望，只有幾幕

  的jump scare可能會嚇到比較膽小的觀眾

  ，其餘都是一般很普遍的拍攝手法。眾所

  期待的魔性舞蹈加上該片段配樂，以為原

  本要開始爽快虐殺，但卻草草帶過,其他的

  家庭、親情議題也是快速帶過，大概只有

  最後10分鍾精彩。


  只能說有很驚悚嗎？有很嚇人嗎？有很血腥

  嗎？如果是常看恐怖片的人，會覺得小兒科

  ，不常看的也許會覺得還不錯。


  但梅根實在太婆了，貼心、陪伴、會照顧人

  、又漂亮、又會唱歌跳舞、又聰明，真的婆

  味十足，只是後面造型突變成恰吉，是滿好

  笑的。



  最後，溫子仁別再掛監製了，掛監製的片，

  十有八九都很普通，自己下來導啦！

  如果真的這禮拜無聊沒片看，是可以進場無

  腦看看，不然覺得看灌籃高手可能值得點。


  -----

  Sent from JPTT on my Xiaomi 21091116UG.


  --'
