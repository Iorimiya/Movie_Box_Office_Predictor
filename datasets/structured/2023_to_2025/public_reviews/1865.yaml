title: '[好雷] 窒友梅根  真的蠻好看 很舒壓 ～'
content: '先說這部片我擺在準神作

  劇情很順

  而且又有趣

  小女主演技不錯

  老闆我覺得滿可愛的

  （死了有點可惜）


  梅根感覺真的有小頭腦那種機器人

  前面爽片 中間有點恐怖 後面變特攝片笑死


  看完真的很喜歡梅根

  真的很想養一隻

  看她殺一堆垃圾人真的很舒壓

  尺度不小但不會特別噁心

  只希望梅根

  再殺多一點

  才一點人不夠殺啊啊啊啊啊啊


  能歌能舞懂人情

  砍小人

  一台三十萬我買！！

  有砍小人功能值得啦











  後面有雷


  結局女主阿姨沒死真的可惜

  整部劇情最爛的咖

  老實說沒梅根

  女主可能早就變精神病（重度抑鬱）

  媽的

  梅根嘴女主阿姨真的很爽


  最後叫哥哥機器人打妹妹

  明顯收不住

  但蠻爽的有點像在看機甲風戰鬥


  我要梅根第二集殺爛所有爛咖

  最好拍成John wick風

  -----

  Sent from  on my iPhone


  --



  --'
