url: https://www.ptt.cc/bbs/movie/M.1751125029.A.09A.html
title: '[好雷] 窒友梅根2   '
content: '看過第一部的梅根覺得很普通，在看到第二部有好評後決定去看了


  看完的第一反應是：我到底看了三小？


  電影剛播的時候還以為進錯廳，忍住跑出去確認的衝動看一段，還真就是窒友梅根…


  其實第一部結尾就有點苗頭了，但第二部可以轉型的這麼徹底也是始料未及


  第一部是個不太恐怖的恐怖片，第二部直接變成美式超級英雄，震撼程度拿國片舉例，就是

  咒第二部大黑佛母變角頭跟8+9互砍一樣


  新的敵人出現，第一部反派洗白暫時共同對敵，過程中年危機一下然后成長，最後真的一條

  心拯救了世界，當然大片的飛車追逐、槍戰、肉搏應有盡有



  雖然看的時候心裡面一直吐槽，不過對這部片的評價還是好雷，因為真的看的很開心XD


  可以看出劇組真的是認真轉型，開頭出現的強化外骨骼、大腦機械化、練武功的伏筆都有用

  上，打戲也是夠多夠爽


  還有科幻作品中對AI的看法通常都是消極的，這一部算是積極的態度比較有新鮮感


  最有趣的還是一、二部風格不同造成的反差感w



  所以強烈建議對窒友梅根2有興趣的人，一定先去看第一部才能理解第二部的快樂，直接看2

  只會覺得是普通的爆米花片









  --'
