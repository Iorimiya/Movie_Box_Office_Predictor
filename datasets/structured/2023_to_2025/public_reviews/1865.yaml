url: https://www.ptt.cc/bbs/movie/M.1665670687.A.0B6.html
title: '[新聞] 接棒恰吉、安娜貝爾 「窒友梅根」預告驚'
content: '新聞網址：




  接棒恰吉、安娜貝爾 「窒友梅根」預告驚悚曝光


  2022-10-12 16:59 聯合報 記者陳建嘉／即時報導


  當代恐怖大師溫子仁攜手布倫屋製作公司打造的全新恐怖片「窒友梅根」，今曝光首支預

  告。電影描述具備高度人工智慧、栩栩如生的玩具人偶「梅根」，原先被設計成小孩子最

  好的玩伴和令家長最安心的盟友，卻意外失控，造成無法想像的嚴重後果，這個惡魔人偶

  也將繼由恰吉、安娜貝爾之後，再度挑戰恐怖新極限。


  這款玩具人偶由一名玩具公司傑出的機器人專家潔瑪精心設計，能夠藉由聆聽以及觀察學

  習人類行為，並且成為她照顧的小孩的朋友、老師、玩伴和保護者。當潔瑪突然成為她失

  去雙親的8歲大姪女凱蒂的監護人之後，決定將她設計的人工智慧玩具人偶梅根的原型和

  凱蒂配對，試圖解決照顧凱蒂這個孤兒和紓解她工作壓力這兩個問題，沒想到卻引發一連

  串恐怖事件。


  電影由傑森布倫和溫子仁一同製作，並由傑拉德強斯頓執導，曾演出「逃出絕命鎮」的愛

  莉森威廉絲在片中飾演潔瑪，凱蒂則由曾演出恐怖影集「鬼入侵」的薇樂麥格勞飾演。「

  窒友梅根」預計2023年1月13日在台上映。


  預告：




  --'
