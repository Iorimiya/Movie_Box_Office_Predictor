url: https://www.ptt.cc/bbs/movie/M.1674412363.A.EF4.html
title: '[好雷] 窒友梅根'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~












  影片心得


  我覺得這片還不錯，驚悚之中帶幽默，還稍微點出現在小朋友的成長環境問題

  看完會讓我去思考劇情


  後段凱蒂在玩具公司實驗房那個討不到梅根的歇斯底里模樣，

  根本就是小朋友戒網癮發作時的症頭


  現在很多大人都把小朋友丟給手機或平板等3C產品去顧，玩不到手機就發瘋發脾氣

  從小人格就扭曲


  我想也許導演是想表達這個問題


  梅根 = 超智慧型爆高黏濁度百依百順3C智慧娃娃


  一把梅根從凱蒂身邊抽走，馬上焦慮到六親不認


  也呼應到了開頭凱蒂媽在車上說的，一天平板只能玩30分鐘

  與心理醫師說的，小孩需要真實互動身心才能正常成長



  個人心得

  其實梅根出現的時候看到她那張跩臉，我就在想，該不會跟上一部的疾惡一樣

  後面變成在演別的


  疾惡後面根本變成動作片，那個行雲流水、華麗又流暢的在那邊飛天鑽地爬牆開無雙

  沒騙你，當時在電影院我還以為現在看的是基努李維的捍衛任務


  結果梅根在這片後面真的變成魔鬼終結者T800了，哈哈哈。



  中間樹林學校那段，我在想那個屁孩布蘭登竟然抱的動梅根


  梅根可是金屬加陶瓷骨架，動力那麼強身上搞不好還掛電瓶，

  一個屁孩輕鬆把她扛起 = = ，不過劇情需要啦，算了


  後面梅根的爆走算是可以理解，她沒有機器人三原則限制，一旦理解到人類情緒的矛盾

  自然就不會再把人類放在眼裡


  只是後面梅根提到，凱蒂不再是她的主控，這點在劇情上我覺得很可惜


  編劇如果最後依然設定成凱蒂是主控


  那梅根再怎麼失控


  她的一切行為跟目地依然都還是為了保護凱蒂，只是病嬌了點，起碼情感上能理解

  像殺狗(咬凱蒂)、殺阿罵(瞪凱蒂)，雖然殘忍，但就是最極端人性的表現


  加上中間培養感情這麼久，也稍微會對梅根糾一下心，覺得這娃娃還能挽救


  最後魔鬼終結者化，似乎變成只是單純失控的AI，也讓觀眾失去對她的情感投射


  也有點枉費了中間梅根那麼多在感情戲上面人性的表現









  --'
