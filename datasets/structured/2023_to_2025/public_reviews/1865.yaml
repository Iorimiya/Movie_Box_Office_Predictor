url: https://www.ptt.cc/bbs/movie/M.1675249577.A.EB7.html
title: '[好無雷] 窒友梅根 - 有點驚悚的溫馨家庭劇?'
content: '《#窒友梅根》8/10分


  比想像中還要溫馨有趣很多


  -


  有別於其他溫子仁監製的垃圾恐怖片

  窒友梅根在已有的人工智慧類型片上

  找到了一個很有趣的切入點

  (可能因為溫子仁有參與劇本的編寫?)

  以往都是偏向殺光人類或是毀滅世界之類的

  而此片變成是讓人工智慧成為小孩的保母

  也讓整部片莫名的出現一種溫馨感人的氛圍…?

  就如同網路上所說的

  梅根真的很婆

  不只沒有恐怖谷的詭異感

  更覺得不如拿梅根來當作V皮甚至是可行的想法?


  -


  雖然大方向還是能猜到是不是又是AI失控

  而導致這一切的發生

  但在細節上

  許多橋段很有意思 也讓觀眾很有共鳴

  甚至是令人感動落淚 (我是有鼻酸一下啦)

  這些部分都讓觀眾沒辦法去真的討厭梅根


  -


  稍嫌不足的地方在於

  整部片驚悚的地方其實算滿少

  即使有也很手下留情

  以及一些小支線收尾有點隨便

  但也是瑕不掩瑜就是


  -


  整體來說

  這部反而更像一部家庭劇情片

  帶有些許懸疑、驚悚元素

  而家庭議題的部分

  確實是能讓所有為人父母的觀眾好好省思一下


  -


  不如下一集就拍照顧成人的梅根吧…

  聽起來就是票房保證



  --


  無雷 電影/影集短評IG：




  --'
