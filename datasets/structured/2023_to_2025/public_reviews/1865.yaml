url: https://www.ptt.cc/bbs/movie/M.1750996237.A.444.html
title: '[好無雷] 窒友梅根2.0：是搞笑不是動作片'
content: '如果想看動作片的影迷可能要失去望了，這部動作沒很多，不過就像溫子仁的“疾厄””

  玩命關頭”一樣，這部有旋轉鏡頭和旋轉機器人身體戰鬥


  片中致敬的多到爆炸，玩命關頭，魔鬼終結者，史蒂芬席格系列等等


  片中玩了很多反DEI梗，甚至連道德綁架都說出來了，還有直接拿中國俄羅斯開玩笑，中

  國諧音黃色笑話應該是全劇最好笑，還有物化金髮正妹和好色老白男等等


  搞笑多到爆炸，黃色黑色諧音笑話都有，很多中文翻譯挺糟糕的，認真聽英文才笑的出來

  ，賣萌更是沒少，預告中的天線寶寶萌到令人產生大膽的想法

  荒謬的笑點更是多到誇張，凱蒂的偶像居然是史蒂芬席格，還去學合氣道，請問這是中年

  動作片迷大叔亂入凱蒂靈魂嗎？還有FBI特務被掃地機器人絆倒，我這廳人很少，但是笑

  聲有夠大，每個人都笑超大聲


  最可惜的是中後段放了太多多餘劇情，90分鐘放了一堆親情權謀，應該剪掉


  可以理解評價差，考量到廢戲，不過不敢想像這是3500萬拍出來的東西，比今年4億美金

  的東西全都好看，目前啦，對梅根有大膽的想法的觀眾必看！！


  --

  對，很多反DEI網紅開這玩笑，結果上大銀幕靠北！

  推廣低成本好片被你亂噓，我很桑心~可以不要嗎?拜託惹大哥~

  推廣低成本好片被你亂噓，我很桑心~

  好片就是要推啦!

  去看梅根2.0，真的很好笑啊!

  霹靂遊俠最近才知道這個梗，阿達一族那個小手手好可愛~~最近才知道梅根的戰鬥方式

  是致敬艾莉塔:戰鬥天使的電玩，有個叫做機甲術的東西，就是用詠春拳下去做的，所以

  艾莉塔電影就有快拳了，我要打十個!!'
