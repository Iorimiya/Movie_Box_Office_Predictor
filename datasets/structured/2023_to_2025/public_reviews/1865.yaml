title: '[情報] 窒友梅根 最新預告 '
content: "導演：傑拉德強斯頓\n卡司：愛莉森威廉絲\n      薇樂麥格勞\n      錢信伊\n      布萊恩喬丹艾瓦瑞斯\n      珍范埃普斯\n\
  \      洛莉丹吉\n      史蒂芬嘉諾蒙頓\n\n故事大綱：\n\n「她不只是個玩具，而是這個家的一份子。」\n當代恐怖大師溫子仁（【奪魂鋸】、【陰兒房】、【厲陰宅】系列）以及布倫屋製作公司\n\
  （【月光光新慌慌】系列、【闇黑電話】、【隱形人】）共同打造一部全新恐怖片【窒友\n梅根】。\n\n梅根（M3GAN）是一個具備高度人工智慧、栩栩如生的玩具人偶，被設計成小孩子最好的\n\
  玩伴和令家長最安心的盟友。這款玩具人偶由一名玩具公司傑出的機器人專家潔瑪（【逃\n出絕命鎮】愛莉森威廉絲 飾）精心設計，梅根能夠藉由聆聽以及觀察學習人類行為，並\n\
  且成為她照顧的小孩的朋友、老師、玩伴和保護者。\n\n當潔瑪突然成為她失去雙親的八歲大姪女凱蒂（恐怖影集【鬼入侵】薇樂麥格勞 飾）的\n監護人之後，潔瑪並不確定也沒有準備好能夠成為一個好的家長，加上她的工作壓力非常\n\
  巨大，於是就決定將她設計的人工智慧玩具人偶梅根的圓型和凱蒂配對，試圖解決照顧凱\n蒂這個孤兒和紓解她工作壓力這兩個問題，但是她的這個決定卻造成無法想像的嚴重後果\n\
  。\n\n【窒友梅根】一片由傑森布倫和溫子仁製作，並由獲獎導演傑拉德強斯頓（【嚎宅禁地】\n）執導，編劇則是愛珂拉庫珀（【疾厄】、【鬼修女2】），根據愛珂拉庫珀與溫子仁的\n\
  原創故事改編。\n\n這部電影的演員陣容還包括錢信伊（【尚氣與十環傳奇】）、布萊恩喬丹艾瓦瑞斯（喜劇\n影集【威爾與格蕾絲】）、珍范埃普斯（Netflix影集【星際牛仔】）、洛莉丹吉（【魔\n\
  戒首部曲：魔戒現身】加長版）以及史蒂芬嘉諾蒙頓（影集【Straight Forward】）。\n\n環球影業暨布倫屋出品、Atomic Monster（原子怪獸影業）與Divide/Conquer製作，【窒\n\
