url: https://www.ptt.cc/bbs/movie/M.1674045453.A.1E1.html
title: '[新聞] 《窒友梅根》全台票房破千萬 網笑：很想'
content: '新聞網址：



  《窒友梅根》全台票房破千萬 網笑：很想擁有一個



  〔記者鍾志均／台北報導〕恐怖電影《窒友梅根》6日在美國上映，狂吸恐怖驚悚片迷支

  持，上映第2週口碑延燒，累積票房突破6000萬美金（約台幣18億元），台灣在13日上映

  後，全台至昨天也突破1040萬，票房後勢看漲。


  「梅根風潮」席捲全球，還有不少影迷看完後，笑說在家也想擁有一個（梅根娃娃），還

  有人打趣表示，這部片應該放在兒童節檔期上映；而台灣在台北欣欣和今日秀泰影城以及

  美麗華大直影城等，也可見到她的身影。


  導演傑拉德曾透露，希望梅根為觀眾帶來視覺衝擊，「遠遠看她會以為她是真人，靠近一

  看，會發現她的臉部比例和細微表情有點怪，像洋娃娃，不過膚色、眼睛、睫毛又會讓人

  懷疑是真人」



  --'
