url: https://www.ptt.cc/bbs/movie/M.1675363005.A.C90.html
title: 'Re: [討論] 窒友梅根問題請教(有雷)'
content: '這邊是根據劇情的個人腦補


  推文有版友在問梅根討不討厭那個心理師，我個人認為是不討厭的


  雖然凱蒂三不五時鬧情緒，但心理師的目地是幫助凱蒂，梅根這麼精應該也看的懂


  至於砍CEO總經理跟他助理那邊，可能要往前回到董事長來公司看展示的那一段


  此前凱蒂剛被狗咬人還在不舒服就被潔瑪硬拖到公司


  之後凱蒂情緒非常低弱，甚至難過到直接哭出來


  梅根安慰凱蒂的同時，也有一個很明顯回頭去看展示間眾人的眼神出現


  那個眼神讓我印象深刻，很像是在說，凱蒂都這樣子了，你們確定還要繼續嗎?


  見到大家包括潔瑪還有CEO等眾人都沒反應


  梅根這麼病嬌可能就把這些人都給記下了，有點像是 你們這傷害凱蒂的人，都給我記住


  所以後面梅根在公司暴怒時，路上被他堵到的CEO就直接被他給順勢劈了


  我是覺得梅根從頭到尾沒失控，她只是愛護凱蒂然後病嬌到了極點


  她從公司暴怒殺回家也是先就凱蒂的問題來跟潔瑪談話


  跟潔瑪打架時還知道叫凱蒂先去睡覺不要看


  結果潔瑪真的G8到我都有點看不下去= =



  --'
