url: https://www.ptt.cc/bbs/movie/M.1732523400.A.A66.html
title: '[好雷] 窒友梅根'
content: '防雷











































  當年看到這部電影沒有很看好

  畢竟又是溫子仁監製,我想懂得都懂

  頂多跟恰吉差不多的等級吧

  昨天看了發現比想像中精彩很多

  有足夠份量的恐懼,也有提到帶小孩的議題

  即使各方面沒有多深入探討

  以這種片型來說,這樣已經很棒了

  我是看了很有感觸,在處理創傷的部分

  梅根也許很會說話,但終究只是逃避

  沒有真正面對失去父母的創傷

  畢竟對孩子來說這是全世界最慘的事情

  在這樣的恐怖片裡還能這樣思考很賺


  後面大人小孩一起大戰梅根我覺得好眼熟

  原來是梅根變成t800的部分

  那段根本魔鬼終結者第一集最後的戰鬥

  我覺得也是很不錯,敵人都死不了

  這時又拉回這類恐怖片的本質了

  所以這部電影真的很不錯

  做好自己本份還多做了不少事情

  老實說蠻推薦的,也會期待續集

  溫子仁監製終於不是詛咒了嗎？


  ----

  Sent from  on my Samsung SM-S9280


  --

  我見過...你們這些人不會相信的事

  我目賭在獵戶座的邊緣著火的攻擊艦

  我看見C光束在湯豪色星門附近，在黑暗中閃亮著

  所有這些時刻都會消失...於時間中，一如眼淚...消失在雨中

  死期到了


  --'
