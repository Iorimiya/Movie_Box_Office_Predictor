title: '[好雷] 越南名偵探：無頭詛咒 水準之上 '
content: '19世紀，越南北方的一個村莊裡，出現了八具無頭浮屍，讓村民之間人心惶惶，擔心有不

  祥之物盯上這座村子。某天，生活在村裡的海曼（丁玉葉 飾）發現心愛的姪女小娥（段

  明安 飾）失蹤了，害怕小娥也變成下一具無頭浮屍，她決定向曾經幫助過她的偵探阿堅

  （國輝 飾）求助。阿堅能夠順利找到海曼的姪女嗎？




  對越南電影很無感

  比想像中好看非常多

  19世紀越南小村風景超美

  角色顏值男的帥

  女主角也超級美又一直很騷(??!去看就知道

  還以為她是.....

  女配之外也很美



  推理部分不錯不瞎

  恐怖部分有到位

  打鬥部分不含糊

  都在水準之上



  還有很微妙節奏的越南式笑點

  莫名好笑



  看來是有續集

  可以期待

  在越南好像賣很好

  票房突破2490億越南盾（約2.49億台幣）


  --'
