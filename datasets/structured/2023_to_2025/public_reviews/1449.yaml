url: https://www.ptt.cc/bbs/movie/M.1508401954.A.073.html
title: '[影評] 《正義辯護人》:守護人權與法治的價值'
content: '文／法操司想傳媒




  電影《我只是個計程車司機》席捲韓國票房，在台灣也開出票房佳績，同時再度喚起觀眾對

  1980年光州民主化運動的認識。飾演本片司機大叔的宋康昊曾多次獲得韓國電影獎項，有韓

  國「國民影帝」之稱，這次《法操》想帶讀者分析的法律電影，是另一部他在2013年所主演

  的《正義辯護人》。


  本片以韓國已故前總統盧武鉉為故事原型，並以發生在光州事件後一年的「釜林事件」為背

  景，描述由宋康昊主演的一位稅務律師宋佑碩，因為親如家人的老闆娘兒子朴鎮宇，被依赤

  色分子（共產主義分子）罪名被捕，而踏上人權辯護之路。





  貫穿本片的釜林事件，發生在1981年釜山，當時的全斗煥政府為整肅赤色分子，以閱讀禁書

  為理由，逮補在釜山組成讀書會的大學生22名，並以違反《國家保安法》罪名起訴，被告各

  別被判處1到7年不等的有期徒刑。看到這裡，不禁讓人想起發生在台灣的白色恐怖時期，同

  樣是以肅清異己為由，對人民進行思想控制，嚴重侵害我國憲法第11條所保障的：人民有言

  論、講學、著作及出版之自由。


  進一步以本片劇情來看，會發現不僅起訴的罪名有疑，程序上也完全不符合法治國該有的樣

  子。首先，警方在未出示逮捕令的情況下，就將朴鎮宇抓起來，若依我國刑事訴訟法來講，

  雖有規定無須令狀就能直接逮補的情況，但此情況是在遇到現行犯、通緝犯、或是犯罪嫌疑

  重大者身上。


  宋佑碩律師在對逮補學生的車東英警官問話時，車東英以《國家保安法》的程序是「先逮補

  ，再補相關手續」作為理由，而《國家保安法》的制定背景，其實是1948年為對抗朝鮮（北

  韓）政府所立，主要內容為處罰反國家、反政府行為，與我國在邁向民主化前曾經歷的過去

  頗為相似，顯示在獨裁政府下法律的空轉，以及對人權的壓迫。


  除此之外，警方對學生以刑求、逼供的方式迫使他們認罪，也是現代法治國完全禁止的，更

  不得以此逼供下的自白書做為證據；而程序上被告進入法庭，卻仍被上手銬，是違反韓國刑

  事訴訟法第280條、等同我國刑事訴訟法第282條的規定，一再顯示在當時的歷史背景，政治

  凌駕法律，更遑論正義能水落石出。





  在觀看本片時，讀者或許會對司法的黑暗和不公平感到氣憤，但除此之外，《法操》認為「

  人民的無知與冷感」是同樣可怕的事。在觀察宋佑碩律師的心境轉變，會發現與計程車司機

  金四福相同，一開始在看到社會事件時，都曾說過類似「好好的大學生不讀書跑去抗議」的

  話（在台灣似乎也不陌生？），正因自己平時奉公守法，努力追求安穩的生活，於是滋事的

  群眾就變成無所事事、破壞社會安穩的毒瘤。


  另一方面，釜林事件和光州事件都因消息遭政府控制，因此人民透過電視、報紙接收不到

  真實的消息，甚至是遭到竄改、刻意醜化當事人的新聞，使人民「知的權利」受到嚴重限

  制，宋佑碩律師也是因為朴鎮宇被捕，才得以發現事情的真相。


  這時，我們會發現憲法所保障的新聞自由有多重要，雖現今台灣社會對媒體亂象的批評沒有

  少過，媒體自有該檢討的地方，卻也不能否認媒體具有監督政府，獨立於行政、立法、司法

  之外「第四權」的重要性，若當媒體成為政府控制的發聲管道，人民失去真相，將使政府的

  權力無限上綱。


  當人民對政治無感，對社會事件冷漠，就可能放任政府權力的膨脹與為所欲為，而抗爭行動

  正是那個時代對獨裁政府的不滿，與對民主的渴望，套句朴鎮宇說的台詞：「如果參加示威

  就要遭到天譴的話，那些逼得大家不得已進行示威的人們，該得到什麼懲罰？」


  我國與韓國，在轉型成民主國家的道路上，有許多類似的歷史軌跡，透過《辯護人》不僅是

  對法律、政治和歷史的認識，也是反思並珍惜現代得來不易的民主價值。




  --'
