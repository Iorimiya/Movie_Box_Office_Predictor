url: https://www.ptt.cc/bbs/movie/M.1455013605.A.03B.html
title: '[好雷] 正義辯護人 (2013) The Attorney'
content: '網誌版



  究竟什麼比較困難？十年寒窗換得榮華富貴抑或是放下榮華富貴選擇良心？改編自南韓前

  總統盧武鉉的人生故事，《正義辯護人》裡的宋佑碩從一無所有到功成名就到最後放下一

  切成為人權律師，他的故事如傳奇，卻也如此真實。


  就因為是真實故事，所以宋佑碩不是個偉人。某種程度上，他和任何凡人一樣，想成功、

  愛錢、也愛小確幸。幸運的，他的人生也如他所願，他考上了司法官及律師，賺了大錢，

  成了有房有家有事業的人生勝利組。渾身的銅臭味讓他在同行中被鄙視，卻無損他的成就

  。他買的海景第一排豪宅梁柱上竟刻有他當時做建築工人刻下的座右銘：永不放棄。


  或許也同許多染上政治的人一般，要不是政治找上，宋佑碩大概一輩子也不想碰政治。電

  影中的他還曾在酒後因為嘲笑示威學生和記者同學在小麵館裡大打出手。他就是那個舊時

  代的成功典型，靠著自己拚搏有了事業，對於公共事務漠不關心。或許他是對的，如果成

  天上街抗議能夠改變時局，那他早就去了。政治歸政治，生活規生活，只是或許他也沒想

  過，政治就在生活裡，而且，就在他那安穩的生活裡。


  失控的政府、被逮捕的學生、虛偽的新聞，原先宋佑碩是不在意的，直到他知道受害者不

  是在報紙上，而是在他最常光顧的麵攤裡。難道麵攤老闆娘乖巧的兒子是共匪？當他陪著

  老闆娘到監獄裡探視兒子時，那個傷痕累累的孩子瀕臨精神崩潰，而宋佑碩的世界也崩解

  了。原來，國家暴力這麼近，這麼寫實。那一幕，對於宋佑碩乃至於觀眾，都是震撼。而

  那天起，宋佑碩一腳踢開了他平步青雲的人生，走上了和政府對抗的不歸路。


  不歸路，因為辛苦，也因為無法回頭。當良心戰勝了名利，宋佑碩無比堅決，哪怕什麼困

  難都遇上了。事業不再蒸蒸日上也罷了，他被打、被威脅、被騷擾，連他的孩子都收到關

  切電話。他不再是個「好學生」、「好國民」。他義務做了麵攤兒子的辯護人，最後更成

  了個暴民，變成了被告。唯一不變的是那份決心，那份讓他考上司法官與律師的決心，引

  領了他走上社會運動。


  他遭到攻擊時西裝都髒了，正當他在廁所愁眉不展時，當年跟他打架的記者同學竟脫下西

  裝給他。那是個打字機的年代，也是個媒體都噤聲的年代，送出去的稿子說了真話是不可

  能被刊出的。一件西裝，是來自一個不願丟飯碗的記者，最懦弱也最尊敬的支持。


  片子尾聲，法庭上，宋佑碩身穿囚服，而站在他身後的是幾乎全釜山的律師，他們來做辯

  護人。他們要為宋佑碩辯護、為真理辯護、為良心辯護、更為這個國家而辯護。


  兩個多小時的電影太短，社會改革的路卻迢迢。電影的篇幅絕不足以訴說一路的艱辛與挑

  戰，但《正義辯護人》作為盧武鉉前半生的縮影，讓觀眾看到的不再是那個帥哥美女與浪

  漫韓劇的韓國，而是那個從威權走向民主、脫胎換骨的韓國。


  --'
