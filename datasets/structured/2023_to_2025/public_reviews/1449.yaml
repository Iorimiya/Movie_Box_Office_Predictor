url: https://www.ptt.cc/bbs/movie/M.1422879305.A.4C5.html
title: '[好雷] 正義辯護人 -- 我們不能永遠隱瞞真相'
content: '政治是管理眾人的事，無論你認為政治很骯髒，或單純不感興趣，社會上的每個人都無法


  迴避政治。一位高中學歷努力苦讀才取得律師執照的工人，仰賴敏銳的市場嗅覺，從兼任


  不動產代書到專業稅務律師，賺進大把大把鈔票。1980年代的韓國全斗煥總統獨裁威權時


  期，各地民主化運動頻傳，他卻認為示威抗議造成社對動盪，不表認同。




  宋祐碩律師在當工人時，貧困潦倒，甚至連飯錢都付不出來。直到功成名就，他帶著妻小


  滿懷感恩的心，前往那家他賒帳吃霸王餐的豬肉湯飯餐廳，對老闆娘與她的兒子表達感謝


  的心情。一個人能夠達成特定的目標，其中一定有許多人幫忙，卻只有少數人能回首來時


  路，前往感恩拜訪。




  原本對政治漠不關心的宋祐碩，因為老闆娘的兒子鎮宇被誣指為共產黨，而決定替他辯護


  ，並從事社會運動。憑藉武力奪權的全斗煥總統在韓國施行獨裁統治，監控人民的行動與


  思想。鎮宇與其他大學生組織讀書會分享心得，並教授小朋友知識，卻被指控意圖顛覆政


  府，煽動革命。




  政府總是以外在敵人恐嚇自己的人民，藉此控制人民，並增加政府的權力。這與台灣有點


  類似，國民黨政府宣傳民進黨執政會導致中國武力犯台；民進黨政府指涉國民黨執政會聯


  共賣台。無論這些言論的正確性與否，他們的共通點都在恐嚇威脅自己的人民。獨裁政府


  這麼做並不讓人意外，讓人意外的是，台灣的民主政府也是這樣搞。不管哪個政黨執政，


  人民永遠處在擔心受怕的氛圍。




  因為有北韓這個共同的敵人，全斗煥獨裁政權有完美的藉口壓制國內的反對勢力。每每以


  國家安全為由，逮捕異議人士，限制民主思潮，許多大學讀書會成員因此被逮捕。




  你覺得自己愛國嗎？




  車東英警官負責逮捕讀書會成員，將他們屈打成招，誣指為共產黨。很難想像韓國在1980


  年代的政治發展居然遠遠落後台灣，應該掃進歷史灰燼的威權獨裁居然還在東北亞生生不


  息。宋祐碩律師在法庭詢問車東英警官的一場戲是本片的高潮，兩人對國家與愛國的爭論


  值得一看。朝鮮半島在韓戰後劃分為南北韓，戰後簽署休戰協定。邏輯上來說，韓戰只是


  暫時休止，尚未結束。




  車警官認為南韓人民之所以能安居樂業，是因為軍人警察努力保家衛國，捕捉共產黨間諜


  的結果，人民應當心懷感激。他對自己的所作所為感到驕傲，視其為愛國的表現。然而，


  宋祐碩律師認為主權在民，政府的權力是由人民賦予，人民就是國家，公務人員不應恣意


  擴權，迫害人民。尊重人民的基本權力才是愛國的最高表現，因為沒有人民就沒有國家！





  保家衛國當然也是一種愛國的表現，但倘若所有的作為都只是單純服從上級權威的命令，


  不問理由，那不過只是愚忠，更將效忠的對象搞錯了！宋祐碩律師：｢那些軍人以武力取


  得政權，他們才是你的國家！｣




  一位陸軍醫官挺身而出作證指控車警官與其部屬涉嫌毆打讀書會學生，卻被陷害為不假離


  營外出。證詞被與車警官一夥的法官刪除，官司敗訴，學生們都遭判刑。宋祐碩律師後來


  投身民主化運動，對南韓民主化有深遠的影響。




  最不可靠的就是媒體




  威權體制下的媒體除了時時接受官方關愛的眼神，更要學會自我審查，報導政治正確的樣


  板文章。可笑的是，民主政體下的台灣媒體仍有許多媚共或媚政府的宣傳，過度倡導中國


  的美好與掩飾政府的施政不當。｢誠實報導的記者向來都會被炒魷魚！｣為了生活，我們


  做了多少妥協，而又在什麼樣的情況下，我們內心的良心警鐘會大響，告訴自己不該這樣


  繼續下去？




  看看韓國，想想台灣。韓國比我們晚脫離威權統治，快步成長，在政治、經濟、文化、體


  育、電影、娛樂都有長足的進步。而台灣卻彷彿時光停滯，只能緬懷過去台灣錢淹腳目的


  美好過往。借鏡韓國，期許台灣能做得更好！





  --'
