title: （好雷）正義辯護人 追求民主下的歷史軌跡
content: "電影【正義辯護人】（朝鮮語：A英语：The Attorney）\n\n片長：128分\n\n上映時間: 2014/09/16\n\n1- 韓國今年度百想藝術電影大賞得獎作品\n\
  2. 改編自1981年韓國民主運動濫觴「釜林事件」、已故前總統盧武鉉真實事蹟。\n\n3.電影短短一個月票房便飆破千萬人次，打破韓國影史票房紀錄，列入韓國歷年票房第八\n\
  名\n\n4.「人民就是國家！」小市民vs. 龐大國家機器，呼應台灣近期社會話題。\n\n\n\n【正義辯護人】韓文：A韓音直譯就是《辯護人》，（英語：The\
  \ Attorney，港譯\n：逆權大狀）是一部2013年上映的韓國電影。\n\n這部電影與今年台灣的太陽花，或是香港的學運運動，非常呼應。\n\n不管你認不認同學運，或是民粹運動，我想都可以在這部片中，找到答案，支持的理由是\n\
  什麼，反對又為什麼，韓國可以出產這樣的電影，著實欣羨，畢竟在兩岸三地，並不認為\n雙方執政黨可以容許這樣揭歷史瘡疤的電影熱映…這也代表著韓國經過了一段流血.流汗.\n\
  流淚的日子，相對於我們講中文的地方，思想上相對開放民主了些，至少勇於去面對及接\n受這曾經的歷史包袱。\n\n雖不敢說這有百分百呈現史實，但至少個人不認為這有過於灑狗血，整體而言算十分真實\n\
  。\n\n我們常是「思想的巨人，卻是行動的侏儒」！想得很多，但實際去做的很少，肯付諸實踐\n自己理念的人，是人生的勇者，\n\n人活著又是為了什麼呢？\n\n\
  如果只是「繁衍」或「延續」，或許太粗略，我想更明確抑或也是抽象應是「思想的遞延\n」,也是一種文化的累積。\n\n自古以來人終難逃一死，朝代總是難逃興衰交替，人類的行為或是歷史更迭，也或是在重\n\
  覆，而為什麼會在這過程中，有人勇於奉獻自我，將生死置外，為的便是想去實現更崇高\n的理念…\n\n每個人的結局都是一樣，不同的僅在於彼此的過程。\n\n「政治」或許不是我們這些市井小民所能悟透的，但私心以為只要有人的地方就有「政治\n\
  」。\n\n曾經我問一個來台灣留學的韓國人，為何想來台灣?他的答案有點讓我印象深刻，並不是\n因為中文很夯，最主要的是他認為台灣的情況很像韓國，目前台灣跟中國，如同南韓與北\n\
  韓，曾經是同個國家，說著同樣的語言，一樣因為戰爭而一分為二，一個是民主主義，一\n個是共產主義，經過時間的洗禮，就算講著相同的語言，彼此也已不認為是相同的彼此。\n\
  所以，他想瞭解台灣。\n\n姑且不管是哪種統治手段，生於這塊土地上的我們真能選擇嗎？又真能改變這個世界嗎？\n抑或是我們也只不過是軍閥鬥爭下，所得來的結果?！\n\
  \n這部片是改編韓國已故前總統盧武鉉的故事，韓國的「釜林事件」，猶如台灣曾經的白色\n恐怖…先人曾經流過的血，才造就我們現在的思想幸福，人民要的是什麼?如果僅僅是維\n\
  繫守法，就真的可以確保安穩生活的日子嗎?\n\n喜歡這部片，不管贊不贊同民粹，先人所流過的血汗，現在都是我們該去珍惜再珍惜的…\n而這部片雖是韓片，卻又猶如鏡子一般，反射著我們極為相似影子。\n\
  \n喜歡此部電影裡的兩個句子：\n\n    岩石終究會化為砂石，但雞蛋卻能孵化出生命\n\n\n\n大韓民囯的主權是國民的，所有的權利是從國民出來的。國家就是國民　　。-電影【正\n\
  義辯護人】\n\n\n\n－　－　以下內容含有劇情　慎入有雷區　－　－　－\n\n宋佑碩（宋康昊　飾）飾演一名律師（影射當時還是律師的韓國前總統盧武鉉），原本高\n\
  中學歷出生的他，，抱著＂絕對不放棄＂的決心，經過一番苦讀終於讓他考上法官，但為\n了能有更多＄，繼續轉而當律師，其擁有不同於一般律師的眼光，靠著跨足不動產登記，\n\
  及擔任公證人等，迅速賺進了不少錢，更因為與一般同業不同的行徑，主動發名片．而被\n其他律師白眼（當時韓國律師的社會地位，自以為崇高可見一般）．在同業看到原來不動\n\
  產有如此利潤時，一時之間都往不動產方面擠，宋佑碩因原本自身就有會計方面的底子，\n轉而朝向＂為你守護珍貴的財產＂的稅務律師。\n\n\n給予不在於多少，而在於別人是否在困厄之境\n\
  \n在宋佑碩尚未發達的七年前，當時窮苦潦倒時常去一家餐館賒帳，卻因付不出飯錢而一直\n對這飯館心理上有虧欠，他日發達再造訪後，宋佑碩已拿了一包厚實的裝滿錢的信封來歸\n\
  還，沒想到老闆娘卻不收取，還說能考上律師她與有榮焉，不得不說在別人困厄之境，適\n時幫忙的雪中送炭比錦上添花更來的彌足珍貴（不禁讓我想到在網路上曾經看過的一篇文\n\
  章【一杯鮮奶的價值】）\n\n因為感念老闆娘的恩情，宋佑碩只要有機會就照三餐來光顧，甚至同學會也是帶來再續攤\n，當時電視裡面正放著在釜山的＂光州暴動＂（1981），同學們彼此討論著此件事，\n\
  \n有人表達：＂現在最不可靠的就是媒體！＂宋佑碩則非常不以為然～\n\n其中一位媒體人的同學可能是因為感同身受，反應較激烈：＂就算你忙著賺錢，也該知道\n這世界在變化！＂\n\
  \n宋佑碩則說：＂父母送他們去大學是去念書，而不是送他們是去示威！他們以為示威幾次\n，世界就會太平嗎？＂\n\n＂如果可以好好念書，這些學生又為何不待在學校讀書．何苦上街抗議？＂\n\
  \n媒體人同學或許無法說服這時執念的宋佑碩，於是負氣走人～\n\n\n ＂雞蛋再怎麼脆弱也是個生命，岩石再怎麼堅硬還是砂石，岩石雖然堅硬，但有天會化\n成沙塵，雞蛋雖然脆弱，卻可以孕育出生命＂\n\
  \n宋佑碩於是問餐廳老闆娘的兒子鎮宇的想法，認為這些上街頭示威的人民如何？\n\n＂如果抗議示威要受罰的話，那逼人上街抗議示威的人又該是甚麼罪呢？＂也許示威抗議\n\
  看起來無法改變這個世界，鎮宇又繼續說道： ＂雞蛋再怎麼脆弱也是個生命，岩石再怎\n麼堅硬還是砂石，岩石雖然堅硬，但有天會化成沙塵，雞蛋雖然脆弱，卻可以孕育出生命\n\
  ＂\n\n這個雞蛋岩石理論，就算是在酒醉的宋佑碩，也深深地落印在心裡~\n\n\n將心比心的同理心 促使走上人權民主之路\n\n然而，萬萬沒想到，有天餐廳老闆娘的兒子鎮宇卻消失不見，\n\
  \n於是老闆娘前來苦苦哀求宋佑碩的幫忙，宋佑碩於是委請同事調查此次事件～\n\n在同夥人調查後，發現老闆娘的兒子鎮宇居然是捲入一場有關於共產黨的國安法案子【釜\n\
  山讀書會】，勸阻宋佑碩不要碰，只要去賺我們要賺的錢就好，尤其此時有大企業主＂海\n東建設＂前來一起合作，是個不可多得的賺錢好機會！\n\n在當時而言，國安法的案子，律師都鮮少願意碰觸，不論當時或是現在的氛圍，無疑是個\n\
  小市民在對抗整個國家資源的案件，先不論輸贏，在過程上彼此擁有的資源就相差甚鉅！\n打得很辛苦是必然的事....\n\n陷於是要賺錢或是要正義的兩難，看到了老闆娘為自己兒子奔波的疲憊和精神上的折磨，\n\
  以及自己所擁有的家庭，妻子及孩子，當他看到鎮宇被刑求的身軀，心中疑慮徹底地擊碎\n...\n\n發生在別人身上的事情，有一天或許也會發生在我的孩子身上，而我要讓我的孩子未來活\n\
  在這樣的環境裡嗎？\n\n同夥人認同，但表示：＂我會送我的孩子去國外讀書～＂這是一個消極的解決方法，\n\n如果自己的國家都無法愛護，每個人只是埋怨我們所處的環境，連自己國家都無法改善及\n\
  盡份心力，實在無法想像，去到別人國度，憑甚麼要外國人來善待你這個外來的移民者，\n而享受現成的利益！？如果可以，能待在自己的國家不是最幸福的嗎？\n\n去國外是開自己的眼界，但想要外國人把自己當成同一份子，歧視絕對不是靠取得國籍就\n\
  可以消弭！\n\n\n\n＂我們這種人多值得你感謝！＂就是因為有我們的存在，才有你們安穩的日子可過！\n\n飾演從軍方調到警察署的這個角色，個人認為他演的真是入木三分，我看了都好想打他！\n\
  ！ＸＤ\n\n這樣的人頭上扣上了愛國的帽子，就認為自己是為了愛國而做，也就是合理化自己所有已\n經非常理的行為而不自知，\n\n透過刑求來滿足自己內心所編設的劇本，［釜山讀書會］或許是一種當權的殺雞儆猴，也\n\
  或許是害怕自己的政權不保，在在顯示出當權者的害怕及狹隘，這樣的過程，是一種時代\n上的悲劇，當刑求他人在法庭上，被人同樣對待的不停質問，\n\n我看到了律師宋佑碩及他眼中，似乎都堆起了激動的眼淚...\n\
  \n誰愛國? 誰又不愛國呢?\n\n\n\n我無法認同窮人，沒有民主和自由！＂民主＂是中產階級爭取來的！-（宋佑碩）\n\n專制獨裁終有它無法避免的死角，畢竟個人的思維有限，\n\
  \n民主輪替的法治則是為這些專擅的獨裁者找到一個出口，而免於顛沛輪替的古時朝政～\n\n只是，當權力握在手上的時候，很少有掌權者意識到這點~\n\n有權有勢有財有名，才是在這世上對於人性最大的考驗～\n\
  \n總使走上人權律師一途的宋佑碩，在法院上激情演出，被其他律師及檢方，還有庭上法官\n視為是一種白目的行為，\n\n刑求下的自白到羅織罪名，認為只要丟出＂協商刑期＂就已是莫大的恩惠，甚至還被同座\n\
  的律師說＂人生就是要掌握時機！＂\n\n一個人奮力地孤軍對戰，雖是辛苦孤獨，但一個人的力量也是一種改變的力量！\n\n影末，當宋佑碩為了維護民主的死者追悼會而被逮捕（1987），在釜山的律師有144名，\n\
  有99名出席挺他，\n\n卻有一種唱名的溫柔暖流莫名地進了心裡．．．\n\n\n\n結論：\n\n1. 劇中多場在法庭上的辯論十分精采，是其中非常值得一看的點，尤其欲加之罪何患無\n\
  辭，對於檢方或法官方面對於學生所念的書，認為是思想上的犯罪，更是以子之矛攻子之\n盾！\n\n2.擅於用行為代替語言來顯示人的個性，在這部韓片嶄露無遺，像是吃飯的小動作，明顯\n\
  地讓人感受到個性急的特點，另外像是＂絕對不放棄！＂除了之前的小故事，刻在房子的\n牆上字跡，化妝化一半的女人，還有未拿到無罪時，吃飯時咬牙切齒的神情，刻劃人性相\n\
  當入神！\n\n3.導演姜炯哲是編劇，也是導演，第一次就有這樣的成績，真的挺厲害！回歸到韓國，能\n夠讓這樣真實的故事改編搬上大銀幕，就十分讓人驚豔了！\n\n\
  4.宋康昊的演技，依然是一個大賣點，從他的《殺人回憶》到《漢江怪物》，今年還有看\n過他的另一部【觀相】，【觀相大師：滅王風暴】，都是非常有水準的電影！在韓影\n\
  上都是屬於經典之作！近期另一部《末日列車》，更是有許多愛影同好跟我推薦～\n\n--\nSent from my Android\n\n--"
