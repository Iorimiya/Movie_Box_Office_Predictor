url: https://www.ptt.cc/bbs/movie/M.1415273347.A.A1B.html
title: '[大好雷] 常在我心：《正義辯護人》'
content: '（已發表於個人網誌。內有引文，建議閱讀無音樂網誌好讀版：）

















  　　這是一段令人淚流不止的故事。尤其在太陽花後、香港佔中訴求真普選的現在，映照

  東亞諸國地方近百年追求民主自由的歷史，劇中宋佑碩的覺醒和奮鬥越是不畏強權結構屢

  敗屢戰，為普世人權拚搏的正義之心就越令觀眾熱血沸騰。之於我們的國家和時代，這也

  許是一部最重要的電影，應該廣為人知，以繼承那些嘗試推倒封建高牆的高潔靈魂；或至

  少，變得不再那麼容易被權勢份子操弄以淺薄的意識形態、作為既得利益者的無知工具，

  轉而能夠反自深思：為什麼我們必須挺身而出？




  矚目：大韓民國的電影工業



  　　綜觀國際重要影展，比起臺灣、日本、甚或是中國，同在東亞地區的韓國，其電影藝

  術受到世界肯認的時間相對較晚。但近十五年來，作為後起之秀的朝鮮影藝表現確是逐漸

  凌駕於諸鄰國之上。他們顯然掌握到美感表達和大眾敘事的平衡點，加上韓人對母國產業

  的普遍支持，每每總能製作出叫好叫座的影視作品。雖然當中有複製好萊塢傳銷成功模式

  的影子（財閥金控、明星制度……），富有地方社會文史元素的取材，讓韓國電影終究發

  展出自己的強烈特色。


  　　南韓本土大眾電影能被成功經營起來，有其多方面的因素：他們具備大加支持影視工

  業發展的政府與財團、對多樣化主題勇於嘗試的創作動力，甚至於，觀眾對各類題材接受

  之廣，恐怕同是主因之一。在他們高票房紀錄上，不僅止於情節訴求軟性的通俗愛情劇、

  動作電影、特效片、大眾喜劇而已，硬派的社會寫實劇經常赫然可見。即便是劃為限制級

  、毫無娛樂元素的沈重《熔爐》，都可以有四百六十萬餘人次進院觀賞。在我國，不知道

  有沒有人也願意，將陳昭如那描寫相仿悲劇的《沉默：台灣某特教學校集體性侵事件》，

  改編成為電影，以試圖引起更多不平的關切？



  　　社會關懷精神的發揚光大，是南韓電影最重要的收穫。當我們的國產大眾電影，絕大

  多數還以都會愛情或市井情境喜劇為號召，韓國電影人已不斷透過托爾斯泰及狄更斯的悲

  憫目光，將社會種種應當廣泛討論及關切的主題搬上大螢幕，試圖讓民眾更加認識自己的

  國家和歷史。我們的確有過《悲情城市》或《賽德克．巴萊》這種兼具反思力道及賣座票

  房的本土製作，畢竟還是太少。鐘孟宏、戴立忍應頂多只有勉強回本；至於蔡明亮？臺灣

  大眾根本不買他的帳；更別說早前楊德昌，完全就放棄了臺灣市場。也許他們的敘事手法

  較少通俗性的戲劇化；也許我們需要更刺激、惹人側目的時事話題，透過引發獵奇心理的

  方式提起大眾關注。南朝鮮社會派電影能夠有效大眾化，大抵正由來於此。


  　　最早是1999年，姜帝圭的《魚》（另譯《生死諜變》）以南北韓諜對諜的軍事情報電

  影，引發群眾對南北韓情勢的重新關切。繼之而來的是朴贊郁《共同警戒區JSA》、康祐

  碩《實尾島風雲》，和同為姜帝圭執導的《太極旗－生死兄弟》。期間，以社會案件為楔

  ，寫實描繪世情百態、輔以當代政經史況的犯罪電影更如雨後春筍產生。朴贊郁的《復仇

  》、奉俊昊《殺人回憶》、朴鎮杓《原聲追兇》、羅宏鎮《追擊者》、梁益俊《窒息暴戾

  》，和前面提到黃東赫的《熔爐》等，由於不少素材是取自近二十年來實際發生過的犯罪

  事件（其中如《殺人回憶》和《原聲追兇》，還都是震驚一時的懸案），充分的話題性和

  歷史的共時性讓他們得以有效打入大眾。此部份要歸功於禁忌議題的吸引力。當初侯孝賢

  《悲情城市》之票房豐碩，想來也和其解嚴後不久即勇於挑戰二二八主題有關（儘管如此

  ，他仍會在金馬獎上被國民黨背景的評審給搞掉的──在那個鄭南榕還必須自焚明志、死

  諫捍衛言論自由的年代）。



  　　我相信，故事以禁忌、當局多隱晦避談的歷史或新聞議題為餌，有助於大眾進入、關

  心我們身處的社會（儘管最初可能只是廉價的好奇心）。試想像一下：如果我們嘗試將美

  麗島大審改編成電影，一介貧寒出身的人權律師陳水扁等人，為橫遭死劫的自由鬥士施明

  德等辯護，藉由獨裁的國家機器與捍衛民主的小人物之間相互交鋒對諜，彰顯自由的可貴

  ──會是部多麼讓人熱血沸騰的法庭劇！（姑且不論日後陳水扁從大位下野以來，將因為

  政治清算而多麼狼狽）


  　　《正義辯護人》，就是這樣的一個故事。




  表彰：守護自由民主的義士



  　　登場人名雖然經過變調，《正義辯護人》明顯是以南韓前總統盧武鉉之半生為本。本

  劇刻劃軍政極權時代下的人權律師，如何為遭陷叛國冤屈的讀書會學生們奔走請命，在那

  毫無公道法理、只有協商和利益輸送的不義法庭上以小搏大，終究成為國家日後開創民主

  的礎石。加上於此之前的光州事件，和在那之後的六月民主運動，風起雲湧的前仆後繼，

  直到1987年、臺灣解除戒嚴同一年，才得以總統直接民選方式，進展為完全民主的「第六

  共和國」；這些，都和我們國家的民主發展歷程如此類似……。


  　　純然從電影故事的剪裁技巧來看，本劇作應該還可以再更為洗練、使情節集中發揮張

  力。導演選擇以傳統順敘方式，由主角宋佑碩（影射盧武鉉）執業不動產經紀律師開始，

  間中插敘他一邊做建築工、一邊苦讀考上司法特考力爭上游的往事，雖然有效加深觀眾對

  於人物的情感認同，過程則稍嫌冗繁，場景轉換間的節奏可以再加快──這是我當下觀賞

  時的感受。


  　　但在看完電影後查找相關資料，才發現：嘿，這可是導演楊宇碩的大螢幕處女作啊！

  以出道作品而言，《正義辯護人》的完成度之高令人驚嘆。而且也可以理解導演透過主角

  的生活點滴，來引導大眾進入故事情境氛圍、同理角色心路轉折的意圖；前半稍微點綴的

  幽默橋段，更讓全片不致於顯得太過嚴肅沈重。而雖然我認為本作技術方面有少許改進空

  間，其實演出上的劇情推進已是四平八穩，特別在後半段法庭場景處理的非常出色。演員

  極具爆發力的演技可能要占一半功勞，嫻熟的場面調度和其中幾個長鏡頭的使用，同樣是

  強化影像力道的重要功臣。


  　　事實證明，楊宇碩的確成功同時照顧到普羅胃口和人文精神。《正義辯護人》在韓票

  房不僅突破千萬人次，成為南韓影史上導演處女作觀影人次最多的電影，更帶動盧武鉉相

  關著作的熱銷與討論，和面對群眾運動正當意義的反省。我無法確定本片就盧武鉉人物之

  刻劃，是否有略為溢美之嫌，至少其中彰顯對自由、民主、人權、法治等普世價值的渴求

  ，確實是世人至今仍力圖守護的信念。單憑於此，對存在民主逆流危機的我等諸國，這都

  是一堂必修的電影學分。


  　　更何況，本片還是由宋康昊所主演。




  演員：平凡外貌的非凡影帝



  　　宋康昊，只論外表，單眼皮瞇瞇眼加上一副圓臉，猛一看還以為這不過是個路邊麵攤

  隨處可見的大餅臉叔叔。但也許正因為他既沒有特出容貌，也缺乏明星氣質，才如同湯姆

  ．漢克斯一般，得以不被定型侷限，反而悠遊在各種角色扮演之間，以真實可信的人物詮

  釋，成就一代國民影帝的偉業。


  　　我們很難得看到一個如此全方位的演員，不論悲劇、正劇、喜劇、鬧劇、歷史劇、古

  裝劇、黑色電影等都能駕輕就熟，並同時獲得觀眾喜愛和專業影評肯定。硬要說宋康昊有

  什麼不足之處，恐怕就是他始終沒有無可取代的「代表性演出」。例如「鋼鐵人」系列如

  果換掉東尼……呃不，是小勞勃．道尼，又有誰能接替上陣，再次獲得觀眾肯定？只怕很

  難。同樣屬於國民影帝的湯姆．漢克斯，至少也有佛瑞斯特．甘這角色非他不可。宋康昊

  的演出經歷則幾乎沒有這種烙印。好的方面來講，觀眾可以毫無成見的因為他演出精妙而

  受劇情感染（經典的成見，例如：安東尼．霍普金斯自從《沉默的羔羊》以後，不管演什

  麼，都容易讓觀眾進電影院前聯想到驚悚片）；對於一位身負傑出表演方法的演員而言，

  沒有「非他不可」的代表作，好像又有一點小小的遺憾。


  　　──那都是過去的事了。我想《正義辯護人》絕對有資格堪稱宋康昊的代表性演出。

  法庭上，面對只想速審速決、超越憲法以逆謀罪名構陷純良的當權打手，宋佑碩慷慨陳辭

  、情理兼備，充分的事證和依法論法的態度，隨著對執政不公逐漸攀升的情緒，將他對於

  國家的期待和極權毀憲亂政的憤怒，激昂疾呼而出，強大的魄力在長鏡頭下一氣呵成，感

  人至深，直令觀者愴然涕下。「宋佑碩＝盧武鉉＝宋康昊」這種強烈印象已然成型。宋康

  昊朝向偉大演員之路更加邁進了一步。而我們，也得到一個發人深省、鼓舞自由信念的美

  麗故事。


  　　當然，美麗的故事，也有賴邪惡烘托才更顯芬芳。　　




  巨獸：惡性扭曲的愛國意識



  　　除了沆瀣一氣的法官和檢察官，主持搜捕、拷問的警官車東英，無疑是本劇最令人印

  象深刻的反派人物。在那常人不忍卒睹嚴刑逼供場面當中，車警官眉毛連動也不動，尚且

  極盡嘲諷之能事，玩弄他眼前所被不實指控的「赤色份子」們。我一度以為這就是個酷嗜

  虐待、以旁觀他人之痛苦為樂的變態狂，然而並非如此。車警官在刑訊過程中並未顯露快

  意、激情或憤怒等擴張情緒，純粹是義務式的、有效忠實去完成他逼供畫押的任務…（其

  中差異，可以《熔爐》中金民相飾演的朴老師為對照）。


  　　當他修理宋佑碩到一半時，一聽國歌響起就馬上立正行舉手禮，此舉完美說明了：他

  真的相信自己的所作所為完全出自愛國者之心！刑訊只是義務，暴力純為方法。全斗煥的

  軍事政變、光州鎮壓、獨裁統治，乃至於他當下執行的釜林讀書會構陷任務，都是為了存

  續大韓民國的安定而不得不為之。車警官卻沒有發現，自己根本是透過洗腦教育所成就、

  憎恨北朝鮮和共產思想的極端麥卡錫主義者。如同喬治・歐威爾《1984》所述，以製造共

  同敵人、製造對立來凝聚國民意識、分散群眾互信互助基礎、鞏固掌權勢力的手段，已經

  是極權者的老招。藉愛國之名陷以叛逆謀反，誣賴良善百姓，造成民間矛盾衝突，難道不

  都是為了轉移國民對不合法、不適任政權批判的注意力嗎？


  　　郭度沅十足生動演活了這狂信國粹主義的祕密警察。我卻很難真正去憎恨這樣的一個

  人：一個因為時代悲劇而被製造出來、除了虛偽的正義和盲目的愛國心之外別無所有的可

  悲怪物。時至今日，這類將某種意識形態（包括國粹、禮教、傳統觀念、宗教信仰等）無

  限上綱至基本自由人權之前的人士、團體，猶然所在多有。當他們在螢幕前同聲喟罵車警

  官反人類的暴行時，希望他們也能反省：自己秉持某種宗教觀點或黨派指導，對部分弱勢

  族群提出的攻擊批判，其實並不亞於車警官的殘酷──儘管這些人真的以為自己是為了國

  家社會好、為世界良善和平盡心盡力。別忘了：車警官也一樣。




  接下來……



  　　臺灣以及南韓，自從脫離軍權統治的民主化以來，已將近三十年。期間經過政權移轉

  上杭亭頓所謂的「雙流轉測試」（two-turnover test），似乎意味著我們的民主體制已

  然成熟。然而，附庸威權、利益至上的趨炎附勢者從未少過。香港佔中爭自由的辛酸，更

  悲哀反映出我們未來的可能命運。到那時，儘管個人之力僅區區綿薄，也希望能眾志成城

  。就算終局難以盡如人意，至少我們仍得以懷著信念，驕傲的活著或死去。就如同《熔爐

  》中女主角所言：「我們一路奮戰，不只為了要改變世界，更是為了不讓世界來改變我們

  。」


  　　接下來，就是我們的事了。





  --'
