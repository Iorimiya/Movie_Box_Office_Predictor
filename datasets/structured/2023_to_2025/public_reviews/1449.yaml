title: 'Fw: [問卦] 正義辯護人電影裡的吳達庶原型是文在寅嗎'
content: '作者: qwertgb (Red Velvet) 看板: Gossiping

  標題: [問卦] 正義辯護人電影裡的吳達庶原型是文在寅嗎

  時間: Wed May 10 02:18:41 2017


  吳達庶：朴冬豪，宋佑碩律師事務所事務長



  在電影裡是宋康昊(原型盧武鉉)的左右跟班



  最近看新聞才知道文在寅也跟盧武鉉開業過


  維基百科資料

  在通過律師考成為律師後，他與同為律師的故總統盧武鉉合作開業，律師事務所處理近乎

  全部在釜山的勞工及人權案件，他們因此成為著名的人權律師。[4]他們直到2009年盧武

  鉉去世前都一直是好友。



  因為電影裡只交代吳達庶去宋康昊事務所應徵

  然後宋康昊給一大筆錢就直接上班了


  基本上沒深入介紹他本身是不是律師??


  當時2013年上映時,文在寅也敗選了


  那請問吳達庶原型就是文在寅嗎?


  導演當初拍這部電影時不只讓人重新懷念盧武鉉


  是不是順便也在幫文在寅為下一次選舉宣傳???


  --'
