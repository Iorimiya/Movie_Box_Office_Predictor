url: https://www.ptt.cc/bbs/movie/M.1610557662.A.B83.html
title: '[討論] iTunes特價報 異星探索 / 正義辯護人 /'
content: '【 iTunes 特價報】

  異星探索 / 正義辯護人 / 辛巴達七航妖島

  －

  感謝 LINE 群友推薦，全面升級 4K Dolby Vision/Atmos 又有幕後花絮的

  《 V 怪客》加入中文字幕，而且還在特價！！快衝！


  －

  這禮拜的 NT$90 片很多，而且很多都第一次特價。

  好片壞片都有，但總是要看過才能好好評斷了。


  《異星探索》高達 90% 爛番茄評價，最近在《神力女超人 1984》演反派的

  「毒梟」佩德羅帕斯卡擔綱演出，透過科幻片探索人際關係與哲理。

  這讓我想到《2009 月球漫遊》以及《滅絕》，絕對不是單純的科幻片。

  －

  《正義辯護人》和《我只是個計程車司機》、《1987：黎明到來的那一天》

  都跟韓國的民主是件很有關係。之前也是各有時期特價過，

  這次輪到《正義辯護人》。宋康昊的演技真的沒話說。

  －

  以前華視演出時，讓小編記憶猶新的《辛巴達七航妖島》真的是超經典的冒險片。

  尤其獨眼巨人、超大怪鳥，小人和巨大定格拍攝的怪物同處畫面的奇觀，

  都讓人對這部 1958 年的電影嘖嘖稱奇。定格動畫大師雷哈利豪森真的是讓本部片

  成為不朽。

  －

  以上，也推一下全面升級 4K DV 的《2012》和《黑鷹計劃》。希望大家看片愉快！

  －

  未特別註明 畫質皆為 HD

  4K = 4K 畫質

  HDR = HDR 動態範圍支援

  DV = Dolby Vision 動態範圍

  －－－

