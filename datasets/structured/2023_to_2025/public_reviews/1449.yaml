url: https://www.ptt.cc/bbs/movie/M.1518279299.A.229.html
title: '[情報] Netflix 上架鄭雨盛 x《正義辯護人》導演新片《鋼鐵雨》 '
content: '之前一直想看的韓國電影《鋼鐵雨》上架 Netflix 了！


  由《正義辯護人》導演楊宇碩執導，《金權性內幕》鄭雨盛和《哭聲》郭度沅主演。


  Netflix 頁面劇情簡介：




  一名北韓間諜在國家發生軍事政變後，與南韓官員聯手參與機密行動，以避免韓戰爆發。






  ---


  《鋼鐵雨》去年底在韓國上映，是部叫好又叫座的商業片，根據過去新聞所寫：「在周末

  三天，《鋼鐵雨》共動員137萬8360名觀衆，該片僅用三天時間就突破百萬觀影大關的票房

  成績，更是比《國際市場》、《辯護人》、《七號房的禮物》這三部12月上映的千萬觀影

  作品提前一天突破了百萬觀影大關」不過沒多久後《與神同行》接續上映，光彩立馬就被

  搶走了，不過這部的口碑相當不錯，鄭雨盛的演技也受到讚譽，或許能成為明年韓國電影

  大獎的有利預備軍，導演的上一部《正義辯護人》也曾在青龍獎上拿到相當多大獎。


  這部之前台灣一直沒有傳要上映的消息，剛剛在 Variety 看到了影評才在去 IMDb 查了一

  下發現原來國際版權在 Netflix 上，在一查才發現原來去年秋季就有新聞表示這部跟《屍

  速》列車導演的新片《念力》都早早被 Netflix 買下發行權啊...！


  雖然沒有機會在大螢幕上看到，但至少比鄭雨盛上一部《阿修羅》好了，至少有地方可以

  看！


  --'
