url: https://www.ptt.cc/bbs/movie/M.1674661319.A.BC5.html
title: '[好微雷] 真實系毫無冷場的迫降危機'
content: '今天上映~ 早上有點意外去樂聲看第一場還有上百人

  剛說是斯巴達王在台灣的人氣真的很高嗎?

  儘管跟原本預料的有些不同 但最大優點是真實系

  而且劇本相當流暢 危機環環相扣 真的可以說是沒有冷場


  終於在初四後 想看娛樂大片的朋友看過水之道跟灌高後

  有了個應該不太會有人嫌的選擇


  最大的優點就是真的很擬真~ 從開頭的空中危機 再到後面的在地亂賊綁架

  或許都不是什麼新題材 但編導處理的真的並不誇張 卻又足夠緊張

  你真的很能身入其境去代入自己進入電影氛圍的想像

  (重點是雖然兩大主軸並不是太新鮮 過程的轉折充滿不確定感 所以還是刺激)


  前期在飛航危機時~ 很巨細靡遺(應該比我看過的這類型片都仔細)去描述

  一組機組員面對這般危機時要怎麼應對 很多專業導向的術語加深了真實感

  後期亂賊的強度 動機與作為 也都恰到好處 你真的會一度覺得是不是真實事件改編


  真實系還在演員表現 泰半可圈可點 從斯巴達王的英勇機長

  到雖然有懦弱一面但堅守崗位甚至克服恐懼的香港副機長

  再到同樣害怕卻盡忠職守的座艙長 每個人都演出該有的角色

  逃犯 傭兵 風險管理專家 航空公司資方 叛軍 旅客/人質也都恰如其分

  大家都有演的很煞有其事~ 更憑添了這彷彿是個真實事件的緊張感


  該打鬥 該爽的也有..............但這就是我一開始說的 跟原先想像不同的部分

  無腦進戲院原本預設的大概又是全面攻佔系列 最後斯巴達王一個幹掉全部神英雄

  但不是... 這部戲裡面他只是有訓練過體術的機長 就比常人強一些

  而且會害怕殺生 基本上不是個戰鬥力很強的人物~ 最激烈一戰差點就被打掛

  後面包括預告的囚犯與傭兵 才是真正會打的狠角色


  但除此之外 他的作為完全比英雄更英雄 你不會因為他不夠會打覺得不尊敬他

  基本上雖然路線有點不同~ 傑瑞德巴特勒不愧是銀幕硬漢專門戶!!


  不過難道因此動作就不夠爽 不夠好看嗎???

  只能說 其他角色補強了這一塊 最後一場亂賊包圍飛機的大戰相當精彩

  不僅緊張 正派這邊有個狙擊手爆幹帥! 這一段光看他開無雙就爽爆

  而且其實前半段沒什麼血腥~ 中後段亂賊進來後也變真實系

  砍殺開槍爆頭這些 都沒在跟你溫良恭儉讓的~ 憑添不少爽感


  而雖然飛航解圍的電影其實也不少~ 但這部最後的收尾解決危機方式

  其實也蠻意想不到~ 而且相當合理 這邊也把危機感描述的非常不錯

  一部電影能有夠帶入最後高潮的合格以上收尾的電影 就已經相當不容易了


  如果真要說 這部對我個人而言的小小瑕疵跟遺憾就是

  預告中也很強調這角色的囚犯--------------其實毫無動靜 就只是個剛好在機上的囚犯


  不是說他戲份跟角色不重要~ 問題就是相對預告可能有點引導

  以為他背後身分跟藏有不為人知影響劇情的背景故事跟設定


  嗯 只要這一點不要過多期待 這部片真的就是個順暢緊湊的爽片啦~


  --'
