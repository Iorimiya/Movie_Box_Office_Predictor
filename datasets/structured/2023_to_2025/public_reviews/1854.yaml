title: '[普雷] 《迫降危機》 還算OK的爽片'
content: '有點意外的不難看，但也沒有到非常好看的

  程度，無聊、不想動腦可以進場看看，不然

  等二輪即可。


  前段覺得滿刺激的，可惜中段迫降後刺激度

  打了折扣，只剩肉搏跟槍戰，而且反派頭目

  很讓我出戲，還以為是AD來客串。




  主角群光環太大了，主角方總共只死了4個

  2個還只是飛機亂流而死，2個還是自己犯傻

  被處決，其他人完全沒事，嚴格來說反派方

  致死命中率0%。


  不難看也沒有很好看，當一般爽片來看即可



  -----

  Sent from JPTT on my Xiaomi 21091116UG.


