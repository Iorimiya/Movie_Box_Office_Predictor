url: https://www.ptt.cc/bbs/movie/M.1675437833.A.960.html
title: '[微好雷] 迫降危機 不拖泥帶水的動作片'
content: '今天看了迫降危機，整體來說不錯看。


  先講讓我出戲的一個問題:


  電影編劇們，到底什麼時候才會搞懂，GPS不需要行動網路就可以運作!

  手機沒有網路訊號也可以收得到GPS!!!


  就算所有人的手機都沒有離線地圖，也可以取得經緯度座標。

  怎麼會有不知道在哪個島上這種事? 至少通電話時，可以回報座標位置給航空公司吧。


  好了，再來講優點:


  1. 劇情不拖泥帶水，沒有硬是把片長拖到兩小時，也沒有不必要的反轉。

  不像一堆電影喜歡演壞人變好人、友軍又變敵人，這部電影角色比較單純、比較合理。

  犯人就是個曾經誤入歧途的犯人、傭兵也沒有無故叛變。


  2. 槍戰音效很好。

  最後槍戰的場面，雖然很浮誇，但也很爽快。

  音效+視覺效果，可以感受到子彈飛過去的力道。


  3. 劇情雖然簡單，演員演得很用力。

  主角Gerard Butler演得好!緊要關頭對乘客喊話、以及跟機組人員道別，這兩幕很感人。

  不過反派角色我就沒什麼印象深刻，就是感覺很壞而已。


  整體而言，是一部還不錯的爽片~


  --

  原來如此'
