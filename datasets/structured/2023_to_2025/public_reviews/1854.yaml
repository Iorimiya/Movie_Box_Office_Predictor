url: https://www.ptt.cc/bbs/movie/M.1682833653.A.C39.html
title: '[好雷] 迫降危機 Plane, 2023'
content: '雷文防雷資訊頁


  迫降危機

  Plane

  2023美國電影




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  『★傑瑞德巴特勒主演 ★全新危機動作鉅片 航班緊急迫降在武裝份子佔據的島上，機長

  要如何成功救出乘客？』客機機長布羅迪（傑瑞德巴特勒 飾）在一次航行中因為遇到風

  暴，而不得不緊急迫降，結果卻意外降落在被武裝份子佔據的菲律賓霍洛島，機上乘客隨

  即遭到歹徒挾持，出於身為機長的責任感，布羅迪決定和機上移送的謀殺犯路易斯（麥克

  寇特 飾）合作，無論如何都要救出乘客並把他們平安送回家……。




  這部片是典型的災難動作娛樂片，男主快和最強老爸Liam Neeson並駕齊驅了。    （他

  們常見的影片劇設人設：有他們存在的地方都有大災難發生，等他們排除萬難去解救。）

  這片令我入戲，看得緊張及興奮，解救危機的一群硬漢角色及演員們，很棒。存在感小，

  但充份發揮吸睛功能的美女角色二位：扮演男主女兒Daniela的

  Haleigh Hekking，扮演飛機女乘客之一Brie Taylor的Lily Krug（上次注意到她是她主

  演的2022電影Shattered心碎效應）。劇情及角色都很喜歡。


  個人滿意度85分（滿分100）。


  以下有劇透。




  1.本片正是一般人所期待所預想的影片，這是一件好事。與熟悉男主角的動作片相差不大

  ，本片戲劇節奏感很好。Gerard Butler他常見人設的堅強勇猛，戰鬥高手硬漢 Mike Col

  ter（Luke Cage！）的加入，使這部電影成為真正可靠的動作二人組。這是一部緊張又輕

  鬆？的電影，所以，好好享受這部爆米花娛樂片吧。


  2.本片完全由熟悉的戲劇元素來構成，沒有任何開創性或原創元素。但是 Plane 能夠通

  過充分利用其演員和劇情連續緊張的設定，儘管情節在很大程度上，是可預測的和公式化

  的，但我感受到了殘酷行動和整個精神錯亂的人質情況，全片扣人心弦的緊張氛圍，導演

  的視覺焦點，始終在這個故事中的人和他們所感受到的恐懼上，促使我也相當入戲地欣賞

  了。


  3.導演Jean-Fran蔞is Richet明智地安排了影片的步調，讓角色有切實的時間來喘息呼吸

  ，我欣賞Butler扮演Brodie Terrance, Colter扮演Louis Gaspare他們兩個一起構成了一

  個可愛有力量的二人組，並且沒有在融洽關係中過度矯情。同樣值得一提的是Tony Goldw

  yn扮演的危機解決專家Scarsdale，他的劇設人設令人印象深刻且討喜，充分發揮援助功

  能，令人安心。而Scarsdale派出的傭兵部隊成員們，戰鬥能力強悍勇猛，人設劇設看地

  舒暢。飛機工作人員們有幾位表現出人的自然恐懼反應，而副機長Samuel Dele(Yoson An

  )和空姐首席Bonnie Lane( Daniella Pineda)都表現討喜。本片在瘋狂動作戲的爆發之間

  ，吸收正在發生的事情。導演讓演員們有時間用長鏡頭來表現他們的角色應該感受到的情

  感，這方面令這片精彩出色。

  雖然我可能不會再看本片，並且可能很快就會忘記本片，但這是一部超乎我預期的娛樂性

  動作片，當然值得一看。



  迫降危機

  Plane

  美國電影


  --'
