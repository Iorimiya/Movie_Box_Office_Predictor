title: '[普好雷] 迫降危機 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




























  我其實在想到底是好雷還是普雷


  這是一部沒有驚喜

  沒有太多曲折的電影


  尤其當殺人犯叫機長可以出來了，唯一懸疑點也沒了

  第一通電話沒通，可是第二通訊息有給出去

  偷襲過程一切順利


  武打設計沒有，就是肉搏

  槍開很多，不過就是一直射


  說真的，這是一部不會一定要看或推薦人去看的電影



  可是給普雷，這觀影過程我沒有任何不耐煩

  沒有任何分神，一不注意，一百多分鐘就過去了

  我有被娛樂到


  很難給評價啊


  大概就像米其林一星

  真的很想看電影，不知道看什麼就看他

  但也不用特別跑去看




  --


  電影。劍雨(誤)'
