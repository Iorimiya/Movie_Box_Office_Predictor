title: '[普好雷] 泥娃娃 '
content: '雷點不多但還是防一下



























  整體敘事流暢


  但作為一個剛結束新手爸爸的角度來看


  前半段很多台詞弄得像是孕前衛教片


  一開始男主拿回來的晚餐紙袋以為是孕婦最愛的麥當勞


  結果他媽是生魚片


  一直塑造新手爸爸的菜味跟孕婦的雷點


  後續劇情稍有挽回


  恐怖度不及咒 基本都是大家都很熟悉的恐怖片拍攝手法


  不過噁心的部分蠻不錯的，給過





  最後讓我最疑惑的


  都在窯裡找到女鬼屍身了























  媽的為民哥人咧? 什麼態度嗎


  --'
