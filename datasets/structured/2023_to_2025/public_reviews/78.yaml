url: https://www.ptt.cc/bbs/movie/M.1760072750.A.CCB.html
title: '[微好微雷] 泥娃娃'
content: '先說優點，這部是很有企圖心的商業電影，有當年紅衣小女孩的既視感，故事架構也完整（註1）

  雖故事主線是陳舊的溫情路線，加上商業電影常見的驅魔套路，有放進新的元素，不會顯多餘也算有點創意

  算是久違的台灣具水平的恐怖商業電影（我個人這方面近10年片單只有咒、女鬼橋1、紅衣1、紅衣3、粽邪1&2和屍億）


  再來說點小瑕疵


  1、它故事的步調沒有處理很好，一開始陳為民探勘出事那段氛圍處理的都不錯，

  但咒物帶回來後應該放慢下來，從每個人生活上一點點不對勁慢慢帶出邪門的感覺，這邊太多JS+尖叫不是很必要


  2、走家庭親情路線根本就是台灣電影的常態了

  我是有被感動到，只是可能女主角隨時乾乾淨淨的漂亮臉龐讓我有點出戲，應該是可以再放開些




  註1、最後的彩蛋有加分，我看到家屬同意授權遊戲公司那段有點出戲，想說怎麼可能這麼做，這根本消費自己死去的家人


  還有為什麼大肚子還跑去挖墳，後面看到郭雪芙（我本來以為那位是雪寶？）才知道怎麼回事，算是故事有串連起來



  不錯啦 這麼多年了 總算又出了一部及格的商業恐怖片 可以去看看


  -----

  Sent from JPTT on my iPad


  --'
