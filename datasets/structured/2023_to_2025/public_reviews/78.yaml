url: https://www.ptt.cc/bbs/movie/M.1760375242.A.1A5.html
title: '[雷] 泥娃娃觀後感之台男悲歌'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  首先這部電影我覺得劇情有連貫，不會很雜亂或是太不通順，認為是不至於好看到要重刷或

  是推薦朋友看，但也不會覺得看了浪費錢，可以看！


  但是有些地方真的是勾起我的既視感或者覺得不太真實的點，想要吐嘈一下




  1.開頭掃描房子內部時，阿義被鐵架砸，那個薄鐵架感覺壓下來了不起黑青或痛而已，結果

  血瞬間流成那樣是不是太誇張...




  2.外包攝影師（陳為民？）看到阿義流血成那樣，要嘛是嚇到驚慌失措跑掉，要嘛想趕快救

  人，結果開口就講一句：阿義你流好多血喔！！...


  是在開玩笑嗎哈哈真實狀況哪可能講出這台詞




  3.阿義回公司上樓，樓梯流了一堆血，公司沒人覺得出大事了嗎？




  4.女主角真的把一部分（大部分？）的台灣女生個性演的淋漓盡致，心有戚戚焉，因為她真

  的超煩人，煩到我可以聯想到現實中的一些人。


  “不是陪我們，是我們一起”，這台詞真的煩，感覺就是生活中當男生跟女生說：“老婆你

  今天身體不舒服，趕快去休息，碗我幫你洗就好。 ”

  然後她就會回說，不是你幫我洗，洗碗不是女生的義務


  乾~超煩，男生大部分就是大直男，只是想表達體貼結果要被挑語病潑冷水，破壞氣氛==


  這種女的感覺~~到處都是~~地雷！！


  明明是自己毛一堆，自己想抱怨還要用第三人稱推給小籠包，小籠包何其無辜，什麼你嚇到

  小籠包了~小籠包覺得怎樣怎樣的


  然後動不動就是各種鬧脾氣，然後男生必須要一直道歉道歉是我錯了


  最後面封印惡鬼的緊要關頭，時間都來不及了，還要一直吵救小的救小的，救小的代表不能

  封小孩，所以意思是要封你嗎，封了你小孩也沒辦法生啊，也還是沒辦法救小的啊，最後搞

  到台男要犧牲自己


  然後男主犧牲被附身，女主角只會又哭又叫，跟坐在副駕遇到事情用叫的女生一樣，沒有實

  質作為。





  結論：


  楊祐寧飾演的就是感情生活中脾氣好又卑微可憐的台男


  總之這部片沒有到很恐怖，因為被女主的人設煩到了，所以沒辦法好好沉浸在恐怖氛圍中




  --'
