url: https://www.ptt.cc/bbs/movie/M.1761939233.A.E81.html
title: '[好雷] 泥娃娃'
content: '看版上對於這部的評價普遍不太好


  但我願意給這部一個好雷


  不是說整部都很優秀


  先說缺點吧


  1.太多JS的方式去製造爆點


  2.裡面好像沒法律一樣，陳為民有老婆欸，而且是十週年紀念日當天失蹤，卻完全就是一個

  帶劇情的工具，後面主角也一樣，他們去兇案現場找到屍體都不會有法律問題


  3.主角老婆自殘成這個樣子，胸口那道傷口應該最嚴重，但是好像根本沒有住院，也沒有被

  關切。


  反正很多強行降智的部分


  但我給好雷是因為真的蠻久沒有片有類似的恐怖點


  我喜歡那種 很悖論 很不合常理讓人發自內心害怕的橋段


  像是女主晚上起來喝水的時候 監視器男主在說話


  一開門卻人在睡覺，但監視器持續說話，這段讓我真的起雞皮疙瘩


  雖然後面很可惜的繼續變成JS，但是如果能營造更多這種發自內心的噁心感我覺得很棒


  希望國片可以多朝這種方式來處理，這部前面在鋪說要保孩子的那個flag也有一點太刻意


  更何況那個情況保孩子，媽媽沒了孩子不也是沒了，其實還是不太合理


  也希望版友可以多推推我有沒有類似這種恐怖點的電影，泰國跟歐美的恐怖片好像也沒什麼

  看到這種類似的嚇人方式


  頂多就是 「好像是」厲嬰宅，我也不確定，有一段在樓梯的黑暗處伸出一雙手拍手的橋段





  --'
