url: https://www.ptt.cc/bbs/movie/M.1760330529.A.B6B.html
title: '[好雷] 生活化恐怖片 進場體驗不錯的佳作'
content: '略文長



  我個人觀影體驗好的電影 都會有四個評級


  神作(鬼影)>優作(咒/哭聲)>佳作(泥娃娃)>良作


  對我來說 之前的恐怖片咒-大約到優作的程度


  泥娃娃是個底子很好的恐怖片 但很多可惜的地方只讓它到佳作


  可我個人覺得佳作就值得進場 值回票價了


  這邊來進行簡單心得分享 (以下有雷)




  泥娃娃這部片子要說底子好的原因


  就是它電影的主旋律都有抓住


  很多良作以下的恐怖爛片基本上沒主旋律可言


  基底單純就是用恐怖故事或描繪一個愛恨情仇的厲鬼


  以故事或厲鬼本身盡可能的技巧性嚇觀眾


  這樣的電影 加分面就純看導演嚇人技巧以及演員表現

  (有些導演為了彌補技巧不足 就會刻意安排重口味情節)


  觀眾看完了 只會對別出心裁的操作或演員表現有記憶點


  然後就沒了


  無論有沒有"嚇"到觀眾 觀眾都沒有帶著"東西"走



  泥娃娃會被我評價是好電影


  就是因為它主旋律明確且貫徹頭尾:備孕階段的焦慮夫妻生活


  它整個格局扎根在這個框架裡面時


  生活面有交會的觀眾深感共鳴

  (不只懷孕的年輕伴侶 連有打算生孩子的情侶/新婚夫妻都會有感覺)


  男/女主角面對的生活困境是生活角色階段的轉換以及苦難

  (男方:沒注意孕婦不能吃生的 滿腦子憂慮如何賺錢應付開銷 拔掉模擬娃娃電池偷懶)

  (女方:放棄去羅馬的機會犧牲事業發展  懷孕賀爾蒙與生理上的各種磨難)


  就連始作俑者女藝術家的背景故事也是因為為了藝術不擇手段

  (挺著大肚子也要去挖無名墳墓的屍土做藝術品 根本沒把自己當孕婦)

  結果產下死胎時才醒悟悲痛欲絕自己對於自己孩子的漠視


  精神大暴走後用死胎做了泥娃娃還連同自己一起燒了想永遠在一起


  種種執念帶起了後續恐怖故事的根因


  最終男主角帶了不乾淨的泥娃娃回家展開一系列災難


  以上這些都還只是電影的背景


  接著在電影之中 導演很有技巧的將生活層面的東西都融進恐怖劇情裡


  原本給老公練習帶孩子的模擬娃娃


  為了讓孕婦有好的環境體驗的空調


  為了在職場也能注意家裡動靜的AI追蹤視訊機


  通通都成為合情合理的嚇人元素


  這一切的順理成章會讓共鳴感強的人很有代入感


  重點是都很生活化(VR也是) 觀眾都能很直觀的理解 能理解就很好體會


  最後演員表現都很不錯 尤其是阿生角色夠有張力以及魅力



  以上種種讓泥娃娃這部電影有很好的底子 所以好評率高是很自然的


  接下來說兩個缺點


  也就是這部電影無法被我覺得是優作的部分


  1-罐頭驚悚太多


  電影確實太多老套的:慢慢轉頭 準備被嚇的背景音效高升環節


  對高中生可能很棒 但對看過很多鬼片的成年人來說真的回很不耐煩跟沒創意


  2-角色進場失當導致劇情單調


  整部電影前半場幾乎全靠男女夫妻在撐場


  因 為 根 本 沒 有 其 他 角 色 有 所 著 墨


  先說我覺得男女主角的情節都是OK的


  但問題是只有男女主角的情節 其他?沒了(郭雪芙也是走一個過場而已)


  這導致電影前半段 就是男主角路線 女主角路線 兩邊互切


  女主角那邊就擺明要恐怖起來了 男主角這邊則太溫吞情節


  然後反覆切換 實在乏味到不行 原因就是除了男女主角以外其他都是蜻蜓點水


  對我來說 這部電影真正開始好看起來 是阿生出場開始


  終於有好的支線展開(但份量也很少) 電影的分數也開始拉起來


  但電影都已經後半場了 分數拉到後面魔王戰打完也就只有佳作可言


  實在可惜



  主要很傷的缺點就這兩點


  其他情節邏輯小瑕疵的地方我都覺得還好

  (比如說藝術家妥妥的就是大殺四方 結果警察偵辦還可以導向男家長)


  而這部佳作很好的地方是有拓展成為系列作的可能性


  因為阿生這個角色描繪得很好 魅力也夠


  以及最重要的 阿生要收集的符咒還少了幾張


  我很看好出續集


  但個人是覺得男女主角的情節應該停在這一集


  續集應該要有新的主題去讓阿生收符咒 這樣才能很健康的讓系列發展下去



  PS:我是覺得新婚夫妻無論有沒有要生小孩的都可以看一下


  多多少少會有伴侶互動上的感觸 很棒


  --

  令狐沖哈哈一笑，說道：「原來如此。東方不敗是怕了我們三人的武功劍術，因此

  布下了這個圈套。只要我們砍下了自己右臂，使不了兵刃，他便高枕無憂了。」賈布道：

  「高枕無憂倒不見得。任我行少了公子這樣一位強援，那便勢孤力弱得多了。」令狐沖道

  ：「閣下說話倒坦率得很。」賈布道：「在下是真小人。」他提高嗓子說道：「方丈大師

  ，掌門道長，兩位是寧可捨卻一臂呢，還是甘願把性命拚在這裡？」

  令狐沖思量之間，正要答話，只聽方證大師與沖虛道長大怒撲上前去：「大膽劣徒！」


  --'
