title: '[普雷] 泥娃娃'
content: '雷文防雷資訊頁

  有雷 慎入



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~











  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  劇情普通

  用屍土做偶這原素太早破梗

  導致後面沒什麼期待感

  對鬼的刻畫比較少滿可惜的


  可以理解想創造不同風格的台式法師

  但阿生台詞+演技真的有夠尬…..

  （人面魚的鄭人碩 帥慘）


  鬼的動畫感太重 不太可怕

  而且不知道是我老了還怎樣

  戲中好幾幕鬼都還沒看清楚鏡頭就轉走了

  欸欸欸 我…我還沒被嚇到

  鏡頭回來一下好嗎


  最後公司送來VR機器那幕我笑出來

  你們會不會太地獄啊啊啊啊

  把遊戲成品送來給慕華玩喔？

  結果原來是旭川之前力推的企劃（？）


  整體普通

  花兩張票治失眠殺時間啃爆米花可以接受




  -----

  Sent from JPTT on my iPhone


  --'
