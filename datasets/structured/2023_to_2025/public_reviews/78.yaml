title: '[普無雷]泥娃娃 '
content: '唔


  要簡單來說的話


  就大概是看起來花了不少錢和時間和心力生出來的，還算恐怖片的恐怖片吧？



  不至於到不能看，但就好像有種吃了很多東西但留不下太多印象的感覺


  科技的應用上還算有梗？


  但其他部分還是有不少生硬的感覺



  個人內心排名大概在


  咒>>(無法超越的牆)>>紅衣小女孩系列>泥娃娃>粽邪系列


  支持國片鬼片的話還算可以看



  然後還是要抱怨下，最近國片到底是有多愛在後半段穿插一個乾乾淨淨的場景裡面人物泛著白光笑著回憶殺


  的灑狗血溫馨橋段啦？我從警匪片懸疑片動作片看到鬼片全部都這樣玩耶？到底是誰教的啦很拖台錢又拖戲耶!!


  --'
