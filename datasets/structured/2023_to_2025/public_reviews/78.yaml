title: '[  雷] 泥娃娃'
content: '昨天晚上要收假了，

  來看看最近有什麼電影，

  就選了泥娃娃這篇，

  全片可以很放鬆看，

  因為驚悚或血腥的畫面要出來之前，

  都會有些前置作業，

  你會知道下一個畫面就是你不太能接受的，

  此時可以閉上眼睛亦或是將眼睛移開畫面，

  聽聲音其實也知道接下來會發生什麼事，

  恩，所以全程是看得很輕鬆！

  剛好讓我回到可以收假上班的狀態。


  片中在講解符咒上面的字和排版，

  可以讓他顯示出他該有的功效時，

  這邊我一開始看了挺入迷的，

  可惜這裡沒有幾分鐘，

  這邊應該是第一次國片講解，

  如何用符咒封厲鬼吧？

  是有讓我耳目一新。

  我在這其實有在想，

  那愛情、功名和保平安的符又是怎麼規劃的呢？


  全片普雷，因為很少看鬼片，

  也不知道如何下好雷，

  是看了有什麼收穫嗎？

  還是看完之後有餘勁，

  晚上睡覺時會惴惴不安，

  想找些心靈上的慰藉呢？

  不管怎樣，就先下普雷吧！

  ----

  Sent from  on my iPhone 12 Pro


  --'
