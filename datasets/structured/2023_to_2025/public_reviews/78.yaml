url: https://www.ptt.cc/bbs/movie/M.1760173097.A.797.html
title: '[負雷] 泥娃娃'
content: '本身很抗拒看國片的鬼片


  因為被雷了無數次


  這次看到《泥娃娃》在網路上被吹的像神作一樣


  說是既《咒》之後最好看的鬼片


  甚至還有人說看完已經去收驚3次了


  所以就打破好久沒看國片的原則跟朋友來試膽


  但看完真的很失望！！


  我覺得不知道是演員的演技還是台詞的問題


  我就是會莫名出戲！！


  而且我朋友標準其實就已經很低了


  平常我覺得恐怖片不好看的話 他們還會打圓場說還不錯、還行、沒那麼差吧 之類的


  但這部看完出影廳之後


  我實在無語到不行 但又不好意思說不好看


  結果我朋友直接先很委婉的主動開口說「是不是國外的恐怖片比較ok」


  我才覺得好像不是又是我有問題了！

























  —————————小心有雷—————————


  我第一個是覺得演員的台詞都好尬


  而且從頭到尾就是那些非常過時的嚇人手法


  但就也不怎麼恐怖 而且還帶有一種為嚇而嚇的刻意感


  前大半段完全沒什麼爆點可言


  就是疑似快要有鬼出現的時候


  人人開始出現恐怖片招牌動作：慢動作、慢慢轉頭


  就感覺是在拖時間罷了！！


  重點是現在的鬼片已經很少出現這種最古老的招牌動作了


  想不到這次看到了！！


  而且連特效都是那種台灣類戲劇（藍色水玲瓏）的那種特效


  而且到底為什麼阿生驅魔驅到一半的時候


  女主角醒來就可以很像很知道全程狀況一樣的說「先救寶寶」？



  而且為什麼她醒來後就可以知道她丈夫被封印後會死掉？


  這些都沒人告訴過她啊！！


  前面確實有鋪梗


  但這6天下來她的精神根本就是處在著魔的狀況


  恢復意識後第一句話說「發生什麼事情了」還比較合乎邏輯！


  讓我覺得很多台詞都好妙


  為了順利銜接不影響驅魔進度一些BUG都不用管了







  這部片比《厲陰宅：最終聖事》還難看...


  厲陰宅4還有騙到我眼淚


  這部不但沒Get到任何覺得悲傷的點


  而且就只有一幕被實境畫面突如其來的鬼嚇到


  其餘部分都讓我感到沉悶、昏昏欲睡


  對我這種常看鬼片的人來說


  這部確實很好睡XDD





  最後一次看的國片是《女鬼橋2》


  謝謝這部國片讓我再次入坑又再次退坑！！


  唯一粽邪系列的《粽邪4》還是會去捧場



  544



  --

  我也超無感，原本沒在名單裡，本來這個月只打算要看闇黑電話2和鬼聲泣3！

  我以為大家都覺得很好看 但我不想違背良心XD

  因為我不只侷限國片，以近幾年只看國外恐怖片而言，這部在國際水準的表現，我覺得算

  差！還好沒看過更雷的，不然真的會很躁

  其實我大部分都會先看評價

  我看預告也完全無感 但有先看評價 可能這種東西就真的很主觀

  厲陰宅4還太好看嗎 我覺得騙情懷的XD

  那部至少劇情順，雖然硬凹但都有解釋，而且最基本的鬼怪畫面都給的很大方！但這部想

  期待鬼，但基本上都混入感情戲，然後隨時隨地都在看每個人重複表演「慢動作轉身」，

  苦等老半天等到轉完身去看，結果一個影子也沒有！感覺就一直在故弄玄虛吊人胃口拖戲

  騙觀眾而已！

  真的覺得恐怖片注入愛情戲就是ㄧ大致命傷，不但失去許多原有的試膽時刻，如果愛情拍

  的又感動不了人的話，根本就是兩敗俱傷。

  省起來去看下週的闇黑電話2

  原來還有這樣！我以為文章有出現贊助的才是打廣告

  也沒有喔！就兩部難看作品互相評比XD'
