url: https://www.ptt.cc/bbs/movie/M.1759985567.A.B47.html
title: '[好雷] 泥娃娃'
content: '剛在親親看完了,會送符咒.留言區有照片

  看過預告就知這會是附身跟驅鬼的故事



  雷文防雷資訊頁






  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  首先說明這首歌

  是在1968年由鄧麗君演唱的


  故事開場,鬼王為民哥就領便當了

  楊祐寧因工作需要帶妮娃娃回家

  泥娃娃來自無人居住的房子

  在多年前發生屋主砍死全家,再自殺的慘案

  屋主妻子則找不到屍體,其妹郭雪芙一直想找出來


  泥娃娃的鬼魂原被封印,後被打破跑出來

  並附身於懷孕的蔡思韵,楊祐寧發現妻子不對勁

  找驅魔師張軒睿,他先暫時鎮住蔡思韵

  並用術式讓郭雪芙看到多年前的真相


  就是做泥偶的醫術家姊姊,懷孕後流產

  將死胎跟泥土混在一起做成泥娃娃,

  以土裡的鬼魂也在內

  她被附身並殺死全家,清醒後將泥娃娃畫咒語封印

  自己跟泥娃娃在燒窯機內被燒死...


  真相大白後,張軒睿跟楊祐寧去找屍體跟缺失的咒語

  張軒睿自己進屋找屍體,楊祐寧則用VR找咒語

  找到後鬼魂跑去頭骨但因法力太大,頭骨碎裂

  鬼魂想藉蔡思韵肚內胎兒復活

  楊祐寧犧牲自己被附身及被封印

  最後蔡思韵用VR懷念昏迷的老公...


  彩蛋是張軒睿收藏的符咒還有三組沒收到,包括"還魂"

  此外還看到泥娃娃手上抱的小人頭,被郭雪芙賊笑收藏

  所以應會有續集...


  本片算還不錯的恐怖國片,其中幾幕頗為嚇人

  劇情跟演技也都到位,可以推薦


  --'
