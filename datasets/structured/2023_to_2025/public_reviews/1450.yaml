url: https://www.ptt.cc/bbs/movie/M.1688660168.A.0CE.html
title: '[情報] 【鬼修女II】官方預告'
content: '厲陰宅宇宙中最強大的邪靈回歸


  【#鬼修女II】今年9月祈求救贖＃鬼修女2


  新線影業再度帶來恐怖驚悚鉅片【鬼修女2】，是延續【鬼修女】故事的下一篇章；【鬼

  修女】是高達20 億美元票房的【厲陰宅】宇宙系列中最賣座的電影。


  在這部全球大受歡迎的恐怖片續集中，故事發生在1956年的法國，一名牧師慘遭謀殺，某

  種邪惡正在散播，艾琳修女將再次與鬼修女瓦拉克展開正面對決。


  泰莎法蜜嘉（【鬼修女】、【鍍金年代】）再次扮演艾琳修女，片中參與演出的還有強納

  森布羅克（【父親與士兵】、【鬼修女】）、絲托姆雷德（【最後生還者】、【自殺突擊

  隊：集結】）、安娜帕普威爾（【童話】、【納尼亞傳奇】），和邦妮奧羅斯（再度飾演

  她在【鬼修女】中的角色），以及由各國演員組成的精彩卡司。


  【鬼修女 2】由導演麥可查維斯（【厲陰宅3：是惡魔逼我的】）執導，採用伊恩葛德堡

  和理察南（【噩夢診所】、【驗屍官】），以及阿克拉庫珀（【窒友梅根】、【疾厄】）

  共同撰寫的劇本；故事由阿克拉庫珀根據溫子仁和蓋瑞道柏曼所創造的角色而衍生。


  本片由沙佛朗公司的彼得沙佛朗和原子怪獸的溫子仁擔任製片，延續兩方在所有【厲陰宅

  】系列電影中的合作。【鬼修女2】由李察布瑞納、戴夫諾史達特、維多利亞帕爾梅里、

  蓋瑞道柏曼、麥可克里爾、朱德森史考特和麥可波萊爾擔任監製。


  導演麥可查維斯的幕後創意團隊包含：攝影指導崔斯坦奈比（【厲陰宅3：是惡魔逼我的

  】、【邪氣沖天】）、美術設計史帝芬克雷森（「胸懷大志】、【法蘭西特派週報】）、

  剪輯葛雷格里普洛特金（2022年版【驚聲尖叫】、【逃出絕命鎮】）、特效製作蘇菲拉爾

  克（【雀鳥】、【露西】），以及服裝設計安涅絲畢茲耶（【氧氣危機】、【布萊特納指

  揮官】）。配樂則是由馬可貝爾特拉米 （2022年版【驚聲尖叫】、【猛毒2：血蜘蛛】）

  負責。


  【厲陰宅】宇宙是史上最賣座的恐怖片系列，全球票房超過 20億美元；其中有四部電影

  在全球各自有超過3億美元的票房（【鬼修女】3億6千6百萬美元、【厲陰宅2】3億2千2百

  萬美元、【厲陰宅】3億2千萬美元、【安娜貝爾：造孽】3億7百萬美元），全系列七部電

  影皆賺超過 2 億美元。【鬼修女】是其中最賺錢的電影，全球票房超過3億6千6百萬美元

  。


  【鬼修女2】由新線影業出品，並由原子怪獸/沙佛朗公司製作，華納兄弟影業發行。


  --

