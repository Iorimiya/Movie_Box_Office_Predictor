title: '[贈票] 【鬼修女II】全台特映會搶先看 '
content: "今年九月，恐懼再度來襲，最強大的邪靈即將回歸！恐怖驚悚鉅片【鬼修女 II】，是延\n續【鬼修女】故事的下一篇章；【鬼修女】是高達 20 億美元票房的【厲陰宅】宇宙系列\n\
  中最賣座的電影。故事發生在 1956 年的法國，一名牧師慘遭謀殺，某種邪惡正在散播，\n平凡的學校發生了許多怪事，艾琳修女將再次與鬼修女瓦拉克展開正面對決。\n\
  \n\n《抽獎方式》\n9月1日 (週五) 23:59 前，推文留言你想要參加【鬼修女II】的〈場次〉與〈原因〉，就\n有機會搶先看電影！\n（如：台北場，我好喜歡瓦拉克）\n\
  \n《獎項內容》\n【鬼修女II】電影試映券（一組2張）\n\n\n《特映會場次》\n台北場：9/6 (三) 19:00 國賓長春 15組 （一組2張）\n台中場：9/6\
  \ (三) 19:00 台中站前秀泰 10組（一組2張）\n高雄場：9/6 (三) 19:00高雄夢時代秀泰 10組 （一組2張）\n\n《中獎通知》\n9月2日\
  \ (日) 23:59 前，公布中獎者於回文內，並寄站內信通知得獎者得獎事宜。\n9月3日 (週日) 18:00 前，請各位中獎人務必回覆領獎資訊，恕不接受逾期回覆。\n\
  \n《注意事項》\n1.試映券為非賣品，嚴禁兜售等圖利行為。\n2.票券尚未劃位，請於開演前60分鐘自行劃位，座位劃滿即不受理。\n3.請準時入場觀賞，電影開演後10分鐘戲院與主辦單位有權謝絕入場。\n\
  4.如本活動因不可抗拒之特殊原因無法執行時，主辦單位有權決定取消、終止、修改或暫\n停本活動與延遲得獎公告。\n更多電影資訊：華納兄弟台灣粉絲團 \n\n\n\n\
