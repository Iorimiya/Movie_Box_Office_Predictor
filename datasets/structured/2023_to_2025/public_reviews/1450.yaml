url: https://www.ptt.cc/bbs/movie/M.1695654519.A.D2D.html
title: '[新聞] 北美票房創今年新低 鬼修女II穩住冠軍'
content: "北美票房創今年新低 鬼修女II穩住冠軍\n\n2023/9/25 11:17\n\n（中央社洛杉磯24日綜合外電報導）北美院線聯盟（Exhibitor\
  \ Relations）今天公布數\n據，死氣沉沉的北美票房本週末創下今年新低，排名第一的「鬼修女II」（The Nun II）\n僅840萬美元入袋。\n\n\
  影藝事業顧問公司「娛樂經銷研究」（Franchise Entertainment Research）分析師葛羅\n斯（David A. Gross）表示：「這個數字不太好看。」他說，整個月的票房成績都很糟。\n\
  \n葛羅斯說，好萊塢編劇和演員長達數月的罷工行動據報今天來到關鍵時刻，但仍「無法很\n快結束」。\n\n這場罷工行動導致眾家明星無法為新片上映進行宣傳。\n\n\
  本週末前5名電影票房總計約3100萬美元，比「Barbie芭比」（Barbie）上映第4週時的成\n績還差。\n\n恐怖片「鬼修女II」本週進帳840萬美元，儘管成績不溫不火，過去幾週來仍穩居榜首。\n\
  北美院線聯盟估計，本週首映的動作片「浴血任務4」（Expend4bles）收入830萬美元，\n與「鬼修女II」相去不遠。\n\n擠上第2名的「浴血任務4」由傑森史塔森（Jason\
  \ Statham）、席維斯史特龍（\nSylvester Stallone）和杜夫朗格（Dolph Lundgren）等老牌明星領銜主演。\n\n排名第3的是「威尼斯魅影謀殺案」（A\
  \ Haunting in Venice），進帳630萬美元。這是導\n演肯尼斯布萊納（Kenneth Branagh）又一次改編阿嘉莎克莉絲蒂（Agatha\
  \ Christie）偵\n探小說的作品。\n\n第4名是丹佐華盛頓（Denzel Washington）主演的「私刑教育3」（The Equalizer 3），\n\
  賺進470萬美元。\n\n上映第10週的「Barbie芭比」穩住第5名，收入320萬美元。\n\n排名第6到第10的作品依序為：「我的希臘婚禮3」（My Big\
  \ Fat Greek Wedding 3，暫譯\n），300萬美元；「印咒：畢舍遮」（It Lives Inside），260萬美元；「笨錢效應 」（\nDumb\
  \ Money），250萬美元；「藍甲蟲」（Blue Beetle），180萬美元；「奧本海默」（\nOppenheimer），160萬美元。 （譯者：紀錦玲/核稿：劉文瑜）1120925\n\
  \n#葛羅斯 #北美票房 #傑森史塔森\n\n--\n佛教經典的\n是 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\
  \n\n--"
