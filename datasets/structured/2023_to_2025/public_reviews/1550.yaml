title: '[情報] 2024 葉門奧斯卡代表：《腹荷》'
content: '葉門甫公布了申報 2024 年奧斯卡「最佳國際影片」的電影，將以《腹荷》作為代表！




  《腹荷》為葉門男導演 Amr Gamal 的第二部劇情長片，今年出於柏林影展的「電影大觀

  」單元中首映，並受到影迷們的愛戴拿下了該單元「觀眾票選獎」的第二名。該片在今年

  中也入選台北電影節的「國際新導演競賽」，並獲得了「評審團特別獎」，其中值得一提

  的是，該片的配樂家為台灣的知名音樂家「陳明章」。


  「戰後五年，經濟困頓，孩子的世界還充斥著無憂童語，但大人的現實已滿佈愁雲。一對

  失業夫妻帶著三個孩子為新居奔走，丈夫阿梅德固執不阿，妻子埃絲拉敏感多愁。在這個

  停電常有、軍車橫行的虔誠伊斯蘭國度，孩子的降生被認為是天賜祝福，但眼看最小的兒

  子上學在即，腹中的新生命反而成為這對夫妻前所未有的「腹荷」。他們該依循宗教傳統

  留下腹中嬰孩，還是鋌而走險、尋求非法墮胎呢？」（取自 Yahoo奇摩電影戲劇）




  曾經歷多年內戰的葉門至今只提交過兩部電影競逐奧斯卡，其中包括《腹荷》導演 Amr

  Gamal 於 2018 年拍出在國內相當受歡迎的首部電影《10 Days Before the Wedding》，

  另一部則為 2016 年首次報名的紀錄片《我十歲，離過婚》，不過兩部片都未能獲得青睞

  。



  --'
