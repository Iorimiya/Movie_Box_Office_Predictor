title: '[新聞] 無懼《復聯4》王家衛《撞死了一隻羊》首映'
content: "無懼《復聯4》 王家衛《撞死了一隻羊》首映\n\n更新: 2019-04-25 7:15 AM           標籤: 王家衛, 《撞死了一隻羊》,\
  \ 《一隻羊》\n\n【大紀元2019年04月25日訊】（大紀元記者鍾又淳綜合報導）今年最受關注的漫威電影《\n復仇者聯盟4：終局之戰》（簡稱《復聯4》，Avengers:\
  \ Endgame），24日在大陸上映。\n儘管其它電影都選擇逃離，但由王家衛監製、金馬獎得主萬瑪才旦執導的《撞死了一隻羊\n》（簡稱《一隻羊》）將於4月26日如期上映。影片於22日在北京舉行了首映禮。\n\
  \n據陸媒中國新聞網報導，自從上個月底《復聯4》宣布定檔4月24日後，除了《一隻羊》，\n幾乎沒有稍微有點體量的大陸片再宣布過定檔。即便已經或準備定檔「五一」附近的影片\n\
  ，也在《復聯4》官宣後紛紛「逃離」。\n\n譬如原本定檔在「五一」檔期的《東北往事之二十年》，原著孔二狗近日在微博調侃式地\n宣布：「由於本人上週末酒後不慎把臉摔壞，導致電影《東北往事之二十年》喪失了一個\n\
  主要賣點，以前一直以為憑藉我電影的品質和我的顏值可以硬抗《復聯4》，現在我的『\n美貌』已蕩然無存，面對來勢洶洶的《復聯4》，我們決定撤檔。」笑翻網友。\n\n\
  或許是因為大陸國產片的逃離，導致24日《復聯4》的排片占比一度超過90%，以及當日票\n房占比高達99%。據騰訊網披露，在《復聯4》首映結束後，有圈內人士在朋友圈發圖問道\n\
  ：「中國的電影人哪裡去了？」「也算是一種恥辱吧？」\n\n有業內人士分析，《復聯4》的排片和排座占比如此之高，是因為沒什麼國產片能讓影院\n篤定穩賺不賠。\n\n\
  對於與好萊塢大片《復聯4》撞檔期，王家衛22日在出席《一隻羊》首映禮時表示並不擔\n心：「《復聯4》成功，是美國電影的成功，本土電影能堅持下去，最後才是我們的成功\n\
  ，不代表看了《一隻羊》就不能看《復聯4》，或者是看了《復聯4》就不能看《一隻羊》\n。」\n\n《一隻羊》此次選擇「藝聯專線」上映，被問及為何做出這樣的決定，王家衛透露：「我\n\
  們先定的這個檔期，我們定的時候《復聯4》還沒有定。當我們定了之後，其它的戲都走\n了，當然我們也可以走。」\n\n王家衛也無奈表示：「但走到哪裡呢？在當下這個市場裡藝術片的市場空間是有限的，我\n\
  們那麼辛苦終於有一條藝聯專線，如果我們自己退了，基本上等於是自我放棄。」\n\n擅長文藝片的王家衛，鼓勵在場的年輕導演，如果將來想走藝術片這條路，別被現實嚇倒\n\
  。他說：「有0.1%的空間就代表有99.9%空間的進步餘地，只要能用心拍出好的作品，空\n間一定會增大，局面一定可以打開。」\n\n《一隻羊》取景於海拔5.500米的可可西里，講述了一個高寒藏地關於「輪迴」與「放下\n\
  」的溫暖故事：司機金巴在路上撞死了一隻羊，決意超度此羊；殺手金巴即將找到殺父仇\n人，準備報仇雪恨。陰差陽錯之間，殺手金巴搭上了司機金巴的卡車，從此，兩個叫金巴\n\
  的男人的命運便神祕地聯繫在了一起……\n\n與王家衛合作的導演萬瑪才旦一直是國際電影節的寵兒，《一隻羊》去年9月已獲得第75\n屆威尼斯電影節「地平線單元」最佳劇本獎，也是本屆威尼斯影展上唯一一部獲得重要獎\n\
  項的中國電影。目前，影片已獲得諸多讚譽，尤其是片中三位主演的表現給觀眾留下了深\n刻印象。\n\n首映禮上，幾位演員分享了電影拍攝的幕後趣事，金巴一場戲連吃四十多個包子，笑稱「\n\
  在尋找自己胃的底線」，藏族演員更登彭措自曝：「從開機前到殺青都沒有洗頭。」而為\n了追求手部的滄桑感，他將手反覆浸泡在冷水中又風乾。\n\n王家衛介紹說，這部電影是「萬瑪才旦借了一副西藏人的眼鏡給我們看西藏」。\n\
  \n責任編輯：楊明\n\n--\n\n帝釋所問經講記77頁拆穿的。\n毗婆舍那講記(含法的醫療)說明如何修四念處增加智慧斷除所有煩惱。\n  PTMC 寂靜禪園\n\
  、、、、()、、是。\n  是    是\n\n--"
