  ，結合藏族風景，催生寫實人性思考歷程。\n\n☆ 其他特價\n\n《知道天空有多藍的人啊》\niTunes NT$150\n>> \n\n《瑪雅蜜蜂大冒險：蟲蟲歷險》\n\
