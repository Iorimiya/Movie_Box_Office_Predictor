content: "《無聲》\niTunes NT$190\n>> \n\n《報告老師！怪怪怪怪物！》\niTunes NT$190\n>> \n\n近年來本土影壇開拓校園題材，積極往青春戀情以外領域發展。尤其從這\n\
  二部來看，不論靈感是真實社會事件或個人創作小說，都聚焦於校內霸凌\n問題。《無》片經柯貞年以劉子銓、陳姸霏扮身障學生拍出全校遭隱瞞的\n驚悚現象，《報》片藉學生玩弄怪物表達層層欺壓。\n\
  \n《劇場版情色小說家～Playback～》\niTunes NT$90\n>> \n\n漫畫家丸木戶Maki人氣代表作改編影集躍上大銀幕，畫下句點！找回竹財\n\
  輝之助、豬塚健太共演忘年情侶，回顧自路上擦撞相識以來培養的感情，\n隨竹財回老家仍用通信鞏固關係，卻經豬塚就職那刻帶來動搖彼此信任的\n考驗。\n\n《天下無雙》\n\
