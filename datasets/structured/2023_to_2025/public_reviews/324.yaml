url: https://www.ptt.cc/bbs/movie/M.1542735216.A.75A.html
title: '[夢雷]如夢一般的《撞死了一隻羊》'
content: '1.影片名稱 : 撞死了一隻羊


  2.觀影方式 : 金馬影展



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  他們說《撞死了一隻羊》是魔幻寫實。whatever。


  他們說，裡面的司機跟殺手，可能是同一個人。whatever。


  他們又說，可能最後的殺人場面，是司機的夢。whatever。


  其實那隻被撞死的羊，到底跟這殺人故事有什麼關聯呢。whatever。


  或是那4:3的比例，到底為什麼，哎，我怎麼想也還是想不通。但是，whatever。


  隨便了。



  說不上來的。就好像有些人，你不明白他，


  但只要看一眼，你就明白你喜歡他。



  這場景發生在“穿越可可西里無人區的青藏線”，海拔五千公尺，


  存在意義跟氧氣一樣稀薄的地方。


  偶爾有禿鷹盤旋，偶爾有羊不知從哪跳出來，跑進車輪下自己死了，


  偶爾有一個女人在豔紅色的屋子裡等著一個不知什麼時候會再出現的男人。


  偶爾有一間茶館賣著甜茶 包子和無牌啤酒，


  茶館裡會有一個即使穿著厚重毛衣也看得出衣服裹著一對沈重大奶的 風情萬種的老闆娘。


  當然，


  這“高寒缺氧，人跡罕至”的高原上，還有一個四處為家的司機，以及一個要報父仇的康巴漢子。



  光是這樣，看著看著，我就不禁要想，


  是不是趁還活著的時候，也應該去那穿越可可西里的青藏線走一遭。


  然後也許，


  就能像電影一開頭說的，


  “如果我讓你進來我的夢，那也就會成為你的夢”


  說不定，我就能進入誰的夢，或是，誰就成為了我的夢。



  就是那樣的電影而已。


  看片的時候，是吃過午餐的下午，中間我不小心還打了幾個盹，


  但隨著看似一點也不複雜的劇情，緩慢地前進，心思卻飄到了很遠很遠的地方，


  好像也做了一個很朦朧的夢一樣。


  並且還相信，那的確是一個，所有的救贖跟理解都能奇蹟似發生的地方。




  有時候，看一部片子，就帶著這樣朦朧的感覺走出戲院，也就夠了。




  --

  寫完我好想去西藏QQ

  抽到配額的都是些?!!!

  不不不 這片的靈魂我相信是極其西藏式的

  沒錯，張藝謀的影 根本景片搭起來的假貨！ 那些評審口味有夠媚俗的！

  對！就那個tilt down!

  哎，這些和那些無緣相見的電影，才真的是比悲傷更悲傷的故事吧

  告訴我那霎那你進入了誰的夢好嗎

  QQQQQQQQQQQ

  我完了，我是不是進到導演的夢裡 出不來了 只能去青藏線走一趟了！

  (握手

  就說最後的夢境 是司機為殺手殺了人啊

  唯一想問導演的是，為什麼是4:3

  不過，好像人眼看出去，也的確是4:3...

  啊啊啊 真希望當初買的是影人出席場！

  羊死了 被超度了 但是超度牠的人，為了另一個同名的殺手，在夢裡殺了人，

  也同時等於超度了那個同名殺手

  然後自己留下來在輪迴裡，流轉生死。

  哎，希望還有放映機會

  聽說攝影師是蒙古人呢

  聲音在聲色盒子做的，音樂是林強。剪接張叔平，監製王家衛。

  這號稱中國片的主創團隊，沒有中國人哪XDDDD

  然後那些西藏話，聽起來真好聽～

  男人講話的時候像風刮過草原，女人講話的時候，像珠子滾落寺院的階梯

  西藏人不管嗑了什麼，都給我來一點！

  西藏人這些年真的比台灣人還慘

  喔喔，有可能是這樣齁！我需要再看一遍！(去哪可以看啊啊啊

  不會啊，我覺得一點不違反常識呢～

  推非主旋律的中國片！'
