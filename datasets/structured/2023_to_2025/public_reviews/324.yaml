url: https://www.ptt.cc/bbs/movie/M.1535941850.A.7FB.html
title: '[新聞] 王家衛監製萬瑪才旦新片《撞死了一隻羊》首曝預告'
content: '新聞網址：


  由王家衛監製、澤東電影出品製作、萬瑪才旦執導的影片《撞死了一隻羊》曝光威尼斯電

  影節海報及預告片，影片濃郁的東方神秘氣息撲面而來。片是本屆威尼斯電影節唯一入圍

  競賽單元的中國電影，將於當地時間4日將在“地平線”競賽單元世界首映。


  《撞死了一隻羊》是萬瑪才旦與澤東電影的首度合作，王家衛擔任監製，更

  有曾斬獲戛納電影節、金馬獎、金像獎等多項國內外電影大獎的幕後團隊參與製作，讓迷

  人的故事在大銀幕得到完美呈現。聊及與萬瑪才旦的合作，王家衛表示：“萬瑪才旦是當

  代的一位重要導演，我們很榮幸能與他合作拍這部電影。”


  《撞死了一隻羊》劇本改編自次仁羅布短篇小說《殺手》和萬瑪才旦的短篇

  小說《撞死了一隻羊》，由藏族演員金巴、更登彭措、索朗旺姆出演，講述了一個複仇的

  故事。


  萬瑪才旦透露：“這是一個殺手故事, 但它和其他的殺手故事不同，我喜歡

  這個故事的講述方式。”同時，他表示此次做了很多不同以往的嘗試，片中有黑色幽默等

  諸多元素。


  今日曝光的國際版預告中，亦能初見導演在影片色彩及敘事風格上的嘗試與

  突破，黑白影像與彩色畫面交替切換，夢境與現實虛晃交錯，一段難分虛實的複仇故事鋪

  展開來，獨具夢幻和寓言色彩，而一句“如果我讓你進入我的夢，那也會成為你的夢”的

  藏族諺語，更是令人聯想萬千。


  影片還同步曝光了國際版海報，巨大的金色曼陀羅下，兩位主人公背向而立

  ，背後有神秘人物駐足凝視兩人，暗灰的色調與獨具藏族特色的細節，充滿神秘與夢幻之

  感，黑色藏族公路電影的氣息撲面而來。


  導演萬瑪才旦的電影一向聚焦藏族文化，描繪藏族人民的生存現狀，其作品

  令國內外觀眾對藏地有了更多認知，此前“藏地三部曲”《靜靜的嘛呢石》、《尋找智美

  更登》和《老狗》更是獲國內外多個電影節獎項。 2015年，《塔洛》首次闖入三大電影

  節，入圍威尼斯電影節“地平線”競賽單元。而今，其新作《撞死了一隻羊》再次入圍威

  尼斯電影節“地平線”競賽單元，是本屆唯一入圍競賽單元的中國電影。





  --'
