title: '[新聞] 英國電影雜誌為「你的名字。」打出滿分評價'
content: "新聞網址：\n\n英國電影雜誌為「你的名字。」打出滿分評價\n認為新海誠有機會獲得奧斯卡！\n\n「你的名字。」雖然預定明年第一季度才會在美國正式上映\n\
  不過在今年12月「你的名字。」將會在洛杉磯地區進行限定上映\n期望能夠趕及時間入圍第89屆奧斯卡\n而英國著名電影雜誌《帝國》不僅為「你的名字。」打出了滿分5分\n\
  還認為「你的名字。」很有機會獲得明年的奧斯卡最佳外國影片或最佳動畫\n甚至是兩個獎項同時獲得\n\n《帝國》雜誌是英國銷量最高的電影雜誌\n在12月號中《帝國》雜誌為新海誠的「你的名字。」打出了5分的最高分\n\
  而且編輯在評論中也盛讚新海誠，帝國雜誌寫到\n「在未來幾年內如果這個瘋狂的世界還有點公平正義可言的話\n新海誠將會與宮崎駿一樣成為一種日本動畫的文化符號就和宮崎駿一樣\n\
  而且新海誠也很有機會獲得明年年初頒發的奧斯卡最佳外國電影或者是最佳動畫獎項\n甚至是同時獲得兩項大獎」，對「你的名字。」來說\n能夠被奧斯卡最佳外國電影和最佳動畫兩個獎項提名就挺好機會也很大\n\
  但考慮到今年上半年的迪士尼動畫《動物方程式》\n在口碑和票房上的瘋狂(總票房收入超過10億美元，打入全球總票房收入第24名)\n「你的名字。」要得獎最佳動畫還是有難度的\n\
  至於和宮崎駿平起平坐的問題\n要看新海誠日後製作出的作品票房、人氣還有評價情況才好說\n這次電影雜誌《帝國》對「你的名字。」的超高評價大概新海誠自己看到也會有點驚訝\n\
  \n-----\n面對zootopia的大海嘯，希望你的名字能在奧斯卡佔有一席之地就好了\n\n--\n個人Youtube頻道 \n音樂創作 \n樂團表演 \n\
  棒球相關 \n小綠繡眼 \n\n--"
