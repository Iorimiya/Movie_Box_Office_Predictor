url: https://www.ptt.cc/bbs/movie/M.1477419384.A.1B3.html
title: '[極好雷]一個由"結"串起的故事--你的名字。'
content: "防雷 慎入\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n\
  .\n.\n.\n.\n.\n.\n.\n.\n\n\n電影版(偽)首PO就獻給這部了，總結個人昨天剛看完今日便馬上二刷的心得，在此與大家\n分享\n\n先來說說個人認為這部動畫電影的小缺失\n\
  \n1.男女主角對於彼此時間線的不同的後知後覺其實十分詭異，就以兩者都使用智慧型手機\n  來說，最少也可從上面看出兩人的年份是不同的\n\n2.片段接近尾聲之處，長大後的男女主角在下雪的東京都天橋上擦肩而過，此時下的BGM\n\
  \  那沉重如戰鼓的聲響有點讓人出戲(那戰鼓聲我後來才聽出是片尾曲的其中一些元素...)\n\n\n就我個人而言，缺失就這兩點\n\n而且，瑕不掩瑜......\n\
  \n那麼接著就開始說說為什麼我給這部極好評價的原因吧~~\n\n\n\n\n其實近年來日本動畫電影不乏名作誕生，除卻宮崎駿的諸多作品外，像是細田守的<<狼的\n\
  孩子雨和雪>>、<<怪物的孩子>>等等，也是一時蔚為風潮\n\n但要說近年巔峰，我還是給這部<<你的名字。>>\n\n其實最早個人只有看過宮爺爺的作品，再之後是細田守，然後才是新海誠，而且僅只\n\
  <<你的名字。>>這部而已\n\n對我來說，宮崎駿的電影多以架空世界為主，且背後帶著的寓意通常較為深遠而廣大。且\n在動畫中的人物演技方面，比較不會有太多誇張的情緒表現等等，因此看宮崎駿的電影頂\n\
  多是會心一笑，很少會到笑出聲來的狀況。\n\n而相較宮崎駿來說，細田守的作品又更趨向於動漫了，在人物的情緒表達上稍微誇張了一\n些。但整部片來說並不會有太過沉重的氣氛在某一段落出現，整部片看下來就是很平靜的\n\
  心情起伏(以我個人看過夏日作戰跟狼的孩子來說，只有狼的孩子後段姊弟的選擇有讓我小\n起伏一下)\n\n至於新海誠，人物的情緒表達的確是走稍微誇張的型態，而且一些吐槽的橋段也讓我有種\n\
  是在看日常向動漫的感覺，但這類的感覺是好的，能讓我有時不經意地笑出聲來。\n\n\n\n其實新海誠的作品，在我心中的評價比起宮崎駿要高。原因是在於\"能容易讓我身入其境\"\
  \n\n我蠻在意看完一部電影之後的感覺，而在觀賞完宮崎駿的很多作品後，帶給我的除卻是省\n思，有時還有一種無力感，一種沒辦法去接觸到宮崎駿筆下世界的無力\n\n\
  但新海誠在<<你的名字。>>中勾勒的東京都，無疑讓我心中充滿了無限的嚮往\n\n也許他筆下的東京都是過於美化了，但至少在現實中，那是一個比起宮崎駿的架空世界更\n\
  容易能讓我接觸的電影世界\n\n而且男女情愛之類的題材，也許是老套，但無疑是較為貼近大多觀眾亦包含我的內心\n\n\n\n\n這部電影我認為能讓我非常入戲的原因，除了場景切換的恰到好處外，適時安插的BGM也\n\
  是功臣之一。另外美不勝收的戲中場景，無論是波光粼粼的糸守町湖畔亦或是高樓林立人\n潮簇擁的東京都，皆讓去過日本但不曾接觸此兩地的我心中就像剛換到瀧的身上的三葉一\n\
  樣，露出雙目放光的眼神。\n\n而且片中也安插了許多伏筆，例如最初三葉的呼喚\"你不記得我了嗎?\"又或是課堂上老師\n所提及的\"逢魔之時分身之時\"等等，都在在地呼應後續情節的發展\n\
  \n就如同電影中奶奶不斷強調的\"結\"一樣，兩人的靈魂互換，交纏了彼此的時空，卻又因隕\n石的浩劫而斷開，然而之後又因為口嚼酒的因素而重新交錯\n\n很多小橋段的安排都能看到新海誠的小巧思，就好比一刷時還搞不清楚為何瀧會想到要喝\n\
  口嚼酒，二刷後才發現瀧(此時在三葉身體內)跟四葉還有奶奶去御神體的路途上，奶奶就\n曾和瀧跟四葉說過，水及茶還有酒流進人的身體中，亦是一種\"結\"，為神力的體現\n\
  \n而口嚼酒又象徵著奉獻者的半身，藉以神力的體現讓瀧經由喝下口嚼酒，再次與三葉交換\n彼此的靈魂，這件事情直到二刷之後才讓我恍然大悟(包含在喝下口嚼酒後瀏覽了三葉的\n\
  人生走馬燈也是)\n\n\n\n\n\n也許是手上也有個繩編手環吧~~讓我在看這部電影時多了很多熟悉感，也讓我在看完後對\n於手上這繩環有了更多的定義。\n\n\
  無論是歡樂的>>男女主互換靈魂後的爆笑日常\n又或是揪心的>>女主見到錯誤時空的男主、逢魔之時結束而來不及寫下的名字、女主眼中\n看見彗星從天落下的末日景況\n\
  又或是感動的>>逢魔之時的相逢、男主在女主手中寫下的我喜歡你、劇末長大後的兩人相\n見\n\n這部電影無疑是給我很多情緒的感受\n\n從起初的歡樂，到中途的沉重、無力、緊張，進而到得知糸守町躲過隕石危機的慶幸，最\n\
  後到男女主角相間的歡喜結局，整部電影看完只覺是洗了場一個多小時的心情三溫暖\n\n尤其是看著男女主角在天橋上擦肩而過，心裡頭幹得要死，差點氣的要撕票根\n\n\
  然後電車上的巧遇讓我心中燃起一股希望\n\n怎知那男女主角在樓梯相遇又要裝作不認識\n\n\"幹!!!他媽的好歹一個人出個聲吧!!!\"\n\n好在我們的男主角終究是爭氣，那一句\"\
  我是不是在哪裏見過你\"聽在耳裡真是好生舒坦，\n而女主角也是情不自禁哭成了淚人兒，看來兩人終成眷屬雖未提及，但已是指日可待的事\n情\n\n尤其是最後你的名字這提問作結搭配BGM，猶如看了篇文藻華美加之錯綜轉折的抒情文在最\n\
  後做了個餘韻悠長的首尾呼應\n\n我要是評卷老師肯定是打個大大的上上之作，沒有傳天下也必是鎮國之品(抱歉，我儒道至\n聖看太多了)\n\n雖然這部電影並沒有讓我流下淚水，但要說感動與惆悵是絕對有的\n\
  \n有絕美的電影場景，還有激盪人心的劇情配上背景歌曲，我真誠推薦這是一部必須到電影\n院觀賞的作品\n\n尤其是男女朋友，更是適合帶進影院中一同觀賞\n\n就像我在最後聽著逢魔之時結束後，男主角在山巔上大喊著自己忘記三葉，卻依舊想要找\n\
  到她的那段精神獨白，頗有種上窮碧落下黃泉，尋君願行千里路的決然，不禁哭成了淚漢\n子，右手緊握著身旁女友，深怕某天我也會失去她\n\n阿不是，是已經喝完了的飲料杯，我沒有女友\n\
  \n想到這我哭得更慘了QQ\n\n\n--\n\n那場景真的太美，雖然自己以前是在台北市生活，但覺得跟電影裡的東京都根本不能比\n\n看過s大的解釋了，的確是蠻合理的，畢竟有時自己作夢也會分不清現實與夢，醒來很快就\n\
  忘\n\n\nSOR QQ\n\n\n過譽過譽"
