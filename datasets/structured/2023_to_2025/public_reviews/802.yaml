title: '[微雷] 三刷《你的名字。》（iMAX）'
content: "大家好。\n\n剛剛看的是大直美麗華13:10場。\n\n1. 雖然iMAX畫面還是蠻讚的，不過我覺得應該沒有重製，有點像拿原版在大螢幕上放，所\n\
  \n   以細看起來有點糊？（也有可能是因為這次坐中間，能比較近距離看？）\n\n2. 美麗華iMAX廳的音響效果真的不是蓋的。或許是因為立體聲環繞？情緒更能融入音樂，\n\
  \n   爆炸聲跟彗星墜落聲比前兩刷在東南亞秀泰跟信義威秀更加震撼，甚至感覺到座位在震\n\n   動，超棒！\n\n3. 英文字幕被拿掉了，只剩下中文字幕。\n\
  \n4. 明明已經看三次了，還是不由自主地完全投入劇情，所以沒太關注畫質或細部有什麼差\n\n   異，這點就要靠各位有去看的板友了。許多片段依舊使人會心一笑，最後看到手心上的\n\
  \n   「我喜歡妳」以及重逢，真的很感動。\n\n對了，我坐在G22，還有誰去看同一場呢？\n\n\n\n--\n                     \
  \                 01/13 17:13\n\n印象中，跟之前看的iMAX電影都差不多，應該不存在你說的那些問題喔！"
