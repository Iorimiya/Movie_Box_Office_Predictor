url: https://www.ptt.cc/bbs/movie/M.1477121863.A.840.html
title: 'Re: [討論] 《你的名字。》的一些捏他（有雷）'
content: "先說聲擾板抱歉(?\n雖然這篇回文的原文一直有在更新\n多謝了推文的各位支持或補充\n不過看到板上有三個大家常問的問題\n也想跟著分享自己的想法\n\
  但加在前一篇文章內覺得怪怪的\n問的人又多不知道要回誰\n只好回自己的文章了\n前幾行也說了這是針對問題的回應\n所以不會有類似前一篇的捏他\n標題與本篇文章內容不符這點還請各位見諒\n\
  所以我說前面這堆根本可以說是廢話的防雷頁應該夠了吧\n重點只有下面兩句而已\n內容有小說雷，想自行觀賞的板友請小心別往下看了\n以下正文，文長注意\n\n\n\
  —————\n\n1.世界的神奇修正力？\n劇中一開始就說了：總是想不起夢中的事，但感覺一直都在\n夢也是世界修正的一部分\n夢裡面人會自動合理化很多東西\n\
  舉凡講到爛的寫日記沒看年份\nIphone5 與 5s 的差異\n三葉去東京看到跟自己平常穿的制服不一樣的瀧\n都能用夢做解釋，而且是醒來後都會忘光的夢\n以三葉去東京時舉例，其實三葉根本不記得瀧長怎樣\n\
  她說：「我們如果見面，就一定會認出對方」\n而不是說看到他的樣子、或看到他的制服時，就能認出他\n他們已經忘記他們昨晚的夢了，只記得有過做夢，就是這種感覺\n\
  光是昨晚的夢就不記得了，更何況是上週的、上個月的夢\n\n換瀧那邊當例子\n瀧在嘗試畫出糸守的風景時，也是狂找資料加上印象來畫的\n就是因為他不記得，只能靠既視感\n\
  「這個好像看過？」「這個好像不對。」\n這樣一點一滴的畫出糸守\n\n至於修正開始的時間點\n有人說為何以前寫日記寫身體都沒事\n後來日記變亂碼甚至一直喊名字都能忘記\n\
  我個人的看法，世界若是一條河流\n水由上游流到下游是一件非常自然的事\n有人往河中丟垃圾，要嘛沉到河底要嘛被水沖走，不可能卡在河中間不動\n就跟世界本來就要修正不合理的事情一樣\n\
  \n宮水家推測是為了拯救村莊\n被賦予了與他人交換身體的能力\n就像往河中丟一大塊漂流木，將一條河幾乎分成兩條\n河流若想修正回來，必然要等漂流木消失\n這個漂流木就是指三葉身上，與瀧交換身體的能力\n\
  修正世界的力量（河流）跟想拯救村莊的力量（漂流木）是兩股不同的力量\n\n漂流木有兩種狀況消失：\na.拯救村子失敗，漂流木直接被衝碎\n如同第一次瀧在高中時看到手機變亂碼消失一樣\n\
  至於為何是這時候才開始修正\n推測世界也是個偷懶的傢伙\n等到當事人察覺到不合理之處時才開始修正\nb.拯救村子成功，把漂流木搬出河道\n既然救村子的目的已經達到了\n\
  自然沒有繼續阻礙河道自然流動的理由\n\n不過以這樣的解釋方式無法說明\n為何瀧跟三葉在黃昏山頂相見後到確定村莊沒事的這段時間就已經開始忘記對方\n板上有另外的板友講了很棒的解釋\
  \ (  )\n一葉第一次帶三葉四葉去御神體時說過\n進到彼世時若想離開，就要留下最重要的東西\n瀧進去喝了酒，留下了他最重要的東西：對三葉的回憶\n而瀧的靈魂喝完酒跑到三葉體內\n\
  三葉的靈魂就被擠到(?)位於彼世的瀧體內\n所以當三葉(in瀧)離開時\n也跟著失去了她最重要的東西：對瀧的記憶\n\n—————\n2.瀧與三葉互相喜歡的也太快了吧？\n\
  小說中有提到\n他們面對這個無法跟外人說的問題\n整天都在煩惱跟對方交換之後怎麼辦\n查清楚對方的個性資料人際關係\n等於這段時間他們滿腦子都是想對方\n\n\
  瀧代替三葉生活的時候\n觀察出的三葉跟和他用日記交流的三葉\n給他的感覺不同，讓他很在意三葉這個人真正的樣子\n他開始擔心三葉的生活太壓抑\n他觀察的三葉是個逆來順受，不多做反抗的人\n\
  但是在東京代替他的三葉給他的感覺卻是很積極主動，而且不逃避的人\n所以他對三葉產生了興趣\n\n三葉的部分也是一樣\n瀧在東京明明就不擅長與前輩交流\n但代替她在糸守的瀧卻被多位男女告白\n\
  而且他也做到了她做不到的事：當面反嗆班上的三人組，讓三葉很佩服他\n表面上罵對方笨蛋，但是其實心中已經被瀧給吸引了\n所以她幫瀧與前輩決定約會時才會哭\n她決定去東京找瀧時說了：「見面以後，瀧會不會開心呢？」\n\
  其實是她如果見到瀧會很開心的意思，這是一種投射\n\n不過第一句就說了，這些都是小說內容\n看電影覺得進展太快的確是可接受的批判\n只是想讓大家知道兩人的情感並非空穴來風\n\
  不是突然就發生的事情，而是有緣由的\n礙於篇幅無法全數演出實在可惜\n這就是媒體的差異吧\n———\n感謝推文補充\n\n—————\n3.期待看到三葉說服她爸，結果衝進辦公室就沒了？\n\
  其實老爸以前是民俗學家\n曾經研究彗星與組紐信仰以及宮水的歷史（交換身體能力）\n後來才入贅神社成為神主\n他在發現三葉裡面的人不是三葉時就有點動搖了\n晚上一葉跟四葉又跑來勸：「三葉她說怪怪的，彗星會分裂」\n\
  再加上三葉本尊在跑的時候就已經能看到彗星分裂了\n差不了多遠的距離沒道理三葉看得到而村長町長他們看不到\n所以他看到真的三葉出現的瞬間就決定要避難了\n以上部份為小說部份為電影內容\n\
  \n以拍攝的角度來看\n瀧(in三葉)已經去說服過一次\n再拍出來場景就重複，節奏也不對\n如同第一次交換身體時\n只有演出三葉(in瀧)在東京新奇的一天\n\
  而沒有演瀧(in三葉)在糸守村發生什麼事\n只有用各種對話與筆記本去呈現\n\n而且照邏輯，這次三葉一定能說服\n一定能辦到的事情不需要拍出來\n對於結局的喜好各人不同\n\
  有人覺得錯過才是最美\n也有人覺得現在這樣相遇很棒\n還有人希望是錯過後就進片尾曲\n片尾曲黑畫面完再演他們相遇\n以上都可以。喜好嘛，沒有好或不好\n可是救村莊這部分\n\
  前面瀧為了找三葉畫風景去飛驒\n為了再見三葉一面去御神體喝口嚼酒\n為了救村莊炸變電所盜用廣播\n演了這麼一大堆結果到最後\n假設三葉說服不了她爸決定宣佈避難\n\
  而導致再次滅村直接結局\n ＷＨＡＴ？？？？？？？？？？？\n真的這樣演我馬上飛去日本找誠哥聊天\n那個新海誠出來我保證不打死你\n\n就是因為不可能這樣演\n\
  所以三葉一定能說服成功\n觀眾不確定的東西才有必要拍出來\n就跟觀眾不確定結局是哪種一樣\n\n—————\n以上這些，一樣是朋友的想法+小說與電影佐證\n其中有些比喻是我自己想的\n\
  希望還算淺顯易懂\n另外還有個常見問題是「瀧在黃昏山頂為何不寫名字？」\n之前已經先回過了，有興趣請往  前進\n對劇中有任何問題一樣可以在這篇或這篇的詢問\n\
  有空再回，完畢！\n\n--\n\n新海以這種方式勾起觀眾的好奇心是一回事\n但因為其他原因而沒有滿足好奇心又是另一回事\n我也很好奇結尾兩人相遇後的日常到底會多怎樣\n\
  講直接一點是給你錢趕快閃我\n可是不管是電影還是小說都是到相遇就結束了\n這是留白的功用\n新海當然可以在三葉跑下山的前後\n加入一葉與四葉去找爸爸\n或者爸爸親眼看見分裂的片段\n\
  但那段的背景音樂是述說三葉的心情\n她雖然忘記了某個重要的人，但是她確信那個人喜歡她且告白了\n不管未來會怎樣，她要一輩子抱著這個心情走下去\n所以才給她活下去的希望，不放棄的希望\n\
  這個時候突然插入說服爸爸的片段\n我覺得觀眾的情緒會受到更大的影響\n\n\n是 AS:E 那本外傳小說沒錯"
