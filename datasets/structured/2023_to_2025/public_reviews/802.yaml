url: https://www.ptt.cc/bbs/movie/M.1476359591.A.E90.html
title: '[普雷] 你的名字。是不是過譽了？'
content: "不是開玩笑的過譽文，我是真的覺得它有點過譽。\n\n電影剛上映時我正好要回台灣，\n所以就匆匆買了小說版來看。\n\n不得不說小說真的是個滿不錯的作品，\n\
  故事引人入勝、許多鋪陳跟劇情轉折都很耐人尋味。\n\n可是怎麼看了電影卻感覺.....拍糟了？\n小說裡的台詞跟電影基本上是完全一樣，\n可是不知道為什麼電影裡的角色唸起來就感覺好出戲，\n\
  海報上聲優的名字寫那麼大可是演技根本超差，\n尤其是男女互換時的聲音真的配得好糟超級出戲，\n很多角色的內心掙扎都沒有表現出來。\n\nテッシー幫忙放炸彈那裡也是有點唐突，\n\
  你會就這樣莫名其妙幫朋友的忙去犯罪嗎？\n\n而且，既然是走寫實的畫風跟劇情（是有點科幻風啦），\n不知道為什麼還是有很多誇張的人物描寫，就是宅宅喜歡看的那種，\n\
  美少女臉紅啦，用奇怪的聲線撒嬌之類的。\n\n以男女老幼通吃的動畫片來說，宮崎駿的片就很少有這種畫面。\n\n然後音樂......\n中間的插曲「前前前世」配合的是還不錯，\n\
  可是一開始的片頭曲感覺就不是很需要，總覺得讓整部電影看起來不完整。\n\n所以我是覺得，\n還不錯看，但就普普。\n\n說是神作的話就是過譽了。\n\n-------------------------------\n\
  補充，或許是謙遜，但導演自己也認為過譽。\n\n新海「怖いですね。興行収入って必ずしも自分の実力とは比例しない\nじゃないですか。100億円分の実力が自分につくわけじゃないですよね。\n\
  ちょっとアンバランスになっていきますよね、評価と実力が。そこの怖さがあります」\n\n新海「很惶恐。票房並沒有說一定會跟自己的實力成比例吧。這樣並不代表我本身擁有\n\
  \      100億日圓的實力吧。有點不成比例對吧？評價跟實力。對此我還滿惶恐的。」\n--\n你是怎麼理解成我還沒看的...？\n我很久以前有看秒速五公分......\n\
  不過如果一部電影需要靠導演其他以前的作品來襯托，那也是滿可惜的。\n沒有其他的可以看是一回事，\n這部電影好不好看又是一回事。\n不是啊......我又沒說我現在在台灣，我昨天才去看的耶......\n\
  \n而且我又沒有黑......\n我覺得跟日本人的風格沒以什麼太大的關係，\n我也很常租日本的電影來看，偶爾也會去電影院看。\n但我這邊提到的某些誇張的人物描寫是在大眾取向的真人影劇上少出現，\n\
  在動漫畫則常用的手法。\n我個人是覺得很不習慣啦，不喜歡的日本人其實也不少。\n當然真人影劇偶爾也是會有這種作品，我是都會避開啦。\n\n而這部片我不是很吃得下去的其中一點就是在於，\n\
  我有了這是部「大眾取向」電影的先入觀。\n\n但實際看卻發現有點微妙。\n＝＝＝＝＝＝＝\n\n再來，其實日本人很少有觀賞院線片的習慣，\n所以當有話題作出來，是很容易突然一窩蜂的......\n\
  你沒看預告片嗎？\n我沒有說爛尾就是了，\n其實我對劇情沒什麼意見，甚至很喜歡。\n不好意思我就住過日本鄉下，然後現在住在東京近郊，\n以後八成也會回鄉下住。\n\
  小說的文筆敘事整體上跟一般文學作品沒什麼差，\n但到電影就感覺變了點味。\n大家捧得跟天一樣高，我只是抱持懷疑態度，闡述見解而已，\n有沒有過譽大家見仁見智。\n\
  我解釋給你聽。\n大家捧好高→我覺得還不錯但普通→質疑是否真的這麼好→是不是過譽？\n查了一下日本也很多人在說是不是被過大評價了。\n有些電影很讚但就是賣不好，有些電影就是普普但是賣得超好，\n\
  以數字來說，這部電影是真的很厲害。\n\n但它真的有好到可以拿來跟宮崎駿比較嗎？\n我覺得是過譽。\n是主題曲，但在作品裡是插曲。\n可以啊，我覺得可能因為我少看動畫所以比較不能接受吧。\n\
  然後我沒有說一些美少女，裡面也沒有很多美少女。\n我是說女生角色。\n大...大家都過譽？\n我還是不懂為什麼不能在台灣說過譽，\n反正不是很多人都看過謎版。\n\
  \n再說，板上也很多人在日本看過，13號也上口碑場了。\n其實有一定年紀的聊天聊到君の名は，都會直接聯想到很久以前的一部連續劇。\n所以大家覺得好看的，每個人都只能覺得好看。\n\
  是看電影也要搞民粹就是了...？還是社會主義？\n是啊......所以？\n大哥你好可愛，所以我是可以講過譽還是不可以講過譽啊？\n你把我搞得好亂啊。\n沒有人說不給評論啊......\n\
  他們說的是不要否定掉我發過譽文（普雷）的權利。\n你可以不爽我的過譽文，但就事論事嘛。\n\n然後我還是很想知道什麼是「大家過譽」。\n我只是自己覺得過譽，來尋求討論而已啊啊啊，\n\
  你不爽你就講為什麼不是過譽，多講幾個理由出來啊啊啊啊啊，\n大家來討論啊啊啊啊啊啊啊，不是劈頭就否定我的「過譽說」啊啊啊啊啊啊啊啊。\n哎，我覺得不要浪費時間在這裡，\n\
  你今天噓個兩百次我還是覺得它過譽，所以......\n晚安0.<\n本來想說算了不跟你爭有沒有過譽，但你居然玩到我的國文程度上，\n那我就要來陪你玩一下了。\n\
  \n我是真的對中文文法不熟，所以先不管過譽是什麼詞，\n「自己覺得過譽」這六個字看不懂？我為你解釋。\n我只是自己（個人）覺得（這部電影）過譽。\n這樣懂了嗎？\n\
  我覺得，你應該多讀點書，才不會看不懂中文。\n我就是在說我自己覺得「這部電影被別人過分稱讚」啊！\n回你文好難過喔。\n從頭倒尾都是你在跳針，跳都我都不想理你了......\n\
  所以少數人就該死沒權利闡述相反意見就是了。\n我從頭到尾都是主觀的見解，\n所以，為什麼不行？？？\n有可能喔。0.<"
