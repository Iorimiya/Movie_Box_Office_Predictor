title: 'Re: [新聞] 影射核爆？《你的名字。》落選奧斯卡'
content: '這個內容不是大紀元記者自己寫的，是引用日本電影評論家小張秋子(小張アキコ)的話。

  幾乎跟大紀元的新聞內容差不多...


  原文：


  「君の名は。」の落選について、国際映画祭の審査員経験もある映画評論家の小張アキ

  コ氏は「まだ全米公開されていないのが響いたか。『レッドタートル』は昨年、カンヌ

  でも受賞し知名度も高いうえ、ジブリ関係者も昨秋ごろから米国でもアピールしていた

  」と指摘する。


  　「君の名は。」の内容にも言及。「ストーリーはシンプルなほうがいい。そして、原

  爆やヒロシマをほうふつさせる作品に、アメリカは想像以上に神経質。巨大隕石という

  テーマが、目に見えない形で影響したのかも」




  不太會翻...其實就跟大紀元寫得差不多呀。

  這個曾經擔任國際影展評審的電影評論家小張秋子覺得《你的名字。》落選有幾個原因

  1. 宣傳力度不夠。《你的名字。》沒有在全美公開，而《紅龜》不但去年已經在坎城得獎，而且從去年秋天就在美國宣傳。

  2. 就內容而言，劇情太複雜(故事簡單一點比較好)。而且美國對於令人想起原爆、廣島的作品比想像中的還要神經質。巨大隕石這種主題可能無形中造成某種影響吧...


  可以說是，日本人的一種看法吧...也許是他們自己把這件事看得很重要也說不定。


  --

  又有交換身體，又有穿越時空，確實是比較複雜啊...

  我對這片最有感覺的就是前半段兩姊妹跳舞的地方(既沒有交換身體也沒有穿越時空XD)。

  我覺得討論落選的原因本身沒什麼意思，但是看到日本人這麼說反而很有趣啊XD'
