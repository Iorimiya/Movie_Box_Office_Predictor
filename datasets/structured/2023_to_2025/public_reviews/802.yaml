url: https://www.ptt.cc/bbs/movie/M.1476633581.A.1C5.html
title: '[ 好無雷] 你的名字。畫面太好，音樂太美'
content: '這部片的畫風從靜態看是2D畫風


  但在剛開始就使用3d運鏡


  以前所看到的2d動畫，分層動作。


  鏡頭角度固定，人物動作，背景平移


  或是通通不懂只動鏡頭角度


  不過開頭卻是像一般電影運鏡方式，移動整個鏡頭


  第一次看有點不習慣就是了


  其他像是下雨的水坑、石板路，光影效果太美了


  一瞬間還以為是真實場景


  BGM也在一旁對觀眾的情緒推波助瀾


  第一次聽到前前前世那麽rock的曲子會想哭


  個人認為


  秒速五釐米85分


  這個有90


  我要繼續去哭了


  --'
