url: https://www.ptt.cc/bbs/movie/M.1476437933.A.495.html
title: '[好雷] 你的名字。'
content: '防雷頁！






















  剛從台中的大魯閣新時代威秀看完電影回來啦！


  迫不及待趕快來電影板發篇心得文。


  我自己是從《星之聲》這部動畫作品才認識新海誠的。


  後來就接續的看了...


  《雲之彼端，約定的地方》


  《秒速五公分》


  《追逐繁星的孩子》


  《言葉之庭》


  台灣有代理的相關小說，我也都有看過。漫畫部份就沒有了。





  今天買《你的名字。》的票的時候，其實沒有看見很多人。


  但是到了進場前，居然已經需要排隊入場了。讓我有點驚訝！


  電影裡有著許多大家都可以會心一笑的點，滿多觀眾也都笑了出來。


  到了故事情節讓人緊張的時刻，感覺影廳裡的氣氛也隨之凝結了起來。


  不過，這次新海誠終於不再虐人了。最後給了一個快樂結局！





  我的心得就是《你的名字。》超好看啦！


  你要我講為什麼，我也講不出個所以然來。


  就像新海誠也不知道為何會大賣一樣！




  P幣也不知道留著要幹嘛！


  推文每10推，我就發稅後1000P幣啦。


  整整會發稅後10000P幣啦。


  其他的推文，我有共鳴再來發！


  還沒去看的人，有空快去看！！！








  來補一下自己對新海誠作品的相關感想好了！


  他的作品最厲害的就是，背景畫面美到，你只要按下停格，就可以截下來當桌面！



  《星之聲》


  《雲之彼端，約定的地方》


  《秒速五公分》


  《追逐繁星的孩子》


  《言葉之庭》



  以上每一部作品的男女主角都會因為某種原因分離。


  有些是永遠再也見不到面了，有些則是多年後再次相見後又分離。


  所以網路上有些言論，就說新海誠的電影會胃痛，有的則說他老是在無病呻吟。


  他在劇情的處理上，滿多人都覺得不好，說什麼角色本身不夠讓人深刻啊之類的。


  《追逐繁星的孩子》是我看過他的作品裡，個人覺得最平淡的，也可以說不怎麼好看。




  劇情的部份，我總覺得新海誠根本有點惡德商法！


  他自己撰寫的小說，我都覺得相當好看。


  相對於在他的電影裡，角色在他筆下有了更多的感情，太多是電影裡沒有提到的。


  他為何拍不進他自己的電影裡，我不太知道。


  小說版《秒速五公分》跟《言葉之庭》，無疑是他另一種創作的方式。


  看完《你的名字。》之後，我現在很期待的小說代理，希望翻譯的品質能不錯！


  如果你看完了《你的名字。》之後，覺得還滿好看的話。


  不妨可以去看他以前的電影跟小說！


  不過，胃痛我不負責就是。







  已經發到一百推了！跟我另外說要的發的也發了。沒發到的話跟我說！


  沒拿到的人，可以去發心得文了！


  我覺得寫的好棒棒的，我發稅後2000P幣給你啦！


  --

  如果你喜歡這篇文章。

  歡迎到「約翰想變強」看看，我對喜歡過的每項事物寫下的記錄。





  --

  給你個稅後1000P好了！

  我資本不夠雄厚。抱歉。

  10推就是你了！有空快去看！

  神作你還不推！ > <

  給你稅後1000P幣啦！

  20推就是你！

  對。其實我想大家只是覺得好玩有趣而已！ XD

  30推！

  40推！

  50!

  60!

  70!

  80!

  90！很缺錢喔！居然還連推！

  100推！

  對不起，我真不知道要講啥感想。

  我的感想很單純，就是「超好看」。 QQ

  太閃了！你一定跟你女友去看吼？

  其實我有覺得有看到，但不確定是不是同一人。QQ

  證據給我看啊！發個稅後1000P幣給你！

  我懂你的胃痛！ XD

  沒圖沒真相！ XD 有票根給我看就發你稅後1000P幣。 :)

  OKOK

  台版又被閹割唷？有板友說曲目一樣的說！你是不是誤會了？

  我懂！　

  果粉是你！

  感謝資訊提供！

  辛苦了。 QQ

  讚讚！

  肥宅我也是。

  台中人站出來！

  嘿啊！看了很爽所以發錢！

  俗話說得好：「莫以小人之心，度君子之腹。」'
