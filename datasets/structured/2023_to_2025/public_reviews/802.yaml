title: 'Fw: [閒聊] 終於去看你的名字。'
content: '作者: roktzzt (阿銀) 看板: C_Chat

  標題: [閒聊] 終於去看你的名字。

  時間: Mon Oct 24 23:53:13 2016























  之前看過 秒速 星之聲 言葉之庭


  所以這次的作品實在太甜了 好不習慣


  訂票的時候還有一半空座位 結果現場竟然是全滿狀態 有點嚇到


  原po是在被雷光的狀態去看你的名字


  事先知道劇情果然還是會有影響 三葉在抓奶的時候 我反而在看房間細節


  但是整體上 到電影院觀看還是值得的


  用大螢幕看就是爽快 音樂也不是家裡耳機可以比擬


  真心推薦 沒去看的快點去看吧


  非常建議 去看早場 或 晚場 跟越少人看越好


  --

  之作不管在什麼時代都一樣


  --

  握手

  可惡 是我不正常嗎?

  新海誠都不新海誠了'
