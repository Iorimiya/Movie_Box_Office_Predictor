url: https://www.ptt.cc/bbs/movie/M.1482212566.A.4D8.html
title: '[討論] 新海誠向批評「你的名字。」劇情的影評家'
content: '新海誠《你的名字。》這部作品令本人帶來了商業上的光環，也不可避免的招致了一些議

  論

  平心而論《你的名字。》的畫面還是新海誠，但劇情發展方式和方向和以前新海誠的作品

  還是有著明顯不同的，可以說是變成更容易被大眾所接受的劇情了(或者說"商業化")

  而對於《你的名字。》的劇情日本的評論家們也沒少批評，早前新海誠在18日放送的節目

  「道上洋三の健康道場」中對這些稱《你的名字。》劇情過於簡單毫無價值的評論家們"

  反論":「你行你上啊」





  還有一種是認為《你的名字。》這部作品的劇情設置過於突兀，為了展開而展開沒有基本

  的講故事本領

  對於這兩派的意見新海誠在節目中表示自己比較反感的批評聲音就是

  「有不少人說’只要像《你的名字。》劇情那樣簡單易懂就能成為票房超過百億日元的電

  影作品’





  新海誠本人之前就已經反感影評家對自己的作品評頭論足，新海誠在採訪中說過：

  「對於一些影評家說我的作品應該怎樣怎樣我很生氣

  有些電影是帶有強烈的說教主張色彩來製作，告訴觀眾「少年和少女應該這樣成長，這樣

  的環境才能有利於人類成長」

  我不想做這種價值觀很強的電影，我只是想做面對多樣的選擇有所迷茫的故事。」

  空談誤國，實幹興邦



  --'
