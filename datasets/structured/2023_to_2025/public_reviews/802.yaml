title: '[討論] 你的名字。林口與板橋威秀之比較心得'
content: "先說我下面比較的是。\n別的戲院我沒去看所以也無從比較起，看下週有沒有心情去觀摩看看吧。之前這篇有發在\n西洽，但有新增一點東西。\n\n\n\n\
  \n(本想去京站跟美麗華，不過如果接下來因為新片上映後被排在小廳可能就不會去看吧，\n可惜台北離我太遠，之前想去也懶。\n至於信義威秀本來已經移出比較好的11廳\
  \ “THX認證廳”，但我發現明天 13：40 那場是\n排在11廳，所以會去體驗看看)\n\n因為當地人，之前1～3刷 (都是8廳) 都在林口，所以想說第4刷去別間看看，不然就太無\n\
  趣了。\n\n附上票根證明 (看平日威秀電影刷中信卡66折，一張才211元，所以還算便宜)\n\n\n\n之前去3廳看過史諾登和5廳的奇異博士，覺得這三廳(3、5、8)的影音水準基本上一模一\n\
  樣，所以這次的對於8廳的心得，應該也可以套用在2、3、5、7、8廳。 (林口好像沒第4廳)\n至於第9、10的Mappa廳因為沒去體驗過就不清楚了。(聽網友分享說影音水準也是等同大\n\
  廳，但螢幕稍小一點點)\n\n板橋威秀以前有去體驗過第6廳 IMAX，水準就不用我多說了，除了價格外，其他方面排名\n基本上都是北部前三吧。至於其他一般廳，去之前有做了一點功課，聽說板橋的音效普遍\n\
  都很棒。，座位都接近300，但雖然是人數多的大廳，但\n螢幕卻感覺較小等等，有愧對大廳的稱號，以上是做功課別人的看法。(7廳的影音效果等\n等不知道是不是跟2廳一樣？有待別人補充)\n\
  \n\n\n\n\n\n\n林口威秀，不愧是打出來的，不管是銳利度跟明亮度都比板橋來得好上許多，板\n橋7廳的話，一開始的隕石墜落就覺得比不上林口了，而且感覺畫面偏黃，也不夠明亮。\n\
  \n螢幕大小，感覺兩邊差不了太多，但板橋7廳稍微小了點，可能是因為左右兩邊沒有貼近\n牆邊，所以讓人感覺偏小，林口就比較貼近牆，所以讓人感覺影廳跟螢幕之間的比例很好。\n\
  \n螢幕比例，兩邊都是1.85：1的銀幕，所以「你的名字。」這部都有打滿。(別家如果是 2\n.35：1的銀幕，就沒辦法打滿，變較小)\n\n\n\n\n\n\
  因為之前有做功課說板橋威秀音效各廳都不錯，所以有期待了一下。但還是讓我失望了，\n不知道是不是因為音響已老態的關係，聽起來就是不夠紮實，聲音也偏乾？(不太會形容)\n\
  ，感覺差了林口一截，尤其是在三葉看到彗星分裂後的那一聲更能分\n辨得出來，林口威秀8廳紮實多了。\n\n隔音方面，基本上差不多，但林口感覺比較好一點，如果很入戲基本上聽不太到別廳的聲\n\
  音，至於之前去的板橋7廳，有聽到別廳的重低音好幾次就是了。\n\n(不過隔音方面也要看各廳的佈局吧？也許當天去板橋看時，剛好旁邊上映的是需要重低\n音的爽片？)\n\
  \n\n\n\n\n座椅方面這我倒沒好好注意一番，因為我比較不care這點，基本上差不多，但林口比較新\n就是了。\n\n至於包覆感，我覺得林口 H排剛剛好，\n\
  至於板橋7廳，雖然這次坐到 G排，但感覺要坐到 ，但是又有個缺點，如果\n坐到 F，頭要上仰才能對準螢幕，我坐 G牌都有點頭要稍稍上仰了(本人172cm)，更何況\n\
  要在往前坐。\n\n\n\n\n\n板橋7廳有股霉味，基本上這算是已開幕很久的影城通病了吧？林口威秀因為很新沒有異\n味問題。\n\n\n\n\n\n基本上這很難比，因為我的樣本數很少，\n\
  ，我看的這部的這四刷人都很少 (都在平日，林口三刷都在中午前後，\n板橋這刷的時間是也已經上映一陣子了)，人數都只坐了1/5左右吧，所以只能當作參考而\n已。\n\
  素質感覺都不錯，我運氣很好都沒有喧鬧。\n\n至於結尾，我看的林口這三場，觀眾幾乎都坐到等片尾曲完才起身離開，板橋這場，則有\n一半沒等到播完就先離開了。\n\n\
  \n\n\n\n\n\n\n蠻推薦林口威秀這家新開幕的影廳，而且\n(例如：日新威秀等等)，林口威秀這家畫質很好，音效也很不錯，希望林\n口經過幾年後還能保持這樣的水準。\n\
  而且感覺不會太擠，應該是服務當地人居多，如果想看早場，人更少的樣子，可能是因為\n購物中心 Outlet平日11點才開的關係。\n不過對外地人來說太遠，交通不怎麼方便就是了，應該都是服務當地客群居多吧。\n\
  我記得三井假日有免費接駁車，有三重、新莊、中和板橋線，有興趣的可以去三井官網查\n看看。\n\n至於板橋威秀對台北人來說交通比較方便，7廳雖然比不上林口，有其缺點，但還是算不\n\
  錯的觀感體驗，第四刷的我還是看到哭。\n\n尤其是瀧看到三葉的記憶那裡，看到\n\n感謝新海誠帶來這樣一部好\n作品。\n\n謝謝大家觀看與討論！\n\n\n\n\
  \n三葉的怨念\n\n\n可以買妳的口嚼酒嗎？三葉表示：\n\n\n溫馨的兩人\n\n\n--\n莉亞我老婆  PixivID:58485664\n  ID:58970143\n\
  \  ID:58485957\n  ID:58699486\n  ID:57747839\n ID:58599532\n\n--\n\n\n\n\n\n\n北部來說，撇開除了\
  \ IMAX廳，跟一些更大銀幕的巨幕廳 (例如：西門國賓大廳) 與交通\n、票價等等因素以外，林口這間綜合評比應該是最好的\n\n請問是在信義威秀哪一廳看的呢？除了10、11\
  \ THX認證廳以外的廳，多少都有雷，不是音\n效問題就是螢幕太小\n如果要省交通費，假日可以靠三井免費的接駁車，但上車地點就那幾個捷運站點而已，而\n且假日看，刷信用卡就沒什麼折扣，所以…\
  \ 還是要花錢 ^^|||\n因為結論有一些對本作的心得感想，應該可以貼在這吧？(′・ω・`)\n明天體驗完信義11廳，會在戲院版再po一篇\n\n——————————————————————————\n\
  還有補充一下兩邊的螢幕大小，板橋7廳感覺小了點，可能是因為左右兩邊沒有貼近牆邊\n，所以才讓人感覺偏小，林口就比較貼近牆，所以讓人感覺影廳跟螢幕之間的比例很好。\n\
  \n螢幕比例的話，兩邊都是1.85：1的銀幕，所以「你的名字。」這部都有打滿。(別家如果\n是 2.35：1的銀幕，就沒辦法打滿，變較小)\n\n\n我看的這四刷都蠻OK的，燈都最後才亮，至於觀眾走人我是還好，想走趕快走不要喧鬧就\n\
  好 XD\n\n感謝分享，如果我去美麗華的話，基本上都是為了看 IMAX，一般廳看過2、3次而已，印象中就是銀幕挺大的"
