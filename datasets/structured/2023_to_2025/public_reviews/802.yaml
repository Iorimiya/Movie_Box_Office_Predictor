url: https://www.ptt.cc/bbs/movie/M.1477866881.A.6E1.html
title: '[好雷] 你的名字。 -見山又是山'
content: "板上「你的名字。」心得量已相當豐富，但抱著被噓爆的風險，還是想來分享一些\n自己的感想，希望能找到和我有共鳴的人。\n\n  首先，先請板友們聽首歌吧，やなぎなぎ的「クロスロード」(crossroad)\n\
  \n  \n\n  這是一個主要業務為通信教學的補習班，Z會，的電視廣告。這個廣告於2014年2月\n公開。算一下時間，差不多就是「你的名字。」開始籌備的時間點。事實上，新海誠\n\
  曾在自己的推特\n以及訪談 中，明\n確指出這個廣告正是「你的名字。」的原點。以下，我將試著從新海誠過去的作品，\n包含這個Z會的廣告，找出新海誠在「你的名字。」中，想傳達什麼事情給觀眾。\n\
  \n  本心得將以劇情的討論為主軸。其它如背景、人設、音樂、聲優、分鏡等等，本片\n的表現的相當出色，但為了避免偏離主題，或許之後會另寫一篇討論。\n\n\n\
  -----防雷分隔線-----\n\n  在新海誠的任何一個作品中，他所描繪的世界都相當美麗而純粹。不僅天空如夢似\n幻，在許多違背物理定律的光線下，雲層、雨滴、建築、電車、櫻花都美得不可思議\n\
  。\n\n  即使這些角色在如此美麗的世界，劇情以及人物間的關係卻相當純粹。從「星之聲\n」談起，短短不到30分鐘內，想傳達的便只有兩人的距離越來越遙遠，郵件傳達時間\n\
  越來越長，卻也無可奈何；「雲之彼端，約定的地方」（以下簡稱雲之彼端）雖長達\n91分，但故事結構相當簡單，除了三位主角之外，幾乎沒其他人際關係。甚至也沒有\n\
  詳述三位主角間的關係，與其說浩紀（男一）與佐由理（女一）之間是戀愛，不如說\n是一種純粹的執念，使他們在多年後仍堅持要遵守約定。\n\n  「秒速五公分」是新海誠邁入成熟階段的關鍵作品。但與其說是成熟，不如說是把\n\
  三個「星之聲」連起來的作品。新海誠自己也有提過「秒速五公分」是從他寫過的劇\n本中，選三個連在一起成為一個作品。雖然「秒速五公分」的劇情給人一種片段感覺\n，但仍不改以往作品中的「純粹」。「秒速五公分」的角色更為集中，第一段與第三\n\
  段是貴樹（男一）自述，第二段是花苗（女二）自述，其他人幾乎沒有台詞。沒有戲\n劇化的劇情，只有一個純粹的概念，無限延伸。\n\n  和「秒速五公分」比起來，「言葉之庭」顯得貼近生活了一些，讓人胃痛的情結也\n\
  少了許多。然而畫面一樣美麗、劇情一樣純粹。在雨天無人的庭中吟著萬葉集，整個\n世界只剩下兩人，這時兩人甚至還不曉得彼此的姓名、年齡。彼此成為對方的依賴，\n竟也不自覺期待起下雨天。除了兩人之外，劇情同樣沒有對其他人有太多著墨。\n\
  \n  如果把其他動畫導演的電影作品放在一起比較，更能凸顯出新海誠的「純粹」。\n\n  先拿宮崎駿來說，票房最高的「神隱少女」便不只是千尋與白龍兩人的故事，包括\n\
  湯婆婆、錢婆婆、鍋爐爺爺、小玲、無臉男、河神等，在劇中都扮演著重要角色。其\n他如「魔法公主」、「霍爾的移動城堡」亦如此。\n\n  再來看看常被拿來和新海誠比較的細田守。「夏日大作戰」也不只是健二（男主角\n\
  ）與夏希（女主角）兩人的故事，包括佳主馬、奶奶、侘助等，都是關鍵人物。\n\n  不只簡化了人際關係，新海誠還把角色的「個性」一起拿掉了。\n\n  輕小說、電視動畫為了吸引觀眾，往往會將角色簡化成幾種「屬性」。拿京都動畫\n\
  公司的「冰菓」來說，折木「節能」、千反田常說「我很好奇」、福部是「資料庫」\n、摩耶花「毒舌」（或許不明顯）。更不用說許多動畫常用幾種簡單的屬性去描述一\n個角色，如「傲嬌」、「無口」、「腹黑」。雖然能讓觀眾迅速掌握角色特徵，卻也\n\
  使角色變得相當平面。\n\n  宮崎駿或細田守作品中的角色雖然不像電視動畫那麼浮誇，但也確實為各角色設定\n了個性、專長，讓劇情藉由角色們的對話逐漸往前推進。\n\
  \n  不過新海誠卻反其道而行。\n\n  「星之聲」幾乎沒有主角個性的描寫；「雲之彼端」除了一個當科學家、一個在沉\n睡、一個還在打混之外，對角色並無多加著墨；「秒速五公分」也幾乎沒有描寫男女\n\
  主角的個性；「言葉之庭」的男女主角同樣沒有什麼特色，反而讓我覺得花澤香菜的\n聲音太過甜膩，不適合這樣的角色。\n\n  然而正因如此，新海誠才有辦法把他想說的，最「純粹」的感情表達出來。\n\
  \n  接下來我想談談，這「純粹」的感情，究竟指的是什麼。\n\n  看過本篇第一頁的Z會廣告了嗎？沒有的話，推薦您翻到第一頁再看一次，可以的\n話，最好能找到背景歌曲「クロスロード」（Crossroad）的歌詞與其翻譯。歌詞是\n\
  由新海誠親自填寫，可想而知，畫面中沒交代清楚的細節，會在歌詞中描述。\n\n  Z會廣告中，男主角在都市念高中，並準備考大學，卻因打工太多（是不是和「你\n的名字。」很像？）而無法去補習班，只能用Z會的通信教學學習；另一方面，女主\n\
  角在偏遠的小島（又是和「你的名字。」相似之處）準備考大學，卻因為地處偏僻，\n連補習班都沒有，只好使用Z會的通信教學學習。Z會的老師批改兩人的答案時，也說\n\
  「単純なミスも、証明の組み立ても、この子達よく似てね」（不管是粗心的地方，\n還是證明的方法，這兩個孩子有很多相似之處呢）。而歌詞也一再透露，兩人是彼此\n的「半身」。\n\
  \n  「你的名字。」中，不管是靈魂交換，還是象徵「半身」的口嚼酒，不也是一直暗\n示兩人是彼此的「半身」嗎？\n\n  新海誠作品中的角色們，沒有過於複雜的人際關係，也沒有鮮明的個性。是因為，\n\
  在男／女主角眼中，女／男主角是自己的「半身」，也等於自己。兩個人在一起是一\n個人，也是全世界，所以不需要複雜的人際關係，也不需要鮮明的個性。\n\n  從最讓人胃痛的「秒速五公分」開始講起。貴樹與明里小時候都是轉學生、都被排\n\
  擠、都喜歡看書、甚至連喜歡看的書都相似。許多本書的借書卡上只有兩個人的名字\n，在外面約會（？）時，聊的也是寒武紀生物這種一般人難以插上話的話題。兩人彼\n此相似，彼此依賴，各自把對方當成自己重要的一部份。\n\
  \n  然而第二段的花苗就不是這麼回事了，兩人雖然時常一起騎機車回家，但每次經過\n飲料店時，兩人買的飲料都不同。即使是花苗想告白的那一天，特地買了和貴樹一樣\n\
  的咖啡，仍無法消去兩人從根本上的不同。到花苗家時，出來迎接的是花苗家的狗，\n然而貴樹與明里回憶中的卻是名為巧比和咪咪的貓，也暗示著兩人本質上的差異。所\n以花苗連告白都沒能說出來，因為知道貴樹從來不曾看著自己。\n\
  \n  貴樹在找的不是花苗，那麼就是明里囉？我卻也不這麼覺得。我想多數人都同意，\n貴樹在找的是「當年兩人共度的時間」，這裡的明里就像是貴樹的「半身」。但顯然\n\
  ，在斷了通訊之後，明里逐漸把失去的「半身」填補起來，然而貴樹卻在原地踏步。\n直到平交道的柵欄抬起後，貴樹意識到自己一直在追尋的原來是「另一個與自己相似\n的人」時，才真正把自己的內心填滿。用EVA的方式來說就是補完。\n\
  \n  再來把焦點換到前一部作品「雲之彼端」。三位主角看似有不同的個性，但三人對\n海的另一端，那座巨塔都有著莫名的執著，約定好要一起飛到那座塔上。到了那座塔\n\
  可以幹麻，小時候的他們完全不在意，重要的是三人靠著「高塔」聯繫起來。特別是\n浩紀與佐由理，兩人偶爾會在夢中聽到彼此的聲音（是不是和「你的名字。」類似呢\n？）。雖然這部作品沒有強調「半身」的概念，不過像是對高塔的執著，佐由理沉睡\n\
  後，浩紀也委靡不振，最後兩人一起到高塔完成約定等，都可看出新海誠想寫出這兩\n為主角相似的地方。\n\n  而「言葉之庭」中的兩位主角雖然也稱不上是「半身」的關係，但就都逃離了學校\n\
  這點來說，或許也可看成是逃避現實的兩人，創造屬於他們自己的時間與空間。\n\n  提了那麼多前作，終於要回來看「你的名字。」了。\n\n  整部電影大致上可分為四段，第一段是「前前前世」之前，兩人因靈魂交換而鬧出\n\
  許多笑話。第二段是「前前前世」開始後，到瀧發現糸守已滅村，而一人獨自前往御\n神體。第三段則從瀧喝下口嚼酒，一直到三葉順利說服爸爸疏散群眾，第四段則是瀧\n在御神體醒過來，卻忘了發生什麼事，一直到後日談。\n\
  \n  如同Z會廣告，我覺得男女主角與其說是「戀愛」，不如說是「彼此的半身」較貼\n切。\n\n  第一段，在「前前前世」之前，主要在交代糸守的背景，以及包含口嚼酒在內的神\n\
  社儀式等。靈魂交換的部分，主要是寫三葉進到瀧的身體，與奧寺前輩的關係逐漸升\n溫，卻嫌打工太過繁忙等等。兩人除了都有寫日記習慣之外，幾乎沒有相似的地方。\n實在難以想像會是「半身」的關係。\n\
  \n  這個階段中，彼此仍認為交換後的身體是別人的身體。「把他人看成他人」，或者\n說「見山是山」。\n\n  第二段，或許是交換的次數逐漸增加，扮演彼此的能力也越來越純熟，甚至產生了\n\
  「我在這個人的體內，搞不好比原本的主人過得更好」的感覺。三葉@瀧想和奧寺前\n輩去約會，瀧@三葉輕鬆打發掉言語霸凌三人組，也在籃球課有優異表現。\n\n  這時兩人逐漸「把他人看成自己」，也就是「見山不是山」。\n\
  \n  最關鍵的一幕，也可說是本劇的轉折點，便是從御神體回來時，正逢黃昏之時，一\n葉問了瀧@三葉「你在做夢嗎？」。驚醒的瀧卻發現自己在流淚。因為此時瀧已經幾\n\
  乎把三葉當成自己了，卻突然被點醒自己正在做夢。當瀧「把三葉看成自己」時，「\n自己又是誰呢？」一時回答不出來的瀧卻留下淚來。\n\n  而三葉起床後發現在自己的身體裡而流淚，可能是因為「想去和奧寺約會，去的卻\n\
  不是自己」，但也可能代表三葉已經「把瀧看成自己」，但看到鏡中的自己時，卻又\n想問「自己又是誰？」而流下淚。啟程前往東京，一方面是想看看奧寺，但更重要的\n應該是想知道「為什麼會分不出自己和瀧？」「或許和瀧見一面就明白了吧？」\n\
  \n  兩人的靈魂交換中斷後，瀧憑著印象中的景色來到御神體，喝下當初在三葉體內時\n隨著奶奶送來的口嚼酒，也就是三葉的「半身」，從頭到尾參與了三葉的一生，也回\n\
  到了隕石掉落的那一天清晨。\n\n  之後進入第三段，也就是劇情高潮，沒花太多時間在「他人」與「自己」的界線著\n墨。\n\n  到了第四段，糸守的人員幾乎全數生還，在御神體待了一碗的瀧也忘了大部分的事\n\
  。但自此之後，瀧卻對糸守這個地方的消息特別關注，並且由後日談的面試過程可得\n知，瀧未來希望能設計出「許多人喜歡、覺得溫暖的風景」，與「秒速五公分」的貴\n樹相比，瀧積極的求職，也明白自己的目標，知道自己屬於哪裡，該做些什麼。\n\
  \n  這時的瀧終於能「把自己當成自己」。\n\n  此時在現實生活中看到三葉，與五年前的那個瀧已有很大的不同。\n\n  五年前的瀧前往糸守，一如八年前的三葉前往東京，完全不曉得對方在哪裡，在茫\n\
  茫人海中找尋。就像「秒速五公分」的貴樹一樣，不僅不曉得對方在哪裡，連自己該\n往何處去都不曉得。\n\n  但現在的瀧不一樣，別人眼中的他會是一個「有目標的，獨立的自己」。而對瀧來\n\
  說，明白「自己該往何處去」時，看他人的眼光也會不同。不再把他人當成「另一個\n自己」，他人也不是自己的一部份，或自己的半身。自己就是自己，他人就是他人。\n\n\
  \  「見山又是山」\n\n  這就是我對「你的名字。」的感想。\n\n-----閒話家常的分隔線-----\n\n  當我把這樣的感想和我的朋友說時，不意外的得到了許多反對的意見。主要在於兩\n\
  位主角根本就沒有相似之處，要說是彼此「半身」也太過勉強。\n\n  我個人認為，這裡說的「半身」並不是興趣、專長、個性一模一樣。而是兩個主角\n在「本質」上有相似的地方。用type-moon的語言來說，就是「起源」類似。不過要\n\
  我說兩個人的「起源」為何，我也說不太出來。\n\n  但至少，從兩人都很盡力的想扮演對方的角色，也不遠千里想見對方一面來看，我\n認為兩人確實有某些根本的、起源的東西是類似的。\n\
  \n  許多人在這部片上映後才認識新海誠，常有人問宮崎駿、細田守、新海誠的差別在\n哪裡。至少就我看到的來說，相較於其他兩人，新海誠所描述的感情相當「純粹」，\n\
  不含任何雜質。男主角不是因為女主角身上的某些特徵而愛上女主角，反之亦然。\n\n  真要問兩人為什麼會相愛，大概只能得到兩個人非常相似這個答案。或者說，新海\n\
  誠想說的故事可能也不是什麼超遠距離的戀愛，而是一個人想在廣大的世界中，找尋\n未知的目標，或者找尋自己的定位。\n\n--\n                \
  \                      10/31 06:35"
