title: '[討論] 《你的名字。》的一些捏他（有雷）'
content: "此處的「捏他」不是後面那個雷的意思\n而比較像冷知識\n就是直接在板上搜尋冷知識能看到的那種\n不過個人還是比較喜歡講捏他\n所以才需要解釋一下\n\
  順便當成防雷頁XD\n建議如果是在看電影前會先踩雷決定要不要看的人\n這篇可以先跳過了\n因為看過一次「你的名字。」\n再來觀看這篇文章，會比較有趣\n「你的名字。」明日正式上映！\n\
  行數應該夠了吧，以下正文\n文長注意(?\n\n\n\n—————\n1.片頭曲\n第一次看的時候心裡吐槽\"新海你在劇場版動畫做片頭曲幹嘛啊ww\"\n但其實片頭曲含有的情報量非常大\n\
  像是一開始初中制服的瀧，比已經高中的長髮三葉矮\n下一個畫面變成高中時的瀧比短髮三葉高\n之後雙方背靠背畫面，兩人各消失一次\n只有畫出瀧在人群中找尋三葉的分鏡\n\
  三葉剪短髮是因為去東京找瀧但瀧認不出她\n各消失一次代表兩人都忘記對方\n隕石滅村三葉死亡，所以後面才會只畫瀧找三葉\n\n2.開頭房間\n第一次看的時候很容易搞不清楚的部分\n\
  揉胸的三葉跟下去吃早餐的三葉不是同一天，下去吃早餐的已經是隔天了\n這兩天四葉都穿同一件黃色連帽外套跟藍短褲是比較奇怪，鄉下小孩衣服少(x\n其他像奶奶跟三葉的朋友也說的很清楚：\n\
  「妳今天比較正常」\n如果沒有看過預告直接進戲院應該要花點時間理解\n新海這部很多這種前後剪在一起讓人以為是接續發生的事的鏡頭\n\n\n3.三葉的髮型是媽媽教她綁的\n\
  電影就感覺得到這髮型超複雜\n實際看人綁也是，有興趣挑戰的板友可以google搜尋“三葉髮型”\n詳細綁法這邊就不多說了，不過有一點我一定要講\n個人比較喜歡瀧(in三葉)時的普通馬尾(不重要\n\
  \n4.瀧在找糸守町時遇到的拉麵店老闆\n他開的那台車有經過三葉父親的演說現場\n\n5.三葉的古文課老師\n正是新海前作《言葉之庭》的女主角雪野\n而導演在訪問時有提到會做這樣的安排\n\
  有50%的成分是因為雪野老師的配音員為花澤香菜，而他想再見她一面XD\n另外50%比較認真，是給已經看過過去作品的人的彩蛋\n希望他們有「啊，我知道這個人耶！」的感覺\n\
  至於實際上是不是同一個人\n只能說不可能\n因為2013年正是雪野在東京上演言葉之庭的時候\n九月她離職就回老家愛媛了，實在不可能十月馬上跑去飛驒教書\n反正只是個彩蛋囉\n\
  \n\n6.繭五郎的大火\n把文獻燒光，連宮水家都燒死一票人\n所以沒人知道連同最後一次滅村\n隕石總共撞了糸守村三次\n兩千四百年前掉在山頂\n就是御神體所在的那個地方\n\
  推測御神體其實就是彗星的碎片\n一千兩百年前又來一次，這次造成糸守湖\n僅存的村人在御神體畫下彗星的壁畫\n然後改信仰對象，從象徵彗星的龍神改成綑綁龍神的組紐\n\
  並在巫女舞蹈的最後加入暗示彗星分裂的動作\n然而大火把這些資訊都燒掉只剩形式\n所以也沒人知道秋祭原來的目的是為了讓村人在那一天遠離村莊\n反而當成一般的祭典了\n\
  宮水家的交換身體能力\n瀧推測就是為了躲過這次災難\n（更詳細可以往下看推文的解釋，這裡塞不下sorry）\n\n7.三葉(in瀧)幫奧寺前輩縫裙子的時候縫了一隻刺蝟\n\
  三葉自己的背包也掛了一隻刺蝟玩偶\n連筆記本的封面還有手機殼的圖案也都是刺蝟\n\n8.雙方在臉上寫字互罵的時候\n三葉的頭髮不是馬尾，而是那個複雜髮型，只有三葉本人會綁\n\
  而且只有瀧本人會把組紐綁在手上\n所以他們沒有交換，是本人\n他們為了罵對方只好先委屈自己\n而且在不知道哪天會交換的狀況下就先寫ww\n\n9.現在電影裡的前前前世\n\
  其實不是當初的電影版本，而是後來寫的完整版\n當初的電影版本已經配合畫面做好後\n新海誠聽到完整版的歌詞非常喜歡\n決定換完整版，為此還把三葉跟瀧交換的日常各砍了一天\n\
  電影原聲帶內名字有“movie ver.”的那首前前前世並沒有在電影裡出現\nRADWIMPS十一月的新專輯才會收錄目前電影內的前前前世\n\n10.素描課的時候\n\
  應該是畫花瓶的靜物素描\n但是瀧(in三葉)畫的是糸守湖的風景\n對喜歡建築的他來說鄉下的風景很吸引他的目光\n所以之後他有辦法只憑印象把糸守湖的素描重現\n\
  另外瀧在畫糸守湖的時候，桌上擺著建築師資格考試參考書\n\n11.瀧(in三葉)打籃球的時候沒穿胸罩\n原因是他不會穿\n之後被三葉訓了一遍，下次交換的時候只好拜託沙耶香幫他\n\
  然後跟勅使討論單手解開胸罩的方法\n晚上拿三葉的胸罩練習後直接倒頭就睡\n以上這些三葉全部都知道XD\n(這裡也有其他人寫！請看 )\n\n12.跟前輩約會的早上瀧為什麼在流淚?\n\
  因為是前一天晚上敲定約會行程的三葉(in瀧)流的\n她把自己喜歡的人(瀧)推給別人(前輩)\n換回來之後三葉早上醒來\n對著鏡子才發現自己還在哭\n\n13.飛驒坐新幹線到東京\n\
  加上轉車單程要四個多小時，票價一萬五左右\n三葉真的是下了很大的決心去找瀧\n也因此瀧認不出她時的打擊會這麼大\n三萬日幣對鄉下女高中生來說實在不是小錢\n加上來回坐車時間八小時以上\n\
  結果你他媽不認得老娘(x\n還有，初中時的瀧手上拿的單字卡\n上面寫著“I am looking for my counterpart.”\n就在你面前啊傻孩子。\n\
  \n14.爸爸離家去選町長的原因在外傳小說有提到\n是因為妻子二葉去世時\n他人多少都會安慰說節哀順變啊，辛苦你了啊之類的\n但是村民的態度反而是她的死是理所當然的，沒有太多悲傷\n\
  爸爸覺得圍繞著宮水信仰的這個村莊太莫名其妙\n所以打算改革村莊的風氣\n妻子去世前曾跟他說一切都會在正確的位置上\n其中就包含他成為町長，可以下令村民去避難這件事\n\
  （更詳細劇情有人寫了！ 請看  ）\n\n15.交換時身體的主人的記憶也在體內\n只是需要喚醒\n所以瀧(in三葉)聽四葉說姐姐妳昨天去東京之後\n先想起三葉體內去東京的記憶\n\
  再想起自己初中遇到三葉的記憶\n\n\n\n\n16.在黃昏山頂上，瀧把組紐還給三葉\n三葉把它綁在頭上問瀧感想時\n瀧真心覺得不好看但還是說好話，被三葉看穿了\n\
  另外三葉的組紐，正中間的藍白色區塊象徵著彗星\n分兩邊紅色的尾端則是分裂\n\n17.勅使完全相信三葉的原因有三個\n第一、他本身就喜歡玄學的東西\n他去炸變電所的時候\n\
  包包裡面放著他之前給三葉看的神秘學雜誌《姆大陸》\n第二、三葉的身分是村裡流傳千年的神社家系\n第三、他喜歡三葉\n哪部份比較重要，不好說\n另外在片頭曲前的彗星畫面，糸守燈火通明\n\
  到了後來的墜落場景，一片漆黑\n是在顯示這邊勅使炸了變電所\n\n18.沙耶香不只是因為消去法才負責廣播\n她的姊姊在役所擔任播音員\n片頭的村莊廣播就是她姊\n\
  因為聲音很像所以被拜託去學校放送假避難消息\n順便一提役所放送沙耶香說的是假消息的時候\n站在男性播音員背後的臭臉女性就是她姊\n妹妹捅婁子姊姊一定覺得很丟臉\n\
  \n19.兩個人擦肩而過的時候是下著雪的冬天\n重逢的時間是櫻花盛開的春天\n所以不是五年後的2021，而是2022年初\n瀧這時已經成功找到工作了\n也就是說這小兩口翹班在東京跑了一個早上，翹的好！\n\
  \n20.重逢時的三葉脖子上戴著星型的項鍊\n無名指上沒有戒指\n重複一次，完全沒有戒指\n大家可以安心回家啦\n\n—————\n推文補充\n我猜是仰望半月的夜空？\
  \ 也是部好作品呢\n—————\n\n22.很多很多很多人提到的年份問題\n電影中他們的日記真的沒有寫年份……\n三葉(in瀧)第一次去瀧的教室時\n門上有貼2016年的海報，但她沒注意\n\
  瀧(in三葉)去放口嚼酒的那一天\n他也以為是上學日才穿制服被四葉糾正\n所以他們真的沒發現時間差\n至少沒有足夠的線索讓他們發現\n\n\n以上這些，幾乎都是出自於朋友的想法\n\
  而他在日本看了5次電影+日本討論區+設定集+本篇小說+外傳小說\n我只負責整理跟貼文，哪一個是出自於哪邊其實也不確定\n所以乾脆只在最後一次聲明XD\n\n希望大家在看完電影與本篇文章後都能感到開心\n\
  有任何疑問也都可以提出來，完畢！\n\n\n--\n\n肯定不合理\n雖然沒有天文學相關知識\n不過彗星三次都撞在同一個地方機率是天文數字\n所以彗星撞地球是超自然現象\n\
  新聞中有一句台詞\n“彗星分裂這件事事前完全沒有預兆，推測是彗星內部發生異狀”\n也可以做為佐證\n至於慧星這麼喜歡糸守村的原因？　只有它自己知道XD\n\n\n\
  隔了1200年也不算很常啦\n第一次撞是在2400年前(西元前387年)，人死光了\n那個時候的人也跟現在的糸守沒關係\n幾百年後(西元446年)有信仰“星神-天香香背男”的人們搬來這個被砸過的地方\n\
  誰知道再過幾百年，也就是現在的1200年前(西元813年)，這群人又被砸了\n他們覺得被星神背叛，所以改信曾在日本神話中降伏星神的“倭文神-建葉槌命”\n建葉槌命在日本民間被視為紡織之神\n\
  糸守的名字也是這樣來的，以糸(紡織物)來守護\n\n以上年份是用電影災害記錄內，宮水神社的年代是446~2013推出來的\n而各種神的名字是來自小說\n\n\n\
  村人從以前就知道，二葉能夠知道未來，大小事都問她\n因此她死時也不太意外\n丈夫在她病時本來想強制帶她去大醫院\n但二葉以這是天命拒絕了，只跟丈夫說還會再見面的\n\
  妻子這樣村民也那樣，他才會覺得莫名其妙\n在二葉死後離家去選町長（後接14點）\n所以結論二葉換身體跟丈夫沒救他似乎沒什麼關係\n不過二葉死了，三葉他爸才會選町長\n\
  才能在最後叫人去避難\n媽媽妳也知道太多事太厲害了吧(x\n\n\n多謝提供，今天二刷發現真的一樣XDD\n可是也確定是不同天，大概是鄉下小孩衣服少(x\n\n\
  \n兩人無名指都有戒指沒錯\n不過沒特別說這兩人是不是在一起\n這點就任憑各位想像囉\n\n\n對耶是初中制服！  已在上方補充了\n\n\n感謝補充，加到文章中了！\n\
  \n\n我才不會說是因為有你的疑問推文\n我才在上方加入括號補充的呢\n\n\n是呀，她在片尾名單是寫ユキちゃん（yukichan，通常譯為小雪）\n因為時間空間上的不可能\n\
  她才不被稱為雪野，而是小雪\n但新海都說老師是言葉之庭的女主角了，那就這樣吧XD\n\n\n改了，多謝！\n只看兩次果然還是看不完各種細節XD\n\n    \
  \                                 11/11 18:19"
