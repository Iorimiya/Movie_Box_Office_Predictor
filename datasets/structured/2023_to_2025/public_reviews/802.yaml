url: https://www.ptt.cc/bbs/movie/M.1476414580.A.D6D.html
title: 'Re: [普雷] 你的名字。是不是過譽了？'
content: '手機回文。 小弟一丁點淺見









  防雷






  防雷





  原因很簡單。 因為你先看過小說了

  所以會有這種感覺。其實一點都不奇怪


  小說跟電影在鋪陳架構跟敘述技巧上是截然不同的


  電影注重在運鏡技巧 即時的情緒反應

  刪掉大部分細節的重點帶動


  例如運鏡技巧為例。

  常用的方法是左右中或者右左中

  拉近 拉遠   瞬間情緒的打斷跟連結


  並運用這些技巧 帶動瞬間的情緒反應


  細節並不重要

  重點是一氣呵成一次完成起承轉合


  最大的原因是。電影只有一兩個小時

  不會有時間讓你仔細推敲分析每個人的內心世界


  所以重點通常會刻意集中


  原po有提到原著中テッシー有許多的內心掙扎

  怎麼可能馬上答應去做。


  然而看電影時會有一種代入感

  當主角著急的想要完成一件任務時

  觀眾也會化身為主角。（沒錯 當下看電影的每個人都變成三葉了）

  跟主角一起努力想辦法解決事件。

  思考的角度會跟主角同步


  如果這時候切換成テッシー的角度

  代入感就會瞬間不見

  下次要切回來。就要更多的能量 或者不可能

  緊張感也會失去

  起承轉合的情緒節奏。也會參雜進另一人的起承轉合而混亂

  你可以腦中模擬看看如果加入那一段進電影的話

  你情緒會怎麼變化？ 至少對我而言後面就有點不順了



  而這部片最大的轉是在吃高山拉麵時

  被店長一瞬間告知小町被滅村的事實


  如果你事先就知道滅村的話

  你的情緒又何來此''轉''呢？

  前面30多分鐘的鋪陳你又怎可能被釣到呢？

  這也是為何電影要防雷的原因


  你只有一次被釣的機會 而你用在小說上了


  反過來看

  看小說時你會有很多知道細節的時間

  可能像是巫女口嚼酒的製作過程

  其他人的內心情緒反應

  東京的繁華 小鎮的落後

  甚至是支線人物的小故事

  你都可以躺在床上

  花好幾個小時細細品味 推敲字句

  甚至是腦中模擬場景

  這些在短短一兩個小時的電影裡面是做不到的


  而當你腦中模擬過場景細節後

  看電影時自然會有種落差感


  怎麼跟我想的差那麼多！ 好爛喔

  應該要怎麼樣怎麼樣才對嘛


  遙想N年前哈利波特大紅大紫的時候

  電影剛出來也是被罵翻。

  我也覺得有夠難看 怎麼都不一樣

  還有人製作電影跟小說不同錯誤的XX個點


  不過小弟覺得我當年應該是重點放錯了（汗）


  一點老梗 一點淺見。請不要鞭太用力 感謝各位













  -----

  Sent from JPTT on my iPhone


  --'
