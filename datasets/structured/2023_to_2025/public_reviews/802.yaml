title: '[好雷]你的名字 詩文影評'
content: '有雷









  <你的名字>



  鄉下巫女初長成，都心少年心苦悶。


  忽爾一日舉止變，竟是兩人互換魂。


  揉胸裝娘善裁縫，前輩感情漸升溫。


  手機日記相往來，日復一日依賴深。


  飛驒星落喻原爆，系守消亡故人墳。


  眾裡尋她千百度，最愛原是夢裡人。


  靈光乍現口嚼酒，逢魔時刻奇蹟存。


  階梯交錯知君名，宮水神社結繩捆。


  --'
