url: https://www.ptt.cc/bbs/movie/M.1626843265.A.B5B.html
title: '[情報] 美國真人版《你的名字。》再換導演！《夢想之地》導演退出'
content: "根據 Deadline 的最新獨家報導指出，原要指導好萊塢真人版《你的名字。》的奧斯卡提\n名韓裔美國導演 Lee Isaac Chung 離開了這項計畫。\n\
  \n\n\n由派拉蒙影業和 J.J. Abrams 的製作公司 Bad Robot 所合製的《你的名字。》美國真人\n版電影在去年九月時找到了導演人選，為近期以《夢想之地》崛起的韓裔導演\
  \ Lee Isaac\n Chung，而後他在今年也因此片同時提名了奧斯卡最佳導演與原創劇本獎。\n\n然而，在今天的報導中指出，導演因為檔期衝突決議退出該項計畫。在去年底的時候，Var\n\
  iety 曾報導過 Lee Isaac Chung 已經和《夢想之地》的製作公司 Plan B 以及 MGM 簽訂\n了下一部片的合約，很有可能是因為此片而放棄執導《你的名字。》。\n\
  \n\n\nLee Isaac Chung 與 Plan B 再度合作的未命名新片是一部浪漫愛情電影，描述一位在紐\n約大公司中幹著苦差事而對人生失去方向的年輕男子，他愛上了一位來自香港的漂亮女生\n\
  ，交往後的兩人因為男方害怕安定下來而提出分手。男子發了狂似的開始尋找自己，卻發\n現這位香港女生就是他的真愛，然而當他意識到此事的時候已經為時已晚，因此決定前往\n\
  香港把女生追回。\n\n根據知情人士表示，派拉蒙正在積極尋找新的導演人選，並且已經和幾個潛在的人選進行\n聯繫。編劇的方面，最初劇本是由《異星入境》編劇 Eric\
  \ Heisserer 執筆，而後改由《\n愛情昏迷中》編劇 Emily V. Gordon 編寫新版的劇本草稿，原本將由導演 Lee Isaac Chu\n\
  ng 負責改寫最後的劇本，但目前在導演退出後應該會再有變動。\n\n\n\n美國真人版《你的名字。》將由 J.J. Abrams 和原動畫版的製片川村元気擔任製作人，日\n\
  本方面將由東寶發行，派拉蒙則會負責國際其他地區的發行。\n\n這並非《你的名字。》第一次換導演，最初原是由《蜘蛛人：驚奇再起》系列和《戀夏(50\n0日)》的導演\
  \ Marc Webb 執導，之後才換為 Lee Isaac Chung。\n\n\n\n--\n                              \
  \          07/21 13:03"
