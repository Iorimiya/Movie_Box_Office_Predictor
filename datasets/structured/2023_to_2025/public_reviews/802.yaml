url: https://www.ptt.cc/bbs/movie/M.1478495613.A.D4F.html
title: '[新聞] 帝國電影雜誌給予「你的名字。」滿分評價'
content: '新聞網址：


  「你的名字。」雖然預定明年第一季度才會在美國正式上映，


  不過在今年12月「你的名字。」將會在洛杉磯地區進行限定上映，


  期望能夠趕及時間入圍第89屆奧斯卡


  而



  《帝國》雜誌是英國銷量最高的電影雜誌，


  在12月號中《帝國》雜誌為新海誠的「你的名字。」打出了5分的最高分，


  而且編輯在評論中也盛讚新海誠，帝國雜誌寫到，


  「，


  而且新海誠也很有機會獲得明年年初頒發的奧斯卡最佳外國電影，


  或者是最佳動畫獎項，甚至是同時獲得兩項大獎」



  對「你的名字。」來說，能夠被奧斯卡最佳外國電影和最佳動畫兩個獎項提名，


  就挺好機會也很大[Sic]。但考慮到今年上半年的迪士尼動畫《動物方城市》，


  在口碑和票房上的瘋狂(總票房收入超過10億美元，打入全球總票房收入第24名)，


  「你的名字。」要得獎最佳動畫還是有難度的。



  至於和宮崎駿平起平坐的問題，


  要看新海誠日後製作出的作品票房、人氣還有評價情況才好說


  這次電影雜誌《帝國》對「你的名字。」的超高評價，


  大概新海誠自己看到也會有點驚訝


  ------------------------------分隔線------------------------------------



  截圖是翻拍雜誌評論內文，目前帝國電影雜誌的網站上還找不到評論，


  可能是最新一期的內容還不會放在網站上


  --




  --'
