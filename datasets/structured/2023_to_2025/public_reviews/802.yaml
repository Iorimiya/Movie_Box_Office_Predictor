url: https://www.ptt.cc/bbs/movie/M.1481542271.A.09B.html
title: '[好雷] 《你的名字。》落入地面的哀愁...'
content: '開場的靈魂互換劇情，讓我眼淚一直停不下來。


  三葉和四葉穿著巫女的衣服跳舞的身影十分美麗，但徒留形式傳統已不被理解；而瀧健康

  靈活的身體在東京的西餐廳忙裡忙外，不時也要面對滿懷惡意的奧客。但透過三葉的眼睛

  ，東京的亮麗豐富如此耀眼；而在瀧的讚嘆聲中，山林秀麗神秘的景色宛如新生。


  故作粗俗的用詞，和精心編弄的髮辮，構成了一個正常的男孩女孩的生活。但去除掉這些

  ，他們卻各自變成更有趣、更有魅力的人。只是當我們扮演我們自己的時候，平凡從眾才

  是生存法則。


  因為看到了人生的侷限性、現實與夢的落差，儘管處處是破綻與笑點，卻使我感到濃濃的

  哀愁。當兩人各自留下眼淚的那一幕，我感覺與其說是為了彼此，更像是因為失落了另一

  個人生而哭。


  比較可惜的是，隨著小鎮拯救行動的展開，那股哀愁彷彿流星墜地似的落入凡間。大概是

  因為電影前半並沒有讓我強烈地感覺到他們彼此喜歡，當看到瀧用掌心的字向三葉告白，

  三葉前往東京尋找瀧的身影，故事的走向讓我不禁懷疑究竟是自己的感受力有誤還是作者

  自相矛盾。結果不知不覺發現眼淚已經乾了，只是睜著眼睛把劇情看完而已。


  說一點不值一提的感覺……彷彿是因為動畫非現實的本質，使得有一股力量不得不把它拉

  住、收束住。另一方面來說，也許動畫更直接的表現了某些真實。讓我想起很久以前看的

  《千年女優》。相較之下，真人電影因為維持著真人的表象，反而可以採取更幻想式的展

  開。或者另一方面來說，是不得已的曖昧。讓我想起詭異的《戀愛植男》，和《被遺忘的

  新娘》。主要是講日影，對不起我看過的電影不多啦所以……


  --'
