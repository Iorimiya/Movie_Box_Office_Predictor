url: https://www.ptt.cc/bbs/movie/M.1754223519.A.293.html
title: '[好雷]《一念菩提》，暗潮洶湧的家，成了國家的縮影。'
content: '部落格版：


  原本有在台北電影節買到場次，可惜後來臨時有事只好放掉，幸好台灣有片商代理，趁著

  本週上映場次最多直接買票進場，總算補完本屆奧斯卡最佳國際影片的五部入圍作品。雖

  然相信事前大多數人、包括我在內，都認為如果不是爭議延燒，那麼入圍十三項、打破非

  英語電影提名紀錄的《璀璨女人夢》是不太可能在最後翻盤敗給巴西代表《我依然在此》

  。但實際看完五部作品後，反而會想《璀璨女人夢》輸給哪部似乎都不意外，因為其他四

  部作品質量明顯都勝過《璀璨女人夢》。我是喜歡《璀璨女人夢》的，只是沒想到我會更

  喜歡其他四部。先不與另外三部比，同樣片長長達兩個多小時的《一念菩提》，或許娛樂

  性遠遠不及，然而其強烈的議題性與充滿後勁的結尾，都讓人著迷於其劇情，更重要的是

  《一念菩提》不會讓人覺得電影太長了。


  《一念菩提》儘管掛名代表德國參賽奧斯卡，說的卻是出身伊朗的導演穆罕默德拉素羅夫

  自己國家的事。如同導演過去曾遭伊朗法院以意圖顛覆國家、危害國家安全等罪名判刑入

  獄，最後不得不離開伊朗、流亡歐洲，《一念菩提》中剛上大學的蕾絲凡與妹妹莎娜，同

  樣用行動支持她們所認為對的事，用微小卻堅毅的語氣否定那些錯的事，哪怕站在他們對

  面的是培養自己的國家、養育自己父親，每項被強加在他們身上的指控與罪名，是他們對

  改變與改革的渴望、對自由的爭取、對神權政治與傳統父權的反抗。導演穆罕默德拉素羅

  夫的電影就是那把下落不明的槍，伊朗政府與父親伊曼害怕的，是電影與槍會成為反抗他

  們的力量、對他們握有的權力造成威脅，於是他們追殺、他們審問，不容許任何挑戰與異

  端份子存在，哪怕對象是自己的妻子與女兒。唯有這樣才能夠維持著他們在這個國家與家

  庭的崇高地位。



  《一念菩提》將發生於2022年的艾米尼示威或稱頭巾革命為故事背景，年僅22歲的庫德族

  女子瑪莎艾米尼因違反著裝規範遭到逮捕，並在兩天後於醫院過世，當時有目擊民眾宣稱

  瑪莎遭到警方毆打，然而警方不僅否認此一指控，更對外表示瑪莎死因爲中風。警方此聲

  明點燃民眾怒火，於首都德黑蘭展為起點在各地展開示威運動，政府方面則迅速展開武力

  鎮壓且實施全面的網路封鎖，許多公司與學校受到影響，數百位參與或沒有參與示威運動

  的民眾於此期間死亡，政府將示威民眾稱為暴徒，而這些示威運動則是暴亂。伊朗捏造各

  種理由如自殺、車禍意外，卻從未讓家屬與人民知道真實的死因。許多人認為這場革命從

  很早之前就開始醞釀，是直至瑪莎艾米尼過世才終於爆發，伊朗人民從簡單人權訴求、對

  女性權利的爭取，到後來怒火高升高喊推翻政府...


  「因為你就在體制內，你信仰這個體制，你不惜一切代價也要維持它。」


  政府對人民的說謊，伊曼對家人的隱瞞，說是他們想要保護人民與家人，但其實他們從來

  就只是擔心與恐懼在人民與家人知道他們正在做的事情後，會反對、會質疑、會告訴他們

  「你們錯了」。權力握久了都會害怕失去，於是他們封鎖真相、操弄真相，告訴人民、告

  訴女兒他們都被洗腦了，他們應該遠離那些會危害他們的有毒資訊與暴徒。只是所謂當局

  者迷旁觀者清，不願看清真相的到底是誰？身為體制裡一份子的伊曼，早已聽不進任何與

  其信仰相違背的言論，他不是看不見真相與事實，而是伊曼眼中的真相從過去到現在、甚

  至未來都只會有一個。而當身為調查法官的伊曼的個資在網路上被公布，他聽從同事的建

  議帶著妻女離開德黑蘭、保管她們的手機，回到奶奶家說要暫避風頭，可直到他架起過去

  用來記錄一家美好回憶的攝影機、要妻子與女兒坐在鏡頭前，承認自己犯下的偷槍罪行時

  ，觀眾於是明白伊曼更想做的原來是奪回自己在這個家中的威權。



  「我一直不讓妳們見到妳們父親的這一面。」


  父親伊曼成長於的傳統體制，母親納吉梅同樣也是。出生傳統的她，同樣早已對一切感到

  習慣，她或許從未想過女性無時無刻都要帶著頭巾有什麼不對，也從來都不覺得服從男性

  有什麼問題，這樣的她自然無法理解女兒們的想法，也不懂年輕世代對未來的看法，她只

  知道要站在丈夫這邊、要女兒多為父親著想，即使她恐懼丈夫擁有的那把槍，也只能選擇

  接受並將之收好。納吉梅夾在丈夫與女兒的中間無所適從，她剛開始都是站在伊曼立場想

  ，更為了丈夫賞女兒巴掌，然而隨著劇情推進，觀眾能夠清楚看見納吉梅的轉變，在她後

  來的每句話與每個動作都能感受到她的矛盾，她告訴自己女兒們是錯的，可心裡她卻逐漸

  認為女兒們是對的。直至伊曼將她們母女軟禁，納吉梅這才意識到過去的她像個沒有自我

  的傀儡，而現在再不起身幫助女兒這樣的年輕世代反抗傳統威權，這個家、這個國家將會

  永遠軟禁她們。


  《一念菩提》長卻不冗長，導演穆罕默德拉素羅夫用一個家的暗潮洶湧與權力消長，來道

  出存在於伊朗這個國家的問題。儘管碰觸到敏感的政治議題與抗爭運動，但《一念菩提》

  卻不難看懂，那些藏於電影裡的隱喻不會造成觀眾觀影上的困難。時而穿插著的真實影像

  ，讓電影充滿張力與真實感，特別是在知道伊朗這個國家正面臨著的問題後，更讓這部電

  影顯得格外珍貴。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
