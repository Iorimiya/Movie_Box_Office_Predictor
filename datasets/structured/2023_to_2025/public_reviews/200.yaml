url: https://www.ptt.cc/bbs/movie/M.1754003438.A.04F.html
title: '[好雷] 一念菩提'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《一念菩提》好雷短評：她不再閉上雙眼\n\
  \n■ 無雷推薦語（不超過片介跟預告）\n\n\n\n\n\n（以下有雷）\n\n整部電影由菩提樹的比喻開頭。菩提樹\n的種子由飛鳥帶往各地，寄生其他植物，直到完全將對方吞噬。\n\
  \n在本片裡，菩提樹的概念在真相和威權兩方通用。\n\n■ 真相的滲透\n\n故事裡的父親任職於政府部門，即將被提拔升遷。一家四口的美好生活，被新認識的朋友\n\
  和手機裡的短影音打破。\n\n一名女孩的死，在電視和手機上呈現截然不同的真相。這些短影音的畫面，讓兩個女兒對\n政府的信任產生動搖。\n\n到後來朋友賽達芙無辜捲入，永久失去了雙眼。血滲過頭巾，接觸到母親的肌膚，流向洗\n\
  手槽。\n\n一切早已存在的暴行，再也無法忽視。\n\n\n\n■ 威權的滲入\n\n「再怎樣，都不該懷疑家人吧？」\n\n極端政府對人民的操控手段，並不是拿來保護家人，而是完全用於鞏固既得利益。\n\
  \n當手槍（反抗的力量）遺失，加上家裡開始出現的反對聲音。家內被放入不安的因素，根\n基開始搖晃。\n\n一道道底線被不斷打破，從審問、錄影到監禁。\n\n夜路走多了，總有天會遇到鬼。父親得面對自己的良心譴責（後來已經內化），還要面對\n\
  外界可能的報復。\n\n\n\n■ 希望的種子\n\n最後，小女兒賽娜手握手槍，認清現實起身反抗父親。\n\n當她們勇敢舉起手槍，正面迎戰威權，覺醒與革命的號角才真正展開。\n\
  \n不再囿於親情、假新聞的假象，她們選擇正視周遭實際發生的每個故事。\n\n她們都是蘊含潛力的種子。\n.\n《一念菩提》對台灣人最大的共鳴，應該是再次扒開白色恐怖的傷痕。\n\
  \n上位者控制你的思想、生活，反叛者努力用自己的力量傳遞事實和真相。\n\n《一念菩提》塑造最成功的，便是兩股力量在家中的消長，以及不斷變動轉移的心理壓力\n\
  。\n\n利益與良心的對抗下，他們的立場不斷扭轉，後來趨於堅定。因為在這世道下，模稜兩可\n，反而會被兩邊都貼上不利標籤。\n\n於是我們陷入集體妄想的瘋狂狀態。被威權的手緊掐時，安撫自己沒事；發生不利情勢時\n\
  ，懷疑身邊出現背叛小人。\n\n這是一場由下至上的戰爭，在人物的內心、家庭到國家，時刻牽動神經。\n\n事實早就不再重要。\n\n\n\n網頁好讀版>> \n\
  –\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n圖片來源 ／ 好威映象\n\n--\n前後都滿喜歡的～\n\
  後半真的讓人屏住呼吸"
