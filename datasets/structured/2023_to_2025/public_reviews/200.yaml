url: https://www.ptt.cc/bbs/movie/M.1760321206.A.189.html
title: '[好雷] 一念菩提The Seed of the Sacred Fig'
content: '1. 劇本寫得很好，讓整個故事在相對少的埸景中發揮出最大的張力。細節非常到位，四

  位主角的演出亦令人敬佩。


  2. 表面上是一個保守德黑蘭家庭父權崩解的過程，但真正要說的明顯是那個像是背景卻

  深深影響故事的那些抗爭活動、暴力鎮壓、隱藏真相的媒體與不公平審判。那批判的力道

  直接且有力到令人擔心導演本人的安危。


  3. 個人最欣賞的是片中對「說謊」、「欺騙」的描繪。在體制之中，各種「不得不」到

  「只能」到「非...不可」。絕不是匆匆忙忙、連滾帶爬，而是走一步算一步，就變成了一

  個幾週以前無法想象的自己。


  4. 至於社群媒體是不是像電影中呈現的如此「正面」，我沒辦法那麼肯定，不過，可以

  確定的是，如果沒有手機與社群，這些地方發生的事情，將更難被傳開和留下。這部電影

  用了這些影像，像《一部未完成的電影》留下了那些影像一樣。

  5. 很喜歡電影中女兒戴上黑色眼罩被審的那張海報，喜歡那段展現的義意：伊朗的國家

  制度底下工作，就像是蒙著眼一樣，你能看到的只有一點點，並且你知道你被蒙著，只是

  自欺欺人。


  6. 片中女性要會的事也太多了吧！雖然不知道是不是都如此，但想想我父母的時代，媽

  媽真的會很多事情。


  7. 主角一家的西式房屋裝潢、廚俱家俱、桌上時常放的可樂，配合他們保有文化傳統的

  思想、飲食、信仰。細節隱喻可說是令我著了迷。




  ***


  這裡是我的樂園:




  --'
