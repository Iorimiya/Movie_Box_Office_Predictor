url: https://www.ptt.cc/bbs/movie/M.1690164080.A.69A.html
title: '[討論] 鬼郵輪-瑪麗皇后號的船長身份是誰？'
content: '如題，現代線中的船長/保安的身份，當主角破牆


  的時候船長同步遭到傷害，所以他的身份是皇后號


  本身？


  原本我想他會不會是人柱，但是如果他也是被囚禁


  的靈魂應該會想辦法離開船而不是待在那。



  有些疑問


  1.船長帶女主導覽的時候看到牆上的面板感到驚訝


  為什麼？



  2.船長想讓女主帶小孩回到船上的原因？


  是因為賈姬的靈魂脫逃讓鬼媽媽抓狂讓船長頭痛


  嗎？


  3.到當船長以為會被警察逮捕時想自殺的原因為什


  麼？


  如果船長是船的意志，他自殺是想拋棄肉體嗎？


  ----

  Sent from  on my Google Pixel 4


  --'
