url: https://www.ptt.cc/bbs/movie/M.1742742110.A.525.html
title: '[普好雷] 給我一首琴的時間-時機的浪漫變奏'
content: '原文>>>


  改編自二十年前周杰倫與桂綸鎂主演的《不能說的楝絞K》，在對原版記憶已經有些模糊

  的情況下，《給我一首琴的時間》讓影迷重溫了一場熟悉的回憶殺，韓國版本以獨特的風

  格，重新譜寫了一段跨越時空的愛戀。


  擅長營造愛情氛圍的韓國，還有都敬秀、元眞兒的純情演出，《給我一首琴的時間》很能

  讓人沉浸在戀愛的氛圍中，彷彿重新談了一場熟悉的戀愛。劇情大致忠於原作，卻不只是

  照本宣科，和近來的《聽說》一樣，都是有走出自己風格的改編作品。


  --------------------------


  「愛情裡，時機最重要。」


  裴晟佑飾演的父親輕描淡寫說出的這句話，道出了整部電影的核心。愛情從來不只是兩人

  相遇就能順理成章地成立，決定一切的往往是時機。


  雖然緣分看似自然而然就發生，但其實發生的機率是微乎其微，何時遇見、如何相識，決

  定的是時機。想想在茫茫人海中能遇到彼此，而且如果是在對的時機相遇，在一開始可以

  留下好的印象，就會有更高機率繼續發展。更多互動後累積起好感、發現彼此興趣相投、

  價值觀相近、又能喜歡上彼此，從機率的角度來看這是多麼難的一件事！


  不僅是相識的開始，愛情的維繫更是關乎時機。安排能記上一輩子的驚喜、令人心動的生

  活小細節，甚至是吵架後需要道歉、有觀念上的摩擦需要磨合，這些都能決定一段感情是

  否能繼續走下去。只要時機對了，好的事能錦上添花，不好的事能迎刃而解，能扭轉局勢

  的是時機。


  最近剛看完一部戀愛實境秀《離線找真愛》，節目以命運為主題，也在強調時機在愛情中

  的重要性。製作單位將10個人送到法國尼斯，並沒收他們的手機，讓他們在陌生的街頭「

  碰巧」遇見彼此。光是這一段就非常考驗時機，這樣的碰巧相遇更容易被視為命中注定，

  為日後的發展蒙上名為命運的美麗濾鏡。


  再來製作單位會給每個人一份設計好的約會行程，讓他們去邀約喜歡的人一起出遊，到這

  邊更是由時機影響著大局，因為邀約的先後順序會左右感情走向，畢竟感情這件事是有明

  顯的先進者優勢，如果先來了場美好的約會，那後面就很難再改變心意去喜歡上別人，所

  以有些人因為時機的不巧，就錯失了一段姻緣。


  無論是《給我一首琴的時間》還是《離線找真愛》，都值得一看。或許這類作品如此迷人

  的原因，是因為時機總是難以捉摸，所以當我們在螢幕前看到掌握到時機的瞬間，就算明

  知道是劇本設計好的情節，仍會不自覺地心動吧。


  --'
