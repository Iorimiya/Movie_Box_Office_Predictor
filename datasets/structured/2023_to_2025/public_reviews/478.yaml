title: '[  雷] 給我一首琴的時間'
content: "雷文防雷資訊頁\n雖然劇情各位應該都知道了但是還是防雷一下好了\n \n \n \n \n \n \n \n \n \n \n \n \n \n\
  \ \n \n-------------------------------\n對於這個改編，主觀評價\n雖然不到滿分，至少也有高分\n \n \n劇情沒怎麼改動\n\
  把高中生換成大學生，也讓蹺課更合理\n \n鬥琴的地方，就是兩個人專心的互相彈琴，少了主持人烘托，對決的刺激感稍微下降。\n \n \n最後拆除場景，大鐵球換成挖土機真的覺得太弱了。我還是喜歡大鐵球。\n\
  \ \n鋼琴方面還是有講究的，德國比賽現場就用Steinway & Sons，家裡就放KAWAI，\n學校用YAMAHA"
