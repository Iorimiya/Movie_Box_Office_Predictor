url: https://www.ptt.cc/bbs/movie/M.1698223096.A.4EE.html
title: '[普好雷] 片名不行，誆世巨作：蜘蛛窩新宇宙'
content: '昨天去看 雖然是偏遠的美麗華 但人數真的是很少就兩個

  片子本身還不錯~ 但我真的覺得是被片名誤導


  電影本身確實有喜劇戲謔成分 但他本質還是部嚴肅的作品

  我猜車庫是想弄成有點像多元宇宙的感覺結果搭上海報整個變浮誇

  感覺就變成一個在騙人拍片的的搞笑片~ 照原名"蜘蛛網/蜘蛛窩"

  然後用劇情片方向去宣傳 應該會比現在好不少~感覺本來車庫對這部票房期待很高的


  回到電影本身 他有一些明顯的缺點 有時候喜劇化的處理有點太無俚頭

  偏偏他本質是嚴肅的... 對我主要說的就是鄭雨盛客串那段 太浮誇了啦


  然後嚴格說來 片長可以再短一點 有些枝微末節太多了

  另外就是剪接 也有再更細膩的空間


  不過本質上他仍是好看的 首先 演員群很強

  大多數是硬底子 所以轉換在嚴素跟喜劇之間都不錯

  特別意外的是很久沒看鄭秀晶演戲 以前是Krystal的粉絲

  但她一開始演的真的不行~ 可是這部片相信會有人跟我有類似想法

  角色上發揮最出色最吸睛的 反而是她 她是主要角色中最晚出場的

  但幾乎她出場後(出場第一幕真的有夠漂亮) 焦點跟劇情都跟著她走了

  掛比較前面的林秀晶跟全汝彬反而後面沒啥特別戲分 被另一位秀晶搶光風采


  另一點 除了劇中劇的關係值得玩味外 主要這部電影相當呈現了"對電影的愛"

  看了新聞 是有參考韓國名導"金綺泳"當年怎麼在困苦艱難下拍電影的故事

  呈現了宋康昊導演角色想拍好電影的熱誠 卻又帶入人的黑暗面 以及片場拍片的荒謬


  但所以某程度我比普好雷更感謝這部片 因為他讓我更深刻的去查金導演的作品跟事蹟

  然後真覺得是一位好值得認識的導演 很多很屌的作品跟事蹟


  希望之後金馬或哪個城市焦點影人 可以上他的專題呀!


  --'
