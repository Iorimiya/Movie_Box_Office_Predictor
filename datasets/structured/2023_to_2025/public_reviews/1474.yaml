title: '[好雷] 複製愛情The One I Love(2014)'
content: "超好看的啊啊啊啊啊啊!!!!\n  一開始以為是夫妻失和再復合過程的電影，沒想到沒那麼單純啊啊啊啊\n  如果描述了劇情整個就雷光光了，所以就不說了(完全廢文mode)\n\
  \n  因為板上沒有任何一篇相關文，\n  我只能發廢文來記錄一下這部電影，推廣兼尋找同樣看過有感想的板友了QAQ\n\n  只能說三句話：\n\n  1.Ted\
  \ Danson帥翻了(雖然只有5分鐘不到)\n\n  2.喜歡小成本製作有質感的電影，可以看一下。\n\n  3.你所以為深愛的人，你真的認識他嗎？\n\n\n\
  --\n\n  They say when you meet the love of your life,\n  time stops, and that's\
  \ true.\n  What they don't tell you is when it starts again,\n  it moves extra fast\
  \ to catch up.\n                                                        ---Big Fish\
  \ (2003)---\n\n--"
