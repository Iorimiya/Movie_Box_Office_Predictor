url: https://www.ptt.cc/bbs/movie/M.1729707602.A.A42.html
title: '[好雷] 她死了 很好看但為什麼沒人說有螞蟻... '
content: '我覺得看這部有一個很重要很重要的事要跟大家說

  裡面會出現一些「螞蟻」畫面，而且還是特寫！！！

  而且開始沒多久就有，我真的會瘋

  但我頭已經洗下去，所以硬著頭皮看到螞蟻就快轉地看完這部


  防雷







  前面劇情真的很精彩，而且男女主本身都有病的人設很有趣

  滿喜歡這種倒敘手法配合主角的旁白來帶出劇情

  雖然還是有一些無法細想的bug

  例如女主做的所有事都沒被監視器拍到嗎

  男主跟蹤她被發現，但男主完全沒發現有人跟蹤他之類的

  最後結局也很意想不到

  本以為會是俗套的男主出獄後重獲新生的劇情

  結果女警官告訴他 他不是受害者而是罪犯，不是出獄就是贖完罪了

  這才真的是給那些自以為只是犯點小錯的人最好的警示啊！

  而且最後一個畫面停留在他的臉並且被按讚

  完全呼應了前面女主說的大家只是想看你有多不幸並且希望你完蛋


  總之真的好好看，申惠善好會演而且好美

  最近好喜歡看主角是肖渣某的劇XD 有這種劇的歡迎推給我

  不過我一直很好奇，女主只憑自己力量就吊死一個成年男性

  這是有可能的嗎，她看起來很瘦欸！


  --'
