title: '[無雷]  她死了，緊湊好看'
content: '不到兩個小時的內容很好看


  前面開開心心演到一半之後，畫風突變


  節奏突然變得很緊湊又緊張刺激


  申惠善這一部的演技真的是沒話說


  絕對是她從影以來演的最好的作品


  建議去看的時候白紙一張


  連預告片與劇情簡介都不要看


  裡面有一些意想不到的部分


  這樣才能享受到最大的樂趣


  -----

  Sent from JPTT on my Google Pixel 6a.


  --'
