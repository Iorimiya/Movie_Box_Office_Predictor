title: '[失望雷] 錢不夠用3：全部夠用'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  以下正文

  今天是京站特別場，真的特別開心1x年過去了，還有機會看到這個系列更新，還能看到這

  些兒時的星加坡明星在螢幕上活躍，觀後在導演的介紹環節時，有說大概10年會出一次這

  個系列，做一個大概大環境的結論故事，如果演員還在會請他們回來演，舉手發問環節沒

  有選到我。

  我一直想問個問題：

  第一集賣假磁磚跑路害主角被大耳窿追殺的台灣人、第二集賣花粉，吃死人被大耳窿追殺

  時，有提到要台灣那邊出證明說花粉沒問題（所以應該可以假設花粉是台灣賣過去），那

  個每集騙主角的臺灣人還在嗎？還是跟大耳窿專業戶一樣過世了？為什麼第三集沒有請台

  灣人來騙主角？

  有沒有大神知道，為什麼這次沒有台灣人這個角色？害主角只能自己作死，連破產後，還

  有辦法偷藏1千多萬讓女兒去捐錢


  -----

  Sent from JPTT on my iPhone


  --'
