url: https://www.ptt.cc/bbs/movie/M.1634248216.A.559.html
title: '[新聞] 型男變野獸！雷恩葛斯林將演《狼人》'
content: "型男變野獸！雷恩葛斯林將演《狼人》\n\n 葛大維\n\n\n《樂來越愛你》大帥哥雷恩葛斯林從影以來將首度「變臉」！《隱形人》製片傑森布倫接\n\
  受影視媒體「Collider」專訪，證實與雷恩葛斯林共同籌拍新版《狼人》（The Wolfman\n），正式取得重拍授權後，即可開始編劇。\n\n《狼人》電影多次被搬上銀幕，除了1941年由小朗錢尼主演的版本之外，2010年更有由《\n\
  美國隊長》（2011年）喬強斯頓執導，班尼奇歐戴托羅、安東尼霍普金斯、艾蜜莉布朗合\n演的《狼嚎再起》，可惜該片耗資1.5億美元，票房與影評都不如預期。\n\n\
  去年上映的《隱形人》成本700萬美元，全球票房超過1.3億美元，堪稱「小兵立大功」，\n讓製片傑森布倫萌生重拍《狼人》的想法，尤其更獲得雷恩葛斯林的支持。\n\n\
  好萊塢目前掀起重拍風，環球公司在1930—1940年代拍的多部怪物片都將重新翻拍，據影\n視媒體「SCREENRANT」報導：趙婷對重拍《吸血鬼德古拉》，感興趣溫子仁對重拍《科學\n\
  怪人》感興趣，但他們都尚未公開證實，反而是雷恩葛斯林演《狼人》先曝光。\n\n雷恩葛斯林從影以來，除了2017年的《銀翼殺手2049》，很少演要在綠幕前演出再後製特\n\
  效的電影；據報導，他曾推掉《自殺突擊隊》的小丑（後來由傑瑞雷托取代），更推掉和\n艾瑪華森合演《美女與野獸》（後來由《唐頓莊園》影集丹史蒂文斯取代）。\n\n\
  《狼人》有什麼吸引雷恩葛斯林的地方？目前還沒有聽到他本人說明。雷恩葛斯林的下部\n新片是與美國隊長克里斯伊凡合演《灰色人》（暫名），成本超過2億美元！是製拍夯爆\n\
  全球韓劇《魷魚遊戲》的串流平台Netflix投入製拍電影以來的最大手筆，映期未定。（\n圖／美聯社）\n\n\n\n新聞網址：\n\n\n--"
