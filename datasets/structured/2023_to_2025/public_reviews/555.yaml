url: https://www.ptt.cc/bbs/movie/M.1476677328.A.008.html
title: '[新聞] 環球將邀請《浴血任務》編劇修改狼人劇本'
content: '好像很久沒有好看的狼人電影了？


  2010年的《狼嚎再起》真是災難一場




  新聞網址：



  據美國媒體《好萊塢報導者》（The Hollywood Reporter）報導，環球影業將邀請《浴血

  任務》（The Expendables）編劇大衛·卡拉哈姆（Dave Callaham）來為《狼人》（The

  Wolf Man）修改劇本，這部電影是環球影業1941電影《狼人》（The Wolf Man）的重啟版

  。



  環球影業正逐步建構「環球怪物電影宇宙」（Universal Monsters Cinematic Universe

  ），他們計畫推出一系列早期經典怪物電影的重啟版，並讓這些怪物生活在同一個虛構宇

  宙內。除了狼人之外，還會有吸血鬼、木乃伊、半魚人、隱形人和科學怪人等。



  「環球怪物電影宇宙」的第一部電影是2014年的《德古拉：永咒傳奇》（Dracula Untold

  ），將著是要在2017年上映的重啟版《神鬼傳奇》（The Mummy），這部電影將由湯姆·

  克魯斯（Tom Cruise）主演、艾力克斯·寇茲曼康特（Alex Kurtzman）執導，艾力克斯

  ·寇茲曼康特同時也是「環球怪物電影宇宙」的總監製。



  最早負責撰寫這部《狼人》電影劇本的是《私法爭鋒》（Prisoners）編劇亞倫·葛茲考

  斯基（Aaron Guzikowski）。在1941年版本的故事裡，小朗·錢尼（Lon Chaney, Jr.）

  飾演的男主角回到家鄉，卻意外遭到狼人攻擊，之後他也變成了狼人。



  這部全新的《狼人》目前上映日期未定。


  --'
