title: '[新聞] 亞倫強森接任下一代「狼人'
content: '亞倫強森接任下一代「狼人」、和莉莉蘿絲戴普主演《狼人》新重拍版！《諾斯費拉圖》

  組合再聚



  今年一月時，《女巫》（The VVitch）導演-勞勃艾格斯（Robert Eggers）曾傳出要替環

  球影業籌拍新一部「狼人」電影《Werwulf》，而今天外媒《Nexus Point News》則爆料

  ，亞倫泰勒強森（Aaron Taylor-Johnson）、莉莉蘿絲戴普（Lily-Rose Depp）已加入演

  出，強森將扮演狼人，戴普則飾演他妻子。


  強森和戴普不久前才一起主演了艾格斯執導的經典舊片翻拍《吸血鬼：諾斯費拉圖》（No

  sferatu），該片同樣由環球發行，在去年聖誕節檔期頗熱賣，以 5000 多萬美元的中型

  成本，取得了 1.81億美元的亮眼票房。


  《Werwulf》由艾格斯執導、並身兼共同編劇，與艾格斯合寫過《北方人》（The Northma

  n）劇本的 Sjon，也會繼續與他合撰此片，替艾格斯一連監製過《女巫》、《燈塔》（Th

  e Lighthouse）、上一部《諾斯費拉圖》的《哈利波特》（Harry Potter）頭兩集導演-

  克里斯哥倫布（Chris Columbus），還有哥倫布的女兒艾蓮娜哥倫布（Eleanor Columbus

  ），也都確定繼續擔任製片人。


  《Werwulf》已排定 2026 年聖誕節上映，更多選角結果會陸續定案，並於今年九月正式

  開拍，以趕赴明年底檔期。




  --'
