title: '[新聞]《暮光之城》「狼人」Taylor Lautner 回憶'
content: "新聞網址：\n\n《暮光之城》「狼人」Taylor Lautner 回憶過去爆紅時期：「當時都有 12 台車跟著我\n！」\n\n同名小說改編而成的電影《暮光之城》（Twilight）在\
  \ 2008 年首先上映，當時在全球掀\n起了一陣「吸血鬼狂熱」，直接捧紅了男主角「愛德華」羅伯派汀森（Robert Pattinson\n）飾演及女主角「貝拉」克莉絲汀史都華（Kristen\
  \ Stewart）飾演，此外當然也別忘記\n還有「狼人」雅各布雷克（Jacob Black）。\n\n在《暮光之城》系列電影中飾演「狼人」雅各的美國演員泰勒洛納（Taylor\
  \ Lautner），\n因為其性感的形象及默默保護女角的深情，讓許多影迷深陷於他的魅力下。同時也因為《\n暮光之城》電影的爆紅，導致當年僅 16 歲的他就已經嚐到成名滋味。今回因為他所主演\n\
  的 NETFLIX 新片《我的主場隊》（Home Team）讓他又成為了媒體對焦的焦點，也順勢地\n談起過去的事蹟。\n\n泰勒洛納回憶過去紅遍全球的時刻裡說道：「在生命裡不是所有事情都能在一夜之間改變\n\
  ，但名氣可以！當我 16－18 歲時起床後想要出門散個步的時候，我家外面總會有多達\n 12 輛車在等著我。\n\n而且不論我出現在哪個地方或是機場，總是會有成千上萬的粉絲尖叫。」而他也坦言這樣\n\
  的改變曾讓他無法接受：「從那時候開始，一切變得讓人沮喪，因為我只想過正常的生活\n。」\n\n--"
