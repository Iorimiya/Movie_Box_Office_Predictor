url: https://www.ptt.cc/bbs/movie/M.1490595935.A.9FC.html
title: '[好雷] 決戰異世界：弒血之戰 - 狼人 > 吸血鬼'
content: "吸血鬼到底是怎麼能支撐這麼久的阿?\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n1.怕陽光，白天戰力=0。即使躲在家裡，狼人派幾個拆家工人就能將吸血鬼戰力降到最低\n\
  2.怕龍葵，被抹一下就會死，即使是高階吸血鬼也會因此陷入麻痺狀態\n\n光以上這2點就能打的吸血鬼嫑嫑，但吸血鬼還是存活了數千年... 這開掛吧~(°□ 。)~\n\
  \n=====\n\n作品優點:\n1.凱特·貝琴薩，可是說是為了她才看的\n2.拉娜·普拉芙，演得很棒，很完美的詮釋一位想上位的邪氣BB... 大姊姊\n3.席歐·詹姆士，帥氣小鮮肉\n\
  \n有趣的鏡頭:\n1.薩米拉三不五時的事業線跟換裝秀\n2.莎倫娜死而復生後，披上一件白衣颯爽登場，此時我想到的是\n3.薩米拉大戰前的洗白... 這翻臉比翻書還快(ˊ_>ˋ)\n\
  4.查爾斯·丹普西飾演的湯瑪士。一直會想到冰與火的泰溫...\n\n--\n三位地位顯赫之人坐在一個房間，一位是國王，一位是僧侶，最後一位則是富翁。有個傭\n\
  兵站在他們中間，此人出身寒微，亦無甚才具。每位顯赫之人都命令他殺死另外兩人。\n：『。』\n：『。』\n：『。』\n                     \
  \                     『』\n\n--"
