url: https://www.ptt.cc/bbs/movie/M.1489501360.A.827.html
title: 'Re: [問片] 把自己雙手綁在樹幹的狼人片'
content: '我是不知道片名，但因為全部看完，所以全部記起來，我依照腦海播放的影像說給你聽。


  一開始是一名伐木工在深夜拿伐木機器鋸齒刀伐巨大檜木，然後他聽到一聲狼嚎後就被神謎物體拖到旁邊，然後悽慘大叫後於森林死去。


  接著就是原潑所講的劇情，只是狼人是女主角的弟弟，也是片中小孩的舅舅，他是去羅馬尼亞森林探險後被野狼咬傷後，就出現這樣惡魔折磨，而他還保持人性，於晚上獨自留在森林過夜，盡量不傷害他人。


  而他回姐姐家，主要是希望能夠靠親情的力量來挽救自己的人性，因此一開始還跟姐姐提醒他們母子不要深夜去外面，還說就算熊只有兩百公斤，也會殺死人的。


  只是天算不如人算，因為姐姐看到弟弟經常晚上到外流浪，因此擔心他而外出，偏偏他們母子的狼狗早在跟舅舅見面時，就因聞到他身上的狼味而有超級警戒心，而且經常打攪舅舅的行為。


  最後就是姐姐親眼目睹弟弟變成狼人，然後準備要殺死他時，狼狗從收容所逃出，急忙救出姐姐，也把狼人咬成重傷，讓狼人負傷而逃。


  結局是狼狗發現身受重傷的弟弟，準備要咬死他，而狼人也就默默站著，被狼狗咬死，讓觀眾留下悲泣的無奈。


  最讓我感傷的是姐姐在發現弟弟的信中，看到弟弟因克制不助自己的獸性而留下無助悲哀的字語，那段讓我看了非常想哭。


  --'
