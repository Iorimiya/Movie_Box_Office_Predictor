url: https://www.ptt.cc/bbs/movie/M.1413368976.A.0CB.html
title: '[負雷] 狼人鎮'
content: '因為去看五星主廚的時候看到預告片

  感覺好像不錯所以去看了電影


  結果





  防雷



  整部片動機薄弱

  圍繞著血統跟仇恨

  最後本來的壞人又沒這麼壞

  好像是好人的又變成人渣

  劇情的前後矛盾就不多說了

  導演就只是想編一個理由出來殺死大魔王

  然後又怕觀眾覺得太膚淺硬凹了一個原因給觀眾

  結果顯得更蠢



  化妝技術爛透

  連哥吉拉綱鐵人X戰警都拍得出來的現代

  用90年代的化妝技術拍這部片


  所有狼人表情僵硬

  根本不是用特效直接用化妝省成本

  這樣也就算了


  這部片的狼人真的很鳥

  感覺不是狼人,就只是美女與野獸裡面的那隻野獸



  虧我還是因為預告片看到馬王才去看電影的

  這部片連去租DVD回來看都不需要

  把時間拿來睡覺還比較實在


  --'
