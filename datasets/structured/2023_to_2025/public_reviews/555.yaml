url: https://www.ptt.cc/bbs/movie/M.1582773013.A.A24.html
title: '[新聞] 傳電影公司鎖定艾瑪史東主演女版《狼人》'
content: '傳電影公司鎖定奧斯卡影后主演女版《狼人》




  在舊片重啟的科幻驚悚恐怖片《隱形人》賣出叫好又叫座的票房與口碑之後，也讓環球電

  影公司有意繼續重啟旗下怪物經典系列的其他作品。



  近日，現在，電影公

  司也改弦易轍，從原本想仿效迪士尼打造漫威電影宇宙的跨片連結拍片模式，改成推出各

  自獨立的怪物電影新作。





  而根據熟悉內幕的消息人士指出，電影公司目前已經鎖定以《樂來越愛你》拿下奧斯卡影

  后大獎的好萊塢新生代女星。



  目前電影公司正在發展這部女版《狼人》電影，外界並不清楚相關劇情細節，不過根據消

  息人士的說法，

  。




  史東目前尚未與電影公司簽約，不過這位奧斯卡影后似乎對於這個角色很有興趣。而史東

  的下一部新作則是迪士尼真人版重啟的《庫伊拉》。






  --'
