url: https://www.ptt.cc/bbs/movie/M.1540404558.A.D04.html
title: '[問片] 一部有關泰山或是狼人的電影'
content: '如題


  忘記主角確實的身分了


  但就是那種上半身全裸的造型





  然後這部片蠻鏘的 是個搞笑片


  但確定不是布蘭登費雪的泰山


  劇情走勢是類似遠征隊 主角一群人有個目的

  (是啥目的我忘了..但好像有個大魔王 會魔法的那種)_


  然後就一路跋山涉水 最後大魔王好像被他們打到地洞裡還啥


  主角以為魔王死了開心離開


  然後鏡頭拍向地洞裡 裡面又傳出魔王說話的聲音

  (電影應該是到這邊結束...吧 印象很模糊請見諒)






  電影有印象的部分還有女主角好像穿得蠻少的胸部很大


  另外主角群裡面還有一個是黑人


  中途主角一行人碰到一個住在帳篷裡、像是女巫的角色


  黑人本來就認識這女巫的樣子


  好像主角群有跟這個女巫鬥嘴還是幹嘛的


  接下來只留下黑人一個人 其他人都到了帳篷外


  黑人一開始蠻火大的樣子


  但女巫開始挑逗黑人然後兩個人就開始開心的喇舌(真的很鏘)





  主要角色裡面好像還有一隻獅子的樣子

  (這個我非常不確定 只是好像有這個印象但不是必要條件)



  記得的大概就這些垃圾資訊...有神通廣大的版友知道這是哪部片嗎? 感謝~


  --'
