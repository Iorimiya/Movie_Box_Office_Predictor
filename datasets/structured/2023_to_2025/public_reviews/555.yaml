title: '[討論] 所以安德魯加菲貓是鐵了心要騙粉絲嗎'
content: "今年五月安德魯加菲貓表示\n\n「這真的有夠瘋狂哪。老兄，這對我來說真的他Ｘ地太搞笑了，因為這就像......我自己\n\n  也有Twitter的帳號，而我一直看到蜘蛛人成為人們熱烈討論的話題，大家為了某件事\n\
  \n  情全都像著了魔一樣！而我則是......各位，各位，各位，各位......我真的很希望自\n\n  己能和每個人說：我建議各位好好冷靜下來。聽好了，我只能代表我自己，我無法為任\n\
  \n  何人代言──或許他們有在規劃某些事情，但我並沒有接到任何通知。\n\n你知道那就像什麼感覺嗎？畢竟我還沒有在訪談裡談過這個。\n\n你有玩過『狼人殺』（Werewolf）這個遊戲嗎？或是『殺手』（Mafia）？你知道那個遊\n\
  \n戲是怎麼回事，而我覺得這兩者的感覺是很類似的。你努力說服所有人自己並不是殺手..\n\n我覺得自己就像是在玩一場他Ｘ的『狼人殺』或『殺手』一樣，而我真的不是狼人啊！」\n\
  \n\n而近日流出的片場照裡\n\n\n\n卻有看到安德魯的身影\n\n--"
