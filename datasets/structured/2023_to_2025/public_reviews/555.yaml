url: https://www.ptt.cc/bbs/movie/M.1616600841.A.74D.html
title: '[好雷] 適合孩子看的《100%小狼人》'
content: '雷文防雷資訊頁



  討論度真的好低，不過家中五歲兒看得很愉快～

  想陪孩子看電影還是可以看一下:)



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~






  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  《100%小狼人》（100% Wolf）是部關於尋找自我的溫馨喜劇動畫片，選在過年後的月圓

  之日上映，實在很適時！故事描述狼人家族的接班人福來弟，在變身之夜變成一隻與狼形

  象全然迥異的貴賓狗，不僅自己難以置信，更無法被狼群接受，必須在下個變身之夜來臨

  時證明自己是頭狼，否則將遭到族人驅逐。



  片中狼人的設定是在黑夜中進行團體救援、如同打火英雄般的英勇角色，不知為何與狗為

  敵，兩種分明與狐狸、豺狼同屬於「犬科」的物種相互敵視排斥，亦拒絕理解對方。直到

  福來弟變狗，不得不向狗兒學著以這樣的面貌求生存，漸漸發現其優點與長處，開啟友誼

  之門；相反的，力求篡位的叔叔以攻擊、乃至全面撲滅狗狗的極端手段試圖贏得眾心，誰

  才適合狼人王的位置？答案早已呼之欲出。


  這樣的劇情令人忍不住一直想到《獅子王》，但對孩子來說本片更淺顯易懂，且更加歡樂

  ──不僅老爸沒死，壞叔叔最後獲得的懲罰也僅是遛狗撿大便。而超級違和的迷你體型

  Ella姊癲狂得好笑，和善奶奶型的管家為了小主人換上勁裝重機出動超有一套；不懂與人

  相處的超怪冰淇淋哥雖然一心撲殺狼人，卻也不是真正的壞人，純粹出於想為男孩報仇，

  且初次出場就能知道雖然他一直跟唯一的布偶朋友說話，卻也願在深夜僻壤為了救孩子不

  惜冒險挺身而出，這種勇氣即便是正常人也不一定擁有。



  回到主角福來弟，以男孩姿態生活了十幾年準備變身，正是進入青春期之際，原本殷切期

  盼化為父親形象──高大威猛的「理想自我」，然而「現實自我」竟成為天差地遠的嬌小

  貴賓，巨大的落差無可避免地造成強烈的自我懷疑、出現自我認同危機。青少年若無法自

  我認同，很容易因角色混淆而失去自制力與安定感，小貴賓從最初的抗拒相信、焦躁地想

  找出辦法，透過友伴的幫助與自身勇氣磕磕絆絆一路往前衝，終於向父親、向族人證明自

  己長大了，足以獨當一面，也接受了自己的樣子，清楚知道自己是誰。其他幾個值得特別

  提醒孩子注意並好好記得的點如下：


  一、人云亦云不一定正確──狼人與狗相互厭惡，討厭對方的種種缺點都來自「聽說」，

  大家太輕易就因長期聽到的謠言而排斥彼此，殊不知實際相處之後根本不是那樣。


  二、道貌岸然的叔叔──壞人不一定很張揚醒目，他們懂得偽裝，常常可能是身邊的人。

  寶貝需時時保有危機意識、相信直覺，不要輕易信任他人，面對懷疑的對象更不一定非得

  聽話，對不合理、令自己不適的要求勇敢說「不」！


  三、怪裡怪氣的冰淇淋叔叔──看起來怪怪的人不一定就是壞人，小心別輕率地以二分法

  去評斷他人。即使在片中這個會與布偶說話、又不停想抓狗、抓狼人的角色顯得陰陽怪氣

  ，孩子觀影後也一心認定他就是壞人，但可以引導思考冰淇淋叔叔為何試圖撲殺狼人？看

  清楚他的動機，發現原來是場誤會，男孩根本沒死，他便放下與狼人的對立，並與狼人家

  族成為朋友。


  四、父母對孩子的愛是不變的──天下父母無不望子成龍、望女成鳳，當福霸看見福來弟

  居然變成他過去厭惡、看不起的狗狗，先是無法接受，卻也很快就給了福來弟接納的擁抱

  ；看見他交到不同族群的朋友也愛屋及烏，最終為愛子驕傲。不管你成了什麼樣子，重要

  的是你也愛自己、認同自己，父母的愛不會變，即使並非他們最初期待的樣子。



  陪著孩子看了中文配音，主角福來弟有些片段的聲音略顯生澀突兀而讓人小小出戲，不過

  大多都能呈現應有水準，也算得上五堅情（陳零九、邱鋒澤、黃偉晉、賴晏駒和婁峻碩）

  在電影配音的初試啼聲就有不錯表現。比較可惜的是，劇情最後萬眾矚目的變身爆點頗弱

  ，但尚稱得上呼應其父的告誡：想要成為狼人王，重要的是要有寬大的心！真的轉變為巨

  獸或許更不搭軋。即使劇情容易預測，但趣味性十足且富教育意義，仍是部非常適合帶孩

  子共享的溫馨動畫電影。


  --



  --'
