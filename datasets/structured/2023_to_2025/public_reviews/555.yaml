url: https://www.ptt.cc/bbs/movie/M.1470978860.A.748.html
title: '[討論] 巨石強森可能演出環球怪物聯盟電影狼人'
content: '自從漫威創造了一個獨一無二的宇宙觀之後，許多電影公司也正在積極打造屬於自己的電

  影系列，不論是 DC 影業正在發展的另一條超級英雄電影世界觀，或是《變形金剛》（

  Transformers）正在推動的「變形金剛作者房」，都可以看出電影公司對於搶票房的野心

  。環球影業目前也正在組織超強智囊團打造「怪物聯盟」（Monsters Universe），首推

  的是由艾力克斯柯茲曼執導的全新重開機《神鬼傳奇》（The Mummy），前陣子也釋出消

  息表示電影公司目前鎖定羅素克洛演出《變身怪醫》（Dr. Jekyll and Mr. Hyde）裡面

  的經典角色。

  日前根據 Deadline 的報導，傳聞巨石強森（Dwayne Johnson）將會加入湯姆克魯斯（

  Tom Cruise）、強尼戴普（Johnny Depp）的陣容，一起在「怪物聯盟」的系列電影中演

  出。




  不過儘管巨石強森會是票房的保證，這個大忙人的檔期可是非常滿，除了救災救人的《加

  州大地震2》（San Andreas 2）、《玩命關頭8》（Fast 8）以及正在拍攝的《海灘遊俠

  》（Baywatch）以外，巨石強森與凱文哈特（Kevin Hart）也傳聞加入《野蠻遊戲》（

  Jumanj）的重開機版本，除此之外還有兩部《地心冒險》（Journey to the Center of

  the Earth）的續集…等，更不用提目前正在進行前期計畫的《少林之子》（Son of

  Shaolin），看起來要敲到巨石強森的檔期實在有點困難阿…。



  這卡司也太豪華了~


  --'
