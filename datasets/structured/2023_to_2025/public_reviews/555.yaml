url: https://www.ptt.cc/bbs/movie/M.1597831772.A.879.html
title: '[請益] 狼人遊戲...看不懂'
content: '最近才追狼人遊戲，其中一部片名是戀人


  規則是


  1.狼人全死，村民勝。

  2.狼人與村民同數，狼人勝。

  3.但是狼人勝時，如果戀人沒死的話，戀人與邱比特勝，村民狼人都輸。


  完全看不懂最後一次投票.....



  投票前女主承認自己與A男是狼人，並誣陷C女是戀人，但實際上女主與B女才是戀人。



  女主(狼人戀人)、A男(狼人)、B女(村民戀人)、C女(村民邱比特)、D女(村民守衛)



  女主投給C女，然後要不知道女主是戀人的同伴狼人A男也投C女，站在狼人獲勝的立場可以

  理解為什麼A男最後投給C女。


  而B女找就與女主商量過一起幹掉C女，所以當女主要求一起投C女時，也能理解B女最後投

  給C女。



  唯一不能理解的就是，為什麼....D女守衛也投C女@@，女主都說自己與B男是狼人了

  那代表BC都不是狼人，最差也是戀人，而戀人算在村民的人數，所以怎麼想，D女站村民

  的立場，無論如何都不可能投C女，一定投狼人女主或A男....


  但最後女主ABD都投C...，誰知道是為什麼啊？ 看不懂其中的奧妙


  --'
