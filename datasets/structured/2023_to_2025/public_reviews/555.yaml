url: https://www.ptt.cc/bbs/movie/M.1729692574.A.D71.html
title: '[新聞] 《狼人》動漫展釋出新預告 男主角「完成變身」震撼畫面曝'
content: '新聞網址：


  經典恐怖怪物片推出全新作品《狼人》，在日前的紐約動漫展發布最新預告。最新預告中

  ，不僅維持電影驚悚氛圍，更展現出情感層次，進一步探討由克里斯托福阿波特和茱莉亞

  加納飾演的夫妻，之間岌岌可危的婚姻。




  以影集《第22條軍規》入圍金球獎的克里斯托福阿波特接棒擔任新一代「狼人」布雷克。

  預告依舊尚未曝光「狼人」真面目，但已鋪陳家庭關係。布雷克遭不明動物襲擊後，開始

  產生變化，最終完成變身時，情感上的衝擊更加強烈。


  導演雷沃納爾先前曾執導新版《隱形人》，全球創下1.44億美金票房，作品還包括《人類

  升級》以及《陰兒房第3章：從靈開始》，此次再度大展功力，操刀這部經典怪物片。


  故事敘述曾獲金球獎提名的克里斯托福阿波特飾演布雷克，一名住在舊金山的丈夫和父親

  ，當他自己的父親失蹤並被判定死亡之後，他就繼承了他位於奧勒岡州鄉下偏遠地區的童

  年老家。當他和他事業有成的女強人妻子夏綠蒂（茱莉亞加納 飾）的婚姻逐漸走向破裂

  ，布雷克就說服夏綠蒂帶著他們年幼的女兒金潔（瑪蒂爾達佛斯 飾）一起離開城市，前

  往他的童年老家度假。


  但是當這一家人在深夜來到這座農舍時，他們突然遭到一隻看不見的怪獸攻擊，為了逃離

  危險，他們躲進農舍裡，並且將所有入口封住，而那隻怪獸則在外面徘徊。當他們驚懼地

  試圖度過漫漫長夜時，布雷克卻開始出現奇怪的舉動，而且逐漸變成一種不知名的怪物，

  於是夏綠蒂就被迫必須決定：到底是屋內的恐怖更致命，還是外面的危險更可怕？電影將

  於2025年1月17日在台上映。


  -------------------------------------




  預告看起來很不錯


  布倫屋出的片感覺可以期待一下


  --'
