url: https://www.ptt.cc/bbs/movie/M.1489496520.A.4BA.html
title: '[問片] 把自己雙手綁在樹幹的狼人片'
content: '詢問一部很久的片，印象中是叫鬼哭狼嚎，但現在搜尋起來都不是記憶中的那片。


  故事是一個住在郊區的母子，還有一頭很精明的狼犬。

  有一天小男生的叔叔來找他們，和他們相處一切都好，唯獨他堅持自己住在旅遊車中。

  中間劇情有點忘了，但大概就是那隻狼犬發現那個叔叔怪怪的，然後在月圓時發現有隻狼

  人，雙手用手銬銬在樹幹上。於是狼犬就開始防範變回人形的叔叔，甚至咬傷了他，後來

  狗狗被送走。

  小男孩晚上偷溜出去，想去收容所救牠，然後他母親也發現他弟弟的異常，後來親眼看到

  他變成狼人。

  最後，想當然狼狗跑回來救了他們…


  印象中劇情和氛圍相當扣人心弦，請問有人知道這部的名稱嗎？


  註：已找到，Bad moon ，感謝joyzoro



  --'
