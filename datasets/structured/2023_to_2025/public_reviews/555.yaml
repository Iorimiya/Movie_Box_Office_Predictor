url: https://www.ptt.cc/bbs/movie/M.1431397391.A.739.html
title: '[請益] 吸血鬼與狼人的相關電影計畫?'
content: '小弟相當喜歡吸血鬼大戰狼人題材的電影


  這系列最完整的決戰異世界1-4都看過了


  1,2集劇情背景不錯 但狼人始祖威廉出場也太少了


  變種混血麥可看似很強卻一點都不威


  另外凡赫辛的特效打鬥個人認為略勝決戰異世界系列


  (至少吸血鬼變身變很爽 異世界系列只有馬可仕會變身 狼人也帥多了)


  幕光之城系列小弟只看了一集就看不下去了


  這幾個系列 小弟覺得有個缺憾 就是強弱設定上都沒有讓兩大怪物勢均力敵


  搜尋了一下未來相關電影計畫


  決戰異世界似乎有拍五的計畫? 但第四集劇情實在不怎麼好看


  倒不如拍個馬可仕與威廉前傳 (馬可仕應該是我看過最帥的吸血鬼了)


  凡赫辛續集拖到現在遲遲沒有消息


  倒是看到環球有意拍個怪物聯盟的世界觀 吸血鬼德古拉 不知道狼人會用什麼設定


  請問還有好看的狼人吸血鬼系列或未來的開拍計畫嗎


  環球的怪物系列計畫已經出來了嗎  謝謝


  --'
