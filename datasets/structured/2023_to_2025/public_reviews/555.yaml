url: https://www.ptt.cc/bbs/movie/M.1633286253.A.A9F.html
title: '[問片] 問一部狼人片~但結局好像有點搞笑'
content: "如題   我之前在東森電影台看過一部狼人電影  美國\n\n    但應該不是大牌演員出演的\n\n    劇情好像是一對姐弟相依為命   然後都是高中生的樣子\n\
  \n    姐姐有個男生在追  弟弟好像不太爽  不過弟弟好像有女友 還是姐姐的朋友喜歡他\n\n    我忘記是誰先狼人化了   好像以弟弟視角來說  開始階段就只知道弟弟是狼人\n\
  \n    總之他們鎮上有人遇襲還是什麼的  弟弟知道有其他狼人出現了\n\n    好像關鍵是一個舞會還是什麼的\n\n    狼人後來有在舞會大鬧  弄死了一些人\n\
  \n    弟弟跑去救姐姐然後跟狼人開打\n\n    後來搞得天下大亂然後他們都跑回家   他們好像有養一隻狗\n\n    結果那位想追姐姐的男生回來  反正發現他是狼人\n\
  \n    最後在他們家互毆  幹掉那個邪惡狼人\n\n    結局好像有點搞笑  反正大家最後都開心  弟弟有跟某個女生在一起\n\n    結局好像是直接變成美國高中生校園愛情喜劇片\n\
  \n    但我記得狼人化的過程與狼人特效好像滿驚悚\n\n    有人知道這部片的片名嗎??\n\n--"
