url: https://www.ptt.cc/bbs/movie/M.1729957536.A.547.html
title: '[普雷] 《狼人夜逃殺》天黑閉眼後你想成為誰'
content: '雷文防雷資訊頁









  周末夜，和幾個陌生網友相約在VR裡，一起享受這部莫名衝上Netflix熱門的《狼人夜逃殺

  》。原本還擔心有什麼政確元素會嚴重砸鍋，沒想到就只是輕鬆家庭小品。


  電影將「狼人殺」這個經典桌遊，藉由《野蠻遊戲》的模式，重新映射到中世紀歐洲。


  並且將遊戲中各種能力角色，諸如：獵人、預言家、小女孩、女巫、小偷、狼人，巧妙對應

  著家庭成員的心境，年長的衰敗無力、被邊緣化的中年父親、總在關鍵時刻守護家庭的母親

  、仍在探索自我身分的青少年，以及稍不注意就會狂暴的孩童。


  除了各個家庭成員的關係，也藉著古今價值觀差異，呈現多元家庭組成、女權意識、種族歧

  視、同志議題，但都只是輕輕點到，並不會有DEI硬塞使劇情崩壞（崩壞的只有狼人的毛毛

  布偶裝）。它反倒更像提供一個引子，開啟家人們探討這些社會議題的機會。


  綜上所述，除了一些落拍的笑點，還有略

  嫌蹩腳的特效，我認為它是一部合格的家庭喜劇片，適合男女老少，抽空闔家共賞。



  --'
