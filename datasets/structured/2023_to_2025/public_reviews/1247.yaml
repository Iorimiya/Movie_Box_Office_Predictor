url: https://www.ptt.cc/bbs/movie/M.1742114682.A.2FF.html
title: '[好雷] 夜校女生：你仍有可把握的選擇'
content: '衝著復古情懷進電影院

  好好看，搞得我又哭又笑






  ~~~~~~~~~~~底下有雷有雷有雷 ~~~~~~~~~~~~~~~~~~~~~~~~~






  有人說現現在價值多元了這部片思想還停在當年

  但我覺得這部片利用舊時代的背景

  已經提出了某種解法



  (看看私校這個月招生考試大爆滿

  怎麼看就是二十年來沒翻轉

  只有現在不體罰學生，這個真正是進步了)




  夜校女生末尾小愛與敏敏、小愛與路克在樓梯間那段談話

  有看到影評說小愛是因為「原來我們是同一種人」而釋懷

  (我們一樣同階級嘛) 所以小愛根本就沒覺醒


  我個人不這樣看待

  片尾敏敏不是已經超直白說出答案了嗎

  敏敏說重考時被貼上落榜生的標籤，考上一女中時又改貼高材生的標籤

  而且她最後問了一句，那她到底是誰?


  這已經最直接講出最重點核心，她身上的標籤撕下來、貼上去

  所以她真正的本質是什麼? 標籤貼什麼、人就是什麼嗎?


  小愛因為敏敏而突然看懂了

  不要被標籤所惑

  (如果小愛先認識落榜生的敏敏，那麼敏敏就是不一樣的標籤

  可能在她眼裡敏敏貼上的是「失敗為成功之母」「絕地大反攻」之類)


  小愛終於認清自己要腳踏實地努力，不要再去兜弄那個假標籤了



  聯考時小愛碰到路克

  路克說「所以其實我們都是同一種人，都是要努力拼聯考的人」

  小愛笑了

  這裡我覺得路克先是在溫情回應小愛之前的傷心話(我們是不同世界的人)

  而小愛被敏敏點醒之後，她認同的價值已經改成是「努力」

  小愛開始腳踏實地讀書

  末尾，路克撕下保送生的標籤(這其實是小愛的誤解，路克自己不曾說過)

  他們二人都一樣，在同一個世界裡，是要做個努力的人




  我覺得「夜校女生」沒有拍成拒絕聯考、然後發現自己的天份跑去烹飪

  or跳街舞拿冠軍之類的，真鬆了一口氣

  (呈現價值多元，但在價值多元的現在，這樣拍又覺得是另一種樣版套路)

  畢竟多數學生都沒有對抗主流價值，走在拼升學的路上

  (以前高中拼大學，高職去就業

  現在高中拼大學，高職也要拼大學!)



  在有限的選擇下

  認清標籤的侷限，腳踏實地努力才是永遠不變最好的選擇










  --'
