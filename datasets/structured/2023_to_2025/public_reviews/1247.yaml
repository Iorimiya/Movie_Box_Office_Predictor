content: '北一女豈止不借場地

  還要求不能提到學校名

  編導為了怕事後有侵權糾紛

  校名改成一女中

  少了「北」


  這件事我的看法是

  我尊重北一女想掩蓋夜校歷史的心態

  也認同劇組在溝通過程中產生的不爽情緒

  在映後說了句「北一女對我們不友善」也無可厚非


