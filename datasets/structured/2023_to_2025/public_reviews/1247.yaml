url: https://www.ptt.cc/bbs/movie/M.1740460286.A.A31.html
title: '[負無雷] 【夜校女生】了無新意的青春情懷'
content: '‧


  所有的演員大多都非常稱職的扮演好角色，在演技上並沒有太大的問題，尤其季芹算是本

  片的MVP，無論在喜劇橋段或是身為母親的立場，她都表現的相當良好；陳妍霏與項婕如

  也都是搶眼的存在，但很可惜的是，【夜校女生】破碎與了無新意的劇情，成為國片再一

  部只想賣情懷與小情小愛之作。



  ‧


  以日夜學生桌友為主題設定，第一幕劇情的確喚起了同屬那個年代的回憶，那時缺乏便利

  的聯絡方式，日夜間部的學生利用彼此書信的方式，來拓展友誼，而劇中的陳妍霏與項婕

  如便是演出如此的角色，但也就僅此而已，把原本較為有新意的日夜校生情誼或差別劇情

  ，從中段開始逐漸被青春愛情的元素給拉走，甚至項婕如幾乎消失了一段時間，直接走向

  國片超級常見，常見到相當無聊的青春愛情劇。


  沒錯，必須很不客氣的這樣說，這樣的題材在國片市場已經算是快爛大街的存在，從兄弟

  象味全龍到五月天，從錄影帶出租店到921大地震，也許這些都曾經出現在觀眾的青春時

  刻裡，但終究只是個冷飯熱炒的題材。



  ‧


  【夜校女生】很可惜沒把日夜校之間的差別題材，好好的發揮，只是草草用幾場衝突、歧

  視，或是女主角的自卑、自以為是的帶過，並且走向更保守的校園愛情，劇情核心的互換

  身份，也只是點到為止，甚至賣情懷也賣的稍嫌不夠，友情的元素更令人覺得薄弱，唯一

  令人有感的就只有季芹對家庭感情的宣洩。


  【夜校女生】是不是部值得進場觀看的電影？如果妳曾經是北一女的學生，或是喜愛這樣

  小清新的校園愛情電影，更或者是懷念8、90年代的情懷回憶，也許適合進場觀看，只是

  我認為也許重看一次「我的少女時代」可能更好。



  ‧




  追蹤茶太郎IG




  --'
