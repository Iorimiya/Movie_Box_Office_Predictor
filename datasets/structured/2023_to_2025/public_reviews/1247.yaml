url: https://www.ptt.cc/bbs/movie/M.1741416031.A.4F1.html
title: 'Re: [新聞] 北一女生槓「夜校女生」發連署　校方.劇'
content: "北一女有回應了，而且他們手上有當天錄音檔，有溝通過拒絕原因，\n客觀聽起來很合理。看不出哪裏不友善。\n北一女校方也沒講什麼歷史只要留在校史館這種話。\n\
  劇組可能分不清在場哪些人是校方、哪些人是家長，於是一股腦恨上了。\n\n\n\n\n各位連署者，您好：\n\n我是本次連署的負責人，我已於3/7與校方確認資訊，以下是我整理出的幾點：\n\
  \n1. 學校未曾參與電影創作，也未干涉劇情內容\n‧ 近六年來，北一女未曾參與任何電影、電視節目之創作，也不會影響他人的\n   創作。\n‧ 商業電影與校務無關，學校無意介入任何劇本討論或評價電影內容。\n\
  \n2. 拒絕出借場地的決策基於客觀條件，不涉及電影內容\n‧ 因光復樓整修、校園動線複雜、高三暑輔、校園人員掌控、學生安全及社團\n   活動等因素，學校決議不提供場地。\n\
  \n3. 校方師長從未說過「夜校故事留在校史館」的言論\n‧ 針對爭議言論，校方確認當日錄音檔，證實校方師長從未說過「這個故事不\n   值得拍。」、   「\
  \ 夜校的故事就留在校史室裡面。」。當天會議過程平和\n   ，僅有一位家長在會議尾聲以個人意見發言：「夜補校就讓它是北一女極有\n   價值的歷史，那就放在博物館。不要拿出來討論。」。\n\
  ‧ 校方從未表示「這個故事不值得拍」或「夜校的故事就留在校史室裡面。」\n   ，也未曾評價夜校歷史的價值。\n\n4. 北一女珍視所有世代的傳承\n‧ 無論是日間部、夜間部、補校或少數男校友，學校皆予以尊重與珍惜，不會\n\
  \   割捨任何歷史傳承。\n\n5. 結論\n‧ 當時校園空間窘迫，無法提供場地給任何單位拍攝電影。\n‧ 學校從未否定夜校的歷史價值，也不會評價電影創作。\n\
  ‧ 針對爭議言論，校方已透過錄音檔確認，並非師長或學校官方立場。\n\n唐在揚監製可能誤會那位家長的個人發言，將其視為北一女中的官方立場。實際\n上，該家長在會議尾聲僅以個人身份表達「夜補校的歷史應留在博物館」的看法\n\
  ，並未代表學校或全體師生的意見。經錄音檔確認，北一女中從未否定夜校的歷\n史價值，也未發表過「這個故事不值得拍」的言論。學校始終尊重並珍視各世代\n的故事，不會割捨任何一部分的歷史。\n\
  \n感謝您的閱讀\n\n\n\n--\n\n--"
