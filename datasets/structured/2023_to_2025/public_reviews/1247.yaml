title: 'Re: [討論] 「夜校女生」的聯想....'
content: "再補充一下！北一女中日間部的班級有29班；本來沒有那麼多班級，因為夜間部的裁撤\n\n，才將夜間部班級合併到日間部共29班，班別都是以國字排行，分別是：忠孝仁愛信義和\n\
  \n平溫良恭儉讓禮公誠勤益書數真善莊敬嚴正樂射御,共29個班級，北一女補校班級也是國\n\n字排行：博學審問英勇，每年級共6個班級，一共18個班級，升學率大破景美女中。直逼\n\
  \n蔡前總統母校中山女高。北一女中補校每次的段考題目都難到磕牙，很多補習班解題老師\n\n也是絞盡腦汁！而北一女中日間部和北一女中補校也發生過日夜衝突，只是電影裡演得\n\
  \n太文氣了!!根據不負責任的傳說，他們也有互相打架過....怎麼打的要問編劇。結束\n\n--\n 唯我女校　寶島名高　莘莘學子　志氣凌霄\n 公誠勤毅　校訓孔昭　齊家治國　一肩雙挑\n\
  \ 修養建全人格　具備科學頭腦　\n 力行三民主義　實踐國父遺教\n 為國家盡至忠　為民族盡大孝\n 繼往開來　為我女界爭光耀    ~THE  END~\n\n\
  --"
