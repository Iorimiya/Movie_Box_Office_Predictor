  連別人的情緒感受都要干涉啊？

  你們是黨國教育遺毒還殘留在腦袋嗎？

  堅決反對劇組向北一女跟校友道歉

  他們擁有表達自身感受與情緒的權利

  他們的情緒感受不需要被囂張的北一校友審查


  --'
