url: https://www.ptt.cc/bbs/movie/M.1741016550.A.BF3.html
title: '[好雷] 夜校女生'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~









  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  高中生的生活大概就念書跟戀愛

  能拍的大概就那些

  那怎麼拍得自然不尷尬就是關鍵了

  這種兩女一男的電影要不就一個女生喜歡另一個,像藍色大門

  我在開場前半小時心裡面的警鈴一直在響

  感情實在太好了,女主角以外的兩位女生又都短髮,有點擔心會太香了

  結果後面變成兩個女生搶那個小帥哥

  這也很常見

  這種高中生青春期的電影的主角其實是當年的自己

  只要讓看的人能把當年的自己帶入那就會好看了

  整部電影沒有出現手機

  還在打有線電話

  還有漫畫店跟錄影帶店

  還有五月天,兄弟象細節滿多的

  帶出桌友也是滿有趣的部份

  兩個女生選角都很好

  男主角選角也很棒

  微微的戀愛感也完全沒有尷尬

  算是滿好看的一部青春電影

  有想起高中的自己

  推薦大家去電影院看

  至於誰有沒有幫忙其實跟電影無關

  我是自費去看的非招待(應該沒人在乎)




  --'
