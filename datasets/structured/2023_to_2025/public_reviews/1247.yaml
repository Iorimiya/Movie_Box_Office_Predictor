url: https://www.ptt.cc/bbs/movie/M.1740892910.A.1D4.html
title: '[新聞] 「北一女」消失在《夜校女生》感謝名單 '
content: '國片《夜校女生》於2月27日在台上映後，佳評如潮，近日劇組也舉辦多場映前、映後活動，與觀眾分享更多幕後的故事。


  《夜校女生》靈感是來自編劇徐慧芳聽聞的交換制服遊戲，當年北一女無論日校還是夜校，均穿著綠色制服，只以學號顏色區分，據說因此有學生藉由交換制服來自由出入校園。不過，在電影最後的感謝名單中，卻不見北一女的校名，關於這點，唐在揚監製表示：「感謝名單中沒有北一女，因為他們確實對這部電影拍攝很不友善，他們認為夜校的歷史放在校史館就好。」更補充說明，導演用了四所學校，才重建電影畫面。


  觀眾對於電影裡許多橋段都很有共鳴，映後QA時間有北一女校友分享說，她跟當時的「桌友」直到現在都還有連絡，看了電影真的很感動，很感謝導演拍這部作品；也有男同學分享，跟朋友一起來的，一起看到哭。


  片中有一段劇情是台灣的重大歷史：「921大地震」，由於部分主要演員都沒有經歷過這段，他們都是1999年以後出生的，因此有觀眾問到，他們有沒有做什麼功課，男主角邱以太表示，他有特別問爸爸一些事，才比較了解那個年代的狀況，女主角陳姸霏則談到，因為美術組真的很厲害，一進到現場，就能感受到當時的氛圍。





  有人去看了嗎


  沒電影講還不知道北一曾經有夜校


  但人家不想給拍也情有可原

  -----

  Sent from JPTT on my iPhone


  --'
