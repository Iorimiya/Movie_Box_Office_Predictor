url: https://www.ptt.cc/bbs/movie/M.1741133674.A.6A3.html
title: '[新聞] 學測放榜考生應援 《夜校女生》票房衝高'
content: '新聞網址：


  學測放榜考生應援 《夜校女生》票房衝高


  2025/03/05 05:30



  台片《夜校女生》在學測放榜後上映引起共鳴，也帶動電影創下好票房。（興揚電影提供

  ）


  〔記者許世穎／台北報導〕台片《夜校女生》在228連假引起熱烈迴響，全台上映5天票房

  突破台幣600萬，由於今年學測成績在2月25日公布，不少應屆考生在獲知成績後結伴看該

  片，還有不少畢業多年的「小綠綠」校友穿著制服一起進戲院，在廳內直接舉辦同學會，

  與項婕如一同合照，歡渡溫馨又愉快的觀影體驗。


  《夜校女生》上映以來好評不斷，監製唐在揚和導演莊景燊也率領主要演員陳姸霏、項婕

  如、邱以太、涂善存勤跑映後活動，導演莊景燊還不小心在戲院跌倒，導致眼角受傷流血

  ，讓監製唐在揚直呼：「現在拍電影真的很不容易，大家都辛苦了！也希望大家多多支持

  《夜校女生》！」


  片中涂善存飾演的錄影帶出租店店員「阿超」，是陳姸霏飾演的「小愛」最景仰的大哥哥

  ，卻時常捉弄她。涂善存解釋，其實阿超充滿善意，只是個性調皮，一度說出傷人的話，

  「我很想代替阿超對小愛說聲對不起。」最近剛滿30歲的他，粉絲們也在映後活動幫他驚

  喜慶生，讓他感動回應：「你們的用心我都收到了，希望看完《夜校女生》，大家都能帶

  著滿滿的力量回去。」






  --'
