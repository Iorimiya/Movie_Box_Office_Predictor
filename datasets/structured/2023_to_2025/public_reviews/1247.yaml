url: https://www.ptt.cc/bbs/movie/M.1741161326.A.FC5.html
title: 'Re: [新聞] 「北一女」消失在《夜校女生》感謝名單'
content: '劇組訪談，看來對北一女不是蹭，是單純的恨。


  於公，恨自己為修復式正義發聲的劇，現在的北一女居然不跟。

  於私，恨自己受害於舊學校制度的鍋，現在的北一女居然不認。


  夜校女生導演：

  「我們的編劇原本就是北一女夜補校畢業的學生，然後他是真心

  期盼能夠在北一女拍攝這部電影。我們也希望是用這樣的方式跟

  北一女借場景然後拍攝屬於他們的一段青春的故事。


  可是在我們的接洽過程當中其實北一女對我們其實沒有那麼友善

  ，因為他認為我們這個故事不值得拍。因為他覺得夜校的故事就

  讓它就留在一個校史室裡面，不值得對別人訴說。那這樣的一個

  理由確實對我們，我覺得對我們其實是很大的傷害，也很難過。

  因為我覺得我們在講的故事是要想要去呈現一個對於年輕人是很

  有正面積極的一個意義的一個片子，可是他們卻對我們並不是那

  麼友善。


  後來我們被逼的就是，我們必須把整個學校都改掉，因為如果不

  改掉，我們恐怕會有侵權的危險。對所以我們改成一女中，然後

  把畫面裡面的學號有做一些調整。那我們唯一能夠堅持留下來的

  就是綠色的制服，因為全台灣不是只有北一女是綠色的制服，還

  有台中女中是綠色制服。因為這個綠色制服也是我們原作編劇他

  最希望可以忠實呈現的。因為他說我這輩子只會寫這一部劇本，

  這是他唯一的願望。所以我們為了完成這樣跟他的約定，我們用

  了這個方式做改動。


  沒有北一女的教室學校就很麻煩的，我們就必須在全台灣找很多

  學校，最後在台北、新北、桃園，總共跑了四所學校我們才拍完

  組合起來成為現在大家看到，好像是同一所學校的一女中的一個

  樣貌。所以我們裡面的場景是由四所學校拼出來的，對包括我們

  用大量的特效顏色去做處理讓大家覺得這是在同一所學校裡面。」


  影片來源：





  心得：我覺得很像在演這齣：

  北一女：「不授權你就要被你點名公審？欠你的喔。」

  劇組：「我就當年夜校女生！妳就欠我的！妳就欠我的！」



  --'
