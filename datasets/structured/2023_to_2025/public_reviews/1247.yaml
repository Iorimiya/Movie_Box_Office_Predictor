url: https://www.ptt.cc/bbs/movie/M.1741525587.A.AB7.html
title: 'Re: [新聞] 北一女生槓「夜校女生」發連署　校方.劇'
content: "其實拍「夜校女生」就是在說北一女中的故事：感情、親情、課業、友情....的綜合。\n\n如果拍「台北一中大戰八大天王之青春歲月」；保證更有賣點與看點，可以敘述建中生\n\
  \n日夜補三校聯合的故事，三校都在建中這塊招牌之下，既\n\n能讀書又驍勇善戰，一校獨擋東方工商、西湖工商、開南高工、泰北高中、南強工商、開\n\n明商職、開平商職、強恕高中八大天王；如果加上中國海專大幹開南商工，開南商工大敗\n\
  \n虧輸等情節，肯定比「夜校女生」有賣點和看點!\n\n--\n東海東，玉山下；培新苗，吐綠芽，春風吹放自由花！(崩砰崩砰)\n為樑為棟，同支大廈，看!我們重建燦爛的新中華！\n\
  體格強，志氣大；勞不辭，苦不怕！\n樂群敬業，忘己利他，知恥力行，愛校如家，\n同學們!同學們!同學們! 努力奮鬥重建大中華！---笑傲江湖霸天下，建中宇宙最無敵！\n\
  \n--\n    這樣的話可以拍到四部曲或五部曲,征戰美國高校聯盟和日本高校聯盟....科科"
