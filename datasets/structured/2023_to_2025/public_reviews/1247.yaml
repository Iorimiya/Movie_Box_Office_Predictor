url: https://www.ptt.cc/bbs/movie/M.1756477776.A.CDE.html
title: '[討論] 「夜校女生」的聯想....'
content: "首先,「夜校女生」這部電影,勾起了我許多的回憶....\n\n1.北一女中是有夜間部的，而且是北區高中聯招的第四名，但是於民國七十四年裁撤；\n\
  \n2.北一女中補校是與建國中學補校聯合招生的，而建中夜間部也是於民國七十四年裁撤；\n\n3.北一女中補校素質非常整齊，當時的最低錄取分數是550分，升學率高達八成以上，\n\
  \n  勝過第三志願景美女中，所以當時不少錄取第三志願以下的學校同學都紛紛報考北一\n\n  女中補校；甚至考上台政清交的很多；\n\n4.建中補校相對錄取分數低至少50~60分，而且大學聯考錄取率只微微勝過復興高中；直\n\
  \n  到換了主任後，升學率幾達九成五；\n\n5.電影「夜校女生」，以年代1997年來說，說的就是北一女中補校；當時升學率超過八成\n\n  還不止。\n\n\
  --"
