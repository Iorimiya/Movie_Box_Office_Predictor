url: https://www.ptt.cc/bbs/movie/M.1741235027.A.25D.html
title: '[新聞] 不滿《夜校女生》指校方不友善　北一女'
content: '新聞網址：


  不滿《夜校女生》指校方不友善　北一女學生連署討道歉


  2025/03/05 13:16 壹蘋新聞網 / 吳惠菁 綜合報導


  【吳惠菁／綜合報導】青春校園愛情電影《夜校女生》編劇靈感來自北一女，不過近日劇

  組在映後活動透露，片尾感謝名單上沒有北一女，是因為校方對拍攝這部片很不友善，認

  為夜校的歷史放在校史館就好，對此北一女學生在網路發起連署，表達強烈不滿與譴責，

  要求《夜校女生》監製唐在揚公開說明並道歉，澄清事實，並停止任何對北一女中的不實

  言論。


  媒體日前報導唐在揚於《夜校女生》映後活動上表示：「感謝名單中沒有北一女，因為他

  們確實對這部電影拍攝很不友善，他們認為夜校的歷史放在校史館就好。」而另一段網友

  拍攝的影片，唐在揚問觀眾：「有沒有發現我們制服只繡一女中，不是北一女，片尾字幕

  什麼人都感謝了，就是沒有感謝北一女？」之後請導演莊景燊說明，莊景燊說：「在我們

  的接洽過程當中，北一女對我們其實沒有那麼友善，因為他（北一女）認為我們這個故事

  不值得拍，因為他覺得夜校的故事就讓它留在校史室裡面，不值得對別人訴說。這樣的理

  由，我覺得對我們其實是很大的傷害，也很難過，因為我覺得我們在講的故事對於年輕人

  是很有正面積極意義的，可是他們卻對我們並不是那麼友善。」


  莊景燊表示：「後來我們被逼的就是，必須把整個學校都改掉，因為如果不改掉，我們恐

  怕會有侵權的危險。所以我們改成一女中，然後把學號有做一些調整。唯一能夠堅持留下

  來就是綠色的制服，因為全台灣不是只有北一女是綠色的制服，還有台中女中是綠色制服

  。」莊景燊也說，場景是用4所學校拼起來，「沒有北一女的教室就很麻煩，我必須在全

  台找很多學校，最後在台北、新北、桃園總共跑了4所學校，拍完組合起來之後，才是大

  家現在看到感覺像是同一所學校一女中的樣貌」。


  北一女中學生則在連署聲明中表示劇組不應該製造對立，將正常協商結果扭曲為校方不友

  善，「劇組在討論後未能達成合作共識，最終遭到婉拒。拒絕是學校的正當權利，任何單

  位在取材或拍攝時，都應尊重受訪對象的意願」。


  該聲明指出：「我們認為，劇組既然未獲得授權，就應該以負責任的態度處理相關題材，

  而不是在事後貶低學校立場、製造對立。事實上，夜校的歷史確實被學校妥善保存，並未

