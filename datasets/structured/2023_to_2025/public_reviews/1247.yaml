url: https://www.ptt.cc/bbs/movie/M.1751820014.A.925.html
title: '[好雷] 夜校女生 真的好看'
content: '今天跟我女友

  去景美佳佳看二輪片

  票價是160元

  有兩部片 一部是白雪公主

  一部是夜校女生

  白雪公主我是覺得滿無聊的

  比較適合小朋友看吧

  但我女友是覺得不錯


  夜校女生

  我跟女友看完是都是滿滿的感動的

  眼淚流了很多次

  我有很強烈的代入感

  我跟女友是同年次的 70年次的

  但是她比我晚一屆

  而女主比我早一屆

  發生921地震時 我剛大學一年級

  女主是高三的時候

  女主角雖然是考上了夜校

  但也是北一女啊 我也覺得很優秀了


  =====以下有雷======防雷頁===



















  女主角出生在清寒貧窮的家庭

  爸爸不但死了 還幫兄弟做保

  然後就背債了

  女主家裡就欠銀行很多錢

  她媽媽要養兩個小孩 生活的很困難

  而且她媽媽很省

  竟然把肯德雞吃完的雞骨頭

  拿去熬雞湯

  還有母奶拿去當湯夜 去煮火鍋


  女主跟日校的女生 因為共用一個桌子

  加上有一些共通點

  然後就變成好閨蜜 一起翹課

  一起吃喝完玩樂


  女主的閨蜜又會玩又會讀書

  還加入北一女儀隊  真的很優秀

  不過後來才知道她是重考生


  女主在桌球教室打工

  認識了又高又帥又會唸書又會打籃球

  家裡還很有錢的男主

  然後因為一起打桌球關係

  漸漸發展出超友誼關係

  但女主閨蜜也喜歡男主


  後來在男主媽媽開畫展時

  女主跟女主閨蜜受邀參加畫展


  因為一些巧合下

  女主只是夜校生的事就被爆出來了

  (因為女主騙男主說她是日校生

  還是資優班的 還吸引男主喜歡她)


  女主覺得很難過 很丟臉 也很自卑

  她也瞭解到自己跟 男主

  是完全不同世界的人

  一個是天 一個是地

  一個是上流社會 一個是底層的



  看到這邊我就覺得很難過

  因為我是底層出生的人

  我家裡環境並不是很好

  爸媽如果來學校的話

  我會覺得滿丟臉的

  家裡有一些很省錢的行為

  就讓我覺得滿丟臉的


  像我是國小時

  為了省錢就穿親戚女生的花邊襪子

  還常被班上的惡霸欺負


  這部片對我來說滿有共鳴的片

  感謝導演拍這一部好片


  --'
