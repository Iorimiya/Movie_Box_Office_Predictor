url: https://www.ptt.cc/bbs/movie/M.1740986638.A.CDC.html
title: 'Re: [新聞] 「北一女」消失在《夜校女生》感謝名單 '
content: '對於北一女講這種話真的不太好


  例如鄉民的最愛，國片導演九把刀，刀大


  在拍那些年，我們一起追的女孩


  其實劇情是橫跨九把刀高中到大學的學生生活


  但是只有高中是照實在彰化精誠高中拍攝


  大學的部分因為成本的關係，最後九把刀放棄在交大拍攝


  而是在台科大、北教大、輔大等大學借用場地拍攝，


  最後九把刀一一點名這些大學致謝。


  反而這篇新聞沒看到是借用哪些學校。


  另外筆者高中的時候也有過「桌友」的經驗，


  就是那時候因為教室在一樓，


  結果每天都會從桌子飛出一堆蚊子，


  那時候才知道原來晚上蚊子都待在那邊睡覺。


  除此之外，高中其實有所謂的社團課，


  社團課的時候就會類似跑班這樣，


  大家到各自的社團教室上課，


  但是因為學校空間不足，


  有些社團教室其實就是原本普通教室。


  如果變成社團教室，勢必就會變成有其他人跑過來上課，


  自然也會坐到筆者的座位。


  曾經有同學分享過，他為了避免有人亂動抽屜，


  所以寫了張字條上面寫請勿亂動，


  社團課結束後卻被人寫上髒話之類的回應。


  所以電影終究只是電影，


  真實世界會遇到各種不同的狀況，


  而且通常不是這麼美好的。



  筆者為電影愛好者



  --'
