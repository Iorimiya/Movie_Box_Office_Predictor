title: '[新聞] 《夜校女生》票房破千萬 陳姸霏自招很欠'
content: '新聞網址：


  《夜校女生》票房破千萬 陳姸霏自招很欠揍


  2025/03/18 05:30



  季芹（右）、陳姸霏合體宣傳《夜校女生》，陳姸霏自嘲「季芹應該想揍她」。（興揚電

  影提供）


  〔記者廖俐惠／台北報導〕青春校園愛情電影《夜校女生》全台票房賣破1000萬，季芹、

  陳姸霏母女檔合體宣傳，陳姸霏卻自招很欠揍：「我媽還想問季芹姐，是不是很想揍我！

  」


  昔日青春偶像季芹此次在《夜校女生》飾演陳姸霏的媽，她大方表示沒關係，「無論是演

  媽媽或者是殺人犯，這對演員來講是一件很幸福的事情，因為可以嘗試各種不同的變化。

  」


  陳姸霏則爆料媽媽曾跟她開玩笑說，「跟芹姐在拍攝的時候，她是不是跟我一樣很想揍妳

  ？」並自招從小就是欠揍的小孩，所以在拍母女吵架那場戲的時候，才覺得小時候真的很

  不懂事，為什麼媽媽總是要規定這規定那，拍完才知道父母的用心良苦，媽媽也是看完才

  跟她告白，「小時候這樣管教，是希望姸霏少走些冤枉路。」





  --'
