title: '[新聞] 北一女生槓「夜校女生」發連署　校方.劇'
content: '新聞網址：


  北一女生槓「夜校女生」發連署　校方.劇組皆未回應


  2025/03/06 13:47


  綜合報導  / 台北市


  青春校園愛情電影「夜校女生」上週正式上映，勾起不少人青春回憶，但監製唐在揚在其

  中一場映後宣傳時表示，本片感謝名單中沒有北一女，原因是因為校方對拍攝很不友善。

  沒想到此話一出，引發北一女學生抗議，在網路連署要求道歉。不過對此，北一女校方和

  劇組截稿前都還沒有回應。


  電影「夜校女生」說：「之後這件制服就先放妳那，妳也放一套在我這，羅家敏，彭芸愛

  。」國片「夜校女生」，以1997年北一女夜校，為背景故事，兩名日夜校高中女生，因為

  交換制服遊戲發展出情誼，劇情探討升學壓力與愛情習題，電影上映後，劇組近期勤跑映

  後宣傳，和觀眾互動，沒想到這席話卻引發爭議。


  「夜校女生」監製唐在揚說：「北一女確實對這個案子不是那麼的友善，那我們也尊重了

  ，那所以我們在後面的感謝名單裡面誰都感謝了，就是沒有感謝北一女。」


  直接點名校方不夠友善，原來當初劇組在拍攝時，北一女校方，並沒有同意借場地，「夜

  校女生」監製唐在揚說：「他們居然跟我們說就是夜校的歷史，放在校史館就可以了，這

  是非常糟糕的一個說法，那所以我覺得說我們就是要把這個故事，能夠呈現出來，都是青

  春洋溢的。」


  就是這幾段話，引發北一女學生反彈，發起連署表達抗議，聲明中提到，拒絕是學校的正

  當權利，任何單位在取材或拍攝時，都應尊重受訪對象的意願，而不是在事後貶低學校立

  場製造對立，要求監製唐在揚公開說明道歉。


  截至3月6日，已經有超過2000人連署，對於爭議劇組和北一女校方，截稿前都沒有回應，

  但其實北一女過往，也曾經有租借場地給劇組使用。13年前，陳妍希主演的電影初戀風暴

  ，同樣以北一女作背景，劇中儀隊在操場表演，甚至是主角翹課出現在校門的片段，都是

  在北一女拍攝，這回夜校女生劇組因為拍攝過程發生爭議，也讓想呼應青春過往的電影訴

  求失了焦。





  --'
