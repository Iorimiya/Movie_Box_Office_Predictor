url: https://www.ptt.cc/bbs/movie/M.1740721022.A.6C3.html
title: '[好無雷] 《夜校女生》比想像中有深度的校園電影'
content: '很久沒看這麼青春的電影了XD

  原本以為這部就是單純的校園愛情片

  結果看完之後覺得根本不是那回事

  愛情算是這個年紀該有的必要元素之一

  我覺得這部談的更多的是「標籤」

  對於「夜校」的標籤、「單親」、「貧窮」、「友誼」等等的標籤


  但這就是17歲，這就是這個年紀該有的煩惱

  對未來的迷茫，還不夠成熟卻正在學習成熟的路上


  故事背景發生在1997年，女主角入學一女中的夜校

  在學習認同自我、融入團體中迷惘

  經歷過一些事件才找到屬於自己的位置、自我認同與價值。



  女主角陳姸霏是入學夜校的女生

  在學習認同自我、融入團體中迷惘

  經歷過一些事件才找到屬於自己的位置、自我認同與價值

  看似簡單，其實充滿背叛及反覆猶豫的矛盾其實也讓人在想阿

  人生朋友真的能一輩子嗎？

  成為大人的我們都知道不合的人就是散了而已

  但對於17歲的少年少女們是否會盡力讓自己不留遺憾？


  電影釋現了一個實際但很揪心的事：

  朋友會變，美好轉瞬即逝

  一次誤解，一句話沒說清楚，都可能讓你們走不回頭的路

  但感人的也是最後的和解與深深的傳達心意



  以及最重要的還是回歸默默在背後支持的家人

  電影很多情節都是女主角與母親的爭執

  很能理解母親這個角色，也可能是因為自己也是一個世俗的大人了

  能理解每一分省吃儉用都是為了給下一代更好的未來、更好的環境



  在以上這些元素的襯托下

  反到愛情線好像沒有那麼重要XDDD

  加上家境的懸殊，我一開始就沒有很看好！

  不過那種青春悸動的感覺任誰都有過吧^Q^



  總之，《夜校女生》並不是那種一般的校園電影

  它倒像是一場生活中的「去標籤化」的實際行動

  從中自我認同肯定，就不在乎外界的眼光了

  看完也帶著一些深刻反思，會思考那些選擇、那些夢想、那些曾經誤過的人和事

  都有著自己青春的影子


  哀有點惆悵但很有感觸啦！！給推



  -----

  Sent from JPTT on my Realme RMX3241.


