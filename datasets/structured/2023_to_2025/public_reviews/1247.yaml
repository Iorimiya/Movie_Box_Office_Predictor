url: https://www.ptt.cc/bbs/movie/M.1741532982.A.F04.html
title: '[普雷] 《夜校女生》現在已經2025年了老哥'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  關於《夜校女生》，暫時先不談它最近引起的爭議，單純聊一下這部電影(最後有點雷)。

  .

  看電影之前對它內容所知甚少，原本以為就是一部鎖定青少年市場的校園愛情小清新加上

  少女成長故事，不過看完才發現這印象只對了一半：它本質上確實是部以少女成長為主題

  的校園愛情電影沒錯，但它真正的受眾，看起來並不是現在跟主角年紀相仿的學生族群，

  它賣的反而是1990年代末的時代氛圍與情懷，比起年輕的學生，我想其實他們的家長或許

  更會被《夜校女生》的故事與時空背景吸引。

  .

  除了電影裡的時空背景有回憶加成之外，更重要的是，電影的故事與內容可能會造成什麼

  樣的情緒波動。我這樣說吧，這部電影的價值觀其實相當的「保守」，這是好聽點的說法

  ，事實上若拿當下的主流價值觀來審視這部電影，它甚至可以說是蠻「不合時宜的」，無

  論教育觀、感情觀、階級觀還家庭觀，《夜校女生》都過時到讓人懷疑這真是一部2025年

  的電影嗎？

  .

  以我這個千禧世代的觀眾來看，觀影過程中都不禁皺了幾次眉頭，我大概可以想像更年輕

  的觀眾看了電影中女主角與母親的對話，很有可能是會直接引起對情節安排的不滿甚至憤

  怒這樣的激烈情緒。當然我相信出現在電影中的那些故事是真實存在的，對編導來說，他

  們想要的或許僅是想要呈現當下的一個時空氛圍，而無意以現代的角度提供更進一步的思

  辨。這樣的客觀本身並沒有錯，但觀眾看完的心情也確實可能直接影響他們對這片的評價

  。

  .

  撇開電影價值觀這種比較意識形態面的問題，我自己會覺得，對我來說整部電影最大的問

  題是做為一部校園電影，它的要素實在有點過於飽滿：青澀的男女情愛、兩代的衝突與對

  話、不同階級的對立與和解(甚至還要同時處理菁英與百姓/富裕與貧窮/日校與夜校)、朋

  友間的爭風吃醋與背叛、當然最重要的考試與課業帶給學生的焦慮與壓力同樣不能少。簡

  直就是個校園電影大雜燴，彷彿它有必須在一部電影裡處理完所有青春期課題的使命感。

  .

  但就像許多貪多嚼不爛的電影一樣，這樣的龐大的文本造成的問題就是所有情節都像蜻蜓

  點水，可能都只能帶給觀眾船過水無痕的模糊印象。以電影裡有的素材來講，「桌友」這

  個日夜校學生之間才有的獨特校園生態、以及兩人互換身份、體驗不同的生活這樣《乞丐

  王子》般的情節，應該會是最點題，對觀眾來說也最新鮮有趣的部份，但隨著故事發展，

  觀眾會發現這個故事線並沒有激起多大的漣漪，它好像不是整部電影的重點，事實上，之

  後認真回想會發現，我其實根本不知道這部電影的重點到底應該擺在哪裡。

  .

  但我想這樣缺乏重點，某種程度上或許也可以將之詮釋為青春期的生命本質：當我們還是

  個高中生，多數的時候我們的人生可能也毫無重點，這是一段生命中各種矛盾的綜合體：

  我們不知天高地厚、也覺得自己無所不能；我們不知道自己要什麼，卻也覺得自己什麼都

  想要；我們覺得自己一無所有，卻又覺得我們擁有全世界的時間，要幹嘛就幹嘛。

  .

  我們任性地肆意揮霍青春，但這並非厭世的消極抵抗，事實上正好相反，而是因為做為學

  生的我們、還年輕的我們太熱愛生命了，我們什麼都想體驗、都想嘗試，我們的人生很貪

  心、很混亂、但也很快樂。就故事本身上來講，我其實還是覺得劇本若是能夠專注在一條

  故事線上絕對會更好，但我想它可能也無心插柳地捕捉到了高中生該有的可愛與活力。

  .

  電影的節奏本身是很好的，輕快而舒服，我們也能感受到劇組對於還原那個時代的用心與

  細心，但這樣的還原其實也成了對於觀眾的觀影門檻考驗：它完全沒有打算做任何解釋與

  說明，如果你對於電影裡描述的事件以及出現的人事物了解越多，那你就越能夠融入與沉

  浸，你能被勾起的回憶情感就越多。但如果你對於那個年代的所知甚少、沒有親身經歷過

  ，許多情節與對話可能會讓你看了一頭霧水─像我看完之後還是不知道凱西吊飾到底是什

  麼東西。

  .

  總的來說，《夜校女生》到底算不算是一部好電影？我自己主觀的想法是，我沒那麼愛，

  就像前面所說，它很過時，它傳遞的價值觀並沒有帶給我太正面的情緒回饋、要素過多的

  劇本也讓它顯得不夠精煉。不過我想我可能也不是這部電影最主要的目標客群，如果在那

  個年代時你剛好正值青春、如果你懷念當時的高中生活與日常、又或者你剛好也有過日夜

  校混合的求學經驗那就更好了，《夜校女生》正是為你量身打造的電影。

  .

  話說補充個我自己還挺喜歡的劇本編排好了：看故事的年代有猜出後面一定會出現921，

  但並沒有出現讓母女死一個因此才跟對方和解的老梗煽情設計，大家最後都還可以好好活

  著面對未來的人生，挺好的─不過話說回來其實搞到最後她們好像也沒真正和解就是了。

  .

  最後要說的是，男主角路克真的是派對裡的極品：在大家正嗨的時候突然宣布爸媽離婚，

  一定要在這種時候告訴觀眾社會頂端的成功人士其實未必是表面上看起來那麼光鮮亮麗嗎

  ？電影已經要演完了，沒有任何時間空間處理你的家庭問題了老哥。


  --'
