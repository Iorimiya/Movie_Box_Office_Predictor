title: '[好雷] 她和她們的電影課'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  西亞國家本來就鮮少出現在台灣的新聞媒體，除非自己深入了解，否則除了國高中地理課

  的知識與以巴衝突、以阿戰爭之外，我們對以色列的了解可能不多，更遑論了解以色列的

  文化或觀看以色列電影。但其實，以色列的電影工業非常興盛，也已經有十部作品入圍奧

  斯卡最佳國際影片。以女性視角為主的《她和她們的電影課》也代表以色列角逐2023年的

  奧斯卡最佳國際影片。



  以色列年輕女導演羅娜接下一個電影工作坊，要指導一班素人拿起攝影機拍下自己的日常

  。雖說課堂氣氛看似輕鬆，起初卻相處得如履薄冰，光是要用阿拉伯語或希伯來語上課，

  就踩下第一顆地雷。共通的女性處境凝聚情誼與覺醒，課堂重點不再只是學習拍攝技術，

  而是如何在握住攝影機的當下，找到自己的力量。



  全片只有教室一個場景，不過，觀眾得以透過學員的鏡頭，窺探她們生活的一隅。故事內

  容主要聚焦在這八名學生與一位老師間的衝突。其中一位學員夢想著能夠考駕照，自己駕

  車自由來去，但是老公不肯。其他學員除了口頭鼓勵她之外，也積極幫她尋覓女駕訓班教

  練，希望可以讓她老公釋疑。可是，當老師在導演課程請她拍攝一段開口告知丈夫自己報

  名駕訓班的溝通過程，情緒居然一發不可收拾。不要說同學與老師帶給她開口溝通的勇氣

  ，倒不如說是激發長久以來的壓抑。



  羅娜在課餘默默剪輯大家的作品，一方面或許求好心切，一方面可能也真的被大家的作品

  感動，希望在結業影片播放的時候讓學員驚艷，並詢問她們是否願意以長片的方式呈現。

  沒想到，其中一位學員晚上不想待在家，跑來教室的時候，意外發現這件事，認為羅娜侵

  犯大家的隱私，不但自此之後不再繳交習作，還在課堂上直接公開此事，讓羅娜覺得難堪

  又尷尬。



  文化衝突更不用說，雖然以色列的猶太人口比阿拉伯人口多，但其中一名阿拉伯學員還是

  指著猶太學員說「你們才是外來的」。大家同學一場，時間一久多少有些感情，但坦承自

  己過去從來沒有阿拉伯朋友，其實也承認自己種族歧視，即便說出口時不好意思的神態已

  經解釋這完全是出於害怕，但種族與宗教衝突儼然已箭在弦上。當然，為伊斯蘭教學員每

  天五次的禮拜暫停課堂更是不能少的。



  某次課間休息的時候，羅娜的銀幕保護程式跳出來，正當大家開心地欣賞她拍攝的美麗攝

  影集，突然出現一張女女接吻的照片，眾人不僅噤聲，其中一位學員還特地觸碰電腦，讓

  銀幕保護程式能夠結束。雖說後來某次課程終於有人忍不住提問，羅娜笑說那是自己的妹

  妹，但同性戀的議題也被學員們拿出來討論一番。最年長的學員表示同性戀該死，而居住

  在船屋的學員則稱自己是雙性戀，那她是已經死亡還是死一半？其實，以色列是相對開放

  的中東國家，每年六月的同志大遊行也會吸引數萬名遊客，但思想相對保守且傳統的人還

  是存在。



  上完收音課程後的作業，是請大家錄製一段環境音，第一份作業，最年長的學員交出請老

  公錄下的自己的打呼聲，引起全班哄堂大笑。沒想到，第二份作業就是令人神經緊繃的謾

  罵，雖說錄製的同學解釋是鄰居，眾人還是很擔心音檔裡婦女的安危。錄音的學員認為，

  每次同樣的情況再次發生，都會有不同的鄰居報警，但每次警察到訪，妻子都還是會放過

  丈夫，所以這是對方「自己」的問題。



  持有這種看法的學員也是勇敢離開前夫的單親媽媽，而這樣的身分在以色列尤其辛苦。不

  過，這番言論卻觸動改嫁後才獲得幸福婚姻的學員的敏感神經。現在的她當然已經逃離過

  去那個會家暴自己的老公，但當年的她也是極為軟弱，因此她認為不能以自己的價值觀與

  狀態去評價其他人的決定。這九位女子在上述各種衝突中，對彼此更加了解，互相包容，

  也勾勒出以色列的多元文化樣貌。



  透過八名學員的分享，呈現出以色列的婦女日常。從頭巾是傳統還是束縛，女人就該負責

  煮飯，到離婚改嫁到底能不能被接受，刮腿毛就表示準備要跟男人上床，甚至一切事務都

  由男人決定等五花八門的煩惱與限制，《她和她們的電影課》都在短短的一個半小時內點

  出。不論討論過程多麼七嘴八舌，到頭來，同為女性的她們，也更能體諒彼此的處境，進

  而相知相惜。



  《她和她們的電影課》中的電影課也如實呈現拍攝電影所需的一切知識，從運鏡、收音，

  到綠幕、配音與導演技巧都絲毫不馬虎。羅娜甚至帶領學員體驗沒有專業器材時如何就地

  取材，靠兩支電風扇也能拍出長髮飄逸的MV風格，一台購物推車就能扮演推軌車的角色。

  這些學員從連攝影機怎麼用都不知道，到工作坊結束時，已經可以用影像訴說一個完整的

  故事，也象徵她們不管在開始電影工作坊之前生活有什麼樣的問題，即使仍未解決，至少

  已經獲得更多的能量與勇氣，繼續努力且用力地譜出自己的故事。



  片名裡「sabaya」的意思為「一群年輕的女人」，所言一點都不假。學員中最年長的今年

  已經七十三歲，由於心裡所希望的一切都已成真，樂天知足的她表示自己沒有什麼夢想，

  但她還願意來參加這堂課，與其他小她不少歲的姊妹一起學習新知，她就絕對是「人老心

  不老」的代表。無論她們原先來自什麼背景，組成這個同性社群之後，一起充滿活力地成

  長或可成為她們永保青春的關鍵。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
