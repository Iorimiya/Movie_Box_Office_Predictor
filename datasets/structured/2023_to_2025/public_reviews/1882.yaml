title: '[好雷]《她和她們的電影課》，願每位女性都能盡'
content: '部落格版：


  聽人常說，影像是種私密的語言，能讓人抒發情緒、能讓人寄託情感、能讓人傳遞思念，

  從影像裡可以看見一個人最真心、最赤裸，同時也是最真實的樣子。而往往當這些最私密

  的東西成為了影像，幾乎可以把人帶到任何想去、或者是不想去的地方。代表以色列征戰

  奧斯卡最佳國際影片的《她和她們的電影課》正是這樣一部私密的電影，八位不同年齡、

  身份，有著不同信仰與文化背景的女性，在鏡頭前她們誠實的面對自己，將自己的真心放

  進了每堂作業裡，是想努力從中找尋勇氣或是宣洩生活煩悶，可卻又同時對如此的坦露感

  到羞恥。而主導一切的工作坊老師、導演羅娜，就好像是本片導演奧里特福克斯羅登，小

  心翼翼的碰觸著她們每個人的敏感神經，在看似平淡愉快的氛圍之下實則暗潮洶湧，不同

  的聲音在小小室內穿梭迴盪，時而劍拔弩張、時而和平共處，不論她們願不願意去承認，

  但她們確實都如羅娜所言的，當把私密的自己給奉獻交出時，她們便已然在創造一部屬於

  她們的影像作品，如詩般的真摯動人。


  《她和她們的電影課》出乎意料的好看，導演奧里特福克斯羅登巧妙的利用電影的包容性

  ，讓不同種族、立場、階級、信仰之間有了對話的可能與空間，同時更讓相對來說處於弱

  勢的女性有了發聲機會。而觀眾就好像每天從外地搭乘火車來到工作坊的羅娜，站在九張

  椅子圓成的圈外，靜靜的聽著、看著並記錄著眼前的有趣交流。如在眾人初見面的第一堂

  課裡，就因要用阿拉伯語還是希伯來語上課發生口角，這樣多元的組合自然後面還有許多

  問題等待著她們，然而《她和她們的電影課》取巧的是，利用拍電影、演電影、參與電影

  製作本該是開心的事的這件事來輕鬆化解衝突，讓電影能時刻保留著議題性，可卻又不會

  讓電影處在緊繃狀態，而與此同時，導演奧里特福克斯羅登反能讓眾人順著對話來進行讓

  彼此更加認識構成自己的一切，進而理解然後學習尊重。


  《她和她們的電影課》確實是堂「電影課」，不僅是讓觀眾陪著參與這個工作坊的女性們

  學習如何拍電影，亦是帶著觀眾來去認識以色列的多元面貌。除了上面提到過的語言問題

  外，來自不同地區的她們，亦因隨時可能被不小心踩到的點而開戰，從穆斯林女性戴頭巾

  的問題能衍生至阿拉伯人和猶太人間的緊張關係，其中更有人坦承自己對對方抱持著恐懼

  、恐怖攻擊的印象強烈深刻，嚴重的種族歧視不言而喻；也有人提到自己年僅十歲的女兒

  想刮腿毛遭到自己拒絕，因為在她們的信仰裡女性刮腿毛就表示準備跟男性發生近一步關

  係，她不想女兒受到他人異樣眼光看待，想當然的這聽在有些人耳裡顯得荒謬可笑...。

  從種族到信仰到文化都能成為爭論的點，不過畢竟這是部「全女性」的電影，所以裡頭談

  論更多的還是只有女性議題。



  導演奧里特福克斯羅登不只有讓阿拉伯人與猶太人、伊斯蘭教徒和猶太教徒等共處一室，

  連單就「女性」的組成也相當多元。有70多歲的退休職員，也有相信自己沒有什麼做不到

  的20歲多歲女性；有享受家庭生活的，也有不婚主義者；有給了愛情第二次機會的，也有

  剛剛從婚姻逃離、恢復單身的...，聚在這裡的八個人各有八色，每堂羅娜交予的習作總

  讓她們從容易取得素材的生活著手，在分享的過程中難免會有人提出疑問，甚至是拿出自

  己的經驗分享，然後就又會一個不小心產生摩擦。例如有個人的鄰居時常遭到丈夫家暴，

  每個住戶都很想要幫助那位女性，但每次她總會選擇原諒丈夫，這對選擇離開丈夫的她來

  說愛莫能助，她認為是這位鄰居沒有勇氣站起來反抗丈夫，才會讓問題無法得到解決，然

  而她的說法卻戳到二次婚姻的另一個人的痛處，可能從沒想過自己會自揭傷疤、告訴大家

  她遭到家暴長達七年，沒有勇氣不代表軟弱，只是因為有很多原因讓她難以離開，因此這

  個定論聽在得到許多人幫助才得以離開家暴丈夫、並且鼓起勇氣踏入第二段婚姻的她耳裡

  是相當刺耳不舒服的。


  又或者是最為年長的學員在聽見其他較為年輕的新世代女性的愛情觀、婚姻價值觀等的分

  享，也是不時的聽了皺眉，從女人離婚改嫁不易、夫妻勸和不勸離，再到不該讓丈夫自己

  做飯等等的，就連有人疑似能接受和同性發生關係都讓裡頭最為保守傳統的她無法招架。

  此外，造成整個工作坊期間最嚴重一次衝突的，是有位學員在眾人支持下總算去報考了駕

  訓班，然而看似雀躍的她內心還是深怕丈夫得知後會反對，趁著課堂習作時間，羅娜和有

  些人鼓勵她練習和丈夫溝通，沒想到竟意外點燃了她長久以來在婚姻裡的不滿，原本想藉

  以帶給她勇氣的好意竟成了不被有些人理解的逼迫，最後只得在尷尬的氣氛下結束這堂課

  。這個工作坊看似問題很多，也很難想像她們怎麼能夠和平共處，然而比起種族歧視、國

  族仇恨這樣子單靠她們無法解決的問題，在卸下這些附加身份之後，她們都是女人。



  歌手梅艷芳曾唱過一首歌，《下輩子別再做女人》，歌詞中寫道「我們這一生苦的很」、

  「快樂的時間少的很」，女人何苦、也沒必要去為難女人，身為女人她們才懂女人的苦，

  才懂彼此必須背負的、面臨的是什麼，其實站在各自的立場來看，她們其實都是出於好意

  、出於疼惜，心疼彼此才想看對方能夠過得更好，也許善意一時的被情緒給帶偏，但冷靜

  過後善意始終會傳達給對方知道，就算最後羅娜還是沒能讓更多人看見屬於這群女人的生

  命故事，就算她們在工作坊結束後便會解散，可是她們還是能在最後一刻坐下來，關起門

  來笑著觀賞這些日子來，她們掏出真心、願意赤裸裸的分享自己，最令人害躁卻也最讓自

  己驕傲的電影。這些片段串成的影像能否帶給她們勇氣並不知道，不過可以確定的是，這

  部電影確實的把她們帶到了某個地方，一個能夠找到自己的地方。


  回到電影課本身，在《她和她們的電影課》中每個上課橋段我都好喜歡，也很喜歡她們每

  次的習作交流，而我最喜歡的一段是，當想學習開車的學員在某堂課上不想交出自己的習

  作，因為她認為她拍的不好，她也想不到任何話來搭配她的影像，雖然最後在羅娜的安撫

  下她還是播放了她所拍的影片，一段她將自來水打開，讓水桶承接著從水龍頭裡流出的水

  的影像，可是她還是想不出來自己要說什麼，即使她知道她為什麼要拍這段影，但她卻不

  想分享這段影像背後所藏著的、對她而言是不好的往事。在她回到座位上後，開始有人分

  享從這段影像所看見的感受，聽得出來不是隨意敷衍的胡謅，而是打從心底真的有獲得了

  什麼才說。聽著其他人的分享，羅娜告訴這位學員，也許在拍什麼只有自己知道，可是觀

  眾是看得出來的，所傾注的真心是會被感受到的、是會帶給觀眾啟發的，所以無論如何都

  不要覺得自己拍的作品不好。


  《她和她們的電影課》是部相當溫暖真摯的作品，導演奧里特福克斯羅登溫柔的引導著這

  些來到工作坊的女性，如何在學習拍攝一部電影的過程裡找到屬於自己的力量，以對話式

  的方式慢慢引導著她們直面自己、察覺自我。最後她讓她們每個人站在綠幕前，以完成她

  們夢想的樣子，像是種期待，有朝一日每位女性都能不在婚姻裡或是任何身份裡迷失自己

  、失去自己，而是盡情的綻放生命光輝、青春永駐。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
