title: '[情報] 2023 以色列奧斯卡代表：《她和她們的電影課》'
content: '以色列甫公布了將申報名年奧斯卡「最佳國際影片」的作品，將以《她和她們的電影課》

  （Cinema Sabaya）作為代表。




  《她和她們的電影課》 為以色列新銳女導演 Orit Fouks Rotem 的首部長片，該片去年在

  耶路撒冷影展首映後評價不俗，陸續於美國電影學會電影節、雪梨影展和芝加哥影展中放

  映，並在今年入選了「台北電影節」的「國際新導演競賽」單元，不過最終並無獲獎。


  「年輕以色列女導演羅娜接下一個電影工作坊的培力計畫，要指導一班素人拿起攝影機拍

  下自己的日常。九位師生齊聚一堂，來自不同年齡、階級、信仰及文化背景，唯一的共同

  點都是女性。課堂氣氛看似輕鬆，起初卻相處得如履薄冰，光是要用阿拉伯語或希伯來語

  上課，就踩下第一顆地雷。然而，在每次作業分享中皆能看見彼此的生命片段，大家漸漸

  發現，你我不一樣也都一樣。共同女性處境凝聚了情誼與覺醒，課堂重點不再是學習拍攝

  技術，而是如何在握住攝影機的當下，找到自己的力量。」（取自 台北電影節）




  以色列一直以來都是直接將本國最大電影獎「以色列電影學院獎」的最佳影片得主做為奧

  斯卡代表，今年一同競逐的作品還包括動畫電影《尋找安妮法蘭克》等片。《她和她們的

  電影課》在入圍的八項大家中最終拿下包括最佳影片、最佳導演和最佳女配角等五項大獎

  。


  這將成為導演 Orit Fouks Rotem 首次代表以色列爭戰奧斯卡的作品。以色列曾多次獲得

  提名，但至尚未獲獎過。在近十年的表現差強人意，僅在 2017 年以《今天跳舞不打仗》

  擠進短名單，上一回獲得提名的作品為 2011 年的《親情據點》。



  --'
