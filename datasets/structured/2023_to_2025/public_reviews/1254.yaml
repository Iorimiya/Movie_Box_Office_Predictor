title: '[  雷] 陸上行舟'
content: '防雷







































  什麼是人定勝天？看完這部電影之後我才更了解

  在這之前我都以為只要一直衝衝衝就可以了

  但我明白了他也是一種偏執的精神

  不顧一切只想達成自己的夢想

  稍微查了這位荷索導演拍這部電影的經歷

  我很懷疑他只是換了個角色重複演自己的經歷

  不管是他還是這個男主角的所作所為真的大開眼界

  當然這樣也不太好啦,聽說也有出不少事


  但這些壯舉終究是一個過程

  把一堆有的沒的東西搬過河床和山

  這瘋狂根本不輸給湯姆克魯斯和不可能的任務欸

  當然他不是個爽片,很多時刻都是相當文藝在進行

  緩慢而悠長的鏡頭搭配著開頭音樂家的歌聲

  連原住民們都為之一振

  至於探險者們跟原住民的互動讓我想到了

  殖民者跟新大陸住民的接觸,只是沒有起衝突

  至於有沒有剝削我覺得比較沒這麼明顯


  這部電影用藝術的形式述說了人定勝天

  其實劇情越到後面就越單薄,更像是紀錄片

  而且調性前後也很不一樣,但不會到不自然

  很特別的人定勝天,跟我們的不一樣

  明明都是為了證明自己而不擇手段

  但電影演的就是比較自然舒服

  不知不覺就被吸了進去,全程目睹了一切瘋狂

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  萊斯特在最後敘述中講述了生活中有意義的經驗，他說，儘管他死了，他還是很高興，因

  為這世界上有這麼多的美


  --'
