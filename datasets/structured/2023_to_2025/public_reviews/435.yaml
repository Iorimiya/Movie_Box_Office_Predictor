title: '[好雷]我在平行時空戀上妳（知らないカノジョ）'
content: '防雷圖





  沒看過原作，當初知道milet要出演這部時就相當期待


  劇情走向大概就跟預告所呈現的差不多


  主角默默無名時認識女主


  一方有名了，另一方因為自卑沒有積極的走出自我


  導致跑到另一個世界，而為了回到原來世界需要做出改變


  相當老套好猜，但整體而言我覺得算是順順的


  除了幾幕有著日本慣性的演很用力讓人尷尬


  基本上並沒有太多出戲的感覺





  不得不說，我始終很喜愛日本在戀愛劇的打工跟調色


  這部電影的打光跟調色一直讓我覺得很舒服

  是可以讓我順順的帶入劇情跟沈浸氛圍裡


  尤其是在捕捉milet與中島健人之間的戀愛感

  相當有那個氛圍，其中幾cut的milet男友視角

  我必須說攝影師，您真棒！！！



  本劇的演員除了milet以外都是職業演員，不用太擔心

  反而是第一次演戲的milet，她給人的感覺如何呢？



  我必須說，雖然還是會有些許生澀感以及刻意表演

  但是可以看出在忘了週邊有攝影機的狀況下

  捕捉到的畫面其實很自然的


  加上劇情裡面的某些內容，對照上milet從去年開始的身心問題

  真的讓我覺得這部戲，或許就是她在闡述自己這幾年的內心進而本色演出


  還蠻推薦可以去電影院欣賞一下


  畢竟milet昨天宣布暫時長休，要好好調養身心歸期未定


  喜愛她的粉絲們，這是還有機會到大螢幕上欣賞可愛的milet


  以及用音響好好欣賞她為本劇獻唱的兩首歌


  I Still & Nobody Knows








  題外話，裡面演經紀人的有點像小島秀夫

  --





  --'
