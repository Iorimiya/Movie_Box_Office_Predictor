title: '[好雷] 我在平行時空戀上妳'
content: '雷文防雷資訊頁



  趁著連續假期來看milet主演的電影

  〈我在平行時空戀上妳〉

  從日本要上映的時候就在關注

  本來還擔心以milet在臺灣的知名度

  會不會沒有代理片商

  看到台版預告片的時候真的很開心

  終於有機會可以看大銀幕的milet

  馬上拖著家人來看！




  劇情大致講述：

  男主角神林陸（中島健人 飾）婚後成為

  暢銷小說家，忙碌的生活讓他與妻子

  前園美波（milet 飾）的感情日漸疏離，

  一覺醒來後發現原本擔任家管的妻子

  搖身一變成了家喻戶曉的大歌星，

  自己則變成出版社小編輯，為了回到

  原本的世界，於是要想辦法把已經變成

  陌生人的平行時空的妻子追回來的故事


  原本擔心milet不是演員出身，演技會

  尷尬或者是很生硬，但是劇情方面並沒有

  太需要她飆演技的地方，有幾幕細微

  表情和情緒是有到位的，比想像中好很多

  總而言之就是在電影中，milet有呈現出

  學生時期的青澀，大明星時期的氣場

  一顰一笑真的都相當有感染力

  如果你是milet的粉絲的話，一定會非常

  滿足，真的太有魅力了！


  男主角的部分，雖然中島健人似乎也不是

  演員出身，但心境的轉折也有表現出來

  有幾幕哭戲相當觸動人心，讓我也不禁

  跟著流下眼淚


  總之這部〈我在平行時空戀上妳〉，雖然

  劇情有些俗套，但是優點是並不沉重，

  男主角跟他的學長男配的互動非常有趣

  也為這部片增添了許多笑料，非常推薦

  大家可以到電影院去觀賞支持！

  4/10前到電影院購票還有特典海報喔








  --'
