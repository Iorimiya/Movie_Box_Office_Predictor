  1.唐尼爬通風口出來後要離開銀行的識別證是哪裡來的？


  2.有兩台垃圾車相遇這一段，我看了卻怎麼也回想不起來細節，不知道有人能敘述一下過

  程嗎？因為會帶出後面的得手的鈔票其實是碎完的





  心得：真心覺得不錯看，一種流氓警察VS白淨歹徒的反差，只是後半段要認真看。


  --'
