title: '[負雷] 《鑽石大劫案：極盜戰》的幾點雜感'
content: '吃晚餐前看了《鑽石大劫案：極盜戰》(Den of Thieves 2: Pantera)




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  1.每年看個幾部傑瑞德巴特勒的超假特效動作片也算是一種年度儀式感，去年一部都沒有

  ，有一種整年白過了的感覺，還好今年開局就能看到。

  .

  2.這片基本上可以當成是《荒唐分局》裡面傑克跟道格朱迪的單元，可惜是不搞笑的版本

  。

  .

  3.上集是山寨版的《烈火悍將》跟《刺激驚爆點》，這集為了不自我重複，轉型成了山寨

  版的《偷天換日》跟《不可能的任務》

  .

  4.(這點會爆《烈火悍將》的雷)光看預告片就覺得這片本身就建立在一個奇怪的前題之上

  ：你想像《烈火悍將》結局是勞勃狄尼洛沒有死，然後突然拍了續集，故事是憤世嫉俗的

  艾爾帕西諾離婚之後氣到主動跑去勞勃狄尼洛組隊搶銀行，說他也要幹一票大的，這到底

  什麼劇情？

  .

  5.光看預告就覺得主角鐵定是臥底吧，於是這讓電影本身變得很難編劇情：如果主角真的

  是臥底，那也未免太老套；如果主角真的不是臥底，那對照第一集他的角色定位也變得太

  尷尬。所幸編劇在兩難之下想出了一個出乎意料的解：他全都要！在片尾的時候先揭露了

  主角的臥底身份，接著又讓主角決定把他們全部放出來再加入他們，這主角簡直毫無中心

  思想可言。

  .

  6.主角跑去加入劫盜團隊時，他們為了確認主角動機的真偽，說要出個難題來測試他，原

  本以為所謂難題是要他當場搶銀行或至少是偷車之類的惡行，結果只是要他抽根大麻菸，

  抽完大家都是好麻吉了，廢到笑。

  .

  7.兩位主角明明應該是世仇，但這集不知道為什麼稱兄道弟好像很熟，還以為他們是從小

  一起在街頭長大的舊識。

  .

  8.在夜店跳舞那段，主角跑去找某隊友的「前」女友跳舞，對方竟直接爆氣，事後不但離

  職了，還想把前公司整間抄掉，有夠小心眼的一個人。

  .

  9.為什麼這片不論是小冰塊庫巴應徵鑽石中心員工、主角應徵劫盜行動團員、或是跑去應

  徵鑽石中心保全，都好像隨便應徵隨便上？猶如便利商店工讀生。

  .

  10.傑瑞德應該覺得很苦惱，因為這片沒什麼空間讓他塞很假的特效，還好最後讓他靈機

  一動：在行動最一開始，他們拿出了一個超級假的鑽石中心經理面具，假到你絕對會笑出

  來的那種。

  .

  11.不過話說回來，理應是全片高潮的劫盜行動卻一點都不刺激，是整部電影最讓人昏昏

  欲睡的段落，從頭到尾都在躲監視器。

  .

  12.有一段他們在研究熱感應器的劇情，主角還特地問了對方那是熱感應器嗎？問完之後

  特寫主角盯著手上的冰淇淋，以為他準備要有感而發想出什麼大技。沒想到這段就這樣結

  束了，再也不會提到。編劇顯然覺得讓他們分享彼此的Spotify播放清單是更重要的支線

  。（感謝網友說明，後半段行動的時候確實有用到冰淇淋盒，這邊應該是被我睡掉了）

  .

  13.行動的前置作業有一段是必須使用特殊噴霧遮蔽感應器，主角找了個理由佯裝進去倉

  庫後，噴霧時做了個超大的動作，經理都還在他旁邊，這家鑽石中心活該被搶耶。

  .

  14.說到經理，劫盜行動做後有一段劇情是最後找不到鑽石，大家很緊張。鏡頭還一直tak

  e經理，甚至他不知為何下班後跟同事在酒吧球賽看到一半突然提早離席，很可疑，還以

  為他暗槓鑽石。結果沒有，鑽石就在地上，他們只是一時慌了找不到而已，這整段意義不

  明。

  .

  15.說一件你不敢相信的事情：你在預告片裡看到的飛車槍戰是整部電影所有的動作場面

  了。

  .

  16.行動結束後主角要收網了，一群特警衝了進來逮捕所有人，但不知道為什麼對主角的

  逮捕行動只演了半套，就直接在路邊解開他的手銬展示給所有人看了，都不用怕被報復？

  怎不直接衝進去在大家面前拍拍他的肩膀說幹得好算了？


  --

  冰淇淋盒在哪用到啊？他們最後行動開始後因為太無聊我中間不小心睡著了幾次，我有錯

  過什麼嗎？

  感謝解答，看來這邊應該是真的被我睡掉了哈哈'
