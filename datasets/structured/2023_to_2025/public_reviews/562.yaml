url: https://www.ptt.cc/bbs/movie/M.1521176428.A.6A5.html
title: '[普雷] 極盜戰'
content: '本來是沒打算看的

  只是騎車經過美奇萊時剛好停了個紅燈

  順手查了一下時間

  15分鐘後開演...就果斷停車進戲院了

  以下有雷











  整體劇情其實就是很老套的警察抓小偷

  當初看預告以為小偷方會像是臥底那樣

  有很多出乎預料之外的奇招

  有一點被預告騙了的感覺


  槍戰部分滿驚豔的

  臨場壓迫感掌握的很好

  甚至會有一種真的是用實彈在拍的感覺

  沒有那種喧囂無意義的爆炸


  另外警察主角的家庭線感覺沒有收好



  一點小心得分享給各位

  最後為我騎車時滑手機的不良示範道歉


  希望大家都能有一個愉快的週末

  不要遇到那種一邊看電影一邊口述劇情的觀眾



