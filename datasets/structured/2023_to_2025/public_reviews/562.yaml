url: https://www.ptt.cc/bbs/movie/M.1521987654.A.EEF.html
title: '[普雷] 極盜戰 den of thieves'
content: '誰才是真正技高一籌



  有牌的流氓



  盜亦有道?




  防雷




  防




  防




  防









  一部很扎實的警匪片




  重案組-有牌的流氓組織




  搶匪-背景不是運動員就是軍人退役




  雙方鬥智與互相挑釁




  搶匪在任何搶劫行動都精心策畫，包含專業的車手、監控地圖逃逸路線、通訊監聽


  (有玩命關頭五的味道)




  重案組也不是只耍耍流氓威風樣，在起初的調查人物還是問號




  由一張唐尼與梅爾曼的照片，將唐尼電暈抓來訊問就查出此幫人的背景

  (你們不是真正的壞人，我們才是，這表情真的超殺)




  主角尼克的個人辦案風格，是走自己的組織系統，完全不搭其他單位(如FBI)



  也很懂搶匪的心態，搶匪在一開始的劫車不殺路人只解決穿制服的(受過專業訓練?)



  還有在分行對峙時，命令其他單位撤退不用支援，還有發現是搶匪的聲東擊西伎倆





  在搶匪的團隊，進入到聯邦銀行各種降低電壓分配及電磁脈衝干擾電子設備還有


  擾亂無線電通訊，並得在這短短的幾分鐘內將錢裝入塑膠袋並投擲到垃圾通道蠻


  有緊張的氛圍




  最後的槍戰是發生在"塞車"的情況下，你來我往的每一槍都很扎實，影廳中的音


  效也真的夠逼真，且沒有任何主角威能兩邊的手下都有中槍倒地，雖然主角只是


  手受傷，在追逐過程的運鏡角度也帶得很好





  最後唐尼才是幕後的策劃者(找梅爾曼合作，但梅爾曼說要就用他團隊，全數陣亡 QQ)




  唐尼自己也有團隊(推測就是一開始在酒吧角落的那三位)



  其中有印象的是在聯邦外負責聯絡的那一位



  未銷毀的鈔票是在某路口處兩台垃圾車那邊，算是掉包嗎?

  (被劫的垃圾車司機一臉黑人問號，彷彿就是說連這你也要)




  整部突兀的片段是敘述家庭親情部分



  主角尼克這邊可能可以解釋為，在外面大辣辣行事彪悍的風格，但還是很愛家人(?

  在校園外面與小女兒見面，談到媽媽與他男友對她們好不好時，女兒表情就變了

  (好啦或許導演想要多捕捉兩個女兒的鏡頭，真的蠻可愛)




  五角這邊就真的黑人問號

  一開始還以為是妹妹找姊姊，結果是他媽!?

  把女兒的男朋友叫進去小房間看到一群人，隨便想也只有兩種可能不是被毆打就是被__




  最後在尼克去酒吧時唐尼早已辭職離去，畫面也帶到牆壁上的海報



  "口風不緊就會壞事"



  這句話顯出他幕後主使(對梅爾曼說他是最不可能搞砸的人)，也知道該如何應對警察



  更是嘲諷去酒吧的客人



  而唐尼在倫敦開了酒吧，也與客人聊出了是鑽石商人

  算是續作伏筆(?


  --'
