  勾搭上，以全球最大鑽石交易所為目標，策劃一場驚心動魄的搶劫案。另一方面，未能成

  功攔截唐尼的警探尼克（傑瑞德巴特勒飾演）陷入人生低潮。一心想要復仇的他，也來到

  歐洲找上唐尼，向他表示自己已無任何東西可以失去，決定與他聯手這樁史上最大鑽石搶

  案。不過他們卻沒想到，自己在過程中竟成為其他勢力的追擊目標，必須展開一場鬥智也

