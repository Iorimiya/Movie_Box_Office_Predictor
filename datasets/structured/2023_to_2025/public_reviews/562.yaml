url: https://www.ptt.cc/bbs/movie/M.1521217717.A.ACB.html
title: '[好雷] 極盜戰'
content: '防雷頁























  槍聲在那邊bang來bang去

  聽起來蠻爽的

  打完歹徒就將運鈔車劫走

  其實看到後面早就忘記

  一開始有劫這台車

  聽同事講才知道

  原來是後面改裝去聯邦銀行的車子


  主角尼克一開始的行為

  讓我還以為他才是壞人

  先把唐尼打暈 綁到私人場所

  然後不停用言語霸凌 最後還用武力逼供


  反倒是壞人那邊的行事小心翼翼

  分工有條不紊

  而且遇到風險果斷就將眼前的利益放棄

  讓人覺得這歹徒其實也是讓人可敬的對手


  不過中間有個情節讓人困惑

  就是為什麼壞人要讓他的女人給尼克睡

  難道真的只是為了透漏地點而已= =


  塞車那段槍戰跟最後兩人互射

  是覺得蠻精彩的 不過同事覺得有點無聊XD

  原本以為到這邊劇情應該就結束

  結果劇情又出現轉折

  原來那個一直覺得很倒楣的唐尼才是最大贏家


  雖然不會稱上必看不可的好片

  但是整部片的腳色都還蠻鮮明

  槍戰的部分也還不錯 如果能再多一些感覺會更好


  ==============


  另外有一個覺得很87的地方

  因為一開始尼克說要幹唐尼還抓他gg

  然後接下來回到家跟他老婆吵架

  兩人推來推去

  他老婆突然說一句 要找一個看到她gg會硬起來的男人

  不知道是沒有斷句 還是我沒看清楚

  我一開始以為是 要找一個看到她gg 會硬起來的男人

  還想挖靠這主角真的是同性 前面說要幹唐尼不是在開玩笑

  然後我就一直觀察那女的 想說怎麼看出來他有JJ

  後來才感覺應該是我理解錯

  應該是 要找一個看到她 gg會硬起來的男人

  中文的斷句真的很奧妙XD



  --'
