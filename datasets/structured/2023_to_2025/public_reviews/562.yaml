url: https://www.ptt.cc/bbs/movie/M.1736334853.A.7C5.html
title: '[新聞] 開春必看【鑽石大劫案：極盜戰】精彩爆表'
content: '新聞網址：



  目標全球最大鑽石交易所的犯罪動作爽片《鑽石大劫案：極盜戰》（Den of Thieves 2:

  Pantera），即將在1月29日（三）大年初一震撼上映。這部開春必看動作強檔，由動作片

  男神傑瑞德巴特勒（Gerard Butler）領銜主演。在片中飾演流氓刑警「老大尼克」的他

  ，將與犯罪首腦合作，聯手完成史上最大鑽石搶案。黑白兩道相愛相殺的搭檔組合，讓他

  笑稱像兩隻「銀背大猩猩」在較量。片中充滿各式鬥智鬥力的精彩戲碼，其中一場交易所

  搶劫戲，必須六個人擠在狹小電梯井中攀爬，身穿黑色緊身衣、頭戴面具，再加上為了收

  音而沒有開空調的悶熱環境，讓傑瑞德回想起來都痛苦哀號：「感覺快要窒息了！」此外

  ，全片也充滿各種高難度動作戲，更有精彩程度爆棚的飛車槍戰，必須一邊高速行駛，一

  邊操控槍械的超困難拍攝，就連身經百戰的傑瑞德都坦言是一大挑戰！





  開春必看動作強檔《鑽石大劫案：極盜戰》，由克里斯汀固德佳斯（Christian Gudegast

  ）擔綱編導，並由大眾所熟悉的動作片男神傑瑞德巴特勒領銜主演。由於兩人曾密切合作

  過，對彼此十分熟悉，因此本片可說是導演為傑瑞德「量身訂製」的劇本，導演進一步表

  示：「這個系列的成功基石就是『合作』。他和我之間有種默契，我們非常緊密地合作，

  他在某種程度上就像我的延伸。當你在寫劇本時，知道哪位演員將飾演某個角色，會讓事

  情變得簡單很多！」



  傑瑞德這次將飾演粗獷流氓刑警，遊走黑白之間，與犯罪首腦「唐尼」合作，組成相愛相

  殺的搭檔；顛覆傳統的組合，彼此所激盪出的火花，讓他笑稱像「銀背大猩猩」在較量：

  「我們像兩頭銀背大猩猩相遇、較量，有太多可以發揮的地方，真的太有趣，我們每拍完

  一場戲，就會感嘆一次『那可真是一場精采的戲！』」





  以全球最大鑽石交易所為目標，寫下犯罪新篇章的《鑽石大劫案：極盜戰》，在片中充滿

  各式鬥智又鬥力的精彩戲碼。電影一場交易所中的搶劫戲，六位演員必須穿著黑色緊身衣

  、頭戴面具，在狹小又沒空調的電梯井中攀爬。超克難的拍攝空間，讓身處其中的傑瑞德

  巴特勒，回想起都痛苦哀號：「我們穿著黑色橡膠緊身衣，戴著厚厚的黑色面具，面具離

  臉部大概半英吋，我感覺都快要窒息了！沒有空氣又悶熱，六位驚慌失措的演員在狹小的

  空間裡，全部穿著黑色衣服站著。熱到滿頭大汗，讓你覺得快要中暑了。」



  全片各式高難度動作戲，其中也包含精彩程度爆棚的飛車槍戰。在這場戲中，他必須一邊

  高速行駛一邊操控槍械，在急轉彎中來回探出車外、向後射擊，尤其還是在600公尺高的

  懸崖邊拍攝，就連身經百戰的他都坦言是一大挑戰：「麻煩的是，有時候我們必須將槍械

  轉向後面射擊，就必須從座位上起來，屁股幾乎貼到駕駛員的臉上，還要把腿轉過來，然

  後一隻手伸出車窗外，而這一切都在全速行駛和急轉彎時要完成。」



  這部驚心動魄、開春必看的動作強檔爽片《鑽石大劫案：極盜戰》，即將在1月29日（三

  ）大年初一於台灣震撼上映。本片劇情描述犯下劫鈔案而展開逃亡的主謀唐尼（小歐西亞

  傑克森飾演），來到歐洲的他，卻捲入危險的鑽石竊盜案，更與惡名昭彰的黑幫「黑豹」

  勾搭上，以全球最大鑽石交易所為目標，策劃一場驚心動魄的搶劫案。另一方面，未能成

  功攔截唐尼的警探尼克（傑瑞德巴特勒飾演）陷入人生低潮。一心想要復仇的他，也來到

  歐洲找上唐尼，向他表示自己已無任何東西可以失去，決定與他聯手這樁史上最大鑽石搶

  案。不過他們卻沒想到，自己在過程中竟成為其他勢力的追擊目標，必須展開一場鬥智也

  鬥力的高風險行動。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
