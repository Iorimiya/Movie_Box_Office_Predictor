url: https://www.ptt.cc/bbs/movie/M.1522302150.A.20C.html
title: '[負雷] 極盜戰-硬漢戲不合胃口'
content: '昨天挑了這部看，看到尾巴有一種:喔~就這樣喔 的感覺


  這種警察與小偷類型的戲其實一直都有，多數的戲在安排上都會偏向一方為主

  但極盜戰則是兩邊感覺很平均，似乎沒有特別偏向誰才是正義。


  前面提到甜甜圈店員沒有被殺，因為他是一般民眾。

  但到最後塞車槍戰，似乎他們也不管了，讓人覺得前面的描述顯得諷刺。

  看到最尾唐尼被扣住，心中的確有浮現他應該會解開他的手銬逃跑並且帶著車廂內前逃跑


  可最後竟然是一開始就是假的，讓我感到非常不合理

  為何在回收場時，沒有先打開來稍稍檢查很怪。


  結尾可以看到原來他才是幕後黑手，甚至銀行內、回收車其實早就是他的人

  卻不會讓我有一種:原來是這樣!


  當在看玩命關頭5、出神入化時結局會讓讓我想要回頭再看一次前面的鋪梗

  極盜戰的梗鋪得實在太差


  有一件事情我覺得也是一種黑人的原罪啦，就是我看他們怎麼看都很難有印象

  導致後面大家都在倫敦聚在一起時，依然難連結前面他們出現的狀況(我個人因素)



  劇情的推進也很慢，一度我想要睡覺。不過裡面點綴的女角都很漂亮就是了

  如果你喜歡硬漢類型的電影，可以去看，如果你喜歡正反派更明顯的我不推薦


  --

  ☆失控是生活的態度-歡迎來新家走跳☆



  【粉絲專頁】 Cat in Hong Kong



  --'
