url: https://www.ptt.cc/bbs/movie/M.1520991697.A.AAB.html
title: '[新聞] 《極盜戰》將拍續集 傑哈巴特勒確定回歸'
content: '新聞網址：


  電影《極盜戰》（Den of Thieves）全球票房已突破20億台幣，身兼製片與男主角的傑哈

  巴特勒（Gerard Butler）提醒觀眾「請勿爆雷」，他說：「《極盜戰》裡有警探與流氓，

  但沒看到最後一刻你絕對猜想不到哪一位才是真正的幕後主使，所以請看過的觀眾不要爆

  雷，結局會讓你大吃一驚。」


  犯罪動作電影《極盜戰》堪稱男主角傑哈巴特勒近年來口碑最火電影，美國片方日前宣布

  ，本片續集已開始籌備，片中所有演員均同意回歸演出，而傑哈巴特勒所飾演的流氓警探

  「Big Nick」，亦將成為他繼《全面攻佔》系列的「總統隨扈」後，再度詮釋的系列電影

  角色。


  被傑哈巴特勒稱為近年來看過最屌劇本的電影《極盜戰》，描述一群職業搶匪盯上了美國

  聯準會中等待銷毀的鉅款，但這筆「單」卻被有金牌警探之稱的有牌流氓「Big Nick」盯

  上，燒腦又峰迴路轉的黑白兩道爾虞我詐，伴隨著飛車、爆破、槍戰與打鬥場面精采刺激

  ，在洛杉磯巷弄中逃亡追捕的拍攝手法更酷似暢銷電玩「GTA俠盜獵車手」；男主角傑哈巴

  特勒在《極盜戰》不只辦案手法霸道俐落，逼供手段更是凶狠殘酷，但現實生活中他其實

  是一位溫柔暖男，不只對人和善，更是好萊塢出名的孝子，昨日適逢他母親75歲生日，在

  外地拍戲的他亦不忘拉著全劇組以錄製影片方式幫母親慶生，讓人看到這位銀幕硬漢真摯

  又柔情的一面。


  《極盜戰》描述將數億現金紙鈔從市面上停止流通並銷毀，是美國聯準會（Fed）每日標準

  程序，一群手法高超的搶匪看上這個例行公事，計畫將這筆鉅款奪為己有。前科累累的他

  們，早已被不擇手段、以暴制暴的金牌警探尼克福藍根（傑哈巴特勒飾）盯上，他們還能

  繼續這筆「生意」嗎？最黑警探遇上最狂搶匪，黑白兩道超激火拼，誰才能制霸世界？這

  「世界最高金融機關」又是否會被攻破？電影16日在台上映。


  --'
