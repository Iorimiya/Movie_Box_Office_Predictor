url: https://www.ptt.cc/bbs/movie/M.1521529195.A.0BC.html
title: '[新聞] 傑哈巴特勒以暴制暴《極盜戰》登新片冠軍'
content: '新聞網址：


  「300壯士」傑瑞德巴特勒（Gerard Butler）自製自演的動作新片《極盜戰》（Den of

  Thieves）集結飛車槍戰與峰迴路轉的劇情，層層轉折引人入勝。巴特勒說:「《極盜戰》

  除了飛車、槍戰與燒腦搶劫之外，更多了「人性」，不論是「有牌流氓」或「玩命搶匪」

  ，都能讓觀眾更投入這些角色。」該片上周在台上映勇奪全台新片票房冠軍。


  《極》片不同於以往的犯罪動作電影，劇情峰迴路轉，讓觀眾猜不到下一步走向，巴特勒

  說:「有一場戲是警探與搶匪的飛車追逐，但劇情遇上著名的『洛杉磯大塞車』後急轉直下

  ，雙方人馬扛了傢伙直接下車硬碰硬火拼，這都是我覺得既真實又夠屌的劇情安排。」該

  片票房、口碑雙雙告捷，日前已公布正在籌備續集，據悉劇情將延續首集結尾發展。


  該片描述美國聯準會（Fed）每天將數億現金紙鈔從市面上停止流通並銷毀，一群手法高超

  的搶匪看上這個例行公事，計畫將這筆鉅款奪為己有。前科累累的他們，早已被不擇手段

  、以暴制暴的金牌警探盯上。該片已在台上映。


  --'
