url: https://www.ptt.cc/bbs/movie/M.1737468767.A.CB6.html
title: '[新聞]小歐西亞傑克森甩油演<鑽石大劫案:極盜戰>'
content: '新聞網址：



  登頂全美票房冠軍的犯罪鬥智強片《鑽石大劫案：極盜戰》（Den of Thieves 2:

  Pantera），即將在1月29日（三）大年初一震撼上映。本片由傑瑞德巴特勒（Gerard

  Butler）和「星二代」小歐西亞傑克森（O''Shea Jackson Jr.）攜手主演。雖然這是兩人

  的二度合作，但因為先前合作時的角色相互對立，因此未能有太多接觸機會，直到這回在

  本片飾演警探與犯罪集團首腦，兩人將攜手合作，才讓兩人的關係急速拉近，成為最佳拍

  檔，好默契更讓傑瑞德大讚：「小歐西亞是我的英雄！」由於小歐西亞在片中需要假扮各

  種身分，進而洗劫全球最大鑽石交易所，因此他必須學習法語、非洲法語、塞爾維亞語等

  多國語言和口音；同時還為了片中激烈的動作場面，向專業人士學習機械裝備與武器使用

  方式，更狠甩15公斤好讓體能達到最佳狀況，讓人見識到他一流的敬業精神！





  開春必看犯罪鬥智強片《鑽石大劫案：極盜戰》，由傑瑞德巴特勒，以及知名饒舌歌手冰

  塊酷巴（Ice Cube）的演員兒子「小歐西亞傑克森」共同主演。雖然這次是兩人的二度合

  作，但由於先前合作時的角色相互對立，讓兩人未能有太多接觸機會。這回他們飾演的警

  探與犯罪集團首腦，將攜手完成史上最大鑽石搶案，因此他們從開拍前便頻繁聯繫來培養

  默契，小歐西亞對此分享：「我們一起看場景、試跑幾遍，試著在上場前找到最佳狀態。

  從那時起，我們開始聊彼此的生活，也聊近況。當你這樣閒聊的時候，真的可以更了解一

  個人，就是這麼簡單，之後在片場的合作也會變得很自然。」關係急速拉近並成為最佳拍

  檔，也讓傑瑞德大讚：「小歐西亞是我的英雄！作為演員，他非常有天賦，一切對他來說

  都像是輕而易舉。」





  在《鑽石大劫案：極盜戰》當中，小歐西亞傑克森飾演犯罪集團首腦「唐尼」，必須假扮

  各種身分，進而洗劫全球最大鑽石交易所。他為此學習多國語言與口音，導演克里斯汀固

  德佳斯（Christian Gudegast）表示：「他需要學習塞爾維亞語和法語，還要扮演來自非

  洲象牙海岸的角色，我們對此討論了很多次。」而小歐西亞最終完美又流利的演出，也讓

  導演讚揚：「他完全可以駕馭一切，真的是天賦異稟！」此外，片中激烈的動作場面對他

  來說也是一大挑戰，為了能讓觀眾沉浸其中，他向專業人士學習機械裝備與武器使用，甚

  至狠甩15公斤，好讓體能達到最佳狀態，他分享：「我真的為這部電影受訓，必須讓我的

  體能達到最佳狀態，動作片讓人累到不行，所以必須要有辦法迅速恢復體力。」



