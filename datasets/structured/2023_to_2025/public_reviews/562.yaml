title: '[新聞]【鑽石大劫案:極盜戰】全台好評票房破千萬'
content: '新聞網址：



  犯罪鬥智強片《鑽石大劫案：極盜戰》（Den of Thieves 2: Pantera），自大年初一（

  1/29）在台灣上映以來，累積大量好評口碑，不僅日前順利登頂全美票房冠軍，如今台灣

  票房更傳捷報，上映五天全台票房累積勇破1200萬！



  本片不僅成為全台民眾在春節期間的觀影首選，更有不少觀眾在觀賞過後，紛紛在網路上

  留下「超好看」、「好久沒看到這麼緊張刺激的電影」等激動未平的留言，讓《鑽石大劫

  案：極盜戰》在網路上拓展極佳口碑。有網友直呼本片根本就是「反轉再反轉的神片｣、

  「神劇本｣，甚至還有網友推薦「跟情侶約會就得看這部」；尤其傑瑞德巴特勒（

  Gerard Butler）的精采演出，更是讓網友美譽是他從影生涯的代表作品。尤其本片結局

  將顛覆觀眾想像，片商也積極呼籲已經看過的觀眾，千萬不要隨便透露結局！



  值得一提的是，相較2018年的《極盜戰》，本片拍攝規模更為龐大，品質也更加提升，雖

  然製作預算僅4000萬美元，但截至目前的全球票房即將突破5000萬美元，可說是叫好又叫

  座。這也讓製作團隊乘勝追擊，近日順勢公佈將再度拍攝續集，已經在籌備階段。消息一

  出，更是讓全球影迷直呼期待！



  這部全台票房勇破千萬的犯罪鬥智強片《鑽石大劫案：極盜戰》，目前正在台灣熱映當中

  ！本片劇情描述犯下劫鈔案而展開逃亡的主謀唐尼（小歐西亞傑克森飾演），來到歐洲的

  他，卻捲入危險的鑽石竊盜案，更與惡名昭彰的黑幫「黑豹」勾搭上，以全球最大鑽石交

  易所為目標，策劃一場驚心動魄的搶劫案。另一方面，未能成功攔截唐尼的警探尼克（傑

  瑞德巴特勒飾演）陷入人生低潮。一心想要復仇的他，也來到歐洲找上唐尼，向他表示自

  己已無任何東西可以失去，決定與他聯手這樁史上最大鑽石搶案。不過他們卻沒想到，自

  己在過程中竟成為其他勢力的追擊目標，必須展開一場鬥智也鬥力的高風險行動。



