title: '[普雷] 極盜戰'
content: '劇情上，就是貓捉老鼠，主角尼克從一開始出場的亂搞


  就已跟大家說明他不是按照規局來行事的警察

  (那甜甜圈他吃得下去也是很猛XD)


  前面部分就是在跟大家介紹尼克的辦案手法


  中半段開始圍繞一小角色，雙方互相試探防備


  後面就是超充實的槍戰，聲音跟畫面都很棒!


  然後中間有岔出分支去討論主角的家庭


  應該是想表達他是個愛家但又不顧家的男人 ?


  但這段後來就沒了....


  還有個人覺得這部電影看時需要花一咪咪腦力，因為導演只給你畫面XD


  不太說明什麼，就算是結尾時也需要思考一下下，為什麼前面要演那些


  因為它讓我搞不太懂最後搶銀行的過程，一度想說為怎麼會多出一些畫面


  但結尾時還是有說明出來拉


  不過我看完時還是搞不懂為什麼一開始要搶車，但稍想一下其實就知道了 Orz


  總之，這部電影還是不錯看得!


