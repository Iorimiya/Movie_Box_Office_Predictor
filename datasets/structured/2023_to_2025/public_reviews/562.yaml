url: https://www.ptt.cc/bbs/movie/M.1521541470.A.681.html
title: '[好雷] 極盜戰：紮紮實實的每一槍'
content: '---以下有雷---


  前幾天跟我弟去看了《極盜戰》


  先講缺點，我覺得節奏有點慢，所以比較沒耐心的人如我弟就會看的有點不耐煩。

  節奏慢，是因為電影花了蠻多時間在描述雙方事前計畫＆準備的細節，

  也有描述主角慘兮兮的家庭生活部分，所以比較拖。


  但我覺得這樣換來的是這部電影的真實感，

  人物的感覺、事件的推進都不會太讓人覺得突兀

  （除了最後結局大反轉那邊我覺得有點硬要），

  這樣的電影風格我自己算蠻喜歡的，比如槍戰拍得很真實，沒有太誇張的大爆炸，

  但就是碰碰碰碰碰碰碰碰，紮紮實實的一槍一槍你來我往，警匪雙方也沒有誰太外掛，

  打都打不中，或是隨便中個一槍就葛屁，就是很真實的，槍戰場景，會流血，會死人。


  （我承認可能是因為也剛看完古墓奇兵，覺得女主角各種外掛不太喜歡，打都打不中，

  隨便射個一發弓箭就秒殺人，不太真實。）


  然後也因為前面的各種鋪陳，最後盜賊們執行計畫把警方耍的團團轉，

  也順利闖過各種銀行關卡偷到錢，到最後被警察主角發現，雙方展開激戰那幾幕，

  真的會讓人看得滿緊張也不錯享受。


  簡單心得分享給大家阿，是可以去電影院看的一部電影。


  --

  真的還可以啦XD槍戰在影廳看臨場感很威

  看到有版友說家庭線的支線任務也是在致敬GTA XD'
