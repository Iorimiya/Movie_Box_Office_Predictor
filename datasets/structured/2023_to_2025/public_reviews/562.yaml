title: '[新聞]<鑽石大劫案:極盜戰>運動健將打造精采動作'
content: '新聞網址：



  開春必看犯罪鬥智強片《鑽石大劫案：極盜戰》（Den of Thieves 2: Pantera），即將

  在1月29日（三）大年初一震撼上映。全片將故事背景帶到歐洲，目標史上最大的鑽石搶

  案，呈現出驚心動魄的犯罪佈局與過程，緊張刺激勢必讓觀眾大開眼界。為此，劇組特別

  跟警察、重大搶案調查人員，甚至是巴爾幹地區的盜賊會面，打造出國際規模的壯觀搶案

  。為了加強國際化氛圍，導演克里斯汀固德佳斯（Christian Gudegast）在選角上也別具

  心思，邀請到荷蘭踢拳手、法國綜合格鬥手、巴西拳擊手等各國運動健將，讓動作戲逼真

  度更加提升。此外，片中更有精采度爆棚的飛車追逐戰，並特別選用符合速度感與帥氣形

  象的保時捷電動車，甚至一次使用五輛Taycan設計車款，打造令人心跳加速的帥氣追逐場

  面。這也讓本片近期在美國上映之後好評滿載，並一舉登頂全美票房冠軍！





  目標全球最大鑽石交易所的電影強片《鑽石大劫案：極盜戰》，以2003年發生在比利時安

  特普衛的鑽石劫案為故事靈感，導演克里斯汀固德佳斯表示：「從一開始，我們就知道要

  將故事帶到歐洲，特別是進入鑽石的世界並探索這個領域。」為了深入鑽石搶案領域，打

  造真實且壯觀的鑽石世界，劇組也做了最全面的調查，導演對此分享：「我們與所有相關

  人士見面，包括警方、重大搶案的調查人員，甚至還與來自巴爾幹地區的盜賊見面，與他

  們進行交流，並收集作為這部電影基礎的所有素材。」



  由於本次劫案，是橫跨歐洲各國的國際規模，為了加強國際化氛圍，並讓片中的動作特技

  與身體效果栩栩如生，在配角挑選上也別具心思，特別選擇兼顧運動與演技的各國運動健

  將演出，包括荷蘭踢拳手里科費爾胡芬（Rico Verhoeven）、法國綜合格鬥選手西里爾蓋

  恩（Ciryl Gane）、巴西拳擊手維托貝爾福特（Vitor Belfort）等人。導演也對這樣的

  安排表示：「他們獨特的外貌和精神，是假裝不出來的，這些人都是硬漢，這部電影的犯

  罪和黑幫世界也都充滿硬漢氣息，這些演員某種程度代表了這個部分。」





  開春必看犯罪強片《鑽石大劫案：極盜戰》，不僅擁有精彩的跨國追逐戰，更有驚心動魄

  的飛車動作戲。在劇本撰寫階段，導演便堅持要將保時捷電動車「Taycan」寫進去，監製

  塔克圖利（Tucker Tooley）對此表示：「這些車必須非常非常快，而且要看起來非常非

  常帥，Taycan完全符合這兩點，甚至超越！」幸運的是，保時捷恰巧客製了五輛Taycan設

  計車款，卻因為不適合道路駕駛即將銷毀，劇組得知這個消息便馬上收購，更進一步獲得

  保時捷贊助，讓圖利驚訝直呼：「我們就像中了保時捷彩券一樣，這是上天賜給我們的禮

  物！」



  值得一提的是，台灣發行商「采昌國際多媒體」也將在1月22日（週三）於台中與高雄，

  舉辦「2025鑽大錢首映會」，只要事先填寫報名表單，並於活動當天穿上帶有鑽石圖案或

  閃亮的服裝或配件，即有機會獲得免費觀賞資格，每人限領乙張，不可重複領取，名額有

  限，額滿為止。詳情請見活動貼文：




  這部驚心動魄、開春必看的犯罪鬥智強片《鑽石大劫案：極盜戰》，即將在1月29日（三

