title: '[普雷] 極盜戰之極短心得'
content: '片名：極盜戰

  Den of Thieves


  IMDB：7.0


  心得雜感：


  劇情不贅述。


  從NETFLIX點選觀看，傑瑞德巴特勒

  領銜主演的動作電影（？）， 幾場

  槍戰倒是硬底子火拼，相當過癮！


  但是整場片子最讓我印象深刻的，卻

  是主角傳錯簡訊而導致家庭失和，可

  能是自己也曾經發生過叫錯名字造成

  分手，所以此段情節讓人頗有共鳴。


  即便是硬漢的有牌流氓，也經不起這

  樣的嚴重失誤。


  最後唐尼似乎把觸角伸向某珠寶商人

  ，會不會又是想幹一大票而有續集呢

  ？


  全片約140分鐘，雖然有些許不緊湊，

  不過也是值得一看的片！


  --'
