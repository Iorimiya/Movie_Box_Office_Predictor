url: https://www.ptt.cc/bbs/movie/M.1521367386.A.368.html
title: '[ 好 雷]'
content: '《極盜戰》於美國一月先上映，IMDb分數：7.1，美國票房逾14億台幣。主角主要由傑瑞

  德巴特勒(Gerard Butler) 、 五角(50 cent) 、 帕布羅薛伯(Pablo Schreiber) 、小歐

  西亞傑克森(O’Shea Jackson Jr)飾演。故事敘述一群劫匪盯上了美聯準會所管理的龐大

  金錢，而計劃了一場搶劫行動。但早已被洛杉磯警察局菁英部門的警探大尾尼克(BIG NIC

  K)鎖定，打算在搶劫前就將他們繩之以法的故事。






  ..........….....................手機排版請見諒...............................

  .......................防雷線............................





  一開始想看這部電影是因為宣傳預告片中警察BIG NICK對嫌犯說：「你不是壞人，我們才

  是。」當下就勾起我對這部片的興趣。但整體來說，這是我看過第一部電影要到結局最後

  幾秒鐘才恍然大悟的片，終於知道回馬槍的感覺，戳了一下腦中還在思考的電影餘韻。

  看這部片時想到玩命關頭5，因為也是搶銀行的劇情。不過劇中原以為也會有瘋狂飆車的

  畫面，但正好相反，卻是「塞車」的狀況。接著上演槍戰前的劍拔弩張緊張感。但這也讓

  我印象深刻許多，沒有因為塞車，而突然出現大違規、展開機翼、噴出氮氣的畫面，只有

  準備生死一搏的硬畫面，雖然帶頭者最後死了還在想電影怎麼結束，就在此時，影片帶到

  有手銬，卻沒有犯人的畫面，然後在另一個地方，西裝筆挺的犯人，瞬間串聯一整個故事

  ，有種時間暫留之感，因為從頭到尾帶頭的不是他，但它確實是最黑的。

  接下來談流氓警察，以許這樣可以加快辦案速度，對嫌疑犯施以苦行。方法沒有好壞對錯

  ，只有如何選擇而已。也看到都是保護人民、機構的兩方組織，對同一事件不同看法，管

  轄權也沒有劃分好，出現多頭馬車現象，這樣一來底下的人超難辦事(上班族一定懂)。公

  家機關如此，私人機構也可想而知。

  再來是，我覺得片中還有一個令我印象深刻的場景，在搶銀行時，鳴槍，卻沒有殺人質，

  做事很有原則、紀律，不碰手無寸鐵的第三人，這也要運用到生活中，沒有紀律，成不了

  大事。

  總結心得1. 最黑的卻是最白的2. 壞人雖壞，但還是有鐵則3. 口風緊，成大事。


  --'
