url: https://www.ptt.cc/bbs/movie/M.1521217053.A.C8D.html
title: '[普負雷] 過於冗長的極盜戰'
content: '這部之前看到預告就很期待了

  尤其是那句：我們才是壞人

  整個帥到不行啊啊啊啊！


  但實際看完覺得浪費時間又不知所云

  一部140分鐘的片大概有40分鐘在講廢話


  奇怪的點如下

  1. 硬扯家人不知道在講什麼鬼

  是要表達警察雖然像個流氓但其實很愛家？

  壞人其實也沒那麼壞？

  2. 警察一回家老婆就說收到警察傳來說你昨晚很辣（？）的奇怪簡訊然後就暴怒分居

  3. 在餐館硬要搭黑人小夥子害他被懷疑

  4. 主嫌要求小夥子告訴警察說週五要搶劫，既然小夥子才是幕後主嫌為何要實際告知時

  間？

  5. 警察找妓女回家，主嫌闖入後妓女說我只是照著你說的做這段也完全看不懂

  6. 明明還沒脫離險境，小黑胖就好像打完收工一樣完全不需要幫忙指路


  然後辦案跟犯案畫面同時穿插進行這段也沒怎麼加到分只覺得有點亂


  唯一感到有呼應的只有小夥子說：你知道我是最不可能出賣的人，跟後面是幕後主嫌有呼

  應


  個人認為這種片拍得緊湊、動作畫面多應該是很好發揮的

  到底是怎麼拍成這樣的...


  --'
