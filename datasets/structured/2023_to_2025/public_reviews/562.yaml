url: https://www.ptt.cc/bbs/movie/M.1521559433.A.A26.html
title: '[普雷] 極盜戰-精彩有餘,深刻不足 '
content: "你看過警察視角的動作片，也看過歹徒視角的動作片，但看過同時兼具描寫兩方視角的電\n影嗎？(嗯其實好像也是有不少)「極盜戰」就是這樣的一部親情友情警匪動作鬥志大雜燴\n\
  片，你會被電影裡震耳欲聾的槍戰場面激起當兵打靶(?)的沸騰熱血(京站威秀槍戰那段的\n音效真的是過大聲)，但也會在走出電影院過五分鐘後，就開始對於這部電影要表達的主\n\
  題開始茫然開始淡忘。\n    從傑哈巴特勒飾演的BIG NICK警探一出場，你就會知道他不是個好惹的貨色：會在犯\n罪現場丟下吃到一半甜甜圈，犯下浪費食物大罪的他，帶領一幫Hardcore的警探小跟班們\n\
  橫行洛城(事實上也真的是小跟班們基本上你不會記得任何一個人的名字)，恐嚇，嫖妓樣\n樣來。對比起Merrimen帶領的行事謹慎，不胡亂殺人的犯罪集團可說是天差地遠，電影中\n\
  也穿插著不同的感情支線與兩大頭頭交鋒的戲碼(事實上就是互相瞪來瞪去示威)，堆砌起\n山雨欲來風滿樓的緊張情勢，但這些意圖增添人物血肉，讓你對他們產生情感連結的戲碼\n\
  ，卻為讓時間給後面主軸的中央銀行搶案而顯殘缺不全，只會讓你在那些人最後領便當的\n時候，產生: 「呃ok他有老婆有小孩會吃飯會尿尿然後現在死掉囉演的不錯good\
  \ job~」\n的想法。\n    主軸的中央銀行搶案十分精彩，細節規劃的縝密程度超過100分(看不懂就跟著說好看\n就好了)，雖然前面的調虎離山分行搶案稍嫌大費周章且意義不明，但到中間，你還是會\n\
  忍不住為兩位吃了放到臭酸速食中餐的黑人大媽們掬一把同情之淚(關注的點十分奇怪)，\n最後的反轉結局也沒有到十分令人驚喜，但值得關注的是，飾演幕後主腦Donnie的\n\
  O'Shea Jackson Jr.繼「衝出康普頓」之後，這次再度衝出銀行衝出洛杉磯，究竟下次會\n衝到哪裡呢？就讓我們拭目以待。\n\n--"
