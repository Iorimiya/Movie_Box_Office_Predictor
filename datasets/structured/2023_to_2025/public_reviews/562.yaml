url: https://www.ptt.cc/bbs/movie/M.1521514611.A.EAD.html
title: '[好雷] 極盜戰-這世界並不是非黑即白（有雷）'
content: '—————-以下有雷















  電影及訴說著一群訓練有素的強匪要準備幹一票大的

  接著又出現了一群彪形大漢佔據了案發現場，Big Nick

  這部片很妙的是它將Nick朔造成一個流氓性格

  Nick他也稱呼為自己是有牌的流氓，會用黑幫方式逼問嫌疑犯

  開一些種族玩笑，夜店開趴樣樣來


  反派本身則具備的性格卻好似正義的一方

  話少多幹事（壞事XD），智謀十足，且有原則（不殺平民）

  這樣的角色設定其實蠻有意思

  正反兩派都以獨特的設定去完成自己的使命


  而兩邊會在私底下相互交鋒，打探對方底下Nick

  明知道到對方在某個餐館吃飯，就是不免俗的要去嗆一下

  還會去實彈射擊館，去打探對方實力，結果被對方射擊技術嚇傻


  而這之中最不可或缺的就是Donnie，一個胖胖黑人

  這部片他表面上擔任兩邊的雙面間諜，同時受兩邊的壓迫，逼問

  而去進行任務，並透露消息給正反兩方

  看起來原以為是一個可憐的角色

  成為兩邊鬥智的旗子

  從先為反派打探佈置案發所需，在幫反派聲東擊西的透露消息給Nick

  這個角色我在片裡剛開始的時候就認為他一定會死

  結果最後的結局讓我大吃一驚


  最後的槍戰我自己反而覺得算是尚可接受而已

  反倒是劇情的設計我會推這部片

  整體角色設定十分鮮明，大主線設計得非常有趣

  搶銀行的過程也有讓人出乎意料

  看到後面還不太能看懂它成功逃出的過程，或許是智商太低XD


  扣除有些橋段稍微冗長

  還算是一部不錯的片

  -----

  Sent from JPTT on my iPhone


  --'
