title: '[負雷]極盜戰'
content: '開頭好看


  但也只有開頭而以了


  開頭槍戰過後 品質直線下滑

  灌了超多親情戲 然後這些不知所云的感情戲


  跟劇情完全沒影響 可怕的是這些還佔了一半時間


  明明是反派的計謀比較完善


  結果主角一邊開車 一看到賊車就馬上知道

  那台是反派開的  主角內建鷹眼的嗎


  說什硬派主角 電影描寫感覺只是連家庭都不想顧的大老粗

  沒事就去挑釁反派 有勇無謀

  最後的槍戰也只是為收尾而收尾


  主角贏的點也只是火力比較強 還有剛好塞車

  塞車主角還說不等支援 要強攻 還害死隊友

  實在看不出都塞成這樣了 反派能去哪?


  宣傳還說沒看到結尾不知道誰是主謀


  也是拉  照你這種東缺一塊 西缺一塊的舖梗法

  你說主謀是開最後開清潔車的也可以




  --

  因為反派現金在車上 塞車狀況下等支援算是比較好的選項吧

  反派威脅唐尼那段也只是演給觀眾看而已 演給其他人看也超不合理

  他們都是足球隊成員不是嗎? 導演不能閃過幾個畫面

  就說這在鋪梗 沒人會去注意路人吧

  扣掉不知所云的親情戲 還算可以看得

  我不能接受有勇有謀只想賺點生活費的反派因為劇情需要輸給

  自認為硬漢的警察

  你居然沒發現他老婆才是主謀這神伏筆 罰你重看'
