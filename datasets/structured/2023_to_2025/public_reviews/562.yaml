url: https://www.ptt.cc/bbs/movie/M.1521382839.A.1EE.html
title: '[普雷] 極盜戰和玩命颶風：如何聰明搶銀行'
content: '身為一個喜歡看偷盜片的觀眾

  因為《極盜戰》和《玩命颶風》不知道要選哪部好，於是就都看了

  以下是簡單心得



  極盜戰：


  一群訓練有素的搶匪搶聯邦儲蓄銀行的故事，目標物是待報廢的舊鈔。


  這部片的節奏很妙，它前面花了很多時間去介紹每個角色無關緊要的日常，讓我有點意外


  因為一部搶銀行的電影大致上會有這樣的流程：組隊、計畫、行動、成功得手逍遙法外。


  但是這部電影除了上述流程，還塞了很多額外的東西，比如警察和老婆的婚姻危機、警察爸爸到小女兒學校外面說很想她、搶匪爸爸警告女兒的舞會男伴要保護好他女兒的安全這些對於一個搶銀行為主題的故事來說都超級突兀！


  搶銀行的故事就是看爽的啊！在那邊演警察要和老婆離婚真的超級解嗨！沒人想知道好嗎！


  也因為這些無關緊要的敘事，導致片長140分鐘！如果把家庭戲刪掉，我會給好雷，因爲計畫還滿聰明的。


  ──────────────


  玩命颶風：


  反派趁著颶風的時候搶六億鎂，正派的主角們要誓死保護錢的故事。反派目標物一樣是待報廢的舊鈔。


  偷盜片結合颶風的災難片元素還滿新鮮的，但是反派太腦殘，我覺得很可惜。反派的選角就是一臉寫著「我是反派」，我是警衛也不讓你過去（然後就被射殺了）


  然後這片搶銀行的計畫，幾乎沒啥特別之處，就是內賊控主場，然後退場策略就是趁颶風來大家在防災沒人管他們的時候離開，沒想到颶風太大了，就把他們捲走了～～～～～捲走了～～


  主角們利用颶風風大雨大的特性來以寡敵眾是還滿有趣的

  但是三個主角都沒啥魅力，反派又很平板，是這部片的可惜之處



  結論：

  我喜歡看智取的搶銀行片，所以我比較推《極盜戰》

  即使它的家庭戲真的很冗




  -----

  Sent from JPTT on my Asus P024.


  --'
