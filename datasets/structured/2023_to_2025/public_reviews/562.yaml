title: '[普好雷] 鑽石大劫案:極盜戰'
content: '防雷


































  好好笑,才在稍早版友文章噴第一集

  結果當天就意外拿到免費的票,那就不看白不看嘛

  有經歷第一集的調性+版友po文,所以有調整好心態

  就是個普通稍有看點的劇情片

  都是傑哈巴特勒在撐,他還是跟第一集一樣有氣勢

  不然其他人都超級扁平,可能我也會看不下去

  第一集到現在七年了,我都還記得那個反派蠻帥的

  還記得後面他架起機關槍掃射真的超帥


  這部電影不說他劇情片的奇怪調性

  他基本上是個大胖子,有很多累贅片段

  像是後面他們入侵保險庫很鉅細靡遺的拍出來

  我後面直接看到發呆,整個過程就是不夠乾淨俐落

  會有種把電影當影集拍的感覺,又沒有影集的優點

  不過我覺得過程還滿專業的,不過我不是職業盜匪

  版上有哪位對竊盜專業的可以解釋一下？

  後面的五分鐘槍戰本身中規中矩

  但終於給了觀眾他們迫切需要的抒發點

  所以本身拍的好不好已經不重要了

  反正當時他們就算拿水槍互射我都買單


  我真心不懂這個系列為何要當劇情片拍

  應該是說我知道導演在想什麼

  他是知道自己在拍什麼的,他知道自己想要什麼

  只是很多事情都拐一大圈,很奇怪

  他也沒有厲害到讓人心服口服

  反而造成很多負評,我是不會想再看一次,這集更是！

  也許有時候會沉浸在世界觀裡面

  大部分時候則是深深感到拖泥帶水

  幸好我是看免費的,不然我應該也會很不爽


  ----

  Sent from  on my Samsung SM-S9280


  --

  萊斯特在最後敘述中講述了生活中有意義的經驗，他說，儘管他死了，他還是很高興，因

  為這世界上有這麼多的美


  --'
