url: https://www.ptt.cc/bbs/movie/M.1521358843.A.198.html
title: 'Re: [普負雷] 過於冗長的極盜戰'
content: '表現出鐵漢柔情吧，看他跟匪徒殺的你死我活但又最後又會為歹徒的死感到感傷以及他對

  女兒的關愛感覺的出來是想表達這個


  這邊應該是說警察要辦案難免要跟妓女打交道，從後面跟匪徒女友上床套線索看得出來，

  只是沒想到是反倒中了匪徒的套路


  破壞敵人內容和諧，讓他們互相猜忌


  時

  你不覺得主角是最後才恍然大悟嗎？

  就陰主角啊 提供線索讓警方焦點在那銀行，但其實是調虎離山之計


  一般來說 離開大樓後應該要有人接或其他方式快速離開，在那用走的，是故意給主角機

  會逮住他，讓主角跟匪徒拼命，漁翁得利

  呼


  我覺得又是一部預告片誤導觀眾的片，讓觀眾以為會有大量的火拼 動作 追逐等，但這片

  其實是鬥智計謀蠻重的，在預告片沒當賣點呈現，吸引了一群想看警匪槍戰片而來，但槍

  戰追逐又不多，大概才約三成，中間塞一堆劇情，辦案過程，情感戲，就像一家西餐廳，

  菜單卻大多是台式小吃，驚不驚喜，意不意外?


  --'
