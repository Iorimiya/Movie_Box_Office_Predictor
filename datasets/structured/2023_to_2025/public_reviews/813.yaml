title: '[好普雷] aespa: MY First page   '
content: '其實內容還蠻宣傳導向的 有點不免誇大

  前面1/5也有點覺得不要一直播Youtube湊數好嗎


  但整體來說 我在樂聲大廳看

  這麼大的卡皇實在是很香啦 Youtube可以睜一隻眼閉一隻眼

  後面演唱會跟Solo就真的是香噴噴


  不過如果能有夠有更多私下紀錄的片段就更好

  以這提高的票價來說 片長真的也希望再長一點


  也必須說 對車庫來說看來是有商機的

  SHINEE之後又出aespa 高於一般票價的電影

  可能也是因為最近比較沒有大片 結果不只樂聲

  好幾個影院一天總會有幾個時段把最大廳讓給aespa


  追星族的錢真的好賺呀


  --

  話說很想知道贈品小卡是不是真的照機率呀?

  蠻想知道有看的人...你們分別拿到誰的卡?


  --'
