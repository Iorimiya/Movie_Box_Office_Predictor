title: 'Fw: [好微雷] 《從今以後》有著細膩情思，與少少不合時宜'
content: '作者: elvayanzimei (柏C) 看板: HK-movie

  標題: [心得] 《從今以後》有著細膩情思，與少少不合時宜

  時間: Sun May  5 00:06:01 2024


  這次從香港返台前，選擇了這部從不同角度切入同志議題的《從今以後》。結果開演時間

  到了都還沒開始放預告片，才發現原來是買到了映前謝票場XD


  看完電影可以理解台灣現在為什麼還沒有代理這部電影的相關消息，因為《從今以後》有

  點不合時宜，甚至可以說目前或許是電影最後適合被拍出來的時間。


  故事從女主 Angie 的同性伴侶 Pat 的驟逝展開，我想應該沒有人會否認，為了錢，為了

  自身利益，有法律關係的家人之間可以變得多不親，又更何況是在香港，尚不能結婚的同

  性伴侶？


  但我會覺得電影的成長弧線抓得太小，也不符合現在的主流價值（這很可能是因為我身處

  在台灣）。兩人曾作為家人其實根本不需要什麼證明，該怎麼處理身後事，好好的送對方

  最後一程，「親戚」的置喙、現實考量，老實說也從來就沒那麼緊要。


  因此我才會覺得電影有點微妙，更像是大一輩人的情意結。因為儘管結婚是兩家人的事，

  主角始終還是陪伴彼此、一起前行的雙方。


  還是電影尾段應該畫風一變，直接拍成狗血爭產戲（Ｘ


