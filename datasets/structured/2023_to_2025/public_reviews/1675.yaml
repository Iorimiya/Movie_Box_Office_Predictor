title: '[新聞] 法國同名小說改編電影「燃燒的玫瑰」凱薩'
content: '法國同名小說改編電影「燃燒的玫瑰」凱薩獎影后華麗復仇


  2023/05/04 聯合報／記者陳建嘉／即時報導


  凱薩獎影后蕾雅杜嘉（右）在新片「燃燒的玫瑰」中，飾演財團千金遭親信背叛，慘淪流

  落街頭的貧民。圖／中影提供



  榮獲今年凱薩獎兩項大獎提名的犯罪電影「燃燒的玫瑰」，是法國文壇巨作「天上再見」

  的正宗續集，並找來凱薩獎影后蕾雅杜嘉領銜主演。故事描繪一位財團千金遭親信背叛，

  慘淪流落街頭的貧民，但她為奪回屬於自己的一切，決心賭上生命，策畫一場鬥智鬥勇的

  復仇鬥爭。


  電影改編自暢銷同名小說，在法國叫好又叫座，不僅榮登年度十大暢銷書，更獲得法國世

  界報好評讚許，形容作者皮耶勒梅特「簡直是21世紀的大仲馬！」直誇「燃燒的玫瑰」故

  事結構細緻，堪比文學名著「基度山恩仇記」。電影版特別邀請到原著作者皮耶勒梅特親

  自撰寫劇本，讓這場腥風血雨的復仇故事，終有機會躍上大銀幕。


  獲譽法國犯罪小說大師的作家皮耶勒梅特，曾於2013年以「天上再見」一舉奪得法國文學

  最高榮譽「龔古爾文學獎」，翻拍的同名電影更橫掃當年凱薩獎13項提名，可說是當今法

  國文壇、影壇都相當知名的小說作家。


  作為「天上再見」正宗續作，「燃燒的玫瑰」同樣備受大眾矚目，故事延續前作的世界觀

  ，描繪同一個家族在時代變遷的興衰轉折，帶領觀眾回到1920年代，處於第一次世界大戰

  後、希特勒政權崛起前，精彩刻劃一場登峰造極的復仇鬥爭。「燃燒的玫瑰」一上市便榮

  登法國年度十大暢銷書，更成為皮耶勒梅特奠定當代犯罪大師地位的巔峰之作，因此電影

  版能找來原著作者親自撰寫劇本，可說是讓書迷們期待萬分。


  「燃燒的玫瑰」的劇情發生在「天上再見」結局的七年後，當富可敵國的金融巨人馬塞貝

  利庫終於逝世，女兒瑪德蓮（蕾雅杜嘉 飾）成了金融帝國的唯一繼承人，在她父親的喪

  禮上政商名流齊聚，沒想到七歲的兒子竟從頂樓一躍而下，為家族蒙上更深層的陰影。


  遭受厄運打擊的瑪德蓮，接連受到財團主管們的趕盡殺絕，以及愛人、親信背叛，整個金

  融帝國的資產竟在一夕之間化為烏有，自己只能帶著半癱的兒子淪落街頭。備受命運欺侮

  的她，誓言要奪回失去的一切，乘著社會風氣走向貪婪當道、極權興起的時刻，她策劃一

  場足以顛覆德、法兩國政壇的瘋狂復仇計畫。


  這部驚豔法國文壇、影壇的新片「燃燒的玫瑰」，是由演而優則導的法國男星克羅維斯柯

  尼拉克執導。他為了呈現這場史詩般的世紀最華麗復仇，狂燒1600萬歐元（約5.5億台幣

  ）成本製作，橫跨巴黎與史特拉斯堡兩地拍攝，精緻華麗的場景及服裝，讓電影獲得法國

  影壇最高榮譽凱薩獎最佳服裝設計、最佳美術設計等兩項大獎提名。


  此外，本片更集結凱薩獎影后蕾雅杜嘉、比利時國民影帝貝諾特波維德、坎城影帝奧利維

  耶古賀梅三大實力派巨星主演，為爾虞我詐的復仇大戲再添火藥味。「燃燒的玫瑰」將於

  5月5日在台上映。


  「燃燒的玫瑰」狂燒5.5億台幣製作，更獲凱薩獎兩項大獎提名。圖／中影提供



