title: '[  雷] 鬼偶—故事老梗而且沒說好的泰國鬼片'
content: '只加了海報的鬼偶心得：




  簡介一下劇情，男主角為了尋找出家的哥哥，來到了一座虔信護身符人偶信仰的島上，這座

  島的人信到甚至會用人的屍體做成護身符人偶（就像是外觀比較噁爛的兵馬俑殭屍一樣，只

  是可以用咒術驅動）。


  但島上寺廟的住持告訴他，他的哥哥已經失蹤了，於是對護身符人偶信仰嗤之以鼻的他，決

  定要在島上待著，查出哥哥失蹤的真相。


  他追查哥哥失蹤真相的同時，島上發生了數件和護身符人偶有關的詛咒和死亡事件，男主角

  和他在島上認識的人們也陷入了這些詭異事件之中，基本上大概就是這樣的故事。


  我覺得因為劇情很老梗，故事走向不難猜，外加為了鋪陳反轉謎底（但我還是覺得結尾轉得

  很生硬，實在是為轉而轉，不合邏輯，而且也不難猜），導致劇情剪輯支離破碎，加上導演

  編劇對劇情的安排很隨意，有很多毫無邏輯，單純只是要讓鬼怪突然跳出來嚇人的安排。所

  以醞釀不太出來這部電影的恐怖氛圍，實在不太驚悚，反而吐槽點滿滿，真的蠻可惜，浪費

  了看起來製作誠意滿滿的道具們。


  相較之下，前幾個月上映的邪厄就好很多，邪厄的心得可參考：（不過我朋友就不太喜歡它

  的敘事方式，所以可能還是要看個人的喜好）




  只能說好看的近年好看的泰國鬼片，還是不太容易找到。


  然後裡面那個妹子真的是全片最衰，沒有之一，只能幫她QQ




  ----

  Sent from  on my iPhone 13


  --

  「阿鍾。」常記得有人這麼呼喚，分明是哥哥的聲音，阿鍾偶爾應聲道：「小辛。」那是

  他叫哥哥的方式，「祝阿鍾和小辛白頭偕老。」那是不知道什麼人寫在哥哥大學紀念冊的

  戲謔留言，紫色的墨水筆跡，隨著歲月漸漸暈開淡化，解離成了藍色字體與粉紅色水痕，

  想著那水痕，答案全具體了，阿鍾是哥哥的少年好友，紀蘭從沒忘記過那張年輕的臉孔，

  始終懷念那許多次的共同出遊，只是需要各種訊息拼湊，才能將名字與影像聯想在一起。

  怎麼在記憶裡，最遙遠的路程卻是直線距離。　　      ----朱少麟<<地底三萬呎>>


