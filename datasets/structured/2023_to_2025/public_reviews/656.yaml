title: '[  雷] 消失的豪門妻'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  久違了，三谷幸喜


  如同過去「有頂天大飯店」、「大空港」等電影


  三谷電影的特色就是將場景設定在某一個空間


  找很多不同的演員，各自發生不同的故事


  但有些故事可能會串連在一起。


  這次豪門妻可能是某個新的嘗試，


  故事劇情設定在某個有錢的詩人家中，


  他的年輕妻子索米(長澤雅美飾演)失蹤，


  陸續到來的相關人士全都是索米的前夫，


  包含現任在內多達5位老公。


  透過這幾位老公對於索米的印象，


  發展出五種不同的索米人格。


  並藉由小小的偵探推理，


  (尋找綁架索米的真兇)


  讓故事劇情得以順利進行。


  因為是荒謬喜劇的架構，


  應不需要太過嚴肅的批判是否有詐欺騙婚的嫌疑，


  雖然片商的宣傳是把長澤雅美當作是信用詐欺師來形容。


  不過也因為不好設計結尾，


  終究讓結尾只能用跳舞來結束


  顯得有點冗長且多餘。


  消失的豪門妻是三谷的一個新嘗試


  至於有沒有突破三谷自己，就讓鄉民自行判斷。



  --'
