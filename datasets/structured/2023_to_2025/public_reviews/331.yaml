title: '[普負雷] 《時速機劫》撐不起片長的高概念'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  《失速機劫》(Flight Risk)是一部高概念電影，這樣的電影通常強調高節奏以及娛樂性

  ，我也喜歡這樣在狹小空間鬥智的故事，如果拍得好往往很刺激。但這部電影的概念高到

  用兩分鐘的預告幾乎就可以把整部電影演完了。而在整部電影或許唯一可以稱做是懸念的

  部份(誰是殺手)已經在預告片裡揭露時，你或許會懷疑，那麼剩下的大概80分鐘片長還能

  演什麼？

  .

  有這樣的質疑是正常的，但當我看到導演是梅爾吉勃遜時，我蠻相信這片應該還是有料的

  ，雖然做為演員的他已經過氣了，常演B級動作片，但身為導演的他一直還是蠻愛惜羽毛

  的，這片應該是有什麼過人之處吸引了梅伯，讓他願意在睽違十年之後，再次拿起導演筒

  ......

  .

  好吧我想太多了，看完之後突然覺得，會不會名字掛在導演欄上的那個梅爾吉勃遜只是剛

  好跟我們熟識的那個梅爾吉勃遜同名同姓而已？因為就真的，除了預告片已經演完的東西

  以外，還真的沒有其他什麼額外的東西了，這片感覺像是近年來大量產出你沒看過的布魯

  斯威利電影、你沒看過的席維斯史特龍電影得那些導演會拍的過水動作片。

  .

  當然這樣說可能有點誇示，並不是說這片糟糕到連基本的敘事、剪輯、運鏡都處理不好，

  梅伯再怎麼樣都功力還是比那些名不見經傳的導演牆上許多。不過莫名的是這片感覺可能

  就是梅伯缺錢來兼差的，而他這樣的工作精神可能傳染給了演員們，這片每個演員感覺都

  在亂演一通，尤其是跟女主角在飛機上通話的那些人們，台詞念得有氣無力的，我知道這

  應該是導演想要塑造一種「每個人都很可疑、不知道誰可以相信」的懸疑氣氛，但最後呈

  現出來的結果，卻像是每個人都只是想快點錄完台詞然後收工回家。

  .

  但還好我們有馬克華伯格，他看起來覺得這可是讓他展現演技的大好機會。

  .

  這確實，因為馬克華伯格的角色就是這部電影最大的看點跟威脅，我們要看的是他將如何

  運用他毫無道德底線的邪惡計謀、還有他對這架飛機的熟悉來反殺主角們。

  .

  問題是，這片的場景真的太小、可以利用的環境跟道具還有人物都太少、馬克也還真的從

  頭到尾沒有使出什麼了不起的招式，為了讓他可以有點作為，其他角色都必須配合他降智

  演出。說真的，其實女主角跟她押解的犯人只要分出一個人力盯著馬克看，確保馬克每次

  回復意識後都再把他弄昏，他們基本上就可以非常順利的完成這趟飛行。

  .

  這片其實就是那種，你如果開始看了、知道這片的劇情大綱，你會想要看下去，會好奇接

  下來會有什麼發展、會不會出什麼逆轉、或是馬克是不是在藏招─啊我就是看完預告後很

  好奇才來看的─而這部電影確實也並不無聊，最後一段也提供了還算有點可觀性的場面，

  但可惜的是這片終究沒辦法滿足觀眾的好奇心，等你意識到這片好像根本不會發生什麼大

  事時，電影也差不多準備演完了。

  .

  我這樣說好了，這部電影娛樂性最高的部份，或許在馬克華伯格的帽子掉下來的那瞬間就

  演完了。


  --'
