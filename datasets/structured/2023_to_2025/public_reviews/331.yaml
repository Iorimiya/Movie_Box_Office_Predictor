title: '[荒謬負雷] 失速機劫   搞笑長文慎入'
content: '雷文防雷資訊頁



  不知不覺寫太多字了  是在中華電信MOD看的

  怕大家沒準備看不完文章提前備註一下


  我只希望寫了娛樂大家    不能只有我看過

  太過荒謬了  以這片的規模來說 我是這樣評價



  但我有稍微調整一下電影出現段落讓文章通順，一樣先說明


  馬克華柏格/梅爾吉勃遜 強強聯手 2025年最新!!!!



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  失速機劫

  看之前沒研究，只因為MOD看到封面是馬克華柏格唯一大頭特寫，

  然後文字介紹寫說他是飛機駕駛員運送嫌犯，

  但機上有人不想讓任務成功這樣敘述，喔喔喔我知道，就是一坨人猜身分心理戰嗎

  馬克華柏格這種片理應挑的不錯來瞧瞧，以下簡稱他老馬

  哎喲片頭發現導演梅爾吉勃遜，挖塞至少中上以上了，很不錯不錯喲

  開頭的人犯我見過很臉熟耶，不錯耶，寫文的時候查了是陶佛葛瑞斯，以下稱小陶

  有演過蜘蛛人3的猛毒、大公司小老闆，難怪我眼熟

  好的，制伏人犯上機啟程!!!要正式來了，興奮!已知機長是老馬人犯是小陶，

  女法警是梅德琳我簡稱小梅吧，那其他的應該有他的搭擋、通勤旅客ABCD包含買補給的、

  觀光的、碎嘴炫富的、刺青的、蒙頭巾的，

  最好人數能含各大族裔最近流行嘛可以的......


  等等......咦，就這三位......那猜屁阿，好我冷靜，

  還有可能是後面行李艙會跳出來或中間加油遇到人之類的，好的我沒問題

  再五分鐘，噢老馬身上有傷口，駕照不是他，噢花熱發不用猜阿

  導演編劇不走懸疑路線是要幹嘛，

  喔喔是要走小空間對峙求生路線，類似顫慄空間或王牌對王牌嗎?? 這樣也很強耶更猛

  我暫停跳出去看預告確認，我不要再誤會導演編劇了

  看完預告喔好的，也不是小空間對峙求生，因為預告的重點在飛機墜落還被戰機追!

  !!!!!!

  戰機打不下一架民用破機，好好好，怎麼辦到?荒謬的閃躲戰，這唬爛我好奇，續看!!


  接下來開始我各種吐槽的觀影邏輯意外了，整體是編劇鍋還導演鍋我不知道給誰，都罵!!

  但我先稱讚我唯二能稱讚的，小陶的演技非常一流水準，這篇文我20%為他而寫

  老馬本身演的就......尬，我不知道他想呈現恐怖、搞笑、冷靜心機、瘋狂還是什麼?

  第二稱讚導演梅爾吉勃遜在鏡頭剪接節奏上和畫面呈現還是大片大導水準，

  但雷在其他地方!!


  續，身分揭曉當時，我對於殺手會把駕照攤給乘客腳邊看見這個粗心，開始皺眉了

  女主小梅第一戰肉搏輸掉合理，醒來拿電擊槍要伏擊也合理，

  但老馬背身講一大段半分鐘的時候幹嘛不上呢，電影常識鏡頭不都是後背區為主嗎?

  因為手勾不到身體也甩不走還靠近脊椎阿，那小梅選擇何時呢?

  居然是自己已經被勒脖的當下去電對方不知道在哪又很靈活閃躲的頭蔀

  不過沒關係導演編劇開主角威能，殺手勒脖的動作異於常人喜歡貼近被害者的耳邊

  增加被插眼的機率，好險他只被電到，好幸運阿我說這兩位

  這個電擊也絕對是你整部片記得最深的畫面!!!!!!  老馬的禿頭和傻臉就是那記憶點

  演技不夠、造型來湊，可勘比較的就是死侍二裡，布萊德彼特飾演的隱形人客串

  露臉1秒成為我整片唯一記得的畫面，他們兩位通常演技還行我純粹就這片裡的老馬表現

  講而已


  短暫擊退老馬後，小梅滴汗未流隻手未抖視腎上腺素如無物的鋼鐵神軀，

  選擇先關心小陶的身心狀態，無視倒地未綁的老馬，

  也不撿槍/撿刀/搜老馬身/解自己手上繩子

  我眉頭一直皺很無奈，果然十幾秒就再被老馬壓制順便壓到駕駛桿讓飛機90度俯衝墜落，

  只好再電昏老馬一次，小梅五秒內踢開老馬，華麗站起轉身坐回駕駛座拉起飛機，

  等等，我雖不是理工的，但俯衝超過重力加速度狀態下這些推轉坐這麼輕鬆嗎??????


  終於撿槍了，那把老馬刀想撿但秒忘了撿就是，可能不是自己的刀特別容易忘吧，

  找到急救箱剪刀解開自己繩綁後，立刻忘了十秒鐘前自己還在找老馬刀呢??奇妙的女人

  萬一是壓在老馬身旁是多棒，美國警匪片和現實記錄片，近身上銬前一定先踢開凶器

  這算常識吧，沒記性也沒常識的小梅，之後應該會有更猛表現!!

  小陶小梅自此至終都自顧自和對方聊天，完全不管後方老馬動靜多大，掙脫幾次，

  反正也沒分配任務看著老馬的意思......

  終於靠著衛星電話連絡上長官閨蜜副法警長，副法警長溫柔安慰後、

  馬上請當地塔台人員連線過來協助教學駕駛，

  塔台男名叫哈珊，有著一口天皇老子急我不急的聲調，非常怪，這是一級事態了吧!

  他老兄不只不急，確認完自動駕駛和高度安全後，開始......調情小梅??????????????

  這沒見過照片的女的正要生死關頭還是司法公務還是駕駛小白，放鬆方式是調情是嗎??

  情聖哈珊!!!哈不挑，不挑時間、不挑場合、不挑對象，約就對了，

  克里斯伊凡梗圖或表同意(不誤，

  小梅果然破口大...............聲答應，不愧是妳


  沒有教學任何降落知識也不怕對方手機沒電油料乾枯只約飯的哈珊立刻關機下線，

  然後這個安全高度等會馬上要撞山了XD

  好險及時拉起沒撞上山只撞上山上厚硬積雪，機身絲毫未損，螺旋槳絲毫未停，好飛機!

  !!內破外硬

  可能導演安排哈珊是壞蛋內應之一吧，在怪地方先故佈疑陣


  小梅中途還被激將法衝去毆打老馬，而此時老馬已經壓著刀了，

  只是因為腳夾刀無法丟給手是個核心和柔軟度普通之殺手，而小梅更搞笑，

  想槍射老馬怕打穿機身，卻沒想到墊東西射骨頭就好，至少廢掉一腿安全吧


  力量很小的還我漂漂拳也不多打幾拳打暈還因為近身被寢技差點弄掛，

  金魚小梅還把剛剛帶在頭上的墨鏡就這麼忘給老馬了，妳老奶奶嗎??

  好險老馬這下寢技本來也不是要索命，倒也不是主角威能，

  接下來轉入小梅感性懺悔時間，原來是之前自己膽小怕死害死了證人被罰內勤，

  好險閨蜜副法警長幫當人保拉回來出外勤這還第一趟呢還沒人搭檔陪去，

  這什麼大心臟主管阿我的天，然後突然小梅警覺是局裡有內鬼，

  而且直接懷疑和她私交多年還提拔的閨蜜長官，她剛剛還幫小梅找塔台來救......

  懷疑心起的小梅當下決定不等了，直接在機上越級告御狀，

  十秒哭鬧下硬要接線員找到度假法警長來聽，

  找到法警長後沒想到自己也沒推裡就硬投訴，

  掛完電話十秒鐘覺得自己太蠢又回去警告閨蜜副法警長

  閨蜜怒了但仍要她專心降落，然後閨蜜長官立刻就在遠端被滅口了......還得是妳阿小梅

  十秒殺一人，宮廷劇歷史巔峰，蠢瘋!!!!


  老馬又双叒雄起，刺重傷小陶後，搶到槍，射五六發一陣操作猛如虎，一發未中......

  我說的不是未中小梅，是包含機身任何部位，所以這是什麼薛丁格的子彈??? 好先不管，

  只看小梅從容拿到一發信號槍，一次將百斤大漢震飛到機尾，

  一顆神彈不知啥牌出神力了????

  不過力大無窮神彈能載飛人卻無法穿進身體，

  而且老馬好像特別怕仙女棒那樣的東西情緒大失控又被敲暈，

  然後小梅在無比相信自動駕駛之下大開了機艙門通風消散滅火噴霧，

  那妳剛才怕子彈在飛機上開小洞是在三小朋友????

  好，導演說飛機不管怎樣開門都會飛很穩沒關係，結案!

  大家搭機逃生門是不是也可 (x萬萬不可


  壞Boss法警長打來安撫順便告知閨蜜已死，

  小梅暴怒直接嗆聲下機走著瞧而不是假裝感謝內鬼已除裝傻

  ，Boss說下機我人馬接手，小梅說不管，你總之是死定了要給你好看，丟麥


  終於情聖哈珊再度打來，記起忘了算油料，

  小梅也沒想起自己剛剛依照他指示的高度差點撞山，我幫雙方醜平吧!

  反正約自己吃飯的一定好人加帥哥，穩吻的穩吻der，但小陶重傷小梅想快點到，

  加到最速油料夠嗎，哈珊說很危險但妳決定公務優先我尊重，小梅秒選加速到底，

  飛不到就沒公務也沒命也沒飯了，兩位的選擇我不太懂就是，

  然後兩人還是沒聊「認識飛機和怎麼降落」，先聊飯，關機下次聊


  戰機戰機，來了終於來了，老馬獰笑說一定是為了怕妳摔進村莊想擊落妳了，

  我是想說一定是大Boss動用關係想另類解決，

  老鷹抓小雞荒謬追擊要開始啦，怎麼掰啦哈哈

  編劇不掰，戰機駕駛只是親切擺手請他們繼續飛就說再見......

  ......我到底是期待了個啥??


  降落時間要到了，小梅終於發現剛剛很長時間瀕死無力的小陶沒繫安全帶，溫柔繫上，

  但剛好沒油了耶哈哈，哈珊打來，終於肯教導降落了，也都不管小梅是否聽的懂，

  好險小梅這次有自己開口問，也好險沒油還可以飄降落加上不會炸????

  美美旋轉四圈半落地後，

  小梅看到有穿救護員衣服和警察的人來接小陶去手術就很安心分離，

  挖~類墜機無傷無髒無汗亦無腦震盪，梅伯導演你是整場偷懶不想等特效化妝師是吧?

  還是没請??  不可能因為老馬演禿頭阿 我好洩氣耶!

  反正小梅完全忘記法警長說落了一組人在等她倆，分離後第一件事是照鏡子，

  可能在擔心晚餐美不美有無破相?? 來人哈珊人不帥但看來憨厚，

  反正小梅可以一眼認出他並且對他笑，

  好險這時小梅注意到一位醜警察一定壞，意圖靠近救護車，

  終於想起法警長說有一組人在等她倆，上前打開救護車門終於做對了，一槍爆了醜警察，

  誰叫你醜，還大剌剌從女主前面車過去殺人，法警長派的人也是蠻智障的對吧?

  進救護車你好歹穿醫師服護士服穿啥警服就該死啦! 不過話說小梅妳一開始跟去救護車，

  讓小陶進開刀房妳再去吃飯不是比較順嗎?想吃飯就立刻忘記公務耶

  然後救護車運送大出血要開刀病患可以兩分鐘沒人在車上也沒開走是在幹嘛??

  等嚥氣??? 好吧我快笑倒嚥氣

  梅伯你是欠誰錢還是誰用錢侮辱你而你欣然接受嗎??


  編劇是Jared Rosenberg，人看起來帥帥有錢好人家，

  這是他第一部在IMDB上記錄的編劇作品，

  希望大家給予掌聲，因為他有附照片非常認真


  我希望給他掌......嘴，我給看到這裡的板友掌聲，謝謝各位QQ



  --

  I know we could both go on with our lives, and we''d both be fine.

  But I''ve seen...what we could be like together.

  And I choose us.


  You can always go to Paris.

  Just... please,not tonight.


  --'
