title: '[  雷] （普雷）失速機劫'
content: "雷文防雷資訊頁\n \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n \n\
  \ \n \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n \n \n\n\
  觀影證明：\n \n\n前言：\n憑華伯格海報沒看預告就來看了，基本上喜愛的演員不論劇情如何都會支持進場。\n\n影後簡述：\n（以下非正式稱呼）\n首先以為是黛咪護送海登克里斯須抵達目的地作證搭上好馬克的飛機過程遇上空難的動作電\n\
  影，殊不知華伯格演的禿頭變態反派味道很好，只不過掉帽子那段小弟真的笑場，還有航空\n指導員輕浮的態度原以為也是安排的內鬼所幸最後露面為墨西哥帥哥；海登一路嘴，肥舞者\n\
  ？到遭刺瀕死演的也不會太尷尬，不過馬克被吸出機體外遭輾有點意外，那他在裡面應該不\n算男一惹！最後肥魔王沒現身，只見黛咪拿起手機講接下來有得你瞧電影落幕，意思會有第\n\
  二集？不過如果海登跟黛咪再續演小弟還是會買6折票來抗抗，兩人應該要變成CP惹。\n\n\n \n\n心得：\n年紀長了雖然不太記得看過華伯格幾部電影，但心中總有一部經典的像偷天換日J個。\n\
