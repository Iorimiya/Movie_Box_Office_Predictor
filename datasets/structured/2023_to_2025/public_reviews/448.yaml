title: '[情報] 不知戀愛的我們  真人電影化'
content: '大西流星、映画初主演　『恋を知らない僕たちは』実写化で窪塚愛流、齊藤なぎさ、莉

  子、猪狩蒼弥、志田彩良と共演




  不知戀愛的我們

  真人電影化


  由大西流星主演


  可參考



  中學２年級那年難得來了轉學生。相原英二和別所直彥也跟著大家湊熱鬧，跑去看轉學生

  長什麼樣子。沒想到那名轉學生汐崎泉以前也住過這裡，和英二是好朋友。從此以後他們

  三個人放學後經常一起回家。直彥愈來愈喜歡泉，有一天終於鼓起勇氣向泉告白，兩人順

  利交往。但等到中學畢業後，泉又要離開這個城市，兩人成為遠距離戀愛…


  =====


  大西飾演相原英二

  窪塚愛流飾演別所直彥

  莉子飾演汐崎泉


  齊藤なぎさ飾演喜歡直彥的藤村小春

  猪狩蒼弥（HiHi Jets）飾演英二的好友瀬波太一

  志田彩良飾演喜歡英二的池澤瑞穂




