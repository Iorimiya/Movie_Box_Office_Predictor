title: 'Fw: [微負雷] 蜜月旅行《五等分的新娘*》'
content: '作者: lycs0908 (岳岳) 看板: C_Chat

  標題: [微負雷] 蜜月旅行《五等分的新娘*》

  時間: Fri Nov  8 14:26:49 2024



  我就直說了

  別浪費錢跟時間去看

  劇情蠻無聊的

  要看泳裝預告片幾乎就是全部了


  日本人氣戀愛喜劇全新大銀幕續作【五等分的新娘*】The Quintessential Quintuplets

  Specials 2 電影預告 11/8(五)全台上映


  啊不過要說浪費也只有錢

  時間還好

  超短只有47分鐘，屁股還沒坐熱就出來了


  主題是六個人一起去蜜月旅行

  第一天有照行程玩啦

  就預告片穿泳裝玩水那段









  然後在四個人找藉口讓風太郎跟四葉獨處的這段


  二乃遇到一個夏威夷小女孩請她幫忙擬定跟日本同學的告白計畫

  劇情就變成五個人輪流辦成二乃來陪她一整天了


  再帶到五個人長大後有各自的煩惱

  本來風太郎決定要再讓她們交換、用各自的長處彌補各自的短處

  但最後她們還是決定要自己面對


  就沒了



  不是啊你要蜜月旅行

  劇情有很難想嗎

  就結合當地特色做成旅遊番

  泳裝、私服、甜甜的互動就很好賣了吧?

  要下點猛藥就加入風太郎跟四葉的床戲就好

  結果做這什麼東西...



  話說最開頭我遲到了幾分鐘

  進去的時候她們已經在討論泳衣還有什麼罩杯變大了

  各自回憶起五年前單獨跟風太郎去挑泳裝的事

  在那前面的劇情是什麼呀?為什麼會突然像是在找犯人一樣討論泳裝



  第一週特典


  售票員拿五張蓋著給我朋友抽，應該就是1~5各一張給他抽

  他比較喜歡二乃，而我是3跟4派的


  抽到這兩張


  如果同行的人剛好喜歡一樣的

  可能要請他抽兩次1/5 1/5這樣，不能抽2/5


  我朋友還買了這個套票


  只能去新光換(我們今天在豐原看)

  他本來要跟別人看第二次順便換

  我是建議他直接拿完就走別再看第二次了


  外觀仿拍立得

  但只是長得像而已

  是一張有亮面的厚紙板


  背面有名字


  --'
