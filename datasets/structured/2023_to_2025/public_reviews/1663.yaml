title: '[ 好無雷] "金之國水之國"無雷心得'
content: '在上映前特地去看過原著，是一個很像童話的簡單愛情故事，看完電影後卻覺得動畫

  把這個故事拍的加分很多，劇情也非常的流暢，連看漫畫時看不太懂的地方都清楚許多，

  配樂也搭配的很恰當，動畫下的金之國水之國都非常美麗，人物繪製也都很精緻可愛，很

  久沒看到這麼單純的愛情故事，也很喜歡故事裡對於美女跟愛情的定義，而且意外的在很

  詭異的地方get到一些笑點，裡面的配角也都讓人覺得很喜歡，肉體派的學者莫名的很搓

  我，推薦給最近有點片荒，或者失去方向，以及想看點單純愛情故事的你。


  --'
