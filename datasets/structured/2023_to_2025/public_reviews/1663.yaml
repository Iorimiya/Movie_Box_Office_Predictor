url: https://www.ptt.cc/bbs/movie/M.1683979717.A.47F.html
title: '[好雷] 金之國水之國 優秀的改編'
content: '作者: timblue0823 (徐愛) 看板: C_Chat

  標題: [心得] 金之國水之國 優秀的改編

  時間: Sat May 13 12:19:15 2023


  進場前本來就不太擔心這部電影


  原作本來就篇幅短小 又有117分鐘的片長 改編起來應該游刃有餘


  基本上全片照搬漫畫劇情 只基於原作補了一點點小小的設定 算是更完善一點原作的世界觀


  原作我最喜歡的點是 整個故事並沒有很浪漫的內容或台詞 比起言語 角色更常用行動表達

  對彼此的情感、信任 沒有狗血或煽情 就是平穩的講述一個溫柔的故事


  電影這種溫柔的氛圍還原的很不錯 音樂部分也恰到好處 比較可惜的是公主團48的部分被刪

  掉了 我很喜歡那邊說XD 結尾的手繪ed非常的有誠意 看完很有驚喜感


  看原作的時候很喜歡第一公主 尤其她放髮的時候 她最後和穆萊特那句“不管是幾十年 我

  都會陪著你的”也是我覺得全作最浪漫的部分 可惜電影放髮的部分只有出現在最後一幕


  在板上找了一下 我應該是第一篇心得

  昨天找場次的時候有點訝異 場次意外的還不少

  因為莎拉還有納蘭巴耶爾的人設都不同於傳統男女主角 我自己覺得這部註定吸引不到路

  人觀眾進場

  會捧場的大概都是我這種原作粉 感覺最後的票房應該是會很慘烈 今天這場也是我包場


  總而言之 如果喜歡平穩溫柔敘事類型的故事

  非常推薦這部電影 原作粉也不用擔心 是很優秀的改編 也很推薦看完補原作 岩本老師的漫

  畫是很有自己獨特的氛圍的 跟電影又是不太一樣的感覺


  --

  卅六平分左右同 金烏玉兔各西東


  芳草奈何早凋盡 情人無心怎相逢


  --'
