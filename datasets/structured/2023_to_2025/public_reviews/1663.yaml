title: '[情報] 金之國水之國中文預告'
content: '這部原作很有趣(以下有一點點開頭的雷)



  背景是兩個敵對的國家因為雞毛蒜皮的事開戰

  神明介入仲裁

  要求金之國送最美的女人去水之國當媳婦

  水之國送最聰明的男人去金之國當女婿

  但兩個國家的國王腦袋都有洞

  因此就有了預告裡的故事


  --'
