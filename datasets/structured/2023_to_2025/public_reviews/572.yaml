title: 'Re: [好雷] 工作細胞真人電影'
content: '幾點感想：

  1. 免疫系統的核心城堡很漂亮，有迪士尼風。

  2. 血小板應該也是堵完傷口，生命就會終結的一群細胞，只是這樣會演出死一堆小朋友

  ，太殘忍了。

  3. 人類科技才是最可怕的大魔王，放射線無差別攻擊，殺光全世界。

  4. 最後預算不夠做重建免疫系統的核心城堡的過程，找一個小娃娃來，大地重新長草這

  樣唬弄過去。



  --'
