url: https://www.ptt.cc/bbs/movie/M.1738242634.A.8FF.html
title: '[雷] [好雷]工作細胞 感人娛樂大作'
content: '之前就看過動畫（現在系列作超多，還有貓的（？），不是很喜歡主角紅血球，但這次還加

  入black的角色（而且演員陣容好華麗


  在日本拿下多週票房冠軍，之前就很喜歡這個導演的飛翔吧琦玉，現在幾乎只看動畫片，但

  偶爾會看一些真人搞笑電影（看預告岡田將生那個詐騙電影也很有趣


  初期解說比較多，很有教育意義（？

  角色造型都超精緻，特效很多，武打場景也很精彩

  大場面很多，臨演也超多，而且細胞都是一整群，很認真選角（？

  （看工作人員名單，帽子組好像就十個


  也蠻喜歡嗨起來的那段，可惜沒做成歌舞片


  覺得後期治療過程超級冗長，雖然演員演技都不錯，但本來劇情就不算很環環相扣，讓人覺

  得有點不耐

  （想看更多爸爸體內的故事


  --



  還以為是戀愛大作，結果主打親情

  我也這樣覺得（就像君莎小姐一樣，下一代都長一樣'
