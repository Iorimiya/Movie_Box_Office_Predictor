url: https://www.ptt.cc/bbs/movie/M.1736575774.A.7B6.html
title: '[好雷] 工作細胞真人版'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  這部片算是融合了工作細胞 以及另一本漫畫工作細胞(黑)

  再加上一些原創劇情融合的作品


  單純評價這作品的話


  劇本 8 老套 但是不無聊

  特效 6 很假的特效 不過因為這部作品的風氣所以完全沒有啥影響

  整體 滿分10分的話我會給予 9分

  (這片給我不少歡笑與淚水的劇情 值得一看)


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

























  工作細胞的部分是交給高中生女兒

  而工作細胞黑則是爸爸這邊


  前面就穿插漫畫一些篇章

  女兒這邊代入白血球 紅血球 殺手T細胞等漫畫常客


  爸爸這邊則是因為飲食不正常愛喝酒啥的

  體內狀況一整個糟 前輩紅血球與菜鳥紅血球登場



  後面則是狀況一變 女兒罹患白血病之後應該是插入不少原創劇情

  鼓勵女兒撐下去的爸爸 在床上接受治療的女兒 老套的親情戲但是真的很會炒氣份


  至於女兒體內狀況則是炸得亂七八糟 因為抗癌藥劑基本上就是無差別整個炸一輪

  整個氣份和前面歡樂的劇情根本就180度大翻轉


  詳細就不多敘述 但是要我來說這邊真的是遺憾

  因為基本上就是全滅結局

  跟白血病戰鬥的過程中 NK細胞傷重戰死

  殺手T細胞氣炸往前衝但是被白血病直接壓制 同樣戰死

  白血球則在打倒白血病之後力竭 最後跟紅血球約定要繼續維持這個身體

  紅血球則是到最後的最後送氧氣到各處

  只是天上一道極光掃過(放射線治療)


  回到現實 女兒在接受骨髓移植之後撐了下來 爸爸很欣慰

  而體內一片廢墟 被放射線掃過之後一票人都被消滅 只留下滿地的衣服

  被移植的骨隨細胞站在荒廢的大地 旁邊則是紅血球的衣服與帽子(上面編號相同)


  過一段時間 體內環境整個重建 變回一開始的歡樂環境

  新的紅血球翻包包看到前輩留下來的書信 鼓勵她要成為一個稱職的紅血球


  恩 老梗 但是前面全滅那邊真的是讓我哭得亂七八糟


  如果台灣有上映的話真的是推薦去看看 不會後悔 真的


  --

  對 有一定人生歷練的話 感人橋段的殺傷力真的很強

  不過也能體會小鬼頭看這片最後會覺得無聊吧

  我看的時候最後面居然有小鬼說"還有幾分鐘阿"破壞氣份的'
