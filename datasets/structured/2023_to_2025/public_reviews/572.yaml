url: https://www.ptt.cc/bbs/movie/M.1603207467.A.330.html
title: '[好雷] 工作細胞!!特別上映版強『菌』來襲！'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  其實不太確定這篇應該放西洽還是這裡

  但想說既然是去電影院看的電影還是放電影版吧 XD


  意外的是影廳裡的小朋友沒有想像中多

  男女比相對於上次去看的少女戰車 4DX 也平均很多

  整體的觀影體驗是非常棒的


  接著來說說劇情

  我覺得電影版比起 TV 版本，每個細胞都更有自己的特性

  TV 版有時候會讓我覺得他們好像只是被套進一個模式去做事（畢竟就是細胞擬人）

  但電影版有明顯讓這種感覺稍微減輕

  但電影版的紅血球戲份少好多嗚嗚


  整部主要是益生箘大冒險 + 癌細胞的復仇

  笑點很多，而且益生箘很可愛

  最喜歡的部份是樹突狀細胞活化那段

  真的很愛這種暖暖的好人可愛男子突然黑化的部分

  而且大家一起崩潰真的很好笑

  那整段都讓在影廳裡的所有人超躁動的 XD


  看滿多人好像擔心進場的小朋友會很多影響體驗

  其實做我前排的就是小朋友

  我一開始也有點擔心他會東問西問然後很吵

  但他看得超級認真，普通的在該笑的地方笑也幾乎沒有講話

  比起很多突然拿手機出來滑的大人真的好多了

  可以不用擔心的進場觀賞！！！


  --'
