url: https://www.ptt.cc/bbs/movie/M.1735742553.A.D44.html
title: '[新聞] 化身最小英雄！佐藤健拍《工作細胞》加碼'
content: '化身最小英雄！佐藤健拍《工作細胞》加碼打鬥戲 盼超越《神劍闖江湖》




  Yahoo奇摩娛樂 特派記者


  記者潘鈺楨報導／今年春節最熱鬧的電影《工作細胞》改編自漫畫家清水茜暢銷突破千萬

  冊的同名人氣漫畫，由曾執導多部經典日劇包含《神啊！請多給我一點時間》、《電車男

  》、《交響情人夢》等作的知名導演武內英樹執導。這也是武內英樹繼《羅馬浴場》、《

  飛翔吧！埼玉》後最新電影作品。擅長建立獨特世界觀的他，此次也再以特有的幽默視角

  ，帶領觀眾一窺體內世界豐富無比的「細胞樂園」。


  演員方面則集結永野芽郁、佐藤健、蘆田愛菜、阿部貞夫、染谷將太、坂垣李光人、加藤

  諒、山本耕史、仲里依紗、松本若菜、深田恭子等豪華陣容，一同上演一場最華麗的「健

  康保衛戰」。其中，佐藤健更為了演出英勇的白血球一角，每次開拍前都得花很多時間將

  全身塗白上陣，讓飾演紅血球的永野芽郁第一眼看到忍不住笑場，「我有好一陣子沒見到

  佐藤健先生了，第一天第一場戲開拍時，我轉過頭看到他完全是白色的，那明明是一場嚴

  肅的戲，我還是忍不住笑了出來」！然而她也補充，「打鬥戲時，佐藤健的動作依然非常

  俐落，白血球的角色必須一直保護我，而他盡力保護我的樣子真的讓我很感動」！


  佐藤健表示自己閱讀原作漫畫時，就直接愛上了這個繽紛有趣的體內世界，也在接獲演出

  邀約後，主動向劇組提議加重打鬥動作戲的設計，「我覺得既然是這樣的作品，如果動作

  能更真實一些會更有趣，於是就提議邀請曾和我合作過《神劍闖江湖》的大内貴仁擔任動

  作指導」。他笑稱自己要是不能拿出比《神劍闖江湖》更好的武打動作表現，拍這部作品

  就沒有意義了！


  對於此次飾演的白血球一角，佐藤健表示，這可說是史上最小的英雄，「我認為《工作細

  胞》是一部英雄片，白血球的職責就是要擊敗入侵體內的邪惡病毒，他可說是人體內的大

  英雄」！因此他也鼓勵觀眾，「如果你感到心情低落，請將你的手輕輕放在胸口，想像現

  在有許許多多個英雄正在你的身體裡努力奮戰著」！


  故事敘述人類體內的細胞數竟然有37兆個。運送氧氣的紅血球、與細菌作戰的白血球、以

  及其他無數細胞，其實正日夜不停地拚命工作，以保護個體健康與性命。高中生漆崎日胡

  （蘆田愛菜飾）與她的父親阿茂（阿部貞夫飾）過著相依為命的日子。日胡個性嚴謹，一

  直維持著健康的生活習慣，因此她體內的細胞們總是愉快地工作著。相反地，每日生活既

  不規律又不重視養生的阿茂，體內則是個黑心的勞動環境，他的細胞總是抱怨連連。雖然

  是父女，兩人體內的環境卻大不相同。這對感情融洽的父女，體內的世界也是如此熱鬧。

  然而，企圖入侵他們體內的病原體已開始蠢蠢欲動。一場攸關漆崎父女的未來，各個細胞

  之間的「體內史上最大戰爭」即將揭開序幕！電影將於1月24日在台上映。


  --'
