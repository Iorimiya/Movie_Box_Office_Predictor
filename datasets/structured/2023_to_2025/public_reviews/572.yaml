url: https://www.ptt.cc/bbs/movie/M.1729745079.A.CE0.html
title: '[情報] 《工作細胞》真人版電影公開追加演員名'
content: '《工作細胞》真人版電影公開追加演員名單 塚本高史、DJ KOO 等人將參與演出




  即將於 12 月於日本上映的《工作細胞》真人版電影，官方於今日公開了嗜中性球、

  肛門外側括約肌以及神經細胞的演員名單。




  由漫畫家「清水茜」以人類體內為舞台所創作的作品《工作細胞》，原本只是「為了

  苦讀生物的妹妹」而誕生的科普漫畫，但藉由各式「細胞擬人化」讓原本生硬無趣的

  細胞知識，變得生動有趣且更貼近人心。在一個人的身體中，約有 60 兆個細胞，每

  種細胞都有各自的任務……故事中，藉由紅血球、白血球、血小板等各式細胞的登場，

  在人體體內展開各式精采故事。


  　　在今天所釋出的追加演員部分，日胡體內的嗜中性球找來了塚本高史負責演出、

  體內負責傳導訊號的神經細胞則是交由 DJ KOO 負責，至於父親漆崎茂身體肌肉的肛

  門外側括約肌則是找來了一之瀨亙（一ノ瀬ワタル）演出，在官方所釋出的照片中，

  也可以分別看到三位角色在劇中登場的身影。



  --'
