title: '[選片] 忍者亂太郎 天竺鼠車車 工作細胞'
content: '各位新年好：


  想帶小孩（8歲）去電影院看 哪一個比較推薦呢？

  想知道是否需要知道前情才能理解，

  希望看電影中不需要太多跟小孩解釋太多。

  然後不要有太誇張的生離死別，小孩很明顯受不了。


  選擇：

  1. 忍者亂太郎

  2. 天竺鼠車車

  3. 工作細胞真人版


  1的動畫我看過幾乎全部，小孩只看過5集以內，但蠻合胃口。

  2的動畫我和小孩全看完，劇情簡單但沒有台詞所以需要跟小孩解釋。

  3的動漫我幾乎看完，小孩看動漫版很緊張，但兒童版的漫畫幾乎都看完了。


  謝謝各位



  -----

  Sent from MeowPtt on my iPhone



  --'
