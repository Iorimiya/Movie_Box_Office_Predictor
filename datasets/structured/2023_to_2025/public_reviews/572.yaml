url: https://www.ptt.cc/bbs/movie/M.1718086015.A.E92.html
title: '[新聞] 《工作細胞》真人化　佐藤健變身白血球笑翻永野芽郁'
content: '《工作細胞》真人化　佐藤健變身白血球笑翻永野芽郁




  【吳惠菁／綜合報導】佐藤健、永野芽郁主演漫畫改編的真人版電影《工作細胞》，分別

  飾演白血球、紅血球，永野芽郁透露拍攝該片最大的挑戰，就是看到全身塗白的佐藤健必

  須ㄍㄧㄥ住不笑場。配合該片以細胞為題材，今製作發表會現場發給媒體號稱世界最小的

  海報，僅1公厘高，需要用顯微鏡觀看，將去申請金氏世界紀錄。




  《工作細胞》電影由《羅馬浴場》導演武內英樹執導、《輝夜姬想讓人告白》編劇德永友

  一執筆，原著為清水茜的漫畫，故事將人體的細胞擬人化，描寫各種細胞在人體內各司其

  職、與病菌戰鬥。佐藤健與永野芽郁繼2018年的NHK晨間劇《半邊藍天》後再續前緣，佐

  藤健為了飾演白血球從頭到腳全部塗白，永野芽郁在開拍第一天一見到他就忍不住爆笑，

  佐藤健則開玩笑說隨著白化的過程覺得越來越爽快，「這才是我真正的模樣，終於和真實

  的自己相遇了」。


  預告片可見到佐藤健與病菌作戰時展現帥氣俐落的身手，他表示自從《神劍闖江湖》之後

  就沒拍武打戲，這次努力打得比《神劍闖江湖》更精采，加上爆破戲，「覺得自己當演員

  打拚到現在，就是為了演這個角色，可以說是集大成」。該片預計12月在日本上映。


  ======


  超特報影片



  --'
