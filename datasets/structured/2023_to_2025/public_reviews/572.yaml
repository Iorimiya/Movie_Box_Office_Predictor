url: https://www.ptt.cc/bbs/movie/M.1738673736.A.BCF.html
title: '[普雷]《工作細胞》日本漫改真人版真的可行嗎？'
content: '恰到好處的改編，請更珍惜你的身體資產


  這幾年漫威、DC、好萊塢都相對走下坡，英雄漫畫改編與舊瓶新裝，大量的動畫特效的電

  影炫技似乎已經不是觀眾選擇的首選，隨著技術的提升，觀眾除了要求動畫特效的細緻度

  ，也更要求在故事劇情的合理性、是否太多莫名其妙的政治正確觀感，影響觀影體驗。


  這讓歐美尖端影視公司有所思慮，但也讓許多金費和技術仍在追趕的國家，也有想晉身嘗

  試的目標，動漫畫大國日本，正也是其中的角逐者。


  在漫畫與動畫時期就給人不錯體驗的作品《工作細胞》，敘述關於人體細胞擬人化後的故

  事，藉由紅血球AA2153和白血球1196兩人在身體中的突發日常，對抗細菌病毒之餘，也了

  解人體的身體構造，隨著主人翁的身體活在億萬細胞世界。這樣的作品在真人化後需要許

  多後製動畫與搭景製作，在《工作細胞》真人化後的日本電影，表現會是如何？







  《工作細胞》是什麼電影：


  人體基本上就是一個小宇宙的概念，有著許多目前醫學和科技都還未知的領域，例如大腦

  裡連結各處的構造、DNA的排序與遺傳學等，甚至在理解能力的智商、運動表現上的優劣

  、情緒與外貌特徵等，都讓人無法捉摸。但複雜的人體系統與細胞，有時候相當難被理解

  ，甚至太深入的醫學知識，往往讓人生畏。但了解身體的運作，對於我們的健康和知識是

  很有幫助，如何透過教育和娛樂，讓人們了解自我身體狀況和基礎，是在健康教育上一個

  重要的環節。


  2014年，漫畫專門學校畢業的漫畫家－清水茜，以《細胞的故事》獲得講談社的少年漫畫

  賞，並在2015透過編輯和相關專家的幫助，修改故事架構開始連載漫畫作品《工作細胞》

  ，一推出就獲得不錯的反響，並在2018年、2020年和2021年展開兩季的動畫和動畫電影的

  連載，大受好評。


  在2023年底，《工作細胞》宣布將以真人化的形式登上大螢幕上映，讓許多動畫漫畫迷擔

  心，因為這部完全架空的人體細胞擬人故事，在整體上難度相當高，並細菌和細胞之間的

  選角也相對有所難度。






  過去日本動漫畫改編真人版被譽為一項「不可能的任務」，並且有著太多翻車的前車之鑑

  ，例如魔改到原作都不認得的《惡靈古堡》重啟屢次翻車、《七龍珠》、《快打旋風》更

  是玩梗港片還遠勝於正版授權改編的窘境，大成本的《鋼之鍊金術師》、《進擊的巨人》

  故事與特效被人詬病，也讓改編真人版被受阿宅們恐懼。雖然在改編上與Netflix合作的

  《幽遊白書》和《海賊王》獲得不錯的好評，但對於由日方主導近年少年漫較為成功的作

  品，可能只有《神劍闖江湖》日本風格濃厚的作品。


  但《工作細胞》這次在改編上表現不俗，並且截長補短整體表現將細胞與人體之間的對等

  關係，在故事上展現不只有著日漫故事風格，也展現出不無聊的教育意義。


  電影版《工作細胞》以女高中生漆崎日胡和她爸爸阿茂，父女的工作細胞的身體世界和現

  實世界日常狀況為主軸，結合原作《工作細胞》與衍生漫畫《工作細胞BLACK》兩者的世

  界觀，讓整個體內故事變得更有想像力與真實感。










  《工作細胞》分析與延伸：


  《工作細胞》的漫畫家清水茜本身並不是醫學出生，也沒有相關的經歷。會創作《工作細

  胞》這樣的漫畫內容，主要是因為妹妹的科系中有需要學習細胞相關的知識，清水茜覺得

  如果人體細胞和病毒可以畫成漫畫造型，會變得更容易記憶。而將這本幫助學習的漫畫故

  事投稿後，意外地獲得好評，並且得到連載漫畫機會。


  在撥出動畫後受到許多教育者的好評，官方也開放《工作細胞》在教育上可以無版權使用

  ，並且在世界各國也有不少教授使用《工作細胞》作為上課素材，在菲律賓就有亞當森大

  學，就有教授授課時後使用到動畫片段，受到討論。


  2018年，《工作細胞》的作者清水茜，想將癌症的藥物研發與使用繪製成漫畫，受到當年

  諾貝爾醫學獎得獎者本庶佑的許可，將日本研發的抗癌的藥物「保疾伏」繪製成漫畫作品

  。保疾伏的作用主要是治療與抑制不可切除的黑色素腫瘤，並且也作為腎臟癌、肺癌的治

  療藥物，該治癌藥物，也是第一個被納入世界衛生組織的抗癌基本藥物標準抑制劑。其中

  諾貝爾醫學獎得獎者，本庶佑為該藥物的發明者，故清水茜以《工作細胞》為範本，試圖

  繪製關於保疾伏抗癌藥物，也是一個讓漫畫持續跟現代醫學接軌的過程。






  真人電影阪《工作細胞》，整體來說以原作為改編主軸，但有著更真實且黑暗的延伸作品

  《工作細胞BLACK》加入，這點有點讓人意外。由原作《工作細胞》延伸改編《工作細胞

  BLACK》，是描繪不健康的身體主人內的細胞故事，也在2021年改編為深夜動畫，裡面有

  大量的成人疾病，和現代文明病。飲酒、抽菸、壓力、睡眠不足，並且有著性與暴力的故

  事，因為真實度太高，被許多漫畫迷所喜愛的延伸作品，在真人版中《工作細胞BLACK》

  的表現也用於女主角父親的身體狀況樣貌。


  這次真人版《工作細胞》拍攝的搭景並非完全動畫，而是以和歌山人工島上的歐式主題樂

  園「ポルトヨーロッパ」作為拍攝女主角身體的場域。故裡面有著滿多樂園的置入，並且

  許多細胞和細菌也出動樂園的工作人員和臨演拍攝，還原細胞工作和病菌入侵的樣貌。


  因為有著很接近日本想像系的歐式樣貌，ポルトヨーロッパ也是很多想拍攝歐洲風情的電

  影勘景的選擇，例如搞笑漫畫改編真人電影《飛翔吧！埼玉》也是在此拍攝，並且還有一

  處完全以《阿爾卑斯的少女》海蓮住處為範本的山景等，算是許多改編動漫畫真人版的首

  選之地。








  《工作細胞》值得一看嗎：


  雖然因為看過原作和動畫之故，這部電影所有的表現都在「可預料」的範圍之中，並且在

  過去曾經看過舞台劇的關係，故我覺得真人電影或多或少，讓我有2018年真人舞台劇的影

  子，加入許多現代特效動畫的感覺，在驚艷程度上降低不少


  。但整體來說以現實世界的人和她／他身體世界樣貌的展現交錯展示這點，讓我覺得這部

  電影拍得很細心也很聰明，並且因為演員本身就被打扮得像是表演舞台的樣貌，故也讓病

  菌誇張的妝容和服裝出來時，沒有太過突兀的地方。


  整體而言《工作細胞》的真人版，知道自己的極限在那邊，並且試圖在可以完成給與觀眾

  什麼樣的畫面呈現中，來表現一個虛構的身體擬人世界，打出親情牌和加深白血球與紅血

  球的情感故事，並且讓《工作細胞》和《工作細胞BLACK》兩方連動，展現出原創與再創

  的結合。對於導演這種說故事的方式，讓我覺得很不錯，畢竟二次創作、同人作品和讀者

  延伸，有時候替我們補足了一些原作不足和細節之處，讓整個世界觀變得更完整。








  雖然完全不相關，但世面是許許多多關於《工作細胞》這系列的延伸作，常讓我想到同人

  小說與遊戲起家的《Fate/stay night》系列，在本篇之外，延伸出各式各樣，聖杯架構

  但卻不同世界觀和主從的想像。


  這種感覺也有點像是美系的漫威和DC等歐美英雄漫畫多重世界的架構，可以看出不同作者

  在同樣的概念下展現出來的創意。《工作細胞》的概念就是如此，不管是要成為有教育意

  義的原作漫畫，或是以細菌或是差邊球的性病創意為發想，都是一種有意思的創作模式，

  雖然在真人版的《工作細胞》電影上，依舊不能太超過。


  不管是看過原作或是沒看過原作的人，我覺得這次漫畫改編的《工作細胞》真人版是很有

  樂趣的，並且在角色呈現上，我覺得也沒有過於崩壞，雖然白血球的妝容的確一開始有讓

  人驚嚇一下，但整體而言雖然演技沒有到滿分，但故事情節和兩個世界觀的轉換，都算是

  非常順暢。而這部《工作細胞》真人版，也在撥出後的現在，在日本突破50億日圓的成績

  ，打破《神劍闖江湖》真人版，成為冬季最賣座的漫改電影，可以看出在多年慘被真人化

  後，日系電影改編功力的突破。




  --

  個人Blog：

