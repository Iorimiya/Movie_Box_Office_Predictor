url: https://www.ptt.cc/bbs/movie/M.1737955801.A.777.html
title: '[好雷] 工作細胞 真人版 高年級小孩可看'
content: '以前小孩看過工作細胞動畫


  稍微跟著看是覺得還蠻有趣的


  快過年了看到有真人版


  發現好像是神劍細胞XD


  蠻有趣的就帶小孩去看了



  結論 小孩覺得很好看


  我覺得整體是很不錯的


  故事結構算蠻完整的


  前面有一點跟動畫有重複


  後面就另一個完整事件


  但我沒想到 居然被騙了一些眼淚T_T


  雖然中後段節奏覺得有點卡住


  但整體算是蠻好看的


  武打部分預告那段可能是最優的


  笑點不少，尤其跟排便有關的部分真的笑到哭
















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  會被騙眼淚是因為


  最講究身體健康的女兒居然得血癌


  血癌細胞的獨白也是有點無奈


  血癌治療其實是真的非常辛苦的


  電影也確實在某種層次上展現了這個面向


  當然中間有些跟真實生物醫療差距有點大的表現手法


  然後幹細胞移植那邊應該真的錢花完了XD


  沒關係小孩也快坐不住了哈哈哈



  推薦大家去看!


  --'
