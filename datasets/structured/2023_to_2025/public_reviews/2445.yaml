url: https://www.ptt.cc/bbs/movie/M.1645675809.A.172.html
title: '[好雷]《劇場版 咒術迴戰 0》，愛是世界上最扭 '
content: '部落格版：


  日本漫畫家芥見下下的作品《咒術迴戰》儘管和前年現象級爆紅的《鬼滅之刃》相比顯然

  熱度差了點，但我自己認為其可看性與人氣基本上是不輸給《鬼滅之刃》的，而不同於《

  鬼滅之刃》是在動畫播出後引起廣大討論進而紅回漫畫、帶動銷量，《咒術迴戰》則是原

  來漫畫本身就已經有紅了，不光是在首集出版後就迅速再版，於2021年銷售量也僅輸給《

  鬼滅之刃》、成為日本國內銷量第二高的漫畫作品。最早會接觸這部作品也是朋友推薦，

  誰知道看了第一集後迅速入坑，整體來說是我滿喜歡的類型題材，風格部分也有點《

  HUNTER×HUNTER》的味道，後面劇情發展像是夏油傑一派人馬與其引發的澀谷事變，或者

  是更後來羂索展開的死滅迴游遊戲，都很有《HUNTER×HUNTER》中幻影旅團、友克鑫市事

  件與小傑等人參加的貪婪之島等的影子，也不曉得是不是本來就滿喜歡這兩部作品，導致

  後來在看《咒術迴戰》連載時，都覺得芥見下下的畫風越來越像冨樫義博...，不過幸好

  芥見下下不像冨樫義博那麼任性，說休刊就休刊、連載與單行本推出的速度很穩定，這點

  就很值得鼓勵了。


  雖然剛剛提到《咒術迴戰》並不是靠著動畫紅回漫畫，但可以肯定的是，《咒術迴戰》本

  傳的成功讓芥見下下更早之前推出的前傳故事、也就是此次被改編成劇場版《劇場版 咒

  術迴戰 0》的《東京都立咒術高等專門學校》得以被更多人注意到，畢竟坦白說若本傳沒

  有先紅，應該很少人會回頭去找《東京都立咒術高等專門學校》來看。先講結論的話，《

  劇場版 咒術迴戰 0》改編得相當有誠意，在忠於原作的前提之下，導演朴性厚很巧妙的

  把許多在本傳才有戲份的角色、例如七海建人、冥冥、豬野琢真、日下部篤也等人「提前

  」到前傳就有額外戲份，讓這些角色來去增加劇場版可看性，甚至把原作中中後段的重頭

  戲「百鬼夜行」的篇幅藉此拉長，使得原來漫畫裡稍嫌不夠、甚至可說被草草帶過的咒術

  師們對抗上千咒靈的部分變得更為豐富，當然百鬼夜行本來的重點就是放在乙骨憂太與夏

  油傑的正面對決，可在導演朴性厚不大卻很有效果的改編下，不管是在東京與京都的百鬼

  夜行，還是回來看咒術高專正發生的廝殺部分，都很明顯的比《東京都立咒術高等專門學

  校》再那麼精采且豐富不少。


  可能會有人問說如果沒看過原作那看得懂《劇場版 咒術迴戰 0》嗎？我覺得這是完全沒

  有問題的。選擇以前傳而非本傳來進行劇場版改編是很聰明的決定，而這也是我認為比《

  鬼滅之刃》和劇場版《鬼滅之刃劇場版 無限列車篇》好一點的地方，假設沒有看過動畫

  或是原作漫畫，就這麼直接去看《鬼滅之刃劇場版 無限列車篇》的話會銜接不上，可是

  《劇場版 咒術迴戰 0》直接避掉了這個問題，《東京都立咒術高等專門學校》的時間點

  本就是在本傳之前，是替本傳的某些情節與角色關係做一個回顧、一個交代，所以即使沒

  有先看過先播的本傳動畫或是漫畫也無所謂，甚至我會建議新粉絲漫畫先看《東京都立咒

  術高等專門學校》、動畫則先看《劇場版 咒術迴戰 0》，是會對本傳的劇情與糾葛有幫

  助的，至於剛剛講到的被導演朴性厚提前到劇場版的角色若先登場了會不會影響本傳？答

  案是不會的，這點可以完全放心。



  基本上《劇場版 咒術迴戰 0》和《東京都立咒術高等專門學校》是完全一樣的，原本我

  以為的劇場版會礙於篇幅省略到部分情節，但我看完電影回家後又重新翻了一次漫畫來看

  ，發現導演朴性厚幾乎完整保留了整本漫畫內容，從最開頭類似楔子的幾頁內容、特級過

  怨咒靈祈本里香把欺負乙骨憂太的學生塞進櫃子，導致憂太差點就要被秘密執行死刑、後

  來被五條悟帶進咒術高專就讀的地方，到憂太分別和禪院真希與狗卷棘出任務，再到百鬼

  夜行然後是漫畫的最後一頁都全部影像化，就連許多小地方、包括熊貓看見憂太和真希在

  對練時，突然想到什麼而叫著「天啟」、接著悄聲問著憂太是巨乳派還是小胸派的小插曲

  都給放進了劇場版裡。


  身為一位原作漫畫粉絲的觀眾，對於本次《劇場版 咒術迴戰 0》的整體是很滿意的，也

  因為這樣子的關係，才會對在這次劇場版中看見本傳才會出場的角色感到興奮與激動，對

  導演朴性厚能把這些角色安排的像是早就在前傳登場的樣子小感佩服，例如僅花約莫不到

  五分鐘就讓之後會在本傳和虎杖等人就讀的東京咒術高專交流的京都咒術高專學生們、東

  堂葵、加茂憲紀、西宮桃等人先和觀眾見面，好替後續會想去看動畫版的觀眾預習這些角

  色、同時也讓先看過本傳動畫的觀眾在這裡看到他們時增加對角色的親切感。


  「真失禮，我們可是純愛。」


  「既然這樣，那我就是大義。」


  《劇場版 咒術迴戰 0》、或是說《東京都立咒術高等專門學校》的主線劇情很清楚明確

  ，也就是看乙骨憂太如何解除祈本的里香的詛咒，而順著這條主線所延伸出去的支線、意

  即夏油傑為了拉攏憂太與奪走里香而策劃的百鬼夜行，則被用來增加主線的劇情與情感等

  方面的厚度。里香的強大並非單純因為憂太是日本三大怨靈之一的菅原道真的後代，所以

  在無法接受里香死亡的事實於無意間產生的詛咒，而是因為他對她的「愛」。誠如許多同

  類型的動畫、漫畫等普遍會有的劇情會是、反派之所以成為反派或是某些悲劇的發生，都

  出自於某人對某人偏執的愛意所致，同理的，憂太對里香的情感造成的結果、也就是《劇

  場版 咒術迴戰 0》對於詛咒所下的註解-「愛是世界上最扭曲的詛咒」，儘管五條悟等人

  提到過詛咒的源頭是來自於人類的負面情緒，但往往會產生負面情緒的原因多半來自於人

  類的情感，思念、不捨、愛…等等情感會讓「放不下」綁住已逝人事物，而其中「愛」又

  是最讓人放不下的。



  因此，《劇場版 咒術迴戰 0》到了後來，憂太與里香其實也是靠著那種熱血的用愛戰勝

  一切的主角威能擊敗了夏油傑，感覺上路數還算老套狗血，不過芥見下下用了另一種方式

  來去包裝，藉著「解開詛咒」的外表象來藏住本意，不僅讓觀眾在最後會被解開詛咒後的

  憂太和里香道別的場面打動到，也大幅降低對這樣子擊敗反派的發展感到錯愕不滿的機會

  ，至少我個人是看得滿愉快的，當憂太輕靠著里香輕聲告訴她「我們一起死吧？」，然後

  瞬間詛咒大爆發讓夏油傑見狀不禁喊「你這個玩弄女人的傢伙！」，憂太的回覆簡直可愛

  到爆，同時在那個瞬間也把「愛=最強詛咒」的這種觀念實踐到最大，大到根本算是秒殺

  擁有上千咒靈於一身的最強咒詛師夏油傑也不覺得太扯。


  《劇場版 咒術迴戰 0》和《東京都立咒術高等專門學校》是分毫不差，看完劇場版等於

  是看完了這本前傳漫畫，這是我覺得《劇場版 咒術迴戰 0》很棒的地方，而前面說到的

  部分、導演朴性厚替七海等人與京都咒術高專等人分別增加戲份與提前上場，雖然他們在

  這裡發揮的沒有本傳那麼多，七海建人和豬野琢真、日下部篤沒拿出真本事，連冥冥也還

  沒使出神風、弟弟憂憂也尚未登場，京都咒術高專和東京咒術高專彼此的關係亦未確立，

  但放在《劇場版 咒術迴戰 0》裡已具有畫龍點睛的效果，讓整個百鬼夜行的過程精彩許

  多，加上影像化後帶給觀眾不同於黑白筆墨的視覺體驗，都使得劇場版被加了不少分。總

  結就是，喜歡《東京都立咒術高等專門學校》的原來漫迷應該都會滿意這次的《劇場版

  咒術迴戰 0》，亦可趁著明年確定推出的第二季動畫正式播出前先來看前傳電影暖暖身。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
