url: https://www.ptt.cc/bbs/movie/M.1644767876.A.3E3.html
title: '[新聞] 《劇場版 咒術迴戰 0》上映45天賣破百億'
content: "《劇場版 咒術迴戰 0》上映45天賣破百億　榮登日本2021年度票房冠軍\n\n\n[周刊王CTWANT] 《咒術迴戰》劇場版動畫《劇場版 咒術迴戰\
  \ 0》自去年12月24日上映以\n來，截至2月6日為止，上映45天日本票房正式突破百億來到104億日圓，累計觀影人數達\n到760萬人次，成為2021年日本最賣座電影。庫娛樂於今日同步釋出《劇場版\
  \ 咒術迴戰 0\n》公開直前PV，影片除了揭露更多電影畫面，更搭配超人氣樂團「King Gnu」專為電影打\n造的主題曲〈一途〉，曲名「一途」一詞代表一心一意的意思，歌詞更反應出片中的乙骨\n\
  憂太和里香之間的動人羈絆。\n\n《咒術迴戰》作者芥見下下指定資深聲優緒方惠美擔綱主角乙骨憂太的聲演，緒方惠美曾\n配音過《幽遊白書》「藏馬」、《新世紀福音戰士》「真嗣」等經典角色，她坦言突然收\n\
  到擔任當今最具話題性作品的配音邀約感到非常驚喜，在一口氣讀完原作，並把電視動畫\n版從頭到尾看過一遍後，緒方惠美覺得乙骨憂太是個充滿魅力卻也非常複雜的角色。\n\
  \n\n正當緒方惠美苦惱該如何詮釋角色時，馬上就被要求要替前導預告配音，所幸最後成果令\n製作人員十分滿意，讓她鬆了一口氣，對之後的正式錄音也比較有信心。作者芥見下下也\n\
  表示，乙骨憂太是個「中性、溫柔且善良，感情起伏很大」的角色，所以聽到由緒方惠美\n擔綱演出時，他認為是相當完美的選角。至於乙骨憂太青梅竹馬戀人的祈本里香一角，則\n\
  在經過選拔後決定由聲優界一線女星花澤香菜來擔綱聲演，她同時飾演年幼時期的里香和\n怨靈里香，挑戰使用平常很少聽到的聲線去演繹此角，她表示在錄音過程中會特別注重里\n\
  香對憂太的感情。\n\n 另外，配合今天(2/10)動漫展盛大開幕，電影公司也耗費重金在世貿展場內設下大型展\n場，除了入口旁醒目的「伏魔御廚子」的裝置外，展場內更還原了乙骨憂太身處咒術高專\n\
