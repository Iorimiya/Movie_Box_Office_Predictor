title: '[情報] 《劇場版 咒術迴戰 0》全台票房破2億！'
content: "狂賀！《劇場版 咒術迴戰 0》全台票房破2億！\n\n\n\n台灣今年度票房賣座冠軍！\n\n\n《咒術迴戰》的原點  愛與詛咒的故事 —\n\
  IMAX、4DX、MX4D、Dolby Cinema 強勢重返大銀幕！\n\n想看特殊影廳請把握這週喔～\n\n日本年度票房冠軍！票房突破127億！\n台灣影史日本電影賣座第3名！\n\
  《咒術迴戰》系列單行本銷售突破6000萬冊！2021年度漫畫銷量總冠軍！\n日本超高人氣樂團「King Gnu」帥氣獻唱主題曲「#一途」\n\n《劇場版 咒術迴戰\
  \ 0》全版本大銀幕熱映中！\n\n\n\n\n\n\n\\ 一起為《劇場版 咒術迴戰0》應援吧！ /\n\n歡慶《劇場版 咒術迴戰 0》全台票房突破2億！\n\
  特別將於3/26(六)、3/27(日)舉辦 #咒術迴戰全台應援場\n邀請各位粉絲一同共襄盛舉\n\n無論你是要為純愛戰神應援\n還是想為乙骨與里香的純愛應援\n\
  或為「最強摯友」五條與夏油應援\n甚至想當追隨教主的猴子\n為夏油大人應援...\n    　　　　　\n都歡迎你盡情在應援場大聲喊出對角色們的愛！一起盡情吶喊、同歡合唱！\n\
  \n這次也特別準備了應援場限定特典\n凡購買《劇場版 咒術迴戰 0》應援場電影票1張，\n即可獲得限量【我們可是純愛海報】1份。\n\n\n贈品將於場次開放入場時，由影城工作人員現場發送。\n\
  \n尺寸為B4，圖為示意圖，以現場實物為主。\n\n=\n\n貼心提醒\n\n應援場將打破「安安靜靜看電影」的思維，請詳閱說明\n\n基本應援場規則及注意事項\n\
  \n歡迎合唱、出聲應援，可使用應援道具，歡迎Cosplay入場。請注意服裝或應援道具不可\n遮蔽其他觀眾視線。\n\n影廳內禁止錄影、錄音、拍照。\n\n請勿站立觀賞，及避免其他如激動踏地、奔跑、跳躍等妨害觀影的舉動。\n\
  \n應援場屬特殊上映，現場開放觀眾合唱、出聲應援等，若希望安靜觀賞電影，請購買一般\n場次影票。\n\n應援場與一般上映所放映的電影版本均相同。\n\n請勿對作品或登場人物有不適切的發言。\n\
  \n觀影時如有其他問題，請洽影城現場工作人員。\n\n放映時若有違反前述事項，或其他影響觀眾觀影等行為，影城工作人員有權禁止當事人觀\n影並請求離場，票價不予退還。\n\
  \n\n敬請參加者注意並遵守上述規則\n\n=\n\n3/26 (六) #應援影城\n\n\n詳細場次時間請依各影城戲院公告為主\n\n【台北 & 新北】\n\n\
  信義威秀影城\nMuvie Cinemas\n美麗華大直影城\n樂聲影城\n板橋大遠百威秀影城\n中和環球威秀影城\n林口MITSUI OUTLET PARK威秀影城\n\
  \n【桃園 & 新竹】\n\n統領威秀影城\nSBC星橋國際影城\n大遠百威秀影城\n\n【台中】\n\nTiger City威秀影城\n中港新光影城\n 台中站前秀泰影城\n\
  \n【嘉義&台南&高雄】\n\n嘉義秀泰影城\n大遠百威秀影城\n南紡威秀影城\n西門新光影城\n大遠百威秀影城\n喜滿客夢時代影城\n\n【花蓮】\n\n秀泰影城\n\
  \n3/27 (日) 應援影城\n\n詳細場次時間請依各影城戲院公告為主\n\n【台北 & 新北】\n\n信義威秀影城\nMuvie Cinemas\n美麗華大直影城\n\
  樂聲影城\n板橋大遠百威秀影城\n中和環球威秀影城\n林口MITSUI OUTLET PARK威秀影城\n\n【桃園 & 新竹 & 台中】\n\n統領威秀影城\n\
  巨城威秀影城\n大遠百威秀影城\n\n【台南 & 高雄】\n\n大遠百威秀影城\n南紡威秀影城\n西門新光影城\n大遠百威秀影城\n喜滿客夢時代影城\n\n\n\
  一起吶喊我們可是純愛吧!\n\n\n資料來源：車庫娛樂\n\n--"
