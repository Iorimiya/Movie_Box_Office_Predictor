url: https://www.ptt.cc/bbs/movie/M.1642866219.A.E89.html
title: '[新聞] 《劇場版 咒術迴戰 0》導演證實：電影內'
content: '《劇場版 咒術迴戰 0》導演證實：電影內容比原著多更多



  《劇場版 咒術迴戰 0》自去年聖誕節前夕在日本上映以來，四週票房突破85億日圓；在

  全台影迷的熱烈企盼下，電影公司於今天(1月21日)公布中文版預告與電影海報，正式敲

  定電影《劇場版 咒術迴戰 0》(以下簡稱《咒術迴戰 0》)將於今年2月24日在全台上映。



  傾全力製作《咒術迴戰》電視版的導演朴性厚是催生出電影《劇場版 咒術迴戰 0》的幕

  後最大功臣，他表示：「我在製作電視版的過程中，感覺到自己與身邊的許多人都對「乙

  骨憂太」這個傳說中超強的特級咒術師有一種特殊的情感，製作過程中就一邊研究將這個

  角色推向大銀幕的可能性。」他在電影中加入許多原著中不曾出現過的內容、人物與場面

  ，並且堅持製作出一部無論有沒有看過原著漫畫或是電視版的觀眾都能夠喜歡的作品，他

  說：「不需要基礎，我要讓所有觀眾都能快速地融入咒術的世界裡，並且為劇中的人物喝

  采、歡呼甚至被故事感動。這讓我迫不急待地想知道觀眾看完電影之後的反應！」


  除了深度刻畫乙骨憂太、祈本里香與同班同學之間的關係與個性外，影響咒術世界最重要

  的兩個角色：夏油傑與五條悟這兩人的關係也將在電影《咒術迴戰 0》中讓觀眾更進一步

  明瞭。


  《劇場版 咒術迴戰 0》故事敘述一對青梅竹馬的戀人：乙骨憂太與祈本里香原本約定好

  長大以後要結婚，並且要永遠再一起…。但里香卻在一場車禍中橫死，死後化為強大怨靈

  依附在乙骨身邊，為此所苦的乙骨，甚至一心求死。終於，在五條悟的帶領下，乙骨憂太

  進入咒術高專學習咒術，讓他結識了新同學：禪院真希、狗卷棘與熊貓，他漸漸打開心防

  並決定在這裡找到活下去的自信與解開里香詛咒的方法；另一方面，主張全面殲滅非術師

  的夏油傑宣布發動「百鬼夜行」，要在新宿與京都釋放出千隻詛咒。為此，咒術高專傾盡

  所有人力阻止夏油傑的野心，被捲入這場爭鬥中的咒術高專一年級生乙骨能否阻止夏油傑

  的野心並且順利地解開里香的詛咒？





  新聞網址：



  --'
