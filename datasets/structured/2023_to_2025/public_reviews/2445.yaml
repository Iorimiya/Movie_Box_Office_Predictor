url: https://www.ptt.cc/bbs/movie/M.1645881151.A.985.html
title: '[好雷] 劇場版 咒術迴戰 0'
content: "雷文防雷資訊頁\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n我有追漫畫版，看到有劇場版也滿有興趣\n\
  \n星期四晚上就衝去看，不過沒有拿到任何特典\n\n約好要結婚的青梅竹馬被車撞死，還變成特級詛咒跟在乙骨憂太身邊\n\n真相是乙骨憂太捨不得她這樣死去，無心之下把她變成了詛咒\n\
  \n一開始的悲傷、無奈，最後詛咒解除，她變回可愛的模樣，\n\n叮嚀乙骨憂太不能太早來找她，我終於鬆了一口氣，雖然不能說是 happy ending\n\n但也得到一點救贖\n\
  \n\n\n五條悟的眼睛好漂亮啊~~~尤其平常看不到，看到的時候都很驚艷\n\n我以為他會幾分鐘處理掉外國人反派，回去救乙骨憂太\n\n但纏鬥好久，應該是因為劇情需要吧，要讓男主角和夏油傑獨立戰鬥\n\
  \n\n五條悟和夏油傑曾經是好友這件事真是又萌又虐啊\n\n因為理念不同而必須戰鬥，但友情還在吧\n\n\n狗卷棘感覺是暖男!!\n\n熊貓暗示乙骨憂太和禪院真希有曖昧，真是欠揍又很好笑\n\
  \n感想：劇場版還不錯，推推~\n\n--\n ◣      ◣      ◣\n ▲   \n◤ ◤      ◤\n◤∕                 \
  \                              ﹨ \n<  >\n     ∥                         ◥      \
  \    ∥ \n\n--"
