title: '[討論] 劇場版咒術迴戰0'
content: '雷—-
















  說實話，我是漫畫愛好者

  但這部其實是我覺得挺失望的一部

  裡面的人物設定跟漫畫差異有點大

  戰鬥部分太短又燃不起來

  五條的技能完全沒有秀出來

  四個特級咒師，沒半個開過領域

  以那些百鬼夜行，五條一發領域就可以回去救人了


  東堂那邊連打鬥都省了

  唯一開心的就是那時候娜娜明還活著

  還有機會看到他戰鬥一下


  反而希望以後能出伏黑他爸單挑五條的劇情

  漫畫版有夠帥

  一個0咒力的人直接幹趴五條


  --'
