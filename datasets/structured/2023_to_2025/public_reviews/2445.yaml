content: '先給各位想拿特典的說一下

  imax版的0.5集基本上都被拿完了，根據客服的話是說22號晚上有預購的就能拿了

  訂威秀imax不能拿一般版的特典

  所以以動畫片來說，我推薦看一般版的就好了

  ㄏㄏ

  469套餐C個人體感CP最高，一個塑膠爆米花筒+兩個塑膠可樂杯+一個小掛軸

  學生證的話4D版本才有



  以下稍微抱怨有雷:

















  可惜最後漩渦跟特級咒靈玉藻前那邊還是沒有很好的演出到底他們是怎麼打架的= =

  不過有補上一些漫畫沒有的武打鏡頭

  蠻爽的

  但不知道為啥武打畫面的背景配樂節奏很奇怪，斷的地方太直接了

  就是背景打架打的很熱血，然後突然切成抒情樂這種


  --

  還特別要帶京都高校的

  不是啊我是想看純愛戰士打下流傑不是看這些配角搞耍

  是說可以問一下你的0.5集大概什麼時候去拿到的嗎QQ

  我昨天訂票今天早上10點去就沒了

  昨天打去客服說還有，早知道昨天就去現場訂票了，哭啊

  高雄？'
