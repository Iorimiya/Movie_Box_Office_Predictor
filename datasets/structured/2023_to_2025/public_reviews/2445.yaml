url: https://www.ptt.cc/bbs/movie/M.1646662380.A.C88.html
title: '[新聞] 上映11天《劇場版 咒術迴戰 0》全台飆破1'
content: "上映11天《劇場版 咒術迴戰 0》全台飆破1.5億！登台灣影史日本電影賣座第4名\n\n\n日本週刊少年Jump人氣連載作品《咒術迴戰》的劇場版動畫《劇場版\
  \ 咒術迴戰 0》在台\n熱映邁入第二週，不僅人氣居高不下，觀眾口碑持續發酵中，截至昨天(3月6日)為止，上\n映11天全台票房已突破1.51億，搶進台灣影史日本電影賣座第4名，僅次於《天氣之子》\n\
  、《你的名字》、《鬼滅之刃劇場版 無限列車篇》，電影公司也看好《劇場版 咒術迴戰\n 0》的後續票房發展，將有望擠下《你的名字》成為影史日本電影賣座第2名！電影公司\n\
  於今日公開超催淚PV影片，影片開始由「純愛戰神」乙骨憂太輕撫成為特級過咒怨靈的青\n梅竹馬里香的頭，輕聲說道：「謝謝妳一直保護著我，謝謝妳喜歡我，最後再借我一次力\n\
  量吧。」，接著帶出由日本新世代天團「King Gnu」專為電影打造的片尾曲《逆夢》，並\n穿插人氣角色七海建人、冥冥，以及高專時期五條悟和夏油傑的全新片段，動人的愛情及\n\
  友情勢必將讓不少粉絲瞬間淚腺潰堤！除了在YouTube上能夠觀賞之外，電影公司也於今\n天在台北捷運市府站2號出口的時代光牆播放這支2分鐘完整版映後PV，從晚間6點到9點30\n\
  分，每隔30分鐘播放一次(共八次)，藉以慶祝乙骨憂太學長(3/7)的生日。\n\n戲院方面也藉此機會，在全台北中南三地(台北樂聲影城、台中中港新光影城與高雄大遠\n\
  百威秀影城)舉辦「乙骨憂太生日限定場」為乙骨學長慶生，消息一公布立即引起粉絲熱\n情瘋搶！而為了感謝台灣觀眾對《劇場版 咒術迴戰 0》的支持，電影公司亦於今日公布\n\
  第三週(3/10~3/16)、第四週(3/17~3/23)的影城限定入場特典，分別是第三週的電影角色\nICON貼紙組、第四週的劇照透卡(共3款隨機贈送)，數量有限，送完為止，想入手的粉絲\n\
  們手腳要快，以免向隅。\n\n《劇場版 咒術迴戰 0》故事敘述一對青梅竹馬的戀人：乙骨憂太與祈本里香原本約定好\n長大以後要結婚，並且要永遠再一起…。但里香卻在一場車禍中橫死，死後化為強大怨靈\n\
  依附在乙骨身邊，為此所苦的乙骨，甚至一心求死。終於，在五條悟的帶領下，乙骨憂太\n進入咒術高專學習咒術，讓他結識了新同學：禪院真希、狗卷棘與熊貓，他漸漸打開心防\n\
  並決定在這裡找到活下去的自信與解開里香詛咒的方法；另一方面，主張全面殲滅非術師\n的夏油傑宣布發動「百鬼夜行」，要在新宿與京都釋放出千隻詛咒。為此，咒術高專傾盡\n\
  所有人力阻止夏油傑的野心，被捲入這場爭鬥中的咒術高專一年級生乙骨能否阻止夏油傑\n的野心並且順利地解開里香的詛咒？《劇場版 咒術迴戰 0》口碑爆棚全台熱映中。\n\
  \n\n\n新聞網址：\n\n\n\n--"
