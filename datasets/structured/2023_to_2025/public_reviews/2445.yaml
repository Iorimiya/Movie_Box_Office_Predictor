url: https://www.ptt.cc/bbs/movie/M.1646149095.A.E9A.html
title: '[新聞] 全台票房6天破億！《劇場版 咒術迴戰 0》'
content: "全台票房6天破億！《劇場版 咒術迴戰 0》成台灣影史第二快破億日本電影\n\n\n日本票房賣破121億，稱霸日本電影票房榜八週冠軍的現象級動畫電影《劇場版\
  \ 咒術迴戰\n 0》，上週四在台上映以來票房開紅盤，不僅首日全台票房就賣破1660萬，打破台灣今年\n電影開片票房紀錄，首週末適逢二二八連假更吸引大批人潮擠爆戲院，各大影城大排長龍\n\
  ，不少戲院緊急加開場次後仍舊一位難求，各大社群網站更出現洗版式感動好評，網友激\n推「謝謝導演、謝謝MAPPA，好看到哭出來！」、「乙骨憂太VS夏油傑時，那打鬥加配樂\n\
  實在燃到不行！」、「入戲太深結尾部分大哭，不過我不孤單，隔壁的也跟著我一起哭」\n、「一家三口超過120歲同樣看得很嗨！」、「一定要再二、三刷才過癮！」，也讓《劇\n\
  場版 咒術迴戰 0》上映至今票房衝破1億大關，榮登全台票房冠軍，不但是今年最快破億\n電影，更成為繼《鬼滅之刃劇場版 無限列車篇》後台灣影史第二快破億的日本電影！預\n\
  計在大量網友強力口碑的推波助瀾下，《劇場版 咒術迴戰 0》在接下來的周末仍將有不\n錯的票房成績。\n\n而擔綱《劇場版 咒術迴戰 0》中超高人氣角色「五條悟」聲演的聲優中村悠一，上月20\n\
  日適逢42歲生日，在動畫網站「アニメ！アニメ！」為其慶生所舉辦的票選活動中，「五\n條悟」一角獲得20%的支持率，連續兩年蟬聯中村悠一最受歡迎的聲演角色，網友盛讚中\n\
  村悠一的聲音演技，「中村悠一甜美的低音，讓五條悟變得更强大了，讓『沒關係，因為\n我是最强的』、『領域展開，無量空處』等臺詞變得說服力十足！」。《劇場版 咒術迴\n\
  戰 0》在日本上映已稱霸8週票房冠軍，截至27日統計，日本票房衝破121億日圓（約30億\n元新台幣），觀影人次超過866萬人次，已超越宮崎駿的《風起》，榮登日本影史賣座動\n\
  畫電影的第8名。\n\n而擔綱《劇場版 咒術迴戰 0》中超高人氣角色「五條悟」聲演的聲優中村悠一，上月20\n日適逢42歲生日，在動畫網站「アニメ！アニメ！」為其慶生所舉辦的票選活動中，「五\n\
  條悟」一角獲得20%的支持率，連續兩年蟬聯中村悠一最受歡迎的聲演角色，網友盛讚中\n村悠一的聲音演技，「中村悠一甜美的低音，讓五條悟變得更强大了，讓『沒關係，因為\n\
  我是最强的』、『領域展開，無量空處』等臺詞變得說服力十足！」。《劇場版 咒術迴\n戰 0》在日本上映已稱霸8週票房冠軍，截至27日統計，日本票房衝破121億日圓（約30億\n\
  元新台幣），觀影人次超過866萬人次，已超越宮崎駿的《風起》，榮登日本影史賣座動\n畫電影的第8名。\n\n\n\n新聞網址：\n\n\n--"
