title: '[好雷] 生命之舞'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  第七屆台灣國際人權影展以「煙硝離散—游尋天光」為主題，收錄不少聚焦在戰爭或意識

  形態的電影。其中，「游尋天光──人權廣角鏡」的單元不但精選在金馬影展大放異彩的

  《白日青春》與《九槍》等片，也納入加拿大與阿根廷共同製作的《生命之舞》，結合阿

  根廷的探戈文化，以非常輕鬆的口吻談論轉型正義。



  改編自阿根廷「五月廣場祖母」真實事件。國際艾美獎影后克裏斯蒂娜巴內加斯、《決戰

  中途島》拉斐爾格羅斯哈維主演。



  一對加拿大姊弟成年後，首次回到他們的出生國阿根廷並學習跳探戈。一個關於過去如何

  擁抱我們的故事，只有與它接觸，我們才能找到自由。



  《生命之舞》講的是家庭的故事，而且是破碎家庭的故事，甚至是無數破碎家庭的故事。

  電影以加拿大姊弟在飛往阿根廷班機上的對話開場，從兩人帶有關心卻又劍拔弩張的一來

  一往不難聽出，他們雖說是感情甚篤的姊弟，但對彼此還是有一些未解的疙瘩。姊姊蒂安

  娜突襲似的告訴弟弟大偉他可能不是爸媽親生的小孩，後續兩人的互動也揭露弟弟的身心

  狀況源自不平衡的童年。



  年幼的大偉無法理解為何自己只是想要一把吉他都無法如願，但爸爸卻捨得買一架鋼琴給

  姊姊。原來這一切都源於他的身世，既然蒂安娜起了這個頭，弟弟也決心查個水落石出。

  揭開瘡疤總是醜陋，不過，同為下一代人的姊姊是無辜的，大偉向蒂安娜保證，不論結果

  如何，她永遠都是自己最親愛的姊姊。



  這趟阿根廷之旅結束後，兩人越發接近事實真相，只差DNA比對結果。回到家後，心情複

  雜的弟弟質問爸媽自己的身世究竟為何，明知紙終究包不住火的爸爸，卻為了圓謊而說出

  更大的謊傷害一同生活三十年以上的家人。但是，就像爸爸所說，即便媽媽當年抱著孩子

  開心得不得了，對於這等惡事睜一隻眼閉一隻眼，對這個家來說，她仍舊是一位稱職的母

  親，至少從小到大她待蒂安娜與大偉無異。



  弟弟想弄清楚自己的身世，取而代之的是父母或許得面臨牢獄之災，夾在中間的姊姊固然

  希望大偉找到自己真正的家庭，但另一方面又不捨年邁的老父母接受審判。看著弟弟在失

  散已久的家人圍繞下笑開懷，蒂安娜只能帶著複雜的心情飛回加拿大，承受三十年前爸媽

  拆散別人家庭的苦果。



  電影當中大偉所承受的身分認同，並不是族裔上的。他們從小就知道自己是「阿根廷裔加

  拿大人」，只是他一直都感覺格格不入，好像自己並不屬於這個家。可能爸爸不像媽媽將

  之視如己出，抑或是流淌在他身上的血液，隱隱透露著他的真實身世。初到阿根廷時，弟

  弟對於學習探戈並沒有太大的興趣，只是陪著姊姊去上課，沒想到親人間的神祕聯繫，讓

  他從探戈老師身上找到屬於自己的身分認同。



  《生命之舞》的故事改編自「五月廣場母親」事件，1976年到1983年間是阿根廷右翼政府

  實行國家恐怖主義的時期，當時針對游擊隊與異議人士發動鎮壓行動，也就是所謂的「骯

  髒戰爭」。事件落幕後，當時聚集在五月廣場的母親，仍然不放棄尋找自己失蹤的兒女，

  並組成「五月廣場祖母」組織，持續為重組失散家庭奔走，於1992年獲得沙卡洛夫思想自

  由獎，該獎表彰捍衛人權與思想自由的個人與組織。



  透過大偉尋找家人的過程，觀眾得以看到五月廣場祖母組織的運作模式。由於強行奪取異

  議人士於獄中產下的子女本就是違法之事，自然不會有正規的收養文件，但從弟弟申請的

  出生證明，五月廣場祖母的相關人員依舊能推斷出端倪，因為負責接生的正是為很多受監

  禁婦女接生的醫生。雖然這些失家寶寶的親生父母多半已不在人世，但透過在世親人的

  DNA，還是成功幫助許多懷疑自己是當年失蹤嬰兒的人與他們的家人媒合。這些與原生家

  庭失散30、40年的失家寶寶，一旦與五月廣場祖母的基因庫配對成功，阿根廷政府就會自

  動對其「養父母」提起訴訟。當年支持軍政府而獲得孩子的家庭，都會為自己的行為付出

  代價。



  除了身世之謎之外，電影不少的篇幅都在呈現探戈。身為探戈的發源地，阿根廷本就充滿

  不同民族與種族融合的文化，而這種表情必須嚴肅，與舞伴之間卻又靠得比其他現代舞緊

  的舞蹈，彷彿訴說著大偉充滿秘密的身世。相比於相對嚴肅的探戈，電影也納入比較開心

  歡愉的米隆加，透過弟弟與探戈老師之間相互嬉鬧玩耍的氣氛，緩和身世之謎所帶來的緊

  張感，也增添一絲浪漫的氛圍。雖說這段短暫的情愫發展讓後來的家人相認好似八點檔一

  般灑狗血，但也讓觀眾從另一個角度認識探戈這種音樂與舞蹈形式。



  經歷過國家恐怖與軍事鎮壓的世界各國都陸續進行轉型正義，的確，這是緩慢且遲到的正

  義，但有總比沒有好。轉型正義的過程包括賠償受害者、揭露或呈現迫害的真相，以及審

  判加害者。在《生命之舞》裡，除了讓失家寶寶與家人團聚之外，並沒有看到阿根廷政府

  是如何賠償受害者。可是，五月廣場祖母在整場轉型正義中就是扮演揭露或呈現迫害真相

  的角色，而政府也協助後續審判加害者，盡可能彌補過去以國家為單位所造成的傷害與錯

  誤。通常以轉型正義為題材的電影都很沉重，畢竟主題本身就是揭開過去的瘡疤與傷痛，

  但《生命之舞》將探戈元素入題，以輕鬆的口吻帶觀眾認識阿根廷的轉型正義，的確是極

  為聰明的做法。


  --

