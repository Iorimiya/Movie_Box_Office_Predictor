title: '[好雷]《搖滾吧！中二樂團》這款放蕩不羈音樂聲'
content: '不知道要幹嘛，那就玩音樂吧！


  浪子回頭的電影是許多人喜歡的類型，不管是壞壞惹人愛，或是單純的酷炫和心裡那小小

  的中二病發，在現實很討厭但搬到虛構世界卻很帥，尤其是在成年與未成年之間模糊的青

  少年時期。


  雖然現實中不是每個不良少年都有著熱血青春、加入幫派成為大哥和轉念開竅考上第一志

  願都屬於特殊案例，更多的是年少輕狂，在渾噩的日子尋找小確幸。


  《搖滾吧！中二樂團》是一部不良少年與音樂的動畫電影，裡面沒有拳對拳的青春、也沒

  有熱心開導青少年的老師，只有不良少年無所事事的日常。不良高中生研二某天因為機遇

  下拿到了貝斯，找來同伴太田、朝倉表示想組成樂團。三個門外漢瞎湊出怪異的樂曲，意

  外彈出了興趣，還即將登上音樂季？但音樂之外的問題卻也爆發開來。







  《搖滾吧！中二樂團》是什麼動畫：


  「不良少年」或「黑道」在影視創作算是受歡迎的角色，雖然在現實中很令人反感且造成

  許多社會問題，但因為那種跳脫常識、遊走在正邪兩道的差邊線上，這類型的角色如果在

  影視上往往有著一種反骨的魅力。尤其在「反差萌」的狀況下不良屬性在ACG圈可說是有

  趣的存在，例如引爆話題前黑道大哥的家庭主夫《極道主夫》、被老大強制變性組團的黑

  道成員《後街少女》等，可以說在壞與搞笑之間的醍醐味。


  而在日本社會將學生歸於還未社會化，這點給了學子一些比較跳脫日本制式架構的空間，

  這也讓高中不良少年這種半社會人成為有趣的題材。撇開如《灌籃高手》、《菜鳥總動員

  》這類不良打球的運動類成長型不談。


  單純如《難破MG5》、《我是大哥大》等，以不良少年生活的搞笑漫畫也相當有意思，此

  外與不良之間同類型的暴走族漫畫經典《湘南純愛組》、《湘南爆走組》，在日本過去也

  是暢銷類型的漫畫，因為不良少年題材累積了一定的人氣，在日本也泛稱這類型的漫畫為

  「ヤンキー漫画」。







  但如今許多不良少年漫都不再是以熱血、格鬥甚至運動為主軸，而是一個角色屬性，在動

  畫電影中《搖滾吧！中二樂團》，就屬於相當日常並且隨意的「不良Ｘ音樂」。


  故事敘述每天無所事事的不良高中生研二，在某天因為一場意外下拿到了樂團的貝斯，突

  發奇想找來打架的同伴太田、朝倉來組成樂團，三個不良意外的彈出了相當實驗性質的樂

  色，但在登上音樂季前，研二心裡卻發生了奇怪的轉變，引發了一連串雞飛狗跳的事件。


  動畫《搖滾吧！中二樂團》原作是演員兼漫畫家的大橋裕之2009年的漫畫作品《音楽と漫

  画》是一部充滿邪典傾向的講述搖滾不良初登場音樂季的故事。同樣也是實驗性動畫電影

  導演岩井澤健治對大橋裕之的漫畫故事很感興趣，用了七年的時間製作這部一個小時的動

  畫作品，受到海外動畫迷的喜愛與獎項，2020年在日本上映時也受到好評。












  《搖滾吧！中二樂團》分析與延伸：


  《搖滾吧！中二樂團》原作者漫畫家大橋裕之，算是比較不正統派的漫畫作者，他除了推

  出自己個人誌漫畫，多半都在音樂雜誌與電影雜誌上繪製單頁漫畫作品，也有在一些漫畫

  出版社繪製四格故事，但基本沒有長篇或連載漫畫作品，2016年以演員出道，開始了漫畫

  家、演員、打工仔三種身分的生活方式。大橋裕之相當喜歡樂團類型的音樂作品，尤其是

  日式搖滾樂，故選擇音樂雜誌連載漫畫可能跟他本身對於流行音樂的了解有關。


  《音楽と漫画》故事題材應該是結合了大橋裕之喜愛樂團音樂和生活背景有關係，在故事

  裡不良少年取於大橋裕之成長經歷，大橋裕之就讀的三谷水産高校，過去是有名的流氓男

  校，如今成為男女合校，且校風也改善許多，但過去有名的校友都是如朝倉未来這類型肄

  業格鬥選手或拳擊手。


  受到這樣的風氣過去大橋裕之也有想過要成為拳擊選手，故在故事中以不良跟音樂跟兩個

  主題混搭，甚至一種漫不經心跟悠哉的步調，很大一部分都與作者本身的個性跟喜好有所

  關聯。







  這樣的風格導演岩井澤健治反而很喜歡，有一種質樸的粗糙感，這種風格也讓他保留在製

  作《搖滾吧！中二樂團》動畫內，雖然沒有資金、日本正統的原畫、動畫人員的製作，但

  整體來講打破傳統日式動畫表現模式的風格，會讓當今已經習慣傳統日式動畫的觀眾和影

  評有耳目一新的觀感。


  無論是漫畫粗糙的畫風或是動畫簡單的線條動畫，由於是由真人拍攝完後再逐步轉換成手

  繪動畫相當耗費工夫，這種製作技法也被稱為「轉描機技術」，再商業動畫上如《惡之華

  》、《輝夜姬想讓人告白》等，都有使用過這樣的手法。


  而會構成大橋裕之這部冷門作品動畫化，則是在於製作人松江哲明與導演岩井澤健治兩人

  再討論下一部想製作的作品，提到關於大橋裕之的漫畫，當時兩人比較常製作的都是短篇

  電影或實驗性電影為主。但沒有動畫製作經驗，再執行的過程中並不順利，四年才做了兩

  分鐘的進度，也從團隊變成了一人動畫。可以說《搖滾吧！中二樂團》整部電影是一群外

  行人的動畫嘗試與執著。









  《搖滾吧！中二樂團》值得一看嗎？


  整體而言看完導演和製作的新聞稿跟對談可以解惑，為什麼動畫中有那麼多重複與靜態的

  鏡頭。如果以一個不是學生製作，必須生活的創作者素人，《搖滾吧！中二樂團》動畫製

  作從開始到結束都是充滿困難，況且改編的作品也一樣並不是一般人所熟悉的漫畫原作，

  且原作故事相對單純，這些都更加深資金與製作上的困難度，只能說導演岩井澤健治在執

  行方面下了很大的功夫創作與改編。


  《搖滾吧！中二樂團》整體故事而言相當非主流，但和湯淺政明《心靈遊戲》、《皿三昧

  》這種電波系動畫有所不同。


  音樂也不是那種《藍色巨星》等級的感觀演出，更多的我覺得這部作品的畫風看起來像三

  分鐘泡麵番、劇情樸實像是《男子高校生日常》或《瀨戶與內海》這種無意義、無主軸的

  敘事風格。但也正是因為不知道劇情該如何展開，或是主角與樂團倒底走向何處，反而讓

  這部動畫增添很多趣味性。








  年少輕狂時的一股衝動或是無來由的幹勁，促使去完成一件大事或小事，這種感覺很符合

  《搖滾吧！中二樂團》動畫的調性，無意義的想要搞樂團、無聊的想認事懂音樂的人、隨

  隨便便就報名音樂祭、開始每天練團是衝動、放棄也是一瞬間表示不再感興趣。


  與其說是三分鐘熱度，整部作品給人一種另類青春感，不是熱血、也不是黑暗或玫瑰色，

  而是頹廢與常人的度日感，這種貼近每個人年輕耍廢與幹勁混合的時光，是《搖滾吧！中

  二樂團》這部片好看的地方。


  花費大量時間金錢投入在製作這部作品的導演岩井澤健治表示：「所謂的幹勁，就是突然

  其來毫無理由的去做。」《搖滾吧！中二樂團》動畫中的主角群就是如此，突然想玩音樂

  組樂團，以創作者來說不管是現在的Youtuber、或是漫畫家、作家甚至電競選手，都是從

  「想做那就做吧！」很多時候一些事情不需要冠冕堂皇的大道裡，而是一個任性的開端，

  然後自己的故事才會就此展開。




