title: '[好雷] 分居風暴'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  伊朗導演阿斯哈‧法哈蒂在2011年先以《分居風暴》奪得柏林影展金熊獎、金球獎與奧斯

  卡最佳外語片，再於2016年，以《新居風暴》再次拿下奧斯卡最佳外語片。當年，金馬影

  展將《分居風暴》收錄於「潘朵拉的盒子」單元裡的「無情的世界」次單元，讓觀眾從導

  演精湛的場面調度與說故事技巧看見人性無奈與為己的一面。相隔14年，這部絕對值得名

  列all-time list的作品，以數位版之姿重新上映，當年錯失機會的人也能在大銀幕上一

  睹獲獎無數的神作。



  希敏和納德結褵14年，希敏寄盼女兒在更好環境長大成人、決定移居國外，沒想到丈夫納

  德卻嚴詞拒絕。



  法官認定兩人婚姻還有轉圜的餘地，希敏離婚請求被駁回。另一頭，納德從貧困教區雇來

  一名信仰虔誠的少婦羅芝，來照料自己的父親。但她必須清潔納德失智父親的身體，不但

  牴觸她的宗教信仰，精力亦甚感疲憊，因她也向雇主瞞著有孕在身…。



  某天納德返家，猛然發現羅芝不假外出，被綑綁的父親則因掙扎翻落床下而失去意識。



  電影以謊言串連，而觀眾也非一開始就是全知者，而是隨著官司推進，越趨白熱化之時，

  才一一由片中的角色抽絲剝繭而揭露。不過，明確告知觀眾為謊言者有三：納德與羅芝為

  了自己的利益而隱瞞的真相，以及納德的女兒譚美為了保全父親而說出的違心之謊。納德

  明知羅芝懷有身孕，但由於被控謀殺，所以假裝自己毫不知情，卻在與家人、證人的對話

  互動裡頻頻露出馬腳。納德推羅芝下樓梯是事實，羅芝受到外力撞擊而流產也是事實，因

  此羅芝就順勢拿這件事來據理力爭，但其實她前一天為了找回失智的爺爺就不慎被車撞。

  即便納德的行為還是可能是流產的最後一根稻草，羅芝還是選擇隻字不提。



  官司當事人為了自己的權益避重就輕很能理解，但是，對於納德的青春期女兒譚美來說，

  就不是那麼容易了。對年輕的譚美來說，這個世界還是黑白善惡分明的二分世界，隨著官

  司越演越烈，她又聽媽媽推測爸爸或許對懷孕知情，再加上自己親耳聽見爸爸詢問家教老

  師一段他聲稱完全不知其存在的對話，譚美的價值觀面臨崩解。即使在她質問爸爸時，爸

  爸告訴譚美如果她希望自己說實話，他就願意坦承，但這根本是怕事的納德將「說實話」

  的壓力轉嫁到女兒身上的爛招。所以，當法官詢問譚美是否告知爸爸有關婦產科電話的事

  ，為了不讓爸爸入獄，她作出偽證，但在回家的車程卻流下屈辱、懊悔的眼淚。



  有趣的是，片中的男人都是為了自己而作出相應的行為，而女人則是為了女兒而採取行動

  。納德對譚美說自己說謊是擔心入獄後，沒人能夠照顧她，譚美將無處可去，但事實上，

  她絕對可以與母親同住。羅芝在希敏與丈夫談好和解金額之後，前去向對方坦承自己的疑

  慮，因為擔心若自己真的搞錯，那這筆不義之財恐怕會報應在心愛的女兒身上。希敏則是

  在胡嘉三番兩次前往女兒的學校鬧事並威脅其人身安全後，認真思考和解的可行性，畢竟

  她從一開始就認為丈夫是在知道對方懷孕的情況下失手傷害羅芝的。至於胡嘉，他更是從

  頭到尾都不曾從女兒的角度出發來思考事情。



  嚴格來說，《分居風暴》是光憑一場官司就拍成的電影，而在兩造被告爭論的鏡頭中，觀

  眾往往位於法官的位置。就連最後的開放式結局也是，導演將判決權全然交給從頭慢慢了

  解始末的我們。從納德與希敏分居開始，譚美都選擇留在家裡，不論是為了即將到來的大

  考，還是選擇留在原生家庭的心理，都情有可原，後續幾場與媽媽的對戲也看到，她對於

  離家出走鬧分居的媽媽頗有怨懟，認為對方就是造成這一切災難的原因。可是，在納德與

  希敏最後的爭吵中，希敏質疑先生確信女兒會選擇他的自信，認為譚美的選擇單純由於她

  想要一個「完整」的家。畢竟若女兒願意，希敏必定帶著譚美移民他國。



  不過，就算譚美真的與爸爸較親，隨著謊言一個個被拆穿，她對爸爸的信任可能也有所動

  搖。最後當家事庭法官詢問譚美想要與爸爸還是媽媽一起生活，她一邊說著自己已經下定

  決心，一邊遲遲說不出口，而眼看在眼眶內打轉的淚水馬上就要奪眶而出，法官也只好詢

  問譚美是否希望爸媽迴避。小學都還沒畢業的她，因為這場「分居風暴」而在一夕之間被

  迫長大。導演不告訴我們譚美的選擇，畢竟她這一路走來所看見的一切，不管是婚姻的無

  奈，還是謊言與人性，都比最後的決定重要不少。



  即便《分居風暴》從開場五分鐘的一鏡到底就不斷要求觀眾下判斷，但電影本身其實非常

  客觀地呈現出片中六個角色不同的立場。譚美的出發點是希望爸媽不要分開，因此她其實

  不是那麼在意「真相」為何與如何解決與處理，只要自己的家庭能夠完好如初，她都希望

  爸爸與媽媽做出那項選擇，只可惜，事情發展到這步田地，也足以讓譚美的爸媽確信彼此

  的價值觀大相逕庭，而孩子也在過程中學會如何憎恨。



  納德看似想把每件事做好，陪女兒讀書時告訴對方「對的就是對的，即使會被扣分也要堅

  持」，為了盡孝道不願移民，但他更多時候都是在乎自己的自尊心，且代表著伊朗男性的

  地位。譚美把這場風暴怪罪給離家的媽媽，但事實上，身為一位沒有老婆就不會洗衣服、

  不知道茶葉放哪裡的丈夫，無關希敏離家與否，納德本來就會讓這一切事情發生。倘若希

  敏沒有離家，或許也會由於某天必須外出而不得不將爺爺綁在房內而導致同樣的悲劇。雖

  說兩人的愛情基礎可能不會讓納德「暴怒而失手推對方下樓梯」，但離婚肯定是無法避免

  的，而既然官司最後想必是雙方撤訴，那希敏離家與否似乎也不會改變譚美最不希望發生

  的結果。



  羅芝礙於家裡的經濟狀況與丈夫的精神狀態，不得不隱瞞自己懷有身孕的事實，硬是接下

  這份幫傭的工作。就算必須幫爺爺盥洗與她的信仰牴觸，羅芝也在仔細確認後繼續上班。

  無奈照顧失智症患者最怕的就是走丟，她也是為了尋找雇主才會被車撞，而納德誣陷羅芝

  偷錢讓她氣不過，在暴力行為也是事實的情況下，順勢將流產的原因怪罪給對方，似乎可

  以解決自己隱瞞丈夫外出工作所導致的一切後果。這一連串的謊言或許會報應在自己身上

  ，但若是拿對方賠償的錢，怕是會報應在女兒身上，羅芝才終於願意坦誠，卻也讓丈夫陷

  入更為兩難的境地。



  雖然羅芝女兒的篇幅很多，但深度刻畫其實不多。她的童言童語或成為家教老師擔任證人

  的證詞，也造成胡嘉與家教老師之間的怨恨，但誰也不知道女兒是否才是整起事件的關鍵

  。她曾經在屋內到處亂跑，而羅芝不曾進去過的房間失竊，她也曾經把玩爺爺的氧氣裝置

  ，而她告訴家教老師爸媽在自己畫作內的該次吵架後就和樂融融也無法確認是否屬實。故

  事發展到最後，早已沒人在乎錢到底是誰偷的，唯一知道的是，兩家的女兒本來無論發生

  什麼事都還能打成一片，但最後談判破局，雙方都認定對方家長說謊之後，兩雙單純的眼

  睛惡狠狠地互瞪著，一切再也無法回到從前。



  胡嘉看似暴躁又好吃懶做，但隨著劇情推進，我們才知道他不但患有躁鬱症，還因為曾經

  在法律上吃過虧，所以不願信任司法，也無法在其他地方任職。面對妻子受辱，未出世的

  兒子又死亡，胡嘉唯一能夠展現自己一家之主的威嚴之處當然是堅持謀殺罪，沒想到在電

  影最後，老婆竟對自己坦承說謊，不要說原本死咬對方的謀殺罪，就連後來大筆的和解金

  都成為不義之財，他甚至還得在對方與債主面前出醜。即便這個家庭並非電影的焦點，經

  過這場風暴之後，想必也比原來更加殘破。



  至於身為女主角的希敏，電影若有似無地將她塑造為「自私」的象徵，但仍有許多線索透

  露出希敏曾經的付出與努力。在爺爺尚能言語的時候，嘴裡喚的都是她的名字，可見在希

  敏提出移民要求之前，都是她在照顧爺爺，而從希敏不多的「課堂」場景可以看出，她應

  該是英文老師，所以納德也才會請女兒去「拜託」媽媽擔任英文家教。在男尊女卑的伊朗

  ，即使是職業婦女，也必須負起照顧家庭的責任，但希敏的娘家環境明顯不差，也難怪她

  不願屈就。在一切風暴發生之後，希敏仍舊念在過去夫妻一場，幫納德籌錢交保，甚至暗

  中代替他去與對方談和解。雖說導演並無揭曉希敏究竟是否告訴丈夫羅芝撒謊，也沒有交

  代女兒譚美的選擇，但逃離這場婚姻可能是她最美好的結局了。



  電影最後，納德與希敏在法院的走廊上，隔著透明的玻璃，各自靠在一邊的牆上，等待著

  女兒做出改變未來幾年生活的決定。此時，走廊盡頭傳來別對夫妻的爭吵聲與小孩的啼哭

  聲，或許又是另一對面臨「分居風暴」的戀人在法院尋求解決之道，而觀眾耳邊響起鋼琴

  樂音，這才發現，全片居然毫無配樂。角色全程劍拔弩張，剪接之緊湊，劇本之精湛，精

  采程度讓觀眾在超過2小時的片長都從頭到尾全神貫注，被這起案件所呈現出婚姻與人性

  的錯綜複雜給深深吸引，這就是奧斯卡最佳外語片的魔力。


  --

  Viola''s World：Screen Scream影迷尖叫屋


