  好像是大家一一承認了自己其實不是因為檯面上的原因

  而是都有內情


  然後最後夫妻兩人走出教室

  等待女兒的選擇

  然後就結束了…


  這個電影不是橫掃很多獎項嗎？

  為什麼會有那麼一頭霧水的結局


  可以請問大家

  這部電影的主旨到底是什麼嗎？


  --

  你可以閉嘴然後不要一直在別人的文底下噓刷存在感，這樣只顯得你可悲，邊緣人'
