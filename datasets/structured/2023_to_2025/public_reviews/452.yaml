url: https://www.ptt.cc/bbs/movie/M.1545640127.A.25C.html
title: '[好雷] 分居風暴'
content: '1.影片名稱 : 分居風暴


  2.觀影時間 : 拒答


  3.觀影地點 : 住家


  4.觀影方式 : DVD


  §其他防雷說明(非必要) : n刷等其他說明請於此區說明....可留空



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  難以排解的人生困境──觀《分居風暴》




  好電影不必一定是耗費鉅資的大製作，只要能夠清楚敘述一個吸引人的故事，又具有深刻

  的主題意涵，加上盡職的演員，就足以令觀眾津津樂道，回味不已。榮獲2012年美國奧斯

  卡電影金像獎最佳外語片的伊朗電影《分居風暴》（A Separation），正是一個絕佳的例

  子。


  《分居風暴》透過一對正準備分居的夫妻，剖析這個三代家庭的人生困境，進而反映伊朗

  的社會問題，人物鮮明，內涵豐富，觀後令人為之喟嘆、沉思。


  此片第一幕，即結婚14年的夫妻納德和希敏在法官面前的一席對話，將此一家庭面臨的困

  境清楚的勾勒出來。妻子希敏希望11歲的女兒譚美在更好的環境成長，決定移民國外，卻

  被丈夫納德拒絕，原來納德放心不下患有阿茲海默症的父親，堅持不肯離開，希敏只得轉

  向法院訴請離婚。


  基於家庭倫理，法官認為希敏訴請離婚的理由不夠充分，駁回其請求。妻子希敏於是離開

  丈夫與女兒，自己搬回娘家與母親同住。在銀行工作的納德只好經熟人介紹，雇用一名信

  仰虔誠的少婦羅芝照料自己的父親。


  羅芝懷有身孕，仍每天大老遠帶著她年幼的女兒到納德家幫傭，並且瞞著失業的丈夫。幫

  傭之外，羅芝尚須照顧納德失智乃至失禁的父親，龐大的工作量令她體力不堪負荷。


  某日羅芝中途出外就醫，怕納德失智的父親任意出門，竟將之綑綁在床上，結果父親翻落

  床下而失去意識，正好納德返家，赫然發現此事，雙方為此爆發激烈爭吵。納德盛怒之下

  ，加以認為羅芝偷錢，乃將羅芝驅逐出門，然羅芝不甘被誣賴，且索求當日工資。經過一

  番爭執，羅芝還是被推出門外。


  不幸的是，羅芝不慎摔落樓梯，懷胎四月的兒子流產了。羅芝失業在家的鞋匠丈夫個性急

  躁，行為粗暴，他堅持提出告訴，認為納德明知羅芝有孕在身卻推打她，於是納德遭以「

  蓄意謀殺」罪名起訴。


  希敏顧念夫妻情分，出錢保釋丈夫，還因擔心女兒安危，居間斡旋談判，希與羅芝和解，

  但納德不認為自己有錯，拒絕出錢和解。經過幾番周折，納德態度終於軟化，同意付錢和

  解。和解書簽字之前，納德要求羅芝在可蘭經前發誓，確實是因納德推她才導致流產。信

  仰虔誠的羅芝怕因說謊的罪愆，將來會報應在自己心愛的女兒身上，這才說出了真相；原

  來前一天她車禍跌倒，肚子疼痛，是以流產的孩子早已是死嬰。羅芝的丈夫獲悉，大感意

  外，為失去了名譽及賠償金而自殘不已。


  事件過後，納德和希敏還是簽字離婚了，他們被法官請到法庭外，等候女兒的決定，這一

  幕兩人之間隔了一道透明卻無法跨越的玻璃牆，深具象徵意義。至於女兒譚美是選擇父親

  或是母親，導演「阿斯哈法哈蒂」（Asghar Farhadi）故意採開放式結局，留給觀眾自己

  去尋找答案，這是不落言詮、相當高明的手法。


  此片劇情曲折，扣人心弦，片長二小時很快就過去了。《分居風暴》呈現了伊朗社會的老

  人照護和中年失業問題。特別是每個主要角色，都面臨難以排解的人生困境而無法自拔，

  比如納德的父親罹患阿茲海默症，生活無法自理，活得痛苦也活得毫無尊嚴；丈夫納德為

  盡人子孝道，不惜與愛妻分居離婚，他一邊替老父洗澡擦拭身體，一邊忍不住低聲啜泣的

  一幕，令人動容；妻子希敏長期照料公公，身心俱疲，急切希望轉換環境，卻難免招來自

  私、不孝的批評；女兒譚美無辜，成了父母的夾心餅乾，左右為難，最終仍得做出父母擇

  一的痛苦決定，電影最後一幕那臉頰的淚痕，令人鼻酸；懷有身孕的羅芝為了賺錢養家，

  冒著宗教禁忌出外幫傭，還因此釀成大禍；至於羅芝的鞋匠丈夫，長期失業，債台高築，

  同樣身陷生活的痛苦泥淖。《分居風暴》的主要人物，可以說沒有一個人是快樂的。


  毫無疑問，《分居風暴》以主題內涵取勝，所謂「人生不如意者十常八九」、「佛曰苦海

  無邊」，此片充分反映了人人難以排解困境，這就是人生的真實，不是嗎？※









  --'
