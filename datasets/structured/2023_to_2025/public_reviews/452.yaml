url: https://www.ptt.cc/bbs/movie/M.1341044690.A.8FC.html
title: '[好雷] 分居風暴：精闢刻劃的一體六面 @ Mival'
content: "防雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n網誌圖文好讀版 \n\n　　橫掃各大影展的伊朗電影《分居風暴》，以非常精闢的鏡頭語言去描寫了這六個主要\n\
  角色之間的矛盾衝突。不僅角色之間互有衝突，角色自己對於自己的價值觀也是處處充滿\n著矛盾。這麼多個角色卻絲毫不顯紊亂，非常有條理地把整件事情的原貌慢慢地還原，也\n\
  在這個過程中讓觀眾們不斷在每個角色中間去尋找認同，然後自己再把這個認同給打破。\n\n　　電影一開頭就用了黑澤明在他的名作羅生門中使用過的一個相當著名的鏡頭：攝影機\n\
  /觀眾就是裁決者。男主角Nader和女主角Simin正對著「法官」互相爭論著各自對於家庭\n的價值觀是多麼的歧異，也間接地帶出了接下來的兩個小時中，完全圍繞在羅生門這種公\n\
  說公有理婆說婆有理、每個人都對，但每個人也都不對這種相當複雜的分居風暴。\n\n　　即使在愛用手持鏡頭來刻意凸顯自己紀錄片風格的一票好萊塢電影面前，導演\nAsghar\
  \ Farhadi使用的手持鏡頭已經算是輕微的了，但依然可以從不少明明就能上腳架的\n定點鏡位中意識到不斷抖動的畫面。以及從頭到尾沒有任何一點動靜的背景音樂（其實我\n\
  到了影片相當後期才意識到原來這是一部沒有配樂的電影，可見導演在劇情張力的處理上\n非常的成功），只有不斷穿梭於鏡頭內外的人聲鼎沸、車水馬龍。沒有矯揉造作地使用偽\n\
  紀錄片手法，但是收攏到極致而不去刻意二分的角色刻劃，以及許多斷掉的故事線（抽屜\n裡不見的錢到底是誰拿走的？），倒是讓整部片瀰漫著濃濃的寫實主義風格。\n\n\
  　　事實上這整部片的所有角色都有相當多的地方能讓你跟他站在同一邊，也會有更多的\n地方讓你討厭這個角色到了極點。不斷在角色之間旋轉的同理心是分居風暴這部影片處理\n\
  得相當完美的部分。\n\n　　Nader從很多角度來看他都是一個負責任的父親。相當尊重他十一歲女兒Termeh的想\n法（多次都讓她決定要不要把爸爸犯罪的真相說出，或是要選擇跟誰住等等），也很注重\n\
  是非對錯的分明（老師教了一個錯誤的單字，即使Termeh說這是老師教的，不照寫會被扣\n分，Nader也叫她記住對的）。但另一方面，這些優點也在影片的後段轉換成重大的缺陷\n\
  或是不斷地被挑戰。其實我認為Nader不斷的要求Termeh自行判斷是否要他跟他的妻子\nSimin複合、是否要說出真相等，都是Nader在逃避面對做下決定的壓力，把這種壓力歸到\n\
  了Termeh的肩膀上。這也和Nader在與Simin吵架時說對方出錯時總愛逃避，不去積極解決\n的指責有相當大的諷刺意涵。而是非對錯的分明更是在Termeh被迫在不讓爸爸被抓去坐牢\n\
  的壓力下說謊而碎裂了一地淚水。\n\n　　Razieh身為一個從頭到尾幾乎都是角色群中的絕對弱者，對整個故事的推動倒是有著\n相當關鍵的影響力。她虔誠的信仰讓她有了相當多的道德上的顧忌，不論是不得與非親屬\n\
  男子共處一室的教條，或是對於所謂「骯髒的錢」會對孩子和家庭帶來不良影響等等，這\n種種的教義上的規範都讓劇情的前進有了相當大的動力或是阻礙。我一直覺得Razieh是一\n\
  個非常愛惹事生非，但自己又不知道界線在哪裡的麻煩人物。她的出發點永遠都無傷大雅\n，但是那之後惹出的事情卻是一個比一個讓人頭大。像是那要命的把Nader的父親綁在床\n\
  上就擅自離去的舉動，在影片的一大段時間都一直讓人無法理解她的行為。但是到了最後\n，Razieh終於說出那天不得不外出的原因，是因為前一天為了找回自己亂跑出去的爺爺而\n\
  不小心被車撞，連帶懷孕四個半月的小孩也無聲無息了。這個大轉折又讓人對這個角色心\n疼無比。\n\n　　小孩子在很多影片中都有著無聲的，但是卻能看透全局的特質。Termeh和Somayeh兩\n\
  個影片中的小孩，在一開始都能和樂融融的相處，即使影片的後期Nader和Simin到了\nRazieh和Hodjet的家中談判，她們也能在外頭開心地玩耍。但是就在談判的這場戲中，\n\
  Razieh因為宗教的信仰而不願意接下Nader和Simin送來的和解金，Hodjet也因為還不出債\n主的錢而大發雷霆衝出門外。Razieh哭著指責為什麼Simin要帶著罪惡的金錢來到家中，\n\
  Nader也不解為何近在眼前的和解就這麼瓦解了。就在這個談判、這個家庭完全的破滅的\n時刻，兩個理應是最沒有戒心的孩子，居然露出了最深沉的表情互相瞪著對方。這個最讓\n\
  我寒毛直豎的畫面，搭配著破裂的擋風玻璃，代表著這整件事已經完全的不可逆、不可解\n決，也毫無轉圜的餘地了。\n\n　　最初的一聲琴音落下，跟著的卻是closing\
  \ credit，還有在畫面的兩端，被一扇玻璃\n門隔開的不斷躊躇的Nader和Simin。極端複雜的、不可被歸類的每一個角色的對或錯，做\n與不做的決定，就像這兩位主角在影片最後那長達三分半一鏡到底卻嘈雜的毫無頭緒的不\n\
  知所措一般，完全無法被一刀兩段。\n\n－－－\n\n（不好意思，Flickr改了設定，我不知道要怎麼抓出圖片的直接連結，麻煩大家如果想\n看圖就`直接移到網誌本頁吧）\n\
  \n▲直接正對著攝影機/觀眾說話的法庭片段（上），與羅生門（下）如出一轍。\n\n\n▲片尾怒目而視的Termeh（上）、Somayeh（下）\n\n\n▲在法庭外躊躇著，被玻璃門分離的Simin、Nader。\n\
  \n\n▲碎裂的擋風玻璃。\n\n\n▲Nader和她的女兒Termeh。（事實上這張照片更像Nader和他的老婆．．．而且我真的覺\n得Termeh的長相實在不符合她11歲的設定）\n\
  \n\n▲讓人不斷轉移認同感的Razieh。\n\n\n▲從頭到尾都頗火爆的Hodjet。我倒沒有在這個角色上看到衝突的認同。\n\n\n▲Nader和他的父親。\n\
  \n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n\n\n\n\n\n\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n\
