url: https://www.ptt.cc/bbs/movie/M.1464235676.A.7CC.html
title: '[新聞] 潘妮洛普克魯茲夫婦洽談主演《分居風暴》導演西班牙語新電影'
content: '新聞網址：



  《分居風暴》伊朗導演 阿斯哈法哈蒂（Asghar Farhadi）才剛以新作電影《新居風暴》

  （The Salesman）重回坎城影展，雖然普遍的影評人認為此作不及導演以前的作品，如《

  分居風暴》（A Seperation）、《海灘的那一天》（About Elly）等，但仍然保有相當的

  水準，更一舉獲得了「最佳劇本」以及「最佳男演員」兩大獎，成為了該屆的最大贏家。


  很快的，導演也已經開始籌備下一部電影的製作，且這次將繼《咎愛》（Le Passé）後

  再度跳脫母國伊朗，挑戰個人首部西班牙語發音電影，目前也正在與《情慾巴塞隆納》潘

  妮洛普克魯茲（Penélope Cruz）及《險路勿近》哈維爾巴登（Javier Bardem）這對世

  界上唯一一對均獲得奧斯卡配角獎的金獎夫妻洽談，夫妻倆有望主演該部尚未命名的電影

  作品，除此之外也有望有更多在好萊塢具有知名度的演員加入。


  目前本片雖然尚未正式命名，但已確定會是一部心理驚悚題材的電影作品，確切的電影內

  容目前因為導演仍在處理劇本的部分，仍然對外保密，不過據傳電影背景將會設定在西班

  牙的農莊中，潘妮洛普克魯茲與 哈維爾巴登將可能飾演一對生活在此農莊以釀酒為業的

  夫妻。目前劇組也正將進入電影場勘的環節，最快預計在下個夏季或秋季開拍。而導演原

  本預計在去年下半年製作這部電影，但之後卻選擇先拍攝《新居風暴》，在坎城上亮眼的

  成績也證明導演選擇正確。


  曾擔任《咎愛》與《新居風暴》製片的 Alexandre Mallet-Guy 在接受《綜藝》訪問時說

  道：「這是一部參雜著些許 阿嘉莎克莉絲蒂（Agatha Christie）風範的心理驚悚電影。

  劇本非常引人入勝。」且表示這將如同導演以前的電影，將再度探討道德的議題，更說道

  導演其實並不會西班牙語，但認為他具有絕佳的直覺，足以勝任此部電影。


  該電影除了由 Alexandre Mallet-Guy 再度擔任製片以外，西班牙大師導演 佩卓阿莫多

  瓦（Pedro Almodovar）與 奧古斯汀阿莫多瓦（Agustín Almodóvar）兄弟也將擔任該

  部電影的製片。其中 佩卓阿莫多瓦在接受訪文時也表示：「這部電影可以同時將文化與

  產業匯集，在現今這將是非常寶貴的。」並補充非常欣賞 阿斯哈法哈蒂的電影作品。


  除此之外，潘妮洛普克魯茲與 哈維爾巴登也將主演另一部由《極渴救援》導演 費南多李

  昂狄阿拉諾（Fernando León de Aranoa）執導的新作電影《Escobar》。



  --'
