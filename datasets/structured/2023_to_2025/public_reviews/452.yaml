title: '[live] 公視HD 分居風暴'
content: '《分居風暴》是2011年一部伊朗劇情片，阿斯哈·法哈蒂編導，蕾拉·哈塔米、Peyman Moaadi、

  Shahab Hosseini、Sareh Bayat和Sarina Farhadi主演，講述一對伊朗中產夫婦分居，以

  及丈夫一方僱用低下階層出身的看護照顧老父時發生的故事。


  本片曾參與第61屆柏林國際電影節，不但成為首部奪得最高榮譽金熊獎的伊朗電影，更同

  時拿下最佳男主角和最佳女主角。[4]次年好萊塢金球獎中，本片奪得最佳外語片。[5]《

  伊朗式分居》是2012年奧斯卡頒獎禮中伊朗角逐最佳外語片的代表作品，成功入圍最後五

  強之餘，亦獲得了最佳原創劇本提名。[6][7][8]最終以大熱姿態勇奪2012年奧斯卡頒獎

  禮最佳外語片。



  故事大綱


  伊朗一對夫婦取得簽證準備離開伊朗，但丈夫 Nader最後不忍拋下患病父親，妻子 Simin

  （Leila Hatami飾）為女兒著想，不想放棄移民，於是提出離婚，但被法庭駁回。兩人分

  居後，Nader請了女傭Razieh照顧老父，但一次女傭擅自外出，令Nader父親在家跌倒，

  Nader又懷疑Razieh偷錢，與她發生爭執，Nader不慎推了對方落樓令她流產，Razieh丈夫

  後來控告Nader謀殺，之後兩對夫婦在庭上展開一連串羅生門式的爭論。[10]



  --'
