title: '[  超好雷] 分居風暴'
content: '防雷

































  我無話可說,真的是太精彩了

  從頭到尾都看的很舒服（當然內容本身不舒服

  導演把人性的立場和自私刻畫到了一個極致

  每個人都有著超級刁民的一面

  只有兩個女兒維繫著這部電影最後的純真

  更甚者還連結了伊朗的社會問題和信仰的綁手綁腳

  羅生門式的推進讓劇情全程毫無冷場

  每幾個段落都有顛覆案情的情況出現

  我不知道有多久沒全神貫注盯著螢幕了

  最後沒做出女兒的決定也是錦上添花

  在這種狀況開放式結局會讓戲劇張力大幅擴增

  我真的舉雙手比讚大力推薦

  希望大家有機會可以看看

  好萊塢以外也是有很多好片可以看的


  ----

  Sent from  on my Samsung SM-M325FV


  --

  萊斯特在最後敘述中講述了生活中有意義的經驗，他說，儘管他死了，他還是很高興，因

  為這世界上有這麼多的美


  --'
