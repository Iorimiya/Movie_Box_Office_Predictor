title: '[微雷] 超燒腦的泰國驚悚片『Anne的多重恐懼』'
content: '-------------------------------------防雷--------------------------------------









  『Anne的多重恐懼』是一部很燒腦的泰國驚悚片

  劇情一開始的氣氛營造非常非常到位

  乍醒的女子 不知自己身在何方

  隔壁傳來聲音告訴女子，女子叫做Anne 被困在這個地方




  霎時間女子又變了一張臉孔

  隔壁的女子也自稱是anne

  到底我是誰?為甚麼所有人都是anne? 在初期懸疑的氣氛就烘托得非常出色。

  一陣突如其來的音樂聲打亂了Anne的思緒

  一個神祕的角色出現了，

  「鹿魔」

  在一陣混亂當中 Anne慘死於鹿魔的手下

  又一次的醒來ANNE發現自己身在時間閉環當中

  剛剛隔壁傳來的聲音

  是現在的自己

  隨著一些閃回的畫面也可以稍微理清一點思緒

  但裡面的大BOSS「鹿魔」又是甚麼來頭




  這部電影懸疑的氣氛營造的相當不錯

  卡司陣容強大 因為ANNE一直要換臉孔 所以用了非常多的演員

  包含非常多當紅的女演員茱蒂蒙瓊查容蘇因、瓦蒂兒等

  是我近期CATCHPLAY+上蠻喜歡的一部泰國片

  但如果節奏可以再快一點我覺得會更好

  總體而言算是值得一看



  --'
