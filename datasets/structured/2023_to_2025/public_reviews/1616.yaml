title: 'Re: [情報] 《貞子 DX》全台上映戲院列表'
content: '...等等，被人家打十個的三浦將軍要扮靈媒?


  這個會不會變成爆笑片啊?????


  不過(也算八卦)，池內博之破壞原著形象也不是第一次了，

  他把原著破壞得最慘的一次是電視劇"替身天使(P.A.)"，

  那次他演出原作裡面風度翩翩的貴公子羽村知臣，

  結果他用GTO裡面村井國夫的造型去演貴公子，簡直是爆笑到不行...


  他就是適合留那個日軍軍官型的小平頭，演其他的感覺都不對啦!


  --


  "你要學會忍耐，哪怕周圍所有的人都不在了，只剩下你自己，你也要堅持到最後。"

  --<<祚明>>


  --'
