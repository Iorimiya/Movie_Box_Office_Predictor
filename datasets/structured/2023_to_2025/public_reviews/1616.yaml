content: '《》


  「貞子」詛咒再度來襲！

  「貞子」數位轉型再進化


  只要看過「詛咒影帶」24小時內就會死亡…



  《貞子 DX》6月2日(五) 詛咒擴散


  電影預告：


  上映列表：


  以日本恐怖代表作《》系列中的「」為題材


  《》原作 親自監修電影世界觀


  日劇版《》 領銜主演，化身IQ200的天才碩士生


  超人氣男團「THE RAMPAGE from 放浪一族」成員  飾演帥氣占卜師


  金馬獎觀眾票選最佳影片《》 化身靈媒師


  體感型「解謎」限時懸疑恐怖遊戲，即刻展開！


  當貞子的詛咒在社群媒體擴散開來…



  看過的人會在24小時內離奇猝死的「詛咒影帶」在網路上瘋傳，IQ200的天才碩士生一條

  文華（ 飾），收到人氣靈媒師Kenshin（ 飾）的挑戰，開始調查詛咒

  的真相。


  認為「一切都能夠以科學說明」的文華，與自稱占卜師的前田王司（ 飾）以及

  神祕的協助者（ 飾），一同為解開貞子詛咒之謎...



  資料來源：


