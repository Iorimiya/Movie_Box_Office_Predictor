url: https://www.ptt.cc/bbs/movie/M.1748763028.A.2E8.html
title: '[ 好雷]  膽大黨 斜視'
content: '從鬼滅之刃以來默默的就接受了這種先行版上映的型態 值不值得買票真的還是要看當下

  播出的集數劇情是不是精彩的部分



  不過來看這部膽大黨邪視的人還真的是出乎我意料的多

  不知道是不是因為只有威秀播出所以想看的都擠來威秀了（是因為過去先行版票房不佳所

  以沒戲院想播嗎？還是威秀簽獨家？）


  今天第三天上映台中大遠百中午12：30場次坐滿到第三排去有點出乎我意料的人多（第一

  天就有想看結果傍晚就只能買到午夜場的票就放棄了，還好有先買先拿到海報）


  以這部「邪視」的三集新+半集「舊」劇情來說

  雖然結尾斷在有點吊胃口的地方

  但這三集內容剛好該有的嘴砲、笑點、動作、音樂、戰鬥半點也沒少。ㄧ氣呵成其實相當

  滿足，

  娛樂性是相當夠的！也終於看到厄卡倫不再只是跑得快以外的戰鬥方式。

  我是蠻喜歡有前面的回顧，雖然舊劇情剪輯的節奏蠻快的，但可以幫我帶回膽大黨的感覺

  。


  最後的導演訪談就...有點多。可能我不太在意這個。不想等七月的話是蠻推薦可以先去

  看的...


  --'
