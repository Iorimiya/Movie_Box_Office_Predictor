title: '[新聞] 現象級動畫《膽大黨：邪視》5月底啟動'
content: '新聞網址：



  現象級動畫《膽大黨：邪視》　5月底啟動全球大規模搶先特映活動


  2025/04/05 16:43

  記者李鴻典／台北報導


  為了慶祝《膽大黨》的回歸，膽大黨版權方 MBS 宣布以《膽大黨：邪視》為名，與動畫

  代理商木棉花國際、ADN 和 GKIDS 攜手合作，為現象級動畫《膽大黨》第二季舉辦

  ，即將於5月30日起跑，由木棉花在亞洲、ADN 在歐洲、GKIDS 在北

  美舉辦。《膽大黨》第二季動畫將於今年七月開始全球同步播出。



  ▲《膽大黨》第二季動畫將於今年七月開始全球同步播出。（圖／木棉花提供）


  《膽大黨：邪視》搶先特映將揭開第二季驚悚的《邪視篇》序幕，粉絲將可一口氣觀賞第

  一季的最後一集與第二季前三集，更能夠觀賞導演山代風我與阿貝爾楣^戈拉的專訪。






  這部備受讚譽且極具人氣的動畫作品，在2024年12月第一季完結後，終於帶著新篇章回歸

  。由享譽全球的動畫工作室 Science SARU（《惡魔人Crybaby》、《犬王》、《歪小子史

  考特：火力全開》）製作，第二季由第一季導演山代風我，與長期擔任 Science SARU 要

  角、曾負責第一季開場動畫的阿貝爾楣^戈拉（Abel Gongora）共同執導。作曲家牛尾憲

  輔（《鏈鋸人》、《惡魔人Crybaby》）將再次擔綱譜寫配樂。


  《膽大黨》第一季在2024年首播，風格獨特、橫跨多種類型的科幻戀愛題材，在世界各地

  都獲得很高的人氣，尤其精彩的動畫場面、劇情緊湊和角色十分討喜收穫了廣泛好評。


  第一季的片頭曲《OTONOKE》由人氣雙人組合 Creepy Nuts 演唱，在社群上掀起討論風潮

  ，創下了在 Billboard 全球日本歌曲榜單上連續 20 週排名第一的紀錄。《膽大黨》更

  受到國際指標媒體如《紐約時報》、《華盛頓郵報》、Teen Vogue 等多家媒體的盛讚，

  全球觀眾都迫不及待地等待第二季的回歸。



  熱賣系列《

  鏈鋸人》與《FIRE PUNCH炎拳》，以及賀來友治的《地獄樂》。

  《膽大黨》

  第二季將於今年七月全球同步正式播出。



  ▲真・武士傳YAIBA。（圖／曼迪傳播提供）


  知名漫畫家青山剛昌的經典漫畫《真・武士傳YAIBA》全新動畫，即將在2025年4月正式開

  播，本作為時隔30年重新動畫化，由製作《進擊的巨人》《SPY脥AMILY間諜家家酒》的動

  畫公司WIT STUDIO擔綱，主角鐵刃的聲優更與舊版相同均為高山南擔任配音，不僅保有豐

  富的原作劇情及角色靈魂，更以現代動畫技術表現動畫精髓，將帶給動漫迷最新鮮及暢快

  的觀影體驗，點燃熱血與冒險的火花。


  全新動畫《真・武士傳YAIBA》由知名動畫導演蓮井隆弘執導，並由擁有豐富劇作經驗的

  待田堂子負責劇本設計，動畫則由青山剛昌親自監修，確保劇情與角色形象忠於原作。動

  畫除了由高山南擔任主角鐵刃配音，更加入石見舞菜香、細谷佳正、小西克幸、諏訪部順

  一等實力堅強的聲優陣容，超高水準配音絕對讓人大呼過癮。


  中華電信MOD、Hami Video宣布，將同步日本於4/5全台首播《真・武士傳YAIBA》。


  --'
