url: https://www.ptt.cc/bbs/movie/M.1743717777.A.07E.html
title: '[新聞] 《膽大黨：邪視》 5月30日晚場起全台上映'
content: '人氣動漫《膽大黨》第 2 季最新情報放送，同步推出劇場版《膽大黨：邪視》


  新一季與劇場版的「上線情報」同步公開。


  人氣動漫《膽大黨 ダンダダン》於去年底播畢第 1 季之後，即刻續訂第 2 繼，時隔多

  月等待之後，官方今日正式公開第 2 季上線情報，以及加碼宣布推出劇場版《膽大黨：

  邪視》。


  《膽大黨》第 2 季即將上演新角色圓城寺仁與妖怪「邪視」（田村睦心 聲演）的全新劇

  情，就看小桃、厄卡倫與高速婆婆如何化險為夷。




  另外，官方加碼推出劇場版《膽大黨：邪視》，將收錄第 1 季最終話及第 2 季首三話的

  劇情內容，更能夠觀賞出自 Science SARU 的本作導演山代風我與西班牙籍導演 Abel Go

  ngora 的專訪。


  《膽大黨》第 2 季將於 2025 年 7 月 3 日正式上線，劇場版《膽大黨：邪視》將於 5

  月 30 日登陸港澳台三地上映，有興趣的讀者們敬請留意木棉花官方網站。


  《膽大黨》原作漫畫累計發行數

  突破1000萬紀念PV：



  新聞網址：



