title: 'Re: [好雷] 心之谷-不因時代而褪色的好作品'
content: '意思意思避個雷


  ----


  對我來說其實退色退很大XD


  心之谷當年是我國高中時期的電影

  當時喜歡到還買了錄影帶

  (對，那時候是錄影帶還存在的年代)

  在當時錄影帶的翻譯還是月島雨


  所以這部片我少說刷了上百次

  不懂日文的我看到連歌都會唱了


  而這次吉卜力重映計畫我只去看了這一部

  多年之後坐在在電影院裏面

  重新看著倒背如流的畫面


  我看到了當年我沒注意到的東西

  可以說是成為社會人後批判的那一面吧


  那是哪一面呢?

  一以蔽之來說

  這部電影就是有錢人WIN WIN的走向


  我先不說月島雯心裏怎麼想

  電影是如何給觀眾一種"天澤聖司比較好"的感受的


  首先是老師講出天澤家是開醫院的

  觀眾看到這裡就會覺得，醫生世家，加分

  然後看到本尊出場，長得比杉村帥，加分

  還會壞壞的挑逗月島，調皮不無趣，加分


  要知道普通的國中生就是杉村那樣

  上學下學打打棒球畢業後升學

  多無聊啊

  但居然有一個國中生不但會拉小提琴、會做小提琴

  還可以國中就去義大利留學?

  不要說月島，把天澤擺在任何國中女生面前鐵定都是排卵臉


  我也不是說有錢人就是BAD

  但事實上他就是家境優渥所以有比較多的選擇


  而這些都是當年我年少輕狂時不會注意到的

  我只會看到追逐夢想的浪漫、男女主角青澀的戀愛

  可以說現在我的心已經不再有發光的寶石、只有乾扁的石塊

  就像月島說的，讀書越來越難以感動了吧


  我以前也會推薦別人去看這部電影

  但我現在不會了


  因為我覺得一部電影跟一個人可以磨擦出火花

  那是一個天時地利人和的邂逅

  絕非因為別人跟你說這部電影很好看你一定要去看

  你就會產生跟我一樣的感受


  每個人的青春裡一定有某一部特別的電影

  那會成為形塑出今天這個你的重要元素


  所以說雖然如此

  我還是很感激心之谷在我十幾歲的時候走進我的生活

  他帶給我音樂與視覺上的啟發至今還是影響甚大


  我以後還是會繼續喜歡這部電影


  --


  另外我也很推薦海潮之聲跟兒時的點點滴滴

  我把這三部電影擅自分類為吉卜力的孤獨三部曲


  --'
