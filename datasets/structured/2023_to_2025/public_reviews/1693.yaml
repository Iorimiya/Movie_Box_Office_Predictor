  〈カントリー・ロード〉是我的心頭好


  一直沒有機緣看《心之谷》


  藉這次重映（跟特典）的機會去看了


  這才發現是這部的主題曲 XD



  整部電影大部分都是滿正常的青澀物語


  但最後…


  直接跟我說要結婚是怎樣 XD


  而且雫明顯（應該）是初戀吧？


  連交往都沒有直接就答應要嫁了是… XD


  瞬間純愛感拉滿 XD



  而說到純愛…


  我直接想到在大螢幕喊出經典台詞的乙骨憂太


  當時沒看過漫畫的我


  在電影院直接傻眼 XD



  一邊是好像沒正式告白就好高興要結婚


  一邊是交往後還是keep住的純愛戰士


  各位覺得哪邊比較純呢 XD


  --'
