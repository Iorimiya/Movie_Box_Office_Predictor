url: https://www.ptt.cc/bbs/movie/M.1639880609.A.EAD.html
title: '[好雷] 心之谷 (側耳傾聽)'
content: '防雷

















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  第一次看，原以為大概是青春愛情，卻也是月島探索內心之成長


  本來懵懂的國中生，看了一大堆書拚升學，後來發現喜好的人事物，遇到天澤的啟發


  思考未來的方向而苦惱，有時只要仔細傾聽內心，答案其實不難找到


  近期打算換工作也有這個問題，我該做什麼好，如果可以，我想要做什麼


  平時有自己的興趣發展，一個夢想，但也要面臨現實方面的考量


  只有利用休息時間一直研究，就像天澤與月島課後的努力


  而爺爺西司朗的對兩人的成果評論蠻符合真實狀況，一開始一定不太好


  寶石總是需要琢磨，知道自己還要更更更加努力，爺爺的勉勵感動大哭


  但為了內心的聲音，我想做喜歡的事總是美好的



  片中不乏親情、友情、愛情、夢想，我想人生不過這幾樣能圓滿足矣


  長大不在年輕後，是否還有勇氣去嘗試


  有痛苦與掙扎，朝著心之所向，希望能一直前進


  雖然遲了多年才看，依然十分滿足



  #超商塑膠袋的對話，過了二十幾年日本還是老樣子


  #追貓時的配樂很喜歡 [Neko wo Oikakete]


  #山丘上的景色很棒吶




  --

  真人覺得拍不出動畫的感覺~

  喔喔不錯，不過日本環保做得強，其實還是可以接受

  我也是耶+1，可惜近藤導演早逝了；紅豬又是不同心境的片了~

  YT能租片隨時可看'
