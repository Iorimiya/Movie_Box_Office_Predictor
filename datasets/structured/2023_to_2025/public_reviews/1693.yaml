url: https://www.ptt.cc/bbs/movie/M.1591684826.A.F43.html
title: '[好雷] 心之谷'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  最近心血來潮在Netflix重看吉卜力的動畫，《心之谷》是我小時候少數沒看過的電影，

  更喜歡另一個譯名《側耳傾聽》。導演是近藤喜文，由宮崎駿擔任編劇。今年初有改編真

  人版電影的消息，但因為疫情延後上映。


  這是1995年的作品，那是一個類比時代已經接近尾聲，數位時代正要來臨的年代。女主角

  小雯的爸爸在圖書館工作，開場就說借閱卡制度要取消了，往後改用電腦借閱。小雯聽了

  一臉惋惜，「好可惜啊，我比較喜歡借閱卡的感覺。」 故事從這一張即將要被電腦取代

  的小卡展開，她發現借來的每一本書都有一個叫「天澤聖司」的男生比她早讀完，於是產

  生好奇。但謎底沒有馬上揭曉，觀眾跟著小雯的腳步跳上電車，鄰座是一隻傲嬌的胖貓咪

  ，牠自己上車，到站下車。小雯一路追隨胖貓咪，發現在山坡上有一間歐洲風格的藝品店

  「地球屋」。地球屋的主人是一位慈祥的老爺爺，而天澤聖司就是他的孫子。（雖然知道

  青春純愛片不會有什麼可怕的情節，但看見小雯走進房子時還是忍不住在心裡嚷嚷著：不

  要隨便進陌生人的家啊！）


  兩人邂逅後，愛情也悄然萌芽。雖然是少女漫畫改編，但愛情並不是這部電影的核心，而

  是藉由青澀戀情被帶領出來的成長。小雯本來是個無憂無慮、喜歡讀故事書的少女，在認

  識聖司後，看見他對小提琴的熱情，一心想成為優秀的小提琴工匠，仰慕之餘也對自我產

  生困惑，第一次去思考自己想要成為一個什麼樣的人。因為喜歡一個人，想讓自己成為更

  好的人。她想到那隻胖貓咪、地球屋的爺爺和貓男爵公仔，下定決心要成為一個說故事的

  人。於是不再借故事書，往自然、歷史的書櫃走去，不眠不休地創作。她哭著說：「我寫

  了之後才發現，光是想寫是不夠的，要學的東西還有很多很多。」老爺爺是第一個讀者，

  在他眼中的聖司和小雯是原石，已經隱約閃動光芒，還等待打磨。故事的最後，聖司帶著

  小雯去秘密基地看日出，太陽緩緩上升，整個城市正要甦醒，這一對少年少女要往自己的

  道路走去。


  我喜歡這部電影，不只是因為一景一物被描繪地栩栩如生，青春愛情平淡如水，像一首散

  文詩，令人雋永不已。吉卜力動畫中動物總是這麼迷人，人物純真洋溢。更是因為今天看

  這部90年代的作品，很容易讓人想起我們和小雯共同擁有過的那個夏天。豔陽高照的午後

  ，窗外蟬聲大作，伴隨電風扇的聲音，和一頁頁的翻書聲。我們一頭栽進書中的世界，忘

  了桌上那杯冰飲料，杯底早融化一片水漬。小雯的媽媽和姊姊已經用筆電工作，她還是手

  寫稿紙，一字一句創造世界。那個夏天步調很慢，有大把的時間可以消耗，在電車上漫不

  經心看城市風景，回神才發現旁邊坐了一隻貓。時光像那隻貓輕輕地走掉了，人已走在路

  上。可是那個夏天從未消逝，永遠會被蟬聲召喚。


  —


  老派電影之必要：


  --'
