title: '[好雷] 《心之谷》—少女維持的煩惱'
content: "首映於上世紀末的吉卜力動畫電影《心之谷》，是一部描述90年代文藝少年少女\n的青春成長電影。\n\n\n\n        故事從一張圖書館借閱證開始，熱愛閱讀的中學少女月島雯發現每張借閱證上總\n\
  有一個相同的名字，令阿雯不禁想像這個和她有相同喜好的人會是什麼模樣，於是「天澤\n聖司」這四個字，成了阿雯默默追尋的目標。\n\n\n\n        同時，阿雯的好朋友夕子滿懷著初萌芽的戀愛種子向她傾訴哀腸。夕子收到情書\n\
  不知如何回覆，因為心裡真正喜歡的對象是棒球隊的衫村。當衫村出現時，夕子害羞地躲\n了起來，但又深怕自己露了餡，扭扭捏捏、害羞臊動，但是一心只想著文字創作的阿雯只\n\
  說：「放心吧，那傢伙很遲鈍的。」\n\n        中學時期總是會有這樣的事情吧，一些早熟的同學開始關注喜歡上他人時的內心\n活動，一些同學還懵懵懂懂地不曾想像自己和戀愛的關係，夕子和阿雯大概就是這樣的組\n\
  合。\n\n\n\n        直到少年的出現，終於讓總是埋首於故事書裡的阿雯，抬頭看見真實的世界。少\n年成了阿雯在意的對象，無論是第一次偶遇便惹阿雯生氣，或是再次於校園相遇卻故意無\n\
  視，都令阿雯掛在嘴邊。第三次再見，是在少年家裡開的古物行。少年和阿雯分享自己對\n於小提琴製作的興趣，並決心要前往義大利學習提琴工藝，阿雯驚訝和她同年紀的男孩竟\n\
  然這麼早就決定未來的方向，阿雯說：「不像我，每天都在混日子」然而少年眼裡看見的\n是阿雯的優點，少年覺得她很可愛、少年稱讚她寫的歌詞，而這迷樣少年，原來就是天澤\n\
  聖司。\n\n        此前其實還發生了一件事，即夕子的暗戀對象衫村，竟然向阿雯告白。阿雯不敢\n置信，怎麼連她認為遲鈍的傢伙，都比她還要早察覺愛情。「原來遲鈍的是我」，阿雯一\n\
  副挫敗的樣子說道。\n\n        於是，發現身邊同年齡的朋友們不是早已確立人生方向，就是在心理層面比她還\n成熟的阿雯，於炎炎夏日躺在床上的夜晚，開始思考自己的未來。\n\
  \n\n\n        不思考還好，一陷入思想漩渦裡頭，連天空也烏雲密佈下起大雨。某個落雨天，\n在學校的頂樓，聖司和阿雯說他即將前往義大利實習兩個月，終於可以實現夢想，阿雯替\n\
  他開心。可是一想到自己仍然前途未卜，便又自我否定了起來「我像個傻瓜」、「我程度\n太差」。沒想到，聖司竟接著脫口說出：「我是為了引起你的注意，才借那麼多書的」，\n\
  令阿雯驚訝的是，竟然有人早在我都還不知道自己的優點前，就已經喜歡我了。這時天光\n乍現，烏雲散去，阿雯強忍著淚水。\n\n        明明看一樣的書，聖司卻有著明確的目標，阿雯覺得自己也應該要做點什麼，於\n\
  是她決定要寫一本故事書。然而身為準考生的阿雯，為了完成小說荒廢課業，也因此和家\n裡產生衝突。\n\n\n\n        電影的後半段，阿雯一面倒數聖司回來的日子、一面應付考試、一面構思小說。\n\
  戀愛、學業、自我追尋——少女維持的煩惱，青春的永恆命題。\n\n        小說完成的那天，阿雯捧著一疊稿紙來給聖司的爺爺過目。阿雯惴惴不安，害怕\n自己的作品就像昨日的夢魘，看似閃閃發亮的寶石，一挖開竟是一隻死雛胎。為了追尋喜\n\
  歡之人的腳步，阿雯一股腦完成的作品，最後得到爺爺的評語：粗獷、直率、不甚完美，\n但是你很努力，太棒了。少女大哭，深怕被聖司丟下的自己，如今也有了一點成績，終於\n\
  準備好回歸現實，準備高中入學考試。\n\n        隔天清晨，當阿雯一打開窗戶，竟然看見聖司就在樓下，聖司說我在心中呼叫著\n你，你就出現了，吉卜力特有的青春戀人絮語，浪漫至極。聖司說要騎腳踏車帶她去一個\n\
  地方，特別喜歡的一段是，當聖司騎上坡道時，他說一直想著要載阿雯騎這段路，但是阿\n雯隨即跳下車，阿雯不要當他的包袱，阿雯說：「我要成為你的支柱」。\n\n\n\n\
  \        電影最後結束在山坡上的秘地，兩人一同看著日出灑亮整個城市，彷彿也照耀兩\n人即將啟程的未來。或許他們真的會再相遇，也或許終將各自開出不同芳香的花，但是此\n\
  刻聖司一把抱住阿雯「阿雯，我最喜歡你了」\n\n        小時候看《心之谷》總是片段式的瀏覽，幾乎不曾在電視上完整的看過一回。還\n好二十一世紀的Netflix有收錄，能讓我好好地欣賞這部電影。\n\
  \n        很喜歡這部在吉卜力電影裡應該可以算是非常質樸的作品，喜歡描繪細緻的多摩\n街景，以及建構完整的小鎮，還有citypop感非常強烈的夜景。謝謝月島雯的勇氣，讓因\n\
  為疫情工作受影響的我能重新拾起對自己的信心。\n\n        這部電影剛好和我同年出生，雖然我總有一天會離開，但是《心之谷》裡勇敢追\n夢追愛的少年少女，將會永遠存在。\n\
  \n--\n不是唷，是維持\n我是寫維持喔"
