title: '[好雷] 心之谷'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~












  這是我的一次看這部耶


  其實蠻高興現在才看的

  如果是年輕時候看的我

  大概不會了解，這部電影能帶給我的東西吧


  人對未來總會有迷惘

  擔心自己未來行不行

  我繼續走這條路ok嗎


  阿雯因為聖司

  了解了愛情的苦澀

  以及未來她想走的路


  看電影的我都覺得羨慕

  如果能那麼年輕就知道自己想要做什麼 有該多好







  電影節奏就不說了


  輕快 明瞭

  前中段我還在想到底貓男爵的存在意義為何


  後段爺爺跟阿雯聊天

  也終於知道他的定位有多麼重要了


  很棒的一部電影

  我個人覺得 是比較適合剛出社會的新鮮人來看


  像我這種快40的大叔來看這電影

  唉 只有無限感慨啊








  --





  --'
