url: https://www.ptt.cc/bbs/movie/M.1683131184.A.66C.html
title: '[普偏好雷] 聽誰的聲音：電影版《心之谷》'
content: "本文涉及劇情，且具個人觀點，推薦觀影後再讀。\n\n　　　　本片已上映第二週，有意者請把握本週時間。\n\n\n\n　　　　圖文網頁版：\n\n\
  　　　　\n\n\n　　　　預告片：\n\n　　　　\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n側耳傾聽，聽誰的聲音：電影版《心之谷》\n\n\n\n　　１９８８年，１５歲的月島雫與天澤聖司因圖書館借閱卡相識，聖司為\n\n了實現職業大提琴手的夢想遠赴義大利，雫則承諾會努力成為兒童文學作家，\n\
  \n兩人許下十年的約定，從此分隔兩地。十年後，雫已是一名兒童出版社編輯，\n\n工作不順，創作屢投屢退，儘管每遇挫折總會想起聖司激勵自己，但現實的\n\n考驗使她自覺距離夢想越來越遠。進退維谷之際，雫決定遠赴異國，確認愛\n\
  \n情與夢想是否要再持續下去。\n\n\n\n　　在看電影版《心之谷》前後，我都沒有看過１９９５年的吉卜力動畫，\n\n也沒看過１９８９年的原作漫畫《聽聽我的心（耳をすませば）》，卻不妨\n\
  \n礙劇情理解，只是單看情節推進的安排有許多日本少女漫畫的痕跡。但我滿\n\n喜歡現在與過去、成人與年少的穿插，彷彿正是回憶陪伴著月島雫與天澤聖\n\n司一直走到２５歲的現在，同時帶出兩人追求夢想與延續愛情遇到的困境。\n\
  \n\n\n「只要側耳傾聽自己的內心，就能找到自己的初衷。」\n\n「我覺得夢想是會隨時間改變形狀的。」\n\n\n\n　　這兩段話可說是電影想傳遞的核心。從雫與聖司年少相識、長成各自追\n\
  \n尋夢想、又要維繫感情的多線並行裡，電影選擇偏重月島雫及愛情。當雫來\n\n到義大利，在聖司的伴奏下唱出〈翼をください〉（請給我一雙翅膀）一段，\n\n既呼應年少回憶，更成功確認兩人之間的情感連結仍在，聖司也藉由韋瓦第\n\
  \n的話告訴雫「生存的價值在於有多少笑容」、「即使雫無法成為兒童文學作\n\n者，但以編輯的身分幫助作家，讓出版的作品為大家帶來笑容我認為也是相\n\n同的意思。」從對雫的理解觸發了自我的理解，進而讓他察覺失去了發自內\n\
  \n心演奏的快樂，都是延續之前歌唱確認的情感連繫──或許這也是將聖司的\n\n夢想從原作的「小提琴工匠」改編成「大提琴手」的用意，畢竟同在創作／\n\n演奏以自我表現的道路上，更有足以彼此理解的共同點。\n\
  \n\n\n　　然而讓兩人在夢想困境的癥結都藉由「過去」延續至今的愛情解決，也\n\n就失去了「現在」真正彼此理解各自處境與成長變化的機會。雖然闖入的安\n\n\
  排很突兀，但莎拉的那句「你們是不同世界的人」，以及聖司找不到逃走的\n\n雫的事實，對我來說同樣真確。而讓聖司藉由一封遲來的告白信挽回雫，又\n\n與之前的理解與連繫產生了矛盾：顯然雫認為他們之間的相識出自天意的巧\n\
  \n合，實則是聖司處心積慮努力的結果──這份誤解反而讓我困惑：這兩個人\n\n是怎麼延續了十年？\n\n\n\n　　其次，雫的創作夢想在電影裡全由聖司提議與鼓勵（吉卜力動畫是聖司\n\
  \n爺爺），後來投稿全都落選的挫折，使擔任編輯的她失去向老師直言表達感\n\n想的自信，因想獲得外界的認同以致失去了夢想的初心，這部分的安排對創\n\n作者而言可說相當真實而適切。只是雫自言無法「靠自己下決定」，以致必\n\
  \n須去尋找聖司；以及無法依爺爺建議，傾聽自己的內心，而是要由聖司在信\n\n裡說：「希望你不要放棄夢想，這是身為第一號讀者的請求。」才重拾創作\n\n──再度令我好奇這十年來，在僅有撥接網路，手機無法上網，且手寫稿應\n\
  \n該只有一份的年代，聖司還一直是雫的第一個讀者嗎……？\n\n\n\n　　或許情節如此安排是要強化聖司在雫心中的重要性，以及雫在聖司心中\n\n的無可取代，但從１５－２５歲這樣自我探索及與現實接觸的重要年歲，兩\n\
  \n人都未在彼此身邊，雫堅持夢想顯然只是為了要追上聖司的夢想，畢竟電影\n\n裡並未表現她真心想要創作的動機與欲望：她想說什麼？為誰而寫？除了投\n\n稿失敗，她有意識到自己創作的強弱之處嗎？如果背離自己的心聲，那麼這\n\
  \n樣的夢想是否還有意義？\n\n\n\n　　電影只處理了最後一個問題。總之在最後偏重的選擇，讓我覺得雖然劇\n\n情以雫為主，也讓她在重新提筆創作時體會到「希望真心的創作能打動別人\n\
  \n的心」，但這點在她十年創作時並未有所迷惑與掙扎，而是呼應聖司的困境，\n\n成為加重十年仍然相愛（卻未必相知）的設定。若將夢想視為一個人部分性\n\n格與生命的證明，雫反而像是為了成就聖司而存在，她等待的彷彿僅是最後\n\
  \n聖司的那句「不能沒有你」的求婚，這是讓我覺得最可惜的地方。\n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\
  \n                                  陳斐雯  貓蚤札（其三）\n\n--"
