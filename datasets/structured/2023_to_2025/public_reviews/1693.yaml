url: https://www.ptt.cc/bbs/movie/M.1375362206.A.1FC.html
title: '[好雷] 心之谷──少年少女的神話'
content: "───────────────────────────────────────\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  (網誌版 from 一個分析師的閱讀時間)\n\n\n[影評]心之谷──少年少女的神話\n《心之谷》(日文原名為《耳をすませば》，英文名為\"Whisper of\
  \ the Heart\"，原意為\n側耳傾聽)是吉卜力工作室於1995年推出的年度動畫電影，也是近藤喜文唯一一部正式執\n導的院線動畫電影。近藤喜文製作過相當多知名動畫作品，例如《巨人之星》、《魯邦三\n\
  世》、《清秀佳人》，以及吉卜力工作室的《螢火蟲之墓》、《魔女宅急便》、《兒時的\n點點滴滴》、《紅豬》、《海潮之聲》、《平成狸之戰》、《魔法公主》等大作，可以說\n\
  是宮崎駿手下最強的大將。可惜的是，1997年的《魔法公主》後，近藤喜文在1998年遂因\n主動脈剝離猝逝，使吉卜力工作室遭受重大打擊，宮崎駿隨後也宣布退休。\n\
  \n宮崎駿改編少女漫畫的動畫劇本，最知名的就是《心之谷》與《來自紅花坂》，前者由愛\n徒近藤喜文執導，後者由其子宮崎吾郎執導。雖然兩者都是宮崎駿的劇本，也同樣描述一\n\
  段青春愛情故事，但導演的天份在兩部片中一覽無遺。宮崎吾郎說故事毫無重心、節奏完\n全失當，水準比學生作品還糟；相對地，近藤喜文完美地重塑劇本的靈魂，每一個細節都\n\
  引人入勝。\n\n\n\n1995年，東京清明上河圖\n\n《心之谷》是一部非常寫實的動畫作品，所有場景皆取自當時多摩市的實景。更早之前沒\n有電影，只能依靠靜態的畫作紀錄一座城市的樣貌；有了電影之後，一般電影紀錄一個時\n\
  代一座城市的樣貌又遠比動畫電影來得真實，動畫似乎更適合處理非現實的場景與故事。\n然而，《心之谷》不僅完全反其道而行，近藤喜文更用各種現實場景的轉換處理本故事的\n\
  第一幕。\n\n車站、商店街、水泥公寓、校園，這些場景就是女主角月島雫的日常生活。觀眾隨著月島\n的視角轉換，彷彿置身於1995年夏天的東京多摩市。月島最大的興趣是向圖書館借書來讀\n\
  ，她發現每一張借書證上都有一個名字，天野聖司。這個鋪陳接連出現，暗示天野對少女\n月島而言是個特別的存在。月島偶遇了一位黑髮少年，這個少年知道月島的名字，進一步\n\
  讓觀眾解開天野真實的身分。\n\n第一幕結束於一隻貓。月島替圖書館員的爸爸送便當，卻跟著一隻慵懶的灰毛貓探險似地\n步上山丘，進而發現一間古董店，地球屋。山丘上的窄路其實就像《神隱少女》中的隧道\n\
  ，隧道另一端就是異世界；而地球屋就是月島的「異世界」。月島在地球屋邂逅了一位老\n爺爺以及玩偶貓公爵，最後又以黑髮少年作結。\n\n然而月島沒有立刻與這個異世界產生連結，而是暫時回到現實世界──家庭、上學、升學\n\
  、友情與愛情的交纏。月島開始感受現實壓力，於是又回到地球屋。這次重返地球屋，月\n島不錦進入內部工房，更發現了黑髮少年就是天野聖司，同時知道天野的夢想──成為小\n\
  提琴工匠。天野的夢想使月島開始質疑起自己未來的道路。這段場景設計格外出色。地球\n屋是月島的異次元，月島進入地球屋地下二樓，表示月島更深入了這個異世界；地球屋的\n\
  內部設計與景色也的確並不尋常，讓觀眾的情緒也跟著月島一同高昂起來。而地球屋不同\n於普通城市的設計，更帶出月島的「側耳傾聽」的小說氣氛。\n\n導演近藤喜文完美結合了敘事情緒與場景氛圍，在場景處理上，不論是亮度、彩度或者視\n\
  角都非常準確。相對地，宮崎吾郎在《來自紅花坂》中的場景設定並不比《心之谷》遜色\n，但宮崎吾郎有兩個致命缺點，第一：畫面色彩太過飽和完美，彩度與亮度都太滿，這不\n\
  僅無法呈現晝夜晨夕下不同的光影效果，更無法貼近角色情緒。另外一個致命缺點則是：\n場景設計太乾淨簡潔，完全沒有生活感。而這兩點正是近藤喜文最成功之處。月島房間到\n\
  處都是散落的書冊與衣服，客廳更是充滿雜物，就連裝麥茶的陶杯都有陳舊感；在光與色\n的處理上，清晨的色調偏藍、夕陰的色調偏黃、正午的色彩飽和明亮、夜晚的光度明暗有\n\
  致。\n\n電影是一種視覺藝術，導演不能只是把劇本分鏡後，完全不管顏色、光影、構圖等視覺要\n素，直白地照著分鏡圖拍，動畫電影更是如此。《心之谷》寫實的場景與細膩的視覺處理\n\
  手法絕對是構成其藝術性的重要元素，導演近藤喜文絕對功不可沒。\n\n\n圖、月島與她的好朋友們之鄉村路@地球屋Live Ver.(カントリー・ロード)\n\n\
  誰說追尋不是一種逃避\n\n本片的主題是「追尋」。月島追尋新世界，也透過對新世界的理解追尋了自我。身為創作\n者，我相信近藤喜文與宮崎駿必然把自己的生命經驗投射在月島這個角色身上。從旁人看\n\
  來，月島不過只是個愛看書的少女，偶爾寫寫歌詞為眾人稱讚，但距離文學家的水準還很\n遙遠。月島最初寫小說的動機並不純粹，絕大部分因素是為了能站在與天野相等的高度，\n\
  而非真正喜歡書寫。月島廢寢忘食寫小說造成名次下降，與家人也產生衝突，看似是一種\n「確定自己人生方向」的成長的反抗，但誰說這不會是為了逃避課業壓力而將刻意分散注\n\
  意力的行為？從旁人看來，追尋也可以是一種逃避。\n\n所有行為都隱藏許多可能的動機，說出口的理由不見得最貼近真實。月島的父親理性開明\n，他沒完全認同女兒的執著卻也不急著否定，只是溫溫厚厚地包容了什麼都不肯說的任性\n\
  女兒。時間會證明一切。不管雫是為了逃避現實而寫或者是為了追尋夢想而寫，隨著時間\n經過，她的每一個細微決定每一個無意行為，都會逐漸證明這種偏執到底是一種追尋還是\n\
  一種逃避。\n\n本片最殘酷的象徵，莫過月島熬夜趕稿時的惡夢。她在天青石洞窟裡面不斷尋找，一個聲\n音不斷督促她：「快點找到吧！快來不及了！」她伸手握住了一塊發光的天青石，張手卻\n\
  發現那不過是一隻尚未長羽的雛鳥死屍。努力從來不表示會有結果，甚至絕對多數人自以\n為是的天分都只是愚人金。那麼我們為什麼要發展天分？為什麼要拼了命似地完成一件可\n\
  能毫無意義的事情？月島被惡夢嚇出一身冷汗，但對於曾經努力追尋過夢想的人而言，這\n段的主題之殘酷殘忍，更讓人不寒而慄。\n\n然而，這也都是追尋夢想必經的過程。唯有理解路途險惡但仍執意穿過荊棘的人，才有機\n\
  會真正抓住閃閃發光的天青石。電影中描寫的苦難，終究不如這些藝術創作家數十年創作\n生涯遭遇的萬分之一。月島的形象不僅是宮崎駿與近藤喜文的投射，更是所有藝術創作者\n\
  、所有追尋夢想者的的投射。月島跟天野爺爺在小說完成後的談話，非常深刻。沉著而充\n滿智慧的天野爺爺對月島說，她就是一塊原石，只要日後能勤加打磨拋光，一定能綻放寶\n\
  石的光芒。從未真正寫過小說的月島，從書寫中照見自己的不足，但同時也激發起對於創\n作的渴望。「想繼續寫」與「想寫得更好」的意志，決定了一個人能走得多遠。真正的追\n\
  尋並非輕浮的空口白話，而是日積月累、從不間斷的努力──如此追尋，就不是逃避。\n\n\n少年少女的神話\n\n我國中時看《心之谷》完全沒有任何感覺，整部片的基調太過寫實，完全不似宮崎駿幾部\n\
  成名作品那麼夢幻浪漫；海報上的少女與貓公爵的飛翔，原來不過只是片中女主角小小的\n插曲與幻想。動畫該是夢想，當時年輕的我看《心之谷》，只看到現實看不到夢想。時隔\n\
  十五年後重看，才深刻發現自己當時太年輕，以致於無法真正理解這部電影。《心之谷》\n是一部大人用少年少女的視野重新觀看人生的作品，所謂的夢想，其實必須扎根於現實。\n\
  \n然而，這不是當時的我能懂得的事情。因為對少年而言，一切都太過理所當然。人生擁有\n各種機會是理所當然，把時間浪費在自己喜歡的事物上是理所當然，往遙遠的目標前進是\n\
  理所當然。但多數少年們都沒能把握這段最能創造奇蹟的時光，只是在過度繁雜的選擇中\n擺盪、在過度美好的青春中漂流，直到不再年輕，才知道自己已然錯過太多可能的風景。\n\
  我們絕大多人都不是雫也不是聖司不夠成熟早慧，我們可能是遲鈍的棒球少年杉村、可能\n是戀愛的少女原田，可能是充分社會化的大學生月島汐子。我們的夢想並不遙遠，只想跟\n\
  自己喜歡的人相戀，只想在世界巨大的潮流中找到一席無須太過辛苦的位置。我們看著近\n處，只想順勢而為。\n\n月島未來會成為作家嗎？我們不知道。天野未來會成為小提琴工匠嗎？我們也不知道。我\n\
  們相信的是月島與天野並肩站立於山丘上，凝視著日出的眼神。日光乍現，萬物鑲上金色\n的輝芒。山上有風，少年與少女互相許下終身的誓言，在此刻彷彿能看見永恆。我們期待\n\
  夢想、期待神話，《心之谷》的表象如此寫實、本質卻又如此夢幻，終究是一部寫給大人\n看的關於少年少女的神話。\n\n\n 圖、這是最初的電影宣傳海報之一，但此畫面並沒有出現在電影中。\n\
  \n\n最後，僅以Olivia Newton-John所唱同時也是電影開頭採用的版本，Take Me Home\nCountry Roads，向近藤喜文這位英年早逝的優秀導演致敬。\n\
