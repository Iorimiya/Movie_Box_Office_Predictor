title: 'Fw: [情報]心之谷真人電影化 故事背景為原作十年後.'
content: '作者: alinwang (kaeru) 看板: C_Chat

  標題: [情報]心之谷真人電影化 故事背景為原作十年後.

  時間: Tue Jan 14 09:57:07 2020




  「耳をすませば」実写化！清野菜名と松坂桃李がW主演、雫と聖司の10年後描く



  「耳をすませば」の実写映画化が決定。9月18日より全国で公開される。


  「耳をすませば」は1989年に柊あおいがりぼんで発表した青春恋愛マンガ。読書好きの

  中学生・月島雫が、夢に向かって生きる天沢聖司に思いを寄せていくさまを描いた。

  1995年にはスタジオジブリがアニメ映画化。近藤喜文が監督、宮崎駿が脚本を担当し、

  本名陽子と高橋一生が雫と聖司に声を当てた。


  このたび製作が発表された実写版では、清野菜名と松坂桃李がダブル主演を務める。原

  作の世界観を忠実に再現する“あの頃”（過去）と、オリジナルストーリーである10年

  後（現在）を描く。清野は出版社で児童小説の編集者になった24歳の雫、松坂は夢を追

  い続けて海外で暮らす聖司役で出演。「約束のネバーランド」の実写映画も手がける平

  川雄一朗がメガホンを取った。


  清野は「雫はどのようにして大人になっていったのか、彼女の思いに寄り添いながら、

  雫の持っているピュアな心を大切に、丁寧に演じていきたいと思っています」とコメン

  ト。松坂は「『耳をすませば』はアニメーション映画で何度も見た作品です。学生生活

  の日常にある歯痒さや微妙な距離感で感じる甘酸っぱさ。あの頃にしか感じられないも

  のが詰まっていて素敵だなと思っていました。あの物語の“その後”を想像した方もい

  らっしゃるのではないでしょうか。僕もそうでした」と述べている。


  「耳をすませば」の撮影は2月中旬にスタートし、3月にクランクアップ予定。


  清野菜名 コメント


  この度、映画「耳をすませば」で、月島雫を演じることになりました。

  誰もが大好きな名作「耳をすませば」の世界に雫として存在出来ること、とても嬉しく

  光栄に思っております。

  あれから10年。

  雫はどのようにして大人になっていったのか、彼女の思いに寄り添いながら、雫の持っ

  ているピュアな心を大切に、丁寧に演じていきたいと思っています。


  松坂桃李 コメント


  「耳をすませば」はアニメーション映画で何度も見た作品です。

  学生生活の日常にある歯痒さや微妙な距離感で感じる甘酸っぱさ。

  あの頃にしか感じられないものが詰まっていて素敵だなと思っていました。

  あの物語の“その後”を想像した方もいらっしゃるのではないでしょうか。

  僕もそうでした。

  月日を経て描かれる“その後”の物語に関われることを嬉しく思います。

  平川監督とは初主演の作品「ツナグ」でガチガチに緊張していた僕にムチを打ちながら

  支えてくださった方。

  監督のお陰で走りきることができました。

  その平川監督ともう一度組む事ができる喜びと緊張感を噛み締めながら、撮影に臨みた

  いと思います。


  平川雄一朗 コメント


  「耳をすませば」という沢山の人達が知っている原作の10年後を描くという実写映画化

  に大変な緊張感とプレッシャーを抱えていますが、主演の2人を始めとするスタッフキ

  ャストの力を集結させ、原作の空気感をそのままに心温まる映画となるよう邁進したい

  と思います！


  西麻美（プロデューサー）コメント


  私も大好きな作品「耳をすませば」を実写映画化しようと考えた時、とても悩みました

  。

  ですが、実写映画の形を探る中で、原作にある中学生時代に加えて10年後の大人になっ

  た雫と聖司を描いたらどうだろうと思いつきました。

  そして、雫役に清野菜名さん、聖司役に松坂桃李さんというお2人が決まったことで、

  これは素敵な作品にできると確信しました。

  中学生時代と大人時代を描く実写版「耳をすませば」、楽しみに待っていただけたらと

  思います。


  (c)柊あおい／集英社 (c)2020『耳をすませば』製作委員会


  雖然OP,但前一篇的標題殺人太過對原作者柊あおい也不尊重,所以重貼.


  --

  有,書名忘了是側耳傾聽還心之谷'
