url: https://www.ptt.cc/bbs/movie/M.1749808241.A.2C1.html
title: '[好雷]【情書】X【心之谷】圖書館借書卡之戀'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  網誌圖文版：


  今年我看了兩部三十年前的日本老電影：情書和心之谷，它們因為太經典，還重新在台灣

  戲院短期上映。


  「情書」是真人演出，「心之谷」是宮崎駿動畫，雖然都是純愛風格，但劇情截然不同。


  「情書」是兩個一男一女的國中生，因為名字都叫做「藤井樹」被全班取笑而開始有交集

  ，男生表面上說自己不喜歡女生，卻其實偷偷暗戀對方很久。


  兩個人因為管理學校圖書館業務，常常一起在圖書館工作，男生故意借很多沒人看的書，

  幾乎每張借書卡最上面都是他的名字「藤井樹」，女生每看見一次，就困惑一次為什麼他

  這麼愛看書？


  長大之後再回學校，學妹們告訴她「藤井樹」藏在書裡的情意，女藤井樹才知道，那一遍

  遍的藤井樹，寫的不是男生自己，而是滿滿的她。


  借書卡，是藤井樹的情書，紀錄他說不出口的初戀。可惜兩個人最後終究錯過。


  「心之谷」也是國中生的故事。女主角在圖書館借書的時候，老是看到借書卡上有一個陌

  生的名字「天澤聖司」，她忍不住升起好奇心，不停想像對方是怎樣的男孩？怎麼那麼愛

  看書？


  後來兩人真的相遇了，成為很要好的朋友，經歷過一些波折，最後兩人約定，等男孩留學

  回來，彼此永遠都不要分開。

  -----------------------------------------

  這兩個故事，講的都是主角心裡對某個人最純粹、完全沒有雜質、全然的愛，簡單得彷彿

  只是一杯白開水加點檸檬汁的愛情，卻非常動人。

  ------------------------------------------

  這兩個電影雖然故事不一樣，但都巧妙融入「借書卡」橋段，讓我一邊看，一邊忍不住會

  心的笑。


  現在到圖書館借書，已經不用手寫借書卡了，但我記得，很久以前，小時候到圖書館借書

  ，仍得親手填寫登記的回憶。


  我很喜歡抽出那些借書卡，仔細的看著上面的名字和字跡，想像是誰也跟我看了同一本書

  ？想像我能不能找出，跟我的閱讀有最大交集的另一個人？


  想像，我能不能在圖書館找到一個男生，每一本我們看過的書，封底的借書卡上，都寫有

  彼此的名字，而品味如此相似的我們，應該可以聊很多很多閱讀心得，然後我們一定會愛

  上對方的(吧)。


  不過很可惜，我從來沒有一個男朋友，是在圖書館找到的哈哈哈哈哈，他們一個比一個還

  要懶得看課外書呢，打電動對他們來說更實在。


  沒關係，關於「借書卡」的浪漫，從電影情節中去實現，也夠滿足了：)


  --

  少了好多趣味哈哈哈哈

  感謝指正^^

  說實在，有時候某人執著的浪漫純愛，在現實生活中大多會讓人困擾XD

  過度追求、恐怖情人等，他們也都抱持著愛你到底的精神

  我的朋友就堅持守候前任，騷擾到對方崩潰

  我知道，但統稱為宮崎駿作品大家比較熟悉

  感謝已修正~

  單純的曲調就很動人

  感謝指正  已修正^^'
