url: https://www.ptt.cc/bbs/movie/M.1505916149.A.2E7.html
title: '[無雷] 金牌特務 VS 心之谷'
content: '為什麼金牌特務2裡面會一直出現日本動畫心之谷的 Country road 音樂?


  這兩個完全不搭嘎的東西聯合在一起 真的很突兀


  最近壓力很大 去戲院看金牌特務 吹冷氣 喝可樂 看爽片


  心情好多了 最近很多事情要處理 很煩 看個電影抒發心情 真的有差!


  和第一集比起來 還是一好看 但並不是說二就不好看 只是一些創意在第一集就有了


  所以第二集看起來才比較沒有新鮮感


  沒看過一 直接看二的話 我是比較不建議 不然你根本不知道哈利是誰 (搞不好我打錯字)


  可以把它當作放鬆心情的爽片 真的也是蠻好看的 壓力很大看個電影放鬆心情


  我是到三重的天台影城看的 戲院沒什麼觀眾 外面的路上 人還真的很多


  覺得第一集好看的話 二絕對不會讓你失望


  --


  那個....那個.....實現我的夢想(小聲)  摸你的頭  欺負你到哭


  --'
