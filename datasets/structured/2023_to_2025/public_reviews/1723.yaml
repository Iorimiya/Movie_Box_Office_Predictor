title: '[好雷] 假面騎士劇場版 BATTLE ROYALE'
content: '先說心得



  這部比起以前的劇場版不一樣


  非常值得觀賞


  大家都來戲院看吧





  以下有雷


  以下有雷


  以下有雷


  以下有雷


  以下有雷


  ————————————————————


  一家人去溫泉旅館旅行


  懷石料理一人一份看起來很好吃


  不知道一間多少錢


  竟然還多了一個嬰兒


  爸爸也努力做人成功了


  青鳥發現2個生命體


  五十嵐子女應戰


  一輝只有一半力量


  三子女應戰巴利德爾和另一個


  2個敵人來搶基夫力量


  原本以為目標是一輝


  三人被打的好慘


  目標原來是幸四郎


  奪走嬰兒後，一輝被打到瀕死


  倖存假面騎士再次應戰，勉強打平


  敵人把幸四郎的惡魔吸收，能力大增


  一輝取回拜斯力量


  親友團為他們加油


  2個敵人被打倒，惡魔飛走


  被克xx（很雜魚）的遊戲管理員撿走


  宣布騎士馬拉松開始


  geats全假面騎士參戰


  反派（對手）是龍牙，夜騎，王蛇


  這段真的很驚訝


  終點由REVICE和geats通關


  管理員說只是預賽


  比賽變成假面騎士大逃殺


  成員有反派3人，revice,geats


  還有種子選手seeker


  夜騎把龍牙打倒，龍騎出現


  管理員互相pk，取回腰帶改寫遊戲


  變回正常DGP，名字為馴鹿遊戲


  之前淘汰的假面騎士復活


  geats用基礎型態打倒seeker


  拜斯還是消失了


  geats許下一輝不會忘記戰鬥記憶的願望


  壽司郎應該是工商，可能是之前新聞影響


  一定要來支持一下的





  劇場版我給98分


  --'
