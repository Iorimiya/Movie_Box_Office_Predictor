title: '[好雷] 九槍'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  也算是終於等到Catchplwy+上架，迅速加入片單，終於在週日補完的一部片。


  原本就知道會是不容易看的一部片，實際看下去，真的難。


  紀錄片用了四段（如果我沒有記錯）警員的錄影，看到第二段（最主要的一段）已經暈得

  我不得不暫停下來休息一下。第三段和第四段，努力撐著才把這片看完。


  暈眩的痛苦與片中移工的處境，讓這片成為近期最折磨的經驗。


  推薦我的朋友說這片觀點很節制，我同意他的看法。串流上，在字幕結束後，有小段導演

  的話（雖然字幕好像有一處錯誤，但不影響理解），正片之中，更多的是透過鏡頭與事件

  去呈現，讓這部片不糾結於案件本身與審判，而是從時間與制度的方面去觀察。即或不是

  非常深入，也是給了觀眾許多日常無法注意到的面向去了解整個移工在台灣的實況。


  中間一直在想那旁白是什麼，最後字幕說明是阮臉書上的文字。這個處理，也讓比較社會

  的案件，有一點心理上的側寫。移地生活，工作辛苦而環境充滿危險，藥物成癮（或是被

  控制），環境不友善等等，在他的文字中都可以感覺到那份憂鬱。



  ****


  這裡是我的樂園:




  --'
