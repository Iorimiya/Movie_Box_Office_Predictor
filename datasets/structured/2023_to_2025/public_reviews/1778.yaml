title: '[新聞] 九槍移工悲歌奪金馬 蔡崇隆邀觀眾挑戰自我'
content: "九槍移工悲歌奪金馬 蔡崇隆邀觀眾挑戰自我\n\n2023/08/30 05:30\n\n\n蔡崇隆喊話民眾進戲院看《九槍》挑戰自己。（瀚草文創提供）\n\
  \n〔記者鍾志均／台北報導〕導演蔡崇隆去年以《九槍》拿下金馬獎最佳紀錄片，該片聚焦\n移工悲歌，痛揭外勞阮國非在台流血至死的殘酷真相；昨在首映會上，蔡崇隆直言身為紀\n\
  錄片導演，不太在意票房，沒太大壓力，表示：「願意挑戰自我、挑戰導演的人，歡迎進\n戲院來看。」\n\n蔡崇隆說，很開心移工議題拿到金馬獎，是很大的肯定，「公民來看電影，有一定觀影人\n\
  數，產生影響力，能促使政治人物更加重視移工處境，甚至得在政策上表態，提出完整政\n策。」\n\n昨有許多紀錄片導演、影人前來站台支持，導演林正盛表示看電影時除了感動，也被影片\n\
  刺痛，呼籲大家不要帶「同溫層」來看，讓觀眾挑戰自己，再回過頭省思人性；導演李道\n明則大讚蔡崇隆此次拍攝策略大膽勇敢，很成功。《九槍》9月1日在台上映。\n\n\
  --\n佛教經典的\n是 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
