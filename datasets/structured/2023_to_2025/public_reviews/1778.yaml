title: '[好雷] 九槍 觀後心得 台灣人必看'
content: '觀影完後久久不能平復，原本很想好好思考沉澱再寫感想，

  但文筆不好，覺得趕快分享推薦讓更多人進戲院看片比較重要。


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  真心覺得每個台灣人都應該看《九槍》這部紀錄片，

  審視各種制度、系統性的問題，並好好反思/反省，盡快行動改善。


  其實從去年金馬影展看到相關介紹就覺得應該看了，只是覺得議題好沉重，沒

  有在第一時間搶影展票，而是等著上院線/串流，就一路等到現在。


  實際上也真覺得很痛心，看到密錄器播出片段，真心覺得整個過程匪夷所思，

  超級震驚、可怕又憤怒。

  雖然導演拍攝的目的不是要指責相關人員，是而指向背後制度、系統的缺失，

  但觀看當下的直接感受，就是要不是因為根本不把阮國非當人看，

  才會對全身赤裸、手無寸鐵、無直接攻擊性、語言不通的嫌犯豪不克制的開槍，

  又在之後冷血的任憑對方生命一點一滴的逝去。

  造成這悲劇，現場所有的人都有份，不僅是開槍的員警。

  只要有基本判斷能力、有眼睛，難道看不出中槍的人比鼻子受傷的更需要即時救治?


  片中一位受訪的員警說說很多人不了解開槍背後所代表的，

  因為在訓練場那就是靶紙上的一個洞，我整個問號。

  讓不了解生命脆弱和手上武器威力的人持槍，不等於合法讓不定時炸彈在路上走?



  雖然上面對員警沒好話，但我真的知道這不是全部警察的責任，

  以這個事件他就是那最後一根稻草，但背後的問題錯綜複雜。


  總之，不論個人想法、立場是什麼，這部紀錄片台灣人真的要看。


  --'
