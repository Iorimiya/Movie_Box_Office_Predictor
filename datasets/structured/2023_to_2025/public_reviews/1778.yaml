url: https://www.ptt.cc/bbs/movie/M.1693890277.A.4E7.html
title: '[好無雷] "九槍"無雷心得'
content: "很多人跟我一樣開始關切\"九槍\"這部電影，都是源自去年金馬獎的最佳紀錄片獲獎，\n尤其是同樣入圍的\"神人之家\"大獲好評卻被打敗之後，讓人不禁好奇\"\
  九槍\"的事件，查詢\n後卻發現相關資訊非常少，本來以為看完電影後能更了解事件前因後果，但卻發現更是一\n團迷霧，阮國非到底發生了什麼事導致他被報警？他到底做了什麼造成警察這麼大的反應\n\
  ？我們還是不會知道，只能看到感到憤怒的衝擊執法畫面，以及當場眾人的漠不關心，導\n演很成功的把這個議題拋了出來，事件前因後果已經不重要了，重要的是事件發生後大眾\n\
  的態度跟觀念，面對外籍勞工的優越感跟無視無所不在也理所當然，導演以並不煽情的手\n法紀錄著兩方的說法及相關機構的態度。\n\n    這部電影的觀影感受並不好，但完全可以理解他得獎的原因，這樣吃力不討好的主題\n\
  ，他以阮國非的事件作為軸心，進而延伸討論到外籍勞工引進的歷史，及歷年以來的新聞\n事件，電影本身沒有結論，但卻拋出了許多問題，看完之後的心情挺沉重也有點憤怒，因\n\
  為我自身對外籍勞工有好的經驗跟印象，所以比較能站在關懷外籍勞工的立場去思考，但\n看完電影後的討論可以發現，導演的想法能傳達給觀眾，引發對這個議題的重視跟省思，\n\
  以紀錄片的目的來說是很成功的，你不一定需要關心這個議題才來入場，移工早就已經是\n台灣必要也不可脫離的一部分，\"九槍\"講得其實不只是那九槍，如果你想更了解台灣的現\n\
  況，很推薦可以入場思考一下大部分人都忽視的台灣議題。\n\n\n--"
