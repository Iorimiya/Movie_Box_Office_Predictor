url: https://www.ptt.cc/bbs/movie/M.1677914598.A.D0C.html
title: 【負雷】九槍
content: '之前一直錯過九槍的特映

  今日總算在國影中心一睹去年金馬最佳紀錄片真容

  映後還有導演蔡崇隆與攝影盧盈良參加座談


  看完只能說是非常失望

  我給負雷不是網路上吵架的

  該站在移工阮國非那邊

  抑或是該力挺員警陳崇文的立場問題

  而是這部電影基本的劇情敘事、剪輯壓根就不及格

  近年只能拍出爛片的導演許鞍華

  由她擔任金馬59的評審團主席

  選出這部電影作為最佳紀錄長片

  足證許鞍華水準之低落超出我的想像

  頒給《九槍》還不如給盧盈良導演的《神人之家》

  雖然我也不喜歡《神人之家》

  但《神人之家》至少有做好一部電影的基本功

  那就是好好講一個故事

  而《九槍》就像是東拼西湊的雜燴

  能贏我只能揣測是靠議題取勝

  但去年金馬入圍影片的《塵默呼吸》《憂鬱之島》

  議題性也不輸《九槍》啊

  這真的是超級大冤案


  《九槍》整部片架構

  我的體感判斷

  講九槍案本身的大約才35%

  有10%是導演所謂的靈魂視角

  就是拍一堆空鏡頭畫面

  搭配朗誦阮國非生前的臉書抒情文字

  用以想像阮國非的靈魂遺留在人間飄蕩

  剩下55%則是各種移工在台灣的工傷意外

  造成台灣逃跑移工的系統性問題

  等等台灣對移工歧視性、不友善的根源


  所以觀眾到底該把這部電影的焦點擺在哪裡？

  從映後導演的話語來看

  他拍這部電影目的應該是那55%的部分

  希望喚醒觀眾關注移工議題

  所以我的觀影感受就是

  「那九槍案是在？？？」


  導演你要講移工問題

  你大可自己另外拍一部片

  相信導演手上影片素材很多

  但這部片不是叫《九槍》嗎？

  但我看完電影對於兩位主角阮國非、陳崇文

  還是非常陌生

  阮國非是怎麼從一個家人口中愛家

  從小幫忙貼補家用

  滿懷希望來台工作的合法移工

  淪落成逃逸移工？

  是勞動環境不好？

  還是同鄉勸誘？

  又為何會吸食毒品神智不清

  最後在溪邊被警察開槍打死？

  移工間的毒品傳播網路源頭在哪？

  我不是要導演代替警察自己去辦案

  但你好歹try try看啊

  除了家人的回憶以及臉書的文字

  在台灣就只能找到一個跟阮國非有接觸的人？

  不是說他是小工頭嗎？

  導演你都找不到其他移工來訪問？

  帶給觀眾的還是一個跟新聞報導一樣陌生的阮國非

  這超級失敗的

  失敗到讓我懷疑九槍案是不是只是導演借題發揮

  導演根本沒想關注阮國非這個人

  只是想藉此案來宣傳他的移工政策改革理念


  再講員警陳崇文

  導演在映後跟之前在網路發言一樣

  再次強調不是要批鬥陳崇文

  認為陳也是系統性缺失下的受害者

  那導演你怎麼找不到陳崇文本人來訪問？

  只能找到在法院替姪兒發聲的姑姑？

  陳崇文的員警訓練教育是如何產生？

  為何無法合理應對一個吸毒神智不清的移工？

  陳崇文在判決後的現實狀況如何？

  事後警察的教育訓練或臨場處置程序有改善嗎？

  這些無論是改革成功或者說狀況依舊

  好歹你要告知觀眾啊

  這些我都看不到耶


  我只看到一下漁業移工被毆打虐待

  一下鐵皮工寮火災燒死移工

  一下工安意外移工死亡

  這些議題很重要我知道

  但是跟《九槍》有什麼關係？

  一部電影連劇情焦點都沒抓好

  我真的只能給負雷

  沒錯

  紀錄片也是需要劇情的

  為什麼我覺得《神人之家》比《九槍》好

  就是因為至少《神人之家》有抓住

  從導演返家到父親過世的故事劇情線

  這只是電影的基本功

  紀錄片與劇情片只是截取素材的方式、來源不同

  說故事的方法還是一樣的


  映後導演說他不寄望政治人物能幫忙改善

  仲介以及移工自由換工作等議題

  希望靠公民力量覺醒

  只能說導演很天真

  你自己都知道移工沒選票

  政客幫忙沒利益

  那麼一般公民幫移工又有什麼利益？

  這世界本來就是利益驅動來運轉的

  左膠的問題不在左而在膠

  不談利益奢望靠理想來改革無疑是做夢

  沒有立委在立院幫忙修法？

  阮國非父親的律師邱顯智現在不就是立委？

  雇主、仲介、移工三方

  仲介制度只對仲介有利

  那麼導演與你所支持的人權團體

  不就應該給雇主利益來幫助改善移工嗎？

  我馬上就想到基本薪資本外勞脫鉤

  你們去跟資方談啊

  拿本外勞脫鉤來交換廢除仲介制度與移工自由換工作權

  這不比只想靠公民覺醒然後去施壓政客來改革快得多？

  交換一點東西來達成目的很合理吧


  對於導演希望靠這部電影來喚醒公民關注移工這件事

  我只能說完全無法看好


  --'
