url: https://www.ptt.cc/bbs/movie/M.1693789535.A.D8F.html
title: 'Re: [普雷] 《九槍》是什麼讓移工客死他鄉？'
content: '九槍的問題在於，導演有公開說"我就是有立場、就是站在移工這邊"。


  我是覺得這樣講明也不錯啦，比假清高假中立的唐福睿之類好一點，

  但問題是，有沒有人從反面的立場，也拍一部反駁他的影片呢?


  當一部影片變成為特定目的宣傳(Ex.意志的勝利)，

  這部影片拍再好，也還是會引發爭論吧?


  不過不管怎樣，真小人也比偽君子好就是了。


  --


  問題就在很多人質疑"是不是呈現事實".



  有人來報老鼠仔冤了耶.



  我是說跟偽君子比起來好太多了.


  這跟本板有什麼關係呢?


  順道一提，影像是死的，詮釋是活的，

  一種影像可以有多種詮釋，所以才會有立場問題。


  請問對襲警的人開槍，哪一點違法了?


  反正左派就是警察死掉最好吧，就像美國有些城市的左派一直想廢掉警察一樣。


  我只能說有些人報老鼠冤，一直在講別板的事情很好笑。

  你要連噓是你的事，我不覺得這樣是我的自由。


  反正我們看到的是有人悲憤連噓護航，這點我就不做評論了。'
