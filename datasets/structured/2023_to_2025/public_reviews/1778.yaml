url: https://www.ptt.cc/bbs/movie/M.1737266516.A.947.html
title: '[負雷]九槍'
content: '因為蔡導演本人問我"哪裡偏頗"，所以我一個一個把問題寫下來:


  1. 一開始講逃逸移工，這本身就是一個滑坡，

  因為不是每個逃逸移工都會拿刀砍警察，對吧?


  2. 警察喝止不聽還襲警，本來就可以開槍，

  難不成要等到警察被殺死，還要說警察不該開槍?


  3. 開槍沒有問題，結果卻計較"開這麼多槍"，

  本身就是一個迴避事實的討論...


  4. 邱顯智的說法也是推卸責任，一直說"你們可以跟法官說明這個問題"，

  但為什麼是警察家屬要"跟法官說明"?

  這沒有道理的。


  5. 就像警員家屬講的，你們刻意淡化了吸毒這件事；

  那個做工人把吸毒合理化了，說都是被人誘惑的，

  請問被人誘惑，就可以襲警嗎?


  6. 簡單說，我不否認移工問題是社會現象，

  但把移工問題跟阮國非這個案子連結在一起，本身其實是一種情緒勒索

  (順道一提，我也很討厭這個詞)；

  好像移工很可憐，所以阮國非就很可憐，但真的是這樣嗎?


  很多逃逸移工也沒有襲警，比方說最近抓到賣衣服的那些移工，

  她們有襲警嗎?


  7. 我覺得導演最大的問題就是，以偏概全。

  把一個刑案與社會現象做了連結，但這樣的連結本身卻很薄弱，

  這就是我說的"偏頗不公"。


  總之，我不認為這樣一部以偏概全的作品應該得到政府補助，

  特別是家屬的部分只占少數內容，其他大半都是辯護方和勞工團體的發言，

  這是不應該的。


  以上回答導演本人，也回答電影版的各位。


  (上面說我沒看完的，我真的花錢還看完了，沒意見吧?)

  --


  錯，這是偏頗的意識形態宣導片.


  "意志的勝利"也說自己只是紀錄片啊.


  不只，他還要搶警車，一直往警車裡面鑽...


  我確實覺得兩者沒有差距。


  我有貼上一篇到他的臉書，所以他才這樣問我的.


  闖紅燈的人如果撞警察，要不要開槍?



  抱歉，我不是草，請不要扣帽子.


  導演本人都問了，當然要看過才能好好回答他啊.


  找到一個活人沒有頭，就可以推翻所有活人都有頭的論點了.'
