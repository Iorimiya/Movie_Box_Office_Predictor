url: https://www.ptt.cc/bbs/movie/M.1693764310.A.DD8.html
title: '[普雷] 《九槍》是什麼讓移工客死他鄉？'
content: '身中九槍的移工，死亡背後是整個體制之惡


  台灣每年都有地方或國家舉辦的大大小小勞工影展，從過去台灣公司壓榨與老闆和職員的

  不對等性的探討，到如今關於女性、同志、跨性別在職場上的性別性向問題，還有原民勞

  工與外籍移工之間工作性質重疊的矛盾等，都逐漸有電影人慢慢將這些可能藏在台灣各處

  角落的故事，透過影視媒體傳達給大眾。這其中東南亞外籍移工的逃逸、黑工問題，又是

  非常受到媒體與台灣人關注的。


  紀錄片《九槍》是以2017年逃逸越南移工阮國非在溪邊因疑似偷車和毀壞民眾車輛，而被

  人通報警方，警員到場試圖喝止，對阮國非開了九槍，最終阮國非因為延誤就醫失血過多

  死亡。


  導演試圖用透過訪談親友和實際走訪去了解移工阮國非的足跡與了解在台的移工究竟遭受

  到什麼困境與台灣大量移工與雇主中間的那條線到底出了什麼問題？






  《九槍》是什麼電影：


  2013年，台灣饒舌歌手小人曾演唱以霸凌與被霸凌者為主題的歌曲《兇手不只一個》，透

  過時事新聞事件寫成歌詞去讓人反思，「到底是什麼讓我們的社會變得這麼冷漠？」裡面

  並沒有對錯的批判，也沒有絕對的答案。透過歌曲、歌詞多個視角的對象，讓我們想想是

  否在某方面我們也參與了霸凌、或是在一個時刻我們也變成了被霸凌與被社會冷漠壓垮的

  對象。


  這種感覺自己與社會格格不入，又往往求助無門的狀況下不只是在我們熟悉的社會，當我

  們隻身在異國，不管是求學也好或是工作，有些時候我們並不知道前往的這些地方有什麼

  在等待著我們。


  而反過來思考在這地球村的時代，台灣是否準備好接受世界各國的人到訪來這裡並不僅僅

  是旅遊或因為婚姻，在勞動力缺口下，需要外籍移工添補勞動的空缺，但我們社會是否有

  準備好面對各國勞工的需求在優缺中取得平衡？








  《九槍》紀錄片已2017年越南移工阮國非被台灣年輕警察開槍失血過多死亡，法院一審判

  決警察過失致死而造成社會熱議，之後阮國非的家人與警察的家人之間面對警方用槍時機

  、救援時間、職業道德，甚至移工阮國非逃逸外勞的身分都有多方不同的見解，直到雙方

  和解後，這起案件才在民眾與新聞媒體的眼中落幕，但是否移工議題有所重視？則不得而

  知。


  電影將警員的秘錄器公開，也收音當時警察開槍逮捕因游泳全身赤裸阮國非的狀況，還有

  現場人士在事件發生後都做了些什麼，而讓中槍的阮國非在超過半小時才被救護車送往醫

  院。


  並也藉由阮國非外勞被射殺的這事件，延伸探討台灣與東南亞各國關於國際移工雇用，中

  間商的問題，還有各項事件的延伸，看護、漁業、甚至科技廠房，這些跟台灣發展息息相

  關的產業鏈中，為何外籍移工參與卻總有地方出了差錯，產生問題。










  《九槍》分析與延伸：


  台灣其實從1991年就有開放東南亞外籍移工來台工作，最常來在台工作的國家移工有印尼

  、泰國、菲律賓、越南等，其中又以越南和印尼的移工在產業和社福方面佔最多數。一般

  媒體指的外籍移工多半是指藍領階層的工廠勞動者，而白領的老師、辦公室上班族和演藝

  人員一般都不包含在內，但在廣議上只要是國外人士來台工作者，應該都算是外籍移工。


  台灣平地人勞工許多不願意從事辛苦、危險的產業，早期是由原住民勞工代勞從事相關工

  作，但在原民教育水平提高、都市化甚至有了自己的觀光商業模式後，這些工作就轉由外

  籍移工代勞。


  但在90年代剛開放外籍移工來台時，也曾經發生過原住民工人認為政府引進外籍移工取代

  了他們這些人的就業機會，而有反彈，此外更多的是廉價勞動力之餘，台灣對於移工的歧

  視。









  開放外籍勞工台灣向來仰賴人力仲介公司引入。但其中直到現在最讓人詬病的是來台中間

  商收取的「高額仲介費」，許多來台工作的移工需要負擔3000元美金以上的高額的仲介費

  。而來台工作的金額也普遍低廉，有時候還會被以各種奇怪的名義剝削。而移工不能完全

  自由轉換雇主的法律規定也常常讓勞雇雙方造成摩擦，在2006年後修改，外籍移工能有三

  次轉換雇主的限制。


  過去台灣許多產業將外籍勞工當作免洗的勞動力，甚至在遠洋漁業和科技工廠有些資方甚

  至有限制自由與沒有完全的工作教育而成憾事。


  有工廠老闆表示很多時候移工的壓力不在雇主，而是在中間商鉅額的仲介費，2022的移工

  大遊行就有提出自由轉換雇主，與對於高額仲介費發出抗議。但因為不少台商企業從過去

  就須依賴東南亞的勞動力，如今許多也不以人力仲介，而是親自到當地招聘員工以降低移

  工來台的壓力與負擔。










  《九槍》值得一看嗎？


  電影《九槍》雖然是以越南移工阮國非的案件為出發點，但影片並非全然在探討此案，而

  是藉由阮國非之死，而帶出在台東南亞移工許多不合理與非人道的待遇。因老婆是越南人

  《九槍》導演蔡崇隆在電影訪談田調時可以比較全面的進入越南人來台工作的原因，和越

  南人跨海工作的軌跡。導演表示：「台灣對移工的歧視30年來並沒有太大變化，阮國非事

  件是極端總爆發。」


  我覺得電影雖然也有收入警方家屬不一樣的看法，但整體上還是從外籍移工的視角去切入

  ，《九槍》導演用了較多篇幅去敘述阮國非這個人，包括訪談他的家人、曾經的同事、與

  家屬的辯護律師。


  對於警察的視角並沒有太多的描述，只有零星的片段去呈現被告警察的觀點。整體而言這

  是一部較從外籍移工的角度去詮釋整體案件的始末，並且藉由阮國非被槍殺的事件，來敘

  述整體台灣在面對外籍移工還有許多問題尚待政府與社會許多人去一起解決。








  這部影片比較少提到關於阮國非的兩點是：一、他有攻擊民防使人受傷跟毀壞車輛甚至有

  想偷車逃逸，故友人通報警方以後警方開槍拘捕。二、在事件當下阮國非是否有使用毒品

  藥物或用藥史，在影片比較少去提到。


  在警察方面透過密錄器，電影有呈現出年輕警察並不把射中阮國非的出血當作一回事，連

  救護車都不是優先送走被槍擊中失血的他。我自己的猜測是認為警方以為沒有射中要害當

  事人並不會馬上死亡，加上阮國非扔石頭反擊而認為他還有「攻擊」的意識。


  如單以阮國非被開九槍這件事情來看，電影其實比較多還是偏向阮國非的立場去探討為何

  警察延誤送醫和對一個全裸的移工開到九槍的執法過當。而已年輕警察的立場則是認為他

  是在逮捕一個脫逃且有攻擊人的罪犯，而且不知道是否嗑藥而開槍拘捕。整體而言雙方是

  沒有共識，也不是在討論同個問題點上。故《九槍》更多的是探討會造成阮國非事件在台

  灣層層疊加起來的爆發，如同2013年國軍洪仲丘事件一樣，喚醒人對一個僵化體制的反思

  與改革。


  --

