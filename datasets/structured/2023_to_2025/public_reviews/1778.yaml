url: https://www.ptt.cc/bbs/movie/M.1694145378.A.211.html
title: '[普雷] 九槍'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~






























  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這是一部在講移工困境的紀錄片，如果對移工議題有興趣，其實可以花時間去看看報導者

  或其他移工權益團體的相關文章。電影本身有點太寫實沉重，進場前要做點心理準備；此

  外，紀錄片是有，也可以有立場的，應該說我本來就認為任何作品在拍攝的那一瞬間就有

  立場，所以如果抱持著紀錄片不應該有立場的信念進場看這部電影，可能會浮現不必要的

  過度聯想導致讓電影原本想說的事情失焦。


  不過我對電影採取的角度有些意見就是了。




  【以下涉及劇情，請斟酌閱讀】




  一段時間以來，因為有在收聽報導者、看一些他們的文章，所以對於片中提到的移工困境

  還算有一些很粗淺的了解，移工在台灣的生活很困難是無庸置疑的，市井小民如果想做點

  甚麼，大概就是最基本的少點歧視，台灣很多人看到移工跟很多美國白人看到黑人一樣，

  下意識就會覺得他們不安全，但其實他們也只是從國外來台灣工作的勞工而已，本質跟一

  般台灣人沒有不同。而如果是家裡有僱傭移工的、或是工作上會接觸到這些移工的人，大

  概就是盡量善待他們，大家都是出來工作的，沒必要弱弱相殘，靠著把別人踩在腳底來滿

  足自己的優越感。


  但回到電影，導演用很尖銳的角度將警員開九槍殺死移工阮國非的事件作為主軸貫串全片

  ，中間再點綴許多移工困境傳達導演想說的事情，我不確定這是不是一個好的敘事方式。

  的確開場強而有力，但事件本身存在太激烈的爭議，以至於電影很容易失焦。


  像我就完全偏離電影主題了。不得不說，在電影院裡看著整段密錄器所錄到的事件經過非

  常震撼，但也因為呈現的影像太完整，反而有太多聯想空間，以至於對中間岔出去的移工

  問題，因為並沒有偏離我先前的認知太多，我反而沒有這麼注意，而是都聚焦在導演一段

  段丟出來的密錄器影像，並且想著這起事件的意義。


  首先注意到的大概是稱謂吧。蠻有趣的，即便現在不斷地提倡改用移工稱呼這些東南亞來

  的外國勞工，但影片中他們照樣外勞外勞的叫。常常在想，改個稱呼真的有差別嗎？對我

  們來說，彼此都心知肚明任何代名詞都是在指稱同一群人，如果最基礎的態度不改變，只

  改名詞就能達到所謂的族群去汙名化嗎？這還不只是外勞與移工的差別，一直以來，台客

  、8+9、宅男，各種代名詞只是想凸顯某些特定族群，來象徵我和那群人不一樣，但如果

  忽略這種我懷疑根本內建在人類基因中的差別待遇因子，那換換名詞到最後也只是滿足又

  一個族群對他們眼中「會歧視人的族群」的另一種歧視、一種自我滿足而已。


  再來是人類生命力的頑強。阮國非被打了九槍，影片沒辦法呈現他的意識到底多清楚，但

  銀幕上看到的是一個人不斷地掙扎想要反擊，試圖用石頭反抗武力比他強大很多的力量，

  即使任何人來看都知道是徒勞無功，我是認真驚訝於他逃跑抵抗的決心有這麼強烈，影片

  看來他支撐了非常久，至少遠超過一般對中槍昏迷、迅速送醫的想像時間，在這樣奇妙的

  場合看見人類的堅韌，讓我覺得無言以對。


  而密錄器的詳盡反倒凸顯了許多程序上的問題，以及紀錄片角度的矛盾感。紀錄片從警員

  說著「他再上來我要開槍了」開始，鋪陳一個警員早就準備好要開槍的印象，而這樣一段

  立場太鮮明的真實記錄，反倒讓後面看似想要平衡報導所剪進去的家屬、警界言論太違和

  ，說嚴重一點甚至會讓人覺得是導演的諷刺。


  此外看著阮國非在地上掙扎的場景，對應警方遲遲沒有上前上銬的處置，再加上第一台救

  護車來之後警方所做的處置居然是先讓鼻子被打傷的民防人員送醫，而放置身中九槍的移

  工在地上繼續掙扎，支援警力抵達時也沒有相應處置，等到第二台救護車抵達才開始上銬

  並送醫。這一幕說實在不管是誰來看都充滿爭議性。周圍看起來有四五個民防人員，加警

  員本身一人，難道真的無法制服一個身中數槍的傷患嗎？而救護人員抵達，難道在場都沒

  有人分辨得出一個身中九槍的傷者跟一個流鼻血的傷者，哪個看起來比較需要送醫嗎？


  說回來或許都能用一句「站著說話不腰疼」帶過，移工不要掙扎不就不會被開槍了；被開

  槍不要掙扎不就會趕快送醫了；警員難道介於警棍到槍之間沒有其他反制手段嗎；難道這

  麼多人制伏不了阮國非嗎；怎麼沒有先送醫？而現場的狀況我們看到的只是影像，但無法

  體會的是在場個人的心理狀態，觀眾終究只能被動地從銀幕上接收創作者所呈現的一切，

  再根據每個人自己的生命經驗去形塑整個事件的內容（但我還是覺得用腳去撥弄、壓制地

  上的移工很瞎，即使那可能是看片過程中被激起的情緒）。


  只是更進一步去想，最後被判刑的是警員陳崇文，判刑八月，緩刑三年，但追根究柢，整

  起事件中我們看見這麼多制度上的問題與缺漏，而這些匯集而成的過失最後卻要由一位警

  員用一生清譽來承擔，這樣是對的嗎？


  --'
