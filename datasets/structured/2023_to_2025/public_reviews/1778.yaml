url: https://www.ptt.cc/bbs/movie/M.1693073052.A.1F1.html
title: '[ 好雷] 九槍觀後感'
content: '無雷心得


  觀影時間：2023年08月26日1700分

  觀影場地：京站威秀

  票券取得方式：嘖嘖贊助


  這部電影是關於越南青年阮國非，為早日還債而淪為「逃跑移工」，努力工作期待衣錦還鄉

  。不料，2017年某日，阮國非在偏僻河邊被舉報意圖竊車，遭警察連開九槍，延誤送醫後身

  亡的故事。


  輿論一面支持警方執法，一連串謎團卻在事件後逐一浮現。為什麼一名菜鳥警察要對赤裸的

  移工連開九槍？在槍響之前，又是哪些力量，迫使他成為一個命如草芥的逃跑移工？殺死他

  的，真的只是那九發子彈嗎？


  （上述內容轉自臺北金馬影展介紹）


  如果只看上面的介紹，會以為這部影片是針對阮國非遭到連開九槍過世的故事。 然而實際

  觀影過後，才知道這部紀錄片其實不只探討阮國非事件，它還針對外籍看護、工地藍領勞工

  、漁船移工等處境進行拍攝與探討。


  簡單來說，這部紀錄片包含了拘捕密錄畫面、受害家屬訪談、歷年移工公傷報導交錯，試圖

  梳理制度面的共犯結構。


  其中密錄器的畫面僅用震驚兩字已無法形容我觀影後的心情，一件悲劇的對錯也不是這麼容

  易用三言兩語道清。 推薦給幾種人進場觀影：關注人權議題、家裡有請外籍看護、覺得移

  工很可怕、質疑政府為什麼沒有好好抓外籍移工的 你／妳 進場觀影。





  雷文防雷資訊頁

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  先說結論，本人是軍事人員，觀影過程中已可以默背出以下用槍時機與用槍要領條文（同行

  友人可以作證，我覺得沒很難，不過我背誦的開頭是：當群所因要、如經使如武）。


  用槍時機：


  1.受暴行脅迫，非使用武器不能抵抗或自衛時。


  2.群眾暴動，非使用武器不能鎮壓時。


  3.對所警衛之人員、物資、處所受危害脅迫，非使用武器不能保護時。


  4.對警衛之土地、場所建築物受襲擾或擅闖經警告仍不聽從，非使用武器不能制止時。


  5.要犯逃脫，非使用武器不能制止時。



  用槍要領：


  1.如非情勢異常急迫，應先口頭警告並對空鳴槍警告之。


  2.經警告後已有畏服之情況時應立即停止使用。


  3.使用武器應注意，勿傷及他人。


  4.如非情勢確有必要應儘量避免傷及其致命部位。


  5.武器使用後，應將經過情形即時報告該營長官。


  我不知道警方有沒有教這個，如果以軍方的標準來說，該名員警絕對違反用槍的規定。 從

  影片中可以清楚看到，由於阮國非在被指控前在過河游泳，因此是沒有穿衣服，全身赤裸的

  狀態，什麼意思？  就是這個人身上沒有武器。 當時阮國非可能確實有吸毒或是精神恍惚

  的狀態，但是這不應該是開槍的理由，更遑論在未對空鳴槍、在情勢絕對沒有必要的情況下

  一連開了九槍，救護車到了之後不救他，而在流鼻血的警員與身中九槍倒在地板流血抽搐的

  移工之間選擇員警。 周邊圍了快十個人沒一個上前上銬幫他止血，還把他放在路邊看他死

  前的掙扎抖動，硬是多等了二十分鐘（應該是，電影院沒確認清楚）延誤就醫。

  我只能說真的很扯，真的很讓人痛心。 但你知道最讓人痛心的是什麼嗎？


  是整個過程中所有人把移工當成一個“客體”，而非‘’人‘’，最讓人痛心的是這個社會

  對此並不在意。




  殺死移工的不是員警，該員警據瞭解也已經離開職場，也請不要去責備或是輿論霸凌員警，

  因為那是整個社會的冷漠造就集體的無意識。



  你知道嗎？ 目前在台的外籍移工高達七十萬人。

  片中談到了外籍移工大遊行，最主要的訴求就是廢除仲介制度改採 G to G （政府對政府）

  ，就是要廢除黑心的仲介制度。 如果仔細研究過外籍移工的法令就會知道，現行的法規對

  移工不利、對雇主不見得有利（請不到人、缺工、被抽仲介費）、極度偏袒仲介公司。


  映後座談時，導演分享，不是所有的仲介公司都是爛公司，只是好的公司的確比較少。 而

  仲介公司區分境外（例如越南、印尼）與臺灣境內的仲介，無論有無提供服務，除了一開始

  兩國的仲介公司會分別跟協助媒合並辦理入境的移工收取十來萬外，每個月還會從勞工的薪

  水中抽取一千多元不等的佣金。 另一方面刻扣工資、超時勞動也時有所聞，據本人跟有在

  請外籍看護的親戚瞭解，就有提到若是看護“不乖”他們會請仲介公司找人“教育”他幾天

  ，教育完就會怕就會乖了。 除了上述問題外，外勞一開始也不能更換雇主（後修法，已可

  以更換，只需要給仲介公司幾萬元即可），也因此加劇出現所謂逃逸外勞的問題。


  而逃逸外勞往往由工頭組成日領日結的工地工班，也由此出現不肖藥頭（臺灣籍和外籍皆有

  ）利用毒品控制工人的情況。 而工作獲得的微薄收入再轉而從販售毒品中流出，變成一個

  死局。




  高速公路、高鐵、北捷、高捷和許多大大小小建設開通或落成都少不了移工辛勞的付出，他

  們是人，不是奴隸。



  映後座談，我問蔡導演，為什麼不多放一些關於救護人員、家屬、報警民眾之類的訪談內容

  ？

  導演說，他說若是把過多的篇幅放在討論這個議題，會導致整著紀錄片的比重偏重於阮國非

  案過多，而過於執著這個案件中的誰是誰非，容易使這部紀錄片被當成“極端個案”。 而

  把這部紀錄片看完的觀眾去把所有的錯誤歸咎在某個特定的人身上，也是導演所不樂見的。


  因為，逃逸移工的議題是現在正在面對的結構困境，是一種日常，討論個案對整體的局勢沒

  有太大幫助。 臺灣是民主國家，但是移工朋友沒有選票，如果公民（選民）不在意移工他

  們的權益，那麼代議士也不會有動機推動相關議題。


  「我沒有說人們有必要瞭解千里之外的事情，而我的選擇是將這些事情帶到你的眼前。」


  如果人們關心烏俄戰爭中戰火下人們辛苦的議題，那麼移工的問題更應該值得我們關注。


  我認為這是一部令我很有收穫的電影，移工議題值得並且應該得到臺灣人的關注。'
