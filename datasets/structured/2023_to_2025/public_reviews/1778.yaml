url: https://www.ptt.cc/bbs/movie/M.1694879814.A.040.html
title: '[算好雷] 九槍–真相的鄉愿 '
content: '已上映兩周

  去年金馬獎最佳紀錄片







  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  對於《九槍》替移工發聲沒有太多意見，確實也在紀錄片中節錄的新聞片段，看到多年來

  台灣的東南亞移工貢獻勞力完成各項大至工程建設、小至個人家務，卻沒有反應待遇上的

  各種根深蒂固的沈屙弊病，不只是社會問題，也是政治問題，更是國際問題（諸如此類的

  不平等待遇 在韓國電影的移工處境也如此似曾相識）。我也同意去年金馬獎頒給《九槍

  》最佳紀錄片的作為發聲管道。



  觀影過程中期待密錄器的真相，親眼看到密錄器影片對於移工的不尊重（如辯護律師說的

  如喪屍不敢靠近，已非嘲諷的問題，而是對於移工的偏見），用槍程序與後續的處理，完

  全看到一個無辜生命被一點一滴的流逝的置之不理才導致後來送醫不治的結果。



  但回過頭來，期待密錄器真相代表對與錯的道德律法框架，以及紀錄片刻意製造回到案發

  地點的「詩意影像」和死者過往日記的口白，似乎用來增加感傷與可憐 ，並且交叉配置

  （蒙太奇）著家屬訪談的「資訊」，大致上說死者是一位很乖的小孩，如此並置有一種「

  詭異」的感覺。



  《九槍》除了上述「實質」層面之外，自己更在意美學層面涉及道德和政治性問題，更是

  因為紀錄片使用了密錄器，這個幾乎可以完全當作真相的東西。像是命定了道德正確的死

  局，彰顯了美學上對於密錄器的無力感 ，（難不成要很白目地把如此證據很脫序地當作

  實驗影像素材？）正義申張是法律任務，背後隱含制度改善的問題，而詩意化影像像是為

  了正義交織而成悼念情緒，美學上的鄉愿。



  於是區辨善惡的真相，知道不平等對待的真相而產生「同情」，更透過死者過往的浪漫共

  感的更加的哀傷，就如同去參加親戚告別式，司儀念著充滿感恩的生平對於死去人地弔念

  ，那有好什麼抗拒的嗎？



  --


  拉特飯 - 以商業力量進入獨立市場

  (剛搬家內裝待修)


  --'
