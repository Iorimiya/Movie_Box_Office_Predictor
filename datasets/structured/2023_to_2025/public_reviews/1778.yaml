title: '[好雷]＜引爆點＞劇情與三一九槍擊案的相似性'
content: '內有爆雷請慎入….

  .

  .

  .

  .

  .

  .

  .

  .

  我看版上大家對劇本評價正反不一，今天看完電影後查了本片劇本，發現原來的劇本是＜阿

  海＞。或許阿海才是這部片裡面最關鍵的人物。阿海是徐詣帆飾演，就是＜賽德克＞裡面的

  花岡一郎，在看電影時候其實沒有認出來。阿海在開場就以自焚的屍體出現，進而引出了男

  主角吳慷仁在解剖的時候的種種疑慮


  這時候就要先講到台灣歷史上的懸案，莫過於2004陳水扁大選前的兩個子彈。三一九槍擊案

  無疑是陳水扁的選情救星，這引起民眾群情激憤，也是讓民進黨再度連任的關鍵。但關鍵人

  物陳義雄卻在3月29日身亡，由於是溺斃因此難以確定是他殺或自殺，這不就與阿海在一開

  始吳慷仁解剖時提出的疑慮相似！究竟這個案子是民進黨自導自演，還是國民黨派人暗殺，

  這件事情還請到李昌鈺親自出馬進行鑑識研究，而最後李昌鈺最終提出的鑑識報告中，藍綠

  有不同的解讀，也造成了台灣至今未了的懸案。


  在兩年後，陳義雄的妻兒召開記者會，公開認定要為陳義雄翻案，認為陳義雄是他殺，與其

  在一年前坦承認為陳義雄就是槍手的說法當相逕庭。順帶一題，當年主導案件偵辦的刑事局

  局長，就是侯友宜。


  引爆點本身也是藉由妻兒出來申冤阿海是他殺，所帶來複雜的黑吃黑劇情。最後劇情才曝光

  說阿海其實是他殺，而且是一直以來參與反對通聯石化的魏林昆給予最後一擊，也就是”自

  己人幹的”。


  究竟引爆點的懸疑劇情是否有影射任何台灣的政治懸案，推薦大家觀影後各自解讀。畢竟我

  認為引爆點絕對不只有用沿海石化汙染的議題為背景，還有上面提到的三一九槍擊案。這些

  財團、政商勾結禍害台灣的真相為何？又是誰主導？也許到今天我們已經無法得知結果。但

  我想法醫吳慷仁在重重壓力下堅持找出真相的精神，也是導演想要表達的核心概念。就是不

  論環境或體制如何影響我們的生活，我們都必須勇於為自己的理念抗爭，否則就會被人所影

  響操控，最終成為一個隨波逐流，沒有靈魂的人


  --'
