url: https://www.ptt.cc/bbs/movie/M.1737253047.A.9E1.html
title: '[討論] "九槍"導演抗議刪除預算...'
content: '剛剛看到但唐謨轉貼"九槍"抗議陳玉珍刪預算的事，

  忍不住跑去問了這個問題(有可能會被封鎖):


  很多人都認為"九槍"是一部偏頗不公的片子，

  為什麼一部偏頗不公的片子可以拿國家補助呢?


  我也不太懂這個道理，所以問一下大家，為什麼擺明了偏頗的片子也能拿到補助?


  --


  請翻本板前面的討論，還有導演自己也說"我就是要偏袒移工"了。


  我只是另外提一下，那我把那句刪掉好了.


  您是說蔡帶風向還是說我?


  我沒有要帶風向，只是提出質疑而已.


