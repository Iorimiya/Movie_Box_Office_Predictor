url: https://www.ptt.cc/bbs/movie/M.1668313183.A.ADC.html
title: '[普好雷] 《九槍》，不只是那九發子彈。'
content: '部落格版：


  2017年8月31日，越南逃逸移工阮國非遭人舉報打破新竹縣鳳山溪旁的小貨車車窗欲偷車

  ，員警陳崇文等人到場後要求赤身裸體、坐在小貨車前座的阮國非配合調查，然而阮國非

  非但不願意配合，更跳下車朝著警方扔擲石頭抵抗，在雙方對峙過程中警方試圖以警棍、

  辣椒水進行反制，但仍然無法制伏阮國非。後來據日後陳崇文出庭時回述經歷時稱，當時

  擔任警察不到兩年時間，幾十次追捕逃逸移工的任務中，遇到的每個移工都會逃跑，從未

  遇過像阮國非這樣不僅未逃跑、還意圖攻擊警察的移工，而在嘗試溝通未果後，本看著阮

  國非跳入水溝便不想繼續追捕，豈料阮國非又再度爬上岸並和警方對峙近約三十分鐘，最

  後陳崇文看著阮國非走向警察且想開門上車，認為其有偷警警車逃逸之虞，於是選擇拔槍

  朝其射擊，在短短十一秒內擊中阮國非多達九槍，其中六槍自背後射擊，另外三槍則朝其

  身體左側開槍，在阮國非倒地不起後十二分鐘陳崇文與支援警力才將他上銬，只是在上銬

  之前因判斷他仍具有攻擊性與危險性所以沒有上前壓制或是急救，後待救護人員到場進行

  約25分鐘的急救處理，阮國非仍在抵達東元醫院之前失去生命跡象。


  阮國非一案很快的引發社會關注，陳崇文的執法是否合理亦或過當造成爭議。在與來台處

  理後事的阮國非家屬雖已260萬達成民事和解，陳崇文請求判三月以下有期徒刑、宣告緩

  刑，但於審理中檢察官認為陳崇文不認罪，顯示其對使用致命性武力可能對生命造成的危

  害，仍然欠缺認識與反省，更指出陳崇文身為合格結訓的警察人員，應該熟悉用槍時機的

  必要性，不能以資歷淺為理由推託，且據相關檢驗證明顯示，當時阮國非體內已含有高濃

  度酒精與吸食甲基安非他命反應，認為阮國非應無攻擊還手之力，而陳崇文雖然依法用槍

  可使用過當，其開槍時機與方式均不符合警械使用條例避免傷及致命部位規定與比例原則

  要求，因此依涉法過失致死罪判處八個月徒刑，惟考量陳崇文是新手員警判斷失準，加上

  符合自首要件為由，予以緩刑三年，全案定讞。


  這起案件意外延伸了許多辯論議題與思考空間，而其中最為重要的是如阮國非這樣來自東

  南亞的在台移工相關議題。曾憑紀錄片《街舞狂潮》獲得金馬獎最佳紀錄片肯定的導演蘇

  哲賢，將阮國非案改編為短片《九發子彈》，他在專訪中提到自己對於此事的論點，認為

  「殺死阮國非的，不是那九發子彈，而是我們的意識形態。」，意即是存在於台灣人潛在

  意識裡的歧視允許了陳崇文開槍，「如果阿非是一個金毛的外國人，你會射他嗎？」，這

  是《九發子彈》中主角阿非的義務律師質問開槍員警的話，也是真實事件裡擔任阮國非家

  屬律師的邱顯智曾問過陳崇文的問題，導演蘇哲賢認為如果今天是白人那麼結果可能就不

  一樣了。當然這樣的假設並非全然公允，但導演蘇哲賢的論點確實不失為一個可能的解釋

  ，而順著《九發子彈》再切入《九槍》，從阮國非案再延伸到其他東南亞移工新聞，看著

  這些移工們的在台處境，似乎也不得不去相信這之間存在著建立在優越感之上的歧視，進

  而造成了或是引發了這些新聞悲劇。


  《九槍》為曾在《徐自強的練習題》中擔任製片的導演蔡崇隆的作品，與《九發子彈》同

  樣以阮國非案件為題材，只是比起《九發子彈》、作為紀錄片的《九槍》有了更多的篇幅

  再談延伸議題。導演蔡崇隆在前半段幾乎是談論阮國非事件的始末與後續影響，以律師、

  警方、阮國非家屬與陳崇文家屬的多方視角來共同審理這起案件，電影藉著這些受訪者的

  立場、觀點、專業、身分的各自不同進行了一場不激烈可卻感受很多、感觸很深的辯論。

  我想確實沒有人能夠直接且清楚的指出這起事件中到底誰錯誰對，就如同每件事情總是一

  體兩面，雙方當下的想法與行為都只能各自解讀，但我想沒人能否認的是，阮國非和陳崇

  文在某種意義上其實都是受害者，阮國非的不幸離世與陳崇文的遭到判刑，都直直道出了

  不該被無視的根本問題。



  先從身為員警的陳崇文方來看，在網路上都能找到他在接受新竹地院審理時與檢察官的對

  話內容，面對執法過當、開槍時機是否正確等質疑，聽著他的回應多少能感受到他的無奈

  ，不開槍賠命、若開槍就賠錢的進退兩難，現有制度跟保障不足以支持警察開槍的後果，

  加上輿論施加的壓力，讓不論開槍這個結果是好是壞，都成為警察難以背負的責任，而這

  就是陳崇文所面臨到的、也是我認為他不認罪的理由之一。不過畢竟就如《九發子彈》一

  樣，導演蔡崇隆既然以《九槍》為名，就表示他選擇把更多的重心與議題放在阮國非身上

  ，而從故事走到後半段，關於移工的各個公傷報導出現在銀幕上，便可知道與其特意去質

  疑或是檢討陳崇文，他更想關注的其實就與導演蘇哲賢相同，從這起案件來去向社會拋出

  疑問、到底真正殺死阮國非的，當真只是那九發子彈？


  猶記去年鬧得沸沸揚揚的，有起出門倒垃圾的外籍女看護，站在路邊講手機時遭到員警盤

  查，卻因忘記帶居留證出門而被認為是逃逸移工，而員警並不理會這名女看護的解釋，硬

  是將人帶回警局盤查，最後查到外籍女看護為合法看護後，不僅沒有任何一句道歉，還將

  人載到路邊丟包，讓人生地不熟的女看護茫然失措。離譜行徑遭到舉報後果不其然引發民

  眾撻伐，這名員警最後遭到記過處分、調整職務，還因涉嫌妨礙自由罪等罪嫌移請地檢署

  偵訊。雖然《九槍》沒有把這起案件放入電影中，而是放入多起移工因工作環境、安全、

  勞資、聘雇制度等方面有關而造成的意外、悲劇新聞交錯於電影裡，但我認為《九槍》未

  有明講、而是要觀眾自己去思考、去察覺的，還是長久以來台灣社會對東南亞移工的歧見

  、不友善還有污名化。


  「如果有一天我在人生的路途上跌倒了，媽媽請原諒我。」


  上述新聞事件裡的各種問題回到根本來看，是不是多數台灣人自認比這些來台工作的東南

  亞移工還高人一等的心態所致？「因為是移工所以不用住太好、當然待遇也不用太好」、

  「因為是移工所以要盯好以免他們逃跑」、「因為是移工所以要小心他們偷錢」...，太

  多的「因為...所以...」被默許成立，這才導致了制度上的推行改動困難，而移工們從生

  活到工作環境到待遇亦才難以變得更好。回到前面提到過的，如果今天阮國非是白人、站

  在路邊講電話的是白人，那麼這樣的「因為...所以...」還會成立嗎？我想不會。而我想

  這也是《九發子彈》與《九槍》所試圖提出的、對從整個社會到制度面的共犯結構的指控

  。


  《九槍》令人感到痛心的，絕對是被放入電影中，那段阮國非與陳崇文對峙的秘錄器畫面

  ，也是因為有了這段秘錄器畫面更讓《九槍》多了份實質上的意義與帶給觀眾更多的震撼

  。另外喜歡的是，導演蔡崇隆以阮國非的臉書作為旁白，聽著他訴說自己的心境，再將之

  與影像畫面結合，那種無能為力的惆悵增幅不少。導演蔡崇隆不進行特定對象的批判，而

  是以多篇新聞報導再加上多位受訪者所分享的自身想法，讓《九槍》有了足夠空間來讓觀

  眾針對被帶出來的議題思考，它無疑有著它出現在此刻的意義，也確實有著它入圍金馬獎

  最佳紀錄片的實力，不過相對於其他入圍作品，我覺得《九槍》的競爭力沒那麼大，以阮

  國非案件來放大看整個在台的移工處境本意是好，但難免會讓人有種主角失焦的恍神，尤

  其是電影從前半段轉入後半段時的處理不夠流暢，導致前半段與後半段像是不同的紀錄片

  接在一起，這是我在觀影上的感受，但不論會不會得獎，從議題上來看的話，《九槍》確

  實值得你我好好關注。


  --'
