title: '[情報] 金馬59最佳記錄片《九槍》未來上映方式'
content: '各位電影板板友大家晚安

  猶豫了很久到底要怎麼po文講這件事

  也前後看了好幾次板規，因此遣詞用字特別謹慎

  若真有觸犯到板規還請不吝告知

  畢竟《九槍》這部片雖有爭議，但也是去年金馬59的最佳記錄片

  我認為還是值得向板友講一下到底《九槍》之後要怎麼上映


  小弟由於本身認識《九槍》導演蔡崇隆老師

  去年就曾經受邀看過這部片的試映，看完大為震驚

  因為沒想到蔡導一刀不剪的把員警開槍射殺逃逸移工的完整密錄器影片放進去

  那天看完後內心非常糾結，但也知道《九槍》會讓社會激起很大的正反討論

  於是有詢問蔡導這部片何時上院線或串流平台？


  然而蔡導考慮的比大家想像的更多，他坦承這部片的性質很特殊

  如果只是單純上院線或串流平台、而沒有其他配套措施的話

  觀眾看完後很容易陷入「挺警察 VS 挺移工」的二元對立思考

  然後就會吵成一團，這場面他們在試映時看過非常多次

  反而無法深思影片後半段想探究的社會結構問題

  因此蔡導去年給我的回覆是「不會走傳統的放映管道，會用其他方式上映」


  過了幾個月後，蔡導終於端出了他深思熟慮的群眾募資放映計劃

  簡單講就是：


  透過群眾募資讓《九槍》優先進入全台各地的高中職校園放映

  當然會剪接成適合高中生心智年齡的版本，並同步搭配設計好的教案提供給老師

  （教案將委託台灣放伴教育協會製作）

  讓老師可以根據教案在課堂上與學生討論《九槍》呈現的外籍移工及警察雙方困境

  （108課綱本身就規定中學課本要納入外籍移工相關內容，因此這種作法是可行的）

  而願意贊助計劃的人，則可以獲得在戲院特映場觀看《九槍》完整正片的席位

  您的名字也會列在教案的感謝名單內


  說實在以《九槍》這種金馬得獎片外加爭議程度

  如果直接上院線或是上串流平台，豈不是可以更快回本，幹麻搞超麻煩的群眾募資

  可能蔡導本身也有老師身份吧，對於促進台灣社會的族裔共榮，他之前做了很多努力

  剛好最近中一中爆發「烯環鈉」（死番仔）事件

  讓我非常感慨，連語言相通的原住民，都會遭遇這種很要不得的歧視事件了

  語言不通的越/印/泰/菲外籍移工，他們扛下台灣各地大部份的苦、累、危工作

  然而整個社會上上下下願意敞開心胸去認識了解他們的人有多少呢？


  目前《九槍》的群眾募資計劃已經在他們的FB粉專貼出來

  怕違反板規我就不貼連結了，有興趣的請自行搜尋

  然後他們採用的方式是以學校為單位，也就是讓每位贊助者認領一間高中職

  你贊助的時候可以指定要把影片跟教案送進哪一間高中職，他們會在明年接洽送過去

  至於要指定送哪間高中職就隨個人自由（當然已經有人認領過的就不能再認領了）

  可以是您自己的母校、或是您當年暗戀對象的學校、或是您小孩的學校

  《九槍》群眾募資頁面有列出全台灣的高中職名單，已經有人認領的學校會標出來

  有趣的是上述提到的中一中倒是很早就有人認領了

  （我自己也搶先認領了高中母校 XD）


  以上是小弟約略對《九槍》未來上映方式所做的介紹

  我自己的感想是無論你喜不喜歡這部片、喜不喜歡這個題材

  都值得好好看一下《九槍》的完整內容以及它想傳達的東西

  就算看完後非常不喜歡，跑來電影板大噴特噴

  我覺得蔡導還是非常樂見這種情況

  有討論才有碰撞，有碰撞才能激起火花

  有火花才有機會將社會往比較好的方向帶過去


  --

  喂  我叫阿蘇

  964班

  巨蟹座  O型

  棒球隊 自強九舍

  我是超級大壞人喔


  --

  您誤會了吧？課本有課本的內容，九槍電影跟額外設計的教案是送進校園當延伸教材

  整件事跟教育部沒啥關係，幹麻噓那麼快

  這是[情報]又不是[心得]... 我只是來分享這部片未來的上映方式而已

  我只能說既然這部片是蔡導的作品，他想用什麼方式上映就尊重他囉

  如果直接贊助認領學校就有包含特映場觀影了

  如果不想認領學校的話 九槍的群眾募資頁面有單獨特映觀影的選項 比較便宜'
