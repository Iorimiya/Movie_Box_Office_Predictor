content: '我剛剛提了一個問題:


  在電影史上有一部公認的好片"意志的勝利"，

  這部片大家都說拍攝技巧超棒，但意識形態完全就是為納粹宣傳，

  那這種片領取補助，是應該的嗎?


  如果說電影只看好壞、不看立場，

  那"意志的勝利"毫無疑問是好片，但這種片值得鼓勵嗎?


  這是我的問題。


  --


  我看完了，怎樣?



  所以你贊成幫納粹宣傳?


  "與惡"。


  宣言殺人犯很可憐應該免死啊.


  不過我也可以反嗆你，"意志的勝利也沒有宣揚種族屠殺啊!"'
