url: https://www.ptt.cc/bbs/movie/M.1627353636.A.5D3.html
title: '[開箱] 日版 怪談比留子 ヒルコ妖怪ハンター BD'
content: '網誌圖文一樣偷懶版：





  日文原名：ヒルコ妖怪ハンター

  中文譯名：怪談比留子

  英文譯名：Hiruko The Goblin


  這部應該是很多人童年的陰影、對蜘蛛恐懼的起點

  這樣的知名大作我想應該不用多作介紹了XD


  日本在前幾天發行了30周年紀念版藍光BD

  昨天晚上去光華買東西時在利得架上看到就秒速買了下來XD




  這部作品是改編自諸星大二郎的同名漫畫作品《妖怪ハンター》

  主要是以「黒い探求者」參雜了幾部短篇的要素加以融合改編

  並由《鐵男》鬼才導演塚本晋也執導、澤田研二、竹中直人等出演


  當然以現在的角度來看，片中很多特效部分並不是非常的好

  但是就氣氛營造上真的是數一數二的等級




  月島在湖面上唱歌、彈鋼琴、還有最後結尾那段

  在氣氛上真的是表現得可圈可點，就算是現在看也是很不錯的

  當然借鑒了《鬼玩人》跟《突變第三型》的部分也加強了氣氛就是XD


  真希望台灣有代理商願意將這部代理進來上戲院

  不過目前疫情嚴峻，應該是挺有難度的XD




  在畫質修復上雖說只是2K修復，但我覺得在畫面表現上挺不錯的

  而且這樣子的修復也算是別有一番風味，保留了部分回憶中的美好

  畫質部分可以參考一下松竹官方頻道上放的比較影片


  音效部分則是原始的LPCM 2.0，比較可惜的是完全沒字幕Orz


  底下來簡單開箱：






  以上！


  --








  --'
