url: https://www.ptt.cc/bbs/movie/M.1678903955.A.3FB.html
title: '[普雷] 有點像惡搞片的怪談比留子 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  我本身熱愛日本鬼片

  唯一缺席的就是怪談比留子

  即便出國回來很累

  我還是衝去看

  我是在台中新時代的威秀

  看晚間9點20分的

  現場大約十個人吧


  我覺得前後段拍的很好

  不管是音樂或者情感的講述

  有一點讓我想起 "與異人們共處的夏天"


  可是扣掉前後的精緻

  其他部分很像在惡搞

  我不覺得是30年前的技術讓我覺得像惡搞

  因為不管是配樂跟劇情，都有滿滿的惡搞感


  我承認他有些妝容，還有可怕的情節都讓人驚艷

  是現在的鬼片做不到的

  但是不恐怖跟惡搞是不同的


  中間就像是換導演一樣，配樂也變得很粗糙

  簡單來說我覺得很像很恐怖的劇情拍成搞笑片

  給我這樣的感覺



  然後我發現奇摩電影分類也是歸在恐怖/喜劇

  所以是故意的嗎?


  總之，劇情不錯，恐怖情節也夠，

  但拍的不恐怖



  --'
