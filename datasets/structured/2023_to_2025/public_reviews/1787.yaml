url: https://www.ptt.cc/bbs/movie/M.1672398550.A.C9F.html
title: '[新聞] 《怪談比留子》修復版重返大銀幕'
content: '新聞網址：



  人頭蜘蛛我怕了！童年陰影電影《怪談比留子》修復版重返大銀幕




  若回想童年觀看恐怖電影的陰影經驗，首先想到的是改編伊藤潤二的電影《漩渦》，不論

  是對漩渦著迷到跳進洗衣機的父親，或是詭異的蝸牛人，都讓人不寒而慄。


  再來，1991 年推出的電影《怪談比留子》，也是驚嚇指數破表，畢竟對一個孩子來說，

  蜘蛛已經夠嚇人，何況還有人頭恐怖加持。《怪談比留子》改編自諸星大二郎的《妖怪獵

  人》系列，由塚本晉也執導，並找來被視為殿堂級偶像巨星的澤田研二主演。




  《怪談比留子》劇情描述考古學家八部教授趁著暑假期間，獨自在學校尋找家族王冠的秘

  密，女學生月島好奇心發作跟著教授腳步探險，沒料到教授不慎把封印在古墓的比留子釋

  放，兩人落入危險，雙雙失蹤的兩人，搞得校園內人心惶惶。


  另一方面，原本受八部教授邀的稗田禮二郎教授也來到校園，他偶然救下了八部教授的兒

  子正雄，但此刻正雄正憂心忡忡，不僅是擔心父親安危，也惦記著暗戀的月島。稗田禮二

  郎用自己發明的妖怪探測器，與正雄和死黨們攜手展開營救行動，眾人發現八部教授無意

  間釋放了妖怪比留子，據傳比留子是《古事記》中初神伊耶那岐和伊耶那美的孩子，而她

  的復活帶來了一場意想不到的腥風血雨。




  《怪談比留子》是塚本晉也的第一部 35 釐米電影。但說起塚本晉也的代表作，多數人首先

  想到的會是 1989 年的經典 Cult 片《鐵男：金屬獸》。


  塚本晉也一手包辦《鐵男：金屬獸》的編、導、演、美術、攝影、燈光及剪接，凡事親力

  親為的他，腦子裡充滿天馬行空的想像，他將對特攝電影的狂熱、對大衛柯能堡肉體恐怖

  的崇拜轉化為日式金屬恐怖，呈現在大眾眼前。




  《鐵男：金屬獸》靈感來源自塚本晉也的另一短片《普通大小的怪人》，67 分鐘的黑白

  電影，呈現金屬與肉體結合的極致藝術，他本人親自下海，成了電影中的「拜鐵者」，將

  廢鐵植入體內，以金屬狂人身份，憑著鋼鐵般的怨念瘋狂屠殺。


  人體不斷被鋼鐵物親的駭人景象，人類與科技的慾望糾纏，塚本晉也以《鐵男：金屬獸》

  一片轟動國際影展，不僅獲得羅馬奇幻影展－年度最佳影片，連鬼才導演昆汀也公開表示

  欣賞他。




  擁有超高創作能量的塚本晉也，在《怪談比留子》也盡情揮灑他怪誕奇異的風格。儘管現

  今來看，電影特效粗糙，但導演營造氛圍的功力，與快速逼迫的運鏡，都完美呈現來自妖

  怪的極大惡意。


  相隔 32 年，《怪談比留子》終於將以全新 2K 修復版強勢回歸，記憶湧上心頭，當年的

  童年噩夢，影迷們可以再次回味了。


  《怪談比留子》預計於 2023 年 3 月 10 日上映。



  --'
