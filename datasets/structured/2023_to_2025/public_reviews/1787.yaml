url: https://www.ptt.cc/bbs/movie/M.1686304440.A.CE4.html
title: 'Re: [普雷] 有點像惡搞片的怪談比留子'
content: 'MOD這個禮拜電影上架了，趕緊重溫一下。


  其實氣氛營造得還是很棒，比留子唱主題曲的時候確實還是會令人有點發毛


  擔心接下來要發生什麼事了。


  不過我有一個疑問，就是逃出古墓的比留子應該只有月島臉那一隻吧


  所以男主角背後的人臉應該都是牠殺的，可是最後一幕所有死掉的人卻都變成


  比留子，就我的理解應該只有吃掉當事人的才可以變成他的臉吧?


  最後主角兩人是被還沒有失去理智的比留子朋友救了。


  還有八部家到底跟古墓有什麼特殊關係，這個好像也沒有完整交代


  祖父的棒子就交給孫子來守護了。


  總之片長90分鐘，現在來看還是很好看。家裡有MOD的朋友可以點選來看


  是數位修復版畫質的喔


  --

  嗯，仔細看了一下，MOD只有寫他是數位修復版'
