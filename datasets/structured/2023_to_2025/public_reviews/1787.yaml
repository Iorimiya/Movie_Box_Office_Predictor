title: '[問片] 一部很久的日本恐怖片'
content: '想請問一部年代很久的恐怖片

  試著找過找不到


  大概是在我小學轉電視看到的

  時間應該超20過年


  應該是一部日本片

  情節忘記了

  但有一幕一直忘不了

  很多個漂亮的女生人臉出現在蜘蛛的身體上(或是一整個人頭在蜘蛛的身體處) 在夜晚到處爬


  "剛找了怪談比留子看但不是這部"

  可能是用到類似的梗



  過年正好在複習一些經典的電影

  又想到這部


  先謝過大家 新年快樂



  --


  --'
