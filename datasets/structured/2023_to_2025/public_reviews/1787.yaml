title: '[快閃贈票]《怪談比留子》台北特映搶先看'
content: '★ 鬼才漫畫家 諸星大二郎 X 全才導演 塚本晋也 聯手鬼魅傑作 ★

  日本影史傳奇妖怪 #人頭蜘蛛 問世32週年數位修復

  相隔32年，《怪談比留子》以全新的 2K 修復版強勢回歸

  — 還記得嗎？記憶裡的妖怪回來了！ —


  經典預告再獻：


  考古學家八部教授（竹中直人 飾）趁著暑假獨自在學校尋找家族王冠的秘密，女學生月

  島（深山凛 飾）因好奇心跟在教授後面探險，不信妖怪的八部教授卻不慎將封印在古墓

  中的比留子釋放出來，倆人雙雙被比留子拖走。八部教授的兒子正雄（工藤正貴飾）暗戀

  著月島，與好友一同前往校園尋人，對妖怪深信不疑的稗田教授（澤田研二飾）也來到了

  校園，正雄與稗田教授聯手展開行動，除了尋找父親與月島外，還要營救不慎走散的好友

  。不料迎接他們的，竟是一連串難以解釋的離奇斷頭事件...。


  台北特映會場次（一人得獎兩人同行）

  晚上場：3月8日 19:20 MUVIE CINEMAS (5廳)


  參加抽獎方式：推文回答你想要搶先看【怪談比留子】的原因，

  就有機會中獎（如：我的童年回憶啊！）

  公布得獎日期：（將會公布於回文內，得獎者請站內信回覆領票者資料，恕不接受逾期回

  覆）

  3月7日18:00公布得獎名單，請於3月8日中午12:00前回覆


  活動注意事項：

  1. 本活動抽獎方式係於合格參加者中隨機抽出。

  2. 本活動皆為現場領票，請於開演前至現場接待桌領票。

  3. 請遵守電影分級規範，本票券為非賣品，嚴禁任何圖利行為。

  4. 若遇天災等不可抗力因素取消，恕不補辦，票券未劃位，請於開演前一小時自行劃位

  。

  5. 本活動得獎者提供之個人資料，僅供活動領獎身分核對及通知，不另作他用。

  6. 主辦單位保留活動修改之權利。


  --'
