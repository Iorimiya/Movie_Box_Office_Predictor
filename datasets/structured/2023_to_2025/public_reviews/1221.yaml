title: '[ 好無雷]  赤心巔峰讓我淚流滿面'
content: '可能因為自己有在登山的關係所以特別有感覺吧

  兩個小時的紀錄片看下來後

  彷彿也跟古大哥還有周青一起跑完了中央山脈

  抵達最後一站時他們的情緒也好像跳出了螢幕傳達到現場的觀眾心裡（雖然今天首映中午

  場加我只有三位）

  但我片尾也聽到其他兩人跟我一樣在啜泣哈哈

  真心希望這部片可以列入校內地理課觀影片單

  蠻難過以前小時候的課本都沒讓我有機會可以好好認識台灣山岳

  直到開始登山了才發現台灣真的好美好美

  強烈推薦大家進電影院來感受兩位越野跑者的堅毅與看看我們的護國神山


  --'
