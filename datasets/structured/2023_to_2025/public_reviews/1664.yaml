title: '[情報] iTunes$80起 餐廳失控夜.維多莉亞.湯道'
content: "【完整收藏片單】\n\n\n$80 餐廳失控夜 : \n\n最近爆紅的 \"混沌少年時\" 導演前作，一鏡到底確實很神，比大熊餐廳第一季還早一年的\n\
  高度緊繃神作。\n\n另外推一部德國片也是一鏡到底經典，目前是長期 $70 ，觀影過程真的是沉浸在一個瘋\n狂無法預期的夜晚，近兩個半小時大推～\n\n維多莉亞\
  \ : \n\n-\n\n$80 葉問3 : \n\n私心覺得系列四部中武打最好看的一部。\n\n-\n\n$80 看不見的目擊者 : \n\n吉岡里帆主演日版，改編自韓國經典驚悚片\
  \ \"盲證\"。\n\n-\n\n$80 麥路人 : \n\n郭富城主演香港劇情片，關注遊民議題，香港金像獎10項提名。\n\n-\n\n$80 性徒 : \n\
  \n兩男一女的荒島慾望實驗，粉紅電影大導城定秀夫改編自話題性漫畫作品，磯村勇斗 主\n演。\n\n-\n\n$90 地中海救難隊 : \n\n改編自真實故事，《100公尺的人生》導演新作，講述救助逃亡難民的海上救援隊故事。\n\
  \n-\n\n$90 浪浪好朋友 : \n\n林遣都主演，真實故事改編的狗狗療癒型劇情片，第47屆日本報知電影獎最佳男主角入圍\n。\n\n-\n\n$90 邪惡的孩子\
  \ : \n\n玉木宏主演的家庭驚悚片，葡萄牙國際奇幻影展特別獎。\n\n-\n\n$90 天使降臨到我身邊！珍貴的朋友 : \n\n影片改編自椋木Nanatsu的同名百合作品，電視版之後首部推出的劇場版。\n\
  \n-\n\n$90 彬與瑛 : \n\n改編自《半澤直樹》作者池井戶潤的同名小說，竹內涼真 . 橫濱流星 . 上白石萌歌 主\n演。\n\n-\n\n$90\
  \ 火線埋伏 : \n\n【黑暗騎士】亞倫艾克哈特主演的越戰電影，講述地道戰在越戰期間的關鍵一役。\n\n-\n\n$90 湯道 : \n\n橋本環奈 . 生田斗真主演，日本人真的很喜歡將自身文化拍成電影，像茶道、花道，這\n\
  部講泡湯文化，整體覺得頗療癒好看。\n\n\n\n\n--"
