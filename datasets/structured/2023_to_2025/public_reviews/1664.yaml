url: https://www.ptt.cc/bbs/movie/M.1684947005.A.5A4.html
title: '[普雷] 《湯道》享受泡湯的百種方法'
content: '泡湯之樂更勝戀愛，泡湯的各種原因


  一天的煩悶或一天的開始，有時候都是從洗澡展開，而可以泡進溫染身心的巨大澡缸裡，

  可是人生的一大享受。不管是古代羅馬或是現代日本，泡湯在多個時代與國家都是種社交

  文化，而到現今只要想到泡澡就讓人想起日本，就連台灣各處也受到這樣和式風情的影響

  ，泡湯不僅是生活也是每天重要的一個環節。


  以泡湯為題材的搞笑電影《湯道》，是一部結合親情與傳承的日本片。故事以建築師三浦

  史朗返回名為丸金溫泉的老家錢湯，與繼承錢湯的弟弟三浦悟朗，兩人因為要繼續經營錢

  湯或變賣掉產生矛盾。


  老舊錢湯雖然不賺錢，但每天還是有附近的住戶上門，各式各樣的人來來去去，也讓史朗

  思考起：錢湯在當代社會下的意義。







  《湯道》是什麼電影？


  雖然泡湯與溫泉文化會讓人想到日本，但台灣因爲過去日本殖民文化，也將這類型的習俗

  傳承下來，發展成獨特的台灣泡湯風景。台灣漫畫家捲貓因為喜歡泡湯，故在2022年時繪

  製了《捲兔的台灣裸湯：北部篇》，介紹北部各處的溫泉、澡堂，在台灣泡湯雖一般泛指

  溫泉，而日本許多住宅區則是以前錢湯大眾浴池為主，但隨著居家浴室的盛行，澡堂文化

  也慢慢的在日本消退。


  隨日本多半是普通洗澡的小型澡堂，但也有豪華的大澡堂與別具特色的浴池。裡面有像是

  休息室、按摩椅、美容按摩服務或報章雜誌提供觀看，有些也提供餐點。


  台灣這方面也有類似的變體叫做「三溫暖」。知名的如天龍、亞太這些老牌的男士三溫暖

  場所，也有如變體的像同志三溫暖漢士、女性三溫暖喬莉等，提供各類人士可以安心泡澡

  聚會。









  電影《湯道》其實就在敘述關於泡湯的文化，故事以離家經營建築工作室的哥哥三浦史朗

  因失敗回到老家，與繼承老家經營的弟弟三浦悟朗兩人水火不容，還因為是否要變賣還是

  繼續經營錢湯而發生爭執大打出手，讓在裡頭工作的女孩秋山泉很是困擾。


  哥哥史朗不知道弟弟為何要守住過時的錢湯，但隨著與前湯客人之間羈絆不斷加深，好像

  也能漸漸懂得，父親這座錢湯對居住與此的人那種重要性。


  喜歡高歌一曲的阿姨、專研泡湯之道的退休老人、拌嘴的老夫老妻、外國女婿與頑固的日

  本爸爸、還有總是送來柴火的謎之錢湯仙人等，各式各樣不同的人光顧錢湯，延伸出一段

  又一段日常中小確幸的平凡溫馨的故事。但一名溫泉大師卻在公開平台上斷言講到：錢湯

  已經是過時的產物，這會對兩兄弟的錢湯造成什麼衝擊？












  《湯道》分析與延伸：


  錢湯是一種日本特有的收費公共浴池文化，最早出現在8世紀末的平安時代京都。在20世

  紀後因為家庭浴室普及率提高，幾乎每家每戶都有浴池。


  企業大型的療養中心和大型錢湯的開設，一般公共與私人錢湯數量就急劇下降，只剩有固

  定住宅與學校附近的錢湯還持續經營，有一些日本人認為錢湯文化的消失，其實是代表昭

  和時代舊日本的結束。通常外國遊客較會將錢湯與溫泉兩者搞混，但入浴規矩其實大同小

  異。


  電影《湯道》的編劇小山薰堂其實是一個專研湯道的實行者，他對於日本特殊的入獄文化

  很感興趣，也覺得與他國的澡堂文化有所區別。認為入浴的湯道，應該跟花道、茶道等日

  本文化受到重視。但繁瑣和嚴肅的氛圍，跟放鬆泡湯有所區別，故以日本特有的嚴肅搞笑

  和諧音冷笑話等為主，以搞笑和溫馨的故事敘述《湯道》這個故事。









  電影中除了可以看見傳統的錢湯建築，還有看日本電影或動畫觀眾們耳熟能詳的基本配備

  ，電風扇、小凳子、冰牛奶還有浴池後的富士山畫，滿足傳統對於日本浴場的想像，還有

  過度誇張的日本人，跟日本老歌。其中也有使用一些錢湯用語，例如在澡堂內負責男女湯

  整潔與管理工作的人稱為「番頭」、還有問清楚刺青人士是否能進入浴場也是重要的錢湯

  禮貌。


  如今有些錢塘為了生存，靠近溫泉區的會採用溫泉水接待客人，也有些在設施和外觀上重

  建變得較為現代化和時尚吸引當代客人前往。而台灣的三溫暖多為錢湯的變體，台灣溫泉

  普遍很多也受到錢湯啟發。


  在一些以體育系和運動社團聞名的學校，和日本軍警消之間，錢湯文化還是團員、隊友交

  流或放鬆疲勞的場所，可以說對於這些族群錢湯文化還是有其重要性。











  《湯道》值得一看嗎？


  電影《湯道》是一部很典型的日式小電影，除了講述一間錢湯的專門術語和經營外，也可

  以看到各式各樣客人的「泡湯堅持」和「鄰里文化」，並且講述關於自然的泉水帶給人們

  洗滌心靈和溫暖身體，每個人都可以因為泡湯獲得幸福的瞬間。


  並且讓所有人都可以輕鬆的坦誠相見在大浴池內跟不認識或認識的人交流，獲得不一樣的

  收穫，這是電影中傳達很棒的一點。


  但如果以推薦的角度的話《湯道》電影本身其實我自己不太推，原因還是很通俗的日本電

  影毛病，說教的部分有點過多，並且笑點要對到才會覺得好笑，就跟日本綜藝一樣，其實

  有時候諧星的梗要對到頻率，甚至接到梗。能意會到是好笑，不能意會到就是滿頭問號的

  尷尬。《湯道》就屬於這樣較為日式傳統的電影。










  整體來說如果對於泡湯和日本文化有興趣的人，可以當成一部成本不高的錢湯推廣片，並

  且如果有泡湯經驗的人，應該會對裡面的場景和規矩等不陌生，過去曾經跟人去京都、東

  京等地方住宅區的錢湯，電影中的風情立刻讓我有回到那一刻的記憶，充滿懷念感。但以

  電影來說，實在是除了賣情懷外，又是老生常談和各種說教場面，這點實在讓人吃不消。


  《湯道》在日本評價普普，雖然很多觀眾可以理解錢湯文化的重要性，但是很多人覺得裡

  面有些情緒渲然太過於誇張，雖然理解導演編劇想要誇張的笑點來詮釋，但整體來說太過

  於老派。不過有滿多觀眾看完覺得滿想去泡湯和洗一次溫泉的，有這樣的想法也算是《湯

  道》電影的成功吧？


  --

  個人Blog：

  小說連載頁：


  --'
