title: '[新聞] 「熊本熊之父」宣揚【湯道】精神電影登台'
content: '新聞網址：



  由奧斯卡最佳外語片《送行者：禮儀師的樂章》編劇、有「熊本熊之父」之稱的日本創意

  大師小山薰堂擔任企劃及編劇，並強勢空降日本新片票房冠軍的人氣話題電影《湯道》，

  即將在5月12日於台灣感動獻映。本片透過小山薰堂在2015年所提倡的特殊「湯道」入浴

  文化為精髓，透過完全原創的故事內容，打造不同於「茶道」、「花道」或「香道」的日

  本特殊入浴文化，勢必讓觀眾耳目一新。尤其本片可說是近年來台前幕後最堅強的製作陣

  容，找來《HERO》、《假面飯店》系列的億萬票房名導鈴木雅之執導，更由傑尼斯演技派

  男星生田斗真，以及透過電影《預告犯》二度合作的濱田岳，還有「顏藝女神」橋本環奈

  領銜主演。尤其生田斗真這回將有大量的裸露沐浴戲，讓人看到目不暇給，生田也對此表

  示：「由於本片以澡堂作為舞台，就某種層面來說，我們得以裸露心靈，通過泡澡感受比

  平時更加接近的演員與工作人員。我希望觀眾看完本片之後，能夠重新面對自己，珍惜每

  天的生活！」





  擔任電影《湯道》企劃與編劇的小山薰堂，以源源不絕的創造力，身兼電視節目企畫編劇

  、戲劇編劇、作家、作詞人、譯者、廣播節目主持人等多項職務，被業界譽為是難以定義

  的全方位跨界創意大師。他不僅在日本，更在台灣享譽高度人氣，也曾以《鐵人之料理》

  、《電波少年》等知名電視節目企劃享譽國際。他也因為「熊本熊」企劃，成功將熊本縣

  行銷到世界各地，因此被譽為「熊本熊之父」。本身就是泡湯迷的他，從2015年開始，便

  全心投入、提倡以入浴精神及儀式為重心的「湯道」，就像大家對「茶道」、「花道」或

  「香道」的熟悉，他認為日本也該有特殊的入浴文化，讓「湯道」能成為全世界都喜愛的

  文化體驗。他因此透過完全原創的故事，成就出《湯道》如此神奇又笑中帶淚的電影。全

  片在澡堂氤氳繚繞中所瀰漫的濃厚人情味，感動更是媲美《解憂雜貨店》、《Always幸福

  的三丁目》等經典之作。



  本片也可說是近年來超豪華的演出陣容，除了主要演員生田斗真、濱田岳、橋本環奈之外

  ，其他參與的演員們也是一時之選，包括窪田正孝、朝日奈央、寺島進、戶田惠子、

  Wentz瑛士、生見愛瑠、天童芳美、Chris Hart、角野卓造、柄本明、夏木麻里、小日向

  文世、吉田鋼太郎等老中青三代演技派卡司，透過各有千秋的性格人物，彼此背負著各自

  的人生歷程而齊聚一堂，共同演繹這部充滿淚水與生命力的感動物語。尤其生田斗真這回

  飾演因為工作不順利，只好重返老家，並與弟弟相愛相殺的哥哥，生田也對這次接演表示

  ：「跟我合作的濱田和橋本，即使在拍攝以外的時間，也能自然而然地團結在一起，感覺

  就像被可愛的弟弟和妹妹夾在中間，讓我感到非常幸福，請期待我們三人的三角關係，會

  出現什麼樣的化學反應！」值得一提的是，這也是生田繼《臥底型警》後再度尺度大開，

  演出不少在澡堂中的裸露戲。他也補充：「由於本片以澡堂作為舞台，就某種層面來說，

  我們得以裸露心靈，通過泡澡感受比平時更加接近的演員與工作人員。我希望觀眾看完本

  片之後，能夠重新面對自己，珍惜每天的生活！」





  《湯道》不僅在日本廣受歡迎，就連世界各地都深陷於它的魅力。本片除了在夏威夷影展

  舉辦世界首映，近日更獲得義大利烏迪內遠東影展青睞，強勢入選競賽單元。尤其從1999

  年開始舉辦的遠東影展，是歐洲最大、專門介紹亞洲電影的影展，北野武曾獲該影展「終

  身成就獎」肯定，當年由阿部寬主演的《羅馬浴場》也曾參加該影展。這回本片入選，也

  讓選片委員對本片期待地表示：「備受期待的澡堂喜劇又要重返義大利了！」



  這部由《送行者：禮儀師的樂章》編劇小山薰堂擔任企劃及編劇，並強勢空降日本新片票

  房冠軍的人氣話題電影《湯道》，即將在5月12日於台灣感動獻映。本片劇情描述建築師

  三浦史朗（生田斗真飾演），老家經營著以「丸金溫泉」為名的錢湯，但他不打算繼承家

  業，離家後出外闖蕩，卻因為發展不順而重返老家。此時，錢湯已經由弟弟三浦悟朗（濱

  田岳飾演）繼承亡父之志繼續經營。史朗返家後，計畫將這座澡堂拆除，並改建成公寓大

  樓。兄弟兩人也因為理念不同，讓彼此的關係如履薄冰。某天，悟朗因為一場意外被送進

  醫院治療，史朗則在替澡堂工作的少女秋山泉（橋本環奈飾演）建議下，不得不暫代弟弟

  的職責，擔任澡堂的管理者。接手澡堂後，史朗目睹了人們之間的互動；在那裡，沒有人

  有差別待遇，每個人都有屬於自己的幸福，而凍結在史朗心中的「某些東西」，也逐漸獲

  得了釋放…。



