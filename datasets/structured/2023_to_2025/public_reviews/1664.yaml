title: '[新聞] 演歌天后天童芳美【湯道】獻出電影初體驗'
content: '新聞網址：



  即將在5月12日於台灣上映的日本年度話題大片《湯道》，實在是好大的面子，請來縱橫

  歌壇50年的「演歌天后」天童芳美加盟演出。驚人的是，雖然她演藝資歷已經超過50年，

  但她其實從來沒演過電影，結果就把「電影初體驗」獻給本片，更在片中高歌多曲，甚至

  還與赴日發展的美國歌手克里斯哈特（Chris Hart）在澡堂中演繹坂本九名曲〈昂首闊步

  向前行〉的「沐浴二重唱」版，讓全片在笑中帶淚之餘，更可說是另類的「音樂電影」。

  不僅如此，本片不愧為年度大片，更在場景美術上極其講究，在京都的松竹攝影所搭建男

  主角家傳的大眾澡堂「丸金溫泉」，以及與之相連的整座街景，超過190坪的場景當中，

  更厲害的是浴場造景內的浴池，甚至可以直接放熱水入浴泡湯。這不僅讓在京都拍攝其他

  作品的演員與工作人員，以及來京都參訪的業內人士都慕名而來，成為另類的「旅遊新勝

  地」，更讓男主角生田斗真有感而發：「『丸金溫泉』的佈景完成度相當感人，讓我想『

  如果我們不拆除，直接繼續經營這個澡堂，那不是很好嗎？』」





  由奧斯卡最佳外語片《送行者：禮儀師的樂章》編劇、有「熊本熊之父」之稱的日本創意

  大師小山薰堂擔任企劃及編劇，並找來《HERO》、《假面飯店》系列的億萬票房名導鈴木

  雅之執導的《湯道》，可說是眾星雲集。不僅由生田斗真、濱田岳、橋本環奈領銜主演，

  更找來「演歌天后」天童芳美加盟演出。尤其歌手生涯超過50年的天童，在本片飾演最愛

  在浴室中盡情歡唱，也總會選在「丸金溫泉」開店後第一個光顧的常客。首度演出電影的

  她表示：「導演希望我能將角色的純真和溫暖傳達給觀眾。我很感激被賦予這樣一位非常

  適合我的角色。對我來說，一切都是第一次體驗，我很緊張地進入拍攝，但當我進入浴池

  之後，我的緊張感就全部都消失了。」而她也將褪去平時華麗的舞台歌唱服，小露香肩泡

  在公共浴池中，演唱竹內瑪麗亞的〈別吵了〉，以及派特斯合唱團（The Platters）的經

  典名曲〈Only You〉。尤其當她拍攝演唱〈別吵了〉當天，一開始排演是先由導演親自示

  範演唱，但後來等天童親自演唱後，讓聽到天童美聲的導演只能尬笑：「真是無地自容啊

  」。



  不僅如此，赴日發展的美國歌手克里斯哈特，則在本片飾演出獄後，夢想去澡堂洗澡和喝

  咖啡牛奶的年輕人「龍太」。首度演出電影的他說：「在開拍前幾個月裡，我就意識到要

  成為龍太，能夠以不同於音樂的節奏進行表演，是我永遠難忘的美妙體驗。」尤其他為了

  要拍沐浴戲，甚至瘦了30公斤，展現演出的決心。此外，他跟天童芳美也將隔著男女湯的

  牆壁，一同演唱名曲〈昂首向前行〉，成為全片一大看點與聽點。尤其正式拍攝一次到位

  ，悠揚美聲迴盪在澡堂當中，讓劇組人員紛紛鼓掌，更讓生田斗真表示：「在試戲第一次

  聽到的時候，我很吃驚，感覺就像在洗澡唱歌時的回聲。」值得一提的是，導演也找來所

  有演員在片尾分別演唱吉米戴維斯（Jimmie Davis）的〈You Are My Sunshine〉，敬請

  鎖定演員們即興呈現的演唱及肢體表現！





  不僅如此，《湯道》另一個主角，可說是男主角家傳的大眾澡堂「丸金溫泉」。為了拍攝

  ，劇組在京都的松竹攝影所實景搭建這座溫泉，以及與之相連的整座街景。在超過190坪

  的攝影棚入口處搭建澡堂玄關，連同等候處、櫃台、更衣處、浴場，甚至是後門的鍋爐室

  都直接在棚內搭建，進行就連專家都驚嘆不已的神奇大改造。更厲害的是，浴場造景內的

  浴池，甚至可以直接放熱水入浴泡湯，還找來業者負責燒水，讓幾乎所有演員都曾在這邊

  實際泡湯拍攝。此外，地板及牆壁的磁磚都是實際請師傅來鋪，尤其分隔男女湯的牆面上

  半部嵌入的磨砂玻璃，這些磨砂玻璃都是老古董，由於傳統磨砂玻璃現在要價不菲，劇組

  還特地從現存的舊棚景拆下磨砂玻璃借用。其他道具也是從已經歇業的京都三条大眾澡堂

  「柳湯」商借而來，有著十分悠久的歷史。有趣的是，這也吸引其他在京都拍攝作品的演

  員與工作人員，以及來京都參訪的業內人士爭相參觀，讓這裡成為另類的「旅遊新勝地」

  ，而喜愛在復古澡堂泡湯的觀眾，也千萬不容錯過本片精緻的場景設計。



  回顧現場，男主角生田斗真表示：「『丸金溫泉』的佈景完成度相當感人，讓我想『如果

  我們不拆除，直接繼續經營這個澡堂，那不是很好嗎？』」更直說：「在電影之都『京都

  』豎立這樣壯觀的佈景，和大家一起住宿、悠閒地拍攝，這是久違的電影製作體驗，我很

  高興能再次體驗到『製作電影』的樂趣。」而飾演生田弟弟的濱田岳則說：「當我第一次

  看到『丸金溫泉』的場景時，我很興奮，感覺好像參與了一個超棒的作品。能在熟悉的松

  竹攝影所，拍攝如此精美的設置，並在那裡玩耍，對我來說是一個非常幸福的時光。這部

  作品以日常的浴場為主題，但我認為觀眾們能從中體驗到『這不僅僅是浴場！』的感覺。

  」



  這部由《送行者：禮儀師的樂章》編劇小山薰堂擔任企劃及編劇，並強勢空降日本新片票

  房冠軍的人氣話題電影《湯道》，即將在5月12日於台灣感動獻映。本片劇情描述建築師

  三浦史朗（生田斗真飾演），老家經營著以「丸金溫泉」為名的錢湯，但他不打算繼承家

  業，離家後出外闖蕩，卻因為發展不順而重返老家。此時，錢湯已經由弟弟三浦悟朗（濱

  田岳飾演）繼承亡父之志繼續經營。史朗返家後，計畫將這座澡堂拆除，並改建成公寓大

  樓。兄弟兩人也因為理念不同，讓彼此的關係如履薄冰。某天，悟朗因為一場意外被送進

  醫院治療，史朗則在替澡堂工作的少女秋山泉（橋本環奈飾演）建議下，不得不暫代弟弟

  的職責，擔任澡堂的管理者。接手澡堂後，史朗目睹了人們之間的互動；在那裡，沒有人

  有差別待遇，每個人都有屬於自己的幸福，而凍結在史朗心中的「某些東西」，也逐漸獲

  得了釋放…。



