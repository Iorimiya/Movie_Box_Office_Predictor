url: https://www.ptt.cc/bbs/movie/M.1683646572.A.A98.html
title: '[新聞] 生田斗真【湯道】裸體演出曝「一天兩次」'
content: '新聞網址：



  感動媲美《解憂雜貨店》的日本年度話題電影《湯道》，即將在本週五（5/12）於台灣感

  動獻映。男主角生田斗真在這部以「泡澡」為主題的電影當中，將親自演出多場裸體洗澡

  戲，勢必讓觀眾大飽眼福。他透露自己「一天兩次」的洗澡習慣，更回憶童年被祖父帶去

  公共澡堂「非常愉快」的過往。尤其他之前演出《臥底型警》系列電影時，已經挑戰過裸

  體被綁在汽車引擎蓋上的激烈場面，對於這回再度裸體演出，他笑稱：「相當和平」之外

  ，更加碼爆料：「濱田岳、窪田正孝，甚至是小日向文世前輩都脫了，觀眾可以在片中看

  到各個年齡層的裸男。」值得一提的是，由於一票演員都在拍攝現場裸裎相對，讓劇組苦

  惱如何避免「穿幫」的問題發生，這也讓「消光噴霧」成為拍攝現場的必備用品，更讓眾

  人時常大喊消光噴霧的名字「Dulling」，成為劇組的神奇「防穿幫咒語」。





  傑尼斯演技派偶像生田斗真，這回領銜主演《湯道》，在片中飾演離家工作碰壁，最後只

  好重返老家經營的「丸金溫泉」澡堂，厚著臉皮炫耀自己光榮返鄉，卻因此讓自己反而變

  得可笑的哥哥一角。生田對於所飾演的角色表示：「這種困惑感在我自己身上也有，我想

  每個人都有類似的經驗，如果能傳達出角色可愛且不討厭的氛圍，那就太好了。」他並表

  示：「由於本片的舞台是澡堂，就某種意義上來說，我們可以裸露心靈，透過泡澡，感覺

  比平時更加接近演員和工作人員。我希望觀眾觀賞這部電影之後，都能夠重新面對自己，

  珍惜每天的生活！」



  尤其本片以「泡澡」為主題，生田本人也將親自演出多場裸體洗澡戲。在過去演出的《臥

  底型警》系列電影中，他就曾挑戰裸體被綁在汽車引擎蓋上的激烈場面，這回再度演出裸

  體戲，他笑稱：「這次相當和平！因為洗澡就是日常生活中的幸福！」他並透露自己的洗

  澡習慣：「我每天都會洗兩次，包括睡覺前跟工作前，而且我習慣用手洗身體，不太會用

  毛巾洗。」此外，他更爆料：「濱田岳、窪田正孝，甚至是小日向文世前輩都脫了，觀眾

  可以在片中看到各個年齡層的裸男。」不僅如此，他也回憶童年時被祖父帶去公共澡堂的

  回憶。對當時的生田來說，公共澡堂是「成年人的社交場所，孩子們不能單獨去的地方。

  」不過在這樣一個特別的地方，每當洗完澡喝著咖啡牛奶，一邊冷卻著溫暖的身體一邊回

  家，他也直呼是個「非常愉快的回憶」。





  由於《湯道》幾乎每一位主要演員都有入浴場面，所以眾人時不時就會在現場裸裎相對。

  也因為片中的浴池是實景打造，真的可以在裡面泡澡，所以為了避免泡澡起身後會著涼，

  演員們乾脆就把片中的浴池當成休息室，直接泡在裡頭待機。而導演鈴木雅之有時候也會

  直接坐在能看到全場的櫃檯上導戲，讓這座澡堂的功能，在幕後也完全發揮作用。至於該

  如何巧妙避開「穿幫」，又能細緻描繪那些難以透過肉眼捕捉的精神層面，包括湯及人心

  的細微變化呢？導演透露確實花費不少苦心在避免讓演員穿幫，尤其現場又有許多玻璃和

  鏡子，很容易不小心拍到攝影器材或工作人員；這個時候大家就會紛紛喊出「Dulling」

  這個咒語，也就是消光噴霧的名字，也讓消光噴霧成為這次拍攝現場的必備用品。觀眾也

  勢必可以從片中多場的入浴的畫面中，感受到澡堂、人情溫暖，以及看電影的樂趣。



  這部由《送行者：禮儀師的樂章》編劇小山薰堂擔任企劃及編劇，並強勢空降日本新片票

  房冠軍的人氣話題電影《湯道》，即將在本週五（5/12）於台灣感動獻映。本片劇情描述

  建築師三浦史朗（生田斗真飾演），老家經營著以「丸金溫泉」為名的錢湯，但他不打算

  繼承家業，離家後出外闖蕩，卻因為發展不順而重返老家。此時，錢湯已經由弟弟三浦悟

  朗（濱田岳飾演）繼承亡父之志繼續經營。史朗返家後，計畫將這座澡堂拆除，並改建成

  公寓大樓。兄弟兩人也因為理念不同，讓彼此的關係如履薄冰。某天，悟朗因為一場意外

  被送進醫院治療，史朗則在替澡堂工作的少女秋山泉（橋本環奈飾演）建議下，不得不暫

  代弟弟的職責，擔任澡堂的管理者。接手澡堂後，史朗目睹了人們之間的互動；在那裡，

  沒有人有差別待遇，每個人都有屬於自己的幸福，而凍結在史朗心中的「某些東西」，也

  逐漸獲得了釋放…。



  欲知本片最新消息，

