title: '[新聞] 橋本環奈露香肩，變身【湯道】招牌少女！'
content: '新聞網址：



  感動媲美《解憂雜貨店》，並由生田斗真、濱田岳、橋本環奈領銜主演的日本話題電影《

  湯道》，即將在5月12日於全台感動獻映。橋本環奈這回收起「顏藝女神」的演出風格，

  在片中飾演開朗迷人的澡堂招牌少女。超愛泡澡的她，這回擔任澡堂櫃檯接待員，目睹顧

  客們的人生百態，也讓她坦言：「這是一個我沒有經歷過太多的世界，所以我認為日本的

  澡堂文化真的很棒。」此外，本片由奧斯卡最佳外語片《送行者：禮儀師的樂章》編劇、

  有「熊本熊之父」之稱的日本創意大師小山薰堂擔任企劃與編劇。現實生活中，小山本身

  就是「湯道」的提倡者，這回更友情客串本片，竟甘願「降級」成才剛接觸湯道，進入「

  湯道會館」學習入浴技巧的菜鳥弟子。對於有機會軋角演出，他不僅開玩笑表示，要準備

  跟其他演員一起去戲院登台問候了，更還分享自己人生泡過「最極致的一湯」。





  橋本環奈在《湯道》當中，飾演公共澡堂「丸金溫泉」的招牌少女，面對生田斗真與濱田

  岳飾演的水火不容兄弟檔，她不僅是居中調劑的角色，更因為性格開朗、工作認真，因此

  深受顧客們的喜愛。坦言超愛泡澡的她，這回在片中也有小露香肩的泡澡場面，值得觀眾

  進場戲院一探究竟。對於有機會演出這部以「泡澡」為主題的電影，她開心表示：「我非

  常喜歡泡澡，如果有休息時間，我一定會去溫泉或足湯，所以當我知道這部作品時，我真

  的好高興。我飾演的角色，是以不同立場坐在澡堂前台，目視著眾人的一切，是個開朗且

  迷人的角色。」尤其這回搭擋生田斗真與濱田岳，也讓她回憶：「一起拍攝的場景很多，

  有時我只是旁觀者，有時我會插進去演戲，在被兩人演技吸引的同時，也時常需要依靠他

  們來引導我的表演。」甚至連首度合作的濱田也對她讚譽有佳：「橋本既可愛又非常親切

  ，由於我和她都能理解彼此的氛圍，所以演對手戲時完全沒壓力。」



  尤其本片的復古澡堂場景，是由劇組實景打造還原，這也讓橋本有感而發：「那是一個看

  起來像真正的公共澡堂的宏偉佈景，也是接觸傳統的好機會。當地人聚集在公共澡堂，在

  那邊自然而然地發生交流。這是一個我沒有經歷過太多的世界，所以我認為日本的文化真

  的很棒。」而她也為本片強力催票：「希望觀眾在觀賞電影時，能感受到這種氛圍，並且

  在看完電影之後，能夠去大眾浴池享受一下！」





  值得一提的是，《湯道》的企劃與編劇，就是長年以來提倡「湯道」文化，有「熊本熊之

  父」之稱的小山薰堂。說到將泡澡精神搬上大銀幕的契機時，小山表示：「長崎有一家公

  共澡堂倒閉了，當我看到這個消息的時候，就覺得我可以把它寫成一個故事。當我告訴一

  位製片人，我想拍一部以『湯道』為主題的電影時，這個計畫就開始了。」尤其他選擇「

  澡堂」而非「溫泉」，原因就是泡澡為日常生活的一部分，想透過泡澡更加貼近人心。而

  身為提倡者的他，這回也在本片友情客串，不過卻甘心「降級」成才剛進入「湯道會館」

  接觸湯道的菜鳥弟子，跟其他菜鳥弟子們一同學習入浴技巧。他也分享參與演出的契機：

  「我身邊有好幾個朋友都想演出這部電影，所以我就請求導演讓我演出。決定要一起表演

  時，我就用旅行的心情召集和大家一起去拍。」他更開玩笑說：「大家已經準備好要去戲

  院登台問候了。」



  本身就是泡澡專家的小山，也分享自己人生中「最極致的一湯」：「其實有兩個，一個是

  沖繩市內名叫『中乃湯』的公共澡堂。這是沖繩唯一一家由90多歲老太太經營的澡堂。老

  太太總是坐在簾子前的長凳上，顧客付錢就進去了。沒過多久，鄰居還會拿把三線琴開始

  彈奏，老太太也跟著唱起來，其他顧客也跟著唱，氣氛就像拍電影一樣；尤其更衣室和浴

  缸之間沒有阻隔，窗戶都開著，吹著沖繩的微風十分舒服。另一個是『竹林之湯』，位在

  相距鹿兒島機場約 15分鐘路程的竹林當中。是無人管理的24小時天然溫泉，民眾可以免

  費進去。50度左右的熱水噴湧而出，順著岩石逐漸降溫，下面有兩個窪地。下方有一條河

  流，泡完熱水後跳入河中，猶如水浴，讓我真切感受到在大自然中接受溫泉的恩賜。」



  這部由《送行者：禮儀師的樂章》編劇小山薰堂擔任企劃及編劇，並強勢空降日本新片票

  房冠軍的人氣話題電影《湯道》，即將在5月12日於台灣感動獻映。本片劇情描述建築師

  三浦史朗（生田斗真飾演），老家經營著以「丸金溫泉」為名的錢湯，但他不打算繼承家

  業，離家後出外闖蕩，卻因為發展不順而重返老家。此時，錢湯已經由弟弟三浦悟朗（濱

  田岳飾演）繼承亡父之志繼續經營。史朗返家後，計畫將這座澡堂拆除，並改建成公寓大

  樓。兄弟兩人也因為理念不同，讓彼此的關係如履薄冰。某天，悟朗因為一場意外被送進

  醫院治療，史朗則在替澡堂工作的少女秋山泉（橋本環奈飾演）建議下，不得不暫代弟弟

  的職責，擔任澡堂的管理者。接手澡堂後，史朗目睹了人們之間的互動；在那裡，沒有人

  有差別待遇，每個人都有屬於自己的幸福，而凍結在史朗心中的「某些東西」，也逐漸獲

  得了釋放…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
