title: '[微好雷] 湯道 - 瞎掰大道理中的溫馨小品'
content: "《湯道》，可能因為我去日本還蠻愛泡「錢湯」\n畢竟走路腳痠，真的晚上體驗一下泡個熱水回血很舒適 XD\n\n於是演算法似乎不停地宣傳給我這部電影預告或介紹\n\
  \n本來看到一些宣傳海報是覺得蠻尷尬的\n但又覺得這個我不去看，根本沒人會看\n心想說，好啦!有空我就加減看看吧~\n沒想到昨天看電影院好像週末就沒計畫繼續播映這部了\n\
  只好趁晚上有空吃個晚餐跑進場\n\n\n先說，如果有人和你說這部「」\n\n\n畢竟，泡個湯和你扯個『』\n\n\nEx.用紅酒方式品嘗溫泉水 = =or還要泡進水池不漏出水的大師之道\n\
  \n那我還給「」幹嘛？\n痾，說真的比預期好看蠻多的\n\n請看《幸福湯屋》有多歪...湯屋幾乎等於0\n(我以為只有顏藝的她，沒演太差)\n(雖然很可惜不是真實場景)\n\
  \n\n\n\n\n\n最後還是要說教的日本電影，始終要講個大道理\n雖然設定的錢湯背景竟然是我個人最喜歡的溫泉區\n『城崎溫泉』\n但當然蠻可惜的，只是個架空的設定(為了錢湯附近有\"\
  真\"溫泉)\n不過，簡單的小故事中，透過不少互動增添了整齣戲的趣味感\n像是愛搶第一個泡湯的愛唱歌大媽\n迷之敲水盆的夫妻\n還有常見的『喝牛奶』\n去日本喜歡泡泡這逐漸凋零的『昭和遺產』\n\
  如果這幾天有空是可以抽空進場觀看\n看到被燙到哀哀叫的外國人，感同身受\n日本傳統錢湯真的超多熱水根本就是煮蛋用的XD\n起碼不是刻意變成愛情劇的鳥劇情\n而是很簡單很溫馨的趣味小品\n\
  而且，超容易變成包場獨享 =口=\n說不定到時候也很難在串流上看到這部啊!!!\n\n\n\n--\n\n      有一天\n    大象就問駱駝說：\n \
  \   「你的胸部怎麼長在你背上啊？」\n    駱駝回答：\n    「我想這個問題，由 一個老二長在臉上的人來問我實在是很奇怪耶...」\n\n--"
