url: https://www.ptt.cc/bbs/movie/M.1753064619.A.AA7.html
title: '[好雷] 納米比亞沙漠直播中Desert of Namibia'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  比想像中令人感到煩悶，但悶到一個地步卻生出了一種獨特的魅力，如同女主角一般木然

  、煩躁、思行不一、莫名其妙，諸多反常發生於類似解離狀態中。或許正是這樣的視角，

  讓這部電影與慣常的日本片產生極大分歧，看到結束有一種還好沒有錯過的感覺。


  算是近期看完電影最有想看影評的電影，但看了好些影評，卻還是沒辦法完全平復觀看的

  心情，於是又問了印象中有看過這片的朋友聊了聊。


  以主線的戀愛關係來說，原本男有具有一般而言的「溫柔」、「體貼」、「對自己好」、

  「對自己誠實」甚至是外貌上的「乾淨」、「帥氣」等，女主角另結新歡似乎僅僅是「因

  為想要」，倒也不見得有什麼真正的理由。所謂的「分手」，也只是搬走，然後消失。其

  他的疑點，像是對人際關係、工作沒有什麼執著，隨口說出「謊言」、「攻擊傷害男友」

  也沒有感覺任何問題。如此種種狀況，不斷堆疊，可說是無謂並且虛無的時間流逝。


  忽然在一個打鬧之中，鏡頭轉移，亮桃紅色背景中女主角的視角，轉入到一個空間，只有

  她在小跑步機上，四面是燈，她一邊跑一邊看著那個發瘋中的自己。此前的一切至此，有

  了奇異轉換。


  不是躁鬱症、不是邊緣性人格，也有可能精神醫學診斷不斷變化，無法規類的什麼。醫生

  無法確定，女主角也不明白。與諮商師討論，提到「原生家庭」、「反芻思考」；回到家

  與男友對話中直接講出「創傷」。究竟是什麼呢？


  鏡頭再次回到打鬧現場，男友問餓了嗎？從冰箱拿出了前男友做好的漢堡排，兩人一起吃

  了。女主角接了一個視訊，說著「您好」、「聽不懂」。男友問了她什麼是「聽不懂」，

  她回答了。電影在女主角特寫中結束。


  故事於我最大令人好奇的點在於女主角在做這做那的選擇，因著這好奇可以一路看到最後

  。看到最後，才明白：也許沒有真的為什麼？若以電影名稱回想，則理解到女主角觀看自

  己做這做那的時候，像是她無聊時看著手機裡的直播畫面（如同電影中與片尾放映的那段

  納米比亞沙漠），看自己在自己生活中展演，看自己又怎麼了，看自己無謂的話語對別人

  造成的效，看、看、看。明明是自己的身體，自己的生活，卻沒有感覺。我私以為是一種

  類似解離的狀況，在沒有外力的狀態下時常解離，呈現一種靈魂出竅的意識。


  為什麼會處於那樣的狀態呢？看完我比原本看的時候更加好奇。與一樣看過這部片的友人

  深聊之後，發現她的朋友們更能直覺性地理解這片中的女主角，甚至可以說是「很像」。

  我回想了身邊的人，似乎真的沒辧法想出一個「很像」（頂多是某段讓我想到誰）。也許

  這就是這部片精準的地方，山中瑤子確實拍出了她想呈現的世代或者說某一種人生片段。


  總的來說，這部片於我是一個開啟視野的電影，很難說喜歡，但令人印象深刻，甚至未來

  有機會還會想二刷。比較無關而有意思的是電影裡出現幾位濱口愛用演員的客串，算是讓

  這部片少收讓我笑開的場景。



  ***


  這裡是我的樂園:




  --'
