url: https://www.ptt.cc/bbs/movie/M.1753353136.A.0DA.html
title: 'Re: [普雷] 納米比亞沙漠直播中Desert of Namibia'
content: '之後那個也很可憐

  別人墮胎關你屁事


  笑了



  納米比亞」這個國家的名稱，其實源自納米布沙漠，而「納米布」在納馬語中意為「廣闊

  的地方」或「沒有東西的地方」。 這個說法有時被一些人引申為「什麼都沒有」，但這

  不是納米比亞或納米布的真正涵義。



  翻了一下評論

  別人說是現代年輕人的寫照之類的東西

  導演採訪幾個人之類的

  基本上就是個女主角演得很好的電影

  其他都是只有味道跟意境 沒有劇情的拖沓陳悶 定格鏡頭長得要死的文藝片

  沒理由 也沒有病名的痛苦

  沒有戲劇化的過程跟理由

  滿臉不耐煩的神經病

  充分展現不知道要怎麼活著的年輕人的故事

  但

  嘛

  說真的很無聊

  天空不夠灰

  世界不夠慘

  難以共感他發神經的理由

  全片兩個小時又十七分鐘

  長得要死又空空的故事


  如果加長到三個小時的話

  會讓我想到另一部一樣對一個城市的痛苦描寫

  用觀看體驗的無趣跟沉悶讓你體會角色心境的電影

  但它美多了

  天空夠灰

  世界夠慘

  多線故事 有真的劇情

  某個叫滿州里的地方還有頭整天坐著的大象



  唯一讓我有印象的畫面是從粉紅背景的跑步機下來那裡

  旁觀 冷漠自己的人生的煩躁不在乎感

  很有力道










  --'
