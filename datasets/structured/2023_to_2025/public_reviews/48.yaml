title: '[好雷] 天才琴手(Prodigies/Prodigieuses)'
content: "防雷一下吧XD\n\n\n\n\n\n\n以下有雷\n\n\n\n\n\n\n===========================================================\n\
  \n之前無意間看到這部的預告片,\n覺得這個題材挺有趣的就打算看一下.\n整體而言步調穩健, 不至於讓人不耐.\n\n最重要的演奏部份拍得不錯,\n最後演奏會雙人聯彈那段構圖相當的漂亮.\n\
  雖不及當年鋼琴師(Shine)那樣具備魄力,\n不過劇中主角姊妹都已經嚴重關節炎了,\n肯定是不能套用拉赫曼尼諾夫那種拍法.\n\n我滿喜歡劇中老爸的表現,\n\
  從一開始把姊妹當作補足當年遺憾的替代品,\n到她們確診遺傳疾病導致無法再彈的逃避,\n到最後看到姊妹就算殘疾在身仍要彈琴的決心轉而支持.\n尤其那段衝去學校本來要拉人回家,\n\
  結果看到她們開心地彈琴瞬間由憤怒轉為欣慰,\n最後轉身默默離開(去生新的鋼琴回家XD),\n整個氣場轉變表現很不錯.\n\n而劇中姊妹一些小動作與講話方式可以看得出來有刻意練成一致,\n\
  但就如同真實的雙胞胎一樣,\n長相 說話 動作再像,\n還是有些許氣場上的差異,\n不熟悉的人可能無法很快認知,\n但熟人一下就感覺得出來.\n這點我認為詮釋很到位.\n\
  (就個人對雙胞胎的認知XD)\n\n最後姊妹發展出的省關節彈法看起來也很合理,\n身為一個有點肌腱炎的鍵盤使用者,\n酸痛的時候也是很常放棄標準打字姿勢偷用無名指代替小指去按ctrl\
  \ XD\n\n另外就是這部顏值相當高,\n尤其姊姊馬尾造型真的很不錯.\n只看畫面來講還是很讓人賞心悅目的.\n還有那個渣男指導教授顏值也是頗高XD\n\n\
  一些小細節像是\n這部家裡的鋼琴是Yamaha,\n學校琴房是Kawai,\n只有演奏廳裡的是Steinway & Sons.\n我還以為琴房裡面應該也會放(短一點的)Steinway\
  \ & Sons,\n果然是預算問題嗎?XD\n\n整體而言雖然劇情沒有什麼超大意外轉折,\n不過該講的都有講到,\n有交代一個完整的故事,\n個人認為值得一看.\n\
  \n======\n\n附帶一提,\n今天去A13看的那場有一家四口正片開始才進場,\n兩個小孩(看起來應該是3~4歲+5~6歲)看一半就撐不住了,\n一直發出聲音(我猜是想離開XD)\
  \ 其實很影響觀影.\n雖然有觀眾出聲制止, 父母也有一直制止小孩,\n不過小朋友畢竟不是完全可控沒辦法.\n\n我想並不是所有普遍級的片都適合帶小朋友進場啊(汗\n\
  可能還是要請各位父母進場前多評估一下.\n免得自己電影沒看到,\n也影響其他觀眾.\n\nPS: 類似的狀況我在看音速小子3有遇過 不過那就預料之內\n   \
  \ (不如說 小朋友可能才是主要觀眾 我這種老人只是插花的XD)\n\n--\n不錯看 推薦!"
