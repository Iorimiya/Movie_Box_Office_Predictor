title: '[普無雷] 會計師2:預告小殺人'
content: '會計師2本來是很期待的

  難得夜魔俠和罰叔又同台

  預告看起來又走歡樂風格

  令人耳目一新的感覺

  可惜預告把動作場面和搞笑戲份都剪出了一部份

  正片就多了一些這樣

  確實有相當搞笑的部分

  份量卻不多

  動作場面也沒有太多大殺特殺

  調查部份太多

  感覺有前陣子復仇反擊戰的感覺

  建議想看的別抱太大期望

  接下來等漫威的雷霆特攻隊了(?)


  --'
