url: https://www.ptt.cc/bbs/movie/M.1746203732.A.BEE.html
title: '[好雷] 會計師2'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  經過九年的等待，《會計師》的影迷終於能夠再與帥氣的自閉小班一起踏上瘋狂的冒險。

  這次，克里斯汀不但又要追查新的謎團，還帶上他在上一集末相認的弟弟，聯手送上笑料

  十足的動作爽片。



  克里斯汀沃夫具有破解複雜難題的天賦。當他發現得用更極端手段時，沃夫找來他久未連

  絡、同時是名頂尖殺手的弟弟布萊斯頓合作。



  既然電影開宗明義主線是與弟弟合作，整部片的劇情都圍繞在兄弟情，這也讓觀眾從另一

  個角度更認識布萊斯頓與克里斯汀。弟弟在第一集的戲份並不多，但已能讓人看出他是個

  「哥控」。可能由於爸爸過去交代他們「家人永遠優先」，但也或許布萊斯頓打從心底敬

  重且愛護這個在外人眼中看來古怪不已的哥哥。



  兩人在《會計師2》裡的互動與普通兄弟姊妹無異，不論多久沒聯絡、長多大，甚至克里

  斯汀有著需要人保護的社交障礙，在哥哥面前，弟弟永遠可以長不大。即便知道哥哥不喜

  歡自己的東西被隨便丟掉，布萊斯頓還是故意跟克里斯汀說自己要擦防曬乳，然後惡作劇

  地把防曬乳狠狠丟出，而哥哥也只是在嘴上唸並未發脾氣，就像一般的手足打鬧。



  大部分時候，弟弟都是嘻嘻哈哈的形象，但兩人獨處時，他還是小心翼翼地問克里斯汀，

  究竟是因為自己的緣故，還是哥哥的高功能自閉症讓他從來都不想與自己聯絡。急於知道

  答案的同時，布萊斯頓也害怕聽到不如預期的回答。兩人在牛仔餐廳的互動，更充分展現

  出深厚的兄弟情。看到克里斯汀突破自己，為了追求女生進入社交舞池，跳起舞來還真的

  有模有樣，弟弟不僅為他感到高興，還驕傲地向旁人炫耀，而哥哥也不惶多讓，受到挑釁

  時表示，打架能夠讓白天悶悶不樂的布萊斯頓開心，顯見兩人都非常在乎彼此。



  這場難得的餐廳戲，除了表現兄弟情之外，也發揮展現克里斯汀勇於改變的功能。電影開

  始沒多久，觀眾就看到他站在鏡子前，聽著手機內傳來賈絲婷的時尚建議，原來克里斯汀

  居然參加婚友社活動，希望為自己找個伴。甚至運用自己的統計與科技長才，希望成為當

  紅炸子雞，無奈一開口就破功，以失敗收場。但當故事走到後段，他不只記下舞步秀一波

  ，最後也成功拿到對方的聯絡方式，社交能力大躍進，絕對是兩集以來最顯著的角色成長

  。



  《會計師2》採雙線敘事，一為剛剛提到布萊斯頓與克里斯汀的兄弟情，二則是接手雷擔

  任財政部副局長的麥迪納與神秘女殺手之間的對峙。雖說三人的目標最初一致，都是為了

  調查雷被暗殺的原因，進而追查到失蹤的母子，但布萊斯頓過於直接暴力的殺手作為與克

  里斯汀雖有原則但也為達目的不擇手段，讓代表公部門的麥迪納不得不與兩人分道揚鑣。

  分開查案的過程中，觀眾也能看到不同的關鍵事證與進度，待最後兩條故事線再度交會在

  一起，一切謎團也隨之解開。



  雖然續集不如首集著重在「會計師」的專業上，但犯罪懸疑的情節還是一樣引人入勝。其

  中，扮演穿針引線大功臣的便是前一集末揭曉身分的女聲「賈絲婷」。她不但繼續為克里

  斯汀提供關鍵資訊，還在港灣神經科學中心組建一支駭客團隊，讓克里斯汀的查案功力大

  幅提升。這一集賈絲婷依舊無法開口說話，必須透過AI代勞，但在行動與人際互動上已有

  顯著進步，就連失蹤的男孩都是高功能自閉症患者，也埋下第三集關於這個駭客團隊能力

  是否如虎添翼的伏筆。



  如同第一集的開頭，一場不知所以的槍戰開啟一組待解的謎題。上一次抽絲剝繭後得知，

  最初槍口留人的是價值觀通過克里斯汀標準的副局長雷，兩人就此結下不解之緣；這一次

  開場的槍戰，不僅賜死雷，更預告本次的謎團除了雷的死因之外，尚有意外冷靜的女殺手

  身分。雖說不算太難猜到，但不同殺手組織之間錯縱複雜的關係，再加上女殺手的雇主其

  實正是她的仇人與失憶主因，意外讓觀影過程撲朔迷離。面對眾多角色，觀眾不到揭曉一

  切之時，不見得可以百分百掌握確切的角色關係，但最後又能讓人恍然大悟，一目瞭然，

  算是極為成功的推理劇本。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
