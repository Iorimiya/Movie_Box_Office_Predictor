url: https://www.ptt.cc/bbs/movie/M.1746113055.A.6EB.html
title: '[溫馨雷] 《會計師2》新風格型態佔領市場ing'
content: '出發前很煎熬，畢竟會2在這裡平均普評，不過還好有去看了，見證歷史的轉變XD



  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這部電影最後呈現的樣子很明顯不同於第一集，甚至很大程度《媽宇》的節奏；總之把電

  影最終輸出的狀態定義為此的那位決策者，應該偏向電影中布萊斯頓的性格，真的很想找

  人講話。


  同時有著肥皂劇的節奏，又有電影質感的堆疊與運鏡的電影已經出現蠻多在市場上，是不

  是一種新風格正在崛起，該說是有點宅宅的節奏嗎？


  藝術這東西真的很難定義，杜象的噴泉是藝術，畢卡索的牛要了解畢卡索的畫工之後才廣

  泛被接受，達利的版畫普普藝術在社會牛馬階級確實備受喜愛，並且確實討喜；那麼電影

  這門八大藝術有所謂邊界設定嗎？該是哪些？


  一邊在欣賞本會2時，心底時不時泛起這樣的念想，不過最終我以新風格型態為此下此篇

  心得感想的定論；觀賞《三體》時也是有這種感覺，不過《會計師2》稍微收斂一些，最

  後沒有一群IT們在搞笑，呵


  很喜歡兄弟倆大量跳脫電影你一句我一句的節奏安排，雖然這個笑點強度需要英文接近母

  語者才可以體會到更多細節，不過把一般正常不用明爭暗鬥家產的兄弟感情表演的活靈活

  現；很有趣也有點看不明白的地方＞為什麼可以隨便看老弟的手機？！


  這次觀賞《會計師2》會有一種整體感沒有整合完整，處處是不同風格的呈現，比較可惜

  ，但也許在歷史的記載上，會成為另一種風格，畢竟老哥沉穩的風格很明確，老弟吊兒啷

  當的風格也很明確，好像音樂圈在老歌新唱，但還沒找到一個過去傳統對於‘’電影‘’

  的定義，有點像是《唸你》這首歌帶給我的感覺嗎～～～～～～


  突然懷疑這樣的剪接風格，會不會是ADHD的視覺狀態呢！？


  雖然講了很多笑點偏向宅宅的風格，不過有些笑點確實有戳到，例如老哥下舞池跟著節奏

  跳舞那副不同於執業時的另一種自信、老弟把領養的夠勾的照片秀給老哥看那種現代人的

  既視感、老弟把老哥的防曬丟出去的賤樣、港灣神經科學中心的人在接任務時的競賽感、

  老哥去聯誼的戰略思維....是不是都是宅宅笑點...........




  Debug一下：

  1）戰爭那場煙霧的拍法，真的有拍到失焦，好幾次不曉得視覺焦點該擺在哪裡.........


  2）老弟不是右胸偏嘎吱窩那裡中彈嗎？怎麼最後在沙坑上，又好像那顆子彈傷頓時從穿

  甲彈變成一般小子彈.............


  3）字幕這次似乎有些翻譯錯誤？cob翻譯成卡博??


  貓皇萬歲！萬歲！萬萬歲！

  貓星人果然是星球噬魂者。


  --


  好奇～地球上的正常人如何定義？

  精神病患犯罪不能合理化，那麼非精神病患犯罪可以合理化？


  生孩子不就是怕小孩在社會上被欺負嗎～若港灣的孩子都能有港灣，誰都敢生了吧～


  確實一度懷疑這部片可能有拿國家生育率補助（咦？

  yeah 被認證。真。心得文SSR

  不曉得能不能說這是歐美的宅宅風，跟日本的質地不太相同但基本是一個方向AwAa


  好奇～DEI怎麼了？DEI不好嗎.....還是代表太政治正確了？'
