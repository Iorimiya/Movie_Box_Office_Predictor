title: '[好無雷] 會計師2特映觀後'
content: '首先依舊先聲明是特映會免費票來的


  其實我已經忘光第一集劇情了


  但是基本不影響觀影體驗


  整體劇情步調拿捏很好


  緊張、搞笑、動作的編排適當


  基本不會冷場或是感覺拖沓


  整場看下來，全場爆笑至少有個五六次


  笑點不少而且拳拳到肉


  至少有兩三卡我看到嘶出來


  算是很不錯的爽片啦


  主觀評價


  笑點：8/10


  打戲：8.5/10


  劇情：7/10 爽片不要太計較劇情，爽就對了


  至少沒什麽出戲的地方，感覺非常流暢


  以上


  --'
