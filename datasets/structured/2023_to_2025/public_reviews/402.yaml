url: https://www.ptt.cc/bbs/movie/M.1704770764.A.628.html
title: '[新聞] 班艾佛列克回歸主演《會計師 2》 '
content: "班艾佛列克回歸主演《會計師 2》鎖定三月開拍！有望 2025 年春季上映\n\n\n\n班艾佛列克（Ben Affleck）九年前領銜主演的動作懸疑電影《會計師》（The\n\
  Accountant）頗受觀眾歡迎，該片僅花費 4400 多萬美元製作，最終以 1.55 億美元票房\n作收，無論口碑或市場的商業收益，當時均取得不俗的迴響。這些年來，有關《會計師》\n\
  續集的計劃一直有在進行討論，而觀眾也相當樂見能再見到小班回鍋，如今，《會計師 2\n》似乎也總算要正式開拍。\n\n\n\n專門提供各大影視作品製作進度資訊的《Production\
  \ List》透露，《會計師 2》將會在\n 03 月 15 日於洛杉磯開拍，並依舊由《勇者無敵》（Warrior）導演-蓋文歐康諾（\nGavin O'Connor）回歸繼續執導，至於演員方面，目前則僅有小班一人出現在卡司名單上\n\
  。\n\n外媒《World of Reel》補充爆料，華納兄弟影業想安排《會計師 2》在 2025 年的春季\n檔上映，而權威媒體人丹尼爾瑞奇曼（Daniel\
  \ Richtman）則稱，剛替小班去年推出的自\n導自演作品《Air》處理完發行事宜的 Amazon，也有跟著參與《會計師 2》的製作。\n\n\n\n\n\
  --"
