  想法」




  經歷好一段時間的等待後，班艾佛列克主演的驚悚動作電影續集《會計師2》終於將在今

  年 4 月 25 日正式上映。最近接受《浮華世界》的訪談時，除了揭露更多來自《會計師2

  》的全新劇照之外，班艾佛列克以及導演蓋文歐康納都暗示了接下來推出《會計師3》的

  可能性。


  《會計師》導演蓋文歐康納表示：


  「我對於第三部電影已經有了很多想法。我已經構想了好幾年的時間了！」


  班艾佛列克則說：


  「我敏銳地察覺到，你似乎得要夠努力才能獲得拍攝另一部電影的機會。最糟糕的做法，

  就是刻意將一些好點子留到下一部電影中；如果你沒有在第一部電影中創造出能夠引起興

  趣的需求，那你最後就只能在空無一人的房子中獨自玩耍。」


  為何決定拍攝《會計師2》，班艾佛列克表示：


  「這是一部歷久不衰的電影，人們會談論它並說：『哦，嘿，我喜歡《會計師》！』對本

  片懷有很大的好感。」


  在過去的某段時期，片商只要對一部電影有著足夠的信心，就會在首部電影上映前搶先開

  始構思與續集有關的計劃，但在這個串流和數位平台漸漸在娛樂產業中獲得領導地位的時

  代中，要預測哪些電影能夠成功並不是一件容易的事，特別是一些隔了一段時間才推出的

  動作電影續集。


  雖然目前暫時無從確定《會計師2》的拍攝預算，但如果以上一集的 4400 萬美元預算計

  算，這部續集的票房可能至少得要達到 1 億美元才能達到回本。


  班艾佛列克接下來依然將會有一段非常繁忙的拍攝與宣傳行程，像是他與麥特戴蒙一起主

  演，並由喬卡納漢執導的全新警匪電影《RIP》目前已經進入了後製階段，此外，他也預

  計將會執導並主演另一部全新版本的《情婦》(Witness for the Prosecution) 電影，但

  本片的消息已經沉寂了好一段時間。


  不久之前，相關消息也證實了班艾佛列克將會主演並執導驚悚動作電影《Animals》，本

  片在最初的計劃中會由麥特戴蒙參與演出，然而，麥特戴蒙因為參與克里斯多福諾蘭的《

  奧德賽》而退出了這部電影的團隊，並改由吉蓮安德森與班艾佛列克一同參與。


  《會計師2》將於 4 月 25 日上映。


  --'
