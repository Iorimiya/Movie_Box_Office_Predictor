content: "★ 兄弟出擊，聯手算帳\n★ 班艾佛列克 、強柏恩瑟 強勢回歸\n★ 硬派震撼動作鉅獻\n★ 電影預告：\n\n真摯動人、爆笑連連，這歸功於 班艾佛列克和強柏恩瑟\
  \ 之間強烈的化學反應！-\nThe Film Maven / Kristen Lopez\n\n面對即將到來的致命陰謀\n有個人可以將這幅複雜拼圖拼湊起來：去找會計師\n\
  \n克里斯汀沃夫（班艾佛列克　飾演）具有破解複雜難題的天賦。當一位舊識慘遭謀殺，並\n留下一條「去找會計師」的神祕訊息後，沃夫不得不開始追查此案。當他發現得用更極端\n\
  手段時，沃夫找了他久未連絡、同時是名頂尖殺手的弟弟布萊斯頓（強柏恩瑟　飾演）合\n作。兄弟倆與美國財政部副局長瑪莉貝絲麥迪納（辛西亞艾黛羅賓森　飾演）聯手，一起\n\
  揭露這樁致命陰謀，卻讓他們成為冷血殺手集團的目標，這群殺手無所不用其極也要掩蓋\n秘密。\n\n《抽獎方式》\n4月19日 23:59前，推文留言分享想看的原因，就有機會獲得電影特映券\n\
  （如：台北場，我想看會計師2，想看最殺兄弟檔如何聯手打天下 ）\n\n《獎項內容》\n【會計師2】電影特映券（一組2張）\n\n《特映會場次》\n台北場：4/22（二）12:00\
  \ MUVIE CINEMAS台北松仁TITAN廳  X 15組\n此場採不對號入座\n\n《中獎通知》\n4月20日公布中獎者於回文內，並寄站內信通知得獎者得獎事宜。\n\
  請於4月21日12:00 前回覆領獎資訊，恕不接受逾期回覆。\n\n《注意事項》\n1.特映券為非賣品，嚴禁兜售等圖利行為。\n2.請準時入場觀賞，電影開演後10分鐘戲院與主辦單位有權謝絕入場。\n\
  3.如本活動因不可抗拒之特殊原因無法執行時，主辦單位有權決定取消、終止、修改或暫\n停本活動與延遲得獎公告。\n更多電影資訊：華納兄弟台灣粉絲團 \n\n--\n\
  \n--"
