url: https://www.ptt.cc/bbs/movie/M.1745476456.A.736.html
title: '[普雷]會計師2 一言難盡'
content: '先說結論


  個人覺得沒有第一集好看跟神秘


  好多感覺很多餘的片段


  看完只覺得劇情有點水


  也沒什麼高潮迭起













  -------以下有雷-------------






  故事劇情 某個政府官員被幹掉了


  他的同事想追查他死亡前沒處理完的案件


  一場家族失蹤案件


  去找會計師幫忙


  發現後面是人蛇集團在搞鬼


  透過稅務資料 發現走私的人都被送到某間店


  去當妓女或廉價勞工


  人蛇集團老闆怕被報復及曝光


  才開始一連串的殺人案件



  中後段 好像想聚焦兄弟倆的感情跟跟人設鋪陳


  花了大篇篇幅在與主案件無關的地方


  養狗的心理建設


  接到電話前的跟女人聊天


  酒吧跳舞


  最後連槍戰都是打小嘍囉


  唯一一個好像很強的殺手


  兩三下就掰了


  連槍戰都搞得好像是 大男孩想玩槍


  安排個大場面帥一下好了



  案情到後面其實不關會計師的事了


  連政府官員在中間都放棄跟會計師合作


  但陰錯陽差 會計師知道官員要被針對


  才回去救火



  整部片讓我覺得更像要在營造世界觀


  來為後續腳色出場 或續集鋪路


  弟弟任職的殺手公司


  哥哥毀滅大師的稱號


  半路出家的殺手什麼都不記得


  卻能被殺手公司僱傭 發包


  哥哥贊助的治療中心變成高科技後勤部隊



  有夠像在看捍衛任務續集


  開始填充一堆東西


  導致主線其實根本被模糊


  那失蹤案件根本沒人需要處理


  當你成為殺手時 卻連自己的孩子都要別人救


  這孩子的價值真得低的可憐


  看到後面一言難盡


  好像什麼都講了 又好像什麼都沒講



  想看兩個中年男子的嘴砲 可能會滿意


  想看詭譎的劇情 主角的高智商解謎


  好像又有點沒什麼東西



  整篇打完不知道自己寫了什麼


  也不知道自己看了三小


  第一集感覺是虎頭蛇尾


  第二集是畫虎不成反類犬


  這狗還肥到靠北的那種


  兩個小時的片阿


  要情感沒情感 要劇情沒劇情


  要世界觀多到不知道拍這些幹什麼


  希望我們多關心被誤認自閉症的天才嗎



  真的想知道這部片在其他觀眾眼中的感覺


  個人覺得好像為了賺錢才拍的片


  很硬要的那種


  沒有兩位男主 我應該給負雷吧


  直接演蝙蝠俠與制裁者


  一路扁一路嘴砲會不會更好看?????


  --

  覺得沒有到很爽

  幫弟弟鋪人設吧

  我也覺得剪輯很跳 上一秒主線 下一秒哥倆在聊天 在喝酒

  這則推文比劇情精彩 XDDDD

  我是抱著第一集還算不錯去補票的心進場的...

  因為整部片有夠沒記憶點的'
