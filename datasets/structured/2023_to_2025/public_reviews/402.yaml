content: '這部劇情滿亂的，漏看或忘掉一點，會有點接不上，大概只能腦補一些來解釋


  班?


  也許是轉變為私家偵探的雷，其委託案件的委託人，就是犯罪集團，這個集團其原因是想

  找到anais並殺掉她，然後再殺掉雷滅口，以防事跡敗露。從店外狙擊手都想殺掉兩人來

  看，應該是個合理解釋之一



  ？


  雷是想測試一下anais的狀況，並嘗試想說明她的身世及後天學者症候群等等。


  是?


  這大概就劇情需要，在中後段才讓anais開始閃回記憶。


  果


  大概4這樣



  這點大概可能原因是，職業殺手市場的規範只能殺掉合約上的人。



  （?

  ？


  這也許是翻譯的鍋，可能這句話有應對沒有翻譯出來的台詞，且關於孩童的劇情，當然也

  不排除給兩兄弟暗示有孩童集中營，但有點牽強。



  ？?


  這在雷的家中，與梅迪遜打鬥時好像有提到她已經不是原本的她了，我想anais也許覺得

  相認會讓孩子受苦。


  跟


  大概4這樣


