url: https://www.ptt.cc/bbs/movie/M.1745587505.A.9A2.html
title: '[算好雷] 會計師2 - 缺憾的美'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~













  今天去看會計師2，總結來說我覺得算是符合預期的，整個劇情 flow 就是標準動作爽片，打戲、槍戰、駭客劇情都給來一點，但不會滿到看得心很累的程度，因此我給偏好雷XD


  如同很多貼文所說，主角變化在第二集很大，有點失去特色。我個人解讀比較偏向是主角在嘗試「社會化」，分析/模仿一般人的行為，但在一些橋段中還是有表現出主角比較偏執的一面。要說失去個人特色嗎，如果沒有看過第一集可能就不會注意到主角的偏執，或是不會看氣氛場合的一面，以這個角度來看，的確有點失去特色沒錯。


  這部戲我比較印象深刻的地方，在主角兄弟二人，以及女殺手的親情線部分。從主角兄弟兩人的對話，以及主角弟弟（以下簡稱阿布）想要寵物的橋段來說，讓我當下有感受到兄弟兩人都在追求一些生命中沒有的東西，彌補自己的缺憾

  1. 主角想要像正常人一樣，並與人有連結，也在練習讓自己像個正常人

  2. 阿布雖然「選擇」獨來獨往，但他內心仍然期待「someone is waiting for him/ he is matter/someone need him/
  family」之類的（有點忘記當下的印象是哪一個），所以他選擇要一隻寵物，也非常希望自己可以盡快得到，片中也不只一次詢問老哥為啥都不聯絡他等等，並一而再、再而三的支持他的哥哥。（最後一場槍戰雖然不明顯，但兩人有演出絕佳的默契，我覺得很讚）


  最後是女殺手的部分，鏡頭導到撕掉的照片，內心有稍微揪了一下。我不確定殺手是認為兒子已經死了，還是放棄這個兒子，用現在的身分活下去。但不管是哪一種，都已經成為了生命中的缺憾，令我感到惋惜。


  整體來說，1 我覺得偏向劇情片，氣氛比較壓抑，但劇情在最後很有驚喜感，劇本也很有解謎感。

  2 劇情普通，沒有什麼驚喜，幾乎都是預期內的事，頂多就是不確定什麼時候被爆頭的驚嚇，基本上就是純粹就是動作片，但我喜歡親情線的處理，不落俗套。還有動作片元素每種口味都來一點，沒有各種瘋狂暴力的肉搏戰塞好塞滿，對我個人來說很加分
  XD


  總結來說就是想去電影院但不知道要看什麼，又不想花腦力，可以考慮找一部！

