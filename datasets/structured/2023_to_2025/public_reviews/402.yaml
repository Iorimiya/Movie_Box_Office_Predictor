url: https://www.ptt.cc/bbs/movie/M.1745502371.A.93C.html
title: '[  雷] 會計師2   期望太高'
content: "雷文防雷資訊頁\n \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n \n\
  \ \n \n \n \n雷文防雷資訊頁\n \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \ \n \n \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n \n \n\
  \n對於一個把會計師（2016）反覆刷到劇情倒背如流的觀眾來說\n續集第一天就直衝戲院是很正常不過的事\n在第一集的劇情，會計師只是表面，實則是一部自閉症兒童成長的電影\n\
  我甚至好幾次推薦自閉症兒童家長觀看，當然不是要他們小孩去當殺手，而是鼓勵自閉症兒\n童能夠適應這個社會\n第一集用了非常大的篇幅講了自閉症會有什麼現象，從開場的反面拼拼圖，到那句找不到拼\n\
  圖抓狂的「I need to finish」\n不善溝通與人際、對事物異常執著、有固定習慣、對於衣服毛料很敏感\n再搭配那把大狙擊巴雷特，一開始超遠狙擊給農場主看，之後最終決戰的13響禮砲真的爽！\n\
  \n\n可是到了續集呢\n\n我離開戲院的第一感覺「就這？」\n為了塞一個弟弟進來，怎麼劇情就垮了\n增加弟弟的戲，是為了1.增加火力 2.嘴砲 3.完整世界觀？\n\
  兄弟情真的是為拍而拍，就算弟弟的戲全部砍掉好像也沒差\n牛仔酒吧還有露營車屋頂這兩場戲看得真的好想趕快跳過\n還有貓奴狗奴，這加進來也不知道有什麼意義\n\n\
  神經中心的片段算是呼應上一集最後的超級電腦可以駭進五角大廈的預言\n只是那幾個新增加的小鬼頭，你們可不可以演的像自閉症一點，戴個耳麥打電腦就像個普通\n宅宅而已\n\
  你們不是做不到欸，語音女的人設就很成功啊\n\n最後大戰喔，就普通好萊塢槍戰，比起上次的巴雷特禮砲，至少這次弟弟有用迫擊砲轟個幾\n響吧\n\n正當我以為就這樣的時候，最後那首詩還得是從小班口中說出來\n\
  「所羅門蘭迪，星期一出生，星期二受洗，星期三結婚，星期四生病，星期五病重，星期六\n死去，星期日下葬，這就是所羅門蘭迪的結局。」\n瞬間感覺又拉回來了，好像又救回來一部分\n\
  \n個人主觀評分：8/10 (所羅門蘭迪的詩直接加1分)\n\n--"
