url: https://www.ptt.cc/bbs/movie/M.1745570031.A.F68.html
title: '[請益] 會計師2多個問題（劇情雷）'
content: '防雷！！！！！







  先說我是下班後有點累去看這部

  細節都沒仔細看

  所以問題超多


  1. 退休局長為什麼要找失蹤家庭？是誰委託他的？而且找一個殺手幫忙？根據後來小班看

  他蒐集的資料，感覺局長也知道了女殺手的真實身份，那找殺手的舉動不是多此一舉嗎？


  2. 延伸1 殺手看到局長拿出的照片無感，後來去殺女黑人副局長再看到照片就哭了，是什

  麼促使她想起來？


  3. 人口販賣老闆要滅口女殺手合理，但為什麼也要殺了退休局長？

  （我後來猜委託人就是人口販賣老闆，為了找到殺手，但老局長知道太多乾脆殺了，如果有

  錯請指正）


  4. 女殺手以前去執行一個任務裡也有害她的老闆，為什麼只殺另外兩人不殺他？


  5. 兄弟找妓女的時候，講了一串聽不懂的語言後說一句什麼事件不乾我們的事就走了（這

  邊漏看），留下來的女生說：我沒有孩子。後來小班也一直想這句話，但有得到解釋嗎？


  5. 既然殺手都恢復記憶了，小班也告訴她兒子在集中營，怎麼完全沒有要去救的打算？而

  後來再告訴她販賣頭子位子就直接殺去了，這時也把照片自己的部分被撕掉，是代表要跟過

  去說再見嗎？




  --'
