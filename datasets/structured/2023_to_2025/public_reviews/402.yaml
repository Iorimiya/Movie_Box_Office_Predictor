title: '[新聞]等了快十年！班艾佛列克《會計師 2》檔期'
content: '新聞網址：





  今年三月，由 班·艾佛列克（Ben Affleck）主演的動作片《會計師》（The Accountant

  ）續集版權正式宣布轉售給 Amazon 和 米高梅影業，如今終於敲定檔期。根據《

  Deadline》報導，這部期盼許久的續集將於 2025 年 4 月 25 日上映。


  截至目前，《會計師 2》是這個檔期唯一一部排程上映的電影。由於今年由千黛雅（

  Zendaya）主演的小成本電影《挑戰者》（Challengers）亦在同日期上映，取得了不俗口

  碑與票房，這讓《會計師 2》在漫威大片《雷霆特攻隊*》（Thunderbolts*）上映前一周

  ，有望搶先在票房取得一席之地。

  除了小班和導演 蓋文·歐康納（Gavin O''Connor）外，包括強柏恩瑟（Jon Bernthal）

  、J.K. 辛蒙斯（J.K. Simmons）、辛西亞艾黛羅賓森（Cynthia Addai-Robinson）等前

  作卡司都將回歸。此外，小班這回也將與好友麥特戴蒙（Matt Damon）共同擔任製作，他

  們共組了一家 Artists Equity 製片公司。


  《會計師 2》劇情描述 麥迪娜（羅賓森 飾）的前老闆遭不明身份的刺客殺害，使她被迫

  求助於克里斯欽（艾佛列克 飾）解開這起謀殺案，而在關係疏離但身手不凡的親兄弟布

  萊斯（柏恩瑟 飾）的幫助下，克里斯欽則運用他的機智和非法手段，試圖拼湊出未解線

  索。隨著他們愈來愈接近真相，三人也引起一群致命殺手的虎視眈眈，想阻止他們揭開所

  有謎底。


  = =


  聽說今天的流量密碼是這三個字


  --'
