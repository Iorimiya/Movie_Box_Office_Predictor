url: https://www.ptt.cc/bbs/movie/M.1753716872.A.514.html
title: '[爛雷] 會計師2'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  文戲跟侏儸紀世界一樣落落長


  但是文戲表現比侏儸紀世界好


  侏儸紀世界除了正常的恐龍根本一坨屎




  真的不知道該怎麼說耶


  我覺得第一集很好看


  但是第二集到底在幹嘛阿


  原先的女主角不見了


  幕後的女幫手好像也換人了?


  主角鮮明的個性也慢慢被淡化掉


  第一集的刺激打戲在這集變得很枯燥


  特色都不見了拉



  但是因為新的女殺手的出現


  男主角開始把妹


  跟弟弟互動也變比較溫暖


  新的小孩加入海港城




  我居然還是很期待第三集耶~~~



  反正拍是拍定了吧


  而且那個後天型學者症的女殺手一定是同一陣線的


  感覺很刺激







  --'
