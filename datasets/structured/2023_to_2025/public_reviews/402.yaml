url: https://www.ptt.cc/bbs/movie/M.1630643360.A.D77.html
title: '[新聞] 班艾佛列克、強柏恩瑟將回歸《會計師2》並且有望成為三部曲'
content: "新聞網址：\n\n\n2021/09/03｜新聞快訊\nby hsphere追蹤\n\n\n由《勇者無敵》（Warrior）導演蓋文歐康納（Gavin\
  \ O’Connor）執導、班艾佛列克（\nBen Affleck）主演的《會計師》（The Accountant）在 2016 年上映後就獲得不錯的評\n價，反差的職業設計與扎實的動作設計，開創了一個值得延伸續集的基調，隔年就有傳出\n\
  續集消息，事隔 4 年，導演蓋文在接受 CinemaBlend 的 Podcast 節目 ReelBlend\n訪問時再次更新了最新進度：\n\n\n「\n\n\
  ，所以第二集強柏恩瑟（Jon Bernthal）也會有更多的戲份，至於第三集\n，我稱它作《雨人》類固醇版，故事將會是關於這對兄弟，這對奇怪的夥伴，第三集會是\n\
  一部搭擋作品。」\n\n\n看起來第二集主要會描述強柏恩瑟飾演的角色布萊克斯，第三集才會結合這對兄弟在\n 2016 年時導演蓋文就有透露他有一些續集的想法，但如今反而會演變成一個完整的三部\n\
  曲，可惜蓋文並沒有在節目當中再多透露更多的消息。\n\n\n《會計師》描述班艾佛列克飾演的角色克里斯丁沃夫從小就是一名奇特的天才，沈默寡言\n同時有著嚴重的社交問題，在會計師的表面下，克里斯丁有著更不為人知的身份，透過這\n\
  兩個角色讓他總能完成任務以及全身而退。\n\n\n--\n\n回歸之路我覺得有點悶...\n\n預算 2100萬～2500萬美元\n票房 1470萬美元\n\n\
  --"
