url: https://www.ptt.cc/bbs/movie/M.1741611271.A.29F.html
title: '[新聞] 《會計師2》大獲媒體好評：沒上集嚴肅'
content: '歷時九年籌製，找回辛西亞艾黛羅賓森（Cynthia Addai-Robinson）、J.K. 辛蒙斯（

  J.K. Simmons）、強柏恩瑟（Jon Bernthal）、班艾佛列克（Ben Affleck）等原班人馬

  主演的《會計師2》（The Accountant 2）日前在西南偏南藝術節舉行了全球首映，

  而首映結束後，媒體評價也隨即解禁，就目前來看，各家給予的評價頗高，整體口碑是

  正面的。




  「《會計師2》純粹就是看蓋文歐康諾（導演）、班艾佛列克和強柏恩瑟拍爽的，兩位演員

  之間的化學反應，徹底搶走了故事主軸謎題的焦點，因而創造出一部沒那麼嚴肅、寫實

  之餘仍然充滿樂趣的續集。」




  「《會計師2》有一半的成份是犯罪驚悚片，一半是警探拍檔片，而我想說我更喜歡後者，

  因為後者的橋段帶來了一些超好笑的經典時刻。班艾佛列克和強柏恩瑟讓這部電影的

  每一分每一秒都值回票價，無論是他們打嘴砲還是出動開戰，都叫人無比享受。」




  「《會計師2》太棒了！艾佛列克和柏恩瑟的合作讓我更加享受這集。最大的驚喜是這部

  電影從頭到尾都非常好笑，故事主軸的謎團並不是處理得很合格，但動作戲和兄弟情的

  互動彌補了這點。」




  「《會計師2》捨棄了犯罪劇情片的調調，換來了一場兄弟公路之旅，而且我不知道我其實

  很想看！劇情的賭注更高，喜劇性也更強，最後的 30 分鐘給了我今年最喜歡的動作戲

  片段！班和強有著不可思議的化學反應，而我還想再看到一百萬次這樣的演出！」




  「我不得不說《會計師2》是本屆藝術節最棒的群眾體驗！大家都笑開懷、熱烈鼓掌和給予

  歡呼！這是一部相隔多年的傑出動作驚悚續集，班和強是完美的組合！一定要進戲院和

  群眾一起觀看！實在太娛樂了！」




  「《會計師2》裡面有閃電約會又有西部排舞，這對兄弟為本屆藝術節帶來了巨大的驚喜。

  希望他們再拍個二十集。」





  「《會計師2》在減少真正的會計戲份的同時，也追加了更多樂趣。 這次故事更聚焦，

  第三幕帶來的滿足感更大，卡司之間的化學反應更是提升了一切。每部電影都有強過其它

  部的優點，而我已經可以預見，會有很多人因為柏恩瑟和艾佛列克的火花而更喜歡第二集。

  」




  「好吧，我真的很驚訝。 《會計師 2》幾乎各方面都勝過第一集，該片主要仰賴班艾佛列

  克

  和強柏恩瑟的迷人化學反應，使這集更像是一部拍檔喜劇，而不是動作片。不過當然，

  只要動作戲一上演，表現則依舊猛烈且精準。話雖如此，更加人性化的輕快時刻，才是

  使這部電影更具娛樂性且叫人難忘的關鍵。我並沒有特別指望出第二集，但現在我迫不

  及待想看第三集。」


  本集依舊由《勇者無敵》（Warrior）導演-蓋文歐康諾（Gavin O''Connor）執導，前作編劇

  -

  比爾德布克（Bill Dubuque）執筆劇本，故事則敘述羅賓森飾演的「麥迪娜」其前老闆，

  遭到不明身份的刺客殺害，使她被迫求助於克里斯欽解開這起謀殺案，而在關係疏離、但

  身手不凡的親兄弟布萊斯頓的幫助下，克里斯欽則運用他的機智和非法手段，試圖拼湊出

  未解線索。隨著他們愈來愈接近真相，三人也引起一群致命殺手的虎視眈眈，想阻止他們

  揭開所有謎底。北美預定 04 月 25 日上映，台灣則於 04 月 24 日搶先登場。


  ———————————————————————


  心得：看起來美國票房有機會超越第一集？

  希望台灣也能比照辦理！

  也期待艾佛列克與柏恩瑟這兩位男星，能盡快獲得奧斯卡演技獎的肯定（至少先獲得提名）


  --'
