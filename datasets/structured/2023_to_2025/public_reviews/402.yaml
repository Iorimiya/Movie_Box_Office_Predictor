title: '[新聞] 終於等到！《會計師2》上映日期正式確定'
content: "新聞網址：\n\n\n\n\n終於等到！《會計師2》上映日期正式確定　班艾佛列克回歸主演\n\n\n\n記者邱晟軒／綜合報導\n\n睽違將近 10\
  \ 年！由蓋文·歐康納（Gavin O’Connor）執導、班·艾佛列克主演的2016年\n電影《會計師》在年初傳出將推出最新續集，如今正式確定了上映日期，將於\
  \ 2025 年 4\n月 25 日上映。\n\n根據美國娛樂媒體《Deadline》報導，Amazon 和 米高梅影業正式敲定《會計師2》將於\n 2025\
  \ 年 4 月 25 日上映。目前該檔期並無其他強勁競爭對手，但隔週將遇上漫威電影《\n雷霆特攻隊》（Thunderbolts），兩者之間的票房競爭頗受期待。\n\
  \n\n在2016年備受好評的《會計師》中，班·艾佛列克飾演的主角克里斯汀·沃夫是一位患有自\n閉症的會計師。不過，從小就展現出非凡的數字天賦和認知能力的他，表面上是普通會計師\n\
  的他，實際上卻擁有超強戰鬥能力，同時間還為全球多個危險。\n\n《會計師2》的劇情承接前作，講述財政部探員麥迪娜（辛西婭·亞德溫·羅賓遜飾）在上\n司遇刺後，不得不向克里斯汀求助調查。在與疏遠多年的弟弟（強·柏恩瑟飾）合作下，克\n\
  里斯汀運用非凡智慧和非常手段，逐步揭開謀殺案真相。然而，隨著調查深入，他們也引來\n了致命殺手的注意。\n\n《會計師》於2016年由華納兄弟發行，全球票房斬獲1.55億美元，廣受好評。續集不僅有班\n\
  ·艾佛列克、強·柏恩瑟和辛西婭·亞德溫·羅賓遜、J·K·西蒙斯等原班人馬回歸，還新\n增了丹妮拉·皮內達、艾利森·羅伯遜和格蘭特·哈維等演員加盟。\n\n\n\n\
  \n\n--"
