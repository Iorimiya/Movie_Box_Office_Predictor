title: '[好雷] 死侍與金鋼狼 雙主角都帥'
content: '防雷













  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這部我承認是為了Ryan Reynolds看的

  這次不只有Deadpool爛皮的樣子，還有很多Ryan帥氣的臉龐出來

  還提到愛情限時簽！我就是因為這部開始喜歡Ryan的 帥慘！





  這次跟金鋼狼合體很有1+1>>2的效果

  以前一二集好像沒人制得了死侍的賤嘴，這次對上金鋼狼

  嘴上功夫跟武打功夫都讓死侍踢到鐵板，還真的是第一次看他這樣

  此外還帶超濃厚的Bromance！！有幾幕明明在互毆卻莫名有浪漫感飄出，很特別

  電影鏡頭還特寫了兩個主角養眼鏡頭，導演真的很懂！！

  （類似這樣）



  很喜歡這部死侍風格＋漫威＋福斯大亂鬥的組合，不過故事線跟手法都疏理的很清晰，

  可以秒懂現在是TVA、多重宇宙、虛無之地、不同時空的情境

  結尾拯救了死侍的世界，拉著金鋼狼一起在他小小朋友圈享受快樂時光

  連凡妮莎都跟死侍復合了，完全是賀歲片的溫馨感啊～看完覺得很滿足


  X戰警裡好多經典反派也來客串，雖然我一時叫不出名字，但就是知道電影台看過XD 很有

  親切感

  死侍標準嘴砲風也是發揮得很好，除了諷刺福斯、還順便酸迪士尼，三不五時再塞個梗！

  Avril、哈利波特分類帽、冰雪奇緣都來了，Do You Want to Build a Snowman我直接笑

  出來！


  我心中的另一個主角dogpool，被他的舌頭可愛爆擊，來個外傳，三個一起出任務絕對看

  爆～




  另外雖然 Ladypool 沒有露臉但聽聲音

  跟看 IG Blake Lively 發的接吻照，應該就是她本人了吧！



  --'
