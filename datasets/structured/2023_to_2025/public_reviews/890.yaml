title: '[討論] 死侍與金鋼狼 海報版本'
content: "死侍與金鋼狼倒數兩週上線\n宣傳期也發了不少海報版本，很多張都很有特色\n\n對鍊款，預售贈品也領得到\n\n\nSwifties友情手環款\n\
  這版出來不知道是不是又在暗示Taylor會演 (很期待）\n\n\n特殊影廳款\n\n\n\n\n泰國撒瓦迪卡款\n\n\n\n真的是泰瘋狂的設計\n特別是泰拳那張\n\
  \n童趣風\n\n這張貌似在美國預購款有在發，也好想收藏好可愛\n\n最新IMAX款\n\nemoji打出deadpool、worsties直接笑噴\n不知道有沒有其他人看出裡面有藏什麼彩蛋\n\
  \n美女死侍與野獸金鋼狼款\n\n\n出這麼多版而且每個設計都有巧思，都想來一張\n大家最喜歡哪版？希望有機會能收藏得到\n\n--\n           \
