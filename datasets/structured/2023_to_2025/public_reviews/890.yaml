url: https://www.ptt.cc/bbs/movie/M.1719051525.A.0D0.html
title: '[新聞] 能否拯救漫威？《死侍與金鋼狼》導演：'
content: '能否拯救漫威？《死侍與金鋼狼》導演：本片不像任何漫威電影


  Yahoo奇摩電影戲劇編輯部


  2024年6月21日 週五 上午8:05




  《死侍與金鋼狼》（圖：Disney/Marvel）


  1. 自無限傳奇落幕以來，漫威連連栽跟頭。


  2. 金鋼狼再次披掛上陣，卻遇上青黃不接。


  3. 作為今年唯一新作，本片能否力挽狂瀾？


  【文／血紅蘭姆】


  世人無不期待《死侍與金鋼狼》能成為漫威救世主，好拯救漫威銀幕宇宙脫離目前困境，

  但導演薛恩李維直言，本片跟所有漫威電影都大相徑庭。


  自從漫威無限傳奇落幕以來，漫威銀幕宇宙便逐漸步入低潮。


  復仇者聯盟已長達五年未曾現身大銀幕，新角色則一個接一個登場亮相，卻各自為政、一

  盤散沙，再加上「」強納森梅傑斯因家暴案而被掃地出門，也讓漫威銀幕宇宙始

  終缺乏核心主軸。


  另一方面，在迪士尼2019年正式收購福斯之後，粉絲一直好奇強調限制級色彩的《死侍》

  系列電影，又能為向來主攻親子家庭路線的迪士尼注入何種全新風味。


  何況片中還用上了時變局、多重宇宙等漫威銀幕宇宙元素，也更加令影迷期待萬分。




  《死侍與金鋼狼》（圖：Disney/Marvel）


  沒想到在萊恩雷諾斯首次轉戰漫威本家、休傑克曼再次披掛上陣之下，竟然剛好遇上漫威

  銀幕宇宙青黃不接的時期，《死侍與金鋼狼》還是今年唯一推出的漫威新片，也讓影迷益

  發好奇片中主打的「」一詞是否有辦法成真。


  談到漫威銀幕宇宙近來連連栽跟頭，《死侍與金鋼狼》導演薛恩李維向Total Film解釋道

  ：


  「我們從來沒想到會遇上這個獨特時刻，人們都在問漫威銀幕宇宙究竟還具有什麼意義。

  它仍能為我們帶來驚喜嗎？它能以超乎預料的方式打破窠臼嗎？我們肯定希望本片能回答

  這些問題。」


  「在凱文費吉一手打造之下，漫威銀幕宇宙以一連串的成功創下歷史，但文化自有其潮起

  潮落。我們很清楚，你不能老是一再重覆，又期待人們還能抱有相同的興奮之情。意外的

  是，到頭來一切都很奏效，因為本片跟任何漫威銀幕宇宙電影都截然不同。而我自己也是

  許多漫威銀幕宇宙電影的大粉絲。」


  至於片中主打的「」一詞，正巧跟漫威銀幕宇宙當前困境不謀而合，薛恩李維坦

  承：


  「我很樂意為這些類似之處居功。其中有些部份是我們刻意為之，但有些部份則只是巧合

  ，我們早在兩年前就想出了『漫威耶穌』一詞。當一切進行得很順利時，人們都很喜歡一

  窩蜂地跟風，不過當事情轉為負面時則更是如此。」


  《死侍與金鋼狼》將於2024年7月24日在台上映。


