url: https://www.ptt.cc/bbs/movie/M.1722605333.A.B0F.html
title: 'Re: [討論] 死侍與金鋼狼的tva問題?'
content: ':

  幫你空格雷























  為什麼tva可以讓復仇者聯盟回到過去拿寶石



  只看洛基影集第一集

  所以單純用電影宇宙解


  TVA福斯宇宙分區中階管理經理

  悖論先生在跟死侍講

  你成為TVA探員

  就可以不用管自己原生宇宙

  用的例子就是金鋼狼

  而金鋼狼是整個福斯X戰警的錨定者

  意思是貫串整個X戰警系列前後及外傳

  而由於金鋼狼們最終都會自我毀滅

  而導致所有福斯X宇宙終將消散

  只是這過程對TVA來說長達千年

  而悖論懶得在這種必將消失的宇宙專案

  浪費千年時光才引發事件


  而這個事件最終造就原本墮落廢材

  變成一個真正英雄的金鋼狼

  而高級專員獵人B-15

  (那位高階黑人女主管)

  就說他們跨越時空事件

  金鋼狼集體自我毀滅的結果已經被改變而他回去救原宇宙X戰警意義不大

  還可能造成另一個分支產生

  因為X戰警們終將在大多宇宙續存

  意思也是新的X戰警電影會再現






  -----

  Sent from JPTT on my Xiaomi 22111317G.


  --'
