url: https://www.ptt.cc/bbs/movie/M.1721807382.A.72D.html
title: '[無雷] 死侍與金鋼狼  失望遠遠大於期望'
content: '其實本來是想分無雷跟有雷區


  但後來想想覺得


  想說的甚至應該都不需要提到劇情的部分就可以說完了


  當然也是因為今天是颱風天


  應該很多人要等到明後天甚至週末才能看


  所以就還是盡量保留一點內容 也預防有人誤觸被雷到



  事前聲明一下 這篇文不會提到任何關於劇情的部分


  但會提到官方預告有釋出的一些部分


  如果你是連預告都沒看想保留100%驚喜的


  那我建議你也先略過這篇



  好了正文開始



  首先 看標題應該已經可以知道我的感想


  這次的死侍還是沒能成為漫威救世主


  至少以我的標準和評估來看 應該很難


  尤其昨天看爛番茄開盤就只有80%


  以往漫威電影除非是真的很糟糕的幾部 不然幾乎都9X%開盤再往下修


  而這次顯然是有點玩過頭了



  不過我先提我認為大家比較在乎的部分


  彩蛋跟客串多不多


  多  應該不會讓期待看到客串的人失望


  (但我也不能保證每個人都能看到他期望看到的)

  (而且預告中有個大家在猜的謎團 應該也沒有實際揭曉)


  很多先前網路上有猜到 或者沒猜到的都有出現


  而且在戲中的占比也不會讓你覺得只是來露個臉這樣


  基本都有發揮到


  但坦白說 我認為整體看下來


  這可能反而變成這部片沒能達到期望的原因之一


  這就要提到這部片的導演 Shawn Levy


  他的說故事能力一直讓我很擔心


  結果這部片果然印證了我的擔心


  現在他給我的感覺就像是導演界的Jimmy Fallon


  本身談不上有料 但總是能找到大咖外掛來幫他撐場面


  這部片就是有滿滿的外掛 但還是把整整120分的菜色


  硬是炒成不到80分


  即便有很多讓人驚喜的人物出現


  但他們的出現既無頭也無尾


  無頭還可以接受 畢竟整個故事的環境就是那樣


  但最後絕大多數的角色就... 啊 就降?


  具體狀況未免爆雷我當然就不提了


  但如果你很在意每個登場角色的狀況


  你也會跟我一樣一頭霧水


  如果要給這部份下個結語 那就是


  如果蜘蛛人無家日有70%的賣點是情懷


  那這部大概至少有80%


  但就真的只是來賣情懷的 不要期待更多了



  再來另一點大家應該會在意的


  就是這部片有沒有放開來拍


  畢竟已經回到米老鼠旗下 大家都擔心是不是會綁手綁腳


  事實證明 並沒有 甚至 還玩過頭了


  這部片打破第四道牆 笑話 血漿 比起前兩部只有更多


  多到我認為已經有點影響觀影體驗了


  我不是那種很保守 只想看角色好好講故事的人


  但如果玩梗 講幹話的比例已經多到


  連主線故事的敘事都有點混亂的時候


  那真的就不是一件好事了


  整部片下來經常會有的狀況是


  角色碰頭 開始講幹話 玩梗


  講著講著 就突然做了某個決定


  然後就推進到下個橋段


  非常突然 連好好鋪陳情緒的時間都沒有


  尤其是某些角色 大家可能都很久沒看到了


  多少會期待他可以稍微提一些背景故事


  或者有一些情節可以讓大家重溫這個角色


  但沒有 幾乎除了對話就是打鬥


  節奏快到我都覺得有點莫名其妙


  而對話內容跟打鬥也不是都非常高品質


  對話的部分就像我上面說的 夾雜太多玩梗跟笑話


  打鬥的話 看得出來導演盡力了


  嚴格來說該有的都有 但真的 亂


  而且缺乏重點 有幾段甚至有點冗長


  比如說最終預告最後面的那個橋段


  大家應該都期待兩人在正片會有充滿情緒和感情的交流


  但我覺得多數人看了正片後應該會非常失望


  文戲跟打戲的比例真的是有點失調


  即便以爽片的標準來說都是


  最諷刺的是 萊恩雷諾斯本人還在宣傳的時候


  說這部片後半段會著重在情感層面 會是非常感人的


  但我卻完完全全沒有感受到


  如果要給這部份下個結語


  那就是 這部片就是100%的爆米花片


  請抱著看精彩動作和笑話 玩梗的期待進場


  其他的...就算了



  最後 講一下這部片的劇情和格局


  說真的 主線劇情真的沒什麼好說的


  如果你把所有的預告都看過 那你大概可以猜到個6成


  YT上一堆分析影片我覺得甚至可能都猜到了有8成的劇情


  對 就是這麼好猜


  所以我才說沒什麼值得雷的地方


  真的值得藏的大概只有客串角色


  坦白說 鋪陳了這麼久的作品 還被給予如此高度的重視


  結果劇情卻只有這樣 真的是很難讓人不失望


  所以可想而知 格局就不會有網路上不少人預期的那麼大


  講得更白一點


  洛基第二季對於整個MCU的影響還遠大於這部片


  這部其實還是聚焦在死侍身上


  基本就是死侍的故事 並不會展開到其他地方去


  這點大家最好還是抱持合理的期待比較好


  (我看網路上各種超展開的預測 我只能說真的太理想了)


  至於另一位主角 金鋼狼


  以戲份來說他當然是主角之一這個不用擔心


  但最讓人失望的還是這個版本的金鋼狼的故事


  光是看預告大家應該都會覺得


  應該有什麼不為人知 很黑暗的劇情


  但是呢 嗯 因為不能爆雷


  我只能說 啊 就這?


  這就導致了這個金鋼狼雖然戲分滿滿


  該有的都有了 導演把大家對於金鋼狼最想看的部分也都給了


  但你很難真正感受到這個金鋼狼的特別


  以及他的存在和跟著故事發展的意義


  他就還是那個金鋼狼 就是來賣金鋼狼給你看的


  其他的 只能說別強求了




  最後 我不會反推這部 不會給負評


  光是衝著滿滿的彩蛋客串 我認為就值得進場看


  但他還是沒能達成拯救低迷漫威的任務

  (實際上影片裡也有開這個狀況的玩笑)


  甚至很多我認為該做好的部分都沒有做好


  但至少可以讓凱文費吉認知到


  大家想看的不是高度政確化的MCU和復仇者聯盟


  而是這些沒有包袱 敢放開來玩的角色


  唉


  可是我對於MCU接下來是已經不敢期待了QQ


  --


  我尊重你的看法 但我想強調一下 死侍1跟2我都算喜歡


  甚至死侍2 我都覺得玩得不夠開 開導小胖子的部分太矯情


  但這部 真的是矯枉過正了


  給我的感覺真的就像以前的賀歲片那樣


  滿滿大堆頭 但玩笑開到讓人很難認真看待整部電影


  所以我才說 不反推 可以看


  但要當漫威救世主 真的很困難



  感謝你提到雷神4 雖然跟這部的調性和風格不一樣


  但缺點上給我的感覺確實有點類似



  我也喜歡BA的評論 不過他可能真的看到滿滿客串太激動...


  另外我不認同死侍這次能當漫威救世主的原因不是因為票房或熱度


  而是他沒能對MCU起到關鍵性作用 基本上這次頂多就像煙火一樣


  再燦爛都是放完就沒了 沒辦法對後續造成什麼影響



  尊重 但我對這部失望的原因絕對不是因為粉絲向或者彩蛋多


  更不是因為髒話多 笑話多


  而是它明顯想靠硬塞彩蛋跟笑話來掩蓋很多問題


  尤其是很多敘事節奏和故事上的硬傷


  但我也提到 我失望是因為期望高


  我還是會建議大家都還是進場看看


  光是看滿滿的客串跟彩蛋我認為就值回票價



  不用 可以看 只是不要抱太高期待'
