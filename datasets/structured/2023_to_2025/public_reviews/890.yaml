url: https://www.ptt.cc/bbs/movie/M.1716560248.A.A4C.html
title: '[新聞] 死侍與金鋼狼.限制級觀影前提醒.'
content: '新聞網址：


  《死侍與金鋼狼》已於北美已正式展開預售，北美開售第一日售出800萬美元預售額，

  創下R級電影歷史紀錄，也超越去年《星際異攻隊3》的同期表現


  漫威/迪士尼在大幅度調整(檢討)電影發行策略後，死侍與金鋼狼為2024年

  唯一一部院線上映的漫威電影。


  目前一切指標都顯示本片應該會大爆紅大賣座，不會重演先前疲軟的漫威電影票房


  但這不代表行銷本片可以輕鬆寫意，甚至是毫無作為。


  在今日，就有由兩位主角帶來的「觀影前提醒」在戲院裡為票房熱身，各位不用

  懂太多英文，因為只要聽到逼就是髒話，而這短短一分鐘不到的片段中，我想

  大概逼比台詞多一倍吧XD


  觀眾側拍由此去



  大致上我聽到的是


  觀眾席: 手機鈴聲

  死侍: 喔 是從那邊傳來

  金鋼狼: 嘿 那邊那個! 這裡是電影院 不是你媽住的安養中心  把電話TMD切靜音

  不然我要把你的手機塞進你的___ 你要想接下一通電話 你只能_____(非常母湯)

  死侍: 喔喔喔(打斷金鋼狼) 男性賀爾蒙濃度過高 太高了

  希望你的手機響鈴時沒有同步震動 XD 反正 請把手機切靜音 或是關機



  後面一堆 逼逼逼逼逼 就是了



  死侍 Deadpool：萊恩雷諾斯（Ryan Reynolds）

  金鋼狼 Wolverine：休傑克曼（Hugh Jackman）


  《死侍與金鋼狼》將於 7 月 24 日（三）搶先全美在全台大銀幕上映


  LFG, Let''s Fucking Go!


  --'
