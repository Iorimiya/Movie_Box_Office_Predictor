url: https://www.ptt.cc/bbs/movie/M.1722340409.A.3BD.html
title: '[普雷] 全因同行襯托的死侍與金鋼狼'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  說實話我認為這部電影對我來說是普通偏好，劇情認真深究起來會出現一大堆問題，像是

  本作新加入的「定錨者」，時間線會因為定錨者掛掉就導致整個時間線衰亡有點隨便。


  反派X教授的雙胞胎妹妹卡珊德拉的行動軌跡，還是超英電影的樣板反派，也就是「老娘

  不爽所以我要毀滅世界」這樣。


  甚至悖論先生的動機也是「我覺得時間線自然衰亡的速度太慢所以我決定用『時間開膛手

  』加速衰亡，來增加效率」這種爛理由來搞事。


  最後的收尾也沒有說為什麼定錨者變成死侍，難道就只是他拯救了自己的時間線所以變成

  定錨者了嗎？這個轉折會不會太簡單粗暴？


  死侍2片尾建造的死侍家庭感，在這集直接打掉重練，上一集的多米諾跟小胖鬼隱，但碎

  星這位跟死侍沒什麼情感連結的咖卻變成死侍口中「想守護的世界」其中一員，死侍因為

  應徵當復仇者沒成功而自暴自棄，跟凡妮莎分手，讓死侍2最後歷經千辛萬苦逆轉女友死

  亡，並選擇家庭的過程變成一場笑話。


  有些場景砍掉真的沒差，你要說幻影殺手、刀鋒戰士、金牌手還有X-23集結有情懷在那倒

  還OK，但是死侍軍團那個部分我是真的認為沒有必要，就只是給死侍跟金鋼狼一個大鬧一

  場的理由，死侍軍團等到後來場面比較大的電影，例如復仇者聯盟一類的電影再出來炒熱

  氣氛會好一點。


  觀影門檻也比之前來得高，以往的死侍電影假如你對超英梗、萊恩雷諾斯演員梗有一點了

  解就能get到大部份的笑點，而這次你需要看過洛基影集了解TVA是什麼在幹嘛，其他非漫

  威電影宇宙的漫威英雄改編電影，例如X戰警系列、幻影殺手、刀鋒戰士，甚至包括他們

  的演員梗才能get到裡面的笑點。


  例如查寧坦圖飾演的金牌手，說自己沒有以前的記憶，好像就是在虛空出生的一樣，還有

  自己連當英雄拯救老百姓的機會都沒有，就是對應現實中福斯那胎死腹中的金牌手個人電

  影。


  珍妮佛嘉納飾演的幻影殺手說他們幾次進攻卡珊德拉的基地都損兵折將，包括制裁者、夜

  魔俠都死了，死侍聽到夜魔俠死了為她感到難過，因為幻影殺手跟夜魔俠是情侶，但是幻

  影殺手雲淡風輕說還好，因為當時飾演夜魔俠的班艾佛列克是珍妮佛嘉納的前夫，前夫死

  了當然沒差。


  衛斯理史奈普的刀鋒戰士對死侍說我不喜歡你，死侍說對你從來沒喜歡過，對應刀鋒戰士

  3時，演員衛斯理對當時還是小咖的萊恩各種言語攻擊。


  在電影中除了以上三位之外還有很多讓人眼睛一亮的客串，例如火人、驚奇四超人的霹靂

  火，還玩了一把美國隊長演員梗，因為克里斯伊凡在飾演美隊之前就演過霹靂火。


  雖然剛剛吐了很多槽，但是這部死侍的打戲確實好看，開場配合超級男孩的歌「Bye Bye

  Bye」一邊用金鋼狼的「金身」擊退TVA追兵的武戲豈是一個爽字了得，死侍跟金鋼狼互看

  不爽互打的戲也很過癮，但其他角色的武戲反而就沒那麼好看，像是幻影殺手、刀鋒戰士

  、X-23跟金牌手殺進反派營地大開殺戒的那段，就編得差強人意，而且除了X -23之外的

  角色也都沒有交代後來怎麼了啊喂！不是說要給這些角色一個結局嗎？


  這部電影能夠在票房上取得成功，並不是因為劇情有多神，而是死侍這個角色的個人魅力

  、休傑克曼回歸金鋼狼，以及X戰警首次加入漫威電影宇宙，最重要的是，這部的誠意確

  實屌打漫威在終局之戰後推出的大部分的包括電影跟影集，死侍與金鋼狼不如想像中好，

  甚至算普通，但跟其他垃圾（沒錯我就是說驚奇隊長2跟秘密入侵影集）比起來，已經是

  夠好的了。


  --'
