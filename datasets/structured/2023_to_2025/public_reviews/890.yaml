url: https://www.ptt.cc/bbs/movie/M.1724687215.A.1C5.html
title: '[新聞] 死侍與金鋼狼再伸利爪 奪回北美票房冠軍'
content: "死侍與金鋼狼再伸利爪 奪回北美票房冠軍\n\n2024/8/26 12:33\n\n（中央社洛杉磯25日綜合外電報導）北美院線聯盟（Exhibitor\
  \ Relations）今天通報，\n超級英雄喜劇片「死侍與金鋼狼」本週末利爪搶回北美票房榜首寶座，進帳約1830萬美元\n。\n\n法新社報導，萊恩雷諾斯（Ryan\
  \ Reynolds）與休傑克曼（Hugh Jackman）主演的「死侍\n與金鋼狼」（Deadpool & Wolverine），在北美上映5個週末有4個週末都位居第一，美加\n\
  總票房達5億7720萬美元，國際票房累計達6億3400萬美元。\n\n上週末的領頭羊、科幻恐怖片「異形：羅穆路斯」（Alien: Romulus）本週末滑落至第2\n\
  名，在23日至25日期間有1620萬美元入袋。\n\n排名第3的是浪漫劇情片「到我們為止」（It Ends With Us），收入1190萬美元。這部由\n布蕾克萊芙莉（Blake\
  \ Lively）主演並共同製作的電影，迄今在全球海撈2億4200萬美元\n。\n\n分析師葛羅斯（David A. Gross）表示：「這部片是今夏的亮點之一。」又說，這是電影\n\
  產業狀態逐步好轉的另一個跡象。\n\n新上映的心理驚悚片「求救眨眨眼」（Blink Twice）以730萬美元成績位居第4。\n\n排名第5的是聖經劇情片「熔爐」（The\
  \ Forge，暫譯），進帳660萬美元。對一部製作成\n本500萬美元的電影來說，這是一個不錯的開映成績。\n\n排名第6到第10的作品依序為：「龍捲風暴」（Twisters），620萬美元；重新上映的「第\n\
  十四道門」（Coraline），500萬美元；「龍族戰神：重生」（The Crow），460萬美元；\n「神偷奶爸4」（Despicable Me 4），440萬美元；「腦筋急轉彎2」（Inside\
  \ Out 2），\n210萬美元。（譯者：紀錦玲/核稿：蔡佳敏）1130826\n\n#北美 #休傑克曼 #萊恩雷諾斯 #法新社 #北美票房 #布蕾克萊芙莉\
  \ #死侍與金鋼狼\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
