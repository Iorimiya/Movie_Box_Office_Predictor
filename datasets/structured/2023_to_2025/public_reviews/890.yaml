url: https://www.ptt.cc/bbs/movie/M.1722516945.A.57C.html
title: '[微好無雷]死侍與金鋼狼 教你享受賽一般的劇情'
content: '《即便劇情是一坨賽，

  你依然可能享受<死侍與金鋼狼>。

  兼評<惡棍英雄死侍>》



  我想幫還沒看本片的人避開他們不想看的。

  如果有人想看這部電影，我想協助他們欣賞。

  我認為可以幫助你享受這部電影的方法，你不用全部做，

  但你做越多，你會越喜歡這部片。



  目錄:

  你不需要做的事(一)、知道漫威電影宇宙的劇情。

  享受這部電影的方法(一)、了解超級英雄漫畫改編電影的相關新聞。

  你不需要做的事(二)、喜歡死侍前兩集和萊恩雷諾斯的喜劇

  享受這部電影的方法(二)、不要思考劇情、不要對笑點抱持期待。

  享受這部電影的方法(三)、喜歡X戰警改編電影。

  享受這部電影的方法(四)、看過、喜歡金鋼狼的漫畫。

  評打戲

  結語

  漫畫推薦



  你不需要做的事(一)、知道漫威電影宇宙的劇情。


  我用wikipeaia檢查過這點。

  所有跟漫威電影宇宙有關的設定，

  劇中角色都講得差不多了。

  我沒看第四階段也看得懂這部片的設定。

  不用完全懂也沒關係的原因是劇本:


  劇情沒邏輯、角色動機沒說服力、

  角色決策愚蠢、設定吃書。


  我節錄、整合兩篇外媒報導，

  跟大家說明這部片是怎麼拍出來的:


  萊恩雷諾斯、薛恩李維和編劇團隊曾經絞盡腦汁，

  但就是想不出好的《死侍》續集故事。

  雷諾斯找不到可以乘勝追擊的故事，說：「合適的劇本實在很難找」。

  雷諾斯已經向他的摯友力推組隊好幾年了，傑克曼一開始抗拒。

  正當雷諾斯和導演薛恩．李維討論是否暫時擱置拍攝計畫時，

  在海邊悠閒度假的休傑克曼心血來潮想到:

  「拍這部片就是我最想做的事啊。」內心交戰後，

  恍然大悟這個角色應該繼續下去。

  傑克曼打給雷諾斯、李維，表示他願意重出江湖詮釋招牌角色。


  這可能就是本片劇本那麼烙賽的原因，

  在休傑克曼願意演金鋼狼前，本來就沒有能用的劇本。

  有休傑克曼加盟還是沒劇本阿，但至少多了情懷可以賣，

  所以先賣金鋼狼，後來想到可以賣別的，就變成一部情懷大雜燴。


  這是一部剝削電影（Exploitation film）。



  享受這部電影的方法(一)、了解超級英雄漫畫改編電影的相關新聞。


  例如:

  因為演員A逃稅跟電影表現，

  可能不會再有超級英雄B的漫畫改編電影了。

  因為演員C倒楣、業界有人耍白爛，

  超級英雄D的漫畫改編電影開拍、取消輪迴多次，

  現在這個計畫已經死透了。

  當紅演員E公開說最愛的超英是超級英雄F，

  但目前關於他出演F的傳言都只是傳言。


  如果你平時會看到超級英雄改編電影的相關新聞，

  當你看到那些很難或不可能成真的演員、角色組合在本片出現時，

  會有種「這是夢，但我應該刻意不醒來，

  因為醒來後就無法再來」的樂趣。



  你不需要做的事(二)、喜歡死侍前兩集和萊恩雷諾斯的喜劇


  這些年來，YOUTUBE推播死侍2的電影片段時，

  或是旁人在看電視重映死侍2，我在側短暫停留時，

  我都在想這是什麼垃圾。


  版上有一篇無雷文，說有看其他超英電影可以提升本片觀影體驗。

  所以我昨天補了死侍1，我近年看過最糟的電影，

  整整100分鐘的痛苦消滅了觀賞死侍2的動力。


  心得是劇情沒邏輯、

  角色動機沒說服力、角色決策愚蠢、打戲無趣、笑話難笑。

  死侍在某些漫畫中腦袋壞了，但不該以此護航本片跟死侍1的劇情，

  因為電影版看起來沒這設定。


  當年版上在吵死侍跟大尾鱸鰻哪部更值得看、

  哪部有請工讀生來傷害ptt。


  看完死侍1，我的答案是豬哥會社完勝死侍，

  再不合我笑點，至少時間比較短。



  享受這部電影的方法(二):不要思考劇情、不要對笑點抱持期待。


  劇末有一個角色毫無邏輯的裸露、賣弄性感，完全就是這部片的縮影:

  「我沒內涵，我就是來用很廉價的手法討好你的。」

  再說一次: 這是一部剝削電影。


  當導演編劇們對於劇本難產的處理方法疑似是亂寫的時候，

  你如果認真看待劇情，不覺得很對不起你的認知資源嗎?


  BTW這邊的廉價手法包含請雷諾斯的小孩、

  職業球員幫蒙面角色配音，老實說我覺得蠢斃了。

  馬修麥康納就算了，真的有人知道運動員跟雷諾斯的小孩有聲演本片的時候，

  會覺得好興奮好想看嗎?



  享受這部電影的方法(三) :喜歡X戰警改編電影。

  這部片有兩個地方讓我熱淚盈眶，完全可以理解宮崎英高為什麼看到泛淚。


  熱淚盈眶的原因無他:

  就算《最後戰役》《X戰警：金鋼狼》《武士之戰》《天啟》《黑鳳凰》《新變種人》

  ，這些浪費社會資源的作品傷透X戰警愛好者的心，

  我們都記得這是一部批判現實、

  刻劃弱勢族群心境、劇情精彩、感情豐富、

  角色魅力和他們超能力有對稱或對比美感的系列。


  《X戰警》、《X戰警2》刺激的情節；

  《第一戰》、《未來昔日》中友情、政治立場、自我認同的糾結；

  《羅根》還有全系列的金鋼狼承受凡人不可能經歷的痛苦，

  卻還是為了重要事物，忍人所不能忍。


  至於為什麼不直接看相關電影要用懷念的，

  因為系列電影中最近一部能看的是2017上映，再上一部是2014….


  彩蛋之一是X戰警全系列的拍攝花絮，

  考量到導演對系列的貢獻，這彩蛋跟整部片一樣很剝削，

  完全就是在消費系列作，但看了好開心。



  享受這部電影的方法(四) : 看過、喜歡金鋼狼的漫畫。

  片中反派巢穴致敬某部經典的金鋼狼漫畫，

  電影也讓休傑克曼換上漫畫中的各種經典造型。

  如果你喜歡金鋼狼的漫畫和休傑克曼，看了會很開心。



  評打戲

  最後，有些人用大螢幕看電影是為了打戲，單獨談。

  有一幕很猛，有一些很普通，有一些爛到透頂。

  但很普通的那些可以靠情懷撐起來。



  結語

  我很討厭《一級玩家》，就好像刻意奉承不如真心誇獎一樣，

  刻意討好觀眾的行為只讓我覺得廉價。

  也因此我對史蒂芬史匹柏的印象變得很差。

  本片是我第一次被討好卻如此享受。

  同樣是賣情懷，對索尼蜘蛛人系列沒感情的我，

  應該會覺得《蜘蛛人：無家日》很無聊吧。


  補充:

  我很討厭創作者向觀眾獻媚，

  但因為這是我要的、電影公司不會給我的情懷

  所以我喜歡這部剝削電影。


  如果他剝削的是沒人在乎或隨處可見的東西，

  那這部片就一無是處。

  舉例而言，Alexandra Daddario、Kate Upton主演的The Layover(2017)，

  基本上沒什麼正評，因為它賣弄的性感，別說成人向作品，

  打開社群媒體就看不完了。我們看電影是期待一些只有它能給的東西。



  漫畫推薦:

  《X-Men: Schism》分裂

  《Death of Wolverine》金鋼狼之死

  《Wolverine: Old Man Logan》老人羅根


  都很短，漫威超英好像都這樣，一個篇章、一個大事件都短短的。

  不會發生火影第四次忍界大戰塞一堆無聊玩意，

  占了疾風傳一半這種鳥事...


  --





  <3

  死侍1第五十分鐘的時候我真的很想死，

  但為了已經買好票的本片，我硬是啃完整部。




  我不想在這裡暴雷，也懶得開一篇新的文討論劇情，原因文內也說了

  我看得很開心

  不好笑。博恩有一段youtube找得到的即興表演很精彩，

  但他跟他同事絕大部分的表演我都不喜歡。

  也因此我薩泰爾看得不多，可能有偏頗。

  不過我不排斥單口喜劇這種表演形式，我很喜歡喬治卡林、Bill Burr。

  同意邏輯不是必須。

  可以理解喜歡一級玩家，這就是矛盾之處:

  我很討厭創作者向觀眾獻媚，但因為這是我要的、電影公司不會給我的情懷

  所以我喜歡這部剝削電影。'
