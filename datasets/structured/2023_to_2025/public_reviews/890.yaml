url: https://www.ptt.cc/bbs/movie/M.1721995798.A.D54.html
title: 'Re: [普雷] 沒那麼好看的死侍與金鋼狼'
content: "想要補充一些東西(有雷)。\n\n\n\n\n----防雷----\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n1.電影最後金鋼狼跑去跟死侍住，然後以後還有X-23也住在一起，\n\
  \  羅根與X-23情同父女的畫面的確很溫暖，\n  但是羅根更應該驚喜於，死侍那些朋友裡面起碼有三個X-MEN，\n  不過電影沒有拍出來，我一直在想，\n\
  \  這個羅根看到這時間線還有X-MEN應該要表現得更驚喜才對吧?\n\n2.時空開膛手製作的地方竟然是地球?\n  然後我覺得\n  諾瓦(X教授妹妹)本來已經感動於金鋼狼不殺她了，\n\
  \  然後又一下子又跑到地球去搶用開膛手，\n  這個轉折真的太快了。\n  然後死侍團為什麼要對付死狼二人組?\n  他們也希望整個宇宙剩下空虛嗎?\n  諾瓦有跟他們說好嗎?這整段都莫名其妙。\n\
  \n3.這部電影沒有所謂最後反派，就是死狼二人組用他們的基情救了世界而已。\n  諾瓦就變成粉了，\n  說好要用X-MEN進入漫威故事線，然後這麼威的角色就這樣被賞便當?\n\
  \n4.除了暖收的死侍家，以及福斯X-MEN的幕後花絮，\n  這部電影對我而言最糟糕的就是他甚至不是一個完整的故事，\n  死侍跟金鋼狼兩個人魅力不變是一回事，\n\
  \  但這個結局就是----這個世界多了金鋼狼+X23，\n  就這樣子?連(本來應該是的)最終反派都沒有往下鋪梗?\n  這部電影如果破10億美金鐵定是靠死狼二人組，\n\
  \  劇情基本上一坨屎。\n\n5.與其故意拿出一大堆X-MEN彩蛋，\n  不如讓X-MEN相關角色正式與復仇者聯盟接觸，\n  好的，一開始有死侍跟快樂應徵，\n\
  \  然後就沒了。\n  在我心中這才是真正的我想要看到的彩蛋，\n  但是快樂不錄用他，\n  所以又想要花多少電影的時間讓死侍跟金鋼狼正式進入主線?\n\n\
  \n然後，\n有的人說這部電影拿來跟東成西就比，\n對我來說，開甚麼玩笑，\n\n東成西就有非常明顯的起承轉合，\n請問死侍與金鋼狼有這些嗎?\n\n\n東成西就的洪七公找師妹找得那麼辛苦，還被拒絕，拒絕後自殺又遇到歐陽鋒，\n\
  像這種一連串的關係，\n在幾天內寫好並拍成影片，\n\n你跟說死侍與金鋼狼的劇情高攀得上東成西就嗎？\n了不起可跟王晶後期的的澳門風雲系列相比罷了---用一堆大咖，堆積一個爛片。\n\
  \n以上，補充完畢。\n\n--"
