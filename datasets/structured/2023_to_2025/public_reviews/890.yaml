url: https://www.ptt.cc/bbs/movie/M.1722872496.A.398.html
title: '[新聞] 死侍與金鋼狼魅力不減 連霸北美票房冠軍'
content: "死侍與金鋼狼魅力不減 連霸北美票房冠軍\n\n2024/8/5 14:03\n\n（中央社洛杉磯4日綜合外電報導）超級英雄喜劇片「死侍與金鋼狼」這個週末在北美刷\n\
  新更多紀錄，據北美院線聯盟（Exhibitor Relations）今天公布的數據，該片利爪已一\n路伸到令人刮目相看的9700萬美元。\n\n法新社引述美國娛樂媒體「綜藝」（Variety）報導指出，「死侍與金鋼狼」（Deadpool\n\
  & Wolverine）上映第2個週末的票房成績，在影史排行第8，如今美加總票房來到3億9560\n萬美元，國際票房甚至更亮眼，來到4億2800萬美元。\n\n\
  在「死侍」萊恩雷諾斯（Ryan Reynolds）與「金鋼狼」休傑克曼（Hugh Jackman）兩人\n廣大影迷捧場買票觀影下，這部片已改寫R級片美加總票房新高，翻新梅爾吉勃遜（Mel\n\
  Gibson）2004年史詩劇情片「受難記：最後的激情」（The Passion of the Christ）締\n造的3億7000萬美元（未經通膨調整）紀錄。\n\
  \n而2日至4日期間北美票房排名第2的是格蘭鮑威爾（Glen Powell）和黛西艾德格瓊絲（\nDaisy Edgar-Jones）主演的氣候驚悚片「龍捲風暴」（Twisters），進帳2270萬美元。\n\
  \n排名第3的是新上映的「圈套」（Trap），吸金1560萬美元。分析師葛羅斯（David A.\nGross）表示，「這對（導演）奈沙馬蘭（M. Night\
  \ Shyamalan）的懸疑犯罪驚悚片來說\n，算是軟弱無力的開映成績」，還說這部片的影評和觀眾口碑「普普」。\n\n而北美票房排名下滑一個位置來到第4的是動畫片「神偷奶爸4」（Despicable\
  \ Me 4），\n收入1130萬美元。這部片開映至今的美加累積票房達3億1400萬美元，國際市場則有3億\n8600萬美元成績。\n\n排名第5的是另一部動畫片「腦筋急轉彎2」（Inside\
  \ Out 2），票房670萬美元。多媒體\n娛樂新聞「好萊塢報導」（Hollywood Reporter）指出，這部片美加總票房達6億2700萬\n美元，海外總票房9億2800萬美元，加起來已破15億美元門檻，是影史上最賣座的動畫片\n\
  。\n\n排名第6至第10的作品依序為：「阿羅有枝彩色筆」（Harold and the Purple Crayon，\n暫譯），600萬美元；「長腿」（Longlegs），410萬美元；「噤界：入侵日」（A\
  \ Quiet\nPlace: Day One），140萬美元；「行刑隊」（The Firing Squad，暫譯），92.5萬美元\n；Daaru Na Peenda\
  \ Hove，62.5萬美元。（譯者：蔡佳敏/核稿：劉文瑜）1130805\n\n#北美 #休傑克曼 #萊恩雷諾斯 #美加 #葛羅斯\n\n--\n\n 是菩薩成佛之道\n\
  \        是 佛經\n  是 佛        是 菩薩\n\n\n\n--\n\n\n\n\n\n爲什麽猶太人不信耶穌"
