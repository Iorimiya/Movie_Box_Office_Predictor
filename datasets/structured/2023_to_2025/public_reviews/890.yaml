url: https://www.ptt.cc/bbs/movie/M.1724819143.A.FEE.html
title: '[新聞] 萊恩雷諾斯曝光《死侍與金鋼狼》刪減片'
content: '萊恩雷諾斯曝光《死侍與金鋼狼》刪減片段　金牌手「這動作」暗示個人電影有望問世？




  原文：

  《死侍與金鋼狼》上映已有一個多月，相信許多影迷已經二、三刷，對劇情瞭若指掌。在電

  影結尾，死侍和金鋼狼通過與奇異博士相同的傳送門前往時間管理局TVA的所在地。眼尖的

  觀眾可能會注意到，在這跳躍過程中，畫面刻意帶到查寧塔圖（Channing Tatum）飾演的「

  金牌手」眼睛瞄了一下。而這隱藏細節在被刪減的片尾畫面中似乎給出了更深的涵義。



  萊恩雷諾斯（Ryan Reynolds）近日在社群上分享了一段片尾遭刪減的片段，影片中金牌手

  仍待在虛空之中，緩緩走過一片屍橫遍野的場景，接著帶到金牌手轉身抬頭露出一抹微笑，

  而金色光芒的傳送門也被映照在臉上，顯見金牌手接下來可能會試圖穿越，回到屬於自己的

  宇宙，進一步推測漫威是否有意推出傳聞已久的金牌手個人電影，實現查寧塔圖的心願。



  萊恩雷諾斯透露，這段刪減片段原本計劃放在電影結束時間管理局（TVA）的監控螢幕中，

  不過最後作罷，可能考慮到目前漫威的品質不穩定性，加上已經宣布至第六階段的電影與影

  集計畫，暫時還無法將資源投入開發另一部電影，因此將片段刪除，不過耐人尋味的是，萊

  恩還是在個人社群上貼出了這段影片，是否代表著 《死侍與金鋼狼》的成功，會為金牌手

  的個人電影開出了先機呢？

  ————————————

  其實個人比較喜歡泰勒基奇版的金牌手


  --'
