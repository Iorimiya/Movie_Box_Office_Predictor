url: https://www.ptt.cc/bbs/movie/M.1721795612.A.587.html
title: '[普好雷]死侍與金鋼狼 '
content: "先來個但書\n\n\n看之前網網路上什麼 死侍會大玩特玩各個多重宇宙的網路謠言丟掉\n\n\n這部就只是一個死侍想講好自己宇宙的故事  故事單純又完整\n\
  \n\n這就夠了\n\n\n\n\n\n\n  防雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n防雷\n\n\
  \n\n\n\n  電影一開始說不會踩羅根這部電影  那是個很好的結尾\n\n\n\n幹你他媽才2分鐘就自打嘴巴  連網路都在騙\n\n死侍一開場就在挖\"羅根\"\
  的墳墓  結果只挖到一個金屬骷髏\n\n死侍咒罵之後  把骷髏挖到旁邊坐 結果TVA殺來\n\n死侍就用羅根的骨頭大殺特殺  還把羅根的頭當足球踢到遠方\n\n\
  \n\n\n  原來\n\n\n    羅根和死侍是同一個宇宙  編號10005地球\n\n這也可以解釋為何死侍1.2 X學員只剩3人\n\n\n TVA的悖論先生受上級命令\
  \  因為死侍的宇宙因為\"定錨者\"羅根的死亡\n\n時間縣正走向枯萎 所以要把死侍送到別的宇宙 但是悖論先生同時也想使用\n\n時間開膛手加速死侍的宇宙滅亡\
  \ (原本消亡過程可能幾千年 幾年不等)\n\n\n  死侍不想自己的朋友和世界一起滅亡 所以就搶了悖論先生的時間機去找金鋼狼\n\n回來時 就和金鋼狼一起被送到虛空\n\
  \n  兩人必須想辦法從虛空逃出  然後阻止死侍的宇宙滅亡\n\n\n\n\n  對  就如此簡單\n\n\n\n  但是片中客串腳色 還有死侍嘴賤程度讓全場笑場很久\
  \ 而且大戰場面不少\n\n這次打親情戲也很真誠  我還真的流淚了....\n\n\n  看到霹靂火  刀鋒戰士  X23  金牌手  幻影殺手 金鋼狼 還有偽索爾\
  \ 這些人氣腳色出場\n\n就真的值了  X23還是和羅根一樣嬌小和勇猛強悍\n\n  霹靂火(克里斯·伊凡)死於片酬太高  (這不是我說的 是片中人自己講的)\n\
  \n\n\n\n  死侍還是一樣的嘴賤  而且總是在你流淚想拿衛生紙時 把你衛生紙搶走拿去打手槍\n\n片尾最後也說了\n\n\n   不要成為什麼漫威耶穌 \
  \ 演好自己就好了\n\n可惜我懂得梗不多  不然應該更好笑\n\n\n--\n\n  \n\n\n\n--"
