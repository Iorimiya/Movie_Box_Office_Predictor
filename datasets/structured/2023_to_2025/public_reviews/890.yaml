title: '[新聞] 機堡回歸「死侍與金鋼狼」？喬許認:沒通知'
content: '新聞網址：


  原標題:


  2024-07-26 09:06

  聯合報 記者陳建嘉／即時報導




  李佛薛柏多次表示想回歸「X戰警」系列。圖／摘自X



  演技派熟男喬許布洛林曾有一段時間頻繁被各大片商邀請出演超級英雄電影，不僅在同一

  時間演出「復仇者聯盟」系列大反派薩諾斯，同時也是「死侍」系列的好搭檔「機堡」，

  喬許與萊恩雷諾斯當初合作愉快，私下交情也一直維持得不錯，但他近期接受「Collider

  」訪問




  喬許也表示雖未與休傑克曼合作，但一直很欣賞他，「我不知道休的年紀大概多大了，是

  56歲還是57歲嗎？但是這傢伙真的沒有變老，我一直是他的忠實粉絲」，也提到「機堡」

  這個角色很有趣，無論如何都希望能夠再演，但最終沒有回歸的原因，外加猜測該角色要

  不停吐槽死侍，也要一本正經講冷笑話，功能性可能與「金鋼狼」會有重疊，最終才會決

  定刪去。



  ，

  但是

  ，外

  界則猜測可能是李佛的片酬較高，或是希望影迷可以更關注較少出現的初代「X戰警」角

  色。




  喬許布洛林飾演「機堡」在「死侍2」與萊恩雷諾斯合作無間。圖／摘自X




  喬許布洛林飾演「機堡」在「死侍2」與萊恩雷諾斯合作無間。圖／福斯提供



  --'
