title: '[爽雷] 金剛狼與死侍'
content: '底下沒有劇情，只有感想。


  但這絕對是終局之戰後最好，


  最棒的漫威電影，沒有之一。


  漫威他回來了，真的回來了。


  劇情完整也沒有什麼過多的解釋劇情。


  但劇情流暢，而是一部緬懷Fox電影宇宙角色的悼文。


  除了一貫的電影大魔王威脅不足外，


  沒啥大缺點。


  你各位想得到想不到的彩蛋，


  還有那個拉風的男人"們"


  都出現了。


  我只能說，這是今年必看電影!!!!


  迪士尼總算醒了!!!


  漫威濔賽亞，當之無愧!!!!!

  -----

  Sent from MeowPtt on my iPhone



