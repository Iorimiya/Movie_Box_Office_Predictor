url: https://www.ptt.cc/bbs/movie/M.1722326240.A.4A0.html
title: '[新聞]「死侍與金鋼狼」大紅 前任「X教授」有話說'
content: '新聞網址：


  2024-07-30 10:13

  聯合報 記者陳建嘉／即時報導



  詹姆斯麥艾維曾在「X戰警」系列飾演年輕版「X教授」，無論在「X戰警：第一戰」或是

  「X戰警：未來昔日」都有精彩表現，最近他在聖地牙哥漫畫展宣傳驚悚新片「邪惡勿語

  」，一改昔日優雅小生形象，化身性格古怪的神祕男子，





  詹姆斯提到他當然清楚「死侍與金鋼狼」本集反派是「王冠」女星艾瑪柯林飾演的「卡珊

  德拉諾瓦」，同時也是「X教授」的妹妹，「我覺得艾瑪柯林就像我被用AI畫出來的樣子

  ，當我看到有些人在網路上製作我的AI畫像，看起來有點像那部電影裡的艾瑪柯林」，至

  於是否願意再演，他則笑稱身為演員什麼都要挑戰，「我是否要回去扮演一個已扮演過的

  角色？我想成為全新的、不同的詮釋以及新探索的版本，唯一能讓我接受的就是劇本好不

  好、角色有不有趣」，但他也表示一切都是假設問題。



  然則詹姆斯也稱讚萊恩雷諾斯、休傑克曼都在努力拍攝，他也曾在「死侍2」、「X戰警：

  未來昔日」與兩人都合作過，「我覺得他們都在努力前進，他們在做全新的事情，而他們

  會做得越來越好」，他也直言「自己從不會對任何事情說不，但如果給他的劇本很糟糕，

  他也永遠不會對某件事說『是』」。



  --'
