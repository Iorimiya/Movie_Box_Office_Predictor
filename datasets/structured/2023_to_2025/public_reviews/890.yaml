url: https://www.ptt.cc/bbs/movie/M.1721836165.A.0E5.html
title: '[普雷] 沒那麼好看的死侍與金鋼狼'
content: '今天颱風，

  屏東的國賓有開，趕快在10:20前買了早上的票~期待好久了~~


  以下防雷



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




















































  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  一開始覺得，

  挖塞，迪士尼真的有開放髒話、血腥給死侍表現耶，

  太棒了。



  好了亮點結束。


  雖然真的一堆彩蛋，

  但是與其說那些是彩蛋，

  還不如說這部電影就是用彩蛋正式說明FOX已走入歷史，

  漫威要開始真正使用變種人梗了。



  大家都討論很多了，

  劇情不再贅述，

  但我真的很想講的是，包圍在TVA裡面，這個故事注定爛掉。


  死侍代表的應該是奔放、自在，

  但是卻被漫威的TVA框架框起來了，


  金鋼狼等人也只不過是整部電影的工具，

  雖然情懷賣得很夠，

  但最後也顯示這個所謂的宇宙，最後會有死侍跟金鋼狼等一干人(包含長大的X23)，


  就這樣，

  沒了，

  就算看到刀鋒戰士我真的有點欣喜，又怎樣?

  看到查寧塔圖的金牌手，又怎樣，類似的梗閃電俠的凱吉超人已經用過了。



  整部電影就只是在告訴大家，福斯的東西我漫威接收囉~

  我覺得真正感人的只有片尾，

  那些X-MEN拍攝花絮，讓福斯藉著這些花絮好好說再見，就這樣。



  我覺得是一部仍然維持死侍風格的電影，

  可是為漫威服務的鑿痕太重了，

  可以確認死侍跟金鋼狼還是會留在未來的電影，

  如此而已，


  但單就一部電影而言，

  劇情實在太單薄了，

  太多事情繞來繞去，

  根本沒有一個真正的事件---幾乎都是現實世界的版權易手梗，


  這樣到底有趣在哪?

  光賣情懷就不用好好寫劇本嗎?



  找到金鋼狼找得太順利成章了，

  然後X-23就在森林裡直接找到了金鋼狼，

  情懷賣的有點廉價，

  有點草草收束X-MEN各種劇情的感覺，

  反正X-MEN就是要進來凱文費吉的新規劃啦~



  所以作為一個死侍的支持者，

  這部電影還算可以看，因為他們給予死侍很多不同以往的空間，

  所以死侍個人的魅力，還算發揮得宜，

  此外金鋼狼也還是維持著他的人設，並沒有故意更改他的性格等等，


  但劇情真的是"很糟"，

  要不是這一次主角是兩位很有性格的角色，

  我看又是爛片一部，


  但考慮到本部作品同時也有修正復聯4亂七八糟發展的任務，

  好吧，

  不要太苛求，給個普雷好了。

  至於那些多到沒必要的彩蛋，就真的沒必要，

  劇情不好，情懷跟彩蛋會讓人覺得很膩。


  --'
