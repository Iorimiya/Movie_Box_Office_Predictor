url: https://www.ptt.cc/bbs/movie/M.1721793101.A.E65.html
title: '[普好無雷] 漫威迪士尼的《死侍與金鋼狼》'
content: '扣掉拉里拉雜的客串驚喜

  還有一些新登場角色的驚喜之外


  總之這片給了誠意十足的表現

  雖然在劇情上不比前兩部死侍好懂

  甚至可以說其實很拖沓

  為了把死侍帶入漫威宇宙

  繞了好大一圈才走入主線劇情

  這部分算是缺點


  其他部分當爽片看可是達到、甚至是超越個人期待的程度

  尤其是突破第四面牆嘴砲的部分

  光是看賤嘴就很值得了

  更何況還有一堆彩蛋(不是指片尾畫面)


  打鬥的部分則是普普

  沒有想像的那麼「水」

  可能是兩個粗人打架本來就比較粗暴一點吧

  但是相較於漫威近期的作品而言

  這片已經是水準之上了


  總之不要太過期待

  抱持平穩的心態來看會比較好


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
