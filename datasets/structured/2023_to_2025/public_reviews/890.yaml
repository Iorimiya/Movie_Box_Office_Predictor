url: https://www.ptt.cc/bbs/movie/M.1718643759.A.2AC.html
title: '[新聞] 《死侍與金鋼狼》將在中國大陸同步上映'
content: '系列史上第一次！《死侍與金鋼狼》將在中國大陸同步上映


  Yahoo奇摩電影戲劇編輯部


  2024年6月18日 週二 上午12:41




  《死侍與金鋼狼》（圖：Disney/Marvel）


  1. 漫威作品曾遭陸封殺，多部電影都無法上映。


  2. 《死侍》也因大玩腥羶笑料，未能通過審查。


  3. 新片終於同步上映，片中只會刪減少量場景？


  【文／血紅蘭姆】


  漫威影業如今證實，《》將於7月26日在北美、中國大陸同步上映，也創下

  《死侍》系列電影史上的第一次。


  近年來在美中關係緊繃之下，從《黑寡婦》、《》、《永恆族》、《蜘

  蛛人：無家日》、《奇異博士2：失控多重宇宙》到《雷神索爾：愛與雷霆》，或因片中

  題材敏感、或因導演過去發言，漫威曾連續多部電影都無法在中國大陸上映，直到《》才終於解除禁令。


  撇開政治問題不談，前兩集《》系列電影也一直無法打進中國大陸市場，畢竟片中大

  玩各式百無禁忌的限制級腥羶笑料，因此始終未能通過中國大陸的電影審查，也讓當地觀

  眾無緣一睹死侍原汁原味的惡搞風格。


  《死侍與金鋼狼》（圖：Disney/Marvel）


  儘管始終堅持限制級色彩，不願對電影作出大量修改，但在福斯答應撥出部份

  票房收入捐贈慈善之後，《死侍2》日後還是推出了輔導級版本《死侍2：我愛我家》，在

  原版電影上映大半年後才好不容易打進中國大陸。


  然而迥異於前兩集《》系列電影，如今根據綜藝報指出，新片《》則將

  於7月26日在北美、中國大陸同步問世，而當地上映版本只會作出少量刪減，跟原版電影

  差異不大。


  漫威影業如今在微博上宣佈：


  「【重磅】『侍』你的『狼』來了！#死侍與金鋼狼定檔# 同步北美7月26日全國上映。這

  一次也是第一次，『嘴砲╳鋼爪』死侍金鋼狼最佳死黨正式加盟漫威電影宇宙、『暴』『

  笑』一夏！#死侍與金鋼狼# 7月26日大銀幕不『賤』不散！」


  漫威更在另一則微博貼文中指出，「」、「」和導演薛恩

  李維都將於7月2日造訪上海，好跟中國粉絲見面會談，也藉此開啟全球宣傳巡迴首站。


  儘管迪士尼和漫威未曾透露究竟是哪些場景遭到刪減，但據報都跟「暴力、血腥和粗口」

  有關。


  消息人士指出，這些刪減不會影響到說故事的完整性，也會忠於死侍精神。


  這是繼漫威禁令解除以來，連續五部漫威電影都成功打進中國大陸。


  《》將於2024年7月24日在台灣上映。


  新聞網址：








  --'
