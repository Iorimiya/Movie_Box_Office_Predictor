title: '[爽雷] 死侍與金鋼狼'
content: '先給評分：漫威史上前三佳，至少95分


  絕對配得上R級


  這次的中文翻譯翻的非常好


  記得每句都要仔細看才不會錯過


  漫威耶穌拯救世界
















  以下有雷——————————————————



  史丹利的名字在公車上

  這部的每句台詞幾乎都藏梗

  各種彩蛋看得超開心

  劇情前面幾篇都講過了

  20世紀福斯倒在地上笑死

  提到超過十位變種人吧

  血腥程度我可以接受

  休傑克曼的大娛樂家和作品都被挖出來吐槽

  第一次知道查爾斯有妹妹

  TVA那個主管應該是洛基影集裡面那個？

  強尼（霹靂火aka克里斯）這部玩開了

  各種language和台詞，擺脫美國隊長形象

  收購福斯真的讓這部玩開

  很多點要親自看才有感覺

  你的過去造就了現在的金鋼狼

  這句超級帥

  這集就像是鋼鐵人第一集一樣亮眼

  真的拯救了漫威

  吐槽多重宇宙真的很蠢ww

  死侍團都好有特色

  第一個穿插畫面是福斯的電影片段

  勾起大家的回憶

  第二個揭發強尼死有餘辜

  非常推薦大家去笑一笑放鬆身心


  --'
