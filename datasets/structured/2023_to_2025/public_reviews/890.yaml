title: '[新聞] 《死侍與金鋼狼》飆破6.3億！速登年度第4'
content: '《死侍與金鋼狼》全球票房飆破6.3億美金！速登年度第4名


  自由時報2024/08/03

  記者許世穎




  漫威電影宇宙今年唯一大銀幕鉅作《死侍與金鋼狼》持續在全球熱賣，目前全球票房已突

  破6.3億美金（約台幣205.88億元），登上今年度全球票房第4名，僅次於《腦筋急轉彎2

  》的15.23億美金（約台幣497.71億元）、《沙丘：第二部》的7.11億美金（約台幣232.3

  5億元），以及《神偷奶爸4》的6.86億美金（約台幣224.18億元）。


  電影上映首週末一舉打破全球、北美、全台年度開片紀錄，並登上影史全球及北美的R級

  （美國限制級）電影開片冠軍。全球票房預計本週末（8月2至4日）結束將衝破8億美金（

  約台幣261.44億元）大關，登上今年度全球票房第2名。


  目前該片北美票房也已高達2.98億美金（約台幣97.38億元），預計當地週五（2日）結束

  就會突破3億美金（約台幣98.04億），並登上北美今年度票房第2名。台灣方面，全台票

  房已破台幣1.5億，預計今天（3日）將擠進今年度票房第6名。《死侍與金鋼狼》持續在

  台上映中。





  --'
