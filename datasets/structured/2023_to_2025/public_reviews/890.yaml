title: '[好雷] 死侍與金鋼狼 與其說自己是漫威耶穌'
content: '儘管颱風攪局,


  避免被暴雷 還是沒有太晚去看這部


  先說


  這部確實有回到漫威之前那種"樂園式"的觀影體驗


  給好雷不為過


  窩還挖靠~了幾聲


  (防雷頁)


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  金鋼狼跟死侍在夯大奧德賽(2025最新款?)打得筋疲力竭 終於至少把賤嘴綁成麻花

  被23妹載去秘密基地

  這時慢動作一一介紹,預告片沒爆料的彩蛋


  1.刀鋒戰士走進來  挖靠~~  咦?還沒換成阿里嗎?

  2.金牌手走進來  挖~~靠~~  真的是查寧塔圖嗎? 怎麼那麼胖XDD

  3.不過前面那隻幻影殺手就不怎麼認識惹  她能力很強嗎?


  ..電影其他感覺就沒什麼XD|||

  甚至殺進大蟻人基地混戰,居然沒下X Men經典OP  讓窩覺得非常遺憾!?==


  而標題的話 與其說死侍來拯救漫威 不如說漫威正式引進變種人,

  又一堆腳色可以繼續讓漫威苟活惹


  --


  --'
