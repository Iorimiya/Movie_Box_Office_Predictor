url: https://www.ptt.cc/bbs/movie/M.1722850843.A.1E2.html
title: 'Re: [討論] 死侍與金鋼狼ScreenX粉絲特別場驚奇贈品'
content: '題外話聊一下screen x


  我感覺目前拍攝設備跟方式還沒完全配合這種廳


  或是我坐的太後面吧


  這次死侍我坐在台中站前秀泰倒數第三排


  在片頭打戲的部分效果不錯


  但是到了一些室內場景或是近距離特寫時


  就會很明顯感覺左右螢幕就是拉伸的畫面


  不是真正意義上的頭部左右側的視線


  他只是攝影機旁邊切掉的畫面做延伸而已


  所以在鏡頭旋轉或左右平移的過程會有點詭異感


  或是一些人物站位剛好卡到畫面邊緣時候


  也是出現錯誤的拉伸效果


  但是在screenX宣傳影片中的往前平移鏡頭


  這種效果就非常好


  真的要到最佳效果可能要等片商願意投資


  真的採多視角拍攝才有機會


  畢竟人眼視野超過180度


  部分焦段的鏡頭可能只有50～80度


  拿單一鏡頭去特效處理還是不太完美就是了



  --'
