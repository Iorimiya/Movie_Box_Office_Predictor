content: "「死侍與金鋼狼」全球票房冠軍 5天破4億美元\n\n2024-07-29 22:28\n\n中央社 記者洪素津台北29日電\n\n\n超級英雄電影「死侍與金鋼狼」登票房冠軍，5天破4億美元。(美聯社)\n\
  \n電影「死侍與金鋼狼」在台灣上映當天碰上颱風來襲，許多影院連續2天關門，但全台首\n週票房仍輕鬆破億，全球短短5天便累積破4億美元（約新台幣132億元），成全球票房冠\n\
  軍。\n\n「死侍與金鋼狼」（Deadpool & Wolverine）在台上映日卻碰上颱風凱米攪局，而颱風過\n後影院湧入大量人潮，讓戲院業者直呼許久沒看見這樣的盛況，此片上映到今天，全台首\n\
  週票房衝上新台幣1億218萬元，穩坐冠軍寶座。\n\n美國方面，「死侍與金鋼狼」首週末即賣破2億美元，成為影史第8高首週末票房、第9部\n首週末便超越2億的超強鉅作，也登上漫威電影宇宙開票前5名系列作，僅次於「復仇者聯\n\
  盟」第3、4集和「蜘蛛人：無家日」，亦是全美開票成績最高R級電影，證明死侍歷年來\n急遽竄升的超高人氣，以及金鋼狼始終不減的無敵魅力。\n\n「死侍與金鋼狼」史上最另類超級英雄、語不驚人死不休的死侍，睽違6年重返大銀幕，\n\
  更與金鋼狼攜手首度加入漫威電影宇宙。\n\n#死侍\n\n死侍  復仇者聯盟  蜘蛛人\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是\
