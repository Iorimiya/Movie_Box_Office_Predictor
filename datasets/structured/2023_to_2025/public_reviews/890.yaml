url: https://www.ptt.cc/bbs/movie/M.1722780519.A.057.html
title: '[討論] 死侍與金鋼狼ScreenX粉絲特別場驚奇贈品'
content: '和家人去體驗七月剛完工的Screen X巨幕廳，

  效果差強人意，

  覺得看一般巨幕或是IMAX都比ScreenX好。

  這場剛好買了《死侍與金鋼狼》粉絲特別場的票，

  入場時先贈送兩組海報以及先前有版友分享過的紀念公仔，

  放映結束時，

  工作人員提醒座位底下如果有摸到驚奇信封，

  可以兌換特別贈品，

  沒想到被我摸到了！

  是很可愛的電影主題襪。

  粉絲特別場沒有另外加價，

  但贈品誠意滿滿呀~




  --



  真的運氣好，領獎時發現全場只有兩位中獎

  主銀幕跟兩側銀幕畫質有落差，而且畫面很仔細看的話有點錯位（雖然銀幕邊緣有對齊

  請問a大覺得文心秀泰的主銀幕跟側銀幕色差會不會很大？我是在站前秀泰看的

  運氣運氣~

  主銀幕跟側銀幕畫質有落差，亮度尤其明顯，銀幕連接處的畫面有些微錯位，我是台中站

  前秀泰看的，不知道別家有沒有這個問題

  資訊量我是覺得還好，其實體驗箱有說把注意力放主銀幕就好，但是主銀幕跟側銀幕有色

  差很分心啊！

  謝謝a大分享，等換檔再去文心秀泰體驗一下

  我確實是用眼角餘光瞄的，但還是很難不注意到色差XD

  好像粉絲特別場都有喔，但中獎機率不高

  我也是一直分心XD

  真的~由於我不是特地選粉絲場的，所以一開始中獎還有點矇，不過真的蠻開心的XD

  不能把好運賣掉，運氣之神會拋棄我的~

  我也無法~

  如果能這樣說服自己那也不錯XD

  不知道是不是亂數抽的，我拿到的信封裡面有寫我的座位號碼，還要現場驗票根

  粉絲特別場才有喔！

  有同感，我覺得有體驗過一次就可以了~

  有同感~

  我覺得這個放映效果如果是電影的室內場景放在screen X斷感會蠻明顯的

  是要散場時工作人員進來提醒的~'
