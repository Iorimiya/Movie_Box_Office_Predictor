url: https://www.ptt.cc/bbs/movie/M.1721818457.A.9E1.html
title: 'Re: [好雷] 死侍與金鋼狼 巨量彩蛋討論'
content: '應該只是單純的玩梗客串，畢竟他是休．傑克曼原本宣佈退休後，


  被認為形象最符合當休接班人的。但那時他還在演超人。


  後來他被DC砍掉了，但休卻也宣布回歸了。


  所以他一直以來都是跟金剛狼失之交臂。


  亨利有說過，他最想演的漫威角色是金剛狼。




  查寧塔圖的金牌手是在福斯時期有過計畫，但後來被腰斬了，到福斯被迪士尼收購後，


  也沒有下文。所以他這次出場算一圓美夢。



  只是有一個刀鋒戰士的對白，讓我出神了一下。


  刀鋒說『我是第一個，也是唯一個刀鋒』


  然後死侍就看向第四道牆，好像想說什麼又欲言又止。


  可能新版的刀鋒戰士難產也有部分的大人理言，最後搞不好會換回老刀鋒耶。


  衛斯理．史奈普一直就很想回歸，結果漫威嫌他以前太愛耍大牌又難搞。


  結果這次他竟然回歸了，搞不好有戲？



  然後死侍跟他對話其實也有藏現實梗。


  因為萊恩其實也有演過刀鋒戰士3，那時衛斯理．史奈普超愛耍大牌的，


  對萊恩態度非常的差，當時還嚇壞剛入行沒多久的萊恩。


  所以刀鋒才會回嘴死侍說我一直跟你不對盤。


  這算是場外的私人恩怨扯到電影中了。




































  置底防雷。


  --'
