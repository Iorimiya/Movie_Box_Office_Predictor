title: '[好雷] 死侍與金鋼狼'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  這部行銷真的很用心，本來沒興趣看的，但因為一直刷到廣告

  加上版上評價也不錯，就找了一天去看


  去之前本來很擔心觀影門檻會不會太高，導致看不懂

  但看完之後感覺也還好，就算沒有看齊漫威宇宙，其實也不太影響觀影感受

  好笑的地方還是很好笑，Get不到的地方也會被兩人的打鬧和物理性互捅圓過去XD

  總之對整體的觀影體驗影響不大



  不過本部的大反派給人的感覺就比較虛，虛的地方不是造型或是能力什麼的

  而是動機真的很薄弱，感覺就是一個在邊境稱王的諸侯，其實也沒什麼野心，就是想在他

  的地盤稱王稱霸

  也不打算侵略哪裡，要不是悖論吃飽撐著想暗殺他，不然應該也不會出來搞事


  最後必須說，死侍開頭與金鋼狼的共舞(?)真的很讚，可以理解社群上為什麼那麼多人在

  模仿

  霹靂火也真的是活該，嘴賤成這樣，就算沒有死侍捅刀，大概也活不了多久XD


  --

  這確實'
