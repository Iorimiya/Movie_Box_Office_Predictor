url: https://www.ptt.cc/bbs/movie/M.1721891128.A.973.html
title: '[好雷] 死侍與金鋼狼 心得'
content: '坐標南部縣市

  昨天得知國賓營業到下午四點

  一早趁風雨還小 衝早上第一場

  座位大概坐一半而已 觀影體驗舒服！


  以下流水心得文 有雷



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  優點：

  1.客串驚喜連連

  由於是看第一場沒被雷 之前外流資訊也沒揭露


  因此亨利狼還有美隊版的霹靂火都有被打中

  X23也是 長大變好正（後來才知道某版預告有出現）


  諸多客串的劇情 相較奇異博士2 恰到好處


  2.打鬥很讚

  充分發揮R級電影還有不死設定優勢

  看狼侍互砍很過癮 其他場斷手斷腳爆頭插肚都沒在客氣

  後面死侍軍團的類一鏡到底場面拍的好


  3.笑點很多

  大部分都有中 翻譯也符合台灣慣用語

  死侍在TVA著裝那段被抓了好幾次老二 笑了


  缺點：

  劇情很普  沒有起伏 沒有緊張感

  其實死侍前兩集就這樣


  總結 以爆米花電影來說 死侍絕對合格

  不僅找回狼叔 且透過TVA的虛空境界

  把X men 變種人的世界觀拉近漫威

  相較無家日後一堆慘不忍睹的作品

  這部說是漫威耶穌不為過 整體我覺得有80～85分


  小疑問

  侍狼取得本田奧德賽那個場景 是月光騎士幽靈船那個草原嗎



  --'
