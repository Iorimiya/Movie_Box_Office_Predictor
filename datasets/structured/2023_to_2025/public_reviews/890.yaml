url: https://www.ptt.cc/bbs/movie/M.1716453403.A.103.html
title: '[新聞] 《死侍與金鋼狼》北美預售創R級電影紀錄'
content: '《死侍與金鋼狼》北美預售創R級電影紀錄！首日狂賣800萬美金




  漫威電影宇宙年度人氣矚目爆點鉅作《死侍與金鋼狼》已於北美已正式展開預售，雖然7

  月才正式上映，但首日就以800萬美金（約台幣2.58億元）創下R級（美國的限制級）電影

  的新紀錄！《死侍與金剛狼》北美開售第一日售出800萬美元預售額，創下R級電影歷史紀

  錄，也超越去年《星際異攻隊3》的同期表現。




  該片終於讓《死侍》系列以及「金鋼狼」回歸漫威電影宇宙，導演薛恩李維透露本片靈感

  來源為80年代多部「不是冤家不聚首」類型的瘋狂動作喜劇，包括金獎影帝勞勃狄尼洛的

  《午夜狂奔》、笑匠巨星艾迪墨菲的《48小時》等多部經典雙搭檔喜劇，「堪稱超級英雄

  版冤家公路電影。」




  預售情況也展現了影迷對於該片的高度期待，正式上映後有望大賣一波、再創「死侍」高

  峰。《死侍與金鋼狼》將於7月24日搶先全美在台大銀幕登場。





  --'
