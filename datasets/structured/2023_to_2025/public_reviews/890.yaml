url: https://www.ptt.cc/bbs/movie/M.1719650719.A.0CD.html
title: '[討論] 死侍與金鋼狼客串卡司'
content: '外媒跟X傳了各式各樣可能會參演死侍與金鋼狼的卡司

  X戰警經典角色會回歸不太意外

  像是Azazel、Lady Deathstrike、Toad等變種人


  其他簡單分幾類：

  1. 可能性高

  -雷神索爾

  X上有看到確認的消息了，但不知道可信度有幾%

  畢竟短短客串或回憶片段也可能算出現

  索爾也是屬於偏嘴砲類型，兩個人如果同框出現應該有效果



  -奇異博士

  多重宇宙＋時間穿梭，第一時間想到的就是奇異博士

  加上預告中的這個場景 看起來像是奇異博士or王的能力

  不論是本體或變體，應該是有機會客串的



  -薩諾斯

  Josh Brolin演了薩諾斯+Cable

  同一部電影以不同角色出現會蠻酷的

  如果會演到彈指事件，熟悉的薩諾斯肯定要出現一下的

  接去死侍戴手套的那幕拯救整個MCU？



  2. 可能性中

  -X教授

  雖然在電影羅根裡已經領便當了，但在奇異博士2又再次出現

  隨著眾變種人的回歸，出現機率應該挺大？

  不然以奇異博士2作為這個角色最後一次出現，下場實在太慘...


  -夜魔俠

  不少新聞已經確定Jennifer Garner的Elektra會復出

  搭檔的Ben Afflick夜魔感覺也不是沒機會

  加上也有Ben Afflick準備加入MCU的新聞


  從死侍與金鋼狼開始加入不為過吧！


  3. 機率越來越低？

  -Taylor Swift

  從去年開始就一直盛傳會客串Dazzler雖然近期又有報導說不會

  但海報的Friendship Bracelet還是Blake Lively跟Taylor是摯友

  感覺官方還是有在刻意暗示



  以上統整，這次宣傳都敢稱Marvel救世主了

  希望最後不是雷聲大雨點小


  --'
