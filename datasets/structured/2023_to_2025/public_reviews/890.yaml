url: https://www.ptt.cc/bbs/movie/M.1721981510.A.958.html
title: '[普雷] 死侍 感覺演員很用力挽救劇情了'
content: '電影《死侍與金鋼狼》觀後感: 感覺演員很用力挽救劇情

  2024/07/26 我的個人觀後感分享。

  本文同步發表於巴哈姆特小屋。

  -------


  我剛看完電影，結論是可以看，但可以的話，請等到下檔後再看也沒關係。

  花錢看是沒關係的，作為娛樂片是及格的。

  然而看完後，我仍在思考他那劇情美中不足的部分，實在有一種遺憾，演員卡司之強大不

  免俗要讚賞一下，而劇情之零碎，則是一種硬傷。

  因此我的判斷是:這部電影是可以觀賞的，不過若要花錢進戲院收看，還請各位朋友珍惜

  金錢三思而行。

  等電影下檔後串流吧!若各位十分期待，那也歡迎進戲院支持!

  看看老朋友，休傑克曼、萊恩雷諾斯，兩人在劇中互動的化學效應，也有一番樂趣。


  閒聊結束


  我感覺演員很盡力挽救劇本了。

  總體上算普雷啦，不算太好或太差，服務粉絲的部分鏡頭都有及格，劇情發展中規中矩。


  劇本斧鑿感（拼貼的感受）非常深。

  以爽片和情懷的角度來說，可以接受。

  接著是防雷區~~~~請斟酌閱讀，謝謝。






  防雷

















  好的


  防雷結束


  開始



  情懷100分，劇本勉強55分。

  我可以感覺出死侍與金剛狼的演員們很盡力挽救這個劇本了......。


  1.主線劇情：「拯救死侍的宇宙」

  這是最主要的核心劇情。

  其次都可以說是支線劇情。


  死侍被時空局的男反派（很聒噪又沒記憶點）抓去當工具人，雙方談了一堆冗長台詞後，

  本來以為真的會是死侍一拳破局收場，之後劇情會跟以往一樣來個超展開。


  結果沒有。

  然而死侍卻還是乖乖的抓了金鋼狼回來交差。


  畢竟他確實是需要幫手，也就是金鋼狼來擔任他的宇宙的定錨點（因這個世界的金剛狼已

  死）。

  為了僅僅9位他在乎的人，死侍妥協了……。


  死侍到處跑其他宇宙尋找金鋼狼推動劇情，這是還不錯的開場，音樂很到位、畫面酷炫、

  觀眾感到興奮。

  然而劇情卻一盤散砂。

  可以直接當爽片看，認真研究劇本的邏輯，會吐血，大多地方是不合常理的，尤其是雙反

  派的部分（後面我再講）。


  好吧，死侍與金鋼狼，這勉強可以定位為一場公路電影，勉強。

  死侍與金鋼狼在對話和戰鬥過程中逐漸信任彼此解開心結，途中也遇見了舊友與新知。

  不過劇情節奏上，實在卡頓的令我坐立難安，非常擔心，如鯁在喉。

  劇情的發展有如拼湊拼圖，充其量只能說是以死侍風格來轉圜編劇可憐的節奏安排，搭配

  演員賣力演出，才勉強銜接上所有劇情合理性一樣的感覺。


  總之，演員很敬業的以超群演技挽救這奇怪的節奏安排。

  雙主角很盡力把焦點拉回主線劇情，支線劇情基本都有交代完畢，點到為止。

  兩人在旅程中從互相開殺直到互相理解，心境上的成長，算是有達到公路電影標準了，這

  一點至少是明確傳達給觀眾的。


  2.加入太多要素：

  本片最臭的點在反派角色，唉。


  男女雙反派，刻意為了成為壞人而壞人的角色，設計過於扁平。


  迪士尼的編劇為了show所有酷炫的超級英雄，讓情懷充斥出現在這部電影中，湊了一手好

  牌但編劇節奏實在扛不起大格局。

  讓他們的出現模糊了焦點，也沒能好好講一下那些串場的人是來幹嘛的？

  拔掉那些情懷英雄，也無關痛癢。

  反派則更慘，找任何人來當反派，都不影響劇情發展，可替代性太高。


  反派做壞事的核心價值在哪？

  男反派為了達到毀滅宇宙的目的，以獲得某些好處，但沒有明確說明是什麼好處，我實在

  不理解你到底有什麼資格當幕後黑手，有夠小物臭的。


  光頭女反派，忽略掉也沒關係，我只知道她是查爾斯的妹妹，X教授的血親，超能力猛猛

  的！

  她出現讓本片要素過多。

  廢土世界、一堆情懷英雄、與時空局兒戲般的黑幕    編劇編的實在令人失望。


  所以他們就算角色換了人都沒差，完全不影響，我甚至不知道這些反派有什麼背景故事？


  男反派的動機是什麼？以至於他的記憶點不足，看完電影後，連他的名字都想不起來，到

  底是來幹嘛的?只是作為一個壞人的定位罷了。


  男反派作為黑幕，與光頭女反派聯手，最後安插一個臥底要開槍弄死女反派。

  很難說服觀眾他瞞著黑人女上司要毀滅死侍宇宙的動機。


  光頭女反派，幹完全想不起來名字是三小，反正名字很長，她的存在目的在於「混亂邪惡

  」，沒有什麼實質上的意義，只是需要一個超幹爆強的超能力者反派，就這樣。


  3.最後以「情懷」做結尾是成功的

  除了第二個白痴片尾以外。


  第一個片尾（右邊小螢幕）才是真正的漫威耶穌。


  短短的幾分鐘讓所有回顧濃縮起來，不免會鼻酸。

  讓我覺得X戰警系列走過這麼多年了，看著老朋友金鋼狼，這麼多年來一直陪伴我們影迷

  ，看到老友再度回歸總是雀躍的心情，能和死侍合作，賣情懷的部分，這一點十分成功。



  講完了

  結論我放最開頭了～～～

  可以看，但不要期待劇本節奏，節奏很卡，反派的動機一整個無法說服觀眾。

  情懷的部分很讚

  看完電影後可以反覆思考，漫威到底在拍甚麼? 編劇沒問題嗎?

  至少我能體會演員盡力演出了，劇本還可以再打磨得更好，可惜了。
















  防雷






  防雷





  防雷

  --


  --

  片名死侍3，藏狼叔，確實口碑會起來蠻多的

  確實認同

  刀鋒戰士讓我HIGH到不行

  可惜只給小畫面==

  然後第二的結尾影片就蠻沒FU的

  硬生生嘎爆第一個結尾影片的情緒


  不連貫、破碎、難以銜接，劇情有演員極力挽救了，但是看過許多優質電影的人都能嗅到劇本的節奏詭異感

  那我只能說他想塞的要素太多了

  漫威覺得這樣很好，重啟方便

  我只想看一個舒服的故事，好好講完的故事就好

  第二集DP劇本寫得還不錯啊

  3Q

  喜歡的就喜歡

  等院線片下檔也可以


  蜘蛛人3 我內心有67分吧 攝影分鏡是敗筆 情懷拉滿

  死侍與金鋼狼 62分左右 劇情破碎 情懷拉滿

  尚氣 應該有75分 劇情連貫得太好

  此後的漫威電影交出的成績單幾乎沒合乎我內心合格線


  復仇者3和4 我內心有94分和96分的評價

  劇情連貫 畫面張力強 引人心弦 集大成之作品


  以上個人體感


  OK 那沒辦法了

  編劇也是要顧好生活品質的

  原來有問題的是我，我錯了。

  原來並非市場淘汰掉電影而是淘汰掉觀眾......

  漫威淘汰掉我了嗎......Q_Q

  哭((反串要註明

  我主張是劇情節奏不連貫，破碎感，銜接點總是怪怪的

  我的錯，對不起，漫威爸爸

  看電影我不會CARE彩蛋而去看

  我是為了看看老朋友休傑克曼和萊恩雷諾斯

  看他們倆互動很有趣


  編劇很像從霹靂布袋戲請來的

  撕裂感很深

  演員很賣力了

  握手，我也是=.=

  那段子的編劇絕對是寫得最好的......

  車子內戰是本片亮點之一

  是有一點賀歲片的感覺，每個人都要露面，台詞就會刪減，一直塞一堆角色，像是在園遊會，漫威電影的「多元宇宙」越來越有海賊王的味道惹。「過多不必要的配角」、「主角該發揮卻被debuff變弱」大概是變得很「群像劇」（每個人都要露面）這種感覺

  這一段劇情寫的非常讚，後續的處理就沒有相同的味道了，所以我才會主張說編劇像是接龍小說（破碎感、撕裂感、不連貫）照理同樣能寫出開場打鬥和車內刀戰的文筆，後面收尾階段品質不該落漆

  漫威電影現在普遍共識就是下檔再看了==，最頂的巔峰在復聯3、4後就沒了

  我也是，很開心可以見到狼叔，歡迎老朋友回歸大螢幕

  正常一個作品只靠彩蛋撐場是沒有料的，大多觀眾只是喜歡死侍的白爛反英雄風格、狼叔的多年好久不見的情懷，老實說拔掉其他人我都沒差，彩蛋也是，誰在乎漫威劇集和其他東西，拍好本身的故事就夠了，彩蛋只是調味料（加分但不必要）而已

  我認同你的觀點，商業畢竟是需要盈利取向。

  系列電影喔……其實連貫前後劇本和獨立中途看都一樣重要。


  我直接看電影蛛蛛人三，也不用事前補一堆功課，他可以單獨拿出來看。但同時他又能夠連貫前面蜘蛛人1、2，塞彩蛋。


  再來是系列作品，直接看哈利波特第七集小說，獨立看也可以，前面的人物簡介甚至跳過不看也沒差。

  根本不用擔心沒補前六本的小說……，但神奇的在於它能單獨看、又能連貫前作，不排斥新讀者加入，彩蛋不必擔心看不懂。

  撰寫者的基本功很重要，電影奠基於劇情，再怎麼說死侍系列電影也算黑色喜劇，而喜劇電影劇本是比悲劇電影還難寫的。


  對啊，就粉絲向爽片。

  就很漫威小圈圈，我承認，圈外的人看不知道會不會很孤立、很抽離感？大家都在笑，只有

  他不知道笑點如何，只因沒有接觸過漫威劇集或電影，糗了。成也情懷；敗也情懷。 漫威?

  {況就是如此，不避諱地說，同一招施展第二次，是沒有用的，企圖用華麗的彩蛋掩飾劇本?'
