url: https://www.ptt.cc/bbs/movie/M.1714505268.A.096.html
title: '[新聞] 漫威粉絲今年沒有暑假作業 死侍與金鋼狼'
content: '漫威粉絲今年沒有「暑假作業」！《死侍與金鋼狼》導演證實：觀眾可以「白紙一張」進

  場享受




  貴為即將肩負「漫威救世主」重任的《死侍與金鋼狼》（Deadpool and Wolverine）將會

  正式把觀眾熟悉的福斯宇宙與 MCU 正式串連，華麗的多重宇宙卡司名單也讓人眼花撩亂

  。


  不過根據導演透露，大家其實可以放鬆進場享受這部電影，不需要擔心沒有看過《X戰警

  》等福斯系列電影。


  「我曾經是個好學生，就算長大了也會乖乖做功課。但是在看電影的時候，我絕對不想做

  功課。」


  導演 尚恩李維（Shawn Levy，下圖中）日前接受《Associated Press》專訪表示：


  「當我在拍這部電影的時候，我始終感激這群狂熱粉絲，他們對這個神話世界擁有如此深

  厚的認識，但我不會假設每個觀眾都具備這樣的知識量，這部電影的宗旨在於娛樂，觀眾

  完全不需要事先做任何資料。」




  《死侍與金鋼狼》自籌備以來不乏鋪天蓋地的傳聞，程度不亞於《蜘蛛人：無家日》（Sp

  ider-Man: No Way Home）當年的三代同堂之亂：萬幸目前輿論沒有圍繞著泰勒絲（Taylo

  r Swift）或 丹尼爾（Daniel Radcliffe）這些未證實的重量級傳聞糾纏不休。


  對於這樣的現象，導演也樂見其成，他認為這些不脛而走的瘋狂傳聞都在預期之內，因此

  是個很好的現象。


  新聞來源： Associated Press


  新聞網址：






  --'
