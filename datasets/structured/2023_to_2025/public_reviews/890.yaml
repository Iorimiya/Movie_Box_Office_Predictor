url: https://www.ptt.cc/bbs/movie/M.1722658676.A.0F4.html
title: '[好無雷] 死侍與金鋼狼 不用懂太多也還好  '
content: '最近版上看到許多死侍與金鋼狼的討論

  很多人抨擊劇情薄弱跟觀看門檻高

  要很鐵的漫威、X戰警迷才有辦法get到每一個笑點

  我同意部分的說法，但提供部分以外的觀點參考


  先說劇情部分，死侍系列打從一開始就不是漫威的主劇情線

  所以他很少跟關鍵劇情與角色沾上邊

  賣的就是死侍個人的魅力

  基本上就是可以當搞笑動作片來看

  所以在劇情這個點上我是覺得還行

  基本上夠好笑、有精彩的打鬥畫面我就給過

  不懂為啥觀眾都希望電影能講出大道理或劇情上有突破ＸＤ


  再來門檻的部分

  我是跟我女友去電影院看的 她滿少看漫威跟X戰警

  但對於嘴賤跟動作戲的部分還是挺買單


  我自己是漫威迷，但X戰警系列不到太熟

  所以裡面的笑點大概只能get到八成

  但這反而讓我有想二刷或是看更多解析的衝動

  就跟之前看沙丘也是一知半解，看完解析甚至對原著產生興趣

  諾蘭導的電影像奧本海默跟天能，每次看完也是讓人霧煞煞但又想了解背後故事

  這其實也是看電影的樂趣之一啦！


  目前國外影評評價好像普普，相反觀眾分數很高

  但不論如何電影努力拋彩蛋的用心程度還是讓人印象深刻


  -----

  Sent from JPTT on my iPhone


