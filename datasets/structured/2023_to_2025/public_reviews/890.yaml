title: '[普好雷] 死侍與金鋼狼'
content: '《死侍與金鋼狼》正片看到一半，我很自然想到了《無敵破壞王》：

  那些被關機的遊戲角色，在消滅前逃難到中央車站──這不正是死侍

  片中的虛無之地嗎？一個被遺棄的廢土世界。


  這個設定是我全片最喜歡的地方。論賣情懷，《X戰警》已有一部卡司

  更強大的《未來昔日》在前，要拚是拚不過的，但是我們一路看著《X

  戰警》、《驚奇四超人》系列電影過來，再看到福斯被迪士尼併購，

  套入設定格外有感。


  迪士尼不打算沿續這些舊宇宙，於是福斯宇宙被剪定，邁向終結，舊

  角色流落到虛無之地求生，或被遺忘。死侍讓這些角色有機會再登場

  謝幕。老角色賣情懷，在多元宇宙泛濫的電影早玩到爛了，但是這個

  情懷我吃。


  至於被死侍意淫了兩集，第三集終於可以在大銀幕搞基的金鋼狼，老

  實說兩人之間的火花不如預期，沒有那種互相鬥嘴金句連發的場面。

  可以去找個會毒舌吐槽的金鋼狼回來嗎？


  當然純看狼叔戲份，還是能滿足狼叔粉的，該帥的該賣肉的都沒少，

  時間管理局說的沒錯，狼叔才是扛起X戰警的定錨者。


  死侍自稱是「漫威耶穌」，相信只是自嘲罷了。就算這部片大賣，死侍

  的調性也和漫威的教育路線格格不入，更不可能當上鋼鐵人之類的角色

  到處客串。漫威也藉時間管理局的話告訴你了：我給你一個定錨者

  (金鋼狼)，讓你的世界活下來了，你就好好待在自己的小世界吧。

  想回歸漫威宇宙？抱歉，你可不是親兒子蜘蛛人！




  --'
