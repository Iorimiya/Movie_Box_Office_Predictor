title: '[新聞] 《死侍與金鋼狼》雙帥互噴 嬌妻開嗆'
content: "《死侍與金鋼狼》雙帥互噴 嬌妻開嗆\n\n2024/07/11 05:30\n\n\n萊恩雷諾斯（左）和休傑克曼為宣傳《死侍與金鋼狼》驚喜現身潑水節互噴。\n\
  （漫威影業提供）\n\n〔記者許世穎／綜合報導〕「死侍」萊恩雷諾斯和「金鋼狼」休傑克曼最近忙著宣傳新片\n《死侍與金鋼狼》，世界宣傳巡迴上週起跑，雙帥戲裡戲外都不放過彼此，在南韓出席音\n\
  樂潑水節時在台上「互噴」掀高潮。\n\n萊恩戲稱這次巡迴宣傳就像漫威出錢讓他們度過「人生最棒的假期」，讓他的老婆大人布\n蕾克萊芙莉立刻隔空猛虧：「那個男人跟我說要出國上工，結果發現他竟然是去過春假！\n\
  你麻煩可大條了！」休則表示回顧這場世界巡迴宣傳，「就好像在看部浪漫喜劇」。\n\n導演薛恩李維打包票該片不只刺激爆笑，更是溫馨感人，就跟他的所有前作一樣，都是以\n\
  角色之間的真摯情感為核心。《死侍與金鋼狼》將於7月24日在台上映，預售票已正式開\n賣。\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n \
  \ 是 佛        是 菩薩\n\n\n\n--"
