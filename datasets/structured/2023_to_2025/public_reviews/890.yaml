url: https://www.ptt.cc/bbs/movie/M.1721817953.A.0A9.html
title: '[普雷] 死侍與金鋼狼'
content: '其實很想給負雷











  以下有雷 很多雷


  為了怕看不懂 看之前有稍微做了點功課


  劇情部分網路上很多猜測都猜中7.8成了


  想給負雷的原因主要是

  1.故事太鬆散

  第一趴用羅根的骨頭扁人的段落就長到有點拖沓

  會有種"這個節奏不會有問題吧"的不安感

  好幾次一言不合就噴血漿的段落

  看得有點疲乏


  2.突破第四面牆很棒 但是...

  整部電影從頭到尾都在開各種突破第四面牆玩笑

  從電影公司 到演員本人 到演員作品

  但是 真的太多了

  不誇張幾乎每一幕都有

  說真的整部電影的鋪陳很多地方都不太夠

  文戲部分相當尷尬

  有的台詞就像是速食電影那樣

  快速念稿帶一下世界觀

  告訴你之前怎麼了 等等要幹嘛

  然後還有更多的是根本沒有解釋交代的東西

  如果把過多的碎嘴吐槽留給劇情鋪陳感覺會更好


  3.廉價的舊角彩蛋

  相遇 念稿 打架or組隊打架

  如果知道角色很多沒有辦法每個人都好好發揮

  那就不要塞這麼多角色跟無謂吐槽啊

  要搞到像趕場那樣真的不如不要出來


  話雖如此

  電影後半段收得還算不錯


  橫軸模式的死侍群大混戰很好笑

  （整部動作場景個人評價最高的部分）

  金鋼狼原汁原味的制服+面罩（！）

  羅根各種花式殺死侍出氣

  結尾布魯斯威利式的犧牲橋段都不錯


  還有跑字幕時

  旁邊放的歷年各種超級英雄的拍攝花絮

  （主要是修傑克曼）

  看了還是有滿滿回憶湧上來


  整體來說還是可看啦

  不過以死侍系列作來說 算是相對較差的一集

  就是那種想復刻前作成功處

  但是塞太多導致故事沒說好的那種續集電影


  --'
