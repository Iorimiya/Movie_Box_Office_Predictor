title: '[新聞]'
content: '〔記者許世穎／綜合報導〕漫威電影宇宙今年唯一大銀幕鉅作《死侍與金鋼狼》持續在全

  球熱賣，全球票房繼成為第2部全球票房突破10億美金的R級（美國的限制級）電影後，




  《死侍與金鋼狼》除了是今年繼《腦筋急轉彎2》後第2部全球票房破10億美金的電影，同

  時也是漫威電影宇宙繼2021年《蜘蛛人：無家日》之後再度進入10億美金俱樂部的作品。


  漫威昨也曝光全新廣告，將片中萊恩雷諾斯飾演的「死侍」合體休傑克曼化身經典「金鋼

  狼」造型的畫面，背後加上《死侍與金鋼狼》片名大擺POSE，最後以死侍嗆聲福斯，直喊

  「我要去迪士尼樂園了！」做結，開心宣布該片成為史上票房最高的R級電影。


  之後也分享了一張圖片，寫道「來自凱文費吉的辦公桌」（凱文費吉是漫威影業執行長）

  ，只見圖片裡的紙條寫著「感謝你們讓漫威影業的首部R級電影成為有史以來最賣座的一

  部。很高興看到觀眾們像我們製作這部電影時一樣喜愛它。所有的討論都是值得的！」




  《死侍與金鋼狼》持續在台上映中，全台票房突破台幣2.5億，已登上2024年度票房第3名

  。



  《死侍與金鋼狼》目前寫下的全球紀錄（截至8月15日）


  開片紀錄：


  2024年全球票房開片冠軍（4.44億美金）


  2024年北美票房開片冠軍（2.11億美金）


  2024年台灣票房開片冠軍（台幣1.02億）


  R級電影紀錄：


  影史R級電影全球開片冠軍（4.44億美金）


  影史R級電影北美開片冠軍（2.11億美金）


  影史R級電影全球票房冠軍（10.85億美金）


  影史R級電影北美票房冠軍（5.16億美金）


  《死侍》系列紀錄：


  《死侍》系列全球票房冠軍（8.24億美金）


  《死侍》系列北美票房冠軍（3.95億美金）


  萊恩雷諾斯與休傑克曼個人紀錄：


  從影最高全球票房（10.85億美金）


  從影最高北美票房（5.16億美金）


