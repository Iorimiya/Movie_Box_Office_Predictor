url: https://www.ptt.cc/bbs/movie/M.1707752466.A.6AC.html
title: '[新聞] 漫威救世主來了！「死侍與金鋼狼」超大彩蛋曝光'
content: "漫威救世主來了！「死侍與金鋼狼」超大彩蛋曝光\n\n2024-02-12 11:35\n\n聯合報 記者林士傑／即時報導\n\n\n萊恩雷諾斯(左)找多年好友休傑克曼演出「死侍與金鋼狼(暫譯)」。圖／摘自IG\n\
  \n真的來了！萊恩雷諾斯籌備多年的「死侍與金鋼狼」（DEADPOOL & WOLVERINE，暫譯）上\n月宣佈殺青，12日釋出預告，劇情延續前作中跳脫電影嘲諷現實的惡搞元素，製片凱文費\n\
  吉證實本片將是漫威電影宇宙首部R級電影，死侍本人甚至表明開嗆：「我就是漫威電影\n宇宙救世主！」打臉所有超級英雄。\n\n作為「死侍」系列的第3集，「死侍與金鋼狼」不僅是此系列加入漫威電影宇宙的第一炮\n\
  ，並象徵X戰警正式「回歸」漫威懷抱。雙方繼「X戰警：金鋼狼」闊別15年後再度並肩作\n戰，卻風水輪流賓主位置對調，死侍也不可同日而語，從寡言硬漢變成賤嘴長舌公。\n\
  \n除了「死侍」萊恩雷諾斯、「金鋼狼」休傑克曼之外，前2集深受觀眾喜愛的鋼人、青少\n女彈頭和雪緒，都在首支前導預告中再度現身，而已領便當的X特攻隊彼得等人也驚喜「\n\
  起死回生」，他們一起替帶著超俗假髮的死侍慶生，未料時間變異管理局的探員忽然現身\n將他帶走，且說這是他成為「英雄中的英雄」的難得契機，「死侍與金鋼狼（暫譯）」預\n\
  計於7月24日搶先全美震撼在台登場。\n\n\n「死侍與金鋼狼(暫譯)」釋出首支預告。圖／漫威影業提供\n\n--\n佛法\n 是菩薩成佛之道\n      \
  \  是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
