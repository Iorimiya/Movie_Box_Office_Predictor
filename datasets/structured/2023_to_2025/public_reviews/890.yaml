title: '[新聞]《死侍與金鋼狼》稅收抵免逾1億美元 英民眾'
content: "《死侍與金鋼狼》稅收抵免逾1億美元 英民眾不滿\n\n【大紀元2025年11月30日訊】（大紀元記者葉子杰編譯報導）最近，漫威電影《死侍與金\n\
  鋼狼》製作成本揭曉，耗資超過5億美元，這個金額超過原本的製作預算。由於該片在英\n國開拍，獲得英國稅收抵免逾1億美元，引發了英國社會人士的不滿。\n\n《死侍與金鋼狼》（Deadpool\
  \ & Wolverine）全球票房高達13.4億美元，成為自新冠疫情\n後，漫威唯一一部票房突破10億美元的電影。不過，據《富比士》報導，迪士尼在英國提\n\
  交的製作文件顯示，該片最終獲得的利潤可能遠低於預期。截至2024年10月31日（電影上\n映三個月後）的財務報表顯示，這部電影製作成本約4.181億英鎊/約5.337億美元。成為\n\
  有史以來最貴的十部電影之一。\n\n財務報表顯示「最終成本超過了製作預算」，主要原因是2023年的美國演員和編劇罷工嚴\n重干擾了該片的拍攝。但據報導，迪士尼因為在英國拍片，共獲得1.047億美元（8,200萬\n\
  英鎊）的稅收抵免，因此，該電影上的淨支出降到了4.29億美元（3.361億英鎊）。\n\n據《The Standard》報導，這是英國從2007年推出稅收抵免政策以來，單年支付給電影公\n\
  司的稅收抵免最大的一次。並舉一個對比做說明：給《死侍與金鋼狼》的這筆錢，足夠支\n付4,227個人工髖關節置換術，或者買61台磁振造影儀器（MRI）。\n\n\
  這引發了一場關於向大型製作公司、特別是像迪士尼這樣強大的影視公司提供稅收抵免的\n爭論。據報導，在政府提高能源價格上限，再加上即將增加稅收的背景下，這筆抵免補助\n\
  讓英國部分人士特別有意見。\n\n納稅人聯盟的執行長約翰‧奧康奈爾（John O’Connell）對《死侍與金鋼狼》的稅收抵\n免表示：「現在普通家庭的稅負越來越重，政府卻把幾千萬英鎊送給全球最賺錢的公司之\n\
  一，讓他們拍超級英雄電影，真的是令人匪夷所思。這種補助應該取消或是嚴格限制。納\n稅人的錢應該用來改善公共服務，而不是幫助這些全球娛樂巨頭的資產負債表。」\n\n\
  稅務政策專家丹‧尼德爾（Dan Neidle）補充說：「現在的電影稅收抵免規定對電影產業\n確實很重要，但我不太確定這對整個英國來說是不是划得來。」對此，該報導也舉例了\n\
  2013年英國政府的文件，讓人驚訝的是政府在文件中承認，這些激勵措施「預計不會帶來\n顯著的廣泛宏觀經濟影響」。不過，這份文件距今已有12年之久。\n\n\n\
  《死侍與金鋼狼》劇照。（迪士尼提供）\n\n另據《富比士》《That Park Place》報導，儘管《死侍與金鋼狼》票房收入逾13億美元\n，但幾乎沒有賺到太多錢。迪士尼從來都拿不到全部票房收入。通常情況下，製片廠只能\n\
  拿到美國票房的55%左右，國際票房的40%左右，而來自中國的票房分成則更少——通常只\n有25%。\n\n迪士尼從分成中預估獲得6.7億美元的票房，減去製作成本4.29\
  \ 億美元的淨支出只剩下\n2.41億美元的利潤。而漫威大片的行消費用超過2億美元，這樣利潤率就會變得非常低。\n\n責任編輯：蘇漾\n\n\n\n--\n 神韻晚會觀眾反饋（2025）\n\
  \n--"
