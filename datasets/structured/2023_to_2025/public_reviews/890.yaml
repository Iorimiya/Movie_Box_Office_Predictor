url: https://www.ptt.cc/bbs/movie/M.1719991233.A.39F.html
title: '[新聞] 死侍與金鋼狼 首映前40分鐘 好評曝光'
content: "來源\n\n\n------以下有《死侍與金鋼狼》劇情透露，請斟酌閱讀！------\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n眾所期盼的《死侍與金鋼狼》（Deadpool and Wolverine）電影將在本月底震撼登場，該片\n日前在上海展開首場全球巡迴首映，包括萊恩雷諾斯（Ryan\
  \ Reynolds）、休傑克曼（Hugh\nJackman）與導演 尚恩李維（Shawn Levy）都抵達上海與幸運觀眾見面。而會場播放了電影\n前 40 分鐘片段，在與會貴賓之間傳來一片好評。而前\
  \ 40 分鐘的描述也在網路上曝光：\n\n1. 整體來說非常暴力、有趣。很棒的動作戲、編曲、一些很情緒化的場景。\n2. 與《羅根》電影結局有一些非常暴力的連結。\n\
  3. 死侍找上了不同金鋼狼的變體，其中包括老人羅根、喪屍羅根等。\n4. 有大量關於迪士尼併購福斯的笑話。\n5. 大量的客串\n6. 目前所有公開預告的片段都只出自於這\
  \ 40 分鐘裡。\n7. 其中一個宇宙中，出現金鋼狼大戰浩克情節\n8. 女死侍戴著面罩，但聲音聽起來很像雷諾斯的妻子 布萊克蕾芙莉（Blake Lively）\n\
  9. 像是摻了死侍幹話版的《復仇者聯盟：終局之戰》\n特映結束後，網路上的反映也普遍熱烈，與會的網友一致同意「死侍」就是漫威救世主，將\n漫威的高度一次推回《終局之戰》前的頂峰。\n\
  \n據悉，這次在上海首映並沒有特別明顯「被和諧」血腥、暴力鏡頭照樣打好打滿，但在一些\n粗口的部分仍有「趣味性地」消音，不確定中國院線上映後是否會是同一個版本。參與的博\n\
  主多數給予正面評價：\n「當漫威經典片頭的音樂響起，一眾復聯角色的畫面中出現了死侍，我還是會有一種恍如隔\n世的感覺，X戰警這次是真的真的回歸了」、「死侍幫漫威掀開了即將蓋嚴的棺材板，救世主\n\
  的意味明顯。」、「一氣呵成酣暢淋漓的開場+片頭，已經可以感受到特效的震撼力了。」、\n「就目前的片段來看，節奏非常流暢，爆點紛至沓來，但又感覺不少預埋，感覺後期會像\
