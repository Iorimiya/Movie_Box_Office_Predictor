title: 'Re: [情報] 香港開畫人次：《哆啦A夢》贏《死侍與金鋼狼》'
content: ':


  2019年時，漫威系列在日本被哆啦A夢攔截


  時至今日2024年，漫威系列再度在香港被哆啦A夢攔截


  P.S:台譯哆啦A夢/港譯多啦A夢，看到錯別字太多次了

  只要罰寫十遍:哆哆哆哆哆哆哆哆哆~哆~~啦A夢變成星野源《哆啦A夢》之歌就不會忘了


  昨日8/1為《電影哆啦A夢：大雄的地球交響樂》在香港上映首日

  其單日進場人次統計結果贏過死侍與"狼人"(港名)，拿下新片開畫第一


  (圖片來自香港州立影片發行)


  期待台港哆啦A夢電影都能繼續勢如破竹，創新紀錄

  也能早日讓《100%哆啦A夢&Friend》巡迴展來台灣辦


  不得不說台灣這次哆啦A夢有被藍色監獄影響到

  外加威秀影城給人家場次安排得亂七八糟(少就算了，時間還爛爛，加上隔週快速砍場次)

  周邊套餐也delay兩天才補齊

  而且也沒像往年舉辦特別場，只給了像角落生物那類的

  結果只靠著自己就越過別人的票房，再加上衰退的沒那麼快，還是有望突破去年紀錄

  這次台灣首度第四週還有影城購票禮可以拿，趕快繼續三刷起來吧!



  --'
