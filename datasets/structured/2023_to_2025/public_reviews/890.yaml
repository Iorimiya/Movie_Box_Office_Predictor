title: '[新聞] 導演澄清《死侍與金鋼狼》並非《死侍3》'
content: "導演尚恩李維澄清《死侍與金鋼狼》並非《死侍》續集：這不是《死侍 3》！\n\n新聞網址：\n\n先找原文：\n\n漫威年度暑假大片《死侍與金鋼狼》（Deadpool\
  \ & Wolverine）前幾天到訪電影博覽會\nCinema Con 造勢，並在現場首度釋出了第二支預告片，引起媒體觀眾巨大迴響。跟著電\n影一同蒞臨宣傳的尚恩李維（Shawn\
  \ Levy）導演，也在活動結束後接受了《Collider》採\n訪。\n\n李維表示，他們在會場播放的內容只是開胃菜，電影第一幕的一點點劇情鋪陳，遠遠不是\n\
  最有趣、最瘋狂的部份，因為他不想像大多數電影一樣，直接就剪出整部片的精華版給觀\n眾看。\n\n儘管外界普遍認定《死侍與金鋼狼》是《死侍》第三集，但李維嚴正否認了這點：「我們\n\
  已經進行了一些初期試映，而觀眾的迴響都非常好。我不會說電影裡會有什麼大驚喜，但\n你會在其中感受到敘事節奏希望加快的時刻，也會感受到可以放慢節奏，並藉此創造出更\n\
  有深度更紮實的角色塑造時刻。 總歸來說，正如我認為我們早前就說過的，這在很大程\n度上算是一部《死侍》電影，但這並不算是《死侍3》，這是《死侍與金鋼狼》，它是自\n\
  成一格的。」\n\n《死侍與金鋼狼》北美地區預定今年 07 月 26 日正式上映，台灣則預計於 07 月 24 日\n搶先登場。\n\n--\n       \
  \             \n                ███           \n \n   ★        ζ███        ███ζ\
  \ \n      is a good day with !\n          ★       \n\n--"
