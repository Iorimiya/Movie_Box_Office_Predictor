url: https://www.ptt.cc/bbs/movie/M.1721806580.A.BFC.html
title: '[好雷] 死侍與金鋼狼 巨量彩蛋討論'
content: '雷文防雷資訊頁










  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~










  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  運氣很好所在縣市白天影城還有開


  但怕下午就休息了所以衝了早場


  感想就不說了


  反正絕對值得去看


  趁還有記憶整理一下我所知道的彩蛋：


  1. 開頭跟TVA人員打鬥死侍喊等一下，是致敬死侍1開頭的打鬥片段


  2.韋德跟快樂面試的時候提到他從司機晉升到保安主管指的是鋼鐵人3的劇情，而桌上則

  放著小辣椒送給東尼的”證明東尼史塔克有心”的反應爐，在東尼喪禮上也有出現，後面

  的櫃子則放著鋼鐵人MK5的裝甲公事包，就是在鋼鐵人2賽車場出現的那套


  3. 其中一個金鋼狼變體是DC超人亨利卡維爾演的，剛好前一陣子他跟漫威已經簽了片約

  ，只是演什麼角色還沒公佈，不知道這段是不是因為簽了片約被找來客串才加進來的


  4. 所謂的神聖時間線漫威電影主宇宙616是在洛基第一季第一集才定調的，原本漫威電影

  宇宙是稱作宇宙199999，漫畫的主宇宙才是616，而FOX X戰警宇宙這次被定調為100005，

  但跟換演員的X戰警四部曲是不同宇宙


  5.虛空出現的X戰警反派都是X戰警三部曲的反派，除了紅魔鬼是X戰警第一戰的反派


  6. 紅坦克在死侍2有出現過，是萊恩雷諾斯本人演的，但這次已經定調死侍是最早期X戰

  警三部曲的時間線，所以這部分算是Bug，這次電影也沒有解釋


  7. 幻影殺手、刀鋒戰士、X-23都是原本的演員演出，但我不確定有沒有看錯，金牌手好

  像是查寧塔圖演的，不是金鋼狼第一集的泰勒基奇


  8. 沒有出現但有被提到的角色有：制裁者、快銀、夜魔俠，因為以上角色都被諾瓦幹掉

  了，幻影殺手又是夜魔俠的女朋友，所以死侍才會跟幻影殺手說抱歉，而他們進攻諾瓦基

  地的火箭炮原本是制裁者所持有的


  9.X戰警反派的交通工具，有一台是驚奇四超人的飛行船，其中一台火焰塗裝的老車是鋼

  鐵人東尼史塔克在家改裝的那台


  10.克里斯伊凡的霹靂火出現的時候包的緊緊的，所以死侍誤以為是美國隊長，他喊的：

  復仇者集結是終局之戰最後的大決戰美國隊長喊的，其實這句經典台詞原本在復仇者聯盟

  2的最後美國隊長也有喊，但只喊了復仇者，集結被剪掉了


  11.虛空出現FOX影業的大型LOGO，因為FOX在好幾年前已經被迪士尼收購，而X戰警跟驚奇

  四超人原本的電影版權是FOX持有，有趣的是當年因為緋紅女巫跟快銀因為同時擁有X戰警

  變種人跟復仇者的身份，所以復2要加入這兩個角色的時候，漫威跟FOX協調可以使用角色

  ，但不能在劇情中提到英雄名，所以緋紅女巫在FOX收購之前都一直叫本名汪達，直到收

  購後才在汪達與幻視正式出現緋紅女巫的名字


  12.幻影殺手等人的根據地門口有奇異博士2出現的緋紅女巫雕像



  目前只大概記得這些


  歡迎一起討論


  --



  對耶，你這麼一說我就想起來了

  難怪他會說那句接下來要紅

  原本也是滿滿的吐槽點

  我還以為是因為他有客串脫稿玩家萊恩才找他

  他只能期望未來X戰警重啟漫威能考慮他了




  只能說跟未來的作品無關

  但也是值得憋尿看完



  是機堡的手環沒錯

  他有舉起左手上面就戴著手環'
