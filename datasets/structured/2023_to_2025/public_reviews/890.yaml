title: '[雷] 死侍與金鋼狼 太讚了'
content: '以下轟頂巨雷













  太好看啦


  根本就是變種人大集合


  太多以前的角色客串


  沒換人的有

  劍齒虎

  美國隊長feat.強尼

  火人

  阿薩佐

  幻影殺手（珍妮佛嘉納沒什麼變耶，一看到好驚奇）

  刀鋒戰士（超驚奇，穿戰甲還是很酷） X-23


  換人演的有

  紅坦克（變小隻肌肉男）

  金牌手（天啊，這才是卡通裡面的金牌手吧，上一版本根本是坨屎，查寧坦圖現在也太會客

  串了吧，而且客串的都很好笑）

  靈蝶（感覺有換人演）

  變色龍（感覺也有換人演）


  X教授的妹妹也太強了 念力無敵 物理傷害還可以治癒

  本來想說要怎麼收尾 根本沒人打得贏吧 最後是靠能量爆炸可以接受


  死侍賤嘴還是一樣很有水準


  Marvel Jesus, you can call me MJ. 真的是夠白爛


  還安排了金鋼狼跟強尼各賤嘴一段 快笑死


  終於有回到漫威之前電影的水準了


  不然前幾部真的都差強人意


  真的不虧是彌賽亞，漫威耶穌，救世主來的


  --'
