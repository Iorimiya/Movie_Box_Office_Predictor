url: https://www.ptt.cc/bbs/movie/M.1714125735.A.293.html
title: '[新聞] 死侍之父證實《死侍與金鋼狼》片尾彩蛋'
content: '《死侍與金鋼狼》片尾彩蛋會有超驚喜畫面？！「死侍之父」證實：沒有騙人


  即將在今年7月24日上映的《死侍與金鋼狼》，光是漫威釋出的兩段預告片，就已經讓觀眾

  期待度破表，但其實從中無法得知太多資訊，除了沒有客串彩蛋，也沒有與先前作品有過多

  的連結。不過推特有名用戶，稍早發文透露，在正片結束後，將會有一個「令人震撼」的片

  尾彩蛋，而創作出死侍（Deadpool）角色的漫畫家羅布利菲爾德（Rob Liefeld）在底下留

  言證實：「他沒有騙你」。




  《死侍與金鋼狼》電影的資訊始終保密到家，這是導演薛恩李維（Shawn Levy）的有意安排

  。他在先前的CinemaCon上透露，為了避免劇透影響觀眾的觀影體驗，特意選擇保密劇情。

  他希望觀眾能在電影院裡享受到真正的驚喜。因此，預告片中只使用了前20分鐘的片段剪輯

  ，類似於《復仇者聯盟：終局之戰》的策略，這種做法確實取得了良好的效果，加上漫威一

  向擅長在預告片中「動手腳」，使得猜測電影的細節幾乎是瞎子摸象。



  據內部消息MyTimeToShineHello透露，他已經看過片尾彩蛋，稱其為「令人震驚」的內容，

  並在X上寫下「天啊！這太棒了，我不會爆雷，但《死侍與金鋼狼》的片尾彩蛋太令人興奮

  了，我不敢相信他們能夠在無人得知的情況下完成這一切」，字字句句都透露了片尾彩蛋有

  多麼令人期待，更重要的是死侍之父，羅布利菲爾德（Rob Liefeld）也在底下留言證實這

  項消息。



  消息曝光後，引發了粉絲們的猜測，紛紛表示已經迫不及待想要看到片尾彩蛋，可能與漫威

  宇宙連結相關，有些人留言表示，這個彩蛋可能會讓電影院的觀眾為之瘋狂。如果有興趣，

  可至原推的底下看留言，也許會有一些消息暗示彩蛋的內容（可能含劇透斟酌點閱）。


  談到羅布利菲爾德（Rob Liefeld），他除了是創作出「死侍」的漫畫家，更曾在首集電影

  中客串，此外他的漫畫《Avengelyne》將被翻拍成電影，並由瑪格羅比（Margot Robbie）

  主演及製作，導演則為奧莉薇亞·魏爾德（Olivia Wilde）。



  原文：




  --'
