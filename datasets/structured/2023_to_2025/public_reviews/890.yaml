url: https://www.ptt.cc/bbs/movie/M.1722102145.A.D46.html
title: '[惡無雷] 狗幹爛的 死侍與金鋼狼'
content: "1.\n你知道嗎，最後戰役和金鋼狼前傳其實挺好看的\n\n2.\n我要謝謝颱風沒讓我花大錢看IMAX\n\n3.\nTVA時間線相關劇情爛爆，我從洛基影集就很討厭這個又爛又無聊又不合理的白癡組織白痴設定，結果你他媽的居然還是這集的劇情主軸，玩得還比影集更爛，當個引子額外寫個穿越劇情不好嗎？\n\
  \n4.\n武打戲MCU歷來最爛，不說我還以為是哪個同人社團自嗨的成品\n\n5.\n為噴血而噴血，配上第4點除了噁心之外沒有任何爽點，過猶不及\n\n6.\n\
  角色塑造跟沒有一樣，一直穿插著比面紙桶還長的垃圾幹話，而且這幹話的品質還像是濕透了的面紙一樣糟糕，完全失去前兩集在關鍵點畫龍點睛的效果，濫竽充數\n\n7.\n\
  作為賣點的兩位主角除了言語和物理互幹，完全沒有任何有意思的互動和火花，爆幹沈悶，結尾也沒有任何感動\n\n8.\n包含金鋼狼在內的所有references和回鍋配角出場沒梗，幾乎像是給導演在蒐集公仔擺好看的\n\
  \n9.\n大反派我真的不知道她到底設計來幹嘛的，設定和任何演出沒任何值得讓我在乎的點\n\n10.\n不會玩多元宇宙梗就不要拍好嗎，幹你費吉\n\n11.\n\
  恭喜迪士尼用這片來宣告不只MCU死了，其他包含福斯和任何漫威真人劇都死了，真棒\n漫威耶穌？ 不如說漫威法醫\n\n12.\n本片最好看的是工作人員名單旁放的幕後片段，裡面演員的任何情感和動作比本片任何橋段更強烈讓人感受\n\
  \n\n\n我再去看任何漫威P4之後的新片\n\n罰我下輩子變成被車輾過的老鼠\n\n\n\n\n-----\nSent from JPTT on my iPhone\n\
  \n--\n                       人類持續地在星空中尋求真理\n                  但若沒有帝皇及他的死亡天使的神力護佑\n\
  \                     我們已立於毀滅的邊緣並已然墮落\n                       在鮮血裡冶煉  於戰鬥中鍛造\n \
  \                   我們是人類中的活體武器--\n                                            \
  \        <<戰鎚40000:星際戰士>>\n\n--\n（應需求刪除有雷推文"
