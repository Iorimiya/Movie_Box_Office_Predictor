url: https://www.ptt.cc/bbs/movie/M.1720782278.A.139.html
title: '[討論] 死侍與金鋼狼 看前複習死侍1、2'
content: '繼死侍2之後已經6年的時間，又橫跨了兩個漫威階段

  終於等到這個角色的續作，而且還是跟金鋼狼一起回歸

  有點忘記劇情的話，可以一起複習XD


  第一集惡棍英雄：死侍

  死侍韋德·威爾森(Wade Wilson)，原本是技藝高超的前特種部隊成員和僱傭兵

  以敏捷的身手、無情的戰鬥技巧和雞掰的幽默聞名

  在一次工作中，韋德被診斷出罹患了癌症末期

  在他的人生快走向終點時為了能與女友凡妮莎繼續在一起

  決定參與一個不人道的人體實驗，希望能找到治療方法

  實驗原本只是想啟動他體內的潛在突變基因，結果同時也摧毀了他的臉蛋...

  套句萊恩雷諾斯自嘲基本上個就是長了牙齒的蛋蛋

  但同時也賦予他超變態的自癒能力和身體素質

  （影片一：韋德成為死侍）




  這集還有兩位X戰警-鋼人、彈頭 一起組隊

  但他們的確不是X戰警很有名的角色（後面還嘴是因為經費不足才只能請得起這兩個XD）

  （影片二：死侍VS鋼人）



  成功復仇後，也是死侍第一次在凡妮莎面前展現出他的面貌

  幸好凡妮莎完全不在意的吻了他，是個Happy Ending

  本集重點：死侍起源、兩位X戰警組隊、跟凡尼莎的愛情故事

  沒錯第一集知道這些就足夠了XD


  第二集死侍2


  延續了第一集的風格和劇情

  死侍原本與女友凡妮莎幸福地生活在一起，但凡妮莎被未知的敵人襲擊意外死亡後

  死侍成為了一名受訓中的X戰警

  並且必須保護變種人火拳羅素免受一名來自未來的機堡追殺

  機堡希望殺死羅素以阻止他未來變成無情殺人魔

  （影片三：凡妮莎死亡）



  為了保護羅素，死侍組成了一支X-Force的小隊

  小隊包括了各種奇怪獨特能力的成員

  (其中包含布萊德彼特客串的透明人角色)剛出任務直接被電死

  那段小彩蛋超莫名的戳中笑點

  （影片四：X Force 死亡場景）



  最後死侍也感動了羅素，讓他變成了好人

  機堡更犧牲了自己跳躍時空的機會救了死侍

  片尾停在彈頭&他的女友雪緒修好機堡的時光機後

  死侍就開始「矯正」各種過去的事情

  像是二話不說拯救了凡妮莎、槍斃掉在看綠光戰警腳本的自己


  本集重點：死侍獲得了穿越時空的機器、凡妮莎掛了又復活、死侍的戰友多了X-Force跟

  機堡

  （影片五：死侍2片尾彩蛋）



  死侍與金鋼狼延續死侍2結尾穿越時空的概念

  將死侍和金鋼狼兩個角色夢幻連動了起來

  這集應該會看到他們大鬧時間線

  漫威經典角色有可能會出現（像是雷神、夜魔俠、萬磁王等等）

  固定班底除了前面提到的凡妮莎、鋼人、彈頭、雪緒也都還在

  一二集都有出現的死侍前室友+吸嗨好夥伴盲婦愛兒跟他專屬的烙跑司機印度人阿杜也都

  在

  希望他們也有一定戲份不要只是前半段跑個龍套，畢竟都陪伴了兩集啦～

  （影片六：死侍與金鋼狼預告）



  --'
