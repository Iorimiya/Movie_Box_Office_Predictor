url: https://www.ptt.cc/bbs/movie/M.1722012195.A.723.html
title: '[普雷] 死侍與金鋼狼'
content: '誠意十足


  但太審美疲勞


  劇情普普


  粉絲向劇情


  普通偏低


  雖然號稱漫威耶穌 但有點吹得太過了








  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  第一幕最精采


  為了合理化金鋼狼的出現


  第一場戰鬥就用以前釋出的搞笑片段


  找羅根的墳墓繼續演


  非常好笑跟聰明的應用


  打鬥戲這邊最好看



  後面接文戲普通的介紹死侍的中年危機


  找金鋼狼時有驚喜 也是蠻好笑的


  但後面被傳送到時空邊境的時候開始出現問題


  兩個不死人 打架到底有什麼好看的?


  反正吃子彈 吃刀 都沒事


  就算頭剁掉還不是照樣復活


  後面打了三場就覺得真的太無聊太硬要了


  很像要理念衝突


  但又覺得普普而已


  然後嘴砲太多 嘴到不知道在講什麼


  還是要嘴 一直嘴 一直嘴


  嘴到後面真的有點太刻意了


  邊境裡面一堆漫威舊腳色登場


  意想不到請回來四位大咖


  真的太意外


  不過龍套終究是龍套 就負責打鬥戲而已


  強尼最好笑 完全婊爛所有觀眾


  但安排最合理


  也只有他可以這樣玩劇情


  不過如果沒有這麼多腳色在邊境


  其實可以省掉一場打鬥戲


  在壞人基地的打鬥戲


  畢竟無關痛癢 就是在秀


  但主戲又不太影響


  只是為了拿頭盔 去康特光頭魔王而已


  結果光頭魔王太強了


  強到不用劇情殺 根本解決不了


  死侍跟金鋼狼根本沒辦法解決女光頭


  結果後半段就讓女光頭 在那邊手握電線


  無台詞一直到影片結束 笑死 有夠爛


  你創造一個超強的魔王


  然後用這種方式解決 不覺得很差勁嗎??


  不過也沒辦法 強如查爾斯


  甚至還可以穿越空間 瞬移 四肢健全


  到底怎麼打 也是個問題


  整部片劇情偏水


  為了服務粉絲請回大批老班底回來演出


  雖然給了驚喜 但也發現 其實很沒必要


  很像是在一部料理裡瘋狂加醬料


  加到最後都不知道原本是在吃雞肉 豬肉還是牛肉


  都是醬料味


  而漫威也毫不掩飾的 把他未來想啟用的演員


  留在了10006地球 以備不時之需


  完全不用解釋跟交代


  真的是有夠懶


  缺點


  沒必要的嘴砲太多 髒話太多


  打鬥淪為 為打而打


  劇情本質上反派其實很鳥


  就是TVA科技輾壓而已


  接著就無解女魔頭 跑去玩電線


  為了接續漫威後面所有新腳色的鋪陳


  而誕生的產品


  如果你看了好幾部漫威


  又對未來充滿期待


  這部可以滿足你


  如果你期待劇情


  想看金鋼狼跟死侍的頂上對決 甚至劇情


  期待不要太高


  我都看到審美疲勞的


  動作戲又不算太頂


  當腳色不會死亡的時候


  打鬥又有什麼意義


  這部片展示的非常赤裸


  普通的作品


  更多是為了服務漫威粉絲而拍的


  知道得越少 這部片帶來的效果越差


  就像人生第一部漫畫就看旋風管家


  而你又ACG半點不沾時


  劇情裡出現的所有梗都接不到


  會完全不能理解這部作品僅存的精彩之處



  --

  我也是吃了才知道 漫威耶穌才這種程度

  讓我幫他們挑挑刺

  我也沒看影集 所以漫威的操作

  如果是不需要我們這些只看電影的人

  那我也只能小無奈而已

  x戰警除了第一集都有看 我福斯的大概都懂

  真的 悖論前面要解釋原因 中間要解釋陰謀

  後面解釋怎麼崩壞機器 真的很忙

  但我看第一集還沒那麼躁 第三集真的是文戲不演了 顧著嘴而已

  真的 打半天浪費時間

  不過女魔頭沒招解 也只能這樣撐場面'
date: 2024-07-27
