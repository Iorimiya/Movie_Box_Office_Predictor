content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  感謝凱米更感謝家裡旁邊走路就能到的影城有營業


  再次辛苦工作人員了


  嚴格來說劇情走向就很漫威


  劇情不難懂 該給的笑料給(因為是死侍所以給超滿，甚至有些我覺得多了)


  但真要說漫威耶穌是不至於 劇情上感覺也沒有埋下什麼會讓之後作品大變革的梗


  但看到回歸正常表現的漫威作品或許就是件好事



  喜歡的地方


  1.打鬥表現不俗，開場的骨頭戰 跟 死vs狼 都很喜歡 看到出來相較前兩集

  預算是真的多不少，可惜的是最後跟反派沒有更多的動作場面，畢竟兩個都肉搏型的

  雖然狼叔也是幹掉過黑鳳凰?


  2.彩蛋人物真的出乎意料，進場前一定早就預設會有很多腳色，實際上 說多是也沒很多

  但對於我一個35歲中年男子，比起很多現今漫威大咖，刀鋒戰士真的太打到我了

  幻影殺手跟查寧未拍出的金牌手，在電影之前應該是覺得沒人會猜到吧

  前面一直嘴福斯 但這些人物的出場 也是給福斯這些年的超英一個RESPECT


  *美隊霹靂火那段真的也是騙到我 畢竟美隊形象太鮮明 都差點忘了這件事

  *找HAPPY那邊一直期望會有東尼 沒出現人也來個聲音

  *本以為TVA會有更多腳色


  3. 狼叔鐵粉，狼叔的演技還是在線，感情戲的表現很好，再度看到他伸爪就是讚

  身材一樣屌炸天(不知道是不是後製)，戴上面罩一百分啦乾



  不喜歡的地方


  1. 我覺得反派的背景故事可以再多一點啦，因為事前有看過YT的預告分析

  大概知道 喔 反派是X教授妹妹叭啦叭拉 但畢竟這是本作也沒出現的設定

  一夥反派都是舊X角色，我老婆就問所以她也是舊作X戰警的角色嗎?


  2. 沒那麼喜歡死侍團 有點為漫畫梗出而出，為何有那麼多死侍掉入虛空沒說

  劇情必要性也沒很高 本來期待女死侍彩蛋 結果也沒露臉(的確是他老婆演的)

  喔  但浪人武士短手是蠻好笑的



  整體來說還是賣懷舊彩蛋的漫威電影

  但因為狼叔給好雷!!!!!!!!!





  --'
