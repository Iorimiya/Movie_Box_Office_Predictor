title: '[討論] 死侍與金鋼狼 預告片整理'
content: '死侍與金鋼狼超前導預告


  預告開頭就看到些熟面孔

  像是雪緒+彈頭情侶檔、鋼人、印度司機阿杜、X特攻隊彼得、盲婦室友愛兒還有女友凡妮

  莎等

  結果慶生到一半的韋德被TVA獵人敲門還不忘嘲諷一下迪士尼

  這時只有看到狼叔的剪影



  這支預告狼叔正式登場，片頭酒吧根本是他綁定的出場畫面

  中間雙主出場配上Madonna-Like A Prayer

  還有片尾的Do You Want to Build a Snowman？配樂很好笑



  預告出現不少細節，像是洛基虛空的怪物玉衡Alioth、Dogpool、巨大蟻人頭盔

  以及這次的大反派「X教授」查爾斯的雙胞胎妹Cassandra Nova



  X戰警的劍齒虎狄亞哥？出現了



  最新預告，有一堆變體死侍跑出來


  還有國外最近釋出的廣告

  各種超鬧聯名，把死侍風格拉滿

  Deadpool&Wolverine&The Bachelorette


  Deadpool&Wolverine&Chicken Strips



  --'
