url: https://www.ptt.cc/bbs/movie/M.1736598292.A.EEA.html
title: '[ 無雷] 死侍與金鋼狼看不慬'
content: '我以前沒看過金鋼狼或X-man

  死侍有看過

  所以大概知道死侍那個嘴砲個性

  個人覺得之前死侍不錯看


  本來對死侍與金鋼狼沒興趣

  但是查了去年票房好像很賣座

  就在Disney +看了


  真的是看不懂

  反正就知道Fox讓Logan死了，Disney讓他復活

  然後那些其他人是誰在幹嘛我不知道

  而且真的很容易出戲

  二個小時就這樣過了

  超空虛

  這樣這部片真的有那麼好看嗎？

  還是說要Xman 粉看才好看


  --'
