url: https://www.ptt.cc/bbs/movie/M.1722183867.A.0BE.html
title: '[負無雷] 死侍與金鋼狼 真的很難看'
content: '今天看了死侍與金鋼狼

  沒想到比預期的還難看

  本來覺得有60分就OK了


  這部我來評分的話 爛番茄大概40%的電影等級而已


  前半段只覺得這在演三小

  後面一大半只希望這電影趕快結束


  什麼漫威耶穌

  我去看兩個小時聖經可能都比這部電影精彩

  我發誓我不是漫威黑粉

  但認真覺得PTT隨便派一個人去寫死侍3的劇本都能寫得比較好


  這劇本到底在演三小 絕對不是那種好笑有趣的荒謬

  而且爛到很荒謬那種 一點也不有趣


  只覺得這些人到底在幹嘛

  從頭到尾對劇情發展都沒有期待


  反派也不知道在幹嘛 最終戰也意義不明

  反派也是有漫威一般的通病 就是會前面發出一招超強的

  但後面就弱到像小兵一樣

  女死侍 多重死侍的出現  也只是為了出現而出現而已

  (這個預告有 應該不算暴雷吧)


  還有很多彩蛋也是


  這部電影  我只推薦給 看到漫威彩蛋 或是漫威其他人物出現在這裡

  就會爽到射精的人去看

  (抱歉很低俗 但死侍的梗也差不多這麼低俗)


  老實說大家對這些彩蛋不會覺得很麻痺嗎??


  頂多就  喔喔  漫威又花錢把這些人請來客串了


  可是這些人的客串  可以感覺他們很硬要想相關性

  但其實又很薄弱


  死侍2真的好看多了 至少有個主架構


  死侍3連主架構都有問題

  還三不五時看金鋼狼死侍互尻 啊兩個死不了的打架會好看嗎


  說到打戲  真的很無聊  爆血噴血就是只是為了證明這是一部大人級的電影

  也不覺得有甚麼特別精彩的打鬥


  硬要說整部片最好看的地方

  應該音樂有出現艾薇兒的i''m with you 還有姑姑娃的iris

  好好聽


  其他沒了


  可憐的休傑克曼版本金鋼狼  用羅根當結尾多好 硬要多拍一部死侍與金鋼狼

  超級難看


  只能說這導演大概在好萊烏人緣真的很好  不會導戲卻能拍這麼多電影

  而且都能找到大咖來演或客串

  不然就是他有大部分明星的裸照


  以上  真的覺得這部蠻爛的


  --'
