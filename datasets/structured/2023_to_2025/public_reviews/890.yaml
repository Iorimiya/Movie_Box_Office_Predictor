title: '[彩蛋雷] 死侍與金鋼狼'
content: '漫威End Game之後 就這部跟奇異博士2


  我從電影院出來沒覺得到底看了三小


  這部融入許多X戰警元素


  我是X戰警粉所以主觀觀影感受非常好



  尤其是第一個彩蛋回顧了X戰警系列電影花絮


  1-3集、未來昔日，我重看超多遍


  當這個彩蛋出來的時候我感動到爆


  愛死荷莉貝瑞跟芳姬詹森版的暴風女跟火鳳凰


  正劇裡也有以前出現過的角色，包括X1的蛤蟆男


  -



  劇情雷






  我沒有看預告就衝今天第一場


  當克里斯伊凡降落的時候，我以為真的是隊長來客串


  而且完全沒老的感覺，真他媽有夠帥


  還有我以為的博士，結果是博士他雙胞胎妹妹


  長相跟第一戰的詹姆斯麥艾維還真有點神似


  也是本劇的大反派，手指控制悖論那段鏡頭怪噁心的




  主線部分：


  死侍穿梭各個時間宇宙找金剛狼要拯救自己的宇宙


  找到的這個是深陷在X戰警團滅懊悔中的金剛狼


  雖然明面上找金剛狼拯救死侍的宇宙


  但死侍同時也拯救了金剛狼


  幫助金剛狼找回身為X戰警的價值，算是雙向救贖







  雖然很喜歡這部，還是說一下反感的地方


  塞了太多到處「臭」的台詞，幹話多到讓人有點煩


  甚至有點尬…



  還有克里斯伊凡在第二個彩蛋噴的垃圾話…


  我整個有點幻滅


  大概是這樣

















  --

  you got me.

  懂各位的意思，但幹話很多又沒幹在點上的話，就會覺得很煩…

  他上節目有些片段還蠻好笑的，很有綜藝效果

  不然克里斯伊凡太貴了 便當秒發'
