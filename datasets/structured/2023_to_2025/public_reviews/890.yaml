url: https://www.ptt.cc/bbs/movie/M.1737512548.A.8A9.html
title: '[新聞] 傳聞漫威有意打造《死侍與金鋼狼》三部曲'
content: '新聞網址：



  ByJONES 1 月 21, 2025



  根據最新的推測，漫威影業似乎正計劃製作一部由休·傑克曼飾演金鋼狼的《死侍與金鋼

  狼》三部曲。



  2024年的《死侍3》不僅是這位「嘴砲傭兵」進入MCU的敲門磚，更為迪士尼賺進了大筆鈔

  票，並有望成為史上最賣座的R級電影。因此，一直有關於這兩人回歸的討論，但始終沒

  有任何實質性的進展。然而，根據最近的傳聞，萊恩·雷諾斯和休·傑克曼看來終究將在

  MCU的未來扮演重要的角色。








  在他們於X上的最新更新中，MyTimeToShineHello指出：「休·傑克曼飾演金鋼狼的旅程

  還遠未結束，」



  《死侍與金鋼狼》於2024年7月在戲院上映，並因其詼諧的敘事方式和恰到好處的經典角

  色客串而迅速獲得觀眾的廣泛讚譽和喜愛。因此，根據Box Office Mojo的數據，該片在

  結束院線上映後，已在全球票房累積了令人垂涎的13億美元。



  截至撰稿時，漫威影業尚未透露死侍和金鋼狼下一次在大銀幕上的亮相。儘管如此，目前

  的態勢似乎暗示這兩位變種人將在2026年備受期待的《復仇者聯盟：世界末日》中扮演一

  定的角色。再次強調，目前所有關於傑克曼和雷諾斯在該系列中未來的消息都僅僅是猜測

  。



  同時，《復仇者聯盟：世界末日》目前正按計畫於2026年5月1日在戲院上映。



  --'
