url: https://www.ptt.cc/bbs/movie/M.1714821461.A.037.html
title: '[新聞] 《死侍與金鋼狼》登上帝國雜誌封面！'
content: '《死侍與金鋼狼》登上《帝國》雜誌封面！全新劇照亮相、休傑克曼坦承曾經差點穿上藍

  黃戰服


  由薛恩 李維（Shawn Levy）領軍執導，並即將在2024年7月登上大銀幕的漫威電影宇宙第

  34部電影作品，同時也是2018年電影《死侍2，》（Deadpool 2）續集的《死侍與金鋼狼

  》（Deadpool & Wolverine），隨著上回漫威影業釋出全新預告影片後，今次《帝國》（

  Empire）雜誌也首度釋出獨家封面與獨家劇照，更清楚目睹萊恩 雷諾斯（Ryan Reynolds

  ）、休 傑克曼（Hugh Jackman）在劇中的風采。




  ▼雜誌訂閱者特別版封面




  在接受《帝國》雜誌專訪中，休 傑克曼也特別分享了在過去還是福斯漫威時代，拍攝《

  金鋼狼：武士之戰》（The Wolverine）時，差點就要穿上在原作漫畫中那套最經典的藍

  黃戰服，只不過結果也如觀眾所知，這套戰服並沒有隨著休 傑克曼一同登場大銀幕。


  「我們當時差一點就在《金鋼狼：武士之戰》電影裡，穿上那一套黃藍戰服了，雖然直到

  現在，當我穿起那身衣服時，我也覺得很對味，我就想『我們以前怎麼就沒有這樣做過？

  』，畢竟那就是這麼的適合，讓我覺得『對！這就是金鋼狼！』」


  休 傑克曼說，「因此在這一次角色的呈現，也讓我看到金鋼狼在過去電影裡從未看過的

  一面，這讓我覺得非常興奮。而且對死侍而言，有個人揍他一拳，那也是好事。」





  就如同休歲カJ曼所說，因後來黃藍戰服沒有機會出現於《金鋼狼：武士之戰》當中，成

  為了他與戲迷粉絲心中的一個小遺憾。


  但如今這身經典戰袍在即將上映的《死侍與金鋼狼》中亮相，也迅速成為近日於全球社群

  網站上的熱門話題。


  《死侍與金鋼狼》北美地區預定2024年7月26日正式上映，台灣則預計在2024年7月24日搶

  先登上大銀幕！


  新聞來源： Empire



  新聞網址：





  --'
