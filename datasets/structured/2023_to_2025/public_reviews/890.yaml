url: https://www.ptt.cc/bbs/movie/M.1722140384.A.C4A.html
title: 'Re: [討論] 死侍與金鋼狼的幾個問題？（有雷）'
content: '反派沒有把傳送門關掉，

  另外反派有說，

  找了些「朋友」來阻擋死侍跟金鋼狼。




  死侍的世界只有9個人，

  他要拯救世界的原因就是這9個好朋友，

  其中一個就是彼得。


  所以當死侍問死侍團你們都認識彼得？

  死侍團回答：

  「開什麼玩笑，

  每個宇宙的死侍都有一個彼得。」

  代表所有死侍都有這個好朋友，

  而這個好朋友要他們停手。



  A. 從TVA時間管理局搶了設備後穿越多重宇宙找的

  B. 結局死侍有跟TVA黑人女主管說：

  「他有些朋友被人遺忘，

  希望可以接他們過來。」


  死侍2的片尾中，

  他拿著穿越機器亂跑。


  只說他很特別


  死侍結束的時候有說：

  「一個死侍會死，

  一個死侍+金鋼狼就不會死。」


  因為兩個人都是超強再生，

  你想成一發傷害可以打死一隻史萊姆，

  但同時打在兩隻史萊姆身上被分散後，

  兩隻都打不死，

  而這兩個人只要不死就會重生。


  原本就會死，

  悖論有說短路會把接觸的人都炸成原子。



  A. 有演出被很好的打飛跟打爛

  B. 他以為只要有金鋼狼就好

  C. 金鋼狼自己醉倒被他抓來


  劇本邏輯有些問題，

  但你問的內容除了第4點跟第5點外，

  電影中都有演出跟直接講出來，

  大概是這樣。


  -----

  Sent from JPTT on my Google Pixel 7 Pro.


  --'
