title: '[討論] 死侍與金鋼狼 角色動作設計討論(雷)'
content: '這次的金鋼狼，除了黃色戰袍+頭盔復刻漫畫造型


  也發現金鋼狼有幾個動作設計，不同於以往，充滿漫畫復刻感


  但都沒看到有人討論，不知道是不是錯覺


  1.金鋼狼經典蓄力蹲


  伸出狼爪後，經典的爆發前微蹲


  這動作在以前的金鋼狼電影就常看到，但這次總感覺刻意加強蹲下的動作


  2.金鋼狼跟死侍虛空對決


  金鋼狼衝向死侍的時候，是用手腳並用的前撲方式突進


  印象在X戰警：金鋼狼中，演金鋼狼的哥哥也有用過這招突進


  3.金鋼狼公車破窗跳躍


  最後對決的場景，死侍跟金鋼狼從公車破窗而出的時候


  金鋼狼擺出經典跳躍的動作(雙腳彎曲+雙手後彎)


  這真的跟小時候看金鋼狼卡通會出現的動作一模一樣


  當下都起雞皮疙瘩了，可惜找不到示意圖


  不知道有沒有人也有發現其他細節呢?


  --'
