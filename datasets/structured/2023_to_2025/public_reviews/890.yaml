title: '[  雷] 死侍與金鋼狼-紅色小丑外皮下的致敬之作'
content: "--有請1989年的瑪丹娜大大防雷--\n\n\n觀影前建議：\n\n：\n  X戰警/復仇者電影系列，全無漏接的硬核腦粉。\n\n：\n  1990-2010年代的前述電影，有關看5-10部以上\n\
  \  (先看一些X戰警系列/驚奇4超人系列可獲得較高的加權匹配性)\n\n：\n  前述電影僅觀看1-2部，且有強烈排斥反應者。\n\n\n\n\n\n\n----\n\
  \n拉高期待的因子：\n  \n\n\n  相當粉絲取向的行銷策略 (賣腐的、惡搞迪士尼的)\n\n降低期待的因子：\n  疫情與罷工帶來製片的變數\n  過長的等待期\n\
  \  前兩部DP累積的審美疲勞\n\n\n - /10\n恩...怎麼說呢？平行時空的概念拉入死侍的劇情之後，\n讓本來偏零碎的劇情變得。\n劇情中後段的展開大致上猜得到\
  \ (請參閱：《環太平洋》) 。\n還有，簡直就是本作的金手指。\n\n (/10 勉強及格 )\n我覺得好的部分：\n開局的\n出現在虛空的 (QQ)\n惡搞Mad\
  \ Max的場景\n (大心+1，沒想到主角是狗派的XD)\n\n不那麼喜歡：\n (Sorry，萊恩，還是喜歡你末期癌症的臉XD)\n (在地化的翻譯應該也想破頭了吧，可是本人都不知道跑哪去了...)\n\
  --\n本來DP與主角群的互動也因為「」這個事件，變得很難發揮喜劇效果。\n剛開始的房車梗，可能我沒有買車子，很難get到。\n\n與金鋼狼的互動也受到劇情限制。\n\
  羅根還是在X-Men裡面偏嚴肅的角色 (與DP相比)。\n加上在DP面前的是「」，\n沒辦法一開始就讓他進入DP的節奏，一起耍嘴皮子。\n這樣與我想要「找樂子」的期待就有點偏差了。\n\
  --\n - /10  拜託這是迪士尼的$$$$$$，怎麼會不及格。\nOP結束後用兩套爪子對兩個士兵「」很低俗，但我很喜歡。\n我覺得應該多來一點，最好加個5-10段。\n\
  但迪士尼的加入可能有好有壞，不只是那種梗不能用，\n，應該再賤一點會更好。\n--\n - /10 老歌使用普遍好評，但有一兩首音量過高。\nOnly You：意外的很適合開頭呢。\n\
  Bye Bye Bye：NTMD真的把上一部拿來用喔XDDDD\nI'm with you：這...這算是加拿大人的自肥嗎？\nHell Bell：果然呢 (各種意味)\n\
  The Greatest Show：我想還是讓看過「大娛樂家」的板友分享好了XD\nBring Em Out：，對戲院觀眾耳朵不好orz\nLike A Prayer：。大推。\n\
  --\n\n - /10 賣好賣滿，賣得風華絕代。\n\n最開始注意到的是，\n原本以為會有表現，結果只是來講幾句「」就收工了。\n\n但奇怪的是，見到，等人，\n\
  對於90年代開始看這些漫畫改編作品的觀眾 (像我) 而言，\n突然有一種「」的熟悉感。\n(當然，後續的達芙妮金，就是大學同學的等級了)\n\n當然我比較眼拙，還。\n\
  但是要能做到如此瘋狂的漫威角色大集合，\n恐怕還得依賴萊恩以及團隊用上好人緣，\n在戲外用「三寸不爛之舌」爭取到這些卡司。\n\n進到工作人員名單之後，看到拍攝期間\n\
  \n此時我才真的明白，是我抱持了錯誤的期待去看這部電影。\n--\n所謂的超級英雄，充其量就是漫畫家腦中想法的產物。\n而，成為這些角色持續「生存」，或者世界線「存續」的主要動力。\n\
  將漫畫改編成電影，當然是為了面向更多不同口味的觀眾。\n，讓演員也成為角色－觀眾之間的。\n而不同媒介的互相拉抬，使作品與演員都有了更高的知名度。\n\n然而，天下無不散的筵席，，必須找替代人選。\n\
  更有甚者，多數作品很難逃脫，甚至被的風險。\n那這些角色是否像掉進了一般，只能面對被遺忘的孤獨與挫折呢？\n\n會不會在DP & WV參演或客串的演員們，\n\
  也想試著「拉這些快要被遺忘的角色一把」呢？\n\n因為可以打破第四面牆，DP是最適合戲謔其他角色的。\n但也因為如此，萊恩雷諾斯的碎嘴與好人緣，使他成為\n\n\
  (搞不好是「所有世界線最好的DP」也說不定XD)\n\n\n我沒辦法正確地給這部電影「好」或「不好」的評價。\n\n曾經有不看漫改英雄作品的朋友，問我《黑暗騎士》為何好看。\n\
  我發現很難給出正確的描述，友人也很難理解。\n但他提到一個關鍵的重點：「」\n\n《死侍與金鋼狼》呈現了前述的情懷問題，\n不過把所謂的「情懷」放大了好幾十倍。\n\
  \n雖然劇情比前兩作更加鬆散，作為喜劇片笑果也有限。\n\n但若想要享受一下這樣的情懷，進戲院也無妨。\n絕對找得到讓觀眾會心一笑的彩蛋喔。\n\n\n--Bye\
  \ Bye Bye置底防雷--\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n--"
