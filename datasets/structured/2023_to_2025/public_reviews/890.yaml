url: https://www.ptt.cc/bbs/movie/M.1722055389.A.9AE.html
title: '[好無雷] 死侍與金鋼狼'
content: '剛看完，沒想到海報已經被換完了


  先說結論，是一部很寵粉絲的死侍電影


  各種彩蛋服務粉絲是本作的核心亮點，也因為如此，我很難以非粉絲的角度去評論本作


  排除多重宇宙玩梗內容，本作仍然有其可玩味之處


  除了死侍系列本身的嘲諷性質，加入了金鋼狼作為本作的主角，也讓這一集的調性能夠適度

  地被中和


  至少金鋼狼線的故事是有感動到我的


  打鬥和血腥的創意雖然沒有特別驚人之處，但仍然保有系列水準，反派製造的各種獵奇體驗

  是真的滿酷的


  但從故事來看可能就經不太起推敲，至少故事本身應該是很難讓人感到有趣


  推薦有在關注漫威電影宇宙和周邊相關新聞的人去觀看，我是不會推薦沒有在看漫威電影的

  我的朋友去看這部



  --'
