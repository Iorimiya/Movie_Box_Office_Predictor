title: '[討論] 死侍與金鋼狼的一句台詞'
content: '雷







  前幾天去看死侍3



  最後大戰時，衛斯理史奈普舉起制裁者留下來的RPG，



  有一句台詞提到「制裁者有五個，但刀鋒戰士只有一個」




  但我記得目前演過真人版制裁者的演員只有四位吧？


  分別是杜夫朗格、湯瑪斯傑恩、雷史蒂文森和強柏恩瑟



  不確定是不是我自己聽錯看錯，



  還是除了上面四位以外還有其他人演過制裁者？






  另外分享一下


  之前這片剛上映時


  有國外網友發現亨利客串的金鋼狼登場時


  死侍大致說了一句「我們會比前一個公司更善待你」


  原文的Shit Fucks Down The Street


  用推特hashtag 搜尋


  會出現以下兩個帳號








  --'
