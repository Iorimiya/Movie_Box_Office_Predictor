url: https://www.ptt.cc/bbs/movie/M.1721889471.A.FB0.html
title: '[好雷] 死侍與金鋼狼 很爽的片'
content: '先說我不算忠實漫威粉，也不是每部漫威電影都看的人

  死侍1&2我都有看，喜歡他的嘴賤為了他而去看這部的

  就想看他嘴砲到所有人都想殺了他，但殺不死他又氣又無奈的樣子XD

  以下有雷










  本來看之前還有點擔心，加入金剛狼會不會有很多我不知道的梗

  但看完以後覺得如果不是一定要知道每一個梗的細節的話

  那大家直接去看就對了！！把他當作一般的爽片來看就好

  死侍還是很好笑，整場可以說毫無冷場

  果然還是熟悉的那個嘴砲最對味

  先嘴福斯後嘴迪士尼真不愧是漫威耶穌，把我們想說的都說了（？


  但比較重要的概念像是TVA、時間線等電影裡也會簡單說明

  不用怕看不懂，劇情本身算是一個滿溫馨單純的故事


  韋德想要拯救他的世界不被TVA毀滅，因為這個世界有他最重視的親人好友

  但他覺得靠他自己辦不到，他的世界活著的關鍵金鋼狼又已經死了

  所以他決定在各個宇宙穿梭找尋其他的金鋼狼來拯救他的世界

  後來在時間的虛空冒險了一下，再手牽手回歸拯救世界，整個感情變超好

  打敗反派跟穩定住時間線之後，死侍也帶金鋼狼認識他的朋友們，讓他不孤單


  其實很像賀歲片的感覺，沒有太多的說教跟意義，只有滿滿的爽片元素

  跟朋友一起去看嘻嘻哈哈完，心情會滿好的哈哈！


  --'
