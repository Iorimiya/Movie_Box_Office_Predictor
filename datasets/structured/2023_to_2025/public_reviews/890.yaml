url: https://www.ptt.cc/bbs/movie/M.1722106844.A.E02.html
title: '[討論] 死侍與金鋼狼的幾個問題？（有雷）'
content: '可能我忽略或沒有看得很認真，

  幾個小問題想請教...


  1. 死侍軍團是怎麼到主角們的宇宙？

  不是要靠奇異博士的道具嗎？

  他們怎麼就忽然殺過來了？


  又為什麼要打主角死侍和金剛狼？

  這邊有點一頭霧水...



  2.為什麼死侍朋友穿死侍裝登場，

  死侍軍團馬上就停手？然後大和解？

  這是什麼梗呢？？


  3.死侍幾時和X-men和羅根同宇宙的？

  結尾一起慶祝的X23又是如何穿越到主角死侍宇宙？


  4.死侍如何到616宇宙應徵復仇者聯盟的？


  5.一開始TVA高層想招募主角死侍的原因有說明嗎？


  6.為什麼大決戰死侍和金剛狼手牽手抓那兩根能源條可以不死？變成死的是X教授妹妹？


  7.那麼多個金剛狼，有的看起來也不錯，為什麼死侍偏偏選這個放棄自我的金剛狼？



  問題有點多，

  但這集的有些邏輯有點怪，

  雖然整體算不錯看...


  --

  他們也有奇異博士道具？

  還是女光頭讓他們去的？

  你可以先回完全部問題，證明你沒睡著XD

  金剛狼一已經有一個死侍了，

  但現在的主角死侍又似乎深知金剛狼三和X23的事情，這裡其實有衝突。

  另外X-men的鋼人和死侍電影的鋼人不一樣，

  現在變同宇宙其實有衝突。

  也對，反正以前就一堆問題了Q_Q'
