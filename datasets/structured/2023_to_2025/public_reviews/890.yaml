url: https://www.ptt.cc/bbs/movie/M.1722261322.A.3A7.html
title: '[負無雷] 死侍與金鋼狼'
content: '本來是很期待死侍續集的


  因為前兩集都有到電影院支持


  可是這次我想給負無雷了


  當然死侍一貫的跟觀眾對話還有碎嘴風格沒變


  但就算我是漫威電影全看（驚奇2都看過）


  以前的福斯X戰警也全看過


  但我沒想到這次死侍居然洛基影集比重這麼大


  因為我覺得D+的任何漫威影集都很無聊


  所以都沒看  都看前一集就棄追


  這也是後來漫威人氣下滑的一個關鍵


  畢竟電影應該是沒看過影集也沒差不影響觀賞體驗


  有看過影集的可以更接到梗會心一笑


  漫威電影應該要這樣拍來滿足這兩類人


  但這次死侍我覺得有被陰了……


  裡面所有有出現X戰警  驚奇四超人我都知道


  但我沒看洛基影集啊


  而這次劇情發展最重要的就影集提到的


  導致看到一半我就知道完了  無法融入


  後半部有點不耐煩  想趕快結束


  沒想到最期待的死侍續集是這樣 有點失望


  我一直覺得漫威這樣粗暴要觀眾硬看影集


  這做法不好  只會讓之後有更多人觀望


  畢竟你影集也沒很好看啊


  我D+影集好幾部都看完兩集就棄


  真的沒很吸引人


  這樣接下來漫威電影我就不想無腦進場支持了


  要寧願被爆雷 也要看文章有沒有要補影集的點   有的話 可能選擇不看了吧


  -----

  Sent from JPTT on my Samsung SM-N770F.


  --

  無所謂了  就難看罷了

  我看過啊  但我沒說好看啊  也是超難看'
