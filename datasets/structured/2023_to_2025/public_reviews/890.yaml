url: https://www.ptt.cc/bbs/movie/M.1721279912.A.83C.html
title: '[新聞] 堅挺又緊實的翹臀變商品！《死侍與金鋼狼'
content: '堅挺又緊實的翹臀變商品！《死侍與金鋼狼》宣傳再出奇招




  〔記者許世穎／綜合報導〕漫威電影宇宙今年大銀幕唯一鉅作《死侍與金鋼狼》上映倒數

  ，大膽又幽默的行銷活動已經來到了屁股...不是，是死侍的「屁股」。繼先前充滿性張力與暗示的「金鋼狼」爆米花桶，這次乾脆把

  緊實翹臀做成商品。


  微軟推出一款受電影啟發的控制器，這款獨一無二的控制器有著死侍紅黑皮革服裝的紋理

  ，背面還增加了支撐，重現了「死侍」韋德威爾森形狀美妙的屁股。但這個商品目前沒有

  開賣打算，最終只有一個人能夠擁有這款充滿特色的控制器，因為它是抽獎活動的獎品。




  這個屁屁手把將從那些在社群媒體上分享抽獎PO文（國外方面）的人中選出一位幸運贏家

  。其他獎品包括一台死侍主題的Xbox Series X遊戲機。根據外媒曝光的新聞稿中提到：

  「這款恰如其名的『俏皮控制器』以其堅挺結實（但出乎意料的舒適）的握感體現了死侍

  的鋼鐵臀部。」還強調是由這位嘴賤的反英雄本人設計，「它還穿上了這位反英雄立刻可

  辨認的——我們還要補充一句，非常討喜的——紅黑戰袍。」


  該片的行銷活動充分利用了這部電影作為漫威影業首部R級作品的獨特地位，無論預告片

  或廣告得意地擁抱了這部電影能夠對觀眾釋放幹話和模糊的「基情」幽默的自由，萊恩雷

  諾斯甚至之前就介紹了靈感來自《沙丘：第二部》「沙蟲爆米花桶」的金鋼狼爆米花桶，

  其形狀像極了張開嘴的...充氣娃娃，而且還用充滿暗示性的展示，非常符合他的風格。


  《死侍與金鋼狼》將於7月24日在台上映，除了預售票現正熱賣中、「史侍級」限量預售

  好禮大放送，死侍和金鋼狼也現身全台街頭，包括台北信義威秀影城「狼情侍意」大型看

  板示牌與真人大小的雙帥雕像、台北西門死侍打破第四道牆對路人喊話的看板、台北小巨

  蛋的巨幕動態看板，以及高雄三多站的超大掛報以及橫幅廣告等，都吸引大批民眾搶拍合

  照，掀起全台「狼侍雙帥」旋風。


  --'
