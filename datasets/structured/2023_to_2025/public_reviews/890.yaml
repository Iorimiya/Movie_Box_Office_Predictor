url: https://www.ptt.cc/bbs/movie/M.1717839743.A.117.html
title: '[新聞] 死侍與金鋼狼確認不會刪減F字髒話下流梗'
content: 'MCU《死侍與金鋼狼》確認不會刪減F字髒話、下流梗　「索爾」稱不知道自己原來有客串

  演出




  儘管我們能在即將上映的漫威電影《死侍與金鋼狼》（Deadpool & Wolverine）中，看到

  不少包含在預告影片中呈現的「死侍下流梗」，以及帶有F開頭的髒話，但由於電影始終

  是由迪士尼影業所發行，確實仍有些觀眾粉絲擔心電影正片是否最終還是會有一定程度上

  的刪減。


  而對於這個問題，美國電影協會（Motion Picture Association，以下簡稱：MPA）也正

  式給予了解答！


  根據日前他們所發布的公告，這部由迪士尼影業所發行的「漫威電影宇宙」的第34部電影

  《死侍與金鋼狼》，因電影內含「貫穿全片的暴力、血腥、性暗示等粗俗語言」，於是正

  式確定本片評級為R級，而這也成為漫威影業史上第一部被評定為R級的作品。




  另外，過去一度傳出「雷神索爾」克里斯 漢斯沃（Chris Hemsworth）可能將客串於《死

  侍與金鋼狼》演出的傳聞，日前本人接受《ComicBook.com》的採訪時，就對於這件消息

  表示十分驚訝：


  「真的假的？我在裡面演出嗎？太酷了吧！」


  克里斯滓~斯沃接著說，「有時候你會不小心忘記，自己也是這個演出團隊的一份子，於

  是當你意識到的時後，你就會覺得『喔，超酷！他們正在談論著我』，雖然我人其實並不

  在裡面演出，但我會覺得，能夠成為這整個宇宙的一部分真的很酷，因為他們彼此之間是

  相連著的。」


  新聞來源： Comicbook.com


  新聞網址：







  --


  你是說這部慘賠到脫褲的電影嗎？

  大姐好了啦

  可憐哪，笑死'
