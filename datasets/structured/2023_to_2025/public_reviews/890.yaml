title: 'Re: [討論] 死侍與金鋼狼問題(雷)'
content: '你記錯了，福斯請不起XMEN的是死侍第一集





  這是死侍第二集，又玩了一次跟第一集一樣的梗，

  但是這次因為黑鳳凰劇組同時借用了同一個場景在拍攝，

  所以他們真的是一整組人剛好在隔壁，

  所以就來死侍二劇組這邊露臉客串一下，當作驚喜。



  只有死侍三比較明確說到這是接在羅根電影宇宙之後，

  至於死侍第一二集就別太在意了，

  死侍都能跑去金剛狼劇組把無嘴死侍幹掉了，

  時間軸當做搞笑就好，別太認真。


