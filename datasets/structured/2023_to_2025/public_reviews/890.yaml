url: https://www.ptt.cc/bbs/movie/M.1722957585.A.0E7.html
title: '[好雷] 死侍與金鋼狼 4DX'
content: '上週去二刷了4DX 3D版本，還有搶到贈品真幸運

  其實會想再看，就是好奇這麼多打戲的電影在4DX 3D會怎麼呈現

  第一個期待的就是開頭又跳又打的戲

  椅子直接也在跳 Bye Bye Bye，死侍打人的時候也會跟著一起被打

  尤其是脊椎很常被「那根」凸起來的槌（聽起來很色

  就真的像被死侍用羅根的骸骨打一樣哈哈


  再來是在虛空的時候都一直有微風吹來，很有末日的fu

  死侍與金鋼狼上演「車震」的那場打戲

  也有安排了滿滿的特效，直接把人跟著車子上下晃，一起震起來（？

  這兩部分特別精彩，後面幾場打戲像是：打Cassandra Nova、死侍軍團大亂鬥

  也很常噴氣跟椅子搖晃，都加深打鬥的帶入感


  但沒想到重頭戲是最後兩個人在破壞「時間開膛手」的時候

  整個椅子真的像在搭雲霄飛車一樣很好玩

  機器完全炸開的時候椅子也直接飛起來，這是最印象深刻的一段（爆米花差點飛出去哈哈

  總體來說滿值得體驗的，有身歷其境的感覺～

  當然有些地方還是可惜，像我以為被Cassandra戳進腦子、Dogpool 狂親死侍的時候會有

  些效果

  但看來是我想太多啦ＸＤ

  -

  講完4DX 3D體驗後，想講一下二刷心得

  這次有更認真看了劇情，其實覺得這兩個角色都很悲情

  一個是在自己的宇宙不被需要、一個是曾被需要但搞砸了

  死侍就是運用金鋼狼的這點Educated Wish（一廂情願，這詞出現次數多到我直接忘不了

  ）

  來拯救自己的宇宙，金鋼狼發現後雖然很氣憤

  但還是願意幫助死侍，甚至還想為了他犧牲（雖然不懂他們沒掛的原理到底是什麼><）

  最後獵人B-15對金鋼狼說的，他的宇宙沒什麼好拯救的，他的過去造就了現在的他，其實

  也很感人

  另一句 Happy Hogan 在開頭說的：The problem might be that you''re reaching a lit

  tle too high. Aim for the middle and you''ll never miss.

  要人不要太好高騖遠，別把目標一次訂得太高也令人深思，很喜歡這段話

  以上分享二刷的發現！


  --'
