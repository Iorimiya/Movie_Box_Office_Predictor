title: '[ 好雷] 死侍與金鋼狼 配樂搭配'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~










  死侍與金鋼狼除了打架、搞笑、彩蛋之外

  配樂也很頂

  到現在我的腦袋《Bye Bye Bye》還揮之不去



  從第二集跟 C幨ine Dion 合作就在埋梗要找超級男孩了XD

  沒想到還是真的


  g

  邊狂揍 TVA 的雜兵一邊跳招牌動作真的很魔性

  二刷的時候覺得最爽的也是這 part



  接著《I''m With You》就是我的回憶殺了

  小時候聽艾薇兒最喜歡的就是這首

  車子衝出來的時候

  死侍跟金剛狼一起坐在車裡

  有種彼此支持的溫馨感（雖然當時還沒有



  車上打（車）鬥（震）那段

  羅根的頭撞到中控

  音響竟然播了電影《大娛樂家》主題曲《The Greatest Show》

  還只有前奏 是不是根本不想讓休傑克曼開口啊XD

  兩個人各種演員本身的梗丟出來

  觀眾也有笑出來

  因為這幾部作品真的都太經典了！



  最後 Marvel Jesus 跟金鋼狼慢動作從牆壁走出來

  準備大殺特殺的時候

  還搭配瑪丹娜的經典神曲《Like A Prayer》

  史詩感就襯托出來了

  後來查了資料發現

  萊恩雷諾斯是親自拜訪瑪丹娜取得授權

  因為瑪丹娜鵝子恰巧是死侍粉

  還給了建議給劇組參考 讓這橋段有更好加分

  完全是強強聯手



  第一次看的時候比較注重在打鬥、跟著劇情走的感覺

  但二刷後就注意到更多細節

  像是藏了很多金句、配樂也很會搭

  也靠自己注意到很多彩蛋的地方

  觀影體驗變得更有趣

  Marvel Jesus, you can call me MJ！！



  --'
