url: https://www.ptt.cc/bbs/movie/M.1721811050.A.9AC.html
title: '[普雷] 死侍與金鋼狼（大雷）'
content: '先防雷一下

  颱風天當然要看電影了

  誰知道北台電影院跟中部不同幾乎全關

  最後只好殺去西門町

  好遠@@



  ------------------

  我本身沒有看過死侍2

  漫威後半段也只有從各種管道旁敲側擊了解

  X戰警系列也只有看一點

  所以很多的致敬跟彩蛋偏向一知半解

  （像中間那四位我只知道X23)

  整體來說看完的感覺就是…

  導演不太知道自己想要講什麼

  劇情講一講，突然塞一個彩蛋

  然後又突然塞一場打鬥


  有些插入還好，有些卻非常的破壞節奏

  像死侍狗的兩次登場都是後者

  那個音樂跟慢動作只給我一種wtf

  現在要幹嘛的感覺

  導演也許是想要製造笑點

  但抱歉我沒辦法get到


  這也衍生導致劇情非常的鬆散

  很多段落都是新角色出場

  打打打，嘴砲一下，然後就結束了

  沒有任何跟主線劇情連貫的地方

  （最明顯的就是一堆死侍登場那段，結束方式也很無語）

  少數比較好的段落大概是x23等四個人登場那段

  情懷有賣到，劇情有推移

  我們也可以補上羅根之後

  x23的一些心路歷程

  跟主角金鋼狼的一些秘密（雖然感覺有點沒力啊）


  雖然缺點一堆

  不過自己還是蠻喜歡這部片

  剛開始那段跟tva的戰鬥真的很好笑又精彩

  （拿人家骨頭當武器也只有你死侍吧）

  死侍的瘋狂嘴砲則是一如既往的高水準

  狼叔只要登場不用特別幹啥就是帥字滿滿

  中間那段狼叔面對自己過去

  雖然原因沒啥支持性

  但演員的演技真的完美cover 掉缺點

  兩人從彼此懷著誤解到最後成為好朋友（基友）

  也讓我看得很開心


  最大看點的彩蛋跟笑點我雖然只懂40-50%

  不過懂的地方真的都蠻好笑的

  （除了那個死侍狗）

  尺度也一點都沒有客氣

  老二笑話一大大大堆

  對某些人可能是缺點，但對我不是。


  總體來說，我能給到65-70分吧

  這部很像是在吃便當

  主菜肉品是自己很愛的

  但三個小菜全都是三色豆…

  只能惋惜大廚沒有都煮到我喜歡的

  讓這次宣傳打超大期待值很高的作品差強人意


  ----

  Sent from  on my Xiaomi 2306EPN60G


  --'
