title: 'Re: [討論] 關於死侍與金鋼狼（復3雷）'
content: '看設定


  薩諾斯的彈指

  在漫畫中是直接抹消人物

  不是「殺死」而已

  電影則沒明確交代原理

  只是抹消對他人來說跟殺害差不多


  假設電影在這採取的原理

  與漫畫都一樣是抹消的話

  那死侍或是金鋼狼都沒救

  (粉塵可能只是表現手法)


  但如果跟漫畫不同

  是確切的粉塵化殺害

  那金鋼狼會死

  死侍的話

  電影版死侍會死

  漫畫版不會


  原因是漫畫版死侍除了有金鋼狼的再生因子外

  還有薩諾斯的不死詛咒

  是魔法效用下的不死

  無關任何物理毀滅

  從一個分子也能長回來

  或是乾脆變回來也可以


  -----

  Sent from JPTT on my Samsung SM-N950F.


  --'
