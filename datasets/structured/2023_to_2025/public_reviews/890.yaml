url: https://www.ptt.cc/bbs/movie/M.1721793287.A.74D.html
title: '[好雷] 死侍與金鋼狼（有劇情）'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~









  先上人權圖證明一下有去電影院看


  去西門町的樂聲巨幕廳看的


  剛看完 覺得滿好看的 最後有點感人


  （旁邊的大叔還看到哭


  第一場人蠻多的 目測起碼有七八分滿


  出來人太多尿尿男廁還要排隊


  女死侍是布蕾克萊弗莉演的 但是沒露臉


  狼叔出場真的超頹廢的 最後帥炸了


  有美國隊長出場客串 不過這部裡面他不演隊長


  演得是霹靂火 出來打醬油的 出場時間蠻短的


  不過蠻好笑的 第二段彩蛋是關於他


  反派是一個女光頭 感覺不是很強


  前面角色出場太多感覺有點拖戲導致有點沈悶


  後面感覺好一點 總體來說還是給推


  有出場幻影殺手 金牌手 刀鋒戰士 x23


  不過都是串場而已 時間都很短


  總之 還是可以看一下 覺得還不錯


  剛看完寫的有點雜亂～大概是這樣


  以上



  補充：


  是說 這次尺度真的蠻大的（以迪士尼來說）


  很多爆頭的鏡頭 或是一堆十八禁笑話之類的


  還有福斯也拿太多次出來開玩笑了吧 笑死


  裡面真的嘴砲滿滿 好險回歸迪士尼漫威後


  沒有感覺很走鐘 真是覺得好險...


  --

  感謝補充

  真的沒有加菲 害我期待一下

  是比較老的那個 劇中還說刀鋒戰士只有一個

  出來拖台錢吧（誤

  就還好 很多就提前曝光了

  那是啥

  真的沒有加菲 哭哭

  這次客串真的覺得有點太多的感覺...

  有些角色多到還不知道出處從哪裡冒出來的

  這次看到狼叔跟死侍合體就覺得很感動了～

  還可以看看，最後有感動一下

  說是什麼漫威耶穌是感覺有點多了～

  有賣情懷的感覺（第一個彩蛋）

  不過還是有覺得感人（腦波很弱

  美隊真的是意想不到

  想說今天第一場應該還好，結果一堆人

  真的，福斯才是主角吧！跟背後靈一樣

  差很多好嗎，不要趁機偷渡X片

  真的可憐～

  好啦造型是有點像

  對，有亨利！可是時間很短，差點忘了


  這部還有虧美國隊長出場害他們成本增加 笑死'
