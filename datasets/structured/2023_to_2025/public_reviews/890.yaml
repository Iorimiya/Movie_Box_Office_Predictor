url: https://www.ptt.cc/bbs/movie/M.1722284896.A.FCF.html
title: '[  雷] 死侍與金鋼狼'
content: '防雷







































































  說真的,我沒有不去電影院支持的理由

  前兩集我都很喜歡,又有我最愛的變種人金鋼狼

  加上很久沒在電影院看漫威電影,下次不知道什麼時候

  重點是我從這部電影的種種組成就知道定位

  還有穩定的評價,但要注意評價只是”穩定”而非”很好”

  對我來說是很不錯啦,尤其是九成的梗我都get到

  就像是被認證漫威和福斯達人一樣,好好笑

  注意！我剛講到了雙面刃：巨量的梗

  基本上這兩小時大部分是這些梗、笑點、客串組成

  粉絲基本上會買帳,路人也有一定機會喜歡

  （前提是他們不會被這些看不懂的梗淹沒

  但抽掉這些東西,還剩下什麼呢？


  我在看的時候馬上想到國片「當男人戀愛時」

  兩部幾乎是八竿子打不著,手法卻是如出一徹

  就是不斷用容易吸引人的手法牽制觀眾注意力

  運氣好就會產生東西好看的感覺,反之就是看破手腳

  相信很多人會認同當男人戀愛時的手法很熟悉

  當然死侍與金鋼狼的等級還是高出了不少

  他可說是福斯X戰警以來的種種累積

  那種意義是不同的（請下片尾花絮

  所以他劇情空洞,做了什麼也不一定會記得

  他存在的價值就擺在那裡,尤其是現在漫威狀況不佳

  我想多少能挽救一點聲譽吧,我是沒差啦


  還是單獨講一下最讓我驚喜的客串就是亨利

  幹,光是背影就好帥,他怎麼樣都帥

  可惜請不到班艾佛列克回鍋夜魔俠

  還有原本以為真的有泰勒絲,看來是我想太多了哈哈

  蘿拉又讓我重回2017年看羅根的感動

  其他人也讓我重溫從小到大看過的超英

  有一些可能是Disney+才補的仍然情懷滿滿

  （幸好當時有看舊版驚奇四超人和夜魔俠

  漫威真正意義上代表了我的青春

  雖然對我來說終局之戰結束他就跟著結束了

  如果未來有什麼指標性的一刻,我還是會暫時回來吧

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  會拿美麗比喻成愛的人，都是不知愛情真相的人

  會把醜陋比喻成愛的人，都是熟知愛的驕傲者


  --'
