title: '[新聞] 死侍與金鋼狼宣布完工 導演談預告古柯鹼'
content: '《死侍與金鋼狼》宣布完工！導演談預告中「古柯鹼笑話」：迪士尼確實不准我們碰




  雖然《》（Deadpool & Wolverine）作為 首部電影，看似突破

  了相當大的尺度。


  然而根據導演 （Shawn Levy）近日受訪指出，對本片依然還是有一些界

  線的要求，讓這部電影「。」。


  在接受《Total Film》訪問時，李維談到了《》電影預告中一段關於「

  」的笑話。


  他承認這不僅僅是一個笑話：


  「我對於自己能說什麼非常謹慎，但我可以肯定的是，能不能在片中吸古柯鹼這件事，其

  實在早期討論時就排除了。而我們覺得這是一個有趣的話題，所以就把他寫進台詞裡了。

  」




  近期本片也正式完成所有後製工作。


  （Ryan Reynolds）在限時動態感謝李維一路的陪伴：


  「像是一個耗時千年的工夫在一眨眼之間結束了。和他坐在一起工作感覺很甜蜜，讓我很

  不想離開這裡。」


