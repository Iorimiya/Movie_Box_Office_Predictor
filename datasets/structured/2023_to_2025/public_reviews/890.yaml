url: https://www.ptt.cc/bbs/movie/M.1722303483.A.310.html
title: '[新聞] 小島秀夫看漫威<死侍與金鋼狼>發百字心得'
content: "新聞網址：\n\n 漫威最新電影《死侍與金鋼狼》已在上週正式上映，而喜愛電影的《潛龍諜影》製作人\n小島秀夫也前往戲院觀賞後，在社群平台上發表了他的詳細心得。\n\
  \n-----------------------------------------------------------------------------\n\
  \n    「我看了《死侍與金鋼狼》，本片徹底突破了創作者和粉絲之間那到介於現實與虛幻\n的『第四道牆』，但同時不僅打破了作品與工作室之間的那道牆，還達到了 MCU\
  \ 之外所\n有英雄電影和惡搞作品。身為一部處於第五道牆世代的『英雄宇宙』，這就是死侍最大的\n『第四道牆』，絕對將會成為一大轉捩點。\n\n    我們也再次看到了由忽那汐里飾演的雪緒。也看到了健壯的休傑克曼帶回許多來自過\n\
  去 25 年來的回憶，讓我熱淚盈眶。即使是現在，他仍然是一位英雄。」\n\n-----------------------------------------------------------------------------\n\
  小島推特貼文連結(原文為英文)\n\n\n\n當小島秀夫願意花時間撰寫心得，意味著他相當喜歡該作品；反之，如果他不太喜歡該作\n品就只會一句話簡短表示「剛剛到戲院看了\
  \ XX 作品」，例如《蜘蛛夫人》和《驚奇隊長\n 2》。\n\n\n這篇評論很快就吸引到了《死侍》系列演員萊恩雷諾斯的注意，轉貼了小島秀夫的貼文並\n附上幾個大大的驚嘆號。\n\
  \n萊恩雷諾斯推特貼文連結\n\n\n在上映的短短幾天內，《死侍與金鋼狼》目前已經在全球創下了 4 億 3830 萬美元的驚\n人票房成績，直接刷新了多項票房紀錄，同時也在爛番茄網站上獲得了\
  \ 80％ 的優秀評價\n，而觀眾爆米花滿意度更是達到了 98％。\n\n--"
