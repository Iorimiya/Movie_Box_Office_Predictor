title: '[新聞] 瘋傳客串《死侍與金鋼狼》！泰勒絲終於'
content: '瘋傳客串《死侍與金鋼狼》！泰勒絲終於「打破沉默」發文力挺好友：向我乾兒子們的捐

  精者致敬




  《死侍與金鋼狼》（Deadpool and Wolverine）終於在全球影迷的千呼萬喚下正式上映。


  而身為主演萊恩雷諾斯（Ryan Reynolds）、休傑克曼（Hugh Jackman）的好友群之一、

  小天后 泰勒絲（Taylor Swift）雖然早已被外媒證實不會在片中客串、但依然在上映後

  為好友發表了祝福。




  泰勒絲在 Instagram 限時動態上稱讚雷諾斯：


  「過去幾年，我看著我在這個星球上最好的朋友之一，費盡所有心血、靈魂、汗水、時間

  、精力、幽默、痛苦、快樂、叛逆、黑暗和魔法來完成這部電影，他創造了他一生中最好

  的作品，這部電影就像是一扇真正的快樂之門，一個逃離現實的瘋狂途徑，還有一塊熱壓

  三明治。我不知道他是怎麼做到的。」


  也不忘在文末開玩笑：「向韋德威爾森（aka. 我乾兒子們的捐精者）致敬！」


  一直以來，泰勒絲都被傳聞將在《死侍與金鋼狼》電影中客串，雖然這不排除是漫威釋放

  出來製造話題的傳聞，但萊恩雷諾斯早前親自對外澄清：


  「這種電影就是這樣，永遠都能有猜不完的嘉賓名單。我看到一個傳聞，就連貓王也在電

  影裡面。我喜歡這個宇宙的一點就是這樣，凡事都有可能，驚喜就是死侍的本質。」


  新聞網址：




  --'
