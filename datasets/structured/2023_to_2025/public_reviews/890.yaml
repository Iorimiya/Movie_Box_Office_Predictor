url: https://www.ptt.cc/bbs/movie/M.1722096602.A.027.html
title: '[普雷] 死侍與金鋼狼 只推薦給粉絲的賣情懷電影'
content: '雷文防雷資訊頁


  以下幾乎沒有據透，算是一點點據透。


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  7/27週六晚上去台中新光三越4廳看電影：《死侍與金鋼狼》Deadpool & Wolverine，

  我是X戰警的老影迷，從2000年的第一集開始，系列作每一集都有看，而且都有收藍光，

  驚奇四超人1和2、死侍1和2也是一樣。


  先說結論，死侍與金鋼狼真的只剩粉絲向賣情懷，推薦粉絲可以去看，但期待不要太高。

  我的評價：死侍2>=死侍1>死侍與金鋼狼。跟同樣是賣情懷的蜘蛛人無家日相比，

  我覺得死侍與金鋼狼比較好看。

  如果完全都沒有看過系列作，建議至少先看過死侍1和2、羅根。


  如果不是X戰警系列作粉絲，會抓不到很多笑點，就不是很推薦，現在檔期去戲院

  看大螢幕，更推薦龍捲風暴或腦筋急轉彎2，兩片都大推。


  缺點：

  1.劇情了無新意，說得更直接一點是無趣。劇情故事比死侍1和2弱很多。

  2.死侍1和2有一些很白爛的創意笑點，不用懂梗也會覺得好笑，例如：

  在溜冰場開壓路機壓人、揮刀砍子彈的姿勢很帥卻都沒砍中、

  降落傘被風吹偏隊員都很慘……。

  死侍與金鋼狼的這種笑點，勉強算只有一個，而且還不太好笑。

  3.動作打戲和超能力特效畫面都還好而已，沒有像死侍1和2那麼驚豔。


  優點：

  1.再次看到休傑克曼飾演金鋼狼，而且有賣肉畫面，讚。

  2.賣情懷算是賣得還不錯，許多老角色有登場。

  3.片尾有X戰警系列作、驚奇四超人的正片畫面和拍攝花絮，看到年長版和年輕版的

  X教授、萬磁王和一些演員，很懷念，而且也是跟福斯說再見了。


  最後小小吐槽一下，片中會出現某人飾演金牌手，真的幸好當年沒有拍成獨立電影，

  他的造型根本不搭，金鋼狼1那位金牌手好多了。


  --'
