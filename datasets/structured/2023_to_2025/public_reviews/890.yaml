url: https://www.ptt.cc/bbs/movie/M.1721753347.A.232.html
title: '[新聞] 傳奇天后降臨「死侍與金鋼狼」首映邀到'
content: '傳奇天后降臨「死侍與金鋼狼」首映邀到大咖原因曝光


  2024-07-23 18:11


  聯合報 記者陳建嘉／即時報導




  天后瑪丹娜現身力挺。導演尚恩李維(左起)、萊恩雷諾斯、瑪丹娜、休傑克曼現身「死侍

  與金鋼狼」出席紐約首映，為全球電影宣傳正式劃下句點。圖／漫威影業提供


  萊恩雷諾斯、休傑克曼主演漫威大片「死侍與金鋼狼」昨日在紐約盛大舉辦首映，2大主

  角全球跑透透之後終於回到紐約老家宣傳，萊恩的愛妻「花邊教主」布蕾克萊芙莉也現身

  與老公合體，她一早還貼出夫妻親吻照曬恩愛，首映更邀來流行音樂界天后瑪丹娜助陣，

  2主角也特別感謝瑪丹娜如何協助電影拍攝。


  萊恩受訪時透露他一直是瑪丹娜的歌迷，也希望一直想將她的經典歌曲「宛如祈禱者」帶

  入「死侍」系列電影，如今終於圓夢，萊恩當時與休傑克曼一起登門造訪，沒想到瑪丹娜

  不僅立刻答應，更提出一些如何運用這首歌的想法，更在首映會現身力挺，讓萊恩感動直

  呼「受益無窮」。


  休傑克曼曾於2017年拍攝「羅根」時宣布不再演「金鋼狼」，後來卻反悔並回歸再演，他

  對此苦笑回應「我甚至騙了當年的自己」，至於之後是否會再演「金鋼狼」，他則笑答「

  以後再說吧」，現今只希望粉絲好好享受「死侍與金鋼狼」。


  電影原聲帶歌單也於上週末在音樂串流平台上架，延續前兩集跳tone又懷舊的經典金曲風

  ，包括經典抒情歌曲「Only You」、新好男孩的勁歌「Bye Bye Bye」，甚至還有休傑克

  曼的賣座強片「大娛樂家」主題曲「The Greatest Show」，讓人更期待正片電影還會有

  什麼驚喜。


  「死侍與金鋼狼」首映後獲得佳績，不僅有媒體直言「」，並誇讚片中

  大量的動作特技場面，「」


