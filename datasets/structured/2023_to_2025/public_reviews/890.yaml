url: https://www.ptt.cc/bbs/movie/M.1722222296.A.CB2.html
title: '[普雷] 死侍與金鋼狼—情懷賣滿，只有情懷'
content: '雷文防雷資訊頁















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  看完後，心情五味雜陳，其實我預期要看到的元素都在：


  * 不受尺度限制，有創意的動作戲

  * 死侍的吐槽

  * 對非主流群體之間非主流羈絆的溫情描寫


  但覺得整體的節奏不流暢，顯拖沓，文戲(吐槽)的部分

  多到我覺得嘮叨，而且此作的笑點對觀眾的要求很高，

  甚至不是那種對原著的彩蛋，而是對hollywood與漫威

  工作室近幾年的八卦要追得很勤，才能有所共鳴。


  我自己能看懂大部分的笑點與它們的背景，但跟我同行

  的友人就迷失在萊恩雷諾斯的連珠炮裡了。


  看完這部走出電影院的感覺很像前年看完蜘蛛人無家日

  ，三代同堂的激情過後，發現其實電影沒很好看。



  最後分享一下我最喜歡的笑點，就是死侍一直被索爾畫

  面困擾。


  後面花絮跟整個福斯宇宙說再見的時候，其實眼睛有點

  熱熱的，感謝福斯給我們最棒的金鋼狼，感謝萊恩真的

  很愛死侍，才能讓這個作品問世，甚至發展成系列作。


  --

  如果你已經在版上看完了相關''驚喜''的文字整理，那沒必要進影廳看了'
