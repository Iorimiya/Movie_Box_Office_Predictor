content: '《死侍與金鋼狼》多款版本海報釋出！外媒打破傳聞證實「她」不會登場




  漫威《》（Deadpool and Wolverine）電影即將在下個月上映，日前本片在

  北美正式展開預售，。


  而日前漫威也同步釋出 Screen X、IMAX、4DX 以及杜比等多款院線版本海報：








  此外，這部電影一直以來都確認將有大量的豪華客串陣容，也盛傳（Ryan Rey

  nolds）與（Hugh Jackman）的好麻吉 小天后（Taylor Swift，下圖）將

  在本片客串飾演「」（Dazzler）一角。


  不過今日稍早《娛樂周刊》首度對外證實，。


  一直以來，由於這幾位好朋友的形影不離，泰勒絲加入漫威的風聲也開始不脛而走，目前

  仍有傳她會以其他角色，在未來的  洽談登場。


  《》將在 7 月 24 日於全台搶先上映，北美則將在 26 日上映。




