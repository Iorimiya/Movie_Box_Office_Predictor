title: '[普雷]  《死侍與金鋼狼》亂七八糟的動作戲（'
content: '不好意思，我剛看完以後覺得這次的動作場面真的做得非常差

  甚至連前兩集的動作水準都達不到

  這次唯一能讓人驚艷的就只有哽跟雙關玩的更有層次

  連客串都覺得男主角酸的真是有夠絲絲入扣

  （沒預算、請不起誰誰誰、錢都花在哪了）

  但是如果把這層心思營造在動作戲上面的處理上我想會更好

  尤其是身為第三幕對電影來說那麼重要的高潮戲

  你把主角跟大反派兩方弄在一個上下層的下水道

  下水道？

  下水道？

  下水道？

  然後各演各的也沒有打？

  那你設計那麼強的反派出來幹嘛

  最後在那邊做些類似洛基第二季最後大結局的內容

  這種劇情設計不都是發生在沒什麼錢跟預算以後

  才會搞成這樣像在拍影集一樣吧

  然後TVA的人在電影裡面只有出現影集的一位

  其他人都去哪了？這不還是犯漫威以往的錯誤嗎

  都發生那麼大的事情其他重要的人都好像不存在一樣

  那到底影集是在忙什麼的



  --'
