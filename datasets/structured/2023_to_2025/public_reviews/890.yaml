title: '[新聞] 《死侍與金鋼狼》嘴砲開打！ 中文正式預告來了'
content: "《死侍與金鋼狼》嘴砲開打！ 中文正式預告來了\n\n2024/04/22 21:30\n\n\n「死侍」萊恩雷諾斯（右）和「金鋼狼」休傑克曼在《死侍與金鋼狼》並肩作戰。\n\
  （翻攝自YouTube）\n\n〔記者許世穎／綜合報導〕漫威電影宇宙年度超人氣爆點鉅作《死侍與金鋼狼》最新預告\n稍早登場，這不僅是《死侍》系列回歸漫威的第三篇章，更象徵《X戰警》系列及死侍和\n\
  金鋼狼兩大超級英雄正式回歸漫威電影宇宙。\n\n該片同時為漫威影業首部R級電影，休傑克曼與萊恩雷諾斯兩大「相愛相殺」動作巨星，\n也於《X戰警：金鋼狼》睽違15年後再度重磅同台。預告中終於看到兩人正式同框畫面，\n\
  嘴砲滿點大打出手之餘，更要並肩作戰，還一起穿越多重宇宙。\n\n\n「死侍」萊恩雷諾斯（左）和在《死侍與金鋼狼》不改惡搞風格，讓「金鋼狼」休傑克曼\n受不了。（翻攝自YouTube）\n\
  \n電影由曾分別和休傑克曼與萊恩雷諾斯合作賣座強片《鋼鐵擂台》及《脫稿玩家》的票房\n大導薛恩李維執導，互為舊識至交的三人，終於因本片組成鐵三角，更加令人期待他們以\n\
  戲外的高度默契擦出強大火花。\n\n薛恩甫於今年4月11日在拉斯維加斯舉行的ComicCon 漫畫展覽會上獲得年度導演獎殊榮，\n提到新片更強調「《死侍與金鋼狼》不是漫威的《死侍3》！」他說新片並不企圖模仿前2\n\
  部《死侍》的任何東西，「那兩部片很棒，但這一部是兩個角色的大冒險。」《死侍與金\n鋼狼》將於7月24日搶先全美在台大銀幕登場。\n\n《死侍與金鋼狼》最新預告：\n\
  \n\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
