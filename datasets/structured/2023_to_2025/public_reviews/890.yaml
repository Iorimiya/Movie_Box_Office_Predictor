title: '[雷] 死侍與金鋼狼 情懷滿分 內容零分'
content: '死侍與金鋼狼


  這部電影

  如果你不是忠實漫威或者x戰警粉絲的話

  不建議花幾百進去電影院看

  可以建議你朋友去看


  啊你看到很多兒時回憶角色出場就很嗨的話

  那你也可以看


  像我這種單純喜歡死侍1 2的

  不建議看


  回到劇情幾個吐槽點

  1.文戲太多

  死侍1 2對話的時間比例應該比這部少很多

  我如果要看這麼多對話那我看八辣台劇好了

  我本來覺得死侍對觀眾對話很新穎

  但是這部是那種讓你很出戲的那種對話

  舉個例子

  明明最後時間線都要毀滅了

  死侍應該很緊張阿

  啊沒有 還繼續跟娘砲死侍屁話

  再跟觀眾屁話幾句

  我覺得你至少一邊打架一邊講話吧

  結果 沒有

  機器要啟動地球要毀滅了

  死侍娘砲死侍兩個就站在那屁話了三分鐘

  搞得好像花錢進電影院的我才是小丑

  整個劇情沒有張力

  死侍2起碼最後要毀滅孤兒院

  演到死侍倒地

  最後才是純純屁話內容


  2.意義不明的角色還有慢鏡頭出場太多

  我承認看到刀鋒戰士出場很嗨

  然後其他的完全無感

  一開始看到死侍金鋼狼合體也很嗨

  但是到後面演到快兩小時

  你們兩個還在慢鏡頭出場！？？？？

  很多鏡頭是純純的走秀水時間

  而且很多角色都是動作不多

  就慢鏡頭或特效水時間

  還是跟第一點一樣

  這部的動作比例太少導致看起來很水


  3.邏輯劇情太弱

  爽片劇情本來就沒太多邏輯劇情

  所以我放第三點

  因為這部實在有點離譜實在得說說

  死侍2目標就是要救贖自己和小胖子

  這部片目標就是要救自己的時間線

  好 啊所以那狗出現跟這劇情關連在哪

  你的宇宙72小時就要被毀掉了

  你很急欸

  你跟人家玩狗幹嘛

  再者

  攻擊垃圾場蟻人巢穴

  吐槽點太多完全沒任何戰術性質

  都不搞個戰術偷襲

  前鋒後衛哨兵都沒有

  人家眼皮底下進來

  反派光頭女單人站門口把你掀飛就好

  再來

  悖論幹嘛跟死侍金鋼狼說短路機器會死掉

  這種正常不是等他們去短路的時候

  再拍悖論跟旁邊的人講嗎？

  旁邊的人良心不安去警告他們他們才知道啊

  一開始都講會死了誰會幫你做？

  再來

  短路完本來說會死

  結果突然就說死侍加金鋼狼一起不會死？

  你是兩面宿謨嗎？

  都不用鋪墊就自己改設定的？


  4.無意義梗超多

  彼得是誰？彼得就算很受歡迎

  死侍們就都忘記自己要做甚麼上去簇擁他？

  你們是要去輪肛他嗎？


  5.美女太少

  正常這種爛爽片要有美女性愛鏡頭撐場面

  第一二集的女主很正有露大腿

  這集明顯老化很多不行了

  這集狼女出來就戴個墨鏡穿T恤

  反派光頭女瘦的跟化療一樣就別脫衣服了

  建議是找那種恐怖片的普上妹露奶一下

  都好很多


  6.死侍金鋼狼打架缺乏新意

  這部戲只有這部分打架比較認真

  第一輪死侍敗北

  你第二輪要想戰術阿怎麼還是硬剛

  第二輪可以偷放炸彈在他車底下阿

  或者研究狼左拳還是右拳比較快進行壓制

  偷藏武器攻擊阿

  死侍體重比較輕就風箏狼樹上跳來跳去

  遠程射擊阿

  這兩輪打戲看下來覺得很不用心阿

  尤其第二輪完全不知道在打什麼的


  以上

  真的不建議看完這文的大家進電影院看

  但建議你朋友去看

  不能只有我花冤枉錢


  理性討論

  peace











  -----

  Sent from JPTT on my OPPO CPH2579.


  --

  我不是很在意，不過謝謝您的建議

  對啊我很急想說世界要毀滅結果他在屁話

  光頭女這造型無袖走在路上你看到她不覺得這是剛化療完那當我沒說

  抖M!?

  我覺得反過來欸看來評價兩極

  臉是真的很精緻啦留長髮應該是正妹

  那是寫給我自己的我越寫越氣趕緊勸勸自己

  光頭女+過瘦==>大概率是化療女性，所以形容為化療造型，您有不同見解嗎？

  是！長官！下次發文前一定再多做功課！

  是！

  好！我會建議我朋友去看就好！

  為您帶來歡笑真好！'
