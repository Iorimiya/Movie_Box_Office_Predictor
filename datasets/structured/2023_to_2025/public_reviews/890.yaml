url: https://www.ptt.cc/bbs/movie/M.1483076521.A.54F.html
title: '[討論] 謠言破除！死侍與金鋼狼不會在《羅根》'
content: "由休傑克曼（Hugh Jackman）飾演的「金鋼狼」（Wolverine）陪伴我們度過了許多時光\n，而如今他即將在《羅根》（Logan）裡面最後一次以這個角色出現，也讓人感到相當不\n\
  捨，不過先前釋出的預告讓觀眾對於這次的電影風格非常期待，導演詹姆斯曼格（James\nMangold）也在先前的訪談中透露，這次不會再像其他超級英雄電影那樣「炸大樓」，更\n\
  令人期待電影本身會是什麼模樣。\n\n嘴砲系超級英雄「死侍」萊恩雷諾斯（Ryan Reynolds）在訪談中曾經表示，他希望能夠\n透過網軍的力量讓死侍與金鋼狼一起演出，外國媒體\
  \ The Wrap 也報導死侍可能有機會在\n《羅根》中出現。不過日前導演詹姆斯曼格與萊恩都在自己的推特上面破除了這個謠言，\n表示他們感到相當惋惜，不過這個新聞並不是真的。\n\
  \n「很難過地，這不是真的。24601 號囚犯有一個人的任務要完成。」－萊恩雷諾斯\n\n好吧，謠言破除後想一想，死侍這個角色實在也無法在這次《羅根》如此陰鬱的電影風格\n\
  中出現，從日前釋出的最新劇照與海報中，真的也很難想像死侍如何融入其中，所以大家\n就把這件事情停留在美好的幻想中吧。（但其實休傑克曼的臉早就出現在《惡棍英雄：死\n\
  侍》裡面啦！）\n\n《羅根》的卡司包括波伊德霍布魯克（Boyd Holbrook）飾演唐納皮爾斯（Donald Pierce\n）、史蒂芬默錢特（Stephen\
  \ Merchant）飾演變種人卡利班（Caliban）、殺手組織\n Reavers 等，將在 2017 年 3 月 3 日台灣同步上映。\n\n\n--"
