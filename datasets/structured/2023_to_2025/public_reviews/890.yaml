url: https://www.ptt.cc/bbs/movie/M.1724319122.A.17F.html
title: '[討論] 死侍與金鋼狼問題(雷)'
content: '按照劇情來講，

  死侍跟羅根侍在同個宇宙，

  羅根掛掉會導致宇宙滅亡，


  而我們從羅根的故事中，

  可以知道變種人幾乎滅絕，

  只剩老X教授，羅根等少量變種人或是X23這種培育出來的。


  那麼問題來了，

  在死侍1中，死侍在第一次參觀變種人學校時，

  有打破第四道牆對觀眾說，

  片酬太少請不起大咖，

  然後出現舊畫面，X教授野獸等人把教室房門關上，

