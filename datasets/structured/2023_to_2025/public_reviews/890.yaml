url: https://www.ptt.cc/bbs/movie/M.1724057300.A.1F0.html
title: '[普雷] 死侍與金鋼狼，可惜'
content: '一些觀影當下的感受：


  1. 開頭跳舞和打架，我本想是死侍一邊跳舞一邊打架，但看銜接處動作和時間應該不是

  連貫的，看起來很割裂。


  2. 死侍的角色成長應該在前兩集就完成的差不多了，導致再以內部動機（家人、朋友）

  去推動死侍行動變得沒什麼說服力。所以有必要以外部事件去推展劇情，也就是死侍要去

  拯救那些被刪除、遺忘的超級英雄。可惜，那些經典的超級英雄是出現了，卻沒什麼戲份

  和鋪陳（起碼拍一些他們為什麼被時間管理局丟入虛空，或者如何對抗卡珊卓）。相形之

  下，死侍的家人朋友在劇情後段幾乎沒有任何作用，卻給了一場生日派對的戲份，比重怎

  麼看怎麼怪。還是兩個字，可惜。


  3. 死侍拿善良死侍擋槍那段我實在看不懂，不知道是不是死侍的快嘴輸出讓我miss掉什

  麼劇情，總之，我無法理解兩人之間除了那隻可有可無的狗以外有什麼深仇大恨。當然我

  們可以說死侍這個角色本來就是道德倫理混沌，但前面他把家人朋友時間線看得有多重，

  這段人肉擋子彈就有多突兀，很難用「我不知道他沒有再生能力」的嘴砲就矇混過去。而

  且，安排個理由讓善良死侍自願去擋子彈也不是很難吧（大家也知道金鋼狼被亞德曼金屬

  子彈打到頭也是會失憶的）？


  4. 死侍和金鋼狼單挑很讚，但第二場車上對決給我的感覺真的是為打而打...雖然我知道

  金鋼狼是因為死侍騙他說可以拯救他的時間線，這個理由確實比不小心卡在洗衣機裡有說

  服力，但情緒醞釀完全不到位，我在戲院裡的感覺就是這段真的完全靠狼叔的演技在撐。


  5. 反派完全不行...角色塑造、劇情就算了，手指在人臉上動來動去真的不用那麼久，因

  為很容易看出特效的假。


  6. 片尾回顧福斯過去超英電影那段很棒，我童年有幸在電影院裡看X戰警，至今還記得看

  完電影的感覺：小淘氣好辣、金鋼狼好帥，冰人憑什麼。



  --


  我不是說從現實上解釋他們為什麼被取消，而是做一些他們遇到時間管理局，然後被取消

  的鋪墊。我懷念刀鋒戰士，我希望看到一點那樣的風格被延續，雖然死侍可能會嘲笑那有

  點偏向DC了。'
