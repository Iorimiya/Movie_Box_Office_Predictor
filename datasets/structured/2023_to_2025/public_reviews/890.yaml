url: https://www.ptt.cc/bbs/movie/M.1722323310.A.E11.html
title: '[普微雷] 死侍與金鋼狼：艾薇兒讚讚'
content: '剛看完這部感覺7/10

  1分給這部的配樂品味

  0.5分給有放我老婆艾薇兒的歌

  0.5分給開頭的打鬥


  先講劇情其實劇情真的一般

  就是很典型的公式爆米花片

  當然不是說這樣不好

  畢竟公式之所以是公式就是因為有用

  而且這部也塞了不少梗跟情懷

  要塞一堆情懷還不能突兀

  那真的不能太苛求劇情了


  動作特效的部分

  我覺得落差蠻大的

  一開頭死侍一打多配那個配樂

  邊打邊跳舞擺pose

  那是真的吸睛又騷又帥

  但後面的打鬥就沒那麼好看了

  特別是多人戰鬥的部分

  不能說不好

  但真的跟開頭落差太多


  然後嘴砲幹話的部分

  這個真的很見仁見智

  不會說不好笑但可能是我老了

  有get笑點但不太能讓我開懷笑了


  最後不得不說女生的角色都蠻美的

  不管光頭妹還是Vanessa, Yukio

  都是真的超級美


  推薦給喜歡看美女的人：）

  -----

  Sent from JPTT on my iPhone


  --

  她的手指真的很美，想被她插頭'
