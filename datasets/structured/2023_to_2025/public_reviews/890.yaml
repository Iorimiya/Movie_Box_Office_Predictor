url: https://www.ptt.cc/bbs/movie/M.1722235010.A.13F.html
title: '[新聞] 《死侍與金鋼狼》休傑克曼帶頭大玩金鋼'
content: '《死侍與金鋼狼》休傑克曼帶頭大玩「金鋼狼的迷戀」　話題迷因「真人化」爆笑重現慶

  祝票房



  現正熱映的「漫威電影宇宙」第34部電影《》（Deadpool & Wolverine），

  很快地在全球各地掀起了相當熱烈的熱潮，在票房方面不僅有各項紀錄的突破，成為成為

  R級電影史上首映日最高票房紀錄，在社群網路上更少不了戲迷朋友們這種有劇透、沒有

  劇透的迷因梗。


  最有趣的來了！


  迷因梗不只是在戲迷朋友之間玩起，就連擔任《》演出的兩位「」休傑

  克曼（Hugh Jackman）、萊恩雷諾斯（Ryan Reynolds），也分別在他們的Twitter（現稱

  X）上，分享了他們自己「真人化」的知名迷因「（Wolverine Crush）」梗

  圖。




  起初是由「金鋼狼」休傑克曼率先在Twitter上發布，他擺出跟原來的迷因梗圖一樣的動

  作，穿著戰袍躺在床上手摸著相框裡的照片，但不同的是，相片上呈現的並不是X戰警裡

  的誰，而是寫著「全球票房冠軍（#1 MOVIE IN THE WORLD）」，來呼應不久前才剛開出

  的票房成績。


  爾後過沒多久，萊恩雷諾斯也跟著發布自己版本的「（Deadpool Crush）」迷

  因，除了躺在床上的人變成死侍以外，相片裡的人也變成休傑克曼索看著「

  」的樣子。


  極度逗趣的梗圖不只是讓戲迷網友們瘋傳，就連漫威影業也跟著分享在社群平台中。




  網路迷因「（Wolverine Crush）」的出處，最初是登場於1993年1月30日播

  出的《X戰警》（X-Men）動畫影集第一季第五集，金鋼狼看著相片裡的獨眼龍與琴葛雷。


  而目前已知最早被玩成迷因的出處，則可追朔於2011年9月18日，在Reddit網友Jamy18上

  傳一（Scarlett Johansson）的裸體自拍，並且超過1000個讚與20條評

  論。


  後來這個梗圖也被無數網友們廣泛使用，將相框裡的相片替換成各種知名名人、懷舊作品

  ，甚至是替換成其他迷因梗圖。


  如今，也因為《》熱潮與票房佳績，讓漫威影業官方帶頭大玩迷因梗圖，再

  次成為影迷粉絲們的話題焦點。


  新聞網址：









  --

  你的驚奇大媽吧 笑死'
