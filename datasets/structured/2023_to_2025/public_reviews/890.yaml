url: https://www.ptt.cc/bbs/movie/M.1721801085.A.DDE.html
title: '[ 好雷] 還不錯的死侍與金鋼狼'
content: '雷文防雷資訊頁





  雷

  雷

  雷

  雷

  雷


  手機排版請見諒



  先說結論，我覺得本片還不錯，爛番茄給80我給85，多這5分是因為狼叔賣肉


  個人覺得跟前兩片一樣沒啥太大的記憶點，但整體輕鬆有趣。本篇客串的人有點多，但很多

  都不知道是在幹甚麼的


  劇情就...那樣，滿多莫名其妙的地方，不過因為這是死侍，所以又不想太去追究細節了，

  他就是很鬧嘛


  最大亮點就是克里斯伊凡的霹靂火出現吧，前面穿還斗篷沒露面的時候只有露手，看起來超

  像美隊，結果揭開是霹靂火的時候又無言又驚喜的XD

  很快領便當也是不意外就是，畢竟片酬太高，看霹靂火講一堆髒話我真的很想說一聲「Lang

  uage！」


  後面的金牌手那群看得有點愣，金牌手還滿帥的但他們那群真的很打醬油呢，而且打戲有種

  迷之尷尬感

  應該說所有打戲都挺尷尬的

  前面boss剛出現時有驚艷到我，又美又強的，我真的很喜歡這種角色，讓我想到古一

  不過比起古一，妹妹感覺更像缺愛的小孩吧，渴望與哥哥團聚，但又好像沒有，對妹妹的真

  實態度感有點迷茫


  是覺得這部感覺很重要的劇情都是淺淺帶過，像是為什麼狼叔那邊怎麼就剩下他一人，是什

  麼原因人類就趁狼叔不在的時候殺了X戰警那群呢

  是為什麼妹妹剛誕生就被帶走，誰撫養她長大的

  還滿多疑雲很想了解，但就一筆帶過挺可惜的


  後面妹妹就這樣下線有點傻眼，其實我很期待會有故事之神洛基出現一下QQ也沒有，也沒說

  為啥原本狼賤兩人必死的怎麼還活著，不過暴衣看得很爽所以就算了(擦口水


  總之就是中規中矩吧，也沒說好看到拯救所有電影(?)誇張了

  不要期望太大！但還是希望後面電影能繼續看到這兩人搭檔，這兩人真的很有趣呢



  --'
