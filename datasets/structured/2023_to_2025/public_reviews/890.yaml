url: https://www.ptt.cc/bbs/movie/M.1722142178.A.1B2.html
title: 'Re: [討論] 死侍與金鋼狼的幾個問題？（有雷）'
content: '妹?

  剛走出戲院真的覺得看沒有懂

  悖論做的事情很奇怪

  他說他想跟以前的TVA一樣把多的時間線裁剪掉


  他也知道死侍的世界沒了金剛狼本來就會毀滅掉

  他只要放著那個世界就自動消失了不是嗎？

  他卻把死侍弄過來要給他機會去616？

  而且在虛無之地艾莉塔也說他們遇到一樣的狀況

  所以悖論也是把他們從會毀滅掉的世界抓出來又丟過去虛無之地？

  整個脫褲子放屁一樣


  整部電影悖論做的事情都很奇怪

  感覺他把卡珊德拉安排在虛無之地像是玉衡一樣

  又有個火人當他的線人是為了什麼？


  還有那個片尾說真的可有可無

  就算不放出來讓死侍嘴死霹靂火也不影響整個故事

  感覺硬要做反轉的感覺…


  --'
