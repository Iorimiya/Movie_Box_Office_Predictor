url: https://www.ptt.cc/bbs/movie/M.1722934425.A.C43.html
title: '[討論] 死侍與金鋼狼第一個片尾彩蛋'
content: '先說我覺得自己幾乎是為了這個片尾而看完整部正片的。






  防雷頁。





  防雷頁。





  防雷頁。





  本片的劇情合理性與流暢度就不用管了，可說是為了帶入各個角色而編成，


  另外主要的就是看萊恩雷諾斯aka死侍在這部的各種嘴砲，


  可以在本片中大嗆本家漫威、迪士尼及福斯影業真的爽（能過審也是滿謎的）！


  然後亨利卡維爾的狼叔變體、克里斯伊凡的知名前角色、


  只能在這邊拍的查寧塔圖金牌手以及各個前超英電影的角色們帶有滄桑感的出場，


  這就是給一直以來關注超英電影的觀眾們相當棒的驚喜！


  對了還有休傑克曼的五十路腹肌殺必死～～～


  以及長大後的X-23達芬妮金真的是有夠正！！！





  而在看完正片後期待著後續片尾彩蛋播出的時候，


  CAST ROLLING的畫面一側就突然播映了以前拍攝各部超級英雄電影的花絮鏡頭。


  彷彿回到早年的電影結尾會播放該部電影的拍攝花絮那樣，


  觀眾也跟著銀幕上半格的畫面鏡頭，一幕幕地看著出演電影的演員，


  有當年嬉笑打鬧鬧的畫面，有訪談聊到出演角色心境的鏡頭，


  有各個角色的定裝照，還有本片中未能出現的X戰警角色。


  畫面中的演員們都好年輕，如同小時候的我們在看著他們一樣，


  彷彿自己這些年來看過的超級英雄電影，也在腦海中一一閃過......


  完全沒意料到來看最新的這部死侍與金鋼狼，會帶給我這樣的心境啊！


  --'
