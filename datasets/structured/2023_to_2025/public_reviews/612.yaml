title: '[新聞] 《雨中的慾情》中村映里子開心臺灣觀眾'
content: '新聞網址：

  《雨中的慾情》中村映里子開心臺灣觀眾反饋




  記者王丹荷／綜合報導


  　成田凌、中村映里子、森田剛與臺灣女星李杏主演臺日合作電影《雨中的慾情》，對臺

  日觀眾映後反應大不同，成田凌透露，「日本上映時會有種難以言喻的凝重氣氛，在臺灣

  參與映後見面會現場超級熱情，是完全不同於日本的感覺。」也發現臺灣觀眾注重細節超

  乎他的想像，「映後有問到美術的細節，細到連我都沒發現，真的很厲害！他大概邊看邊

  做筆記吧，我看他提問時有看小抄，這令人很開心！」


  　成田凌、中村映里子日前來臺宣傳並接受MyVideo專訪，片中有大尺度情慾床戲、幾乎

  是全裸上陣的女主角中村映里子同樣感到臺日觀眾的差異，被問到臺灣與日本觀眾映後反

  應時，她一度思路定格，讓在旁的成田凌開玩笑吐槽，「是睡著了嗎？」她才笑著回想，

  「日本觀眾會關心我拍攝是不是很辛苦，感覺犧牲很大的樣子，但看完片的臺灣觀眾在現

  場稱讚我很漂亮，讓我真的非常開心！」


  　《雨中的慾情》在金馬首映後爆好評，不少影迷觀後直呼燒腦，成田凌也表示自己已2

  刷，「燒腦度我覺得有6到7分，如果第1次看的燒腦度是7分，那第3次會降為4分，但導演

  說看到第10次是最有趣的！」笑說歡迎大家進電影院10刷。中村映里子則推薦首刷可以放

  空不用腦力，單純享受視覺效果即可，「我相信光這樣也很有看頭。」


  　改編自日本國寶級漫畫家拓植義春同名短篇異色漫畫，《雨中的慾情》描述無名漫畫家

  義男（成田凌 飾）對寡婦福子（中村映里子 飾）有好感，卻被想當小說家的男子伊守（

  森田剛 飾）捷足先登，後者與福子結為夫妻，3人意外展開同居生活，福子與伊守夜夜性

  愛，義男在暗處窺伺，交織出1段悲戀故事，全片幾乎於臺灣嘉義拍攝，將於12月27日在

  臺上映。


  --'
