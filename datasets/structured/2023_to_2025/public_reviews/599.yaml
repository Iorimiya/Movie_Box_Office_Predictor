url: https://www.ptt.cc/bbs/movie/M.1735483720.A.0F2.html
title: '[好雷] 誤判 但是有一點想不太明白'
content: '如題


  沒想到在律政片可以看到那麼爽的打戲


  不過關於打戲就有一個好奇的問題了


  在這部裡甄子丹成為檢察官後的打戲


  我發現絕大部分都是空手的


  但是場景在商鋪或街道


  理應有許多能用於武器的道具


  再不濟


  拿那些匪徒遺落的刀具棍棒也行吧


  夜店那場打戲，甄子丹打戲還是以空手為主


  用被撂倒保鑣的棍棒應戰


  倒也不會狼狽到被放倒的地步


  最後一場對boss的打戲


  去拿被撂倒匪徒的刀搞不好早就贏了帶證人上庭



  所以我很好奇


  香港警界對此有什麼特殊規定嗎？


  例如緝兇時不能用非配備的武器


  要不然不能解釋最後一場打戲


  甄子丹用槍打人，卻不用刀砍boss的選擇


  --'
