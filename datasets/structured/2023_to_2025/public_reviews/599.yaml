url: https://www.ptt.cc/bbs/movie/M.1735973049.A.565.html
title: '[好雷] 誤判，維持熱忱的重要'
content: '衝著tommy大一篇撥亂反正的文

  我進場看了《誤判》


  這部讓我想起了《重案對決》

  對司法制度的不滿意

  都是用暴力的方式去改革

  只是重案用的是體制外的暴力，

  誤判則是用暴力來達成體制內的改革



  我沒有follow過甄子丹導的戲

  原本以為劇情、剪接應該不怎麼樣


  意外的 很紮實很緊湊

  人物動機、性格刻畫、案情揭露、轉場剪接

  都很一氣呵成


  打戲亦是甄子丹的強項

  完全掌握了精髓毫不拖泥帶水

  連我這個偏愛文戲的人，看他打了大半場都不會膩

  不簡單





  最喜歡的點是

  甄子丹心中的那股熱情

  師承自他爸爸

  即使癡呆了仍然不忘記對於正義的堅持


  靠著那股熱情

  激勵了下一批打頭鎮的警隊

  點亮了整個律政司協助他一起查案

  改變了法官和辯護律師僵固的想法

  也才抓出了整串肉粽的頭頭




  只是現實終究是更迂腐的

  即使抓了老大

  在販毒需求還在的情況下

  永遠會有下一個老大出來

  更會有下一個

  勾結的法官、律師、檢察官

  以一己之力改變世界的 恐怕是痴心妄想


  --'
