url: https://www.ptt.cc/bbs/movie/M.1737537916.A.313.html
title: '[好雷] 誤判 The Prosecutor'
content: '誤判

  The Prosecutor

  2024香港電影


  本片是香港真人實事改編的電影。甄子丹是本片導演兼主角演員。 甄子丹主演的電影《

  葉問》系列，令他聲名大噪，這片是他導演作品之一，是很棒的佳作，對他印象更為深刻

  ，相當有才華的人，全片整體印象深刻，這片值得去戲院觀賞。


  個人滿意度85分。


  強大的故事情節和動作場面，讓我在看整部電影時都專注欣賞，充份入戲。 複雜的情節

  加上許多角色的精彩表現，深入探討情感，讓觀眾質疑司法系統，並質疑是非。


  精彩橋段瞬間令人一笑，令人落淚，又觸動心弦。 自始至終，流暢、象徵意義和敘事性

  都很棒。


  以下有劇透。



  1.甄子丹扮演的角色，從警探到檢察官，主角光環滿滿，文武雙全，為弱勢爭取權益，不

  受名利誘惑，不畏邪惡強權，簡直是人間清醒的英雄及菩薩來著。許冠文扮演的法官角色

  ，行為舉止，諷刺好笑，又同時令人皺眉。張智霖扮演的斯文禽獸企業家，根本人間垃圾

  ，陷害許多人悽慘無比的偽善菁英。三個主要角色，在本片中的表現，可圈可點，令人血

  脈賁張。


  2.甄子丹在本片作為戲劇導演，演員和武術動作英雄的技能，都得到了充分展示。 本片

  的獨特之處，在於結合了法庭劇及武術動作片。 甄子丹飾演一名警探轉型為檢察官，首

  要原則是伸張正義，而不是僅僅為了政治目的而定罪。 他違背常理，為一名因販毒而被

  錯誤判處27年有期徒刑的年輕人，尋求真相及正義。這過程中，充滿血腥，驚險及鬥智鬥

  力。


  故事情節不僅讓主角檢察官，與自己任職的部門（由鄭則仕和吳鎮宇出色扮演）產生了矛

  盾，也讓他與自己想要揭露的真正的毒販頭目，產生了矛盾。


  3.本片平衡了法庭內的戲劇性與警察追逐場景中的激烈、堅韌、武術動作，法庭場景一來

  一往之相當精彩。 本片的武打場面設計是一流的。 甄子丹在其電影中不斷創新，將動作

  設計推向新的高度。 影片獨特、視覺震撼的打鬥場面，使其成為一部極具觀看價值的武

  俠動作片。 片中的打鬥場面令人難忘。 火車上的高潮場景，非常壯觀。

  本片正反派角色個性鮮明，可以令人投入情緒為之起伏。結局收地很通俗可預期，但是充

  滿温暖希望，又有幽默感。看完大快人心。



  --'
