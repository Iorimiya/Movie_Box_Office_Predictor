url: https://www.ptt.cc/bbs/movie/M.1737250325.A.286.html
title: '[ 好雷] 誤判'
content: '假日朋友一時興起問要不要看這部

  才發現是聖誕節檔期的港片

  憑著甄子丹三個字進去戲院看

  上映幾週了 在週六晚間熱門時段還有幾十個人進場

  還算不錯吧？

  進場前沒有做功課 原本以為只是爽片

  沒想到劇情蠻不錯的 不愧是真實事件改編

  看完感覺香港好危險



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  一開始的警匪槍戰十分精彩 突大量活用第一人稱視角我給好評

  彷彿遊戲一般 讓人直接感受到短兵相接緊張與刺激

  最後人抓到了 但是一上法庭卻因為律師的唇槍舌戰 無法把主謀繩之以法

  讓主角安然轉換跑道改走檢察官

  然後接到第一個案件開始了整部劇情


  以下個人感想

  看完後除了壞人終於被抓以及打鬥的動作場面與打擊音配的很好很爽外

  也有對於法律的無知有滿滿的無奈

  現在一般人對於法律真的不懂 或者是一知半解罷了

  我有一位律師朋友就常常在賴裡面分享一些社會案件

  有時候我覺得應該是如何 他就會說 不是這樣 你以為這樣沒犯法嗎？

  社會上就是太多法盲 輿論才會如此好操作等等

  我真心覺得不要上法庭對人生是最好的 被一群說著你聽不懂的法律人

  在法庭上決定你的生死 可以想像劇中第一被告的徬徨與無助

  更不用說本來應該幫你的律師 其實是在害你

  所以用錢請的律師收費高一點的確有差 至少看在錢份上他會想辦法打贏官司



  --'
