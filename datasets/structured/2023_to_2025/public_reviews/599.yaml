url: https://www.ptt.cc/bbs/movie/M.1435662813.A.584.html
title: '[新聞] 《斷背山》10周年 李安難忘票房誤判'
content: '中國時報【許世穎╱綜合報導】


  美國日前宣布通過同志婚姻法，今年也正逢電影《斷背山》推出10周年，《綜藝報》特別

  找回該片導演李安與製片詹姆斯夏慕斯，回憶當年拍攝點滴；李安坦言，《斷背山》的成

  功讓他相當吃驚，「我想要歸功於片中深刻又心酸的愛情故事吧。」


  李安表示，當初讀到安妮普露的原著短篇小說，覺得對書中的一切都很陌生，「但斷背山

  上一段離開就永遠無法重圓的感情，一直在我腦中縈繞。」尤其故事主角傑克一句「我們

  所擁有的只有斷背山」，深深打動他，甚至讓他落淚，也驅使他拍了這部電影。


  但拍攝結束後，他直覺《斷背山》會是部「只吸引少數觀眾的文藝片」，所以宣傳時很緊

  張；但該片4.4億台幣成本，全球卻賣出55.5億票房，更拿下2006年奧斯卡３項大獎，被

  視為好萊塢最成功的同性愛情電影。


  新聞網址：


  --'
