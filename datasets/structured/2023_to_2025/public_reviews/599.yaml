url: https://www.ptt.cc/bbs/movie/M.1735141988.A.05D.html
title: '[ 負雷] 誤判，爛片讓我誤判進場'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  我本人是香港警匪跟律政的愛好者，這次看了甄子丹在演誤判，又有IMDB 7.6掛保證就進

  場看了，真是痛苦的兩個小時。


  第一個槍戰莫名其妙決定跑去當檢察官就算了，安排一個輪椅爸爸，啥梗也沒有。


  第一個案子的律師跑來認罪協議不是談減刑是談讓另一個被告無罪，檢察官都不會懷疑？

  也不拿出來當證據？


  然後四處在香港大街跟地鐵上開槍、持刀殺人，我以為地點是美國不是香港了勒，警察還

  抓不到人，奇怪，香港四處都是監視器不是？


  香港警察不是每部都演自己是世界上最強警署？也是不需要為了這次的劇情演的跟垃圾一

  樣吧。


  還有辦法大白天在市中心開車這麼狂，我以為我在看芭樂韓劇。


  如果黑社會有辦法把每一個證人都砍死，那到底我們有法庭跟警察要幹嘛，如果編劇寫不

  出夠縝密的攻防戰，就不要寫了，每個都是要上法庭就砍死，劇情簡單的要命，廣告文還

  在那裡縝密攻防，然後打架也是有夠太浮誇，對手跟浩克一樣把各種器材都拆了，從三四

  樓跳下去也沒死，然後手指虎揍地鐵都可以揍出洞，甄子丹用玻璃就可以弄倒他？


  要演肉搏片就不要假裝律政片啦。





  --'
