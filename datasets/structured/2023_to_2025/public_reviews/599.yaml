url: https://www.ptt.cc/bbs/movie/M.1736237098.A.DE1.html
title: '[好雷] 《誤判》拳拳到肉但劇情也扎實'
content: '跟男友去看了誤判之後我又重新愛上甄子丹

  不管是穿著警服還是西裝，甄子丹真的超有成熟男人的魅力，

  且身材保持得超好，一點啤酒肚都沒有！根本是演員自律的天花板XDD

  都61了怎麼演起來像3-40


  故事本身改編自真實事件，結合了懸疑、法庭攻防和人性掙扎

  甄這次不只展現了他擅長的武打，還有非常多內斂又深刻的情感演技

  尤其是幾場打戲，節奏明快又有張力

  有一幕是在巷子裡的近身搏鬥，動作乾淨俐落又逼真，讓我和男友都看得超嗨

  但其實這部片的重點不全在打鬥，而是對法律正義與人性的討論


  電影裡有個細節真的戳到我心

  霍子豪與包律師在辦公室加班查案時說

  「我覺得我呢份工作，就好似一盞燦爛的明燈」

  看到這句話時，我整個被觸動了

  即使面對挫折、偏見和不公，他依然堅持追求真相，這就是霍子豪這個腳色的寫照

  但同時我也覺得好難

  畢竟小社畜到現在對工作還是沒什麼使命感，就是分領錢的工作

  但或許正因為這樣，才會對霍子豪這樣的熱忱感到震撼吧

  人生不只是日復一日的責任，還可以追尋屬於自己的那份意義


  這部片也讓我想到之前聽李菁琪律師在podcast分享過的類似收包裹被當成運毒共犯，而像?

  看電影時，想到這些現實，真的會心有戚戚焉

  類似的冤案，讓人覺得心情很沉重，像是電影中的馬家杰不僅是失去自由

  甚至連家庭、工作都受到嚴重影響，特別是當你明知道自己無辜

  卻只能在制度裡一次次碰壁，那種絕望感，真的無法想像


  《誤判》不只是甄子丹的演技與打戲巔峰，還讓我重新思考了什麼是真正的正義

  不被證據誤導、要有自己的判斷與獨立的思考

  如果還沒看的人，我真的很推薦，這部片絕對值回票價


  -----

  Sent from JPTT on my Xiaomi M2007J3SG.


  --

  對欸 謝謝提醒

  對啊 主要也是這案件有蹊蹺

  主要也是身份上的轉變？不當前線衝鋒了

  好想要多看一點喔QQ

  迷有錯'
