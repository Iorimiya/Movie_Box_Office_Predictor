url: https://www.ptt.cc/bbs/movie/M.1736244899.A.7B2.html
title: 'Re: [好雷] 《誤判》拳拳到肉但劇情也扎實'
content: '（前文恕刪）





  　　『誤判』作為近年來香港評價最高的犯罪動作電影，


  　　我只希望甄子丹能夠好好教教「寒戰」的製作團隊，


  　　要如何拍才能順順利利地把寒戰第三集甚至更多集數給拍出來。




  　　在寒戰共二集的電影中，


  　　劉德華飾演的陸明華曾說：


  　　「香港能成為(略)亞洲最安全的城市，『法治』是我們的核心價值觀。」


  　　但如果真是這樣，又何來出現如誤判中的冤案？


  　　周潤發飾演的簡奧偉曾說：


  　　「就算是非常時期，你也不能用非常方法！」


  　　但如果真是如此，又何必需要霍子豪這樣的人挺身而出？




  　　更何況藉由郭富城飾演的劉傑輝所經歷的遭遇可得知，


  　　上述二人的理念早已在劇中被狠狠打臉～～


  　　香港既不是法治精神遍地開花的天堂，


  　　亦不是於非常時期可以一如往常不需用到非常手段的樂園。


  　　所以我深切地相信誤判與寒戰系列是有很多相似及互相借鏡的地方。




  　　據傳因為許多檯面下的原因，導致寒戰第三集遲遲無法開拍；


  　　反之，誤判是最高人民檢察院影視中心欽點可以拍攝的題材。(參照維基百科)


  　　這當中的差異，相信甄子丹及寒戰製作團隊自是點滴在心頭，


  　　所以我才希望甄子丹能把這眉角好好地傳授下去。


  　　因為相信很多人都和我一樣，


  　　期盼能再次看到郭富城、梁家輝等明星在寒戰的舞台上大飆演技！！



  --

  　「妳竟能刺我11劍！」一陣狂笑後曹峰無力癱坐地上，宛如交代遺言般緩緩道來

  　『我願化身石橋，受那五百年風吹、日曬、雨淋，只求見證她在我面前爬出．．．』

  　「喔～」曾靜勉強抬起頭，微弱說出『那你對她很好呀．．．』


  　　　　　　　　　　　　　　　　　　　　　　　　　　　摘錄自你所不知道的劍雨


  --'
