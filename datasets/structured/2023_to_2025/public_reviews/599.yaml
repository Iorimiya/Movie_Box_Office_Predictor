url: https://www.ptt.cc/bbs/movie/M.1735631607.A.4A2.html
title: 'Re: [微雷] 誤判-甄子丹給香港動作片的幾句話'
content: '身為甄子丹忠實影迷

  看完這部跟看完成龍12生肖的感覺有點像

  感覺大概沒幾部可看了


  但是這部電影我覺得整體而言稱得上甄子丹的巔峰之作


  文戲武戲都恰到好處，沒有什麼多餘或冗長的部分


  小雷




  法庭戲我都滿喜歡的

  許冠文真的演得太好了

  然後最後他在記者前道歉的那場戲

  他隨便一個敷衍的道歉都能讓我有點鼻酸

  這種演員太恐怖了

  完全是情緒小偷


  所有配角也都很喜歡

  吳鎮宇這次比較沒亮點可能是因為他最會演懊悔的戲，但是這次沒有這種場面


  最喜歡的是兩位毒販

  呂良偉跟浩南的戲真的有夠帥

  第一場私刑戲

  那個架勢那個狠勁

  一場短短幾分鐘的戲完全超越近期所有黑道片啊



  動作戲的話

  我覺得這次最驚豔的是

  甄子丹終於把自己營造成一個相對弱勢

  就是老了沒辦法當警察才去當檢察官

  所以就沒有一夫當關那種氣勢

  自然而然打鬥的部分就會有替他緊張

  腎上腺素分泌的感覺

  尤其地鐵戲那種山雨欲來的氣氛

  真的有夠刺激


  真的推薦這部

  算是甄子丹的神作





