url: https://www.ptt.cc/bbs/movie/M.1735570168.A.4D6.html
title: 'Re: [ 負雷] 誤判，爛片讓我誤判進場'
content: '安排爸爸出場的梗就是為了塑造Mr.霍的人物立體感

  從片中一共出現兩次霍爸以前當警察時的英勇事蹟剪報就知道

  甄子丹一直很以他的爸爸為榮

  而他爸爸即使失智了，也從沒忘記過自己心裡的那團火

  簡直像是把家訓從小就刻在血液裡一般

  就算經常會認不出自己的兒子

  但他永遠都能明辨是非黑白，堅守公理正義

  所以Mr.霍的角色設定不是無腦熱血

  也不是什麼矯情的聖人

  他也只是一個崇拜，並追尋著爸爸背影的普通人

  不然都什麼年代了，

  你要怎麼去說服觀眾這世界上真的還有這樣執著公平正義的人存在

  雖然還是很唬爛，但至少安排一段父子的劇情

  讓你更感覺到Mr.霍這個角色的血肉

  我自己覺得這是一個很好也很合理的安排


  從甄子丹以前執導第一部長片「殺殺人跳跳舞」就可以入圍日舞影展就知道

  甄子丹當導演是真的有料

  以前以為他只是一個武打明星，誤判出來之後我才知道是我誤判了




  -----

  Sent from JPTT on my iPhone


  --'
