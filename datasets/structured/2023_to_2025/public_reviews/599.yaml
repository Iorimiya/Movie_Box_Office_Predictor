title: '[討論]【The Prosecutor】甄子丹【誤判】'
content: "本來是跨年夜要帶【小喵寶寶】一起看得電影\n\n　進廳嚇一跳！竟然【滿】廳 【】\n\n　貓圖\n\n　後續被告知『不能帶寵物』入廳內\n\n\
  　所以隔天『1月1日』挑了最晚的場子『再一次買票』入場\n\n【】\n\n\n\n\n　以一部【武打動作片】來說\n\n　節奏可能不如【】\n\n　（這真的是很奇怪ｄeｒ事）\n\
  \n　】類別電影、我給【９0】分。\n\n　如此高分原因在於、\n\n________________________________________________________\n\
  \n　從\n\n　覬覦\n\n　開場就注定是一場陰謀。\n\n\n　子】首次要去『第①被告』探訪\n\n　\n\n　...\n\n　(Ｂ)遇到２光律師可能不是問題\n\
  \n　但大律師】要翻供\n\n　法官會生氣氣、判你３倍重刑２７年\n\n　\n\n\n　各位看完【The Prosecutor】最有印象應該是\n\n　講話\n\
  \n　有３大指標\n\n　(Ａ)在第１幕出場、監獄內\n\n　【鬧事】獄中打人\n\n　這位大哥自然漏出了\n\n\n　\n\n　在【The Prosecutor】\n\
  \n　退\n\n  ..\n　　　　　　　　　　　　　\n　是退\n\n　..\n　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　\n\
  　登場的是【神經病般ｄer\n\n　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　\n\n　即便『稍後也有另一位神經病、撞到車毀人亡也要弄死_\
  \ _ _』\n\n　你還是能看得出【大塊頭更狂燥、燥得不一般】\n\n　而不只是因為『、人高頭大』\n\n\n　大塊頭ｄer【狂戰士行徑】逼出了此片\n\n\
  　\n\n\n　　　　　　　　　　　　　　　　　　　　\n　　　　　　　　　　　　　\n　可怕是這位【/般ｄer】　\n\n　背景【】\n\n　\n\n\n　這可不是一句【禍害遺千年】就能\n\
  \n　\n\n\n　珍貴的是片中所有\n\n　都是\n\n\n　道門邪術\n\n　不可不慎。\n\n\n　　　　　　　　　　　　　　　　　　　　　　　\n　　　　　　　　　　　　　　　　\n\
  \n\n　我有一位『人生走偏ｄer友人』其口頭禪是【當你凝視深淵、深淵也凝視著妳】\n\n　而在後續【電車搏命護送第②被告】\n\n　、\n\n　\n\n　\n\
  \n　實屬\n\n　提攜著\n\n\n　尤其最大一隻\n\n　所以\n\n　還有我們該【如何保護第１線直擊黑暗、卻遭黑暗侵蝕ｄer執法人員】\n\n\n\n　　　　　　　　　　　　　　　\n\
  \n\n\n　不知道各位有注意到嗎？\n\n　\n　\n　此次依然\n\n　特別的是\n\n\n\n　　即是劇中】\n\n　　雖然\n　　\n　　\n\n　　片尾List看姓氏真的是日本人。\n\
  \n\n　　\n\n\n\n(Ｃ)但全片最後Ｌiｓt跑到一半\n\n　　\n\n　　這是其他電影最後Ｌiｓt所不曾有。\n\n\n　　　　　　　　　　\n　　　　　　　　　　　\n\
  \n\n\n　要說起片中哪一位的演技、顯然跟不上全片資深演員\n\n　想必就是【第①被告】Ｍa家杰\n\n　兩處皆是片尾\n\n　最後、庭上終於裁決【不起訴第①被告】\n\
  \n　打贏官司的【Ｍa家杰、不可能開心】\n\n　因為、就連媒體風評轉為同情【都是從爺爺開腸破肚慘死】那刻\n\n　此案才開始被大眾關注\n\n　太明顯的殺人滅口。\n\
  \n　就像【庭上太明顯大律師】\n\n　、爺爺對或不屑都是正確情緒】\n\n\n　\n\n　\n\n　真的笑得出來？那有機會當下一個【Ａu柏文】\n\n　鏡頭卻給了一個\n\
  \n　...\n\n\n　\n\n　\n\n　但似乎情緒也沒有表現到位。\n　　　　　\n　　　　　　　　　　\n\n\n\n\n　演藝圈知名【被ｆa\n\n\
  　不只一次表明【爺孫感情深】\n\n　倘若協助寄運毒品被抓、庭上判【\n\n　等同出獄再也見不到【唯一親屬】\n\n　【疼孫的爺爺想翻案、卻被人開膛破肚慘死街頭】\n\
  \n　這樣ｄeｒ\n\n　都是該考慮的\n\n　【Ｍａ家杰】演技還跟不上同劇演員、無庸置疑\n\n\n　　　　　　　　　　　　\n　　　　　　　　　　　　\n\n\
  \n\n　劇情的最後結局\n\n　會不會也是一種誤判？\n\n　因為片中最後抓到【英笙/呂良偉】瞬間\n\n　這位\n\n　..\n\n　大概比【後腦紋上咒印\
  \ the 外籍傭兵】還滲人心寒\n\n　倘若要說情緒哪裡有問題\n\n　在【Ｍr.Ｆoｋ】逮到【第②被告Ｃhｅn】要把他帶回法庭出庭作證\n\n　車子被撞毀前\n\
  \n　車上【執法人員式、麻木對談】顯然活屍化了些。\n\n\n\n　各位有否覺得、【Ｍr.Ｆoｋ】夜店被保全圍毆、失去意識後\n\n　\n\n　\n\n　了\n\
  \n　這組畫面\n\n　\n\n　在場眾人緊接著給上一刀、或繼續用滅火器、【Ｍr.Ｆoｋ】就bye了\n\n　而這個拉長距離的鏡頭\n\n　\n\n　...\n\
  \n　\n\n　就是我想跟大家討論的\n\n　歡迎各位高見、\n\n　新年快樂【並為可能已故好人默哀３秒】\n\n\n\n　這兩天都在信義華納威秀\n\n　附近有跟片中Ｐuｂ很像的圓頂、最初時沒拍照、晚點補圖。\n\
  \n\n\n\n\n　【後記】\n\n　我本來要推【期待/Ｔhe \n\n　但【了】\n\n　【\n____________________________________________________________\n\
  \n　\n\n　\n\n　所以【不推誤判２】先去祭解\n\n　各位還是小心\n\n--\n　　　　　\n--\n\n　　一般來說不行、但也不是盜錄\n    只有一張還好吧！\n\
  \    我本來想拍一張滿廳畫面，很久沒進滿廳的場子了\n\n 　 但轉過頭..都是人、孬了一下\n    想說只拍正前方好了\n\n\n    補影片在(九)後話(下)\n\
  \n\n\n    有沒有像!?\n\n    又修了一下上色、感謝大家意見 QQ\n\n　　還是再問一下\n　　各位對於最後【甄子丹】跟【英笙/呂亮偉】對望一笑\n\
  　　有什麼看法？\n　\n　　以及Ｈeute（本日2025-01-05) 下午在\n\n　　。"
