url: https://www.ptt.cc/bbs/movie/M.1735885590.A.414.html
title: '[好雷]  抱歉 誤判甄子丹了！'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  原本以為甄子丹的電影路術都差不多

  這次去看誤判也是主打一個開心看的就好，結果意外被打動>o<

  需要給這部電影和甄子丹一篇道歉表


  -道歉1-甄子丹只會拍武打片?

  這個真的要大大道歉，當我發現是你自導自演的時候看衰！

  畢竟你之前拍的都賣不好....這部改編真實案件的律政片

  拍的節奏分明不枯燥，會一直期待下一幕劇情，很厲害！


  -道歉2-打戲都千遍一律？

  這部打戲比重超過50%，但真的不像之前都是同批人一直重複XD

  特別是捷運上那段我覺得超級精彩，一直起起落落的情緒起伏

  真的超級讓人熱血沸騰！剪輯的也很精彩，文武對剪的節奏抓的非常好

  完全不會冷場，連親情的感情都有顧到，整體很流暢


  -道歉3-甄子丹打爽就好，應該都沒什麼內容？

  光看誤判這部片的名字，很明確的表達，司法判了一個小小的錯誤

  就足以造成一個體系的崩壞；這時如果出現像甄子丹這樣正義的檢查官

  也能解救食古不化的體制，尤其這部是改編真實案件，意義之深刻


  -道歉4-律政片的法庭交鋒容易乏味？

  以前認知的法庭片，都是需要了解一些法律知識，這次設計了很幽默對話

  有一反以前覺得甄子丹只會出蠻力的印象，很簡單就能瞭解劇情想傳達的

  在法庭上跟許冠文、吳鎮宇這些老戲骨的搭配，這些小細節真的讓人會心一笑，讓法庭戲

  非常精彩可愛，現場笑聲最多的一趴


  -道歉5-最後一個抱歉要給張智霖

  被老婆打壓的形象太深根蒂固，但這次反派壞的挺可愛！雖然還是壞到骨子裡，真的可惡

  呀！！但有點擔心你抱辣妹到這麼緊，回家之後的人生安全XD



  結論，雖然劇情永遠邪不勝正，畢竟甄子丹的電影，總會有種正義的化身

  這部也不例外，看完真的給大家滿滿的正能量

  不過港片可以拍出這種水準，真的驚艷，這也是我最抱歉的一點！

  看完這部絕對是今年年底讓我意外覺得值得一看的電影XD

  大家不要誤判了！！





  --

  真的啦 XD

  ><

  好愛捷運裡那段打鬥！

  XD

  打成這樣還要推別人 很猛耶XD

  真的 還好還是很多好人：）

  他也很讚沒錯

  差點沒認出來嗎哈

  真的蠻推的這部～

  我也覺得搭配的很不錯

  +1

  真的帥 好能打XD'
