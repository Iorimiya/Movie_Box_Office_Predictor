url: https://www.ptt.cc/bbs/movie/M.1735636453.A.DEA.html
title: '[神好雷] 誤判（2024）'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  觀影證明：



  前言：

  法庭流程有些短短的大字與簡述，只是很快淡化看不太清楚，不過對於大部分外行的人可

  能不重要；文戲與動作很平均，雖沒帶到香港其它主要景點，至少訪港不論是旅遊或者商

  務應該都還是覺得有感～


  心得：

  小弟外行是不理解電影在幫忙上法庭流程的課，但關於情感描述有些橋段都讓人鼻酸；


  1. 霍檢離開警察身分同僚目送。

  2. 爺爺打吸毒媽媽領回孫子監護權。

  3. 孫子被判27年監禁，爺爺說等不到出獄。

  4. 霍檢訪問馬伯住家環境不堪時。

  5. 爺爺把霍檢錢錢放公仔麵碗底然後領便當。

  6. 洗衣店小妹妹答應出面指證

  7. 李督察告知警察被動一事。

  8. 律政司大夥送上啤酒幫忙霍檢。

  9. 楊官在庭上發聲

  （原本以為他是內鬼）

  10. 陳國榮轉為污點證人出席開庭


  結語：

  整體上真的很棒！而且動作戲運鏡很好，借位也很真完全不尷尬，本來幻想霍檢跟阿文對

  打但沒有，另外看到香港黃金90年代的他們都仍在大螢幕上，最近看了兩部華仔加葉師傅

  覺得倍感親切好多熟悉的面孔，希望華映公司可以再提供更好的電影讓我們那時代的朋友

  們回味香港電影輝煌。


  --

  開頭那段第一，三人稱視角變換像遊戲一樣XD

  覺得打戲都狠帶勁完全不尷尬。

  香港隊長OK。XD

  （握手示意）

  完全不冷場？

  每人都有部經典無可取代。'
