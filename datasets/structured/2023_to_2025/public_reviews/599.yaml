title: '[好雷] 誤判 甄子丹'
content: '香港介於法律跟武打動作之間電影，


  法律相關規定電影，

  我猜應該是看到黃子華的毒舌大狀大賣

  趕快推出類似的題材

  心得如下：

  1.感覺律政司從頭到尾都有鬼

  2.剛開始用盾牌後面視角拍攝打鬥，滿有趣的

  還有快遞都是用快遞前面五公分的視野看

  3.黑道那邊張智霖的交代背景不是很清楚，大boss 一下被警察直接帶走，太弱了

  4.鄭則仕的立場轉變太快，

  從不支持變成主動參與，轉太硬

  5.節奏很快，沒有冷場

  6.車廂內打架，最後壞人是腳太痛鳥掉，有點弱

  7.支線太多，變成四不像，法庭攻防面/武打戲/黑道毒品/爺爺跟孫子情感/為什麼洗衣店妹妹忽然要出庭作證/律政司全部同仁自動加班幫忙


  以上歡迎推文討論交流


  小結：一定要去電影院看，聲音才會出來，不是在家用電視看可以感覺出來的


  -----

  Sent from JPTT on my Samsung SM-A5560.


  --'
