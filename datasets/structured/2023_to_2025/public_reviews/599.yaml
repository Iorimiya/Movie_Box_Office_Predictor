url: https://www.ptt.cc/bbs/movie/M.1735732992.A.54D.html
title: '[好雷] 誤判 '
content: '本來以為只是武打爽片，

  但看完後覺得出乎意料好看，

  簡短整理一下亮點。



  1.

  笑點很港式電影，

  但有玩出新花樣跟高級感，

  整場我會心一笑不少次。


  2.

  武打感受很新穎，

  終於不是看主角前面無敵超人耍帥，

  只有最後一戰才棋逢敵手，

  電影裡每次打鬥都是以命相搏，

  被打到鼻青臉腫甚至更慘。


  3.

  壞人全程智商在線，

  而且是合理的心狠手辣，

  不像很多犯罪電影(尤其是韓國)，

  壞人就是壞在心理變態而已。


  4.

  劇情其實蠻感人的，

  看男主角從職場的黑烏鴉，

  最後感化大家找回初心，

  一起為了正義奮鬥，

  很喜歡這種剛剛好的正能量劇情。


  你說很脫離現實嗎?

  其實也不，

  特別從事醫療業的人，

  應該特別有感觸。


  明明已經是老鳥，

  開始職業懈怠，

  對很多人間慘劇見怪不怪，

  但是在某些情境下，

  你還是會突然熱血上頭，

  覺得應該多替病人做一點事情。


  5.

  老演員發揮的都很好，

  就算戲份不多，

  但每次出場都讓人印象深刻。



  總之這部片很值得去看~



  --'
