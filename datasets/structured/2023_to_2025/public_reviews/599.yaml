title: '[新聞] 甄子丹找老友拍《誤判》高要求不留情'
content: "甄子丹找老友拍《誤判》高要求不留情\n\n04:10 2025/01/08 中國時報 李承陽\n\n\n甄子丹執導並領銜主演電影《誤判》，全片文戲武戲均有看頭。（華映提供）\n\
  \n甄子丹執導並領銜主演電影《誤判》，聯手金獎卡司許冠文、吳鎮宇、張智霖、鄭則仕，\n與香港新生代朱栢康、張天賦共同演出，片中許多資深港星的演出都帶給觀眾無限驚喜，\n\
  像是呂良偉、鄭浩南及劉江等老戲骨，但導演甄子丹對他們的演出要求極高，現場不給老\n友面子，直接要求他們演出要更精采。\n\n甄子丹當導演力邀好友一起來為電影增色，像是他多年好友呂良偉，二話不說沒有劇本也\n\
  不知道演什麼就答應到場客串，結果是要演出心狠手辣的大毒梟，把聲音弄得超級沙啞，\n講台詞時更顯殺氣騰騰；而鄭浩南也在片中扮演販毒大老闆，穿著潮牌賣毒品，殺人不眨\n\
  眼，同樣很搶戲。\n\n但現場拍攝時，甄子丹面對兩位好朋友仍是嚴格要求，一旦對他們的表現不滿意，就直接\n說明調整，「劇組找兩位經驗豐富的大演員來演出，就是想帶給觀眾大驚喜，雖然是來幫\n\
  忙的，但如果只是演得普普通通，那就沒有太大意義了，希望大家都可以有最佳表現。」\n沒有留給老友面子，讓鄭浩南苦笑說壓力很大；呂良偉則了解好友求好心切，兩人都全力\n\
  配合。\n\n#現場 #導演 #好友 #甄子丹 #呂良偉\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\
  \n\n\n--"
