url: https://www.ptt.cc/bbs/movie/M.1762410582.A.FEC.html
title: 好雷-誤判
content: '昨天無意間選電影看到的


  因為甄子丹的電影看多了 想說又是一個武打戲


  沒想到比預期的好看很多



  先說武打的部分 停車場追逐跑酷跳樓和車廂打鬥算是可以


  但讓我耳目一新的不是打戲



  是文戲裡面的 許冠文和甄子丹法院的攻防場景



  我從來沒想過法院攻防戰會以 檢方 律師 法官


  三方的角度出發如果角色出現立場轉移會出現的問題


  許冠文就很明確地指出這點


  一開場的孫子認罪 檢方一勝


  然後打二戰  孫子的二聘律師不夠力 孫子陷害者的律師幫忙打孫子


  本來勝利的檢方因為甄檢被迫下來二戰 要打臉自己


  甄檢還因為孫子的律師不夠力念了他一頓


  許冠文法官都說了甄檢你立場錯亂阿


  電影中傳達的一個情節很深刻


  檢方只做檢方該做的事情 能勝則勝  一開始還以為歐文三戰三勝吳鎮宇有鬼


  實際上就是沒有 吳鎮宇就是做久了煩了機械人化 有甚麼證據就怎麼判


  你知道我上午有幾場嗎 有36場要跑啊


  這樣的檢方不能說錯 但如同機械人一樣就是沒有了人味


  許冠文法官也是一樣的道理  明知道應該不對可以改 但因證據不足


  而又加之推翻自己的判決打臉自己是需要莫大的勇氣


  歐文律師的部分  假設扣掉沒有毒品沒有私心 如果再免費公益的角度


  搞不好也真的會這樣幹 反正你確實有做一部分嘛 認罪減刑也不是假話 你就認吧


  早點結束早點收工 反正公益沒錢的


  武打的部分算是畫龍點睛 但我覺得甄子丹年事已高 這些戲份也不是那麼重要了


  以上


  --'
