title: 'Re: [  雷] 小曉裡面的小小疑惑'
content: '原文吃光






  -----防雷-----








  老師就這麼大剌剌的參與學生家庭

  還直接住到家裡面去

  這件事情讓人非常出戲

  也不是說非得只有偷偷摸摸的樣態

  不管是公私立學校，學校老師做這樣的事情都很非典型

  而且還在家庭中出現教師的身分

  叫小曉去罰站那一趴


  然後施名帥的口條好尷尬

  「從你娘家帶來的  （卡一下）破鋼琴」



  喜歡故事

  喜歡母女倆的演技

  尤其是小曉，讓人有共感

  小朋友們的互動也都很不錯

  屁孩感自然展現

  -----

  Sent from JPTT on my iPhone


