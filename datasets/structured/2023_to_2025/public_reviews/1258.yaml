title: '[情報] 首部電影長片之路講座：《小曉》《小藍》'
content: '【系列講座】首部電影長片之路



  本次講座邀請到集編劇、導演於一身的《小曉》（Trouble Girl）靳家驊導演、《小藍》

  （Little Blue）李怡芳導演，暢談他們的創作首部電影長片的過程。



  從劇本創作到前製製作，分享他們的籌備過程和參與創投的經驗。在實際拍攝電影時，如

  何將文字轉化成影像，其中遇到哪些挑戰。電影上映和發行策劃又需要注意什麼重點?同

  時也分享參加國內外影展的心得，不同文化背景下觀眾的反饋。在完成首部長片的路上，

  獲得了哪些意料之外的收穫?又在哪些地方遇到出乎意料的困難?這些寶貴的經驗都將在講

  座上娓娓道來。



  講座時間：2024年6月16日（日）13:00-15:00、16:00-18:00

  講座地點：青島小教室（台北市中正區青島東路7號2樓之1）



