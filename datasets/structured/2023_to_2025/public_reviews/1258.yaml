url: https://www.ptt.cc/bbs/movie/M.1715502633.A.CE5.html
title: '[好雷] 小曉 時間線的問題 '
content: "好看 教育發人省思 影后實至名歸\n\n老師的教育技巧好棒\n\n亦是最大的苦主\n\n在母女吵架時他先在媽媽權威管教小曉\n\n再軟化安撫\n\
  \n在恐龍家長面前 稱讚對方女兒優秀 不用管教 家長馬上開心起來\n\n\n其中比較不懂的是聰明的女學生 突然翻臉的時間線 是小曉告密前 還是後\n\n比較合裡的是\
  \ 小曉還是比較喜歡父親 不希望跟他分離 所以告密學校在先\n\n然後保羅就被學校處置了 聰明喜歡保羅而假意接近小曉的女同學\n\n知曉保羅要離校後 就直接跟小曉翻臉了\
  \ 不過電影故意不演得很清楚\n\n讓觀眾自己去想像 亦或是根本不是小曉去告密 交了富商的妻子終究紙包不住火\n\n富商父親連望眼鏡都忘了買 小曉還這樣氣到把老師關起來\n\
  \n老師真是整部片最大苦主 在風雨交加的鳥籠中哭哭\n\n片中反派大概就是 心機綠茶婊聰明女同學 小曉哭哭\n\n片末小曉學會了彈琴 也會安慰媽媽\n\n成長的歷程中的甘苦\
  \ 感同身受。\n\n\n--\n      Dear  :\n           你要把人生看得透徹，一定要真實地面對人生，了解人生的本質，\n     \
  \      當你終於了解人生，你就能真正地熱愛生命，然後才會捨得放下。\n           記住我們在一起的這些年，永遠不要遺忘，\n         \
  \  永遠記得我們的愛，永誌不忘，生命中的時時刻刻:\n\n\n--"
