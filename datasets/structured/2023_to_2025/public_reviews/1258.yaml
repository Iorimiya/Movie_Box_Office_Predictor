url: https://www.ptt.cc/bbs/movie/M.1715765471.A.3BE.html
title: '[好雷]小曉：家長該如何做才是最好的？'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  最近hami上架又重看了一次《小曉》

  電影中小曉是一名患有過動症的女孩

  上課時會玩遊戲機，而且音量會調到最大聲

  但老師跟同學都視若無睹，沒有多加約束她的行為

  有時候還會做出看似煩躁的小舉動

  比方說，用頭一直撞車窗玻璃、狂按電梯按鈕

  有時候也會惹來同學的言語欺負和肢體衝突

  看到這段劇情，真的會覺得心疼…

  而被飼養在學校鳥籠裡的貓頭鷹Kitty

  就好像是小曉被困在牢籠裡的象徵

  想飛卻出不去，當有機會逃離時又選擇待在原地


  媽媽（薇芳）也辭去工作全心照顧著她

  但長久以來父母之間的感情問題

  導致小曉其實也是很缺愛，也很需要媽媽的注意力

  不禁會思考薇芳希望她讀普通班，怕被貼上特殊標籤

  對小曉來說真的是最好的嗎？

  如果換個能讓她自由但也有被適當約束的環境

  會不會對她更好一些呢？


  --'
