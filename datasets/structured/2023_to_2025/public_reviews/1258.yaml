url: https://www.ptt.cc/bbs/movie/M.1702381665.A.078.html
title: '[好雷] 小曉'
content: '週日抽空去看了小曉本來還要看老狐狸的


  而且秀泰那一場老狐狸


  片後有影評人到場一起討論


  但是同時間要看台日冠軍賽


  就只好回家了


  然後看到了大巨蛋悲劇




  --------‘‘‘‘‘‘‘‘‘‘‘####雷###’’’’’’’’’’’‐-‐-


  閒話莫提我認為小曉中要說的人人都跟kitty一樣是籠中鳥


  小曉困在自己的疾病中 困在母親與老師的外遇不倫中


  母親困在教養小曉的壓力中

  也困在與丈夫名存實亡的婚姻中


  老師困在對母親的感情中 然後愛烏及烏的對小曉溺愛


  爸爸不願困在媽媽跟小曉之間

  所以選擇在國外逃避


  心機同學困在偷偷喜歡老師的情愫中 所以願意扮演好人接近小曉


  最終 爸爸再度逃離 同學知道老師要離開了也回到真面目

  老師終於知道自己只是媽媽寂寞的替代品 最終決心脫離這個牢籠


  最終媽媽跟小曉深深擁抱相互取暖 她們彼此是彼此的牢籠

  無法脫逃


  小曉當然演得很好 在童真跟發病的機車之中來來回回

  鎮的很會演 也夠機車


  故事很精彩有瀑布的fu

  只是一個解脫 一個更加沉淪其中

  我覺得比富都更好


  但這樣都無法拿最佳影片提名

  我很期待石門上映


  也想看五月雪


  --'
