title: '[好雷] 小曉  雨是天空壓抑不止的淚水 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  相較老人長照議題

  小孩的過動症等罕見疾病似乎在一般電影比較少被觸及到

  片中的小曉雖然有較大的過動症狀(情緒衝動、無法控制、無秩序感)

  但其實很多小孩也常有情緒和失控行為

  只是每個人的外顯症狀不一

  而大人也是，就像小曉的媽媽鎮日和她綁在一起

  生活完全得不到喘息，極端壓抑也無從解脫


  直到遇到老師保羅


  只是老師和家長的互動過程實在太過招搖不合常理

  老師毫不避諱進出學生家門、和家長單獨看電影、又和學生家長去游泳和露營

  到處進出公共場合，不是都很容易被發現和傳耳語嗎？

  前面無懼旁人眼光

  等到東窗事發老師又氣急敗壞

  如果互動過程能帶入一些遮掩的橋段看起來會比較合理


  而看到最難過的地方是

  好不容易有認為可以當好朋友的曉珊

  原來自始至終都不是自己所想的樣子

  那種說不出的難過和委屈

  就像被世界遺棄

  最終只能和媽媽相偎依


  --

  在看小曉時

  總會不自覺想到2019年的熱帶雨

  故事背景同樣圍繞著學校及家庭間的師生關係

  同樣雨下不停的季節，增添人和人之間的孤寂

  在熱帶雨演媽媽的楊雁雁也獲得金馬女主角獎

  只能說照顧者的箇中心酸誰人知


  --'
