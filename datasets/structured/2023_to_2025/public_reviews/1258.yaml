url: https://www.ptt.cc/bbs/movie/M.1702142024.A.F14.html
title: '[雷] 小曉'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~









  劇情蠻簡單的

  比較著重在人物關係與情感的描寫


  女兒跟媽媽的角色演得很棒

  尤其是陳意涵

  對她的印象還停留在青春電影的傻白甜裡

  沒想到詮釋這種矛盾複雜的角色也發揮得那麼好


  雖然小孩確實很辛苦

  但我覺得媽媽更是不容易

  因為伴侶的不負責

  導致很多事情只能自己來

  沒有人能夠幫忙

  沒有休息空間喘息

  女兒又是比較特別的小孩

  只有兩人的家庭

  少了一個中間人協調

  讓關係感覺很緊繃


  小孩需要人照顧

  但媽媽其實也是需要被關懷的啊

  長久以往她連自己都自顧不暇 也就很難以好的狀態去照顧孩子


  尤其是洗澡那邊

  覺得她看起來好累

  但又繃著想要靠近她女兒

  可是女兒卻一直推開她

  感覺還蠻讓人難過的


  而女兒也看得出來好像有點愧疚

  但又不知道要用什麼方式去跟媽媽好好相處


  有一個我蠻喜歡的橋段是

  女兒問同學

  如果媽媽做了不能做的事情怎麼辦

  同學說是不是外遇了 如果是的話就跟那男的說媽媽很會花錢 男人很怕這種女人

  結果女兒下次卻很刻意的跟對方說媽媽其實很節儉 笑死XD


  在這個年紀遇到這樣的事情 內心肯定是很衝擊複雜的

  她自己從媽媽的口中與爸爸的行為肯定也能看出來爸爸的不負責

  以及這個不負責帶給媽媽的不快樂與辛勞

  她心裡沒有像媽媽這樣埋怨爸爸嗎 我覺得不可能沒有

  但是自己跟媽媽的關係緊繃 跟爸爸的相處其實是相對輕鬆一點的

  比起媽媽她可能有時候更想要靠近爸爸

  但這樣靠近的機會又很少

  某一天出現了另一個人插足他們的家庭

  孩子當然知道這是不對的事情

  可是對方又確實對自己不錯 更重要的是這個人可以讓媽媽開心


  從來也沒有大人問她 她對於這個第三者的想法

  或許是認為小孩不懂吧 也可能是害怕聽到刺痛自己的話語

  但這樣的行為可能都會讓孩子有一種被排外的感覺


  就像是女兒的校園生活一樣

  她不喜歡老師在背地裡以善意為出發點給她的特權

  但又不知道怎麼表達也沒有人教她要怎麼用更好的方式應對 於是用了相對傷人粗暴的方式

  處理


  另外一個印象比較深刻的是

  帶孩子去親師座談會那邊

  看起來的確對女兒很衝擊

  但印象裡也是片中女兒第一次低頭道歉

  雖然媽媽對這個道歉的反應很不妥就是了


  整體氛圍有點壓抑

  不過演員的演技跟題材還有台詞我覺得都蠻不錯的

  另外鄭志偉演的工友很可愛


  --'
