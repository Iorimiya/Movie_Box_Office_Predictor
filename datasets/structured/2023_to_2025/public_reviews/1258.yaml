url: https://www.ptt.cc/bbs/movie/M.1764858413.A.646.html
title: '[好雷] 《小曉》- 花開花落，於心不忍 '
content: 'Netflix最近上架

  入圍多項金馬


  描述一位ADHD(注意力不足過動症) 小孩的故事

  有獲得最佳女主角獎






  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  想像電影佈置著一個簡單又完整，具備家庭、學校與延伸至社會架構下被認為的「錯誤」

  。或說在質問著，所謂人工建構的樣貌，是否適用於「全部的人」（自然）；於是也質問

  著天生為惡的人是否為惡的問題。



  電影劇情裡那些二分的善惡，或嘲諷之力，或伊底帕斯式的弒母戀父等等女孩成長與母親

  與老師外遇和小曉之間的曖昧關係；或說三者一絲絲如動物般無階級的烏托邦時刻，卻總

  是點到為止，節制地描述，幽微的劇本安排。與不至於太過於樣板、單向的，把主角班上

  的其他同學，視為社會上大部分汲汲營營的人「之前的」樣貌。



  於是也搞不清楚是單純還是世故，一如自己內心little man總是把事情想得更複雜一點。

  電影中已經習慣了小曉發病的同學，乾脆就順勢得加入霸凌/玩樂分不太清楚的行列，提

  早揭示著人生就如同一場鬧劇般的，在學校預先演習著；一如過去當兵被說提早進入社會

  的，職場戰爭的排練。



  「大不了離職不幹了！」類似的話猶言在耳，即使如此電影也看得太過於膽戰心驚，小曉

  ADHD不定時炸彈，花開花落，於心不忍，還是看看金馬60小曉榮獲最佳女主角的頒獎影片

  比較開心。



  12歲的影后，想法多成熟啊，中途轉台金馬62女配角頒獎，《美國女孩》三位母女擔任頒

  獎人彷彿影后製造機，那個林品彤致詞對小曉說著「保持善良」與姊姊《大濛》的阿月樸

  實清澈的眼神，提醒著我們單純一直都在身邊，就在那裡。可是，…可是「人的世界，最

  麻煩了。」



  (註) 金馬60女主角獎頒獎影片



  --


  拉特飯 - 以商業力量進入獨立市場


  --'
