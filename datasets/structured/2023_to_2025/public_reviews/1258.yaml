title: '[討論] 鄉民會去看小曉嗎？'
content: '看旺卡的時候看到小曉的預告片


  光是看到這些片段，


  就已經可以確定飾演小曉的女演員林品彤


  已經達到了「演員的自我修養」裡面提到的體驗藝術


  也就是從內心接受了這樣的角色


  而不是像匠藝式的演員，


  用誇張的或是刻板印象的肢體動作來詮釋這個角色。


  但個人可能不會去看這部電影，


  如果是用紀錄片的方式記錄身心障礙者的電影可能還好，


  但是這部終究是一個創作，


  一定會有戲劇張力式的方式呈現身心障礙者的困境或是家屬的辛苦，


  這樣看起來太痛苦了。


  鄉民會去看小曉嗎？


  --'
