url: https://www.ptt.cc/bbs/movie/M.1701962640.A.830.html
title: '[新聞] 《小曉》《年少》同檔上映 林品彤對決黃梓樂'
content: "《小曉》《年少》同檔上映 林品彤對決黃梓樂\n\n04:10 2023/12/07 中國時報 李承陽\n\n\n12歲林品彤在電影《小曉》裡表現精采，一舉奪下金馬影后。（CATCHPLAY提供）\n\
  \n\n11歲黃梓樂主演《年少日記》入圍金馬獎最佳男配角獎。（光年映畫提供）\n\n12歲林品彤打破金馬影史紀錄，主演電影《小曉》成為新科金馬影后，電影8日上映，與\n\
  另1部奪下金馬獎最佳新導演的香港電影《年少日記》同檔對決，《年少日記》由「香港\n最強童星」黃梓樂主演，不僅上演天才小演員的演技比拚，兩部片也都深刻探討家庭議題\n\
  ，各有口碑及看點。\n\n《小曉》5日電影首映會，片中飾演母女的陳意涵跟林品彤均出席，陳意涵分享：「希望\n藉由《小曉》能提醒大家想想自己忘記思考的事、忘記關心的人。」林品彤第2次演電影\n\
  就奪下金馬影后，在片中飾演過動症兒童，她成熟的與觀眾對話說：「這個世界很需要同\n理心，希望大家都能很善良地對待每個人。」有不少觀眾看完電影後直呼：「終於知道為\n\
  什麼她拿影后了！」\n\n而上月初甫過11歲生日的黃梓樂也不惶多讓，他在《年少日記》與鄭中基狂飆對手戲。片\n中鄭中基飾演個性躁狂、不近人情的嚴父，甚至會對家人家暴，他透露拍攝時心情沉重，\n\
  每拍完1場戲都會有罪惡感，不斷跟黃梓樂道歉，拍攝期間還曾經有「辭演」的念頭出現\n，反倒是黃梓樂小小年紀很明白事理，知道是在拍戲就請鄭中基盡情打罵。\n\n#黃梓\
