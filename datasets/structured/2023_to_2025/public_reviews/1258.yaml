url: https://www.ptt.cc/bbs/movie/M.1668666312.A.7A3.html
title: '[新聞] 煞塵爆 小曉 CATCHPLAY 項目發表會新作'
content: '新聞網址：



  由 CATCHPLAY 與旗下影響原創及 CATCHPLAY+ 影音平台共同舉辦的2023項目發表會，於8

  日盛大舉行，連同原創自製、開發投資與代理發行等影集與電影，共10個新項目曝光， C

  ATCHPLAY 執行長楊麗貞表示：「透過合作，CATCHPLAY 與文策院共同投資的影響原創，

  在成立兩年內即推出了許多亮眼的影視作品，包括劇集《俗女養成記 2》、迷你劇集《良

  辰吉時》及首部OTT綜藝節目《熙娣想聊》等，我們感謝

  ；2023年我們將更努力在地耕耘並積極向外擴展

  ，希望繼續透過合作，交出讓投資者、創作者和觀眾皆贏的優秀作品，並跟隨OTT平台的

  擴展，跨出東南亞自製劇的第一步。」


  邵雨薇為《惡女》實習當新聞主播


  在8日公布的10個項目中，包括了，為曾經以

  ，發表會並公布了女主角由邵雨

  薇擔任演出。導演宋欣穎透露：「我想要做一個完全不一樣的題材，走黑暗心理驚悚，剛

  好當時在關注平成戰後第一位女性死刑犯的故事，加上從小就喜歡看社會新聞，因此開始

  醞釀腳本。看過劇本的人都說很有娛樂效果，我希望能帶給人們娛樂，同時關心人性的複

  雜多面。」而首次演出新聞主播的邵雨薇亦大爆：「看劇本就感受到每個角色都有秘密，

  過程很吸引人。這次為了飾演新聞主播，有去跟主播實習採訪、播音，其實這部片讓我非

  常緊張，因為它真的很厲害，非常吃演員表演，所以真的要很認真加油。」讓觀眾格外期

  待；另一個令人期待的電影項目是

  ，則由與劉大武共同擔任監製，究竟這是一部什麼樣的電影，廖

  慶松說：「這個題材蠻特殊的，我喜歡它談青春少年登大人的過程，是一個很濃的愛情，

  同時又探討男女關係和社會議題，希望是一個老少咸宜的故事。」


  《我最愛的笨男人》《煞塵爆》《小曉》2023即將登場


  另外，CATCHPLAY 即將發行的電影項目還包含描述

  ，由孫啟明擔任監製，范逸臣、姚淳耀、郭泓志、劉奕兒與林美秀

  共同主演，將於2023年發行。發表會上監製孫啟明與兩位男主角范逸臣、姚淳耀亦到場支

  持，監製說：「這部電影從角色到故事都非常不典型，男主角不酷不帥，有點賴皮。女主

  角也不是清純，她簡直就是騙子，而反派也不是一個壞人。我覺得這是一部帶有動漫感的

  黑色愛情動作片。」范逸臣說：「這次演出覺得很盡興，各種耍笨、耍賤、耍無賴、打人

  被打又殺人，表演又放又收，殺青之後反而感到空虛。所以我也很期待成品。」，姚淳耀

  則說：「拍攝過程有很多火花是劇本沒看到的，跟逸臣合作時覺得他的眼神很真誠，讓人

  入戲，有時光是看著他就想哭。跟郭泓志演戲時覺得他身為投手第一次演戲，完全沒有害

  怕，要給就給出百分百。」


  而另一部即將在2023年盛大發行的電影，則是獲得

  ，監製李耀華說：「這個案子

  是好幾年前的優良劇本，編劇是護理人員，無論是醫護人員的心境或手術場景的描述都很

  真實。困難點是這是SARS真人實事，但我們又不想拍成紀實電影，而是希望大家看完有不

  一樣的感動，，光是初剪就讓人感動落淚，卡司及上映消息敬請期待。」榮

  獲優良電影劇本、長片輔導金及入圍金馬創投，由

  ，亦將於2023年由 CATCHPLAY 感動發行，監

  製葉如芬說：「我覺得這幾年台灣影視公司若都是單打獨鬥，真的會比較吃力，所以需要

  團結合作。我覺得影視圈我們都在同一條船上，都要航向大海，即使大海波濤洶湧，大家

  因為合作團結就會很堅固，也無所畏懼。《小曉》這部電影很感謝有CATCHPLAY和影響原

  創的合作，明年請拭目以待。」

  —————————————————————————

  這應該是第一個台灣OTT平台拍電影吧？

  而且沒想到我們與惡距離的導演最新電影，已經默默拍完在剪輯了！？




  --'
