title: '[無雷] 小曉'
content: '有別於近期幾部上映的華語片，

  或多或少都能在結尾留下救贖/希望，

  讓觀眾就算難過也能帶著一點滿足離場，

  《小曉》的劇情走向，

  則更像去年金馬最佳劇情片得主。


  林品彤/陳意涵的演技120%的支撐這部片，

  劇本個人非常喜歡，但也很挑戰觀眾，

  真實殘忍到另人窒息，

  每個角色都活在自己真實的欲望裡面，

  不為美好的電影結局服務。


  導演應該也很喜歡《美國女孩》。



  --'
