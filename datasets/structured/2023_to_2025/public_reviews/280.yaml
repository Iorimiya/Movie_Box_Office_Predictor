url: https://www.ptt.cc/bbs/movie/M.1748931972.A.0AF.html
title: '[新聞] 港人抗共片《寧化飛灰》台灣首映 觀眾震撼'
content: "港人抗共片《寧化飛灰》台灣首映 觀眾震撼\n\n2025年6月1日，香港電影紀錄片《寧化飛灰》首次在台灣播放，導演劉健倫（前排右二）\n和現場觀眾合影。（宋碧龍／大紀元）\n\
  \n【大紀元2025年06月02日訊】（大紀元記者鍾元採訪報導）香港紀錄片《寧化飛灰》6月1\n日舉辦台灣首映會，曾在香港從事電影及紀錄片拍攝超過18年的導演劉健倫來台，出席映\n\
  後座談會。觀眾表示，「很震撼！」「希望台灣人警惕中共的暴力和謊言，守護台灣自由\n民主。」\n\n《寧化飛灰》（Rather Be Ashes Than Dust）的片名起源自美國作家傑克‧倫敦（Jack\n\
  London）的詩句「寧化飛灰，不作浮塵。」即寧投熊熊烈火，光盡而滅；不伴寂寂朽木，\n默然同腐。寧為耀目流星，迸發萬丈光芒；不羨永恆星體，悠悠沉睡終古……\n\
  \n前港督彭定康在1996年發表的《施政報告》的結尾也引用過此句。該片以2019年香港反送\n中運動為背景，講述一名獨立記者／電影製片人劉健倫親眼目睹警察對抗議者的嚴重暴力\n\
  行為等在香港發生的歷史。\n\n《寧化飛灰》在台北真善美劇院首映會電影結束時，全場掌聲雷動，有多位觀眾大聲喊香\n港反送中口號：「光復香港，時代革命」。流亡英國導演劉健倫致詞時，首先感謝大家，\n\
  「我很久沒有感受到那麼親切，也已經很久沒有聽過『光復香港，時代革命』口號。」\n\n\n導演劉健倫現場致詞。（宋碧龍／大紀元）\n\n導演劉健倫實現夢想\n\n\
  《寧化飛灰》已在韓國、英國、紐西蘭、澳洲、挪威、丹麥、加拿大多倫多及溫哥華、美\n國三藩市及紐約、德國柏林及法國巴黎放映。劉健倫說，2023年《寧化飛灰》製作完成，\n\
  第一場放映會是在韓國釜山電影節。當時他跟一些採訪記者說，「我的夢想就是在台灣可\n以放映這部電影，今天終於完成了夢想。」《寧化飛灰》亞洲放映會，首站在台灣，第二\n\
  站將在日本放映。\n\n\n\n香港電影紀錄片《寧化飛灰》的劇照。（導演劉健倫提供）\n\n劉健倫說，這部電影他用了3年時間拍攝，然後2年時間去剪輯，歷經5年製作完成。雖然\n\
  距離2019年已經6年，他對經歷過的每一個畫面都記得很清楚。他在製作《寧化飛灰》電\n影的時候，自己也經歷過很多感情上的問題，「可能香港人都有一些創傷後壓力症候群（\n\
  PTSD），我也有。但歷史不應被遺忘，這部片子獻給所有在香港前線的朋友。」\n\n\n\n香港電影紀錄片《寧化飛灰》的劇照。（導演劉健倫提供）\n\n「我拍攝這部電影製作過程相當艱辛，從一千多小時素材中，濃縮剪輯出114分鐘成品，\n\
  對我來說是一個巨大的挑戰。」他在剪輯的過程中，常常感到情緒困擾，有時候一天剪輯\n不到一分鐘，彷彿回到現場再經歷一次過程，就做不下去，並且由於缺乏資金，所有工作\n\
  都是自己完成。」他說。\n\n劉健倫分享，《寧化飛灰》選用英文旁白，是因為香港人、台灣人都知道香港發生的事情\n。但他流亡英國了解英國人從新聞看到的都是一些很片面的資訊，「在我放映《寧化飛灰\n\
  》給鄰居英國人看後，他們才了解香港人所經歷的事情，其實《寧化飛灰》電影是給外國\n人看的。」\n\n\n\n香港電影紀錄片《寧化飛灰》的劇照。（導演劉健倫提供）\n\
  \n劉健倫對大紀元表示，《寧化飛灰》已經獲得BIFF（釡山國際電影節），國際紀錄片影展\n最佳紀錄片（Doc Edge Category awards, Democracy\
  \ of the Edge），以及在紐西蘭獲\n得邊緣民主最佳電影獎（The Best Film of the Democracy on Edge），還有在義大利拿\n\
  坡里人權電影節獲得了兩項特別獎。\n\n以香港為鑑 專家呼籲認清中共暴力和謊言本質\n\n主辦方在台港人赴湯表示，曾參與香港反送中的很多港人都有PTSD，大家要堅強地去面對\n\
  不要怕、戰勝它，用更好的生命去互相幫助彼此。來到台灣的香港人要努力去適應投入公\n民社會，以前香港在對抗極權的第一線，現在是台灣，所以在台港人也會支持守護台灣的\n\
  自由民主。\n\n\n\n\n香港電影紀錄片《寧化飛灰》的劇照。（導演劉健倫提供）\n\n觀眾蔡先生對大紀元表示，看了電影感受「很震撼！」除了警察跟黑道衝進地鐵站打人，\n\
  到最後直接朝人開槍的畫面之外，「最讓我震撼的警察衝出來打人時，年輕人站出來掩護\n抗爭者離開，同時他們空檔時也在整理自己環境的文明舉動。」\n\n蔡先生表示，香港當時有200萬港人勇敢走上街頭抗爭，也希望更多台灣人站出來維護自\n\
  由和生活方式，避免自身將來也面臨流亡問題。台灣人無論是透過選票還是其它方式，應\n該更多人站出來參與行動，如果台灣不表現出捍衛自由民主的抵抗意志，將無法期待他人\n\
  來幫助自己。\n\n台灣香港協會理事長桑普律師說，《寧化飛灰》跨度非常長，從1997年到實施國安法以後\n的香港，看了電影衝擊非常大，港人對抗共的勇氣讓人很感動，尤其是六四36周年及香港\n\
  反送中六週年到了，更讓人反思中共對人民的暴力與謊言，他警告台灣人不要相信中共的\n承諾，應該守護自由民主，並避免成為下一個香港。\n\n桑普表示，香港人的勇氣和毅力不會是一時的，應該會持續去對抗中共的暴政，只要滿懷\n\
  希望和信念，等待時機，一定會開出良好的果實，也希望全世界的人都關注香港。「我們\n要耕耘台灣，避免中共魔爪深入台灣。台灣人應該警惕中共的威脅，保持團結以守護台灣\n\
  自由民主。」\n\n\n\n香港電影紀錄片《寧化飛灰》的劇照。（導演劉健倫提供）\n\n港人海外延續抗爭精神 呼籲台灣人團結抵抗中共\n\n赴湯對大紀元分析，香港的情況可能會在台灣重演，港人以前就被滲透分裂成反共的黃絲\n\
  、親共的藍絲兩派內鬥，港共就很容易對香港人打壓。現在中共除了武力恐嚇台灣之外，\n更滲透台灣製造藍、白、綠陣營分裂，所以不分黨派都應該愛台灣團結起來，就是抵抗中\n\
  共很重要力量。\n\n有在台港人看完紀錄片說，「我不希望香港第一個家，被敵人（中共）破壞，第二個台灣\n的家，又要被同一個敵人用同一方法破壞。台灣跟香港完全不一樣，（中華民國）台灣是\n\
  完全享有民主的獨立國家，我們還有力量去救我們愛的國家。所以要把香港的故事，告訴\n身邊所有的台灣朋友」。\n\n也有在台港生分享在台研究政治暴力創傷對人的影響，她指出，目前在台灣尚無機構專門\n\
  處理此問題。她鼓勵港人勇敢面對自己的過去，這本身就是一種抵抗，呼籲大家在未來的\n日子裡要好好照顧自己和彼此。\n\n\n\n香港電影紀錄片《寧化飛灰》的劇照。（導演劉健倫提供）\n\
  \n人權工作者李明哲表示，他曾遭中共關押5年，中共連自己制定的法律都不遵守，就不會\n遵守任何跟國際的協議，也不會尊重跟香港的一國兩制，所以中共政權是不可信任的，《\n\
  寧化飛灰》提醒台灣人不能相信中共的任何承諾。\n\n\n\n香港電影紀錄片《寧化飛灰》的劇照。（導演劉健倫提供）\n\n李明哲說，香港直接面臨中共的統治，他們都還有很多人用不同的方法，在保存香港人的\n\
  記憶跟抗爭的精神，所以香港人還持續在捍衛自己的民主自由，「而台灣的主權在我們自\n己手上，更不能放棄台灣的民主自由，去跟中共這樣不可信任的政權做妥協」。\n\n\
  牧師陳曉煒表示，在2019年反送中的時候，他和家人都有關注，並參加支持香港人的遊行\n活動。他感動在台香港人，拿到（中華民國）身份證成為台灣人後，將台灣視為香港人的\n\
  第二個家，支持大罷免連署捍衛台灣的民主。\n\nRather Be Ashes Than Dust\n\n\n責任編輯：林妍#\n\n\n\n--\n    \
  \             \n   \n\n\n\n--"
