title: '[情報] 《寧化飛灰》7/5 高雄市電影館放映'
content: '《寧化飛灰》是一部來自香港的紀錄片。

  片名取自「寧化飛灰，不作浮塵」，記錄香港反送中背景下的真實故事。

  風格偏向冷靜敘述，不走煽情路線，主打紀實與人物內心刻劃。


  之前在台北放映時有不錯的觀後回饋，這次會在高雄市電影館放映。


  播映時間：2024/7/5(六)  16:30

  地點：高雄市電影館

  電影簡介與放映資訊：

  

  對紀錄片或社會議題有興趣的朋友可以參考。


