title: '[新聞] 奧斯卡入圍》台片《金門》報佳音！創紀錄'
content: '鍾志均


  奧斯卡入圍》台片《金門》報佳音！創紀錄片首入圍記錄


  第96屆奧斯卡金像獎今（23）晚揭曉入圍名單，CNEX出品與製作的《金門》強勢入圍最佳

  紀錄短片，是台灣紀錄片首次入圍奧斯卡獎項，將在國際影壇發光發熱。


  《金門》導演江松長表示，「三個月前我們剛完成這部影片時，完全無法想像會收到這麼

  多影人的熱烈正面回應，以及全球觀眾透過紐約時報Op-Docs平台，帶來的數十萬次觀看

  數。」欣慰《金門》能使全世界對台灣有更深入了解。


  在《金門》中，導演江松長以細膩視角融合當地生活的點滴，反思對台灣、中國和美國之

  間矛盾情感，影片英文片名為ISLAND IN BETWEEN，也有同時隱喻「金門」與「台灣」的

  含意。


  江松長在台灣出生，美國長大，之所以製作《金門》，他希望透過生活其中的人們，深入

  探討兩岸及國際關係，並做出有意義的貢獻，「特別是在全球正努力理解與彌合烏俄戰爭

  、以色列和哈馬斯的對戰狀態時，期望我的影片能在倡導和平方面發揮一點作用。」


  第96屆奧斯卡金像獎預計於台灣時間3月11日舉行頒獎典禮。

  -----------------------------------------------------



  《金門》線上看







  --'
