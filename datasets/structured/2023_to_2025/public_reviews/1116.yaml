url: https://www.ptt.cc/bbs/movie/M.1754721406.A.397.html
title: '[新聞] 金門首映《鬼滅之刃》業績暴增5成 福建'
content: '金門首映《鬼滅之刃》業績暴增5成 福建粉絲小三通跨海搶先看


  ETTODAY


  2025年08月09日 13:55






  ▲福建鬼滅迷跨海到金門看電影。（圖／記者林名揚翻攝)


  記者林名揚、郭玗潔／金門報導　


  日本最新動漫《劇場版「鬼滅之刃」無限城篇 第一章：猗窩座再襲》(8)日在台上映，鬼

  滅迷們迫不及待擠爆各大影城先睹為快、搶購周邊商品；不過由於大陸地區尚未上映，大

  批福建動漫迷特別經小三通搭船跨海至金門的電影院搶先看，也讓平時人潮不多的金獅影

  城大廳瞬間熱鬧起來，首映單日業績成長逾5成。


  來自廈門的李姓動漫迷說，自己一直很喜歡鬼滅之刃這部動漫，只要能得看、買得到的電

  影、周邊商品，一定買單。但廈門地區上映檔期未定，才會搶在僅一水之隔的金門首映當

  日，跟朋友一起過來先睹為快。




  金獅影城經理李湘琳表示，金門地區看電影人潮不如台灣本島熱絡，平時看電影買票除幾

  部漫威大作以外，幾乎都不用排隊；而該影城自2014年開幕以來，除首部播映的電影《蜘

  蛛人 電光之戰》有過預購熱潮以外，就是這部《鬼滅之刃 無限城篇》再度掀起預購熱，

  昨天首映單日業績成長逾5成，也讓現場工作人員忙翻天。


  李湘琳強調，金獅影城引進最新的4D影音設備，配合舒適豪華的座椅，最大廳別可容納

  466人，歡迎兩岸三地往返的旅客一起來體驗不一樣的影音視聽。




  --'
