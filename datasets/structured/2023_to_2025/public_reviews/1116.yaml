title: '[分享]免費紀錄片放映：金門留念'
content: '10.19 《金門留念 Remember Me》電影座談

  免費報名：



  「在這裡，從蔣介石到習近平都是配角，戰地前線老相館牆上，那一幀幀泛黃的照片上中，

  每一張青春的臉，才是這齣歷史劇的主演。青天白日滿地紅，青春沒有百日紅，戰事已歇，

  青春亦遠，唯有金門故事，堪可留念。」


  「金門留念」源自義務役軍裝照的題詞傳統，影片以相館老闆、本島軍官與四川媳婦三位人

  物為主角，透過他們的生命故事，折射出戰爭、歷史與國族認同的多重面向。此片由洪淳修

  導演執導，並獲選為2022年台灣國際紀錄片影展開幕片。


  本場映後將邀請導演洪淳修與談，與觀眾分享拍攝緣起與創作心路，一同思索戰爭、國族與

  認同的意義。


  時間   10.19 (日) 14:30-17:00

  地點   文化資產園區願景館2樓國際演講廳 台中市南區復興路三段362號R04

  與談   洪淳修 / 本片導演

  主持   陳燕琪 / 中學教師





  --'
