title: '[新聞] 中國人衝金門搶先看《鬼滅之刃》 網酸：'
content: '中國人衝金門搶先看《鬼滅之刃》 網酸：不是看《南京照相館》反日嗎


  2025/08/11 15:59

  莊文仁／核稿編輯


  〔即時新聞／綜合報導〕日本超人氣動畫《劇場版「鬼滅之刃」無限城篇第一章：猗窩座

  再襲》8日在台上映，由於中國尚未排定檔期，不少中國動漫迷選擇搭乘小三通船班赴金

  門觀影，讓金獅影城首映日業績成長逾5成。不過，此事也在網路掀起熱議。


  一名網友在「Threads」 發文表示，「今天你在金門看到的，只是破口的起點。明天，當

  台灣本島的演唱會、藝文活動被中國人塞爆、票搶光，別再哭喊『怎麼會這樣』。726主

  流民意選擇了藍白，那就準備迎接『大量開放中國人來台』的後果吧」。


  貼文瞬間掀起廣大迴響，其他人更留言回應，「鬼還真的從中國源源不斷地來」、「被統

  一就跟中國同步啦，不會搶票賣光啥的，因為根本不會上映」、「不是看南京照相館反日

  本人嗎」、「香港的資源就是被這樣蠶食鯨吞掉的……」、「這是追星族的惡夢，中國人

  的平均素質令人搖頭」。


  還有自稱是金門人的網友現身說法，「觀影體驗變超垃圾，聽到鬼子敏感詞就大笑，不遵

  守戲院品德，還頻繁盜錄」。




  --

  英國老人在海關翻找護照，動作很慢找了很久，女海關尖酸的問：你來過法國？

  英國老頭說：我只來過一次。女海關更尖酸的問：你來過怎麼不知道提前拿護照？

  老頭：我上次來時沒檢查護照。

  女海關高聲叫道：不可能！英國佬來法國我們永遠都要檢查護照！

  老頭：44年登陸時候，海灘上可一個法國人沒見著...

  旁邊德國老頭說：是的，這個我能證明，當時灘頭確實一個法國人都沒有...


  --'
