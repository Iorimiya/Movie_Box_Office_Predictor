title: '[好雷] 《安諾瑪麗莎》─ 我是誰？我們又是誰？'
content: '《安諾瑪麗莎》Anomalisa

  ★★★★✩

  ----------------------------------------------------

  Directors: Duke Johnson, Charlie Kaufman

  Writers: Charlie Kaufman

  Stars: David Thewlis, Jennifer Jason Leigh, Tom Noonan

  ----------------------------------------------------

  《安諾瑪麗莎》─ 我是誰？我們又是誰？

  　

  【Anomaly：意旨不規則、異常；反常的事物】

  　

  「活著和痛苦為了什麼，我不知道」

  　

  當耳朵滿雜眾多聲音，而這些聲音卻都只剩同一種頻率，一樣的音色顯得更百般無賴，日

  復一日的例行公事，縱使出了一本著名的書籍，飛往各個城市講述演講，就算有了錢財也

  換不上臉上真實的笑容，所謂服務行銷的顧客親切度，外表的微笑都只是假裝，內裏的焦

  慮驚慌才是無法揮散而去，也逃不出自卑失敗的人生，正如走出機場播放著Lakme《the

  flower duet》，雖然由Dame Jone Sutherland演唱，但耳中仍是圍繞他許久的平淡嗓音

  。

  Dame Jone Sutherland lakme the flower duet


  ----------------------------------------------------

  「有時候並學不到什麼，因為人生本身就是一堂課」

  　

  1995年的Cincinnati，過了10年再度回到此地，有舊愛有新歡的美妙邂逅，彌補當年的一

  走了之，得到的是與這世界不同的聲音，不只有歡愉也找到靈魂的歸屬，雖看似一場一夜

  情，在天亮之後也活在外遇的罪惡，但短暫激情和長久之路的對比卻也看似諷刺，就算他

  是人人受寵的著名作家，但卻依然活在恐懼之中，害怕被欺騙害怕被背叛，也害怕心中那

  一株新芽，最終也將被社會同化成同一種男聲，對話交雜索堆疊出的精神崩潰、神經緊張

  ，面對人生的迷惑不解，人生就是一堂課，就算勞累奔波，也只換來徒勞無功，

  ----------------------------------------------------

  「我是誰？我們又是誰？」

  　

  當聽著日本人偶唱出Momotarō，一首民俗歌謠唱出另一種童趣，是與這段平庸生活截然

  不同的聲音，有過一晚的歡愉滿足，但幸福是場幻夢，回到正軌後，似乎日本人偶成了另

  一種借喻，讓這不同的聲音成為另一種可保存的希望，我們是誰？對於有著中年危機過著

  一成不變的生活，有時我們總想著人為何存在？難道就只是過著機械式的生活，一旦失去

  了新鮮感，當初的美好就瞬間幻化成為包袱，但就算突破自己，跨越不道德的婚姻界線，

  卻也讓自己成為了社會的汙角，面對外在的假貌，人的客氣恭敬看來都只是帶著同一張面

  具，也正如電影之中，每個人都有一樣一張臉，有著一樣的聲音，同樣的雙眼緊盯著他，

  一切沒有改變，直到那位女神出現，它是一場希望，但希望之後，我們又是誰？

  ----------------------------------------------------

  「我的臉沉浸在悲傷中，但淚水卻流不出來，我需要讓眼淚告訴我這是個噩夢」

  　

  「Where are you , my dear ?」Anomalisa，是由Anomaly和Lisa兩詞組成，看似是一種

  巧合，但兩者組合卻成為另一種希望之詞的意思，在Michael Stone眼中Anomalisa的存在

  並非偶然，而是在他極想要逃脫出平庸生活的出口，或許不規則有那麼違反道德，但他露

  出的笑容卻是最真實的，過多時候我們也就和主角Michael Stone一樣有著悲傷但卻沒有

  淚水，欲哭無淚已成為這個機械式社會的代表詞，我們眼前並不是真正的幸福，我們過著

  的滿足也不是真正的滿足，說來有點哲學，但你真正知道什麼才是自己想要的嗎？在編劇

  Charlie Kauffman的巧手底下，他在《Anomalisa》已埋藏一筆很深的隱喻，十年前，他

  以筆名Francis Fregoli為歌劇院撰寫這部聲音劇場，而「Fregoli」也正是Michael

  Stone入住的飯店名稱，在醫學上的Fregoli可稱為Fregoli幻想，這是一種妄想誤認症候

  群，一個人可以不準確複製地方，對象和事件經由腦部的損傷來改變任何人的外觀或變相

  ，與妄想的人認為自己受到迫害被他們認為是變相的人，而Michael Stone也曾說他有精

  神疾病，雖沒有明說是哪一種，但冥冥中的Fregoli也為一切埋下伏筆，幻覺的產生、臉

  部的扭曲，焦躁不安的種種，它雖是一種精神疾病，但相反的也是一種社會症候群。

  ----------------------------------------------------

  《Anomalisa》是由《王牌冤家》、《變腦》等編劇鬼才Charlie Kaufman聯手首次執導長

  片的Dune Johnson，歷時三年打造一部R級定格動畫，在一秒30格底下你都可以從影片看

  見肢體動作連貫的用心，臉部表情非常生動，連情愛戲也沒敷衍，原只是一部聲音劇場，

  同樣聯手當時負責此齣的作曲家Carter Burwell，如何將一部純粹聲音轉換為影像和動畫

  去呈現，雖然《Anomalisa》大可以找來真實演原來飾演，但Charlie Kaufman則選擇利用

  人偶去製作，所以在許多細節，如下巴掉下來所營造出的緊張失神，或使更貼近現實生活

  的舉動，在一個個人偶之下和動畫每一秒的移動更具趣味感，而在影片中其實也有點當時

  《變腦》影子，腦內視角的幻想聒噪，全部擺進Michael Stone的視覺生活之中，加上原

  本的聲音設計，只由三名演員去聲配，分別是David Thewlis、Jennifer Jason Leigh、

  Tom Noonan，獨特的聲音加上一成不變的對比也正是整部精華所在，乎近乎遠的對話堆疊

  ，相當具有巧思，而配樂上許多幾乎都是以對話組成，更展現出奇幻之感，片尾曲《

  None of them are you》更唱出另一種悲鳴無奈之感，除了上述幾項，你更可看見電影中

  許多鏡頭推移設計都相當不錯，任何一部都不馬虎，動靜皆宜，古怪卻也不失該有的規矩

  。


  原聲帶：

  ----------------------------------------------------

  「我希望在陽光下做真正的自己」

  　

  Lisa口中唱出的《Girl just want to have fun》，當曾經和Michael有過一夜歡愉，她

  也是他心中的女神，但她的離去卻不是一種拋棄，反而她所想做的事不再拘泥於滿足，當

  天亮之後她的聲音也曾經慢慢變為那無趣之聲，或許她的遠走更是戳破一個美妙泡泡，幸

  福終究是幻夢，留下的仍是永恆的孤獨，Anomalisa，這個詞永遠只留給出現一剎的天堂

  女神，當陽光再次閃現，沒有人再去在意她臉上的傷疤，而記得的是她那張與眾不同的臉

  龐和聲音。

  　

  而回到日常，我們做到真正的自己了嗎？

  　

  此片榮獲第72屆威尼斯影展評審團大獎

  　

  2016.01.28

  派拉蒙影片 粉絲專頁


