title: '[好雷] 安諾瑪麗莎：錯失救贖的迷惘靈魂'
content: "網頁版： \n\n\n《安諾瑪麗莎》的預告乍看之下，除了是近年來少見的偶動畫外，劇情似乎十分地平鋪\n直敘：一個成功的講師在出差途中，巧遇了讓他心動的女孩的愛情故事－直到你看到編\n\
  劇是寫過《王牌冤家》這部有著樣板愛情片劇情簡介，內容卻完全顛覆你預期的\nCharlie Kaufman 。\n\n\n\n在電影開場沒多久，你就可以嗅到一絲絲的不對勁，漸漸地你會發現：除了男主角及女\n\
  主角外，所有的角色都有著一樣的面孔、一樣的男性噪音，連女性角色也不例外，就如\n同飯店名 Fregoli 所暗示的一般（Fregoli delusion 是指將其它人都當作是同一個人\n\
  所假扮的精神異常症狀）。不管是計程車司機、櫃臺、門房都是如此，在男主角眼中看\n來是那麼地乏味、那麼地煩人。\n這晚對他而言實在無趣到了極點，在飛機上被鄰座男士握住手、說話跳針異常惱人的計\n\
  程車司機、猶如答錄機的客房服務，以及互動薄弱的家人。\n一切都是日常生活會遇到的情況，都相當平凡，相當讓人厭惡。\n\n\n\n直到有著不一樣面容及女性聲音的女主角\
  \ Lisa 出現，故事才有了轉折，也從這裡開始\n一頭栽進了超現實的領域裡。\n\n\n\n事實上，這一切在男主角聽到 Lisa 聲音的前一刻就開始了。\n\
  我們看到洗完澡的他凝視著鏡中的自己，而自己的臉孔與聲音，就如同卡住的錄音帶一\n般嘈雜不清，代表著這位平時有著多種角色、外貌及語氣的講師，其實完全認不清何者\n\
  才是真正的自己，就在迷惘之際，與他人不同的 Lisa 的說話聲傳入房內，才讓他發狂\n似地衝出門外，想要找到這名女子。\n從他搭訕 Lisa 及她朋友時的應對技巧看來，我們隱約可以感覺得到，這不是他第一次\n\
  在出差期間與其它女性攀談乃至做愛，連早些時刻不歡而散的舊情人，或許也不過是一夜\n情的對象、更早一點的 Lisa 。\n\n這名素昧平生的女子，為何能讓男主角為她癡迷？\n\
  當 Lisa 提出同樣疑問時，只得到了男主角敷衍但真實的回應：\n「妳對我來說很特別，但我說不上來妳哪裡特別。」\n這聽來很像花花公子油嘴滑舌下脫口的話語，從男主角口中說出卻能讓人信服。\n\
  別忘了，這是個看不清自我的人啊。\n\n\n\n我們先快轉到翌日早晨，男主角所作的惡夢中，有著一群口口聲聲說著愛他、不願放開\n他的人們，而當夢中的飯店經理對他作出愛的表白時，原本不悅的情緒霎時轉為驚恐，\n\
  驚恐到他拔腿就跑，還忘了地上有個那麼大的地洞。\n逃出到辦公室的時候，原本灰暗的房間變得明亮，還有著成排的女員工，「還是說你想\n要其它女孩？這邊每一個女孩都可以愛你。」因此我們大概可以知道，他自己潛意識內\n\
  相當清楚，他的成功與條件一直以來都讓他在與異性的關係上無往不利。\n另一方面來說，他卻也害怕著親密關係，當有人對他吐露愛意時，他唯一的反應便是逃\n跑，一如先前對待舊情人一般。\n\
  \n再回到那個夜晚，相較於她無所不用其極想睡上男主角床鋪的朋友 Emily ，極度自悲\n的 Lisa 使得男主角的恭維之詞毫無作用，不停地述說著自己有多麼不值得被愛，甚至\n\
  連男主角明白表示自己對她的渴望時都還不敢置信，一直推托、將球作給自己的朋友，\n成為了全片唯一不拜倒在男主角褲管下的角色。\n即使到了床畔，在男主角使出之前讓眾多女人為之傾倒的話術時，\
  \ Lisa 仍是不斷地自\n我猜疑，還主動提起自己不完美的身材與臉龐，這一切的與眾不同，都讓男主角像是發\n現新玩具的小孩般，更加地想要與她共度良宵，或者換句話說，征服這塊從未見過的處\n\
  女地。\n可悲的一幕是，雖然 Lisa 依著男主角的要求，用自己獨特的噪音講過關於自己一件又\n一件的事，男主角卻只是不斷地親吻著她的側臉，右手不安份地往下伸，如同一匹被性\n\
  慾所掌控的野獸，與 Lisa 想交心的模樣有著強烈的對比，彷彿是在嘲笑著男人不管到\n了幾歲、不管遇到了多麼讓他心靈悸動的對象，最後還是會抵擋不住生物的本能，被性\n\
  給衝昏頭啊。\n\n\n\n從惡夢中醒來之後的男主角，殷切地跟 Lisa 述說著想跟她共渡餘生的想法，在 Lisa\n表示贊同後，突然之間與她噪音重疊的，是那千篇一律、一成不變的男子噪音。\n\
  在愛上男主角後的 Lisa ，終究還是成為了「其它人」。這也就讓人不難理解，為什麼\n在接下來的演講中，不時會有男主角近乎絕望的獨白穿插其中，雖然看似有說出口，但\n\
  其實那些話都還是埋藏在他心底。當然，中間有觀眾打斷獨白，表示他們是來聽客戶服\n務演講的，但我把它當作是男主角腦中另一個聲音的自我提醒。\n而在演講結束後，他也跟之前一樣，一聲再見都不說，飛也似的逃離辛辛那堤，回到了\n\
  家中，回到了無新意的日常生活內，對著跟自己一樣，只要按下按鈕，永遠都會有著相\n同反應的日本人偶黯然神傷。\n\n\n\n而 Lisa 呢？最後她跟其它的舊情人一樣，還是寫了封信給男主角，說明自己的心意，\n\
  但不同的是，她的聲音並沒有變得如其它人一般。\n\n在她提到 Anomalisa 一詞在日文內有女神之意時，我們才忽然驚覺，原來她聽得到在\n演講當下男主角的獨白，她看得出男主角的徬惶，這也就是為什麼當時她的臉上流露出\n\
  了同情。\n\n她，真的是男主角人生中那個特別的人，那個名喚 Anomalisa 的女神。\n\n\n\n只是認不清自我的他，錯失了而已。\n\n--"
