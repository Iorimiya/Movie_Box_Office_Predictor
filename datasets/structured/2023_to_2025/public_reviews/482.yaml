url: https://www.ptt.cc/bbs/movie/M.1455808459.A.3CA.html
title: '[好雷] 《安諾瑪麗莎》：孤獨的鏡像'
content: '原文連結：




  入圍奧斯卡最佳動畫片《安諾瑪麗莎》(Anomalisa ,2015)(是一部定格黏土人動畫，趕在

  放映場次所剩無幾的平日晚上去看，衝著本片導演之一、有著奇思妙想的查理考夫曼（Ch

  arlie Kaufman）。改編自室內樂團搭配的獨幕舞台劇，作者是法蘭西弗瑞格里，他是考

  夫曼的另一化身。



  事實上這部電影貫穿的情節用一句話就可概括，一個事業成功、家有妻小，卻又寂寞焦慮

  的企業演講家在飯店邂逅了粉絲，而且場景幾乎全在飯店，這樣單一的劇情線要如何發展

  出90分鐘左右的長片，自然考驗著編導的功力。我私心的以為，那個曾寫出經典的愛情片

  《王牌冤家》，還有過往跟Spike Jonze合作《變腦》、《蘭花賊》展現天馬行空想像力

  的鬼才編劇，顯然已然「回不去了」。(這裡並非貶意，不過往後恐怕再也看不到劇本中

  輕盈的喜劇元素。)。



  在2008年考夫曼首部自編自導的《紐約浮世繪》，透過主角劇場導演之口說出：「我真的

  很孤獨，妳明白我嗎？我是說妳知道孤獨的感覺嗎？」，不難看出電影裡呈現的孤獨姿態

  ，有一種討拍的脆弱，在內心呼喚著「來了解我、來愛我」。



  不難察覺這幾年考夫曼睽違已久共同執導的新作《安諾瑪麗莎》，孤獨轉為更內斂，簡直

  臻至斷、捨、離的境界。當企業演講家遇上來參加演講的客服粉絲，客服女孩因為右眼周

  圍有疤缺乏信心，這個八年沒有交往經驗的女孩前一任男友追她的原因竟是「成功機率」

  較高；本片說是我在電影中看過最臨場感的床戲，不似好萊塢電影過場的橋段、亦非《藍

  色是最溫暖的顏色》的香豔熱烈，從來沒有看過一場床戲拍得如此彆扭笨拙、卻又不可思

  議的寫實。麥可對麗莎的聲音「一耳鍾情」、希望麗莎可以用聲音自由發揮；而麗莎對麥

  可的情感是一種崇拜與想望，對兩人之間一個是貪圖對方的聲音、一個是貪圖與偶像共枕

  眠的經驗，是的，聲音是人的一部分、名氣也是一部分，喜歡對方好的一部分自然沒有什

  麼不對，但作為一個「人」的整體，是沒有被全然接納的。這是何以天亮之後，麥可忍受

  不了麗莎用餐具敲牙齒、邊咀嚼邊說話的模樣；這是何以麗莎可以毅然決然地離開原本準

  備要攜手度過餘生的麥可。



  無止盡地焦慮、充滿現實感的惡夢、荒腔走板的演講，麥可好像沒有碰到救贖；電影尾聲

  麥可的兒子收到了不喜歡的日本古董娃娃，啊也許這是一種給觀眾的另類救贖吧！接受它

  、習慣它，然後有那麼一天，終於坦然擁抱它的不完美。


  --'
date: 2016-02-18
sentiment_score: 0.75
