url: https://www.ptt.cc/bbs/movie/M.1469368524.A.002.html
title: '[好雷] 《Anomalisa》安諾瑪麗莎 '
content: '圖文好讀版：





  ＝＝＝以下有雷，請慎入＝＝＝




  《Anomalisa》安諾瑪麗莎 2015 IMDB 7.3

  「世界如此平庸，而我是誰呢？」，這是我看完後，

  浮出腦裡的第一個感受。



  美國劇作家 Charlie Kaufman 作品常常讓人需要更多

  時間消化，脫離常規彷彿是一貫的規則，本片《Anomalisa》

  一樣讓人在影後，需要時間慢慢咀嚼一番。《Anomalisa》

  入圍2016年奧斯卡動畫片，絕對是一部"限成人觀賞"的動畫

  片，很精緻也很用心的使其粗糙。


  《Anomalisa》，這個單詞貫穿了整部電影，Anomal-動物，

  Anomaly-異常，在電影中也提到了在日文裡擁有「天神」的

  意思。主角麥可史東在電影裡是一位無人不曉的客服經營大

  神，在麥可的世界裡，所有事都無奇平淡，每一個人在電影

  裡都擁有一樣的面孔及聲音，所有的人都在追逐著麥可，崇

  拜著麥可，麥可非常的孤獨且孤傲。


  直到麥可在飯店裡遇到了Lisa，Lisa的登場讓電影劃開了下

  半場，終於電影裡出現第一個女生聲音及面部樣貌，這也代

  表麥可人生出現了這位與眾不同的Lisa，頓時獲得此生最大

  的救贖，麥可巴不得想立刻拋下妻小與Lisa共渡下半生，諷

  刺的是麥可在墜入與Lisa的關係隔日，Lisa漸漸地也長的與

  其他人一樣，聲音也與其他人一樣，Lisa不再是麥可人生中

  最特別的那位，就跟麥可人生中的其他人一樣，就跟麥可的

  妻小、飯店經理、同事、朋友一模一樣，麥可終究孤寂一生

  。


  究竟對麥可來說的與眾不同是什麼呢？究竟在在諸多的成功

  下，你是否真的追尋自己內心的渴望，還是在追尋大眾認知

  下的成功、看視美滿的家庭婚姻、五光十色的私生活，卻隔

  外寂寞，但到了中年，也無力反抗，咎由內心的孤寂、缺憾

  一點一點的吞蝕不剩。


  幕後拍攝篇：



  --'
