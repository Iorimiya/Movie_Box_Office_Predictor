title: '[普雷] 就像真的一樣《安諾瑪麗莎》'
content: '圖文版請於連結：


  就像真的一樣，有自我靈魂的偶動畫

  在動畫電影的範疇隨著科技進步，漸漸都使用電腦三維建模製作動畫。而在三維動畫還未

  普及與發展之時，偶戲的逐格動畫可是一大熱門，直到今天依然是東歐區域的國寶地位動

  畫。《安諾瑪麗莎》是一部改編舞台劇本的偶動畫電影，敘述一位出差演講的暢銷書作者

  麥克史東，在飯店與他一位熱情的書迷相遇的成人式情愛故事，除了細節部分如幻似真外

  ，更是突破偶戲尺度，赤裸裸的將戲偶的床戲搬上大螢幕。












  動畫，是一個與真人電影和戲劇有著相似卻不同的專業領域。動畫師曾經提過一個概念，

  這概念是所謂的「動畫靈魂」。動畫靈魂是一個發想動畫的主要過程，讓任何創作者可以

  透過這樣的思考方式去製作動畫。一部動畫的誕生，包含了每個人的創作、觀看、評論三

  者。創作者所創作的動畫的理念、角色、劇情會被留下，就因如此，動畫是一個與真人電

  影截然不同，有著另一種挑戰與刺激性的創作。動畫需要想像空間，與觀眾的再度詮釋。

  沒有創造力跟夢想的人是不會喜歡動畫的。號稱日本宅王的岡田斗司夫，曾經對此引以為

  傲，能在點線面之間做出想像，是一種人類未來式的自我進化。


  在不同媒介的動畫中，偶動畫是一種建立在真實三維立體空間裡的動畫形象。這種製作相

  當費工，會以定格攝影、補間動畫的形式製作。在台灣的金光與霹靂布袋戲，也是偶動畫

  的範疇之一，但較為不同的是布袋戲是以木偶與精緻偶為主，也相當重視操偶，與歐洲用

  黏土與土製模型製成的戲偶較為不同。在歐洲歷史中，偶動畫淵源長久，且遍布甚廣。早

  在東歐蘇聯體系時就出品了多部木偶動畫電影。其中捷克與斯洛伐克更是將偶動畫當成國

  寶。成為只要提到偶動畫就不能不提到的國家。









  不管是木偶或泥偶動畫。在世界，歐洲幾乎佔據動畫片的各大獎項與總量，所以使用偶動

  畫等同於直接宣示歐洲動畫地位。所以即使有了電腦三維動畫，歐洲還是改變不了這個鞏

  固地位的動畫模式。而《安諾瑪麗莎》是由經驗豐富的定格動畫與傳統二維動畫公司

  Starburns Industries，所製作的成人風格偶動畫電影。動畫裡不只完整呈現人物，任何

  的背景與細節物品絲毫不馬虎，每處畫面都讓人驚艷，宛如偶動畫圈的超寫實主義，連人

  的細微表情變化也表現的維妙維肖，更不用說人體身體與性器官部位的細緻度，都是過往

  偶動畫所沒有的細膩感。


  《安諾瑪麗莎》故事敘述著有暢銷書籍《讓你更能夠幫助顧客》的作者麥克史東，在一次

  出差演講時，邂逅了一位落落大方且小小脫線的女性麗莎。兩人頓時墜入愛河，但這場愛

  究竟是追尋已久的真愛，還是只是一時的意亂情迷？在這一天一夜中，麥克將得做出一個

  決定。這部動畫除了宛然真實場景一般的超寫實風格，也有著虛幻感的超現實主義的表現

  在裡頭。兩種風格相互交錯，最後形成一部讓人印象深刻的偶動畫電影。《安諾瑪麗莎》

  費時了將近三年的時間完成，逐格動畫製作而成，每一秒約得拍攝24張（格）畫面，共由

  十一萬格影格拍攝而成。並且人物道具超過千組與光線手工調整，而製作出讓人難以置信

  的細緻作品。商業偶動畫也可以跳脫兒童題材，而以成人故事為背景製作出有深度的偶動

  畫作品。






  希望看起來就像真的，動畫師必定會讓那些人偶的雙眼彷彿有了生命。《安諾瑪麗莎》電

  影目標，就是讓偶動畫角色有著靈魂和更細緻的情感表現，故，每個細節都相當苛刻。而

  保留偶動畫素材本質也是這次動畫團隊主要理念，《安諾瑪麗莎》就是一部純正的偶動畫

  電影，跟電腦動畫不同，保留最原始的偶動畫製作與細微的臉部接縫瑕疵，甚至在故事情

  節利用這種瑕疵，將人的隱喻暗喻；寫實超現實兩者，都更突顯其中的反差之處。


  原作《安諾瑪麗莎》的舞台劇裡以孤獨與愛的主題為題材，去探討人的本質。導演想用偶

  動畫再度的詮釋這種情感敘事，在許多地方《安諾瑪麗莎》捨去了一貫偶動畫的拍攝風格

  ，而更依照真實電影下的鏡頭語言去詮釋，甚至大特寫與遠景都聚焦於主角麥克史東身上

  ，讓人幾乎忘了裡頭人物是個戲偶，因為他是如此的真實又具有靈魂。而在故事最後究竟

  是珍愛廝守或美麗的錯誤，就由觀眾自己去透過蛛絲馬跡尋找答案了。


  --'
