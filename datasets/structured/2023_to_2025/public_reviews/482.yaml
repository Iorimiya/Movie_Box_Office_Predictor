url: https://www.ptt.cc/bbs/movie/M.1455590428.A.28E.html
title: '[好雷]《安諾瑪麗莎》：魅惑之聲 '
content: '看完《安諾瑪麗莎》不禁想問，究竟是麗莎獨一無二？還是她的聲音獨一無二

  ？麥可喜歡的到底還是愛情的臉孔，愛情的臉孔答案是什麼，沒有答案，就是

  你看到後覺得獨一無二的那個。



  麥可史東在飯店浴室中淋浴時，全身赤裸，露出中年發福的大肚腩與鬆垮的臀

  部，一個成功的社會菁英人士亦抵擋不了歲月摧殘的痕跡，他抹開鏡中的霧氣

  ，正視著自己的臉龐，然而此時，他聽見與眾不同如天籟般的女聲。浴室是私

  密空間的表徵，獨處、放鬆且毫無防備，最寂寞的時候「聽見」最不一樣的聲

  音，麗莎的聲音如同天神的呼喊，因聲而遇，毫不相識，便執著於她是最特別

  的，這是《安諾瑪麗莎》最漂亮的一擊，直搗現代都市人的寂寞困境。



  這是個非常簡單的故事，沒有多餘龐雜的支線。因《待客之道的守則》一書而

  備受崇拜與景仰的麥可，教人如何表現良好的客戶服務，因為受邀演講來到辛

  辛那提，寂寞空虛的他約了舊情人卻鬧得不歡而散，孤苦難耐之時卻聽見麗莎

  的聲音，深受其吸引，甚至想為了她放棄婚姻，只因為她很特別，那個夜晚頓

  時成了他生命中意外的衝擊。



  麥可從下飛機到下榻飯店，總是滿臉愁容，頭頂像是有烏雲壟罩，對待周遭的

  人心煩不耐，而有趣的是，這些陌生人全都用專業的客戶服務禮儀對待他：計

  程車司機滔滔不絕的熱情推薦遊玩的去處、飯店櫃檯人員注重雙眼凝視著顧客

  、帶位人員仔細的介紹房間裡的設備、電話接聽人員力求話術正確，他們運用

  了從麥可身上學到的服務來服務麥可，看起來多麼諷刺，因為麥可對此只備感

  厭煩。他沒有了知覺，他雙眼底下看見的全是同一張人的臉孔，他對周遭的人

  事物早已麻木，失去辨識他人的感知，源於那扇封閉的心房，只有強大的自我

  中心才會導致忽略他人的內心狀態。



  麗莎有多特別呢？在遇見麗莎之前，麥可的世界裡只有兩種聲音：自己的，與

  其他人的。不論是舊情人、計程車司機、飯店櫃台人員、麗莎的友人艾蜜莉，

  甚至是他的老婆、兒子與友人，不分男女長幼，全是同一個男聲，所以麗莎極

  其獨特，她擁有「自己的聲音」，她是這個單一聲道世界的闖入者，她的聲音

  像是敲醒麥可寂寥世界的鐘，提醒麥可在他窮極無趣的世界裡還有所謂的「他

  人」，成為麥可內心深切期盼的渴望，因為那份「反常」，正是麥可需要的，

  他尋找一個能跟他匹配的人，顯現出自身也是與眾不同的「相異性」。故問題

  不在於麗莎特別，而在於一份前所未有的新鮮感，所以麥可說不出麗莎哪裡特

  別，因為他從未仔細觀察麗莎，他只執著於她的聲音，所以也許這道聲音套在

  Mary或Amy身上也同樣適用。



  於是本片便充滿了髒話以及麥可滿溢而出的春心蕩漾，除了髒話，再也沒有其

  他詞語可以成為他宣洩的出口，剩下能填補內心空虛的缺口就是性。於是充滿

  「濕」意的中年男子，一遇到自認的真命天女就力邀她來房間喝一杯睡前酒，

  身為女粉絲的麗莎怎能受的了。本片利用多處潮溼感暗示麥可的情慾，飛機窗

  外陰暗的天氣、浴室玻璃淋浴過後的水滴痕、尿尿的水柱，甚至誤進情趣用品

  店目睹的陽具，晦暗又沉重，都象徵麥可乾涸的心境。



  一夜情過後，當激情褪去，你與對方開始享用一頓日常的早點，你看見她慣性

  地用刀叉敲著牙齒、邊咀嚼邊說話，你甚至感受到她具有控制慾，真面目現身

  了，日常生活總歸是不完美的。於是反常麗莎不再反常了，甚至連她的聲音都

  出現了兩個音軌，一道是麗莎本身的聲音，一道是全片其他角色的男聲，最後

  甚至被男聲取代。於是當麗莎也漸漸被「同化」了，在麥可眼裡的新鮮感消失

  了，生活的常態便是最大的考驗。麥可不斷地對麗莎下指導棋，麥可原先愛的

  是麗莎的特別，愛著麗莎臉上的傷疤，愛著麗莎美妙的聲音，愛著麗莎床上的

  笨拙與嬌羞，但同時麥可又一步步地扭轉麗莎的形象，使得她與眾人愈趨相似

  ，這矛盾的心境，不正是愛情裡解不開的百轉千迴。



  然而，本片最明亮之處在於多年後的麗莎寫信給麥可，並說明自己查字典發現

  Anomalisa於日本語中有天神之意。面對這一段邂逅，麗莎並沒有被始亂終棄

  的感覺，反而帶給她一份新的希望與自信，麗莎又重新恢復女性的聲音，也許

  此時此刻，她找到了自我，才是特別的麗莎，脫離了男人的掌控，告別了過去

  的畏縮與羞澀；而麥可卻與唱著桃太郎之歌的情趣機械玩偶對望無語，顯得可

  悲又寂寥，他不也像一個木偶，等待歸屬，卻再次選擇讓自己遺世孤立。家中

  那群朋友的聊天聲越來越大，他卻被隔絕在外，彷彿他不存在似的，彷彿只要

  有了對話，有了聲音，就能掩蓋人們日子裡深藏的尷尬與孤獨。



  直白地說，《安諾瑪麗莎》就是個男的出差到異地為了排遣寂寞想約砲的故事

  啊，約完過後發現很空虛，當然沒有產生愛，因為人類當下的動情激素太強烈

  ，隔天回神後，一起吃早餐，一件平凡的事，卻可以讓你認真看看對方的模樣

  ，這才發現什麼動情激素已經不適用了，此刻她變得平凡無奇，所有昨夜覺得

  可愛又特別的特點都變成缺點了，一瞬間情感冷卻，都只想要做，怎麼還會有

  愛？


  --'
