url: https://www.ptt.cc/bbs/movie/M.1456558331.A.BDF.html
title: '[好雷]《安諾瑪麗莎》反常的是誰？'
content: '防雷
















  網頁有圖版：


  四周充斥吵雜的聲音，厭煩路人多餘的關心，

  乏而無趣的人生不斷往前，到底空虛該如何填補？


  日復一日的生活，是否只剩下枯燥乏味？

  算著時間、算著日子、算著年復一年。

  生活漸漸變的沒有期待，對未來沒有動力。

  《安諾瑪麗莎》描述一位看似功成名就，

  實則對生活充滿失落的作家，麥克出差到辛辛那堤與麗莎的邂逅。


  電影以定格動畫表現，擬真的細緻和動畫的奇幻效果，

  二者交織更帶出了麥克對於生活格格不入的困境與茫然。

  電影以吵雜的聲音揭開序曲，象徵主角麥克對於周遭的事物漠不關心，

  將自己困在孤寂裡，拒絕所有色彩仍不自知，

  因此麥克隨著自己的黑暗，越縮越小。


  一夜情能填補生活的空虛嗎？

  當麥克遇見「反常」的麗莎時，

  以為麗莎就是他一直苦苦尋找的答案。

  電影用配音的方式表達麗莎對麥克的獨特性，

  麥克由大衛·休利斯配音；麗莎是珍妮佛·傑森·李配音，

  其餘角色皆由湯姆·努農配音。

  表現出對於麥克而言，所有人都是無趣乏味、相同的聲音；

  唯有麗莎是特別，有獨特音調。


  然而激情過後，日子還是一成不變，

  生活的瑣事沒有因此多添色彩。

  麗莎不是解藥，而麗莎的聲音，

  在麥克耳裡也逐漸跟其他人相同無味。

  生活的色彩來自內心，麥克內心的黑白，對周圍冷漠。

  生活本質若是黑白，不會因為一夜情、談一場戀愛而改變，

  情慾之後迎來的往往是更空虛的寂寞。



  --'
