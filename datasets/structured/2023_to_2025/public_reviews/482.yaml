title: '[微好雷]《安諾瑪麗莎》，尋找不到，卻又不斷找尋的...'
content: '部落格版：


  《安諾瑪麗莎》是一部令人相當驚奇的電影，之前常在說，有的時候某些畫面、動作只有

  動畫片做得到，但是《安諾瑪麗莎》近似於「真人版」的動畫作品，事實上它就真的沒有

  過多特效，可卻做出了相當「真實」的效果。


  簡單說它達到了動畫電影才能有的感覺，以及真人電影存在的真實感，兩者相加，成了這

  部《安諾瑪麗莎》。



  我想，《安諾瑪麗莎》透過明示、暗喻等方法去告訴觀眾想要傳達的意象，單就除了男主

  角麥可史東，以及女主角麗莎兩人的配音不同外，其他所有角色全部都由同個人配音，再

  仔細看除了男女主角的臉孔不同，其餘角色都是同張「臉」。史東一生在尋找的或許就是

  麗莎那「獨特的臉」，從他眼裡看見的，每個人都是同個樣貌，同個語調，這讓他人生毫

  無意義，1995年他離開貝拉，１０年後再聚首，想找她上床，也許只是想要找回當時的感

  覺，還有躲避現在的婚姻、生活。


  史東在走廊上聽見麗莎的聲音，與眾不同的聲音，他認為麗莎是他一直都在尋找的，特別

  的存在，或許在他跟她上床之前是這樣認為的，當他們一起用餐時，他卻突然在意起她的

  不完美，於是演講結束後，他又逃走了。


  電影用刺眼的光線讓麗莎在史東的眼裡變得逐漸模糊，聲音也忽然變成與其他人相同的嗓

  音，這是否暗示著，麗莎在他的眼裡已經快變成跟別人同樣的存在，那麼當時他離開貝拉

  ，以及現在想離開妻子唐娜，是不是都是因為她們對他來說已經無意義了？


  地下室的橋段，只是透露史東的心裡慾望，他或許終其一生在找的，不是能夠長相廝守的

  特別，而是能夠宣洩慾望的對象，然後在宣洩完後，一切又都與平常一樣，在無特別，而

  他也勾不起渴望，這樣反覆的日子衝擊著他，才會讓他一直做惡夢，對生活疲乏、困頓，

  甚至遭致失控吧。



  「每個人都有自己獨特的一面」


  「你是誰？其他人又是誰？」


  每個人都會是麥可史東，都會想要在茫茫人海中找尋那在自己眼裡特別的存在，也可能像

  史東一樣，逃跑了這麼多年，還是尋找不到，但是內心卻極度渴望找到。


  就像麗莎的出現，Anomalisa，anomaly加上Lisa，不正常的麗莎，在別人眼裡她的不同

  讓她成為異類，成為別人口中的反常麗莎，可在史東眼裡，她是特別的，「Anomalisa」

  的意思就是天神，她的出現拯救了他，帶離他離開苦悶，成為他的神。


  《安諾瑪麗莎》看似簡單而又不簡單，值得細細咀嚼，深思一番。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --

  謝謝提醒已改正~~

  太可惜了'
