title: '[選片] 寂寞公路/安諾瑪麗莎/久美子/流浪貓'
content: '寂寞公路和安諾瑪麗莎這兩部感覺有點沈重，可以靜下來思考一些哲理。


  久美子的奇異旅程是我個人偏愛的飄渺風格。


  老師與流浪貓好像很溫馨感人，喜歡貓的我們應該也會看得高興。

  似乎是這四部裡面風格比較愉悅的（？）


  因為準備在情人節觀賞，女友比較希望能看喜劇，但我們對這四部作品都滿有好感，實在

  選不太出來，只好請好心板友們幫幫忙。


  謝謝大家 ：）


  --

