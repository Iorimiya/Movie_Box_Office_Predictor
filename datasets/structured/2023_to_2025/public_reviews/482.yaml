title: '[好雷] 安諾瑪麗莎-逃不出樣板的人生寓言 '
content: '一趟出差，在飯店意圖出軌結果搞成一夜情然後回家的全紀錄，簡言之就是如此，千萬不

  要有甚麼期待，因為沒甚麼情愛糾葛的峰迴路轉，只有按照時序的紀錄。有意思的是，它

  做成定格動畫，出場人物三個以上卻只有三個配音員，以此為基礎，發揮其最大可能性，

  兼以富含譬喻的劇本，讓此情節簡單到不行的故事，竟有關於生活、自己及理想等面相可

  以探討。這是安諾瑪麗莎。








  (底下有雷)











  聲音在這部電影是其中一個重點。或許編導單純想要將主角與其他角色區隔開來，因此才

  沒有特別處理男女老幼不同的聲線，來凸顯這個似乎事業有所成就，其實內心空洞寂寞的

  中年男子。他追悔著一段逝去的戀情，以為自己的命運在離開那段愛情後開始分歧，於是

  沒心思去聆聽計程車司機對當地名勝的導覽，遑論佯裝感興趣的樣貌，整個人如同出差地

  當時的天氣--綿綿不斷的細雨般煩躁。




  故事也確實環繞著這樣的主題，尤其是在與舊情人敘舊不成又徒增自己難堪後的出浴戲，

  讓我憶起曾經在小說中讀過的幾句描述中年男子對生活力不從心的字句，諸如鬆垮的肚皮

  及萎靡皺縮的陰莖等等，帶點愁苦況味，氣氛拿捏精準。不過以女演員配音，也是全劇唯

  一女性配音的Lisa出現後，讓電影又更深入探討了主角的處境。




  編導以聲音來表現她的特別，但以Lisa的邏輯借代普世的邏輯，她的缺陷不會是一般被選

  中的人，反倒同行的友人才是男人所趨之若鶩的，不過Michael卻被不完美所深深著迷。

  從真命天女、白馬王子的角度來看，情人眼裡出西施，每個人都有某個特別吸引對的人的

  地方，有時候旁人可能不太有辦法理解，當事人可能也無以名狀，但就這樣戀上了也沒有

  辦法。




  不過隨著故事緩緩推進，或許屬於人生勝利組的Michael，貪戀的是Lisa的『反常』，即

  片名anomaly（反常）+Lisa＝Anomalisa的由來。無論是Michael的生活抑或是以Lisa友人

  為樣板形象的受歡迎女性，不得不承認這是很多人的人生目標，大家都朝著這個方向努

  力，只是這個目標是否為自己內心所渴求的呢？還是徒然被教育出來地依樣畫葫蘆呢？




  有趣的是，Lisa這個特殊的存在，在分外介意Michael對自己的評價之後，特別的聲音竟

  慢慢地消失，與故事設定的統一聲線揉合一起，正說明了Michael厭煩的是過度一致性，

  也呼應了Michael的名聲，累積自自己的成功經驗著作-客戶應對之道，就像許多市面上出

  版，非學科類型的教科書一般，讓大家按圖索驥便能與作者一樣，輕鬆踏上成功或理想的

  捷徑。只是每個人都長的一模一樣，會不會無趣了點呢？




  依據故事敘述，片名也具有高高在上的天神之意，而不管Lisa對於Michael的迎合，還是

  Michael出現各公眾場合中，旁邊便會出現驚喜之聲的情境，皆賦予了Michael唯我獨尊的

  地位，但是否也造成Michael意欲維持模範的壓力呢？個人認為那惡夢場景，或許可以有

  這樣的解析。當你在一定的位置上時，全世界（至少所有周遭的人）都會以此位置的標準

  來用放大鏡檢視你，包含你的生活，彷彿一失足便容易萬劫不復般，只好盡力維持那101

  招的千篇一律。




  然後慢慢地生活就如同磨刀石一般，人變鈍了，麻木了，然後話也說不好了......後者的

  呈現是本片之所以選擇動畫為最好呈現方式的原因之一，嘴巴竟支離破碎，頓時失語。

  Michael最終還是＂孑然一身＂回到自己的家，重複著日復一日的乏味生活，反觀Lisa的

  來信卻開心地訴說離開他之後，終於又快樂地做回自己，恰成對比。影片至此嘎然結束，

  參雜著錯愕的情緒，不過故事裡時不時閃逝過心有戚戚焉的恐懼，卻也讓自己去思考影片

  對於人生的寓意，而全文可能不過是到目前為止自己心有所感的部分而已。



  歡迎光臨:



  --'
