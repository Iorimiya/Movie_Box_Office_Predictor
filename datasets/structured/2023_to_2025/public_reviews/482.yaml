title: '[普雷] 安諾瑪麗莎~婚外情的藉口~'
content: '<無音樂好讀網誌版>





  <無雷認真心得>




  花費三年的定格動畫，在技術層面非常值得一看，


  不過劇情面就見仁見智，很多內容都用了很多隱喻的方式表現，


  當初看完出來也是有點思緒混亂，但靜下心來回想，會有一些想法，


  這類型的電影通常不會是一般大眾會喜歡的口味，


  有點奇幻又有點想討論人性，


  針對技術呈現來說的確很厲害，但劇情面太過委婉會看得有點辛苦


  (其實是我的小雞腦無法正常運作)


  不過這次片商打的是極限量發行，可能上映的廳數不多，


  1/29上映，想看的朋友可能要把握上映時間唷!!








  <有雷之還是很認真心得>






  說不上來自己到底是喜歡還是不喜歡這部動畫，但我很喜歡這部動畫給我的怪異感，


  不過喜不喜歡本來就是很主觀的事情，我倒是很欣賞這部電影技術面的部分，


  像是每個人偶的表情之精細，


  還有團隊不想像一般的定格動畫一樣將人臉間的縫隙修去力求完美，


  或許這也跟他想表達的意象有關吧??!


  場景中的人物雖然動作表情不盡相同，但長相都很相似，


  尤其是聲音，除了男主角由大衛休利斯配音(路平教授呀~!!!)，


  女主角由珍妮佛傑森李來詮釋之外，其他所有角色完全由湯姆努農來做配音，


  或許從主角麥可的視角看過去，每個人都一樣，


  每個都是他不想面對的平凡人生中的一切，


  他其實不是一直在逃跑，而是一直在追尋他心目中特別的意義，


  這特別的意義必須是與眾不同，正如同他在飯店中遇到的麗莎一樣，


  不同於一般大眾所認同的美感，而是有點殘缺不完美下的特別，


  不過這在我看來只是為了他的不軌找藉口，


  心靈層面來看，厭倦了生活平淡的一切，想找特別的人事物來讓自己解脫，


  但實際上劇中人物麥可到了飯店打了電話給舊情人貝拉，


  在酒吧那邊詢問是否要到房間一聚，就只是想要找個可以生理發洩的對象，


  這或許也可以解釋他的惡夢中為何進到地下室找飯店經理，


  飯店經理說公司給他選地下室或是五樓的空間，他選了地下室，


  而進到這個地下室或許就是代表進到了麥可的內心深層，


  而內心深層卻默默的發現都是赤裸裸的原始慾望，


  於是醒來的他對於他自以為找到的特別意義才會產生動搖，


  發現這個特別只是跟他平常索接觸的一般大眾一樣，都是同樣的聲音，


  所以他最後在演講上幾近崩潰的脫稿演出，或許代表他再也無法滿足於現況，


  但最後的最後他還是回到了他的家，聽著週遭人們一樣的聲音，


  在搭配著桃太郎歌曲中，被自己困著的靈魂顯得有點淒涼，


  我想他再也無法走出自己的心靈困境了吧??!?




  其實電影想要表達的意像好像有點多，


  用了太多隱喻的方式反而讓人看了不清，


  也許不明不白的時候是最有美感的吧?!


  個人是覺得這部電影蠻有趣的，但不敢隨便推薦給各位，


  喜歡的就會很喜歡，但他絕對是一部相當用心的電影唷!!!


  謝謝各位看完!以上!


  --'
