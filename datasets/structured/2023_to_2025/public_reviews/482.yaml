url: https://www.ptt.cc/bbs/movie/M.1454043054.A.928.html
title: '[好雷] 安諾瑪麗莎 - 唯有寂寞能陪你到天涯海角'
content: "◎《安諾瑪麗莎》(Anomalisa) - 唯有寂寞能陪你到天涯海角\n\n圖文完整版： \n\n《安諾瑪麗莎》是拍給大人看的停格動畫（本片在美國是R級、台灣是\n\
  輔15級），全片美麗而感傷，最後三分之一往心頭上重重一擊。本片\n是《王牌冤家》、《變腦》編劇Charlie Kaufman的最新自編自導作品\n，所以若你已決定觀賞本片，請等看完再來閱讀本文，因為Kaufman的\n\
  怪片，有一部分樂趣是在解謎，在毫無所知的情況下看，能體會到最\n多樂趣。\n\n本片描述住在加州、已有妻兒的Michael Stone（David Thewlis配音\n\
  ）搭機去辛辛那提出差，禁不住寂寞感襲來，他聯絡上多年前分手的\n前女友，卻不歡而散。接著他又認識了善良卻缺乏自信的Lisa（珍妮\n佛傑森李配音），兩人能有發展嗎？\n\
  \n人生有些東西像海市蜃樓，你以為有的，卻沒有；你以為沒有的、不\n在意的，其實一直杵在那兒，但你正眼都不想瞧一眼。\n\n《安諾瑪麗莎》主人翁Michael即使是個暢銷書作家、又有妻兒與舒適\n\
  的房子，但依舊感覺人生無聊透頂，因為所有人在他看來都一模一樣\n，每天他只是跟所有「不同但一樣」的人做無意義的交流，那些人只\n是一個「他們」。Michael是如此想跟人交流，卻又受不了任何人，活\n\
  脫脫是個悲慘、冷漠的自戀狂（他的姓氏Stone大概不是編劇亂取的）\n。\n\n男主角的專長也很有特殊意義：他寫的新書名為\"How May I Help You\n\
  Help Them?\"，教人如何做好客戶服務。或許可以說，他擅長如何壓抑\n自己、討別人喜歡。好的服務員必須時時注意不冒犯他人，體貼但保\n持應有的距離。或許時間久了，Michael對所有人都用對待陌生客戶那\n\
  套，於是心靈成了一人孤島，不想也不習慣與他人真心溝通、或花心\n思在別人身上。從Michael與前女友的互動，也看得出Michael對別人\n的感受很麻木，只想到自己。\n\
  \n於是最諷刺的莫過於此：這位客戶服務大師Michael，在下飛機搭車前\n往飯店途中，正是被計程車司機熱情的「客戶服務」給煩死的，司機\n熱情介紹當地特色、美食、景點，但Michael只想閉嘴休息、沉浸在自\n\
  己的小宇宙裡，不要任何互動。飯店櫃台接待也很熱衷客戶服務，目\n光從不離開客人，不斷保持眼神接觸；客房服務電話接聽人員，也是\n囉囉嗦嗦務求正確。這些貼心「服務」，反都讓Michael這位客服大師\n\
  煩躁無比。\n\n***以下有雷***\n\n在Michael眼中，所有人都一樣。每個新認識的人，都是無趣的重複。\n看似選擇很多，但到頭來都是一樣的選擇，沒有出口。編導神來一筆\n\
  地讓飯店房間電話的客房服務快速撥號鍵，都有一堆重複的選擇，反\n映出Michael的世界──那幾個按鍵有餐盤小圖示、服務生托餐盤小圖\n示、漢堡小圖示......但到頭來還不都一樣，就是客房服務嘛。更神\n\
  來一筆的，是編導讓Michael所遇的每個人，不分男女都有相同的臉型\n，只有妝扮、髮型等等不同，而且連配音的人都是同一位Tom Noonan\n。\n\n直到Michael遇見了Lisa。\n\
  \n起初，Michael只是聽見Lisa，但他非找到她不可，因為她的聲音不是\nNoonan的聲音，而是珍妮佛傑森李的。如同每一個愛情的開端，一切\n都如此新鮮有趣，眼裡只有彼此，「那個人」像會發光一般，短短的\n\
  相處談天後，Lisa成了Michael世界中唯一與眾不同的人(anomaly)，\n但也如同每一個愛情的走勢圖，新鮮感漸漸消去，「非他不可」的情\n緒轉成「受不了那個人」的不耐，接著對方的特殊性消失，跟別人沒\n\
  什麼不同（甚至看起來別人還比較好）。\n\n乍看之下，這實在陰暗又悲哀。但《安諾瑪麗莎》倒也不是只想拿鐵\n鎚敲你頭說「放棄吧！沒有希望的！」，片尾來自Lisa的信，讓觀眾\n\
  可以比較Lisa與Michael對他倆這場邂逅的不同詮釋。或許有時候，人\n生只看你如何詮釋。那個人特不特別，可能也只看如何花心思觀察。\n\n在技術方面，《安諾瑪麗莎》的成就非常驚人。與Charlie\
  \ Kaufman共\n同擔任導演的是Duke Johnson，如果你看過影集《廢柴聯盟》(\nCommunity)第二季，應該會記得使用停格動畫拍攝的一集\"\
  Abed's\nUncontrollable Christmas\"，那集正是由Johnson擔任導演。《安諾\n瑪麗莎》是在導演與工作人員無比耐心之下、利用3D列印技術完成的\n\
  作品，人偶非常細緻，表情複雜真實，場景安排仔細到不可思議，車\n窗上的雨滴、電視螢幕上的反光等等，都極為講究。甚至，本片是「\n很認真要拍給成人看」的，片中有人偶打手槍、人偶全裸出浴、人偶\n\
  性愛、人偶事後菸等等，這些東西能夠不讓人發笑，反而看起來極為\n真實，都要歸功幕後人員的努力，據說光是性愛場景就花了六個月拍\n攝，正是為了不想讓畫面惹人發笑。我必須說此段戲太經典了，雖然\n\
  這不是停格動畫人偶第一次有性愛場面（《美國賤隊：世界警察》(\nTeam America：World Police) 裡就有過），但本片的愛愛場景最驚\n人之處，是它的動作與情感很真實──兩人有點尷尬、不太唯美、不\n\
  會特意喬攝影角度掩蓋身形缺陷，比很多真人電影裡出現的性愛場面\n還真，也多了一份溫度。\n\n珍妮佛傑森李為Lisa配的音很可愛，尤其清唱的辛蒂露波名曲\"Girls\n\
  Just Want To Have Fun\"實在是個太動人的版本，突然間這首泡泡流\n行歌曲，成了一首帶著淡淡哀傷的歌、有著破碎過卻盡可能保持樂觀\n的心。Tom\
  \ Noonan的配音工作難度頗高，他必須用同樣的聲音，演繹\n不同語氣、不同性別、不同個性與情緒的人，仔細聽他對不同角色的\n詮釋方法也是觀賞本片的樂趣之一。\n\
  \n《安諾瑪麗莎》是今年奧斯卡提名的五部動畫片中，唯一比較有機會\n與《腦筋急轉彎》一較高下的，但最終獲獎機率可能不高。本片口味\n比較小眾，不過喜歡編劇Kaufman、或想被驚人停格動畫技術好好震撼\n\
  一下的朋友，別錯過這部非常特別的電影！\n\n註：本片裡的飯店名為The Fregoli，心理學上有一種症狀叫做\nFregoli delusion，患者會認為身邊許多人都是同一個人的偽裝。\n\
  \n--\n\n我的部落格 \nFB粉絲團  \n\n--"
