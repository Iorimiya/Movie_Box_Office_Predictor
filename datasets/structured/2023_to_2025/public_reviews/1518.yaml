title: '[新聞] 菅田將暉削髮太迷人 「銀河鐵道之父」讓'
content: '新聞網址：


  菅田將暉削髮太迷人 「銀河鐵道之父」讓役所廣司成粉絲


  2023-07-22 聯合報記者 陳建嘉 即時報導


  改編自日本文壇「直木賞」大獎同名作的電影「銀河鐵道之父」，集結新科坎城影帝役所

  廣司、日本奧斯卡影帝菅田將暉聯合主演，詮釋「日本國民作家」宮澤賢治的傳奇人生。

  特別的是，全片以宮澤賢治父親宮澤政次郎的視角，描繪這對父子吵吵鬧鬧、笑淚交織的

  種種經歷，劇情輕鬆詼諧卻也賺人熱淚，勢必讓影迷、書迷大呼滿足。近期以日劇「勿說

  是推理」、電影「花束般的戀愛」大受好評的男星菅田將暉，為了詮釋宮澤賢治投身宗教

  的熱誠，不惜落髮剃成超短和尚頭，但此舉絲毫不減他帥氣形象，讓今年剛於坎城影展封

  帝的役所廣司害羞表示「我也成為他的大粉絲了！」。


  有著「日本國民作家」之稱的宮澤賢治，曾擔任過農業指導員、作家、教育家等多種身分

  ，同時也是虔誠佛教徒。他生前在文壇並不受矚目，逝世後，許多作品由父親、弟弟整理

  出版，成為現今日本最具知名度的文學作家。他筆下故事既真誠又充滿童趣，影響無數創

  作者，如動畫大師宮崎駿、手塚治虫等。而本片片名取自宮澤賢治最廣為人知的代表作品

  「銀河鐵道之夜」，原著作者門井慶喜從歷史資料中搜集有關宮澤賢治對父親描寫的資料

  ，並改以父親角度來描繪出宮澤賢治的生涯，片中洋溢著滿滿的父子深情，令人為之動容

  ，也意外揭開宮澤賢治不為人知的另一面。


  今年正逢宮澤賢治逝世九十周年，作為紀念之作的電影「銀河鐵道之父」，故事描述出生

  於當鋪世家的宮澤賢治，身為家中長子，理應是家業繼承人，但對凡事充滿好奇心的他，

  先是想進修求學、學習農業知識，畢業後著迷於與農業風馬牛不相干的商業，決定改賣珠

  寶維生、之後又突然想當和尚，各種好奇心驅使他嘗試不同的體驗。而在他背後，始終嚴

  厲督促、支持他的，便是他父親──宮澤政次郎。電影以政次郎的視角，帶觀眾深入這位

  文學大師的成長背景，一探他的靈感來源，見證他與家人濃厚的信任與羈絆，將如何影響

  他的創作，最終打造出跨越百年、感動千萬讀者的詩句。


  「銀河鐵道之父」由日本電影金像獎最佳導演成島出執導，除役所廣司、菅田將暉以外，

  飾演宮澤賢治的妹妹，則是由近期動畫電影「天氣之子」、Netflix影集「舞伎家的料理

  人」竄紅的女星森七菜演出。該片是役所廣司首度與新生代演員菅田將暉、森七菜合作，

  他在片中外表看似冷酷嚴厲，卻總在關鍵時刻心軟，願意為兒子夢想赴湯蹈火，陪伴兒女

  體驗不同的人生滋味。役所廣司表示「在原作裡，有一句這麼形容我的角色：『看似嚴格

  ，卻是個充滿破綻的父親』，我便以此為根據，將菅田將暉當成自己的親生兒子，也成了

  他的大粉絲！」。

  該片將於8月4日在台上映。


  --'
