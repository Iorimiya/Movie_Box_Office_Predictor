title: '[好雷] 役所廣司-【銀河鐵道之父】 又脆弱又堅強'
content: '當初因為役所廣司要來參加台灣金馬所以在cp+翻了這部出來看，看完直接榮登近期最愛

  的日本電影

  ────────────────────────────以下小雷──────—

  ─────────────────────

  【銀河鐵道之父】主要是在描述接受國外思潮影響的日本知名作家宮澤賢治與其在傳統思

  想下的父親政次郎之間的故事，兩人從升學、繼承家業、信仰等都有明顯的不同，摩擦及

  紛爭因此產生、關係也日益惡化。


  政次郎因為幫助農民的過程中看到他的決心、妹妹敏的生病到過世，父親政次郎漸漸了解

  兒子賢治的想法、轉而支持他想做的事，成為他的力量。


  不得不說日本真的很會拍這種親情的情感戲，總是輕易地騙到了大家的眼淚，這部是役所

  廣司搭配新生代戲精菅田將暉聯手演出，菅田的小狗無辜眼神讓我覺得他好適合演出賢治

  這個腳色，看似無害的雙眼卻帶著堅定不移的信念。

  不管是在故事線、演員間的情感渲染，【銀河鐵道之父】都是非常值得推薦一看的好電影

  。


  大家還有推薦其他役所廣司的片嗎？


  --'
