url: https://www.ptt.cc/bbs/movie/M.1704895333.A.73F.html
title: '[好雷] 情牽浮生戲--會打群架的北柳佳人'
content: '(1)北柳佳人


  首先要先回顧一下初版預告：






  當時這個影片一出來，籠統來說就是戲子x權貴的組合，劇情猜測都往王的男人或是霸王

  別姬去聯想，以往像程蝶衣、孔吉這樣的男性戲子角色都會帶有些許陰柔氣質，又或是夜

  奔裡的林沖，台上演的豹子頭，下了台也是一個溫文儒雅，但這火爆北柳佳人，除了受限

  於社會階層無法抵抗權貴的壓迫，在戲班裡可不是任人欺負的主，打起架來也是一個狠勁

  。

  倒是不知道北柳佳人是阿肯在江湖(？)上的稱號，還是用來指稱所有出身北柳府的舞者。


  (打群架的幕後花絮照片)




  (2)戲台上的美"男子"





  不只阿肯這個角色本身跟以往刻板印象不一樣，戲台上的扮相也並沒有因為強調美而傾向

  女性化，雖然這可能不符合很多人事先的期待，但更符合當時流傳下來的資料，另一方面

  也是凸顯出上層階級與其說是喜歡，更多的是狎玩，糟蹋人當有趣，反倒是威淇大人時不

  時對阿肯投以熱切的目光，總覺得哪裡怪怪的……(摸下巴)



  (3)地表最強生物果然是歐巴桑


  有人要害鄭少爺是吧！？咱們姨字輩的當然要護著少爺，偷天換日調包炸紅棗是小case，

  倒是阿肯、查德、阿萬三人來問蘇廳大人那天發生什麼事，這個嘛……某個姨：那個不是

  人，是鬼！這段真的很好笑55555，然後阿珠超像國畫裡走出來的人物，化妝師跟造型師

  實在很厲害！


  (4)美如畫的還有鄭少爺




  一出場根本就是幅西洋畫，畫裡的人突然就說話了，那一幕可能需要學美術的人來解說了

  。

  就像之前訪問裡導演說的，Tong把這個角色演繹得很好，只是很驚訝其實Tong是對自己很

  沒信心的，相信他看到電影成品應該是會很驕傲的。


  (5)又是放風箏




  泰國古代放風箏是雙方較勁，而不是單純放著風箏飛好玩的，不分貴族平民都要遵守公平

  的規則，那一幕大概也代表著，如果社會規則/階級是公平的，像阿肯、查德這樣有才有

  能的人就能在社會競爭中得勝，他們在控制風箏時有絕佳的默契，也讓阿肯萌生想找查德

  當幫手的念頭，畢竟阿萬有時不太靈光。


  (6)依然帶著神秘感的查德




  雖然查德曝光了蘇廳之子的身份，但是他背後還有沒有"上級"呢？眼見自己父親唯命是從

  、隨波逐流，結果就是慘遭滅頂，甚至可能連累家人，查德決定選擇跟父親不一樣的官路

  ，壯大自己像汽船一樣，即使暴風雨也不怕，而像舢舨一樣到哪裡都能待的阿肯，如果查

  德有一日需要打探政敵的什麼消息，曼上閣裡，有阿肯在。



  (7)這張圖的N好眼熟




  主演的Mile前幾天在IG限動傳了這張圖，今天泰國Netflix官網就搶先預報2/29，"全球播

  映"，"導演重新剪輯版"，台灣也看得到喔！




  串流平台最大的好處就是可以重複播放、慢速、暫停，細節部分跟喜歡的情節都能看得更

  仔細，像鄭少爺接手曼上閣後，牆上的畫從藍(綠？)孔雀變成白孔雀，而且周圍的雞站得

  比白孔雀高，白孔雀張嘴扯著嗓子在威嚇旁邊的雞群，完全反映出鄭少爺接手時的處境，

  這樣的細節真的要多看幾遍才比較會注意到，加上最後一批寫真書泰國也開始出貨了，等

  待集運回台灣ing，等上Netflix看新版本應該還會有新的心得。


  --'
