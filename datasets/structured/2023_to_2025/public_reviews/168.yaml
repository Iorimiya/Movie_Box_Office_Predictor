url: https://www.ptt.cc/bbs/movie/M.1756137293.A.CB3.html
title: '[新聞] 《戰疫前線》導演來台：抱歉沒帶小栗旬'
content: "《戰疫前線》導演來台：抱歉沒帶小栗旬\n\n04:10 2025/08/25 中國時報 孫伊萱\n\n\n導演關根光才23日來台分享拍攝《戰疫前線》幕後趣事。（孫伊萱攝）\n\
  \n日本電影《戰疫前線》改編自鑽石公主號群聚感染事件，集結小栗旬、松坂桃李、池松壯\n亮、窪塚洋介、森七菜演出，導演關根光才23日來台受訪，開心分享拍攝幕後創作心得，\n\
  他先是爆笑致歉「對不起沒帶小栗旬來」，也透露窪塚洋介一聽到他要來台灣就羨慕地喊\n：「我也好想去！」\n\n關根光才表示，首次挑戰龐大製作壓力沉重，疫情是全球共通記憶，他希望提醒觀眾，日\n\
  常便利背後有醫護與基層人員付出，「才過沒多久，人們好像又開始浪費，我不想讓這樣\n的記憶被拋諸腦後」。\n\n在選角上，劇組第一時間就想到小栗旬，正好他和企畫增本淳都和小栗旬皆合作過，很快\n\
  就牽上線，「小栗旬看完劇本後就說，這個故事一定要被拍成電影，很快就答應了，也讓\n我們的製作能更快推進。」\n\n電影細緻考究醫護實況，除了窪塚洋介飾演的醫師，登船那場戲特別找來廚房用的橡膠手\n\
  套，「當時因為醫療資源匱乏，真的只能先戴廚房手套」，池松壯亮則堅持真實呈現醫護\n臉上被防護口罩壓出的痕跡，為此在高溫下連續數小時全副武裝拍攝，最後留下貨真價實\n\
  的勒痕。\n\n#關根 #製作 #拍攝 #廚房 #導演\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\
  \n\n\n--"
