url: https://www.ptt.cc/bbs/movie/M.1757073091.A.FBD.html
title: 戰疫前線
content: '2個小時10分鐘，我都很認真看，沒有分心，所以應該算是好看的片～


  這部是根據疫情初期發生的鑽石公主號事件改編的電影，印象中當初看了台灣相關報導，留

  下來日本相關單位處理方式很不行，很讓人傻眼的印象。而會有這樣的印象應該是台灣報導

  用了電影中那個爆料影片提到沒做好污染分區的問題。


  嗯，片中在郵輪上面對疫情爆發的醫生們沒有否認這事，但是船上的各種複雜情況不是這麼

  簡單就可以說，要怎麼做就怎麼做。


  看這部電影，看著勇敢前進到第一線協助病患的DMAT醫生們，面對各種不斷發生的問題跟內

  外壓力，還是盡量在現有條件下，努力救治乘客（爆料影片一出，他們被罵，大家也開始獵

  巫，不要讓自己小孩跟上船醫生的小孩一

  起上學，上船的醫生們也受到職場壓力，要求不要再上船參與DMAT醫療活動。船上醫生少了

  大半，要繼續應對持續發病的乘客。。。）

  就覺得按照理論上的理想狀況去評斷他們沒做好的想法，真的就是講風涼話而已。。。


  這部沒有什麼太狗血激情的場面，但這四個人說出的各種冷靜話語中，默默傳達出的各種價

  值觀，都很能觸動人心。還有片中不斷出現的各種必須做決定的情境，都在讓人也一起思考

  ，到底怎樣做才是自己覺得的最佳解。做自己覺得正確的事？按不在現場別人口中的正確方

  法來做事？考慮到患者情況，可以做怎樣的妥協跟幫忙。。。等等（看這片，真的想很多）


  總之，感謝所有持續把病患性命放在心上擔心的醫生們、感謝可以扛的住壓力，面對無法應

  對突發狀況的死硬法規，願意想各種方法協助第一線人員的官員、感謝願意面對未知病毒與

  周邊壓力，但仍願意提供後方協助的醫院們。


  還有希望自己跟大家在面對下次疫情時，能多些冷靜理性跟理解，不要想當然爾的跟著媒體

  亂講話。


  最後還要再說一句

  窪塚洋介的仙道醫生從頭帥到尾啊！離開了撤完人的郵輪之後，馬上又繼續趕往了下一個現

  場！



  --'
