title: '[普雷] 戰疫前線'
content: '老實說 這部片很無聊…

  但因為有演出最初日本疫情剛開始時大眾的心態

  日本官僚文化遇到未知事件需要不斷討論

  主角群們為了救人打破體制

  所以不會說太差

  畢竟這種真實事件拍成電影也不可能多熱血

  主角群都是一群醫生

  主軸圍繞著人命至上天經地義

  穿插著帶風向的社會輿論

  可想而知當時義務治療的醫生、護理師心理壓力有多大


  可能是經歷過疫情也被感染過

  看到有人發病就只有…啊 他在咳了 啊 被隔離了

  這些都經歷過 就覺得只要治療的好問題就不大

  最後小兄弟擁抱感覺很刻意要拍這幕

  看完整部片真的沒什麼感覺

  甚至看到一半還覺得怎麼還沒演完…

  -----

  Sent from JPTT on my iPhone


  --'
