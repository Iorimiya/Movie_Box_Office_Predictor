url: https://www.ptt.cc/bbs/movie/M.1753278830.A.5BA.html
title: '[情報] 8/29【戰疫前線】中文預告'
content: '8/29【戰疫前線】中文預告




  ～真實事件改編，重返第一艘發生重大疫情的郵輪現場～


  【難言之隱】關根光才 最新導演作品

  【空中急診英雄】製作人 增本淳 企劃

  【哥吉拉大戰金剛】小栗旬

  【流浪之月】松坂桃李

  【我心裡的太陽】池松壯亮

  【沉默】窪塚洋介


  2020年2月，停泊在橫濱港的豪華郵輪「鑽石公主號」，超過100名乘客出現症狀，是

  日本第一起發生新型冠狀病毒重大感染的船上事件，負責前線救援的是災害派遣醫療

  團隊「DMAT」。以搶救乘客性命為優先的DMAT指揮官・結城英晴（小栗旬），以及為

  了保護國內、將防止病毒傳入日本本土為最優先考量的厚生勞動省官員・立松信貴

  （松坂桃李），他們必須在對立之下攜手合作。面對突如其來的疫情，不顧自身安危、

  選擇站上最前線的平凡英雄們，還有登上船指揮現場的仙道行義（窪塚洋介），拋下

  岐阜的家人、趕赴現場的醫師真田春人（池松壯亮）以及挺身面對未知病毒的船上工

  作人員。在各方衝突以及排山倒海的輿論壓力下，他們應該守護的是這個國家，還是

  眼前的生命？


  本片改編自真實事件，面對首艘郵輪發生群聚感染事件。當時，日本尚未設立任何針

  對病毒災害的專責機構，最終被派往船上執行救援任務的，是災害派遣醫療團隊DMAT。

  雖然他們是處理地震與洪水等災難的專家，卻毫無應對未知病毒的經驗。隨著情況擴大，

  來自世界各地的批評聲浪也接踵而至。本片由【空中急診英雄】製作人增本淳企劃及

  撰寫劇本，由新銳導演關根光才執導，集結實力派演員小栗旬、松坂桃李、池松壯亮、

  窪塚洋介、森七菜，攜手還原當時生死交關的緊張現場。


  --'
