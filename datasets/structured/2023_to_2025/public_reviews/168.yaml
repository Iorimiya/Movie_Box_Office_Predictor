title: '[普好無雷] 《戰疫前線》'
content: '基本上沒什麼需要防雷的


  維基都寫得很清楚了


  基本上看完就只是覺得中國很惡質而已

  畢竟當年全世界都受害


  劇情部分有點鬆散無力

  希望日影可以學一下韓影

  在這種片上不要那麼專注於紀實

  可以多少訴諸一些情感和衝突


  日本人的X感想多數都是寫說自己看到哭了

  或是某些劇中的名言很讓人感動振奮

  我還以為會看到罵中國的心得((

  我錯了((


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
