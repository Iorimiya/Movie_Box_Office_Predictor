url: https://www.ptt.cc/bbs/movie/M.1670572265.A.BCF.html
title: 'Re: [討論] 阿凡達 真的那麼多人看過與狼共舞風中'
content: '與狼共舞在1990年上映的時候，不管是美國或是全球，都是年度票房排行第3。


  成本2200萬美金，全球票房是4億2千萬。


  賺到笑呵呵，更別說拿獎拿到手酸。


  另外與狼共舞有個很厲害的場面，其實這場面比阿凡達裡的任何場景更讓我震撼：



  只靠「電影愛好者」有可能賣到年度第3，票房4億？


  如果你覺得票房4億2千萬沒什麼，


  晚一年上映的「魔鬼終結者2」創了成本新紀錄：一億美金。


  全球票房才5億2千萬。


  另外，當年阿凡達上映前，南方公園就拍了一集惡搞，說阿凡達是抄襲與狼共舞了：



  --'
