url: https://www.ptt.cc/bbs/movie/M.1242922162.A.F0F.html
title: '[心得] 家與被擄走的女人--搜索者與與狼共舞觀後'
content: '網誌版


  一、


  　　搜索者及與狼共舞是兩部在美國影史上舉足輕重的經典電影，電影的主軸都是南北戰

  爭剛結束時，美國西部白人移民與印地安人的互動。兩部電影的故事時代背景相同、兩部

  電影的角色也非常相似，但導演詮釋的立場不同、電影所拍攝的時空不同，電影所展現的

  歷史意涵便截然不同。本文希望以兩部電影中「家」的概念作為切入點，分析美國電影、

  美國社會，在西部片這個具有豐富傳統的類型底下，呈現了如何的轉換。


  二、搜索者中的家


  　　在搜索者這部電影講述1868年的美國，一位南北戰爭之後，敗戰的南軍軍官Ethan

  Edward搜索被印地安人擄走的姪女的故事。經歷了漫長的搜索過程，電影最後終於重建了

  圓滿的家庭，但卻留下主角一人寂寞而孤獨離去的身影。


  　　由故事的脈絡，我們可以得知家庭是Ethan進行搜尋的原動力。在對一切事物充滿疏

  離感的Ethan眼中，只有與哥哥家庭成員的互動是快樂的。但殘酷的是，這個家庭在他歸

  鄉不久後就被摧毀。


  　　即便Ethan其實還有另一個家人，也就是哥哥的養子Martin Pawley，但他卻對近在眼

  前的Martin極盡排擠之能事。電影中不斷反覆出現Ethan說著：「I’m not your family.

  」，但我們也無法想像Ethan甚至可以對這親人冷血到，以之做為誘餌，誘殺貪心的老闆

  。


  　　對Ethan而言，歷時多年的追尋其實是在尋找一個他心中失落的家。Ethan不願意接受

  和他最親近，與他有過一段宿緣的Martin，而幾近瘋狂地執著、苦苦追求他早已忘記長相

  的Debby。只因為家庭當中，有個具有血緣關係的成員，失落卻存活，而他必須讓她回到

  白人世界。而Ethan之所以對Martin異常的排擠，只因為他們沒有血緣關係、沒有神聖的

  家庭羈絆，於是不成為家人。


  　　故事中最美好理想的情節，就是擁有一個傳統的白人家庭。這個理想中的家庭，具備

  搖搖椅、屋頂、冬天的暖爐，以及暖爐前以血緣聚集的家庭。像是Ethan必須找到家庭失

  落的環節；Martin必須找回家庭的成員；故事的插曲，Martin到Laurie的婚禮鬧場並奪回

  美人心；瘋瘋癲癲的Mose所說的：「Mose要的不多，只要屋頂，暖爐，以及搖搖椅」；以

  及受盡印地安人拷打後失心的Mose，只會說的那一個字，搖搖椅。


  　　全篇電影環繞著對此家庭形象的讚頌與追尋，而所有的衝突與美好，都源自對此家庭

  形象的失落與擁有。


  　　而這個美好家庭的追尋在他們追尋到Debby時，成了一個荒謬而可怕的惡夢。當Ethan

  歷經多年總算踏進Scar的帳篷時，發現Debby竟然已成為Scar家庭中，一夫多妻關係底下

  的、來自不同部族的其中一位妻子。在Ethan知悉Debby已經成為Scar的妻子、並且同化為

  一個印地安人時，他悍然掏槍，想射殺Debby：完全沒有搜索成功的喜悅，有的只是無限

  的憎恨。因為Ethan真正追尋的不是Debby這個活生生的姪女，而是一個必須被安置在幸福

  家庭的脈絡中，生命才有正向意義的女性。


  　　像在討論進攻計畫是否要犧牲Debby時，眾多白人居然一致認為，Debby應該被殺，只

  有跟Debby沒有血緣關係Pauly的哥哥主張要拯救Debby。Pauly說：「有一個人在那裡活著

  ，我們必須救她」。而Ethan卻說：「Debby已經變成了一個幼稚的野蠻人，再也不算活著

  了。」原來Debby這個美麗的女性，只要被認定再也不是血緣家庭中純淨的成員，她的生

  命便可以徹底被否定抹煞。


  　　電影最後的結尾充滿象徵意義，Jorgenson夫婦歡欣鼓舞地接納Debby成為他們的家庭

  成員；Debby的乾哥哥Martin與Jorgenson夫婦的女兒Laurie結為連理。每個成員都在這個

  有屋頂、暖爐與搖搖椅的幸福家庭中，找到位置與神聖的羈絆。只有Ethan獨自一人，從

  Jorgenson家中，孤獨地走向漫漫的西部荒漠。


  　　Ethan追尋的是荒唐瘋狂的幻夢，幻夢的終了，得到的就是空虛難堪的落寞。這個尋

  家而無家的牛仔鐵漢，在報復了印地安人、從野蠻人手中搶回了家人後，終於大家團圓喜

  樂了，他卻孤單而徹底地成為一個失家的人。


  三、搜索者中的種族


  　　這部電影「搜索者」，全片環繞在「家」這個主題上：家的美好、家的殘缺、家的追

  尋，以及家的重現。而造就這個美好家庭破碎的外在因素就是種族衝突：印地安人與白人

  。


  　　這部電影裡的印地安人，幾乎沒有什麼描寫。沒有多面向的個性、沒有個人的思維理

  想，有的只是平板單薄而單面向的「刻板印象」。在這部電影裡的印地安人幾乎不是「人

  」，只是一種形象的再現。是殘暴的化身、是破壞的工具、是愚蠢幼稚邪惡的總和。


  　　作為美國人美好家庭的破壞者，印地安人被賦與了相對於家庭捍衛者的一切負面特質

  與邪惡形象。導演不去描繪與探究印地安人本身的家庭、文化、與價值，而只單純而片面

  地描繪印地安人作為白人家庭破壞者所擁有的恐怖。


  　　我們可以藉由審查劇中角色的形象，來窺見導演所抱持的立場：


  　　白人                    　　　　　　　　　　　　印地安人

  　　神聖的家庭觀：忠貞浪漫 　　　　　　　　　 混亂的家庭關係：淫亂多妻

  　　武勇                    　　　　　　　　　　　　殘暴

  　　男人英俊、女人美麗      　　　　　　　　　  男人野蠻、女人醜陋

  　　男人堅毅、女人智慧      　　　　　　　　　  男人狡猾、女人愚笨


  　　在故事當中出現了許多印地安人與白人觀念的衝突與個性的差異，而差異卻採取了強

  調白人的正面特質，與印地安人的負面特質。這種以種族為區別的標準，二分了白人與印

  地安人人格與品質的優劣。企圖創造一種白人皆優秀，印地安人皆野蠻的形象。電影中像

  是美麗的白人女子Laurie Jorgenson為Martin苦守多年，而此時出現的印第安女人Wild

  Goose，就成了對照形象：肥胖、醜陋、愚笨。電影中其他角色也肆無忌憚地嘲笑Wild

  Goose的外號「胖仔」，好像這個印第安女人的醜笨，活該成為白人的笑柄。而Wild

  Goode在此，也作為忠貞浪漫愛情的對比：隨便、沒有節操、任憑喜好便投懷送抱。


  　　而透過劇中Jorgenson夫婦的對話，或許可以作為美國歷史白人觀點中，與印地安人

  交鋒、交戰以維護、捍衛家庭的縮影：

  　　「Now, Lars, It’s Just so happens. We’re Texans.

  　　Texans is nothing but a human man.

  　　Way out on a limb this year and next.

  　　Maybe for 100 years more.

  　　But I don’t think it’ll be forever.

  　　Someday this country will be a good place to be.

  　　Maybe it needs our bones in the ground.

  　　Before that time can come.」


  　　美國白人家庭的美好美麗，像Texans，要不斷抗爭對抗兇殘邪惡的印地安人才能贏得

  。以Ethan為代表的搜索者，或許可以說是美國人民的象徵；搜索Debby的過程，或許即是

  美國白人找尋親人的翻版。最後終有贏得家庭完整性的美滿畫面，但也有因此失落而殘缺

  的寂寞個人。


  四、與狼共舞中的家


  　　與狼共舞敘述南北戰爭結束後，北軍的戰爭英雄John Dunbar自願駐守西部的前線基

  地的故事。沒有預料到的是，白人駐軍此時已經全部撤離。孤單駐守邊境的他，逐漸與蘇

  族（Sioux）的印地安人互動密切，甚至愛上印第安文化，也愛上了被同化為印第安人的

  白人女人Stands With A Fist。電影的最後，John完全認同、並真正地成為一名蘇族人，

  以Dance With The Wolves的身份，脫離白人世界。


  　　本片與狼共舞，與搜索者異常的相似。同樣以美國南北戰後為故事背景；兩部片的主

  角，同是戰後失家而孤寂的男子；兩部片，也同樣以一個被印第安擄走的白人女子作為「

  家」的象徵關鍵。不同的是，搜索者Ethan為了追求空幻的家庭，而向印第安展開搜索與

  報復；而John卻是在印第安蘇族文化中，找到、並且建立了他真正的家庭。


  　　John在電影的一開場就對生命、對戰爭失去任何認同感與參與感，因此他在戰場上尋

  死，又自願流放到遙遠無人的邊地去。但隨著情節的不斷推進，我們漸漸看到John

  Dunbar內心的孤寂，仍然需要慰藉與出口。冷漠的掩飾也許在白人世界當中行得通，但在

  西部廣大的草原，這無可遁逃的寂寞就變得巨大而真實。寂寞中，John與野狼Two Socks

  建立友誼，與馬Cisco成為朋友。最後，透過接收蘇族的友誼之手，慢慢的，孤寂疏離的

  白人中尉，變得開朗率真、充滿童心。


  　　是的，John Dunbar越來越常笑，在蘇族人饋贈貴重的毛皮助他過冬時、在與雙襪共

  舞時、在雙襪第一次接過他手中食物時、在他愛上Stands With A Fist而無法自拔時、在

  他獲得他的印第安名字「Dance With The Wolves」時……


  　　旁白裡，與狼共舞時常說著，他欽慕蘇族人與大地無爭的和諧生活。而在他成為一個

  印地安人的那刻，他很清楚地說：我不要再過以前那種生活。他否定了作為一個白人的價

  值，轉身擁抱印地安人的價值。


  　　在與狼共舞這部電影當中，印地安人才是心靈的歸宿，救贖了失家的John Dunbar。

  蘇族人給了John與狼共舞這個名字，也給了他處世的智慧、忠貞的真愛、無私的友情。而

  這時候的白人，則成為了破壞和樂家庭、和諧部落的兇手。這些形象，正好與搜索者裡的

  白人社會是家庭的歸宿、印地安人是殘暴野蠻的家庭破壞者恰恰相反。


  　　再者，與狼共舞裡的Stands With A Fist，與搜索者裡的Debbie，同是幼年被印地安

  人擄走並迎娶的女人。但在兩片的脈絡中，Debbie的印第安化，象徵美滿家庭中失落的環

  節；而Stands With A Fist在印地安化之後，不但得到完整的生命與家庭，也令John

  Dunbar渴求的家庭得以完成。兩個同為南北戰爭軍官的失家男子，同樣去追尋一個被擄走

  的女人。一個懷著恨，於是看到印第安人的醜陋與家的破碎；另一個懷著愛，於是看到印

  第安人的智慧與家庭的圓滿。


  五、與狼共舞中的種族



  　　在電影搜索者裡失落的印第安文化，在與狼共舞中終於有了相對深刻的描繪。蘇族人

  的家庭、部落有著嚴明而合理的權力分配；巫師的地位並不是借用神秘的巫術或儀式建立

  ，而是憑藉著冷靜、充滿經驗、深諳人情、為部落決斷的智慧；印地安人的婚姻與家庭，

  是忠貞、質樸而神聖的；印地安人和與狼共舞的相處，都是真誠無欺瞞；蘇族在接納與狼

  共舞之後，也是友善、慷慨地對待他。就像與狼共舞想要向Stands With A Fist求婚時，

  苦於身無分文，而Wind In His Hair就說，我會幫你想辦法。之後，當天黃昏全蘇族的家

  庭，將珍貴的財物無私地堆放在與狼共舞的帳篷前，全部族真心地祝福他們。


  　　在與狼共舞逐漸愛上蘇族文化之時，電影也一步步的揭露白人的暴行。在婚禮結束後

  ，Kicking Bird邀請與狼共舞一同進入蘇族的聖地，作為接納他成為蘇族一員的象徵，也

  與他一同思考蘇族的未來。但在蘇族聖地映入兩人眼簾的，卻是白人肆無忌憚的汙染浪費

  與破壞。此時旁白說：我為白人感到羞愧與憤怒。但Kicking Bird卻總是冷靜、不帶仇恨

  的試圖與白人溝通。


  　　與狼共舞這部電影裡，白人的形象與印地安人的形象對照整理如下表：


  　　白人                  　　                             　　印地安人

  　　欺瞞虛偽                                           　　　 真誠無欺

  　　破壞自然                　                           　　 尊重自然

  　　貪婪無知                　                           　　 節制睿智

  　　權勢與利益的人際關係    　                            和諧而友善的人際互動

  　　強勢而充滿侵略性        　                              合理地保衛家園


  　　與狼共舞裡的印地安人，再也不是搜索者裡平板而一元的形象；這裡的印地安人，是

  多面、豐富、完整的人，出現的重要角色也都有各自的性格、特色。印地安人不再是緘默

  而只身為負面形象的丑角；相反地，這裡的印地安人集合了各種美德，反而愚昧兇殘的負

  面角色是白人。


  　　同樣被擄走的女人、同樣圓滿的家庭象徵、同樣的故事時空背景，在不同的電影中，

  卻有著幡然不同的演出。好萊塢類型片的沿襲與翻轉，強烈呼應著時代脈動與反思，讓人

  不禁羨慕，美國電影家藝術對於當代文化映照與形塑的能力。



