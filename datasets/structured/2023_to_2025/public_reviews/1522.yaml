url: https://www.ptt.cc/bbs/movie/M.1667809775.A.D4E.html
title: '[請益] 與狼共舞'
content: '以下劇透注意，劇情陳述因為看片年代久遠可能不精確。












  鄧巴中尉在美國南北戰爭的一場戰役中立下了戰功，因此他獲得了自由選擇

  駐紮地的機會。


  鄧巴向長官表示欲前往未開拓的西部服役時，長官似乎受到驚嚇而顯得神色

  慌亂，隨即簽屬了必要的文件給予鄧巴。


  就在鄧巴離開辦公室後，長官喊了一句英王陛下萬歲便舉槍自盡，這幕結束

  後電影轉場到西部大草原，沒有再對辦公室發生的劇情做任何著墨。


  不了解的地方是鄧巴中尉前往西部的決定跟長官自殺究竟有什麼因果關聯？

  有什麼理由讓他求死？


  還有南北戰爭距離美國獨立建國已經一百年，劇情安排一個緬懷祖國的軍人

  自殺想要表達什麼？


  以上


  --'
