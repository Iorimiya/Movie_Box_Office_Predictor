url: https://www.ptt.cc/bbs/movie/M.1756806561.A.DB7.html
title: '[新聞] 「與狼共舞」演員 Graham Greene 去世'
content: '新聞網址：

  Graham Greene, Canadian Actor Who Portrayed Indigenous Characters, Dies at 73


  曾在電影「與狼共舞」擔任配角


  並以此片獲奧斯卡最佳男配角提名的加拿大演員 Graham Greene


  週一在加拿大安大略的家中去世，享壽73歲。


  Graham Greene 在「與狼共舞」中飾演原住民部落的酋長 Kicking Bird


  與凱文科斯納飾演的鄧巴中尉有過接觸之後，逐漸接納了他。


  Graham Greene 是加拿大原住民 Oneida 族人，出生在安大略


  一生參與超過兩百部電影與劇集演出，包含「與狼共舞」、「綠色奇蹟」等。








  --'
