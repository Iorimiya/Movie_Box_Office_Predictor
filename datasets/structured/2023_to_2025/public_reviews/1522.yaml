title: 'Re: [討論] 阿凡達 真的那麼多人看過與狼共舞風中'
content: ':

  因為ptt老人化啊

  你去問三十歲以下的有誰會“都”看過與狼共舞 跟 風中奇緣?

  我都懷疑他們大概連周星馳的電影都沒完整看完過吧？

  but

  我就是都看過啊


  與狼共舞  最佳影片+敳文科斯納

  風中奇緣   那年代迪士尼一年就一部經典動畫電影+比電影紅的主題曲


  除非你不是電影的愛好人士 不然怎樣都至少會知道風中奇緣吧?

  你連風中奇緣都不知道 那豈不連小美人魚阿拉丁美女與野獸獅子王也都不知道?


  所以十年前看阿凡達1

  我看一半就滿腦子覺得這不就風中奇緣+與狼共舞的科幻版?


  然後走出戲院劇情就忘掉九成了


  除了特效外 劇情零分的爆米花電影...


  --

  就 如果有人提這部電影 我是完全不想提它的劇情

  因為它劇情就是幼稚 幼稚 幼稚。 完全沒什麼值得討論的地方。

  放大絕是吧? 我不看怎知劇情是怎樣？

  你沒看過是好事啊 才不會知道什麼叫抄襲老梗劇情幼稚

  就跟看過港片無間道的人 看不下去美國拍的神鬼無間一樣

  我沒說過阿凡達不好看啊...

  就跟星戰789一樣啊  特效華麗的垃圾

  有人或許會說 啊不就是456的重製版? 怎大家都說456時經典  因為時代不一樣啊！

  這就是為什麼有87分像的劇情阿凡達演來就讓人覺得幼稚的原因。'
