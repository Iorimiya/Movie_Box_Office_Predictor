title: '[情報] 凱文科斯納《與狼共舞》'
content: '必看影史經典！


  榮獲奧斯卡最佳影片等7項大獎【】


  Dances with Wolves 8/4(五) 經典重現


  《》的大前輩！


  不能錯過的大銀幕體驗！



  《》8月4日(五) 經典重現


  電影預告：




  更多資訊：





  美國巨星  自導自演史詩冒險鉅作


  1991 、等7項大獎


  1991 金球獎    戲劇類最佳影片、最佳導演、最佳劇本


  1992 英國奧斯卡 最佳影片、最佳改編劇本等9項大獎入圍


  全球狂賣129億台幣，爛番茄新鮮度87％，叫好又叫座


  超過百名影評選為1990十大佳片，必看影史經典



  鄧巴中尉（ 飾）領導聯邦軍在南北戰爭取得勝利之後，自願前往西部邊境尋

  找新生活，他在那裡跟一隻雙腳都是白色的野狼成為朋友，並將牠命名為「雙襪」。


  鄧巴駐紮的地方與原住民蘇族人的部落不遠，他因此與蘇族人有了接觸。蘇族人中唯一會

  說英語的女子「站立握拳」是被收養的白人孤兒。


  在鄧巴越來越融入蘇族人的同時，也和站立握拳漸漸產生情愫......。



  資料來源：


