title: '[討論] Apple TV 特價 與狼共舞/搖擺男孩/力王'
content: '【2024/10/02 Apple TV 特價報】

  與狼共舞／現在，很想見你／搖擺男孩／合法入侵／卡特教頭／艾蜜莉的異想世界／力王

  －

  今天來分享一些簡單的遺珠特價，並整理幾部平常幾乎沒在特價的小特價好片。首先推薦

  的是凱文科斯納的冒險大作《與狼共舞》，這部片在當時以驚人的製作規模技驚四座，並

  奪下包含奧斯卡最佳影片在內的多項大獎，非常值得收藏。另外喜歡山謬傑克森的朋友也

  可以入手《合法入侵》和《卡特教頭》，兩部都有讓人印象深刻的演出。

  －

  另外日韓電影也有非常不錯的片子，賺人熱淚的《現在，很想見你》雖然在戲外產生不少

  風波，但單論作品絕對是愛情電影的一時之選。《搖擺男孩》則是我個人非常喜歡的歌舞

  片，歡快的踢踏舞橋段與沉重的劇情背景形成反差，幾個揪心的轉折更是讓人印象深刻，

  大推。

  －

  最後我自己根據歷年特價紀錄，特別挑選了幾部極少特價，目前落在$250~$290的經典好

  片。其中暴力美學的經典代表作《力王》更是幾乎沒看過有更低的特價，推薦給大家收藏

  。

  －

  以上，祝大家平安，看片愉快！

