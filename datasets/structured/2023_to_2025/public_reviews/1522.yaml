url: https://www.ptt.cc/bbs/movie/M.1670554844.A.4E2.html
title: '[討論] 阿凡達 真的那麼多人看過與狼共舞風中'
content: '國外我不清楚

  但提到阿凡達常常會看到有人留言

  「阿不就是抄與狼共舞 」

  「阿不就是抄風中奇緣 」


  不經好奇講這些話的人真的看過這些片嗎

  或者根本就是人云亦云的雲觀眾？


  年代先不說

  與狼共舞這部的片長也差不多快3小時

  沒有像阿凡達有那樣厲害的特效場面

  要在螢幕前耐著性子看完真的不容易

  感覺是一部電影愛好者取向的電影


  風中奇緣的話

  我沒看過 也不清楚這部在台灣的影響力

  所以無法斷定


  純屬討論

  祝大家週末愉快



  --'
