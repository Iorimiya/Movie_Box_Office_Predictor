url: https://www.ptt.cc/bbs/movie/M.1550824803.A.745.html
title: '[好雷] 種族歧視的反省──看《與狼共舞》'
content: '1.影片名稱 : 與狼共舞


  2.觀影時間 : 拒答


  3.觀影地點 : 住家


  4.觀影方式 : DVD



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  種族歧視的反省──看《與狼共舞》




  ［《與狼共舞》海報］


  商業片大本營好萊塢，居然出現充滿理想色彩、人道主義關懷的《與狼共舞》，不免令人

  嘖嘖稱奇。


  過去西部片中的印第安人，似乎都是野蠻、殘暴、血腥、泯滅人性的，這對屈居弱勢的印

  第安人來說當然不公平，凱文‧科斯納（Kevin Costner）《與狼共舞》則摒棄白種人的

  傲慢與偏見，努力還原印第安人本來的面貌，其實他們是友善、愛笑、和平的民族，導演

  凱文‧科斯納藉此大大批判了一般西部片中的大白人主義。


  鄧巴中尉與蘇族人因了解而建立友誼，並且愛上了自小失去親人、被蘇族人收養的白人女

  子「站立舞拳」，自願加入成為蘇族的一份子。只是，鄧巴中尉的「特異」行止不見容於

  自認高人一等的白人社會，竟被指控叛國罪而面臨吊死的命運，怎不感嘆？鄧巴不懂，白

  種人為什麼一直誤解印第安人，不肯嘗試去了解他們？他和語言不通、文化迥異的蘇族人

  尚能因真誠相待而得以了解對方，甚至與被喚作「雙襪」的野狼都能成為朋友，何以他和

  語言、文化完全相同的人反而無法溝通呢？這豈非莫大的嘲諷！


  結果，「雙襪」這隻頗通人性的野狼為了跟隨鄧巴，被自大、狂妄、無知的軍人無情射殺

  ；冒險救出鄧巴的蘇族人則遭到美軍追殺的命運。後來，為了不連累蘇族朋友，鄧巴謝絕

  挽留，自己帶著妻子「站立舞拳」離開蘇族人部落。然而，18年後，蘇族人終究被迫與政

  府簽訂協議，放棄他們世代相傳的土地，怎不喟然！


  《與狼共舞》是凱文‧科斯納首度自製、自導、自演的西部史詩片，這部長達4小時的電

  影，出人意料地大受歡迎，創下破天荒的賣座紀錄，堪稱兼顧商業與藝術之代表作，凱文

  ‧科斯納亦因其道德勇氣，獲頒第41屆柏林影展特別成就銀熊獎；更在1991年第63屆美國

  奧斯卡頒獎典禮上，一舉拿下「最佳影片」、「最佳導演」、「最佳改編劇本」、「最佳

  攝影」……等7項大獎，可謂獨領風騷，實至名歸，這或許某種程度反映出美國民眾對於

  少數民族議題的覺醒吧？


  由《與狼共舞》所反映的種族歧視問題，我也不禁聯想，在歐美影片中，華人形象向來被

  扭曲得多麼嚴重，要到哪一天，電影裏的華人角色塑造才會符合真實，被公平看待呢？











  --






  --'
