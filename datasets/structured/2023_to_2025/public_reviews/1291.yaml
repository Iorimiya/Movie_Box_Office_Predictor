url: https://www.ptt.cc/bbs/movie/M.1711958774.A.225.html
title: '[好雷] 下一球，勝利 - 充滿套路卻值得一看'
content: '昨天才陪小孩看完，觀賞之前沒看過任何心得與介紹，只知道是一部喜劇(簡介有寫)。


  不好看的電影我通常會邊滑手機邊看，但這部小品竟然出乎意料的好看。雖然劇情充滿套

  路，但卻全程吸引我認真看完，而且非常適合好勝心強且喜歡運動的孩子觀賞，極具教育

  意義。



  ———-以下有雷———









  故事主要描寫一位求勝心極強但EQ極差的足球教練被分派邊疆到從來沒有贏過比賽的國家

  隊擔任教練。


  大家都知道依慣例一定會有逆轉勝的結果。但只有這樣嗎？不！


  這部戲把每個球員的內心故事詮釋的很好，雖然是部小品，但選角和演技都十分到位，而

  且我是看到最後才知道這是真實故事改編。


  而運動比賽為何會有情緒和壓力，原因就是太在意輸贏，我想這是這部電影想真正表達的

  意義之一。


  --'
