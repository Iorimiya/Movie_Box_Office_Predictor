url: https://www.ptt.cc/bbs/movie/M.1700911779.A.23B.html
title: '[好雷]《下一球，勝利》 學習自我和解'
content: '-

  -

  -

  以下有雷

  -

  -

  -

  不誇張 先說這是我今年看過最感動的電影，沒有之一

  我真沒想過會被這部片這麼打動

  難道這就是超英片大導 Taika Waititi 的魅力嗎 （不是

  （廣告詞甚至用雷神索爾大導重磅回歸 超好笑XD

  一個失意的教練/選手配上一群喜歡足球的樂天遜咖

  但下一球，勝利的療癒程度高更多

  看完甚至會很想立刻查美屬薩摩亞的機票

  感受南太平洋小島的快樂魅力


  麥可法斯賓達在裡面飾演一位暴走教練

  原本以為他就只是個性討人厭的教練

  不能接受失敗與改變 總是一言不合就炸鍋

  但後面才知道原來他是因為喪女

  才開始封閉自己跟搞砸與老婆的感情


  「說真的，湯瑪斯隆根到底去哪裡了？」

  教練女兒留下的一段語音訊息 也完美的貫穿了整個故事

  除了拯救這群永遠無法踢進一球的球隊

  對教練來說 更重要的其實是拯救被痛苦吞噬消失的自己


  看著球隊和教練的成長

  我自己也有了一些頓悟

  我們活在這世上

  本來就會有很多無法控制的事情走向

  就算很努力 也會有可能就還是面臨失敗 甚至更糟的結果

  但是那又如何呢～我們都該跟足球隊可愛的大家一樣

  勇敢接受失敗 因為知道自己從來就不是獨自經歷

  並且該以快樂為優先 盡情的享受在每個當下

  就像是電影的Slogan 「Be Happy」！

  真心推薦給大家這部電影

  看完心情超級無敵好 裡面的太平洋海景也是無敵美麗

  非常適合年末跟好友家人們一起療癒身心～


  --'
