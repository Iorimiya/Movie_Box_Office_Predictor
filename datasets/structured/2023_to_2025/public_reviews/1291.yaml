url: https://www.ptt.cc/bbs/movie/M.1700718421.A.191.html
title: '[好雷]塔伊加維迪提搞笑新作《下一球，勝利》 '
content: '以下有雷～～～～～～～～～～～～～～～～～～～～～～～～～～～～～～～～～

  ～～～～～～～～～～～～

  ～～～～～～～～～～～

  ～～～～～～～～～～～

  ～～～～～～～～～～～～～

  ～～～～～～～～～～～～



  剛看完塔伊加維迪提的《下一球，勝利》

  我個人給8.5分 劇情是根據真實事件改編


  整部片的氣氛卻不沉重

  導演完美呈現了既往的無厘頭搞笑風格 不

  像其他很勵志的運動電影

  通常受到教練鼓勵的時候 士氣應該要被鼓舞

  但美屬薩摩亞隊偏偏不 他們一點都不積極

  教練熱血沸騰地說要和他們一起挑戰登山

  他們be like: 我媽找我有事 我腳踝好痛

  被三催四請才答應 真的很鬧XD

  不過也是這樣的單純的隊伍讓我們了解到

  很多時候輸贏並不是最重要的

  甚至有了得失心以後 可能還更容易失誤

  因為害怕「失敗」的恐懼會讓我們變得更加小心翼翼

  就如同美屬薩摩亞隊伍 在和東加隊比得上半場成績慘不忍睹

  追求勝利的迫切反而讓隊員們壓力太大導致比平常表現得還差


  而且這支隊伍特別的是有跨性別的足球選手-嘉雅

  在美屬薩摩亞 他們稱跨性別為「法法菲妮」

  對他們來說跨性別的人無異於他人

  我很喜歡裡面一個美屬薩摩亞選手說的 「只有綠葉的世界很無聊，而嘉雅就像一堆綠葉

  中的花」

  聽到這句話的時候真的覺得美屬薩摩亞真的是很美好的存在

  我想他們之所以快樂 一定是因為擁有最純粹的愛去看世界

  除了劇情本身以外 我覺得演員也很加分

  雖然和法鯊過去出演角色風格南轅北轍

  但讓他演厭世足球教練真的是把幽默值拉到最頂

  超有章魚哥與海綿寶寶和派大星的即視感(X)

  電影尾聲甚至還放了原本紀錄片的片段

  讓人看了真的很感人以外

  我還要說法鯊真的超還原教練本人。



  總之如果喜歡導演之前《兔嘲男孩》這種詼諧卻不失電影深度風格

  或最近感到emo

  我覺得都非常值得去看

  甚至在戲院裡大家都一直笑 氣氛真的很好

  在輕鬆搞笑的包裝下又藏了一大碗心靈雞湯

  看完後真的會有豁然開朗 心情很好的感覺！



  --'
