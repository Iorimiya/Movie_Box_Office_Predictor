url: https://www.ptt.cc/bbs/movie/M.1701094358.A.265.html
title: '[好雷]下一球，勝利 剛柔並濟的力量'
content: '以下有雷

























  自己最喜歡一個角色，就是Jaiyah Saelua

  在隊內擔任後衛，也是一位在經歷變性過程的fafafine（法法菲妮）

  薩摩亞對於第三性的尊稱

  身為這個魯蛇球隊的一員，他也有參與2001年對澳洲31:0的球賽

  本來對於新教練也不抱有期待跟尊重

  但後來在教練身上看到一絲希望，也跟他拉近了距離

  去把因多年前的淒慘戰績而放棄足球的隊友們找回來

  心思細膩的他可以算是球隊的核心也許技巧不一定是最強的

  但他具有讓大家團聚一心的精神


  當中也有很多地方令人揪心

  像是比賽進行期間他也正面臨轉性的過程

  但持續服用賀爾蒙會導致身體產生變化

  為了在球場有更好的表現他竟然先停藥了

  後續也忍不住在廁所大崩潰，這一段真的有泛淚

  Jaiyah讓我最喜歡的地方就是他的性格，美麗又堅強

  身為第三性運動員後續一定會遇到很多困難

  像是如果真的完成變性過程後，還能繼續在男子隊比賽嗎？

  以及在藥物對身體造成影響的情況下，還是必須跟上大伙們的體力完成比賽


  相信這些困難他一定都預想得到

  即便如此他仍選擇踏上這條完成性別認同的道路

  看到最終比賽所有他的片段

  自己沒有一刻不熱淚盈眶幫他加油，果然也為團隊貢獻了不少分數

  看到最後才知道原來Jaiyah是真有其人

  他真的為薩摩亞足球付出許多心力、並創下佳績的人物

  這真的很激勵人心，感謝他願意站出來展現他的不凡


  後來還看到他在IG上有演員與真實人物的合照

  其他的角色也都很討喜

  推薦大家可以跟家人或另一半來看，看完會想抱抱彼此



  --'
