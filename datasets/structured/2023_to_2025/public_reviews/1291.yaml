url: https://www.ptt.cc/bbs/movie/M.1700925609.A.1F5.html
title: '[好雷] 下一球，勝利 笑中帶淚的魯蛇翻身記 '
content: '雷文防雷資訊頁





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~






  其實本來沒打算看這部


  之前才經過一番金馬影展洗禮


  大推世界末日又怎樣還有When It Melts


  結果被朋友抓去看完後覺得出乎意料的好看！


  集結幽默＋感動的小品


  覺得是近期金馬影展外的療癒好片


  非常喜歡！




  劇情部分就不多加敘述～故事是根據真實事件改編


  從一支全世界最爛的球隊遇上一位被開除的教練開始


  魯蛇對上魯蛇，負負得正一起逆轉劣勢


  雖然有點老套劇情感


  但導演塔伊加維迪提就是喜歡來個幽默的回馬槍




  看完片之後很想真的去美屬薩摩亞看看～


  還稍微估狗了一下怎麼去，光轉機就要兩天了XD


  很羨慕他們天生就有樂天的個性，什麼都可以看的很開


  世上有哪個球隊會不計較輸贏，只要求進一球就好的？


  但又會有醃魚延伸出來的小故事可以發人省思


  搞笑中又帶點哲理




  另外故事的選角我自己也覺得非常好


  好久不見的法鯊飾演的隆根我自己是最喜歡的


  心境的轉折，過程中也是不斷尋找自己人生的解方


  最後他跟球隊一起放下得失心、放下過去


  反而在球場上更開心




  整體看完之後會覺得心情很好的片


  回家時想了一下裡面的劇情


  反而有種輕鬆、心情開闊的感覺


  本來最近因為工作關係心情不好～


  被老闆逼到心情超級煩啊 (完全就跟隆根逼球員一樣XDD)


  看完也開始思考是不是也該幫自己好好放個假了


  讓思緒可以緩和一下、好好休息一下




  冷冷的天看完這部再出來吃個火鍋真的身心療癒～有推！


  --'
