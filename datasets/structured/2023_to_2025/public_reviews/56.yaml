title: '[  有雷] 大婢咒好看'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  有雷有劇情，


  我懶得打字分享了，直接放圖片，昨天看完後馬上寫的觀後文，我很推薦印尼這片，害我

  現在突然在西門町的小七查詢可蘭經什麼的，其實跟任何信仰無關，只要百分百的信任一

  種事物就好，就會有強大的力量，


  劇中被虐待的女僕人跟女主人有一句台詞，你說我是家人，但你看到我被虐待的時候，你

  沒有捍衛過我，你根本就是假裝善良而已，真的超認同。好好看真的，我看我來換一下宗

  教信仰好了，可蘭經跟聖經都只有一本，看完電影後，後勁很強真的，近年來很多電影最

  後都懷疑自己的信仰，特別是薩滿那片，自己懷疑自己是天選的巫師，我看完那片真的。


  不負責任分享完畢。


  --'
