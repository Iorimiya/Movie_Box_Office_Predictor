url: https://www.ptt.cc/bbs/movie/M.1532369646.A.FF0.html
title: '[新聞] 德導魏姆斯的林昶佐紀錄片 柏林首映反應熱烈'
content: '德導魏姆斯的林昶佐紀錄片 柏林首映反應熱烈[影]


  發稿時間：2018/07/23 13:54最新更新：2018/07/23 14:17


  （中央社記者林育立柏林22日專電）德國導演魏姆斯以立委林昶佐為主角的紀錄片「台灣

  政治重金屬」（Metal Politics Taiwan），21日晚在柏林首映，現場觀眾踴躍發問，反

  應十分熱烈。


  現年52歲的魏姆斯（Marco Wilms）出身東德，柏林圍牆倒後開始拍片，對藝術家和叛逆

  的題材特別感興趣。


  魏姆斯說，林昶佐身為閃靈樂團主唱，在舞台上非常有魅力，選上立委後，又以挑釁的主

  張受到注目，可說是太陽花運動後崛起的代表性人物，因此想用他來紀錄太陽花運動後台

  灣的改變。


  魏姆斯前後跟拍了一年，不僅拍到林昶佐在選區跑行程和在立法院問政的實況，還跟著他

  到印度拜訪達賴喇嘛，到紐約推動台灣加入聯合國，以及到華府參加美國總統川普的就職

  典禮。林昶佐擅長用音樂表達政治理念，片中也穿插了不少閃靈演出的片段。


  林昶佐在映後座談表示，魏姆斯拍片其實打擾到他的工作，他原本想說不要再拍下去了，

  不過魏姆斯一再求情，計畫才得以延續。


  「台灣政治重金屬」的主題是太陽花世代和緊繃的兩岸關係，各國觀眾相當關心台灣的情

  勢。林昶佐說，比起西藏和香港人受到的壓迫，台灣人應該對未來樂觀，台灣的存在能鼓

  舞世界上許多人，象徵的是希望。


  林昶佐長年關心人權議題，在立法院成立台灣國會西藏連線，他還特地稱讚德國總理梅克

  爾有勇氣，與中國打交道時不忘人權。


  閃靈樂團參加過德國的重金屬重鎮瓦肯音樂祭（Wacken Open Air），在德國有一定知名

  度，柏林首映現場因此來了不少樂迷，大家踴躍發問，映後座談長達一個小時。


  「台灣政治重金屬」是由德法合資的歐洲藝術電視台（Arte）與德國第二電視台（ZDF）

  聯合出資，5月在台北城市遊牧影展放映時曾獲觀眾票選獎，預計年底在歐洲藝術電視台

  播放。


  不過，到目前為止，還沒有台灣片商願意代理這部片，讓魏姆斯相當失望，他推測應該與

  台灣片商怕被中國抵制有關。（編輯：屈享平）



  左起：駐德代表謝志偉、德國導演魏姆斯、立法委員林昶佐，參加紀錄片「台灣政治重金

  屬」在柏林的映後座談會。中央社記者林育立柏林攝 107年7月23日



  --'
