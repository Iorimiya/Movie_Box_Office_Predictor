url: https://www.ptt.cc/bbs/movie/M.1626192078.A.89C.html
title: '[新聞] 凱文費吉：新角色的熱烈迴響讓漫威很開心'
content: '凱文費吉：新角色的熱烈迴響讓漫威很開心





  漫威第四階段計劃先後推出了許多全新角色，一再引起觀眾熱烈迴響，而凱文費吉也對此

  笑得合不攏嘴。



  儘管在疫情肆虐之下，漫威電影宇宙長達兩年沒有新片問世，但在「汪達與幻視」、「獵

  鷹與酷寒戰士」、「洛基」等影集輪番上陣之下，反倒為漫威開出了另一片天，甚至在元

  老班底一一高掛披風之後，還能有新角色承接起這份重擔。




  從「阿嘉莎哈克尼斯」凱瑟琳哈恩、「莫尼卡蘭博」媞優娜佩瑞斯、「約翰沃克」懷特羅

  素、「伯爵夫人」茱莉路易絲卓佛、「莫比烏斯」歐文威爾森到「希維爾」蘇菲亞迪馬提

  諾，這些全新角色在在贏得了粉絲的芳心，而凱文費吉也對這份豐碩成果極為滿意。




  他向爛蕃茄網站表示：「看到觀眾對那些意料之外的角色有所反應，尤其是他們從未要求

  想見到的那些角色──我不敢說有一群人急著敲門，要求阿嘉莎哈克尼斯非得在漫威電影

  宇宙登場亮相不可，但她是一名很棒的角色，由一名很棒的演員所飾演。」




  「早在『汪達與幻視』前幾集，人們就開始詢問：『她什麼時候還會登場亮相？她還會作

  哪些事？』而同樣狀況也出現在『獵鷹與酷寒戰士』的約翰沃克和『洛基』的莫比烏斯身

  上。所以」




  「漫畫中描繪了許多驚人角色，以及他們長達數輩子的故事。而當你找到最適合的演員來

  飾演時，

  」




  在這些新角色之中，「莫尼卡蘭博」媞優娜佩瑞斯已確定會在

  中登場亮相，「約翰沃克」懷特羅素和「伯爵夫人」茱莉路易絲卓佛則似乎在籌組雷

  霆特攻隊或黑暗復仇者，其他角色則還沒有進一步計劃。但唯一可以確定的是，即便少了

  鋼鐵人和美國隊長，但漫威電影宇宙的未來仍然一片光明。




  圖片：網路


  --


  最新報導已在招募員工、Disney+近日已有台配與繁中選項～快了～～'
