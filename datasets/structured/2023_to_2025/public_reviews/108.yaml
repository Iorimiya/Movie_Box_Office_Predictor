url: https://www.ptt.cc/bbs/movie/M.1464701270.A.05D.html
title: '[新聞] 駐加代表處電影欣賞會 氣氛熱烈'
content: '（中央社記者張若霆多倫多30日專電）駐加拿大台北經濟文化代表處與渥太華亞裔傳統月

  協會及渥太華市立圖書館29日在渥太華市Ben Franklin Place視聽室舉辦台灣電影「甜．

  祕密」（Together）欣賞會，氣氛熱烈。


  電影欣賞會由駐加代表吳榮泉主持，僑團領袖及主流社會人士約170人出席。


  電影放映前，代表處提供茶點招待，現場並陳列總統蔡英文及副總統陳建仁的英文簡歷、

  Taiwan Review專題報導抽印本等520就職文宣及台灣觀光資料，觀眾取閱一空。


  渥太華市議員加吉希（Michael Qaqish）應邀致詞時強調加國重視多元文化，亞裔為渥太

  華市重要族裔之一，感謝代表處及亞裔傳統月協會舉辦慶祝活動，藉電影欣賞增進各族裔

  間的理解，並代表市長華森（JimWatson）頒發賀狀給吳榮泉。


  吳榮泉致詞時感謝亞裔傳統月協會邀請台灣參加亞裔文化節相關慶祝活動，並感謝加國友

  人及僑胞踴躍出席。


  吳榮泉強調，台灣自13世紀漢人跨海移居台灣後，與原住民文化融合，1895年中日甲午戰

  爭失敗，清廷割讓台灣予日本，1949年大陸淪陷，軍民隨中華民國政府播遷來台，將大陸

  各省文化及美食帶入台灣，最近30年台灣再吸納數十萬名來自東南亞及大陸的外籍新娘，

  各種文化不斷發揚光大，此一現象也反映在台灣每年30至50部新電影中。


  吳榮泉也提到過去5年中有3部台灣電影與日本統治時期有關，分別為「賽德克．巴萊」、

  「KANO」及「灣生回家」。


  「甜．祕密」是文化部「台灣電影工具箱」推薦的影片之一，由台灣新銳導演許肇任2012

  年執導的愛情喜劇片，曾入選2012年釜山影展、溫哥華影展及金馬獎國際影展開幕片，

  2013年入選柏林影展及香港國際影展，並榮獲當年第50屆金馬獎最佳新導演、最佳新演員

  及最佳原創電影歌曲3項提名，演員陣容堅強，包括鍾鎮濤、李烈、隋棠、李千娜、馬志

  翔及黃劭揚等。


  亞裔傳統月協會主席Alek Choo讚揚駐加代表處舉辦電影欣賞會成功，出席情形踴躍，並

  提供可口茶點，為本屆亞裔傳統月慶祝活動劃下圓滿句點。


  新聞網址：


