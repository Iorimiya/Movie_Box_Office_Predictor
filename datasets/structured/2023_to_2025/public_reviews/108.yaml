url: https://www.ptt.cc/bbs/movie/M.1682644873.A.C95.html
title: '[新聞] 神導諾蘭親現身獲最熱烈掌聲！曝《奧本'
content: '神導諾蘭親現身獲最熱烈掌聲！曝《奧本海默》片段「必須親眼見證」


  新聞網址：



  〔記者許世穎／綜合報導〕由「神導」克里斯多夫諾蘭執導新片《奧本海默》，預計7月

  在全球上映，諾蘭今（27日）親自現身「CinemaCon電影博覽會」，並放映該片5分鐘片段

  ，外媒更形容他是今年大會獲得最熱烈掌聲的人。



  克里斯多夫諾蘭出席CinemaCon，曝光《奧本海默》最新片段。（翻攝自推特）


  諾蘭本身就是大銀幕的堅定支持者與信徒，在疫情期間他也推出大片《天能》救市，因此

  現身充滿戲院業者們的CinemaCon受到熱烈歡迎，提到新片《奧本海默》，他自信表示「

  據我所知，沒有哪部電影比《奧本海默》有著更強戲劇性、更高風險以及更多曲折。」


  提到拍攝原由，諾蘭說之所以想講述奧本海默的故事，是因為他的一生與當今人類所生活

  的世界息息相關，「無論你認同與否，羅伯特奧本海默是人類歷史上最重要的人物，他為

  我們現今生活的世界帶來了好壞兩面的影響，他的故事必須親眼見證。」



  小勞勃道尼在《奧本海默》飾演美國原子能委員會主席路易斯史特勞斯。（UIP提供）


  發布會上也放映了一段5分鐘的《奧本海默》片段，小勞勃道尼飾演的美國原子能委員會

  主席路易斯史特勞斯，在片段中曝光俄國人在研究原子彈的消息，更質疑奧本海默是否通

  敵，而席尼墨菲飾演的奧本海默在製造原子彈的過程中也面臨著道德問題更自我質疑：「

  我不知道我們能不能測試這項武器，但我知道納粹不行。」


  電影不會將奧本海默或是他的一生給予簡單直接的結論或答案，諾蘭強調自己的目標是把

  大家放在奧本海默的位置上，去面對當代歷史最為重要的決定以及時刻，瞭解他的思想，

  「在奧本海默的故事裡找不到簡單的答案，他的故事，既是夢想，也是夢魘。」



  席尼墨菲在《奧本海默》飾演羅伯特奧本海默。（UIP提供）


  《奧本海默》將於7月21日在台上映，電影由諾蘭自編自導，是以IMAX攝影機拍攝的史詩

  驚悚片，觀眾將看到一個謎一般的男人是如何陷入一個自相矛盾的困境，他為了拯救這個

  世界，必須先毀滅它。當被問到新預告何時會曝光，諾蘭也語帶暗示的表示：「我不能證

  實或否認，我們將在下週隨著《星際異攻隊》（應為第三集）放映，推出新的預告片。」


  --'
