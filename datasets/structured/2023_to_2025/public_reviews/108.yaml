url: https://www.ptt.cc/bbs/movie/M.1508943527.A.0BE.html
title: '[新聞] 倫敦東亞電影節 台灣之夜反應熱烈'
content: '（中央社記者戴雅真倫敦24日專電）第2屆倫敦東亞電影節今天舉辦「台灣之夜」，播放

  黃惠偵導演的「日常對話」及盧謹明的「接線員」，現場座無虛席，反應熱烈，更有不少

  觀眾感動到熱淚盈眶。


  台灣今年有3部電影入圍第2屆倫敦東亞電影節（London East Asia Film Festival），其

  中「日常對話」及「接線員」入選「女性故事」單元；「接線員」與新生代導演程偉豪的

  「目擊者」另入選「競賽片」單元。


  駐英代表處今年與影展單位合辦「台灣之夜」，特別邀請兩名女導演黃惠偵與盧謹明於放

  映後與觀眾座談，分享創作歷程。中華民國駐英國代表林永樂、駐英代表處文化組組長賴

  秀如等人與會。


  林永樂致詞表示，對今年入選影展的台灣電影感到驕傲，這些電影都受到國際高度肯定，

  得到許多獎項。他也要感謝影展策展人田惠晶，第2屆倫敦東亞電影節獲得很大成功，相

  信未來會持續舉辦。


  已在柏林影展拿下最佳紀錄片泰迪熊獎（TeddyAward）的「日常對話」，將代表台灣角逐

  第90屆美國影藝學院獎（奧斯卡）外語片。


  黃惠偵今晚接受中央社記者訪問表示，台灣一直沒有把紀錄片視為一種電影，有趣的是，

  在推選「日常對話」角逐奧斯卡之後，還是有人會說「紀錄片到底憑什麼代表？」這次也

  許是一個機會，讓大家重新思考電影是什麼。台灣今年推派一部紀錄片，對於台灣電影產

  業的意義，可能大於對她個人的意義。


  她也提到，「日常對話」在多國放映，但其實觀眾反應都很類似。這部片某種程度上跨越

  文化、語言隔閡，不論歐洲、日本或台灣觀眾，看完之後的回饋其實都很接近，因為這部

  片就是在講人，尤其是家人的關係，以及家人之間溝通的困難，這顯然是不論生長在什麼

  地方都會經歷的事情，因此觀眾都很理解。?


  對於有越來越多優秀女性導演，黃惠偵表示，電影環境其實非常「雄性」，多一些女性創

  作者肯定是好事，「有些事情得要我們自己來講」，尤其男性、女性已經相處這麼長時間

  ，到今天還是有人說搞不懂女人在想什麼，「如果你搞不懂，那就聽聽我們自己講的故事

  ，讓我們來告訴你」。


  「日常對話」紀錄黃惠偵和同志媽媽之間的對話，坦誠面對家族記憶與個人傷痕。片中，

  兩人在餐桌對坐淚訴的經典畫面，讓在場不少觀眾感動落淚。也有觀影民眾表示，黃惠偵

  在片中詢問舅舅和阿姨是否知道媽媽的性傾向，他們都在否認後試圖轉移話題，令她回憶

  起自已多年前的出櫃經驗，相當有共鳴。


  獲得紐約亞美影展新銳導演獎的盧謹明所執導的「接線員」則是改編自真實故事，由金馬

  影后陳湘琪、紀培慧主演，講述找不到工作的女留學生，到情色按摩院打工當接線員，所

  見證的異鄉生存處境。盧謹明從編寫劇本、籌募資金，到電影製作完成，前後花了6年時

  間。


  片中飾演按摩院老鴇「莉莉」的女演員卓見出席座談會表示，當初接下劇本時，發現角色

  和她差別太大，一度擔心是否能勝任，但最後仍勇於挑戰接下角色。飾演按摩女「安娜」

  的滕爽則說，劇中暴力場景的拍攝氣氛其實相當輕鬆，因此看到最後成果感到十分震撼。


  陳湘琪日前以歷經風霜的按摩女子「莎莎」一角，入圍第54屆金馬獎最佳女配角。談到邀

  請陳湘琪進入劇組，盧謹明表示，因為「莎莎」穿著比較裸露，又要在不熟悉的倫敦拍攝

  ，真的花了相當多時間說服陳湘琪。陳湘琪一度似乎想打退堂鼓，「我假裝沒聽見」，最

  後終於成功說服陳湘琪參演。


