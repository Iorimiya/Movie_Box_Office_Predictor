url: https://www.ptt.cc/bbs/movie/M.1493479655.A.3BD.html
title: '[新聞] 魏德聖52赫茲倫敦獻映 反應熱烈'
content: '（中央社記者戴雅真倫敦29日專電）台灣導演魏德聖新作「52赫茲我愛你」28日在倫敦獻

  映並舉辦座談會，反應熱烈，場中多次爆發大笑聲，場後掌聲久久不停。


  英國台灣商會與中華民國旅英同學總會在倫敦大學學院舉辦「52赫茲我愛你」獻映暨座談

  會，吸引約300人參加。也有人帶著「賽德克‧巴萊」等作品與魏德聖合影，現場瞬間變

  成粉絲見面會。中華民國駐英國代表林永樂也攜夫人余坤慈到場。


  魏德聖開場致詞表示，他常說，這部電影是一道甜點，不是大餐而是下午茶，希望大家以

  享受吃甜點、喝咖啡的心情來看，會更愉快，不要期待有什麼大的歷史文化包袱，而是一

  部很輕鬆的音樂劇。


  觀影氣氛果然如魏德聖所言十分愉快，其中台北市長柯文哲客串證婚等片段，多次爆發笑

  聲。


  魏德聖映後表示，「自己人看果然不一樣」，先前在義大利獻映，外國人都沒有什麼反應

  ，可能是英文比較難翻譯出中文的意境。


  會後座談會同樣發言踴躍，觀眾都表示有共鳴。


  對於本片採取音樂劇，魏德聖表示，一開始就是設定情人節一天的故事，因此選擇用很多

  角色串連，而不是拉長時間描述一對男女之間的故事。然而，太多角色可能讓故事太過簡

  單，所以才用音樂劇形式來表現，利用歌詞的魅力來加強角色的厚度，這也是音樂劇迷人

  之處。


  他也提到，這部電影光是歌曲的前製期就花了8個月，他先在需要歌詞的地方寫個大綱，

  以他想要的概念完成歌詞後，再由創作者搭配歌詞寫曲，然後找演員、拍攝，順序和一般

  電影完全相反。


  此外，片中演員李千娜、張榕容詮釋一對參加聯合婚禮的女同志。


  談到對同性婚姻的看法，魏德聖表示，老實說他沒有智慧去處理法律問題，但他認為，「

  愛情是什麼？愛情就是我愛你，你愛我。這才是最重要的，不是嗎？」法律問題留給法律

  去解決，「我愛你，你愛我」這種事情，應該留給大家來祝福才對，而不是留給大家來反

  對。


  新聞網址：


  --'
