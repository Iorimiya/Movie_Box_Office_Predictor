url: https://www.ptt.cc/bbs/movie/M.1432475735.A.CBD.html
title: '[新聞] 易智言電影倫敦首映 獲熱烈好評'
content: '（中央社記者黃貞貞倫敦23日專電）由台灣導演易智言執導，獲得2014年台灣金馬獎最佳

  原創劇本獎的電影「行動代號孫中山」，日前在倫敦華語視像藝術節首映，探討貧富不均

  的深層主題，獲得觀眾高度好評。


  「行動代號孫中山」安排在倫敦國王學院（King’s College）舉行的閉幕式播映，吸引

  數百名觀眾到場，電影結束後現場掌聲如雷，之後的交流活動觀眾也踴躍發問，反應十分

  熱烈。


  易智言接受中央社專訪時表示，這是他第一次帶作品到倫敦參加影展，台灣電影能遠渡重

  洋到英國播放並非易事，很多英國年輕人不喜歡看有字幕的外國電影，「行動代號孫中山

  」在倫敦放映非常難得，希望藉由影展多了解英國和倫敦觀眾的喜惡，也透過電影讓英國

  的觀眾多認識台灣。


  他說，「行動代號孫中山」表面上是一部喜劇，描述一群高中生因為缺錢將腦筋動到放在

  學校儲藏室裡的孫中山銅像，把銅像當廢鐵賣了換些錢解決當下之急，但電影深層探討台

  灣貧富不均的狀況，這個情況不止在台灣，在亞洲、歐洲、美洲都在談論這個問題。


  易智言希望透過這部電影顯示台灣目前面臨的問題，讓英國觀眾了解台灣的狀況，不僅在

  台灣，英國也有貧富不均的問題，希望大家共同面對這個問題，並獲得歐洲觀眾的共鳴。


  「行動代號孫中山」是易智言執導的第4部電影，他表示，自己非為藝術而藝術，作品與

  創作都有使命感，受傳統的儒家思想影響，文以載道，必須有所感觸與感動，有了想法才

  會去寫劇本拍成電影，以最誠實最好的方式呈現給觀眾。


  被問到下一部電影的計畫，易智言說，3年前已開始著手片名為「廢棄之城」的動畫片，

  是有關1名15歲少年的冒險故事，在逃離廢棄之城的過程中，他了解到自己何去何從，發

  現存在的價值與意義及安身立命的故事，片中的城市原始概念來自台北，最快2016年底

  2017年初上映。


  第3度到倫敦訪問，易智言表示，倫敦在藝術創作上扮演領頭羊的地位，社會與其它議題

  上也領先開發其它人未看到的現象，每次到倫敦他都會參觀博物館和藝廊，了解新方向為

  何，總能在意識型態和觀念上獲得一些啟發。


  新聞網址：


  --'
