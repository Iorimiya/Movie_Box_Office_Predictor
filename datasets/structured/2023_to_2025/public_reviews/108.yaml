url: https://www.ptt.cc/bbs/movie/M.1483793427.A.FF9.html
title: '[新聞] 清奈影展播放台電影志氣 觀眾反映熱烈'
content: '（中央社記者康世人新德里6日專電）印度第14屆清奈國際影展今天下午在清奈城市中心

  商場放映台灣電影「志氣」，吸引大批印度民眾觀賞，掌聲連連，反映熱烈。


  第14屆清奈國際影展（Chennai InternationalFilm Festival）從5日起到12日在清奈市

  舉行，主辦單位「印度電影欣賞協會」並於6日下午在清奈城市中心（City Center）商場

  的INO電影院放映「志氣」這部台灣勵志電影。


  駐清奈辦事處處長李朝成特別於開映前向印度觀眾介紹「志氣」的內容大綱，強調這是真

  實故事改編，也由於這個真人真事的啟發，鼓勵台灣代表隊陸續在國際比賽中連續贏得冠

  軍。


  李朝成告訴現場印度觀眾，清奈國際影展9日還將放映另一部台灣電影「大稻埕」，歡迎

  踴躍前往觀賞，並藉此瞭解台灣的歷史文化背景。


  主辦單位「印度電影欣賞協會」秘書長湯格瑞吉（E. Thangaraj）也在現場特別感謝台灣

  每年支持和贊助清奈國際影展活動，且推薦優良台灣電影參展。


  「志氣」是以景美女中拔河隊的真人真事改編，由「瑤瑤」郭書瑤主演，情節勵志感人，

  郭書瑤並以這部電影奪下第50屆金馬獎「最佳新演員」獎。


  電影放映後，觀眾掌聲連連，反映熱烈，20多名印度觀眾甚至趨前向李朝成握手致意，稱

  讚這部電影感人肺腑，且透過電影瞭解台灣女高中生奮鬥不懈終於獲得世界拔河冠軍的精

  神，非常敬佩。


  本屆清奈國際影展原訂2016年12月舉行，但正逢印度坦米爾那都省（Tamil Nadu）省長賈

  雅拉莉妲（J.Jayalalithaa）病逝，以及清奈受到熱帶氣旋侵襲而延到今年舉辦。


  這次影展共有來自52國150部電影參展，分別在清奈市的5大電影院輪流放映。


  台灣從2011年起已連續6年以優良國片參展，並透過參加影展向南印度觀眾介紹台灣不同

  文化面貌。今年共有「志氣」和「大稻埕」兩部電影參展。


  新聞網址：


  --'
