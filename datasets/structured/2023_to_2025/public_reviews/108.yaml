title: '[新聞] 美國隊長對台灣粉絲催票！預售熱烈展開'
content: '局勢緊繃前所未見！《美國隊長：無畏新世界》預售熱烈展開


  2025/02/05

  自由時報

  記者許世穎




  漫威電影宇宙開春首部鉅作《美國隊長：無畏新世界》倒數一週登場，新任「美國隊長」

  安東尼麥基，展現滿滿誠意，他強調：「無論

  你是否為漫威粉絲，本片都將是全新章節！」更預告漫威電影宇宙的局勢緊繃程度前所未

  見，喊話要粉絲作好準備。


  以科幻大片《科洛弗悖論》等片廣獲好評的新銳導演朱利斯歐納對於本片信心十足：「在

  漫威電影宇宙超越時空又充滿奇幻的發展走向後，本片雖然回到返璞歸真的『』

  ，卻也回歸漫威以超棒角色為本的原始精神，具備更能觸動人心的強大力量！」




  片中超強卡司和導演近日也馬不停蹄的展開盛大的宣傳之旅，包括安東尼麥基、哈里遜福

  特與「新任獵鷹」丹尼拉米瑞茲轟動羅馬、馬德里和倫敦等地，美隊盾牌和紅浩克巨手終

  極對決成最大亮點。


  《美國隊長：無畏新世界》將於2月12日在台上映，預售票也於今（5）日全面開賣，






  --'
