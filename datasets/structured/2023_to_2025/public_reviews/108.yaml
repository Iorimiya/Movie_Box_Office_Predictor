title: '[新聞]《那張照片裡的我們》高雄特映迴響熱烈　'
content: '《那張照片》高雄特映迴響熱烈　「愛情包裹歷史，更有溫度


  【洪藝晅、朱愷元／高雄報導】


  台韓愛情電影《那張照片裡的我們》現正全台戲院熱映中，由客家公共傳播基金會（簡稱

  客傳會）出品，今（9）天晚間特別於高雄舉辦包場特映會，邀請長期支持客家文化的貴

  賓走進戲院，透過振永、李沐與宋柏緯三位主角的青春視角，回望1977年撼動台灣民主化

  的「中壢事件」，從愛情敘事中凝視民主發展的重要時刻。


  週五夜晚的港都格外熱情，影廳尚未整理就緒，受邀前來的嘉賓早已在場外熱絡交談，氣

  氛輕鬆而期待。「電影內容不是很了解，不過我大概知道這是一個愛情故事。」


  長期捐助客傳會的劉小姐笑著說道，來自屏東內埔的她，特別提到能在大銀幕上聽見主角

  說著客家話，令她感到格外動容。


  兩小時放映一結束，影廳內隨即響起掌聲，給予這部電影最熱烈的回應。高雄市政府客家

  事務委員會主委楊瑞霞及高雄市議員張博洋也讚不絕口，眾人合影喊道「當會喔」、「蓋

  登真」；高雄師範大學客家文化研究所教授洪馨蘭化身「超級影迷」，直言已看過一次，

  今天特別來二刷繼續支持。



  邀請到許多南部的客家貴賓觀影。朱愷元攝



  劉小姐（左）與北美台灣客家公共事務協會會長曾振寧（右）鼓勵客傳會，表示有了這個

  開始，才能繼續下去。朱愷元攝


  客傳會總經理莊勝鴻在映前致詞時表示，《那張照片裡的我們》是客傳會成立6年以來推

  出的第一部電影作品，從籌備到拍攝歷時4年多「這中間其實充滿了很多坎坷。」


  他表示，電影中約有80%的語言是使用客語，希望透過商業元素與愛情題材，讓客家話重

  新回到台灣主流市場，「用比較商業的方式，讓台灣人、年輕人都可以接受。」


  莊勝鴻強調，電影看起來是一段青春愛情故事，實際上卻隨著角色生命歷程，帶領觀眾了

  解台灣重要的民主發展節點——1977年中壢事件。


  「我想不管是美麗島世代、野百合世代，或是太陽花世代等等，看了這部電影都會有很多

  共鳴。」



  客傳會總經理莊勝鴻表示這部作品製作過程經歷了許多努力，十分感謝南部鄉親到場觀影

  。朱愷元攝



  觀影後盛讚電影。朱愷元攝


  同為長期捐助客傳會之友的北美台灣客家公共事務協會會長曾振寧，也分享了深刻感受。

  他提到，過去曾看過《1895乙未英烈—徐驤》，再看到《那張照片裡的我們》中這些角色

  ，感嘆說：「都算是我的前輩。」隨著電影情節推進，也彷彿成為其中一份子。


  對於客語能在大銀幕上被如此呈現，他直言非常親切，更鼓勵客傳會持續投入，「客家有

  這個開始，就能繼續走下去。」


  講客廣播電臺主持人暨屏東山林文史工作者的蔡森泰指出，電影中火燒分局的場景，對許

  多人而言可能過於震撼，但卻是他人生的一部分。「我們這一輩很多朋友都走上社會運動

  ，經歷過520農民抗爭，也參與過反對刑法100條。」他感嘆道，戒嚴年代的抗爭充滿風險

  ，「能一路走到現在，還能坐在戲院裡看這部電影，真的很不容易。」



  講客廣播電臺主持人暨屏東山林文史工作者蔡森泰說到自己經歷過那個年代，看到電影回

  憶起來整個人都雞皮疙瘩。朱愷元攝


  來自屏東的客家電子樂團「火焰蟲」（Flame Bug）主唱利眉瑩表示，電影以感情包裹歷

  史，讓沉重的事件多了一層溫度，「在看歷史事件的時候，顯得沒有那麼殘酷，反而有一

  份溫暖。」


  她坦言，在觀影前其實並不熟悉中壢事件，因為成長於南部，對美麗島事件比較了解，不

  過片中女主角賢英對男主角金教練說出「今天發生的事情，我要用眼睛看清楚」那一幕，

  讓她特別有感，「我覺得這也反映到我們現在這個時代，當發生那麼多事情，我們都要用

  我們自己的眼睛去理解，去留下那個場景。」



  火焰蟲主唱利眉瑩觀影後表示，我們都要用我們自己的眼睛去理解，留下那個場景，看完

  真的很感動。朱愷元攝


  佳冬鄉公所機要秘書張孟偉表示，聽到角色自然說著客語，直呼「有夠親切」，加上動人

  愛情線，看完甚至忍不住眼眶泛淚。他回憶片中深刻橋段，是橋下金教練要帶著賢英離開

  現場，而賢英卻要留下來，金教練內心糾結的瞬間。



  佳冬鄉公所機要秘書張孟偉聽到主角說客語感覺十分親切，加上愛情故事真的很感人，看

  到哽咽。朱愷元攝


  《那張照片裡的我們》由客家公共傳播基金會與瀚草文創GrX Studio出品，並由客家委員

  會媒合，獲得文化內容策進院內容開發專案計畫—前期開發支持，另獲桃園市政府文化局

  114年度補助影視製作。


  電影講述1977年時的中壢照相館攝影師賢英（李沐飾）、韓國跆拳道教練金浩熙（振永飾

  ）與熱血青年弘國（宋柏緯），三人在動盪年代裡，因一場選舉掀起不平靜風浪，交織的

  青春、愛情與友情故事，已於12月24日全台上映，現正熱映中。





  新聞網址：



  --'
