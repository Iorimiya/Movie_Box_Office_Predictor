url: https://www.ptt.cc/bbs/movie/M.1680107380.A.580.html
title: '[新聞] 【守護黑面琵鷺】劉克襄文章引發熱烈討論'
content: '新聞網址：



  還未正式上映，便靠包場與團票獲得破百萬票房佳績的生態紀錄片《守護黑面琵鷺》，目

  前已在全台戲院熱映當中。本片為執導過《老鷹想飛》的台灣生態紀錄大師梁皆得，橫跨

  30年、遍歷多國，全紀錄黑面琵鷺與守護牠們的熱血人士的作品。對於電影終於上映，導

  演有感而發地說：「生態紀錄片上戲院，看起來風光，但其實是吃力不討好的事。這部紀

  錄片想呈現的，是一個人對黑琵如何的熱愛，30年來在幾乎沒有政府經費的支援下，出國

  近百趟、跑遍有黑琵的國家與地區，雖然歷經種種不幸事件，但為的就是紀錄黑琵的美麗

  ，及隱藏在背後的環境危機。」黑面琵鷺雖是台灣人耳熟能詳的鳥類動物，但隨著本片的

  上映，讓大家震驚的，是目前黑面琵鷺仍為「全球瀕危物種」之一，讓全球各地區的學者

  專家，不分國界一同為這群「國際嬌客」以及生存棲地盡心盡力。劇組今天再度釋出番外

  篇影像（），邀請到擁有「鳥人」稱號的知名作家、現任

  中央社董事長劉克襄，描述他曾為黑面琵鷺請願，寫下〈最後的黑面舞者〉一文的創作歷

  程，引起當時各界熱烈討論。





  雖然黑面琵鷺數量近年來都有保持穩定成長，但棲地逐漸流失，仍是威脅著牠們生存的最

  大難處。棲地的保育與土地開發兩端的拉扯，也依然是難解問題。前中央研究院研究員劉

  小如老師便表示：「即使大家再努力，也無法讓溼地的面積有大幅度的增加，我們唯一能

  夠期許的，就是讓目前的溼地不再減少，讓目前溼地的品質只有改善沒有惡化。」而在劇

  組今日釋出的「番外篇」影像中（），也收錄「鳥人」劉

  克襄所寫〈最後的黑面舞者〉的創作歷程。該篇文章於1994年於中國時報發表，文中以歷

  史與數據佐證，文情並茂書寫出黑面琵鷺所面臨的困境，震撼民眾、保育人士甚至政府單

  位。談起當初的創作緣起，劉克襄分享：「我希望這篇報導，不是一般那種呼籲要保護鳥

  類的簡單論述，我希望能夠有更多自然制的Data Base來爬梳，作為充分的證據。」他更

  進一步補充：「如果不用自然制的書寫，不把這些歷史東西放進來的話，會沒有力量去說

  服大家，所以我在寫的時候，就把這些放進來一再提醒，也引用了國外數據，提醒大家全

  世界剩下300多隻不到，有二分之一以上在台灣棲息，這是一個多麼難得的紀錄，若這些

  濕地都沒有了的話，牠們還能夠去哪裡？」



  而目前黑面琵鷺全球前三大的棲息地之一的高雄茄萣濕地，其開發爭議從2009年至今，也

  尚未能被妥善解決，梁皆得導演表示：「溼地最重要的是人為的經營管理，我們很常認為

  保護區劃完就好了、不用再動，但其實並不然，如果沒有好好經營，很多濕地到最後情況

  都會變得不好。」同樣地，嘉義布袋鹽田濕地，目前也有大片地區已經逐步設置太陽能光

  電場，梁皆得導演也對此呼籲：「我們仍需要用電，綠能也還是要開發，但應該避開生態

  敏感區，很多濕地對人類來說，是沒有用的荒地，但對候鳥而言便完全不同。」



  這部由《老鷹想飛》、《尋找神話之鳥》導演梁皆得，跨越30年、遍歷多國拍攝最新紀錄

  片《守護黑面琵鷺》，目前正在全台隆重獻映當中。本片描述1992年歲末，一群黑面琵鷺

  在台南七股遭到不明人士惡意槍殺，引發全台民眾高度矚目。當時奉派採訪的攝影家王徵

  吉，自此走上長達三十年的守護黑面琵鷺之路。在當年，全世界黑面琵鷺的總數只有不到

  300隻，這個瀕危物種獲得來自許多國家的關注。不同領域的愛鳥人，以跨國合作的用心

  ，為開拓黑面琵鷺的生存空間披荊斬棘。其中的奉獻者包括學者、繪本作家、賞鳥人、基

  層公務員、養殖業者，以及更多的無名英雄，每個人都有自己的私房黑面琵鷺故事。而專

  情黑面琵鷺三十年的王徵吉，即使經歷喪妻、罹癌等生命逆境，也仍不改其志。如今，全

  球黑面琵鷺數量已經超越6000隻，但牠們並非就此高枕無憂，保育之路仍然持續繼續下去

  …。


  電影包場及團票訂購請洽「采昌國際多媒體」洪先生（電話：02-2658-8868#8505；手機

