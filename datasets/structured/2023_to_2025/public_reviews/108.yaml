title: '[新聞] 金雞獎又撞金馬！名單至今未公布　先熱烈票選海報設計'
content: '新聞網址：



  第34屆中國電影金雞獎又辦在跟金馬獎同一時間，11月25至28日在廈門舉辦，金馬獎則是

  在27日登場。不過，金雞獎遲至此時都尚未公布入圍名單，據悉可能拖到下周才會公布。

  現在，他們在票選金雞獎的海報，因為過去的海報實在缺乏設計感被人詬病。


  金雞獎目前很熱烈在進行海報設計的環節，從5月23日開跑，向大眾徵件，經過初選，中

  國電影家協會公布了最後入選的13張作品，其中，一張白色底彩色身的「雄雞凝視」在先

  前受到網路很多討論，入圍決選也成話題，有網友說：「在這一堆裡面異常突出。」也有

  網友似乎描繪出其創意：「有種意味深長詼諧。」


  去年的金雞獎同樣在廈門舉辦，評審請到金馬影帝劉德華及徐崢等人參與，影帝最後由《

  烈火英雄》的黃曉明擊敗《少年的你》易烊千璽獲獎；周冬雨則以《少年的你》得到金雞

  影后。


  有趣的是，今年金雞獎又想設立，前陣子在微博上冒出「本屆首次新增最佳外語片」的新

  聞和消息，似乎想拉抬聲量。不過，據查在去年的中國媒體報導，金雞獎早在去年就曾增

  設外語片獎項，也許因為報名量太少，公布入圍名單時，以「本屆暫時空缺」草草帶過外

  語片項目。今年捲土重來，又想增加這個獎；但是，需符合中國當局的審查規定且曾在中

  國上映過的才能報名，數量大幅減少。




  --'
