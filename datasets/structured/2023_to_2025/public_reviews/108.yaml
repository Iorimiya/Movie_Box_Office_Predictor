url: https://www.ptt.cc/bbs/movie/M.1508856814.A.1B5.html
title: '[新聞] 台灣電影雙年展 產業座談討論熱烈'
content: '（中央社記者曹宇帆洛杉磯23日專電）「你那邊幾點？第一屆台灣電影雙年展」舉行產業

  座談會，安排業界與學術界人士熱絡交流，爬梳台灣電影在全球電影市場的過去、現在與

  未來。


  洛杉磯台灣書院表示，「全球電影市場中的台灣」座談會以實際電影產業發展的角度切入

  ，與談者包括前金馬影展及女性影展策展人兼影評人游惠貞、「林北小舞」導演陳玫君、

  熟悉兩岸三地發行市場的資深製片人（Robert Cain）凱恩。


  美國加州大學洛杉磯分校（UCLA）東亞語言文化系教授紀一新（Robert Chi），以及製片

  人休恩（EugeneSuen）也參與座談，並由雙年展主力策展人馬科姆（Paul Malcolm）擔任

  主持人。


  這項於當地時間22日下午舉行的座談會，並放映蕭菊貞導演的紀錄片「我們這樣拍電影」

  ，在這部80分鐘的紀錄片中，紀錄了1980年代台灣新浪潮電影後，台灣電影人如何在侯孝

  賢、蔡明亮、李安、楊德昌這些前輩提供的養份中成長。


  在隨後進行的座談中，主持人提出台灣電影的定位議題，與談者一致認為，全球對台灣電

  影的認識，始終還停留在新浪潮電影時期。


  近30年來台灣電影的能量及實力一直被低估，不過，鍾孟宏、趙德胤、陳玉勳和張作驥等

  導演的作品仍透過雙年展系列活動，對外展現台灣電影的活力。


  台灣新浪潮電影的響影仍然既深且廣，雙年展開幕片「林北小舞」導演陳玫君表示，這部

  影片中若干畫面的處理，受到了侯孝賢作品的啟發。


  對於台灣新生代創作者而言，前輩們不僅提供了創作養份，更實際在創作及拍攝過程中傳

  承經驗，這些都是台灣電影發展過程中非常寶貴的資產。


  展望未來，台灣電影在新浪潮電影的餘蔭下，盼能更有機地吸收、轉化藝術能量，以發展

  更多兼具商業與藝術價值的影片。


  洛杉磯台灣書院表示，台灣電影雙年展活動還有多場內容精彩的講座，包括接下來在11月

  2日下午7時於台灣書院舉行的策展人對話，由馬科姆以及紀一新對談。


  11月5日放映「日曜日式散步者」，將邀請到導演黃亞歷與觀眾對話。


