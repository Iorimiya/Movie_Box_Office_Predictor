title: '[討論雷] 到底哪裡能看到反應熱烈的電影場次('
content: '我個人是屬於看電影會發出聲音的人，雖然通常也不大聲因為台灣戲院都在比安靜的。


  之前看了yt上美國人看復3的反應覺得有點羨慕，雖然復3那個實在有點吵過頭了，動不動

  就歡呼鼓掌



  這次復4一上映就殺去看，今天又衝了一場imax 3d


  但結果都剛好遇到很安靜的場，除了imax我旁邊坐了一群印度人有發出一點聲音外其他人

  都超安靜


  美隊喊集結跟舉起錘子的時候的時候竟然完全都沒有聲音，我都快尖叫了


  結束後也沒有看過有人鼓掌歡呼的，我這次看片尾簽名畫面的時候真的很想鼓掌，我還試

  著拍了幾下，但是沒有人跟上！所以我只好很尷尬的停了



  因為大家都安靜的要死，所以我也沒好意思發出太大的聲音，但是我真的好想體驗一下遇

  到整場觀眾都超嗨的情況啊啊



  我覺得很多情境下四周他人的反應會增強自己的感受，譬如搞笑的時候聽到別人笑你也會

  跟著笑，看到屌爆的畫面可以跟別人一起歡呼的感覺也很棒




  台灣雖然民風很喜歡比安靜，但是看板上很多人也有分享看過反應很熱烈的觀眾，除了那

  種專門給粉絲包場的情況外，到底怎樣比較可能遇到那種觀眾很熱情的放映場次啊？



  有沒有遇過很嗨的觀眾的人來分享下是在什麼地方時間遇到的？


  --

  呵呵

  小孩看復4才不會嗨，小孩只會笑

  就跟大部分台灣觀眾一樣

  誰要你進來批判我啊，有病是不是


  我只在問有沒有人遇過，怎麼遇的


  我他媽才不在乎你對觀眾反應的看法咧，你以為你誰啊'
