url: https://www.ptt.cc/bbs/movie/M.1716208410.A.728.html
title: '[新聞] 61歲黛咪摩爾3點全露拚影后 觀眾熱烈鼓掌'
content: '新聞網址：



  61歲黛咪摩爾3點全露拚影后 觀眾熱烈鼓掌超過10分鐘


  2024-05-20 17:33


  聯合報 特約記者唐在揚、記者蘇詠智／即時報導


  本屆坎城影展進行將近一半，口碑強勁之作終於登場：61歲黛咪摩爾首度帶著作品角逐坎

  城影后，在主演的「物質」（直譯）中扮演年華老去女星，透過奇特療程複製出更年輕、

  貌美的自己，卻變成兩個人想要爭奪自身主權的戰鬥，她不僅素顏特寫呈現臉上皺紋，還

  3點全露，映後觀眾給予超過10分鐘熱烈掌聲，她也有得獎呼聲。


  過往是商業片天后的黛咪，雖然年逾花甲才來到坎城參加競賽，卻一出手就博得滿堂彩，

  感動又激動。昔日她曾經以「脫衣舞孃」露兩點的尺度拿到1250萬美元創下當時女星最高

  片酬紀錄，快30年後尺度竟然更寬廣到3點全露，勇氣十足，而且片子後段她因為脊髓液

  被過量抽取，瞬間老了更多歲，宛如怪物般模樣駭人，可說是為了這個角色做足犧牲。不

  過「物質」的概念頗新穎，女導演柯拉莉法吉特又將片子拍得具有性別反思，也容易懂，

  並不故作高深，還不時有幽默的趣味橋段，今年坎城競賽的評審團主席葛莉塔潔薇有可能

  會喜歡這種風格。


  片中扮演年輕貌美版女星的則是「妳是我今生的新娘」女主角安蒂麥道威爾的女兒瑪格麗

  特庫利，本屆另一部競賽片「憐憫的種類」也有她的演出，在歐美影壇急速走紅中。黛咪

  的演出尺度雖大，卻並非獨一無二，因為演過「007」系列中武器專家的英國男星班維蕭

  ，在俄羅斯競賽片扮演著名的狂放派作家愛德華利莫諾夫，和女主角也都有露3點的激情

  表現，演技也頗獲好評，亦是本屆影帝的可能人選之一。


  而凱文柯斯納帶著最新自導自演、長超過3小時的西部片「地平線：美國傳奇」在坎城特

  別放映，全場反應也熱烈，讓他流下眼淚。近幾年凱文在美國主演的影集「黃石公園」紅

  透半邊天，他被傳為了妻子的要求退出該劇，卻立刻捲入離婚風波，再次成為各方矚目的

  話題人物。坎城首映典禮上，他不但把兒子海斯一起帶去，也邀來奧斯卡影后楊紫瓊、韓

  國紅星潤娥等重量級嘉賓助陣，連女主角之一席安娜米勒，也把少在公眾眼前露面的11歲

  女兒瑪蘿給帶去，讓觀眾目不暇給。凱文透露該片是4部曲，還會有其他3部陸續推出，外

  界也已預期這會是他繼「與狼共舞」後再向奧斯卡進軍的大作。



  --'
