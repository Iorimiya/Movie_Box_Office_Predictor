title: '[新聞]《黑太陽731》重新放映反應熱烈(香港)'
content: '《黑太陽731》重新放映反應熱烈




  新聞網址：



  香港文匯報 文匯專題


  2025-08-01


  ●《黑太陽731》加開8月2日場次。

  ●《黑太陽731》加開8月10日場次。幕後團隊映後座談



  《黑太陽731》(1988) 幕後團隊分享 8月10日 15:40 #影藝戲院 荷里活 #友好歸友好

  #歷史歸歷史 #黑太陽731 #牟敦芾 #首部三級港產片  #溝片



  電影《黑太陽731》在香港重映 香港觀眾：沒有想到影片中“白骨畫面”是真實事件

  #中國 #香港 #731 #日本 #第二次世界大戰 #東北



  　　被重新放映的上世紀八十年代港產經典電影《黑太陽731》是由牟敦芾執導，王剛、

  王潤身、吳代堯、權哲等人主演。1988年上映的《黑太陽731》同樣聚焦於731部隊進行

  細菌戰的歷史。電影講述第二次世界大戰前夕，日本在中國東北扶植建立「偽」滿洲，

  更於哈爾濱設立從事細菌武器研究的731部隊研究本部。1945年2月，日軍軍醫中將

  石井四郎返回並執掌731部隊，與他一同到來的，還有一班出自千葉縣的少年隊員。


  小隊員們組成的少年班被軍方寄予重望，他們和研發中的新式細菌武器被看做挽救日本

  敗勢的希望所在。


  少年班在嚴苛的訓練中被強迫觀看用中國人、朝鮮人和白俄人做試驗，用「馬路大」做

  凍傷實驗、細菌炸彈實驗以及活體解剖實驗，少年天性被血腥的場面感染、扭曲。


  1945年初夏，日本軍國主義的失敗已經不可避免，石井四郎瘋狂地嘗試製作鼠疫炸彈

  拯救「大日本帝國」，但法西斯的覆滅近在眼前。


  《黑太陽731》不僅是一部電影，更是一面照見人性之惡的鏡子。它讓觀眾直面歷史的

  黑暗面，同時引發對戰爭倫理、生化武器濫用等問題的思考。影片的核心價值在於提醒

  世人：歷史不容篡改，唯有銘記苦難，方能守護和平！日前，影藝院線原本安排7月31日

  放映一場，但得到影迷熱烈的反應，門票火速售罄，院方於是再加開8月2日一場。


  這部37年前的作品，至今仍令人關注，得以一窺二戰日本侵華時期以人體做實驗的殘酷

  真相……



  --'
