title: '[新聞] 陳瑩籲導演道歉，否則不排除「熱烈接機」'
content: "《大尾2》揶揄原住民， 陳瑩籲導演道歉，否則不排除「熱烈接機」\n\n 周怡孜 2016年02月15日 16:59\n\n電影《大尾鱸鰻2》遭投訴歧視、揶揄達悟族人，引發原住民族不滿，導演邱瓈寬稱絕無\n\
  冒犯，並說「懂得笑就不會恨了」，電影可以評價不一，但社會不應該自我分裂。對此，\n民進黨新科立委陳瑩15日召開記者會批評：「她這樣的回應，對我們是二度傷害！」不排\n\
  除在邱瓈寬回國當天，到機場「熱烈接機」。\n\n《大尾鱸鰻2》情節中，劇中人物因聽不懂達悟族語，便對族人罵「肖仔（瘋子）」並且\n稱族人「臭哄哄」。陳瑩批評，這樣的安排非常有歧視意味，「『臭哄哄』到底是要隱喻\n\
  什麼？我想這樣的安排，會讓人有不好的聯想」。\n\n對於劇情引發的爭議，導演邱瓈寬日前在臉書上回應，絕對無意冒犯原住民朋友，如有不\n夠周延的地方，會虛心反省。她也提到，「懂得笑就不會恨了」，這是她的自我期許，也\n\
  是《大尾鱸鰻2》的主題，電影可以評價不一，但社會不應該自我分裂，「我們從來就不\n是敵人」。\n\n「針對導演這樣回應，我們也有話要說。」陳瑩表示，原住民族長久處在殖民的政權之下\n\
  、失去很多，但卻也從未將殖民政權、外來者當做敵人，不過，卻是長期被其他族群用刻\n板印象，作為題材來嘲笑、歧視，就連總統馬英九過去也曾對原住民族說過：「我把你們\n\
  當人看」。\n\n陳瑩說，邱瓈寬稱「社會不應該自我分裂」，但事實上，這部電影已經傷害到原住民朋友\n了，「她這樣的回應，對我們是二度傷害。因為這樣的回應，是在指原住民在搞分裂嗎？\n\
  在搞國家、族群的分裂嗎？我們只是為我們自己來發聲而已，從來都不是要來搞分裂，我\n們都是被別人拿題材來搞分裂的。」\n\n「在創作自由之下不應凌駕族群尊重！」陳瑩呼籲，邱瓈寬一定要出來道歉，否則他們將\n\
  不排除在邱回國當天，到機場去「熱烈接機」。另外，對於相關的立法，陳瑩也承諾，未\n來將會積極推動《反歧視法》及《族群平等法》，「這是比較消極的方式，但是太多這樣\n\
  的事件了，我們就必須無奈用立法方式做規範」。\n\n\n\n--"
