url: https://www.ptt.cc/bbs/movie/M.1685174468.A.B88.html
title: '[討論] 上一部讓大家如此熱烈討論票房的電影？'
content: '如題


  身為長期潛水的電影版鄉民

  我沒有印象有看過哪部電影被這麼熱情地對待，

  以近乎日更的方式報導各國票房狀況


  北美、日韓中、東南亞、德國、甚至丹麥..


  我沒有歧視但我真的覺得很有趣xD

  我自己也天天看票房的相關報導、也不是看熱鬧或什麼、就是想知道是不是還是有很多人可以接受這種菜。


  今年以來已經看了四部電影，雖然可能不算多，但小美人魚本應是我會想進場看的一個情懷片

  不過自從選角出爐、到後來劇照釋出

  我就覺得到底是出了什麼事..


  膚色、顏值就算了

  那個頭髮怎麼可以這麼不公主..？ 哪有海生公主可以綁髒辮的..

  那個魚尾巴怎麼可以很像超市的廉價道具..


  整組崩壞


  對我是刻板印象、但這就是情懷片啊..

  搞得像另一部戲只是剛好劇情一樣  我可不要


  網上隨手抓一些圖片、覺得很多素人很多演員那個質感都更加適合 qq







  --'
