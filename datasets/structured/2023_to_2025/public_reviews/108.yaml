url: https://www.ptt.cc/bbs/movie/M.1526284961.A.D24.html
title: '[新聞] 【小偷家族】坎城首映，全場轟動熱烈鼓掌'
content: '新聞網址：



  日本名導是枝裕和，於台北時間今日（5/14）凌晨帶著新片《小偷家族》（前譯：《我們一家都是賊》），在法國坎城影展進行世界首映。本片強勢入選坎城影展主競賽單元，也是是枝裕和繼2015年《海街日記》之後，睽違三年第五度入選坎城主競賽單元。他率領主要演員Lily

  Franky、安藤櫻、松岡茉優、樹木希林、城檜吏、佐佐木美優現身紅毯，成為鎂光燈焦點。尤其本片映後大獲好評，全場起立鼓掌達數分鐘之久。許多影迷看完後紛紛表示：「真正震撼心靈的感動」、「結尾刻畫得非常棒」、「人物塑造很棒，安藤櫻的表現極好」佳評如潮也讓是枝裕和大呼「鬆一口氣」。尤其能到坎城機會難得，演員們也把握機會好好遊歷。樹木希林就趁機跟自己女兒喜歡的法國影帝馬修亞瑪希（Mathieu
  Amalric）合照，松岡茉優更把坎城限定周邊商品完整搜刮，甚至驚訝歐元大幅翻漲。《小偷家族》將在7月13日於台灣溫暖上映。





  是枝裕和今日凌晨帶著《小偷家族》六位主要演員出席坎城影展世界首映。只見安藤櫻、松岡茉優兩位女星分別以桃紅緞面與純白蕾絲禮服現身紅毯，白皙肌膚配上鮮艷紅唇，立刻成為鎂光燈捕捉焦點。一行人從紅毯準備進入影廳之前，影展主席蒂埃里佛里莫（Thierry

  Fremaux）也上前迎接，不僅給是枝裕和一個大大的擁抱，面對小童星佐佐木美優，更是直接屈身歡迎，場面十分溫馨。而當眾人進到影廳時，全場更抱以熱烈掌聲迎接；而當全片放映完畢，全場更是起立鼓掌達數分鐘之久，這也讓是枝裕和感激地表示：「雖然電影才剛完成，現在還是很緊張地看片，但在這觀影的兩小時當中，這份緊張感也都沒有消失。當映後觀眾響起又長又溫暖的掌聲，也讓我鬆了一口氣。」男主角Lily

  Franky也表示：「從觀眾的表情當中，我看得出他們給予的掌聲是真誠的，給了我一個非常好的經驗。」女主角安藤櫻也說道：「即使我自己有演出，但看片當下甚至忘了自己有演，整部電影看得非常投入。」





  有趣的是，第五度跟是枝裕和合作的資深女星樹木希林，這回是第三度來到坎城。她感到非常放鬆，甚至透露她抓到機會，跟自己女兒很愛的法國男星馬修亞瑪希合照。另一方面，首度跟是枝裕和合作的23歲女星松岡茉優，來到坎城也難掩興奮之情，尤其看到今年美麗的主視覺，也勾起了她的購物慾，搜括影展商店大部份的周邊商品，並古靈精怪地透露：「我買了帆布托特包、馬克杯、T恤等等，幾乎所有商品都買了。歐元現在變得好高，讓我嚇了一跳。」她更許下心願：「我相信真的有『機運』和『奇蹟』，我希望能夠堂堂正正地說自己並不是靠『機運』或『奇蹟』來到댊o裡，而是靠自己的努力來到這邊，所以希望以後一定要再來坎城。」



  這部風光入選本屆坎城影展主競賽單元的《小偷家族》，即將在7月13日於台灣感動獻映。本片劇情描述在東京下町林立的高樓大廈之間，不合時宜地殘存一個破舊平房，裡面住著年邁的母親初枝（樹木希林飾演）、治（Lily

  Franky飾演）與信代（安藤櫻飾演）夫婦，以及他們的兒子祥太（城檜吏飾演），還有信代的妹妹亞紀（松岡茉優飾演）。這家人仰賴初枝的老人年金過活，當年金不夠用時，就會靠在外頭順手牽羊來補貼家用。雖然他們處在社會底層，但每天依然快樂地過生活。某個冬天，治帶回一位在附近公寓被凍僵的少女百合（佐佐木美優飾演），加入他們原本就貧困潦倒的家庭。以此事件為契機，這個原本融洽的家庭，逐漸四分五裂，彼此心中隱藏的秘密與願望也逐漸明朗…。



  欲知本片最新消息，

  請上電影官方部落格

  與臉書粉絲團查詢。



  --'
