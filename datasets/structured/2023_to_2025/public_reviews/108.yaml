title: '[討論] 屍速列車台灣迴響超熱烈 導演：始料未及'
content: '《屍速列車》延尚昊導演上週為動畫新片《起源：首爾車站》訪台宣傳，他表示《起源：

  首爾車站》三位幕後配音演員柳承龍、沈恩敬、李準看過劇本後，都十分喜愛故事帶來的

  趣味與震撼，並曾建議延尚昊導演拍攝真人版，然而導演卻直言不是沒想過，但若拍成真

  人版，場景與動員的殭屍群演數不亞於《屍速列車》，製作費恐超過百億韓元，只好因而

  作罷。


  《屍速列車》全球票房遍地開花，在台也創下3.4億票房歷史新紀錄，延尚昊導演對於《

  屍速列車》迴響之大，表示是他始料未及的狀況。向來作品社會批判意味濃厚的延尚昊表

  示：「希望創作的電影，無論是動畫電影或是真人電影都能與觀眾的生活有連結，能帶給

  人對生活與世界一些思考，所以不想只拍純粹娛樂性的電影。」



  --'
