title: '[新聞] 莎嬸吐16年前死劫 半身癱瘓失明又失聰'
content: '新聞網址：


  莎嬸吐16年前死劫 半身癱瘓失明又失聰


  【李子凡╱綜合報導】美國59歲女星「莎嬸」莎朗史東（Sharon Stone）曾是一代銀幕性

  感女神，但她最近受訪透露2001年43歲時突然腦出血，「我的存活機率只有5％」，她後

  來戰勝死神，但身體左半部功能幾乎喪失，她得重新學習走路、說話與寫字，她表示「我

  的人生自此永遠改變」。

  莎嬸在1992年的《第六感追緝令》中與影帝麥克道格拉斯有許多激情戲，其中一場她穿著

  白色洋裝、沒穿底褲並兩腿交叉的戲，令人血脈賁張，也奠定她性感女神地位。但她突然

  淡出影壇，原來是因為健康出了問題。


  無法寫字走路

  她最近向《廣播時報》表示，「我突然中風，幾乎無法走路，我的左眼看不到、左耳也聽

  不見。」她透露她中風後住院，腦溢血狀況持續了9天，她活下來，卻有近3年無法寫自己

  的名字、手臂也不聽大腦使喚，「我花了好幾年左腿才恢復知覺，但總算是恢復了」。她

  8年前開始重拾演藝事業，最近還與一名貌似只有她一半年齡的帥哥喇舌，生活回到常軌

  。


  --

  我是男生，只愛男人。我是純真、開朗的0號男同性戀。希望將來能和彼此相愛的男人結婚


  喜歡和不同國籍、類型的帥哥猛男型男交友約會。已記不得、數不清和多少男人交往過了


  --'
