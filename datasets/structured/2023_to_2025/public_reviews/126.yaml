title: '[新聞] 大提琴神童一夕失明　竟跟男同學「交換條件」隱瞞病情'
content: '樂來越萌預告請見：


  記者洪文／綜合報導  2017年01月20日 00:49



  法國古典音樂美少女亞莉克絲薇洛特（Alix Vaillot）近日跨界主演新片《我是妳的眼》

  （Heartstrings），在片中飾演無可限量的大提琴神童，卻有一個不能說的秘密：她的視

  力逐漸退化，有可能會完全失明。然而她卻不想進入視障學校，讓年的努力化為泡影，便

  串通男同學「交換條件」助攻考上音樂學校。



  原來瑪莉的父母想送她到視障學校，好讓女兒受到完整照料，但是她一心想通過音樂學校

  入學考試，繼續精進琴藝。無計可施之下，決定隱瞞病情，但視力不佳的她無法獨力通過

  考試，於是轉向同班同學維多求助。一直暗戀著瑪莉的維多，漸漸成為瑪莉的雙眼，處處

  幫她掩護，甚至在甄試的前夕帶她離家出走。



  《我是妳的眼》改編自法國暢銷小說《點字之心》，日前奪下杜拜國際影展觀眾票選獎，

  也受到多國影展邀約放映。亞莉克絲薇洛特以自身經驗完美詮釋主人翁的精湛琴藝，搭配

  備受矚目的法國超萌新星尚史丹杜巴克（Jean-Stan Du Pac），還有多位法國實力派演員

  共同演出。電影2月17日上映。


  --'
