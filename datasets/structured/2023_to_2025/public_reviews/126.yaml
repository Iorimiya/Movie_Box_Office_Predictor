url: https://www.ptt.cc/bbs/movie/M.1734622597.A.CAA.html
title: '[新聞] 林依晨首監製電影《失明》入選鹿特丹影展'
content: "林依晨首監製電影《失明》入選鹿特丹影展\n\n04:10 2024/12/19 中國時報 李承陽\n\n\n周美豫是林依晨經紀人，現升格電影《失明》的導演。（周子娛樂提供）\n\
  \n\n林依晨監製暨主演電影《失明》，風光入圍鹿特丹影展。（周子娛樂提供）\n\n林依晨監製並主演的電影《失明》，在近日公布的2025年「鹿特丹國際影展」入選金虎獎\n\
  主競賽單元，是台灣電影繼2012年趙德胤執導的《歸來的人》後，暌違12年再次入選同一\n獎項，對此林依晨表示非常開心，感謝所有幕前幕後演員與工作人員共同努力，期待能讓\n\
  更多觀眾切身感受到這個既傷痛又美好的愛情故事。\n\n由新銳導演周美豫執導，林依晨、黃茂昌監製的電影《失明》，在全球優秀作品競爭下入\n選金虎獎主競賽單元，林依晨尤其感謝導演周美豫，一路從自己的經紀人本職又進修導演\n\
  創作，且獲得專業肯定，很謝謝她永遠朝完美修正的處女座個性，成就了這部片。\n\n《失明》主演陣容包含林依晨、吳可熙、劉敬、李銘忠等實力派演員，將在2025鹿特丹影\n\
  展中全球首映，吳可熙分享：「這是部極具挑戰又有成就感的作品，十分感動，期待電影\n能盡快與大家見面」。劉敬也表示：「這是我第1部長片作品，有點小緊張，期待自己在\n\
  大螢幕上會是怎麼樣的感覺，能參與這部電影我與有榮焉。」\n\n#作品 #周美 #劉敬 #吳可熙 #失明\n\n--\n\n 是菩薩成佛之道\n        是\
  \ 佛經\n  是 佛        是 菩薩\n\n\n\n--"
