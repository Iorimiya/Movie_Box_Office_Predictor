title: '[新聞] 影后茱蒂丹契近乎失明 堅不退休原因曝光'
content: "影后茱蒂丹契近乎失明 堅不退休原因曝光\n\n2023/08/02 09:09\n\n\n朱蒂丹契今年已88歲，仍不輕言退休。（資料照，動物星球提供）\n\
  \n〔記者林南谷／綜合報導〕88歲英國女星茱蒂丹契（Judi Dench）曾獲11次英國電影和電\n視藝術學院獎、2次美國演員工會獎及1次奧斯卡金像獎等， 2012年被診斷患有老年性黃\n\
  斑部病變（Macular degeneration），視力逐年下降，近期她在片場幾已看不清任何東西\n，依然不輕言退休。\n\n《星期日鏡報》（the Sunday\
  \ Mirror）報導，茱蒂丹契受訪時透露，因罹患老年性黃斑\n部病變，視力惡化幾乎看不清片場、劇本、書中文字，她無奈表示：「如果戲份較長，就\n難以繼續拍攝。」\n\
  \n儘管如此，茱蒂丹契仍在尋找解決辦法，例如依靠朋友幫忙唸劇本；同時她也不輕言退休\n，她說：「我對無聊有種非理性恐懼。」透露此想法讓她在手上紋了拉丁文「及時行樂（\n\
  carpe diem）」字樣。\n\n--\n佛教經典的\n是 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n\
  --"
