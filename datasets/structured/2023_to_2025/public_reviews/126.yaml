url: https://www.ptt.cc/bbs/movie/M.1754455034.A.93D.html
title: '[情報] 林依晨  《失明 Blind Love》  前導預告'
content: "《失明 Blind Love》 正式海報主視覺公布\n「不再心盲，我想要最好的活著。」\n\n「有些事情，閉上眼睛才看得到啊。」\n\n\n書儀（林依晨\
  \ 飾）是人生勝利組的典範─坐擁令人稱羨的完美丈夫與聰穎兒子，這一切\n的榮耀，都是她傾盡心血、步步為營所換來的結晶。直到遇到了初戀情人雪津（吳可熙\n飾），一場始料未及的意外，竟如利刃般劃破她精心構築的完美假象，這不僅是光明消逝\n\
  的試煉，更是被迫直視內心深處，揭開所有殘酷的旅程.........\n\n\n我們時常隔著模糊的馬賽克看世界，看見的，是一塊塊破碎卻絢爛的情感，那馬賽克玻璃\n\
  底下的紅、黃、藍色塊彼此碰撞與堆疊，像是我們內心的投影，繽紛、對比、難以言喻，\n也似呼應了電影片名──模糊卻無比真實的視角。\n畫面中的她們，各自懷著不同的神態與心境，彷彿在無聲地對話、對峙。而男孩在白色的\n\
  角落裡，仰望著她們的方向，手中拿著畫框，像是在觀察，也像是在等待。這若即若離的\n距離，我們真能看清彼此嗎？所有情緒的流動，就藏在這一片碎裂又美麗的馬賽克之中..\n\
  .\n\n《#失明》 9.19 看見你的看不見\n前導預告 \n\n#林依晨    #吳可熙 #劉敬\n#李銘忠 #李沐 #王渝萱\n\n--\n人家官方貼文就這樣寫(^_^)a"
