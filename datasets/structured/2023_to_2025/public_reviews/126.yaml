url: https://www.ptt.cc/bbs/movie/M.1424961729.A.737.html
title: '[新聞]「我像醉婦到處跌倒」茱蒂丹契承認漸失明'
content: '好萊塢影星茱蒂丹契（Judi Dench）今年80歲，以演出007系列電影中的「M夫人」聞名，

  曾經無數次獲得影視獎項肯定，是備受推崇的影壇傳奇之一。她近年仍持續不斷拍攝新作

  ，然而視力變得越來越差，最近已經連腳下階梯都看不到，令眾多影迷感到擔心不已。


  據《Radio Times》報導，朱蒂丹契承認近況非常糟糕，已經到了無法單獨出門的地步，

  因為她連腳下有沒有階梯都看不到，不管去哪裡都需要有人在旁邊輔助，「否則我就會像

  一個又瘋又醉的婦人一樣到處跌倒。」她3年前就知道黃斑部病變造成視力減弱，但不願

  意因此放棄熱愛的演藝事業，儘管必須依賴旁人讀台詞給她聽，還是堅持要繼續演戲。


  茱蒂丹契因為日漸失明而吃了不少苦，過去幾年重度仰賴放大鏡、眼鏡和強光，然而生活

  態度始終非常積極樂觀，還會把困境當成趣事來分享：「如果有明亮的陽光，我甚至可以

  玩填字遊戲！但如果有一朵烏雲飄過來，下一秒我就無法看見任何東西。」正向幽默的思

  維感動許多網友，也被大讚「英國最美好的傳奇」。



  即將於3/20上映的《金盞花大酒店2》預告




  --'
