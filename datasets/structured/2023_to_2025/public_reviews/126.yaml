url: https://www.ptt.cc/bbs/movie/M.1688223602.A.5EA.html
title: '[新聞]《看不見聽不見也愛你》山下智久首演失明人'
content: '《看不見聽不見也愛你》劇情+角色介紹　山下智久首演失明人士


  撰文：許育民

  出版：2023-07-01 22:45

  更新：2023-07-01 22:45




  日本紅星山下智久，憑客串《今際之國的有栖》第二季中露股演出而人氣再度急升，而繼

  全英語演出美日法合拍電視劇《神之雫Drops of God》後，夥拍人氣女星新木優子合演唯

  美浪漫愛情電影《看不見聽不見也愛你》（See Hear Love），亦於7月6日香港上映。早

  前山下智久與新木優子，雙雙訪港出席電影放映和粉絲見面會，讓一連三場逾千位觀眾可

  近距離一睹兩位主角的風采。今次亦是山下智久自2011年來港開個人世界巡迴演唱會後，

  相隔12年再次襲港。



  山下智久與新木優子在《看不見聽不見也愛你》演情侶。

  （《看不見聽不見也愛你》劇照）


  劇情簡介


  電影《看不見聽不見也愛你》，講述泉本真治（山下智久　飾）傾注了大量心血在他的漫

  畫創作上，並以此為生。某天他得悉自己的作品將會被改編拍成電影，跟助手中村沙織（

  山本舞香　飾）雀躍萬分。可惜快樂的時光轉瞬即逝，真治突然病倒，視力逐漸衰退。好

  不容易才步上正軌的漫畫接著被迫暫停刊載，他也沒有能力繼續照顧一起生活的祖母....

  .. 失去了視力的真治被孤獨與恐懼包圍著，有過從陽台跳下去一死了之的想法。真治的

  漫畫迷，患有聽覺障礙的相田響(新木優子　飾)及時出現並拯救了他。遇上了彼此的兩人

  就這樣展開了不可思議的同居生活。



  山下智久首演失明人士，依然有型。

  （《看不見聽不見也愛你》劇照）


  導演執導《擁抱這分鐘》


  故事改編自韓國人氣漫畫家 Nasty Cat 的同名網絡漫畫作品《See Hear Love》，由韓國

  導演李宰漢執導。李宰漢的代表作，是由孫藝珍與鄭雨盛主演關於妻子患上腦退化的韓國

  愛情悲劇《擁抱這分鐘》，亦曾執導另一部日語愛情片《再見，總有一天》，由中山美穗

  及西島秀俊主演。男主角山下智久久未演出愛情片，今次是繼2014年與小松菜奈合演《近

  距離戀愛》後再度在大銀幕演繹浪漫愛情。



  新木優子被視為新晉矚目新女演員。（《看不見聽不見也愛你》劇照）



  東京「六本木之丘」的「Metro Hat」外側弧形玻璃幕牆，都出現巨幅《看不見聽不見也

  愛你》海報，效果震撼。（電影公司提供）




  連男女主角都要親身到場「打卡」留念。（電影公司提供）


  山下智久演失明人士


  山下智久在《看不見聽不見也愛你》中挑戰難度，首次演視障人士，將漫畫家突然因病失

  明的沮喪與絕望，演繹得令人心痛又不失帥氣。山下智久除了演員身份，作為歌手的他同

  樣保持著很高的活躍度並且很受注目。這次的電影主題曲《I See You》正是由他主唱。

  他以憂傷的情感，唱出了男女主角既互相依賴又帶給了對方生命光芒，戀人之間濃烈的愛

  慕之情和喜悅，作為替電影完美作結的片尾曲，令人再三回味。



  （《看不見聽不見也愛你》劇照）



  山下智久的演出令人驚喜。（《看不見聽不見也愛你》劇照）


  90後新星新木優子


  女主角新木優子是90後的人氣女星，模特兒出身，早在2010年《告白》一片中演過學生，

  亦參演過多部日劇，包括山下智久主演的《緊急救命》系列第三季。今次《看不見聽不見

  也愛你》再次與山下智久拍檔，卻是首度擔正電影女主角，演樂天勤奮又用情至深的聾啞

  女孩，全片幾乎沒有對白，只靠手語及表情，簡直演技大爆發，把聽障角色演得惹人憐愛

  又充滿正能量，甚為討好。戲外她更是Dior的日本地區大使，星途無可限量。



  一位失明，一位失聰，譜出不一樣的愛情故事。（《看不見聽不見也愛你》劇照）


  香港01




  --'
