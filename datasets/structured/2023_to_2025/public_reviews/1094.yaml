title: '[請益] 有人看完"惡獸之戰"了嗎?'
content: '韓國犯罪片應該都不錯


  但這導演之前的"刑警沒有假期"太雷了


  也沒大咖演員吸引人


  萬年配角朴星雄都能當主角...


  且才上映第一天就放冷門時段+小廳


  讓原本想衝第一天的我卻步了


  但還是好奇看完的人的評價如何




  --








  --'
