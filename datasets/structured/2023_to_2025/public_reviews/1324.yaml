url: https://www.ptt.cc/bbs/movie/M.1498800690.A.FE6.html
title: '[好雷] 不汗黨：地下秩序'
content: "不汗黨：地下秩序　　「第70屆坎城國際電影節」非競爭部門「午夜展映」作品\n\n\n主演： 薛耿求\n       任時完\n\n\n\n以下有雷\n\
  \n\n\n\n\n\n\n\n\n\n這部電影其實我前陣子在韓國時就去看過了，而現在也於台灣上映，\n打算再去看一次，想說不如來發篇觀後文。\n\n\n發文時想了下該給這部片好雷或是普雷，最終選擇了好雷。\n\
  一部片給好評的原因很多，而這部給好評的理由則在於：\n\n\n\n1.主演演技優異\n\n薛耿求：\n\n宋康昊、崔岷植以及薛耿求，被稱為韓國電影界的「三駕馬車」，很多人一\n\
  定都看過薛叔演的素媛，演技自然無需多提。\n\n\n\n任時完：\n\n憑藉2013的電影 辯護人 開啟電影道路； 2014韓國爆紅的未生，接著時完一\n心電影，在2015-17三年中，出產了3部電影。\n\
  \n\n任時完演技優異，臉部微表情細膩傳神，可惜身高是硬傷，臉也偏美型，因此\n常被認為戲路偏窄，韓劇一般高富帥角色不太適合他，但憑著不汗黨中的演技\n成功轉型，和大前輩薛叔搭戲，氣勢也絲毫沒被削弱。\n\
  \n我認為時完如果活動於更早期的韓劇圈，那對他來說沒有太多得利處。早期韓\n劇以愛情戲為大宗，男主無異是要具有高大身材能擁女主入懷，然則時完版型\n小，和誰搭似乎都不太會有cp感。不過近年韓劇圈漸脫離只談愛的劇本，越來\n\
  越多批判社會的戲劇出現。不以愛情為主訴求的劇本，我認為是最適合時完的\n劇本。基於種種理由，我始終認為時完相當適合往電影界發展，畢竟相較於戲\n劇，電影著重更多的是非粉紅泡泡的cp感。\n\
  \n\n回到不汗黨，時完在這當中有5場哭戲，每場皆帶給觀眾不同感受，即使不身為\n粉絲，單就一般觀眾角度，也絕對是會讓人為之驚艷的哭戲。尤其電影最後一\n幕從眼眶中滑出的一滴淚，當時在電影院真的是無聲的哇了聲，感嘆這小子演\n\
  技的成熟。\n\n時完也將於7/11從軍，相當期待2年後的歸來，再帶來更多精采的演出。\n\n\n\n\n2. 攝影、照明、剪輯\n\n此電影中光與影的變化運用相當嫻熟，整部片質感屬上乘之作，對於一部犯罪娛\n\
  樂片來說，實在是沒有什麼可挑剔之處。\n\n\n\n但這部戲部是沒有缺點，我就非常想給「劇情」打個普普普，劇情本身老套無亮\n點完全是個致命漏洞，反轉反轉再反轉，但如果常看犯罪片的觀眾，應該能早早\n\
  猜到結局，不過演員優異的演技，和質感佳的攝影、照明和剪輯，算是能彌補過\n去。我想，瑕不掩瑜，應該是最能代表此一電影的一句話。\n\n\n整體來說，本片許多拍攝手法皆達到了加分效果，此片於70屆坎城午夜特別單元\n\
  首映撥畢時，台下掌聲如雷，長達了7分鐘，也被評價說這才是為觀眾拍的電影。\n\n最後，就把在坎城影展大放異彩的電影─不汗黨 推薦給大家了。\n\n\n\n--\n\
  \n這部片我給好評的就屬眾演員的優異演技（特別是任的哭戲），\n和強大的攝影、照明和剪輯，至於劇情就真的算是普通了。"
