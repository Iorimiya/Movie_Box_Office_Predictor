title: '[情報] 韓影《不汗黨:地下秩序》上映資訊及簡介'
content: '海報：


  韓國黑道動作片《不汗黨:地下秩序》，今日起在台上映。


  電影片名"不汗黨"是韓語中的無賴、痞子、流氓之意，《不汗黨：地下秩序》劇情描述監獄

  老大宰虎（薛耿求 飾）在牢裡遇到了天不怕地不怕的新人賢修（任時完 飾），建立患難感

  情，出獄後兩人為博得黑社會中更高的位置、更大的權力，開始龍爭虎鬥，兩人看似堅不可

  破的兄弟情，卻在一個秘密揭發後開始崩解。


  《不汗黨：地下秩序》在今年坎城影展午夜單元映演，獲得現場電影人和觀眾熱烈回響，映

  後全場觀眾起立鼓掌長達7分鐘之久，版權也熱銷至全球128個國家和地區。


  21日在台北舉行試映會，媒體與影評均對獨樹一格的敘事風格，還有人心的細膩刻劃給予正

  面好評。











