url: https://www.ptt.cc/bbs/movie/M.1699019477.A.D92.html
title: '[好雷]禍亂-地下秩序'
content: '剛剛看完這部禍亂

  我覺得挺好看的

  簡單說

  剛開始在醞釀為什麼男主會走歪路

  男主在學校被霸凌

  後來校霸欺負了繼妹

  於是男主拿石頭K校霸

  並為了三百萬和解金跑去打工


  母親是一個認命的女子 因緣際會下認識了繼父

  被上後繼父帶著繼妹就住進家裡

  繼父酗酒家暴 又一直說要借酒


  打工時男主要跟老闆借300W和解金 老闆沒錢借

  此時一旁的仲基正聽著 過沒多久就送男主300W

  一次次家暴讓男主終於臉上留疤導致無法打工

  就跑去黑道地盤找仲基說要工作 於是就開始走上不歸路


  仲基年幼也是被父親家暴虐待

  看到男主就起了惻隱之心 私下事事維護男主

  男主卻不知道仲基一直在幫他


  講到這邊只是前半段

  有兩三幕很血腥的片段

  從片長2/5中 拔指甲的片段開始劇情就慢慢高潮


  整體劇情順暢

  只是剛開始會有一點讓人感覺步調慢

  不得不說仲基的演技讓我覺得不輸皮卡丘

  尤其惻隱之心這部份演得非常好

  有興趣的人可以去電影院看看~


  --'
