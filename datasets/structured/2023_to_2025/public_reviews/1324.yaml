url: https://www.ptt.cc/bbs/movie/M.1700133626.A.B4C.html
title: '[普雷]禍亂：地下秩序'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  《禍亂：地下秩序》

  很多人大概期待的是宋仲基拍一些其他類型的片

  不過這部算是非常黑暗的片子

  心得如下






  記得是某個場合，一個日子過的很好的朋友，覺得有些社會底層人的失敗都在於他們的不

  努力，我那時剛好在另一位朋友那見到什麼叫社會底層，就淡淡的送這位朋友一句『你會

  這樣說只是因為你過的太爽』


  禍亂：地下秩序，就是這樣講個社會底層的電影，當你在這樣的底層，不要說努力，生活

  ，就是一場現實中的地獄


  破碎的家庭，同學的霸凌，現實的學校，還有勢利眼的打工麵店老闆。在經常酒醉的繼父

  毒打之下，主角唯一的心願只有網路上美好的荷蘭人生，多美好的國家啊，有著風車與美

  麗的風景，一定不像韓國這個落後的小區


  帶著怯懦的媽媽去荷蘭移民這是他的小小夢想。


  另一個主角人生中的救贖，是在繼父與母親的婚姻中出現的義妹，這也是主角少數生命中

  的光，即使再怎如何無奈，有人欺負了妹妹，主角就可以拼上一切，替她教訓學校中的惡

  霸


  然而先是因為學校屈於現實，如果不付打人的和解金，竟然就不准上學，而麵店裡吃飯偶

  而聽到他很需要錢的黑道(宋仲基飾)，只是因為是同鄉，就給了他300萬韓幣


  看似天使的饋贈，卻變成命運裡惡魔把他拉到地獄的手


  繼父在酒醉之下把主角狂毆一頓，讓主角臉上留下一個大疤，也因為這道疤，賣炸醬麵的

  打工老闆把他辭退


  又不敢回家睡，在家裡就有被繼父毆打的恐懼感，最後逃到黑道大哥那裡，開始了偷機車

  與借高利貸的生活.....


  當個黑道小弟，對主角來說算是解決了經濟問題，且得到了認同

  只是，當黑道就得泯滅良心......


  最後部份就不多講了，在徹底放棄自己的良心之後，還有著更悲更慘的人生

  導演不落俗套之處，是沒有安排個什麼被警察抓，或自己死掉什麼的老套悲劇


  劇末，主角騎著車，載著妹妹沿著公路遠去，背負著所有的罪惡.....遠方到底還有什麼

  等待的他們，或者說，還有什麼前途


  另一部電影的詞也蠻適合這部電影的

  《地藏菩薩本願經》卷中「地獄名號第五」：「閻浮提東方有山，號曰鐵圍，其山黑遂，

  無日月光，有大地獄，號極無間，又有地獄名大阿鼻，復有地獄，名曰四角…」


  --

  個人BLOG : 夢與幻的地圖





  --'
