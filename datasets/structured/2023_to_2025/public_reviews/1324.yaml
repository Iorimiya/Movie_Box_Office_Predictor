title: '[好雷]【不汗黨：地下秩序】人不可信,要相信情勢'
content: '【不汗黨：地下秩序】The Merciles│117分鐘｜韓文發音


  上映日期：2017-6-30


  ★2017坎城午夜單元映演的黑馬，映後掌聲長達 7 分鐘


  ★電影雜誌《Screen》點選為10部突出的佳作之一


  ★南韓導演卞成賢執導作，由韓國青龍、大鐘、百想大滿貫影帝薛耿求

  與《未生》演技派偶像任時完主演


  ★超越《闇黑新世界》《無間道》，開創黑幫臥底電影新格局



  本文來自:



  這一個禮拜內連看了兩部韓國電影，一部是【惡女】，


  另一部就是這部【不汗黨：地下秩序】，


  認真覺得韓國對於這種人性腹黑的劇情，真的非常擅長阿～


  描寫人性心機和利益衝突的糾葛，都非常直入人心，


  而此次與韓國青龍影帝薛耿求演對手戲的任時完，


  上次見到他的時候還是在【正義辯護人】演被刑求的學生，


  這次不管是外表的身材（養眼），或是內在的演技都有很大的成長，


  想看熟男跟小鮮肉可以選【不汗黨：地下秩序】，要看正妹可以選【惡女】，


  兩部共通點都是節奏上都很輕快，幾乎沒甚麼冷場，劇情都很腹黑～


  而且兩者主題講的幾乎是同一件事，就是關於相信（信任）的故事。


  不過，我覺得【不汗黨：地下秩序】的黑色幽默又多了一些，以黑社會為例，


  分析當人性面對利益上也更深入，


  【惡女】在武打動作上，比較好看些。




  影評朋友跟我推薦韓國早些另一部類似片型的【闇黑新世界】，


  說比狠（痛）的畫面更多，


  這部片的血腥，有些畫面是讓人用想像的，


  但你知道，有時候想像比實際上畫面呈現的感覺更恐佈，不過大概就一幕吧．．． 。




  - - - - 以下內容含有劇情 慎入有雷區 - - - -


  - - - - 以下內容含有劇情 慎入有雷區 - - - -


  - - - - 以下內容含有劇情 慎入有雷區 - - - -




  本片一開始算是採倒述法，時間軸從男主角賢修（任時完 飾）出獄開始，


  往前描述他在獄中的日子，如何跟監獄老大宰虎（薛耿求 飾）建立換帖的兄弟情，


  一步步揭開他身為臥底間諜的身份，如何斡旋在黑白兩道之間，


  其實，個人覺得這部電影，用一句話可以說完：「人的立場，常隨著利益在轉變。」




  （一）沒有關係，就建立關係


  1.從獄中到外面拼鬥的世界，都在看「利益」跟「關係」這兩件事，


  監獄跟現實社會用一道牆隔開，


  除了「自由」這件事以外，一樣存在著「階級」跟「利益」，


  男主角賢修（任時完 飾）從在監獄中的私鬥展露頭角，


  被裡面的老大宰虎看到，覺得這小子有腦子又有趣，


  在他身上可以看到很會打，一開始就有小角色願意跟著他，因為跟著他不會被欺負，


  一種有人罩的概念，再加上賢修的警察臥底身份，宰虎在想是否把他納入自己的人，


  這個時間，雙方都想要跟對方發生關係，


  對於賢修而言，跟黑社會宰虎接近並混熟，是一個任務，


  救了宰虎的命，讓他施恩給對方，再用心善這面去讓宰虎相信他，


  對宰虎而言，覺得賢修是個人才，他想攏絡對方，不惜用對方最難以割捨的親情，來得到對方的心，


  （了解對方愛什麼，再給予莫大的恩惠）


  －－＞這裡稍稍覺得有點諷刺，白道有時候規矩太多，做不來的事情，黑道卻可以辦到！


  所以，黑白兩道的差別，大概一個是檯面下暗著來，跟檯面上明著幹吧！？


  （可以正大光明地去抄你的穴。）


  2.除了「利益」以外，攸關人之間的就是「關係」，


  當宰虎發現典獄長對於「菸的利益」態度突然轉變的時候，怎麼用錢賄絡不來的時候，


  原來權力角力的另一頭比他更有關係，因為是老鄉，這就是「人情」，


  於是乎，打破這樣的關係，當危及到典獄長本人的利益時，這層關係又頓時瓦解了。


  所以，人的立場，是隨著利益而改變。




  （二）人的立場，隨著利益改變


  如同本片老大宰虎所說的：「不要相信人，要相信眼前的局勢。」


  因為人會往對自己有利的那方去靠攏，


  片中被幹掉的老大及老二，獄裡獄外就四個，就連有血緣關係的，都暗藏著鬼胎，


  不論是否為黑社會，無非說明的就是人性的權力鬥爭，


  在拉攏人的過程中，必須要了解對方在乎的是甚麼？


  譬如下屬（千隊長）在辦大案子，想尋求上司的支持時，


  會拿幫上司「升官」來當作一個誘因，


  千隊長想要下屬（賢修）能夠服從她的命令，


  拿出賢修最在乎的人－媽媽（用換腎）來攏絡他，


  同理用在宰虎對於賢修身上。


  這部片，很多的地方都不時用這些元素在告訴觀眾，情勢是跟著利益在轉變的。




  （三）當相信的時候，就同時承擔著背叛的風險


  間諜這個角色，存在於黑白兩道中間的灰色地帶，


  而白道走入黑道這條路，如同之前風靡一時的電影【無間道】一樣，


  到最後都很難洗白，


  老大宰虎說背叛他的人很多，另一方面也說明著他不相信人，


  當一無所有的賢修，感覺像全世界都拋棄他的時候，


  我就在想對他又有甚麼可依戀的！？


  拿主角最在意的人（或最相信的人）來折磨這個角色，


  這是我同時在韓片【惡女】【不汗黨】所看到的，


  某種程度而言，賢修也是個被人背叛的角色，後來的反撲也算是有個根據來源。


  而這句「不要相信人，要相信眼前的局勢」倒是貫穿著本片從頭到尾。



  【結論】


  對於描寫人性面，韓國電影這方面真的蠻優秀，


  本片的黑色幽默，我還蠻喜歡，


  例如：用耶穌來比喻監獄中的老大，決定獄中的人日子是否過得好，


  （用最後的晚餐，來呈現一種幽默的構圖）


  任時完跟薛耿求的演技，也很值得一看！


  劇情最後，讓我有驚艷的感覺。




  電影【不汗黨：地下秩序】喜愛的佳句 :


  1.在這道牆後只有兩種人，一種是可以招惹的，另一種是不可招惹的！


  「那你是哪一種 ?」


  「我剛好是制定那個標準的人。」


  2.我跟著你走在一起的原因是，那些惡煞才不敢招惹靠近我。


  3.「他不像王，比較像總統。」


  「這有甚麼差別？」


  「有，總統是有任期的，時間到就會被換掉。」


  4.「我媽說看到可憐的人不能袖手旁觀，要出手幫忙才可以。」


  5.你的口才比你的拳頭重要，加點感情進去。


  6.開戰的話，大家都會向金錢靠攏，現在就安份一點。


  7.對我來說，媽媽是我的一切，現在的感覺像被全世界拋棄。


  8.不要相信人，要相信眼前的情勢。


  9.他有心善的一面，你我打死都無法了解這點。


  10.人生中所發生的事情，大多是從後腦勺暗著來的，而不是眼前明著來！


  11.「我從你這個年紀就出來混，你知道這些年多少人背叛我嗎？」


  「我不會強迫你相信我，但我相信你。」


  12.我不跟屍體喝酒。


  --'
