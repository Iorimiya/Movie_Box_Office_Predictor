content: '校園暴力

  家庭暴力

  非原生家庭

  借貸

  高利貸

  暴力討債

  偷竊

  黑道

  政治利益


  一開始我以為是跟台灣的艋舺類似的片

  結果完全不一樣

  好黑暗


  這部片框架上應該算是好的

  只不過只有框架而沒有填滿它的內容

  看完有點沉悶

  幫了又壞了

  壞了又有點好起來了

  又壞了

  最後的結局也很怪 很違和…



  --'
