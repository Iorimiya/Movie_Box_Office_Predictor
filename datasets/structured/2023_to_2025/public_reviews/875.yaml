url: https://www.ptt.cc/bbs/movie/M.1723129267.A.D70.html
title: '[普雷] 不羈騎士'
content: "7/31(三)17:30長春國賓A廳《不羈騎士》(The Bikeriders)特映，講述六十年代美國摩托車俱樂部的崛起\n透過紀錄片訪談女主角凱西(Kathy)的形式，紀錄班尼(Benny)加入強尼(Johnny)建立的芝加哥搗亂幫\n\
  搗亂幫從一開始熱愛重機的俱樂部，並擴大勢力範圍在各地出現分部，最後漸漸變質走向幫派化\n劇情有點悶但看到強尼雖為創辦人卻無力阻止，班尼則是急流勇退還算是不錯的犯罪紀錄片，俱樂部的結局雖不勝唏噓但熱愛重機的心卻不會變\n\
  特映還特別放了台帥氣哈雷機車可以合照，長春國賓A廳的銀幕小而且高低間距非常糟糕，很容易被前面擋住，唯一值得稱讚音響效果不錯有呈現出重機由後往前騎去的聲音變化\n\
  \n--\n\nSent from \n\n--"
