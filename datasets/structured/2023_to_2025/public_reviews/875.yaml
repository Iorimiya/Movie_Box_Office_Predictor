url: https://www.ptt.cc/bbs/movie/M.1721195217.A.3A1.html
title: '[好無雷] 美國60年代版的山道猴子-不羈騎士'
content: '劇情沒啥特別，預告看看就可以知道大概了。




  故事在講1960年代，Johnny(Tom Hardy飾演)，本來只是創立個大家愛騎車的弟兄，

  可以一起討論車的俱樂部。


  但隨著俱樂部的規模越來越大，Jonny也越來越無法控管，進而成了像黑幫一樣。


  故事是由男二Benny(Austin Butler)的女友，後來變成老婆Kathy

  (Jodie Marie Comer飾演)的視角，來講述整個故事。


  我看的當下，覺得這故事真像是山道猴子。


  甚至這劇本，還是由同名寫真The Bikeriders啟發來的創作，拍追焦原來老一輩也有玩



  如果不是要追求單純感官刺激，想看一點懷舊美國摩拖車騎士風情，我覺得此片還不賴。

  我看完又去FB marketing, 看看家附近有賣什麼機車，在意淫了。


  --

  人家山道猴子，好歹還有正當工作; 我都說"黑幫"了，甚至預告片Tom Hardy一不爽

  就燒人家家店，在我看來山道猴子乖多了。'
