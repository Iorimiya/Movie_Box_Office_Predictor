url: https://www.ptt.cc/bbs/movie/M.1737902590.A.C77.html
title: '[負無雷]  黑祭司2：闇黑修女 只有宋慧喬能看'
content: '‧


  【黑祭司】【破墓】的編導「張在現」，沒有接下本部電影的編導，促使【黑祭司2：闇

  黑修女】走向了完全不對的方向；劇本、氛圍、恐怖、角色發揮等，成為一部完全不合格

  的驅魔恐怖片，雖然劇情細節有許多對宗教玄學的隱喻，但後來的重要性都莫名被沖淡，

  甚至整體上與首集相比，更是有著天差地遠的差距，完全只靠著盛世美顏快30年的宋慧喬

  ，來維持本片僅有的可看度。



  ‧


  【黑祭司2：闇黑修女】全片節奏緩慢，且故事性相當差，只是平淡著走完一場驅魔劇，

  其橋段完全不夠刺激、恐怖，甚至比去年的「心葬」還要糟糕許多，完全感受不到驅魔恐

  怖片該給的合格氛圍及特效；雖然有創意的結合天主與巫覡的合作驅魔，但並沒佔比很多

  的重要性，與破墓的跳大神相比，僅僅只是小巫見大巫的存在。



  ‧


  睽違10年，再度出演大銀幕的宋慧喬，美顏依舊，甚至覺得離婚後的她，更顯自信；只是

  本部電影劇本，沒有能讓她可以有足夠發揮演技的地方，全劇幾乎都是撲克臉，加上極愛

  抽煙的角色設定，彷彿是女版的康斯坦丁。


  而另一重要女演員全汝彬，比起在「哈爾濱」的演出，雖然出場短暫，但幾乎完勝在暗黑

  修女中的表現；且劇本根本無法顯示她的角色重要性，算是相當可惜。



  ‧


  【黑祭司2：闇黑修女】算是部相當令人失望的驅魔電影，ScreenX版本也沒有為本片加上

  太多分，幾乎是完全不用選擇SX版本，三銀幕全開的時間非常短，要不是因為看長年看配

  飯戲劇「順風婦產科」，想進場支持一下宋慧喬，不然是部不推薦進場的驅魔電影。





  ‧



  追蹤茶太郎IG




  --'
