title: '[好雷]在戰爭開打之際Father & Soldier '
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n  覺得這部片很好，所以來推一下\n\n  由法國影帝級的男星 歐馬希 主演，電影逆轉人生的男主角\n  他比較為人熟知的美國電影\n  應該是侏羅紀世界第一集裡，跟克里斯普瑞特一起養迅猛龍的那個黑人朋友\n\
  \n  劇情就是在一次大戰期間，在非洲部落生活的純樸父親 巴卡里\n  有一天法軍來抓人當兵(因為是法國殖民地吧)，他的兒子 蒂亞諾被抓走\n  媽媽傷痛欲絕，作為父親的巴卡里，下定決心要把兒子帶回家\n\
  \  於是立刻決定自願報名參軍\n\n  於是父親巴卡里與兒子蒂亞諾在同一個部隊一起前往前線\n  巴卡里要兒子千萬不要說出他們的父子關係，並且暗地裡不斷找機會避開戰爭\n\
  \  一開始他找到一個好像神通廣大的黑人\n  並且對方提出要求，想避開前線的話，就拿錢來，他可以安排讓人當伙房兵\n\n  之後又經歷了突擊山頭，法軍損失慘重\n\
  \n  巴卡里想跟兒子去伙房當兵的計畫沒有成功\n  他繼續想方設法。只為了保住兒子的命\n  後來就演變成準備逃兵，想從戰場脫離，偷渡回非洲\n\n  兒子蒂亞諾從一開始的可憐小夥，在戰場上隨時要死的弱者\n\
  \  逐漸不斷進步，他也學會了法文，能夠跟戰友及長官溝通，反而爸爸巴卡里只會講族語\n\n  後來中尉尚布雷看中蒂亞諾的能力與堅毅的個性，選擇他升下士來帶領士兵\n\
  \  畢竟他會說法文，能夠代替中尉跟部下溝通\n  尚布雷中尉其實也是年輕人，他的父親就是這支軍團的領導尚布雷將軍\n  中尉無論如何想在父親面前證明自己，他要立下戰功\n\
  \n  蒂亞諾答應中尉後，升任下士，這時他變成了父親巴卡里的長官了\n  隨著不斷的訓練，蒂亞諾很快就有下士的樣子，也越來越融入軍中\n  甚至已經產生了榮譽心，很多黑人軍士是自願參軍，因為可以脫離貧窮\n\
  \  如果能活到戰後，甚至可以成為法國公民，之後就能帶家人移民法國\n  蒂亞諾也開始產生了想在軍中努力的想法\n\n  但巴卡里從未改變過心志，他要帶兒子回家，他只想帶兒子回家\n\
  \  母親還在家裡等待著兒子的歸來\n  父子後來有發生岐見，歷經尷尬，爭吵\n  兒子蒂亞諾從一個只聽爸爸話的純真男孩，開始轉變成軍人，甚至反抗父親的意志\n\
  \  巴卡里不願意見到兒子\"被白人洗腦\"\n  竟然想在軍隊裡往上升，爭取什麼為了祖國法國的榮譽所以要拚命戰鬥的想法\n  巴卡里覺得兒子已經不是在家鄉那個乖巧老實的兒子\n\
  \  他十分沮喪又生氣。但他仍堅定要將兒子帶離這個戰場回家去\n\n  後來巴卡里交了一個跟他一樣想逃兵的朋友，並且湊足了錢，可以偷渡回非洲\n  與此同時 尚布雷中尉已經在策劃一次特攻行動，要以極少數人力攻陷山頭\n\
  \n  巴卡里要蒂亞諾立刻跟他一起走，千萬不能參與今晚的特攻，馬上閃人逃兵\n  但蒂亞諾說已經無法抽身，他要與戰友一同作戰\n  巴卡里氣到把兒子揍了\n　然後強迫兒子跟他一起上馬車偽裝後離開軍隊　\n\
  \  但是當馬車走到一半時，巴卡里發現兒子蒂亞諾竟然不見了\n  原來蒂亞諾中途跳車回到前線，他堅持要參與這次進攻作戰\n\n  偷渡的朋友要巴卡里跟他一起走，現在回去參與那種自殺式作戰必死的\n\
  \  這時巴卡里才說出實話，蒂亞諾是他的兒子\n  他絕不能放兒子一個人在戰場上，他要回去\n  於是巴卡里與朋友互道珍重了\n\n  巴卡里跑回戰場，這時軍團正在等待特攻小組先拿下砲台，然後發起總攻\n\
  \  蒂亞諾就是特攻小隊之一，巴卡里不顧危險離開戰壕，拚死前往砲台\n  他搶救受傷的兒子，而砲台也拿下來了\n  法軍此時開始發動總攻，德軍也衝出戰壕，兩邊的決戰開始\n\
  \n  最後...............\n\n  必須要保留，有興趣的朋友可以去看，我覺得結局很棒\n\n  -------------------------------\n\
  \  電影的最後一幕，是在大戰結束後，在戰場上挖出了無名的8名法軍士兵白骨\n  他們被遷葬至巴黎的凱旋門下，紀念這場戰役，也向為了這場大戰犧牲的士兵們\n \
  \ 致上敬意\n  -------------------------------\n\n  自己打完之後才發現，這樣用文字寫好像讓電影看起來滿精彩的\n  實際上並沒有，畢竟這是法國電影\n\
  \  法國電影的思維模式與美式電影有很大的不同，節奏也很不一樣\n\n  這部電影看來是戰爭片，實際上更像劇情片甚至文藝片\n  如果你是期待看到戰爭大場面的人，那我只能說還是不要看\n\
  \  因為這部片沒有大場面\n  只是借由這個背景來表達很多立場與想法\n\n  片中巴卡里與蒂亞諾的父子之情，兒子的成長卻未必能如父親所願\n  還有在一戰時期法國用殖民地黑人當士兵送往前線\n\
  \  後來在戰後許多非洲人就這樣成為法國公民，也是法國移民的歷史\n\n  歐馬希所飾演的巴卡里，非常生動，他在片中一心只掛念兒子很令人動容\n  尚布雷中尉一心只想實現他父親尚布雷將軍的願望\n\
  \  而蒂亞諾則不想實現他父親巴卡里的願望\n  這種衝突與相對也很有意思\n\n  這部片從開始沒多久，你就感覺有可能父子有一個人會死去\n  但你會一直無法判斷，到底誰會死掉\n\
  \  卻又有一種，父子能不能一起回家的期待\n  我覺得本片這個感覺做的很好\n  直到結局出來你才會知道結果\n  所以這個不能爆雷\n\n  本片有入圍坎城影展，我覺得滿值得一看的\n\
  \  推薦給大家，謝謝\n\n\n--"
