url: https://www.ptt.cc/bbs/movie/M.1741700474.A.FD2.html
title: '[負雷] 開棺'
content: '#無雷短評




  結合靈異與愛情的恐怖片。改編越南一起神秘民間傳說「屍體附魔」。電影序幕講述古時

  候有一名女子在一處洞穴裡進行某種詭譎儀式，接著就釋放出了一具棺材裡某種邪惡力量

  。




  劇情上，起初的故事設定上並沒什麼問題，先是簡單鋪陳了男女主家庭和情感部分，直至

  碰上那具棺材後導致詭異事件接二連三。但比較誇張的是劇情進入後半段，會頻繁到幾乎

  每一幕都出現鬼，只是不論是在製造靈異點還是嚇人手法幾乎千篇一律，非常公式化，加

  上過時導致會很容易預知的Jump Scare，看到後面會覺得有點麻木跟反感。




  如同上述所說，到後半已經呈現到已無時無刻都會有鬼的無限迴圈，甚至惡魔強大到讓我

  一度以為我是在看鬼玩人，就在覺得整部戲灑狗血到開始失去原有的真實性後突然來給你

  個大反轉，簡直就是開了場大玩笑！




  雖然最後這令人難以招架的走向是要用來合理先前所有不合理的地方，但因解釋太過倉促

  還是讓整部片疑點重重，連帶影響前半的故事線與時間軸，也難以辨別劇情真假性，最終

  的反轉依舊無法填補前面所挖的大坑。




  雖然劇情上較無法讓人接受，但恐怖程度是夠的，就是可惜在嚇人手法太過單調，不過對

  於不挑劇、單純享受恐怖氛圍或鬼怪畫面的人來說，應該還是會蠻喜歡的，但如果偏好劇

  情的，會比較建議去看同期另一部《邪降女帝》。





  滿分100分 這部我給57.5吧











  --'
