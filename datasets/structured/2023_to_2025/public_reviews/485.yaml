title: '[好雷] 開棺,看過最恐怖的越南電影'
content: '剛在台中的日日新看完了

  看過的越南恐怖片雖不多

  但這絕對是當中最恐怖的

  片中的jump scare至少十幾個


  先說結論,以驚嚇指數來說,會給到90分

  但以劇情來說,只會給70分

  因劇情雖不難猜,但轉折點也不少

  結局更是!




  雷文防雷資訊頁

  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  一起看電影的越婆說

  此部的故事發生在多年前

  所以片中背景,類似民國初年的鄉下


  劇情部分,預告中就已知

  本片是打開棺材後發生的故事

  打開被解封印的,當然是個厲鬼

  而前一個小時的主題

  是貪心之人拿棺材內的XX後領便當


  後面進展到女主角,一樣在接觸XX後

  出現超多發現異樣,轉頭轉眼睛看到XX的驚嚇畫面

  她被賜死但也被附身!這時變成男主轉頭轉眼被驚嚇

  他發現妻子變超不正常,跑去找驅魔師

  這時心想,後面又是驅魔片段了吧...




  錯!驅魔師後來也領便當了

  這時心想,後面只能火燒消滅了吧...

  又錯!有燒但沒不死...

  所以結局到底如何呢???

  賣關子給大家自己去猜嘍

  就是個大反轉!


  本片結束在播放字幕時

  訪問有類似經驗的家屬

  也有訪問挖墓者

  問及他們是否曾看過鬼魂?

  答案只能說,電影中的都是裝的...


  最後最後,片中最恐怖的是哪個???

  答案是,出現在片尾字幕結束之後的

  到底怎樣恐怖?去看就知道嘍!


  --'
