title: '[爛雷] 【開棺】他X的耍了觀眾2小時'
content: '‧


  我的媽呀！實在有夠難看，完全被耍了2小時，嚇人的點確實夠多，為膽小觀眾提供非常

  長的試膽時刻，但99%的手法都是極為、極度、極其廉價的Jump scare，千篇一律的手法

  ，我就問聶徵導演是不是偷懶複製貼上？上一部湄公河水鬼也是爛到有剩，這部居然青出

  於藍更勝於藍。



  ‧


  劇情空洞、邏輯廢去、硬塞風格不一橋段，整部片演了一個多小時，就看惡鬼複製貼上的

  嚇人殘殺，完全沒有進入劇情主軸，等到最後半小時才想起要開始說故事了，但最後的反

  轉非常生硬，甚至跟前面1個多小時幾乎不搭嘎，根本耍進場的觀眾。


  恐怖橋段演一演，卻硬塞好幾段奇怪風格的浪漫愛情、戲劇，可能是越式幽默，但同場的

  越南移工沒聽到他們笑過一聲，甚至無聊到他們開始細聲聊天。


  邏輯也相當廢，女主角跑回家緊急的將庭園大門鎖住，但妳家根本沒圍牆啊！！門旁邊就

  只是跟人差不多高的草，隨便都能走進來，鎖個屁門。


  劇末登場的法師，也曾經成功封印惡鬼，但加入組隊打Boss戰，不到10秒就登出，完美詮

  釋這個角色只是出來說明劇情設定。



  ‧


  搞了一堆惡鬼殘殺的戲碼，到最後面反轉竟是男女主角出車禍而死，男主接受不了現實發

  瘋後的幻想，一直把女主的屍體保留在家中，當然這個橋段是根據片尾片段的真人真事，

  覺得片尾片段都比正片好看跟詭異；但最後一個片尾片段，卻又把整體事件拉回真有其惡

  鬼，啊到底是怎樣啦...

  【開棺】是部完完全全耍了觀眾2小時的極爛鬼片，氛圍完全營造失敗，只剩可悲低廉的J

  ump scare撐場，推薦適合想看爛片的人進場。



  ‧




  追蹤茶太郎IG




  --'
