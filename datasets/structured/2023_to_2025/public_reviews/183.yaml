title: '[請益] 邊境風暴   劇情裡的一個疑問'
content: '邊境風暴

  講一對難兄難弟自黎巴嫩難民營出走，想要去德國，

  去年8月上映的電影，滿冷門的，

  可能看過的人不多，也不知道在這裡發問會不會得到答案

  以下有雷



















  主角2兄弟協助一位小男孩去義大利，

  找了一個女人假裝是男孩的母親，

  送他們去搭飛機。

  之後，主角打電話給他們，一直都沒人接，

  只聽見義大利人在講話。


  所以女人跟小男孩到底發生什麼事？

  有順利到義大利嗎？


  謝謝回覆


  --'
