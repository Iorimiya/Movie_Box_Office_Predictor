title: 'Re: [情報] 新海誠 《星之聲》電影預告'
content: '這部片很棒啊!!!!!


  我就是因為這部片對新海誠驚豔的。


  當時很難想像說，這部片居然是


  雖然誠哥就真的不會畫人(所以他後來找田中將賀是正確的)，

  但是真的很難想像，這會是一個人從頭到尾做出來的作品。


  完成度超高，而且還很感人，配上天門的音樂，

  我到現在還是感動到會流淚。


  我一定會去看。


  對了，順便問一下大家，你們知道田中將賀在跟新海誠合作之前，

  最有名的動畫作品是啥嗎?


  答案是一部叫做"學園默示錄HOTD"的作品。


  我只能講，這是一部很難跟新海誠作品連在一起的動畫，

  關鍵字:毒島學姊，超棒的!



