url: https://www.ptt.cc/bbs/movie/M.1729308695.A.81F.html
title: '[討論] Apple TV特價 星之聲$40/熔爐/鬼馬小精靈'
content: '【2024/10/19 Apple TV 特價報】

  星之聲／鬼馬小精靈／TÁR塔爾／喬登皮爾作品／熊麻吉／熔爐／瘦魔人／暴風驚魂夜／

  上期追加特價

  －

  本期特價報首推超級低價，$40的新海誠電影《星之聲》。這部短片是新海誠成名前的作

  品，也算是讓他打開知名度的一部。與科幻情節結合的愛情故事，加上新海誠令人驚豔的

  美術功底，讓這部片在當時成為許多人注目的焦點。這次的超低特價絕對是相當超級的收

  藏機會。

  －

  然後是這次誠意滿滿的環球片單。因應即將到來的萬聖節，討喜的《鬼馬小精靈》又來到

  片單內了，喜歡他的朋友千萬不要錯過。喬登皮爾的三部恐怖作品也久違地同時$90，是

  一口氣入手的絕佳時機。還有充滿成人笑點的《熊麻吉》也是兩部都在特價之列，可以把

  握一下。

  －

  其他$90的電影還有情節異常沉重的經典劇情片《熔爐》，以及由知名都市傳說改編而成

  的《瘦魔人》。《T-34：玩命坦克》則是以坦克為主軸的二戰電影，喜歡二戰裝甲軍武的

  朋友也可以考慮收藏。最後，這次也附上前幾天的追加片單．其中《嬰兒轉運站》等片有

  可能是快閃，大家趕緊趁回價錢把握一波吧！

  －

  以上，祝大家看片愉快！

  －

