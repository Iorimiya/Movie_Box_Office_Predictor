url: https://www.ptt.cc/bbs/movie/M.1717855059.A.E38.html
title: 'Re: [  雷] 星之聲 解析度很不行'
content: '你要想的是，這是新海誠喔!


  他的商業片有田中將賀這些老手幫他作畫，

  但"星之聲"完全是他一個人畫，從人物到機器都是他畫，

  所以這才是讓人嚇到的地方，以一個人的能力能做到這樣，

  這是很多動畫人都無法完成的事情吧?


  總之，想到這是一個人從頭到尾單獨創作的，你就不會介意臉怎麼那麼大餅了，

  因為誠哥就是喜歡大餅臉嘛!(你看他女兒的臉就知道了...)


  --'
