content: '「」


  獨立製作動畫電影一鳴驚人之作《》


  6月7日 (五) 大銀幕感動獻映！




  我們，大概是，

  被宇宙和地球拆散的戀人中，

  最初的世代。



  《》6月7日 (五) 全台上映


  「億萬動畫大師」獨立製作動畫電影一鳴驚人之作！


  第34屆 星雲獎 獲獎作品


  第6屆 日本文化廳媒體藝術祭動畫部門 特別獎


  第8屆 AMD Award 最佳導演獎


  國中3年級的夏天，獲選拔進入聯合國宇宙軍隊的長峰美加子，和心儀的同學寺尾昇道別

  。美加子離開地球，昇則進入了普通的高中。被地球和宇宙拆散的兩人靠著電子郵件保持

  聯絡，但隨著美加子離開地球，郵件來往所花費的時間也愈來愈長……


  #車庫娛樂  #新海誠


  資料來源：


  --'
