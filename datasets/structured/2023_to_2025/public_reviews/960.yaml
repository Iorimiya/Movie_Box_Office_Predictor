url: https://www.ptt.cc/bbs/movie/M.1718086777.A.76B.html
title: 「星之聲」24分鐘的電影還是淚流滿面
content: "先上人權\n\n \n睽違24年的二刷\n上大螢幕當然要來回味一下\n中午跟老婆說出去買個便當回來當午餐\n利用半小時空檔去了附近的電影院\n\
  果不其然的一人包場\n \n坐在全場最喜歡的位置彷彿進入了時光隧道\n回到阿昇長大成人的24歲\n那時候看到新海誠獨立完成的第二部作品\n全身感動到顫抖，眼淚也隨著片尾曲落下\n\
  \ \n沒想到過了22年\n我還是會為了一部只有24分鐘的作品落淚\n也許是因為第一對被宇宙與地球拆散的戀人\n \n結束放映後下去問櫃台還有海報嗎？\n櫃檯說什麼海報？我們沒有那種東西\n\
  我瞄了一眼說你後面那一疊是？\n（我都包場怎麼可能這麼快就送完了？）\n \n\n \n吐槽一下都2046年了還在GD90\n但也許就是這種需要傳達八年的簡訊\n\
  才能傳遞星之聲吧…\n----\nSent from on my iPhone 15 Pro\n \n--"
