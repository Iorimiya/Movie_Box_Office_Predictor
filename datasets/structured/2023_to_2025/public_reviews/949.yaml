title: '[情報] 泰國恐怖電影《屍油降》全台上映戲院'
content: "由 執導，咒語、儀式通通來真的\n\n【】6/14 (五) 全台上映\n\n\n揭 秘 泰 國 最 陰 屍 油 降 頭 術\n\n\n\n《》6月14日\
  \ (五) 恐 懼 降 臨\n\n\n  取材自泰國最神祕降頭術的《》\n\n導演 馮多帕塔查蒂馬拉（Phondolphat）\n\n是位，專研相關議題數十年。\n\
  \n電影中可以看到各種儀式的細節，\n\n連使用的咒語都是真的，還原度高達9成！\n\n導演也表示在每次開拍前都會先告知神靈，\n\n讓拍攝期間參與的神靈保佑現場一切順利\n\
  \n電影預告：\n\n\n\n上映戲院：\n\n\n\n阿坤是個孤兒，由村裡強大的薩滿萊穆養大。\n\n他天生帶著天命，卻偷偷提煉屍油賺錢，沒想到這觸怒了鬼魂、招致報復......\n\
