url: https://www.ptt.cc/bbs/movie/M.1718777234.A.AF0.html
title: '[負雷] 屍油降'
content: "就很難看\n\n本來打算稍微簡介一下劇情，但發現怎麼描述都看起來很無聊，因為劇情走向跟人物設定整個就是莫名奇妙，場景切換跟劇情推進都很突兀、有種硬要的感覺，就連劇中穿插的應該是希望能搞笑的場景都很硬要，完全笑不出來。\n\
  \n應該可怕的地方不可怕、應該感傷的地\n方不感傷，結局更是充滿不合理的溫馨跟圓滿，要不是可惜我290塊的票錢真的是看一半就想走……總之就是不建議看，時間多錢多硬要的話、我會建議坐在信義威秀十七廳外面的按摩椅按290塊，也好過入場浪費104分鐘放空思考我為什麼要入場看這部電影。\n\
  \n--\n\nSent from \n\n--"
