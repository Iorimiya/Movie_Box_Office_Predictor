title: '[討論] 《機密特務阿蓋爾》美國票房大爆炸？'
content: '《阿蓋爾》首映美國票房為1800 萬美元。

  據報道，這部電影的製作成本為2億美元。




  《阿蓋爾》的製作預算高達 2億美元，但首映當天的票房收入僅為650 萬美元。




  《阿蓋爾》有望成為 2024 年第一部備受矚目的票房失利影片。這部眾星雲集的間諜電影

  在首映日和預映期間僅收穫 650 萬美元。




  馬修范恩 (Matthew Vaughan） 的 《阿蓋爾》 (ARGYLLE)在美國國內首映票房為1,600

  萬美元。




  票房：《阿蓋爾》首映票房 1800 萬美元但慘敗




  這樣算是炸了嗎？




  看台灣的票房好像也沒有很好的感覺......





  評價也只有C+


  是覺得還不難看，大概感覺就低配版的金牌特務


  資料來源：X





  --'
