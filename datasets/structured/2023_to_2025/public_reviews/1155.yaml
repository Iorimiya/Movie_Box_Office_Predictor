url: https://www.ptt.cc/bbs/movie/M.1707030597.A.9A4.html
title: '[雷] 機密特務阿蓋爾：蠻有潛力但有點可惜'
content: '很久沒看電影了，前幾天和朋友一起去看機密特務阿蓋爾，看到海報上的卡司陣容感覺蠻厲

  害的，但其實是完全不知道內容就去看了，我們連預告片都沒看XD


  看海報想說竟然是 dua lipa 當女主角、亨利男主角（獵魔士超帥，雖然亨利在這齣的角色

  造型髮線高到出戲哈哈哈）結果電影開演才發現 dua lipa 的角色戲份根本就是客串而已吧

  ！為什麼還能站海報前面的位置…!! 雖然可能是故意的，但還是有點問號，真正重要或戲

  份多的角色反而都在海報後方


  劇情本身還蠻有意思的，穿插作品和作者，不同的視角切換都還蠻新鮮的、也不會到混亂，

  很多作者都會說自己的角色是活的、寫著寫著角色會有自己的想法、角色會自己產生出劇情

  ，這部電影的拍攝手法就以視覺很鮮明地帶出這樣的概念，看到作者和自己寫出的角色對話

  、文字和場景的變化，都會讓人想到智慧手機流行之前捧著書本的美好時代（現在連小說漫

  畫都是用手機看了，突然很想念以前泡在書局的歲月QQ）


  劇情有很多反轉，雖然題材算是新鮮，有些反轉的理由也還可以接受，但中間硬要插入感情

  戲覺得實在很多餘  動作戲的部分有點不合理，尤其女主角就是作家身材（應該是故意的

  ）可是都坐著寫書那麼多年了，怎麼可能忽然跑起來都不會喘!!!!! 真的超不合理，就會很

  出戲XD


  貓咪很可愛，但好像也有一點為了塞劇情和塞劇情的感覺，總之覺得整體可以再更精簡一些

  ，不然可惜了這麼強悍的卡司，有些很沒必要的劇情會有種出戲的感覺QQ


  整體是非常歡樂的，如果想殺殺時間可以觀賞 、歡樂活潑又有貓，很有賀歲片的氛圍，自

  己覺得比較偏向無腦的輕鬆小品（看片尾的彩蛋感覺像是要變成系列作品的趨勢，但我自己

  覺得先不要吧哈哈哈哈）


  --'
