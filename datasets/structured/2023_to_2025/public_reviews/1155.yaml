url: https://www.ptt.cc/bbs/movie/M.1708942530.A.80A.html
title: '[好雷] 機密特務：阿蓋爾-洛克威爾的腦粉會愛死'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  雖然已經過段時間了，但我還是想推一下─或者說，至少聊一下─《機密特務：阿蓋爾》

  (Argylle)。

  .

  我知道這片在宣傳上造成了很大的誤導，尤其海報上讓亨利卡維爾站在C位簡直就是詐欺

  ，不過我得說，做為一個腦粉，當我看預告片發現主角原來是山姆洛克威爾的時候我的眼

  睛簡直都亮起來了。

  .

  如果你完全是衝著想看亨利卡維爾演一部特務動作片，那必然會失望，他的戲份極少─趙

  喜娜更少，順便提一下─但如果你跟我一樣愛山姆洛克威爾，你會愛死這部電影。

  .

  我想說的是，山姆洛克威爾用他的魔性舞蹈貫穿了他的整個演藝生涯，光是看他跳舞就是

  一種享受，我對好萊塢最大的願望之一就是趁他還能跳得動、還有體力的時候，讓他演一

  部為他量身打造、從頭跳到尾的歌舞片，而每年隨著他的年紀又大一歲，這個夢想似乎又

  離我更遠一步。

  .

  山姆洛克威爾今年已經56歲了，必須盡快和一部載歌載舞的優質歌舞電影發生合約關係。

  .

  而這部《機密特務：阿蓋爾》在某種程度上來講，可以說是稍稍地實現了我的夢想。

  .

  我不知道是劇本原本就這樣設定，所以才找了山姆洛克威爾來演，還是說他加入之後才修

  改了劇本，但這個角色簡直就是為他量身打造：看似邋遢又輕浮，態度總是吊兒郎當的滿

  口垃圾話，但其實該硬的時候還是能硬起來、是個實力堅強又可靠男人，這是山姆洛克威

  爾最擅長詮釋、也是他最迷人的一個面向。

  .

  更重要的是，這個角色喜歡跳舞。

  .

  這次他的舞蹈不再是跟劇本無關的神來一筆，而是直接被放進了劇情當中，如果你還沒看

  這部電影，我不爆雷他的舞跟這劇情有什麼關係，但我想說，最後有一場他在煙霧彈中起

  舞的場景，那很可能是我最近看過最美的一個畫面，浪漫又中二到不行，因為在跳舞的那

  個人是山姆洛克威爾，我在戲院感到動到幾乎要哭了出來，這就是我要看到的畫面！

  .

  當然這部電影評價不太好也不是不能理解，馬修范恩在這片玩性大發，但他似乎沒能掌握

  好這片的文戲，並不是說劇情無聊，而是劇本已經有點失控了：馬修很明顯想要玩劇情逆

  轉，而且還要玩不只一次，但他很像是想到了什麼很酷很屌的點子跟設定就要放進去，也

  不管這個轉折是否合邏輯、適不適合出現在這個劇情脈絡之中，感覺劇情一直演到後面，

  馬修自己都不知道自己在寫什麼東西了。

  .

  而以華麗的動作片段見長的馬修范恩，在失去了布萊德艾倫(RIP)這位他御用的動作指導

  之後，明顯動作場面的質感比不上之前的幾部電影，影片前半段的幾場動作戲雖然離不好

  還有段距離，但如果是跟馬修范恩自己的其他電影比的話，不得不說是沒有達到我對這部

  電影的期待的。

  .

  但還好，最後還有兩場精彩的大型動作戲總算讓我們看到馬修回神了，一場前面提到的煙

  霧彈，還有一場滑冰風格的戰鬥戲，後者有點可惜的點在於主角本身並不擅打，不然在設

  定上來講其實可以打出一段很精采的短兵器戰的。但私心覺得更遺憾的是我還是覺得這兩

  場動作戲應該要對調，把煙霧彈那場擺在最後當電影的收尾我可能會更喜歡，沒辦法，誰

  叫我就是這麼愛山姆洛克威爾，愛到我覺得這片就應該用他的舞來收尾才對。

  .

  然而不幸的是之後還有一段動作戲，涉及據透我就不講了，我只能說這段真的多了，一點

  必要也沒有，也不是說打得多好看。

  .

  但不管這麼多了，我愛山姆洛克威爾，總之所有人都給我去看這部電影。


  --

  我覺得《鋼鐵人二》，很難看，他上台跳舞那段真的救了整部電影

  這片我超喜歡，完全就是為了他量身打造的，他在我心目中才是全好萊塢最適合演死侍的

  人選，這片的表演跟人設有算是小小滿足我這個願望'
