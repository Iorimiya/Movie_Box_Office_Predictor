url: https://www.ptt.cc/bbs/movie/M.1706893240.A.A5B.html
title: '[好雷] 機密特務：阿蓋爾'
content: '雷文防雷資訊頁





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  首先這部預告騙很大

  搞得很像他是主角


  只是想看亨利卡維爾的粉絲絕對會失望


  但是我個人看完還是覺得不錯啦


  預告我以為的劇情是：

  女主怎麼寫，有另一個世界阿蓋爾就會那樣

  然後演一演真的遇到

  有點韓劇W兩個世界那種怎麼寫都可以、嗑很大的奇幻劇情


  實際上原來是：

  他本人就是間諜，只是意外失去記憶

  一種尋找自我的成長冒險

  雖然不是預期的走向

  我一開始有點失望


  但看到後來覺得劇情蠻有創意的


  亨利的阿蓋爾就是他個人的記憶

  看起來也是他人生的投射

  也許是他自己堅強的一面

  也許是他眼裡，男友帥氣的樣子

  也會不時出現，就像跟自己的對話


  看到默默監視他五年的男友，不知道為啥還有點感動

  「第一次見面要假裝不認識你」

  好像哪裡看過很芭樂的台詞XD


  本片我看到的是

  即使忘了一切，還是記得那份愛

  最後又呼應回第一次教他踩頭的片段

  又有點感動


  動作場面也夠多 算有爽到

  最後段的彩虹煙霧大戰蠻華麗

  畫面好看

  雖然畫面有點硬要的感覺

  跳舞稍微多到有點刻意


  黑油的溜冰戰也有趣

  最後的轉圈掃射也蠻帥的~


  但是後段的造型+女主身材我真的也很扣分就是..

  我覺得胖不是問題耶

  像黑寡婦二代其實也是肉肉的


  最後結尾的洗腦聲控根本酷寒戰士打隊長XD


  阿對了


  貓貓超可愛~~



  ＊有一段片尾喔~



  --

  同意～當下沒想到'
