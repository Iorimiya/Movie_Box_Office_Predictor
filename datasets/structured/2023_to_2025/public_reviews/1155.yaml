title: '[負無雷] 毫無亮點的《機密特務：阿蓋爾》'
content: '不想打太長

  總之這片太柔和了，缺少導演本身自己喜歡的R級風格，不過看訪談好像是說女兒不喜歡他

  拍的那些R級電影，所以才改變的，那也沒辦法了


  但是劇情發展基本上都在意料之內，唯一的轉折點雖然有些讓人驚奇，但卻沒有太過驚喜的

  感覺，反而是有些「喔，這樣啊」的平凡感


  馬修范恩還是回去拍些那種R級風格的作品吧，至少很有自己的風格，觀影體感也不會太過

  於貧乏


  女主角我覺得很正常，沒什麼問題，大概是看習慣所謂作家的身材了吧= =


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
