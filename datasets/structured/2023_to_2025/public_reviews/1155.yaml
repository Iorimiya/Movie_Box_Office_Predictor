title: '[選片] 機密特務阿蓋爾、天眼救援'
content: '週末打算帶親戚去看電影，目前這兩部在挑


  兩者都是刺激動作類型，前者搞笑後者軍事


  噴點番茄汁斷手斷腳可接受，希望不要有尷尬火熱畫面


  本來也有考慮蜂刑者，但要去的戲院已下檔所以作罷


  請大家推薦，謝謝


  --

  是沒梗的搞笑嗎？那倒還好

  哇喔….那我先請示他們好了，感謝

  是怎麽尷尬哈哈

  那些小鬼比我們還能接受血腥

  之前是帶他們看超級戰艦，還可以接受

  感謝以上各位版友推薦兩部片的特色，稍後就要進戲院了，沒看到另一部有機會也會補，

  謝謝大家'
