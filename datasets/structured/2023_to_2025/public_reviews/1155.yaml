title: '[討論] 其實，特務阿蓋爾 很精彩吧?? (內文無雷)'
content: "阿蓋爾 票房不如預期 褒貶不一\n\n但我個人認為: 導演說了一個好故事\n\n\n: 美。英國+法國葡萄園路+阿拉伯異國風情=舒服\n\n:\
  \ 好聽，舒服。 愛情戲份+配樂 絕頂升天\n\n:前半慢 後半快 but沒多餘冗贅台詞 沒多餘刻意搞笑\n\n:Bryce+Sam Rockwell 都是戲精了啊\
  \ Chemistry超好\n\n:維持導演水準(略遜金牌1 但能比這部好的也不多了啊\n\n: 見仁見智 但書中特務推演到現實生活 我覺得很棒\n\n\n結尾也有前後呼應，美好Ending\n\
  \n後半還有兩段大場面\n\n絕對值得進戲院大銀幕看一下的吧???!!!\n\n\n----以下小雷\n\n有些人罵超人戲分少 被預告騙 同意(導演就很故意)\n\
  有人罵女主身肥 同意 但這是「劇情需要」\n特務會騙人 不是你看到那樣 所以也找邋遢男角+作家宅宅女\n有人罵無聊 不知道你預期的是怎樣 但我覺得還好\n從頭到尾都滿吸引人的\
  \ 想繼續看後續發展不是嗎^_^\n\n-------\n\n最近的兩篇阿蓋爾文 推文不少說精彩好看\n希望大家都能去戲院看看啊 我已經三刷了 哈哈哈..\n\
  然後\n這首已經無限loop了 超好聽啊啊啊\n\n--\n同意！但我沒猜劇情，父母橋段還被成功嚇到XD\n沒事，我爸看完也說禮服讓他想到史瑞克Fiona\n\
  金牌一鏡到底太帥。但阿蓋爾火車動作戲我覺得很有趣，感覺不好拍\n魯處宅男滾\n為何要鬍子到底？刮了也是邋遢不是嗎\n哪些地方故意放水啊\n三次都跟不同人 都說好看\n\
  或是2D幻想處魯宅...\n喝茶嗎？\n應該是：頭子下令手下開槍\n你不開槍反擊就被打死了吧\n所以乾脆也開一開\n我怎麼覺得失智的是某些看不懂的\n拿玩命關頭比\
  \ 直接笑出來\n那笑點那麼尷尬 劇情那麼無腦 唉\n300塊對你來說可能浪費了\n還好對我只是零頭\n笑死\n開心！謝謝\n超好看\n真的！後面開始高潮\n\
  \ ？發病了嗎\n可憐 連300都付不起 加油啦\n娛樂性第一！\n真的！戲院看覺得有差\n對！這就是 馬修日常 很故意 很鬧\n前後段 眼神整個不一樣\n肉臉還更美\
  \ 瘦了就太凹\n真的開心！結尾優美 舒服"
