url: https://www.ptt.cc/bbs/movie/M.1705592604.A.12F.html
title: '[新聞] 《阿蓋爾》神劇情 宛如羅琳走進霍格華茲'
content: "《阿蓋爾》神劇情 宛如羅琳走進霍格華茲\n\n2024/01/18 05:30\n\n\n布萊絲達拉斯霍華（右）在《機密特務：阿蓋爾》被迫和山姆洛克威爾一同展開冒險。\n\
  （UIP提供）\n\n〔記者許世穎／首爾報導〕《金牌特務》系列鬼才導演馬修范恩執導新片《機密特務：阿\n蓋爾》，今天率領亨利卡維爾、布萊絲達拉斯霍華、奧斯卡得主山姆洛克威爾一同到首爾\n\
  進行宣傳。電影隨著搶先試片揭開神秘面紗，范恩笑言是為了兩個女兒而拍，腦洞大開的\n情節更宛如「J.K.羅琳走進霍格華茲！」\n\n\n布萊絲達拉斯霍華在《機密特務：阿蓋爾》飾演喜歡宅在家的小說家，筆下的世界竟然與\n\
  現實有所連結。（UIP提供）\n\n該片描述布萊絲飾演的諜報小說作家，平時愛宅在家，亨利則是她筆下的機密特務「阿蓋\n爾」，直到山姆飾演的特務找上門，她才得知自己筆下虛構的情節，其實呼應現實中一個\n\
  特務組織的機密行動，讓她被迫展開全球跑透透的冒險。導演馬修再度打造前所未見、毫\n無冷場的精彩動作場面，不斷翻轉的神劇情充滿驚喜，結局更出乎意料之外。\n\n\n\
  亨利卡維爾在《機密特務：阿蓋爾》飾演諜報小說裡的頂尖特務。（UIP提供）\n\n馬修透露當初收到第一本小說時還沒正式出版，讀了之後雖然覺得很棒，但不確定該如何\n\
  單獨拍成一部電影，當他得知之後的內容後靈機一動，「想像一下，如果J.K.羅琳在寫完\n《哈利波特》第3集之後，突然一位真正的巫師走了進來告訴她『妳知道嗎？妳很多東西\n\
  都說對了！』然後她進入霍格華茲，發現一切都是真的。」\n\n\n鬼才導演馬修范恩笑言《機密特務：阿蓋爾》是為了兩個女兒而拍。\n（歐新社）\n\n先前馬修以《金牌特務》致敬並為諜報片注入新意，但他透露一開始想拍《機密特務：阿\n\
  蓋爾》，是希望能拍一部讓兩個女兒看了也很開心的電影，「她們其實不太喜歡《金牌特\n務》，希望我做一部比較輕鬆的電影。」\n\n不過馬修強調，電影雖然輕鬆，但還是有不少緊張激烈的情節，「我為此感到自豪，也希\n\
  望嘗試重新塑造我為先前曾做過的一些間諜類型片的經典元素，總之非常有趣，這是一部\n很酷的電影！」《機密特務：阿蓋爾》將於1月31日在台上映。\n\n--\n佛法的\n\
  \ 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
