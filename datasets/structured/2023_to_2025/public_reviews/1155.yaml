url: https://www.ptt.cc/bbs/movie/M.1717488183.A.76B.html
title: '[新聞] 馬修范恩不解《機密特務:阿蓋爾》負評如潮'
content: '新聞網址：


  原標題:



  2024-06-04電影神搜



  《機密特務：阿蓋爾》在 2024 年初上映時，大致上迎來了一片負面評價。這部馬修范恩

  執導的的間諜喜劇，講述布萊絲達拉斯霍華飾演的間諜小說作者艾莉康威被捲入真實間諜

  故事中，這是這位《金牌特務》導演首次嘗試不同風格的動作冒險故事。




  ，隨後登上 Apple TV+。這並非馬修范恩所期望的結果，他原本想像《機

  密特務：阿蓋爾》能成為更多冒險故事的開端，無論是在艾莉康威和山姆洛克威爾飾演的

  艾登懷爾德所處的「現實世界」中，還是康威小說中由亨利卡維爾飾演的阿蓋爾探員所領

  導的虛構世界中。



  接受《帝國》雜誌訪談時，馬修范恩坦誠談到對《機密特務：阿蓋爾》的反應。這樣的批

  評讓他失望嗎？


  「當然失望啊。」



  他承認，並解釋了他為什麼對這種反應毫無準備。


  「我對《阿吉爾》放下了戒備心。我們做過的試映反應非常好。首映夜非常有趣，就像回

  到了拍《偷拐搶騙》時代的那種興奮。我開始自信過頭。」



  考慮到電影輕鬆愉快的基調，這樣的反應是個突然的轉變。



  「這是一部有趣、讓人感到愉快的電影，或者我以為這是一部有趣、讓人感到愉快的電影

  。我們是沒拍出《大國民》沒錯，但天啊，





  當評論陸續湧出後，馬修范恩不遺餘力地想弄清楚轉換過程中到底失去了什麼。



  「我甚至親自跑去電影院，因為我想：『也許我真的搞砸了。』這確實讓我不安，我真的

  在苦苦思索這件事，因為你不能忽視它。這可不僅僅是幾個差評。」



  最終，范恩對《機密特務：阿蓋爾》的評價保持哲學態度。



  「事情就是這樣。你會從這些事情中學到教訓，」



  如果觀眾開始接受這部電影，我們可能有一天會看到范恩所設想的那些延伸的《機密特務

  ：阿蓋爾》冒險。馬修范恩指出：



  「我們在串流平台上的表現非常好，人們喜歡它。沒有什麼比再拍一部更讓我高興的了。

  我收到簡訊說：『哇，這些評論真是太苛刻了！』我們讓更多人看《機密特務：阿蓋爾》

  ，就越有機會拍續集。我很想再拍一部，我們已經有計劃了。」



  是的，這包括已經預告的《年輕阿蓋爾》前傳。



  「這會是一部不錯的小電影，我們拭目以待。永遠不要說不可能。」



  --'
