title: '[  負雷]  阿蓋爾 超人戲份少'
content: '雷文防雷


  首先你如果跟我一樣想說要進去看亨利卡維爾還是看江西南你會哭死…………戲份大概就

  十分鐘而已



  然後我覺得不用看imax我會覺得浪費錢



  自從上次被雷了幾次imax學乖了，喜歡再去看一次就好



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~













  我個人覺得男主角挑的還可以，至少是我喜歡的演員，但我覺得被宣傳照詐騙（還以為在

  玩最後生還者二（詐騙封面跟宣傳照



  我個人很喜歡這個演員在兔潮男孩裡面的角色（那演技真的超強），但到了這邊變成搞笑

  風是也還可以，但我覺得整體下面動作戲很一般（阿湯哥看太多的後遺症



  然後我覺得女主角以前很漂亮，我如果沒看錯應該是陶比版本的關史黛西（但老了變胖了

  ，但我覺得可以讓她穿一些不要顯胖的衣服，啊我不知道是不是劇組跟她有仇……給她穿

  一個很胖的禮服



  我對這片的結論是劇情算小有新意，但特務片我覺得動作戲還是要厲害一點，這點太弱。


  然後我覺得女主角再找個正一點年輕一點的會好一些（不然沒帥哥也沒有美女，我覺得很

  多人看不太下去（劇情也一般


  我中間直接跑去上廁所也不覺可惜………（我還記得捍衛任務4我去尿尿用跑的………



  我個人認為這片就平日沒片再看吧（然後我認為不需要浪費錢看imax XDDD



  以上


  --'
