url: https://www.ptt.cc/bbs/movie/M.1706692282.A.80E.html
title: '[ 普負雷] 機密特務阿蓋爾'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  以下有雷有雷有雷







  預告真的都把最好看的剪進去了

  像是杜娃黎波

  超正超辣超媚超性感

  身為女生真的都愛上她

  結果前面出場一下就沒了好失望


  而結果後面女主角竟然穿上金髮金禮服

  所以杜娃黎波的原型角色就是主角本人？？

  雖然這樣講很不政治正確

  但主角有點太肉

  所以完全沒有很性感很養眼的感覺

  反而有點出戲

  而且也很困惑為什麼髮型也變了

  原本紅長髮感覺比較適合主角


  有一幕也看得有點傻眼

  就是女主角丟下貓跟男主角逃走

  身為有寵物的人

  以為那個劇情應該是女主角義無反顧跑回去救貓

  男主角只好無奈頭疼回去救他們

  來凸顯女主角此舉莽撞但善良有愛心

  男主角也拿她沒辦法


  結果？就這樣開車走了？？

  雖然我知道後面劇情貓一定會再出現

  但此舉真的會對女主角好感不起來



  比起特務片覺得這部更像愛情搞笑片

  像是後面邊跳舞邊開槍的部分

  整體跟金牌特務完全無法比

  看金牌特務的時候真的是非常驚艷


  如果要當搞笑片那是還不錯


  --

  我覺得可以用別的方式呈現救貓的行為但就是不能丟下貓XD

  我知道啊 但因為也都會跳旋轉什麼的 所以杜娃角色原型也是女主角參考自己吧

  真的看到那裡覺得超適合情人節看

  我覺得轉折多到有點太刻意的地步XD'
