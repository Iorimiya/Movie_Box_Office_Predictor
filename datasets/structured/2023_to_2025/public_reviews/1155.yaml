url: https://www.ptt.cc/bbs/movie/M.1706825813.A.71A.html
title: '[討論] 從阿蓋爾看女主胖到底有沒有關係'
content: '（可能會涉及雷請注意）











  最近阿蓋爾也讓許多人討論女主胖到底有沒有關係

  有人說很有關係、慘不忍睹

  有人說沒有關係、會介意的根本身材歧視

  有人說當宅女小說家那麼多年當然會變胖是劇情設定



  本人是覺得身材實在不適合

  自己也是女的所以不是什麼歧視厭女

  一些發福的女歌手我也不覺得怎樣

  但這部電影主打爽片

  那就是很吃主角「魅力」跟「吸引力」



  我個人是感覺就是因為政治正確

  在看她穿禮服的時候就類似在看海莉貝利演小美人魚的感覺

  就是有種違和感？

  但難道覺得不適合就要說歧視黑人嗎XD



  如果是一直維持作家造型那蠻不錯的很可愛

  但換上金髮跟禮服 還有那個濃眼妝瞬間不合



  加上前面杜娃黎波太頂了

  觀眾的標準已經變成杜娃黎波了整個對比

  會讓你覺得女主體型根本杜娃1.5倍大



  至於宅女設定變胖

  其實前面特務照片也沒很瘦吧（？

  然後有許多電影裡也很多宅男宅女天才主角

  基本也是就一般體型

  （除非是作為配角幫手）



  個人是覺得主角蠻適合正常體型女星演

  一開始可能就是戴眼鏡 一頭亂髮 打扮樸素

  後面換上禮服讓人眼睛一亮為之驚艷更有看頭




  青菜蘿蔔各有所好

  歡迎大家討論


  也可以討論你覺得比較適合哪個女星演

  我是覺得達珂塔強生跟安海瑟薇不錯

  （原諒我畫的陽春眼鏡）






  --

  原本造型跟妝容都蠻可愛的

  換禮服後覺得眼妝也不太適合

  你們說得對！

  希望之後漫威系列通通找類似女主體型的演

  不然黑寡婦 緋紅女巫 海拉什麼的身材太好

  實在太厭女歧視了

  劇照跟預告基本上都是出現辣妹杜娃黎波…

  （明明出現超短但跟亨利一樣宣傳照都最中間,而且預告也幾乎他們）

  我不覺得單純為了怕劇透就不放禮服女主

  劇照跟預告基本上都是釋出最有吸引力的部分吸引觀眾XD

  沒錯，大家都不要坐雲霄飛車不要玩高空彈跳

  不要看捍衛戰士不要看英雄片

  去做愛或看A片不就夠爽夠刺激了

  沒有東西比得上做愛 是這樣嗎？

  如果你覺得看A片就很爽  那…

  我也覺得身材管理是敬業的一部分

  但不用做到像日韓那麼過頭

  歐美也是有些演員會為了要符合電影角色

  而讓自己爆瘦或爆胖或狂練肌肉這樣

  就覺得他們很厲害很要求自己

  類似如果要拍什麼專業技術或武打

  有些演員就會真的去學那門技術（音樂、跳舞、武術、騎馬之類）、上專業訓練課、健身

  這樣

  啊如果導演說這個角色就是要這體型那當我沒說

  我覺得google上的照片跟電影裡的禮服造型比都還好

  宅女造型蠻適合的 就豐滿好看肉

  但換上性感禮服你就會不禁跟杜娃黎波對比那個腰腿

  我當然知道有厭女的女人啊

  不過原來覺得角色體型不適合也會被一些人認為厭女我是蠻驚訝的

  那我很支持瑪格演芭比因為她正又瘦也算厭女嗎？

  看來換上禮服是要為之震驚而不是為之驚艷？

  肉肉女穿禮服盛裝打扮也有很正的好嗎

  就是那個禮服造型不適合

  請問有演員特地為戲增重的新聞嗎？

  沒有嗆你喔 單純好奇0.0

  好吧…因為我覺得男生把鬍子剃掉後瞬間蠻帥的

  本身對亨超還好可能他這部髮型太怪

  總歸來說我不知道小說宅女就要用變胖來表現？

  畢竟我身邊認識畫圖寫文的宅女都體型一般

  宅女寫小說變胖才是刻板印象吧==

  女主就算瘦我也覺得跟杜娃有落差感不會引人注目

  就是覺得如果真的有這增胖設定沒啥必要

  如果有為戲增重新聞請再提醒我去看'
