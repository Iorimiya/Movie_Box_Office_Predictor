title: '[好雷] 機密特務：阿蓋爾'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  因為版上討論度不高，基於抱著"過年踩個雷也不會怎樣"的心態前往觀看

  結果發現其實很不錯啊

  劇情反轉再反轉

  一開始以為是作家的小說變成現實->作者父母是假的->作者自己也是特務

  讓人情緒一直在高點無冷場

  一直被嫌棄的作家金色禮服扮相也沒有這麼糟

  會覺得不好看個人覺得是因為一登場時還很怯場緊張

  等到特務性格一出來 整個眼神都銳利起來 後面就變亮眼

  而且後面原本幾乎拖地的裙長變成到小腿一半 整體感覺就俐落了

  最主要的 這部片對明天的情人節其實很應景

  這部就是用特務包裝的愛情片嘛

  五年來默默守護失憶女友的男主 能說不深情嗎


  --

  坐我前排的情侶看得很開心 我才後知後覺原來這部很適合情人節XD

  男人就是要靠眼神 OK的啦XD'
