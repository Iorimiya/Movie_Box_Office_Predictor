url: https://www.ptt.cc/bbs/movie/M.1706762175.A.134.html
title: '[雷] 特務阿蓋爾 大負雷'
content: '預告片看起來很精彩滿懷期待的進戲院，出來覺得還真浪費錢


  一直到女主角記憶恢復之前的種種反轉都還可以，

  但回到分部玩雙面諜之後開始變得歹戲拖棚


  最瞎的是結尾假媽媽博士用音樂盒就可以控制女主，

  那前面大家浪費那麼多時間、打到人手都死光是…？


  沒想到接下來還能更問號，被心靈控制的女主快殺死男主之際，

  已死的駭客夥伴原來沒死、一直偽裝成船工便突然跑出來打死博士於是就Happy Ending

  看了只有大大的 蛤?_?


  總之到後面給人一種彷彿尾款沒付所以編劇決定閉著眼寫，

  把所有特務片元素跟反轉劇情通通塞成大禮包的感覺


  好的部分是動作戲好看，彩色煙霧雙人舞跟滑冰蠻好笑的、還有貓咪可愛


  但總體來說覺得不用進劇院看，想看特務諜報什麼的不如看同檔的韓片金派特工隊..


  --'
