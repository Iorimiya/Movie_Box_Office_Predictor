url: https://www.ptt.cc/bbs/movie/M.1706626807.A.766.html
title: '[無雷] 機密特務阿蓋爾'
content: '剛看完特映



  基本上要撐過前一個小時，

  前一個小時會讓人懷疑：馬修范恩拍這什麼鬼？

  但這部片厲害的就在一個小時後劇情有個大轉折，

  這個劇情轉折真的挽救了整部片（預告沒有演）。


  轉折後的一百分鐘很喜歡，

  片中有兩場動作戲很厲害，

  整體調性比金牌特務還要嬉鬧一點，

  有時候甚至覺得已經要到麻辣賤諜的搞笑程度，

  不喜歡太著重於搞笑的動作片可以斟酌一下。


  然後覺得沒有必要到看IMAX，

  動作場面是有，但著重劇情的部分居多。

  而且片長滿長的2小時20分鐘，

  整體看完是喜歡的，知道越少進去看驚喜越多。


  --'
