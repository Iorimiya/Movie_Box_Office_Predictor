title: '[ 好雷] 馬修范恩好雷-阿蓋爾'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  我是以馬修范恩鐵粉的觀點來看的：


  音樂、大場面、剪接、運鏡~~都沒讓人失望


  本部大場面就 煙霧槍戰& 溜冰


  溜冰雖然不像金牌1一鏡到底的教堂戰

  那麼的名留青史（ 很難超越了吧）

  但也讓我看得很開心


  煙霧槍戰則是滿滿歡樂+歌好聽

  兩人並肩作戰 彷彿在跳舞 好開心

  (監視器裡看到的其實並沒有在飛鳥XD)



  馬修日常：

  交通工具不停轉換（火車，飛機，船，航母）、親近的人的假身份、進入神秘地點、喝神

  秘的飲料、拷問

  等等


  好幾幕看完真的會讓人想直呼

  「喔幹 這就是我要的馬修范恩！」


  這部還加了一些愛情戲份 真的不錯


  說前面很無聊我覺得還好 就鋪陳交代劇情

  說反轉多 也是沒錯啦 但老影迷都差不多能體會



  女主胖是劇情需要

  不就是塑造發福作家跟特務身份的反差

  胖了還硬要穿禮服也是故意的==

  看不下去我覺得個人觀感吧


  但有人說跟人設不符 我看是完全沒看懂吧...還扯什麼易胖體質...


  當導演跟演員都傻子嗎..？








  總之馬修范恩粉會看得很開心啦

  必看


  大場面+音樂 去戲院看 值得

  葡萄園也好美~~


  --

  真的 一直等她回復記憶 好深情

  真的

  完全！！！

  爛__

  可憐'
