title: 'Re: [討論] 《機密特務阿蓋爾》美國票房大爆炸？'
content: "要說票房,\n      [機密特務：阿蓋爾]    北美首周1800萬(預估)\n已經比[金牌特務：金士曼起源]北美首周 591萬高很多了~\n\
  \n\n[金牌特務：金士曼起源]北美總票房只有3717萬\n\nDOMESTIC      (29.5%) $ 37,176,373\nINTERNATIONAL\
  \ (70.5%) $ 88,721,105\n-------------------------------------\nWORLDWIDE       \
