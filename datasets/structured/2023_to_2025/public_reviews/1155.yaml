title: 'Re: [新聞] 馬修范恩不解《機密特務:阿蓋爾》負評如潮'
content: '馬修范恩的片 從星塵傳奇後每一部我都有看

  都還算蠻喜歡的

  甚至上一部起源也超愛


  但機密特務阿蓋爾 真的是無聊到炸

  前一個小時

  看一堆特工抓一個女作家 心裡滿滿的???

  然後看亨利卡維爾跟山姆洛克威爾一直交錯超煩


  然後開始無意義的反轉

  這些反轉不一定猜得到  但真的反轉的時候 又覺得沒啥特別的


  每個角色講一堆乍看之下很酷 實質很空洞的台詞


  這部戲所有演員都蠻喜歡的

  但大家都演得很普通XD


  打鬥戲也都很荒謬  一點也都不緊張刺激


  老實說這部還蠻像賀歲片的 一堆大明星

  演一個很老套的劇情


  女主雖然胖  但頭前燈還是蠻可觀XDD

  不覺得這部爛她要扛責任


  然後超人跟江西納  兩個這麼有趣的演員

  在這部完全沒發揮


  一開始的飛車場景還假到爆炸


  最後特工的反轉戲碼  只覺得很煩


  如果要用兩個詞來形容這部電影  大概就是愚蠢跟無聊


  唯一開心的結尾亂鬥有用snow patrol的歌



  以上  我覺得這部絕對是馬修范恩生涯最爛作


  --'
