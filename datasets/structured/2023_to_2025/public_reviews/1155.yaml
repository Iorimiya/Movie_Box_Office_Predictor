title: '[選片] 水行俠or機密特務阿蓋爾'
content: '過年放假想說排一天帶兩

  個孩子去看電影（男，12y、14y）


  本來是要看水行俠，但今

  天發現有新上映的阿蓋爾

  ，兩個都看過預告，覺得

  水行俠似乎比較嚴肅？！

  且我們沒看過水行俠第一

  部。

  機密特務好像有跟女主的

  一些互動，看起來好像比

  較輕鬆搞笑又帶點武打？！

  但很怕跟女主太過於太多

  感情戲？（怕兩個男孩不

  太喜歡：p )


  想問看看，若是屬於比較好

  ‘’理解‘’且輕鬆一點，不要太

  過於‘’暴力‘’或是‘’感情‘’，哪

  一部較推薦呢？或是還有

  比較推薦的適合這年紀的

  孩子的嗎？


  謝謝各位(≧ω≦)/




  --

  感恩推薦

  真的 我就是怕這種其實很暴力但是掩蓋掉的 感恩

  謝謝，對吼謝謝你，可以在家先租第一部來看，再去電影院看。

  好哦


  要不是年齡沒到還真的蠻想看這部的～

  另外謝謝推薦間諜家家酒的各位，我也會列入片單的。'
