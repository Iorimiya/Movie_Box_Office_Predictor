url: https://www.ptt.cc/bbs/movie/M.1706723041.A.C52.html
title: '[普雷] 機密特務阿蓋爾 簡單心得'
content: '在沒看完預告的情況下


  想說衝著亨利卡維爾那個造型去看一下




  本來以為是有點搞笑的特務片


  沒想到是想走特務底的搞笑片...


  前面劇情突然有幾個轉折


  本來感覺還不錯


  但隨著公寓踩頭那段


  一直到後面煙霧彈跳舞那邊


  還有最後靠貓出來救場


  把累積覺得還好的評價又扣掉了...



  另外就是女主角的身材


  想說女主角本來前幾部戲就已經變胖就算了


  但後面完全不遮了


  各種鏡頭都可以看到她滿滿的胖


  就算很有誠意的穿V禮服


  還是各種大動作的露腿跟底褲


  但是有了一開始的性感反派相比較


  .....沒辦法接受.....



  另外就是浪費了老白跟MDFK


  老白雖然演大反派


  但完全沒有什麼氣勢的感覺


  那把有由來的散彈槍也是很莫名其妙




  山繆傑克森看起來像是客串而已


  出來解釋一段女主角的劇情之後


  剩下劇情就是喝紅酒看球賽


  對著下載中的電腦情緒起伏





  覺得電影的一開始劇本應該是好的


  但是加了很多奇怪的元素進去



  唯一對的起女主角身材的


  大概就是可以把男主角扛起來旋轉飛鳥吧...



  最後除了好像有埋伏筆之外


  還有一小段跟金牌特務沾上邊的彩蛋


  但整體評價



  真的還好....





  -----

  Sent from JPTT on my Sony XQ-BC72.


  --'
