url: https://www.ptt.cc/bbs/movie/M.1707758407.A.C38.html
title: '[負雷] 可憐的東西  了無新意的女性一生'
content: '預告片剪得讓人不期不待，

  但本片居然還能更無趣。


  以下有雷，當然是個人觀點而已。



  我個人開頭就覺得不怎麼喜歡這次的比例，

  應該是16：9？我看資料寫說是35mm拍攝，但35mm應該是4：3才對，這部分我瞭解不夠深。

  不管哪種，有點希望是21：9，會增加點敘事感和距離感。

  這次的比例除了在魚眼上的效果極佳外，普通的鏡頭拍下來實在毫無帶入感，加上美術風格又是企圖融入印象派和超現實主義的繪畫風格，我個人沒有因此有覺得相符相乘而被打到。

  而我原本期許像是燃燒女子的畫像那種畫與電影的美術交合得天衣無縫。



  回到劇情。

  講述的其實就是一個女子在成長過程中，

  經歷了

  我任性，我要就是要，我想摔東西就摔時期；


  我體驗到性愛的美好，我要不顧一切探索自己時期；


  我需要生存，但我發現我沒技能只能靠肉體時期；


  我想要安定下來，然而發現婚姻是大麻煩時期。



  看完只覺得「喔~好喔」

  這個主角的一生我好像在我阿姨身上看、我同儕身上看到、在很多女性主義作品上看到，那我為什麼要特別到電影院去看艾瑪史東版本？

  （當然，我很喜歡這個演員，所以才上戲院，但這是另外一回事。）


  我的意思是，即使這個主角沒有被開腦換腦，她作為一個普通女孩的話，那也是可以讓這成長過程與經歷是成立的。


  大費周章用一個設定，讓一個天真小孩的內心，塞在成熟女人的身體裡，


  我能想到最合理的理由，反而是導演是艾瑪史東腦粉，既然沒辦法看到她的童年時期，那乾脆就用這個設定來讓艾瑪史東演她小時候與青春期好了，無比變態！


  回到劇情，女主角貝拉後來還是和普通女性一樣成長了啊！

  既然她有成長，那麼她腦袋裡面是不是別人，根本就沒太大意義了。


  就算換了另外一個設定敘述，威廉達佛是個變態父親，把小女孩養在家裡直到成年才讓她出門去闖，因為都沒出門，所以小女孩保有天真的初心，直到去了葡萄牙還是隨便哪裡，開始認知到世界的殘酷還有自身成長，故事還是完全沒有變。

  角色的發展也可以完全一樣。

  這就是我覺得了無新意的地方，

  女主角貝拉，與她的設定，一點都不特別，


  而這部片試圖營造她很特別。


  當然，投身在劇情裡，那個時代有個這樣個性的女性，有自己的主體意識，她很特別沒錯。


  但拉出劇情，以我觀眾來說，我個人是沒有看到多出彩的故事與多特別的人物。

  奇怪，講述女性有自主個性是很特別吸引人的故事值得去電影院去看嗎？



  我原本還期待威廉達佛要死的時候，女主角會幫老爸換腦給年輕的或甚至幼兒的身體，來養育他，達成一個有趣又病態的宿命與循環。


  但沒有。

  就是只是把壞丈夫換腦成羊，男人好壞壞要懲罰。

  就....有啥意義？


  最後讓女主角享受父親遺產，旁邊有乖巧男人，然後情人兼好閨蜜也莫名其妙來了（滿符合女性朋友們的春夢），當然，因為不能顯示女主角只是享受別人成果，所以要讓她加上好學的設定，結尾也要努力讀書。

  千篇一律的網路女性向意淫小說的女主角設定= =


  怎麼這時候女主角就不把老爸遺產拿去們給窮人呢？？

  講得好像多有成長，經歷多少事情成就了她。

  沒有，就是享受當下，也只想當下而已。

  腦中不存在責任這種詞。

  以前犯過的錯就算了。

  （有錢之後給我把錢還給綠巨人啊！）

  這不是貶低，就是，

  她不是唯一過這種人生或有這種價值觀的女性。


  這樣講當然感覺酸到很多現實女性，

  但劇情給出的資訊就是這樣，

  它演出了男性的迂腐、矛盾與可悲，

  但我也看到女性的散漫、短見與無責任。


  就像船上的黑人朋友所說，人類真是爛透了。

  （我覺得他演技給我的僵硬感也爛透了。）


  每個性別都很爛，但最後電影的畫面停留在貝拉勝利堅定的眼神，如果我是認同貝拉的客群，那符合邏輯，跟著主角冒險，主角好棒棒，鏡頭語言成立。


  不過如果我剛好不是這個客群，我還是會期待貝拉給我傳遞多一點有深度的訊息，

  而不是開頭角色是哈我爽就好，

  結尾也是哈我爽就好。



  最後這作品原作是1992年的小說，

  我有點忘了那時的社會氛圍，這樣的女主角會不會帶來女性自主的鼓舞，我想像中是有的，

  我也想像以小說的媒介，隨著文字的揭開，如果是以伏筆與懸疑的寫法，揭開女主角身世的秘密、她身體的丈夫的秘密，帶來震驚以及女主角展現自主的行動的話，那真的蠻好看的。


  但電影的鏡頭赤裸感很強，一方面強調了貝拉的視角與坦率大無畏，但另一方面解開伏筆時卻毫無震驚感。

  了無新意。

  主角不震驚了，我震驚啥。


  這種評論可能比較逆風。

  不過還是希望有同樣視角的朋友分享一下意見，

  我也想補全一下自己覺得不好看的點。



  我還滿喜歡導演的真寵。

  但像是聖鹿之死我就很討厭。

  有點先想意義，在想敘事，但反而讓劇情毫無意義。







  -----

  Sent from JPTT on my Asus ASUS_I004D.


  --

  的確崩潰太久了，我以為貝拉會邂逅很多不同男人，結果居然他的篇幅就那麼多。

  但我覺得他崩潰得很有喜感，而且很立體，不是純粹的壞，感覺有矛盾，就滿有血肉的

  沒有做更多無情的實驗吧~~

  期待艾瑪史東

  我覺得主角是男是女是善是壞，不管哪種，只要有讓觀眾有敬佩、有尊敬、有學習、有認同，都是好的主角，能讓故事有說服力，但剛好這部裡面我沒看到女主角有什麼值得一提的好的特質，反而一堆任性和自打臉

  不用因為我一個負評就不看啦

  好評還是居多啊

  XDDD

  我一瞬間還感覺馬克把這角色演出紅毒蛇的感覺，真的很驚艷

  的確是該多一點代入的欣賞的角度

  可惜剛好這部沒有打到點@@

  我覺得很多配角或小人物的不同觀點組成一個世界觀，會很有討論空間。

  不過這部的話，我覺得還是配角為了主角而服務，配角們的價值觀完全是為了跟女主角互動而存在，

  某方面來說我還覺得配角們被物化了

  真的不知道她在勝利啥

  如果她一個空虛臉，那我作為觀眾可能還會反思很多，但她勝利臉代表導演希望觀眾多少是認同她的

  但問題是她又沒有做什麼能讓人認同的事情

  我覺得一開始嬰兒腦、大人身，這樣的狀況會讓人反思沒錯；

  但重點就在於，故事中貝拉是有長大的，她的肢體和言語都是有社會化的，就像我們每個人一樣。

  那既然世界上所有人社會化的過程，都對性有不同的理解，那憑什麼貝拉長大和社會化後，有能力對性保持童稚的原始想法？

  又，保持童稚想法是什麼好事嗎？

  那她為什麼不繼續摔盤子？

  性就比較高尚可以保留、

  暴力就不行嗎？

  這些都沒有特別解釋，就要說服觀眾說，性解放是好事，那就不一定會說服成功了

  理論上，大家都不救贖會是好結局，

  但最後貝拉臉很跩，她感覺有被救贖了

  成為資產階級後，她大概就不屑窮人了

  很寫實主義

  音樂刺耳+1

  不構成太大缺點，但就有風格，但不至於多加分

  真寵有人物動機，角色是有目的來去行動，觀眾可以期待和好奇，並且見證角色得到什麼、失去什麼，或變成什麼，這樣的流程就是一個故事。

  這部更多只是設定，黑人本身與其說是一個角色，更多只是一個思想或主義的工具，拿來給女主角經歷而已；前丈夫也只是一個婚姻或男性壓榨的象徵。

  如果女主角經歷一切，而成長了，那的確也是一個故事，

  但女主角經歷一切，但還是什麼都沒變，那我認為是比較容易讓觀眾覺得空虛啦~

  我很遺憾沒有嬰兒或月經的描述

  科學世家的設定就很多餘

  嘴巴理性科學務實，

  實際上任性！爽！

  就很左派

  努力的女主角，哇好棒！

  不努力的女主角，哇也好棒！

  世界上最好充斥粉紅色溫柔泡泡，不管什麼人種什麼性別，都要好棒棒~

  也是，但就是有點太龍傲天了

  但日式龍傲天就會坦白說我就強

  這部像是台灣早期乙女龍傲天網路小說，

  明明這角色爽得要命，但導演硬要把她包裝成走過千山萬水努力獲得成功

  但其實根本沒啥努力

  我後來才想起來，

  女版應該是說瑪麗蘇，

  有夠精準

  很討厭的是這部就沒有什麼「女性自覺」

  女主角如果真的有學習到東西、有改變、有成長，那還是不錯的故事

  但問題就女主角沒變啊

  劇本就給她一個「我爽我要我嬰兒」的設定，所以她根本也沒受到什麼打擊而成長，或是說，她受到的震驚或打擊，根本沒讓她有啥改變啊

  我覺得電影裡面的貝拉才是最狹隘的

  「嬰兒很吵，我要揍嬰兒！」

  「前夫很壞，我要讓他腦死！」

  「我要偷情夫錢！我要拋下我的丈夫！」

  這種單線思考的女主角，不只狹隘，還自私得要命'
