url: https://www.ptt.cc/bbs/movie/M.1707645628.A.12F.html
title: '[討論] 可憐的東西 背後含義'
content: '這篇想跟大家討論一下 可憐的東西 裡面的劇情

  因為我不太確定自己有沒有看懂

  不過我覺得這部酷的地方是大家都會有自己不同的理解 好像也沒有完全的對錯

  也讓人看完想討論一波！


  以下有雷~







  我覺得電影裡的角色都很有趣

  尤其是嬰兒腦成人身的貝拉 在古時代舊有的思想中

  不停的去碰撞、刺激，也將好多人的心聲說出來

  為什麼不能表現自己，為什麼不能做讓自己快樂的事呢？

  但我有點歪樓在思考的是，貝拉好像有點早熟耶

  好小的時候就想要 Furious Jumping 哈哈（？

  不過我覺得隱藏在其中的可能是腦袋與身體賀爾蒙的結合

  畢竟身體已經是非常成熟的狀態了

  但究竟是怎麼樣運作 我也不太確定 不知大家看法如何哈哈


  另外就是鄧肯究竟看上貝拉什麼？怎麼會直接一見鐘情

  但其實Max也算是第一次看到就驚呼： What a beautiful retard

  除了顏值真的正翻之外

  我想他們還看上了她心智不純熟 容易操控的那面（殊不知他超級叛逆哈哈

  或許也淺淺的引射了鄧肯是控制狂還很愛 mansplain 的含義


  這部也同時探討了女性議題（雖然全片隻字不提）

  跟芭比直接開誠布公的討論相反

  畢竟芭比有著商業片的包袱，能討論的觀點我覺得比較受限跟需要白話去講

  可憐的東西沒有任何包袱，直接把批判跟諷刺力開到最大（愛ㄌ）

  我猜想導演直接把這份信念化身成貝拉本人

  帶著這樣的意志去與老觀念奮鬥與辯論

  我想結局也代表著新世代的來臨與創新

  也讓觀眾看完有更多想像空間及不同領悟

  但當然這兩部電影我都非常喜歡～


  不知道大家看完有沒有什麼體悟，感覺都會不盡相同

  很期待跟大家討論！！！


  --'
