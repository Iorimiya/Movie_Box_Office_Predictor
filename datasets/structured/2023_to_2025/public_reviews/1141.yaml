title: '[超好雷] 可憐的東西 可愛的電影'
content: '有雷

  超級無敵好雷














  前陣子看完尤格藍西莫的幾部老東西

  我連他在Attenberg裡面親自上場打炮我都看過了

  這幾年的單身動物園 真寵 感覺大眾有趣的多

  重點是這部不管哪方面我都很愉快

  就是看的很開心又歡樂的電影

  那個美到不行的天空 看了幕後說是LED螢幕

  真的美到不行

  每個景的色彩鮮豔有趣程度

  從真寵開始用到這部的大量魚眼鏡頭更是新奇

  我很喜歡這種侷限視角 清楚知道重點在正中間的感覺

  還有科技怪到靠北的世界 奇怪又超現實的歐洲

  裸露的血腥和滿滿的性愛

  有趣又歡樂的對話 我看的那場大家都笑的很開心

  我最愛的威廉達佛 這部臉上的疤絲毫沒有影響他那成熟男人的帥 最後殘缺的心得到滿足

  的最後一口氣更是讓人感動


  還有一點是那個搭配情緒的配樂

  熟悉的四個音 每個場景用不同的樂器展現不同的情緒

  在最後將軍的家特別明顯

  真的好



  整部最精彩的應該是那個嬰兒的使用

  從吃飯時想要打那個嬰兒

  之後看到死去的一整堆的嬰兒

  妓院老闆娘的嬰兒

  自己肚子裡面曾經有的嬰兒

  最後是自己本身就是那個嬰兒

  是媽媽也是孩子 缺少的那份母愛

  貫穿全劇的東西 超現實的奇蹟產生的有趣問題

  主角Bella奇怪的一生 最後回到了家 愛上自己的故事

  雖然真要說的話的確有蠻重女權的味道就是了

  但這就是他的主題 而且跟故事和設定融合的很好



  唯一的缺點大概是法語不翻吧

  也許這是本來就想營造的氣氛 但我還是很想知道對話

  還有故事尾段劇情稍微緊湊的感覺


  我很喜歡那個片尾名單表現方式

  還有在建築偷藏老二跟鮑魚

  笑死我


  好片 好看 今年剛開始就已經最愛


  --

  的確有這感覺 尤其船上最後跟黑人道別那段話'
