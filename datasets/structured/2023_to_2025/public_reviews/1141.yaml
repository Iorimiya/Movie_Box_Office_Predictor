title: '[好雷]可憐的東西 Poor Things'
content: '《Poor Things》(可憐的東西)★★★★☆


  「那是你的身體，你有權運用」



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  去年終於擒下第80屆威尼斯影展金獅獎

  尤格．藍西莫的鏡頭總是聚焦在「關係」上

  《單身動物園》中關係的需求與做作

  《聖路之死》中關係的犧牲與抉擇

  《真寵》中關係的權力與鬥爭

  這次《可憐的東西》是直白探討關係中的女性成長


  設定上貝拉是逝去的母親被植入自己腹中胎兒大腦

  在沒有母體的保護下血淋淋地面對社會上的父權

  用蓋亞純真的視角去見證女性在關係中的成長


  故事發生在19世紀蒸氣龐克的英國維多利亞時期

  開頭黑白畫面致敬了早期環球怪物宇宙的科學怪人

  黑與白也是最單純的色調，意味著貝拉初期的純粹

  與創造者住在大房子中，生活在純真快樂的伊甸園

  此時大量的魚眼鏡頭比擬著小孩子看世界的觀點

  任何事物都新奇有趣，不同於大人視角的平板


  而創造者安排的婚約，對性啟蒙的貝拉而言是束縛

  這時畫面的黑白反倒成了單調和無趣

  直到貝拉選擇出走、擁抱慾望，畫面才變為彩色

  導演透過從黑白轉為彩色肯定了性對女性的啟蒙

  也以正向的態度看待人性中的慾望與誘惑


  而第一站里斯本是貝拉對環境的啟蒙

  黃色的短裙配上白色襯衫和藍色罩衫

  呈現出貝拉因性啟蒙而綻放的多彩繽紛

  接下來的黃色禮服是貝拉啟蒙後生命的鮮豔

  黃過渡到橘，最後紅色裙襬更體現出貝拉的熱情

  但這樣的熱情奔放也吸引其他男士的目光

  讓誘惑貝拉出走的鄧肯感到忌妒與憤恨

  這種恐懼源自於控制不了其他男性凝視的不安

  鄧肯成為了他不想成為的小心眼男人

  進而綁架貝拉上船前往雅典


  在船上是第二站知識的啟蒙

  貝拉身著白色洋裝代表著他的智識潔白如紙

  在封閉的船上結識的貴婦與黑人啟發了她的思想

  甚至在停靠亞歷山卓城時，見識到資本主義的可怕

  貝拉的知識增長讓鄧肯感覺更無法掌控

  此時鄧肯的財富丟失，身為男性的價值也跟著殞落


  如此兩人被迫在巴黎下船

  鄧肯無法接受貝拉為了兩人生計去賣身憤而離開

  從無法掌控其它男性到無法掌控女伴思想

  最後沒有錢連自己也無法掌控，在兩性關係中

  男性總是因為女伴的成長而感到無法掌控因此逃離

  在巴黎透過賣身接觸世間民情的貝拉

  並未將父權的道德施加自身，只當是體驗人生百態

  此時的她身上無時不刻都有象徵「性」的黃色點綴

  只有貝拉在進修解剖學時才換上嚴肅超然的黑色


  回到倫敦的貝拉也以超然的黑色洋裝審視過往一切

  原本打算和婚約對象結為連理，劇情卻來個大轉折

  貝拉生前的丈夫前來劫婚，他既是丈夫也是父親

  但最後遭貝拉手刃，意味著女性對父權壓迫的反抗

  此時的貝拉穿著的是高貴典雅的橘紅色禮服

  在歷經過性、視野、知識啟蒙後，

  女性反弒父權成為自己的女主

  可憐的東西更像在說企圖掌控女伴的卑微男性

  世俗的道德、階級，在貝拉（女性）視角看來

  不過是男性為了鞏固自己而限制他人的說詞工具


  不得不說艾瑪．史東在本片演出除了大膽以外

  對於腦袋發育未成熟的貝拉，詮釋得是絲絲入扣

  一場跳下屋簷的片段完全能感覺到

  貝拉還無法控制肉身自如的情況

  一般演員在落地時下意識肌肉反射是相當難隱藏的

  看完後，更支持艾瑪．史東拿下本屆奧斯卡影后了


  --'
