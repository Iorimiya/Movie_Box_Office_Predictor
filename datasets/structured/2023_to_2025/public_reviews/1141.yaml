url: https://www.ptt.cc/bbs/movie/M.1706665039.A.49E.html
title: '[新聞] 艾瑪史東露3點 《可憐的東西》贏口碑'
content: '新聞網址：


  艾瑪史東露3點 《可憐的東西》贏口碑


  04:102024/01/31 中國時報 李承陽



  艾瑪史東主演電影《可憐的東西》，海外票房口碑雙收。（探照燈影業提供）


  由艾瑪史東主演的電影《可憐的東西》，將於2月8日農曆春節檔一刀未剪上映，30日舉行

  媒體試片場，繼於去年金馬影展放映擄獲影迷的心，昨再獲影評、媒體一致盛讚，話題延

  燒口碑爆棚，尤以女主角艾瑪史東全裸演出的大突破，令人瞠目結舌讚不絕口，獲公認奧

  斯卡二度封后希望濃。


  在奧斯卡金像獎入圍名單上周二揭曉後，《可憐的東西》票房立刻3級跳，全美本周末廳

  數大增至2300影廳，上周六單日票房更高達1300萬美元（約4億台幣），周末排行上升至

  第6名，全球票房也突破5千萬美元（約15億台幣）大關。


  以《可憐的東西》二度入圍奧斯卡的化妝指導娜蒂亞史戴西，對艾瑪史東扮演女科學怪人

  的髮型詳細說明，她下垂的長髮與英國19世紀維多利亞時代的女性盤髮大相徑庭，顯示她

  反社會的獨樹一格；妝也從素顏到進入妓院的五彩繽紛，展現角色「成為人類」的進化過

  程。




  --'
