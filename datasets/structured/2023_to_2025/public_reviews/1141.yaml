url: https://www.ptt.cc/bbs/movie/M.1714368799.A.3E9.html
title: '[ 好雷] 可憐的東西'
content: '之前本來計畫要去電影院看的，結果因為太忙，沒想到D+竟然上了，就趁假日看完。


  在看之前連預告都沒看過，只知道這部有得獎應該是好看的。



  以下劇情個人感受：


  一開始從攝影方面來看，這部片就很不同於其他現代電影，首先注意到的是！1.66:1這少見

  的長寬比，然後又用了一般電影少用的魚眼、超廣角鏡頭以及變焦鏡頭。


  劇情方面就是科學怪人那種，把嬰兒腦裝到母親頭內，這想法真是腦洞大開。


  然後就是看貝拉一路成長的過程，這部分大概就跟佛洛伊德發展階段理論一樣：口腔期、肛

  門期、性器期、潛伏期、兩性期


  一開始貝拉雖然有成人的身體但是腦子沒經過社會化過程，所以就做出一堆違反社會禮儀的

  事情，後來貝拉也慢慢發展出一套行為模式可以在社會生存。



  看到最後只有一個比較疑惑的地方，既然都可以換腦了怎麼不把外科醫生的腦子換到前夫的

  身體呢。 塞山羊的腦雖然挺惡趣味的，但是也就是覺得有點浪費吧。



  --'
