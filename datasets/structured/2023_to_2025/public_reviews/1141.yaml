url: https://www.ptt.cc/bbs/movie/M.1711504121.A.EAD.html
title: '[可憐雷] 可憐的東西 艾瑪史東是欠多少錢'
content: '大家好大家早安


  筆者今早身體微恙


  就休假在家休息


  本來早上很舒服的


  但突然想到前天晚上 跟小模女友


  去了信義威秀看了 可憐的東西


  還是滿腔怒火不得發洩


  以下有雷


  --------------------










  艾瑪史東是在搞啥小


  從開頭 就露點


  還一堆打砲畫面是怎樣


  到旅館也露點


  船上也露點


  真的是可憐


  我合理推斷艾瑪史東應該欠Yorgos Lanthimos很多錢啦


  這個金額 在我的細算之下


  大概在三億美元左右


  至於我怎麼算的？


  告訴你你們也聽不懂


  還是別說了吧


  以艾瑪史東在影史上的地位


  年紀輕輕就已經拿下奧斯卡最佳女主角


  最好會需要靠露點來博版面啦


  真丟臉


  戲中當妓女


  戲外也在當妓女


  真可悲












  另外這部片真是有夠無聊的


  全片其實就是雜交的概念


  把嬰兒的頭腦接到大人的身體上 然後讓他去賣淫賺錢


  把豬頭接到雞身上


  把羊腦植入到人身上


  然後呢？


  好像什麼都沒有表達


  只是做出一些很炫的超現實場景


  唉


  真是一部大爛片


  晚點該去找小模女友發洩一下了


  謝謝大家



  --'
