url: https://www.ptt.cc/bbs/movie/M.1707397357.A.767.html
title: '[選片] 看還錢or可憐的東西？'
content: '先恭喜各位開始放年假了，感覺今年過年有一堆強檔片

  目前有兩部還錢跟可憐的東西想要看


  還錢就是國片

  本身對國片印象普通，通常都是輕鬆好笑

  但看這部卡司好像不錯，就是符合節慶的那種賀歲片


  可憐的東西我也很想看！

  先前有看過預告，這部在鏡頭的轉換還有色彩都很用心

  移植腦袋這個題材也很特別

  整部的氣氛目前看起來就是怪誕大膽，還有艾瑪史東超高尺度演出


  但年假也滿多走春行程

  如果這兩部只能選一部看的話，大家推薦哪部？



  --'
