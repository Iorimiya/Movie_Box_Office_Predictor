url: https://www.ptt.cc/bbs/movie/M.1714705977.A.078.html
title: '[好雷] 可憐的東西結局大快人心'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  一直很想看可憐的東西

  但礙於沒空去影院

  先在YT上看了懶人解說版

  但就是大概知道內容而無法體會電影要傳達的感受

  前幾天看到串流平台上架真的是喜出望外

  當晚立馬收看


  首先，很喜歡整部片的色彩架構

  一開始貝拉腦部發展還是寶寶的時候

  整部片的色調是黑白的

  就像寶寶剛出生還無法看到色彩一樣

  以及象徵著貝拉還未探索世界時

  她的人生是沉悶且無趣的

  當貝拉踏出被保護的框架後

  強烈又鮮豔的色彩充斥了整個畫面

  代表貝拉成長了

  以及他的人生開始變得充滿刺激冒險及樂趣


  有著成人軀殼但心智還是幼兒的貝拉

  以驚人的速度吸取知識

  並用自己的五感親身探索世界

  崇尚自由富有冒險精神的她

  不論是正人君子還是風流渣男

  都被她深深吸引

  雖然貝拉探索世界的方法非常特殊

  但她在過程中體會人生百態

  並且也逐步得知自己離奇的身世


  貝拉勇敢追求自己的喜好

  勇敢堅毅又充滿智慧

  最終她成功報復了變態的父親

  雖然養育她成人的怪異科學家因病離世

  但她與母親的軀體共生在一起

  身邊有愛護她的男人及朋友

  本該過著可憐生活的她

  卻完全反轉的原本悲情的人生

  或許最可憐的

  應該是那些將女人視為玩物的壞男人吧


  --

  看完我也想在戲院看'
