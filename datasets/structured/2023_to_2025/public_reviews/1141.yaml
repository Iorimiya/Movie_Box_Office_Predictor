title: 'Re: [好雷]可憐的東西 Poor Things'
content: '感謝你寫的劇情

  我實在看不懂這種敘事方式

  但看了你寫的就稍微略懂

  她下船跑去賣後就開始分心了

  所以後半段都在想別的事沒法專心看

  後來也不知道怎麼結束就演完了

  初二跟我媽我姊去裕隆城看的

  我姊選的片，我完全沒聽過這片

  回家查了才知道拿了金獅跟金球


  有個小插曲，從裕隆城看完出後

  上完廁所準備回家突然看到一個老外

  我想說這片那麼紅，老外都跑來看了

  回家查YT簡介，發現那個老外還真像導演

  不會是像盧貝松一樣偷偷跑來台灣宣傳吧 ?



  就是這個，那個裕隆城影廳外面

  跟兩個朋友聊天的大鬍子老外長的還真像導演

  時間是初二大約晚上10:30




  --

  也有可能，就像喜劇泰斗羅賓威廉斯

  生前也一個人跑來台灣旅遊散散心被拍到'
