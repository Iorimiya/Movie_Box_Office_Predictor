content: '轟動威尼斯影展 驚世鉅作《#可憐的東西》 前導海報登場

  艾瑪史東 突破尺度大膽之作  農曆新年 2月8日 (四) 大膽解放

  植入嶄新大腦的她，是否還擁能有自己的靈魂？

  放縱不羈的性愛馬拉松    踏上一場解放真實自我的快樂長征

  華麗頹靡的復古場景 打造獨具風格的科學怪人夢遊仙境

  前導預告：


  橫掃獎季奇幻巔峰｜#奧斯卡 大熱門作品

  #金獎製造機 #探照燈影業 衝奧之作

  《#真寵》《#單身動物園》《 #聖鹿之死》 勇於挑戰體制的金獎導演 #尤格藍西莫 集大

  成之作

  演技怪物同場飆戲｜奧斯卡影后艾瑪史東、威尼斯影帝威廉達佛、金獎提名馬克魯法洛、

  金球視帝拉米尤瑟夫、艾美獎最佳編劇傑洛卡麥克


  --'
