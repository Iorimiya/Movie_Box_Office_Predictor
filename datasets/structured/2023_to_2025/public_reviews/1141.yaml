  胎兒大腦重新借腦還魂，成人的身體，幼兒的智力，對世間萬物的好奇，展開一場遠渡重

  洋橫跨大洲的精彩冒險，除了要探索人生、人性，還要探索人類最原始的慾望深處，經歷

  種種她將發現生存的美好。

  想在今年農曆年感受一部超級不一樣的賀歲電影嗎？

  《可憐的東西》絕對是你進戲院用大銀幕觀賞的第一首選!






