url: https://www.ptt.cc/bbs/movie/M.1704728241.A.2BD.html
title: '[新聞] 金球獎／「奧本海默」、「可憐的東西」大獎眾望所歸'
content: "金球獎／「奧本海默」、「可憐的東西」大獎眾望所歸\n\n2024-01-08 12:18\n\n聯合報 記者陳建嘉／即時報導\n\n\n席尼墨菲主演「奧本海默」拿下劇情類最佳影片、最佳男主角、最佳男配角與最佳導演以\n\
  及最佳原創配樂，是本屆大贏家。圖／UIP提供\n\n2024年金球獎揭曉，兩座最佳影片獎項分別頒給去年全球賣座9.53億美元（約298億元台\n幣）的傳記史詩電影「奧本海默」以及榮獲威尼斯影展金獅獎的「可憐的東西」，兩片氣\n\
  勢同樣強健，也將於奧斯卡獎上再度一決雌雄。\n\n「奧本海默」講述原子彈發明者奧本海默的生平事蹟，講述他如何從旁結束第二次世界大\n戰的始末，更體驗到戰爭的殘酷與虛無，最終獲得最佳影片大獎，由導演克里斯多夫諾蘭\n\
  、製片艾瑪湯瑪斯率領眾多劇組上台領獎，劇組也表示電影題材較為生硬，感謝眾多人支\n持喜愛；「可憐的東西」則透過一名被製造出來的女子踏上繽紛奇幻的慾望旅程，過程目\n\
  不暇給，同樣也獲得最佳影片肯定。\n\n\n奇幻情慾電影「可憐的東西」拿下金球獎喜劇類最佳影片、最佳女主角。\n圖／探照燈影業提供\n\n\n奇幻情慾電影「可憐的東西」拿下金球獎喜劇類最佳影片、最佳女主角。\n\
  圖／探照燈影業提供\n\n金球獎  威尼斯影展  奧斯卡\n\n--\n佛法的\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是\
  \ 菩薩\n\n\n\n--"
