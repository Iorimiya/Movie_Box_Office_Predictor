  艾瑪史東（Emma Stone）與《可憐的東西》（Poor Things）導演尤格 藍西莫（Yorgos L

  anthimos）五度合作的全新力作《善良的種類》（Kinds of Kindness），繼上回公布威

  廉 達佛（Willem Dafoe）、瑪格莉特 奎莉（Margaret Qualley），以及《真寵》（The

  Favourite）的喬 歐文（Joe Alwyn）等合作過的演員卡司，確認參與本作的演出後，官

  方也在Instagram上，公開多張個人角色海報。











  除了上述提及的演員陣容外，其他名單也包含：周洪、杭特 薛佛（Hunter Schafer）、

  馬蒙 杜亞提（Mamoudou Athie）、傑西 普萊蒙斯（Jesse Plemons）。


  電影《善良的種類》內容也含有暴力、性暗示、全裸...


  等要素，因此與《可憐的東西》一樣，被歸類為R級。


  《善良的種類》除了將在2024年6月21日於北美戲院上映外，在下週，也就是2024年5月17

  日將在坎城影展進行首映。


