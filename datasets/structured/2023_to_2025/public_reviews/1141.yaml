url: https://www.ptt.cc/bbs/movie/M.1708363804.A.5BE.html
title: '[好微雷] 觀影心得《可憐的東西》，學學貝拉'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  先被驚艷到的是畫面的精緻度、油畫般的色彩、柔和又銳利的影像、夢幻的場景卻又讓人

  在虛實間搖擺，以藍黃配色為主的色調、有點惱人又藝術的音樂貫穿整部片。


  只看電影海報封面還以為是驚悚片，結果發現有得金球獎《最佳喜劇電影》。


  也不知道是不是被騙了，還是電影本來就可以同時存在兩種風格，表面是喜劇，同時存在

  一種詭異氛圍，有些畫面甚至讓我懷疑這是15+能看的嗎，電影到後面越笑不出來，尤其

  是最後30分鐘左右，驚悚又獵奇的氛圍，讓我皺著眉頭帶著驚恐的表情，腦袋開始過載。


  開頭沒有任何資訊的看著艾瑪史東飾演的貝拉一連串的奇異行為，在路上看到這種「成人

  」，多半會覺得是「弱x」、「智x」、「阿ㄍㄧˋ」，像裡面的麥斯一見到貝拉的舉動脫

  口而出：「怎麼有這麼美麗的弱x？」（忘記原話了，大致上意思應該是這樣），看完才

  意識到原來從這裡導演就開始表達「社會價值觀」。


  用成人的身體來表現新生兒長大成人的過程，將所有情緒具象化，貧富差距的場景，也從

  貝拉口中精確的得知她的情緒，還有整部片也許牽扯到一些哲學，但是電影裡說哲學沒用

  ，所以管他的。


  神奇地方是，整部電影沒有告訴你明確的時間過了多久，卻可以從貝拉身上的變化，知道

  貝拉現在大概又長大了多少，一直到貝拉越來越符合社會價值觀。


  片名《可憐的東西》，個人理解是指新生兒，沒有選擇的誕生到這個世界，還要受家庭環

  境影響，被社會價值觀綁架。


  學學貝拉，拒絕內耗。


  --'
