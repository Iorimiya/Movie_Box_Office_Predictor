title: '[ 微好雷] 可憐的東西是在諷刺女權?'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  原本以為這部片要宣傳女權


  但看到中間覺得有點諷刺


  例如一開始只會摔東西哭鬧


  是不是象徵女權是巨嬰只會情勒?


  看到窮人很天真地想幫助他們


  卻把錢送到壞人手中，就連錢也是偷來的


  意思女權只會康他人之慨，而且又天真?


  如果嬰兒是男的，移植到女生腦裡，那她跟一堆男人做愛


  不就變同性戀?這是在諷刺跨性別嗎?


  離開未婚夫跟老男人出去見世面


  回來再來找回收，不就是現在女權的寫照?


  當妓女說自己有身體自主權，性愛跟錢全都要


  這不就女權最愛的自主權?


  當妓女也很棒啊，別看不起妓女


  妓女也是很勇敢的，敢說妓女髒你們就是假女權、衛道人士


  但正當我質疑這部片是在諷刺女權時


  最後搞死前丈夫，我就知道了


  原來這部是真女權啊


  反串得太像以致於不知道是不是反串


  真神


  仇女跟女權都會同時喜歡的一部片


  --



  不確定耶 如果女性荷爾蒙過多

  會讓男性的大腦變成喜歡男生嗎

  還是單純只影響外表性徵呢

  如果沒有肉體 有辦法區分大腦性別嗎

  如果沒有經過學習與社會化

  這顆大腦的思維最終是無性別？

  這部的設定很有趣 成熟大人的外表 腦子是嬰兒

  所以做的事再幼稚都可以被原諒

  畢竟她是在尋找自我嘛

  傷害了別人又如何?


  沒有自己的論述 直接人身攻擊嗎

  滿有意思的

  完整呈現您的水準


  另外片名也很有趣

  主角不認為自己可憐

  但旁觀者卻認為她可憐

  究竟這個東西是指什麼呢

  是可憐的人 可憐的大腦 可憐的肉體

  還是可憐的旁觀者？'
