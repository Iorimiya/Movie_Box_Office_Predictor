title: '[好雷]  可憐的東西'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  據說這部是得獎神作，所以把他看完了


  以下純屬個人心得：


  我看這部片的感想是「我思故我在」


  許多人喜歡模仿別人的想法


  喜歡將自己的想法套用在他人身上，


  因為這樣創造出來的世界充滿安全感，


  但貝拉的生活卻是充滿實驗及冒險精神，


  未來充滿變數也毫無畏懼，


  只為了對未知的世界做各種試驗，


  看似缺乏道德且瘋狂，


  但實際上人們常為了遷就社會，


  把自己囚禁於思想的監牢裡，


  只有那些突破框架的人，才能獲得思想的解放。



  看完覺得，的確是可以讓人好好思考的一部片。




  -----

  Sent from JPTT on my iPhone


  --


  --'
