url: https://www.ptt.cc/bbs/movie/M.1707484884.A.502.html
title: '[好雷] 可憐的東西 幽默又殘酷 '
content: '昨天和朋友一起去看可憐的東西，聽說是得很多獎的文藝片

  原本以為會看得很悶，沒想到出乎意料的好看，劇情張力和娛樂感很足

  故事設定已經很衝擊三觀，加上荒唐幽默的方式描寫人性

  看完一個好故事會有種莫名的過癮感，但同時滿滿的反思和惆悵

  幾個男性角色對主角扭曲的愛，特別讓我有感


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~













  首先是威廉達佛飾演的科學怪人博士

  他對Bella愛，純粹是出於對科學的熱愛，在溫暖舉止的背後是極致的自私

  博士從小被父親以科學為名當成實驗品在養

  扭曲的價值觀讓他深信科學是唯一真理，人不過就只是一種生物

  在他眼中Bella是一手打造的，奇蹟般的換腦實驗品

  關在豪宅中無微不至的教育與照顧，都只是為了「觀察」這個實驗品

  當然這種忽視人性的養成模式，終究是關不住Bella的靈魂

  甚至冷血說出「當時不應該讓Bella發展出情感」

  但自己卻漸漸也對這個「實驗品」產生感情

  更諷刺的是，最終讓Bella飛躍性成長的就是體驗外面世界和人情冷暖


  再來是博士的助理麥斯

  他一開始對Bella的愛比較像是出於憐憫和自卑

  身為一個貧窮懦弱的醫學生，在同儕中被霸凌瞧不起

  偶然獲得博士給予貼身觀察Bella的機會

  但我認為博士應該也瞧不起他，只是覺得他好控制

  也因此讓他跟Bella結婚，方便進行實驗下一階段的觀察

  單純的麥斯也正如博士所料，在日常互動中不小心對Bella暈船

  竟然輕易就答應這樁詭異到不行的婚事，甚至還要簽各種奇怪的法律條約

  可以看出他心中非常同情Bella，但天真的以為自己是真心愛著Bella（這時Bella甚至只

  是幼兒階段的心智）

  最後面對心靈成長歸來的Bella，他也坦承當時一股腦要結婚欠缺思考

  麥斯可以說是典型的缺乏愛情經驗的自卑男工具人，一旦暈船就無法脫身

  不過本性善良的他最後還是獲得Bella的認同


  最後是律師鄧肯（浩克馬克魯法洛在這部的演出讓我很驚豔！

  是標準的自大渣男，他對Bella的愛純粹是出於他不允許被糟蹋的自尊心

  他是個享受生活，追求刺激和樂趣的人

  每當有機會就盡力滿足自己的感官、狂放的表達情緒

  所以他毫不猶豫的誘拐Bella私奔

  對他來說Bella是一個與眾不同、充滿驚喜的女人

  不像他過去風流過的女性們，可以按照他的遊戲規則走，玩膩了就拋棄


  當Bella開始自我啟蒙時，他發現自己逐漸無法控制這女孩

  而且Bella只是透過他來享受性與探索世界，幾乎沒有真正的感情可言

  就像現實中的自戀渣男，越得不到的就越想要

  這一切反而讓他更執著要和Bella在一起，因為鄧肯無法接受自己的自尊被打倒

  一方面又渴望Bella帶來的未知與刺激，所以他真正愛的還是只有他自己

  （如果Bella變成一個正常社會化的女性，相信他會毫不遲疑的拋棄她）

  但是鄧肯跟Bella的相處真的滿有趣的，後面還一直情勒哭鬧，有好幾幕都笑噴

  如果沒有鄧肯的出現，Bella也沒機會在外面世界大鬧一番

  散盡家財、理智崩潰，換來Bella的全面進化，真是辛苦這個大渣男了


  最後想說，除了主角艾瑪史東演出強到沒話說以外，身邊這些角色也很到位、細膩

  雖然浮誇但完全反映出人性的真實面，整部片就是驚世駭俗的黑色幽默寓言故事

  腦袋衝擊感很強，值得一看


  --'
