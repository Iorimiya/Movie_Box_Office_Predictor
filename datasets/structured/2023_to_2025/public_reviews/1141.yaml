title: 可憐的東西
content: "《可憐的東西》\n\n\n    很久沒寫觀影長文，單純就依以前看教育心理學一些理論的印象、以及對達利超\n現實主義風格的喜愛綜述這些內容寫下觀影文，如有錯誤請指正。\n\
  \n---------------防雷-------------------\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n    這海報那種不協調的感覺總覺得看過，一時之間又想不起來，直到各種超現實的\n\
  拼接生物出現在畫面（鵝頭狗、狗頭雞、只有馬首與脖子部位的「馬車」），再到走出影院\n回想裡面最震撼的那幕：以手術刀狂戳眼窩---幹，這個致敬《安達魯之犬》的畫面不就達\n\
  利嗎？一整個就很「達利」的超現實主義電影。\n\n    出電影院看到下午已經看完電影的學生來訊，問我想法如何，就我自己的想法電\n影的主題不離「自我建構」與「自我定義」的問題。這個命題的前置設定很有趣，一個跳水\n\
  卻已腦死狀態的孕婦移植了腹中胎兒還活著的大腦，那麼，「她」自己究竟是誰？劇中以「\n維多莉亞」（跳水自殺的孕婦）身驅之姿生長、長成的胎兒腦子所建構的人格「貝拉」，如\n\
  同為她施術的「God」回應她手術質問所說的那句：\n\n   「妳就是妳自己本身」\n\n    看似鬼打牆的問題，實際上在一小段一小段過場的境遇與追尋裡，「貝拉」已成\n\
  為屬於她自己的「貝拉」，縱使人們與她的互動、慾念是立基於「維多莉亞」的成熟、美豔\n女性的軀體，然而，由童稚無思辨能力到最後能自我獨立思考能力並展現自我認知所建構的\n\
  「貝拉」，閱讀、思考、對話，這一切後天習得的能力似乎才是「人之所以成就人（自己）\n」的解答。\n\n    而另一個值得注意的是，只有起初貝拉在研究所內被「監控」（如同一個人為控\n\
  制變因的實驗箱）生活的部份是黑白畫面，開頭維多莉亞跳水，乃至花花公子鄧肯帶她「私\n奔」接觸外面後開始全都是彩色的場景。彷彿實驗室控制時期的無思辨能力暗喻蒙昧無知，\n\
  貝拉自行決定與鄧肯出走後的一切是自身的決定以象徵自主的意象。\n\n    雖然貝拉逐漸建構「自我」而決定力抗想把她當成所有物的男人們（父權）的段\n落，像在宣揚「女權」自主的老生常談，但這些舉動僅僅是人格自我建構的部份罷了。\n\
  \n    所以說，這個自我形塑的驅力究竟為何呢？就從貝拉在實驗室裡開始自慰、發現\n性的愉悅開始。對，這一幕開始時，我腦海裡的直覺問題是：「幹，她不是裝了嬰兒的腦子\n\
  嗎？小嬰兒（孩子）會有性慾嗎？」。從性的愉悅與探索伊始，整部片另一個滿重要的議題\n就是性與自我解放的連繫，亦即「身體自主權」（自我認知與建構），這種以性為驅力的自\n\
  我認知建構（性力派）超級佛洛伊德（心理學理論建構創始者），更甭說以「超現實主義」\n作品著稱的達利也是以「性」為個人內心意象描繪、自我剖析的發想。這一塊完全打掉一般\n\
  自我認知建構理論，必然依個人生長各階段年齡層作「分期」的定義與區隔（如：佛洛伊德\n派將人的成長分為「口腔期」、「肛門期」、「性器期」等等...），直接跳過人從嬰兒發\n\
  育到成人緩慢而轉變不斷的成長過程，而以發育完全的成人之姿，開始建構人格。劇中貝拉\n的自我探索往往伴隨著性的探索與愉悅，從一開始性能力極佳的花花公子男伴、在妓院應承\n\
  不同客人而探索「性」的不同可能性，直到女女性行為的快感為止，完全不脫對「性」的探\n索的重要性，而這些段落倒也不乏數落一下男人用只老二和征服慾這些父權的單細胞思考便\n\
  是（苦笑）\n\n    因此，回到了一開始的鬼打牆，「貝拉」真的單以新的腦子（認知）成就了身為\n「貝拉」的自己嗎？還是說這是維多莉亞軀殼所詮釋的另一種可能的人格或人生？我想從一\n\
  開始就不可能完全說「貝拉」是一個新的獨立人格，必然伴隨「維多莉亞」軀殼所擁有的客\n觀條件（外貌、吸引力、成年人的自主行動能力）才得以建構「貝拉」。\n\n \
  \   整部電影兩個多小時，完全不會感到枯燥或滯悶尷尬，反倒是在觀影過程激起一\n個個問題，並留心一些畫面或可能的暗喻之類的。故事說得非常完整，不單是「貝拉」自我\n\
  建構與尋找的過程，連帶過往「維多莉亞」人格特質的回溯和家庭也連帶作了交待。唯一無\n法確定和美中不足的是，劇中有幾幕在里斯本、巴黎以葡語或法語交談的字幕沒打出來，不\n\
  知道是有意為之亦或單純臺灣代理這部份只請英文專業翻譯之故 。\n\n    片尾沒有彩蛋，但我很喜歡那些有著暗喻（「性」）或別有意義的畫面，就這\n樣癱躺在椅子上順順地看完了。\n\
