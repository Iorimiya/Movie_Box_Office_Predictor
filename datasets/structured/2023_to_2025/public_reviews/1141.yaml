title: '[好雷] 可憐的東西'
content: '看到前面有篇說過年沒好片

  只好發篇文來推薦了


  當然這片的觀賞門檻極高

  這門檻不是在“這是否又是部看不懂的文藝片”

  而是視覺跟價值觀的衝突

  大量的性愛場景

  手術移植的臟器特寫

  就算畫面能接受了

  還得看自己能否承受這看似毀滅三觀的對白

  然而跨過了這層關隘

  這根本就是部台詞豐滿，笑點滿滿

  又瘋狂又荒謬又帶點思辯的好片

  再加上蒸氣龐克的設定

  讓場景真可謂是華麗炫砲之極致


  也因劇本寫得夠好再加上艾瑪史東精準的演技

  讓觀眾不會因上述尺度誇張的場景而抽離

  配合貝拉從一開始幼兒般的幼稚瘋狂

  因好奇心快速成長最終自我覺醒

  電影也從黑白片段一路推進到彩色的龐克畫面

  讓觀眾更能沉浸在貝拉的旅程中


  不論你是想看異想天開的場面

  還是想感受機鋒點落的對白

  還是想欣賞演員精彩的飆戲

  我相信任何人都能找到一個趣味

  慶幸我的家人好友是能接受這樣的尺度

  從戲院不時冒出的笑聲來看

  這絕對是一部非常有趣的電影

  拋開成見享受它吧


  --'
