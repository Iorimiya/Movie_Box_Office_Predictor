url: https://www.ptt.cc/bbs/movie/M.1713926311.A.C59.html
title: '[  雷] 可憐的東西Poor Things'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  D+上架《可憐的東西》，火速看完。


  怎麼說...心情複雜。以前覺得尤格格藍西莫讓人不舒服，同時令人印象深刻。那種不舒

  服即使沒重看，對劇情無印象，還是會有某個角色或某些設定狠狠烙在心裡。


  《真寵》偏喜劇一些，但主角與配角演出還算是中了我的好球帶。


  這次《可憐的東西》卻讓我感到有些匱乏，甚至無聊。前三分之一算是忍住咔片的衝動，

  到中間（上船之後），對於接下來發展燃起希望，過一半希望就熄滅，進入最後四分之一

  ，只是為了看完而看完。


  攝影、美術、音樂，依然是好，服裝與艾瑪史東也沒話說。這些讓我看完這片，並沒有真

  的很爛，反而是滿好的，只是很空洞的好。


  看完跟友人說：童話女性主義教科書？滿足男性希望的版本


  友人說：一點都不女性主義教科書啊。很多人執著於女性主義和諷刺父權，但我反而覺得

  電影是諷刺一切人類的荒謬，不限於父權。


  不知道該同意還是不同意，因為我甚至並沒有對自己隨意說出的心得有任何證據和堅持。


  這不是我會喜歡的電影，不過可以「看看別人喜歡什麼樣的電影」。



  ****



  這裡是我的樂園:




  --'
