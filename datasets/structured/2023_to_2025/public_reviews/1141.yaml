content: "前言:\n\n這部是臨時起意去看\n\n事前並不知道這是一部怎麼樣的片 只有被告知是劇情片\n\n以下會用一個完全狀況外的觀點去描述影評\n\n\
  \n\n雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n一開始採用歐式古典風格的畫面配合那詭異老派的音樂\n\n加上怪臉科學家跟一個不被允許出門的女人\n\
  \n讓我有了這不是一部正常的片的心理準備\n\n後來的助手介入跟換腦內情, 還有那不平等的婚姻合約\n\n都讓我對這女人的未來感到了一絲不妙\n\n可憐的東西就是指這女人了吧\n\
  \n\n這裡要先說一下個人覺得換腦的意義在於兩點\n\n1. 這女人重生了, 劇中雖然是物理的換腦,\n\n   但也可以說成是換個腦袋(想法)很多時候人就能重生而不陷入死迴圈\n\
  \n2. 腦袋是用嬰兒的 代表這女人的所作所為一切都可以被原諒\n\n   畢竟接下來準備亂七八糟\n\n\n劇情核心部份簡單可以說成是\n\n一個單純富有同情心的女人,\n\
  \n透過外表優勢吸引了各式各樣的人來為她介紹這個世界,\n\n美其名為認識和探索, 不過幾乎都是透過性愛,言語交流只佔極少部份\n\n可能導演很想表達女性性自主這點\n\
  \n但這在台灣我感覺是有點多餘了\n\n畢竟台灣已經是女權相當高的國家了\n\n然後玩這麼大沒有得病還蠻正常的 畢竟是女主\n\n看完這段其實我認為這過程就是一個比較open的雙性戀美女的成長歷程\n\
  \n因為人夠美所以年輕時可以讓整個世界幾乎圍繞著她賺\n\n(只有曾經被騙錢這點不是)\n\n正常人這樣探索大概是準備被賣到不知道哪裡去\n\n(所以我覺得拐她走的那個男子非常負責沒有中途烙跑或做玩完就賣掉的事情)\n\
  \n\n最後回家那段個人認為主要是做一個ending\n\n畢竟不可能讓女主在妓院待一輩子\n\n探索完畢 成為大人了 回到家繼承家業\n\n和一個不careX百人以上的純情男在一起\
  \ 還外帶一個小三閨密\n\n完全一點都不可憐 簡直是女生的理想人生(?\n\n\n至於將軍那段個人認為是一個轉折\n\n除了強調自由很重要之外\n\n其實是完全可以在這裡做一個bad\
  \ ending\n\n如果女主真的栽在將軍家\n\n那就真的是可憐的東西了\n\n繞了一圈女人還是無法擺脫命運\n\n還好沒有\n\n\n看完後\n\n一直疑問到底誰是可憐的東西\n\
  \n是被換腦的將軍? 不 那已經是羊了 將軍已死\n\n看到有人說是思想被侷限的大人\n\n嗯, 好像有幾分道理, 但我在劇中看不出來\n\n個人認為導演的呈現手法太過強調性愛\n\
  \n\n給普雷的原因是這部電影看過一定會讓人印象深刻\n\n對過渡性愛的呈現手法不排斥的話會看得很順暢\n\n但無法給好雷的原因是男的這樣做絕對被出征\n\n\
  當你覺得這部戲演得很好時請記得這件事情...\n\n\n--"
