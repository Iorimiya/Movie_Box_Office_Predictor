title: '[好雷] 可憐的東西'
content: '心得內文對於性描述比較直白

  不習慣的可以跳過喔


  昨天晚上才看完電影，白天看完花了大概3-4小時整理，

  剛剛才修訂完成，

  要貼過來發現分行會跑到，建議到網誌直接看喔


  網誌好讀版:








  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  在希臘導演Yorgos的《Poor Thing》中，我們被帶入一個超現實的歐洲，見證了一段科學

  怪人式的故事。


  電影探討了科學倫理、身體自主權、性別角色以及社會規範的諸多問題。透過Bella——

  一個被給予成人身體的嬰兒，我們被引導去思考：在這個由傳統與現代價值觀交織的世界

  中，一個人的身份、自由以及愛(性)究竟意味著什麼？這部電影將我們帶入了一場探索世

  界，也自我探索的旅程，挑戰著我們對於常識的理解，並以其獨特的視角重新審視身體與

  靈魂的二元論。

  身體與靈魂的二元論- Bella


  身體與靈魂的二元論貫穿了《Poor Thing》的敘事核心。電影透過Bella的誕生和成長，

  巧妙地挑戰了傳統哲學中對於身體與靈魂關係的看法。


  Bella，一個處於無辜與純潔狀態的嬰兒，原本應該隨著母親而死亡，卻被『上帝』

  Godwin『救活』，賦予了她母親的成人身體。這樣活著到底是一種幸運還是不幸? 從影片

  後段她對Godwin的複雜感受或許可以得到一些答案。


  電影中這種對於身體與意識、物質與精神分離的探討，不僅體現在Bella自我意識的形成

  過程、自我認識，更在於她與周遭世界的探索與互動中得到了深化。


  從Bella的“誕生”開始，她就處於一個被賦予身體而尚未獲得靈魂認同的狀態。她的身

  體是成人的，但她的心智和情感卻需要跳過從嬰兒到成人的成長過程，直接面對這可怕而

  殘酷的世界。在《道林格雷的畫像》中，主角通過一幅肖像來承載自己身體的衰老與道德

  敗壞，從而探討了外表與內在、身體與靈魂間的張力。相反，忒修斯之船的故事則問及：

  若一物的所有部分均被替換，它是否仍舊是同一物？Bella年輕的靈魂被替換到一個不屬

  於自己的身體裡，這種設定使我們不得不問：是身體定義了我們，還是我們的靈魂和意識

  塑造了自我？

  身體與靈魂的二元論- Godwin


  人應該是自己身體的主人，靈魂卻比較像是身體的過客，我們人生病的時候偶爾會有這種

  不由自主的相對剝離感，為什麼身體不由自主地一直咳嗽、為什麼一直打噴嚏、為什麼自

  己手不能動、為什麼身體沒有力氣?


  Godwin並不認同傳統意義上的靈魂概念，這反映了他對於理性主義的堅持，即一切皆可通

  過物理和生物過程來解釋。然而，Godwin難道都沒有掙扎嗎?


  Godwin自己的身體，有著科學怪人一樣的拼湊痕跡，這種特徵是來自於他父親的實驗還是

  不斷的自我改造，不得而知，但顯然他是有格格不入的感受的，路邊Bella想要停下來買

  冰淇淋，而Godwin的直覺反應是其他人會不喜歡他。


  他對Bella的創造毫無疑問是一種經驗與身分(identity)的複製與傳承。這很大程度影響

  了Godwin的父親的自我定位和對Bella的感情，也揭示了人性中的道德矛盾。在Bella臨行

  前，Godwin展現出了父愛——將錢縫在她的衣服裡以確保她的安全，揭示了即使在這樣的

  科學狂熱背後，依然潛藏著人性中溫柔的一面。這種父愛的表現，看似與他作為科學家的

  身份形成對比，但實際上透露了即便是在極端的科學追求中，他仍蘊藏著人的情感。


  當被Max問及是否與Bella有過超越父女關係時，Godwin首先是援引自己的生理限制作為回

  避，隨後才提及父愛壓過了他的情慾。這一回答不知道是不是展現了他人性(慾望)大於理

  性的一面，讓人忍不住疑問，要是沒有生理限制，他會不會做出一樣的選擇? 還是跟

  Bella一樣遵從身體的信號?


  在《Poor Thing》的複雜敘事中，Bella終於發現自己的來歷，也遇到Godwin與Max創造了

  另一個如同她一樣的生命——Felicity，並目睹了實驗室內各種怪誕的拼接生物。她對他

  們的稱呼“怪物”不僅是對於這種不適的直觀反應，也反映了對科學與倫理再次質疑。把

  豬的頭接到雞身上，那這樣身體到底是受豬頭控制，還是受雞身控制呢? (其實這一幕是

  讓人不太舒服的，鋼之鍊金術士的『大哥哥』造成多少人的痛苦XD。)

  性工作與女性自主權


  Bella的性工作經歷無疑是對女性身體自主權的探討，也呈現了性工作在社會文化背景下

  的複雜性。這段Bella賣淫的情節，體現性工作作為一種生計手段以及個體選擇的矛盾性

  ，特別是當這種選擇受限於教育水平、社會結構與經濟壓力的時候。


  Bella賣淫的決定，在電影情節內或許是一種水到渠來的過程，在某種程度上反映了她對

  自身身體自主權的主張。然而或許是不知者無畏，Bella可能並不知道賣淫的很多風險是

  不可逆的，不論是性病、懷孕還是肉體上的傷害，都顯示這不是一個有其他選擇下的最優

  解。


  沒有相關知識與教育，人只能從經驗中學習，就像每個孩子第一次被火燙到的經驗。賣淫

  的過程對於Bella來說是滑稽而不合理，也是不愉快的。所以她一開始也提出了她的疑問

  ，為什麼不是由女人來選擇客人? 也嘗試著做出改變，比方說讓男客人講講自己的童年經

  歷、自己講一個笑話、雙方聞聞味道，沒有其他問題就可以開始交配，把男女之間的性關

  係解構到不忍直視的程度。


  當她受教育以及有更多選擇的時候，也很高興她找到了更適合自己的職業，這些痛苦、而

  不快的的經驗與體驗，對人生實在是不必要，這也是我唯一認為Bella是poor thing的橋

  段。


  另外當Bella跟Max提到每次賣淫所得是30法郎，Max直覺的反應是怎麼這麼便宜？讓我實

  在有點啼笑皆非。這會是一個合理的第一反應嗎？但這句真的是很傳神的表達了Max非一

  般的人格特徵，也讓人聯想到東電OL案件，以及上野千鶴子對這事件的分析。


  在2000年前後，一起震驚日本社會的凶殺案件揭露了一名東京女性的雙重生活，這位女性

  在東京電力公司擔任辦公室職員。她不僅是公司內少數能夠打破玻璃天花板、擔任企劃部

  重要職位，年薪高達一千萬日圓的女性，然而，這位OL的死亡揭開了她生活中不為人知的

  一面。


  警方在調查她的死因時，意外的發現了一些紀錄，顯示她的生活方式遠比公眾所知的更為

  複雜。在日間她是一位尋常的的公司職員，但在夜晚，她卻化身為路邊的阻街女，以五千

  日圓的價格長期從事性工作。這種隱約帶有自我毀滅的選擇，在當時的日本社會中引起了

  廣泛的討論和關注。


  上野千鶴子認為，東電OL從事性工作的五千日圓價格，並非是對自己身體的定價，反而是

  對顧客的定價。比方說小米手機的一開始的定價策略，是勾畫了有手機需求但無法支付高

  額費用的客群。


  這一觀點是否反映了事實不得而知，但仍然挑戰了將性工作僅僅視為女性自我貶值的傳統

  看法，強調了性工作中的主體性與策略性選擇。這種分析視角，提供了一種理解性工作與

  女性自主權關係的新途徑，顯示即便在不平等的權力結構中，女性或許仍然試圖通過各種

  方式來行使自己的選擇權和控制權。


  Bella對於自己從事性工作的反思和質疑，以及她對於性交易條件的主動提問和重新定義

  ，進一步凸顯了她對於自主權利的追求。這不僅是對身體自主權的探索，也是對性別權力

  關係的挑戰。

  性別角色的反轉與自我探索


  在《Poor Thing》中，Duncan、Max和Bella的三角關係，也探討了性別角色的反轉。這些

  角色之間的互動不僅揭示了傳統性別的局限性，也展現了對性別權力動態的質疑和顛覆。


  Duncan的角色在這一三角關係中起著關鍵作用。作為一名律師，他代表了社會對於男性角

  色的傳統期望——有一定經濟地位、自信、控制欲強、且在情感關係中佔據主導地位。然

  而，隨著故事的發展，Duncan對Bella的控制和占有慾逐漸暴露出他自身的不安和脆弱。

  這一點尤其在他無法控制Bella的自由意志和她對外界探索的渴望時顯露無遺。無可奈何

  之下，Duncan甚至把Bella放到箱子內騙到船上。在沒了錢之後甚至住到了瘋人院。這樣

  的行為和心態，諷刺了傳統男性權威和力量，也質疑了性別權力結構中的固有不平等。


  與Duncan形成鮮明對比的是Max。作為Bella的支持者和未婚夫，Max展現了一種非傳統的

  性別角色。他對Bella的愛或許源於性吸引力，發生在舔耳的情節中，但後續也體現了對

  她作為一個獨立個體的尊重和支持。Max在家裡等待、願意放棄佔有，支持Bella的去冒險

  與探索，這在很大程度上顛覆了傳統性別角色中男性主導的觀念。但他甚至到婚禮上，當

  Bella決定跟將軍走的時候也一聲不吭，這讓我不禁懷疑，這樣的決定，到底是是一種理

  智還是不理智的選擇。如果可以預期選擇的結局，Max對Bella的情感，真的是愛嗎? 愛情

  常常有希望被對方抓住、被需要的感覺，很顯然在Max跟Bella的感情中，這些元素都是很

  薄弱的。


  Bella自身則是性別角色探索和反轉的核心。從一開始就不符合任何傳統女性角色模板的

  她，通過自我探索和對自由的追求，挑戰了社會對女性的期望和限制。即使被Duncan、女

  管家等人蕩婦羞辱，仍不受任何影響。Bella的經歷象徵了對性別身份的重新定義，她既

  不是被動的受害者，也不完全遵循傳統女性的角色扮演，而是積極塑造自己的命運和身份

  。


  透過這一三角關係，《Poor Thing》深入地探討了性別角色的社會建構性和流動性。這些

  角色和他們之間的互動不僅顯示了個體在性別身份中的多樣可能，也反映了性別權力結構

  中的緊張和變化。


  另一個值得一提的是在海上的章節中Harry跟Martha的角色。這章節也是比較沒有什麼性

  愛元素的部分。Duncan想控制Bella，所以把他帶到一個比較接觸不到其他男人的地方，

  然而這卻關不住她的思想，Bella也進一步離他越來越遠。


  通過與Harry和Martha的交流，Bella得到了哲學上的啟蒙，這些交流強化了Bella對於自

  主和自我認知的追求，也讓Duncan對她的控制變得荒謬而無力。Harry的憤世忌俗以及他

  對Bella的殘酷與期望，也希望Bella可以跟他一樣放下玫瑰色的眼鏡，但Bella哭了一場

  ，仍然寬容的摸著Harry的臉，安慰他只是受過傷的孩子。Bella對世界的觀察和反與

  Harry形成了鮮明對比，提示我們如何在困境中尋找和保持自己的聲音。有些人看了這一

  些，經歷了這一切，世界觀的形塑是一種必然還是一種選擇呢?

  割禮與女性自主權的侵犯


  在《Poor Thing》中，將軍的角色和割禮的主題是一種對性別權力結構和女性身體自主權

  侵犯的探討。將軍對Bella的強制割禮安排，不僅揭示了性別基於權力的壓迫，也突顯了

  對女性身體的極端控制與物化。這一行為否認了女性的自由意志，是女性自主權的剝奪，

  將女性視為被支配和控制的客體，只要改變作怪的身體，就能進而控制Bella的行為(跟惡

  名昭彰的額葉切除術異曲同工，有興趣可以看Sucker Punch這部電影)。


  將軍的行動對比於Duncan律師的角色，是對傳統男性權威的另一種極端表達，反映了一種

  歷史悠久的性別不平等觀念，即男性擁有對女性選擇、身體甚至生命的絕對控制權。這不

  僅是對Bella個人的侵犯，也是對所有女性自主權的禁錮，揭示了深植於社會結構中的性

  別歧視和不平等。


  此外，割禮的情節也是很怵目驚心的。


  女性割禮和男性閹割都是對性器官進行的身體修改，有著其相似性。從生物學角度來看，

  陰蒂和男性生殖器（特別是陰莖）在胚胎發育階段有著共同的起源。在胚胎發育的時候，

  分化成女性陰蒂的部位，其實也是分化成男性龜頭的地方。簡單來說，胚胎陰莖停止生長

  後，會轉變成陰蒂，因此陰蒂和陰莖都富含神經末梢，能產生性快感、有包皮，同時能夠

  勃起。


  這種部分或全部切除外陰部的做法，在多個文化和社會中被視為一種儀式，旨在控制女性

  的性行為，減少或消除女性的性慾。這對個體造成的傷害不僅是身體上的，也是心理上的

  ，對於抑制性欲卻不會有預期的效果。這在當代社會仍是一個需要被重視和解決的重要問

  題，聯合國統計目前世界上約有2億人口的女性受過割禮，主要分布於一些比較傳統的國

  家(連新加坡都還有案例)。


  從人權視角來看，它侵犯了女性的身體自主權，對女性的健康、性福和心理健康造成了長

  遠的負面影響。國際社會廣泛認為女性割禮是對女性的性別基於暴力，並努力透過教育、

  立法和倡導工作來消除這一做法。

  身體物化與性別權力動態


  另一方面，Bella在第一幕中對屍體的拉扯，顯示失去了靈魂，身體就是各種零件組成的

  肉塊，被扯的沒有任何感受，動手扯的也不以為意；下一幕醫生們圍觀著Godwin在中間解

  剖屍體，而大家都冷漠而習以為常的交談，對照著Duncan初次見面就直接觸摸Bella的陰

  部，這種行為，某種程度上跟Bella拉扯屍體的行為是完全一樣的，凸顯女性在性關係中

  的物化以及客體性。


  然而後續Duncan與Bella的關係變化，也展現了性別權力動態的複雜性，尤其是通過他們

  之間的情感和性啟蒙過程。Duncan，作為Bella性啟蒙的關鍵人物，他的風流就像一面鏡

  子。當Bella開始探索更多的性自主性時，Duncan內心的無力感和沮喪顯示他並沒有平等

  的概念。Bella的決定，包括她對性工作的探索，以及她對Duncan“跟別人做過以後會更

  愛你”的直言，挑戰了傳統的性別關係和對於情感依附的理解。這種描述不僅凸顯了開放

  式關係中的性別不平等和溝通障礙，也反映了個體在尋求自主和自我認同的過程中可能遇

  到的掙扎。


  進一步地，將軍對Bella母親死因的解釋及其對“歇斯底里”的引用，暗示了性別歧視如

  何深植於社會和醫學的歷史中。「歇斯底里」來是自拉丁文hysteria，詞源是希臘文

  hystera（子宮），因為當時病因被認為是女性子宮擾動是女性專有的病，只會發生於女

  性上。直到一次世界大戰，很多軍人發生創傷後壓力症候群，人們才逐漸理解這個症況。

  這種對女性情緒和身體狀況的歸咎，展現了對女性的刻板印象和誤解，以及這些觀點如何

  影響女性的自我認同。


  Bella在與Duncan的爭執中，一再表達了她的感受，以及對自由的堅定追求。Duncan繼之

  而來的愛情宣言和婚姻提議，在Bella對自由的堅持下，顯得只是一種無力的掙扎。Bella

  不受這種約定成俗的束縛(跟Duncan一開始一樣)。



  --

