url: https://www.ptt.cc/bbs/movie/M.1707874709.A.1A9.html
title: 'Re: [負雷] 可憐的東西  了無新意的女性一生'
content: '這部看完很久了 憑印象打 有錯請指正




  覺得不好看太正常了 只要你沒成功代入女主角


  要論科幻設定+性解放+權力解構+反傳統道德倫理關等類似元素


  隨便一部類似作品 例如 Infinity Pool 就屌打 更別說演員演技更有看點


  Poor Things 演技沒啥說服力 很多角色很樣板平面 甚至用力過度


  (例如搭船有錢男就用頭狂撞桌子代表他無法控制女主又生氣又無奈 真的過於卡通)




  本片又是抨擊父權的老調重彈 但情節安排WTF 正常人都沒法共情


  簡言之


  在城堡 我什麼都有了 但凡事不順我 我就鬧 亂摔東西 亂搞屍體 不給吃冰淇淋就跳車


  在船上 把你洗劫一空變乞丐 (自己錢藏好好) 救濟別人慷他人之慨 不同意生氣就是渣


  你們把我放城堡 放船上 勸離妓院 就是父權控制


  媽媽 (說肚子里的我是混世魔王 帶我去死) 老鴇 (威逼利誘多多工作) 則是讓我蛻變


  救贖之人 他們之所以踏上成魔之路 都是父權的錯



  你說主角本就未成年 那性愛場景不就是iwin 何況未成年不去妓院 不遠離監護人難道不對


  唯有帶入女主才是霸道爽片 爸爸愛我 給我一切 給我生命 給我繼承城堡


  男二舔狗工具人 默默守候 我看誰不爽就用來教唆犯罪 替我整死那個賤/渣人


  男人全都臣服我的性魅力之下 (然後真愛是另一個女人 不過完全沒有啥刻畫)



  本片唯一創意就是開門見山的換腦/換身體


  很長一段時間 我以為最後會替絕症爸爸換身體


  (但結局前一小段 我又認為不會 因為 可能設定上只有外科天才爸爸能動手術


  或是女主以受害者姿態You monster後 道德覺醒 結果結局完全打我臉 男二學會換腦


  技術用在完全無關的東西上 山羊何辜)



  簡言之 你如果代入其他人就變成毀三觀恐怖片


  我不是說主角必須道德模範生 或是 不能自我矛盾


  但是很多片對女性自主的刻畫 自然有說服力的多


  例如 Licorice Pizza 的女主 在一堆巨星配角環繞下 很好的詮釋成為大人的青蔥歲月


  (對自己未來的各種憧憬嘗試 跟多位男人周旋 跟父母的不對付等)



  如果論代入女主好爽 代入其他人好可怕好坑  可以看看代表作 Thelma & Louise


  你代入 Thelma 就是好爽一日覺醒   代入 Louise 就是被豬隊友坑死


  --'
