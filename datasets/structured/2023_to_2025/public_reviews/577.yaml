title: '[普無雷] 【鬼診所】質感良好卻迷失方向'
content: '‧


  車庫娛樂加上鬼字輩的恐怖片，一向幾乎都是踩雷保證，但【鬼診所】算是給恐怖片影迷

  們，在2025年的開局有個還算可以接受的作品。


  本片改編於X社群平台上的【牙科診所的靈異事件】，由全能藝人Baim Wong（不是網遊天

  堂那個拜恩王）首次執導，並以職權性騷擾及性侵等貫穿主題。



  ‧


  【鬼診所】整體的氛圍質感、場景美術、壓迫感，都有相當水準，前段給觀眾的試膽時刻

  ，也合乎及格標準，雖無太多創意，但憑藉氛圍與壓迫感，還是有相當恐怖感；只是前段

  的運鏡加上預告中出現詭異笑容畫面，不免覺得仿效微笑的橋段；但畢竟原始故事中，這

  邊的故事篇幅並不算長，加上這些比較容易發揮的手法，也算合情合理，整體的試膽時刻

  並不算多，且較為廉價的特效、血漿及鬼魅部分的肢體動作，看似致敬經典復古恐怖風格

  ，但有時實在令人發噱；而畫面呈現也覺得無須分級至限制級。



  ‧


  相較於原始故事後段以驅魔做故事終點，甚至加入了LGBT的元素，【鬼診所】捨棄了傳統

  驅魔做結尾的套路，而是選擇犯罪懸疑作為接續，雖然看似不落俗套，想擺脫一般鬼片的

  模板，但野心很大，卻執行稍嫌不足；不夠精細的抽絲剝繭，導致後段劇情節奏稍微拖沓

  及毫無重點的陷入劇情迴圈；而片尾片段的角色連回前段的細節也不夠深厚，只讓我聯想

  是否刻意要與原故事中的靈媒要素有關？或只是來個爆點，來揭露參與者？可能就是開放

  性的片段，讓觀眾自行腦補。



  ‧


  【鬼診所】算是部具有質感的印尼恐怖鬼片，其前段氛圍讓我期待了一下，可惜後半似乎

  走失了方向，並沒有完全把恐怖加犯罪懸疑的兩種風格好好接續上，以相同的虐殺、性侵

  的【薇娜：死後七日】來相比，薇娜的整體表現要好上太多，但做為首次執導的拜恩王，

  能夠繳出這樣的作品，還是值得讓人期待後續的作品，如果你是對於鬼片接受度高的觀眾

  ，有興趣可以進場觀看。



  -----


  「觀影的樂趣在於能獨自在那裡冥想一刻鐘」


  追蹤茶太郎IG




  --


  是的，但應該不是票房主要族群，除非是像死命必達、跳躍時空的愛戀、分期付款愛上妳

  這種粉絲向電影，才可能會吸比較多移工跟留學生



  有些表現不好的片，真的有千萬就要偷笑了，或說現在台灣票房能破千就算中等成績了'
