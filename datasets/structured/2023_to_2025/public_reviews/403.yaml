url: https://www.ptt.cc/bbs/movie/M.1559059462.A.87C.html
title: '[好雷] 萬王之王：萬中選一的你(微電影)'
content: '萬王之王，這個名字在我高中的時候曾經聽過

  跟一個宅男同學聊天，他告訴我了這個遊戲

  一個與眾不同的遊戲，一個不再只是打怪練功的線上遊戲

  當時的我很難理解這到底是什麼概念

  之後，玩了幾年線上遊戲的我

  厭倦了打怪練功模式之後

  看待遊戲的角度發生了改變

  市場主流的線上遊戲往往打怪練功、推王砍人

  耗費玩家大量的時間進行重覆性的動作

  而遊戲到最後往往外掛橫行

  最終，我不再踏入線上遊戲了

  偶爾想起，當年聽到過的萬王之王

  但一直未曾試著去瞭解

  我不知道原來他竟然是國產遊戲

  我不知道脫離了打怪練功趣味的線上遊戲

  到底是怎麼一回事

  一直追尋著真正的遊戲性

  最後原來早已與自己擦身而過卻不自知

  我只能說，當年與他失之交臂

  也許是種遺憾


  萬王之王讓我最觸動的地方在於

  當女主角煩惱所想要選的論文題目

  缺少了玩家的遊戲資料跟數據時

  男主角告訴了她

  “沒有就自己做一個嘛”

  當男女主角在討論遊戲內容時

  描述遊戲藍圖的時候

  我的身體彷彿電流經過

  而當女主角選擇屈就現況的時候

  男主角選擇推她一把幫助她向前

  在背後默默幫她

  這種單純地相信、堅持與努力

  觸動了我內心深處的柔軟的那一塊


  夢想很美麗，但現實往往是很殘酷的

  耗費無數心血建立的遊戲

  卻得面臨慘澹冷清的局面

  明明已經努力了，結果卻依舊殘酷

  經過六個月的煎熬，女主角動搖了

  當迎來了難得的機會時

  屈就於現實的女主角

  選擇了放棄

  放棄了自己的夢想

  放棄了萬中選一的那個人

  而男主角坦然地接受並選擇

  繼續為了女主角的夢想而努力

  在這一刻，女主角再也無法面對男主角

  於是倉皇地逃離了


  在女主角面試的過程中描述了心中的夢想

  「這是一款可以讓玩家擁有無限

  　那這跟其他打怪做任務的遊戲不一樣的就是

  　它可以讓玩家在一片荒涼之中

  　創造出自己的道路

  　玩家可以建立屬於自己的王國

  　也可以任命其他玩家擔任各個職務

  　在這個遊戲裡面

  　我們也加入了分散式系統

  　可以大幅的提升遊戲人數承載量

  　未來會有上千甚至上萬個玩家

  　在我們的遊戲裡面互相交流

  　其實對我們來說

  　已經不只是一個遊戲

  　我們想要創造出的是一個

  　充滿無限可能的世界」


  看到了即將成為自己未來的畫面

  舒適高冷的Office Lady

  於是，捫心自問

  「真的就沒有遺憾了嗎

  　但是我好像一直都在計算

  　哪一個選擇才是最好的」


  想起了男主角曾對她說的

  “一定要堅持這個信念

  　不能回頭

  　所以才更要挑自己喜歡的事去做

  　和喜歡的人一起”


  於是女主角終於直面內心

  做出了自己真正渴望的選擇

  『萬中選一的你

  　陪我見證生命的奇蹟

  　世上最動聽的話

  　不是''我愛你''

  　而是 我無助時候

  　你說了 ''在一起''』


  這世上什麼事最難？

  我想是......

  未見而相信最難

  堅持初衷最難


  --

  這世上有許多人，他們打一出生便知道自己是什麼人

