title: '[新聞] 信仰動畫《萬王之王》台灣票房破1500萬'
content: "信仰動畫《萬王之王》台灣票房破1500萬\n\n【大紀元2025年07月17日訊】（大紀元記者樂慧萱報導）改編自英國文豪查爾斯・狄更斯\n作品的動畫電影《萬王之王》（The\
  \ King of Kings）在韓國預售票房表現亮眼，超越《\n全知讀者視角》、《名偵探柯南：獨眼的殘像》及好萊塢大片《F1》、《超人》、《侏羅\n紀世界：重生》，榮登預售票房冠軍。\n\
  \n《萬王之王》自4月18日在台上映以來，感動數萬觀衆，口碑好評不斷，最終全台票房突\n破1,500萬元，不僅成為近十年最多人走進電影院觀賞的信仰題材電影，更寫下全新里程\n\
  碑。\n\n本片今年復活節在美國上映時也創下亮眼佳績，截至6月初，美國累積票房達6,020萬美元\n、全球票房突破6,700萬美元。\n\n《萬王之王》是韓國導演張誠浩歷時十年精心打造的動畫長片，全片結合虛擬製作技術與\n\
  強大聲優陣容，呈現史詩級視聽體驗。該片巧妙地將耶穌的生平穿插在父親與兒子的床邊\n故事中，透過一位小男孩的眼睛，看見兩千年前耶穌的神蹟。透過童稚視角理解寬恕、奇\n\
  蹟與犧牲，並見證了耶穌為眾人承擔罪業，在三日後復活的神蹟。\n\n\n\n\n\n\n\n動畫《萬王之王》劇照。（Angel Studios提供）\n\n英文配音陣容堪稱夢幻，雲集了《TENET天能》肯尼斯‧布萊納、《追殺比爾》鄔瑪‧舒\n\
  曼、「007」皮爾斯‧布洛斯南、《星際大戰系列》「路克天行者」馬克‧漢米爾、《尚\n氣與十環傳奇》奧斯卡影帝班‧金斯利、《黑豹》奧斯卡影帝佛瑞斯‧惠特克。\n\n\
  韓文配音同樣星光熠熠，請來李秉憲為「查爾斯‧狄更斯」配音、李荷妮飾演「凱薩琳‧\n狄更斯」、陳善圭則飾演「耶穌基督」。導演對於他們的表現讚不絕口，提到李秉憲，導\n\
  演表示：「在製作過程中，他開始真心對這個關於愛的普世故事產生興趣。他在父與子之\n間找到的那種俏皮節奏，令人著迷。」\n\n李荷妮的表現對導演來說是「令人驚豔」，他表示：「如果她是專職配音員，肯定會成為\n\
  頂尖級的存在。」至於選擇陳善圭配音「耶穌」一角曾讓導演猶豫不決，他笑說道：「你\n會想像他演過的所有反派角色」，但最終呈現出來的效果卻『意外地年輕且溫暖』，他認\n\
  為這要歸功於演員多年舞台劇訓練出的聲音掌控力。\n\n預告：\n\n《萬王之王》將於8月22日在中華電信MOD、Hami Video影劇館+獨家搶先播出。\n\n\
  \n\n\n--\n                 \n   \n\n\n\n--"
