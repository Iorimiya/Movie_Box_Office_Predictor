url: https://www.ptt.cc/bbs/movie/M.1745402270.A.212.html
title: '[影評] 《萬王之王》影評：孩童眼光見證神蹟'
content: '影評來源為大紀元




  《萬王之王》影評：孩童眼光見證神蹟



  動畫《萬王之王》劇照。（Angel Studios提供）



  文／曾蓮


  雷文防雷資訊頁










  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~








  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  【大紀元2025年04月19日訊】在今年復活節之際，由韓國導演張誠浩（Seong-ho Jang）

  執導、天使工作室（Angel Studios）發行的動畫版《萬王之王》（King of Kings）在美

  國和台灣上映，故事巧妙地將耶穌的生平穿插在父親與兒子的床邊故事中，透過一位小男

  孩的眼睛，看見兩千年前耶穌的神蹟，用童稚的眼睛去理解寬恕、奇蹟與犧牲，見證了耶

  穌為眾人承擔罪業，在三日後復活的神蹟。



  改編自文豪狄更斯的「傳家寶」


  《萬王之王》改編自英國大文豪狄更斯的手稿，這個手稿是狄更斯一家人的傳家寶，每一

  年聖誕節，狄更斯都會親自為孩子們朗讀這本書，直到他離世。他在去世前甚至立下遺囑

  要求：在他的孩子全部過世之前，不得公開這份手稿。1933年聖誕節前夕，當時狄更斯唯

  一在世的孩子菲爾丁爵士在遺囑中寫下「在我死後，只要家族成員一致同意，本書就可以

  出版」，終於讓這本書有了問世的機會。


  《聽狄更斯講耶穌》在1934年發行後一度成為暢銷書，1961年被導演Nicholas Ray改編成

  電影《萬王之王》，以莊嚴凝重的鏡頭語言，重塑了耶穌基督的一生。相隔一甲子，再次

  在2025年的復活節搬上大銀幕，在父親與兒子的床邊故事中回顧聖者締造的奇蹟。


  為了讓《萬王之王》的聖經世界栩栩如生，製作團隊傾注了大量心力與技術，採用最新的

  動作捕捉與虛擬攝影技術，細緻還原角色與場景的每一寸光影。製片兼攝影指導金宇亨（

  Woo-hyung Kim）透露，製作時他們先邀請演員進行肢體演出，接著以虛擬攝影機進入數

  位構建的動畫場景，一遍又一遍地重複拍攝，捕捉最佳鏡頭。聲音與表情則分開錄製，最

  終再精準疊合至動畫之上。這不同於一般的真人電影拍攝，而是一步步堆疊完成的過程，

  既講究技術，更需耐心與堅持。



  動畫《萬王之王》劇照。（Angel Studios提供）



  在風浪之上：信仰的試煉


  夜色低垂，加利利海宛如吞吐星辰的深藍絹幕，波光隱隱，卻湧動著不安的脈搏。動畫電

  影《萬王之王》在這一幕中，以光影與音樂交織，重新演繹了新約中最動人的神蹟——耶

  穌水上行走。


  狄更斯向自己的孩子娓娓道來那個風起雲湧的夜晚，耶穌的門徒需乘船渡過加利利海，登

  船之際，耶穌獨自一人上山做禱告，讓門徒乘船而去，告之自己隨後到達。夜幕降臨，暴

  雨與雷鳴如驟然甦醒的獸群，席捲門徒所乘的小舟。聆聽故事的小男孩也進入船隻，身臨

  其境感受風暴的洗禮。門徒在風暴中面對恐懼與未知之時，一個影子出現在遠方，一聲溫

  柔卻堅定的呼喚穿透風暴：「放心，是我，不要怕。」耶穌在海面行走，出現在門徒眼前

  。



  動畫《萬王之王》劇照。（Angel Studios提供）


  門徒所在的船隻仍然環繞著洶湧澎湃的海水，屹立遠方的耶穌望著眾人，信徒彼得在他殷

  切的目光下決定下船走向聖者。眼見他踏出船舷，腳觸浪面，信心與恐懼在他臉上交戰。

  他邁出步伐，一如孩童學步，當他堅信自己能走到師尊面前時，彷彿連水也俯首聽命，但

  就在他信心動搖的那刻，冰冷的海浪無情地將他吞沒。當他沉入海中，就快沉溺窒息之時

  ，耶穌已然伸出手臂，在驚濤駭浪中緊握他。耶穌輕輕道出他被海水吞沒的原因：「你猶

  豫了。」


  耶穌水上行走這個片段不是一場單純的神蹟展示，而是一段信仰的試煉與救贖的畫面。動

  畫將門徒彼得從沉沒到被神拯救的過程，描繪得栩栩如生。隨著耶穌登船，暴風驟停，海

  面重歸平靜，月光映照眾人驚魂未定的臉龐，亦照見一種前所未有的平安。



  動畫《萬王之王》劇照。（Angel Studios提供）



  重複的歷史 不滅的信念


  歷史是重複的，對信仰的考驗從來都沒有停止過，到了21世紀的今天，法輪大法在全世界

  洪傳，弟子們走的每一步又何嘗不是像在惡浪中行舟，面對鋪天蓋地的謊言和「肉體上消

  滅」的威脅，憑著對神的堅定信仰走到現在。



  動畫《萬王之王》劇照。（Angel Studios提供）


  在《萬王之王》中還有一幕，當羅馬帝國的當權者面對耶穌征服了眾多信徒的心時，絞盡

  腦汁想構陷罪名給耶穌，從而讓信徒背叛他，與當下發生的法輪功被中共迫害的事件如此

  相似，1999年7月20日，中共前獨裁者江澤民發動了對上億信仰「真、善、忍」的法輪功

  學員的殘酷迫害。也是從這天起，全世界法輪功學員開始了和平理性、艱苦漫長的全面反

  迫害歷程。（延伸閱讀：【特稿】七二零：黑暗與光的交戰）



  生命教育從孩童開始


  1961年的《萬王之王》以磅礡壯麗的戲劇鋪陳描繪耶穌的生平事蹟，而在今年推出的動畫

  影片中，選擇了一個不一樣的視角，讓孩子隨著耶穌的腳步進入歷史，耶穌化身為可以同

  行、可以學習、甚至可以被理解的榜樣。


  動畫版延續了原作的「信仰考驗」主題，但用更生活化的視角去鋪陳，耶穌的故事不再是

  高高在上的神蹟集錦，而是成為一場能啟發下一代價值觀的生命教育。當父親訴說故事，

  兒子在幻想中參與——這種敘事方式本身，就是一種對傳承與重述的致敬，也是一種讓古

  老信仰對話當代心靈的方式。不論時代如何變遷，愛、寬恕與希望，始終是最偉大的奇蹟

  。#



  動畫《萬王之王》劇照。（Angel Studios提供）


  責任編輯：李維真





  ----


  個人想法：


  在不信神、無神論橫行的時代，大人往往更需要去理解寬恕、奇蹟與犧牲，這是一部值得

  家長帶小朋友闔家觀賞的影片


  --




  ，




  --'
