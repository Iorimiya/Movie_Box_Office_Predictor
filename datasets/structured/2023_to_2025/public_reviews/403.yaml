title: '[萌無雷] 萬王之王:貓貓可愛真可愛'
content: '貓貓可愛真可愛


  萬王之王由張誠浩執導，影片靈感啟發自英國文豪查爾斯狄更斯（Charles Dickens）的短篇小說《聽狄更斯講耶

  穌》（The Life of Our Lord），描述查爾斯狄更斯和華特狄更斯踏上一場冒險之旅，這

  位作家引領著他小兒子生動的想像力，講述耶穌迷人的一生。


  本片在爛番茄獲得63%的好評，成本1500萬獲得了6600萬票房佳績，已經在某些國家上

  串流，如果對於基督教反感，也不用擔心，因為貓貓真的太可愛了，大致上算了一下

  貓貓出鏡率至少有80%，實際上擋住貓貓最多的可能是中文字幕。


  貓貓真的可愛


  --'
