  主角在路上被襲擊

  畫面一轉

  在一個倖存者很多的地方醒來

  互相擁抱 破涕而笑

  超莫名的轉場




  主角不斷吵著要吃披薩

  靠北人都死光了是哪來的披薩


  主角到底是想死還是不想死

  看起來很怕死

  貓隨便叫一聲就死了吧

  結果一個人在路上溜貓觀光





  整片最無腦的劇情一群人在路上往碼頭走

  想說只有幾十個人

  結果是幾百個人慢慢走 這種時候不是要用衝的嗎

  想當然爾當然被發現了



  不意外的主角沒死

  撿到另一個男主角

  然後一起去吃披薩





  要驚悚也夠驚悚 也不好好特寫怪物

  第一部80 第二部75 第三部0分

  近年看過最爛的電影之一

















