url: https://www.ptt.cc/bbs/movie/M.1719421284.A.AE7.html
title: '[好雷] 噤界：入侵日 算是合乎期待'
content: '儘管 這系列1>2,也是窩的感想


  這次換新導演,從預告片可以看出走不同風格,

  但是看過前兩部的話,此部觀影會自動帶入一些概念


  窩當然也會期待所謂"怪物的起源"是什麼?

  但這對我不是重點,開始看以前也沒去想..


  有影評寫道"此部如同異形二"(前面有文章)


  預告片可以看出一點:怪物變多惹


  另一點則是..


  (防雷頁)




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  真的有一隻明顯比較大隻的怪物 細心的剝開"特製罷丸(猶如《獵人》嵌合蟻那般)",

  餵一些小怪物


  算是埋個有不同種怪物的梗,不然這系列走一部算一部,要有材料給第三部拍..


  然後,法律系白男在爵士酒吧演的那段魔術小默劇,大概是前兩部被洗腦過


  那些酒杯啦 椅子啦 根本隨意擺擺,感覺隨時玩開了,下一秒不小心撞到,

  又急急忙忙開始大逃殺


  還好導演沒這樣玩XD, 而這段應該只會在首次進電影院才會慢慢看完,以後上串流根本跳過


  而黑女,在一開始掛重病上身的設定,直接就不妙惹

  也還好在最後找到了"朋友"的真義 不枉此生了


  --


  --'
