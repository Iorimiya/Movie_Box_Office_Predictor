title: '[無雷]  噤界:入侵日 特映會 Screen X新廳'
content: '第一次被神之手抽中特映票

  拿人手軟，所以也回饋一份新穎的Screen X感想

  由於有簽寫保密協議 ，所以任何影片內容 請容我無法透露，可以自己去看唷。


  很榮幸的被抽到噤界此片在夢時代

  的Screen X 新的觀影廳搶先體驗

  270? 沉浸式視野的多投影技術

  可以把主螢幕畫面

  擴展到劇院的牆壁上

  算是高雄第一批先體驗這新穎觀影效果

  真要說的話 如想在這Screen X體驗務必選中間然後選後排一點這樣的投射視野效果看起

  來比較好看


  因為我是被自動劃位

  位置在前幾排又靠兩側

  所以270的效果看起來有限

  而且啊左右兩邊的投射畫質好像

  不是那麼清晰，霧霧的

  但總言之 音響不錯 電影不錯


  以上為個人觀感  還需大家自行體驗


  下次有安排好片一定再回鍋Screen X廳

  座中間後排位置





  --'
