url: https://www.ptt.cc/bbs/movie/M.1719455517.A.F84.html
title: 'Re: [大負雷] 噤界3：入侵日 史上最難看沒有之一'
content: '我不覺得是工讀生在洗

  因為真的沒意義


  運鏡也是我喜歡的地方

  尤其用「貓」的引導來運鏡

  對於貓奴的我

  是看這部電影最大的喜悅


  因為除了配樂、貓

  這部電影真的毫無記憶點

  連嚇人都沒有= =








  看的懂不懂

  好不好看

  真的是個人感受


  我原本期待是針對起源

  會有人類抵抗的過程

  可惜幾乎可說「完全沒有」


  再來就是噤界營造的氛圍

  第一集很有感

  第二集我已經忘了XD


  第三集也就是前傳

  剛看完不會忘

  但真的完全沒有任何噤界的氛圍


  這點是讓我最失望的地方


  故事要走小人物甚至是貓角度

  我可以

  要走小品格局甚至不知所云

  我能理解


  但一樣要拍的很噤界啊！

  搞的完全沒有緊張感？


  要溫馨又不夠暖

  要感人又很難共鳴

  我已經不在乎劇情了

  結果給我看這個半調子？


  片名改成「盡界」

  -生命盡頭的世界

  或許會比較好一點


  #每個人都有選擇的喜好

  #僅以此能救一個是一個


  --




  有需要的人就用的到。

  我英文不好，不過，第一天跟起源有什麼衝突嗎？預告片的說法是「探究為何世界開始全面

  噤聲」。'
