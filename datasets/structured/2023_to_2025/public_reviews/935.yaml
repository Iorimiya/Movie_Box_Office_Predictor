content: '購票資訊：



  ———劇透注意———




  因噤界系列有看當然不會錯過源起, 另外就有佛萊肯可以看, 而且超乖除前期木偶劇院不

  慎撥到鈴鐺引怪嚇了小弟一身冷汗(怕貓領便當)


  預告部分：

  誠實, 大概前60分鐘演完所有剪輯, 但以為女主與法律男逃到商場是尾端.


  電影部分：

  總覺得少了很多令人屏息的片段, 前一兩集任何聲音都很致命, 而且在電影院的空間那時

  觀眾都很安靜, 但這部幾個要安靜橋段似乎都不那麼使人要暫停停止呼吸.


  1. 木偶劇院找跑掉的佛萊肯

  2. 劇院發動機意外啟動

  3. 噴泉遇兄妹隨後躲到樓梯間

  4. 女主與法律男走漆黑地鐵

  5. 法律男幫女主去找藥


  以上是三個小弟覺得有需要保持安靜的橋段, 其它利用環境音量保護的不提.


  雖然沒有清楚交代外星人來自哪裡, 就是演到從天而降, 這樣就知道演變到1與2了, 愛蜜

  莉第一集那個踩到釘子那個現在想起來演的太棒惹.


  然後佛萊肯真的很可愛, 小弟愛極了!

  露琵塔演技很好然後才想到是黑豹女友, 人家來演又不是像黑人魚一樣靠關係然後硬要演

  一個與童話不符的形象.


  小弟也看了幾個影評, 電影除災難特效之外其實也是在問我們, 如果像女主一樣在世紀末

  日來臨時最後想做的事情是什麼, 一時之間小弟還真想不到.XD


  以上～


  --'
