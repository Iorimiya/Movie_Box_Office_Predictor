title: '[大負雷] 噤界：入侵日'
content: '劇情有夠單線

  從城市到港口撤離

  支線任務：吃披薩



  有夠不緊張氣氛

  那隻貓要負很大責任

  不是說那隻貓本身

  是劇本設定本身

  為何硬要加一個讓緊張度下降的元素

  本片主旨根本導演要曬貓吧



  貓的下場不就安然無事

  或直接被吃掉被踩死或沒事活到最後

  貓貓整場趴趴走都沒事

  又變得更不刺激恐怖



  莫名其妙路人男主角

  男主角都知道要撤離了

  硬要強制跟人家組隊

  還一直跟著女主角要陪她去吃pizza

  女主角os應該也是 又一個神經病



  女主角的設定也是問題

  自身都可以隨意赴死了

  也沒牽沒掛

  給觀眾的感覺就是

  死了也沒差



  怪物的設定

  不會游泳就算

  但靈敏程度

  手長腳長

  不至於淹死吧

  頂多行動緩慢





  建議不要上電影院看(也下檔了)

  串流建議不要浪費時間


  --'
