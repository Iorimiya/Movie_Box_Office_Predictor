url: https://www.ptt.cc/bbs/movie/M.1719397792.A.7A6.html
title: '[無雷] 噤界：入侵日'
content: '噤界：入侵日

  1.這部片沒有主角威能，就是一部怪獸災難片裡面的一段小品故事。

  2.電影的主軸集中在女主角的一個念頭，那個念頭也許你會覺得很荒謬，可是人在絕望又無能為力的狀態中，確實會朝著自己記憶中熟悉的味道、回憶前進。

  3.就好比你在黑暗中看到一道光，儘管只是微弱的燈光，你還是會朝著那一道燈光前進，因為光線是你我熟悉的記憶。

  4.沒有看過噤界一二集也沒關係，整部片只有怪獸設定和一二集有關係，你可以把這一部片當作一個全新的災難怪獸小品。

  5.電影中關於怪獸的部分埋了一些小伏筆沒有解釋，應該是為了噤界第四集做準備。只是，還會有第四集嗎？

  （票房很有可能不太樂觀）

  6.當你不知道要看什麼電影？又想要看怪獸，而且你又喜歡貓咪，那你可以去看看這部電影。（但是不要期待有什麼刺激、懸疑、打怪威能的情節出現）

  P S：這隻貓是哪裡來的？這麼戶外的貓，我也想要養一隻。

  -----

  Sent from JPTT on my iPhone


  --


  --'
