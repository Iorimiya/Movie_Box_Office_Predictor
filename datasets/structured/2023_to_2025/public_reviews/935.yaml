url: https://www.ptt.cc/bbs/movie/M.1719373869.A.033.html
title: '[大負雷] 噤界3：入侵日 史上最難看沒有之一'
content: '（已經有工讀生準備開洗了 能救一個是一個 大家自己斟酌）


  衝早上第一場

  勸要看的人不如二刷inside out 2


  整部片從頭到尾

  都是超大聲的jump scare

  該營造壓迫氛圍的地方完全沒有

  然後一堆反智邏輯的行為


  正片女主就是一個癌末女

  快死了

  死之前一定要去布魯克林

  吃到他老爸在世時常帶她去吃的Pizza


  外星人入侵沒交代原因

  就是突然警報響起

  流星雨下來

  怪物出現開殺

  然後全部都是白霧根本看不清楚怪物

  一片混亂～～～～～


  都這番光景了

  女主還是堅持一定要徒步去吃到Pizza再死

  移動過程遇到男主角

  男主角為什麼會跟著女主？？？？？

  原因就是在躲起來時看到女主的貓貓

  然後貓貓帶男主去找女主

  雖然知道避難船在南方

  但男主騎士心爆棚

  不去避難

  堅持要帶女主去吃Pizza（三小哈哈？？？）


  中間就是一連串救貓互救jump scare

  就這樣

  沒有了

  最後男主抱著貓貓跳海上船

  成功逃出

  女主到故鄉路中央

  拔掉耳機播音樂自殺


  大敗筆就是

  本片原本可以描述人類在入侵日是怎麼輸掉戰爭的

  結果沒有

  導演還是以小人物要完成自己心願

  微觀陳述這部電影


  不是說心願不重要

