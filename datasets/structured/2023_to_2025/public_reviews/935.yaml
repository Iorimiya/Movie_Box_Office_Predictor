url: https://www.ptt.cc/bbs/movie/M.1719326743.A.876.html
title: '[新聞] 噤界:入侵日首映好評 外媒讚:有如"異形2"'
content: '新聞網址：


  原標題:


  2024-06-24 11:20

  聯合報 記者陳建嘉／即時報導



  ，前傳電影「噤界 : 入侵日」則在近期推出，

  原導演約翰卡拉辛斯基退居監製，改由「豬殺令」麥可薩諾斯基執導，該片日前在紐約舉

  辦試片，爆出驚人大好評，「Comicbook.com」的Brandon Davis盛讚電影非常棒，「雖然

  沒有像我所希望的一樣有許多末日大屠殺的場面，但所講述的故事非常恐怖，而且美麗」

  ，除了稱讚主角露琵塔妮詠歐、約瑟夫昆恩之外，更開心表示「貓是本片的大明星」。



  「Cinema Blend」的Jake Hamilton同樣喜歡該片，「主題上來說，前兩集如果偏向『異

  形』，有許多微小而安靜的恐怖時刻，那麼『噤界 : 入侵日』就是『異形2』，有很多大

  規模且可怕的怪物屠殺，露琵塔更給予她的角色令人心碎的重量，最後一顆鏡頭會讓你心

  碎」。獨立網路創作者Gig Patta則表示電影雖然沒那麼可怕，但是格局更大，「貓很搶

  鏡，每次出現都會讓人屏住呼吸」，更笑說雖然兩位主角表現優異，但他所有的注意力都

  集中在貓的身上。另一位網路創作者Rachel Leishman則給出更高的好評，更說是全系列

  當中最好的一集，「電影講述所有希望都破滅時，絕望是如何存在，然後要如何將這種絕

  望轉化為彼此之間的深厚聯繫，約瑟夫昆恩，你真的是電影明星，露琵塔妮詠歐也不愧她

  拿下奧斯卡獎的名聲」。




  ，電影敘述露琵塔妮詠歐扮演到紐

  約一日遊，卻不幸碰上怪物入侵的女子，在陌生的環境還要設法求生，甚至必須與陌生人

  一同合作，雖然沒有像前兩集一家人那樣的堅固感情，變得更易受到外在威脅各個擊破，

  也讓他們的處境更加凶險，扣人心弦。「噤界 : 入侵日」將於本月26日上映。



  --'
