url: https://www.ptt.cc/bbs/movie/M.1720372405.A.125.html
title: '[負雷]噤界:入侵日 覺得劇組太小看人類了'
content: "如果看過噤界1, 然後因為好奇外星人到底怎麼入侵\n而來看這片的話, 非常不推.\n過程沒講清楚, 氣氛營造也不如第一集\n如果沒看過之前的系列,\
  \ 這部也可以跳過, 太多不合理的橋段\n以下有雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文\
  \ 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n看第一集的時候覺得設定很有趣~ 也很好奇人類到底是怎麼被逼到這種境地\n\
  \n本來以為 入侵日 會有更多外星人的設定(譬如 母艦啊, 會飛的種類阿,超大外星人等等)\n\n結果都沒有!!!!\n\n如果按照入侵日的設定~ 人類會被打趴,\
  \ 那劇組太小看恐怖直立猿了吧!!\n\n除了只能靠聲音外, 外星人還怕水\n\n老天 用個收音機 加個水坑做陷阱 就能殺死一堆外星人了好嗎\n\n連炸彈都不用\n\
  \n更遑論外星人也不會飛, 在現代空軍 + 海軍的火力下應該是輕鬆解決的\n\n最慘也就派步兵 用爆炸十字弓 地雷等手段都能輕鬆對付\n\n而且雖說外星人單靠聽力,\
  \ 但我覺得他們聽力也沒很強阿\n\n貓頭鷹連老鼠走路的聲音都聽的到. 人類走路呼吸那麼大聲 他們還抓不到\n\n個人覺得如果要靠聽力生存, 至少要連心跳都聽得到才行吧\n\
  \ (雖然第一集也是這樣 但還能容忍, 第二集太多橋段讓人覺得外星人聽力很差)\n\n總之 聲音炸彈陷阱這個概念在我腦中一直揮之不去 劇組又沒有把他圓過來\n\n\
  --"
