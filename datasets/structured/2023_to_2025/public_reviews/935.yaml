url: https://www.ptt.cc/bbs/movie/M.1719377316.A.FAD.html
title: '[普好無雷] 《噤界：入侵日》觀影前須知'
content: '噤界這系列一直都不能當作很純粹的怪獸或驚悚片來看待

  從第一集開始就是在描述小人物的大故事

  雖然第二集結尾有點落漆

  但整體也還是不錯啦


  這次的故事其實更是漂亮

  不過也因為太過漂亮

  所以反而是缺陷


  這也是我向下給到普好而已的原因


  女主角是一個癌末患者

  知道這樣就夠了

  整體故事圍繞在一個疑似末日的情況中

  她想一圓自己的小夢想

  身體的末日×世界的末日

  雙重的終末之下，身為一個人會想要怎麼做？

  要嘛自暴自棄妄自菲薄

  要嘛追尋人生最後夢想


  女主角選擇了最後一次的夢想

  只因為從久住的養護中心回到了家鄉

  重新回溫起家鄉的一切

  那些童年還有小時候的回憶

  成了她最後在這個時期所追求的目標


  入侵日的故事就圍繞在這上面

  想必很多人會不喜歡這樣的故事吧

  所以這篇是觀影前須知也說不定？

  (我原本副標不是這樣下的)


  整體而言jump scare算很少

  一點都不恐怖

  但我看噤界本來就不是追求什麼恐怖或驚悚

  所以對我來說

  這片放在普好雷應該算是個人很恰當的評分吧


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
