url: https://www.ptt.cc/bbs/movie/M.1719748845.A.4B9.html
title: '[無雷心得] 噤界：入侵日 影評'
content: '這部片因為主打無聲又時常是女主角藏身於平靜的躲藏處，加上貓咪從頭到尾都異常安靜

  的連

  一聲喵都不會叫，導致怪物撲殺人類畫面極少。


  劇情部分淺顯易懂，而男女主角兩人的溫情對手戲幾乎佔了電影一半的時間，也反應出怪

  物只不

  過就是用來襯托他們倆一起共患難的附屬品而已。


  這部無論是在人物或是劇情方面，和前兩集的連貫性極低，所以基本上直接看這集是不會

  有任何無法理解的部分，可以當成一部外傳來看！


  =====================================

  ▲以《電影院》觀影感受作爲評價標準▲

  ▲以《喜愛正宗鬼片》作爲評價標準▲

  ▲以《整體分數》作為本片評分標準▲


  ●極品→整體分數90以上

  大量或適量高潮，走出影廳，一陣空虛感襲來沉侵其中無法自拔，擁有3天以上好心

  情。


  ●優質→整體分數80以上

  適量或少量高潮，走出影廳，仍意猶未盡，擁有1至3天好心情。


  ●不錯→整體分數70以上

  少量或微量高潮，走出影廳，部分殘影徘徊腦中，擁有1至3天好心情或維持一般心情

  。


  ●普通→整體分數60以上

  微量或毫無高潮，走出影廳，毫無回味之處，維持一般心情或心情稍顯沈

  悶。


  ●很雷→整體分數50以上

  毫無高潮或品質不佳，走出影廳，不堪回首並充滿負能量，心情稍顯沈悶或心情糟透

  1至3天。


  ●荒謬→整體分數50以下

  品質不佳或失敗之作，走出影廳，一切化為污且毀三觀，堪稱黑歷史，心情糟透3天

  以上。


  =====================================


  ★恐佈：40分（未達標/不合格）

  ★音效：80分（經常透過音效嚇人）

  ★特效：80分（場面+怪物逼真但畫面偏少）

  ★顏值：55分（不及格）

  ★劇情完整度：40分（故事內容薄弱）

  ★戲劇張力/精彩度：40分（高潮畫面極少）


  ◤噤界：入侵日◢ 整體分數：55分

  ◤噤界：入侵日◢ 4DX整體分數：58分





  （體驗4DX爆米花不要買可能會灑出來、椅子搖的時候飲料不要喝、下雨的時候水很冰眼

  鏡會被噴濕 但還蠻好玩的就是了）


  【總結】 劇情平淡無奇、無驚奇轉折！想說體驗看看4DX助興，但是不誇張、我朋友看到

  中間還可以睡著一下，至於我看到2/3也開始坐立難安，但倒覺得還稱不上B級片，畢

  竟畫面和怪物真實度很高無法找出看起來覺得是CGI的破綻，所以還算有入戲！


  感覺是導演刻意不想走前兩集虐殺路線

  06/30 23:41

  我想說能不能靠4DX給點力 結果並沒有哈哈 等看龍捲風暴了感覺會整場都是風XD

  可是我的評價也不怎麼好餒QQ

  我是指男女主角的部分XD雖然我比較喜歡狗 但是貓的確也滿可愛的'
