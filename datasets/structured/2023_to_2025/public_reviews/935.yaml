url: https://www.ptt.cc/bbs/movie/M.1719971263.A.3A0.html
title: 'Re: [討論] [雷] 噤界《入侵日》 不合邏輯的地方'
content: ":\n:\n:\n:\n:\n:\n:\n多防一點\n\n\n\n\n\n:\n:\n:\n:\n:\n補幾個個人覺得不邏輯的點\n1.發電機\
  \ 第一反應應該是要逃離有聲音的地方吧 去關不是找死嗎(也確實死了)\n\n2.美軍也太智障,都知道怪物對聲音有反應 為啥還飛在要在城市上面繞\n  風箏怪的話也可以理解\
  \ 但風箏一定量以後就集中拖去陷阱還轟炸就好了吧\n\n3.承上,都知道有民眾開始上街往南避難了,就不能把怪物往北引嗎?\n\n4.一群路人走在路上...要是我會盡量跟人群分離\n\
  \  (誰知道旁邊的人會不會不小心發出聲音)\n\n5.突然被嚇到/攻擊到發出點聲音或尖叫就算了\n  站路中央喊人名不是擺明找死(也確實死了)\n\n6.最後船都出發了還要鳴笛叫囂是怎樣(讓怪物圍觀?)\n\
  \  如果怪跳上來怎辦...(先不論怕水,那個距離劇中人怎麼能肯定怪跳不到)\n  還是提醒還在岸上的旅客 船已經開囉~下次請早~\n\n7.每當有船靠近南邊,就派直升機去北邊吸怪很難想到嗎...?\n\
  \n8.女主超強,一個人風箏怪這麼久都不死\n  話說為啥不隨身帶兩顆石頭,每次不小心發出聲音 就往遠處丟一顆再等風頭過再走就好\n  怪物只能聽不能看真的是滿好操控的=\
  \ =\n\n-----\n\n9.忘了是1還是2 生孩子那集,為什麼不住水邊生就好(至少住到生完)\n  天然白噪音這麼好用...\n\n\n氣氛烘托個人覺得是很到位啦(除了廉價jump\
  \ scare以外)\n但有時候真的會出戲= =\n\n\n劇中的確有說那隻是\"安慰貓\"(也就是專門訓練來陪伴癌末病患的?\n所以被訓練到安靜不吵鬧(病患跟旁人)應該算合理?)\n\
  反而這點我個人還能接受XD\n\n--"
