url: https://www.ptt.cc/bbs/movie/M.1719379319.A.9C0.html
title: 'Re: [大負雷] 噤界3：入侵日 史上最難看沒有之一'
content: '幫影片平反一下，其實配樂不錯，

  貓咪演出不錯，雖然沒驚悚、沒劇

  情、也沒啥邏輯，但影片用不到一

  半的時間告訴你：


  「這片就這樣了。」


  於是，開始釋懷，想上廁所的也不

  用憋了，喝飲料、吃東西也不用小

  心翼翼，反而開始欣賞影片的細微

  處。


  才發現，身為貓奴的我，開始把貓

  咪當主角，用他的角度看影片，想

  著我家的主子，會不會也能同樣的

  演出？


  整個心情瞬間喜悅，時間也就飛快

  地過去，電影就結束了。


  現在在餐館吃午餐，連帶的，午餐

  也美味許多。


  這就是這部電影給我的感受。


  --



  我還沒去看第二集XD

  什麼品種不曉得，就是賓士貓，看起來是公貓，真的有～夠～萌！可能是米克斯吧，我猜的

  。以下是我家主子^_^



  當時沒看首映，後來就被評論勸退，我一直還沒看驚奇隊長2。這次衝太快XDD

  我覺得正太比較萌XD


  他還沒斷奶就被棄養在寵物店門口，有陰影，大概前主人有虐待。所以他雖然很肥，但是非

  常膽小+玻璃心，完全不

  可能帶出門，他最多就跑去陽台偷咬我的盆栽。下面是公司養的浪浪，就可以帶出門，有打

  算帶他去海邊玩^_^'
