content: '自己發的文自己回

  忘記提醒大家一個很重要的事情

  那就是

  這部電影就算你覺得難看

  整部電影你也不可能睡著


  因為裡面的Jump scare不少

  而且都不是用氣氛烘托的

  都是用超級大聲的音效

  （大聲到電影院地板會震一下的程度）

  加上一群外星人跑來跑去

  或直接從頭上跳到地板上的方式呈現


  我看完整片

  最賭爛的點就是這個

  電影難看就算了

  還不讓人睡著

  真的是很沒良心


  另外要說運鏡或音樂的

  拜託不要再來這篇洗了

  你們覺得運鏡音樂很高級OK沒問題

  但這片我就是你們嘴中的看不懂

  不好意思

  我只把它當失敗的爽片看而已

  大概是這樣


  重複一次重點

  就算你看到很累還是睡不著

  大家小心一點

  我已經能救一個是一個了


  --'
