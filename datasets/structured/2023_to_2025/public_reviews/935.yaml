title: '[新聞] 《噤界：入侵日》刷新系列開片猛奪北美'
content: '《噤界：入侵日》刷新系列開片猛奪北美新片冠軍！全球票房破32億


  2024/07/01 07:28


  〔記者許世穎／綜合報導〕


  電影《噤界》系列新作《噤界：入侵日》上週末（6月28~30日）於北美上映，首週末3天

  不負眾望，粗估以5300萬美金（約台幣17.23億元）拿下新片冠軍，更創下系列最佳開片

  成績，領先包括2018年《噤界》的5020萬美金（約台幣16.32億元），和2021年疫情復工

  初期《噤界II》的4754萬美金（約台幣15.46億元）。


  《噤界：入侵日》於北美上映，創下系列最佳開片成績。（UIP提供）


  《噤界：入侵日》從週四（6月27日）優先場就以680萬美金（約台幣2.21億元）刷新系列

  於北美的最佳優先場成績。


  首週末更在《腦筋急轉彎2》持續熱賣之下殺出一條血路、取得不俗表現，整個電影市場

  更創下繼去年7月掀起「芭比海默」（或譯芭本海默）效應的《Barbie芭比》和《奧本海

  默》以來，北美首度同時有兩部電影在週末取得超過5000萬美金票房收入。


  目前電影全球票房約為9850萬美金（約台幣32.03億元），台灣方面於上週三（6月26日）

  搶先全美在台上映，粗估5天全台票房突破台幣2700萬元。


  《噤界：入侵日》全台持續上映中。


  新聞網址：





  --'
