url: https://www.ptt.cc/bbs/movie/M.1721667663.A.359.html
title: '[好雷] 噤界3:入侵日'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~












  給沒看過噤界前兩集的人的心得


  我個人覺得這是一集可以獨立分開來看

  而且更好看的一集


  其實剛開始看的時候

  我已經有點忘了噤界前兩集了


  隨著劇本演變

  女主角的堅持

  男主角的出現


  又後段到了女主前往pizza店的理由揭曉

  我開始覺得這集是部更好看的一部戲









  我原本以為貓咪是個不定時炸彈


  帶著貓咪前往赴死之地的女主角也是個傻子


  而男主角莫名其妙地出現

  有點讓觀眾摸不著頭緒的存在


  劇本慢慢前進

  才知道女主角是為了與死去的父親更接近

  而前往那個沒人要去的地方


  男主角則是因為女主角的貓

  有了種活下去的感覺


  兩個人彼此磨合

  慢慢地互相依靠







  這是一部很美的電影

  如何在一個不能發出聲音的世界生存?


  you can play your own eardrum in your heart


  你可以在心中演奏出你想要的鋼琴曲

  就在於自己如何看待這個世界


  如果能在一生中，找到自己的歸屬之地

  就如女主角最後放著自己喜歡的歌曲


  那外面的世界如何醜陋，也無法影響到你











  這不是一部完美的劇本

  噤界這個設定本身就有許多漏洞


  例如雨聲可以蓋過一些聲音

  人類的愚蠢會導致哪些狀況的發生

  (例如一大堆人群一起前往同一個地方...)


  還有無聲的時空背景下，

  導演要如何讓觀眾不會看到睡著等等狀況..


  設定以外 瑕不掩瑜

  我個人覺得這還是一部很不錯的電影

  只是去看現場的人，請不要帶著看爽片的心情就是了


  推薦一下


  --





  --'
