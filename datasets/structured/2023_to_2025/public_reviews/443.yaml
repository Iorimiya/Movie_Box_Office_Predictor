title: '[新聞] 重裝制裁台美票房奪冠！導演鬆口續集'
content: '新聞網址：


  傑森史塔森《重裝制裁》台美票房奪冠！導演鬆口續集計畫


  Yahoo奇摩新聞（記者 許瑞麟）

  2025年4月1日


  由傑森史塔森（Jason Statham）主演、《蜂刑者》導演大衛艾亞（David Ayer）執導的

  動作片《重裝制裁》上周上映，全台首周票房突破新台幣1200萬，北美票房也來到1521萬

  美元（約新台幣5億元），在台美皆奪下周末票房冠軍。


  對於是否有意願拍攝續集？從未執導過續集電影的大衛艾亞表示：「當然，無庸置疑，查

  克寫了12本小說。這真的是個很有趣的角色，我覺得我們和傑森攜手破解了將查克的小說

  『宇宙化』的密碼。故事中肯定還有一些尚未解決的事情，非常適合拍續集，所以我肯定

  可以想見自己回歸執導， 我非常喜歡這個角色。」


  除了傑森史塔森，美國女星亞麗安娜里瓦斯（Arianna Rivas）在片中飾演遭人口販子綁

  架的大學生「珍妮」，但該角色並非默默等待救援，反而主動跟綁匪斡旋，最後甚至跟傑

  森史塔森並肩作戰。談到準備角色的過程，她表示在劇本讀到珍妮是空手道黑帶之後，就

  立刻尋求空手道黑帶的朋友協助，「他開始教我怎麼像空手道運動員那樣移動，怎麼像空

  手道運動員那樣思考。不僅要建立起戰士般的心態，還要每天進行肢體訓練、吃正確的食

  物。」


  其實演員們曾在倫敦接受為期一個月的特技訓練，亞麗安娜里瓦斯表示，傑森當時就在她

  旁邊接受特技訓練，「中間有用瓦楞紙箱堆成的牆隔開，所以我有時候會跑到瓦楞紙箱旁

  偷看他在做什麼，看看他怎麼揮拳，透過觀察他我學到很多東西，不論是在片場還是接受

  訓練的時候。」


  心得

  最後XXX的努吼

  導演聽到了!...


  --'
