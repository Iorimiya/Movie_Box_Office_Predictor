title: '[負雷] 重裝制裁 蜂刑者好看多了 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


















  和蜂刑者差不多套路

  受傷很深的高手為了朋友而出頭


  中間有點即刻救援

  但就是有點

  拖泥帶水，一點驚奇都沒有


  按照主角的做法，要不是女主自己會抵抗，兩人組低能到極致

  大概又是PTSD再加一筆


  都抓到黑手黨高層了

  然後拷問不出來

  當他真的嘴超硬，超級硬漢好了


  那都見到伊文了，還回去酒吧蹲點幹嘛

  我真的看不懂

  出門回頭反殺不是比較快嗎



  反派當然是拿來襯托主角的

  可以大意，可以蠢，但不能蠢到讓人覺得殺他也沒什麼


  毒蛇二人組到底在幹嘛

  從頭到尾就是Fuck Fuck Fuck Fuck 克勞薩大人嗎

  荒腔走板到殺他們一點爽感也沒有


  然後黑手黨號稱惹到他們殺三代

  結果說停止追殺就停止

  蛤??


  前面到外公家也沒直接殺死，甚至連虐待外公都沒有

  人很好欸


  鋪陳最強黑手黨出手

  結果只有兩個打手?


  最後主角把槍放在賭桌上，也是不懂這耍帥的帥點在哪





  打鬥的光線讓人很難看清楚動作




  --


  電影。劍雨(誤)'
