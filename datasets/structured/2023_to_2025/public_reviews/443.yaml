url: https://www.ptt.cc/bbs/movie/M.1743342545.A.F07.html
title: '[超負雷] 重裝制裁 看到懷疑這是搞笑片嗎？'
content: '防雷

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  沒有期待會好看，只是因為年邁的老爸喜歡看這種打鬥槍戰爽片，所以陪他去看，順便看

  到底有多爛。


  一開始工地的打鬥就有點問號了，啥都沒說就開幹，打完工地老闆也沒過問？主角也沒過

  問？被打的也沒解釋？


  後來女兒被綁架，只是因為長得像黑道家一幅畫裡的女人？主角婉拒了老闆夫婦的委託，

  把錢退回，說他已經改變了，然後自己就開始著手營救？


  找老同事搞裝備，開始往上找線索，對方黑幫是會殺你全家三代的狠角色，你連寶貝女兒

  去上學都不擔心？結果外公家被燒了，結果外公也沒怎樣就被救出來……..還跟他說謝謝

  ……..


  裡面一堆對白都很尬又不自然，很想笑，中間忙了半天假裝買毒，又一直倒掉，假警察也

  是很鬧，永遠出現的很即時，黑女警很好笑….


  最後決戰也是超級一面倒，槍戰基本都是站著對轟，演都不演了，然後騎車衝進去的壞人

  繞兩圈就死了，黑人老大也是瞬秒，我真的懷疑這到底是不是搞笑片…


  最後拿骷髏拐杖的一直站在外面，打完電話被嗆之後，怒吼結束，真的太好笑了，真沒想

  到這部能難看到這種程度。


  問我爸如何？他說還不錯，就是有點假，哈哈哈哈沒關係有被娛樂到就好


  好久沒去信義威秀看電影，座椅有更新比之前好多了，2樓火影拉麵店也變成一人燒肉，

  生意挺好，不然之前那邊開啥倒啥。


  --'
