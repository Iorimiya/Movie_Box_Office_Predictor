url: https://www.ptt.cc/bbs/movie/M.1743211715.A.4E5.html
title: '[負微雷] '
content: "重裝制裁：\n1.首先，這部片的編劇是導演跟［席維斯史特龍］共同編劇。（看到席維斯史特龍就知道不妙了）\n2.整部片非常90年代動作片的劇情、步調，配樂都非常90年代。（終極警探、十萬火急、空中監獄…這一類的動作片配樂）\n\
  3.整部片有許多時間是傑森史坦森滲透黑幫組織，然後慢慢找出幕後主使者是誰，簡單來說就是［拖泥帶水］。\n4.我們要看的傑森史坦森就是直接打爆壞人，然後折磨壞人說出其他的共犯在哪裡，而不是慢慢滲透組織找出壞人是誰。\n\
  5.另外，傑森史坦森整部片使用拳腳功夫打壞人大概只有三分之一，剩下三分之二都是拿槍。\n6.要看拿槍，我看基努李維的捍衛任務就好了。要看傑森史坦森，當然是看他的拳腳打爆壞人啊。\n\
  7.這部片就很90年代的劇情氛圍，席維斯史特龍可以不要再出來亂寫劇本了、好嗎。\n-----\nSent from JPTT on my iPhone\n\n\
  --\n     女生走路要慢慢走 搖曳生姿\n\n                       那遇到趕火車怎麼辦\n\n                 \
  \                  本事大的女生 火車都會等他\n\n\n--"
