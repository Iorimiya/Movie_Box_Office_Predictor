url: https://www.ptt.cc/bbs/movie/M.1744031654.A.0D9.html
title: '[極好雷] 重裝制裁（2025）'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  觀影證明：



  前言：

  不愧是傑神哥，神級好看！沒意識到傑森哥年紀也不小了以他的身手實在看不出實際年紀

  。


  簡述：

  傑森哥的公司老闆女兒被擄因一句我答應保護你展開救援行動，100分鐘的電影從前準備

  ，蒐證到直搗毒窟俐落的斬殺壞蛋看了真的大爽快；珍妮第一次脫逃身手嚇一跳(但想到

  她鋪了爺爺也是傘兵傳授戰鬥技巧)就很合理惹！傑森哥女兒也是袖珍可愛，透露喜歡爸

  爸的真情完全不像演電影、一幕傑森穿西裝找長髮軟爛男突然想到玩命快遞(2002)真D太

  適合他了，非常覺得祝福的劇中該死的角色都死得很慘，處決方式看了真的腎上激素分泌

  深怕壞蛋沒死，惟片尾骷髏拐杖老男沒死有點小遺憾；另有個疑問關於魔鬼已完成他的任

  務一句，意指已經不關他們的事了嗎？


  心得：

  現實雖不可能存在這種英雄，但電影也為我們普通小老百(沒錢沒勢)帶來小小的快樂；小

  弟7年級，有這些黃金好萊塢的演員可以陪著真好，他們也代表了我們這個世代，有他們

  真好T_T


  以上。


  --

  啊、可這部沒傑哥不考慮惹～'
