url: https://www.ptt.cc/bbs/movie/M.1743170877.A.4CB.html
title: '[普雷] 重裝制裁 麻煩不要再試圖做些什麼了'
content: '可能是上一部蜂刑者

  導演證明他知道觀眾要看什麼


  所以這一部換成

  他試圖想要讓傑森哥證明什麼


  但是 拜託 拜託

  劇情這種東西

  在傑森哥的電影裡就是有就好

  沒有也不會怎樣


  觀眾就是想看傑森 打 打 打

  打就對了 別管別人說什麼 一直開無雙很難看

  幹 會買票的就是想看他開無雙 不然勒


  像蜂刑者

  能夠讓劇情切合主題 還一氣呵成

  大致沒有邏輯問題的讓它演完 也收住了

  我覺得已經很了不起了


  但這部 再強調一次

  導演就好像是真的想證明什麼

  恩人的家庭 自己的家庭戲 死去妻子的背景

  與盲人朋友的惺惺相惜

  與岳父的矛盾 恩人女的心理狀態

  反派的家庭戲 其實等等等


  都鋪的很淺

  而且都非常不必要 根本沒人在乎


  的確有像是別於其他電影的有趣地方

  可能為了沾點女力 恩人女的瘋婆戰鬥力

  女兒的早熟臺詞其實都讓我覺得不錯


  但很多諸如 恩人女彈鋼琴 傑森哥被打暈

  俄羅斯黑手黨介入 岳父家起火

  加了反而比不加難看

  造成失焦扣分 越多越錯


  但真正最大的缺點 還是不夠爽

  不只是武打戲減少 後面都拿槍射

  前面講究相對真實 慢慢追緝也罷


  後面找到老窟之後

  每個反派都是雜魚 連挑戰性都沒

  基本一路平推 這點很不ok

  連看起來稍微有趣的俄羅斯反派

  也是三兩下就放倒 bad


  總體來說 傑森哥基本盤還是有

  但在爽度方面 蜂刑者開頭燒公司那段

  就屌打整部不知道在忙什麼的做工人了


  只能說 期待蜂刑者2


  -----

  Sent from JPTT on my Samsung SM-S9010.


  --'
