url: https://www.ptt.cc/bbs/movie/M.1743160450.A.144.html
title: '[好雷] 重裝制裁'
content: '本來打算來看木村新戲

  但轉個念就來看比較抒壓的傑森新作品















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  之前滿常看傑森作品 前一部應該是峰刑者


  這次換了個身份變成一個工頭 但內容還是差不多

  主線大概就是老闆的女兒被綁 要他幫救出來

  一開始他們談那我以為他要拒絕他老闆  (女兒監護權關係)

  後來不知怎的就接下這份頭路 後來工地也沒去了


  之後就一路找線索打爆壞蛋

  真的是蕃茄醬都沒少 這種限制級我很可以

  槍林彈雨下也沒看咱們主角有中彈

  尤其騎機車逃跑那段 果然主角威能


  本來以為片尾那個黑幫老頭要出手了 (以為重裝任務第一集黑幫老爸)

  結果被他的brother講了幾句就叫了幾聲結束 (蛤)


  老闆女兒被綁只是因為長得正 不是有什麼深仇大恨


  主角跟他老闆就過著幸福快樂的日子了

  果然是無腦爽片


  --'
