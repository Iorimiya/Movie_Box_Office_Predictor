url: https://www.ptt.cc/bbs/movie/M.1743267211.A.826.html
title: '[好雷] 《重裝制裁》導演一定有玩GTA'
content: '先說標題，本來想給[微好雷] 但因為有刮刮樂有中獎所以改給好雷 ^+++^


  雷文防雷資訊頁

  先說

  這部片的導演一定有玩過《俠盜獵車手 (GTA ) 》

  或是《看門狗》這類開放世界動作遊戲

  這類遊戲中主角都會突然受到委託然後開啟劇情副本...


  以下劇情大雷

  (os.反正大家應該都是為了動作畫面進場

  劇情暴雷一下應該OK吧...)


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  ~~~~~~~~~~~~~~~~~~大雷 分隔線 ~~~~~~~~~~~~~~~~~~

  本部片名直譯就是《做工的人》

  故事發生在芝加哥 (ps.《看門狗》背景也是"Gangland"芝加哥)

  在建築工地工作的主角Levon就是受到工地老闆的委託要去救出被綁架的女兒Jenny

  然後一頭霧水的先去犯案現場酒吧蹲點

  接著發現線索之後就去拷問酒保

  拷問酒保到一半 兩個傻子打手剛好來

  結果一句話都沒問到就被一鍋端 只知道打手是俄羅斯人

  於是繼續在酒保家外蹲點

  遇到俄羅斯老大來便殺到俄羅斯黑手黨一名高幹家

  透過翻譯軟體得知人口綁架是Dimi幹的好事

  PS.《GTA IV》中也有一位主要1反派人物 叫Dimitri XD


  接著主角透過關係找到販毒酒吧 偽裝成毒品買家想混入其中接近DIMI

  在販毒酒吧遇到機車黨 跟機車黨打成一片後與同樣服役過的機車幫頭子

  雙方英雄惜英雄 真可謂不打不相識


  此時黑手黨要為高幹報仇於是放火燒了女兒Merry的家

  因此主角決定安置好女兒Merry後殺去Dimi的賭場並救出珍妮

  最後一連串的打鬥片打得好長

  中間遇到機車幫頭子 本來還不忍下死手 雙方都知道軍人就是各為其主

  且寧願戰死也不願苟且偷生

  最後遇到拿重機槍瘋狂掃射的殺手 用了一招無線藍芽瞄準狙殺

  全場都笑了

  (ps.這裡也超像《看門狗》的啦)




  最後付上歐洲人權照



  --'
