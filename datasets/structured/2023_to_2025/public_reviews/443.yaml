url: https://www.ptt.cc/bbs/movie/M.1743347898.A.603.html
title: '[新聞] 傑森史塔森「重裝制裁」讓白雪公主下去'
content: '新聞網址：



  如同潛伏在樹林中的獵人，傑森·史塔森的《重裝制裁》（A Working Man）在票房

  上擊敗了迪士尼的《白雪公主》，以1520萬美元對1420萬美元的成績位居榜首。


  在電影製作開發主管們正為票房市場的走向感到困惑，束手無策之際，我們不能否認傳統

  的硬漢動作電影仍然具有吸引力，並且能夠找到觀眾。請記住，這部耗資4000萬美元的史

  塔森電影之所以吸引人，部分原因在於它改編自查克·狄克森（Chuck Dixon）的系列小

  說，講述了一位退休的反恐特工轉行為建築工人，卻又被捲入舊業的故事。該系列小說有

  多部作品，為史塔森在不久的將來提供了充足的《玩命快遞》（Transporter）式發展機

  會。劇本由席維斯·史特龍（Sylvester Stallone）和大衛·艾亞（David Ayer）共同編

  寫，艾亞同時也擔任了該片的導演。此次的開畫成績與史塔森之前的艾亞和亞馬遜米高梅

  影業（Amazon MGM Studios）合作的《蜂刑者》（The Beekeeper）的1650萬美元相差不

  遠。


  《白雪公主》（Snow White）的票房為 1420 萬美元，較前一周大幅下跌 66%，週五票房

  為 370 萬美元，週六票房為 625 萬美元，午場電影有所貢獻。非常遺憾。再次強調，這

  是一部紮實的電影；但再加上所有的負面宣傳，正如一位好萊塢資深製片人喜歡在我面前

  哀嘆電影票房慘敗時說的：「沒人要去看！沒人要去看！」《白雪公主》的跌幅比《小飛

  象》（Dumbo）的第二周跌幅（-60%）還要大，相較之下，《黑魔女2》（Maleficent:

  Mistress of Evil）的第二周跌幅（-48%，第二周票房 1940 萬美元）顯得相當不錯。


  更令人印象深刻的是，這位57歲的動作巨星在週末票房上擊敗了社群媒體迷因紅人珍娜·

  奧特嘉。她的A24恐怖電影《獨角獸之死》這部耗資1500萬美元的製作，僅獲得580萬美元

  的票房，排名第五。該片在CinemaScore獲得了B-的評價。有些人可能會說，「好吧，這

  是原創IP」，而她之前的電影，例如《陰間大法師2》和最後兩部《驚聲尖叫》電影，都

  是基於熱門系列作品。儘管如此，你可能會認為她在這裡應該有更好的表現；至少應該有

  雙位數的票房。


  《獨角獸之死》到底缺少了什麼吸引力？正如《Deadline》影評人格倫·加納（Glenn

  Garner）在西南偏南電影節（SXSW）上指出的：「對於一部片長近兩小時，片名瘋狂，情

  節也同樣瘋狂的電影來說，動作場面開始得太晚了。同時，笑點和血腥場面都很少，諷刺

  元素最終讓位於父女情誼，儘管這種情感本身就足夠真摯……但我們是為了獨角獸的血腥

  屠殺而來的。」


  另外布倫屋的新片The Woman in the Yard也表現不佳




  白雪公主下去了，感覺奧美眉在星期三之後沒幾部好作品耶


