url: https://www.ptt.cc/bbs/movie/M.1743249332.A.2CB.html
title: '[負無雷] 《重裝制裁》大成本的B級片'
content: '無雷安心服用


  真的很難看，非常難看

  節奏慢到靠盃，打戲非常少又很短


  這部就是完全的即刻救援的老梗劇情

  這也沒關係，動作片大都如此


  但節奏怎麼可以慢成這樣

  影集的節奏也沒這麼慢


  劇情一直在解任務

  因為要查誰所以要先去找誰

  整部片大概花一小時在做這件事

  一直循環至少三四輪


  明明是電影一直在多餘的鋪陳

  劇情也很跳，一直塞不重要的角色

  然後他就沒戲了，或是突然就掛了


  打戲更尷尬，非常少也沒套招很明顯

  重點是無雙放不到一分鐘就沒了


  一直在塑造黑幫有多黑暗深層

  結果卻輕而易舉被攻破

  還是很好笑那種


  這部如果不是傑森史塔森

  根本沒人想看，道地的B級片等級


  今天看之前就發現IMDb

  竟然只有5，感覺不太妙

  看完果然不意外

  5還嫌太高

  爆米花指數也只有54

  連爽度都沒有


  傑森史塔森這幾年的片很多

  去年的蜂刑者很不錯

  前年玩命特攻雖然普通

  但至少還有蓋瑞奇的風格


  今年這部重裝制裁，真的爛到爆

  很少看到動作片會讓人想睡覺的


  把錢省下來也別浪費時間了

  看完真的超不爽


  對了看這部有送刮刮樂

  可以抽現金


  -----

  Sent from JPTT on my Samsung SM-S9310.


  --'
