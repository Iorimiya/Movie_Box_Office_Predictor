url: https://www.ptt.cc/bbs/movie/M.1748970841.A.3B2.html
title: '[負雷] 波羅五號：超電磁新紀元Voltes V: Legacy'
content: '金馬看的，首先先來個預告，本來想放個圖的可是imgur掛了XDDD


  簡單講一下的話，這片就是日本1978年經典動畫翻拍的真人版影集

  就是機戰裡五人份精神指令挺好用的超電磁マシーンボルテスV


  基本上記得幾年前菲律賓說要拍真人版的時候很多人介紹過這個

  還有像是下面這個介紹這部作品與菲律賓的關係，有興趣可以參考看看



  所以介紹就跳過啦，先直接講一下感想

  CG機人戰部分還行，看得出有用心，但節奏極度八點檔，分鏡切得很煩

  要我給分的話，整體平均下來我會給及格啦，但是好像也沒必要去電影院看

  畢竟本來就是網路影集又被塞得很拖XDD


  底下有提到劇情，所以弄個防捏區，不想被捏到47年前的劇情請不要往下XDDD








  這樣說好了


  超電磁マシーンボルテスV日本動畫版一集大概24分鐘，一共40集

  菲律賓的真人版影集Voltes V: Legacy一集約27分鐘，然後拍到90集....


  所以在一開始知道這個集數之後本來就覺得會很拖

  實際觀看是真的覺得超級拖!!!


  這次的電影版是將真人版「1-17」集剪成電影版

  對，你沒看錯是「1-17」集

  把菲律賓在這17集中多塞的東西全部拿掉

  演到主角母親特攻犧牲的部分....


  可是主角母親特攻犧牲在原作第2集....

  光這就可以感覺到這菲律賓真人版到底多塞了多少東西XDD


  那照理來說經過日本大刀剪輯之後應該會緊湊一些才是吧？

  但很可惜的體感上還是很拖，因為在分鏡節奏上真的很....

  怎麼說都還是個人看法，但剛好東映跟GMA Network的官方Youtube上有放這集

  有興趣的可以比較看看原作跟真人版的表現差異





  我個人是覺得那種八點檔拖時長切鏡頭的拍攝節奏實在挺令人煩躁的

  老實說從一開始覺得「感動的要來了」，變成「阿你到底是要不要撞下去」(逃

  而且機人戰的部分也常因此被切得很碎，看的不是很過癮


  整部片對我來說最棒的橋段就是超還原的合體配上片頭曲了


  但....有種早知道我看完這段就離場的感覺....


  以上，個人看法




















  --








  --'
