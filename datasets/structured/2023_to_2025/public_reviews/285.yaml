url: https://www.ptt.cc/bbs/movie/M.1748055770.A.2BF.html
title: '[新聞] 真人版《波羅五號：超電磁新紀元》6月上映'
content: "真人版《波羅五號：超電磁新紀元》6月上映\n\n《波羅五號：超電磁新紀元》劇照，波羅五號。 （台北双喜提供）\n\n【大紀元2025年05月23日訊】（大紀元記者葉子杰報導）真人電影版《波羅五號：超電磁\n\
  新紀元》改編自1970年代日本經典「波羅五號」機器人動畫，它也曾是台灣那個年代的人\n的童年回憶。今天公開了電影版中文預告片，6月將首次登上台灣大銀幕。\n\n\
  《波羅五號：超電磁新紀元》改編自70年代東映經典動畫，由菲律賓電視台翻拍，日本東\n映全新CG技術打造的真人電影版。劇情講述阿姆斯壯三兄弟：史蒂夫、大柏、小瓊，與夥\n\
  伴潔米、馬克並肩作戰，操控五架戰機合體為地球最強武器「波羅五號」，共同對抗來自\n「波亞桑星」的侵略軍與巨型「攻擊獸士」，誓死守護地球的經典故事。\n\n\n\
  《波羅五號：超電磁新紀元》劇照。 （台北双喜提供）\n\n在台灣，出生於1960年代與1970年代的民眾，對於無敵鐵金剛、金鋼戰神、蓋特機器人、\n波羅五號、聖戰士和六神合體等都有一些童年的回憶。波羅五號也曾在70年代的菲律賓風\n\
  靡一時，更創下收視率58%的驚人紀錄，當年還有「為了看到《波羅五號》的結局，必須\n推翻馬可仕獨裁政權」的口號。\n\n《波羅五號：超電磁新紀元》是菲律賓GMA\
  \ 電視台取得日本東映授權，拍攝全新真人版電\n視影集。即將上映的電影版是由東映剪輯影集精華、以全新CG特效和音效，打造大銀幕版\n本，並已在日本盛大上映。台灣首度登上大銀幕更將推出兩個版本，包含日本配音版和菲\n\
  律賓、英語發音的不同版本。\n\n\n《波羅五號：超電磁新紀元》劇照。 （台北双喜提供）\n\n之前，日本朝日電視台票選「外國人最喜愛的動漫歌曲」排名，由堀江美都子演唱的《波\n\
  羅五號》主題曲，更是打敗《鬼滅之刃》、《進擊的巨人》和《咒術迴戰》等熱門作品，\n高居排行榜第三名。（前兩名分別是《新世紀福音戰士》和《我推的孩子》）《波羅五號\n\
  》主題曲也是前三名中，傳唱將近50年的經典神曲。\n\n尤其菲律賓人更對日文原曲朗朗上口。其走紅程度連主唱堀江美都子前往菲律賓時，更被\n當作國賓接待。日本前首相夫人安倍昭恵訪菲時也有年輕人合唱《波羅五號》的片尾曲表\n\
  示歡迎。\n\n主題曲的作曲者小林亜星辭世時，菲律賓駐日大使館也發表文章表示弔念之意。電影版《\n波羅五號：超電磁新紀元》也將經典主題曲，安排在劇情高潮段落，經典前奏一出，勢必\n\
  讓觀眾熱血沸騰。\n\n《波羅五號：超電磁新紀元》於6月13日在台灣上映。\n\n預告片：\n\n責任編輯：蘇漾\n\n\n\n--\n           \
