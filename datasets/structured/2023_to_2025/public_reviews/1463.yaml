title: '[  雷] 粽邪3鬼門開'
content: '昨天看到Netflix 上架了於是點來播放

  看完之後只覺得浪費了快兩小時


  防雷頁～～～～～～～～



  ～～～～～～～～～


  ～～～～～～～～～～～～～～～～～～



  ～～～～～～～～～～～～～～～～～～

















  說好是鬼門開

  一直在講鬼師傅的故事

  還以為是這集是要說古曼童的反噬


  真的不知道編劇在想什麼欸

  臺灣這麼多古怪的傳說不來拍

  應要拍外國文化 拍也可以

  而不是像這種沒頭沒尾

  哇靠上集奎爺打鬼鬼還沒死

  還因為鬼門開被放出來？


  地獄也有外役監是不是？


  然後還有為什麼

  大家會這麼喜歡英叔的電影跟港式鬼片


  因為人家演的很專業

  不用過多的特效

  用最接近現實的方式呈現給各位看


  現在每部的特效爛就算了

  搞得跟萌學園海上終極一家一樣

  看了很出戲


  恐怖片不是有特效就可以欸

  真正厲害的恐怖就像方文山寫的歌曲一樣

  不點破 但是能讓你領悟到那種感覺

  例如咒正負評很嚴重

  但他基本上鬼出現的鏡頭很少

  基本都是用最真實的生活情況

  去帶入各位觀眾的感受

  讓大家邊看戲 變回想這種毛毛的地方

  似乎很熟悉 而不是終極系列的特效

  下次哪部恐怖片

  拿出一把寶劍 飆驅魔指數我都不意外了

  英叔的恐怖片哪次不是看到他本人登場

  總是有滿滿的安全感

  哪像這部不三不四

  看到師傅團出門 第一個就在想嗯

  誰會先領便當



  不如就打造一個固定主角團

  有這個主角團去執行大部分的任務

  而不是到處都天選之人

  劇情臨亂不堪


  唯一稱讚的是陳為民和他的小三

  小三選的夠好很有角色代人感


  多拍一點宗教儀式這方面的文化嗎

  畢竟現在很少見

  可以找GQ之前那個道士來指導啊

  拜託印尼鬼我真的沒什麼興趣

  泰國鬼都可以拍兩集了….

  多拍點民間臺灣鬼故事吧
















  ----

  Sent from  on my iPhone15,5


  --'
