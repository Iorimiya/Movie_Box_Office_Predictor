url: https://www.ptt.cc/bbs/movie/M.1693030639.A.BA6.html
title: '[負雷] 粽邪3：鬼門開'
content: '一點點劇情雷















  劇情鋪陳很無感，呈現的方式感覺張力好薄弱，

  很多內容都是輕描淡寫的帶過，例如口述幾句過往的事，或是拍一張報紙剪報等，

  到後面甚至出現好像在虛空世界跟特效搏鬥的畫面，

  讓我覺得電影預算是不是很拮据...

  導致不管是可怕、感動、悲傷等情緒，我都堆疊不起來，

  沒有一件事情交代得好。


  也有很多性格轉折沒特別說明，看了會讓人覺得刻意，

  例如小時候乖乖學罡步的人為何長大是個鐵齒白目跑酷仔？


  而且我明明想看的是恐怖片，jump scare很少，氣氛營造的恐怖程度也很低，

  有些表現讓我覺得比較像超能力片，

  甚至看到後面根本是英雄科幻武打片吧？


  還有，電影主軸圍繞在七條人命會喚醒鬼師父，鬼師父在片頭先讓住宿男子在旅館上吊，

  後來接連死了男主好友、小三、小孩他爸、另一個老闆娘、盲婆、男主他爸，

  早在小孩他媽自殺之前就集滿七點了，害我以為小孩他媽是要幫忙召喚鬼師父的人，

  結果自殺就沒了= =


  總之我覺得是粽邪系列最難看的


  --'
