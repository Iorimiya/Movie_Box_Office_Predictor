url: https://www.ptt.cc/bbs/movie/M.1693046984.A.808.html
title: '[普雷] 《粽邪3：鬼門開》，七身七命，誓殺鍾馗'
content: '部落格版：


  觀賞完《粽邪3：鬼門開》後回到家的第一件事，就是回頭來看之前我在《馗降：粽邪2》

  寫了些什麼，然後看到自己寫過這段「鬼師父轉生到了書儀的孩子上，故能猜到這孩子是

  和阿火與佳敏是有天命的，第三集書儀等人應是會回歸和佳敏相遇的... 」才赫然驚覺，

  本集開頭在旅館自殺的男人原來就是書儀的丈夫家維，而由夏于喬飾演的書儀和她的孩子

  早就死亡，雖然有點錯愕導演廖士涵會用這樣輕輕帶過的方式來結束首集的男女主角戲份

  ，不過某方面來看這也算是給了書儀和家維一個結局，同時亦是讓在《馗降：粽邪2》埋

  下的伏筆能夠在《粽邪3：鬼門開》裡確實開花。但如同我上段文字後面寫的，我並沒有

  認為假使鬼師父藉著書儀孩子重生這樣的安排不好，可就是有些理所當然的感覺，如果鬼

  師父能在《馗降：粽邪2》後退場會更好，就像《粽邪》首集的送肉粽習俗那樣成為該集

  的主力亮點就好，這次再次成為《粽邪3：鬼門開》最終魔王不僅少了點新鮮感，整體劇

  情也讓人會有種好像再把上集重看一次的感覺。


  「七身七命，誓殺鍾馗。」


  之所以會這麼說是因為，《粽邪3：鬼門開》和《馗降：粽邪2》有著實在太過相似的劇情

  架構與人物配置，兩部作品的主角冠宇和佳敏也都在最後因失去重要之人而力量喚醒、領

  受天命、擊退邪靈，而本來還以為本集主打的泰國陰靈古曼童，會是像上集中鬼師父般的

  重點存在，結果實際上卻是鬼師父在殺了書儀和家維後，邪化了獨眼靈婆為陷入喪子之痛

  的婉華請來的正古曼童，又或者是過度悲傷的婉華犯了據聞古曼童不能吃生肉、喝生血的

  禁忌，造成其用死去兒子製成的古曼童走向邪路，被利用來繼續尋找其他犧牲者好完成鬼

  師父誓殺鍾馗的大業，這樣的發展也讓最終戰與上集同樣都是「鬼師父對決鍾馗」。於是

  即使本集在最終戰中看著冠宇唸著口訣、踏著天罡七星步整個正氣十足，背景襯著嗩吶為

  主的宮廟音樂讓氣氛超燃，是比上集決戰還來得更有氣勢，可就是覺得力道有因重複而減

  弱不少。對我來說較為可惜的是，如《馗降：粽邪2》中有椅仔姑助陣、受阿火之託暗中

  保護佳敏，《粽邪3：鬼門開》既然都請來古曼童，卻沒讓祂與泰國邪神鬼師父聯手對抗

  鍾馗，而是淪為「工具陰靈」般的結果是稍微浪費了。



  既然聊到《粽邪3：鬼門開》和《馗降：粽邪2》劇情部分有些相像，難免的就會不自覺拿

  兩部作品比較。先說我自己認為《粽邪3：鬼門開》比起像是《靈語》、《民雄鬼屋》、

  《杏林醫院》等其他台灣恐怖電影來說就算中規中矩也比上述作品表現好不少，可就上面

  提到過的重複感讓我不會給比上集更高的分數。《馗降：粽邪2》一是新鮮感有加分，二

  是即便普遍認為李康生飾演阿火師不太適合，可有陳雪甄相當到位的中邪演技印象深刻，

  但《粽邪3：鬼門開》在少了新鮮感、也沒有陳雪甄這樣壓迫感與張力十足的表演的情況

  下，就顯然沒有屬於本集才有的獨特看點。定位上本集飾演婉華的吳奕蓉大概就是上集的

  陳雪甄，可惜吳奕蓉卻不夠邪魅、不夠猙獰，沒有演出那種真的卡到或走火入魔的壓迫感

  ，這點就和同樣有出演本部作品的曾莞婷在其主演的《化劫》裡的問題相似，無法散發出

  婉華這個角色的邪氣。


  另外，在《馗降：粽邪2》的主角之一的許安植，於《粽邪3：鬼門開》繼續扮演佳敏，上

  集繼承了阿火師的五雷結印並拜入阿西師門下，這集看起來已經獨立出師，不僅在開頭受

  阿西師請託協助退煞，後面至關時刻也和阿怪前往旅行社欲協助受困於此的武雄與冠宇，

  在冠宇和鬼師父決戰時也在關鍵時刻救下冠宇，可就是不知道為什麼佳敏這個角色沒什麼

  特別強烈的存在感。還有就是這個角色的強度與經驗值設定，先保險推算本集與上集相隔

  三年，所以電影裡的時間也是過了三年，我不怎麼認為三年時間能讓佳敏出師甚至是接下

  連請示鍾馗都出現令牌裂開等暗示此行很危險的任務，就算佳敏也是到現場才意識自己能

  力不足應付，阿西師理應也不可能會推入行僅三年的徒弟去送死才是。只是換個角度想，

  就會覺得鬼師父選在三年後捲土重來，不僅僅是當年一戰元氣大傷後的養精蓄銳，更明確

  給觀眾感受到了本集就是要讓鍾馗「上不了天，下不了地」的復仇感。



  當然的，如果《粽邪3：鬼門開》可以是《降：粽邪2》的強化版，就算劇情相似那又如何

  ？但可惜就可惜在，上集中就情感戲部分是做得很好的，不論是佳敏與阿火師或者是佳敏

  和阿姨，都順著劇情堆疊後有了家人羈絆、犧牲保護的動情之處，然而在本集卻處理的相

  當生硬。婉華對兒子的思念引發了一切；武雄的死亡讓冠宇覺悟，基本上可以預期這兩對

  親子間的情感、一正一邪的碰撞可以有多精彩的火花，可前者著墨太少而後者太過理所當

  然，觀眾是看見了前者的動機、後者的變化，無奈卻沒有足夠理解並認同的時間與空間，

  尤其是冠宇和武雄這邊的父子情。妹妹冠伶的離開是很好運用的一個點，事實上導演廖士

  涵亦有此打算，如後來冠宇昏迷後見到了冠伶，妹妹告訴他要他趕快逃、因為她被鬼師父

  抓住了，可想見鬼師父似乎想利用冠伶來對付帶有鍾馗天命的冠宇；而冠伶也能成為修復

  冠宇和父親間的關係、是和好的關鍵，結果都流於「必須這樣發展」的形式，冠宇到底為

  何會突然改變對父親的態度？又為何會突然對帶天命的自己認命？


  「無主孤魂，人間遊蕩。」


  滿喜歡《粽邪3：鬼門開》選了農曆七月鬼門開為事件時間點，還有加入了古曼童來讓本

  作就恐怖感上有Buff加成的可能，遺憾最後整體是搔不到癢處。可也誠如前面說到了《粽

  邪3：鬼門開》雖然沒有更好，但跟很多類似題材作品相比是也不差，只是在這樣的情況

  下看著本集最後的彩蛋伏筆，就算很想知道陳雪甄飾演的阿姨後續故事，期待值上難免還

  是會因本集而下降一些，可惜我覺得本集表現最為亮眼的草屯囝仔阿倉領了便當，再次出

  場的機會應該不大，要是他能夠取代從上集到本集我都不知道作用為何的阿怪這個角色成

  為系列作常設角色就好了。最後不得不提一下主角張庭瑚，看過他演出不少作品，先不談

  電視劇的話，幾部電影這樣看下來他總是一號表情，從《切小金家的旅館》、《傻傻愛你

  ，傻傻愛我》、《你在我心上》再到《粽邪3：鬼門開》，明明是不同的類型角色，但他

  好像都是同套演技，痞帥痞帥的，差不多那樣。


  --'
