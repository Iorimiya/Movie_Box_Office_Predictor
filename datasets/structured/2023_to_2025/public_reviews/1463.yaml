title: '[好雷] 粽邪3：鬼門開'
content: '晚安電影版


  今天去看粽邪3

  覺得非常好看


  原本在電影app看到評分才5.4感覺很低

  還讓我猶豫一下要不要去看

  查了一下電影版也是毀譽參半

  還好我有去看！

  以下有雷






  子標題是鬼門開

  顧名思義就是鬼門開之後的故事

  鬼片裡面通常都有一個弱智

  非常鐵齒

  人家跟他講說不要去做某事

  或者不要亂講話

  他就偏要去做

  那個弱智就是本片的主角


  結合了台灣道地的鍾馗文化

  農曆七月的普渡

  還有老舊的大旅舍

  大旅舍裡面還有賣sex的

  酒駕

  夫妻失和回來拿權狀的灑狗血

  跑到河邊被水溺死

  鐵齒中二

  完全就是滿滿台灣的素材


  最後要幹掉泰國鬼師傅的那場鍾馗步伐

  也是走得精神抖擻

  看了十分喜歡



  只是我比較不解的是

  那個泰國阿婆一開始幫老闆娘招睿睿的鬼魂

  為什麼最後才發現那不是她的乾兒子（睿睿）

  也發現得太晚了吧？

  是那個老闆娘一開始就被泰國鬼師傅附身作祟嗎？


  片尾的彩蛋好像還有戲

  是粽邪4的序曲嗎？

  希望有新的梗



  最後不得不說那個鐵齒中二最好不要再中二了

  到底要害死幾個人才甘願

  你也不用存錢搬出去了

  你爸都被你幹掉了

  給我乖乖待在家當道士：@


  --

  誰不知道是劇情安排？

  笑爛'
