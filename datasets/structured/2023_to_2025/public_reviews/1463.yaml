title: '[普雷] 粽邪3：鬼門開'
content: '上映第一天跟我同場的人還是蠻多的，坐了7成吧


  第三集故事跟第一、二集有關聯，建議要補但單獨看也沒差。文化考據、美術、場景、音

  樂、特效跟資深演員們的演技都蠻加分的，片尾有彩蛋會有第四集。


  最出戲也最扣分的就男主角冠宇本人。


  看的時候覺得佳敏長大沈穩好多，接了宮主頭髮也留長了，有些角度真的很像舒華的感覺

  XD




  ——————————下面有雷——————————






  場景集中在舊旅社，老闆娘招魂回來的古曼童被第二集沒滅乾淨的鬼師父取代，開始在旅

  社裡大開殺戒，湊滿七名死者要對鍾馗復仇。


  男主角冠宇帶天命，但極度鐵齒不信邪，很像暑假關校門會放出來的那種屁孩，各種觸犯

  禁忌還要眾人幫忙擦屁股，超級讓人火大也是最扣分的角色。演技在對戲上明顯有落差，

  蠻出戲的。


  至於配角群是真的加分不少，單眼婆婆、老闆娘、接單小姐、老闆、小三，甚至是開頭中

  邪的戲班成員，對角色的詮釋都拿捏的很好，能給到普雷分數要歸功他們。最喜歡曾菀婷

  幫忙撿球卻鬼打牆那段，真的有感受到絕望（在一堆球跑出來前）。


  後段就跟第二集一樣，鍾馗降臨戰局反轉，只是這次多了有修煉的佳敏幫忙，沒第二集的

  無力。


  粽邪每一集都會有角色口白生硬，也都有演技很好的演員，只當民俗片不要當恐怖片看的

  話，給普雷。


  至少不是像化劫那樣變成國高中生的愛情片


  --'
