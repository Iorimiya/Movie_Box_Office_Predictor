title: '[雷] [負雷]粽邪3：主題不是鬼門開'
content: '這篇文就是來吐槽的


  先說看完感想


  看完後我腦中第一個浮現的問題是：死了7個人，阿如果報警，請問要怎麼跟警方描述事發

  經過,想想就有趣。



  說完感想，下面就是吐嘈了


  本片最大的2個致命傷：

  1.薄弱且不合理的劇情

  2.演員讓人出戲的演技


  先說劇情部分


  1.首先，劇情內容和鬼門開沒太多關係，分到本片最多鏡頭的就是[美凰大旅社],所以美凰

  大旅社才是本片的主題，電影名稱應該叫[美凰大旅社]


  2.旅社設定在6樓，無電梯(光這設定就覺得。。鬼才會去那裡住),整個大旅社的住客只有本

  電影MVP王彩樺，還有一個不知道住幾天就上吊的祭品1號。這麼生意不好、地點不好的地方

  只能用很牽強的劇情集滿7人了。


  在這無電梯的設定下，滾出來的皮球群是從哪滾出來的阿？(還是這邊我睡眼昏花看錯不是

  從電梯滾出來的)


  3.旅社明明有電燈，為什麼媽媽要用手電筒而不選擇開燈OwO?


  4.整部片絕大多數都是髒髒又暗沉沉的色調、暗沉沉的場景，然後我也看的暗沉沉的差點睡

  著。


  5.連續2集都是逃避天命最後接受天命，能不能有別的劇情主軸？


  6.為什麼集滿7個人後還要一起放到頂樓去？(難道是為了吸取日月精華？)

  而且排法像全聯集點一樣整齊

  還用紅線分4人一組，3人一組(區分這串是北部粽，那串是南部粽？)


  拜託，如果都特地把人集在一起了，好歹也讓他們死的姿勢特別一點吧！

  比方說全部吊起來每個人都凹成詭異姿勢，或是大家都肢體扭曲一起集合成一顆大粽子被繞

  滿紅線也好阿


  這滿地的全聯集點路障是怎麼回事

  請參考一下[傑克蓋的房子]好嗎？


  再來是演員部分


  粽邪2有比鬼還恐怖的阿姨鎮場，整部片我是衝著阿姨的演技看完全場

  粽邪3本片唯一演技沒讓我出戲的是王彩樺

  就連現身的鬼怪都沒有完整的畫面，除了古曼童雕像外，劇中鬼怪沒有一個完整的全身/全

  面鏡頭


  就連[噤界]這部超級好睡的安靜鬼片看完後至少我還能記住怪物的模樣，但這部片的鬼怪我

  真的沒印象。只記得養樂多和牛奶。


  片中加入酷跑的動作很帥氣，但後面也沒看出來有什麼發揮



  本片於我而言完全沒驚嚇點，唯一嚇到我的地方是在我看完後正和朋友吐嘈時，突然演員現

  身OwO


  說了這麼多，其實只希望劇組能好好改善劇情內容，說好一個故事。

  無論加入再多的國外的邪魅、不一樣的元素，不如好好的把故事說好，給觀眾一個真香的劇

  情。


  在這跟劇組說一個我構思的故事好了~


  一對男女朋友租屋同居，某日因某種原因發生爭執，女方負氣離開提出分手，男方心懷執念

  ，請教了邪門法師如何使用邪術讓對方能和自己永遠在一起。男方遵從法師教導的邪術後，

  獻祭自己上吊了，屍體呈現奇怪的姿勢，在取下屍體的過程中也發生了各種怪事，依照當地

  習俗，上吊自殺的要送肉粽，送肉粽過程中剛好被搞不清楚習俗的外地情侶撞見，送肉粽後

  ，這對情侶和這次送肉粽的法師相繼出事。。。。


  欲知後續，請站內信


  粽邪的沉浸式體驗展我也有去

  感想是

  體驗展比電影還值得

  以上感想，供各位參考囉


  --'
