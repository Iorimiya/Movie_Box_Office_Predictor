title: '[新聞] 鬼門開沒在怕！《粽邪3》奪全台票房冠軍'
content: '新聞網址：



  2023/08/28 16:58

  記者陳穎／台北報導




  主創團隊也兵分二路，三天全台跑透透

  ，北部由張庭瑚和吳奕蓉領軍，中南部則有監製鄒介中、李興文、草屯囝仔阿倉、王彩樺

  、許安植、劉國劭等人輪番上陣，映後和觀眾見面互動，第一手接收全台觀眾的熱情回饋

  。


  在拍攝《粽邪3：鬼門開》時給予大力支持的台中市新聞局，以及協助拍攝的台中市影視

  發展基金會，長官都現身站台力挺。有觀眾反應，以為午夜場來看就會比較有空位，殊不

  知現場竟人山人海，各地戲院皆傳來午夜場滿場的驚人盛況。



  融合台灣民俗信仰和傳統文化的恐怖鉅片《粽邪3：鬼門開》，台北場由張庭瑚和吳奕蓉

  出席映後，觀眾看到飾演旅社老闆娘的吳奕蓉第一反應都是嚇到發愣，讓吳奕蓉哭笑不得

  ：「我本人應該比片中好看很多吧！」另外，吳奕蓉也分享她把恐怖片當動作片拍的趣事

  ，她透露電影中跟陳為民互掐脖子的那場戲，先是陳為民掐她掐到下巴瘀青，而她則是為

  詮釋中邪狀態，需要在鏡頭前使勁掐住陳為民，卻被導演嫌棄看起來不夠用力，下戲後讓

  吳奕蓉全身虛脫無力。



  而在《粽邪3：鬼門開》中結合歌仔戲和跑酷元素的張庭瑚，詮釋「新鍾馗」的帥氣模樣

  迷暈全台少男少女，出席映後場場獲得尖叫聲，張庭瑚也分享收到許多觀眾私訊問他：「

  新鍾馗服裝在哪裡買的？」可愛反饋讓張庭瑚笑翻。《粽邪3：鬼門開》在台上映中。



  --'
