url: https://www.ptt.cc/bbs/movie/M.1456945535.A.DA5.html
title: '[普雷] 今天看鬼門開...'
content: '今天去找朋友，在高雄看的

  路上差點被三寶害死，騎機車時右側中卡車突然開車門，我就往快車道閃進去，還好當時

  快車道沒有車，媽的死三寶別出來害人好嗎？!


  想說荷魯斯看過了，來看看恐怖片好了!

  結果...










  ----------防雷頁----------





  這根本是ㄧ個三寶的故事!!

  看這位媽媽看到就氣


  怒點1

  故事ㄧ開頭就因為喪子之痛把老公打醒，說你怎麼還能睡的那麼安穩!?

  你他_的以為只有你傷心你老公都不傷心?每個人傷心的表達方式都不ㄧ樣，難道一定要像

  你一樣失眠才叫傷心?(更不論奧利佛之死有ㄧ部分也是媽媽的錯)


  怒點2

  這位媽媽真的很自私，吞藥自殺，有沒有想過他老公能不能再承受這樣的打擊，況且還有

  露西，替他老公感到悲哀，忙工作之外老婆也ㄧ直在翻癲


  怒點3

  聽了廟的事之後就私自不告而別前往廟宇，你他_的有沒有想過你老公也很想念奧利佛，

  也很想見他?況且你有才剛自殺未遂，就自己走了，馬的把你老公當工具喔？不用就丟，

  要是跟老公ㄧ起去說不定就有圓滿結局了


  怒點4

  挖奧利佛的時候管家認為屍體腐爛已經不宜觀看，這個三寶還是要去看，結果又他媽的亂

  叫，有事請吃藥好嗎？


  怒點5

  開門..好了不說了，腦殘


  怒點6

  害死忠心的管家，人家管家已經警告你跟你講要燒照片了，你還在那邊置之不理，管家為

  了保護你們而犧牲了，這條命也算這個媽媽害的


  怒點7

  最後才告知老公，之前都隱瞞，導致老公危險時處理已經來不及了而被邪靈刺傷，而且食

  屍族三番兩次來家裡，也都瞞騙老公，難怪到最後ㄧ發不可收拾



  結論:他媽的死三寶


  --'
