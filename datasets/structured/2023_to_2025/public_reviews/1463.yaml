content: '具體內容已經忘記了

  至少15年以上了(我覺得)

  確定是國片


  只記得是一個女鬼要抓交替

  所以祂引誘一個媽媽用祂上吊的紅繩子也上吊自殺

  這樣祂才可以投胎

  結局是媽媽死掉的小孩為了保護媽媽附身在媽媽身上

  最後把紅繩子燒掉(還是剪掉?)

  就在女鬼悲傷的對著祂的繩子哭的時候

  鬼王(?)出現了

  然後帶著女鬼和小鬼走了

  然後....HAPPY ENDING?


  --

  是這部沒錯~感謝回覆~'
