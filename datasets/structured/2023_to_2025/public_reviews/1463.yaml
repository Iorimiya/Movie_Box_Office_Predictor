url: https://www.ptt.cc/bbs/movie/M.1486902779.A.22F.html
title: '[Live] 鬼門開 星星台手剝21:00'
content: '沒看過

  大家覺得這部鬼片水準如何

  女主角是兩部神劇女主角

  越獄風雲(prison break)第一季

  陰屍路  (walking dead)第一季

  =================

  鬼門開 the other side of the door


  21:00 ～ 23:05

  --------------------------------------------------------------------------------

  節目介紹

  好萊塢新生代恐怖大師—亞歷山大阿甲監製，《惡鳥公路》、《異形爆倉》約翰尼斯羅勃

  茲執導，《郊區故事》傑瑞米西斯托和《陰屍路》莎拉韋恩卡利斯主演。


  《鬼門開》故事敘述一個居住在印度孟買的幸福家庭，在一場車禍中失去了他們八歲的兒

  子，小男孩的母親瑪麗亞（莎拉韋恩卡利斯　飾）悲痛欲絕，並對兒子的死深感自責。瑪

  麗亞的管家告訴她一個古老的印度儀式，能讓她和死去的兒子做最後的道別。


  得知這個消息後，瑪麗亞便隻身前往一座廢棄的古廟，而廟中的一扇門竟是連接冥界的神

  秘通道，瑪麗亞被告誡過，無論如何都不能打開這扇門，但好不容易盼到心愛的兒子出現

  在門的另一邊，愛子心切的她，急切地想再見兒子一面，忍不住開了門，卻也因此破壞了

  生死兩界原有的平衡，更為自己和她的家人帶來一場災難。



  --

  推 hope951:有片無槍 片失其用 無片有槍 槍失真我

  → hope951:有片有槍 登峰造極 無片無槍 天下無敵


  --'
