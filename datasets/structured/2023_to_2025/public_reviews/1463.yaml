url: https://www.ptt.cc/bbs/movie/M.1693927146.A.211.html
title: '[好雷] 粽邪3：鬼門開（含劇透且文中長)'
content: '先人權



  但搭配聯名卡不到200元



  如果沒記錯, 共兩次小弟首次在電影院觀看恐怖類型來自台灣的電影, 一部是在年初近期

  將參與奧斯卡電影的國片.


  小弟外行, 不過如果特效能再放的更多效果會很棒, 原先以為一勇哥?!(喂～XD), 在魁爺

  上身能有很震撼的特效, 但可能成本考量很含蓄, 一度以為會越加越多.


  心得：

  小弟沒看過過去兩部, 但劇情中似乎只有講到不超過三次二代劇情(鬼王跟佳敏的父親或

  者有冠宇妹妹過世), 但不影響觀影體驗, 冠宇年輕的個性就跟多數年輕人差不多那活力

  與叛逆但可能男主帥所以也沒覺得不妥, 不過那化妝特效厲害一開始在公廟感覺不是冠宇

  有可能是臨演.


  劇情很快來到美凰大旅社, 原本有看到中和街但目前沒查太多網路上似乎無此資訊, 不過

  場景真實也貼近台灣畫面都很棒, 結果由彩樺飾演的旅社店主妹妹一出現感覺大概不可怕

  了, 果真後續有她的場景即使是被睿睿吃肉肉好像都不可怕, 但對比現今知道妹妹有中邪

  還能陪到最後很不容易或者她在裡面神經比較大條, 但她好漂亮比她出保庇那一張專輯還

  年輕.


  男主的朋友龜仔有創一個社群但好像也是虛構查不到, 本來想看看有無其它私下生活跑酷

  影片, 後來在梯間那場景冠宇看到這麼恐怖的畫面還願意救援, 我想那大概就像是只要兩

  個人清楚地對彼此存在的安全感就是一種愛的關係也能是朋友關係但非一般只是知己.


  後來還有婉華先生由陳為明飾演, 在這裡只知道媽媽因酒駕讓兒子(睿睿)喪生但巫婆看中

  以小孩能回來的名義來讓鬼王降臨.


  電影後段：

  冠宇在干擾到爸爸儀式時應該能明白爸爸愛他也點醒了, 後來被引到異度空間, 這裡的特

  效不錯, 不過黃金雷牌掉落, 寶劍也鬆手顯得戰力不太夠, 最後爸爸現身在兒子臉上加強

  圖騰魁爺上身, 本來很期待會有看到很多聲光效果不過很可惜實在不太多, 連鍾馗劍刺入

  鬼王也沒有大爆破反而那個鬼娃模型還有類似好萊塢特效(笑)


  最後很遺憾就是離開的人還是沒有回乃, 覺得想哭, 能及時想到孝順珍惜家人就多做吧.


  結語：

  因為沒看過前兩部, 後續再補看! 雖說第三集比預期低但小弟會再去看一次, 笑死恐怖片

  還二刷但其實真的不恐怖, 小弟覺得大概是主角群都太陽光了, 除了扮演鬼怪類, 現在能

  回想到比較可怕的地方大概就是彈跳驚嚇橋段, 但那種可以預知所以就很普通, 不過學到

  好萊塢式也很棒, 不會至少要會模仿.


  --

  年輕人不懂事給個機會不要酒駕致死他人就好.

  那幕有學到好萊塢電影手法, 但那段特效搞不好很貴總覺得特效用的很省.

  那就是愛不是嗎為了愛的人, 冠宇後來感化對比(是喔, 又怎樣), 真的不經一事 不長一

  智.

  你講我才明白! 感謝點醒以為黑娃本身94惡魔.

  後面那個吃人妖新娘真的該死, 希望下集冠宇可以打爆她, 佳敏感覺戰力有點弱希望下次

  強化一下.'
