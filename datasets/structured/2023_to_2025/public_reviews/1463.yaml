title: '[負雷] 鬼門開'
content: '看完內心覺得....


  無數為什麼


  恐怖氣氛比紅衣小女孩還差


  劇情簡單到爆炸


  總言嗯你知道的


  以下為雷















  一個媽媽


  在一場車禍中喪生了兒子


  於是耿耿與懷


  吃了藥想吃殺


  被救回


  管家婆在醫院告訴他


  可以跟你兒子說說一點話


  但不能開門


  於是就去了說了話不用多說


  就是開門了


  兒子跟著回家


  一連串的靈動


  植物鳥兒魚兒死光光（為什麼我不知道


  然後管家婆說


  掌管陰間的守護人要來抓回去


  因為你兒子變成惡鬼


  要把他所有相關東西燒掉


  過程中管家婆就先被幹掉了


  媽媽東西燒完後


  兒子附上女兒身上


  一群吃屍族要來解決這個兒子惡靈


  然後媽媽要求兒子附上她自己身上


  最後媽媽也就這樣被殺死惹～～～


  結尾爸爸也用同樣的方式去跟媽媽說話


  故事就這樣結束。


  --'
