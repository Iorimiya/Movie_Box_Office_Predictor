title: '[半雷] 電影(靈異乍現)，中元普渡，鬼門開'
content: "靈異乍現，Brightburn\n\n上映日期：019-08-07\n片長：1時30分\n類型：恐怖，懸疑/驚悚\n\n看到sony電影臉書的預告，有點血腥恐怖\n\
  昨天剛好放颱風駕，\n就趁時間第一次騎車去林口威秀影城看看\n其實我原本想去買哆啦A夢造型杯\n但是員工說沒貨了，\n只好選擇看，靈異乍現，Brightburn\n\
  \n片中一個小男孩，在用除草機，\n發現身上有一種神秘的力量，\n到了中間好像被惡靈控制的感覺\n到後面就有點神不知鬼不覺的劇情，\n香港好像翻，魔童？\n\n\
  查了一下英文google翻譯，\n但是BRIGHTBURN翻不出來\n我就轉翻日文，結果出現ブライトバーン，\n在轉翻中文，出現，光明燒傷，\n在轉翻英文才把英文解開，\n\
  Bright burn 明るい焼け(Akarui yake)\n不知道為甚麼翻靈異乍現？\n說到燒，就是中元節，拜拜要燒金紙\n問題是鬼門開，但是根本看不到鬼？\n\
  \n因為之前看電影台播，林正英，的僵屍鬼片\n發現原來鬼都被道士收服了？\n以前是寺廟，現在好像變宮廟？\n到底是誰在搞鬼？\n至於為什麼中元節拜拜要燒金紙，\n\
  我就不知道了，我只有衛生紙跟報紙可以燒，\n因為，中元，移個1就變成，味？\n\n-----\nSent from JPTT on my Xiaomi Redmi\
  \ Note 4.\n\n--\n水滅火 風助火 誰害中國? :\n七龍珠之復活了? 聖鬥士星矢之AKB48明星大戰? 機動戰士鋼彈之家電變化?\n城市獵人之市區被害?\
  \ 機動警察之警察沒有感情? 桃太郎傳說之消滅鬼怪?\n魔神英雄傳之機車變化? 魔之子? 閃電霹靂車之龍蛇道高速公路? \n幽遊白書之魔界降臨? 新世紀福音戰士之人類遊戲計畫?\
  \ 名偵探柯南之黑暗藥物?\n爆走兄弟之汽車變化? 神奇寶貝之怪獸現實真奪戰? 中華一番之食物變黑暗料理?\n\n--"
