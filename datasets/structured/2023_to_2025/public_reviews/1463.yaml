url: https://www.ptt.cc/bbs/movie/M.1503413919.A.EB7.html
title: '[新聞] 紅衣2鬼門開首映 楊丞琳想和角色告別'
content: '（中央社記者江佩凌台北22日電）電影「紅衣小女孩2」挑今天「鬼門開」舉辦世界首映

  會，導演程偉豪及演員楊丞琳、許瑋甯等人出席宣傳。楊丞琳表示，近日因跑宣傳情緒又

  變悲觀，讓她直呼想要跟角色辦告別式。


  話題不斷的台灣恐怖電影「紅衣小女孩2」呼應農曆7月1日「鬼門開」之日，挑選在今天

  率先舉辦世界首映會，楊丞琳和許瑋甯也首次在台合體，與演員高慧君、黃河等人共同宣

  傳新電影。


  楊丞琳近日一邊拍電視劇，一邊為「紅衣小女孩2」勤跑宣傳，楊丞琳表示，因宣傳關係

  要回憶劇情與角色狀態，讓她情緒上又開始變得悲觀；由於深怕影響另一個拍戲工作，她

  不斷問同事「紅衣2」最後一天的宣傳日期，直言：「想要跟角色辦告別式」。


  許瑋甯表示，目前情緒未受太多影響，但由於連續累積2年的「負能量」工作，中間都沒

  休息，因此拍完紅衣後，接下來想努力走出健康新生活，並提到之後會先考慮接觸藝術或

  戲劇類型的作品。


  程偉豪表示，希望「紅衣小女孩2」的票房成績可以突破前作，讓大家欣賞到續集的格局

  、故事和演員層級都有再提升，給大家看見台灣也能拍出好看的續集電影。


  由於電影即將上映，演員也義氣相挺、紛紛包場，許瑋甯表示，已包場請家人和粉絲看；

  高慧君則說，可能會和朋友們一起穿紅衣去看電影，楊丞琳也號召親友支持。


  首集「紅衣小女孩」賣出新台幣8500萬的票房，還風光入圍金馬獎最佳新導演、最佳女主

  角等4項大獎，而續作「紅衣小女孩2」電影未演先獲關注，根據片商新聞稿指出，海外版

  權已成功售出到19個國家，電影將於25日全台上映。


  新聞網址：


  --'
