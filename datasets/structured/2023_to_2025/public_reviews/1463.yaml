title: '[普雷] 鬼門開 - 公親變事主，好心被雷親'
content: "唉... 雖然說故事一定要這樣才能發展，不過看到這種三寶還是會很生氣\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  1.女主因為一場車禍而失去了她的兒子，傷心欲絕，\n  其實也真的差點開場就BYE了(想吞藥自殺，被老公送醫救回來)\n\n2.在旁的女傭看不下去，告訴了女主1個妙方，但要求女主一定要按照SOP走\n\
  \n3.結果女主因為愛子心切沒遵守到SOP，意外的把兒子放回了陽間\n\n4.女主看到兒子回來了很高興，瞞著丈夫跟兒子恩恩愛愛\n\n5.因為死者返回陽界，造成陰陽失調，一連串的靈異事件接踵而來，\n\
  \  女傭發現事情大條了要女主趕快醒悟，女主卻依然故我，不當一回事\n\n6.等到女傭被殺死後才恍然大悟，發現這兒子不太對勁，但此時也已經來不及了，\n  兒子附身在女兒的身上開始為非作歹，先是殺死愛犬、接著刺傷丈夫\n\
  \n7.食屍族出手相助，想把被附身的女兒殺掉，好讓死者回歸陰間，\n  女主不忍心眼睜睜看著女兒死掉、也不忍兒子獨自上路，\n  就自告奮勇的要兒子附身在她自己身上，接著挨了食屍族1刀，噗滋倒地\n\
  \nEND.女主死亡。丈夫因為思念女主，也用了女傭的那個妙方，而且同樣不想遵守SOP...\n\n\n\n女傭的用意是好。正確的使用這個妙方的話，女主心結解開，就能跟丈夫再生個寶寶，\n\
  結果錯估了父母心跟劇情發展所需要的白目元素，導致自己死於非命，不勝唏噓...\n\n蓋個小透天，請個女傭園丁打理家裡，這似乎也是個不錯的生活方式\n\n--\n\
