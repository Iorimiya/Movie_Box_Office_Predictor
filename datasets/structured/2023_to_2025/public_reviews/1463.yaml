title: '[  負雷]粽邪3鬼門開'
content: '雷文防雷資訊頁

  抽到粽邪3特映看完覺得浪費時間

  粽邪1.2我沒看過但不影響

  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~






























  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  粽邪3鬼門開劇情是在講說男主角跳鍾馗白目沒有卸掉鍾馗的妝玩跑酷要當網紅

  李興文講跳鍾馗禁忌，跟鬼門開這一天所發生的事情，後面滿感人的

  劇情內容裡面都在講鍾馗大戰古曼童跟主角妹妹撿東西發生溺水死亡重複一直在講

  但導演把劇情內容抓得很緊湊時間過得很快

  預告就差不多講完這部電影，最後面跑完字幕有第4集彩蛋

  這部沒有老演員演出真的很難看

  最後面跳鍾馗男主角跟古曼童對決也是在慢慢來，感覺沒有很急迫地想要救人

  我不太懂一點是法力越高越容易附身嗎?


  --'
