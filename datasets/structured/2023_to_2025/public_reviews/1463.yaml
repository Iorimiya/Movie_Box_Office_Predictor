url: https://www.ptt.cc/bbs/movie/M.1456555670.A.53B.html
title: '[ 好雷]鬼門開the other side of the door '
content: "潛水了好幾年第一次在Movie版上發文,請大家多多包涵:)\n\n昨天趁著明天放假跑去看鬼門開\n原本在板上還沒看到有人分享心得，還在猶豫要不要去看\n\
  但在IMDB看到有高達7.0的高分後，就決定衝了~~~\n\n\n以下為防雷頁-----------------------------------------\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n-----------------------------------------防雷---------------------------------\n\
  \n\n一個旅居外國愜意田野間的幸福家庭，在一場悲劇意外中失去他們年幼的兒子，悲痛至極\n的母親在得知一個能夠讓她和死去的兒子做最後道別的古老儀式後，獨自前往一座古老的\n\
  廟宇，廟中的某扇門竟是連接冥界的神秘通道，但她違背了不能打開這扇門的神聖警告，\n因而破壞了生死兩界的平衡。\n\n\n故事一開始利用倒敘的方式\n男主角女主角Maria和男主角Michael兩個人漫步在沙灘上\n\
  當Maria告訴Michael她懷孕時,兩人深情對望\n此時女主角告訴男主角他想要定居在印度\n男主角很開心的問了沙灘旁的印度小女孩\n誰知道印度小女孩忽然手指著女主角尖叫忽然四目流血\n\
  (看到這邊我被嚇到了阿完全沒有預期到一開始導演就來個尖叫梗xDDDD~~~~)\n\n\n此時女主角驚醒了，原來在兩人結婚後有兩個小孩(分別為兒子Oliver及女兒Lucy)\n\
  但因為一場車禍，車子掉進去海裡，兒子Oliver溺死但媽媽Maria和女兒Lucy倖存\n從此之後媽媽Maria都活在失去兒子的陰影中\n每天不斷地做惡夢，甚至嘗試吞藥自殺\n\
  \n而在男女主角家中當管家?的一位當地印度人Piki看到女主角如此痛苦\n便告知女主角有一個方法可以再次和心愛的兒子Oliver對話\n就是將兒子的骨灰帶到一座村落廢棄的廟\
  \ 將骨灰撒在廟的門外\n當晚兒子的靈魂就會回來\n於當晚守夜就可以和門外和兒子對話\n但千千萬萬就是不能將門打開\n\n\n\n而女主角Maria聽完後便隻身前往那座廟\n\
  (在這裡看到電影當中的廟根本覺得看起來太恐怖了阿~~~~\n能一個人去真的也滿有勇氣的,可能為為母則強吧不然電影就拍不下去了xD)\n而晚上一到時女主角的確也和心愛的兒子Oliver對話，但講著講著\n\
  女主角便因為捨不得兒子離開便一時心急打開了這扇大門\n千叮嚀萬叮嚀不能打開的大門就這樣被女主角打開了!!!!!!~~~~~~\n\n\n之後家中接二連三的怪事發生,像是晚上會聽到Oliver再彈鋼琴\n\
  或是兒子喜歡的玩偶出現在家中\n彷彿兒子Oliver就已經回來了\n而女兒Lucy也一直告訴Maria\nOliver已經回來了\n\n\n剛開始Maria從感到驚訝到後來覺得這樣可以和兒子互動也滿不錯的\n\
  (看到這裡我都覺得半夜還要念故事書給一個看不到的人挺恐怖啊~)\n之後發現Lucy身上有很多奇怪的抓痕和瘀青\n媽媽Maria開始覺得不對勁，開始覺得應該是兒子Oliver所做\n\
  加上家中外面的樹木枯死  魚群死光\n還有三不五時出現的食屍族出現在家裡周圍(片中據傳食屍族會吃屍體和塗滿骨灰和陰界\n溝通)\n且會一直用手指著女主角周圍的方向\n\
  (在估狗大神搜尋的確有看到食屍族的相關資料，和印度的宗教信仰有關)\n以及掌管陰界的怪物(在這裡我忘記Piki說這個掌管陰界的叫什麼名字xDDDDDD 暫且以怪\n\
  物相稱)\n\n\n此時Maria家中的管家Piki感到不對勁 並警告Maria他已經破壞陰陽界的平衡\n並告知Maria:兒子Oliver已經不是原本的兒子\n\
  若是兒子沒有返回陰間，陰間的怪物會來抓他\n要他馬上把跟兒子有關的一切物品 包含相片全部燒毀\n此時女主角聽到覺得很捨不得而且鐵齒的告知Piki他不會這樣做\n\
  \n\n\n誰知道就在Maria及老公Michael和Lucy一家人出去用餐時\n管家Piki趁勢要幫女主角Maria整理Oliver的物品要拿去燒時\n在池塘邊看到彷彿是Piki自己女兒的倒影\n\
  就墜落池糖而領便當(在片中沒有特別交代是怎麼死的  不過推測應該是邪惡的Oliver把\nPiki弄死的)\n\n\n之後女主角回家看到Piki墜池而死也感到很驚恐\n\
  開始想起Piki之前和她說的話\n就下定決心要把Oliver的東西全部燒掉\n誰知道在燒的過程中，被老公Michael發現了\n老公Michael覺得 Maria發瘋便把她反鎖在房間(很合理因為女主角完全沒和老公說她做的\n\
  好事XDDDD)\n此時女兒Lucy也感覺像是被兒子Oliver附身(當然老公Michael不知道)\n\n\n之後老公要帶著被外表是女兒Lucy(但事實上Oliver)離開\n\
  在家裡外面看到一堆食屍族，此時Michael被嚇到要報警之餘\n看到女兒Lucy竟然把家中的狗殺死，來不及反應時\n食屍族就已經把女兒Lucy抓走準備要用神秘儀式將她刺死把Oliver送回陰間\n\
  此時女主角Maria掙脫房門  看到食屍族準備要把Lucy刺死時馬上撲過去\n告訴兒子Oliver\"你不用害怕，因為媽媽即將一直陪你在身邊\n之後女主角領便當\n\
  \n\n\n就在覺得電影要結束時，結尾女主角醒來一樣躺在一座廢棄廟的大門外\n聽到老公Michael不斷呼喚她  老公Michael和Mariah說\n\"\"\
  我好想你Maria，我不敢相信可以聽到你的聲音，我好想要再看妳一眼，我要把門打開\"\n此時女主角Maria大聲呼喊Michael說\"\"不要打開門啊!~~~~~~~~~~~~~~~\"\
  \n電影結束\n-----------------------------------------------------------------------------------\n\
  \n\n\n看完影片後，除了覺得母性偉大之外還覺得:\n\n1.下次要做什麼奇怪的事之前，記得還是先和家人說啊!!!!片中的男主角Michael根本算\n是搞不清楚狀況，\n\
  \   Piki也領便當領得好可憐QQ\n2.片中男主角Michael出現的場景真的滿少的，而且片尾居然還做和女主角一樣白目的事\nXD\n3.真心覺得此片和以往的歐美恐怖片不一樣，多增加了印度神秘的色彩，個人滿推薦的，\n\
  只是我覺得後勁好強QQ\n\n\n\n以上:)\n\n--"
