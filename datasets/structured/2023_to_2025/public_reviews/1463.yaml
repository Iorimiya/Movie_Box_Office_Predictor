url: https://www.ptt.cc/bbs/movie/M.1564718845.A.27E.html
title: '[新聞] 鬼門開影城看「人生消極掰」散場他不離開'
content: 'ET Today



  鬼門開影城看「人生消極掰」　散場他不離開工讀生驚呼：他死了



  記者邱中岳／台北報導


  北市1間影城，1日晚上電影播完散場時，工讀生清場時發現有1名男子遲遲未起身，上前

  一看男子竟然倒臥椅子上沒有呼吸心跳，警消獲報後緊急送醫仍宣告不治。



  警方調查，年約50歲的黃姓男子，1日晚上6時許在信義區一家電影院看電影「人生消極掰

  」，散場工讀生清潔時，竟然發現黃男坐在椅子上沒有離開工讀生當時以為對方睡著了，

  上前一看竟然發現男子已經沒有呼吸心跳緊急報警。


  警方獲報後到場，發現男子當場沒有呼吸心跳，直接將人送往北醫搶救，但最後仍宣告不

  治，家屬趕赴現場難過表示，黃男曾經有中風的紀錄，但最近身體也沒異狀，並不清楚男

  子為何突然死亡，檢警也將相驗遺體釐清男子死因。







  --'
