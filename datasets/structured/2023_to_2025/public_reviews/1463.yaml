url: https://www.ptt.cc/bbs/movie/M.1503493986.A.63E.html
title: '[新聞] 《紅衣小女孩2》挑鬼門開辦世界首映　楊'
content: "《紅衣小女孩2》挑鬼門開辦世界首映　楊丞琳與許瑋甯雙后首度同框飆戲\n\n\n\n台灣影史最賣座恐怖片《紅衣小女孩》續集《紅衣小女孩2》昨（22）日特別挑選在農曆7\n\
  月1日鬼門開之吉時舉辦世界首映會，電影未演先轟動，續集已熱銷海外美日港新馬等19\n國！今日台灣率先舉行世界首映，監製曾瀚賢、導演程偉豪、楊丞琳、許瑋甯、高慧君、\n\
  黃河、龍劭華、黃鐙輝、吳念軒、詹宛儒全員齊聚。這是許瑋甯和楊丞琳二大影后首次在\n台合體宣傳，與高慧君一同登場時，被主持人黃子佼戲稱是「三媽上菜」，原來三人在《\n\
  紅衣小女孩2》中剛好都是飾演母親的角色。\n\n首映會現場佼哥神來一筆，要求導演程偉豪與高慧君合唱招牌歌曲「你最珍貴」，甚至現\n場改詞，當程偉豪唱出「我會送你紅衣小女孩」搭配高慧君「你別拿一生眼淚相對，未來\n\
  的日子很美夢才會真一點」現場氣氛沸騰到最高點，現場觀眾聲讚導演不只會導戲又會唱\n歌！而因應鬼門開時節，特別請《紅衣小女孩2》中的小童星林芷瑈、林裔臻為首映儀式\n\
  打開「鬼門」，鬼門開後上百隻紅翼鬼臉天蛾紙雕飛向台下，導演率領眾演員齊心按下儀\n式啟動鈕，「紅光籠罩台灣」象徵全台86家戲院齊力盛大上映《紅衣小女孩2》。\n\
  \n\n\n《紅衣小女孩2》是金鐘影后楊丞琳與台北電影節影后許瑋甯從影多年，首度在大銀幕同\n框飆戲。許瑋甯在首映會穿著一襲黑色長禮服，側面開叉若隱若現展露修長白皙美腿，楊\n\
  丞琳則是以復古碎花雪紡裸膚長禮服亮相，氣質高雅出眾。相識18年的二人，這次為投入\n角色，在拍戲期間有默契地選擇零互動，甚至還因過度投入角色而紛紛受傷。楊丞琳分享\n\
  有一場她所飾演的社工師李淑芬在告知許瑋甯所飾演的沈怡君真相時，怡君因為無法接受\n現實，出現情緒激動瘋狂哭鬧的舉動，這場戲的拍起來讓人精疲力盡，楊丞琳在收工時才\n\
  發現自己雙手全是許瑋甯留下來的抓痕：「拍完雙手都是瑋甯抓過的痕跡，我看到她那樣\n崩潰我很心疼很想哭，但角色卻要置身事外，告訴自己得排除私下對她的感情！」\n\n\
  \n\n 高慧君則是有一場紅衣小女孩找上門的戲，算錯椅子砸過來的時間差，手肘因此被武行\n丟過來椅子擦撞到，她表示：「那個力道再大一點，手骨可能會碎！」，而這次無論在造\n\
  型或演技上都被評為是顛峰之作的許瑋甯，在拍攝和高慧君對峙的關鍵戲時，因為飛撲向\n高慧君的力道太猛烈，重量加速度超過了劇組人員準備的安全軟墊，讓她整個膝蓋重擊到\n\
  地板，但敬業的她一鼓作氣將戲整套演完，直到喊卡才發現自己痛到無力站起來。許瑋甯\n表示：「那場戲的情緒是充滿恨、崩潰和發狂，所以當下痛的感覺上來時，其實有幫忙到\n\
  情緒是很成功的。只是當下有閃過，我也太委屈了吧，為了一部戲把自己搞成這樣！」\n\n《紅衣小女孩2》故事描述整日奔波處理許多個案的社工師李淑芬（楊丞琳飾），某天接\n\
  獲通報到一樁虐童案件，正盤查女童母親林美華（高慧君飾）時，突然接到女兒雅婷在學\n校失蹤的消息，心急如焚的淑芬查看學校監視器後，竟發現雅婷跟著一名穿著紅衣、身影\n\
  詭異的小女孩離去，循著線索，淑芬隨著救難隊在山區的廢棄醫院發現疑似雅婷的蹤影，\n但找回的卻是失蹤已久的廣播主持人沈怡君(許瑋甯飾)。無計可施的淑芬只好先將精神不\n\
  穩定的怡君帶回家，希望能從中問到女兒的下落，沒想到帶回家的可能不只是怡君......\n本片將於8月25日正式上映。\n\n新聞聯結\n\n\n--"
