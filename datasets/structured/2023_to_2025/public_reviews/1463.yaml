url: https://www.ptt.cc/bbs/movie/M.1439480396.A.B3E.html
title: '[好雷] 屍憶  鬼門開先睹為快'
content: '台灣向來即很少產出鬼片，也許是觀眾普遍對這類影片接受度不高的關係，

  趁著鬼門開之際今晚先睹為快




  劇情簡介：


  靈異節目製作人承皓(吳慷仁飾)最近事業、愛情兩得意，不但工作順遂，

  與未婚妻（謝欣穎飾）也展開甜蜜的同居生活。

  自從在公園撿到一個奇怪的紅包後，他就開始不斷做著關於古宅的惡夢。


  女高中生茵茵（嚴正嵐飾）有「陰陽眼」，從小就會看到一些「不存在」

  的東西，但最近她越選擇逃避，鬼怪就越是變本加厲出現在她眼前。




  以下有雷








  劇情主要分為兩條線交叉進行：


  1.靈異節目製作人承皓(吳慷仁飾)和未婚妻（謝欣穎飾）即將結婚，

  但就在承皓撿到一個紅包後，開始噩夢連連，發現莫名其妙的身體抓

  痕，和朋友一起去詢問靈婆之後才知道原來是被女鬼纏上了，而這段

  姻緣從承皓出生那年便開始糾纏(前世)，於是承皓和朋友依循靈婆小

  鬼指點線索，到圖書館翻閱百科全書，找到當年的一宗命案(一名男

  性車禍而亡)，然後承皓便獨自前往山裡古屋探索尋找真相

  (到底前面惡夢連連都快被嚇死了為什麼還要自己前往古屋...)



  2.女高中生茵茵（嚴正嵐飾）有天生的「陰陽眼」，然後在16歲生日時

  ，開始莫名其妙看到越來越多的靈異現象，以及跟著觀眾被鬼嚇，例如

  預知好朋友的狗被撞歪了臉、在校園傳說游泳池遇見真正的冤魂等等...



  3.故事高潮(劇中我覺得最讓人毛骨悚然的點來了)

  承皓在古屋裡終於遇見當時的場景，由於自己前世因為撿了紅包，而被女

  方家人押著帶到古屋裡與女屍成親，女屍爛掉的臉披著鳳冠霞披背後綁著

  木板，與男生拜堂結親真的讓人雞皮疙瘩，然後還要切開手滴下雙方的血

  當交杯酒喝.......承皓前世好不容易掙脫家丁跑到屋外，在滾下山後被迎

  面而來的車撞死了(原來自己是這樣死的)，醒來後承皓還在屋裡



  故事回到女高中生茵茵破解了校園傳說游泳池命案，挖出一具女屍骨後，

  回到家繼續被另一個濕答答的女鬼糾纏不清，終於她發現事情不單純，跑

  到承皓的家中才發現...承皓家早就凌亂不堪、宛如廢墟，而浴室裡躺著

  的女屍竟然是承皓的未婚妻-田中千繪!!!!!也就是一直糾纏著茵茵的女鬼



  沒錯，承皓的真正未婚妻是田中千繪，而劇中一開始謝欣穎演的未婚妻，卻

  是承皓撿到紅包後，那個冥婚女鬼的樣子，而且在被女鬼纏上後，承皓也被

  附身般地殺了田中千繪(男生身體抓痕就是女生掙扎抓傷的)，並把她丟棄在

  浴室，直到茵茵和承皓朋友來才發現這個家早就不成家...兩人也馬上趕到

  山中的古屋找承皓，發現承皓和一具披著鳳冠霞披的白骨躺在一起，總算救

  出承皓並將白骨下葬.........




  感想：


  不確定是不是有劇情被剪掉，茵茵和承皓家的關係其實一開始沒什麼交代，一

  直到後面茵茵突然跑進承皓家中，隨後跟著他朋友說要去找承皓，然後警察來

  家中作筆錄時才說出她們偶爾會遇到，有點突兀；另外就是茵茵在游泳池遇到

  女鬼隨後挖出一具白骨的事，應該可以說得更清楚點的，不過對劇情發展影響

  也不大。


  雖然對劇中出現不少日本式的鬼嚇人手法和音效頗厭倦(確實也被嚇了不少次)

  ，但整體來說台灣能拍出這樣劇情的鬼片也很不錯了，尤其是古屋裡與鬼妻拜

  堂結婚的橋段營造得相當有氣氛，還有田中千繪竟然是被鬼纏身的未婚夫殺害

  也讓人始料未及，推薦暑假已經看膩動作片、喜劇片、愛情片的人不妨換換口

  味感受一下鬼月氣氛XD


  值得一提的還有一幕是承皓做惡夢自房裡醒來後，發現身旁睡著女生，而轉過

  身後卻看到謝欣穎...但以後續結果來看，承皓未婚妻本該是...


  --'
