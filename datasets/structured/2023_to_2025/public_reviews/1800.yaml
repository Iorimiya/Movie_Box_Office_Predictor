title: '[包場］3/23《電影配樂大師顏尼歐》@TITAN 廳'
content: '#真心推薦分享


  期待這部紀錄片電影上映期待了快二年

  錯過真的是天理難容！


  已經幸運在泰坦廳看過一次，看完後大受感動

  想用盡世上所有一切美好的詞彙來形容這部紀錄片的詼諧、真誠、具有啟發性！


  由於知道上映後廳數較少，且沒有泰坦廳場次！

  特別跟片商與戲院硬喬出一場

  希望能邀約有興趣的影迷一起觀賞


  推薦給所有熱愛電影、熱愛音樂、熱愛創作、

  工作常常需要有靈感與創意發想的需求，

  甚至曾經在理想與現實中掙扎的所有人。


  曾經被Ennio Morricone配樂，

  被他任何一段電影音樂打動的影迷們，

  不進戲院簡直不可原諒！！



  ★ 活動時間：3/23(四) 20:00-20:15間開演


  ★ 活動地點：松仁威秀泰坦廳（台北市信義區松仁路58號）


  ★電影票價：$350  (會額外贈送電影明信片，由於片長較長，泰坦廳原價$450)


  報名連結：


  --'
