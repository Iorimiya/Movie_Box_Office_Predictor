url: https://www.ptt.cc/bbs/movie/M.1677252863.A.54E.html
title: '[新聞] 《配樂大師顏尼歐》紀錄電影作曲家一生'
content: "《配樂大師顏尼歐》紀錄電影作曲家一生\n\n04:10 2023/02/24 中國時報 李承陽\n\n\n顏尼歐沒學醫改學音樂，最終成為配樂大師獲頒2座奧斯卡。（海鵬提供）\n\
  \n奧斯卡得主朱賽佩托納多雷費時5年拍攝的紀錄片《配樂大師顏尼歐》，獻給他已故的朋\n友兼合作夥伴顏尼歐莫利克奈，獲得全球媒體、樂迷及觀眾極力推崇，成功讓這位被譽為\n\
  「有史以來最偉大的電影作曲家」永垂不朽。\n\n電影最難能可貴之處，是在顏尼歐生前訪問到他本人，並由他自述人生歷程。片中顏尼歐\n提及影響他一生最大的3人，首位便是他一生落寞的小號樂手父親，其實顏尼歐原本的人\n\
  生志向是當醫生，卻被父親阻撓說：「不行，你得學吹小號。」\n\n顏尼歐雖從小就對音樂著迷，卻因家貧，在職業選項上，能賺錢、過上好生活的醫生才是\n他的夢想。但顏尼歐的父親深知兒子擁有天賦，將他送進羅馬歷史最悠久的聖塞西莉亞國\n\
  家音樂學院專攻小號，終奠定了一位音樂大師的誕生。\n\n#小號 #父親 #一生 #配樂大師 #顏尼歐\n\n--\n佛教經典的\n是 是菩薩成佛之道\n   \
  \     是 佛經\n  是 佛      是 菩薩\n\n\n\n--"
