url: https://www.ptt.cc/bbs/movie/M.1679500083.A.620.html
title: '[好無雷] 配樂傳奇顏尼歐'
content: '生涯寫了五百部電影配樂而且還必須符合不同導演敘事的風格這到底是什麼概念？



  進場前我對Ennion的認識僅止於我很愛也是最經典的《新天堂樂園》以及《海上鋼

  琴師》。看完才深深明白如今的電影配樂甚至是整個古典樂、流行樂、搖滾樂被他影

  響有多深！


  裏面有許多跨界大師現身說法，特別喜歡昆丁跟漢斯季默那種小迷弟的部分。

  有別於一般紀錄片大家出來講講話，電影同時細數他出道到最後的經典原創音樂片段。

  從西部片、到驚悚片再到警匪片，後來無一不做，每個類型都能駕輕就熟，可以說他的

  音樂本身就是一部電影。Ennio起初認為音樂為畫面服務是一種恥辱，可是越做越投入，

  最後他的音樂才是畫面，許多導演、製片都為他的才華說傾倒。最可怕的是他從未停

  止創作和超越自己，只要腦海有想法就會紀錄下來，並且努力實踐它。



  個人很愛看本片剪接他指揮不同樂團演繹同一首歌的畫面！

  甚至連影藝學院因為其中一次所有人都以為要頒給他卻沒有，許多會員感到錯誤，

  後來追頒終身成就獎；結果數年後終於以《八惡人》取得奧斯卡跟金球獎最佳原創

  電影配樂獎，也算是好萊塢終於追認對這位大師的認可。


  謝謝你，

  也永遠紀念你，當代電影大師。


  --'
