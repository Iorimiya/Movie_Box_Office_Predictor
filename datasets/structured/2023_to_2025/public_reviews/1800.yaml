title: '[好雷] 《配樂大師顏尼歐》150分鐘的音樂饗宴'
content: '一部看似平淡的紀錄片，卻非常引人入勝

  這是一部會在影廳內閉上雙眼，好好用耳朵

  享受150分鐘的音樂饗宴紀錄片，非常推薦

  在影廳觀看，串流也建議戴上耳機欣賞。



  Ennio Morricone，或許有人會對他不熟悉，

  但他創作了超過500部電影電視配樂，甚至

  日本大河劇都有他創作的身影。



  對於Ennio Morricone的印象，是在小時候

  旅居海外時，旁邊教會的歐洲傳教士時常用

  卡帶播放in ginocchio da te這首歌，足足聽

  了一年，直到寄生上流配樂加入這首歌，才

  回憶起這首歌、才知道當初是Ennio所編曲



  《海上鋼琴師》、《新天堂樂園》、《鏢客系列》

  都是Ennio著名的配樂作品，但我尤其更愛

  《教會》的配樂。（新天堂樂園強烈建議列入

  人生片單）




  Ennio對於音樂的純粹跟堅持，而使得建起屬

  於Ennio給世界的音樂殿堂，一幕幕熟悉的電

  影配樂，串起來許多回憶


  「啊，原來這也是大師的配樂作品」


  影片進入中後段就越來越多這樣的感覺，

  尤其Ennio的配樂不花俏，用非常單純簡單

  且少的旋律，就能貫穿觀影者的靈魂，如同

  《海上鋼琴師》這部電影一樣。



  劇中最讓我感到動容的橋段是Ennio與父親間

  的尊重及感情，父親年老後，無法再優秀的吹

  小號，Ennio從此不再譜寫有小號的曲子，直

  至父親過世。


  也許就如昆導跟其他人說的，200年後Ennio

  也許就能跟貝多芬莫札特相提並論了。


  Ennio Morricone，謝謝你，為這世界增添

  許多美妙的音符。




  看完2小時半電影後，又聽了1個多小時精選XD









  -----

  Sent from JPTT on my Xiaomi 21091116UG.


  --'
