url: https://www.ptt.cc/bbs/movie/M.1701063610.A.0DD.html
title: '[好雷]  《年少日記》或許不那麼..與我無關'
content: "雷文防雷資訊頁\n\n《年少日記》之前朋友受邀去看試片，我是因為這樣也選了今天光點華山這場來看。 只是昨天剛頒完獎，我可能也可以試探其他觀眾的心聲。\n\
  \n《以下有劇情》\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\
  看完之後，除了這部影片本身很有治癒力、周遭的人哭成\n一團以外。 我自己很強烈的感受是一種「與我無關」，\n但精確來說不是我覺得沒有共鳴，而是我對於與我無關的\n\
  共感。\n\n\n在電影中不時會覺得自己不像是主角傑仔的人設。我會去\n類比家庭背景，自己是否在學習過程中有過多的挫折壓\n力，同儕問題。學業是不是無力負擔。會不會家暴，與雙\n\
  親的家庭關係..，是否有想輕生對念頭等等。然後，很輕\n易的畫出了一個界限覺得..這不是我..吧。我猜想可能有\n另一種人是跟我相反。 但在一個劇情轉折發現看了大半\n\
  場的老師原來是他弟弟的時候，我才發現原來就是這個「\n與我無關」。\n\n弟弟跟爸爸內心的創傷來自於他們沒有把哥哥當家人對\n待。尤其是哥哥跟弟弟一起上天台的那場戲更讓人看到原\n\
  來他們是兄弟。可以一起玩鬧，一起做壞事。但最後大人\n都習慣把十字架釘在那個總是出錯的哥哥身上。弟弟也總\n是享受乖巧的紅利。自然而然地冷漠、甚至有點看不起\n\
  他。 而這個感覺讓我覺得這很像是我的關鍵。 我猜想這\n個情節的設計或許是故事的原型包裹著很深的遺憾。後來\n看一些訪問故事的原型是求學時的朋友自殺的故事。但這\n\
  也點醒了很多事情改變的契機可能很簡單，可能多一點點\n關心，多一些陪伴或擁抱，這也不是這麼「與我無關」。\n\n從當時沒辦法接到哥哥，成為了心中理想的老師（即使片\n\
  中仍呈現不甚完美），有一天看到學校某個學生的遺書，\n裡面的字句真實的無法忽略，也激起主角想要排除憾事的\n決心。內容跟自己的童年和自己的感情生活，以及原生家\n\
  庭的種種連結在一起。雖然我沒有哭，但整個故事真的很\n打動我。我覺得他的正面能量（你一定可以成為想成為的\n大人..云云）是一個很鼓舞人去觀看的理由。但對我來\n\
  說，能在電影的情節發現自己跟某些部份的連結，這也是\n很可貴的。所以好像可以理解為什麼會受到很多觀眾的喜\n愛了。\n\n這場是有QA的場次，因時間有限，總共有三個問答環節：\n\
  第一位是一名教育工作者分享他的感想跟觀影的細節。第\n二位問了關於手持拍攝的動機，也藉此了解拍攝跟主角內\n心狀態的關聯。最後導演也解釋了很多主角在最後跟爸爸\n\
  的坦然，當時我在電影中聽到「我未必能幫到你，但我會\n陪著你」，這句話或許是當下很撫慰的一句話（肯定有好\n好寫日記）。以及主角開始面對自己的創傷還有跟學生們\n\
  開誠佈公的過程的舉動也重新認識這些安排的意義。最後\n也有提到他聽很多台灣的人對此片很有共鳴但導演不覺得\n這是可以開心的事情，代表各地都有類似憾事。但又很珍\n\
  惜可以透過作品跟不同的人連結。最後呼籲大家要來看電\n影。也讓我沈澱一下在這個沒有耐心看完長片的時代，究\n竟是什麼讓我們願意踏出家門一步，也許真的很喜歡在一\n\
  片黑暗的空間裡，能夠一起為什麼事情有一點點感觸的氛\n圍。\n\n《#年少日記》\n2023/香港/劇情/保護級/95分鐘/光年映畫 發行&行銷\n12/08(五)。陽光普照\n\
  \n-----\nSent from JPTT on my iPhone\n\n--\n     | | |  | | |\n     . . .  . . .\n\
  \                                            \n\n--"
