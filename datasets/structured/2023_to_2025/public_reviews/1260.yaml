url: https://www.ptt.cc/bbs/movie/M.1702139008.A.B15.html
title: '[新聞] 年少日記在台票房奇慘？片商：不悔引進'
content: '年少日記在台票房奇慘？ 片商：不悔引進時初衷、盼進戲院支持


  2023-12-08 11:09


  聯合報 記者楊德宜／台北即時報導




  「年少日記」太感人，被封「今年最催淚最好哭的動人電影！」。圖／光年映畫提供


  香港電影《》在今年金馬影展頗受好評，日前奪本屆金馬獎最佳新導演獎和觀眾

  票選最佳影片獎。


  不過，獨立片商「」在臉書粉專透露，周末目前全台訂票狀況敬陪末座，香港創

  造票房奇蹟，但台灣票房應該到不了成本10分之1，期待台灣觀眾能進戲院支持。


  「」臉書粉專表示，很多觀眾抱怨場次不佳、戲院過少和沒

  有好好對待這部電影，老闆這些都虛心接受，但也不悔半年前決心引進這部電影的初衷，

  畢竟這是部好看的電影，達成一年一部香港電影的願望，「

  」。


  光年映畫表示，從特映到金馬影展，台灣目前有將近1000名觀眾看過這部電影，有人開頭

  5分鐘就哭了，也有人95分鐘從頭打呼到尾。


  有人覺得不過是學生作品，也有人覺得根本就是金馬獎最佳影片。


  有人決定要二刷和三刷，「」。


  有人覺得今年度最好看的電影，也有人覺得這部會凍死在同溫層。


  有人覺得票房可以7位數，也有人覺得兩周以內下片。


  光年映畫表示，不管如何，一人進場就有一人會推薦，「能做的就靠你們進戲院支持了」

  。




  香港導演卓亦謙執導的「年少日記」抱走本屆金馬獎最佳新導演獎。本報資料照片


  新聞網址：





  --'
