title: '[新聞]《年少日記》港片入圍冠軍　10歲童星「被'
content: '新聞網址：


  《年少日記》港片入圍冠軍　10歲童星「被劇本逼哭」搶金馬

  記者 廖福生 報導





  香港電影《年少日記》昨（3）日入圍第60屆金馬獎五項大獎，包括最佳劇情片、最佳新

  導演、最佳男配角、最佳原著劇本和最佳剪輯。10歲的童星黃梓樂更成為金馬獎最佳男配

  角年齡最小的入圍者，他首先非常感謝導演卓亦謙給他演出機會，第一次看劇本的時候就

  已經看到哭了。而且這也是他首度挑戰戲份最重的角色，拍攝時候從未想過是否會入圍而

  演，而是希望自己能盡力去做。



  而《年少日記》導演卓亦謙曾為香港動作電影《殺破狼·貪狼》擔任其中之一的編劇，他

  在得知入圍消息時，感到十分驚喜和感謝金馬獎的肯定，卓亦謙在人生挑戰首部電影之前

  ，本業其實只是寫劇本的，但他一直很喜歡說故事給別人聽，所以不僅獲得新導演提名被

  鼓勵到外，能夠獲得到劇本上的肯定，對他來說有更巨大的意義，讓他感動的直說：「彷

  彿有人拍拍我的肩膀說：『要繼續做自己喜歡的事情喔！』」



  電影《年少日記》故事描述在中學任職的鄭老師（盧鎮業 飾）在校園意外發現一封沒署

  名的遺書，在尋找真相過程中，卻讓他想起充滿暴力和遺憾的童年往事。但與此同時，妻

  子 （陳漢娜 飾）的婚姻危機和父親 （鄭中基 飾） 病危的雙重壓力下，他必須跟時間

  賽跑，找出企圖輕生的同學並阻止悲劇發生。該片將於年底全台上映。


  --'
