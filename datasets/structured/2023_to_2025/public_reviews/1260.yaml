title: '[新聞] 金馬60 十大影評人投票 年少日記呼聲高'
content: "原標：\n2023金馬60預測 | 十大影評人：影帝獎激戰無解！最佳導演獎一面倒？！\n\n2023金馬60預測 | 十大影評人：影后中港台女演員各有擁護者！\n\
  \n新聞網址：\n新聞網址：\n\n\n2023年第60屆金馬獎頒獎典禮即將於本週六（11/25）揭獎！Yahoo電影戲劇編輯部專訪到\n十位已看完本文競獎項目的台灣影評人來投票預測！其中最佳男主角「準影帝」們的競爭\n\
  廝殺最激烈！「天仁交戰」吳慷仁與阮經天各擁將近半數票數、纏鬥難分軒輊！需等評審\n團主席李安來排解；而得到影評人最多票數的獎項則為最佳導演獎，幾乎可說是一面倒地\n\
  認為11/24將上映的《老狐狸》導演蕭雅全能奪獎。更多獎項與影評分析預測細節，請看\n本文細細說明。\n\n【最佳男主角獎：極致表演的正面對決】\n\n金馬影帝「死亡之組」部分，「阿瑪珂德與童年放映室」影評人波波看好《關於我和鬼變\n\
  成家人的那件事》許光漢奪獎，理由為「許光漢在\n，而當大家以為許光漢的表演是理所當然時，一首〈\n 舞孃〉能引人驚豔。」雀雀認為《疫起》王柏傑在詮釋角色做到了生死交關的高壓情境\n\
  下，盡顯台灣醫護專業者在 SARS 封院\n時的無奈、無助、無私又無敵的醫護精神。\n\n\n膝關節認為，但《周處除三害》根本近乎為阮經天量\n身打造，讓阮經天在這十年內的蛻變、歲月洗禮成為有目共睹的表演，片中多場轉折情緒\n\
  爆炸力十足。張哲鳴盛讚阮經天的角色旅程能量豐滿，此後「傳說中的周處」都將被阮經\n天憤世、猙獰與貪名的邪笑烙印，揮之不去。影評人喳喳也提及「阮經天角色宛如和阮經\n\
  天的人生相互呼應、讓人深信這個\n，帶來完美表演曲線。」至於女影評人張婉兒直言阮經天是撐\n起《周處除三害》全片的重量級角色，光是對「笑」的演繹便層次豐富。從他不甘心欲自\n\
  證的莽漢，到尋成為求心靈歸處的亡命之徒，再到看破世間貪嗔癡的絕路者，\n。多年沉澱累積，充滿爆發力。以上便是預測阮經天將再奪得\n金馬影帝的評論與預測。\n\n\
  吳慷仁的擁護者也同樣出現四位專業影評。楊元鈴認為吳慷仁\n。片尾自白的戲令人錐心動容，是她最佳男主角獎得主\n的不二人選。「Lizard的海底影院」作者認為吳慷仁在《富都青年》將角色本身的三重難\n\
  度完美演繹：「包括無法使用語言比手語，詮釋外籍移工之身分，以及必須為戲瘦身八公\n斤以上。此次《富都青年》強化出吳慷仁低調但專心演戲的專業演員形象，電影本身更聚\n\
  焦著當前台灣新南向的議題伸張，為表演也會社會意識極盡奉獻，此次不頒獎給吳慷仁，\n更待何時？」\n\n影評人Alan亦不諱言：「這個聾啞角色極為討好，更讓吳慷仁以往用力過猛的表演風格反\n\
  而更加對味，監獄袒露心境的聲淚俱下，無比強大。」釀電影影評編輯黃曦分析了吳慷仁\n最後一場得獎場：「，反而\n更好地襯托了角色作為一個失孤，仍急欲抓住世界邊緣的內心衝突。兩相對照所呈現出的\n\
  極大張力，即便不在觀眾面前氣絕，觀眾也明白他已經碎得不成人形。」\n\n【最佳導演獎｜五月雪對上老狐狸 3：7！】\n\n最佳導演獎部分，在公佈金馬60入圍名單時就眾人不敢小覷的張吉安則是獲得三影評票數\n\
  。Lizard形容張吉安是利刃出鞘：「張吉安的電影雖因藝術性手法不得一般觀眾緣，卻已\n因金馬獎而確立其地位，也在兩岸三地具有一定名聲，甚至已經擔任過金馬評審、拿到多\n\
  項創投，所以把獎頒給這個身為『外來者』的『自己人』對金馬來說是最佳考量，更別提\n《五月雪》仍舊跳脫多數國片語法，足以作為台灣當代轉型正義電影邁向歐洲影展的最佳\n\
  學習對象。」\n\n膝關節認為《五月雪》\n。影評人波波解讀《五月雪》是透過旁觀冷靜的第一折《竇娥》與\n情深期盼的第二折《阿英》，將馬來西亞513事件的震驚與傷痛以兩種在風格上、敘事上\n\
  截然不同的手法攤開在觀眾眼前：「\n」\n\n張婉兒提及《老狐狸》的導演蕭雅全的從生活細\n節出發，在富有儀式感與文學氣味的調度中，幽幽道出時代狂飆下簡單又餘韻長存的小人\n\
  物故事，說盡一個父親推己及人的身教。張哲鳴則強調蕭雅全把人與人之間難以具象的同\n理心，梳理成一幅世代傳承的人生處世哲學，言之有物又觸動人心，清晰且高明。Alan認\n\
  為《老狐狸》是蕭雅全導演至今最佳作品，成熟完整，韻味十足，議題辯證發人深省。\n\n\n黃曦感受到蕭雅全拍《老狐狸》是經過多年的思考：「導演終是為多年前拍《命帶追逐》\n\
  的自己給出了可能的解方。導演對社會／生命本質的探問如一，對影像處理的細密追求也\n是，但他的思想是不斷地顛覆原先抄寫下來的答案。珍貴的電影創作者，是不斷地拋出探\n\
  問，可依然保留讓電影來說話的空間。」楊元鈴則稱許《老狐狸》是在復古懷舊的情致氛\n圍中，綿密抒情的父子情、權勢擺弄的男與女、老與少，娓娓訴說追憶台灣曾有過的暴富\n\
  時代與價值觀轉變。\n楊元鈴並直截了當表示：「私心認為《老狐狸》是最佳影片的入圍遺珠，父子也都該入圍\n！」\n\n【最佳女主角獎：中港台女演員搶影后！】\n\n\
  金馬影后以陸小芬過半數的六票領先所有準影后，影評人張哲鳴分析《本日公休》陸小芬\n「這部電影因為有她才有溫度，\n難以取代。」Alan 描述陸小芬飾演的傳統台灣女性溫柔嫻靜，親切自然，貼切深情，電\n\
  影沒有她呼吸般自在的詮釋不會成立。」膝關節也預測陸小芬將成金馬60影后：「從聲調\n、手勢、眼神，《本日公休》的陸小芬皆能準確傳達這位家庭理髮阿姨的心聲與時代惆悵\n\
  感。」\n\n影評人喳喳認為陸小芬陸小芬完全成就了《本日公休》，\n，自然而然被她的演出觸動。楊元鈴評析陸小芬：「\n公休多年，寶刀不老。陸小芬證明了影后不管休息多久都還是影后，看似平淡瑣碎的叨念\n\
  ，也能透出歲月的沈澱與生命的況味。」Lizard也認為這次陸小芬是光榮復出：「這名執\n業終身的理髮師，召喚台灣民眾共有的理髮歐巴桑形象，透過平易近人的小品故事展現社\n\
  會不可或缺的溫柔女力，其為展現理髮的自然演技練到手抽筋，並在言談中展現對來往人\n客的真誠與關懷。談到對陸小芬演技的評價，沒有一則不稱讚的，且今年金馬影展陳坤厚\n\
  專題更是重新放映其主演的《桂花巷》，並找復出的陸小芬拍攝廣告在影廳內反覆播放，\n相信金馬六十那一座最佳女主角獎座會是對這一整套台灣人情敘事的最美好句點。」\n\
  \n《菠蘿，鳳梨》 胡伶共得三票。釀電影影評編輯黃曦激讚「胡伶的\n，卻又能在黑白之間\n，瞧見她的肢體有著因為自卑和失落而向內的體態，以及她眼底對女兒／成功的深刻渴望\n\
  。」張婉兒也把珍貴的一票投給胡伶：「以素僕堅毅的角色樣貌，在片中\n\n細膩的情感演繹具有說服力。」波波對於女主角的預測觀點則\n為：「胡伶在片中飾演為了爭取女兒更理想的高考成績近乎走火入魔的母親，令人想到法\n\
  蘭西絲麥朵曼在《意外》的角色類型。劇中一場談不攏的交易，胡伶打算為了成就女兒而\n犧牲，卻被對方狠狠打臉的戲，五味雜陳的讓這虎媽不單只有張牙虎爪。」\n\n余香凝在《白日之下》飾演一女記者、揭露香港真實社會事件的故事而讓影評人雀雀印象\n\
  深刻：「余香凝實現了記者在處於職場面對同業時呈現一種形象、臥底或採訪時端出另一\n種狀態、回家面對家人生活時又是一種嘴臉的自我拉扯，寫實得沁入神髓，達到了不演之\n\
  演的境界。若此沈重的真實事件改編電影，若無專屬於余香凝\n\n。」\n\n\n【金馬60最佳劇情長片獎：各有擁護！】\n\n象徵著重要里程碑的「金馬60」最大獎「最佳情情長片獎」部分，《年少日記》也獲得了\n\
  高達六票過半數的票數。Alan預測《年少日記》獲獎的原因為「\n\n」張婉兒認為儘管《年少日記》是導演卓亦謙的長片首作，卻以相當熟稔的筆法，\n勾勒了一個兼具議題敏銳度與成長片靈氣的創傷故事，分寸拿捏恰到好處。今昔相照、日\n\
  記敘事的手法看似尋常，卻藉由精妙的敘事詭計，實現與觀眾的極大共情。\n\n張哲鳴把票投給《年少日記》的原因在於「該片精巧敘事的翻轉，既是無法割捨的兄弟情\n誼傷痛，又隱喻了國族情結的時代命運，私密細膩卻足以共鳴。」膝關節亦預測影片得主\n\
  將是《年少日記》，讚其「剪接節奏與視野轉換煞是精準，中段轉折展現導演巧心，層層\n解剖少年自殺低齡化這個議題。」長期關注港片的影評人喳喳：「私心認為《年少日記》\n\
  是\n，催淚動人又發人深省。」\n\n紀錄片氛圍濃厚的《石門》則是獲得兩票。釀電影編輯影評黃曦表示《石門》是將所有\n\n——而是生命史的苦痛本就\n如此漫長。《阿瑪珂德與童年放映室》影評人波波認為《石門》將一名女子的特殊處境放\n\
  在當今中國社會中，在生活化的情境氛圍下彷彿自身是以有機方式長出故事，再透過剪輯\n的修飾，《石門》成為觀眾所見不可思議的模樣。\n\n《五月雪》獲得一票。楊元鈴將最佳影片投給《五月雪》：「\n\
  \n。」\n\n《關於我和鬼變成家人這件事》獲得一票。Lizard 提及《鬼家人》時認為：「程偉豪自\n《紅衣小女孩》開始就是商業作品的箇中高手，不只勇於挑戰各種拍攝技術，還能確保電\n\
  影回本，並勇於組裝各種類型電影，靈活讓各種技術與類型不只為電影還為觀眾服務，如\n果說之前《緝魂》因類型讓他在台灣聲量不足，\n，並代表台灣征戰奧斯卡、體\n\
  現台灣的多元價值，因此最佳影片當然非本片無他選，如果評審們有周全的產業視野以及\n市場嗅覺的話。」\n\n\n--"
