title: 'Re: [好哭雷] 【年少日記】這小孩你也打得下去？'
content: '導演初次執導經驗明顯不足，如推文所說，說太多而不是讓演員自己演，很多地方刻意的故意煽情，不說家暴了不然又有槓精要吵


  另一個例子，哥哥在課堂睡被老師罰，全班在笑還有同學說他會被他爸打死???誰會在同學被老師臭罵全班大笑??還敢酸會被他爸打死??老師還不抓起來一起罰，真實狀況肯定是安靜到很尷尬，老師在發飆誰這麼白目敢嘴，這是讓人無法入戲的部份原因，


  另一方面如果全班安靜，反而才能讓哥哥跟弟弟留級而同班更有張力，但導演選了另一個手法呈現不能說不行，但就是細節太粗糙讓人出戲，父母演的真的就是TVB的八點檔，讓我出戲的看不太下去，但這部劇本真的很好，兩位小童星也真的很棒，還是被他們逼哭了，真希望小童星拿男主角獎





  -----

  Sent from JPTT on my Samsung SM-A5460.


  --'
