title: '[好雷] 《年少日記》請給予溫暖與關懷'
content: '防雷


  《年少日記》第一周的場次時間實在太糟糕了，真的要來抱怨

  我原本想放棄，因為有事情要處理才順便看電影

  慶幸自己還好有看到這部好電影，真的好喜歡

  想想差點因為場次時間而錯失，那就太可惜了

  我曾經感受到陌生鄉民站內信的溫暖

  我希望這個世界多點溫暖與關懷

  雖然很累很想睡，還是希望更多人能看到，故來推薦


  導演卓亦謙的第一部劇情片，

  能夠入圍金馬獎最佳影片、最佳新導演、最佳男配角、最佳原著劇本、最佳剪接5項大獎

  雖然只得到最佳新導演，但第一部就有這樣的入圍成績

  看過以後，深深相信值得肯定

  雖然其他最佳原著劇本的影片都沒看過

  《年少日記》的劇本深具巧思與細節安排，台灣都沒有劇本入圍

  晚上回到家我已經在找場次，想要二刷了

  我也想要寫日記了


  版上的第一篇好雷文章，還好我只有偷看第一頁，沒有繼續看下去

  為了不影響您觀影的情緒，敬請避開，雖然我也沒寫什麼內容XD



  ~~~~~~~~~~~~~~~~~~~ 雷文 分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  因為文筆不好，我不太會描述影片內容，純粹感想抒發



  我有發現到哥哥是右手寫日記，還覺得很奇怪，老師是左手寫字

  看到後面才發現劇本的巧思安排，所以想再二刷，再次確認其他細節



  建議多關心家人、身邊的朋友，如果想多關心鄉民也很好

  我曾經因為太沮喪在PTT抒發心情，有幾位陌生鄉民站內信安慰我，

  都是拉拔我振作的力量

  如果在現實生活想關心陌生人，建議還是要小心一點

  因為不認識不瞭解陌生人，對方有何反應無法預知，還是要保護自己

  在網路關心鄉民，還好是鍵盤分析，至少不會碰面，比較安全一點



  前一陣子me too事件，在FB看的文章

  述說她國中時遭遇補習班老師性侵的過往

  這位老師真的很可惡，表面上道貌岸然

  裝作打電話到家裡關心學生，實則在掌握女學生的日常，伺機作惡

  國中女生因為擔心父母不相信所以不敢說出來

  因為老師的形象實在裝得太好了，跟父母關係都維持良好

  老師的惡行可以持續，甚至危害更多女學生

  只看文字敘述就覺得很心痛




  如果真的有話想說，找不到對象可以傾訴傾吐

  現在網路很方便，可以匿名

  會有天使來幫助你的



  下面是我個人的心情，不喜可跳過


  在家裡，孩子常常承受父母的情緒

  我就常常承受我媽媽的情緒壓力，我媽媽就比較少找我弟弟

  所以我很討厭也很排斥接收媽媽的負面情緒

  故回到家我幾乎都躲在房間哩，跟我老媽保持遠遠的距離

  前一陣子因為家裡的事情，我知道媽媽情緒很糟，我才陪伴她

  今天看完電影後，覺得還好媽媽會說出來、跟我發脾氣

  我媽媽是很悲觀、鑽牛角尖、負面想法的人

  如果她都不說，她很可能就會做傻事了

  看完電影後，檢討自己還是要多陪陪媽媽，分擔她的情緒壓力

  我自己的情緒壓力就來網路上抒發了XD


  我爸爸也是會家暴的父親，我大學畢業還會打我

  所以，他後來一個人獨居，家人都遠離他搬走了

  我爸爸晚年就跟鄭爸爸一樣

  雖然讀過：今之孝者，是謂能養。至于犬馬，皆能有養；不敬，何以別乎？

  但我的認知與態度卻完全是兩回事

  明明知道，但在我爸爸晚年對他的態度還是很冷淡

  我爸爸後來一直念他快走了，但我都不太理會

  直到他昏迷直接住到加護病房

