  讓我有機會可以二刷

  然後即使是二刷 在該哭的地方還是哭得唏哩嘩啦

  (上一部在電影院二刷的是無聲 大概是斗m體質?

  心得就不照故事順序 主要講講幾個有感的片段


  ~~~~~~~~~~~以下防雷~~~~~~~~~~~~~


  其實不管是一刷後 或二刷

  讓我最有想法的是

  鄭爸一開始在台上說

  [努力不一定會成功 但不努力一定會失敗]

  但最終 仍然是用成功與否 來判定有傑是否努力


  開始寫日記的契機 是因為聽到校長兒子有在寫日記

  在不知道怎麼"成功"之下 想要用複製路徑來達成目的

  校長下一句話是 [同時也能增進父子關係]

  但似乎各方面都事與願違


  努力卻沒得到理想的結果

  以及得背負額外的"責任"

  因為鋼琴沒學好所以 Miss 陳被開除

  被媽媽說如果離婚都是你害的

  再再都讓孩子的心靈感受到 自己的存在 只會造成別人的不幸

  不知道自己想要甚麼 不知道自己想成為甚麼樣的大人 只知道 自己不重要

  連在天台上的大喊 相較於弟弟能夠真心喊出讀書很煩

  仍是對應著父母的期待 說自己是垃圾 要上港大... 在臨走前 錄製了彈得完整的 [夢]

  即使到了最後 都不是因為"自己"痛苦 而是為了別人而離開

  相信沒有自己 大家會過得更好 自己沒有存在的必要


  p.s. 導演的催淚彈很突然 效果也很卓越 影廳內大家同時吸鼻子抽衛生紙



  我想也是因此 當鄭sir看到學生自殺的新聞時

  會特別氣憤地說 都這種時候 還要求他替別人著想 是否太苛刻

  如果 有傑 有任何多替自己想 而不是活在那個 "為了別人期待而活"的環境

  如果他有那個能夠尋找自己價值以及"自己的"目標的環境

  或許 就會稍稍不一樣了


  有關鄭sir


  其實在第一次看的時候就有稍微注意到大人跟小孩的慣用手不同

  (一開始還以為是導演選角不夠細心...

  在二刷的時候就會發現其實有很多小暗示 以及很多畫面其實是"弟弟"視角

  所以在二刷的時候會有截然不同的感受


  很喜歡導演做的一些安排

  那種 不是因為你有"開始注意" 就一定能找到答案(如同有傑 不是有努力就有好結果了

  但也從中看到鄭sir慢慢的進步


  一開始自以為的 認為叫學生綽號就是親近的表現

  認為遺書上講到男朋友 所以寫的人一定是女生

  因為班長比較堅強 所以找他幫忙 忽略班長實際也可能有需求 有狀況

  那些有點"膚淺, 暴力"的關心方式

  到最後成長為 讓他們知道 我在這裡 真誠的表現出 自己是一個傾聽對象

  同時也很喜歡導演安排最後跟鄭sir聊天的 是一個沒提及過的學生而不是Vincent


  兩幕相對的場景:

  夜裡下公車時手機響起 看到的是 學生自殺

  與結尾處 白天下公車時 手機響起 是學生想找鄭sir傾訴

  也訴說著這些改變往更有希望的方向前進



  依舊

  遺憾是給留下來的人的

  鄭自雄在最後 說 記不起有傑的臉 只記得他說對不起

  在這之前 記錯他的年紀 從喪禮上也感覺得出 他在親戚面前怎樣說這個孩子

  (親戚:死的那個比較笨的

  弟弟也只能在日記裡回憶 以及自責 自己的冷眼旁觀


  總覺得是一部蠻亞洲的電影

  這種"功課好才有存活價值"的壓抑

  不管韓國 日本 香港 台灣 這種價值觀屢見不鮮

  看過不少 很努力 但仍然考不好的同學

  他們早已自信心受挫 卻仍以分數判定努力程度 並責備 責罵


  真希望能真的遇到有傑sir:

  就算功課沒交 考得不好 也不會責備 而是問他 你是否過得不開心



  ~~~~~題外話~~~~~~~


  再次感謝光年老闆

  自從看了 藍色恐懼 然後被拉進今敏大神的世界後

  對於老闆的品味非常有信心 很多部也都對到電波

  期待老闆持續引進好片 讓我能再多看到更多寶藏 <3







  --'
