url: https://www.ptt.cc/bbs/movie/M.1702112016.A.DBE.html
title: '[好雷]《年少日記》不那麼共感，或許是因為仍懷希望'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看到《年少日記》裡父母對小男孩學業、才藝的要求，才想起自己也曾經歷過那段時光。

  然而這段共同的情景，並沒有讓我因此從電影中找到共鳴，反而我們刻劃出了截然不同的

  生命弧線。


  太冷、太極端的惡之堆疊絕對是其一，可是後來想想，或許是台灣的社會始終更能讓我們

  成為「想成為的大人」。不一定有所成就，但至少擁有選擇大部分快樂的自由。


  喜歡程度和《白日之下》差不多，然而《年少》的敘述性、鏡頭語言詭計，兩條時間軸上

  每一場戲滿滿對於角色間關係的暗示都明顯高上一籌。


  （以下有雷）


  其實我和小男孩、雪兒一樣會透過玩偶，自己和自己對話。


  或許是因此才更不喜歡，也不能理解他們放棄吧。


  部落格短評原文：


  --


  部落格：

  FB粉專：


  --'
