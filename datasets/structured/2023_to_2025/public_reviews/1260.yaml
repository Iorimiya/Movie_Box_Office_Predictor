title: '[好雷] 年少日記-與自己和解'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看到大部分的心得著重在

  有傑、高壓、自殺、憂鬱症

  我想來聊聊有俊的部分


  -


  對有俊而言哥哥有傑的死

  「都是我害的」

  如果我沒有只顧著讀書當爸媽心中的好孩子

  如果我沒有在他請教我學業的時候不理他

  如果我可以在全班嘲笑的時候站出來幫他說話

  如果我可以多陪他聊天給予擁抱

  是不是有傑就不會死了呢？


  自殺者遺族的心理把所有錯都怪罪到自己身上

  變得厭世也厭惡自己

  討厭爸爸把他逼死的同時也討厭自己沒有救他

  甚至害怕失去而覺得不如什麼都不要擁有






  「我寧願以後都獨自生活，也不想再看到身邊的人離開，直至遇上你」






  有俊遇到了林雪莉

  他從她身上看到有傑的影子

  那熟悉的對著娃娃說話的身影

  讓他願意慢慢解開心鎖去重新感受愛


  然而一切並不是那麼順利

  雪莉全家要搬到國外

  在有俊心裡那句

  「人跟人之間沒有永遠，因為大家始終都會離開」

  的念頭又出現了

  他想讓她留下告訴她有多愛她

  但他不敢也不願開口






  「但你好像不快樂，等你準備好了再來找我」

  雪莉理解有俊，不強迫而是溫柔的告訴他這句話






  在未來的某天兩人再次相遇結了婚

  以為這次真的能夠永遠

  然而一個懷孕的消息卻讓這一切再次破碎


  有俊還沒做好當一個好爸爸的準備


  童年的回憶再次侵襲他

  他以為放著不再提起事情就會過去

  內心的傷痛就會痊癒






  直到有俊的爸爸病危

  有俊聽到那捲

  已經充滿雜訊無法修復的錄音帶

  那時他才知道，爸爸也是愛有傑的

  只是不知道該如何表達

  對於有傑的死爸爸也很自責


  「你還記得傑仔嗎？我已經記不起他的樣子，我只記得他一直跟我說對不起…」

  「我常常夢到有傑，他已經是一個老師…」


  父子相擁一起面對過去的傷痛

  沒有人遺忘過只是都埋在心裡的最深處






  最後，有俊終於勇敢的面對自己內心的結

  向雪莉告白心裡的秘密


  只有直面自己過去犯的錯

  正視內心的恐懼與脆弱

  最終與自己和解

  才能真正讓心的缺角長出

  重新擁有給予愛與被愛的能力


  --

  哈哈對是雪兒，因為只記得英文是Sherry就直翻雪莉了'
