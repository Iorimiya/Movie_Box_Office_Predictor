  《衝出迷境》Away觀後小記：早在《喵》之前


  《喵的奇幻漂流》金獎導演，耗時三年半一人獨立製作，會想推薦給創作者和遊戲玩家的

  作品。


  觀影體驗很像在玩遊戲，創作者應該會很感動。

  ／

  美景在前方，推動的是死亡。還有生命的憐憫。



