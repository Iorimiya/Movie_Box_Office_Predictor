url: https://www.ptt.cc/bbs/movie/M.1744430286.A.8C8.html
title: '[好雷] 衝出迷境'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  拉脫維亞導演Gints Zilbalodis與小團隊憑藉著開源動畫軟體製作出《喵的奇幻漂流》，

  一舉打進最高殿堂奧斯卡，不但順利抱回最佳動畫長片，也讓世界看見來自波羅的海三小

  國之一的創作能量。事實上，6年前，當時24歲的導演就以一人團隊之姿做出《衝出迷境

  》，一鳴驚人。現在回頭看來，的確不如《喵的奇幻漂流》出色，但已能看出他說故事的

  能力與作品的成熟度，至於幾年後的《喵的奇幻漂流》，儼然是另一個等級。



  少年揹著降落傘在陌生異地醒來，黑色靈魂緊隨在側試圖吞蝕他，他只能憑一台摩托車、

  一只背包，及一隻小澄鳥的陪伴，克服心中恐懼，展開冒險。



  電影當中出現不少動物，不像《喵的奇幻漂流》裡明確點出各個動物所扮演的角色，《衝

  出迷境》賦予觀眾更多的想像空間。少年離開禁忌綠洲之後，遇見的第一個動物是鹿，他

  們沒有什麼互動，但鹿就這樣被黑色靈魂給吞噬；棲息在夢泉旁的貓群，透過觀察與經驗

  累積，懂得避開泉水湧出的時機，把握時間補充水分，最後同樣進入黑色靈魂之口。導演

  可能想藉機告訴我們，安逸的生活固然美好，但若不思進取，停滯不前，終究沒有未來，

  但這就是觀眾見仁見智的主觀看法了。



  比較清楚的或許是從禁忌綠洲就一直陪伴著少年的小澄鳥，不過，牠究竟是每個人心裡的

  另一個面向，還是人生路上來來去去的朋友，也是一個大家各自解讀的謎。威脅到小澄鳥

  性命，迫使牠學會飛行的狐狸，則可能是成長過程中那些討厭但卻能夠有效逼我們快速進

  步的困境。至於烏龜，或許是與少年相對的表徵，只要立定目標與方向，即便前進速度較

  為緩慢，只要持續精進終能成功，至少不致落入黑色靈魂手中，倘若不幸翻身，也能獲貴

  人相助度過難關，人生不就如此嗎？



  《衝出迷境》採章節敘事，分為四段：禁忌綠洲、鏡湖、夢泉與雲港，彷彿是成長的各個

  過程。禁忌綠洲代表著尚無憂無慮的童年，資源豐沛、無所畏懼，也是極為適合學習新事

  物無限跌倒再爬起來的地方；鏡湖是探尋與認清自我之處，少年在此與小澄鳥分別，但是

  ，與朋友的別離不見得是老死不相往來，只是暫時走上屬於各自的道路，有緣都能再次相

  見；夢泉象徵學習如何把握機會；雲港則是目標與夢想的起點，越靠近目標，困難與阻礙

  往往越發強烈，坡陡雪急。最重要的是，即使雲港近在眼前，也不代表可以停止奮鬥，一

  關過完還要繼續往下一關挑戰，就像整趟旅途中，少年不斷穿越的拱門一般。



  黑色靈魂可能代表每個人深層的恐懼，要離開禁忌綠洲需要勇氣，所以少年畫下黑色靈魂

  的圖像。他當下或許沒有細想該如何突破，但當他找到一個裝滿冒險裝備的背包，又看到

  一個受黑色靈魂圖樣包圍的骷髏頭，少年突然意會到，就算手握地圖，若是沒踏出第一步

  ，那一切都是枉然，遂拿起摩托車鑰匙開始練習。學習新事物的過程難免磕磕絆絆，但克

  服恐懼的過程便是如此。



  成長到某個時刻，我們都會希望是動力與希望驅使我們向前，而非在後追趕的恐懼，少年

  便是在此時推下大石，讓黑色靈魂墜入谷底。但是，如同心理學的內在小孩，黑色靈魂可

  能還是會在未來的某一天從深淵爬出，回來找我們麻煩，但過往耕耘過的友情或許會在此

  時伸出援手。經歷過這一切，即便在我們覺得即將成功之時，還是會有更多的恐懼不停湧

  出，如何關關難過關關過、見招拆招便是我們在遊玩人生這場遊戲時最需體會的秘笈攻略

  。



  《衝出迷境》中少年的這場冒險就像是人生，按照地圖往目標邁進看似很簡單，但其實必

  須先裝備自己。成長過程中結交的朋友，有時候沒有什麼原因就不再往來，雖說沒有交惡

  ，但回想過去歡樂的時光，總會覺得有那麼點可惜。漫長的旅途裡，難免會有很多需要獨

  自前進，度過日夜更迭，跨越四季風景的時光。有的時候，甚至會在遵循指示之後，發現

  前方死路一條，而此時還需要一點放手一搏的勇氣，才能繼續向前邁進。是啊，人生真的

  很難，但正是有這些同行的夥伴與路上的景致，才更顯得有趣。



  最後，如同《喵的奇幻漂流》，電影中有許多水的意向。《喵的奇幻漂流》裡的黑貓，從

  一開始怕水，到不小心跌進水中後不得不克服恐懼努力朝目標前進，最後能夠怡然自得地

  在水下悠遊，《衝出迷境》裡的少年也不例外。他固然沒有從怕水到玩水的轉變，但水從

  一開始的資源，變為照進個人內心的明鏡，再到最後是必須一躍而下的唯一出路，對少年

  來說意義的轉變同樣不小，也陪伴著他成長。



  總的來說，《衝出迷境》雖不如《喵的奇幻漂流》來得明確與直接，但可以讓100位觀眾

  看完有100種不同的體會也是另一種對話與互動。從短片創作開始，就能看出導演對於無

  對白動畫的掌握能力，隨著這兩部長片問世，並奪得各大獎項，相信未來講到動畫，拉脫

  維亞肯定會浮現在觀眾腦海裡。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
