title: '[新聞] 鵝城縣長馬邦德新作《古董局中局》31件真'
content: '鵝城縣長馬邦德新作《古董局中局》31件真實西漢古董比演員還「貴」


  14:16 2023/05/26 中時 翁紫曦


  《古董局中局》劇照，圖中為葛優。



  《古董局中局》劇照，圖中為辛芷蕾。



  《古董局中局》劇照，圖中為雷佳音。



  《古董局中局》劇照，圖中為李現。



  冒險劇情片《古董局中局》定檔於6月2日全台上映，改編自知名作家馬伯庸同名小說。一

  尊從日本歸還的佛頭文物，卻牽扯出一場糾葛幾十年的古董迷局，由香港導演郭子健執導

  ，雷佳音聯手葛優、李現、辛芷蕾，群星雲集，演員陣容堅強，電影更為了拍攝的畫面，

  特別借到31件珍貴的西漢古董，讓雷佳音都忍不住驚呼：「沒有想到道具比演員還要貴啊

  ！」


  《古董局中局》由《救火英雄》香港導演郭子健執導，集合實力派票房巨星《長安十二時

  辰》雷佳音，以電視劇《親愛的，熱愛的》和《去有風的地方》人氣大爆的李現、還有演

  出《如懿傳》中反派妃嬪而人氣高漲的辛芷蕾，還有殿堂級影帝葛優共同演出，故事層層

  翻轉，環環相扣，鑑定古董兼關關解秘，精彩燒腦作品，在大陸上映時創下15億台幣的票

  房佳績。


  演員們談到參演本片的原因，紛紛表示被實力堅強的製作班底吸引。雷佳音透露是衝著葛

  優接下《古董局中局》，他表示葛優不但演技出色，就連拍攝現場也因為他笑聲不斷，「

  大爺演戲特別的大爺，在片場經常以老謀深算、詼諧幽默的方式套路導演，讓片場一片歡

  笑聲。」而李現覺得看葛優演戲是一種享受的過程，作為後輩從葛優身上學習到很多。而

  辛芷蕾透露葛優是一個特別童真的人，會在片場和大家一起打雪仗，也會圍繞一句台詞問

  「十萬個問題」，直至符合角色的需求。葛優對演戲專業嚴謹的態度影響了全劇組，因此

  電影中很多精彩瞬間都是在這樣的碰撞中創作而出。演員戲裡的好感情也延續到戲外，在

  分享拍攝趣事時，雷佳音讚李現是「江湖裡的搶手貨，眼鏡一戴，誰能不愛」，而金絲眼

  鏡的造型，是李現看完劇本後自己提出加上的，他認為更符合角色從國外留學回國的形象

  。


  《古董局中局》以古玩為主題，電影中各種道具細節當然馬虎不得，為了拍攝道具，劇組

  向古董專家以專人運輸的方式，借用了31件西漢的古董，個個都是千年珍寶。電影中許多

  畫面，都是出現貨真價實的古董，拍攝期間大家都小心翼翼，深怕一個沒注意破壞到這些

  無價之寶，即使道具中的贗品也不是隨意找一些容易買到的假古董來充場面，而是劇組深

  入研究，一比一還原，甚至3D打印做出，讓雷佳音忍不住調侃：「這部電影的道具比演員

  還貴！」


  --'
