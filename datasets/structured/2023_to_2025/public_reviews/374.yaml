title: '[負雷] 奧德蓋任務'
content: '先說結論

  說難看也不會讓你看到生氣

  要說好看 則完全不沾邊

  就食之無味 棄之也不會可惜的那種電影




  稍微防點雷











  這裡懶得用名字稱呼兩個男主角

  方便分辨就用老男主跟小男主來稱呼


  劇情就是

  老男主手關節炎手術之後想要回歸殺手職業

  但組織決定要用新血於是叫老男主訓練小男主


  照劇情描述老男主就是組織最強殺手

  小男主則是最強新人


  所以第一場戲就是兩人出一個任務

  老男主就想證明自己還可以出任務就一個人上場

  結果關節炎發作沒命中目標被目標的兩個保鑣圍困

  最後是小男主出來救場 殺掉兩名保鏢跟目標


  先說整部片感覺最俐落的殺人橋段

  就只有這段小男主出來救老男主的這一段 大概五秒


  而且拍攝手法是用老男主躲在角落還在想辦法時

  從邊邊模糊出鏡的小男主出來瞬間殺掉兩個保鏢

  所以基本全靠腦裡自動補出john wick 的感覺


  小男主呢

  有種刻意要區別過往電影所有會表現的殺手類型

  感覺就一路人

  穿著刻意休閒風 棉衣棉褲五彩繽紛

  槍還放在類似霹靂包或是迷你斜肩包裡


  老男主因為受傷完全看不出來有多厲害

  只能聽別人描述


  但整部片結束你還是看不出來老男主曾經是最頂尖的殺手

  而且對手全部也看不出來有殺手的感覺

  也沒辦法用襯托的方式襯托出老男主很厲害

  小男主除了第一場戲理俐落的殺了三個人

  之後就因為中計受傷被抓到片尾也沒有表現的機會了

  到底最強新人是怎麼個強法 也是問號


  因為我是臨時起意要看的

  事前沒看過預告跟任何介紹

  看完電影查了查才發現

  網路上推薦的感覺都是業配


  查了電影宣傳的描述

  老男主是喜歡參加派對喝酒幽默風趣受女生歡迎的殺手

  但是電影拍的很沒有說服力

  夜店場景頗多但就單純喝酒跳舞純過場的感覺

  如何幽默風趣是完全看不出來

  感覺比較像下班之後去酒吧喝一杯的感覺

  劉玉玲跟老男主片尾親了起來

  但他們如何認識化學反應什麼的都看不出來

  劉玉玲整部片的戲份剪掉也完全沒差

  包含她跟一個男生約會的戲也完全不知道要表達什麼


  小男主最強新人只有描述殺人過程中都會傷及無辜

  整部片也看不出來有什麼殺人的癖好

  全都是用講的


  宣傳還有說組織其實背後還有大陰謀

  電影裡就是組織要兩個男主消滅另一個組織的高層

  老男主說自殺任務要放棄但被組織逼迫接下任務


  說好的自殺任務

  拍的手法就是 看到目標在房子裡看電視

  屋外層層保鏢但感覺也就10人左右


  兩個男主一分鐘後就出現在屋內面對目標

  如何穿越重重保鏢 沒演

  如何破解保全系統 就是手機拿出來5秒跑個程式結束


  目標想要收買老男主殺掉小男主

  原以為目標會講出組織真正的陰謀 沒有

  老男主天人交戰 也沒有

  中間有個插曲就是目標的孫女突然出現

  老男主收槍 小男主則是舉槍對著小女孩

  用這個方式表現小男主會傷及無辜

  但觀影感覺就只是反射動作


  最後簡單殺掉另一個組織的高層

  如何安全逃離現場 沒演


  毫無難度的進去 毫無難度的離開


  最後就是兩個男主的老闆被另一個組織的人殺了

  以前組織的其他殺手也叛變了

  小男主中計受傷被抓走

  老男主要去救他


  照理說片尾了要大高潮戲了吧

  但我已經不知道要怎麼描述片尾的戲

  就普普通通


  整部片

  女主角 沒必要

  老男主小男主革命情感 看不出來

  槍戰場面 很普通

  組織經營 還有陰謀什麼的 看不出來


  我想也許真實生活中殺手就像電影裡演的那樣吧

  整部戲平凡到我的文筆只要有正常人程度都會不小心描述的比電影好看

  真的好奇的人就自己去電影院看吧！






  -----

  Sent from JPTT on my iPhone


