url: https://www.ptt.cc/bbs/movie/M.1762064730.A.137.html
title: '[好無雷] 鬼聲泣3'
content: '本集的劇情部分，其實算另外一段獨立故事，對於沒追過前兩集的人來說，一樣能直接觀

  看。雖然一定會對人物個性或故事背景感到陌生，但不至於影響整體觀影的理解，畢竟本

  集才是真正揭開「寄生靈」起源的關鍵篇章。



  當然本片賣點依舊是一家人的超高顏值！演了三集，可以明顯看出演員對角色的掌握更純

  熟，彼此的默契也更自然。



  開場前段花了十多分鐘營造家人情感的濃度，不論是那張飯桌、收音機、全家福，或是妍

  恩的遺照，眼尖的人應該會發現每一集都會入鏡，而這些東西也成了「鬼聲泣」系列的象

  徵性符號。對系列粉絲來說，那份懷舊感真的會讓人不自覺的嘴角上揚啊！



  至於本片由於換了導演，嚇人手法已不再拘泥於傳統的Jump Scare套路，驚嚇點雖然變得

  不多，但玩法卻更加靈活，讓觀眾在享受恐佈之餘，還增添了惡趣味的歡樂氛圍，讓整體

  觀影感受從首集的懸疑弔詭變成了娛樂有趣。



  另外，也不禁想虧一下～～身為一部泰國電影，特效居然可以這麼棒，幾乎直逼好萊屋的

  精緻水準了！認真覺得這部的特效比《絕命終結站：血脈》好很多！而且音效的部分真的

  是很氣勢滂沱，後面根本就在給我一種看動作鉅片的錯覺XD



  只是不知道是要說男主角太強大還是劇情太虛幻，這集大概算本系列最不恐怖的一集了吧

  （恐怖程度：1＞2＞3）雖然常有和鬼怪肉搏的緊張畫面，但整體更像是「靈異版的秘境

  探險」。



  雖然劇情上還是存在瑕疵，但導演成功營造的娛樂已足以淡化這些缺點，加上後段反轉更

  凸顯出整體張力，讓這部看似成為餘燼之作的續集，又重新燃起了燦爛的焰火！



  對我而言，雖然稱不上今年最恐怖，但卻是今年看得最放鬆、最好玩的一部鬼片，認真覺

  得觀影體感比同樣帶著情懷去看的《厲陰宅：最終聖事》還要過癮很多！至於本系列好看

  排行程度（1＞3＞2）（1懸疑恐怖/2動作劇情/3動作冒險）。









  前一天沒睡飽，然後又下雨降溫，帶著頭痛一整天的狀態來看這部，結果看到一半頭竟然

  不會痛了！原來好看的鬼片不只可以療癒心靈，還可以治頭痛！



  662







  --

  你還是可以去看。只是有時候會提到第二集的事件可能會略為不懂，然後這集的風格跟第

  一集會差很多！但劇情邏輯，跟1.2集差不多。'
