title: '[情報] 《鬼聲泣3》中文版預告釋出'
content: '台灣昨天（9/26）釋出《鬼聲泣3》中文版預告




  拔牙代表拔走靈魂





  第3集時間線來到1976年（第1集1972年/第2集1975年）


  從預告來看～這集應該是換小妹遇難了


  看起來惡靈又跑去擾亂他們家


  因爲第一集惡靈原本只要吃掉妍恩


  但卻一直被男主角對付


  所以在牠被男主角幹掉之前


  揚言說要把主角全家都吃掉


  所以還會出續集也不意外


  而且泰國票房又很好（直接回本20倍以上）


  就繼續看男主角物理驅魔吧！！








  《鬼聲泣3》預計10/31在台灣上映



  這系列泰國都有IMAX版


  因為不同片商引進 台灣只有第一集才有


  希望跟厲陰宅一樣會引進IMAX


  看鬼片有IMAX才爽





  第一集被惡靈吃掉的二妹



  好喜歡二妹這個演員(才21歲）～但可惜就這樣被賜死



  《鬼聲泣》改編泰國暢銷小說，算是泰國家喻戶曉的電影，然後只能說他們周邊特典還真

  豐厚，看來又要大賺一筆了！！



  第一集泰國票房5.6億泰銖（約5.28億台幣）

  第二集泰國票房8.15億泰銖（約7.68億台幣）


  --


  上次看到泰國網友KUSO會有5集XD

  劇情確實比較複雜

  第一集懸疑恐怖、第二集黑色喜劇

  其實我蠻喜歡那種嚴肅的氛圍，恐怖倒是其次，不要那種既然是鬼片又摻半搞笑或溫馨愛

  情元素就好了，現在就一堆這種NG片，厲陰宅4就是這樣...

  不知道欸，但她有出席（上面Po的那張）3的記者會，媒體有問她會不會回歸，只看她開

  玩笑的轉頭問導演說「我能被採訪嗎」、「我能回答媒體的問題嗎」。但後續的宣傳她就

  完全沒出現過了

  真的被二妹圈粉，我大概80%因爲她而喜歡鬼聲泣XD'
