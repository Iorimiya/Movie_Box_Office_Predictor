url: https://www.ptt.cc/bbs/movie/M.1708245269.A.6A8.html
title: '[好雷] 為什麼討論鬼聲泣的人這麼少？'
content: "如題　誠心發問\n\n前幾天我去看了　覺得還不錯\n\n女主角顏值高\n\n恐怖的部分也有達標　雖然我覺得很大一部份是靠音響在嚇人的\n\n但每到了晚上的劇情真的會給人很重的壓迫感\n\
  \n\n\n\n\n\n\n底下有雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n直到劇情到了中後段　我忘了是第一個道行比較淺的大師\n\
  \n還是後面比較厲害的普特大師　\n\n說了一句\n\n「白天的時候這個鬼的力量是比較弱的　即便如此事態也已經如此嚴重了\n\n　因此我們更要利用白天的時間做好事情」\n\
  \n看到這裡總算是鬆了一口氣了　\n\n你們終於有人想起要趕快利用白天多做事　實在受夠了每到晚上的恐怖劇情　\n\n因此好像看到了女主角得救的一線曙光　\n\n\
  給人一種安心的感覺\n\n然後就是急轉直下... 越後面越恐怖\n\n\n\n末尾　正當我們以為這個犧牲了兩位法師　換來女主角的救贖\n\n也以為男主角　那位大哥　應該是沒有錯過任何步驟　該做的都做了\n\
