url: https://www.ptt.cc/bbs/movie/M.1730374393.A.D2D.html
title: '[好微雷] 《鬼聲泣2》完結篇'
content: '#小心微雷



  《鬼聲泣2》延續首集泰國北碧府家族真實故事！有看過第一集的人自然就能輕鬆接上第

  二集！



  第一集主要是在敘説主角這家人遇上鬼的故事，而在第二集，除了會揭穿擁有歷史悠久的

  寄生靈來歷之外，也會與經過數百年得以修煉而成的《鬼咒語》迷昏眾人的邪靈來場精彩

  大對決！



  除了上述，導演很用心讓不少細節更加以回味第一集的故事，像有一幕預告大姐說「如果

  妍恩還在就好了」就是呼應第一集妍恩在遊樂園說的「如果亞克也在就好了」，對於有認

  真看過前一集的人來說，裡面很多台詞聽起來都格外有感！



  除了經過很有設計的台詞以外，不論是第一集裡所出現過的鬼咒語、收音機受到某種力量

  干擾、被邪靈附身的老翠、透過拔牙吸取靈魂的黑魔法，甚至還有男主展露身材的動作戲

  碼以及妍恩死後現身等等片段，無疑的在第二集會是更加精彩重溫。然而最有趣的是在第

  一集裡不免俗會有個降智行為的角色ㄧ死不信邪的老爸，在本片卻變成了最怕鬼但卻也是

  最顧家的父親了！



  至於恐怖程度方面，對於抱持著只想被嚇的人就會略感失望，因為很明顯看得出來導演並

  不想走第一集乾澀老套的嚇人路線，雖然這次Jump Scare的花招算還蠻驚艷的讓我無法預

  知，但更多的是加入了溫馨和各式幽默的喜劇橋段，不難看出導演不單只想抓住恐怖片這

  塊小市場，而是想擄獲更多恐怖片以外的族群喜愛，但也因為成功運用上這些不失尷尬的

  幽默和譏諷，讓整部片不論在恐怖氛圍還是搞笑方面都是雙雙得分，因此時常在氣氛緊張

  到一半的時候又忽然傳來一陣笑聲！








  --

  如果最後有補個結婚戲碼又或者來個出其不意的大反轉就更完美了XD

  根據故事，寄生靈本來就存在於泰國東北那座森林了，而劇中的女鬼為了強化自己的能力

  ，所以片頭開場時誘惑一名差點戰死的士兵吃掉祂的舌頭並達成協議，但士兵那時並不知

  道鬼這麼做不是有意要救他，而是要從他身上獲取更大的能量。但也因為這樣才導致那名

  身受重傷的士兵往後都變成不死之身的妖怪（半人半鬼），所以大家在找上他的時候以為

  那些寄生靈是他養的！

  有！第一集提到這女鬼很狡猾，專門找優質的身軀，因為妍恩出生沒多久得過瘧疾，後來

  康復後就再也不曾生病，所以女鬼選中她。而原本女鬼只打算把妍恩吃掉而已，但亞克一

  直對付祂，所以在祂弄死妍恩之前，揚言說要吃掉他們全家！'
