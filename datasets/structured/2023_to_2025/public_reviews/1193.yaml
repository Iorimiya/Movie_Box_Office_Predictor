url: https://www.ptt.cc/bbs/movie/M.1730646740.A.16E.html
title: '[好無雷] 很舒服的泰式鬼片《鬼聲泣2》'
content: '今年看了很多恐怖類型的鬼片


  但其實好幾部實際上都是假鬼片


  因為每次都會被那種放了一堆鬼的預告片或是有鬼字的片名騙進去看那種「人比鬼恐怖」

  的電影


  每次進去看以後才知道明明都是人造的孽、自食惡果


  不然就是邏輯不通、虎頭蛇尾！



  但是《鬼聲泣2》不會


  它帶領觀眾一探泰國民間傳奇ㄧ寄生靈


  走進泰國東北部渺無人煙的鬼魅森林裡探索這個未知的大自然


  而且喜歡這種裡面沒有在跟你談因果關係


  世界上就是真的有惡靈的存在！而祂來侵犯人類！


  真的好久沒有這股清流了


  這才是貨真價實的正宗鬼片、超自然恐怖片！


  重點還有加上顏值爆表的演員！


  好久沒有一部看了可以很舒服的泰式鬼片！














  剛看到消息說鬼聲泣準備要籌備第3集！


  --

  真的！她是泰美混血

  劇情很多連貫第一集尤其是他們講的話，但是如果單純享受泰國文化或鬼怪的話不用看1

  ，這部鬼怪非常飽滿！

  連爸媽都是嗎？

  這部很多地方都走幽默路線 但是一開始還有好幾幕都有被JS挫到

  我覺得不會很血腥 有些對話很逗趣XD

  第一集的焦點都在二妹身上 第二集就變男主角幫二妹報仇

  是因為鋪陳很久節奏太慢嗎？可是我覺得第一集那種懸疑感比較是我喜歡的風格XD

  我發現很多好評電影到網飛就變負評！電影院還是最佳觀影感受'
