title: '[普好雷] 鬼聲泣2比1好很多'
content: '其實我不知道為什麼1這麼受歡迎 氛圍有出來

  妹妹一個比一個正 哥哥算帥~就這樣


  不過第二集看起來因為有賺錢 預算多了不少

  個別看還是有缺點 前面有版友提過

  拆兩條線~ 但第一條線變成抓鬼突擊隊

  哥哥肌肉版超級趙又廷變超猛變鬼獵人

  之後因緣際會找到一隊人 要主動去抓女鬼可能的主人(也是鬼)

  但這邊交代的很隨便 感覺就是為了闖鬼陣而闖

  一票人莫名跑去送死打鬼 不過最後鋪反轉是也有其意義

  整段路上闖入鬼叢林的冒險也還算ok


  第二段就回到家人身上 上次倖存的大妹要結婚

  結果鬼拾回了她的宿儺手指(誤)變強回來

  開始虐全家 這邊中間追逐戰也是不怎麼合情理

  但反正也不解釋 就是爽片追殺給觀眾看得

  不過最後險死還生的超級趙又廷 帶著秘密武器回來救全家

  (二哥超衰 一直被虐)最後跟妹妹聯手用障眼法再次斷鬼的宿儺手指

  變弱之後就被超級趙又廷反虐 狂虐 猛虐虐到死


  最後這邊真的還蠻爽的 中間一些笑點也不錯

  喜歡看鬼片的 或者當周末當娛樂片都算及格囉~


  --'
