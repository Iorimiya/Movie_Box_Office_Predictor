url: https://www.ptt.cc/bbs/movie/M.1730559930.A.947.html
title: '[好雷]鬼泣聲2'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  本來想看懼裂的，因為一些原因沒看成

  所以看了看選了同樣恐怖片，

  而且出產自泰國的鬼泣聲2


  就像其他人評價的，這部片顏值不錯，可是好看的主要是男生

  年輕的主配角都蠻帥的

  尤其男主，相當於湯姆克魯斯合體超人的等級


  而惡鬼感覺應該就是男主妹妹的女角扮演的

  類似年輕高勝美

  其他女角就普上


  第二個優點是氣氛 恐怖氣氛營造的還不錯，泰國的特長加上有點魔戒的風格


  第三個是音樂，尤其片尾曲兩段都超好聽




  但缺點是劇情以下皆雷

  主要是一堆不知道幹嘛的劇情

  和完全不必要的角色











  尤其去森林的那段

  帶了一堆沒必要，甚至是累贅的人

  以為很強大，打扮像達文西的男巫嚮導

  一開始就領便當了

  然後是根本不知道為什麼要帶來的兄弟二人組，一個看起來一開始就該死，毫無理由的拼命

  挑釁怨恨男主，一個是啥也不懂啥也不會的羊羔，

  一個負重的也沒看他帶裝備


  毫無發揮發揮任何正面作用



  --'
