url: https://www.ptt.cc/bbs/movie/M.1706151716.A.9A5.html
title: '[好雷] 鬼聲泣 (Death Whisperer) | 顏值很重要'
content: "◎ 片名：鬼聲泣 (Death Whisperer)\n◎ 類型：恐怖/驚悚\n◎ 年份：2024\n◎ 片長：2小時00分\n◎ 分級：輔導級15+\n\
  ◎ 國別：泰國\n◎ 發行：威視電影\n◎ 簡介：1972年的偏遠村莊，一名少女夜裡聽見疑似「聽呀」的怪聲後，短短幾天內便離\n奇身亡......。少女慘死的消息很快在小村莊傳開，得知消息的大哥Yak（納得克庫吉米亞\n\
  飾）決定從軍營返家照顧全家人。某日，小妹Yam（拉塔娃蒂婉通 飾）放學時遇到一名樣貌\n詭異的黑衣女子後，乖巧的她突然性情大變，有時異常暴力，有時無故瘋狂尖叫，午夜夢迴\n\
  時，甚至會中邪般重複唸著令人毛骨悚然的「聽呀…聽呀…」，詭譎「陰聲」逐漸蔓延到這\n個家中…….。\n\n\n\n◎ Ryan簡言之：顏值是本片最大的亮點，結合了泰國鬼片的血腥邪門與歐美恐怖片的運鏡\n\
  、劇情節奏，以恐怖片題材來說是有一定水平的作品。\n\n◎ 短評：\n從運鏡、劇情編排可以感受到本片除了泰國鬼片的調性，更多了幾分歐美恐怖電影元素，前\n半段的醞釀很有邪靈附身題材的營造，後半段又轉向走了個家庭團結一心打怪的路線，尤其\n\
  大哥開車載一行人那段根本在玩遊樂場的恐怖過山車吧？！但有了演員們的顏值應該什麼都\n能合理，片尾的伏筆或許可以期待一下未來有續集的可能性。\n\n◎ 綠豆糕指數：7塊(滿分10塊)\n\
  \n\n-Ryan的電影綠豆糕-\n一位很需要電影、小說、遊戲作為生活養分的人，\n在這裡純粹想把看過的電影都紀錄下來，以自己能無壓力的寫、大家也能輕鬆讀的半張稿紙\n\
  篇幅(但看心情啦~有時就幾句話有時可能超過)，聊聊對於電影、影集作品的一些想法、感\n受。\n\n\n\n\n--\nSent from my Google Pixel\
  \ 6 Pro\n\nPiTT \n\n--\n\n\n真的 精神 物理攻擊都有\n真的不只人多、鬼也多，而且一言不合就開詠唱技能\n\n真的賞心悅目很重要啊\n\
  這部台灣相對少人看\n劇情真的不是這部的優勢 挺多地方都在合理邏輯邊緣XD\n先抱歉可能沒有講得很清楚，這不是什麼電影專業用語啦 只是想描述偏向歐美恐怖片調性\n\
  的運鏡感，像是片中很常使用重點情節後開始將配樂下的很重再拉遠景，如那棵大樹、主角\n家的屋外的幾幕，呈現一種詭譎、惡意感\n\n真的整部都在帥\n真的 光這點直接加很多分\n\
  個人覺得畫面、特效上頗有水準啦 劇情編排是真的相對弱很多\n\n哈哈顏值高好啊\n真的講個話都一定要擺姿勢 捲袖子 使眼神\n無論如何都不能遮到三頭肌\n可能Allen大想說務農可能相對給人樸實感\
  \ 單純一點，確實這六位兄弟姐妹都散發著光芒XD\n覺得氛圍真的很可以啊\n也沒很了解這塊 可能為了省電嗎？蠟燭比較省\n片尾曲真的好聽\n沒錯~ 要是被看上的優良體質"
