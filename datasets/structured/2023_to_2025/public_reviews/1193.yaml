url: https://www.ptt.cc/bbs/movie/M.1729085765.A.541.html
title: '[新聞] 《鬼聲泣2》刷新泰國影史紀錄'
content: '新聞網址：

  1377287009.html


  去年泰國上映的《鬼聲泣》於當地刷新疫後影史最高票房紀錄5.2億以後，導演隨即喊接

  拍續集，而今年10月10日《鬼聲泣2》於泰國上映後，票房再度刷新影史紀錄，不但預售

  票先是締造泰國史上最高紀錄，上映首日便衝破8000萬票房，成為影史上首日最高票房紀

  錄，而上映至今短短不到六天時間已於當地累積超過4億票房（折合新台幣約3.9億元）！


  至於《鬼聲泣》首集大賣是否會對續集票房感到有壓力，納得克說：「我個人沒有任何壓

  力，很感謝大家對第一集的迴響非常熱烈，走在街上、坐在摩托計程車上，或搭乘大眾交

  通工具，都會遇到很多人跟我打招呼，以及討論《鬼聲泣》和亞克，甚至還有同人小說的

  出現。我相信《鬼聲泣2》將會好好地滿足觀眾的需求，也包含更多動作戲，請大家拭目

  以待。」


  而《鬼聲泣2》不但帶動泰國影城股價上漲，導演還說很可能繼續拍第3集，且台灣方面也

  隨著泰國這波熱潮來襲，將於10月31日正式上映，而《鬼聲泣2》最新中文版預告今天也

  正

  式出爐。


  《鬼聲泣2》中文版正式預告




  【劇情大綱】


  《鬼聲泣2》延續前作故事，敘述妍恩死後三年，大哥亞克持續追捕殘害妹妹的黑衣鬼，

  與此同時，大姊妍德即將結婚，他們不知道的是，有個不速之客將迫使他們再度面對三年

  前的恐懼…。




  《鬼聲泣2》上映首日隨即打破泰國影史首日最高8000萬票房紀錄！



  《鬼聲泣2》上映三天票房突破2億。



  《鬼聲泣2》上映不到一週票房再突破4億。



  《鬼聲泣2》上映八天（10/18）票房再突破5億。



  《鬼聲泣2》票房累計至10/21再突破6億，已超越首集5.2億票房紀錄。



  --

  其實男主角當時有說對第一集沒有抱太大的期許，因爲受限於改編真實事件不能太過浮誇

  。但據說第二集沒有完全翻拍小說所寫的（寄生靈/黑衣鬼擁有兩本泰國暢銷小說），照

  理說第二集會是完結，但如果票房那麼高也可能繼續拍下去

  換車庫引進不知道有沒有IMAX了

  （有雷）不推第2集的意思是不好看嗎？我是看到泰國網友在猜邪靈是不是最後附到大姐

  的未婚夫身上！而且男主角上節目被主持人問及會不會有第3集，男主角回說就看邪靈有

  沒有被他殺死！感覺這句話有涵義

  其實我覺得是好看的 今年鬼片如果沒在接下來即將上映的微笑2給超越的話 我會覺得鬼

  聲泣是今年最好看的鬼片'
