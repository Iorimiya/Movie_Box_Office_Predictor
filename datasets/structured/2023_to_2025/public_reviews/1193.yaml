url: https://www.ptt.cc/bbs/movie/M.1720080317.A.553.html
title: ［情報］鬼聲泣2 泰版首波30秒預告來襲
content: '去年「鬼聲泣」在泰國上映後，於當地開出5.2億泰銖天花板票房，折合新台幣超過5億元

  ，不但成為疫後最賣座正宗鬼片，還擠進泰國影史恐怖片票房排行榜的第7名紀錄，當時

  更掀起一波電影市場熱潮。


  而在台灣2024年1月19日上映後，便賣出10萬張電影票，是既2023年9月7日「鬼修女2

  」上映以來最高的正宗鬼片票房紀錄！


  而根據泰國有線電視第3台的消息，「鬼聲泣2」在今年2月底時已舉行開鏡儀式，並在3月

  1號發布記者會，預計將在今年10月10號於泰國當地上映，並與IMAX版同步上映。而目前

  台灣上映日期尚未明定，需等片商引進後，後續上映時間將指日可待！


  就在昨天「鬼聲泣2」首波前導預告也隨之出爐。






  07/04 16:51

  我覺得泰國有一部電影（鬼片）也很猛 在電影院看當時我記得被Jump scare超用力的嚇

  傻至少5次...而且嚇點又很新穎讓人措手不及

  真的 走恐怖喜劇就算了

  邪厄我也有看 那部主要是巫術 劇情也很猛 跟鬼聲泣純粹鬼片風格不太一樣

  鬼真的強 而且我也很喜歡那種不是因果關係的劇情 有點像鬼玩人、鬼修女那類型 看鬼

  搞死一票人很符合我的胃口XD

  其實我一直覺得鬼影還好，但我知道這是大部分人心中無人能敵的鬼片。也是滿恐怖的但

  是以現在電影技術再回過頭看那部就覺得普普。我當時看鬼影前半段男主角駝背的時候就

  有猜到女鬼是坐在他肩上'
