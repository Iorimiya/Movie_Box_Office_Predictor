  \n可是女主已經掛了看起來續集也不可能回歸？\n\n\n\n感想：　原來那個看起來很有兩把刷子的普特大師　也是個兩光？　\n\n\n這部片還可以啦　我是覺得有70分起跳　大家來討論看看\n\
  \n--\n   大姊確實顏值也很高\n   感謝提供資訊"
