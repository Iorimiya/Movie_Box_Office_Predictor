title: '[新聞] 看一部【猛鬼聲泣泣】抵看三部破億泰片！'
content: '新聞網址：



  泰國年度現象級恐怖喜劇《猛鬼聲泣泣》，即將在本週五（7/5）於台灣爆笑獻映。本片

  被泰國觀眾譽為「泰國爆笑編年史」，導演普安農（Poj Arnon）大膽嘲弄這一年當中，

  泰國各種政治與社會時事，以及當紅的賣座電影，也讓本片在當地熱賣超過1.3億泰銖票

  房。不僅如此，這回他在劇情中融入去年在泰國斬獲超過7億泰銖票房的《送葬人》，以

  及超過5億泰銖票房的《鬼聲泣》，這兩部票房最高的泰國電影元素，讓主角們進入送葬

  人身處的鬧鬼村莊，在那邊發生一連串讓人又驚又笑的事件，尤其更邀請到演出《送葬人

  》的演員阿查里亞斯里塔（Archariya Sritha），以及演出《鬼聲泣》女鬼的燦帕盛蓬（

  Champa Saenphrom）加盟演出，可說是讓台灣觀眾觀賞本片，等於一次觀賞到三部泰國破

  億電影，CP值飆升到最高點！





  由知名導演普安農執導的《猛鬼聲泣泣》，是風靡泰國影壇17年，家喻戶曉的恐怖喜劇《

  頑皮鬼》系列宇宙的第十部新作，故事獨立，就算沒看過前作也不用擔心看不懂。本片在

  劇情主軸之外，也以幽默調侃方式，旁敲泰國這一年當中發生的各種社會與政治事件，因

  此被觀眾譽為「泰國爆笑編年史」。本片更完全跳脫過往故事場景，甚至挹注更多製作預

  算與特效內容，甚至取材2023年在泰國斬獲超過7億泰銖票房的《送葬人》，以及超過5億

  泰銖票房的《鬼聲泣》，這兩部票房最高的泰國電影元素，將兩部電影的角色結合在一起

  ，並調侃發生在泰國的各種年度事件。



  值得一提的是，導演更請來《送葬人》當中詮釋送葬人的阿查里亞斯里塔，以及《鬼聲泣

  》當中的女鬼燦帕盛蓬一同軋戲，在開場就上演7億對上5億的票房PK。只見人鬼殊途在片

  中隔空叫囂，結果一言不合就開打，送葬人更使出「7億氣功」試圖逼退女鬼，恥力完全

  無極限。電影一開場就下猛藥，觀眾勢必將笑到落下巴。





  值得一提的是，除了兩部破億鬼片在開頭PK之外，《猛鬼聲泣泣》的主支線情節也相當紮

  實，讓本片在泰國上映首日，便收穫2000萬泰銖超高票房，上映四天更輕鬆突破5000萬泰

  銖票房，順利勇奪泰國首週票房冠軍，總票房更突破1.3 億泰銖，不僅成為2024泰國年度

  票房第四名，也成為《頑皮鬼》系列票房最高的作品，絕對是今年最驚奇好笑的恐怖喜劇

  ，台灣觀眾更可透過觀賞本片，一次網羅三部泰國破億電影。



  這部在泰國熱賣超過1.3億台幣票房的年度現象級電影《猛鬼聲泣泣》，即將在本週五（

  7/5）於台灣爆笑上映。本片這次更從一開始就找來專業泰文譯者，根據正片進行原譯，

  之後並找來曾為《辛普森家庭》（The Simpsons）等電視動畫進行中配版的「魯蛋叔叔聲

  創工作室」合作「創譯」改編，盡最大力量呈現符合台灣觀眾所能理解的笑點，值得台灣

  觀眾進戲院一探究竟。本片劇情描述在各地從事滅鬼工作的桃姐（賈圖隆摩喬克飾演），

  請來小幫手胖糕（科蒂阿拉姆博伊）協助管理自己經營的男生宿舍。就在桃姐前往一處神

  祕村莊時，兒子柯伊（威勒帝史馬來飾演）突然中邪，讓桃姐除了決定幫柯伊復原之外，

  一方面也打算解開柯伊的中邪謎團。不過，她卻發現自己陷入這個村莊的捉鬼行動當中。

  當她深入搜查時，還遇到村裡最陰魂不散的女鬼…。究竟這村莊發生了什麼事情？女鬼的

  神秘過去又是什麼？而柯伊又能否從中邪當中恢復過來呢？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
