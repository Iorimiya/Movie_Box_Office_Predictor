url: https://www.ptt.cc/bbs/movie/M.1761910335.A.9A3.html
title: '[好雷] 今年最好看的鬼片《鬼聲泣3》'
content: '劇情一開始約15分鐘先鋪陳、回味家庭的溫馨戲碼


  看三集了！就是超喜歡他們親情的互動


  每個演員演技也是進步神速


  一個眼神一個動作就能展現彼此默契


  15分鐘後大概就進入鬧鬼的警戒狀態


  全程都沒有什麼拖戲的情節


  而且這集更跳脫傳統老舊式Jump Scare手法


  突發驚嚇並不多


  每個恐怖的畫面都非常創新


  根本不會想到下一秒會怎樣恐怖


  反而是換導演 步調比前兩集快很多


  自己抱持著不好看的心態去看


  還以為會很難看


  結果卻是出我所料的爽快！！！



  然後特效方面～


  我說這是泰國電影耶


  竟然接近好萊屋等級的完美


  而且這系列的音效一直都很氣勢滂沱


  這集依舊～甚至更優




  真心覺得～雖然這可能不是今年最恐怖的鬼片


  但卻可能是今年最刺激、最好看的動作爽片


  看來今年我心目中覺得最好看的恐怖片


  非鬼聲泣3莫屬了


  明天可以放心來去二刷了XDD







  如果前兩集都有追的人


  最後結局根本淚灑電影院！！！


  然後最後也會有個小彩蛋！




  --

  二刷是因為明天原本就有約了別人去看！這片至少讓我覺得二刷值得 不會看了心情差

  有一些演員之間的連貫或劇情呈現的方式可能會看不懂，但單純看特效或聽音效可能會對

  泰國電影刮目相看就是了

  是的！但說真的這集其實跟2好像沒什麼關～這集就純粹演另外一段故事了XD

  看完馬上想到電影開場播的大蟒蛇預告 只是變成是鬼

  可是我覺得很合我的胃耶XD'
