title: '[新聞] <猛鬼聲泣泣>緊抓時事收錄"三性混戰"短片'
content: '新聞網址：



  泰國於本月18日通過同婚法案，成為繼台灣、尼泊爾之後，亞洲第三個同婚合法化國家。

  這讓泰國LGBTQ族群欣喜若狂，其中也包括長年關注同志議題的知名導演普安農（Poj

  Arnon）。向來會在自己作品中融入同志元素的他，這回執導票房突破1.3億，並號稱「泰

  國爆笑編年史」的現象級恐怖喜劇《猛鬼聲泣泣》，就在本片於泰國正式上映前十天，當

  地發生了震驚社會的「素坤逸路11巷之泰菲第三性大亂鬥」事件，也讓導演緊抓這個熱門

  議題，明明電影都已經完成所有拍攝與後製，卻緊急在事件持續發生的當下，於素坤逸路

  11巷臨時加景補拍，甚至邀請當時在事件中的泰國第三性們共同加入拍攝，真實還原事件

  始末，成為片尾當中的驚喜彩蛋。導演也透露想以這段緊急加拍的彩蛋影片，表達「團結

  就是力量，請用愛與微笑來取代暴力」的理念，值得台灣觀眾進戲院一探究竟。





  「素坤逸路11巷之泰菲第三性大亂鬥」事件，起源於今年3月3日晚上，少數幾位泰國與菲

  律賓跨性別者發生小規模衝突，後來演變成隔天3月4日淩晨，二十多名菲律賓跨性別者，

  襲擊兩名泰國跨性別者；由於寡不敵眾的關係，最終導致該兩位泰國跨性別者慘敗，網路

  上還流傳他們被扒光的慘況。這種人多欺負人少的情況，引發泰國跨性別族群不滿，最終

  演變成數百名泰國跨性別人士，聚集在打人菲律賓跨性別人士居住的酒店門前進行抗議的

  衝突。這場衝突更在社群平台X（前稱Twitter）上炸鍋，一度成為泰國熱門話題冠軍。



  由知名導演普安農執導的《猛鬼聲泣泣》，在劇情主軸之外，也以幽默調侃方式，旁敲泰

  國這一年當中發生的各種社會與政治事件，因此被觀眾譽為「泰國爆笑編年史」。尤其本

  片完成所有剪輯工作，並將在3月14日於泰國上映，卻因為3月4日發生的這場社會事件，

  以及所引發的討論熱度，讓向來關注同志議題與同志人權的導演決定臨時加景，並在3月6

  日晚上在素坤逸路11巷進行拍攝，試圖真實還原事件始末。當天拍完再花費兩天時間，於

  8日完成剪輯並重新送審，準時在14日於泰國正式上映。雖然這段補拍的彩蛋短片，劇情

  獨立，跟本片主線劇情沒有正相關聯，但台灣片商也將保留這段影片，原汁原味呈現給所

  有台灣觀眾，一窺當時事件的場面。





  《猛鬼聲泣泣》這段「素坤逸路11巷之泰菲第三性大亂鬥」彩蛋影片，拍攝的高度機動性

  ，也讓泰國業界為之咋舌。導演普安農對此表示：「我們不支持第三性互相毆打，我們想

  從『群體團結』的角度來看待這起事件。泰國人民，如果我們受到欺負，就必須奮力反抗

  ，不能侮辱我們的尊嚴。」他更對臨時加拍的行為補充：「我們可以向觀眾保證會如期上

  映。事實上，電影雖然已經完成審查，但現在我們補拍，會再度要求重新送審，因為我們

  將會涵蓋這個事件的場景。」值得一提的是，導演也邀請當時在事件中的泰國跨性別者們

  參與拍攝，並找來泰國知名變性女拳擊手圖姆帕里尼亞（Tum Parinya）助陣入鏡，一同

  為本片增添色彩，值得台灣觀眾進戲院一探究竟。



  這部在泰國熱賣超過1.3億台幣票房的年度現象級電影《猛鬼聲泣泣》，即將在7月5日爆

  笑上映。本片這次更從一開始就找來專業泰文譯者，根據正片進行原譯，之後並找來曾為

  《辛普森家庭》（The Simpsons）等電視動畫進行中配版的「魯蛋叔叔聲創工作室」合作

  「創譯」改編，盡最大力量呈現符合台灣觀眾所能理解的笑點，值得台灣觀眾進戲院一探

  究竟。本片劇情描述在各地從事滅鬼工作的桃姐（賈圖隆摩喬克飾演），請來小幫手胖糕

  （科蒂阿拉姆博伊）協助管理自己經營的男生宿舍。就在桃姐前往一處神祕村莊時，兒子

  柯伊（威勒帝史馬來飾演）突然中邪，讓桃姐除了決定幫柯伊復原之外，一方面也打算解

  開柯伊的中邪謎團。不過，她卻發現自己陷入這個村莊的捉鬼行動當中。當她深入搜查時

  ，還遇到村裡最陰魂不散的女鬼…。究竟這村莊發生了什麼事情？女鬼的神秘過去又是什

  麼？而柯伊又能否從中邪當中恢復過來呢？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
