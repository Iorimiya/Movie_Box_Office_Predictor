title: '[無雷] 挑戰者-超級好看'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  應該無雷


  挑戰者

  本來想說只是打發時間看看 大概就一般三角戀電影

  沒想到超級好看


  單純說三角戀太小看這部電影了

  應該是四角戀 (加網球)


  zendaya(演超好 根本生涯演技最佳)

  喬許歐康納(屌超大)

  麥克費斯(身材很好)


  三個人飆戲超好看   整部戲幾乎沒有冷場(除了有一段慢動作很煩)

  實在很難只用情慾電影來形容這部片


  不愧是摳咪掰油唸導演

  真的很厲害  可以把這個劇本拍成這樣


  甚至網球的比賽畫面也拍得很精彩


  很推薦一看  今年好看前三吧  其他兩名還在排 應該有沙丘2

  (都有zendaya 雖然沒特別喜歡她)


