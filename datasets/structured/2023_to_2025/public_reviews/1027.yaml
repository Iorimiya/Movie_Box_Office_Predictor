title: '[無雷]  不是運動片的挑戰者'
content: '沒看預告片就進去戲院了，才發現這部片不是運動片，是情慾片，而且很難看，把一件簡單的三人行刻意弄得很複雜，完全看不出三個人有熱愛網球的部分


  很多橋段讓人想大翻白眼，雖然劇情偏寫實風，但男生女生很多舉動都很突兀又很尷尬，根本不會是現實裡會有的互動。大家說不錯的電子配樂一開始用的很有意思，後來已經疲乏了


  只有少數幾顆打網球的鏡頭很帥很有速度感外，其他真的沒什麼好看的


  評分：5.7/10


