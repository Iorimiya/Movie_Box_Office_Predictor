url: https://www.ptt.cc/bbs/movie/M.1714145359.A.220.html
title: '[好無雷] 《挑戰者》網球 x 感情 x 熱血'
content: '《挑戰者》8/10分


  【網球 x 感情 x 熱血】


  進場前不抱期待地

  想說又是運動熱血傳記之類的


  沒想到出乎意料

  剛開始看 以為在講網球

  看到中間 原來是在講感情

  看完之後 其實講的一直都是網球啊…


  別於其他的運動劇情片

  《挑戰者》以兩男一女的愛恨糾葛

  貫穿整部片

  再佐以網球賽試的提味

  調配出一盤別出心裁的好料理


  不只是劇情方面

  《挑戰者》在許多運鏡、構圖、慢動作、配樂上

  都有許多巧思

  儘管我覺得有些不是這麼搭 或是篇幅太長

  但這些手法的確提高了整部片的豐富度以及新鮮感

  讓觀眾在劇情交待之間不會感到疲乏


  而我雖然不是女主角辛蒂亞的粉絲

  但她在片中確實魅力滿點


  Btw片中有些情慾畫面拍得很好

  充滿挑逗與勾引 卻同時具有質感與氛圍


  總之

  很值得一看的運動劇情片叻



  --


  更多無雷的 電影/影集 短評在ig 歡迎追蹤：




  --'
