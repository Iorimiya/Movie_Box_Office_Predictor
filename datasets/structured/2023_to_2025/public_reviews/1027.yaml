url: https://www.ptt.cc/bbs/movie/M.1687280582.A.13F.html
title: '[討論] 《挑戰者》預告'
content: '影片連結：



  【以你的名字呼喚我】、【窒息】、【骨肉的總和】導演盧卡格達戈尼諾的全新作品，由

  MCU【蜘蛛人】系列的千黛亞主演。


  預告一開始以為是運動勵志電影，結果中間出現各種激情橋段XD


  預計2023年9月上映。


  -


  之前沒有發摟到這部的消息，不知道板上各位期不期待？


  不得不說千黛亞的戲路其實算廣，在MCU外的表現也算不錯。自己看完預告是挺期待的。




  --

  謝謝你的重點截圖（？

  確實，瓜導每次出手都讓我驚艷，這次也是衝著他點進預告的。

  謝謝大大再次的重點捕捉。'
