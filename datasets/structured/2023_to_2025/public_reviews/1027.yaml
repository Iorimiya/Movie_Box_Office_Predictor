  \ 臭臉 下秒擁吻 上秒吐口水 下秒車震上床 像極了愛情?!\n宛如廢片 \n)\n\n\n\n本片當競技體育片看實在過於微妙\n\n有沒有懂網球的來說說?\n\
  \n以 ATP Tour (剛好對應 Art Tashi Patrick 男女男三人) 來說\n\n十幾年來 球王 Art 從來沒贏過 Patrick (長期外圍\
  \ 偶爾 Challenger Tour 晉級)\n\n跟住五星飯店 Ritz-Carlton 的 Art 比起來\n\nPatrick 車上睡 沒睡飽 沒啥東西吃\
  \ (跟人乞食)\n\n比賽有意無意 Code Violation 送 Art 局數\n\n答應 Tashi 要求打假賽輸球 屢次有意無意發球失誤 Net 等等等\n\
  \n這個沒啥好勝心的 Patrick 還可以多次 duce 平局到最後一回\n\n觀眾難道不會覺得 Patrick 的實力 >>>>>> 除了美網皆奪冠過的球王嗎??\n\
  \n是不是我不懂網球啊? 跟網球王子比起來誰更唬爛?\n\n--"
