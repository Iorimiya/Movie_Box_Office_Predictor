title: '[極好雷]  挑戰者-勝利女神的挑逗'
content: '觀影後，興奮感爆發，最末在影院中不禁與朋友們驚呼聲來，然後是爽快地大笑。


  很久沒有這樣激動的感受，像是一場激烈而爽快的性愛。


  這大概又是被預告片所耽誤的電影，在檢討自己應該相信導演，而非預告片。




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  原以為是部三角愛情的呢喃，卻是一部勝利女神的神話故事，被勝利女神注視的兩人如水

  與火，她樂於挑逗著兩者，卻永遠專情網球，她的真愛從來沒有變過，她深愛水與火之間

  競賽時的光芒，一如片中提到的唯有那刻、當下，只有網球。而後人生的每一個選擇也都

  只有網球，誰能夠給她精彩的比賽她就選誰。


  代表勝利的她要的從來不是兩者的注視，她說過比賽是種關係，她每一刻都認真無比地面

  對對手，即便是在大學也是，這是她追求對網球的態度。所以最後當水與火回到起點，最

  終局眼神終於從女主角身上移開，落在彼此身上，帶起的微笑爽快地享受比賽，這正是她

  要的激情，是喝啤酒的那一夜，三人互吻最後她躺在床上滿意地看著兩人吻得難分難捨，

  這段對應著最終局的戰役，她興奮地看著兩人又再次注視著彼此，纏鬥的來回像是最初那

  個吻，纏綿悱惻。


  最終局的鏡頭真的每分每秒都在我的點上，ＣＯＭＥ　ＯＮ。


  真的很爽。



  --'
