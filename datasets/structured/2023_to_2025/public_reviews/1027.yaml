title: '[好雷] 挑戰者Challengers'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  可能是盧卡·格達戈尼諾的片子，目前我最喜歡的一部。


  過去與現在交錯的節奏、音樂收放、人物性格都融入在網球對決上，隱喻用得令人血脈噴

  張（？），直到最後都無法猜測結局。三位主角的關係，隨著挑戰賽決賽的比分，回望過

  往的時光，一切就像最初千黛亞角色所言，網球比賽是一種戀愛關係，但微妙的是當千黛

  亞的角色成為贏家的獎賞時，兩位男主角與網球的關係（以及與彼此的關係）就變了調。

  再次找回純粹原初的愛已是十三年後。


  一直知道導演很會拍複雜的感情戲，只是沒想到可以用網球談關係談到如此極致。尤其是

  兩位男主角的戲，棒透。盧卡·格達戈尼諾太會拍男角（鼓掌），期待兩位男演員未來的

  發展。


  至於結局，似乎有人說不懂。嗯，我自己是看到結局心中叫好，直接加十分：這就是愛上

  網球的一刻啊。當他們都走到網球選手最後時刻，當他們秘密掀開了底牌，當他們追到最

  後的搶七，當他們抱在一起...導演真的是非常非常會，非常懂得結局的力量。



  ***


  這裡是我的樂園:




  --'
