title: '[好雷]《挑戰者 網球就像性愛 心靈合一就能高潮'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  我一直以來對於瓜達尼諾的作品

  並沒有很喜歡

  即使是CMBYN我也覺得很無趣

  上一部《骨肉的總和》更是十分厭惡

  所以這部上院線時沒興趣看

  今天閒來無事打開來看

  竟然非常對我胃口


  劇情簡介:

  為了讓先生從最近的連敗中振作起來，從網球員轉任教練的她，讓舉世聞名的大滿貫冠軍

  丈夫參加「挑戰賽」，結果對上他的昔日死黨…同時也是她的前男友。


  乍看之下以為是二男爭一女的傳統故事

  雖然從預告以及知道導演過往作品後

  肯定能知道一定也有男上加男的情節

  但其實故事核心還真的是兩位男主Patrick跟Art身上

  女主人公塔希也時常說出"我是你們的Homewrecker"


  Patrick跟Art第一次遇見塔希時

  在海邊夜晚聊到什麼是網球

  塔希其實就說出了本片的主題

  網球是一種relationship

  在某一個時刻

  站在球網兩邊的雙方

  完全了解彼此

  連觀眾也投入其中

  彷彿就像談一場戀愛


  Art則回應說塔希在白天的青少年女子決賽打出致勝球時喊出come on

  就是那種感覺吧

  塔希點頭微笑回應

  這裡我的解讀是這種感覺就像高潮一樣

  電影中塔希另外一次喊出come on就是在結尾

  下面會提到


  兩位男主人公

  雙方背景相同都是富家子弟

  一起在寄宿學校練網球還組雙打

  雙方十分有默契

  一個手勢、一撇眼神對方都能心領神會

  連Art第一次打手槍都是Patrick教的


  在遇到塔希的當晚

  三人在飯店房間接吻

  塔希大概是史上最勇敢的腐女

  一直誘拐兩位男生接吻在一起

  兩位男主接吻大概有30秒吧

  意外的是兩人事後也沒有尷尬

  腐女們大概可以腦補他們早就接吻過很多次了


  隔日Patrick在青少年男子決賽打敗Art

  順利地拿到塔希的號碼成功交往

  然而高中畢業直接打職業賽的Patrick

  跟上大學的塔希、Art

  在性格、球商差距太大

  後來塔希練球受傷

  Patrick也從此與兩人分到揚鑣

  之後塔希轉當教練幫助Art拿了6座大滿貫

  兩人也在一起結婚生孩


  2019年的時間線

  Art對繼續打網球感到疲憊

  然而他們夫妻的關係是塔希在掌控

  Art處於被閹割的狀態

  在一場輸球後

  塔希安排打一場低階的挑戰者系列賽

  希望恢復Art的信心

  然後重遇了在網壇浮沉世界排名兩百多名的Patrick

  此時的Patrick窮困瞭倒

  連住汽車旅館的錢都沒有

  但之後透過塔希的嘴

  觀眾可以知道其實Patrick家境富裕有基金會


  注意一點

  儘管Art在網壇成就比較高

  但是他從未在比賽中打贏過Patrick

  兩人在決賽相遇

  先後各拿一盤

  過程中塔希一副不甚關心神遊於場外的模樣

  原來她在比賽前一晚要求Patrick故意輸球

  第三盤末Patrick故意雙發失誤讓Art拿到賽末點

  然而Art也查覺到了

  他憤怒的故意不接發球讓局面進入搶七


  電影畫面接下來是一連串Patrick與Art的蒙太奇

  觀眾可以感受到Art感受到的

  也就是Patrick不讓了

  他要認真打了

  此前一直神遊於場外的塔希也緊張了

  雙方一來一往來回抽球

  塔希眼神跟著球頭跟著轉

  此時場中央對打的兩人以及塔希

  甚至包含裁判跟觀眾

  進入了當年三人在夜晚聊網球是什麼的狀態


  網球是一種relationship

  雙方完全了解對方

  這不僅是像談一場戀愛

  更像是一場做愛

  亢奮的Patrick與Art來回的抽球

  就像是陰莖在肛門裡來回抽差

  球越打越靠近網前

  電影配樂節奏越來越快

  塔希盯著球目不轉睛彷彿也融入到這場性愛裡

  Patrick回一個高球

  Art跳起來準備扣殺

  忘我的Art身驅飛越了球網

  Patrick拋掉了球拍

  雙手接住Art抱著他

  兩人相擁

  觀眾掌聲沸騰

  塔希大喊一聲Come on

  然後接一個用力的吐氣Ah ~

  這是因為塔希也高潮了


  雖然電影就這麼結束在這一幕

  但是可以想見頹廢的Patrick跟疲憊想退休的Art

  他們絕對又重新燃起了打網球的熱情

  這到底是不是塔希為了讓感情羈絆極深的兩位男主人公故意安排的?

  也許吧


  至於三人關係裡誰更愛誰

  Art是沒有表現出同性戀傾向的

  所以他是真的愛塔希

  塔希在兩位男人中則是更愛野性的Patrick

  但是他們也註定無法像塔希與Art一樣走的長久

  Patrick在滑交友軟體時顯示他對男性也感興趣

  某年在三溫暖Patrick遇見Art的對話

  顯示Patrick比較在乎Art

  屢次跟塔希勾勾纏倒像是在搏關注


  因為這部片我不討厭瓜導了

  難得他拍了一部我能接受他自溺的電影


  --'
