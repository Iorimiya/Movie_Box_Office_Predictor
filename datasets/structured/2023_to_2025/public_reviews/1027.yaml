title: '[新聞] 《挑戰者》口碑爆棚 網球甜心尋找自我認同'
content: "《挑戰者》口碑爆棚 網球甜心尋找自我認同\n\n2024/05/01 05:30\n\n\n辛蒂亞主演《挑戰者》，表示女性能從中找到自我影子。（華納兄弟提供）\n\
  \n〔記者鍾志均／綜合報導〕導演盧卡格達戈尼諾執導新片《挑戰者》聚焦網球場上的愛情\n角力，也有令人神魂顛倒的情慾魅力；該片上週在美國首週開出1500萬美金（約台幣4.89\n\
  億元）票房，創下盧卡格達戈尼諾在美國生涯最佳開片紀錄，口碑爆棚。\n\n女主角辛蒂亞說：「塔希（角色名）的初戀可說是『網球』，網球賦予她力量和權力，使\n她成為自己的樣子。」透露本身也是透過工作尋找自我認同。\n\
  \n她進一步說，「塔希盡全力去控制一切，也要控制自己的感情，從生活中獲得她想要和需\n要的一切，我想許多女性都能在塔希身上看到自己的影子。」\n\n盧卡格達戈尼諾盡可能將電影拍得充滿「娛樂性」，他說：「我想要觀眾光看到大銀幕上\n\
  的影像就能感到很愉悅，對我來說，這就是最崇高、最純粹的電影形式了。」《挑戰者》\n今起在台上映。\n\n--\n 佛教的\n 是菩薩成佛之道\n       \
  \ 是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
