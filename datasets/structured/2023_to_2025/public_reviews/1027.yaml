url: https://www.ptt.cc/bbs/movie/M.1718632662.A.E4E.html
title: '[好雷] 人生《挑戰者》的三個面向'
content: "內文有雷且具個人觀點，推薦觀影後再讀。\n\n　　　　本片已上映數週，有意請把握場次。\n\n\n\n　　　　圖文網頁版：\n\n　　　　\n\n\
  \n　　　　預告片：\n\n　　　　\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\
  \n\n\n人生《挑戰者》的三個面向\n\n\n\n　　知名導演盧卡格達戈尼諾的全新電影《挑戰者》用不斷插敘的方式交代\n\n三人的過往與複雜關係：才華洋溢但因為受傷而中斷的塔希鄧肯，丈夫亞特\n\
  \n唐納森體貼內向，前男友派屈克茲威格直率狂野，與亞特曾是打網球的夥伴、\n\n對手，更是中學就同居的死黨。乍看之下是環繞著網球、相互糾纏的三角戀，\n\n三人都展現了各自的孤獨與欲望。塔希因傷失去了選手生涯，亞特失去了朋\n\
  \n友，兩人的婚姻彌補了空缺，塔希成了亞特的教練，將他推向選手的最前線；\n\n亞特在到達顛峰後，不再有爭勝的欲望，意圖退休，但很明顯這讓塔希失望。\n\n在這同時，已然落魄、再次出現的派屈克，帶著過去未盡的欲望和未曾發揮\n\
  \n極致的實力，請塔希當他的教練，與這對夫妻舊情復燃。\n\n\n\n　　三人都是彼此的第三者。塔希的出現，使兩位友伴進入競爭關係；亞特\n\n在塔希與派屈克失和之後，成為塔希的伴侶；而塔希與亞特日漸疲軟的婚姻，\n\
  \n因為派屈克的加入而陷入緊張。\n\n\n\n　　塔希曾說：網球不只是一項運動，更是一種關係。我不曾看過網球，只\n\n從別人的文章得知：網球是必須孤獨面對、教練在場外無法給予任何指示的\n\
  \n運動。而所謂的三角關係，「第三者」往往是催化劑。亞特與派屈克無法言\n\n明的同性情愫，掩藏在競爭之下，而塔希的優秀，既刺激他們爭奪，更刺痛\n\n他們的自尊，儘管在內心深處，或許他們都希望能夠「三人行」，但爭勝的\n\
  \n欲望卻又使他們彼此遠離。\n\n\n\n　　但看到最後，我忽然體會到，這三個角色正好象徵了是「人生挑戰者」\n\n的三個面向：塔希是「堅強」，她可以同時掌控象徵「脆弱」的亞特與「逃\n\
  \n避」的派屈克，對他們有強烈的吸引力，就如同亞特曾說「誰不愛你呢？」\n\n而「逃避」永遠擁有臨陣脫逃與置身事外的魅力，也無法面對「堅強」，故\n\n而兩人能給彼此帶來最深的傷害。當塔希受傷，不得不放棄選手生涯，仍然\n\
  \n沒有放棄網球，試圖從當教練找回自尊並維持熱愛的同時，也擁抱了「脆\n\n弱」，亞特則在「堅強」的輔佐下發揮最大的潛力，但這不是亞特的志趣所\n\n在，所以在婚姻多年之後，塔希害怕亞特放棄而迷失人生方向，亞特則害怕\n\
  \n一旦沒有了成就，就會被塔希放棄，一如脆弱之時，最渴望得到的是「無條\n\n件的愛」。而逃避長大、也總是在「比賽還沒結束就以為獲得勝利」以致逐\n\n漸落魄的派屈克，不願被塔希指點，而是攻擊她一味求勝的脆弱；但最害怕\n\
  \n擁抱脆弱（亞特）的，卻正是派屈克本人。\n\n\n\n　　所以最後那一幕，不只是突破三人關係的心結，亦是堅強、脆弱與逃避\n\n的和解。\n\n\n\n--\n\
  一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\n                          \
  \        陳斐雯  貓蚤札（其三）\n\n--"
