url: https://www.ptt.cc/bbs/movie/M.1713800401.A.24F.html
title: '[新聞] 辛蒂亞不懂網球演高手 《挑戰者》舞出架式'
content: "辛蒂亞不懂網球演高手 《挑戰者》舞出架式\n\n2024/04/22 05:30\n\n\n辛蒂亞在《挑戰者》飾演的塔希尋求自我認同，她表示感同身受。（華納兄弟提供）\n\
  \n〔記者許世穎／台北－洛杉磯連線報導〕今年目前評價最高的電影之一《挑戰者》，於台\n灣時間昨凌晨舉行國際線上記者會，導演盧卡格達戈尼諾率領主要演員辛蒂亞、喬許歐康\n\
  納、麥克費斯等人出席。3人在片中飾演極有天賦的網球高手，辛蒂亞自爆對網球一無所\n知，「訓練第一天我一直把球打到樹上！」\n\n\n導演盧卡格達戈尼諾（右起）、麥克費斯、辛蒂亞、喬許歐康納日前一同出席《挑戰者》\n\
  洛杉磯首映會。（華納兄弟提供）\n\n辛蒂亞透露拍攝前3人有近6週的時間進行網球訓練，「這是一個挑戰，令人恐懼，我認為\n我們所有人第一天都非常緊張！」她笑說怎麼特訓都不可能成為網球高手，索性配合導演\n\
  盧卡的分鏡當作編舞，「我是一名舞者，所以把它跳出來，我不會成為一個高手，但我確\n實可以假裝是！」\n\n\n麥克費斯（左起）、辛蒂亞、喬許歐康納在《挑戰者》上演火辣的網壇三角戀。\n\
  （華納兄弟提供）\n\n該片上演火辣的網壇三角戀，辛蒂亞日前於首映會上表示，希望觀眾不要對她飾演的「塔\n希」太嚴苛。她昨解釋，塔希不討人喜歡，應該也不會在乎人們是否喜歡她，「我在首映\n\
  會上那樣說，是因為我覺得我們天生就會對人們做出評斷，所以很容易會對這些角色進行\n批評。」\n\n辛蒂亞形容塔希的初戀就是網球，因為網球賦予她力量和權力，使她成為自己的樣子，「\n\
  這一點我能感同身受，因為我也是經由我的工作找到許多自我認同。」當片中塔希受傷後\n，必須設法重新定義自己，希望控制一切，「我想許多女性都能在她身上看到自己的影子\n\
  。」\n\n辛蒂亞大讚這部電影的美妙之處，就在於人的想法會改變，「因為我知道我每次看它我的\n想法都會改變，老實說，我對這些角色也有先入為主的觀點，但透過每個演員的表演改變\n\
  了看法，他們賦予了這些角色生命。」《挑戰者》將於5月1日在台上映。\n\n--\n\n 是菩薩成佛之道\n        是 佛經\n  是 佛       \
  \ 是 菩薩\n\n\n\n--"
