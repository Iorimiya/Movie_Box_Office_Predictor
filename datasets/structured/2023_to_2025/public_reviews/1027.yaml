url: https://www.ptt.cc/bbs/movie/M.1414852198.A.37B.html
title: '[討論] 《鐵達尼號》愛情片王者 能被超越嗎'
content: '版上各位電影茼蒿、帥哥正妹晚安


  剛剛電影台終於又播了一次《鐵達尼號》


  經典中的經典又重新回味一次


  想到都過了這麼多年


  還有甚麼愛情片的後起之秀能挑戰這部片嗎？



  不管是劇情、規模、音樂特效、耗資、視覺特效....當時的轟動程度


  甚至是『片長』幾乎都封頂了吧~




  說起片長還真不是蓋的


  還記得當時第一次看時年紀還滿小的


  晚上電影台有在播，


  不知不覺就這樣一直看下去


  好巧不巧看到劇情高潮處，就度估倒在沙發了


  醒來的時候鐵達尼號剛好　腰折


  沈船那段很刺激緊湊，完全災難片規模，而且jack手還被銬起來


  當時真的以為他手會被砍斷哩～



  之後有看到播出都會想把這部片看完


  還有最經典的「人體素描」　（Ａ_Ａ）


  以彌補小時候沒看到的遺憾




  雖然不管特效音樂劇本...堪稱當時一絕


  畢竟這些東西隨著日新月異，而且又能以之借鏡


  總會有實力堅強的挑戰者出現吧～


  近幾年愛情片好像都混搞笑居多，想換個類型


  蝴蝶效應算是不錯的吧～　拍了三部，不過還是差滿多的



  請問這一部集愛情、災難、動作　等的經典好片


  有能與之挑戰的實力派巨片出現嗎？







  --


  都可以喔~


  不過如果是相似類型的片更好,因為我正在找這種片



  很壯闊,差點忘了~ = = b  如過是人類相戀就更好了'
