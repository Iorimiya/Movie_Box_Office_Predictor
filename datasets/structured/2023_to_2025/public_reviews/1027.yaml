url: https://www.ptt.cc/bbs/movie/M.1422606619.A.511.html
title: '[問片] 台詞有講到挑戰者號太空梭爆炸事件的片'
content: "美國片\n\n電影這一個片段是一個男生在跟主角解釋美國挑戰者號太空梭的爆炸事件\n\n台詞內容有很清楚的提到 製作O型環的材料的耐溫程度\n原本NASA評估是可以應付佛羅里達當地的溫差\n\
  想不到太空梭發射的前一晚佛羅里達的溫度驟降\n\nO型環功能受損，太空梭因而爆炸\n\n\n因為想很久真的想不起來\n想問有沒有人可以知道是哪部電影\n\n大大感謝!!!\n\
  \n\n\n\n--\n                     HEY~~~HEY~~~CHAAAAARLIE~!\n   　    。。。。。   ◣  \
  \      \n◣\n                    ㄟ◤\n \n◤\n\n--\n\n我也有google到挑戰者號...\n但不是那部...\n\n\
  記得當時的劇情好像是要跟主角講說不要那麼篤定，很多事情意想不到之類的...\n所以舉了這個例子"
