url: https://www.ptt.cc/bbs/movie/M.1706453676.A.AE0.html
title: '[普雷] 貓王與我'
content: '傳記片如何命名，決定了觀眾對電影的預期心理。尤其影迷只要打開維基百科就能搜尋人

  物生平，如何用影像帶出主角的不同面向，同時又不拍成流水帳，都考驗著導演與編劇的

  功力。


  .

  對我來說，《貓王與我》和前陣子看的《大師風華：真愛樂章》都是反面教材。這兩部片

  不約而同聚焦名人的感情生活，既有銀色情侶的夢幻、也有步入婚姻的夢醒；前者以貓王

  遺孀普莉希拉為英文片名《Priscilla》，後者則以指揮大師伯恩斯坦的尊稱《Maestro》

  入題，但劇本對他們的另一半都描繪得更鮮明，以至於真正的主角存在感薄弱，看完之後

  對他們並沒有更深刻的認識。


  /


  電影開始，普莉希拉是個無憂無慮的九年級女孩，睜著大眼打量酒吧的一切、電影結束，

  她不過 28 歲，卻已經是個生無可戀的少婦。看來尋常的愛情故事，因為主角是貓王與普

  莉希拉而套上夢幻濾鏡，女孩愛上大明星的麻雀變鳳凰不僅是言情小說，而是真實發生過

  的羅曼史，光是這點就足夠迷人。蘇菲亞柯波拉接下導筒、加上現年 78 歲的普莉希拉親

  自背書，讓本片在威尼斯影展首映前就備受矚目。


  .

  蘇菲亞柯波拉在開場不久，就讓觀眾意識到這段銀色戀曲的弔詭之處：貓王與普莉希拉相

  差 10 歲，展開追求時她只是國中生，因此片中所有情話、凝視與親密互動，儘管拍得唯

  美，看來卻都有點彆扭 – 但這或許也是蘇菲亞柯波拉選擇執導的主因：《愛情，不用翻

  譯》的大受歡迎，讓被戀父情結驅動的少女成長故事，成為她往後的創作路線，《凡爾賽

  拜金女》《魅惑》或讓她拿下威尼斯金獅獎的《迷失某地》皆是如此。


  .

  但《愛情，不用翻譯》的成功，很大程度是建立在兩位主角處於相似狀態產生的默契，表

  面是他鄉巧遇故人的羈絆、實則對婚姻與事業的茫然，因此這份交心源於攜手逃離現實的

  不甘寂寞，加上東京情調的催化與史嘉蕾喬韓森的盛世美顏，讓這部片成為療癒無數男女

  的寂寞聖經。


  .

  但這份曖昧在《貓王與我》明顯不適用：貓王是事業上升的萬人迷，最大困擾是情緒問題

  與藥物成癮，未成年的普莉希拉只是他的獵豔對象之一；普莉希拉則截然不同，體驗世界

  的可能性在她愛上貓王的那一刻就註定絕緣，這是人生勝利組的代價。因此劇本賦予她最

  大的考驗，是被八卦雜誌告知老公的緋聞，卻只能吃醋的無能為力，疏於挖掘她的掙扎，

  也就難以觸動觀眾對人物共情。


  /


  「這些年下來，艾維斯成為我的父親、丈夫、甚至神一般的存在。」


  .

  普莉希拉在回憶錄裡如此描述她的前夫，這說明了卡利史派妮何以憑本片拿下威尼斯影后

  。乍看之下，普莉希拉對貓王揮之即來、呼之即去總是逆來順受，但她的確在劇本有限的

  心境變化描繪上，做出細微的層次：


  比如面對孟菲斯黑手黨成群的男性凝視，她在小心翼翼接近貓王的同時、仍舊有意識地閃

  避、而當她鼓起勇氣向貓王表示想出門工作、卻得到在家相夫教子的失落，卡利史派妮的

  詮釋都讓這個過於物化女性的傳記劇本，稍微跟上《史賓賽》《王冠》等更當代的女性覺

  醒腳步。


  /


  對年輕的影迷來說，貓王是個陌生的經典人物。在看了《貓王艾維斯》和《貓王與我》後

  ，我不確定如果他還在世，在現代是不是會擁有同樣人氣？前者透過奧斯汀巴特勒狂野電

  眼和激情翹臀，讓觀眾得以一窺他的舞台魅力，但難以讓他的歌曲完美置入劇情（礙於版

  權可以理解），真正體會到他的熱情與對文化的影響力。


  .

  《貓王與我》的雅各艾洛迪在造型做到更高的還原，卻僅有一場舞台表演（而且是背影）

  。之所以說本片的貓王更有存在感，是因為普莉西亞在關係裡幾乎活在他的控制下（雖是

  你情我願），一邊告訴她做自己就好、一邊又挑剔她的眼影與洋裝，許多粗暴無理的要求

  都是建立在夫妻間不對等的權力關係下，更讓他的每句台詞都是 PUA 的完美示範，宛如

  控制狂般讓人不寒而慄。


  .

  但或許也只有現在的社群時代，能夠出現這樣的作品，名人不再是高高在上的神，他們可

  能是媽寶、可能很大男人、可能有道德瑕疵，因此傳記片不再是歌功頌德的媒介，而試圖

  在去神化跟講八卦之間、取得相對真誠的平衡點 – 買不買單，就是粉絲的選擇了。



  更多影評推薦，歡迎按讚追蹤：



  --'
