title: '[請益] 「長安三萬里」的台語版'
content: '看到新聞報導


  才知道「長安三萬里」竟然還有台語版


  感覺很神奇




  不知有沒有板友已經看過「長安三萬里」的台語版了?


  想請問對於「長安三萬里」台語版觀後覺得如何?


  會覺得有違和感嗎?


  還是說會像看到星爺「唐伯虎點秋香」台語版那樣感到驚豔?




  很猶豫到底要看「長安三萬里」原本的版本呢，

  還是要看台語版呢?



  有請已經看過本片的板友提供建議參考


  多謝!





  　　　


  --'
