title: '[新聞] 大陸動畫《長安三萬里》在台上映 台語版'
content: '大陸動畫《長安三萬里》在台上映 台語版動人心




  梅花新聞網 簡立欣/專訪



  大陸動畫電影《長安三萬里》由春暉映像引進台灣。圖為春暉映像執行長孔繁芸。圖/記

  者陳思豪攝


  講述唐代大詩人李白與高適動人友情的大陸動畫電影《長安三萬里》，近日在台上映，且

  台灣發行商春暉映像公司還配了台語版。《梅花新聞網》專訪春暉映像團隊，暢談引進該

  片的起心動念，以及製作台語版的過程。


  《長安三萬里》是大陸追光動畫出品，於2023年7月28日在大陸上映，該片以唐代為背景

  ，從高適的視角，講述李白、高適等詩人的人生歷程，在大陸引發觀影熱潮，好評不斷，

  總票房超過18億元人民幣。



  大陸動畫電影《長安三萬里》講述唐代大詩人李白(圖)與高適的動人友情。圖/春暉映像

  提供


  慧眼發掘《長安三萬里》


  說到慧眼發掘《長安三萬里》的過程，春暉映像執行長孔繁芸表示，代理商的工作本來就

  是到處找好片子，之前有友人推薦《長安三萬里》，說這是近年來動畫中製作精良、影像

  瑰麗的傑作，且也屢屢獲得國際提名；春暉映像創辦人陳俊榮第一次看《長安三萬里》時

  ，更感動到落淚。於是當下決定，要將《長安三萬里》引進台灣。


  不過台灣上映之路並非一帆風順。由於台灣對大陸電影有每年10部的配額制，約60部影片

  競爭10個名額，而且要抽籤。春暉第一次沒抽中，等了1年，去年年底第2次抽籤，抽到第

  6順位，今年才得以上映。



  大陸動畫電影《長安三萬里》講述唐代大詩人李白與高適(圖)的動人友情。圖/春暉映像

  提供


  大膽拋出台語配音點子


  為何會有台語版配音的發想？孔繁芸坦言，《長安三萬里》是發片後2年才來台，對台灣

  市場來講不算太新的電影，因此春暉也在思考行銷方式。此時陳俊榮就提出台語配音的點

  子。


  孔繁芸說明，台灣有全程台語配音的電影不多，且最近一部得追溯到44年前、1981年的《

  陳三五娘》，等於台灣有很長一陣子沒有全台語發音的電影。由於李白是唐朝人，當時官

  話是河洛話，而河洛話是台語的根源，「如果能讓李白說台語，應該很不錯！」加上她自

  己讀大學時，常常在萬華龍山寺聽到老人家用台語吟詩，感覺很美，於是在陳俊榮拋出點

  子後，團隊就著手去做。


  「讓李白說台語」說來容易，執行起來卻是大工程。孔繁芸說，春暉從未配過台語版，一

  開始最困難的就是要組成工作小組，好在春暉在業界也經營一段時間，有朋友幫忙打聽，

  後來找到錄製台語的專業錄音室，裡面的台語老師工作經驗最短10幾年、最長40年，都是

  非常優秀的台語錄音演員。


  接著是決定劇本。孔繁芸說，雖然台灣不大，但是各地用詞、口音不太一樣，要找到大家

  都可以接受的台語，並不容易。最後團隊找到曾擔任許多台語節目顧問的台語專家陳世明

  。陳世明非常認真，整個看完電影之後，根據台本寫了台語台詞，他自己又整個配了一遍

  音，交給錄音老師；之後錄音室實際配音時做了適當的調整，呈現出最終版本。從找配音

  老師群、找台語顧問，到改寫台本、錄音、混音等，整個配音過程將近2個月。


  《長安三萬里》配音群中，靈魂人物是配詩仙李白的演員，團隊找到台語演員李鑼，配中

  年李白。孔繁芸說，這是因緣際會和李鑼開玩笑說，李白愛喝酒，他自己也愛喝酒，「而

  且我們都姓李！」團隊覺得李鑼的音質很適合，也和李白一樣個性豪邁，就問他是否願意

  幫忙配音，李鑼也很爽快答應了。



  大陸動畫電影《長安三萬里》講述唐代大詩人李白與高適的動人友情，李白創作〈將進酒

  〉是片中名場面。圖/春暉映像提供


  觀眾回響熱烈


  《長安三萬里》4月28日晚在台北首映，觀眾的回響非常好。孔繁芸說，台灣市場對高適

  可能比較不了解，但李白是家喻戶曉的大詩人，觀眾的接受度沒有問題。另全片48首詩，

  很多唐詩不見得琅琅上口，甚至沒聽過，團隊原先設定：雖然是普通級，但觀影群應該是

  國小高年級以上。不料首映當天有老師、家長帶著小小孩，甚至有3歲小朋友。《長安三

  萬里》片長長達168分鐘，將近3小時，小朋友居然也全程看完，且看得津津有味。還有6

  歲小朋友觀察力很強，說（中年）李白肚子好大呀，為何不減肥？童言童語把大家都逗笑

  了。


  孔繁芸分享她最感動的一幕：片中有詩人在吟詩時，台下小朋友也跟著吟誦。由於首映片

  是台語版，台上吟誦台語唐詩，台下小朋友吟誦國語，台上台下呼應，「這種感覺真的很

  美好！」


  明年9月進校園


  接下來是否有將《長安三萬里》推廣進入校園的計畫？陳俊榮說：「當然有！」春暉做台

  語版，很大原因就是要進入校園。政府現在也鼓勵台語，但很多小孩無論如何就是講不好

  台語，如果從台語詩詞開始，是一個很好的起點，也讓大家知道，台語源自河洛話，而河

  洛話可以如此完美表現出唐詩的韻味。


  《長安三萬里》進校園必須取得公播權，陳俊榮說，對此春暉做了很多準備，2個月前就

  開始布局，包括舉辦讀唐詩比賽，鼓勵大家讀唐詩、背唐詩等。他表示，《長安三萬里》

  進入校園後，跟中文老師、跟課堂結合，力量會比電影還大。預計明年9月進入校園、8月

  開始預先作業。　


  此外，《長安三萬里》台語版在台灣下片之後，也會赴福建播映。孔繁芸說，這也是意外

  驚喜，當初要配台語版，必須先跟出品方追光動畫討論，追光動畫對此非常肯定，後來消

  息傳出，因為福建沿海地帶跟台灣語言相近，對方邀請台語版赴福建上映，成就一樁美事

  。


  孔繁芸表示，這幾年大陸動畫發展相當蓬勃，接下來春暉也有不少發行計畫，都在洽談中

  ，相信只要是優秀作品就不會寂寞。


  --'
