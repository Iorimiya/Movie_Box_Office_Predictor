url: https://www.ptt.cc/bbs/movie/M.1698076149.A.E06.html
title: '[好雷]《長安三萬里》：醉一場人生的盛宴'
content: "圖文並茂版：\n\n\n\n\n    全球動畫市場向以美國、日本為最為風行，台灣人自小也是在美日的動漫宇宙中成長\n\n。但或許隨著原先閱聽大眾的年歲添加，美日動畫的表現題材同樣益發深刻起來，尤其在\n\
  \n動畫電影的表現上，往往於可愛的人物中，深藏生命的內涵。\n\n\n    有趣的是，近來反倒有部中國動畫《長安三萬里》成功吸引我的目光。讓對於中國動\n\n\
  畫相當陌生，僅在網路追過《口水三國》，從未看過任何一部中國動畫長片的我，突然發\n\n覺了新世界。\n\n\n盛唐至盛，衰敗之始\n\n    《長安三萬里》時長高達168分鐘，劇情透過男主角，時任劍南西川節度使的詩人高\n\
  \n適，回憶講述盛唐末期，高適與李白、杜甫等人相識相交的故事，本片貫穿了高適的人生\n\n軌跡，所以在此先簡介歷史上的高適：\n\n\n    高適，唐朝邊塞詩人，出身知名的渤海高氏，家族排行「三十五」，人稱「高三十五\n\
  \n」。祖父高侃軍功赫赫，配葬乾陵，但高家家道中落，高適孑然一身，仍西行長安，「叩\n\n天子門」。卻處於盛唐末期，門閥之見已深，出仕之路斷絕，只得躬耕於家鄉，之後北上\n\
  \n從軍，見證邊塞的磅礡，成就其邊塞詩的雄渾悲壯，仍懷才不遇，再回老家，或耕讀，或\n\n遊歷，但高適馳騁疆場的雄心未息，入隴右節度使哥舒翰幕府為文人記室，本該平順地度\n\
  \n過餘生，卻遭逢「安史之亂」，安祿山叛軍擊敗哥舒翰軍隊，高適出逃，長安失守，最後\n\n於亂世中獲唐肅宗賞識，高昇為「淮南節度使」，率軍平永王之亂，並輾轉改任「劍南西\n\
  \n川節度使」，負責抵禦吐蕃，解職後仍累封至「渤海縣侯」。史書評價：「有唐以來，詩\n\n人之達者，唯適而已」。\n\n\n    當青年高適結識李白時，李白的萬丈光芒讓我瞬間以為本片是假高適，真李白的李白\n\
  \n傳記動畫，要透過高適的眼睛，見證詩仙的狂放不羈，並一睹壯闊無比的帝都長安，與潑\n\n墨畫、胡旋舞、琵琶曲，大唐盛世的歌舞昇平。\n\n\n    只是雖然劇情不時出現課本的唐詩人物，不斷傳來三百首的名言佳句，大批騷人墨客\n\
  \n皆如群星登場，但劇情始終沒有我原以為的歡樂，尤其高適與李白，都有凌雲之志，願化\n\n身大鵬，為國效力，竟在這生機勃勃，輝煌絕倫的大唐之下，生平脫不了一個「愁」字。\n\
  \n\n    全片藉由高適與李白的境遇體悟交織，去探討人生，高適、李白、杜甫都「自以為是\n\n」，小瞧這花花世界，有所成需要才華，需要歷練，更要人生的機運。身處大唐至盛之際\n\
  \n，不脫盛極而衰之理，盛唐已然人浮於事，貌似登峰造極之時，長安的富貴，危機四伏，\n\n而人生的吉凶，同樣禍福相依。\n\n\n人生不遇，意外之喜\n\n \
  \   不過李白終究依賴迷人的才華，以「謫仙人」之姿供奉翰林，反觀高適，卻是真真正\n\n正的大器晚成。\n\n\n    大唐詩人中，功成名就、心想事成者沒有幾人，有人懷才不遇，有人老有所成，有人\n\
  \n早達揚名，有人沒沒無聞，但生命的意料之外卻讓人又驚又喜，所有的失敗或失去，竟可\n\n能是生命的餽贈。高適沒有邊關的大敗，不會有《燕歌行》「戰士軍前半死生，美人帳下\n\
  \n猶歌舞」的名句，李白沒有先流放夜郎後大赦的悲喜，不會有「千里江陵一日還」的心境\n\n，沒有浮沉，不會有全片高潮《將進酒》的痛快豪邁。\n\n\n    本片直接以兩人的際遇穿透人生的道理，成功人士其實都有「倖存者偏差」，會誤以\n\
  \n為人定勝天，成功固然需要努力，但同樣需要時運，如同因網紅老高說明爆紅的「紅點、\n\n綠點」研究，但生命還遠不僅於此。\n\n\n    《長安三萬里》更深刻地表達出知識分子的困境，李白與高適都有一顆出仕之心，但\n\
  \n李白更為矛盾，沒有詩歌中的灑脫，還在修仙與塵世中掙扎，而文武全才的高適，沉痛一\n\n句「我給了自己十年時間」其實是我全片印象最深刻的言語，高適不遇，只能藉由書寫，\n\
  \n說自己「一筆一畫，一樣地馳騁疆場」。縱然面對生命，萬般無可奈何，高適終究沒有讓\n\n心中的火苗熄滅，他認輸、他學習、他沉潛，卻始終沒有一刻放棄，這才是高適與李白最\n\
  \n大的不同，也讓高適最終能將心中的錦繡，乘風而起，直擊雲天。\n\n\n醉一場人生的盛宴\n\n    《長安三萬里》的出色，除了以繽紛的色彩描繪長安的繁華，用蕭瑟的邊關刻劃苦勞\n\
  \n的戰事，讓唐詩如同銀河般璀璨耀眼，使文化的底蘊躍然而出，單憑琅琅上口的詩書，便\n\n打造出一座不朽的長安，更是透過高適的武藝與生涯，得以醞釀情緒，不讓李白專美於前\n\
  \n，書寫一部動靜兼備，輕重相輔的好故事。\n\n\n    最後甚至給了我們一個動人的結局，不否認有史實的嫁接，但用歷史錯誤評價本片我\n\n不敢恭維，連號稱考據嚴謹的日本NHK大河劇，近年來戲說橋段照樣倍增，不盡符合史實\n\
  \n又如何。\n\n\n    全片藝術化的情節，讓本應平鋪直敘的文人生平，生動討喜進而感動人心。何況，即\n\n便歷經千百年，唐詩「文字的力量」依然再現，當你徬徨猶豫，身處人生低谷時，耳邊一\n\
  \n句李白的「長風破浪會有時，直掛雲帆濟滄海。」心情久久激盪，豁然開朗。而高適的「\n\n莫愁前路無知己，天下誰人不識君？」既激勵了他自己，也給我們人生鼓勵，而這不就是\n\
  \n人生，接受淬鍊，不忘初心。\n\n\n    謹以此文，獻給每個如同高適、李白，在人生的道路上艱難前行，心中還有「詩和遠\n\n方」的我們，人生的這場盛宴，盡其在我，不醉不歸！\n\
  \n\n--\n                                  10/23 23:50"
