url: https://www.ptt.cc/bbs/movie/M.1682830296.A.CCE.html
title: '[凱吉雷] 吸血鬼特助：雷菲爾-戀愛家教Dracula'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  《吸血鬼特助：雷菲爾》(Renfield)

  .

  先來聊聊一個話題：自從環球影業搞砸了它們的闇黑宇宙、隨後決定放棄搞宇宙之後，最

  大的受害者是誰？

  .

  不可能是湯姆克魯斯，他依然是超級巨星，還成了去年收入最高的影星，風光的很，炸掉

  一部《神鬼傳奇》對他來說不痛不癢，誰一生沒演過雷片？應該也不是羅素克洛，他依然

  在各種奇怪的電影裡出沒，挑片品味就跟他的脾氣一樣我行我素，看起來他過的也是挺開

  心的─但是《梵諦岡驅魔士》意外的還不錯，我會再寫篇文章聊聊這片。至於那些原本計

  畫要演出但最後連八字都沒一撇的演員就算了。

  .

  如果問我這題，我會說最大受害者是路克伊凡斯，接連在《玩命關頭六》跟《哈比人》系

  列中演出搶眼要角，然後挑大樑演出《德古拉：永咒傳奇》，帥到不行，儼然事業即將登

  上顛峰......然後就沒有然後了。甚至在闇黑宇宙還沒玩完之前，路克伊凡斯就被踢出局

  了。

  .

  每每提到闇黑宇宙，我都想為路克伊凡斯抱不平、為他喊聲「幫復」，畢竟我真的蠻喜歡

  他的，可惜他始終紅不起來。而自從環球把策略改成為每個經典怪物各自打造獨立電影之

  後，要看到路克回來應該更是不可能了。

  .

  但，就在環球成功復甦《隱形人》之後，他們決定再次把德古拉搬出來，而這次演出德古

  拉的不是別人，正是我們的凱吉。

  .

  OK，路克伊凡斯的德古拉可以正式安息了，凱吉的粉絲如我則是可以狂喜一陣。犧牲路克

  換來凱吉？非常值得為！為了把凱吉德古拉召喚出來，犧牲整個好萊塢都沒問題。

  .

  現在再來另外一個問題：德古拉本身就是一個具文化符號意義的角色，這麼多年來，德古

  拉當然也數度出現在大螢幕上，那麼誰是影史最偉大的德古拉演員？我相信近代來講很多

  人喜歡路克伊凡斯，他確實夠帥；而要古典一點的答案可能是貝拉盧戈西或是克理斯多福

  李；我個人則很喜歡蓋瑞歐德曼，他在《吸血鬼：真愛不死》中多變的演技讓人看了非常

  過癮。當然，他們都各自選擇了用各自的風格來詮釋德古拉，根據每位觀眾不同的喜好，

  這個問題沒有標準答案......

  .

  但是從今以後，以上這些答案都是錯的，現在影史最偉大的德古拉只能是、也必須是凱吉

  ，德古拉之於吸血鬼文學的重要性，就如同凱吉之於好萊塢，他生來就是要演這個角色的

  ，所以說到底這篇文章根本不是要來告訴你《吸血鬼特助：雷菲爾》這部電影好不好看，

  這篇文章只是單純要來讚揚凱吉的。

  .

  雷菲爾算哪根蔥？我才是凱吉最忠實的信徒。傳說中吸血鬼需要家中主人的同意才能進入

  屋內，但凱吉進來我家完全不需要任何口頭上的同意，因為我的靈魂早已為他敞開。

  .

  電影把故事的時間線搬到了現代，當然是想要重新塑造一個嶄新的德古拉，我們看過太多

  人類對抗吸血鬼的故事，做為一個經典的怪物，相信單純會吸食人血這樣的形象已經無法

  嚇到現代人了，編劇必須賦予德古拉一個嶄新的定義，而他確實找到了一個更加真實恐怖

  、但同樣適合德古拉的怪物形象：你的老闆。

  .

  比起深夜遇到吸血鬼，這是現代人更熟悉的恐懼與焦慮：某個你心目中的權威型人物，他

  的一句貶低或鼓勵就能輕易操弄你的心情，彷彿你的存在目的就是為了討好他，他越是把

  你罵的一文不值，你就越覺得自己應該為他做牛做馬、而他的一句隨口鼓勵，你就前面一

  切的剝削與羞辱好像都不是問題，你開始在不知不覺中變得需要他來證明你存在的價值，

  而他也因此在不知不覺中掌控了你的人生。事實上未必要是老闆，任何不對等的有毒關係

  都可以套用，可能是主管、師長、父母甚至是情人，而這善於操控人心的怪物，確實給了

  凱吉大量的表演空間。

  .

  雖然主角是被操弄、最終選擇打破這層枷鎖的雷菲爾，但因為德古拉是凱吉演的，所以電

  影的亮點終究還是集中在他身上，德古拉每每出現在螢幕上變搶盡了鋒頭，即便電影被定

  調為喜劇，凱吉依舊能夠帶給人一定程度的壓迫感與恐懼感，作為影迷，看到凱吉可以在

  主流商業電影中演出大量血腥動作戲當然開心─但事實上多數的動作戲還是由尼可拉斯霍

  特負責的─不過真正耀眼的還是他的演技，我特別喜歡中間一段他進入雷菲爾家中後開始

  威脅他的那段，你幾乎可以感受到凱吉的演技在發光，直接把霍特壓著打。

  .

  即便是德古拉這樣我們時常見到的角色，交到了凱吉手上，他仍然可以演出只有他才能夠

  詮釋的多樣化風格：他既能如傳統的吸血鬼一般的古典優雅，又能像個搖滾明星一般狂野

  華麗，他不僅是邪氣逼人，單純用恐懼來主宰雷菲爾的人生，他還嫻熟各種PUA技巧，很

  可能上過戀愛家教的課！霸氣逼人、楚楚可憐、威嚇脅迫、戲謔嘲諷，所有招數無縫接軌

  通通用上，在這樣的德古拉面前，雷菲爾根本毫無勝算，他完全被帶著走，好像所有德古

  拉惹出來的麻煩都是他的問題都是他的錯似的，這個德古拉絕對是個情勒高手！光看凱吉

  這段表演就已經值回票價。

  .

  這符合大家對於德古拉這個角色的想像嗎？我是不知道，但我也不在乎，這可是凱吉，你

  可千萬不能說凱吉等了一輩子終於等到這個角色，而是德古拉等了一輩子才總算等到凱吉

  來演他，凱吉要怎麼演就怎麼演，沒人可以說他不是，就算是布萊姆史托克都不行，他不

  過就是寫了本小說而已，有比凱吉還了解德古拉嗎？

  .

  好，回歸理性一下，說真整部電影確實因為凱吉而增色、因為凱吉而有可看性，但凱吉畢

  竟不是主角，而且這片說真的也不像是凱吉近年的那些獨立異色作品那麼有意思，它的確

  為德古拉跟雷菲爾的關係找到了一個有趣的切入點，但這層從屬關係比較像是個原廠設定

  ，卻沒有深入發展。而警匪之間的那個支線劇情反而顯得喧賓奪主，比起看這個，我倒情

  願編劇更進一步強化德古拉跟雷菲爾那種互相依附的關係，如果能夠增加幾場戲，讓觀眾

  也有種「德古拉其實好像對雷菲爾還不錯」、「或許德古拉其實沒有那麼糟糕」的感覺的

  話，這片的角色衝突感跟主角反抗帶來的熱血感會更加強烈，觀眾也能夠有帶入感。

  .

  但說穿了，這部電影除了欣賞血漿四溢的動作場面之外─這部分拍得還不錯─多數的時候

  都是在等待凱吉接下來什麼時候才會再登場，我在想，如果拿掉警匪這條支線，安排個現

  代版的凡赫辛登場，會不會更有趣？最好還能找約翰屈伏塔來演這個角色。如果不開玩笑

  的話，奧卡菲娜的角色其實也完全可以設定成凡赫辛的後裔，把劇情更聚焦在德古拉的文

  本翻玩上面，應該是會更有意思才對。

  .

  然而雖然講了一些缺點，不過我其實是完全無所謂的，我的理性額度用完了，我就是凱吉

  最忠誠的信徒，我當然還是喜歡這片，電影中主角雖然急著擺脫凱吉，但我可不想，我還

  希望未來能夠看到更多凱吉。

  .

  你永遠不會嫌凱吉太多的，你只會覺得扼腕怎麼還不夠多而已。


  --'
