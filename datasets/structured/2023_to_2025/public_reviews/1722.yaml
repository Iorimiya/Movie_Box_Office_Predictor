title: '[負雷] 凱吉哥也救不了的吸血鬼特助：雷菲爾'
content: '先說，


  這不是演員的鍋，


  就連我很討厭的奧卡菲娜，


  其實她也演得很盡責，


  裡頭沒有一個演員是亂演。


  只是這個編劇跟導演真的在亂來。


  浪費一堆好演員跟好題材。



  我本來是想要進戲院看的，


  但忙到沒時間，只有閃電俠才進場看了一下，還是抽空看的。


  後來看到串流上了，我才想說來看一下好了。


  不然原本是買了盜賊榮耀想重溫一下。



  在AppleTV上租這片花了我80，我就鞭小力點好了，


  不然花2-300多進戲院的話，我一定出來狂罵。




  這部劇情爛到連凱吉哥的神演技也不救了(一如往常)，


  而且凱吉哥在這部作品中也沒啥好發揮的，


  就跟其它演員一樣。


  反而是黑幫老大的智障兒子，


  演得真的讓我想拉他去測智商。




  先說，我支持好萊塢的編劇罷工，


  但說真的，但他們如果爭取自身權益，


  只是為推出更多這種像答辯一樣爛的劇本，


  我只想問問他們：


  你的良心不會痛嗎？




  不是，沒有的東西怎麼會痛？




  本片劇情三流到像幼稚園下指令找AI寫的，


  優點是卡司不錯，演員賣力，動作跟特效還有血漿滿天飛，


  該爽的時候有爽。


  但文戲部分你完全看不下去，只想快轉。


  演員辛苦了，凱吉哥辛苦了，


  你債還完了，這種爛戲可以少接一點了。





  --'
