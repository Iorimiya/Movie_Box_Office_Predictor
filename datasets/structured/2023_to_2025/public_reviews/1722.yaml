url: https://www.ptt.cc/bbs/movie/M.1681608719.A.CFB.html
title: '[好雷] 吸血鬼特助雷菲爾'
content: '這部黑色幽默喜劇，劇情線性單純，片長不長


  是可以順順看完的輕鬆小品，很適合下班後放鬆一下


  敘事順暢程度像最近大紅的龍與地下城（好看，還沒看的快）


  果然 Rick & Morty 編劇出品必屬佳作啊


  凱吉雖然劇情上是男配，但鏡頭特寫超多，五花八門顏藝大爆發


  真的就是一個狂！這部凱吉狂到爆，那個笑那個失落那個壞念頭


  不管什麼情境都讓人覺得媽啊這有病


  凱吉粉的我都不知高潮幾次了你各位教徒還不快動起來啊


  喜劇部分奧卡菲娜也是火光四射，雖然劇情設定是個嚴肅的角色


  但總能找到機會用表情來逗笑，超愛這種認真中帶幽默吐槽的喜劇類型


  大推給想放鬆又不想看大作的各位看官，就買個零食飲料順順看完


  至於暴力的部分，這部片假的很刻意，血漿橘到比橘子醬還橘


  畢竟黑色幽默喜劇裡血腥不是重點，重點是幽默


  至少我看的小廳笑聲彼此彼落的，最後大家一起看到片尾等彩蛋


  雖然沒彩蛋啦，不過走時也沒人抱怨













  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




















  劇情很簡單，一個抖Ｍ想離開主人的自我奮鬥故事


  但故事巧妙的地方是，把德古拉傳說和現實社會的互助會牽上邊，但又不會突兀


  能做到這點凱吉Ｓ大爆發功不可沒，傳說用氣場撐起所有不合理的男人


  光是走路的背影，短短幾秒就讓人覺得哇賽，最好離他遠一點


  更別說各種高潮狂笑微笑苦笑奸笑


  就是瘋到讓人覺得不管怎樣的不合理都合理



  雖然故事主線是抖Ｍ男主角的自我救贖之路


  但主要角色們也都有成長


  奧卡菲娜和姊姊的衝突與和解


  黑幫死屁孩拿到力量，見風轉舵的囂張


  凱吉吸血鬼被抖Ｍ僕人拋棄後的受傷失落


  然後選擇其他人當僕人勇敢向前進(?


  反正吸血鬼殺光了所有伏筆，也就沒有收不收的問題，這真是太聰明了編劇


  真心推薦給想逃避現實社會的你各位社畜朋友


  --'
