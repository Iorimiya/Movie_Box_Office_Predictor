url: https://www.ptt.cc/bbs/movie/M.1681580398.A.B0C.html
title: '[爽雷] 吸血鬼特助 雷菲爾'
content: '雷文防雷資訊頁



  其實雷菲爾是原作小說就有的腳色。

  只是通常會被改編作品遺忘。

  甚至腳色定位通常會被名為伊果的駝背怪物取代。


  畢竟他太不起眼了。

  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  總之這部真的是看凱吉增加謎因用的。


  劇情其實很容易預測到。


  但總體是不錯。


  血漿方面，去年有看暴戾夜能接受的，應該也能負擔。


  以我為例，我是配炸雞桶看完的。



  本作的雷菲爾其實比較接近原作的強生律師。


  因為要幫德古拉處理房產而與他接觸，最後成為他的助理。



  然而後來並沒有梵赫辛成功幹掉德古拉。


  於是他就繼續照顧主子到了現代，並發現老德是多誇張的慣老闆。


  最後因緣際會下重新發現自己，因而取得勇氣抵抗並獲得成功。


  總之就是勇氣是人類的讚歌，勇氣的偉大就是人類的偉大之處。


  這部故意模仿古早恐怖片元素的環節也讓人很喜歡，比如雷菲爾回顧認識老闆的過程。


  就採用黑白片畫面。

  而片尾更是大量採用老片的畫質風格，創造出一種魔性氛圍。


  而吸血鬼不能在沒有邀請下進入房子的設定，更是沿用老恐怖片的規則。


  而雷菲爾吃蟲取得超能力的設定，則是巧妙的對原作小說的精神患者雷菲爾好飼養蒼蠅，

  並試圖經由食用累積生命能量的行為做出再解構。


  真是太有趣了。


  打鬥場面也很有趣，尤其是公寓遭突襲那段的呈現風格就很黑色幽默，雷菲爾拆下黑幫

  打手的手臂幫助了奧卡菲那飾演的警察，完全體現了何謂助你一臂之力（物理）。


  奧卡菲納的腳色其實就是取自二十年前的硬漢警察，不同流合污，對抗和上司勾結的黑道

  ，甚至連傑出的殉職老爸都有安排。


  雖然演員本身沒有很強的槍手氣場。


  不過這部中他很好的飾演一名求好心切，且充滿憤怒的基層員警的腳色。


  希望他的戲路可以更廣。


  反派方面，真的要說凱吉還是那個凱吉。


  可以把老德演得那麼自戀又不可一世。


  那種慵懶並在講自己的稱號時因為太得意而竊笑的神情，都讓人感覺到他就是那個慣老闆

  德古拉。


  而黑幫集團，雖然過於扁平。


  不過作為沙包而言，是真的很稱職。


  我個人很喜歡最後決戰，少爺帶著同樣被強化的手下時，用吸毒的方式吸入蜈蚣的橋段。


  既有荒謬感，也凸顯了他剛得到力量後過於輕浮的心態。


  最後成功束縛住老德行動後的滅絕橋段，讓我想到港漫的次男道，就連前頭強化黑幫登場

  的畫面都有種X頭四登場的味道。


  最後靠著老德的血液救回好人被害者的安排則是符合善惡有報的理念，也能視為雷菲爾

  終於正式邁向新生活的開始。


  不論如何。

  真希望能有老德從下水道爬回來的續集。






  -----

  Sent from JPTT on my Samsung SM-A217F.


  --'
