content: '《#東京教父 ：4K數位修復版》重返大銀幕定檔海報


  一代動畫大師 今敏 最溫暖、最動人的聖誕奇蹟


  在冰冷的東京街頭，三個無家可歸的人意外撿到一個棄嬰，

  一段關於「家、救贖與奇蹟」的旅程就此展開。

  一部笑中帶淚、溫馨又瘋狂的城市童話電影。


  《藍色恐懼》、《千年女優》、《盜夢偵探》

  導演今敏最滿意經典之作

  今年聖誕，一起重返大銀幕，感受最溫暖的雪夜奇蹟。


  12月24日 全台戲院 奇蹟再臨


  --'
