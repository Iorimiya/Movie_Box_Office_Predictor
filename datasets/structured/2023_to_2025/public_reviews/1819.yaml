url: https://www.ptt.cc/bbs/movie/M.1679638920.A.CE0.html
title: '[好雷] 毒舌大狀 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  不要用太港片印象去期待

  這部片沒有這麼港 也沒有在賣悲情


  用真正想看好電影的心情進場即可

  是部通俗、大家都看得懂，會有感覺的法庭片


  黃子華在裡面完全沒有搞笑 是認真角色

  但就如前面所講的，沒有刻意賣悲情


  呈現的是表面光鮮亮麗，但人心險惡的香港

  不是那種灰灰暗暗，住在破爛雅房的窮媽媽，哭哭啼啼求律師的片


  缺點是言語上的交鋒和推理並不特別頂尖，轉折有點快

  不過因為通俗點滿，舒舒服服，帶點熱血和感動，也就過去了。


  以現在粵語片的產量，和台灣的上映數來看

  這部可能(只是可能喔) 會是今年最好的粵語片之一

  至少他在香港的票房就是個大驚奇



  --'
