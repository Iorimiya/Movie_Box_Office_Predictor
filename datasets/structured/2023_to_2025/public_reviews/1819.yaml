title: '[好雷]毒舌大狀~值得一看的港片'
content: '雷文防雷資訊頁


  如果要看捍衛四，我會覺得先看這部

  因為捍衛四會上映很久，而這部沒啥宣傳，應該沒太多時間

  反正現在才要看捍衛的話，人多可能也沒好位置XD


  先說一下這部香港票房破一億港幣

  簡單換算台幣四億，但香港人口只有台灣1/3

  就算算上中國來香港看的人數，跟香港票價比較貴的因素

  跟台灣對比下仍然是超越海角的票房成績


  有些香港的梗可能不是那麼了解，但整體來說並不妨礙觀影


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  劇情很簡單，最後的法庭攻防是高潮所在

  前面的敗訴，心境轉折等都有描述出來

  推薦原因除了內容外，很多我覺得跟台灣也有相似點

  像劇情內說的，你以為法律前人人平等，其實並不平等，而且永遠不會平等

  有權勢的人總想影響整個法律判決

  最後的法庭攻防，沒有媒體，收買證人，本來還想收買評審團

  但怕動作太大沒做，這邊就讓我在想，如果連評審團都收買了

  裁判主審都我的人，你怎跟我鬥?


  跟台灣像不像?  88會館，小明可以直接走國門出境，台南光電利益

  議長選舉....等，現實都比電影還扯

  你以為好不容易法律判決會給你正義?

  抱歉人家爽爽去坐外役監，關一天等於你關兩天

  關膩了還可以出來殺個警察在進去，爽不爽?


  回到劇情，最後的謝君豪反水，超爽的

  不過台灣律師可以這樣幹嘛?  台灣律師似乎明是知道自己被告有罪

  還是要想辦法幫他脫罪，而不是認罪協商?

  大狀演出很經典，對熟悉法律的專業人士

  用很不專業的提問，氣的律師整個抓狂

  對不是法律的專業人士，讓他自己慢慢的露出破綻


  而父親也有涉入一開始根本沒想到，但動機太免強

  正常父親不會這樣做，女兒啞巴室內又黑暗，根本不太可能指控到人

  只能說可能本來就不喜歡啞巴的女兒

  不然動機也太薄弱


  這部不知道能不能在中國上映，導演可能有暗喻很多事情

  感覺很難過審，但對台灣觀眾來說相當值得一看


  --'
