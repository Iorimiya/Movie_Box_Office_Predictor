url: https://www.ptt.cc/bbs/movie/M.1676995240.A.04C.html
title: '[新聞] 《毒舌大狀》創香港歷史 衝破1億票房 '
content: '新聞網址：


  《毒舌大狀》創香港歷史 衝破1億票房 黃子華：像中六合彩頭獎


  電影《毒舌大狀》破紀錄創歷史﹗該戲自2023年1月21日大年三十開畫至今，上映32日屢

  破票房紀錄，電影於今天（21日）更為香港電影史，創下歷史性一刻！截至今天下午6時

  ，《毒舌》香港累積票房達$100,017,474，正式衝破1億大關，再創票房新高，穩坐香港

  影史港產片No.1外，更成為香港史上首部破億港產片，目前排在香港最高電影票房第11位

  ，至於頭10位最高電影票房，則由荷李活大片包辦。


  黃子華、謝君豪、王丹妮（Louise）、廖子妤（Fish）、王敏德、何啟華（阿Dee）、楊

  偲泳（Renci）、栢天男（Adam）主演，林保怡、谷德昭聞悉電影破億，均感到振奮，他

  們拍下感言與大家分享。


  導演吳煒倫說：「從來沒有想過一億，冇諗過票房會去到呢一個數，亦都冇估計到在這麼

  短時間之內。不過紀錄不是用來keep，而是要來打破的，我希望快點有下一部港產片打破

  我們的紀錄，繼續上！」


  黃子華感謝觀眾賜出一億，他說：「對我個人來說就，好像撿到一張中頭獎的六合彩，甚

  至張飛不是自己買的，自己買或許覺得應分，感覺就似個天飄下來，飄在手上中獎一樣，

  又好像是去了火星般，還是要多謝大家賜給我們這麼奇妙感覺。」


  謝君豪說：「在香港電影的票房出現一個億字，其實以前真係諗都未諗過，電影要入戲院

  睇，即係等於舞台劇要入劇院睇一樣。」


  Louise說：「好犀利！好開心自己能夠在這個夢工場入面，能夠跟這麼多好演員一齊拍這

  部好電影。」


  Fish說：「我家係一億票房女星！」王敏德說：「衝破1億，我好榮幸，正！好多謝每一個

  觀眾！」阿Dee說：「好榮幸能夠參與一部有一億票房的製作，好驚用盡運氣，希望未用完

  只是剛剛開始，我的粉絲可以改口大叫『支持何啟華一億』。」


  Renci說：「《毒舌大狀》過一億了！希望大家會繼續支持《毒舌大狀》，希望全世界觀

  眾都可以睇到《毒舌大狀》。」Adam表示：「我非常之開心，不止為了我們這套電影，而

  是為了香港電影。」林保怡表示：「一億一千萬的話就拍續集吧，加我戲我一定會來。」

  谷德昭說：「好多人寫很多影評，家好多人都鍾意睇圖片，不太喜歡睇字，突然間令到這

  麼多人鍾意寫字感到很開心，大家繼續多看幾次寫多幾次影評。」




  心得:目前港幣兌台幣實時匯率為3.88

  所以換算過來就是3.88億台幣

  而香港人口只有台灣1/3

  台灣國片票房第一是《海角七號》的5億3435萬

  在總排行是第20

  而總排行第11的是《鬼滅之刃-無限列車》6億3493萬

  另外《想見你》在2/19號的香港最新累積票房是930萬

  預計也會破千萬


  --'
