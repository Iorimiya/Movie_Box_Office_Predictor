title: '[情報] 《毒舌大狀》3月24日全台上映 '
content: '《毒舌大狀》是香港票房天王黃子華繼賣座電影《飯戲攻心》之後再度推出的作品，由《

  寒戰 2》的編劇吳煒倫首次執導，角色結合黃子華快人快語的犀利風格，再加上香港實力

  派演員謝君豪、王敏德及在電影《梅艷芳》表現出色的王丹妮和廖子妤等人共同演出。


  主角黃子華在電影中演出原本一心想攀附權貴的律師，最後造成冤獄，自責讓他改過自新

  ，想不惜一切爭取公道來補救。


  導演吳煒倫透露電影中的人物和案情，參考了許多真實案例，才寫出《毒舌大狀》的劇本

  。電影目前已累積超過 1 億 800 萬港幣的票房成績，擠進香港影史票房紀錄第 9 位，

  也是排行榜中唯一的華語電影，成績斐然。


  《毒舌大狀》將於 2023 年 3 月 24 日全台上映。


