url: https://www.ptt.cc/bbs/movie/M.1679796534.A.FA6.html
title: '[ 好雷] 法庭爽片《毒舌大狀》'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  當程序不再正義

  你選擇程序還是正義？


  有些人明知有罪而定不了

  有些人明知無罪卻放不出

  媒體不報  警察縱容  法界站隊

  真相不重要  system不容破壞

  不管編劇導演有意無意

  我想香港人多少能看出「那些人」的影子吧



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  「今日！呢度！Everything is wrong！」


  --


  第一時間去看了《毒舌大狀》

  簡單的評論就是法庭爽片

  如果是一般狀況之下

  我應該會直接推薦給大家

  然而這部戲已經破了香港本土片的票房記錄

  好像又不該單單以爽片的格局去對待

  總之說些心得吧


  首先

  雖然有黃子華，雖然片名有毒舌二字

  但這不是一部喜劇片

  事實上我認為毒舌這兩個字甚至有點誤導觀眾

  光看片名你可能會想到Legal high、九品芝麻官

  那種巧舌如簧、顛倒是非的內容

  然而其實毒舌元素大概只有開頭十多分鐘比較明顯

  後期與其說毒舌，可能更接近巧辯或雄辯

  喜劇元素還是有，不過只是點綴罷了


  其次

  雖然是法庭戲

  但是法庭的攻防並沒有很激烈

  又或者應該說

  並不是我們想像中那樣的法庭攻防戰

  可以說特別 也可以說失當

  這個可能每個人觀感不太一樣


  再其次

  一般的法庭戲都會帶點懸疑和反轉

  這部戲的懸疑和反轉則幾乎為零

  有，但不多也不大

  一些情節也有點太過一廂情願


  人物刻劃可能也不夠深刻

  黃子華的角色轉變少了一些鏡頭去說明

  只安排了一場球場戲

  讓兩人用說的去交代

  角色的毒舌屬性結果全被用來正能量

  過往經歷貌似也對案情沒有什麼幫助

  不過子華神難得的正劇表演

  還是很令人驚豔


  王敏德則是莫名其妙的大反派

  當了一輩子律師

  卻絲毫不掩飾在法庭上的言行

  感覺就是Legal high裡冷凍檢察官的變體

  同樣的純理性言論

  在作為證人時就會顯得更加突兀

  基本上就是編劇希望這裡有個人很直白地講出一些不該講的大實話


  謝君豪則是一如既往地優秀

  沒看過南海十三郎的人

  都給我去看～～～

  apple tv現在有高清修復版

  雖然角色有些太過理想化

  不過演員的氣場強 真是不講道理也無所謂


  其他反派的部分就沒什麼好說了

  都是些老老實實的壞蛋

  臉譜化有些嚴重


  總之雖然是香港影史第一的港產片

  但要說這部戲多好多好

  我覺得不要抱太多的期待

  （這評價給海角七號好像也差不多）

  就是部好人沉淵得雪的爽片

  之所以破了香港的票房記錄

  我想還是因為香港有股怨怒需要宣洩

  而毒舌大狀剛好提供了一個破口


  相較之下

  我還是比較喜歡之前的《飯戲攻心》

  不過毒舌大狀還是推薦大家盡量不帶預期地進戲院

  畢竟身為爽片  爽的地方還是很爽的


  --'
