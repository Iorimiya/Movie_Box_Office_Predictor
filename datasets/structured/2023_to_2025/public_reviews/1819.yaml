title: '[ 大好雷] 毒舌大狀'
content: '晚上去看一部二輪港片


  毒舌大狀


  非常非常意外的好看


  節奏流暢 最後陳述爽度破表


  主角林涼水 這粵語唸起來就很像喝涼水


  黃子華飾演 對他的印象還留在跟劉青雲吳倩蓮演的那部喜劇裡面的反派


  沒想到這次演主角無比出色


  沒有灑狗血濫情


  就是剝洋蔥般的把香港頂級權貴 如何知法犯法的惡行惡狀


  給揭露出來


  有趣的是 梅艷芳裡的兩姐妹

  這次演對手敵人


  還有助手女律師蠻可愛的

  以及助手太子都可缺可點


  另外對手主控官方大狀超有型

  非常帥的中年人 我一度以為是劉松仁


  最後才發現是南海十三郎


  劇情主配角都非常精彩


  很有港版正義辯護人的fu


  強力推薦 不過在台灣好像沒什麼知名度


  但確實是部好戲


  是一部不小心就忽略的好電影


  --

  景美佳佳 而且只要90塊 超超超值

  看了推文才發現 他在香港竟然破億 扯爆了 應該有港人被欺壓的情愫在裡面'
