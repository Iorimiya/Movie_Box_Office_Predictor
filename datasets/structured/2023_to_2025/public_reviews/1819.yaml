title: 'Fw: [心得] 毒舌大狀'
content: "作者: tools (tools) 看板: HK-movie\n標題: [心得] 毒舌大狀\n時間: Sat Mar 25 22:59:15 2023\n\
  \n\n\n\n\n\n1. 好看, 強烈推薦大家去電影院看\n   裏面粵語跟英文交雜的效果可能在電視上都看不到了\n\n2. 原本看到中段的時候, 我就想奇怪:\n\
  \   這沒有那麼屌啊, 怎麼香港票房破紀錄,\n   不過看到最末二三十分鐘的法庭戲時就真的很精彩\n   從一開始的嗆王敏德,\n   再到謝君豪嗆人, 兇手破防\n\
  \   最後尤其是黃子華作結案陳詞那段一鏡到底, 鏗鏘有聲\n   看得我內心相當澎湃, 心跳得好快\n   這股澎湃我以前只有在蝙蝠俠黑暗騎士跟港劇大時代的時候體會過\n\
  \   內心的這股暖流, 又再一次的射了出來\n\n3. 謝君豪的表現也很讚, 不怒而威\n   變臉的感覺都很棒\n   這次扮一個很有taste的大律師,\
  \ 西裝革履風生水起的\n   實在難以對比他先前在濁水漂流的遊民造型\n   而且他也是後面法庭戲讓人看得很熱血的理由之一\n\n4. 其實劇本也有些不太完善的點\n\
  \   像是披露的偷拍片段, 那感覺就像是何汝大的老婆亂入一樣\n   都是很硬要的安排, 感覺太吃運氣了\n   但其實最後的逆轉的理由我都沒猜中就是了\n\n\
  5. 還有一個我很喜歡的鏡頭語言\n   就是林保怡客串的ICAC, 進來之後旁聽的大律師都要讓位\n   最後他又不讓位給人家, 象徵著他代表的司法體系還沒有被鍾家左右\n\
  \   這邊是我事後想才想出的畫外音, 覺得挺不錯的\n\n6. 對比年初看的正義迴廊, 正義迴廊也是非常優秀的港片\n   不過比較多是給我驚豔的部分, 就是拍攝技巧跟說故事上的驚艷\n\
  \   而這部毒舌大狀就像是一個濃縮版的影集(港劇)\n   在情感上更是有力, 尤其是反派很雞歪的嘴臉更讓人激昂\n\n7. 含撚！\n\n8. 最後是片尾彩蛋,\n\
  \   字幕有提醒大家有片尾彩蛋\n   結果竟然是NG跟後台鏡頭啊!\n   這才是真正的港片彩蛋啊！ 才不是什麼下集會出現的英雄跑出來兩秒鐘\n\n9. 這週上映的片子\
  \ 毒舌大狀>龍與地下城>姜維克4 都很棒\n   但這部應該是我最喜歡的\n\n--"
