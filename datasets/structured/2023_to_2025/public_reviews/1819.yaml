url: https://www.ptt.cc/bbs/movie/M.1675748630.A.4FC.html
title: '[新聞] 《毒舌大狀》超越《明日戰記》成香港最 '
content: '《毒舌大狀》超越《明日戰記》成香港最高票房亞洲電影


  安樂出品兼發行、吳煒倫執導兼編劇，黃子華、謝君豪、王丹妮、廖子妤、王敏德、何啟

  華、楊偲泳、栢天男等主演的《毒舌大狀》自一月二十一日大年三十開畫以來，可以說是

  口碑與票房均叫好，而在今天上映第十八天，更正式超越《明日戰記》成為香港最高票房

  亞洲電影。


  《毒舌大狀》於昨天上映第17天仍安排上映逾六百場，全日錄得近24,000人次捧場，推算

  收入接近165萬(港幣)，為電影累積距離《明日戰記》不足廿萬。而今天單是預售已達45

  萬(港幣)，為電影累積順利衝破8,200萬(港幣)，超越《明日戰記》成為香港電影票房史

