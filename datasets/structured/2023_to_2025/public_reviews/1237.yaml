title: '[普雷] 《窗邊的小荳荳》理想化的日本教育？'
content: '真人真事隨筆，黑柳徹子的小學生自傳


  1939年–1945年的太平洋戰爭，是對日本有著嚴重打擊並且重新審視自己行徑的重要戰爭

  ，可以說這場涵蓋世界各處的大小戰役，對東西方都是不小的衝擊，也讓人重新審視戰爭

  帶來死傷的慘痛與可怕的毀滅性，這也讓日本在後來多年，民間社會依舊都有著濃烈的反

  戰意識。


  對於戰爭的可怕、不希望戰爭再次發生，這樣的想法是許多人的期許，但也是因為和平許

  久，逐漸也有人忘記和平的重要與戰爭的教訓，出現了和平笨蛋與渴望戰爭的兩極份子。


  《窗邊的小荳荳》是根據日本藝人黑柳徹子的同名自傳隨筆，所改編的動畫。故事敘述有

  點好動、總是靜不下來的小女孩荳荳再被許多小學拒絕之後，前往校風自由的巴學園就讀

  ，結識了身有痼疾的男孩泰明。就在荳荳與泰明成為朋友，逐漸開始喜歡上學，但日本襲

  擊珍珠港正式於美國開戰，日本社會開始轉變成小荳荳不認識的模樣。






  《窗邊的小荳荳》是什麼動畫？


  根據二次世界大戰，許多戰後國家回朔戰爭期間發生的事情，除了戰場上士兵的死傷與國

  家之間的攻防外，在各國家也調查關於許多孩子在戰爭時間的影響層面，其中在德國、蘇

  聯、日本等都有大量未成年投入戰爭的紀錄，例如德國納粹的青年軍、蘇聯紅軍的未成年

  士兵，與日本當時神風特攻隊等，可以說當時未成年男性間接或直接的進入戰爭之中，並

  許多投入戰事。


  剩下未上戰場的男性兒童與女孩，則成為戰爭孤兒與失去教育的機會，在日本有「失落的

  一代」這樣的說法來表示這些碰巧在戰爭中成長的孩童。


  以日本為例，在二次世界大戰後期因物資匱乏需要用社會上的資源填充，故許多學校的設

  備都進入充公，不然就是被敵軍摧毀、男性教師入伍等狀況，使當代孩童的教育資源都面

  臨斷層。但在戰爭時一些中上階層的人士，仍可以有資源讓孩子受到良好的教育。例如：

  世界知名的日本動畫導演－宮崎駿，因是宮崎航空機製作管理者之子，故仍然可以在偏鄉

  受到完好的教育。有些年齡過小無法上戰場，或家人謊報孩子年紀而逃過兵役。








  動畫《窗邊的小荳荳》是日本藝人黑柳徹子隨筆原作改編而成，書籍主要是紀錄黑柳徹子

  小學期間周遭所發生的人事物，剛好是在二戰開始到結束的期間，整體而言可以從書中小

  女孩荳荳眼中，看見日本社會局勢逐漸朝向軍國主義轉變，讓人們的眼神和認知都變得相

  當詭譎。黑柳徹子是朝日電視台的名主持人，主持長壽節目《徹子の部屋》，有時會因節

  目的來賓年齡相仿或經歷過戰爭，而提到這部自傳作品。


  這是《窗邊的小荳荳》首次在舞台劇、電視劇後被動畫化，該動畫也被選為朝日電視台開

  播65周年紀念，在網路串流平台與電影院都可收看。


  這次也延伸出《窗邊的小荳荳》這部作品的後續《続．窗邊的小荳荳》書籍的出版，並描

  繪小荳荳（黑柳徹子）在這之後般到青森，就讀女子中學、音樂學校和成為NHK女演員的

  後續故事，並也隨著時間推移改變了書寫的方式，使用比較平以敬人的日文常体寫作，雖

  然黑柳徹子並沒有直接說是續作，但通常日本方面許多讀者都視為如此。











  《窗邊的小荳荳》分析與延伸：


  動畫《窗邊的小荳荳》算是在幾部改編作品中，比較還原黑柳徹子原作的版本，並且也實

  際描繪了黑柳徹子故事中的「トモエ学園」不同於當時日本制式的教育體制，而相當自由

  奔放，注重學生的教育發展。


  在《窗邊的小荳荳》故事中有許多部份都在敘述小荳荳在學校中發生的故事與和一般日本

  當時教育體制的不同，這點受到很多正反兩方的評斷，有許多人覺得黑柳徹子可能在記憶

  中過度美化了她的童年記憶，並且對於當時日本戰爭背景中有這樣的學校一直存在這樣的

  教育理念，有點不太現實，但也有人覺得因為黑柳徹子父母為中產階級，故的確有可能讓

  她就讀這樣不受影響的小學校。


  而在トモエ学園之外，也有人覺得《窗邊的小荳荳》並未提到任何關於日本戰爭下受到的

  傷害人們，與戰爭中發生的一些醜陋邪惡之事，有點浪漫化了那時候的日本背景。日本一

  些評論與教育者表示《窗邊的小荳荳》其實比較著重在トモエ学園的教育讓小荳荳覺得很

  不一樣，剩下比較淡化關於戰爭背景的記憶，這有可能是當時孩童的黑柳徹子，無法知曉

  那麼多日本社會事件。也有一些文學專家認為，可能是故意忽略一些傷痛的部分而選擇留

  下美好的事物來敘述，這可能也比較符合《窗邊的小荳荳》書籍的本質。






  黑柳徹子曾經對《窗邊的小荳荳》的書名作出解釋，因為過去她是學校的問題孩童，常常

  干擾班級上課，而不受老師待見，所以將她退學。當時日文有流行語「窓際族」一詞，是

  指公司將不需要或不喜歡的員工，趕到窗邊座位冷落，省得礙眼之意，故以自嘲的形式作

  為書名。而小荳荳就讀的トモエ學園的「トモエ」是一種黑白調和的圓形旋轉紋，是表達

  學生身心調和與教育之意，雖然許多中文翻譯將其翻譯成「巴學園」，但其實跟「巴」這

  個字，完全沒有關係，其實這類的紋路也用於很多過去家徽之上，甚至根據花紋方向和數

  量有一巴、二巴；左巴、右巴等稱呼。


  故許多國際上包含日本的教育和文學專家，對於《窗邊的小荳荳》這部作品的看法在於：

  日本在二次世界戰爭中，依舊有部分教育與人們對於人性化教育和孩子學習做出貢獻，雖

  然過於浪漫化的教育理念，但實際上也對於日本後來戰後的教育有一定的參考價值，尤其

  在不同於傳統教育方式的孩子，不一樣的教學模式。


  如今許多綜合高中、森林小學、空中教室，某方面也都有著這類浪漫化教育的實踐性。但

  對於二戰對孩童的創傷來說，或是對於日本軍國教育的批判性，《窗邊的小荳荳》顯然是

  不足，甚至忽略的。








  《窗邊的小荳荳》值得一看嗎？


  《窗邊的小荳荳》原作在80年代的台灣算是滿多譯版的，但當時台灣翻譯狀況也是有些參

  差不齊，所以會有很多種不同的譯名出現，而比較困擾的其實是《窗邊的小荳荳》應該算

  是兒童書？還是一般的名人傳記？因為就如一些延伸所敘述，《窗邊的小荳荳》其實算是

  黑柳徹子對童年的隨筆，帶有童趣的部分，但整體上它其實有略為提起戰爭、與日本教育

  體制和注重孩子發展等描繪，無法知道兒童是否可以看懂這些敘述。


  以前小時候看過原作其實也都是當故事，整體而言以過去的記憶來說，當時的我在看時並

  不會發現《窗邊的小荳荳》是二次戰爭背景，對比於《安妮日記》敘述來說，《窗邊的小

  荳荳》整體更浪漫化與描繪在無憂的少女突然覺得周遭世界改變之事。


  故要說將《窗邊的小荳荳》看成日本在戰爭下的縮引其實有點不切實際，整體來說可能宮

  崎駿的動畫《蒼鷺與少年》和其他作品，都比較可以看到那些戰爭的批判縮影，故我覺得

  《窗邊的小荳荳》比較像是黑柳徹子對於日本過往教育體制，有一個比較特殊的經驗。









  但整體來說黑柳徹子本來就是在富裕的中產階級背景，從動畫中對小荳荳的住處和行為，

  只代表日本戰爭時代一切中產階級的孩子對於周遭的轉變也是有感的。


  整體來說，我反而看了動畫版的《窗邊的小荳荳》感覺到，日本有錢階級對於戰爭的反感

  ，並還有餘力重視孩子的教育，尤其黑柳徹子當時年紀和性別是國小女孩，並因為父親是

  音樂家之故，對於基層家庭和國家戰爭了解不多，故我認為《窗邊的小荳荳》在當代反而

  是一部可以反應「中產較為富裕階級孩子對太平洋戰爭的視角」。


  如果以這點來看也不難能理解《窗邊的小荳荳》為何對於戰爭的視角與社會變化不太敏感

  ，甚至並不直接傳遞反戰訊息，反而都是著重在學校裡快樂學習的部分。整體而言我覺得

  這本書當年會如此有人氣，有一部分可能源於黑柳徹子做為女優的名氣推動。另一方面黑

  柳徹子描繪トモエ學園的教育，浪漫化教育體制的讓人嚮往，對於戰爭世代的孩子無共鳴

  ，但對出書年代不滿日本教育的學生家長，可能有所感觸，這可能也不是壞事，而是展現

  當時日本已有餘力在教育之下產生反思。




  --

  個人Blog：

  小說連載頁：


  --'
