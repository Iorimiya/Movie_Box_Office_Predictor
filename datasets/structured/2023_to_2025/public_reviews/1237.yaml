url: https://www.ptt.cc/bbs/movie/M.1705418188.A.B8B.html
title: '[新聞] 「窗邊的小荳荳」網羅金馬得主 獻聲增台味'
content: "「窗邊的小荳荳」網羅金馬得主 獻聲增台味\n\n2024/1/16 15:43\n\n（中央社記者王心妤台北16日電）動畫「窗邊的小荳荳」改編同名原著，中文配音版邀請\n\
  金馬得主陳淑芳、莫子儀、林品彤、方志友、陳慕義等人配音。陳慕義挑戰配音笑喊「觀\n眾別笑我」；林品彤過程漸入佳境。\n\n電影公司今天表示，「窗邊的小荳荳」主角由媽媽是配音員的江禮言（米米）配音，雖然\n\
  她才10歲，但已經有2年配音經驗。\n\n陳淑芳此次為原著作者黑柳徹子配音，她在配音有高天賦，很快就進入角色。莫子儀為小\n荳荳的爸爸黑柳守鋼配音，他表示，配音後最大感觸是希望觀眾記得守護並珍惜生命中的\n\
  溫暖跟純粹。方志友為小荳荳媽媽黑柳朝配音，她笑稱在管教小孩時不像小荳荳的媽媽一\n樣溫柔。\n\n陳慕義此次為校長配音，他期待觀眾進戲院親自聽看看他的表現，但也對觀眾喊話：「不\n\
  準笑我喔！」最年輕金馬影后林品彤此次為小荳荳好友配音，因為只能靠聲音表達情緒，\n她在過程中有發音和情緒表現的困難，但經過配音老師的調整後漸入佳境。\n\n「窗邊的小荳荳」中文配音版將於26日全台上映。（編輯：李亨山）1130116\n\
  \n#陳淑芳 #陳慕義 #林品彤\n\n--\n佛法的\n 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
