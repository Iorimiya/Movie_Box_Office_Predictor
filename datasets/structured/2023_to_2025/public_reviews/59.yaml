title: '[好雷] 《盛夏心動》同志的美好烏托邦'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n《盛夏心動》(Young Hearts)描述了一個美好世界的可能性。\n\
  .\n或許是一種先入為主的、「同志電影常常會賣慘」這樣的成見吧，我原本其實以為獲獎無\n數的《以你的名字呼喚我》同樣會是部悲劇，也因此它的結局讓我感到相當意外：我很喜\n\
  歡《以你的名字呼喚我》中，最後主角與爸爸的對話，那段展現出了一個理想長輩的典範\n形象：對於孩子的不一樣不斥責也不說教，而是充滿了溫柔與理解。那段可以說是呈現了\n\
  當我們與長輩、與他人傾訴情緒時，我們時常期待、卻也時常無法得到的回應，不論我們\n在性向或是感情方面能否與主角有著相似的共感，我們都同樣能被那段情節打動。\n\
  .\n而《盛夏心動》可以說是將那一段美麗動人的情緒延伸出了一整部劇情長片。\n.\n雖然說是以同志愛情為主題賣點，但事實上《盛夏心動》並沒有將故事太過聚焦在「性向\n\
  」這件事情上面，比起同志，電影其實更聚焦在主角的「兒童」身份上面，14歲的孩子對\n於這個世界、對於自己，都還充滿著好奇，還在探索、還在困惑，對他們來說這個世界有\n\
  著無限的可能性，但這些可能性也或許讓他們焦慮、讓他們害怕。對這時候的他們來說，\n這個世界很大，但他們的世界也很小：同儕、朋友、父母/長輩，這就他們的全世界。\n\
  .\n所以我們與其說《盛夏心動》是一部同志電影，不如說它更像是一部精確地描述了青春期\n孩子心境的成長電影。而也正因為是小孩，所以電影中男主角在探索自己性向的過程中，\n\
  一些不成熟、甚至可能會被視為渣男的行為，反而顯得可愛、或是惹人發笑，他畢竟只是\n個孩子，當然可以理直氣壯的幼稚與不成熟，導演很成功地捕捉到了小孩在面對自己的「\n\
  不一樣」或是感情上的困境時，那種懵懵懂懂、不知道該如何處理、只能用EMO把自己武\n裝起來的心境。\n.\n但我們自己也當過孩子，我們很清楚那些現在回頭看來會覺得微不足道的小事，在那個當\n\
  下可是天崩地裂的大事，或許從旁觀者的角度來看，會覺得為了這樣的事而煩惱的孩子可\n愛又天真，但對當事人來講，那個龐大的壓力與徬徨也是真確無比的，也因此在那個當下\n\
  ，身邊的人們，尤其是那些他所仰賴的大人如何陪伴他處理這些情緒顯得至關重要。當我\n們隨口問孩子「今天在學校發生了什麼事？」的時候，我們或許只是想要閒話家常，但對\n\
  孩子來說，他的每個回答代表的都是對你的信任。\n.\n而導演安東尼夏特曼選了「出櫃」這個命題，更能凸顯這件事情。出櫃可不是一件小事，\n哪怕是對許多成年人來說，這都是一件大事，尤其是對於小孩子來說，這個世界對於同志\n\
  本身就已經相對不是那麼友善了，而小孩的幼稚與不成熟或許有些時候確實能被解讀成可\n愛，但在社會的耳濡目覽之下，這也會成為一種純粹的惡意：他們可能自己心底都說不出\n\
  來同志有什麼不好不對，但反正大人們都說這樣不對了，如此一來那股惡意也就不用隱藏\n了。對小孩來說，身為同志這樣的「不一樣」在同儕之間可能是要殺頭的，身邊的人對於\n\
  這件事情的反應會帶來的影響是一輩子的。\n.\n而我想這正是導演拍攝《盛夏心動》最大的目的，本身就是同志的他，透過這部電影，打\n造出了一個可以說是同志烏托邦的世界：在那個世界中，無論是主角的家人還是朋友，根\n\
  本沒有任何人對於主角的性向有任何的霸凌與訕笑，在那個世界中，人均《以你的名字呼\n喚我》中的爸爸，所有人給主角的都是支持與鼓勵、都是一個溫暖的擁抱，在那裡愛就是\n\
  愛，喜歡一個人就是一件如此美好的事情，不分性別也無關年齡。\n.\n我想導演一面用這樣的電影這樣來彌補自己的童年，描繪出了一個他希望兒時能夠遇上卻\n沒能見到的世界之外，同樣也是他給這個世界的期許，《盛夏心動》中的世界聽起來美好\n\
  到不可思議、甚至可能讓人覺得太過理想化，這樣的批評也都是真的沒錯。但又不禁讓人\n想問，為什麼這個世界不能是這樣的？許多惡意往往來自於不理解，但更多的時候選擇善\n\
  良並不需要了解也沒關係，對於那些和你不一樣的人，他們就只是「不一樣」而已，並沒\n有不對、不好或是不正常，只要知道這樣就夠了。\n.\n電影中的那些角色，他們其實也沒做什麼很特別了不起的事情，他們其實就只是無條件地\n\
  支持並且愛著自己的孩子、家人、還有朋友，能做到這樣就很夠了。我們都有拯救一個人\n、接住一個人的能力，光是能夠做到這樣，這個世界就會是個更美好的地方吧。\n\n\
  --\n                                    10/24 10:09"
