url: https://www.ptt.cc/bbs/movie/M.1133201555.A.724.html
title: '[心得] 火盃的考驗觀後感'
content: '在觀賞這部電影前

  陸陸續續看過了許多人的評論

  其實不管評論如何

  我早就已經被哈利波特給制約了

  小說除了第六集只看過一次外

  其他的五集 每一集至少重新閱讀三次以上

  所以身為一個哈利波特迷 不是想不想去看

  而是必須去看


  很多人覺得 內容跟小說比起來刪減許多

  這點是事實 但是電影和小說本來就不一樣

  抱持著檢視的心態 只是自討無趣

  拿魔戒來比較好了 魔戒小說的內容更為豐富

  但是會特別說出電影和小說比較的人 佔了較為少數

  原因很簡單 因為在台灣閱讀過魔戒的人

  比閱讀過哈利波特的人要來得少許多

  就只是因為絕大多數的人是先看過電影才去翻閱小說(魔戒)

  以致於會有不一樣的下場嗎?

  當然這兩部電影的比較 我不多加評論

  只是先以一種客觀的觀眾行為作為比較


  我認為火盃的考驗是四部中最好看的

  原因是導演大膽的砍掉了許多小說的東西

  很多小說的內容 與其沾到邊

  還不如徹底砍掉

  巴提柯羅奇家的眨眨被砍掉 因此S.P.E.W也沒被提及

  雖然這對後續電影會產生影響

  但是就這部電影的完整度而言 我認為不受影響

  硬是加入的結果只會變成是打廢牌

  我甚至認為 這次 連一開始的魁地奇世界盃的部分

  都應該砍掉 因為導演也沒有多加著墨在這一段上

  與其這樣草草帶過 還不如把多一點時間描述三巫鬥法大賽上

  要砍就要砍得徹徹底底


  我欣賞這次導演對於情境笑點及劇中人物情感設定的安排

  不愧是擅長溫馨劇情片的導演

  我認為這是之前導演所欠缺的

  第一二集的導演照本宣科

  還是被大家罵說刪了太多情節

  沒辦法嘛 要符合原著

  每一樣東西只點到為止

  完全沒有導演觀點

  第三集的導演有了自己的詮釋觀點

  而且一改第一二集純屬魔幻的色彩

  融合了現實與魔幻的元素

  使得整部戲走向了魔幻寫實的路線

  而且本身運境手法相當生動

  可說是鏡頭會說話

  可惜對於最重要的天狼星是無辜的這點

  快速過關 讓人摸不清楚狀況


  第四集的導演 使用了第三集導演的魔幻寫實走向

  更多加了情感的元素融入其中

  我對於有一個鏡頭印象深刻

  就是在穆敵上完不赦咒的課程後

  奈威看著窗戶的圖案發呆

  後來穆敵把他叫走後

  鏡頭take到那幅窗戶的圖案上

  雨水從畫像的眼睛中流下

  這一幕我印象深刻


  我以為一部電影的完整度

  是以這部電影所描述的內容為主

  而非與原著小說所有情節作為比較

  火盃的考驗電影版

  就完整度而言算是達到了我滿意的程度

  我還是想重申一件事

  與其斷章取義 不如在有限的時間內 改編一段至少完整的故事

  而這次的電影 我認為是做到了


  我力推這部 火盃的考驗 我認為是四集中最好看的


  --

