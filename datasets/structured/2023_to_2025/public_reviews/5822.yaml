url: https://www.ptt.cc/bbs/movie/M.1485958920.A.3EA.html
title: 'Re: [討論] 哈利波特 火盃的考驗'
content: '你好 我是湯姆瑞斗45 是佛地魔王第45個分靈體


  你的疑惑 就讓我解釋



  首先 港口鑰確實並沒有限定任何物品 也就是說任何物品都可以施法將之成為港口鑰


  再來 火盃是否可以透過作弊的方式參加 當然是可以 這也是我當初設下的妙計之一

  只是執行者不是我


  火盃的基本設定 就是從三個學校的學生中挑選出最適合參加火盃的學生

  而挑選方式 就是藉由扔進火盃的紙條 紙條上面會寫參加者的名字與所屬學校


  由於歷屆火盃死亡人數過多 所以停辦 而在第四集重新舉辦以後 三校及魔法部

  同意將火盃的參賽條件 新增年齡限制 而方法是由鄧不利多施法 讓未成年巫師無法

  直接投遞報名紙條


  當然這邊就能作弊了 叫已成年巫師幫忙投遞即可



  但是 在第四集中 我讓我的手下 用的方法更複雜 那就是虛設第四所學校

  讓哈利以第四所學校的學生名義報名



  這應該就是你所謂的作弊吧



  而被火盃挑選出來的人 就必須有義務參加火盃 直到比賽結束 不能退出

  因為這是具有魔法力量的契約



  最後食死人 是指跟隨我的巫師

  但是只有我的心腹 手臂上才會有黑魔標記


  然後我不知道死食人是什麼



  --


  --'
