url: https://www.ptt.cc/bbs/movie/M.1132509256.A.748.html
title: 哈利波特四 - 火盃的考驗 觀後感 (有雷)
content: "================================   有雷  ====================================\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n      哈利波特在星期五的晚上上映，基於我對妙麗深厚的愛 >//////////////////<，\n\
  很開心的跑去衝了午夜場。看完後，well，我不算是失望，但也不會說拍的好。\n\n      不算是失望，是因為我本來就覺得第四集很難拍。基本上，哈利波特本來就不是很\n\
  好拍的電影。因為哈利波特有廣大的觀眾群都是兒童，所以在時間或是畫面上，尺度都比\n\"魔戒\"這樣的電影來的小。而且第四集 - 火盃的考驗，本來就比前三級難拍。姑且不論\n\
  書超級厚這點，這一集不管是劇情的精采度；畫面的華麗度；人物的出場數；還有心理上\n的成長及轉折程度，都是四集之冠。我一直覺得，也許劇本應該要由羅琳自己來改寫，不\n\
  然格局這麼大的原著，很容易一個改編不好，就抓不到精髓所在。不過好險第四集有一個\n非常大的主題所在，就是三巫鬥法，基本上緊攀著這條主線，劇本就不太會迷路了。整體\n\
  來說，這部電影的確就是這樣做了，抓住三巫鬥法，其他的支線，EX：家庭小精靈促進協\n會、麗塔史譏、魁地奇世界盃、哈利的賭金等等，不是被刪去就是一筆帶過。不過這樣其\n\
  實也好，因為全部演出來太耗時間，而且會模糊焦點。\n\n      但是我不說他拍的好，因為我覺得他在三巫鬥法的主線上，抓的不夠好。基本上我\n覺得這個導演的格局不夠大。他很多小細節都處理的很棒，不管是一些平常的笑點，或是\n\
  細微表情的掌握，我覺得都還不錯。尤其是愛情方面，導演真的把青春期的尷尬和青澀，\n表現的相當自然。不過我覺得有些感情戲實在是太over了，over到灑狗血的程度。哈利看\n\
  到張秋，整口的果汁流出來是笑點；但是妙麗在舞會結束之後，哭著跟榮恩吵架，還坐在\n樓梯上丟鞋子，真的是太over了...而且我覺得在愛情方面掌握還不錯，但是在友情方面\n\
  就有點弱，似乎有點太著重於愛情方面。不過所有的小細節都還掌握的不錯。但是三巫鬥\n法的大場景，只能說，除了特效外，我很失望。這些大場景的東西，如果好好處理，我想\n\
  這部電影絕對氣勢會更磅礡。\n\n      我們就不論徹頭徹尾沒有其他的鬥士出現這點，畢竟哈利是主角...不過沒有評分\n讓人失望...第一場對龍的決鬥，刪掉妙麗跟哈利苦練招喚咒也就算了，居然把哈利搞的\n\
  像是靠運氣贏的一樣！書中的哈利是展現出絕佳的技巧，以四人中最短的時間奪下金蛋，\n而獲得所有人的讚嘆及肯定。而我看到電影中，那隻龍跟哈利飛到莫名遠的地方，還在屋\n\
  頂上爬來爬去，簡直快昏倒了...這是什麼鬼！第二場用奈威來代替多比，我覺得也是不\n錯。但是花兒也被淘汰的太莫名其妙了吧！游一游就出局了！喀浪像是只戴了個鯊魚頭套\n\
  ，完全不覺得他厲害在哪。而且感覺那四個人質在水裡，很像海底串屍...第三場的迷宮\n，整個很虛，少了一堆怪獸不說，最後哈利跟西追根本就是一副巴不得對方死的樣子...\n\
  不過西追死掉，被帶回來的那幕，真的有一種很難過的感覺...導演果然是比較會掌握感\n情的表達，而不是動作的呈現。而且導演給了太多線索，但是有些線索的收尾卻收的很草\n\
  率，像是柯羅奇之死等等。導致整部電影有些地方給人覺得有點零散，甚至會出現莫名其\n妙的感覺。\n\n      人物方面，個人覺得三名鬥士外表都還不錯，只是喀浪好像太壯了一點點\
  \ XD 。但\n是西追怎麼一開始感覺有點流裡流氣的...那個光明磊落的男孩呢？花兒更不用說，最後\n迷宮的部分，還一邊哭一邊尖叫亂跑是怎樣...沒看過書的人，大概會想說，波八洞怎麼\n\
  好像選了個很沒用的出來...喀浪有點不夠陰沉，而且妙哩哩居然說喀浪『比較喜歡動手\n動腳』！好害羞啊！鄧不利多這集不知道在急什麼...情緒很爆走。美心夫人...我唯一的\n\
  感想是orz...拜託不要用那種眼神跟海格眉來眼去好不好...搞到後來我以為海格才是女\n的...\n\n      三位小主角，我覺得這集都相當進入自己的角色裡。Rupert感覺他好像就是在演自\n\
  己，那種尷尬或是窩囊的感覺很到位。Dianiel對於哈利的心境掌握的真的是越來越好了\n，感覺他這集真的是從內散發出一種哈利的氣質。Emma這集的很多表情實在是稍嫌誇張了\n\
  些，但是他真的讓我覺得他就是活生生的妙麗。\n\n基本上如果可以的話，我想我會去看一次IMAX版的。看看有沒有不一樣的感覺。\n\n最後的大心得一定要說一下，妙哩哩好正！正到他一出場我就在華納的椅子上打滾！\n\
  \n\n--\n\n    有些人該\n\n          有些人卻\n\n\n--\n◆ From: 140.129.60.22"
