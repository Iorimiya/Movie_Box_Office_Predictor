url: https://www.ptt.cc/bbs/movie/M.1132537681.A.2DA.html
title: '[心得] 哈利波特四:火盃的考驗'
content: "上映的第一天  出乎意料的有不錯的位子  就買了票\n        本來是要看 \"春心蕩漾\"的  꼊        都怪那笑話  害我買票時差點說成\
  \ \"考盃的火焰\" orz\n\n        這一集的哈利波特  老實說  我自己覺得比第三集遜色\n        不過我相信票房一定比第三集好\n\n\
  \        第三集的導演是我很欣賞的一位\n        他的\"烈愛風雲\" 當年真是深深感動我\n        也許畫面比較陰沉  但是比較有詩意\
  \  有美感\n        很多畫面定格都像藝術品一樣\n        對於故事的取捨編排  還有演員的調度  都很有水準\n\n        不過哈利波特本來的訴求就是大眾娛樂片\n\
  \        所以我想他應該很難獲得認同吧\n        換個方式想  不同的導演  딊        詮釋不同的哈利波特  看起來也挺有趣的\n  \
  \      똊        第四集基本上中規中矩  該有的都有\n        不過演員發揮的空間不大\n        鄧不利多變得很普通  那種智慧與氣度都沒有表現出來\n\
  \        連石內卜都比他有深度\n        \"紅龍\"佛地魔還不錯 看得出來下一集會有更大的發揮\n        雙胞胎很搶戲  以後大有可為\n\
  \        也許是哈利 榮恩 妙麗已經演了三部了\n        他們表現很稱職  14歲那種易憤怒易傷心易猜疑的個性抓得很準\n        另外的張秋\
  \ 花兒 喀浪就很普通了  有點生硬\n        西追不錯  否則其他人真看不出是哈利的對手呀...\n\n        至於內容  很多時候剪接有點怪\
  \  突然就跳接\n        感覺不能連貫起來  尤其是舞會那附近\n        佈景視覺比第一集差一點\n        配樂令人很失望  完全沒有辨識度\n\
  \        一二集的主旋律很明顯\n        第三集預告中的那首合唱曲太好了\n        第四集只有一些批哩啪拉碰\n\n        最好的部分是表達那個年紀的少年\n\
  \        對異性的情愫與靦腆 和同性之間的嫉妒與友情\n        很細膩也很寫實\n\n        心得大致上是這樣\n        不過我覺得蝙蝠俠開戰時刻\n\
  \        比這部電影停留在我腦中多很久...\n\n--\n◆ From: 140.112.121.97"
