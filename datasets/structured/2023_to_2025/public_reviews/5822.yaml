url: https://www.ptt.cc/bbs/movie/M.1132476399.A.D76.html
title: '[心得] 哈利波特-火盃的考驗 (內有劇情)'
content: "哈利波特－火盃的考驗\n　Harry Potter and The Goblet of Fire\n\n　在眾所矚目之後\n　哈利波特４終於現身於大螢幕\n\
  　\n　在因緣際會之下接觸到了這系列電影\n　便被其中的神祕魔法以及天馬行空的劇情所吸引\n　不知為何　或許這系列小說真有那樣的魔法吧\n　於此　在前三集的感染之下早已對傳聞中劇情最多的第四及充滿興趣\n\
  \n　嗯　我是那種從來沒看過這系列小說而只有看過電影的\n　但是之前的系列電影所呈現出來的感覺卻是相當具體且完整\n　編導的實力確實是值得稱許與讚賞\n　只不過個人覺得第三集所帶給我的感覺有那麼些許不一樣　但卻說不出那樣的感覺\n\
  　到了現在的第四集　有一種這類電影逐步商業化的趨向\n　而沒有當初那種想要把心目中的魔法世界呈現出來的熱情　一種夢想\n\n　片長157分鐘　說長不長　說短不短\n\
  \n　可以理解的是　魁地奇世界盃如此曇花一現\n　要是真的比下去　那可能還要再拍一部　哈利波特－魁地奇世界盃\n　三巫鬥法大賽只看得看最後人選－哈利奮戰的身影\n\
  　真要細分的話　哈利波特－三巫鬥法大賽　也是勢在必行\n　所以....真的要說　編劇還真是有夠簡明扼要\n　這部電影大部分來說　真的是　哈利波特－火盃的考驗＝＝\n\
  　\n　然而　將這麼厚一本小說要將之翻拍成電影\n　相信編導的功力一定不在話下　但要怎麼樣增刪以及呈現流暢的劇情更是考驗所在\n　主題　似乎已完整的呈現出來　只不過流暢度卻是這部電影讓我很頭痛的地方\n\
  　由於　哈利波特這部小說已堪稱為ㄧ部鉅作　自然對他的電影劇情有所期待\n　然而在抱著同時兼顧劇情＋享受娛樂的心情去欣賞這部電影時\n　卻不免讓人有些小失望\n\n\
  　以娛樂性質而言　這部電影它很成功了達到訴求\n　然而劇情卻是備受考驗的地方　感覺有些地方很突兀　甚至含糊不清\n　或許這方面真的要去看完原作才能深刻體會J.K的筆下功夫\n\
  　對我來說這部電影如果是抱著對劇情有些許期待　那會有點失望\n　但是如果只是想看看炫麗的魔法特效　神奇的魔幻世界\n　那這部電影還是做的很成功\n\n　或許個人訴求不同　則接受這部電影的程度亦因此因人而異\n\
  　因為這部電影感覺不太流暢之故　害我現在好像看這部小說= =\"\n\n　另一點直得讚賞的地方就是三巫的選角　個人相當推崇呀\n　西追、喀浪、花兒　各自的特色相當鮮明　具有自我的風格\n\
  　再加上黑暗魔王詭異的現身　更讓哈利波特系列邁向另一類的里程\n　不再是單純的魔法世界了　更加上黑暗、恐懼等的負面元素　使之多元化\n　最後看到西追掛點　眼淚在淚框轉呀轉　真是感人＋催淚\n\
  \n  說了這麼多　對劇情再怎麼樣懷疑\n　還是會繼續看接下來的續集電影\n　試著去接受　單純的去享受　或許會看的更輕鬆愉快\n　沒辦法　這系列就是有那麼一種無法抗拒的魔法\n\
  　令人無法自拔呀~~\n\n　\n\n--\n◆ From: 218.163.145.174"
