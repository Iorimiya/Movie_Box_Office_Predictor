url: https://www.ptt.cc/bbs/movie/M.1132926939.A.E0A.html
title: '[影評] 純建議影評---哈利波特4 火盃的考驗 94分'
content: "有時在想，要是我沒看過哈利波特第四集的小說，我一定給這部電影很高分!!!如果你\n\n還沒看過第四集哈利波特小說，這部哈利波特4你一定要去看，因為這絕對是哈利波特最引\n\
  \n人入勝的一集，也是會讓你在電影院像坐雲霄飛車的一集!!!\n\n\n\n\n\n\n\n\n\n\n\n    就我目前看過哈利波特前五集來說(我還沒看第六集~~~)，我覺得寫的最好的就是這\"\
  \n\n火盃的考驗\"，一方面開創了本小說魔法的世界觀(原來不是只有霍格華茲這家學校)，魁地\n\n奇世界盃放在開頭是多麼熱鬧繽紛，加上另兩所不同風格的學校一同角逐\"\
  三巫鬥法大賽\"\n\n，更顯得出與前三集哈利波特完全不同的格局；一方面隨著\"三巫鬥法大賽\"的種種難關，\n\n不但感受每個關卡的刺激(好像在玩RPG還要一關一關過)，後面最高段的伏筆更是將哈利波\n\
  \n特這一系列鋪成至最高點，並且危險感大增，甚至開始每集死一、兩個重要人物(>\"<...)\n\n，也於是，這部片絕對是沒看過哈利波特4小說的人近期必看電影!\n\
  \n\n\n\n\n\n\n\n\n    那麼...看過小說的人呢?首先要一個概念就是，這麼厚的一本小說要將每個細節情感\n\n、每個人物背景刻劃細膩是十分不容易的事情，要讓觀眾覺得能抓住精髓又不亢長更是重\n\
  \n要。也因此，這部片的導演選擇以哈利波特的經歷冒險為中心，放棄一些枝葉細節的故事\n\n(我的家庭小精靈多比有獲得自由嗎?為什麼這部片都沒出現呢?)，也放棄了魁地奇世界盃\n\
  \n裡的許多敘述，如喀浪的英姿、預言家日報的狗仔隊所作所為、多比的現身，也放棄了哈\n\n利波特跟張秋、西追的情愫，已至於看過小說的人總覺得電影雖精采，卻因為少了很多的\n\
  \n人物背景塑造，整個電影深度顯的不夠，更讓許多死衷書迷有些失望。\n\n\n\n\n\n\n\n\n\n   但是就我而言，我還是粉喜歡這一部電影(特別是以娛樂片的角度)，剛開始熱鬧盛大的\n\
  \n魁地奇世界盃，繽紛滾滾、熱血激昂的比賽氣氛，真的彷彿置身在其中，並隨著哈利波特\n\n感受兩大強隊進場的氣勢，只是可惜在曇花一現(還我喀浪~~)。開頭兩大學校於霍格華茲\n\
  \n的出場，男生雄壯有魄力、女生嬌羞有魅力，都讓這片的開頭呈現出一波波高潮。直至第\n\n一段面對火龍搶金蛋比賽，正式告訴大家這部片那麼多的特效預算是用在哪邊啦!!!本段\n\
  \n不但刺激緊張、速度感夠，加上栩栩如生的龍，真是很讓人為哈利捏一把冷汗~~~\n\n\n\n\n\n\n\n\n\n\n\n    接下來的另兩段考驗也是值回票價，水中搏鬥、迷宮裡的黑暗氣氛，都讓看過小說的\n\
  \n人覺得確實如同小說陳述的一樣，很有想像力。只是因為有些劇情必須陳述，放在每段考\n\n驗的中間總會有一些枯燥，更因為片長近三個小時的專注，難免會在某一段對決之外的劇\n\
  \n情呈恍神狀態(我的女友就是在電影三分之二時中了昏迷咒)，因此要看此片務必要精神好\n\n的時候去觀賞。這樣一來當最後的伏筆浮出檯面時，很難不為哈利波特4這麼精采絕倫的\n\
  \n劇情叫好，也會讓你不得不對J.K 羅琳這位厲害的作家俯首稱臣呀!\n\n\n\n\n\n\n\n\n\n\n\n\n\n    最後要總結的是，我現在還在猶豫要不要先看第六集的小說，因為哈利波特就像一本\n\
  \n推理小說，一但你知道最後的兇手是誰時，就會喪失很多看電影所沒有的趣味，也以致於\n\n，會像我一樣雖然每集哈利波特的電影都有看，卻始終無法替哈利緊張，而無危機感，更\n\
  \n會像找砸般，找出哪些劇情沒出現，哪些喬段和小說一樣...唉~~~劣根性呀!!!\n\n\n\n\n\n\n\n\n\n\n\n◎純建議評分：94分(已看過小說的人)\n\
  \n\n              97分(沒看過小說又有好精神的人)\n\n\n\n\n◎花錢程度：建議到聲光一流的戲院來享受魔幻繽紛的三巫鬥法大會!!!\n\
  \n\n\n\n\n◎看完之後遺症：看過小說的人會重翻小說找砸、沒看過的則會找小說來看它細膩的劇情\n\n\n\n\n\n\n\n\n\n◎適合觀賞族群：\n\n\
  \n●死忠的哈利波特迷(請抱著朝聖的心態來觀賞此片~~)\n\n●看過前三集又沒看過第四集小說的人(這集真的故事一流啦~~)\n\n●喜歡哈利波特的小朋友們(該是讓你們看看何謂恐怖片了!)\n\
  \n●喜歡沉默的羔羊：紅龍的影迷(該怎麼說呢...這片也算是魔幻版的紅龍吧)\n\n●希望亞洲人要出頭天的人(張秋我個人覺得她像小一號的賈靜雯，下一集好好表現唷!)\n\
  \n\n\n\n\n\n\n\n\n◎後記：\n\n●某些劇情交代不清，不知道沒看過小說的人看不看得懂最後面及奈威的故事...\n\n●這片導演只顧著自己，有些關於第五集的鋪成都沒敘述到，第五集堪憂呀~~\n\
  \n●這次從晚上十點二十分看到凌晨一點，中間不休息還好，一休息十分鐘就掛了三分之一\n\n  ，我女友也在這次休息中不幸喪生...\n\n●妙麗長大後變的真美、榮恩及奈威也變超高，反而是哈利跟馬份矮不隆冬，不過看在他\n\
  \n  們兩都變帥的份上，就視而不見啦...(不過一跟喀浪、西追比又...)\n\n\n\n\n\n\n\n--\n<><><><><><><><><><><>\
  \ 轉載請註明出處 <><><><><><><><><><><><><>\n\n純建議影評：1.MSN SPACES  \n            2.電子報\
  \      \n            3.無名小站    \n桃園民和戲院 奇摩家族→   \n\n--\n◆ From: 59.104.38.223"
