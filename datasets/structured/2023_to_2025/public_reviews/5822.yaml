url: https://www.ptt.cc/bbs/movie/M.1132417779.A.E22.html
title: '[心得]火盃的考驗!!!讚!!!'
content: "可能對於很多小說的忠實讀者來說\n這部片還是會有不少可以抱怨的地方\n像是有人覺得世界杯太短\n三巫鬥法大賽對於其他鬥士的描寫太少\n或是很多細節被刪掉\n\
  \n我也是超愛這級小說的人(這級小說是我覺得最好看的)\n所以我當初也對電影抱持著很大的期待去看\n結果出來我很滿意\n\n\n\n\n==============以下有雷=====================\n\
  \n\n\n\n首先我覺得以一部電影來說\n這部片該有的高潮,特效,甚至笑點都應有盡有\n對原著的主線內容也沒有做出太誇張的更改\n而且我最推崇導演在刻劃一些人物的笑點跟互動上的手法\n\
  我想這集的笑點應該是4集來最多的了\n\n從哈利對張秋的互動中\n笑點就很多了,而且從這些笑點中就很真實的表達出哈利情竇初開手無足錯的樣子\n\n利塔史譏我覺得也演的很好,可能有人覺得她與主線劇情無關\n\
  應該把她山掉換別的劇情多一點,但我覺得她出現的笑點卻讓我很喜歡\n在電影高潮中間的點綴我覺得很成功也很喜歡\n雙胞胎的戲份也變的比前幾集多了許多\n加上冷面笑降石內卜的演出\n\
  以及榮恩一貫以來的搞笑真的把緊張刺激的鬥法大會外的劇情弄得也很直得一看\n\n而就電影的高潮段落來說\n這集的高潮就比前幾集多上很多\n前幾集都是劇末來個大高潮\n\
  但這級則是再三巫鬥法大賽的三場試驗都來個小高潮\n而且最後墓園的地方跟解迷的地方又來個大高潮\n尤其是看小說看到最後的大高潮\n出乎意料的劇情真是讓人大呼過癮\n\
  \n我想導演為了要塑造出最後大高潮的地方\n所以把迷宮裡的戲刪了很多\n我也對迷宮裡很多東西被刪掉覺得可惜\n但是要是迷宮就很高朝的話\n接著墓地裡佛地摩現身跟加上跟兇手揭曉那邊可能就顯示不出更高潮的地方\n\
  但是偏偏礙於片長\n最後面其實導演也沒有著墨的根小說一樣超多\n\n但是我覺得跟第三級電影導演太趕而把天狼星由壞轉好的大逆轉太快帶過\n以致於喪失了很多小說最吸引人的玄疑度\n\
  (我個人對第三集的評價啦,喜歡第三集電影的人不要打我)\n這集對於後面的高潮至少我覺得大致上來說還滿滿意的\n\n而可能有人覺得佛地魔只是像個怪物並沒有實質上恐怖的地方\n\
  但我覺得導演對這個繳色拍的還滿用心的\n我回去一翻小說發現對復活的佛地魔書上也是寫說沒有鼻子\n只有像蛇一樣的兩個鼻孔\n我當時看電影時本來超期待雷夫范斯會把佛地魔演的超帥\n\
  超冷酷變成一個史上最受人歡迎的反派\n但是一看電影佛地魔還真醜小失望\n但一翻小說就發現原來導演還真的是照著原著把佛地魔的樣子重現\n而且從他腳踩著西追的屍體這一幕\n\
  雷夫也充分的把佛地魔毫無人性演了出來\n雖然跟我想像中有差不過還可以接受\n\n而哈利趴著西追的屍體哭那邊\n加上鄧不利多的發言\n其實我也感受到了一點難過\n\
  不知是他們演的好還是西追這個角色選角成功\n\n總之以一部電影來說火盃的考驗能給我的\n特效,笑點,高潮,感情我都感受到了\n或許小說給我的大震撼並沒有\n因為最後的劇情我都看過了自然就沒那麼玄疑\n\
  \n但是我覺得導演這次把許多的情節穿插進去卻不顯得很支離破碎\n或許對其他鬥士或是一些劇情刪掉了\n不過光重要劇情一拍就2小時37分鐘\n要都符合大家的期待拍出很多細節根本是不大可能的\n\
  \n總之把這部片當成一部電影\n而不要太以原著的觀點去挑毛病的話的話\n火盃的考驗真的是一部值得大家去看的電影\n要看帥哥美女主角應有盡有\n特效也絕對不會讓你失望\n\
  而且這集也是我覺得4集中最好笑的\n超推薦大家去看得啦\n\n\n但是我還是比較喜歡前兩集的鄧不利多= =\n還有以後就沒西追的戲份了,真是太可惜了\n很期待西追能繼續出現說.....................\n\
  \n\n--\n\n猜猜的是什麼???\n\n\n                          \n\n--\n◆ From: 211.74.191.194"
