title: '[討論] 哈利波特 火盃的考驗'
content: '我沒看過小說


  想問一下


  西追為什麼這麼紅 一副就是我初登場 我超紅


  是不是什麼東西都可以成為港口鑰?

  電影就出現鞋子和獎盃


  火盃是不是可以透過作弊的方式參賽?

  我的意思是明明有人替哈利報名 但故事卻不去追到底是誰幹的

  就這樣順理成章地讓哈利參賽

  而且三巫鬥法根本超危險的 根本就是會死人

  這種活動還辦給學生玩

  怎麼看這比賽都應該給社會人士參加的吧 太夭壽骨了


  JK羅琳有另外介紹黑湖嗎? 感覺非常神秘 而且還有建築物的痕跡


  死食人跟一般的巫師有什麼不一樣嗎


  跟著佛地魔的除了馬份家還有誰? 是都像馬份家一樣背骨嗎


  謝謝


  --'
