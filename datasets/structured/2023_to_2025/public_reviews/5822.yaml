url: https://www.ptt.cc/bbs/movie/M.1132525577.A.B0A.html
title: '[心得] 哈利波特四 - 火盃的考驗(小雷)'
content: "[內容]\n\n    有三間魔法學校要舉辦三巫鬥法大賽,每個學校選一名代表,想參賽的學生可以把\n\n自己名字投入火盃,讓火盃決定誰可以參賽,規定是要滿17歲,哈利波特只有14歲.在火\n\
  \n盃選代表的那天,火盃把三個學校的代表都選出來,卻又跳出第四個代表...哈利波特.\n\n哈利波特說自己沒投自己名字,教授們尊重火盃的決定,讓哈利波特參賽.\n\
  \n    在鬥的三個法裡面,第一個是從火龍拿到金球才能知道接下來怎麼做.第二個考驗\n\n就是在水底限時一個小時把自己的朋友救出來,以決定第三關入門的順序.第三關,也\n\
  \n就是最後一關,四位參賽者要從迷宮裡面找獎盃,先找到者為冠軍,可以留名青史.\n\n    在哈利波特和另一位參賽者西追同時碰到獎盃後,兩人就進入別的世界,這才知道\n\
  \n獎盃被弗地魔動了手腳,獎盃把他們兩個引到服地魔西的世界,追西因為被弗地魔打到\n\n而喪生了,哈利波特在裡面和弗地魔鬥法,靠著去世的他爸媽和西追等靈魂的幫助,而脫\n\
  \n離弗地魔的世界,回到比賽的原場地終點,成為冠軍.\n\n    大家抓到這次事件的元兇,也知道弗地魔逃出來,我想這是下一集序幕吧.\n[心得]\n\n1.男的話,西追迪哥里的確長的好看.女生的話,哈利波特喜歡的那個東方小女孩張秋\n\
  \n我蠻喜歡的,另一個女參賽者花兒蠻有氣質的,妙麗在舞會時打扮的比較好看.\n\n2.我覺得哈利波特因為被火盃覺得他是參賽者的事,被大家排擠在背後說閒話真的很\n\
  \n倒楣,這就是人性.幸好他過第一關後能贏回大家的支持.\n\n3.裡面的舞會邀伴讓我覺得當男生要主動點機會才會多.哈利波特和榮恩因為太慢主動\n\n就都沒約到想約的人.\n\
  \n4.哈利波特對付那個的片段,我覺得贏的比較莫名其妙.龍不用飛的而用爬的也很怪.\n\nPS:1.預告裡面的金剛動作很有爆發力,看大螢幕應該會很震撼,考慮下次看.\n\
  \n   2.我還沒看過書,聽說有小部分電影和書不太一樣.電影有少了書上一部分的內容.\n\n例如金妮和哈利戀愛的伏筆,以及榮恩和妙麗的關係.\n\n\n--\n\
  ◆ From: 140.112.250.9"
