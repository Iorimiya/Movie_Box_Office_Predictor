title: '[情報]《萊茵金》德國饒舌歌手真人真事改編電影 '
content: "《萊茵金》德國頂尖饒舌歌手 Xatar 真人真事改編的黑色犯罪喜劇電影，戴罪浪子能否\n順利回頭？\n\n\n柏林金熊獎大導演法提阿金 (Fatih\
  \ Akin) 執導執導的《萊茵金》，電影改編自德國庫德\n裔真人罪犯饒舌歌手「哈塔」Xatar 的真人真事，劇情參考了歌手本尊所撰寫的自傳書籍\n，劇情融合了音樂、黑幫、戰爭、喜劇等各種元素，許多影迷都期待大師的最新力作，電\n\
  影將於6月2日全台上映。\n\n\n《萊茵金》故事大綱\n\n《萊茵金》全片充滿濃厚的黑色犯罪喜劇幽默風格，在德國首映時，票房即勇奪佳績且受\n到熱烈迴響。電影劇情講述饒舌歌手哈塔\
  \ (Xatar) 是如何從庫德族難民變成憤世嫉俗的\n罪犯，再一躍成為德國炙手可熱的嘻哈巨星，從貧民區街頭的一家商店，到販賣古柯鹼，\n再到因搶劫黃金車入獄，再從那裡發展成嘻哈音樂世界的榜首。為捕捉真實的場景，劇組\n\
  跨國拍攝，橫跨伊拉克、德國科隆、阿姆斯特丹、伊斯坦堡、杜拜等場地，呈現這位饒舌\n歌手顛沛流離又戲劇化的精采人生。\n\n\n德國爆紅小鮮肉「薩卡里亞」呈現主角戲劇化的人生\n\
  \n德國爆紅性感小鮮肉薩卡里亞 (Emilio Sakraya) 飾演男主角哈塔，電影宛如史詩般壯闊\n的格局，《萊茵金》無疑是導演生涯最具野心及結合各種元素的傑作。影片的第一部分，\n\
  講述了一個小男孩被驅逐出伊拉克、他的逃亡、失去家園和文化人身份。此部精采的傳記\n電影呈現了他人生許多精采的故事情節，小男孩吉瓦出生在伊朗北部村莊的一個爆充蝙蝠\n\
  的洞穴，父母是庫德人，為了逃離伊朗何梅尼的教令，加入抵抗戰士，後來在紅十字會的\n幫助下逃往巴黎之前又被捕；他三歲時抵達德國波昂，他的作曲家父親在那裡接受了歌劇\n\
  院指揮家的職位。\n\n在他求學期間父母分居，他開始販賣大麻和盜版 VHS 色情片、與附近的土耳其人打架、\n他對德國波昂嘻哈饒舌音樂產生濃烈興趣，因緣際會下他加入大盤古柯鹼販毒圈成為藥頭\n\
  、他逃往阿姆斯特丹、與荷蘭庫德黑手黨關係成為夜店的安管，擔任保鏢；他返回德國，\n最後搶劫了偷運各地掘墓人從死者身上偷走金牙的德國貨車。被判 8 年在監獄裡，他攜\n\
  帶錄音筆進監獄並錄製了首張專輯成為發片歌手。\n\n\n從生活艱難地「難民」到鼓舞人心的「饒舌歌手」\n\n這部關於戰爭難民的電影，是個關於憤世嫉俗和投機取巧的罪犯，最後描述他是如何成為\n\
  一位鼓舞人心的饒舌歌手，除了歌曲中講述了他的艱難生活。法提阿金絕對是擔任此片導\n演最適合的人選。\n\n值得一提的是，現實中的哈塔本尊橫跨多元身分，現在不僅是家喻戶曉德國嘻哈界最偉大\n\
  的明星之一，也是一位成功的企業家和餐館老闆，更有人急於想知道搶來的黃金最後藏在\n哪裡？\n\n\n預告 \n\n資料來源: \n\n\n又一個奇葩片名~\n\n\
