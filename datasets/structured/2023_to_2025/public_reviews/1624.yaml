url: https://www.ptt.cc/bbs/movie/M.1685885925.A.7EA.html
title: '[好雷] 萊茵金'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  嘻哈音樂在1970年代起源自美國貧民區，現在已經成為風靡全球的音樂類型，近來也在亞

  洲掀起風潮，近年也不乏將饒舌文化搬上大銀幕的例子，包括：探討種族的好萊塢電影《

  盲點》與改編自摩洛哥嘻哈歌手阿納斯本人故事的《聽見心嘻望》，讓更多喜歡饒舌或想

  要更認識嘻哈文化的影迷能夠一飽耳福。



  從貧民區到嘻哈音樂榜首，饒舌歌手哈塔Xatar的人生充滿戲劇化的生活冒險故事。從平

  民街頭小混混變成大尾毒販，直到有次貨物丟失，為了償還黑老大的債務，他策劃一場傳

  奇的公路黃金搶劫案，並從德國消失逃到荷蘭。



  德國小鮮肉薩卡里亞（Emilio Sakraya）飾演男主角哈塔，電影宛如史詩般壯闊的格局，

  《萊茵金》無疑是導演生涯最具野心及結合各種元素的傑作。電影後半部分橫跨許多國家

  實景拍攝且運用不同的銀幕比例呈現，並在不同的時間層次上進行剪輯，散發出另一種電

  影大師的搶劫黑色喜劇風格。



  哈塔求學期間父母分居，他開始販賣大麻與盜版 VHS 色情片、與附近的土耳其人打架、

  對德國波昂嘻哈饒舌音樂產生濃烈興趣，因緣際會下他加入大盤古柯鹼販毒圈成為藥頭、

  逃往阿姆斯特丹、與荷蘭庫德黑手黨攀上關係成為夜店的安管，擔任保鏢；最後返回德國

  ，搶劫偷運各地掘墓人從死者身上偷走金牙的德國貨車。



  這不但是一部關於戰爭難民的電影，也關於一個憤世嫉俗且投機取巧的罪犯，最後描述他

  是如何成為一位鼓舞人心的饒舌歌手，並在歌曲中講述自己的艱難生活。



  哈塔的本名是吉瓦，意思是「生於苦難」。他是出生於伊朗的庫德族人，全家由於國內的

  迫害與戰亂逃到伊拉克，此時，第一次波斯灣戰爭又爆發，海珊的政權隨後攻擊伊拉克境

  內的庫德族人，吉瓦一家也不例外。雖說因為父親的作曲家身分，他們一家很快就獲釋，

  但仍遭到囚禁與刑求三個月。



  吉瓦非常重視家庭，即便逃到德國成為難民，來自上流社會與音樂世家的媽媽說什麼也要

  為吉瓦請鋼琴家教，即使自己要幫老師打掃也在所不惜，媽媽的付出吉瓦都看在眼裡。在

  父母都辛苦在外賺錢的年代，吉瓦更是一位疼愛妹妹的好哥哥，甚至會幫妹妹綁頭髮，而

  當父親外遇，決定搬離家人，吉瓦與媽媽抱著痛哭失聲的妹妹，同時也默默決定要一肩扛

  起家庭的重擔。就算他最後成為幫派份子，吉瓦都不希望媽媽與妹妹由於自己的緣故而受

  到任何一丁點的傷害。



  雖然外遇的爸爸就是一個反面的鐵證，但這樣以家庭為重的觀念深植庫德族人的心。黑手

  黨「叔叔」經營夜店只有一個原則，他不要任何土耳其或伊朗的女孩子進去店裡，雖沒有

  明說，但想必指的並不是去夜店當客人喝酒玩樂，而是「提供服務的小姐」。正所謂「在

  家靠父母，出外靠朋友」，大家同為庫德族人，在異鄉就是兄弟姊妹，互相照應才是生存

  之道。



  常言道「學音樂的孩子不會變壞」，而吉瓦顯然就是變壞了，不過，在各種時刻拉他一把

  的還是「音樂」。當年因為爸爸外遇，品學兼優的吉瓦開始自暴自棄不彈琴，還交到所謂

  的「壞朋友」開始賣A片、販毒，但朋友嘴裡哼著的饒舌歌一直迴盪在他腦海裡，吉瓦於

  是也開始作詞，一次因緣際會下得知一位嘻哈混音大師，便前去向他討教。這位大師除了

  讓吉瓦對饒舌有更深的認識之外，也是他協助吉瓦在服刑期間發行首張個人專輯。



  吉瓦在犯下黃金搶案後，逃往荷蘭，但他不僅是要躲避追緝，他還打算重拾兒時的夢想，

  決定進入阿姆斯特丹藝術學院就讀，同時也可以讓媽媽放心。即便後來加入黑手黨，「叔

  叔」看到吉瓦談到音樂時兩眼發光，又知道吉他是作曲名家的兒子，也與吉瓦約法三章，

  要求他絕對不能荒廢學業。雖說吉瓦最後覺得藝術學院的內容太過學術，不適合自己，但

  他也不是單純半途而廢，而是真心萌生回德國去開設唱片公司的念頭。



  就連最後引領吉瓦在出獄後走上正途的，也是他在獄中發行的專輯，讓吉瓦一炮而紅。他

  的音樂揉合來自父母的古典與吉瓦在街頭闖蕩的嘻哈，成為專屬於他個人的正字標記，極

  具特色又意義非凡。



  「你第一個有印象的記憶是什麼？」



  片尾，吉瓦與青梅竹馬雪琳生下的可愛女兒在學校由於爸爸的過去而遭到霸凌，吉瓦也認

  真思考該如何在不傷害父女情誼的情況下，既機會教育又講述事實。最後，他問女兒「第

  一個有印象的記憶是什麼？」生長在富裕又充滿愛的家庭中，小公主回答「迪士尼」，吉

  瓦則表示自己的答案是「監獄」。他人生第一次入獄甚至不是因為犯下什麼罪，而是戰爭

  ，之後由於賣A片遭學校開除，進而販毒進入少年輔育院，自此便經常進出監獄。對過去

  的吉瓦來說，可能在監獄打滾更能讓他為自己的不幸人生開脫。就像父親拋家棄子，所以

  吉瓦不再彈琴；為了幫媽媽分擔辛勞，因此賣A片賺錢他也絲毫不覺有錯。這種「我就爛

  」的思維，讓吉瓦一步錯，步步錯，最後還好有音樂，他才能成為自己小時候最想成為的

  大人。



  「一旦找到，就不會想再放手。」



  至於片名為何叫做「萊茵金」，其實與吉瓦的黃金搶案一點關係都沒有，而是電影一開始

  時，爸爸跟小吉瓦說的神話故事，也就是德國劇作家華格納的歌劇《萊茵的黃金》。爸爸

  說沒人知道黃金在哪裡，只有守護黃金的三位萊茵少女，也就是水仙子知道。電影最後，

  女兒問吉瓦當年搶到的黃金在哪裡，鏡頭從他們對話的客廳逐漸拉遠到萊茵河，深潛入河

  來到有著三隻人魚守護的閃閃發亮處，這便是萊茵的黃金。對吉瓦來說，他的萊茵金應該

  是家人與音樂。吉瓦的三人小家庭或許代表著那三名守護黃金的萊因少女，可能是世界上

  唯三知道黃金所在地的人，更重要的是，音樂就是吉瓦「一旦找到就不想放手」的寶貝。



  雖然電影並沒有著墨太多吉瓦與雪琳的愛情故事，但從一些小細節可以看出兩人的互動與

  吉瓦的深情。在吉瓦還沒走偏之前，雪琳肯定也看見他的體貼、細心與才華，而後在窗邊

  看到吉瓦與人打架後傷痕累累地回家，她也露出擔憂的神情。不論是在超市報復，還是在

  雪琳打工的表演廳閒話家常，都看得出當年那個害羞的吉瓦，即使在表演廳的表現稍嫌霸

  道，但後續也表現出他的體貼，或許正是這些小細節打動雪琳的心，也讓這部犯罪傳記片

  不會那麼剛硬，也有比較柔和的一面。



  吉瓦的剛硬是在街頭鍛鍊起來的，起初只是個販毒的小混混，遇到賴皮的惡棍完全拿人家

  沒辦法，想討公道反而挨一頓揍，於是，他到拳館去找曾經幫自己解圍過的大叔，希望對

  方傳授他在街頭生存的技巧。學成之後，大叔說吉瓦現在已經是「哈塔」了，意思是「危

  險人物」。從「生於苦難」到「危險人物」，他不只習得防身的技能，更找到自己未來好

  幾年的生財之道。犯罪固然不對，但倘若吉瓦沒走過這一遭，他也無法將街頭的養分納入

  音樂，形成哈塔的饒舌風格。



  真要說《萊茵金》有什麼缺點，那就是男主角薩卡里亞太過帥氣。雖說薩卡里亞27歲，而

  哈塔本人目前已經是41歲的大叔，但他粗獷的外表應該與年齡無關。就算進入光頭造型之

  後，薩卡里亞也與哈塔一樣蓄鬍，但相比之下他的長相的確乾淨不少，再加上又是主角，

  自然讓人容易對這個角色產生同情與共感，但不要忘記，哈塔畢竟是仍真實存在的人物，

  而且他實際上也是一名罪犯，電影的主角濾鏡之下觀眾還是必須保有價值判斷才是。


  --

