title: '[普雷]《萊茵金》從貧民搶匪到音樂製作人'
content: '監獄饒舌，混街頭難民的嘻哈不諧之音


  人們熱愛八卦，尤其是名人和具有衝突感的故事。一種是看原本天上繁星殞落，可以順便

  落井下石，另外一種就是看沒沒無聞的人崛起的爽快感。


  在這些作品裡，我們不只有上帝視角，也活像菜市場歐巴桑、公園歐吉桑一樣把他人的生

  活當成配飯趣事，而且太無聊的還不要，要看血流成河的嗜血。


  電影《萊茵金》改編至德國庫德裔罪犯饒舌歌手哈塔的傳記故事，小時候在伊拉克遭遇戰

  亂，跟隨家人逃難到德國成為貧民的哈塔，從小開始混街頭，為了不被欺負從小混混變成

  了大尾毒販的跟班，在一次販毒失誤損失慘重，哈塔參與了一場公路黃金搶劫案進了監獄

  ，而在這與外隔絕的的年月裡，意外讓他找回了音樂與人生的節奏。








  《萊茵金》是什麼電影？


  世界上多半有許多不公平，而這些不公平不外乎從出生的當下就決定好，例如男女、種族

  與國家，更有感一點的例如唅金湯匙出生與一貧如洗的孩子，能獲得的資源來為未來夢想

  鋪路的崎嶇程度其實不同。


  這也是為什麼當電影中底層的主角成功逆轉，獲得成功觀眾會如此興奮甚至有種欣慰，因

  為在現實中這種谷底翻身的狀況少之又少。


  通常成功者都有錢，少數者更有錢。這也使普通人走上巔峰需要許多天時地利人和，運氣

  和賭博通常成為一個成功道路之一，而有時候跌到一無所有的人，可以繼續我就爛，也可

  以無畏的拚一把。在貧民窟或是底層窮人有時候就是如此，而拚成功的人，才有資格像如

  今這般，大聲公開自己的黑歷史。










  以德國嘻哈歌手哈塔的傳記改編的電影《萊茵金》，片名取於哈塔的作曲家父親在過去為

  他講述，由華格納作曲《萊茵的黃金》故事，指沉在深處未被發掘的黃金，來表示許多有

  才華的貧民與底層人士被埋沒在深淵裡。這邊片商惡趣味的翻譯出諧音梗，可能想有點嘻

  哈放蕩不羈的風格，但是否有替電影加分和受到觀眾注意，不得而知。


  從因為戰亂一路逃跑人生的哈塔，跟隨父母來到德國，因為貧窮而走偏路成了街頭青少年

  ，因為作曲家父親的關係，哈塔學習很長一段時間的古典音樂。


  隨著毒品生意越做越大，最終還是成了監獄犯，並且還參與黃金搶案被判除有期徒刑，最

  後在監獄的日子裡做出了他自己的「饒舌樂」成為當時最火紅的德國饒舌囚犯。













  《萊茵金》分析與延伸：


  這部電影除了根據饒舌歌手哈塔的口訴，也根據2015年他自己出版的自傳小說《孤注一擲

  》的情節去拍攝，書中詳細的紀錄他參加搶劫案與如何將自己的黑幫生活，寫成嘻哈歌詞

  ，一直追憶到他的學生時代，和嘻哈的啟發。


  最後他因負債累累參與了黃金搶案，成功搶奪大量的黃金，但也被迅速逮捕，而有意思的

  是目前還沒有知道當時搶奪的黃金到底被他們一夥人藏在何處。


  德國饒舌歌手哈塔從過去到現在的生活可以說是別具戲劇色彩，很具有一個黑幫出生的嘻

  哈歌手所有的槍林彈雨的人生風景，尤其又加上種族議題，可以說相當具有爭議性。電影

  中雖然有提到他想成立公司，但卻未提及他其實在被逮捕後一直還在執行公司營運，而電

  影中描繪走投無路雖然用別的相關事件替代，但有人猜測他會鋌而走險的主因可能還是因

  為公司營運需要不小的資金償還虧損債務。









  原則上電影描繪的監獄偷偷錄製的唱片算是哈塔的「第二張專輯」，在他2007成立音樂公

  司Alles oder Nix Records後，簽下一些黑幫與女性饒舌歌手，也在2008年推出第一張自

  己的饒舌專輯．但因為裡面有七首歌的歌詞被德國聯邦審查委員會以「對未成年人有害」

  為由，認為他煽動使用暴力與以暴制暴的觀念太過偏激，而成為黑名單。


  而有意思的是雖然哈塔為黑幫饒舌歌手，但也有不少人對於他的「精采生活」提出質疑，

  例如時間點對不上、與過度膨脹的故事性，甚至英雄化混街頭的份子。


  有些音樂評論認為，哈塔的饒舌歌詞帶有強烈的「經典黑道故事色彩」，也可能一半是虛

  構；一半是真實，在半真半假間。認為他有說故事與成為領頭者的天份，但也因為許多籠

  統的談話字詞而降低了他的影響力。












  《萊茵金》值得一看嗎？


  我覺得這部雖然是自傳電影但卻很像反套路的主角成長電影，從因為戰爭而成了遊民、在

  從街頭混混成為毒梟、最後又是黃金搶案、音樂公司創辦人、饒舌歌手等，說是真實人生

  整個太過於魔幻。雖然就如一些評論者說的，我們不知道這裡面有幾分真實、多少虛構在

  裡頭，但是《萊茵金》的確是個一次擁有多種風格與風采的自傳電影。


  但同樣的因為電影故事線不同的再換，導致整個故事被切的很零碎，在電影大綱都以監獄

  饒舌歌手為主打，但這一點卻只占電影中的一小角，其他多半都是哈塔的人生故事，與回

  憶。


  但因為又有戰爭、街頭鬥毆、販毒懸疑、音樂製作與體悟成長，整體而言在轉換時有點搭

  不起來，像是你剛融入一個時期的哈塔又得接受下一個時期的他，最後變成只是一部有著

  各種過場的人物幻燈片。









  有些人認為《萊茵金》有點深化貧民窟和難民的刻板，同時也留有嘻哈歌手染毒、染黑等

  既定印象，但我認為這其實就是嘻哈的其中一種類型。在美國也都許多都是幫派出生的饒

  舌，甚至是幫派聯合推上娛樂圈的幾乎不是什麼新聞。


  德國庫德裔饒舌歌手哈塔，整體而言很符合一般人眼中犯罪出生的饒舌歌手印象，又或是

  比起他擁有的音樂底子，一位作曲家之子，哈塔更享受有個黑幫饒舌歌手的稱號。


  簡而言之，這不是一部底層人努力奮鬥獲得成功的美好故事。反而是一個投機取巧、放棄

  正常學業、並且走暗路想賺快錢，甚至靠著販賣自己的黑幫冒險故事，一炮而紅的非關英

  雄故事。


  哈塔的經歷莫名其妙、成功的也莫名其妙、在德國也被批評的莫名其妙，但有一點不能忽

  略的是，這是一個「很有娛樂性」的人生故事，前提是裡面的虛構成分有多少？但假又如

  何，能賣錢的饒舌故事，可是值豪車、豪宅、還有不知藏於何處的黃金呢。


  --

  個人Blog：

  小說連載頁：


  --'
