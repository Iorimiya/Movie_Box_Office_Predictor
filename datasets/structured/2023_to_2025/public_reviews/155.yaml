title: '[好雷] 厲陰宅1vs2 經典的溫馨恐怖片'
content: '前幾年有在電視上看過溫子仁執導的陰兒房系列

  對於他特殊的拍攝手法很有印象

  之前出厲陰宅好評很多就一直想看  但可惜身邊朋友都不愛鬼片QQ

  最近看平常在用的friday影音有出厲陰宅1&2  就自己在家接電視把兩部連著看完了

  一個人看的好處就是身邊沒其他觀眾不容易分心 會感覺更毛～～～

  覺得兩部以嚇人來說1>2  但以劇情完整性2>1  都很好看！！！




  -------------以下有雷--------------




  厲陰宅1集結了很多恐怖片的經典(老)梗

  但導演把節奏掌控的很好 在要嚇不嚇之間徘徊

  讓你的情緒慢慢堆疊後 最後才在意料之外的地方出現 驚嚇感就特別強

  最深刻就是姊妹們跟媽媽搬進新家後玩的拍手遊戲

  還有克麗絲汀睡覺時被抓腳的橋段也拍得夠恐怖

  搞得我這兩天晚上睡覺  都很怕睡到一半有人會抓我的腳XD


  厲陰宅2我是覺得在氣氛的鋪陳上有比1強

  壓迫感最強的地方是修女前幾次給華倫夫人的預知夢

  尤其是在修女畫像的橋段  利用艾德可能有生命危險讓整個故事變得更緊張

  而且也加進了更多情感跟溫馨點

  尤其是一家人唱著貓王歌曲的時候  看得我眼眶都泛淚了

  最後艾德給珍妮的一段話也非常感人

  除了嚇人之外也會在觀眾的心中留下恐怖以外的共鳴


  當然核心人物華倫夫婦也增加了精彩度

  他們有著先天上的特殊體質並且能利用儀器理性的來分析情況 找出解決方法

  尤其是厲陰宅2後來的發展也是讓人出乎意料

  而華倫夫婦總是為遭遇到詛咒的家庭奮不顧身

  他們的善良及美好 還有彼此的愛更增添了整部電影的感染力(是愛情片無誤啊XD)

  希望厲陰宅系列還可以再第三集！！！


  --'
