url: https://www.ptt.cc/bbs/movie/M.1555148844.A.01E.html
title: '[新聞] 接棒「厲陰宅3」 新銳導演靠「哭泣的女人」震驚全球'
content: "新聞網址：\n\n2019-04-12 19:32 聯合報 記者陳建嘉╱即時報導\n\n「我剛到美國的時候，第一個聽到、也是最多人知道的恐怖故事就是哭泣的女人憂羅娜。\n\
  」製片溫子仁回憶起第一次聽到憂羅娜的故事時，很興奮地說：「朋友都知道我喜歡恐怖\n的故事，憂羅娜不僅讓我毛骨悚然，它還有很深厚的文化背景，伴隨著很多人成長，這讓\n\
  我想把這個古老的故事搬到現代…。」\n\n「每一個我喜歡的故事裡，女人的愛恨情仇常常是故事的主軸，」溫子仁說：「在你感受\n到恐怖的同時，你也能清楚感受到她們的情緒，是她們牽動了整個故事的走向。」「哭泣\n\
  的女人」憂羅娜曾經是個美艷動人的女子，她擁有美好的家庭與人生，但丈夫變心讓她傷\n痛欲絕，在極度悲傷與憤怒的情緒下，她親手將自己一對兒子淹死，事後她發現自己闖下\n\
  大禍，跳入河中尋死，靈魂卻被天國拒絕，她只能遊蕩在痛苦與悔恨的幽冥兩界，她甚至\n會抓走別人的孩子，希望用他們的死與上蒼交換自己的孩子。「幾百年來，這個故事廣為\n\
  流傳，人們仍堅信她的怨念沒有隨著時間消失，更讓我深信這是個絕佳的電影題材。」溫\n子仁說。\n\n溫子仁找來拍過恐怖短片的新銳導演麥可查維斯，麥可將「哭泣的女人」做出簡單的設定\n\
  ，他說：「故事裡有三個失去摯愛的女人，失去孩子的憂羅娜與派翠西亞，與剛失去丈夫\n，帶著兩個孩子的單親媽媽安娜，她們的愛、痛苦、堅強與執著構成故事的主軸。」溫子\n\
  仁喜歡麥可的構想與故事中對女性的刻劃，甚至將自己的成名系列作品「厲陰宅」第三集\n交由麥可查維斯執導，也可看出兩人彼此信任之深。\n\n接演安娜的琳達卡迪琳妮表示：溫子仁製作的恐怖片向來不會只有恐怖元素，還有更多人\n\
  性的掙扎，還沒從喪夫之痛走出來的安娜，就要在忙碌的工作與兩名子女面前振作起精神\n，當憂羅娜把目標放在她兒女身上時，她害怕、無助、卻也必須勇敢面對，琳達說：「我\n\
  喜歡這個角色，我可以體會她的疲倦與絕望，尤其當她看到唯一能幫她的竟然是辭去牧師\n改當巫醫的拉斐爾，她真的完全崩潰了，但是她也已經沒有時間了。」\n\n「哭泣的女人」故事發生在1973年的洛杉磯，一名還未走出喪夫之痛的社工媽媽安娜(琳\n\
  達卡迪林尼 飾)帶著兩個孩子，在工作與家庭間努力找尋平衡點，當她發現派翠西亞(派\n翠西亞薇拉斯奎茲 飾)將兩名年幼的孩子反鎖在衣櫃內，安娜立即將孩子安置於兒童收容\n\
  所，母親派翠西亞則被送往精神病院。然而，安娜渾然不知這個安置計畫害死了兩個稚齡\n的孩子，直到她的一對兒女也看見了這個穿著白紗的哭泣女子，安娜這才知道自己的孩子\n\
  已經身陷危機，她向牧師求助，但牧師竟然建議她去找巫醫拉斐爾，不信神的安娜對拉斐\n爾有滿腹的懷疑，但她沒有別的選擇，因為憂羅娜已經在安娜的一對子女手臂上留下印記\n\
  。\n\n電影將於17日上映。\n--\n\n    \n\n ; \n\n\n--"
