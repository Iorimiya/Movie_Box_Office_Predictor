title: 'Re: [新聞] 《厲陰宅3》首支預告上線'
content: '先不說別的

  《哭泣的女人》這電影很不好看...



  所以看到電影主打同個導演+又是溫導監製

  認真覺得進電影院就純支持女主吧（至少人家超正）




  哭泣的女人大致的故事就看到他就會發生不好的事情

  主人翁一家因為細故不小心牽扯上

  只好找上一個厲害的前神職人員幫忙處理

  但是過程中除了主人翁一家不停幫倒忙

  還出現神職人員智商下線的狀況

  整部就在某種懸疑好像驚悚的莫名其妙節奏下結束


  其實溫導的《厲2》就已經差強人意了

  唯一的神主牌應該還是《厲陰宅1》+《陰兒房1+2》


  主創中的Leigh Whannell的劇本也很值得注意

  不過目前沒在維基上看到他參與本片（陰兒房主創兼演員）


  --'
