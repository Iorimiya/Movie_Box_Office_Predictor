title: '[討論] 鬼修女的幾個問題(有雷)'
content: '防雷頁

































  今天看完鬼修女

  有幾個問題想請教

  1.為什麼鬼修女出現，耶穌的頭都會爆掉？

  這個情況是怎麼回事？

  還是因為十字架太大，所以變成耶穌頭爆掉？

  2.我記得厲陰宅裡面

  華倫夫婦有說，知道鬼的名字就能除魔

  為什麼神父很早知道，卻沒辦法除魔？

  3.為什麼有很多殭屍復活？

  而且拿槍好像比拿十字架有用？

  4.耶穌血的那個法器，到底是法器有用，還是裡面的血有用，小法似乎摸一下就可以除魔

  ？

  5.為什麼鬼修女最後還是逃掉了？

  不是把結界封印住了嗎？還是最後水裡面那個是假的？

  6.酒吧裡面鏡子和靈魂的說法

  那個和劇情有關嗎？

  7.鬼修女最後說小法辜負他是什麼意思？

  小法劈腿嗎？


  --

  了解了'
