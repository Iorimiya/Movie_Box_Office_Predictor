url: https://www.ptt.cc/bbs/movie/M.1466050969.A.D69.html
title: '[好雷] The Conjuring 2 厲陰宅2'
content: '電影板首po，希望沒有觸犯甚麼板規。


  昨天去了整修中的電影院看厲陰宅2，簡單說一下感想：






  雖然不像第一集創造出一些印象深刻的名場面，


  但兩小時無冷場，幽默、溫馨與驚悚穿插，


  情緒完全被溫子仁導演牽著走，非常過癮！






  我覺得片中亮點是飾演主角的童星 Madison Wolfe，


  演技屌打一堆二流恐怖片女角，人又蠻正的，感覺就是明日之星。





  不知道是否因為比第一集忠於原著，所以仔細探究劇情，


  會發現這集蠻多邏輯問題，疑點也很多，不過運鏡和劇情起伏還是很流暢。



  唯一可惜的是我覺得結尾收得有點草率，


  枉費前面鋪陳那麼多(還從第一集就埋哏到這集)......


  如果可以再把大BOSS描述得更立體會比較好。





  整體而言就是沒第一集恐怖，但多加了其他情緒元素，


  算是充實飽滿、進戲院不會失望的爽片，


  好吃不黏牙 (看完也不會做惡夢或有陰影)。




  --'
