title: 'Re: [討論] 看厲陰宅2 遇到吃東西大聲的觀眾'
content: '原文43


  看電影吃東西我倒覺得還可以忍受，

  但我最討厭邊看邊聊天講話的。


  像我看厲陰宅2就有遇到，

  在一個非嚇人的劇情鋪陳橋段，

  （印象是解釋家中鬧鬼的照片），

  影廳內突然有個國小小男生的聲音對他媽媽說：


  「媽媽，我想要回家了。」


  整個影廳內的人在這個moment都縮了一下，

  還有女生叫了出來XD


  電影結束亮燈還有前排的觀眾轉過頭來找尋小弟弟坐在哪裡，

  至於有沒有找到我就不清楚了

  -----

  Sent from JPTT on my iPhone


  --'
