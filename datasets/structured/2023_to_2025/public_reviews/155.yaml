url: https://www.ptt.cc/bbs/movie/M.1757868530.A.D59.html
title: '[普雷] 厲陰宅最終聖事～安娜貝兒是好鬼'
content: '下面有談到劇情






  安娜貝兒出現幾次

  第1次對女主的女兒 茱蒂獨自坐在家裡房間 安娜貝兒坐在椅子上 沒對茱蒂做任何傷害性



  第2次茱蒂被鬼聲引誘上閣樓

  安娜貝兒搖晃閣樓椅子 茱蒂回頭看椅子在搖晃 才意識到不對勁趕緊下閣樓


  第3次茱蒂下了閣樓還停留在2樓 逛起2樓房間 安娜貝兒直接附身到娃娃變巨大化 嚇到茱

  蒂趕快跑下樓 滾到1-2樓之間樓梯


  還有1次純屬猜測

  茱蒂媽媽洗碗時發生

  茱蒂吊飾照片在水槽內及滿水槽血水幻象 猜測是安娜貝兒弄的 目的給茱蒂媽媽提醒茱蒂

  有危險


  為了茱蒂

  安娜貝兒算是鬼至義盡

  長期住別人家裡還有幫忙顧小孩



  至於茱蒂本人 命格算是天煞孤星+只會出一張嘴的性格

  在史莫爾家裡 茱蒂對自己父母說

  史莫爾一家8口可憐 我要留下來幫助他們

  史莫爾一家8口可憐 我要留下來幫助他們

  史莫爾一家8口可憐 我要留下來幫助他們

  堅持不離開不回去


  結果

  父親被弄到心臟不適差點死掉

  母親被鬼嚇的半死 看到女兒情況又哭的半死

  男友被鬼弄到受傷 車子還損壞

  史莫爾的家在茱蒂未進駐前 頂多1樓餐廳的大燈壞掉

  茱蒂進駐後 2樓天花板完了 地板完了 窗戶完了 大門玻璃完了

  史莫爾本人受重傷 史莫爾女兒及老婆都被附身後的茱蒂嚇慘了


  而茱蒂說要留下來幫忙

  卻是被鬼嚇 被鬼附身 被鬼弄上吊 被鬼弄到也死

  還是父母+男友費盡萬難把茱蒂救下


  看到男友戒子

  完全不顧慮父母看法

  一直持續點頭喊願意

  家裡有這種滿滿漏風的小棉襖

  沃倫夫婦辛苦了


  --'
