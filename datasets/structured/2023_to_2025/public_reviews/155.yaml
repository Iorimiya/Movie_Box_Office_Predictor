title: '[討論] 鬼修女2 確認由厲陰宅3導演接棒執導'
content: '新聞連結:




  受到疫情延宕的厲陰宅系列終於有了新動作，


  下一部作品為鬼修女續集，導演人選定為執導厲陰宅3的 Michael Chaves。


  這位新人導演的首部長片，就是被收入厲陰宅宇宙的"哭泣的女人"，


  加上預定執導的新片，讓他成為厲陰宅系列中執導次數最多的人。



  鬼修女首集雖然評價不佳，但卻是整個系列8部作品中票房最高的，


  全球票房達3.65億，拍攝成本僅2200萬美元。


  目前厲陰宅系列仍是華納與新線最賺錢的金母雞之一。



  --'
