url: https://www.ptt.cc/bbs/movie/M.1582693598.A.CDF.html
title: '[討論] 關於厲陰宅的結局'
content: '昨天終於看完了這部耳熟能詳的電影

  結局的部分有一點不太懂



  我個人的理解是：

  驅鬼人到那個被鬼亂的白人家成功完成任務

  那家人的生活也回歸平淡

  驅鬼人則是把音樂盒帶回自己專門擺放各種惡鬼物品的房間


  問題來了


  為什麼那個音樂盒敢一進去就大搖大擺的播音樂？


  裡面那麼多窮凶極惡的鬼

  甚至需要每個月找神父來除魔

  身為菜逼八還那麼唱秋不怕被其他鬼制裁嗎？


  --'
