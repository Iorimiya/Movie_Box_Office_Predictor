url: https://www.ptt.cc/bbs/movie/M.1465303989.A.640.html
title: '[新聞] 《厲陰宅2》導演溫子仁：《水行俠》將會'
content: '新聞網址：


  《厲陰宅2》導演溫子仁：《水行俠》將會有多個反派


  文/ Sebox


  《玩命關頭7》（Furious 7）導演溫子仁（James Wen）最近即將要推出他的經典作品續

  集《厲陰宅2》（Conjuring 2），而大家最關心的莫過於接下來他即將執導 DC 世界觀的

  超級英雄電影《水行俠》（Aquaman），接在《蝙蝠俠對超人：正義曙光》（Batman v

  Superman: Dawn of Justice）後面想必壓力也前所未有的大。


  不過在先前的訪談中他表示了自己對於製作超級英雄電影的心態，甚至開了玩笑表示「《

  水行俠》故事發生在深海裡，會用到很多燈具所以不會太黑暗」，日前在訪談中他透漏了

  更多關於《水行俠》的細節，其中他特別提到了電影當中將會有超過一個以上的反派角色

  。


  「我必須說我最喜歡《水行俠》世界的一個原因是他的世界觀非常不一樣，而且角色也都

  非常有趣，連反派角色也都很有趣。我不會告訴你們這次會有哪些反派出現，但他們都超

  級酷！他們都大的誇張，但也都非常獨特。」


  在訪談中溫子仁也提到了他會執導超級英雄電影的真正原因，而正如我們在專訪溫子仁時

  他所談論的，一定要他有興趣且有熱情的故事與角色他才想拍，而《水行俠》拜現代科技

  所賜，將可以透過大銀幕來讓觀眾了解他的獨特性。


  「現在有這麼多的超級英雄電影，我不想要為了拍超級英雄電影而拍，但在《水行俠》的

  世界裡有一些很特別的東西，當然這個漫畫會到現在才拍成電影也有一定的原因，因為當

  時的科技發展並沒有辦法挑戰這麼複雜的故事，但也因為這樣讓這個電影如此不同，而這

  樣的獨特性讓我感到非常興奮。」


  當然我們還是希望電影會比溫子仁的笑話來的好看，不論黑暗與否，也不論超級英雄電影

  或是一般的電影，導演對故事的熱情與執著，以及如何把一個故事講的好、講的完整才是

  重點。《水行俠》由《300壯士》（300）系列編劇寇特強史達德（Kurt Johnstad）、《

  怒戰天神》（Wrath of the Titans）編劇大衛強森（David Johnson）共同執筆劇本，由

  傑森摩莫亞（Jason Momoa）主演，安柏赫德（Amber Heard）飾演亞特蘭提斯女王 Mera

  ，2018 年 7 月 27 日美國上映，臺灣目前沒有上映資訊。（Geektyrant）


  --'
