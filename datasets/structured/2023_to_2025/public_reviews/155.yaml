url: https://www.ptt.cc/bbs/movie/M.1628478416.A.57D.html
title: '[負雷] 厲陰宅3 是惡魔逼我看的'
content: '以下無雷，安心服用


  厲陰宅宇宙已經算是經典恐怖片系列作，而厲陰宅本傳前兩集更是經典中的經典


  這兩集之所以成功，溫子仁的功力絕對是最大功臣，一直以來對溫子仁指導的片，只有肯定甚至是崇拜可以形容


  從《奪魂鋸》《歡迎光臨死亡小鎮》《陰兒房》開始就奠定溫子仁導演=必屬佳片，而他導的恐怖片，更別說部部是經典作


  而厲陰宅3在聽說不再是他導演，大概就猜得到，品質內容將會大打折扣，但打著厲陰宅本傳，還是很想一探究竟


  昨天看完，一整個傻眼，這根本不是恐怖片啊，充其量只能算懸疑驚悚片吧，完全沒讓人會緊張會害怕的點，就連恐怖片老梗的jump scare也懶得做，一整個無趣又乏味


  整部片110分鐘，在恐怖片來看算是很長的片長，厲陰宅前兩集也都差不多這時間，但這部的節奏，實在讓人坐不下去，甚至覺得不耐煩，沒什麼爆點，也沒什麼懸疑處可以猜


  沒想到期待已久的厲陰宅，竟然變成這種類B級片等級的內容，好好的一個IP，就只是換個導演，就淪落至此...實在非常讓人失望


  溫子仁之前的《陰兒房》系列作，也是從第三集後開始換導演，但外國人覺得3和4雖然沒1,2好看，但還是算不難看，至少還有一點水準之上


  厲陰宅3真的搞爛了，希望大忙人的溫子仁在未來的續集，可以重做馮婦繼續指導厲陰宅，才不會讓這個成名已久的這個IP，繼續沉淪下去...


  --'
