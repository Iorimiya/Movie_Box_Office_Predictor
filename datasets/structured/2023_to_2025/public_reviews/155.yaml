url: https://www.ptt.cc/bbs/movie/M.1653295104.A.09D.html
title: '[討論] 厲陰宅宇宙是華納最成功的電影宇宙嗎?'
content: '如題


  華納過去開展過多個共享世界觀的電影宇宙


  怪獸宇宙 DC擴展宇宙


  以及厲陰宅宇宙


  目前已有八部電影


  全部拍攝成本僅$178.5 million


  而全球總票房已來到$2,128,346,375


  厲陰宅2 成本$40 million


  安納貝爾 成本僅$6.5 million


  資料來源(WIKI The Conjuring Universe)


  最終八部總票房超過20億美金


  投入少高回報的良好示範


  厲陰宅宇宙是華納最成功的電影宇宙嗎?


  不過厲陰宅宇宙是跟新線影業一起合作的就是了


  --'
