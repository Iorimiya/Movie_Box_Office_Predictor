  中，還是朱蒂的靈魂價值特別高？


  但說真的，艾琳一家除了有陰陽眼跟靈視以外，其實就是一般人，遇到任何一個普通惡靈

  都應付不了，比如這次的斧頭男，連自保都有問題

  但竟然能一路這樣被嚇到壽終正寢，蠻佩服他們的



