title: '[請益] 要怎麼把厲陰宅宇宙補完?'
content: '如題


  厲陰宅宇宙似乎是好幾部片的系列所組成


  最近看了鬼修女 赫然發現這就是厲陰宅的前傳


  過去我也只看過厲陰宅2 沒看過厲陰宅1


  安娜貝爾也沒看過


  如果要照時序的話


  剛看完前傳鬼修女後


  我現在要怎麼接下去 把後續的補完會比較順呢?


  感謝大家


  --

  很難跟不會思考的人解釋google不代表一切


  《厲陰宅》 2013年上映 故事發生在1971

  《安娜貝爾》厲陰宅的獨立外傳 2014年上映 故事發生在1969年

  《厲陰宅2》2016年上映 故事發生在1976

  《安娜貝爾：造孽》2017年上映  故事發生時間在1945年

  《鬼修女》2018年上映 故事發生在1950年代


  如果依上映時間 就厲陰宅 安娜貝爾 厲陰宅2 安娜貝爾2造孽 鬼修女

  如果依故事年代 就安娜貝爾2造孽 鬼修女 安娜貝爾 厲陰宅1 厲陰宅2'
