url: https://www.ptt.cc/bbs/movie/M.1465381347.A.EF6.html
title: '[討論] 厲陰宅2裡面的Amityville和鬼屋文化'
content: '《厲陰宅2》片頭，其實承接第一集的片尾，哪裡華倫夫婦接到了一個來自紐約長島的案

  子，接著在第二集裡，就從這個案子的故事說起。這個轟動的鬼屋，就是位在美國紐約長

  島（Long Island）阿米提維爾（Amityville）的那幢鬼屋。




  1974年11月13日，一位23歲的青年隆納狄佛伊（Ronald DeFeo）為了20萬美元的保險金，

  在阿米提維爾的家中，槍殺了包括父母和兄弟姊妹總共6位家人，一時之間成為著名的社

  會事件。




  1975年12月18日，這幢位在海洋道112號、建於1928年、全荷蘭殖民地風格設計、擁有車

  庫、船屋和游泳池的典型美國近郊豪宅，終於有一家人搬進來了，他們是28歲的房地產商

  人喬治魯茲（George Lutz）、魯茲的新婚妻子凱西（Cathy Lutz）以及他們分別與前妻

  、前夫所生的3個小孩。


  28天之後，也就是1976年1月14日，這一家人倉皇搬出這幢房子，並且向新聞界宣稱，這

  幢房子是鬼屋，他們一家人受盡了靈異現象的驚嚇與傷害。原本這只是一個平淡無奇的八

  卦新聞，但是，1978年由自由作家傑安森（Jay Anson）所寫的報導書籍《阿米提維爾的

  戰慄》（The Amityville Horror）一書，卻意外造成轟動。




  在這本報導文學中，傑安森詳細的訪問了魯茲一家人，以及曾經來到這幢屋子裡面幫他們

  「驅魔」的狄里尼神父（Father Delaney），延續1973年轟動全球的電影《大法師》（Th

  e Exorcist）的恐怖熱潮，1979年根據這本報導文學所拍成的同名電影《鬼屋》（The Am

  ityville Horror），更成為瘋狂賣座的片型，這個改編自真實故事的封閉空間恐懼電影

  ，直到1996年一共針對這幢鬼屋拍了8集電影，其中1983年的《Amityville 3-D》還是當

  年算新鮮的3D立體恐怖電影！2005年也拍過新版，但成績普通。




  真實事件中，主人魯茲向新聞界鉅細靡遺的道出他如何被屋中的惡靈附身、傷害，以及妻

  子與小孩所親身體驗的靈異現象，但是也有相當多的超自然現象調查學者，對於阿米提維

  爾這幢鬼屋的故事嗤之以鼻，認為魯茲只不過是因為瀕臨破產，隨便向新聞界胡謅鬼故事

  ，想要賺一些錢而已。 無論圍繞在這幢鬼屋的觀點如何發酵，直到今天阿米提維爾的故

  事已經成為美國研究社會學中，都市傳奇（Urban Legend）相當重要的案例。被不斷討論

  、正反意見並陳且結論多元精彩，原始故事融合宗教的驅魔儀式和科學檢證的過程，都在

  攝影機的鏡頭下被詳細紀錄，在美國相信Amityville是真有其事者，跟相信甘迺迪是被中

  情局陰謀刺殺的人口密度，是差不多的。




  1980年由電影大師史丹利庫柏力克（Stanley Kubrick）改編自史蒂芬金同名小說的電影

  《鬼店》（Shining），以及1982震驚影壇的《鬼哭神號》（Poltergeist），都可以看出

  受到阿米提維爾鬼屋故事的深度影響。尤其是《鬼哭神號》，足可影響整個大眾文化對鬼

  屋恐懼的再探討。




  「Poltergeist」這個字意思不是「鬼」，而是種「靈擾現象」，原版片有看起來詭異但

  可愛、一生傳奇早逝的金髮小女孩主角，有配樂大師Jerry Goldsmith改寫搖籃曲的詭異

  樂風配樂，還有在美國影史創造「德州電鋸殺人狂」的恐怖大師導演托比胡柏，還有製作

  人史蒂芬史匹柏幕後強力的特效支持…可惜當年是瘋迷全球的「ET年」，沒有太多人注意

  這部電影在商業與藝術上的成就，特別是配樂的成就被ET埋沒，非常可惜。


  這個故事的原型，改寫自鬼屋「 Amityville」事件，《鬼哭神號》片中巧妙的把「Amity

  ville」事件的元素「雅痞」化——阮囊羞澀的父母親，購買了郊區的豪宅，這對父母還

  是嬉皮的心態，起初視家裡的怪現象為娛樂，而後漸漸發覺不對勁……




  這部電影的劇本，很有深度的拿1982年時代，嬉皮與雅痞交錯的枯燥氛圍，以及新式家電

  科技的初始普及(遙控電視、攝錄放影機…)，以及嬉皮文化對規矩和科技的排斥與無奈…

  等種種矛盾，來包裝以人的科技尚無法解釋甚至接受的「Poltergeist」現象，而電影中

  來自大學的調查團隊，以及侏儒靈媒角色的交互作用，就是改寫自華倫夫婦的組合，毫無

  疑問。而片中與片尾在當年令人乍舌的鬼魂顯現的特效，如今看來完全不輸現代CG技術泡

  製出的靈異形象。


  而今，當年介入調查的華倫夫婦，因為《厲陰宅》一片的大賣座，在第二集中繼續調查英

  國著名的「The Enfield Poltergeist」事件，這個劇本和成果幾乎不可能在賣座上失敗

  ，就是因為再度複製了精確的時代感與封閉在時光中與事實事件裡無法脫身的無助感，可

  以再度引起觀眾的歷史共鳴，而非單純的賣弄嚇人的敘事技巧。


  就如同VHS時代過去之後，貞子就不是個嚇人的元素，日本人愚蠢地把貞子拿到智慧手機

  上重生的電影敗到一蹋糊塗，就是忽略了貞子的恐懼感，是來自VHS影帶上無處不在的磁

  軌雜訊，尤其要展現在4:3螢幕的映像管電視上，而非她的白衣長髮……


  而James Wan能在《厲陰宅》系列中得到罕見的成功，就在於他聰明地複製了1970年代的

  時代懷舊感，從科技的無助感中創造恐懼，那是因為他聰明的窺見了當年《鬼哭神號》之

  所以成功的整個秘密。


  --'
