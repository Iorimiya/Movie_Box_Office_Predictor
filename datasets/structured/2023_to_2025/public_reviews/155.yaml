url: https://www.ptt.cc/bbs/movie/M.1465090411.A.C9B.html
title: '[新聞] 新一代恐怖電影大師！專訪《厲陰宅2》導'
content: "新聞網址：\n\n新一代恐怖電影大師！專訪《厲陰宅2》導演溫子仁\n\n採訪：Chris、影片製作：Sebox\n\n由《玩命關頭7》（Furious\
  \ 7）導演溫子仁執導的《厲陰宅》（Conjuring），2013 年推\n出時獲得了非常好的評價，尤其拍手捉迷藏的梗讓許多觀眾從此對於拍手的聲音蒙上一層\n\
  陰影。續集《厲陰宅2》即將在下週與台灣觀眾見面， HypeSphere 狂熱球繼上次到片場\n探訪後，HypeSphere 狂熱球特別訪問到了溫子仁，跟他聊聊這一次續作的一些細節。\n\
  \n其中最有趣的莫過於選擇了恩菲爾德靈異事件（Enfield Haunting）作為故事主線，溫子\n仁表示這個事件本身就非常精采，而讓華倫夫婦調查這個案件可以說是非常自然的一個發\n\
  展，而這樣的作法也讓整個故事更上一層樓。而這次溫子仁加入了更多華倫夫婦之間的感\n情元素，在恐怖電影的類型裡面，更添加了一絲人的情感溫度，導演更表示人物角色的個\n\
  性與關係才是真正讓觀眾在觀看電影時感到害怕的原因，因為一旦觀眾認識了電影中的人\n物，就會更不希望壞事降臨在他們身上，這也成為堆疊戲劇張力的助力之一。\n\n\
  此片由前集的雙胞胎編劇凱瑞海斯（Carey Hayes）、查德海斯（Chad Hayes）操刀劇本\n，加上《孤兒怨》編劇大衛強森（David Johnson）一同改寫。故事描述在\
  \ 1977 年至\n 1979 年間，英國的一對小姊妹在搬進新家後，發現一些超自然力量的真實事件。\n\n主演卡司包括派翠克威爾森（Patrick Wilson）、薇拉法蜜嘉（Vera\
  \ Farmiga）都將回歸\n飾演靈媒華倫夫婦，夏農庫克（Shannon Kook）也將再次飾演他們的助手。新加入的則有\n法倫希絲歐康納（Frances O’Connor）、亞卓安萊恩斯（Adrien\
  \ Ryans），6 月 8 日台\n灣上映。\n\n--"
