url: https://www.ptt.cc/bbs/movie/M.1465319784.A.E0B.html
title: '[嚇好雷] 厲陰宅2'
content: "剛看完特映會，我覺得比第一集還好看 XD\n\n本來在看之前有先打預防針，續集電影也許會爛掉\n\n全新的故事，跟第一集也沒什麼有關聯性，頂多不用交代男女主角的背景\n\
  \n沒看過第一集也可以看的懂，算是部等級再提升的續集\n\n整部片鋪陳的氣氛看的很令人緊張，嚇人的手法也沒有重複\n\n導演溫子仁就是厲害！會營造一種慢慢讓你恐懼的感受.......\n\
  \n沒有特別血腥畫面也沒有那種驅魔的壓迫感，但就是會讓你倒抽一口氣的恐懼\n\n有別於一般靈異片，往往靈異事件都只有小孩或特定角色才能看見\n\n他這次直接呈現，直接讓媽媽、鄰居、警察看到靈異現象\n\
  \n警察到現場來直接牆壁出怪聲、讓椅子移動，逃跑這段蠻有趣的 XD\n\n椅子突然出現在珍妮床邊以及歪歪人躲在帳棚裡的畫面有嚇到我！\n\n珍妮這角色真的演的蠻不錯的\n\
  \n片尾畫面有秀出劇組、佈景、人物與真實發生的照片比照，相似度極高\n\n算是今年最好看的恐怖片，值得推薦！\n\n--\n最後有說原屋主還住了40年，然後死在同一張椅子上?\
  \ 這真的假的? XD\n\n那張椅子好恐怖 ~..~\n\n  BBC報導\n  真實記錄\n  真實記錄\n\n--"
