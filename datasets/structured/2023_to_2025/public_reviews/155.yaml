url: https://www.ptt.cc/bbs/movie/M.1465896767.A.23F.html
title: '[絕好雷] 厲陰宅2 值得進戲院一看的好片'
content: "大家好\n\n看了大家在版上對第二集的好評\n\n所以衝了端午連假最後一天的午夜場\n\n本以為已是連假的尾聲看午夜場的人應該只有三三兩兩\n\n\
  沒想到車還沒停好就看到板橋秀泰百貨一樓售票處依然人聲鼎沸\n\n到了售票處抬頭一看沒想到午夜場居然還可以場場客滿\n\n可能是單身肥宅唯一的好處吧\n\n客滿時單人座位總是好買\n\
  \n買了半夜十二點整午夜第一場的票\n\n就在三分鐘後就要開場了\n\n真不錯連等都不用等\n\n進了場後真的忍不住要稱讚一下板橋秀泰的單身位\n\n雖然是兩旁靠牆但完全無視野遮蔽感覺完全不輸中間位置喔\n\
  \n位置大又舒服又能無所顧慮的翹腳\n\n雖然有人說板橋秀泰隔音不好\n\n但我反而想大大誇獎它的音場音效真的很棒\n\n在來欣賞第二集前一晚不免先複習一下第一集\n\
  \n只能說溫子仁導演實在名不虛傳\n\n第二集除了完整了第一集的許多伏筆之外\n\n更深刻敘述了華倫夫婦為何堅持只做旁觀者的原由\n\n當然最後為了案件的急迫性還是不得不動手\n\
  \n第二集的華倫夫婦與當事者的情感互動也是本集的看點\n\n因為本宅也是七零年代初生的\n\n所以對於那個年代的黑白電視菱角汽車黑膠唱盤很有親切感\n\n更不用說華倫為一家人彈唱貓王成名曲的那種親切感動\n\
  \n看完電影散場時已經是午夜兩點多\n\n戲院外也下起綿綿細雨\n\n本以為會像每次看完午夜場般淒冷寂寞\n\n但是那天夜晚卻抱著滿滿的滿足回家喔\n\n所以\
  \ 趁著厲陰宅2還沒下檔\n\n最近有想挑一部好片看的你\n\n這是一部不去影院看錯過可惜的好片喔~\n\n--\n\n\n \n\n\n\n\n--"
