url: https://www.ptt.cc/bbs/movie/M.1502540159.A.A19.html
title: '[LIVE] 厲陰宅2 THE CONFUSING HBO手播21:00'
content: "歪頭人不錯\n跟很搞笑但不恐怖的鬼修女@@\n很像那個音樂明星突然忘了@@\n稍遜第一集\n==========\n\n【HBO電影台】\n \
  \ 厲陰宅2 THE CONJURING 2\n\n2100-2310\n--------------------------------------------------------------------------------\n\
  節目介紹\n《厲陰宅》以2000萬的拍攝預算，在全球囊括了超過3億2000萬美元的票房。這次再度集\n結了第一集的幕後製作團隊，[溫子仁]親自執導，[薇拉法蜜嘉]與[派屈克威爾森]飾演艾\n\
  德與羅倫華倫夫婦，[法蘭西絲歐康娜]飾演哈德森家的單親媽媽珮姬，童星[麥迪遜沃爾\n夫]飾演被惡靈糾纏的小女孩珍妮。\n\n「恩菲爾德事件」發生在1977年，單親媽媽珮姬帶著四名子女住進恩菲爾德小鎮的房子，\n\
  但自從住進來之後，怪事便不斷的發生，經常聽見有人敲著房子的牆壁並粗暴地移動家具\n，驚慌失措的一家人開始向外求救，但是就連英國警察也表示愛莫能助，媒體除了拍攝到\n\
  珍妮被不明力量抬離到半空中的畫面外，就連英國廣播公司BBC也錄到一位72歲老人比爾\n的說話聲音，而他蒼老的聲音正是發自年幼的珍妮口中，從此倫敦的「恩菲爾德鬼屋事件\n\
  」知名度不脛而走，就連遠在美國的華倫夫婦也被請託親赴倫敦幫忙調查，但這次惡靈怨\n念的程度遠遠超過華倫夫婦的想像……。\n\n\n以倫敦知名的恩菲爾德鬼屋為背景，是華倫夫婦處理過數千件的案子中，到現在仍然讓她\n\
  難以忘懷的夢靨。「恩菲爾德事件」是目前人類史上最被廣為記載、歷時最長也是最多目\n擊者的一次惡靈騷擾事件，華倫太太回憶起先生在世時態度堅定地對她說：「我們要去恩\n\
  菲爾德幫助她們一家人。」\n\n\n在執導完《玩命關頭7》之後，導演[溫子仁]再度回到他最熟悉的恐怖片領域，重新掌鏡\n拍攝《厲陰宅2》，他說：「我想重新贏回觀眾對大型電影公司拍攝恐怖片的尊重。那些\n\
  經典的恐怖電影如《大法師》，都有很棒的工藝與藝術格調融會其中。」溫子仁同時表示\n：「我拍片時努力逼自己突破。恐怖片中最重要的是讓觀眾在乎這些角色，一旦觀眾在乎\n\
  主角們的安危，恐怖的橋段就會變得更駭人。」《厲陰宅》這個系列電影最重視的就是家\n人之間密不可分的關係，這也是這部電影除了強調真實事件之外，最能夠感動人心的地方\n\
  。\n\n\n--\n推 hope951:有片無槍 片失其用 無片有槍 槍失真我\n→ hope951:有片有槍 登峰造極 無片無槍 天下無敵\n\n--"
