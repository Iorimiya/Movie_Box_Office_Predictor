url: https://www.ptt.cc/bbs/movie/M.1465583583.A.C0E.html
title: '[好雷] 厲陰宅2'
content: '趁著連假,今天去西門町看了厲陰宅2


  看戲院門口的座位分布，開小廳的出神入化還有本片都不錯


  倒是大廳的魔獸要加油，in89大廳我買票時還空好多沒賣滿QQ


  ---------------------------------------------------------


  厲陰宅挾著第一集的高人氣加上溫子仁過去的品質保證，


  成功吸引到我買票進戲院，而觀看體驗上大抵也是滿好的


  這片也是有家人碰到無法解決的騷靈現象(只是在英國)，


  只是這次是鬧上媒體而讓教廷發包讓主角跨國救援，


  相較於第一集那種美國屋，英國屋的狹小讓整部片更有趣，


  因為繞來繞去就那幾個景(客廳、2F帳篷走廊、房間)很容易熟，


  相對那種鬼出現在習慣地方的恐懼就更深了，


  這也是為什麼我認為前半段很成功的原因。


  到華倫夫婦住進去之後就變得還好，因為鬧鬼時都眾目睽睽，


  最後面動作的成分沖淡了魔王的驚嚇度，當然還是很緊湊，


  只是離"恐怖"好像就有點遠了。


  以下是條列式感想：


  1.鄰居真好心，但好衰，客廳櫃子的收藏品都被弄壞了


  2.受害者一家也好衰，整個家本來就很破爛了地下室還淹水，


  結果鬼一來房間被破壞、廚房被砸、客廳被亂翻、後門被斧頭砍爛


  地板被華倫打爆，玻璃被華倫打爆、連屋外的樹都被雷劈了T_T


  3.音樂盒鬼的3D有點假，而且它來幹嘛的阿


  4.華倫的女兒更可愛了


  5.安納貝爾疑似換衣服了?衣服變好乾淨


  6.傑森包恩的女友怎麼會演那個拆台的教授...


  --

  BLOG




  --'
