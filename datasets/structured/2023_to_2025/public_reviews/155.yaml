url: https://www.ptt.cc/bbs/movie/M.1465484771.A.CBE.html
title: '[好雷] 厲陰宅2 明明知道要被嚇但還是被嚇到'
content: '今天跟朋友去看了溫導的續作


  其實我超期待的阿!!


  以前我是很排斥看恐怖片


  不是太血腥就是恐怖過頭


  不過自從看了厲陰宅之後覺得重新定義了恐怖片


  也才知道溫子仁這位導演



  無雷的評語先說


  比起一更好看


  但是渲染力跟觀眾的帶入感一絕對比較好


  第二集也很會營造恐怖氣氛 甚至壓迫感更重


  但是導演故意帶入靈異事件造假與否的議題


  還有在劇情上也玩了些轉折


  這讓觀影時不會一昧的沉浸在鬧鬼的屋子跟那家人身上





  這一集嚇人畫面很多超多


  也都很有創意


  營造的氛圍也很可怕


  有看到附近座位的大哥雙手摀著嘴巴直打哆嗦


  散場時也有看到地板上因為嚇到所以灑滿一地的爆米花XD






  =====================以下有雷=======================







  厲陰宅1去看的時候被很多橋段嚇死


  比如拍手 跟衣櫃上飛撲的女巫


  溫導很擅用創意的手法來展現鬼嚇人


  1有一幕我記得很深刻 小女兒驚恐地看著門後陰影


  然後說something behind there


  音樂跟畫面就一直停在那


  直到門突然的關上畫面暗去加上小女孩尖叫


  沒有半點鬼影但是令人印象深刻



  溫導非常善於營造使觀眾害怕的氛圍


  這點在第二集也大量使用


  甚至連給喘息的空間都沒有


  比如說一開始長島事件華倫夫人通靈時


  那一連串詭異的兇手行兇畫面


  亡靈的引導


  乃至遇知到褻瀆神職的惡魔


  開頭的十幾分鐘便埋下"瓦拉卡"這位惡魔的模樣



  之後再帶入連老公也夢見這位惡魔


  自己在家中也在半夢半醒間與它對話


  遇知老公有可能死亡


  連質問惡魔之名也如此辛苦差點把整本聖經都劃爛


  給觀眾一個這個惡魔很可怕能力很強的形象



  直到電影中段才開始拉回這集的主角家庭


  也就是恩菲爾德事件的佩姬一家人


  一樣開頭輕鬆的簡單的配樂與氣氛


  解釋四個兄弟姊妹上學的平凡模樣


  然後帶入珍妮幫朋友拿菸被老師看到告狀老媽


  珍妮想解釋但老媽不相信


  再帶到大小女兒在床上玩通靈盤


  問的問題卻是「爸爸會回來嗎?」的問題


  一連串的負面情形就好像在暗示我們觀眾


  接下來好像會發生甚麼事一樣



  果不其然畫面就帶到小女兒睡覺


  喔我真的很討厭厲陰宅中睡覺的場面


  每次一睡就知道有事情要發生


  從床上睡覺的畫面就開始營造恐怖的氣氛


  到後面鬼要出來


  明明知道會嚇人但還是被嚇到


  被嚇得很爽


  這次嚇人的手法與畫面與前作都沒有重複




  比如說老頭子的亡靈


  主要是騷擾/附身珍妮


  手法是讓珍妮在睡夢中移形換位


  並且明目張膽胡亂移動家具


  或者是附身珍妮然後練肖維




  歪頭男主要騷擾會口吃的小兒子比利


  有一幕比利半夜口渴喝完水走回二樓


  踢到消防玩具車不明白怎會放在路中間


  於是把玩具車推回去帳篷


  回到床上想倒頭就睡但又覺得很怪


  所以頻頻回頭確認帳篷有沒有異樣


  那再三回頭看帳篷黑黑的洞口的畫面真的是很棒


  讓我想到小時候睡覺也是會一直看黑黑的窗戶


  只是想再三確認沒有異樣才會躺平睡著


  同時卻又利用配樂跟運鏡手法來加強氛圍


  直到玩具車突然出現在房門口


  明明鬼影半個都還沒出現卻還是讓觀眾倒抽一口氣



  另外一個場面是


  修女惡魔抓著畫框衝向華倫夫人的畫面


  明明知道那雙手抓著框下一步就是要嚇人了


  但是還是被嚇到了XD




  還有一個我覺得最嚇得時刻:


  珍妮生病在家看電視


  從電視螢幕看見老人回頭看沒有再回頭出現在電視上方


  FXXK!真的嚇到從椅子上彈起來





  最後我想問的一個問題


  就是當華倫夫人在預知或通靈時


  那應該是自己能力發動的空間


  但是為甚麼惡魔還是能傷害到她?!(比如說抓著畫框把她撞飛)


  又 當她做預知夢時惡靈知道嗎?


  --'
