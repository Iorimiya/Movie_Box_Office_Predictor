url: https://www.ptt.cc/bbs/movie/M.1628779727.A.B06.html
title: '[好雷]厲陰宅3：是惡魔逼我的,2021'
content: '雷文防雷資訊頁


  厲陰宅3：是惡魔逼我的 The Conjuring: The Devil Made Me Do It(2021美國電影)




  厲陰宅 宇宙的第七部電影，改編自華倫夫婦  真實靈異檔案，華倫夫婦著手處理的1980

  年代案件重現。令人寒毛直豎的故事，讓即便身為資深超自然現象調查者的艾德和羅琳華

  倫也感到害怕。


  劇情簡介:


  編劇大衛萊斯力強森著手續集劇本，關注華倫夫婦1980年代處理的驅魔事件。


  真正的恐怖重現！


  本片揭露了一則集恐怖、謀殺與未知惡魔，令人寒毛直豎的故事，讓即便身為資深超自然

  現象調查者的艾德和羅琳華倫也感到害怕。


  在這個他們偵辦過最聳人聽聞的案件中，一開始他們要拯救一名年輕男孩的靈魂，接著他

  們經歷了前所未見的遭遇，並遇見了全美第一位以惡魔附身做為殺人抗辯理由的謀殺嫌犯

  。


  不同於過往《厲陰宅》電影，《厲陰宅3：是惡魔逼我的》以華倫夫婦調查案件為主軸，

  並把羅琳的天賦以前所未見的方式融入劇情，她的靈眼與故事情節緊緊相連。溫子仁強調

  ：「《厲陰宅3：是惡魔逼我的》仍是一部與惡靈力量有關的恐怖片，這次觀眾能與華倫

  夫婦一起踏上旅程，揭開故事的神秘面紗，一定會更有意思！」




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  好幾個月沒到電影院看電影了。原本以為看快下檔的影片，又是冷門時段，可能會一人包

  場，結果沒有，有幾個和我同場次一起看。好久没在大銀幕前觀看影片了，所以看得挺認

  真的。華倫夫婦系列的恐怖片，一直欣賞喜歡著，厲陰宅1,2覺得很好看，3看片名那麼長

  又俗，感覺有點不妙，imdb評分尚可而已，因此預期心理不高，結果3看完，是頗滿意的

  。


  3開頭就是劇烈的驅魔情節畫面，然後旁白進入3的主題，華倫夫婦驅魔過程的最黑暗篇章

  ？由於是真人實事改編，結局後的畫面有本尊和演員的對照畫面及真人實事影像、錄音的

  橋段，我挺中意這種安排，很帶感。


  本片主線看華倫夫婦全力以赴，探求真相、解救因故殺害人的附魔男子避免被判重刑，他

  們二人相知相守，互為好隊友，各自可獨立作業又互相合作無間的過程，緊張又精彩，因

  為我看入戲了，為片中多位角色的遭遇感到揪心！可能男女主角人設太討喜，人格特質太

  令我欣賞了，所以這片看了容易入戲，就是為他們的勇氣和努力而讚賞。同時享受恐怖片

  帶來的娛樂感。


  這片提及華倫夫婦年輕時相遇結緣的故事，和收尾畫面呼應，很浪漫！  ☺  喜歡這片的

  收尾。  ☺


  厲陰宅3：是惡魔逼我的

  The Conjuring: The Devil Made Me Do It


  --'
