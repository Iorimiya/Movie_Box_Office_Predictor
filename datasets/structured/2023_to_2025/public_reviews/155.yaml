url: https://www.ptt.cc/bbs/movie/M.1555835348.A.39D.html
title: '[新聞] 厲陰宅、安娜貝爾　華倫太太逝世享壽92歲'
content: "新聞網址：\n\n\n美國著名靈異現象調查家羅琳華倫（Lorraine Warren）18日晚間逝世，享壽92歲。她和\n丈夫艾德（Ed）致力於調查超自然現象，並將調查所得寫成著作。他們不可思議的親身經\n\
  歷也被翻拍成《厲陰宅》、《安娜貝爾》等廣為人知的好萊塢系列電影。\n\n華倫夫婦的女婿史博拉（Tony Spera）在Facebook表示，華倫18日晚間在睡夢中安詳離世\n\
  ，「她是個出色、有愛，富有同情心和奉獻精神的人。引用羅傑斯（Will Rogers）的話\n，她喜歡每個她所遇見的人。」\n\n由華倫夫婦1952年於康乃狄克州（Connecticut）成立的新英格蘭靈異研究協會（The\n\
  New England Society for Psychic Research）也在Facebook官方專頁寫道：「新英格蘭\n靈異研究協會團隊遺憾地宣布，我們敬愛的師長、導師、朋友和母親羅琳的逝世。」\n\
  \n根據美國《有線電視新聞網》（CNN）報導，《惡魔學者》（The Demonologist）書中詳\n述華倫夫婦的職業，他們調查超過3000個靈異並且超自然的干擾現象，並將他們的無數經\n\
  歷寫成多本著作。\n\n此後，數名編劇和導演翻拍華倫夫婦與眾不同的生活，將靈異事件搖身變為好萊塢強檔電\n影，包括《陰宅》（The Amityville Horror）、《厲陰宅》（The\
  \ Conjuring），以及《\n安娜貝爾》（Annabelle）。\n\nR.I.P.\n\n--\n\n[←]離開[↑↓]選擇[→]閱讀卡片 [X]轉錄看板[F]轉寄站外\
  \  [O]站外卡:開 [h]求助\n\n●   1   10/10 南部成大氣質美女 ◇ 我的電腦謝囉...你人真好^^\n     2   12/22 政大企研正妹\
  \     ◇ 耶誕跨年我都有事,不好意思喔.\n     3 +  1/28 補習班短髮學妹   ◇ 嗯嗯下次聊先洗澡掰\n\n--\n          \
  \                         04/21 16:29"
