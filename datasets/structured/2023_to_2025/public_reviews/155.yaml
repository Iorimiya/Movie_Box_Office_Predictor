title: '[新聞] 「鬼修女」本尊現身 長相不會紅靠厲陰宅'
content: '新聞網址：


  「鬼修女」本尊現身！　「長相不會紅」靠厲陰宅翻身


  2018年09月5日 11:11


  記者許瑞麟／綜合報導


  《鬼修女》（The Nun）備受喜愛恐怖片的觀眾期待，本片4日於洛杉磯舉辦首映會，回歸

  飾演「瓦拉克」鬼修女的邦妮艾倫（Bonnie Aarons）一登場，霸氣不輸片中角色，吸引

  全場目光。


  邦妮艾倫（Bonnie Aarons）除了厲陰宅系列電影外，還演過《穆荷蘭大道》、《派特的

  幸福劇本》、《燃燒鬥魂》、《麻雀變公主》等片，過去在紐約學習表演，但是因為外貌

  不討喜頻受挫，甚至有人說因為她的鼻子和長相，很難在演藝工作上有所成就，但她將此

  化為力量，轉往歐洲發展，拍廣告、電影。


  現在邦妮艾倫終於以鬼修女翻紅，她坦承很喜歡這個角色，但拍攝前化妝相當費時費力，

  也常在IG分享工作照，曝光許多和鬼修女有關的照片，網友更是相當佩服她的成功演繹，

  讓人又愛又害怕。


  《鬼修女》劇情描述由達米安畢契爾（Demian Bichir）所飾演的神父和泰莎法蜜嘉所飾

  演的修女，奉命調查年輕修女自殺案件，結果發現了邪惡勢力的秘密，不但生命安全遭到

  威脅，信仰也備受考驗。本片將於9月6日在台灣上映。



  ～～～～～～～～～～～～


  根本就是本尊啊...


  --'
