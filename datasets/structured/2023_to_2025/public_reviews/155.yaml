  不過沒看過第一集所以就去補了


  看完之後有些疑惑啊


  印象中那間房子不是有5隻惡靈嗎？


  1. 上吊的女巫 ( 衣櫃上跳下來那隻 ?，


  2. 跟最小的女兒玩還帶四女兒夢遊的小男孩，


  3. 殺死他的媽媽 ( 黃衣服，


  4. 割腕自殺的女僕，


  5. 吐血在佩倫太太嘴裡的短金髮的女鬼，


  那最後附身在佩倫太太身上的怎麼會是女巫呢？


  還有拍手玩捉迷藏的又是哪隻？


  解決了女巫那其他隻呢？怎麼就沒事了？


  啊還有抱著安娜貝爾幫它梳頭髮的又是哪隻？


  然後我還沒看過安納貝爾跟厲陰宅2，


  所以別雷到我啊～感謝各位了！！


