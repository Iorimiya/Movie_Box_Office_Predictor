title: '[好雷]  厲陰宅2：倫敦救援'
content: '溫導的鬼片算是替近年來的恐怖片立下標竿


  陰兒房、厲陰宅兩大系列


  讓溫導能夠恣意地發揮才華



  陰兒房走詭異驚悚黑色幽默、


  厲陰宅玩的是經典元素的重新定義（？）



  兩大系列也讓觀眾開心地買單，


  片商也趁勢打著溫導名號推出陰兒房3、安娜貝爾、安娜華特...


  但老實說，非溫導親生的作品，等級明顯有差。



  望眼欲穿的厲陰宅2終於在今天上映，


  前一晚還特別關燈在床上複習厲陰宅1（傷眼，不良示範）



  劇情的安排走向跟第一集相似：


  開頭先端出其他知名靈異案件當小支線故事：1-安娜貝爾/2-長島事件


  與此同時另一個地方，苦主正遭受無法解釋的靈異現象所騷擾（劇情主線故事）


  情況越演越烈後，主角華倫夫婦出面調查


  阿鬼現身、正面對決、end




  --------------------以下劇情雷-----------------------


  開頭呼應到第一集最後華倫夫婦跟神父討論長島事件，

  這也是超知名靈異案件，被無數次改編成電影（板上有專業介紹文）。


  在這段長島事件中，溫導首度呈現華倫太太施展通靈的橋段，

  華倫太太靈魂出竅在凶宅裡遊走，重現兇手行兇的過程，

  亡靈們不自然且非連續的動作令人感到很毛，

  然後華倫太太被亡靈們指引到地下室，

  發現原來兇手是受某惡靈操控而殺害全家，

  而這惡靈竟然也想謀害華倫先生，

  華倫太太因此被嚇到解除通靈狀態。

  （這段完全就是陰兒房那套嘛，華倫先生跟陰兒房裡的爸爸又是同一演員ＸＤ）


  回到家後，華倫太太見到先生把夢中的惡靈畫出來時，

  跟先生透露之前因驅魔被嚇到而把自己鎖在房間八天，

  就是因為得知那惡靈想傷害先生。（補充了第一集刻意沒解釋的部份）


  惡靈後來又出現在華倫家，最先被華倫女兒給察覺

  （華倫女兒從蘿莉變小正妹了>///<），

  在惡靈拿著自畫像衝向華倫太太之前（這段是搞笑吧）

  氣氛營造實在很棒，

  尤其是惡靈站在狹窄的走廊尾端怒視華倫母女（抖）。


  另一方面，英國恩非爾德地區，

  一位叫佩姬的單親媽媽帶著二子二女住進一棟普通舊公寓後，

  二女兒珍妮遭前屋主靈魂侵擾並附身，小兒子被歪頭男騷擾，靈異事件層出不窮。

  不勝其擾的佩姬一家最後妥協讓媒體來採訪並透過教會的關係，

  讓華倫夫婦前來調查，沒想到事情變得更加嚴重。

  有一段華倫先生要珍妮含著水錄音，刻意不對焦珍妮的臉反而讓人有想像空間。


  最後珍妮大發功（?），卻反而被懷疑論者拍攝到珍妮自導自演的證據，

  加上華倫太太從頭到尾都感應不到珍妮的背後靈，靈異事件站不住腳，

  華倫夫婦愛莫能助只能離去...


  ＢＵＴ


  一切都是片頭的惡靈的陰謀，惡靈遮蔽了華倫太太的靈感，

  並操控前屋主靈魂與歪頭男，還故意讓珍妮被拍到自導自演。

  華倫夫婦發現真相後回去救珍妮，

  但惡靈設好陷阱要誘殺珍妮與華倫先生，

  最後華倫太太想起惡靈的名字，呼喚惡靈名字後就把惡靈收掉了（驅魔片公式）。


  ＥＮＤ


  ------------------劇情防雷線-----------------













  心得：


  <優點>


  與前作各種前後呼應，甚至第一集刻意沒講的地方，這集很巧妙地串起來。

  （華倫太太鎖在房間八天的原因）


  加入陰兒房的通靈梗（詭異的陰間、詭異的亡靈）


  華倫夫婦之間感情戲更加豐富（就是放閃啦）


  舊透天厝所營造出升級版的室內恐怖氣氛...

  (比起美國鄉間大宅第，更貼近台灣觀眾的生活)


  小兒子半夜踢玩具消防車那段很帶勁…，

  而珍妮每次睡覺都會讓觀眾想要靠緊椅背…呼！

  (靠北的是珍妮都跟他姐一起睡，兩人在房間都可以這麼恐怖了，

  那一個人睡的該怎麼辦ＸＤＤ)


  被懷疑論者抓包的劇情轉折很亮眼


  幾乎無冷場，從頭嚇到尾


  看到安娜貝爾整個感到溫馨（喂），她已經變吉祥物了吧我猜ＸＤＤ


  珍妮演員演技大加分，可以在小女孩和老人比爾之間自由切換



  <缺點>


  喊出惡靈名字就收掉惡靈很老梗，前面把惡靈塑造得超強，結果被輕鬆解決…


  雖然嚇點比第一集多很多很多，但少了媲美經典拍手梗的橋段，

  常看恐怖片的人應該可以對全部嚇點做好準備

  （我看的那場都是高手，完全沒人尖叫ＸＤ）


  歪頭男很讓人出戲，這傢伙太奇幻了，

  加上他完全沒傷害到任何人，感覺他根本是走錯棚…


  最後



















  華倫女兒的戲份太少了！！！（敲碗）


  --

  Sent from my 3310


  --

  那段稱不上「恐怖」，但嚇點太有創意ＸＤ 這集我反而是畫像那邊笑了ＸＤ

  Sterling Jerins 沒想到她是末日Ｚ戰裡布萊德彼特的女兒

  本來想打 修女也瘋狂 但有暴雷嫌疑就放棄了

  上一集不太算喊出名字就結束，主要是激勵被附身的媽媽用正能量擊退女巫靈魂

  這集比典型驅魔片還快收尾，連喊都不算，像點名吧＝＝

  修女真的有恐怖到，我也希望戲份多一點

  拿自畫像衝向女主不知為何我就是笑了ＸＤ但那之前真的很恐怖

  「瓦拉卡」（Volka）的樣子，不知道是聖經裡的惡魔 還是電影虛構的

  自古以來人們相信呼喚真名有某種魔力，詳情請估狗～

  我覺得整部片都很歡樂（是指被嚇得好開心ＸＤ）

  Bonnie Aarons 這是演修女惡靈的演員名字 這樣有回答到你嗎（喂）

  想當年的拍手梗全場尖叫 還有人叫聲持續快10秒 大家還以為是音效ＸＤ

  對對 蛇之公爵！ 電影參考華劣克（Valac）創造瓦拉卡這惡靈 good job!

  歪頭男本身不恐怖（真心覺得錯棚）但出場時機很到位ＸＤ

  原來是高手高手高高手 失禁失禁

  真的很瞎，哪天若有惡靈說：才不告訴你咧～  那部片我十刷ＸＤ

  版上有專業文介紹Amityville事件，已經變基本改編素材來源

  據說史實是華倫夫婦只跟珍妮（比爾）談了15分鐘就離去

  完全不會呦 就當作看柯南 同樣角色但是在處理其他案件

  這要擲筊才會知道 史實就是珍妮被附身 比利被騷擾

  讚讚

  艾德 艾迪 愛德華 你爸叫你艾迪 超好笑ＸＤ'
