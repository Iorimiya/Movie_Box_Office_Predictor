url: https://www.ptt.cc/bbs/movie/M.1538648869.A.116.html
title: '[新聞] 《厲陰宅3》曝新進度 溫子仁決定「導演換'
content: '《厲陰宅3》曝新進度 溫子仁決定「導演換人當」


  記者許瑞麟／綜合報導


  溫子仁（James Wan）執導的《厲陰宅》第1、2集，在全球獲得很好的評價和票房，第3集

  也讓粉絲相當期待，沒想到現在宣布不再執導，而是交棒給新生代導演Michael Chaves，

  讓影迷有些擔心。


  其實溫子仁一直以來都很提拔新生代導演，包括《安娜貝爾》、《鬼修女》等作品都交由

  名氣還不高的導演，自己則擔任監製，但是最後上映評價都不比《厲陰宅》來得好，

  Michael Chaves以恐怖短片《The Maiden》被發掘，最近的作品為恐怖片《The Curse

  of La Llorona》，同樣由溫子仁監製。


  溫子仁在聲明中指出，「Chaves擁有把情感帶入故事的能力，對情緒和恐懼的理解，讓他

  很適合執導下一部《厲陰宅》電影」，自己也很高興回到監製工作，繼續和Vera以及

  Patrick進行下一段冒險。外界則推測他可能是因為太過忙碌，畢竟接下來《水行俠》將

  要上映，他也擔下很多監製工作。


  《厲陰宅3》由David Leslie Johnson擔任編劇，故事依然會以華倫夫婦的遭遇為主軸，

  尚未公開上映日期。




  --'
