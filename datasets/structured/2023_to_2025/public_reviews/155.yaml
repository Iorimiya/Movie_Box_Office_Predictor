url: https://www.ptt.cc/bbs/movie/M.1465445836.A.150.html
title: '[請益] 厲陰宅2(有雷)'
content: '有雷!

























  ======================================================

  1. 為啥華倫夫婦會在自己家感應到瓦拉克的這惡靈?


  這是在剛開頭感應到的惡靈是同一個嗎?



  2. 倫敦救援的這家庭 原本只是一個不想升天的孤獨老人在鬧


  是不是華華夫婦到了那邊後


  瓦拉克在進而控制這孤獨老人的魂來達到自己目的?


  還是說


  瓦拉克已經在那邊鬧


  華倫夫婦也因為片頭的故事感應到這惡靈 ...兩者剛好湊巧碰上


  不過瓦拉克為啥要挑這麼遠的地方?


  =====================================================

  個人覺得前半段的描述雖然冗長


  最後面的搏鬥雖然也蠻高潮的


  但是我比較喜歡前者一種看不到的超自然力量所帶來的壓迫感..


  不過整片故事情節很流暢 看完很爽快


  但是我還是百思不得其解的是


  為啥國外小孩 凌晨有人在外面敲敲打打 都會覺得是你認識的人然後過去查看?


  而且發生這麼多事了..不能好好睡覺嗎XD






  --'
