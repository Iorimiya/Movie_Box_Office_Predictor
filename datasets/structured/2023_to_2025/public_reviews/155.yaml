url: https://www.ptt.cc/bbs/movie/M.1465317447.A.27C.html
title: '[普好雷]《厲陰宅2》，第一集有拍手，第二集有？'
content: '部落格板：



  溫子仁的《厲陰宅》可以說是把觀眾的胃口養大了，即便他之後擔任監製的姊妹作《安娜

  貝爾》表現差強人意，但仍然不減觀眾對他的期待，看完《厲陰宅2》後再次對於溫子仁

  執導功力感到佩服，由於第一集與第二集的故事完全無關（僅有些微有關聯），因此這集

  可以說是要「重新開始」，第一集有新鮮感以及明明不是主角卻如影隨形的安娜貝爾娃娃

  當作輔助，讓第一集在某種程度上，確實滿足了觀眾對於恐怖片的期待，那麼，在第二集

  溫子仁又會給觀眾帶來什麼不一樣的東西？還是跟很多續作一樣僅是老調重彈？


  值得慶幸的是，《厲陰宅2》有著跟《厲陰宅》截然不同的風格，在這集除了擅長的恐懼

  心理操作，還添加了更多第一集所沒有的東西，包含華倫夫婦的感情連結、信仰的拉扯、

  探討靈異現象是否真實存在，抑或只是無稽之談...等等，讓這集內容更豐富，而且顯得

  更有「人味」，但憑心而論，若以恐怖程度來比，我認為還是《厲陰宅》更勝一籌，並非

  《厲陰宅2》不好，溫子仁把很多在第一集的「無形恐懼」挪用到第二集，變成了「有形

  恐懼」，讓很多東西具現化，更增添觀眾在視覺上的真實感，可惜的是，《厲陰宅2》少

  了「必殺技」，也許你會忘記《厲陰宅》曾經演過什麼，但提到印象最深刻的，我認為多

  數人都會提及那場母親在地下室的拍手場景，那個在耳邊響起的拍手聲揮之不去，再來可

  能也會講到只要盯著不停轉圈就會撞鬼的音樂盒（也就是後來送到博物館的那台），《厲

  陰宅2》就少了這個會讓人難以忘懷的記憶點，那招直擊觀眾心底的必殺技。至少我不認

  為比爾威金斯老爺爺跟那個很像修女的女鬼會讓人記住一輩子。



  《厲陰宅2》將故事舞台搬到英國，而開頭那一小段華倫夫婦的靈異現象調查，也和在英

  國恩菲爾德古宅有所關聯，從開頭其實就很直接告訴觀眾，羅琳預知到了某種惡靈存在（

  也就是那個修女惡靈），事後再次感應才發現被穿肚而死的，是她的丈夫艾德，透過一場

  電視節目轉播橋段，簡單明瞭指出還是有人認為華倫夫婦是騙子，很多靈異現象根本不存

  在，甚至都是人們的心理作用，這也讓華倫夫婦決定不再接受民眾委託，但佩姬一家的出

  現讓他們決定出面協助。


  我自己認為《厲陰宅2》可以分為三個看點，華倫夫婦的情感戲碼；實際篇幅不大但卻橫

  跨

  整部電影的「探討信仰、靈異現象」立場對立；以及恩菲爾德古宅靈異現象。


  先來說說恩菲爾德古宅靈異現象，起源可以追溯到女兒珍妮和瑪格麗特在玩通靈板，電影

  雖然沒有明說，但我認為這就是一連串現象的開端，從起初微小的「夢遊」，弟弟比利的

  玩具消防車自動跑，再到馬格麗特撞見珍妮開始和不明物體「對話」，之後就發生床的上

  下震動，嚇得她們趕緊去找母親佩姬，起初佩姬當然不相信，但她話還沒說完房間的櫃子

  就自動移位，讓她也開始相信真的有什麼東西在她們家。講到這裡就不得不說，《厲陰宅

  2》比《厲陰宅》多出的另一個元素，就是幽默感，全片中前段幾乎在很多地方都有笑點

  ，例如兩位警察來到佩姬家調查，看到椅子自動退回到廚房，就快速離開，還一臉正經地

  說：「這件事已經超出我們的協助範圍了」，事實上，全片出現的旁白，有很多都是「正

  經的令人發笑」，而這是《厲陰宅》所沒有的，或許是故意讓觀眾能夠放鬆，不要因為是

  恐怖片就那樣緊繃，企圖令觀眾體驗到什麼叫冰火五重天，明明想看卻又怕被嚇到，可是

  不看又不知道發生什麼事（錯過笑點）。


  中間當然就是發生一連串的靈異現象，也都環繞著通靈元凶，也就是珍妮身上，不過正當

  觀眾都以為比爾威金斯老爺爺就是引發一切現象的源頭時，這才發現，原來那個修女惡靈

  才是真兇，畢竟有看過《厲陰宅》的觀眾都知道，安娜貝爾娃娃明明不是主角，卻總是伴

  隨著靈異現象出現，難免會讓人有種錯覺，以為《厲陰宅2》就像如此，頻頻出現的修女

  惡靈只是「配角」，擔任輔佐角色，讓氣氛更添恐怖而已，殊不知她其實就是「主角」本

  人（還是只有我被騙？），這個安排看似很精心設計但卻又覺得有些老套。可這樣的安排

  讓電影來到另一波高潮，倒也不失為一種觀影樂趣。



  而先前較少著墨的華倫夫婦的情感連結，來到這集有了強力羈絆，兩人不約而同的向因被

  惡靈附身而顯得「與眾不同」的珍妮打氣，並說出要如何接受這樣的自己，總有一天一定

  會遇到懂你的人，羅琳與生俱來擁有強大預知、感應能力，愛德則是有著驅魔避邪的能力

  ，兩者拆開，在旁人眼中都是怪胎，但合在一起，那股力量強大無比，他們碰到彼此是幸

  運的，他們也明白自己擁有這樣的能力是要用來幫助很多需要幫助的人，但當羅琳預知到

  艾德可能會喪命時，拚了命去阻止，一方面她是不想失去摯愛，另一方面也許是不想失去

  這個懂她的人，倘若她回到孤單一人，恐怕會再承受不住外界異樣的眼光。



  至於第三個部分，就是談論到在很多相似電影都會探討的，關於未知事物的存在與否，就

  你我都知道，華倫夫婦是有名的靈異現象調查家，既然有人相信，就會有人不信，不論是

  那個在電視節目上反駁她們的教授，還是那位以心理學角度切入的心理師，《厲陰宅2》

  沒有過分強調宗教信仰（回頭觀望《安娜華特》），反而讓信仰成為一種反思的存在，華

  倫夫婦信仰的堅持與鬆動，以及那個以本該是祀奉上帝的修女形象現身的惡靈，無非是對

  於宗教信仰的接受與反諷。電影也用多元立場去看待這些事，有一句成語是「眼見為憑」

  ，很多事情真的口說無憑，開空頭支票誰都會，事情到底有沒有發生？究竟是不是真妮在

  惡作劇？一切都要親眼看見才能說準，單靠信仰其實多少有些薄弱，這也就是為什麼當錄

  影機錄到所謂的靈異現象只是珍妮的「人為」時，就連以靈異調查專家活躍的華倫夫婦都

  難掩失落的離開。


  《厲陰宅2》劇情結構完整，該給觀眾的一個都沒少，氣氛營造與拿捏恰到好處，向上面

  說的，本片時而輕鬆時而緊繃，偶爾的笑點增添不少亮點（至少不像很多片是爛到笑），

  雖然該是重頭戲的與惡靈對決戲碼有點微弱，不過其餘部分可以說是面面俱到。而如我前

  面所說，《厲陰宅2》真的可惜在少了「必殺技」，總不能以後大家提起厲陰宅，都只想

  得到拍手吧？沒能有個特別突出的點給觀眾記憶，確實可惜，兩集相比，我是比較喜歡《

  厲陰宅》一點，但總結也是一部水準之上的恐怖電影。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --

  抱歉，我以為大家都看過預告（有出現的名字）

  這點我後面有提到喔'
