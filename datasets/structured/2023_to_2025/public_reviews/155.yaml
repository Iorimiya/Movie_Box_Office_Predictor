url: https://www.ptt.cc/bbs/movie/M.1472624312.A.FB4.html
title: '[好雷] 厲陰宅2 節奏順暢 氣氛緊張'
content: '會特別po這篇其實除了因為真的不錯之外

  電影中的某些橋段讓我想到一些有趣的聯想

  整部片節奏順暢

  音效令人緊張滿點

  常常感覺準備要嚇人時 又沒事

  但有時感覺要嚇人時 結果就真的大驚嚇！

  總之讓你猜不到導演想怎麼嚇你

  劇中的小女孩真的很可愛

  完全讓人能理解蘿莉控的心情

  讓人覺得有趣的點在下面...































  綠油精綠油精 媽媽愛用綠油精 哥哥姊姊妹妹都愛綠油精

  氣味清香綠油精～ 這段完全代入阿！根本變得一點都不恐怖了



  另外把兩段錄音同時播放的橋段 讓人想到神雕俠侶

  這不就是 情谷底 我在絕 嗎？

  真的很有意思！


  總之 非常值得一看！算是小恐怖的好片!


  --'
