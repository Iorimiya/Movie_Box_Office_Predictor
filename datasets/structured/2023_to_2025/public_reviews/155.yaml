url: https://www.ptt.cc/bbs/movie/M.1463138571.A.9EA.html
title: '[贈票] 搶先觀看【厲陰宅2】，挑戰恐怖新驚點！'
content: "今日黑色星期五！【厲陰宅2】電影版鄉民專屬首映會贈票活動開跑囉！\n\n★ 【厲陰宅】原班人馬製作，正宗恐怖驚悚大師 溫子仁執導，再創恐怖新驚點！\n\
  ★ 華倫夫婦靈異檔案又一真實故事，英國最駭人聽聞的靈異事件！\n\n即刻起至 6/1 中午12:00，推文「溫子仁 導演【厲陰宅2】6/8再創恐怖新驚點」，\n\
  並至，點選「想看」並送出，將完成投票的截圖後連同姓名、\nPTT帳號、電話寄至wbtaiwan@gmail.com，就有機會前往【厲陰宅2】電影首映會。\n\n\
  獎項內容：6/7 19:00 西門喜滿客絕色影城 共20位  (一人中獎兩人同行)\n得獎名單將於6/1 18:00前以電子信件通知領獎事宜。\n\n電影簡介：\n\
  \    繼打破票房紀錄的【厲陰宅】之後，溫子仁（【玩命關頭7】）再度親自執導超自\n然驚悚片【厲陰宅2】，從著名魔鬼學家艾德與蘿倫華倫夫婦的檔案中，將另一宗捉鬼\n\
  案件搬上螢幕。\n    奧斯卡獎提名女演員薇拉法蜜嘉（【型男飛行日誌】、影集【貝茨旅館】）及派屈克\n威爾森（【陰兒房】電影糸列）再度飾演艾德與蘿倫華倫夫婦，他們來到倫敦北部，展開\n\
  一場在他們生涯中數一數二可怕的超自然調查，幫助一名獨自撫養四個孩子的單親媽媽，\n他們全家住在一間邪魔不斷出沒的鬼屋。\n    這部電影是【厲陰宅】的續集。第一集在全世界掀起轟動，創下原創恐怖片的最高首\n\
  週票房紀錄，最後全球票房超過3億1900萬美元，迄今仍是僅次於【大法師】，影史上第\n二賣座的原創恐怖片。\n    其他卡司包括法蘭西絲歐康娜（影集【疑蹤】）飾演單親媽媽；麥迪遜沃夫（影集\n\
  【困獸之地】），還有新人蘿倫艾斯波西托、派屈克麥歐利及班傑明海格飾演她的四個孩\n子；瑪利亞多耶肯尼迪（影集【黑色孤兒】）；賽門德蘭尼（影集【Roy】）；法蘭卡波\n\
  坦（影集【邊橋謎案】）；以及賽門麥克柏尼（【不可能的任務：失控國度】）。\n    【厲陰宅2】由華納兄弟影業發行，預計2016年6月10日起在全球上映，台灣將搶先於\n\
  6/8(週三)端午節連續假期上映。\n\n電影預告片：\n更多電影資訊請洽『華納兄弟台灣粉絲俱樂部』：\n\n注意事項：\n1.特映券為非賣品，嚴禁兜售等圖利行為\n\
  2.票券未劃位，請於開演前一小時自行劃位\n3.請準時入場觀賞，電影開演後10分鐘戲院與主辦單位有權謝絕入場\n4.本特映會如遇天災等不可抗力的因素而取消，恕不補辦\n\
  5.主辦單位保留修改本辦法之權利，但會事先公佈\n\n--"
