title: '[討論] 厲陰宅2'
content: '大家晚安，今晚小弟一人看完了厲陰宅2，本身就很喜歡溫子仁導的恐怖片，今天又再次

  見識到溫導的嚇人的藝術呀！

  整部電影我覺得最有創意的嚇點就是:

  1. 蘿琳在家的書房遇見瓦拉克的時候，那個影子走著走著就match到畫像上。

  2. 華倫夫婦在火車上用收音機拼湊出老人鬼魂Bill的求救訊息。


  嘻嘻，不曉得大家覺得嚇點是哪些呢？anyway, 小弟其實想討論，看了溫子仁許多鬼片，

  全都取材自國外的鬼故事或者都在描述國外的鬼，有沒有可能，溫導會來拍一部，描述東

  方鬼的電影呢？


  --

  嘻嘻，我講的嚇點1我是不敢睜眼滴

  看來是我太弱了QQ'
