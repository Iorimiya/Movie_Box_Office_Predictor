url: https://www.ptt.cc/bbs/movie/M.1413282795.A.100.html
title: '[好雷]安娜貝爾 '
content: "看的前一天爬了文  發現大家對安娜貝爾某些細節都頗有微詞XD\n\n所以在看電影的時候我特地注意了一下\n\n1.大家說那娃娃這麼醜為什麼片尾還會有人想買他？\n\
  \n  其實最一開始他乾乾淨淨的時候也不算醜，國外好像有很多這種類型的娃娃\n\n  後來娃娃明顯就是被召換來的邪靈佔領了，所以片尾引誘人買他我覺得還算合理\n\
  \n\n2.有人說對安娜貝爾娃娃本身沒有太多著墨\n\n  我覺得終究是因為故事走向，\n\n  安娜貝爾本來是隻普通的娃娃，但是他是被召換來的邪靈給占領，才會發生一連串的\n\
  \n  事件，如果故事是一隻娃娃從備受寵愛到被人遺棄而產生怨靈XDD那可能會讓我更害怕\n\n  娃娃一點。但這故事就是邪教儀式I want your soul，所以比較平淡點。\n\
  \n\n3.電梯開開關關結果沒事\n\n  大家都說電梯開三次全場都在笑，害我在這段的時候是以很平淡的心情在看的，\n\n  結果電梯一直開我還是覺得會有東西出來T口T\
  \ 其實一直沒出現東西我覺得心理壓力\n\n  會更大，這種吊著心的感覺應該喜歡厲陰宅的朋友不陌生...\n\n   (厲陰宅某段預告是看著音樂盒的時候，盒子蓋下來看到面前突然有鬼，可是電影沒有\n\
  \n    害我害怕好久 = =有人有發現嗎??)\n\n\n4. 沒有記憶點\n\n   的確，安娜貝爾不像厲陰宅有幾個令人印象深刻的記憶點，EX:拍手、夢遊、衣櫃\n\
  \n   可是卻也有一幕讓我很害怕窗戶XDD就是最一開始隔壁夫婦被殺害的倒影\n\n   讓我晚上在家想到的時候就會想把窗簾放下來....\n\n   另外女主角在家報警的時候，娃娃房閃過的人影我本來以為是阿飄，結果是兇手\n\
  \n   淡淡地說: I like your doll ，然後晚上我都會去檢查大門有沒有關好= =\n\n   就像看完厲陰宅晚上蓋棉被會把腳蓋住有異曲同工之妙XDD\n\
  \n   只能說，其實厲陰宅除了幾個很強的記憶點之外，很多地方也是老梗，但是拍得好\n\n   安娜貝爾是老梗，但是也沒有爛到毫無記憶點啦，只是看過厲陰宅會覺得很薄弱\n\
  \n5. 故事節奏\n\n   有人看到睡著，我覺得比起厲陰宅前面還有鋪陳一段，後面慢慢變可怕的時候讓人\n\n   覺得有反差的驚悚，安娜貝爾太早就開始驚悚主軸了，看到後面我精神疲乏Orz\n\
  \n\n我算是個有新上映鬼片都會去租DVD來看的人，看過的鬼片無數，前陣子真的被許多\n\n奇怪泰國片傷害到了...泰國鬼片爛片的機率也太高。名字取得亂七八糟，奇怪的諧音\n\
  \n鬼4虐、鬼亂5、陰地、兇地阿等等之類的...其實都是搞笑片吧。結果覺得還不錯看\n\n的鬼片居然是淒厲人妻haha..所以對於安娜貝爾我還算是挺滿意的~\n\
  \n雖然比起厲陰宅、康乃狄克之類的氣氛營造略遜一籌，但總體來說厲是95分的話\n\n我會給安娜貝爾80分啦，只能遺憾他不能像厲一樣把老梗拍成新梗囉\n\n--"
