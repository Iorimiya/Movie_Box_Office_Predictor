content: '防雷







  記得第二集的時候遇到系列第一個惡魔瓦拉克

  艾琳有靈視到他的名字

  後面喊出來才驅魔，解釋是名字有力量，叫出名字可以驅魔

  好像也沒有強調要面對不能逃避


  這次遇到的鏡子惡魔，結束時驅魔都不知道他的名字，覺得有點突兀

