url: https://www.ptt.cc/bbs/movie/M.1466586203.A.138.html
title: '[好雷]  厲陰宅2 還好有趕上大螢幕'
content: '以下無雷

  -

  溫子仁的鬼片真的是叫好叫座，少見電影第二集表現能比第一集更出彩。

  -

  前半段真的很恐怖，氣氛營造得太精密，嚇點拉得他媽長到幾度想離場，忍不住拿手機遮

  住眼睛，卻制止不了台詞與音效源源不絕地灌入腦海，心臟緊縮著的時間綿延，我甚至一

  直想我怎麼不乾脆好好回家唸期末考呢？我怎麼會以為早上被帶錯檔案嚇到最低落，人生

  不會再更慘呢？

  -

  總之，氣氛營造得真的超好，超正點。

  劇情方面雖然主軸稍嫌老梗，但處處有溫情、搞笑的小點綴，滿分十分可以給個八分。

  因為即便老梗，整體的設計卻是十分周全，貫穿整部電影的邏輯是正確的，伏筆多，也幾

  乎一一圓滿周全了。也不像《紅衣小女孩》最後跟喇牙亂鬥作收尾，真動人。

  -

  恐怖的氣氛營造壓迫感滿到腦漿爆裂，即使中間有放鬆的橋段，但卻又讓人擔心下一秒鏡

  頭該有什麼的爆點，讓人一刻不得鬆懈。又或者以為沒了，放鬆了，又被嚇到。^^

  這就是溫子仁成功的地方，就是隨時要被惡靈籠罩的壓逼力。帶著驚嚇與絕望的恐懼，像

  是蟲子，沿著瞬間發冷的雞皮疙瘩、爬、滿、全、身。

  -

  以下有雷

  -

  好，我竟然看鬼片看到哭，人生成就達成。

  嗯嗯嗯嗯但不是嚇哭^^ 共感太強烈，我幾乎可以感受到珍妮的絕望，當她在喃喃地訴說

  ，沒有人相信她、大家都害怕她的時候，瞬間覺得很心碎、心酸。


  好不容易使媽媽相信、也在努力取得大家信任的時候，一度又被放棄——她手貼著窗戶，

  朝著窗外的華倫夫婦露出艱澀的面容。

  配樂畫龍點睛："I started a joke which started the whole world crying."

  她給我的形象很鮮明：小小的身軀裡承載的不只是對惡靈的恐懼，她伸出細細小小的手臂

  ，顫抖卻堅定，試圖抗衡她無法抵擋的靈界霸凌（不過這個比喻有點讓我出戲不知道為何

  ），想保護自己的家人。

  起先被入侵是她的軟弱，可是我一直都覺得她好堅強。


  雖然數度害我被嚇到罵幹因為上一秒正溫馨下一秒就被附身了開始發狂了啊啊啊啊啊啊啊



  -

  很喜歡艾德鼓勵珍妮在學校被霸凌的弟弟：「你們要挺她，就像學校有人挺你一樣。」弟

  弟毅然走向廚房的時候，堅毅勇敢。（雖然我也是不懂你們為什麼這麼愛在鬼屋跑來跑去

  ^^

  ）

  佩姬一直守護著珍妮的行為只讓我想到：為母則強。安頓好其餘孩子就要衝進去，救也是

  她孩子的珍妮，縱然她束手無策，卻還是想一直待在珍妮身旁，擁抱她護著她。

  -

  夫婦間情感的輪廓在這一集更加清晰，以及為了陌生卻需要的一家人奮不顧身的模樣，比

  （修正成沒有給予幫助的）警察們給人積極正面的形象。



  垃圾男人帶走了一家子的音樂，有形無形的都被帶走，對比後來艾德彈著吉他與小朋友們

  合唱那裡教人鼻酸，在這麼多折磨與凌遲下，比聖歌還要神聖。（廢話啊鬼修女跟鬼聖歌

  毛死我ㄌ



  妻子羅琳的擔心，丈夫艾德的奉獻，教廷的自私對照夫婦的無私，處理得很精彩。（打到

  這實在有點懶了...........）


  隔著地下室的門板說話那裡，騙走了我不少眼淚：我愛你/是的我也是/可是她需要我

  全世界只有我相信你/你必須要有強大的信仰/去相信其他人都不願意相信的事



  -

  最後吐槽一下：到底誰會沒事把鬼修女畫像掛在家而不覺得可怕？

  而且最後鬼修女是不是走一個小丑路線到底？？？？？？？？



  然後祝大家期末快樂

  被嚇得神清氣爽回家唸書嘍^^


  --

  對啊超鬧的啦嗚嗚那個我看一次就不行了還要生活在一起

  真的很可怕

  我解釋一下，我只是覺得警察很快就放棄了讓我覺得很難過而已QQ

  可能我就是太期待警察的熱心面貌!

  並不是真的批評他們很冷血啦^^"

  不好意思～～～'
