title: '[好雷]【厲陰宅2】試映心得 華倫夫婦英國大冒險'
content: "《厲陰宅2》讓大家等了三年 試映會開始前導演溫子仁特別錄了一段跟台灣觀眾打招呼\n\n端午節快樂的片段 不過會後詢問 不會出現在正式上映啦 片商後來有放在官方粉絲團上\n\
  \n回歸主題這集算是一個獨立完整的故事 所以沒看前一集也沒差就是\n\n這次是1977年英國倫敦恩菲爾德事件 單親媽媽珮姬帶四個小孩的故事\n\n小女兒珍妮被72歲老人附身聲音也變了\
  \ 一連串的情況讓美國天主教請華倫夫婦出馬調查\n\n教廷怕這是假的騙局 所以請華倫夫婦先觀察三天回報情況即可如果真的邪靈入侵在介入\n\n在接案之前華倫太太通靈到華倫先生的死況\
  \ 認為是在警告不要插手這件事\n\n不過熱心助人的華倫先生還是說服太太接下了這個任務前往英國倫敦\n\n這部重點在於BCC錄到很多當時的聲音 證明邪靈的存在\n\
  \n詳細的過程就不爆雷了 這集很適合情侶 夫妻一同觀看 關鍵時刻的救援很值得一看\n\n片長有2小時14分所以把故事介紹的很完整 最後華倫先生拿了個紀念品回家放\n\
  \n後面又看到安娜貝爾的娃娃 讓人會心一笑 這部電影的配樂也滿不錯 有時輕快\n\n華倫先生 自彈自唱 也帶給本片輕鬆的時刻 有溫馨也有恐怖到 不會太刻意\n\n\
  端午節連假 情侶約會 可以選這部去戲院體驗一下 6/8(三)比美國還早2天上映\n\n對了看完試映會後還有送紀念品 拿到是艾草 端午節驅邪保平安很好用就是!\n\
  \n媒體試映會 觀賞時間6/7(二)12.30 地點 欣欣秀泰影城 下面有票根和艾草的合照XD\n\n 覺得不錯就按個讚吧\n\n\n--"
