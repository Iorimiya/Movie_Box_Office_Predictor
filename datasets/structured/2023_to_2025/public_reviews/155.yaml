title: '[討論] 鬼修女與厲陰宅的一些問題（有雷）'
content: '防雷

















  鬼修女的片尾提到 片中的小法 也就是莫里斯


  被瓦拉克附身 之後才跟華倫夫婦槓上



  然後我昨天重看了一次厲陰宅 發現他們的演說中播放的投影片


  裡頭的莫里斯根本跟鬼修女片尾華倫夫婦播放的是不同人...


  而且厲陰宅中還提到


  這個莫里斯從小被父親性侵虐待 之後被附身試圖殺死自己妻子 最後舉槍自盡


  一生充滿了悲劇



  雖然衝突的地方不多 但還是覺得 這層關係很像是硬要套上去的....


  硬要把兩部片串起來 這手法是不是不太優啊...










  -----

  Sent from JPTT on my Sony F3215.


  --

  我還好 不會很累

  跟你聊天一定很開心'
