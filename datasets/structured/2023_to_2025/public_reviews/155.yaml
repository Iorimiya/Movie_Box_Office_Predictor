url: https://www.ptt.cc/bbs/movie/M.1471190065.A.A0C.html
title: '[討論] 厲陰宅2有那麼恐怖嗎?QQ'
content: '小妹今年看過的恐怖電影不多

  只有非死不可 厲陰宅2 鬼關燈 安娜華特

  小妹我沒看過厲陰宅1

  但聽聞厲陰宅1不錯所以小妹想看厲陰宅2試水溫

  前面氣氛還不錯

  但也只是那種恐怖片的fu

  小妹我沒有感到很驚嚇

  直到後面讓小妹我很傻眼

  傻眼到小妹龜懶趴火

  恐怖都不恐怖了

  BOSS直接明目張膽的出現

  擺明就是想殺人 完全沒有鬼片的那種恐怖感

  更好笑的是鬼還會直接附身合體在小妹身上(不是小妹我本人QQ)

  和其他人談判

  鬼那麼強根本沒人可以制服的了他 還會想你談判?

  這個設定簡直笑死小妹我了

  這就好像胖虎明明那麼強 有可能不敢打大雄還和大雄談判的意思一樣

  你會相信?  甘五科寧????

  BOSS更是弱到不行 念個名字就掛了

  比安娜華特女主角補尾刀殺BOSS還鳥



  反觀非死不可有創意 結局又讓人意外

  鬼關燈更是讓小妹嚇到彈都彈不起來


  小妹我認為厲陰宅2評價那麼高

  幾乎都是靠"厲陰宅"這三個字而已

  若是這4部電影名字都遮起來

  我看厲陰宅2的評價也頂多比安娜華特多一咪咪而已啦



  小妹對這4部電影的評價順序為

  鬼關燈>>非死不可>>>>>>>>>>>>>厲陰宅2>=安娜華特


  --

  小妹知錯

  我改QQ'
