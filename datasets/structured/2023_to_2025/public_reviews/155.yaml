url: https://www.ptt.cc/bbs/movie/M.1466085034.A.9D8.html
title: '[好雷] 厲陰宅2 The Conjuring 2 '
content: '修女不要靠近我雷


























  永遠記得當初看第一集的預告

  被裡面的拍拍手嚇到整個魂飛魄散(?)

  然後就進電影院捧場了 (這什麼奇怪的邏輯?)

  不管是拍拍手躲貓貓

  或者是玩拉拉腿遊戲

  還是風吹立體人型衣服立牌 (誤)

  都令人印象深刻


  睽違了三年

  溫子仁導演終於又拍了厲陰宅第二集

  所以又再次進電影院觀賞導演營造的恐怖功力

  這次第二集許多嚇人的橋段

  也讓人印象深刻


  一開始的槍殺命案(查了一下是阿米堤維爾鬼屋事件)

  蘿倫靈魂出竅似的遊走於命案現場的屋子

  讓人想起了陰兒房的故事


  繼第一集的安娜貝爾

  第二集也有接班人了

  那就是臉蒼白修女!

  當她的手慢慢的出現在畫的兩旁時

  就好像七夜怪談裡面的貞子爬出古井一樣

  壓迫感真是炸到最高點

  劇情後面艾德被傷到眼睛

  看不清楚眼前的事物

  有些時刻以第一人稱視角的畫面

  也讓人想起沉默的羔羊裡面

  經典的地下室搜尋驚魂

  這邊值得一提的點是羅倫跑去另一個房間尋找修女時

  修女畫像的對面有另一幅畫

  就是厲陰宅第一集的大樹阿!

  在第一集的那段場景有被嚇到


  小兒子比利半夜踢消防車這段也很驚悚

  甚至後來連帶鄰居也跟著一起遭殃

  起先比利跟姐姐在用旋轉玩具歪頭男時(不知道那個玩具正確的名稱)

  就知道之後會有嚇人橋段

  結果果然有

  原來這也是被惡靈拿來嚇人的東西

  其實長的有點像聖誕夜驚魂的角色(?)


  小女兒珍妮好可憐，不斷被老人比爾嚇

  生病在家看個電視也要被嚇，亂轉台就算了，還被搶遙控器

  在床上睡覺也要被移動到其他地方

  老人比爾表示:其實我也是受害者阿


  華倫夫妻跟Hodgson一家在房間內

  艾德用吉他彈奏著貓王的Can''t Help Falling In Love

  算是緩和一下嚇人的劇情


  另外安娜貝爾的出現 令人覺得溫馨 誤


  電影結束前的搖椅片段 還是令人心驚膽跳


  第二集片尾跟第一集一樣

  都有放當年真實人物的照片

  第二集竟然還播了當年珍妮的真實錄音檔

  還有真實人物照片跟電影照片人物真的很像

  片尾鬼修女跟安娜貝爾出現在照片的中間

  雖然只有短短的幾秒



  結論:誰會在家裡掛這種鬼修女的畫阿? 真的超恐怖




  --'
