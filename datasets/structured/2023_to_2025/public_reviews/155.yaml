url: https://www.ptt.cc/bbs/movie/M.1465412218.A.533.html
title: '[好雷] 厲陰宅2 貓王讚！（有雷心得）'
content: '【厲陰宅2】The Conjuring 2（2016）

  —————————————————————


  「各方面表現都進步的精彩續集」

  　　

  　　我一直都不是鬼片愛好者，基本上沒事不會去自虐，但最近得了一種會強迫看續集的

  病，所以厲陰宅2還是硬著頭皮去了。

  　　我對於驅魔類型的恐怖片算是情有獨鍾，可能是因為成長背景不同，對於外來文化會

  更有興趣，比起東洋的鬼片，這種西洋的神怪片我接受度會比較高。

  　　

  　

  　　厲陰宅我認為並不是以恐怖為主打，而是壓抑的氣氛、真實故事、畫面刺激度來獲得

  好評，說真的，整部片兩個小時，完全都是處在非常緊繃的狀況下看完，好不容易有一些

  比較輕鬆的橋段，你又會怕這是不是個幌子，完全沒辦法真正的放鬆下來。


  　　真實故事改編的電影都會有種莫名的吸引力，我會很好奇這些故事到底是如何，在那

  個年代真的有這些事情發生嗎？

  　　對於不是那個文化的我來說，真的是很難想像，雖然我一直不算是個迷信的人，但這

  些無法解釋的事情真的還是寧可信其有。

  　　

  　　

  　　這集的華倫夫妻戲份更為加重，讓人更了解他們的感情和為人，真的非常喜歡這兩位

  演員，他們的演出真的會讓我感受到那股深沉的恐懼和他們的堅持與信仰。


  　　受害者家庭的小妹妹珍妮表現更不用說了，真的都很佩服這些小演員，非常的有說服

  力，真的會讓你感覺到他的痛苦和悲傷，羅琳和珍妮的戲是我全片最喜歡的一段，可以感

  受到羅琳的溫柔和堅強、珍妮的脆弱和恐懼，他們都是與眾不同的人，會遭受到排擠和猜

  疑，但你必須保持樂觀直到找到信任你的人為止，不然你很容易就會被黑暗吞噬。


  　　另一個讓我感動到流淚的橋段是，一家人聚在一起唱著貓王的Can''t Help Falling

  In Love，在經歷過那麼多事情後，身心俱疲的一家人還是堅強的扶持著彼此，一起合唱

  著這首歌，那個畫面如此短暫卻又如此溫馨，小小的一刻卻是他們心中無比的慰藉。


  　　厲陰宅對我來說不只是單純的恐怖片而已，他教我們要讓心中的光芒戰勝黑暗，教我

  們不管發生什麼事，家人永遠是避風港，教我們遇到有人需要幫助時，不用管他人眼光而

  相信自己的信念。

  　　

  　　這集不管哪個方面都比上一集進步許多，有延續厲陰宅的風格但卻又跳脫出上集的框

  架，對驅魔類型或是西洋神怪的恐怖片比較不能接受的，這部應該還是一樣，不會是你的

  菜，但如果你對這文化是有點興趣的，我相信你會看得很過癮、看得很入迷。



  －－精采呈現的優點－－

  -完全無「冷」場的壓抑氣氛

  -小女孩珍妮的完美表現

  -恐怖等級更加進化


  －－無法忽視的缺點－－

  -無法接受驅魔神怪類型的人可能會興致缺缺


  －－總評－－

  「接近滿分」


  --'
