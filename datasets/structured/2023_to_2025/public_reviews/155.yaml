title: '[請益] 厲陰宅2的台詞詢問'
content: '想請問 ：

  華倫夫婦在火車上那一幕

  女的跟老人鬼通靈

  得知是修女鬼在幕後操控這件事

  女的問老人鬼此局怎解

  老人鬼講的那一串讓女的霧煞煞的謎語的中文台詞

  原文是

  "I am given and I am taken.

  I was there at your first breath,

  But you didn''t ask for me.

  But I will follow you till your death."


  --

  不知道有沒有記憶力很好的大大記得上映的時候是怎麼翻的～句意的話我知道，但謝謝各

  位的熱心！'
