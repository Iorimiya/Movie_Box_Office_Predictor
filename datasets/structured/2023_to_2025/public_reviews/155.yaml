title: '[好雷]  厲陰宅2:全能修繕王'
content: '期待好久的厲陰宅系列終於回來了！溫子仁

  不虧是溫子仁，雖然第一集的拍手梗還是無

  法超越，但整體上比第一集好看！




  從片頭開始，溫子仁就開始用他拿手的氣氛

  營造、嚇人音效幾乎不間斷帶給觀眾極大的

  壓迫感，每每都希望片中時間趕快跳到天亮

  讓我們可以稍微喘息ㄧ下，但片中在白天也

  是不斷的有事件發生！到底在逼死誰呀！！




  從第一集幫羅傑買材料修車後，這集直接當

  水電工幫忙修理水管，真的是走到哪修到哪

  ，強烈懷疑艾德藉由問佩姬前夫的事，想表

  達家裡還是得要有個男人吧!

  不止修東西，1、2集還幫忙照顧小孩，天呀

  ！這麼好的靈學專家哪裡找呀！！！請站內

  信XD




  這延續第一集的ㄧ些對白，第一集中並沒有

  闡述太多華倫夫婦的情感，在第二集中有著明顯但不刻意的情感鋪成，蘿琳擔心異象會成

  真

  ㄧ直深怕艾德單獨行動而喪命，但艾德認為這是他的使命也深信只要羅琳在她身邊就不會

  有

  事，之後歷經了惡靈事件，最後的收尾更是符

  合，他們所深信的「他們的結合是天生註定的

  」。





  --'
