url: https://www.ptt.cc/bbs/movie/M.1465720832.A.C62.html
title: '[普雷] 厲陰宅2-驚悚、幽默與溫馨'
content: '圖文網誌版：


  終於等到溫子仁導演的新恐怖電影上映 眾所期待的厲陰宅2

  畢竟安娜貝爾跟陰兒房3不是溫子仁執導，恐怖程度差很多…

  　

  但個人覺得厲陰宅2沒有勝過厲陰宅1，也沒勝過陰兒房1&2

  單看厲陰宅2本身其實不錯，可能是原先太過期待，

  加上會不自覺跟導演其他作品比較，才略感失望。

  　

  真要說為什麼，可能是厲陰宅2少了一點經典在(?)

  像是厲陰宅1的拍手非常深植人心，

  導演的其他恐怖片作品中，也有很多出乎預料、不是用音效嚇人卻相當可怕的橋段，

  這集就稍微少了一點。

  　

  劇中用了很多歌曲，這些歌曲用在恐怖片中究竟是加分還是扣分見仁見智，

  但對我來說有點扣分，因為氣氛變得好神聖或溫馨，


  有一首台灣人非常耳熟能詳的歌，聽到的時候真的超想笑

  心想不要在用這個旋律了啦，我內心會跟著唱而且恐怖感會消失阿 XD


  雖然覺得有點可惜，不過厲陰宅2仍舊是一部具水準的恐怖片，

  有劇情而且不八股，美術畫面跟氣氛營造都不錯，

  劇中的場景跟人物造型也非常考究，跟史料照片如出一轍。


  國外很多電影的官網都做得很用心，厲陰宅2也是！

  我上官網玩了一輪，主要有三個部分可以體驗一下，挺有趣的

  官網網址：



  (第1部分)拍照－變成惡靈臉

  可以上傳自己照片，也可以開視訊拍照，先把臉對在框內

  按一下之後，會幫你對出眼鼻口的位置，按下NEXT

  動畫就出現了，畫面中修女的臉就是自己！但是特效加的好重，有點認不出自己


  (第2部分)錄音－說出惡靈音

  可以錄4秒的聲音，完成後會撥放一段影片，影片中惡靈講的話就是剛剛你錄的內容！

  但是很難掌控，因為你說的話會被放超慢，而且音效特效也加很重，

  所以錄的成果常不如預期


  (第3部分)360度VR體驗

  很推VR體驗的部分，相當有趣，

  用手機看的話記得把手機上下左右移動，用電腦的話記得用滑鼠拖曳，相當身歷其境！

  比較不推薦沒看過電影的人玩，因為裡面嚇人的梗是取自電影，

  先玩VR再看電影驚喜感會降低。





  有些人看鬼片會笑出來，我其實不是這樣的人，

  但厲陰宅2戳到我不少笑點，不知道為何…

  撇除本身就是故意營造的笑點，像是警察看到椅子移動後就立刻離開、

  還有導演可能意想不到，但台灣人會覺得很親切熟悉的綠油精口哨聲外，

  珍妮看電視時的遙控器被比爾搶走，珍妮走去沙發，迅速把遙控器拿回，

  最後電視壞掉，亡靈又把遙控器拿走時……

  搶遙控器這種現實中常上演(雖然是跟活人搶)的情節，讓我覺得有點好笑


  再來是修女出現的橋段，前半段真的非常恐怖，尤其是那幅畫逼真到有壓迫感，

  我連現在回頭看劇照都有點害怕，修女似乎隨時要衝出來。

  後半段修女的影子出現，漸漸走向畫時，

  如此新奇且具有創意的呈現方式讓我很喜歡，同時也起了雞皮疙瘩，


  猜得到修女的影子跟畫重疊的時候，修女就會衝出來，

  但我以為重疊後，是畫中的修女不見，變身成實體的修女衝出來，

  而不是修女手抓著畫，朝女主角跑過去……


  看到惡靈手上抓拿畫，朝著女主角跑過去的畫面，

  覺得有點滑稽所以內心偷笑了一下……

  　

  但也只有這橋段想笑而已，其他時候修女出現都讓我緊張不已，

  從厲陰宅到陰兒房，每一部的惡靈造型都令人印象深刻，

  像是安娜貝爾、HOW DARE YOU的恐怖媽媽、鬼新娘、紅臉惡魔，

  這一集的修女也不遑多讓！


  除了修女以外，有一幕不是靠音效嚇人，但我看得渾身發冷，

  就是珍妮被附身而瞳孔變黃的時候，

  即使外觀接近普通人的模樣，不像其他亡靈鬼怪有過多的裝容跟特效，卻非常嚇人，

  可惜出現的次數很少。


  從音樂動畫箱跑出來的惡靈，不知道來歷是什麼，

  不過最後音樂動畫箱被收進華倫夫婦的靈異博物館，

  這個惡靈外觀不算特別恐怖，但殺氣特別重，

  而且從狗的外型幻化成惡靈的橋段讓人印象深刻。


  外觀最普通的莫非比爾莫屬，外觀的恐怖程度比珍妮被附身的樣子還弱，

  當然這是有原因的，畢竟比爾本來就不帶強烈的惡意(?)


  這一集的演員我也都很愛，哈吉森姊妹都長得好可愛，尤其我目光常放在姐姐身上，

  但當我上IMDb查演員資料時，總覺得姊妹在厲陰宅2的扮相最好看


  哈吉森家無論媽媽、姊妹到老么都有一定戲份，只有大兒子強尼戲份很少，

  難得有大兒子單獨的鏡頭，一出場就非常搶戲，最後被嚇到躲進衣櫃…

  　

  至於飾演華倫夫婦的演員我一直都很喜歡，

  這集在華倫夫婦的感情上有多做著墨，看了很溫韾也覺得很甜


  　

  整部電影敘述了兩個真實事件：

  「美國長島安米提威爾凶宅」「英國倫敦恩菲爾德靈異事件」

  　

  「美國長島安米提威爾凶宅」是源於非常著名的兇殺案，

  1974年的某天深夜，23歲的青年羅尼·迪費爾拿著槍，

  一間間房間開槍，將他的父母跟4個兄妹全殺死，

  羅尼宣稱行凶的那晚他聽到了惡魔的聲音，唆使他殺人。

  事後喬治買下了這棟凶宅，但是恐怖事件接連發生，喬治一家只住了28天就逃離這棟房子


  這起事件似乎在不少恐怖電影中都有出現，

  而在厲陰宅2中則將羅尼聽到＂惡魔的聲音＂設定為修女的唆使。

  　

  這段在電影中的呈現方式我很喜歡，

  羅琳拿著槍重演羅尼殺害家人的過程，尤其鏡子反射出羅尼的樣子更是經典。

  　

  至於「英國倫敦恩菲爾德靈異事件」就不用多說，整部電影都演給你看了XD

  特別的是，一直到現在，還是很多人認為「英國倫敦恩菲爾德靈異事件」是造假，

  無論是聲音、照片甚至靈異現象，都是出自珍妮的策劃，

  現實當中的珍妮曾經教過叔叔如何用低沉嗓音說話，

  據說從珍妮口中發出比爾的聲音時，用詞語句有些是小孩才會用的詞彙，

  而且珍妮曾經親口承認假造部分靈異現象，為的是不希望失去大眾的關注，

  即使曾拍出不少靈異照片，也有很多人認為要拍出這些靈異照片並不難，

  一切究竟是真是假我無法斷定，不過電影巧妙的將造假風波帶入電影中，

  並且將它化為本集劇情的精隨之一。


  亡靈後面還有幕後主謀的劇情很新穎且出人意料，

  艾德透過兩捲錄音帶同時撥放，得出線索非常厲害，

  個人覺得筆仙部分是讓比爾出現的主因，後來比爾想離開，卻被修女指使。




  片中運用大量輕快或神聖的音樂，搭配恐怖畫面，想製造一種反差的恐怖感，

  但這些音樂出現時，反而讓我好放鬆，尤其綠油精太洗腦了，

  我腦中一直浮現「綠油精、綠油精、爸爸愛用綠油精」

  　

  倒是艾德拿吉他唱的情歌好好聽，大家合唱時溫馨又浪漫。


  最後，雖然我看完電影跑去吃 吃到飽，

  但還是要叮嚀大家，不要吃得太胖，小心過不去喔XDDDD


  --'
