url: https://www.ptt.cc/bbs/movie/M.1465393782.A.152.html
title: '[好無雷]《厲陰宅2》觀後心得'
content: '身為資深鄉民  幾年沒PO文還是要浮上來分享一下


  不得不先提溫導  雖然說我是從2013厲陰宅才真正認識他


  當時認真了解一下  才發覺這個人真的是個天才


  居然奪魂鋸 陰兒房 到2015的玩命關頭7都是他執導的


  前兩部是恐怖片不說


  但跳Tone有的大的玩命關頭讓我一直期待Rock的病房裡出現安娜貝爾啊 XDDD


  其實這部片從預告會有第二集開始就期待到現在 但說是期待不如也可以說是怕受傷害


  因為有太多續集片會讓人覺得...真的只要經典就好了  不要再拍續集了拜託


  從高中到現在看的恐怖片少說四五十片的我 (好我承認超過十年好嗎?


  看到厲陰宅真心覺得是部很棒的鬼片 不是單純嚇人而已 還有親情間的感動


  也介紹了我們安娜的出現  還有以安納貝爾為片名的電影(雖然不好看)


  所以第二集我在想是要用什麼來超越在身邊拍手 從衣櫃跳下來的女巫 還有驅魔儀式


  說好不爆雷  忍著不講很辛苦


  進場去看看吧 朋友  第一集是經典  但第二集也不會讓人失望的


  居然還有愛情元素和搞笑元素  這導演怎麼回事..


  真實事件改編之外  也運用角色平反被認為是惡作劇做假的事件


  我前排的男生一直說不要...no... 乾乾乾....麥啦....


  坐我右邊的男生從頭到尾一直用外套矇住頭  我真懷疑他真的有辦法看到嗎..


  如果你喜歡厲陰宅  那你一定要去看第二集


  讓我連假的一開端心情就超好





  P.S 好心疼裡面的小男生  他好可愛



  --



  --'
