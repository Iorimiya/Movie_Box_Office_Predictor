url: https://www.ptt.cc/bbs/movie/M.1465612397.A.93F.html
title: 'Re: [好雷] 厲陰宅2 但沒有邏輯'
content: '關於這一段，

  昨天剛看完，提供一點淺見。


  要一個12歲的小女孩鑽進去那個水管隔間，

  還用鐵青發狂的臉，

  然後徒手把湯匙折彎亂摔東西什麼的，

  其實單憑她應該不可能...

  除非他是凱特貝琴薩的女兒(誤)


  比較合理的解釋，

  我認為是，珍妮跟魔鬼聯手，

  魔鬼說了，如果珍妮不讓華倫一家離開，

  魔鬼就要殺死珍妮的手足們，

  所以珍妮只能配合演戲。


  於是珍妮就開始有意識的抓狂，

  跑去廚房故意被攝影機拍，

  然後魔鬼再幫他加Buff，

  讓她瞬間移動(一開始從客廳閃現到廚房)，

  讓她軟骨功(進去水管間)，

  讓她變成卜派和低音Vocal加成。




  至於大家討論到不能再討論的其他兩件事，

  私以為，鬼修女出現在羅琳家那一段是預知夢，

  從女兒感覺到背後有人走過就是了，

  (最後羅琳醒來女兒其實一直在旁邊串字)，

  正如同羅琳講的，

  那是她看到的預知，

  來自上帝的恩賜，

  跟七年前看到的幻象(艾德被殺死)一樣，

  上帝提示她，繼續插手任何超自然的事件，艾德可能會死。




  而為什麼鬼修女那麼笨要自招姓名?

  因為當驅魔者以上帝之名詢問惡魔之名時，惡魔不能不答。

  (這好像其他驅魔電影也有類似情節)




  那為什麼鬼修女不自己動手殺珍妮?

  因為惡魔不會自己動手，

  他要的是受害者的恐懼及絕望，

  那種負面能量可以使惡魔強大，

  而且把受害者逼到最後，讓他自殺的話，

  還可以讓受害者下地獄。

  故以CP值來說，當然要用各種折磨來對待受害者，

  而不是直接用超能力讓珍妮被菜刀砍死。



  最後講一下小心得，

  整場看起來都好緊繃，

  最後看到安娜貝爾的時候，

  反而有一種很欣慰，看到老朋友的安全感...


  比起鬼修女，安娜貝爾好可愛啊 <3




  --


  --'
