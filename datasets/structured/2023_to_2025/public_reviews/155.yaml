url: https://www.ptt.cc/bbs/movie/M.1465589406.A.E08.html
title: '[討論] 厲陰宅2 各種線索？有雷'
content: '有幾個點當時沒看清楚希望有板友協助釐清



  1. 鬼修女出現在華倫夫婦家走廊時，


  她女兒好像在做串字手工，


  而且印象中好像就是拼出惡魔VALAK的字母？


  後來想想實在沒道理提示惡魔名字呀！


  是我記錯了嗎？



  2. 當男主角問被阿伯附身的小女孩說：


  你為什麼要折磨這一家人？


  它回答：你是這樣子看我的嗎？


  意思就是阿伯在透露他是被惡魔傀儡的嗎？


  當下小女孩被模糊處理，隱約看到又很像是惡魔VALAK的形體，


  是我多餘的腦補嗎？



  3. 當華倫夫婦放棄救援搭車離開時，突然收到阿伯的感應


  提示到他其實只是魁儡，


  當下他沒法提示是因為在屋中受惡魔屏蔽，


  但這樣也不太合理，因為惡魔VALAK也是不受時空限制的呀！




  這集真的很讚！特別愛鬼修女的造型


  儘管難以超越陰兒房鬼魂的造型，


  但那邪惡的形象真是只能給87分不能再高，


  還有不斷出現的聖歌(?)與綠油精(笑)，


  竟也變成令人毛骨悚然恐怖的背景音樂......


  溫子仁又再創高峰了呀！





  --'
