url: https://www.ptt.cc/bbs/movie/M.1573803523.A.D87.html
title: '[新聞] "哭泣的女人"導演執導《厲陰宅3》會如何?'
content: "2019-11-15\n\n\n雖然派翠克威爾森 (Patrick Wilson) 近年演出過許多令人印象深刻的優秀作品，但對恐\n怖電影迷來說，《厲陰宅》(Conjuring)\
  \ 系列的艾德華倫 (Ed Warren) 或許是這位演員\n最具代表性的角色之一。在許多影迷引頸期盼《厲陰宅 3》(The Conjuring 3) 上映的同\n\
  時，派翠克威爾森也暗示這系列在這部最新續集中將會走向另一個全新的方向。\n\n\n\n\n派翠克威爾森與薇拉法蜜嘉在《厲陰宅》系列電影中飾演華倫夫婦。\n\n\n\
  目前《厲陰宅 3》劇情方面的許多細節仍尚未公開，過去兩部《厲陰宅》電影都是啟發自\n華倫夫婦曾經調查過的真實超自然事件，然而，\n\n\n\n\n「《厲陰宅 3》的製作過程相當順利，也帶來了一種截然不同的感受。」\n\
  \n\n派翠克威爾斯在接受好萊塢報導 (The Hollywood Reporter) 訪談時表示：\n\n\n「這部電影依然有著相同的骨幹，依然是華倫夫婦的故事。再次強調，我們正試圖將角色\n\
  們推往他們從來沒有前往的方向，但這部電影將會加入許多優秀的新風格，因為《厲陰宅\n 3》將會成為一隻截然不同的野獸。我的確意有所指。」\n\n\n\n溫子仁導演執導的《厲陰宅》獲得成功，也開啟了後續《厲陰宅》宇宙的產生。\n\
  \n\n\n\n\n首部《厲陰宅》電影在 2013 年上映時，無論是評價或是票房都帶來了相當亮眼的成績，\n也正式開啟這個全新的恐怖系列，不僅推出了續集，也延伸出了多部外傳電影系列，因此\n\
  形成了一個龐大的「《厲陰宅》宇宙」。然而，粉絲們自從 2016 年就開始等待派翠克威\n爾森以及薇拉法蜜嘉 (Vera Farmiga) 回歸演出華倫夫婦，雖然他們在今年的《安娜貝爾\n\
  回家囉》(Annabelle Comes Home) 的確再次出現，但粉絲們仍希望看到另一部專注在他\n們身上的《厲陰宅》正傳電影。\n\n\n「我的確熱愛演出這位角色，我是說真的。」\n\
  \n\n薇拉法蜜嘉曾向娛樂周刊表示，\n\n「我老實跟你說，在這個紛亂、仇恨以及分裂的氣氛下，我喜愛展現出華倫夫婦的團結、\n親密關係以及羈絆。這對我來的確相當特別。」\n\
  \n\n\n《厲陰宅 3》將由《哭泣的女人》導演邁克爾查韋斯執導。\n\n\n導演邁克爾查韋\n斯在接受 GameSpot 網站的訪談時，談論到這部電影與《厲陰宅》系列的巧妙連結，他表\n\
  示：\n\n\n「這部電影引發了許多討論。佩雷茲神父 (Father Perez) 的確提到了其他為教會工作的\n人物。還有一個原本將會出現在這部電影片尾最後的片段，我們拍攝了一段琳達卡德琳妮\n\
  \ (Linda Cardellini) 的角色將項鍊交給了雷蒙克魯茲 (Raymond Cruz) 的角色來保管。\n接著，雷蒙克魯茲提到了他知道可以好好保管這個項鍊的人，而他們住在東岸，專門處理\n\
  這類型的東西。」\n\n\n\n由溫子仁《厲陰宅》延展的《厲陰宅》宇宙。\n\n\n與《安娜貝爾》(Annabelle) 以及《鬼修女》(The Nun) 不同的是，《哭泣的女人》出現\n\
  的邪靈「憂羅娜」並沒有在《厲陰宅》本傳登場過，但觀眾能夠在《哭泣的女人》中看到\n一位過去曾在系列中出現過的角色，藉此證實本片也存在於《厲陰宅》宇宙中。雖然原本\n\
  打算安排這個直接與華倫夫婦呼應的片尾片段，但導演最終認為這樣似乎有點太刻意，所\n以就刪掉了這個片段。他表示：\n\n\n「這個片段的確很酷，而我也認為大家都會喜歡的，但我們之後有覺得這樣可能會弄巧成\n\
  拙，好像很刻意要與《厲陰宅》連結一樣。我們在拍攝時的確有著相當愉快的體驗，大家\n都參與在其中，我們都是《厲陰宅》宇宙的粉絲，當然也會找來溫子仁擔任監製。我們好\n\
  像進了糖果店的小孩一樣，希望這部電影到處都能有與《厲陰宅》的連結。」\n\n\n\n\n\n--\n\n厲陰宅宇宙時間軸\n\n\n 1952年 ：《鬼修女》\n\
  \ 1955年 ：《安娜貝爾：造孽》\n 1967年 ：《安娜貝爾》\n 1970年 ：《安娜貝爾回家囉》\n 1971年 ：《厲陰宅》\n 1973年 ：《哭泣的女人》\n\
  \ 1977年 ：《厲陰宅2》\n 1980年 ：《厲陰宅3》\n\n\n--"
