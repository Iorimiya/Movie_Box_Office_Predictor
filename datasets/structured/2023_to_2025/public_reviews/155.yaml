url: https://www.ptt.cc/bbs/movie/M.1502295280.A.75C.html
title: '[新聞] 為了水行俠 溫子仁婉拒執導「厲陰宅3」'
content: '新聞網址：



  聯合報 記者陳建嘉╱即時報導


  最近溫子仁(James Wan)監製的恐怖片「安娜貝爾：造孽」即將上映，電影評價極好，

  有望在上映後再度創下票房佳績，至於由溫子仁自己執導的「厲陰宅」系列，最近也

  要打鐵趁熱推出第三集，不過溫子仁卻在訪談中坦言，他不會執導這部電影，原因就

  是他自己正在拍攝的「水行俠」。


  在「Cinema Blend」的專訪中，溫子仁提及自己的「厲陰宅」宇宙，表示：「我不認

  為在我的行程表中，有時間可以空出來執導『厲陰宅3』，我還必須為『水行俠』忙

  碌約莫1年半的時間，所以我覺得這應該很困難。」否認未來將執導「厲陰宅3」，

  以往堅持每部電影都要細火慢熬的溫子仁，無論對於自己拿手的恐怖片，或是對於眾

  所注目的娛樂大片都有要求。


  當初在執導「玩命關頭7」時，途中發生男主角保羅沃克(Paul Walker)不幸逝世的慘

  劇，讓他大刀闊斧更改劇本，也調整過非常多次特效上的細節，最終才呈現拍出一部

  評價票房雙贏的電影，如今他為了全心全意投入「水行俠」，也決定婉拒執導招牌作

  「厲陰宅3」，但他有望像「陰兒房」系列那樣親自監製，堅持要讓電影維持既有水

  準。


  ------------------------------------------------------------------------------


  參考外電:Cinema Blend

  Will James Wan Be Back For The Conjuring 3? Here''s What He Says



  心得︰「水行俠」雖然不是溫導生涯製片預算最龐大的電影(僅次於玩命7)，

  但水行俠一來是比較新鮮的題材，觀眾基礎沒有玩命系列來得穩，

  演員陣容也不像玩命的馮迪索或巨石強森那樣能隻手遮天挑大樑，

  看得出來溫導對於水行俠的壓力是有增無減的


  --'
