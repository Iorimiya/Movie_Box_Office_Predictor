title: '[討論] 關於厲陰宅2的搖滾修女'
content: "跟女朋友一起去看厲陰宅2，\n\n每次看到修女出廠的時候，就會覺得很ROCK，\n\n腦海中一直出現在這樣的畫面，趕緊回家PS一張，\n\n\n\
  \n沒錯，根本就是瑪莉蓮曼森，天呀！超ROCK的，\n\n電影瞬間就從恐怖片變成音樂MV了！\n\n希望後面的惡靈修女要好好拍啊！\n\n\n\n\n\n= =\
  \ = 心得正文 = = =\n\n最近大家對於溫子仁的厲陰宅2有很多的討論，而其中，高度關注之一的對象，應該就是\n\n片中的瑪莉蓮曼森，啊，不，應該是瓦拉卡，其英文名稱為Valak或\n\
  \nUalac/Valac/Valax/Valu/Valic/Volac，也太多了吧！\n\n總之，在17世紀有本關於驅魔指南的書，叫做索羅門的鑰匙，書中提到，瓦拉卡是地獄中\n\
  \n的高位階惡魔，相當於惡魔軍團團長，而在歷史文本中，瓦拉卡通常以帶著惡魔翅膀的小\n\n孩外型出現，這種噁心程度應該比純粹用哥德金屬搖滾的瑪莉蓮曼森酷吧！\n\
  \n而溫子仁藉由瓦拉卡的身影，為電影厲陰宅系列（之後肯定有其他發展）成功地敲開未來\n\n之門，甚至也將「恩菲爾德鬼屋事件」與「阿米提維爾鬼屋」兩者，在電影世界觀中做了\n\
  \n巧妙的連結，隨然這兩者事件在真實文本中，並無任何關係！\n\n至於將Valak塑造成褻神者的修女形象好不好，則是見仁見智了！但就商業效益而言，已\n\n經收到具體的效果了！\n\
  \n\n\n\n\n\n\n\n\n\n\n= = = 心得結束 = = =\n\n補充關於電影開頭的那個鬼屋事件：\n\n\n\n\n\n\n\n--\n \
