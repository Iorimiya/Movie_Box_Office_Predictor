title: '[請益] 厲陰宅2的筆仙遊戲'
content: '防雷










  突然想到一開始小女孩拿到的那個筆仙

  跟姐姐一起玩但是沒順利招到靈體


  它的用途純粹只是讓媽媽懷疑小女生

  是因為玩了筆仙後疑神疑鬼做噩夢嗎


  還是其實它真的招到了靈體

  把老先生的靈體找回房間?

  因為老先生有提到他是想回來看家人


  或是老先生其實一直都在那個家裡

  被招來的是惡魔，然後強逼原本相安無事的老先生去折磨那家人呢


  還是其實是因為吸煙危機產生的負面能量

  讓老先生覺得好好吃所以升級成可以物理移動的惡靈

  原本只是想玩玩她們

  但是把小女生嚇的負面能量爆錶

  引來更大咖的惡魔，結果老先生就GG想跑也跑不掉了


  總覺得這部片有很多可以腦補的地方呀

  真有趣


  --'
