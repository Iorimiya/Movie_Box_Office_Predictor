url: https://www.ptt.cc/bbs/movie/M.1593607623.A.3D1.html
title: '[新聞] 是疫情逼我的？《厲陰宅3》可能改明年上'
content: '《厲陰宅3：都是惡魔逼我的》驚爆「改明年上映」　網惡搞「新的片名」笑爆



  《厲陰宅》宇宙正傳第3部曲《厲陰宅3：是惡魔逼我的》（The Conjuring: The Devil M

  ade Me Do It.）預計2020年9月11日上映，片商華納兄弟至今尚未宣布因疫情延期，不過

  因美國疫情尚未控制，而且越來越嚴重，現在傳出該片恐怕會撤檔，延期至明年（2021年

  ）上映。



  ▲《厲陰宅3：是惡魔逼我的》片名標題。


  根據外媒《Deadline》報導，



  。



  對此，華納兄弟並未針對《厲陰宅3：是惡魔逼我的》上映檔期作出回應，不過有網友便

  惡搞片名：「都是疫情逼我的」笑翻不少網友。



  ▲《厲陰宅2》劇照。（圖／華納兄弟提供）



  《厲陰宅》1、2集導演溫子仁（James Wan）麥可查維斯（Michael Chaves）執導，也是

  兩人再度合作。他曾在聲明中讚賞麥可「擁有把情感帶入故事的能力，對情緒和恐懼的理

  解」，很適合執導下一部《厲陰宅》電影，自己也很高興回到監製工作。



  其實溫子仁向來喜愛提拔新生代導演，過去《安娜貝爾》、《鬼修女》等作品也是交由名

  氣還不高的導演執導，自己則是退居監製的角色。外界則推測他可能是因為太過忙碌，畢

  竟他擔下很多監製工作，甚至還有正在籌備。






  --'
