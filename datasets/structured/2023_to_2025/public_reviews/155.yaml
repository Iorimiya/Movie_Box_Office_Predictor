url: https://www.ptt.cc/bbs/movie/M.1466831541.A.183.html
title: '[好雷] 《厲陰宅2》別轉身！恐怖修女背後嚇嚇嚇'
content: "--------------------------------\n買屋前請詳閱說明書，\n來路不明的鬼宅請勿購買。\n--------------------------------------------\n\
  \n有鬼照的圖文網誌版： \n\n--------------------------------------------\n\n經典恐怖片續集甫一推出，票房果然嚇嚇叫，打破台灣影史恐怖片最高開片紀錄。想當年\n\
  《厲陰宅》大賣順勢捧紅了恐怖玩偶界天后安娜貝爾；似乎想湊成恐怖界的女子團體，如\n今第二集又出現新角色 ─ 鬼修女！現在就趕緊來看看又是哪個衰小家鬧鬼要被這恐怖界\n\
  最閃亮的新星嚇一嚇唄～\n\n\n\n\n大量的趕鬼任務後，驅魔夫婦原想休息一陣子。\n\n沒想到，美國鬼處理不完，英國鬼還來搗亂。\n\n\n華倫夫婦受教團指示咻咻飛去英國查看。在\n\
  \n這棟英國鬼宅裡陰風陣陣，小孩莫名漂浮、傢俱離奇移動、有人被惡靈附身，\n\n嚇得整厝家心驚驚。\n\n慈悲為懷的華倫夫婦看見此種慘況，當然義不容辭出手相助。\n\
  \n但是，有陰陽眼的妻子這次卻感受不到鬼魂。究竟，真相是甚麼呢！？\n\n\n\n\n\n\n\n溫子仁恐怖電影最成功的是，他懂得把所有鬼片老哏拿來重新再利用。用得好外，更會發\n\
  明新招，這絕對是純賣音效老哏恐怖片無人能及的。\n\n所以，溫子仁在《厲陰宅》系列有哪些老招呢？除了絕對不能少的音效與黑暗外，還有鬼\n影、、（每次都會遇到鬼的衰小）小孩、（明知有鬼人還要下去的）地下室、陰森玩具（\n\
  安娜貝爾、皮球、發條音樂盒、消防車、兒童帳篷、跑馬燈動畫盒）、夢遊（第一集是撞\n櫃、第二集是要跳繩綁住）、人體漂浮、燈泡破裂、電器自動開啟（收音機、電視機）、\n\
  擺設自行移動（門、鞦韆）、物件憑空消失、人被惡靈附體變音、躲在黑暗中擺出嚇人臉\n的鬼、畫面中出現鬼影但角色渾然不知、一開始就跟你講電影是真人真事不是林北瞎掰的\n\
  。\n\n不過最讓人難以忘懷地，是老溫每次都會生出新招，讓觀眾記在深深的腦海裡，一直縈繞\n不去，好深刻。\n\n\n《厲陰宅》第一集最經典的，莫過於捉迷藏的手拍拍。\n\
  \n當老母顫抖在黑暗地下室點亮火柴，身旁突然伸出一雙手「啪、啪」，\n\n絕對堪稱恐怖片史經典鏡頭！！！\n\n\n\n第二集呢，最亮眼的則是鬼修女的夢境大戰。\n\
  \n\n那段劇情裡，華倫阿姨尋鬼跡走向畫室，發現黑影從角落逐漸移動。觀眾這時跟阿姨一樣\n，彷彿被定了身，直盯著螢幕覺得很詭異卻又無法動彈。所謂，敵動我不動，大概就是形\n\
  容這種時刻。慢慢地，黑影移動至鬼修女畫框背後。烏漆嘛黑的手，像是貞子從後伸向前\n，先是一手，再兩手，就這樣拾起框架。正當觀眾內心納悶它到底要幹嘛時？幹！！！它\n\
  就爆衝銀幕！！！醜臉還穿出畫框！！！此段堪稱第二集最恐怖。\n\n（鬼修女也跟著紅了出道，即將有個人電影）\n（希望不要像《安娜貝爾》一樣變成大爛片）  （未演先唱衰）\n\
  \n在恐怖片把戲幾乎被玩到沒哏的死胡同裡，\n\n溫子仁固守傳統還能推陳出新發想新招。我想，這大概就是大家愛他的原因唄～\n\n\n\n\n\n\n《厲陰宅2》這種超自然邪靈入侵家庭，擄走無辜女孩，讓全家經歷恐怖的劇情。令人我\n\
  聯想到經典電影《鬼哭神號》。該片正是幽靈透過電視機誘抓無辜女孩；《厲陰宅2》珍\n妮感冒待在家看電視正是致敬這種對於科技用品的焦慮與恐懼。\n\n由史蒂芬史匹柏監製的《鬼哭神號》是一部以鬼屋為題材，（在那個年代）特效炫目的新\n\
  潮恐怖片。當時《鬼出神號》暗諷「白人遷徙」，講述美國白人家庭基於「安全考量」搬\n到郊區。無良建商新建社區時僅搬走墓碑卻未處理地下屍骸。因此主角一家變成鬼魂衰小\n\
  的復仇對象。恰巧地，《厲陰宅》第一集也是如此郊區設定。《厲陰宅2》雖改英國都市\n區域，依舊保留前作中原地點死者變鬼魂找（無辜衰小）新房客洩憤的設定。\n\n\
  《厲陰宅》系列有許多設定都與《鬼哭神號》類似，鬼屋、女孩之外，明顯地就是嚇人方\n式。《鬼哭神號》之所以成功便是因為它採一種取材至日常生活的心靈恐懼而非道具機關\n\
  、嚇人鬼怪。最明顯地，就是把小丑娃娃變成一群人的玩偶夢魘。這點，《厲陰宅》系列\n的音樂盒、安娜貝爾娃娃、消防車、動畫盒明顯由此借鏡。\n\n\n\n\n\n\n\
  除了上述的經典電影致敬、老招大補帖。我認為，溫子仁在《厲陰宅》系列的鏡頭語言極\n為精彩。打從《厲陰宅》第一集開場，那幕貼身角色背後環繞宅第時，就可見導演對於鏡\n\
  頭的靈活運用。他更懂得利用歪斜角度去讓畫面顯得詭譎驚悚。最高明是，他明瞭攝影機\n鏡頭不只是上帝視角更是觀眾們的眼睛，他懂得利用來玩弄嚇唬。明顯的例子就是《厲陰\n\
  宅2》那段玩具消防車。那段鏡頭一左一右更迭，當下觀眾與男孩同時看著黑暗中的玩具\n帳篷，一起經歷。那種緊張焦慮感，透過如此操作令觀眾與角色心境同步。明明知道就要\n\
  被嚇，卻無法躲避！（除非你很孬地摀耳閉眼）\n\n當然更不用提，溫子仁是個音效大師來著。他懂得利用「音效漸強->突然無聲只聞角色呼\n吸聲->再霹靂大聲」的模式來驚嚇觀眾。在設備好的影廳或是戴耳機觀看電影最能感受此\n\
  種技法。（反之單用電視看會最無感）\n\n此外，我覺得這次《厲陰宅2》更懂得安插笑點，例如警察的「顯然我們幫不上忙」。讓\n觀眾彷彿間歇運動地舒緩心跳，為的是下一波刺激。\n\
  \n最後，地下室出現安娜貝爾娃娃更是神來一筆的彩蛋。\n\n讓看過前集的想起曾被驚嚇的美好（？）\n\n\n\n誠如我上面所提，《厲陰宅2》最優秀就是老招回收利用。\n\
  \n\n這是優點亦是缺點。\n\n\n對於某些功力高深的資深影迷可能會顯得「還好」。即使是將過去所有優點重新再發揮，\n但有太多畫面有著過往影子以及對於經典片的致敬，顯得很少驚喜。這大概也是溫子仁的\n\
  《陰兒房》、《厲陰宅》僅能成為「2010後年代的經典」而非綜觀「影史恐怖片的經典」\n原因。會讓人最深刻，永遠都是那首度出現的震撼。如《大法師》、《鬼哭神號》、《鬼\n\
  店》等。\n\n不過，對於恐怖片看不多的觀眾、純粹想被嚇的人或在現今滿地恐怖爛片海的情況下，\n\n《厲陰宅2》依舊是一部上乘之作，無可否認。\n\n\n\n\n\
  \n\n分析完電影嚇人技法，我們現在來看看真實事件是不是也這麼恐怖。《厲陰宅２》改編至\n「恩菲爾德騷靈事件」。於1977年發生在英國恩菲爾德街284號一棟單親媽媽扶養四子的\n\
  房屋內。8月30日時，Janet在房間尖叫弟弟的床在移動。母親Peggy Hodgson起先怒斥不\n要惡作劇，而後下樓。但不久聽聞床的移動聲響再次上樓，親眼看見櫃子自行晃動，而姊\n\
  弟倆畏縮在牆角哭泣。接著，母親試圖壓住櫃子固定，沒想到全屋家具竟跟著晃動，最後\n一家五口驚嚇逃出家門。\n\n接著如電影所演，借住鄰居家、女警上門、記者拜訪。更被拍下《厲陰宅2》電影片末字\n\
  幕出現的Janet被拋向半空中的經典照片。此事經記者報導後轟動全國，英國權威媒體BBC\n隨之採訪，更錄下Bill Wilkins錄音。（電影片末有撥出）經警方調查，Bill\
  \ Wilkins為\n房屋之前的死者，這下子靈異謎團更是難解。之後，英國靈異協會拜訪，房屋一堆玩具與\n家具飄浮晃動，並出現大量超自然行為。\n\n這一切看在兩位專家眼裡疑點重重。他們請Janet含水實驗，卻發現仍有男聲發出，專家\n\
  無法解釋。（電影也有這段，記得嗎）後來傳出這屋子鬧鬼原因可能是Janet和姊姊玩通\n靈板導致（這亦是電影最開始）。在Janet 16歲後，全家便離開這棟房子。\n\
  \n\n\n\n\n\n\n\n可是呢！注意這個可是。\n\n這件事情已經被證實為「造假」，\n\n是母親聯手孩子與靈學專家的一場騙局。\n\n\n原因是母親照顧四名幼子財務緊縮，只好出此下策打算出書賺版稅。在事件結束後，\n\
  孩子與專家皆承認是假的並道歉為此負責。\n\n\n因此，《厲陰宅》結局那段，編劇其實也很巧妙地把事實發生的造假捏造融入劇情當中，\n製造了劇情高潮與轉折。（呼應了Janet一開始抽菸被母親認為說謊）導演在結尾放置了\n\
  錄音檔與當年拍攝照片，企圖加深毛骨悚然的感覺。\n\n\n\n知道電影都是假的後，莫名地，好空虛。是不是呢？\n\n\n2003年電影史學家阿蘭瓊斯（Alan\
  \ Jones）曾於電影雜誌《Total Film》發表了一篇文章\n〈The Splat Pack〉。[註1][註2]該文章將一派恐怖片導演定義為「嗜血幫（Splat\
  \ Pack\n）」。簡單說，這派導演有三個條件：1.作品多為R級2.極端暴力3.用低成本攫取高票房\n。而溫子仁憑藉《奪魂鋸》列名其中。\n\n溫子仁並非「嗜血幫」的第一人，不過他卻是「嗜血幫」在好萊塢最亮眼的一人。他是成\n\
  員中唯一的亞裔，這樣的血統背景賦予了迥異好萊塢的視野。加上至幼受到母親熱愛恐怖\n片的薰陶，恐懼的養分，使溫子仁成為一名成功的驚悚片導演。別於好萊塢式的血漿狂喜\n\
  ，他承襲亞洲恐怖片的心靈驚悚。在溫子仁電影中，恐怖是「漸入佳境」的。也就是，恐\n懼感是隨時間逐漸積累的。他善於在電影過程鋪設似J-Horror（日系鬼片）式的恐怖氛圍\n\
  ，讓觀眾在懸疑中感到毛骨悚然。\n\n\n\n這與美式血漿砍殺片是不同的，他在《奪魂鋸》就證明了虐殺與巧妙劇情是能夠共存的。\n\n\n以《厲陰宅》舉例，它明顯就是驅魔類型片，而講到驅魔片我們不得不提《大法師》。\n\
  \n\n\n\n\n的確，《厲陰宅》有許多致敬《大法師》的地方，不過溫子仁與威廉‧弗萊德金不同，他\n加深了電影中的解惑過程。多數驅魔電影不解釋附身來由，但溫子仁於《厲陰宅》兩集都\n\
  將惡靈附體原因來龍去脈交代清楚。將恐懼的過程疊上解惑的過程，使敘事方式異於傳統\n恐怖敘事，這就是溫子仁別於其他導演的強項。加上，《厲陰宅》系列中，溫都選擇改編\n\
  真人真事，讓觀眾透過艾德華倫夫婦的「主觀」視角凝視。這樣子，恐懼感就更加提升。\n\n不也難怪，《厲陰宅》會被說是近年來最恐怖的電影。\n\n從《奪魂鋸》、《歡迎光臨死亡小鎮》、《陰兒房》、《厲陰宅》，\n\
  \n他在兩千年後步入低迷的恐怖片開創出新局，並讓全世界看見，\n\n好萊塢恐怖片已步向新的溫式紀元。\n\n\n\n（他而後也拍攝了《玩命關頭7》並接拍DC英雄片《水行俠》，證明自己並非僅侷限於類\n\
  型片中。）\n\n雖然《厲陰宅2》名為恐怖電影，有著邪靈、驅魔、驚悚等元素，但電影的內在更精神接\n近家庭通俗劇。華倫先生藉由驅魔出現在這個父親缺席的家庭，幫助這一家五口重建家庭\n\
  凝聚，讓珍妮與母親恢復彼此信任，並間接彌補父親出走陰影對於這個家庭的傷害。（最\n明顯就是購買貓王唱片，於客廳演奏吉他合唱）當驅魔結束，家庭關係重新建立後，華倫\n\
  先生即功成身退。他既是驅魔者，更是一個照顧、保護小孩的父親英雄形象。這種暗渡通\n俗劇精神的手法，《外星人》、《侏羅紀公園》也曾使用過。（根本是好萊塢萬用公式）\n\
  \n\n所以呀，當觀眾在看一部驚悚嚇人的驅魔實錄、嚇人恐龍的亡命逃亡、發現科幻生物的電\n影時，其實還包含了一段人際關係如何被重組修復的溫馨過程。\n\n驚嚇之餘，不忘歌頌家庭價值，這大大提升了《厲陰宅2》娛樂效果。不也難怪，《厲陰\n\
  宅2》上映後網路頻出現「好可怕，可是好感人」的意見。\n\n\n\n\n\n\n\n\n《厲陰宅2》回歸《大法師》傳統驅魔片公式，讓小女孩被惡靈附體。這樣的魔靈上身，\n\
  形成一種「性別越界」。女童肉身經由附體產生倒錯與變異，從無性（中性）的童體發出\n非己的言語。\n\n誠如《厲陰宅》第一集華倫夫婦於安娜貝爾事件說明，惡靈是無法附身於物體。基於天主\n\
  教與猶太神祕學設定，惡魔必須透過肉身方能與世界發生關係。當女童遭附身魔怪化同時\n，她的肉體即變成（被宗教道德視為的）異端，與正典背離。簡單說，一個純真無邪的小\n\
  女孩（在一般社會常規下）無法說出淫穢髒話或是攻擊他者；不過一旦惡靈附體，她就不\n再是「女孩」，脫離這樣的常規，做出常人無法想像「女孩該做的事情」。因此，這被認\n\
  定為「邪惡」，世俗所不容。例如：《大法師》中女童麗根附體後對母親狂言淫語。\n\n惡靈附體翻轉了兒童本身常態分界的（性別）身分。存在肉身當中的惡靈決定兒童的（性\n\
  別）心靈，就此兒童脫離常規上演了性別跨越戲碼。然而，觀眾對此恐懼。這個「恐懼」\n究竟是畏怕惡靈，還是驚嚇「兒童」如此大寫不容侵犯的象徵秩序受到傷害，亦或是兒童\n\
  做出「不符合社會想像」的事呢？這種強調兒童純真（即世俗的道德核心）遭到吞噬的危\n機意識，在許多作品其實都能看見。\n\n\n\n\n\n看恐怖片最爽的，就是被嚇的刺激。\n\
  \n溫子仁拍恐怖片很懂這種Fu，塞了大量嚇人招並懂得時兼平均分配，\n\n讓《厲陰宅2》過程中驚嚇連連。\n\n有多久沒被嚇了呢？\n\n趕緊去大螢幕感受一下鬼修女的威力吧！\n\
  \n---------\n[註1]英文維基百科有將這群Splat Pack導演與其作品列表：\n\n\n[註2]懶得看英文的話，PTT電影版jwork網友曾發表文章詳細介紹過Splat\
  \ Pack：\n\n\n--\n歡迎加入粉絲團 一起當愛看電影的鍵人~\n\nmovie板：z-6-6\n\n\n--\n06/25 14:31"
