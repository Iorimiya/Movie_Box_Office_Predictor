url: https://www.ptt.cc/bbs/movie/M.1473251365.A.F66.html
title: '[新聞] 驚悚【特厲屋】厲陰宅2特效團隊新作'
content: "新聞網址：\n\n（中央社記者吳琬婷台北6日電）改編自同名恐怖漫畫的電影「特厲屋」，由「奪魂鋸」系列導演戴倫連恩布斯曼聯手「厲陰宅2」特效團隊聯袂製作，將挑戰觀眾的大膽程度。\n\
  \n驚悚電影「特厲屋」改編自同名恐怖漫畫，執筆漫畫家是曾繪製過知名「X戰警」系列作品及「閃靈悍將」的賓坎西諾（Bing Cansino）。導演戴倫連恩布斯曼野心勃勃地說，將藉由原作的豐富世界，開啟一個全新的恐怖電影宇宙。\n\
  \n為了打造電影驚悚氛圍，曾參與過「遺落戰境」的製片傑西柏格與「厲陰宅2」特效團隊煞費苦心，打造1940年代的黑色電影風格，刻意營造怪誕、復古的視覺效果，提升鬼屋電影的創意層次。\n\
  \n「特厲屋」劇情講述好奇心強、膽識過人的房地產記者茱莉亞（潔西卡隆蒂絲飾），在家人死於殘酷兇殺案之後，人生驟然劇變，她回到悲劇發生的姊姊家，赫然發現屋子不但被破壞，而且陳屍的房間更被整個移走，眼前離奇的景象刺激茱莉亞與她的警探前男友葛瑞迪（喬安德森飾）展開深入調查，卻一步步被捲入驚悚危機。\n\
  \n「特厲屋」將於9月30日在台上映。1050906\n\n\n\n下一部會不會是好弒多\n\n--\nHey Jun\n\n\n\n--\n        \
  \                           09/09 16:08\n                                      \
  \   09/09 16:24"
