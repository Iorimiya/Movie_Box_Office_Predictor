url: https://www.ptt.cc/bbs/movie/M.1465486576.A.F2A.html
title: '[好雷] 厲陰宅2~溫子仁才能超越溫子仁~'
content: '<無音樂有圖好讀網誌版>





  我想只有溫子仁能夠超越溫子仁了




  <無雷認真心得>




  看之前就高度期待這部續集電影，


  因為《厲陰宅》當時真的讓我好驚艷，


  沒想到恐怖電影可以這麼好看，所以一試成主顧，


  連《陰兒房》系列電影我都去看了，


  這次溫子仁要導《厲陰宅2》怎麼可以不看呢?!


  看完之後，帶著滿足的心情走出電影院，


  恐怖電影如果沒有劇情，那就跟普通的B片沒什麼兩樣，


  所以這集的劇情的確蠻有趣的，讓觀眾疑惑到最後才真相大白，


  不過中間鋪梗的時候我承認我有一段覺得有點無趣，


  但擅長操作親情與恐怖氣氛的溫子仁這次也沒有讓我們失望，


  劇情的話，我建議什麼都不知道就去看最好，


  至於恐怖氣氛營造，雖然第一集的拍手真的是嚇到我都快閃尿，


  但第二集也不會讓你失望，的確有一兩個地方會不小心叫出來，


  (對，我就是那個在電影院大叫的神經病XDDDD)


  相信我，去看就對了!!!








  <有雷之到底為何每間房子都要有地下室心得>




  這次的敘事方式比較不一樣，


  一開始讓我們知道華倫夫妻因為某個驅魔事件，讓羅琳不想要再繼續接案驅魔，


  主要原因是他預見了丈夫的死亡，任誰都不想繼續下去吧?!


  而在這次事件中，羅琳看到了一位像是修女的惡靈，


  這個惡靈讓他揮之不去，甚至影響了丈夫艾德的生活，


  所以艾德才會將這個幻象畫下來，但我真的不懂為何想畫這些東西，


  而且還把他掛在家裡(崩潰)，


  羅琳在那個房間內看到修女惡靈這段，真的嚇死我了!!!!


  似真似假，想要愚弄觀眾，他也的確做到了(哭)，


  而同時間，有個很衰的家庭也遇到了糾纏不休的惡靈，


  大家可以去GOOGLE一下"恩菲爾德靈異事件"，


  這應該是這世紀最有名的靈異事件了，《厲陰宅2》直接改編這個故事真的很厲害，


  擷取一下《厲陰宅2》的劇情介紹：


  "故事設定於1977年的英國倫敦，單親媽媽珮姬帶著四名子女住進恩菲爾德小鎮的房子，


  但自從住進來之後，怪事便不斷的發生，


  經常聽見有人敲著房子的牆壁並粗暴地移動家具，


  驚慌失措的一家人開始向外求救，但是就連英國警察也表示愛莫能助，


  媒體除了拍攝到珍妮被不明力量抬離到半空中的畫面外，


  就連英國廣播公司BBC也錄到一位72歲老人比爾的說話聲音，


  而他蒼老的聲音正是發自年幼的珍妮口中，


  從此倫敦的「恩菲爾德鬼屋事件」知名度不脛而走，


  就連遠在美國的華倫夫婦也被請託親赴倫敦幫忙調查，


  但這次惡靈怨念的程度遠遠超過華倫夫婦的想像……"


  所以除了前面所說的羅琳遇到的修女惡靈外，


  還有恩菲爾德這位名叫比爾威金斯的72歲老人惡靈，


  但看似兩件不相干的事情，居然最後可以巧妙的湊在一起，


  到底誰會想的到這兩個不同時間的錄音會可以湊在一起呀!!!


  光是看個在地上交叉的錄音帶我也不會想到這點呀!!!!


  我該說艾德真心強者嗎?!?!?!


  一聽到他們放出來的兩捲錄音帶內容居然可以湊成一句完整的句子，


  當下真的覺得"媽的，這劇情太有趣"，


  居然第一個修女惡靈強大到可以威脅其他靈魂去做他不想做的事情，


  不過最後收尾收的有點快，惡靈被知道名字後就被收走了，


  這或許是比較美中不足的一點?! 我還想看更多惡靈跟華倫夫妻對抗的片段呀!!!!


  另外值得一提的一點是，溫子仁很擅長讓觀眾有同理心，


  像是《厲陰宅》中被附身的主角媽媽，讓觀眾站在媽媽的立場，


  想要一起保護他的寶貝孩子而感到溫馨，


  這集《厲陰宅2》也有同樣類似的片段，但強度好像沒有第一集強，


  不過在《厲陰宅2》中，


  那位單親媽媽發現他們認為珍妮是騙子而他又求助無門的絕望感，其實讓我覺得好傷心，


  而最後讓艾德身陷險境時，真的好擔心艾德會不會出了什麼事情，


  (雖然明明就知道這位仁兄會好好活著XD)


  而且為何每次靈異事件都會有個地窖或是地下室，


  然後總是有事情發生在那裏才過癮XDDDD


  看個電影也要七上八下的忐忑不安真的是很有事，


  但看恐怖電影就是這樣才會爽呀!!!(有病)




  來聊聊演員們，像是派翠克威爾森這樣的帥哥主要的演員們我就不說了，


  (但派翠克威爾森這集唱歌也好好聽呀!!!!想想他的歌劇魅影XDDDD)


  這次覺得一些常飾演奇怪角色的演員真的很有趣，


  像是在IMDB上會發現他專門演溫子仁電影中惡靈的Joseph Bishara，


  除了《厲陰宅2》中的惡靈外，他還演過《厲陰宅》、《陰兒房》系列的惡靈，


  <感謝網友更正!原本寫的是修女惡靈也是他演的，但修女惡靈是Bonnie Aarons飾演>


  可以說是溫子仁的惡靈担當，本身還為溫子仁這五部恐怖電影作曲，真的很有趣!


  還有飾演片中歪頭男的演員Javier Botet，


  因為他的身材很特別，又瘦又高，手腳又長，


  所以他都接一些奇異的角色，除了這次《厲陰宅2》中的歪頭男，


  他還演了《腥紅山莊》裡的眾多鬼魂之一，


  <繼續感謝網友更正，《羊男的迷宮》瞳魔是由Doug Jones飾演>


  原來歪頭男不是全部都是電影特效做出來，這真的還蠻令人感到驚奇!!!!!


  總之，個人很喜歡《厲陰宅2》，溫子仁讓我開始喜歡看恐怖電影，


  我想我以後還是會繼續追隨他的!!!!


  以上，推薦給大家，謝謝各位看完!!!!


  --'
