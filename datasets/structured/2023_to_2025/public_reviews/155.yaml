url: https://www.ptt.cc/bbs/movie/M.1467086152.A.827.html
title: '[討論] 厲陰宅2的名字'
content: '防雷












  爬了幾篇吐槽的文章

  發現有人提到說為什麼惡靈要一直把名字告訴女主角來收服它

  說這根本不合理


  或是既然目標是華倫夫婦

  幹麻又要把他們騙走


  我是覺得那些一直出現在女主角家的名字

  有沒有可能其實不是惡靈給的提示

  而是上帝呢?


  就像他們後來要離開的時候

  錄音帶掉下來形成一個十字架的圖案

  既然有惡靈的存在，那相反的也可以看做上帝是存在的

  而這些啟示只是端看他們有沒有當作一回事

  也就是信仰的力量


  然後關於為什麼要把華倫夫婦騙走

  一來就像老人說的，惡靈真的很想要那個蘿莉

  二來惡靈的最終目標是華倫太太

  (我猜啦，因為華倫太太對牠的威脅最大)

  整部片都在營造華倫夫妻的感情多麼深厚

  所以牠不需要直接進行物裡攻擊

  只需要把華倫太太逼瘋就好了


  華倫夫妻離開了沒回去的話

  他們在第二天就會看到小女孩死去的新聞

  夫妻救會因此自責

  "計劃通"


  華倫夫妻回去的話

  如果沒發現啟示的名字

  老公為了救小女孩死掉

  華倫太太就會大崩潰

  "依然計劃通"


  因為惡靈是吸食負面能量而生的

  華倫太太的特殊體質搞不好他的念能量更營養

  所以把他逼瘋惡靈就可以吃很飽這樣


  結論是這部續集真的拍的很不錯啊


  --'
