url: https://www.ptt.cc/bbs/movie/M.1502603122.A.936.html
title: '[新聞] 「厲陰宅宇宙」來了！《安娜貝爾：造孽'
content: '有雷












  記者許瑞麟／綜合報導


  《安娜貝爾：造孽》上映後，再次確立「厲陰宅宇宙的形成」，片中也藏有許多秘密，此

  次溫子仁仍然擔任監製，改由《鬼關燈》導演David F. Sandberg執導，不同於首集風格

  ，評價大多比上一集好，以下便整理本片的幾處巧思，不知道你有沒有發現。





  安娜貝爾被關起來的房間裡面有個十字架，透過鏡頭把十字架給反了過來，下一幕便接到

  女孩們看著井底的畫面。這部分在《厲陰宅2》有提到，有一派認為「逆十字架」是對耶

  穌的挑釁。




  片尾珍妮絲出現在另一家孤兒院，前來收養她的夫婦送上一個可愛的娃娃，真實事件中，

  真正的安娜貝爾比較像是那副模樣，而非觀眾所熟悉的金髮、白洋裝。





  夏洛特修女拿給屋主看的照片，是在1952年於聖卡塔爾修道院前拍的照片，在照片暗處隱

  約可以看到「惡靈修女」瓦拉克，片尾也預告將推出該角色的獨立電影，把故事和《厲陰

  宅2》連在一起，目前外媒也推測飾演夏洛特修女的Stephanie Sigman將會在該獨立電影

  回歸演出。





  片尾如果有看過《安娜貝爾》第1集的觀眾就會知道，這是希金斯夫婦被謀殺的場景，但

  當時還不曉得行兇的人就是珍妮絲，之後她和一名男子跑到鄰居家，也就是第1集的主角

  約翰和米婭家，準備再大開殺戒，最後卻失敗，她便割喉身亡，血滴在金髮、白洋裝的安

  娜貝爾娃娃眼睛裡。先前就有說過《安娜貝爾：造孽》算是《安娜貝爾》的前傳。





  片中的珍妮絲在現實生活中年僅14歲，名叫泰莉莎貝特曼（Talitha Bateman），演過《

  第五毀滅》、《Vengeance: A Love Story》、《我的老爸喵星人》等片，弟弟可是演過

  《鬼關燈》、《安娜貝爾》的加布里埃爾貝特曼（Gabriel Bateman），姐弟倆和鬼片都

  很有緣。



  cr:


  --'
