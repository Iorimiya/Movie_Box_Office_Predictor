url: https://www.ptt.cc/bbs/movie/M.1465612957.A.853.html
title: '[討論] 厲陰宅2 鬼修女的來歷?(有雷)'
content: '抱歉另發一篇 ，


  以下有雷，請斟酌。
















  看完厲陰宅2後，對於鬼修女的來歷，

  發現電影中沒有交代很清楚。



  比爾的來歷就是一個死後回家探親的老兵，

  發現人事已非，

  要離開前被鬼修女困住，

  變成她手下去折磨珍妮一家，

  這部分沒什麼問題，

  比爾就是個可憐的老阿伯而已。



  至於鬼修女，

  有說惡魔之所以化身成修女的形象，

  還搭配不斷穿插撥出的聖歌，

  就是要褻瀆羅琳的信仰，

  這部分倒是沒什麼問題。



  只是，鬼修女到底為什麼沒事找上珍妮一家呢?

  是不是跟一開始那個碟仙板有關呢?

  珍妮跟姊姊玩碟仙板招喚附近靈體，

  詢問父親什麼時候回來乙事，

  讓碰巧經過的鬼修女，

  發現這一家人(特別是珍妮)，

  悲傷絕望的低迷氣氛(沒錢買食物、爸爸出軌不回家、弟弟被霸凌等)，

  是個很適合讓自己壯大的地方(惡魔能力來原為人們的絕望)。


  故才找上珍妮一家。



  西方的鬼片，不像東方計較因果關係，

  所以除了這樣推論，

  我實在想不透沒事鬼修女找這一家人開刀幹嘛...




  以上，歡迎討論。








