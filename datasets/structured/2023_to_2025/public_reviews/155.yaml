url: https://www.ptt.cc/bbs/movie/M.1465477122.A.861.html
title: '[好雷] 要看厲陰宅2的人千萬不要看預告'
content: '如題~~~~~~~~~千千萬萬拜託您不要看預告阿


  因為真的被嚇得好爽阿阿啊!!!!!!!!!!!!!!!


  如果看了預告片效果絕對就不好了



  小的喜歡看恐怖片最近的有屍憶.紅衣小女孩.


  以前也有安娜貝爾.厲陰宅...等等 總覺得這種片就是要在電影院看才過癮阿XD



  這次2代給我的感覺超級好看


  最近恐怖片的導演真的很卑鄙  會故意在老手覺得會出現嚇人的地方不出現


  然後再莫名其妙來給妳一發震撼彈


  =======================================以下是雷


  這次我完全被幾個點毫無預警的嚇到


  1.最後老頭在陰間被BOSS拍肩膀


  2.老頭在房間牆壁撲向小女孩  等等


  B.T.W.最後彩蛋還原當時的現場錄音內容雖然不是突然嚇妳


  但因為呼應整部電影內容  我認為是最毛的部分



  然後全場狂在笑的點有


  1.警察到凶宅看到椅子的那段表情對話


  2.老頭被採訪說害羞要大家轉過去和男主角的對話過程  等等



  以往恐怖片都是當事者看到靈異現象


  向第三者訴說卻都被潑冷水或是被當成在胡思亂想.耍人


  或是能看到靈異現象的當事者下一秒就會領便當了


  但厲陰宅和一般鬼片不同的創新在於鬼可以隨時讓其他不相關的人看到


  這點讓我感覺非常跳TONE也讓在場所有人笑翻



  最後我想請問一下  影片快結束時的紅帽子很會跳的高挑瘦竹竿男人


  是最後被收服的魔王VALAK嗎??感覺好不像.....



  --'
