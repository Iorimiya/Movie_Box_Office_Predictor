title: '[史佳雷]厲陰宅2-超越爽片的恐怖新經典 '
content: '【此段心得無雷】

  　　相較於隔壁棚同檔期的，對我來說恐怖大師溫子仁拍攝恐怖片的功力才真的是出神

  入化！氣氛怎麼能夠如此精準拿捏，怎麼能夠如此洞悉觀眾的心理，畫面上看似已經讓

  人準備好接招了，觀眾心裡就想著：「就是這裡，驚嚇點要來了！」但最後還是被嚇了

  一大跳，在神導溫子仁面前，做再多準備都沒用，因為你總是猜不透他。

  　　這一集片長長達130分鐘，但卻是扎扎實實嚇好嚇滿了大家，恐怖的氣氛營造壓迫

  感十足，讓觀眾的心緊緊被懸在空中，即使中間有放鬆的橋段，但卻又反讓人擔心是不

  是又在埋什麼梗，讓人一刻不得鬆懈，真的讓我感覺這家人被折磨了很久很可憐，最後

  收尾之後也讓我深深感到如釋重負，事情終於解決了實在好感人。當然其中驚嚇點也非

  常的多，而且和以往恐怖片不太一樣的是，這裡面的超自然現象都非常高調，不會說又

  只有小女兒小兒子看到，然後其他人都不相信，這次的靈動完全是當著大家的面前直接

  來的，這點倒是很新鮮，不過可惜的是沒有出現能夠超越上一集畫龍點睛的拍手神梗，

  但比上一集出色的是故事前後連結和後段轉折處理超棒！溫子仁再次拍出了一部神作，

  必收藍光！



  -----------------下面將會開始提到劇情，不想看請快點跳開--------------------





  【真實事件】


  　　這部片雖然是沒看前作也能安心服用的片，但是如果有看過第一集的人，就會發現

  不少有連結的地方。而【厲陰宅】系列好看點之一，就是它都是真實故事改編，就算你

  原本不知道，片尾的真實花絮也會讓你在炎熱的夏天看得背脊發涼。


  　　電影起頭，和首集一樣先用一個案件作為開頭，這邊也是個真實案例，大家可以自

  行google「阿米提維爾Amityville」就可以看到不少解說，而這個事件當年也是震驚美

  國的大新聞，所以非常有名，前前後後被改編過許多次，最近一次被改編的作品就是20

  05年的電影【陰宅】，也就是【厲陰宅】電影最後提到華倫夫婦要去處理的長島案件。

  故事簡單是說住在這間屋子裡的長子，聽到有個聲音在後面指使他，讓他在半夜槍殺了

  他的親人全家共六人，而後再住進去這個屋子的另一家人，則一直被不可解釋的超自然

  現像干擾，之後華倫夫婦才受託出面處理這個案件，時間為1976年。


  　　接著是第二集的主要故事，大家也可以自行google「恩菲爾德Enfield」，也因為電

  影的上映，讓這個原本就非常有名的案件變出更多相關文章。有去了解當時這個事件的

  人就可以知道，電影的還原程度非常高，房屋、房間這種基本場景的還原就不必說了，

  演員們也都很相似，出場的角色也幾乎都是真有其人，而當中的焦點也就是靈異事件部

  分也都是真有其事！舉例像是物體自行移動、不明的腳步聲、撞擊聲，甚至11歲的珍妮

  發出老人的聲音、窗簾捲住珍妮、珍妮漂浮在半空中都是有被記載到的！然後故事中的

  老人鬼和珍妮的媽媽佩吉也真的是都在那張舊椅子上過世的，最後甚至連珍妮造假超自

  然現象也都是真的！珍妮本人接受訪問承認她確實為了引起注意有造假過，但也說那只

  其中的一小部分，絕大部分的恐怖體驗都是真實發生在她身上，不過也因此很多人懷疑

  從頭到尾根本整個事件都是作假。



  【故事劇情】


  　　第二集很棒的是導演藉著主角華倫夫婦，將兩個分別在美國英國發生的事漂亮的銜

  接在一起，並且加強華倫夫婦之間的情感，讓這個恐怖故事不是只有單純的驚嚇，更有

  溫馨動人的情感，甚至是看得我熱淚盈眶。我認為三個地方有點催淚，一是因為珍妮造

  假，而讓華倫夫婦無法幫助她們，只好搭車離開那段很心酸很難過；二是艾德和羅琳隔

  著門對話的那一段真的讓人看好揪心，好難過啊~；還有最後惡靈退散，看著這一家人

  費盡千辛萬苦熬過了片長兩個小時的折磨終於解放了，圓滿結局讓人不禁跟著喜極而泣。


  　　除了感人，故事的轉折更是一絕，其一是導演將案件的真假與否這個論點，漂亮的

  融入電影之中，變成是惡靈逼使珍妮造假，我覺得這個處理太棒了！其二是前半段原以

  為都是老人鬼在作祟，但其實背後是惡靈在操控一切，這樣的設定也是前所未見的厲害

  ，老人鬼其實也只是想回家看看家人，不小心被惡靈抓來當工具人，其可憐程度不下珍

  妮一家人。



  【劇情討論】


  　　然後在這邊我提出一些我的觀點，但不敢說一定正確，因為電影中沒有明講，如果

  錯誤還請包涵補充：


  　　很多人都疑問說修女鬼怎麼會從美國跑去英國怎樣的不合理，但其實前段出現的修

  女鬼只是羅琳天賦的預知能力，祂並沒有真的出現，只是羅琳在預知夢裡看到，同時也

  預知到了先生艾德之死，第一次在鏡中看到和第二次在家裡看到都是預知能力，而艾德

  也隱約受到影響，所以做夢夢到就想說畫下來(只是很靠背的幹嘛掛在牆上)，所以從頭

  到尾並不是華倫夫婦把修女鬼帶去了英國。


  　　承上，修女鬼的目標究竟是華倫夫婦還是珍妮一家人？在我看來修女鬼的目標還是

  珍妮，祂警告華倫夫婦、逼珍妮造假趕走華倫夫婦，只是不想他們壞了祂的好事，至於

  為何選上珍妮，並不全然是那塊通靈板，只能說這是東方的觀眾不太理解西方宗教的文

  化，但如果常看惡靈驅魔相關電影的人可能會知道，惡靈並不能直接要活人死，祂就如

  電影中所說，惡靈會趁人體虛弱、意志薄弱之時侵入，再慢慢的製造各種異象來讓你更

  加恐慌、無助，吞時你的精神力藉此壯大自己，最後才能致人於死，只能推測說珍妮家

  境不好父母又離異，在學校又被欺負又被眾人誤解抽菸，連媽媽都對她不信任，脆弱的

  心靈才會讓惡靈有機可趁，而通靈板的觸動應該就是最後的導火線，讓惡靈找上門。


  　　至於最後羅琳為何會知道修女鬼的名號，同樣也是說對於西方宗教的不了解，在過

  往的驅魔電影中，都是這樣解釋的，當有驅魔能力的人以上帝之名詢問惡靈之名時，祂

  們不得不說，而且知道惡靈的名號確實驅魔儀式中的重要關鍵點，只是可惜最後收的有

  點太過簡單。


  　　當然缺點也不是沒有，其中我覺得最不好的點就是修女鬼拿著畫衝出來的那個點，

  雖然當下瞬間很嚇人，但其實有點好笑，我原本以為祂是會從牆壁慢慢浮現，然後可能

  對羅琳做出什麼攻擊或是驚嚇，但完全沒想到是自己拿著畫衝出來，實在是有點好笑。

  其二就是長手長腳的歪頭人，雖然也是頗嚇人的，但我覺得他的能力太過強大的獵奇，

  有點讓人出戲了。



  【總而言之】


  　　因為實在太喜歡這系列，心得感想特多，真心希望溫子仁導演導完【水行俠】之後

  ，可以再回來導個第三集，完成專屬他的恐怖經典三部曲，不要再丟給別人導了，以免

  跟【安娜貝爾】一樣又被倒了。





  　


  --'
