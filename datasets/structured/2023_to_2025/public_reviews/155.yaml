url: https://www.ptt.cc/bbs/movie/M.1552727910.A.729.html
title: '[新聞] 厲陰宅宇宙新作！《安娜貝爾回家囉》電影'
content: '厲陰宅宇宙新作！《安娜貝爾回家囉》電影名稱確定　「驚奇隊長」童星演出華倫夫婦女

  兒！


  由驚悚片名導溫子仁從 2013 年推出的《厲陰宅》（The Conjuring）開始創立的驚悚電

  影宇宙，圍繞在超自然現象調查者「華倫夫婦」所參與的靈異事件為主題，華納旗下的「

  厲陰宅電影宇宙」已經從本傳衍生到推出了角色電影，就在《鬼修女》（The Nun）在去

  年以 2200 萬美元較低成本於全球收穫 3.65 億美元票房而獲得好收益的同時，厲陰宅電

  影宇宙中最具高人氣的角色電影《安娜貝爾》（Annabelle）第 3 集也終於要回歸！


  除了《厲陰宅》（The Conjuring）本傳電影都是由溫子仁親自導演，之外的衍生角色電

  影大多數都是找他團隊中的其他導演掌鏡，而溫子仁本人也會親自監製確認品質，不過今

  年即將上映的《安娜貝爾 3》卻有著大大的不同之處！《安娜貝爾 3》不僅找來了「華倫

  夫婦」兩名主要演員的派翠克威爾森（Patrick Wilson）和薇拉法蜜嘉（Vera Farmiga）

  首度演出角色電影，而且這部片也將會達到這隻邪靈娃娃故事的高潮，那就是邪惡的安娜

  貝爾將會讓華倫夫婦的那間收藏室中全部奇異的惡靈都復活過來，讓他們陷入前所未有的

  危機和混亂當中。


  而在近期以漫威第一部女性超級英雄角色電影《驚奇隊長》（Captain Marvel）而更加受

  到矚目的童星麥肯娜葛瑞絲（Mckenna Grace），她也將首度加盟「厲陰宅電影宇宙」飾

  演華倫夫婦 10 歲女兒茱蒂。過去在《厲陰宅》電影中女兒角色都是由另一位童星

  Sterling Jerins 扮演，在今年則換成了於《驚奇隊長》電影中詮釋小時候卡蘿丹佛斯的

  當紅童星、12 歲的麥肯娜葛瑞絲。


  最新消息《安娜貝爾 3》也確定了完整片名，英文為「Annabelle Comes Home」，有趣的

  是台灣片名將翻譯為《安娜貝爾回家囉》，似乎帶有一絲俏皮的詭異感，我們將為這個世

  界上最邪惡的娃娃給耍弄，尤其是監製溫子仁形容這部續作電影場面將會像是安納貝爾版

  的《博物館驚魂夜》（Night at the Museum）一樣精彩。《安娜貝爾回家囉》已經定檔

  於今年 6 月 28 日在台灣上映，與全美同步。




  --'
