title: '[討論] 厲陰宅2幾點疑問(雷)'
content: '前天看完厲陰宅

  覺得比1好看很多

  有些地方想知道為什麼

  請原諒我常常瞇眼看 理解力不足><


  1. 歪歪出現的用意

  歪頭男是什麼東西化身的呢?為什麼一個小小的玩具要化身為惡靈嚇人


  2. 修女為了要艾德死 大老遠繞了一圈利用他人靈魂

  修女為什麼直接不親自出馬

  要利用老比爾的靈魂騷擾他們一家人?因為剛好比爾的靈魂在屋內徘徊嗎?

  還讓人家大老遠跑到英國去


  3. 敲敲門(knock knock)

  比爾跟第一批探訪人員對話

  被問到名字時 為什麼要說敲敲門?


  4. 比爾害羞

  為什麼跟第一批探訪人員對話時完全不害臊 跟艾德對話時就要請他們轉過去?

  他可以跟上次一樣附身珍妮說話呀


  5. 假牙

  爬文過看到這題無解Xd

  假牙出現的意義是什麼 我不懂


  6. 真名

  為什麼修女要告訴羅琳自己的真名?


  暫時先這樣 其他應該沒什麼問題了~~先謝謝各位解答



  --'
