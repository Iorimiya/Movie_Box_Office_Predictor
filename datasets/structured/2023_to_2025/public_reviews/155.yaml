url: https://www.ptt.cc/bbs/movie/M.1757257236.A.F9C.html
title: '[討論] 厲陰宅4票房輾壓系列紀錄 北美影史第3高'
content: 'Deadline報導:





  《厲陰宅：最終聖事》本周末於北美開出驚人的8300萬美元票房數字，


  遠超過原本系列最高《鬼修女》的5381萬美元，大幅更新系列最佳數據。


  這個紀錄同時也是北美恐怖片影史第三高的數字，


  僅次於兩部《牠》(首集1億2340萬、續集9106萬)。



  不僅是北美紅盤，連海外都是熱賣狀態，全球首周末達1.87億美元。


  就在前幾天，華納自估的數據認為該作本週末全球應能賣出8000萬美元，


  結果比翻倍還多。


  一開始媒體對這部的首週末預估，是北美首週末3500~4000萬之間，


  隨著上映前熱度提升，而拉到4000萬~5000萬之間。


  週四提早場爆出850萬的數字時，預測再次提升到6500萬，


  沒想到最終還是低估了該系列的魔力。



  --'
