url: https://www.ptt.cc/bbs/movie/M.1467083837.A.E3D.html
title: '[好雷] 《厲陰宅2》　是在向西遊記致敬嗎？'
content: '經由原作者 昆汀涂 同意轉貼





  《厲陰宅2》之所以好看，在於恐怖片該有的元素，它都具備了，特別是它還多了一份「

  人情味」，讓人感到暖暖的。


  　近年幾部較知名的西洋鬼片，主角都擁有一個團結的家庭，無論是《陰兒房》系列，或

  者是經典片重拍的《鬼哭神嚎　惡靈15》，這些電影裡的孩童角色，在面臨靈異事件時，

  家人總是第一時間跳出來相互扶持，主打親情元素，《厲陰宅2》也不例外。


  主角哈吉森一家五口十分團結，除此之外，它還多了「人情味」，這是遠勝於其他恐怖片

  的地方，像是熱心的鄰居佩姬跟維克，即使在靈異現象從哈吉森一家蔓延到他們家，依舊

  情義相挺，不因鬧鬼而切割；還有華倫夫婦明知此事有性命之危，依舊冒死搶救哈吉森一

  家，並且多次開導主角珍妮哈吉森；另外，在調查員艾妮塔是個非常重要的角色，她質疑

  哈吉森一家是自導自演，屢次規勸華倫夫婦離開，而錄音員莫里斯卻堅持相信哈吉森一家

  的遭遇是真實的，調查員跟錄音員兩個立場對立的角色，屢屢衝突，會令觀眾愈加同情哈

  吉森一家，而當觀眾開始同情哈吉森一家時，再想起華倫夫婦、鄰居佩姬跟維克、錄音員

  莫里斯的情義相挺，頓時，讓《厲陰宅2》洋溢著滿滿的人情味！


  　恐怖片最重要的元素就是嚇人橋段，《厲陰宅2》這方面算是毫無失分，不管是運用音

  效嚇人、故弄玄虛的嚇人、聲東擊西式的嚇人、夢境裡走投無路式的嚇人、甚至正面對決

  的嚇人，《厲陰宅2》應有盡有，嚇人橋段十分多元，特別是從畫面衝出那一幕，有媲美

  當年《七夜怪談》貞子爬出電視那般驚悚感！


  　不過，《陰兒房》系列和《厲陰宅2》的收服惡靈方式，其實對於從小看慣港式鬼片的

  人，尤其是林正英系列，特別難以接受，因為華人的鬼片，往往強調收伏妖魔鬼怪者的道

  行，十分倚賴後天的修行，而且收伏妖魔鬼怪的過程，甚至會有拳腳相爭的畫面，但西洋

  靈媒似乎比較依賴天賦，收妖的能力是與生俱來，像是華倫夫婦的道行，明顯是婦高於夫

  ，但婦並無接受特別的修行，純粹就是歸功給上天的賜與。


  　除了在道行的設定之外，收服惡靈的方式也稍稍有可議之處，「只要知道惡靈的名字」

  ，這就是收服的條件，而收服的過程只要唸幾句口訣，就大功告成，總讓人覺得太輕易，

  而且這樣的方式，跟《西遊記》中金角大王、銀角大王的葫蘆有何不同？近來許多人討論

  電影，總愛提到「致敬哏」，看到某些蛛絲馬跡就判定是在向某某人事物致敬，該不會有

  人認為溫子仁在向《西遊記》致敬吧？還有，萬一惡靈謊報名號呢？像是孫悟空曾用行者

  孫、孫行者、者行孫的名號誆騙金角大王、銀角大王，避免被吸進葫蘆，但惡靈總是乖乖

  報上名號，也是挺奇怪的一個設定。華倫夫婦在唸幾句口訣時，總是特別大聲，應該是為

  了戲劇張力，營造出劍拔弩張的氛圍，但總讓我想起了陳平偉的名言：





  剛好最近又聽到一句名言：






  嗯！但《厲陰宅2》的設定，靈界跟人界顯然不同，大聲就會贏！這算打臉葉啟田嗎？





  對了，《厲陰宅2》片尾字幕上完後，沒彩蛋，別一直坐在椅子上乾等！





  --'
