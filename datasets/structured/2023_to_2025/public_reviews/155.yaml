url: https://www.ptt.cc/bbs/movie/M.1465515870.A.877.html
title: '[好雷] 厲陰宅2 強大的配樂和鏡頭剪接 '
content: '這部讓我特別驚訝的是恰到好處的配樂


  讓整個恐怖片沒有任何一個地方讓我覺得出戲或著突兀的部分


  當小女兒被抓到自己在屋子裡面亂丟東西製造假象的樣子後


  所有人都以為自己被裝神弄鬼的母女騙了


  以為他們只是為了要提早領到社會住宅才在那邊假裝有騷靈事件時


  大家都想放棄了 這時候那配樂真的恰到好處的響起了


  I started a joke ~~~~~~~~which started the whole world crying~~~


  太神啦 因為我真的很喜歡這首歌 雖然在近期的自殺突襲隊會用更悲的方式表現


  但恰到好處的配樂和不突兀的嚇人點 我覺得厲陰宅2更勝厲陰宅


  真的蠻好看的 劇情面我給90分 恐怖嚇人的部分也有85分 只差厲陰宅那麼一丁點恐怖


  還沒去看的人 快去體驗一下被嚇的感覺吧>W< 最後面除靈比較溫馨>>那邊真的不恐怖了



  --'
