url: https://www.ptt.cc/bbs/movie/M.1720585847.A.904.html
title: '[新聞] 《厲陰宅4》敲定上映日期！確定成主系列'
content: '《厲陰宅4》敲定上映日期！確定成主系列最終章　華倫夫婦有望轉戰小銀幕


  原文：

  曾以《厲陰宅》開創恐怖宇宙，打造多部衍生傳電影，華倫夫婦的驅魔故事也即將進入尾聲

  ，

  為這個長達10年的系列劃下句點，不過據傳華納兄弟影

  業正在開發《厲陰宅》影集，將在四部曲結束後播放。《厲陰宅4》將以IMAX規格拍攝上映

  ，並找來前作導演麥可查維斯（Michael Chavez）回歸操刀。



  2013年由恐怖大師溫子仁打造《厲陰宅》，僅花費製作成本2000萬美元，就在全球收入達到

  3.2億票房，對作品及恐怖片來說都是大賺，再隔三年推出《厲陰宅2》也獲得3.21億，奠定

  華納兄弟開啟恐怖系列電影的譜曲。雖然在第三集《厲陰宅3：是惡魔逼我的》（The Conju

  ring: The Devil Made Me Do It）導演換成麥可·查維斯（Michael Chavez）之後票房略

  為下降，不過仍是出色的恐怖電影。



  除了本傳《厲陰宅》之外，先後更有《鬼修女》和《安娜貝爾》的外傳接連推出，不管是話

  題性和票房，都帶來超過22億美元的價值。不過即便是再長的故事仍會有完結的一天，外媒

  報導《厲陰宅4》將成為主線的最後一部作品，導演麥可查維斯（Michael Chavez）繼執導2

  021年的《厲陰宅3：是惡魔逼我的》以及《鬼修女2》（The Nun II後，再次擔任導演。溫

  子仁御用編劇大衛萊斯利·強森-麥古德瑞克*David Leslie Johnson-McGoldrick(則負責擔

  任劇本創作。



  最終章《厲陰宅4：最後的儀式》將以IMAX規格拍攝和上映。溫子仁在去年1月受訪時曾表示

  ，第4集可能是該系列的完結篇。他強調：「我們非常重視《厲陰宅》的發展，因此希望花

  點時間確保一切都是對的，確保我們能夠傳達、進入並完美結束華倫夫婦的故事。我們只是

  想確保這是正確的決定，以及正在講述正確的故事。」



  另外，也有消息稱The Safran Company、華納兄弟電視公司和Atomic Monster正在開發一部

  未命名的《厲陰宅》電視劇，將在四部曲結束之後繼續電影中的故事，並在Max平台獨家播

  出。不過劇情細節尚未透露，亦未確定華倫夫婦的演員派翠克威爾森(Patrick Wilson)及維

  拉法梅加（Vera Farmiga）是否會繼續參與演出。


  新聞網址：



  --'
