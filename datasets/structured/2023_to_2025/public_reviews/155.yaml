url: https://www.ptt.cc/bbs/movie/M.1465744544.A.852.html
title: '[恐怕好雷] 厲陰宅2又再度爬上近年恐怖片前三'
content: '本人恐怖迷


  近年10部恐怖片有8個雷


  心目中第一名 厲陰宅 第二名港片 殭屍


  第三就屬 厲陰宅2


  以下

  無雷



  氣氛點 還是跟第一集一樣


  恐怖的拿捏 整場被壓迫著


  被嚇到少說有4~5次


  而且是嚇到跳一下大叫的那種（現場觀眾一起大叫


  有人問會不會沒看第一集接不起來?


  完全不會


  只是有看第一集會比較暸解夫婦他們的經歷






  只是最後一幕 艾德走去他們地下室


  看到安娜貝爾


  就讓我心酸酸的。。


  安娜貝爾 當初拍成獨立電影




  大爛雷




  -----

  Sent from JPTT on my Samsung SM-G930F.


  --

  確實第一集比較經典

  因為椅子後面還是給女孩到老死有坐'
