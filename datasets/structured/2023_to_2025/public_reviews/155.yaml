url: https://www.ptt.cc/bbs/movie/M.1419198546.A.832.html
title: '[純心得無雷] 厲陰宅'
content: '我知道不是新片

  之後電視電影台應該會常重播

  希望大家可以多多指教



  Blog圖文版會更精彩




  [劇情簡介]


  羅格與卡洛琳花了畢生積蓄買下一棟靠湖邊的獨棟舊宅，歡天喜地地和五個女兒一起搬進

  去，但是沒住幾天就發生了一連串的怪異事件，這對夫婦因此而找上艾德和羅琳華倫這對

  「捉鬼夫妻檔」，希望他們提供協助。


  「捉鬼夫妻檔」中的太太羅琳華倫具有天生的靈異體質，能夠看見鬼魂、感受惡靈。在實

  地勘查過羅格與卡洛琳住的宅邸之後，發現這棟房子確實有著極為強烈的邪惡靈體存在，

  而且還會攻擊住在房子中的人。這對夫妻基於體諒對方跟自己一樣也有女兒的同理心，而

  答應留下幫忙驅趕惡靈，還找來了另外兩位助手；然而，惡靈的全面反撲不僅僅限於這棟

  房子的住戶，甚至還將觸角伸及至「捉鬼夫妻檔」、他們的拍檔、甚至是「捉鬼夫妻檔」

  的家以及他們的獨生女……。













  終於好不容易完成韓影三連發(居然花了整整三個月，我果然非常混)，繼續來消化待寫清

  單，接下來要寫的這部電影來頭當然不小，作為一部必發的電影，早從去年上映拖到現在

  才開始認真寫，有時候不太喜歡寫這種熱門片就是這樣，寫起來要做功課，又得怕亂講話

  還是言之無物被該片支持者罵我恩災咧工啥毀，寫起來難免會感覺有點綁手綁腳。


  或許有人以為我又要唱反調了，並沒有，對於這部片子我基本上算是給予好評的，這得取

  決於你用什麼角度去看這部電影，對於溫子仁這位在短時間內竄起的鬼才導演我就不多說

  了，只能說他把鬼屋這種很難發揮的題材拍的言之有物，建構在真人真事的故事背景下，

  搭配慣有獨特的驚嚇手法，我無法斷言是否是去年恐怖片龍頭，但前三應該跑不掉，果然

  是大師一出手就知有沒有。


  寫電影前還是對劇情做點描述比較好進入狀況，電影是這樣演的喔，有一戶姓佩倫的一家

  人搬進一幢郊區的農莊，從電影封面應該不難看出來接下來這家人的遭遇，其實有時候外

  國人的文化我們東方人也蠻難理解的，有些房子看起來就特別老舊，外頭還有棵很適合上

  吊的樹，看起來很明顯就是鬼屋，不止本片，"凶兆"、"康乃狄克鬼屋事件"都是，價錢也

  沒特別便宜，還是有人會住進去，然後就出事在那邊該該叫，不過凶宅在台灣也是一些另

  類的投資客的目標，某位買下知名凶宅的買主在接受採訪時說過一句很中肯的話令我印象

  深刻，「請問台灣有被鬼殺死的命案紀錄嗎?沒有嘛!!」。


  不過這裡並沒有鼓勵大家挑戰投資凶宅，畢竟你我皆凡人，還是不要跟自己的身家安全與

  荷包過不去，回到電影，在一連串靈異現象頻傳，飽受驚嚇的佩倫一家之母終於按倷不住

  ，出外找到享譽全美的靈學夫妻檔-華倫夫婦，到家裡來一探究竟，不來還好一來就問出

  觀眾的心聲，怎麼不走?腳麻掉了怎麼走，廢話嘛真是愛說笑。


  劇情就不多說了，這部電影不用喇太多劇情應該也還蠻多可以聊的，先來說說這部片的題

  材，坦白說，當初知道這部片是部鬼屋片時，即使是溫子仁出馬，我還是抱持著非常不看

  好本片的表現能夠有多少突破，沒有別的，鬼屋片罩門就在鬼屋這題材實在是太難發揮了

  ，空間與題材上的侷限幾乎把這類電影的演出方式公式化，探險-->驚嚇-->解決，"顫慄

  黑影"與"康乃狄克鬼屋事件"就是很典型的案例，當然也不是沒有好的作品，有所變化就

  能化腐朽為神奇，"凶兆"靠著超真實的偽記錄片，把觀眾唬的一愣一愣，搭配鬼屋場景驚

  嚇指數算是近來恐怖片中破表的水準。


  當然，我不能肯定這樣溫子仁的戰略是這樣想，但我自認為這是鬼屋片可以考慮執行的新

  戰略，從以前的鬼屋為主故事為輔的型態，轉換成主題為主鬼屋為輔的特性，也就是我用

  這樣的角度看待"厲陰宅"在惡劣的環境下依然表現搶眼的主因，對我而言根本就是挾鬼屋

  之名行描寫華倫夫婦之實，電影在描寫鬼屋的恐怖與惡靈的由來，與華倫夫婦在處理靈異

  事件的獨到手法，比重上我想後者顯然多上許多。


  會認為本片看起來是鬼屋片，實則上是華倫夫婦的傳記電影，不是沒有道理的，從一開始

  的安納貝爾事件，而延伸認識真實存在的華倫靈異博物館，再到華倫夫婦對於靈異事件的

  解讀方式，華倫夫婦在解靈上有種天造地設的分工之妙，老婆有陰陽眼的靈異體質，負責

  與好兄弟溝通，老公則負責補足靈學知識，使用科學手法分析情況與善後，或多或少都有

  些溫子仁的風格存在，尤其是善於使用科學器材觸發靈異現象，在本片又有新的發揮。


  如果說我為何認為本片劇情不錯，不是因為鬼屋題材有突破，而是在描寫華倫夫婦方面很

  到位，其餘對於真實世界華倫夫婦與事蹟的延伸閱讀方面，網路已經很多大大補充的相當

  精美豐富，這邊我就不幫各位做功課了。


  我想接下來要談的，絕對也是重點，就是本片的驚嚇度如何，在我這種經過專業訓練的標

  準看來，本片的驚嚇指數真的只能算是還好，真的就還好而已，詭譎的程度並沒有發揮的

  特別出色，尤其是一開始的安娜貝爾根本就是個笑話，這麼恐怖的玩偶居然還有人敢收藏

  ，無非是找死(當然我知道現實世界的可愛許多，所以我才說電影根本就在搞笑)，一家人

  剛入住鬼屋飽受驚嚇時期，一些靈異現象如拉被子或散落的照片等，也都搔不到癢癢，或

  許可能是故意呈現當時的真實狀況，所以電影不想太多過度的加油添醋。


  雖然中後期華倫老婆一度跌進地下室的片段算是掀起一點小高潮，但我還是認為本片的驚

  嚇指數就是那老話一句，還好，真的就還好而已，喔~~~，一定有人會提醒拍拍手那段，

  是的，那段我承認確實相當有創意，可是我完全沒被嚇到，非常可惜，為什麼?因為當時

  我被電視廣告爆雷不下百次，否則我應該會被嚇到吧，所以說，再一次我們是不是該譴責

  台灣媒體，別再太那邊聰明過度了好嗎?


  對於本片的價值，我想算是對於傳奇靈學夫妻檔的適切描寫遠大於鬼屋與驚嚇，當然我相

  信一堆說被嚇到閃尿的觀眾也是不少，我想這種容忍度的問題實再是恕我無法去感同身受

  ，不過以再客觀點的角度來看，驚嚇度算是中規中矩，至少本片在這方面也算很極力呈現

  。


  最後，以這個靈異片很難存活的時代下來看，尤其是溫子仁的恐怖片將來是物以稀為貴，

  本片有內容有驚嚇，不推薦實在是說不過去阿。


  即刻短評(滿分5)


  劇情：  4        >>鬼屋題材依舊沒得發揮，華倫夫婦描寫很到位

  結局：  3        >>happy ending，"但沒康乃狄克鬼屋事件"這麼扯

  氣氛：  4        >>強烈的溫子仁風格，當然不會差到哪去

  駭人：  3.5      >>拍拍手非常有才，可惜被廣告雷，其餘普普

  推薦：  4        >>鬼屋片能這樣已經很強囉


  --





