title: '[負雷] 厲陰宅2觀後感'
content: '無雷












  我覺得這部片比起第一集...


  與其說要把它當作一部恐怖片，

  倒不如說，比較像華倫夫婦出來跟好久不見的觀眾朋友問候



  故事結構有點荒唐（鬼的部分）

  就是前因後果有點對不上來，也沒有交代清楚，也無從聯想，好像就是為了嚇你而嚇你（

  大概是我劇情片看太多，總覺得犯罪總要有個動機）



  總之，我自己在看完電影回家的路上揣摩了古阿莫的口吻，用半分鐘說完了這部電影




  然後覺得，有點滑稽...


  關於這個跨國猜燈謎的故事lol


  --'
