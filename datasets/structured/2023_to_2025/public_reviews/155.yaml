url: https://www.ptt.cc/bbs/movie/M.1468098147.A.F66.html
title: '[好雷] 厲陰宅2  還附上宅1雷'
content: '昨天跑去板橋秀泰看厲陰宅2。


  即使影城是安排小廳(7廳)，晚一點的場次也還是客滿。


  我厲陰宅1也是電影院看的，當時心中給了很好的評價。




  先簡單總結無雷心得，


  厲陰宅系列其實一直都很溫馨；


  因為真實事件改編，讓人毛骨悚然又驚嚇的劇情沒在少的。


  兩次事件中被附身的主角其實有很大的年齡跟身分差異，就不會出現上集梗；


  雖然厲陰宅2真的不會有後勁，這也不是太重要，好看就可以了 。


  畢竟一年能有一部精彩好看的鬼片就要謝天謝地了。




  以下詳細心得，




  想先回顧厲陰宅1的設定跟心得，


  劇情一開始就表明這家人很倒楣，光這點就讓人覺得不安了。


  這之後心情其實一直糾結在被附身的佩倫太太身上，


  感覺很沉重難耐，不太會形容。


  反正就是有種"怎麼惡靈偏偏要選媽媽呢?"的煩躁感。


  外加，華倫太太也陷入女兒生命被威脅的恐懼，那種不安感持續飆升。


  適切的靈騷現象會加速這家人的絕望感；


  對我來說，厲陰宅1豈止心有餘悸。


  其實，佩倫太太有成功把那些不安塞進我的心裡。




  回到厲陰宅2;



  劇本是選擇一開始就把惡靈樣子拋出來，造型真得很成功；


  會讓我聯想另一系列作品的惡靈，看第一眼就令人恐懼。


  因為事件主要是一群孩子被惡靈附身和騷擾，溫導其實大多著墨於此；


  所以，厲陰宅2比宅1花更多的時間，去描述這次被附身的主人翁Janet的遭遇。


  主人翁Janet每次被附身的劇情都很精采，伴隨大人們各自的煩惱、態度、以及


  相對應的行動來豐富故事的糾結程度。




  因為溫導有把每次靈騷所帶來的恐懼好好呈現，這確實讓厲陰宅2很好看。


  讓人無法輕易預想每次靈騷的情況跟後果，看鬼片就是希望不要有老梗的感覺。


  至於會沒後勁的理由?  我覺得可惜在最後幾幕。


  明明惡靈之前忙了很久，也放了一堆大絕，下場是輕鬆被送走；


  有點可惜那令人畏懼的造型，如果可以多掙扎幾下也好。


  畢竟是真實事件改編，也許就這樣吧。




  以上算是簡單的心得。





  最後想附帶戲院心得，無關劇情。


  因為其他鄰近戲院客滿才去了秀泰。


  主要想講音響設備的部分，因為溫導的鬼片會使用特別大聲或尖銳的音效嚇人。


  7廳是杜比7.1的效果，音效細節呈現都很明確，恐怖的音效不至於讓人困擾。


  此外，記得有一幕，外面下大雨然後Janet在看電視；


  雨聲好清晰而且兼具房屋內外的情境，有忠實呈現日常的感覺。


  我想這樣的音響環境看溫導的鬼片是及格的。


  我之前都去威秀影城看溫導的片，嚇人的音效會有點太突出。


  當然也可能是我習慣溫導的片了，也或者宅2的音效跟以往不同；


  我只有看一次，所以無法明確判斷；


  所以只能算是這次的觀影感受還不錯。


  最後還要說，秀泰的沙發椅真得夠寬敞又舒服，要是因此睡著也不奇怪。





  --'
