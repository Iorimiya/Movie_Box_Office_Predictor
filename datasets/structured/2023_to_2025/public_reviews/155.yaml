title: '[新聞] 劇本有血跡、腿瘀青 「厲陰宅3」全台將上映'
content: "劇本有血跡、腿瘀青 「厲陰宅3」全台將上映\n\n\n薇拉法蜜嘉(左)和派翠克威爾森在「厲陰宅3：是惡魔逼我的」陷入更懸疑、更陰險的謎\n團。圖／華納兄弟提供\n\
  \n2021-07-13 18:27 聯合報 記者陳建嘉／即時報導\n\n承襲溫子仁「厲陰宅」電影宇宙，正宗續集「厲陰宅3：是惡魔逼我的」即將於22日全台\n\
  上映，這一回拍片現場更是怪事頻傳，劇本側邊莫名出現血跡，演員的腿上也有瘀青，讓\n劇組所有人頭皮發麻。\n\n「厲陰宅3：是惡魔逼我的」維持一貫傳統，在正式開拍前舉行祈福儀式，祈求拍攝全程\n\
  平安順利。劇組這次找來聖尼科勒天主教堂奧列特主教主持，他是真正的驅魔師，為拍攝\n場景及製片辦公室祈福，淨化工作環境，讓所有演員和劇組人員感到安心，保持正面能量\n\
  。\n\n但奇怪的是，第一個場景的祈福儀式結束後，飾演華倫太太的薇拉法蜜嘉的劇本側邊立即\n出現血跡，雖然她本人並沒有流血。法蜜嘉本人不太喜歡談論此事，表示：「羅琳曾經說\n\
  過，如果你給惡靈機會，就是認同祂們，等於對惡靈敞開了雙臂，你所相信、執著的意念\n都會在你身邊凝聚。你得靠自己才能築起屏障，必須有顆堅強的心。」\n\n此外，法蜜嘉在拍攝期間，腿上也有出現不明的瘀青，其實瘀青在拍攝前兩部「厲陰宅」\n\
  時也曾出現類似狀況。「厲陰宅3：是惡魔逼我的」將於7月22日（週四）在台上映。\n\n\n「厲陰宅3：是惡魔逼我的」再度挑戰恐怖極限。圖／華納兄弟提供\n\n\n\
  薇拉法蜜嘉（中）在「厲陰宅3：是惡魔逼我的」拍攝時依然發生怪事。\n圖／華納兄弟提供\n\n\n薇拉法蜜嘉(左)和派翠克威爾森在「厲陰宅3：是惡魔逼我的」陷入更懸疑、更陰險的謎\n\
  團。圖／華納兄弟提供\n\n--\n、。帝釋所問經講記77頁拆穿佛法的。\n是 是菩薩成佛之道\n、、、、()、、是佛經。\n  是佛          是菩薩\n\
  \n和破十方諸佛\n\n--"
