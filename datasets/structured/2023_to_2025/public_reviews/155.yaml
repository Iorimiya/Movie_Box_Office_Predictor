title: '[情報] iTunes Store特價報 牠2 / 厲陰宅宇宙 /'
content: '【 iTunes 特價報】

  牠 第二章 / 消失的女人 / 厲陰宅宇宙


  本日 10/31 貴為萬聖節，會聯想各種鬼怪，當中少不了潘尼懷斯。隨低價官

  方主打《牠 第二章》，帶來恐怖小丑的回歸，給潔西卡雀絲、詹姆斯麥艾維

  等魯蛇俱樂部成員，返回故鄉展開昔日夢魘終結對決。


  WellGo 爆米花日再度降臨，獻上 10 部限時特價，把握在 11/1 23:59 前，

  下好手蒐藏。就《消失的女人》不光欣賞單親媽媽和保姆之間的心機戰，還能

  一睹孔曉振從中設局而問鼎大鐘、青龍影后的精湛表現。


  說起真實事件改編的驚悚電影，莫過於「厲陰宅宇宙」！趁著正傳首集、外傳

  《安娜貝爾》系列二集的優惠，試圖明白華倫夫婦和詛咒玩偶的神祕緣分，並

  透過 4K、HDR 深入感受恐懼。


  強勢取得金馬獎、香港電影金像獎多項提名的《金都》，終於上架開放租買啦

  ！藉原先得來不易的求婚給女方反悔，慢慢揭露那不願開口的秘密，帶動對於

  婚姻方面的思考。


  以上，希望大家看片愉快！


