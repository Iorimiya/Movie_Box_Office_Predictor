url: https://www.ptt.cc/bbs/movie/M.1761916460.A.76F.html
title: '[新聞]《厲陰宅》宇宙確定加拍前傳電影！編劇、'
content: '《厲陰宅》（The Conjuring）正傳系列的第四部曲


  《厲陰宅：最終聖事》（The Conjuring：Last Rites）


  雖然被宣傳為「最終章」，但這最終章的意思只限定於正傳系列，


  華納兄弟影業早在第四集開拍之前，就已經投入開發一部衍生


  影集，甚至上個月還傳出有另一部前傳電影也在籌備中。


  而昨天，知名影視記者-傑夫史奈德（Jeff Sneider）則在他的付費部落格


  《The InSneider》進一步補充，這部前傳的編導陣容就快敲定了。




  （圖片來源：華納兄弟影業）


  史奈德透露，法國新銳導演-羅德里胡育亞（Rodrigue Huart）


  正在洽談執導這部尚未定名的前傳，而《最終聖事》和《鬼修女 II》


  （The Nun II）的編劇檔 — 理查納因（Richard Naing）、伊恩高柏格（Ian Goldberg

  ）


  則確定會回歸執筆劇本。史奈德率先爆料了這項消息，目前各大外媒也已陸續證實。


  史奈德也聲稱，上個月才傳出和華納兄弟影業發生片酬談判糾紛的《厲陰宅》


  宇宙主導者-溫子仁，如今已和華納兄弟和新線影業達成新的協議，


  未來仍會繼續參與這部前傳電影、以及其它同系列相關作品的製作。




  --'
