url: https://www.ptt.cc/bbs/movie/M.1465541801.A.BA5.html
title: 'Re: [好雷] 厲陰宅2 但沒有邏輯 '
content: '個人根據現實事件猜測




  這要回朔到阿米提維爾事件，劇情是設定為

  瓦拉卡操作造成迪福ㄧ家六口死亡的慘劇，

  當羅琳進入到陰深處，迪福ㄧ家指引羅琳把

  元凶指向瓦拉卡，瓦拉卡便利用「異象」來

  警告蘿莉，再插手就會讓艾德死。

  後來教廷來通知華倫夫婦後，瓦拉卡更直接

  的來警告蘿琳，但華倫夫婦還是去了，瓦拉

  卡便指示要珍妮要說謊趕走他們。


  這些其實還滿有意思的對照：

  阿米提維爾在當時也是被高度懷疑造假，恩

  菲爾德也是相同狀況，所以劇本虛構了瓦拉卡

  巧妙的把兩件事連在ㄧ起，強化了故事性。


  然而提到為什麼珍妮要聽從趕走他們，以劇情

  來說，珍妮是在艾德唱歌時，才發覺他們沒有

  經歷過的天倫之樂，也不該害死華倫夫婦。



  每部鬼片都這樣，劇情、氣氛營造需求




  這點很巧妙的點回現實世界，恩菲爾德事件

  到現在為止還是被高度懷疑做假，有此一說

  ...珍妮曾承認他故意壓低聲音來測試來幫忙

  的人...等等的做假事件（但珍妮也說確有怪

  事發生在這間房子），所有那個橋段有點在

  說明珮姬一家是串通好的事件。




  鬧上新聞並非惡靈刻意要這麼做，而是因緣

  巧合下，珮姬聯絡到靈異研究學會才上新聞

  說到問名字，大概就戲劇效果而已，因為

  尚未進行驅魔儀式，所以這樣輕易判別出

  惡靈出處，簡單來說就大概只是讓劇情能

  順利推進。


  --'
