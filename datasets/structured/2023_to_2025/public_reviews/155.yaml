url: https://www.ptt.cc/bbs/movie/M.1465489763.A.7C2.html
title: '[普雷]  厲陰宅2     身為老粉絲有點失望 '
content: '(以下有劇透)




  溫子仁導演的恐怖片幾乎都看過了，近年的恐怖片也都第一時間去電影院看



  如果是新觀眾絕對會很喜歡，但如果是追很久的影迷應該就不會很驚艷




  1.鬼中有鬼


  出來搞怪的鬼是因為背後有一隻更邪惡的鬼在控制

  這在陰兒房3就用過這梗(非溫子仁親自導演，但是同一系列電影)

  所以大家都能猜到老人鬼背後一定有修女惡魔在



  2.驚悚嚇人元素不夠


  這集的驚悚元素真的不多，比較有印象的是小男孩的消防車那一段

  還有經典的恐怖片元素，素色壁紙的長走廊，其他就是比較老梗一點的



  這集的搞笑與溫馨橋段似乎比較多，雖然能舒緩情緒和讓角色更為立體

  但我進電影院看鬼片最主要是想被嚇一嚇，這集反而偏劇情片



  3.結尾太弱


  修女惡魔的詭計巧思讓人眼睛為之一亮，但在最後太容易被消滅

  竟然以前就自報姓名，最後理所當然講出他名字就掛了

  這實在是不符合溫子仁的恐怖片的水準啊，完全是西方驅魔片的套路


  起碼也要解釋一下這修女惡魔的來歷，和為什麼她要這樣搞這一家人

  然後去陰間跟他大戰幾回合吧






  這集好像是引用最多真實恐怖故事橋段的一次，電影的還原度也高的驚人

  不過不知道是不是因此讓這部片有所侷限



  這集整體不錯，也同樣不落鬼片俗套，就是溫子仁風格的鬼片

  但身為系列作粉絲的我就不是很滿意


  --'
