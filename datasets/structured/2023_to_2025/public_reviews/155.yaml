url: https://www.ptt.cc/bbs/movie/M.1465834555.A.8C7.html
title: '[好雷] 二刷厲陰宅2發現的一些小彩蛋，小亮點 ('
content: '有雷!!!!!!


  防一下



















  1. VALAK這個名字頻繁地出現在Warren他們家裡面，首先是在Lorrain起床後看到Ed在畫


  VALAK時，Lorrain看了心裡一驚，走去一旁的飯廳沏了一杯茶。在飯廳裡面這場戲一共有


  兩個視角，一個是對著Lorrain的，另一個是對著Ed(坐下來後)。對著Lorrain的視角，注


  意看Lorrain右邊的那面牆，有貼著ALAK四個字母。咦? 那V呢? V藏在A這個字母左上角的


  LO"V"E裡面，"V"這個字母比LOE都還要大一點，字體也不一樣。


  而在Ed這個視角裡，Ed的左後方是一扇窗戶，窗櫺上就大喇喇擺著VALAK五個字母的擺設


  很容易被看到的


  (這場戲是在Valak這個惡魔跑去Warran家裡鬧之前，不過我個人覺得不是Valak跑去他們


  家，而是Lorrain的預知夢夢到了Valak, 正巧夢的場景是在他們家)



  2. 另外一場戲有出現Valak這個名字，是在Lorrain的女兒(她好正!!)在串珠珠時，注意


  看她串的珠珠字母是什麼吧! 就是VALAK!!


  同一場戲，母女後面的書櫃上面就擺著VALAK這五個字母的擺飾，雖然沒有擺成一直線，


  但還是看得出來導演想要案是這個。


  3. VALAK在Warran家與Lorrain玩躲貓貓的時候，角落有一幅畫，擺在畫架上面的那幅畫就


  是厲陰宅1的那棟房子，甚至更準確一點，根本就是厲陰宅1的電影海報







  以上，你有發現嗎?


  --'
