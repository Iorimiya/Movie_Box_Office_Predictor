url: https://www.ptt.cc/bbs/movie/M.1465670088.A.9FF.html
title: '[好雷] 厲陰宅2 端午洋片霸主'
content: '端午檔期最好的洋片


  也可說是溫子仁恐怖回歸大作


  陰兒房1後 他真的沉寂很久


  驚嚇度電爆 和他有關係的 厲陰宅1 陰兒房2.3 安娜貝爾


  我一直覺得 陰兒房1的精華 就是鬼要在白天挑釁出現 然後造型要機掰


  這兩點厲陰宅2都有做到 自然很多人被嚇爆


  而且 就驚嚇以外的其他元素


  厲陰宅2所要傳達的正面信仰.演員.音樂.故事性 都相當突出


  最後的情緒釋放甚至很感人 完整的讓我嚇到


  你也可以說是溫子仁顛峰之作


  依照以往經驗 今年最棒恐怖電影 不是"女巫"就是這部了


  --'
