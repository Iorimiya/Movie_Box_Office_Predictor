url: https://www.ptt.cc/bbs/movie/M.1465691223.A.430.html
title: '[新聞] 溫子仁透露他可能無法回歸執導《厲陰宅3'
content: '新聞網址：


  溫子仁透露他可能無法回歸執導《厲陰宅3》


  由溫子仁執導的《厲陰宅2》（The Conjuring 2）目前已經在世界各地上映，目前在指標

  電影網站 IMDb 以及電影評論網站爛番茄皆獲得了不輸首集平價的成績，證明了自己在結

  束高成本大製作的《玩命關頭7》（Furious 7）後也能繼續維持自己在小片上的水準，而

  厲陰宅的電影故事也漸漸的發展成為一個系列世界觀（包括了安娜貝爾系列）。至於最關

  鍵的問題 — 溫子仁本人究竟會不會繼續回來《厲陰宅3》擔任導演工作，是觀眾最關心

  的，畢竟先前回歸也是搖擺了不少時間，對此溫子仁在接受 EW 訪問時做出了回應：


  「另一部厲陰宅嗎？天啊，我喜歡這個世界觀，我也喜歡派翠克和薇拉，同時我和新線影

  業以及華納兄弟影業關係也都很棒，因此我相信繼續回來這個團隊絕對不會是一件壞事，

  我不會拒絕任何事情，但同時你也無法在現在保證任何事情，畢竟接下來的幾年我會蠻忙

  碌的，所以誰知道呢？也許他們願意等我回來繼續拍攝另外一部。」


  確實，如果新線以及華納兄弟要等待的話，可能真的要有一點時間了，溫子仁接下來要馬

  上進入《水行俠》（Aquaman）的拍攝，之後傳言動畫影集《太空堡壘》（Robotech）也

  將交給他執導，不過會不會繼續以「一大片一小片」的頻率回來華倫夫婦的世界，也許我

  們可以對此有所期待。（資料來源：The Playlist / EW）



  --'
