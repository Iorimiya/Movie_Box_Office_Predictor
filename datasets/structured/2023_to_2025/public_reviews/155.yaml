title: '[好雷] 閃光放好放滿的厲陰宅3'
content: '其實本應該要給普雷

  但身為一個不愛(敢)看恐怖片的人來說

  三集我都敢看了

  就給好雷吧XDDDD


  這集 我真的很認真覺得

  一點都不恐怖 氣氛雖然恐怖啦

  但比起第一集 就差了很多

  你甚至可以把他當偵探片or愛情片(咦～

  就這樣….


  雖然我已經不記得前兩集在演什麼了

  但當年第一集衝著溫子仁的名聲

  去看了第一集

  記憶中 真的蠻好看的

  回來在搭配媽佛版的衣櫃文章(忘了叫啥)

  更讚(離題了www)


  第三集 我一直以為是說狼人的案件耶

  殊不知是 被惡魔附身的殺人事件

  真相只有一個及為了不辜負爺爺的名譽

  於是華倫夫婦出動了(大誤

  這部根本就是偵探片

  華倫夫婦變身成為偵探去找下詛咒的人

  故事真的有點平淡

  好像也沒啥爆點？


  唯一讓我驚訝的是

  年輕的華倫先生

  好像當年演鐵達尼號的Jack李奧納多

  這集 根本就是在說明他們兩夫妻有多麼恩愛這樣

  雖然從第二集開始好像就這樣了XD

  一起看的朋友因為沒看過厲陰宅

  看完出來後還說

  我一直好害怕華倫會死喔

  我朋友唯一害怕的只有

  那一群的老鼠XDDD


  ps 剛開始看的時候還在想

  恐怖片坐梅花座也感覺壓力好大

  會不會突然旁邊多了一個人之類的XDDD


  --'
