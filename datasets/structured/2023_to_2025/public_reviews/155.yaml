url: https://www.ptt.cc/bbs/movie/M.1465568603.A.FE3.html
title: '[好雷]厲陰宅2:讓我的手離不開嘴巴 '
content: '厲陰宅2讓我的手離不開嘴巴


  為什麼?因為實在是太刺激了!我怕我不小心叫出來怎麼辦?(恩...感覺我這樣做

  好像謎片女主角喔)


  本作恐怖程度跟第一集難分軒輊,且不落俗套沒甚麼老梗,壓迫感極強,

  使我邊被嚇邊希望夜晚的場景趕快結束,結果靠!!連白天也不容放鬆戒心,

  當然有些段落也有和緩的時候,但已經被嚇到神經緊繃了,觀影結束後,

  看別的觀眾席有掉落爆米花四散,推測應該是觀影時不斷被嚇到的關係吧!


  回到家後我一個人在家,聽到客廳傳來「卡」一聲,以為是剪指甲的聲音,

  頓時心裡毛毛的,於是鼓起勇氣往外查看,原來是家裡的立扇在轉動時

  不是會發出一聲「卡」的聲音嗎?感覺後遺症已達到草木皆鬼的程度,

  呼!剛突然想到家裡也有聲光消防車,以及平常下班後都要去地下室牽機車,嗯......


  因為厲陰宅才知道溫子仁導演,而飾演華倫夫婦的演員分別是派翠克·威爾森和

  薇拉·法蜜嘉,這是之前看「守護者」和「型男飛行日誌」就知道了,這兩位

  我都很喜歡,而薇拉·法蜜嘉她舉手投足有個韻味我超愛,誠心希望日後有機會能

  看到他們繼續共演華倫夫婦,另外就算沒看過第一集的也可以去看喔!因為沒有

  什麼接不上的問題,請放心被嚇吧!


  其實也聯想到人要是常抱負面想法,磁場就會是負面的,自然就會吸引到壞的東西進來,

  不管是鬼或是所謂的壞運氣,就如片中講的,惡靈總是會給你補一刀,本片也是

  提醒隨時保持積極正面的想法,才不會讓事態往更糟的狀況發展,

  正所謂一個人其實就能改變一切不是嗎?


