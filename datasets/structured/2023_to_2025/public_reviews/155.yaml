title: '[新聞] 「厲陰宅3：是惡魔逼我的」美國首日票房奪冠'
content: "「厲陰宅3：是惡魔逼我的」美國首日票房奪冠\n\n\n「厲陰宅3：是惡魔逼我的」美國上映首日就拿下票房冠軍。圖／摘自imdb\n\n2021-06-06\
  \ 20:05  聯合報 記者蘇詠智／即時報導\n\n美國電影票房景氣正在復甦，繼上周末「時尚惡女：庫伊拉」開出不錯首映票房、「噤界\nII」更賣出超級大紅盤之後，本周末另一部續集大片「厲陰宅3：是惡魔逼我的」登場，\n\
  與上周冠軍「噤界II」上演驚悚恐怖片的大對決，結果「厲陰宅3」新鮮感獲勝，首日就\n擠下「噤界II」登上第一名的寶座，但「噤界II」全美票房將破9000萬美元，會成為新冠\n\
  肺炎疫情期間在美國第一部賣破億元大關的強片，派拉蒙火速宣布，「噤界」系列第3部\n電影，2023年上映。\n\n「厲陰宅3：是惡魔逼我的」雖然前兩集導演溫子仁轉任監製，由「哭泣的女人」導演麥\n\
  可查維斯接手執導，情節仍以華倫夫婦對抗怪力亂神為主，這次碰到惡靈騷擾，兩人差點\n被弄到心臟病發或是意外身亡，驅魔場面刺激程度更有「大法師」的味道。能夠將「噤界\n\
  II」從冠軍王位上拉下來，證明「厲陰宅」系列的死忠觀眾威力不容小覷，這兩部恐怖驚\n悚大片原本5月底、6月上旬就會在台上映，由於新冠肺炎疫情難以控制，全台戲院繼續停\n\
  止營業，檔期都往後延，還不知何時能正式推出。\n\n至於沒有登上全美票房冠軍但反應也算不錯的「時尚惡女：庫伊拉」，傳迪士尼也有意乘\n勝追擊，已經研擬由原班編導再拍續集，雖然女主角艾瑪史東是否回歸尚未確定，由於她\n\
  是整齣戲的靈魂，續集很難沒有她，觀眾應有厚望繼續看到她使壞。\n\n而「噤界」系列新片據稱並非前兩集的續篇，比較像是番外篇，因此不算是正式的第3集\n，可是故事內容仍來自前兩集編導約翰卡拉辛斯基的發想，將交由「愛侶」導演傑夫尼可\n\
  斯改編、執導。\n\n\n「厲陰宅3：是惡魔逼我的」小男孩被惡靈附身後肢體扭曲，模樣駭人。圖／摘自imdb\n\n\n「時尚惡女：庫伊拉」傳有可能再拍續集。圖／摘自imdb\n\
  \n--\n、。帝釋所問經講記77頁拆穿佛法的。\n是 是菩薩成佛之道\n、、、、()、、是佛經。\n  是佛          是菩薩\n\n和破十方諸佛\n\
  \n--"
