url: https://www.ptt.cc/bbs/movie/M.1497951840.A.6A9.html
title: '[新聞] 《厲陰宅2》中的歪頭人即將推出獨立外傳'
content: '新聞網址：



  《厲陰宅》的世界持續擴大！《厲陰宅2》裡的反派角色之一「歪頭人」（The Crooked

  Man）將推出獨立外傳電影，劇本由新銳編劇麥克范維斯（Mike Van Waes）執筆，而《厲

  陰宅2》導演溫子仁則會擔任本片監製。


  這將會是2013年以來第四部《厲陰宅》系列的外傳電影，其餘三部分別是《安娜貝爾》、

  《安娜貝爾：造孽》和《鬼修女》。《安娜貝爾：造孽》將於今年8月11日上映、《鬼修

  女》則預計於2018年7月13日公開。


  《厲陰宅2》故事發生在1977年，描述美國超自然現象研究者華倫夫婦到英國倫敦為哈吉

  森一家驅魔的故事。一二集的全球票房合計高達6.38億美元（約192.9億台幣）。


  此外，新線影業也在今年初宣布要拍攝從《綠野仙蹤》世界觀發展出來的恐怖片，同樣由

  麥克范維斯擔任編劇。



  ------------


  若由溫親自導演比較有品質保證~


  --'
