url: https://www.ptt.cc/bbs/movie/M.1666440212.A.7D0.html
title: '[新聞] 華倫夫婦再出驅魔任務！《厲陰宅 4》 '
content: '華倫夫婦再出驅魔任務！《厲陰宅 4》確定啟動、溫子仁御用編劇回歸操刀



  「恐怖天王」溫子仁導演催生的《厲陰宅》（The Conjuring）電影宇宙，今日宣佈將推

  出全新作品。《好萊塢記者報》（THR）獨家報導，主線系列的《厲陰宅》確定將繼續製

  作第四集，負責撰寫二、三集的大衛萊斯利強森麥高卓瑞克（David Leslie

  Johnson-McGoldrick，下圖）會繼續為劇本操刀，與溫子仁合作關係緊密的他，同時也是

  《水行俠》（Aquaman）、以及排定明年上映的《水行俠之失落王國》（Aquaman and

  the Lost Kingdom）的編劇。




  去年暑假檔上映的《厲陰宅 3：是惡魔逼我的》（The Conjuring：The Devil Made Me

  Do It）是由《哭泣的女人》（The Curse of La Llorona）導演-麥可查維斯（Michael

  Chaves）接手溫子仁執導，但目前《厲陰宅 4》尚未公佈導筒會是交到誰的手上。


  《厲陰宅》一、二集各別在全球地區斬獲了超過三億美元的票房，上集《厲陰宅 3：是惡

  魔逼我的》雖改為串流、院線同步發行，但票房依舊累積超過兩億美元，這成績甚至還勝

  過成本更高、但同樣是串流同步的《自殺突擊隊：集結》（The Suicide Squad）和《神

  力女超人 1984》（Wonder Woman 1984），足見《厲陰宅》宇宙的吸金力有多麼強勁。




  --'
