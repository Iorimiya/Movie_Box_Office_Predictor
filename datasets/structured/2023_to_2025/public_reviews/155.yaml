title: '[ 微雷] 厲陰宅2之兒歌 有個歪歪的人'
content: '今天剛欣賞完 還是溫導的恐怖片對味


  我對片中的兒歌印象深刻

  「有個歪歪的人」

  （Crooked man）


  所以在網路上查了資料，以下：




  There was a crooked man,

  有個性格扭曲的男人

  and he walked a crooked mile,

  走在一條長一裡的扭曲的路上

  He found a crooked sixpence

  手裡那著扭曲的六便士

  against a crooked stile;

  踏在扭曲的臺階上


  He bought a crooked cat,

  他買了一隻扭曲的貓

  which caught a crooked mouse,

  貓捉了一隻扭曲的老鼠

  And they all lived together in a little crooked house.

  他們一起住在扭曲的小房子裡


  備註： 出自《God Child vol.1》-《The Little Crooked House》 :

  因為扭曲的愛成為了扭曲的人，然後住在了一棟扭曲的房子裡。因為不想要失去，所以殺

  了她，做成人偶。扭曲的心靈，扭曲的孩子。童謠和漫畫的意境真是配合的好啊！

  經常被用在電影等當中，Mother Goose中的一首。因為是童謠，為了求押韻而玩了不少文

  字遊戲，所以很多文字是無意義的。


  ----------------------------------------


  但片中這兒歌有被惡魔改編

  內容我忘記了……

  有鄉民大大可以解惑一下嗎？！


  希望能有中英文歌詞

  若還有影片或音樂更好


  拜託了～謝謝～


  --'
