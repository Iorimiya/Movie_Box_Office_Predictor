title: '[新聞] 比厲陰宅外傳更可怕！2018年必看的恐怖片'
content: '新聞網址：



  By JUKSY編輯部


  驚悚、恐怖電影今年非常火紅，像是《逃出絕命鎮》、《安娜貝爾：造孽》、《牠》

  等，不只有話題性，票房成績也都很亮眼，而好消息是，喜歡看恐怖片的影迷們大概

  會越來越興奮，因為小編整理了在 2018 年有 7 部恐怖片，保證會讓你嚇得不敢一

  個人睡覺！快往下看有哪些電影要納入明年的口袋名單中：


  1. 預計在明年 1 月 5 日上映，由溫子仁監製，故事

  將以靈媒 Elise 正面對決自己老家的惡靈為主軸。


  2. 跟第一部電影相隔近 10 年，預計

  在 3 月 9 日上映，某夜晚 3 個戴面具的殺人魔登門拜訪靜謐郊區的一個家庭，逼

  他們做出超越極限的事...


  3.目前預定在美國國慶日（7 月 4 日）上映，會著重在講述一切

  的開端，揭露「國定殺戮日」是怎麼開始的，像是整個系列的前傳。


  4.預計在明年 7 月 13 日上映，是《厲陰宅 2》的外傳電影，

  故事講述一個前往羅馬的神父，調查與修女死亡有關的神祕事件。


  5.是一部結合科幻、動作跟恐怖元素的電影，是「終極戰士系列」的第

  4 部，預計在 8 月 3 日上映。


  6.預計在 8 月 10 日上映，改編自 1997 年同名恐怖小說，

  由傑森史塔森(Jason Statham)、李冰冰、露比蘿斯(Ruby Rose，限制級戰警3)主演

  ，而電影裡面的恐怖角色就是鯊魚的上古始祖，如深海暴龍的恐怖存在。（怎麼感覺

  跟前 3 部比起來，鯊魚比較和藹可親）


  7.系列電影將推出第 11 部（第一部已經是 1978 年

  的了）！預定在 10 月 19 日上映，一樣由潔美李寇蒂斯(Jamie Lee Curtis)主演，

  這次她將面對自己的弟弟。


  看到這 7 部電影，小編立刻把他們列入「地獄級口袋名單」，畢竟本人其實很膽小

  的，還只敢在大白天整理這篇（但還是為了廣大的恐怖電影迷們壯烈犧牲啊）


  ------------------------------------------------------------------------------


  心得︰

  1.《鬼修女》的女主角是泰莎法蜜嘉，厲陰宅系列的影迷應該會有似曾相識的感覺，

  因為厲陰宅本傳二部曲的女主角正是泰莎年齡差超過20年的姊姊薇拉法蜜嘉


  2.《深海巨鯊》的成本據報高達1.5億美金，不曉得北美成績會如何？


  3.《月光光心慌慌》續集由環球影業與知名驚悚恐怖片製作公司Blum House

  共同買進，環球的台灣分公司不曉得會不會趁勢引進？


  --'
