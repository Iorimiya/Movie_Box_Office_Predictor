url: https://www.ptt.cc/bbs/movie/M.1487604118.A.3E5.html
title: '[新聞] 厲陰宅番外電影《惡靈修女》將在2018上映'
content: '新聞網址：



  文/Jean


  《陰兒房》（Insidious）導演溫子仁(James Wan)在 2013 年帶來了驚悚電影《厲陰

  宅》（The Conjuring），其受好評的程度更讓其中的洋娃娃發展出了獨立電影《安

  娜貝爾》（Annabelle），當然《厲陰宅》本身極具發揮的潛力，也在 2016 年推出

  了續集，而現在《厲陰宅2》當中的「惡靈修女」也將有自己的個人電影。


  《惡靈修女》（暫譯，The Nun）選定由《聖魔》（The Hallow）導演柯林哈迪（

  Corin Hardy）執導，並由《安娜貝爾》編劇蓋瑞道柏曼（GAry Dauberman）與溫子

  仁一同執筆劇本，目前尚未曝光劇情內容或演出卡司，而在《厲陰宅2》中飾演惡靈

  修女的是曾演出《穆荷蘭大道》（Mulholland Drive）的波妮亞倫斯（Bonnie

  Aarons）。


  《厲陰宅》系列除了擁有優秀口碑外，票房表現也相當不俗，首集以 2000 萬美元製

  作預算在全球開出 3.18 億美元票房，續集追加預算至 4000 萬美元開出 3.2 億美

  元票房。《安娜貝爾》雖然評價不如《厲陰宅》來得響亮，但僅以 650 萬美元成本

  就在全球開出 2.5 億美元票房，投資報酬率可說是更上一層樓，續集也將在今年跟

  觀眾見面。


  而《惡靈修女》目前則排定在 2018 年 7 月 13 日上映。


  ------------------------------------------------------------------------------


  參考外電:Variety

  ‘Conjuring 2’ Spinoff ‘The Nun’ Set for July 2018



  心得︰希望《惡靈修女》的品質能穩定點啊！不要發生安娜貝爾被挑剔的窘況


  --'
