url: https://www.ptt.cc/bbs/movie/M.1465656753.A.556.html
title: '[微好雷]厲陰宅2之導演對不起...'
content: '今天終於去看傳說中的厲陰宅2

  沒有看過第一集

  就來看第二集

  很怕會看不懂

  結果其實還好

  重點是


  真的很精彩啊啊啊啊!!!


  不會為嚇人而嚇人

  用了一些亞洲電影的元素

  而且電影每一幕的劇情節奏都有下很大的功夫

  有溫馨

  有懸疑

  有恐懼

  讓一部厲陰宅2不只是單單為嚇人的恐怖片而已


  印象最深刻的一慕大概就是

  艾德發現整件事情不是單單一個小女孩惡作劇或是地縛靈作祟這麼簡單時

  抽絲剝繭找到整件事情的真相

  又聯合羅琳一起回到恩菲爾德解決整件事情

  可以看出兩夫妻的羈絆

  真的讓人感動


  看來該找個時間看看厲陰宅1了


  對了...標題寫道要跟導演道歉...

  也要跟高雄環球影城的觀影的各位道歉...


  在某一幕修女鬼出現在華倫家

  並引導羅琳到房間裡時

  原本應該是要很恐怖的

  結果看到修女鬼我不禁大喊了一聲...










































  此幹聲又長又大聲貫穿整個電影廳...

  毀了原本很可怕的一幕 Q口Q

  導演對不起啊啊啊啊啊


  --








  --'
