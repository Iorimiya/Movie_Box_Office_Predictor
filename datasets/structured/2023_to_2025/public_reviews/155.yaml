title: '[  絕好雷] 厲陰宅'
content: '防雷頁

















































  這部片真的是從我非學生後最讚的鬼片，


  幾乎沒什麼鬼片能嚇到我的我，


  這部片有讓我震了一、兩次，最後真相大白時更讓我發涼。


  上一次讓我這樣已經要追溯到鬼影與咒怨2了。


  不得不說溫大人真的很懂觀眾的心理層面，


  大家都是知道隨時會跑出來嚇人，


  所以心裡都會做準備，


  但有有一兩次會在放鬆的瞬間讓妳震驚，


  我真的有被 This is my house 心臟跳了瞞大一下，


  但我最佩服劇情的鋪陳，


  我看到後來真的也竟認爲只是他們母女倆的伎倆，


  我也認爲女角都沒感應，看來真的是假的，


  一度以爲要爛尾，


  而且他們離開時，真的有讓人覺得電影準備結束。（我竟忘了都說是真實恐怖事件這事）


  最後的真相大白也因為這樣的心理層面，真相出來時我的背竟是整個發涼，


  老天啊 ，鬼靈也要玩心機的。。。


  很喜歡這樣的鋪陳逆轉，


  也讓我對這戲大大加分，


  已經想在二刷了，


  建議喜愛恐怖片的一定要去看喔。







  另外，這部戲大蓋只有一場面，只有我們會笑，


  就是一開始姐妹在玩碟仙


  正當一直沒反應時，


  那時一開始全場超安靜，


  想說準備怎樣


  結果出現開門聲。。。












  然後有倆個晚到的走近電影場，


  然后我們大家就笑了，


  他們應該不知道我們笑什麼。。。。




  --'
