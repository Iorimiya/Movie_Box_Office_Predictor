url: https://www.ptt.cc/bbs/movie/M.1466587354.A.4C9.html
title: 'Re: [好雷]  厲陰宅2 還好有趕上大螢幕'
content: "防雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n--\n\n\n\n    教廷不是自私\n\n被允許能除靈的神父  其實真的很少\n\
  \n\n大概就類似魔法師要白袍以上才能除靈  而且很多電影  像是\"大法師\" \"除靈\"\n\n等都有詳細除靈過程  不止神父  還要檢察官 見證人等到場\n\
  \n而且  該家庭要經過洗禮 是教會一份子 不然隨便被非信徒詆毀是很傷的\n\n一但除靈失敗  首當其衝的不只神父  還有後續的法庭審判(有這樣電影喔)\n\n\
  審案超過3年  雖然最後神父判刑但不用關.....但是當中還發生不少事\n\n\n   況且  電影開頭也明示了  那時世界對當時最大惡靈房子被說是造假\n\n\
  鬧上電視節目  所以對除靈這事更為緊張\n\n所以  前前後後像華倫夫婦接案才會像這樣  教會先委託專業人士\n\n去收集科學+靈視2方面證據  確認真有其事才會出動\n\
  \n\n    而劇情中更慘的是  雖然怪事連連  但是沒有靈視  拍照和攝影證據不足\n\n全都無法勸說教會出來  華倫夫婦雖想幫忙  但是他們只有3天\n\n\
  他們也說了  就算他們不離開  也會被教會叫回去\n\n\n\n  不說西方了  在台灣也一樣  鬧鬼後也是先請師傅到現場看一看\n\n確認真的有了才會進一步做法事\
  \  不會一開始就真的除靈\n\n\n\n--\n\n\n\n\n\n--"
