url: https://www.ptt.cc/bbs/movie/M.1757998833.A.D79.html
title: 'Re: [好雷] 厲陰宅-最終聖事，看個溫馨感'
content: '剛剛看完

  完全同意溫馨感+1


  也許是系列粉的溫馨

  但我是過了頭

  看到最後居然眼眶泛淚@@

  （其實一開場就有點感動）


  明明是恐怖片

  明明四個人包場應該更有氣氛

  卻被溫馨感滿滿擁抱

  但不失一部及格的厲陰宅系列


  假如是系列粉

  我想分數起碼有80分起跳


  故事算是做一個終結

  前後呼應

  許多第一集的演員都有現身

  尤其是Mackenzie Christine Foy


  好久沒看到她的作品了

  還這麼年輕

  依舊仙氣飄飄

  但坦白講

  她出現在畫面裡

  像是不同世界的人


  沒辦法她實在太美太仙了



  回來故事本身

  其實蠻簡單的劇情

  主要交代女兒從出生就開始糾纏的惡魔

  到這一刻做個了解


  沒有什麼嚇人的畫面

  氣氛營造中規中矩

  把親情描述的更細微

  也巧妙的把蘿琳一生的特殊感應

  不再只有鬼叫「艾德」

  而是正視它、面對它

  如同茱蒂最後那句話


  「你不在那裡！」（這裡不爭氣的泛淚）


  最後蘿琳敘述她的預知未來有被感動到

  但我卻莫名想到暮光之城

  大概是因為Mackenzie Christine Foy吧


  系列粉必看的一集

  大概如此


  --'
