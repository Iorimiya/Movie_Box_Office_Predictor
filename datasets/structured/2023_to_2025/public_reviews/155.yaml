url: https://www.ptt.cc/bbs/movie/M.1545889079.A.958.html
title: '[新聞] 「厲陰宅宇宙」太強大！《半夜鬼上床》暫'
content: "「厲陰宅宇宙」太強大！　《半夜鬼上床》重啟暫時卡關\n\n\n 《半夜鬼上床》（A Nightmare on Elm Street）3年前傳出要重啟，至今卻沒有下文，原\n\
  \n以為就這樣不了了之，沒想到現在New Line Cinema承認此計畫仍在進行中，敬請恐怖片\n\n迷們好好期待。\n\n\n該系列電影推出多部續作和相關電影，首部於1984年上映，由Wesley\
  \ Craven執導編劇，\n\n創下亮眼成績，佛萊迪成為民眾心目中最經典的恐怖電影角色之一，但最近一部2010年的\n\n《半夜鬼上床：夢殺》，評價卻不高。\n\
  \n\n《水行俠》編劇David Leslie Johnson近來向《GameSpot》透露，「重啟版仍然在準備中\n\n，但是目前沒有什麼太突破的進展，《厲陰宅》宇宙還是New\
  \ Line Cinema影業的恐怖片\n\n首選，我想大家都想再次看到佛萊迪，所以在某種程度上，我想那是無可避免的。」\n\n\n這幾年低成本恐怖片創造高票房，因此重啟版的《半夜鬼上床》讓大家相當期待，雖然《\n\
  \n鬼關燈》、《安娜貝爾：造孽》導演David F. Sandberg在2017年透露有意執導本片，\n\nDavid Leslie Johnson也早傳出會參與製作，但一直以來都沒有新進度，如今David\n\
  \nLeslie Johnson跳出來承諾會開拍，大家也只能耐心等候。\n\n\n\n                                    \
  \                   記者許瑞麟／綜合報導\n\n\n\n--"
