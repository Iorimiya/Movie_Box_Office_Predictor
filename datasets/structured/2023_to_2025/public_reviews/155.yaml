title: '[好雷]訓練握力的好選擇-厲陰宅2 '
content: "先提醒看文的大家，我不熟悉發文排版，我不會算行數不會算跳頁。\n有劇透恐懼症的朋友拜託就別看了。\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n(禮貌性的多按幾次enter 跳行表現誠意，還要接著看，被劇透了可別罵我)\n\n通常我只去電影院看爽片的，恐怖片這種東西在家看就好了，因為:\n\
  1.情境比較重要，聲光效果要求不高。\n2.在電影院莫名就會比較壓抑，真的被嚇到也不敢叫\n  在家起碼可以幹幹叫的抒發一下情緒\n可是太座大人就是喜歡看這種東西....\n\
  然後看完手就跟被夾棍處刑過一樣...\n[沒辦法，總得抒發一下，不能叫只好握緊一點了...]\n\n厲陰宅2與第一集確無\"直接\"因果關係\n因此舊雨新知在觀賞厲陰宅2上相對輕鬆許多\n\
  為了\"厲陰宅\"這名號而接著看的老客人，\n在幾個鏡頭中或可憶起第1集的些許回憶(比例真的不高...)\n未接觸過的新朋友們相信有一定比例會回過頭去體驗一下\n\
  [如人飲水，冷暖自知，眼下暫且不表]\n\n先說說個人心得(以下有點點劇透，有劇透恐懼症的朋友請快離開)\n這一集的氣氛營造依舊是釣人胃口\n跟荒唐鏡說的一樣\"\
  我跳進來啦!我又跳出去啦!我又跳進來啦!打我啊笨蛋!\"\n幾個段落其實觀眾大概猜得出來\"好囉好囉，這邊該被嚇一下囉\"\n如同情侶交往一般，表面不落痕跡但心裡已是高張等待的狀態(差不多該...了吧)\n\
  偏偏我們溫導就老經驗的勾呀勾的你心癢癢的\n例如遙控器不見那段，你八成就猜到等等會出現在奇怪的地方，\n    偏偏...(好想講!!!可我怕被水桶)\n例如玩具消防火車那一段，你八成就猜到那車子不會乖乖進棚保養\n\
  \    偏偏鏡頭就這麼...(好想講!!!可我怕被水桶)\n    然後還真的就這樣結束了...\n\n第一集是建立在\"交待安納貝爾的故事併帶出華倫夫婦之史實(?)\"\
  上\n印象覺得第一集\"拍手\"那邊當年被嚇到，現今現在都忘了\n個人覺得厲陰宅2在劇情上相對中規中矩的許多\n(珍妮跟華倫太太在盪鞦韆講話那邊我還睡著了一下...)\n\
  此系列號稱華倫夫婦真人真事改編\n依本人湊完熱鬧一頭霧水再上網探個究竟的習慣\n(建議關鍵字用 恩菲爾德 比較可以找到始末。不然真的都是厲陰宅2..XD)\n\
  找到的跟電影演的果然是大同小異(廢話)\n\n不過發現在blog\"強森講鬼\"(被PTT擋聯結，請自行搜索)中有一段是這麼說的\n\"兩位朋友一走進屋內就感到一股非常強大的壓迫感，\n\
  \ 他倆通過了一些簡單的儀式，與之溝通，約15分鐘後，\n 他們就跟莫里斯說沒有問題了，比爾不會再干擾或是侵犯佩吉的家庭或是珍妮本人。\n 據聞，那天珍妮足足睡了14個小時才醒來，\n\
  \ 這是她這兩年以來第一次在半夜不會被中途『吵醒』。\"\n\n15分鐘??!!那電影院裡演的是??\n花惹發.......\n\n然後那個XX男，不覺得很像羊男裡的迷宮的羊男嗎??\n\
  (XX男也是鵝媽媽系列的歌欸，可以自己google一下)\n不得不提的是口哨吹的歌\n剎那間以為是桂河大橋(被PTT擋聯結，請自行搜索)[怎麼想的啊我...??]\n\
  結果竟是你我都熟悉(?)的綠油精?!(被PTT擋聯結，請自行搜索)\n本來還想會不會是溫導在台灣待過才有此橋段(外行人想的，勿戰)\n殊不知原曲是老歌 this\
  \ old man (youtube都是卡通歌居多，煩請自行蒐尋_)\n[果然是\"不經一片，不長一智\"啊!]\n\n--"
