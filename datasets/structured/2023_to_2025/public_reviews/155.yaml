title: '[普雷]《厲陰宅3：是惡魔逼我的》，別讓沉迷事 '
content: '部落格版：


  自2016年的《厲陰宅2》後，睽違了近5年時間總算是等到了《厲陰宅3：是惡魔逼我的》

  ，雖然中間陸續有同樣是「厲陰宅宇宙」的《安娜貝爾：造孽》、《鬼修女》、《安娜貝

  爾回家囉》與《哭泣的女人》，不過說實在話我還是最期待本傳故事。本來該在去年就上

  映的《厲陰宅3：是惡魔逼我的》因為疫情關係被延至今年，是整個「厲陰宅宇宙」中第

  八部、亦是第三次以華倫夫婦為故事主角的電影。不同於前兩集是由系列開創者導演溫子

  仁親自執導，本集則改由《哭泣的女人》導演麥可查維斯接下這重任，導演溫子仁則負責

  監製與故事發想，而早在電影開發階段時另一位監製彼得沙佛朗就已證實《厲陰宅3：是

  惡魔逼我的》雖同樣改編自華倫夫婦經手過的案子，卻不再是觀眾熟悉的「鬼屋」題材電

  影。或許是因為這個原因，加上導演換人，所以《厲陰宅3：是惡魔逼我的》於整體上來

  說，內容上的呈現跳脫過去前兩集的手法，不完全以驅魔、對抗惡魔為主，帶點推理劇的

  懸疑風格揉合詛咒元素，都使觀眾得以看見《厲陰宅》系列的新風貌，不過這樣的轉換可

  能會使習慣導演溫子仁的觀眾來說，會是一次不適應造成的乏味體驗。


  《厲陰宅3：是惡魔逼我的》以1980年至1981年發生的「Trial of Arne Cheyenne

  Johnson」事件（或名為「Devil Made Me Do It case」）為改編，在上網查找過相關資

  料後，不難發現電影為了劇情上的娛樂性考量進行了大幅度的改編，在真實的這起事件裡

  並沒有出現如電影裡提到的撒旦崇拜者、邪教公羊門徒（Disciples of the Ram）的詛咒

  ，而是切切實實的惡魔附身。在1980年時，格拉策爾一家人來打掃一棟剛獲得的出租房，

  當時年僅11歲的大衛格拉策爾聲稱在房子裡遇到了一位老人，不只警告大衛若是全家人搬

  進來將會傷害他們，更以擁有羊蹄、羊角的人型野獸形象形容這位老人。原來並不相信大

  衛所說的話的格拉策爾夫婦，在見到許多無法解釋的行為與現象後，開始相信這間房子並

  不乾淨，於是他們尋求了華倫夫婦協助，而在多次的驅魔儀式裡華倫夫婦赫然發現大衛遭

  到多達43個惡魔附身，只好逐一的替其進行驅魔，大衛姐姐黛比的男友厄尼不忍心看到這

  麼小的孩子受苦，用言語煽動了惡魔、告訴祂們若要附身就找他，後來據目擊者表示當時

  真有看到一隻惡魔從大衛身上轉移至了厄尼身上。詭異的是，驅魔過程中一度呼吸中止的

  大衛飄浮在空中，告訴華倫夫婦厄尼強森將會犯下謀殺案...


  不久後，黛比與厄尼決定搬出去外面同居，黛比在住處附近的養狗場找到了工作，受雇於

  亞倫布魯諾在這裡擔任狗狗美容師，以為已經沒事的黛比開始察覺厄尼的不對勁，她發現

  他有了像似大衛的奇怪行為，會不自覺陷入恍惚狀態，會咆哮、會看見幻覺，可清醒後卻

  毫無記憶，這讓她擔心厄尼同樣遭到附身。後來憾事還是發生，在1981年2月16日，厄尼

  強森因為身體不舒服向公司請假，和他的姐姐汪達與黛比的表妹瑪麗一起到養狗場找黛比

  ，亞倫布魯諾邀請眾人一起到當地的酒吧吃午餐、喝酒聊天，當他們回到養狗場後，黛比

  帶著汪達和瑪麗去買披薩，不過她隱約覺得會有危險，所以很快的就買完回來養狗場，可

  這時的亞倫布魯諾已經因喝醉變得情緒激動，她將眾人趕出房間，惟這時亞倫布魯諾卻抓

  住了瑪麗不放，厄尼上前要求對方放開瑪麗，於是兩人發生了爭執，不論黛比或是汪達都

  無法阻止婉如野獸般發狂的厄尼，他拿出小刀反復刺向亞倫布魯諾，最終造成對方失血過

  多死亡，而厄尼則在離養狗場約3公里處被發現，這起事件成了康乃狄克州布魯克菲爾德

  鎮歷史上的首起謀殺案。


  在厄尼遭到逮捕後的第二天，華倫夫婦告訴警方厄尼是無辜的，他是在被惡魔附身的情況

  下犯下罪行，為了證明此事為惡魔主導，華倫夫婦開始四處奔走，他們更說服了厄尼的辯

  護律師Minnella相信這一切都與惡魔有關，Minnella還親自前往英國，去與過去負責兩宗

  類似案件的律師會面。接著在1981年10月28日，Minnella在法庭上提出「遭惡魔附身」試

  圖進行無罪辯護，但主審法官認為這辯護難以被證明，不僅是缺乏證據也毫無科學依據，

  無奈之下Minnella選擇暗示厄尼的行為是出於自衛。最後在陪審團經過三天又15個小時的

  審議後，在1981年11月24日被以一級誤殺罪定罪，判處10至20年的監禁，然後來厄尼只服

  了5年刑期。



  《厲陰宅3：是惡魔逼我的》選擇讓惡魔附身不單純的就是惡魔附身，而是與邪教公羊門

  徒成員的撒旦獻祭有關，這樣的決定讓超自然與推理結合搭配，兩種不同的懸疑感組合是

  種《厲陰宅》系列過去所沒有的全新感受，也正因為這樣子所以本集雖然還是在看華倫夫

  婦的調查與驅魔，不過卻是不同方面的調查與驅魔。在《厲陰宅》與《厲陰宅2》裡，華

  倫夫婦得要面對的都是未知的力量，而在《厲陰宅3：是惡魔逼我的》這集卻是要去尋找

  造成一切、也就是詛咒源頭，他們交手對象不再是得依附他人或物品才能現形的惡靈、惡

  魔，而是擁有不輸給超強感應能力的羅琳華倫的邪教教徒艾拉。不走驅魔改走破除詛咒這

  條路線，讓我想到前陣子剛看完的《恐懼大街》系列三部曲，所以我覺得可惜的地方是，

  《厲陰宅3：是惡魔逼我的》相較之下粗糙許多，沒有足夠時間讓劇情架構完整，過多其

  實不算是必要的畫面壓縮到了重點篇幅，觀眾跟著華倫夫婦追著線索跑，卻得到艾拉「沒

  有任何原因」的詛咒理由，順著其論點來看是合理但某方面來說接受度不高，沒有符合新

  風格帶給人的期待。


  「你怕她看不到東西？」


  「不，我還真害怕她看到什麼。」


  過去兩集較少提到的華倫夫婦感情部分，在《厲陰宅3：是惡魔逼我的》有了更多的著墨

  。以過去回憶的方式簡短介紹了兩人相識的過程，同時亦替後續劇情做一些鋪陳，而在調

  查過程中不時透露著的擔憂裡所藏著對彼此的愛，同樣是替近尾聲的一次發展做了合理化

  安排，更替電影難得增加了情感上的厚度。除此之外，儘管有點無法接受用「沒有任何原

  因」來當作一切事端的解釋，不過電影換了個角度來看所謂的「事出必有因」，當羅琳華

  倫順著線索回到了長年研究公羊門徒的凱納斯神父家中，他坦白羅琳在感應中所看見的女

  人就是他的女兒艾拉，本以為凱納斯神父是共犯，可從他和羅琳的談話間他僅是知情，之

  所以無法阻止艾拉是因為她是他的女兒，他理所當然的知道詛咒失敗會反噬，為了保護她

  他當然沒辦法講出實情，再來，他認為艾拉會變成這樣都是他害的，都是因為他的研究使

  她得知並受其吸引，他對羅琳說的「別讓沉迷事物禍延子孫」是歉疚，也是對同道中人的

  提醒與警告。



  可能是因為本集重心並沒有想放在驅魔、而是華倫夫婦如偵探般的調查過程，所以《厲陰

  宅3：是惡魔逼我的》沒有太多的恐怖橋段，連嚇人設計都差強人意，幾乎沒有任何會讓

  觀眾離開戲院會記住的點，勉強還能說是不錯的，大概就是大衛還有厄尼兩人像《大法師

  》裡的小女孩折來折去的部分吧。另外，兩次出現的殯儀館屍體既不可怕還很滑稽，沒有

  《厲陰宅》裡的安娜貝爾，或者是《厲陰宅2》的鬼修女、扭曲人那樣成為主線裡的一個

  亮點，而同樣都是惡魔，在《厲陰宅3：是惡魔逼我的》裡沒有如《厲陰宅2》的「瓦拉克

  」有名字也有明確形象，相反的，觀眾並不知道艾拉召喚了什麼，難得都把原來事件裡的

  43個惡魔精華成1個，卻可惜沒有給祂更多一點的戲份，只讓艾拉單打獨鬥少了許多預期

  可能會有的可看性。



  《厲陰宅3：是惡魔逼我的》過於著重在氣氛上的堆疊，導致劇情部分被顯得鬆散、不緊

  湊，被拉長的過程稀釋掉了恐懼感，而首次嘗試的推理式風格，是給了電影新的觀影樂趣

  ，可惜就是稍嫌劇情單薄了點。薇拉法蜜嘉和派屈克威爾森兩個人表現一如既往的沉穩、

  很有角色魅力，不過飾演艾拉這個角色的美國演員尤金妮邦德蘭特反而更吸引我注意，她

  將這個正常又不正常的角色詮釋的很有感覺，從頭至尾都毫無反應的表現透露著陰森、全

  身散發著詭譎氣息，雖然做為魔王角色但戲份不多，但已足夠讓人記住她了。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
