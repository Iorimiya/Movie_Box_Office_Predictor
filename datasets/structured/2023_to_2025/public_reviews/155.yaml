url: https://www.ptt.cc/bbs/movie/M.1629958703.A.C33.html
title: '[新聞] 《厲陰宅3》敲碗想來台灣拍！《泰德拉索'
content: '新聞網址：


  記者李承家／綜合報導


  恐怖咖請進，《厲陰宅3：是惡魔逼我的》重磅歸來！「華倫夫婦」夫妻檔首度出走鬼屋

  抓鬼，演員群聽台灣這習俗喊「超想來拍」！爛番茄滿分的Apple TV+原創影集《泰德拉

  索：錯棚教練趣事多》，自帶綜藝感的演員群全是綜藝咖。入圍金馬7項大獎的《手捲煙

  》導演陳健朗，熟悉的港式江湖片名來源竟「超歪樓」？


  「厲陰宅3：是惡魔逼我的」已於22日（週四）在台上映，作為系列作第三部曲，《厲陰

  宅3》的風格明顯與前兩部作品不同，「厲陰宅」團隊也從華倫夫婦檔案中挖掘出這個震

  驚全美的「是惡魔逼我的」謀殺案件，做為本次的故事線主軸。「星光好選喆」獨家的專

  訪也訪問到一系列的「厲陰宅」主角們，不僅有擔綱了八年「華倫夫婦」的螢幕夫妻檔派

  翠克威爾森、薇拉法蜜嘉，還有新血盧瑞歐康納、莎拉胡克，與導演麥可查維斯。


  今天（23日）火熱上線的Apple TV+原創影集《泰德拉索：錯棚教練趣事多》，影集還未

  開播就已在爛番茄開下滿分期待的超高分數。年初才拿下金球獎喜劇類影集最佳男主角的

  傑森蘇戴西斯，飾演一位對足球一竅不通的橄欖球教練，卻能用他正能量，成功帶領英超

  聯盟球隊。本週節目「星光好選喆」獨家訪問到《泰德拉索》的布雷特戈德斯坦、朱諾坦

  普、托希布希莫、克里斯托佛南戴茲，難得在線上齊聚的四人，意外釣出下了戲的他們都

  是隱藏版綜藝咖！


  去年大獲金馬獎7項提名的港片《手捲煙》，由香港影帝林家棟零片酬演出、新銳導演陳

  健朗自編自導，將香港社會中被遺忘的邊緣人在奮力求生的故事，描繪得殘酷生猛卻又不

  失江湖情義，林家棟也以片中一場長達四分鐘的一鏡到底的打鬥戲帶出高潮，導演陳健朗

  接受主持人簡立喆的專訪時，則表示那場戲「超痛苦」，在預算與時間有限的情況下，特

  技效果還險釀人禍。導演陳健朗也透露將片名取名為《手捲煙》的緣故，意外理由也令人

  超歪樓！


  不只韓綜有，立馬體驗台版「帶輪子的家」！超夢幻福斯商旅T6.1 California Ocean露

  營車，車頂帳篷不僅有電動升降、全功能流理台、冰箱、水槽及雙爐烹飪瓦斯爐，車艙內

  也以高級類木質地板，與內建行車安全輔助系統，縮短露營建置流程，本週就讓主持人簡

  立喆帶著你一起來一場「說走就走的旅行」！




  --'
