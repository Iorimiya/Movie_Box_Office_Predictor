url: https://www.ptt.cc/bbs/movie/M.1757145886.A.B5A.html
title: '[新聞] 《厲陰宅》迎最終章 溫子仁認有點感傷'
content: '《厲陰宅》迎最終章 溫子仁認有點感傷


  04:10 2025/09/06 中國時報 杜欣穎



  薇拉法蜜嘉（左）與派翠克威爾森主演的《厲陰宅》系列電影如今迎來最終章。（華納兄

  弟提供）



  溫子仁稱《厲陰宅》是他電影生涯中最美好的回憶。（路透）


  由「鬼王」溫子仁打造的經典恐怖電影系列《厲陰宅》，最終章《厲陰宅：最終聖事》4

  日在台上映，本片溫子仁、彼得薩弗蘭再次擔任製片，並由麥可查維斯執導。《厲陰宅》

  這10多年來取得巨大的成功，對於本系列電影即將落幕，溫子仁坦言「有點感傷」，他感

  性地說：「對我來說，這基本上代表著一個時代的終結，那多少有些苦樂參半，不過我覺

  得我們結束的正是時候。」


  溫子仁開創的《厲陰宅》宇宙，票房累積超過20億美元，溫子仁分享，自從第一部《厲陰

  宅》電影上映以來，確實成長了很多，十多年過去，他發生了很大的變化，「我永遠會回

  顧那部電影，它或許是我電影生涯中最美好的回憶。」對於《厲陰宅》成為許多人不可或

  缺的一部分，他欣慰地表示：「當我最終離開這個世界時，這些電影將會像其他電影那樣

  永垂不朽。」


  談到超自然現象，溫子仁坦言自己相信超自然現象，「我盡量以極大的尊重對待與之相關

  的一切事物。我認為你不應該對任何事物不敬。」反而是彼得薩弗蘭，他直言原本自己是

  懷疑論者，但在拍攝過程中，與許多相關人員接觸後，包含佩倫一家、哈吉森一家，再到

  最終章的史慕爾一家，以及角色原型羅琳華倫，才讓他感受到這些事情是真實存在。


  能夠打造出如此經典的恐怖電影，溫子仁強調，這些嚇人的元素很難有精確定位，「對我

  來說，沒有公式可以告訴你如何捕捉『那個』瞬間。 當我來到片場時，我會抽出一些時

  間在片場走一走、感受一下，並在腦海中演練這些場景。在片場走動的過程中，演練想像

  這些場景。如果那真的讓我感到一陣寒意，那麼我就知道我找到了特別的東西。」



  新聞網址：



  --'
