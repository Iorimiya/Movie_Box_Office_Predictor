title: '[新聞] 女觀眾看《厲陰宅》突淒厲慘叫 狀況駭人'
content: '新聞網址：


  女觀眾看《厲陰宅》突淒厲慘叫 狀況駭人電影院急開燈暫停


  2021/06/18 21:24


  〔即時新聞／綜合報導〕印尼1間電影院近日放映《厲陰宅3：是惡魔逼我的》，觀眾席1

  名女子在電影播放到一半突然放聲淒厲慘叫，情況宛若「被附身」，駭人狀況讓電影院不

  得不暫停放映緊急處理。


  根據《雅加達時報》報導，勿加泗市（Bekasi）的電影院放映《厲陰宅3：是惡魔逼我的

  》，竟有女觀眾在電影播放到一半時放聲淒厲慘叫，目擊者透過社群媒體表示，「事實上

  我老早就聽見了那位觀眾的慘叫聲，但我不確定她是不是被附身了」，而她周圍的觀眾漸

  漸察覺她並不是發出一般看電影會有的叫聲。


  目擊者表示，女子引發前排、後排的觀眾一陣騷動，幾分鐘之後影廳的燈打開了，電影也

  暫停播映，工作人員發現女子狀況有異後將她請出影廳，但不曉得女子後續的狀況究竟如

  何。


  據悉，《厲陰宅》前兩集電影分別在2013年和2016年上映，電影包括各種魔鬼附身與驅魔

  場景，最新續集《厲陰宅3：是惡魔逼我的》目前正在全國多家影院上映。


  ☆民俗說法僅供參考☆




  --'
