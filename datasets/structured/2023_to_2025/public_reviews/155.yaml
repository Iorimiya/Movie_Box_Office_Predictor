url: https://www.ptt.cc/bbs/movie/M.1632587824.A.759.html
title: '[新聞] 2年前被買下！《厲陰宅》鬼屋要賣了'
content: "2年前被買下！《厲陰宅》鬼屋要賣了　價格翻3倍「3330萬出售」\n\n\n\n▲《厲陰宅》鬼屋將要出售。（圖／翻攝自Realtor）\n\n\
  圖文／CTWANT\n\n 「恐怖大師」溫子仁執導的電影《厲陰宅》上映至今8年，仍時常被提起和討論，內容是\n根據真實故事改編而成，事件發生的鬼屋「1677 Round\
  \ Top Road」位於羅德島州博樂維\n爾，在2019年被超自然愛好者以不到44萬美元（約1220萬新台幣）的價格買下，沒想到房\n子將再次出售，而售價更提高到3倍，變成120萬美元（約3330萬新台幣）。\n\
  \n根據《NBC》報導，美國最著名的鬼屋「1677Round Top Road」建於1736年，故事要回溯\n到17世紀被女巫審判處決的伊絲泰（Mary Towne\
  \ Eastey），後人謝爾曼（BathshebaSher\nman）曾在19世紀居住，在電影中謝爾曼便被描繪為惡鬼。\n\n作家佩倫（Andrea Perron）自1970年開始住在那棟房子裡，寫了《黑暗之家，光明之家\n\
  》三部曲，講述家人在房子裡的靈異經歷，還有超自然現象研究人員艾德與洛林夫婦（Ed\n and Lorraine Warren）對房子的調查內容，成為《厲陰宅》電影的故事基礎。\n\
  \n佩倫在得知自己兒時的住宅要被出售，坦言一直夢想有一天能把房子買回來，「如果我有\n錢，我會買回來好好保護」，不過她也表示完全不想住在那裡。\n\n該房子的現任擁有者海岑（Jenn\
  \ Heinzen）指出，房子已經被遊客和旅行團預訂到2022年\n，她和老公認為，這棟房子被菲利普國王戰爭（KingPhilip's War）的鬼魂所困擾，事情\n\
  發生在1675至1678年，美洲原住民與新英格蘭英國移民之間的的血腥殘酷戰爭，不過她表\n示在家裡沒有感覺到靈體有「惡意」。\n\n海岑的老公則認為，被汙名化的是土地，而不是房子本身。\n\
  \n新聞網址：\n\n--"
