title: '[新聞] 鬼修女2厲陰宅3導演 回歸操刀厲陰宅4'
content: '《鬼修女 2》《厲陰宅 3》導演回歸操刀《厲陰宅 4》！確定將是「主線系列」最終章




  （圖片來源：華納兄弟影業）


  《厲陰宅》（The Conjuring）宇宙的主線系列第四部曲《厲陰宅：最後的儀式》（The C

  onjuring：Last Rites）今天首次曝光了潛在的導演人選：執導過上一集《厲陰宅 3：是

  惡魔逼我的》（The Conjuring：The Devil Made Me Do It）的麥可查維斯（Michael Ch

  aves，下圖）已在洽談回歸繼續掌舵。


  外媒《好萊塢記者報》（THR）稍早獨家披露了這件消息。




  （圖片來源：Pinterest）


  查維斯是《厲陰宅》宇宙的常駐成員之一，他不僅執導過《是惡魔逼我的》，也拍過《鬼

  修女 2》（The Nun II）、《哭泣的女人》（The Curse of La Llorona）這兩部外傳作

  品。


  負責執筆《最後的儀式》劇本的編劇，也是此宇宙的另一常駐成員，寫過《厲陰宅》第二

  、第三集的大衛萊斯利強森麥高卓瑞克（David Leslie Johnson-McGoldrick）先前也早

  就確認會繼續留守第四集。


  目前還不知道《最後的儀式》會是改編華倫夫婦經手的哪一件案子，僅知這集確定會是「

  主線系列」的最終章，並預計今夏正式開拍。


  文：Joker


  新聞來源： The Hollywood Reporter


  新聞網址：




  --

  蛤'
