url: https://www.ptt.cc/bbs/movie/M.1760258863.A.B4B.html
title: '[新聞] 《厲陰宅：最終聖事》全球票房衝破4.6億'
content: '《厲陰宅：最終聖事》全球票房衝破4.6億 華納傳籌備前傳與影集


  2025年10月12日 週日 下午12:12


  [FTNN新聞網]記者黃鈺晴／綜合報導


  台灣大哥大MyVideo的10月片單強勢來襲，搶先上架多部重磅作品。其中，上映後持續席

  捲全球影壇的《厲陰宅：最終聖事》，目前累積票房高達4.6億美金（約台幣140億），正

  式超越雷利史考特執導的《神鬼戰士II》，挺進全球影史最賣座電影前300名，成為《厲

  陰宅》系列最成功的篇章之一。



  《厲陰宅：最終聖事》是由麥可查維斯（Michael Chaves）執導、派屈克威爾森（

  Patrick Wilson）與薇拉法蜜嘉（Vera Farmiga）主演的最終章，以愛為信仰、以親情為

  核心，為「厲陰宅宇宙」劃下溫柔卻強韌的句點。



  雖然該片為主系列的最終章，但據傳華納兄弟已開始規劃全新「前傳電影」與傳聞中的「

  影集」企劃，希望延續「厲陰宅宇宙」的龐大神話。據美國媒體《Puck News》報導，幕

  後團隊目前正就未來製作方向進行協調，但卻一度傳出監製温子仁就分紅細節與參與比例

  談不攏，恐被剔除。




  對此，片場人士強調，溫子仁依舊是整個系列的核心創意靈魂，他不僅親自現身拍攝現場

  ，也持續參與劇本、故事神話設定與驚嚇場景的設計。消息人士也直言：「《厲陰宅》能

  成為全球最具代表性的恐怖電影系列之一，溫子仁的影響力無庸置疑。」






  --'
