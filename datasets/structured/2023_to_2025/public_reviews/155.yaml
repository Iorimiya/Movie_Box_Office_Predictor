url: https://www.ptt.cc/bbs/movie/M.1465383282.A.FE4.html
title: '[  雷] ［好雷］ 厲陰宅2'
content: '今天厲陰宅2上映


  我剛好又是個恐怖片迷


  因此翹了中會 去看電影（汗


  以下有雷














































  劇情描寫得很好


  一些攝影的技巧都很高超


  而且不會說有那種不恐怖而且覺得好笑的地方


  （例如非死不可


  然後珍妮這個角色真的很厲害


  一方面演一個12歲的正常小女孩


  一方面又要演被附身而展露的邪惡恐怖惡靈


  （雖然最後知道是一個修道服的惡靈在後面作祟


  最後就是嚇人的點～


  有差點跳起來的幾幕，令人印象深刻



  （例如惡靈的影子走到畫後面，然後衝向羅琳


  不過我想還是沒辦法勝過第一集拍手捉迷藏的經典啊～


  總的來說


  是一部很有水準的鬼片


  絕對不是狗尾續貂


  第二集也結合了恐怖、冒險、親情的羈絆


  讓人出了電影院，還想一再的回味～


  推薦大家趕快去看吧～～～～


  --

  這集敘述親情比第一集多，雖然氣氛還是很有，只是會比較多喘息的時間'
