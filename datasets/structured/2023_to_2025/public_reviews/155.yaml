url: https://www.ptt.cc/bbs/movie/M.1466133412.A.26F.html
title: '[影評] 厲陰宅惡靈入侵，繃緊神經創巔峰。'
content: '影評來源:


  卡優新聞網電影影評


  連結:


  作者 柿子 報導 2016/6/16


  內文:


  老天保佑！溫子仁這位「神」般的導演再度親自執導，拍出這部《厲陰宅2》，柿子實在

  無法想像這系列電影，若由別人執導演筒會有多慘烈。溫子仁對恐怖氣氛的掌握程度，已

  經到了如火純青的地步，厲陰宅系列就是要溫子仁式的氛圍才對味，傳統卻又勾人心弦的

  配樂、處處皆有鬼的緊張感、充滿邏輯的劇情…，柿子不誇張，可以生活在有溫子仁的時

  代，實在太幸福了！


  　　《厲陰宅2》由真實事件改編，導演幾乎100%複製所有場景，故事不囉嗦直接進重點

  ，更進一步設計出數個讓人眼睛為之一亮的靈異事件，讓恐懼從四面八方襲擊觀眾，加上

  故事劇情前後呼應，觀眾在驚懼之餘，還能體會劇本的巧思，最後滿足地離開影廳，說是

  端午連假期間最精采的電影，一點也不為過。


  　　《厲陰宅2》改編自「恩菲爾德鬼屋」真實事件，描述1977年間，英國恩菲爾德小鎮

  的房子中，單親媽媽佩姬與4名子女共同遭遇怪事的故事。由於靈異事件實在太頻繁，目

  擊者人數日益增加，就連英國廣播公司BBC都錄到女兒珍妮的口中，居然出現老人比爾的

  聲音，因此請來遠在美國的華倫夫婦前往調查，卻也被惡靈耍得團團轉。


  柿子必須再重申一次，靈異片不是只有「嚇人」，「劇情」才是最關鍵的本體，因為要嚇

  人非常容易，突如其來的大聲響、出乎意料的鬼臉，就能把觀眾嚇得哇哇叫，但靈異片最

  重要的是要「說服」觀眾，說明事情為什麼會如此，理解劇中人為何這麼做，並且要有使

  人信服的結尾，這才是柿子認定的「好鬼片」。


  　　在《厲陰宅2》中，導演清楚地把恩菲爾德事件與阿米提維爾鬼屋事件做了完美的連

  結，透過華倫太太的預知，不著聲色地包裝住整部電影；住在恩菲爾德鬼屋中的一家人，

  也處理地近乎完美，開演沒多久就進入重點完全不囉嗦。劇中人物的行為完全符合一般人

  的邏輯，但恐怖事件依然一而再、再而三地襲擊，小帳棚、鈴鐺、音樂盒、通靈盤…等小

  物件，全部都沒有白白出現，惡靈獵食人們脆弱心靈的設定，更是相當符合邏輯，讓觀眾

  一下子就沉浸在其中。


  　　重點是，真實的恩菲爾德事件本來就存在著非常大的爭議，導演雖然大改了故事緣由

  ，卻保留了「造假」的元素，以致於觀眾一邊害怕惡靈出沒，一邊擔心佩姬一家人的安危

  ，卻還提著「該不會是造假」的一顆心，姑且不論惡靈出現的方式充滿創意，光是這3件

  事情，就讓觀眾在整部電影中維持著緊繃狀態。



  厲害的是劇中惡靈的出現方式，柿子只能說太有創意了，就等著讀者進戲院體驗！惡靈控

  制著惡靈、創造出惡靈，一大堆惡靈用各種意想不到的方式現身，而且還不是出現一下子

  就消失，只要一出現，就像是喝珍珠奶茶時的一口氣吸起「連環砲」的珍珠，即便能正視

  惡靈的臉，還是會被嚇到在椅子上扭來扭去，從骨子裡毛起來。


  　　雖然故事最後仍然不脫家人愛與信任撐過一切的情節，走向毫無意外的結局，但這也

  是觀眾最希望看到的結尾，尤其是導演設定結巴的小兒子、被誤會抽菸但跟母親解釋誤會

  的女兒、全家人被父親拋棄而陷入經濟困境…等悲慘狀況，更讓觀眾能投入其中，打從心

  裡關心這一家人，讓靈異事件變得更可怕，最後讓觀眾感到溫暖。


  　　整體來說，柿子給《厲陰宅2》象徵「強力推薦」的4.5顆柿子，雖然不知道是否真得

  有這些惡靈，但「歪頭人」真得把柿子給嚇呆了，就如同首集出現了「安納貝爾」一樣，

  歪頭人唱著「歪歪的腦袋、歪歪的身體、歪歪的地獄」歌…，老天爺呀！怎麼會有一個這

  麼有魅力又這麼可怕的鬼，光是回想，柿子就不敢關燈睡覺了。


  酸柿子點評：溫子仁實在很邪惡，在草木皆「鬼」的時候，偏偏加入了溫馨的橋段，劇中

  人充滿溫暖地唱歌，柿子心裡簡直警戒到爆表，這就跟煮紅豆湯一定要加點鹽巴才會甜一

  樣，在這種電影中突然溫馨起來，卻讓電影更恐怖啊！


  影評等級：(0顆柿子~5顆柿子)


  0顆柿子：影史奇觀；0.5顆柿子：不值一提；1顆柿子：絕對傻眼

  1.5顆柿子：眉頭深鎖；2顆柿子：一陣尷尬；2.5顆柿子：尚未成熟

  3顆柿子：可有可無；3.5顆柿子：瑕不掩瑜；4顆柿子：不看可惜

  4.5顆柿子：強力推薦；5顆柿子：影壇經典


  --'
