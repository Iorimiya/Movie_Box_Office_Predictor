url: https://www.ptt.cc/bbs/movie/M.1627200623.A.A50.html
title: '[普雷] 厲陰宅3 是惡魔逼我的 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  網誌圖文版




  臉書專頁








  除了已經在今年跨足串流市場，更進一步地擴張成「漫威影視宇宙」之外，第二成功的所


  所謂「電影宇宙」是誰呢？




  是同樣來自超級英雄漫畫的「DC擴展世界」？還是借將日本的「怪獸宇宙」？




  我個人會說是「厲陰宅宇宙」。




  雖然除了《厲陰宅》兩集本傳之外，其他的系列電影都不能說是非常優秀的作品。但它們


  也擁有相當成功的一些特點，包括多元的地區和時間點、各種令人印象深刻的惡魔、培養


  新人編導練功的溫床等等，加上小成本但尚稱穩定的產出，逐步建構出以西方宗教觀為主


  的獨特「魔神」世界觀。




  一手打造多樣恐怖品牌的大導演溫子仁已經是好萊塢炙手可熱的名導了。在忙碌的工作之


  中，他將手上最招牌的《厲陰宅》本傳，交給了《哭泣的女人》新銳導演來接手發揮，最


  新的一集改編了堪稱「厲陰宅世界」中的超級英雄華倫夫婦所經手協助的一樁「殺人案件


  」，格局也略跳脫開了前兩集以「鬼屋」為主的敘事方式。




  雖然惡魔這種存在好像本來就跟會和土地房屋物件綁在一起的那種神靈不太一樣，但總之


  ，華倫夫婦這次不會只在一棟房子裡面和惡魔鬥法，而更像是《X檔案》中的穆德與史卡


  莉探員一般，展現過人的行動力，到處查案。劇中甚至也隱約出現了組織嚴密的反派團體


  當伏筆，甚至還懂得直接針對華倫夫婦下手，讓人搞不清楚究竟是野性但單純的惡魔可怕


  ，還是充滿混沌惡意的邪惡人類恐怖。而對於受害人所經歷的痛苦，也更像是「心理驚悚


  」而不是純粹的惡魔附體，也讓人更能對劇中受害者激起憐憫之心。




  探案和推理元素的加入，當然對《厲陰宅》系列來說是新鮮的。作為《X檔案》的死忠老


  粉，看到這其中若隱若現的風格，當然更加感到興奮有趣。當然最後還是不乏《厲陰宅》


  系列保留人性光輝的溫馨面，這次更加著重在華倫夫婦的感情面，他們倆互相理解扶持的


  愛情自然也成為了擊破邪惡的關鍵。而由這兩位討喜的優秀演員所扮演的華倫夫婦，不論


  是感情戲還是查案戲，都還是擁有一定的品質，也是這系列不至於淪為一般廉價恐怖片的


  一貫優點。




  好話講完了，差不多該開始進入抱怨的階段了。




  或許真的還是功力有上下之別，《厲陰宅3：是惡魔逼我的》所改編的真實事件基礎其實


  是很好發揮的，但卻不知道為什麼完全沒有將那份潛力挖掘出來。本該很有張力的法庭戲


  草草帶過，或許是因為法庭戲難寫，但超自然與法律這兩種極端的碰撞其實也是原事件中


  相當重要的一環，也連帶讓殺人案件本身到後來也像是不再重要一樣。而真實事件資料中


  那絕望的惡魔數量、毛骨悚然的物件，也都沒有出現在電影之中，取而代之的是所謂「公


  羊教徒」之類的邪惡教派詛咒，而這詛咒也真的是好用，只要把一個手工打造的精緻法器


  送過去，外加在自家祭壇念咒施法，就可以遠距離召喚惡魔附身到敵人的身上去了，效果


  拔群。這樣的變動，好處是拓展了一點惡魔以外的反派可能性，但壞就壞在反派角色的塑


  造並不突出、法術設定淺薄、動機更是薄弱。作為全劇的真相爆點，也是徒有推理探案的


  一些「風格」，但卻沒有相對應的精緻劇情與之搭配。




  在感情戲和敘事節奏上，也是沒能將過往強項發揮得更好，幾段戲的經營程度還差了那麼


  一點，不及過去一氣呵成的順暢以及有如雲霄飛車一般的酣暢體驗。




  基於對《厲陰宅》角色的喜歡，他們的表演和冒險依然會是個人之後持續支持的重點項目


  。雖然不像漫威處處留後續的伏筆，但這次新增的邪惡教派和「小心禍延子孫」的警告，


  或許也是之後可以發展的方向。不過在浪費了這次的好題材之後，未來的經營恐怕得再多


  花點心思把過去的品質找回來了。





  --

  段譽一見之下，身上冷了半截，眼圈一紅，險些便要流下淚來，心道：「人道習主席是人

  中龍鳳，果然名不虛傳。馬先生對他如此傾慕，也真難怪。唉，我一生一世，命中是注定

  要受苦受難了。」他心下自怨自艾，自歎自傷，不願抬頭去看馬先生的神色，但終於忍不

  住又偷偷瞧了他一眼。只見他容光煥發，似乎全身都要笑了出來，自當選以來，從未見過

  他如此歡喜。兩人已走近身來，但馬先生對段譽視而不見，竟沒向他招呼。段譽又道：「

  馬先生心中從來沒有我這個人在，從前就算騙我投票給他，心中也只有他主子。」


  --'
