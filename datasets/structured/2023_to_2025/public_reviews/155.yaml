url: https://www.ptt.cc/bbs/movie/M.1465536100.A.736.html
title: '[好雷] 厲陰宅2 但沒有邏輯'
content: "這次主打平常覺得該嚇人的地方沒有嚇\n卻在意料的地方嚇你\n好雷是 作為一個嚇人的鬼片 這片完全做到了\n\n\n但以下是我對劇情的疑問\n1.為什麼鬼修女要先去華倫一家?\n\
  \  明明都讓老人鬼魂出來當替死鬼了 還要主動去騷擾華倫一家\n  這樣有比較好玩嘛? 然後還要威脅小女孩說 不把他們趕跑就殺光全家\n  小女孩也很笨 趕跑了就不會殺你們全家嗎?\n\
  \n2.劇中的小孩都很像金魚 一秒就忘記之前發生過的事情了\n  明明就被嚇過 確認可能有鬧鬼了 卻在半夜醒來的時候都不找同伴一起行動\n  然後再被嚇一次\n\
  \n3.最後一次自導自演鬼上身 到底是怎樣瞬間移動到廚房的呢?\n  如果沒有被附身 這才是最靈異的地方...\n\n4.真的有策略要削弱並殺死一家人的話\n\
  \  最有效率的應該是只讓一個人見到鬼 讓他虛弱之後操控他殺掉全家\n  而不是鬧到上新聞...\n\n以上結論 我認為只是鬼修女想跟華倫一家玩遊戲而已 不然完全說不通\n\
  問你你還要老實告訴她妳的名字 以便你被驅逐?\n\n--\n鬼修女都把自己隱藏起來了...還要跑過去警告他們幹嘛...詭異的是這點吧?\n我說的隱藏的意思代表是\
  \ 鬼修女把老人鬼推出來演戲\n然後屏蔽華倫太太的靈感 讓他覺得這棟房子沒問題\n我跟你不能再有更多同感了\n其實我不太懂鬼的意圖就是了...感覺很亂\n真的不是警告嗎\
  \ 那為何第一次鬼修女的形象是由老公畫出來的\n所以老公也有同樣的天賦的意思?\n這就是我覺得奇怪的點了 你要除去一個人 不用預告他的死法吧\n明明有很多機會可以讓對方死掉\
  \ 但還是要偽裝成自殺...\n然後一定要照夢中的死法去死 就是我覺得最奇怪的點了\n這樣感覺起來不是要除掉丈夫 而是一直在\"警告\"\n警告他們不要插手"
