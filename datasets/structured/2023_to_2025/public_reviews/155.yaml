url: https://www.ptt.cc/bbs/movie/M.1465403671.A.EEF.html
title: '[普雷]厲陰宅2'
content: '之前看過厲陰宅1 整部覺得很有感 加上之前去看美國隊長3前面的預告


  有看到厲陰宅2的預告片 整個覺得好像夠嚇人 就決定這部上映一定要來看


  =============================以下有雷========================================



























  雖然看過厲陰宅1 但說真的幾乎都忘記1在演啥了XD 只對在地窖捉迷藏拍拍手有印象


  不過因為1跟2兩者間是兩個獨立的故事 唯一有關聯的只有華倫夫婦 所以是也沒差


  整部一開始先演出華倫太太究竟感應的時候是會看到什麼樣的畫面


  讓我有種耳目一新的感覺 接著才慢慢把故事主線帶進來


  電影中其實恐怖的感覺是慢慢堆疊的 從一開始珍妮(被附身的小女孩)學校、家庭


  慢慢地帶出珍妮家的背景 從珍妮開始玩通靈板慢慢地讓恐懼感產生


  一開始的珍妮莫名穿牆 惡靈的大力敲門


  珍妮弟弟(忘記叫做什麼名字了XD)玩具消防車自己動


  接著又是珍妮莫名坐在床上跟空氣自言自語


  珍妮自己在家裡看電視遙控器自己轉台 老人靈魂出現


  最後還有珍妮的房間大暴動


  恐懼感的堆疊說真的會讓人希望何時要進入一些比較不可怕的場景


  雖說中間有穿插一些警察看到椅子自己動的讓全戲院都笑的片段


  但中間真的會讓人有種喘不過氣的感覺


  尤其有一幕就是惡靈跑到華倫夫婦家 華倫太太在房間中與惡靈對話那段


  我覺得導演營造的相當好 雖然說最後影子跟畫結合後衝出來讓我不小心笑了


  他是要跟華倫太太安全之吻嗎XD


  但整體而言恐怖片段的緊湊度可以說是非常棒的


  但我最後只有給普雷主要是最後與惡靈搏鬥的場景感覺有點不符合期待


  有點像是前面的恐懼感堆疊太高了 卻沒有成功地在最後給我一個恐怖的高潮


  這點我是覺得有點可惜啦


  加上後面總覺得導演想加入的元素有點太多 華倫夫婦的愛情雖說感人


  但是在後面硬加進去覺得好像有點怪怪的 讓我覺得有點收尾沒收好的感覺





  以上劇情的的部分有點片段的擷取 主要是想到有記憶點的部分就打


  可能時間線看起來有點混亂 先跟大家說聲抱歉哈哈


  不過整部戲前面運鏡 鋪陳的部分我還是覺得蠻不錯的


  如果說想要最近進去電影院看鬼片的 這部是可以納入考慮的~


  --

  恐怖啊XD 只是我以為他會浮出來 結果他竟然是拿著畫衝過去XDD

  原來叫做比利 我一直想到比爾 想想不對那是老人哈哈'
