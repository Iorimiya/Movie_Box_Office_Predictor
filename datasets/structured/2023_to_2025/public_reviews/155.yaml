url: https://www.ptt.cc/bbs/movie/M.1466003665.A.FDB.html
title: '[好雷]恐怖、溫暖、歡笑於一體的厲陰宅2'
content: '其實我禮拜日就看完了

  只不過到今天才發個心得

  喔～

  順便說說當天的情況


  原本我是要看禮拜六午夜

  結果10點半到，竟然是全部爆滿！

  禮拜天下午再去看

  晚場竟然又全滿，午夜還有位子

  媽阿阿阿阿阿！！！！我明天還要上班的阿！！！！

  我咬緊牙關，為了這部！

  買了！


  結果換來禮拜一無法振作被上面釘QQ



  好，廢話太多

  進入主題




  先說說恐怖的地方

  作為一部不算續集的續集

  厲陰宅2雖然沒有1那樣的恐怖

  但又有些東西是1沒有的

  像是很多好像要嚇你的地方其實沒東西


  例如：結尾畫面慢慢往搖椅的方向滑過去

  搭配哈吉森詭異的死亡字幕，最後停在搖椅之前

  我都已經做好被嚇的準備結果竟然沒東西XDDD


  有些地方做好準備，也還是被嚇得花枝亂顫

  溫子仁真的很厲害哪！


  這次的三個鬼

  比爾是看起來最無害的，就是一個老爺爺而已


  歪頭男的動畫感太重，不過當全部的人縮在客廳

  他逼進而且破壞東西確實有點壓迫感


  這次的BOSS Valak

  化成了修女的模樣，意在褻瀆洛琳的信仰

  阿呀！他的手.....咳　失態XDD

  修女總共出現了三次


  第一次是在長島事件中遇到

  第二次是在洛琳的家

  而第二次更預知到了艾德的死亡

  這兩次都是洛琳的預知

  所以不要再有修女怎麼會跟著飛去英國的想法了


  第三次就是被拆穿他利用比爾進行偽裝的正式現身

  但才0.87秒，就被打回原形被送回地獄


  還有其他許許多多的地方

  就留待大家來一起分享



  溫暖

  這部的故事，我想給人溫暖的感覺占了絕大部分

  華倫夫婦以及哈吉森一家


  首先是華倫夫婦

  這部對兩人的著墨多了很多

  從洛琳預知艾德死亡開始，就展顯了對彼此的心意

  尤其洛琳被擋在門外的那種無助和悲傷感


  哈吉森家庭則是從開始的媽媽不相信

  直到發現真的鬧鬼，媽媽保護兒女的身態

  發現珍妮的怪異之後讓其他人都睡在別人家

  而她自己則是陪著珍妮在那個每天晚上乒乒乓乓的屋子

  為母則強！這句話真的不是假的！


  還有比利拿餅乾給媽媽的時候


  另外則是華倫夫婦和一家人的互動

  當艾德說找到這個相信自己的人

  珍妮緊接著就說：你娶了她

  兩人的會心一笑

  表示已經建立起了相當的情感


  洛琳跟珍妮的交心談話

  艾德彈奏吉他時，珍妮臉上露出的微笑

  我想她是真的感受到了溫暖

  而緊接著大家一起合唱，還有洛琳在一旁欣慰的笑容

  這段真的讓我看了很感動QQ


  另外華倫夫婦因為珍妮自己砸東西影片而不得不離開

  那種感覺真的很難受，前段還跟著一家人一起唱歌　修繕等等

  幫助一家人重新得到溫暖，也建立了情感

  最後明明知道有什麼，可是逼不得已也只能離開的無力感

  也表達的相當透徹



  最後歡笑的部份

  當然不是劇中人的歡笑

  而是觀眾的歡笑

  老師拿走菸自己吸

  警察來勘查時，看到椅子自動滑回去 下一幕急接我們無法幫助

  還有大家說的綠油精旋律

  剛開始覺得超耳熟，結果默默聽到附近有人小聲的綠油精～綠油精～

  然後一個接一個傳頌到大家笑了XDDDD

  另外有一些

  像是修女拿著畫衝出來，狗狗變身歪頭男

  也都是有人跟我一樣在笑XD



  另外也說說人物部份

  華倫夫婦依舊是老樣子

  只不過這部的時間應該是在1之後

  怎麼洛琳變年輕的感覺XDDD


  哈吉森一家人

  因為1的關係所以有估狗華倫夫婦的案子

  其中就有提恩菲爾德事件

  還有一家人的相片


  當看到劇中人物的時候

  淦！這還原度也太高了吧！

  尤其是珍妮，根本就像本人來演


  劇中

  大姊瑪格麗特很有身為長姊的風範

  看到妹妹起乩沒有驚慌，反而很鎮定的去安撫她


  珍妮是整齣戲的中心

  自然不在話下

  和洛琳以及艾德的互動都很不錯


  而長子強尼則是像路人一樣（？）

  不僅弟弟消防車這麼大聲，人還睡得跟豬一樣

  連好不容易當主場要秀的時候，馬上就被嚇到躲在衣櫃裡面


  比利

  有口吃，讓人很心疼的小朋友QQ

  那段一直往回看帳篷感覺呆盟呆萌的XDD


  另外則是從事件開始

  一直陪伴一家人的煙斗大叔（抱歉我忘記他名字XDDD）

  雖然只是配角

  但他在劇中想幫助一家人的心

  還有其目的都很細膩




  以上是不才的心得

  總體而言厲陰宅2雖然不若1的恐怖

  但仍然不在話下

  修女長相我到現在還一清二楚


  那個安娜華特

  我看完過一天我就忘記鬼長怎樣了

  只記得小女孩的長相XDDDD(


  完全是我的菜>///<

  還有這部的大姊也是>///<



  那麼下次有機會再分享啦～


  --


  我覺得很不錯笑啊XDD



  真的～



  正是如此，加上低落情緒的能量

  被誤會抽煙，想念爸爸

  讓Valak有機可趁'
