url: https://www.ptt.cc/bbs/movie/M.1466950337.A.41E.html
title: '[好雷] 厲陰宅2'
content: '這一部真的是很棒的恐怖片，


  只是我看得好生氣，


  氣到想找人一起罵一下，


  以下是針對鬼魂跟惡魔的無腦亂吐，


  望各位擔待<(_ _)>













  (防雷)




  就覺得那個鬼魂跟那個惡魔憑什麼。


  一開始是覺得老伯伯鬼魂很賤，


  明明自己都已經掛不知道多久了，


  為什麼去騷擾作祟單親的12歲小女孩，幹。




  回到家裡發現自己的家人已經不住這裡了，


  還那麼堅持要留在這麼房子幹嘛呢？


  甚至那一家人跑到鄰居家避難也要跟過去作祟，


  太賤了吧！！！！




  後來才知道老伯伯鬼魂其實很衰，


  他只是想回家看一下家裡還有沒有其他家人在，


  結果被惡魔逼迫去騷擾小女孩，


  當成引華倫夫婦上鉤的餌。




  整部戲惡魔才是那個最賤的，


  從預告片開始就能看到它畫了一個超醜的修女cosplay嚇人，


  片中一直騷擾華倫夫婦，


  逼良飄為惡鬼作祟，


  讓老伯伯鬼魂花一堆時間做老梗壞飄，


  自己把時間花在用各種有創意的手段從畫面的角落出現，


  超級搶戲的賤貨！！！！！


  看到它就生氣。




  明明沒有被邀請進華倫夫婦家裡，


  結果進去別人家裡現身騷擾，


  現在的惡魔已經如此淪喪到沒有節操跟規則了嗎？


  說好的「沒有邀請你不能進來」呢！！！！


  有夠壞規矩。




  然後就像這樣，在明明應該要害怕的地方，


  我都覺得是看到騷擾變態老伯伯跟擅闖民宅的惡魔所以好生氣。




  憤怒遠大於害怕的情緒，


  只想狂潑聖水跟往惡魔身上插十字架（雖然不知道惡魔的名字一樣沒用）。




  這一部真的是很棒的恐怖片，


  我也不知道自己怎麼了......



  --


  \Ovo/



  其實我沒看清楚後來也在椅子上去世的是誰Orz


  我也沒印象有看到全黑的畫面


  倒是最後在跑工作人員幻燈片中穿插嚇人的元素那邊我覺得很過分XDDDDDD



  好看!



  我不知道自己的理解有沒有錯，以下求勘誤。



  天主教跟基督教中的魔鬼應該是很重視契約的。


  不需要到書面約定，只要口頭約定甚至是玩笑話的答應，只要答應了都算數，


  但是沒有那段簽約過程就不行。



  所以像之前附在安娜貝爾娃娃身上的惡魔要進到護士家，


  有一段詢問能不能待在家裡的過程，


  如果當時護士拒絕的話，惡魔應該是不能夠待在家裡的(?)



  找到幾篇提到召喚的文章，


  嚴正提醒召喚是一件非常危險的事情。





  第一篇有提到或許比較強大的惡魔可以在不借助幫忙的情況下在大陸間移動，


  但大原則一樣適用，


  像是需要得到邀請才能進某人的家裡（有點像吸血鬼的規則）。





  第二篇提到需要有邀請的步驟才能召喚靈體。'
