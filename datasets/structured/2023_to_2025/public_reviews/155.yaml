title: '[ 好雷] 鬼修女 the nun : 厲陰宅宇宙之一'
content: '雷文防雷資訊頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  1.影片名稱 : 鬼修女 the nun


  2.觀影時間 :  2018/ 9月


  3.觀影地點 : 秀泰電影院


  4.觀影方式 : 自行購票





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  此區為發文防雷頁

  可選擇性提供上列 1~4 資訊  或不提供亦可

  觀影心得於分隔線下方發布即可


  ~~~~~~~~~~~~~~~~~~~

  雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  鬼修女 The Nun (2018美國電影)




  得知PTT電影版對此片的負雷評論不少，看片前期待減分了，基於對恐怖片厲陰宅系列驅

  魔華倫夫婦的欣賞，仍然去看了。


  劇情是典型通俗的驅魔恐怖片情節，1952年，神父和在倫敦的見習修女被梵蒂岡主教派遣

  到羅馬尼亞偏遠郊區修道院調查修女自殺事件……


  在此天主教修道院這群修女們，終其一生在此祈禱及生活，不能外出，供給物是由外界提

  供到儲存冰室，修女們從這地方得到生活補給……從外界眼中，真的是很封閉不自由的生

  活型態，而這小村子也對這陰氣逼人的修道院，充滿抱怨及敬而遠之。

  這修道院修女們看來神秘兮兮，最虔誠卻自殺的修女，最後的真相是？

  鬼修女又是從何而來？

  修道院究竟發生什麼事？

  片中有一橋段，神父險遭活埋致死的情節，真地令人感到棺木連結掛鈴噹的裝置，很必要

  ！


  協助神父和見習修女的年輕農夫，真的夠義氣！這三人主要角色的人設及演出，自然討喜

  ; 那位鬼修女本尊的容貌偶爾出現來嚇人，看恐怖片過多的我早已麻木。感到這片的氛圍

  營造，劇情、畫面，中規中矩，仍是水準以上的作品。觀影當中，屏氣凝神，感受那時那

  地的神祕及恐怖，挺帶感的。


  扮演見習修女的女主角Taissa Farmiga是扮演驅魔華倫太太Vera Farmiga的妹妹，外型清

  新可人，扮年輕農夫的Jonas Bloquet，是比利時演員，扮神父的Demian Bichir，是墨西

  哥演員。對這三人完全不熟悉，但看完本片，對他們認知好感度提升。


  本片收尾時，20年後1972年，華倫夫婦出場向大眾發表驅魔影片，片中被魔附身的人是…

  …


  續集仍期待！'
