url: https://www.ptt.cc/bbs/movie/M.1692636632.A.747.html
title: '[討論] 《厲陰宅》第4集片名公開！暗示賣座鬼片'
content: '《厲陰宅》第4集片名公開！暗示賣座鬼片系列完結篇



  記者許瑞麟／綜合報導


  《厲陰宅》日前宣布將開拍外傳影集，在近期舉辦的CinemaCon上，官方宣布第4集電影的

  片名為《The Conjuring: Last Rites》（《厲陰宅：最後的儀式》，暫譯），似乎也代

  表著是系列的最終章。


  該系列由派翠克威爾森（Patrick Wilson）、薇拉法蜜嘉（Vera Farmiga）主演，改編自

  現實中存在的華倫夫婦驅魔故事。溫子仁今年1月受訪時曾表示，第4集可能就是完結篇，

  「對於《厲陰宅》電影，我們非常重視，所以我們想花點時間來確保我們做對了，也確保

  我們有傳達、進入和結束華倫夫婦故事的情感，我們只是想確保這是正確的事情，以及正

  在講述正確的故事。」而第4集將由《厲陰宅2》、《厲陰宅3：是惡魔逼我的》David

  Leslie Johnson-McGoldrick擔任編劇，導演人選目前尚未公布。



  其實溫子仁執導《厲陰宅》、《厲陰宅2》後，其它相關作品便退居為監製，加上《厲陰

  宅3：是惡魔逼我的》，3部電影在全球創下8.47億美元票房。如果涵蓋《鬼修女》、《安

  娜貝爾》、《安娜貝爾：造孽》、《安娜貝爾回家囉》等外傳作品，該電影宇宙已席捲全

  球超過20億美元票房，而在第4集上映前，觀眾可先在今年9月欣賞《鬼修女2》。








  --'
date: 2023-08-22
