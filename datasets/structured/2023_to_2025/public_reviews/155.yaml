content: '二刷後,

  個人的看法比較偏向後者,

  覺得珍妮只是整個計畫的附帶獎勵,

  除掉華倫夫婦或許才是主要目的.


  若說羅琳事發七年前看到相同的意象,

  代表七年前他們就開始與瓦拉克交手,

  期間大概也壞了這修女惡魔不少事,

  為了日後好做事踢掉絆腳石合情合理吧?

  羅琳家中的夢境一來是警告,

  二來應該也是某種挑釁,

  看祂在最後一幕的表情爽成那樣,

  應該也是知道這兩個一定會回來赴死吧,

  儘管我不太懂幹嘛自報姓名自打臉就是...


  順帶一提,

  老爺爺鬼真的蠻衰小的,

  被一個半吊子威加盤叫回來,

  什麼都沒有就算了,

  還要被惡魔當玩偶耍,

  悲劇程度感覺不下那一家人阿...


  --'
