url: https://www.ptt.cc/bbs/movie/M.1465547446.A.FF7.html
title: 'Re: [好雷]厲陰宅2疑問'
content: "個人理解\n修女的目標是透過老鬼去影響珍妮\n從羅琳和珍妮鞦韆對話看起來 珍妮應該是靈感很高的那種(容易被影響或附身)\n\n所以那段對話有提到自己與其他人不同\n\
  從那麼多西洋鬼片中 似乎有那麼一個說法 惡靈無法直接對人進行物理傷害\n必須用欺騙、誘導等方式讓人類自殺 才有辦法蒐集到靈魂\n所以修女應該就是想透過珍妮來搞這家人\n\
  \n老鬼的存在價值應該是他只是一般的靈 不是惡靈 所以蘿琳一開始就說她感覺不到有惡靈\n修女用老鬼當棋子大概就是想低調殺人吧\n\n華倫一家那段我覺得是華倫夫婦的能力\n\
  \n首先蘿琳在前一個事件中就已經接觸到修女的存在\n接著老公在睡夢中也隱隱約約受到影響(所以把他畫下來、他覺得可能有助於某些事情)\n但真正能力強的還是羅琳 她在休息中(女兒在玩)發動預知卡\n\
  直接夢到修女以及直接得知修女的名字\n\n這裡很奇怪的一點是 通常惡靈都要十分小心不能被得知真名\n因為驅魔師僅靠聖經+真名就可以驅除惡靈\n但在這裡的 蘿琳直接夢出真名(個人覺得是因為透過老公的那幅畫把預知的連接加深了)\n\
  (同時也在這個夢中預知到了老公可能會受傷)\n\n接著他們受到教庭的通知前去倫敦\n但修女其實不想和他們交鋒 依然讓老鬼出來去除有惡靈的跡象\n結果羅琳感應不到修女(被老鬼遮蔽了)\n\
  接著珍妮假裝騙子 就成功把華倫夫婦騙走了\n(珍妮不想讓別人受傷或死掉 畢竟小孩子根本不知道華倫夫婦能不能戰勝那個惡靈\n 她應該就單純希望不要害到他們)\n\n\
  所以如果把修女沒有犯賤先去惹華倫夫婦當前提的話\n我覺得這連結沒有太不合理的地方~\n\n結論:\n修女想控制珍妮 搞死這家人(但用老鬼當棋子不想被發現有惡靈的存在)\n\
  華倫夫婦做了預知夢(受傷+修女真名)\n華倫夫婦被教廷找來\n羅琳感應不到惡靈\n修女怕怕 威脅珍妮 把華倫夫婦騙走\n華倫夫婦聽到老鬼的提示後回來驅邪\n\n\
  大概就這樣吧?\n\n--\n                     HEY~~~HEY~~~CHAAAAARLIE~!\n   　    。。。。。   ◣\
  \        \n◣\n                    ㄟ◤\n \n◤   \n\n--\n很多人的疑惑應該都是修女為什麼那麼高調  其實我覺得應該是相反的\n\
  在我看來全部的修女畫面 只有最後羅琳救老公那個是真的\n其它的修女畫面從上一個案件 到預知真名那裏都是羅琳的預知連結出來的\n\n這樣做的用意是 把上一個案件和本集案件串在一起\n\
  另外就是把蘿琳很擔心老公這裡的感情面放大一些(凸顯老公死掉的畫面)\n放大的感情面稍微帶動了後續華倫夫婦在小屋的表演(天倫之樂)\n這個天倫之後則影響了最後結尾華倫把拔傳承十字架以及珍妮碰到兩位好人的感恩\n\
  \n如果各位有注意 這集倫敦案的鬧鬼 從一開始的形象就是老鬼\n表示修女其實從頭到尾都是藉著老鬼出手 根本超低調\n不要誤會她了QAQ\n應該有可能 我有看過第一集\
  \ 但其實細節忘的差不多了\n然後這兩個案件 應該都是真實故事改編的 中間有沒有什麼關聯(現實社會中)我不清楚\n有可能其實根本無關 但導演用修女把事件連接起來\n\
  也或者在驅魔界這兩件是真的有一些關聯 導演用修女去加強兩個案子的連結\n\n有兩個可能\n1.修女主導了全家槍殺案 然後被羅琳抓到小尾巴\n修女傳送勞跑 跑去倫敦犯案\n\
  羅琳這中間的預知和修女有關可能也就注定了他們會扯上後面這個案件\n修女沒有主動挑釁華倫夫婦但就被命運的大手綁在一起QAQ 還是栽在羅琳手上\n\n2.修女與全家家殺案無關\
  \ 那接下來的起乩劇情請切成兩段\npart1.第一案的解案過程在羅琳用靈視看完殺人就結束了\npart2.跑出小鬼引羅琳進地下室到他們要蘿琳看鏡子(結果出現受傷的預兆)\n\
  \      這一整段 都是羅琳在預知\"修女和受傷\"這兩個符預兆\n      這個part2的預知 在後面家中休息那段得到增強\n      (重複修女、受傷這兩個預兆，但是多了真名這個關鍵線索)\n\
  \n大概就這樣吧 兩個我覺得都算合理 修女有沒有涉入第一案我覺得電影給的提示不太明顯\n\n如果去稍微搜尋一下事件的真實資料再來評論才會更精準\n不過我覺得看電影嘛\
  \ 就單純從電影中我看到的部分做聯想就好了\n有興趣的板友 去看看真實資料可能也會有不同想法~\n根據我的看法是這樣\n等火車出發的時候 老公拼出了老鬼的求救線索\n\
  結果那一瞬間 羅琳直接發動能力 開始強行猜謎 這個猜謎我覺得不是老鬼的意識\n從上面我回的那些段落我說了羅琳從幾個不同的片段中 得到了幾個預兆\n分別是修女、受傷、真名\n\
  這裡我覺得是修女和真名這兩個預兆的強化\n(因為老鬼不知道羅琳夢過修女，所以老鬼給的線索只是他被控制以及他不是惡靈)\n(但是羅琳一直在預知能力中連上修女、一開始的殘殺靈視、中間的畫和真名\n\
  \ 到現在的老鬼\n 這段預知是想藉著老鬼來告訴羅琳背後的鬼和你之前得到的真名有關\n 所以這裡是羅琳本身的能力發功 所以她流鼻血你有發現嗎!!)\n\n最後把真名成功拼出來則是在雨中怒吼的靈光一閃\n\
  \n所以把全部線索串在一起就變成下面這樣\n\n第一案\n修女－受傷\n\n中間\n修女－受傷－真名\n\n老鬼\n修女－真名\n\n最後大雨中\n修女－真名串在一起\n\
  \n大概就是這樣的順序\n預兆本來就是要串的阿 不然上帝直接錄個影片給你不是更快?\n一開始的修女也是靠那一家子鬼引導到鏡子前才看到\n中間也是靠女兒的對話引到畫室\
  \ 在從夢中醒來把真名線索默默寫在聖經中\n最後靠著老頭的自白最後引到修女真名\n\n這本來大多就都是靠羅琳的能力阿"
