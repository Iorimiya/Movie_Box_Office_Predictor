url: https://www.ptt.cc/bbs/movie/M.1757484599.A.EFC.html
title: '[新聞] 厲陰宅前傳 衍生劇全在籌備！但溫子仁'
content: '《厲陰宅》前傳、衍生劇全在籌備！但溫子仁恐不再參與、華納兄弟覺得他「貢獻太少」

  不肯加薪




  （圖片來源：Pinterest、華納兄弟影業）


  《厲陰宅》（The Conjuring）宇宙正傳系列的第四集《厲陰宅：最終聖事》（The Conju

  ring：Last Rites）上週氣勢如虹，開出了火爆的賣座票房成績，但這賣座的背後，卻有

  一場鬧僵的談判在進行著。


  外媒《Puck News》日前爆料，除了《最終聖事》上映前就在籌備的外傳影集，另有一部

  前傳電影也在開發中，但與此同時，身為全系列共同監製、以及正傳系列頭兩集導演的溫

  子仁，也早就向華納兄弟影業開口要求，他希望能在這些未來的《厲陰宅》相關作品中分

  到多達 50 % 的收益，而這且這項要求，自從他的製作公司 Atomic Monster 在去年被布

  倫屋影業收購後，就一直透過經紀公司 CAA 向華納兄弟展開談判。




  （圖片來源：華納兄弟影業）


  然而華納兄弟方面，並沒有爽快答應溫子仁的要求，因為他們覺得，溫子仁近期在《厲陰

  宅》宇宙的參與度很有限，Atomic Monster 內部的其他製片人反而承擔了不少要務，所

  以不想替溫子仁加薪。


  至於溫子仁這邊，他後來有將 50 % 的要求改成，第一部續集只拿 25 %，但後續其它作

  品拿 50 %，只不過華納兄弟依舊猶豫不定，逼得溫子仁揚言要退出這系列。




  （圖片來源：華納兄弟影業）


  雖然華納兄弟內部覺得溫子仁後期對這系列的貢獻不夠大，但也有一些並非來自華納兄弟

  的消息來源反駁，溫子仁仍然非常親力親為規劃該系列的發展方向、提供重要的指點，也

  常現身片場協助。


  《厲陰宅》宇宙的其一製作方 —新線影業的負責人理查布雷納（Richard Brener）和華

  納兄弟持相同意見，也認為沒必要替溫子仁的參與支付更多費用。


  他甚至嚴正放話，如果溫子仁還想繼續保有他在這系列的製片人頭銜，就必須提供一些最

  基本的服務，否則就算違反合約。


  文：Joker



  新聞網址：




  --'
