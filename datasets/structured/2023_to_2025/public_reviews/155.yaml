url: https://www.ptt.cc/bbs/movie/M.1466000674.A.25D.html
title: '[  爺爺雷] 嚇到快長高的厲陰宅'
content: "打給厚\n\n  小弟我從辦帳號到現在，一直都是潛水在電影版，很多看過的電影都沒有分享心得（Ex\n:死侍、大法官...），原因是，我覺得自己敘述的能力並不是那麼好～不過，今天看完厲\n\
  陰宅，因為創了很多自己的紀錄，而且好看、又被感動到，所以決定獻上第一篇心得^_^\n\nP.S. 新手上路多多指教～\n\n先來細數創了那些第一好了：\n1.\
  \ 有生之初，到現在18年來，第一次看鬼片><\n說實在，蠻過癮的哈哈！\n\n2. 以前在觀影之中，除了看喜劇片而大笑（Ex:麻辣賤諜...），很少會在電影院發出巨\n\
  大\n聲響，但是這次，我竟然......被比爾冒出來的臉嚇到叫出來！！！最慘的是，後面好幾\n排\n的人好像在笑我TAT\n\n3. 進去看之前，我不敢吃東西，所以達成了，第一次看電影沒有吃東西的紀錄，感覺兩\n\
  小時瘦了不少（誤\n\n-----------------------------------------\n\n\n\n\n\n\n\n想討論內容～所以防雷一下\n\
  \n\n\n\n\n\n\n\n\n\n-----------------------------------------\n\n  大概半年前，在一個平靜的夜晚，我剛好轉到HBO，那時正在播的，便是厲陰宅；一開\n\
  始，想說自己有點膽小，所以逼迫自己轉台，只是好奇心永遠戰勝一切，即使自己害怕，\n手還是不願意按下轉台的鍵～～～就這樣，大概從華倫夫婦去探查房子那裡，一直看到結\n\
  尾。我覺得，在現在這麽多的鬼片中，厲陰宅的的確確是其中的佼佼者，不會一味莫名其\n妙的嚇人，內容總會做各種的穿插，有趣味、有溫情...，再加上，整個劇情都是真實改\n\
  編\n，所以這部片對我來說，才會那麼地引人入勝！（小插播：那時候看完大概11點多，我一\n個人站在電視機前面，看到全身抖到一個不行哈哈）\n\n  接著談談今天看的第二集，一樣是恐怖大師溫子仁、一樣是真實事件改編，果然，看完\n\
  仍是令人感到滿足！在這邊我就不評論劇情～很多版友都有很棒的文章^_^我想回味一下\n今天印象深刻的幾幕：\n1. 今天挑戰之前，我已經翻過很多板上文章，也跑去看看幕後拍攝花絮，想讓自己不要\n\
  受到太大驚嚇；然後，曾有好多篇都說開頭就讓人心驚膽顫，真的！！！艾德的老婆在這\n集竟然直接靈魂出竅去尋找線索，我覺得跟第一集相較，又是一個創新啊！看著她（ =\n\
  兇手），一間一間的殺戮，我的心如同相連一般，整個糾結；然後到了地下室，全家人翻\n白眼（恐怖啊啊啊），帶出了驚悚修女，預告片我最怕的一段...\n\n2. 在華倫夫婦家中，修女把艾德老婆（我真的不記得她的名字拍謝><）帶去書房，然後\n\
  開始玩電燈，最後由影子一路走到畫前現身，這一整段也是超級刺激啊！（惡魔手握住畫\n的時候還有指節咖咖聲，阿斯～）\n\n3. 結巴小弟弟（對不起我忘記好多名字哈哈，自己去面壁xd），晚上打開門後，狗狗竟\n\
  然破蛹而出（？  幻化成歪歪男啊啊啊，而且還想攻擊他，雖然有點恐怖，但歪歪男實在\n長得像霍爾移動城堡裡的稻草人，所以恐怖程度-100哈哈\n\n4. 比爾晚上現身，然後竟然...竟然...在那邊用口哨吹聖誕歌嗚嗚，然後再配上沈重腳\n\
  步\n走上樓梯，超 級 毛！外交片頭，還是片尾，用那種很多人唱的聖歌當背景音樂，我想，\n從此以後不敢再聽這些歌了～\n\n5. 艾德因為機器壞掉，沒辦法放音樂，於是興起，直接用吉他伴唱這段，為前半段不停\n\
  歇的驚嚇給予稍些緩和；而其中，他與孩子們、以及老婆，歡笑、愛情，和樂融融的畫面\n，甚至使我眼眶有點泛紅><\n\n6. 最後窗台的大對決驅魔，我覺得更勝第一集，椅子倒過來敲敲天花板，因為惡魔就直\n\
  接在旁邊對著她，還露出充滿血，很多牙齒的嘴巴，看著看著真的是有夠緊張！（我覺得\n惡魔可能是跟惡靈古堡攝影棚借的（誤  ）\n\n\n  最後我要很慶幸的說，還好電影後勁不會太強，不然我這陣子就不用生活了xd之後如果\n\
  有第三集，我想我應該會再去的^_^然後為什麼說嚇到快長高呢？因為～我每次嚇到就會\n全身發抖往上伸直，伸到我都覺得快要長高了哈哈！\n\n  外加兩個小插曲：\n\
  ㄧ是、我今天是跟我友人一起看（逼我去的兇手），他原本是不怕鬼片，而且熱愛鬼片的\n，結果這次電影結束，他說他被''我''嚇到餘悸猶存，以後絕不要再跟我看哈哈哈\n\
  \n二是、這一集，電影靈魂人物的那位小妹妹，演技實在太強了！她被比爾附身的那個笑容\n，不用回眸也能讓人驚豔（？\n\n\n這篇文章到此結束，謝謝點進來看的您^_^\n\
  之後有機會再來分享他部電影～\n\n--\n\n他嚇到我太多次xdd\n\n還是很推薦這部片的哈哈～\n\n我今天有發現了哈哈，謝謝指點www不過為什麼是綠油精@@\n\
  \n\n啊拍謝～因為以前看的鬼片都是不小心轉到，瞄個幾分鐘就轉台><不然就是看板上的心得\n分享～"
