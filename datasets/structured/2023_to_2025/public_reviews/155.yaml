url: https://www.ptt.cc/bbs/movie/M.1465579014.A.062.html
title: '[討論] [有雷]厲陰宅2的歌曲'
content: '相信大家都對片中這段貓王的歌曲印象深刻吧？


  舒緩了整部片緊張又恐怖的氛圍，


  但我突然想到一點，


  屋子的女主人有提到當初她前夫離家出走時，


  把家中的貓王唱片通通都拿走，


  後來就發生了比爾老公公的鬧鬼事件。


  (在這之前這間房子似乎沒有鬧鬼，但也許是電影沒演出來)


  如果拿一台能夠正常撥放的黑膠唱片機，


  整天都撥放貓王的音樂，


  讓比爾老公公在另外一個次元還是可以過地快樂，


  這樣他應該就不會騷擾女主人一家人了吧XD



  我覺得是，惡魔和亡魂是不一樣的


  惡魔沒辦法直接對人類下手，可能必須透過亡魂，


  祂必須透過去世的人的鬼魂才能夠對活人產生威脅


  所以若是有辦法鎮住仍留在這間屋子的亡魂，


  惡魔(修女形象)就沒辦法對女主人一家造成威脅？


  --

  在還沒跟丈夫離婚時，屋子裡放著貓王音樂

  比爾也只是偶爾回家回味一下，

  後來離婚後，可能因為屋內環境改變了，

  比爾的心靈變得脆弱許多，

  才被惡魔控制吧？


  惡魔這點我覺得很有趣，這就是西方鬼片跟東方鬼片的不同，

  西方鬼片作怪的大部分都是惡魔，

  這可能跟基督教信仰有關係，


  而東方的鬼片大部分都是拍亡魂比較多，

  也就是輪迴的概念，

  十八層地獄的妖魔鬼怪來人間作亂就比較少(有的話也是神怪片)，

  溫子仁導演的片巧妙地把東西方的兩種不同概念揉合在一起，

  西方的惡魔與東方的輪迴概念，

  這讓他的片在驚悚之餘也非常有意思。'
