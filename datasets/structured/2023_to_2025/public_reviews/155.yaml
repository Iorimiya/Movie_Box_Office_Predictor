url: https://www.ptt.cc/bbs/movie/M.1465562051.A.E7C.html
title: 'Re: [好雷]厲陰宅2疑問'
content: "以下為我個人對 The Conjuring 2 的看法 看各位覺得合不合邏輯或有其他看法\n\n首先最多討論的 到底大boss黑衣修女是先在小屋\
  \ 還是跟過去小屋的\n\n我的看法是 是跟著華倫夫婦過去的 原因為\n\n1. 華倫夫婦還未知道小屋的狀況前就已經知道修女的存在了(第一集就有)\n\n2.\
  \ 若是因為Lorraine有預知能力預知到在小屋的修女的話\n   她丈夫是沒有預知能力的 不應在大老遠自己的家中就可以畫出修女的樣子\n\n   我的判斷為修女是跟著Lorraine的\
  \ 所以可以影響住在同一個屋簷下的丈夫\n   導致他能畫出修女的畫像 這樣比較符合邏輯\n\n3. 也可以反過來想 若修女本來就在小屋 修女是沒有預知能力的(吧?)\n\
  \   那當他沒有能力預知到夫婦會到來的情況下 不可能提前先抓一個老頭回來做假吧?\n\n   而如果修女真的提前抓老頭回來好了 那老頭也一定知道自己是被控制著的\n\
  \   不會在片尾說 自己想走了但走不了\n\n\n所以我對整個劇情的流程猜測如下\n\n修女是跟著Lorraine 想要殺害她\n\n然後因為教堂的關係 被請去小屋勘察真偽\
  \ 把修女也帶去\n\n老頭本來回來是為了找家人(跟丈夫講話時有說) 配合片尾老頭的自述\n我猜測在跟丈夫說完話後 發現家人早已不在這 就有想離開了\n但這時他發現離開不了\
  \ 因為修女被夫婦帶來了\n所以在丈夫拿出十字架時(估計十字架可以弱化邪靈的能力) 講了第一段的提示\n\n而後修女想要夫婦離開的原因 我的看法為他本來是想殺夫婦的\n\
  但是來到小屋後 發現珍妮是個可附身的對象 但要附身勢必會被夫婦所阻止\n所以才會改想要夫婦離開 先成功附身於珍妮後 再做後續的計畫?\n\n也解釋了為何前期Lorraine看到修女想要夫婦死\
  \ 但到小屋後修女卻想趕她們離開\n\n\n\n至於另一個我本來也有的疑點為 為什麼修女要白癡自己把名字跟Lorraine講?\n\n因為照正常來說 如果沒名字就拿修女沒皮條\
  \ 那修女又何必自曝其短\n\n但我後來在某篇的爬文中有到一個解釋 姑且就當是這樣吧\n\n解釋為 當有驅魔能力的人以上帝之名詢問邪靈之名時 她們不得不說\n\n\
  \n\n大約是這樣 大家討論看看有無不合邏輯的地方~\n\n\n\n\n\n--\n\n順序應該是這樣 修女 想殺夫婦 > 發現珍妮可以附身 > 為了附身不被阻止要趕走夫婦\n\
  \                    > 附身成功 然後夫婦回來 > 決定讓珍妮自殺引誘丈夫救他"
