url: https://www.ptt.cc/bbs/movie/M.1466136444.A.102.html
title: '[好雷]厲陰宅2~看完便秘都治好了呢~ '
content: '網誌版






  以下有雷.....



  厲陰宅2的故事依然是真實事件改編


  當然啦~~


  電影跟真實事件肯定會有有所出入的地方


  畢竟若電影完全照真實事件演的話那不如去看記錄片就好


  這次事件發生時間點因為離現在不久(1977年)


  所以網路上可以輕易的搜尋到當時的影片


  事件發生在英國的恩菲爾德(Enfield)


  整件事當時造成非常大的轟動


  稱為恩菲爾德事件


  有看過溫導的其他恐怖片的人就會知道


  溫導的世界裡惡靈總是非常明目張膽


  有別於其他恐怖片的鬼愛出現不出現的


  溫導是大膽的嘗試讓鬼可以在白天也可以出來嚇人那種


  這部片有些地方的驚嚇點是讓觀眾"防禦不能"


  許多會怕卻又愛看恐怖片的人都是用手遮著自己一半的眼睛在看


  但是溫導厲害的地方就是有些點你根本不會刻意去遮


  他可以在你認為不會出現驚嚇點之處嚇個你毫無防備


  像厲陰宅第一集在地下室忽然有雙手忽然出現拍掌那種感覺


  就是你認為驚嚇點還沒到還沒提高警覺之時忽然被殺個措手不及


  讓人不得不佩服導演的創意與人性的拿捏


  再來可以來談談厲陰宅2裡的惡靈


  比起陰兒房系列的群魔亂舞


  厲陰宅2裡真正出現的惡靈大約3個上下而已


  可是整部看起來一點都不單調


  你反而會很期待下次惡靈會用哪種方式現身


  會有種"心甘情願被嚇，總之趕快嚇我吧!!"的感覺


  劇中演員們塑造出來的"無力感"讓人相當可以感受


  這事件跟以前傳統的恐怖事件不同


  因為這家人沒有"男主人"


  之前不管是陰兒房或是厲陰宅1都是有男主人存在


  所以多多少少會有些陽剛或是壯膽的效果在


  可是恩菲爾德事件是發生在單親媽媽跟一群小孩的事件


  所以在華倫夫婦出現之前


  那種絕望無力的感覺十分明顯


  而華倫夫婦似乎已經是一種穩定感的代名詞了


  華倫先生不顧自己生命要去救被附身的小孩的精神讓人動容


  在當事者一家人最絕望的時候


  適時的團結大家


  大家圍繞在一起並且一起唱起貓王的Can''t help falling in love堪稱最經典一幕


  不得不說派翠克威爾森因為這次的演出


  已經成為許多人心目中的超級暖男了


  最後來小抱怨一下


  我跟許多人的感覺一樣


  覺得最後的大魔王修女"瓦拉卡"太弱了


  居然非常輕易的就被華倫太太給收拾掉


  片中也沒有清楚的交代"瓦拉卡"的故事


  只知道跟上個華倫夫婦處理的"長島事件"有關


  應該是在替續集或是相關電影在鋪路


  如果還有續集或是相關電影


  我想我絕對會買單


  此外....


  有人跟我一樣看到安娜貝爾娃娃卻感到很親切的嗎?






  整體來說


  厲陰宅2是我看完每部溫導系列作裡最滿意的一部


  導演成功的讓大家有"又熟悉，又新鮮"的感覺


  跟陰兒房的超展開有所不同


  畢竟是根據真實事件改編


  但也創造出自己的恐怖風格


  就算沒有看過系列作的人也可以輕鬆入門


  片長不短


  不過我沒有出現有人覺得"怎麼還沒完"的疲勞感


  我覺得飾演當事者"珍妮"的演員Madison Wolfe功勞最大


  還是中學生的她是片中的靈魂人物


  這不是她第一部大銀幕作品


  所以從她身上看不出太多羞澀感


  在演出被附身時候的段落臉部表情讓人好驚豔


  電影最後跟厲陰宅1一樣


  還有穿插1977年的一些聲音、影像、照片等紀錄


  如此讓大家更有身歷其境的感覺


  看完以後馬上回家爬一些當時的記載


  這種真實故事改編的恐怖片永遠都是大家的最愛


  目前我也確定會去二刷


  推薦給喜歡恐怖片的您


  --'
