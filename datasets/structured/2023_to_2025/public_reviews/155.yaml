url: https://www.ptt.cc/bbs/movie/M.1497179176.A.839.html
title: '[負雷] 神鬼傳奇：厲陰宅外傳'
content: '這部風格相似厲陰宅

  躲在背景中突然出現+驚嚇聲效超大聲=

  增加驚悚感覺


  一度以為是找了溫子仁拍厲陰宅外傳



  吐血點

  1.

  這位女主角不知道是從那裡找來 可能是拍這部時心情不好 演技差成這樣 不如找景甜來

  演


  2.：

  電影中出現的運輸機C130H

  最大飛行距離4,000km


  從伊拉克到英國 直線距離為4364公里

  算從伊拉克北部到英國南部

  可縮短成約4千km

  但電影中C130H已經在臨時機場起降一次

  臨時機場不太可能提供加油

  油量不足以達到最大飛行距離4,000km

  好好找架合理的運輸機拍攝 有這麼難?


  3.

  主角中被押到伏妖降魔總部裡面

  總部讓人感覺 戒備森嚴 守衛足夠

  也有許多守衛看守著女魔頭


  結果就一個人 拿了一把小斧頭

  往電箱一擊 造成在場所有人手忙腳亂

  跑來跑去 不知道在忙什麼

  要是星巴克電箱發生爆炸 在場顧客們肯定第一時間拿起手機錄音拍照打卡

  而不是跑來跑去


  因所有人專心跑路

  造成女魔頭變成無人看守

  後來頂多就一位不知是不是路人

  拿一把沒用的散彈槍向女魔頭連射


  之前明知槍沒有用

  前面才用一堆鎗繩索制服女魔頭

  看守者卻用散彈槍 不要這麼無腦好嗎

  為何乾脆不改編女魔頭用色誘才得以逃脫


  4.

  男主角拿棒子可以打爆殭屍

  在十字軍墓現場的工作人員

  卻被殭屍碾壓 戰力這麼不對稱


  伏妖降魔總部研究這麼久

  不知道殭屍可以用棒子打爆

  被咬死活該





  還有其它許多點可以吐嘈

  只是目前已吐到血量快要沒有

  講到這裡就好

  再講下去只會回憶更多不愉快


  這部是這二年 進電影院中唯一看到一半想要走出去的電影 超難看

  神鬼傳奇2跟3已經夠難看

  沒想到這部可以拍的更難看


  --

  個人感覺

  安娜貝爾演技比女主角好'
