title: '[好雷]  厲陰宅2 '
content: "有  雷  喔\n\n\n\n\n\n\n\n\n\n\n\n    先講結論，我覺得沒有第一部好看(嚇人)，第一部我有在板上寫好雷。\n不過對我來說第一部有影院效應(看一半停電還巧合的卡在熄燈的點)要超越\n\
  有點難XD我看法跟板上雷同，第二部的故事較完整，增加了更多笑點溫馨點\n緩和氣氛。感覺上預算也稍微變多了，看那不夠自然的CG就是明證。雖然像\n在吐槽，其實是好雷唷～\n\
  \n\n    續集電影最容易讓人詬病的點是劇情連貫性與獨立性不足，本部沒有\n這個問題，有看過第一集的有小驚喜，沒看過第一集也沒差，是完全獨立的\n故事。同樣是恐怖電影，這兩部的手法不太相同，上一部是湯匙殺手式左一敲\n\
  右一棍一緩慢醞釀到最後大爆發，很過癮但有點喘不過氣。這一集就有很明顯\n的「起承轉合」感覺是有精心設計過的，到這個Part觀眾恐懼快到頂了，加個\n搞笑段子紓解一下，然後又累積到了一個程度，讓主角彈首吉他來個溫馨大合\n\
  唱。當主角在唱歌時，彷彿看到導演在說「您累了嗎？聽首歌好嗎？聽完我要\n放大招了喔」。這麼做減輕觀眾壓力當然很好，不會因恐懼錯過笑點。像警察\n進屋搜查那段我看的那場觀眾都笑得很開心。然而同樣的恐怖被打斷，就沒法\n\
  累積了。有點可惜的說~然後上一集比較偏無形的恐怖，這集就現形給你看。\n能現形的鬼能玩的花樣就更多了，於是本集拍攝手法也花俏了許多。不過上一\n集的地窖拍手捉迷藏實在是太經典了很難超越XD說是這麼說，本集有些恐怖橋\n\
  段還是很不錯的，我都有被嚇到XD 音效方面依舊優秀，很適合到電影院來體驗。\n我覺得這系列很適合到電影院跟一群人一起看，一來音效效果強烈，二來可以\n壯膽，三來看恐怖片，當然要搭配尖叫吸氣顫抖以及隔壁座位男大生嚇到的罵\n\
  幹聲呀XD\n\n\n    劇情方面採雙線合流模式，開場華倫夫婦，其實上集對這兩個角色背景並\n沒有著墨太多，本集加深兩人角色塑造，順便帶出每次華倫太太閉眼後到底看\n\
  到了什麼。(這邊蠻有趣的。)接著帶出英國珍妮一家這條線，後半雙線匯流，\n整個故事的邏輯，除了惡魔到底為什麼要到英國強迫72歲老爺爺飄咬人(假牙都\n掉了QQ很不方便)嚇小女孩全家外都很合理啦。\n\
  \n另外，因為恩菲爾德靈異事件原著(誤)實在是太有名了，所以無感(喂)。\n基本上對西方靈異事件有點興趣的應該都有看過這個故事了。然後因為大家應該\n都看過了所以導演也沒拍XD(我還以為有跳床少女LIVE秀呢電影直接給你看照片)\n\
  以真人真事改編來說挺寫實的啦，該有的破綻疑點都有提到，最後的大事件……\n我比較喜歡第一集的母愛，華倫夫婦的愛也很美好啦，最後跳舞部分很美，不過\n不太能打動我。(連恐怖片也放閃實在太超過啦!)啊~某方面來說這部很適合跟另\n\
  一半看。\n\n    雖然不滿意的點還是有，不過以一部商業恐怖電影值得打好雷。\n\n\n--"
