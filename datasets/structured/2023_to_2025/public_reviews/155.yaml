url: https://www.ptt.cc/bbs/movie/M.1465390743.A.DEC.html
title: '[好無雷] 恐懼再度降臨《厲陰宅2》特映心得'
content: '真心不喜歡看恐怖片的小弟，這次為了溫子仁再次執導的《厲陰宅2》，在小弟怕怕，但

  小弟不說的情況下硬著頭皮、一直用手摀著臉的看完這部恐怖續集…


  看完之後只能說…溫子仁真的是一個很「變態」的人！不僅再次成功將華倫夫婦的故事巧

  妙改編，整部電影也沒有流於俗套，甚至前半段幾乎不留喘息空間給觀眾，就是一路一直

  嚇死你才甘心的緊湊劇情，更讓人不得不佩服這位新世代「恐怖電影大師」。


  你以為少了安娜貝爾那隻娃娃，本集恐怖氣氛就會往下降嗎？大錯特錯！相信大家應該知

  道，這次《厲陰宅2》改編自華倫夫婦在調查靈異現象的案子中，其中一起事件：「恩菲

  爾德鬼屋事件」。


  而《厲陰宅》之所以恐怖，除了氣氛營造成功外，對我來說最大的特點就是因為是"真實

  事件"改編，有著完整的故事結構，再配合真實存在的人物，或是以歷史資料來輔佐等，

  這些因素都讓《厲陰宅》系列跟其他恐怖電影相較下更為出色。


  《厲陰宅2》也承襲上集恐怖氣氛及完整劇情的優點，溫導更在開頭便給各位非常有「誠

  意」的恐怖劇情，在前半段幾乎20分鐘裡，找不到一點可以讓人稍微放鬆的空隙，而是一

  直到後半段才稍稍有較為輕鬆的劇情出現。


  另外，本集也加入令人意外的轉折，當你以為故事大概就是照這個模式進行時，卻有意想

  不到的轉折會發生，更讓這部電影的可看性提升不少。


  雖然就我個人而言，仍是比較喜歡第一集，但對於喜愛恐怖電影的人來說，《厲陰宅2》

  一點也沒叫人失望。想在端午節用恐怖片消暑的人，請務必選擇《厲陰宅2》！


  (上集是衣櫃，這集是...帳篷)


  --'
