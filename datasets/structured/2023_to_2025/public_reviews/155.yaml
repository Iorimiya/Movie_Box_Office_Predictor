url: https://www.ptt.cc/bbs/movie/M.1444529648.A.7B4.html
title: '[新聞] 「華倫夫婦」回來了！　溫子仁《厲陰宅2'
content: '「華倫夫婦」回來了！　溫子仁《厲陰宅2》開拍秀合照


  2015年10月10日 15:59 記者許瑞麟／綜合報導


  華裔導演溫子仁（James Wan）所執導的恐怖片《厲陰宅》（The Conjuring），靠著小成

  本繳出1張漂亮的成績單，近日他也正在拍攝續集，並且在Instagram上貼出和片中的靈媒

  主角「華倫夫婦」合照，讓網友直呼「等不及啦！」


  溫子仁曾經以《奪魂鋸》（Saw）在好萊塢闖出一番名號，許多大預算的電影都找上門來

  請他執導，當中的《歡迎光臨死亡小鎮》（Dead Silence）票房卻十分慘澹，讓他的聲勢

  一度跌到谷底，還好和編劇雷納沃爾（Leigh Whannell）聯手靠著《厲陰宅》再度翻身，

  甚至因此順利接拍《玩命關頭7》（Furious 7），展現他拿手的飛車追逐場面。


  此外，溫子仁也常在Instagram上和影迷分享目前的拍攝心得，8日便貼出1張和《厲陰宅2

  》主角華倫夫婦派翠克威爾森（Patrick Wilson）與薇拉法蜜嘉（Vera Farmiga）的合照

  ，讓粉絲相當期待這部新作品，本片劇情將描述1977到1979年間，英國的1對小姐妹遇見

  超自然力量的真實事件，預計將於2016年6月在美國上映。




  --'
