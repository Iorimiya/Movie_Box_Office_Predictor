url: https://www.ptt.cc/bbs/movie/M.1594083381.A.6A9.html
title: '[討論] 鬼影vs厲嬰宅 （有雷討論）'
content: '如題 想理性討論一下


  近年來說到恐怖片


  絕大部分人都會聯想到厲陰宅（溫子仁）


  然後討論串裡就會出現鬼影（泰國鬼片）


  這兩部說不說的上經典 倒是見仁見智


  但似乎都有非常印象深刻的記憶點


  肩頸酸痛 vs 拍手叫好


  罷特 就是這麼一個罷特


  好像記憶點也就這樣而已


  對於劇情上 似乎也就有點那麼公式化


  小的不材


  是否就因為鬼影男主長期以來肩頸問題


  最後那幕讓人頭皮發麻的解答


  厲陰宅小朋友們隨著拍手聲玩的捉迷藏


  對於我們來說很稀鬆平常的事


  進而造成印象深刻的記憶點


  蔚為經典（好看、厲害、etc.）


  對於有冒犯到兩部影迷的地方還請見諒


  --'
