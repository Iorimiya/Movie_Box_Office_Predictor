title: 'Re: [有雷]厲陰宅最後如何降伏邪靈?'
content: '其實我覺得那是電影效果啦，就聖經而言，


  基督徒驅魔不需要知道惡魔的名字，只需要有信心並宣告


  自己是在父子聖靈的名裡並奉這名，就可以把鬼趕跑了


  其實康斯坦丁還比較像真實的驅魔，直接奉父子聖靈的名


  就開轟了還問那麼多，不過驅魔的時間就變的很短


  就電影而言不僅太短也沒戲劇張力，所以才加入惡魔名字的設定吧


  小魯在教會聽到和參與的趕鬼都很平常，就眾人按首禱告


  並奉父子聖靈的名要鬼離開，就結束了，沒那麼多過程


  -----

  Sent from JPTT on my Asus ASUS_Z01KDA.


  --'
