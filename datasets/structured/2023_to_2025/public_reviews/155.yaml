url: https://www.ptt.cc/bbs/movie/M.1466321968.A.487.html
title: '[微好雷] 厲陰宅2：讓你偷擦眼淚'
content: '華倫夫婦－羅琳和艾德，這次要

  處理的案件是倫敦的鬼屋，居住

  者是單親媽媽帶著四個孩子，其

  中一個孩子珍妮特別被鬼侵擾。

  附圖劇照就是羅琳和珍妮談心的

  一幕。


  不恐怖劇照



  珍妮看得到、感受得到，也身心

  俱疲，但身旁的人一開始總是不

  相信，包含最親愛的媽媽。在求

  助的過程中，需要不斷的證明自

  己，再度經歷一次又一次的恐怖

  體驗，但結果卻是一回又一回的

  證據不足、被質疑說謊。


  《夏目友人帳》也述說同樣的心

  情，男主角夏目從小就看得到，

  但別人看不見，因次不斷被質疑

  說謊、裝神弄鬼，被認為是想騙

  取關注的怪小孩，沒有朋友。


  羅琳述說自身歷程、同理珍妮的

  情節，用意不在嚇人，但能加重

  我們於劇中人情感的連結，讓我

  們更能感受珍妮再度被放棄時的

  無助與傷心。


  同時加深對華倫夫婦感情的理解

  ：「沒有人相信我，除了他」，

  也強化助人以及可能失去心愛之

  人的衝突。我們擔心艾德遭遇危

  險，不但是因為帥氣溫柔的男主

  角可能會受傷、死亡，還因為羅

  琳會難過。


  影片不乏感人、傷痛的情節，連

  鄰座路人男子也摘下眼鏡偷擦眼

  淚。


  電影最後也放真實事件的錄音，

  可惜那時電影院燈已亮，觀眾開

  始離席，沒辦法好好欣賞。（這

  對於愛看靈異故事的人來說應該

  很精彩吧，怎麼不坐下來好好看！）


  情節架構也相當精彩，編劇連結

  兩次在事實上完全不相干的事件

  ，卻能保有合理性能說服觀眾入

  戲，提高劇情層次，不只是單純

  的嚇人。


  --

  因為坐很側邊，所以會瞥到XD

  這種很煩XD

  無助望著窗外那幕，很令人難過

  隔著門那邊真的好擔心艾德

  那個媽媽真的很偉大

  儘管狀況不好，還是盡可能滿足小孩的需求

  即使身臨險境，也要陪伴孩子'
