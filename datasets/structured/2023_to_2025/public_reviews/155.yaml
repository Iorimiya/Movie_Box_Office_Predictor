title: '[請益] 厲陰宅未改編的史實'
content: "大家好 看完厲陰宅2 就想知道 電影未改編的真實事件 是什麼?\n在伸手發問前 我提供個人對厲陰宅1的真實事件的認知:\n\n1.厲陰宅1的地理位置,附近是印地安人的墳場\n\
  2.此地超自然活動力\"超強\",因為印地安人在此地有使用活人獻祭\n3.補充上點,厲陰宅1所參考的事件背景跟discovery所製作的鬼影森森第一季第一集\n\
  \  是相同的(discovery把這個擺第一集播出 所以\"超強\"?);活人獻祭在鬼影森森裡\n  面是由女主角在某天莫名產生靈感作畫,畫中畫出在雷電風雨交加的夜晚.有著一\n\
  \  顆破碎淌血的心\n4.電影最後鬼附身在女主人身上,由華倫夫婦執行驅魔儀式 <->現實上鬼最後是附身\n  在另外一個(非華倫夫婦)靈媒身上,由另外找來的神父執行驅魔儀式\n\
  5.最後驅魔儀式電影中被附身者連椅子一起飄浮起來 <-> 現實上什麼都沒有就單純\n  只有坐著被驅魔而已(有飄起來的在鬼影森森的某一集有,那集神父有強調這是他\n\
  \  驅魔以來遇到第一次漂浮事件)\n\n其他還有一些跟真實事件的差異 因為很瑣碎有想到再補充\n\n那麼 這次第二集所演出來的 跟真實事件有哪些差異點呢?有請高人指點\n\
  \n--"
