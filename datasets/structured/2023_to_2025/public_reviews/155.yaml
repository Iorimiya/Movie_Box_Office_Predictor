url: https://www.ptt.cc/bbs/movie/M.1465900081.A.57F.html
title: '[修女雷]華倫夫婦又來啦~~《厲陰宅2》'
content: '有雷慎入(我猜推文會有瑪莉蓮曼森)




  劇情簡介：

  《厲陰宅》以2000萬的拍攝預算，在全球囊括了超過3億2000萬美元的票房。這次再度集

  結了第一集的幕後製作團隊，溫子仁親自執導，薇拉法蜜嘉與派屈克威爾森飾演艾德與羅

  倫華倫夫婦，法蘭西絲歐康娜飾演哈德森家的單親媽媽珮姬，童星麥迪遜沃爾夫飾演被惡

  靈糾纏的小女孩珍妮。


  「恩菲爾德事件」發生在1977年，單親媽媽珮姬帶著四名子女住進恩菲爾德小鎮的房子，

  但自從住進來之後，怪事便不斷的發生，經常聽見有人敲著房子的牆壁並粗暴地移動家具

  ，驚慌失措的一家人開始向外求救，但是就連英國警察也表示愛莫能助，媒體除了拍攝到

  珍妮被不明力量抬離到半空中的畫面外，就連英國廣播公司BBC也錄到一位72歲老人比爾

  的說話聲音，而他蒼老的聲音正是發自年幼的珍妮口中，從此倫敦的「恩菲爾德鬼屋事件

  」知名度不脛而走，就連遠在美國的華倫夫婦也被請託親赴倫敦幫忙調查，但這次惡靈怨

  念的程度遠遠超過華倫夫婦的想像……。




  當初《厲陰宅》的拍手嚇人戲碼已非常的新穎，這次導演溫子仁又帶來更勝第一集的恐怖

  張力。故事仍然以真實故事改編，而這一次故事的還原度非常高，從片尾的真實照片可以

  看出來電影有拍出當時的情況，就史實所記載的事件也都有呈現到螢幕上。儘管事實上華

  倫夫婦並沒有主導這件事情，但這次仍以他們當主角帶大家體驗這樁廣為流傳的恩菲爾德

  事件。


  開頭接續著上一集的最後提到的長島事件，也帶出惡魔威脅華倫夫婦來為後續故事鋪陳。




  這次的故事並非只是鬧鬼、附身和驅魔等等的鬼片公式，而是加入了更多角色之間的連結

  ，尤其是華倫夫婦之間那相信彼此的感情，那可以一起出生入死、為了人們而奮不顧身的

  意志。


  除了劇情走向的出乎意料之外，這次在嚇人的點實在是下的很好，更多壓迫感在這棟房子

  裡面隨著鏡頭的旋轉逐漸提升，突如其來的jump scare總是讓人抓不住點，真不愧是溫子

  仁，想想當初看的時候劇院裡沒多少人，實在恐怖。雖然有人覺得後面驅魔的部分顯得草

  率，但明顯這部重點就不再這阿~恐怖愛情片，這是導演在訪談時就有說了，這部並不是

  一般的恐怖片。


  對於修女惡魔的名稱彩蛋還真是需要仔細觀察才能夠發現(都嚇得半死了，哪有心情管這

  麼多啊~)，網路上也有熱心網友幫大家整理了。還有讓人"會心一笑"的安娜貝爾也有亂入

  喔~




  倒轉的十字架雖不代表邪惡，但仍有人認為是惡魔的象徵，在恐怖遊戲《Outlast 2》的

  預告也有出現喔~


  然後裡面艾德彈吉他那段我竟然一眼就看出來他在學貓王，究竟我是怎麼知道的我也說不

  出來XD


  整體來說，我覺得這部有超越第一集，而且跳脫了原本恐怖片的公式卻又能掌握史實，尤

  其除了恐懼之外還加上了有如絕命終結站般的緊張刺激感，非常推薦大家進戲院觀賞。片

  尾的錄音彩蛋也著實令人毛上加毛。


  --

  皇上:是狼?是狗?

  犬業叉:是狼

  侍郎:cue屁?


  --

  原來如此，沒注意到'
