url: https://www.ptt.cc/bbs/movie/M.1465729810.A.5AB.html
title: '[好雷] 嚇掉我半條命的厲陰宅2'
content: '防修女











  看完第二集我甚至覺得有比第一集好看

  因為老實說我已經快忘記第一集演什麼了= =

  (當然也有可能純粹只是記憶力太差~)


  一看到演媽媽的那位演員時就覺得超眼熟

  等散場一查發現是AI人工智慧的媽媽以及神鬼願望的同事

  讓我想起第一集的媽媽也曾在多年前演過鬼入侵

  到底是為什麼這麼的跟鬼片有不解之緣


  本集依然是有滿滿的薇拉法蜜嘉

  本來就很喜歡他的我真的是被這集嚇半死也甘願


  其實這部片除了一直讓人縮在椅子上的恐怖之外

  很多時刻都還蠻溫馨的，幾個小朋友角色也發揮的不錯

  除了那個前半部有點影薄

  後半部一準備去跟鬼嗆聲就立刻被關廁所的哥哥之外


  像大姊，妹妹大半夜不睡覺在那講單口相聲

  一般小孩大概直接尿在床上了

  但他不斷安慰妹妹還幫他蓋被被

  果然是很有長姊如母的風範

  連錄影時妹妹直接被附身

  他也非常淡定也沒落跑的全程參與

  反倒是妹妹發現嚇不倒姐姐自己也很尷尬只好先跑走（誤


  還有小結巴正太也超可愛的

  飛踢到消防車那一下大概一半的魂被嚇飛了

  然後帳棚突然大叫又把剩下的那一半也全嚇飛


  是說媽媽是有多好睡

  消防車吵的要死一直嗶嗶叫竟然還端坐紫金蓮


  後面拿餅乾給媽媽吃也超貼心的

  雖然我覺得媽媽當下應該比較想哈一管

  餅乾什麼的拿去餵拜輪比較好省得他半夜發難


  鄰居的仗義相助也很令人動容

  一般人應該嚇都嚇死了

  何況惡靈還過個馬路跑來直接騷擾他們

  但鄰居太太無條件收留照顧他們一家

  鄰居先生也在危急時刻出手相助

  害我看到他被卡在門縫都不好意思笑了


  其實裡面老人跟修女都蠻恐怖的

  但是歪頭男因為動畫感太重有點讓人出戲

  只要他出現就只是被音效嚇到而已


  反倒是老人突然在電視旁邊出現又大叫

  或修女拿著自己的畫像衝過來

  感覺都是比較有經過設計的橋段

  是說到底是膽子有多大敢把這種畫放在家裡


  不過相較於之前的一些鬼片

  這次的惡靈倒是還蠻好心的從一開始就展現能力給所有人看

  我覺得最慘的就是那種從頭到尾都只有一個人能感應的到的狀況

  最後就會演變成眾叛親離連身邊的人都不相信或只覺得他有病


  但這次的狀況是大姊也一同經歷兩張床大晃動

  媽媽也看到櫃子跑去撞門，弟弟更是這輩子應該都不敢玩消防車了

  鄰居的家也被搗的亂七八糟，甚至連警察都看到椅子自動歸位

  所以即便後來女博士以錄影為由指控他們造假

  他們都還是知道他們是真的經歷過這些

  也因此一直到最後都是情義相挺


  看完這部我大概能體會愛玩雲霄飛車的人是什麼心情

  當下會覺得很驚恐很害怕，但怕完之後又覺得很HIGH很刺激


  當然如果有全套完整收驚套裝行程也歡迎推薦我


  --


  片尾跳那一支舞好有愛啊~


  --'
