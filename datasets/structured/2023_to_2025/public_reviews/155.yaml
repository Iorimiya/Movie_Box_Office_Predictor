title: '[  好雷] 厲陰宅2'
content: '因為覺得第一集超級好看

  加上沒有去電影院看過恐怖片

  所以就揪團一起去看了



  防







  雷






  =========以下有雷=========


  故事開始就以主角夫婦兩人的一次經驗

  帶出來一個惡靈修女


  而遇見靈異事件的一家人

  則是被一個老先生的靈魂纏住

  中間當然有許多被攻擊附身等過程

  艾德跟羅琳

  故事到了最後才發現

  原來老先生的靈魂原來是受惡靈的束縛

  這一切都是惡靈修女的詭計

  而終於還是解開修女的名字順利驅魔

  最後親情人情的鋪陳也讓人覺得很溫馨


  ==========================


  最後做個小結:

  第一次進電影院看恐怖片就被嚇到半死

  在電影院看果然會加倍恐怖@@

  不過綠油精之歌讓我笑了XD

  還有狗變形成鬼怎麼還不會死(*′>д<)

  電影的節奏還有氣氛的營造真的都超棒


  ==========================

  真的大推這部! 絕對不會期望落空!!!



