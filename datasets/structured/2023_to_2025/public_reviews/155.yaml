url: https://www.ptt.cc/bbs/movie/M.1537967413.A.2BF.html
title: '[好雷]厲陰宅The Conjuring '
content: '1.影片名稱 : 厲陰宅The Conjuring


  2.觀影時間 : 昨天


  3.觀影地點 : 家裡


  4.觀影方式 : DVD




  ~~~~~~~~~~~~~~~~~~~ 無雷   ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  繼兩集《安娜貝爾》後，《鬼修女》的獨立電影也在最近上映了。溫子仁與他開創的《厲

  陰宅》似乎真的是成為一個獨立宇宙，可以一個接著一個地發下去。


  《安娜貝爾》第一集上映的時候，我還沒有看恐怖片。後來給恐怖片迷朋友帶入門，幾年

  過去，也算是看了不少恐怖片，卻還是一直拒看《厲陰宅》系列...因為在大量看恐怖片

  的過程中，我發現日本鬼、娃娃和小孩是我的罩門，而「安娜貝爾」因《厲陰宅》聞名（

  這樣有說反嗎？），所以我遲遲不敢挑戰《厲陰宅》。


  直到最近看了《宿怨》，補完《大法師》、《七夜怪談》，又看了《陰兒房》（應該還沒

  補完全系列）、「奪魂鋸系列」，慢慢覺得好像體質（嗯？）有些改變（不像以前會因為

  畫面而噩夢），且對拍出《奪魂鋸》第一集、開啟《陰兒房》世界的溫子仁感興趣（覺得

  怎麼樣也應該要補完他最著名的作品才是）。


  結果，《厲陰宅》出乎我意料地，不恐怖（或者應該說像《七夜怪談》一樣，是我自己預

  想的太恐怖，以致於最終覺得不恐怖），反而很感人。與許多美國鬼片（應該比較算是「

  惡靈」片吧...）一樣，故事發生在一個家庭，不一樣的是以一對「超自然現象探究者，

  夫婦兩人都是天主教認可的驅魔者」夫妻為支線，驅魔不對立於科學，反而是兼用科學與

  通靈兩種方式去檢視發生問題的空間與人，並發展出一套「惡靈入侵」的理論。


  大概是因為理論和歷史感做得好，故事的說服力大大提升。沒有太多嚇人的設計，卻可以

  讓人感受到當事人的心理恐懼。相形之下，只出現幾幕的配角「安娜貝爾」，確實成為全

  片最大亮點（可以理解片商不放過機會，讓她首先單飛的心情）。


  雖然可能不會追完「厲陰宅宇宙」，不過能夠拍出像《厲陰宅》這樣不以嚇人為訴求，在

  視覺（鏡頭的運轉）、聽覺（時代感與驚悚感兼具）和故事都讓人喜愛的恐怖片（不看恐

  怖片的人應該也可以看），溫子仁還是滿令人佩服的。


  #預計補完厲陰宅2

  #希望一樣好看



  ***


  這裡是我的樂園：




  ＦＢ：








  --'
