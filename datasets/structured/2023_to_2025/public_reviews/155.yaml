url: https://www.ptt.cc/bbs/movie/M.1465825618.A.EDC.html
title: '[普雷]厲陰宅2/Conjuring 2 -新一代的靈異偵探'
content: 'IMDB: 8.3/10 (連結)

  Rotten Tomatoes:  74% (連結)


  可看指數: 70分

  作為厲陰宅的續集，恐怖感比上一集弱很多，但是有種

  即將成為系列作的feel，可能將來會具有承先啟後的意義。


  說起來這個系列比起去電影院 可能在家看更恐怖?畢竟是發生

  在一般家庭的除魔秀啊



  ==========================防雷===========================



  #恐怖感弱化


  這次主要的惡靈有三個，一個是不知為何找上門來的惡德修女(笑)，

  另外一個就是Hodgson一家遇到的老鬼。第三個應該是惡德修女

  變化而成的the crooked man，中文不知道該怎麼翻譯，長相/性格

  扭曲的男人吧!


  先說惡德修女，這個形象實在塑造得不錯，我覺得今年萬聖節國外

  應該會有機會見到這種裝扮XDD，youtube上也有一堆教人化這種妝的

  (像是這個連結)，只是變得比較龐克。


  我是覺得將神與惡魔連結在一起當然是最恐怖的，如果連神都不站在

  你這邊，還能向誰求助呢?而這個形象主要的意義其實是為了打擊羅姊，

  故意用神職人員的劣化象徵性告訴她:妳的神已經不可信了，妳的神

  不會來救你，諸如此類。


  (其實這種做法還滿中二的，有一種在暗戀的女生喜歡的偶像上亂

  塗鴉的感覺)


  第二個是老鬼，說真的老鬼出現的地方就只有看電視那一幕比較會

  嚇到人而已，其他都很像戀童癖的變態老爺爺，裝扮也不噁心恐怖，

  在電影中也只是惡德修女的一個棋子而已，說真的沒啥好怕，角色

  塑造失敗。


  第三個滿有趣的，使用到了童謠的元素。相信大家都知道像是鵝媽媽

  童謠這種根本是成人向的暗黑童謠很容易激起大人們的好奇，會去想

  到底腦袋裝了甚麼才會做出這樣的童謠，然後背後的故事到底有多

  黑暗之類的。也是一個反差的應用，將兒童的純真與成人的邪闇

  混在一起，矛盾感中產生恐怖的手法。


  而這次選的crooked man本身歌詞也真的很莫名:



  There was a crooked man,

  有個扭曲的男人

  and he walked a crooked mile,

  走在一條扭曲的路上

  He found a crooked sixpence against a crooked stile;

  他在扭曲的階梯上找到扭曲的六便士

  He bought a crooked cat,

  他買了一隻扭曲的貓

  which caught a crooked mouse,

  貓捉了一隻扭曲的老鼠

  And they all lived together in a little crooked house.

  他們一起住在一間扭曲的小房子裡


  到底是誰這麼扭曲才會想出這種扭曲的童謠啊!!!

  小朋友聽了真的不覺得可怕嗎???



  (以下題外話)

  其實這背後是有歷史意義的 (請看這個連結)，這位扭曲人其實

  是指一位蘇格蘭將軍，因為簽了保護蘇格蘭宗教及政治自由的條約，

  讓蘇格蘭跟英格蘭得以"扭曲但和平的"一起生活在同一塊土地上。

  這個解釋也不是太牽強，如果考慮到雙方到底有多討厭彼此的話


  還記得我在英國念書時剛好遇到世界盃足球賽，英格蘭輸球的隔天

  馬上成為蘇格蘭各家報紙頭條，普天同慶，由此可見一般。


  (題外話結束)


  總之，這次童話人物化成噁心的扭曲人出現的確滿嚇人的，而且

  幾次都讓人覺得快要追上來，壓迫感很重。但可惜的是鏡頭不多，

  印象中兩三次而已，覺得有點可惜，但畢竟只是配角中的配角，

  單純拿來嚇人用的，對劇情上來說無關緊要，所以也無可厚非啦。


  不過這裡真的要說電影裡歐美的鬼相較亞洲的鬼，作亂方式等等

  自然不同，不過因為文化不一樣，常常沒有在講甚麼因果關係的，

  看了有時候會覺得莫名其妙，但這種莫名其妙也無形成為一種壓力，

  因為邏輯在這時候不適用。


  這次的厲陰宅2有發揮到這個特點...的一半。就是惡靈的出現跟

  消滅都很莫名，只會覺得這個惡靈不知道在執著甚麼超煩的，

  而沒有"天啊，到底何時才會甩掉他"的被緊追感覺。


  所以這次真的沒有上次這麼恐怖了。



  #有可能系列化

  這次搞了一個雙線劇情在敘事過程中其實還蠻讓人有所期待的，

  就是想說甚麼時候Warren夫妻才要出馬啊。這也讓觀眾們開始

  很自然的信任這對夫妻，好感度up!


  然後這次感覺幾乎是阿德的加分題，一來阿德說實在滿帥的，

  光這點就被少女心影迷們偷加了大概一千分有。然後又貼心又迷人，

  最經典的是這次在Hodgeson一家，當大家都惴惴不安時，露了一手

  自彈自唱模仿貓王(說真的那個鬢角還有潛力的)，挖靠，如果我是老鬼

  真想當場掐死你，根本是來搶鏡的啊(我還在作祟你就來帶動唱是怎樣!)


  然後阿德又勇敢又正直，這次明知自己有死亡的危險，但為了救人

  還是勇闖地下室，在被反鎖關住之後隔著門對羅姊信心喊話，

  充滿光明又捨己為人的一面，不難理解為什麼惡靈想要找上你啦~

  因為對於黑暗的一面來說你太礙眼了!!


  然後阿德還會修水電啊!!!這次也露了一手，想不到查案查到一半

  還要順便幫被靈騷的受害家庭修東西我也是醉了。這麼帥又體貼的

  工具人上哪裡找啦~


  最後，最重要的是阿德超愛老婆!!這次好幾幕都是來曬恩愛的。


  所以這次阿德應該有得一萬分，不過不顧羅姊的擔心硬是白目跑去救人，

  雖然也是應該啦，但是要小扣一千，所以實得九千分~


  包含之前的<安娜貝爾>以及<厲陰宅>的鋪陳，大家漸漸對於這對靈異

  偵探感到熟悉(雖然安娜貝爾他們沒出現)，加上真實世界中的

  Warren夫婦調查案件破千，相信有機會可以拍成第三甚至第四集。


  但個人覺得可惜的是Amityville可能不會拍，感覺好像就直接跳過了。

  如果各位記得的話，在上一集的最後，神父說要跟Warren夫婦討論

  發生在長島的事件，很顯然就是指Amityville，而這集開始也是

  羅姊去調查Amityville時啟動能力才看到惡德修女的，所以

  Amityville的事件是介於<厲陰宅>與<厲陰宅2>之間，看樣子搞不好

  就不拍了。也許是因為已經被拍到爛掉也不一定(目前已經被拍過13次了，

  今年明年又各有一部總共15次。請看wiki連結)。


  另外也可惜的是<康乃狄克鬼屋事件>也被拍過了，可能也被棄守?

  總之一切都是我自己猜測的，畢竟這個模組要來拍續集實在滿吸引人的，

  加上目前1跟2的評價都不差，又有溫哥指導，後續大有可為，

  喜歡的人可以期待一下。



  (寫到最後才覺得說靈異偵探也滿奇怪的，雖然Warren夫婦自己是說

  自己在查案沒錯啦，不過解決的不是人的事情，是鬼的事情，加上前述

  鬼的出現跟消滅往往不具有邏輯性跟合理性，說是偵探好像兜不起來，

  不過也懶得改了)


  --

  隨便寫寫的隨便的心得




  --'
