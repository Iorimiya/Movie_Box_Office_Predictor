url: https://www.ptt.cc/bbs/movie/M.1465605068.A.3B2.html
title: '[好雷] 厲陰宅2'
content: '真的好看!!!



  其實真的被嚇到的點不太多，


  可能因為Marvel板逛多了，導演想嚇人的地方都有感覺XD


  幾個被嚇到的點有：


  珍妮在家看電視，螢幕出現老人倒影，轉頭看沒人，回頭，老人"My house!!!"


  (不過被嚇到之後反而笑了出來，覺得他根本是老番癲XDDD(最後才知道他是被迫的))


  還有艾德到地下室修水管，水裡的老人臉、


  蘿琳和老人通靈時突然拍肩的修女、艾德在帳篷抬頭看到歪頭男等等。





  原PO非常討厭恐怖片用單純的超大音效嚇人(那根本不是怕，只是反射動作好嗎！)


  或是醞釀很久的情緒，結果畫面一轉什麼都沒有，為嚇而嚇的喬段。



  但這部完全沒有這種爛梗XD


  整體氣氛超棒！從一開始的異象，到後來的惡靈爆走，情緒一點一點醞釀，


  中間不時穿插讓人緩和情緒的喬段，讓觀眾可以喘息一下，不會一直很有壓迫感。



  另外最後惡魔有短暫露出真正的樣貌，還有長角，滿符合惡魔的形象的




  變成修女的樣子只是為了褻瀆蘿琳的信仰。





  然後好像有一個小彩蛋還沒人提？(不確定這要怎麼稱呼XD)



  就是在華倫夫婦家，蘿琳看聖經的那個場景，客廳的書櫃上，


  有好幾個高約十公分的英文字母木雕，分散在書櫃的各個地方，


  剛好就是 V A L A K 五個英文字母！



  第一次看的時候有注意到A和K，第二次陪女朋友看的時候刻意去找，果然就是VALAK XD


  因為對劇情沒什麼影響，所以應該只是給觀眾的一個小彩蛋吧~


  不知道其他地方是否也有偷藏VALAK哈哈



  總之，這部真的好看！！！



  --'
