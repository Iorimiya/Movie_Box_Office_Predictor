title: '[負雷] 厲陰宅3'
content: '一直都蠻喜歡厲陰宅宇宙的故事，建立在真實故事上和片尾的資料與錄音都讓人很有帶入感

  但看了第三集後真的是滿滿的失望

  -

  -

  -

  -

  -

  這次故事跳脫以往的惡魔附身，主要是在講述與撒旦崇拜者的詛咒對抗的故事。

  電影在被詛咒的情侶與華倫夫婦的愛情之間來回切換，但這次的敘事節奏真的很卡，常常才剛要沈浸其中就突然跳去另一個地方，所以對於他們的感情始終有點隔靴搔癢。

  而在恐怖氛圍的營造上也是非常不足，所有驚嚇點完全的都在意料之中，對於詛咒儀式的描述也沒有像之前幾部一樣吸引人，不得不說中間那隻泡水肥宅跳出來的時候我真的直接笑出來XD

  難得有一個好的故事架構卻被拍的不上不下，希望下一部可以更好吧……

  -----

  Sent from JPTT on my iPhone


  --'
