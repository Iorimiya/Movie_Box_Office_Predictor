title: '[  雷]  厲陰宅2'
content: '昨天我看了厲陰宅2,雖然在嚇人上普普通通，但是重點這是真的。

  話說回來不知是不是後勁效應，我看完電影後出來要上廁所時，耳裡一直回盪著那個像是

  中年男子低沉嗓音說話的聲音，而且眼角餘光似乎看到一個像是電影裡那畫像裡的人樣子

  的黑色人影……。

  然後我因為也想要條純銀十字架項鍊，當我到店裡看到銀製十字架時突然感覺有種像電流

  般麻了一下。


