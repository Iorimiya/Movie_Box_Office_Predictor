url: https://www.ptt.cc/bbs/movie/M.1465401839.A.62F.html
title: '[好雷] 厲陰宅2'
content: '趁端午連假趕第一天上映看厲陰宅2，看完覺得溫子仁真的很會拍誒～～～～恐怖也不失

  劇情，看全面啟動都有點看不懂的我這次看居然都看得懂（代表這劇情沒很厲害？？XD）

  ，以下對劇情可能有些誤解請大家見諒，也歡迎不吝指正～～（以下有雷）






















  （防雷）
























  一開始就是預告片有出來的女鬼（修女？），用鏡子躲貓貓那一段雖然還是被嚇到但不知

  道為什麼就是有種莫名的喜感XDDD，那時就知道之後會跟後面的劇情有連結，但就是等得

  有點久後面女鬼才出來讓劇情完整。


  後來就是到英國驅魔了，演了好一段時間家裡被鬼騷擾，錄到小女孩聲音變爺爺，華倫夫

  婦來拯救他們一家。


  不過看到中間時，我就開始有點不解，旁邊觀眾看到這應該都有這個疑惑吧？就是被老人

  附身幾次後慢慢知道他的故事了

  就是想要找他的家人但最後無疾而終還獨身死在鬧鬼的那個家中，看到這我都快哭了這老

  人怎麼那麼可憐，所以是看不得別人一家子住在這（但他們是單親家庭也很可憐啊～XD）

  所以產生報復心態？看到這覺得劇情有點牽強啊(~_~;)，而且那老人生前也沒褻瀆神或崇

  拜撒旦為什麼死後就變成魔鬼？這樣好矛盾哦～這片是不是要爛掉了XDDD


  中間有一段那女鬼蠻久沒出場的，所以就忘了她會跟後面劇情有所連結。想到時我也腦筋

  很不靈活，就只覺得該不會女鬼要跟老人鬼一起聯手吧？這樣華倫夫婦破關難度變超高誒

  怎麼辦XDDD


  後來還被不相信靈異現象的人拍到小女孩故意製造鬧鬼現象，華倫夫婦就準備回去了，但

  其實是女鬼控制老人鬼，老人鬼又叫小女孩不能用超自然力量製造鬧鬼現象，讓別人以為

  都只是她自己在惡作劇，讓大家以為她們家只是要騙錢和社會住宅而已，不然就殺掉她們

  全家（女鬼怎麼那麼賤！）


  反正後來女主角還是即時發現老人鬼的訊息（爺爺人怎麼那麼好QQ)，發現都是一開始女

  鬼的計謀！這時劇情就超級昇華了（我覺得啦），因為這樣就可以解釋老人鬼矛盾的地方

  了，還有就是華倫在背對錄音質詢被附身成老人的小女孩時，問到為什麼要迫害他們家，

  他就只是回答喜歡聽他們害怕尖叫（全場這時都笑了），還有為什麼不安息在天堂還來搗

  亂，他也只是說：「我...才不相信基督呢...！根本...沒天堂...！」我在想你在傲嬌什

  麼啦！！這回答也太牽強了吧，後面才了解老人根本被賤女鬼控制，所以傲嬌那段也是精

  心設計的


  雖然這次恐怖的地方沒什麼記憶點，上次看厲陰宅1我整整一個暑假睡覺時都覺得有人會

  拉我的腳，只要那天晚上超過3:07還沒睡我那天晚上就不用睡了XDD，但畫面跟音響的嚇

  人程度還是滿高的（我應該有一大半時間是遮住眼睛吧XD)，但劇情有頭有尾，還是很好

  看！


  --'
