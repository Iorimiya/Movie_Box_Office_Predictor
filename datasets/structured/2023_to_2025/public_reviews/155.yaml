url: https://www.ptt.cc/bbs/movie/M.1668232627.A.70D.html
title: '[討論] 厲陰宅1和2哪個較優(有個人想法雷)'
content: '我前幾天把厲陰宅1和2看完

  本身對恐怖片及鬼片抗性趨於0

  片子只在早上開最小聲看

  但這兩部我卻能把聲音開到最大

  扯遠了

  先說心得，我覺得這兩部都蠻好的


  不過我經過一兩晚的思考後

  認為1似乎比2優秀

  首先這類型的片套路都差不多

  某衰鬼遭遇超自然現象->打鬼角色登場->經過一連串努力打鬼成功(少數是失敗)

  但是在氣氛營造上

  厲陰宅1的舊鄉野房邸、開頭的狗狗抗拒進門、妹妹夢遊、鳥禽自撞

  都能先感受到這裡不尋常

  尤其後來的拍手躲貓貓、地下室拍手(我覺得全片最驚悚的地方)

  都有其詭異背脊發涼之處

  結尾的驅魔段落拍得更是驚心緊張

  華倫太太那撕心得大叫、華倫先生的那句貝斯希芭

  還有被附身的屋主太太想起幸福時光後一道光打在她臉上的畫面感

  都讓我覺得像是玩鬼屋設施被嚇幾輪後終於出設施的安心感


  厲陰宅2比較不同的是

  雖然也是房子鬧鬼，但比較著重於小女孩身上

  不得不提小女孩演的感覺真的不錯

  劇情上比1更多一些曲折

  比如華倫先生把兩部帶子交叉播才發現事情真相

  原本以為的老人鬼只是小棋子，後面其實有更大隻的鬼修女瓦拉克

  可惜的是扭曲人就只是幫忙助拳的(棋子之一)，看不出他在這部戲的重要性

  比較像多一個嚇人角色

  不過這方面1也差不多，1在中後有華倫小女兒遇見安娜貝兒娃娃被嚇死

  2的結尾驅魔比1的畫面上來的緊張

  狂風暴雨、尖木樁、一個一個脫落的窗簾勾環、垂釣在外的小女孩



  總結來說兩部個人覺得都蠻不錯的

  但比較喜歡1那種邪不勝正後的陽光溫暖感

  氣氛上1也比較毛毛的

  不過2的小女孩中邪表情及不安感就比較優秀

  還有寫到有人認為是在騙同情的部分，給2劇情上增添無力感


  所以大家對厲陰宅1和2的優劣看法上是如何


  --




  --'
