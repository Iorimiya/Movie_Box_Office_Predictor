url: https://www.ptt.cc/bbs/movie/M.1501494057.A.8FE.html
title: '[影評] 鬆散或B級片？關於「厲陰宅宇宙」的可能'
content: "鬆散或B級片？ ──關於「厲陰宅宇宙」的可能性\n\n\n就好萊塢而言，現在顯然是個屬於「共通宇宙」的時代。繼漫威獲得驚人成功以後，眾多\n電影宇宙於近年來開始陸續成形，除了同樣以超級英雄作為核心的DC電影宇宙之外，像是\n\
  「變形金剛宇宙」、金剛與哥吉拉的「怪獸宇宙」，以及打算讓環球經典怪物齊聚一堂的\n「闇黑宇宙」，均是近期較受矚目的例子。\n\n以上提及的電影宇宙，大多採取先是分流發展，後來再相互結合，藉此作為系列高潮的經\n\
  營方式。看著那些角色各自發展，同時與相同宇宙的其他角色有所互動，最終在像《復仇\n者聯盟》這類總集式作品裡展開亂鬥，正是這類電影的觀賞樂趣之一。\n\n然而，在這個「大宇宙時代」裡，有一個電影宇宙，無論就類型或發展方向來說，似乎都\n\
  與其它的有所不同──那就是「厲陰宅宇宙」。\n\n\n\n2013年，由溫子仁執導的《厲陰宅》是部叫好又叫座的成功作品。這部改編自真實事件的\n恐怖片，以美國知名的靈異現象研究者華倫夫婦作為主角，描述他們協助一戶搬進鬼屋的\n\
  人家驅除惡靈的經過。雖然在現實生活中，華倫夫婦被不少人視為裝神弄鬼的神棍，但不\n可否認的是，他們兩人的確是相當適合作為系列電影的題材，無論是真是假，光是他們參\n\
  與各式各樣靈異事件的經過，就足以拍成許多部電影。\n\n像這種號稱改編自真實事件的恐怖片其實不少，因此《厲陰宅》的成功，主要仍應歸功溫\n子仁的優異表現。他以出色技巧帶出了整部片的恐怖氛圍，同時還因應1971年的故事時間\n\
  點，利用運鏡、配樂、剪接，甚至是美術設計等環節，為這部電影帶來令人聯想到《大法\n師》等經典恐怖片的特質，使這部片的風格可說是新舊並陳，同時更融合得當。\n\n\
  \n\n當然，就跟所有號稱真實事件改編的電影一樣，比起戲劇效果而言，忠實描述事件經過這\n回事，永遠是無關緊要的一環。因此，《厲陰宅》自然也有不少改編之處，就算是比較忠\n\
  於原本事件說法的部份（我得承認，會用「說法」一詞，是因為我個人認為電影裡的華倫\n夫婦形象，實在遠比現實生活中的他們要來得讓我感到信賴），也同樣經過了大幅渲染而\n\
  成。\n\n像是這種大肆渲染的情形，在片中最為明顯的，應該就是安娜貝爾的部份了。就華倫夫婦\n表示，安娜貝爾是一具被惡靈附身的娃娃，原本為一名護校學生所擁有，後來由於作祟之\n\
  故，使護校學生請求華倫夫婦協助，最後則被華倫夫婦安置於「華倫博物館」將其「封印\n」起來。在《厲陰宅》中，護校學生與安娜貝爾的事件被放在全片開頭，雖然後面仍有安\n\
  娜貝爾的戲份，但嚴格來說，這個娃娃與故事主線並沒有太大關聯，只是被拿來加強恐怖\n懸疑的氣氛而已。不過，由於安娜貝爾的段落使人留下深刻印象，加上其造型極為詭異之\n\
  故，因此使這個娃娃意外成為了片中最為搶眼的「角色」。\n\n\n\n\n有趣的是，如果你曾上網查過現實中的安娜貝爾，就會發現其造型與電影中的模樣可說天\n差地遠，絲毫沒有讓人覺得恐怖的感覺。除此之外，由於《厲陰宅》的賣座，也使電影公\n\
  司於隔年推出了《安娜貝爾》一片，以交代安娜貝爾起源的方式，將這部電影作為《厲陰\n宅》的外傳之作。\n\n正如前頭所說，華倫夫婦宣稱的「安娜貝爾事件」，其實早在《厲陰宅》的片頭便已交代\n\
  完畢，因此《安娜貝爾》一片的故事，則完全是電影公司編寫而成，也使《厲陰宅》原本\n強調的「真人真事」，在此成為了無需理會的元素。\n\n就評價來看，《安娜貝爾》是一部令人失望之作，全片節奏極為鬆散，恐怖氣氛與娛樂效\n\
  果也遠遠不及《厲陰宅》。只是，在《厲陰宅》優秀表現的餘蔭之下，依舊使《安娜貝爾\n》拿下了出色票房，使電影公司於上片不久後便宣布續集計畫，就連同類恐怖片前輩「鬼\n\
  娃恰奇」系列的製作人，也於當時表示希望能讓恰奇與安娜貝爾一起拍部像是《佛萊迪大\n戰傑森之開膛破肚》之類的電影。\n\n\n\n2016年，溫子仁回鍋執導的正統續集《厲陰宅2》，創下了比第一集還優秀的全球票房，\n\
  於評價方面也延續了首集的成功，使人對這個系列因此重拾信心。溫子仁除了延續首集的\n整體風格以外，在許多地方甚至更展現出他對恐怖片的充分了解，於大量細節中精心安排\n\
  與過往恐怖片刻意相反的呈現手法，使這部片的嚇人橋段甚至比前作還更具創意，表現可\n說傑出無比。\n\n就在《厲陰宅2》再度獲得成功的同時，電影公司也正式宣布將延續《安娜貝爾》的作法\n\
  ，準備將《厲陰宅2》裡一名身穿修女服的惡靈獨立出來，拍成名為《The Nun》的外傳電\n影。到了不久前的五月，隨著《安娜貝爾：造孽》即將上映，電影公司更宣布《厲陰宅3\n\
  》也進入了前置階段，同時他們還會針對《厲陰宅2》中出現的另一名惡靈「扭曲人」，\n拍攝第三部獨立外傳，等同於宣布了「厲陰宅宇宙」的正式成形。\n\n以「厲陰宅宇宙」目前為止的三部作品來說，這個系列的發展實在讓人好奇不已。就製作\n\
  方面而言，由於本系列的成功相當仰賴於溫子仁的出色表現，因此接下來的作品是否能延\n續兩集《厲陰宅》的水準，或是淪落到像《安娜貝爾》那般令人失望，自然成為了許多恐\n\
  怖片支持者所關注的焦點（不過就現階段《安娜貝爾：造孽》的影評成績來看，本片似乎\n比前作出色許多，因此讓人寬心了些）。\n\n\n\n 至於「厲陰宅宇宙」系列電影彼此之間的關聯性，也同樣是件讓人相當好奇的事。就目\n\
  前的發展來看，本系列的主要核心仍集中於華倫夫婦身上。被拍成獨立電影的安娜貝爾、\n鬼修女與扭曲人等角色，均是華倫夫婦在驅魔時所遇見的惡靈，因此就先天條件來說，這\n\
  個系列比起其它電影宇宙而言，在關聯性部分勢必會顯得較為鬆散，否則要是「厲陰宅宇\n宙」真的如同其它電影宇宙模式，讓這些惡靈在後來的某部電影中組成「惡鬼聯盟」之類\n\
  的團體，同時與華倫夫婦展開一場盛大對決，或是乾脆如同《佛萊迪大戰傑森之開膛破肚\n》、《異形戰場》或《貞子vs伽椰子》那種彼此互搶殺人業績的情況，只怕反而會徹底破\n\
  壞掉系列至今打造出的嚴肅調性，就此變成惡搞意味十足的B級片路線。\n\n\n\n\n\n 當然，要是「厲陰宅宇宙」真的朝上述方向走去，就電影公司的營利角度來說，倒也不\n\
  會太讓人感到意外。畢竟，在恐怖片的領域裡，早就不乏許多像是「鬼娃恰奇」那類從恐\n怖片變成惡搞喜劇的系列作，更別說對於部分恐怖電影迷而言，這類作品甚至還更具吸引\n\
  力一些呢。\n\n而這正是「厲陰宅宇宙」最讓人覺得有趣的地方。一邊是彼此關係鬆散，藉此維持嚴肅調\n性；另一邊則是朝B級片方向慢慢靠攏。這個系列的未來究竟會偏向哪邊？是不是有可能\n\
  出人意表地走出一條屬於自己的第三種路線？一切的答案，就有待時間解答了。\n\n\n\n\n新聞連結\n\n\n--"
