title: '[討論] 《厲陰宅3》在電影版的評價如何？'
content: '厲陰宅3跟厲陰宅1、2比的話，個人認為其實算普通。第3集雖然有走出跟前2集不一樣的

  風格，但整體來說電影裡的靈異現像沒有比厲陰宅電影宇宙裡的《鬼修女》、《哭泣的女

  人》來的好看。







  電影故事是否有不符邏輯的地方呢？







  比如說第3集的女魔王為什麼要用她的靈魂去換來詛咒其它的人？    她去召喚了詛咒對

  她會有什麼好處嗎？






  電影故事好像沒有解釋到女魔王之所以去召喚的原因。








  不知道《厲陰宅3》在電影版的評價如何 ?


  --'
