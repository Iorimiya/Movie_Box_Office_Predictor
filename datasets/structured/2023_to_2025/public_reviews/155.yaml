url: https://www.ptt.cc/bbs/movie/M.1465917715.A.B2F.html
title: '[好雷]《厲陰宅2》恐懼的美學'
content: "我有興趣的不是凶宅的典故跟邪靈的身世，而是，倒底是什麼觸發了\n\n我們深層的恐懼感？又是怎樣的把戲，把人玩得心裡發毛？\n---\n\n\n\
  　詹姆斯溫手下出了三集《陰兒房》系列，成就了靈媒阿婆艾莉絲和她的兩個\n楞呆小夥伴，借助科學儀器「觀落陰」，深入幽冥尋回被邪靈綁架的三魂七魄\n的故事。《陰兒房》的恐怖美學，就在於同個室內場景，慘藍的光一打、地上\n\
  乾冰一吹，瞬間成為別具「舞台劇感」的異度空間，主角拿著忽明忽滅的提燈\n，聽著隔層玻璃般陽間遠遠傳來的喊聲，一步步摸索進冥界與人間的隙縫之中\n牽魂。那畫面，就像早期港產鬼片一樣，乾冰的另一端拉過來一條繫著符咒的\n\
  紅繩，斷了，就回不去了。\n\n\n　拍到第二集的《厲陰宅》也自成一格，形塑了「驅魔夫妻檔」艾德和蘿琳華\n倫的世界觀，而且還有一隻叫做「安娜貝爾」的「吉祥物」會固定露臉，故事\n\
  走的是傳統西方凶宅驅魔片的路數。詹姆斯溫同樣也為《厲陰宅》系列打造出\n專屬的恐怖美學，就是他們夫妻倆宛如刑事局生人勿近的凶器證物收藏室架上\n，一個個驅魔個案「簽結」後留存下來的「邪靈道具」。這些物件上頭彷彿還\n\
  有不安份的咒怨附著，好像隨時就會解開封印作亂。它們是泛黃老舊的木刻人\n偶娃娃、碟仙板、鐵皮音樂盒…被放置在碎花壁紙泛潮斑駁的老房子角落，營\n造出老照片裡「念念不忘」的陳腐氣息，自然召喚出來自陰界的「迴響」。這\n\
  集厲陰宅就有畫得像小丑一樣詭異枯瘦的歪頭男音樂跑馬燈，會在半夜長廊盡\n頭的無人帳篷裡兀自旋轉啟動，播放起音質老舊的英國童謠；還有被不知道是\n什麼力量從玩具堆裡推進弟弟臥房，撞到他腳邊的玩具車。\n\
  \n\n\n　即便兩個系列的恐怖美學各有千秋，但都還是能找到屬於詹姆斯溫幾乎簽名\n式的手法！像是都採多線合併敘事的方式、西洋驅魔配合東方鬼嚇人的鏡子把\n戲、尖銳詭異的心理音效、伴著懷舊鄉村民謠登場的鬼怪\
  \ (這次電影一下讓死\n不瞑目的鬼老頭吹著我們熟悉的綠油精廣告歌的口哨登場，一下又貢獻了一首\n半夜聽來格外毛骨悚然的童謠) ，還有前半部堆砌神秘懸念，後半段猛爆性鬧\n\
  鬼的結構。\n\n\n  特別的是，他對好萊塢鬼片幾乎用到走火入魔的CG特效的節制，因為CG畫過\n頭就不是鬼，是怪獸了；他反倒滿堅持早年香港鬼片、泰國靈異邪降片、日本\n\
  的貞子、伽耶子那套青光一打，真人演員披頭散髮滿臉屍妝扮鬼在螢幕角落忽\n然現身嚇人的那套。\n\n\n　說真的，特效畫出來的鬼，太虛、太透，還不如一個實體存在的鬼飛撲而來\n\
  的那種讓人感覺無法閃躲，就要被屍體、死亡觸及的壓逼力。而且那種帶著驚\n嚇與絕望的恐懼，像是病毒，會沿著瞬間發冷的雞母皮感染全身，就像被貞子\n扒上的手腕會留下黑色的印痕、被恐懼嚇死的臉孔肢體會極端扭曲那樣。\n\
  \n\n\n  《厲陰宅２》的嚇鬼招數雖然都還在停上一集跟《陰兒房》系列的基礎上，\n但強度與密度無疑是變本加厲地下足猛藥！雖無上集幾乎讓心臟被嚇停一秒的\n\
  親子捉迷藏碰上「鬼拍手」的神來一筆，但這集在蘿琳華倫預知的夢境中，那\n個掛在牆上栩栩如生的邪靈畫像，如影隨形，觀之在前忽焉在後，最後在空間\n中游移的影子，在女主角驚懼的凝視間，貼靠上牆面的肖像，緊接著超現實地\n\
  從畫布之後伸出枯爪扒住畫框，鬼影從 2D 轉3D，迎面撲向女主角！真是他媽\n的太夭壽也太有創意了！戲院裡有一半人嚇傻、一半人笑翻，笑翻的人裡，有\n一半是覺得太歡樂太有梗，另一半估計是用笑聲掩飾剛剛的恐懼。\n\
  \n\n　回頭說故事，1974 年11月14日美國紐約長島海洋大道112號發生滅門血案，\n其後搬進這棟大宅的賴茲夫妻住了28天，不堪邪靈騷擾被嚇得逃離鬼屋，【安\n\
  米提威爾凶宅】自此也成了往後十多部凶宅電影的改編藍本。《厲陰宅２》用\n這個案子做引子，蘿琳藉著通靈「重返犯罪現場」，尋找長子口中在背後不斷\n蠱惑他用長槍轟殺一家六口的凶靈。接著跨海辦案進入主劇情，用復刻的精神\n\
  重現了英國倫敦知名的【恩菲爾德靈異事件】：主角夫婦探訪獨自拉拔四個兒\n女的單親媽媽一家人，親見連警察來都照樣家具掛飾被狂暴地掀翻的靈動場面\n，以及見聞被陰魂不散的亡故前屋主附身的11歲女兒，從她口中發出七十多歲\n\
  老人蒼啞聲線的邪笑與嗆聲。\n\n\n\n\n　詹姆斯溫的鬼片，雖然不像「大法師」那樣考驗與辯證信仰，但他在猛鬼鬧\n房的劇情裡，也玩出傳統一個腸子通到底的凶宅驅魔片所玩不到的劇情轉折！\n\
  雖然它的故事也有像《雙瞳》最後功虧一簣的「有愛不死」論調，但他卻能真\n的把在幽冥生死拔河間，為了愛情與親情無我犧牲的人性光輝給拍出來。\n\n\n\n　特別要說的是，詹姆斯溫在《厲陰宅２》對傳統凶宅鬼片架構的突破。一般\n\
  來說，靈異片很愛遵循希區考克「桌底下的炸彈」的懸念理論：他說，如果觀\n眾和演員都不知道桌下有炸彈，那爆炸時，觀眾和銀幕上的角色都會一起大吃\n一驚！但假若觀眾知情，甚至知道誰放的，但演員們卻不知道，那麼銀幕上眾\n\
  角色爾虞我詐的對話，就會顯得饒富深意，同時觀眾的情緒也會隨著炸彈即將\n引爆而緊張！最後是安排一個女人或孩子的角色和觀眾知道危機，但無論角色\n怎麼說，旁人死活都不信，這時觀眾就會跟著角色一同陷入不被了解的孤立無\n\
  援處境。《厲陰宅２》的突破，就在於起手式就營造出集體的危機感，這種主\n角群統一陣線對抗邪惡的手法，往往在對抗外星大軍的動作災難大片才會用上\n，可想見《厲陰宅２》這次的邪靈有多凶，按台灣民俗概念來看，差不多就是\n\
  穿紅衣去自殺的厲鬼等級！這樣的處理，勢必需要更細緻、更包藏禍心的懸念\n與轉折來處理故事。而《厲陰宅２》也真的做到了！它在【紐約安米提威爾凶\n宅】與【倫敦恩菲爾德靈異事件】間，串出一個魔王等級的凶靈，它隻手遮天\n\
  把所有人物、事件、亡靈都當作棋子，一步步引主角入局的奪魂故事。\n\n\n\n\n\n咳咳…咳咳…雖然，它最後收得稍微有點……青菜。\n\n\n---\n\n\
  這夜配著圖，再聽一次歪頭男的童謠吧\n\n>>  \n\n---\n\n--\n  謝謝指正。\n謝謝指正，我想我的『他手下也出了三集』的文意\n除了執導，也包括了監製。"
