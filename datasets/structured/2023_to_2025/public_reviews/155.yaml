url: https://www.ptt.cc/bbs/movie/M.1466479367.A.E79.html
title: '[新聞] 印度一名男子在觀賞《厲陰宅2》後身亡'
content: '根據 Times of India 的報導，一名 65 歲的男子在印度蒂魯瓦納馬萊城鎮觀賞驚悚電影

  後後送醫不治，當地警方表示，兩名男子於上週四晚上相約去戲院看甫上映的驚悚片《厲

  陰宅2》（The Conjuring 2），其中一位在觀賞的過程中突然感到胸痛且昏厥，送醫後依

  舊不治身亡。


  詭異的是，一名醫務人員準備將屍體從原先的醫院轉移至蒂魯瓦納馬萊政府大學醫院進行

  進一步的驗屍後，他卻與屍體一同消失不見，目前尚未有消息更新整起事件的真相，從電

  影院到醫院以及轉送的過程因為《厲陰宅2》變得相當詭異。


  由溫子仁執導的本片，在上映之後已經在全球累積超過 1.8 億的票房，縱然這次續集有

  不少感人的情節和設定，但依舊有大量恐怖、驚悚、嚇人的橋段，如果有心血管疾病的觀

  眾，絕對還是要斟酌。



  來源：


  --'
