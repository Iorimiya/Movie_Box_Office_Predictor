url: https://www.ptt.cc/bbs/movie/M.1465564790.A.17D.html
title: '[好雷] 厲陰宅2-驚悚的真實事件與難料的結局'
content: '>>網誌圖文好讀版：


  《厲陰宅2：The Conjuring 2》改編自華倫夫婦最顯赫的一次真實驅魔事件：「恩菲爾德靈異事件」，這起靈異事件發生在1977年的倫敦，一名單親母親帶著四名子女搬到恩菲爾德小鎮的房子後，便不斷地受到惡靈侵擾。原先已經決定不再執行驅魔的華倫夫婦，受到教廷的請託前來調查靈異事件真偽，才發現這起事件背後的惡魔，目的遠不止是趕走生靈而已...。


  《厲陰宅2：The Conjuring 2》是個成功續集電影，在劇情上有著簡單的連貫元素，走出與前作不一樣的路線，沒有受到以前的成功框住了現在的創意。營造可怕氣氛說引人入勝的鬼故事之外，劇情裡真實溫暖的「人味」更能引起觀眾共鳴，受害母親對孩子的愛以及華倫夫婦之堅定的情感，都是最後能擊敗惡鬼的關鍵。


  鬼故事要能夠成功地嚇到人，最重要的關鍵就是令人相信其真實性，《厲陰宅2：The Conjuring 2》在電影片尾播放了當年的受害者訪談錄音，駭人的古怪老人嗓音千真萬確地從小女孩口中說出，讓人驚覺剛剛電影中的場景還原度是多麼地擬真，加上許多真實事件照片與劇照的對比，更加深了電影的代入感，走出戲院後依然能感受到震撼氣氛的纏繞。


  以上為無雷心得，以下將有關於劇情的描述~


  飾演Lorraine Warren的Vera Farmiga真的十分擅長驚悚劇情的角色，憂心忡忡的蹙眉，若有所思的眼神，柔情溫溫暖的淺笑，以及突然爆發的堅毅能量，將具備天賦能力卻又懼怕能力的掙扎與勇敢演的精彩服人。Vera
  Farmiga在美國影集《Bates Motel：貝茲旅舍》有著近乎一樣的角色特質，飾演經典驚悚電影《驚魂記》中發瘋兒子的母親諾瑪，是個強勢堅定的單親媽媽，照顧著受精神疾病困擾但不自知的兒子，在詭譎的小鎮中開旅舍求生存，喜歡她的觀眾可以參考這部驚悚氣氛滿點的美劇，會更折服於她的演技。


  相關文章：《貝茲旅舍》第一季影評：


  《厲陰宅2：The Conjuring 2》故事開始回顧了Lorraine Warren在安米提威爾事件中看到的幻象，一名類似修女形象的惡靈殺了她的丈夫，Lorraine認為這是一個警告，警告他們不要再插手惡魔的事務，否則將面臨可怕的後果。接著這個警告更加嚴厲，同樣的惡靈出現在丈夫Ed
  Warren的夢中，並在Lorraine的通靈感應裡與她對峙，惡靈先是躲在倉庫的陰影，遮蔽房間裡的光線後從描繪自己形象的畫作中衝出，慌張無措的主角對比強勢的惡靈是最有威脅性的一幕。


  在恩菲爾德小鎮的受害一家人，一開始只是女兒Janet會看見幻象，與不存在的人說話，或是半夜夢遊到奇怪的地方，當母親指責女兒惡作劇時，整個房間都陷入瘋狂，家具亂飛砸裂，門窗巨響地緊閉，最後那個臥室僅能懸掛十字架而無法住人。華倫夫婦介入後惡靈變本加厲，直接威脅到了Janet的性命，逼得華倫夫婦要求直接與惡靈攤牌對話。


  Janet的演出在電影裡也是一大亮點，豐富的情緒表達與被附身時的轉化相當有力道，深深地表現出那種令人憐憫的痛苦感受，尤其是接受採訪錄音的那幕非常毛骨悚然。電影的另一個有趣之處是加入了懷疑論者的存在，加深了「懸疑」成分，給觀眾思考「會不會一切是造假」的可能性，透過記者與靈媒正反論調研究者的角度去挑戰整起事件，讓劇情在收尾時的轉折更加精彩。


  當華倫夫婦最終無法證明惡靈存在真實性並離去後，Janet一家人陷入最深的絕望，此時Janet轉頭對家人說：「如果我剛剛不演出我在造假的話，它就會殺了你們」，原來這惡靈的心機之重啊！緊接著Janet被獨自困在屋中面臨死亡，剛搭上火車的華倫夫婦從兩次訪談的錄音帶中拼湊出線索，發覺惡靈背後有惡靈，附身在Janet身上的老人鬼魂只是一個棋子，實際上的主使者就是華倫夫婦一開始共同預見的惡鬼，它要Janet死且不受干擾。（但這後來沒有解釋原因，比較草率地收尾）


  趕回恩菲爾德的兩人拼命要衝進屋內，夫妻意外地被地下室的門拆散，他們隔著門板深情地互相告白，兩個同樣飽受天賦之苦的人好不容易找到可以信任的彼此，不願意冒著危險分離。夫妻兩人的深厚感情在電影中有許多細節呈現，其中最感人的就是這首背景配樂：



  儘管面臨危險，但Ed的使命感勝過了一切，他必須盡全力拯救他能救的人，於是先行離開尋找Janet，困在門外的Lorraine眼看著自己遇見的丈夫之死即將發生，夢中那顆致命的樹尖像劊子手般矗立在那，危急之下她想通了老人鬼魂的謎語解法，惡魔之名早在她通靈時已經出現，她翻出被劃爛的聖經，從破碎一半的門衝入屋中。最後一幕，Lorraine看著只差幾呎就要與Janet一同墜撞樹尖的丈夫，疲憊但拼命地喊出驅魔經文大嚇惡魔之名"Valak"，在生死懸線間救回了丈夫與女孩。結局算是中規中矩，雖然沒有解釋惡魔自曝弱點以及為何要殺死Janet的原因，但仍不減整個電影

  驚悚懸疑的魅力，過程中的氣氛營造與情節轉折都深刻記憶。


  相關文章：非死不可-影評：


