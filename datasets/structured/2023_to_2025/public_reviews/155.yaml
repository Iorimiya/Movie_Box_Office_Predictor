url: https://www.ptt.cc/bbs/movie/M.1466052802.A.8B4.html
title: '[新聞] 《厲陰宅 2》邪惡鬼修女將拍攝獨立外傳電影《修女》'
content: '華裔導演 溫子仁（James Wan）的《厲陰宅 2》（The Conjuring 2）上週在全球陸續上

  映，在北美開出破 4 千萬美金的首週末票房成績，擊敗環球影業的《魔獸：崛起》（

  Warcraft）以及獅門娛樂的熱門續集《出神入化 2》（Now You See Me 2）等同檔上映的

  強片，榮登票房冠軍。新線影業也趁勢，宣布將拍攝《厲陰宅 2》中的邪惡鬼修女外傳電

  影，目前定名《修女》（The Nun，暫譯）。


  《厲陰宅 2》的共同編劇《孤兒怨》大衛萊斯里約翰遜（David Leslie Johnson）將執筆

  劇本，《厲陰宅》系列的導演 溫子仁和製作人 Peter Safran 也將擔任《修女》的製作

  人。


  有趣的是，鬼修女這個角色是在《厲陰宅 2》上映前三個月才臨時被加進電影當中的，再

  此之前的版本中，這個角色的原本是以帶角惡魔的形象出場，直到最後一刻 溫子仁才設

  計出鬼修女的概念，新線影業更為此答應重拍電影中的部分片段，並找來《穆荷蘭大道》

  Bonnie Aarons 帶濃妝演出修女一角。


  《修女》並不是《厲陰宅》系列衍生的第一部外傳電影，2014 年的《安娜貝爾》（

  Annabelle）便出自《厲陰宅》中被附生的恐怖娃娃，該片上映後獲得大成功，共收穫全

  球 2 億 5 千 6 百萬美金的票房，是製作預算的 40 倍，而新線影業也已經著手準備《

  安娜貝爾》續集，定檔 2017 年上映。


  《修女》目前上映時間未定。



  --'
