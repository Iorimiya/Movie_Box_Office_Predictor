title: '[新聞] 恩菲爾德鬼屋探險 厲陰宅2推虛擬實境影片'
content: "恩菲爾德鬼屋探險 厲陰宅2推虛擬實境影片\n\n2016/05/25 19:37\n\n\n《厲陰宅2》釋出虛擬實境影片。（擷取自YouTube）\n\
  \n〔記者盧家豪／綜合報導〕恐怖電影《厲陰宅2》上映在即，電影公司日前在官方YouTube\n釋出一支全3D的影片，只要用手機上YouTube的App或電腦觀看，就能邊看邊移動視角，體\n\
  驗片中主角遇到鬼時四處張望的緊張感！\n\n\n用YouTube的APP看的話，點選右下角的眼鏡按鈕可以切換觀看方式。\n（擷取自YouTube）\n\n影片釋出後已經超過百萬點閱，使用手機觀看的觀眾可以配合VR眼鏡或直接移動手機本體\n\
  ；若是使用電腦觀看，則可以在影片播放期間用滑鼠或左上角的方向轉盤移動視角，一探\n鏡頭視線外究竟發生甚麼事。\n\n\n若是用電腦看就使用滑鼠或右上角的方向鍵調整視角。（擷取自YouTube）\n\
  \n《厲陰宅2》改編自「恩菲爾德事件」，是人類史上最廣為記載、歷時最長也是最多目擊\n者的一次鬧鬼事件，電影請到溫子仁執導，由第一集原班幕後團隊製作，將於6月8日全台\n\
  上映。\n\n\n\n\n\n--\n\n                                                          \
  \   \n\n--"
