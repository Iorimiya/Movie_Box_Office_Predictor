title: 'Re: [請益] 厲陰宅、安娜貝爾、鬼修女之觀看順序？'
content: '基本上照上映順序觀看就好，不會有什麼影響。


  如果要了解系列的時間先後順序，底下是以影片主要場景的時間為準:


  1952年 鬼修女


  1955年 安娜貝爾：造孽


  1967年 安娜貝爾


  1969年 安娜貝爾回家囉


  1971年 厲陰宅


  1973年 哭泣的女人


  1977年 厲陰宅2


  1981年 厲陰宅3：是惡魔逼我的



  外傳系列的時間都早於主系列，主系列目前3部的時序跟集數相同。



  --'
