url: https://www.ptt.cc/bbs/movie/M.1465551127.A.ECD.html
title: 'Re: [好雷] 厲陰宅2 但沒有邏輯 '
content: '惡靈的目標純粹是要珍妮死，以致於就算珍妮躲到鄰居家還是沒有用。

  而當珍妮一家都被誤會自導自演，小孩彼此懷疑、媽媽在廚房痛哭，整個磁場意志薄弱到

  極致時惡靈才能如此操控珍妮自殺。


  華倫夫婦雖然是因為機緣巧合被教廷派去協助調查，但說到底 這一切都如艾德所說是命

  中早已註定的，


  所以蘿琳才能夠一直預知到他們會遭遇修女惡靈這個劫難，


  並不是惡靈真的現身他們家自曝姓名，那是蘿琳預知的夢境（個人認為包括得知姓名也是

  蘿琳的能力高），

  很多人都誤會這段，從他女兒玩串珠發現走廊外有人影開始已是夢境了。

  她激動的在聖經裡寫字被一旁還在玩串珠的女兒搖醒才真正醒來害怕的哭泣。


  不過蘿琳自己也不知道劫難什麼時候會發生，只能叫艾德不要再接案子避免劫難。

  （但是如上所說命中已註定才造成預知，他們還是接了倫敦案）


  惡靈不希望華倫夫婦多管閒事，所以威脅珍妮在鏡頭面前演戲趕走它們 否則殺死全家。

  （這點也驗證惡靈目標非華倫夫婦）


  老人並不知道蘿琳預知過惡靈。

  只是老人回來找不到家人、想要走卻被惡靈束縛走不了，

  所以利用錄音帶交叉求救暗示他們背後還有人操控不讓他走，他們才聯想到也許和惡靈有

  關。


  蘿琳在感應中問老人該如何趕走惡靈，老人害怕不敢明講只說了一段謎語讓蘿琳自己去猜

  ，艾德在回程的車上解出答案是名字！





  個人認為原原PO的論點疑問都太過較真了！


  那感覺就像我小時候看電視有人被撞時，會對著電視大喊：跑啊！愣在那幹嘛！很假欸


  但當你實際遇到這個情況，你真的會嚇到不知道該進還退而就站在那被車子撞下去。





  --'
