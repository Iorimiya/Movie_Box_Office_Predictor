url: https://www.ptt.cc/bbs/movie/M.1465745137.A.B8F.html
title: 'Re: [討論] 看厲陰宅2 遇到吃東西大聲的觀眾'
content: '我昨天新莊看厲陰宅也有遇到跟吃東西很大聲一樣討厭的人


  附近有2個女的不好好看電影,一直在滑手機


  想說滑一段時間她們終於要關手機好好的看電影了


  我也能不再分心進入氣氛裡


  沒想到 她X的! 只要有人傳訊息 她們手機就會亮 還一閃一閃


  然後就又開始滑,這個光在陰暗的電影院真的很難不被忽略


  還是一閃一閃 煩死了!


  後來我受不了就只能往前坐,眼不見為淨


  也有人也是換位子跟我一樣往前坐


  幸好那個場次只有坐4成,要是滿座 我不就整場就被手機亮光閃就飽了


  這麼愛滑是不會回家滑嗎? 愛滑多久隨妳便


  這樣是能全心全意觀賞嗎? 不覺得很浪費錢嗎?




  --

  要是滿座 我會直接叫她們出去, 因為前面都沒人坐 想說算了 我往前遷就一下


  以前遇到一直講話的白爛,我當場說" 要講話滾出去,當其他人白癡?"


  我講完旁邊不認識的 還給我一個大拇指


  我這人是會制止的喔, 是前面一排都沒人坐 我就往前坐了

  要是滿座我會直接講

  該不會是你吧....

  直接開手電筒 還是七彩的來閃她'
