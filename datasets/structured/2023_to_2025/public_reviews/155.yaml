url: https://www.ptt.cc/bbs/movie/M.1528897116.A.6C4.html
title: '[請益] 類似厲陰宅宇宙的(喜劇)恐怖片??'
content: '都沒有人覺得厲陰宅系列根本就是喜劇片嗎？


  不管是不是溫子仁親自執導的   這系列都有一個特色


  總是用鏡頭和音效故弄玄虛  常看恐怖片的人以為嚇點要出現了


  結果要不就是根本沒有嚇點  就直接轉到下個場景


  要不就是聲東擊西  突然讓鬼從意想不到的角度跳出來嚇人


  或是更有趣的  恐怖片常見橋段:  明明知道有靈異現象


  明知不合理  還要讓演員故意鐵齒地去給鬼抓


  如安娜貝爾2  小女孩有機會脫逃還故意跑回去井邊給鬼掐脖子


  種種刻意安排的橋段   搭配女觀眾的尖叫聲


  如果在國外看  還會有觀眾喊: "Don''t. Don''t go back!!"


  "She''s gonna kill you."


  真的是笑果十足  附近的觀眾也會跟著偷笑或大笑


  同樣是溫子仁導的陰兒房系列就沒有這種效果


  唯一能想到的就是鬼關燈吧


  還有其他類似的電影嗎？


  像鬼影或見鬼10這種直接插入笑點的不算喔


  --'
