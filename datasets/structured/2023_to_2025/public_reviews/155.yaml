url: https://www.ptt.cc/bbs/movie/M.1465742266.A.D0E.html
title: '[討論] 看厲陰宅2 遇到吃東西大聲的觀眾'
content: '我昨晚在日新威秀看厲陰宅2


  坐我斜前方的仁兄手上捧著一大包滷味


  從電影開始就一直吃  一直吃


  不斷拿牙籤在那邊翻料


  塑膠袋摩擦的聲音真的超煩




  尤其這種恐怖片


  有很多極度安靜的時刻蘊釀情緒


  你他媽的一直在那邊翻翻翻


  是找不到脆腸膩！




  我很想拍他肩膀請他小聲


  無奈我兩中間還隔一排座位


  厲陰宅2是一部好電影


  但很多片段我都因為塑膠袋聲音出戲




  真的很討厭這種影響他人看電影的觀眾


  您可以自己租DVD回家看


  不要出來破壞別人享受電影時光！



  -----

  Sent from JPTT on my Samsung SM-N9208.


  --'
