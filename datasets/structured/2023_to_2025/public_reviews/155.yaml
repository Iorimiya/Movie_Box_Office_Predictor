url: https://www.ptt.cc/bbs/movie/M.1470152880.A.6A6.html
title: '[微好雷] 《厲陰宅2 The Conjuring2》'
content: "美國  USA\n導演  溫子仁 James Wan\n     （玩命關頭7、陰兒房、厲陰宅、歡迎光臨死亡小鎮）\n\n\n\n      \
  \ 溫子仁拍《厲陰宅》第一集只花了兩千萬美金，便創下了全球\n三億兩千萬美金的票房，算是再《奪魂鋸》之後再下高峰。厲陰宅第一集\n不但可怕，溫子仁更創造了一個鬼片新的敘事方式，鬼不單單只是嚇人，\n\
  更有許多的背景、動機甚至是意圖，再最後人鬼交鋒時更以親情扣合，讓\n結尾收的漂亮並且感人。\n\n       厲陰宅2雖然也稱得上是高分數的鬼片，但比起第一集還是遜色不\n\
  少。本片是由恩非爾德真實事件改編，即便該真實事件最後被證實為造假\n，但也成為一個經典的題材。\n\n       在鬼片的設定上，似乎主角的家庭不管是單親或是一家人，一定\n\
  要有一種「孤單」或是「孤苦無依」感，在面對未知的恐懼時這種設定便\n會在觀眾心中被放大，並且感同身受。在場景上也會要能建立起一種「溫馨\n正常卻又哪裏怪怪的」感覺，不論是鬼片一定會出現的老房子、地下室或是\n\
  老傢俱等等，以及第二集營造非常成功的小兒子帳篷。\n\n『反面的氛圍』\n\n       溫子仁也很會把「遊戲」扭轉成詭異的開端，不論是小兒子的消\n防車、歪頭男動畫盒，又或是家喻戶曉綠油精的音樂，都是在試圖在觀眾心\n\
  中建立一種「熟悉所以放心」但卻是「連結恐怖的鑰匙」這件事。溫子仁在\n故事線的營造上很擅長做出這種反面氛圍，也很能拿捏這種鬆緊的節奏。\n\n       不過這集可惜的是導演過度想要嚇人的決心，可是卻沒有像第一集\n\
  把各個脈絡線索成功串在一起，導致那種因為嚇人而嚇人的意圖過於明顯，\n不論音效的營造、鬼的現身。又或是走進地下室鬼就會出現，地下室積水就\n會有人溺水，滿牆的十字架最後都會被翻轉（撒旦標誌）等等的情況。氛圍\n\
  的建立過度預設，導致強度也就稍弱了些。\n\n       並且本集的大魔王修女（神似瑪麗蓮曼森）也是毫無頭尾的就忽然\n出現，很無機的變成大魔王最後被消滅，實在是很old\
  \ school。而且當一\n個鬼真的那麼鬼的時候，就沒這麼可怕了。鬼片最可怕的，就是觀眾的想像\n空間啊。\n\n       另外鬼片的攝影也很值得一提，大量運用破水平的鏡頭，尤其是在\n\
  詭異場景上下樓梯時，能建立起一種歪斜感但不被觀眾察覺，類似前景的效\n果。因為鬼片都很常會讓觀眾有種「怎樣怎樣，現在到底是怎樣了」的感覺，\n以致最後謎底揭曉（也就是鬼現身）的鏡頭都特別重要。不論是啷景鬼慢慢現\n\
  身，或是比較復古一點主角佔一半，畫面留白一半給鬼現身，又或是直接跟著\n主角移動的鏡頭運動，都很值得研究。\n\n       大體上來說，我覺得鬼片如果能除了嚇人之餘，再多加情感親情等層\n\
  面的描述，例如鬼水怪談、淒厲人妻、厲陰宅等片，讓恐怖的動機有原因，甚\n至有苦衷，在類型片中又建立起另一種類型，最後的收尾檔次一定更高。\n\n--\n 哈 抱歉抱歉\
  \ 我改一下"
