url: https://www.ptt.cc/bbs/movie/M.1465405691.A.CAC.html
title: '[爽無雷]【厲陰宅2】超爽超滿足!'
content: '(先說本人是溫導的粉絲，他的作品每部都有看。)


  　　真是太靠背了真的太好看了！！！完全不輸已成為經典的第一集，氣氛營造依然

  超棒！而且驚嚇點十足！導演的神運鏡和鋪陳，總是讓人無法掌握被嚇的瞬間，整部

  片被嚇了好幾次！看完當下感覺真的好爽好過癮，超滿足！對我來說忍者龜那類的爽

  片根本微不足道。


  　　難得看到驚悚片有這麼長的片長，130分鐘幾乎從頭緊繃到尾，嚇到最後真的讓我

  打從心底覺得這家人好可憐！而且除了非常可怕之外，這次故事還非常溫馨感人！我

  的天啊，人生第一次看到鬼片看到熱淚差點要奪眶而出！啊啊啊啊啊~~真的好棒啊！

  溫子仁真是我心目中的神導演！


  　　另外讓我感到開心的是，我看的那一場【厲陰宅2】竟然是滿場啊啊！坐到第一排

  坐滿滿的滿場，太神了鬼片竟然有這樣的號召力！可見神導溫子仁和第一集的口碑有

  多強！看到這樣的情形感到好欣慰好開心！


  　　說是簡單心得但不自覺又打了很多，加上帶有很多驚嘆號，就可以知道我現在心情

  依然相當亢奮，真心覺得的好好看吶~~~！



  --'
