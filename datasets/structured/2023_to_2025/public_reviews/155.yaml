title: '[討論] 有人9/3也是去文心秀泰看厲陰宅特映嗎'
content: "如題！\n因為當初內容是寫第一集是2D\n第四集是ScreenX，但當天第四集就是完全只播2D的，我跟我朋友還以為我們可能搞錯了，\n \n回家後爬文一下發現其他場（站前秀泰等等…）\n\
  確實是有播ScreenX的\n \n我知道只有幾幕而已，但我們這場是完全沒有，\n目前寫信給秀泰也都沒有回應，請問有同場的人嗎？\n或是有參加其他場秀泰聯映的可以分享是否真的有播ScreenX版\n\
