title: '[普雷]  厲陰宅3'
content: "雷文防雷資訊頁\n\n\n雷\n雷\n雷\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n\n\n\n\n\n\n\n雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文\
  \ 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n簡單來說就是個撒旦崇拜者-女巫  跟惡魔做交易 詛咒人這樣\n\n\
  藉由血祭來崇拜撒旦跟他的惡魔\n\n到最後面被打斷後沒人獻祭就被惡魔殺了...end\n\n整體來說沒什麼嚇人的東西，只有被附身得人像大法師裡的女孩一樣這樣\n\
  \n看it看到崩潰的室友看這個都看到覺得不可怕\n\n整集就是要找到女巫 然後解決掉，是說這集招喚來的惡魔比鬼修女強太多了\n\n\n\n而劇情一開始就在驅魔，包含男女主角、前幾集的神父都在\n\
  \n從一開始的叫David小孩被詛咒後 他姐的男朋友Arne跟惡魔說放走David\n\n要附身就附在它身上，後來產生幻覺殺人進法院\n\n後來為了尋找Arne殺人是因為惡魔逼它做的證據\n\
  \n男女主角開始尋找，途中也有發現其他類似的被附身殺人的事情\n\n最後找了警察幫忙， 結果ED他們發現他們也被詛咒\n\n一共有三個被詛咒的組合\n\n一個是kitty被他的好朋友Jessica捅22刀掛掉\n\
  \n第二個是Arne產生幻覺被附身捅死自己寵物店經理 也是22刀\n\n第三個是ED產生幻覺被附身差點要捅死 女主 後來被制止\n\n一路上求助得神父也被惡魔殺了\n\
  \n最後在神父的家下面的祭壇找到巫師 打爛了施咒台\n\n女巫因為無法施咒就被惡魔殺了 自己被血祭\n\n然後詛咒就結束惹 Arne也恢復正常\n\n就沒了zzz\n\
  \n只能說真的不可怕\n\n但其中會讓人緊張得片段蠻多的\n\n跟前面兩集比起來真的比較無聊\n\n厲陰「宅」的宅 勉強就是開頭小男孩被附身的房子吧\n\n跟房子沒什麼關聯，重點還是女巫詛咒人時放的東西招喚惡魔來附身\n\
  \n去電影院看完覺得蠻浪費錢的\n\n--\n  研究起源製造           報導\n ◢███ /秤珮 智慧手機  我会干  \n ｜不用說 做爆你 超給力\n\
  \    \\   的炸妈 超牛逼\n    絕對是 飞!!的   最夯正\n妹\n / ╯我發明! 弹  !!  宅男女\n神\n\n--\n\n就是很一般的鬼片而已了\n\
  一樣最後面有給照片跟錄音檔\n這樣子要拍第四集我看不可能\n除非溫導自己導\n這樣子的片子應該可以很恐怖的\n但是演成這樣真的頗無聊\n看到獻忌我就想到女巫了xdd\n\
  唯一期待的恐怖片現在看完覺得很空虛\n沒有其他可怕的了zz\n但是說真的若有出四 我還是會花錢去看xd\n跟當初惡靈古堡系列一樣\n沒有任何恐怖的點R\n因為他爸（神父）沒有被詛咒所以被殺不算數吧\n\
  神父被殺應該純粹是幫女主的關係\n\n是翻譯的問題無誤\n是說惡魔長得跟女巫蠻像的\n神父第一眼看到的到底是惡魔還是女巫\n一個正面看到一個背面殺掉他zzz"
