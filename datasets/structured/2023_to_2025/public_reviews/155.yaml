title: '[新聞] 「厲陰宅3」真實音檔曝光 一個人不要聽'
content: "新聞網址：\n\n2021-07-23 17:27 聯合報 記者陳建嘉／即時報導\n\n「厲陰宅3：是惡魔逼我的」的故事是根據一起惡名昭彰的真實犯罪，也是由艾德與羅琳\n\
  華倫經手過的案件中改編而來的。厄尼強生在挑釁大衛葛萊索身上的惡魔後，將房東刺殺\n，之後以惡魔附身在法庭上做為殺人抗辯的理由，在當時引起極大的轟動，近期電影也是\n\
  出最新花絮，並有真實恐怖音檔。\n\n訪談花絮請來當事人，厄尼強生的太太黛比葛萊索強森現身說法，還原當時的可怕經過。\n花絮一開始可以聽到一段黛比的弟弟大衛被驅魔時的真實錄音，大衛發出令人毛骨悚然的\n\
  詭異笑聲…黛比接受訪談表示：「我要把真相告訴大家。我從來沒有一刻能不去想這件事\n，這已經成為我腦中的瘡疤。」\n\n黛比在認識厄尼之後，一起租了間房子，然而黛比的弟弟大衛也是在那時開始被攻擊，承\n\
  受了極大的痛苦。厄尼目睹了一切，認為大衛是被惡魔附身了，決定幫助大衛走出痛苦，\n於是主動挑釁大衛身上的惡魔，要惡魔改附到他身上。幾個月後，厄尼強森犯下謀殺案。\n\
  \n黛比重述當時情況：「1981年2月16日那天，我的老闆喝得很醉，厄尼要我們離開這裡，\n於是我走下樓。之後聽到厄尼發出一聲野獸般的咆哮，我一轉頭就看到我老闆倒在地上，\n\
  並看到他的衣服上有血跡…報社記者事後來訪，我跟他們說了實情，我說：『他當時被附\n身了』。」電影現正熱映中。\n--\n        \n\n\n\n--"
