url: https://www.ptt.cc/bbs/movie/M.1465217333.A.C6A.html
title: '[新聞] 《厲陰宅2》導演溫子仁談論《蝙蝠俠對超'
content: "新聞網址：\n\n《厲陰宅2》導演溫子仁談論《蝙蝠俠對超人：正義曙光》\n\n文/ Sebox\n\n即將要推出《厲陰宅2》（Conjuring\
  \ 2）的當代恐怖電影大師溫子仁（James Wen）上週\n接受了我們的專訪，不過礙於時間關係，我們沒有機會問到太多關於他接下來要推出的\n DC 世界觀作品《水行俠》（Aquaman）的細節。不過在日前的訪問中，他反倒是對於\n\
  \ DC 系列的大作《蝙蝠俠對超人：正義曙光》（Batman v Superman: Dawn of Justice）\n提出了自己的想法。\n\n「我想這是一個非常難以控制的世界觀，而且粉絲的期待永遠都非常高…我在做《厲陰宅\n\
  2》時完全可以了解這樣的狀況，因為你知道大家在第一集之後抱著多高的期待，我想只\n要盡其所能地講述一個最好的故事就好了。」\n\n有別於觀眾對於《蝙蝠俠對超人：正義曙光》的負面評價，溫子仁從一個電影創作者的角\n\
  度來看這個作品，講出了一個導演對於觀眾期待所應該抱持的健康態度，或許在《蝙蝠俠\n對超人：正義曙光》之後，粉絲們給予的壓力會順著轉移到即將推出的超級英雄電影，而\n\
  在訪談中他也表示，他執導的《水行俠》絕對不會「太黑暗」。\n\n「《水行俠》不會太黑暗，故事發生在深海裡，我會運用大量的燈光。」\n\n好的，希望溫子仁的電影會比他說的話還幽默，我們也期待電影的上映。《水行俠》由《\n\
  300壯士》（300）系列編劇寇特強史達德（Kurt Johnstad）、《怒戰天神》（Wrath of\nthe Titans）編劇大衛強森（David Johnson）共同執筆劇本，由傑森摩莫亞（Jason\n\
  Momoa）主演，安柏赫德（Amber Heard）飾演亞特蘭提斯女王 Mera，2018 年 7 月 27\n日美國上映，臺灣目前沒有上映資訊。（Slashfilm）\n\
  \n--"
