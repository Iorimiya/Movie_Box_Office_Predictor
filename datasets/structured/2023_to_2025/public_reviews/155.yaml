title: 'Re: [好雷] 厲陰宅2 但沒有邏輯 '
content: '說說一點我的看法

  但我嚇得半死 也許不見得正確(天阿 年紀大了)

  因為惡靈(跟鬼的概念不一樣 有點像是惡魔)

  不能直接插手人間的事 不能干預和直接闖入人間

  去華倫家就是要布局：你們不要干涉 否則讓你(老公)死得很難看

  華倫夫婦弱點 就是對方吧....

  看到這種威脅 怎麼可能不在意



  只能解釋成

  他們真的還是孩子...

  而且事件都是大半夜 二女兒(就是主角  有點忘記名子)

  之前似乎就有夢遊經驗

  看她用繩子綁自己就知道  自己很想區分現實或夢境



  她本身就躲在那邊了

  解釋成惡靈幫她一起演戲  也是可以的...



  因為這次華倫介入的快

  而且人類世界引起譁然 天堂 地獄會不知道嗎?

  我想這會起爭議吧(?)


  天使不能直接進入人間

  惡魔不能直接進入人間 就是規定



  老實說我覺得這片真的有嚇到我就是了

  雖然是很老梗套路 突然出現惡魔嚇你

  可是湖底跟狗狗變型  還真的有嚇到我就是...


