url: https://www.ptt.cc/bbs/movie/M.1498553883.A.054.html
title: '[新聞] 《厲陰宅3》正式啟動　這次不再以鬼屋為'
content: '《厲陰宅3》正式啟動　這次不再以鬼屋為題材


  黃衍方 2017年06月27日 15:21:00



  《厲陰宅》劇照（翻攝自IMDb）


  《厲陰宅》描述超自然現象研究者華倫夫婦驅魔的經歷為，兩集在全球共嚇進6.4億美元

  （約194億台幣），堪稱近年最受歡迎的恐怖片，現在它要繼續邁向第三集了。


  據《DEADLINE》報導，《厲陰宅2》編劇大衛萊斯里約翰遜（David Leslie Johnson）將

  會繼續為第三集執筆劇本，而前兩集的導演溫子仁在本集僅會擔任監製，大衛目前正在為

  溫子仁的新作品《水行俠》修改劇本，該片預計於2018年12月21日上映。


  目前仍未確定第三集的故事走向，但據消息來源指出，《厲陰宅3》應該會延續前兩集的

  模式，讓華倫夫婦去調查某個真實存在的超自然事件，而本系列監製彼得賽峰（Peter

  Safran）在曾透露，第三集將不會再以鬼屋做為題材。


  《厲陰宅3》一旦拍成，將會成為《厲陰宅》宇宙的第七部電影，除了全三集本傳之外，

  還有兩集《安娜貝爾》及正在籌備中的《鬼修女》、《歪曲人》外傳電影。


  《安娜貝爾：造孽》預計將於8月10日在台灣上映。





  --'
