url: https://www.ptt.cc/bbs/movie/M.1465649039.A.9DE.html
title: '[好雷] 厲陰宅2 喜迎鬼王回歸 '
content: '部落格圖文版 懇請參觀支持~





  恐怖片拍膩了的「恐怖片之王」溫子仁跑去玩了一部《玩命關頭7》，讓別人拍了差強人

  意的《安娜貝爾》和《陰兒房3》，終於強勢回歸「陰間」，為喜歡他的影迷獻上大禮：

  《厲陰宅2》。


  恐怖片何其之多，可是能夠收穫高評價的寥寥無幾。溫子仁自從以《奪魂鋸》一鳴驚人之

  後，幾乎每一部作品都拍得精采漂亮，《厲陰宅2》也絲毫沒有墮了他的威名，簡直就是

  在「開班授課」，有種「看不下去了，還是讓專業的來」之感。


  恐怖片要嚇人，雖然已有既定公式可循，但這其實就跟相聲的段子一樣，每一個笑點(嚇

  點)都需要精心的設計。有時候真正可怕的東西不是最後突如其來的衝擊，而是中間的過

  程。當一狗票低成本恐怖片只知道突發巨響這101招的時候，溫子仁硬是有辦法在每一段

  驚嚇橋段設計出極具巧思的運鏡和醞釀，好讓觀眾被他營造的氣氛牽著鼻子走，即便觀眾

  知道「就是這裡」，還是會折服於他身歷其境、深富臨場感的流暢運鏡，雖然不是真的第

  一人稱視角，但卻完全能夠滿足恐懼的未知，彷彿雲霄飛車一般的酣暢淋漓，堪稱是恐怖

  片界的爽片。


  一般恐怖片的故事性通常也比較薄弱，但溫子仁即便是在恐怖片裡講故事也是說的頭頭是

  道。他直接採用商業娛樂片的節奏，完全不拖泥帶水，恐怖之餘還有幽默，驚悚之中更有

  溫馨，真相大白之前的扭轉也沒有少。《厲陰宅2》紮紮實實的給上超過兩個小時的片長(

  竟然比史詩片《魔獸：崛起》還長)，完整了訴說整起事件的來龍去脈和前後呼應的劇情

  細節，完成度相當高。每一個人物的交流和情感都有機會發酵，不論是Warren夫婦還是

  Hodgson一家人，最後都成功靠著彼此的愛度過難關。而這至少可以保證看的過程驚險刺

  激，看完則因為邪不勝正，澎拜熱血的結局而不至於心情低落，Warren夫婦再度擊敗了惡

  魔，拯救了可憐的一家人，可喜可賀可喜可賀。如果可以，乾脆跟隔壁棚《陰兒房》系列

  一起成為「惡靈宇宙」，組個驅魔界的《復仇者聯盟》吧。


  不過話說回來，這兩邊的世界觀本身是有差距的，畢竟《厲陰宅》這邊主要是在還原真實

  事件，不像《陰兒房》的魔幻。所以《厲陰宅》終究會走比較傳統的驅魔路線，惡魔的來

  歷動機倒也不用太深究，因為那本來就是沒什麼道理的玩意，只要著重在故事的正面教化

  意義和享受溫子仁出神入化的橋段設計就可以了。


  演出苦主Janet的小女生實在太可愛，她的姊姊也毫不遜色，加上戲份雖然不多但已經展

  現出天賦的Warren夫婦女兒也好萌，都可以作為全場緊繃壓迫的緩和。


  比較想雞蛋裡挑骨頭的是，相對首集那傳唱千古的「拍手」，這次的恐怖戲雖然還是拍得

  相當出色，但就少了那麼一點足以當成經典來流傳的梗。最後拯救Janet、擊退惡魔的鋪

  排幾乎只靠了Warren夫婦，也有點浪費了前面花費許多功夫鋪陳Hodgson一家人的感情，

  以及母女之間從從各自的負面情緒，轉為信任彼此然後攜手團結抵抗惡靈的描寫。


  衷心希望溫子仁拍完《水行俠》之後，可以繼續回來打造《厲陰宅》系列，畢竟Warren夫

  婦應該有一大堆的故事檔案可以翻拍，直接發展成類似《X檔案》的影集更棒(當然前提是

  水準要維持住)，甚至《陰兒房》系列也可以再拿回來，揭開「紅面魔鬼」的秘密，畢竟

  當代的恐怖片，真的除了溫導拍的作品之外，還真沒有一部可以打的。


  P.S. 再度出馬飾演惡魔(惡靈化的無辜阿伯Bill)的依然是溫導恐怖片系列配樂家

  Joseph Bishara！這位音樂家真的很妙XD







  --


  陳亭妃見那土壤觸手深陷，就與上次一般無異，更是驚奇，心想：「謝龍介的功夫明明遜

  我一籌，怎地也有這等厲害的指力？」一時滿腹疑團，突然伸手指在土上一刺，說也奇怪

  ，那土壤竟被她刺了一個孔。


  --'
