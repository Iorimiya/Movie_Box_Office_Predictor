url: https://www.ptt.cc/bbs/movie/M.1465613535.A.5E2.html
title: '[好雷]厲陰宅2 - 恩菲爾德鬼屋的真實故事'
content: "劇情: 8.5\n驚嚇程度: : 7\n氣氛營造: 9\n創意度: 6\n綜合: 8\n(滿分十分)\n\n\nThe Conjuring 2\
  \ (厲陰宅2)，由澳洲華裔導演溫子仁執導的影片，之前曾不願被冠標籤\n只會拍恐怖片的導演，只好任由安娜貝爾給別人拍爛，改去拍Fast & Furious 7(玩命關\n\
  頭7)，如今又強勢回歸，而且這次的拍攝手法跟影片的廣度又更勝往昔。\n\n\n溫導演之所以鬼片拍得賣座，最大的原因是他鬼片就是純粹鬼片，不胡亂添加多餘的元素\n\
  ，但這部意外地增加了很多不同以往的元素，不僅不見違和反而更讓整部電影的可看度大\n為提升。\n\n\n第二集的驚嚇程度跟第一集相比起來較為「平淡」一點，但敘事手法跟劇情的強度個人認\n\
  為比第一集的表現優異得多，裡頭角色也更鮮明讓人有連結感，更重要的是，這次的角色\n跟真實事件的一些人物真的都有7,8分相像啊!!!!\n\n\n所以在繼續看下去之前先來看看電影角色跟真實角色的超級比一比，有的還真有幾分神似\n\
  。\n\n\n\n\n\n左邊英國小女演員: Madison Wolfe\n右邊真實事件女主角: Janet Hodgson\n\n\n\n\n\n左邊:英國演員Simon\
  \ McBurney\n右邊:實際協助恩菲爾德事件研究長達兩年的Maurice Grosse\n\n\n這不得不說實在太像了，可惜演員的頭髮還是多了一些。\n\n\
  \n\n\n\n\n\n\n\n\n\n\n防雷頁:\n\n未看電影但想了解這部電影背後的真實故事可看替代文章:\n\n強森講鬼:恩菲爾德騷靈事件:\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n跟第一集一樣的敘述方式，電影一開始講述著華倫夫婦處理的靈異案件，而這次的案件就\n是曾經轟動美國社會的The\
  \ Amityville Horror (阿米提維爾事件)，一位名叫Ronald\nDeFeo (羅納德‧迪福)的人，在一個夜晚殺了一家六口，包含自己的雙親與四位兄弟姊妹\n\
  ，他聲稱是一個神祕人所為，而這所謂的神秘人居然是一個無實體卻用聲音引導他殺人的\n惡魔。\n\n\n這件靈異的滅門慘案，也曾被翻拍成電影，而厲陰宅2會以這個真實案件開頭是有原因的\n\
  ，因為這事件曾經在美國社會掀起所謂的陰謀論，而華倫夫婦就是被指為這次的主謀之一\n，儘管當時有許多的影片及照片都可以說明這個房間確實有著神秘的力量存在，但直到今\n\
  天仍無法擺脫陰謀論的說法。\n\n\n至於隔了一個大西洋海峽的英國恩菲爾德事件，也曾因為當事人Janet Hodgson (珍妮)，\n被記者拍到蓄意的破壞東西來製造騷靈的效果，期間她也承認怕失去關注而造假等等原因\n\
  ，讓這個史上最著名的靈異案件始終蒙上一個陰影。\n\n\n厲陰宅2的有趣之處就在於，這兩個鬼屋事件都曾轟動一時卻同時又背負著造假的罵名，\n電影中這兩個事件背後的主謀卻是一個曾出現在古代以色列惡魔名單中的一個魔鬼Valac\n\
  (瓦拉克)，根據紀載他曾是地獄之王且在地獄擁有30個魔鬼軍團，但也有可能只是導演虛\n構了一個同名的角色出來而已，畢竟既然都貴為地獄之王了，沒有個米迦勒等級的大天使\n\
  根本無法抗衡啊，結果卻被華倫夫婦擊敗，實在有點不合理。\n\n\n\n\n\n↑ 電影中裝扮怪嚇人的惡魔瓦拉克\n\n\n\n總之，根據聖經的說法，只要世人不相信撒旦(惡魔)的存在，撒旦就可以肆無忌憚的破壞\n\
  這個世界。可以說瓦拉克經手的兩個鬼屋事件，完全符合了聖經的講法，只要人們不相信\n是魔鬼在操弄我們，牠們就可以隨心所欲地製造各種『意外』。\n\n\n所以，惡魔的出現反而讓兩個故事巧妙的結合在一起，這一點不得不佩服導演的功力，也\n\
  讓整個故事更合理化。\n\n\n整部電影基本上還滿忠於恩菲爾德事件所發生的事情，包含小女孩珍妮曾窗簾捲住脖子，\n而死在樓下角落沙發的Bill爺爺也是整部電影的主要鬼魂，只是電影中他變成是被惡魔操\n\
  控的受害靈之一，珍妮同樣承認造假但在電影中卻是被惡魔威脅要殺其全家而必須這樣做\n。\n\n\n最後，劇中戲分不多的禿頭哥Maurice Grosse(莫里斯)，在真實事件整整陪了珍妮一家人\n\
  兩到三年的時間來研究此案件，電影也沒有為了要凸顯華倫夫婦的重要性而忽略他，這點\n也算是對於真實事件的一種尊敬，電影中莫里斯有提到自己也曾失去女兒，所以希望幫助\n\
  珍妮，而真實世界的莫里斯的確也是如此，而他的女兒也剛好名叫『珍妮』，所以他始終\n相信是她的女兒引導他來到這裡，他也不諱言希望有朝一日可以與他相隔兩個世界的女兒\n\
  聯繫，以填補他心中的遺憾。\n\n\n\n\n↑莫里斯始終陪伴著珍妮\n\n\n\n強森講鬼FB: \n\n更多文章: \n\n--"
