url: https://www.ptt.cc/bbs/movie/M.1466356574.A.F6F.html
title: '[新聞] 65歲男看《厲陰宅2》猝死 屍體竟失蹤'
content: "新聞網址：\n\n\n記者華少甫／台北報導\n\n許多人對於恐怖片跟鬼片的想法是「愛看又愛怕」，事實上，鬼片某種程度而言，對於\n年紀較大的觀眾，總是難以負荷一點；日前在印度有一位65歲的男子，在觀賞溫子仁的\n\
  《厲陰宅2》（The Conjuring 2）時，因為受到太多驚嚇，在電影院猝死，消息一出，\n引發許多討論。\n\n根據《DNA India》報導，有一位65歲的老人Andrah\
  \ Pradesh，16日晚間在印度的電影院\n觀看《厲陰宅2》時，疑似因為受到太多驚嚇，當場因為心臟病發作而過世；據悉，他當\n時在電影院就表示自己胸口很痛，電影院員工緊急叫救護車，不幸的是，在救護車還未\n\
  抵達前，他便已回天乏術。\n\n但弔詭的是，《印度時報》(The Times of India)之後指出，醫護人員當時要求友人將\n屍體運到另一間醫學院驗屍，並再確認死因，但之後友人與屍體卻雙雙下落不明，現警\n\
  方已接手調查。\n\n《厲陰宅2》上週上映後，以4040萬美金的高票房奪下全美冠軍，足見溫子仁執導鬼片的\n號召力仍然健在，在台灣也同樣引發許多網友討論，大多數觀眾都認為這一集的恐怖程\n\
  度雖然不如上集，但新哏跟創意卻是前所未見，呼朋引伴要大家一起去觀賞這部近年來\n難得好看的西洋鬼片。\n\n------------------------------------------------------------------------------\n\
  \n參考外電:印度時報\n65-yr-old dies while watching horror movie\n\n\n心得:Rest In Peace\n\n\
  補充一下，國內媒體對於這篇報導其實有一個小錯誤，\n那就是Andrah Pradesh是這位死者居住的地方，並不是他的名字\n\n另外，這樣戲劇化的情節，似乎也可以拿來當作拍攝驚悚片的素材了\n\
  \n--\n                                      06/20 17:35"
