url: https://www.ptt.cc/bbs/movie/M.1466184129.A.269.html
title: '[討論] 厲陰宅2，修女惡魔討論'
content: '本版第一次po文，請多多包容QAQ


  可能有雷







  ================================


  剛看完厲陰宅2


  內心對惡魔充滿好奇的我就馬上上網查了一堆跟惡魔還有天使有關的資料


  影片中出現的修女形象的惡魔

  本名valak，譯:瓦拉卡

  或稱valac，擅長給予人真知

  也常以假天使的形象出現在人面前

  為所羅門72柱魔神中的第62位


  而我們都知道，在聖經中的惡魔

  是天使墮落而成，天使的誕生乃耶和華創造，之後由天使生出更多天使


  那從這可知，聖經的惡魔絕非人類所變成


  但所羅門72柱魔神呢

  此來源為《所羅門之鑰》一書


  裡面提到所羅門王，也是一位偉大的惡魔召喚師，將自己的召喚咒語寫下，並共有72位大

  惡魔，後來又把他們封印在瓶中，利用他們來做事


  並沒有說到惡魔來源，但從惡魔的架構來看，所羅門王從地獄召喚出這72位，各有不同的

  等級位階，而且還各自有不同能力


  好像離題了


  回來，聖經的惡魔是叛變天使(當初同樣有位階)在天國北境打敗仗，然後被打落人間(地

  獄)，而一般人看不見，僅有少數人或神職人員可以看見，或是透過召喚儀式，那這樣我

  們可以推斷，"惡魔"乃天使墮落後的稱呼，且聖經上也常以惡魔稱之。


  而"鬼"乃人死後幻化而成，就像影片中的比爾爺爺


  那!重點來了!!!!!!!

  如果他拍修女外傳


  那，如果是講人變成惡魔的故事

  那就逆天啦!!!!!!!!


  這就跟我們中華文化的修煉成仙一樣啦!!!


  好啦，小弟懂的也不是很多，就只是想跟大家討論惡魔這件事，如果有錯歡迎指教!!!!


  感謝大家看完


  --'
