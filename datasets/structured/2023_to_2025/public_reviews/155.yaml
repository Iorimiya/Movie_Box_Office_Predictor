title: '[請益] 只有我覺得厲陰宅2很感動嗎（附雷）'
content: '前幾天在朋友鼓吹下就就衝了厲陰宅了！電影院果然是座無虛席，有鑒於看1的時候被嚇

  得屁滾尿流加上本人也不是一個愛看鬼片的人，所以原本打算從頭摀著眼睛到結束...不

  過發現不單單只是一部嚇人的鬼片還附有豐富劇情跟戳到我好幾次的哭點！


  以下有雷

  撇開恐怖的地方不談

  看完後我一直覺得片中珍妮媽的母愛真的是無敵，從珍妮一開始被附身到後來全家搬去鄰

  居家的時候珍妮媽無怨無悔陪在她身旁實在是太有愛了，然後中後段那位也相信有鬼的禿

  頭戴眼鏡的先生在解釋自己為什麼相信靈異現象時提到自己的女兒blah blah之類的（詳

  細內容忘了）我也覺得好感人，最後是華倫夫婦和珍妮的對話，明明他們是陌生人卻差點

  犧牲生命來幫助珍妮QQ

  走出電影院後我眼角的眼淚絕對是因為感人流出來的！


  --'
