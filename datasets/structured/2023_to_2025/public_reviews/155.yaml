title: '[  雷] 厲陰宅 口哨'
content: '不知道算不算雷

  畢竟是電影裡的片段


  前天我跟我朋友看電影的時候

  對珍妮在天花板上那段的口哨聲覺得很耳熟

  一直到散場還想不起來到底在哪裡聽過


  今天跟我妹去看二刷

  才想起來

  .

  .

  .

  .

  .

  .

  .

  .

  .


  這不是綠油精嗎！！！






  -----

  Sent from JPTT on my Sony D6653.


  --

  第一場整個情緒都在劇情裡齁 第二場看完一直笑xDD

  這樣也可以知道我年紀偏小！？

  我現在一直在唱xDD

  我看的場綠油精那邊都沒人笑 警察那邊滿白痴的xDD

  長知識了

  這件事告訴我們 不要吃太胖 不然發生事情跑不掉xDD'
