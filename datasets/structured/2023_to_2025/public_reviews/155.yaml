url: https://www.ptt.cc/bbs/movie/M.1627643822.A.71D.html
title: '[普雷] 厲陰宅3 是惡魔逼我的 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  很喜歡溫子仁風格的恐怖片

  但其實漸漸的對這個人有點意見

  因為連厲陰宅的拍這都假手他人

  而且還是給把哭泣的女人拍得很爛的導演


  但因為就是這樣的不期不待

  厲陰宅3沒有在我心中拿到爛片獎座

  但就像青春戀愛的美好一去不復返那樣

  覺得可惜沒有更好一點。



  故事主線繼續圍繞在華倫夫婦一家

  這次直接切入核心

  與前作有時候會先講講別人的故事有差異


  喜歡溫子仁的作品會發現

  厲陰宅跟陰兒房有點關係

  除了男主角都是同一位男星飾演之外

  劇中都有一位通靈的女性


  在陰兒房中的Elise應該就是借鏡華倫太太

  這兩位堅強女性的共同特徵

  就是溫柔的同時也充滿堅強

  同時也對丈夫有著深深無法忘懷的愛戀

  在陰兒房的劇情中Elise失去丈夫之後就不再接手除靈

  而是深深的掉入喪夫的哀傷之中

  但也在其他人的懇求，尋求她的幫助之下

  拾回老路找到新的動力


  回到厲陰宅

  第三集的主軸其實也在同樣的情感之上

  鶼鰈情深的華倫夫婦接手一個除靈任務

  但過程中惡靈的力量太強大

  甚至威脅了華倫先生的性命，萬不得已之中

  故事主角Arne允許惡靈附身導致後續故事的開始


  我覺得厲陰宅的恐怖劇情其實算是每況愈下

  一部份是因為續集本來就高難度

  再來就是觀眾胃口越來越大

  （原導演又是要拍不拍得很煩）


  但是厲陰宅從始至終

  都可以看到華倫夫婦之間深刻的感情

  而這個感情其實在恐怖片之中

  傳遞出非常好的氛圍

  不得不說飾演男女主角的演員

  一直把劇本中的角色以高水準的方式

  表現出非常有層次的演出水準

  我其實心裡覺得，我自己有部份也是受此吸引

  才明明不抱期待也要進戲院觀賞


  本片的恐懼來自於這次的惡靈

  似乎比以往更強大

  而且出沒時間與原因更是撲朔迷離

  所以華倫夫婦在過程中不但經歷了丈夫病重

  、應對Arne的案件的開庭審理

  同時還要面對沒有頭緒的惡靈出沒的原因


  本集華倫太太因為丈夫生病

  所以將大部分的工作一手扛起，丈夫則跟第一集一樣成為她堅強的後盾

  兩人終於一路抽絲剝繭找到主因

  原來是一名受神職人員的撫養長大的女兒

  投入邪教成為惡魔的信徒

  企圖以侮辱神的方式表達對於惡魔的忠誠

  她的方式就是利用召喚惡靈來迫害她選定的目標


  本片最精彩的地方

  就是惡靈的僕從其實比鬼還恐怖

  雖然這已經是老梗了

  但不得不說厲陰宅系列除了華倫夫婦的感情描述

  最厲害的地方就是對於飾演配角的選取跟化妝技術都是一等一

  （鬼修女、安娜貝爾）


  終於在夫婦兩人情比金堅的意志之下

  破除詛咒，而惡靈也因為目的失敗，帶走了人類僕從的性命。


  本片維持了厲陰宅的風格

  該有的恐怖氛圍還是很努力的傳達了

  也沒有太積極的勸世內容在裡面

  （台灣編劇麻煩學一下不要恐怖片都拍成莒光園地）


  真的要說就是本片很多恐怖橋段都有剪去預告

  但是好看的恐怖片厲害的不是那個鬼冒出來那瞬間（瀉啦）

  而是一路的情境鋪造跟劇情安排

  我個人覺得厲陰宅3還是交出一定的水準了


  但認真希望這系列可以停了

  放過這對夫婦吧

  新的IP可能還是需要耕耘一下的。



  --'
