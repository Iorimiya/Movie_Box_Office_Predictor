title: '[新聞] 【命案】陳湛文扮斯文變態索命妓女伍詠詩'
content: '新聞網址：



  年度必看香港電影《命案》，即將在本週五（6/30）於全台震撼獻映。本片在香港上映後

  評價極佳，票房更已經大破千萬港幣。驚人的是，本片竟取材自80年代轟動全香港的「雨

  夜屠夫」真實殺人案件。編劇游乃海為本片打造出「斯文變態」的驚悚角色，表面上看來

  斯文有禮，但每逢下雨，就會化身成妓女殺手，呈現出極大反差，而這角色便由活躍在香

  港劇場界的實力派演員陳湛文詮釋。他以人前斯文，人後凶狠的高反差演出，讓觀眾心有

  餘悸表示：「以後下雨天都要小心看到陳湛文了！」不僅如此，片中將面對殺身危機的年

  輕妓女，則由演出過《熱血合唱團》、《墮胎師》的伍詠詩詮釋。據悉，她為了更了解妓

  女形象，還揪朋友到妓女聚集的「鳳樓」進行「實地考察」，但因為太害怕，只敢在附近

  徘徊，以及上網蒐集資料。而一幕她被陳湛文五花大綁的橋段，更是讓她有感而發：「連

  休息都要被綁住又貼住膠帶，真是比打戲還更辛苦，不過也幫助我投入角色。」





  由杜琪峯監製、游乃海編劇、鄭保瑞執導、林家棟及楊樂文主演、香港電影品質保證「銀

  河映像」攝製的最新驚悚懸疑力作《命案》，取材自80年代轟動全香港的「雨夜屠夫」林

  過雲案件。林過雲當年在五個月內殺害四名女性，尤其都挑雨天犯案，案件曝光讓全港民

  眾人心惶惶。而在本片飾演物理治療師一角的陳湛文，角色便脫胎自這位「雨夜屠夫」，

  表面上斯文有禮，但每逢下雨，就會化身成妓女殺手，呈現極大反差。劇場演員出身的陳

  湛文，可說是近年香港導演愛用的演員之一，2018年首度拍電影，就以陳果執導的《三夫

  》問鼎香港金像獎最佳新演員，2023年也在《飯戲攻心》搞笑演出，今年還接連演出《命

  案》、《全個世界都有電話》、《年少日記》等片，不過他也解釋：「《命案》是拍完《

  三夫》後，第二部演出的電影，比《飯戲攻心》還早，只是《飯戲攻心》比較早上映。」



  對於第二次演電影，就獲得名導鄭保瑞青睞，導演也回憶找他演出的契機：「就是《三夫

  》那傢伙！讓我印象很深，覺得湛文有很多可能性，尤其這角色是個不太起眼的人，是大

  隱隱於巿的人，我相信他會有這種狀態，因為他拍《三夫》面對陳果都做得到，哈哈！加

  上他讀演藝又一直做舞台劇，功底應該很好。」也因為這次要人前斯文、人後凶狠，這也

  讓陳湛文表示，演出最難拿捏的，就是怕殺人動作不夠乾淨俐落，不像一個時常會殺人的

  兇手。不過他的精湛演出，也讓觀賞過的香港民眾餘悸猶存，紛紛在網路上留言：「以後

  下雨天都要小心看到陳湛文了！」可見他演變態角色備受讚賞，盡展演技光芒。





  除了陳湛文之外，在《命案》演技發光的另一位配角，當屬飾演年輕妓女的伍詠詩。2014

  年出道的他，曾分別在《熱血合唱團》與《墮胎師》演出學生角色，直到《命案》終於從

  校服換上性感細肩帶，詮釋因為身負賭債而淪為妓女的少女，不僅要面對自身悲慘的命運

  ，還要面對變態殺人魔的索命。她回憶演出契機：「一開始收到劇本，就覺得是很大挑戰

  。最主要是如何投入到角色，我就不斷在現場去試、去找。當時劇組在現場不斷挖我內心

  ，希望得到真實的感受。」



  據悉，由於對妓女這個職業不熟，擔心無法精準發揮，伍詠詩更揪朋友到妓女聚集的「鳳

  樓」進行「實地考察」，想看看妓女們的行為舉止。只不過她太害怕了，只敢在附近徘徊

  ，以及上網做資料搜集：「我跟朋友一起去附近走走，只是遠距離觀察。至於『一樓一鳳

  』的環境，我自己就沒到如此大膽，但在網路上搜集資料時，發現有人拍攝一些短片，覺

  得很好，等去到現場看到美術佈置，也覺得很相似。我相信從事這個職業，任何性格任何

  人都有，不想先入為主，不一定要做到搔首弄姿。」此外，她在片中面對陳湛文的索命威

  脅，也跟對方有激烈的肉搏打鬥場面，讓兩人耗盡精力。不過最讓她印象深刻的，莫過還

  是被陳湛文五花大綁的橋段，讓她有感而發：「連休息都要被綁住又貼住膠帶，真是比打

  戲還更辛苦，不過也幫助我投入角色。」



  這部由杜琪峯監製、鄭保瑞執導、游乃海編劇、香港電影品質保證「銀河映像」所攝製的

  最新驚悚懸疑力作《命案》，即將在本週五（6/30）於全台震撼獻映。本片劇情描述一場

  暴雨夜裡，命案悄然發生，妓女慘遭連環殺人魔殘殺。一心想幫妓女化解「死刧」的命理

  大師（林家棟飾演）看著屍體悲痛萬分，不過一旁送錯外賣的茶餐廳少東（楊樂文飾演）

  卻踏著鮮血興奮莫名。二人機緣巧合相遇，大師算出少東將因為殺人而犯牢獄之災，少東

  也怕再陷囹圄，請求大師幫忙改命。另一方面，曾目睹少東殺貓的老警探（吳廷燁飾演）

  堅信少東是天生的心理變態，無法甩掉嗜血本性；大師卻認為既是天生，那錯的就不是少

  東，而是命運！大師使盡風水術數、中西玄學，不過總是人算不如天算，鎩羽而歸…。黔

  驢技窮之際，老警探步步進逼、殺人魔虎視眈眈、還有年輕妓女的致命誘惑，讓少東的殺

  念愈發熾烈，執刀就要踏上殺戮之路！而大師也頻頻面臨精神崩潰，讓眾人開始迎來命中

  注定的大刧…！



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
