  有一幕男主直接韓森上身


  有人說政治問題

  我是覺得一律當偽紀錄片就好

  覺得被黑的不舒服就當平行時空啊～


  反正人本來就是不能互相理解

  不然就不會引發那麼多戰爭


  這部估計上網飛會大紅


