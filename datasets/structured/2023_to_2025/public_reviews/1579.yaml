title: '[新聞] 楊樂文【命案】橡皮筋彈手腕展現病態演技'
content: '新聞網址：



  由「香港電影鐵三角」杜琪峯監製、游乃海編劇、鄭保瑞執導、香港電影品質保證「銀河

  映像」攝製的最新驚悚懸疑力作《命案》，即將在6月30日於全台震撼獻映。本片找來香

  港人氣夯團「MIRROR」隊長楊樂文，詮釋天性殘暴嗜血的茶餐廳少東。他在片中的演技光

  芒四射，可說是入行以來的最佳代表作，也讓導演鄭保瑞稱讚他是最適合的演出人選。驚

  人的是，他在片中身形暴瘦，經常面目猙獰，跟本人大相逕庭。據悉他從拿到劇本到正式

  拍攝，只是一星期當中的事，他就在一週內展開「地獄式」節食減重，讓自己看起來瘦到

  非常不健康，更勤練猙獰表情，甚至拍攝拿橡皮筋彈手腕的自殘戲時，完全沒做任何保護

  措施，讓被橡皮筋彈到的痛楚直入心底，越痛越投入角色，讓他拍完後回家，甚至發現雙

  手已經被橡皮筋彈到破皮，可見為演出做出非常大的犧牲。





  《命案》是楊樂文首度參與杜琪峯監製的電影，並與金像獎影帝林家棟首度對戲，更首度

  破格詮釋嗜血殘暴的茶餐廳少東，因為某天目睹妓女被殺，激發出他的殺戮天性，惟有靠

  林家棟飾演的算命大師改命，才有辦法扭轉他的牢獄之災。從電影《狂舞派》到戲劇《男

  排女將》、《繩角》等作品，楊樂文的角色大多是熱血單純少年，但這次的角色簡直脫胎

  換骨，讓觀眾看到他截然不同的樣貌，展現出他身為演員的無限可能性，也可說是他入行

  以來的最佳代表作。



  導演鄭保瑞大讚他在多次試鏡中，表現都非常一致，認為他是這角色的不二人選：「在挑

  選這個年齡層的演員中，他是最沉得住氣與最冷靜的人，這樣對我來說最安全。而且他很

  快就可以理解劇本要這樣演，還有我喜歡他的樣子夠怪，有點像外國人，模樣會比較容易

  記得。」不過鄭保瑞導戲向來以「變態」聞名，不論前作《智齒》、《狗咬狗》等片都讓

  演員吃盡苦頭，就連男主角林家棟這回演出本片，也直呼自己「命苦」。當問及楊樂文可

  曾擔心被導演「虐待」時，他直言從拿到劇本到正式拍攝，只是一星期當中的事，為了在

  短時間準備角色，他根本沒時間擔心：「他們教我去相信劇本、導演、對手和場景，他們

  很講求當下，即使做了很多功課都可丟棄，反而要感受當下那場戲想表達什麼，對手想說

  什麼。」





  值得一提的是，楊樂文在《命案》中的角色形象又瘦又殘，為了讓外型更接近角色，就算

  只有一星期準備時間，都讓他積極展開「地獄式」節食減重。他對此回憶：「想瘦一點、

  凹一點，看起來再奇怪點，沒打算減多少重，只想減到看起來瘦得不健康。」而且為了將

  外貌更加升級，他連遮暇膏跟粉底都沒用：「就是畫黑眼圈，眉毛再畫得噁心點，把所有

  不好的東西全放出來。」此外，由於角色經常目露凶光，讓他在表情管理上下足苦功，更

  因此抓到一個睜眼不顯皺紋的「訣竅」：「我練習怎麼把眼睛睜大，但睜得太大，眉毛會

  皺，額頭也會有很多皺紋，我就想到另一個方法，利用眼睫毛去睜大，很抽象吧！」



  尤其他為了展現演出決心，詮釋出角色與生俱來的殺戮衝動，讓他在劇情後半段需要用橡

  皮筋彈手腕，來控制自己的殺戮欲望。驚人的是，那場戲竟然是在沒有保護措施的情況下

  拍完；不僅如此，他被林家棟灌符水也是真喝。楊樂文回憶起這些「自虐式演技」表示：

  「彈橡皮筋那段，痛楚是直入心底，但同時越痛就越能投入角色。只是回到家後，發現雙

  手都已經被橡皮筋彈到破皮。」一席話也見證他為演出做出非常大的犧牲。



  這部由杜琪峯監製、鄭保瑞執導、游乃海編劇、香港電影品質保證「銀河映像」所攝製的

  最新驚悚懸疑力作《命案》，即將在6月30日於全台震撼獻映。本片劇情描述一場暴雨夜

  裡，命案悄然發生，妓女慘遭連環殺人魔殘殺。一心想幫妓女化解「死刧」的命理大師（

  林家棟飾演）看著屍體悲痛萬分，不過一旁送錯外賣的茶餐廳少東（楊樂文飾演）卻踏著

  鮮血興奮莫名。二人機緣巧合相遇，大師算出少東將因為殺人而犯牢獄之災，少東也怕再

  陷囹圄，請求大師幫忙改命。另一方面，曾目睹少東殺貓的老警探（吳廷燁飾演）堅信少

  東是天生的心理變態，無法甩掉嗜血本性；大師卻認為既是天生，那錯的就不是少東，而

  是命運！大師使盡風水術數、中西玄學，不過總是人算不如天算，鎩羽而歸…。黔驢技窮

  之際，老警探步步進逼、殺人魔虎視眈眈、還有年輕妓女的致命誘惑，讓少東的殺念愈發

  熾烈，執刀就要踏上殺戮之路！而大師也頻頻面臨精神崩潰，讓眾人開始迎來命中注定的

  大刧…！



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
