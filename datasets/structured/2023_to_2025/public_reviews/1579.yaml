url: https://www.ptt.cc/bbs/movie/M.1461583727.A.3AA.html
title: '[新聞] 新好男孩、超級男孩《命案七》合體打殭屍'
content: "新聞網址：\n\n90年代最紅男孩團體大合體，卻不是唱歌尬舞。「新好男孩」尼克卡特、AJ邁克林和豪兒\n多羅夫、「超級男孩」喬伊費敦和克里斯克派屈克、「98度合唱團」傑夫提姆蒙斯與「歐\n\
  城男孩」艾瑞克麥可艾斯特達，合演西部殭屍片《命案七》（Dead 7）。男團成員化身困\n在西部荒野殭屍小鎮的鏢客，他們必須抉擇是否要拯救倖存的居民，還是保命求生。\n\
  \n《命案七》由「新好男孩」尼克卡特發想原始故事，他與編劇一起合寫，並且參與製作，\n擔任導演並領銜主演。在接受E!頻道訪問時，表示和其他男團成員合作感到非常興奮。他\n\
  說：「和朋友們拍電影真的很棒，而且還是一起騎馬打殭屍。我從小就喜歡恐怖電影，能\n夠演出這類電影真的是美夢成真。」\n\n儘管外界都認為這些九零年代稱霸西洋樂壇的男孩團隊一定相互競爭，感情不睦，但尼克\n\
  表示「新好男孩」和「超級男孩」都在同一家公司，一直以來都是朋友。「跟哥們演出默\n契十足，拍攝期間跟玩沒兩樣。」\n\n為拍攝本片，尼克還透過募資網站獲得約台幣500萬經費，為求有更多大牌星光加入，他\n\
  還透過推特邀約當紅男孩團體《一世代》的奈爾霍蘭（Niall Horan），希望他演出片中\n弟弟一角，但沒有獲得回應。他也邀請「披頭四」保羅麥卡尼、「辣妹合唱團」梅兒碧參\n\
  與演出，但沒有實現。\n\n《命案七》在美國將於4月1日愚人節當天在Syfy頻道首播，台灣將於5月1日週日晚間9點\n10分，於MOD 76台Syfy獨家首播。《命案七》由美國知名B級片製作公司The\
  \ Asylum製作\n，該公司的作品還包括將在今夏推出第4集的《風飛鯊》，被譽為搞笑版陰屍路的《殭\n屍國度》。\n---\n劇情先不說，光是卡司就很值得一看啊（透漏年紀了....）\n\
  \n--\n                                         04/25 20:27"
