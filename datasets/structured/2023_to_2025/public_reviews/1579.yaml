title: '[新聞] 洪若潭+花蓮五子命案拍成電影　庹宗華入'
content: "新聞網址：      \n\n洪若潭+花蓮五子命案拍成電影　庹宗華入戲爆靈異\n\n緯來電影台自製電影《九月四號》昨開鏡，劇情融合台灣2大命案。緯來電影台提供\n\
  2017年06月26日17:53\n\n緯來電影台自製電影《九月四號》昨開鏡，該劇綜合花蓮五子命案及台中洪若潭命案2大\n奇案，而編寫杜撰出來劇情，導演曾敬懿解釋會取這片名，是因為剛好兩大命案都是9月4\n\
  號發生。庹宗華首次嘗試恐怖片，角色是人格分裂者，因壓力大造成行為脫序，他私下倒\n是不信鬼神說，住飯店愛選邊間住，睡夢中被鬼壓喘不過氣，他老神在在說：「我覺得那\n\
  是太疲累才會有的身體反應。」\n\n李杏和庹宗華劇中飾演夫妻，她不僅拍戲覺得毛毛的，私下也超怕鬼，會隨身帶著外婆求\n來的平安符，平常朋友邀約看鬼片，讓她回家都沒法入睡，尤其是洗澡、洗頭需要閉上眼\n\
  睛時，深怕睜開眼鬼就在面前。\n\n該劇描述遭到友人設局而欠下大筆債務的張父，逼不得已帶著一家四口承租花蓮的一處凶\n宅，此處過去曾發生駭人聽聞的五子命案，初入凶宅的當天，一些若有似無鬼影幢幢，再\n\
  加上詭異的詛咒巧合，在9月4號這一天，父親將會殘殺全家人，究竟可怕的是生人，還是\n鬼魂，除了走驚悚路線，更探討心魔與靈異層面。（宇若霏／台北報導）\n\n庹宗華角色是人格分裂者，因壓力過大造成行為脫序。緯來電影台提供\n\
  \n李杏私下怕鬼，拍恐怖片也覺得毛毛的。緯來電影台提供\n\n花蓮五子命案9年前轟動一時。資料照片\n\n洪若潭命案的兇宅後來賣給新屋主，還辦了辣妹攝影趴。資料照片\n\
  \n\n--\n「師大路夜市」→歌：北乃きい    \n【APH】灣娘角色歌(中日字幕)(台灣；Taiwan；甲斐田雪)-POIPOIPOI\n\n台湾応援ゆるキャラ「タイワンダー☆」テーマソング\
  \ 公式MV\n\n【完整版】小穹形象歌曲「下一站．與你」     \n\n--"
