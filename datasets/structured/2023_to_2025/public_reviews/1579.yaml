url: https://www.ptt.cc/bbs/movie/M.1765013187.A.4A8.html
title: '[新聞] 馬修派瑞命案 涉案醫生被判入獄2年6個月'
content: "馬修派瑞命案 涉案醫生被判入獄2年6個月\n\n\n馬修‧派瑞（Matthew Perry）資料照。 (Phillip Faraone/Getty\
  \ Images for GQ)\n\n【大紀元2025年12月05日訊】（大紀元記者葉子杰編譯報導）當地3日，好萊塢男星馬修\n‧派瑞（Matthew Perry）因毒品致死，加州醫生普拉森西亞承認馬修死亡前一個月曾提\n\
  供毒品氯胺酮（俗稱K他命），法院判處普拉森西亞30個月監禁，成為該事件中第一個被\n判刑的人。\n\n54歲馬修‧派瑞於2023年被發現死於洛杉磯家中，法醫驗屍報告指出，死因是「氯胺酮的\n\
  急性作用」。此前，他與憂鬱症和毒品成癮抗爭了多年。聯邦調查局因馬修之死共逮捕五\n人，包括馬修的助理肯尼思（Kenneth Iwamasa）與經理人艾瑞克（Eric\
  \ Fleming）、普\n拉森西亞（Salvador Plasencia）醫師與馬克‧查維茲（Mark Chavez）和女毒販桑加（\nSangha）。\n\n\
  據《BBC》《衛報》報導，多年來聯邦一直調查馬修是怎麼從好萊塢的一個地下毒品網絡\n弄到這種解離性的麻醉藥物(dissociative anesthetic)氯胺酮的。本案有5名涉案人遭到\n\
  起訴，普拉森西亞醫師是第一個遭到判刑的涉案人。\n\n馬修曾合法使用外科麻醉藥氯胺酮治療憂鬱症。但當馬修被主治醫生拒絕提供更多的劑量\n時，他找到了普拉森西亞。普拉森西亞承認非法向馬修出售藥物，也知道他在跟毒癮抗爭\n\
  。根據法庭文件，普拉森西亞還傳簡訊給另一位醫生，說馬修是個「白癡」，可以利用馬\n修來賺錢。\n\n法官強調，普拉森西亞並沒有提供導致馬修死亡的氯胺酮，但法官對他說：「你和其他人\n\
  助長了馬修的氯胺酮成癮之路，最終讓他走向這樣的結局。」並說：「你利用了馬修的成\n癮來謀取私利。」\n\n馬修的家人請求法官判他重刑，說普拉森西亞是「最有責任的人」，並說他們真的很難理\n\
  解為什麼他會一次又一次地給馬修供應毒品。除了普拉森西亞被監禁之外，美國地區法官\n還判處普拉森西亞支付5,600美元（約4,195英鎊）的罰款。判決後，他立即被聯邦當局拘\n\
  留。\n\n今年夏天，普拉森西亞承認了四項分銷氯胺酮的罪名。這些指控最高可判處40年監禁，但\n檢方僅要求判處3年。案件中另外四名被告——包括另一名醫生、馬修的助理，以及提供\n\
  氯胺酮致命劑量的經理人及桑加，也都認罪，未來幾個月將宣判。\n\n馬修的母親蘇珊娜（Suzanne Morrison）和兩位同父異母的妹妹出席了聽證會，在宣判前\n\
  流著淚。蘇珊娜對普拉森西亞說：「你叫他『白痴』，那個人一點也不笨。即便他有毒癮\n，他也是一個有成就的人。」妹妹馬德琳說：「全世界都在哀悼我的兄弟，他是大家最喜\n\
  歡的朋友。」\n\n普拉森西亞在宣判前也發言，說他有一個兩歲的兒子。他想到將來有一天要告訴自己現在\n兩歲的兒子「我沒能保護另一個母親的兒子，這讓我非常痛苦」，不禁潸然淚下。他說：\n\
  「我想好好養育他，我一直想怎麼跟他解釋這件事。」他直接向馬修的家人道歉，他說：\n「我本該保護他的。」\n\n責任編輯：蘇漾\n\n\n\n--\n\n   \
  \               \n\n\n\n--"
