url: https://www.ptt.cc/bbs/movie/M.1685621411.A.6CF.html
title: '[新聞] 杜琪峯、鄭保瑞、游乃海打造必看【命案】'
content: '新聞網址：



  由杜琪峯監製、鄭保瑞執導、游乃海編劇、香港電影品質保證「銀河映像」攝製的最新驚

  悚懸疑力作《命案》，即將在6月30日於全台震撼上映。本片以「一切皆是命，半點不由

  人」為中心命題，講述一個癲狂的命理大師，與一個天性殘暴的茶餐廳少東，因為一樁血

  腥的連環殺女命案機緣巧遇，兩人展開與天抗命、絕地求生的故事。全片氣氛緊湊、剪接

  凌厲，既探討命定論與自由意志的順應與抗爭，也輔以兇殺命案的懸疑解謎，更透過風格

  化的敘事及影像，將香港的城市面貌，呈現出宛若世界末日般的舞台，讓全片因此獨樹一

  格，不僅強勢入選柏林影展特別放映，更相繼入選香港電影節開幕片、新加坡華語電影節

  、義大利烏迪內遠東影展。直到本片正式在香港上映後，更榮登香港開片暨首週末新片票

  房冠軍，累積總票房已經突破千萬港幣，絕對是台灣觀眾不容錯過的年度必看香港電影。





  《命案》由屢獲金馬獎與香港電影金像獎「最佳導演」肯定的杜琪峯領軍，並與獲得金馬

  獎、金像獎「最佳編劇」的游乃海，以及透過《智齒》勇奪金馬獎、金像獎各四大獎項肯

  定的鄭保瑞攜手合作。這也是鄭保瑞與杜琪峯繼2009年《意外》之後再度合作，以「鐵三

  角」的品質保證組合，讓全球影迷引頸期盼。尤其本片由有「銀河映像，難以想像」之稱

  的香港電影優質品牌「銀河映像」攝製，尤其銀河映像推出的作品，部部都是知名佳作，

  更喜愛透過電影講述黑暗、宿命、情義，諸如早期多部作品如《暗花》、《真心英雄》、

  《非常突然》、《暗戰》等片都有相關命題。本片也同樣充滿不少銀河映像的影子，結合

  神怪命理、玄學改運、精神疾病、驚悚懸疑的劇情，輔以片中流露的黑色幽默，都能找到

  銀河映像的經典電影元素，絕對是喜愛銀河映像的觀眾們會回味無窮的佳作。



  本片主要演員各有精彩表現，由金像獎影帝林家棟詮釋命理大師，將帶來比前作《智齒》

  角色更歇斯底里、更癲狂的演技，也讓各界看好他將以本片再度問鼎各大電影獎影帝。而

  相較銀河映像過往作品，都由經驗老到的演員擔綱要角，這次竟大膽起用新晉演員，由香

  港超人氣男團「MIRROR」隊長楊樂文，詮釋內心蘊藏殺戮之氣的茶餐廳少東，讓人眼睛一

  亮。尤其他過去曾演出《狂舞派》，雖然演戲經驗不多，但他在本片的演技簡直跟本人判

  若兩人，完美詮釋出這個難度極高的角色，可謂是脫胎換骨。此外，飾演老警探的吳廷燁

  ，演技也是毋庸置疑，跟林家棟與楊樂文可說是本片的幕前鐵三角。另一方面，曾合作過

  《飯戲攻心》舞台劇的陳湛文與黃呈欣，也在片中有突破性演出，是全片的兩大驚喜。





  《命案》一推出，就強勢入選柏林影展特別放映，成為該年度唯一入選的香港電影，影展

  方更美譽本片是「一部超現實、高度亢奮、表現主義的驚悚片。」此外，本片也相繼入選

  香港電影節開幕片、新加坡華語電影節、義大利烏迪內遠東影展。正式在香港上映之後，

  不僅榮登香港開片暨首週末新片票房冠軍，目前的累積總票房更已經突破千萬港幣。好評

  也是一波波襲來，《飯戲攻心》導演陳詠燊便盛讚本片：「近五年最佳香港電影，沒有之

  一。」



  這部由杜琪峯監製、鄭保瑞執導、游乃海編劇、香港電影品質保證「銀河映像」所攝製的

  最新驚悚懸疑力作《命案》，即將在6月30日於全台震撼上映。本片劇情描述一場暴雨夜

  裡，命案悄然發生，妓女慘遭連環殺人魔殘殺。一心想幫妓女化解「死刧」的命理大師（

  林家棟飾演）看著屍體悲痛萬分，不過一旁送錯外賣的茶餐廳少東（楊樂文飾演）卻踏著

  鮮血興奮莫名。二人機緣巧合相遇，大師算出少東將因為殺人而犯牢獄之災，少東也怕再

  陷囹圄，請求大師幫忙改命。另一方面，曾目睹少東殺貓的老警探（吳廷燁飾演）堅信少

  東是天生的心理變態，無法甩掉嗜血本性；大師卻認為既是天生，那錯的就不是少東，而

  是命運！大師使盡風水術數、中西玄學，不過總是人算不如天算，鎩羽而歸…。黔驢技窮

  之際，老警探步步進逼、殺人魔虎視眈眈、還有年輕妓女的致命誘惑，讓少東的殺念愈發

  熾烈，執刀就要踏上殺戮之路！而大師也頻頻面臨精神崩潰，讓眾人開始迎來命中注定的

  大刧…！



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
