title: '[好雷] 命案'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  犯罪劇情片一直以來都是港片的大宗，不論是廉政公署ICAC或古惑仔題材，還是警察故事

  系列，都是港片迷津津樂道的電影。不過，港片近年來也開始拓展其他片型，懸疑驚悚片

  《命案》雖說是輔導級，但片中的血腥殺人場面並不是重點，真正的命題是海報上倒置的

  「命」字。



  一場暴雨夜裡，命案悄然發生，妓女慘遭連環殺人魔殘殺。命理大師與茶餐廳少東二人機

  緣巧合相遇，大師算出少東將由於殺人而犯牢獄之災，少東也怕再陷囹圄，請求大師幫忙

  改命。黔驢技窮之際，老警探步步進逼、殺人魔虎視眈眈、還有年輕妓女的致命誘惑，讓

  少東的殺念愈發熾烈，執刀就要踏上殺戮之路！而大師也頻頻面臨精神崩潰，讓眾人開始

  迎來命中注定的大刧…！



  片長100分鐘左右，說短不短，說長不長，但是情節緊湊，引領著觀眾進入故事的是兩位

  主要演員的精湛演技。香港影帝林家棟的演技不用說，以《無間道》與《葉問》聞名的他

  非常多產，也跨足製片領域，像是《打擂台》與《殺出個黃昏》都是他所監製的作品，他

  也在導演的上一部作品《智齒》擔綱男主角，更首次入圍金馬獎最佳男主角。在《命案》

  中，他不但飾演一位篤信各種算命方法的命理大師，生動演繹各種「寧可信其有」的迷信

  、禁忌與習慣，也在電影後半段詮釋發瘋的精神病患，轉換自如令人驚嘆。



  另一位主要角色少東是由偶像團體出身的楊樂文飾演，雖然以歌唱與舞蹈能力著稱的他，

  戲劇作品較少，但他也積極往戲劇方面發展，包括影集《IT狗》、恐怖片《有客到》與《

  狂舞派》系列。但是，這次為了演出《命案》特別進行「地獄式」節食，將自己瘦到臉頰

  凹陷的「不健康」模樣，搭配全片他面目猙獰的表情，飾演命中註定會成為殺人犯的少東

  極為有說服力。好幾幕他對著鏡頭路出噬血的表情，都讓觀眾捏把冷汗，擔心他真的要落

  入老天安排好的劇本之中。



  「一切皆是命，半點不由人。」



  其實，電影真正要講的是「可能是命」，但絕對不會不由人，重要的是個人的選擇。大師

  因為家族有精神病的遺傳因子，讓他時時刻刻小心不讓自己陷入同樣的結局，他發現自己

  若幫助少東改變命運便會走上發瘋之路後，一度決定撒手不管，可是，在少東一氣之下毀

  壞他種植的植物後，他赫然發現「花落方能結果」的道理，並認定自己是「花」，決心幫

  助少東。最後，雖說他的確發瘋，甚至還遭鬼上身（或人格分裂），但對大師來說，這是

  他個人的選擇，所以在這場與老天的對決裡，獲勝者是他。



  連續殺人魔在對老警探宛若詭辯的自白裡說，自己也是「百般不願意」，警探以為他在說

  自己不願意只擔任物理治療師，但殺人犯其實指的是變態殺人這件事。當年身為醫學生的

  他，無法戰勝恐懼，自己解剖的老鼠沒有死透化為陰影，從此與雨天的意象連在一起，造

  就他的變態殺人性格，或許他將自己無法順利成為醫生的原因怪罪給老鼠、怪罪給雨天，

  但「都是他們的錯」本身就是一種不懂得檢討自己，只會怪罪別人的作法，這也是種選擇

  。



  至於少東，從他相信大師自己的暴戾性格來自「命」之後，他便一心想改，但不管他與大

  師怎麼做，老天似乎都能不斷出招，將他掰回劇本裡所寫的模樣。直到他差點拿刀刺殺老

  警探之前，他看到柏油路面一處小水坑裡一隻螻蟻，無論老天怎樣以水滴降下滿滿的惡意

  ，都不減其想跨越水坑的意志。可能受到這個畫面啟發，就連本來在停屍間看著將要發瘋

  的大師說要讓軌上自己身時滿是抗拒的少東，在最後的天台屋頂上，都對天大喊「我是那

  個好人」。在少東心裡，他何嘗不想當好人呢？但最後選擇不殺人的是他，所以在片尾走

  在陽光下的也是他。



  不過，由於老天會出招，因此，要能做出選擇也不是那麼簡單的事。電影從一開始就不停

  告訴觀眾，不論你多努力想要改變命運，終究會走到該走的路上。電影開場就在墓園，營

  造出相當恐怖的氛圍，大師算出美美姊今夜會有死劫，所以認為要「假死」騙過老天才能

  化解。沒想到，各種「假死」的伎倆都差點變成真死，最後美美姊氣到搭計程車離去，大

  師這才發現不但寫有美美姊名字的改命符，就連那片不詳的雨雲都跟著美美姊移動。這是

  本片的第一場命案，但卻不是最後一場，而破案也不是電影的重點，但一切都與「命」環

  環相扣。



  其實，大師的道行的確高深，他不僅最後終於成功幫少東改命，所有他曾經算出會喪命的

  人也確實都沒能救回，甚至連鳳姐愛賭成性會「害死她」都精準命中。但是，要與老天鬥

  光是有這點能耐還不夠，想放生積陰德，老天就讓所有的鳥都死光；想派發愛心餐轉性，

  老天就讓少東在此時發現兇手藏在家中餐廳廁所夾板的凶器。如果說大師必定得瘋少東的

  命才改得成，那少東改命的關鍵想必就是在停屍間裡「公雞撲翅」的瞬間。當大師刺在背

  上的防瘋癲符遭福馬林腐蝕，他為少東所做的一切才真正發揮效果，這又該說是大師獲勝

  嗎？抑或是老天本就打算讓大師發瘋，以拯救少東的靈魂呢？



  片中提及各種算命手法，舉凡八卦、八字、風水等亞洲傳統命算學的領域都有跨足，甚至

  連紫微斗數與西方的五芒星布陣都有納入，還被少東戲稱為「哈利波特」。認真說，大師

  所做的安排的確都有發揮其功效，就連他送給鳳姐的佛珠與水晶，最後都在她面對連環殺

  人魔時派上用場，只可惜她對彩券的執念，讓她錯失活命的機會。最後，電影也讓大師在

  發瘋的狀態下將自己部份的命算學書籍燒毀，代表與其迷信，不如相信一定程度能讓自己

  心安的部分，其餘就「盡人事，聽天命」。



  初看到《命案》的劇情介紹，會讓人以為又是一部與《智齒》類似的底層社會悲歌，再加

  上《智齒》暴力血腥到得將畫面黑白處理才不會帶給觀眾太多不適，《命案》無論是片名

  還是開場都讓人害怕，但為了緩和這種氣氛，片中安插不少笑料，雖然有時稍嫌出戲，但

  導演就是要讓觀眾跳脫出來，才能客觀看待片中角色的境遇。除了開場遭遇死劫的美美姊

  之外，觀眾在片尾字幕出現之前，都無法得知其餘主要角色的名字，這也象徵個人選擇決

  定改命與否的戲碼，其實每天都在我們之間上演。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
