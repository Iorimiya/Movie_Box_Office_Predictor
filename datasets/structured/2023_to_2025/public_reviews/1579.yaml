title: '[情報] 港片【命案】北中南全台首映搶先看 '
content: '活動原文：


  凡對【命案】有興趣者，填寫報名表單即可有機會 #免費搶先看電影，名額有限，先報先

  贏，這次，命運掌握在你手上！

  　




  *報名期限截至6/25(日) 中午12:00以前


  　


  - 台北首映：6/26(一) 19:00 美麗華影城

  - 台中首映：6/26(一) 19:00 台中TIGER CITY威秀影城

  - 高雄首映：6/26(一) 19:30 喜樂時代影城 高雄總圖店

  　



  【命案】1小時48分，預計為輔15級

  精采預告：


  　


  報名請填寫上方表單，經確認後將會於6/21(三)、6/25(日)分兩波發送報名成功通知，報

  名者請留意各信件收件夾或垃圾信件夾通知。活動當日憑身分證／居留證／護照等有效證

  件之正本，至活動現場打卡關鍵字 #電影命案 #必看 #6月30日 出示於報到桌工作人員即

  可取票劃位，免費搶先觀賞電影！（打卡於個人社群帳號，如Facebook、Instargram等平

  台）

  　



  ▶活動當日報到參與者須攜帶身分證、護照或居留證之有效正本、恕不接受影本或照片等

  形式，身分認定及參加資格以現場采昌人員判定為基準。


  ▶活動當日如遇天災等不可抗力取消，恕不補辦。


  ▶請準時入場觀賞，電影開演後20分鐘影城及主辦單位有權謝絕入場。


  ▶主辦單位保有活動修改、取消及最終解釋之權利。


  ▶活動期間請全程配戴口罩並配合現場規範。


  ▶如報名成功而現場因故未到且未事先通知者，或活動現場不依工作人員指示之觀眾，日

  後相關活動將斟酌審核報名資格。


  ▶本片預計分級為輔十五級，活動當日將公告確定之電影分級，請自行斟酌報名，如現場

  審核不符合年齡資格將謝絕入場。


  --'
