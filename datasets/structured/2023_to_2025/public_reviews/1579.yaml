title: '[新聞] 香港金獎編劇游乃海打造【命案】驚奇故事'
content: '新聞網址：



  由「香港電影鐵三角」杜琪峯監製、游乃海編劇、鄭保瑞執導、香港電影品質保證「銀河

  映像」攝製的最新驚悚懸疑力作《命案》，即將在6月30日於全台震撼獻映。本片請來「

  金像獎影帝」林家棟領銜主演，詮釋與天抗命的癲狂命理大師，可說是他瞄準影帝寶座的

  又一代表作品。據悉，本片劇本概念源於編劇游乃海的真實算命經歷，當年算命師鐵口直

  斷他會發瘋，遭受打擊時會想不開，卻又說幸好他為人樂觀，所以將平安無事：「好像是

  說了等於沒說的廢話，多年後卻明白那正是『萬般皆是心，點點皆由人』的道理。」值得

  一提的是，林家棟開拍的第一幕戲，就是要在墓地幫人念咒改命，他回憶開拍前一天的深

  夜11點才收到劇本，還要念詞順暢，又要一鏡到底，還得念咒不能出錯，咒語又有客家口

  音，讓他一個頭兩個大，連夜請真的師父錄音，自己跟著背誦，一背就到凌晨三點，讓他

  直呼印象深刻。





  《命案》透過一位癲狂的命理大師，與一位天性殘暴的年輕人，兩人因為一樁連環殺女血

  案相遇，並試圖與天抗命。全片探討命定論與自由意志的順應與鬥爭，輔以兇案連結，讓

  電影獨樹一格，這也歸功編劇游乃海精采的劇本刻劃。曾以《大隻佬》與《黑社會》兩度

  榮獲香港電影金像獎最佳編劇肯定的他，這回鋪陳命理大師擔心自己會發瘋，進而做出各

  種對抗命運的行為。其實現實生活中，他自己也有類似經歷。據悉，算命師當年鐵口直斷

  他會發瘋，遭受打擊時會想不開，卻又說幸好他為人樂觀，所以會平安無事：「好像是說

  了等於沒說的廢話，多年後卻明白那正是『萬般皆是心，點點皆由人』的道理。」這也讓

  他執筆將這段經歷寫成本片藍本，更翻轉意念，以「一切皆是命，半點不由人」為中心命

  題，故事值得觀眾玩味。



  導演鄭保瑞透露，當初聽到游乃海的這個故事，便產生很大的興趣，所以創作上主要交由

  他主導，再融入自己的導演風格：「在創作上，乃海是主導的，有他創作已經不用擔心，

  我嘗試將自己的想法和角度放低。我盡量不影響劇本和電影結構，但諸如片中兇手的殺人

  方法，乃海就放手給我調度。我會向乃海提出問題，或問一些不明白的地方，之後由乃海

  自己去消化。我不想讓《命案》成為很鄭保瑞的電影，我盡量去投入和參透他的想法，再

  去拍攝。」他更指出本片是一個比較奇妙、不知道怎麼歸類的電影：「很多人看過後，都

  覺得跟我前作《智齒》，是完全兩個不同風格的電影。」





  值得一提的是，《命案》一幕在墓地念咒改命的戲，劇本竟然是在開拍的前一晚，才送到

  男主角林家棟手中，林家棟對此回憶：「開拍前一晚的11點多才收到劇本，我立刻趕回公

  司看。因為角色有客家口音，我想傳神一點，所以請求劇組提供一些師父念咒的錄音給我

  參考，我就跟著背，希望做出那種感覺。」他更補充：「因為全段要依照他們的節奏、說

  話、動作去演出，還要求一鏡到底，自己要一路唸到有風吹起，然後下雨。那幕戲最辛苦

  ，因為單是對白就好幾頁，所有術語都要熟記不能出錯。第一天就要拍這段戲，很有趣但

  也是很大的挑戰。」而這幕墓地改命的戲，也讓他有感而發：「我不禁問自己，是否只要

  唸幾句咒語和經文，就可以真的解脫？上個香、拜個神就會變好？當然我們不能從太科學

  的角度去看，這其實都只是讓人心安，但我從第一天開始，就被這想法籠罩住整個角色。

  」



  這部由杜琪峯監製、鄭保瑞執導、游乃海編劇、香港電影品質保證「銀河映像」所攝製的

  最新驚悚懸疑力作《命案》，即將在6月30日於全台震撼上映。本片劇情描述一場暴雨夜

  裡，命案悄然發生，妓女慘遭連環殺人魔殘殺。一心想幫妓女化解「死刧」的命理大師（

  林家棟飾演）看著屍體悲痛萬分，不過一旁送錯外賣的茶餐廳少東（楊樂文飾演）卻踏著

  鮮血興奮莫名。二人機緣巧合相遇，大師算出少東將因為殺人而犯牢獄之災，少東也怕再

  陷囹圄，請求大師幫忙改命。另一方面，曾目睹少東殺貓的老警探（吳廷燁飾演）堅信少

  東是天生的心理變態，無法甩掉嗜血本性；大師卻認為既是天生，那錯的就不是少東，而

  是命運！大師使盡風水術數、中西玄學，不過總是人算不如天算，鎩羽而歸…。黔驢技窮

  之際，老警探步步進逼、殺人魔虎視眈眈、還有年輕妓女的致命誘惑，讓少東的殺念愈發

  熾烈，執刀就要踏上殺戮之路！而大師也頻頻面臨精神崩潰，讓眾人開始迎來命中注定的

  大刧…！



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
