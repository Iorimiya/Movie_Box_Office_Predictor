url: https://www.ptt.cc/bbs/movie/M.1688293160.A.601.html
title: '[好雷] 命案──好的劇本與好的演員'
content: '雷文防雷資訊頁






  看到版上好像已經有人分享命案，

  前幾天跟朋友一起去看了，我也來分享一下


  故事講述一心想幫他人對抗命運、也想改變自己宿命的算命師，

  經由一次命案中遇見了天性中帶有殺戮衝動的餐廳少東(主角?，

  透過一連串的方法試圖幫助餐廳少東改變命運，

  同時也抵抗著自己小時候被算命師所算出的宿命，

  隨著後續故事發展，有的事情似乎不受控制，

  有的事情又似乎隨著冥冥中的軌跡不可避免地前進著，

  就像是影片中所說的『一切皆是命，半點不由人』，

  如果你想要改變命運，那就必定會有所犧牲，

  而那個犧牲就很有可能是你自己


  跟朋友一起看了這部片，由於風格強烈，這邊要開出電影板的大絕招了


  我覺得這方面其實滿挑頻率的


  一起看的朋友認為這整個表現方式有點太”Over”了，

  但我自己是很喜歡這種強烈的風格，而且正是這種強烈感

  所以更能呈現命運那種讓人無可迴避的感覺


  劇本部份我們兩個是都很喜歡，整個故事說得很流暢，節奏上的把控也很好，不會刻意說教

  結局乍看之下是好的，但後勁挺強的

  尤其算命的跟少東說，未來還有一堆關卡就覺得很可怕

  試回想，很多人的人生，不也是如此嗎？


  電影裡的驚悚感很強，我尤其都被一些意想不到的地方嚇到，真的很刺激XD


  尤其是後面在上身那邊，我竟然被嚇到整個人跳起來……


  從一剛開始把人埋進土裡開始改命那邊到結尾，基本上可以說是完全沒有冷場，而且不看到

  最後真的不知道劇情會怎麼走，很多時候甚至都會有一種想要認命的感覺，尤其是主角在廁

  所撿到凶器那邊，真心覺得這次應該很難救了XD


  總之整體來說劇本不錯

  重點是演員的演技超強，完全能撐起這個劇本的氛圍

  真的要說小缺點的話大概就是特效有點假吧，而且命運交響曲我震驚了一下

  但看完之後是覺得還不錯，滿推薦大家去看的



  --'
