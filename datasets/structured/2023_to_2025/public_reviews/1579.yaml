title: '[新聞] 《嚇地獄》鬼屋成命案現場　屍體被當道'
content: '新聞網址：


  《嚇地獄》鬼屋成命案現場　屍體被當道具照玩


  恐怖新片《嚇地獄》（Hell Fest）描述鬼屋樂園發生毛骨悚然的傳說，據傳兇手把屍體

  丟棄在現場，卻被遊客當成裝飾的道具，直到3天後屍體開始發臭才被人發現，而兇手卻

  早已逃之夭夭，再也沒有被找到。大學生娜塔莉和朋友們不顧詭異的都市傳說，一起到新

  開幕的「地獄樂園」試膽玩樂，卻真的碰上傳說中的鬼屋殺人魔。


  《嚇地獄》由《忌日快樂》、《逃出絕命鎮》剪接師葛瑞格里普洛金（Gregory Plotkin

  ）執導，而本身就是恐怖片超級粉絲的他，也在面具殺人魔傑森、麥克邁爾斯和《驚聲尖

  叫》（Scream）系列等角色身上找到許多靈感，擷取經典恐懼元素玩出新花樣。


  劇情描述娜塔莉與朋友們相約到地獄樂園過萬聖節，縱情玩樂的同時，卻遇上戴著面具的

  冷血殺人魔，更目睹弒血命案的整個過程。娜塔莉等人嚇得魂飛魄散，拚了命想逃離恐怖

  殺人魔的魔掌，然而其他遊客卻以為這一切都是主辦單位精心安排的試膽會，殊不知，歡

  樂遊樂園早已變成殺人魔的嗜血遊樂場。該片已在台上映。（謝宛儒／綜合報導）


  --'
