  記者陳雅蘭/綜合報導


  2022-05-20 22:00:00


  日本導演片山慎三攜手《AV帝王》幕後製作團隊籌備近3年的《尋人啟弒》今（20日）釋

  出預告，此片發想2017年轟動日本真實血案的「座間九屍命案」，當年命案影響政府，在

  內閣會議上決定強化使用社群網站中的自殺訊息流出，以防社會上接二連三的模仿犯發生

  。




  《尋人啟弒》描述打零工維生的原田智，在某日目擊到連環殺手後，為了300萬的尋賞金

  而神祕失蹤，就讀高中的女兒原田楓為了協尋父親，焦急四處追尋，跟著線索一路來到父

  親打工之處，卻發現一名陌生年輕人出現，這人卻是警方通緝中的連環殺手。


  該片發想於「座間九屍命案」，血案揭發於2017年10月31日的連環殺人事件，案發地點在

  一間租賃公寓，由當時27歳的凶嫌白石隆浩承租。彼於8月22日至10月30日間，在上述公

  寓內將案中死者殺害分屍，現場共計發現9名年輕男女的遺體。



  導演片山慎三師承韓國名導奉俊昊，多年來執導風格不以傳統日本敘事見長，《尋人啟弒

  》將父女間親密的生活氣息描寫細微，影片調性更以突轉湧現的猛烈暴力、深藏其中的社

  會批判，以衝擊性畫面建立懸疑內容，讓觀眾一下子可以進入電影中。


  導演片山慎三在結束拍攝《海角上的兄妹》後，不急於馬上交出下部作品，反而投身於小

  銀幕潛心學習，開始與國際與日本串流平台合作，從NETFLIX影集《AV帝王》第一季擔綱

  所有集數的第一副導，更讓他在這次合作中與資深編劇小寺和久建立深厚默契，共同創作

  出《尋人啟弒》劇本。《尋人啟弒》6月17日在台上映。


  《尋人啟弒》電影預告:



