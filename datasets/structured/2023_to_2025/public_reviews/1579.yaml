title: '[好雷] 命案 好好看喔'
content: "1. 看到大螢幕擺出來那個銀河映像的logo加那個Bleeeezz音效就是爽\n\n2. 開頭3分鐘直接有fu!\n   開場墓穴改運,\n \
  \  那種沒頭沒尾的事件中間切入, 卻直接讓人腦補完前因後果故事\n   這就是銀河映像！這就是銀河映像敘事的DNA!\n   再看到滂礡大雨, 人埋泥水中,\
  \ 這種玩到盡, 拍到絕的狠感\n   這就是鄭保瑞! 沒錯這就是鄭保瑞!\n\n3. 開頭完之後接到第一個兇案\n   整段故事跟吉他音樂配得很讚! 有fu!\n\
  \n4. 到一半感覺好像在看鬼片一樣\n   林家棟算這算那, 出口成章搞得有種林正英的片樣子\n   要不是這是現代片, 還真的懷疑有鬼出來\n\n5. 林家棟這次總算讓我覺得他是主角\n\
  \   對他的既有印象一直是萬年配角, 還多半是演討人厭的配角\n   就連之前的樹大招風, 甚至領銜的智齒我還是覺得他演得很像配角\n   但這次我覺得他有把主角的感覺演出來了\n\
  \   搭配到後段劇情跟結尾, 讓我覺得這有點劉青雲上身啊\n   完全可以想像得到這些卜卦算命的情節, 甚至是最後結局由劉青雲來演的樣子\n   如果這片早個幾年出來,\
  \ 搞不好真是劉青雲當主角了吧\n   (不過也有可能是游乃海編劇的關係)\n\n5. 除了鬼片, 還看出了偵探片的血肉在裡面\n   因為主角, 事件, 甚至用具在本片範圍一早就定出來了\n\
  \   故事就是在這些元素裡打轉而已, 跟偵探片很像\n   就是你會知道有人死,\n   但不知道是少東殺算命師, 還是殺警察 還是殺妓女\n   還是是連環兇手殺人,\
  \ 還是是算命師殺人, 到底劇情會哪個殺哪個\n   可是我還是都沒猜到情節是怎麼展開, 很刺激!\n\n   真的是那句, 情理之內, 意料之外\n\n6.\
  \ 本片基調跟意象上都跟鄭保瑞舊作「意外」很像\n   但我覺得比意外還好看一些, 甚至比前年的智齒還好上不少\n\n7. 結尾逆轉時很感動又激動啊\n\n\n\
  --\n                                       06/30 22:28\n應該的確就是人能改變命運\n鄭保瑞訪談有說這次是他拍過最勵志的一部片\n\
  把這部跟去年奈沙馬蘭的敲敲門擺一起比較蠻有意思的\n一個是一步步讓人向命運投降\n這部則是讓主角越來越努力"
