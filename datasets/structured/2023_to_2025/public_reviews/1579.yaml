url: https://www.ptt.cc/bbs/movie/M.1688394261.A.FAE.html
title: '[好微雷] 《命案》一切皆是命，半點不由人？'
content: '這部電影以算命玄學+命案為主軸，

  藉著這兩大主題，探討了所謂宿命與選擇，

  劇情就不詳述，因為我覺得每個人看或許會有不同感受，

  (這也是我喜歡這部電影的原因之一)

  這篇主要是想說說我自己喜歡的幾個部分


  1.演員演技



  因為整部片的氛圍是比較戲劇化的，

  其中除了有一些極端性格的人設，亦有一些幻想與幻象的畫面呈現，

  這種時候就很吃演員的表現，

  而不管是林家棟飾演的算命師、楊樂文飾演的餐廳老闆兒子

  都表現得很好，在電影中整個人物的呈現都非常立體，且感染力很強，

  觀影的過程中可能只是一個表情或一個眼神，觀眾就可以感受的到演員的想法或內心的掙扎

  ，雖然有時候會覺得有點「用力」，有點浮誇

  但因為劇情剛好有滿滿的宿命感，所以這種用力就顯得恰到好處。


  2.配樂


  配樂在這部電影裡面不只是背景音樂而已，

  它同時是角色內心的一部分、也是劇情線發展的暗示，

  大家在看的時候不妨觀察一下配樂與整體故事之間的關聯，

  不過這個不用特別用力去聽應該就聽得出，

  畢竟命運交響曲的存在感實在太強烈XD


  來被命運衝撞一下吧(這版本很可愛)



  3.適當的留白


  由於故事主軸中有不少玄學的元素，

  如果要仔細探討的話當然是可以把因果關係一層一層拆開來細看的，

  不過我覺得這樣就會少了一些想像空間，

  所以電影中給了每位角色(尤其是算命師的故事)適當的留白，

  有些東西或許劇情有提到，但是並沒有說死，

  所以觀眾可以從主線故事中人物們所做的選擇去推測那些沒演出來的地方到底發生了什麼，

  算是留了一些想像空間，像我就很好奇殺人兇手為什麼會有這樣的一面，他的過往畫面跟故

  事我覺得有點太少了。


  整體而言個人是挺喜歡這部片的，

  血腥的部分一定有，但整體程度我覺得尚在可接受的範圍，

  頂多只有2~3三個地方被嚇到XD


  不想看好萊塢特效滿出來的商業片，這片可以考慮

  但不喜歡精神病人格和相關詮釋的，那可能就不推



  --'
