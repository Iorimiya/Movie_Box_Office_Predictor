url: https://www.ptt.cc/bbs/movie/M.1686748260.A.022.html
title: '[新聞] 林家棟【命案】天台發癲，拍53次直喊崩潰'
content: '新聞網址：



  由「香港電影鐵三角」杜琪峯監製、游乃海編劇、鄭保瑞執導、香港電影品質保證「銀河

  映像」攝製的最新驚悚懸疑力作《命案》，即將在6月30日於全台震撼獻映。鄭保瑞與「

  金像獎影帝」林家棟繼《智齒》後再度合作，兩人建立十足的默契與信任。雖然如此，林

  家棟還是感嘆每次拍鄭保瑞的戲都很辛苦，尤其片中一場天台對峙戲，讓他一個鏡頭就拍

  了53次，大破自己過往紀錄，讓他洩氣又崩潰地直呼：「也是我命苦囉！」不過在片中飾

  演命理大師的他，卻透露自己在現實生活當中，其實並不太相信風水玄學，反而信任自己

  多於天命：「再重大的事情，只會考慮做與不做，不會去問師父。我本身是佛教徒，相信

  一個道理，人性的約束，這便已經足夠。」





  《命案》透過由林家棟飾演的癲狂命理大師，與楊樂文飾演的天性殘暴年輕人，兩人因為

  一樁連環殺女血案相遇，並試圖與天抗命。全片刺激、癲狂、驚悚又充滿狂想，絕對是年

  度必看香港電影。尤其出道已經30多年的林家棟，透過本片再次貢獻精湛演出。他跟導演

  鄭保瑞繼《智齒》後再度合作，也歸功於導演對他的絕對信任。鄭保瑞對此表示：「找他

  的原因，主要是因為他的演出能力，另外就是我跟他在《智齒》所建立的信任。對演員來

  說，我想這個角色會充滿很多疑問，也有很多不容易的地方，可是我覺得我跟演員的信任

  程度，是非常重要的，而且我相信家棟會有不一樣的演出，於是跟杜琪峯導演聊了之後，

  覺得還是要找家棟來演。」



  正因為角色的表現難度，以及導演的指名演出，反而苦了林家棟。尤其一場天台對峙戲，

  他必須展現出角色的癲狂面貌，而且導演還要求一鏡到底拍五分鐘，讓他光是這一個鏡頭

  就拍了53次，大破自己過往紀錄，也讓他回憶起這段演出過程，洩氣又崩潰地說：「也是

  我命苦囉！他經常叫我試，其實他心裡早有個底，但又現場才有劇本，還要幾頁紙長，準

  備時間就變少了。」導演也回憶：「那場戲從早上九點拍到中午吃飯，吃完又回來拍到兩

  點多，總共拍了五、六個小時。他把自己的所有都掏出來了，非常難演，如果演得不好，

  就更不像是『人』。我覺得家棟把它融合了，把那個瘋癲的感覺，跟人的味道融合在一起

  。這個角色是很容易臉譜化的，但我覺得他把它融合得很好。」





  不過在《命案》飾演命理大師的林家棟，反而在現實生活中不太相信風水玄學，不論是公

  司或住家都沒有任何風水擺設，反而更相信自己多於天命，他對此表示：「前途不順時，

  我都沒去求神問卜，頂多就是跟人去安太歲，再重大的事情，只會考慮做與不做，不會去

  問師父。我本身是佛教徒，相信一個道理，人性的約束，這便已經足夠。」而對於本片所

  探討的「天意不可違？還是人定可勝天？」主題，他也坦言這是本片給他最重要的思考課

  題：「我相信只要稍微成長，都會不斷去思考這個課題。當你完成了一件事，你贏了當然

  會說人定勝天，但當你失敗的時候，你會質疑是否天意不可違，這是我從片中角色對自己

  的生活和生命的一種連結。其實人生充滿這種問號，我覺得電影給大家帶來這個提問，最

  重要的是，觀眾思考到了什麼。」



  這部由杜琪峯監製、鄭保瑞執導、游乃海編劇、香港電影品質保證「銀河映像」所攝製的

  最新驚悚懸疑力作《命案》，即將在6月30日於全台震撼上映。本片劇情描述一場暴雨夜

  裡，命案悄然發生，妓女慘遭連環殺人魔殘殺。一心想幫妓女化解「死刧」的命理大師（

  林家棟飾演）看著屍體悲痛萬分，不過一旁送錯外賣的茶餐廳少東（楊樂文飾演）卻踏著

  鮮血興奮莫名。二人機緣巧合相遇，大師算出少東將因為殺人而犯牢獄之災，少東也怕再

  陷囹圄，請求大師幫忙改命。另一方面，曾目睹少東殺貓的老警探（吳廷燁飾演）堅信少

  東是天生的心理變態，無法甩掉嗜血本性；大師卻認為既是天生，那錯的就不是少東，而

  是命運！大師使盡風水術數、中西玄學，不過總是人算不如天算，鎩羽而歸…。黔驢技窮

  之際，老警探步步進逼、殺人魔虎視眈眈、還有年輕妓女的致命誘惑，讓少東的殺念愈發

  熾烈，執刀就要踏上殺戮之路！而大師也頻頻面臨精神崩潰，讓眾人開始迎來命中注定的

  大刧…！



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
