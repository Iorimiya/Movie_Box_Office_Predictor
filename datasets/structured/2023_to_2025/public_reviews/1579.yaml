title: '[好雷] <命案> 一部很棒的懸疑驚悚片'
content: '雷文防雷資訊頁


  有幸在30號上映之前參加26號的首映，趁明天上映前小小分享下心得




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  其實在電影的開頭，我腦袋當中一直想著「這下一秒應該會有殭屍跳出來吧？」的想法，

  還以為會是殭屍片XD


  主角是一位命理大師（林家棟飾演），開頭場景是要幫一位名叫美美的妓女化解她的「死

  劫」而在墓園做法，但後來因為下起了滂沱大雨，最終妓女覺得根本沒用還很浪費時間，

  對著主角發脾氣憤而離開墓園，也未完成這個化解的儀式，接著整部電影的懸疑驚悚感就

  開了特快車，幕幕驚悚


  看過之後才發現，兩個主角都有精神上的疾病(或說人格異常特質)，這兩個演員也將這種

  精神狀態演繹得非常到位，讓我在看完電影時，覺得非常的過癮


  林家棟飾演的命理大師，因為擔心自己有一天會精神病發，不想害要傷害他的女友，為此

  離開他深愛的人，卻也導致前女友因他的離開而死，互為因果的加重了他的精神疾病


  在劇中他要多次切換角色的心理狀態，甚至還有被鬼附身的情節，這樣的情緒轉換跟演技

  ，真的是很厲害！





  楊樂文飾演的茶餐廳兒子，小時候殺過貓，喜歡刀具，對鮮血跟屍體會感到莫名興奮，拿

  到刀子就會有想殺人的衝動

  楊樂文的演技好到我完全無法相信他是男團MIRROR 隊長，還是這樣的一個大帥哥




  只能說在電影裡面，他真的是演技大爆發，妓院房間內看到鮮血的興奮表情，在血灘上蹦

  蹦跳跳像是在玩耍的那種興奮感，真的是完全沒有辦法把他跟原本的樣子做連結


  整部電影環繞著一樁連環殺人命案展開，整體的懸疑感營造很不錯，在故事上的敘述也很

  簡單，不會像很多懸疑片根本搞不清楚在演什麼，其中，能夠清楚地將幾個人的故事、背

  景、人設、支線，逐漸拼湊成一個完整的劇本，導演說故事的功力還是很不錯的

  我自己是特別喜歡「命案」的這個命題。


  劇中透過黑色幽默般的演示，無論是意外、巧合，還是真的是老天捉弄，在各樣的絕境、

  挑戰當中，將人們蹂躪、玩弄。


  非常喜歡導演最後透過林的嘴巴，說出他對於這個捉弄的解釋：無論天道如何不公，但你

  很重要，你是有選擇的。


  對於結局，不說太多，很多人沒看過，很難有共鳴；但若是對港影有興趣，喜歡驚悚、恐

  怖、命理相關題材的人，很推薦去看，整部電影的情節非常緊湊、過癮，兩個主演演技非

  常優秀，把人物形塑的絲絲入扣，我自己覺得非常棒。


  --'
