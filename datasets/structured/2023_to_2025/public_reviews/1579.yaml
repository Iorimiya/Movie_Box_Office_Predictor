url: https://www.ptt.cc/bbs/movie/M.1673617394.A.E8E.html
title: '[情報] 鄭保瑞新片《命案》入選2023柏林影展'
content: "《命案》香港版前導預告\n\n\n\n\n柏林影展官方今日公布2023年特別放映單元片單\n香港導演鄭保瑞繼《智齒》入選2021年同個單元後，新片《命案》再度入選\n\
  \n《命案》為鄭保瑞暌違10年後再度回到銀河映像旗下拍攝的作品\n前次已是2012年的《車手》，再前則是2009年的《意外》\n\n由銀河映像、Viutv旗下MakerVille共同製作\n\
  杜琪峰與游乃海、朱淑儀共同監製\n游乃海、李春暉編劇\n林家棟、楊樂文、吳廷燁、伍詠詩、陳湛文 主演\n\n\n故事大綱：\n\n一心幫鳳姐化解「死刧」的命理大師\
  \ (林家棟 飾)﹐因鳳姐獨自離開而被鳳姐殺人犯殘殺\n。正當大師悲痛莫名之際卻機緣巧合遇上送錯外賣的茶餐廳少東 (楊樂文 飾) ，並挑起了\n少東與生俱來的殺戮衝動！大師算出少東將會因殺人而犯牢獄之災，少東害怕再陷囹圄，\n\
  求大師幫忙改命。曾目睹少東殺貓的老差骨 (吳延燁 飾) 堅信少東是天生的心理變態，甩\n不掉嗜血本性，大師卻認為既是天生，那錯的不是少東，是命運！大師使盡風水術數、中\n\
  西玄學，但總是人算不如天算，鎩羽而歸…黔驢技窮之際，老差骨步步進逼、兇手虎視眈\n眈、還有年輕鳳姐 (伍詠詩 飾) 的致命誘惑，令少東的殺念越加熾烈，執刀就要踏上殺戮\n\
  之路！而大師也頻臨精神崩潰，命中注定的大刧將至！一切皆是命，半點不由人？\n\n\n《命案》已在香港完成送檢，為青少年與兒童不宜的II B級別\n預計今年於香港上映，由高先電影發行。\n\
  \n而此部也與杜琪峰於Viutv監製的劇集《三命》有關聯，《三命》也預計於今年首播。\n\n--\n                             \
  \      01/13 22:08"
