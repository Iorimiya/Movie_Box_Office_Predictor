url: https://www.ptt.cc/bbs/movie/M.1765927419.A.A8D.html
title: '[新聞] 左撇子女孩衝入奧斯卡最佳國際影片15強'
content: '新聞網址：




  《左撇子女孩》衝入奧斯卡最佳國際影片15強！阿湯哥加持《國寶》也入選


  記者許世穎／綜合報導


  奧斯卡主辦方美國影藝學院於台灣時間今（17）日凌晨正式公布入選第98屆奧斯卡的各項

  短名單，台片《左撇子女孩》順利入選最佳國際影片15強，和日前才剛獲得「阿湯哥」湯

  姆克魯斯力挺的日片《國寶》、韓片《徵人啟弒》等片一同搶奧斯卡入圍門票。


  此次進入最佳國際影片的15強包括法國《只是一場意外》（今年坎城影展金棕櫚得主）、

  阿根廷《Bel幯》、巴西《這不只是個間諜故事》、德國《聽見墜落之聲》、印度《Homeb

  ound》、伊拉克《總統的蛋糕》、日本《國寶》、約旦《All That’s Left of You》、

  挪威《情感的價值》、巴勒斯坦《Palestine 36》、韓國《徵人啟弒》、西班牙《穿越地

  獄之門》、瑞士《失控夜班》、台灣《左撇子女孩》，以及突尼西亞《The Voice of Hin

  d Rajab》。


  由鄒時擎執導的《左撇子女孩》也成為繼李安執導的《喜宴》、《飲食男女》、《臥虎藏

  龍》，還有魏德聖執導的《賽德克‧巴萊》、鍾孟宏執導的《陽光普照》後，台灣電影再

  度入選奧斯卡國際影片短名單，導演鄒時擎也成為台灣首位入選的女導演，意義非凡。


  不過其中僅李安執導的《喜宴》、《飲食男女》、《臥虎藏龍》最終搶到入圍奧斯卡入圍

  席次（當時稱為最佳外語片），且《臥虎藏龍》更順利拿下第73屆奧斯卡最佳外語片，也

  是至今唯一獲得該獎項的台灣電影。


  導演鄒時擎在得知入選消息後也第一時間表達激動與感謝：「入選奧斯卡短名單，對我們

  而言是一個重要的時刻。希望透過這部電影，把台灣推向國際舞台，讓世界在不同文化與

  視角中，看見台灣、理解台灣。衷心感謝一路支持與幫助《左撇子女孩》的每一位夥伴。

  從創作到完成，這部作品匯聚了無數人的專業與付出，也承載了大家對電影的期待。」


  第98屆奧斯卡入圍名單將於2026年1月22日揭曉，頒獎典禮將於2026年3月15日舉行。《左

  撇子女孩》持續在台熱映中，歡迎觀眾進戲院為台灣代表電影加油！






  --'
