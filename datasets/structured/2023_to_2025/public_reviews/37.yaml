url: https://www.ptt.cc/bbs/movie/M.1766937562.A.168.html
title: '[好雷] 左撇子女孩'
content: "只有正視自己的「魔鬼手」，女孩們才能找回自己真正的聲音。\n\n\n《左撇子女孩》是導演鄒時擎首部獨立執導的長片作品，劇本則由她與奧斯卡金像獎名導\n\
  Sean Baker共同創作。雖說本片是由台灣導演執導並由台灣團隊在台灣拍攝，但整體架構\n依然是非常Sean Baker的故事。由日常生活切入並刻劃弱勢女性、並以衝突事件帶出角色\n\
  的核心困境與掙扎，這幾乎是貫穿所有Sean Baker作品的共同特色了。\n\n\n相較於Sean Baker自己的其他作品，《左撇子女孩》的不同之處在於導演鄒時擎有著更明\n\
  顯想傳達的訊息。故事中五歲的左撇子女孩宜靜，因為被外公說了左手是「魔鬼手」，從\n此將生活中發生的壞事、甚至自己的某些不當行為都歸咎於「魔鬼」的責任。在幾乎闖了\n\
  大禍後甚至嘗試將自己的左手「封印」起來。「魔鬼手」在故事裡隱喻的是台灣(或者說\n華人)社會對女性獨有的父權期待。片中的另外兩位女性主角也都面對著類似的課題。母\n\
  親淑芬面對不負責任的丈夫卻依然覺得有責任為他善後，而姊姊宜安的故事牽涉到比較重\n大的劇透，這裡就不多說。我覺得導演想傳達的，是鼓勵女性擺脫父權框架下的社會期待\n\
  ，才能活出真實的自己。\n\n\n《左撇子女孩》是一部紮實的劇情片，想傳達的訊息也十分自然地融入在故事中，然而為\n了傳達這個訊息，我覺得導演還是犧牲了一部分故事的情感穿透力。Sean\
  \ Baker的電影一\n直以來都不是「message film」。他描繪社會底層的女性、不刻意美化卻依然能透過鏡頭\n語言表達出對她們的同理，並讓情感在觀眾心裡很自然地擴散發酵。從整體故事來看，《\n\
  左撇子女孩》真正的主角應該是姊姊宜安，然而導演為了明確想傳達的訊息，安排了許多\n戲份在母親淑芬和妹妹宜靜上，其中宜靜的戲份更是幾乎只為了「惡魔手」的隱喻而存在\n\
  ，這使得初次觀影的觀眾在電影前至中段沒有明確的情緒定錨點，也大大削弱了片尾劇情\n轉折的力道。\n\n\n話雖如此，我還是喜歡《左撇子女孩》的。Sean Baker對小人物的細膩描繪、搭配鄒時擎\n\
  對台灣文化的理解，交織出一部風格獨特又十分美麗的台灣電影。本片即將代表台灣競逐\n奧斯卡最佳國際影片，目前討論聲量不低，也已入圍15強短名單，期待能在國際舞臺上再\n\
  創佳績！\n\n\n個人評分： 3.5/5\n\n--\n\n\nFB粉專: Eugene的電影筆記 \n\n\n\n--"
