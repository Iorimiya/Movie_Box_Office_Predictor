url: https://www.ptt.cc/bbs/movie/M.1763371920.A.9A9.html
title: '[新聞] 奪奧斯卡前夕 西恩貝克忙著剪「左撇子女孩'
content: "奪奧斯卡獎前夕 西恩貝克忙著剪「左撇子女孩」\n\n【大紀元2025年11月17日訊】獲奧斯卡最佳導演大獎的西恩貝克今年3月在奧斯卡締造歷\n\
  史，典禮前一天，他仍埋首剪輯台灣電影「左撇子女孩」。如今這部國片即將代表台灣叩\n關奧斯卡。\n\n西恩貝克（Sean Baker）14日現身洛杉磯的亞洲國際電影節，為「左撇子女孩」站台造勢\n\
  。他不只是監製和編劇，更親自擔任剪輯，與導演鄒時擎合作超過20年。\n\n西恩貝克在映後座談透露「奧斯卡頒獎典禮前一天，我才剛剪完『左撇子女孩』」。\n\n今年3月，他風光奪下奧斯卡最佳導演、最佳影片、最佳原創劇本、最佳剪輯等4項大獎，\n\
  創下奧斯卡有史以來，以同一部作品奪4項獎第一人。\n\n出身獨立電影界的西恩貝克，擅長以低成本拍出動人作品，今年奧斯卡大贏家「艾諾拉」\n（Anora）就是最佳寫照，以寫實手法描寫性工作者的生活，從邊緣族群角度出發，取得\n\
  觀眾共鳴。\n\n這位奧斯卡金獎導演的新作，不在好萊塢，而是一部來自台灣的國片。他與鄒時擎擁有超\n過20年的交情，當年鄒時擎赴紐約攻讀電影碩士，兩人在剪輯課相識，因為品味相近而開\n\
  啟了長期合作的淵源。\n\n\n西恩貝克出席亞洲國際電影節「左撇子女 孩」映後座談。（中央社）\n\n鄒時擎24年前就曾帶著西恩貝克訪問台灣。他回憶當時踏進夜市時，那是一次感官超載的\n\
  衝擊體驗，「我好像孩子一樣，用新鮮的眼光看待這個地方」。\n\n這樣的觀看視角成了「左撇子女孩」的雛形，一個穿梭夜市攤販間的6歲幼童。\n\n作品醞釀超過20年，西恩貝克回憶1999年、2000年與鄒時擎還是電影系學生時，曾受到台\n\
  灣新浪潮電影大師侯孝賢、楊德昌、蔡明亮作品啟發。但他們有一個目標「我們想要拍出\n更有活力、更年輕的台灣電影」。\n\n西恩貝克與鄒時擎共同打造了新一代的台灣電影，他坦言自己仍是外人角度看台灣，他的\n\
  角色是盡力協助鄒時擎，把這個故事搬上銀幕。\n\n他稱讚鄒時擎帶領的演員群非常出色，把一個非常台灣的故事拍成跨國界的動人作品。\n\n談到如何讓台灣的故事走向國際，西恩貝克認為，像「左撇子女孩」就是一例，除了故事\n\
  含有普世主題「家庭衝突」，更重要是不要為了遷就西方觀眾而調整內容。\n\n西恩貝克說，無論是拍攝不同文化、次文化或是特定群體的小宇宙時，最重要的是保留文\n化細節，「這也是為什麼我們不會在電影裡面解釋檳榔是什麼，而是直接呈現它」。\n\
  \n（轉載自中央社）\n\n責任編輯：梁夢竹\n\n\n\n--\n\n                  \n\n\n\n--"
