title: '[普雷] 左撇子女孩'
content: '~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  《#左撇子女孩》入圍九項金馬獎的提名，並獲選代表臺灣角逐2026年美國第98屆奧斯卡

  金像獎最佳國際影片。


  --簡介--

  本片是今年上映的台灣劇情片，講述一名單親媽媽與兩名女兒從鄉下返回台北夜市的生活

  的故事。


  鄒時擎導演與西恩·貝克(Sean Baker)共同編劇，演員陣容主要包括蔡淑臻、馬士媛、葉

  子綺、黃鐙輝、陳慕義、趙心妍。


  --心得--

  這部電影透過夜市生活呈現台灣的人文特色，主要也在描寫「重男輕女」的傳統家庭觀念

  。


  雖說是一部笑淚交織的電影，但是因為劇情的發展不只一條線，大部分時候畫面切換得滿

  快速，氛圍顯得有點凝重而有壓迫感。


  其實我本來沒仔細去看入圍金馬獎的項目，一直以為蔡淑臻或葉子綺會是劇中的主角。沒

  想到看到最後，馬士媛竟然才是？


  然後，私心覺得黃鐙輝演得也很棒！


  最後，也因為有入圍金馬獎的關係，不得不提一下，同樣深刻描述台灣家庭故事的《我家

  的事》:)


  感覺今年的競爭很激烈也很精彩，希望大家進場支持國片，11月22日一起守在螢幕前看頒

  獎結果，會比較有參與感！


  --








