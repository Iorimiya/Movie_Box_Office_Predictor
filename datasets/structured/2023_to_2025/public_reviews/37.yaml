url: https://www.ptt.cc/bbs/movie/M.1762083742.A.39B.html
title: '[好雷] 左撇子女孩'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  旅居好萊塢多年的編劇與製片鄒時擎，終於將埋藏心裡多年，苦於資金而一直無法搬上大

  銀幕的故事，以自己初執導筒的處女作之姿，付諸實現。不但入選2025年坎城影展影評人

  週單元、釜山影展與多倫多影展，更代表台灣角逐明年第98屆奧斯卡最佳國際影片，同時

  入圍金馬獎包括最佳劇情片在內共8項大獎。



  故事開始於21歲的姐姐宜安，5歲的妹妹宜靜，和她們的母親淑芬剛剛從生活多年的台東

  鄉下搬回台北。有一天，宜靜的外公不准她用左手，還告訴她那是「魔鬼手」。



  《左撇子女孩》最特別的地方在於從5歲的宜靜出發，不僅是敘事的角度，就連不少運鏡

  都放低視角，從小孩的眼光看見這個複雜多變、五光十色的世界。電影的開場與結尾以萬

  花筒前後呼應，對宜靜來說，通化街夜市不只是媽媽工作、養活她們一家三口的場域，更

  是她探索台北這個新世界的入口。全片以iphone拍攝，導演曾說，手機能夠捕捉到傳統攝

  影機拍不出來的感動、角度與真實。畫面時而貼近主體、時而自然晃動，而從宜靜眼中看

  出去的夜市生活，更是從低視角來窺視，完全是長大後的我們無法看見的美麗視野。



  5歲，正是最喜歡參與大人的對話，問「什麼是什麼」與「為什麼」的年紀，尤其是對宜

  靜這樣懂事、超齡的小大人來說，她什麼都想知道一點，一切新奇、未知的事物就是宜靜

  最棒的遊樂場。雖說觀眾是從旁觀看的局外人，但充其量也只比宜靜「全知」那麼「一點

  點」。沒錯，我們知道那個「賺一毛錢」又「躺在醫院」的人是宜安的爸爸，但他為何欠

  債？讓一家人只得跑路到台東？宜安又為什麼高中沒畢業、沒讀大學？那宜靜的爸爸現在

  在哪裡？為何淑芬又得帶著兩個女兒回到台北來，辛苦於夜市擺攤過活？



  觀眾對這一個個問號其實都一無所知，只能跟著宜靜一起慢慢更了解自己的家庭、家人與

  身世。不過，即便有著這麼多的「不知道」，《左撇子女孩》也不會給觀眾一頭霧水的感

  覺，反而會回到最天真的童年，似懂非懂地聽著電影裡的「大人」對我們訴說這個故事。

  當我們覺得自己對這個家庭已經夠了解的時候，宜安在壽宴上大聲宣告自己才是宜靜的媽

  媽。故事聽到這邊，前述的問句也已全數解答，一場鬧劇落幕，在這三口之家彷彿什麼都

  沒有發生，但塵埃落定後，又好像有什麼悄悄地改變了。



  《左撇子女孩》用100分鐘多一點，講述台灣中產家庭「家」的樣貌。淑芬的父母住的是

  有電梯的華廈，媽媽偶爾可以跟女兒們來場貴婦下午茶，壽宴也能夠辦在稍微有點氣派的

  餐廳，但他們絕對稱不上什麼富貴人家，媽媽甚至荒謬地參與人蛇集團的計畫，為的就是

  多賺一點錢。壽宴上弟弟振興說媽媽是自己創業的大股東，聽在淑芬耳裡很不是滋味，但

  他並不像是不知感恩、占盡一切資源的男丁，反而是整個家唯一開口問淑芬過得如何的人

  。淑芬姊妹的女兒也不如想像中那麼完美，而是「自己的小孩怎麼看怎麼棒」而已。



  說到底，這個大家庭的問題不比淑芬一家三口遇到的困境糟。宜安看似對媽媽沒大沒小，

  但她每一句頂嘴與質問，其實都隱含著對媽媽的關愛與心疼。總是像刺蝟一般的宜安，受

  到委屈只會往心裡吞，她可能也不想再增添媽媽的煩惱。如果不是意外懷孕，「前三名的

  校園女神」不會沒讀大學，但是辛苦賺錢也沒有什麼不對，大學生沒有比較高尚，以為老

  闆單身才與之交往，結果懷上孩子才得知他有家室，只能自己在機車上與夜深人靜之時默

  默流淚。即使有這些不如意，宜安仍舊是宜靜最信任的「姊姊」，是當舖老闆聯絡家人時

  妹妹的選擇。得知宜靜的偷竊行為後，她也沒有打罵，而是陪著妹妹去面對自己的錯誤並

  誠心道歉。由於淑芬與宜安的呵護與愛，宜靜才能自由自在地長大。



  鄒時擎長年與奧斯卡導演Sean Baker合作，擔任他的製片，兩人並以《火紅大箭男》、《

  小明星》、《歡迎光臨奇幻城堡》與合導《外賣》等片聞名。雖然《左撇子女孩》是鄒時

  擎初執導筒的作品，但早在2001年，她就與Sean Baker一起撰寫本片劇本，只是一直到三

  年前才終於得以拍攝。Sean Baker除了擔任共同編劇之外，也是本片的剪輯師。他擅長描

  寫底層社會的生活，而兩人合作多年，拍攝電影的方向與眼光一致，觀看《左撇子女孩》

  時也能看見Sean Baker的影子。



  但是，導演仍然利用各種台灣元素拍出自己的味道，就像是訴說女人心事的《孤味》結合

  從小孩視角出發的《歡迎光臨奇幻城堡》，搭配上左撇子與夜市的元素，交織出這部好萊

  塢視角的台灣女性物語。就像《歡迎光臨奇幻城堡》，主角群的生活雖苦，但電影結尾給

  觀眾一股暖流，讓人知道他們都「好好的」。隔壁攤的強尼更是「台灣最美風景」的最佳

  代言人，適時伸出援手，又不給人過多的壓力，面對壽宴的尷尬，明明不是這個家庭的一

  份子，卻是唯一一個出聲抵禦外人的，最後一幕也顯示他早已成為淑芬一家三口的日常。



  電影以「左撇子」象徵需要顛覆的傳統，過去在台灣，左撇子是需要「矯正」的少數民族

  ，如同宜安所說，「都什麼時代了」，但就是會有老一輩如片中的外公會堅持要改，甚至

  灌輸「用左手就是在為魔鬼做事」的觀念。在宜靜用左手偷東西、「做很多壞事」之後，

  寵物狐獴的死讓她不得不正視自己的「魔鬼手」。就算非慣用手用得不順，丟球不進，就

  連端盤子都拿不穩，宜靜還是堅持把自己的左手包住，彷彿只要眼不見為淨，與眾不同就

  不是罪。



  片中也以過去（甚至現在）根深蒂固的重男輕女觀念來訴說女性的困境。淑芬的先生工廠

  經營不善時，娘家不願出手幫忙，但振興要開公司就可以成為最闊綽的投資人，甚至連祖

  厝都已過戶給兒子，還有女兒不知情。同樣是子女，出嫁後就是「別人的」，就像徐若瑄

  在《孤味》所唱的片尾曲一樣，道盡不甘與不捨。宜安並非故意破壞別人家庭，謊稱自己

  已經離婚的不是她，但一切的罵名卻得由宜安承受，也難怪大家會說「為難女人的總是女

  人」。



  《左撇子女孩》從導演小時候被要求改用右手的回憶出發，以自然真摯的台灣在地夜市人

  生為畫布，揮灑出充滿溫暖、深刻動人的家庭故事。片中演員也以精湛的演技帶領觀眾進

  入淑芬一家三口，跨越兩代或三代的奔波、掙扎與成長，是今年必看的台灣電影。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
