title: '[新聞] 左撇子女孩_馬士媛_獲獎'
content: '資料轉至「光年映畫」粉專


  新聞網址：


  --

  《左撇子女孩》影展天大好消息速報


  在電影中飾演叛逆姊姊「宜安」的新生代女主角馬士媛，

  憑藉充滿爆發力與層次的精湛演出，榮獲殊榮！


  這不僅是對馬士媛演藝生涯的極大肯定，更是台灣演員首

  次摘下此影展影后桂冠，為台灣電影歷史寫下嶄新的一頁。


  在此之前，獲此殊榮的華語女星已是30年前、1994年《重慶

  森林》的王菲。對於這份驚喜的榮耀，馬士媛表示：「特別

  感謝斯德哥爾摩電影節的評審給予這份如此令人驚喜的肯定

  ！能夠獲得這個獎項對我意義重大，真的非常榮幸。也很開

  心這部電影能夠去到斯德哥爾摩，讓大家看到台灣的美。」



  --








  --'
