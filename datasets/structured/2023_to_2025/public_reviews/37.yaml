url: https://www.ptt.cc/bbs/movie/M.1764958983.A.99F.html
title: '[新聞] 《左撇子女孩》殺進「廣播影評人協會獎'
content: '恭喜左撇子女孩入圍兩大北美電影獎的最佳外語片：NBR Awards 和 Critic''s Coice Award

  s


  兩個好歹都算是指標性電影獎項，能入圍 (尤其後者) 真的蠻替團隊和台灣高興！代表影片

  能見度和討論度真的不低，預祝接下來各大獎項都能再有斬獲～


  這篇新聞只有報上週的NBR獎(國家評論協會獎)；Critic''s Choice Awards (廣播影評人協

  會獎／評論家選擇獎) 是剛剛公布的而已，再次恭喜～


  新聞網址：


