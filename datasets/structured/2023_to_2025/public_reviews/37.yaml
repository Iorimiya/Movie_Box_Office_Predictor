url: https://www.ptt.cc/bbs/movie/M.1764482774.A.D74.html
title: '[好雷] 《左撇子女孩》- 台灣國片新活力 '
content: '已上映一段時間

  好評不斷

  金馬新演員 馬士媛 確實表現亮眼

  其他演員表現也不錯




  以下是一些個人的觀點




  雷文防雷資訊頁






  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  不得不說看完《左撇子女孩》感受到台灣國片注入新的活力。



  看到過往國片描述窮人總是不脫苦情、沉悶。《左撇子女孩》堪稱西恩貝克台灣版，一樣

  描述著像《歡迎光臨奇幻城堡》、《艾諾拉》等等底層、討生活的人們階級寓言的，同樣

  有著導演在道德、情境上展現某種憐憫或相互取暖的「天真」與浪漫，但《左撇子女孩》

  卻意外與台式八點檔，在貧富、男女的階級拉鋸鬥陣之中的灑狗血、情緒勒索中呼喚出台

  灣人良善堪稱真正的「感動」──「人的風景」帶有的鄉愿與我所認知與經驗著台灣民族

  性的終局，原來沒有太多個性、原則的台灣人是如此的自由自在。



  於是那聯想到Dogme 95的《那一個晚上》電影最後段老媽生日宴會場，總是刻意激化的貧

  富差距與重男輕女等很熟悉的台灣刻板印象中，在那台灣人十分熟悉尷尬、無言以對的家

  庭場景，就像是每逢過年被問到結婚或生小孩這類的長輩問題諸如此類。也許是《左撇子

  女孩》美國個性劇本的注入與電影即興的演員調度，使得面子問題，在此「轉譯」的詮釋

  上從容且輕盈地化解，也讓此本是台灣家庭場面與八點檔戲劇中往往是傷口上撒鹽的困頓

  、激情段落。頓時還帶著一點點無所謂的可笑、幽默。



  原來這種台灣人保守觀念內核被挖掘出的淺淺微笑，可以是屬於世界性的。



  --


  拉特飯 - 以商業力量進入獨立市場


  --'
