title: '[好雷]《左撇子女孩》好雷：解構所謂的「家」'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《左撇子女孩》好雷：解構所謂的「家」\n\
  \n《左撇子女孩》的亮點，除了把夜市場景拍得鮮豔動人，更忠實呈現世代間的互不理解，\n沒有俗濫的圓滿大和解。\n.\n媽媽淑芬肩負獨自養家的壓力，順應「嫁雞隨雞、嫁狗隨狗」的傳統概念。\n\
  \n先是符合傳統，全心全力協助丈夫還債。亡夫死了，向家裡借錢週轉，又反過來罵她傻。\n之後跟強尼的感情，也只得到父母的打量和鄙視。\n\n淑芬一邊努力做好妻子的義務，一邊在這樣的壓迫下，保護兩個女兒。\n\
  \n所謂的家人之愛，真的無私嗎？還是得先活成父母的期待，才能得到相應回饋？（畢竟他\n們的概念不是都不幫，而是把資源都留給偏愛的兒子。）\n.\n宜安正在追求自立、證明自己的年紀，她的命運受到家裡欠債的影響，只能放棄繼續升學\n\
  ，這也讓母女之間十分緊張。\n\n她在手邊擁有的機會和知識下做選擇，從事檳榔西施的工作，後來被渣男老闆所騙，意外\n成為第三者。\n\n所有的罵聲都被指向了宜安，還因此丟了工作、在親人面前難堪，獨自面對懷孕和流產的\n\
  痛苦。\n\n一路上她與眾人的有色眼光對抗，卻十分無力。在舖好的人生軌跡上，她的叛逆最強烈，\n受到的反噬也最多。\n.\n宜靜是一張探索世界的白紙，好奇的在夜市大冒險、不停問為什麼。\n\
  \n本來以為家人什麼不說，是保護宜靜，其實更像把她推向「無知」地帶。\n\n宜靜只能獨自的與「左手魔鬼論」自處，接收大人的價值觀、暗暗自責。\n\n當每個人都有自己的問題，孩子的世界被忽視，任憑虛擬的「惡魔之手」擺佈。但單純的\n\
  她也懂事的幫忙家裡的生意、相辦法幫母親還債，寫出了人生純真懵懂的微妙時期。\n\n\n\n.\n同在一個屋簷下的三位女主角，看起來互相支持照顧，其實大多都在獨自面對問題。\n\
  \n《左撇子女孩》氛圍溫暖、節奏歡快，時而幽默點綴，卻一針見血的點出：家人之間未必\n懂得。只有遭遇重大變故，這些困難才能把家人聚在一起。\n\n家人比想像中現實。\n\
  .\n\n\n______\n\n看《左撇子女孩》前半部分的時候，心中懸著一個問題：每個畫面拍得處處明亮，到底要\n怎麼呈現陰暗、怎麼表達那些灰色地帶？\n\n\
  後來發現完全是多想了，《左撇子》中呈現的衝突是化為言語的、直接的，每個台灣人都\n能共感。\n\n彼此的觀念涇渭分明。這家人不是不說，而是說了也無法理解。\n\
  .\n家人朝夕相處所以連結很深，也因此沒有任何緩衝空間，所有相異之處都接受最直接的磨\n合。\n\n生日宴上發生的衝突，將一切和平幻相戳破。即便挺過這次難關，家人的認知差異仍無法\n\
  改變（鄭家展現的核心衝突是性別與婚戀觀念）。經濟和關係危機短暫和緩，生活依然艱\n苦。\n\n這才是所謂「家人的牽絆」，不是只有愛，而是所有的觀念差異、包容或堅持，以及造成\n\
  的所有後果，纏繞包裹成稱之為「家」的地方。\n.\n左撇子女孩，今後會繼續用左手，還是改用右手畫畫呢？\n\n\n\n\n>>網頁好讀版：\n\n>>短篇推薦文：\n\
  \nEm\n–\n脆：\nIG：Fishpond_like \n臉書：魚池 FishPond \n個人網站：\n\n--\n謝謝你\n補充：\n宜靜用「惡魔之手」偷小東西，一邊說是魔鬼手做的一邊又隱隱內疚，暗指我們在傳統觀\n\
  念影響下，向下繼續形成壓迫，並在心中形成「愧疚」和「歸咎給傳統壓力」兩種聲音的\n對抗。\n\n這種小奸小惡，就是傳統觀念如何滲透我們的方式。阿嬤一句、阿公一句日常對話，看似\n\
  沒什麼大不了，長期下來造成價值觀的嚴重影響。\n\n就像宜靜開始偷小東西，店家也覺得無傷大雅，但不制止的話，也可能釀成災禍。\n.\n宜安告訴宜靜沒有「魔鬼手」，是導演在告訴大家你是自由的，你可以有機會打破這個循\n\
  環。有了覺知之後，就無法用傳統壓力論來開脫。（以 5 歲孩子來說，也是因為他可塑\n性大，現實上比較有機會，更多人抗爭的結果是在腦中傳統和進步打架）\n\n以這樣的姿態去面對傳統文化的壓迫，雖然不輕鬆，但心更趨向自由。\n\
  謝謝～\n謝謝補充"
