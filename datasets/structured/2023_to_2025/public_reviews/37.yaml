url: https://www.ptt.cc/bbs/movie/M.1744773588.A.DDA.html
title: '[新聞] 《左撇子女孩》入選坎城影展「影評人週」'
content: '《左撇子女孩》入選坎城影展「影評人週」正式競賽　導演鄒時擎將帶劇組走紅毯


  臺北市電影委員會「國際影視攝製投資計畫」投資電影《左撇子女孩》（Left-Handed

  Girl），正式入選第 64 屆法國坎城影展「影評人週」（La Semaine de la Critique）

  競賽單元，成為本屆極少數獲選的亞洲電影之一！


  《左撇子女孩》由、左撇子女孩電影製作有限公司出品。此片集結等多位演員參與演出。


  鄒時擎過去與美國導演尚恩・貝克（Sean Baker)合作無間，他們第一部合編合導的《外

  賣》（Take Out）、以及她參與製作的《夜晚還年輕》（Tangerine）、《歡迎光臨奇幻

  城堡》（The Florida Project）與《紅火箭》（Red Rocket）等備受矚目的作品。《左

  撇子女孩》則是她睽違多年後，以個人視角完整掌舵的首部長片，結合多年電影創作經驗

  與獨特女性觀點，在來自全球的作品中脫穎而出，獲歐洲選片委員高度肯定。


  由法國影評人協會主辦的「影評人週」，素以發掘新銳作者聞名，歷年來推出無數影壇新

  聲，每年僅選出七部長片入圍。首次擔任導演即獲得坎城影展影評人週正式競賽單元入圍

  ，導演鄒時擎表示：「《左撇子女孩》入選坎城影展國際影評人週單元，對我來說，是一

  段多年努力終於綻放的時刻。內心充滿感激與喜悅。謝謝每一位在這條路上同行的夥伴，

  無論是幕前幕後的劇組、演員，或是在我低潮時給予支持與鼓勵的朋友們，這份榮耀屬於

  所有人。」


  《左撇子女孩》故事聚焦台北夜市裡一個單親家庭，細膩描繪女孩在傳統家庭束縛與個人

  意識覺醒之間的掙扎。電影以極簡而充滿情感張力的影像語言，深刻呈現世代間無聲的衝

  突與壓抑，勾勒出女性如何在沉默中承受、對抗與傳承。影片探索情感與身份的隱性對話

  ，在亞洲文化脈絡中引發強烈共鳴。《左撇子女孩》將於5月在坎城影展世界首映，導演

  鄒時擎與主要劇組人員預計親赴現場出席紅毯與首映活動，代表台灣電影亮相國際。

  ============================================================================


  台灣參與電影  已連續第三年 都有作品入選 坎城影展 影評人週 競賽單元


  2023 《虎紋少女》         首獎Grand Prix最佳影片

  2024 《蟲》《藍色太陽宮》




