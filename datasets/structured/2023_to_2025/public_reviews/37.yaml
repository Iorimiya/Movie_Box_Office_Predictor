url: https://www.ptt.cc/bbs/movie/M.1756358546.A.C90.html
title: '[情報] 2026 台灣奧斯卡代表：《左撇子女孩》'
content: "《左撇子女孩》獲選代表臺灣 角逐2026年美國第98屆奧斯卡金像獎最佳國際影片\n\n\n文化部今（28）日發布新聞稿表示，經文化部影視及流行音樂產業局召開2026年美國第98屆奧斯卡金像獎最佳國際影片參賽甄選會議，決議通過推薦由導演鄒時擎執導的《左撇子女孩》代表我國參賽。\n\
  \n\n 文化部表示，影視局受中華民國電影戲劇協會委託辦理，今年報名奧斯卡金像獎參賽甄選的國片共計11部，經甄選委員會議熱烈討論後，多數決投票通過由《左撇子女孩》代表臺灣參賽，推薦理由為「以極具臺灣在地特色的夜市為背景，透過左撇子女孩的視角，呈現成長過程與傳統父權社會產生碰撞的議題，節奏輕快，美學風格具當代性。」\n\
  \n《左撇子女孩》是以臺北喧騰的夜市為背景，細膩描繪一段跨越三代母女的動人篇章。故事講述一位單親母親帶著兩個女兒遷居臺北，在夜市擺攤謀生，面對陌生的城市與新生活的挑戰，母女三人在適應的過程中，既掙扎於現實壓力，也在彼此的依靠與牽絆中尋找家的歸屬感。影片以獨特的視角捕捉臺灣夜市文化的生命力，透過充滿感官張力的影像語言，探索女孩在傳統家庭束縛與自我意識覺醒之間的拉扯，不僅是一部關於家庭與成長的作品，更是一場關於情感、身份與自我認同的深刻對話。\n\
  \n\n《左撇子女孩》參加法國坎城影展「影評人週」競賽單元獲「甘氏基金會獎」與「金鐵道獎」，接續也獲多倫多國際影展、美國紐約影展邀請參展，並入圍釜山國際影展主競賽單元，持續累積國際聲量，讓世界各地觀眾有機會走進戲院，與影片產生深刻共鳴。\n\
  \n《左撇子女孩》預計於2025年9月17日起在法國多個城市率先展開商業映演，國內也預計於10月31日全臺上映，11月起將陸續於美國、加拿大、英國上映，並將於11月28日全球登陸Netflix，與更多國際觀眾相見。此次代表我國爭取奧斯卡最佳國際影片入選門票，盼能從各國強片中脫穎而出，為國爭光。\n\
  \n\n文化部表示，臺灣文化兼具多元性、自由性與創造力，這些特質是激發與孕育臺灣電影重要養分。因應國際發展趨勢，文化部持續以全方位視野推動政策、補助與投資策略，並規劃影視產業走向國際，強化產業國際市場競爭力，創造臺流及產業獲利模式，同時打造國際規格影視內容，帶動影視人才技術及製作規模提升，讓更多影人及影片在國際上發光發熱。\n\
  \n\n甄選委員小組名單（按姓名筆劃依序排列）：\n李耀華、陳湘琪、陳潔瑤、趙德胤、黃美清、黃建業、閻鴻亞\n\n\n\n\n\n--"
