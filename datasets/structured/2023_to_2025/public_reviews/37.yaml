url: https://www.ptt.cc/bbs/movie/M.1761546647.A.FF1.html
title: '[新聞] 《左撇子女孩》奪羅馬影展最佳影片大獎'
content: "《左撇子女孩》奪羅馬影展最佳影片大獎\n大紀元 2025年10月26日\n\n\n《左撇子女孩》導演鄒時擎。資料照。（Gareth Cattermole/Getty\
  \ Images）\n\n【記者鍾雅／綜合報導】臺灣電影《左撇子女孩》（Left-Handed Girl）打敗眾多競爭者\n，奪下本屆羅馬影展（Festa del\
  \ cinema di Roma）「最佳影片」大獎，導演鄒時擎、童\n星葉子綺以錄影方式在大會發表感言，感謝獲得此項殊榮肯定。\n\n《左撇子女孩》是由旅美臺灣導演鄒時擎執導，與西恩貝克（Sean\
  \ Baker）合作編劇，蔡\n淑臻、黃鐙輝、馬士媛、葉子綺等人主演。鄒時擎自幼在臺灣長大，直到輔仁大學畢業後\n才前往美國深造。劇情講述一名單親母親帶著2個女兒遷居臺北，在夜市擺攤維生的故事\n\
  ，透過左撇子小女孩宜靜的雙眼看世界。\n\n據中央社報導，頒獎典禮上，羅馬影展評審團主席寶拉寇提莉絲（Paola Cortellesi）親\n自宣布，最佳影片由《左撇子女孩》奪得，該片在義大利文的翻譯名稱為La\
  \ mia\nfamiglia a Taipei（我在臺北的家庭）。\n\n導演鄒時擎以錄影方式致詞，她表示非常榮幸獲得羅馬影展首獎，感謝評審團的肯定，這\n\
  部電影源於一個很個人的故事，她花了20年才把故事搬上大銀幕，能在羅馬這個歌詠人文\n價值的城市獲獎，對她意義深刻；她也特別感謝臺灣合作團隊及國際製作夥伴，對這個故\n\
  事一直深具信心。\n\n主演之一的葉子綺在錄影致詞中表示，她很高興《左撇子女孩》能在羅馬影展奪得最佳影\n片，她希望大家和她一樣熱愛這部電影，她聽說該片今年12月會在羅馬上映，希望大家能\n\
  帶著所有的親朋好友一起到電影院觀賞。\n\n\n《左撇子女孩》首次在台灣舉行媒體試片會資料照。演員張允曦（左起）、夏騰宏、葉子\n綺、馬士媛、黃鐙輝和導演鄒時擎一同亮相。（光年映畫提供）\n\
  \n義大利電視、平面媒體皆以快訊大幅報導《左撇子女孩》奪得本屆羅馬影展最佳影片，義\n大利《晚郵報》（Corriere della Sera）更直接以「羅馬影展、臺灣獲勝」為標題報導\n\
  。《左撇子女孩》將代表臺灣角逐2026奧斯卡金像獎。◇\n\n新聞網址：\n\n\n--\n\n                  \n\n\n\n--"
