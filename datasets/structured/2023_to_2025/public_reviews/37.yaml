title: '[討論] 左撇子女孩'
content: "編導鄒時擎想要表現女性遭受傳統觀念束縛的反應，但我感覺\n\n  她是不是在美國待太久，對台灣的印象停留在四、五十年前。\n\n  關於外公訓斥小女孩宜靜的左撇子，還有大女兒與小女兒的真\n\
  \n  實親屬關係，這些現象若發生在1980年代甚至更早的台灣社會，\n\n  還蠻合理，但是電影裡的場景和服裝沒錯的話是21世紀的現代，\n\n  這就讓人覺得違和了。鄒融合自身童年回憶、親友經歷而發想\n\
  \n  出這部電影，但卻不肯處理年代錯置的問題。Sean Baker是西\n\n  方人自然不了解，他們和觀眾是不是還以為劇中探討那些女性\n\n  受到的壓抑仍然普遍存在現在台灣社會呢？\n\
  \n  還有，左撇子小孩會被長輩矯正，根本無關性別好嗎？\n\n--"
