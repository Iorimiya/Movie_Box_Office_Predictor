url: https://www.ptt.cc/bbs/movie/M.1747184455.A.5F7.html
title: '[新聞] 左撇子女孩前進坎城 導演：國片情感內斂'
content: '左撇子女孩前進坎城 導演：國片情感內斂打動歐洲觀眾



  2025/5/14 03:53（5/14 06:58 更新）


  （中央社洛杉磯13日綜合外電報導）台灣導演鄒時擎首部獨立執導長片「左撇子女孩」入

  選坎城影展「影評人週」單元。她表示，拍攝過程是一段情感濃烈的旅程，也說台灣電影

  敘事講求情感內斂，恰好打動歐洲觀眾。


  這部片由鄒時擎與奧斯卡導演西恩貝克（Sean Baker）共同編劇，並由臺灣、法國、美國

  與英國共製。


  「左撇子女孩」故事聚焦台北夜市的單親家庭，描繪女孩在傳統家庭束縛與個人意識覺醒

  之間的掙扎，影片探索情感與身分的隱性對話，在亞洲文化脈絡中引發強烈共鳴。


  美國娛樂媒體「綜藝」（Variety）報導，鄒時擎在台北出生長大，之後前往紐約新學院

  （New School）攻讀媒體研究碩士，她在那裡結識了西恩貝克，兩人自此展開長期合作關

  係。西恩貝克今年3月剛以長片「艾諾拉」（Anora）奪下4座奧斯卡獎。


  鄒時擎在2004年與西恩貝克共同執導他的作品「外賣」（Take Out），並擔任西恩貝克的

  「夜晚還年輕」（Tangerine）、「歡迎光臨奇幻城堡」（The Florida Project）與「火

  紅大箭男」（Red Rocket）的製片。


  鄒時擎形容說，拍攝她自己的首部長片是一段情感濃烈、極為私密的旅程，而這一切始於

  一段記憶。


  她說：「我爺爺曾告訴我，左撇子是『惡魔之手』。這句話對我影響深遠，特別是在傳統

  台灣家庭中成長的背景下。我內心的衝突持續了好幾年，最終成為了這個故事的核心。」


  她說：「製作這部電影耗時超過20年，這段過程充滿耐心與堅持，也讓我堅信悄無聲息的

  故事同樣值得躍上大銀幕。我也身兼多職，擔任編劇、導演、製片，重點是要保護這個願

  景的完整性，並組建一支與我一樣深信這部電影的團隊。」


  與其他人密切合作超過20年後，獨立執導對鄒時擎來說是需要調整的過程。


  鄒時擎說道：「我習慣參與每一個環節，從場勘、選角、服裝到後製都是。對我來說，合

  作不只是共享成果，更是一種相互信任。在這部片中，我在台北有一支很棒的在地團隊，

  我與每個部門都保持密切聯繫，確保整部片的節奏與調性一致。」


  鄒時擎與英國和法國的製片合作，「左撇子的女孩」也獲得台灣文化部電影基金以及台北

  市電影委員會「國際影視攝製投資計畫」的支持。


  她表示：「這個模式讓不僅讓電影能保有道地的台灣特色，同時也從國際合作中受益。當

  創作理念與文化價值一致時，共同製作能讓作品觸及更廣，也更容易引起共鳴。」


  鄒時擎表示：「台灣電影敘事講求情感內斂，這點恰好打動歐洲觀眾。這不是一部喧鬧的

  電影，而是耐心、細膩、極富觀察力的作品。像楊德昌和侯孝賢這樣的導演，讓我們看到

  靜謐時刻蘊含的力量，而那樣的影響力至今仍存在。我想歐洲觀眾欣賞這類情感慢慢堆疊

  且深入人心的電影。」（譯者：陳昱婷/核稿：洪啓原）1140514



  新聞網址：



  --'
