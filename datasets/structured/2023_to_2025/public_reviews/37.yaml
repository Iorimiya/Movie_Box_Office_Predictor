title: '[  雷] 左撇子女孩'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  要不是打著西恩貝克的招牌，這片我可能不會進電影院看。


  期望有點太高，雖然不至於睡著但是也是很想看手錶


  首先本片畫質不是很好。一開始以為是故意的後製效果，後來想到西恩貝克也拍過很多低

  成

  本片，《夜晚還年輕》甚至用iPhone拍完。

  所以真的可能就只是用低價的攝影機拍的。。。


  這電影劇情放到現代看真是有夠突兀，如果是導演本人自己的成長經歷就算了，現在是20

  25

  年欸，片中都在使用智慧手機了，至少也是近10年的社會吧

  主創要跟我說「重男輕女」我還真的是無感


  直到慶生宴第一場大鬧我才知道這片原來要講的主題，就是生女的都是賤，生男的才屌

  就是這麼簡單的主題


  本片也不是完全沒優點，至少李安在拍少年pi的時候講過，拍小孩難，拍動物也難

  《左撇子女孩》至少也拍了這兩個難點，話說那隻狐獴還真可愛，真配合拍戲


  片尾roll card的時候又再次嚇到我，不是說好告五人的主題曲嗎？ 怎麼是夜市收音

  不會二刷了，就當作買海報送電影吧


  --'
