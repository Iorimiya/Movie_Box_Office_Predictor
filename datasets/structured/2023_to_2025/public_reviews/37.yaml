content: '新聞網址：



  《左撇子女孩》國際好消息一波接一波


  片中最萌的存在、年僅9歲的台灣新銳演員，

  今年已獲得金鐘獎提名外，也入圍本屆，更於美國時間11月15日在洛杉磯獲得。


  。在片中自然真摯的演技

  ，成功征服了國際評審，也真摯表示：「我

  會慢慢長大，繼續當一個快樂的演員。特別感謝 Netflix，

  以及所有幫助過我的人，謝謝大家。」


  興奮的在領獎後開心分享：「才剛許願想要

  去好萊塢，沒想到現在人就已經到好萊塢了！」她

  雀躍地描述這次的洛杉磯之旅，除了出席盛會，還

  趁空檔吃了心心念念的速食店、到星光大道走一走

  ，甚至規劃去迪士尼樂園玩。她感性地說：「我覺

  得我是世界上最幸福的小孩，謝謝宜靜讓我找回我

  的左手，還實現了我的夢想，我真的太開心了。」


  --

  這部電影代表台灣角逐2026年第98屆奧斯卡金像獎最佳國際影片，

  希望能繼續獲獎，最後的衝刺，加油啊:)


  --








  --'
