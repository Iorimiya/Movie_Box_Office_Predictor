url: https://www.ptt.cc/bbs/movie/M.1748054363.A.793.html
title: '[新聞] 《左撇子女孩》坎城獲獎 導演：讓台灣被世'
content: "《左撇子女孩》坎城獲獎 導演：讓台灣被世界看見\n\n\n【大紀元2025年05月22日訊】（大紀元記者馬維芬報導）台法合製片《左撇子女孩》入選\n\
  影評人週競賽，賽果於坎城時間21日晚間揭曉，《左》片獲得「甘氏基金會獎」與會外獎\n「金鐵道獎」。導演鄒時擎開心上台領獎，最後向台灣致謝時，還一度哽咽。\n\n\
  導演鄒時擎在坎城影展期間，為了《左撇子女孩》馬不停蹄出席多場活動。\n\n上台領獎時，她先用中文表示要先用中文致詞，隨即再以英文表示大會的翻譯人員很厲害\n，中文也許也難不倒翻譯，以幽默一下緩解得獎的緊張，引起現場觀眾笑聲。主演該片的\n\
  新銳演員馬士媛也在台下大喊「we love you」支持回應導演。\n\n外型看起來酷酷的鄒時擎，提到感謝台灣各單位的支持時，終於忍不住在台上哽咽。會後\n，她也補充表示得不得獎是其次，重要是讓台灣電影被全世界看見。\n\
  \n\n電影《左撇子女孩》於5月21日在坎城獲得雙獎。圖為導演鄒時擎領獎致謝。\n（左撇子女孩電影製作有限公司提供）\n\n她說：「能入選坎城影評人週就是莫大的榮幸，很高興與台灣的劇組一起慶祝，一起共襄\n\
  盛舉，讓台灣電影被全世界看見，讓台灣被全世界看見。」\n\n一同出席頒獎現場的演員包括馬士媛、「小8」張允曦、夏騰宏、林嫣等人。他們在會後\n知道電影除了在影評人週競賽得獎外，也獲得會外賽「金鐵道獎」。小8知道得獎時還要\n\
  先手機查看給獎精神，當知道這個獎是由觀眾投票選出時，開心表示，讓坎城觀眾「除了\n喜歡，還看得懂，是非常驕傲的事」。\n\n林嫣與夏騰宏也認為觀眾用票選表達直接反應，非常感謝支持，馬士媛亦開心表示：「如\n\
  果有觸動到觀眾每一份心的話，那就夠了，這是我們覺得最值得的一件事。」\n\n\n電影《左撇子女孩》於5月21日在坎城獲得雙獎。圖為《左撇子女孩》劇組典禮後自拍。\n\
  （左撇子女孩電影製作有限公司提供）\n\n雖然因為工作已經返台工作的蔡淑臻、黃鐙輝不在現場，但一獲知《左撇子女孩》在坎城\n獲獎消息，仍開心共享喜悅。黃鐙輝感性地表示：「《左撇子女孩》是一道堅貞不屈的火\n\
  炬，很榮幸能成為左撇子女孩的火種！」\n\n身為主演之一的蔡淑臻趁機謝謝導演，她說：「感謝導演和整個團隊的信任，將這個重要\n的角色交給我。」而她也感謝觀眾與評審們的認同，讓她在片中三母女的故事更有力量。\n\
  \n該片一次抱回雙獎，也讓電影備受關注，目前台灣有片商積極與法國代理商接洽發行事宜\n，導演鄒時擎期待電影能在今年年底與觀眾見面。\n\n責任編輯：蘇漾\n\n\
  \n\n--\n                 \n   \n\n\n\n--"
