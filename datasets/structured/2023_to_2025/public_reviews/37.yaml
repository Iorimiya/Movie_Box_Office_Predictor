title: '[普偏好雷] 左撇子女孩Left-Handed Girl'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  怕被爆雷而第一天就去看了。

  看完確實覺得很需要在不被爆雷的狀況下看，但心情偏複雜。電影的節奏感很妙，三位女

  性為主的呈現，可以說與過往許多台灣電影進行了大量對話。對各種台灣元素的運用，應

  算上接地且有梗。比較可惜的大概是最後大轉折的部分，同許多人一樣想到了《血觀音》

  ，忽然完全被推到情節之外，到結局的時候，對於整部片沒辦法有一個很正面的評價。


  想了幾天，覺得還是很愛馬士媛的演出。特別是看到結局之後回想，她在看妹妹時的眼光

  、所說的話語、接送上下課的樣子以及「教小孩」那段，都給人一種「其實她是想當媽媽

  的」。或者該說原本她不想且不去想，只是有時候又忍不住，但當她第二次懷了又流掉後

  ，感覺到生命的重要，接著又遇上妹妹「左手事件」，而產生了不一樣的想法。至少這條

  線有說服我，讓我沉澱數日之後仍覺得算是喜歡。




  ***


  這裡是我的樂園:




  --'
