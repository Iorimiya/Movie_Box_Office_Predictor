title: '[新聞] 《左撇子女孩》入選影評人週單元　文策院'
content: '新聞網址：


  《左撇子女孩》入選影評人週單元　


  法國坎城影展（Festival de Cannes）及產業盛會坎城電影市場展（Marché du Film）

  將於13日開展，


  《左撇子女孩》由蔡淑臻、黃鐙輝、馬士媛和葉子綺等主演，刻畫一位單親媽媽和兩個女

  兒從鄉下返回台北夜市的生活，呈現父權社會不同角色的掙扎與日常樣貌。




  為協助台灣影視專業人才走向國際，文策院於坎城電影市場展現場設立實體臺灣館，支持

  本地業者進行各項商務拓展活動，期待藉由深化與國際產業連結。


  文策院董事長蔡嘉駿表示，法國坎城影展與電影市場展是難能可貴的國際舞台，透過台灣

  館和入選作品的亮相與世界首映，能實際帶領影視專業人才深入國際產業、連結國際市場

  。在今年3月法國里爾劇集展現場，文策院也與指標性大型製作公司Federation Studios

  簽署合作備忘錄，將透過雙方共同支持歐亞影音合製內容、強化國際間的創意產業鏈結並

  培育專業人才。


  除此之外，，將全球重要影人齊聚一堂，見證台灣影

  視在國際舞台的亮眼佳績。


  ------


  GOOGLE沒有很難


  --'
