title: '[新聞] 2025高雄電影節10日開跑 《左撇子女孩》揭'
content: "2025高雄電影節10日開跑 《左撇子女孩》揭幕登場\n\n\n2025高雄電影節，獲選為今年開幕片之一的電影《左撇子女孩》由導演鄒時擎（左2）領\n\
  軍，率演員夏騰宏（左）、馬士媛（右）、葉子綺（右2）出席，分享拍攝點滴。（高雄\n電影節提供／中央社）\n\n【大紀元2025年10月10日訊】（大紀元記者馬維芬報導）2025高雄電影節於10日開跑，《\n\
  左撇子女孩》為開幕片之一，由導演鄒時擎帶領主演們出席。該片入圍本屆金馬獎，並代\n表台灣角逐奧斯卡最佳國際影片。而該片監製西恩‧貝克，對該片深具信心。\n\n\
  《左撇子女孩》由台灣導演鄒時擎執導，奧斯卡最佳導演西恩‧貝克（Sean Baker）擔任\n製片人、共同編劇及剪接。該片歷經闖蕩坎城、多倫多、釜山等多個國際影展之後，也將\n\
  代表台灣角逐奧斯卡獎最佳國際影片。\n\n而今日《左撇子女孩》回到高雄舉辦首映，這對於電影整個劇組而言別具意義。鄒時擎說\n：「這是我們第一次在台灣大銀幕正式與觀眾見面。因為電影講的是台灣的故事、台灣的\n\
  夜市、台灣的情感，所以特別期待家鄉的反應。」\n\n談及入圍金馬獎9項大獎，鄒時擎則認為有信心獲得最佳影片，「獲得這個獎，代表是全\n體劇組得到了肯定」。\n\n\
  至於本屆奧斯卡的角逐，鄒時勤則表示：「非常幸運能前往奧斯卡比賽。並非每部片子都\n有機會走到這個地方，能有這個經驗也就已經很開心、很滿足了。」不過，她也透露西恩\n\
  ‧貝克覺得一定會進奧斯卡電影的入圍五強名單，「他還滿有信心的」。\n\n責任編輯：辛幼安\n\n\n\n--\n\n                  \n\n\
