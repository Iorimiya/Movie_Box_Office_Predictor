url: https://www.ptt.cc/bbs/movie/M.1763417934.A.775.html
title: '[新聞] 法影后伊莎貝雨蓓訪台　讚「左撇子女孩」'
content: '新聞網址：



  法影后伊莎貝雨蓓訪台　讚「左撇子女孩」今年最好看


  2025/11/17 18:52


  （中央社記者王心妤台北17日電）


  法國影后伊莎貝雨蓓（Isabelle Huppert）來台參與金馬影展，她表示，今年最喜歡的電

  影是台灣電影「左撇子女孩」。得知電影主場景臨江街夜市在訪問地附近，她馬上直呼想

  去。


  伊莎貝雨蓓此次參與「女富豪的美麗與哀愁」（The Richest Woman in the World）金馬

  影展映後活動，活動後接受台灣媒體訪問，她透露，平時私下也喜歡看電影，今年最喜歡

  的電影就是「左撇子女孩」。而該片在台北臨江街夜市取景拍攝，她直呼，「像那個夜市

  ，我今天就想去。」


  伊莎貝雨蓓近日在台中演出舞台劇，她回憶15年前來台灣時，曾跟導演侯孝賢一起去KTV

  唱歌，「我不記得唱什麼歌了，但侯孝賢用中文、台語唱，我用法文唱，讓我非常難忘。

  」


  伊莎貝雨蓓至今演出超過百部電影，也被凱薩獎提名16次，是此獎紀錄保持人，並兩度獲

  頒威尼斯影展最佳女主角、坎城影展最佳女主角。


  伊莎貝雨蓓表示，演出50多年能維持熱情，是因為能跟一群很棒的導演工作，「他們都非

  常棒，讓我能進入非常特別的世界裡，以電影而言，我跟導演之間很信任，我很喜歡這件

  事。」


  對於「女富豪的美麗與哀愁」，伊莎貝雨蓓認為，電影呈現人性複雜面，「一部電影如何

  呈現就是靠對話，這部片對話寫得非常棒，不單只是有趣，也有很強的豐富性，讓演員能

  進入角色裡。」（編輯：張雅淨）





  ======


  幸運搶到女富豪影人場的金馬票，膜拜女神！

  尤其QA最後時，她特別提起在巴黎看到今年最喜歡的片是Shih-Ching執導的《Left-Hande

  d Girl》！

  翻譯女士一時不知對應的中文片名？

  台下觀眾立刻異口同聲支援—「左撇子女孩」～

  雨蓓後面又追加稱讚，當下大家整個大歡呼！！！

  氣氛超可愛，好開心蓓神也有看到新一代的台灣電影



  --'
