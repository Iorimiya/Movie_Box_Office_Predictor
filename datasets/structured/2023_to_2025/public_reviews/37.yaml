url: https://www.ptt.cc/bbs/movie/M.1763018828.A.2CF.html
title: '[好雷] 左撇子女孩'
content: '我家一堆11月天蠍座生日

  吃完了海底撈跟麥當勞

  就陪她們去看這部申奧片

  我姊看完很喜歡左撇子

  因為她跟我都是國片影展咖


  但她不喜歡女孩，覺得很燜

  可能希恩貝克比侯導商業點

  但女孩能在中國上映

  左撇子就不知道行不行

  畢竟舒淇比蔡淑臻知名度高點

  找西恩貝克為了拿奧斯卡

  他願意來台用手機拍國片

  就為了能賣到中國發大財

  才能拍他的好萊塢大爽片


  我阿姨看完沒法接受劇情

  所以覺得不好看

  她應該跟我太太一樣

  愛看好萊塢大爽片終極戰士

  聽說終極戰士是中國票房冠軍


  我說片尾都有擺壽宴

  還有壽桃推出來唱生日歌

  也算是適合帶壽星看的片

  降就不會感覺過的很寒酸

  相比之下 (哈...)




  雷




  媽媽帶兩個女兒

  從台東離婚回台北賣麵

  在臨江街夜市租了個攤位

  他們租房子住，沒回娘家住

  大女兒在附近當檳榔西施

  跟檳榔攤老闆是情侶


  媽媽有兩個妹妹一個弟弟

  弟弟是獨子跟長子

  所以繼承娘家爸媽的房子

  演她妹妹的小8就很不爽

  因為娘家答應房子分三份

  而嫁出去的蔡淑臻沒份


  蔡的老公是大反派江國賓

  說是工廠倒閉家道中落

  所以才離婚回台北


  聽說工廠老闆老婆都很多

  就像吊車大王一樣很多房

  可能生意失敗才妻離子散

  大房二三四房就全跑光了

  可能不跑會被股東們追債

  江國賓就在宜蘭抑鬱而終


  蔡淑臻還跑去宜蘭花了15萬

  幫前夫辦後事，就沒錢繳店租

  房東要趕人，只好靠隔壁小黃

  黃鐙輝是隔壁攤位的叫賣哥

  蔡就跟黃交往一起分擔家濟


  妹妹不知道自己爸爸是誰

  因為媽媽跟姊姊都不說

  姊姊還特別憎恨爸爸


  爸爸留下一隻狐蒙

  被妹妹帶回台北養

  但她不知道那是他爸的

  妹妹用左手丟球玩

  結果狐蒙追球被車撞死


  這裡拍的有點怪

  球好像沒丟出窗外

  彈力沒那麼大

  但狐蒙卻是飛出窗外追球

  怎麼看球都像是

  從樓梯滾下去的

  所這段拍的有點不合理


  反正狐蒙長的也蠻像江國賓的

  尖嘴猴腮的三立台語劇大反派

  現在台語劇演員好像都開始

  跑去拍電影了，像器子也是

  可能電視真的越來越少人看


  妹妹又拿左手到處去夜市偷東西

  因為她是左撇子，外公說左撇子

  是魔鬼手，不可以用左手吃飯


  我還以為我在看印度片

  沒想到台灣也有這種封建陋習

  後來片子去坎城說歐美也一樣

  我一直以為左撇子都比較聰明

  第一次聽到原來台灣也反左手


  姊姊知道妹妹偷東西後

  就帶妹妹去還東西並道歉

  還帶妹妹去找外公興師問罪

  說現在已經不是裹小腳的年代

  說妹妹魔鬼手結果她真的相信

  就跑去偷東西還怪是魔鬼偷的

  長姐如母，教妹妹像在教女兒


  後來檳榔攤老闆的老婆跑來

  說姊姊是小三勾引她老公

  她才知道她從情侶變情婦


  感覺被騙砲就不幹了跑回家

  而且還說她已懷了老闆的種

  但後來沒安胎就流掉了

  不知道有沒有吃RU486 ???


  蔡的媽媽好像做八大的

  可能年輕時是個舞女

  老了就去當人蛇仲介

  去越南用假護照帶人

  非法來台賣淫


  賺的錢都投資給獨子

  在上海開了間大公司

  所以兒子就為媽媽辦壽宴

  大概辦了三四桌盡孝


  隔壁小黃也被蔡帶來見家人

  問他做甚麼的，說做貿易的

  他弟問他有上市嗎?

  他笑說有，上夜市!


  姊姊看她外婆都把錢給舅舅

  就超不爽多喝了幾杯發酒瘋

  跳起來拿麥克風叫妹妹去祝壽

  要妹妹拿麥說祝阿祖生日快樂

  這才知道她妹妹原來是她生的


  她大概13~14歲就生下了女兒

  現在大概5~6歲讀大班

  因為太小懷孕所以說是自己妹妹


  就當是蔡淑臻生了兩個女兒

  所以理論上蔡淑臻才是外婆

  而壽星的確是阿祖

  那真是四代同堂

  皆大歡喜


  在這之前檳榔攤老闆跟老闆娘

  也跑來壽宴來找姊姊

  說生兒子就花錢買

  等與當代理孕母

  因為老闆娘生不出兒子

  都生女兒，老闆才想找

  小三小四生兒子來繼承家產

  看來應該也是個

  玩世不恭的富少


  後來元配聽到流產就氣跑了

  老闆就給了姊姊一大筆錢

  當作遣散費或封口費

  可能感覺對她很虧欠


  結尾三代同堂一家三口

  又在臨江街夜市賣麵

  小黃也在旁邊幫忙

  裡面姐姐跟妹妹演的最好

  但姊姊只入圍新人獎

  還以為她會像艾諾拉

  也入圍女主又變影后


  這片根本就是台版艾諾拉

  都是社會底層的女性電影


  PS:

  一開始以為是

  江國賓跟姐姐亂倫生了妹妹

  因為媽媽姊姊都沒說清楚

  但應該這三代女應該都是

  很年輕就未婚懷孕後離婚

  而且代代相傳


  看演阿嬤的本人67歲

  蔡淑臻本人50歲

  所以大概17歲就生蔡

  看來祖孫也算隔代遺傳

  然後青出於藍勝於藍


  其實以前童養媳時代

  也都是月經一來就嫁

  然後賣去當大戶人家

  的二房幫元配生兒子

  可能一生就生十幾個

  就像當代理孕母一樣


  聖經也有紀載

  以色列的祖先亞伯拉罕

  因為生不出來所以老婆

  就找個下女夏甲來生兒子

  結果夏甲想轉正變大老婆


  就被正宮趕走自己生以撒

  後來下女跟兒子就變回教

  所以回教跟猶太教基督教

  本是同根生才會結怨千年



  --

  趕著去赴約，要在30分內寫完

  演阿祖的叫賴青畇(原名趙心妍)

  還以為她是天天開心的是司馬玉嬌

  沒想到是以前花系列的國語女演員

  大概跟李烈應曉薇同期的女配角

  跟角頭新南部大反派崔浩然一樣

  他們都沒去中國，深根在台語劇

  以前國語演超好，台語也演超好


  小黃能跟名模蔡淑臻演到床戲

  難怪能入圍金馬獎最佳男配角

  他戲裡的角色人真的蠻好的

  可能從艋舺角頭金盆洗手

  隱姓埋名躲在臨江街擺攤

  孰不知他以前可是大流氓

  所以演妹妹的宜靜葉子綺

  說小黃不講話時感覺很兇

  可能他南部角頭還沒演完'
