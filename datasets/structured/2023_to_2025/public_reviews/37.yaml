title: '[新聞] 左撇子女孩_挪威南方影展_銀鏡獎'
content: '《左撇子女孩》再傳捷報！


  資訊來源：


  在！



  --評審團主席形容《左撇子女孩》--


  「

  銀鏡獎頒給一部風格粗獷卻色彩豐富的電影。全片以 iPhone 拍攝，

  這個選擇在評審團內引發了不少討論。我們認為這個拍攝方式反而提

  升了電影本身，讓作品呈現出更直接、更即時的表達。


  透過與片中小主角宜靜的親密視角接觸，我們一次次借用她的眼睛觀

  看成人世界。於是，我們得以意識到成人世界的規則與教條如何在孩

  子眼中顯得荒謬，而那些看似微不足道的話語，卻可能深深影響一個

  小孩。儘管電影底下蘊含沉重的主題，我們看完後卻留下一種溫暖、

  愉悅的感受，並感受到電影似乎在訴說：家庭之外，『社群』的重要

  性同樣不可忽視。


  這部電影以台北的女性為主角，她們的期待、傳統與秘密，皆以充滿

  自信的導演手法呈現；故事從好奇的開場一路推進至那個眾所期待、

  令人難以忘懷的最終時刻，讓評審團深受打動。

  」



  --








  --'
