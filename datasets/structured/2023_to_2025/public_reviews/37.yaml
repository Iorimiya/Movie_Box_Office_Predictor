title: '[普雷] 左撇子女孩-小孩什麼都懂'
content: '這次演員都頗有資歷，連同小女孩葉子綺把整部戲演得自然不造作。


  看對話，很多對白都是台灣大人的習慣，不正面回答，但孩子眼睛觀察就什麼都明白。


  配樂也不錯，配合著劇情發展，進入當下的情景。


  劇情流暢，也有高低起伏，

  討論台灣的迷信及文化，例如：左撇子、改名、重男輕女、愛看財經節目，

  但接下來我有不喜歡的人物劇情設定


  ---------防雷----------



  ---------有雷----------



  -------不喜歡的點------


  -------可能大家不在意的雷-------


  ------但因為是第一次發文-----


  ---------又是手機-------


  ---------怕防的不夠好-------


  -------就多設幾條-------


  我要說不喜歡的地方了。


  覺得如果我是外國人看完後，

  對於擺攤的人生活狀況就像電影那樣，變成一個刻板印象


  再來，為什麼女主想要賺錢比媽媽更多結果跑去當那個職業，

  而且既然是當初學校的雪霸，

  在顧攤的時候橋段，我差點以為她是之前出過車禍


  為什麼$$要借錢給✓✓就要找他回家準備睡一晚。


  部分背景對話我覺得也有畫龍點睛的效果，可惜沒翻譯。


  剩下有些片段，我就覺得是為了劇情張力，就不要討論合不合理了。





  --

  但後面，對方又要借他，他又說自己會想辦法籌錢，這時候才是山窮水盡吧。'
