title: '[好雷] 有驚艷到的左撇子女孩'
content: '對近代國片很感冒 這片是因為Sean Baker的名號以及與坎城有削到邊所以去


  看的 老實說要不是最近沒有喜歡的片 這片可能就放掉了 所以我算是不抱期待


  的心情看完的 但我覺得這片真的不錯！



  1. 真的有很多西恩貝克過去電影的影子 （看之前查一下 鄒導演跟西恩貝克之


  前的合作經驗非常久而且不淺）包括很icon的底層艱困、大混亂場面、角色崩潰


  、美術風格、甚至片尾處理等 西恩貝克不是只是掛名而已 因為這點考慮是否觀


  影的人我認為可以放心買票進場



  2. 全片的場景、演員都是台灣的 片中有很多台灣元素，其中電視記者訪問機車


  騎士的最後一題有夠接地氣 超台灣梗！



  3. 很多人討論這片帶到的重男輕女議題，比較讓我有感觸的是華人家庭尤其底層


  的教育方式 小孩成長過程充滿著責罵跟沒耐心 宜靜各種無心的提問常常換一句


  大人講話不要插嘴之類的 有幕在機車上要拿東西給宜安看 馬上被喝斥 如果是


  歐美體系的話大部分在當下或事後絕對會解釋為什麼不要這麼做很危險之類的


  我就有在麵店吃麵看過一個媽媽在等麵到吃完的過程罵女兒罵整場的不誇張 真


  的覺得很多在這種環境體制下能平安長大不長歪的華人小孩都是天選之人 片中


  宜靜經歷這些還能這麼天真可愛也是正向到不現實 另外一點最深刻的是 華人


  （還是其實只有台灣人？）在被欺負時 第一時間是先責備自己人的！ 像後段


  的家族聚餐（雖然家庭關係好壞待討論XD) 一個外人跑來砸場 裡面幾十個自己人


  居然沒一個人跳出來 如果是歐美不管自己人是對的或理虧 鬧事的可能不知道埋到


  哪裡了 然後劇裡面是很貼合台灣民情（尤其早期 現在應該好一點）得讓媽媽表演


  起手式先補幾腳不明究理的先把女兒再劈頭訓了幾下 唯一比較成熟的是認識


  沒多久的夜市貿易王 一個最跟這個家族無乾的人卻站得最挺 還試著圓場、救場



  4. 開頭結尾的萬花筒拍的有夠好看 好喜歡！



  5. 這部我覺得是非常"完整"的小品 是那種如果放到日舞影展可以輾壓對手


  的驚艷小品！應該會在我2025的top3



  其實看完這片我有個想法 要發展國片可以考慮以這種在好萊屋或一線電影工作環境


  耕耘的人材 然後找知名的前輩大師來監製 這樣的片應該會比較成熟 有點像台灣的


  機車產業 電腦產業 一開始都是技術合作或抄來的 但久了以後就有機會走出自己的路


  比起現在國片盲目摸索 靠人脈（關係）搶舞台 總愛用什麼大尺度誰又怎麼脱當宣傳


  其實都只注重在電影的皮而忽略骨跟肉 左撇子女孩這種"技術合作"也許較有可行性


  -----

  Sent from  on my iPhone


  --

  呃...我指的是台灣國片見光跟拿獎的部分不是批評靠人脈


  這件事 鄒肯定有人脈 不然哪可能有Sean Baker鼎力相助

  配樂我很喜歡耶 尤其時惡魔手那個 有icon感又不會不搭







  對11/01 09:45



  色調有Sean Baker的影子 好幾幕宜靜的戲有刻意讓鏡頭視


  角從低處拍效果也不錯

  有牛排干貝 幹嘛吃雞腿排骨？ 邏輯？

  11/01 11:2

  2

  我覺得不要抱特定期待會滿好看 跟預告片給人的


  走向期待不太一樣

  左撇子不是重點沒錯 我猜導演搞不好其中一大主軸是在探討


  傳統華人教育的荒謬處 而左撇子只是其中一項 這幾天華山


  有開QA場導演有出席 有興趣的可以當場問看看XD'
