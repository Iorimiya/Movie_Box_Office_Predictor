url: https://www.ptt.cc/bbs/movie/M.1743547111.A.6F6.html
title: '[好雷] Minecraft 麥塊電影'
content: '防雷





























  遊戲我只有在多年前稍稍玩過

  當時因為蓋的東西每次重開一直不見

  不知道可以存檔就爆氣不玩了（有夠瞎的理由

  至少對遊戲的一些設定都還記得

  畢竟是全球等級的遊戲,還是有他出色的地方

  很好奇拍成電影是如何,加上搞笑的傑克布萊克

  他光站在那裡就讓我很想笑

  他真的是多年來都沒變,是個使人感到放鬆的存在

  傑森摩莫亞跟他的一搭一唱我也很愛

  這樣說好了,他們倆是很鬧的天生一對


  講到電影本身,前幾篇有講到媒體不喜歡

  從一開始就能發現端倪,也就是他的敘事

  連平鋪直述都有些稱不上了

  若把進入主世界這段化為文字

  就是“因為…所以…”的造句,沒了

  過了不用很久就能發現他把這些元素都丟的差不多

  聽起來像是要變爛片了對吧？

  這就是他出色的地方,他還是有明顯的可看之處

  遊戲精髓我看都有演出來

  那個20分鐘天黑的設定瞬間讓我夢回當年

  還有我上段提到的兩位演員魅力

  加上一些常人有的煩惱（弟弟的部分

  就成了可看性仍然不低的電影


  不過上篇有人提到說除了娛樂性其他嚴重不足

  我還算認同這句話,這真的是他的硬傷

  幸好他時間就控制的不錯,並不拖泥帶水

  我原本以為女校長那段會歹戲拖棚

  好家在他的存在是恰到好處,還成了很酷的片尾

  整體而言我對這部電影是讚賞的

  至少同場的小孩們看的很開心

  苦力怕的人氣是真的高（雖然是我當年的惡夢

  他算偏兒童向的,適合小朋友看

  就算不足以讓我回去玩遊戲

  光是讓我回味再三當年就已經很棒了


  ----

  Sent from  on my Samsung SM-S9280


  --

  每當處在我人生的十字路口，我總是知道哪條路是正確的

  沒有例外，我總是知道，但我從來沒去做，你知道為什麼嗎？

  因為那實在他媽的是太難走了

  而現在的查理也正處在人生的十字路口，他選擇了正確的路

  一條通往原則、導向人格的道路。讓他繼續走完這旅程

  委員們，你們正掌握著他的未來。這會是個寶貴的未來


  --'
