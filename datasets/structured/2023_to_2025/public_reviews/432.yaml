title: '[大負雷] Minecraft 麥塊電影'
content: '很難看幼稚，大人千萬不要去看，尤其是有玩過的/遊戲宅 看了會生氣


  這部片的客群大概是12歲以下









  以下有雷



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  劇情想展現五個角色的不同特長 但是手法極為拙劣


  比如史蒂夫是老手 房東很會馴獸 姐姐打架很厲害(why??) 弟弟很有創意 垃圾人很垃圾


  根本沒在給你舖陳的 都是直接粗暴的演他們天分如何


  垃圾人是老格鬥遊戲世界冠軍 但從頭到尾都沒用到他格鬥遊戲的特長


  姐姐和房東也不知道為什麼突然很會打架 明明第一個晚上還驚慌失措？



  史蒂夫雖然是當老手的角色 但以玩家的角度完全是菜雞


  明明Minecraft很多youtuber和實況主一堆神技


  或是極複雜的紅石機關可以火力展示


  通通都沒有在電影裡用上 導演編劇有玩過遊戲嗎？？



  弟弟的部分最爛 一直想強調說他多有創意


  結果快結局時 魔方有點高一直拿不到


  我心中一直大罵幹你娘怎麼不在腳下放方塊



  還有那個垃圾人跟女校長一直強行打斷電影節奏


  還好這部電影也沒什麼節奏可言




  最近剛在Netflix看了龍與地下城


  真的是天壤之別 害我對遊戲改編電影有了錯誤期待 = =



  --'
