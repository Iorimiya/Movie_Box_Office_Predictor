title: '[負雷] Minecraft 麥塊電影'
content: "上周末和朋友們去看了電影\n雖然早早就從預告得知這是以穿越為主題的麥塊電影\n心中早有看爛片的準備\n\n看完之後只能說  這部片很適合親子闔家觀賞\
  \ 而且是有接觸麥塊的親子更好\n至少前排坐的小孩子看的真的很開心\n\n只是我們從影院出來後臉上都像是被餵屎一樣就是了\n\n\n\n真的不懂  這類改編電影到底為啥都要做成穿越劇情\n\
  之前的魔物獵人也是   直接用現成的世界觀好好拍一部片不就好了\n到底為啥都要搞穿越\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n電影從旁白間主角之一的史帝夫開始說起\n\
  訴說他從小就喜愛礦坑，然後長大後一事無成最後回去挖礦\n挖到能穿越至麥塊世界的神器\n\n接著麥塊的精華就被草草帶過了   探索、建築、紅石、創造\n\n還養了一隻狼，一起到處冒險顯得他們感情有多好\n\
  \n最後他進入地獄被豬布林BOSS抓住 BOSS瑪格殺想要那件神器\n但史帝夫的狼叼著神器跑回現實中然後藏到史帝夫的床下???\n\n\n接下來就是看各種人生不如意的腳色耍帥或是扮蠢\n\
  \n--垃圾人沉迷過去，面對現實只能乖乖低頭\n但他就是不肯好好找一份工作要開那家莫名其妙的店\n\n--姊弟倆搬家到鎮上，然後表現出弟弟很有創造力\n直接在第一天報到的學校做出噴射背包??\
  \ 然後被87同學搞破壞\n姊姊很可愛，想舔她腳趾頭\n\n--房仲不重要 給DEI一點尊重用的腳色\n\n--副校長要離婚了\n\n\n\n經歷一連串的事件後進入麥塊世界了時間很快進入晚上\
  \ 主角群被殭屍圍攻\n弟弟發現這世界的規則，然後現場做了一棟堡壘\n\n這就是本部片唯一有真的蓋東西的片段了\n\n接著史蒂夫救場，嘴砲個幾句話再演一下動作戲\n\
  接著一群人就莫名其妙地開始一同行動了\n史帝夫你都不會好奇這群人是怎麼跑來的嗎?\n問一下很難嗎?\n\n史帝夫被抓住後是先和瑪格殺達成協議要搞這群人的\n馬格殺騙他已經抓住他的狼，不遵從就宰了他的狼\n\
  但他根本沒再理這個協議的，所以前面達成協議的片段到底是在演甚麼?\n而且你也根本不在意你的狼阿.....\n\n\n後來到了鎮上，為了展示弟弟好有創造力 讓他在工作檯上隨便做了一把薯球發射器\n\
  \n然後史蒂夫展示各種麥塊世界的東西及收藏，但你們不是要前往林地府邸嗎?\n直接拿來用不好嗎?\n\n接著一連串的豬布林追殺、冒險\n有個村民還逆穿越到現實世界被副校長撞上\n\
  他們就開始約會吃晚餐了\n\n\n中間再展示了一下姊姊和房仲發現自己很能打殭屍的片段 莫名其妙\n但姊姊很可愛 所以沒關係 想舔她腳趾\n\n\n最後豬布林拿到神器，進軍表世界做了一個能量發射台\
  \ 要征服世界了\n於是大家做好準備跟他們開戰，做了一堆鐵魔像和原創的迅捷之鞋鐵魔像\n然後主角群中只有史蒂夫有穿鑽石裝  所以你們到底在幹嘛?\n其他人也要打仗他們都不用穿裝備嗎?\
  \  資源不是一大堆嗎????\n\n後來弟弟飛到發射台上但高度差一點點勾不到神器 場面好緊張好刺激\n阿你不是很聰明很有創造力?? 怎麼不往腳下墊方塊??\n\
  \n\n最後垃圾人救場 馬格殺被史蒂夫打敗  還演了兩次想騙他走進拿匕首想捅人的場面\n有夠白癡\n\n\n最後大家就都回現實世界了  有了麥塊世界的經歷 大家從此步上人生勝利組之路\n\
  \n弟弟的噴射背包成功運作，但是你要不是被搞早就成功了ZZ\n而且你有這種做噴射背包的能力你根本不是魯蛇組的人啊....\n\n姊姊還是很可愛 想舔腳趾\n\n\
  房仲辭去一堆兼職 改行大成功\n\n垃圾人跟史蒂夫合夥做出超成功的電玩\n\n副校長和莫名其妙能開口的村民結婚了\n---------------------------------------------------\n\
  \n劇情就是給小孩子看的 細節隨隨便便 轉折不重要\n整部片都是在很歡樂的氣氛中渡過\n彩蛋是有一點點  就這樣了\n\n\n麥塊世界的設定有些有演出來 有些魔改\
  \  像是殭屍只有外型像遊戲\n電影演出打死不會掉東西也沒經驗值 還會骨折???\n\n\n說是麥塊電影  但也只有借用世界觀和表面的設定\n主軸一直都是主角群的拯救人生大冒險\n\
  \n\n我就知道遊戲改編電影搞穿越的都是爛片\n直接拍一部像龍與地下城盜賊榮耀的不好嗎?\n\n\n唯一看點就剩演姊姊的愛瑪·梅耶斯  有夠可愛  想舔她腳趾\n\
  \n--\n以下哪位會讓你想娶回家? Part.1\n1.聽說朋友失戀了，於是綁了他最喜歡的單馬尾去安慰他\n2.因為老爺擔心獨自在外的少爺會亂搞，於是派我來誘惑少爺\n\
  3.老師太死板了，我要用身體讓他屈服!\n4.第一次獻給了哥哥，從此以後有需求就去找他的我\n5.為了獨佔最愛的爸爸，我要把其他婊子都趕走\n\n--\n  \
  \                                  04/19 14:45\n\n???  動畫電影就不能有帶入感嗎?\n\n\nLOL 你也是滿可悲的"
