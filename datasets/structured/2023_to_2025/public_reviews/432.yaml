title: '[新聞] 《MINECRAFT 麥塊電影》導演透露續集！'
content: '《MINECRAFT 麥塊電影》導演透露續集有譜！能再拍一部會超級好玩！





  真人版《MINECRAFT 麥塊電影》表現亮眼，導演傑瑞德海斯近日也親自透露——續集的可

  能性正在升高。


  根據北美票房初步統計，《MINECRAFT 麥塊電影》上映首週末便以 1.57 億美元空降北美

  票房冠軍，全球首週票房突破 3.01 億美元（含國際市場約 1.44 億），遠遠超出市場預

  期。


  這樣的成績，自然讓華納兄弟對於打造續集或乾脆發展


  成系列開始認真考慮起來，而導演本人似乎也樂觀其成。


  導演海斯在接受《GamesRadar》訪問時坦言，他對拍攝續集很有興趣，


  並強調 Minecraft 的沙盒世界無窮無盡，首集其實只是「沾了一點邊」而已。他說：


  「能再拍一部應該會超級好玩！這個世界無限寬廣，還有太多神奇的模組、


  角色、生態區 (biomes) 沒碰到過，如果能拍真的會超讚。」



  《MINECRAFT麥塊電影》講述四位不太合群的角色穿越進一個神秘、


  方塊風格的世界——主世界 (Overworld)。這四人分別是小男孩亨利（賽巴斯汀尤金漢森

  飾）


  、他的姊姊娜塔莉（艾瑪梅耶斯飾）、「垃圾人」蓋瑞特（傑森摩莫亞飾）


  以及唐恩（丹妮爾布魯克斯飾）。在這趟魔幻冒險中，他們還遇見了遊戲裡


  的經典角色——史蒂夫，由傑克布萊克飾演，他協助眾人適應地形、學習生存，並找出回

  到人類世界的方法。


  本片除了主世界，還描繪了《Minecraft》玩家熟悉的「地獄」(The Nether)——


  由「豬人」(Piglins) 統治的區域，混合了原始、貪婪與瘋狂的氛圍。


  海斯坦承自己對這部分情節特別著迷，因此選擇在首部電影中優先呈現。


  「我超愛豬人，他們真的又怪又好笑又噁心，還有一種很原始的野蠻部落風。


  他們是食人族，還有對黃金的病態執著，當反派根本完美，但他們也有自己的故事要講。

  」


  根據目前上映版本，《MINECRAFT 麥塊電影》有一段中場彩蛋與一段片尾彩蛋。


  其中片尾那一段出現了一位遊戲中的重要角色，雖然登場時間不長，


  但資深玩家一看就會認出來，堪稱隱藏彩蛋中的彩蛋。該角色的登場，


  加上電影中刻意只展現有限場景，也進一步暗示這部電影很可能只是整個故事的序章。



  雖然目前官方尚未正式宣布續集拍攝計畫，但若以票房表現作為參考指標，續集幾乎可以

  確定在規劃中了。


  儘管票房亮眼，但《MINECRAFT 麥塊電影》在影評界的口碑偏向兩極。


  爛番茄網站影評人分數僅有 47%，不過一般觀眾反應則相當熱烈——


