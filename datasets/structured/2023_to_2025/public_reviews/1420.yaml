title: '[新聞] 自由之聲製作人有意角逐墨西哥總統'
content: "（本文為網友自行蒐集之情報，若有疏漏之處，請板友再補充賜教）\n\n\n這已經是兩週前的消息了，主要是這週末怒衝一波《自由之聲》之後，\n\n\
  女性朋友發現片中的慈善富豪（請勿爆雷，還有板友沒看的QQ）客串者Pablo\n\n其實就是帥氣瀟灑的製作人Eduardo Verástegui本人，一用關鍵字查不得了，\n\
  \n原來他有意角逐墨西哥總統大位，但他必須在明年一月前蒐集足夠的簽名才能登記\n\n明年六月的參選資格。\n\n\n「 \"If you really want\
  \ to do something for your country, you need to have the\narmy, the police, the\
  \ funds, the intelligence, the technology, and you only\nhave those if you become\
  \ president.\"」\n\n「如果想為國家做點事，你需要軍隊、資金、情報來源、科技，要擁有這些，\n\n要先當上總統才行。」\n\n\n想必影迷對墨西哥的印象多半是貪腐和人口外移吧？要選總統需要很大的信念，\n\
  \n雖然只是小小影迷，但看到烏克蘭總統也是演員出身，會覺得由演員當總統\n\n也沒有不好，之前宣傳時我有發現他很會說話，也是虔誠的天主教徒，\n\n提到自家國家孩童遭人宰割就淚眼汪汪的，但用字遣詞很成熟也落落大方，\n\
  \n理性與感性兼具，也是我會特別關注這部片的理由，如果未來墨西哥總統是個\n\n有顆大愛之心的大帥哥，或許有這個人緣和機緣的，他本人是說自己會盡力準備，\n\n\
  但若未能獲得資格的話，也不是他能決定的。\n\n\n此外，Eduardo自陳自己花了20年在影壇，選總統就要重新來過，\n\n但因為有民眾建議他去角逐這個機會，他也願意試試看。\n\
  \n\n再來，新聞裡有提到Eduardo在好萊塢最被記得的就是曾和J.Lo共演MV，\n\n（該MV是有1.6億點閱率的「Ain't It Funny」，不過似乎有文化挪用的嫌疑，\n\
  \n我不知道拉丁美洲是否能跟歐洲的Roma人文化扯上關係XDDDD）（據說叫吉普賽已經\n\n有歧視的意思，所以現在似乎不太用這個詞了？）我是在電影「春光之境」學到的）\n\
  \n\n影像裡兩人幾乎都是凍齡啊，因為是電影板，就不貼音樂相關的內容了。\n\n新聞網址：\n\n新聞網址：\n\n\n不管有沒有順利進入政壇，好故事能帶給人的影響力，是可以改變歷史的QQ\n\
