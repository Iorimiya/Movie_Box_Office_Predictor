url: https://www.ptt.cc/bbs/movie/M.1701315927.A.2B8.html
title: '[討論] 自由之聲Sound of Freedom獨家串流上架'
content: "CATCHPLAY+已經正式上架自由之聲（SOUND OF FREEDOM），\n\n看片商的文案，才後知後覺連阿湯哥都有機會被比下去？\n\n\
  ---\n「必看票房奇蹟！【受難記】吉姆卡維佐再扮救世英雄，追查兒童販賣、破獲人蛇集團，\n\n全美吸金破億更勝阿湯哥！ 」- 編輯推薦\n\n\n真實事件震撼改編、以2023年最大黑馬之姿創下2.3億美元票房奇蹟；【受難記：最後的\n\
  \n激情】吉姆卡維佐化身正義悍將，獨身涉險搶救無辜，全片藉黑暗寫實又真摯催淚的劇情\n\n描寫，揭露蔓延國際的兒童人口販賣真相、喚起大眾對此議題的重視。美國國安局探員提\n\
  \n姆巴拉德，在一次任務中救出一名遭到綁架販運的男童，並得知男孩的姐姐也同樣受害其\n\n中。經過一番思考，提姆決定冒險深入南美叢林，誓言將女孩從煉獄中解救出來...\n\
  \n----\n\n串流縮網址：（CATCHPLAY+）\n\n\n\n\n唯一的小提醒：本片武戲不如POI多，且卡維佐的表現比POI活潑一點。\n\n像下文就是有點浮誇了，武戲是畫龍點睛的那個「睛」，除非全身都眼睛否則\n\
  \n這部武戲抱持過高期待會有點失望的，這部不算動作片，動作場面稱不上多。\n\n\n動作刺激媲美《即刻救援》 傳達議題引共鳴\n《自由之聲》口碑爆棚 網友盛讚「今年必看！」\n\
  \n\n--\n\n我剛爬了文一下，或許是選舉到了，某些內容農場的風向已經抹到製作人身上了，\n\n請不要討論政治以免被捅，要談政治，網路上已經有心得文有提到了，\n\
  \n本板爬文也已經有提了，就不重複PO。\n\n\n上串流之後想暫停就暫停，想跟親友討論就可以很自在，\n\nCATCHPLAY+也有為這部買廣告和請藝人造勢，說真的，一部被冷藏五年的獨立電影\n\
  \n能發展成這樣已經很讚了，祝推文的大大好人三生三世平安健康。\n\n--\n                    \n                ███\
  \           \n \n   ★        ζ███        ███ζ \n      is a good day with !\n   \
  \       ★       \n\n--\n商機比毒品交易還大，片中有說確定擋人財路。\n川普還阻擋中美洲小孩入境、留下很差的印象，這標籤別傻傻跟著貼喔！\n\
  感謝提醒\n就知道有人是在等串流的，這部是15歲以上就能觀看囉！"
