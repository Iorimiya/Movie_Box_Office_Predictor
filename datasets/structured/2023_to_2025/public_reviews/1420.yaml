url: https://www.ptt.cc/bbs/movie/M.1701414588.A.22D.html
title: '[討論] 票房破2億美元的自由之聲'
content: '在台灣還沒上映前就有耳聞這部片的背景，

  改編自美國聯邦探員提姆巴拉德的真實故事，接露兒童販賣殘暴惡行。

  為了完成這部片更是向大眾募款，花費五年的時間才完成拍攝，

  最後票房破兩億美元甚至在爛番茄獲得99%的好評

  不少人透過這部電影關注到人口販賣的議題。


  電影中並沒有將侵犯兒童的畫面呈現出來，

  卻還是能透過鏡頭語言和演員們的情緒表現感受到其複雜的情緒，

  讓我雞皮疙瘩到不行....

  很喜歡裡面的一個句話「Gods children are not for sale」

  雖然看到滿多人說有宗教含意，但我覺得把上帝拿掉要傳達的意思還是一樣的

  任何人都不該是商品，而是獨一無二的存在。


  希望這種比較嚴肅的社會議題都能被大家關注

  大家覺得還有什麼社會議題也適合用這種方式提倡


  --'
