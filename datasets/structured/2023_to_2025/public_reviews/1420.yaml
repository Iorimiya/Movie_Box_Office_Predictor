title: '[新聞] 關於兒童販賣—電影自由之聲'
content: '聯邦承包商在美國各地運送兒童，可能會將他們送到人口販子手中。這些承包商中至少有

  一個隸屬於中央情報局。


  每個月都有數千名外國兒童被販賣到美國。他們被下藥並偷運穿過美墨邊境，被邊境巡邏

  隊拘留，關押在絕密院落中，最後被護送到全國各地。


  自 2021 年以來，其中 85,000 名兒童失蹤。該報告透過無可辯駁的視訊證據揭露了整個

  兒童處理流程。


  透過獨家錄影、舉報人證詞和其他文件，揭露了美國聯邦政府如何為世界上最大的兒童販

  運團夥提供便利。



