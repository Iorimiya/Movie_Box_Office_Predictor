title: '[新聞] 邊拍戲邊救人！《自由之聲》哥倫比亞拍'
content: '邊拍戲邊救人！《自由之聲》哥倫比亞拍片　200名孩童意外獲救


  2023年09月23日 20:53


  記者蕭采薇／綜合報導


  電影《》由（Jim Caviezel）化身打擊兒童人口販賣的英雄，劇組為

  求真實來到哥倫比亞實地拍攝驚險的救援行動，由於哥倫比亞治安不良，妻子一度反對丈

  夫拍片。


  而拍攝過程中，也意外讓200名遭受人口販賣的真實兒童獲救。




  ▲吉姆卡維佐以電影《自由之聲》，暌違多年再度與觀眾大銀幕見面。（圖／CATCHPLAY

  提供）


  由於卡維佐的妻子擔心安危，劇組找了專業救援組織「」，派遣了30名前海

  豹部隊成員隨行保護。


  而在拍攝的兩週內，部隊一半的成員在空檔時總會消失不見，他們事後才發現，原來在拍

  片的同時，部隊前去支援當地的救援任務。


  製片驚呼：「謝天謝地卡維佐的妻子一開始堅決反對，正因為她，救援部隊才會跟著我們

  一起去哥倫比亞拍戲，並讓200名遭受人口販賣的真實兒童獲救。」




  ▲吉姆卡維佐揣摩角色面對受困兒童時，痛心和捨身救人的信念。（圖／CATCHPLAY提供

  ）


  男星以電影《》暌違多年再度與觀眾大銀幕見面，許多影迷都相當期

  待他的演出，為了揣摩角色面對受困兒童時的痛心和捨身救人的信念，卡維佐特地接受了

  一連串的訓練，不僅從旁觀察救援組織的偵查過程，甚至跟著他們一起出任務。




  ▲劇組為求真實來到哥倫比亞實地拍攝，卻意外援救200名兒童。（圖／CATCHPLAY提供）


  他說：「這是我繼《》後拍過最棒的電影，雖然過程中看見了最黑暗

  的景象，但也留下了光明的希望，希望大家看完這部片能有勇氣做出改變，不要去害怕邪

  惡，如同片中所說的『活在恐懼中，不是解決問題的方式，活在希望中才是，要相信我們

  能做出改變，因為我們真的做得到。』」


  電影《》由真實事件改編，現正熱映中。


  新聞網址：




  【自由之聲】Sound Of Freedom 正式預告




  --'
