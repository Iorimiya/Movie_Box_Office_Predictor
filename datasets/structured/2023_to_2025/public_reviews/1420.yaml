url: https://www.ptt.cc/bbs/movie/M.1704542611.A.E9E.html
title: '[討論] 自由之聲為何會被打壓？'
content: '最近了解了一下，自由之聲這部去年的黑馬作



  竟然是拍完"5年後"，才上映


  而且還是換了發行商才能上映


  聽說各家媒體好像也有意無意地忽視它



  可是我搞不懂


  這部電影明明講得是反人口販運反雛妓，這種天經地義，應該人人要支持的題材


  為何會被這樣疑似打壓？


  可能比較讓人會反感一點的，大概是主角吉姆·卡維佐 好像是比較激進的基督徒


  然後新的發行商用了動用基督徒團體的方式來拉抬票房



  但感覺就電影本身，應該沒什麼好爭議的吧....


  --

  太恐怖了...'
