url: https://www.ptt.cc/bbs/movie/M.1702360327.A.29F.html
title: '[好雷] 比恐怖片更細思極恐的自由之聲'
content: '比恐怖片還要細思極恐的片

  無外乎由真實事件改編，且仍在發生的紀錄宣導片


  之前看到郭書瑤在首映會後力推我就蠻想看的

  馬上列在必看清單裡


  《自由之聲》紀錄美國探員提姆循線揪出兒童人口販賣組織的過程

  甚至不惜在退休前一個月果斷辭職

  親赴哥倫比亞援救受困兒童


  全程我真的是豎著寒毛看

  對毫無抵抗力的兒童下手真的是窮極歹毒

  有些甚至才六、七歲的孩子就被迫一天接五到六次性交易......


  但最讓我覺得噁心的

  是其中一個主要人販子竟是毫無犯罪紀錄的選美皇后

  打著自身經歷挖掘童星的幌子

  從許多父母身邊偷走孩子

  把懷抱星夢的孩子推入人間煉獄


  看完這部片

  你會憤怒、會恐懼、會不捨

  但唯有不斷接露事實

  才能讓更多人有警惕

  進而群起防範


  真心希望有朝一日

  所有孩子都能活在有希望的光明

  毫無顧慮的傳唱自由之聲


  --'
