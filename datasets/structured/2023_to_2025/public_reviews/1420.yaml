url: https://www.ptt.cc/bbs/movie/M.1696162768.A.080.html
title: '[雷] 自由之聲-微雷'
content: '「你抓過多少戀童犯？」

  「目前為止，288人，還不差。」

  「你找回幾個孩子？」

  「…..」


  「一個毒品一晚只能賣一次，一個小孩一晚能交易5~10次」


  「現在人口販賣規模遠超過去，人數甚至比蓄奴時期還多」


  「人口販賣年收入1500億鎂，其中美國是最大宗」


  連假找個時間看了這部


  還蠻理解MSN和左派影評冷處理


  2018年拍完後一直冷藏至今的原因XD


  污名化戀童癖 + 宣揚富人消費大概是主因


  這部成本只有1400萬鎂的影片


  但內容紮實程度超乎想像


  個人覺得至少比50%的奧斯卡電影都好


  這部片美國票房2.2億鎂名副其實


  另外影片裡深層政府的影子嗎？


  提姆的上司以別國內政為由拒絕也是正當理由


  中間幾乎撕破臉時


  還幫忙聯絡大使館和調遣部隊上島


  最後的辭職也是照章辦事


  畢竟1個政府組織大費周章去處理別國事務


  很難說得上正當


  --'
