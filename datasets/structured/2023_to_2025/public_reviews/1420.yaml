url: https://www.ptt.cc/bbs/movie/M.1706964229.A.677.html
title: '[討論] 《自由之聲》上MOD了，二刷心得？'
content: "去年剛上映時就衝去實體戲院支持了一波Sound of Freedom，\n\n沒想到這部偏黑暗兒童拐賣題材，春節前夕居然敢上MOD，\n\n這不闔家觀賞、一起討論，就煞費片商苦心了。\n\
  \n身為年度賣座黑馬片，還促成製作人出來選墨西哥總統，\n\n但怕帶到沒必要的風向，本文就不談政治了。\n\n\n\n先上預告\n\n\n\n\n\n\n（本文已經是二刷心得，一定有劇透，不想被雷可以找其他網友的心得喔）\n\
  \n\n\n\n\n\n\n我當時很久沒進電影院看片，除了感受到聲光效果比一般家庭\n\n觀賞刺激精采之外（配樂真的很空靈又磅礡，很棒），中間也有些\n\n小恍神（看串流片看久了，有時會想暫停休息一下），結果男主角\n\
  \n提摩太跟吸血鬼討論的地方沒有完全看到，回來只看到「我才知道我\n\n就是她眼底的哀傷」，但覺得吉姆自嘲是「穿著花襯衫、色色的外國人」\n\n那裡比《疑犯追蹤》的他還要活潑一些，也有幾幕因為孩子們逼真的演技\n\
  \n太寫實，實在很不忍心看下去，但串流就沒這個問題了，我這邊有親戚\n\n孩子是第一次看吉姆卡維佐的片都覺得他超帥的，特別是最後臥底成\n\n醫療志工去救援的部分，還揍了叛軍首領，終於有出了口氣的感覺。\n\
  \n\n（MOD上架時也有保留卡維佐的最後喊話影像，要大家用希望代替恐懼）\n\n\n特別推薦那些覺得自家孩子過太爽、不諳世事的父母們，\n\n人權議題一定要從小教，這世界還有很多比人魚重要的事值得關心。\n\
  \n\n--\n\n幻想●---------------☆\n/﹀\n/\\ \n\n按a加入最愛\n\n--\n說到歌詞翻譯，我在電影院看自由之聲時，叛軍唱的歌也是有翻譯的，沒過度醜化對方，\n\
  \n在那瞬間居然覺得叛軍也是有血有淚的人，只是走上歪路。\n可能又是老問題，應該會被一些不同政治與宗教立場的人「不看好」吧？\n\n這部片從拍好到真正能播已經歷經很多不公義，要請你爬文了解一下了，\n\
  \n我看Netflix也不敢上這部片。\n\n\n\n\n上文說這是動作片，但其實動作場面沒有很多(錢不夠QQ)，但該刺激的地方還是有做出來\n我實際去觀影時，影廳偏空，迫於影廳方的壓力還是要早早結束檔期，\n\
  \n但能很快上串流已經很好了，這部本板首po恰巧是在下我，當時已經做好會被打壓到\n\n台灣人也未必能看到的心理準備，能有這樣的討論度和觀影平台已經很好了^ ^\""
