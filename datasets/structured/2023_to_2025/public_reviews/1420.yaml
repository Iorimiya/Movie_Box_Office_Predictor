url: https://www.ptt.cc/bbs/movie/M.1696089840.A.C97.html
title: '[好無雷] "自由之聲"無雷心得'
content: '掙扎了好幾天，終於在贈完一些票心裡比較好過一點之後才開始寫心得，然後就發現

  他可能活不到下一週了(哭，改編自真人真事題材的自由之聲是很沉重的販賣兒童議題，

  電影一開始的事件可怕到讓我一直起雞皮疙瘩，但所幸後來風格就轉變的比較像特務片，

  整體來說風格出乎意料的很好萊塢商業片，觀影體驗很好，演員演技也都很不錯，故事也

  很有意義，看完後會很佩服主角們的做為，但或許是自己負面情緒很難排除的關係，故事

  主軸的議題跟龐大的真相，讓我覺得很後怕跟不舒服，會有種很強烈的無力感，"你所謂

  的歲月靜好，不過是有人替你負重前行"有些真相很殘酷，但視而不見並不會讓事情變得

  更好，推薦給大家一起來關心兒童販賣的問題，下週平日的場次就很爛了，雖然只剩一天

  假日，但還是希望大家給這部電影一個機會。


  --'
