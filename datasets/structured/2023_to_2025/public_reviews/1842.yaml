title: 生態電影「山椒魚來了」
content: '生態電影「山椒魚來了」


  2023-04-07


  （記者_許家源/雙北報導）


  新北市長侯友宜今(7)日到板橋秀泰影城，以行動支持臺灣生態電影「山椒魚來了」，導

  演麥覺明、「守護黑面琵鷺」導演梁皆得及「消失的紫斑蝶」導演詹家龍，三位生態電影

  大師齊聚一堂共襄盛舉，現場還有許多新北生態保育志工們一起觀賞電影，以實際行動支

  持山椒魚等野生動物保育，市長侯友宜表示，透過電影觀賞，邀請大家一同關心、重視臺

  灣的生態保育。



  導演麥覺明耗時17年拍攝個人山林生態電影《山椒魚來了》-大麥影像傳播工作室提供


  新北市幅員廣闊，新北金山清水農地、貢寮田寮洋等皆是候鳥黑面琵鷺南北往返的重要中

  繼站、新北龍洞亦是紫斑蝶重要度夏區域，生態資源可說十分豐富。這次邀請梁皆得導演

  以及詹家龍導演一同出席電影欣賞，未來預計5月中下旬再辦理「守護黑面琵鷺」、「消

  失的紫斑蝶」電影欣賞會，讓大家能更了解在新北市的珍稀野生動物。市長侯友宜表示，

  今年世界地球日主題，投資我們的星球 地球的事就是你我的事；新北推動農業健康市/式

  ，延伸到生態環境的永續發展，重視棲地復育及生態廊道施作，使得生態資源豐富，動保

  處每年逾6000件野生動物救援案件，救援對象包含鯨豚、海龜、遊隼、穿山甲、食蟹獴等

  保育類動物，顯示市府保護生態的決心。我們所做的這些與生態電影拍攝的理念一致，透

  過電影觀賞，喚起大家一同關心、重視臺灣的生態保育



  《山椒魚來了》除了有臺灣山林之美，還有更多珍貴的臺灣山椒魚影像

  -大麥影像傳播工作室提供


  山椒魚是兩棲類有尾目隱鰓鲵亞目動物的總稱，雖名為魚，但並非魚類。因為身上有胡椒

  味道，而被命名「山椒魚」，終身有尾巴，屬於兩棲類生物，肉食性，因受環境限制，以

  及森林棲地遭受砍伐破壞，現已列為瀕臨絕種動物。臺灣的山椒魚約屬10萬年前生物，臺

  灣目前發現共有5種山椒魚，是臺灣特有的珍稀動物。「山椒魚來了」導演麥覺明花了17

  年的時間，以鏡頭紀錄一群滿腔熱血野外研究員，歷盡艱辛探索山椒魚，傳達了熱情堅毅

  的研究精神與決心，並展現對臺灣山林的熱愛，與新北市重視生態，從事動物救援，維護

  生物多樣性的立場一致。因此新北市府長期以行動支持生態電影，過去也曾辦過包含「黑

  熊來了」、「遊隼的故事」等電影欣賞會。今年麥覺明導演「山椒魚來了」、梁皆得導演

  「守護黑面琵鷺」及詹家龍導演「消失的紫斑蝶」都是很棒的電影，希望民眾能夠透過導

  演們的鏡頭，瞭解這些生物面臨的生存壓力，進而勾起民眾更多保育意識，以及理解保育

  工作極其不易、需要更多人投入與關注。


  新北市動保處表示，現今社會保育意識高漲，多數民眾對傷病野生動物願意伸出援手，新

  北市也秉持友善動物城市的信念，動保處在2017年成立動物救援中心，其中包含野生動物

  救援，救助傷病的野生動物們。經統計去年野生動物救援案件就超過6,200件，對於野生

  動物的保育救援工作，新北市積極參與從不缺席，幫助更多野生動物返回自然棲地。也呼

  籲民眾善待自然環境中的野生動物，秉持三不原則「不餵食、不干擾、不接觸」，大家齊

  心為大自然盡一分力，保育工作缺你不可。


  Mega News 報新聞


  --


  窩完全沒有想到～鯰魚～或者比目魚又或者魟魚，都沒有，發表這篇時一心祇有山椒魚'
