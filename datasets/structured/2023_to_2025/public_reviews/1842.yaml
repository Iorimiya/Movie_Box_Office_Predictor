title: 'Re: [好雷] 《山椒魚來了》絕不冷場的紀錄片'
content: '這是記錄研究人員的片==


  大部分的時間都在講做生態研究多辛苦


  偶爾帶一下山椒魚


  如果是想看discovery這種動物頻道的人會失望


  主要都在介紹如何做研究，研究遇到的困境等


  山椒魚的畫面出奇的少，進食畫面很像擺拍


  老實說蠻無聊的==


  小弟我已經對生態對研究對生態研究有點接觸的人了，看到快睡著


  真心推薦給不只想看山椒魚的朋友，這部能夠更了解研究人員在幹嘛


  或是對國片特別有愛的人可以進場支持


  對了也很多高山空拍機的畫面，就是沒幾幕山椒魚


  猶豫的朋友可以先看公視我們的島拍的山椒魚，個人覺得比本片好看



  尋找神話之鳥也是同類型的片，好看多了

  麥麥大概只能拍MIT這種等級的節目吧

