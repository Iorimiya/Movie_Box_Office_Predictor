url: https://www.ptt.cc/bbs/movie/M.1676630167.A.ADB.html
title: '[好雷]《山椒魚來了》凝視投擲於山林間的純粹'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~












  ＊我覺得每一個人的生命過程跟結果，早已經註定好了，你只是在這個過程當中，盡可能

  地

  去努力。——朱有田



  【麥導又來了】

  麥導的鏡頭總是對準著台灣獨特的樣貌。《MIT台灣誌》以906集探訪難以盡數的山嶺與人

  文，2009年上映的《黑熊來了》跟隨黃美秀團隊11載，捕捉台灣黑熊密切接觸的影像；此

  次我們見面的《山椒魚來了》，在高山溪澗間尋覓冰河孓遺特有種，花費17年才終於打磨

  完成。每每都驚艷於麥導對影像工程所投注的心力，我想那是與山相處的過程中，帶給他

  的無比恆毅與視野，也是一份給關注台灣土地人群的禮物。


  【山間的微笑精靈】

  山椒魚的認知度及關注度不如其他台灣特有種，如台灣黑熊、櫻花鉤吻鮭等，可能是還未

  登上鈔票版面之故。冰河時期，山椒魚藉由與亞洲大陸相連的陸橋繁衍至島嶼上，隨著氣

  候暖化，生存空間逐漸限縮至高海拔、潮濕的山澗區域，台灣的高山峻嶺也成為全世界山

  椒魚分布的最南界。從片中得知，共有五種山椒魚活動於全島的高海拔地區，彼此之間的

  基因交流不多，究竟為何會形成此種樣態，學術界尚無定論。中後段的重頭戲帶觀眾直擊

  山椒魚的繁衍過程，甚至對研究人員來說，這也是難得一見的觀察樣本，何其有幸可以輕

  鬆地觀看到山椒魚胚胎一寸寸增長，於卵串內雀躍轉動的身姿。見證了生之喜悅，同時也

  被輕輕提醒，全球暖化的現在進行式、人類足跡汙染山林等問題，已對台灣山椒魚生態產

  生直接的衝擊。


  【影像中，人的純粹】

  穿梭於山林中，彎腰翻動一塊塊石頭的研究人員，是本片的重要共演。觀影結束後，在心

  中留下深刻印記的並不是山椒魚的那抹奇異微笑，而是投身山林、低頭找尋山椒魚的身影

  。這是一趟傳承的旅程，投注了眾多研究者最純粹的專注。立於日治時期的調查基礎之上

  ，臺灣師範大學生命科學系呂光洋教授於1977年返台任教，即投入本島生態研究，而後選

  定兩棲類作為其研究主軸，帶領研究團隊發現數類新物種，貢獻卓越。最讓人動容的是，

  年齡已近八旬的呂教授，仍偕團隊上山，溯溪而上，彎腰翻動一塊塊石頭，儼然是屹立不

  搖的精神支柱。


  承接呂教授山椒魚研究衣缽的賴俊祥博士，兩人於2008年共同發表了兩個山椒魚新種，啟

  動台灣山椒魚的系統性研究。透過鏡頭，才知道原來學術界還持續地拼湊著對台灣山椒魚

  的理解。2016年6月，賴博士偕研究團隊及MIT拍攝團隊攀登奇萊北峰，為了越過中央山脈

  ，證實島嶼東側也有山椒魚的活動足跡；然而，路途還沒走到一半，山卻把賴博士永遠留

  在山裡了。在前半部分研究人員的對話之間，已經嗅到一絲悼念的情緒，直到後半將鏡頭

  自山椒魚轉向研究者，才知道那份懷念從何而來。


  主導研究的靈魂人物不在了，傳承的人握緊他交接過來的意志，讓人欣慰，也同時心疼。

  臺灣大學動物科學技術學系朱有田教授專長在研究高山活動的水鹿，一個恰巧的機緣下跟

  賴博士搭上線，決定利用團隊高山田調的能力，參與山椒魚的研究計畫。山難後兩個月，

  朱教授再次領導研究團隊上山，循相同路線，證實了台灣東側確有山椒魚的蹤跡，一償賴

  博士的心願。至今，朱教授仍持續推進山椒魚的研究前緣，建立了第一個山椒魚3D微電腦

  斷層骨骼造影，成為在影片開頭迎接觀眾的精巧動畫，並有望以此為基礎，開創新的山椒

  魚分類模式。期間，鏡頭捕捉下賴博士離去後的悲傷與懷念，而研究夥伴們仍走在他長遠

  目光凝視的路上。


  除了呂教授、賴博士、朱教授外，擅長穿梭山林而走入研究一途的助理們、眼神發光盯著

  卵串細究的林務局研究員、吞下阿里山山椒魚的車站工作人員、幾個鏡位簡單帶過的MIT

  台灣誌工作成員及高山嚮導們，片中每個身影都讓人珍視。不禁覺得這些因山椒魚而交錯

  的人生故事能被記錄下來，真是太好了。


  【生態紀錄與職人精神的完美結合】

  在山椒魚的故事之外，麥導不忘將山中美景帶給觀眾，尤其開頭大雪紛飛、冰雪遍地的畫

  面，讓人不敢相信這般景色就存在在台灣島上，再結合小巧的山椒魚靈動於其間，真的讓

  人感覺遇見了高山精靈。要拍攝到五種山椒魚，更不是易事，一次次踏過南湖、玉山、雪

  山國家公園等區域，每次出發都無法預料到是否能夠有所斬獲，更要面對天候變化的挑戰

  ，能於片中有如此多完美的山椒魚畫面呈現，背後皆是累積與堅持。


  在好好生活書店的深度專訪中，麥導提到，他是有意識地將人物結合進片中，因為一般人

  對山椒魚這個物種不熟悉，就不會有太大的共鳴；唯有把人跟山椒魚結合在一起，利用人

  跟人之間互相感應的能力，讓片中人物的喜怒哀樂創造出一種感同身受，更能拉近紀錄片

  與觀眾的距離。相當佩服麥導在敘事上的深思熟慮，不是一股腦想將生態硬知識塞給觀眾

  ，而是巧妙運用人的天性，在了解山椒魚的獨特奇異之時，也將他珍視的職人精神準確傳

  達到位。


  觀影尾聲，搭配著陳昇創作的輕快主題曲《Morni》，我用力盯著所有片尾工作人員及協

  力單位的名單，一一感謝他們為這部片的付出，心中迴盪著美好：又認識了一種台灣特有

  種，還有為此獻出他們生命與熱情的人們。


  陳昇 Bobby Chen【MORNI】『山椒魚來了』電影主題曲 Official Music Video



  --


  對喔，有中英文字幕'
