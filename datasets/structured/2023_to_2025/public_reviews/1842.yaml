url: https://www.ptt.cc/bbs/movie/M.1674907350.A.F9B.html
title: '[新聞]《山椒魚來了》首創登山口售票 獲粉絲及'
content: '《山椒魚來了》首創登山口售票 獲粉絲及山友熱情支持


  新聞網址：


  2023-01-25 17:42 經濟日報／ 記者宋健生/台中即時報導


  「MIT台灣誌」製作人麥覺明花17年拍攝紀錄片《山椒魚來了》，將於2月10日全台上映，


  團隊今(25)日來到台中大坑9號步道，舉辦別開生面的登山口售票活動，吸引來自全台各

  地的粉絲及山友們大排長龍搶著購票，並與麥導合影，大家相約電影院見。


  《山椒魚來了》電影展開「全臺北中南登山口售票」活動，今天上午開拔到台中的大坑9

  號登山口。這項國內電影界的創舉，稍早已陸續在新北市觀音山硬漢嶺、台北市象山、新

  竹飛鳳山及高雄柴山等地的登山口舉行，現場累計售出逾1,200張電影票。


  麥覺明曾以「MIT台灣誌」獲得多座金鐘獎肯定，長期關注山林跟生態議題的他，曾推出

  紀錄片「黑熊來了」，獲得超過千萬票房。這次推出新紀錄片「山椒魚來了」，則是記錄

  台灣特有種山椒魚的調查研究。


  「臺灣特有種山椒魚，第一次爬上大銀幕！」麥覺明說，雲霧深鎖的臺灣山區，有一種舉

  步輕緩、相貌奇特的小動物，牠們出現在億萬年前的地球上，看過恐龍稱霸地球，甚至經

  歷了恐龍大滅絕、人類誕生。


  麥覺明指出，臺灣面積不大，但在經過長時間的演化後，島上竟然有5種特有種的山椒魚

  ，牠們生活在中、高海拔的山區；而多高山的臺灣，成為全世界山椒魚分布的最南界，也

  是唯一分布在亞熱帶的小鯢屬族群，生態義意相當重大。


  麥覺明的電影鏡頭走入臺灣山林，歷時17年用文字和影像記錄長年奔闖在山之巔、水之湄

  的臺灣山林真英雄～山椒魚研究人員，將他們長年山裡來、水裡去的寂寞身影，製作成為

  色彩豐富、生命摯熱的文字和影像，讓不同年代、卻同樣來去山林的記錄者，看見前人的

  戮力以赴。


  《山椒魚來了》由歌手伍佰擔任電影敍事，陳昇為電影編曲及演唱。麥覺明指出，團隊一

  開始想說，歌手伍佰跟山椒魚都是台灣特有種才提出邀請，沒想到伍佰很快答應獻聲，也

  送出首次當電影旁白的經驗。


  麥覺明表示，由於「MIT台灣誌」停播，加上《山椒魚來了》沒有進行募資，整個電影的

  製作過程耗費鉅資，讓他第一次有想抵押房子來籌錢的感覺。還好團隊關心台灣生態環境

  議題的初心，獲得緯創人文基金會與天來文化藝術基金會的認同與全力贊助，終於讓這部

  電影得以順利完成及上映。


  另外，影片也獲得不少知名企業、機關團體及學校包場支持，包括華南金控、緯創集團、

  系統電子、米其林輪胎、群創光電、IBM、西門子登山社等，累計包場已超過50場次，反

  應熱烈。


  「MIT台灣誌」播出長達18年、共932集，是許多山友的最愛與共同的回憶，但節目於2019

  年底停播。麥覺明有一個「播千集、完百岳」的心願，據了解，這個心願已獲得知名企業

  允諾贊助，預料「MIT台灣誌」將可以很快重回螢幕。


  ----------------------------------------------------------


  「山椒魚來了」是MIT台灣誌導演麥覺明繼「黑熊來了」又一大銀幕作品 這部片除了山椒

  魚生態的影像紀錄外 還有研究山椒魚學者的研究生活 山椒魚的研究本來就是一個很艱難

  的主題 因為台灣的五種山椒魚全部瀕臨絕種 而且山椒魚的棲息地為中高海拔山區 研究

  者必須在山區調查 相當辛苦且危險 像電影裡提到的台師大賴俊祥老師於2016年跟MIT台

  灣誌團隊於奇萊東稜調查時不幸摔落山谷死亡


  這幾天也聽麥導說他很擔心票房 畢竟山椒魚不比台灣黑熊有名氣 搞不好民眾對於娃娃魚

  （大鯢）的了解還比山椒魚（小鯢）多 因此麥導一月時還到台灣各個郊山登山口宣傳和

  拉票 而且MIT台灣誌在中視停播 到MOMO台也不是常態性播出後 看到麥導作品的機會也變

  少了 對於快到60歲的麥導 我更珍惜他每一個新作品 也希望對於台灣生態有興趣 或是之

  前是MIT台灣誌的忠實觀眾們有機會能進電影院欣賞這部作品


  --'
