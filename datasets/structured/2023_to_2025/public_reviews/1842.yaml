url: https://www.ptt.cc/bbs/movie/M.1676188767.A.BBB.html
title: '[好雷] 《山椒魚來了》絕不冷場的紀錄片'
content: '對於紀錄片來說，要如何敘述一個故事讓觀眾有興趣，又不能讓事實紀錄本身失真，導演

  在敘事上必須要有相當的功力，這也是為什麼我覺得這部紀錄片拍的相當好的原因。


  從山椒魚可愛的型態動作，搭配著伍佰的旁白以及學者的介紹，然後穿插著山椒魚學者辛

  苦地尋找、記錄以及傳承 接下來進入山椒魚卵的孵化過程，搭配著節氣和花卉的畫面，

  讓觀眾一起隨著電影的時序推進，偶爾加上壯闊的高山風景，還有陳昇為這部電影作的主

  題曲，孵化的畫面一出來後，觀眾的期待很順利的轉化為感動。


  但接近片尾時，介紹了2016年那一次遺憾的事件，觀眾從生的喜悅，再轉折到死的感傷，

  但生命就是如此，像電影裡朱有田教授說的：人都有一個註定好的際遇，而生物也是如此

  ，生死間透過傳承而循環，從楚南仁博，呂光洋到賴俊祥以及朱有田接下來傳承到勝文柚

  子。山椒魚也如同他們的祖先冰河時期從遙遠的日本中國來到台灣一樣，不論在北大武山

  還是玉山阿里山南湖大山，不斷的繁衍傳承在台灣這個方舟上。


  這部跟麥導第一部紀錄片黑熊來了比起來，山椒魚來了的敘事技巧更為細膩，黑熊來了的

  敘事會讓人感覺像是MIT台灣誌的特別篇，但山椒魚來了則徹底擺脫了MIT的框架，不論是

  敘事還是轉場都更為流暢。


  星期六晚上6：30 高雄的環球影城，山椒魚來了被分到了只有四排的廳，一共來了20位觀

  眾，而電影結束在放工作人員名單時 大家都沒有離開座位 有的人衛生紙還放在手上 我

  想這就是對導演最大的致敬吧


  --'
