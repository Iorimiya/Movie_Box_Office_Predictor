url: https://www.ptt.cc/bbs/movie/M.1675746531.A.147.html
title: '[新聞] 麥覺明歷時17年蒐集 《山椒魚來了》記錄'
content: '新聞網址：


  【史前神獸紀錄片（上）】麥覺明歷時17年蒐集　《山椒魚來了》記錄億萬年生物影像


  文｜劉慧茹 2023.02.05


  金獎導演麥覺明繼首部生態紀錄電影《黑熊來了》，全台票房突破千萬元，今年開春再推

  出《山椒魚來了》。他隨研究團隊深入高山溪谷，費時17年拍攝，不僅呈現5種山椒魚樣

  貌及棲地生長的過程，也忠實記錄一群默默在野地工作的研究人員，敘事真切質樸，知性

  與感性兼備。


  2006年，麥覺明第一次接觸山椒魚，激起他記錄影像的欲望：「此前我對這個物種完全陌

  生，漸漸知道牠跟恐龍都生活在上億年前，是冰河時期孑遺生物。山椒魚棲地在很遙遠的

  高山，因為拍攝困難，對影像紀錄者很具挑戰。」


  山椒魚主要分布在西伯利亞、日本、中國東北等溫帶地區，台灣是山椒魚分布最南界。

  1919年日本學者楚南仁博在能高駐在所（今天池山莊）附近，首次紀錄到台灣山椒魚，加

  上近代學者的研究，目前證實台灣有5種：南湖山椒魚、觀霧山椒魚、阿里山山椒魚、台

  灣山椒魚和楚南氏山椒魚，皆為台灣特有種。


  和《黑熊來了》一樣，麥覺明只要有時間，就會上山拍攝，累積足夠素材，待適當時間推

  出。8年前他參與一項山椒魚研究計畫，隨團隊跑遍南湖大山、玉山、雪山等樣區，反覆

  在石縫底下翻找，有時上山2、3天只拍到一隻山椒魚，靠著長時間努力，終於蒐集到完整

  畫面。


  然而，2016年麥覺明與師範大學研究團隊前往太魯閣國家公園奇萊北峰，途中賴俊祥助教

  失足墜谷，讓團隊深受打擊。「大家都無心工作，撤退後仍有陰影。研究山椒魚的人本來

  就不多，一方面對失去人才感到惋惜，更憂心沒人能延續使命。」


  懷抱悲傷卻堅定的心情，2個月後由台灣大學動物科學技術學系朱有田教授領軍再出發，

  團隊不僅證實中央山脈以東有山椒魚存在，完成賴俊祥遺願，也將發現的第一隻活體帶回

  研究室做3D微電腦斷層骨骼造影，再將其送回棲地，為研究樹立里程碑。如恐龍般的骨架

  在影片開場呈現，讓觀眾驚呼不已。


  2020年3月研究團隊發現罕見的山椒魚卵串，成為影片殺青關鍵。麥覺明興奮地說：「連

  研究人員都很少看過，真的非常難得！」為詳盡記錄山椒魚成長狀態，他每週長途跋涉至

  3,000公尺高山，單是車程就得花5小時以上。


  卵串的膠質外膜，吸附在溪石底下，得翻開石頭固定才能拍攝，加上山區氣候多變，天晴

  時要撐傘防止曝曬，雨天得擔心水流沖刷，過程十分辛苦，只要拍到一點細微的動靜，麥

  覺明都會無比興奮。


  尤其，山椒魚孵化成微小的蝌蚪，一般攝影機無法清楚拍攝，麥覺明費了好一番功夫，找

  到生態紀錄片使用的微焦攝影鏡頭，能深入石縫及潛水區域，持續半年記錄山椒魚成長蛻

  變的過程。


  擔任監製的小野（李遠）看到卵串畫面時，激動落淚。麥覺明指出：「小野老師是師大生

  物系出身，知道卵串畫面有多難得，同時也深受研究人員堅持不放棄的熱血精神所感動。

  」影片結尾停在山椒魚的心跳聲，象徵熱愛山林的人為此奉獻，換得另一個生命的開始。




  --'
