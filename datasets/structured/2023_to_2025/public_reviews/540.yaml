title: '[好雷] 兄妹之地'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  以難民為題材的電影不少，像是《老橡樹酒館》裡英國的敘利亞難民與《白日青春》中香

  港的巴基斯坦難民。不過，這些多為聚焦單一角色的動人故事，而奪得日舞影展世界電影

  最佳導演獎的伊朗電影《兄妹之地》，則是透過三位主要角色的經歷，窺視伊朗的阿富汗

  移民普遍的生活困境。



  擁有「兄弟之邦」稱號的伊朗，收容來自不同年齡、性別，為數眾多的阿富汗難民，他們

  似乎難以在伊朗找到容身之處，只能淪為二等公民。在美國入侵的陰影下，一個阿富汗大

  家庭的三名成員作為難民，在伊朗開始努力生存，他們沒有意識到將面臨數十年的「家」

  鬥爭：一名年輕的青少年由於難民身分，必須忍辱負重被警察當成免費勞工，抓去做苦力

  ；一個因地理因素與世隔絕負責替伊朗富人幫傭的妻子，也是掙扎求生存的母親，為避免

  被遣返而每天步步為營；遲暮的一家之主為了家庭，獨自承受兒子在海外傭兵失蹤成謎的

  重擔，並守住家人犧牲的悲慘秘密。



  雖說《兄妹之地》是一部伊朗電影，但主角卻是阿富汗難民。擁有最多阿富汗難民的國家

  是巴基斯坦，但當地自己也是戰亂頻傳，而與阿富汗北部與西部接壤的塔吉克與伊朗，因

  為與阿富汗共享歷史、文化與語言背景，所以也接收很多阿富汗難民。巴基斯坦的官方語

  言為英語與烏都爾語，但是，塔吉克、伊朗與阿富汗都使用波斯語或其後裔。對打算逃離

  戰亂家園的阿富汗人來說，先進又沒有語言隔閡的伊朗自然成為首選，就像許多人追尋「

  美國夢」一般義無反顧地前進。



  電影以三章節的敘事呈現，分別講述穆罕默德、蕾拉與卡森的故事。他們來自同一個阿富

  汗的難民大家庭，互相都有出現在彼此的章節裡，排列上各相隔10年並按時序進行，分別

  是2001年、2011年與2021年。倘若這個大家庭在故事開始前便已移居伊朗，可能是在1990

  年代塔利班崛起並掌權的時期成為難民。這三個年份，對阿富汗來說意義非凡。



  2001年發生911事件，美國隨後發起阿富汗戰爭，塔利班遭推翻後，不少難民紛紛回國，

  但美國的介入也代表這時候國內仍舊處於交戰階段。因此，《兄妹之地》中的大家庭，顯

  然選擇繼續留在伊朗。2011年，美國在阿富汗鄰邦巴基斯坦找到賓拉登並擊斃對方之後，

  開始逐步從阿富汗撤離，這也是大量難民滿懷希望返家的關鍵時間點。2021年，則是塔利

  班的復辟，很多阿富汗人不得已只好再次離鄉背井，成為難民。



  《兄妹之地》的故事非常簡單，甚至能夠說是平鋪直敘地將這個家庭的悲劇告訴觀眾，但

  在我們從三名家庭成員的不同視角與三個不同的時間點窺見阿富汗難民生活的同時，導演

  也巧妙地運用一些構圖上的對比來彰顯他們身為「二等公民」的無奈與無力感。其中，最

  明顯的便是蕾拉與她幫傭的富人家庭之間的關係。雖然主人家待她與兒子不薄，將他們視

  為一家人，也經常致贈禮物，但當朋友來訪，幫傭仍然是幫傭。兩層樓的剖面圖，以地板

  為界，樓下是在禁酒的伊朗飲酒狂歡的派對人群，樓上卻是忍著丈夫去世的傷痛整理床鋪

  的蕾拉，一個屋簷兩樣情。



  由於難民證必須由庇護國或聯合國難民署核發，所以並非所有人都有辦法成為官方認可的

  「合法」難民。在穆罕默德的章節裡，卡森說道，假使蕾拉「有證」，就讓她去讀縫紉學

  校。雖說，1979年伊斯蘭革命後的伊朗，女性受教權大有影響，但比起塔利班掌權的阿富

  汗，伊朗的女權還是高得多。《兄妹之地》明確地帶出身為難民所會面臨的各種困境，長

  官有勞務需求被抓去當免費勞工，沒有隨身攜帶難民證也罷，就連帶著也還是無法倖免於

  難；未領到難民證者，若是離開或失去具身分的親屬，恐面臨遭遣返的命運；來到新國家

  已兩載餘，卻遲遲無法獲得公民身分，非得賠上生命的代價才能如願以償，「兄弟之邦」

  是否真的以手足之情對待這些離鄉背井的難民呢？



  以三章節敘事的《兄妹之地》中每一位角色都各自藏著一個不能對外人甚至家人道的秘密

  。穆罕默德連自己被警官隨意帶去當免費勞工都不敢向爸爸報告，何況是「幸運」獲得某

  個長官青睞後遭到侵犯的事情。只因為他「長得」不像伊朗人，就必須遭受與同為阿富汗

  難民的同學不一樣的遭遇，就連情商校長幫忙或隨身攜帶難民證都沒辦法解決，最後，穆

  罕默德想到第一天警官曾經交代下屬不能抓受傷民眾，因此，工藝技術出色的他為了逃離

  每天放學後的地獄，只好拿鐵鎚把自己的手掌敲斷。



  蕾拉的秘密是可以也應當對家人訴說的，她在第一時間就打電話給哥哥卡森，但礙於對方

  人正在阿富汗首都喀布爾，一時半刻也無法抵達蕾拉雇主位於海邊的別墅，只好告訴她保

  持低調，等雇主一家移民加拿大後，再行處理。但紙終究包不住火，丈夫侯山成天不出現

  ，蕾拉只好謊稱他被遣送回阿富汗，但暗地裡也想出一個計劃，對她平時餵養的流浪狗下

  藥，這樣就有埋葬狗屍的理由得以偷偷讓丈夫下葬。



  賠上兒子性命的卡森，本來還無法接受事實，畢竟除了兒子的死訊之外，還告訴他兒子其

  實一直以來都隱瞞自己前去擔任傭兵。即便家族抵達伊朗已經超過20年，還是沒能取得公

  民身分，兒子便有著以傭兵身分前往德國、土耳其等國家，最終入籍德國的夢想。沒想到

  ，他為伊朗捐軀是讓家人取得伊朗公民最快速的方法。得知噩耗的卡森，本想決定獨自承

  擔，不打算告訴年幼的女兒與聾人妻子，但在授證典禮的彩排會場，他再也忍不住潰堤的

  淚水，與妻子在公家機關冰冷的走廊上相擁痛哭，哀悼為他們換來公民身分的兒子。


  --

