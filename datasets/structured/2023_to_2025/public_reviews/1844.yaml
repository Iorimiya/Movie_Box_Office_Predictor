url: https://www.ptt.cc/bbs/movie/M.1726735023.A.042.html
title: '[ 好雷] 霍爾的移動城堡'
content: '防雷






































  感謝前面有人發文提醒了我該看了

  小時候在迪士尼頻道就看過一部分

  當時就對這棟破爛神奇的移動城堡充滿印象

  然後霍爾真的好帥啊啊啊啊啊啊！

  當然誠如前面文章所說的

  這部其實故事並沒有很完整

  有些地方的來龍去脈和一些設定沒有很清楚

  我個人看不是很懂荒野女巫的前後反差

  就算法力都沒了,整個氣勢都沒了還是怪怪的


  其他的我是還好啦,頂多反派沒那麼明顯而已

  如果能演個兩個半甚至三小時讓一切更完整

  我想評價會直線上升,可惜這樣又違背他的市場導向

  我說宮老啊,你可以學查克搞個導剪版啊

  雖然以上說的還蠻可惜,我還是覺得這是精彩的故事

  我很喜歡後面揭露霍爾和卡西法的關係

  以及有關於心的設定,星的畫面也很美

  然後霍爾真的好帥啊啊啊啊啊啊！（說第二次了

  看要用理性還是感性來看吧

  建議用後者更可以好好享受故事本身


  ----

  Sent from  on my Samsung SM-S9280


  --

  要是人生有五次就好了。

  這樣的話我五次都要住在不同的地方

  五次都要吃不同的東西吃的飽飽的

  五次都要做不同的工作

  然後五次都要，喜歡上同一個人


  --'
