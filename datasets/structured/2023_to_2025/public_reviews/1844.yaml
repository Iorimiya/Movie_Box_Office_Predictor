title: '[討論] 霍爾的移動城堡是評價很高?'
content: '因為有上網飛所以把這部剛看完，

  看完只覺得沒我以為的好看....


  看來我心中的吉卜力最好的還是

  神隱少女

  魔法公主


  先說本片，

  霍爾大概就是個外表華麗高高在上，

  但其實內心偏脆弱，

  但看他會出去應戰，

  好像其實也並不怎麼心靈脆弱


  蘇菲

  完全看不懂怎麼愛上霍爾的?

  這短短時間內有什麼能讓他愛上這男人的片段?

  抱歉....真感受不到

  但就突然愛上了是三小= =


  本片大概很多隱諭吧...

  但我覺得並沒表現得很出色，

  而且是不是很多時候只是觀眾自行強力解讀啊


  --'
