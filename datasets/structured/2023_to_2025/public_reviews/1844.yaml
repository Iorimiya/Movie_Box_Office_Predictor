url: https://www.ptt.cc/bbs/movie/M.1743059854.A.872.html
title: '[好雷] 霍爾的移動城堡(親子電影推薦)'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~











  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  圖文網誌版：


  (親子)電影推薦【霍爾的移動城堡】


  「霍爾的移動城堡」是宮崎駿20年前的動畫作品(2004)，雖然已經有點年代，故事情節卻

  非常有趣，大人小孩看了都會喜歡！


  故事設定在一個有魔法師的國家，男主角霍爾是天資聰穎卻吊兒郎當的巫師，女主角蘇菲

  則是手巧心善的普通女孩，但不幸中了荒野女巫的詛咒，變成一個老太婆，曲折巧合來到

  霍爾的城堡工作，希望霍爾有一天能夠為她解除詛咒，另外城堡裡有個可愛幽默的火魔「

  卡西法」，為故事增添很多有趣的橋段。


  荒野女巫因為作惡多端，被剝奪魔法，成為失智老人，蘇菲還願意照顧她真是太感人，而

  霍爾則是被國家徵召，使用魔法跟鄰國打戰，但最後有和平結束。


  故事的最高潮是在蘇菲的協助下，霍爾找回自己的本心，脫離邪魔的契約，而原來早在霍

  爾童年，兩人就有過一段緣分，多年之後的現在，老是愛互相爭鬥的彼此，終於確認彼此

  心意，歡喜冤家邁向幸福相守的結局。


  我覺得「霍爾的移動城堡」算是可愛又帶點浪漫的愛情故事，嘴賤男和悲慘女「追尋彼此

  」的過程。


  …………………………………………


  看完後我問小兒子喜歡嗎？他說：「喜歡，至少不會讓人掉眼淚，像回憶中的瑪妮就比較

  難過。」


  我最近帶小孩去安養院當志工，在電影中看到蘇菲照顧失智老人的畫面，格外有感，坐在

  輪椅上、戴著圍兜兜、等待別人服侍的老人，真實生活裡也是如此。


  宮崎駿動畫常見的幾個理念，像是「反戰」、「關懷老人」(「崖上的波妞」裡也是有一

  群老人)、「忠貞的等待」、「勇氣」等，不例外的又在「霍爾的移動城堡」中出現。


  蘇菲她在劇情中，偶爾會從老態變回年輕，似乎是因為她突破怯懦的個性，勇敢去做了某

  些決定，印證荒野女巫告訴她的「這個詛咒，妳必須自己解開」，這個轉變的處理很細緻

  ，我跟孩子們分享時，大兒子說：「哦！這個電影有很多象徵手法耶！」他能如此分析，

  讓我很驚訝也很感動。


  和孩子一起看電影，最棒的優點就是彼此有共同話題，年紀大一點的能夠一起賞析，「親

  子同樂、親子共學」大人小孩都有收穫。


  就像那天我把瓦斯爐的火關掉，小兒子在一邊開玩笑說「卡西法死了」，我也忍不住大笑

  了。


  …………………………………………


  「霍爾的移動城堡」並不是宮崎駿的原創故事，而是改編自英國黛安娜、韋恩、瓊斯的原

  著小說，瓊斯的作品在英國，受歡迎程度其實不亞於「哈利波特」哦！


  為了瞭解細節，我特地把小說看完，書中還特別收錄作者對於自己作品被改編成日本電影

  的評價，她說有些和她想的完全不同(例如城堡的樣子)，有些改編則很驚喜。


  我看完小說，發現宮崎駿幾乎把故事改了一半以上，例如原著中，荒野女巫並沒有成為失

  智老人，情節也沒有著墨於國際戰爭，蘇菲兩個妹妹的故事也沒有呈現(有點可惜)


  如果你也喜歡「霍爾的移動城堡」，建議可以看英國原著小說，有更多趣味細節在裡頭！


  (台灣有兩個翻譯版本，早期翻譯的「魔幻城堡」字句較文雅，後來翻譯的「霍爾的移動

  城堡」較淺顯白話，也才有收錄作者對改編成電影的感想。


  對，我就是這麼無聊，兩個版本都有看。)



  最後分享，傲嬌的霍爾，在小說中最後跟蘇菲告白時，兩個人是這樣對話的：


  「我想我們應該從此過著幸福快樂的生活」霍爾說。


  蘇菲覺得他是真心的，而她也知道，如果要跟霍爾「從此過著幸福快樂的生活」，他們的

  生活會比任何故事都還要充滿變故，但她已經下定決心試試看了。


  霍爾又說：「會有很多驚險的事。」


  「你還會剝削我。」蘇菲說。


  哈哈哈，兩個人就像這樣，從相遇到最後都在鬥嘴，真的好可愛、好有愛的感情！


  --

  列入清單

  親子電影不限題材

  我家小朋友不是幼兒，所以只要不過度沉重、能共同討論劇情的電影，

  我覺得都能稱之為親子電影~


  認同~

  很有趣的類比

  我倒是看了原著之後，更覺得電影改編很有宮崎駿的風格

  反戰是很明顯的理念

  一起帶孩子看更多有意思的電影^^'
