content: "《霍爾的移動城堡》台版限定海報亮相\n\n2024/07/31 05:30\n\n\n方序中與董十行再度聯手，打造追尋的霍爾（左）、勇敢的蘇菲台灣限定海報。\n\
  （甲上提供）\n\n〔記者鍾志均／綜合報導〕宮﨑駿奇幻經典鉅作《霍爾的移動城堡》將於暑假壓軸在台上\n映，片商力邀三金設計師方序中與知名插畫家董十行再度聯手，打造全球獨家台灣限定海\n\
  報，分別為「追尋的霍爾」與「勇敢的蘇菲」，當中埋藏各種寓意的彩蛋等待吉卜力迷來\n發掘。\n\n《霍》片在日本上映時狂賣196億日幣（約台幣41億元），全球席捲近80億台幣驚人票房\n\
  ，僅次於《神隱少女》，位居全世界最賣座的吉卜力電影亞軍。\n\n談及海報設計理念，方序中表示動畫迷人之處就是能在奇幻浪漫情節中和現實生活互相對\n應；其中「追尋的霍爾」像是角色卡西法從中心散發出溫暖的光芒，給予霍爾相信自我的\n\
  力量；「勇敢的蘇菲」則象徵無懼世界如何改變，主角堅毅自信的望向前方。《霍爾的移\n動城堡》數位紀念版於8月22日全台上映。\n\n--\n\n 是菩薩成佛之道\n\
  \        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
