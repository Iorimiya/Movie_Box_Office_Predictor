content: '因為最近跟Loewe聯名才重看一次


  重看之後才發現劇情真的是到處莫名其妙


  霍爾到莎莉曼夫人出來前根本沒有甚麼描述


  角色塑造的莫名其妙很平板


  就因為如此蘇菲愛上霍爾整個也是更尬


  在去王國之前她也只看過霍爾三次


  一次街上第二次吃飯第三次髮色發病


  三段霍爾出場時間加起來不知道有沒有超過15分鐘



  跟荒野女巫之間的愛恨情仇也是很硬要



  長大之後看發現這故事的起承轉合問題蠻大的==


  很像跟我看EVAQ一樣少看幾集



  --



