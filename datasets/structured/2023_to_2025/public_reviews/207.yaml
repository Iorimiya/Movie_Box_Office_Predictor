url: https://www.ptt.cc/bbs/movie/M.1756051000.A.B8E.html
title: '[負雷] 壞蛋聯盟2'
content: '問題簡單的說

  為了拆CP很粗暴的毀掉兩個角色

  如果沒有追第一部可能就沒有這種包袱


  第一部除了橘子果醬主線

  狼的感情線主要有兩條

  一條是要挽回和老蛇的友情

  一條是和州長狐黛安的曖昧


  所以二創幾乎都圍繞這兩個主題

  不是蛇和狼的重口味福瑞

  就是狐攻狼受的公主抱


  那麼第二部做了什麼改動？


  首先給老蛇加上戀愛腦屬性

  全程都在對新登場的鳥發情

  因為這個還連續兩次拖累隊伍


  這震撼就像前作的孤僻怪老頭

  變成色咪咪性騷擾龜仙人一樣


  他保證不會再有任何CP問題了

  因為他除了鳥就沒有出現過一對一連貫對話


  然後黛安

  就像製作組藉狼先生之口說的一樣

  州長不能和路邊的小混混交往


  所以製作組的解法不是她排除萬難迎娶狼先生

  而是讓她不再是州長


  讓她身敗名裂

  前半生的努力和人生全部成空

  她再也不能去以前去的店

  也不能再用黛安這個名字了


  而且反轉的時間點太差

  大家想起前州長想到的也不是假死事件

  而是她原來是小偷啊


  她犧牲這一切

  就換得一個正式加入小隊的機會

  是的

  她現在是團隊裡的女一了

  不會再有任何人懷疑她跟狼先生是一對了


  就有一種怖悲感

  為什麼這麼努力生活的人

  最後是這種下場？

  就為了結婚嗎？


  如果是以前的夢工廠

  她最後應該會攔截或平反影片

  當上狼先生的上司才對

  這一段真的非常不夢工廠




  --


  原作老蛇只有和狼的友情線

  更不存在什麼色老頭

  這是童書啊


  原作狐狸只有緋紅之爪那個部份

  州長黛安是為了向狼先生證明努力就能成為一個好人

  動畫加上去的

  當時還是宣傳重點之一


  然後第二部就變成這樣了'
