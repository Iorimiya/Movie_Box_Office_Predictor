url: https://www.ptt.cc/bbs/movie/M.1753782335.A.1FB.html
title: '[好無雷] 壞蛋聯盟2'
content: "中午看完超喜歡\n應該是夢工廠在鞋貓劍客2後最強的打戲作畫\n尤其是最後在特殊環境下對決的橋段很驚艷\n團隊成員的合作互補讓五人都能發揮所長\n\
  營造笑點的手法雖然重複但每次都能讓人笑出來\n劇情緊湊節奏明快 配樂也很搭\n也有帶入些許更生人跟善惡的議題\n是部大人小孩都能同時享受的動畫\n但畢竟是動畫當然劇情不太科學但都還算合理\n\
  \nScreenX的畫面很多值得一看\n特別是在預告中火箭那幕跟更後面的畫面非常合適\n然後毛茸茸的狼跟狐真的很令人不獸控制\n\n我是直接看2\n不影響劇情理解\n\
  但是會被劇透到第一集的怪盜身份跟幕後黑手QQ\n早知道昨天晚上就先看一下1\n\n--\n\nSent from \n\n--"
