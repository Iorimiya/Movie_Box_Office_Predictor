url: https://www.ptt.cc/bbs/movie/M.1754238473.A.5FD.html
title: '[好雷] 壞蛋聯盟2 比預期更驚豔'
content: '今年初剛看完壞蛋聯盟1+2短篇


  評價也就普普，是還及格的娛樂片


  今天週末天氣特別好


  於是就去商場閒逛看一場電影


  記得板上貼的壞蛋聯盟2爛番茄評分頗高


  就選擇這一部



  前半段沒有什麼值得一提


  從火箭發射開始開始進入高潮


  看著主角群奮力往貨艙前進


  感覺全身血液跟著點燃起來


  在太空中的場景更是美輪美奐


  跟地心引力相比毫不遜色


  當黃金渦流滿佈整個螢幕時更是令人嘆為觀止


  光看這幾十分鐘就值回票價


  整部片雖然沒有觸動人心的情感核心


  但精彩程度屌打地球特派員


  強烈建議各位進戲院欣賞



  結局直接舖梗會有後續發展


  希望票房能好到出第三集電影


  而不是直接用電視劇集草草了事



  --'
