title: '[ 普微雷] 壞蛋聯盟2：傻笑看就好'
content: '壞蛋聯盟2是壞蛋聯盟續集，講述壞蛋聯盟碰到一群女性犯罪組織，他們要再度當好人拯

  救世界


  其實光是預告就透露很後面的劇情了，壞大貓登場已經超過一半的時間，感覺這部隨時都

  發生很多事情，特效沒在手軟

  但是第一集那種鬥智沒出現了，笑點給小孩笑應該可以，我這場有不少人笑的很開心，但

  是總感覺不到一個角色成長曲線


  最後甚至鋪陳續集，感覺不是很期待了


  --

  分篇噓會水桶'
