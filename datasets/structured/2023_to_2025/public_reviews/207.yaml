url: https://www.ptt.cc/bbs/movie/M.1755665695.A.112.html
title: '[新聞] 夢工廠《壞蛋聯盟2》上映19天後已線上發行'
content: "夢工廠《壞蛋聯盟2》上映19天後已線上發行\n\n【大紀元2025年08月19日訊】（大紀元記者葉子杰編譯報導）截至當地週日（17日），夢\n\
  工廠的《壞蛋聯盟2》上映第17天，全球票房收入為1.17億美元。環球影業宣布該片將於\n19日起線上發行，成為該公司最快從影院到數位平台發行的電影。另外，10月將實體發行\n\
  。\n\n《壞蛋聯盟2》（The Bad Guys 2）劇照。（UIP提供）\n\n據《ComingSoon》《TwistedVoxel》報導，《壞蛋聯盟2》（The\
  \ Bad Guys 2）的全球票\n房收入約為1.17億美元，其中北美票房5,720萬美元，其他國際市場收入為6,070萬美元。\n一般動畫片通常在戲院上映較長時間後才會轉為數位發行，但該片北美上映19日即可在北\n\
  美「優質／高端隨選視訊」PVOD（Premium Video on Demand）和Prime video等線上租借\n或購買影片，創下了最快上線的紀錄。\n\n\
  \n《壞蛋聯盟2》（The Bad Guys 2）劇照。（UIP提供）\n\n除線上發行外，環球影業將於10月7日在北美發行4K超高清、藍光和DVD版本。影片將附帶\n\
  獨家的額外內容《小謊言與不在場證明》花絮，在這部短片中，壞蛋們遲到了10分鐘，向\n假釋官講述了他們混亂的一天。另外，還有從未公開的精彩內容，包括刪減片段、錄音棚\n\
  精彩瞬間、與電影製作人一起學習人物素描教程等等。\n\n在夢工廠動畫備受讚譽的爆笑動作續集中，故事描述一群頂尖動物罪犯團隊如今已改過自\n新，正非常非常努力想變成好人，卻意外被捲入一場高風險、環球追逐的搶劫計畫，而這\n\
  一切皆由一支全新犯罪團隊「惡女聯盟」策劃，是他們從未預料到的對手。\n\n\n《壞蛋聯盟2》（The Bad Guys 2）劇照。（UIP提供）\n\n在評分方面，美國網路電影資料庫（IMDb）和影評網站「爛番茄」（Rotten\
  \ Tomatoes）\n是評估電影好與不好的參考依據之一。IMDb滿分為十分，截至今日，《壞蛋聯盟2》獲得\n觀眾7.2的普通佳評，前作則獲得6.9分；爛番茄影評員與觀眾分別給予87%及95%的新鮮度\n\
  好評，前作則分別獲得88%及93%。\n\n據報導，儘管《壞蛋聯盟2》的全球票房尚未達到前作的2.5億美元票房，但其票房已超過\n8,000萬美元的製作成本，且隨著評論普遍偏向正面，加上強力的家庭影音發行計劃，這\n\
  部電影似乎有望透過數位和實體平台與第二波觀眾互動，進一步擴大其影響力。\n\n責任編輯：蘇漾\n\n\n\n--\n                 \n  \
