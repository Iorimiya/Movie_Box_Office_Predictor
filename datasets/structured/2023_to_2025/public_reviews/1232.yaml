title: '[好雷] 壞教慾女孩'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  改編自丹麥1930年代的真人真事黑歷史，《壞教慾女孩》講述當年對社會底層女性的壓抑

  與優生學觀念造成的可怕後果。就像當年被迫絕育的上萬名丹麥女孩一樣，不是每個人的

  故事結局都很美好，電影帶領觀眾認識當時丹麥女孩的處境與無奈。



  「妳們都沒有夢想嗎？」



  剛過二八年華的17歲，理應是夢想奔馳的年紀，但在1930年代的丹麥，如果行為舉止沒有

  符合社會期待，便會被貼上「不守婦道」的標籤。對主角瑪倫來說，她的青春是受禁錮的

  年代。被安置到史葡格島上的女孩，或被判定為敗德，或被認定為智能不足，但從片中的

  互動能夠判斷，她們多數沒有智力問題。瑪倫問其他婦女之家的夥伴，難道她們都沒有夢

  想嗎？看來最年長的卡拉只想回家，可能是唯一有智能障礙的伊莉絲想要學做漂亮洋裝，

  瑪倫還說她可以當模特兒。



  看似乖乖牌的索琳咕噥著自己沒有夢想，但其實她希望自己在來到史葡格島前產下的女兒

  能夠回到自己身邊。真正從頭到尾都沒有提到夢想的是瑪倫，她只想快樂地生活、做自己

  。雖說瑪倫上班常常請假、遲到，但她並非不想工作，只想玩樂，而是瑪倫嚮往活在當下

  、自由自在的生活，這當中也包括性自主，無拘無束的情慾流動才是她奉行的理念。



  其實，與其說瑪倫是主角，角色成長明顯，前後態度大轉變的索琳才更像主角。瑪倫一來

  到史葡格島，索琳就被指派為負責幫她適應環境的室友，舉凡全員到齊才能坐下、開動，

  衣服脫下要摺好，索琳都像是訓練有素的糾察隊，宛如一個口令一個動作一樣地做到完美

  ，她也一一轉達給瑪倫。瑪倫也並非叛逆地不論索琳說什麼都要反駁，但思想還沒被修剪

  地有稜有角的她，還保有批判性思考。聽到可以自己製作洋裝，而且形式不拘，瑪倫便興

  奮地打算利用自己的裁縫長才製作比較漂亮的樣式，而索琳還絲毫不解為什麼不做簡單的

  樣式就好。



  從一開始認為所有來到史葡格島的女孩都需要幫助，以至於面對瑪倫的「不想要人幫」措

  手不及，掉下無助的眼淚，在與瑪倫相處的過程中，索琳慢慢長出捍衛自己的堅定與決心

  ；從第一次聽到瑪倫密謀劫持船隻逃跑，跑去打小報告，到最後看不下去失去女兒的瑪倫

  心情低落，而主動詢問伊莉絲是否真的會開船，索琳漸漸找回那個「叛逆」的自我。瑪倫

  與索琳一開始互看不順眼，朝夕相處之後不但建立起深厚的友誼，還由於同樣經歷與女兒

  分離的痛苦，喚醒她為自己爭取權益的勇氣，最終也成功與女兒重逢。



  片中提到的新絕育法與史葡格島女子收容所是納粹德國的優生政策下的產物，不管是底層

  社會還是智能不足的女孩未婚懷孕，都會被送到這裡。反骨的瑪倫在道德警察與兒福機構

  關切之後，面對精神科醫生的問話她一概不理，大概覺得那些問題污辱自己的智商，但事

  實是，即便瑪倫當時認真回答，她應該還是會因為不守婦道被送往史葡格島。這個「判決

  」說好聽是「治療」，但其實跟服刑也沒什麼兩樣，只是比較自由而已。雖然婦女之家的

  負責人聲稱，只要大家表現好就有機會在機構監管下回本島去擔任家庭幫傭，但就連表現

  最好的索琳都已經在史葡格島上待六年，究竟何時能夠回家真的是遙遙無期。



  即使成功獲得工作，也必須先接受絕育才能回歸社會。對當時的丹麥社會來講，這些未婚

  懷孕的女孩產下後代之後，最好不要再讓他們有機會懷上另一個孩子，這就是優生學的概

  念。《壞教慾女孩》的情節已經夠令人難過，還好索琳最後是到好人家去擔任家庭幫傭。

  索琳告訴奶奶自己終於可以脫離機構監管的時候，奶奶的喜悅真的非常真心，也不會覺得

  以後沒有人服侍自己，而且根據奶奶的話，她應該也是思想比較自由的女性，所以才會被

  媽媽說不要多話，幸好她先生不在意，因此聽到索琳能夠自由地回歸社會，奶奶發自內心

  為她感到高興。



  除了《壞教慾女孩》之外，2019年的另一部丹麥電影《懸案密碼 第64號》也觸碰史葡格

  島女子收容所這段黑歷史。不同的是，《壞教慾女孩》比較著重在女子收容所內的生活與

  當時的女孩如果奮力抵抗會是什麼樣子，而《懸案密碼 第64號》由於是改編自同名小說

  ，所以除了忠實呈現史葡格島的段落之外，大部分的篇幅還是分配給犯罪推理的橋段。不

  過，對於想要了解史葡格島歷史的影迷來說，兩部電影都可以達到同樣的效果，也是彼此

  很棒的延伸閱讀。


  --

  Viola''s World：Screen Scream影迷尖叫屋


