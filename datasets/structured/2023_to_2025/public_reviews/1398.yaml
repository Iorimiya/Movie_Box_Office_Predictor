title: '[問片]  一個肥宅經常被欺負，突然被外星人附身'
content: 'Hi 各位神通廣大鄉民們，


  早安！您們好，我這邊有一部找尋很久的洋片。


  是我小時候看過的，本魯年紀40好幾了。


  這部片大概是國小升國中時期看過的電影吧。（印象中）


  劇情開始：


  就是一個肥宅，在學校一直都被欺負，也沒有女生喜歡他。


  突然有一天好像被外星人附身？他頭上會忽然長出一個像ET的東西？


  重點來了！！！


  當女孩們看到這東西，就會暈頭的想跟他做愛？


  What？？？這對我小時候衝擊很大，印象很深刻的一幕。


  他還有一幕跑去偷看啦啦隊洗澡，結果不小心從天花板掉下去，整浴室的妹仔，追著他跑

  。



  記憶大概到這兒左右。跪求神通廣大的鄉民們，幫魯叔找找，雖然這種劇情在現今SOD系

  列到處皆是，但魯叔還是想回憶一下小時候的衝擊回憶。謝謝大家。


  --'
