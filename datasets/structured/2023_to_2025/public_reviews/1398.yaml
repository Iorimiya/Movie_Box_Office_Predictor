url: https://www.ptt.cc/bbs/movie/M.1432871395.A.484.html
title: '[新聞] 召魂附身牽魂陣，惡魔全面回應《叫魂》'
content: '新聞網址：


  人們對未知的靈異現象與形體總是有著想一探究竟的好奇心，以致於召魂儀式時有所聞，

  坊間也有許多人對於邪惡神秘力量產生崇拜，進而走火入魔。幾位好友來到傳說中的凶宅

  想與找尋鬼魂的真相，沒想到請鬼容易送鬼難，邪惡猛鬼的力量遠大於他們所能想像。



  小鎮上，五個好友一同慘死在一間空屋內，唯一的生還者聲稱，是這房子殺了她們，幾年

  後，這位發了瘋的生還者亦不幸病死…2014年，六個好友為做實驗來凶宅「召魂」，透過

  並透過自拍攝影記錄下一切，沒想到竟然請鬼容易送鬼難…接二連三發生的驚悚事件，讓

  好友們一個個被詭異虐殺，唯一的「生還者」，得向警方解釋這一切，並透過拍攝的影片

  找到兇手，只是這些透過「牽魂陣」被召來的魂，除了想要被看見，似乎更想要找人陪…



  在史料的記載中，召魂儀式起源非常早。死者親屬要從前方升屋去召魂，手拿死者的衣服

  面北呼叫，如果死者是男的，就呼名呼字，連呼三聲，以期望死者的魂魄返回於衣，這件

  「衣服」被人所穿著，染上了人的肌膚香澤，有著肉體和氣息的雙重聯繫；魂魄也許會被

  它所吸引，依著熟悉的味道或形狀而歸附回來。

  「附身」，是一個超自然概念，意指活人的軀體被超自然靈體（如惡魔、神、先人的靈魂

  等）暫時性操控，因此表現出一些與平日相異的行為。附身的概念可見於許多宗教、神話

  及民間傳說中，如靈媒、乩童；當靈體被認為是邪惡的時候，就是俗稱「鬼上身」。被附

  身之人會表現出精神失常有如精神病患者，自言自語，眼目兇狠，折磨自己，傷害他人等

  反常行為。

  在宗教尚未出現時，人們崇尚自然崇拜，不僅對於大自然力量深感畏懼，進而衍生出許多

  代表著天地萬物不同的符號與陣法，而人們更是相信透過符號的神秘力量能讓兩個不同世

  界（陽界與陰界）相連與溝通。其中「牽魂陣」就是古時候異教徒與惡魔溝通開啟陰陽兩

  界之門的陣法，透過陣法開啟結界，讓陰陽兩界的人能溝通，但是後果也可能因為邪靈的

  強大力量讓人們跌入萬劫不復的深淵。


  《叫魂》為恐怖片鬼才導演溫子仁的最新編劇，一部探討因召魂、邪靈附身導致抓交替及

  虐殺等令人意想不到後果的故事，溫子仁不同於以往的作品，《叫魂》驚悚的劇情加上強

  烈的音效搭配與節奏掌握，超越了《陰兒房》、《厲嬰宅》的鬼魅氣氛與空間顫慄。此外

  ，故事中的精彩轉折，與意想不到的劇情走向，亦讓本片在恐怖驚悚之餘更多了分懸疑。


  --'
