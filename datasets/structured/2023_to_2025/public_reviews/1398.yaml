url: https://www.ptt.cc/bbs/movie/M.1457883560.A.785.html
title: '[新聞] 狐仙附身匈牙利正妹 剋死7位追求者'
content: '新聞網址：


  網址有圖，算正嗎？


  自由時報

  〔記者盧家豪／綜合報導〕混合了日本元素的奇幻黑色喜劇《狐仙麗莎煞煞煞》由歐洲女

  星莫妮卡貝瑟飾演一名熱愛日本文化的女看護麗莎，只要對她有好感的男性通通會死於非

  命，在一連害死7個人後，麗莎不禁聯想自己是不是被日本狐仙附身了。


  電影時空設定在70年代的布達佩斯，並融合大量的日本元素，畫面鮮豔綺麗。描述單純天

  真的麗莎過著平淡的生活，多年來貼身照顧日本大使的遺孀並和她學日文，她不但把日本

  言情小說當成聖經，還有一位幻想出來的日本演歌歌手朋友；就在30歲生日這天，她決定

  開始尋找真愛，但接近她的人不是吃了麗莎煮的菜噎死、幫麗莎撿手帕被公車撞，就是對

  她吹個口哨便失足墜樓，她不禁猜想自己是日本傳說中會帶來厄運的狐仙。


  國外媒體還讚譽本篇為黑色喜劇版的《艾蜜莉的異想世界》大受好評。女主角莫妮卡貝瑟

  也憑著本片連續奪下兩項奇幻影展的影后，2016年也將有多部作品釋出，星途一片看好。


  --


  電影預告：


  --'
