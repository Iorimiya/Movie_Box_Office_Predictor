title: '[好雷]《驅魔直播》看直播的我們都被附身？'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  本來只想週末夜晚看部紓壓恐怖片，追求刺激感，殊不知除了可怕還有驚悚，讓我想回味

  一下這部片。


  驅魔片常見的儀式都沒少，但最特別的地方在於直播時間有所限制，那種壓力和緊張感讓

  我也不敢呼吸。


  就在麥斯和德魯好不容易找出惡魔名字，才發現一切都是騙局，所謂惡魔百科全書根本沒

  有這個惡魔，而是想藉由直播讓這股邪惡力量滲透到全世界，讓更多人隨機被附身，這是

  我覺得最有趣的切入點，我們追蹤的直播會不會有一天也被惡魔操控，而大家都被附身？



  因為直播讓人感同深受，所以面對惡魔的恐懼也被放大了，加上特效和音效都做的太好，

  導致我全程抓住我朋友的手才不至於逃出電影院QQ




  --'
