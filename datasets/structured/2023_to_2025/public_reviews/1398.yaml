url: https://www.ptt.cc/bbs/movie/M.1421384073.A.C46.html
title: '[普雷]〈鬼附身〉的後座力超強'
content: '片名：〈鬼附身〉(Exeter)

  導演：馬庫斯尼斯佩爾

  編劇：夏娜費絲特、喬登羅伯斯

  演員：布萊德迪爾、史蒂芬朗恩、布蘭妮柯倫、蓋琪葛萊莉、凱利布蘭茲



  先來個防雷頁！

  這次會爆的雷不多，不過如果你不想被爆雷還是先出去吧！

  等看完電影再來看你感覺到的是不是跟我一樣吧！





  ============防雷頁============




  (正文開始)


  這一次的心得從看完之後的感覺開始寫好了！從電影院走出來之後，身體還充滿了影片所

  帶來的不舒服，有種反胃、想吐的感覺。即使在西門町繞了大概三、四十分鐘，不過只要

  想起影片裡的片段還是會相當不舒服，不知道是我的抵抗力太弱、還是該說是電影所營造

  的驚悚與恐怖氣氛實在太成功了。


  全片的開頭是男主角-派翠克和威康神父在整理廢棄的空屋為開頭(請原諒我分不出來哪一

  個角色是由哪一位演員所飾演)，然後在陰錯陽差之下變成一群人在廢棄的空屋開趴狂歡

  ，但是面對這過去流傳各種恐怖傳說的空屋，這些年輕人全都不以為意一路玩到了天亮。

  天亮之後，包含男主角之內還有六個人繼續在狂歡，從俄羅斯輪盤到真心話大冒險，甚至

  玩起了招喚鬼魂的遊戲，卻也因此不小心惹禍上身，讓同行的友人被鬼魂附身，拉開一切

  事件的序幕。


  整體而言，這是一部劇情非常複雜的驚悚片，然後夾雜了大量的血腥畫面，因此被嚇完之

  後就會忘記掉了一些劇情的細節。所以如果想好好看懂這部複雜的驚悚片，不只要能抵抗

  的住突如其來的驚嚇、還要可以忍受各種噁心的宰殺場景。當然如果你不想去思考這些麻

  煩的劇情，想單純好好被嚇也是可以的。

  只是影片有些老梗的部分，像是探索空屋時常會有黑影衝過、或是突然衝出來人嚇人的那

  種，不過老梗雖老梗，但確實也是因為這樣所以營造了很不錯的恐怖氣氛。而本片也有一

  些讓人無法忍住、會不禁大笑的場景，像是某位角色的死亡就讓同場的眾人一起大笑，因

  為那根本就是一場意外，死因大概要是自己嚇自己造成意外身亡吧！

  不過雖然說電影內容具有靈異成分內容，所以有些所謂的科學邏輯可以無視，但還是有些

  部分的感覺不太合理。像是羅瑞被附身之後竟然有一幕是瞬間掙脫綑綁來把一個持槍者的

  頭直接扭斷，可是下一幕卻又重新綁回去的狀況；過程中應該沒有人有勇氣把他綁回去吧

  ，那為什麼被附身的羅瑞沒有出來大開殺戒，反而跑回去把自己綁起來？而且那個頭被扭

  轉180度的人竟然還可以自己走出房間，然後才跪倒、開槍把自己的頭打爆……


  總之，如果是以小品電影的標準來看，這是一部氣氛安排不錯的電影！不過血腥的成分感

  覺比靈異的成分多一點就是了，因為過程那些殺人、死亡的方法實在太不舒服啦！


  --

  來自冰封地層中~

  一根漂浮的純白羽毛!


  Blog:＊～冰羽天地～＊




  --'
