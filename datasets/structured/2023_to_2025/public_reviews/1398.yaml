title: '[問片] 惡魔為了解放撒旦附身連續殺人的片'
content: '很小的時候在電影台看過的一部片子


  劇情大致上是講一個人，忘了是警察還是教堂派的使者，在調查連續殺人案


  後來發現是都是惡魔附身在人的身上所犯下的案件


  這些惡魔附身人的方式，是只要跟一般人對看到眼神，就可以成功附身到下一個人身上


  為了殺死惡魔附身的人，必須要破壞他們的後腦勺


  印象中主角的武器好像是一個拳套上面還附有凸刺，可以刺入被附身人的後腦


  惡魔好像為了召喚出它的老大---撒旦，必須要找到擁有解放撒旦鑰匙的女主


  而主角就一路拼死保護女主，最後好像女主還是被帶到關撒旦的一座複合鎖的大門外


  撒旦還變成女主親人(老爸?)的模樣來誘惑她開啟門鎖


  結局差一點點就要打開最後一把鑰匙鎖了......



  小弟的印象就大至上只能記這麼多



  不知道有沒有哪位版友能解答這部片名的 >"< 感激不盡!!!




  --'
