title: '[負雷]《鬼附身》，B級鬼片既定公式。'
content: '部落格版：


  話先說在前頭，我是一個非常愛看鬼片的人（雖然很怕卻又愛看），對鬼片算是滿挑的，

  加上近幾年的各國鬼片不斷讓觀眾失望（連被受期待的安娜貝爾我都看到快睡著），說真

  的，光就今年好了，我還真的找不到一部滿意的鬼片，當然，包含這部《鬼附身》也是。

  基本上這部作片依舊擺脫不掉鬼片陳年老梗：愛玩的屁孩、出過事的屋子、不信邪、喚靈

  儀式...，老梗是一回事，可惜的是這部片徹頭徹尾的鬧，莫名其妙的發展，跳太快的節奏

  ，比起其他鬼片，等級更是略顯低落了一點。


  而在觀賞試片會前，有工作人員進場叫在場的人希望不要透露結局給還沒看的觀眾，因為

  他這樣講讓我在開始前滿期待結局的部分，至於結局的部分我今天就省略不講了。


  OK，回到正片部分，電影開頭就是男主角派翠克的白目胖子好友諾樂斯提議要在即將改建

  成青年活動中心的廢棄大樓開趴踢，而這個廢棄大樓多年前是一個類似醫療機構（或者其

  他）的地方，專門照顧治療一些有心理障礙的兒童，只是後來出事了，所以這棟大樓就廢

  棄了（後來有說是被人蓄意縱火燒毀），聰明的人都知道像這種特別陰的地方都不要去，

  偏偏就是有人白目不信邪跑去，就這樣我們看到一群屁孩在裡面開趴、嗑藥、喝酒抽菸等

  等，而到了尾聲留了幾個人下來續攤，其中包含了派翠克、諾樂斯、阿卓、安柏、布萊德

  、羅瑞以及女主角。其實他們都知道這棟大樓以前發生了什麼事（網路新聞都有），卻還

  是瘋了似的玩起人體漂浮的儀式，可能是儀式本身出錯，或者是其他原因，總之可憐的羅

  瑞就被附身了（滿像中邪的）。


  之後就開始一連串的事情發生，一下是羅瑞被附身、一下又跑道安柏身上、後來又換羅諾

  斯當鬼，於是就開始有人死啊、找事件緣由、想辦法解決等等，其中最讓我覺得真正體會

  到所謂的：別人家的孩子死多少都不關我的事（咦？是這樣嗎？），因為最前頭的羅瑞被

  附身時，男主角派翠克只是將他制住，還用盡各種辦法替他驅魔，因為羅瑞是他的親人還

  是親戚之類的，當他恢復原狀時還很感動的哭了，結果後面的安柏被附身後，男女主角兩

  人遇到危機與她抗衡時，他就毫不留情的拿兩支牙刷插進她眼睛（這個還滿好笑的，如上

  圖，有沒有像蝸牛？），女主角也捅她，而咱們派翠克最後更直接拿滅火器將她頭砸爛絲

  毫不手軟，換到諾樂斯時也是，直接拿鐮刀削掉他半邊臉，你說狠不狠？好歹人家也只是

  被附身而已，你可以救羅瑞，為什麼不幫他們倆個驅魔！！！！


  說實在的，我不太知道我怎麼有辦法將本片看完，電影裡面破綻百出，令人困惑的問題也

  一堆，例如說他們明明是在廢棄大樓（還被火燒），為什麼他們可以在閣樓找到完整的病

  歷表以及錄影帶？（好吧，可能沒燒到），那又為什麼他們還可以用機器看錄影帶？（好

  吧，也許有陌生人繳了電費），還有其他一些地方也是。而中途又莫名其妙的突然發現一

  堆所謂的’’線索’’，看到這裡我真是搖頭，太沒頭沒尾了，更讓我驚訝的是，都發生

  詭異的事了，這些人的反應卻出乎意料的冷靜（結果開車撞死人的反應還比見鬼的反應還

  激烈），而電影時不時穿插一些環節還滿白爛好笑的，最好笑的莫過於布萊德看見本來應

  該被自己撞死的神父嚇的往前跑，跑一跑自己跌倒然後就把自己刺死了哈哈哈哈哈，還有

  他們對於許多事情的處理更加應證他們真是蠢到不行。


  大概整部片我只認同一個地方，那就是有人說：「當你對某件事情深信不疑的時候，祂就

  會影響著你的心理。」，例如電影毒鑰裡面的女主角，原本對於巫術怎樣都不相信，但遇

  到太多詭異的狀況時，為了解救自己，於是心底深處相信了，就算嘴巴再怎樣硬，最後結

  果就是：她還是信了。所以她最後出事了。這個觀點我是滿認同的。


  可能是因為一直礙著不能透露結局，所以許多地方就必須避免提及，打的不上不下，就先

  說不好意思啦！


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --

  默默把它歸類在搞笑片...'
