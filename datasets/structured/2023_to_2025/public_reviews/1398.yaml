url: https://www.ptt.cc/bbs/movie/M.1421310948.A.2B1.html
title: '[普雷] 群魔亂舞的鬼附身'
content: '先警告，本文有雷！請慎入。




























  我本身非常喜歡看鬼片、恐怖片、驚悚片等。接受的題材範圍也非常的廣，不管是西方或

  東方的恐怖片，對我來說看恐怖片是釋放壓力的管道(我看恐怖片常常會莫名的大笑，有

  人跟我一樣嗎)，下場就是沒人想跟我一起看恐怖片。


  好吧，這部鬼附身我沒看過預告，太多看恐怖片的經驗讓我知道這部裡面應該沒有”鬼”

  這種東西會出現，而且我也不喜歡被預告片先建立了先入為主的印象。

  片頭一開始鋪陳得還挺不錯，我甚至以為會有類似”怪物”那部漫畫的設定(精神疾病與

  醫院)。然後神父康威這號人物也神神秘秘的，加上蕭瑟的廢棄大樓，我想沒鬼也好，能

  以劇情取勝會讓我更激賞！


  接著就是一堆年輕人在這棟廢棄大樓開趴，玩過頭終於玩出火來。喝酒、性交、嗑藥都不

  夠刺激時，最刺激的莫過於一些古老傳說啦、恐怖的儀式(碟仙、筆仙等)。劇中羅瑞因為

  很想被大家重視所以選擇第一個勇敢上陣，當然也不負眾望的被附身而出盡鋒頭，哈哈！


  雖然這梗已經老到咬不動了，但是這群年輕人驅魔的方式卻讓我笑死了(有幾次還覺得笑

  太大聲)，他們居然是在網路上google如何驅魔，結果還真的有且還貼心附上簡單易懂的

  圖片，死馬當活馬醫之下當然是沒有驅魔成功。這點可能有蠻多人覺得很惡搞，但我卻是

  蠻喜歡的，以往我看許多恐怖片，都在緊要關頭上手機突然沒訊號、網路完全癱瘓。可是

  在鬼附身這部片裡完全沒有這種問題，羅諾斯的遺言也不像一般用紙筆或訊息傳遞，居然

  是用他的IPAD將自己的肥臉和要講的話錄成影像給還存活的同伴看，現在回想還是覺得很

  好笑。


  後來就像我標題所講的，群魔亂舞，一堆人被輪流附身，活下來的人也越來越少，男女主

  角布萊德和派翠克兩人一邊聯合把被附身的人幹掉之外(驅魔沒成功只好讓被附身的人嗝

  屁)，一邊尋找這棟廢棄大樓的真相，兩人為了逃命合作無間，就像一對亡命鴛鴦，真相

  也越來越明朗了，眼看就要成功時，突然來個大逆轉！前面提到結局不能透露，所以許多

  雷也因為牽涉到結局而無法爆太多。


  這部片子其實看得出有努力在走惡搞的風格，確實在部分上也娛樂了我，但目前我覺得惡

  搞得最成功的是《淒厲人妻》這部泰國鬼片。或許導演想在劇情、風格上都有突破，想在

  老梗中玩出新花樣，不過太過太貪心的結果就是劇中人群魔亂舞，整部片的元素也是群魔

  亂舞。



  --'
