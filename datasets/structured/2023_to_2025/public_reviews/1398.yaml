url: https://www.ptt.cc/bbs/movie/M.1696141814.A.FE0.html
title: '[普雷] 附身'
content: '防雷
















  原本在威尼斯謀殺案跟附身這兩部片猶豫


  這部片版上沒看到心得文（還是我沒搜到？


  看完預告片覺得好像蠻有趣的就選這片看了


  開頭主角用類似心理學的冷科學當法師招搖撞騙


  （第一場戲雖然老梗但還算有趣啦）


  第二場就是女主角求助，遇到反派

  （整部片看下來感覺男女主角沒啥火花...）


  中間進入回憶


  回憶中主角是屬於有畫符（說經）天賦


  但是不想繼承家業所以故意把他畫的符跟弟弟交換


  進而導致弟弟被反派弄死，祖傳寶劍斷掉一半

  （一半插在封印反派的說經上，說經是他爸寫的）


  插在說經上的寶劍可以將反派封在一定區域內

  （沒有封印完成，只封一半）


  要寶劍合一再插一次才可以完全封到說經內


  反派則是要女主的陰陽眼破解說經


  時間回到現在


  後面就是很老梗的


  主角一開始想一走了之


  然後又莫名其妙覺悟去救人


  blablabla


  打倒反派，大結局






  劇情是真的很老梗


  常看電視或電影的應該都猜得到後續


  反派可以附身在別人身上行動（類似惡靈附身


  主角的半截寶劍剛好可以破解


  中間進入回憶我一度以為主角會撿回天賦


  自己在畫一張更強的說經封印反派


  結果還是靠爸（留下的半支劍


  然後他的搭檔就是個技師，只會做道具


  後面幾乎沒用（有啦，最後丟個信號彈閃瞎反派


  然後還有一個負責打鼓的當舖老闆


  就...打到一半打個鼓讓反派分心？？







  感覺這片就還蠻雞肋的


  有時間有錢再看吧！



  --'
