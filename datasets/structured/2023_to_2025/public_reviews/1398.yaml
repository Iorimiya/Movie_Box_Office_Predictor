url: https://www.ptt.cc/bbs/movie/M.1651521357.A.4DD.html
title: '[問片] 惡魔附身的西方老片 (有雷)'
content: '應該是小時候在電視上看到的 印象非常模糊了


  只記得即將被惡魔附身的人 身邊會出現一些徵兆




  接近尾聲高潮的時候 男主好像覺得哪裡不對勁


  於是就檢查了自己家的天花板還是屋頂 結果就發現了好像是五芒星的惡魔標誌


  最後男主跟他女友(應該是女友沒錯 不過沒很確定) 兩人在一部車上


  女友知道男主可能會被附身 就拿槍對著男友 準備有什麼異狀就開槍斃了男主


  時間來到午夜零點的時候 車裡氣氛緊繃到極點 但車裡貌似什麼都沒發生


  男主結巴著跟女友說 他沒有感覺到自己有什麼變化


  然而才剛說完 只見車前儀表板旁的LED電子鐘開始快速閃爍 然後逐漸變成六點六十六分


  (666是象徵惡魔的數字)


  女主見狀馬上當機立斷扣下板機 男主就死了




  印象只有這些


  估狗各種關鍵字 & 爬了板上的問片文 好像都找不到


  只好求神解惑 感謝


  --

  血に飢えた狼達よ…今こそ自らの牙で、鎖を解き放つ時が来たのだ…。


  すでに戦いは始まっているのだ。さぁ、武器を取れ!そして殺せ!殺しまくれ!!


  自らの命を、守るために…


  --


  這我倒是忘了 真想找到來看R



  搜尋驅魔人會找到The Exorcist 你說的是這部嗎




  看劇情介紹感覺沒有很像我內文說的ㄝ



  嗯嗯 看起來不是



  搜尋了驅魔人lost souls 看起來確實是這部 讚讚 晚點來看看^_^


  （好像還有另一個中翻叫勾魂時分）'
