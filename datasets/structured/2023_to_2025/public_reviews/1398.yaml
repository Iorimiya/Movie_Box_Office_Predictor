url: https://www.ptt.cc/bbs/movie/M.1535689391.A.CC7.html
title: '[問片] 嬰兒被附身殺光全家的恐怖片'
content: '印象中是國小的時候（2002年吧？）

  有一天晚上和爸爸一起在HBO看的


  劇情：

  一戶人家住在一條大馬路旁邊


  有一天家裡好像在辦什麼聚餐

  一家人快快樂樂在前院野餐


  應該剛學會走路的小男孩從門口爬啊爬

  爬到馬路上然後被大車撞死了


  家人傷心欲絕之下

  還是把小男孩埋起來安葬


  然後不知道什麼原因

  小男孩復活了，還打算把全家人殺光


  不知情的家人本來還很開心小男孩沒死

  結果就全部一個一個被幹掉....


  那家人的不知道誰是外科醫生，所以家裡有一把手術刀，其中有一幕就是小男孩躲在床底下

  把爺爺的腳筋砍斷再把爺爺幹掉


  電影快結束的時候

  不知道是誰的主角拿針筒注射不知道什麼東西給小男孩


  小男孩說了一句

  Not fair...


  然後就死了


  一直想不起來片名，有人知道是哪一部嗎？

  -----

  Sent from JPTT on my iPhone


  --

  對！！！！

  剛剛查了，沒錯！！！！！


  太感謝你了！


  那真的童年陰影


  感謝各位 正是這部沒錯！


  我真的有一陣子不敢把腳靠床邊 XDD



  他很愛看電影 我就跟著一起看，因為這種情況才可以破解我媽的「10點去睡覺」的規定

  結果發現半夜很常播恐怖片 鬼片 QQ

  國小的記憶了 看來是小男孩而已 XDD

  乾 你們很壞 XDDDDDD



  我小時候看哈利波特也覺得很恐怖

  在學校地下室的時候都怕被怪物抓走 XD


  對不起... 是小男孩才對


  這句真的印象深刻！'
