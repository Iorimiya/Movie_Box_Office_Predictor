url: https://www.ptt.cc/bbs/movie/M.1421687245.A.047.html
title: '[普雷] 請不要不信邪-小心鬼附身'
content: '本身還蠻喜歡德州電鋸殺人狂，看到鬼附身這部的導演是這部，

  馬上就認為會有恐怖的元素加入到裡面(預測是對的XD)，於是

  找個時間去觀看(當然要晚上去才有效果)

  這部不能用商業大片的角度去看，用小品電影的觀點來看導演

  營造的氣氛，如果以這點來觀看會比較好。。

  個人在道具製作有很不錯的評價，從環境的安排(聽說是直接在鬼屋拍!?)，到血腥的人體

  模型(有看就知道這是啥意思了) 雖然知道具是假的，但是有時候看到被支解的..(消音)

  ，還是會有點作嘔感，那表示他們的道具做的很逼真，血腥元素在這部片還蠻常看到的，

  你也可以當作是一部血腥殺人片。


  以下為部分劇透(想看完整劇情的請按左鍵離開呦)

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .


  一所治療青年心理的療養院，因後來治療人數遽增，造成醫療資源不足，因此許多青少年

  遭到虐待死亡，不斷傳出鬼影，因此而遭到強行歇業。遭到廢棄，幾年後，幾個不信邪的

  年輕人把此處當作開party的場所，不僅隨地大小便，還把東西都給破壞掉(我還蠻佩服的

  ，光是待在鬼屋我就不敢了，更何況是在裡面開…..party，如果我是裡面的鬼魂，我大

  概會氣到不行)。


  酒後之餘，大家在閒聊有關鬼屋方面的事情，聊到浮空的話題時就越聊越起勁，之後開始

  查詢如何浮空，於是幾個不怕死的年輕人就開始執行召喚儀式，

  其中一個自願者羅瑞躺在床上，旁邊的人按造召喚的步驟念著咒語，過沒多久就發現躺在

  那邊的人真的浮了起來，但只浮一下子就沒，而且旁邊的蠟燭全部熄滅，羅瑞表示他不太

  舒服，想去旁邊吐一下，其他人發現沒趣就一哄而散，過一陣子主角想要去關心一下羅瑞

  ，赫然發現他拿著小刀在刻自己的額頭，主角立馬阻止他的自殘，之後看一下他的眼神，

  似乎是中邪了，只見羅瑞不停的吼叫，主角發現不對勁後，立刻跑去召集夥伴，一開始夥

  伴的其中之一=>壯漢布萊德還不信邪，以為他在裝瘋賣傻，之後差點被發瘋的羅瑞給傷害

  到，馬上嚇得開車要逃出，結果撞上受主角請託來除靈的牧師，為了毀屍滅跡，於是壯男

  下令都不準離開(總覺得牧師好倒楣，來幫忙除靈，結果一下子就領便當)


  之後夥伴們嘗試著自主除靈(夥伴中的胖子真的是標準的電腦控，整天滑著平板)，主角因

  為有在教會待過，所以知道一些基本的除靈方式，拿著牧師身上的聖水，開始念念有詞，

  被附身的邪靈似乎知道他在弄他，開始暴走，整個房間都開始震動(好像地震的感覺)，後

  來發現無效，羅瑞依然還是被附身，而且還激怒了附在他身上的靈，之後邪靈希望跟他們

  溝通，經由儀式中，他們得知原來附身在羅瑞身上的邪靈是迪邦，他希望他們救救他。


  羅瑞隨後就恢復原狀，正當主角納悶之餘，剛剛進行儀式的”女生”卻有了異狀，原來迪

  邦以附身在她身上，正在計畫著之後的大屠殺….。


  劇情只透漏這，後面精彩又有點小血腥的劇情就請自己看下去吧。



  --'
