url: https://www.ptt.cc/bbs/movie/M.1421467240.A.EE8.html
title: '[普雷] 鬼附身，最可怕的...是鬼嗎？'
content: '《鬼附身》的題材類型很常見：一群年輕人，跑到曾經發生過事故的廢棄空屋中舉辦

  派對，喝酒、喀藥，最後還照著網路資料嘗試做某些儀式，（想當然而的）不小心召喚出

  邪惡的東西，開始一連串的恐怖事件。


  　　電影一開始給觀眾一個突兀鋪陳，說突兀是因為這個短短的事件，跟緊接在後的劇情

  完全沒有關連，我當下是一頭霧水，只是這個鋪陳本身很有張力，所以我還能記住有這小

  段劇情。最後有用到這個鋪陳，但我自己感覺這有點牽強，並沒有給我那種「天啊！原來

  這一切都是有關係的！」驚喜。


  　　我喜歡導演用黑白記錄片的方式描述廢棄空屋以前發生的事故，直接視覺的感受以前

  的房屋跟現在的廢棄樣貌的差別。空屋的前身是兒童精神病院，電影在一開頭的記錄片敘

  述部分就提到了，兒童精神病院後期開始有很多不人道的措施，也是我下這個標題的原因

  ，這電影讓我覺得，鬼可怕，人也可怕。


  　　電影的中二的主角群，有各自的個性：自私自利的、隨波逐流的、缺愛的、比其他人

  還冷靜思考的。說到角色，電影開頭出現了神父，我一直以為就只是個鬼片標準配備（完

  全沒有功能被鬼一下就打爆的領便當角色），沒想到神父在這片是有一定重要性的！這部

  分在劇情也佔很大部分，不爆雷。


  　　我覺得這部電影驚嚇程度，不算高，總共10顆星的話，大概是給他6顆星的評價吧！

  血腥的畫面還滿多的，有些血肉切面那種，7.5顆星，常看恐怖片、鬼片、血腥片的人應

  該都不會被嚇到，大概能猜到：等一下後面應該會冒出東西、等一下那個人應該會領便當

  。我自己有被嚇到幾次，但只是往後彈一下的那種小嚇到，不是想罵一連串髒話的大嚇到

  。


  　　劇情上來說，鬼片的基本配備都有：一群屁孩、一個神父、有亂玩儀式、有鬼、有被

  困住、有死人。也有自己獨特的懸疑點，最後結尾還給了一個劇情大轉彎，但交待的太快

  了，有種硬把劇情轉彎的感覺。


  　　我是劇情派的，本片劇情微懸疑，其他基本上都能猜的到劇情，所以我給「普雷」。

  如果是對劇情沒有特別要求，也很享受血腥畫面、享受密室的窒息感的民眾，這部應該是

  滿適合你的休閒恐怖血腥片。


  --'
