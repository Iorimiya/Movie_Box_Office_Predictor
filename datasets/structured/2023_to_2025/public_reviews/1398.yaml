url: https://www.ptt.cc/bbs/movie/M.1421318231.A.F8B.html
title: '[好雷] 鬼附身-恐怖片?驚悚片?搞笑片?殺人片?'
content: '原po我其實超愛看這類奇奇怪怪的恐怖片，不管是血腥暴力的阿，懸疑驚悚的阿，恐怖鬧

  鬼的阿都深得我心，不過由於同一個題材實在有太多的片子不斷推陳出新，所以近年來實

  在是沒有什麼顛峰之作，原po我看電影也覺得好的沒幾部，大家耳熟能詳的都是很久前的

  精典老片，那到底要怎樣才能吸引人呢？我覺得可能是要更惡搞XD? 或是能融合更多元素

  吧！因為單一口味的好像太難迎合觀眾胃口了，像是主打恐怖又不恐怖，主打驚悚又不驚

  悚，主打血腥暴力又只有蕃茄醬亂噴而已。


  先來看看這部片的卡司好了，《13號星期五》《德州電鋸殺人狂》導演；《陰兒房》製片

  看起來豪猛耶~ 這三部都算是不少好評的，不過常常好片的幾個導演製片合在一起，作品

  也很普通就是…，再來看演員，其實幾乎都是小咖的而已，雖然看一些有名的帥哥美女來

  被虐爆會比較爽，不過這事通常不會發生…，我其實也沒有很在意演員啦~ 劇情跟內容有

  點料就好嚕。


  接下來就來說片子本身吧，看電影還算挑的我，看完這部竟然給好評呢XD!! 我覺得阿，

  這部片的步調還算快，不會很容易冷場，能夠一直接著看且吸引人這就很重要了，不過我

  覺得這部片它其實沒有很恐怖驚悚，故事的地點是在一個廢棄屋中，可是鬧鬼的時候外面

  還是大白天呢!! 好像有點特別吼，好處是可能製造更恐怖的感覺，怎麼大白天還是逃不

  出鬼的手掌心，壞處就…大概有人覺得…大白天鬧鬼= =?? 然後可能就沒那麼陰森恐怖的

  感覺(不過本來就沒規定夜晚才能鬧鬼，早上能鬧的才厲害!!)，劇中偶爾還會加點搞笑的

  話或片段(看電影時不少人看到一半就噗嗤或是直接大笑= =)，然後一些殺人或死亡的片

  段我覺得還不錯XD，有些人就很離奇或很莫名其妙就突然掛點，我覺得就很有趣XD(世事

  無常?!)，而且還算是有點血腥+死狀淒慘，我喜歡XD


  所以你問我這部片類型像什麼…同標題，不會分阿XD，恐怖驚悚是還好，搞笑跟殺人的性

  質還有一些，另外血腥暴力的部份我覺得也還可以，只是畫面停留太短了些不夠過癮，另

  外，劇情的發展我覺得也算不錯，感覺有點像蜘蛛網的社會案件情節XD，所以有點慧根或

  經驗的大概都能猜到些劇情發展，這種融入比較多其他元素的片我看了還頗爽啦，總之，

  我覺得是部血腥>驚悚的恐怖驚悚片XD


  --'
