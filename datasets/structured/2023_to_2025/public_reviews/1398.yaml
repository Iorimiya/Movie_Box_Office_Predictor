url: https://www.ptt.cc/bbs/movie/M.1421406251.A.3D6.html
title: '[好雷] 鬼附身 - 驚悚震撼滿分的血腥盛宴'
content: "《前言無雷》\n\n說到恐怖片，我比較常看的是日本跟泰國片，總是有一種仇恨、怨念、因果的感覺。\n平常朋友邀我去看歐美片，我都說「不要…歐美的恐怖片根本就只是特效嚇大的，沒\n\
  什麼故事性。」不過，這次對於「鬼附身」這個標題，感到興趣，於是就跟朋友揪團\n去看啦！\n\n「鬼附身」，不管在東方、西方，都是指人突然著了魔，做出不合常人會做的事來。\n\
  看電影簡介，說明是由玩不該玩的遊戲開始，讓我很好奇這部電影會是什麼樣的故事\n。\n\n看到導演Marcus Nispel這名字，無不想到他的《德州電鋸殺人狂》，所以在此提醒大\n\
  家，這部電影有滿多的血腥畫面。\n\n\n\n\n\n\n\n\n\n\n----------------------------------防雷線-------------------------------\n\
  \n\n查了網路資料，原來《鬼附身》電影是取材自美國超自然協會認證 10 幢鬧鬼建築物，\n最恐怖的心理療養院──紐約金斯帕克治療中心（Kings Park Psychiatric\
  \ Center）\n，該療養院以治療青年心理問題為主，因後來治療人數遽增，造成醫療資源不足，因此\n許多青少年遭到虐待死亡，不斷傳出鬼影，因此而遭到強行歇業。\n\
  \n\n而電影裡，是以治療兒童的精神病院拉開序幕，康威神父原本要把這棟建築物改成青年\n活動中心，在整理內部的一天，主角派翠克的胖朋友諾樂斯（很明顯是損友）突然說今\n\
  晚要在病院裡開Party ，於是整個病院就像是廢墟主題的夜店一樣，整個很歐美式的派\n對畫面。\n\n\n在派對中，派翠克認識了一位身材姣好的黑髮女孩，她在派對結束後也留下來，和他們\n\
  一群人六個（派翠克、諾樂斯、派翠克的弟弟－羅瑞、派翠克的朋友－布萊德、布萊德\n的女朋友－安柏、吸毒嚴重的路人－阿卓）繼續在病院裡玩樂。各式各樣的遊戲、吸毒\n\
  樣樣來，直到安柏提起幽靈浮體的儀式，好奇心的驅使下，他們以羅瑞進行儀式，沒想\n到這個舉動引來鬼附身在羅瑞的身上。\n\n\n一群人決定想辦法救出羅瑞，對抗惡靈，卻屢次失敗，隨著故事發展，派翠克與黑髮女\n\
  孩到處翻找病院裡的資料，想要了解藏在這個病院的惡靈。他們找到了過去病患「迪邦\n」的資料，意外發現了康威神父不為人知的祕密。\n\n\n為了要生存下去，不惜殺害自己的朋友們，隨著一個一個犧牲者的死去，到底惡靈想要\n\
  的是什麼？最後康威神父出現了，當所有人以為一切將會得到救贖的時候，沒想到……\n最後的結局竟然非常意外。\n\n\n\n《感想》\n\n結局我就不暴雷了，畢竟今天才上映第一天，別掃大家的興XD\n\
  整體感覺比以往的歐美恐怖片來的強很多，嚇人、讓人產生恐怖感的地方很有泰國的風\n格，血腥部分更勝錄到鬼系列的活屍感，絲毫不猶豫的噴濺。而畫面與音效的震撼感，\n\
  讓我在當時覺得可以做成4D電影，讓身體也一起享受這個恐怖盛宴！\n\n\n\n\n\n--\n   ^^^^^^^^^^伊湄兒>////<\n感謝三位更正，打字打太快打錯了><"
