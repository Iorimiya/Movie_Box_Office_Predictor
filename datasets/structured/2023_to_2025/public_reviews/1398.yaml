url: https://www.ptt.cc/bbs/movie/M.1431509880.A.60F.html
title: '[新聞]【叫魂】拍攝現場鬧鬼 女星目睹「附身」'
content: '恐怖顫慄超越《忐忑》與《驚字塔》的好萊塢靈異驚悚電影【叫魂】（Demonic）即將於

  5月29日在台灣全球首映，在片中飾演女主角的好萊塢演員瑪莉亞貝蘿Maria Bello難忘拍

  片的過程，她說：『拍攝電影都會有很難忘的經驗，但【叫魂】在拍的時候發生太多無法

  解釋的事了，不論是拍攝檔案不見、燈泡無故破掉、道具不翼而飛等等，最恐怖的是工作

  人員疑似被附身，全身顫抖口吐白沫…這樣恐怖的拍攝經驗讓我一輩子都忘不了。』


  電影【叫魂】即日起在網路上推出「靈異照片大募集」活動，有「說鬼大師」之稱的司馬

  中原老師也應邀參加此活動，每週三於Catchplay臉書上為網友解析投稿的靈異照片，本

  週網友投稿的靈異照片，背後有一段駭人聽聞故事，「這家人在北宜公路九彎十八拐的地

  方幫小妹妹拍照，照片洗出後發現右邊有個非常清楚的白衣人，而且他的下半身是轉過來

  的，也沒有腳，當時車窗是關起來的，他的手卻還能伸進去握住方向盤，似乎想撞小女孩

  一樣。聽說沒多久這個小女孩就過世了，死因不明.....」，而究竟司馬中原老師對於這

  張照片有甚麼樣的靈異見解？

  請參考活動網頁

  或Catchplay臉書。


  電影【叫魂】描述5位好友一同慘死在空屋裡，唯一生還者聲稱是房子殺了他們，幾年後

  這位發瘋的生還者也不幸病死…現在，6位好朋友為做實驗來凶宅召魂，並透過攝影機記

  錄下一切，沒想到請鬼容易送鬼難…接二連三發生的驚悚事件讓他們一個個被詭異虐殺，

  警方得透過記錄的影片找出兇手，只是…這些透過牽魂陣所召來的魂，除了想要被看見，

  似乎更想要找人陪…


  【叫魂】即將於5月29日於台全球首映，

  欲得知電影最新消息請上


  新聞網址：


  --'
