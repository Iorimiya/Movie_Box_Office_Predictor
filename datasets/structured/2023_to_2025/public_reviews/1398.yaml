title: '[問片] 一部鬼會四處附身的電玩改編(？)電影'
content: '印象中是一部洋片

  可能是電玩改編


  劇情是一對兄妹和哥哥朋友去一個地方

  不經意發現地下室有一本書裡有咒語 寫著封印鬼之類的

  哥哥朋友因為好奇就唸了咒語 導致封印的鬼就跑出來四處附身在人的身上


  好像鬼先附身在妹妹身上 後來又附身到哥哥身上

  最後妹妹好像用火燒了哥哥之類的...


  劇情真的忘得差不多 也可能和原本劇情有所出入

  我用關鍵字都找不到QQ

  希望版上神人可以幫忙

  真的很想再看一次啊




  --


  就是這部！！！！！！感謝神人！原來是翻拍，謝謝你～～～'
