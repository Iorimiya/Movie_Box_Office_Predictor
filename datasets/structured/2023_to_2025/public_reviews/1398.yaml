title: '[片單] 類似咒或化劫真人真事改編拜錯被附身的片'
content: '1. 請簡述自身需求片單理由 或 欲尋找電影的類型或特徵（請盡量描述清楚）


  稍早看到一篇電影化劫的新聞講述背後真實的故事

  說是原著小說作者朋友發生的

  認識的姊姊去一間廟點了光明燈結果慘遭附身

  還被那間廟的信徒當成菩薩來拜

  家人四處找高人處理

  才發現女子身上的是魔不是鬼

  覺得這個故事很不可思議

  因為只是點光明燈@@


  新聞連結:


  想到去年電影咒也是真人故事改編

  也是有人拜了住宅式的神壇

  一家六口起乩自稱神明附體


  新聞連結:


  台灣人真的很愛拜拜

  在北中南都可以看到住宅式的宮

  想請教版上的網友

  過往是否還有這種真人真事改編拜錯廟的恐怖片呢？

  感覺早期這種題材會不會更多

  因為很小的時候很流行大家樂很多人會四處亂拜拜

  不知道有沒有人有看過類似的電影

  國內外或是很早期的台語片都行

  滿好奇相關的故事


  2. 已知符合需求的電影或偏好的電影類型（為避免重複推文，請至少列舉一部）


  3. 不喜歡的電影類型            （不需要板友推薦的電影片名）


  --'
