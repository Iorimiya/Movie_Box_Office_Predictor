url: https://www.ptt.cc/bbs/movie/M.1436027222.A.DF9.html
title: '[問片] ㄧ部小女孩被附身的恐怖片'
content: '片頭帶出ㄧ間房子外面有一顆樹上面吊著一家人 但小女孩失蹤


  主角一家人搬進去後


