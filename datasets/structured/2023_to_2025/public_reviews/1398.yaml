url: https://www.ptt.cc/bbs/movie/M.1697052836.A.5BC.html
title: '[新聞] 《大法師》導演遭爆生前揚言附身新版導演'
content: '《大法師》經典導演早以預料《大法師：信徒》會爛？遭爆生前揚言「附身戈登格林，讓

  他的生活像地獄」




  近日《大法師：信徒》（The Exorcist: Believer）即將上映，這部出自《月光光新慌慌

  》導演 大衛戈登格林（David Gordon Green）之手的續作，延續了1973年《大法師》電

  影的劇情，否定了後續非由 威廉佛瑞金（William Friedkin）執導的系列。然而，本片

  依然收穫了鋪天蓋地的惡毒負評，而在八月不幸逝世的威廉，更無緣見到這部作品的完整

  版。


  不過根據媒體人艾德惠特菲爾德（Ed Whitfield）的說法，早在《大法師：信徒》進入早

  期開發階段時，佛瑞金就已經嗅到了不妙的現象。


  艾德在社群透露，佛瑞金曾經和他這樣抱怨：


  「艾德，那個拍了新《月光光》續集的傢伙，要來拍我那部《大法師》的續集。沒錯，我

  的代表作即將交到拍出《菠蘿快遞》（Pineapple Express，2008年賽斯羅根主演喜劇電

  影）的那個人手上。

  。」


  佛瑞金會說出這樣的重話其實不怎麼令人驚訝，畢竟在首集《大法師》之後，佛瑞金退出

  了此後所有系列續作。他在生前早就重砲批評過1977年的《大法師2：異端》（The Exorc

  ist II: The Heretic），稱他看了五分鐘就看不下去：「有一個員工跟我說《大法師2》

  剛製作完成，問我要不要看看，我說好啊，然後我看了5分鐘，他就把我給嚇壞了。我不

  能接受，就是非常荒謬、愚蠢！」更惡毒稱：「這是我見過最爛的東西！」


  --'
