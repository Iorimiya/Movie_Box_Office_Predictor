title: '[問片] 海上惡靈附身的國外電影(有雷)'
content: '應該是年代有點久遠的電影了..


  場景在海上的船內，有惡靈會附身，

  但後來發現惡靈不敢靠近一串圓形的咒語，

  所以畫完咒語後大家都躲在圓圈內...


  結局是最後剩下一位本來是坐輪椅的男性，

  因為他把圓形咒語畫在自己身上，

  然後讓惡靈進入身體後出不來，

  他也因此得到惡靈的力量，變得能走路了@@


  （抱歉，因為隔了很久，描述有點凌亂orz）


  --'
