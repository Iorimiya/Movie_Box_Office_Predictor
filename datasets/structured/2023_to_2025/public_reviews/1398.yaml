title: '[問片] 被附身的西洋片'
content: '想問一部西洋片

  劇情是一個女生

  去一對老夫婦家

  當癱瘓老先生的看護


  然後就發現很多老太太很詭的事


  最後是主角相信了老太太的咒語

  這個咒語要成功的條件是

  施法者要相信這個咒語是真的


  最後女主角的靈魂到了癱瘓老先生的身體

  而女主角的年輕身體就被惡魔老太太附身了


  請問這部片的片名有人知道嗎


  謝謝


  --'
