url: https://www.ptt.cc/bbs/movie/M.1448296087.A.4DC.html
title: '[普雷]鬼附身'
content: '大家好

  我是專看恐怖片的LittleDiDi

  我又來跟大家介紹恐怖片了


  Blog圖文版會更精采




  年份：2015


  國別：美國


  類型：血腥、靈異、懸疑


  導演：Marcus Nispel




  [劇情簡介]


  美國最著名鬧鬼心理療養院--羅德島埃克塞特萊德學院(The Ladd School in Exeter,

  Rhode Island)實地拍攝，該療養院在1916年起以治療青年心理問題為主，因後來治療人

  數遽增，造成醫療資源不足，因此許多青少年遭到虐待死亡，不斷傳出鬼影，1993年遭到

  強行歇業。六個年輕人，閒來無事，便吆喝到廢棄的空屋中舉辦狂歡派對，從俄羅斯輪盤

  到真心話大冒險，六個人玩的不亦樂乎，並且玩起了招喚惡靈的遊戲，卻不小心惹禍上身

  ，把隱藏在人類周遭的惡靈釋放出來，大開殺戒……



  不知道大家對這部片的印象如何，但我算是蠻印象深刻的。印象深刻的理由有點特別的，

  那陣子剛上映時，我第一次遇到這種冷門片，連查片名都這麼麻煩的，我原本用台灣原名

  給的Exeter去查，結果居然跑出「艾希特大學」，另外用別名The Asylum去查，結果跑出

  一家美國電影公司。幸好最近已經有定調，去國外網站也稍微查得到這部片的資料了。


  很冷門的一部片，不冀望有多少人會因為看到這部片來我這邊逛逛，純練文筆。


  《鬼附身》說它冷門，但也別立刻用粗製濫造的眼光去看待它，實際上它還算系出名門，

  由《德州電鋸殺人狂》、新版傑森《黑色星期五》導演Marcus Nispel執導，以及雖然在

  《阿凡達》是名大反派，卻因飾演剽悍將軍而出名的Stephen Lang主演。


  整體來說，表現是中規中矩，沒什麼太突出之處，但也不至於會爛到令人翻白眼就是了。


  本片可以說是我開始寫電影以來，最沒重點的。此話怎講，先從劇情講起吧，《鬼附身》

  的劇情在講，美國某地有間過去曾經是瘋人院，多年後廢棄而成為當地年輕人休閒遊憩的

  好地方，然後主角群們就跑到裡面去開趴，玩到不知道要玩什麼就玩通靈，結果玩到被殺

  光光的戲碼。


  聽完我的敘述，第一直覺就是老梗。沒錯就是老梗，美國片至少有高達七成的比例，多少

  會提到「趴」這個關鍵字，換成恐怖片那比例就更高啦。所以呢，這些跑趴人士會遭遇怎

  樣的慘況也不用我多說啦，只是說既然跟趴有關，電影多多少少要有些轟趴的描寫。


  問題是你看本片的這些人玩的東西，除了嗑藥喝酒之外，其餘真他媽無聊找事做，還不如

  回家打飛機。


  接著，因為這是年輕人的趴，因此除了要營造一些年輕人荒唐的行徑之外，還多少加進了

  些校園YA片的黑色幽默，其中有個嗑藥嗑到趴，演到領便當前都穿著內褲滿街跑的瘦子，

  也有個怎麼樣都很衰的胖子，大吐誰敢比我慘的苦水；其餘人多多少少也會稍微無腦兩下

  ，但問題是，真的還是那句老話，無聊當有趣，金排球。


  無聊到一個極致之後，終於開始玩通靈了，本來不玩又說一竅不通的眾人，突然每個人都

  變成通靈專家，每個都開始懂一點了。看似沒事其實有事的做作氛圍之後，主角的老弟被

  附身了，然後就......，嗯，你們知道的情節，整部片看下來可以說是毫無冷場，但也稱

  不上有什麼精采之處，許多驚嚇點都很老套，甚至還有故意跑進衣櫥玩躲貓貓的無俚頭。


  那種感覺就是一種大雄明明可以跑得比技安快，卻硬要跑去躲在一定會被發現的三根水泥

  管裡一樣蠢。很明顯就是導演想多弄點驚嚇，卻又顯得很突兀。


  接著談本片的賣點─血腥，這部片就血漿量來講，算是挺豐富的，死亡人數也不少，但是

  但是但是......，這部片子可是一點痛覺也沒有呢。此話怎說，整部片的血漿噴灑方式幾

  乎都是剪接與借位，不然就是假假的特效，還有那種上一幕是從背後捅人結果剪接完下一

  幕從旁邊插出來的Bug，嚴謹度與八點的本土劇差不多，認真點一天就可以拍完的感覺。


  說到這裡，可能有人會以為這部片就很無腦的鬼入侵狂殺片，好像也不算是，這部片在地

  點的選擇上可是有考據的，至於是哪邊我就不明講了，因為特地以瘋人院為背景拍得更好

  的比比皆是。另外劇情也是有點鋪陳佈局與解謎，最終也是想導向「兇手就在我們之中」

  的意味，但是只瞧導演一直想誤導觀眾，但觀眾其實也不難嗅出一二，怎麼大家都忙著逃

  命，就某人很有事得在閒晃解謎。


  很標準的大雜燴電影，瘋人院、開趴、血腥、驚嚇、通靈、驅魔、懸疑、無腦幽默......

  一堆的，什麼都想來一點，但什麼都不出色的平庸電影，幸好也沒什麼色色的情節(不過

  開頭有很沒意義的露點，跳過也沒差)，很適合一家大小突然想來點刺激的輕鬆小品。



  即刻短評(滿分5)


  劇情： 2      >>真的蠻簡單的，這樣還看不懂得我會笑你

  結局： 2      >>想搞大逆轉，但真凶實在不太意外

  血腥： 3      >>不算詐騙啦，但當賣點我會覺得不太給力

  氣氛： 2.5    >>超級大雜燴，樣樣精通樣樣鬆

  推薦： 3      >>以B級冷門片來說算不錯了啦


  --

  雖然還是蠻爛的

  但比我預料來的好一些'
