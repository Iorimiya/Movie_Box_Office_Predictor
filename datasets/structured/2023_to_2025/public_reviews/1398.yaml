url: https://www.ptt.cc/bbs/movie/M.1421669093.A.E33.html
title: '[普雷]鬼附身 '
content: 'MOVIE板首PO


  這部片讓我分類的話應該算是B級片


  但是以B級片來說 我覺得不夠血腥


  而且電影內有些地方讓我覺得有點像搞笑片


  =============以下防雷=================
























  ==============防雷================


  片裡主要角色的名字我都忘了 以下以角色特徵來表示


  這部片劇情很單純


  就是一群屁孩乘神父不在家時在精神病院裡開趴


  因為網路謠言 這群屁孩想試試看"人間漂浮"


  結果其中一位瘦矮子就被鬼附身了


  這時候屁孩們開始害怕了 然後第一位犧牲者就出現了


  是根本不在屁孩群裡的一位獵槍阿伯


  他找到被附身的矮子想要解開繩子結果就被扭頭


  屌的是這位阿伯頭都轉180度了還能走路 被自己的獵槍爆頭


  這群屁孩更害怕了 就CALL神父回家請他驅魔


  結果神父在病院門口被帥哥男撞到就往生了


  後來主角就想要自己驅魔 找齊了驅魔道具後


  居然照著網路上的"簡易驅魔方法"驅魔


  這段劇情全場笑翻...


  當然驅魔是失敗了 之後的劇情就是 屁孩群裡的人會輪流被附身


  然後都會被主角用各種方式打爆


  其中有段劇情是帥哥男遇到沒死透的神父被嚇到摔倒


  結果就被自己拿的武器刺穿身體往生了...


  這段也是全場笑翻


  結局我就不說了 反正就是主角打敗惡魔 逃出生天 就這樣


  雖然最後的BOSS讓我有點出乎意料就是了


  =========================================


  其實B級片本來是不太需要劇情的


  只是這片根本不夠血腥 唯一大噴血的地方只有阿伯獵槍爆頭


  之後的肥宅被主角拿連刀削掉半顆頭居然一滴血都沒噴


  還有女2被主角拿氧氣筒整顆頭打爛也沒噴


  神父被火燒爛了看起來一點都不驚悚 沒作出皮膚爛掉的樣子


  BOSS被插了 還是沒噴...


  同類型的 像是地獄魔咒 詭屋 屍變都好看很多


  所以....看在本片還蠻搞笑的份上給他普雷好了


  --'
