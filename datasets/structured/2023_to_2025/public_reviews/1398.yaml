url: https://www.ptt.cc/bbs/movie/M.1439553435.A.CC9.html
title: '[新聞] 台灣劇組被阿飄附身 拍鬼片好兄弟顯靈'
content: '記者翁新涵／台北報導


  國產鬼片《屍憶》，拍攝過程真是鬼影幢幢，導演謝庭菡在日本和同事下榻民宿，竟遭遇

  鬼附身事件，嚇得所有人說不出話來。


  謝庭菡導演表示，影片在日本進行後製時，她和同事下榻古老民宿，卻在泡完溫泉回到房

  間後，發現行李箱鑰匙不翼而飛，當她們翻箱倒櫃找不到鑰匙時，竟又發現鑰匙從剛換上

  的浴衣掉出來，而跟導演同睡一房的同事，居然遭鬼附身，不但睡夢中自稱「廖先生」，

  這位不姓廖的同事還說起，自己根本沒學過的日文與靈界對話，讓導演嚇到整夜都睡不著

  覺，隔天連忙退房換旅館。


  而田中千繪為宣傳在鬧鬼戲院舉辦簽名會，結果看到電視節目在同一地點出外景拍到鬼影

  ，才驚覺原來當時在屋裡，總覺得看著某處讓人身體不適，原來是好兄弟顯靈導致。


  此外，在電影中飾演未婚夫妻的吳慷仁和謝欣穎，除了在片中上演激情床戲外，還有一場

  「裸身共浴戲」，但實際拍攝卻不怎麼浪漫，原來吳慷仁拍完隔天要去醫院做健康檢查，

  為了清腸道在拍攝當天吃下強力瀉藥，讓他開演前狂跑廁所，意外造就線條分明的好身材

  ，讓謝欣穎在拍攝期間摸得徹底，至於只能扮鬼妝，泡冰冷屍水的田中千繪，則好生羨慕

  。


  新聞網址：


  --'
