url: https://www.ptt.cc/bbs/movie/M.1711821324.A.AD5.html
title: '[問片] 一部主角被惡魔附身的喜劇片'
content: '大家好

  我想請問一部主角被惡魔附身的片

  由於大約是十幾二十年前看到的 記憶力可能會出錯



  比較確定的是在三台播的電影 不是第四台

  主角本來是正常人  但偶然機會下得到惡魔之力(或是被惡魔附身)


  然後那時發生一些凶殺案 有些人懷疑是主角幹的

  但後來發現是另外一個真正的惡魔做的

  附身主角的惡魔只是比較白癡/搞笑而已 並沒有真正傷害到人


  最後結局是主角跟真惡魔對決 但打到後來快要輸了

  我記得能讓主角發揮惡魔力量的好像是.....色情/性興奮的力量

  因為我記得配角在旁邊激勵主角時

  好像是說「我現在沒穿內衣」之類的(抱歉...我也想記得一些比較營養的片段orz)


  這不是什麼經典名片

  只是大概每過幾年我都會突然想到這部片 想說上來神一下


  ====================

  另外有一部也想一起問一下 這部的記憶就更薄弱了

  女主是類似狼人的生物

  這部一開始是女主角在釣男人

  釣到後就直接在男人的車子裡把對方吃掉了(物理的吃)

  後來遇到男主(普通人)後有改邪歸正

  印象最深的大概就是 做愛的時候眼睛會變色(好像是紅色)

  結局好像也是跟女主的同族對決的樣子  印象中有一段場景是在冷凍庫裡


  線索大概就這些了  非常感謝


  --'
