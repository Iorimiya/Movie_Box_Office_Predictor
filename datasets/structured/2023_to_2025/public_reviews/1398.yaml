url: https://www.ptt.cc/bbs/movie/M.1610871411.A.DD4.html
title: '[新聞] 想像不到的瘋狂！男子被亡妻附身 不讓女兒遭惡魔破身'
content: "新聞網址：\n\n2021-01-16 21:24 聯合報 記者蘇詠智／即時報導\n\n佳評如潮、被譽為「非看不可狂想傑作」的「通靈駕訓班」，描述一個擁有通靈能力的駕\n\
  訓班女教練，為拯救客戶的女兒免遭撒旦「處女獻祭」詛咒，必須找到7個鬼來上身，女\n兒才能得救、免遭撒旦開苞……讓人絕倒的精彩設定，又百無禁忌的狂灑邪教趣哏，狂戳\n\
  觀眾笑穴。片中為救女兒免於「淫色」危機的善良鰥夫，找來名導肯洛區的愛將貝瑞沃德\n，片中一段「亡妻附體」、人鬼合一又忽男忽女的驚人場面，演技表現讓人嘆為觀止，讓\n\
  他提名愛爾蘭影視獎最佳男主角，該片更橫掃義大利「的里雅斯特科幻影展」囊括最佳歐\n洲電影、最佳首部電影、最佳導演及觀眾票選獎等4座大獎。\n\n貝瑞沃德是愛爾蘭知名演員，曾主演坎城金棕櫚獎導演肯洛區的電影「自由之丘」，精采\n\
  演技及舞姿獲得無數好評。演戲經驗豐富的他，這回飾演飽受亡妻靈魂騷擾的型男鰥夫，\n即使是靈異喜劇，依然展現高超演技，和亡妻靈魂合體的片段，貝瑞沃德忽人忽鬼、時男\n\
  時女的神態，讓人看得瞠目結舌，被英國媒體誇讚是「最頂尖的喜劇演出」。\n\n「通靈駕訓班」去年在金馬國際影展觀眾排行榜，長期名列前茅，許多人拍手叫絕，在美\n\
  國爛番茄網站上得到影迷98%超高期待度，台灣將於本月22日上映。\n--\n\n   \n\n\n\n--"
