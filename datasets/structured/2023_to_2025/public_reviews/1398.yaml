title: '[好雷] 附身符 Amulet，異性戀《春光之境》？'
content: "今天上映新片中，我最期待的是《附身符》Amulet！編導是 2000s我最愛的英國文學古裝劇女星 Romola Garai，她進入 2010s\
  \ 好像就默默沉寂了十年？上次在台灣大銀幕看到她已是《女權之聲》而且還只演個小配角。當然她也沒閒著，雖然已非英國古裝甜心第一把交椅，但又演舞台又演電視又當媽媽又當導演，看來這人生與事業只有比過去更精彩！倒是近年追追她的選片與訪談，不難發現她過去「古裝玉女」或「英倫玫瑰」的形象已快速消失、取而代之的倒是對各種「女性獨立」與「社會正義」的期許。在這樣的人生觀下初次當編導拍出的《附身符》會訴說什麼故事呢？\n\
  \n\n\n        異性戀版《春光之境》？\n\n開場，東歐士兵主角焦慮地在森林逃亡，莫名奇妙挖到神秘女性形象的「護身符」，在此給我們一種異教電影的期待；第二景，同樣是森林，士兵成了邊境哨守兵，看到一個女子穿越邊境而天人交戰準備開槍，給我們一種戰爭創傷電影的期待；第三景，日換星移，主角居然變成了睡破舊通鋪做粗工的非法勞工，而且居然運送過程中背景有紅色倫敦巴士，給我們一種應景的「移民悲歌」或「難民血淚」之社會片期待；第四景，這粗工主角平日看的是漢娜鄂蘭等政治哲學書，而且這張臉蓄了鬍子我們才知是《春光之境》羅馬尼亞帥男Alec\
  \ Secareanu，難道這是一部跨國愛情片？\n\n隨後主角由非人粗工被貴人轉介到一個英格蘭破敗家庭當幫工、當《潮濕地帶》瑞士演員 Carla Juri 演的破敗家庭下代女主角登場、而兩人四目相投心有靈犀時...\
  \ 這簡直就是《春光之境》的異性戀版本呀！這位女主角也忍辱負重扛著家計照顧著失能又暴虐的長輩、她也因此封閉己心冷漠又絕望，而新加入的羅馬尼亞移工一雙巧手、宛如照顧田園小羊般悉心修補這間破敗的大宅...\
  \ 我再次揉了揉眼睛，確認編導 Romola Garai 雖沒明說、但非常明顯要致敬《春光之境》呀！要說個《春》片的移工故事、要談個《春》片的異國戀情、更要重現《春》片的親土親人以愛撫育！\n\
  \n而且，回想《春光之境》God's Own Country 世界觀，光看片名就很宗教，儘管故事是同性戀但宗教眼光從沒忌諱，反而充滿各種「牧羊」「耕耘」與「田園」意象，彷彿諄諄教誨在資本英國剝削世界窠臼裡走不出來的人們，就暢然放下各種對人生的憤怒不平、大方擁抱他人親土親人吧。那明顯致敬《春》片的《附身符》也會有這種「宗教」訊息嗎？乍看之下好像還真有：主角來到了英國、在勞動中被剝削漸入迷思、終於遇到\
  \ Imelda Staunton飾演的慈愛修女指引他人生方向、你的人生不用糾結在過去創傷與痛苦、而更值得大步向前、以愛給予一位創傷女子身心的活水吧。\n\n\n\
  \n        深情男子 second chance？\n\n這麼個聖光療癒的啟示、這麼個洗盡鉛華的救贖、這麼個怦然心動的相遇、尤其相遇的還是 Carla\
  \ Juri 這等粗布素衣不掩美麗哀傷的女子時，男主角難道還不大方擁抱這「第二次機會」嗎？說 second chance，在此片主角 Tomaz身上不只是「我的祖國戰亂、我還能在異地找到新生」這種難民渴望，其實他還有個埋藏心底不為人道的秘密罪咎，此片都將以一次次令他做惡夢的回憶驚悚襲來：當年，他本可槍殺那位闖邊境的女子，但他沒開槍而收留了她下來；他本可把這女子當囚犯，但他照顧她噓寒問暖付出了自己光明的人性；那麼，這位蒙他收留的女子是否會以愛回報呢？\n\
  \n本片於是分過去與現在，雙線並行展開：(1) 過去夢境線，Tomaz 與闖邊境女子 Miriam 一次次交談交心、一齊看著那神秘的「護身符」渴望著大地母性的慈愛、希望我們終能逃過戰禍重拾人生，更暗暗想著我對這位女子還不錯、也許我和她之間也能開花結果；(2)\
  \ 現在生活線，Tomaz 住進了孤苦女子 Magda的家，看她一個人照料閣樓裡失智又暴虐的老母、令自己看了好心疼想出手幫助，看她心力交瘁已無力照管生活、讓一棟本來光明亮麗的大宅髒亂堵塞又蒙塵、自己也要發揮工程巧手幫她重拾好生活，而她已絕望孤寂的一顆芳心、是否也能與我這深情男子相濡以沫呢？\n\
  \n仔細看看過去與現在，其實處境似曾相識，都是男主角 Tomaz在浪漫想像：覺得自己即使處境艱困仍保有一顆美麗的心、既有一個同樣落難的美麗女子在前我就伸出援手、我倆同是天涯淪落人就來相濡以沫、本來不苟言笑的冰雪女子都會被我的愛所融化...\
  \ 這點混雜著處男與騎士的男孩情懷，在過去線 Tomaz面對 Miriam 一句「我去市府辦公看過妳很多次、妳從沒抬頭展露過笑容」一覽無遺：男孩自認是個好男孩、自認平日對女生恭謹有禮、女生有需要時他或百般呵護或赴湯蹈火總不遺餘力...\
  \ 為什麼，有的女生就是不願對我敞開心扉展露笑靨呢？\n\n\n\n        受害男子，還是受罪男子？\n\n過去線，在 Tomaz悠悠道來這句「妳都不笑」後，不久就發生了急轉直下令人驚駭的結局！彷彿在說一個含辛茹苦的男孩孤心終於崩潰了，這結局也成為現在線中\
  \ Tomaz的原初罪咎。於是現在線中，Tomaz 輾轉逃難來到英國、還從倫敦粗工輾轉來到孤苦女子家的新生活，就成了他「洗心革面、把事做對」的 second chance：這一次，我還是會悉心呵護、我還是會耐心扶持、還是會無條件付出滿滿的愛，而這一次我也會堅守愛的分寸、不論女生要堅守孤心還是敞開心扉、不論她是要保持距離還是以愛回報，我都會謹守自己的騎士精神絕不踰矩，就當是為過去錯誤洗清罪過吧。\n\
  \n用心良苦的贖罪苦路，儘管有慈祥修女 Sister Claire在背後一次次鼓勵打氣，這條苦路仍然不好走：不只是 Magda的孤女孤心絕望封閉、她照顧的暴虐虎媽更緊迫盯人毫不鬆手，更恐怖的是暴虐虎媽竟還有邪靈附身、連修女都認證了「她是個壞掉的心靈、我們要小心看守直到上帝帶走她」！此片的「恐怖片」成分於是就在這間衰敗大宅鬼影幢幢地展開了：這裏水管不通，是因為藏了死而不僵的蝙蝠；這裏天花裝飾，竟有作法下咒的貝殼符號；這裏的一隻隻蝙蝠，竟然都是閣樓虎媽被魔鬼附身生下的魔鬼之子；這位被附身虎媽甚至刀殺不死，深情的騎士男主會遭她反殺嗎？\n\
  \n電影末段倒是給了個翻盤結局，是近年我看過最徹底的「大逆轉」，有點類似小時看《靈異第六感》那樣，並不是故事情節或主角冒險的逆轉、而是整個電影世界觀之「真相」的逆轉：原來，閣樓這個看似被魔鬼附身的惡媽媽，不是受害者而是加害者，甚至不是女人而是男人，是過去強暴女子的強暴犯；而主角呢，他也許以為自己是過去戰火的受害者，也是現在惡靈虎媽對\
  \ Magda壓迫下的拯救者兼受害者，但只要回想他過去那自命無心之過的「罪咎」，就知道他其實也有「加害者」身份、只是他一直不願面對、也一直希望把握 second\
  \ chance多做善事得到救贖洗清罪疚...\n\n\n\n        寬恕罪過，是誰的世界觀？\n\n結局揭曉，看來 Tomaz不管自命再多苦悶與無奈、再多善心與愛心，他只要有做過壞事就是有做過；他不管自命已經潛心贖罪好久了、已經無條件對人付出愛好久了、覺得就算被我付出愛的女生仍不愛我也就算了、我付出這麼多愛總能得到救贖洗清罪過時，很遺憾，在某些世界觀裡這些「罪」都是無法用善事去「救贖」的。話說回來，到底是什麼世界觀會認為「罪」可以用「善」去救贖、而理所當然得到「寬恕」呢？在本片的西方世界，當然就是基督宗教，尤其主角\
  \ Tomaz背後還有慈祥修女 Sister Claire慈愛鼓勵著；不過等修女露出真面目變成「恩不里居教授」時...(!)\n\n也許，Tomaz 在片頭第一景挖到的那個「護身符」Amulet、那個在森林深處以女性形象埋藏數千年的異教聖像、就是個完全超出西方兩千年基督教正義觀的「正義女神」吧？這女神，最後在\
  \ Tomaz面臨大劫之前也有奇幻亮相過，她對 Tomaz也未必有什麼兇殘懲罰，就只是笑笑地歡迎 Tomaz來迎接他應得的歸宿。在此 Tomaz償還特定「罪咎」的方式不是透過做其他善事來彌補，而是直接面對這種「罪咎」本身所造成的傷害：肚子大了起來、肚子撕裂了開來、生出了一隻隻異種小怪物、真是男人所無法想像的血腥又噁心！會造成這種傷害的「罪咎」倒底是什麼，也就呼之欲出。\n\
  \n隨著 Carla Juri 飾演的邋遢女主 Magda、在事件之後面貌一改戴上墨鏡、自由奔放地開著車子前往英國另一處鄉野，當年那位身受 Tomaz「罪咎」之害的女子\
  \ Miriam 竟雙眼無神地在這經營加油站雜貨店，門外還有個六七歲的小女兒與她相依為命著？只聽她故作沒事幽幽到來 \"We've all got to move\
  \ on, right? Forget and move on\"，但自承「討厭做飯」而證明此前都是偽裝的 Magda帶著鼓勵堅定道來：\"Never forget\"\
  ！隨著那支遠古異教「護身符」的交棒，過去受害生了孩子如今苦苦 \"move on\"的 Miriam 怔怔地抱著女兒，似乎開始懂了什麼...\n\n\n\n \
  \       以牙還牙，前基督教正義\n\n此片拍得非常隱晦、但也極具聯想空間！我把我心裏想的世界觀講明白好了：(1) 此片過去線，Tomaz 雖照顧 Miriam\
  \ 但最後忍不住強暴了她，後來兩人各自輾轉成了難民來到英國 move on；(2) 此片 Magda，就是異教的正義女神，要為受強暴女子討回公道的，會偽裝成楚楚可憐的女子引誘男標靶上鉤；(3)\
  \ 此片修女 Sister Claire，是正義女神的代理人，負責把標靶引介過來讓 Magda誘惑上床；(4) 只要男標靶一和 Magda上床，就要承受女性被強暴的苦楚：懷胎外來異種、生產撕心裂肺、身心無限受創；(5)\
  \ 閣樓母親其實是過去強暴犯，正受懲罰中，Tomaz 則是下一位。\n\n至於 (6) 那個「護身符」Amulet 又是什麼？它在 Tomaz犯下強暴前就出現，難道早在犯案前正義女神就已盯上了？這是一種「預防性監控」的概念？我倒覺得把全片回顧起來，這個異教女性形象的「護身符」更像是個考驗：女神已經預見你有犯案之虞了、化作護身符前來盯著你，看你拿了護身符知道「有神明在看」時、是否能夠謹守本分做個好人不傷害別人；如果你傷害了別人，就算你推說是「處境悲慘」「壓力很大」「心裏扭曲」「精神失常」「一時失手」、就算你願意「洗心革面」「將功折罪」「奉獻救贖」，基督教也許會放過你，前基督的異教女神可沒要放過唷。\n\
  \n此片作為恐怖片或驚悚片，我覺得驚悚在於「世界觀」的大翻轉：一開始我們都關心男主角、同情男主角、敬佩男主角，好希望看他和女主角濃濃愛意開花結果，達成《春光之境》那種異國人們相濡以沫以愛撫育的神性故事，甚至是孤心悲憤的人們可以放下對立攜手共榮的「救贖」故事；但到後來，我們發現男主角是有罪的、卻又逃避罪咎、只想忘卻過去重新向前、洗心革面成為好男人就能\
  \ move on，這在基督教「救贖」敘事下好像往往也能通？但編導 Romola Garai 顯然並不認同這套基督教「救贖」敘事，而自創了一個「前基督」的異教神祇，實現「以牙還牙」的正義。\n\
  \n\n\n果然，我就覺得 Romola Garai 這位近年放下少女時期「古裝玉女」與「英倫玫瑰」等形象的青壯年演員，以她近年不惜違逆主流也要對各種社會正義關注發聲的意識，一定不會拍一部舒服勵志的好棒棒故事、而會拍一部令人寒毛直豎渾身不自在的正義故事，而且這「另類正義」以我們習以為常的主流觀點看都會頭皮發麻的：一個男生這麼貼心了，為什麼女生都不笑？一個男生這麼悉心照顧了，為什麼女生不以身相許？一個做過錯事的男生都洗心革面了，為什麼女神還念念不忘他過去荒唐？一個努力贖罪的男生都做這麼多事功施這麼多恩惠了，為什麼女神還堅持要他受罰？\n\
  \n說極端點，犯過罪的人做再多彌補，都只是「逃避」而已，或用基督宗教的語言來說就類似「贖罪券」：只是用自己的價值觀去把罪咎打負分、把事功打正分，然後自我中心地給一生的罪咎與功業加加減減算出個總分、只要總分是正的甚至是高分就得到救贖？但對受害者來說，你就是簡單一個「負分」的加害者，你若沒有把這一次加害所造成的傷害給全數如實承擔，是沒有資格奢言「救贖」的。此片這種世界觀，誰看了會點頭認同、誰看了會嗤之以鼻、誰看了會坐立不安、誰看了會皺眉深思？也許都是給我們觀眾的考驗。推薦關心廢死議題與性暴力問題的觀眾，認真欣賞。\n\
  \n\n--"
