title: '[問片] 護送被附身的女孩去修道院'
content: "是前幾年在電視上看到的電影\n\n裡面演到一群人要護送一個被惡魔附身的女孩去修道院\n\n但其實是惡魔要潛入修道院的計劃\n\n裡面抄寫聖經的教士全部都被惡魔殺死\n\
  \n後來是主角好不容易才打敗惡魔\n\n最後畫面是男主角騎著馬載著女孩走在山嶺上\n\n\n\n印象只有這麼多\n\n感謝各位～～\n\n--\n      \
  \     千觴伴飲江湖行，生死何曾至心頭，人說萬夫勇，誰能不負我？\n           欲待伊人共偕老，塞外牛羊空許約，此心托飛雁，情關難闖過。\n  \
  \         聚賢山莊誰堪敵，少室山上戰群雄，豪氣三千丈，榮辱誰與共？\n           金戈掀起九州劫，鐵蹄過處山河破，恩義兩難全，故土歸不得！\n\
  \           恨！            天地難容我！    罷！        無敵又如何？\n\n--"
