url: https://www.ptt.cc/bbs/movie/M.1548862720.A.7D7.html
title: '[問片] 美國恐怖片 手被附身自己砍掉'
content: '小時候1X年前看的美國電影



  主角不小心害死自己的朋友

  結果朋友的鬼魂還一直跟在旁邊


  然後好像他的手被附身 逼不得已只好把他砍下來

  結果他的手就到處亂跑殺人


  印象中有開著一台類似怪獸卡車那種卡車跑到一個派對裡面


  印象最深的是那隻手從上面跳下來跳到一個人的頭上

  然後直接把他的頭皮整塊先起來


  印象中大概是這樣  有錯請指正


  這部片已經在我心中埋下很久的疑問了

  不問出來心裡會癢癢的


  感謝各位大神


  --

  感謝大大  一po馬上就解答了

  幸好記得內容差不多

  解了好久的疑惑'
