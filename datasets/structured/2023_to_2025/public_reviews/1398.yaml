url: https://www.ptt.cc/bbs/movie/M.1604710206.A.94B.html
title: '[情報] 孤味 女巫 紙花 附身符 藥命時空  10+1新'
content: "本週新片有國片《孤味》，拍出了台灣家庭中的女性們生活中的溫暖與辛酸，安海瑟薇的\n 《女巫們》也同樣在本週上映，腐女們則不可錯過BL名作《GIVEN~被贈與的未來劇場版》\n\
  \n\n \n☆導演：許承傑\n\n，描述獨自撫養三個小孩長大的單親媽媽，在接到一通電話後，發現她不但\n得面對自己內心多年來的怨懟，也在處理和三個女兒關係的難題。\n\
  \n\n \n\n☆主要演員：梁家仁 、、句號\n\n。講述一個十八歲來合肥上大學的美術生\n張小雨，在這個城市裡自己所謂的「天才藝術」屢遭失意，直到失落離開，久居山裡。\n\
  \n\n \n\n\n，描述小男孩在旅館無意間撞見了巫婆的聚會，小男孩\n被巫婆施法便成了老鼠，在祖母協助下，與祖母合力破壞了巫婆的壞計畫。\n\n\n \n\
  ☆導演：賈斯汀·班森(Justin Benson) 、亞倫穆赫德(Aaron Moorhead)\n\n\n紐澳良擔任第一線救護人員的史蒂夫和丹尼斯遇上一連串恐怖命案，這些死亡事件的線索\n\
  通通指向案發現現場發現的一種神祕藥物......\n\n\n \n\n☆主要演員：伊梅達史丹頓、、卡菈尤利、艾力克薩克魯\n\n自軍中退伍的托瑪斯因事故而無家可歸，一名好心的年輕女子瑪格達收留了他，讓他暫住\n\
  在她與母親所居住的小屋內避難。他卻反身陷噩夢般的詭異小屋。\n\n\n \n☆導演：弗雷德里克提里爾(Frédéric Tellier)\n☆主要演員：凡桑侯提耶、安娜伊·德慕絲提、皮耶尼內\n\
  \n巴黎的一名消防員法蘭克，在一次出勤救火時，為了拯救隊員，自己反而陷入危機。當他\n醒來後發現自己臉部融化變形。面對意外毀容，他與妻子如何面對生活巨變？\n\n\
  \n \n☆導演：高勳\n 、柳真\n\n為了龐大的經濟壓力而不得不加入大型禮儀公司的禮儀師松吉，面對溫暖收容弱勢的麵店\n老闆不幸病逝，他有勇氣力抗冰冷的制度，替麵店老闆辦一場體面的告別式？\n\
  \n\n \n\n☆主要演員：金珉禧(Kim Min-hee) 、徐永嬅 、宋善美 、金璽碧 、權海驍\n\n\n這次聚焦在女子們「午茶閒聊」式的流言耳語，當丈夫出差，妻子準備與三位好友相見，\n\
  彼此表面下的內心暗潮洶湧與慾望。\n\n\n \n\n動畫影集以高中生的真冬與立夏兩人間悲傷恬淡的愛情為主軸，首部劇場版則為大人組\n三人的春樹、秋彦、雨月，熾熱的三角戀拉開序幕。\n\
  \n--\n \n\n\n出獄後的洪宗道，被死者家屬的女兒所吸引，展開奇異的戀曲。想在一起的他們遭遇現實\n不公不義事件，命運是否就此放過戲弄他們的機會呢？\n\
  \n--\n\n11/5 - 11/22  2020台北金馬影展   \n\n\n\n\n\n--"
