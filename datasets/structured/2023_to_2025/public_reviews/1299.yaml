url: https://www.ptt.cc/bbs/movie/M.1651429906.A.B28.html
title: '[新聞] 《飢餓遊戲》前傳《鳴鳥與游蛇之歌》電影版宣佈上映檔期！'
content: '新聞網址：


  早在 2020 年便宣佈展開籌劃的《飢餓遊戲》（The Hunger Games）系列前傳電影《鳴鳥

  與游蛇之歌》（The Ballad of Songbirds and Snakes）今天正式在 Cinema-Con 公開了

  上映檔期：2023 年 11 月 17 日。


  《鳴鳥與游蛇之歌》改編自原作者蘇珊柯林斯（Suzanne Collins）在 2020 年發行的前

  傳小說，故事設定在《飢餓遊戲》首部曲的六十四年前，主角是年少時期、尚未當上施惠

  國總統的科利奧雷納斯史諾，此時的第十屆飢餓遊戲初次決定也要另行額外抽出負責訓練

  參賽者的導師，史諾獲選成為那首批二十四位導師的其中一人，並負責指導一名來自第十

  二區的少女露西格雷貝爾德 。


  《鳴鳥與游蛇之歌》電影版依舊由執導前三部《飢餓遊戲》電影的法蘭西斯勞倫斯（

  Francis Lawrence）掌舵，二部曲《飢餓遊戲：星火燎原》（The Hunger Games：

  Catching Fire）編劇之一的麥可阿恩特（Michael Arndt）回鍋操刀劇本，蘇珊柯林斯本

  人亦負責撰寫劇本論述（Treatment）。


  另一部同屬獅門影業的《捍衛任務》（John Wick）系列衍生作品《芭蕾舞伶》（

  Ballerina）今日也於 Cinema-Con 確認將在暑假開拍，並證實先前的新聞，安娜德阿瑪

  絲（Ana de Armas）是此部外傳的女主角。本片由《決戰異世界》（Underworld）導演藍

  魏斯曼（Len Wiseman）操刀、《捍衛任務 3：全面開戰》（John Wick：Chapter 3 –

  Parabellum）編劇之一的謝海頓（Shay Hatten）執筆劇本。




