url: https://www.ptt.cc/bbs/movie/M.1701154629.A.1F0.html
title: '[普好雷] 人性鬼故事的鳴鳥與游蛇之歌'
content: '其實應該是要給好雷的 但第三篇章真的是很可惜

  明明是兩大主角角色轉折的最重要篇章

  卻反而顯得混亂跟轉折太跳躍 搞的Snow的情緒感覺很躁帶點突兀


  過程跟為何都合理 就是好像沒啥循序漸進的鋪陳 一直爆來爆去

  就是覺得前面都蠻棒的~ 才因此覺得可惜


  原本以為會主打的主角是黑雪 但其實他比較像是大配角

  一個串場帶動劇情的工具人 然後歌真的唱的是很好啦沒話講

  以後少話一點 專心演好戲~ 歌這麼香是還能徵一隻眼閉一隻眼

  而且這次角色的設定 跟她本人比起白雪要貼切太多了


  真正主角 還是在Snow如何墜入西斯的入魔史

  而且比起星戰其實要細膩跟完整陳述 如何掙扎 如何賣掉好友

  如何痛哭後悔 最後如何還是捨掉了自己的道德觀

  這個角色真的是在電影裡被刻劃的精彩 飢餓遊戲裡的人性也是


  就是因為他不那麼純白 又不那麼純愛 透過劇情還彷彿讓觀眾感同身受

  所以讓人覺得豐富~ 相信每個關鍵時刻 每個觀者也同時在思寸

  換成自己在那個位置 會動手殺人賣 會賣掉好友自保嗎 會連另一半都割嗎


  與之相比 原本的飢餓遊戲電影版刻劃的人性簡直是飢餓家家酒呀


  --'
