title: '[好無雷] 飢餓遊戲：鳴鳥與游蛇之歌 '
content: '這部拍的比本傳好非常多

  不愧是小說改編，150分鐘劇情很飽滿

  兩位主角我覺得很適合各自的角色

  Rachel Zeglar滿適合演這種有點欠打的肖婆符合戲外的言行，另外唱歌有好聽到

  Tom也有把史諾的靈魂演出來，看的出好演技

  另外IMAX的時長有到50-60%左右，

  大螢幕看還滿過癮的，雖然有些地方看的出經費有限，但整體帶入感很強烈


  --'
