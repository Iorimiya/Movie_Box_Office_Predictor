url: https://www.ptt.cc/bbs/movie/M.1582383683.A.8C3.html
title: '[ 好雷] 音速小子-導演與粉絲們的勝利'
content: '先講缺點


  本片可以看得出預算不是很高，動畫的部分有些地方確實看起來不太自然，真實的人類角

  色與索尼克明顯存在於兩個不同的圖層上。


  如果說阿凡達的特效是十分滿分極度自然的話，音速小子大概只能拿個五分以下


  但因為角色本身的設定就是動畫人物，也因此這個缺點雖然明顯但意外的不會讓人感到不

  舒服


  再來是優點


  金凱瑞絕對是本片最大的驚喜與賣點了，他的浮誇演技剛好襯托了索尼克這個同樣浮誇的

  角色且不會感到不自然，兩人互補之下讓整個電影生動有趣多了


  索尼克重新設計的造型絕對是大大的加分，尤其是導演肯聽粉絲們的心聲冒著好萊塢政治

  正確的大不諱重新修改外型這一點感動了許多原本沒打算要去看的粉絲


  動作場景的設計會讓有玩過遊戲的人產生共鳴，尤其是最後的高潮部分，那一段應該是特

  效花最多錢的部分，質量比起其他片段明顯進步了一個層次


  劇情雖然不算創新，但自然流暢的敘述方式推動整個電影的進程，節奏抓的剛剛好讓人看

  的很舒服


  也難怪外國的youtuber們一致給了本片非常好的評價，這是一個導演與粉絲們交流激盪出

  來的傑作，導演肯用心而粉絲們也以實際行動回應製作團體們的努力，可以說給近來被政

  治正確文化給污染的好萊塢帶來一股清流


  觀眾們只想看好看的影片，那些想要夾帶政治私貨的請自己去另外創作它們自己的電影，

  而不是強迫性的硬是要把自己的意識形態塞入跟政治無關的電影裡面




  --'
