url: https://www.ptt.cc/bbs/movie/M.1447704269.A.664.html
title: '[神雷]繼壞小子巴比、blind後 再度打動我的神作 '
content: '我又挖到寶了，繼1993年那天，我第一次看完「壞小子巴比」這部電影，


  那個時候，我就知道自己的眼光跟世俗、凡人不一樣，


  我忍痛把這部片講出來，已經是違背我在電影版上不傳授好片的原則，


  我知道我的品味一直在領導電影版，很多人常搜我id，一看到我講什麼冷門片好看，


  馬上就去找來看，然後佔為己有，好像是他先發現的，故意不提到我的名字，


  來向朋友炫耀，好像自己多有知識一樣，


  像當初「竊聽風暴」也是因為我最先開始推薦，很多人才跟風跑去看的，


  會有這麼多人知道這片，我不敢講全部，大概有六成是我的功勞，


  像去年我看了blind，我只看了三分之二，就一直忍住後面不看，


  對於我來說，電影就像是在品酒，愈陳愈香，有時候會捨不得一次喝完一瓶的那種感覺，


  今天我又上來舒發我的情感，是因為我又看到一片神作，


  真的這部片完全就是天賦才能才導得出來，一查不意外，該片是導演第一次拍，


  2003年的片子，那種影像的質感，角色的塑造，故事的編排，都屬上乘之作，


  很可惜，我不能告訴各位，


  如果又讓你們知道，這片就會low掉，為了保護這部片，我不能講出來，


  讓「壞小子巴比、blind」步入「竊聽風暴」的這種後塵，


  不是我樂見的，


  我是真的感到很遺憾。





  --'
