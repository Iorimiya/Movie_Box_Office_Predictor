url: https://www.ptt.cc/bbs/movie/M.1648640327.A.3CA.html
title: '[新聞] 金凱瑞回歸喜劇！再演《音速小子》蛋頭博士：我會變得更壞'
content: "新聞網址：\n\n2022/03/30 19:07:00\n\n記者廖俐惠／綜合報導\n\n\n\n▲《音速小子2》即將上映。（圖／UIP提供）\n\
  \n\n全世界最受歡迎的藍色刺蝟又回來了！《音速小子》於2020年上映在全球大獲好評創下近\n3.2億美金的亮眼票房成績，《音速小子2》片中將有一場升級版的精采冒險。製片尼爾摩\n\
  里茲說：「《音速小子》保留了遊戲玩家喜愛的一切，同時也增加了令人驚喜的面向；而\n續集《音速小子2》集結所有電影喜愛的元素—精彩動作場面、幽默風趣橋段以及索尼克\n\
  與人類夥伴之間的真摯情誼，還加入兩位新的角色。」\n\n製片摩里茲繼續說：「索尼克是一個很棒的角色，很可愛有觀眾緣，現在，我們想要擴大\n這個音速小子宇宙，動作場面更大更多更精彩，增加更多新的角色，打造全新且不可思議\n\
  的冒險旅程，等著和索尼克一起闖關去。」\n\n\n\n▼▲金凱瑞「蛋頭博士」回歸。（圖／UIP提供）\n\n\n\n對金凱瑞而言，蛋頭博士的角色是他回歸自己傳奇喜劇電影的機會。他說：「（這個角色\n\
  ）激發觀眾對經典喜劇的熱愛，以及像是《王牌威龍》、《摩登大聖》和，《阿呆與阿瓜\n》等電影的氛圍。扮演蛋頭博士時，我是毫無保留地全力以赴！」\n\n蛋頭博士回歸續集，這個智商超過300的光頭大鬍子狂人變得更大、更壞、更有趣，金凱\n\
  瑞說，蛋頭博士新的鬍子造型已經達到了神奇的比例，是「另一種展現蛋頭博士自我的形\n式。你知道，他越自以為是，不滿的情緒就越高漲，對索尼克的怨恨就越深，鬍子也就越\n\
  大了！鬍子給了他力量，是他自大狂個性的具體表現。」\n\n\n\n▲《音速小子2》詹姆斯馬斯登、蒂卡桑普特回歸。（圖／UIP提供）\n\n《音速小子2》一片由《玩命關頭》及《死》系列電影幕後工作團隊精心打造，堅強的演\n\
  員陣容包括再度回歸演出的詹姆斯馬斯登、為索尼克配音的班許瓦茲、蒂卡桑普特、娜塔\n莎羅斯威爾、亞當帕利以及金凱瑞，新加入的演員則是薛馬摩爾，以及為納克魯斯配音的\n\
  伊卓瑞斯艾巴和為塔爾斯配音的柯琳歐尚納希，台灣訂於4月1日連假檔期搶先美國上映。\n\n▼（影片來自YouTube－派拉蒙影片 官方頻道，若遭移除請見諒）\n\n\
  \n\n看WIKI上寫這次音速小子2預算1.1億美金，比上一集9000萬美金來的更高\n\n不過也早早宣布要製作第三集了\n\n--\n (經本人要求後刪除該推文)"
