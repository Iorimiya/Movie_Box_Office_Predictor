url: https://www.ptt.cc/bbs/movie/M.1648828236.A.98F.html
title: '[ 無雷] 單日音速小子+魔比斯無雷心得'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  前幾天看了中文版音速小子特映太興奮，今天陪家人再看一次英文版+魔比斯

  也蠻多朋友問連假推薦哪部，就來分享一下，純屬個人意見鞭小力一點QQ




  1.特效方面

  音速小子大勝，還原遊戲內容、角色、場景。

  魔比斯的特效與其說是特效不如說像是遊戲內人物角色的殘影，不過風格我是蠻喜歡的。



  2.動作方面

  不知道sony 是怎樣，永遠在決戰或是重要的打鬥畫面都又黑又亂。

  音速小子倒是可以看得很過癮，至少清清楚楚大場面又多。



  3.劇情方面

  音速小子不用動腦但純靠金凱瑞真的大加分，把反派演的活靈活現的。

  魔比斯就如同幾篇負雷提到的bug 太多，彩蛋也很湊的感覺。（而且如果是遊戲迷看到音

  速小子最後的彩蛋會高潮）



  因為抱著內容炸裂的心情去看魔比斯，所以反而覺得沒那麼悲劇，至少我覺得比猛毒二好

  （女主角太正哩><)







  結論：只能挑一部的話我應該會讓自己選音速小子





  題外話，音速小子其實沒看第一集也看得懂二啦



  --'
