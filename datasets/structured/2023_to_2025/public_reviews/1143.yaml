url: https://www.ptt.cc/bbs/movie/M.1652064577.A.100.html
title: '[新聞] 音速小子2票房破3.31億美 成成長最速電玩'
content: '新聞網址：


  《音速小子2》全球票房破3.31億美元，成票房成長最速電玩改編電影





  改編自同名電玩遊戲的真人版電影《音速小子 2》自 4 月 1 日上映至今，全求票房已突

  破 3.31 億美元（約新台幣 98 億元），並成為電玩改編電影史上票房成長速度最快的作

  品。





  前作《音速小子》（2020）還在宣傳階段時，索尼克造型引起粉絲負評，製作團隊多花

  500 萬美元（約新台幣 1.4 億元）幫索尼克整形，電影最終成本 8,500 萬美元（約新台

  幣 25 億）。


  《音速小子》北美首周票房破 5,800 萬美元（約新台幣 17 億元），可惜當時全球新冠

  肺炎疫情爆發，各地影院以防疫為由暫時關閉，以致官方早早釋出數位版。不過最終全球

  票房還是有 3.19 億美元（約新台幣 94. 5 億元）。


  而續作在北美的首周票房有 7,210 萬美元（約新台幣 21 億元），亦於全球 47 個國家

  創下首周票房冠軍的紀錄。台灣的累計票房約新台幣 1,500 萬元。


  《音速小子 2》由 Jeff Fowler 執導，Pat Casey、Josh Miller 編劇，配音陣容有

  James Marsden、Ben Schwartz、Tika Sumpter、Natasha Rothwell、Adam Pally、

  Shemar Moore

  、Jim Carrey，以及新登場的 Idris Elba。


  根據派拉蒙影業先前的公告，將與 SEGA 繼續製作第三集與納克魯斯為主角的原創系列真

  人電視劇。


  ===================


  老實說滿意外的 感覺第二集宣傳差第一集很多 居然還成長更快 最近太忙 一直忘記去電

  影院看


  --








  --'
