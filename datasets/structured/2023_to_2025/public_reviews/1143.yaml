url: https://www.ptt.cc/bbs/movie/M.1648655830.A.AF4.html
title: '[好無雷]  音速小子2'
content: '有幸因為特映會搶先看到了音速小子2這部誠意滿滿的續集!


  看完電影的感想—絕對是好雷，誠實的說，喜歡第一集的絕對會更愛這部續集，反之亦然

  ，場面更大，夥伴加倍，主觀認為續集也是定位在闔家觀賞，但大人小孩都可以看得很開

  心，該給的也全部給滿滿，根本就是特效大片等級了。


  再來戲份的部分，人類(男女主角的部分)，音速小子，蛋頭博士，三者其實蠻均衡的，人

  類不會喧賓奪主，金凱瑞依舊很搶眼，真不愧是原版謎天大聖loll


  延續第一集SONIC給人的感覺，就像是刺蝟版的死侍，但不說髒話，整部相較第一集，因

  為有了更多腳色可以發揮，明顯感覺到導演想要同時服務好遊戲粉絲，成人，小孩三個面

  向，很多致敬遊戲的地方，但不懂也不會影響觀影情緒，懂得則是會會心一笑。


  最後，缺點或著是說沒那麼好的地方也是有的，節奏部分前半部有些為了讓氣氛輕鬆而出

  來的劇情，個人覺得有點不太必要XD，不過就是因人而異，後半部就會漸入佳境了。


  --'
