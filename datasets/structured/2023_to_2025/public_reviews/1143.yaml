url: https://www.ptt.cc/bbs/movie/M.1707234244.A.6D6.html
title: '[新聞] 朱延平面子無價 陶喆免費送《小子》'
content: "朱延平面子無價 陶喆免費送《小子》\n\n2024/02/06 05:30\n\n\n導演王毓琦（左起）、監製朱延平、陶喆、李霈瑜、陳昊森、吳宗修、譚艾珍昨現身《小\n\
  子》首映會，現場準備彩球預祝票房大賣。（記者陳逸寬攝）\n\n〔記者廖俐惠／台北報導〕賀歲片《小子》昨舉行首映會，談到邀請陶喆重新翻唱亡父陶\n大偉民國75年《好小子》經典電影歌曲《小子》，監製朱延平透露，「陶喆一口答應，免\n\
  費、完全送我，他說爸爸走了10年了，想替爸爸做點事。」陶喆則坦言當初覺得這首歌有\n點「土」，讓他趕緊朝著天上道歉：「爸不好意思喔！」\n\n被問到陶喆還是陶大偉唱得比較好，朱延平不敢回應，指著天上說：「我怕上面那個不高\n\
  興，他最氣人家說唱歌比他好聽、比他還帥！」不過朱延平表示很想念老朋友，更進一步\n指出這部電影斥資8000萬拍攝，笑說自己的老臉都賣光了，還找來當年在《好小子》飾演\n\
  奶奶的譚艾珍回歸演出，朱延平感謝這位40多年的好友：「她不談價錢，不漲價。」\n\n電影走過疫情終於要上映，朱延平有感而發：「每部戲都有他的命，努力誰都會努力，會\n\
  不會成功要看命。」朱延平認為《小子》的命很硬，大家撐到了殺青記者會才集體確診，\n朱延平還爆陳昊森想送水果給確診的他，結果自己也中了。至於陳昊森則虧童星釋小願、\n\
  吳宗修「都不教我武功」，不過在殺青那一天竟不捨的全都哭成一團，可見其好交情。電\n影《小子》8日上映。\n\n\n\n--\n佛法的\n 是菩薩成佛之道\n \
  \       是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
