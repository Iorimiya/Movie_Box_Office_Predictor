title: '[新聞] 老粉絲心臟衝擊準備！《音速小子》動畫電'
content: '新聞網址：



  前陣子派拉蒙公開他們準備要製作和發行電玩公司ＳＥＧＡ（世嘉）的代表作《音速小子

  》其電腦動畫電影，於是公開了一張黑影海報，雖然造型引來網路和相關粉絲間的熱烈討

  論，但大多是以嘲笑和不滿等負面情緒居多～


  如今透過廣告贊助商 Hamagami / Carroll，Inc 和 Polygon 兩邊的推特，我們能大致知

  道《音速小子》主角－索尼克的樣子。當然電影用ＣＧＩ將角色寫實化，所以有毛髮很正

  常，可是為何手套的部分也有毛髮呢？


  另外 Hamagami / Carroll，Inc 的推特也證明索尼克鞋子是 Cortez 鞋款，很顯然這證

  明了此部電影的贊助商之一就是 Nike。


  雖然小編ＰＯＰＯ不喜歡沒看到成品就發表相關看法，但是看到這樣的人物設定，也不難

  理解電玩老粉絲會有點反彈的原因～


  《音速小子》動畫電影將在 2019 年 11 月 8 日上映




  -


  我還是去看名偵探皮卡丘好了....


  --'
