url: https://www.ptt.cc/bbs/movie/M.1582451838.A.B58.html
title: '[好雷] 音速小子- MEGA也想撈一筆'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n本來是抱著緬懷回憶的心態去看音速小子，卻意外發現其實是一部老少咸宜的好電影。\n\
  劇情開頭從Sonic的背景講起，Sonic打從娘胎出生就擁有跑超快的超能力，常被老師long\n claw告誡著\"能力越大越帶賽\"，果然在一次事故下被壞人覬覦，只能使用在電玩中代表\n\
  著積分值的金色指環來穿越地圖，開始亡命天涯。\n內心渴望朋友的Sonic在一次逃亡意外中邂逅了人類主角，並在一番波折下成功打敗美國\n政府派來的蛋頭博士，可喜可賀。\n\
  \n反派的部分，請了金凱瑞飾演蛋頭博士，因為原電玩中並沒有太多對蛋頭博士的設定，所\n以感覺的出來電影版是演員自己琢磨出來\"一個高智商.自戀.不信任感深的角色\"\
  ，並在反\n派場景中去展現他向來的強項\"浮誇式搞笑\"，但是我只能說在這信息爆炸的時代，這樣的\n演技似乎也止步於他十幾年前的作品了....\n\n較真來說，音速小子是一部很平凡的卡通真人化電影，特效一般.劇情普通.人類主角存在\n\
  感低，但為什麼還是仍給人值得一看的感覺呢? 我想主因是因為導演很清楚此片的定位，\n就是吃電玩粉絲的票房，所以劇中除了必要的劇情去呈現人類主角的背景外，多數都把焦\n\
  點牢牢鎖定在Sonic身上，並且參考marvel電影快銀的時間暫停般的畫面，去豐富觀眾對S\nonic的超能力的呈現，當然也少不了電玩中常出現的集氣衝撞，在角色之間並不喧賓奪主\n\
  之下，配上偶爾出現的笑點，整體的耐看度大大的提升。\n\n就算不是電玩粉，單純只是想帶小孩或是三五好友去看藍色刺蝟耍帥，該片本質上的平凡\n劇情也不會讓你覺得突兀難受XD\n\
  \n\n--\n有什麼問題嗎? @@\n:) 多謝\n嗯嗯，我也希望他能走出之前的低潮，更上一層樓了\n一開始沒注意打錯了，應該很早就修正了吧?\n大陸小說看多了確實有時候詞彙會不知覺用上他們的，不過我想語言本來就是一體多面的\n\
  ，用\"洗腦\"兩字不知道是否太過負面? 總而言之還是感謝您們的指教。\n很喜歡他以前的作品，所以希望他也能借這個機會突破自己:)"
