url: https://www.ptt.cc/bbs/movie/M.1736622476.A.A0E.html
title: '[好雷] 音速小子3 好看 彩蛋疑問'
content: '這集看的蠻爽的人類劇情少到不行了


  該打就打也不拖泥帶水


  就打鬥部份我覺得少了一些子彈時間


  稍微可惜


  而且變成超級音速小子 就都用拳頭


  沒有彈來彈去


  夏特騎摩托車也有學一下阿基拉


  想問一下 那個女主任是想反水嗎？


  不然怎麼最後要拿走卡片


  然後遇到假華特又還回去


  還是她單純用卡片當誘餌一次把他們抓起來


  --


  彩蛋最後是機械音速小子 和艾咪登場


  這樣感覺是不是要演原本星球出事了？


  可以回去找長爪？



  --


  希望之後可以出狼人版本 遊戲玩過蠻爽的




  --

  感謝提醒'
