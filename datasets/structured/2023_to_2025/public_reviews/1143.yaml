url: https://www.ptt.cc/bbs/movie/M.1641743287.A.EA6.html
title: '[討論] 赤腳小子 江湖傳說的反派好聰明'
content: '1993的赤腳小子 江湖傳說算翻拍邵氏的洪拳小子？總之集結了狄龍 郭富城 張曼玉 吳倩蓮等巨星，導演還是大導杜琪峰


  裡面反派好聰明喔，我一開始還想說袁大人都知道段雲要被害了還不去救他，原來是要坐等段被害死，關抓狂去打天龍坊啊！


  然後天龍坊中老大一開始還裝無辜反殺關，後面布下一堆殺陣，有群毆、灑石灰，暗器到後面丟金子煽動路人


  真的是我看過數一數二智商在線的反派了，在場欣賞打鬥還有人護衛，該跑就跑


  更不用說前面陷害關 布局殺段了


  九十分鐘真的滿有趣的故事，加上精彩主題曲


  -----

  Sent from JPTT on my Asus ASUS_X00PD.


  --

  後來還把吳關起來 真的很壞'
