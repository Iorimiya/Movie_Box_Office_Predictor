url: https://www.ptt.cc/bbs/movie/M.1582432196.A.283.html
title: '[負雷] 看完很不嗨的音速小子'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  我不是重度電玩迷，但小時候玩過不少次。



  先講優點：


  1. 開頭音速小子出生地畫面美、也有很多致敬的地方。


  2. 接著第一次滾球攻擊非常帥氣、也很感動。


  3. 最後彩蛋的部分，誠意十足。




  缺點的部分：


  1. 人戲過多。


  其實我根本不在乎男女主角在幹嘛，單純想看音速小子和蛋頭博士大戰。


  2. 劇情薄弱、不知所云。


  這點我是跟名偵探皮卡丘做比較，皮卡丘那部是主角為了找到父親消失的原因，慢慢鋪陳。

  然而這部從頭到尾男主角非常路人，沒有任何推進劇情的作用。

  甚至酒吧那段完全沒必要，看了十分尷尬。



  3. 打鬥、特效過少。


  基本上滾球攻擊就1次，剩下就在逃跑，接著就是最後大戰。


  感覺剛搔到癢就結束，看得不太過癮。




  岔題一下，

  我看到一半時，腦袋一直想這部為何會破電玩改編電影的票房紀錄




  以上是我的心得，感謝觀看！




  -----

  Sent from JPTT on my iPhone


  --'
