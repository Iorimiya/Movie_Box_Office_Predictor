url: https://www.ptt.cc/bbs/movie/M.1713212912.A.CD3.html
title: '[情報] 基努李維正式加盟《音速小子3》'
content: '基努李維將在《音速小子3》 中飾演影子。




  基努李維已正式確定在《音速小子3》中飾演影子。



