url: https://www.ptt.cc/bbs/movie/M.1634914930.A.C88.html
title: '[新聞] 2022奧斯卡 香港代表：媽媽的神奇小子'
content: "新聞網址： (hk01)\n\n\n\n\n監製兼主演的吳君如坦言：「我吳君如真的是做一萬次夢都沒想到自己監製的電影，可以\n代表香港角逐奧斯卡最佳外語片。今日剛剛謝票完第72日就聽到這個消息，坦白講真的是\n\
  驚訝多過開心，驚訝完之後就真的是喜極而泣。」\n\n她又笑言希望謝票謝到明年奧斯卡舉行， 最重要是多謝導演尹志文、台前幕後的專業人\n員， 尤其是這一群優秀香港年青演員。\n\
  \n至於導演尹志文收到消息後瞬間哭了出來，冷靜過後表示這個神奇之旅帶給他很多很多，\n一定要多謝蘇樺偉及「蘇媽」蘇韓小貞成就這個故事以及監製吳君如的全情投入及協助，\n\
  亦多謝天下一電影公司及台前幕後的支持。\n\n「香港電影製片家協會」董事局按照「美國電影學院」角逐「奧斯卡最佳國 際影片」之\n選片準則，決定推薦由吳君如監製及主演；尹志文導演執導；張繼聰、梁仲恆、馮皓揚、\n\
  胡子彤等演出之電影《媽媽的神奇小子》，代表香港角逐「第 94 屆奧斯卡金像獎最佳國\n際影片」。\n\n\n\n-------------------------------------------------------------------------------\n\
  \n \n\n《媽媽的神奇小子》由金馬影后吳君如監製及主演，\n且由曾以《戀人絮語》提名過金馬獎最佳新導演的尹志文編導\n\n改編自帕奧金牌得主蘇樺偉的真實故事。1981年，蘇樺偉剛誕下便被診斷患上黃疸病，導\n\
  致腦部受損，注定一生將會是一個弱聽與四肢痙攣的殘疾人士，即使能逃過鬼門關，往後\n的人生只能依靠別人去照顧。 蘇韓小貞─ 蘇媽（吳君如飾）在危急關頭堅持搶救偉仔，\n\
  她決定即使兒子到八十歲還是不能走路，都誓要以她這副骨頭背起兒子一起走下去。\n\n吳君如飾演蘇韓小貞(蘇媽)、梁仲恆飾演蘇樺偉、錢小豪飾演蘇父\n張繼聰飾演方教練(原型為傷殘運動員教練潘健侶及香港田徑隊總教練歐陽家駒)\n\
  \n\n\n\n2021年《少年的你》│曾國祥 \n2020年《掃毒2天地對決》│邱禮濤\n2019年《紅海行動》│林超賢\n2018年《一念無明》│黃進\n\
  2017年《踏血尋梅》│翁子光\n\n--\n                                   10/22 23:04"
