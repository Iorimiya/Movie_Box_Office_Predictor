url: https://www.ptt.cc/bbs/movie/M.1648839884.A.102.html
title: '[好有雷] 音速小子2 電玩粉絲的心得'
content: '雷文防雷資訊頁




  會直接講雷的部分

  以下全用中文翻譯來講以防搞混

















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  完全沒想到片尾會直接拉影子出來，還帶出五十年前的設定

  整個突然，不知道他們要怎麼圓蛋頭祖父的部分

  影子的劇情單獨拍一集外傳可能都很難拍完




  遊戲設定重現的部分比第一集還多一倍吧

  不過納克的部份改的很大



  原始遊戲設定他是祖先貪圖寶石能量滅族了，再做為後代背負責任守護寶石

  電影卻直接把這個歷史拉到現在，納克反變成了奪取寶石力量的人

  然後多加了一個貓頭鷹族變成守護寶石的種族


  但他自己奪取寶石的理由，印象中電影沒詳細講過

  就只是他族人以前在做一樣的事，然後因為族人在奪取過程中全消失，有很大的懸念

  就繼續照著族人過去的行動走而已，找上索尼克也只是他跟貓頭鷹族一起行動


  結尾納克也轉的有點突然，就突然說要守護寶石不為他人所用

  不然我一度以為他最終目的是要拿寶石壯大自己族人，打暴貓頭鷹族



  雖然是有些許線索講納克的觀念，比如看到索尼克先救塔爾斯而不搶羅盤

  跟索尼克在水中救了他的轉變，但這跟他為了自己族人想做的事也不衝突

  奪寶石的詳細動機算是沒有講清楚的部份吧




  塔爾斯意外的沒脫離原始設定太多

  原本就是崇拜索尼克的英雄事蹟的跟班

  這次多了個音速小子是讓他一個技術宅踏出家門的原因


  不過電影專屬飛機(龍捲風號)的來源還真的挺隨便的

  就真的是路邊撿一台專門用，不是音速小子自己的飛機




  然後人類戲，很多人應該跟我一樣

  光雪山尬舞我就覺得這邊人類戲太多了

  沒想到後面那個女主的肥婆姐姐居然可以演一整段快30分的婚禮鬧劇

  還好後面的主要角色跟遊戲相關戲分給的很足，沒有被肥婆整個吃掉

  希望藍光有導演版，把那短婚禮鬧劇整個砍掉只留女主部份




  死亡蛋頭機器人部份，給金凱瑞博士操縱加分非常多

  原作這台機器人只會手伸長跟丟炸彈而已，最多加一個踩人

  但金凱瑞風格的戰鬥表現，比如鬍子打蚊子，手指走路打納克，鼻涕雷射

  比原作單純的巨大機器人整個好太多，算是超出預期

  第一集的金凱瑞博士只開一台戰機就沒有這種表現



  翻譯部份，我忘記第一集有沒有這樣了

  他跟以前東森幼幼的音速小子X一樣，把音速小子(稱呼)跟索尼克(名字)分開叫

  大部分喊音速小子的時候，原文都是講"這隻刺蝟"，算不錯的處理





  一開始的外星人類土著好像從頭到尾都沒講是三小


  其他有想到再補，準備二刷中配版


  --

  兩個不同台

  電影這次的是死亡蛋頭機器人Death Egg Robot

  出場在二代，後來在純白跟四代還有狂熱有再登場


  三代的叫巨型蛋頭機器人Giant Eggman Robot

  只登場過這一次



  不過不排除有融合設定，因為死亡蛋頭沒有用寶石能量驅動

  但巨型蛋頭有使用王者翡翠

  實際上台灣看音速小子2的人好像就沒那麼多

  沒有也很正常，我看台中日新還只有星光聽沒有超大至尊聽

  音速小子第一集至少還有至尊聽

  我二刷有一部份就是要再看一次納克設定，感覺有漏看





  補充一下為什麼覺得影子劇情難做

  影子在遊戲基本上是一個三方勢力互角造成的悲劇產物


  蛋頭的祖父想幫孫女瑪麗亞治病，研究製造出影子

  魔神樣子的外星人(???看到這裡很問號很正常)想征服世界

  跟蛋頭祖父交換條件，提供自己的基因製造影子，實際上要利用蛋頭祖父做終極兵器

  人類政府察覺蛋頭祖父在做武器，派軍隊攻堅太空殖民地把研究所的人幾乎全殺了

  瑪麗亞死了，蛋頭祖父在被處決前改寫程式，把對世界復仇的計畫植入影子的記憶中



  大冒險2的影子一醒來就在幫蛋頭祖父布局執行復仇計畫

  因為他被寫入的記憶中，瑪麗亞被人類政府害死

  就算被露姬揭穿他的記憶是捏造的，他也只說那就是他的全部

