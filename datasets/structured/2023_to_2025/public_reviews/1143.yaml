url: https://www.ptt.cc/bbs/movie/M.1582390602.A.B27.html
title: '[好雷] 快告訴我你去哪間醫美重塑《音速小子》'
content: "隔壁影評－快告訴我你去哪間醫美重塑《音速小子》\n\n圖文好讀 : \n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n大家好，我是老王。\n\n如果喜愛電動的朋友，對於《音速小子》的名號肯定不陌生。\n\n做為SEGA的招牌，怎麼能讓任天堂的當家明星在去年一攬票房呢！\n\n\
  重生的索尼克更加帥氣，更加可愛，更加的，像是90年代那個有點跩跩，但又酷萌可愛的\n藍色刺蝟。\n\n準備好了嗎？\n\n那麼，我們開始吧。\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n《音速小子》絕對是一部優秀且讓人感到滿滿誠意的電玩改編作品，而這其中重塑的造型\n\
  以及金凱瑞的加持功不可沒，雖然在劇情設定上讓索尼克的身世有了新的詮釋，不過其中\n展現出了的，的的確確是那個有點調皮，有點跩，些許自大以及正義感爆棚的藍色刺蝟。\n\
  而其中所隱藏的滿滿彩蛋，更讓曾經與《音速小子》電玩遊戲一起冒險的玩家感到滿滿驚\n喜，可說是粉絲與新觀眾都充分服務到了。\n\n\n《新生索尼克與金凱瑞》\n\n\
  新生的索尼克眼睛更大，也更符合我們對於當年對索尼克外觀的印象，而毛色看起來也更\n加柔和，看的出來整部作品只是將角色重作，就創造了非常良好的效果與票房，這五百萬\n\
  花的真的值得啊！\n\n此外金凱瑞更是讓整部作品的趣味性與有趣的怪異性都上升了好幾個階段，由金凱瑞所扮\n演的蛋頭博士雖然沒有我們印象中的光頭，但金凱瑞將蛋頭的壞笑完美重現，也讓這個角\n\
  色的趣味性上升了許多，最後更是滿足了遊戲粉絲的癮，化身成我們記憶中的蛋頭博士。\n\n不曉得大家有發現嗎？金凱瑞在劇中所駕駛的飛船，在外觀與配色上確實和我們熟悉的蛋\n\
  頭小飛船有哪麼些相似之處，此外索尼克在劇中得到的鞋子，也更像是我們熟悉的紅底白\n條紋。\n\n\n《娛樂性高的好故事》\n\n在新的故事裡，索尼克的身世變成了宇宙另一端的外星人，特殊身分也讓他的生活永遠在\n\
  黑暗中不能被發現，這也使得索尼克看到其他人與朋友一起相處時特別興奮，內在的他也\n是渴望朋友的，而對於綠山丘鎮的歸屬感，也讓索尼克在得知湯姆要離開時一時間無法諒\n\
  解。\n\n但通過願望清單，索尼克也與湯姆產生了他所渴望的友情與歸屬感，而其中的過程當然又\n是滿滿的致敬與歡笑，記得辣味熱狗嗎？那可是索尼克在動畫版中最喜愛的食物。\n\
  \n而片尾的壓軸片段更讓電玩粉或是對音速小子熟悉的人興奮起來，塔爾斯的出現與蛋頭博\n士的經典武裝武裝，讓我們相信這不會只是一次就結束的派對，我們更能期待他會成為一\n\
  個系列的開端，將更多令人懷念的角色帶上大螢幕。電玩粉們是怎麼說的？我們可還沒看\n到索尼克與夏特的對決，也還沒看到超級賽亞刺蝟的出現呢！\n\n\n《音速小子》透過聰明的選擇，有趣的故事，以及富含生命力的角色，將我們印象中的遊\n\
  戲角色帶上大螢幕，並讓他更討喜，更有趣。滿滿的致敬彩蛋也讓電玩粉過足了癮，加上\n結尾令人興奮的畫面，面面具顧了所有受眾群的感受。\n\n沒有孩子會不喜歡討喜可愛又帥氣的藍色小刺蝟，而我們也期待未來甚至能看到卡歐斯堡\n\
  石爭奪戰。\n\n我是老王，我們下次見。\n\n更多影評 : \n\n--"
