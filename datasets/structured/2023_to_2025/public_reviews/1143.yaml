title: '[新聞] 金凱瑞再度回歸《音速小子2》! 2020年由黑翻紅電影IP再出發'
content: '新聞網址：




  以賣座約新台幣 90 億元、排行在好萊塢2020年度賣座第三名的電玩改編電影《音速小子

  》，如今宣布拍攝第2集的喜訊，現在電影已於加拿大英屬哥倫比亞省進行拍攝，且新角

  色也會加入！



  過往世界影壇全球年度票房排行榜總被好萊塢佔滿名額，2020年疫情攪局使得好萊塢電影

  票房大受影響，罕見出現中國電影如 《八佰》、《我和我的家鄉》分佔全球票房一、三

  名，日本動畫《鬼滅之刃劇場版 無限列車篇》第四。而





  《音速小子》由傑夫福勒（Jeff Fowler）執導，上映前曾惹出主人翁刺蝟「索尼克」醜

  造型挨轟，使得團隊豪擲 3000 多萬美金虛心改進，上映後評價遠超越預期，從黑歷史谷

  底翻身，由黑翻紅逆轉勝，難怪第二集能歡樂開拍！



  事實上，派拉蒙影業去年7月便已宣布拍攝《音速小子2》的消息，目前檔期為2022年4月

  22日。根據外媒報導，除了導演傑夫福勒、編劇帕特凱西（Pat Casey）和喬許米勒（

  Josh Miller）回鍋執導與執筆，班許瓦茲（Ben Schwartz）繼續配音索尼克與面部動態

  捕捉，男女主角詹姆斯馬斯登（James Marsden）、蒂卡桑普特（Tika Sumpter）以及反

  派金凱瑞（Jim Carrey）都已回歸，甚至還被人直擊到金凱瑞被綁在起重機上的畫面並放

  上推特。



  我們在首集片尾以及續集預告中已經得知索尼克的「小跟班」塔爾斯（Tails），有著黃

  色雙尾巴的小狐狸即將現身，不過推特上也有暴雷照片，顯示一度成為反派，後來與索尼

  克結為好友的紅色針鼬奈克（Knuckles）也有可能會出現，而他的篇幅究竟是多少？或許

  也只能等待電影上映解答了！



  《音速小子》雖然歷經一番黑歷史，卻因為導演致力忠於電玩設定，還原索尼克有魔法金

  環、招牌紅色球鞋，甚至是讓他擁有超能力的渾沌綠寶石，不僅將這些元素融入劇情中，

  也帶出索尼克調皮又有幽默感的角色性格，使得電影大受歡迎，續集會如何表現，令影迷

  更加期待啦！



  --'
