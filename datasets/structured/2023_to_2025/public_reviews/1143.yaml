url: https://www.ptt.cc/bbs/movie/M.1584027525.A.3BF.html
title: '[好無雷] 音速小子'
content: '對於「音速小子」這個遊戲(動畫)角色

  我算是有好感 但並不算是粉絲

  也沒有玩過遊戲


  所以許多粉絲彩蛋 我也無從注意

  但電影對音速小子的角色塑造相當討喜

  (整形成功)

  會讓人覺得不只是外表可愛 行為個性也討人喜歡


  不過電影裡更重要的是金凱瑞飾演的蛋頭博士

  雖然是浮誇搞笑的風格

  但在電影中卻不會顯得突兀、出戲

  反而會被這個角色的瘋狂所吸引


  而在劇情敘事的部分並不複雜

  甚至有點老套 沒有什麼特別的驚喜橋段

  但整體而言算是一部可以讓人相當放鬆的電影

  也會期待往後續集的上映


  --'
