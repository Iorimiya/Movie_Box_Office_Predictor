title: '[好無雷] 音速小子2——SEGA全新財富密碼'
content: '今天休假直接衝早場，

  看完預告後期待的都有，

  預告沒演出來的好料有更多，

  算是蠻成功的電玩改編續集電影。

  尤其是蛋頭博士解除封印後演出更加昇華

  更多量身打造的情境讓金凱瑞發揮即興演出

  導演根本就是金凱瑞腦粉。

  納克魯斯稍微失望一點，印象中他蠻聰明的

  電影變成純粹的肌肉笨蛋，但特效還是很帥

  小尾巴完全符合原作，獸迷大興奮。

  索尼克則依舊索尼克。


  缺點還是有，

  整體劇情其實比上一集還退步，

  第一集找家人第二集找朋友，

  但整體卻很趕，有幾段靠嘴砲就解決了。

  人類戲份依舊很多餘，

  尤其婚禮那段有夠莫名其妙，完全不知所云

  但管他的，我只是來看索尼克跟蛋頭博士的


  算是一部成功的續集，至少觀眾想看的都有

  片尾彩蛋跟網路上猜的一樣，續集在所難免

  看來SEGA終於找到屬於自己的財富密碼了

  也很慶幸音速小子找到新的方法，

  讓自己能夠在娛樂圈中再次活躍。

  -----

  Sent from JPTT on my iPhone


  --

  我覺得不會，反正劇情一直都不怎麼樣

  但粉絲服務滿滿，該有的都有，

  整體上其實很不錯。'
