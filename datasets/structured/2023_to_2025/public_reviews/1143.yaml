url: https://www.ptt.cc/bbs/movie/M.1605847574.A.424.html
title: '[新聞] 《頑皮豹》重啟！《音速小子》真人版導演'
content: '《頑皮豹》將3D動畫化！《音速小子》真人版導演接棒製作《頑皮豹》全新重啟版




  從《頑皮豹》（Pink Panther）系列真人電影爆紅的頑皮豹，近五十年來獨立衍生出無數

  動畫作品，《頑皮豹》（Pink Panther）電影本身也成長壽的票房賣座系列，在1963年至

  1993年的三十年間共推出九部續集，2006年開始，史提夫馬丁（Steve Martin）更接棒演

  出了兩部重啟版，而距今已有十一年未有新作的《頑皮豹》電影，現在準備又將重出江湖

  。




  米高梅影業今日宣佈，《頑皮豹》電影將重新被翻拍，並交由《音速小子》（Sonic the

  Hedgehog）真人電影的導演傑夫福勒（Jeff Fowler）擔綱執導，《絕地戰警FOR LIFE》

  （Bad Boys for Life）編劇之一的克里斯布雷姆納（Chris Bremner）負責執筆劇本，《

  星際寶貝》（Lilo & Stitch） 真人版、《阿拉丁》（Aladdin）真人版的兩位製片人：

  林暐、喬納森埃里希（Jonathan Eirich）坐鎮監製。




  加入新版《頑皮豹》製片行列的，還包含奧斯卡影后茱莉安德魯斯（Julie Andrews），

  她的第二任已故丈夫布萊克愛德華（Blake Edwards）正是執導過多部《頑皮豹》電影的

  導演。雖然新版的劇情仍屬保密狀態，但據《好萊塢記者報》（THR）的消息來源透露，





  米高梅電影製作主席麥可迪盧卡（Michael De Luca）和米高梅電影製作總裁潘蜜拉阿布

  迪（Pamela Abdy）共同在聲明表示，擁有五十多年歷史的《頑皮豹》將繼續被新世代看

  見，並很高興能齊聚這批團隊一起將《頑皮豹》帶回大銀幕。



  --'
