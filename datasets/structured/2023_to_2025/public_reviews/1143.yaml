url: https://www.ptt.cc/bbs/movie/M.1584353337.A.E4E.html
title: '[新聞] 《音速小子》成美國最賣座的遊戲改編電影'
content: '《音速小子》北美票房超越《名偵探皮卡丘》成美國最賣座的遊戲改編電影





  上週結束之後，《音速小子》現在的美國票房已經達到了1.458億美元，超越了《名偵探

  皮卡丘》的1.441億美元。



  造成此結果的一個重要原因是《音速小子》因為新冠疫情

  的原因在中國延期上映，因此《音速小子》損失了大量的中國票房，而《名偵探皮卡丘》

  僅在中國就賺了9370萬美元。



  但是這兩部電影都不是全球票房最高的遊戲改編電影，因為由著名RTS遊戲《魔獸世界》

  改編的電影《魔獸：崛起》在全球擁有4.39億美元的票房紀錄居冠。可是《魔獸：崛起》

  在美國影院的表現不佳，僅收穫了4740萬美元，但從海外市場上卻賺了3.917億美元。



  20世紀1980年代街機遊戲《怪獸大破壞》改編、由巨石強森主演的以4.28

  億美元的全球票房排在《名偵探皮卡丘》之後位列第三，而2010年傑克葛倫霍主演的電影

  全球票房為3.36億美元。







  目前，還有更多經典大作改編的電影即將上映，如湯姆霍蘭德和馬克華伯格主演的《秘境

  探險》、卡普空的《魔物獵人》以及華納的新《真人快打》電影，電視劇方面HBO最近才

  宣佈了要將《最後生還者》打造成電視劇的計劃。





  --'
