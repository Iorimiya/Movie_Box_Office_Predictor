url: https://www.ptt.cc/bbs/movie/M.1552134157.A.F91.html
title: '[新聞] 索尼克真人版外型惹議 「音速小子之父」'
content: '索尼克真人版外型惹議 「音速小子之父」吐槽：想幫他加個手套




  《音速小子》真人電影《SONIC：THE HEDGEHOG》日前意外曝光了索尼克的真面目，圓潤

  的外型加上激似人類的身形比例讓不少玩家感到困惑，就連《音速小子》之父中裕司也忍

  不住發推吐槽：「手套變白毛實在令人震驚」！而他的「意見」當然不只這樣，中裕司一

  共發了四篇貼文評論真人版索尼克的外觀，對於自己一手催生的經典IP被改編成這個樣子

  ，心情上肯定是相當複雜。


  作為SEGA經典作品《音速小子》的主要創作人，中裕司經常被稱作是「音速小子之父」，

  目前任職於史克威爾負責遊戲開發。在電影廣告公司「Hamagami / Carroll」公開了真人

  版索尼克的全身照後，中裕司很快的就在推特上發佈了一篇貼文，寫著「這是《音速小子

  》真人電影嗎？」


  沒多久時間，他又在另一篇貼文中表達了對於真人版索尼克的評論，表示頭部的圓潤對於

  索尼克的外型來說是一件很重要的事，而身體的比例和曲線也應該要再平衡一點。另外他

  也認為，「Hamagami / Carroll」提早公開索尼克的外應該是一個策略型的操作，不

  過照目前的反應看來網友們似乎不太埋單，也許會對《音速小子》本身造成負面的影響。

  當然，中裕司也注意到了索尼克的手套被改成白毛的設定，他表示，如果可以的話他想幫

  忙把手套戴上，手套變白毛這件事實在令人震驚。


  不過，由於《音速小子》在電影中的外觀不如大眾預期，導致許多網友們紛紛開始動手修

  改這隻「人形刺蝟」，試圖讓他看起來更貼近原先的設計，以下是經網友們巧手編輯過的

  幾個作品，不得不說看起來還真的挺不錯的！







  --'
