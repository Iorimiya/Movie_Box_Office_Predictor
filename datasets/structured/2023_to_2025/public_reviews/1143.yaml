title: '[新聞] 全球賣破60億 音速小子登台灣首週票房冠軍'
content: "全球賣破60億！《音速小子》登台灣首週票房冠軍\n\n23:00 2020/02/24 中時 江珮瑜\n\n\n\n改編自全球經典電玩的電影《音速小子》蟬聯全美雙周票房冠軍，累積票房高達1.06億多\n\
  美金（逾32億新台幣），首周票房刷新電玩改編電影票房紀錄，全球累積票房破2億美金\n（逾60億新台幣）；台灣上周五上映，全台首周票房以1000萬新台幣登上首周票房冠軍。\n\
  \n喜劇演員班許瓦茲（Ben Schwartz）為音速小子索尼克配音，他說：「我很興奮能夠參與\n這部電影概念發想的過程，我猜我表現得還不錯吧，所以他們就讓我為這部電影中的索尼\n\
  克配音。」詹姆斯馬斯登（James Marsden）則表示他就是班許瓦茲的大粉絲，他說：「\n班有一種充滿童趣和調皮搗蛋的特質，完全適合為索尼克配音，而且他為這個虛構的電玩\n\
  角色注入非常多的人性。」\n\n班許瓦茲真的非常熱愛索尼克這個經典電玩角色，所以他花很多時間為這部電影做大量所\n謂的研究，完全不會讓人感到驚訝。他笑著說：「就像任何優秀的方法派演員，我很享受\n\
  完全融入我詮釋的角色中，所以我為了準備為索尼克配音，就瘋狂地玩《音速小子》這款\n電玩遊戲。」但是這樣對他還不夠，他開玩笑地說：「我花了很多時間和真正的刺蝟一起\n\
  玩，甚至還會跟牠們玩愛的抱抱，這麼做的確花了我更多的時間和金錢，但是這一切都值\n得了，對吧？」\n\n\n《音速小子》全美蟬聯雙周票房冠軍。（UIP提供）\n\
  \n當他得知總是有超多正能量的喜劇天王金凱瑞（Jim Carrey）加入這部電影時，他簡直就\n是欣喜若狂，他說：「我和很多人都是透過金凱瑞的電影和表演才知道喜劇到底是什麼。\n\
  《阿呆與阿瓜》是我最愛的電影，他更是一個傳奇！他在《音速小子》的誇張演出，完全\n捕捉到他早期喜劇作品的那股無人能及的能量，能夠看到他再度發揮他的搞笑功力，並且\n\
  做出超搞笑和搞怪的演出，真是令人感到超級興奮的。」\n\n\n\n(中時 )\n\n--\n、。帝釋所問經講記77頁拆穿佛法的。\n《毗婆舍那講記(含法的醫療)》開示如何修四念處增加智慧斷除所有煩惱。\n\
  《正念禪修方法(毗婆舍那實修教學)》簡短說明如何修四念處禪法。\n才是 是菩薩成佛之道\n、、、、()、、是佛經。\n  是佛          是菩薩\n\n\
  --"
