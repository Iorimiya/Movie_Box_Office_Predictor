url: https://www.ptt.cc/bbs/movie/M.1648823049.A.6AC.html
title: '[爽雷]音速小子2最佳電玩改編電影續集 沒有之一!'
content: '雷文防雷資訊頁


  我要續集!!!!!!!  大家幫忙一下啦QQ


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  塔爾斯 超可愛!!!

  塔爾斯 超可愛!!!

  塔爾斯 超可愛!!!*N


  這是一部鐵粉看得過癮

  沒有接觸過的人也會看得算開心的電影吧

  原本以為續集通常會爛掉，沒想到反而拍得更好

  真的比一堆黑人問號的電玩改編電影好看太多了

  我大藍色刺蝟終於在電影圈找到另一片天了!!!  (遊戲就...








  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  劇情很簡單

  蛋頭博士離開了第一集後面被困住的蘑菇星球

  意外吸引到納克魯斯加入他的行列

  兩人目標就是找到索尼克，然後奪取王者翡翠


  覺得音速小子系列的電影

  相較其他電玩改編或卡通人物為主角的電影

  盡可能忠於原著 & 真實人類存在感意外強大

  真的蠻厲害的

  雖然劇情沒有什麼神反轉的驚喜

  路線上還是保持著索尼克和人類夥伴的情懷

  互動上不像第一集這麼密切，但還是在關鍵時刻幫忙了好幾把，後面也意外溫馨

  整體故事在敘述一些設定上都講得算詳細

  沒玩過音速小子的人應該能看得懂在幹嘛，不太會有莫名其妙的感覺


  人物部分

  金凱瑞的蛋頭博士依然過癮，好喜歡這種瘋瘋癲癲很聰明又邪惡的壞蛋

  真的希望第三集他會願意繼續出演


  索尼克無俚頭痞痞中二的樣子也是很完美


  重點是!!!

  塔爾斯和納克魯斯根本神還原啊啊啊啊啊啊!!!!

  無論是樣貌、形象、個性，完完全全就是在遊戲或卡通裡的感覺

  被塔爾斯萌到，尤其是在酒店睡覺蓋棉被那裏，差點不獸控制


  納克魯斯雖然觀影前很期待會不會有網路迷因出現

  但很可惜沒有，不過卻是個很原汁原味的納克魯斯

  嚴肅、過於認真、力大無窮

  最後也協助索尼克一起打敗了蛋頭博士


  最後劇情的高潮，看到索尼克結合了七顆卡歐斯寶石，化身為超級索尼克

  真的是哇哇哇哇哇，差點在電影院大叫出來


  然後正當想著，超級索尼克都出來了，影子應該也要出現了吧

  沒錯!  片尾彩蛋影子直接現身，根本帥爛

  希望音速小子一定要出3啊!!!


  --'
