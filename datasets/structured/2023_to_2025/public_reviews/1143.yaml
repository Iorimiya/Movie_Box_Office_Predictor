url: https://www.ptt.cc/bbs/movie/M.1645363965.A.2CA.html
title: '[新聞]《音速小子2》還沒上映派拉蒙宣布開發第3集'
content: '新聞網址：


  原標題：



  info-logo Yahoo奇摩電影編輯部

  2022年02月20日



  【文／太空小姐】距離2021年底《音速小子2》預告發布才2個月，


  ，展現出對此系列滿滿的信心！



  《音速小子》歷經角色「打掉重練」的慘痛經驗，，

  由班許瓦茲（Ben Schwartz）為音速小子索尼克配音，金凱瑞（Jim Carrey）飾演蛋頭博

  士，詹姆斯馬斯登（James Marsden）飾演索尼克的人類好友，第一集獲得好評後，派拉

  蒙也不負眾望將在續集加入「塔爾斯」和「納克魯斯」，並分別由柯琳維拉德（Colleen

  O''Shaughnessey）和伊卓瑞斯艾巴（Idris Elba）擔任配音。



  雖然沒有更多關於《音速小子3》的資訊，但至少能見到SEGA的CEO里見治紀也對即將製作

  《音速小子3》感到相當期待，「我們很高興宣布派拉蒙+（Paramount+）的第3部音速小

  子系列電影正在積極開發中，我們與派拉蒙建立了非凡的合作夥伴關係，很高興能和他們

  繼續擴大音速小子的IP。2022年對這系列來說是很重要的一年，真人版電影第2集要在4月

  上映，備受期待的遊戲《索尼克未知邊境》（Sonic Frontiers）也將在今年假期（聖誕

  假期）上市。

  」



  至於《音速小子》前2集製作人尼爾·H·摩里茲（Neal H. Moritz）也表示，「音速小子

  幾十年來填滿了許多人的想像力，我們很高興能在大銀幕上和每位粉絲的家中提供並延展

  這世界級IP的極限，我非常自豪能為許多老粉絲獻上創新的內容，並把索尼克也介紹給下

  一代。」



  --'
