title: 'Re: [新聞] 驚聲尖笑睽違 11 年重出江湖！音速小子'
content: '挖塞~~完全不同的故事，

  而且是認真拍到結局，

  笑點一樣讚!


  1.小男孩變成幻想的

  2.照顧小男孩的神父也是幻想的(還故意牽小孩的手)

  3.綠巨人浩克也出現了

  4.總統也想變身，但.....(超好笑)

  5.更多駭客任務，黑人夫妻戲份變多

  6.看到心臟那邊笑噴XD

  7."幻想的站一邊，真實的站一邊"，我看到某個紅衣人笑到眼淚流出來


  是個完整的結尾，

  沒想到21年後才看到，實在太驚人了!


  --'
