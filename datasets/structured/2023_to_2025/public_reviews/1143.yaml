title: '[普雷] 音速小子'
content: '======雷=======











  1.個人喜歡名偵探皮卡丘比較多

  一個是整個世界觀展現

  一個只是音速小子跑來

  但個人覺得一個作品吸引人是包含整個世界觀


  音速小子當然有優點

  最後決戰算有展現特色

  但真實世界實在不吸引人


  當然可能成本不同就是了




  2.笑點不少



  3.劇情本身簡單，但也沒什麼缺點就是了


  劇情很傳統，但也因此很安全

  只是換成任何外星人都可以



  4.金凱瑞金Carry


  那表情肢體只有他能做得出來

  充滿魅力特色

  Carry了整部戲


  --'
