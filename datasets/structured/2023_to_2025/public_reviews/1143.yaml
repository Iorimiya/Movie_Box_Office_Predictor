title: '[新聞] 《音速小子2》宣布開拍！明年4月回歸'
content: '燈光、相機、刺蝟都就緒了！《音速小子2》宣布正式開拍！




  去年《音速小子》真人CG電影版在全球進帳3.19億美元，是疫情爆發之際少數倖存的作品

  。也讓派拉蒙影業在去年5月宣布，確認展開籌備第二集的計畫。如今，續集前置作業順

  利完成，導演也在今日稍早正式宣布《音速小子2》正式開拍。



  導演傑夫福勒稍早於推特發文：「燈光、相機、刺蝟都就緒了！《音速小子2》今天正式

  開拍！」並附上一張《音速小子2》標題的導演椅。




  目前關於《音速小子2》的劇情大綱暫時不清楚，但是許多原班人馬都預期將會回歸，包

  括為「索尼克」配音的班許瓦茲、「蛋頭博士」金凱瑞、「湯姆華高斯基」詹姆士馬斯登

  、「麥蒂華高斯基」蒂卡桑普特都將回歸。此外，遊戲中金黃色的「塔爾斯」、反派紅刺

  蝟「奈克魯斯」與全新原創角色「藍道」也將會在本集登場。




  《音速小子2》工作標題為「翡翠山莊」（Emerald Hill），也是遊戲《音速小子2》裡的

  一道關卡。本片暫定2022年4月8日上映。






  --'
