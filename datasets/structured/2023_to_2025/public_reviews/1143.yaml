url: https://www.ptt.cc/bbs/movie/M.1510240477.A.F67.html
title: '[新聞] 查理辛被控誘姦「美國小子」柯里漢姆'
content: '新聞網址：



  聯合報 記者蘇詠智╱即時報導


  英年早逝的美國男星柯里漢姆(Corey Haim)，曾因「引狼入室」、「銀色子彈」(

  Silver Bullet)、「墨菲羅曼史」(Murphy''s Romance)等成為當紅搶手童星，與另

  一位同樣叫柯里的紅牌少男演員柯里費爾曼(Corey Feldman)結為好友，曾數度合

  作也無話不談。柯里費爾曼曾透露柯里漢姆當童星時被好萊塢的重量級名人強暴，

  自己也曾是性侵的受害者，要讓外界重視好萊塢童星的權益。最新「國家詢問報」

  (National Enquirer)指出曾經姦汙柯里漢姆的大牌之一正是和他合演電影「美國

  小子」(Lucas)的查理辛(Charlie Sheen)。


  根據「國家詢問報」，柯里漢姆生前另一位好友多明尼克布拉西亞(Dominick

  Brascia)表示柯里曾告訴他，在拍攝「美國小子」時，19歲的查理辛找才13歲的

  柯里吸大麻，兩人都飄飄欲仙、神智不清，查理對柯里表示在娛樂圈不乏年輕

  男性與年長同性的性行為，並沒有看起來那麼嚴重，於是柯里被迷惑，和查理

  肛交，以為彼此正在交往。然而查理得手之後，就對他開始冷淡，也不願意再度

  肌膚之親。


  幾年之後柯里成年，與查理再次碰面，事隔多年後又一度有了性關係，柯里終於

  明白自己並不喜歡這樣，真正得以擺脫查理的陰影，然而年幼時被查理玩弄身體

  與心靈，讓他受傷頗深，成年後費盡辛苦才能夠重建生活，可惜他已經染上藥癮

  ，身體健康飽受摧殘，在38歲時英年早逝。而查理辛一度成為美國小螢幕片酬

  最高天王，卻沉迷於派對、情色遊戲，最後染上愛滋病，形象大受影響，演藝圈

  地位亦大不如前。


  ------------------------------------------------------------------------------


  參考外電:FOX News

  Charlie Sheen denies report claiming he sexually assaulted 13-year-old

  Corey Haim



  查理辛的公關發言代表不意外地否認了這項指控


  心得︰不過幾個花絮報導反而陸續證實了查理辛有這項前科的可能，

  先是查理辛前妻丹妮絲李察斯提出的離婚原因證明中，

  有寫到查理辛曾經不只一次觀賞「未成年男孩擔任主角」的色情影片



  另外先前曾接受訪問表示想拍攝紀錄片反映好萊塢私下醜陋面的Corey Feldman，

  也不會否認這項由其他友人提出的指控



  儘管「國家詢問報」的可信度遠不如其他網站，

  但我覺得假若查理辛有做過這種摧毀其他人事業甚至尊嚴的惡行，

  似乎也不會感到意外，只是他同樣是演員的父親跟哥哥

  又要怎麼看待這個因陸續出包自毀演藝事業的家人呢？


  --'
