url: https://www.ptt.cc/bbs/movie/M.1582085262.A.F47.html
title: '[好雷] 音速小子 心得與彩蛋整理'
content: "雷文防雷資訊頁\n\n\n地點：MUVIE CINEMA TAITAN廳 特映會\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n“ I'm Sonic. Sonic the Hedgehog.”\n-\n金凱瑞回歸！近期最佳的電玩改編電影之一！笑料不斷還有許多電影彩蛋讓人驚喜連連。\n\
  -\n先前釋出的「整形前」音速小子，眾人批評會引起恐怖谷現象，片商後來改為這個版本算\n是\n\n大成功，完美複製電玩裡面的內容，且金凱瑞的回歸出演蛋頭博士真的魅力十足，笑點層\n\
  出\n\n不窮，以下整理電影裡出現的其他電影彩蛋。\n\n\n~~~~~~~~~~~~~~~~~~~ 以下微雷~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  -\n1.「MIB星際戰警」：警長被蛋頭博士一行人包圍時，嘲諷自己像是MIB，只是沒有威爾史\n\n密斯那麼有名。最後蛋頭一行人離開時，笑稱怎麼沒有人幫我消除記憶：）\n\
  .\n2.「玩具總動員」：索尼克在酒吧隨口一句”Howdy Partner!”出自玩具總動員胡迪，背\n後\n\n拉繩後說所出的其中一段話”Howdy partner!My\
  \ name is Woody.”\n.\n3.「玩命關頭」：在飆車追擊一幕，索尼克笑稱自己像馮迪索，超在意家人的。\n.\n4.「阿呆與阿瓜」：金凱瑞飾演的蛋頭博士在片中跳舞自嗨時，被躲在背後的跟班嚇到那\n\
  \n\n幕，說了一句你以為我在演《阿呆與阿瓜》嗎？《阿呆與阿瓜》（Dumb and Dumber)是\n\n1994年金凱瑞主演喜劇電影，算是對自己的致敬與嘲諷吧\
  \ XD。\n.\n5.「浩劫重生」：最後片尾第一個彩蛋，蛋頭博士自製的石頭跟班Agent Stone，頗有《\n浩\n\n劫重生》Wilson的味道：）。\n\
  .\n6.「Queens皇后合唱團」：私心加一個這個，片頭音速小子飆速與片尾音樂都用了\n\nQueens的《Don’t stop me now》，也象徵著音速小子的速度無法阻擋。\n\
  -\n總體來說非常喜歡這部電影的改編，尤其是金凱瑞的回歸讓人感動萬分！那個渾然天成的\n笑\n\n果影壇無人能出其右。電影笑點的處理也不會很刻意，男角與音速小子的對話也很自然，\n\
  不\n\n會有對空氣講話的感覺，另外片尾有一個彩蛋，爲新角色鋪續集梗！\n\n\n\n\n-\n誠實片名：《救救大姨子》｜《Untie me！JoJo！》\n\
  -\n個人總評：7.2/10\n\n-\n歡迎追蹤！更多資訊在我的影評IG: \n18grk7\n\n\n--"
