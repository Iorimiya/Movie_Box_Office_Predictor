url: https://www.ptt.cc/bbs/movie/M.1554446948.A.0B1.html
title: '[問片]黑人胖小子帶音響、另一人參加DJ大賽'
content: '大家好，我想問片名。


  我轉台時看到的，有一個黑人胖小子（青少年）和爸媽說要出去讀書，他媽媽要他把床還

  是房間整理好，他帶著書要出門，可是到玄關還是走廊時，把書放下，拿起手提音響就走

  出門了。


  然後在街上他遇到一個人（應該是他同學）他就說要向他要某個課目的筆記，邊說邊倒著

  走，結果不小心撞到一個女的，他想和那個女要電話（？之類的吧），結果他媽在樓上探

  出頭來大叫、要他把床還是房間整理好。


  另外一個片段是，有另一個黑人青少年和他爸媽（還是只有媽媽？）說要出去讀書，不過

  他手上空空、戴上隨身聽的耳機就要走出門，她媽問說書在哪裡。

  後來在另一個片段他向之前的黑人胖小子和其他人提到他要參加DJ大賽。


  另一個片段就是DJ大賽中，一個黑人、女的、有點胖，在介紹選手。


  在更早之前好像還有一個片段是，有個黑人女的青少年要用廁所，她好像說她今天要去面

  試，可是廁所中她的兄弟不出來、還問出來有什好處，那女的一開始不給他好處，那兄弟

  就關門不出來，後來那女的說會給他五塊錢，那兄弟就出來了，結果那女的進去後就不理

  他，那兄弟就敲門叫她最好給他，結果他媽媽的聲音傳來問發生什事，那兄弟就說沒事就

  離開了。


  抱歉，以上就是我記得的情結，因為一直轉來轉去，所以記得支離破粹。


  --'
