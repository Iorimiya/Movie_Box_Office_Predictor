url: https://www.ptt.cc/bbs/movie/M.1640572805.A.B14.html
title: '[好雷] 淺草小子Asakusa Kid'
content: 'N台自製的《淺草小子》，在我版上不算是大熱，但還算有一些討論。原本就有收入片單

  ，卻意外在朋友家一起看了。


  因為是北野武的回憶，所以劇情方面不能說是有什麼超厲害的地方。不過，故事呈現得好

  ，從第一場戲就吸引住觀眾，不小心就看完全片的那種電影。


  如同朋友所說大泉洋大概從來沒被拍的這麼帥過，柳樂優彌則是可以讓人忘記他是誰的那

  種演出（說實話他也不像北野武，但在故事中你會忘了他原本是誰）。兩人的師徒之情也

  確實是本片重點。


  電影展現出過往諧星的技藝與現場舞台獨有的魅力，在時代轉換之際，年輕一代諧星「成

  功」的方式和定義改變了—他們往前衝的時候，前一代的諧星正在被時代所拋棄。對我個

  人來說，這種變化是這片最好看的地方。


  講技藝的電影，歌舞自然不可少；講諧星漫才，金句當然也不少。就算是完全不懂這些的

  我，也可以非常享受這部片。




  ***


  這裡是我的樂園:





  --

  抱歉,我意思表達不清楚

  我想說的是臉不像

  但你說的詮釋部分

  真的超級傳神...完全不會覺得是在演'
