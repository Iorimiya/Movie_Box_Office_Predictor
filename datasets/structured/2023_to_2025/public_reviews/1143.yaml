title: '[爽雷] 歪小子史考特之極短心得'
content: '片名：歪小子史考特

  英文：Scott Pilgrim vs. the World

  IMDB：7.6


  心得：


  一部由Edgar Wright導演的片，改編漫畫也融

  入街頭電玩風格的動作、喜劇、奇幻、愛情片

  ，劇情不贅述。


  「我到底看了什麼？」大概是我看完這部片時

  腦中浮現的第一句話，有什麼心得，其實也說

  不上來，就是一種很「ㄎㄧㄤ」的快感！


  尤其是男主角真的就一臉宅到爆的宅臉，實在

  太適合本片啦！後來又發現片中大咖不少，有

  美國隊長Chris Evans、驚奇女超人Brie Lars

  on、暮光之城Anna Kendrick、前超人Brandon

  Routh。


  不過我還是不太理解為何男主角會這麼著迷於

  Ramona Flowers，還要對抗七個前男友，原本

  的女友高中妹Knives Chau也很好啊。


  總之，本片片長112分，值得看兩次以上！


  --'
