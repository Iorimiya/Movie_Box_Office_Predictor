title: '[討論] 音速小子3 原作截圖對照 內肯定有雷'
content: '今天四刷完

  沒想到秀泰又送新的海報





  然後想到一件事

  我記得板上有人看過不喜歡的原因是不像遊戲



  那我在想，一樣是經歷過那個時代的人

  這是我這邊玩過&看過許多音速小子作品的視角


  下面是我用很多遊戲跟動畫的內容

  去截圖拚出來的整個電影片段

  因為電影改編本身就是各種元素拼湊的









  目前在整理包含中配版四刷完的心得

  不過發這裡太重複，會另外發在西洽


  --

  孫女

  是說有些人覺得他為什麼重視孫女沒解釋到

  我自己覺得親情也不需要多解釋'
