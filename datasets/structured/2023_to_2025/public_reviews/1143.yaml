url: https://www.ptt.cc/bbs/movie/M.1478184030.A.64B.html
title: '[新聞] 死侍導演將製作電玩改編電影《音速小子》'
content: '新聞網址：



  文/Jean


  過去多在幕後參與視覺特效工作的提姆米勒（Tim Miller），首次執導長片就接下了福

  斯影業的漫威英雄電影《惡棍英雄：死侍》（Deadpool），雖然製作預算相當有限，

  不過透過編劇瑞特瑞斯（Rhett Reese）與保羅瓦尼克（Paul Wernick）打造的劇本，

  再加上萊恩雷諾斯（Ryan Reynolds）的完美詮釋，此片仍然得到相當不錯的評價，當

  然也開啟了續集的可能性。


  然而日前提姆米勒已經正式退出了續集的導演行列，據悉是因為創作理念不合及資金等

  問題。雖然目前還沒有傳出可能接導續集的導演人選，倒是提姆米勒已經有了全新的

  目標。根據 THR 報導，提姆米勒與他的 Blur Studio 特效公司夥伴傑夫富勒（Jeff

  Fowler）將一同著手進行索尼影業籌備的電玩改編電影《音速小子》（Sonic the

  Hedgehog）。


  索尼影業早在 2014 年就已經釋出製作資訊，預計將結合 CG 動畫及真人演出的方式，

  讓這部作品以家庭電影的形式呈現。目前已經找來了動畫影集《食人魔戈蘭》（Golan

  the Insatiable）編劇派翠克凱西（Patrick Casey）、喬許米勒（Josh Miller）來編

  寫劇本。提姆米勒將擔任監製，而傑夫富勒則有望以此片作為首部導演電影，兩人過去

  也曾以這樣的合作模式以《Gopher Broke》獲得奧斯卡最佳動畫短片的提名。


  ------------------------------------------------------------------------------


  參考外電:THR.com

  ''Deadpool'' Director Shifts to Sony''s ''Sonic the Hedgehog'' Movie



  心得︰不曉得會不會讓音速小子學到死侍的碎嘴風格？


  --'
