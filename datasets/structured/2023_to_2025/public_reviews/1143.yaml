url: https://www.ptt.cc/bbs/movie/M.1581955823.A.EA7.html
title: '[新聞] 音速小子馬力夯 北美票房奪第一'
content: '音速小子馬力夯 北美票房奪第一




  （中央社洛杉磯16日綜合外電報導）派拉蒙出品的家庭片「音速小子」在總統日（

  Presidents Day）週末發光發熱，北美入袋5700萬美元，全球則海撈1億美元，是歷來翻

  拍電玩成績最好的電影。


  「音速小子」（Sonic the Hedgehog）預料會在17日為止的北美長週末進帳6800萬美元。

  這部片首映表現遠優於預期是很難能可貴的，因為影迷通常很難接受翻拍電玩的電影。


  而「音速小子」原本確實很可能被影迷唾棄。它第一支預告片出爐後網路罵聲隆隆，導演

  傑夫福勒（Jeff Fowler）旋即決定砍掉重練，將上映時間往後挪3個月，替主角改頭換面

  。這證明是明智的一步，獲影迷在影評網站CinemaScore給予A的高分。


  本週末排名第2的電影票房收入落後「音速小子」一大截，華納兄弟超級英雄片「猛禽小

  隊：小丑女大解放」（Birds of Prey）3天收入來到1710萬美元（4天1950萬美元）。


  排名第3的是本週末新上檔的索尼恐怖片「逃出夢幻島」（Fantasy Island），進帳1240

  萬美元（4天1400萬美元）。這部由麥可潘納（Michael Pena）和Maggie Q主演的電影，

  是將1970年代電視節目搬上大銀幕。


  同樣本週末新上檔的環球愛情劇情片「照片」（The Photograph），這部由凱斯史坦費爾

  德（Lakeith Stanfield）和伊莎蕾（Issa Rae）主演的電影，首映以1230萬美元（4天

  1400萬美元）排名第4。


  排名第5的是索尼動作片「絕地戰警FOR LIFE」（Bad Boys for Life），進帳約1130萬美

  元（4天1280萬美元）。


  排名第6到第10的電影依序為：「1917」（1917），810萬美元（4天940萬美元）；「野蠻

  遊戲：全面晉級」（Jumanji: The Next Level），570萬美元（4天700萬美元）；「寄生

  上流」（Parasite），550萬美元（4天670萬美元）；「杜立德」（Dolittle），510萬美

  元（4天630萬美元）；「每況愈下」（Downhill），470萬美元（4天520萬美元）。


  （譯者：蔡佳敏/核稿：嚴思祺）1090217



  新聞網址：



