content: '，

  Mi

  、


  看一面倒整形成功


  但這是真人版電影


  原本的雖然不夠好看討喜


  卻是往“真人”方向設計


  現在讓他矮化可愛化


  感覺非常違和


  而且不知道是不是經費問題


  注意看第一版的臉是很真實細膩的


  第二版的眼睛部分卻感覺有點廉價的3D感


  整個很違和


  我承認新的的確更討喜


  但相比原版的更加違和


  已經不是“真人”版而是變成“3D”版了


  只能說多少還是很失望








  其實不應該要改的...


  --

  新的的確好看多了，但面部的特效整個很廉價


  第一版細節毛髮超逼真


  第二版整個很3D卡通看不到真實的感覺'
