url: https://www.ptt.cc/bbs/movie/M.1598111430.A.D61.html
title: '[好雷]音速小子 '
content: '雷文防雷資訊頁







  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  沒討論劇情


  以一個紅白機年代的大叔來說，這部電影偏向青少年


  但就是衝著金凱瑞來看，也沒讓我失望


  當然，劇情什麼的我並沒在意，我也不是音速小子粉


  所以對電影內容，我只說，適合放鬆心情去看


  啊心中吐槽越多就表示你年紀越大......


  以一個工作多年的社會人士來說，看的就是金凱瑞的演出


  "台上一分鐘，台下十年功" 這真的是我看後對金凱瑞的感想


  以社會人士來說，這電影的劇情架構實在沒啥好說


  但金凱瑞的氣場實在太強，每次出現，一舉手一投足，都讓人想再看一次


  泰迪(你要叫他獨眼龍也行)，你完全被壓制囉！


  小時候看摩登大聖、王牌威龍，只會覺得好好笑！


  那個橡皮般的表情超逗趣！


  看楚門的世界，超好看，會覺得原來喜劇演員也能認真演好片


  之後看這麼多作品，一直到音速小子


  現在金凱瑞在幕前的每一句台詞，每一個動作


  都只讓我想到...千錘百鍊！


  他一個在螢幕上的搞笑鏡頭，可能是重拍數十上百次的成果


  為了讓觀眾笑，他可能演到想哭！(以前看過王牌大騙子的NG片段)


  我在看音速時，真的是在想像他練出這個氣場，到底付出了多少努力


  最近看了YOUTUBE有人介紹他的生平事蹟


  讓我想到電影WATCHMEN裡面，變臉羅夏講的一個笑話


  有一個男人去看醫生，說他很憂鬱，

  說人生是惡劣和殘酷的，說他在一個充滿威脅的世界中覺得孤獨。


  醫生說：

  治療方法很簡單，很棒的小丑今晚在鎮上表演，

  去看他的表演，那應該會讓你心情變好。


  男人突然大哭說：

  但是醫生...我就是那個小丑！



  最後，對於音速小子


  我的感想就是...台上一分鐘，台下十年功


  金凱瑞是個開創時代的男人


  --'
