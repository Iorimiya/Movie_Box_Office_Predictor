content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~








  《音速小子3》延續了前兩集的成功

  表現精彩，這系列沒有崩掉令人欣慰

  基哥的角色塑造相當帥氣，能在大銀幕再次看到金凱瑞幽默的表演也是一大享受

