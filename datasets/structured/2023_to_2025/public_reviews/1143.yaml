url: https://www.ptt.cc/bbs/movie/M.1582291296.A.445.html
title: '[好雷] 音速小子 '
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n懇請支持圖文版：\n\
  \n\n\n\n碎碎念的臉書專頁：\n\n\n\n\n\n\n\n\n很少有電影經歷延期補拍、進廠大修之後，還妄想可以起死回生的。\n\n不是沒有，但實在是不多。\n\
  \n如今，恭喜這隻精力過剩、停不下來的藍色刺蝟《音速小子》擠身這樣的行列之中，雖然\n不是什麼了不起的經典大作，但也絕對會是後來令人嘖嘖稱奇的作品之一。\n\n\
  雖然不能說是一定，但有時候，適度的聽進去粉絲的話，總是不會有太大的壞處。\n\n《音速小子》當然沒有什麼複雜劇情，甚至也缺乏《名偵探皮卡丘》那樣有原作豐富的故\n\
  事背景，撇開原先寫實到令人尷尬的設計不談，光是把這樣一隻毫無實感的異世界動物扔\n到現代人類世界，在故事上的走向其實本來就已經讓人捏把冷汗。但《音速小子》成功的\n\
  端出一個很保守但卻很適合讓這隻好動藍色刺蝟融入現代人類世界的「好劇本」，差不多\n就是，呃，《大黃蜂》、《馴龍高手》加上一丁點《E.T.》。\n\n但《音速小子》也不僅僅只是把「老實人類主角遇上異世界生物」的套路重演一遍，本身\n\
  也是電玩粉絲、因此相當願意聽取觀眾意見的導演其實很認真的把音速小子當成主角在經\n營，絕對對得起《音速小子》這個片名。那個孤身待在地球十年，利用神速幻想自己擁有\n\
  家人、朋友，自己跟自己打棒球、希望有人可以跟自己擊個掌的描寫真的是非常犯規，但\n這隻藍色刺蝟的「角色感」就這樣活生生地燉出來了，而不只是一個觀眾無法投入感情的\n\
  電腦動畫而已，老實說這並不是一件容易的事情，畢竟連評價不錯的《大黃蜂》都有一點\n讓人搞不清楚我到底是在看《大黃蜂》還是《跳水少女養成記》。\n\n老是演無可奈何的暖男，James\
  \ Marsden也獲得了足夠的角色描寫，而不僅僅只是個工具\n人。他的角色成長曲線甚至也特別設計成可以和音速小子作為呼應與對照的發展，讓他們\n兩個的組隊搭檔的過程更有說服力，互動起來也更有感情，從告別故居、來到異鄉，之後\n\
  又回到小鎮繼續過著樸實但快樂的生活，音速小子也在冒險旅途中不斷試探摸索自己的極\n限，最後為了好不容易得到的生死之交，昂然接受了自己的超能力，知道了自己身負的無\n\
  窮能量不是只能用來逃跑，而是可以為朋友挺身而出，無懼地給敵人來個迎頭痛擊。很老\n套，但描寫得相當有效。明明有原作劇情支撐的《名偵探皮卡丘》雖然有死侍的嘴砲加持\n\
  ，但這方面的力道反而就沒有《音速小子》來的紮實，也讓同樣走一個闔家歡樂路線的《\n音速小子》並沒有那麼「幼稚」。\n\n當然，角色經營的再好，如果維持原本詭異的造型，那拍板讓這種造型過關的罪魁禍首恐\n\
  怕真的是萬死難贖其咎。神速力(咦?)的展現方式少了些許創意，差不多都是X戰警中快銀\n的步數是稍微可惜一點。懷念的音效、遺失或收集金環在電影中的巧思當然也是有趣的一\n\
  個看點。\n\n而除了可以看到音速小子在大銀幕上活靈活現的童年情懷之外，或許，金凱瑞那黃金時期\n再現的表演方式，對於從小看著這個絕代橡皮臉長大的觀眾來說，並不輸給音速小子從橫\n\
  軸電玩跑進大銀幕的意義，真心希望他演出蛋頭博士的過程能夠感到開心啊。\n\n在DC的《閃電俠》個人電影問世之前，或許《音速小子》就是一部我們期盼已久的最佳《\n\
  閃電俠》電影了吧。\n\n\n\n--\n\n\n\n\n\n                     －－－\n\n--"
