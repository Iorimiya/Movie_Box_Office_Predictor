url: https://www.ptt.cc/bbs/movie/M.1597464527.A.4AD.html
title: '[討論] 對於好小子的研究'
content: '就是朱延平導演顏正國演大哥的好小子

  這是俠女徐楓開的湯臣公司出品的動作片

  好小子片名是當時很有名的日本同名漫畫改編

  都是把小孩帶去山裡當泰山養，回到都市變超人

  漫畫原著是爸爸帶走兒子，電影則是爺爺帶走孫子

  一樣回到社會裡就異於常人而出類拔萃


  徐楓的湯臣公司還出品過霸王別姬

  捧紅了國際大導演陳凱歌拿坎城最佳影片

  這片好小子也算是惡名昭彰朱延平的代表作

  但只要是徐楓出品應該都是品質跟票房的保證

  而不是品質很不穩定的朱延平或王晶


  顏正國因為這片大紅大紫

  後來浪子回頭再拍角頭2一樣叫好叫座

  比第一集好看太多太多了，感覺好小子回來了

  尤其是角頭2裡面釣蝦場大亂鬥那場戲

  配樂一下，就感覺好小子還在繼續拍的感覺


  而這好小子的配樂是很佔全片重要的比例

  就像北野武跟宮崎駿只有用久石讓電影才好看

  這片的配樂是陶大偉，節奏強烈跟角頭2一模一樣

  果然陶大偉的兒子陶喆也變成音樂人

  但可惜沒像林強一樣成為電影人


  配樂主題曲



  好小子當時紅片全球，連美國都來翻拍

  後來又衍生出小鬼當家效應，也紅到日本去

  對於當時票房盛況空前的回憶可能沒經歷過的很難想像

  因為現在留下來的畫面都很舊了，除非能花大錢修復

  雖然沒有得金馬獎，但得到的是當代的觀眾票選大獎


  如果正在做這工作的藍祖蔚

  把一二集重新修復上映的話

  相信很多爸媽都會帶小孩去重溫舊夢

  就像當時看小鬼當家一樣人山人海

  還有七匹狼一二集跟桃太郎一二集

  還有大頭兵一二集都是票房大片


  就像現在的海角、賽德克、那些年、少女時代一樣賣座



  PS:

  藍祖蔚現在都在修復李行的片

  不知何時會修復到這個年代的片

  看他忙到連教育電台的影評節目都停掉了



  --

  第二集拳王是狄威，大反派要夠強，片子才會好看，打得好

  二哥左孝虎在原地連翻幾十個後翻筋斗是第三集的一大賣點

  本以為左孝虎那麼會翻筋斗長大應該會成為元彪的接班人吧

  那朱導真是沾光啦，還好還有七匹狼當代表作

  拍的還算是蠻感人的劇情片

  我的記憶只到第四集而已，之後拍的感覺都不好看了，因為小孩長大了

  暢銷漫畫改編的大部分都賣座，就像漫威和DC一樣

  以前台灣還有拍過北斗神拳也大賣

  香港還找周董拍頭文字D也超好看

  第四集我以為是最後一集還去不同戲院三刷看了三次

  跟風的七小福也很好看，還有忍者還有傘兵，各種小朋友的幻想

  還有林小樓的馬路小英雄，只要大反派是狄威的都好看

  還有我覺得遊俠兒超難看，爛到完全破壞小虎隊的形象

  但都只是常露臉的小童星，頂多是小配角，好小子才真的爆紅

  當時小學生都是歌迷所以被吸進去看

  看完連小學生歌迷都覺得拍得有夠爛

  就像看朱延平的烏龍院一樣亂七八糟

  但朱導的七匹狼也是人山人海，把金玉嵐拍成國民女神

  第二集開頭女神還扮RQ大跳艷舞，觀眾看的非常滿意

  我當時是小虎隊的超級粉絲才去看

  從頭到尾看完超失望，拍的有夠爛亂拍一通騙小孩錢'
