content: '三天連假下來，音速小子美國本土票房來到7000萬了。超車小丑女的6200萬。推特上許多

  小丑女粉崩潰中，說男性不捧場，不支持女性主角，攻擊索尼克。這真是莫名奇妙的地方

  ，兩片根本沒啥交集，音速小子是家庭片適合閤家觀賞，本來觀眾群就廣。


  下週音速小子全球上映後應該就會超車全球票房了，到時應該會崩潰更兇。


  可惜碰上支那肺炎少了中國市場影響應該蠻多的。


  --'
