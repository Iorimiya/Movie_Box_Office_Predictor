url: https://www.ptt.cc/bbs/movie/M.1735283953.A.0CB.html
title: '[好雷] 音速小子3 遊戲粉的心得'
content: '不太會把有雷無雷分開講

  所以直接說整篇都會爆雷



  無關電影，是說官方終於開始同步推Sonic Rumble了

  還有索尼克夏特世代重啟的聯名票

  去秀泰買電影票都會發大張的手遊遊戲點數













  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  我看文心秀泰ScreenX，跟我想像的有點差距

  大部分時間左右是糊的也不會特地去看

  就只是增加一部份臨場感而已


  這次是跟一個沒玩過遊戲但看過1+2的朋友去

  會穿插一些他的心得





  這是DC遊戲音速小子大冒險2的改編

  前後改的跟遊戲本體有極大落差，傑拉德教授也是大改

  但最厲害的是主軸完全沒變甚至強化

  活下去然後領悟，Live and Learn這首歌下的很好


  最早的預告超騙，幾乎大半都不一樣






  自己是不太意外砍掉露姬跟一些劇情，畢竟兩小時講不完那麼多東西

  瑪麗亞的絕症治療跟傑拉德的研究目的也被砍掉，傑拉德處刑也砍掉

  方舟ARK本來是星球大小，也被縮小成一個簡單的砲台基地

  在方舟的研究也拿掉，一切事件都濃縮到監獄島



  大概就是縮減成

  有個墜落的隕石內藏外星生物，國防軍在監獄島研究他的混沌能源

  傑拉德也在其中，瑪麗亞就跟著在研究室過生活，開導被研究的夏特

  但夏特太危險所以國防軍要封印他，攻堅途中瑪麗亞死了，夏特被封印50年



  然後刪去原作的主導危險研究跟處刑，傑拉德居然也就這樣被關了50年

  我看預告一直猜測傑拉德是不是某種"幻影"或"太空幽靈"

  靠北，真的是活人


  我是玩過遊戲所以一看畫面就知道要幹嘛了

  只是一起看的朋友覺得很問號

  他是認為雖然有交代轉折，但過程太簡短導致他沒有共感






  夏特的標誌移動方式是溜冰動作，但電影中其實沒有溜幾次

  可能瞬間移動太強了，大部分時候都是閃來閃去就完成整場戰鬥

  最重點的競速還是機車代步

  但能看到騎機車拿手槍的夏特，本身演出就可以抵掉一切了


  另外，沒有混沌控制，應該算大遺憾

  本來想說電影的夏特有混沌能量，是不是不需要寶石就能發動了

  但從頭到尾也沒使用過


  然後這我隨便猜的未來發展

  電影結局目前是夏特活著，蛋頭博士自爆死了

  但如果蛋頭也要活著，那混沌控制就是脫出的必備條件

  搞不好第四集就跟你說他會用了




  前面說的劇情段落跟角色大改，但主軸不變，就是電影厲害的地方

  看到傑拉德教授跟蛋頭一起瘋癲，雖然是金凱瑞演出，但有點毀人設

  直到他的復仇意圖慢慢顯現後，確實就是遊戲那個想報復世界的傑拉德

  尤其這種瘋狂的念頭是隱藏在金凱瑞的歡樂瘋癲下，就更厲害了


  跟遊戲一比這個主軸確實都一樣

  蛋頭想要征服世界，借助夏特跟傑拉德教授的力量

  但夏特跟傑拉德真正的目的是對人類復仇，毀滅世界


  蛋頭這邊也跟遊戲很像，毀滅世界不是他的目的

  知道該做什麼後，著手跟索尼克等人一起拯救世界

  他自己最後的排場還有跟史東的對話，超越了遊戲演出





  整片我覺得最好的地方就是索尼克跟夏特的開導互動

  這部分是遊戲完全沒有的，連動畫X的加戲也沒有這麼豐富


  電影的索尼克跟遊戲的索尼克基本上個性大不同

  遊戲的索尼克是已經接近完成型，歷戰強者的開朗勇者個性

  但電影的索尼克還是個成長中的屁孩，還在學習做人處事

  湯姆怎麼對待索尼克就會影響他，這也是開場派對講的主軸

  如果索尼克沒碰到湯姆跟其他夥伴，現在會是什麼樣子?



  索尼克先是因為湯姆的狀況，被自己的憤怒壓過，在雙方超級化的戰鬥打贏夏特

  但夏特的自然反應卻應證了索尼克在做跟他一樣的事，讓憤怒控制自己

  所以自己解除了超級化跟憤怒，並承認這種做法有問題

  然後才帶到夏特的抉擇，不是只有用生命去復仇可以選擇

  活下去並領悟，Live and Learn，然後就下主題曲了



  補充一下遊戲版本的狀況

  遊戲中的夏特跟索尼克的接觸幾乎只有對決，之後就是眼神交會一起推方舟了

  點醒他的是艾咪的一句話讓他聯想瑪麗亞，其他幾乎是自己醒悟的

  在這件事之後，夏特跟索尼克除了重大事件外也沒什麼交集

  比較重點的就是加入國防軍變成直屬於政府方的音速小子而已






  然後遊戲梗真的超級多

  巧兒花園餐廳、一閃而過的EGGMAN主題曲、電視的生化蜥蜴等等

  還有等了20幾年終於看到這些畫面上大螢幕

  其他心得都說有粉絲看到哭，這很正常

  雖然我整片都撲克臉，這些都是等了這麼久時間才實現的願望








  還有一些電影沒有明講但有演出的地方

  夏特在這種強大能量的控制上比索尼克更強

  索尼克的超級化有時效，夏特好像可以無限出力一樣

  甚至夏特不需要超級化就可以把超級索尼克的寶石打出來







  最後講講片尾的金屬索尼克跟艾咪

  已經有很多人猜可能是CD+Heroes的發展


  因為蛋頭博士照劇情上來看是死了

  就算活著也沒有理由搞那麼多台金屬索尼克

  所以很有可能是CD的發展，時空穿越

  然後這麼多台就表示一定有個大的，那就是群英會的金屬領主


  2027真是很久









  如果不熟遊戲劇情的，可以補一下最近遊戲的特典動畫 黑暗源起

  雖然只是閃回憶，但可以大改理解夏特的處境





  如果還不熟

  現在快樂快樂有連載夏特的漫畫

  一二話是無料的

  再不熟就是去STEAM買遊戲啃原作了







  之後會三刷

  第二刷已經買好台中新光影城1/1日13:30的人偶見面會場次了

  第三刷大概會去威秀看中配



  --



  補充一下有個地方沒解釋到

  最初找蛋頭那邊，拔了一根能量刺給他用

  我以為會像第一集一樣發動某種機械

  扯更遠的是可以用這根刺的資料作出金屬索尼克

  結果這根刺最後就只是帶在身上時不時拿出來舔而已

  最後刺變金色呼應一些段落這樣'
