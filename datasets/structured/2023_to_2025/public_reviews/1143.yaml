url: https://www.ptt.cc/bbs/movie/M.1624868331.A.274.html
title: '[新聞] 只花三個月！《音速小子2》真人電影殺青'
content: '只花三個月！《音速小子2》真人版電影光速殺青




  改編自知名電玩遊戲的《音速小子2》導演傑夫福勒（Jeffrey Fowler）今（27）於個人

  社群網站上宣布電影正是殺青，同時也感謝最終取景地點「夏威夷」。派拉蒙影片日前宣

  布，已計畫於2022年4月8日上映暢銷電玩遊戲改編真人版電影《音速小子2》。



  這部電影的拍攝最初是在溫哥華進行的，但最近幾週搬到了夏威夷，完成了電影的最終取

  景。這部續集的製作早在3月份就開始了，這意味著它只用了三個多月的時間就拍攝完成

  了。




  改編自知名電玩遊戲的《音速小子》是一部結合 CG動畫與真人演出的動作冒險喜劇，由

  傑夫富勒執導。故事敘述穿越到地球的藍色刺蝟索尼克（班許瓦茲配音）與人類巡警湯姆

  華卓斯基（詹姆斯馬斯登飾）成為朋友，兩人聯手試圖阻止邪惡的蛋頭博士（金凱瑞飾）

  利用索尼克身上潛藏的巨大力量來統治全世界。






  --'
