title: 'Re: [討論] 「音速小子」預告釋出'
content: '我印象中音速小子這部動畫 & 遊戲有好幾個角色，黑音速小子，紅拳頭小子，橘螺旋小

  子，還有一個怪博士，但其實對於外觀來說印象不深。


  我覺得如果是知道音速小子但對於角色外觀不非常瞭解的人來看，其實這次的音速小子還

  蠻可愛帥氣的啊，長腿跑起來比短腿更有感覺吧？在預告中原地跳準備跑的那個畫面也展

  現了一種唯我獨尊的氣息，很帥氣！


  不知道有沒有人跟我一樣覺得其實還蠻帥的？


  不一定什麼改編的電影都要基於原作吧？


  --

  漫威一堆英雄電影的外觀設計也都跟原作不一樣啊==，我是在說角色設計跟名稱哪有關係

  ？

  右邊也不錯，但畫風偏動畫，左邊是比較擬人版？'
