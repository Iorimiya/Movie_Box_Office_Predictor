title: '[討論] iTunes特價 鍋蓋頭/女人香/歪小子史考特'
content: '【2021/06/08 iTunes 特價報】

  鍋蓋頭／心靈鑰匙／歪小子史考特

  －

  這次雖然是周間，但是特價的$90片單意外的豐富。其中特別推薦除了艾爾帕西諾稱帝之

  作，長期特價的《女人香》之外，被譽為邪典經典的《歪小子史考特》也再次來到$90，

  非常值得收藏。另外，Karl Urban、巨石強森和蘿莎蒙派克主演的毀滅戰士也是相當讓人

  印象深刻的作品。

  －

  其他劇情片，我們也整理了特價到$190的《心靈鑰匙》，這部以911受害者家屬為主角的

  片，藉著緊扣心弦的劇情和賺人熱淚的表演，奪得當屆的奧斯卡最佳影片，卡司也非常厲

  害，可以考慮入手。此外《復仇者聯盟: 終局之戰》難得特價到$350，如果沒有要收套裝

  ，這是以單部而言很不錯的價格了，可以參考一下。

  －

  最後，我們特別整理了多部評價不錯的軍事電影。從1949年的《戰場》到近期以美伊戰爭

  為背景，麥特戴蒙主演的《關鍵指令》。當然，也不能錯過特價到$90的超經典軍事片《

  鍋蓋頭》。每個年代的戰爭片都有不同的探討議題和表現方法，希望大家喜歡我們這次的

  整理。

  －

  以上，祝大家看片愉快

