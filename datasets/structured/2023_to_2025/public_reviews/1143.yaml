title: '[無雷] 音速小子-陪伴我從小到大的刺蝟'
content: '先講結論  我大概給80分

  然後電影結束後有彩蛋 一定要看

  不要正片結束馬上閃人

  還有電影裡面有一些電動出現的道具 可以仔細看


  以下應該無雷


  不曉得我這篇客不客觀

  因為音速小子是我從小就很喜歡的電動玩具


  還記得以前下課回家第一件事

  就是打開Sega Mega Drive..一定很多年輕人不知道這台是啥鬼

  然後玩音速小子



  每天玩都玩不膩

  超喜歡音速小子還有黃色會飛的小狐狸Tails

  還有帥氣的紅色刺蝟奈克魯斯


  (我小時候很長一段時間以為音速小子是豪豬)


  我玩音速小子的時間可能比超級瑪莉還多

  長大後各式延伸作也玩過不少 就不提了


  老實說這部音速小子真人版在上映前

  我就不太期待XDDD

  畢竟電玩改編作品大部分就是雷


  今天看完後 意外覺得不錯

  我覺得導演一定也是喜歡音速小子的玩家

  有些電玩裡面的招式 打BOSS的那種感覺 都有拍出來


  重要的是音速小子電動那種速度感 拍得也不錯

  (音速小子最剛開始好像沒有電影快成這樣XDD)


  儘管真人版限制比較多  我覺得改編的已經算是很OK了


  詹姆斯馬斯登的角色很討喜

  (偷推他Netflix的死生之交)

  金凱瑞則是把蛋頭博士改編的很有自己的風格

  都算是演得很好 金凱瑞尤其亮眼


  有不少笑點   可能為了小朋友吧  翻譯都有稍微調整

  甚至還有蠻多地方也很感人


  比較大的缺點


  就是這部算是聚焦在音速小子進入到人類世界


  音速小子原本自己的世界 電影中有演到  但出現時間很短

  覺得電影把他那個世界拍得蠻迷人的

  卻只有一小段  有點可惜 我覺得他在原世界可以多演一點


  然後出場主角基本上就是只有音速小子(不要算蛋頭博士的話)

  其實這看預告就知道了

  (還有另一個彩蛋就不暴雷了)


  感覺這部應該是在等看看票房之後  看有沒有機會拍第二集

  第二集應該會把原世界的朋友都帶過來


  最後跟名偵探皮卡丘比較一下

  講真的因為結構實在有點類似  所以還是拿來比


  我是喜歡音速小子勝過名偵探皮卡丘

  但我覺得名偵探皮卡丘比較有花心思在打造一個有神奇寶貝的人類世界


  看看下一集音速小子預算高一點的話能不能再多點東西


  分享一下

  音速小子可能不到娛樂超級大片

  但當作一個老少咸宜的電玩改編電影


  我覺得算是有成功打響音速小子改編成電影的第一步了


  --'
