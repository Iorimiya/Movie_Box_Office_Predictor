title: '[普雷] 小子難纏:空手道傳奇 澳洲試映'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  小子難纏:空手道傳奇日前在澳洲舉行試映，是小子難纏(The Karate Kid 1984)

  以及2010年由成龍和傑登史密斯主演的同名電影「功夫夢」的共同續集

  這次找回原版男主丹尼爾和成龍，訓練「西遊ABC」男主參加武術比賽

  眼鏡蛇道館似乎整組消失?


  以下當然有雷


  1.最後強尼有出來講兩句屁話


  2.片長不是公布的1小時50分，整片不到90分鐘


  3.本劇沒有警察也沒有裁判，幾乎是野手叢林法則，拳頭大的說話，好像網球王子的殺人

  網球，比賽違規扁人裁判不管，路邊扁人警察也不管，學校扁人老師也不管


  4.男主隨便就和一個白女談戀愛，然後到學校被大魔王霸凌，然後女主爸爸被討債集團

  扁，男主開始訓練老爸武術


  5.本片看不出空手道加入有甚麼意義，沒表現出來，甚至還出現成龍說中國功夫就是先發

  制人，是沒學過太極?然後劇組似乎搞不清楚到底拳擊、中國散打、日本空手道以及

  自由搏擊的差異到底在哪裡?比賽規則怎麼算


  6.男主用華人打折那套成功獲得女主芳心


  7.丹尼爾一個小時才登場，而成龍秀了一段家具打戲，把不少桌上的東西打到地上


  8.有戰鬥爽所不算太差


  --

  簡單秀一下'
