title: '[好雷] 摩比小子 Playmobil: The Movie (2019)'
content: '昨天看《艾瑪.》再次驚艷於 Anya Taylor-Joy 的魅力！於是來查查她近期還有什麼片我沒看過的，就找到了這部去年夏天法國上映的《摩比小子大電影》Playmobil:
  The Movie！台灣很多人愛玩樂高這無庸置疑，不過有多少人也喜歡玩 Playmobil呢？話說這兩種玩具說實話組成與玩法完全不同、產品開發的方向也完全不同、好玩之處也截然不同，不過可能兩邊產品的小人偶
  Lego Minifigure & Playmobil Figure 外型有那麼一點似曾相識，買玩具的家長常常拿它們比來比去的，很難免地兩種玩具的電影也被比來比去。


  一聽說 Playmobil也要拍屬於它的動畫電影，相信大家都會先想到星爵 Chris Pratt聲音演出的 2014 年舊片《樂高玩電影》、然後果然英語世界的影評要評《摩比小子大電影》時通通拿《樂高玩電影》的標準來比較，把《摩》片批到爛番茄鮮度
  17%均分 3.71/10，不過爛番茄觀眾分數與法國 Allocine 就好多了。當然也不會多經典，畢竟這並不是華納或迪士尼等大片廠大製作，比較像法國百代要練練功證明「歐洲也可以」，於是找了曾幫迪士尼拍《魔髮奇緣》與《冰雪奇緣》的動畫師
  Lino DiSalvo 來當導演拍這部。




  話說，《樂高玩電影》是很有創意的，它聚焦在「玩樂高」這件事上面，談了過去的創意組構千變萬化之玩法，對比於近年興起的、照說明書組裝好了就收藏起來靜態展示的紀念品式玩法，一場樂高人的冒險牽涉到了極權與自由、創意與規訓，的確有深意。而《摩比小子》呢？首先
  Playmobil就不是以「組構」為主，對許多家長來說是比樂高低等的低創意玩具；但本來 Playmobil大概就比樂高晚發展三十年，而且當樂高先發展組件而後發展人物時，Playmobil
  可是一推出就直接以人物為核心的，我個人甚至一度把它當男孩的簡易版芭比娃娃 XD


  Playmobil 人物特色就是：人型較大、身材比例較擬真、身上有各種配件可切換裝飾、周邊有 Playmobil Set的場景組合可以擴大情境... 大體上，Playmobil
  是以重現一種風情為主，譬如維京海盜、埃及探險家、亞馬遜叢林、中世紀武士、童話城堡公主、侏羅紀恐龍、彩虹飛馬... 等等，甚至近年許多美術館還跟他們合作「經典繪畫重現」。總之，如果樂高是在玩創意與動態組構、那
  Playmobil就是再玩經典與靜態風情，它其實並不複雜，但每一個 Playmobil figure 都有其實際的文化特色，讓孩子玩在手上想像自己穿越時空、對世界與歷史產生遙想與興趣。


  以我們家來說，是七歲小孩比較喜歡玩動腦的樂高、爸媽較喜歡玩風情獨具的 Playmobil、當然彼此也隨時換著玩。不過在孩子三歲還沒玩樂高時，一直是很愛 Playmobil的，因為那人物鮮明栩栩如生、而且很好拿在掌上想像著它跑來跑去、更別說人物的造型視覺風格強烈都是一個個文化與故事。玩
  Playmobil「做東西」的教育成分很少、但真正在「玩東西」的角色扮演成分很高，若要說「教育意義」那往往不在於它本身、而是玩它玩得開心後到處看書聽故事打開文化視野。




  因此，《摩比小子大電影》這部片的魅力就在於能不能抓到玩具的核心精神、能不能利用這精神架構起一個精彩連連的故事，我也認為這才是評價它時需要去考量的重點。劇情很簡單，聚焦在一對愛玩
  Playmobil的姊弟身上，姊姊 Marla自小玩 Playmobil玩到大了一直很想環遊世界、在 18 歲這天已偷偷申請一本護照、準備等爸媽回家告訴他們「我要一年
  gap year 自己去旅行」、並承諾八歲的弟弟 Charlie以後一定也會帶他去！兩人一路開心玩起他們最愛的 Playmobil時，突然門鈴響了警察上門帶來了噩耗...


  四年後，Marla 姊代母職成了柴米油鹽的家長，再也沒興致玩 Playmobil、對人生只感一片現實灰暗、完全忘記了曾經的「環遊世界」夢想、那本曾經夢想的「護照」就這樣塵封四年...
  仍過著童年的弟弟 Charlie在她沈重壓抑的教養下忍耐很久了，這天終於背著姊姊離家出走，路上靈感一來莫名走進了一間玩具店，店裡居然有他們曾經玩過的所有 Playmobil
  Sets 做成一個小型遊樂園、而且陳設都照他們童年的玩法與格局只是規模大百倍！而且還留了個位置彷彿在等待 Charlie帶來的維京大力士！剛好 Marla也趕到、Charlie
  不願跟回家、兩人一起被吸進了玩具世界中！


  沒想到兩人都變成了Playmobil figure！擁有夢想還很想玩的 Charlie變成他最愛的維京大力士、真是棒透了；但沒夢想的 Marla變成她當下穿著的土氣造型玩偶、真是遜爆了。Marla
  要如何找回人生衝刺的動力、如何找回想像與夢想、又如何重新相信自己還能做到？就成了這場「玩具世界大冒險」的成長主軸。他們姐弟一來馬上就遇上一場維京與日耳曼大戰、不久馬上陰錯陽差分隔兩地、Marla
  硬著頭皮踏上勇救弟弟之旅、一路上姐弟都會各自遇到友情背叛罪咎勇氣等考驗... 這一切基本冒險套路自不在話下，閱片無數的觀眾與影評都準備好打個「了無新意」了 XD




  說穿了，這種基本的姊姊救弟弟小冒險套路，是沒啥稀奇，不過就《魔王迷宮》嘛；這種進入玩具世界的套路也不稀奇，不外就《最後魔鬼英雄》或《野蠻遊戲》嘛；或是當作玩具世界晚上活了起來，不外就《博物館驚魂夜》或《玩具總動員》嘛
  XD 然後這裡面還包山包海地安插了很多其他電影梗，譬如《神鬼戰士》的皇帝與鬥獸場、譬如《侏羅紀公園》跑給暴龍追、譬如《雷神索爾》神力金髮男、譬如《星際大戰》女版賈霸來討債、譬如《第七號情報員》風流特務很自戀、譬如《不可能的任務》瞞天過海戴面具、又譬如《仙履奇緣》神仙教母幫換衣...


  也許乍看之下本片用梗都很淺很歡樂、一點也沒有深度、不像迪士尼皮克斯動畫那樣引經據典追古溯今令大人觀眾連連叫好，但我反而欣賞它的「淺度」「直白」與「熱鬧」，它沒有多宏大的故事要說、多深度的哲理要講、或多偉大的典故引用，就只是一個少女和一個小男孩在玩具世界裡越玩越開心、越冒險越起勁，如此而已。它的笑點都是很直接的、它的耍帥都是很乾脆的、它的耍笨更是有點白爛的；它的壞蛋陰謀也是很直白的、它的主角反撲是很直覺的、它的驚天逆轉則是很溫馨可愛而不用多威風帥氣的...
  很多大人影評都嗤之以鼻，不過我家小孩可一路津津有味呢。


  這樣子大雜燴熱鬧一回、陪孩子度過歡樂時光的電影，它有什麼特色與記憶點嗎？看這劇情套路與笑點模板好像是不太有，但一部 Playmobil 電影認真挖掘 Playmobil
  玩具世界觀，就是此片無可取代的特色：這個世界也許不是充滿天馬行空的想像，但它是許多不同的歷史文化古今歐外任我擷取的。Marla 尋找弟弟的旅程騎過馬騎過雪橇開過快餐車、還坐過飛毯騎過恐龍甚至當個美人坐上
  007的香車，一條高速公路帶她去了北歐戰場、西部小鎮、犯罪之都、星際城市、迷霧森林、童話古堡、中世紀古城、最後到了東西羅馬混合的「君士坦丁波里斯」要當神鬼戰士了！




  Playmobil 帶領孩子打開身心感官所要馳騁的，不像樂高是發揮組構創意開發巧手與腦力，而是要「行萬里路勝讀萬卷書」、好好探索不同文化交交新朋友！就這點來說，也許本片女主角
  Marla一路上並沒有多注意、小小觀眾們投入冒險情節也不會去想這麼多，不過等這一趟冒險結束之日，赫然發現不小心帶進玩具世界的那本塵封護照時，倒已不知不覺蓋上了
  Playmobil好多不同王國的戳章、每個戳章都印記著一段友情和一場試煉呢。


  說穿了，Playmobil 的價值並沒有那麼複雜，甚至聽來還很膚淺，就是鼓勵小朋友「敞開心胸想像世界」、鼓勵少年「放下包袱出去旅行」，如此而已，許多台灣觀眾搞不好還覺得這也是再鼓勵「台女愛玩不負責任」呢
  XD 當然每個人的經濟現實都要顧，但有多少人為了對現實的絕望而放棄了夢想的可能？有多少孩子像本片小弟 Charlie只是孩子就被迫長大？有多少人又像本片少女 Marla還沒成年就扛起家庭的重擔？有沒有財力出去享受是一回事、還有沒有一顆活躍的心去迎接一切未知才是真重要。


  本片兩位小姐弟一開始就父母雙亡，這劇情對兒童觀眾來說可能是衝擊了點，但很快進入柴米油鹽童年不再的苦悶生活，也許多少也提醒著我們世間各個有本難唸經的家庭們，是否多多少少為了強打精神面對現實的困厄、卻把童年應該敞開心胸自由化育的人格與心靈綁住了？回顧我自己身遭，小孩才小學一年級，部分家庭已經系統化訓練孩子競業求學、有的已訓練孩子獨立自主自己生活、有的已動員孩子參與家計勞動分擔責任、有的則已軍事化訓練孩子體育或音樂要長期栽培...
  是否，在孩子自由奔放的心靈綻放之前，有時我們已不自覺地太早強迫他們長大面對小社會？





  關於孩子教養的取向，在台灣也眾說紛紜，恐怕任何一個關心孩子的考量都有一大堆人不同意... 這部德國玩具題材法國動畫製作的《摩比小子大電影》，它鼓勵孩子們出去探索世界的用心、它鼓勵孩子們保持童心不要太快長大的提點，也許都有點太歐式取向、我們台灣觀眾未必都會接受？不過也不用嚴肅想太多，就放鬆徜徉
  Playmobil的玩具世界裡、看看一個與樂高分庭抗禮的玩具世界如何動畫呈現、也看看一部歐式動畫的歐風笑點與肢體姿態和美國有何大不同... 我個人是喜歡這種歐風比美式多很多！推薦
  Playmobil玩家與 Anya Taylor-Joy影迷觀賞。



  --'
