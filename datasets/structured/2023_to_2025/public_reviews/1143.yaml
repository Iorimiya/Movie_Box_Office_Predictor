  \ Sumpter)\n娜塔莎羅斯威爾 (Natasha Rothwell)\n亞當裴利 (Adam Pally)\n尼爾麥多諾 (Neal McDonough)\n\
  金凱瑞 (Jim Carrey)\n\n\n(2020)全新超級快英雄！《死侍》、《玩命關頭》幕後團隊最新力作，改編自著名SEGA電\n玩，敘述音速小子和他的朋友聯手試圖阻止邪惡的蛋頭博士。\n\
  \n《音速小子》是一部真人動作冒險喜劇，根據全球著名SEGA電玩改編，主角是一隻家喻戶\n曉的亮藍色刺蝟。\n\n描述這隻世上跑得最快的刺蝟是如何完全接受並熱愛他在地球的全新家園。在這部真人冒\n\
  險動作喜劇片中，音速小子索尼克(班許瓦茲 配音)和他全新的好麻吉湯姆(詹姆斯馬斯登\n 飾)攜手合作，阻止邪惡天才蛋頭博士(金凱瑞 飾)為了統治全世界不惜摧毀這個星球。\n\
