url: https://www.ptt.cc/bbs/movie/M.1584509674.A.4DE.html
title: '[普雷] 音速小子-能量正常釋放'
content: '如題


  這部很經典就是現在電影的做法


  倒敘讓故事變得簡單


  然後該遇到大魔王就遇到  該討論歸屬感也有


  電影裡它很可愛是有稍微加分啦



  不過我覺得不會有什麼鮮豔的感覺


  是一個四平八穩  完整的故事


  情節還算順  笑點就跟其他部差不多的數量



  個人感想是現在似乎流行這種簡單說故事


  像最後把瘋狂博士在蘑菇星球拍出來


  也是很正統的邪惡的最後一幕


  該嗨有稍微嗨  但畢竟他是外星刺蝟


  是他在嗨不是我在嗨哈哈哈




  勉強讓我比較有意見的是


  主角隨便就被說服要幫這個詭異刺蝟


  這邊我覺得理由可以再好一點


  接納的速度似乎也太快了




  不過這不是講人性的電影就沒差


  我給4.6 是一部安全 兒童家人情侶不怕雷


  就可以挑這部


  看完就也不會有特別心得哈哈哈 度過時間剛好



  --'
