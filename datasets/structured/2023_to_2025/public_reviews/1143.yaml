url: https://www.ptt.cc/bbs/movie/M.1734933220.A.BC3.html
title: '[新聞] 音速小子3首週票房登冠 把獅子王壓著打！'
content: '《音速小子 3》首週票房登冠、把《獅子王》壓著打！《木法沙》相較首集、票房下滑 1

  .5 億美元




  （圖片來源：派拉蒙影業、迪士尼影業）


  美國上週末，是聖誕節檔期的重要黃金戰場，派拉蒙影業、迪士尼影業分別祭出了兩大續

  集 ／ 前傳鉅製《音速小子 3》（Sonic the Hedgehog 3）與《獅子王：木法沙》（Mufa

  sa：The Lion King）捉對廝殺，而順利奪下上週冠軍的，正是人氣遠高於《木法沙》、

  各界早就料中的《音速小子 3》，後者收穫的觀眾評價甚至也高於前者。




  （圖片來源：派拉蒙影業）


  氣勢如虹的《音速小子 3》，首週以 6200 萬美元票房奪冠，《木法沙》則以 3500 萬美

  元少了對手將近一半的票房居次。


  兩部的開片成績均遜於前作，《音速小子 2》在北美首週進帳了 7210 萬美元，2019 年

  版《獅子王》（The Lion King）首週則高達 1.91 億美元，但《音速小子 3》只下滑 10

  00 萬美元，《木法沙》卻下滑超過 1.5 億美元。


  此外，《音速小子 3》的製作成本僅 1.22 億美元，《木法沙》則高達 2 億美元，需要

  達標的門檻明顯更高，有鑑於前作全球賣破 16 億美元票房，片廠也理應也寄予更高厚望

  ，但現在《木法沙》恐怕連要在院線回本都有點困難。


  文：Joker



  新聞網址：









  --'
