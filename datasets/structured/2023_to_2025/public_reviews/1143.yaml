  真正吸引我去看的


  反而是許久未見的金凱瑞


  已經很久沒有在大銀幕上看到金凱瑞了


  真的很懷念他那獨樹一格的表演方式


  也很高興他在音速小子裡的表現


  完全沒有讓人失望啊！



  在片尾中  他所飾演的蛋頭博士還活著


  看來極有可能還會出現在續集




  有人也是為了金凱瑞而去看音速小子嗎？



  --'
