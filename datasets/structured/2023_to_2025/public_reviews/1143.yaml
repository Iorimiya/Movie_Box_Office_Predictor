url: https://www.ptt.cc/bbs/movie/M.1505314909.A.160.html
title: '[問片]  （可能有雷）和卜派小子類似的老電影'
content: '最近聽到張震嶽的歌，突然想起他以前也有演電影，印象深刻的是一部「卜派小子/笑林

  小子」。

  演員有林志穎、徐若瑄、釋小龍、郝劭文等等。


  其實對劇情也有點陌生了，最有印象的是林志穎飾演的男主角很喜歡校長的女兒（徐若瑄

  飾），而徐濠縈飾演很男孩子氣的哥兒們，總是幫出追求主意，但其實喜歡男主角；張震

  嶽則是壞人的兒子.....XDD

  印象中，有一部西洋電影跟卜派小子的劇情非常相似，也是上述的紅粉知己幫忙男主角追

  女生，後來男主角才知道該珍惜的是身邊這位。


  我知道這劇情真的老套到炸，本來只想隨意估狗這部西洋片名，但我居然都找不到!!!!

  覺得想到睡不著，求神人開示。


  應該也是老電影了，至少20年前以上，

  有印象家人曾經在觀賞此西洋片時曾說這部就跟笑林小子一樣，但我不確定是誰先誰後。


  --'
