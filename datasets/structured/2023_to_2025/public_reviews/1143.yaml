title: '[問片] 問台灣早期的電影，線索較少'
content: '約20年前的電影台看到的

  好像是警匪或黑道片，因為有竊聽器


  我只記得一個片段

  有人安裝了竊聽器在自己的衣領折起來的地方(後頸處)要來蒐證

  但因為被壞人搭了一下肩膀(有tag後頸被搭)


  監聽器就掉到下面的水溝了(有tag水溝蓋撲通的一幕)

  所以就失去監聽的功能了



  被搭肩膀的人穿著的是牛仔外套，或者場景偏藍

  雖然不是重要的場景


  但20年了，再也沒看過這部電影，可是它就是一直在我腦中


  --


  請受我一拜，真的是這部.....'
