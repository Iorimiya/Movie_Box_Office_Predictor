title: '[討論] 上週全球票房，小子難纏徹底撲街'
content: '小子難纏:空手道傳奇在台灣根本沒排幾個廳上映，因為上週末撲街，結至這周

  票房總共才5200萬全球，不過聽說網飛會分攤成本，而且本片成本也才4000萬

  所以還行


  星際寶貝史迪奇上週持續奪冠，目前含這週累計6.3億美金


  不可能的任務上周次之，本周累計3.9億，看起來阿湯哥真的是血本無歸了QQ


  之前有看到版友問為什麼版上沒有票房文，因為小子難纏太冷門，史迪奇票房高到

  大家不關心


  當然重點是，票房文會被水桶，而且水桶標準是薛丁格的


  --

  能看

  好了啦版主說的話你有沒有在聽?乖

  我是學你的耶，所以你承認你亂檢舉人?

  看看下面的留言，誰精神勝利?

  確實阿，不只版規伸縮自如，連版主想要桶的意願也是伸縮自如喔!啾咪~

  我修了啥說說看啊?扭曲了啥?難怪人家說你愛引戰

  伸縮自在~'
