url: https://www.ptt.cc/bbs/movie/M.1706917259.A.F0C.html
title: '[新聞] 《音速小子3》曝光！金凱瑞確認回歸演出'
content: '《音速小子3》首波宣傳影片曝光！金凱瑞確認回歸演出「蛋頭博士」




  （圖片來源：派拉蒙影業）


  現正拍攝中的《》（Sonic the Hedgehog）第三集，今天驚喜宣佈了一項重大的

  卡司消息，那就是在前兩集飾演大反派「」的（Jim Carrey）確認會繼續

  回歸演出。




  這則消息之所以驚喜，是因為凱瑞兩年前在宣傳第二集的時候曾說已萌生息影念頭，此話

  一出，一度讓各界猜測他可能不會再續演第三集，而且電影都快拍完了，凱瑞這陣子依舊

  遲遲沒出現在官方公佈的卡司名單中，不過如今看來，凱瑞仍然是點頭答應歸隊了。




  （圖片來源：派拉蒙影業）


  除了回歸的凱瑞，克萊絲汀瑞特（Krysten Ritter）、克里斯托費南德茲（Cristo Fern?

  ndez）、詹姆斯沃克（James Wolk）、喬瑪塔康內（Jorma Taccone）等新加入的卡司也

  同步曝光。


  《》仍由前兩集導演 傑夫富勒（Jeff Fowler）執導，飾演「湯姆」的詹姆士

  馬斯登（James Marsden）、配音「納克魯斯」的伊卓瑞斯艾巴（Idris Elba）、配音「

  索尼克」的班舒瓦茲（Ben Schwartz）等原班底亦有回鍋。


  北美預定今年 12 月 20 日上映。


  除了宣佈凱瑞的回歸之外，官方今天也一併釋出了一段揭曉第三集片名 Logo 設計的宣傳

  影片（詳見上方連結）。


  文：Joker


  新聞來源： Variety IGN


  新聞網址：











  --'
