url: https://www.ptt.cc/bbs/movie/M.1448641115.A.1CB.html
title: '[好雷] Wonder boy 天才接班人/奇蹟小子'
content: '起初，只是因為看到內戰預告裡東尼心碎的神情，而想隨便找部RDJ的電影看看；


  然後，挑了一部劇情中有鋼鐵人和蜘蛛人搞基的；


  最後，發現這部的重點根本不是兩塊小鮮肉，而是頹喪又帥氣的老男人－－麥克道格拉斯



  【劇情】


  崔普教授是個披戴光環多年的小說家，看似事業平順、生活圓滿，骨牌卻在一夕之間紛紛


  倒塌。災難難以單純歸因，也無法回復原貌，只能任江水春流，被推送到不可收拾的境地


  後，再重新檢視自己的人生。



  站在崔普對立面的少年詹姆斯，一事無成，被眾人視作怪胎，所懷有的只是滿腹才華，和


  一部剛完成的小說。或許正因他毫無負累，反而能純真忠誠地往天賦之路前行，不被複雜


  的人事蛛網牽絆。相較於卡在瓶頸中的教授，他顯然就是"Wonder boy"、明日之星。



  然而，一如所有在一夕之間傾家蕩產者，不是自殺了結，就是擺落累贅、重新出發，被重


  重壓力淹沒的老教授，此時也正要在迷茫中穿越隧道，重尋人生的奇蹟。而那些可悲可笑


  的經歷，也在他理智清醒後，成為饒富意義的故事，在暗影中幽幽發光。




  【演員】


  *麥克道格拉斯


  很小就看過麥克的電影，但直到這部才真正開始欣賞他的演技。雖然不像西恩潘能挑戰多


  元戲路，也不似柯林佛斯深沉，卻自有其細膩委婉之處。走過影壇數十年，這樣一個反璞


  歸真的腳色，或許正適合不再需要光環的他。



  *托比馬奎爾


  正如其飾演的天才學生一般，托比是個年輕而富有才華的演員。怪咖詹姆斯呆愣而奇異的


  眼神，天賦異稟卻被排斥的寂寞與自信，乃至最後受眾人肯定的轉變，他都能精準詮釋。


  在一眾老牌大咖面前毫不顯怯，他確實就是螢幕上的奇蹟男孩。



  *小勞勃道尼


  總有人說RDJ不管演什麼都像RDJ，或許吧，但不可否認的是，他靈活生動的演技、投入劇


  情的熱忱，還是讓他成為極具魅力的演技派巨星。這個長年放蕩不羈的天才，在大夢初醒


  後才真正平步青雲，世人因而對「浪子回頭金不換」的情節感慨欣慰；我卻認為好在他曾


  如此瘋狂，否則怎能無比自然地演出那些亂糟糟的人生，舉手投足皆是虛構、亦是本色？


  或許他才是最像崔普教授的人，也只有他的傳奇故事，最能呼應"Wonder boy"的意涵－－


  小時了了，大未必佳，放下屠刀，又是好漢一條。






  --'
