url: https://www.ptt.cc/bbs/movie/M.1656377723.A.2E7.html
title: '[好雷] 太騷了，這誰忍得住《音速小子2》'
content: '海報取自：



  我得先聲明：



  真的，我沒有唬爛。

  我沒有唬爛。

  但是第一集最後那個尾巴實在是太騷了。

  太色了，毛茸茸的尾巴真的是色爆！


  圖取自動畫仙狐大人。

  尾巴真的是，會激起人的慾望的一種恐怖東西。


  圖取自動畫西頓學園。

  我真的不是獸控！



  =====所以我超期待這集=====



  先下一個結論：(人類)男女主角的演技還是很尷尬，對索尼克說話的時候，好像不是對著他

  說話，之間的互動，那感覺更詭異，只有金凱瑞的演出像是眼前真的有那麼一隻刺蝟在。


  這集一樣是走老套路的青春熱血風格……但男女主角真的讓人出戲，拜託金凱瑞繼續演第三

  集啊！


  一開始就是典型的「貓咪不在家，老鼠就作怪」。

  沒有人的家裡，索尼克雖然被限制外出，但還是能在家裡大鬧，直到蛋頭博士找到機會從蘑

  菇星球回到地球上。

  納克魯斯和索尼克的第一戰，就能看出兩者的差異，照理來說整體的力量會隨著速度上升，

  但納克魯斯還是單手接下了極速的一擊，或許在力量上他贏了索尼克，但在速度上卻差了一

  大截。


  劇情到這邊一直都沒什麼問題，而且也把上一集的伏筆(應該說未解之謎？)長爪原來是因為

  和針鼴一族決一死戰，所以才會犧牲的。

  這對納克魯斯和索尼克都不好過，畢竟兩人正是因此才成為了孤身一人。


  然而前往西伯利亞尋找王者翡翠的時候，那個尬舞實在是太尬了，大可不必做的這麼闔家觀

  賞，像第一集那樣，把玩整個餐廳，那種感覺會更加爽快。


  婚禮那一段的確出乎意料之外，我以為只會是單純破壞了婚禮，沒想到居然都是國安局(×)

  的埋伏，而且塔爾斯的發明都莫名能派上用場，真不愧是我可愛的小尾巴♡♡♡


  再來是找到翡翠迷宮那一段，既然光都能透出來照上天了，，而且從

  上面的視角也能看到迷宮全貌，那為什麼非得走進迷宮裡？然後走進迷宮裡又幾乎都是都有

  頂蓋的，難道純粹只是讓觀眾看看透視圖嗎？

  這邊我一直覺得很奇怪，幹嘛不走上面就好？


  然後就是索尼克和納克魯斯的再戰，我彷彿看見了永恆族那一個超音速(瑪卡瑞)對雷射眼(

  伊卡洛斯)那一戰，利用速度來壓制力量，然而卻因為「鷸蚌相爭，漁翁得利」被第三者得

  手。


  蛋頭博士的背叛，後面的發展大致上也就是能猜到的那種。

  然後男女主角迎接索尼克的劇情一樣尷尬。

  真的很尬，雖然跟空氣(？)對戲的確很難……


  不過這集沒有上MX4D，那時候時間也不允許，根本沒辦法進電影院看電影，只好最近在串流

  上看完了，好想在電影院看QQ，下一集應該有機會吧？



  =====算是很中規中矩的續集=====



  劇情幾乎都是預料之內的，唯一沒料到的是，金凱瑞拍完這部後，居然要息影了？？

  這部唯二能看的就是金凱瑞和和動畫人物耶，我不想一直看到男主角跟索尼克那麼尷尬的互

  動。

  不過下一集還是能期待塔爾斯的出現，想到這裡就讓人哇苦哇苦的，好興奮啊！


  一條尾巴已經夠色了，兩條尾巴根本讓人無法自己，當初設計塔爾斯的人真懂啊！


  --



  不，我真的不是

  欸等等，動保不保護外星人

  好色龍

  好色龍是真的，但我不是！！

  愉

  還好啦，有塔爾斯就60分起跳，劇本再糟也還是有60分

  納克魯斯和索尼克的故事寫得很不錯，但人類方的就真的很多餘，而且也沒有多有趣

  沒有鼓起來！

  哇塞，難怪這麼……

  男的更好，不會懷孕

  就是騷，我不知道還有什麼形容詞可以形容那兩條尾巴

  跟你說，google搜尋塔爾斯的日文是テイルス，如果想看色色的圖，就再加上アダルト

  不是，我沒看過汪汪隊，我很專情，獸類我只喜歡塔爾斯，大概


  那不是更好嗎！

  對啊，公的更騷好不好！'
