url: https://www.ptt.cc/bbs/movie/M.1498882625.A.1D9.html
title: '[問片] 想找小時候看過的一部華語片(有雷)'
content: '各位大家好，小弟這幾個禮拜一直在找一部片


  是小時候看過的一部華語片


  內容講述鄉村裡面的A、B家族


  A家族清一色生男兒，B家族清一色生女兒


  忘記是什麼原因了，A、B家族互相仇視，彼此互不往來


  結果A、B家族的大兒子跟大女兒偷偷談戀愛


  事跡敗露後，B家族老爸雖然於心不忍，但礙於家法之類的，要浸大女兒豬籠


  浸一炷香時間。


  眾姊妹就在岸邊猛吹香，試圖縮短時間


  印象大概就到這邊，依稀記得是個快樂結局(?)


  谷哥了幾個關鍵字，還跑去邵氏電影的清單找


  怪怪嚨叮咚，邵氏電影超多! 有點大海撈針的感覺


  就上來問問神通廣大的版眾了


  不然總感覺一個東西卡著沒解答，很是不痛快





  --'
