url: https://www.ptt.cc/bbs/movie/M.1574956979.A.420.html
title: '[新聞] 整容幕後！派拉蒙本就愛《音速小子》原版'
content: '《音速小子》整容幕後細節 派拉蒙還挺喜歡原版設計





  顯然，在短期內幫電影《音速小子》的形象「整容」不是一件容易的事，但是幕後團隊的

  確成功做到了，還收穫了粉絲們的一致讚譽，這究竟是如何辦到的？


  參與了新舊音速小子設計的阿根廷動畫師Max Schneider近日在採訪中透露了不少形象重

  塑背後的趣聞。，因為在此之前他們已經用舊設

  計做完了幾乎整部電影。



  ，類似於《忍者龜》、《變形金剛》電影。




  。預告發佈後，網路公眾才終於給他們敲響了警鐘。



  派拉蒙和美國SEGA進行了一場大型會議，決定對音速小子進行整容手術。 Max還證實了超高支出。





  其實對於藝術師和動畫師來說壓力並不大。重新設計的過程從頭部開始，他們把原版設計

  和當代音速小子遊戲中的腦袋形象並排放在同一個螢幕上，一個點一個點的去對比出什麼

  地方能夠修改，令他們更加相似。音速小子的是最後修改的部份。



  如今的電影版本中，有一些原版重複使用的素材，但「」。動畫師還

  指出，設計團隊和動畫團隊完全分開彼此獨立，因此動畫師只聽令於製片人和導演，在設

  計過程中並沒有發言權。



  最後Max保證重新製作的《音速小子》看起來相當棒，有非常多的彩蛋和有趣細節，專門

  為系列粉絲而準備。







  --'
