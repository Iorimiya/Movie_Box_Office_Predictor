url: https://www.ptt.cc/bbs/movie/M.1735611876.A.EAA.html
title: '[雷] 音速小子3 個人對結局安排的感想'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  以粉絲向娛樂片來說，第三集我覺得也有保持應有的水準


  但對於決戰以後的安排個人覺得有不少可惜的地方，特別是以下兩點



  對於蛋頭一家沒有救贖


  博士在知道爺爺心中根本沒有自己，而是只想著瑪麗亞與復仇後，就果斷把爺爺給殺了


  以全年齡向來說這種邪惡終將被消滅的劇情當然沒問題，但以這部電影的主題來說就顯得

  相當可惜


  如果改成博士成功回到艦內並阻止了爺爺，最後讓爺爺知道自己雖然不是瑪麗亞，但也是

  他現在唯一的家人（更是博士夢寐以求的家人），在爺爺反省後跟博士一起阻止加農炮毀

  滅地球，這樣的情節不但有救贖，也讓博士決定拯救地球與向助手道歉的安排更合理—因

  為得到了家人而放下偏執。再者，如果第四集金凱瑞一樣有出演博士，也能讓他存活變得

  更合理簡單—爺爺在最後關頭救了自己


  且遊戲中夏特理解瑪麗亞的願望後決定拯救世界的橋段，也可以安排在爺爺這裡成為他改

  過放下的理由，不然瑪麗亞不像原作中還有遺言，真的是突然被炸死後就沒什麼戲份，也

  是可惜了這角色的定位



  敘事不夠流暢


  當夏特跟索尼克和解後，兩隻刺蝟一起超級化，SA2主題曲響起，以為要嗨起來的時候，

  鏡頭才轉到博士跟爺爺的小打小鬧，氣氛斷層。一邊是宇宙規模的超級賽亞人打架，一邊

  則是兩個cosplay 成蠍子跟螳螂的老人在打架，真的很可惜了



  大概是這樣







  --'
