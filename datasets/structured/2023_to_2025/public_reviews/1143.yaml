url: https://www.ptt.cc/bbs/movie/M.1582385569.A.AAD.html
title: '[無雷] 音速小子 老少咸宜的好片 '
content: '音速小子是電玩改編的電影  本來以為是更適合兒童方向的電影


  在大家說好看之後 我也進場看看閃電般的速度是如何跑法~~




  電影海報上明顯的兩大主角 音速小子及蛋頭博士


  說明了蛋頭博士（金凱瑞 飾演） 是想讓觀眾入場的一個原因


  很久沒看到金凱瑞了 是吧


  金凱瑞在本片出現的時間剛剛好 他的喜劇魅力不用多說了


  但是壞壞的主角也要有配角陪 不然蛋頭博士的孤高個性在獨角戲之下


  就成為了瘋子




  蛋頭博士有個手下 常常出現在他身邊 看似不重要的人物 但在兩人交流


  之間 反而了解蛋頭博士的個性及明白他下一步要做什麼


  有時也增加了笑點 很是有趣




  音速小子是個愛玩的角色 但他的心智年齡是在大學新生的感覺


  對什麼事情都感興趣 有時卻也比一般人懂事


  他和男主角的相處過程 就是一場交朋友的經過  一起玩一起旅遊


  一起逃亡 一起對抗蛋頭博士




  這是電玩改編的電影 卻能吸引一家大小進場 不論是誰都能看得開心


  片尾也很有意思 要看完片尾再走喔~~



  --'
