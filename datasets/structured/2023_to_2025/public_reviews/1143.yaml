title: '[新聞] 釋小龍合體林志穎引網友暴動 '
content: '你長大他沒老！釋小龍合體林志穎引網友暴動




  018年07月23日 07:45 中時電子報 盧怡秀／綜合報導


  林志穎1994年主演的電影《卜派小子》中，和釋小龍、郝劭文等人一起搞笑，而現在的三

  個人都還在演藝圈闖盪。不過今日凌晨，釋小龍在網上曬出與林志穎的合照，引來網友暴

  動，不少人喊著「回憶殺」，更有人說「你長大了，他還沒老！」


  林志穎當年在片中和釋小龍在少林寺相遇，這回則是在「成龍國際動作電影周」中碰面合

  體！如今24年過去了，粉絲再度看到兩人合體可說超級驚喜，釋小龍本人也很興奮，直呼

  「小師傅和四毛重聚！」


  對於兩人合體，釋小龍如今也已經是個帥氣男星，林志穎則是宛如防腐一般沒有變，網友

  就笑讚「你長大了，他還沒老！」許多人更敲碗直呼希望兩人能再合作。


  (中時電子報)







  天啊!

  卜派小子是小時候看的電影

  怎麼林志穎的時間好像都停止了


  --'
