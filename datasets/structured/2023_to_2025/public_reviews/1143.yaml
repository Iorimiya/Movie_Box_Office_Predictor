url: https://www.ptt.cc/bbs/movie/M.1649220568.A.E64.html
title: '[普好雷] 音速小子1&2'
content: '之前1的心得應該沒在這發過

  剛好一起比較

  以下有雷
























  基本上這兩集對於服務粉絲的誠意我給100分

  遊戲還原度屌打一大堆電玩改編電影

  尤其是金凱瑞的蛋頭博士更是神來之筆

  只是我個人覺得第1集比第2集好看

  這次的人類戲份太多餘了 又很難笑

  對於塔爾斯和納克魯斯的個性刻畫部分還不錯

  用尬舞來建立塔爾斯的信心是不錯的點子

  納克魯斯也是印象中的肌肉直腸子

  「我的組成百分之一百萬是肌肉」XD

  可惜我印象中沒有三人組的合體技


  還有我以為會演出經典的塔爾斯飛行疲勞在雪山掉下來之類的 竟然沒有

  然後渾沌寶石也一開始就直接合成王者翡翠

  不用一顆一顆收集

  不過要演收集7顆可能要再拍個3集左右 還是算了

  蛋頭博士完全體講話有回音滿厲害的

  紅衣服也變黑色系 有夠帥

  但是翡翠被打出來衣服還變回紅色 笑死


  整體來說還是推薦進電影院看

  特效滿爽的 塔爾斯萌萌

  演到人類的橋段可以放空休息一下


  --'
