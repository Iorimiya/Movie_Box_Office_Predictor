url: https://www.ptt.cc/bbs/movie/M.1759835945.A.8EA.html
title: '[新聞] 快訊／《好小子》顏正國病逝！享年50歲'
content: '新聞網址：




  演出《好小子》系列電影聞名的顏正國，2018年執導《角頭2：王者再起》，創下破億票房

  ，未料今（7）天傳出過世，家屬表示「極度沉痛、無限不捨」。


  顏正國家屬今天發出訃告，提到他今天下午4點57分撒手告別人間，「阿國的驟然離去令全

  體家屬及親友深感難以承受的重擊與悲痛，然而我們選擇將這份不捨化為對他無盡的追憶，

  阿國的愛與精神將永遠長存於我們心中。」


  另外家屬也表示，「思念阿國的親友們與我們一同靜默地獻上最真誠的祝福，讓愛伴隨阿國

  遠行安息。此刻懇請親友體諒，給予家屬必要的悼念與處理空間，謹此泣哀告。」



  2003年顏正國曾因擄人勒贖案入獄服刑，服刑10年後浪子回頭。顏正國2018年執導幫派電影

  《角頭2：王者再起》，票房高達新臺幣1.27億元，遺作包含《孔雀魚》、《今夜一起為愛

  鼓掌》等。



  --'
