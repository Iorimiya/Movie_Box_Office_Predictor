url: https://www.ptt.cc/bbs/movie/M.1712941578.A.32D.html
title: '[新聞] 《驚聲尖笑》睽違 11 年重出江湖！'
content: '《驚聲尖笑》睽違 11 年重出江湖！《音速小子》製片籌拍全新「重啟」版、鎖定明年上

  映




  （圖片來源：米拉麥克斯影業）


  自 2000 年開始，至今一共推出了五部電影的《》（Scary Movie）系列，已長

  達 11 年未再製拍新作，但稍早意外宣佈，他們早在著手籌拍全新重啟版，並

  找來近年為他們監製過《》（Sonic the Hedgehog）真人系列作品的尼爾 H. 莫

  瑞茲（Neal H. Moritz）擔任製片人，並計劃於今年秋季開拍、明年正式上映。




  （圖片來源：溫斯坦影業）


  《》首集當年憑 1900 萬美元的極低成本，在全球狂賣超過 2.7 億美金，此後

  直到第四集，平均每部也都至少會賣出全球破億美元的票房，不過 2013 年的第五集沒找

  回（Anna Faris）、（Regina Hall）兩位核心班底回鍋，製作品

  質也大幅下滑，斬獲了各界諸多負評，包括票房也是全系列最低，連破億美元基本門檻都

  沒達到，僅進帳 7800 多萬美元。


  暫未透露新版《》會由誰編導、由誰主演，確切的上映日期也還沒揭曉，

  這些訊息仍待後續更新。


  文：Joker


  新聞網址：




  --'
