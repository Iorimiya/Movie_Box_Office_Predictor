url: https://www.ptt.cc/bbs/movie/M.1574156925.A.65E.html
title: '[新聞] 《音速小子》進廠維修大成功　不過整形費'
content: "《音速小子》進廠維修大成功　不過整形費卻高達3500萬美元\n\n新聞網址：\n\n\n《名偵探皮卡丘》(Detective Pikachu)在電影上映後大獲好評，證明了以寫實風格呈現\n\
  的電玩角色照樣能夠受到粉絲們的歡迎。然而，派拉蒙推出的《音速小子》(Sonic the\nHedgehog) 真人電影版卻是獲得了截然不同的評價。\n\n當《音速小子》的首支預告正式公開之後，粉絲們對於索尼克在這部電影中將會採用的「\n\
  寫實風格」感到相當不滿，像是高挑的身材比例，又毛又詭異的外貌，還有那令人感到不\n適的「真牙」...在引起了廣大的反彈之後，派拉蒙影業也直接宣布《音速小子》真人電\n\
  影版將會延後上映並「進廠維修」，為索尼克設計出全新風格的造型。\n\n就在上週，官方也終於釋出了這半年來的最終成果，這次確實帶來了更加貼近原作風格的\n索尼克。從白手套、紅白跑鞋，到大眼睛都更像粉絲們所熟悉的那位音速小子。根據\n\
  \ Social Films 的報導，這支全新預告在上線的 24 小時之內，已經獲得了舊版預告 6\n倍以上的按讚數。當派拉蒙在今年 4 月公開上一個版本的《音速小子》預告片時，那部\n\
  影片在 24 小時之內有 22 萬 5683 位觀眾按下了「不喜歡」，而按「喜歡」的觀眾卻只\n有 14 萬 6263 人。\n\n到目前為止，這支全新版本的《音速小子》預告片獲得了高達\
  \ 98％ 的按讚比例，按下喜\n歡的觀眾高達了 89 萬人，而不喜歡的則降到了 1.5 萬，證明了大部份的觀眾都非常滿\n意這個修改後的結果。這對於《音速小子》這部電影來說無疑是一種相當成功的行銷手法\n\
  ，但派拉蒙影業在這次的新設計上又花了多少的預算呢？\n\n根據目前的傳聞，光以這支預告來說，派拉蒙影業在重新設計上就花費了 215 萬美元。\n至於整部《音速小子》電影，派拉蒙為了讓觀眾們看到這全新版本的索尼克，付出了高達\n\
  \ 3500 萬美元的額外預算。Social Films 在報導中提到：「《音速小子》最初設計的版\n本在特效上的預算約為 1800 到 3100 萬美元左右。」\n\
  \n\n值得一提的是，《音速小子》在修改前的總預算約為 9000 萬美金，如果再加上了重新設\n計所花費的 3500 萬，代表了《音速小子》成為了一部預算高達\
  \ 1 億 2500 萬美元的電\n影，但這個數字仍然略低於《名偵探皮卡丘》的 1 億 5000 萬預算。\n\n\n心得：\n\n進場維修前後參考\n\n\n\
  \n比較好奇前面會有人看嗎？\n\n因為決策問題多花了3500萬美...\n\n--"
