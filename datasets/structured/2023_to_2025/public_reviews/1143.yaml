url: https://www.ptt.cc/bbs/movie/M.1736170443.A.A3D.html
title: '[新聞] 音速小子4確定續拍 那蛋頭博士回歸（雷'
content: '《音速小子4》已經確定續拍、那「蛋頭博士」還會回歸嗎？金凱瑞回應了




  （圖片來源：派拉蒙影業）


  《》（Sonic the Hedgehog）系列人氣一集比一集高，好口碑亦持續不斷升溫，

  派拉蒙影業更早早就在第三集上映當天宣佈，第四集確定已經投入開發、檔期也拍板定案

  ，但飾演「」的（Jim Carrey）是否會續演未來更多的集數，依舊是未知

  ，因為金凱瑞顯然沒簽下複數片約，不會被約束必須履行演出續集的要求，每集都是

  單獨邀請他回鍋。





  自第二集開始，該系列都會在最後給蛋頭博士一個看似已被賜死的結局，這集也不例外，

  蛋頭博士最後壯烈犧牲，選擇與爺爺「傑拉德」製造的滅世武器同歸於盡。


  而既然原本乍看已在第二集領便當的還在造謠喔？可憐哪'
