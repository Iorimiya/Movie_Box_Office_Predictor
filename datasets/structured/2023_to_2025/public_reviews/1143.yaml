title: '[問片] 富家女愛上窮小子'
content: '富家女坐飛機頭等艙，窮小子不知道什麼原因座位被換去頭等艙，

  女生被另一個男生言語騷擾，就順勢把窮小子抓到自己旁邊坐

  飛行過程中遇到亂流，女生緊張就抓緊了男生的手


  落地後女生把USB遺忘在座位底下，男生追了出去沒追到


  女生到公司後才發現USB不見了，但座位電腦上貼著電話號碼


  女生打電話過去，男生跟她說USB的事，兩人約在酒吧


  男生還把女生介紹給自己的朋友認識


  後來要騎機車載女生回家拿USB時，


  女生不會繫安全帽，男生幫忙繫的時候被拍下疑似接吻的照片


  女生後來去大學找男生(校園逛逛)


  家裡還安排女生相親(對象是醫生)


  好像女生38歲，男生是18歲的大學生


  女生還有帶男生去看名模走秀，模特兒跌倒了，男生還去幫忙扶起來


  查了一下是片名寫癩蛤蟆想吃天鵝肉，但是我找不到，


  想說是不是另外一種片名?


  --'
