url: https://www.ptt.cc/bbs/movie/M.1655807080.A.E50.html
title: '[好雷] 音速小子2 '
content: '看完覺得很適合闔家觀賞的片 而且蠻精彩的

  打鬥畫面流暢 劇情也還不錯

  對我來說卻是個回憶殺

  看到catchplay+上有

  就把手上的電影券用下去

  金凱瑞看一部少一部怎麼能不看








  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~









  說實話 這大概是近年來電玩改編成功的作品之一了

  索尼克的人設並沒有因為自己有特別的能力而自負

  卻是保有著一絲的純真與坦率 面對需要協助時



  總能有著滿滿的幹勁與不懈的精神

  跟荷蘭弟的小蜘蛛 人設有點相似

  所以角色的塑造很討喜也很親民



  不甘寂寞就在家裡亂搞

  也跟大部分的孩子一樣

  想要大展身手 卻又無從下手

  一但爸媽不在家

  就會在那一刻 把精力全部爆發出來


  (有些有養毛孩的應該覺得這幕似曾相似?)



  直到彈頭博士的到來 還帶著幫手

  雖然打得難捨難分

  但面對納克魯斯強力的攻勢時

  他沒有想要決戰生死的念頭

  這點是我很喜歡的部分



  我很喜歡兩人打鬥時的電光

  整個過程非常精彩

  特效上也是充滿了華麗與炫光效果



  讓我很感動的是

  雖然兩人之間有些爭執在

  但在納克魯斯意外墜入海底被重物壓住時

  索尼克也不顧一切地伸手去拯救



  所幸在最後一同經歷生死後

  經過一番的談心 索尼克治癒了他的心

  納克魯斯也不再抱有敵意

  並達成協議要一起阻止彈頭博士 並奪回綠寶石



  到最後寶石在索尼克守中碎裂 也激發出了巨大能量

  索尼克強大的力量讓他從藍色炫風變金色旋風




  也順利的擊敗了彈頭博士所打造的巨大機器人

  但索尼克並沒有因此而想霸占住這強大的能量

  而是讓寶石的能力抽離體內

  歸還寶石讓他回到原本的地方



  其實我覺得這部電影所表達的東西很正向

  要給小朋友看也非常ok

  連大人看也不覺得很幼稚

  反倒是喚醒了大家心中的良善與率真


  但我最喜歡的還是塔爾斯

  以前還在電玩時期就很喜歡他了

  有點呆 卻是機械高手


  不論是在電玩裡還是在電影裡

  他都是索尼克的神隊友

  總是會為朋友那麼奮不顧身

  如果生活中有這樣的一個朋友真的要好好珍惜

  可遇不可求XD


  而且他很多場景都還原了電玩關卡 熟悉感直線上升




  金凱瑞太棒了(泣



  --'
