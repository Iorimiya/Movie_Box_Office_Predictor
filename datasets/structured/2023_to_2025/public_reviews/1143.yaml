  隨著第二集結尾留下的伏筆，原本以為故事發展會受限，但第三集依然帶來了驚喜

  片尾彩蛋讓人期待





  第二集結束還想說，超級索尼克都出現了

  第三集還能怎麼打，結果夏特也變身

  超級帥的…打得毀天滅地

  片尾沒想到是夏特…還以為是蛋頭


  女朋友來了、夏特復活加上蛋頭變友善…

  這集已經打上宇宙，兩位超級強度

  這下不知道第四集強度會有多高啊啊啊



