url: https://www.ptt.cc/bbs/movie/M.1648716820.A.37B.html
title: '[好無雷] 音速小子2'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  有幸抽中版上的首映會票.第一次看到首映的電影就獻給音速小子2了!

  現場還有一隻人偶裝音速小子，很多人搶著合照(怎麼沒有塔爾斯!!



  這部絕對是非常適合親子闔賞的一部電影，影片中的笑點總是能讓院內的大人小孩

  一起笑開懷，作為續作，這部的場面更大，特效也誠意十足，看著以前遊戲的腳色出

  現在大螢幕真的滿滿的感動。


  金凱瑞飾演的蛋頭博士依然搶眼，誇大的肢體動作跟表情讓這個反派角色造就了很多笑

  點，是一個很難讓人討厭的角色，不過是說在這一部蛋頭博士的助理會不會太誇張XD

  腐味爆表的表現讓我也好想喝一杯特製奶泡的拿鐵。


  黃色狐狸塔爾斯在電影裡面的呈現太可愛了，毛茸茸的觸感表現得很好，膽小害羞的時

  候真的好想抱牠入懷，劇中一幕塔爾斯回應索尼克貼心地幫牠蓋被的動作真的好想立馬

  收編一隻，而牠對於這次續作劇情推進也占了蠻重要的角色。


  劇情步調有一點可惜，前面花了蠻多篇幅交代了第一集的角色後續以及日常，雖然輕鬆

  但覺得可以縮減一些內容，但中後段就非常的精彩，片尾撥放工作人員時的呈現方式也讓

  是老玩家們有一些感動。



  --




  他的力量表現很棒，但本人不太喜歡力大傻腦的這種設定，為什麼不能智力武力都點滿




  如果對角色有一點認識的話其實沒影響喔！主要就是要知道蛋頭要回來復仇啦！



  沒進戲院就看不到囉（？！'
