title: '[好 無雷] 淺草小子，感人的師徒'
content: '滿意外這部討論度這麼低，

  看Netflix也一段時間了，

  這部大概是Netflix原創電影裡劇情類最棒的一部（雖然有種在屎裡面挑飯的感覺XD），

  改編北野武自傳描述諧星的起落，

  整體劇情滿像花火的，

  但覺得這部更加深師徒的關係，

  看到當時演無人知曉夏日的柳樂長大了，

  演技一樣很好（前面要習慣一下他刻意的表情），

  然後認識了大泉洋，超愛他的演繹，

  音樂、畫面、角色塑造也都不錯，

  看了兩遍，還是覺得好看，推一個!


  -----

  Sent from JPTT on my Xiaomi Redmi Note 8 Pro.


