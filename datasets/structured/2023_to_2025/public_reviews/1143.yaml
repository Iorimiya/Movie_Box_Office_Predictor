url: https://www.ptt.cc/bbs/movie/M.1760495615.A.938.html
title: '[請益] 功夫小子闖情關'
content: '防雷請教一下

  這部片我是很久以前在第4台看到的，片名叫“太極拳2“

  最近又想翻出來看

  google後才知道片名應是“功夫小子闖情關“又稱“太極拳“


  到底這片是又叫“太極拳“還是“太極拳2“，

  如果是2，那原本的1又是指哪片？

  有了解以前歷史的大大可以講古一下嗎？


  另外這主角吳京就是那個吳京嗎？還是有兩個叫吳京的人？


  主角老爸，也常演少林寺時期李連杰師父的演員

  到底是叫 於海 于海 還是 余海，

  看過很多版本，感覺是簡轉繁的問題，又好像不是。


  另外請教一下，很多老片，如“中南海保鏢“

  wiki上反而是粵語另有配音員，

  所以這些片原本是以普通話拍的？

  鄭則仕還在片中講了幾句台語。

  這片也是另一種的 The One 對上 賽洛芙


  -- 以下有雷 --


  劇情有點老功夫片的老套路，片尾幾場的武打畫面有點偏暗，

  其餘還算不差，萬年反派計春華這部有點弱

  有巔峰期的阿麗，還有美麗岳母小環--胡慧中

  古裝阿麗看起來像村姑有點土，不知道是阿麗不適合古裝

  還是衣服及妝髮的問題。

  因為主角威能，可能又怕壓過老爸，

  強給了一個不合理的辮子功，讓他在拳腳上輸老爸，

  又有比老爸強的地方。

  英文名子是老媽在留洋時期喜歡的人“Jackie“

  不知道是不是暗指當時應該算紅的Jackie Chen？

  鐵達尼號隔年才上映，不然主角英文名也許就是Jack了

  片中比較不合理的是

  阿麗在片裡做的事有點突兀，

  4個假洋鬼子沒什麼能力，感覺也沒什麼組織或金援

  阿麗會跟他們混在一起做事有點不搭。

  片尾突然秀了一手在美國夏威夷（？）學的鎗法，

  比土耳其無課金射手迪基斯還強，

  不怕射到自己人，或害他耳朵壞了嗎？

  柯南都教說要射人質腳了


  --

  當年不少功夫片都有一定的水準，

  雖然還是有套招感，但看起來還算賞心悅目。

  李連杰開的正東也拍了不少好片，方世玉、張三豐等

  可惜因為版權問題，現在都沒辦法收藏了Q.Q


  --

  原來如此

  感謝回應，長知識了

  哈哈，已改，偶台灣狗語啦'
