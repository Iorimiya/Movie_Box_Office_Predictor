url: https://www.ptt.cc/bbs/movie/M.1649067368.A.9F6.html
title: '[好無雷] 音速小子2'
content: '趁連假趕快來看音速小子2

  整體而言

  這次感覺比1更加有來自電玩的感覺

  有很多致敬的小細節

  劇情上不要思考太多大致上都可以過去

  因為Tails超爆可可愛愛，救命啊


  金凱瑞真的很強

  他把Dr. Eggman這個角色演的活靈活現

  個人認為比原作的更有魅力

  每個小細節小動作都可以感覺到這個角色的癡狂與瘋癲

  希望音速小子3能符合他所說的

  「天使突然送來一本用金色墨水寫的劇本」的條件

  讓他願意繼續演


  人類男女主跟Sonic的對戲有時有些空洞

  好像看著遠方說話或是眼神失焦

  稍稍有點讓人出戲

  但覺得既然重點不在他們身上就算了


  Tails可可愛愛，救命啊

  蜷縮起來睡覺覺真的太過可愛

  我也想跟他一起抱尾巴睡覺覺


  Knuckles 則有種比遊戲原作更笨的感覺

  印象深刻名台詞是表示自己身上百分之一百萬都是肌肉


  這部片適合給Sonic粉絲、想看輕鬆快樂片

  被Tails的可愛撫慰的觀眾




  -----

  Sent from JPTT on my iPhone


  --'
