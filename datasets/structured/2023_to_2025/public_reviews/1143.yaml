url: https://www.ptt.cc/bbs/movie/M.1648653274.A.22C.html
title: '[好雷] 音速小子2'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~














  剛剛看完中文版的特映

  老實講應該還會二刷一次英文版

  雖然音速小子劇情根本不重要

  但總覺得被略過很多梗

  .

  .

  .

  以下有雷







  優點部分


  特效給超滿，各種遊戲場景、迷宮、雪地，都可以看到索尼克狂奔狂彈（？

  快銀式慢動作也有～


  塔爾斯的棕光（？看了也超令人感動的QQ，金凱瑞這集又演得更靠北，整個影廳大人小孩

  都被戳到笑點。



  遊戲粉絲應該會很感動，尤其是索尼克塔爾斯跟納克一起合作進攻的部分

  還有出現黃金索尼克，帥炸又爆強，結尾還出現黑色音速小子？是夏特？有點不確定，但

  一樣很帥



  缺點的話就大家都想得到的沒什麼劇情，尤其是中間有一段超出戲的假婚禮追殺劇情，覺

  得超沒必要，但整體是好笑的，加減看了….




  以上 如果看過第一集覺得還行或是好看的

  或是本身就是粉絲，有SEGA 滿滿回憶

  我相信第二集真的適合你進場




  如果對於索尼克沒半點印象跟回憶的

  我想看完應該也是覺得普普而已


  --

  就是他了！

  拿滿了哈哈哈

  至少我覺得比秘境探險好XD'
