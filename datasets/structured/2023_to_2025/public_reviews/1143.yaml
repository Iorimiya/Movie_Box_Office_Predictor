url: https://www.ptt.cc/bbs/movie/M.1592851818.A.F1F.html
title: '[超好雷] 音速小子電影版 (有雷)'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n觀看方式：MOD (80元單點)\n\
  \n音樂：8/10\n個人覺得這一部的音樂運用最好在於索尼克大鬧酒吧，還有蛋頭博士研究室獨舞這兩段。\n\n\n劇情：8/10\n\n不是特別的蓬勃大氣或宏觀，但是很爽、很舒服、很有趣。\n\
  一開始敘述索尼克的孤獨，在1小時又40分鐘的片長中，佔15分鐘其實偏長，\n不過在我快要快轉的時候，就發生了綠丘鎮停電事件，所以節奏算是調節得很剛好。\n\n\n\
  在主線進行方面，索尼克與主角湯姆的心有靈犀、主角女友（蝴蝶餅女士？）的幫助\n、蛋頭博士的聰明與高科技、索尼克的奮發（與爆種時機）都為本片的敘事有所潤色。\n\n\
  主線的進行佐以湯姆對人生意義的追尋、索尼克如何擺脫孤獨得到好友，以及人與刺蝟的\n可愛互動，不會讓人覺得看得很沒意義，又處處充滿溫馨。\n（不得不說主角對索尼克真的是太寵了...這麼帥的警長給我來一打好嗎！）\n\
  \n在我近期看過的電影之中，這部算是敘事最有趣味，人情味最濃，且把故事說得最完整的\n。我看電影不求宏大敘事，能很明快地把一個故事說完就已經很厲害了。\n\n\n\
  美術、視覺、特效：9/10\n\n會給這麼高分，主要是因為蛋頭博士的研究室、武器都給人極為先進、高科技的感覺。\n\n索尼克一開始穿舊鞋、到後面換上新鞋（他的專屬鞋子）也給人驚奇感。\n\
  \n蛋頭博士一路追逐索尼克，還經過巴黎鐵塔、萬里長城、毀滅人面獅身像等，給我一種\n遊戲中切換關卡的感覺，這段也處理得很炫，宛若音樂MV。\n\n（不過索尼克\"\
  飲茶躺\"了一陣子還是讓我很想笑www）\n\n\n由於索尼克的高速特性，因此電影中大量使用了\"子彈時間\"的處理方式，我自己的觀感是\n酒吧那段的處理最為驚奇，而後大多都是與戰鬥相關的，可能因為不是惡作劇，反而讓我\n\
  沒那麼驚奇。\n\n電影中大量使用遊戲中的金環作為代表意象（連一開始的電影公司符號都是），\n\n蛋頭博士最後一戰換上他的經典服裝、在蘑菇星球甚至變成經典造型\n\
  （沒有頭髮、大鬍子），以及片尾的全遊戲畫面把電影中的流程簡單帶一次，\n都讓我極為驚艷。\n\n如果有音速小子骨灰粉，看到說不定會整個熱血起來。\n這部大型遊戲廣告片(X)無疑是成功的，就算對遊戲並不熟悉，也不會影響觀影體驗。\n\
  \n\n同樣是遊戲改編電影，我給音速小子的評分就比當初廣告打得更大的名偵探皮卡丘好。\n\n名偵探皮卡丘的輸點絕對是在於主角太沒有存在感而且太不討喜；相較之下本片的主角\n\
  湯姆有勇有謀反應快，人還長得帥，在電影最後還給了索尼克一個全新的家，無可挑剔！\n\n\n選角：9/10\n\n基本沒有問題。\n金凱瑞撐起了大半部電影，前十五分鐘蛋頭博士還沒出來跑主線的時候，電影是真的悶。\n\
  \n但是歸功於正反派的鬥智鬥勇，雙方都表現良好，故給了我良好的觀影體驗。\n一個小時又四十分鐘已算是很有誠意，不長不短。\n\n配角方面，蛋頭博士的助手史東探員，以及主角的警員朋友（以為自己會被洗記憶？）、\n\
  蝴蝶餅女士（？？）、瘋子卡爾等人也都很討喜。\n\n沒有貢獻的角色也不會出來拖時間，蝴蝶餅女士的姐姐雖然略煩人，至少篇幅不多。\n（這就是本部的節奏管控厲害的部分）\n\
  \n\n整部片說不上有任何討人厭的角色，看到最後也會自然而然對綠丘鎮產生認同感。\n\n可惜新的塔爾斯好像沒有遊戲裡可愛w（可能是因為身材比例太短）\n\n\n\
  獸控+腐女給分：20/10\n\n音速小子電影一開始因為索尼克長太醜，於是電影方決定砍掉重鍊。\n\n不得不說幾乎整部電影都砍掉重練，還能在工期沒有影響太多的情形下，推出如此佳作，\n\
  這位導演的管控能力是很強的，同時也歸功於好的編劇。\n\n一開始主角這麼不待見索尼克，我自己是超懷疑www\n\n索尼克的新形象打中我的原因有以下幾點：\n\n\
  一、全身上下毛茸茸的藍色刺蝟\n\n二、綠瑩瑩水汪汪的大眼睛\n（索尼克有超多眼部特寫，他的眼神真的是可愛到不行！好想抓一隻回家玩）\n\n三、小豆子一樣的鼻子！可愛！\n\
  \n四、毛茸茸的皮膚色的肚肚！超想摸（想摸胸（喂！\n\n五、超級長腿（感覺索尼克的腿長至少有1.5-2頭身，且大腿偏短，小腿下半較粗，但\n整體觀感真是可愛到了極點！）\n\
  \n六、腳掌有肉墊！！（要等到索尼克昏迷，蝴蝶餅女士脫下他的鞋子才會看到）\n\n\n七、一個成年男子的手掌就可以完整撫摸的胸部與屁股\n\n　　很多次湯姆為了救索尼克都直接把他拎走，這個身材比例真的是堪比小學二到三年級\n\
  的正太才會擁有的黃金比例，眼睛估算的話，索尼克應該是身高不超過120。\n\n　　我的天哪！一個成年男子的手掌就可以完整覆蓋的胸部與肚子，還是毛茸茸的皮膚色\n\
  這也太色了吧......（？？？？\n\n\n八、有尾巴跟獸耳，一百分好嗎？？？？\n\n\n\n＊腐女額外加分項目（加到爆）：\n\n一、湯姆與索尼克兩人從不理解到互相理解的過程\n\
  兩人最後情同父子，又堪比Bromance（不是故意押韻）\n\n起初湯姆把他扔下，叫他下車，卻在看到索尼克頭上有魚和海草以後又叫他上車，\n之後就一路保駕護航，送佛送到西，這種轉折真滴棒。\n\
  \n我自己是很喜歡一直看湯姆寵溺索尼克（並沒有）\n\n雖然心知索尼克的心性就跟孩子一樣，又愛玩又怕寂寞，但是當蝴蝶餅女士說：\n\"你們好可愛\"，索尼克就說\"\
  我們才不可愛！我們是浪子！\"\n，還有湯姆說\"綠丘鎮是索尼克的家\"、湯姆跟索尼克互看一眼湯姆就知道要扔金環的時候\n\n我覺得世界很美好......沒錯，BG並不影響BL，男主角有女朋友關我吃我喜歡的CP屁事\n\
  （究竟\n\n最近看過最棒的兄弟情\n謝謝導演（雙手合十）\n\n\n二、湯姆最後給索尼克蓋的那間兒童房還有汽車床耶！！小朋友的最愛好嗎XD\n\n三、索尼克從頭到尾都很頑皮，但湯姆選擇體諒他，還陪他一路完成他的心願。\n\
  尤其是酒吧那段，不論是索尼克的玩心，還是那個被扔出去兩次頸骨折的惡霸，還是\n身兼監護人的湯姆，都讓我好喜歡～\n\n四、\n\n葛萊芬多加十分！！！（在講什麼\n\
  \n我也很想跟索尼克去汽車旅館過夜啦，不過我不保證會對他做出什麼事（在說什麼\n\n\n總體評分：9.5/10\n\n本來只想給8.5，但內心太澎湃，想給10，又覺得太高。\n\
  （畢竟不是阿凡達之類的現象級電影）\n\n總之值得一看，看完會有愉悅的心情，是好片不是爛片。\n獸控一定要看！（？？？？\n\n\n劇情梗概：\n\n索尼克自原本的星球逃出以後，隱居在綠丘鎮，由於太過寂寞於是在鎮中亂跑，引起了\n\
  鎮內停電。（之後不知為何電力就恢復了哈哈哈）\n\n軍方懷疑原因不單純，於是交給蛋頭博士調查（然而蛋頭博士消失之後軍方不但不懲罰\n主角反而還發禮卷感謝他）(???)（是有多討人厭？）\n\
  \n蛋頭博士透過其高科技儀器調查出索尼克的下落，於是想抓他回去解剖。\n\n同時被追殺的索尼克來到主角的家中（why?）才想拿出金環逃生時，就被主角當成浣熊\n\
  用麻醉槍biu掉，意外導致金環掉在洛杉磯。\n\n索尼克醒來以後告訴主角自己動彈不得，且重要的金環掉在洛杉磯，請主角保護他。\n\n主角一開始已經得到往洛杉磯升遷的機會，故不想幫忙索尼克。\n\
  \n然而在與索尼克公路旅行（時間並不長）的途中，一人一刺蝟越發理解彼此，主角發現\n綠丘鎮的人比洛杉磯的人更需要他（另一方面也更有義氣，在主角落難時集體出來襄助，\n\
  平時作好人不是白做的）\n\n（如果是一些比較違反人性的電影，很可能就會出現鎮民囚禁主角，集體抓住索尼克之類\n的劇情吧...有一部女主角是黑幫女兒的，不就是逃到一個鄉下鎮上之後，被整個鎮裡的\n\
  村民奴役、壓榨、輪姦嗎Orz|||）（本本的話，索尼克跟湯姆就(ry）\n\n在被蛋頭博士追殺的過程中索尼克受傷昏迷，萬幸主角回到蝴蝶餅女士的姐姐家中，\n蝴蝶餅女士是獸醫，成功(?)喚醒了索尼克。（索尼克的身體金鋼不壞？反正他有三條命）\n\
  \n姐姐的女兒心疼索尼克的鞋子磨穿了，於是把一雙新的鞋子送給索尼克。\n（超　可　愛）（<我是說索尼克）\n\n姐姐還貢獻了一部車給主角（雖然並不想）\n\n\
  主角憑著智慧與勇氣，帶著索尼克找回了遺失的金環，就在索尼克即將離開之際，\n蛋頭博士找上門與主角一行人展開最後決戰。\n\n（穿著蛋頭博士象徵性的紅白相間衣服，\n\
  \  金凱瑞真的好帥......印象中應該50歲左右了吧還能這麼帥????）\n\n\n索尼克為了保護主角與蝴蝶餅女士，將其推下大樓，利用金環傳送回綠丘，自己則被蛋頭\n\
  博士追殺。\n\n穿過層層金環（也將世界各大遺跡破壞得差不多）（<這段算是本片的高潮）以後，\n金環帶著索尼克與蛋頭博士回到綠丘鎮，索尼克被飛船打傷，無力再逃。\n\
  \n此時，主角為了保護心愛的索尼克（並沒有），挺身而出，與蛋頭博士約莫打了五五開\n（嘴砲方面主角完全輾壓蛋頭博士，超強）\n\n善良的綠丘鎮村民們見主角有難，紛紛拿出農具(?)，上前對峙蛋頭博士\n\
  （並沒有實質意義）\n\n在村民們的保護之下，主角開始發表一場慷慨人心的演講，精采程度媲美\"我有一個夢\"，\n反正就是宇宙刺蝟保護宣言，這隻藍色的刺蝟比你（蛋頭博士）還有人權，\n\
  重點是他是我的好機油，誰動我的機油我草他的菊花（並不是）之類的。\n\n這場演講的功效就媲美鋼彈Z的卡蜜兒在打最終戰的時候全宇宙的女鬼都附到他身上，\n就是有這麼強！\n\
  \n刺蝟爆種了！站起來了！而蛋頭博士的飛船，則因為使用索尼克的毛髮當能源，\n反被索尼克控制而無法運作。\n（鐵奧怎麼一動也不動！）（音 速 小 子 鋼 彈 Z\
  \ 說）（迫真\n\n索尼克與主角靈犀一對眼！\n主角適時拋出金環，索尼克就把蛋頭博士踢入了蘑菇星球（甚至不附贈一個史東探員）\n\n結尾索尼克與主角以及蝴蝶餅女士一家三口在綠丘鎮安居樂業，而某隻（長得沒有遊戲與\n\
  動畫以及本子中好看的）黃色狐狸，則隻身前往地球，探尋索尼克的蹤跡......\n\n（這也意味著易艾克斯恆泰將會出現更多藍色刺蝟與黃色狐狸的BL本嗎？）（並不會\n\
  \n\n以上就是我對這部電影的主觀心得，行文期間私貨略多，敬請海涵。\n\n雖然不想承認，不過這一部很可能是最近看過的好萊塢電影之中，與我二次元性癖重合度\n\
  最高的一部片，個人認為這部算是2.5次元吧？\n\n3D藍色刺蝟不香嗎！\n毛茸茸的肚子胸部屁股尾巴不香嗎？我要來十個！\n\n跪求第二集，等武漢肺炎結束以後我一定進電影院支持！\n\
