title: '[情報] 宅圈神作 歪小子史考特 iTunes 特價90元'
content: '爛番茄 82%


  IMDB 7.5


  這片滿吃電波的，很多人稱之神作，但也有人說看到睡著


  標題會說是"宅圈"，是因為原著就是漫畫



  這部在 幀影幀畫 這片解析中的評價滿好的：（有CC字幕）




  電影預告：




  超快節奏+超快轉場+順暢的動作場面


  因此觀影感受非常爽快


  喜歡爽片的人可以嘗試看看是否能被本作的電波打中



  此外本片雖然是電波作品，但卡司很強：


  克里斯伊凡（美國隊長）


  布麗拉森（驚奇隊長）－－她在這部滿正的：


  布蘭登勞斯（超人再起）


  瑪麗伊莉莎白文斯蒂德（極地詭變、絕命終結站3、雙子殺手）


  安娜坎卓克（歌喉讚、暮光之城）



  想要買斷收藏的人，可以趁此次入手！


  大推～



  --


  這部片多方面都很特異突出，電波沒打中就會覺得怪'
