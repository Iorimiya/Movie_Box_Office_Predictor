url: https://www.ptt.cc/bbs/movie/M.1735379801.A.E3D.html
title: '[雷] 音速小子3,沒看過1/2,沒玩過遊戲,大推'
content: '好雷，

  最初看的動機，

  是金凱瑞，

  我那個時代的影星，

  慢慢凋零，

  一開始只是R.I.P

  有一天突然發現，

  這麼多人離開了，

  看一部少一部不是哀詞，

  而是事實。


  我沒有看過1/2集以及玩過遊戲，

  會不會看不懂？

  完全不會，

  這是一部不用作功課的好電影，

  沒有角色是多餘的，

  就算是人類正面角色，

  獨眼龍還是帥啊！


  金凱瑞的蛋頭爺孫，

  本以為是免洗哈哈反派，

  沒有想到我居然落淚了，

  金凱瑞真凱瑞也。


  還有夏特，真的帥啊，

  不說他的黑化過程，

  單講他的武戲，

  真的酷炫到極致，

  配上基哥的聲音，

  絕配！


  還有那位半壞不壞的白人女子軍官，

  是潔西卡瓊絲吧，

  這麼多年了，還是這麼漂亮，淚目！


  這部電影的劇情並不複雜，

  就是單純的少年英雄以及幡然悔悟的高手，

  攜手挽救地球的過程，

  同時玩梗玩得飛起，

  旁邊帶小孩的爸爸媽媽笑到都嗆出來了。


  最可貴的是，劇組非常愛護每個角色，

  不管是瘋狂到無情的反派，

  還是偉光正的正派，

  或出場幾分鐘的龍套，

  都看得出劇組對他們的用心，

  沒有角色是廢的，

  看得非常舒服！


  真心推薦，

  這次看的是英文版，

  二刷或許會看台配版。

  -----

  Sent from  on my iPhone


  --'
