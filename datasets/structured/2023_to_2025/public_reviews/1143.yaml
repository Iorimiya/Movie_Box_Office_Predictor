title: '[好雷]  蛋頭博士：音速小子的崛起'
content: "當然是有雷\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n標題是致敬 特種部隊：眼鏡蛇的崛起\n.\n\
  你會問 欸不是啊 眼鏡蛇是反派 特種部隊才是主角啊 順序錯了\n.\n告訴你！ 這部的人類主角就是蛋頭博士的啦XD\n.\n.\n整部根本是金凱瑞主場 說他是主角一點也不為過\n\
  .\n開頭簡單敘述了音速小子的故事\n\n他住的地方完全就是經典版的遊戲寫實化XDD\n可以看出他生活的地方有跟他類似的動物同族\n所以其他卡通經典夥伴也是有存在的可能的\n\
  然後多了個被貓頭鷹收養的設定...唔\n\n金環則是一次性的任意門\n.\n.\n電影劇情裡他不能被發現所以到處穿越世界\n速度超快 呈現方式如同X戰警的快銀\n\
  自己跟自己打桌球是家常便飯 甚至可以一人棒球...\n平常的嗜好就是到處亂跑  沒事觀察一下他希望成為家庭的主角什麼的\n.\n某天覺得孤單意外的觸發了超大電磁波\n\
  泄漏行蹤 準備跑的時候意外的被主角射倒\n....\n旅途開始～\n唔啊 熟悉的套路呢\n.\n角色\n男主角 小鎮警長 白人\n好警察一個 夢想去大都市 結果跟sonic小爭吵\
  \ 這部分也是套路 不過沒有過度放大 所以還\nok\n主角老婆 黑人 獸醫\n因為戲份所以沒有特別的突出 意思是不到亮眼可是中規中矩\n看完後會覺得意圖抹黑音速小子的小丑女大解放粉很可笑\n\
  這家庭超正確的好不好 根本沒什麼好攻擊的啊XD\n(不是歧視 多元成家很普遍的 不過電影裡通常少見）\n.\n好勒 終於到真主角 蛋頭博士啦\n\n前面偵測到電磁波後被找來的專家\n\
  怪咖一個 連自己人都承認\n超級肖仔（稱讚意味）各種嘴砲\n嘴電磁波爆發地現場軍事負責人\n嘴主角\n嘴音速小子\n嘴他的助手....\n擁有一堆萬能無人機\n\
  中間一段追逐 戰車無人機出動！\n被炸掉 從8輪變成 4輪小車模式出發！\n\n好的 預告到這裡而已 你以為只有2段變形嗎？\n\n後面爆掉 變成獨輪繼續追！\n\
  拿球棒K爆 裡面還有小直升機模式！\n捏爛你啊的 呃我還有一枚炸彈在裡面....\n咖碰！！！！\n幹有夠好笑XDDDD\n.\n當然無人機都是雜魚 應付不了音速小子\n\
  所以後面取得了sonic的超能量毛 獲得了同樣的超速能力\n（不過這段研究毛的片段稍微過頭了點）\n在最終大戰啟動 高速對上高速\n（按紅色大按鈕那個畫面真的經典又好笑）\n\
  然而依然敵不過主角\n戰敗連同戰機殘骸被炸去蘑菇世界...\n.\n蘑菇世界如同野外 蛋頭博士被迫剃掉頭髮、鬍子亂長....\n成為了經典蛋頭博士造型！！XDD\n\
  跟蘑菇相伴...腦袋壞的更厲害了...甚至搞了個跟排球威爾一樣的石頭\n（agent stone 探員史東 他的手下 ）\n出發  石東！（stone)\n.\n\
  正當大家以為這傢伙再見了的時候...\n嘿嘿 他還是有音速小子的那根超能量毛\n反派永遠會回來的 哼哈哈哈哈哈哈！\n.\n.\n.\n.\n.\n.\n\n\
  哦彩蛋是塔爾斯也來地球囉（狐狸 tails)\n.\n.\n.\n.\n整體輕鬆好看 有整形真是太好了...\n.\n.\n.\n.以上 感謝大家的閱讀  m(_\
  \ _)m\n.\n\n--\nSent from my Sony Xperia XA1 Plus\n\nPiTT \n\n--\n亞凱之神說:再買更多亞凱~!\n\
  \n\n\n\n～(￣▽￣)～(＿△＿)～(￣▽￣)～\n\n--"
