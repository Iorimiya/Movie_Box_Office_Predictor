url: https://www.ptt.cc/bbs/movie/M.1700991589.A.6C1.html
title: '[新聞] 全新《小子難纏》電影正式啟動！功夫夢'
content: '全新《小子難纏》電影正式啟動！《功夫夢》成龍、《眼鏡蛇道館》雷夫馬奇歐回歸主演




  （圖片來源：Netflix、Pinterest）


  去年九月時宣佈，他們將在 2024 年推出一部劇情承襲自原版系列電影的全新《

  》（The Karate Kid）續集，但今年五月卻又有消息指出，同時也在邀請

  回歸演出 2010 年重啟版《》的續集，這一度讓影迷有些困惑，索尼究竟是同時

  在籌拍兩部續集？


  還是這兩部其實都是同一部續集？


  直到今天，索尼官方才總算證實，答案正是後者。


  索尼今天正式宣佈，主演過《》的，以及在原版系列電影、後傳影集《

  》（Cobra Kai）中飾演「丹尼爾拉魯索」的雷夫馬奇歐（Ralph Macchio），將合演

  一部新《》續作。


  兩人更特別錄製了一支宣傳影片，透露劇組正在尋找新人演員，並鼓勵大家報名試鏡。


  正如先前所謠傳的，該片是由 Netflix 影集《去 X 的世界末日》（The End of the F**

  *ing World）導演 喬納森恩特維斯托（Jonathan Entwistle）執導，劇本則交由《亞歷

  山大衰到家》（Alexander and the Terrible, Horrible, No Good, Very Bad Day）編

  劇 勞勃李伯（Rob Lieber）執筆。


  這部新《》續作尚未公佈完整片名，但已排定明年 12 月 13 日上映，據悉本次

  故事的主場景是在美國東岸，將講述一位來自中國的少年透過習武、並在一位嚴厲且睿智

  的導師的指引下，找到了自己的力量和人生的方向。


  文：Joker


  新聞網址：















  --'
