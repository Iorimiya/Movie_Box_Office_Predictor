content: '現在不都流行回鍋和重啟嗎？


  找好小子三人回鍋，演個三人長大後重聚的故事。


  開始先是無關係的好小子三人的後代或徒弟，或許是2男1女，因緣聚在一起發現上一輩是

  兄弟但如今死不相往來，三人為究真相開始一場冒險，最終發現好小子三人不合的天大秘

  密。


  怎麼樣？


  --

  新住民黑人小女孩變性成男生當0號混黑道但其實是警方臥底卻遇到鬼，怎麼樣？

  小胖因為在小時候暗戀小雲，但小雲卻與阿虎阿國交好，多年愛意變成意，誓要雲虎國三

  人自相殘殺，設計讓阿國誤殺小雲，導致阿虎誤會，在多方折衝後才知真正主使者都是小

  胖，但在小胖陰謀下，兩人必需要再死一人才能為小雲報仇，而此時虎國二人不約而同都

  抱著炸彈撲向小雲欲意自己犧牲保全對方，但出乎意外是阿國的炸彈早被小胖給調包是枚

  假彈，阿國眼睜睜看著阿虎抱著小雲屍身被炸成粉碎。'
