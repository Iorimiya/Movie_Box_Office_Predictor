content: '有一部古老的電影--好小子,

  曾經在第四台看到過,

  印象中三個主角分別是阿國,小虎,小胖,

  雖然是搞笑劇, 但功夫底子都不錯, 應該是練家子


  算算年紀他們應該長大了吧,

  可惜現在他們好像都不在演藝圈了,


  前一陣子在第四台看到李小龍的電影

  其中有一幕是李小龍看不懂英文,

  就亂點菜單, 結果上菜的都是湯,

  這一個橋段是抄襲好小子的梗,

  而李小龍打架時喜歡搖頭 & 發出怪聲音,

  也跟好小子打架時的特性,有點雷同,

  好小子跟李小龍應該是師出同門吧,

  不知李小龍和三個好小子是否有合拍過電影??


  --'
