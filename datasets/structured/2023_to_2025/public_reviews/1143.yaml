url: https://www.ptt.cc/bbs/movie/M.1714107025.A.A36.html
title: '[新聞]基努李維為《音速小子3》配音 滿足粉絲期待'
content: "基努李維為《音速小子3》配音 滿足粉絲期待\n\n\n《音速小子》劇照。（派拉蒙影業提供）\n\n【大紀元2024年04月25日訊】（大紀元記者葉子杰編譯報導）真人動畫《音速小子》系列\n\
  製片人托比·阿舍爾最近透露，第三部電影的劇情很大一部份來自2001年《音速小子大冒\n險2》遊戲的啟發。該片中的暗影刺蝟「夏特」將由好萊塢巨星基努·李維獻聲配音。\n\
  \n真人電影《音速小子3》（Sonic the Hedgehog 3）將於2024年12月20日在美國上映，據\n外媒報導，《駭客任務》及《捍衛任務》系列男主角基努·李維（Keanu\
  \ Reeves）已受派\n拉蒙影業之邀為《音速小子3》中的「夏特」（Shadow）配音，片中還將收錄《音速小子\n大冒險2》中的《Live and Learn》歌曲。\n\
  \n據Box Office Mojo統計，該系列2020年第一部《音速小子》及2022年《音速小子2》全球\n票房收入分別獲得3.19億美元及4.05億美元的收入。兩部電影在影評網「爛番茄」上雖然\n\
  只獲得評論家64%及69%的差評，但卻深受觀眾喜愛，分別給予93%及96%的高新鮮度評價。\n\n\n《音速小子》（Sonic the Hedgehog）劇照。（派拉蒙影業提供）\n\
  \n早在2022年第二部電影上映後，社群媒體就瘋傳一段李維配音的「夏特」動畫（點這裡看\n影片），影片旁寫道：「『基努·李維』為夏特配音會怎樣？」網友回覆，「是的，那會\n\
  很瘋狂。」「看來非常的棒。」「喲，這很難吧！」「這就是我所希望的XD。」「基努會\n是最佳人選，他的聲音在這部片中非常合適。」\n\n如今李維為夏特配音已成真（點這裡看照片），網友多年的期待終於實現。許多網友們在\n\
  2022年的「夏特」動畫貼文回覆了驚訝的表情，網友回覆說，「告訴我你是怎麼做到的。\n」「基努·李維是真的！！」「你是怎麼做到的？」「謝謝你的預言。」「算命先生！」\n\
  \n除了李維外，《音速小子3》配音演員還包括班·許瓦茲（Ben Schwartz）配音索尼克（\nSonic），伊卓瑞斯·艾巴（Idris Elba）配音納克魯斯（Knuckles），柯琳·維拉德（\n\
  Colleen O’Shaughnessey）配音塔爾斯（Tails）等。\n\n21日，製片人托比·阿舍爾（Toby Ascher）向《GamesRadar》說：「這可能是我們在音\n\
  速小子系列做過最令人興奮的事情。這將是一部巨大、有趣、令人難以置信的電影。很明\n顯，這電影從《音速小子大冒險2》（Sonic Adventure 2）和一些遊戲中汲取了很多東西\n\
  ，我知道音速小子團隊的核心成員從小就喜歡這些遊戲。」\n\n責任編輯：茉莉\n推薦閱讀：\n\n    基努李維傳喜訊 情定藝術家女友婚禮場地曝光\n    《音速小子2》影評：新角色加持\
  \ 奠定一部成功續作\n    《音速小子》影評：知名電玩角色 在大螢幕上依然亮眼\n\n\n\n\n--\n                  \n\n\n\n\
  --"
