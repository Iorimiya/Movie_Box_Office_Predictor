title: '[好雷] 亞斯小子(2018法國電影)'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  亞斯小子 Mr. Know-It-All (2018法國電影Monsieur Je-Sais-Tout)


  亞斯小子Mr.%20Know-It-All




  喜歡本片！看完心中暖暖地，會心一笑。收尾的畫面和音樂，令我感到愉悅。本片故事通

  俗及可預期的劇情，看似没新意？但有許多亮點及引人省思的點滴: 許多可以發揮長才的

  邊緣兒童們？非正常兒童們？就在我們正常成人？自以為是的為他們好？或漠視？誤解？

  之下，令他們縮回自己的世界，終生不得志？

  主角文森單身，高大壯碩，曾是法國足球選手，目前是足球選手教練，和家人有頗大心結

  ，計畫到中國當教練賺錢時，因故遇到姪子里歐，必須照顧他一陣子，文森不情願下接手

  此事了，里歐呈現亞斯伯格症特質，如本片的英文片名know-it-all及觀察力入微，提供

  他足球訓練上的巧思……也有點發揮丘比特功能，促成美麗聰慧的女醫Mathide和文森更

  多互動……看似美妙情緣開始……

  故事後段，是本片梗點，文森發現里歐一直呢喃的77典故及家人沒有對他說的事; 里歐看

  似病況好轉，有機會進入更好的發展，情況卻急轉直下……


  故事情節及畫面，我看得津津有味，是好作品。


  以下内容有爆雷、劇透，請慎入。

  ……………………………………………………………………

  ………………………………………………………………………………………………………

  ………………………………………


  Mathilde to Vincent:

  天啊！你就不能勇敢承認自己對他的愛嗎？

  要是你走了，光是這樣就足以帶走他的希望之光，其他人的希望之光也是如此……


  欣賞女醫對文森的對話橋段，如同當頭棒喝。


  收尾情節畫面，文森用統計學和里歐溝通，自己目前的決定。


  最後一幕畫面温馨動人，里歐小小的頭靠在結實的文森大肩膀上，親情温暖就是如此。


  …………………………………………………………


  轉貼本片之心得文佳作二篇，其網址如下:




  ………………………………………………………………


