url: https://www.ptt.cc/bbs/movie/M.1582300243.A.7B7.html
title: '[好雷]  懷疑音速小子根本一開始就正常版XD'
content: '有雷有雷金凱瑞超好笑


  先說結論

  是部閤家觀賞的片

  勵志正向輕鬆好笑 節奏很快

  索尼克可愛

  人類主角適得其所

  金凱瑞非常傑出 而且超級好笑

  黑人大嬸也非常好笑

  特效很棒

  彩蛋讓人驚喜

  無論是不是粉絲都可以看得很過癮


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  整部片完全一氣呵成啊

  感覺原本預告的第一版恐怖音速小子根本只是行銷手法

  因為現在的索尼克太可愛了

  會不會有人跟我一樣反而想看看整片都是恐怖版索尼克會是什麼樣子

  希望藍光可以收錄


  而且片尾非常開心看到小尾巴登場

  無比的精緻可愛高度還原

  影廳的粉絲們無不驚叫

  我就不信原本有恐怖版小尾巴XD


  很期待第二集

  希望票房表現亮眼啊


  (題外話，A13的Titan影廳真棒啊)


  --'
