url: https://www.ptt.cc/bbs/movie/M.1734856820.A.788.html
title: '[好雷] 音速小子 Sonic 3 誠意之作'
content: "無雷先打在前面，有兩個彩蛋，記得要看完所有工作人員名單，然後沒有看過前兩集，我\n還是會建議補一下，因為一上來完全沒有介紹，直接進入主題，你大概連這些人叫什麼名\n\
  有什麼關係都不知道。不過可以直接只看第二集就好。\n\n我是一個小時候家裡只有 Sega，所以只有初代 Sonic 是我真的有破關的，對於一直只能\n看著哥哥打電動破關的人來說，第一次破關的遊戲在我心中一直有片柔軟的地方，雖然我\n\
  再也沒玩過其他Sonic 遊戲，對於其他人物，連那隻狐狸都不熟。我看英文版，很多詞不\n知道中文翻譯，請見諒。\n\n看第一集的時候覺得童年的回憶可以上大螢幕，就算看起來有點寒酸，音速小子話真的有\n\
  點多，還是覺得兒童片這樣就不錯了。\n\n看第二集覺得兩隻新的角色好可愛，畫面有更好了點，故事有更有趣了一點點，動作多了\n不少，我自己有濾鏡覺得不錯，其他人可能覺得普普。\n\
  \n第三集我可以很誠心得說就算脫下了濾鏡，第三集是真的非常有誠意，很客觀的覺得裡面\n的動作場景刺激又精采十分帥氣，光是最後 30 分鐘已經是近年少見的精彩打鬥，那個速\n\
  度感跟氣勢，還有爽度，就是很多人對於MOS的濾鏡來自於喜歡七龍珠那種一拳過去天崩\n地裂的爽感，那麼我覺得或許第三集也可以彌補有些人這麼多年被那些爛七龍珠真人版傷\n\
  害的遺憾。\n\n除了打鬥外其實有柔情的劇情，夏特真的是又可愛又帥氣又慘，可是不會讓人覺得故意很\n煽情要來騙眼淚。夏特這角色簡直是為了基努李維量身訂造的，雖然明明這個角色比\n\
  John Wick 還早十年，他聲音表現很好完全不會出戲，Idris Elba 這種低音大哥哥角色\n真的很萌。\n\n我其實一直是不喜歡金凱瑞 90 年代在摩登大聖那種橡皮臉誇張的喜劇表演方法，不過我\n\
  很喜歡他在王牌冤家跟楚門秀，喜劇裡的悲哀。在這部片裡他真的表演得非常棒，不僅僅\n是有他90 年代誇張的喜劇風格，一人分飾兩角卻兩個角色非常立體，有非常明顯的區別\n\
  ，有很令人動容的劇情，真的是超級演技派。\n\n故事雖然很簡單，但是很有趣，雖然成本只有超英片的一半，但是畫面絕對沒有輸，我有\n時候還會常常覺得這個光影也太美。導演原本是做特效的，知道如何錢花在刀口，可以感\n\
  受到不管是導演編劇還是角色造型師，真的對於原著滿滿的都是愛，不會像有些片，會讓\n覺得這個主角很嫌棄演這個角色，這個導演只是邊拿錢一邊嫌棄的，好像這種東西很\n\
  \ low 一樣。還是推薦大家有機會去大螢幕看看這漂亮的畫面。\n\n\n  \n\n\n\n故事一開始從夏特逃離監獄開始，最近這幾年出現很多快銀閃電俠這種慢動作欺負動作慢\n\
  的人的畫面，而夏特會瞬移，直接佛山無影腳，全部一腿轉身踢倒實在太帥。\n\n我在美國論壇潛水，得知其實這麼多年，夏特其實一直是被拿來嘲笑的，當年創作出這個\n\
  角色的時候，被人嫌棄為什麼一個會瞬移的角色還需要騎機車，手上還拿著槍，簡直是為\n了耍帥而耍帥，是Sega 想迎合更成熟的客群的失敗品，只有當年那些未滿十歲的小朋友\n\
  才覺得夏特很帥。但是電影裡面有好好地交代了，夏特騎機車是因為他根本就不戀戰，他\n並沒有想要一直跟 Sonic 打 (打一群比你差這麼多的有甚麼意思)，他騎機車就是想快速\n\
  離開現場，而他的瞬移是看得出好像還需要集一下下氣，感覺起來距離可能不能太遠，而\n且他的 Chaos energy 可以灌在車上，人車合一一起瞬移真的是太帥了，他開槍也只是因\n\
  為他一手開車一手開槍來引開Sonic ，一切都非常合理。而且他 Akira Slide 上了東京\n鐵塔，天哪真的非常非常帥。\n\n\n\n他跟瑪麗亞的那些回憶，雖然淡淡的，可是在那些日常裡是微微的甜，電腦動畫真的做的\n\
  很棒，夏特大大的眼睛裡，第一次看到瑪麗亞是有點困惑迷惘，他不知道自己從何而來，\n被人家當白老鼠實驗也只是平靜地順從因為他就是這樣長大的，只有瑪麗亞是真心待他如\n\
  普通人，他眼神透露出一絲絲害怕被人當作怪物拋棄，雖然他從來沒有笑過，但是在那些\n很平靜的日常裡，你可以感受到他心情很平靜，玩耍時一點點微小愉悅。而這一切在那一\n\
  天毀了，他的眼裡只剩下憤怒。\n\n有一個小細節是瑪麗亞喜歡溜冰，而明明可以瞬移的夏特，卻是滑冰溜出監獄的海面，有\n人說他每一次溜冰都是在思念著瑪麗亞。(有一個超級小彩蛋是電玩角色\
  \ Biolizard 有在\n這邊出現一下下)\n\n然後夏特真得比 Sonic 強太太多了，超級OP。Sonic 超級賽亞人上身都打不過普通的夏\n特，好不容易怒氣終於讓Super\
  \ Sonic 佔了上風的時候，夏特也變身，兩個賽亞人從宇宙\n打到一望都是石頭的荒漠，一拳過去就撞開小山，真得很有七龍珠的感覺，這個時候你覺\n得兩個人好像已經對等了，結果在最結尾的時候夏特拿下封住他力量的手環，觀眾才突然\n\
  驚覺 『 X 他居然還讓一隻手』這種感覺。\n\n我很喜歡 Agent Stone 這個角色，這幾年不只是Disney ，在很多電影裡少數族裔的角色\n，他必須是少數族裔、必須要胖、必須醜、還順便最好是\
  \ Gay ，到底為什麼一個角色要\n負擔起所有的『政治正確』?角色因為肩負太多既定形象，反而變成了丑角，非常的沒有\n魅力。所以第一集看到蛋頭助理是印度人的時候，也曾經覺得『又來了』。但是\
  \ Agent\nStone 從一個在第一集只是小助手的丑角，第二集感覺得出他其實真的很可愛，很真心的\n崇拜蛋頭博士。在第三集Agent Stone 露了一手，很帥啊!\
  \ 然後還找個機會露了八塊腹肌\n，那一瞬間我有點感動說在好萊屋片中的阿三居然終於有個好身材的。劇中有很多的對應\n組，其中一個就是 Agent Stone 對於\
  \ Tail 有好感，因為他以為 Tail 跟他一樣是\nSonic 的助手，跟他是一種人，Tail 很有自信的說 Sonic 是他朋友，他們是一個團隊的\n\
  他不是他助手，Agent Stone 一瞬間的失落，然後看著別人闔家大團圓的畫面的失落很動\n人。他是真心的崇拜著博士擔心著博士，博士卻一副不領情的模樣。阿公說『你有什麼好\n\
  留戀地球，地球上沒有任何在乎你。』但是蛋頭知道其實就算他是孤兒，就算他曾說沒有\n女人也沒有男人愛過他，他其實知道有人在乎他，蛋頭用最後的機會好好跟助手告別的時\n\
  候，我真的哭了。\n\n很多人會開玩笑說金凱瑞是因為錢給太多才回歸一直退而不休，可是我真的覺得這個劇本\n寫得很好，從一開始很自大自傲身材保養得當，穿著帥氣風衣，帶著唯一信任的機器人，\n\
  然後在第二集被蘑菇摧殘後開始瘋癲，第三集對於親情的渴望，相比阿公從頭到尾眼神充\n滿了算計(阿公把夏特當小倉鼠收集能量真的很壞)，到了最後好好的道別也跟觀眾好好的\n\
  道別了，真的很少有反派可以有這麼長的幅度可以舖這麼多的成長史。如果這是他最後一\n部片，就會非常完美，因為非常圓滿了。\n\n這部片很多地方有很多電動小彩蛋，但是很努力試圖用的很不明顯，譬如電動配樂都很短\n\
  ，經典台詞稍微變動過，或著經典畫面重現，唯一很突兀的是突然有一個停格3 秒的畫面\n，擺明了要讓粉絲截圖的。\n\n我覺得如果你不是粉絲的話，應該至少會覺得是一個有爽度的兒童片，如果你是電玩SA2\n\
  粉的話，那就是看完會感動萬分，超越你能想像的童年回憶把你淹沒。這個年頭尊重粉絲\n的電影不多，如果這樣有愛的片獲得不到支持的，那麼或許就只能一直看一些魔改的戲了\n\
  。\n\n--"
