url: https://www.ptt.cc/bbs/movie/M.1583163335.A.F41.html
title: '[新聞] 隱形人踢下音速小子 成北美票房最新霸主'
content: '隱形人踢下音速小子 成北美票房最新霸主



  （中央社洛杉磯1日綜合外電報導）追蹤票房的北美院線聯盟今天通報，本周末觀眾蜂擁

  搶看「隱形人」（Invisible Man），成功將這部電影推上北美票房冠軍寶座，預估進帳

  2890萬美元。


  2月28日到3月1日期間的票房成績證明環球押對寶，僅花700萬美元翻拍科幻之父H.G.威爾

  斯（H.G. Wells）著名小說，海外市場就已回收2000萬美元，且好評如潮。


  這部驚悚片由才華洋溢的伊莉莎白摩斯（Elisabeth Moss）擔綱，英國演員奧立佛傑克森

  -柯恩（Oliver Jackson-Cohen）飾演她男友，自殺後仍不斷騷擾她。


  派拉蒙的「音速小子」（Sonic the Hedgehog）上映第3週從冠軍片跌至亞軍，這齣電玩

  遊戲改編的冒險喜劇由金凱瑞（Jim Carrey）主演，進帳1600萬美元。


  排名第3是20世紀福斯出品、哈里遜福特（Harrison Ford）主演的「極地守護犬」（The

  Call of the Wild），收入1320萬美元。


  排名第4是日本片「我的英雄學院」（My Hero Academia），票房510萬美元。電影講述一

  名常遭霸凌的男孩找到方法進入菁英高中，接受夢寐以求的超級英雄訓練課程。


  索尼「絕地戰警FOR LIFE」（Bad Boys for Life）上映第7週續航力十足，以430萬美元

  成績排第5。這部由威爾史密斯（Will Smith）和馬丁勞倫斯（Martin Lawrence）擔綱的

  動作喜劇片全球進帳超過4億美元。


  第6到第10名的電影依序為：「猛禽小隊：小丑女大解放」（Birds of Prey），410萬美

  元；「好友互整電影版」（Impractical Jokers: The Movie），350萬美元；「1917」（

  1917），270萬美元；「託陰2：布拉姆回來了」（Brahms: The Boy II），260萬美元；

  「逃出夢幻島」（Fantasy Island），230萬美元。


  （譯者：黃靖貽/核稿：蔡佳敏）1090302



  新聞網址：




  --'
