url: https://www.ptt.cc/bbs/movie/M.1639878240.A.21F.html
title: '[討論] 小子難纏三部曲哪部比較好看(有雷)'
content: '最近Sony發布了一系列舊片的UHD，剛好看到了小子難纏三部曲。

  也全部都看完了，普遍網路上的評價是1>2>3>>>4。


  但我在看的時候覺得1、3的劇情比較類似，也比較流暢、熱血。

  反而是2，因為好萊塢不熟悉日本文化，穿插英日對話，拍得非常尷尬，就是一場災難。

  3則是回歸第一集的套路，好看許多。

  第四集主角換成女生，好像也沒被Sony列入系列發布，評價也是極差。


  不知大家是怎麼看待這三部曲，討論的也不多。

  還有好萊塢曾經如此風行拍攝日本文化相關電影嗎?


  另外之前看一個評論很搞笑，男主三集都在換女友，最新的影集老婆也不同。


  --

  但男主角婚姻生活似乎很不錯，第一集還蠻帥的，但第三集明顯肥了很多，可能影響了戲路

  是因為女主嗎，怎麼大家都推2，我覺得2劇情很尷尬耶，但片尾曲是神曲'
