url: https://www.ptt.cc/bbs/movie/M.1420205903.A.FF7.html
title: 'Fw: [閒聊] 偶動畫前置作品-精工小子'
content: "作者: youngmmi (阿怪) 看板: C_Chat\n標題: [閒聊] 偶動畫前置作品-精工小子\n時間: Fri Dec 26 16:04:30\
  \ 2014\n\n\n這禮拜從朋友那邊看到\n一個很有意思的偶動畫作品『精工小子』\n\n\n\n很有意思的點在於\n偶動畫是利用金屬骨架＋雕塑製作出來的人偶當主角，一邊微幅調整\n\
  這些玩偶的動作、一邊拍下影像，最終再集合拍成動畫影片\n\n\n我以前不知道什麼是偶動畫\n也不知道原來在台灣還可以看到手工純熟的金工師傅的工藝實力，\n如果我們無法完善的保存與記憶，他們終將隨產業衰微而消失無蹤\n\
  \n\n精工小子角色手繪圖\n\n\n\n\n精工小子導演呂文忠，是美國加州藝術學院的校友\n他的同學Benton Connor是天兵公園及探險活寶劇集分鏡師及劇情編劇\n\
  動畫電影馴龍高手的導演也是他的學長\n\n\n台灣這個小小的島，有這樣一位導演試著以他過去所學專業\n為台灣動畫產業帶來改變，結合傳統金工業同時培養更多動畫人才。\n\
  \n\n『做著喜歡做的事情，只有往前走，你才會知道人生還有很多的美好』\n\n看完作品介紹和導演的故事，很喜歡也很支持他對作品的想法和態度\n希望他真的可以把這部動畫長片做出來\n\
  讓大家看到，我們台灣真的有辦法可以作出偶動畫電影長片！\n\n\n\n\n--\n                                      \
  \   01/02 21:37"
