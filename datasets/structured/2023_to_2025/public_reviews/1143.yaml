title: '[ 好雷] 音速小子3'
content: '雷文防雷資訊頁





  衝者美國網友的好評價

  剛剛在墨爾本看了晚場




  有看過第1集，但其實忘的差不多

  第2集，因為疫情沒去電影院看

  但第3集出現的幾個舊人物

  我覺得沒看過前兩集，應該也沒差


  因為本人英文不好，只能看畫面猜大概劇情


  整體來說，劇情大致跟預告片走向差不多

  就是一開始Shadow出現，Sonic打不過

  於是想辦法解決


  中間穿插Shadow為何會暴走的原因

  就大家自己看吧，反正就是很公式的劇情



  1.

  蛋頭博士 & 蛋頭爺爺

  兩人的劇情、畫面非常多

  合作的橋段也非常多

  金凱瑞 整個就是對這部超有愛


  至於，第4集還有辦法出演嗎？

  真的只能看“編劇”怎麼編了


  2.

  這部的笑點，雖然對我來說

  不是能捧腹大笑的那種

  但就是很多“美式笑點”

  也是想辦法到處發梗給觀眾看

  甚至連  任天堂、阿湯哥  的梗都拿來玩


  3.

  最後大戰那邊

  前面有網友說打的像  七龍珠 一樣誇張

  我只能說，真的是這樣


  從外太空打到世界各地

  打到遺跡破壞者的等級


  要說打到把“星球破壞”也可以


  很明顯，大戰經費給很足



  4.

  彩蛋方面，我只看了第一個

  我沒等到第二個


  但第一個彩蛋蠻長的

  有近2分鐘

  但就是介紹第4集的關鍵人物出場就是了



  大概就是這樣

  娛樂性絕對夠


  ----

  Sent from  on my Samsung SM-N960F


  --'
