url: https://www.ptt.cc/bbs/movie/M.1707134840.A.484.html
title: '[普無雷] 莫斯科行動'
content: '大概各家片商想趕在農曆年前上映華仔電影

  就變成在這一個多月連上三部

  這三部看下來的個人排名是

  金手指＞＞＞莫斯科行動＞潛行（這部…唉）

  .

  莫斯科主要戲份是張  予，華仔前中期都在打醬油但後期戲份很重也扮演主要說教角色

  這部是歷史事件，在看之前沒做功課就當一般電影來看

  故事說的還可以

  也沒有亂剪接，對劇情進展不會混亂

  但有些特效跟場景實在很假…很明顯就是在攝影棚拍…爆炸特效也是

  後面幾個大場景拍的不錯

  反正都是射來射去動作跟爆炸到位就好了

  張果不其然都在演他自己

  反派首腦劇中表現令人印象深刻

  裡面穿插了些北京天安門及中國公安鏡頭

  還有很多官僚對話

  雖然沒像戰狼那麼矯情但很多對話都有那種感覺

  看完的感想就是…

  一部不錯的歷史改編動作片，最後卻又在說教中結束…





  -----

  Sent from JPTT on my iPhone


  --'
