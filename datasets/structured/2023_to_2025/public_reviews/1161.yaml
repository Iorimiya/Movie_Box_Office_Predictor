url: https://www.ptt.cc/bbs/movie/M.1707055362.A.DEB.html
title: '[好雷] 莫斯科行動-不下風聲'
content: "雷文防雷資訊頁\n\n\n\n衝著主角在風聲中的精湛演技而進場支持。\n以下多劇情雷，慎入。\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\n\
  劇情大綱:中俄雙方合作，要將兩國重要列車的強盜團緝捕的改編作品。\n\n嘈點:\n一、在狹窄的火車車廂間打劫，甚麼武器不拿，拿一堆長柄武器是在哈囉?\n\n二、不免俗的，動作片當中車輛的玻璃都跟紙糊的沒兩樣。\n\
  \n三、一撮毛單飛翻車已經夠蠢了，苗老大要滅口他們斷警方線索是可以，\n    但沒處理好就冏了，反讓自己的下一案線索(VIP會員卡)洩漏出去。\n\n四、俗話說兄弟如手足，女人如衣服，苗老大你是義弟的女人隨你穿，\n\
  \    結果又一次沒弄好，再洩漏了下水道的重要訊息出去。\n\n五、警方在下水道出口坐等甕中捉鱉不好嗎?劇情看來出口只有一處啊!\n\n六、最後要撈一筆的交易為了場面好看煞費苦心安排，就是挺費飛機的(笑)。\n\
  \n七、中俄邊境火車軌道不同的點，純好奇，當初為何不乾脆A車換B車，\n    直接請乘客換到另一國的車就好?卻要大費周章去換底盤?\n\n儘管嘈點相當多，但是劇情流暢，鏡頭打鬥的畫面也舒適，相當適合觀影，\n\
  片長雖有點久但體感時間不會坐不住。\n\n題外話:\n喜歡張涵予在風聲中表現的人，推薦這部，神情相當精彩入戲。\n\n補充笑點:一撮毛在躲槍殺的時候，腳底抹油+壁虎游牆下樓梯相當的強悍!\n\
  \n\n\n\n--"
