title: '[好雷] 客製化先生 PEACOCK'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  之前只上映一下下就下片了的《客製化先生》觀後：


  1. 不知道是不是因為導演是奧地利人的關係，各種音樂的安排，妙不可言。


  2. 「情感商品化」自然是故事核心，然而電影拍出來那些品味、空間與人際之間的張力

  ，才真是精華所在。真實世界的扮演作為一種服務，呈現社會對人際角色的期望。可當扮

  演不是服務而出於自發性，人永遠可以更加接近期望。至於扮演與真實自我之間的距離，

  最終會是分裂、耗損還是合而為一，就十分難說了。


  3. 導演對那些品評音樂與藝術的人似乎有很多個人觀察，可最終還是讓藝術作品在奇怪

  的地方展現它的力量。或許是作為一個二十一世紀的藝術家很難不存在的一種矛盾心理。


  今年大片幾乎沒有打動我的狀況下，竟然被這樣一部喜劇基調的現代悲劇現場給touch到

  。也許歐陸這種諷寓電影，就是為我這樣的人存在。




  ***


  這裡是我的樂園:




  --'
