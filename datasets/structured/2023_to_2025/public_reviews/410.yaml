title: '[好雷]客製化先生 好雷觀後感'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n《客製化先生》好雷觀後：活成色彩斑斕的孔雀\n\
  \n無雷推薦：\n1. 畫面很美，光這就值我的電影票\n2. 概念簡單，又有幽默點綴的佳作\n／\n\n有雷觀後：\n1. 這部概念很簡單，在談別人的眼光。不只是客製化先生，我們每天都在扮演不同的角\n\
  色、符合其他人類的期待。想如孔雀面面俱到惹人愛，在社會打滾十分正常，但過了頭，\n小心忘了自己又傷身。\n2. 「因為不了解所以選擇在一起，因為了解所以選擇分開。」\n\
  如果在伴侶面前要如此忍讓與偽裝，那麼分開是件好事、也是必然。\n3. 即便《客製化先生》在召喚我們的直覺，要觀眾保留自己的小污點，那些讓我們可愛\n的地方，我也欣賞孔雀的優雅與姿態。最迷人的伴侶，應該優雅又帶點小頑皮、享受當下\n\
  也能看向大局，如同這部可愛的佳作。\n\n4. 這部有點P人J人極致大對決的感覺。\n\n\n\n\n–\n脆：\nIG：Fishpond_like \n臉書：魚池\
  \ FishPond \n個人網站：\n\n--\n現在有場次了！\n脆上面也蠻多人分享的～可以看看\n我也蠻喜歡這部的"
