url: https://www.ptt.cc/bbs/movie/M.1694444186.A.535.html
title: '[好無雷] "黑夜遊行"無雷心得'
content: '"新解釋三國志"是一部我覺得很神奇又超喜歡的電影，所以發現 "黑夜遊行"是導演

  福田雄一新作就挺期待的，因為是漫畫改編作品，因此觀影前我去找了漫畫來看，結果一

  看就停不下來了非常喜歡，看完原著後再去看電影因為已經都知道劇情了，所以劇情方面

  完全沒有驚喜，但導演的改編很有意思，時間的關係電影少了很多鋪陳和說明，但原著劇

  情裡比較精彩的部分都有濃縮進去，這點挺厲害的，而且都是挺感人的部分，有點可惜的

  是劇情進展的太快，還有為了能有個結尾，在設定上做了一些改編，單看電影會有種下集

  待續的感覺，但很多細節都有沒說清楚的地方，畢竟原著還在連載，這樣的改編我覺得也

  是盡力了，整體來說還是挺喜歡主角一直各種吐槽，特效普普通通，演員選角都挺適合的

  也都很可愛，但因為關於每個人物的背景故事完全沒時間放，所以應該看完會有超多疑惑

  ，要是能改編成日劇就好了，總之是一部看完心情會挺好的電影，就期望它真的能有續集

  吧。


  --'
