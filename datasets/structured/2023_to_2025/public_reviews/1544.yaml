url: https://www.ptt.cc/bbs/movie/M.1692713939.A.FD4.html
title: '[新聞] 橋本環奈 漫改喜劇《黑夜遊行》大恥度光'
content: "新聞網址：\n\n2020年執導電影總票房突破100億日幣的日本鬼才導演福田雄一，曾推出《銀魂》系列、\n《我是大哥大！！劇場版》、《新解釋‧三國志》等多部膾炙人口的喜劇作品，這次推出\n\
  聖誕爆笑喜劇《黑夜遊行》，改編自《聖☆哥傳》知名漫畫家中村光的人氣作品。《黑夜\n遊行》故事講述考試失利、求職失敗、也沒有女友的廢柴男日野三春（吉澤亮 飾），在\n\
  便利商店打工了3年，某一個聖誕節即將來臨的日子，穿著黑色聖誕裝的神祕男人出現在\n三春面前，「你錄取了！」說完後便強硬地帶走他。三春醒來後發現自己來到位於北極、\n\
  暗中經營聖誕節的神祕公司「聖誕老人之家」，並作為配送奇異禮物給壞孩子的黑色聖誕\n老人，開始在這間公司任職…。男主角三春找來「國寶級帥哥」吉澤亮飾演，這也是他主\n\
  演NHK大河劇《直衝青天》後，首部電影作品。奇幻爆笑喜劇《黑夜遊行》將於9月8日（\n週五），在台上映！\n\n福田雄一導演的《銀魂》系列作品，被譽為是最成功的真人漫改作品，這次他再度將漫畫\n\
  世界完美搬上大銀幕，不僅忠實原作的世界觀，就連角色造型都相當講究。童星出道、曾\n演出收視冠軍《家政婦女王》而備受關注的中川大志，飾演深受原作粉絲喜愛的白目輕浮\n\
  男「田中皇帝」，他坦言：「從決定要飾演皇帝開始，我就一直很緊張。我也才發現只是\n塗黑一顆牙齒，人的外貌竟然會差這麼多。」曾多次參演福田導演作品的「千年一遇美少\n\
  女」橋本環奈則飾演天才駭客「北條志乃」，她在參與過的福田導演作品中，每部都有各\n式各樣的鬼臉，這次在《黑夜遊行》竟是最高等級，她笑說：「每次去拍攝福田導演的作\n\
  品時，感覺顏面都會崩壞，結束後再調整回來。」她也提到這是在福田導演的作品中才會\n有的挑戰：「在其他片場不會被要求嘴角往下，或是眼睛再睜開一點、鼻子再撐開一點之\n\
  類的，有種挑戰人類極限的感覺。很開心這次能冒著下巴快要脫臼的危險，努力完成拍攝\n。」除此之外，《群青戰記》渡邊圭祐、《東京復仇者》山田裕貴、前「乃木坂46」成員\n\
  若月佑美，以及《極道主夫 電影版》玉木宏、《銀魂》佐藤二朗、《新解釋‧三國志》\n室剛等，實力派新生代及資深演員也將共同帶領觀眾一窺聖誕老人的幕後祕辛！\n\n\
  在電影《黑夜遊行》中，橋本環奈甚至有「大恥度」的光頭造型：「因為我的頭髮很長，\n因此花了2～3個小時，把我的頭髮服貼地集中起來。」對於橋本環奈的光頭造型，吉澤亮\n\
  也表示：「她的臉真的很小，因為臉太小，後面塞頭髮的地方又很突出，看起來有點像外\n星人（笑）。」而原作者中村光則大讚橋本環奈看起來就像世上最美的地藏佛。對於這次\n\
  演員們的表現，福田導演也表示：「改編中村光老師的作品是《聖☆哥傳》之後第二部，\n依然是有著獨特笑點相當有趣的作品。演員找來平常形象很酷的吉澤亮，他也展露出平時\n\
  少見的珍貴表情。這次橋本環奈擅長的喜劇力量也全力發揮，中川大志則讓他做了很難稱\n他帥哥演員的奇怪演出。」吉澤亮則希望本作可以帶給觀眾溫暖：「這次參與福田導演的\n\
  作品是繼《銀魂2：規矩是為了被打破而存在的》以來，也是我首次主演，在開拍前就滿\n心喜悅和緊張。從各方面來說都非常火熱的這部作品，一起讓內心暖和起來吧！」暖心爆\n\
  笑喜劇《黑夜遊行》，將於9月8日（週五）在台上映！\n\n--\n                                 08/22 22:19"
