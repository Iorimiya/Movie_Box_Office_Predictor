title: '[好雷] 追愛衝浪手'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  國高中的年紀就要面臨至親突然消失的悲傷五階段，從來就不是容易的事，不過，這一切

  如果有朋友與家人的陪伴，甚至有信仰的支持，必定會順利不少。真的是如此嗎？



  自從父親在船難中失蹤後，少年丹多總是死抓著一塊衝浪板，獨自凝視蘇格蘭北方的海平

  線，彷彿能在碎散的浪花之間尋回父親的身影。



  丹多的同學莎絲渴望逃離這座沉悶孤島。海岸的彼方，是青春的狂風怒浪，在沉默中咆哮

  ，將要席捲而來。



  信仰（Faith）在《追愛衝浪手》裡扮演重要的角色，而男女主角丹多與莎絲也在追尋信

  仰的路上代表兩種截然不同的方向。丹多一家從來不上教堂，但父親的失蹤讓他從全無信

  仰走向近乎宗教狂熱。即便媽媽不信教，還是會陪丹多一起進行飯前禱告。的確，很多人

  都是在生命低谷遇見神，但丹多的信仰在他心中的上帝與教區新來的牧師之間拉扯。



  一部分的他相信爸爸還活著，一方面他也覺得是時候放下一切，繼續前進。最後，他臣服

  在父親的失蹤肇因於在安息日出海，讓他覺得自己有責任警告三位來自宇宙的衝浪客。丹

  多著魔似地帶著獻祭的羔羊衝向大海，最終讓自己被雷打中，就像是為走火入魔的信徒敲

  響警鐘。



  另一方面，莎絲來自信仰堅定的虔誠家庭，但她自己卻有懷疑。相對於丹多的入教，莎絲

  則從教會走出，象徵宗教覺醒。莎絲也想更信神，但卻找不到夠強的理由成為像媽媽一樣

  的信徒。即使尚有疑慮，她也不曾翹掉敬拜，直到無意間從丹多那裡得知，道貌岸然的新

  牧師過去與媽媽有過一段情，而他不但仍未放下，甚至在講道時都不忘看著媽媽的裸照。

  這一切，讓莎絲決定燒掉教會，徹底離開這個虛偽的組織。最諷刺的是，牧師領著看似關

  心丹多的會眾抵達海邊，但他們卻毫無作為，唯一付出行動試圖拯救丹多的正是早已不再

  信神的莎絲。



  有趣的是，在丹多的想像中，上帝是黑人女性，而非主流社會相信的白人男性耶穌，而這

  並不是政治正確的結果。雖說《追愛衝浪手》的背景設定在蘇格蘭北方，但丹多經常喚著

  的「朗戈朗戈」以及他夢想著出海尋找爸爸時，看著地圖默唸的「歐胡島、考艾島、旺阿

  努伊、吉里巴斯、泰阿胡波奧」則都屬於「南島語族」的分布地。



  「朗戈朗戈」是復活節島的一套符號，而其他地名則是散落在紐西蘭、南太平洋與夏威夷

  的島國、海岸城市或村莊，尤其它們都是衝浪勝地。雖然坡里尼西亞也有男神「坦加羅阿

  （Tangaroa）」，但在許多南島語族的神話裡，掌管海洋的都是女神「伊娜（Hina）」，

  這可能造就丹多對於上帝的想像。



  將自己的悲痛寄予在海神與衝浪，絕對是丹多此時此刻處理悲傷情緒最合理的方式。片中

  不少角色驚訝於丹多的爸爸在海上失蹤，他竟然還有心情出海衝浪，但或許對他來說，不

  論是生是死，這才是最靠近爸爸的機會。每個人處理傷痛的方式不同，對媽媽來說，不舉

  辦追思會確實保有丈夫能夠活著回來的希望，但一年過去，心情一直懸在那邊，持續抱著

  不切實際的希望也不是辦法，所以好好道別才是重新出發的起點，但對丹多來說，那卻是

  放棄尋找爸爸的藉口。



  《追愛衝浪手》可以說是一部非典型的成長電影，從丹多由於爸爸的事情向學校請假到復

  學後，莎絲認為他「變聲」看來，他們大概是國中的年紀，不管是談戀愛，還是對性的探

  索都還很懵懂，更遑論信仰與生死。丹多與莎絲的關係是愛嗎？可能也不是。他們頂多就

  是會分享心事，一起搭校車上學的青梅竹馬，但若要說有些曖昧情愫醞釀中倒沒問題。



  至於對性的好奇，本片甚至用詼諧的手法來對抗這個傳統信仰的小鎮。丹多與莎絲以「神

  學」的角度討論上帝是否有陰莖，直接了當挑戰上帝一定是男人的設定，而莎絲利用追求

  者滿足自己對男性自慰的好奇心，仍舊小心翼翼地維護保守思想，他們兩個其實什麼都沒

  看到、什麼也沒做，但就已經扯斷媽媽的敏感神經。



  或許莎絲對丹多的感覺是在彩虹兩次出現時慢慢累積起來的，第一次是不會衝浪的她來到

  海邊，巧遇新來的牧師，正在確認自己信仰的莎絲詢問牧師沒人看見的時候是否也會禱告

  ，而丹多隨即上岸後，她望向對方的背影，天邊出現一道彩虹。第二次則是莎絲不放棄希

  望，救丹多一命後，他遵守諾言教她衝浪，兩人一起逐浪，無論是信仰的迷失、成長的迷

  惘，還是失去至親的悲痛，在彩虹升起的這片海面都已消失無蹤。


