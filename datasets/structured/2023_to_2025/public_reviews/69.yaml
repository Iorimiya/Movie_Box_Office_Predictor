title: '[好雷] 日影 九龍大眾浪漫'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  \n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n\n\n\n\n\n\n\n\n\n\n第一次知道是看新聞發現日本女星吉岡里帆來台灣演戲了，\n\n男女主角只有幾張照片，感覺上是在台北市拍攝，\n\n有基隆目擊說店裡有簽名但不知道在哪，\n\
  \n壹蘋記者說是高雄果貿。\n\n先使用Google街景圖看了看台北可能的地方，包括南港、萬華、三重，\n\n鎖定南機場，因為有透過Google以圖搜圖有找到其中一個地方「國盛國宅」\n\
  \n發了一篇八卦板回文 \n\n分析了一下電影可能上映時間，今年夏天，找到當時尚未公布的導演名字「池田千尋」\n\n後來就沒有後來了。\n\n\n固定搜尋九龍大眾浪漫，不管日文或中文，\n\
  \n真人電影相關內容都停留在電影前導預告片。\n\n\n直到宣傳期終於宣布8月29日日本上映，8月開始陸陸續續釋出更多電影畫面，\n\n開始盡可能尋找拍攝地點，想要搶在日本上映時候同步發文，\n\
  \n八卦板回文 \n日影板轉文 \n\n在還沒看過電影就先看到實際場景，我並不知道這些地點占比有多重，\n\n我看了好多次所有預告片，把場景都截圖出來分門別類，一個個找地點，\n\
  \n\n後來才知道有的地方原來是這樣子啊的感覺！恍然大悟！\n\n男女主角站天台\n\n\n檸檬雞的小巷子\n\n\n男女主角祈求神明擲筊的地方\n\n\n男女主角的房地產公司九龍分店\n\
  \n\n結界（￣▽￣）\n\n\n大草皮\n\n\n拍實景跑到新北市淡水淡海新市鎮，台北市區小巷子，基隆市區跟海大旁的中正路。\n\n\n本來想說大概機率不會上映吧，有推文告知才知道確定羚邦代理會上映，\n\
  \n後來知道高雄電影節首映，還有男女主角本人!!! 超好的，比香港首映只有導演還好，\n\n9月21日中午好緊張，好在非常幸運搶到票，10月10日特別搭車去高雄，\n\
  \n紅毯的吉岡跟水上好美好帥呀!\n\n好親切幫粉絲簽名，好羨慕，我手上沒東西可簽，也卡不到好位子，只能遠遠看著。\n\n真的好開心啊，等了整整一個多月，日本香港都上映下檔了，台灣終於能看到，\n\
  \n一個小時的開幕式，只記得吉岡、水上還有香港影星黃秋生酷酷的。\n\n等首映去附近吃晚餐，吃完回來發現手扶梯封了，電梯有電影節工作人員守著，\n\n等電梯地方沒有冷氣好悶，辛苦幾位小女生幫忙引導。\n\
  \n那時猜想電影結束加上映後座談大概都23:20，如果不能走樓梯肯定會很可怕，\n\n後來也確實是這樣，整個爆多人排隊擠在門口，還好放棄丟映後小卡直衝電梯，\n\
  \n等個五分鐘就下樓直衝高雄捷運站紅線捷運三多商圈站到高雄車站旁客運站回台北了。\n\n\n\n回到電影內容\n\n日本官方在X已經有放過電影5分鐘畫面\n\n\
  \n工藤發抽菸，鯨井令子切西瓜抽菸，上班打卡Safe，故事輕鬆的開始了，\n\n電視裡介紹的地球子星，不太懂是什麼意思，可能有點科幻導向吧，\n\n平常的生活，慢慢有了一絲絲的不平凡，女主角令子突然不用戴眼鏡也看得清楚，\n\
  \n買了新鞋子腳上受傷了，看到了工藤發西裝外套口袋掉出來的拍立得，\n\n一切彷彿有什麼熟悉感卻又想不起來是什麼，好像記憶被抽掉了一樣。\n\n平靜的第二九龍寨城，越來越奇怪，竟是跟著工藤發的情緒波動而變化，\n\
  \n他才是創造電影中世界的主人公，虛幻的人物像NPC一樣，一日復一日，\n\n永遠活在某個夏天期間。\n\n另一個已經不是金魚茶館店員的陶鈞，拍照拍著發現了以前這個第二九龍寨城竟然還在，\n\
  \n見到了工藤發，工藤發說他變了，陶鈞勸他不要活在過去，可是工藤發認為自己什麼\n\n都沒有了，活在這個虛假的世界，反而是快樂的時刻。\n\n\n鼬瓏大師跟蛇沼三幸院長，找到了另一個陶鈞，知道了第二九龍寨城還在的秘密，\n\
  \n計畫實驗讓城裡最奇怪報告已死了卻還活著的鯨井令子的秘密，找出死而復生的方法，\n\n蛇沼三幸院長開了新的醫院，森巴舞團跳舞開幕，鯨井令子被院長仔細觀察，\n\
  \n她只關心眼角細紋，卻沒有歷史喜怒哀樂的痕跡，被院長點破。\n\n愛打工的小黑被鼬瓏大師推了出去，不小心被女主角鯨井令子看到了，嚇到了，\n\n人說沒了就沒了，鯨井令子很難過，祈求神明把手上筊杯丟出去，這是個伏筆!!!\n\
  \n\n工藤發想起鯨井B的痛苦，整個九龍寨城都地震了，\n\n鯨井令子看見了鯨井B服藥自殺的坐在椅子上，\n\n這個的世界越來越不一樣，兩人也逐漸偏離了本來的平靜生活。\n\
  \n\n鯨井令子偷拿了房地產公司分店經理老李手上拿的「芬蘭」旅遊書拿回家看，\n\n被工藤發看見，問她要出去金魚怎麼辦，她說會跟著Success(金魚)一輩子。\n\
  \n隔天，男女主角一起遲到，發現老李發瘋了，老周呆呆地坐在麻將牌桌，\n\n九龍變了，他們想要逃出來。\n\n\n不後悔，手牽手一起逃出來，興奮摔倒趴在草皮上，站起身發現，鯨井令子不見了，\n\
  \n只剩工藤發一個人在綠油油的大草皮上，看著遠景。\n\n地上撿到了鯨井令子的筊杯，回收伏筆，工藤發大喊「聖杯」，主故事，完。\n\n\n大概過五分鐘片尾，播出了Kroi\
  \ - Haze，觀眾千萬別提早去上廁所哦。\n\n\n小彩蛋開始，左側的小框框螢幕，凌亂的工作桌，工藤發跑到房地產公司總店上班了，\n\n上班族穿搭，場景是非常日本的感覺，看到電車跟樓梯，還有櫻花樹，\n\
  \n他走到一間小店吃飯，遇到了店員是小黑，她跟工藤發不知道說什麼很開心，沒聲音，\n\n吃著吃著一個拿著行李箱的人走進來，欸？是鯨井令子，不是鯨井B，\n\n\
  她問要從哪邊開始說起呢？小黑說外頭下雪了，兩人笑了笑，\n\n我在想是不是表示工藤發又創造了一個全新的新世界，\n\n又活在一個屬於他自己幻想世界中？\n\n\
  不得而知，很科幻感，跟香港九龍城寨感覺上沒有太多關聯性，\n\n反而比較像是一場夢一樣，夢醒了，換了另一個新的夢，\n\n人物一樣但角色場景似乎變了。\n\n\
  小彩蛋鯨井令子似乎成為了「真正的自己」，跟主角工藤發又再一起，好結局。\n\n\n\n電影中工藤發演唱了「田園」，YouTube版本少了前面一小段，請去電影院看，\n\
  \n\n本來看預告看不懂是什麼原因，想不到一首歌就說明了故事的全部，\n\n有我在，大家都在，繼續活下去就好。\n\n\n\n\n\n看完滿感動的啦，雖然也不知道在感動什麼，有愛情有科幻有懷舊感的一部電影。\n\
  \n那個完全沒有3C手機電腦的時代，可能也滿快樂滿幸福，小孩奔跑著，大人玩麻將象棋，\n\n翹二郎腿翻看紙本報紙，吃著普通的街邊美食，一天又這樣結束了，樸實普通的人生。\n\
  \n那舊舊街道的懷舊感，雖然稱不上好，但不會覺得很討厭。也可能是基隆拍攝有加分吧。\n\n\n從去年電影預告就發現鯨井令子的衣服是左衽，可能早就象徵她是「死人」，\n\
  \n淡藍色跟黑色金線的兩件改良旗袍上衣都是左衽，\n\n不是一般旗袍中式常見的右衽，不是y而是反y，算是蠻有趣的小地方。\n\n\n吉岡里帆鯨井令子衣服設計的很漂亮，當房仲的套裝是很老式感的制服，\n\
  \n其他服裝穿搭也很美，復古風卻又很時尚。\n\n水上恒司工藤發的衣服就比較普通一些，西裝男西裝頭，刻板印象中上班男人的樣子。\n\n製作人有說部分服裝是從古著店買回來的衣服，難怪都老老的樣子很有特色。\n\
  \n\n這部電影CG用的應該算多，包括金魚茶樓的大魚缸，實際在喫茶開門不存在，\n\n還有主視覺那滿螢幕的亂亂擁擠的房子，\n\n是使用女主角家(不知道在哪裡，一個對面有小公園有大樹的地方)\n\
  \n拼接到台北市國盛國宅的房子，紅色連接的地方很明顯是在國盛國宅，\n\n畢竟那地方我去的時候繞了三四大圈，找不到完全一模一樣的地方。\n\n綠色大草皮後面的未來感建築也是CG合成。\n\
  \n兩部空中巴士大飛機民航機飛過，應該是星宇航空贊助，這裡也是CG合成。\n\n淡水綠色大草皮應該是用吊車高空往下拍，所以水上有張跟吊車照相，不是CG，\n\n\
  女主角家是搭鷹架平台大概一層樓高，攝影機往上拍，猜測大概二樓三樓左右，\n\n吉岡有張照片有出現，不是CG。\n\n\n音樂的部分，官方有OST可以聽，很多的輕音樂，\n\
  \n我覺得「恋をすること」跟「それでも明日を一緒に生きてみたい」這兩首很好聽，\n\n專輯 - 映画『九龍ジェネリックロマンス』オリジナル・サウンドトラック\n\
  \n\n\n\n等天氣好想再去一次基隆，把所有片中場景在實際拍一遍，\n\n好幾個第一次去還沒辦法知道的地方，這次補完搞定，\n\n尤其是仁五路崇安街二樓，上次把崇安街繞了三四圈都找不到，\n\
  \n結果問基隆市府才知道公有路燈在二樓巷子，實在太神秘了。\n\n森巴舞跳舞就在二樓這裡還有崇安街一樓巷子，有看到臉書舞團跟水上恒司合照。\n\n\n\n照片應該是片中的蛇沼綜合醫療中心，實際是基隆海洋撞球廣場，\n\
  \n片中只拍了門口掛布景道具。實際的醫院場景目前還沒有線索，室內景太難找了。\n\n淡水草皮可能就算了不再去，沒有太必要，那裡好少人好熱，還好不遠有便利商店。\n\
  \n男女主角宣傳在草皮附近的涵月社區拍攝。\n\n\n\n台北那個警察宿舍改天也想去看看，看照片感覺那水泥樓板超級薄，希望不會很快拆除。\n\n\n目前已知場景都整理到這裡了\n\
  \n\n\n小彩蛋不知道在日本哪裡，有電車有樓梯台階，感覺日本都市哪個地方都很像。\n\n吉岡照片還有台電勵進餐廳，可能去那裡吃飯換裝，可能是附近有兩個場景方便。\n\
  \n好想要知道女主角家，那個綠色鐵窗花到底在哪裡，我猜測在台北卻找不到。\n\n\n\n這次幸運買到高雄票，當了1/332的觀眾，高雄看了一次，台北看了兩次電影，\n\
  \n看到了吉岡里帆、水上恒司還有曾少宗，第一週第二週禮物都拿到了，好開心。\n\n有看到網路上有人抽到交換券竟然是A5大小的海報，\n\n背面印著電影交換券，不過早場交換券電影院收走就沒有了，有點奇怪的邏輯。\n\
  \n\n\n偶爾瘋狂一下蠻好玩的啦!\n\n台北場景跑兩三個小時，跑淡水跟跑基隆各一天，跑高雄一天，\n\n還好沒有瘋狂到飛去香港或日本看電影，本來有預想台灣沒上映就衝，\n\
  \n台灣有上映九龍大眾浪漫實在太好了。電影看三次，還是很喜歡。\n\n\n現在有發現到電影院第二週好多戲院就已經不上了，好可惜!\n\n查了一下現在全台威秀只是台北信義，基隆秀泰沒上了，\n\
  \n台北信義誠品電影院、西門町真善美戲院、台北長春國賓、喜樂時代影城跟桃園SBC星橋\n\n到10月30日都還很穩定有。想要看的朋友可能要更快了。\n\n另外發現鏡週刊10月16日的稿子，10月25日昨天才上刊九龍大眾浪漫，不曉得怎麼回事，\n\
  \n希望羚邦有多一個廣告宣傳，更多觀眾進戲院去支持九龍大眾浪漫。\n\n以香港九龍寨城為題材，在台灣北部拍攝的一部日本電影，\n\n基隆沒有多宣傳實在太可惜了，片尾只有看到台北市政府跟新北市政府幫助，\n\
  \n沒看到基隆市政府，只有基隆交警協助，實在有點可惜。\n\n工作人員名單好多中文姓名，台日協拍，前景娛樂有限公司真的很厲害。\n\n有發現基隆好像成為電視劇跟電影拍攝地，基隆反而沒有過多宣傳，\n\
  \n雖然對於基隆不太正面，慢慢節奏舊舊的氛圍，可能是現在短片快時代缺乏的氛圍，\n\n基隆很棒，希望日本多來台灣拍電影，台日合作片很棒。\n\n\n\n電影九龍大眾浪漫，是2025年很好看的一部科幻愛情電影。\n\
  \n\n\n\n--\n原來如此，沒看動畫跟漫畫只有看一點評論，怕破梗爆雷\n看IG好像片中場景金魚茶館，基隆喫茶開門有電影限定特餐，有賣檸檬雞跟水餃XD"
