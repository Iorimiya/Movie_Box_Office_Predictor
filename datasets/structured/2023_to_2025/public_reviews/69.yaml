title: '[情報] 眉月啍《九龍大眾浪漫》宣布改編電視動'
content: "眉月啍《九龍大眾浪漫》宣布改編電視動畫與真人版電影 預定 2025 年推出\n\n\n\n由眉月啍（眉月じゅん）所著漫畫作品《九龍大眾浪漫》，官方於今（11）日宣布將改編\n\
  電視動畫與真人版電影的消息，目前兩部作品皆預定在 2025 年推出。\n\n《九龍大眾浪漫》是由眉月啍所著、目前於《週刊 YOUNG JUMP》連載的漫畫作品（台灣由\n\
  東立出版社代理發行）。故事描述，龍蛇雜處，充滿懷舊情懷，人稱東方魔窟的香港九龍城\n。在這個特殊的空間裡，過去、現在與未來之光景交錯著。一絲不苟的鯨井在九龍某房產公\n\
