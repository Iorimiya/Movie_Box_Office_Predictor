title: '[討論] 「極度負雷」他馬克老闆-男伴女裝的濫觴'
content: "去了二輪影院看到了這片國片\n「他馬克老闆」 一看到導演翟友寧就已經不抱期望 想說打發時間看看 想不到本片爛到\n連?\n\n\n\n主角盧廣仲\
  \ 演什麼都像是盧廣仲YEAH\n配角群沒有什麼記憶點 請了曾國城金士傑結果完全沒有發揮到他們的演技\n全片充滿了\n「為了製造笑點而刻意製造的笑點」\n\n\
  黃宣飾演死神 一開始出場撞牆\n之後會持續換各種奇裝異服 也會男扮女裝\n\n曾國城飾演老闆 名字叫王芭淡\n會被這種梗逗笑的通常都是看開心麻花或東北小品的中國觀眾了\n\
  \ 這種三十年前的幽默放到現在的台灣真的不適用耶\n\n請了阿翰演主角女友 又是男扮女裝\n結果阿翰本人FB的影片比這個角色更好笑\n\n以為這樣沒了嗎？ 居然又請了一個男演員飾演男扮女裝的「學姐」\
  \ 跟一個學長演接吻小\n劇\n\n導演是以為 觀眾感到男生跟男生接吻一定覺得很有趣 會哄堂大笑吧。\n\n\n\n男扮女裝不是不行 但是全片充斥這種笑點 而劇情破爛\
  \ 又破碎 完全不懂導演想表達什麼\n ?\n全公司去員工旅遊 結果大家為了公司主動加班 哇靠\n\n\n\n還有太多要吐槽的點寫不完了\n看到推文有人說是近十年看過最失望的電影一點也不誇張\n\
  本片是去二輪影院看都不建議\n甚至電影台播出都應該直接轉台的爛片程度 真的是一部會浪費你兩小時生命的電影。 看\n完\n\n--\nSent from nPTT\
  \ on my iPhone 12\n\n--"
