title: '[問片] 有人看了《超危險警探》了嗎'
content: '一樣又是我來問片啦

  之前羅素克洛的超危險駕駛當初預告一打出來

  就毫不猶豫去看路怒大叔殺四方

  畢竟在台灣大家時不時都會遇到一堆三寶飯+行動神主牌

  就是看個神經病跟三寶在那邊你追我跑也是挺有趣的

  台灣片商不知道是不是因為近年羅素大叔演的電影

  角色調性都很憤怒（上一部神父也滿怒的）

  現在都要來蹭個“超危險”的頭銜來賣片

  加上這部又是有所本的翻拍自小說

  講那麼多，重點就是這部片值得去看嗎？

  會很燒腦？劇情反轉？還是也差不多都是狗尾續貂？



  --'
