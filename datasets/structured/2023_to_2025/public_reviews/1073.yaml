url: https://www.ptt.cc/bbs/movie/M.1712237896.A.31F.html
title: '[討論] 超危險警探中的女配角的動機?'
content: '可能會無意識下爆雷，所以沒看過的請右轉。


  右

  轉

  了





  好吧，我可能到影片末尾才知道兇手是誰。但是當知道兇手是誰的時候，開始不明白伊麗莎

  白在幹嘛？

  她可以完全不用管，最後也不用去吧，更沒滅口的動機和理由。


  她到底在???感覺就是一個跑錯棚的npc，其他人都有可能因為視角問題而有後面連鎖行為但

  是她？


  還有羅素克洛為什麼兩把槍在地上，他拿走的是伊麗莎白的槍？

  可是為什麼要拿走她的？




  最後觀片感想


  排除最後三分鐘的真相大白

  前面劇情算流暢緊湊

  原本期待有羅素克洛的打鬥戲

  但是...沒有....

  e04 到底超危險在哪(失落)










  --'
