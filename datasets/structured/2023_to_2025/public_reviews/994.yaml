title: '[討論] 以愛之茗 貌似柏林首映評價慘烈'
content: '吳可熙參與製作的以愛之茗

  入圍柏林主競賽

  首映之後對岸的媒體影評給予炸裂的評價



  平均分數一分

  還只有一人打分

  其他人都是打X來表達憤怒

  去豆瓣看短評感覺是神片

  台北物語般的神


  還看到有人調侃說這部會橫掃金馬獎

  目前還沒看到西方媒體的打分

  鑑於兩者常有巨大落差

  也許西方媒體評價會好一點？


  有點期待這部片了


  --'
