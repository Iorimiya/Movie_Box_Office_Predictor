url: https://www.ptt.cc/bbs/movie/M.1705972609.A.325.html
title: '[新聞] 「以愛之茗」跨台灣與非洲取景 角逐柏林'
content: '「以愛之茗」跨台灣與非洲取景 角逐柏林影展金熊獎



  2024/1/22 20:21（1/22 22:20 更新）


  （中央社記者王心妤台北22日電）第74屆柏林影展今天公布入圍名單，資深剪接師廖慶松

  監製的「香巴拉」、張翰及吳可熙主演並在台灣和非洲取景的「以愛之茗」都入圍主競賽

  ，「睡覺時眼睛睜開」則入圍「邂逅」單元。


  「以愛之茗」（Black Tea）前片名為「芳香嶺」，由台灣、法國、茅利塔尼亞、盧森堡

  、象牙海岸合製，電影在台灣和非洲取景，並在歐洲後期製作。電影講述一名來自象牙海

  岸的女孩到亞洲和茶藝館老闆邂逅，展開一段跨越文化的愛情。


  吳可熙今天得知喜訊後笑說想給團隊一個大擁抱，她回憶在高雄拍攝時，導演阿布代拉曼

  席沙克（Abderrahmane Sissako）常買芭樂和火龍果給團隊享用。


  電影從前置到拍攝期，幾乎長達半年，吳可熙表示，「這是不可能的跨3洲任務，不只在

  台灣拍，還飛了將近20小時到非洲，過程艱辛，不過大家很團結，對電影充滿熱情。」張

  翰則回憶在非洲吃了海鮮、也看了海龜，感受當地人文風情。


  另一部主競賽入圍作品「香巴拉」（Shambhala）由廖慶松與黃江豐監製、王思靜聯合製

  片，電影後期在台灣進行。電影講述尼泊爾喜馬拉雅山區多夫一妻制的村莊，名為PEMA的

  女子嫁入3兄弟的家，開啟一趟發現並解放自己的旅程。


  「睡覺時眼睛睜開」（Sleep With Your Eyes Open）由曾演出導演趙德胤作品「冰毒」

  、「再見瓦城」的王興洪演出，台灣、巴西、阿根廷、德國合製。電影後期包括剪接、調

  光、特效、視覺、混音都由台灣公司及團隊負責。故事講述心碎的凱從台北來到巴西沿海

  城市療癒情傷，是部帶有喜劇及奇幻色彩的寫實作品。（編輯：張雅淨）1130122



