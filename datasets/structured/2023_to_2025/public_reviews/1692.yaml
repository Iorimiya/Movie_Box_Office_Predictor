url: https://www.ptt.cc/bbs/movie/M.1682604011.A.9C6.html
title: '[雷] 速命道'
content: '今天衝著劉德華去看的



  以下有雷
















  ——————————————————————-


  主角和他哥是雙胞胎，照片出現柯受良


  他哥加入車隊，和主角比最後一場


  主角輸了，他哥被撞下去


  來不及救死了


  主角頹廢喝酒


  打開冰箱沒食物怪哥哥沒買


  打開冰箱的畫面讓我想到某個v的早安台


  主角沒酒了就到台糖蜜鄰超市買酒


  拿一堆結果錢不夠只有一瓶


  店外車禍，主角出去遇到陳醫師


  主角開著車禍的車送孕婦去醫院，陳醫師陪孕婦


  主角找到開車的動力是因為救護車可以闖紅燈


  然後讀書加入EMT


  我不確定EMT真實情況有多少，大部分鏡頭都是飆車救人


  反派是一個叫地獄貓的，名字叫大尾


  演員都很大咖，我是指特別客串的演員


  劉德華和林嘉欣的劇情演的很好


  有一段劇情是小孩被酒醉老爸家暴


  小孩頭受傷，老爸說自己撞的，在救護車上OHCA


  到院急救還是死了


  主角爆氣走那個父親


  結果陳醫師說你就只是開車的（有夠嗆）


  結局是主角和劉德華賽車


  主角把他引到蓋到一半的橋上急煞


  劉德華笑著說贏了不過掉下去的畫面沒出現


  只有車子在空中的畫面


  有一段的台詞是在場的車子都是拉基


  特別客串的演員表演真的很敬業


  主角的個性就是屁孩


  劉德華怎麼拍都帥


  有問題的是劇本和台詞


  我給這部60分


  特別客串加很多分


  有看的一起來討論


  女角都很好看







  --'
