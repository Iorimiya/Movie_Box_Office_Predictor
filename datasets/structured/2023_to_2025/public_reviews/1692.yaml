title: '[ 爛雷] 速命道'
content: '正在看二輪


  看了快一小時


  完全不知道在演什麼


  陳阿姨好老 法令紋好深


  故事到底是什麼完全看不懂


  這種爛電影 沒辦法用負雷來形容了


  只能用爛來定義


  強烈阻止大家去看 連二輪都浪費時間 應該還我150


  浪費一堆好演員的能力


  唯一亮點華神跟林嘉欣


  --

  太難看了我附近沒人

  我整場看完了還是看不懂

  華神為何要弄死柯有綸？

  華神最後撞下高架橋是為了贖罪？


  幹 劇情亂七八糟 竟然還是華納兄弟投資 腦子有病


  還好有吸血鬼 雖然板上評價不高 但比速好一百倍'
