url: https://www.ptt.cc/bbs/movie/M.1682691719.A.B4D.html
title: '[偏好無雷] 速命道'
content: '公司的員工福利票看的，說實在這部電影不是我個人會主動買票進場的類型


  不過看完後意外覺得還不錯


  劇情上一篇普雷鞭的很詳細了


  不過我幾乎沒有帶腦去看


  我只有看到華仔的車原來是排量6200cc的道奇轎車時興奮地抖了一下


  辛苦了華仔，撞一次修一次，牌照稅7萬，不是有錢人真的養不起呀


  台詞是真的很尬，棒讀、每個演員風格不一...但不帶腦都不是問題。至少笑點水準是有的


  飆車片段的運鏡和電腦動畫的結合，效果還不錯。我對飛車片沒什麼研究，玩命關頭只看過

  一集，這部片爽的部分我給過。


  當然可以看得出成本的部分，不像好萊塢那樣可以砸重本啦！但這畫面和剪接，應該也是在

  有限的預算內做出不錯的發揮了。


  女配角很性感，但有點不太確定她到底是來當甘草人物還是單純被片廠塞角的。不帶腦看的

  我給過。


  那個救護車的部分...我也是醫師，我都不帶腦看，以爽片的標準，我給過。


  華仔女兒可愛，但我一直到走出電影院才發現其實...沒事，華仔很帥，有幾幕我還以為突

  然插播汽車廣告(X  雖然轉場略顯突兀，不帶腦看，畫面很美，我給過。


  總之就用玩命關頭的心情看這部就對了。剛好片頭的預告就剛好是玩命關頭呢。總之如果覺

  得周杰倫飄移好看的話，應該會喜歡這部吧。




  ----

  Sent from  on my Google Pixel 4 XL


  --'
