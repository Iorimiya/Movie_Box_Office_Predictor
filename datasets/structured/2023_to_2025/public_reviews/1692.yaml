url: https://www.ptt.cc/bbs/movie/M.1682671206.A.79E.html
title: ' [普雷］速命道'
content: '寫在最前面給大家當選片參考

  畫面特效有做出來，演員表現平庸

  假日打發時間或是瘦子粉可以列入考慮

  ---

  最初在影廳看到這部片的預告時，就深深感受到一股不妙的氣味

  至於如何不妙，後續談論正片的時後再一一詳述

  原本應該跟這部片應該是沒有任何機緣的，但意外就是有一個參加首映的機會

  抱持著某種獵奇的心態，就這麼前去觀賞

  是說曾身為文創產業的工作者，明知這種看笑話的態度對創作者實在不太尊重

  但一部商業電影，終究要接受市場票房的考驗以及觀眾的評論指教

  先說結論，很認真並且花很多錢去拍一部電影並不一定會有好的成果

  ---



  以下有雷



  ---

  先來說說主線劇情：

  阿傑(柯有倫)與小樂(瘦子)是一對喜愛賽車的兄弟

  一次跑山的時候哥哥阿傑遭到劉德華飾演的神祕車手的攻擊墬谷身亡

  瘦子深受打擊渾噩度日不再賽車，然後因緣際會改開救護車

  後來神秘車手找上門說要一決勝負，主角小樂理所當然的用救護車獲勝，結束

  整個故事就簡單地用三行字就說完了

  雖然說劇情主軸簡單並不代表無聊，重點是說故事的方法

  但是整部電影的其他部分也沒有幫助這部電影變得更好，甚至還造成了反效果

  像是阿傑身亡後，工作夥伴以及周遭朋友瞞著小樂試圖要找出兇手

  幾經努力甚至冒著風險探訪車圈大佬以獲取情報

  結果神秘車手根本不用找，因為他會主動現身讓劇情合理的發展下去

  再說他開車攻擊其他車手的理由，原來是二十年前一場比賽意外害死了自己的妻女

  因此決意要殺掉地下賽車的車手，二十年前的事件你當年不處理偏偏要拖到現在

  然後撞飛一台車修一次車，再試算一下路上有多少飆仔

  當年一定連腦子都撞壞了，才會這麼多年後才會選擇這樣的方式

  再說當年的事件起源於跟阿傑、小樂的傳奇車手父親柯受良比賽才發生

  但是當年除了他的妻女外，對手也同樣喪失了性命

  所以把復仇的對象放在他的兒子身上似乎也很合理

  也才發生了開場把阿傑撞飛的事情，不過既然掌握到哥哥的行蹤

  弟弟一定也是針對的目標之一吧，不不不...人家也是聽了廣播才知道的

  小樂一次在大街上飆車送孕婦就醫的事情被新聞報導，自此才被寫進待處理的名單裡

  所以劉德華才是實際上的真主角吧，故事的推進都圍繞著他發展

  為了強化他復仇的動機，跟家人的回憶還重複出現三次，同樣的鏡頭重複出現三次

  回憶畫面中出現排出family字樣的積木，再加上賽車，我還以為馮迪索也有來客串出場

  對了，聽說這部電影裡還有戀愛情節？

  我只能說Ella之於速命道就跟赤木晴子之於灌籃高手一樣，這樣懂得人大概就理解了


  但是劇情架構本身不是我觀影當下覺得有問題的點

  演員跟台詞才是真正讓人覺得不妙的地方

  同樣的問題還是要再說一遍，台劇、台片始終被詬病的拗口台詞

  這部片裡一樣沒有缺席，優秀的演員可以適當的轉化掉這類尷尬

  但很不巧的是，片中大多是素人演員，而且還有幾位善於說唱的素人演員

  某些棒讀感十足的人就不提了，我想菜鳥導演應該沒有辦法掌握住演員

  讓各個演員以自己獨特的說話節奏來講出台詞，結果就是大部分的人都不是在對話

  只是自己面對攝影機賣力的做出一場表演而已

  有趣的是，台詞中的笑點確實讓現場的觀眾笑了

  只是我不確定的是：是因為笑點的本身而笑，還是因為說出這個笑點而笑呢？


  其實片中還是暗藏了一些暖心的小細節

  有這麼一個故事：某個玩家在電玩中與已故的父親留下的紀錄一起賽車

  最終即使是超越了父親，也選擇在終點前停了下來

  以免覆蓋掉著個紀錄，這樣就可以一直跟父親同在遊戲中相會

  片中引用了這段故事放在阿傑跟小樂這對兄弟之間

  雖然很溫馨但我看的很出戲，因為不知道這個故事的人會完全無法理解這一切

  而且什麼主機不選偏偏挑了PS(初代)，640x480的解析度放到大螢幕上真的不是一件好事


  幾經思考，我最後還是給了普雷的評價

  雖然還有破碎的短鏡頭雖然營造了速度感，但也讓人相當疲倦這點也算是扣分項目

  整體來說，即使數落了一堆個人覺得不妙的地方(而且還有很多沒有提到的XD)

  但不能說是一部很糟的電影，金錢與人脈都所耗不貲的特效鏡頭跟大咖演員

  迫使這部片硬是得維持某個水準才不至於票房暴死

  雖然找了頑童MJ116來參與有意讓客群落在年輕的世代

  但是導演放了太多向自己父親致敬的畫面

  我深刻的感受到這項心意，但大部分25歲以下的觀眾應該都無法理解這點吧...


  --

  Sent from nPTT on my iPhone 13


