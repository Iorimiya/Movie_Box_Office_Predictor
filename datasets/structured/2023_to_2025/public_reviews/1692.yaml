url: https://www.ptt.cc/bbs/movie/M.1680865755.A.E71.html
title: 《速命道》劉德華睽違8年再演國片，情義相挺故友「臺灣車神」的兒子
content: "《速命道》劉德華睽違8年再演國片，情義相挺故友「臺灣車神」的兒子！\n男主角瘦子揭影帝私下魅力\n\n ─ 瘦子第一次出演電影男主角就與影帝華仔合作，\n\
  他開玩笑說：「這輩子沒想過有這樣的機會，退休也覺得可以了。」\n\nBY SYLVIA CHENG 2023/04/07\n\n\n\n瘦子 E.SO、陳嘉樺\
  \ Ella 主演的玩命飆速電影《速命道》近日宣布重磅消息：影帝劉德\n華特別演出戲裏面終極神秘大咖的角色「大尾」！這也是「華仔」相隔8年後再次出演臺\n灣電影，名副其實戲裏戲外都是「大尾」啊！\n\
  \n《速命道》是已故的「特技之王」、「臺灣車神」柯受良的小兒子——柯有謙執導的作品\n，除了是新晉導演籌備多時的電影處女作，哥哥柯有倫也是共同編劇和演員之一；劉德華\n\
  與柯受良幾十年的友誼，情義相挺故友兒子也是一段佳話！而瘦子第一次出演電影男主角\n就與影帝華仔合作，他開玩笑表示：「退休也覺得可以了。」\n\n劉德華情義相挺故友「特技之王」柯受良的小兒子\n\
  ￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣\n\n寬銀慕提供\n\n《速命道》是新晉導演柯有謙籌備多時的電影處女作，柯氏兄弟檔哥哥柯有倫除了演出之\n外，也是共同編劇。而2023年恰巧也是「黑哥」柯受良逝世的20週年，如今幼子柯有謙、\n\
  連同長子柯有倫聯手，分別執導、編寫與演出這部賽車題材的電影，可謂衣缽傳承，讓《\n速命道》更添一重意義。\n\n監製「寬姐」邱瓈寬表示「『黑哥』柯受良是大家的好朋友，非常感謝劉德華情義相挺，\n\
  一口答應特別演出。」她還說柯受良當年飛越黃河的創舉，至今依然無人能及，柯家兄弟\n今天選擇用「飛車」的映像致敬自己的父親，瞬間永恆。 「電影裏劉德華演的就是『一\n\
  代車神』，與現實裏面的『黑哥』可謂某種跨時空的合作，意義非凡。」\n\n劉德華與柯受良淵源甚早，一起拍過電影，還一起和吳宗憲合唱過金曲〈笨小孩〉。兩人\n惺惺相惜幾十年，所以得知柯有謙籌備《速命道》，劉德華很阿莎力一口就答應了！睽違\n\
  多年沒在臺灣拍片的劉德華，聽到《速命道》的計畫時就馬上點頭支持：「非常欣賞導演\n對電影的熱情以及對細節的追求，相信這部片會讓觀眾感受到無比誠意。」\n\n瘦子談與劉德華合作：退休也覺得可以了！\n\
  ￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣\n\n寬銀慕提供\n\n導演柯有謙說起跟劉德華的緣分，他表示：「兒時爸爸柯受良忙著籌備飛越黃河時，都是\n劉德華在照顧我們兄弟，很感謝他的照顧，第一時間就想要邀請劉德華參與演出，也感謝\n\
  他一口答應。」\n\n初次演電影就跟影帝合作，瘦子回憶見面時的心情說：「劉先生非常有魅力，每一刻都像\n活在電影裏面。」他也分享現場被劉德華的氣場震懾，笑說：「這輩子沒想過有這樣的機\n\
  會，退休也覺得可以了。」\n\n張惠妹為「大尾」劉德華角色獻唱\n￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣\n\n寬銀慕提供\n\n劉德華戲裏的角色「大尾」意外痛失最愛的家人，內疚、懊悔與失落之痛，深深烙印在他\n\
  原來滿是傲氣的靈魂；他在電影裏亦正亦邪，與瘦子飾演的「小樂」是敵人，卻也亦師亦\n友。\n\n「戲裏別的角色是以速度求勝，劉德華的角色卻是以速度求敗，角色很難演繹，除了劉德\n\
  華，真的是不作他人之想。」邱瓈寬繼續說「之前張惠妹最新的單曲〈離別總是那麼突然\n〉，就『代言』劉德華的角色，不單是張惠妹本身在唱，也要進入劉德華的視角來演繹。\n\
  」\n\n天后張惠妹音樂加盟，睽違三年帶來全新單曲〈離別總是那麼突然〉，同時也是電影《速\n命道》的主題曲。黃韻玲作曲兼製作、kwan與李焯雄的詞作巧妙地揉合了劉德華角色複雜\n\
  的情感，加上張惠妹細膩的演繹，單曲無預警推出即空降排行榜冠軍！\n\n\n\n《速命道》集結頑童與Ella，瘦子小春大淵首次大銀幕合體！\n￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣\n\
  \n寬銀慕提供\n\n由臺灣和香港聯合打造年度激速動作鉅片《速命道》4月27日全臺上映，首先請到「行走\n的費洛蒙」瘦子擔任男主角與女主角Ella尬戲之外，也讓「頑童MJ116」瘦子、小春、大\n\
  淵首次在大銀幕合體演出，更好事成雙，合體演唱電影同名主題曲〈速命道〉，這是「頑\n童MJ116」2019年宣布「單飛不解散」後的難得的三人全員全方位合體！\n\n\
  《速命道》劇情講述在地下賽車界裏，新興賽車手「小樂」（瘦子飾），因與哥哥「阿杰\n」（柯有倫飾）競速的比試中發生意外而自暴自棄，直到他遇上女醫生「慧慧」（Ella飾\n\
  ），轉念成為了救護車司機，誓言要「用速度救人」。然而，宿命並未輕易的放過小樂，\n在「三寶」（大淵、林真亦、林志謙飾）與地下賽車界大哥「本哥」（小春飾）的共同調\n\
  查下，阿杰意外的真相逐漸浮現，神秘的車神「大尾」（劉德華飾）也終極現身……\n\n\n\n【延伸閱讀】\n\n>> 劉德華出道40年，細數他曾說過的10句人間真實：「太懂事的人最累。」\n\
