url: https://www.ptt.cc/bbs/movie/M.1683389886.A.005.html
title: '[新聞] 【專訪】《速命道》導演柯有謙顏值高拒演'
content: '新聞網址：


  新聞標題：【專訪】《速命道》導演柯有謙顏值高拒演戲 誇讚哥哥爸爸真偉大


  完整新聞內文：


  《速命道》導演柯有謙、編劇之一邱炳豪，為電影宣傳高度曝光，讓網友讚嘆：「現在電

  影的編、導都這麼帥嗎？」柯有謙顏值高，一直有人邀他演戲，「每次有人找，我就會自

  問：能不能做到？到目前為止，我很確認自己做不到，根本不考慮走幕前。」


  柯有謙反過來誇哥哥柯有倫「比較帥」，就是能在鏡頭前展現其魅力；柯有倫既是歌手也

  是演員，這次在《速命道》演出外，還多了個編劇身分。最初就是兄弟倆一起發想劇情、

  啟動了《速命道》的拍攝，柯有謙坦言，就算是親兄弟，還是會有磨擦，不過兩人達成共

  識後，得到的結果絕對是最好的。


  「我想從事電影工作，多少是受我爸影響，但真正推動我在影像這塊發揮的背後力量，反

  而是我哥。」柯有謙說，哥哥在20出頭時面對爸爸過世，毅然承擔起家中一切，把他當兒

  子般的照顧，「那時我哥兼任了好幾個角色，給我很多空間去展現自我，還要當我媽的支

  柱，他真的很不容易。」


  兄弟首度合作、各展所長，前後花了6年時間完成《速命道》，爸爸也巧妙的出現在電影

  中。今年正好是柯受良過世20週年，冥冥中父子三人竟有這樣跨時空的另類合作，柯有謙

  強調：「對我來說，爸爸一直在心中，隨時想念他，不會刻意去記他已經過世了10週年或

  者20週年。」


  《速命道》除了向「車神」柯受良致敬，柯有謙在籌拍電影的同時，也更深入的認識爸爸

  ，畢竟失去父親時他才11、12歲，加上柯受良生前工作太忙，真要計算他們父子實際相處

  時間，柯有謙想了一下回答「2年吧」，「可是每個相處時光都很美好，不管對工作、對

  家庭，他都是個很盡責的人，每次看著他出門時的背影，好像要去做大事似的，很神奇的

  感覺」。


  柯有謙親眼見證了爸爸飛越黃河、締造個人新紀錄，當時他只有6、7歲，全場歡聲雷動的

  景象，令他大開眼界，那一刻真實感受到「爸爸很了不起」；他參加兒童卡丁車比賽，柯

  受良沒有缺席，宣布他獲勝時，柯受良在場邊興奮的又跳又叫，「那個moment的印象非常

  深刻，一直到今天我都沒有忘記。」對柯受良能夠自導自演，在美國學電影的柯有謙更是

  佩服，「我爸真的是個不一樣的人，外星人來的，小學都沒畢業，竟能做到這樣。」


  儘管柯受良已經離世20年，仍然有港台演藝圈的眾多好友，願意幫助柯有謙完成第一部電

  影作品，所以柯有謙說：「爸爸給我的愛從來沒有少過，他的精神也讓我感到很驕傲，他

  一定有看到我們做的事，知道我們做出來的成果比預期的還多，相信他是很開心的！」


  --'
