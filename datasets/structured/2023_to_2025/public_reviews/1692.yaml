url: https://www.ptt.cc/bbs/movie/M.1682846001.A.287.html
title: '[好雷] 速命道好雷分享'
content: '雷文防雷資訊頁


  我必須承認這部片本來聽名字

  我沒有很想去看

  覺得弱弱的


  但整部看完覺得超好看的

  沒有冷場的地方


  推薦大家去看

  以下防雷頁


  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  首先覺得劇情銜接不會太過緊湊

  讓人覺得看的很舒服


  但對於劇情主角在失意過後

  重新找回人生目標

  開始開救護車這段

  覺得蠻跳tone的


  但無腦看片的話其實也沒差


  然後後面有漸入佳境

  讓人忘記主角一剛開始的違和感

  漸漸的喜歡主角


  裡面最喜歡的角色是Ella扮演的醫師


  覺得她在國片裡的角色

  有越演越好的感覺



  然後瘦子演的主角

  覺得口條不錯

  但覺得這部電影對情感可以再多加著墨

  因為沒有什麼哭點


  算是滿平鋪直敘 穩穩當當的一齣戲


  但針對是處女秀來說

  我覺得演的很好




  再來是德華哥


  依舊帥氣非凡

  即使有皺紋幾條 一樣帥氣十足


  跟家人相處的刻畫也很完美

  刻意營造出來愛家愛老婆孩子形象的

  殺人兇手但又不會讓大眾討厭這個角色


  但最後領便當的方式有點悵然QQ



  賽車部分還可以

  在公路上開快車也蠻刺激的



  最後推薦大家去看這部電影

  不錯看~


  --'
