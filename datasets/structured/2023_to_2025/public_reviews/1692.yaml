url: https://www.ptt.cc/bbs/movie/M.1634744496.A.8FC.html
title: '[新聞] 瘦子、Ella 主演柯有謙執導賽車片《速命道》（非原標）'
content: '新聞網址：


  電影「速命道」由「亞洲飛人」柯受良的兒子柯有謙執導、柯有倫演出，柯有謙盼延續家

  傳的速度之魂拍出浪漫飆速電影，同時將由歌手瘦子首次挑梁主演，與藝人Ella談姐弟戀

  。


  「速命道」今天舉辦開鏡儀式，對於首次挑梁主演電影，瘦子坦言相當緊張，也感謝排戲

  時Ella（陳嘉樺）帶他進入狀況，他在籌備期間也盡量熟讀劇本並練習。


  瘦子提到，為了完美呈現賽車片段，花了許多時間揣摩心境，他也笑說：「現實中我跟這

  角色根本不是同個人，我是一個開車很守規矩、很安全的人，我的強項是停車。」


  Ella除了誇獎瘦子台上、台下都是個真誠的人，也笑說曾和朋友們分享將和瘦子合作拍片

  ，朋友們聽到後馬上報名想探班，「我很開心可以光明正大跟瘦子談戀愛。」


  對於飾演醫生，Ella表示，「因為我以前學的就是醫護管理科，所以也算是有經驗，劇組

  在拍的時候現場也會有專業人士，所以完全不擔心。」


  「速命道」描述賽車手小樂（瘦子飾）在一場和哥哥阿杰（柯有倫飾）的競速比賽中發生

  意外，直到遇上女醫師慧慧（Ella飾），轉念成為救護車司機的故事。




  --'
