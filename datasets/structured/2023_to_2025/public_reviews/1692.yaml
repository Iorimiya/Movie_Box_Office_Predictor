url: https://www.ptt.cc/bbs/movie/M.1682768240.A.D45.html
title: '[普雷] 速命道  還是進場支持了飆車國片 '
content: '雷文防雷資訊頁


  這部當時看預告有賽車片段還有華仔，就預計上映時進場看


  但看到版上的負評加上預告演員講台詞很尷尬，又讓我卻步


  那為什麼又買票去看呢，因為想說國片難得有人肯拍公路競速類型


  剛起步多少都會拍得很粗糙，但不踏出第一步，國片永遠都是那些類型











  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  先講優點


  這部片賽車的部分，拍得真的很不錯，除了在山道競速外，還有在市區飆車的片段


  在市區競速周圍有其他車的情況下，拍攝需要考量到很多 包括運鏡 車子的走位等...


  也有可能那些路人車是用CG做出來的，不過看得當下覺得很逼真刺激


  然後華仔演出的部分很有氣勢，看他飆車就想到他以前的片 烈火戰車


  再來是缺點


  前面幾篇版友都有點出來，演員念台詞很像在棒讀


  最有印象的是小春講的一句 這裡的人他媽都在玩命  聽了超想笑


  再來是女主角為什麼要找ELLA，因為每次看到她就會讓我想到她已經結婚了


  他跟瘦子的感情戲，我都閉著眼睛不想看，太尷尬了，而且感情戲又占很多篇幅




  總之還是希望國片之後還能繼續拍出好的競速電影，可以的話多著重在賽車的部分


  文戲請個編劇修一下，演員也請專業的來演，你要挑明星跨界來演 演技至少要刁一下


  不要念個台詞很生硬


  --'
