url: https://www.ptt.cc/bbs/movie/M.1712365720.A.ED0.html
title: '[新聞] 貧民百萬富翁變身孟買殺神！《怒火狂猴》'
content: '新聞網址：


  貧民百萬富翁變身孟買殺神！《怒火狂猴》爛番茄高分好評狂推


  2024-04-06 08:28 自由時報電子報記者 許世穎 綜合報導


  曾演出《貧民百萬富翁》、《漫漫回家路》的奧斯卡入圍者戴夫帕托，首度自編自導自演

  電影《怒火狂猴》，描述一個男人向謀殺他母親並且持續系統性地迫害窮苦無助人們的貪

  汙腐敗領導者展開絕地報復，充滿精彩火爆動作的中文預告昨正式曝光。


  精彩絕倫、劇力萬鈞的該片受到古老傳說印度神猴「哈努曼」的啟發，哈努曼代表了力量

  及勇氣，戴夫在片中飾演基德，每晚都在地下拳擊俱樂部戴著大猩猩面具，靠著被更有名

  的拳手打得血肉模糊，藉此賺取微薄酬勞。


  基德多年來壓抑內心的怒火，終於找到方法滲透進入這座城市邪惡菁英分子的組織。當他

  的兒時傷痛難以遏抑的時候，他傷痕累累的神祕雙手就會為他帶來復仇的強大力量，讓他

  向奪走他一切的壞人報仇雪恨。


  電影充滿驚險刺激的飛車追逐和拳拳到肉的動作戲份，戴夫除了擔任導演以外，也和編劇

  夥伴保羅安古納維拉以及約翰柯利將他的原創故事改編成劇本，並由《逃出絕命鎮》鬼才

  導演喬登皮爾擔任製片。


  戴夫精彩火爆的動作演出，也被讚譽宛如「孟買版殺神」，電影將在金馬奇幻影展在台首

  映，同時也在知名影評網站爛番茄獲得85%的認證新鮮度。《怒火狂猴》預計5月31日在台

  上映。


  --'
