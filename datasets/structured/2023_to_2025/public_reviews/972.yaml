content: '防雷


































  以前看過男主角演員演的漫漫回家路,覺得他很帥

  這部在max上了之後想說加減來看

  其實還算ok,主要是用印度的方法

  來演出一個好萊塢式的動作片（只是沒跳舞）

  有些動作戲是真的不錯,雖然通病沒有少犯過

  像是有槍硬要近戰,這種我真的看幾次傻眼幾次

  還有劇情編排還可以再更好

  事實上這部電影是可以收在一個半小時的

  有些比較無關緊要就可以刪掉沒關係

  不過我還是欣賞他以一個不一樣的角度

  去介紹一個從底層爬起來的英雄


  ----

  Sent from  on my Samsung SM-S9280


  --

  萊斯特在最後敘述中講述了生活中有意義的經驗，他說，儘管他死了，他還是很高興，因

  為這世界上有這麼多的美


  --'
