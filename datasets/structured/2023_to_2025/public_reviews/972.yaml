content: "一鳴驚人自編自導自演 震撼鉅作\n 最新監製 拳拳到肉再創全新動作經典\n\n\n\n一個每晚都在地下拳擊俱樂部戴著大猩猩面具，靠著被更有名的拳手打得血肉模糊，藉此\n\
  賺取微薄酬勞的無名小子，多年來一直壓抑著他內心的怒火，現在終於找到方法滲透進入\n這座城市邪惡菁英分子的組織。當他的兒時傷痛難以遏抑的時候，他傷痕累累的神祕雙手\n\
  就會為他帶來復仇的強大力量，讓他向奪走他一切的壞人報仇雪恨。\n\n精采預告:\n\n【怒火狂猴】5月31日 猴MAN 戲院見\n\n\n特映會場次（一人得獎兩人同行）\n\
  中午場：5月21日 12:20 MUVIE\n台北場：5月28日 19:30 長春國賓影城\n台中場：5月21日 19:00 站前秀泰影城\n台南場：5月28日\
  \ 19:30 台南國賓影城\n高雄場：5月28日 19:30 SKM PARK國賓影城\n\n參加抽獎方式：留言回答你想要搶先看【怒火狂猴】的原因，並註明場\n\
  次就有機會中獎（如：）\n\n\n公布得獎日期：\n1.台中-5月14日公布得獎名單於回文內，得獎者請於5月15日18:00前主動私訊回覆領\n票者資料，恕不接受逾期回覆\n\
  2.中午-5月17日公布得獎名單於回文內，得獎者請於5月20日12:00前主動私訊回覆領\n票者資料，恕不接受逾期回覆\n3.其他場次-5月20日公布得獎名單於回文內，得獎者請於5月21日18:00前主動私訊回覆領票\n\
  者資料，恕不接受逾期回覆\n\n\n\n--"
