title: '[情報] 奧斯卡3項大獎提名《我依然在此》4.2上映'
content: '轉自好威映象粉專：


  好威神秘新片強勢發布《我依然在此》I''m Still Here

  　　　　　　　　　　

  ★ 奧斯卡金像獎 最佳影片、最佳女主角、最佳國際影片 三項大獎提名

  ★ 金球獎戲劇類 最佳女主角

  ★ 威尼斯影展 最佳劇本

  　　　　　　

  ★《中央車站》金熊獎名導 華特沙勒斯 最新撼世鉅作

  ★ 金球獎影后 費南妲托雷斯 出神入化演技眾人稱頌

  ★ 鹿特丹、溫哥華、邁阿密、費城、聖保羅、加州米爾谷 橫掃各大影展觀眾票選獎

  ★ 巴西票房目前超越500萬人次 勢必再創影史新紀錄

  　　　　　　　　　　　　　　　　

  　　多年之後，姊弟的日常對話。

  　　　　　

  　　「你是什麼時候在心裡埋葬了父親？」

  　　「埋葬？」

  　　「嗯，就是知道他再也不會回來了」

  　　　

  根據真實故事改編，1970年代的巴西，台灣再熟悉不過的白色恐怖。一名母親必須挺身而

  出，找尋丈夫失蹤的真相，同時持續帶給孩子們愛與希望。

  　　　　　　　　

  4月2日，我依然在電影院，不見不散！


