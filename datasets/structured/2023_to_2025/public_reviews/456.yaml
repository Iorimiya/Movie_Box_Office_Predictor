title: '[超好雷] 我依然在此 Ainda Estou Aqui'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  電影背景描述在巴西軍政府執政時期佩瓦一家人在時代背景下的成長歷程


  一開始海灘上遊玩的人群，伴隨遠方傳來戰機的聲音，彷彿預告軍政府的作為。一起瑞士大使被自由主義份子綁架，要求當局釋放政治犯，政府當局開始積極調查，一時風聲鶴唳，原本是國會前議員的佩瓦，被軍警請去做筆錄，後續太太及女兒也被請去訊問，幾番折騰後兩人回到家中，但一直沒有佩瓦的下落，生活周遭亦被監視


  尤妮絲不放棄透過各方管道，想知道丈夫的生死，後來從友人的口中才得知丈夫已被失蹤，於是開始找證據來證明軍政府關押過丈夫，在友人的幫助下持續蒐集相關資料


  時間轉到25年後，軍政府倒台，尤妮絲終於拿到丈夫的死亡證明 ，片尾年邁的尤妮絲看著新聞，報導當年被錯殺的政治犯不禁淚流


  最喜歡片中佩瓦一家人的相處過程，像是小妹和小弟長大後彼此閒聊，從何時知道自己的爸爸不會回來，小弟說從媽媽把爸爸衣服捐出去的那一天起；小妹則說是從從里約搬到聖保羅的外公家時，看著原本屬於一家人的家，卻以成空蕩蕩，以及尤妮絲為丈夫奔走不放棄的精神



  本片改編自佩瓦的自傳，推薦給喜歡小品的人

  -----

  Sent from JPTT on my iPhone


  --'
