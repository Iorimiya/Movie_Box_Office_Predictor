title: '[好雷] 我依然在此'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  入圍第97屆奧斯卡最佳影片、最佳女主角與最佳國際影片的《我依然在此》，根據真實故

  事改編，講述巴西軍人獨裁統治時期的白色恐怖與近年的轉型正義。這部巴西、法國與西

  班牙跨國合作的電影，最後奪得今年奧斯卡最佳國際影片。



  1970年的里約熱內盧，沙灘上到處是嬉鬧人群，魯本斯與尤妮絲一家七口就住在海濱街區

  ，與朋友聚會、歡笑暢談、拍照留念是他們的日常；但同時，不滿獨裁政府的反對聲浪四

  起，也讓白色恐怖逐漸蔓延每個角落。悲痛的尤妮絲被迫挺身而出，找尋丈夫失蹤的真相

  ，並獨自撐起這個家，以堅定的心持續帶給孩子們完整的愛與希望。



  「你是什麼時候埋葬他的？」



  電影改編自主角魯本斯與尤妮絲的小兒子，馬塞洛‧魯本斯‧派瓦在2015年出版的同名回

  憶錄。馬塞洛後來成為編劇、記者與小說家，在這本回憶錄裡，他記下的不但是媽媽如何

  帶著五名子女面對這樁家庭困境，更是他與四名姊姊在經歷這場劇變前後的生命歷程。《

  我依然在此》某種程度上讓觀眾看見派瓦一家的孩子，如何在一夜之間長大成人。



  魯本斯消失25年後的1996年，派瓦一家終於取得他的死亡證明。就像尤妮絲所說，領到死

  亡證明怎麼這麼開心，那是一種釋放，表示這一切假使不是句點，至少終於有個逗點，也

  代表過去她付出的一切努力都不是虛假的幻覺，丈夫的死是真實存在、被承認的事實。全

  片最感人之處莫過於當天晚上，小妹巴碧烏問馬塞洛：「你是什麼時候埋葬他的？」馬塞

  洛疑惑地問：「什麼意思？」巴碧烏解釋就是理解到爸爸永遠不會再回來的那一刻。



  對這個家最年幼的兩人來說，當年的事件象徵他們的童年提早結束。即便如此，全家人還

  是小心翼翼地不讓兩人明確知道家中發生什麼事，所以對巴碧烏來說，當他們搬離里約，

  看著曾經盛滿全家人歡笑淚水回憶的家，空蕩蕩的什麼也不剩，那一刻她將盼望爸爸回家

  的心願與一部份的自己都留在那個家。當天離開前，媽媽將打包行李時發現的乳牙交給巴

  碧烏，對她來說，從媽媽手裡接過這件明明只有爸爸與自己才知道的寶物，彷彿午夜鐘聲

  敲響十二下後失效的魔法，正式宣告爸爸再也不會回來。



  而對年紀更小的馬塞洛來說，他還能平靜地與鄰居、玩伴道別，好像對一切都懵懵懂懂，

  因此，大約一年半後，當馬塞洛看到媽媽捐出爸爸的衣服，他才終於意識到爸爸從家中消

  失的事實。排行中間的娜露可能比其他的手足還要壓抑，她不像姊姊們對家裡的狀態略知

  一二，但至少也看得出媽媽與二姊曾經失蹤幾天，兩人返家之後神情大變；她也不像弟妹

  受到良好的保護，還能天真地玩著手足球與洋娃娃，但真要娜露說說發生什麼事，她恐怕

  也是一問三不知。



  大姊薇拉的狀況最為特殊，爸媽早在軍隊開始隨意盤查人民，連年輕學生都不放過的時候

  ，就決定讓她跟隨親戚前往倫敦。人在國外的薇拉，每天看著報紙與電視新聞報導著自己

  的爸爸失蹤，卻無法掌握第一手資訊，著急之情可見一斑，所以成天吵著回家。雖說回到

  巴西安全堪慮，但身為大姊，她能夠稍微幫媽媽分擔一點辛勞，一家人在一起也更能彼此

  照應。



  埃利安娜則是以最殘酷的方式了解一切，她自己也成為階下囚，即使只有一天，被蒙上頭

  套、銬上手銬、在昏暗的監獄中被逼問可不是好玩的事。在等待母親遭訊問的同時，埃利

  安娜坐在門外冰冷的座椅上，聽到四周不時傳來嚴刑拷打的慘叫與哀求聲，回到家後，她

  必定從青春期蛻變成完全不一樣的成熟。其後從姊姊的信裡讀到媽媽為了弟妹的心智而省

  略的段落，更讓埃利安娜確信家中遭逢的事情非同小可，是世界新聞都會報導的恐怖程度

  。



  《我依然在此》包含非常多的家庭錄影帶畫面，顯見派瓦一家本來就是一個熱愛記錄生活

  的普通家庭。薇拉從攝影機的觀景窗看出去的家人，每個都是那麼可愛，而這些畫面也是

  簡單的平凡曾經真切地存在於這個家的鐵證，不可抹滅。在爸爸失蹤前，薇拉也以攝影機

  記錄下自己在倫敦生活的點點滴滴，搭配上文字的信件，作為讓家人知道自己近況的方式

  。就連要搬離里約之時，她也拿起攝影機，拍下這感傷又值得紀念的一刻一景。沒想到，

  片尾播放曾經的一支家庭錄影帶，卻成為事件過後，派瓦家唯一可以追憶父親的方式。



  「派瓦一家從來不在外人面前哭。」



  除了家庭錄影帶之外，派瓦一家也很喜歡拍照留念。在魯本斯失蹤之前，尤妮絲剛好本來

  也就在整理照片，她說「不整理的話我會搞不清楚」。如同1996年時，巴碧烏與馬塞洛討

  論著眾人在海邊的合照，想不起來是誰的生日，就連尤妮絲一開始也以為是薇拉的生日派

  對，但在把照片好好收藏起來之前，她突然憶起，那是薇拉的送別會，也是一切都還正常

  的最後紀錄之一。馬塞洛在回憶錄裡寫道，在他記憶中從來沒看過媽媽哭，這並不是由於

  尤妮絲故作堅強，或許是因為她知道，若自己無法成為孩子們可靠的後盾與象徵，大家將

  無法繼續前行。



  電影裡的尤妮絲也不見一滴眼淚，頂多只有巴碧烏與馬塞洛吵架後，進到書房內央求媽媽

  幫自己修好娃娃，意外撞見剛得知丈夫死訊的尤妮絲陰鬱的臉，因而問出：「你剛剛在哭

  嗎？」其實便是導演根據馬塞洛所言，將費南妲‧托雷斯在拍攝本片時所有流淚的畫面都

  剪掉，以展現尤妮絲的剛毅。又如報社到派瓦家，希望能夠拍攝一張「沒有爸爸」的全家

  福，因此要求影中人不要顯露開心的表情，但尤妮絲見狀馬上說：「為什麼不能笑？」而

  帶著孩子們一起咧嘴哈哈大笑。就算爸爸被人拿剪刀從全家福照片中殘暴地剪除，剩下的

  家人「依然在此」，所以她們還是得宛若沒有這份空白地好好活下去。



  《我依然在此》講述的不僅是巴西的白色恐怖，也包含巴西的轉型正義。不少人以為，這

  兩個詞語是相對的，但其實轉型正義強調的是歷史真相，而這也是尤妮絲一生致力於推動

  的。事件過後，她搬回娘家，以便有更多資源照顧五個孩子，同時自己也回到校園去鑽研

  法律，除了讓閱讀與丈夫有關的文書更為容易之外，對於未來持續關注人權議題也很有幫

  助。



  即便1996年拿到魯本斯的死亡證明，派瓦一家還是等到2014年，巴西的國家真相委員會才

  解決這起案件，首次承認軍方在軍政府期間對他人施加酷刑並殺害異議人士，也就是觀眾

  在電影末段看到，早已深受阿茲海默症之苦的尤妮絲，看著電視新聞仍舊引起情緒波動。

  2018年過世的尤妮絲，看似還算等到屬於丈夫的公平正義，其實生前經歷15年的阿茲海默

  症病期。而片尾字幕顯示，即使這些案子已經有結果，也認定軍方某些人須為此負責，但

  至今仍未有人遭到起訴。



  「世界各地的人都會怕自己的民主變成獨裁。」- 馬塞洛‧魯本斯‧派瓦



  描繪白色恐怖的電影通常充滿壓迫與陰鬱，當然《我依然在此》在呈現尤妮絲遭監禁12天

  的過程也是如此，但嚴格來說，它還是一部相對輕鬆的電影。不論事件發生前後，除了父

  親的缺席之外，派瓦一家幾乎都籠罩在快樂的氛圍之中。畢竟電影改編自馬塞洛的同名回

  憶錄，可能在11歲的他眼裡，爸爸缺席之後的家就是這個樣子吧。就像軍方來訪的當天早

  上，魯本斯淡淡地說自己上樓換件衣服，臨走前還親吻女兒，上車前回頭望向房子與老婆

  ，就算當下他曾想過這會是最後一面，魯本斯還是從容就義，就好像他只是出門去上班一

  般地稀鬆平常。



  但正是這種彷彿無事發生的敘事口吻，才會讓人在片尾字幕搭配派瓦一家真實照片跑過銀

  幕時，更止不住淚水潰堤的情緒與油然而生的恐懼。當軍方或政府派人到家裡，和和氣氣

  地邀請你去配合調查，卻在路上為你戴上頭套，甚至伴隨著逼供用的刺眼檯燈與嚴刑拷打

  ，那些你用來回憶美好家庭時光的照片，卻變成一張張放在活頁簿、資料夾內冷冰冰的證

  件照，用充滿憎恨的手寫下歪扭的全名，逼問你是否知道他們任何一位的罪狀，甚至在某

  一頁看到自己憔悴的面容，我們才會知道自己已然成為下一位魯本斯‧派瓦，願所有經歷

  與未曾經歷白色恐怖的民主都不再遭遇這麼一天。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
