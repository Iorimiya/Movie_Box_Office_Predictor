title: '[普雷] 港片迷望追龍'
content: '港片迷衝著雷洛第一天就去看了  看到肥仔晶其實有些猶豫怕怕的又沒影評可參考


  回歸後請習慣中資入主:大量的臉盲中國女花瓶、大量中資廣告、誇張特效、爛劇本


  80.90年代緊湊逼真的氣氛已不復見


  劇情:


  片頭那連續四五個公司介紹讓我翻白眼，片中出現的女生毫無記憶點。


  之前呂良偉、吳孟達太經典。鄭則仕雖然也不賴，但感覺就是要達叔拍雷洛的馬屁才夠味


  相反的華仔依然演自己，但當初充滿演自己的帥氣，近期的盲探阿、現在的雷洛阿、


  感覺都是老了笑看人間那種感覺，然後看50幾歲的華仔演菜B八雷洛捧顏童的覽趴


  真是彆扭。


  呂良偉太強了，阿丹演得中規中矩。


  想看華仔的不用怕，戲分跟阿丹差不多。


  然後這片莫名奇妙的伸出五根手指貪五億，實在感覺不到雷洛和跛豪中間奮鬥的過程。



  特效:


  九龍城寨自從被鼻子炸掉後，此片動畫弄出來的場景和突兀的飛機讓我滿肚子火。


  除此之外，然後阿豪的老婆和小孩掉入水裡動畫又臭又長。感覺掉很深，


  走私船家還有閒工夫竟然還打撈得起來?



  情感:


  此片親情毫無感覺，節奏跳太快。 阿豪一轉眼就趴在碼頭邊抱著哭，然後娶了新的老婆，


  作夢不知道夢心酸的。


  然後金三角大將軍的家人隨便就被跛豪收服，靠著照片和錄音機，這說服力我傻眼


  倒是兄弟之情我覺得挺不錯的。




  武打:


  武打不多，不像以前一樣血漿到處飛的緊湊。


  但能看到主角吃鱉挺爽的，不至於落入俗套


  常常看到東方武打的老毛病，一堆人在後面晃來晃去不敢打。


  相較這點，鼻子就有特別的運鏡。 但胖仔晶強項不在此，就算了吧。


  想看阿丹在此片大展身手的觀眾可能會大失所望



  總結:


  這片算是重溫舊夢的警匪片，但是要跟以往的演員角色抽離。


  說故事的能力差了許多(畢竟編劇是肥仔晶)，節奏太快，缺乏情感醞釀。


  武打沒甚麼亮眼之處。


  不過看看投共之後的阿晶，看看賭城風雲...


  這片我真的該給高評價了...


  這片算是漸入佳境，前半小時真是想離席。越後面越緊湊囉


  --'
