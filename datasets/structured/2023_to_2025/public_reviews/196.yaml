content: '#來了




  屍速列車 團隊最新殭屍鉅獻！


  《》8月1日(五) 全台上映




  即使全世界都背對妳...

  爸爸也不會放棄妳！




  《屍速列車》團隊最新殭屍鉅獻


  改編自9.8顆星超人氣漫畫《



  《變身機長》ｘ《比天堂還美麗》李姃垠ｘ《寄生上流》曺汝貞ｘ《外傷重症中心

  》尹敬浩ｘ《外星+人》崔惟理 精彩共演！




  全世界遭受殭屍病毒的襲擊，為了守護被感染的女兒，身為猛獸飼養員的爸爸正桓（

  飾）運用長久以來照顧老虎的經驗，開始訓練自己的殭屍女兒——


  比老虎更恐怖、比青春期更折磨，為了守護女兒，哪怕失去生命也在所不惜……！




  --

  表示票房很好啊，有人看就有人進'
