title: '[好雷]《我和我的殭屍女兒》，當愛交會，便有奇'
content: '部落格版：


  前幾週才有改編自網路小說的《全知讀者視角》，本週再有改編自網路漫畫的《我和我的

  殭屍女兒》上映。兩部作品都沒有看過原著小說與漫畫，因此進場完全不會受到原著的干

  擾與影響，在對劇情陌生到可將之視為原創的情況下，我個人是還滿喜歡這兩部電影的，

  不過卻也忍不住想像如果改編成影集會是怎樣的？不同於《全知讀者視角》據悉將拍成五

  部曲，可以有五部電影的時間讓整個世界觀與劇情、角色發展更完整，《我和我的殭屍女

  兒》目前沒有聽說續集計畫，雖然我認為近兩個小時篇幅裡，導演畢鑑盛已算將故事說得

  圓滿，正桓與秀雅這對父女的親情主線相當飽滿，只是相對之下其餘配角支線就是輕輕帶

  過，例如妍花與正桓過去的關係、秀雅與親生父母過去的往事等等，或許這是考量劇情長

  度的取捨，但我還是會想如果將這些配角故事放進來拉長成影集似乎也不錯。


  說歸說，整體而言我還是喜歡《我和我的殭屍女兒》的，這類關於親情的題材始終是我的

  軟肋，尤其是電影本身特別專注在這條主線上，喜劇的外包裝底下藏有的，是為人父母對

  孩子付出所有的愛，那是拼命想要保護孩子的愛、是怎麼樣都不會輕易放棄孩子的愛、是

  可以為了孩子犧牲的愛。《我和我的殭屍女兒》用看似荒誕的喪屍故事告訴觀眾一件早已

  聽過無數次的事，父母從來都不會是擁有超能力的超級英雄，然而他們卻能用無限的愛抵

  抗全世界，把任何會對孩子造成傷害的惡意與危險阻擋在外，那是比什麼都來得強大的超

  能力。而《我和我的殭屍女兒》更為動人的是，觀眾能夠看見孩子努力的想要回應父母的

  愛，不是曾經叛逆過所以在最後才懂得父母的愛，而是因為早就知道父母付出的太多，才

  更加的想用行動來回報這份愛，當愛終於在某一刻交會，於是奇蹟就會發生。



  《我和我的殭屍女兒》厲害的是，即使觀眾幾乎可以預期整部電影的走向，也能預測到電

  影的最後肯定會上演一場催淚戲碼，但電影依然可以出人預料的好看。《我和我的殭屍女

  兒》讓我想起漫畫《鬼滅之刃》，炭治郎為了尋找能讓變成鬼的妹妹彌豆子變回人類的方

  法，從而拿起刀加入鬼殺隊，踏上漫長的斬鬼之旅。正桓為了變成殭屍的女兒，為了不讓

  她被人發現並且通報槍殺，將她帶回到故鄉藏在母親家裡，利用他過去訓練動物的經驗訓

  練秀雅維持著人性的同時，一邊尋找與等待能治療秀雅的解藥。而雖然正桓在故鄉不會遭

  到鬼的追殺，不必與無慘決一死戰，卻得面臨著內憂與外患，不僅得時刻警戒不讓秀雅被

  人發現，也得想辦法不讓痛恨殭屍、靠著檢舉與獵殺殭屍獲得政府表揚，有著高敏銳度的

  初戀情人妍花察覺異狀，與此同時又想帶著秀雅到充滿回憶的地方，試圖刺激她的記憶好

  喚回她的人性...


  不同於曹政奭上部作品《變身機長》由他自己負責搞笑，在《我和我的殭屍女兒》中每個

  角色幾乎都貢獻了至少一個的笑點與橋段，從最早正桓與秀雅為了從滿街殭屍群中逃出生

  天，異想天開扮演起殭屍跟著亂竄，到中間回到故鄉遇到的東培與奶奶都渾身是戲，特別

  是奶奶拿起不求人教訓秀雅的模樣，還有她在里民大會上對嘴表演2NE1的經典歌曲，而到

  了後段當正桓害怕秀雅遭到拆穿於是不得不將秀雅送到妍花任教的學校上課時，遇到的三

  個學生同樣也讓人印象深刻。當然不得不提的就是整部電影無時無刻都在搶鏡頭的橘貓咪

  嗚，光是像個老頭呆坐在某處，或者幾個眨眼的動作，都使人忍不住嘴角上揚。《我和我

  的殭屍女兒》不會讓人感到刻意造作，每個角色不論怎麼組合都能碰撞出很好的化學反應

  ，是相當成功的選角與表演。



  《我和我的殭屍女兒》是部揉合多種類型與風格的作品，在沒看過原著漫畫無從比較的情

  況下，我會認為導演畢鑑盛將這些類型與風格平衡的非常好，喜劇皮、親情骨，還有些許

  的喪屍血，建構整部電影的比例拿捏剛剛好。而角色方面，除了我前面提到過的，妍花與

  秀雅父母戲份偏少較為可惜外，其他登場角色從主角到配角都立體鮮明，各有各的特色與

  記憶點，若是想到這是漫畫改編的作品，能在兩個小時不到的篇幅讓觀眾記住他們，也是

  刻畫的相當成功。《我和我的殭屍女兒》是會讓我想在看完電影後回頭去找漫畫來看的，

  這是我覺得漫畫改編電影必須達成的目標，讓沒看過原著的觀眾會產生對原著的好奇心，

  會想知道原著跟改編差在了哪裡，又或者省略了哪些部分等等。


  至於電影的小瑕疵是，到了結局正桓為救秀雅中彈，而最後理所當然的他沒有死，醫院更

  從他身上發現了能夠中和喪屍病毒的血液，秀雅也因此成功變回人類，據醫院解釋或許是

  正桓過去在訓練秀雅時在被咬與治療的反覆過程中意外產生抗體，所以才讓他最後即使被

  秀雅咬也沒有變成殭屍。不過我會想，那為什麼在產生抗體之前正桓沒有在被咬了之後變

  成殭屍？鏡頭有拍到他的手臂上確實有滲血的咬痕，而正桓也僅是拿類似優典的藥水在上

  面擦了擦，不可能因為這樣就沒有變成殭屍，所以其實我不太理解為什麼正桓沒有早在海

  邊訓練時就病發？如果最後是得知正桓本身就具有某種抗體能夠抑制或者中和病毒是不是

  也比較好？「在受傷與治療的反覆過程中得到抗體」的這件事與前面觀眾看到「一旦被咬

  就會變成殭屍」的情節對照是有點矛盾的。這是我看完電影後唯一的疑問，其他整體來看

  依舊是值得進場放鬆觀賞的喜劇佳作。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --'
