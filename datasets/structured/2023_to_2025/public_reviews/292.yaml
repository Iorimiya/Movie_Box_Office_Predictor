title: '[負雷] 捍衛任務：復仇芭蕾'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  前半部還行 標準復仇-成長路線


  但中後面劇情太崩




  1. 女主根本不強, 常常被控制或是被打暈


  但在人命如草芥的殺手世界中


  就偏偏沒人想殺她


  放任她到處殺人


  後面還被john放過多次 + 偷偷幫忙


  看不到霸氣殺神


  只看到一個被劇情寵的小公主



  2. 描述的邪教(?)組織虎頭頭尾


  一開始講的好像跟主角群一樣強大的勢力


  後面既沒有任何邪教或是集團組織的描述


  就是一個普通的殺手集團窩點


  教徒=村民=穿歐洲超常見的冬裝的路人


  輕輕鬆鬆就被菜鳥殺手女主殺光了


  那前面學院是在忌憚什麼？ 飯店也怕邪教？ 情報屋也不敢說？


  根本就超爛


  要是學院認真派殺手早就把邪教滅了


  是在吹什麼


  而且邪教在殺手世界其實也沒多壞


  就跟黑手黨一樣加入後不能退出 並且子女也要當殺手而已


  在殺手世界根本很正規了



  3. 超偏心的殺神


  補充第一點提到的


  john當時奉命要去清理門風


  結果多次有機會殺女主都沒殺 只是一直要她走


  根本把學院跟邪教的協議當傻子


  邪教讓john進村就是因為協議


  結果john不殺女主我就當作是卡時限的BUG 算了


  但後面john還是主動出手幫女主了


  到底？？？


  要不要面子啊？



  4. 戰鬥太規律


  就一堆準備精良的去找女主打肉搏


  被打死後女主撿武器大開殺戒


  殺到沒武器了


  在等新一波持槍壞人跟她打肉搏


  loop




  唯一看點就是決戰的邪教窩點是旅遊夯地


  可以欣賞一下湖邊小鎮的美景






  --'
