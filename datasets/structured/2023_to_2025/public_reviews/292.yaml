title: '[神雷] 捍衛任務：復仇芭蕾'
content: "雷文防雷資訊頁\n \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n \n\
  \ \n \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n \n \n雷文防雷資訊頁\n\
  \ \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n \n \n \n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n \n \n \n觀影證明：\n\n \n前言：\n小弟先講只看過2所以對系列世界觀不太清楚，不算基哥迷印象就是尼歐再遠一點就是傑克?\n\
  每週能有機會看上一部6折票的電影對小弟這年紀來說已經很大的休閒活動惹。\n \n心得：\n大概看到伊芙違背總監女要出發才發現這是新主角，所以基哥應該片長不到15分鐘吧；\n\
  \ \n女主的成長歷程安排電影分鐘數很合理，太過冗長真的會坐不住，所幸一路上的殺敵，武器\n俐落，爆番茄汁都很棒看到最後基哥講午夜之前才發現電影已經到尾端惹，伊芙身手與形影\n\
  都很美，強大的復仇意志直闖整個覆雪的敵人村莊非常不合理合理的厲害，噴火槍那段影音\n效果好到都興奮到要閃尿，不知真實物理水火對抗真的可以那樣？感覺女總監應該也是想藉\n\
  由伊芙來幹掉總理男，期待下一部希望也在明年端午，看完第一過場沒片尾就閃了。\n \n結語：\n前一陣子才看最終清算，阿湯哥之後應該會像復仇芭蕾的基哥一樣友情客串一下，只是伊森\n\
  還沒有找到新人選而已。\n \n \n \n----\nSent from on my iPhone SE 3\n \n--"
