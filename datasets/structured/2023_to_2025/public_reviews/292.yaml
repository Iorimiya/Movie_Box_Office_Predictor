url: https://www.ptt.cc/bbs/movie/M.1749806650.A.459.html
title: '[好雷] 捍衛任務：復仇芭蕾──值得一看的外傳'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n　《復仇芭蕾》是《捍衛任務》首部外傳，時間落在第三集與第四集之間。身為這系列與武\n\
  俠小說的愛好者，我總覺得這系列很像都市版的武俠小說。在黑暗中掌握光明的組織、自成\n一格的社會體系、殺手之間無需多言的默契，都讓我深深著迷。\n\n　　但隨著續集不斷擴張，設定逐漸堆疊，偶有枝節過多之感。這一點在本集有顯著的改善\n\
  。既延續原有脈絡，卻不過度著墨設定，是一次恰到好處的改變。\n\n　　隨著續集推陳出新，基努李維在動作戲的演出漸顯吃力，即使他依然認真演出，仍難掩\n力不從心之感。近身搏鬥的時間一拉長就容易削弱張力。尤其與第四集中的甄子丹相較，更\n\
  凸顯兩者的差距（甄子丹甚至還年長一歲）。\n\n　　但在這部電影中，我感受到明顯的改善。除了安娜‧德瑪哈斯相對年輕，即使同樣不是\n動作演員出身，卻在螢幕上有不錯的表現。導演對於節奏的安排也流暢得宜，改善前作偶爾\n\
  略顯拖沓的缺點；約翰維克在本集存在感相當強烈，在有限的戲份中凸顯出他人設的立體─\n─邪教領袖親睹約翰維克時脫口而出的「芭芭雅嘎」，無須溢美之詞，透過上揚的嘴角便已\n\
  足夠，一切盡在不言中。\n\n      我認為在台詞設計上，編劇延續這系列一貫的風格，讓我再次聯想到古龍的武俠小說\n，台詞總讓人有種故作神秘，甚至故弄玄虛之感。尤其是本集反派邪教首領的每一句台詞，\n\
  動輒命運與選擇，彷彿高深莫測；但他後面有一個橋段蠻好笑的，當他前一秒還義正詞嚴「\n兩百年來從來沒有人為了權位而逃離」，再聽到約翰維克行蹤不明時，立即轉身離開，讓人\n\
  發笑，也側面描寫約翰維克的強大。\n\n　　電影中有幾個橋段讓我印象很深，第一個是開場不久，伊芙完成任務，驅車離開現場，\n鏡頭隨之拉長，就在我以為她要就此離開，就像無數動作電影一如既往的戲碼時，忽然一台\n\
  車迎面撞上，爆發激烈搏鬥。我覺得這是蠻有趣的設計，出人意料之外又將老梗玩出新意。\n\n　　後面伊芙深入邪教根據地的橋段我也很喜歡，將冰天雪地的山中小鎮營造得很有氛圍感\n\
  ，看到有評論寫到伊芙為何有重武器卻不帶下車，但我想這不能怪她。她初到險地可能只是\n先打探一下，誰知道這些人這麼瘋，見面即交戰就算了，還全民皆兵，實在邪得可以。\n\
  \n　　本部也有設計令人印象深刻的武打橋段，例如手榴彈與門的搭配將敵人炸成漫天血雨、\n冰刀殺人、火焰噴射槍。順帶一提，我真的很喜歡這系列武器店老闆講解武器的橋段，本集\n\
  中維持原有橋段又融入新意，足見用心。\n\n        簡而言之，這是一部值得去戲院看的電影。除了改善前作略顯拖沓的缺點，流暢的\n動作戲碼、恰如其分的氣氛營造，又同時沿襲系列一貫的風格。觀影前對於更換主角的疑慮\n\
  再看完之後煙消雲散，電影沒有因為換了主角而失色，我認為是部不錯的續集。\n\n　　即使好評偏多，但票房似乎不如預期，希望可以有更多一點人去看，我很期待這系列可\n\
  以持續經營下去。\n\n\n\n--\n\n\n真的嗎？太好了！\n希望還能看到下一集\n對，雖然動作慢了很遺憾，但出場的氣勢還是很有魅力\n\n我覺得可能因為比較沒有「教」的部分，所以看起來不夠邪XDDD\n\
  我也覺得這一集沒有說這麼白，適度保持一些神秘感的效果不錯\n有些橋段如火焰噴射器在戲院看起來格外震撼，推薦去戲院看\n感覺只能等候續集來補充了\n在電影院看起來特別震撼\n\
  例如那個收手吧，看到就會心一笑，不然能拍照確認的事情何必真的帶一隻手XDDD\n\n上一集真田廣之跟甄子丹的角色也有一股濃濃的古龍感\n這樣想想拉斯卡羅馬也是很會培養，培養出來的都不簡單，一個菜鳥搭配殺神適時協助，殺\n\
  翻邪教總部\n個人對於動作爽片的編劇比較寬容，我認為他已經做得不錯了"
