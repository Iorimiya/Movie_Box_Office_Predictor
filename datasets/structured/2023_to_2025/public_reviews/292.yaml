url: https://www.ptt.cc/bbs/movie/M.1749236000.A.7B2.html
title: '[普無雷] 復仇芭蕾－年輕的肉體就是讚！'
content: '本片的故事相當簡單，也因此幾乎不會有什麼破綻。


  　（對！我就是在吐槽「致命清算」及「最終清算」！！）


  　並讓我可以用無雷的方式就把感想寫出來。



  　（註：以下文章統一稱呼本片女主角為Eve、本傳男主角為Wick）



  　　　　＊　　　　＊　　　　＊



  　【普遍可以被認為是優點的地方】



  　　這自然是本片所呈現出的各種精彩動作場面，主要又可分為三點。



  　　一、Eve那耐操、耐摔、耐打的青春肉體，可以讓觀眾將本傳第三集、第四集裡


  　　　　Wick那顯見老態及套招的打鬥場面瞬時拋在腦後。在兒時回憶結束後從Eve的


  　　　　訓練過程開始，毫無冷場及停滯的各類打鬥場景絕對會讓觀眾喘不過氣來！



  　　二、對比Wick的武器仍是以槍及刀為主，Eve的戰鬥方式及武器選擇之多樣化，


  　　　　就完全是本傳四集皆遠遠難以企及的高等級表現。


  　　　　（肉搏技兩者皆有，但其在本傳後期反而成為拖累觀戲精采度的禍首。）



  　　三、本傳一開始就灌輸著「殺手就是要攻擊頭來一槍斃命」，之後也一直遵循此項


  　　　　原則在演出，但卻衍生出裝備的肥大化(例如防彈西裝及完全防彈的頭盔)，


  　　　　並導致槍戰過程在本傳後期過於拖延及繁瑣。


  　　　　或許製作團隊有確實認知到此項缺失，所以在本作中完全回歸槍戰的初衷，


  　　　　只要有打到要害就是一擊斃命，實為簡單俐落又清爽無比！



  　　　　＊　　　　＊　　　　＊



  　【本人主觀上認為最大優點的地方】



  　　製作團隊在編排動作場面時並沒有女權主義上身而認為，Eve在肉搏打鬥上可以


  　　輕鬆打倒那些身材比她壯碩好幾倍的男性對手。事實上Eve在本片中與男性對手的


  　　肉搏打鬥場面中絕大部分居於劣勢，但Eve利用自身的敏捷度及善用各種現地取得的


  　　武器，最終仍是能擊倒對手。


  　　這正好也能與前段的第二點相呼應～～



  　　　　＊　　　　＊　　　　＊



  　【可能是雷聲大雨點小的地方】



  　　坦白說已經活到快過半百的我，用腳趾頭也能輕易算出所謂本傳及外傳(本片)的


  　　兩位主角絕對不可能真的在本片中打得你死我活。


  　　（雖然「推倒」場面當然是有啦～XDD）


  　　但若真的有如此期待的板友存在，就容我用這段告白來澆熄你們的妄想吧～～　:p



  　　　　＊　　　　＊　　　　＊



  　【或許可以被認為是缺點的地方　－　一般觀眾之角度】



  　　我整理出三點，前兩點都跟反派的塑造有關。



  　　一、對於本片的反派頭子，我不會要求需統率與武力兼具而與本傳第一集的媲美，


  　　　　也不會要求需邪惡力場超強而跟MI第三集的爭鋒。但事實上本片反派頭子不僅


  　　　　毫無戰鬥能力，其邪惡力場亦遠遜於本傳四集的各該角色！看著Eve為這種貨色


  　　　　費盡千辛萬苦送出便當，我也很想跟當下的Eve一樣笑著流淚呀～～　><



  　　二、缺少大致上能與主角從頭抗衡到尾的反派「主將」。由於本傳四集皆有這類


  　　　　角色(第一集是由頭子兼差)，觀眾應該反應都還不錯，所以發現本片沒有時


  　　　　確實會有些失落。



  　　三、有青春肉體固然很爽，但若搞成『阿嬤～～妳怎麼都沒有感覺?!』那就有些


  　　　　過頭了。


  　　　　Eve在本片中固然沒受到大傷，但至少有受到足以大量削減行動力的傷勢。


  　　　　但我印象中Eve僅有一次拿火烤刀子消毒傷口，其之前及之後Eve的行動都如同


  　　　　沒有傷一樣。　:p


  　　　　對比Wick在本傳的演出中，一直是明顯呈現出係處在有傷的情況下實為


  　　　　大相逕庭。兩者究竟孰優孰劣，我也尚未得出一個確定的答案。



  　　　　＊　　　　＊　　　　＊



  　【或許可以被認為是缺點的地方　－　紳士之角度】



  　　看過飾演Eve之Ana de Armas在各類社群媒體上之性感照片的紳士們，諸位真的


  　　是要失望了！


  　　Eve在本片中完全是包得緊緊的，冷艷魅力或許還是感受得到，但性感裸露及


  　　那兩顆咪咪就完全不用肖想了！！　orz



  　　　　＊　　　　＊　　　　＊



  　【本人主觀上認為最大缺點的地方】



  　　其實是接續著前前段的第二點。有位自故事三分之一處出現的女性角色，其顯然


  　　可以成為與Eve長期對抗的反派主將等級強者，到後半段卻被強加一些設定後


  　　被光明正大地河蟹掉！


  　　因為會洩漏劇情所以這裡不能明講，總之我認為此點是本片劇情上的最大敗筆～～



  　　　　＊　　　　＊　　　　＊



  　【總結‧期許】



  　　對於本傳四集大致上都算支持的人而言，除非你是某些信仰或主義的堅定信奉者，


  　　否則這所謂外傳實在是沒有不進戲院支持的道理吧～～　orz


  　　在所謂的『John Wick』宇宙或世界觀裡，本片靠著本文前面所述優點的部分，


  　　開創出與本傳同中有異的另一風格。若票房能有亮眼表現，本人或可斷定本片


  　　將不再是所謂外傳，而會是『John Wick』宇宙或世界觀裡兩條主線的另一條，


  　　發展潛力無窮！


  　　但亦有明顯隱憂，也就是所謂「不進則退」。本片在沒什麼包袱下呈現了大量精彩


  　　場面，卻又搞出如同本傳第二集的結尾，代表復仇芭蕾不再是為自己而跳，就像是


  　　穿上了跳到至死方休的詛咒舞鞋般。


  　　只拍一集見好就收應該是不可能，但復仇芭蕾的戲碼若只是再跳一次本傳第三集、


  　　第四集之舞步的話，那麼這新生IP絕對只有夭折的份。




  　　以上



  --



  --'
