url: https://www.ptt.cc/bbs/movie/M.1749290379.A.9AF.html
title: '[大負雷] 捍衛任務 復仇芭蕾 滿滿的不合理'
content: '我看板上清一色好評

  決定分享一下剛剛看完的感想

  來逆風一下



  雷文防雷資訊頁



  防雷

  防雷

  防雷

  防雷



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  劇情畫面不合理的地方太多了


  我知道這一系列沒人在乎劇情

  但我希望的是還是可以稍微符合邏輯

  有一說一打鬥部分福利還是滿滿


  一開始女主在書架後面已經叫出聲了

  反派也朝著聲音走去 目標是女主

  但為什麼女主還是可以在危機時刻慢慢走出去撿槍 射壞人 再慢慢走回去密道？

  是不是其他人全部被鬼遮眼了

  很莫名其妙 然後父女就攙扶走掉了

  滿頭問號 敵人去吃便當了嗎？？？？？


  再來最後女主前往小鎮大對決的時候

  我已經不知道該從哪邊開始吐槽了

  不合理的事情連發 很出戲


  女主被抓的時候是怎樣可以在反派出去講話的時候 馬上掙脫 然後開槍反擊？？？？

  完全沒有畫面 怎麼辦到的？？？？

  有內鬼停止交易


  然後反派告訴姊姊女主是她妹妹之後

  姊妹談話間 姊姊還想說服妹妹反派是好人

  結果反派直接下個決定通通殺掉

  哈囉？ 她是你的人 你不相信她的速度嚴重超速了 嗶嗶嗶靠邊停


  還有那個白痴小鎮天眼也不知道是三小

  一堆望遠鏡只有一個人在看 一雙眼睛 有個屁用

  還不如直接給他望遠鏡

  看不同角度還要換望遠鏡 幹我直接吐血

  然後說現在追丟了 我毫不意外


  再來女主要怎麼被基哥虐一虐之後 突然走進別人軍火庫裡面

  欸 那是整個小鎮的軍火庫耶 軍火庫 軍火庫！！！

  是有那麼好走到的嗎？

  還是外面有個告示牌寫 軍火庫 ->


  然後軍火庫也太隨便了吧

  我阿嬤的抽屜都比較牢固

  這麼重要的東西完全沒上鎖 讓女主直接走進去全拿是怎樣

  在玩吃雞嗎 什麼武器大禮包


  還有明明看到壞人也拿噴火槍 為什麼要硬去拿消防栓硬幹 畫面雖然好看 真的很不合理

  在那邊冰與火之歌 直接走掉不好嗎 不怕沒水嗎 還搞到自己被基哥救場 好弱智


  最後反派幹嘛自己跳出來說一下雞巴話 就跑就對了 還特地叫司機轉彎去遇女主 他不知

  道女主他的仇恨值是滿的嗎？？？？

  他一下車開始講話時我就一臉三小

  反派想自殺要說 不用這招耶


  最後面不合理的地方實在是太密集了 三不五時就突然衝出螢幕賞我幾拳

  我很喜歡看爽片 不用動腦很舒服

  但這已經不是有沒有動腦的問題了

  是有沒有腦子的問題


  總之這次看起來有點失望

  希望他們下次寫劇本的時候可以加一點大腦進去

  而且大多失智集中在最終決戰內 所以讓我整體評價更低了


  （手機不好排版 傷眼抱歉）



  --'
