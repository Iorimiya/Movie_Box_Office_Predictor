title: '[好雷] 捍衛任務:復仇芭蕾'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n\n\n\n\n\n        從捍衛任務四的時候我就有種我在玩遊戲的既視感，尤其是龍息彈那段的運鏡。\n而到了這一部，我覺得整體的感覺更加強烈，某些片段給了我一種黑相集的錯覺，換地圖的時候也像是30等的玩家誤入了50等的野外地區，好死不死還會主動鎖敵跟喊支援。本作的打戲對我而言比雷霆特攻隊更加流暢，得益於奇奇莫拉的戰鬥流派迥異於芭芭Yeah嘎，至少對我而言不存在審美疲勞，甚至在過程中有種按QTE看終結特效的快感。\n\
  \n\n        這部裡面也有很多淺顯但是會讓人會心一笑的雙關，像是預告裡面就出現的關於伊甸園還有伊芙的關係，剩下的留給各位自行發掘。\n\n     \
  \   Yeah師傅的戲份我個人也相當滿意，既沒有搶了女主角的風頭又足夠吸引系列作粉絲的眼球。而延續前面關於遊戲的比喻的話，Yeah師傅在這部裡面各種意義上都是來炸魚的，可以看出他甚至對女主角放了一整片的太平洋。至於Yeah師傅出現的因跟果，坦白說，他是文字遊戲的一把好手。\n\
  \n        作為一部爽片跟捍衛任務宇宙的續作，我願意給這一部非常高的分數，它簡潔明瞭的為它的受眾在不需要思考太多的情況下提供了需要的一切要素：戰鬥，爽。\n\
  \n--"
