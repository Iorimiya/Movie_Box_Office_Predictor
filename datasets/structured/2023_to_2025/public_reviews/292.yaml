url: https://www.ptt.cc/bbs/movie/M.1749566668.A.11A.html
title: '[新聞]諾曼李杜斯回歸捍衛任務：復仇芭蕾》續集!'
content: '諾曼李杜斯將回歸《捍衛任務：復仇芭蕾》續集、有更多戲份等著他！導演預告下集反派

  驚人真面目


  （內文涉及劇透，請慎讀）



















  《捍衛任務》（John Wick）系列首部外傳電影《捍衛任務：復仇芭蕾》


  （From the World of John Wick：Ballerina）上周末起已於各國


  陸續上映，該片除了女主角安娜德阿瑪絲（Ana de Armas）備受討論之外，


  配角群也同樣受矚目，例如本集首次加入該系列的諾曼李杜斯（Norman Reedus）。


  李杜斯在片中的戲份其實不多，直到約莫中段才出場，而出場沒多久


  就因為重傷送醫，一路躺到結局才清醒。但導演-藍魏斯曼


  （Len Wiseman）表示，假如還會出續集的話，李杜斯在這系列的戲份不會只有這麼少。



  魏斯曼預告：「我選擇諾曼李杜斯（來演這角色）是因為我對他還有其它


  計劃，我很想看到他以某種方式回歸，就好像他是來還欠伊芙的債一樣。」


  魏斯曼指的債，是德阿瑪絲飾演的「伊芙」有答應李杜斯飾演的「丹尼爾」


  要保護她女兒，不被自己曾經加入過的邪教組織給挾持，而伊芙最終也


  確實信守了承諾，所以丹尼爾未來可能會報答這份恩情。魏斯曼也透露，


  他也會想在續集裡進一步探索丹尼爾和邪教的關係，以及他和女兒的感情。



  在接受《娛樂週刊》（EW）採訪時，魏斯曼還提到，他原本有想讓伊芙


  的母親登場：「我曾在劇本裡寫過她和母親見面的戲，但我們沒能拍出


  來。我們本來可能會拍這場戲的，但我們總是會聽到一些說法，說她母


  親已經去世了。但在這個世界觀，你永遠不知道誰真的死透了。


  劇本裡本來有一個設定，是伊芙最後被懸賞，但我們不見得會知道是


  誰要懸賞她。如果這條線索往下延伸的話，也許就是她自己的母


  親在懸賞她，那樣的話就有好戲看了。」


  魏斯曼表示，他真的很想讓伊芙見到原本以為已經死去的母親，


  而她的母親也必定會回到邪教村莊，並看見村莊被摧毀，


  看見自己的女兒被殺掉（伊芙的姊姊）。


  魏斯曼最後暗示，這些事件的後果將可能會以多種不同形式發生。





  --'
