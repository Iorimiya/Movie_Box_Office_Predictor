url: https://www.ptt.cc/bbs/movie/M.1749382550.A.372.html
title: '[好雷] 捍衛任務：復仇芭蕾 有維持系列水準(雷)'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  本來有點擔心會不會是狗尾續貂，蹭IP熱度，看完後非常滿意。


  喜歡前面幾部的非常推薦，延續了地下世界迷人的世界觀，還看到許多系列老朋友。(RIP

  沙隆接待員)


  伊芙過去戲份比我想的要長，這點不錯，不過我以為最終考驗對面會是成績優秀的同窗。



  本片主題在開頭不久就點明了：選擇及跳脫命運，老爸、伊芙、約翰都有著墨此點。



  伊芙的打鬥看得出來刻意設計得比約翰弱，好的意義上的不成熟，第一場任務就被打得蠻

  慘的，兩個月後的任務也是想瀟灑離開被倒打一把，有做出區別。



  訓練時就有提到，因為力量弱，所以更要不擇手段。也因為經歷和年紀較不成熟，跟約翰

  比起來，少了些俐落動作，多了些狠勁。我完全能想像肉搏時伊芙張嘴咬對方，但約翰就

  不會。



  片中的動作戲也是花招豐富，加上適度的幽默。溜冰鞋冰刀、闊刀地雷、火焰噴射器、手

  槍＋菜刀。武器店那段彷彿進入遊戲「本關玩家只能使用手榴彈」，餐廳互砸盤子有種情

  侶沙灘戲水的荒謬感。



  伊芙面對約翰時，像是大學長在開導學妹一樣，完全闡釋什麼叫高等玩家遇上滿等玩家，


  而約翰完全輾壓又不下死手，為了不讓她撐到午夜還出手相助。



  既然是動作片當然不免還是有「動作片邏輯」存在，但處理得不錯，小兵輪流被幹掉也


  沒有「該我去被打倒了」的明顯套招感。


  只有背部中刀一聲慘叫結果只是劃破衣服，還有火焰噴射器有好幾段應該燒到頭髮了吧，


  這兩段稍微有點出戲XD。


  --'
