title: '[好雷] 《捍衛任務：復仇芭蕾》值得看的動作爽片'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  圖文重點標示好讀版↓




  不知不覺我已經超過一年以上沒進電影院，而《捍衛任務：復仇芭蕾》是我回歸電影院的

  第一部片，先說結論，很好看的動作爽片！

  《捍衛任務：復仇芭蕾》的故事背景是設定在《捍衛任務3：全面開戰》及《捍衛任務4》

  之間，劇情講述女主角為了復仇，隻身來到敵方大本營（一整個城鎮都是敵人），之後順

  利復仇成功。

  在劇情的銜接上，我認為只要先看過《捍衛任務3：全面開戰》就可以，因為《捍衛任務

  ：復仇芭蕾》女主角所屬的組織是《捍衛任務3：全面開戰》才出現的，因此跟該集關聯

  性較大。

  但如果完全沒看過《捍衛任務》系列也沒關係，以觀賞動作爽片的心態來看《捍衛任務：

  復仇芭蕾》，也是非常精彩，個人覺得光欣賞女主角的顏值就值回票價了！


  --

  我的FB專頁「阿培嘎嘎嘎」，歡迎大家按讚追蹤！



  更多電影分享文章歡迎來我的部落格逛逛↓



  --'
