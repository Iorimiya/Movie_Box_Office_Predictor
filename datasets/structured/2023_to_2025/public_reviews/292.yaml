url: https://www.ptt.cc/bbs/movie/M.1749370498.A.456.html
title: '[好雷] 捍衛任務-復仇芭蕾'
content: '有雷注意





  作為《捍衛任務》的腦粉，評價可能稍顯誇張，請見諒。

  這集動作場面超爽，多樣化的武器和拳拳到肉的打擊感讓人嗨爆

  女主角因為與基哥同個組織出來的，肉搏戰的打法都是以投摔絞技為主，但兩人的打法有做

  出差異，這點細節處理得很棒，最喜歡的是溜冰鞋的部分，耍的有夠流暢，超帥！

  不過，噴火器對射的段落感覺略顯冗長，若能稍作精簡會更好

  而我們John Wick的傳說依舊，邪教手下一聽到他的名字都嚇壞了，甚至老大一開始還嘴硬

  不跑，一聽說john 可能會來殺他了，馬上乖乖放棄尊嚴逃跑，真的是有夠好笑


  另外感覺整部打起來最強的是第一次任務的那個亞洲男，力氣超大，一踢女主角就飛超遠，

  還很帥，有人知道他是誰嗎？


  而片尾曲依舊維持著高品質，超級好聽

  總體而言，這是一部超棒的娛樂片，捍衛任務粉必看！


  --

  廢文等級：LV.27

  廢文稱號：廢文學徒


  ……廢文難產中……

  ……請稍候……


  --



  真的假的，可能一直有換造型，都沒發現

  感謝，查了一下原來之前有上過RM，難怪覺得眼熟'
