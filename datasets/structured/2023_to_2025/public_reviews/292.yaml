title: '[好雷] 捍衛任務: 復仇芭蕾 這才是爽片該有的樣子'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  先防雷一下


  免得有人誤觸













  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  今天去看了DC特別場,

  只能說這才是爽片該有的形狀!

  好萊塢爽片如果都有這種等級的話還怕電影院沒人嗎?


  之前看<生死交戰>的時候就對安娜的打戲感到驚豔,

  這次多了幾分滄桑但是打起來更爽了XD


  故事從Eve小時候親眼目睹父親死亡開始,

  抓著天鵝湖舞者音樂盒的她一步一步成為專業殺手,

  以及最後復仇的故事.


  沒有什麼很複雜的故事與人物設定,

  但是劇情流暢,

  有把故事好好說完,

  劇本在世界觀裡面的邏輯也都說得通沒吃書.


  結局救回了母女也算是稍微彌補當年父親死在面前的遺憾了吧.

  鄰兵(?)退訓之後成為了真正的芭蕾舞者(Ballerina),

  而女主角卻步上成為殺手的命運,

  也算是某種程度的宿命論吧...



  動作場景呈現得很不錯,

  個人最喜歡炸彈超人那段,

  敵人大部隊爬上閣樓先賞你一箱手榴彈,

  尾行來密室我就塞個手榴彈然後蓋個防爆門,

  下一個來我照樣塞個手榴彈然後防爆門換邊再爽炸一個,

  還有把雜魚吊起來用手榴彈公開炸掉之類的,

  無愧JW系列最強手榴彈專家名號(笑


  摔盤子那段也很好笑,

  果然沒事不能惹怒廚子,

  還好不在船上(笑

  然後那飛斧甩得真順XD


  而就像4的龍息彈,

  這次也有特殊武器:火焰噴射器

  雖然沒有那個XCOM視角,

  不過隧道內用這就對了!

  最後用上消防水線也是很有創意.


  雖然主角是Eve,

  不過最強殺神也沒有被降級,

  要不是這次殺神各種放水,

  主角早就死十幾次了XD

  沒有太誇張的主角威能或是吃書給個讚.


  殺神出場不多,

  沒有讓整部片失焦,

  不過還是有那種業界最強的存在感.

  像是雜魚有說:

  "欸對方是巴巴耶嘎耶 打起來簡直是自殺"

  然後就被秒了(笑

  那段屠光雜魚我是覺得比4的滾樓梯或是雙節棍好多了.

  而且殺神一副"走開 你們不要來妨礙我放水啊!"的表情XD

  基哥膝蓋不行就讓他像這樣用槍好好帥一把不也挺好的嗎?


  結局反派一如往常開始廢話套路,

  不過因為這是JW系列,

  當然是不給你講完直接爆頭啊!

  誰還聽你廢話XD

  我喜歡這個橋段w


  還有一些很好笑的雙關:


  Take your "HAND"


  Will you allow me to be FRANK?


  總之這部節奏掌握不錯,

  動作流暢 看起來很爽,

  值得進電影院看!


  而且個人覺得流暢度比4好,

  至少沒有那個滾不完的樓梯跟繞不完的凱旋門XD


  --

  隔著螢幕都覺得有香味飄出來了XD

  確實啦 只是真的滾太久了 一直滾一直滾

  真的 法國人開車也太規矩了 跟我認知的不一樣XD

  真的是手榴彈大師 從沒想過拔辣能炸得這麼stylish

  那段被車撞我笑了 很有JW系列的幽默XD'
