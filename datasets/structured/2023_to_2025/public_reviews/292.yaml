title: '[好雷] 捍衛任務：復仇芭蕾 所以要芭蕾幹嘛?'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看完整部片，我還是不知道這部片為甚麼要放芭蕾，結果女主跳芭蕾跳到腳趾甲

  斷掉，和後面的刺客訓練也沒有任何關係啊?更扯的是芭蕾舞者和女刺客似乎沒有

  任何區別，難道就不能藝術部門成立一個，舞蹈部門成立一個嗎?雖然計較這個很

  無聊，不過畢竟是標題，還是希望看到什麼芭蕾格鬥之類的，結果沒有


  整體來說還是遜於本傳四集，文戲寫的不夠好，女主姊妹莫名其妙就下戲了，嚴重

  懷疑補拍就是這裡，然後武戲最大的問題就是音效太大聲

  像是阿湯哥的不可能8飛機那邊就幾乎沒有音效，可以說音效在動作戲佔有舉足輕重

  的地位(諾蘭表示:看完幹嘛?)


  另外本片血腥大概是因為女刺客殺人一定要抄傢伙才能打贏男保鑣，第一場戲那群亞洲男

  保鑣居然連這麼基本的武學常識都沒有，真當自己是在拍港片，人人空手奪白刃啊?

  哀呀抱歉本傳查德導演就是駭客任務替身團隊出身的，和香港武術指導也算認識

  ，不知道是不是在偷臭XD!

  水火對決那裏應該是導演看到RRR想到來個對決


  然後幫邪教教主QQ，說什麼千年老教怎麼可能被一個女子滅掉，結果打電話給對面老闆

  老闆派巴巴Yeah嘎居然中途跳槽到女主這邊，然後邪教北七也蠻多的，居然有人連

  巴巴yeah嘎是誰都不知道，然後就被一槍暴頭了，排這種傻逼隊友給我怎麼贏?

  被玩到死運營到死


  基哥和女主對打那邊還是一直想到基哥被安娜埋進土裡那個梗圖


  --'
