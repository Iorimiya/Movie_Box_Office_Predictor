url: https://www.ptt.cc/bbs/movie/M.1750692433.A.8E4.html
title: '[好雷] 捍衛任務：復仇芭蕾'
content: '有雷















  剛看完 覺得是合格的爽片

  一貫莫名其妙卻有趣的世界觀 感覺身邊每個人都是殺手XD


  戰鬥部分滿爽的 尤其是武器店的手榴彈戰跟噴火槍 用手榴彈近戰真的是少見捏 念在你有

  創意 夠噱頭 就不管為什麼隔張桌子不會被炸飛了


  噴火槍的部分也很爽 根本RPG撿到神器的概念 最好笑的是噴三次火補槍 肉香都要溢出來了


  這部很像我在玩惡靈古堡4 隻身對付整個村莊的邪教 主角機體已經夠強了 後面還來個更強

  的Eda Wang(基哥) 就問怎麼輸！？


  其他還有怒火中的武士刀 互砸盤子看誰先撿到槍 背一袋武器在身上一轉場變空手等等 都

  蠻令人印象深刻的 尤其是Ana超正 我本來就是因為喜歡她進場的 雖然造型還是沒007時那

  麼驚艷 但臉長得可愛就是正義！真的看不出她快40了捏


  當然這部還是有很大的硬傷 那就是劇情 其中最詭異的轉折就是伊芙的姐姐 都多久沒見面

  了 整天待在這種洗腦邪教地竟然還能瞬間就產生感情?!


  邪教頭子也是 姐妹講幾句話怎麼了 難道不能是姐姐在用緩兵之計嗎 急吼吼的要把兩人一

  起炸死是怎樣？這樣還能叫family?


  總之扣掉劇情算好看啦 基哥戲份比我想像中多 而且全面壓制局 不愧是巴巴雅嘎！



  --'
