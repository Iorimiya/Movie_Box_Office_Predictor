title: '[好雷] 捍衛任務：復仇芭蕾是真正的惡靈古堡電影'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  如果你覺得《捍衛任務》系列越來越過於冗長龐大，那你應該要來看看《捍衛任務：復仇

  芭蕾》，兩個小時的片長不多不少剛剛好。它沒有《捍衛任務》後面幾集那種太刻意想要

  超越以往所有動作電影的野心，就是這種動作爽片該有的樣子。

  .

  如果你覺得《捍衛任務》系列已經把槍戰玩到極致，有點疲乏了，那你應該要來看看《捍

  衛任務：復仇芭蕾》，它的槍戰跟動作間的幽默感依然維持這系列水準，但動作戲的變化

  多了非常多，各種隨手抄來的東西都可以成為殺人利器，猶如血腥版的成龍電影，其中一

  段完全只用手榴彈通關蠻有創意的。而預告也有的、火焰噴射器那段是全片最大高潮，而

  且實際內容比預告豐富非常多，動作設計有新意、畫面超美、還有很中二的場面，光看這

  段也值得。

  .

  如果你覺得《捍衛任務》系列的人物關係越來越複雜囉嗦，那你應該要來看看《捍衛任務

  ：復仇芭蕾》，它做得很好的一點就是沒有假裝自己是什麼很有深度的電影，觀眾不在乎

  的事，它也一律不在乎，它就是那種從A點跑到B點再到C點，然後每個點都會來一段動作

  戲的精美動作片。

  .

  如果你覺得《捍衛任務》系列裡面的約翰維克是個很沒原則的殺手，那你應該要來看看《

  捍衛任務：復仇芭蕾》，看完之後你會發現這個男人變得更沒有原則了。

  .

  如果你覺得好萊塢從來沒拍過一部優秀的《惡靈古堡》電影，那你應該要來看看《捍衛任

  務：復仇芭蕾》，這片是比任何一部《惡靈古堡》電影都還要更稱職的"Resident Evil"

  ，尤其是電玩第四代。

  .

  如果你喜歡《捍衛任務》系列、你喜歡動作片、你喜歡安娜德哈瑪斯，那你應該要來看看

  《捍衛任務：復仇芭蕾》。


  --

  其實我是想嘗試看看新的寫法看看效果怎麼樣，我本來想連續寫更多「如果你覺得《捍衛

  任務》怎麼樣怎麼樣，那你應該要來看看...」這樣的格式，但寫了幾個之後發現我掰不

  下去就放棄了，笑死'
