url: https://www.ptt.cc/bbs/movie/M.1749358209.A.B40.html
title: '[好雷] 捍衛任務-復仇芭蕾 女性接班人還是有好的'
content: '這系列的劇情不是重點 所以大概評論一下


  還是一如既往的制式


  因為要救的女孩跟自己以前處境一樣 所以順便幫忙拯救


  然後千年來的邪教就這樣被一個菜鳥女人給翻了 也太簡單了吧 覺得最後應該要跟john wic

  k一起滅了才能顯得這邪教還是很強的 結果john wick就只是幫忙解圍而已 沒看到跟女主合

  作有點可惜


  打鬥方面我給8/10分


  近年來好萊塢大片的接班人大多都是女性 但無論劇情還是演技還是動作戲方面大多都是差

  評


  但我覺得這部女主演技和打鬥戲都是好的


  劇組可能也知道女生本身力量就遠輸男人 所以讓女主用各式武器去對付男性敵人


  劇組也延續了這系列的各種殺人方法


  第一集的槍 第二集的鉛筆 第三集的騎馬打仗+射飛刀 第四集的馬拉松槍戰+燃燒散彈


  這集則是手榴彈+火焰槍


  還補了一個女性專屬武器-溜冰鞋 甩起來有帥


  沒有讓本身就是菜鳥的女主突然變得力量很大


  這點我給劇組和女主好評


  遺憾的是john wick只秀了幾手打戲和槍戰 雖然還是很精彩 但有點太少（我明白導演不想

  讓基努李維搶戲）另外這段也沒有前作的套招感了 終於啊


  是說現在這時候john wick不是被通緝中嗎？還能被芭蕾舞老闆娘叫去工作喔？看來老闆娘

  手掌真的欠穿欸


  結局來看女主已經變成john wick第二了 通緝的部分 應該還會有續集 諾曼還會出來嗎？他

  的打鬥戲也不錯


  --'
