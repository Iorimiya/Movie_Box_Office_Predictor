title: '[好雷] 捍衛任務：復仇芭蕾'
content: '剛在台中的日日新影城看完了

  結論是精彩,不輸前系列


  既然片名都是復仇了

  那也沒什麼雷可以爆了吧？


  女主角臉蛋看起來超無辜

  但跟父親一樣有殺人天份

  在訓練時被導師說

  要有女人殺人的方法

  (真看不出演員已37歲了

  戲中設定是二三十歲)


  劇情老套但武器新鮮

  有手榴彈

  槍綁刀

  武士刀

  溜冰刀

  還有火焰槍！


  預告也看到她有跟基哥交手

  結局就不爆雷

  應會有第二集

  最後,沒彩蛋不用等了


  演員名單中,基哥排第二名

  若有續集期待他還能上！


  --'
