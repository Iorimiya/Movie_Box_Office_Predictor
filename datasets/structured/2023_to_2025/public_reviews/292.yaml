url: https://www.ptt.cc/bbs/movie/M.1750427829.A.070.html
title: '[好笑雷] 捍衛任務 復仇芭蕾'
content: '因為最近忙爆了，今天總算抽出時間衝去看早場，大概是平日關係整場只有我一人就意外的

  是在沒看過預告片、宣傳海報、相關文章都沒有的情況下入場，只知道這部外傳是女主角（


  結果一看到長大後的女主就笑死，你年輕時可是搞過基哥害基哥社死耶XDD


  女主大殺四方的主角威能看的很爽

  像用手榴彈直接把人炸碎 上次看到這幕是在戰爭片

  沒想到才不只是這樣呢

  後面噴火器跟消防管的水火對決真的快笑死～這是哈利波特的魔法對射吧～用物理創造魔法很有創意


  再來就是山姆大叔出現時一度以為是CG，這造型根本是100%重現死亡擱淺XD


  基哥登場後女主完全弱化，大概是基哥出場費太貴必需三兩下就要被制服，但當下基哥可能想到年輕時和女主和他朋友3P….和浴室那幕（阿斯～），不但沒殺還反過來幫她，順便秀了一下殺神身手～


  最後女主變成懸賞排行榜第三，那第二是誰啊？還要再拍第二的外傳嗎，還是要拍一部第四發現他不是第一要殺了前三名的故事XD


  整部片看的很爽，女主不少對打都是有來有回（除了武士刀那段刻意耍帥表達憤怒），系列角色也有串場，看完對女主和基哥的演出還意猶未盡的話，推薦可以去看”當辣妹來敲門”
  XD



  -----

  Sent from JPTT on my iPhone


  --'
