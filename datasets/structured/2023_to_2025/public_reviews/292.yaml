title: '[極好雷] 捍衛任務：復仇芭蕾'
content: '雷文防雷資訊頁




  防雷

  防雷

  防雷

  防雷

  防雷





  不多說，直接切入正題！



  本片一樣傳承了捍衛任務的靈魂，而且有過之無不及，更多的武器，更多的手段，更多的體

  驗，加上靈活的不停切換攻擊的手段，在打戲方面真的完全超出了我原來的期待。


  自己最驚訝的點是居然有火焰槍，這個被好萊塢拋棄了很久的武器，一開始看著Eve 拿著火

  焰槍還怕拍成像是古早時期的殭屍B級片，但是因為這部作品的攝影、剪輯、動作安排一系

  列都太厲害，看了就是過癮而已！


  上次看到主角是女生，而且那麼精彩，從頭打到尾還有印象的動作電影大概就是追殺比爾了

  ，復仇的主題、加上後來的武士刀，加上暴力美學，大概也是這部電影安排的一點致敬彩蛋

  ？


  另外JohnWick的出場威壓十足，就是只有帥而已，身為老粉，我喜歡他在這部電影裡扮演的

  角色，以及恰到好處的戲份與台詞，但我心裡唯一的OS是這樣任務失敗沒問題嗎，是不是太

  過放水，還是Director下答的指令不是抹殺Eve，而是阻止他呢，如果是的話可能就比較說

  得通。


  最後覺得比較荒謬的是，這部作品好像沒有任何宣傳就悄悄的在台灣上映了，明明四部曲在

  台灣的票房也不差，不知道為什麼會這樣子，是因為撞到太多強檔的關係嗎，真的滿可惜的

  ，總之，這部真的超乎意料的超好看！大推！








  --'
