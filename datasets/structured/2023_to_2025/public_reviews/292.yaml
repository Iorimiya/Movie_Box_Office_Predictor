url: https://www.ptt.cc/bbs/movie/M.1749194461.A.AAF.html
title: '[好無雷] 捍衛任務：復仇芭蕾'
content: '就是女版的捍衛任務！（廢話）



  只是主角換成安娜


  說是外傳 但是基哥也是有在想不到的地方出場



  大概時間設定在本傳第三集某個時間點之後，


  覺得打戲比較不像基哥那樣會有延遲


  而且打好打滿  摔好摔滿


  也有充分利用周邊道具



  然後每集都會出現的元素一樣都有！


  看到飯店經理還活著真是有點點感動


  還穿插了一些英文雙關語冷笑話..


  有些風景很棒。基哥出場的場景很讚



  有的人可能會覺得跟前幾集套路都差不多


  不過我覺得蠻好看的


  就是女主角的造型  跟007比差太多了...


  當然我猜應該是怕頭髮亂甩遮視線


  才會梳那麼貼的中分...


  然後...有送海報


  我拿到基哥的海報 喔耶~~~




  最後...我猜編劇可能有玩過惡靈古堡4



  推薦天氣熱去電影院看一下還不錯






  -----

  Sent from JPTT on my Sony XQ-BC72.


  --'
