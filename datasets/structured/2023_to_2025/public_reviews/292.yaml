url: https://www.ptt.cc/bbs/movie/M.1749236509.A.2FC.html
title: '[好雷]捍衛任務：復仇芭蕾'
content: "雷文防雷資訊頁\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n＊　　＊　　＊　　＊\n\n想提醒還沒進場的板友，\n我打這篇文章的初衷是，\n\
  \n「我擔心這部片沒人看」\n\n所以在被以下內容暴雷之前，\n請先進場看吧，不會浪費錢的。\n\n＊　　＊　　＊　　＊\n\n\n‧前言：\n\n對我個人來說，\n\
  如果要給「爽片」這種類型的電影，\n做個小小的定義的話，\n那我會這樣思考：\n\n「當你看這部電影的時候，能夠自動忽略過程中的任何不完美」\n\n在我來看，\n\
  這或許就是所謂的「爽片」可能該有的長相。\n\n很不幸的，\n今年也同樣上院線看了不少片，\n但那些「不完美」總是這麼的刺眼，\n當銀幕上的巨星和他的跟班們，\n\
  賣力的上天下海（大家都知道這是哪部片），\n你卻總是想著「該換下一幕了吧」，\n對我來說，\n這些都是無法避免的「疲憊的觀影過程」。\n\n但這部《捍衛任務：復仇芭蕾》，\n\
  突然讓我個人又對所謂的「爽片」生出了幾分信心，\n導演剪除了這個殺手系列中，\n越來越明顯的缺陷，\n擺脫了過於龐大臃腫的敘事跟場景，\n也不再嘗試那些無法掌控的事物，\n\
  讓這部電影一個半小時看下來，\n讓人少了幾分不耐，\n反而對這個「殺手世界觀」又再度興味盎然。\n\n\n尤其是搜尋過後才發現，\n本片是由《決戰異世界系列》的導演執導，\n\
  這也讓我對這位導演改觀。\n\n\n\n－－－－－－\n‧所謂的「爽出了該有的爽度」：\n\n\n我想我會給好雷，\n或許就是因為這部電影做到了，\n\n「把爽度拉滿後，其他不論優缺都只是點綴」。\n\
  \n當我看見了女主角一斧把敵人的臉砍爆、\n用手榴彈當項鍊讓對手炸成肉泥、\n踏入一個「男、女、老」全都是敵人的小鎮、\n再腳踏實地的把他們全都花式射殺。\n\n\
  當觀眾如我，被娛樂到的時候，\n還真的不會在意任何的突兀和瑕疵，\n當然，前提是「真的有被爽到」。\n\n\n而真要說的話，\n是的，這部電影真的非常直接。\n\
  \n\n導演帶入世界觀之後，\n接著就是女主角一路殺殺殺殺到底，\n\n\n對，沒了，句點。\n\n\n就是這麼的簡單、暴力、直接，\n完全沒有要跟你囉嗦的意思，\n\
  像是導演終於想起這系列主打的是動作戲，\n不是「馬」也不是「狗」，\n甚至不是鏡頭過於冗長自曝其短的「實戰格鬥」，\n而是經過精心剪輯和設計，\n紮紮實實的動作場景和槍戰。\n\
  \n要舉例的話，\n電影中有一幕我個人相當驚艷：\n-------\n就在女主角看似「犯案完畢」，\n腳踏滿地屍體，\n觀眾以為她準備帥帥的脫離現場，\n這可能只是個讓女主角耍帥的橋段，\n\
  導演卻突然插入了一段令人震撼的攔截戰，\n順便在戰鬥尾聲非常直接的帶出新的故事線索，\n-------\n像這樣整部電影看下來，\n可以很明顯的感受到，\n導演不再重複系列作「既要又要」的缺點，\n\
  導致空有野心無法消化，\n而是轉而專注在「打出帥氣的戰鬥」上，\n劇情變得精簡、節奏更加明快，\n故事和戰鬥之間銜接也變得更加流暢。\n\n\n－－－－－－\n\
  ‧所謂的「在世界觀之下，把故事好好說完」：\n\n\n老實說，\n雖然我前面強調「爽片夠爽」的話其他要素我個人都不在乎，\n但這部《捍衛任務：復仇芭蕾》除了戰鬥場景出色，\n\
  導演也盡可能的在跑故事進度的過程中，\n把事情交代了清楚，\n雖然是採用非常直接快速的方式。\n\n而真要給這部電影劇情講個流水帳的話，\n那我想可以這樣說：\n\
  -------\n女主角少女時期被父親帶離某類似邪教的組織，\n父親遭到追殺後死亡，\n女主角被帶進殺神出身的「拉斯卡·羅馬」，\n並被訓練成類似保鑣的角色，\n\
  女主角的結業式中，\n對手用生命告訴觀眾這一切不是女主角想要的人生，\n女主角從頭到尾想要的，\n只有「復仇、復仇、復仇」，\n很快的、很明顯的，線索到來，\n\
  女主角不鳥「拉斯卡·羅馬」總監的勸阻，\n開始追查父親死亡的真相，\n遇到了我個人相當驚艷的一個角色和他的女兒，\n與女主角背景故事明顯形成對照的父親和女兒，\n\
  進一步的加強了故事主軸，\n接著父女中的女兒被組織捉走，\n女主角經歷數場戰鬥，\n得到殺父組織的線索，\n一路殺進大本營，\n殺得天昏地暗的時候，\n殺神受到「拉斯卡·羅馬」的委託登場阻止女主角，\n\
  兩人展開不對等的戰鬥，\n完全無法被擊敗的殺神心軟，\n選擇給女主角「最後的時間」讓她完成復仇大業，\n女主角很乾脆的殺光了除了小魔王以外的所有小弟，\n幹掉了跟她關係密切的組織首領，\n\
  救回被捉走的小女孩，\n但最後遭到懸賞追殺。\n-------\n\n我想我應該沒有跳過太多劇情吧，\n從這段流水帳來看，\n故事其實描述得頗為完整，\n沒有因為「想趕快繼續殺」，\n\
  而呼嚨觀眾，\n而前面說的這個缺陷我認為在\n《捍衛任務３：全面開戰》裡最為明顯，\n殺神變成了為逃而逃的逃犯，\n加上不流暢的打鬥和要爽不爽的槍戰，\n讓我個人在觀影不久後就「從電影世界觀中被迫回到無趣的現實世界」，\n\
  成為了我個人標記的「不爽的爽片」。\n\n說真的，身為觀眾如我，\n對爽片的劇情要求真的不高，\n再拿「某部片」做對照的話，\n就算所謂的「敵人AI」設計的充滿瑕疵，\n\
  老實說我個人也會當作世界觀的一部分去接受它，\n而事實是，\n觀影過程中，動作戲一但讓人感到無聊，\n那所有的瑕疵都會漸漸地讓人難以容忍。\n\n再回到這部《捍衛任務：復仇芭蕾》，\n\
  導演一開始就在延續系列的世界觀之下，\n擴展了更多組織和角色，\n我個人認為優勢是不需要再對世界觀做解釋，\n觀眾沉浸感更強，\n但缺點是觀眾會拿系列作比較，\n\
  幸好如前面所述，\n這部片場景更加聚焦濃縮，\n敵人也不再出現生魚片二人組\n或是超防彈裝甲部隊這類破壞平衡的角色，\n我方的立場也不再反反覆覆甚至做出破格行為。\n\
  \n我個人認為《捍衛任務系列》的魅力建立在，\n「只要用正確的方式，所有的角色都會死」這件事情上，\n沒錯，我們的殺神基哥很強，\n可以說是系列作的戰力頂點，\n\
  但我想應該不會有觀眾認為基哥是不死之身，\n（當然最後他的確是死了）\n而《復仇芭蕾》的有趣之處在於，\n女主角一路對敵殺殺殺的過程中，\n她大部分時間其實並不處於戰力優勢，\n\
  當「會死的角色」做出「殺不死的行為」，\n並反殺所有可能導致她死亡的阻礙，\n完成復仇大業。\n\n除了讓人看得心情愉悅，\n也可以銜接下面我想講的戰鬥部分。\n\
  \n\n－－－－－－\n‧所謂的「打不太死的敵人、殺不太死的我」：\n\n\n就如前段所述，\n這部片的女主角雖然不弱，\n但絕對稱不上有優勢，\n我們可以看見飾演「伊芙」的安娜德哈瑪斯，\n\
  為了動作場面訓練的相當紮實、\n她的角色在戰鬥中吃了多少苦頭，\n光是她被抓起來摔的次數，\n我想普通人早就生死無數個輪迴，\n但「伊芙」不是普通人，\n她呻吟個兩下就能起來生龍活虎，\n\
  而她的戰鬥方式在我來看就八個字，\n\n「發揮創意、隨機應變」\n\n我記得有一位鄉民大大，\n在看完預告片後批評，\n「伊芙」的戰鬥沒有跟殺神做出區隔，\n\
  認為她只是「女版殺神」，\n並沒有自己的特色。\n\n我個人認為這個說法既對也錯，\n導演很明確的在電影裡說出要讓伊芙「打得像女孩」，\n（印象沒錯的話，這甚至就是片尾曲的其中一句歌詞）\n\
  但除了偶而重擊男人們那兩顆無法鍛鍊的「要害」之外，\n「伊芙」在我來看並沒有真的打得像女孩，\n導演不免俗的替女主角上了各種BUFF，\n讓她稍微有正面對抗之力，\n\
  而不是開場被揍一拳就全劇終。\n\n但伊芙的戰鬥方式，\n跟殺神我認為是有區隔的。\n\n她的戰鬥方式比起殺神更加強調，\n「手邊有什麼我就拿什麼幹爆你」的感覺。\n\
  \n基於力量無法與對手抗衡，\n伊芙對上單一敵人要「捅非常非常多刀」對方才會死，\n多到我都要懷疑對方是不是打了美國隊長血清，\n也因此，\n伊芙的打法更加強調「讓對手慘死」，\n\
  或許是因為只有對手徹底死亡了，\n才不會再對女主角造成生命威脅，\n當然真要吐槽的話，\n女主角看似弱勢但整片看下來\n基本上沒受大傷過，\n這變成了前面所說的，\n\
  \n「看似會死的角色怎麼殺都殺不死」\n\n我想敵人死前應該都覺得非常不公，\n但我想這也是讓整部片爽度上升的其中一個因素吧。\n\n\n－－－－－－\n‧後語：\n\
  \n最後，就如同前言講的，\n我為什麼要打這篇文章，\n原因很簡單，\n\n「我擔心這部片沒人看」\n\n尤其是在聽說影集爆死的情況之下。\n\n就我觀之，\n\
  這部電影絕對不是爛片，\n它可能很無腦、很暴力、很直接，\n但它明確的在為觀眾服務，\n提供了你想到或是沒想到的娛樂，\n我難以理解它爛番茄分數系列最低的原因，\n\
  但如我一開頭所述：\n\n\n「我被爽到了，所以我不在乎」。\n\n\n冗長的打了一大堆，只是想拋磚引玉，\n謝謝各位看完，\n歡迎提供正反意見。\n\n\n\n\
  \n--\n                   窩草泥馬!╮ \n\n  ≡╭...哪位?                \n\n\n\n\n--\n---\n\
  我個人猜想就大概跟《曼達洛人》一樣，\n小孩子是組織延續傳承的根本，\n所以大人死了就死了，小孩絕對不會被亂殺。\n\n---\n就系列劇情上看起來，除非付錢，\n\
  否則高桌會並不負責「調解」各組織勢力，\n整個殺神系列宇宙比較像控制在一個恐怖平衡之中，\n這些組織的背後理念都太血腥太瘋狂了，\n高桌會應該不會想輕易去捅馬蜂窩。\n\
  \n---\n雖然劇情中該組織被稱呼為邪教，\n但我個人來看他們的作為也真的不太像邪教，\n主要是缺少了「教」的部分，\n我覺得比較像是擁槍自重代代傳承的隱世恐怖組織。\n\
  \n---\n可能是美劇的節奏有時候比較拖冗，\n我自覺不是受眾所以比較少關注，有機會再去欣賞它。\n\n---\n是的，我總是不小心打太多字。\n\n---\n\
  要「打得像女孩」是件不容易的事，\n光用想像的就覺得很難設計。"
