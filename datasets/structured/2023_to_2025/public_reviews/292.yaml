url: https://www.ptt.cc/bbs/movie/M.1749139861.A.19E.html
title: '[新聞]《捍衛任務：復仇芭蕾》爛番茄開盤！分數'
content: '《捍衛任務》首部外傳電影《捍衛任務：復仇芭蕾》將會在本


  週正式上映，而本片的首波評價也已經正式解禁。


  根據目前公開的爛番茄評價，這部由安娜德哈瑪斯主演的動作電


  影在 69 則評價之間獲得了 77％ 的好評度，略低於基努李維演


  出的正傳系列四部電影，但依然高於 Peacock 平台上的外傳影集《刺客旅館》。








  《捍衛任務：復仇芭蕾》外傳故事設定於《捍衛任務3》以及《捍


  衛任務 4》之間，由基努李維飾演的約翰維克也已確認將會再次現身，


  但根據這位演員本人的說法，他只在《復仇芭蕾》的片場待了大約


  兩週左右的時間，這意味他在片中並不會有太過吃重的戲份，但仍


  然可以加深本片與系列正傳之間的連結。此外，伊恩麥克夏恩飾演的溫斯頓也在


  這部外傳中登場，不僅如此，本片也將會成為已故演員蘭斯瑞迪克在系列中的最後演出。














  --'
