url: https://www.ptt.cc/bbs/movie/M.1760713395.A.F2B.html
title: '[普雷] 捍衛任務：復仇芭蕾 滿滿ACG梗'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n\n\n\n\n\n\n\n劇情主線是典型的日本拔忍(叛忍)被忍者村追殺，倖存的孩子長大後返村復仇。\n\n橡膠子彈、女生救女生，莉可麗絲直呼內行。\n\n\
  女主進入邪教村莊，四處跑地圖撿武器，跟惡靈古堡電玩系列只差在沒BOW。\n\n沒捲眉毛的香吉士使出惡魔風腳，但違背絕對不踢女人的原則所以沒屁用。\n\n女主撿起火焰發射器在歐洲打起越南大戰，只差沒找台戰車來開。\n\
  \n殺手接任務要消滅目標，但雇主先死了因此任務自動無效，揍敵客家族表示略懂。\n\n最好笑的是大陸酒店的規矩只要懸賞金夠高就沒意義，投宿旅客也不相信保全，\n\n\
  自己在門上設置陷阱比較實際。\n\n這集被穿手擔當是黑人槍店老闆，買槍附車這優惠真殺。\n\n劇情一蹋糊塗，此乃本系列一貫作風，動作場面爽就好。\n\n\n\n\
  \n另外女主用三角絞絞住敵人，反被舉起來重摔那段是不是致敬甄子丹的導火線？\n\n最近才看過導火線的打鬥戲分析，女主剛好就是體重差距太大才無法絞住敵人的例子。\n\
  \n一部片能看到這麼多梗也真是奇葩了。\n\n\n--\n謂鋼彈者，凌厲剛猛，無堅不摧，弱冠前以之與吉翁群雄爭鋒。\n加諸磁膜，一年戰終前所用，誤殺拉拉不祥，悔恨無已，乃棄之阿巴瓦空。\n\
  運機無鋒，大巧不工，八七年持之直撞阿席馬。\n九三年後，不滯於物，盾榴餌翼均可為劍，自此精修，漸進於無劍勝有劍之境。\n                   \
  \                  \n\n--\n                                      10/17 23:06"
