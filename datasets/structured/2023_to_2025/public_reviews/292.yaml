title: '[爽雷] 捍衛任務 復仇芭蕾 爽死～打起來很順'
content: "劇情不用說就是老捍衛任務那一套\n全部的人都會出來露一手\n該爽的點都有爽到\n而且我覺得是系列最佳\n因為這次打起來很順\n而且也很痛\n大多是近戰\n\
  基努哥準度太強 \n都是用槍\n這次的近戰都很有誠意\n打得超爽有一個角色真的超級可有可無\n\n請給學妹露大腿防彈禮服\n\n有一幕開車走人然後又被撞回來真的超帥\n\
  而且帥的不只這個鏡頭而已\n\n努哥跟基努李維\n真的只有客串\n但還是有小露伸手\n\n\n抽到了兩張基努李維\n一張跟隔壁換女主角真的賺\n-----\n\
