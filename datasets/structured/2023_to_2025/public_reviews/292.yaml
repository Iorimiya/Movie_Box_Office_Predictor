url: https://www.ptt.cc/bbs/movie/M.1750008080.A.92C.html
title: '[好雷]捍衛任務-復仇芭蕾 2小時過好快'
content: '雷文防雷資訊頁









  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~










  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  週日下午的時段 整場大約快20個



  流程很簡單:女主角老爸被殺-受訓-出任務-找到線索-殺爆他們復仇


  老爸帥又能打,可惜開場就死了


  不過節奏很緊湊,也不會從頭殺到尾,


  不少黑色幽默的梗在調節節奏,



  像大家都說過的總監對女主說收手吧,英文好像是take off hand?


  邪教部下斷手就這樣擺在桌上被推回去超好笑


  還有商店黑人想說老梗買裝備跑過場,

  結果邪教直接亂入過場動畫,太沒江湖道義了

  女主角這邊用了一堆手榴彈狂炸很有趣


  帶著小孩逃離組織的爸爸這集只小秀一下就輸了,

  希望之後會繼續登場,畢竟演員很有型


  學妹真的蠻菜的,第一個任務對跆拳道軍團不能帶實彈,

  都被壓著打一陣子才能反擊,不過幸好HP夠多

  然後姐姐很帥結果HP超低相認完炸一下就死了,

  你是認妹妹之後太大意的麻美學姊逆?

  不過這也才能堅定女主角復仇的決心,也不會讓姊姊過度背叛


  邪教的小村莊有點好笑,帶小孩的老母,店員,顧客都是殺手

  隨便進個院子的父母也都是高手,

  本傳的雜兵至少一副不良臉,這些邪教徒也太全民皆兵了


  打鬥的設計概念也整個翻新,

  我本來以為冰鞋要給她穿用芭蕾殺人,結果是拳套

  手槍綁短刀也很有趣,火焰槍如果不要用慢動作會好一點

  太亮又有點拖,火對水倒是很有趣


  約翰真的就是來串場顧一下學妹,

  不過邪教主發現約翰行蹤不明馬上烙跑笑死,

  還有那群雜魚:怕啥?約翰維克只有一個人(被秒)

  雖然約翰有起到關鍵作用,不過也沒有過度搶戲,很好


  總體來說大推,希望下一集能繼續保持







  --

  阿烏拉..妳另闢捷徑 將天武殺道...獨沽一味斷頭道!

  人稱.....斷頭天王阿烏拉!!

  但是如今...妳絕不可能勝過我...

  勝過我這99萬9千999匹葬送力量

  以及欣美爾與海塔的....二重地獄戰神!!!!



  --'
