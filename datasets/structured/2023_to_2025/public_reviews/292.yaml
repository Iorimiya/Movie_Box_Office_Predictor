url: https://www.ptt.cc/bbs/movie/M.1760782032.A.99B.html
title: '[普雷] 捍衛任務：復仇芭蕾'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  除了槍械對戰以外其他抄各種傢伙殺人的部分我覺得都設計得還可以。


  但火焰噴射器那邊就很普


  然後原本以為諾曼李杜斯會很猛，結果只出現一下到結尾才又出現....


  身為陰屍路老粉對這部給弩哥安排的劇情我是真的不是很滿意....


  其他的基本上我也一貫抱持著看這一系列的心態：打就完事了，在看的，所以

  並不是很在乎劇情。


  但女主角強度真的就有點普，看到後面約翰維克出手幫學妹，給我一種「唉

  果然還是要第一主角出面撐一下場子」。


  然後壞蛋村莊的設定真的也很莫名其妙，真的感受不出是一個強大的邪教。


  或者說邪教感沒有很重，我還以為雖然是動作片但也至少有什麼打藥啦催眠啦


  這種很難打的小BOSS出現來呈現他們邪教跟一般的殺手集團的差別。


  結果就只是一群讓里昂進去一波開無雙亂殺的NPC，不，我覺得那些被感染的

  村民還比這部這些殺手可怕多了....


  敵人不夠強還有弩哥戲份太少，所以給個普雷。


  --'
