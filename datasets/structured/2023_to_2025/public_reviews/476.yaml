title: '[微負雷] 瞞天過海：八面玲瓏'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~











  之前看板上對這部片評價算蠻低的

  但我看完後覺得沒想像中的差

  先打一下缺點：




  1. 計謀太無聊

  舊版三部曲的計畫雖然談不上什麼大妙計

  但是夠好玩

  女版的計畫感覺就很..不知道怎麼形容...太直接嗎?

  執行起來也太順利了點

  話說那個列表機也太唬爛了吧



  2. 反派刻劃不夠

  在舊三部曲中

  偷錢往往算是順便，整人才是重點

  舊版三個反派(指跟主角對立的一方)  - 安迪嘉西亞、夜狐、艾爾帕西諾(有兩代教父XD)

  都有把他們的機車樣描寫得很好

  最後被整垮時也令觀眾大感痛快


  但新版的反派，害主角入獄的愛情騙子

  沒什麼著墨

  最後也很普通的被整倒

  這邊很無聊



  3.不夠智障

  在舊版片中充滿了智障行為

  每個人也多少有點智障

  連在MCU被大家嫌的要命的唐奇澤在這系列也都很好玩


  但女版每個人好像都算矜持

  也沒什麼性格缺陷設定

  沒有那種男生耍白爛的好玩感覺

  我認為應該拍三八一點會比較好啊




  4.最後找小顏出來也不知道要幹嘛

  這部要主打全女組合的話，就應該做徹底一點啊

  而且小顏還是凱特Brunch去招募的

  她怎麼會認識小顏啊XD



  最後一點，其實嚴格來說不能算缺點

  但把喬治克隆尼寫死也不知道意圖是什麼?

  說是賭氣不找老哥幫忙應該就可以了啊

  雖然好像87%機率是裝死




  再來是亮點

  1.卡司非常堅強，不下男版

  2.安海瑟威那邊轉折蠻有意思的

  3.安海瑟威本身就算是大亮點XD



  總評，不會太難看(我給分算鬆)

  只是可惜了這卡司



  另外我覺得這片女力的成分沒有太濃(宣傳時有沒有強調我忘了)

  比較偏好萊塢劇本荒情況下，沒梗了所以就拍個女版，變化一下


  而且沒有直接把男版硬洗掉

  用外傳的形式出

  這點我是很感激的


  --'
