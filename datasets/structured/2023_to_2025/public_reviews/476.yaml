title: '[影評] 平凡的王牌─評《瞞天過海：十三王牌》'
content: "網誌版：\n\n\n我實在要很不忍心的，給《瞞天過海：十三王牌》(Ocean's Thirteen)一個不怎麼樣\n的評價。\n\n    看得出來在經過第二集用小孩子賴皮式的結局惡搞觀眾一陣之後，《十三王牌》有意\n\
  重新將主軸拉回到神乎其技的超完美計劃。所以片子的劇情將很多元素都抽去了，包括找\n人的過程和做案的理由，都在幾場戲裡就精簡完成。這樣的處理當然相當可喜，我相信大\n\
  多數的觀眾比較期待他們能提出什麼樣天馬行空的想像計劃，還有怎麼樣面對一些節外生\n枝的差錯與麻煩。\n\n    但就計劃的設計上來看，這集實在充滿了缺失。我並不是意指電影必須要給出一個真\n\
  正天衣無縫的、絕對合理的計劃，而是這個計劃必須要能順利的幫助電影某些重要特色的\n發揮。在《瞞天過海》的系列裡，觀眾所在意的當然是看到眾多大牌紅星相互飆戲，還有\n\
  每個角色之間特殊性格的發揮。在過去的兩集裡雖然花了一些時間在介紹角色的出場，但\n作案計劃中都不忘給每一個人關鍵性的作用，也各自符合他們的所長，然而在《十三王牌\n\
  》當中，像顏居然在關鍵的作案時刻只扮演一個豪賭客的角色，與他的特技無涉；負責看\n管地鑽的人似乎也沒什麼重要性與必要性，臨時請個路人甲來客串似乎都可以勝任這種任\n\
  務。看了半天，我很懷疑這樣的計劃為什麼需要我們印象中頂尖的高手全體動員。\n\n    在意外的安排上也無法讓人滿意。這一集的意外多半發生在事前作業的階段，等到進\n\
  入實際犯案的時刻反而一切順利，幾乎如入無人之境。雖然我不否認這群主角們各個神通\n廣大，但是若不讓他們在過程裡吃點小鱉，怎麼能夠挑逗起觀眾緊張的情緒呢？回想過去\n\
  一、二集都有不少讓人摒息的過程：像是第一集裡替顏倒數呼吸時間、看他差點空翻失敗\n的時候，又或者像第二集裡人人都失風被捕的時候。比起來《十三王牌》的難題設計過於\n\
  簡單了，整場看下來平平淡淡，缺少讓人心驚膽戰的情節，也等於缺乏高潮。\n\n    當然本片還是不乏一些笑點，最令人拍案叫絕的莫過於讓麥特戴蒙(Matt Damon)裝上\n\
  鷹勾鼻、梳起油頭，大玩好萊塢某一線男星的模仿秀，惡搞指數直逼第二集裡的茱莉亞羅\n勃茲(Julia Roberts)。除此之外，兩位大牌中的大牌：布萊德彼特(Brad\
  \ Pitt)和喬治克\n隆尼(George Clooney)默契十足的對話，也讓人看得十分過癮。可惜的是，這些元素在前\n二回裡同樣不缺，或許難以再帶給我太多的驚喜感吧！\n\
  \n--\n                                       \n‧ \n\n--\n◆ From: 219.68.140.31"
