url: https://www.ptt.cc/bbs/movie/M.1529122832.A.C71.html
title: '[好微雷] 瞞天過海：八面玲瓏 '
content: '承認個人原非這種類型片的粉絲，

  當初也只進電影院看第一集，

  剩下兩集印象都是片段片段看過


  決定看這片一開始完全是去舔顏值

  真的，有珊卓、凱特、安和美恐女王香蕉姐Sarah Paulson

  不追一下怎麼行~


  結論，過程非常滿足XDD

  但追求刺激 ex.動作爽片、飛車追逐、大型器械使用~

  或是喜歡很燒腦、很有邏輯的劇情片等等

  不需要進電影院，等九月光碟即可


  她們是去Met Gala偷珠寶，

  不是去搶劫十間銀行或是去炸地下金庫，還是去鑽洞洗劫保險櫃


  這些人真的能把任何片演得很棒很有趣


  尤其小安真的是喜劇天才，哈哈哈！

  她的角色真的太可愛太浮誇太肉慾太美麗太有喜感

  怎麼可以每分鐘都在伸舌頭舔嘴唇啦XDDD


  片中很巧妙結合珊卓本人擅長德語，

  從假身份，和撞上前德國超模海蒂克隆時的對話，通通秀了一把


  個人覺得凱特角色"露"，其實才是本片最神秘角色XDD

  設定很用心，出場翻雜誌在看加州公路介紹，後面就跑CA-1度假

  說老實話，她的特殊能力，應該是讓迷妹們在電影院的座位上內心尖叫


  莎拉 正！！！ 習慣她在AHS裡扮相和各種崩潰方式XD

  本片的財迷家庭主婦/幹練犯罪執行者，這種反差萌，真心喜歡


  海倫娜的角色在本片是正常人www

  不過為什麼設定特別強調來自愛爾蘭不是來自英國，這邊有點沒搞懂~

  單純虧美國觀眾愛爾蘭不是英國？？


  蕾哈娜在裡面很俏皮，九號球那種隨興的調調好喜歡


  敏迪的角色和Awkwafina的角色刷交友網，那段小插曲個人很喜歡，

  偷珠寶的空檔還是要好好交朋友，整個生活化。

  兩人穿禮服很漂亮~~~

  最後一個相親約會去，一個變成包租婆


  其他還有很多好玩幽默的橋段，非常切中自己的點

  一刷時很忙碌，要看臉看片找人盯細節，

  二刷比較好，放鬆地找到更多客串人物

  跟達芙妮同桌的人，好像之前在其他劇看過，可是想不起來.....



  非常推薦喜歡這些演員，或是想當紐約觀光客的人

  他們甚至剪輯不少大都會藝術博物館的展品進去XDDD


  除了卡地亞外，本片也很適合當作紐約地鐵的宣傳片


  最後，保證看完本片，大家都會學到一個"法文字"的標準念法

  "Cartier"


  --'
