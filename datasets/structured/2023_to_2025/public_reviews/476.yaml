url: https://www.ptt.cc/bbs/movie/M.1529120521.A.40F.html
title: 'Re: [吵架雷] 瞞天過海8面玲瓏'
content: '嗨 大家好 沒想到這話題被噓到爆 看來版友們的標準真的都不是一般的高

  幾點事情希望跟大家做個討論 當然每個人觀點不同 讓大家參考看看

  先說吵架一定沒好話 後面我老婆罵髒話等等後話就先不談

  我只是想單純就為何起衝突的點來解釋


  大部分版友都覺得進電影院就不該講話 你有講話就輸了 被罵就是活該

  我真的想問大部分人都可以做得到版友們的標準嗎

  我的認知裡 在電影院一大堆人 只要是人就一定有可能會講話 真的是很難免的

  你不可能去強制全影廳的人不能說話吧

  影廳也是倡導請降低音量還不是請勿交談吧

  如果影廳真的明令禁止交談 我覺得它真的稱不了幾個月

  只要是人 就會有變數 你不可能讓所有人都按照你的標準

  尤其這根本不是一個需要極其安靜的場所 電影院是一個大眾娛樂場所阿


  我本身很喜歡看電影 十幾年進電影院看電影也不下百次

  我也在影廳看過有人一直講話被人制止

  如果我真的是會吵到大部分人無法接受的話 我之前的觀影就會有被人制止的經驗了

  但是我發誓我真的從來沒被人制止過 直到昨天


  就我的觀影經驗 我自認為我能做到符合大部分人的觀影標準 都是在可以容忍的範圍

  當然我也是這樣對待別人 只要你不是真的誇張到高談闊論或是講個5~10分鐘沒完

  我都可以接受 大家都是人 一起到公共場所 不就是都互相在容忍嗎?

  但是只要是在大部分人能夠接受的範圍內 大家(連我)不都也是忍過就算了嗎?


  當天我整場電影大概講了5~6句話 一場電影大概120分鐘 平均20幾分鐘講一句話

  而且我跟老婆不是都在討論劇情 只是一些非常稀鬆平常的碎語

  像是「你會口渴嗎? 要不要喝水? 肚子會不會餓? 要不要吃東西?」等等

  難道一般人都不講這些話嗎? 版友們真的都不會講話?一進場就閉嘴?

  更何況如果是緊急狀況非說話不可情況下呢? 像是肚子痛 要去廁所等等

  之後老婆問我劇情一句話 我回一句話 都是非常簡短

  隔壁仁兄可能受不了才開口罵人

  這樣真的是我太吵還是那仁兄的標準太高?


  我想要說的是 我一個符合大部分人標準的觀眾進場看電影 非常不幸的剛好坐在

  一個觀影標準非常高的人旁邊 他要以他個人的高標準來約束坐在他旁邊的每一個人

  我沒辦法做到他就開口罵人 還認為我應該摸摸鼻子吞下去

  因為我只要「講話」 我就不對 請問這樣真的合理嗎?

  版友們遇到這種事也是真的摸摸鼻子吞下去嗎?


  我的認知裡 一個團體裡 少數服從多數 影廳裡 只要符合大眾標準的人都可以進場看電影

  反觀擁有高標準的人完全無法忍受一絲聲音 要大眾去配合他的高標準

  這樣的人又適合去電影院嗎?


  我知道不管我再多講甚麼 可能還是會被噓 我只是想說出我的想法並不是想爭論


  這事情已經破壞了美麗的心情 希望連假能好好修復

  之後也不再回文了 還是謝謝版友的批評指教

  每件事情每個人觀點都不同 就只是看個電影就別太在意了吧

  最後祝大家 端午連假愉快







  --'
