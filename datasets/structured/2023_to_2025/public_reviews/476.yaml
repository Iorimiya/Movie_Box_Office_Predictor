title: '[討論] 女版《瞞天過海》(Ocean''s Eight) 卡司堅強'
content: '（消息參考外電）


  全女性版的新《瞞天過海》電影

  原文片名現為"Ocean''s Eight"（另稱：Ocean''s Ocho）


  兩大奧斯卡影后：珊卓布拉克＆凱特布蘭琪　將共同為領銜主演


  其她人尚有：


  安海瑟薇（新加入，本篇吸睛焦點！）

  海倫娜寶漢卡特

  蕾哈娜（流行歌后）

  敏迪卡靈（The Office情境喜劇女星）

  Awkwafina（亞裔饒舌歌手）


  導演：Gary Ross（飢餓遊戲）

  編劇：Olivia Milch

  監製：Steven Soderbergh


  本片預計十月在紐約開拍


  另　像是最近女版《魔鬼剋星》票房失利的情況　殷鑑不遠

  但華納仍會執行本片計劃　只是預算規模聽說小很多～



  --



  電影夢遊記：一名熱愛電影的人，書寫心得及分享資訊的園地。


  --'
