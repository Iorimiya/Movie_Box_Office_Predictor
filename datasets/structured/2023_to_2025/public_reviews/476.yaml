title: '[吵架雷] 瞞天過海8面玲瓏'
content: '剛剛在板橋大遠百看8面玲瓏


  片尾跑名單時，突然聽到後面有爭吵聲


  「&@#^$#@&$^看個電影你一直在講話@#^&*」


  「不然你去包場啊*#@(&*(!」


  「@#*&$(()_!!」


  原本兩個男森在吵 後來某一方的女伴又加入戰局


  本來想看製作人員名單滾完的，被這麼一吵都沒興致了


  我看電影是可以接受偶爾一兩句小小聲講話沒關係

  不過看這樣子應該是講整場說個沒完吧@3@

  到電影院還是互相尊重一下巴



  啊?觀影心得?

  安海瑟威超正啊 嘻嘻


  --'
