content: "眾星雲集加上大打時尚牌，《瞞天過海：八面玲瓏》相當賞心悅目\n\n\n\n\n開場迅速交代了珊卓布拉克飾演的黛比歐遜，為何入獄以及她那花了五年想出的偷竊計畫\n\
  \n當然她並非為偷而偷，而是要向五年前讓她鋃鐺入獄的男人同樣嘗到被暗算的痛苦\n\n整部戲圍繞著「美人計中計」這一主軸 (騙黛比的男人是《哈比人》的矮人王子~)\n\
  \n而選擇幫助黛比好拿走龐大賞金的快樂夥伴們也各自有特色\n\n\n\n\n凱特布蘭琪所飾演的夜店老闆娘露，穿著大衛鮑伊風格的絲絨、豹紋西裝，是團隊中最理\n\n\
  性也最帥氣的角色，不過礙於其他角色戲份瓜分，凱特戲裡的比重並不如想像中來得多\n\n相對黛比的衝動，露這個角色則具有緩衝的作用，可能因為霸氣十足，兩人對戲時會有種\n\
  \n感覺凱特似乎隨時會有吻向珊卓的衝動XD (下一集若找來魯妮參戰更棒~)\n\n\n至於另外六位女星，最討喜的角色非屬安海瑟薇、莎拉寶森和海倫娜寶漢卡特，其中又屬\n\
  \n\n\n安海瑟薇所飾演的假面甜心達芙妮最讓人印象深刻\n\n畢竟大家都知道這位奧斯卡得主在得獎後，等著她的不是滿滿片約，而是排山倒海而來的\n\n負面評價，她能夠接演台上甜心、台下Bitch的角色，著實讓人有「诶~在演自己」的錯覺\n\
  \n誇張卻又不太過的喜劇演出，加上一堆超自戀台詞，應該會讓大家憶起以喜劇成名的小安\n\n\n 訪問中有說是珊卓打給她邀約演出XD\n\n\n\n\n\n而香蕉姊莎拉寶森，雖然沒能延續《Carol》和凱特有太多對手戲，但做為劇中穿針引線\n\
  \n的角色，她應當是戲裡最貼近時尚的角色了，畢竟也真的跑去VOGUE辦公室裡和時尚惡魔\n\nAnna Wintour對戲(不過本人疑似笑場)\n\n小遺憾的是若能請到艾蜜莉布朗客串萬年助理艾蜜莉應該會蠻有趣的\n\
  \n\n\n\n「萬年蕭婆」海倫娜寶漢卡特這次同樣神經質，只不過是瀕臨崩潰邊緣的那種\n\n這個以設計師Vivienne Westwood為角色靈感參考的過氣設計師蘿絲\n\
  \n海倫娜把她詮釋的相當可愛，又有點瘋癲\n\n特別是為了竊取珠寶資料跑進卡地亞金庫裡的橋段，不免讓人想起她在《哈利波特7》裡\n\n詮釋妙麗假扮貝拉的有趣場景\n\
  \n戲裡貢獻了不少笑點，戲份也頗多(挺意外)\n\n\n另外三位，蕾哈娜、敏迪卡靈與Awkwafina表現不俗但也沒太大發揮機會\n\n而詹姆斯柯登的出場則是很謎，雷聲大雨點小的角色\n\
  \n\n整體來說，電影敘事流暢、畫面優美，劇組甚至申請在大都會博物館中實地拍攝，並搭建\n\n一座媲美真實世界的Met Gala展覽，加上不時串場的時尚名人，這部戲大概能當成《穿著\n\
  \nPrada的惡魔》番外篇吧\n\n\n向來不嚴謹的偷天計畫依舊是吐槽點滿滿\n\n不過做為女版《瞞天過海》首集，聰明的選擇了以時尚當作輔助，華奢珠寶搭配每位演\n\
  \n員的魅力，互相輝映外也更為閃耀。\n\n\n至於很多人猜測會否有《瞞天》三部曲角色登場，的確有，但應該不是大家心中的那位XD\n\n\n若是有下一集的話，希望可以找來梅姨與艾蜜莉布朗演出\n\
  \n當然若茱莉亞羅勃茲願意演出茱莉亞羅勃茲，應該也是蠻有話題的梗\n\n\n附上相關宣傳訪談影片\n\n安海瑟薇 凱特迷妹模式開啟\n\n\n\nJames Corden\
  \ Show短片\n\n\n\n\n卡蘿閨蜜組上節目(很鬧)\n\n\n\n\n看見安海瑟薇的雙面魅力\n\n\n\n\n\n--\n很會一本正經說垃圾話\n\n\
  蕉姊在電影裡有美 戲份不算少"
