title: '[新聞] 影后齊聚一堂！女版瞞天過海敲定上映日期'
content: '新聞網址：



  華納影業和 Village Roadshow Pictures 已經制定好接續 2001 年經典犯罪電影《瞞天

  過海》的計畫，除了將陣中成員清一色換成女性之外，也已經宣布了全女版《瞞天過海》

  在 2018 年的上映日期。


  目前也已經敲定了八位中的七位主演女星，由奧斯卡影后珊卓布拉克（Sandra Bullock

  ）領軍，包括凱特布蘭琪（Cate Blanchett）、安海瑟薇（Anne Hathaway）、海倫娜

  波漢卡特（Helena Bonham Carter）、沙拉寶森（Sarah Paulson，影集美國恐怖故事

  ）、敏迪卡靈（Mindy Kaling，影集怪咖婦產科）、蕾哈娜（Rihanna）、說唱歌手

  Awkwafina，整體星度相當耀眼。全女版《瞞天過海》將由《飢餓遊戲》（The Hunger

  Games）導演蓋瑞羅斯（Gary Ross）執導。


  根據 THR 的報導，全女版《瞞天過海》將會在 2018 年的盛夏，6 月 8日重返大銀幕，

  估計將會直接對上派拉蒙影業的《變形金剛6》（Transformers 6），但由於許多觀眾

  已經厭倦了觀賞超大型視效機器人在大銀幕打架，全女版《瞞天過海》可望接收許多觀

  眾；此外，其他潛在的對手可能有迪士尼的「韓索羅」（Han Solo）個人電影、皮克斯

  的《玩具總動員4》（Toy Story 4）、以及「大魔王」環球影業的《侏羅紀世界》（

  Jurassic World）續集等強檔。


  珊卓布拉克以原版丹尼奧申（Danny Ocean，喬治克隆尼(George Clooney)在《瞞天過海

  》的角色）姐妹的身分帶領8位嬌娃偷拐搶騙。和他的兄弟一樣，珊卓飾演一位具有個人

  魅力的小偷，在大都會藝術博物館慈善晚會（Met Gala）策劃一場搶劫，並組織了一組

  團隊準備大幹一票。凱特布蘭琪則飾演珊卓布拉克的左右手（如同布萊德彼特(Brad

  Pitt)之於喬治克隆尼），由原版導演史蒂芬索德伯（Steven Soderbergh）擔任製作人

  。


  蓋瑞羅斯表示全女版《瞞天過海》的基調將會和史蒂芬索德伯的原版《瞞天過海》相似

  ，全女版《瞞天過海》將會較像是原版電影的延伸與接續，並稱讚了原版系列有著「令

  人驚艷的風格」。談到他和史蒂芬的合作，他說：


  「我們討論很多關於電影的事，包括攝影風格、節奏、剪輯風格、還有音樂。我們討論

  了所有事情。我沒有想要創造一個新風格的打算，我很興奮也很榮幸的可以將原本的風

  格繼續延續下去，這一定非常有趣。」


  全女版《瞞天過海》的劇本也由導演蓋瑞羅斯和奧莉維亞密琪（Olivia Milch）共同撰

  寫，由蘇珊艾金斯（Susan Ekins）擔任執行製片。其實續集的計畫已醞釀多年，卻因

  為製作人之一傑瑞溫特勞布（Jerry Weintraub）意外過世而暫時喊卡，去年蓋瑞簽約

  加入劇組後才終於重新推動，拍攝工作將於這個月在紐約開始。


