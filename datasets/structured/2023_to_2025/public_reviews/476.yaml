url: https://www.ptt.cc/bbs/movie/M.1465185882.A.371.html
title: '[新聞] 女版「瞞天過海」竟由這兩位影后當家！'
content: '2016-06-04 23:43 聯合報 記者蘇詠智／綜合報導



  女性消費實力受到好萊塢重視，以往男性掛帥的系列都要改成女人當家。繼今夏新版「魔

  鬼剋星」由全女班取代男性元老後，喬治柯隆尼掛帥的「瞞天過海」也要改拍成女性版，

  鎖定珊卓布拉克、凱特布蘭琪這兩位奧斯卡影后領軍。



  珊卓布拉克將領軍女性版「瞞天過海」。（歐新社資料照片）


  珊卓布拉克與喬治柯隆尼合作「地心引力」後，繼續尋找合適題材攜手，因而喬治掛名監

  製的女版「瞞天過海」，很早就相中珊卓擔任類似喬治在男性版裡的角色，劇情還會安排

  她是喬治的姊妹，好將男女版本作連結，喬治也有機會客串露臉。珊卓身旁的得力大將、

  有如男性版中布萊德彼特的人物，原本希望邀請年輕、當紅的珍妮佛勞倫斯，她本來也有

  很高意願，可惜手上片約太多，有可能檔期抽不出來，現在已經角色年齡稍作調整，改邀

  也是喬治柯隆尼老搭檔的凱特布蘭琪。



  凱特布蘭琪在洽談演出女性版「瞞天過海」。（路透資料照片）


  3個娘子軍勝過一堆負心漢，是20年前暢銷小說改編的「大老婆俱樂部」主要情節，當年

  貝蒂蜜勒、歌蒂韓與黛安基頓3位大姐大分飾被丈夫背叛的原配，聯手設法讓劈腿男與小

  三自食惡果，小三之中還包括尚未大紅的莎拉潔西卡派克、瑪西亞蓋哈登等。美國已有電

  視頻道決定再將之搬上螢幕，由新一代的女星擔任21世紀「大老婆俱樂部」成員，繼續發

  揮犀利人妻本色，給偷腥夫與狐狸精好看。




  --






  --'
