url: https://www.ptt.cc/bbs/movie/M.1762270428.A.FDD.html
title: '[新聞]班尼西歐狄特洛加入瞞天過海前傳扮反派！'
content: '班尼西歐狄特洛加入《瞞天過海》前傳扮反派！同台瑪格羅比、布萊德利庫柏上演全新劫

  案



  原本預定由瑪格羅比（Margot Robbie）、萊恩葛斯林（Ryan Gosling）攜手主演的《瞞

  天過海》（Ocean''s Eleven）前傳電影，上個月突傳葛斯林已經退出，取而代之的則是布

  萊德利庫柏（Bradley Cooper），而今天外媒《Nexus Point News》則接續爆料，坎城影

  帝-班尼西歐狄特洛（Benicio del Toro）也在洽談加入演出，而且很可能會是扮演反派

  。


  這部前傳由《龍捲風暴》（Twisters）韓裔導演-鄭李爍執導，時空設定在 1960 年代，

  與 1960 年原版《瞞天過海》電影的年代相同，羅比和庫柏預計將扮演神偷兄妹檔「丹尼

  歐遜」與「黛比歐遜」的父母，也就是前四部的核心主角 — 喬治克隆尼（George

  Clooney）、珊卓布拉克（Sandra Bullock）的雙親。 Netflix 愛情喜劇《非常家務事》

  （A Family Affair）的編劇-凱莉索羅門（Carrie Solomon）負責撰寫了最新一稿的劇本

  。


  明年總共會有兩部《瞞天過海》相繼開拍，一部是前傳，一部則是克隆尼和布萊德彼特（

  Brad Pitt） 回歸主演的正宗第四集，但上映日皆未定。





  --'
