url: https://www.ptt.cc/bbs/movie/M.1529090905.A.3BC.html
title: 'Re: [吵架雷] 瞞天過海8面玲瓏'
content: "我這一兩年看了幾十場電影，真的是什麼鳥事都碰過，而且是頻率越來越高，\n\n可以看我這篇 \n\n\n看電影碰到形形色色的人跟狀況，雖然都很討人厭，但厭惡程度其實還是有分輕重的，\n\
  \n最普遍遇到但你又很難去指責他的就是吃東西了，不管是吃雞排還是卡哩卡哩這種，\n\n雖然被味道跟咀嚼聲或塑膠袋聲音干擾到而幹在心裡，但還是只能隱忍了，\n\n\
  \n再來就是明顯的人格瑕疵才會做的行為，像是一直講話(包括講手機)或是玩手機踢椅背，\n\n這種人真的很機掰，但我遇到還是會忍住怒氣好言請他們節制一點，\n\n\
  這種情況差不多有七八成的人被委婉告之後都會有所自制或停止，\n\n但其實觀影情緒已經被打壞掉了，也會因為錯過某些片段而幹得要死，\n\n\n接著就是最雞掰的，遇到會直接暴怒，就是帶小孩子進戲院然後任由小鬼吵鬧，\n\
  \n這種父母真他媽的根本是垃圾中的垃圾，人渣敗類，碰到真的會超火大，\n\n而最離譜的是這種垃圾父母你不管是婉轉或是激烈的勸阻牠們都沒用，\n\n牠們通常會理直氣壯地回嗆你說「小孩子不好管啊你知道嗎你有小孩嗎？」\n\
  \n或是「有必要這麼兇嗎？話不能好好講是不是？」，\n\n自己做錯事還會無恥的反過來指責你就是牠們會做的行為，完全不讓人意外，\n\n畢竟有羞恥心的父母怎麼可能帶小朋友進戲院還任由牠們吵鬧呢？\n\
  \n這種極品爛貨這十年來我就遇過四次了，每次都是吵起來吵到雙方互嗆 = =\n\n當然跟牠們吵起來的不一定是我就是了，\n\n\n還有不知道是不是錯覺？台灣人觀影的水準這幾年不但沒有提升，還每況愈下，\n\
  \n上述說的鳥事遇到頻率真的越來越高，\n\n重點是，這些人的臉皮都越來越厚越來越刁，越來越多的是都不認為自己有問題，\n\n這是最糟糕的，到底台灣的教育出了甚麼問題啊？怎麼會搞的人民水準會越來越低，\n\
  \n普遍的以自我為中心，真是見鬼了...\n\n--"
