url: https://www.ptt.cc/bbs/movie/M.1538032078.A.65E.html
title: '[普雷] 過於玩美的瞞天過海：八面玲瓏'
content: '這部片最大賣點就是卡司很堅強

  (實在是好奇請這些卡司到底要花多少錢XD)

  剛上映的時候本來滿想去電影院看的

  但後來看網路評價…嗯 還是等數位平台上架好了XD

  看myvideo單租是數位平台中最便宜的就趁連假租來看完

  劇情還算中規中矩，沒有到緊張懸疑刺激感

  一切都感覺太過完美了


  以下防雷









  怎麼說太完美呢？

  就是整個計畫從頭到尾都沒有破綻，也沒有人來拆穿

  非常順利的像寫功課一樣，按部就班的全部完成

  安海瑟威算是劇情後段的伏筆

  一開始讓人以為她只是無腦巨星，沒想到其實很早就發現了計謀

  原本還以為會有甚麼大轉折

  結果也只是因為自己沒朋友就加入她們了（好容易被招募）

  而珊卓布拉克想要陷害前男友的計畫，竟然也輕而易舉的完成了？

  整部片就像個許願池

  主角想做甚麼就能做到，一點阻礙也沒有耶～



  整部電影最值得看的部分就是在宴會上那段了吧

  看幾個大咖穿上各式華服，施展個人魅力

  （有種在看美國娛樂新聞的錯覺XD）

  除了安海瑟威，個人最愛看莎拉寶羅森上大螢幕

  平常看她在美劇習慣了

  沒想到上大螢幕也很適合又很美！



  簡單來說瞞天過海：八面玲瓏 這部片

  完美詮釋了「食之無味，棄之可惜」這句話

  蠻適合聚會時跟很多朋友一起看

  邊看邊吐槽抑或是對於完美偷天換日計畫驚呼討論

  應該會是還不錯的選擇


  --'
