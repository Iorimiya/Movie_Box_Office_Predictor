title: '[請益] (雷)《瞞天過海：八面玲瓏》的一個小問題'
content: '想請問一點《瞞天過海：八面玲瓏》的小問題，想請各位解惑一下～


  關於裡面有一些不知名富婆轉錢給 Claude Becker 的部分，這部分我有點看不明，我知道

  用意是在於陷害這男的，但前段的原由我有點閃神沒看清楚，希望各位可以給我解惑一下O

  rz


  是這些富婆是主角們的人，透過他們變賣珠寶，再轉一部份的錢給男主陷害他，讓警方以

  為是男主偷首飾變賣所賺到的錢這樣嗎？所以這些也不少的錢就單純是 Debbie Ocean 不

  要了專門陷害男主對吧？可以脫身又抱負，一舉兩得的概念。


  不知道我的解讀對不對呢？


  --'
