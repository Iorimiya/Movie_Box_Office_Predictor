url: https://www.ptt.cc/bbs/movie/M.1528955397.A.34F.html
title: '[普好雷] Ocean''s 8 瞞天過海：八面玲瓏'
content: '衝著這卡司，抱著「就算是糞片我也認了」的決心，衝了第一天早場，結果…

  其實還可以啦。

  記得小時候看瞞天過海系列也大概差不多是這樣：順順幹完一票，沒有太多爆點和轉折，

  但每一幕都真心養眼。


  珊卓布拉克還是一樣好美，金髮造型更是美出一個新高度。



  凱特布蘭琪的重要性不如想像的大，但還是奉勸凱特迷弟迷妹，電影院冷氣很冷，記得帶

  件內褲去換。

  每一幕都帥到嘎冷筍。


  （懷孕吧各位）



  小安在本片就是個ㄎㄧㄤ到不行的瞎妹，她的角色居然是全片最ㄎㄧㄤ的！完全讓人想起

  麻雀變公主的喜劇路線，好棒！

  當她看著鏡子冒淚說出：「我…看起來好…大隻…」的時

  候我真的快笑死，不要把演技浪費在這種地方XD


  （而且還三不五時在呻吟。）


  （想被小安賞巴掌。）



  其實我是為了ㄎㄧㄤ后Helena Bonham Carter來的，但她這次沒有很ㄎㄧㄤ，反而跟鸚鵡

  兄弟一樣呆萌呆萌的，超可愛（大心）


  她的角色幫助前置部分的劇情推動得還算順利，戲份甚至還比凱特多了一點。


  （以一個老花的姿態掃描鑽石中。）


  至於其他四位就中規中矩各司其職啦，但都還算討喜。


  總之，如果要看本格一點或燒腦的犯罪電影，那瞞天過海不會是你的首選。

  但如果你只是想要打發時間，看看有小威廉絲、金卡達珊（為什麼她出現了三幕？），眾

  星雲集的Met Gala，並看看美到令人屏息的珊卓，以及這一派女星是如何合作無間偷走卡

  地亞珠寶的（這段接力其實相當精彩），那放鬆心情來看看這部片，倒也不會是個太令人

  失望的選擇。



  --




  結果上網看了一下，其實原圖看起來也蠻矮的XDDD

  對啊我想說原本不是說七個人嗎

  要跟凱特對戲但沒被壓下去真的好難，難道是這樣戲份才這麼少（凱特你收斂一點！）

  我不會知道啊因為我遲到了

  票根弄丟了只好附上刷卡擷圖：


  課以嗎？

  補上一些預告內的擷圖

  嚇死我了，想說衝首日還被懷疑（哭）

  （嗚我票根居然真的弄丟了）

  那部台灣好像是快年底才上吧沒記錯的話

  樓上蓋兒

  吹泡泡那邊超煩的！

  我看早場也是人少少的沒什麼反應欸…

  我在角落一直癡癡傻笑好像笨蛋XD

  之前看有人推九天玄女，我覺得可以

  加魯妮瑪拉進來變94愛你（跟因為愛你什麼關係？）

  後來才發現遙控潛水艇是在躲紅外線，但泡泡槍那邊真的是來亂的www海倫娜差點破功

  樓上各位一路向西惹

  男生真的帥，雖然沒看過他演戲'
