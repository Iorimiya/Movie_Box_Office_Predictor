title: 'Re: [討論] 瞞天過海1-3 Ocean''s Eleven to Thirteen'
content: '借問一下，我長久的疑問

  1裡面的黑人拳手到底是不是同謀啊

  歐遜跟羅斯提還在找人時

  在酒吧裡看拳賽的廣告

  歐遜就問「還要再找一個人嗎？」

  這時羅斯提就只看著廣告

  歐遜就說「那就再找一個人」

  這時會讓人感覺要找拳手

  但找的是麥特戴蒙

  後段比賽時，拳手感覺是故意引戰的

  又覺得像那個打手的定位一樣


  2.魯本是純出資嗎？

  好像沒看到他有做事的橋段

  除了1跟著遙控車走那段

  還是我沒注意？


