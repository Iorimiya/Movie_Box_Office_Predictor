url: https://www.ptt.cc/bbs/movie/M.1535358917.A.859.html
title: 'Re: [吵架雷] 瞞天過海8面玲瓏'
content: '我記得我小時候電影院還是很安靜的

  媽媽也一直告誡我看電影的時候不准講話

  就算我跟她說話她也會等電影結束才回答我

  但是近幾年去電影院越來越長遇到打擾別人的觀眾


  我遇過沒帶到眼鏡看不清楚字幕，

  從頭到尾他朋友都要復誦字幕給他聽的人@@

  大聲把自己os講出來，例如：太痛了吧！太好笑了吧！要是我我就怎樣怎樣，不會怎樣怎

  樣就好了哦諸如此類的

  跟我同行的其中一個朋友請他不要說話，他說得更起勁更大聲@@

  所以我都會選冷門時段的冷門排數

  前幾個禮拜因為真的有很想看的電影，

  等不及就看了首映當天晚上的場次，滿場


  連續兩天都遇到超亮手機還用很久的人

  第一天是前面一排的人

  一直滑Line滑臉書滑IG，而且是平常去吃飯手肘撐在桌子上，手機舉在眼睛前的高度

  一直照到後排的我，就在她把手機舉到旁邊人面前給他看對話紀錄我就忍不住了

  跟她說不好意思手機很亮可以收起來嗎？

  她就沒有拿出來過


  第二天更扯，也是滿場

  我進場的時候他把手機放在我椅子上

  上面是遊戲畫面

  他從～頭～到～尾～玩手遊

  只在觀眾反應大的地方抬頭看

  後來我受不了用帽子把他的方向遮起來

  又不是在家裡看DVD，手機還這麼亮

  太沒有公德心了吧

  我一直想說有沒有人會跟他說，但是也沒有

  但是我自己也是一直忍到最後電影結束了也沒說

  除了怕他很兇以外XD也不想要節外生枝

  所以決定以後再也不看首映日了


  昨天去松菸誠品電影院

  電影中間沒有聲音的空檔，也沒有人發出任何聲音或用手機

  所以看得很盡興

  真不知道是影片類型的關係還是地區的關係@@


  我在電影院上過班，其實服務人員有義務要維持影廳的觀影品質

  所以是有權利提醒客人不要影響其他觀眾的

  不過也從來沒遇過出來請我們處理的客人就是了


  --

  畢竟還是服務業嘛XD

  這個不錯，也可以直接屏蔽影廳訊號'
