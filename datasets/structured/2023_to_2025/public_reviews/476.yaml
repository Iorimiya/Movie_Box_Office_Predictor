content: '以下無雷心得。


  自身背景是沒看過瞞天過海系列作，沒有背景知識一樣可以看得很開心


  但可能無法對開頭跟結尾的畫面無法有共鳴（？）。


  劇情進展平順，一切都按照黛比的計畫走，


  什麼窩裡反、成員良心不安臨陣退縮、或是警匪鬥智什麼的，都沒有。


  這部就是輕鬆愉快，從頭到尾笑聲不斷的無腦爽片。


  適合在這種假期看，看完以後認分面對收假上班，這是本片的最大功能。


  其他心得感想的話，原來從前卡地亞的發音都唸錯了，要念卡地亞，不是卡地亞。


  雖然肥宅我應該一輩子買不起卡地亞，至少發音不能唸錯QQ


  --


