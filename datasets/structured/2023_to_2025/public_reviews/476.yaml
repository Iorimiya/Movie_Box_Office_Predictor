title: '[問片] 瞞天過海(佈局)'
content: "因為很喜歡原版西班牙的佈局，看到大陸的翻拍版，很高興的找來看\n\n雖然有許光漢、張鈞甯男神女神加持，但看過兩人演技，也沒抱多大期待！\n\n\
  \  重要角色都魔改了一番。原作堅強又睿智的媽媽改成許光漢飾演的刑警\n\n光漢依然不改面癱的表情，但比起鬼家人要進步許多～值得嘉獎\n\n 至於張鈞甯飾演原作喪心病狂的男主角，只有一個爛字......\n\
  \n對白完全沒有情緒起伏，像念稿子一樣，狠得時候不夠狠，柔得時候不夠柔\n\n浪費一個可以好好發揮的蛇蠍美人角色\n\n  總之，雖然不難看，但是演員的演技令我出戲，沒有原作那樣層層堆疊、\n\
  \n勾心鬥角的痛快！\n\n  還是看佈局就好，翻拍真的要很小心，一下子變爛片\n\n--"
