url: https://www.ptt.cc/bbs/movie/M.1760063935.A.B4F.html
title: '[新聞] 「瞞天過海4」開拍倒數！小布、喬治克'
content: '「瞞天過海4」開拍倒數！小布、喬治克隆尼「夢幻原班人馬」全回歸




  喬治克隆尼（George Clooney）近日在接受「E! News」訪問時親口證實，經典大作

  「瞞天過海」（Ocean’s）系列第4集「Ocean’s 14」有望於明年正式開拍，原班人

  馬茱莉亞羅勃茲（Julia Roberts）、布萊德彼特（Brad Pitt）、麥特戴蒙

  （Matt Damon）與唐奇鐸（Don Cheadle）都將回歸。


  克隆尼早在2023年就曾暗示「Ocean’s 14」有一分「非常棒」的劇本，如今他進一步

  透露：「電影公司已經批准預算，我們正準備開拍，現在只剩下檔期安排問題，預計

  9到10個月後就會正式開鏡。」


  當被問到是否期待再度與布萊德彼特合作時，克隆尼笑說：「當然！布萊德、麥特、

  唐奇鐸、茱莉亞，我昨晚才跟茱莉亞吃飯，他們全都是我親密的朋友。能再次一起

  拍片真的會很開心。」至於片名是否就是「Ocean’s 14」時，他打趣說：「嗯……

  我不太想這樣叫它啦，應該會換個名字。」


  原始「瞞天過海」三部曲由名導史蒂芬索德柏（Steven Soderbergh）執導，2001年

  推出首集「瞞天過海」，票房橫掃全球4.5億美元，隨後續作「瞞天過海2：長驅直入」

  （2004）收穫3.62億美元、「瞞天過海：十三王牌」（2007）再賺3.11億美元。


  2018年推出的衍生作品「瞞天過海：八面玲瓏」（Ocean’s 8）則由珊卓布拉克

  （Sandra Bullock）領銜，飾演克隆尼角色「丹尼歐遜」的妹妹，卡司包括凱特

  布蘭琪（Cate Blanchett）、蕾哈娜（Rihanna）、安海瑟薇（Anne Hathaway）

  等人，全球票房達2.97億美元。



  --'
