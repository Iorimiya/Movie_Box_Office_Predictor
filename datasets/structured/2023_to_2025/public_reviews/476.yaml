title: '[新聞] 小威、莎娃將客串電影《瞞天過海》'
content: '新聞網址：


  網球迷注意! 小威、莎娃將客串電影《瞞天過海》 2017年12月03日 12:27


  好萊塢電影《瞞天過海》( Ocean''s trilogy)系列，將開拍全員由女性出演的新版《瞞天

  過海三部曲》(Ocean''s Eight)，卡司不僅有大咖好萊塢女星，網壇前兩大球后小威廉絲

  (Serena Williams)、莎拉波娃(Maria Sharapova)也傳出將客串其中。


  《瞞天過海三部曲》演出卡司重量級，包括珊卓布拉克(Sandra Bullock)、凱特布蘭奇(

  Cate Blanchett)、安海瑟威(Anne Hathaway)等好萊塢女星，還有西洋天后蕾哈娜(

  Rihanna )湊一腳。


  網球迷也特別有福，有機會看到小威、莎娃在電影裡客串，電影早在2016年開拍，預計在

  將在2018年6月上映發行，這已不是小威首度跨足影視，過去美國流行天后碧昂絲

  (Beyonce)的音樂錄影帶MV，就曾邀請小威助陣。


  --'
