title: '[新聞] 女版《瞞天過海》8天后同台飆戲！預告網'
content: "記者洪文／綜合報導\n\n\n《瞞天過海》系列電影集結喬治克隆尼、布萊德彼特、麥特戴蒙等男神，掀起全球票房佳\n績。華納兄弟以全女星陣容打造新片《瞞天過海：八面玲瓏》（Ocean’s\
  \ 8），19日曝光\n首支中文預告。影片中珊卓布拉克（Sandra Bullock）、凱特布蘭琪（Cate Blanchett）\n一共8位女神同台飆戲，立刻被網友瘋轉推爆。\n\
  \n\n\n\n\n\n\n\n\n原版《瞞天過海》喬治克隆尼飾演丹尼奧申（Danny Ocean）、左右手是布萊德彼特，而\n珊卓布拉克在《瞞天過海：八面玲瓏》演出奧申的妹妹，而凱特布蘭琪是她的左右手。她\n\
  在假釋出獄後，集結各懷絕技女神行家，將再次犯下稀世珠寶的驚天劫案。\n\n預告一出，網友立刻狂讚瘋轉，「卡司太強大了」、「預告看完跪了」、「太期待了」、\n「還要等好久才上映」並且好奇原版《瞞天過海》各個男神是否回歸演出。據外媒報導，\n\
  原版飾演萊納斯卡德威、紹爾布魯姆的麥特戴蒙、卡爾雷納將以同樣角色客串演出，令人\n期待。電影 2018年6月14日在台上映。\n\ncr: \n\n--"
