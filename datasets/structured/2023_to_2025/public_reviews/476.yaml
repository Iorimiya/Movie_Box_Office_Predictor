title: '[新聞] 等了14年！《瞞天過海4》已在構思劇本'
content: '等了14年！《瞞天過海4》已在構思劇本 全員有望回歸




  《瞞天過海：13王牌》劇照


  【文／電影文字系】


  犯罪喜劇電影《瞞天過海》（Ocean''s Eleven）2001年上映轟動全球，卡司集結喬治克隆

  尼、布萊德彼特、麥特戴蒙等大咖，後續發展成為三部曲，累計票房高達11.2億美金，叫

  好又叫座。


  不過，第3集推出至今14年，遲遲等不到《瞞天過海4》的籌備消息，如今導演史蒂芬索德

  柏（Steven Soderbergh）傳出已在構思劇本中，令大批影迷相當興奮。




  《瞞天過海》劇照


  在《瞞天過海》飾演「爆破專家」巴舍塔爾的唐奇鐸，最近因宣傳電影《怪物奇兵全新世

  代》接受外媒《娛樂周刊》訪問。


  提到《瞞天過海4》為何遲遲沒有拍，他表示：「我們曾經在《瞞天過海：13王牌》之後

  討論過這件事，後來伯尼麥克（飾演法蘭克）過世了，當時我們心裡好像都有個念頭：『

  不了，我們不想再拍了！』」




  《瞞天過海：13王牌》劇照


  唐奇鐸前一陣子在HBO影集《匪類》（No Sudden Move）與導演史蒂芬索德柏再度合作，

  兩人在拍攝時又再次聊到《瞞天過海》系列，當時導演告訴他：「我想也許有辦法再拍一

  部，我有在構思了！」


  不過並沒有太多新進度，他目前不清楚詳情，「我不知道誰會參與，我是覺得我們這群主

  要演員都會全員回歸，到時候會很有看頭。」




  《瞞天過海：13王牌》劇照


  《瞞天過海》2001年全球票房突破4.5億美金，2004年《瞞天過海2：長驅直入》（3.62億

  美金）、2007年《瞞天過海：13王牌》（3.11億美金）兩部續集同樣開出紅盤，三部曲累

  計票房11.2億美金。


  儘管多年未拍第4集，導演史蒂芬索德柏2018年製作「全女性卡司」外傳電影《瞞天過海

  ：八面玲瓏》，集結珊卓布拉克、凱特布蘭琪、安海瑟薇等大咖，依舊大賣2.97億美金，

  證明這個IP的既有魅力，或許這是第4集有望推出的原因。




  《瞞天過海：八面玲瓏》劇照


  至於《瞞天過海4》如何推出，也是外界好奇的焦點。


  許多影迷敲碗《瞞天過海：八面玲瓏》拍攝續集，加入過去《瞞天過海》三部曲的男性主

  演，然而眾多大咖如何湊在一起拍攝，或許是一大挑戰。


  另一方面，《瞞天過海：八面玲瓏》一開始即宣告喬治克隆尼的角色死了，也為他的回歸

  之路增添變數，不過「詐死」也是一種解套方法，在這部電影似乎不會不合理。


  新聞網址：


  --'
