url: https://www.ptt.cc/bbs/movie/M.1529074045.A.A33.html
title: '[負雷] 瞞天過海---被211凱吉哥吊打的片'
content: '簡單說這部片bug太多,

  以一部竊盜詐欺為題材的犯罪電影來說是大忌.


  最近日本有一部日劇,長澤雅美講詐欺的.

  這部片還不如那部日劇.


  明明是Ocean''s 10,片名卻是Ocean''8???????兩個人做白工嗎????


  沒想到還真的是哩,有兩個人真的是做功德的.


  警察跟廢物一樣,裡面的腳色還有臉盲症.

  主角是前科犯,在犯罪現場跟人大吵大鬧,居然還有不在場證明呢,

  哈哈哈哈哈.


  還有在公開場合撿到贓物者,而且一堆人看到,居然沒被調查呢.

  這部片裡的人不但臉盲,還兼失憶症.



  這部片在真實度跟邏輯上真的被211緊急呼救吊打,

  211真的非常寫實,看似英明卻只提供一點點情報但沒什用處的國際女刑警.


  官僚的霹靂小組隊長,但卻硬下令攻堅,死了一兩個隊員,卻達成任務,

  全擊斃歹徒,完成了任務(一個是青少年殺的,不管反正目的有達成就好).


  有人批評凱吉哥女婿小傷根本不會死,演得太假.但是打到大腿動脈是真的會死人.


  歹徒聲東擊西計策失敗,看到凱吉哥過來又判斷錯誤,讓把風的一個人坦凱吉哥跟女婿.

  造成被關廁所.


  這些劇情寫實又合邏輯,警察雖然兩光,死傷一些人,但還是把歹徒消滅了,

  警察起碼不是花瓶.


  反觀瞞天過海,警察根本莫名其妙消失了.



  我就不懂女版女明星為何不學男版第二集(其實我覺得叫麥特戴蒙

  假扮馬克華伯格比較有趣XD)用本名,我想跟片中情節跟好萊塢八卦相同

  (神經質,對助理苛刻)造成的吧,用本名演員應該不會接受.



  總之女版瞞天過海真的爛,遠不及凱吉哥的211緊急呼叫.


  --'
