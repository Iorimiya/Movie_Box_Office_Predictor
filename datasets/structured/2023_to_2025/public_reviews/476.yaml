url: https://www.ptt.cc/bbs/movie/M.1529107731.A.229.html
title: 'Re: [吵架雷] 瞞天過海8面玲瓏'
content: '先說

  我大概能理解原po的點

  這有點像是國小自修課班上好幾個人在嘻嘻酥酥講話

  有個同學突然大聲的說「可不可以安靜阿」

  然後開始大聲訓斥

  變得是最吵的

  然後其他人被覺得更吵


  但是



  「會這樣還不是你害的？」



  你安安靜靜不講話不就沒人會這樣了嗎

  什麼講了幾句話

  看電影有人講一句話我就想有超能力叫那些人閉嘴

  但覺得我去提醒只是更影響其他人就算了

  看完電影再討論很難嗎

  你說講幾句話沒關係時

  你有想過其他人不是沒關係

  是在「忍受」嗎？


  「沒有啊,因為你只想到你自己」


  想到想問問題就問

  想到想說什麼就說

  覺得壓低音量就不會怎樣

  不會去想大家都是忍在心裡不想說而已

  忍受有時候冒出來的聲音有時候沒有又不能做些什麼

  只能祈禱這次問完啥問題後就閉嘴不要講話


  所以我能理解你的意思

  「他更吵」這個ok我懂

  但是這是你問題造成的阿

  你安安靜靜看完電影

  他也會讓你安安靜靜看完電影

  出來後愛怎麼講怎麼問都可以阿


  不是很好嗎？


  看電影

  就整場安靜不要講話

  想講話

  自己租片回家看愛怎麼講沒人管


  多完美







  --'
