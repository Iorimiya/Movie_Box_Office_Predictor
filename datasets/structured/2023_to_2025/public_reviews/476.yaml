url: https://www.ptt.cc/bbs/movie/M.1529178553.A.183.html
title: '[負雷]《瞞天過海：八面玲瓏》有望入圍金酸莓獎 '
content: '部落格版，有附安海瑟薇的圖，歡迎支持→

  以下無本片劇透，但有提及其他電影的劇情

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  　　《瞞天過海：八面玲瓏》這部電影有兩大優勢，由珊卓布拉克領軍，集結了諸多好萊

  塢一線女星，卡司堅強，星光熠熠，且擁有《瞞天過海》這個系列作的IP光環，可謂是未

  演先轟動！可惜導演拿了一首好牌，卻拍出一個徒具其形，卻無其靈的空殼作品，鬥智燒

  腦片有兩大忌：「自以為聰明」和「低估觀眾智商」，本片兩者兼具。這類的商業大片，

  我不奢求能看到「化腐朽為神奇」的絕妙之作，娛樂性到位即可，可惜導演反其道而行，

  他「化神奇為腐朽」，將這部商業大片的娛樂性完全剝奪，毫無任何令人心服口服的高竿

  騙術，全片只見諸位女星走過場，唯一的看點，僅剩雍容華貴、風情萬種的安海瑟薇。


  　　本片之所以崩盤，在於導演完全忘記衝突是戲劇的本質，香港導演彭浩翔曾在他臉書

  粉絲團上表示：「華語電影常常有個誤解，以為劇力是來自大場面，其實從來都是來自人

  性衝突。」這標準不僅僅適用於華語電影，放諸四海皆準，而《瞞天過海：八面玲瓏》全

  片劇情順風順水，毫無威脅，毫無危機，完完全全激不起情緒起伏，一路平平淡淡到結局

  ！《不可能的任務》和《玩命關頭》系列，儘管大家都心知肚明反派再強，主角肯定會順

  利突破困境，取得逆轉勝，但過程的衝突可以帶給觀眾感官刺激，製造出娛樂性，可是《

  瞞天過海：八面玲瓏》在竊寶過程中連給個像樣的反派或者製造一點危機都不肯，就讓八

  位女星穿著華服炫富，進入裝逼模式，乍看之下，還以為在看郭敬明導演的《小時代》，

  不過《小時代》略勝一籌，因為《小時代》裡面的角色偶爾會撕逼（原意指女人與女人之

  間的鬥爭。現在也可用來形容雙方互相攻擊揭短、發生罵戰的現象。），勉強算是有營造

  出衝突，雖然郭敬明導演在大陸以拍爛戲出名，但這回憑良心說，他的作品確實贏過《瞞

  天過海：八面玲瓏》，倘若要二刷，我果斷會選《小時代》。


  　　去年入圍金酸莓獎最差電影扣掉動畫片《表情符號電影》，其他四部是《海灘救護隊

  》、《格雷的五十道陰影：束縛》、《神鬼傳奇》、《變形金剛5：最終騎士》，通通是

  有好萊塢大明星加持的商業片，按這個趨勢，《瞞天過海：八面玲瓏》入圍的機率不低，

  除非下半年出現更多的後起之「鏽」；然而，上述四部電影儘管口碑再差，劇情再薄弱，

  或者有嚴重性的邏輯瑕疵，至少有幾幕製造出衝突感，偶爾能讓觀眾有一點情緒起伏，像

  是《海灘救護隊》巨石強森被解職、《格雷的五十道陰影：束縛》安娜主管的威脅、《神

  鬼傳奇》阿湯哥的犧牲和《變形金剛5：最終騎士》大黃蜂柯博文兄弟鬩牆等，都有編出

  一些還算像樣的橋段。


  　　反觀《瞞天過海：八面玲瓏》不顧戲劇本質，只靠卡司跟IP，不禁令人想起去年的《

  三生三世十里桃花》電影版，兩者有異曲同工之妙，《三生三世十里桃花》也是擁有明星

  陣容跟IP光環，卻只在「豆瓣電影」上拿到3.9的分數，3.9分有多低，一般人可能沒啥概

  念，豆瓣電影提供兩個比對標準，「好於2%愛情片」、「好於3%奇幻片」，換言之，輸給

  98%的愛情片和97%的奇幻片，2%和3%這兩個數字加起來，比9.2%還低，連某任總統民調都

  不如，不過基於「國外的月亮比較圓」、「外來的和尚比較會唸經」的迷思，屆時若在大

  陸正式上映（檔期似乎未定，按本片結局走向，在大陸極難過審），《瞞天過海：八面玲

  瓏》的評分應該還是能壓過《三生三世十里桃花》。　　反觀《瞞天過海：八面玲瓏》不顧戲劇本質，只靠卡司跟IP，不禁令人想起去年的《

  三生三世十里桃花》電影版，兩者有異曲同工之妙，《三生三世十里桃花》也是擁有明星

  陣容跟IP光環，卻只在「豆瓣電影」上拿到3.9的分數，3.9分有多低，一般人可能沒啥概

  念，豆瓣電影提供兩個比對標準，「好於2%愛情片」、「好於3%奇幻片」，換言之，輸給

  98%的愛情片和97%的奇幻片，2%和3%這兩個數字加起來，比9.2%還低，連某任總統民調都

  不如，不過基於「國外的月亮比較圓」、「外來的和尚比較會唸經」的迷思，屆時若在大

  陸正式上映（檔期似乎未定，按本片結局走向，在大陸極難過審），《瞞天過海：八面玲

  瓏》的評分應該還是能壓過《三生三世十里桃花》。


  　　假使忽略劇情，靠明星、華服、妝容就能湊硬成一部電影，把標準放得這麼低，那是

  不是伸展臺的模特兒走秀也能當成電影播放了？若真要為《瞞天過海：八面玲瓏》找出一

  絲價值，如我先前所言，唯一的看點，僅剩雍容華貴、風情萬種的安海瑟薇，是她的粉絲

  的話，還是勉強能進場一看，畢竟她佔有不少重要戲份，再扣掉珊卓布拉克、凱特布蘭琪

  和蕾哈娜，其他四位角色的存在感不太強烈，其實不用那麼奢侈，換上本土的演員陳珮騏

  、苗可麗、侯怡君、甚至王彩樺，如果她們英文夠流利的話，相信都能勝任。最後，來一

  首十四行詩點評：


  瞞天過海八面玲瓏有人簡稱八婆，

  此名稱帶有性別歧視建議別再說，

  本片第一天上映我隨即買票入座，

  整個觀影過程內心淌血越趨難過，

  沒料到毫無衝突劇本竟如此薄弱，

  難道導演想把金酸莓獎項全囊括？

  泱泱好萊塢電影竟如此自甘墮落，

  原來會拍出山寨作品不只有中國，

  全片跟小時代一樣比誰排場闊綽，

  浪費了安海瑟薇和凱特以及珊卓，

  這不像一場電影反而像一場災禍，

  完全不想再提到本片我怕會發火，

  我比較期待下週歐馬希他的新作，

  他曾主演的逆轉人生是上等好貨！


  九品中正制度評分：八品，下中之作。

  （一品最高，九品最低）


  【同場加映】

