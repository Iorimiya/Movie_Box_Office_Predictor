url: https://www.ptt.cc/bbs/movie/M.1529252794.A.DB8.html
title: '[好雷] 瞞天過海：八面玲瓏'
content: '個人認為，本片適合以下族群欣賞：


  1 珊卓布拉克的粉絲

  2 凱特布蘭琪的粉絲

  3 安海瑟威的粉絲

  4 其他出演者的粉絲

  5 剛好有兩個小時空檔且不打算在電影中追求深刻意義者



  我不是對珊卓布拉克／凱特布蘭琪／安海瑟威以外的主演者有什麼意見，純粹就是我不

  記得其他演員的名字而已（覺得尷尬）


  要說劇本有沒有缺點當然是有，六磅重的項鍊從脖子上不見沒有第一時間發現，然後沒人

  去質疑項鍊為什麼會從水裡撈出來這兩點。前者還可以靠著倒帶回溯，說明是安海瑟威主

  動配合演出，但後者再怎麼努力都難以自圓其說，所以還是當作沒看到這個缺點好了。


  整體而言，八面玲瓏基本滿足了我進戲院時的期待，也就是看八個主要角色恰如其份的演

  好一齣以竊案為題材的喜劇電影。再加上珊卓布拉克配凱特布蘭琪的百合氣場，還有鏡頭

  對安海瑟威重點部位的特寫，作為約會電影其實已經很足夠了。


  不過安海瑟威可以不要把演技浪費在那些呻吟和哭哭鏡頭上嗎www（稱讚意味）



  整部片最大的優點就是流暢，敘事節奏單純明快，不會有讓人想拿手機起來看現在幾點的

  衝動。我依稀記得看血觀音時整場看了大概五六次時間，覺得時間過得太慢。但八面玲瓏

  就不會有這種問題。


  本片就是順順的講好一個故事，讓觀眾在大概兩個小時左右的時間中（以表定進場時開始

  計算）可以好好的放空，在該笑的笑點哈哈大笑，其他時候好好欣賞八位女星恰如其份的

  表演而已。不要覺得這好像沒什麼，有些高成本大片還不一定能夠做到這種基本水準。


  總之如果剛好有兩個小時左右空檔的話，我蠻推薦去看瞞天過海八面玲瓏的，至少本片可

  以讓大腦重開機，釋放一些不必要的多餘思緒，讓觀影者回家可以好好睡上一覺，重新迎

  接令人肚爛的另一個工作天。


  對於娛樂電影還需要要求些什麼呢？


  --

  ，和狹路相逢，面對瘋狂進攻的真選組，

  犧牲了，不屈不撓的攘夷志士，混戰之中又有

  負傷，但又有加入，並殺死，那麼有

  幾個？


  　　　　　　　　　　　　　　　　　　《》


  --


  會被這樣誤解我覺得很遺憾．．．真的很遺憾orz


  這部片之所以好就是好在劇情一路通暢到底，觀眾不需要太花時間去深究到底是不是隱藏

  了什麼重要的人生意義。連續假日的晚上進場看電影，我也只是想看到這樣的娛樂電影而

  已。


  對於一開始就很確定進場目的是看女星／看娛樂電影的觀眾而言，這部片確實是好雷。


  至於要在電影中追求什麼深刻意義的觀眾而言，這部片不適合他們。


  人的記憶真是不可靠，一不小心就讓項鍊多了900公克XDDD'
