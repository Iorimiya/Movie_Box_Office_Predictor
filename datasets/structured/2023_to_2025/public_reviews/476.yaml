url: https://www.ptt.cc/bbs/movie/M.1718091121.A.A14.html
title: '[討論] 瞞天過海1-3 Ocean''s Eleven to Thirteen'
content: "如題 想請問版上的大家 從原本的11人到13人 是多了誰 (繼續期待Ocean's Fourteen)\n\n第一集歐遜的11人就是歐遜找來原本就互相認識的江湖老千騙徒(含有錢人魯本)\n\
  (除了菜鳥萊納斯是來學習 其實爸媽是白道雙魔 果然黑白都是行騙一家人)\n\n\n第二集的第12人 絕大部分人說是歐遜老婆 泰絲\n             \
  \  有部分人說是指製作全投影擬真金蛋的羅曼\n               少部分人說是萊納斯的歐洲刑警警司老媽\n               總之 絕對不會是布魯斯威利\
  \ 哈\n\n(更少的人說是羅斯帝前女友 神偷的女兒 伊莎貝)\n\n\n第三集的第13人 有人說是第一集被騙的賭場老闆 泰瑞班尼迪克\n          \
  \     少部分人說是萊納斯的賭城探員老爸(嘲笑兒子的假鼻子)\n\n有空可討論看看 感謝各位寶貴時間\n(法蘭克 索爾上天堂了 希望瞞天過海第四集能真的趕快開拍啊)\n\
  \n--"
