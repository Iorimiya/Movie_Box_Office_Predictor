title: '[新聞]《瞞天過海》金獎名導史蒂芬索德柏認為超 '
content: '《瞞天過海》金獎名導史蒂芬索德柏認為超級英雄片「不真實」：裡面的角色都沒在做愛


  超級英雄是當代最受歡迎的題材，卻也是最受影壇圈內人士批評的對象，馬丁史柯西斯（

  Martin Scorsese）、雷利史考特（Ridley Scott）、法蘭西斯柯波拉（Francis Ford

  Coppola）等多位大導演都認為，市面上多半的英雄片是空虛、缺乏內涵的速食娛樂。

  同樣是資深大導的史蒂芬索德柏（Steven Soderbergh）雖未如其他同行那麼樣地對超級

  英雄反感，但他也點出了超級英雄題材通常所欠缺的元素。


  日前為宣傳新片《聲控 KIMI》（Kimi）而接受《每日野獸》（The Daily Beast）專訪的

  索德柏，在被問及是否有接導系列大片的意願時，他回答：「沒有這個意願，我並不是那

  種勢利眼的人，我並非覺得超級英雄片是低等的東西，重點是在於哪個宇宙是你能以說書

  人的身份融入的，我太講究真實性了，我無法真正讓自己進入到一個不存在牛頓物理學的

  宇宙之中（笑），我只是單純在這方面缺乏想像力。」


  索德柏繼續解釋：「這也就是為何我對純科幻類型（2002 年的《索拉力星》）的唯一一

  次嘗試，本質上其實只是一部剛好發生在太空船上、著重角色刻劃的劇情片。還有，就我

  對超級英雄世界、如何編寫這種類型、或監督這種故事和角色如何編寫的理解 — 除了可

  以扭曲時空、克服地心引力、從手指射出超能光波之外 — 沒有任何打砲戲！沒有任何角

  色在打砲！這就好像他們不知道該如何告訴觀眾，在劇中那個性愛並不存在的世界裡該怎

  麼正常生活似的。」


  「據我所知，在那種奇想的世界觀裡頭，通常並不會涉及到太多的打砲戲碼，或是像『是

  誰付這些角色薪水的？誰都在為誰工作？他們那份工作又是怎麼來的？』這類事情。」索

  德柏說道。


  事實上，索德柏不是第一個指出超級英雄缺乏性愛元素的導演，佩德羅阿莫多瓦（Pedro

  Almodóvar）過去也曾表示：「市面上有很多關於超級英雄的電影，但沒有一部是跟『性

  慾』有關的，他們就像被絕育似的。在獨立電影裡，你可以找到更多和性慾有關的元素。

  人類明明有很多的性慾啊！」





  --'
