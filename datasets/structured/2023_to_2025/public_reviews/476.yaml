title: '[好雷] 瞞天過海  八面玲瓏'
content: '帶著異常興奮的情緒看這部片

  喬治克隆尼與布萊德彼特的瞞天過海三部曲

  我各個看了不下數十次

  所以心中有個標準

  這一部 沒讓我失望

  有出續集的條件

  也能見好就收一集經典女版


  （以下有雷）





  先說點別的

  眼前的螢幕 放映着一部片

  可我眼睛同時看到1＋3部






  喬布版的人馬 有出現兩位

  分別在一開始及結尾

  Ruben and magic Yen

  喔 如果連墓碑上的

  “Danny Ocean”也算的話

  有三個

  丹尼歐遜真的掛了嗎？

  誰知道 （笑）


  最一開始的假釋

  對應第一集開頭

  喬布在儲藏室談心

  也有類似場景

  最後分贓及栽贓的劇情

  非常有Ocean風格

  東方臉孔女角對應Yen

  Yen的劇情呼應瞞2的夜狐

  安海瑟威讓我想到瞞2的

  假●茱莉亞羅勃茲

  許許多多的呼應

  或許是我腦補


  但無疑的

  連音樂一出 就是滿滿的

  瞞天過海feeling

  不能算續集 沒有爛梗砸招牌

  真的很厲害


  其實心裡也知道

  縱使Danny Ocean沒掛

  也不可能原班人馬重啟續集

  大家都老了

  撇開麥特戴蒙

  就只有最近在mavel 出現的

  就鋼鐵人好朋友的唐奇鐸

  及死侍的隱形人布萊德彼特

  其餘少在電影出現了



  現在還沉浸  好想二耍


  -----

  Sent from JPTT on my Samsung SM-A730F.


  --'
