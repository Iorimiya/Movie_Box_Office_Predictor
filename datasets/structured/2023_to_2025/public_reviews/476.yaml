url: https://www.ptt.cc/bbs/movie/M.1489390076.A.BD3.html
title: '[新聞] 女版《瞞天過海》會跟《魔鬼剋星》一樣'
content: '新聞網址：


  自由


  女版《瞞天過海》會跟《魔鬼剋星》一樣挨轟嗎？安海瑟薇這麼說


  〔記者陳昱均／綜合報導〕結合恐怖、搞笑與抓鬼等元素的1984年經典恐怖喜劇《魔鬼剋

  星》，在32年後的去年被重啟翻拍，不過在這次的新版電影裡，打鬼的4名男主角卻突然

  「性轉」成了4名女子，一開始因為這個巨大改變遭致許多資深影迷的砲轟，認為電影公

  司無疑是要把一部經典之作給毀了，雖然後來該片正式上映後，口碑跟票房都衝出亮演好

  成績，但依然充滿不少爭議。而總是聚集一票大咖拍攝而成的《瞞天過海》系列電影，也

  將推出「性轉」的新版本，包含珊卓布拉克、蕾哈娜、凱特布蘭琪、安海瑟薇、海倫娜波

  漢卡特、莎拉保羅森等天后級卡司都共同參演，但有不少粉絲依然相當擔心該片會得到跟

  《魔鬼剋星》一樣的負評。


  安海瑟薇最近在受訪時就被問到了這個最令粉絲感到擔憂的問題，對此她就形容：「每當

  我在一部電影裡演出第2或第3女主角時，通常第1跟第2主角會是男性，讓我的角色看來也

  完全沒有什麼政治性意味；但當我擔綱演出第1女主角的時候，這就突然變成了一個『女

  人的故事』，而且還成了一種主張。」安海瑟薇說這就是現在好萊塢女星們平時會面臨的

  狀況，然而新版《瞞天過海》電影中則足足有8名女性來演出，安海瑟薇認為這有助於分

  散關於性別的注意力，並笑稱：「那些想要搶走珊卓布拉克跟凱特布蘭琪風頭的人，只能

  說祝你們好運，因為你們是根本不可能贏的」，展露對於女版《瞞天過海》的強大信心。


  安海瑟薇（右）與海倫娜波漢卡特（左）都參演了最新《瞞天過海》電影的演出。（翻攝

  自太陽報）



  先前資深影迷曾不滿《魔鬼剋星》主角群變成女性，不過上映後觀眾卻反應熱烈。（索尼

  提供）



  女版《瞞天過海》的卡司十分強大，包含凱特布蘭琪、珊卓布拉克、安海瑟薇、莎拉保羅

  森、Awkwafina、蕾哈娜、海倫娜波漢卡特、敏迪卡靈等人都共同出演。（翻攝自蕾哈娜

  Instagram）


  --

  精靈女王的氣場不是說笑的~~


  --'
