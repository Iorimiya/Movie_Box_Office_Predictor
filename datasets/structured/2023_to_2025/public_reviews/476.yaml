title: '[普好雷]《瞞天過海：八面玲瓏》誰說女生不能出頭天？'
content: '以下有雷


  痞客邦圖文版：









  《瞞天過海：八面玲瓏》是一部美國犯罪搶劫電影，由蓋瑞·羅斯執導，本片延續史蒂芬


  ·索德柏從2001年以來三部《瞞天過海》系列電影世界觀，並加以擴張成全女性角色組成


  的女版劫盜電影。除了卡司加入包含珊卓·布拉克、凱特·布蘭琪、莎拉·保羅森、安·


  海瑟薇與海倫娜·寶漢·卡特…等極華麗的堅強陣容，內容其實與《瞞天過海》大同小異


  ，講述一個由兩位主角集結各路好手，並利用完美計畫來完成一場價值一億五千萬美金鑽


  石項鍊的驚世搶案。




  《瞞天過海：八面玲瓏》官方英文片名為《Ocean''s 8》，不過電影中則顯示為《


  Ocean''s Eight》。有趣的是，前作三部曲《Ocean''s Eleven》、《Ocean''s Twelve》和


  《Ocean''s Thirteen》的數字代表著片中主要角色的人數，《Ocean''s Eight》可以說是


  先為未來不知道有沒有的《Ocean''s Nine》或《Ocean''s Ten》兩部續集留了空間。而這


  次《瞞天過海：八面玲瓏》也不像前作眾多人數會使觀眾混亂，剛剛好的八人小隊使戲份


  更為平均，八人八色，每人各有其迷人之處。




  我雖然是一個被《瞞天過海》高智商的搶劫戲碼拉進坑的劫盜電影粉絲，但《瞞天過海：


  八面玲瓏》最吸引我的，反而是片中這些女星同場交鋒的時刻。珊卓·布拉克與凱特·布


  蘭琪兩位實力派影后正常發揮，角色間的火花比起《瞞天過海》喬治·克隆尼和布萊德·


  彼特還強烈不少，其他除了海倫娜·寶漢·卡特有點古靈精怪中帶點瘋癲之外，安·海瑟


  薇也再次展現出她那看似漂亮傻妞、實則帶點心機的多樣魅力。不只如此，由莎拉·保羅


  森飾演到VOGUE雜誌打探場地資訊的譚美更是亮眼，她在子女和跟隨黛比復出江湖兩者的


  抉擇，更能讓觀眾感受到搶劫任務對她們的誘惑，過程中帶給人的刺激與成功之後所帶來


  的成就感，是無法說走就走、輕易抽離的。




  另外，《瞞天過海：八面玲瓏》明顯有著史蒂芬·索德柏的影子，承襲《瞞天過海系列》


  的快節奏風格，從開場的角色建立，到前期策劃、尋找合適人選，最後開始行動一氣呵成


  ，就說明他是非常具有娛樂性的電影。




  不過就一部劫盜電影而言，縱使節奏快速，笑點掌握得宜，卻無法掩蓋它缺乏驚喜的缺點


  ，計畫得滴水不漏是件好事，但就是整個過程太過完美、少有起伏，從事前工作開始到正


  式行動幾乎沒遇到任何大阻礙，片中看起來最大的項鍊鎖危機，居然2.3分鐘後就被一個


  只是配角的路邊小女孩迎刃而解。我想如果把這個危機留到搶案時再揭露，不失為另一個


  更好的做法，除了能多描寫一些角色的臨場反應，也會讓電影更有劇情張力一些。




  《瞞天過海：八面玲瓏》把珊卓·布拉克設定為《瞞天過海》中喬治·克隆尼的妹妹，間


  接延伸了歐遜(Ocean)家族故事的可能性，加上片中幾位前作角色的回歸，也讓人更加期


  待男版和女版之間的連結。不過問題又來了，就我而言，此類電影最重要要素正是搶劫的


  手段，它可以華麗，只是方法必須合乎常理，才能真正讓觀眾感到信服。《瞞天過海：八


  面玲瓏》一些不合理小破綻就先不說，片中最讓我感冒的則是《瞞天過海》就曾出現過，


  會體操、有極佳柔軟度的華人小顏，他在劫盜電影中就是個外掛般的存在，確實他的出現


  可能會讓老粉絲感到驚奇，但對一般觀眾來說，讓一個從來沒見過的猴子來影響搶案成果


  是有一點突兀，《瞞天過海：八面玲瓏》以這種無敵兼無腦的方式收尾，正是顯示編劇已


  黔驢技窮，光想著設計《瞞天過海》那種看似失敗，實則成功的回馬槍，卻不知道成果只


  能稱得上讓人摸不著頭緒的拙劣模仿，是比較可惜的地方。




  總而言之，《瞞天過海：八面玲瓏》以劫盜電影來說，劇情面不算什麼精彩絕倫，甚至還


  輸給史蒂芬·索德柏去年的《羅根好好運》，最後二十分鐘也看不出幫續集鋪梗之外的其


  他實質意義。不過以娛樂角度來看它已在水準以上，除了像達科塔·芬妮客串出場的眾多


  名人使觀眾眼睛為之一亮之外，片中八位女演員也輕鬆就發揮能讓人喜愛的螢幕魅力，另


  外與前作類似風格的配樂也為她們搶劫戲碼增添不少駕輕就熟之感，是誰說只有男人才能


  成大業？《瞞天過海：八面玲瓏》就跟觀眾與夢想成為大盜的八歲女孩證明，一群女生一


  樣也能出頭天。



  --


  歡迎到我新創的FB專頁按讚



  --

  不會，你要這樣刻意解讀我也沒辦法'
