title: '[討論] 瞞天過海3的一句台詞'
content: '這應該不用防雷吧？


  班克在開頭吃掉魯本股份時，魯本有跟他說

  「你和法蘭克辛納區握過手，你不可以這樣對我」

  班克也冷冷回他

  「我和法蘭克辛納區握過手？那又代表什麼意思？」


  丹尼歐遜在最後搞垮班克的賭場時也一樣對他說

  「你和法蘭克辛納區握過手，你知道那代表什麼意思」


  印象中這句台詞就至少出現過三次

  我只知道法蘭克辛納區是很有名的爵士樂手

  但時至今日這部電影也看了不下十次，還是不懂這句的典故


  有鄉民可以幫解惑嗎


  --'
