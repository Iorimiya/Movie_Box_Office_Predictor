url: https://www.ptt.cc/bbs/movie/M.1181404887.A.7A6.html
title: '[無雷] 瞞天過海：十三王牌'
content: "記得瞞天過海第二集《Ocean's Twelve》的DVD分三次看才看完，\n其劇情與第一集《Ocean's Eleven》相似，\n因此在原創性上就令人有些失望，\n\
  不過裡面仍然有一些笑點蠻有趣的，\nVincent Cassel那一段優雅柔軟地閃躲警示光束也令人印象深刻。\n請見下面連結影片，並打開喇叭，這段音樂配的很棒！\n\
  \n但整體而言，第二集《Ocean's Twelve》故事結構性不強，\n除了沒有第一集的新鮮感外，娛樂效果也因此大打折扣。\n\n查了一下，網路的評價也是如此，\n\
  第一集《Ocean's Eleven》在IMDb有7.5分，\n但第二集《Ocean's Twelve》在IMDb只剩下6.0分。\n\n衝著這次《Ocean's\
  \ Thirteen》有Al Pacino的演出，\n儘管這個週末仍有三個報告要趕，\n下午仍跑去威秀看《Ocean's Thirteen》。\n\n我不知道其他人看完這部電影後評價如何，但我覺得非常讚，\n\
  而IMDb目前的7.3分跟我想像中差不多。\n\n由於第二集劇情已經失去原創性的新鮮感，\n第三集就不會有特別的期待，果然劇情發展大同小異。\n但這一集有趣的地方在於，笑點實在太多了！\n\
  許多小細節、對白、動作、表情，都非常好笑！ XD\n\n這一陣子看了許多電影，看完後心情多少會隨劇情所影響，\n例如《羊男的迷宮 Pan's Labyrinth》，\n\
  或是最近看的《神鬼奇航 Pirates of the Caribbean: At World's End》，\n雖然成功的劇情片就是要引起你的共鳴，\n但看完之後總會覺得結局於有遺憾，心情也就不怎麼放鬆。\n\
  \n而《Ocean's Thirteen》完全就是適合放鬆的電影，\n百分之百的娛樂效果，make you happy, make you laugh!\n\n\
  如果想放鬆的話，千萬別錯過這部電影，\n然後好好enjoy裡面有趣的演員對白與表情詮釋吧。\n\n\n--\n\n  Drive to my World:\n\
  \    \n\n--\n◆ From: 61.229.30.171"
