content: '前幾天複習了瞞天過海



  雖然是很久以前的老片了

  但還是相當有意思，卡司也是一整個強大

  而且最強的是要角這麼多，

  兩小時的時間裡頭，居然可以把每一個人形象都呈現的如此鮮明

  史蒂芬·索德柏真的強到不行啊w


  一不小心就把四部曲都看完了

  覺得第一部和第四部最好看

  尤其是第四部根本是第一部的翻版w


  但我還是覺得第一部最經典

  ……想求一下有沒有其他也是以詐騙、偷盜為主題的電影？

  （小說或劇也行啦XD 總之就是想看類似的～～）


  -----

  Sent from JPTT on my Asus ASUS_Z01RD.


  --

  感謝推薦，詐騙女王居然是嚴正化演的欸，好像不錯

  這部我倒是蠻喜歡的'
