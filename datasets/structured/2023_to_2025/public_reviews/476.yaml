title: '[新聞] 瞞天過海製片 溫特勞布過世'
content: '（中央社記者吳協昌洛杉磯6日專電）


  好萊塢名製作人溫特勞布（Jerry Weintraub）今天在家中去世，享壽77歲。


  在紐約出生的溫特勞布是好萊塢首屈一指的製作人，在電影與電視都有出色的表現。溫特

  勞布剛出道時，主要是擔任音樂經理以及行銷，曾與著名鄉村歌手丹佛（John Denver）

  合作，也曾為「貓王」艾維斯普里斯萊（Elvis Presley）以及法蘭克辛納屈（Frank

  Sinatra）、齊柏林飛船（Led Zeppelin）等演唱會行銷。


  溫特勞布在1975年正式涉入電影圈，2001年，他與喬治克隆尼（George Cloony）合作的

  「瞞天過海」系列，可以說是代表作。


  喬治克隆尼在得知溫特勞布的死訊之後，也發表聲明說，「我們都為他的偉大故事歡笑，

  為他的成就喝采。」喬治克隆尼強調，今天他失去了一個好朋友，不管是不是認識溫特勞

  布，大家都很愛他。


  著名主持人賴瑞金（Larry King）也在推特上表示哀悼，他說，溫特勞布的去世令人驚訝

  ，他是一個傳奇，他的去世是整個娛樂產業的重大損失。


  ------------------------------------------------------------------------------





  （中央社洛杉磯6日綜合外電報導）


  電影「瞞天過海」、「小子難纏」製作人傑瑞溫特勞布（Jerry Weintraub）逝世，享壽

  77歲。影星喬治克隆尼（George Clooney）和美國前總統老布希（George H.W. Bush）

  等人紛紛致上哀悼之意。


  法新社報導，在「瞞天過海」（Ocean''s Eleven）中擔綱的喬治克隆尼、美國前總統老

  布希等人紛紛致上哀悼之意。


  傑瑞溫特勞布的作品包括「餐館」（Diner）、「小子難纏」（The Karate Kid）和1998

  年的「復仇者」（The Avengers）。


  喬治克隆尼在聲明中表示：「幾天後將有許多人緬懷歌頌他，我們會對他精彩的故事歡

  笑，為他的非凡成就鼓掌。」


  「幾年後，隨著時間過去，他的故事和成就會越陳越香，就如傑瑞所願。但不是今天，

  今天我們的朋友走了。」


  發言人貝加（Michelle Bega）向法新社表示，傑瑞溫特勞布在加州聖巴巴拉（Santa

  Barbara）因心臟衰竭離世。


  老布希說：「傑瑞是個獨一無二的人，他全憑直覺、幹勁和桀驁不馴的性格來取得成功

  。他對人生充滿熱情。」


  「我們週刊」（Us Weekly）報導，演出1984年「小子難纏」和1986年續集的雷夫馬奇歐

  （Ralph Macchio）在推特發出他跟傑瑞溫特勞布的合照緬懷他。


  傑瑞溫特勞布除了幕後工作，也偶爾會在幕前露面，他在「瞞天過海」3集中每部都有演

  出戲份不重的小角色。


  （譯者：中央社陳昱婷）


  ------------------------------------------------------------------------------


  參考外電：CNN + Variety

  Jerry Weintraub, ''Ocean''s Eleven'' producer, dies at 77




  好萊塢與Jerry Weintraub合作過藝人在網路上的哀悼辭整理



  另外也補充另外一位好萊塢大咖威爾史密斯對這件事的反應

  (他曾經與溫特勞布合作小子難纏的重拍版「功夫夢」，威爾目前沒有

  在推特發文的習慣，因此一些外電媒體並沒有整理到他的文章)



  心得︰Rest In Peace，也感謝他對電影的貢獻！


  --'
