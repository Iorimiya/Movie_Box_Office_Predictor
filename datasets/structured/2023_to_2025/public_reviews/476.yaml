url: https://www.ptt.cc/bbs/movie/M.1529137927.A.DAB.html
title: 'Re: [吵架雷] 瞞天過海8面玲瓏'
content: '我覺得不是版友的標準太高....


  吵架罵髒話為何要避而不談？


  我覺得看電影本來就不應該講話，想講話的話你可以自己租片回家看、講到爽。


  我的認知是看電影基本上是不要講話、滑手機、發出噪音等任何影響他人的舉動，

  我能接受的只有隨著劇情發出的聲音，像是笑聲、驚呼聲等等。


  我本身也很愛看電影，去年只看了105部(同一家電影院)。


  以前沒被人制止並不代表你的行為是正確的，或許被你吵到的人只是懶得理你，

  就像是紅線臨停有多少人會真的去檢舉？

  我本身也是懶得去罵人，因為不想為了罵人而錯過任何劇情，

  老娘我花兩百多塊錢來電影院只想好好欣賞電影而不是聽你講話的啊！


  請問你跟你老婆是無法自主行動嗎？

  口渴要喝水是不會自己拿飲料起來喝嗎？

  肚子餓想吃東西是不會自己拿爆米花吃嗎？



  雖然我很討厭看電影有人講話、滑手機等等，


  一開始我會忍，想辦法逼自己融入劇情，


  因為我不想為此而錯過任何劇情，不值得阿～


  但是真的受不了還是會出聲制止，可是還是遇到很誇張的案例。


  我今年看了快50部，幾乎都是上映當日或當週去看，


  想當然爾一定遇到很多奇葩，


  像是有一次看12猛漢的時候，旁邊好死不死有一對情侶，


  要先說明一下，基本上我都是坐中間偏前的排數，加上都是平日下午去看，


  所以幾乎很少遇到前面左右有人的。


  這對情侶女生坐我旁邊，正片開始了之後才進場，


  坐下來沒多久就開始講話，


  有時候講劇情、有時候是跟男伴講說片中角色做了什麼事這樣，


  講到大概1/3片長的時候我就真的受不了，


  講了一句「可以不要一直講話嗎？」


  以為這樣就沒事了嗎？


  她小姐不能講話之後就拿手機出來滑了！！！


  此時我真的沒辦法逼我自己融入劇情了，


  隨即講了一句「可以不要滑手機嗎？」


  她才默默把手機收起來，但是包包又是開的，然後就一直有亮光跑出來。


  沒手機滑之後，又按耐不住的三不五時跟男伴講話，


  雖然有變小聲但是我還是聽得到阿阿阿阿阿！！！


  但是這個時候我已經懶得出聲罵了，只想好好把電影看完。



  還有一次是一級玩家二刷，


  後面坐了一個男生加兩個女生，男生似乎也是二刷，


  因為一直爆雷講劇情給女生聽，好險我老公看得很專注沒被影響到，


  不過這種男生講解劇情給女生聽已經遇到不勝枚舉了。



  最近則是在看末世異種的時候遇到超扯的，


  好險電影本身不好看，不然我會難過。


  一樣也是情侶、女生坐我旁邊，不知道是不是男生被女生拖來看電影，


  整場90分鐘的電影，男生都在滑手機聊天，而且還兩隻手機一起滑，


  我看男生幾乎都沒有抬起頭來看電影，


  只要男生滑完手機，女生就馬上轉過去跟男生講劇情，


  大概忍到片長2/3我才講了一句「可以不要一直講話嗎？」


  電影播完之後原本想開噴的，結果他們走超快，男生還叫女生你快一點你快一點，


  真的是傻眼，生意做這麼大就去忙阿，幹嗎要來電影院裡傷害別人，


  唯一慶幸的是好險是女生坐我旁邊，有擋住手機光害，不然我真的忍不到結束。



  還有看死侍2的時候旁邊坐個工程師，看到最後面決戰的時候被on-call，


  雖然很不爽但是還是幫他QQ




  我覺得大家都是花錢來電影院享受的，沒有人有義務要包容你的行為，


  而且大家都是成人了，如果你真的無法控制自己不要影響到他人的話，


  那你還是租片子回家自己看不是很好嗎？


  想討論劇情的時候還可以按暫停倒轉，不是可以討論得更徹底嗎？


  --

  一年超過100還好吧，差不多一週看兩部，

  基本上我是只要劇情有興趣或演員有興趣的都會去看，

  去年沒有二刷，都是首輪片，今年唯一二刷的是一級玩家，一刷2D、二刷3D，

  但是鬼片不敢看，驚悚片只能接受到「牠」的等級。


  真的一年100還好，只是桃園真的沒什麼影城選擇，

  要看冷門片只能去星橋看，星橋又動不動就改廳QQ


  其實我電影票也差不多不到兩百，看電影專用的信用卡還蠻好用的～'
