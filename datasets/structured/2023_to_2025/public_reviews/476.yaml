url: https://www.ptt.cc/bbs/movie/M.1707659886.A.FC0.html
title: '[好雷] 《還錢》瞞天過海的賀歲喜劇 彩蛋有巧思 '
content: "《還錢》瞞天過海的賀歲喜劇，彩蛋客串有巧思\n\n《還錢》是2024年台灣的賀歲喜劇電影強檔，劇情有如《瞞天過海》加《出神入化》的竊\n盜情節，不過喜劇搞笑的梗很多，就是要讓觀眾大過年開開心心在電影院。導演王鼎霖在\n\
  編劇執導上，留意不少笑點細節，演員的彩蛋安排也有巧思。吳慷仁在這部電影的表演，\n真的太強大了，搭配高英軒和吳志慶的反派配角，看完記憶點超過了陳柏霖和「女二」林\n\
  哲熹的CP。\n\n\n《還錢》陳柏霖的竊盜集團是主角群，但主場在吳慷仁的反派戲\n\n《還錢》在故事推進和角色的塑造上，仍有一些不足，不過藉著演員的表演和喜劇過場，\n\
  不會讓你消化不良，看不下去。（以下有部分劇透）\n\n愛德華必須說，主角群雖然是陳柏霖、蔡思韵、李銘忠、林哲熹及蔡凡熙五人，但吳慷仁\n搞怪的ABC口音，中英文夾雜，不時眼神耍狠，這個反派太迷人了，搭配老大位置不穩的\n\
  高英軒，和冒出頭的小弟吳志慶，這三人的組合，電影最好笑的點，幾乎就在他們三個角\n色上。\n\n\n黑吃黑的劇情轉折到炸彈蔥油餅的還錢過程\n\n《還錢》電影裡安排主角群的兄弟情誼、曖昧關係、家人友情及愛情的五味雜陳，在搶完\n\
  錢要還錢回去的過程，一一考驗著他們。\n\n先是陳柏霖飾演的張博駿率領的竊盜集團，接了案子搶了銀行10億，結果中了圈套，想還\n錢回去，在遇上前女友又生變，計劃趕不上變化。最後每個角色，運用專長齊心合作，反\n\
  將吳慷仁白手套的銀行家一軍。\n\n這部電影還有特別的地方即在動作創意的設計上，如跳舞般的避開紅外線防盜感應器，還\n有異想天開的炸彈蔥油餅等。\n\n\n《還錢》挖苦自己的角色彩蛋\n\
  \n《還錢》不少台詞，觀眾聽懂應該會發笑，像是李銘忠是做工的人，蔡凡熙有不少冷笑話\n。\n\n至於最驚喜的客串彩蛋，在結局結尾，澎恰恰出場（當然也有「還錢」味），致敬王鼎霖\n\
  自己的前作《第九分局》。\n\n\n 愛德華 FUN電影\n\n\n\n\n--"
