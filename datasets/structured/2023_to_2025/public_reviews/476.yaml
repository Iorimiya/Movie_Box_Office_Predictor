title: '[  雷] 瞞天過海:八面玲瓏心得'
content: '剛在洛杉磯周四10點半晚場看完

  通常這時間來看都很少人

  對這邊的人來說已經很晚了

  但今晚這場卻是幾乎爆滿

  大家看的過程中都很愉悅

  我覺得好笑的地方處理得比漫威好

  不會太刻意為有笑點而加笑點

  與之前的三部曲有相關但又不多

  承先啟後處理地蠻好的

  可以預見續集了


  我從小就很愛看這種智慧型犯罪

  這部沒有讓我失望

  這部片用了魔術的手法

  給一個焦點吸引眼光

  真正的計畫在背後運行

  案中案的設計不錯絕對不只預告那些

  八位女性的戲份也處理得不錯

  至少看完每個人幹了什麼都記得

  不像之前11個人有些真的存在感很低


  當然一部片不可能盡善盡美

  這部要吐槽的點也是不少

  以下有些雷請自行斟酌




















  整體行動其實不夠嚴謹

  最後也被發現

  但發現的兩個人都不說

  一個是沒朋友覺得這種一起犯罪的朋友好像很不錯就加入

  一個是跟Ocean家族鬥了好幾次的變成亦敵亦友

  沒有真的想要追究只要給點東西能交差就好

  相對於之前三部曲事情做完不會追到自己身上

  這部整個就是打神運牌

  不然光珊卓的腳色離開宴會時被拍到這點

  一調查下去她非回監獄不可

  另外一個很大的紕漏就是那個鑽石項鍊

  明明有強調要用特殊磁鑰才能解開從脖子上拿下

  但當事情快曝光而讓其中一人趕快從水池裡拿出預藏的假項鍊

  然後再說:一定是你跑去廁所的時候掉的

  那種設計根本不可能會跑一跑就掉

  然後那些安全保鑣看到項鍊找到也就算了

  這裡是我覺得很隨便帶過的地方

  當下只要負責磁鑰那個人說沒磁鑰拿不下來

  不可能跑一跑會掉然後馬上找人驗貨就知道是假貨

  那Ocean一夥就跑不掉了

  我覺得編劇想增加難度結果一個太難了無法解套只好呼嚨過去


  再來就是有幾幕根本可以刪掉

  讓劇情可以更緊湊一點110分有點太久

  拿來跟前作多作點連結也不錯

  電影一開始假釋面談那邊就直接對哥哥說RIP了

  對話中也一直用過去式

  之後也有墓園裡的名字直接賜死

  到最後一幕主角去墓園我都期待她哥會出現在她身後

  畢竟這是一個以騙人為主題的電影跟家族

  要詐死應該不是不可能可惜沒有出現

  或許是因為片商想試水溫吧

  畢竟離前作已經11年加上又是女子版

  沒把握一定有續集所以就不喬克隆尼來客串


  整體而言我蠻享受這部電影的

  雖然因為我是男的對裡面時尚完全不感興趣

  但絕對值得去電影院一看

  我不太二刷的人會想二刷這部

  我也期待續集可以說她哥是詐死

  不然直接這樣賜死我實在無法接受啊


  --'
