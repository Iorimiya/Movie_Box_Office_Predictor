url: https://www.ptt.cc/bbs/movie/M.1737642476.A.3FE.html
title: '[新聞] 第四集《瞞天過海》敲定由《子彈列車》'
content: "第四集《瞞天過海》敲定由《子彈列車》導演大衛雷奇執導！喬治克隆尼和布萊德彼特仍\n在洽談回歸演出\n\n\n\n看來丹尼歐遜和拉斯提萊恩將進行最後一次大規模竊案，而這次他們還帶上了《子彈列車\n\
  》的導演大衛雷奇！\n\n據報導，大衛雷奇正在洽談執導《瞞天過海14》(Ocean’s 14)，並計畫邀喬治克隆尼和\n布萊德彼特回歸演出。去年，克隆尼透露電影的劇本已經準備就緒，靈感來自另一部經典\n\
  竊案電影。\n\n當時他對《Uproxx》表示：\n\n    「我們現在有一個非常好的《瞞天過海》新劇本，所以我們可能會再拍一部。這是一\n個很棒的劇本。我不想稱它為《瞞天過海14》，它的概念有點像《瀟灑搶一回》。」\n\
  \n《瀟灑搶一回》講述了一群退休老人，因為厭倦了日復一日的無聊生活，決定搶劫銀行，\n為自己的晚年生活增添一點樂趣。\n\n史蒂芬索德伯格曾執導《瞞天過海》、《瞞天過海2：長驅直入》以及《瞞天過海：十三\n\
  王牌》。2001 年的電影改編自 1960 年的經典之作，同時成為全球票房大賣的作品，為\n竊案電影類型注入新生命。喬治克隆尼飾演的丹尼歐奧遜與布萊德彼特飾演的「永遠在找\n\
  東西吃」的拉斯提萊恩，搭配麥特戴蒙、茱莉亞羅勃茲以及唐奇鐸等群星陣容，成功塑造\n了這個系列特有的幽默、魅力與大型竊案特色。\n\n此外，還有一部全女性版本的衍生作《瞞天過海：八面玲瓏》，由珊卓布拉克和凱特布蘭\n\
  琪主演。\n\n至於史蒂芬索德伯為何不繼續執導《瞞天過海》系列，他在 2023 年接受《綜藝報》採訪\n時表示，他已經說完他想說的話。\n\n    「拍完第三部電影後，我覺得這個系列對我來說已經非常完整了。當片商找我討論是\n\
  否願意繼續參與這個系列時，我告訴他們不會，因為這對我來說並不是一種向前的嘗試。\n我在追尋其他目標。」\n\n--"
