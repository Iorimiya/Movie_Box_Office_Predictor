title: '[新聞]索德柏欽點 珊卓布拉克領軍女版《瞞天過海'
content: '五年多前，導演蓋瑞羅斯（Gary Ross）構思出全新劫盜電影的構想，並將這個概念提供

  給當年《瞞天過海》三部曲的導演史蒂芬索德柏（Steven Soderbergh）看，史蒂芬驚訝

  地表示，蓋瑞羅斯竟然能夠用更精簡的人力，進行一場不可能的搶案！史蒂芬索德柏腦海

  浮現的第一個想法是：「如果由珊卓布拉克來飾演當年喬治克隆尼所扮演的丹尼歐遜妹妹

  ，承接這個系列，應該會很有趣！」，而這也間接觸成了《瞞天過海：八面玲瓏》（

  Ocean''s 8）的成形。


  珊卓布拉克（Sandra Bullock）回想當時接到這部電影的訊息時：「當時只有構想，沒有

  劇本，也沒有演員名單，所以導演問我對演員的想法時，我心中倒是立刻浮現了一堆能夠

  勝任這些角色的人，而且清一色全部都是女生！」。


  全部都由女生主演的想法衝擊了導演蓋瑞羅斯與史蒂芬索德柏，蓋瑞說：「珊卓的建議為

  電影帶來全新的高度與視野，女性主演的想法我們確實有過，惟有在珊卓的建議與幫忙下

  ，一如片中的黛比歐遜一般，我們成功招攬了重量級的女明星，包括凱特布蘭琪、安海瑟

  薇、蕾哈娜、莎拉保羅森、奧卡菲娜、敏狄卡靈與海倫娜波漢卡特等，她很清楚每一位演

  員的長處，也知道她們該負責的位置，如同拼圖一般，組合成一支無懈可擊的菁英團隊，

  讓這部展現女性力量、聰明、智慧、美麗與野心的電影能夠順利拍攝。」。



  升任為製片的史蒂芬索德柏也說：「這幾年女性意識抬頭，女力開始流行，觀眾會很期待

  看著黛比歐遜如何帶領這群來自各方的菁英好手，用比以前更精簡的人數，進行一場驚天

  動地又天衣無縫的劫盜案件。」；珊卓布拉克表示：「犯罪是黛比歐遜的家族傳統，也是

  她喜歡與擅長的生活方式，她享受偷竊與逃脫的快感，而且喜歡挑戰匪夷所思的難度。這

  也是我為什麼喜歡這部電影的原因。」。



  --'
