title: '[LIVE] 瞞天過海八面玲瓏  HBO 21：00'
content: "5年8個月又12天，正在計時中。黛比歐遜（珊卓布拉克 飾）就是花這麼多時間在計劃她\n人生中最大的搶案。\n\n她知道這場計劃需要一群江湖高手，首先她找來她的犯罪搭檔露米勒（凱特布蘭琪\
  \ 飾）\n加入，然後她們號召了一組專家，分別是珠寶商雅米塔（敏迪卡靈 飾）、街頭騙子康斯\n坦絲（奧卡菲娜 飾）、贓物買賣能手譚美（莎拉寶森 飾）、駭客九號球（蕾哈娜\
  \ 飾）\n及時裝設計師蘿絲（海倫娜波漢卡特 飾）\n\n她們的目標是價值1億5000萬美元的鑽石，就戴在聞名全球的女演員達芙妮克魯格（安海\n瑟薇 飾）脖上，她會是年度盛會大都會博物館慈善晚宴的焦點。\n\
  \n這個計劃看似滴水不漏，但一切需要完美無瑕，這群偷天女賊才能在眾目睽睽下順利混進\n去又全身而退。\n\n今天HBO一口氣播了四集，看得很過癮\n這片是第一次在電視上首播嗎？怎麼好像有看過的印象\n\
  \n--\n  [ptt.cc]\n\n--"
