title: '[新聞] 珊卓布拉克領軍全新女版《瞞天過海》首張'
content: '新聞網址：


  珊卓布拉克領軍全新女版《瞞天過海》首張劇照曝光


  文/Jean


  由《飢餓遊戲》（The Hunger Games）、《金爆內幕》（Gold）導演蓋瑞羅斯（Gary

  Ross）執導及編劇的全新女版陣容《瞞天過海》（暫譯，Ocean’s Eight）已經在去年底

  開拍，雖然距離上映時間還有一年半左右，但華納兄弟影業搶先釋出了首張劇照。


  劇照可以看到這次的八位主要成員正在地鐵上，左四為珊卓布拉克（Sandra Bullock）、

  凱特布蘭琪（Cate Blanchett）、蕾哈娜（Rihanna）、敏迪卡靈（Mindy Kaling）；右

  四則是莎拉寶森（Sarah Paulson）、安海瑟薇（Anne Hathaway）、海倫娜波漢卡特（

  Helena Bonham Carter）、說唱歌手 Awkwafina。


  此片的詳細劇情內容尚未曝光，但主要是描寫上述八位「女搶匪」在紐約策畫的一起竊盜

  案，其他堅強的演出卡司還包括達柯塔芬妮（Dakota Fanning）、奧莉薇亞穆恩（

  Olivia Munn）、詹姆斯柯登（James Corden）、達米恩路易斯（Damian Lewis）、李察

  阿米塔吉 （Richard Armitage）、凱蒂荷姆斯（Katie Holmes）等，2018 年 6 月 8 日

  預計台灣同步上映。


  --'
