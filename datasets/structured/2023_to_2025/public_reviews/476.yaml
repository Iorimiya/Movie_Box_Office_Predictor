content: '借標題來聊天一下 ~﹝喂喂 ~﹞

  話說我是 6/15 晚上 8:00 在台中站前秀泰看的八面玲瓏；

  我是坐在第九排，


  下面有雷，留個空白好了 ..


















  話說劇情進展到安海去色誘完克勞德，

  克勞德第二天從自己床上醒來的時候，

  似乎外頭有警車的聲音，而這時電話響了，

  持續地響著 ..


  但克勞德並沒有去接電話，而是默默地走到窗邊，

  看著窗外的警車 ..


  然後電話就被接起來了 .... 原來是第五還第六排觀眾的手機啊！


  居然跟劇情完美結合，害我還想說站前秀泰的環繞音效真好 .. 囧


  :


