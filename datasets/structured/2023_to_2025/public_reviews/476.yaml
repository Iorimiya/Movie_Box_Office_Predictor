url: https://www.ptt.cc/bbs/movie/M.1529081075.A.41E.html
title: 'Re: [吵架雷] 瞞天過海8面玲瓏'
content: ":\n\n\n我就是苦主啦,看個電影被人罵我真的覺得很衰\n我就是吵架男的其中之一\n請讓我還原事實真相\n\n我跟老婆去看電影，看電影期間我承認我們有講話，不過事實是我們整場電影大概講5~6句話\n\
  並且我們本身就討厭看電影時一直講話的人，所以我們要講話也都會刻意放低音量\n坐在我隔壁的仁兄，看電影中間他就跟他後座反映「可以不要一直踢椅子嗎?」\n口氣其實就很不好，當下我以為可能是後面在踢他椅子，也沒多做反應\n\
  \n再過半小時後 我老婆看劇情看到有點不太懂就靠過來低聲問我一句話\n我就回她一句話，重點我們都是有放低音量的(靠耳邊用氣音講話)\n我才剛回完我老婆，馬上隔壁男子就口氣非常差的說「可以不要一直講話嗎?吵死了」\n\
  我真的傻眼，我整場電影講不過5~6句話，你說我吵死了，\"一直\"講話???\n當下我也不高興的說「我們明明就沒一直講話，你在靠夭甚麼?」\n而且所謂的\"一直\"\
  是指動作始終不間斷或狀態始終不變，不過我們並沒有啊\n他也沒說話了，就這樣一直到結束都沒有互動\n\n電影結束後，我想跟他解釋，就問他「我們剛剛有很吵嗎?」\n\
  他就開始很激動說「有有!你們很吵!」然後音量越來越大聲，\n甚至還用手機開手電筒照我們，接著說看要比誰丟臉之類的話，\n到此我覺得這一切太荒謬了\n他還一直鬼打牆說「電影院不能講話!電影院不能講話」\n\
  我想請問誰在電影院沒有講過話，難道你連笑聲也不行接受嗎?\n重點是我們並沒有\"一直連續不停不間斷的講話\"\n\n我的認知是電影院可以講話，前提是你的音量不要干擾別人\n\
  有在場坐在我附近的覺得電影中我們很吵的麻煩出來舉證\n我自認為我跟老婆都是有降低音量在講話，我真的不知道這位老兄的容忍度有這麼低\n現在回想起來我猜想搞不好他後面的觀眾可能也是不小心踢到他一下，就被他罵\n\
  後來我老婆也發飆跑過去跟他吵 不理性的開始\n連出場後在廁所遇到 他看到我們還很大聲說「唉 下次看電影遇到瘋婆子要怎麼辦?」\n我老婆也不甘示弱的說「遇到神經病才倒楣吧」\n\
  \n那仁兄講話比我們大聲，導致有觀眾就聽到他聲音還以為是我們一直講話\n但事實根本不是好嗎?是他本身對雜音的容忍度是0，只要不是電影發出的聲音\n他就無法接受\n\
  我在此跟同場的觀眾道歉，讓大家看到我們的爭吵，真的很抱歉\n我也想跟那位自以為有正義感的仁兄說，如果你真的連低音量的聲音都接受不了\n你才是真的是不適合進電影院看電影的人\n\
  \n被人家兇Q完真的很氣，連電影後半段都不太知道在演啥= =\n\n--\n                                    06/16\
  \ 10:23"
