  3.請準時入場觀賞，電影開演後10分鐘戲院與主辦單位有權謝絕入場

  4.本特映會如遇天災等不可抗力的因素而取消，恕不補辦

  5.主辦單位保留修改本辦法之權利，但會事先公佈


