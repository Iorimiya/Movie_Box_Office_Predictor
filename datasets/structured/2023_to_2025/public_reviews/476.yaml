url: https://www.ptt.cc/bbs/movie/M.1533637494.A.9C2.html
title: '[微好雷]瞞天過海：八面玲瓏-顏值可否支撐劇情 '
content: '網誌版： (歡迎參觀鼓勵)


  嗨大家，我又來了！

  其實回movie版發文我自己非常忐忑...

  因為我超容易犯傻在編輯中出錯(不論打錯片名還是搞混漫畫公司...天啊真糗)

  不過秉持著分享的心情，我還是把文章發上來，我自己有先檢查過了。

  如果再有錯誤的話，歡迎糾錯，我一定改(遮臉)


  -----------

  文字節錄版：


  《瞞天過海》系列其實熱映已久，但我之前並沒有每一集都進戲院去支持。

  這次會到電影院去觀看這部電影主要是「女力」的主題讓我產生興趣，

  好奇編劇在延伸原系列的精神之下，若以女性為主要角色來進行會如何呈現？


  這部片卡司非常堅強，個人喜歡的演員接有擔綱演出：

  Sandra Bullock：《愛情限時簽》中她女強人的形象深植我心

  Anne Hathaway：不論是《穿著Prada的惡魔》華麗變身之後選擇反璞歸真的小安，

  還是《愛情藥不藥》飾演罹患帕金森症的女患者，都讓我印象深刻。

  在這部電影中，Anne Hathaway也給觀眾不一樣的驚喜。


  整部電影的情節非常流暢，用幾句話簡述劇情：

  Daniel Ocean的親妹因錯愛Claude Becker，付出鋃鐺入獄5年8個月又12天的代價，

  出獄後選擇浴火重生的方式就是召集眾姊妹偷取MET GALA中Cartier的天價鑽鍊，

  並陷害前男友來個一石二鳥：賺錢兼復仇。


  然而這部電影畢竟是11年之後的續集，應該承接前作精神的野心，

  在這幫娘子軍偷取鑽鍊的過程中沒有太多意外的插曲，卻有不少致敬的片段，

  容易讓熟悉該系列的觀眾自動鷹架接下來的劇情，少了期待之感。

  我在觀影中屢屢產生以下的錯覺：疑？這是《穿著Prada的惡魔》的神偷版嗎？


  不過電影中有不少照顧到女性觀影者的元素，

  如：美男、名畫、華服、美鞋、首飾、髮妝以及精品(如：cartier)，

  且說到瀟灑不羈的型男藝術家，

  個人認為極有可能是編劇揣想眾多女性心中天菜男友的預設模樣，

  並以這樣的男性讓女性觀影人快速認同女主角出獄後復仇的動機：

  畢竟這般優質深情的男友(還燒得一手好菜！)，最後竟為了利益欺騙女人，

  活該入監被千刀萬剮，可說是渣南人人得而誅之！

  Claude Becker在片中確實成為凝聚眾姊妹情的關鍵要素之一。


  本片名為Ocean''s eight，就可推知會有8位嗆辣的女角。

  這8位女角的塑造頗具用心，因為這樣的安排不但可以協助情節進行，

  同時也能讓不同類型和處境的女性觀影者從中獲得認同或是個人投射。


  Sandra Bullock：同說書人帶出故事大綱的作用/被愛情辜負的領導者

  Cate Blanchett：負責帶出其他角色的副手/閨蜜至上的協助者

  Sarah Paulson：網購能力可以出書的實作家/想兼顧家庭和工作的職業婦女

  Rihanna：妹妹也很罩的外掛工程師/未婚並且考慮自行創業(?)的年輕女性

  mindy kaling：鑽石的鑑定與再製師/傳統家庭中被壓抑的少女(顧及印度市場)

  Anne Hathaway：本片亮點/急需同性認同的美女(ig超多like但沒有知心朋友)

  awkwafina：偷對一次就金盆洗手/論華人在美買大房的勵志性(照顧亞洲市場)



  1.Anne Hathaway臨陣倒戈並不唐突甚至擔綱本片亮點

  她在劇中飾演的女演員daphne kluger就是個會不按照牌理出牌的女孩，

  出其不意的作風讓觀眾覺得很討喜(應該是擔當整部片的笑點&最美丑角)

  在形象上也比較多變化：

  跋扈善妒的女明星/失控嘔吐的貪食者/想要獲得同性認同而倒戈的可愛反派


  2.Bad riri 脫掉中性服裝之後的魅力驚人

  蕾哈娜的飾演的nine ball一開始沒有讓我留下突出的印象(除了能力開掛外)

  形象塑造上也較刻板：黑人髒辮/通俗說話style/街頭打扮/複雜的家庭背景

  但以禮服離開犯案現場的剎那是有驚艷的！


  3.誰說當了媽之後就不能夠迷人！

  一開始我和H還以為她是演神鬼戰士的艾蜜莉布朗

  後來發現兩人的氣質還是有些微的不同，

  相較於emily的剛性神韻，sarah氣質更細緻柔美一些，各有千秋。

  但不知為什麼我和H一致覺得這個角色非常討喜，

  我想除了是欣賞她對事物的認真態度外，可能我們已進入職場若干年，

  對於想要在日常生活中突破的心情，很有共鳴吧！



  --'
