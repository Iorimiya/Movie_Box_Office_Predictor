url: https://www.ptt.cc/bbs/movie/M.1529085145.A.32A.html
title: 'Re: [吵架雷] 瞞天過海8面玲瓏'
content: '現在看電影沒公德心的人真的太多了。


  講話什麼的，手機看訊息的超亮閃光，每次電影開演前都要祈禱不要遇到。

  但遇到的機率真的很高。


  吃東西的聲音，倒也不能說什麼(畢竟戲院自己就有在賣)。

  等對方吃完就沒聲音(大概就前半小時吧)，但最煩最該死的是那塑膠袋的聲音。



  原以為現在已經見怪不怪。

  想不到前幾天(星期三)去看侏儸紀世界2又遇到一個突破下限的。


  居然吃檳榔!WTF!?整個傻眼……


  二輪戲院遇到就算了(二輪戲院的觀眾素質一向很差)。

  想不到連首輪戲院都遇得到。我還特地選平日冷門時段，價位較高的IMAX廳……

  想說會過濾掉不少三寶，結果還是碰到了。


  想換位子，但又覺得好不容易劃得不錯的位子。剩下的位子又都很前面。

  是有想過請戲院人員看能不能處理，但又不確定禁帶外食規定有沒有包括檳榔

  (一直記得只有熱食)。回來查了後才發現有包括在內，當時真應該去講的(冏)。


  真希望未來戲院出無飲食，無干擾的影廳。票價就算貴一倍我也願意進場。



  --

  剛好前幾天也遇到類似的 想說就回一下XD

  補一下，我是去美麗華看的


  幫QQ


  XDDD'
