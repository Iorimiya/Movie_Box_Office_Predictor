title: '[負無雷] 瞞天過海'
content: '看板上恐龍一片負雷，就想說選瞞天過海好了


  看完真的一臉黑人問號到來發勸世文XD


  整場沒有什麼刺激感，都偷的很順暢


  劇情也平順合理的走過去


  最後的反轉也讓人不太想驚呼


  （但還是有同場的觀眾很給面子啦倒抽一口大氣）


  看的時候隔壁廳恐龍的蹦蹦音效聲還比較刺激


  說有笑點也是很微弱


  完全就是在賣演員的一部電影


  PS:前面有一篇版友恐龍和瞞天的選片文，

  裡面的評論都是真實的哈哈哈

  例如：  想聽安海瑟薇呻吟就選瞞天過海


  如果想看演員演戲就可以進


  不然真心認為不要浪費錢，可以租DVD在家看了



  -----

  Sent from JPTT on my iPhone


  --

  因推文暴雷,故刪除推文

  如果太認真看真的會看到生氣XD

  可能就是劇情設定，但看到James Corden就很歡樂

  真心不騙XD

  已刪除囉!

  謝謝提醒!

  本土劇太奇葩哈哈哈

  都省都省XD

  我覺得沒有像當初導演說的角色設定那樣的討厭欸

  我相信跟我看同場的觀眾絕對也是這樣想，因為一播完都有「蛤」聲出現

  可能是剛好遇到平淡廳XD而且隔壁的恐龍聲真的太吵了哈哈哈'
