url: https://www.ptt.cc/bbs/movie/M.1529120902.A.49B.html
title: '[好雷] 瞞天過海：八面玲瓏'
content: '直接說明


  雖然是好雷 但這集實在有點平淡


  卡司真的很厲害


  每個都著墨點都夠


  流暢性也不錯 沒有冷場或不得宜的地方


  劇情討論見下述






  =======================雷區==========================

  =======================雷區==========================



  這集卡司真的不得不說 主角群 配角群都有大咖


  很厲害 也很亮眼 真的是眾星雲集


  但劇情實在是太平淡沒有起伏


  不得不吐槽


  老實說這集竊盜算失敗 因為被小安發現但也收得很爛


  說真的 就算Tag她不是「胸大無腦」 正常人也會發現自己項鍊被偷吧..


  只不管聯想力很厲害直接跳到珊卓布拉克 然後揭發這場竊盜案件


  然後藉口更是扯 說什麼女性朋友很少 打哈哈 雖然這邊是笑點


  但我寧願珊卓布拉克說什麼 要騙別人要先騙過自己人


  為了讓這場竊盜案件順利 我們再找人先已經先找了小安加入


  這樣才有備案 而且被騙的人(小安)才會順著劇情走不會失敗


  所以當初說要7人 其實是不含我7人之類的 巴拉巴拉巴拉


  然後順便在點出她之前在渣男那邊的 『騙人前要先騙自己人』 這句話


  這樣不是很好嗎 不然之前看劇照就知道小安在會加入 但沒想到是這樣


  但後面收的更扯 跟保險員根本就算一夥的


  只不過保險員根本就想趕快結束 直接跟女主角說好和串聯


  所以女主角只要派小安去作之前沒想到偽證-拍照


  這個她應該沒在5年前想到吧? 那她要怎麼嫁禍給渣男..?


  然後最後再起個 啊啊 其實我們還有偷其他的寶石


  然後在鏡頭外做了什麼什麼 感覺很厲害 其實也不是很必要


  整場竊盜案突發事件很少且太容易


  像是比較危險的 項鍊磁力鎖 案件


  我本來想說 OK 所以多一項支線任務 要去取得守衛的磁力鎖?


  所以可能會有一名主角去色誘、分心、或者是驚心膽跳的偷竊?


  結果都不是 就雷哈娜說我妹妹很猛 然後花3分鐘解決


  那其實也不是很重要那 幹嘛帶出這件事..


  雖然吐槽那麼多 但這集我很讚賞主角群亮點夠


  每一位的職責和做什麼記憶點很深刻 而且都是必要性


  劇情流暢性也高 顏值 禮服 演技 都很讚


  雖然劇情就這樣 吐槽點多 但的確是不錯的表演


  算是普雷之上






  --

  真的 白費的這個卡司

  對啊 吃一口嗎~ 那麼逗著我心花怒放

  原來如此 謝謝

  對 前面看到小安 都是一臉婊子樣

  後面又呆萌的很可愛 真的很可惡捏 <3

  說的也是 但我覺得可以看啦 只是跟前幾集差一點'
