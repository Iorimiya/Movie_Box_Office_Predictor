url: https://www.ptt.cc/bbs/movie/M.1571883413.A.22B.html
title: '[討論] 瞞天過海2 系列中算優嗎?'
content: '很喜歡瞞天過海系列.


  大咖一堆.搞計畫.搞趣味


  三集裡面1.3都很不錯很愛這兩集


  就第二集 真的有些不解跟感覺很怪的地方




  還是防個雷


  整部戲流程在回想一下




















  第一集壞蛋找到主角一群人


  要求連本帶利還錢


  主角群決定去偷一個富商家


  結果被神偷夜狐搶先了一步


  主角跟夜狐見面


  決定比賽誰先偷到寶蛋


  如果夜狐贏.主角要叫一聲夜狐你是業界第一名


  如果主角贏.夜狐願意幫主角還錢


  最後


  整部戲的梗


  就是原來夜狐的師父知道真的寶蛋在哪裡


  他告訴主角.然後主角在火車上調包偷走


  所以最後夜狐偷到的其實是假的





  關於寶蛋.....


  師傅怎麼會聯合外人來對付徒弟....


  神偷界神級人物你會不知道女兒是誰在哪裡??


  你要跟女兒重逢.憑你跟夜狐的名號那有什麼困難的....


  女兒又超崇拜這兩位....


  轉了一大圈結果是主角幫你????


  如果劇中有演師徒其實有心結或不合也就算了.完全沒有阿



  嘿嘿.你幫我騙夜狐的錢.我讓你跟你女兒重逢


  徒弟對不起.我覺得喬治克隆尼才是神偷界第一.嘻嘻???





  然後..


  茱莉亞羅勃茲那一整段到底在幹麻......


  當時在展場門外一堆夥伴被抓.而麥特戴蒙跑走


  但他還是計畫要去偷蛋.所以想出大名星這個計畫


  但這整段感覺根本就是為了趣味搞笑加進去的東西




  先結局結果論



  麥特戴蒙早知道真蛋在手上了


  其實只要夜狐以為主角失敗被關.然後偷到假蛋就結束了


  你還找茱莉亞羅勃茲來演這一大段倒底......


  因為劇情後來一樣是被抓到....兜了一圈根本不知在幹麻


  然後靠媽媽威能都能被放走 (爸媽這背景也很無言.根本開掛)


  那你一開始就在展場外被抓還不是一樣??


  當然....


  以娛樂觀眾效果來說當然很棒.大家嘻嘻哈哈.


  看茱莉亞羅勃茲演茱莉亞羅勃茲然後還看到約翰麥克連


  但就是很怪....不合主線邏輯


  真的就是為了娛樂而拍的整場戲





  而且在第一集跟第三集中其他配角戲份都不錯


  多少感覺存在感.至少感覺到各有各的功用在


  但第二集除了幾位大牌畫面多


  配角幾乎沒啥路用.就露露臉打個嘴砲幾乎沒存在感




  這種大明星大集合的電影本來就不該多去要求戲中合理性


  但至少要看的順.看的爽


  1.3集整個手法就很不錯.整人整到對方傻掉


  2真的讓人看的一堆問號


  還特地去查了一下1-3集的編劇.看起來都完全不同人





  話說夜狐也算真男人了.被師傅完全當傻子還是掏錢


  可是神偷卻老是拿到假東西XDD



  然後凱薩琳麗塔瓊斯真的很正


  這片根本為了她而拍的




  --'
