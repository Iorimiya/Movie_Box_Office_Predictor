title: '[評論] 聞天祥談 / 女力與瞞天過海：八面玲瓏'
content: "【聞天祥專欄】政治正確還是女力出頭？當《瞞天過海》也「八面玲瓏」\n\n\n\n--\n\n從去年底一路延燒到今年坎城影展，女性不間斷地為性別正義積極發聲，\n\
  但現階段的成果是難以動搖的全體共識，還是虛應時事的空中樓閣？\n\n\n2016 奧斯卡提名公佈後，一位不滿的非裔女網友發起 ite 的標籤，\n直指奧斯卡影藝學院被白人（其實還包括四分之三的男性與眾多高齡者）所把持，\n\
  加上數位非裔影星與編導抵制，結果奧斯卡半被迫地表態：\n到 2020 年女性和少數族裔的評審名額將會翻倍。\n\n2017 年底，Twitter 的 #Metoo\
  \ 行動則凝聚性侵與性騷受害者集體發聲，\n令叱吒風雲 30 年的金獎製片 Harvey Weinstein 被自己創立的公司開除、家庭離異，\n奧斯卡影帝 Kevin\
  \ Spacey 演畢的《金錢世界》甚至不惜換角重拍。\n這股風潮不但從好萊塢襲向全球，也從演藝圈延燒到體壇、政界等更多的場域。\n\n\n》時勢造就英雄\n\n\
  巨人可以被推倒，典範可以再重樹。時至今日，我們也無需意外近年表現最出色\n（無論評價或票房）的超級英雄電影會是《神力女超人》與《黑豹》。\n當然不能否定他們自身的攝製水平，但時勢的改變，確實提供兩者在性別與族裔論述上\n\
  有更廣闊的空間和更大膽的設定，觀眾的接受度更驗證了改變的可能。\n\n因此，我們是否不應該太意外《瞞天過海》在經歷續集《瞞天過海2：長驅直入》\n與第三集《瞞天過海：13王牌》等兄弟會式的明星大會串後，\n\
  是該輪到《瞞天過海：八面玲瓏》上陣了。\n\n\n》巾幗真能反轉現實？\n\n《瞞天過海》第一集本來就是翻拍 1960 年的老片《十一羅漢》，\n要說有什麼創意，不如說是緊抓大牌如雲的群聚魅力，\n\
  一方面從他們的既定形象玩出一些興味\n（這在 George Clooney、Brad Pitt、Matt Damon 等固定班底身上特別明確），\n另方面則展現導演\
  \ Steven Soderbergh 場面調度的實力，\nJulia Roberts 則只是投桃報李（因為他導了讓她在奧斯卡封后的《永不妥協》），\n樂於當個扮演昂貴但獨一的花瓶（第二集才有\
  \ Steven Soderbergh 提攜過的另一位女星\nCatherine Zeta-Jones 一塊打醬油）。\n\n如果這種明星大會串加上導演的一些慧黠，重新組合好萊塢的古典趣味，\n\
  而非強烈的感官刺激，能夠滿足你，那它就會是部優雅有趣的犯罪喜劇。\n\n也因前作在先，全女班的《瞞天過海：八面玲瓏》要面臨的挑戰主要有兩方面：\n一個是奪寶計謀的縝密與新鮮度，能否讓已有彈性疲乏的系列出現亮點；\n\
  另一個自然是女明星的銀幕個性是否足以鮮明到各自閃亮、合體璀璨，\n一如他們要盜的鑽石珠寶？\n\n這當中有三位奧斯卡得主 Sandra Bullock、Cate\
  \ Blanchett、Anne Hathaway\n以及數度提名的 Helena Bonham Carter，其他成員則小心翼翼地顧及到\n非裔、亞裔（包括中韓混血的\
  \ Awkwafina 和印度裔的 Mindy Kaling）。\n\n如能成功再下一城，好萊塢類型應該可以產生更多波動，\n否則就只是劃過湖面的丁點漣漪。畢竟骨子裡的翻轉，要比表面的政治正確困難多了。\n\
  \n--\n\n原文結束。\n\n--\n   \n   ◥\n  \n \n  \n￣￣￣￣\n\n--"
