url: https://www.ptt.cc/bbs/movie/M.1528990731.A.AB4.html
title: '[普雷] 《瞞天過海:八面玲瓏》,麥特戴蒙在哪裡~?'
content: '《Ocean''s eight》,


  老片翻拍的再翻拍,


  這次是全員女性,只是團隊少一點點


  (防雷)












  條列式心得:


  1.安海真的可以演得很討人厭


  2.安海的歐派真的有這麼大嗎? 還是特效?


  3.其實認得出來的屬珊卓.布拉克/凱特.布蘭琪/安.海瑟威/海倫娜.寶漢.卡特/蕾哈娜


  4.還有人記得九號球的原名嗎?


  5.此片應該是女性觀眾看得比較有感吧. 整體上有點乾巴巴的感覺.


  6.「瞞天過海」是兵法三十六計的第一計。


  原文為：「備周則意怠；常見則不疑。陰在陽之內，不在陰之外。太陽，太陰。」其意思

  是在最公開的場合，實現最隱密的目的。




  恩,也算是符合題旨了


  7.麥特.戴蒙到底在哪裡0.0?



  整體平平普普的一集,感覺很難拍第二集..


  --

  什麼詞語快速唸10遍，會感到很噁心？


  Ans：My angel.


  --'
