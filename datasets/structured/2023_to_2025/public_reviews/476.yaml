content: "[新聞] 影后齊聚一堂！全女版《瞞天過海》敲定上映日期\n\n 新聞快訊2016/10/07\n\n華納影業和 Village Roadshow\
  \ Pictures 已經制定好接續 2001 年經典犯罪電影《瞞天\n過海》的計畫，除了將陣中成員清一色換成女性之外，也已經宣布了全女版《瞞天過海》\n在 2018\
  \ 年的上映日期。目前也已經敲定了八位中的七位主演女星，由奧斯卡影后珊卓布\n拉克（Sandra Bullock）領軍，包括凱特布蘭琪（Cate Blanchett）、珍妮佛羅倫斯（\n\
  Jennifer Lawrence）、安海瑟薇（Anne Hathaway）、海倫娜波漢卡特（Helena Bonham\nCarter）、沙拉寶森（Sarah\
  \ Paulson）、敏迪卡靈（Mindy Kaling）、蕾哈娜（Rihanna\n）、說唱歌手 Awkwafina ，整體星度相當耀眼。全女版《瞞天過海》將由《飢餓遊戲》\n\
  （The Hunger Games）導演蓋瑞羅斯（Gary Ross）執導。\n\n根據 THR 的報導，全女版《瞞天過海》將會在 2018 年的盛夏，6 月\
  \ 8日重返大銀幕，\n估計將會直接對上派拉蒙影業的《變形金剛6》（Transformers 6），但由於許多觀眾已\n經厭倦了觀賞超大型視效機器人在大銀幕打架，全女版《瞞天過海》可望接收許多觀眾；\n\
  此外，其他潛在的對手可能有迪士尼的「韓索羅」（Han Solo）個人電影、皮克斯的《玩\n具總動員4》（Toy Story 4）、以及「大魔王」環球影業的《侏羅紀世界》（Jurassic\n\
  World）續集等強檔。\n\n珊卓布拉克以原版丹尼奧申（Danny Ocean，喬治克隆尼在《瞞天過海》的角色）姐妹的\n身分帶領8位嬌娃偷拐搶騙。和他的兄弟一樣，珊卓飾演一位具有個人魅力的小偷，在大\n\
  都會藝術博物館慈善晚會（Met Gala）策劃一場搶劫，並組織了一組團隊準備大幹一票。\n凱特布蘭琪則飾演珊卓布拉克的左右手（如同布萊德彼特之於喬治克隆尼），由原版導演\n\
  史蒂芬索德伯（Steven Soderbergh）擔任製作人。\n\n蓋瑞羅斯表示全女版《瞞天過海》的基調將會和史蒂芬索德伯的原版《瞞天過海》相似，\n全女版《瞞天過海》將會較像是原版電影的延伸與接續，並稱讚了原版系列有著「令人驚\n\
  艷的風格」。談到他和史蒂芬的合作，他說：\n\n「我們討論很多關於電影的事，包括攝影風格、節奏、剪輯風格、還有音樂。我們討論了\n所有事情。我沒有想要創造一個新風格的打算，我很興奮也很榮幸的可以將原本的風格繼\n\
  續延續下去，這一定非常有趣。」\n\n全女版《瞞天過海》的劇本也由導演蓋瑞羅斯和奧莉維亞密琪（ Olivia Milch）共同撰\n寫，由蘇珊艾金斯（Susan\
  \ Ekins）擔任執行製片。其實續集的計畫已醞釀多年，卻因為\n製作人之一傑瑞溫特勞布（Jerry Weintraub）意外過世而暫時喊卡，去年蓋瑞簽約加入\n\
  劇組後才終於重新推動，拍攝工作將於這個月在紐約開始。\n\n\n\n--\n                                    10/09\
