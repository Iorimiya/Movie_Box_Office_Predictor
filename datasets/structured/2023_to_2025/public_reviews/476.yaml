url: https://www.ptt.cc/bbs/movie/M.1520875260.A.17E.html
title: '[請益] 想問瞞天過海2一個梗'
content: '一直很喜歡瞞天過海系列


  常常沒事就拿來重看


  主要很喜歡裡面的台詞設計


  剛剛看第二集時


  Ocean一群人在旅館討論對付night fox的方法吵起來


  Reuben問大家100塊鈔票頭像是誰


  大家都說Adams


  不知道誰小聲冒出一句John Travolta


  看了挺多次剛剛才聽到有這句


  因為真的很小聲


  感覺是一個很有意思的梗


  但不知道背後意思到底是什麼


  有沒有人可以說明一下


  --'
