title: '[普無雷] 瞞天過海：八面玲瓏 '
content: '原本對於這部的期待還滿高的


  因為演員都大有來頭 然後又聽說評價不錯 所以自然就有比較高的期待


  看完之後是覺得雖然不差


  但是好像也沒有想像中那麼驚喜的感覺


  但是演員真的沒話說 光是看演技跟顏值應該就值回票價了


  如果當作是爆米花電影輕鬆看的話我覺得還不錯


  或者不想看恐龍的 也可以考慮這部XD


  --'
