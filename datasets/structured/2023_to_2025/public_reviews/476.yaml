url: https://www.ptt.cc/bbs/movie/M.1529235830.A.49F.html
title: '[普好雷] 瞞天過海：八面玲瓏 '
content: '圖文完整版：





  歡迎來臉書專頁玩：







  作為一部輕鬆看的竊盜片，《瞞天過海：八面玲瓏》相當滑順的以詼諧淺易的對白和略帶

  自嘲的選角（因為Anne Hathaway老是被媒體黑，她就乾脆演一個討人厭的女明星）及表

  演帶著觀眾逛了一圈大都會博物館，又因為是「女生」版本，所以也是眾女星爭奇鬥艷的

  伸展台。，每一場戲都可以看到她們的百變造型，配樂家Daniel Pemberton的音樂風格實

  在太適合這種類型的電影，讓她們可以配合輕快節拍，踩著游刃有餘的自信台步，不讓前

  作一票男星專美於前。而過程和結局自然也是「皆大歡喜」，只見一群「罪犯」各自風采

  ，至今仍逍遙法外。


  整場竊盜大計就在談笑風生中完成了，縱使偶有意外，也是馬上有如喝杯水般的解決。優

  點是電影節奏的確是有如溜冰般順暢無比，缺點當然就是沒啥危機感。但看多了主角們被

  虐的不要不要的作品，偶爾看一下這種主角群從頭威能加上好運到尾的片子也是有種紓壓

  的感覺。


  至於Debbie Ocean苦思五年多的完美計畫之主軸竟然也只不過就是喬裝工作人員下藥，就

  睜一隻眼閉一隻眼吧。畢竟編劇自己當然不可能會是自己筆下智商超乎常人的天才，也不

  可能真的為了構思這部劇本而打磨五年。反正就是享受剪輯運鏡所帶來的行雲流水、華麗

  時裝秀和大都會博物館導覽吧。而編劇最後似乎也覺得計畫的問題有點多，乾脆就讓下手

  目標Daphne配合演出算了。就這角度來看，這號稱完美無缺的計畫實際上是失敗了，最後

  之所以大夥平安下莊，就偷懶的用有些機械降神的原因帶過，原來高高在上的女神Daphne

  想要朋友啊。


  還有個稍微有點不滿的部分則是Debbie的「真正目的」。對她而言，偷東西、展現手段、

  一圓「家族的犯罪夢」似乎都只是其次，報復渣男才是她的動機（我們的矮人王索林橡木

  盾再次栽在珠寶之下。喔對了他某些角度真的蠻像Hugh Jackman，如果真要找新任金鋼狼

  可不可以考慮他？）。而她一筆一筆劃掉的「清單」最後仍然留有戀愛的願望，搞得好像

  女人只能為了感情而活，不管是清算過去還是展望未來。報復渣男的梗似乎也以為只要給

  女性觀眾看負心漢自食惡果、宛如過去某些拙劣的女性視角喜劇就可以了。


  不過除此之外，《瞞天過海：八面玲瓏》雖然有點像是之前女版《魔鬼剋星》一般，把差

  不多的東西翻拍一遍只不過是將主角換為女人，但本片在性別上著墨甚少，並沒有如同《

  魔鬼剋星》處處刻意強調，無形中也引起了不必要的戰火，但稍微可惜的就是也無法藉由

  女性視角帶來點什麼新的火花。


  話說，事業做很大的「家庭主婦」Tammy這個角色的氣質和扮相，當初該不會本來是設定

  由Emily Blunt來演吧？



  --


  陳亭妃見那土壤觸手深陷，就與上次一般無異，更是驚奇，心想：「謝龍介的功夫明明遜

  我一籌，怎地也有這等厲害的指力？」一時滿腹疑團，突然伸手指在土上一刺，說也奇怪

  ，那土壤竟被她刺了一個孔。


  --'
