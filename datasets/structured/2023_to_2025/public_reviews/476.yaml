url: https://www.ptt.cc/bbs/movie/M.1529468964.A.EC6.html
title: '[好雷] 瞞天過海：八面玲瓏'
content: "此片是高調的女性群戲，名為《瞞天過海》系列的續集，但其實媒體與觀眾怎麼看都像是女版「重啟」。我個人一方面欣賞這種重啟，另一方面又很擔心它變成老調重彈：欣賞在於過去電影中兩性分工太過明顯的時代已過，當代當然值得性轉讓彼此穿穿對方的鞋玩玩看；擔心則在於會不會陷入一種男人怎樣女人就要怎樣的競爭與取代關係？若果真如此，那無論過去性別有什麼不平等、現在豈不只是取而代之換我來主導不平等？\n\
  \n還好，我覺得這部《瞞天過海：八面玲瓏》那條線畫得很得宜，它雖然也是有劍指男性壓迫，但具體只派了一個男性代表扛，而且外型帥氣戲路搞笑、不意在激化性別戰爭而更像是博君一歡。至於其他地方的男性身影呢？少得驚人！別說被男人辜負的\
  \ Debbie 只信任女性團結而組純女團、Met Gala大派對有給到鏡頭的幾乎全女、負責承辦活動的公司裡也幾乎全女，男性角色僅有珠寶保全與出餐侍者、賤兔 James\
  \ Corden 與小顏這些非傳統老白男則是對女性友善的另類面孔... 而片頭，冷言倨傲教訓 Debbie 的監獄官員摸摸頭，這男聲則連臉都沒露出，彷彿隱形。\n\
  \n不只是女性角色，就是靜物角色也一樣： Debbie 參觀博物館也是全女經典肖像畫一幅接一幅、最後眼光才若有所思地停在一個麥田農婦的鐮刀上；然後她們要偷的珠寶，雖說這次是「歐洲古代王公貴族」主題，但時尚世界的衣裳與珠寶都在誰身上？也是全女性，尤其看\
  \ Lou與小顏最後搜刮的那一整池，這麼多紫色人像戴珠寶，其中有任何一個男人像嗎？此片選擇偷竊目標、選擇場合、選擇角色、選擇繪畫，歡樂地說是幾乎全女性讓姐妹們好好亮相發揮，但嚴肅地說，也像是女性的問題女性自己來思量解決，雖有男性壞蛋，但大體上仍是女性自己在性別枷鎖中的自處問題。\n\
  \n\n\n我們的 Ocean's 7  個個或多或少有些女性可愛酷炫卻又帶著隱憂的刻板印象:\n\nDebbie    把自己情感與生活託付給男人無法獨立，男人倒打一耙馬上倒；\n\
  Lou       打死不信男人更不想與男人有瓜葛，只躲在工業區離群討生活；\nWeil      女設計師，打滾這行心理素質不夠只能硬撐，負債潦倒給人笑；\n\
  Amita     同在時尚卻是低端工匠，時尚與調情果實她沒份，只給媽媽管；\nNine Ball 女駭客與科技妹妹，皆非少年社交圈討喜女生，「九號」魯蛇；\n\
  Constance 街頭藝人騙觀光客、遇人偷手錶，彷彿人人瞧不起我都是敵人；\nTammy     最具體被束縛的家庭主婦，當乖老婆之餘還是忍不住偷偷網拍。\n\
  \n人人（或多或少，有的明顯有的不明顯）彷彿都覺得自己是可憐受迫的女性、眼前雖有個具體男人是壞蛋、但其實審視自己生活中根本沒具體男人 XD 而只有一個性別枷鎖。這個性別枷鎖叫我們要乖乖地別當壞女孩越過界限，只是這些人當壞女孩揮灑一回之餘也還是把這「好女孩\
  \ vs 壞女孩」的凝視模型不小心繼承了下來應用在別人身上：\n\nDaphne    表面上是人前公主人後畢取，是所有自命乖女孩者虐之可也的壞女孩；\n  \
  \        但其實你我都是同一條性別凝視船上的壞女孩，能看見她接她上船嗎？\n\n想想時尚產業這東西如何役使女性，就不得不對 Weil 的流言蜚語失敗飲泣與\
  \ Daphne 的女王外表強打精神感到鼻酸：時尚世界就是性別分工幽靈下創造的女性鬥獸場，人人穿金戴銀爭奇鬥妍搏版面、人人在後台當個畢取動員時尚勞工大機器、卻在前台舌燦蓮花打造最完美外表一秒不得閒，30世代安海瑟薇等女星很快就會被20世代芬寧姐妹取而代之。\n\
  \n然而，在這殘酷世界架構好的 Met Gala 舞台上，讓女性彼此大亂鬥一場弱肉強食、或是讓女性輸家把女性贏家當暴龍打倒，真的是女性掙拖枷鎖的健康出路嗎？此片先把\
  \ Daphne 當假想敵帶觀眾玩弄她嘲笑她、卻到最後十分鐘伸出手將她拉入團體成為友人，倒是此片偷天換日計謀一路順暢毫無衝突之下最令我驚訝的衝突，不是工具劇情的衝突而是感情敘事的衝突。\n\
  \n\n\n此片幾乎是部男性從頭缺席到尾的電影，只有一個惡貫滿盈的喜劇壞男人給主角虐給觀眾笑，不過少數幾個露臉一下下的男性角色都不是傳統青壯年白男，而是非傳統如前三部曲的老人\
  \ Reuben 與新加入的少壯派保險探員 Frazier，他們身為男性雖然也對女性有種牌桌兩邊針鋒相對的高高在上感，但他們的直言諍諫句句是關心女性的箴言：\n\
  \n\"Revenge is a two-fer\"，復仇總是雙面刃買一送一，家族老友妳何時心靜停下來？\n「有時算準任務會成功就是爽快，不一定要真去做」，瞞天過海三集老人的忠告。\n\
  哥哥快意做過的，如今妹妹也要來一回，然而\n男性曾經玩大火，如今英年早逝關在墓園裡；\n女性跟著玩一回，能否掌握節奏見好就收呢？\n\n電影最後，每個女性都或多或少走出了一點她們打滾世界固步自封的性別枷鎖：\n\
  Lou   不玩小的伏特加摻水遊戲了，買台重機遨遊四海，走出碼頭天下不再有壁壘；\nWeil  還完了債開自己的店做自己主人，就看以後還會不會面對八卦凝視哭哭啼啼；\n\
  Amita 做珠寶一生終於有錢去一次巴黎玩一次浪漫，雖也很浮華總要先嚐一次再說；\nNine Ball 自己開撞球酒吧不再當宅女，姑娘我是老闆就是一路打九號給你們瞧瞧；\n\
  Constance 買層公寓衣食無虞自己當起 YouTuber ，不再與世界為敵逢人招搖撞騙；\nTammy 以前靠偷東西搞車庫網拍，有錢就來自辦倉儲物流業，不再當郊區家庭主婦；\n\
  Daphne以前當明星很注重外型搞得焦慮氣喘，現在有錢自己當導演由我發聲來評斷；\n\n\n這些多多少少都是那性別刻板印象中，乖乖扮演女性角色卻一路失調的苦悶心靈們，她們在這一趟旅程中其實面對的都不是什麼具體的壞男人，而只是盤旋在空中指指點點規定她們該怎麼做才是乖女孩的性別幽靈。這幽靈往往是其他同為女性的八卦媒體、競爭女星、管訓老媽、鄰人姐妹們也一起塑造出來的，在地面端盤子護珠寶的緊張小男人才不是我們的敵人，真正的敵人恐怕只有片頭那連臉都不露只一句句逼妳說出「我錯了，我會過個簡單生活、找個工作、交些朋友、付我帳單」然後欣慰地給你摸摸頭的父權概念。\n\
  \n想要挑戰父權的女性，很容易就複製了父權走上老路子，主角 Debbie 就差點走火入魔不可自拔，找到個自以為和我們不一樣是我們敵人的假掰明星 Daphne 就當假想敵要來惡整一番，讓大家躲在小屋與貨櫃裡凝視她批判她嫌她沒當個乖乖好女孩、準備吃我們的瀉藥懲罰吧\
  \ XD 。還好加入了表面畢取其實孤獨的 Daphne ，才讓 Ocean's 7真正走出了「女性繼承男性凝視」的老陷阱成為了 Ocean's 8。那麼屬於女主角\
  \ Debbie 的片尾新生呢？\n\nDebbie不花什麼錢，只是靜靜回來共飲一杯，與這個她一直想體驗一回的哥哥身影。\n以女性電影看，也許就是2010s女性來與2000s男性共飲一杯，想想我們走了什麼新路？\n\
  當然盜賊電影總不是人生圓滿均衡的終極解，而只是釋放不平之鳴的暫時解。\n\n女性解放能與男人平起平坐大放異彩後，到底新生的品質在哪？\n就先喝一杯一起慢慢思考吧。\n\
  \n--"
