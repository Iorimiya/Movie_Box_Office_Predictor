title: '[情報] 萊恩葛斯林有望加入《瞞天過海》前傳'
content: '出處：





  今年五月《好萊塢報導者》指出華納兄弟探索將開發一部《瞞天過海》（Ocean''s Eleven）

  的前傳電影，並鎖定由瑪格羅比（Margot Robbie）主演，而今天根據《Puck》的報導，

  剛與羅比拍完《芭比》（Barbie）真人電影的萊恩葛斯林（Ryan Gosling）也正在洽談加

  入這個項目。


  根據五月時的傳聞，本次的前傳將會設定在與1960年版《瞞天過海》相同的60年代，並以

  歐洲為主要舞台，電影將由與羅比合作過《重磅腥聞》（Bombshell）的Jay Roach執導，

  今天的報導則指出新上任的總裁大衛扎斯拉夫希望華納兄弟探索未來能夠以發行院線大片

  為主，而本次的《瞞天過海》前傳便是他們的優先批准項目之一，這部電影計劃在2023年

  春季開拍。



  -----

  Sent from JPTT on my Samsung SM-N9810.


  --'
