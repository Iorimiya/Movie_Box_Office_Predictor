url: https://www.ptt.cc/bbs/movie/M.1725604795.A.091.html
title: '[新聞] 「瞞天過海4」傳將開拍 克隆尼、小布鐵定回歸'
content: "新聞網址：\n\n2024-09-06 09:36  聯合報 記者陳建嘉／即時報導\n\n喬治克隆尼、布萊德彼特合作新片「惡狼特工」在威尼斯影展首映後獲得大好評，兩大男\n\
  神戲裡戲外都有極佳交情，近期外媒「Deadline」更傳出他們領軍主演的「瞞天過海4」\n早就開始動工，並將找來「西線無戰事」德國導演艾德華柏格，前3集導演史蒂芬索德柏\n\
  雖不會執導，但應該會參照「瞞天過海：八面玲瓏」擔綱製片，全體主要演員因為交情甚\n篤，包括麥特戴蒙、茱莉亞羅勃茲以及凱西艾佛列克等人，預計都將會回歸。\n\n\
  不過「瞞天過海4」多年來未能拍攝，主要因為與原團隊的伯尼麥克、卡爾雷納離世有關\n，讓喬治克隆尼、布萊德彼特等人認為原始團隊已經無法再度合體而作罷，沒想到去年克\n\
  隆尼突然在受訪時提到「瞞天過海4」的劇本已經出爐，風格會偏近「瀟灑搶一回」，當\n然也會維持詼諧風格，只是麥特戴蒙也想延攬艾德華柏格執導「神鬼認證6」，但目前狀\n\
  況還未明。\n\n此外，華納兄弟影業也正在計畫「瞞天過海前傳」，並邀來「芭比Barbie」瑪格蘿比、萊\n恩葛斯林共同主演，將飾演喬治克隆尼飾演的角色「丹尼歐遜」的父母，當時喬治還開心\n\
  表示「瑪格要演我的母親？我一直覺得這很棒，然後萊恩葛斯林要演我父親，仔細想想，\n這是有道理的，確實如此」，證實該計畫也還在進行中。\n--\n\n     \n\
  \n--"
