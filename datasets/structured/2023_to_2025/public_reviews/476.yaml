  鑽石的鎖打不開，一通電話找鎖匠，鎖匠拿鑰匙來->問題解決！


  不知道怎麼做贗品，一通電話，有人搬了神奇3D雕刻機+掃描眼鏡來->問題解決！


  無聊死了…不建議浪費時間看


