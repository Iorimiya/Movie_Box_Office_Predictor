title: '[討論] Apple TV 特價 重磅腥聞/瞞天過海/特洛伊'
content: '【2024/09/27 Apple TV 特價報】

  重磅腥聞／鐵幕行動／夜訪吸血鬼／瞞天過海系列／真愛旅程／忍者龜： 變種大亂鬥／

  捍衛生死線

  －

  今天的月底特價片單可說是近期量最大的一波，除了例行的爆米花日外，還有派拉蒙跟其

  他活動片單，非常豐富。其中$90的部分我大推改編自知名媒體圈醜聞的《重磅腥聞》，

  由莎莉賽隆、妮可基嫚和瑪格羅比三位重量級巨星共演，算是話題十足的代表性作品，非

  常值得收藏。另外由傑瑞德·巴特勒主演的動作片《全面攻佔》系列目前也是第一和第三

  集同步特價；還有《蠟筆小新：幽靈忍者珍風傳》也是難得$90，可以把握一下。

  －

  緊接著是這次Apple TV的官方活動，針對布萊德彼特和喬治克隆尼兩位帥氣影星的作品做

  了頗大規模的特價。喬治克隆尼的犯罪代表作《瞞天過海》系列目前有前三集全面$190，

  布萊德彼特的部分也有《夜訪吸血鬼》和《班傑明的奇幻旅程》等經典演出，粉絲們千萬

  別錯過了。

  －

  再來還有超有誠意的派拉蒙特價，《真愛旅程》和《忍者龜： 變種大亂鬥》兩部難得特

  價的4K作品都在特價之列。尤其前者是由李奧納多狄卡皮歐和凱特溫絲蕾合演夫妻，詮釋

  出和兩人經典合作作品《鐵達尼號》中截然不同的關係與情緒。最後，爆米花日有基努李

  維主演的《捍衛生死線》和童趣十足、畫面優美的《企鵝公路》，總之片子超多，大家慢

  慢看囉～

  －

  以上，祝大家看片愉快！

