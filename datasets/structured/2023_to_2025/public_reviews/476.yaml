url: https://www.ptt.cc/bbs/movie/M.1529487106.A.3FA.html
title: '[討論] 瞞天8美裡 哪個角色貢獻度最大 (有雷)'
content: '應該是看完蠻多人討論的話題吧


  對整起珠寶竊案來說

  誰貢獻度最高?



  1.珊卓布拉克- 總策劃監督.招募.各種守門.栽贓


  2.凱特布蘭琪- 總部提供.招募.放瀉藥.遙控潛水艇


  3.蕾哈娜 - 各種理組技術支援.妹妹


  4.海倫娜寶漢卡特- 名氣夠大.說服卡蒂亞.掃描 (偷拍被發現扣分)


  5.莎拉寶森 - 偽造機器採購.混入VOUGE.監督端盤子工讀生


  6.明蒂卡靈 - 拆卸珠寶(有時間壓力).讓土桑從地下室搬到樓上


  7.奧卡菲娜 - 潛入廁所.換項鍊(當事人早就知道?)


  8.安海瑟薇 - 裝傻.拯救上面7個



  不能說小顏小顏小顏~  只討論8個


  ========================


  就我來看，除了1跟3外


  5看似不起眼，但在軟硬體的貢獻度都超高


  8不用說 救世主


  --'
