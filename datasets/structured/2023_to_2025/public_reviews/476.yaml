url: https://www.ptt.cc/bbs/movie/M.1535434222.A.C39.html
title: '[負雷] 瞞天過海：八面玲瓏'
content: '防雷





























  作為一個以女性替代男性擔綱主角的系列作，

  我覺得這部片真的難看呀，

  虧我當初很期待，

  但這部片難看真心不是因為性別的關係，

  在劇本和拍攝上就是拍爛啦！！！

  (讓我不禁聯想到前幾年的女版捉鬼特攻隊，真心疑惑主角換性別難道就不會拍了嗎？但

  女版捉鬼還有點趣味，八面玲瓏根本把觀眾當白癡呀！！！)


  看完心情跟下圖一樣，傻眼



  劇情想要承襲瞞天過海系列的風格，

  我們的幻影旅團團長，

  想要幹件偷盜大事(珊卓布拉克棒棒)，

  然後到處招兵買馬。

  但想想瞞天過海重拍的第一集都幾年的事了，

  劇本在這點了無新意就算了，

  重點是拍得比第一集還差。


  比起第一集，

  每個人物個性的強烈風格，

  會反映在分工上，

  人物的刻劃是有趣的；

  但是八面玲瓏的這個續集，

  女角的性格不會讓我沒有很強烈的代入感，

  我覺得找幫手的劇情根本沒必要。

  珊卓找了個老夥伴、

  珊卓找了個服裝設計師、

  珊卓找了個珠寶設計師、

  珊卓找了個小偷、

  珊卓找了個駭客、

  這些流水帳橋段真是無聊呀！！！

  尤其是服裝設計師，

  我從頭到尾都覺得他應該會背叛(竟然沒有？？)，

  劇情應該會有點轉折，

  因為他畢竟也是小有名氣(但過氣)的設計師，

  為了錢加入幻影旅團這種劇情也太瞎；

  然而一瞎還有一瞎瞎，

  劇情中被偷珠寶的安海瑟薇，

  最後也加入了旅團，

  竟然只是因為她沒有女閨蜜，

  WTF!!!!!!!

  乾脆安娜吐溫加入不是更好？

  這樣他就可以告訴導演，

  劇中唯一有服裝設計師的安海瑟薇，

  他的晚宴禮服是前幾醜的。


  再來談一下劇情，

  瞞天過海系列一直是鬥智的影片，

  但八面玲瓏中，

  一直強調我們的團長珊卓布拉克，

  花了多久的時間想了天衣無縫的計劃，

  我覺得項鍊有磁扣這種意外，

  被瑪麗蘇式的運氣解救過去就算了(好不容易有個亮點可以不要這麼輕而易舉嗎？)，

  然後團長看到安海瑟薇才想到要找個服裝設計師加入，

  難道不是臨時起義的嗎？

  說好的事先思考無數次的神鬼計畫呢？？？？


  而且要怎麼確保安海瑟薇一定用他們送去的服裝設計師？

  怎麼確保安海瑟薇一定要戴他們要偷的那條項鍊？？？

  雖然影片有拍出上述問題的答案，

  但這根本就不是歸功於縝密的計畫，

  完全是歸功於運氣好呀！！！


  安海瑟薇的項鍊被偷後，

  這段劇情的最後，

  竟然安排旅團的人拿著假項鍊說找到了，

  天呀這種劇情實在太侮辱觀眾的智商了(;?    Д    `)

  找到贗品的人不會被當作是賊調查嗎？？？？


  說真的他們其實不需要大費周章的偷安海瑟薇的項鍊，

  最後他們又多偷了一堆珠寶，

  真的是滿載而歸呢^^

  那他們就多偷一點博物館展品不就好了？？？

  偷安海瑟薇的項鍊難度不比較高？


  然後說好的攝影機呢？？？？？

  要偷安海瑟薇項鍊的時候：

  導演編劇：攝影機太多大家想個劇情處理一下。

  偷其他珠寶的時候：

  導演編劇：電影快結束了觀眾不要計較那麼多好嗎？？？！


  而且說好不找男人當打手的團長，

  偷其他珠寶的時候竟然找了前幾集的小韓(亞洲人)當打手，

  看到這我懷疑我到腦子是不是也被偷走了，

  讓編劇和導演竟敢如此放肆。


  然後電影另一部分也是講女性的復仇，

  我們的團長為了報復出賣他的男友，

  設了局中局，

  結果也是大失所望，

  原本以為應該會讓負心漢自證己罪之類，

  達到報仇的計畫，

  結果不出意料當然不是這樣，

  竟然是靠最後莫名其妙加入的安海瑟薇，

  在負心男的公寓放一顆被偷項鍊的鑽石栽贓他，

  說好的局中局呢？

  導演編劇：電影快結束了觀眾不要計較那麼多好嗎？？！


  我覺得瞞天過海的題材是有趣的，

  讓一個全女性陣容來演也會是有趣的，

  畢竟前三集都是些臭男人。

  然而瞞天過海八面玲瓏這部電影，

  一直給我一種小家子氣的感覺，

  從開頭女主角騙化妝品騙住飯店，

  到後面劇情的安排漏洞百出，

  都讓我覺得導演沒把這部片拍好，

  似乎要把錯怪在女性擔綱主角，

  無法拍出前幾集由男性擔綱一樣，

  那樣豪氣情義、聰明機智。


  最糟糕的就算製作團隊如此想，

  女性也有很多自己的武器可以發揮，

  但電影呈現出來的就是個主角轉換性別的狗尾續貂，

  我相信劇中的演員陣容都是有一定的實力，

  這是有目共睹的，

  實際上瞞天過海八面玲瓏對我而言就是一部難看的電影，

  如果這部電影標題改成「婦仇者聯盟2鑽死你」

  我想我應該會給它個普評甚至優評，

  但以瞞天過海的續集來說，

  真是個大大的差評呀！！！


  電影結尾更是令人火大，

  當珊卓布拉克對著牆面說著丹尼一定會喜歡她的計畫時，

  我覺得丹尼一定還活著，

  不然他的鬼魂一定會衝破那面牆，

  呼珊卓布拉克兩巴掌。


  --

  導演編劇可能自以為那樣能讓主那樣顯得很行讓她秀一手，根本超爛

  其實電影中有些命名的巧思，像透過Daphne(也是平價品牌名)說一些調侃品牌的話，但看

  完電影後會覺得這些優點完全不想理會(翻白眼)

  可是女生會覺得這個好看嗎？

  我也沒特別用男性角度(那是什麼)去看呀

  如果不是瞞天過海的續集，

  我覺得還可以啦，有點可惜


  頭扭過來和成群的服飾店假人追上來要嚇尿我'
