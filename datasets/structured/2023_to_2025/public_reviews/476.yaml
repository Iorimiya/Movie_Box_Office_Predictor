url: https://www.ptt.cc/bbs/movie/M.1529852530.A.EDB.html
title: '[負雷] 瞞天過海：八面玲瓏--難看到有剩'
content: '最近終於進電影院看這部片

  除了演員演技太爛 讓人看的十分出神

  直接說不能接受的點

  ---------以下有雷-------------------










  1.找到假鑽石橋段不合理

  安海瑟薇 戴著鑽石項鏈上洗手間

  偷竊集團趁機偷到鑽石項鏈要分解

  此時整個博物館封鎖並派大批人員搜索

  偷竊集團為了掩護同伴

  叫另外同伙 拿著預先準備假鑽石項鏈

  喊在水池中發現鑽石項鏈


  原來鑽石項鏈掉下水中 小事小事

  卡地亞安全人員及博物館人員此時鬆一口氣 終於可以讓大伙繼續宴會


  等等 前面不是示範解開鑽石需要特殊磁性裝置才能解開

  安全人員直到進洗手間前

  一直跟著安海瑟薇

  幾乎形影不離那來空檔解開鑽石並丟入水中 為何很厲害的保鏢 博物館人員 警方皆沒人

  當下懷疑有鬼

  更沒立即叫卡地亞人員來檢驗真偽



  2.博物館維安無死角

  維安公司稱整間博物館除了洗手間外

  其它地方完全無死角

  沒人想調錄影畫面

  看誰把鑽石丟到水池裡

  檢到的人又是如何發現水池有鑽石



  3.安全人員無女性

  前面強調卡地亞有做好完善保護

  要偷竊不容易得手

  加上找來很厲害保鏢

  保護安海瑟薇 戴的鑽石項鍊

  卻派二位男性保護

  要是她月事來 需要到廁所弄

  誰來隨側保護


  更別提這二位超厲害保鏢鑽石項鏈被人檢回時 完全不曾懷疑如何被破解磁性鎖

  而掉到水池中



  4.女主角獲邀參加博物館晚宴

  前面強調這場大都會博物館晚宴

  是全美最難參加的晚宴

  參加者需有頭有面且要獲邀參加

  因門口會一一核對名單


  珊卓布拉克 身為剛出獄的罪犯

  事後被發現有參加晚宴且有錄影證明

  光這點警方把剛假釋出獄有偷竊前科的珊卓布拉克列入重要疑犯也不為過


  就算警方不查

  保險公司可向警方提供線索

  合理推論參與犯案


  否則珊卓布拉克 那來資格參加宴會

  往上查 可查出是誰把女主角放入名單中

  應該能查到皆是同伙

  再查再捉可就是一大串


  為何劇情無腦到

  前面講這個晚宴是全美最難參加

  後面卻沒人想查珊卓布拉克

  為何會在晚宴名單裡

  出現在不應該出現的地方





  這部電影算是瞞天過海系列

  最難看的一部

  進戲院看 根本浪費電影票錢


  --

  對了 還有鑽石項鍊偷放入餐盤中

  讓服務生把餐盤拿進廚房

  這一段滿扯


  服務生在途中摸魚停留在走道

  偷竊集團成員 衝進去

  要他們趕緊做事 不要摸魚

  服務生如預期 把餐餐往廚房送

  然後偷竊集團成員 明顯往上對監視器

  打暗號表示事情解決


  奇怪 監視器明明是博物館監視器

  皆有錄影存檔 他們只是駭入畫面觀看

  應該沒有洗掉記錄才對

  否則偷竊其它鑽石珠寶就不用費功夫

  用假畫面騙過監視器


  這麼明顯對監視器打暗號

  一點不怕被人事後追查


  此事一查 輕輕鬆鬆發現此人是博物館負責來賓名單之一的工作人員

  把珊卓布拉克能參加晚宴一事做個掛勾

  再查過去通聯記錄 必能發現皆為同伙


  劇情確實無腦到 針對這點沒人去做追查


  回想好像 還有時間軸有弄錯

  不知道是翻譯出錯還是我記錯


  女主角出獄前跟獄警聊到

  自己被關5年假釋出獄

  出獄後找上前男友 並駡他是背叛者

  中間跟同伴說她這個計劃想了5年多


  後面劇情交代 十年前如何被前男友

  陷害背叛捉去關一事


  一下被關五年 一下回憶十年前....


  前男友看到疑似女主角出現在晚宴

  現場有監視器

  出入口又有記者對來賓一一拍照存證

  證明假釋中的女主角（有竊盜前科）

  出現在不該出現的晚宴


  前男友這麼有錢 找律師調查疑惑不難

  應該可以查出女主角確實有在現場

  滿訝異會沒有聯想到是遭女主角陷害

  前男友沒一口咬死女主角涉有重嫌


  片名不叫笨賊闖天關

  抱持帶點腦觀看此片 跟嚴肅無關'
