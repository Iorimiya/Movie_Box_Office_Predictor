url: https://www.ptt.cc/bbs/movie/M.1471449818.A.F3A.html
title: '[新聞] 華納將避免女瞞天過海重現魔鬼剋星的失利'
content: '新聞網址：



  文/ 林昱漢、Sebox


  華納影業在索尼影業面對女版《魔鬼剋星》（Ghostbusters）票房失利之後的幾周正式

  宣布將要開拍《瞞天過海》（Ocean’s Ocho）重啟女版，這也使得不少人開始對於這

  兩部片做了一些比較與預測。


  第一個最大的差別就是兩部的預算，根據消息來源，女版《瞞天過海》（Ocean’s Ocho

  ）的預算只有 7000 萬美元，整整比女版《魔鬼剋星》的 1 億 5000 萬少了 8000 萬。


  從參與女版《瞞天過海》的人員表示，第二個最大的差別就是角色的性別交換，女版《

  瞞天過海》滿有信心可以做得比女版《魔鬼剋星》好。《瞞天過海》系列的故事是關於

  一群大人，聯手合作進行一場詐欺或是搶劫。比起《魔鬼剋星》較偏向動漫類型的電影

  來說，《瞞天過海》性別轉換較不會受太多限制與束縛。畢竟一方面，以前的《瞞天過

  海》也是根據 1960 年代的一部電影《十一羅漢》（Ocean’s Eleven）由法蘭西斯辛

  納屈（Franci Sinatra）以及他的樂團夥伴鼠黨（Rat Pack）共同演出的。


  第三個差別在於卡司的組成，女版《瞞天過海》由珊卓布拉克（Sandra Bullock）、蕾

  哈娜（Rihanna）、凱特布蘭琪（Cate Blanchett）、安海瑟薇（Anne Hathaway）、

  海倫娜波漢卡特（Helena Bonham Carter）、敏迪卡靈（Mindy Kaling）、說唱歌手

  Awkwafina 已確定出演八位角色當中的七位。卡司當中的珊卓布拉克、敏迪卡靈、凱特

  布蘭琪以及安海瑟薇囊括了四座奧斯卡以及九項提名的記錄，同時他們也是票房的保證

  。


  從珊卓布拉克的《地心引力》（Gravity）、凱特布蘭琪《仙履奇緣》（Cinderella）到

  安海瑟薇《星際效應》（Interstellar）、海倫娜波漢卡特《魔鏡夢遊》（Alice in

  Wonderland），都在票房上有非常亮眼的表現，這些女演員也都可以說是好萊塢的 A 咖

  女演員。


  反觀《魔鬼剋星》由梅莉莎麥卡錫（Melissa McCarthy）、克莉絲汀薇格（Kristen Wiig

  ）、萊絲莉瓊斯（Leslie Jones）以及凱特麥金儂（Kate McKinnon）領銜主演，儘管梅

  莉莎麥卡錫以及克莉絲汀薇格在《伴娘我最大》（Bridesmaids）表現亮眼票房也不差，

  但是兩人在國外的吸引力還是沒有到對票房有幫助的地步，而萊絲莉瓊斯以及凱特麥金

  儂顯然在電影圈來說可以說是新手。


  儘管在這些層面上女版《瞞天過海》可能不會像女版《魔鬼剋星》一樣造成太多的批評

  以及票房上的失利（畢竟預算少，虧的機率也不大），但是更重要的是它究竟能不能超

  越由喬治克隆尼（George Clooney）領軍的原版《瞞天過海》系列，此系列在 2001 年

  到 2007 年三集總共賺了 11 億美元。


  華納影業對於女版《瞞天過海》可是作了十足的準備，不只讓珊卓布拉克擔任執行製作，

  也找來原版的喬治克隆尼以及原版導演史蒂芬索德伯（Steven Soderbergh）擔任製作人

  。而導演由《飢餓遊戲》（The Hunger Games）、《金爆內幕》（Gold）導演蓋瑞羅斯（

  Gary Ross）執導。


  女版《魔鬼剋星》顯然沒有成功燃起觀眾對於原版《魔鬼剋星》的懷念以及對這個系列

  的衝動，而原本的續集計畫看似也較沒望了，許多人指向失利主因是因為它的預算，但

  這部片的預算本身就需要花很多在特效上，而索尼影業的關係企業 Village Roadshow

  這次也將參與女版《瞞天過海》的製作，擔任此片的聯合出品以及聯合製作。


  儘管在台灣的口碑十分亮眼，女版《魔鬼剋星》在全球的票房表現實在不出色，全球票

  房只有 1 億 8100 萬美元，讓不少公司開始重新評估重啟女版的可行性，其中也包含

  了福斯影業的《天降奇兵》（The League of Extraordinary Gentlemen）。


  但華納影業信誓旦旦的表示自己絕對不會收到像《魔鬼剋星》一樣的票房失利表，尤其

  是海外的部分。當初華納影業尋找卡司時，不光只是將八位劫匪聚集起來，而是希望能

  夠把世界聚在一起，因此電影中的八女主角將會有不同膚色、不同背景的角色，希望

  可以透過這些角色，反映世界各地的觀眾，雖然目前只有七位演員是確定的，而對於

  最後一位演員，我們知道一個肯定的答案：一定會是女的！（威說什麼廢話！）


  ------------------------------------------------------------------------------


  參考外電:THR

