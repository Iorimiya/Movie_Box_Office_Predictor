url: https://www.ptt.cc/bbs/movie/M.1529593253.A.947.html
title: '[普雷] 瞞天過海 無特效無劇情  '
content: "防雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n走出戲院 感覺這部片少了甚麼\n\n\
  應該是沒有爆破戲的關係  也沒有現金數字一直跳\n\n老實說我身為男性  真的對珠寶一點感覺都沒有\n\n最後那個冰箱打開秀出額外珠寶的時候 我心裡只是想\n\n\
  喔! 好多藍色的玻璃球喔\n\n\n\n瞞天過海系列好看 讓觀眾感到興奮的要素有幾個\n\n\n1.觀眾確實很想得到的東西 而且是收藏在守衛森嚴的金庫\n\n\
  \  第一集不用說 保護傘總部等級的地下碉堡放著幾億美金現鈔\n\n  劇情鋪陳不斷介紹各種用途的小夥伴 根本是組隊去刷副本\n\n  二不太熟  三的目標是給一個討厭鬼教訓\
  \ 搞垮他的事業 替朋友報仇\n\n  算是賣觀眾一個同仇敵愾的感覺給觀眾\n\n  可是這一集的目標 說真的有點薄弱 沒有典故沒有劇情鋪陳\n\n  就是我們的女主角出獄了想要偷偷看\
  \  就是這樣\n\n  不管是卡地亞店面地下室還是安海瑟威的海咪咪上\n\n  都沒有讓觀眾產生這東西很吸引人 非常貴重受到嚴密保護的感覺\n\n  然後你還在坐在馬桶上在廁所裡把這寶貴的目標大卸八塊\n\
  \n  搞得像小朋友在廁所把積木拆開來送給朋友一樣 噁心死了\n\n\n2.反派\n\n  對 這集沒有反派 或許編劇天真的以為搞個花心男\n\n  就能讓女性觀眾產生共鳴覺得他是大反派\
  \ 想讓他有報應\n\n  不過感覺真的沒甚麼效果 因為是女人主角的電影所以反派就要是渣男??\n\n  這概念有點政治正確過頭到有點歧視女性了吧...\n\n\
  \n  回顧第一集的班尼迪克蛋  嚴謹的大魔王 讓人覺得是拉斯維加斯之王\n\n  第三集的班克 不擇手段 出賣創業夥伴的守財奴\n\n  都讓觀眾覺得被偷的目標真的很討厭\
  \ 主角們是帥氣的義賊\n\n  讓觀眾有帶入感 移情作用希望他們成功\n\n\n  這集我只覺得一群瘋婆子在欺負老實認真的珠寶店員工\n\n  而且還用自己笨愛上渣男亂簽文件這種搞笑理由來正當化\n\
  \n\n3.嚴謹加上爆點在最後的劇情\n\n\n  原來監視器畫面是假的 霹靂小組也是假的!!\n\n  原來那個FBI是馬克華伯格他爸 都是一夥的!!\n\n\
  \n  這種劇情慢慢鋪陳到最後的高潮 再用爆破場面做結尾\n\n  才是瞞天過海好看的地方啊\n\n\n  這一集?  卡地亞保全為什麼不懷疑項鍊為什麼會在水池裡?\n\
  \n  他們明明看著安海瑟威戴著衝進廁所的啊  找回來後沒有立刻帶給主管驗貨\n\n  甚至常理來說應該嚇的終止合作趕快帶回店裡面才對\n\n\n  安海瑟威毫不考慮就在兩三天前想跟她們合作?\
  \ 為了一線女星要賺到不難的\n\n  幾千萬美金這個數字? 因為沒女性朋友空虛寂寞覺得冷? 冒著事業毀掉的風險?\n\n\n  中途冒出來的那個偵探又是哪位?\
  \ 都查到這麼詳細了\n\n  人家還你一個大顆點的鑽石就收手? 其他的寶石都不管了?\n\n\n  展品區那種固定不移動的紅外線還要這麼大費周章 法國舞蹈家表示不屑\n\
  \n\n  找個阿婆去珠寶店哭哭就能夠銷贓了?? 當其他珠寶同業是笨蛋嗎??\n\n\n\n\n\n\n  這部片雖然卡司很強大也很養眼 但總覺得少了點甚麼\n\
  \n  或許不該說是瞞天過海續集  直接說是獨立的新片比較恰當\n\n  對於珠寶或是安海瑟威有強烈慾望的人很適合去看\n\n\n\n\n\n--"
