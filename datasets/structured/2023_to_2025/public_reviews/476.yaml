url: https://www.ptt.cc/bbs/movie/M.1546764175.A.090.html
title: '[負雷]瞞天過海八面玲瓏：歧視亞洲女'
content: '我以為是有8個各自展現魅力的女性


  結果是有光明正大的階級之分的


  Ocean''s 8其實是 不是8個女主角


  是 6個女角 2個邊緣人


  主角是五白一黑


  珊卓·布拉克，

  凱特·布蘭琪，

  安·海瑟薇，

  蕾哈娜，

  莎拉·保羅森

  海倫娜·寶漢·卡特


  另外兩個邊緣人是亞裔


  一個黃種女

  一個印度女


  故事講的是


  8個女性要在上流宴會Met Gala盜竊一條Cartier鑽石項鍊


  耍帥都是五白一黑  扮醜都是亞裔


  黃種女還在路邊耍寶變戲法討生活一副窮酸


  穿華麗禮服出現在Met Gala主場，交際周旋是白人，五個白女珠光寶氣雍容華貴


  黑女當高級駭客


  然後兩個邊緣人


  黃種人當保安人員  印度人當廚房服務生


  雖然實際是8人合力偷竊項鍊


  可是實際上進行「偷」這個動作的是黃種女，然後印度女接手拆解項鍊


  在「偷」項鍊這件事，動手的主要是黃種女和印度女。白人女和黑女都是負責障眼法和照應

  ，手很乾淨


  這部把美國白人優越感和歧視展露得毫不避諱。


  從海報就看出來了


  排最後面的是印度女，接著是黃種女




  然後這就是一部拍給美國追星族的爛片


  --




  不是笨蛋吧。她算專門演這種個性的角色，在12夜也是這種style，應該是為她量身寫的角

  色


  小羊大大給好雷.......


  她是中韓混血，我本文都不忍心說她是扒手了...黃種人演扒手，怒

  你怎麼可以叫卡特布朗琪偷東西捏，白人高貴的手，當然要叫華裔的小顏偷啊'
