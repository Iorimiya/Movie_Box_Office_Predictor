url: https://www.ptt.cc/bbs/movie/M.1535357440.A.AC0.html
title: 'Re: [吵架雷] 瞞天過海8面玲瓏'
content: '看到k板友以苦主之姿出來發文讓我想起十幾年前的往事...



  某天我和當時的男友A跑去永和美X華二輪戲院看電影，


  平日晚上只有稀稀落落幾組人，我們隨便挑了中間排坐下，


  左前方坐了一對情侶，帶著髮箍的男生(以下稱髮箍男)從開場前就不斷跟女生講解劇情，


  到了電影開演十分鐘仍是不停用我們都清晰可聞的聲音繼續爆雷。


  此時A忍不住開口客氣告知對方：「不好意思，可以請你們安靜點嗎？」


  髮箍男聽到後臉色不悅地閉嘴直到影片結束。


  嗯......看來這人還蠻受教的嘛？！





  事情如果這麼簡單結束就不會有這篇文了。





  在兩部片子中間的休息時間，髮箍男帶著女生離場後又獨自衝進來，


  他站在我們後方拍A肩膀並揪住A的衣領，


  怒氣沖沖說A害他很丟臉，他兄弟在外頭等我們。


  (我心中OS：自己做了丟臉的事情還怪別人？？？)



  A秉持著他一向與人為善的和氣本性跟髮箍男說：


  「有什麼事情好好講，不用這樣啦！」


  眼見髮箍男持續跳針並挑釁要A出去釘孤枝，


  我終於忍不住站起來飆罵髮箍男，並阻止A跟他出去，


  不知道是我臭臉奏效還怎樣，


  髮箍男氣噗噗地走了出去就沒再進來。



  雖然罵跑了中二老屁孩，我還是有所顧忌，


  立刻拉著A換到後方座位區並穿上包包裡的外套，


  接著打電話找了一群人高馬大的學弟從學校飆來，


  確定有足夠人馬保護後才從逃生出口離開，


  呼~真的是名副其實的逃生出口啦！   XD



  在那個手機只有貪食蛇的年代，


  無法錄音錄影存證，也沒有爆料公社可投書，


  但中二的人講不得倒是從來沒變過吶。


  若時空轉移到今天，或許髮箍男也會森七七上來po文公審，


  而我就被寫成對於觀影環境要求過高又潑辣的女人呢！   :p


  --'
