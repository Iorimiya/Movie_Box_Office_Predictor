title: '[請益] 瞞天過海：八面玲瓏  某人當晚的行蹤'
content: "先來個無雷短短心得文。\n\n\n這部片從說要開拍我就期待到現在，等得好苦啊!\n以來說，真的是很推薦這部 XD\n\n尤其是粉，推薦大家一定要去大螢幕讓\n\
  \n\n小安這部也是美出新高度，而且超級亮眼偷走整部電影。\n總的來說我覺得是有喜歡的演員就可以進戲院捧場一下的片子。\n\n\n\n< 以下大雷 >\n\n\n\
  \n\n有個地方一直想都想不太懂，就是凱特飾演的Lou當晚的行動，上來求助一下大家。\n\n在片中，超級忙碌的Lou當晚完成的任務有以下幾項:\n\n1. Standby在外燴車，做了辣醬晚餐給9Ball,\
  \ 順便切個沙威瑪給不識相的客人\n\n2. 假扮成營養師，餐廳內場督查(有看到她抽單子跟催餐)，幫Daphne的餐加料\n\n3. 帥氣騎重機離開\n\n4.\
  \ 換上亮片綠套裝，站在路口跟Debbie相視而笑\n\n5. 事後補述。杜桑不見後博物館封場時，跟Yen一起把展場其他珠寶清空\n\n6. 事後補述。開外燴車載走\
  \ Yen跟珠寶 (Amita有出現短暫幫忙一下下)\n\n\n依照電影片段，除了3.4之外都是穿著廚師服的時候發生的，(3的時候是穿著外套)\n所以推測4應該是發生最晚的事件\n\
  \n覺得疑惑的是，Amita把杜桑拆成 (木土又又又木)之後，交給Constance傳球給了大家\n一人一份新配件，唯獨就沒有帶到傳球給Lou的鏡頭\n\n就算腦補Lou在Amita短暫幫忙推車的那幾秒也從她那收到一份配件好了，\n\
  直接開外燴車離開會場了的Lou為什麼還要冒著被抓的風險換衣服重新混回會場啊?\n\n雖然說鏡頭也沒有拍到Lou走大樓梯或是從會場離開，\n如果不是要去跑趴還特地跑去換這身衣服是不是有點不合理...\n\
  還是說這套就單純是換給凱特迷妹們看的福利而已?\n\n\n卷末附上問題中的當事亮片套裝\n\n\n不知道是不是有什麼我漏掉沒看到或是搞混時間序的地方\n懇請各位幫忙解答!\n\
  \n\n--\n更新偷渡一下。\n\n既然凱珊兩人都在訪問時官方否認說Debbie跟Lou不是一對了，\n那依照系列作總是要跟前任牽扯不清的慣例，\n下一集輪到找露的前任可以拜託是個女生嗎？\n\
  最好是Rooney Mara拜託。\n\n不然加上莎莉賽隆演反派最後再漂白也是很可以。(癡心妄想)\n\n--\n        我表達的不好，是想講沒帶到Constance傳球給Lou的鏡頭\
  \ QQ\n        如果你說的是前作結尾排排站看噴水池那個的話，覺得地鐵景比較像耶\n        (擊掌) <3\n        我表達的不好，是想講沒帶到Constance傳球給Lou的鏡頭\n\
  \        綠色套裝難道只是為了盛裝配上鑽石跟Debbie相視而笑嗎?\n                                       \
  \           (好吧身為百合控我覺得可以。)\n        哇，謝謝你有發現QQ  覺得感動 (擁抱)\n        哈哈也謝謝你  (抱)\n\
  \     感謝大家賞臉 <3 (也抱抱) (題外話，如果你的ID數字是生日的話我們好像同天耶)\n        身為凱特粉我懂你! 這樣你護墊不夠需要棉條\
  \ (遞)\n    考慮一下時間序，目前可能的解釋有：\n    1. Lou開車把Yen 跟珠寶放好後再回去會場找Constance領配件戴出來(超多此一舉)\n\
  \    2. Lou沒有再回會場，單純換上那套綠色禮服搭上鑽石穿給Debbie看 (還是很多餘)\n    3. 隨便都好，就是個來自劇組的Cate Blanchett帥氣大放送\
  \        (迷妹大感激)\n   我剛剛回想了一下，Tammy一開始租禮服的時候就有算上Lou了。到底是為什麼啊....\n     哇是小羊大! 我也不是很懂為什麼有人總是要那樣....\n\
  =========================================================================\n過了一晚我好像腦補到一個比較可能的解釋了。\n\
  \n    Tammy一開始是不知道有杜桑以外這票的 \n所以還是租了Lou的禮服。(但她應該會知道假扮外燴長的Lou要開車離開才對啊...\n還是說給Lou的那套根本從頭到尾都是廚師服?)\n\
  \    Debbie在會合點等Lou出現，如果Lou有出現代表跟Yen那一票順利到手並且平安脫險。\n要是時間超過Lou還沒出現Debbie就要啟動B計畫去救人了(但是妳們不是有對講機嗎?)\n\
  最後Lou不但出現還時間很夠順便換上禮服華麗登場 (反正Tammy都租了。)\n\n...嗯我怎麼覺得最合理的解釋還是給Cate的粉絲福利  /___\\。\n\
  \ 這部演技真的有得發揮的角色應該只有安吧XD 凱特只要有出現在鏡頭上就讓人移不開眼\n真的，每一套正常人穿起來一定會是大災難的衣服她都隨便穿穿就好有型帥到爆炸\n\
  這部片裡Lou的造型全部都是褲裝，而且幾乎每套衣服都有領巾或是領帶式的小配件\n最喜歡招募Rose時那套上面有別針的藍色西裝，裡面有條固定用的金色小綁帶很可愛\n\
  就是個邊看電影邊被Cate帥哭QQ\n水藍色這套真的超帥超好看! >////<\n \n我覺得烏克蘭餐廳這一套也很厲害，怎麼可以側拍都帥成這樣 (應該因為是凱特吧。)\n\
  \ \n還有這套，和風圖案的棒球外套裡面再隨便套個背心加上領巾跟皮褲都帥到不合常理\n\n\nLou跟Debbie不是一對我也不相信!(跟著砸) 只好在同人文中尋找慰藉\n\
  預告片這些畫面正片都剪光是怎樣!\n \n\n是說除了Lou跟Debbie，我覺得Debbie跟Tammy也滿可以的。車庫紙箱咚覺得讚讚 (?)\n     \
  \   1. 破解大家看傻眼那個杜桑後磁鐵+彈簧的特殊裝置，做了把「鎖匙」給主角們\n        2. 爆雷講出九號球的本名XD\n        哈哈，有長很像嗎？XD\n\
  \        他可能只是沒看清楚啦~\n        真的。每次凱特出場就覺得自己快要換氣過度 >///<\n        從她第一次出場那裡幫摻酒小妹抹掉嘴角的酒還瞇眼跟人家講話就被電到快不行\n\
  \   再送上一張帥氣的Lou <3\n        耶耶謝謝你(抱) 有娛樂到大家很開心哈哈 XD\n        有朋友跟我說這樣不夠多塊，應該要拆成木土又又又十八\
  \ XDD\n        如果成真迷妹們就不只是兩三刷可以解決的事情了!!!(握拳)\n其實我進場前本來一直有點期待她們可以稍微打破牆，就像2裡面一直講布魯斯威利\n\
  的某部作品還玩弄了茱莉亞羅勃茲當成梗一樣，\n如果Tammy順口問Lou一句「妳還跟那個玩攝影的在一起嗎?」我會開心到爆炸 XD\n        跪求劇組下集讓Rooney以龍紋身莎蘭德駭客回歸來搶飯碗(X)\
  \ (蕾哈娜：喂！)\n        真的我二刷還是被電得外酥內軟 >/////<\n  再來張福利XD\n        Lou的瀏海總是鬆鬆軟軟的遮住眼睛好像英國老式牧羊犬好可愛好想幫她撥撥\
  \ <3"
