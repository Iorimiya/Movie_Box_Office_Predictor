title: '[新聞] G.Clooney與B.Pitt正洽談回歸"瞞天過海4"'
content: "新聞網址：\n\n原標題:\n\n2024-09-06\n\n\n計劃已久的《瞞天過海4》(Ocean’s 14) 在最近公開了另一個重大新消息，證實了喬治\n\
  克隆尼以及布萊德彼特都將會再次回歸演出他們在系列中的角色。\n\n\n這兩位演員最初於 2001 年上映的首部《瞞天過海》電影以及兩部續集中飾演了丹尼歐遜\n\
  以及洛斯提萊恩，而這系列也於 2018 年推出了由珊卓布拉克主演的女版外傳電影《瞞天\n過海：八面玲瓏》，並創下亮眼的票房成績。\n\n\n喬治克隆尼和布萊德彼特這對搭擋最近合作的《惡狼特工》將於\
  \ Apple TV+ 上線，根據\n《Deadline》網站的報導，\n\n\n\n相關討論現階段仍處於早期發展階段，而愛德華伯格本人也尚未揭露任何消息。在以《西\n\
  線無戰事》榮獲了一座奧斯卡獎後，他的最新執導力作《Conclave》也在最近於特柳賴德\n影展舉行了首映，並獲得亮眼的評價。\n\n\n喬治克隆尼與布萊德彼特證實了有意回歸《瞞天過海4》後，接下來的問題就是還有哪些\n\
  演員將會在這部睽違已久的續集中再次登場。麥特戴蒙和凱西艾佛列克最近一同演出了\n Apple TV+ 發行的《鬧事之徒》，而他們也在媒體宣傳期間向《Screen\
  \ Rant》證實了他\n們並不清楚任何與《瞞天過海4》有關的計劃，但麥特戴蒙確實表達了對於再次參與在這\n個系列中的興趣，表示前提是能讓原班人馬再次聚集，而且有好劇本。\n\
  \n\n可惜的是，系列班底演員伯尼麥克和卡爾雷納已經分別在 2008 以及 2020 年不幸逝世。\n\n\n至於珊卓布拉克在《瞞天過海：八面玲瓏》中飾演的角色也是來自歐遜家族，而艾略特古\n\
  德以及秦少波都有在片中客串登場，\n\n\n\n除了伯尼麥克和卡爾雷納之外，其他來自《瞞天過海》系列的演員都有可能在這部續集中\n再次登場，包含茱莉亞羅伯茲和唐奇鐸。\n\
  \n\n《瞞天過海》系列一直以來都擁有非常豪華的卡司陣容，而《瞞天過海 4》也令人十分期\n待，同時也可能帶來一段全新且獨立的行搶故事，讓觀眾們不需要看過原版三部曲或外傳\n\
  就能快速進入狀況，但同時讓系列老粉所熟悉的角色們再次登場。\n\n--\n\n大家期待嗎????\n\n--"
