url: https://www.ptt.cc/bbs/movie/M.1465013926.A.579.html
title: '[新聞] 凱特布蘭琪有望加盟全女生版《瞞天過海》'
content: '由《飢餓遊戲》蓋瑞羅斯（Gary Ross）執導、《危機女王》珊卓布拉克（Sandra

  Bullock）主演的全女生版《瞞天過海》（Ocean’s Eleven）今日（4）傳出最新消息，

  根據外媒 The Playlist 的內線消息指出，目前劇組人員將這部電影暱稱為《Ocean’s

  Ocho》，而「Ocho」在西班牙文中是數字 8 的意思，因此新電影中的俠盜團可能只有 8

  人，而不是原版電影的 11 人。


  另外，奧斯卡影后《因為愛你》凱特布蘭琪（Cate Blanchett）也有望加盟本片，將與

  珊卓布拉克分別扮演 2001 年版《瞞天過海》中 布萊德彼特（Brad Pitt）及 喬治克隆

  尼（George Clooney）的角色，但並不是將這兩個角色直接性別轉換，只是會擁有類似的

  夥伴關係。


  日前也傳出導演 蓋瑞羅斯有意找奧斯卡影后 珍妮佛勞倫斯（Jennifer Lawrence）加入

  本片，兩人在《飢餓遊戲》（The Hunger Games）中首度合作，正計畫攜手將暢銷小說《

  凜冬將至》（Burial Rites）及諾貝爾文學獎得主 史坦貝克（John Steinbeck）的經典

  南北戰爭小說《伊甸園東》（East of Eden）搬上大螢幕。但《瞞天過海》預計 2016 年

  秋冬開拍，可能使得 珍妮佛勞倫斯的檔期無法配合。


  另一方面，之前也有消息指出女生版《瞞天過海》會是 2001 年《瞞天過海》系列的外傳

  ，但 喬治克隆尼飾演的丹尼歐遜已經確定不會在新片中客串，只是 The Playlist 也提

  到，如果電影成功賣座，製作方也有拍攝續集的打算，到時候也可能再安排原班人馬出場

  。


  最近越來越多電影以「全女生」的模式翻拍，索尼影業 2016 暑假的新片《魔鬼剋星》（

  Ghostbuster）就是另一個例子，卻普遍不被影迷看好，事實上，女生版《瞞天過海》的

  提案早於《魔鬼剋星》，只是索尼選擇搶先製作後者。


  《未定名瞞天過海電影》目前上映時間未定。



  --'
