url: https://www.ptt.cc/bbs/movie/M.1529085790.A.082.html
title: 'Re: [吵架雷] 瞞天過海8面玲瓏'
content: '剛洗完澡看到這個吵架雷不禁噗哧笑了出來， 在版友往下看之前先澄清我不認識這兩位

  事主，更不在現場，只是就兩方說法發表一下淺薄的意見：


  1. 目前版上一面倒的說法是認為k大有錯在先，不應講話，的確，大家花錢看電影都是想

  要放鬆，覺得旁人影響自己的時候也該適時告訴對方，不過我想先釐清一點，請問q大的

  朋友在告知k大時的口氣是否溫和而不是出口就讓人感受到敵意？ 如果不是的話我們再來

  探究k大夫妻檔的髒話


  2. 承如各位版友所說看電影不應講話，但我覺得這已經是道德勒索的境界了，我只想知

  道講這些話的版友也有這樣嚴以律己，在電影院真的連一丁點聲音都沒發出過嗎（包含笑

  聲）？即使是，我覺得你們也無權這樣要求別人，公共場合不可大聲喧嘩是從小就知道的

  事情，可是如果自己是個神經容易緊張，需要絕對安靜的人我想你們還是少出來受氣好，

  因為你不能要求每人都達到你所謂的標準。


  3.發這些已做好會被噓或覺得是親友團來支援的準備，但我真是受夠現今台灣只靠片面之

  詞就跑出來發表言論的正義魔人，明明不是當事人還講得頭頭是道，等哪天我們遇到了就

  知道誰是瘋子了。


  4.清者自清，q大朋友或是k大也不用再解釋讓鄉民看戲了，還是好好想想今年端午怎麼做

  才能成功立蛋吧XD


  by 也曾在電影院遇到神經病莫名受氣的瘋子磁鐵


  --'
