title: '[討論] iTunes特價報 辛德勒的名單/瞞天過海1+2'
content: '【2022/02/08 iTunes 特價報】

  從我所見／辛德勒的名單／火柴人／瞞天過海系列／駭客任務系列

  －

  這禮拜最超值的片絕對是難得特價到$190的《辛德勒的名單》，這部電影改編自由真實事

  件啟發的小說，描寫德國納粹商人辛德勒在二戰期間努力拯救猶太難民們的故事。導演史

  蒂芬史匹柏以頂級的製作水準重現當時氛圍，奪下奧斯卡最佳電影等多項大獎。圍繞猶太

  人與納粹題材的電影非常多，但這部片絕對是其中的佼佼者，值得收藏。

  －

  這次官方$90的特價電影，是一樣好評如潮的紀錄片《從我所見》。這部片從白宮攝影師

  的觀點記錄了雷根與歐巴馬兩名總統，內容有不少珍貴的第一手畫面，對美國政治人物有

  興趣的朋友應該會喜歡。另外我們這次也把一些$190特價的好片做個整理，其中兩集《瞞

  天過海》也是比較難得特價的片，可以參考看看。

  －

  最後，隨著《駭客任務: 復活》上架，其他三部前作也小特價到$290，整個買下來會比套

  裝的原價$990便宜一些，如果只想收單部的話也是不錯的入手機會。

  －

  另外過年期間的特價目前還有，但應該快結束了，還沒跟到的可以參考  和

