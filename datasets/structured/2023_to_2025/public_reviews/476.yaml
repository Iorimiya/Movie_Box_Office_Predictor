url: https://www.ptt.cc/bbs/movie/M.1529953695.A.FFD.html
title: '[負雷] 瞞天過海 八面玲瓏 A級卡司 C級劇情 '
content: "看了頗為失望，真的是和男版差有點大。\n\n現在imdb已經剩下6.3分，比之前系列作較差的Ocean's 12的6.5分還低。\n\n因為演員buff，所以許多很多地方分開看起來都是很棒的，\n\
  \n但湊起來就是不夠完整，許多地方很牽強，令人失望。\n\n1. Debbie跳級也太快。認識前男友時還在跟露玩賓果詐欺...\n一出獄就是1.5億美金的超級搶案。雖然有Ocean之血加持，但經驗還差了些吧\n\
  \n2. 亞裔女扒手讓人有出神入化的既視感。偷手錶只要被偷的人說還我就好...\n還記得第一集的Linus偷乘客皮夾的畫面嗎？\n\n3. 偷東西的過程真是毫無高潮。或許是Debbie的計劃能力太強...但偷東西遇到\n\
  突發狀況，不就是這種片的醍醐味嗎？\n但大部分的突發狀況都是用讓某人去講話拖時間帶過去\n像是發現項鍊上有磁鐵。9號球就打個電話就解決了...那這有必要演出來嗎?\n\
  把項鍊放回去也是神扯，Tammy丟到水裡再撿起來，那個神樣保險調查員會沒看到嗎?\n\n4. 不知道保險調查員來幹嘛的。James Corden很有趣，\n \
  \  但不知所謂的調查和談判，變成只是Debbie拿來陷害前男友的工具。\n\n5. Yen出場讓人懷念，但感覺是硬湊的。還記得Debbie說預算只有2萬美金。\n\
  \   後面也沒說分他錢，可能Yen是看Danny面子免費出場偷幾億美金的項鍊吧...\n   他的腳色很關鍵，這樣應該要改成Ocean's 8+1\n\n6.\
  \ 珊卓、安、凱特、海倫娜都演得很好，但是除了珊卓和凱特間，\n   其他的腳色都沒甚麼火花。\n\n7. 吐槽、嘴砲、搞笑是瞞天過海系列最吸引人的部份，也是靠這些把大咖們串在一起，\n\
  \   也許女版想要走其他路線，但目前看來是差強人意，徒然浪費了一票好演員。\n\n8. 如果Danny可以出來稍微露個臉和Debbie互動一下就好；好懷念Rusty吃東西的樣子。\n\
  \n\n\n\n--"
