  想問一下珊卓布拉克飾演的角色常常拿的那張清單是什麼呢？


  印象中他在飯店泡澡時有拍到一下


  看起來跟監獄或矯正署有關


  而在偷珠寶成功的那個晚上他有把他拿出來並劃掉一行


  快樂什麼的XD


  有點摸不著頭緒


  那到底對女主是什麼樣意義的東西呢？




  p.s.1 安好正啊啊啊

  p.s.2 凱特布蘭琪根本本片男主角


