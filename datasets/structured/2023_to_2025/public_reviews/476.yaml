url: https://www.ptt.cc/bbs/movie/M.1702521310.A.907.html
title: '[新聞] 喬治克隆尼透露《瞞天過海4》劇本已經寫好'
content: '新聞網址：


  2023-12-14 09:41:54



  主打明星同樂會的《瞞天過海》（Ocean''s Eleven）系列，近年仍不斷在網羅更多明星加

  入演出。2018 年，該系列首次推出了全女性陣容的外傳《瞞天過海：八面玲瓏》（

  Ocean''s 8），而





  近期正在宣傳最新執導作品《The Boys in the Boat》的喬治克隆尼（George Clooney）

  ，就於《UPROXX》的訪談中透露，正傳系列的《瞞天過海 4》很可能成真，「我們現在已

  經為下一集寫出很棒的劇本，




  但克隆尼也強調，他不認為這劇本算是傳統定義上的第四集：「我不太想將它稱之為《瞞

  天過海 4》... 這劇本的概念有點像是《三個老槍手》（2017 年電影《瀟灑搶一回》的

  原版作品，敘述三個毫無搶劫經驗的老人臨時起意當起了銀行搶匪） 。」克隆尼笑稱，

  他已經快到可以演這種老人角色的年紀了。



  同為正傳系列卡司的唐奇鐸（Don Cheadle）過去就曾透露，正傳系列的導演-史蒂芬索德

  柏（Steven Soderbergh）早有萌生第四部的點子，而如今看來，他的點子似乎是取得了

  進展。



  --'
