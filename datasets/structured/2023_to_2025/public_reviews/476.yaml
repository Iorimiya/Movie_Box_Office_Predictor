title: '[討論] 瞞天過海預告'
content: '瞞天過海1到三 我每年基本都會翻出來看個1、2次

  不論品味、風格還是劇情就算過了快17年還是比現在一堆特效滿滿的類似劇情電影好太多

  了


  可是昨天出了新版預告...

  怎麼說呢......莫名的不期待啊...

  一開頭看到珊卓布拉克就感覺很不妙

  還有蕾哈娜

  可是身邊很多人都說感覺很好看

  是我不食人間煙火嗎



  --'
