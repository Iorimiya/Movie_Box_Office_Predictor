url: https://www.ptt.cc/bbs/movie/M.1465531927.A.030.html
title: '[情報] 海倫娜寶漢卡特 與 明蒂卡林 洽談加入女性版《瞞天過海》'
content: '女性版本的《瞞天過海》這幾週不斷的公開與多位演員洽談加入的消息，上週才傳出《藍

  色茉莉》奧斯卡影后 Cate Blanchett 有望加盟之外，今天又再度傳出有兩位演員也正在

  洽談加入該部電影的陣容，分別是《王者之聲：宣戰時刻》奧斯卡入圍 Helena Bonham

  Carter 以及《辦公室瘋雲》艾美獎入圍 Mindy Kaling（近期代表作為《腦筋急轉彎》中

  「厭厭」的配音演出）兩位女演員有望加入這部由 《奔騰年代》Gary Ross 執導、《攻

  其不備》奧斯卡影后 Sandra Bullock 領銜的女性版《瞞天過海》陣容。


  透露此消息的「Showbiz 411」也對於電影的劇情做出了進一步的報導，Sandra Bullock

  將會飾演當年 George Clooney 飾演的 Danny Ocean 一位有犯罪前科的妹妹，Cate

  Blanchett 則是飾演 Sandra Bullock 的搭檔，如同2001 年中 Brad Pitt 所飾演的

  Rusty Ryan 同等的角色定位。至於 Helena Bonham Carter 與 Mindy Kaling 將會飾演

  怎樣的角色則尚未有進一部的說明，但根據新版的非官方正式電影名稱《Ocean’s Ocho

  》（Ocho 為西班牙文中「8」的意思）來看，沒有意外的話，將會是這八人俠盜團中的成

  員之二。


  《Ocean’s Ocho》的故事內容則描述這個由 Sandra Bullock 為首的八人俠盜團會潛入

  素有「時尚奧斯卡」之稱的紐約大都會博物館慈善晚宴「Met Ball」中竊取一條項鍊，為

  了將罪行栽贓給一位卑鄙可恥的惡畫廊老闆。


  《Ocean’s Ocho》將會於今年秋季開拍，這也代表著擔任這部電影製片人的 Gary Ross

  、George Clooney 以及同時為 2001 年版導演的 Steven Soderbergh 必須加快腳步將八

  位成員都找齊，而之前也傳出洽談加入演員陣容的《翻轉幸福》Jennifer Lawrence 因為

  目前有多部片約在手，包括今日剛確定將與《大賣空》導演 Adam McKay 合作，飾演新創

  生技公司「Theranos」的創辦人 Elizabeth Holmes，以至於遲遲尚未確定是否能如期加

  入，也有外媒建議若 Jennifer Lawrence 正式簽約加入《Ocean’s Ocho》的陣容，可以

  找來他的好友《姐姐愛最大》Amy Schumer 一起飾演當年由 Casey Affleck 與 Scott

  Caan 扮演的 Malloy 兄弟檔。


  除此之外，剛退出《歌喉讚3》導演職位的 Elizabeth Banks 目前也傳出為目標人選之一

  。


  --'
