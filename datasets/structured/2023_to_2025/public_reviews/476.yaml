url: https://www.ptt.cc/bbs/movie/M.1653286844.A.458.html
title: '[新聞] 怪獸與鄧不利多的秘密堪比魔法版瞞天過海'
content: '新聞網址：



  艾迪瑞德曼認為《怪獸與鄧不利多的秘密》是魔法版《瞞天過海》。MyVideo提供

  圖片來源 : 蘋果新聞網



  哈利波特魔法世界最新系列電影《怪獸與鄧不利多的秘密》依舊由艾迪瑞德曼（Eddie

  Redmayne）擔任主角「紐特」，這次故事圍繞在鄧不利多和宿敵葛林戴華德2人長久以來

  的愛恨情仇，鄧不利多為了抵禦葛林戴華德將對世界帶來的衝擊，決定招集一群充滿正義

  感的魔法師包括他的愛徒紐特，以及一位不懂魔法的「麻瓜」一起對抗暗黑勢力。



  飾演鄧不利多的裘德洛（Jude Law）表示這對師徒關係在本集有微妙的變化，雖然紐特是

  鄧不利多的學生，但隨著紐特的成熟與對善惡的堅持，「兩人關係越來越平等，也像是朋

  友。」



  《怪獸與鄧不利多的秘密》裘德洛飾演鄧不利多。MyVideo提供

  圖片來源 : 蘋果新聞網





  ，他在演出前特地為角色發展出個人背景故事以助於入戲

  ，「希望葛林戴華德不只是能立即蠱惑人心，我認為他童年的家庭可能遭遇一些事情，所

  以仇恨持續圍繞著他」，他還嘗試詢問系列原著作者J.K.羅琳的意見，但是對方給予他百

  分百的自由創造角色深度。裘德洛也大讚和邁茲米克森米克森合作時可以感受到對方已經

  做好許多功課，也有很多好點子，「我們和導演討論2個角色的過去，一起了解曾經發生

  的事情！」除了《怪獸與鄧不利多的秘密》搶先版將於5月30日上架外，《哈利波特20週

  年：重返霍格華茲》也將於5月23日在MyVideo播出。（臺孝婷／綜合報導）



  --'
