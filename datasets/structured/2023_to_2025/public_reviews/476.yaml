url: https://www.ptt.cc/bbs/movie/M.1529155115.A.F44.html
title: '[普雷] 《瞞天過海：八面玲瓏》掌握之中輕輕鬆鬆'
content: "圖文好讀版  \n\n\n- 以下有《》劇情雷 -\n\n\n\n\n\n捲土再來的《瞞天過海：八面玲瓏》請出清一色的女星使壞，不僅演員陣容眾星雲集，連下手的目標都非常珠光寶氣，整場堪稱華麗的不可視物，看完絕對讓人賞心悅目，可說是身份、身材、身價一次到足。\n\
  \n流暢的自然演技與精準的喬段，行雲流水的劇情彷若盡在掌握之中，這次要挑就挑最難的出手，選在紐約大都會博物館晚宴下手偷走1億5千萬美金的鑽石項鍊，面對無處不在的攝影機和許多雙眼睛，號稱銅牆鐵壁的安保系統將是本次最大的難題。\n\
  \n\n\n\n想解不可能的任務，不可或缺的夥伴組成同樣奇妙的很可以，無論是要騙敵人前先騙自己人的計謀、曾經被誰偷竊的記仇或是假裝經營ebay的平凡家庭主婦，端出刺激賺錢又能解成就的牛肉誰能拒絕，於是20人縮減到7人的組合，上演各種奇門遁甲，輕鬆駕馭在神色自若的哭、收放自如的偷與萬般自然的騙之間，發揮的功效還真是讓人想不到。\n\
  \n遇到偶爾爆發的小危機卻不致命，像是深埋地底的寶物想要透氣、出乎意料的鑽戒扣合鎖科學摸不著邊際、突如其來的前男友亂入。不過管他是誰，自己解決不了的還有隊友，隊友解決不了的還有隊友的妹妹，團結力量大的解釋在這邊一覽無遺。\n\
  \n\n\n\n駭客、竊賊、設計師、珠寶專家與家庭主婦，在各司其職之下，從鏡頭調整個幾公分到去VOGUE應徵，誰負責洗碗誰負責當服務生，每位角色配合的如接力賽般輪番上陣，各顯神通絕不是說說，但還是要感謝臥底的大力相助，誇張不收斂的呆萌，安海瑟威的無辜真不負她的演技。\n\
  \n除了本體之外，竊賊怎麼可以忘了順手牽羊的好習慣，特地請來前集的猴子秀出一身絕活，在全女性的組合裡面，這樣的待遇也算豔福不淺，還有開場就出現的玩具船竟然也佔了重要的角色，前呼後應的安排，《瞞天過海》總能在故事之中翻出許多的會心一笑。\n\
  \n\n\n\n天外飛來一筆的穿插笑點也讓整體增色不少，不論是語言上的轉換還是無厘頭的對白，加上嚴肅場合依舊要講垃圾話，讓人忘了自己正在謀畫的可是驚天動地的盜竊，搞不好是要被抓去坐牢的。不過對於沒朋友的人來說，這樣的刺激相信比賺錢還要過癮。\n\
  \n最後的峰迴路轉，一切其實是公主復仇記順便收點利息，被算計的神偷雪恥敗在偷心之下，真的是什麼人不惹偏偏惹上這個家族，只能說以偷為核心的《瞞天過海》可不是只有為偷而偷，老娘不玩死你就跟你姓的霸氣，看完也算過癮。\n\
  \n\n\n可惜缺點就是太過順風順水缺乏緊張感，導致劇情整體略為平淡，加上結尾的翻轉不夠驚豔，但以演技與角色刻劃來說還算不錯，看在珊卓布拉克在牢裡策劃了5年8個月又12天的份上，就算過關吧。\n\
  \n----------------\n\n安海瑟威一手調情一手拿錢，然後說是來交朋友的，最會騙的應該是她吧！！\n\n電影說輸人的電影開箱文  \n\n--"
