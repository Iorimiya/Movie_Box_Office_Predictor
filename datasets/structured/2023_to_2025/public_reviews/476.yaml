title: 瞞天過海‧最終曲：License to Steal
content: "（原刊於LOOK電影雜誌2007年九月號）\n\n對史蒂芬索德柏來說，當初願意接拍《瞞天過海》系列便是項極不尋常\n的舉動。首部劇情長片《性謊言錄影帶》便一鳴驚人，還不到四十歲便\n\
  成為奧斯卡最佳導演與坎城影展金棕櫚獎雙料得主，然而綜觀功成名就\n的史蒂芬索德柏整個導演生涯中，他從未真正證明自己具有征服票房市\n場的商業魅力。雖然接連兩部《永不妥協》與《天人交戰》最終都斬獲\n\
  了破億的亮麗北美票房，但他卻是在片中秉持了一貫冷調鬱結風格，並\n透過交互剪輯來呈現出碎裂時間點的敘事手法，選擇對所有商業元素反\n其道而行。\n\n在索德柏日後的作品如《正面全裸》、《索拉力星》、《柏林迷宮》中\n\
  ，依然維持著同樣的招牌特性。他從不會刻意選擇去討好大眾，而寧願\n堅持自己的一貫風格。而重拍自1960年同名經典電影的《瞞天過海》，\n反倒以計中計的鬥智搶案、集結大堆頭明星助陣，堆砌出濃厚的娛樂性\n\
  與商業取向，也成就了他創作生涯中最與眾不同的一次出擊。\n\n初次挑戰自己不熟悉的商業領域，他絲毫不敢有片刻大意。向來以彼得\n安德魯之化名同時兼任攝影指導的索德柏極為明瞭自身不足之處，開拍\n\
  之前他便每晚埋首研究大衛芬奇、史蒂芬史匹柏等人的歷年作品，逐格\n逐景地去思索這些商業大導賴以成名之處，他們又如何安排鏡頭運動與\n剪輯順序，才能拍攝出步調緊湊、極具衝擊性的影片。\n\
  \n索德柏可也沒有因為進軍商業領域便放棄自己的固有堅持，而選擇向片\n廠壓力與觀眾喜好低頭。他並不打算把《瞞天過海》拍成一部平凡無奇\n、星光熠熠卻內容空洞的賀歲電影，充斥著無聊的雙關笑話、明星耍帥\n\
  與爆破特效，毫無其他可看之處。既然是改拍自四十年前的經典電影，\n他索性便大膽地顛覆個徹底，讓全片充滿六○年代的復古情懷，而除在\n運鏡與節奏下巧思苦工外，索德柏更選擇用音樂來奠定全片的懷舊調性。\n\
  \n索德柏邀來了曾於同樣以復古氛圍取勝的前作《戰略高手》中合作愉快\n的電子音樂人，在電影配樂家之外同時也是知名DJ的大衛霍姆斯再次為\n本系列操刀。大衛霍姆斯藉由靈魂樂的音韻、放克樂的暢快節奏，再添\n\
  入爵士樂的輕盈玩興，佐以當代電子舞曲節拍，收放自如地將跨年代的\n音樂領域融冶於一爐而顯得絲絲入扣。結合了流暢的貝斯聲線與各式節\n奏樂器，他譜寫的一系列配樂中影像感十足，懷舊復古中更帶有一份新\n\
  潮時髦，正巧與片中人物那玩世不恭、隨性戲鬧的瀟洒性格不謀而合，\n若說《瞞天過海》系列的復古氛圍造就得極為不凡，影像背後、大衛霍\n姆斯的配樂實是功不可沒。\n\
  \n1960的原版電影中請到的演員個個來頭不小，共邀來了五名當年縱橫影\n歌兩界的「鼠幫」成員，法蘭克辛納屈、狄恩馬丁、小山米戴維斯等個\n個都是既演且歌的傳奇人物，新版《瞞天過海》自然不能在演員陣容方\n\
  面有所遜色。索德柏先是找來歷年御用班底喬治克魯尼出演全片靈魂人\n物丹尼歐遜，而曾拜索德柏之賜登上影后寶座的茱莉亞蘿勃茲自然也不\n能缺席，再加上布萊德彼特、麥特戴蒙與安迪賈西亞的助陣，便成就了\n\
  這群平時鮮少能在同一部電影裡出現的頭牌明星陣容。為了能縮減製片\n成本，這幫明星們還自願減薪演出，才讓這群夢幻組合得以成形。\n\n迥異於大部份以搶案為題材的商業電影，《瞞天過海》並沒有把重心放\n\
  在劫案真正發生的過程，反而是鉅細靡遺地去描述籌劃搶案的事前準備\n上。從最初四處招兵買馬、尋找幕後金主，乃至於實地勘察場地、再三\n排練搶案流程，成員們更是來自五湖四海，或專精扒竊、詐欺、易容各\n\
  式騙術，或精通爆破、駕駛、電子通訊之道；電影既深入捕捉了職業罪\n犯們殫智竭慮、各出奇招的地下世界原貌，更藉由這班各懷絕技的罪犯\n們平時互不相讓、幫派黑話齊出的爭強鬥嘴，描述他們一路上如何克服\n\
  了無數意外難關，最終才眾志成城地完成這樁集偷拐搶騙各種精妙詐術\n於一身的「犯罪藝術」。\n\n一路觀賞至最後，觀眾將不只為他們指東打西、暗渡陳倉的絕妙智計而\n\
  歡呼叫好，更為這群犯罪專才們齊聚一堂時攜手合作的友誼而有所共鳴\n，並在最後眾人逐一轉身遠去、毫不留戀地各奔東西的離別畫面中，感\n受到「一期一會」那短暫卻深刻的相遇。\n\
  \n《瞞天過海》系列之所以能夠成功，背後極大因素要歸功於這一群演員\n們彼此相處間的化學效應。光從這三部曲的拍攝過程中，演員們私底下\n彼此作弄嬉鬧的逸事均時有耳聞，顯見他們的交情在銀幕裡外都極為親\n\
  暱。而導演索德柏也給予這班明星們極大的即興發揮空間，照理說演員\n人數如此眾多，在鏡頭裡要安排構圖自然十分令人頭疼，索德柏卻一反\n商業大片的常規，讓演員們自由去決定畫面中的站位編排，甚至出鏡、\n\
  入鏡的順序，也讓演員們能夠更加得心應手地進入角色性格。\n\n首集中有著1960年原版電影作為故事依據，同樣以搶劫拉斯維加斯賭場\n作為電影主題，再添入現代嶄新科技如電子通訊的運用，在劇本發展上\n\
  自然相當順手。而當續集開拍之後，要如何維持既有的黑色幽默，同時\n又在劇情上有所創新，反倒成了索德柏最大的難題。\n\n日後曾執筆過《特勤組》、《神鬼認證：最後通牒》的編劇喬治諾爾菲\n\
  曾寫好一部名為《Honor Among Thieves》的劇本， 預計要由吳宇森來\n執導，最後卻因故擱置。當《瞞天過海》確定要籌拍續集時，片廠便要\n求喬治諾爾菲將該劇本重新改寫細部設定，就此搖身一變成為《瞞天過\n\
  海２：長驅直入》的原創故事。\n\n片中歐遜一幫人為償清債款而被迫出走歐洲，為了爭奪藝術珍寶而與大\n盜夜狐結上了樑子，雙方雅賊就此展開一場鬥智對決。創新本就是續集\n\
  電影天生所需揹負的原罪，而《瞞天過海２》雖然的確走出了首集的路\n子而得以另闢蹊徑，無奈劇本原就不是為這個系列量身訂作，難免顯得\n變調走味，再加上關鍵詭計解釋不清，也讓這部續集顯得相形失色許多。\n\
  \n2007年，終於來到了系列作的最後一集。記取第二集的教訓，索德柏顯\n然是保守許多了，又回到首集中搶劫賭場的老路子，重新返抵紙醉金迷\n的拉斯維加斯，也請來了嗆辛辣、耍兇狠的開山祖師爺艾爾帕西諾來飾\n\
  演片中那名與主角們作對的陰鷙賭場大亨，明顯是打算再度複製首集的\n成功經驗。\n\n片中除邀齊三部曲中的所有演員再次聚首，連大盜夜狐都找回來插花串\n場，更處處顯現對經典原作的致敬，包括片中角色屢屢提及：「既然握\n\
  過辛納屈的手，就應該懂得什麼叫作義氣！」法蘭克辛納屈不僅是1960\n年原版電影中的主角，更是光鮮亮麗的賭城舞台上最具代表性的藝人之\n一，對以賭城為主要舞台的《瞞天過海》系列來說自是象徵意義非凡。\n\
  \n電影前半多在描述籌備細節，繁瑣的連環計讓觀眾看了容易昏頭。索德\n柏不輕易點破講明劇情走向，只把眾多細節安插在一閃即過的畫面中，\n這群死黨們的對話裡也多半暗藏玄機，只待有心人察覺出前後關聯。但\n\
  就如第一集一樣，只要耐心足夠，觀眾便可察覺導演事先埋好的許多插\n曲、笑料與伏筆，而能夠樂在其中。而且索德柏完全不來個前情提要，\n根本不打算解釋裡頭錯綜複雜的人物關係與各自的性格、專長，顯然這\n\
  部第三集是專門為《瞞天過海》影迷所拍攝的，只有看過前兩集的觀眾\n才能全盤通曉箇中樂趣所在。\n\n不僅戲內安排頗具巧思，戲外的演導編組合上也有著趣味的關連性。好\n\
  比受邀為第三集執筆劇本的兩位編劇搭檔大衛李維恩、布萊恩考波曼，\n早於1998年便合力撰寫出一部以詐騙與賭博為題材的《賭王之王》，偷\n拐搶騙早已是他們的拿手好戲，而該片主角之一便是《瞞天過海》系列\n\
  中的男星麥特戴蒙。曾在《教父３》中叔姪傳承接棒的艾爾帕西諾與安\n迪賈西亞，這次反倒成為互不相讓的死對頭；而片中那對愛鬥嘴兄弟檔\n之一的史考特肯恩，現實生活的父親詹姆士肯恩亦是知名老牌男星，曾\n\
  於《教父》中扮演艾爾帕西諾那脾氣暴烈如火的長兄；更甭提艾爾帕西\n諾與片中女秘書、八○年代紅極一時的豔星艾倫芭金，便曾於1989年的\n《激情劊子手》中合演了一對警探與嫌疑犯墜入愛河的奇特情侶組合。\n\
  \n索德柏更埋下了許多精心設計的蛛絲馬跡，如特意讓主角多次引用《教\n父》台詞，連那對鬥嘴兄弟檔的名字都是取自《教父》中的角色，在惡\n搞經典電影的內行趣味之外，顯然更是要向當年藉《教父》嶄露頭角的\n\
  艾爾帕西諾致敬。或為無心巧合、或為特別設計，透過片中眾多演員在\n過去生涯的共同合作經驗，也讓《瞞天過海：十三羅漢》在戲內角色的\n再次聚首之外，更上演了演員們戲外闊別多年後重新攜手演出的大團圓\n\
  戲碼，戲裡戲外都滿是話題、相映成趣。甚至電影在美國上映時還特別\n挑在6月8日，亦即世界海洋日，正與主角Danny Ocean名字中的「海洋」\n相互對應。\n\
  \n第三集中雖未能突破首集範疇，但作為一個系列電影的終曲，已藉由回\n顧與致敬來讓觀眾跟演員們一同在銀幕上相會，在大團圓中一同啜飲香\n檳、摟肩高聲喧笑；光就此點來說，《瞞天過海：十三羅漢》便已十足\n\
  成功。\n\n\n─賭城教父其人其事─\n\n演歌雙棲的老牌巨星法蘭克辛納屈不僅是縱橫數十年的搖擺爵士名歌手\n，終其一生他的名字也始終與黑幫犯罪脫離不了干係。他身邊的叔伯親\n\
  友乃至於同進同出、舉杯歡慶的友人們中多有黑手黨中人，甚至經典黑\n幫電影《教父》三部曲中那位常受教父關照才得以爭取到電影演出機會\n的義裔歌手Johnny Fontane一角，其原型便是依據法蘭克辛納屈所打造\n\
  。據傳法蘭克辛納屈還因原作者Mario Puzo在小說中對此角色的流淚軟\n弱描寫而勃然大怒，更為此憤而在公眾場合公然威脅恫嚇Mario Puzo。\n\n近年來的賭城黑幫動作電影《五路追殺令》中項上人頭遭眾家勢力懸賞\n\
  緝殺的中心人物Buddy \"Aces\" Israel ，也是編導Joe Carnahan以法蘭\n克辛納屈作為靈感而發想出來的。《瞞天過海：十三羅漢》這麼一部原\n\
  作由法蘭克辛納屈所主演、更以賭城與犯罪為主題的電影中，屢屢提及\n法蘭克辛納屈其人其事，其象徵意義自然不言而喻。\n\n--\n\n   \n\n--\n◆ From:\
  \ 59.112.5.137"
