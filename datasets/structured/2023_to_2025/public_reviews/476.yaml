title: '[新聞] PK小丑女? 珊卓布拉克想再拍瞞天過海系列'
content: '新聞網址：



  葛大維

  2023年03月21日



  好萊塢女力「爆到」！影視媒體SCREENRANT報導，





  今年58歲的珊卓以《攻其不備》贏得2010年奧斯卡影后，之後接戲嚴謹，





  2001、2004、2007年推出的《瞞天過海三部曲》，由布萊德彼特、喬治克隆尼、麥特戴蒙

  等合演，全球大賣座，卻遲遲沒有後續；直到《八面玲瓏》票房好，才又有傳言說「布喬

  麥」可望再演《瞞天過海4》，但至今（還）沒下文。



  不過SCREENRANT報導，


  ，但拍攝與公映日期都未定。



  珊卓去年自製自演和錢寧塔圖合演《失落謎城》，又客串演出布萊德彼特演的《子彈列車

  》，之後就沒有推出新片；如今傳出籌拍《八面玲瓏2》，如果屬實，形同和瑪歌羅比的

  《瞞天過海前傳》大PK，備受矚目；而且已顯示好萊塢女星又製又演的趨勢，持續擴展。

  （圖／美聯社）



  --


  2001 瞞天過海             預算8500萬        票房4.50億

  2004 瞞天過海2：長驅直入  預算8500萬~1.1億  票房3.62億

  2007 瞞天過海：13王牌     預算1億           票房3.11億

  2018 瞞天過海：八面玲瓏   預算7000萬        票房2.97億



  大家看好續集或者前傳嗎!!??


  --'
