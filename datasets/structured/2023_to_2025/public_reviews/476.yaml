url: https://www.ptt.cc/bbs/movie/M.1529920740.A.9BF.html
title: '[負雷] 有點太刻意了 瞞天過海:八面玲瓏'
content: '很喜歡之前的瞞天過海系列

  這次有了號稱女性版本 一樣是眾星雲集的

  瞞天過海 八面玲瓏 當然是想進電影院看

  看完之後 其實有點小失望


  很明快清楚的 瞞天過海式的分鏡跟劇情推進

  但我不知道為什麼 感覺珊卓布拉克 和凱特布蘭琪

  並沒有把之前喬治克魯尼 和布萊德彼特的氣勢演出來

  尤其是女主一直斟酌在過去的那段感情和復仇

  讓我覺得 格調就是有點小了

  可能我無法體會吧 那種戀愛卻被背叛的感覺

  但我覺得這個感情線的強調有點多了 可能是表現手法的關係


  另外還有很多不合理的地方 前面都提過

  包含項鍊掉下來 卻沒人發現不用特殊磁鐵

  還有女主潛入這麼高規格的宴會沒人去查 之類的


  還有最後大家都要穿著禮服離開那段 我也是不懂

  為什麼一定要穿著禮服?

  凱特布蘭琪還特地騎車過來 再穿著禮服出現?


  以及安海瑟威 覺得他除了漂亮以外 也演得很棒

  但我對於她後來倒戈那段滿問號的

  好像沒什麼理由 她已經是勝利組了還要參加這票

  說是因為朋友 但我看不出來啊0.0

  是因為劇本不想讓她從頭笨到尾嗎?


  簡單來說 我覺得很多地方都太刻意了

  刻意要強調女性的美和復仇之心

  當然 這可能是另外一個議題了


  --

  是沒錯啦 這只是我的個人感想 我沒看到我想看的'
