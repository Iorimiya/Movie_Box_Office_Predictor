url: https://www.ptt.cc/bbs/movie/M.1463385015.A.224.html
title: '[新聞] 珍妮佛勞倫斯有望加盟全女生版《瞞天過海》'
content: '1960 年發行的劫盜片《瞞天過海》（Ocean''s 11）曾在 2001 年翻拍，找來一線明星《

  地心引力》喬治克隆尼（George Clooney）、《絕地救援》麥特戴蒙（Matt Damon）、《

  怒火特攻隊》布萊德彼特（Brad Pitt）及《享受吧！一個人的旅行》茱莉亞羅勃茲（

  Julia Roberts）等人領銜主演，並由奧斯卡金獎導演《藥命關係》史蒂芬索德柏（

  Steven Soderbergh）執導。去年 10 月再傳出將重啟《瞞天過海》（正式片名尚未公開

  ）的消息，並將由《飢餓遊戲》蓋瑞羅斯執導、奧斯卡影后《危機女王》珊卓布拉克（

  Sandra Bullock）領軍，會是一部全女生版的《瞞天過海》，而近日更有消息指出另一位

  奧斯卡影后也將加盟！


  根據 The Tracking Board 報導，近年來的好萊塢寵兒，曾以《派特的幸福劇本》（

  Silver Linings Playbook）奪得奧斯卡后冠的 珍妮佛勞倫斯（Jennifer Lawrence）有

  望加入本片，與曾在《飢餓遊戲》合作過的 蓋瑞羅斯重聚。


  另外，報導中也提到，這部新的《瞞天過海》電影會是 喬治克隆尼版《瞞天過海》系列

  的外傳，珊卓布拉克將飾演主角丹尼歐遜的姐姐，珍妮佛勞倫斯則是她的得力助手，她們

  將率領一群盜賊，在素有「時尚奧斯卡」之稱的紐約大都會博物館慈善晚宴（Met Gala）

  上偷走一條價值連城的項鍊，並嫁禍給狡詐的館長。



  本片已經由已故製作人 傑瑞溫特勞勃﹙Jerry Weintraub﹚、導演 史蒂芬索德柏及 喬治

  克隆尼著手推動一段時間，劇本則交由《Little Women》Olivia Milch 編寫。如果真的

  是一部外傳電影，是不是也能期待原班人馬的客串呢？


  《未定名瞞天過海電影》目前上映時間未定。



  --'
