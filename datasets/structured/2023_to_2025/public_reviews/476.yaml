url: https://www.ptt.cc/bbs/movie/M.1529597427.A.806.html
title: '[普雷]《瞞天過海：八面玲瓏》姊妹們，順啦！ '
content: '網頁版文章：






  影音導讀：







  《瞞天過海：八面玲瓏》Ocean''s Eight


  姊妹們，順啦！


  by XXY



  以全女性盜賊樣貌重返大銀幕的《瞞天過海》系列新作，《瞞天過海：八面玲瓏》，不管


  如何都看得出其商業目的以及希望延續史帝芬索德柏創造的盜賊傳奇。集合豪華卡司眾星


  的噱頭，確實也成為本片的最大賣點，也是我在觀賞完本片最享受也印象最深刻的地方。


  每位極具實力的演員表現出色，角色與角色間的互相關係也是本片劇本上展現幽默且連貫


  整部的主軸。他讓我看到每個演員之間的火花，也讓我相當享受這策劃搶案、執行搶案，


  到最後解密搶案的過程。




  說到底，《八面玲瓏》給我的感受就是享受這群超高知名度的女星們，如何同框飆戲。除


  此之外，他是否再次創造了索德柏那種讓人充滿讚嘆的驚喜感？我想答案是少了那麼一點


  點雞皮疙瘩的感動。整齊又工整的竊盜行動，巧妙述說了一起玩美又優雅的珠寶失竊案過


  程，縱使電影的流暢性十足，演員們的表現也相當迷人，整起事件卻讓人有種過於順利的


  夢幻感。當中也刻意加入了一些預料外的小插曲，但迎刃而解的處理方式不免讓人有些失


  望。




  然而，《瞞天過海：八面玲瓏》的八位明星如何集結、行動、並成功開啟新的盜賊系列電


  影篇章，也是讓人相當期待的操作。而片中也或多或少提及了由山卓布拉克所飾演的黛比


  歐遜，其哥哥也就是原來《瞞天過海》中的主角：丹尼歐遜在本片劇情時間線的狀態。甚


  至交代了前作中某位男性角色登場，除了讓人有所驚喜外，也埋下了接下來「歐遜集團」


  的故事發展。讓我感到新鮮之處，還有後段由詹姆斯高登所飾演的保險調查員，說明了這


  個盜賊世界觀下的各方觀點，相當有趣。




  《瞞天過海》系列如今以全女性陣容的方式重返大銀幕是否成功？我認為這次的製作打出


  了一張安全牌：劇本雖完整亦有所小驚喜，但整體表現稍嫌工整。流暢極佳且精彩的演員


  表現，與妙語如珠的臺詞對白，確實會讓本系列影迷享受並找回當年《瞞天過海》三部曲


  的趣味。若你是因為卡司陣容上的哪一位明星而期待這部電影的話，相信《瞞天過海：八


  面玲瓏》不會讓你失望。






  --'
