url: https://www.ptt.cc/bbs/movie/M.1485826368.A.8AB.html
title: '[新聞] 氣場十足！女版《瞞天過海》首張劇照曝光'
content: '新聞網址：


  自由


  氣場十足！女版《瞞天過海》首張劇照曝光


  〔記者陳昱均／綜合報導〕《瞞天過海》系列電影最為人所知的，就是總是集結一票重量

  級大咖一起參演，去年就傳出該團隊要拍攝「性轉」的女版《瞞天過海》，這次的卡司也

  依然不容小覷，包含珊卓布拉克、蕾哈娜、凱特布蘭琪、安海瑟薇、海倫娜波漢卡特、莎

  拉保羅森等天后級卡司都共同參演。而昨晚該片的首張劇照就被正式公開，8名女主角一

  起現身地鐵內部的模樣看起來氣場十足，引發熱議。


  女版《瞞天過海》約莫在去年12月初左右正式開拍，當時就曾被目擊在紐約地鐵上取景，

  數名天后級影星都笑容滿面，在拍攝現場互相耍寶搞笑甚至是自拍，看起來相當開心，氣

  氛十分融洽；而這次正式公開的首張劇照就是來自當時的地鐵拍攝場景中，左邊由珊卓布

  拉克打頭陣，後面是凱特布蘭琪、蕾哈娜、敏迪卡靈；右邊則分別是莎拉保羅森、安海瑟

  薇、海倫娜波漢卡特、Awkwafina，8名女星超殺的合體照馬上就在網路上掀起熱烈討論，

  讓人等不及這部預計將於2018年6月正式上映的電影能趕緊再公開更多新預告了。


  女版《瞞天過海》的首張正式劇照在昨天正式曝光。（翻攝自蕾哈娜Instagram）



  女版《瞞天過海》的卡司也十分強大，包含凱特布蘭琪（上排左起）、珊卓布拉克、安海

  瑟薇、莎拉保羅森、Awkwafina（下排左起）、蕾哈娜、海倫娜波漢卡特、敏迪卡靈等人

  都共同出演。（翻攝自Mstars News）



  安海瑟威（右）與英國女星海倫娜寶漢卡特合拍女版《瞞天過海》。（翻攝自鏡報）



  小安（右）開心的與一旁的海倫娜大玩自拍。（翻攝《每日郵報》）



  珊卓布拉克（左）與凱特布蘭琪（右）在拍攝現場笑得十分開心。（翻攝自攝鏡報）


  -------------------------------------------------------------------------

  我的精靈女王~~~好期待啊!


  --'
