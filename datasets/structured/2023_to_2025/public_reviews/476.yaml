title: 'Re: [吵架雷] 瞞天過海8面玲瓏'
content: '有了智慧型手機後


  看電影被打擾的次數逐漸增加


  我前天在南紡威秀晚上9:20


  2廳L排17號看八面玲瓏


  隔壁16號有個下賤的低頭族


  從一開始就遲到了兩分鐘


  遲到就算了


  甫坐下就拿手機出來滑


  滑了幾分鐘後居然給我跑出去


  過了一陣子又跑回來


  幹你老師的事業做這麼大可以不要來看電影嗎？


  完全沒在考慮手機的亮度、走來走去擋人視線等干擾，有多野蠻自私惡劣齷齪垃圾白痴智障


  要不是你後來有收斂一點


  而我也不喜歡在正片放映時出聲制止這些低能行為


  真的很想把整杯可樂往你頭頂倒下去





  --


  Sent from my Tatung Automatic Rice Cooker


