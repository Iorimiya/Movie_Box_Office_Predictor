title: '[贈票] 【瞞天過海:八面玲瓏】最豪華的女王卡司'
content: '最新【瞞天過海:八面玲瓏】PTT電影版贈票開跑囉！


  ★【奔騰年代】、【飢餓遊戲】布萊德派頓執導

  ★【珊卓布拉克】、【凱特布蘭琪】、【安海瑟葳】、【敏迪卡靈】、【莎拉寶森】、【奧卡菲娜】、【蕾哈娜】、【海倫娜波漢卡特】等好萊塢一線女星領銜主演

  ★【瞞天過海:八面玲瓏】6月14日(週四)，美人心計 齊力撈金


  即刻起至2018/5/31 (四) 23：59，推文留言最想看哪位女王在【瞞天過海:八面玲瓏】甩壞飆演技，並至 (電腦網頁版)，點選「想看」並送出，將完成投票的畫面截圖後，連同姓名、PTT帳號、電話寄至wbtaiwan@gmail.com，就有機會前往【瞞天過海:八面玲瓏】電影特映會！


  獎項內容：6/4(一) 19:00大直美麗華 20名 (一人中獎 兩人同行)

  得獎名單將於6/1 (五) 18:00前以電子信件通知領獎事宜


  電影簡介：


  5年8個月又12天，正在計時中。黛比歐遜（珊卓布拉克 飾）就是花這麼多時間策劃她人生中最大的搶案。她明白此計劃需要一群江湖高手，首先她找來她的犯罪搭檔露米勒（凱特布蘭琪
  飾）加入，接著她們號召一組專家，分別為珠寶商雅米塔（敏迪卡靈 飾）、街頭騙子康斯坦絲（奧卡菲娜 飾）、贓物買賣能手譚美（莎拉寶森 飾）、駭客九號球（蕾哈娜 飾）及時裝設計師蘿絲（海倫娜波漢卡特
  飾）她們目標是價值1億5000萬美元的鑽石，就戴在聞名全球的女演員達芙妮克魯格（安海瑟葳

  飾）脖上，她會是年度盛會大都會博物館慈善晚宴的焦點。這個計劃看似滴水不漏，但需一切完美無瑕，這群偷天女賊才能在眾目睽睽下順利混進去又全身而退。


