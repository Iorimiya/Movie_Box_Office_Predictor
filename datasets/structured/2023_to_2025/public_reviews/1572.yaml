title: '[ 負雷] 幽魂娜娜：重生 雷到天邊…'
content: '先說結論，等級很像學生製片拍出來的東西，為了營造恐怖感很多場景都黑，但也黑到讓人

  看不到


  場景，演員，收音，燈光，特效


  全部不合格，看完其實蠻生氣的

  本來不想打這篇，結果剛看奇摩電影被洗到4.4


  就衝著4.4我上來發一篇


  雷文防雷資訊頁








  劇情神爛，懶的吐嘈了



  ----

  Sent from  on my Samsung SM-G9810


