content: '《》


  繼《》後，


  泰國最凶猛女鬼再登大銀幕！


  6/30 ( 五 ) 全台上映！


  泰國歷代最驚悚「」強勢回歸！


  海外觀眾一致好評，票房嚇破62億


  網友盛讚「」


  《》6月30日 (五) 血債血還


  電影預告：




  上映戲院：





  繼《》後，鬼妻娜娜再次現身大銀幕！


  泰國演技歌唱俱佳的影壇小清新麥普蘭塔首次擔綱演出


  癡情幽魂這次不為丈夫回歸，而是為報血仇變厲鬼


  人在做，娜娜在看…


  馬克的妻子蒂娜身懷六甲，厄運卻悄聲降臨，


  一名搶匪闖入家中襲擊，導致蒂娜難產母子俱亡


  正當馬克和警方對搶匪身分一籌莫展時，


  他們的周遭開始發生一連串詭異事件……



