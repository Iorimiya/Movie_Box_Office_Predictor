url: https://www.ptt.cc/bbs/movie/M.1695898809.A.471.html
title: '[普好雷] 奪魂鋸X 熟悉的老頭回來啦'
content: '賀 ！！！ 拼圖老頭颯爽回歸


  奪魂鋸系列的看點之一就是老頭了


  這次回歸也是讓演員有很大的發揮空間


  這集跟系列作不太一樣的是


  34567集都是像在闖關一樣


  一個主要的玩家然後一路通關這樣


  這集比較多文戲


  很有意思的安排


  也看得出來團隊在創作劇本方面想要有突破


  帶來一些新的東西


  只會給普好雷的原因


  還是比較習慣前面系列作的通關模式


  這集節奏也偏慢


  很多時候就看玩家在玩遊戲


  其他人在旁邊加油給鼓勵（？？？


  說教也有點太多


  劇情結構太簡單了沒有很多反轉


  但還是比89集好很多


  然後就是粉絲服務的部分做得不錯


  一些致敬系列作的橋段


  像是老頭從血池那邊爬起來


  跟第一集睡醒那邊87%像


  還有那間廁所也有出來


  霍夫曼 阿曼達找回來演情懷做足


  老粉絲看完覺得算很有誠意了


  最後附上以前阿曼達美美照


  以及很正的賽西莉亞






  -----

  Sent from JPTT on my Samsung SM-A5460.


  --

  真的 阿曼達以前可是辣妹 qq

  笑死 一直旁邊喊燒

  老頭這集有夠菜 剛入道沒多久 心態各種不穩 辛酸畫面流出'
