url: https://www.ptt.cc/bbs/movie/M.1696160672.A.F4D.html
title: '[討論] 奪魂鋸X 的時間點？'
content: '詐騙集團都給我去割腎雷


  回來了

  熟悉的約翰老爺和亞曼達都回來了


  在這個詐騙橫行的時代

  制裁詐騙份子還是要看約翰老爺子啊


  只是對於這部電影的時間點感覺疑惑


  很明顯是奪魂鋸3之前(綁架女醫師給約翰開顱減腦壓那部)

  但約翰已經在治療腦癌了

  這樣的話應該是在奪魂鋸1之後

  也就是戈登醫生鋸掉自己的腳然後活下來成為門徒以後

  (因為戈登就是診斷出約翰腦癌末期的醫生還被約翰發現偷情所以被抓去玩奪魂鋸，可見1的時間應該早於X)

  這樣的話難道約翰去墨西哥之前都不會跟戈登打聽一下這個癌症治療團隊到底有沒有影？

  總不會X時間還比1早吧？


  --'
