title: '[討論] 奪魂鋸X完還有下一集嗎？有雷'
content: '奪魂鋸X的時間是設定在1.2集之間

  這集最後的女醫生沒死

  而且也出現霍夫曼了

  感覺還可以有後續

  上一集沒有老頭實在沒味道

  票房應該很慘

  但從電影公司的角度

  都拍了這麼多集了

  代表獲利不錯

  那老頭只要現實中還在世

  感覺可以一直演下去

  各位覺得還會有下一集嗎？

  我覺得會有耶


  -----

  Sent from JPTT on my iPhone


