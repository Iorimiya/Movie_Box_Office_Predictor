  但值得討論的是：

  如同1-3集裡面一樣

  約翰的遊戲都是可以生存的

  而且他會希望受害者有學習到些什麼


  那為什麼在他大衛腦中 護工最後失敗了？

  以約翰來說 不是應該想像他成功達成遊戲

  最後學習到一些真諦之類的？

  可以理解編劇想讓觀眾多看殘忍畫面

  約翰腦中的畫面不只護工失敗了

  還斷一半沒有斷五根 真的覺得是病態了點

  有一點破壞一直以來約翰塑造的威嚴


