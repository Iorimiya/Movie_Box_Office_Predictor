url: https://www.ptt.cc/bbs/movie/M.1696097188.A.29B.html
title: '[ 負雷] 奪魂鋸X  史詩級大爛片！！！'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  如題


  剛剛在京站威秀看完奪魂鋸X


  真的只能用超級大爛片來形容


  前面敘述我覺得還普通 反正就講拼圖治療癌症的過程


  到了遊戲階段也還可以


  到這邊大概70分


  到後面原本期待拼圖要怎麼制裁垃圾女詐騙首腦的時候


  結果變成拼圖被綁起來玩遊戲 這邊超級超級出戲


  完全不知道這一段在幹什麼


  拼圖玩的遊戲也是有夠爛


  還有那個小孩 不知道蹦出來踢足球到底是衝三小


  到結局更鳥


  最該死的垃圾女詐騙首腦竟然沒死


  還冒那顆頭大叫 跟北七沒兩樣


  奪魂鋸系列最經典的除了玩遊戲之外就是結局的反轉＋爆點


  結果X的結局反轉超爛超難看


  片尾那個彩蛋也是夠爛


  整部片不知道在爛什麼


  想被騙錢的一定要進戲院看


  氣到最後去西門町吃一碗牛肉麵才消氣



  --'
