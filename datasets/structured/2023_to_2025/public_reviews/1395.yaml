url: https://www.ptt.cc/bbs/movie/M.1696033869.A.4D3.html
title: '[討論] 奪魂鋸X的遊戲有bug&寓言(有雷)'
content: "過去從來沒進電影院看奪魂鋸系列\n今年這部續作看到老頭戲份這麼多，加上又是復仇劇立刻進場支持\n看完之後，感覺片中的大反派根本是在暗示伊莉莎白霍姆斯吧\n\
  就是惡血的theranos創辦人，雖然不是針對癌症\n但也是醫療相關企業的詐欺\n\n\n此外那個吸毒女的陷阱設計上是不是故意放水了？\n如果她沒有聽從大反派的說法，而是先敲斷手\n\
  她落地之後也許輻射燈就照不到了\n\n\n這次作品在創新上有兩個懸念，一是通過考驗的那個司機/假醫生\n不知道未來有沒有機會出現\n二是大反派女醫師，沒想到最後她居然還是活了下來\n\
  \  而且幾乎只有皮肉傷，豪宅仍在、銀行的存款估計也不受影響、還是能夠捲土重來\n→她甚至踩了約翰的底線，把已經通過遊戲的毒品女殺掉\n  甚至牽連無辜的小男孩耶...這都能活！？\n\
  \n\n這部電影似乎是在暗諷這種詐欺犯罪，沒背景的小嘍囉終究是棄子\n而幕後黑手總有辦法全身而退\n不過老頭的演出真的滿棒的，被騙了700多萬台幣\n在墨西哥這種鬼地方還能弄出場地設備，repect/\n\
  \n\n\n--\n喔這邊約翰沒有講清楚  到底是被關在那裏等死\n還是最後會照遊戲說的一樣通過者就能活...\n我明白了  可是手機應該還在女魔頭或她被捅死的情人身上耶=\
  \   =\n而且從遊戲的標準來看，女魔頭算是過關了吧。\n以我記得的畫面來說  亞曼達只有收走女魔頭手機\n男生的手機我沒印象怎麼處理了...\n了解  謝謝"
