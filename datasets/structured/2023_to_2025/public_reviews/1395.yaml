title: '[負雷] 奪魂鋸X - 賣情懷能不能不要那麼刻意'
content: '以下有雷


  我知道大家就是想看情懷，但同時也想要一個好的故事

  本片的故事想表達什麼

  其實我看不懂

  還多了很多刻意賣情懷及搞噱頭的東西


  首先

  眼睛接著管子的裝置

  作用完全就只是讓海報及宣傳時可以出現

  電影裡就是老頭的幻想

  而且受害者就只是個會偷東西的醫院清潔工

  有必要嗎

  說不定他薪水很少又有家人要顧

  就像台灣護理師一天工作12小時月領兩萬八

  有需要因為摸走一個手錶眼睛被吸出來嗎


  到墨西哥做手術到結束後綁架醫生

  這段很拖戲

  想要遊戲趕快開始


  到了遊戲環節

  鋸腿跟挖腦袋都很不錯

  是我想看到的奪魂鋸

  不過在看到當下我是期待老頭在觀眾席能按下裝置的停止鍵

  女生腿也鋸了

  你設置的吸管吸太慢也要怪玩家嗎?

  腦袋也夾出一塊了

  藥劑分解太慢怪我囉?

  兩個人應該都有資格活了吧


  過程中比利玩偶的出現也是我覺得賣情懷的一點

  大家都想看到比利沒錯

  不過你都真人現場講解規則了

  有需要比利嗎

  錄音機也沒什麼用

  有人把錄音機丟掉老頭還不是直接廣播


  到了女醫師的遊戲

  是整部最白癡的部分

  技能全點智力的角色

  竟然能被反銬在自己的裝置上

  說真的

  很蠢

  整個橋段就為了讓老頭起身時有那麼一點點像第一集結尾

  而且為什麼那幾個手銬腳鐐都是不需要鑰匙就能自己開的

  難道老頭和阿曼達本來就預期會被反銬住嗎

  這的設計不會被玩家自己摸出來嗎


  還有一點非常奇怪

  快結尾時老頭說"這不是我預期的"

  不然你預期會發生什麼事

  女醫的男友(男病患、跑進工廠那個)被綁起來後

  有兩個可能

  A 接受老頭理論被策反

  B 不接受，可能會去拿槍(或做別的事)

  如果是A

  那女醫的遊戲要跟誰玩

  如果是B

  按照老頭的想法

  應該是讓女醫跟男友玩最終的遊戲

  阿怎麼變成你自己在玩????

  你在幹嘛

  男的不接受策反不是在你的預期之中嗎

  你沒有想好下一步嗎


  結尾三個人一起迎向陽光也很噁心

  你在演奪魂鋸欸

  不是什麼阿甘正傳欸

  是要迎向什麼陽光


  片尾片段我也很有意見

  完全就是為了秀一下第一集的廁所跟霍夫曼露個臉

  不是說這樣不行

  而是你裝置都裝上去了

  機械蟑螂腳也開始動了

  為什麼不讓遊戲完整地進行完

  也不知道那個黑人獲勝條件

  整個很不知所云


  大概是醬

  -----

  Sent from JPTT on my iPhone


  --

  那為啥要預設老頭跟阿曼達上去玩

  用意是什麼'
