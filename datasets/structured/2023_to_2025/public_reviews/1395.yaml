url: https://www.ptt.cc/bbs/movie/M.1695876281.A.CD5.html
title: '[新聞]《奪魂鋸X》首波評價解禁:系列史上最棒續集'
content: "新聞網址：\n\n2023-09-28\n\n\n《奪魂鋸 X》的首波評價已經正式解禁，許多媒體都在社群平台上分享了他們對於這部最\n新續集的初步評論。本片由凱文格勞特執導，喬許史托柏格和彼得戈德芬格擔任編劇，雖\n\
  然是系列在 2021 年《死亡漩渦：奪魂鋸新遊戲》之後推出的第十部電影，但故事設定在\n《奪魂鋸》以及《奪魂鋸 2》之間，講述了由托賓貝爾回歸演出的「拼圖殺人魔」約翰克\n\
  拉莫針對一群來自墨西哥的醫療詐騙集團展開了一場血腥的復仇行動。\n\n\n如今，《奪魂鋸 X》已經在本周正式上映，社群媒體的首波評價也已經正式解禁。以目前\n\
  來說，\n\n\n\n以下為《奪魂鋸 X》首波評價——\n\n\n影評 YouTuber Patrick Burow：\n\n「《奪魂鋸 X》是系列的光榮回歸。不只是讓死亡陷阱達到了完美的程度，我們這次還能\n\
  看到約翰不同的一面。這是一部深刻、充滿情緒以及血腥的電影，令人感覺像是最初的《\n奪魂鋸》風格。此外，查理克勞瑟的配樂實在是太讚了。」\n\n\n\nThe Direct\
  \ 網站影評 Russ Milheim ：\n\n「拼圖殺人魔最新的虐待遊戲刀刀見骨，帶來了一段具有衝擊感的故事，一些達到另一個\n層次的死亡陷阱，以及整個卡司帶來的驚人演技。」\n\
  \n\n\n爛番茄認證影評 Peter Gray：\n\n「開頭採用了與觀眾們所習慣的截然不同的架構，《奪魂鋸 X》對於克拉莫的陰謀帶來了\n更具有人性的一面。但也不用擔心，因為本片最終依然走向了你我所期待的血腥大屠殺，\n\
  帶來了一些令人寒毛直豎且痛到爆的機關與陷阱。見血的樂趣！」\n\n\n\nNick’s Flicks Fix：\n\n「《奪魂鋸 X》帶來了一段曲折離奇的復仇故事，再次展現了托賓貝爾為拼圖殺人魔帶來\n\
  的精湛演技，有著更加著重在角色本身，充滿劇情的第一幕。接著帶來一些血腥場面以及\n令人感到腳趾發麻的陷阱，血腥程度絕對能讓《奪魂鋸》系列老粉絲們滿意。拼圖殺人魔\n\
  回來了！」\n\n\n\nThe Hollywood Handle：\n\n「非常噁心、充滿創意和高明的設\n計。帶回了系列首部電影的原創性。卡司演員絕對是最棒的一部份。拜託出更多！」\n\
  \n\n\ncomicbook.com 網站影評 Chris Killian：\n\n「當我今天在逛環球影城時，社群媒體評價正式解禁了，所以我能告訴你《奪魂鋸\
  \ X》相\n當可怕、難以直視，。完美地連接起了\n 1 和 2，並揭露了拼圖殺人魔前所未見的一面。《奪魂鋸》系列粉絲一定會愛死。」\n\n\n\n富比世、綜藝報、Indiewire\
  \ 影評 Simon Thompson：\n\n「。讓約翰克拉莫成為故事的核心高明\n地達成了功效，而托賓貝爾實在是太殺了。亞曼達的『回歸』也處理的十分高明，而陷阱\n\
