url: https://www.ptt.cc/bbs/movie/M.1696354622.A.E75.html
title: '[新聞] 向芭比海默學行銷？奪魂鋸X汪汪隊立大功'
content: '向《芭比海默》學行銷？《奪魂鋸X》《汪汪隊立大功：超級大電影》也在社群上合體啦

  ！


  Yahoo奇摩電影戲劇編輯部


  2023年10月3日 週二 上午9:45




  《汪汪隊立大功：超級大電影》/《奪魂鋸X》劇照


  1.兩部話題大片《奧本海默》和《Barbie芭比》在今年7月同檔期上映形成「芭比海默」

  炫風!


  2.虐殺恐怖片《奪魂鋸X》和兒童動畫電影《汪汪隊立大功：超級大電影》也同時上映，

  網友同樣發揮創意，在社群迷因上合體。


  3.兩部票房成績評價都不錯！


  【文／克里斯蒂】


  兩部話題大片《》和《》在今年7月同檔期上映，類型迥異的兩片靠

  著混搭迷因圖，在網路掀起轉貼熱潮，形成「芭比海默」炫風，另類行銷成功替兩片創造

  亮眼票房佳績。


  近期又有兩部風格大不同的電影同檔上映，分別是虐殺恐怖片《》和兒童動畫電

  影《汪汪隊立大功：超級大電影》，兩組人馬也在社群迷因上合體，組成「」（Sa

  w Patrol），比「」組合更加具有衝突感，後續是否能帶動風潮，值得觀察！





  通常片商在安排大片檔期時，都會有默契的彼此錯開時程，那為什麼《》和《汪

  汪隊立大功：超級大電影》會選在同一天上映呢？


  外媒分析，主要是兩部電影的核心觀眾群不同，《》是重口味血腥片愛好者的刺

  激首選，而《汪汪隊立大功：超級大電影》瞄準的是親子家庭觀眾，兩者片商可能都認為

  ，同時上映並不影響其票房表現，另一方面來說也可能是雙贏的局面，若是「」（

  Saw Patrol）風潮能夠成功炒作，互惠到兩部電影，又會是意外的收穫了。




  回顧先前「」炫風，讓《》與《》在票房表現都遠超出業界

  預期，《》更是一路衝高到目前已在全球吸金14.3億美金，超車《

  》的13.5億美金票房，成為2023年至今全球票房最高的電影，全球影史票房也

  來到第14名。


  《》同樣表現絕佳，以片長3小時又是限制級電影來說，目前已在全球吸金9.3億

  美金，是出乎意料的好成績，更超越導演諾蘭過去執導夯片《》的8.7億美元票

  房。


