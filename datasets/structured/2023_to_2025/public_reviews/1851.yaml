title: '[情報] 米高梅將重拍經典歌舞劇《屋頂上的提琴手》'
content: '根據 Deadline 的獨家報導，米高梅將重新翻拍旗下經典歌舞電影《屋頂上的提琴手》，

  並且幕後人員都已到位！


  《屋頂上的提琴手》最初是在 1964 年推出的百老匯音樂劇，在當年即相當轟動，包括橫

  掃了東尼獎包括最佳音樂劇等九項大獎（入圍十項），至今也已經重演了無數次。而《屋

  頂上的提琴手》也很快的在 1971 年被搬上了大銀幕，由《惡夜追緝令》和《發暈》的金

  獎導演 Norman Jewison 掌鏡，並找來 1967 年倫敦西區原創版的男主角 Chaim Topol 演

  出。




  由聯美推出的《屋頂上的提琴手》電影果然大獲成功，以 4770 萬美元的超高票房榮登當

  年美國年度票房亞軍，更勝 007 電影《金鋼鑽》。此外在奧斯卡上也獲得包括最佳影片等

  八項大獎提名，最終抱回三座小金人。


  「遺世獨立的烏克蘭小農村，人人都是屋頂上的提琴手，在飄泊動盪的時代下，憑藉著猶太

  傳統與宗教信仰，吹奏出隨遇而安的即興樂章。


  貧窮酪農泰維的女兒們偏偏不按牌理出牌，父母之命全然拋諸腦後，自由戀愛徹底挑戰底

  線。當愛情與政治的革命號角紛紛響起，賴以為生的信念逐漸崩塌離析，壓根不懂愛情為

  何物的老爸究竟該如何是好？」（劇情簡介取自金馬）




  如今在將近 50 個年頭之後，米高梅決定重新翻拍這部電影，並且幕後的重要人員都已經

  到位！


  無疑的，導演當然會是近年的歌舞音樂劇紅牌，也就是執導電影現場版超紅音樂劇《漢彌

  爾頓》的導演 Thomas Kail，他在近年也執導了影集《佛西／薇登》並因此入圍了艾美獎

  最佳導演，他也曾以《火爆浪子：現場》獲得過艾美獎，都和歌舞電影脫不了關係。此外

  ，他也正是主演《佛西／薇登》並拿下好幾座視后大獎的女主角 Michelle Williams 現任

  丈夫。


  同樣的，編劇人選也找來了《佛西／薇登》的編劇家 Steven Levenson 執筆。除了將重新

  編寫《屋頂上的提琴手》劇本之外，他也是另外兩部名音樂劇《Tick, Tick... Boom!》和

  《Dear Evan Hansen》改編電影的編劇之一。




  新版的《屋頂上的提琴手》幕後製作團隊則將由曾以《美國心玫瑰情》獲得奧斯卡最佳影

  片的 Dan Jinks 以及參與製作過 2004 年版百老匯《屋頂上的提琴手》的 Aaron Harnick

  ，而他正是原版《屋頂上的提琴手》作詞家 Sheldon Harnick 的外甥。


  目前演員人選都尚未定案，拍攝與上映檔期也未定。







  --'
