title: '[  雷] 屋頂上的提琴手'
content: '防雷







































  好久沒看這種三小時的高門檻電影

  但看了發現三小時過的真快,而且意猶未盡

  這就是節奏抓得好的一大特徵！

  而且風格跟我想像中差了不少

  原本以為是黑暗沈重,沒想到輕鬆寫意佔了大多數

  雖然還是有比較難過的歷史橋段

  但讓人發笑的段落還真的蠻多的

  做夢讓大女兒改嫁真的超好笑,只是屠夫真的很倒霉


  還有父親的內心小劇場也超可愛（他也太好說話

  只是看著看著真的能強烈感受到他對女兒們的愛

  那是一種鐵漢柔情的愛,不然他就不會破例兩次

  只是第三次對他來說真的太顛覆三觀

  所以我覺得他已經盡力在接受新潮,但真的太前衛了

  他已經算是相當開明的人了

  但這也是多虧有二女婿吧

  最後他對三女兒的低調祝福讓人淚目

  這種大老粗又充滿愛的人怎麼會不討人喜歡呢？


  這部電影還有一個厲害的地方在於

  他很多表現手法都是很舞台劇的形式

  （他本身就是舞台劇改編的

  通常會有機會感到尷尬,幸好大家功力都很不錯

  一開始大量強調傳統就能知道他們的生活方式

  所以更加顯示父親有多不容易

  提琴手其實出現非常少的時間

  會用他當片名大概就是把他當旁觀者吧

  ----

  Sent from  on my iPhone 14 Pro Max


  --

  萊斯特在最後敘述中講述了生活中有意義的經驗，他說，儘管他死了，他還是很高興，因

  為這世界上有這麼多的美


  --'
