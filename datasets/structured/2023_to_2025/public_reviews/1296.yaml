title: '[影評] 戴珍珠耳環的少女--畫家、女人與珍珠耳 …'
content: '作者: smallgood (戴魚面具的女孩) 看板: Artfilm

  標題: [影評] 戴珍珠耳環的少女--畫家、女人與珍珠耳環的代價

  時間: Tue Jun 13 00:03:56 2006


  本文節錄自放映週報



  文 / 陳蔚爾


  畫家、女人與珍珠耳環的代價



  電影結束後，和朋友走出電影院，週遭雨下得滿地光華，頹老卻光鮮的西門町人潮來去。

  《戴珍珠耳環的少女》陰鬱壓抑、天寒地凍的氛圍還留在鼻息久久不散。


  每次難得在電影院得見成功重塑消逝年代，打造超現實時空的電影後，總會需要花一些像

  這樣逗留的時間，把被吸進電影裡的靈魂清醒過來，像是一種儀式。



  《戴珍珠耳環的少女》就有這樣的魔力。



  同為名畫軼事小說改編電影的《戴珍珠耳環的少女》和《達文西密碼》相較之，本片明確

  顯現在導演及編劇手法上的高超過人，雖不至於可以號稱「動搖人類根本」，但若想得到

  窺看名畫背後秘密的快感，完美結合畫家身世與時代背景，成功虛構出以假亂真過往時空

  的《戴珍珠耳環的少女》確實比財大氣粗，故事卻說得平淡困窘的《達文西密碼》更值得

  品味其細膩風味


  片中每個鏡頭都宛如一幅幅博物館藏，隨時都可以停格解讀，長方影格中，藏著秘密的房

  間門框、透著歷史灰塵光暈的窗框、畫家逐筆描繪的畫框與框中之畫、畫裡之框…情慾就

  在一個又一個的框中曖昧流動，像輕附在耳邊的悄悄話，什麼都聽不清楚，但是騷動耳刮

  絨毛的氣息卻千真萬確。


  即使你如片中主角葛里葉那般秉住呼吸做好準備，準備為藝術犧牲、準備完成夢想、或甚

  至說是為愛情付出代價都好。以創作為名的暴力就那麼化身為珍珠耳環，直狠狠地打上耳

  肉，還是教你痛。


  電影中暗潮洶湧的女人戰爭具有令人毛骨悚然的銷魂魅力，畫家岳母、妻子、女兒、女僕

  …社會階級已然只是表面，因為關於年齡、美貌、情感等因素，於是勝負高低重新定義。

  而做出最後判決的，卻是慾望。


  正因人性太過複雜難明，慾望的歸屬沒人敢說出口，轉而畸型地變為女兒藏在枕下的梳子

  、岳母藏在布包中的珍珠耳環、隱在遮布下的畫中少女，秘密迂迴在大宅中每個人的心裡

  ，富有商人對少女的肉慾只是最簡明的導火線，為了完成美好的畫作這件事成了所有人達

  成己慾的最佳藉口，直到崩潰的畫家妻子指著宛如兩人愛之結晶的畫作一語道盡醜陋；看

  似擁有藝術與愛情這完美保護傘的畫家，其實也只是個逃避現實的孬種，他沒有完成劇中

  任何人的期待，也沒有拯救可人的少女達到觀眾期待，而選擇將一切藏在斑斕顏料中。


  然後你不會在乎觀影時你看不到是誰藏了梳子，畫家又是怎麼和女僕葛莉葉合作完成畫作

  ，因為這就是電影最引人遐思玩味的地方，你可以猜，但沒有人可以肯定；對應了原著小

  說虛構脫胎自維梅爾「戴珍珠耳環的少女」畫作的玄妙氛圍，不也正是一種猜嗎？


  最終沒有人能夠純潔美好，也沒有誰有了定論。


  只有觀眾能夠跟隨著女主角的身影投射情感，看著女僕葛里葉的渺小夢想與愛慾得以透過

  成為畫中少女，找到出口；最後看見層層疊抹的顏料光影發出幽微的永恆光澤。


  作者簡歷：


  陳蔚爾，2005年末前的原名叫做陳曉玲。


  2003年畢業於世新電影系的新生代導演。


  同年以劇情短片《愛情長片》入圍韓國、捷克、南斯拉夫、北京、上海等國際影展競賽，

  並獲第26屆金穗獎優等錄影帶、南方影展劇情片首獎及純16獨立影展放映，該片和公視紀

  錄觀點《Uniform》連續入選2004、2005兩屆德國柏林影展Berlinale Talent Campus(電影

  新力論壇)。新作《飛往昨天的CI006》將於2006年七月於台北電影節全球華人影像精選單

  元首映。


  該片獲新聞局93年度短片輔導金最高金額百萬補助。


  文字及影像作品涵蓋劇本、散文、劇情片、MV以及實驗、紀錄片。



  --

