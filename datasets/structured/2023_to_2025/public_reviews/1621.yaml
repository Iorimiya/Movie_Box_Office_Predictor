url: https://www.ptt.cc/bbs/movie/M.1557828315.A.07C.html
title: 'Re: [超負雷] 復仇者才是徹頭徹尾的大爛人'
content: '其實我個人覺得薩諾斯在復3是個相當可憐的角色


  犧牲了最心愛的女兒  其實彈指之後他一點也不快樂


  你看他拿寶石都是自己一人  沒有什麼人跟他一起追求"他想要的成功"


  雖然很強  但是非常孤獨的


  到復4開頭  還被英雄圍幹死去


  到復4前半段的劇情  我個人都還是蠻同情他的


  其實到這邊的薩諾斯  我都還覺得是個有深度的反派


  他有他很深的個人情感在裡面



  不過一旦時光回到2014  這些因素似乎也都不成立了


  他就是一個很容易理解的反派  有大軍跟復仇者開幹


  到這邊就沒有什麼好同情他的了  我只覺得把他幹掉很符合常理


  沒什麼好寫的  大致這樣


  有人會跟我一樣同情復3的薩諾斯嗎 ??


  --'
