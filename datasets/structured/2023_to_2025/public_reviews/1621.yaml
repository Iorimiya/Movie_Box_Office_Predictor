url: https://www.ptt.cc/bbs/movie/M.1686237474.A.F27.html
title: '[好雷] 我就爛，也可以燦爛：《爛人》'
content: "本文涉及劇情，且具個人觀點，推薦觀影後再讀。\n\n\n　　　　本片已上映第二週，有意者請把握本週時間。\n\n\n　　　　圖文網頁版：\n\n\
  　　　　\n\n\n　　　　預告片：\n\n　　　　\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n我就爛，也可以燦爛：《爛人》\n\n\n\n　　法國電影《爛人》（The Worst Ones）為雙導演莉澤．阿科卡和羅曼．\n\n古雷特用偽紀錄片的方式，試圖消弭「拍攝虛構」與「展演現實」的界線，\n\
  \n讓觀眾分辨劇情內外虛實與如何互相影響。故事敘述巴黎電影劇組來到法國\n\n北部濱海小城畢卡索區籌備新戲《向北風撒尿》（意指做任何事都不成功），\n\n第一次拍長片的導演尋找能「自我投射」進角色的演員，在當地進行素人海\n\
  \n選，最後選了四個孩子：無照駕駛肇事逃逸，剛從感化院裡出來的傑西；弟\n\n弟癌逝、與男生出去卻被同儕蕩婦羞辱的莉莉；家境不好，討厭被凝視，總\n\n是安靜旁觀的梅莉絲；容易動怒、有過動症、不想拍電影卻被姊姊叫來的懷\n\
  \n恩。「演員」必須用身體創作出「角色」，導演則或設計演員過去的經歷，\n\n或分享自己的故事讓演員能挖出情感投入情境，電影則讓我們觀眾看見素人\n\n演員在劇情與生活間穿梭，藉由表演成為角色的同時，抽離／帶進自己的人\n\
  \n生去碰觸情感的深處，進而找到抒發的出口──或將那壓抑得更深、更不可\n\n見。\n\n\n\n　　雖說選了畢卡索區這個貧民窟，但無論是揭示貧窮境況抑或是消費苦難\n\
  \n以成就創作，劇組都拒絕承認有「拍電影」以外的意圖，即使是看似該主導\n\n整部電影走向的導演，被指出特別選擇最有問題的孩子也不置可否，卻不免\n\n被演員影響，同時也影響了工作人員，讓我想到伊朗電影《片場風暴》裡，\n\
  \n主角原本是打工的臨演，意外得到「希特勒」這個角色，劇裡虛構的威勢，\n\n反襯他在現實的無力；角色的重要性與權力帶給他未來與希望的同時，轉眼\n\n亦讓他落入無可翻身的絕境，無法消解的恨意使他從裡到外成了角色。《爛\n\
  \n人》劇組的工作人員與素人演員之間，自有一條隱形的、階級的界線，就連\n\n被選中拍片的孩子，也和沒被選中的孩子之間產生了區隔，尤其這四位演員\n\n都未成年，出身和過去都有難向外人道之處，知道自己被周遭視為「爛人」\n\
  \n（the worst ones），投入拍攝帶給他們一點改變的希望──這種最接近角\n\n色的體驗與情境正是導演想要的，所以他沒有試圖維持和諧，甚至可以說是\n\
  \n利用、剝削這些孩子的過去、情緒與傷口來成就這部電影。而對這些素人演\n\n員來說，拍片是「現在」對「過去」的探掘、「已知」對「未知」經驗的挑\n\n戰，倘若挑戰失敗，劇組同時也得承受遭到破壞的風險。\n\
  \n\n\n　　被選中的四位演員分別代表了四種成果：傑西習慣用吹牛和貶低他人的\n\n厭女話語搶先保護自己，自稱性經驗豐富，當他聽聞導演分享初戀與第一次\n\n\
  性經驗在２２歲時，還發出「怎麼這麼晚」的呼聲，習慣性以男性間的比較\n\n吹噓搶得「勝」機；但與莉莉對戲的過程可以看到他對感情既不熟悉，對性\n\n亦無經驗，顯而易見的生澀被向來言語謹慎的導演直言「你好像沒碰過女生」\n\
  \n傷害。由於沒有足以輾壓的實力，傑西抹黑指責其中一位攝影是同性戀「一\n\n直看他的屁股」，這招成功的護衛、也強化了他的無知。然而，他與莉莉之\n\n間原本陌生甚至不合，在導演的帶領下，都摸索出初戀單純的投入與珍惜\n\
  \n（可以看出他原就對莉莉有好感，蕩婦羞辱是他唯一懂得吸引她注意又不墮\n\n男子氣概的方式），這段感情戲裡目光神情的變化相當細膩精采，卻對這兩\n\n人造成不同的影響：傑西害怕感情帶來的脆弱，一旦被觸痛就用更硬的殼、\n\
  \n更尖的刺自我保護，使他只能活在男性的同溫層；原本哀悼失親之痛、無意\n\n戀愛的莉莉卻因此重新找回了喜歡一個人的心動感，還與製片朱蒂絲成為可\n\n以分享祕密、互相關心的朋友。雖然最後對收音師維多告白不成，但她坦承\n\
  \n的態度與純粹的情感不僅洗滌了被生活貶低的塵埃，也在戲劇裡解放自我，\n\n以適切的表演綻放屬於自己的光芒。\n\n\n\n　　也有演員在戲裡無法找到自己。例如梅莉絲一開始儘管「不喜歡被盯著\n\
  \n看，擔心會被嘲笑」，也指出導演「好像只挑最糟糕的孩子」，但仍願意面\n\n試參與。敏感聰慧的她，接送過程裡偷偷欽羨著片場裡女性的成熟打扮，然\n\n而每一次旁觀或站出來阻止旁人嘲弄莉莉時，長久下來無法承受生活因為拍\n\
  \n片而隱微持續卻被視而不見的霸凌，這份自卑與無力，以及自覺角色的可有\n\n可無，使她決定提前退出。同樣原本毫無興趣、被姊姊叫來面試的懷恩，由\n\n於母親的身心症狀加諸給他的傷害與壓力，使他一開始就宣稱「沒有什麼能\n\
  \n讓我哭」；原本被輔導員要求「可以生氣，但要克制自己的怒氣」，使他的\n\n情感表現無法到位，明明被霸凌卻笑得難以自抑；在導演一再鼓勵「該生氣\n\n的時候生氣，該哭的時候哭」與姊姊的耐心陪伴下，懷恩雖仍屢次用「我不\n\
  \n哭的」抗拒，卻也慢慢得到釋放、找到面對自身情緒的方式。最後一場和劇\n\n裡姊姊莉莉的交談，台詞同時抒發了兩位演員現實裡說不出口的心聲，在別\n\n人的故事流自己的淚水──「你看，我會哭了，我辦到了」──演戲的「瘋」\n\
  \n或許就是用自己活出角色，也在角色裡活出自己，懷恩打破的更是封閉情感\n\n的牆，與莉莉的演出與真情流露更一起銷融了真實與虛構的界線，堪稱精采。\n\n\n\n\
  　　但我最喜歡的片段是鴿子的群飛，就像這群演員、拍攝的工作人員，觀\n\n影的我們，儘管同是被利益或欲望操縱著飛行的方向，各自背負著種種禁錮\n\n與困難，懷抱著「向北風撒尿」的無力自貶，種種情緒埋藏於心，即使痛苦\n\
  \n也只能像懷恩「在我身體裡面一直在顫抖」，對自由的嚮往與釋放情感的渴\n\n望卻無分真偽，在共鳴觸發的同時打破虛構與現實的疆界，向「真實」展翼\n\n群翔──這正是電影、乃至藝術創作存在的燦爛之處與價值。\n\
  \n\n－－\n\n　　第二週場次表：\n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\
  \n                                  陳斐雯  貓蚤札（其三）\n\n--"
