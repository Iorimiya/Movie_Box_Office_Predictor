url: https://www.ptt.cc/bbs/movie/M.1430920055.A.AD4.html
title: '[新聞] 索尼影業新高層 飆班史提勒「爛人」'
content: '索尼影業高層艾美帕斯卡因一連串私人電子郵件被駭客發布，信中對一堆名導明星有意見

  ，不得不離開目前的職務，想不到接手的湯姆羅斯曼，最近也被揭露曾在電子郵件中指自

  導自演「白日夢冒險王」的班史提勒是個非常糟糕的人。


  湯姆羅斯曼曾參與「白日夢冒險王」的籌製，之後隨職務轉換，改投索尼影業旗下，但在

  該片上映時，艾美帕斯卡仍是索尼影業巨頭，親自在私人電子郵件中向他道喜，認為片子

  成績不俗，不料湯姆在回信中寫道：「班史提勒確實很有才華，雖然他根本是個糟糕的爛

  人。」還批評片子的宣傳大概是史上最差，完全沒有抓對賣點，同時拍片成本也過高。


  結果成本9000萬美元的「白日夢冒險王」，美國票房不到6000萬美元，美國以外世界各地

  賣座總和將近1億3000萬美元，符合湯姆預期的不理想、但不算虧太多，只是在私人電子

