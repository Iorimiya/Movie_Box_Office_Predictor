title: '[討論] 如果你喜歡的角色在現實世界是個爛人'
content: '會影響你們對他作品裡演出的觀感嗎？

  像現在HBO演的水行俠，女主角安柏，

  之前上電影院看首映，還滿喜歡她的，因為真的很正，

  後來新聞爆出她才是家暴強尼戴普的那一方，行為惡劣超級噁心，十足的爛人，

  現在重看第四台演的水行俠，怎樣看就是不順眼，只覺得她超假掰，

  不知道其他人會不會也是這樣？

  還是你們可以理性的現實歸現實，電影歸電影？



  --'
