title: '[世紀大爛雷] 攻敵必救 不要把爛人給我神化！！'
content: '前幾天聽說這部很厲害！！！於是跟朋友一起去看！！！


  去MTV看！！！！


  看完之後很失望！！！！


  爛片！！！！！　　很難看！！！！！　　沒看過的人不要去看了！！！！



  以下有雷　慎入！！！！！！！




  ＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝分隔線＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝


  首先　一開始　


  就是在吵什麼槍枝法案！！！　我看了很生氣！！！！！


  怎麼可以汙名化槍枝！！！！！！！！！！！！！！！！


  這樣太誇張了吧！！！！！！！！！！！！！！！！！！！！！！！



  槍枝是很神聖的！！！！！！！！！！！！　　


  這部爛電影卻從頭到尾　有意無意的抹黑槍枝！！！！！！！！！！！！！　



  美國人可以持槍　　是為了保衛家園！！！


  槍枝打下了美國現在超過九百萬平方公里的廣大土地！！！


  槍枝打下了美國輝煌的兩百年歷史！！！！


  槍枝讓美國人從印地安人手中搶來巨大的土地！！！！


  槍枝讓美國打退了墨西哥　還有一群不長眼的人　


  幫助美國打下盛世基業！！！！


  槍枝保衛了美國人的家園！！！象徵美國的偉大精神！！！！


  槍枝對美國人來說　象徵偉大　象徵神聖　象徵國家！！！！！！！！！！！！！！！





  但是電影一開始　　偏偏有一群不長眼的人　　


  因為幾起校園槍擊案　　就打算要管制槍枝　打算消滅槍枝！！！！！！


  這會不會太誇張了啊！！！！！！！！！！！！！！！！


  會殺人的　不是槍！！！！！！！！！！


  槍不會殺人！！！！！！！！！！！


  會殺人的　　是人　　只有人才會殺人！！！！！！！！！！！！！！！！！


  如果因為槍枝殺人　　就要減少槍枝　就有管制槍枝


  那以後乾脆禁止賣水果刀！！！！


  以後禁止賣西瓜刀！！！！　禁止賣會割傷人的刀！！！！！！！！！！！！！！！



  鄭捷手中無槍！！！！！！！！！！！！！！！！！！！！！


  但他拿刀殺了多少人？？？？？？？？？？？？？？？？？？？？？？？？



  這部電影　一開頭　就在用各種理由去汙名化挺槍派！！！！


  去美化反槍派！！！！！！！！！！！！！！！！！！！！！！！！！


  我看了很生氣！！！！！！！！！！！！！！




  然後


  女主角


  自己也是一個爛人！！！！！！！！！！！！！！！！！！！


  她根本是個大魔王　　噁心的爛人！！！！！！！！！！！！！！！！！！！！！！



  她總是苛刻下屬！！！！！


  半夜打電話吵人睡覺！！！！用惡毒言語批評下屬！！！！


  用激烈言詞刺傷對手！！！！連自己人也不好好對待！！！！！


  她還利用下屬對自己的忠心！！！！！！！！！！！！！！！！！


  在公開場合接人瘡疤！！！！！！！！！！！！！！！！


  在公開場合指出她的屬下就是當年槍擊案的生還者！！！！！！！！！！！！！！！！


  害她的屬下差點被壞人槍殺！！！！！！！！！！！！！！！！！！！！！！！！！！！



  都是她害的！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！！


  她就是一個爛人！！！！爛到犧牲自己屬下的死活也沒關係的爛人！！！！！！！！！



  然後


  她還嫖妓！！！！！！！！！！！找妓男打炮！！！！！！！！


  好噁心！！！！！！！！！


  還竊聽！！！！！！！去竊聽自己人！！！！！！！！！！！！


  去竊聽對手！！！！！！！！！！！！！！！！！！


  去違法竊聽！！！！！！！！！！！！！！！！！！！！！！


  她自己就是一個犯罪者！！！！！！！！！！！！！！！！！！！！！！！！！！！！！



  無故竊聽　是罪犯！！！！！！！！！！！！！！！！！！！


  侵犯人的自由！！！！！！！！！！！！！！！！！！


  爛人！！！！！！！！爛人！！！！！！！！！！！！爛人！！！！！！！！！！！！！



  然後


  連自己人都不相信！！！！！！！！！！！！！！！！


  去竊聽自己人！！！！！！！！！！


  去跟拍自己人！！！！！！！！！！！！！



  這種人怎麼可以這麼爛！！！！！！！！！！！！！！！！！！


  我看了很生氣！！！！！！！！！！！！！！！！！！



  然後


  劇情爆炸爛！！！！！！！！！！！！！！！



  一個助理　原本挺她　　忽然倒戈投入敵人懷抱


  忽然最後又說自己是臥底


  什麼爛劇情！！！！！！！



  然後


  一個參議員　莫名其妙被威脅


  就屈服了


  什麼爛劇情！！！！！



  合理嗎？？？合邏輯嗎？？？？？？？？？？？？？？



  最後


  女主角


  斯隆


  就是一個爛人！！！！！！！！！！！！！！！！！！！！！



  只會欺負自己屬下


  只會違法犯法


  她給我嫖妓！！！還給我竊聽！！！還私自招待國會議員！！！


  全部違法！！！犯法！！！


  為什麼這樣的一個爛人沒被槍斃？？？？


  還讓她打贏戰爭？？？


  把一個爛人神話


  這樣是好事嗎？？？？？？？？？？？？？？？？？


  怎麼教育我們的下一代？？？？



  我看完之後很憤怒！！！！！！！！！！！！






  (筆者為資深電影評論家 是電影研究權威)



  --


  我從事電影評論家超過十年了


  很多版友是看我的電影雜誌專欄長大的'
