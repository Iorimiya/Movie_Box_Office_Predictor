title: '[無雷] 爛人The Worst Ones'
content: '爛人


  這部片是法國雙女導演首支劇情長片

  先說

  我沒看到什麼劇情

  我只看到很多片段

  很多搖晃跟很近很近的鏡頭拍攝

  三條故事線（應該是三條吧？真的很難數）

  很亂

  你根本找不出故事在哪

  我對沒有配樂或搖晃鏡頭耐受度很高

  但這部片實在是超出預期

  整個劇情架構就是沒有架構

  你不知道他到底想幹嘛

  連當下在幹嘛都不知道

  常常突然有很大聲的音樂（不是配樂是劇情中的派對背景音）

  然後突兀的切換

  下個場景又不順暢

  這種效果看多次卻沒搭配情轉移

  看了讓人煩躁

  孩童演員的大臉近鏡頭

  說寫實風個也不寫實

  有情緒也不多描述

  有點芽冒出來就切掉

  以上為無雷負評





  防雷






  防雷






  男主角應該是易怒小男孩

  但比男主角更容易失控的是導演

  成人的那種社會化掩蓋不住的肉皮面具下的情緒控管失敗樣貌

  演得真不錯，演得太好了看了好噁心

  是不是搞藝術的都很孤注一躑

  小男孩的故事線沒有很明朗

  最後的鴿子場面也沒有什麼較深的寓意能去解讀

  就好像是在模仿什麼

  然後等觀影者用自己的天才去解讀藍色窗簾

  真的沒什麼好解讀的

  我看這劇本根本沒寫好

  或是分鏡或是劇本在拆解每一場戲的比例及順序時

  出什麼差錯了

  突然退出劇團的女孩子滿壓抑的

  但是也只給了一點點她視角呈現的愛慕女助理的肌膚跟身體等幾秒鐘的畫面

  然後就沒有了

  退出後也就沒有了

  這能算一條故事線嗎

  女主角是那個弟弟抗癌死亡的女孩

  很淘氣地對成熟男收音師動情

  然後被拒絕

  哭一下這樣

  我不懂的是男收音師崩潰的那部分

  下一幕就好像正常

  可以跟男孩互動

  成年人情緒轉換那麼快

  正常嗎

  看了我都要錯亂

  都快覺得搞藝術的都怪怪的了

  無俚頭程度跟特殊小孩有得比

  那個青少年男是最正常的

  害羞吹牛跟白目

  可預料也可理解

  處男裝百人斬（誇飾）

  無法自處也無法化解尷尬時就攻擊別人

  特別是攻擊特殊性向的人

  先指責以自我防衛

  女助理的存在也不是多成熟的表徵

  她跟少男少女的互動可以全部剪掉不影響

  整部片的成人都沒有政治正確的發言

  後面跟社區民眾的閒談

  也很沒有重點

  是翻譯的問題還是什麼

  寫長一點的文章要起承轉合

  拍長一點的劇情片也是需要的

  敘事就是有這些節奏上的需求

  打破框架不能用在這邊吧

  看到很無奈的時候鏡頭又晃來晃去的

  更是起笑

  如果剪接是好的

  應該會改善很多

  我大膽如此猜測


  以上言論只代表我個人

  期待看到別人的觀影感想





  -----

  Sent from JPTT on my iPhone


  --'
