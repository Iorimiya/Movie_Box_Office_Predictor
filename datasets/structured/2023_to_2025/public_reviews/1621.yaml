title: '[情報] 《爛人》男女主將合作恐怖新片《Handling The Undead》'
content: '根據 ScreenDaily 的報導指出，《世界上最爛的人》男女主角 Renate Reinsve 和 Ander

  s Danielsen Lie 再度合作新片《Handling The Undead》。




  《Handling The Undead》為挪威女導演 Thea Hvistendahl 執導的首部長片，改編自《血

  色童話》瑞典男作家 John Ajvide Lindqvist 筆下的同名小說，他也曾寫出《邊境奇譚》

  和《血色入侵》等名片的劇本。這回他將會親自與導演共同編寫電影劇本。


  故事描寫在炎熱的夏日，一個奇怪的電場圍繞著奧斯陸，導致居民陷入集體的頭痛與騷亂

  之中。這部電影將以角色驅動作為主軸，探討人們的傷痛與失去，在混亂之中捕捉三個家

  庭所發生的故事。


  Renate Reinsve 和 Anders Danielsen Lie 將在《八月三十一日，我在奧斯陸》及《世界

  上最爛的人》後第三度合作。




  去年將《世界上最爛的人》推進奧斯卡多項獎的美國發行公司 Neon 已經取得了該片的美

  國發行權。



  --'
