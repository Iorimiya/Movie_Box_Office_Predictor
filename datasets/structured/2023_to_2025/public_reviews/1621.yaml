title: '[情報] 《世界爛人》導演正在籌備第六部長片！2024 開拍'
content: '根據 Screen 的報導指出，以《世界上最爛的人》獲得奧斯卡提名的挪威男導演

  Joachim Trier 正在籌備他的第六部新片。




  曾以《八月三十一日，我在奧斯陸》展開知名度，必以《世界上最爛的人》創下事業高峰

  的 Joachim Trier 在 2021 年以這部電影一路從坎城影展殺到奧斯卡中，也為他的「奧

  斯陸三部曲」畫下句點，如今他也將開始籌備他的第六部電影了。


  Joachim Trier 將再度攜手他長期合作的編劇夥伴，也就是前年同樣以《詭孩》驚艷影

  壇 Eskil Vogt。這部新片尚未命名，目前在劇情上也只有梗概。這部片被形容為一部雄

  心壯志又有趣，並以奧斯陸為背景的家庭劇。一部親密、好笑、的電影，關於家庭、記憶

  ，以及我們如何需要重寫我們所說的故事以求生存。




  該片的幕後製作團隊包括《世界上最爛的人》製片 Andrea Berentsen Ottmar 及 《詭孩

  》製片 Maria Ekerhovd。而目前尚未有國際銷售公司取得權利。挪威電影學院資助了這

  必電影總預算 780 萬美元中的 190 萬美元，創下了該機構的資助新高。


  電影預計 2024 年才會開拍，也尚未有演員確定加入。



  --'
