title: '[情報]  別叫我”賭神” 預告片'
content: '周潤發、袁詠儀 首次合作

  由「無雙」班底打造


  《別叫我「賭神」》預告片



  【內容簡介】


  《別叫我「賭神」》是由莊文強編劇，潘耀明執導，周潤發、袁詠儀領銜主演，方中信、廖啟智、安志杰、白只參演的電影 。


  賭場風雲重現，難道是賭神再出江湖？然而發哥一句「開牌見我」後鬥轉直下，昔日賭神被「四個六」就能秒殺。戰無不勝三十載，從此世間無「賭神」





  -----

  沒想到周潤發跟袁詠儀還是第一次合作啊？

  不過這部預告 看起來不太吸引人就是了XD


  --'
