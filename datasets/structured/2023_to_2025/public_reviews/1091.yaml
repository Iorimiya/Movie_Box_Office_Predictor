url: https://www.ptt.cc/bbs/movie/M.1711297463.A.79C.html
title: '[新聞] 魔鬼剋星：冰天凍地 遭負評轟炸！女主角'
content: '《魔鬼剋星：冰天凍地》遭負評轟炸！女主角回應：別這麼嚴肅好嗎，你不想看當然不喜

  歡




  （圖片來源：索尼影業）


  《》第四集《》（Ghostbusters：Frozen Empire）最近已

  在台美同步上映，但別於上一集《》（Ghostbusters：Afterlife）收

  穫好評居多，《》目前得到的迴響反倒負評居多，不滿的人多半批評角色太多太

  壅擠、故事線太雜亂、懷舊致敬太氾濫。


  一連主演《》《》兩集的「」（Mckenna

  Grace）日前受訪時，便被問到她會如何看待外界的批評，而她也為電影做出了辯護。


  葛瑞絲說道：


  「每個人看完電影都會有不同想法，我很常讀 letterboxd 上的各種評語，而總有人會寫

  說：『別再拍《》了，讓這系列下葬吧。』真的會有人說這種話。我覺得如果你

  是抱持這態度進場觀賞的話，那你從一開始根本就不想給你自己一個喜歡這部電影的機會

  。若你真心想看，然後享受一段歡樂的時光，那就去看，。」


  葛瑞絲繼續表示：「別太認真看待，別那麼嚴肅嘛，這可是《》欸，驅鬼這件事

  是世上最狂想的點子了，既古怪又好玩，我們沒人把這當成嚴肅的事情在看待。」


  葛瑞絲接著不忘推薦，無論是粉絲或非粉絲，她都覺得《》會讓每個觀影族群滿

  意。


  文：Joker


