url: https://www.ptt.cc/bbs/movie/M.1711085405.A.430.html
title: '[普雷] 魔鬼剋星：冰天凍地'
content: '整部片劇情延續上一集，不知道這次的錢是不是都花在請元老回來還有要延續新一代演員鋪

  成的關係，這次的動作場面非常少，連最後的大戰場面居然都只是在魔鬼剋星的總部大廳對

  決，對照前幾集下來真的有點慘。雖然這次還是一樣要老套的探討親子之間、青少年自我成

  長或是家庭凝聚之類的老套劇情，但是過於平鋪直敘又不夠深入，甚至連要推動劇情的危機

  感都延伸為世界等級的卻一點壓迫感都沒有，還必須要靠舊版的角色來不斷的穿插才稍微有

  些劇情趣味，也難怪影評會說大部分都在賣老梗，如果有去看的話或是這系列的老粉應該都

  能體會。然後到最後新舊角色的部分在集結上根本完全就像當初看《侏羅紀世界：統霸天下

  》一樣感覺都是各演各的，真的沒啥火花，總結來說這次也不至於到難看或是爛，只是就真

  的沒那麼精彩而已。不過比較好奇的是既然上一集都把雪歌妮薇佛請回來了為什麼這次她卻

  沒回歸？還有謝爾頓的阿嬤的戲份還真的是比想想中的少。



  --'
