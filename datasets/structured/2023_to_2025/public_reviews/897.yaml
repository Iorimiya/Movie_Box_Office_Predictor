title: '[問號雷] 恐怖100 劇情0分的"嘎啦"'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  其實也沒什麼好防雷的因為根本沒有劇情可言


  電影恐怖感營造得很好


  各種恐怖跡象還有探險橋段會讓人看得很緊繃


  但劇情完全是個問號


  埋梗沒解就算了連基本劇情都沒交代完整


  突然跑出來的師仔講話都語焉不詳也沒解釋到


  電影就在觀眾滿頭問號下結束


  就是一部只有起承沒有轉合的半成品電影


  可惜了化妝及氣氛營造


  如果單純想體驗恐怖感可以去看


  但不要期待你對劇情的疑問會在片中有解答


  演員演技我覺得可以


  天仁逐漸母湯的驚嚇表情很棒


  --'
