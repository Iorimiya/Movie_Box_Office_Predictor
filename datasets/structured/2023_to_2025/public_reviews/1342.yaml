url: https://www.ptt.cc/bbs/movie/M.1568915636.A.97F.html
title: '[新聞] 古墓奇兵女星將主演《沼澤王的女兒》'
content: '新聞網址：




  自暢銷小說《房間》後，又一部處理女性遭綁架囚禁的犯罪事件驚悚小說問世，《

  沼澤王的女兒》(The Marsh King’s Daughter)書名脫胎自最少人聽過也最暗黑的

  「安徒生(Hans Christian Andersen)的童話」，小說描寫女主角赫蓮娜(Helena

  Pelletier)表面擁有幸福家庭，事實上母親是被父親綁架的，囚禁在偏僻沼澤區的

  小屋長達12年，繁體中文版由時報出版在9/24發行，近期也將改編成電影，由《

  古墓奇兵》女星艾莉西亞薇坎德(Alicia Vikander)擔綱主演！


  《沼澤王的女兒》描寫主角赫蓮娜‧佩勒提爾擁有一個充滿愛心的丈夫、2個漂亮的

  女兒和自己的果醬生意。但她心中藏著一個秘密：她的母親在14歲時遭人綁架並囚

  禁在沼澤地一個偏僻的小屋，沒有自來水和電力，2年後赫蓮娜出生了，父親自小教

  會她各種野外求生技能，儘管偶有殘暴行為，但她仍深愛著他。


  赫蓮娜12歲前的生活只有父親和母親為伴，意外帶著母親逃了出來，不久後被媒體

  稱為「沼澤王」的父親被逮捕入獄，並被判處無期徒刑。10多年過去，隱姓埋名的

  赫蓮娜好不容易適應社會，擁有自己的家庭， 但她的父親殺了2名守衛後越獄，

  躲進沼澤區。赫蓮娜知道自己是當天害他入獄的人。所以在父親上門尋仇前，她決

  定一個人回到沼澤地，面對過去終結對父親的愛恨。


  全書以女性角度切入犯罪故事，除了讓人聯想到愛瑪‧唐納修(Emma Donoghue)的

  《房間》之外，部分書評推崇作者筆下的「犯罪現場」，以密西根州沼澤區作為

  舞台，藉一片讀者不熟悉而陌生、荒涼、封閉的環境，為了生存必須對抗各種來自

  外界和內心的邪惡恐懼，成功地營造出焦慮感與恐懼氣氛，足以媲美《龍紋身的女

  孩》的赫德比島(Hedeby)，以及塔娜‧法蘭琪(Tana French)名作《神祕森林》(

  In The Woods)裡偏僻的加拿大林區。


  事實上作者凱倫‧狄昂尼(Karen Dionne)和丈夫就在當地自己建造的小木屋，生活

  了30年。由於對地理環境瞭若指掌，書中所有原始森林的樣態、野外追蹤生存遊戲

  ，到沼澤王與赫蓮娜在沼澤地重逢時，相互追逐獵殺的緊張氛圍，都描繪得極為

  出色，仿如身歷其境。


  凱倫在受訪時曾說過，這段經歷對於創作本書時有非常大的幫助，「密西根州上半

  島是一個狂野與美麗的地方，我一直想在那裡創作一部小說。《沼澤王的女兒》是

  我給密西根州上半島的情書。」而這本書在密西根州當地也獲頒年度選書，榮登

  書店排行榜冠軍，盤踞排行榜長達一年以上。


  《沼澤王的女兒》的書名其實脫胎自安徒生的童話，書中也屢次提及。在安徒生童

  話裡，埃及的天鵝公主在沼澤邊被妖怪拉入沼澤，並生下女兒，白天是美豔但內心

  邪惡的孩子，夜間則變成醜陋而心地善良的青蛙。《沼澤王的女兒》是安徒生童話

  中篇幅最長，加上內容陰暗，讓一般讀者較為陌生。


  凱倫認為自己故事中的赫蓮娜，也是無辜和怪物的產物，一半善良一半殘暴，一半

  黑暗一半純真。正是透過赫蓮娜這樣的角色，讓讀者可以去省思，世界有絕對黑白

  二分的好人和壞人嗎？如果暴力作為手段，什麼才是正義？《沼澤王的女兒》象徵

  那些有著不光采的過去的人，作者極力呈現心理恐懼的同時，也告訴讀者唯有勇敢

  面對過去、面對恐懼，才能獲得真正的自由。


  《沼澤王的女兒》勇奪懸疑文壇四大獎之一「巴瑞獎」(Barry Award)2018年度最佳

  小說獎，暢銷小說天王李‧查德(Lee Child)讚譽為「完美的心理驚悚小說」，該書

  橫掃全球20多國暢銷書榜，盤踞美國、瑞典雙週書榜冠軍，亞馬遜網路書店一片好

  評、近五顆星滿分的超高評價，並獲得連鎖大型書店與重要媒體年度選書，繁體中

  文版由時報出版在9/24發行。


  ------------------------------------------------------------------------------


  參考外電:Variety

  Alicia Vikander to Star in Thriller ‘The Marsh King’s Daughter’



  心得︰這個新聞的業配味有點重，XD

  不過有艾莉西亞薇坎德預計拍片計畫的新聞，還是可以在此分享一下


  台灣版新聞稿報導得比較不完全的地方是，其實這個企劃連導演與編劇都找好了，

  而且影迷應該都對他們的過往代表作不會陌生，

  導演是與薇坎德同樣出生於北歐的摩頓帝敦(Morten Tyldum，模仿遊戲)，

  而編劇則是幫助李奧納多拿到奧斯卡的推手之一Mark L. Smith(神鬼獵人)，

  馬克史密斯並且將與可能是他家人的Elle Smith共寫劇本


  至於也有不少人關心的出品片場部分，

  買下這本書拍攝權的，是比較偏小資的STX Entertainment，

  所以即使電影拍成，這部片也幾乎確定台灣的代理片商不是傳統美商


  不過這個企劃案今年似乎還沒有更進一步的動作，

  可能的原因有二，一是還沒找到其他關鍵演員，

  另一個則是本來敲定要在亞特蘭大與該城隸屬的喬治亞州拍攝



  但是因為喬治亞州幾個月前簽署了更嚴格的墮胎禁令，因此遭到好萊塢的杯葛


  雖然這個計畫案影像化的工作，目前處於停擺狀態，但還是期待實際出來的結果


  對於原著有興趣的影迷，我也順便提供博客來的專頁面給各位參考



  --'
