url: https://www.ptt.cc/bbs/movie/M.1706706803.A.EEB.html
title: '[好雷] 沼澤王的女兒-為母則強，一定要看到最後'
content: "（本文有100％劇透，強烈建議不要做太多功課看也沒關係，享受未知也很美好）\n\n\n這部《沼澤王的女兒》在MOD強打4K好幾天了，坦白說第一次看我沒幾分鐘\n\
  \n就因為十分刻意的詭異感而關掉（我只有看電影介紹，但《不存在的房間》這種親情\n\n懸疑片我是很喜歡的），今天因為陪親戚孩子看才發現這其實是我這個YA板主不該\n\
  \n錯過的好片。事前完全不知道這部是神鬼獵人班底參與+ 暢銷小說改編，但可以看到\n\n強強聯手又拍出這種適合12歲以上看、最後半小時也充滿動作場景的片，是值得\n\
  \n慢慢賞味的。\n\n\nimdb \n\n預告其實沒有很建議看，太多爆點可能會影響觀影。\n\n\n「我不恨你，也不可憐你，你教過我，always要保護自己的家人。」\n\
  \n\n\n全片充斥著相當簡單直接的比喻，例如把童年的自己、女兒與已經成年的自己，\n\n各種拆穿心魔一一正面對決的爽快感掌握得很好，除了丈夫深愛著老婆什麼都順著\n\
  \n她連個夫妻謎語他似懂非懂都還是支持有點刻意、突破手銬限制有點開無雙之外，\n\n這部片的編、導、演都在水準之上，很訝異板上心得我居然是首PO。\n\n\n\n\
  現在的青少年口味變得速食，習慣短影音的他們居然也能有這種撐過前20分鐘就會\n\n相當投入的片子看，我覺得已經夠格給到七十分了。\n\n\n（一定要撐過前20分鐘才會覺得好看，前面真的只是鋪陳，此外選角選\n\
  \nBen Mendelsohn很棒，他忠厚老實的面容，真的會誤會他是正常人啊XD）\n\n\n我個人淺見，本片有《不存在的的房間》+ 《神鬼獵人》的元素，確實也有後者的班底，\n\
  \n喜歡懸疑包裝、但本質是親子片、野外求生狩獵相關題材的人，應該會追得滿開心。\n\n\n\n前20分鐘的內容為什麼讓我感到詭異？父親慈愛堅韌的外表下，莫名崇拜陽剛狩獵\n\
  \n文化、動不動就殺殺殺，喜歡用刺青懲罰和紀念事情，很享受跟女兒接觸的機會，\n\n種種小動作都讓人感到隱隱約約的不快，加上母親刻意疏遠父親、\n\n臉上彷彿被剝奪什麼的黯淡與哀愁，謎底在電影中段解開，\n\
  \n原來所謂的「爸爸」根本只是綁架生母的強暴犯而已。\n\n\n\n野外求生也不是什麼父女情的展現，就單純只是「爸爸」妄想症，不想被抓到\n\n也無法有份正當工作餬口而已，\n\
  \n但編劇把這些爆點藏得很深，\n\n觀眾如果不太把電影介紹當回事，一知半解的狀況中收看，\n\n會覺得滿刺激，至少有娛樂到我。\n\n\n中後段爸爸逃出經過新聞報導才發現真相，加上後面女兒會出戲地只帶把刀就\n\
  \n重返舊地，誤以為跟「爸爸」用「講」的能通，就不奇怪了。\n\n\n（說真的，小孩十歲前還沒有獨自思考能力，會認為保護自己的爸爸值得相信，\n\n甚至多年後不願接受溫暖正向的繼父，也是因為童年的模子真的能影響一個人很深）\n\
  \n\n唯一可惜的就是女主角不相信任何人的這個點，編得有點薄弱，\n\n不相信任何人，那為何選擇個性溫和又早熟的丈夫當伴侶，裡面的夫妻圓滿到完全\n\n沒有缺點，丈夫在被騙身世之後還十分相信老婆（一般在老婆道別時會馬上阻止的）\n\
  \n夫妻情雖不是本片的重點，但我認為有點浪費少年就開始演戲的Garrett Hedlund。\n\n\n（但顧票房是可以理解的，這對夫妻賞心悅目男帥女美啊。）\n\
  \n\n總之，若您在尋找一部寒假或年假可以陪正在訓練獨立思辨能力的青少年看的片，\n\n這部請要加到片單，我一直覺得成年後的女主角反而也有種青少年初脫離父母影響\n\
  \n的「恍然」與「大悟」，她是直到聽了「爸爸」說要回去抓女兒來再湊成一家三口\n\n的妄想，才清醒過來，原來爸爸是必須殺掉的，想要看私刑復仇情節的人也不會失望。\n\
  \n\n推薦這部暢銷小說與金獎編劇、又是2023新片的作品給各位囉。\n\n\n上映時我太忙沒注意到，否則這部片是我願意付費去電影院看的，攝影和配樂\n\n都有水準之上。\n\
  \n--\n\n幻想●---------------☆\n/﹀\n/\\ \n\n按a加入最愛\n\n--\n                        \
  \            01/31 21:42"
