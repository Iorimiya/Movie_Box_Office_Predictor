url: https://www.ptt.cc/bbs/movie/M.1475420802.A.08D.html
title: 'Re: [好雷] 使徒行者讓人摸不著頭緒'
content: '這部電影最大的亮點就是許紹雄所飾演的歡喜哥。


  相較於三大男主角，歡喜哥的戲份並不多，除了一開始登場就用計救乾女兒丁小

  嘉外，就只剩下與董百豪的那兩場對手戲了。而與董百豪的鴻門宴與復仇戲碼都

  讓人熱血沸騰、暢快淋漓，實在不得不佩服這兩段劇情安排，相當精彩！


  但因為對許紹雄以前演過的黃啟法這個角色實在是太印象深刻了，所以電影最後與

  藍博文的那段對話回憶片段差點讓我笑出來。當歡喜哥說我是個警察時，害我在心

  裡不自覺地回答他：沒錯！你（歡喜哥）以前的確是個警察，而且還幹到重案組總

  督察這個位置XD


  比起寒戰２，這部電影真的更值得一看，電影中的五個主要角色（吳鎮宇、張家輝

  、古天樂、余詩曼與許紹雄）都有不錯的發揮，有興趣的人不妨花點時間去看看，

  滿不賴的。


  --








  --'
