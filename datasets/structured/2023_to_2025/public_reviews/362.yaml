url: https://www.ptt.cc/bbs/movie/M.1702218512.A.ADE.html
title: '[凱吉雷] 《夢行者保羅》凱吉，我們夢裡相見'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  簡單聊聊《夢行者保羅》(Dream Scenario)

  .

  表面上是打著艾瑞艾斯特監製名號的恐怖喜劇電影，原本我以為這片的調性跟風格會接近

  年初的《寶可噩夢》那樣恐怖中帶著混亂與黑色幽默的風格，不過實際看完後發現這片跟

  我想像的不太一樣，我沒看過導演前作《我恨我自己》，不太好做比較，但在風格上來講

  與其說是艾瑞艾斯特，不如說更讓我想到查理考夫曼或是史派克瓊斯那樣的風格。

  .

  就是那種，用很平淡的語氣講了一個有點奇幻的都市傳奇，有種超現實的抽離感，不只是

  電影本身，整部電影對觀眾而言也是，而且是故意要讓觀眾冷眼旁觀、沒有要讓觀眾進入

  電影當中這種感覺，那是一種很冷調平靜的旁觀者敘事，例如《變腦》、《蘭花賊》、《

  王牌冤家》、《雲端情人》等片都有給我這樣的感覺，發生在電影中情緒被刻意淡化到最

  低，要說它是喜劇，內容也是更偏向荒謬而不是好笑。

  .

  所以這片可以說是蠻吃電波的(說真的，A24哪片不是？)，如果你喜歡上述的查理考夫曼

  跟史派克瓊斯那樣的電影風格，我會覺得你可以試試看這部電影，或許這片會蠻適合你的

  ，不過我也得老實承認，他們的風格一直沒有很吸引我，那個疏離感讓我難以入戲，主觀

  點的說，如果去掉凱吉，我自己可能並不會很喜歡這片，頂多覺得這片的題材蠻有趣的而

  已。

  .

  但我也說了，就只是如果而已，凱吉不管演什麼我都是照單全收的。

  .

  曾經有個偉大的文豪寫下了這段話：仿生人會夢見電子羊嗎？而這個問題跟它的答案一點

  也不重要，沒有人在乎，我們身而為人，真正該關注的問題只有這個：任何人會夢見凱吉

  哥嗎？

  .

  我是說，電影裡面那些人何其有幸，能讓凱吉親自造訪他們的夢境？哪片凱吉只是站在一

  旁冷眼旁觀─注意，這跟觀眾看這部電影時的狀態其實是很接近的─也已是三生有幸，對

  凱吉信徒而言，這不只是夢想成真(但也是做夢)，更是一種接近天啟般的宗教體驗。

  .

  而比起凱吉這幾年常見的、那股能量滿載的癲狂強者與硬漢，他在這片《夢行者保羅》選

  擇了以一種更內斂低調的演技來詮釋這個不得志的大學教授，這角色比起這幾年的凱吉一

  點都不強勢，事實上他多數的時候很懦弱、又有點壓抑，凱吉招牌的顏藝在這片得不到太

  大的發揮，想看這個的影迷可能會覺得有些可惜。

  .

  但其實如果你有不斷在關注凱吉這幾年的事業發展與他的訪談，你完全可以理解凱吉會什

  麼會想要接下這個角色，某種程度上我們可以說，這個角色簡直就是凱吉近年來的寫照：

  他無心插柳爆紅成了迷因，雖然自己並沒有這個意思，卻也希望藉由這次的聲量來達成他

  真正希望做到的事情。但就一如片中保羅那篇沒人在乎的論文，凱吉在螢幕前侃侃而談他

  準備這個角色多麼認真，引用了哪些電影與人物、運用了哪些技巧來創造這個角色，大家

  在乎的仍然是那些扭曲誇張的表演又創造了多少迷因價值。

  .

  雖然做為影迷與信徒，我當然也喜歡這樣的凱吉、也喜歡跟著玩哏，但也能理解對待每個

  角色都如此用心的凱吉不希望只被當成迷因看待，但就像片中那些只希望他代言雪碧、希

  望他譁眾取寵的戴上佛萊迪的手套，但根本沒認真聽到要出版什麼書的行銷公司一樣，真

  正認真看待凱吉的人或許並沒想像中的多，而這樣的情況我想多少是讓熱愛電影、不斷深

  耕演技的凱吉感到有點氣餒。

  .

  即便他這幾年早就還完債，開始認真接片跟多方嘗試了，但對多數人而言，他依然沒有擺

  脫欠債跟爛片王的稱號(當然他偶爾還是會演些什麼《柔道煞星》或《鬼域私法爭鋒》這

  種謎之爛片就是了)，而他每出一部新片，無論新聞稿還是預告片，雖然在網路上有著巨

  大的討論聲量，但從票房就可以看得出來，大家只是想玩哏，真正進電影院支持的還是寥

  寥無幾，比起這些電影，多數人更關注的還是這次又有什麼迷因、他還會不會再拍一集《

  國家寶藏》、《絕地任務》或是《惡靈戰警》吧。

  .

  但只要凱吉還沒放棄電影─聽說他好像想去拍電視劇了？─我們就不會放棄凱吉，電影本

  質上就是一種讓我們得以短暫脫離現實的夢幻體驗，而凱吉依然徜徉在這名為電影的龐大

  夢境當中、他依然熱此不疲，而我們同樣對他魂牽夢縈，只能盼望他能夠不斷地出現在這

  個全球影迷共同編織的夢中，然後我們得以就此永遠不要醒來。

  .

  你不能害怕做更大的夢，所以睡吧，夢裡什麼都有，當然也有凱吉。


  --'
