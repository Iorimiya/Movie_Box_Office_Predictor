url: https://www.ptt.cc/bbs/movie/M.1577395871.A.571.html
title: '[好爽雷] 星戰9 天行者的崛起'
content: "這禮拜去看了IMAX的星戰九，看完之後的想法就是「爽爆」！這才是我想要看的星戰啊！\n\n星8那個什麼鳥片(怒)！現在終於可以大膽的開始看板上的討論文章，爬完之後就有衝動\n\
  \n想跑來發表一下自己的心得，於是這篇可能被噴爆的文就誕生了。\n\n\n\n\n喔對，先說我是星7、9粉，星8黑。不喜者可←離開。\n\n\n\n\n先自我介紹一下跟星戰的淵源，我只是一個3x歲的Nobody大叔，本身也不是什麼星戰鐵粉\n\
  \n第一次遇到星戰是小時候到電影院看1、2部曲，當時只覺得光劍帥爆、絕地推拉跳高高有\n\n夠酷，劇情沒什麼在意，就順順的過去。大概到了大學以後才有去補齊3~6部曲，至於其他\n\
  \n相關的動漫、小說、電玩一概沒碰，當然7、8部曲也是有到電影院捧場，周邊產品一直到\n\n最近才碰了第一款遊戲：組織殞落。\n\n所以我就是以一個單純只看電影9部曲+R1的人的角度來跟大家分享一下看完的心得，應該\n\
  \n可以稍微代表一下只看電影的部分人的想法吧。以下就版上幾個吐槽點下去回應，有雷~\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n1.很多人在批評的敘事觀點破碎跳躍，這一點是無可否認的，但是我相信JJ已經盡力了。\n\
  \n有太多事情要在短短的2個多小時的時間講完，很多事件會在觀眾還沒進入狀況時就結束\n\n換場景，情緒還沒代入事件就已經解決，只是這是為了要收星8留下的爛攤子啊！8把7留\n\
  \n下的謎團以最爛的形式斷光，完全就是為了反轉而反轉，轉了之後還讓人覺得???而已，\n\n讓人沒有那種「哇靠竟然會是這樣！太令人震驚了！」的感覺，只有「MDFK竟然是這樣，\n\
  \n導演編劇你出來面對，我保證不打死你！」的想法。\n\n而9為了結尾只能在短時間內將要圓的東西用一連串事件盡快帶過，造成這樣的情況，如果\n\n能像復3、4一樣拆成2集的話，哪怕一集只有2小時應該也能將劇情表現得更清楚。\n\
  \n\n\n2.原力太破格：因為我只看電影，所以在第1部中對原力理解是其表現出能隔空推、拉物體\n\n加強身體運動能力(包含速度、跳躍力、承受力)、控制生物的心思、讓人懷孕；2、3部曲\n\
  \n多了原力感應、隔空摧毀物品、抬起大質量的物品、放閃電(還會電到自己)、像盾牌一樣\n\n擋住攻擊、束縛人體；4~6部可以抬起戰機等更大質量的物體、電了又電的閃電、掛掉能變\n\
  \n絕地英靈；7部再多了能夠定住能量帥爆的功用、8部多了隔空交談、英靈能引天雷劈東西\n\n、宇宙存活飛行、遠端投影耍帥。\n\n以上是我憑印象打出來的，可能不完整，不過整體來說就是原力功能眾多，能做到很多神\n\
  \n奇的事情，就像魔法一樣，將這些能力放到9部曲中，我覺得大多都很合理呀。\n\n2-1.用原力擋光劍：不就是前傳中尤達用原力擋閃電一樣的事情？\n\n2-2.治癒人體：以奇幻的魔法角度跟孕育生命、復活同樣都是生命型法術，在西斯方就是\n\
  \n皇帝誘惑安納金的復活帕米、絕地方就是化為英靈。而且芮有說到「將生命力傳過去」代\n\n表的是芮消耗了自己的生命力去幫助忍癒合，這種消耗生命的技能要不是禁術、要不就是\n\
  \n高階運用，除了技巧外沒有一定的資本量(原力量)還用不出來，必須像天行者家族、尤達\n\n、白卜庭家族有大量的原力才能使用也還算合理吧？絕地大師只是戰技及運用技巧高超，\n\
  \n但原力的量上不見得有多到使用治癒的門檻啊！\n\n2-3.摸肚子就能復活：這個原理同上，所以班才會掛掉，除了原力用盡外，他也將生命力\n\n用盡了，不然依照他爬上來的氣色感覺是不至於領便當。特地摸在肚子上說不定除了幫復\n\
  \n以外還真的如板友所猜再重新孕育一個新生命哩，這樣1命換2命還算賺啊！\n\n2-4.路克能夠輕鬆將X-WING抬起來：他可是天行者家族的人啊！由原力孕育的辣個男人親\n\
  \n兒子，原力多到爆，而且英靈狀態本身就是原力的運用，尤達都能引天雷了，他有辦法舉\n\n起X-WING很合理吧？更何況舉起來後有一個鏡頭take到路克他笑了一下但也有表現鬆了一\n\
  \n口氣的樣子，所以要說輕鬆也不見得吧。\n\n2-5.芮跟忍互相搶運輸艦：這個就只是單純原力掰手腕吧，大質量的物體舉起及推拉都有\n\n在前幾部中表現出來過，這兩位的原力量又多出普通原力使用者幾倍，能夠影響到運輸艦\n\
  \n這種更大質量的物體也很合理吧？而芮不小心電一下就是在鋪她白卜庭家族的梗啊！當下\n\n看她噴閃電時第一反應是嚇到，第二反應是「乾她怎麼會西斯的招？」\n\n\
  2-6.芮這集才訓練沒多久就變超強：主角光環BJ4...不對，第8集路克也有訓練她啊！不過\n\n導演拍得好像他們都無所事事的樣子(又是8的鍋)，再來8、9之間隔了幾年，這期間莉亞\n\
  \n難道都沒有在訓練芮嗎？你敢說我還不敢信，而且演出來的訓練情況芮也不像是因剛開始\n\n訓練的新手才手忙腳亂，反而是因為芮心中懷有疑惑未解，分心之下才訓練出錯，從她跟\n\
  \n莉亞的對話來看這情形也不是第一次發生了。不過不可否認的是主角光環在7~9部曲是真\n\n的開很大。\n\n2-7.皇帝的閃電超大：啊皇帝就是那麼強啊，人家是大魔王欸，給點超能力過分嗎？他都\n\
  \n說所有西斯在他體內，他擁有前所未有的強大原力，閃電再噴大一點不行嗎？他的閃電可\n\n以控制不傷及自己人不行嗎？\n\n2-8.芮開頭都能飛了，還爬什麼死星：首先芮是浮在空中，她在空中時能不能移動、能浮\n\
  \n多高還是問題，如果只能直上直下那不就搞笑了？浮到上面發現沒有能借力的地方就只能\n\n再降落，那倒不如直接用爬的。其次飛行或浮空一定要消耗原力的，對芮來說可能運用體\n\
  \n力+原力輔助爬死星會較為輕鬆，畢竟她在7部曲中的拾荒生活已經很習慣爬戰艦了，現在\n\n爬死星只是駕輕就熟的行為罷了，這麼一來爬死星很合理吧。\n\n\n\
  以上大概是我自己的解釋啦，腦補的地方很多，也有很多漏洞，可能也還有缺少沒講到的\n\n地方，不過就是以我只看10部電影的觀眾來解釋原力，這些看法很多其實在我觀影當下\n\
  \n如果有發現的話就已經想到了；有些則是回來看完文章吐槽點後想到的，不過都沒有花費\n\n特別的心力去想如何說明。哪天說原力能放火球我也不會驚訝，畢竟原力就是一個虛構力\n\
  \n量，力量的表現方式有很多，誰說就只能有這樣的表現形態？創意是無限的，就當是出現\n\n新招而已，因為我也沒有特別去找星戰資料來看，所以接受新東西的程度也相對較高啦。\n\
  \n看電影不就是一種觀看、各自表述嗎？當然電影有其基本設定、有導演想要表達的東西，\n\n不過最終好看與否取決於觀影人自己的感覺與解釋呀。\n\n\n3.芮的身世很突兀：觀影時白卜庭說芮是他的孫女時我也是滿頭問號，啊星8不是才說\n\
  \nNobody結果現在變成身世超威，依照身分來說芮根本就皇太孫啊！啊她之前的拾荒人生不\n\n就過辛酸的？就算為了把8的內容圓回來也太硬要了吧？雖然在7、8裡面芮是主角光環開\n\
  \n好開滿、武技天賦、原力天賦點滿，可要說是皇帝孫女還是有點牽強啊！為什麼不是路克\n\n的女兒？這是8爛還是9爛啊？而且芮光劍的攻擊上很常使用戳刺，7部曲、9部曲面對忍的\n\
  \n幾次戰鬥都大量使用戳刺，看起來總覺得怪怪的，身為光劍新手、格鬥高手，怎麼不是用\n\n劈砍這種攻擊或防禦面積比較大的動作，反而是用戳刺這種高難度技巧？直到回來後看到\n\
  \n螺絲大的分析文章：光劍2型的特色之一就是戳刺，而且光劍2型也是「西斯」所擅長的劍\n\n式。看到這邊恍然大悟啊！這個是深埋在基因中的遺傳啊！\n\n那這樣真相大白，誰爛凶手只有一個！這是7部曲就有在鋪的梗，只是8沒有接到還亂給一\n\
  \n個答案，兇手就是星8啊啊啊！既然是接拍續集那至少得尊重一下前面埋梗的部分吧？這樣\n\n亂搞不太行，當初看星8說是Nobody時還有點失落哩。\n\n\n\n\
  4.莉亞什麼時候變成大師：為什麼莉亞不能變成大師？先不說沒人知道6~7中間發生何事，\n\n就以星8來說，她被炸到太空中還能飛回來，這不就證明她是會運用原力的？再來有人說為\n\
  \n何星8莉亞要假裝毫無招架之力？她怎麼不在被圍攻時站出來抵抗？首先她才從太空飛回來\n\n還在虛弱期，就算原力再怎麼強太空環境對人體總是有害，從艱困的環境回來總得休息；\n\
  \n其次也是9部曲中有提到的，她的原力不足以支撐她的高強度運用，沒看到她只喊了一聲\n\n班就掛了嗎？\n\n再來回到莉亞有沒有接受過訓練，路克想要重建絕地組織，當6部曲結局時，在場已知有使\n\
  \n用原力資質的人只有2人：路克、莉亞，啊路克要重建絕地組織不訓練莉亞要訓練誰？還沒\n\n找到其他人之前就先訓練莉亞啊！訓練好之後又多一個大師可以幫忙，而且帝國皇帝雖然\n\
  \n殞落，但是帝國餘孽仍存，反抗軍也不是從此高枕無憂，多一個絕地戰爭時就多一分高端\n\n力量，和平時多一位導師幫忙重組絕地組織，這樣不是一舉數得嗎？何樂不為？在9部曲裡\n\
  \n不就還好當時莉亞有接受訓練才讓絕地不至於一切從零開始重新摸索。\n\n\n\n\n5.最後大戰跑出來的那些戰艦不合理：在劇情中就有說到反抗軍是一個火種、一個領頭者\n\
  \n的角色，當那個先出頭的人，誠然最容易被槍幹掉，但是他們的功用就是帶頭，這樣的情\n\n況在現實生活中不也常常發生嗎？要做一件事時，第一個出來行動的人永遠是最難的，因\n\
  \n為不知道有多少人會附和，可能沒人、也可能有人，但是沒有人出來帶頭，那這件事永遠\n\n不會實現。在8部曲時這枚火種是被追殺中、發出的「求救」訊號又被攔截，這枚火種都\n\
  \n快要被水澆熄，沒有燎原的趨勢，其他想要一起放火的人當然就縮了，更何況大部分的人\n\n根本不知道這枚火種快被澆熄。但是在9部曲時反抗軍是主動「出擊」，而且是挑在滅星艦\n\
  \n還無法還擊和防禦時進攻，他們所發出的「集結攻擊」訊號給宇宙中其他人一個可能實現\n\n的希望，而且誠意滿滿的自己已經先上又準備好領路人，當然大家會想要拚一下啊！最後\n\
  \n那滿坑滿谷的戰艦其實就是代表著帝國的暴虐及不得人心，所以當下我看到這一幕時有種\n\n復4最終戰集結時的感動。\n\n\n\n當然星9裡面有很多不足的地方，例如忍武士團真的就像癡漢團只會跟蹤又被秒殺、皇帝守\n\
  \n衛也好廢，至少也要多點戲份啊！不過最讓我不滿的是光劍戰太少啦！我想要看到像3部曲那\n\n樣滿滿的光劍戰！前面芮與忍的戰鬥看起來也蠻熱血的。本來當面對皇帝時芮與班手上的\n\
  \n兩把天行者光劍亮起，期待一場如3部曲中歐比王對安納金的精彩光劍對決，期待皇帝可以\n\n一打二先虐爆兩人，之後二人合作反擊，但卻馬上看到芮班2人瞬間被吸，之後就1人倒地\n\
  \n1人被扔飛，這著實讓我失望了一下，不過還是抱有期待，畢竟大魔王還活得好好的啊。\n\n在芮接受眾多絕地英靈的加油打氣後站起，心裡想著：「難道芮要爆氣單挑幹掉她阿公了\n\
  \n嗎？」雖然這樣會有點扯不過我覺得很可以，給過！\n\n結果一切都只是奢望，竟然是白卜庭自己電死自己...看到這幕也是頭頂很多隻草泥馬跑過\n\n去，白卜庭你3部曲被反彈自電毀容就算了，當你在苦肉計，啊你現在就恢復全盛時期是要\n\
  \n苦肉給誰看啊！你就不會停下閃電拿出光劍劈死芮之後再電爆天上那群烏合之眾嗎？不過\n\n這樣收也情有可原啦畢竟強度太高只能給他劇情殺了。\n\n\n\n\n\
  總而言之9部曲我是看得很爽啦，特效有、熱血有、緊張感有，搭配IMAX爽度真的是爆表，\n\n而且劇情上其實都說得過去，也沒有把星戰的連續性給打爛，跟星8比起來真的是遠遠的超\n\
  \n過！好太多啦！8根本是黑歷史，看完之後就只有WTF而已，感覺完全不尊重系列作的連續\n\n性，為反高潮而反轉，難怪會被噴爆+迪士尼換編導。可能有人很能接受啦，覺得這樣的\n\
  \n星8才是真正精采的星戰，只是我個人完全沒辦法接受這種星戰電影就是了。\n\n以789三部曲的喜好程度就是是7≧9＞＞＞＞＞＞＞＞＞＞＞＞＞＞＞＞＞＞＞＞＞8\n\
  \n如果9能將故事講得清楚點那就更好了。當然最好是再拍一次星8，給JJ拍，現行的就放水\n\n流吧。希望迪士尼在下三部星戰若是還想要3部都不同導演的話，能夠先有個完整大綱再開\n\
  \n始拍攝，別毀了星戰這個迷人的IP啊~\n\n\n\n其實還有想要講的東西，不過現在時間已經很早，那就先這樣吧。大家早安！感謝看完那\n\n麼長的個人心得，以下可以開始噴我了謝謝。\n\
  \n--\n\n  嗶嗶抓到沒專心看！他們將芮放在賈庫就是為了保護芮被皇帝抓到宰掉，這個在片中有\n\n  演出來哦，好像是感應畫面吧，有點忘記了。罰你二刷再看一次(誤)！\n\
  \n\n  對吧對吧？皇帝我期待你再次展現可以跟尤達對打的光劍技巧，結果你竟然給我吸一下\n\n  跟噴一下就領便當了，而且還是自己噴死自己！完全無言啊~\n\n\
  \n  吐槽+1...\n\n\n  韓索羅一直提不起勁去看欸，星戰最吸引我的地方是絕地相關，其他部分就得看心情，\n\n  可能某天心血來潮會想去看吧XD\n\
  \n\n  說真的我還真寧願沒有8部黑歷史，說爽也不爽，說星戰味也沒啥星戰味，就是不停的\n\n  反高潮，然後加段沒意義的賭場，真的是...唉，大嘆三聲奈何啊\n\
  \n\n  這個我同意，個人觀點就是很香很香了哈哈\n\n\n  這樣講也挺有道理的，當下沒想到這一堆人哪來的，現在提起真的認為機器人合理多了\n\n  畢竟當時皇帝看起來已經掛掉，真的有那麼多人還支持帝國嗎？還潛伏幾十年...這樣\n\
  \n  至少都兩代人過去了吧。\n\n\n  唯一支持光劍戰，拜託請選我~從1部曲開始看完全就是被光劍推坑啊！忍武士團比8的\n\n  龍蝦兵還慘。\n\n\n\
  \  對呀對呀，一堆人拿設定啊、小說啊、資料啊來吐說破格不能接受，可是就我這種只看\n\n  電影的觀眾都很能接受這樣的原力了，看過那麼多正史、傳奇作品、小說、設定資料的\n\
  \n  「鐵粉」卻完全無法接受？為啥？\n\n\n  對，這位將軍真的尷尬，他哪位？一開始我還以為他就是內奸哩哈哈。\n\n\n  芮忍戰還算看得滿足啦，不是華麗的劍技對戰，不過也是另類的精采，最失望的是最終\n\
  \n  皇帝戰了QQ  真希望他能拿出3部曲對戰尤達的技巧來打一場。\n\n\n  我也覺得不錯，可是太少了啊！太少太少太少！終章要多一點才比較過癮啦~\n\n\
  \n  就是就是，給人一種正要開始爽就結束的感覺，好想仰天吶喊啊！\n\n\n  這個沒得護，是真的有瞎，除非那把匕首是死星墜毀後才造出來的，可是這樣邏輯又不\n\
  \n  通了...\n\n\n  原力強度設定真心不知，不過也可能因此我才接受度特高吧，再加上平常就蠻常看奇幻\n\n  科幻小說，所以更不會有既定概念「某某能力最多一定只能怎樣」的想法\n\
  \n\n  我的想法跟你一樣欸！握手！\n\n\n  完全同意屌虐8，不過原力的部分其實在演出時芮忍並沒有做其他事情呀，同樣很用力\n\n  的在「原力阿秋吧」，最多就眼神互瞪罷了，這樣也能算全神貫注吧？至於雜魚的部分\n\
  \n  就不知道為何了，畢竟從1~8部曲中所有的絕地都沒有很常使用原力來攻擊敵人，比較\n\n  多的都是劍技部分，可能原力的使用上有某種限制？再來芮並非從小就接受絕地訓練，\n\
  \n  因此在緊張時刻下意識還是會使用最常使用的普通人手段來攻擊敵人，我是這樣解釋啦\n\n\n  噓~這是不能說的秘密，就是看完有些人(如彼...大神)的言論就很想跳出來反駁一下，\n\
  \n  然後愈打愈多就變成這樣了\n\n\n  兄弟，雖然不是官方解釋，但是我也有提到這點，詳情請看2-2及2-3，我個人覺得這樣\n\n  想應該算合理，你覺得呢？這樣也能解釋為何1~6沒辦法到處復活別人。\n\
  \n\n  對呀對呀，完全同意~\n\n\n  我完全同意你的批評，這個是9無法迴避的缺點。只是還是得幫JJ講個話，在7有承先啟\n\n  後的任務，所以老梗複製我能接受，可是我當下在電影院看7時只有滿滿的感動跟爽快感\n\
  \n  ，至少還有埋些梗下來讓8的導演能寫故事，結果RJ完全不尊重星戰這個有劇情連貫的IP\n\n  只想拍自己想拍的，然後讓觀眾滿滿的不爽，最後留個爛攤子給下一個導演收，這樣是\n\
  \n  很不負責任的態度，JJ在9裡面會讓劇情破碎跳痛，其實也是他有在尊重RJ留下來的東西\n\n  ，沒有直接無視打掉，雖然圓的不太好、也不太流暢，又受限片長及終章，能做到這種\n\
  \n  程度我已經滿足了(也太容易滿足)。\n\n\n  要8、9多好是很難沒錯，不過也不能像8爛成那樣吧？8幾乎沒有留下什麼新東西讓下一\n\n  位導演接，還將7留下來的殺光，這個就不是7太保守所導致的吧...這可是「系列」電影\n\
  \n\n  這個我不得不吐槽你一下了，看電影一定或多或少會有邏輯上的瑕疵，尤其是星戰這種\n\n  跨越幾十年的大IP，只要大致上圓得過去就行了，你這樣直接批評與你不同想法的觀眾\n\
  \n  是不是太將自己的想法灌注到別人的身上呢？可以提出電影本身不好，可是請別批評到\n\n  人的身上，畢竟青菜蘿蔔各有所好，沒有人能拍出讓所有人都滿意的作品。HISHE裡面\n\
  \n  明白的指出各電影「合邏輯」的演出方式，這是單純的吐槽作品，而不是批判觀眾。\n\n\n  哈哈被你講中了，看完8之後真的對9不期不待，只剩下想看完的念頭而已，殊不知看完\n\
  \n  之後很愛9\n\n\n  爬死星在很多推文裡面都一直吐槽，你看下面又有人吐這點哩，說真的我完全不認為這\n\n  有啥好吐槽的啊~\n\n\n  是的，我也覺得那種講法有點可笑。\n\
  \n\n  原力還是有量的上限，就像是MP會用光一樣，不拿原力來對應可能是我上面說的習慣與\n\n  省力的關係吧。至於運輸機就是看芮忍二人的原力量能否承受囉，天選之人能夠做到普\n\
  \n  通人做不到的事情我能接受啦。\n\n\n  真的塞了太多東西，這也是本集的最大缺點，原因嘛...就是星8，天啊我一直在黑這部\n\n  不知道會不會有人偷紮我草人。\n\
  \n\n  看PTT長知識，這個說法也能解釋為何絕地不會一直用原力虐小兵，因為他們怕用太多了\n\n  就打破平衡，而芮不用她超強原力秒掉白兵也是因為她是受到「絕地」訓練，因而克制\n\
  \n  經常使用原力的想法。\n\n\n  不能同意你更多...但是試想一下，沒有這種8會不會有另一個更好的9？\n\n\n  兄弟你好，這個原因請見內文2-8，再來對芮來說是否爬得膽顫心驚還是問號，她在拾荒\n\
  \n  星球中不會運用原力尚且在戰艦廢墟靈活上下拆零件，現在已會使用原力輔助運動的她\n\n  對於爬死星應該小事一樁而已吧？\n\n\n  完全同意怎樣都來得比8好，有爽度、劇情上也算過得去，這樣收尾可以了。\n\
  \n\n  對吧對吧！爆爽的啊啊啊！星9好看！\n\n\n  感謝你的贊同~這個就是身為一個星戰電影粉的感想，我相信我這種人還是不少的啦。"
