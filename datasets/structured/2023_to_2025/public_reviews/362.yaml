url: https://www.ptt.cc/bbs/movie/M.1667051827.A.729.html
title: '[負雷] 從天行者到天行仔 - 星際大戰後傳'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~












  我曾經是星戰鐵粉

  (其實也沒很鐵，外傳系列我就沒興趣，所以我不認識阿蘇卡)

  但我每集電影都有去戲院看( 456是看重映)


  其實當初魯卡斯影業賣給迪士尼時

  我心裡是蠻不快的

  因為我從小就不喜歡迪士尼(那時叫狄斯奈)

  所以當時我有種被NTR的感覺

  有種看到自己喜歡的女生跟隔壁班臭痞子玩親親的感覺


  不過SW7上映時，還是去支持了

  回家還發了篇好雷文

  (我給分算鬆，很少給負雷)

  但其實我心中是不太滿意的

  這部片真的是平庸、保守到不可思議的境界

  居然復刻成這樣

  我最不爽的是居然還在千年鷹、還在X-wing、還在死星

  連新版鈦戰機基本上都只是反白而已

  千年鷹是還好，因為有老韓出現，有千年鷹是合理

  但還在X-wing實在很混

  如果說是皇帝死後沒戰爭需求所以沒人做新武器、抵抗勢力窮沒錢買新武器

  這些都還說得過去

  但你SW不是應該做些新玩具來賣嗎??XD

  而且飛行員頭盔還越改越醜




  第八集怎樣大家都知道


  想要大破大立

  但怎麼看都只有大破


  最前面轟炸任務就很糟了

  邏輯古怪先不講

  節奏掌握的不好，冗長又拖沓


  原本SW7刻劃的還不錯的HUX將軍無端變小丑


  賭場星任務 - 超級不知所謂，整個砍掉也沒差


  光速特攻完全不考慮自己是一個系列作的第八集，

  整個無視前作設定，想幹嘛就幹嘛

  有這招的話還需要花錢蓋艦隊蓋死星嗎?



  最後第一秩序拉了一門好大的砲，要攻擊抵抗勢力最後據點

  集氣了半天只打爛鐵門?



  然後不得不提的是

  我永遠忘不了路克喝了外星奶然後露出暢飲表情

  接著芮一臉冏樣看著奶獸

  奶獸回以朦朧的眼神那幕



  不過，凱羅忍用假裝要殺掉芮來隱藏自己要殺史諾克的意念

  那段是不錯

  凱羅忍的座機也設計的蠻帥的

  對我來說大概就這兩個亮點XD



  希望雷恩強森死前記得跟神父告解說自己搞砸星戰

  ( 我沒咒他死啊，我希望他長命百歲)




  第九集


  純粹論爛的話這集不下星八


  還要搬白普亭出來真的很可悲

  什麼叫somehow, Palpatine returned XDD


  那尋寶匕首真的是讓我翻白眼

  JJ你剛看完七寶奇謀喔?


  最後那個帝國艦隊也是很扯

  上面那些官兵到底是哪來的XD

  他們這些年都在做什麼?

  還每台自帶小死星，你到底有多喜歡死星?



  有人說這集是JJ為了把歪掉的第八集硬拉回來

  才會那麼亂七八糟

  這說得過去

  但另一方面來說，也是因為他第七集的基礎沒打好

  才會變這樣



  最後路人問芮叫什麼

  芮回答"天行者"

  我心中OS，還天行者咧 = = ，都被你們搞成天行仔了


  不過當時如果芮摸著肚子紅著臉回答"天行者"

  就好玩了XD





  不管怎麼說，KK+RUIN+JJ真的是天下最糟糕的組合

  當初剛要拍SW7時

  我還在SW版上說不要找麥克貝來就好

  現在回想起來，找麥克貝來亂炸一通可能都還比較好XD



  至於REY設定太瑪莉蘇這點

  其實波跟芬也是設定的龍傲天，只是沒芮那麼誇張

  波在戰鬥機上根本無敵

  一個照面打下十來架敵機

  還可以單挑一台大戰艦

  芬也是最強衛生兵

  這些都算沒設定好

  我還是那句老話：




  總評：感謝星戰八讓我退坑



  --'
