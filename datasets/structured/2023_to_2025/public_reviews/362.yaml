content: "【意外製造公司】The Surprise  │102分鐘│保護級｜英語發音\n\n上映日期：2015-12-18\n\n★《角色》金獎大導麥克馮戴姆睽違18年自編自導最新力作\n\
  \n★電影概念起緣於荷蘭作家貝坎波短篇故事「De Surprise」\n\n★荷蘭影展榮獲最佳女主角獎肯定及最佳影片、最佳導演提名\n\n★芝加哥影展觀眾票選提名\n\
  \n★2015 金馬影展期間10分鐘內完售預售票，一度票選為前10名最佳影片。\n\n\n圖文版 \n\n\n非常非常喜歡這部片，看得我淚流滿面…\n這部在去年金馬影展是秒殺搶破頭的片，\n\
  我無法定義這是愛情片，\n或生死論、或是部闡述人生的片…\n\n「你相信有來世嗎？」\n\n我懷疑導演其實就是個佛教徒…\n我們都是人生的旅行者，\n然而，人生中每個跟你相遇的人，\n\
  或許上天都有在他們身上賦予要給你的意義。\n如果能清楚地學到什麼，就是成長。\n彼此的相遇，就是一種驚喜!\n每個人最後的終點都是死亡，\n若真有來世應該是很安慰人…\n\
  只不過…我也是個相信有「輪迴」存在的人。\n也許是因為如此，我看這部片非常有感觸吧....\n\n\n\n- - - - 以下內容含有劇情 慎入有雷區 - -\
  \ - -\n\n - - - - 以下內容含有劇情 慎入有雷區 - - - -\n\n\n生為人常常在追逐著世間裡所謂的「權力」「名利」「美貌」...等等慾望，\n\
  \n及人世間無可避免的貪嗔癡。\n\n神在我們的身上放上了「慾望」，\n\n出發的原始點或許是希望人類要讓自己更好,日子更優渥...等等，\n\n是要讓我們想要求好變得更好，就是想要向前追求進步及成長，\n\
  \n另一面也是一個考驗，這個「慾望」也有可能讓我們往下沉淪或墮落，\n\n然而在死亡的前面，其實我們所追求的這些「物質」享受或是心神的「慾念」，\n\n都將不堪地化為如浮雲般地飄渺而空虛...\n\
  \n只要是來這世上當人，都會有其的考驗及煩惱，或是苦難要承受...\n\n所以，那怕是我們認為甚具有財富或是權力，或是長得貌美的人，\n\n他們生活應該都幸福或是快樂，但實際上未必如此...\n\
  \n身為人，都會有各自避免不了的煩惱~\n\n然而有些過不了自我的心魔,走上「自殺」一途，讓人不捨也不解....\n\n如同電影中的男主角雅各，我們認為他擁有億萬財富，要甚麼就該有甚麼，\n\
  \n但卻沒有擁有「快樂」...\n\n這世上沒有關係緊密的親人時,想要透過意外製造公司讓他要離開這世界....\n\n\n\n(一)「死亡」是離開人世間的必經之路\n\
  \n以前就認為這世界上最公平的事情就是「死亡」。\n\n雖然「生」「老」「病」「死」謂為人生中無法避免的四件事，\n\n但前三個，未必每個人都會經過，但最後結果卻是一定要到「死」。\n\
  \n這部片，無疑地討論到，「如果可以選擇死法...你想要如何死呢?」\n\n感到諷刺的是...「死亡」是我們人生中最終一定會到達的目的地，\n\n但有人卻想要付錢快速地或舒服地到達這最後的「目的地」，\n\
  \n然而,會想要這樣，或許都有自身所無法承受的身心靈「考驗」。\n\n我想這也是導演想要讓我們思考「生命存在的意義」。\n\n\n\n電影中也討論到各種死法，\n\
  \n「在自己最愛的人身邊死去...」\n\n「意外死亡」或是「最無害於環境的死亡」，\n\n或是由意外製造公司安排不指定死法的「驚喜之旅」，\n\n然而億萬富翁所選擇的「驚喜之旅」，或這些死法不都是日常生活中所遇見聽聞的嗎?\n\
  \n以前就聽說若能在睡夢中自然死亡離去，是有大福報的人，\n\n或許能如此地死去，是對於最終到達「死亡」這個目的地，最為無痛的方式。\n\n而除了男女主角這對以外，\n\
  \n這部電影來意外製造公司購買死亡的人，\n\n有在海邊生病坐輪椅的人(看起來死法是被推落落懸)，\n\n是讓億萬富翁雅各來到意外製造公司的引子,\n\n以及雅各在意外製造公司公司中看到的顧客，\n\
  \n一對老夫婦(在自家中不明原因的起火爆炸)，\n\n及最後讓我很動容雅各的園丁.\n\n而「安樂死」,標榜所謂人道的死法,也就是相對無痛死亡,\n\n在目前的社會中,仍存在著正反不同意見的爭議,\n\
  \n其實，跟這裡的「意外製造公司」理念是有些相似的...\n\n想當然爾，這樣的公司當然是個非法的組織，\n\n認為自己做的是好事，大概是一種讓人安心上路的感覺吧。\n\
  \n所以契約一旦簽訂，就是無法後悔，這大概也是避免糾紛的方法吧！\n\n世界一直在變，在未來的世界中，這樣的公司有無可能合法化！？尚且無法得知，\n\n但生命一去無可復返是確定的事。\n\
  \n常覺得人是一種十分矛盾的動物，\n\n有些人對於如何挽救生命，費盡心血，\n\n或是為了能延活下去而盡可能的努力，\n\n另一方面，也有人對於生命採取放棄的態度，\n\
  \n然而生命可貴在於每個生物都是獨一無二，\n\n一旦死亡就是宣告在這個世界的離開，\n\n很多路其實走了以後，都是無法選擇反悔的！\n\n\n\n\n\n(二)我們都是人生的旅行者，相遇就是一種緣分!\n\
  \n這部電影用「旅行」來形容著人生,\n\n人生就是一段旅程，最後大家的終點都是一樣，\n\n不一樣的只有「過程」!\n\n當簽下了死亡契約後,知道未來的日子不多時，\n\
  \n雅各就開始回想細數著過往的日子的人與事，\n\n希望自己日子要繼續過，跟平常一樣~(如:禮拜五，固定跟媽媽一起跳舞...)\n\n\n\n當男女主角相遇，都簽了死亡驚喜之旅，\n\
  \n開始對於未來所謂的「驚喜」有了期待,\n\n「我們是彼此的驚喜嘛!?」\n\n「你可能是我的驚喜，我可能也是你的驚喜....我們是彼此的驚喜。」\n\n我們是彼此的驚喜嗎？\n\
  \n人生苦短，相遇即是一種緣份~\n\n人生中每個與你相遇的人，\n\n或許上天都有在他們身上賦予要給你的意義。\n\n父母帶給我們的親情，朋友間的友情，乃至伴侶間的愛情...等等，\n\
  \n人生其實是一連串與他人連結所產生的情感累積,\n\n而對於這世界上所擁有的「物」，皆是暫時保管!\n\n因為當在生命結束的那一刻，都帶不走任何東西離開這個世界！\n\
  \n能帶走的或許對於只有這世界「記憶」，以及與他人共處時所擁有的「回憶」，\n\n所以說來到人世間，其實是一段對於靈魂的修鍊....\n\n如同日本經營之聖稻盛和夫所言:\n\
  \n 「不論你多麼富有,多麼有權勢,當生命結束之時,\n所有的一切都只能留在世界上,唯有靈魂跟著你走下一段旅程,\n人生不是一場物質的盛宴,而是一次靈魂的修煉,使它在謝幕之時比開幕之初更為高尚！」\n\
  \n\n\n(三)意外，或許就是神給我們的禮物。\n\n「我跟世界之間有一道隱形的玻璃牆，我看得一清二楚，但它們影響不了我，\n我沒有亢奮或害怕恐懼的心情」，\n\
  \n若一個什麼都有的人，卻沒有人可以分享，是否也是孤單的事?\n\n男主角雅各縱然擁有億萬財富，\n\n但對於這個世界及人生毫無熱情，所以對於未來並沒有任何期待，\n\
  \n當面對卡車，即面對死亡來時，態度很淡然，\n\n直到在與死亡擦過的那一瞬間又感覺到對世界，似乎有某種依戀存在...\n\n而女主角對於死亡的想法,\n\n\
  不知道是否為導演透過此角色來論述著輪迴對於生命之間的關聯,\n\n但可以確定是....我很有共鳴...\n\n「我一直在尋找自己的歸屬。」\n\n「別人總是用他們的方式看我，卻沒有看到真正的我」\n\
  \n 「我想到另一層看看會不會有不同，佛教徒不能自己按鈕，\n所以只能請別人幫自己按下按鈕。」\n\n亦即自殺罪業深重，如果不是意外死亡，就會變成的業，跟著到下輩子。\n\
  \n因為孤兒的關係,讓女主角對於現世有些沒有歸屬感，\n\n男女主角的共通點就是,兩人對於這世界，心皆無歸屬。\n\n另外,女主角學學習算命占卜等等，其實也是在表現人對於未知的未來，\n\
  \n因為迷惘而會做的事，或是希望自己能趨吉避凶，能夠有更好的生活，\n\n抑或是希望自己能改變命運，改變現狀。\n\n預知命運，或是預知死亡，是否就像看電影一樣，\n\
  \n看之前，如果有人跟你講劇情，爆雷爆光光，當你都已經知道劇情所有的走向，\n\n是否一切都顯得無趣無期待了起來?\n\n神給我們，很重要的一點，就是讓我們有「選擇」的自由。也有選擇「改變」的自由。\n\
  \n如同男主角後來想選擇將旅程「延遲」旅程一樣，\n\n也如同女主角因為上男主角而改變心意一樣，最重要的一點就是「愛」而改變了。\n\n世界上其實有很多事情皆不是金錢所能解決及取代，\n\
  \n只是金錢很容易偽裝成這些事情表面的外殼，卻無法取代成核心，\n\n或許有人要持反對意見認為「沒有金錢萬萬不能」，\n\n雖然錢很重要，但在面對生命或健康時，皆是沒有討價還價的空間，\n\
  \n也如同人生中有很多叉路，大多時候我們是保有「選擇」的，\n\n對於雅各的園丁所選擇的死亡方案，原本以為是選擇「驚奇方案」，\n\n結果是「在自己愛的人身邊死去」，突然讓我很動容，\n\
  \n園丁認為死亡可以讓他與死去的妻子相會，\n\n以及與雅各的談話，\n\n「你相信有來世嗎?」\n\n「我不知道來世是什麼樣子，也不知道來世存不存在喔」\n\n\
  「如果真的有來世，我想那應該很能安慰人」\n\n就如同前所述，在離開世界前，讓自己最掛念的會是曾經相遇過的人，\n\n或是還未了的事，\n\n而相信有「輪迴」，認為有來世，生命還有延續，\n\
  \n也相對讓死亡這件事讓人覺得好過些。\n\n因為人生常存在著「無常」，\n\n原本上禮拜園丁對雅各說會想念他，但後來卻變成雅各想念對方....\n\n並表示早知道應該多些時間跟對方聊天與相處....\n\
  \n 人生苦短，相遇就是一種緣分及幸運，\n\n這世界上，最後讓自己留存的與人之間彼此的情感。\n\n當看著片尾的時候，男女主角在海邊跳著舞，\n\n很閃也很感動....人生其實有時候要的很平凡，\n\
  \n跟自己愛的人在一起就是一種幸福~\n\n\n\n「如果知道你明天就會死，那你會想做些什麼？」\n「我想要跟你一起跳舞…把時間給你…」\n「願意陪你跳舞，雖然我舞跳得不是很好…」\n\
  \n--"
