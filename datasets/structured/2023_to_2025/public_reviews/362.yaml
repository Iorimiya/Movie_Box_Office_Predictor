url: https://www.ptt.cc/bbs/movie/M.1665930325.A.5CD.html
title: '[負雷] 孫行者傳 台灣導演蹉跎六年的空想動畫夢'
content: '【電影】國產動畫電影《孫行者傳》 台灣導演蹉跎六年的空想動畫夢？


  巴哈創作版：


  預告片：




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  《西遊記》早已是華語圈拍到爛的題材，上百部的《西遊記》為主題作品，不管怎麼改來

  改去，基本上都脫離不了唐三藏、孫悟空、豬八戒、沙悟淨和一匹馬前往西邊取經的劇情

  ，玩不出什麼有創意的改編。不過近年來還是有像動畫電影《大聖歸來》和遊戲《黑悟空

  》（目前僅有技術展示）的優秀《西遊記》主題作品的。


  而台灣有著多年動畫電影製作經驗的導演莊家修，就算團隊缺少經費、製作技術跟頂尖動

  畫公司有著不少差距，更沒有預算可以行銷傳，仍憑靠著自身對動畫電影製作的熱情，耗

  時6年光陰，製作出動畫電影《孫行者傳》，挑戰名為《西遊記》的紅海市場。





  《西遊記》就算拍了上萬次，卻還是有人願意製作《西遊記》電影，不只是《西遊記》是

  中國小說史上的眾人皆知的經典，其通俗又兼具諷刺性值得內容，放到現在還是可以受到

  了廣大的歡迎。


  尤其孫悟空大鬧天宮、西天取經、斬妖除魔的故事淺顯易懂，總是可以打動小孩子的心。

  就算大人早就對爛大街的《西遊記》作品嗤之以鼻，看著不斷催促自己的小孩那楚楚可憐

  的模樣，也會情不自禁帶著小孩進入電影院再看一遍已經不想再看的《西遊記》改編作品

  ，



  回頭來看《孫行者傳》，故事的劇情並沒有特別著重於孫悟空的身世，而是直接從孫悟空

  大戰紅孩兒開始的，這個時候唐三藏一行人就已經開始西天取經之旅，故事的主軸聚焦於

  原著中的經典篇章，牛魔王一家人與唐三藏一夥的愛恨情仇，拯救準備要被紅孩兒吃掉的

  唐三藏、智取鐵扇公主奪取假鐵扇、與牛魔王的最終對決，最後成功撲滅火焰山，繼續朝

  西邊取經的路前進。


  我並沒有真正深入了解過任何與《西遊記》相關的作品，所以很難能判別電影中的劇情發

  展有多少是與原著相同，但八九不離十是照著原著走得準沒錯了，





  既然故事上沒有特別的地方，那就得依靠動畫的技術，才能跟市場上的妖魔鬼怪比拚。但

  可惜的是，不管是人物的3D建模還是3D場景就如同預告片上所展示的一樣慘烈。


  從《孫行者傳》的人物臉膜就能隱約聞到一股經費不足的廉價感，而人物在說話時的表情

  ，也沒有太多的表情變化傳達人物的感情，，只

  有在重要的感傷時刻，比如唐三藏命危、豬八戒奮勇守護孫悟空等場景，才會有明顯的表

  情變化。




  有的時候，，在大場面戰鬥的的時候都

  會不知道是誰在說話。我最印象深刻的一點，是牛魔王和孫悟空在對峙的時候，我以為牛

  魔王直接當面說著自己想打發孫悟空走去跟蝦兵蟹將吃飯的計畫，想說牛魔王是瘋了才會

  對孫悟空講出自己的陰謀嗎？


  後來仔細想想才想到原來那段是牛魔王的心中話。由於牛魔王講出這段話的場景實在是快

  的措手不及，之前也發生太多次人在說嘴巴沒在動的情況，所以牛魔王到底心裡想了什麼

  ，還有到底跟孫悟空說了什麼，其實很難分辨得清楚，這不僅僅是3D的問題，演出的安排

  也並沒有十分精準。




  而電影中的3D場景也很難讓人不注意，人物都這樣了，場景也自然不會有多精美，場景與

  畫面鏡頭沒有良好的融入，牛魔王一棒把地板敲碎的畫面，下一顆鏡頭就看到場景又回復

  了原來的樣子，彷彿什麼事情都沒有發生。


  同樣的場景出現在牛魔王與孫悟空決一死戰的鏡頭，兩人的大絕招撼動了森林，但森林的

  樹也只是意思意思動了一下，彷彿只是被風吹過一般，嘲笑兩妖就只是在打打猴戲。


  在《孫行者傳》中，想在孫悟空與牛魔王、鐵扇公主、紅孩兒這些敵人幾輪大戰後，看到

  面目瘡夷的場景是不可能的，而這樣的矛盾就會是觀者感到不連續的怪異感。




  在3D上，已經確定可以打個「不及格」的分數，在特效方面也很難要求《孫行者傳》能有

  什麼機會一鳴驚人。以火焰特效為例子，面對觀影品味越來越高的大人來看，他們心中的

  特效，一定得像跟現實一樣，或者像《鬼滅之刃》中的大哥火焰那樣帥氣，





  不知是不是刻意為之，電影的鏡頭移動大多數時候都動得非常快，很少會看到什麼靜止鏡

  頭的畫面，就算是較為平靜閒暇聊天片段，也大多是快速的鏡頭切換。


  我認為這樣做掩飾了一些電影3D的尷尬感，透過快速移動的鏡頭，去彌補人物和場景上的

  技術問題。意外地是，這造就了，該打

  架就打架，要說幹話就一口氣把幹話說完，這是歸功於導演莊家修多年的執導功力及剪輯

  的結果，算是在諸多缺點中唯一可以與市場上的動畫電影並駕齊驅的地方。




  雖說如此，其實《孫行者傳》的高速鏡頭也不怎麼樣，觀影者還是可以看到角色常用怪異

  的動作在鏡頭面前進行表演；連續、高速且不斷晃動的模糊鏡頭，觀影者看久了眼睛也會

  感到不適。


  就算這樣，總也不能電影全程都用高速晃動鏡頭，畢竟唐三藏一行人還是得拜訪村莊的，

  牛魔王還是要跟鐵扇公主和玉面公主上演三角關係的，當這些文戲開始進行時，就沒辦法

  無視《孫行者傳》的3D動畫，看上一眼，就彷彿自己坐上《回到未來》的時光車，回到10

  年前那懵懂無知的青春年代，看著粗糙的動畫笑得合不攏嘴。只是看《孫行者傳》時，產

  生的心情不是開心，而是。




  令人費解的是，電影裡還有很多慢動作鏡頭，這些慢動作鏡頭不明說，大家也能透過雪亮

  的眼睛了解到《孫行者傳》與現今動畫電影製作技術的差距，讓我在觀看時，一直在思考

  《孫行者傳》的誕生是經過多少的苦難，這種隱藏自己優點，又揭露自己缺點的手法，有

  點難以理解。


  最慘的莫過於有些鏡頭該呈現出的情感表現，被糟糕的演出給破壞了，有一幕孫悟空與豬

  八戒開心的談論要怎麼跟三藏師傅報喜的愉快場景，在畫面的另一邊卻同時還有沙悟淨抱

  著師傅痛苦的樣子，然後孫悟空仍舊繼續無視背後的火災現場，繼續和豬八戒高談闊論，

  這樣。





  雖然故事劇情照著《西遊記》走，但《孫行者傳》裡壓根沒有說牛魔王一家是什麼作惡多

  端的妖怪，而是五百年前孫悟空的結拜兄弟。紅孩兒在父母的溺愛下為非作歹、牛魔王搞

  外遇徒留鐵扇公主在家，而鐵扇公主只能在家默默流淚，牛魔王一家，根本就是現代中常

  見的問題家庭而已。




  而看看孫悟空做了什麼？只是因為鐵扇公主不借扇子，就打算跟鐵扇公主打得不可開交，

  還變成蒼蠅在鐵扇公主的肚子撞來撞去，逼的鐵扇公主只能乖乖屈服，牛魔王也只是玩世

  不恭交了個小三，離罪大惡極也很遙遠，面對孫悟空的侵門踏戶正當防衛也是十分合理，

  但不合孫悟空的意，佛祖就叫天宮大兵一起來圍毆你。






  也由於每個角色，除了孫悟空之外都沒有講述自己過去故事的機會，所有角色的面向都變

  得十分平面。孫悟空在電影中的行為跟惡霸沒什麼兩樣；豬八戒就只是一個整天只知道吃

  的肥豬；沙悟淨全電影都在打醬油，並且總是和唐三藏在談情說愛，都不禁讓人覺得兩人

  有什麼不可告人的關係。


  而孫悟空從魯莽的潑猴變成決意著師傅西天取經的過程，僅透過短短30秒的回憶動畫呈現

  ，之後讓三藏讓觀影者強行腦補「你不覺的悟空變了嗎？」但說真的，我們感覺不到，也

  不想知道，






  雖然導演在採訪時說看著網路因偏見而毒舌批評與謾罵，年輕同事一度淚灑辦公室，我看

  了也是很難過，沒人是故意想做爛一部作品的

  但網路的批評也沒有不是沒有道理，電影的3D真的不行、故事看起來也沒有什麼新意，

  就是比同時在播映的《搖曳露營》、《航海王RED》、《角落小夥伴》沒有吸引力。


  而電影預告片，或許可以是這個動畫電影專案最大的失敗。說老實話電影的表現比預告片

  好，但也就是好那麼一點點，預告片本來就是要把電影的優點盡量表現出來，讓觀眾願意

  付費進場觀影。可能是《孫行者傳》怎麼剪都沒辦法了，所以只能剪出一片，看起來好的

  一

  個版本了也說不定，最後的結果也不言而喻。除了標榜「台灣原創」外，好像真的沒有什

  麼可以進場觀看《孫行者傳》的理由。




  不過至少可以確定的是，小孩子的確不討厭《孫行者傳》，甚至會非常喜愛很愛這部跟著

  孫悟空一起冒險的《孫行者傳》。前面有說過節奏感是《孫行者傳》唯一可提的優點，至

  少在看的時候，小孩子不會覺得無聊，以小孩的標準來看孫悟空甩者如意棍爆打牛魔王的

  場景，也會覺得孫行者真的是帥的一匹。


  但對於一般的觀眾而言呢？可能只會覺得這是一部過時的動畫片，早已進入社會打滾的大

  人及學生，對他們來說這樣的畫面肯定是不及格的，不可能願意交出270元支持《孫行者

  傳》。





  導演莊家修想達成的「努力對抗世俗對台灣動畫電影的成見與偏見」目標，《孫行者傳》

  卻繼《重甲機神》之後，又活成了一般民眾對於台灣動畫成見與偏見的想像。但這並不代

  表我們要忽視電影團隊製作上的血與淚，

  ，就是礙於製作技術和經費的問題，最後的結果不那麼好而已。



  有人會說，看看對岸的《哪吒之魔童降世》和《黑悟空》等作品，《孫行者傳》這是什麼

  垃圾！但我也認為拿這些作品跟《孫行者傳》比較好像也不怎麼公平。人家有錢有人才，

  想要有技術還可以用買的。《孫行者傳》看起來就是一個投資者又少、願意做的人也不多

  ，技術也落後一大截，只是為了圓一個夢。



  ，也勢必會遭到

  網路的無盡謾罵。但至少莊家修導演與他的團隊一同達成了多年以來的夢想，且還沒有去

  拿政府的長片輔導金，比前段時前拿政府的錢，卻把大部分內容拿去給中國外包的《重甲

  機神》。憑藉自己的努力，做出的結果雖然非常難以直視，還是可以給他們一點掌聲的。



  想翻轉台灣動畫電影成見與偏見也絕對不只莊家修導演一人，《小貓巴克里》、《幸福路

  上》、《諸葛四郎》……這些台灣動畫電影也正試圖改變大家對於台灣動畫電影的印象。

  在台灣也有夢想動畫、兔將創意等優秀的動畫公司，透過精美的作品在國際間發揚光大。

  在學生團隊之間，也常常可以看到優秀的學生動畫作品。台灣真的還有很多優秀的動畫人

  才，值得我們去關注。





  — — — — — — — — — — — — — — — — — — — — — — — — — —

  — — — — — —


  感謝你的耐心觀看！我在巴哈姆特有自己的小屋，分享觀看電影和游玩遊戲的心得，歡迎

  來我的小屋中來作客聊天！









