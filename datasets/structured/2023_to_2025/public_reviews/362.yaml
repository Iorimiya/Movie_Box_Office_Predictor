title: '[好雷]《使徒行者2：諜影行動》原來這才是真愛阿'
content: '以下有雷


  圖文好讀版：






  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  《使徒行者2：諜影行動》是一部香港警匪動作電影，由文偉鴻執導，張家輝、古天樂、


  吳鎮宇、姜珮瑤主演，劇情講述香港鬧市發生嚴重的交通意外，刑事科葉國帆和總督察程


  滔逮捕一名可疑的女駭客姚可儀，不過保安部井進賢認為事關重大，向處長要求把案件交


  給自己部門處理，隨著調查範圍遍及緬甸和西班牙，三人也在多次任務受到阻礙而感覺不


  對勁，懷疑身邊可能有黑警混入其中。




  我必須承認自己接觸的港片不算太多，不僅對許多被視為經典之作的電影感到陌生，對港


  片的故事模式也到這幾年才有進一步的了解與認識，但在近期看了幾部港片之後，還是對


  香港的電影工業產生了一些想法與感觸。雖然常聽到其他人有：「香港電影已經沒有往日


  榮光。」、「港片已死。」的說法，不過我倒認為他們正在逆境裡努力求生。個人心中最


  配服港片的地方，正是他們就算幾乎都把題材縮限「警匪」或「黃賭毒」，但也能在每部


  看似相同主題電影中，做出帶有許多新意與創意巧思的元素和故事內容，而《使徒行者2


  ：諜影行動》就是一個例子。




  《使徒行者2：諜影行動》雖然是整個《使徒行者系列》的第五部作品，前面也已經有三


  部電影劇和一部電影，但有趣的是，本片儘管有著《使徒行者》三位主要演員張家輝、古


  天樂和吳鎮宇的回歸，整體故事卻跟上述所有作品沒有任何關係，甚至演員所飾演的角色


  也不相同，反而是以一個在多國犯下多起恐怖攻擊事件的犯罪組織來走港片最喜歡的「雙


  雄」戲碼，讓這兩位在任務中互相協助、懷疑的主角，彼此心中嚮往正義卻身不由己的兩


  難掙扎。




  如果說前陣子的《掃毒2天地對決》是透過毒品引發的事件，讓兩兄弟從此反目成仇、勢


  不兩立，《使徒行者2：諜影行動》透過綁架兒童的犯罪組織，呈現兩人在童年時期以魔


  術方塊建立他們同甘共苦且難以割捨的兄弟情。電影看似暗潮洶湧，警匪互相鬥智鬥力，


  但到最後我們才發現其內裡卻是相當簡單純粹，沒有什麼以一檔百的大英雄，反而以角色


  為了家人，為了朋友而潛伏在警方的臥底身分，來加深兩人表面不說，心裡暗自佈局、放


  水的兄弟情誼。




  毫無疑問，《使徒行者2：諜影行動》是一部娛樂性極高的電影，不僅全片圍繞在警匪雙


  方爭奪目標，以駭客、臥底、滲透元素讓電影充滿不可預知的懸疑氛圍，從「黑警」出發


  ，透過人物立場的變換與導演多次製造的劇情翻轉，更讓原本相對單調的反恐任務變得緊


  湊豐富。其中橫跨多國、豐富多變的場景搭配大量攻堅與對峙的槍戰場面，打鬥、飛車、


  爆破樣樣不少，我想就算有結局那頭逃離奔牛節的鬥牛來鬧場，從前段懸疑臥底慢慢轉往


  最後誇張熱血的兄弟情，還是能讓觀眾沉浸在電影塑造出來的世界。




  整體而言，一直以來我對港片的想法就是你怎麼演我就怎麼看，放開心胸享受角色愛恨情


  仇所產生的火花，《使徒行者2：諜影行動》就是需要以這種態度來觀賞的電影，看著張


  家輝、古天樂兩位主角從小就因為魔術方塊建立起深厚的情感，因為綁架案而被迫分離，


  到長大終於才以警察的身分重逢，並始終都沒有忘記彼此與那相連兩人的魔術方塊，光是


  這些角色塑造的小巧思，《使徒行者2：諜影行動》就足以讓人滿意。




  時事題外話，電影講述香港警察碰到一群黑衣人不斷上街妨礙警察，破壞香港和諧的秩序


  ，警方任務多次受阻，甚至有傳聞指出其中有黑警混入，幸虧在全港警察努力之下，雖然


  有同仁因此受傷，最終結局還是成功鎮壓所有歹徒，化解這次恐怖攻擊的危機。恩，這個


  劇本好像在哪看過？



  --


  歡迎追蹤我的FB或IG專頁




  --'
