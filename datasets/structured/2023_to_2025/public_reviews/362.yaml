title: '[新聞] 結局就在影片中？「天行者的崛起」最終預告解密關鍵！'
content: "新聞網址：\n\n2019-10-22 18:31 聯合報 記者蘇詠智／即時報導\n\n歐美萬千影迷期待的「星際大戰」系列最新續篇「Star Wars：天行者的崛起」據傳將是\n\
  42年來長達9部影片的「天行者」故事最終章，讓老粉絲都好奇將如何收尾？雖然迪士尼\n早就宣布一堆新的「星際大戰」相關系列新片在籌拍中，但未來不一定會再以「天行者」\n\
  一家為要角，使得這部並非整個「星戰」傳奇完結篇的完結篇，還是相當被期待。\n\n在最新預告片中，女主角芮一如各方預期可以使用光劍、成了絕地武士，她的身世之謎終\n\
  將揭曉，她和「天行者」家族到底有何關係？與變成大反派的新一代黑武士凱羅忍間的對\n決如何收場？預告中都透著玄機，值得觀眾在12月正式上映前反覆研究琢磨。由比利狄威\n\
  廉斯扮演的蘭杜，在最新一集中也重新回歸，是另一老影迷期待的資深面孔，也為此集增\n加不少噱頭。\n--\n    \n\n ; \n\n \n\n--"
