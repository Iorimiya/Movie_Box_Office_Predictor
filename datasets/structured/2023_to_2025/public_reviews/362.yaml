url: https://www.ptt.cc/bbs/movie/M.1576675023.A.C80.html
title: '[好雷] Star Wars：天行者的崛起'
content: "1.本世紀的後傳三部曲終於能蓋棺定論 。我認為隨著時間沈澱，能被後世討論反芻的絕對\n  是Rian Johnson的《Last Jedi》，但JJAbrams在新觀眾老影迷之間勞苦功高的拔河賽也\n\
  \  值得肯定。《天行者》一如預期重現了《絕地大反攻》的氛圍，延續《原力覺醒》的敘\n  事，圓了《Last Jedi》的破格設定，然後置死地而重生。\n\n\
  2.Carrie Fisher的逝世確實讓片子很多橋段窒礙難行，但特效還是萬能，一幕重現年輕\n  時路克和莉亞的光劍訓練就展現地非常神妙。莉亞賜死不知是原規劃還是配合現實，因\n\
  \  為前者的決定是完全影響到這一部曲的標題。\n\n3.Rian上一集那些大破格設定JJ真的順應民意大筆刪去，包括何朵的光速迫擊，被形容成\n　像黑歴史。上集的史諾克死得過草率，這集就被解釋為西斯的實驗品(鏡頭還帶過泡在\n\
  \  福馬林的偽Snoke)\n\n4.第一軍團在上集之後就蜀中無大將，這次的人類反派就交給新任將軍Richard E. Grant\n　。然後Domhnall\
  \ Gleeson非常快速領便當掰掰，基本上他這個角色在後傳三片裡刪去也\n　沒差吧。\n\n5.John Williams客串一幕，外星酒吧的店員。\n\n\
  6.Amanda Lawrence飾演的larma d'acy在片尾親了一個女人（實在看不清楚是誰）。\n\n7.片尾模傲《絕地大反攻》秀出各個星球星艦的墜落好像有點沒必要，因為很多星球根本\n\
  \  沒出場。然後最後回到塔圖因以懷舊來說很感動，但回顧整個九部曲又不是太重要，路\n  克和莉亞也不是在這裡出生，只是路克發現原力的所在。最後的英靈秀怎麼沒有Adam\n\
  \  Driver啦（道行不夠高？）\n\n8.完全可以想見影評大爆走的緣故。這片真的要講太多東西要收太多尾救太多東西，JJ根\n  本沒空鋪陳什麼感情，講完大綱就兩小時了。然後有人說絕地血脈死透了只剩西斯尚存\n\
  \  ，這....呃好像也沒錯。Daisy Ridley感覺會走上Hayden的片約危機，給她未來留個後\n  路吧。\n\n9.見到Harrison Ford回鍋蠻驚喜，應該是劇本改寫後的決定？\n\
  \n10.Keri Russell從頭到尾竟然只露眼睛，搞屁啊！（跟前兩集的Gwendoline一樣浪費）\n\n11.全片最感動的應該是Billy Dee Williams的老藍道向芮說：幫我問候莉亞，芮回你自己\n\
  \   去看她吧。但其實永遠看不見莉亞了。\n\n\n\n--"
