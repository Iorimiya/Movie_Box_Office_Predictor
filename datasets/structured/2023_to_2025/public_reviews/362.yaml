  所以還是慎點

  想看的趕快去看吧










  ep8被罵太慘了 幾乎整個砸毀

  ep9不是這麼好救回來 但看的出JJ努力了


  劇情上沒有太多的驚喜

  要把故事圓回來大概也只能這樣說了

  從預告就大概猜到劇情脈絡的八成了 很多分析影片分析的更精確



  節奏前段有點太快

  中段則有點拖劇情 有些多餘的插曲

  後段才調整回適當的節奏

  但有幾個地方真的有點轉太硬 被ep8害的


  副標題很妙 天行者的崛起

  這名字從英文來看取的很棒 很精妙

  但從中文來看其實不太適合 很難取 但這是非戰之罪...


  光劍戰很少 就...一場

  出現的外星種族很多 這是ep8缺少的

  結局很不錯 完美的劃上九部以來的句點

  看完坐著聽音樂到結束 沒有片尾畫面（這不是漫威）


  繼續期待後續三部曲




  --

  好問題 問RJ 始作俑者阿

  需要出示票根跟限量海報嗎'
