url: https://www.ptt.cc/bbs/movie/M.1702374848.A.96F.html
title: '[好雷] 只是想被愛──《夢行者保羅》（Dream Sc'
content: '剛好看見有人發文問支持的人在哪

  我是第一次看凱吉的電影，很喜歡

  來拋磚引玉，希望有更多人進場支持！

  《夢行者保羅》不只是看凱吉的演技

  我認為劇本題材也是非常新穎的

  而且整場戲都讓我坐立難安（褒）

  以下防雷




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~



  只是想被愛 ── 《夢行者保羅》（Dream Scenario）

  以下防雷






  保羅是個已有終身教職的生物演化學教授 ── 我記得特別清楚（希望不要記錯），原因是他在網路名人經理人公司Thoughts第一次面談時，老闆不停地誤認他要出版的是植物書，其他助理也不遑多讓，一心想安排他與雪碧公司葉配，絲毫不在乎他的教職專業、出版理想
  ── 卻也是一個無聊的老爸、社交失敗分子。保羅經常開逾矩的玩笑，例如對著學生：妳現在這樣是對我有意思嗎？但我知道，他並不是真的想要跨過那條線。從保羅跟他太太珍娜的互動可以清楚知道，他非常安於這個幸福美滿的家庭（雖然女兒認為他是個不酷的老爸，但互動還算無虞）。



  那他為什麼要試圖提出那種「踰矩的問題」？ ── 「妳這幾年會想起我嗎？」、「我是說，這是我太太擔心的事情。」、「那太好笑了對吧」從對方的神情變異，保羅當然也察覺到自己說錯話了（他同時是一位熟知心理學、教育學的教授）。我在這部電影裡面不斷地看到保羅的焦慮：「你有看見我嗎？」（我是值得被喜歡的人吧）



  我有教授學位，妳知道吧。

  我的研究所同學剽竊了我的智慧財產權，那是我先說出口的想法。

  為什麼是她聲名大噪？為什麼她不邀請我共同掛名？

  為什麼我那個愛邀請上流名人的朋友，從來不邀請我？



  突然有一天全世界都夢到他了，他在網路社群一炮而紅，原本寥寥無幾，幾無討論度的課堂突然爆滿，所有學生爭相來看這位夢中出現的「名人」，他開心了。他的女兒甚至突然拍起他的生活照，為了證明「這是我老爸」，久違沒有收到女兒崇拜的他，頓時又獲得了身為父親的快樂與成就。



  是的，保羅終於被看見了。可是大家看見的，是那份「迷因」。是笑料，話題，一閃即逝的成名。當他努力為自己的出版心願站住腳，與經紀公司出現分歧點的時候，故事就要開始往下墜了。



  夢行者，dream walker，他（非自願地）穿梭在人群的夢裡。可是除此之外，他也是一個dreamer。他長年以來夸夸其談的出版計畫，在珍娜的一問之下才知道隻字未寫。保羅的可憐、可惜，甚至於可恨，其實不能不承認一部分是自己造成的。卻也正是因為如此，我非常能夠同理保羅這個角色。



  因為一袋米得獎那時，網路消息甚囂塵上。我寫詩幾年、自費出版兩本書，突然因為一首詩，我成為突然出現的迷因詩人。我看見保羅像看見我自己。我也有著「所以你看見我了嗎」、「那我都在做些什麼」、「嘿，我的本職是生物演化學教授／詩人」這樣的焦慮。



  面對越來越多人的注目，夢境開始失控，許多保羅未曾「實際做過」卻在「他們的夢中做過」的事情，被一一指控到現實世界，取消文化開始了。一陣熱潮過去，關於保羅的夢就突然消失了
  ── 如同那些、舉個台灣的例子，廖老大？ ── 保羅被世人遺忘了，可是他的家庭也被摧毀了，保羅自始至終都是一個抑鬱不得志的「魯蛇」。



  幸好，這部電影在最後的最後，給了一個那麼那麼，真的那麼那麼浪漫的結局。



  「妳最近有夢到我嗎？」



  不要忘記我。





  （證明用票根，非業配，一人包場QQ）

  -----

  Sent from JPTT on my iPhone


  --'
