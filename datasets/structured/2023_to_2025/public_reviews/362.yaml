url: https://www.ptt.cc/bbs/movie/M.1429429640.A.E74.html
title: '[新聞] 「行者」：捕捉藝術家的靈魂'
content: '塗翔文／「行者」：捕捉藝術家的靈魂


  聯合報


  文／影評人塗翔文


  剛開始看陳芯宜執導的「行者」時，很難不聯想起文溫德斯的「PINA」：關於女舞蹈家

  的紀錄片、經典舞作，還有將舞蹈之美與自然環境融為一體的畫面。不過隨著鏡頭一點

  一滴緊跟林麗珍的腳步，我們便能拉開兩者之間的差別。溫德斯透過3D鏡頭，拍的主要

  是「舞」，讓觀眾透過銀幕感受劇場中現實表演的迷人張力；而陳芯宜則是以時間、

  空間換取的細膩捕捉，試圖領著大家貼近藝術家那幽微曲折、難以量化言說的創作靈魂。


  未採取人物型紀錄片最傳統的編年體結構，也沒有過多旁徵博引的訪問或濫情旁白，

  不像「PINA」之於碧娜鮑許的蓋棺論定，影片主角─「無垢舞蹈劇場」藝術總監林麗珍

  幾乎是直接面對鏡頭，展露她從生活轉化為創作的心路歷程。由於陳芯宜是扎扎實實跟了

  10年的拍攝期，並非壓縮於短時間內的密集訪談，被攝者幾乎是照著自己原有的生活節奏

  ，而被「紀錄」下來，因此避掉了很多台灣紀錄片裡流於過度設計應答的斧鑿痕跡。


  舞蹈本是律動的藝術，林麗珍的舞由動而靜，再從靜思動，難以言語細述，屬於形而上的

  美感經驗，而「行者」卻能成功找到一種適切傳達的電影語言。自「醮」、「花神祭」到

  「觀」，即使是從未看過林麗珍舞作的觀眾，也能從細節呈現的滲透裡，感應到她在創作

  思維上的脈絡，漸漸從常民生活，體會至人類與萬物天地間的玄妙關係。


  表面上，舞蹈似是影片最醒目的主題，但顯然導演最感興趣的還是「人」。電影從林麗珍

  在一方斗室的打坐開始拍起，呼應最後同個房間裡隨興而至的獨舞，終至隱身於鏡頭之外

  ，幕起幕落，人生亦如表演。其間，剪輯敘事漸漸進出於她在公、私領域的身分轉換：從

  迷戀舞蹈的少女、熱血澎湃的舞者、轉為亟欲尋覓出自我風格的編舞家與嚴師，最後又回

  歸到單純身為一個女性的位置，包括婚姻、家庭，甚至是作為平凡母親的身分。


  所謂的「行者」二字，其實之於創作，亦之於人生；之於林麗珍，也之於陳芯宜。在台灣

  紀錄片流行起某種「速成」式的煽情路線之際，「行者」的出現，讓我們看見另一種充滿

  態度、沉潛自持的創作風骨，影片本身不僅與主角聲氣相投，更交融釋放出飽滿豐潤的生

  命厚度。




