title: '[好雷] 濃濃香港味的使徒行者'
content: '之前聽到使徒行者這名子，還以為是甚麼獵殺第四行者的科幻片，又撇到巴西里約熱內盧

  ，我想應該是部廣告不多的好萊烏電影吧。

  後來看了宣傳照，原來是港片啊!!!!

  管他叫使徒行者還是耶穌行者，肯定是部警匪片。




  ------------------------以下小雷------------------------


  果不其然、光看預告就令我非常期待，毒品、警匪、行動代號、臥底，十足的香港電影題

  材代表，加上整部片圍繞著Black Jack的身分在打轉，有種讓我在看兩小時版的無間道的

  感覺


  除了最近比較常拍戲的張家輝、古天樂，最讓我驚訝的是吳鎮宇！對她有印象的上一部戲

  ，應該是古惑仔之人在江湖了吧XDDD


  影帝不虧是影帝，最後那段便當戲，吳sir擺脫以前都演比較沒義氣的腳色，這次兄弟情

  義表露無疑阿，差點落下男兒淚。


  總結：這似乎是最近唯一讓我想二刷的港台片阿，大推


  --'
