url: https://www.ptt.cc/bbs/movie/M.1576765994.A.CE5.html
title: '[好雷] STAR WARS 星際大戰 天行者的崛起'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  原文連結





  臉書專頁










  很久很久以前，在遙遠的銀河系，在一顆富含水分的藍色星球上，有一隻邪惡的鼠輩正在


  操弄著一場亙古的史詩對決。




  後世稱之為《星粉大戰》。




  在《原力覺醒》的時候，這場大戰還不是那麼的明顯。做為展開新生代故事的第七部曲，


  《原力覺醒》的基本架構雖然有如《曙光乍現》的復刻版，但也讓人看到了這系列的確還


  蘊涵著的無窮潛力，而接手的片商高層、影人後輩們，就算將George Lucas當年的劇本原


  案束之高閣，也或許有這個能力延續星戰世界的傳奇。




  然後在《最後的絕地武士》，本來只是山雨欲來的粉絲內戰終於正式開打了，而且打得如


  癡如醉、敵我不分，戰況膠著，打到本來排定接下第三棒的《侏儸紀世界》導演退出專案


  ，外傳《韓索羅》更是雪上加霜。這樣還不夠，連《冰與火之歌》也來星戰世界參上一咖


  。本來信心滿滿，想說比照Marvel帝國一般也來個多管齊下的作品轟炸，如今都得稍微緩


  衝一下。不過號稱要替新世代甚至舊世代「天行者傳奇」劃下句點的第九部曲《天行者的


  崛起》還是得如期推出，否則這個臉面不知道要往哪裡擱去。




  於是，《原力覺醒》的導演J.J. Abrams再次披掛上陣，緊急救火，從片名開始，希望從


  各方面挽回全世界星戰迷的信心。




  他很努力，畢竟他自己也是個不折不扣的死忠星戰粉。從他跟John Williams的互動就可


  以看得出來，這哪裡是一位導演和跟自己的配樂家說話，根本就只是一個遇到偶像的喜出


  望外小迷弟。




  說《天行者的崛起》是在擦《最後的絕地武士》屁股嘛，倒也不盡然是。其實很多在本集


  草草圓回來的故事與設定，多半都是在《原力覺醒》選擇了這個保守走向之後的命中注定


  。《最後的絕地武士》招致批評的一些詮釋，反倒不見得有造成太多的影響，甚至可以說


  ，把《最後的絕地武士》直接掠過也沒有什麼關係，因為《最後的絕地武士》其實並沒有


  真的將故事劇情推進什麼，它反而只是刻意地透過一些刁鑽的轉折，去給予新生代三位主


  角未來可以獨當一面的歷練，塑造他們成為年輕一輩英雄領導的說服力。對於原力的看法


  、英雄個人主義和面對失敗的教訓上，雖然有些過度刻意，令人有些難以接受，但其實宗


  旨並沒有脫離前作建立起來的核心精神。




  但也不是不能理解，當看到這位橫跨世代的英雄天行者路克的頹廢樣著實令人感到沮喪，


  而光速飛行切開空間的神風特攻隊犧牲戰法也是一種很難給後繼者接話的「創意」。




  為了安撫粉絲，《天行者的崛起》真的把《最後的絕地武士》棄如敝屣嗎？其實也沒有。


  人人皆可能有原力，不需要顯赫血統也可以是英雄，在星戰世界中本來就是一再強調的事


  情。走私販、傭兵、奴隸、風暴兵，人人都可以加入反抗軍，拯救世界。在《天行者的崛


  起》中依舊沒有拋棄這個想法，這個命題並沒有因為Rey竟然是白卜庭的孫女而失去，反


  倒是翻轉了血統的命定論，和Kylo Ren的掙扎剛好互為表裡。當然，Rey可以不是


  Palpatine，中心主旨依然成立，顯得這個設定並沒有它的絕對必要性。




  再者，若不是有之前的懊喪，當Luke以絕地英靈之姿颯爽登場之時，又怎麼能以頓悟的過


  來人身分同理並鼓勵正要放棄的Rey呢？




  當然，再怎麼以情懷服務老粉，總是很難被真正的滿足。因為每個人都已經有自己心中的


  一套「星際大戰就是應該怎麼樣」的成見。作為一個注定影響世世代代的次文化，加上堆


  積如山的周邊衍伸作品，這個系列作的話語詮釋權幾乎可說根本不在電影團隊的手上，即


  便他們可以拍出一部又一部的電影或其他影視作品，但只要繼續在舊有的元素上面打轉，


  販售情懷之餘，也是注定要被「人人心中都有屬於自己的星戰」給拖垮，不管是要守舊還


  是要革新、視覺特效再怎麼驚人，還是沒有辦法做到讓所有人都可以滿意。




  雖然有點踉蹌，如同新生代的幾位主角在電影中將自己搞得遍體鱗傷的冒險，《天行者的


  崛起》最起碼還是將新生代三部曲做了個結束，在一些情節的處理上也快速的向被《最後


  的絕地武士》激怒的觀眾道了個歉，包括了不要玩光劍、Leia接受過絕地訓練、Lando的


  畫龍點睛客串。Ren將頭盔修補好，彷彿也是在告訴觀眾，我們打算來修補大家破碎的內


  心喔。而有趣的是，不論是第八部曲還是第九部曲，總是有喜歡或討厭的觀眾粉絲們互相


  攻訐，有人說喜歡的都是腦粉，也有人說討厭的才是腦粉，打得比絕地和西斯之間還要凶


  狠。




  對個人來說，最完美的結局當然就是停留在《絕地大反攻》最好，前傳三部曲則是讓我們


  看到了舊共和的世界，對於新生代三部曲，自己當然也有屬於自己的一套想像，要說新三


  部曲的種種可惜之處，恐怕真的是三天三夜也說不完，只好夢想自己哪天擁有幾億美金，


  自己也來拍個三部曲來玩。但與其說新三部曲是星戰正史的延續，不如說是一眾後輩影人


  想盡辦法在向這個世界傾訴他們對於《星際大戰》的感情和對自己的影響，即便是導出《


  最後的絕地武士》的Rian Johnson，那也是他另一種對這套作品獻上的「敬意」，當然更


  別提J.J. Abrams了。當然你要說這一切只不過是萬惡米老鼠銅臭味的伎倆，也無法否認


  。但既然你我都已經不幸的成為了這個次文化的一員，能看到這個世界延續下去，或許過


  程中有好有壞，但無論如何，往事已矣，來自上一代傳奇的兩把光劍都已經深埋在這一切


  的起源之地，但這趟星際旅程，代表著新時代的Rey，還是會一直走下去。




  我們就好像C3PO最後的一趟冒險，看似悲壯的洗去記憶、犧牲自己、拯救世界，幸好最後


  還是能夠重拾往日的美好回憶，即便備份的記憶並不甚完整，有些殘缺，但無論如何，最


  美好的那段回憶總是永遠不會改變，好朋友R2D2依舊陪伴在我們的身邊，直到很久很久以


  前，那個遙遠的銀河系，那裡沒有影迷的內鬥論戰，只有正義的絕地武士和邪惡的西斯教


  徒之間的神聖戰役，一無所有的英雄們依賴著彼此，攜手奮戰，引領並守護著過去與未來


  的世代，有如一道劃破黑暗的希望曙光。








  --


  盧秀燕向前走得一步，噹的一聲，一個小瓷瓶掉在地下，

  正是顏清標投在她身上的，拾起一看，見瓶上寫著八個篆字：


  「谷關空氣，嗅之即解」。


  --'
