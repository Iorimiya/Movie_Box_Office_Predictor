url: https://www.ptt.cc/bbs/movie/M.1576571786.A.AB1.html
title: '[討論] 天行者的崛起第一波心得'
content: '以下天行者的崛起都用”天”簡稱

  渣翻有錯請指正


  Jake Hamilton

  “天”完全就是我想要的那種-前所未有的星戰電影。

  它既黑暗驚悚卻又美麗而令人充滿希望。

  作為三部曲的結尾又完美的為傳奇做個圓滿結束。

  我知道我沒法完整表達我的想法-但可以說這部電影讓我崇拜。


  Eric Eisenberg

  “天”有表現不錯的地方，但更多表現讓我失望。很多東西被放棄（這句不懂），

  給粉絲的福利沒做好，細節也有諸多缺失。這部無法令我滿意。


  The Brandalorian

  “天”拍得不錯。它格局龐大、充滿驚喜，就像路克天行者所言，超乎你的想像。


  Gregory Ellwood - The Playlist

  “天”裡我覺得最棒的就是Daisy Ridley做了最好的演出和給了核心老粉最想看到的東西

  真希望能再給JJ多一年做這部電影。


  Alasdair

  剛看完”天”的首映。Wow，這部片真是讓我又哭又笑。對一個老牌系列這個結局真是太棒了。

  感謝迪士尼邀請我和我媽前來觀賞。



  其他清一色都是好評自己看吧


  看來EP9很穩囉

  -----

  Sent from JPTT on my iPad


  --



  --'
