title: '[負雷] 星際大戰:天行者的崛起 Be with me.'
content: "網誌版: \n注意:網誌版會有令某些粉絲不滿的內容，請斟酌\n\n\n\n有雷。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n基於是一個同時接受EU也喜歡The Last Jedi的粉絲，要寫這篇真的是五味雜陳。並不僅\n\n僅是本傳的部分正式完結，這象徵一個時代的結束，與另一個新的時代的開始，而我們都\n\
  \n知道，粉絲之間的戰爭，如同西斯與絕地的鬥爭，是不會止息的。\n\n\n\n\n\n如果你討厭迪士尼與它的星戰作品，討厭最後的絕地武士，討厭Rian Johnson，真的，不\n\
  \n要留在這邊傷害自己。何必讓自己痛苦呢?你可以不喜歡一個作品，但是同時你也應該尊\n\n重其他喜歡同個作品的人；你可以批評，但切記保持理智。如果這一切不是你想要的，你\n\
  \n就詆毀、謾罵，你口中的不尊重成為你個人的行為，這才是對星戰的汙辱。星戰一直都很\n\n多元，在時代與環境的影響下發展出多采多姿的作品，學習接受與適度的批評吧。\n\
  \n\n\n看完「天行者的崛起」，在本質上是失落的，當晚我難以入眠，思考為什麼星戰能夠拍成\n\n這樣。\n\n\n\n做為一部星戰電影，也許它能夠算是合格；\n\
  \n但是做為一部電影，它完全不合格。\n\n\n這部電影真的能夠拍得更好一些。\n\n\n\n\n\n\n故事的主幹我反而能夠接受，串起TFA與TLJ，顯示芮的真實身分，誘導她到白普亭面前，\n\
  \n完成她的命運。但是節奏與表現手法令人嘖嘖稱奇，JJ不是沒有經驗的無名小導，本身也\n\n是個星戰粉絲，將畫面與劇情處理成這樣真的是壞了自己的招牌。也許如果放慢節奏，將\n\
  \n每段故事說好，修整那些支離破碎的對話，讓每個人物的轉變與新人物的特色顯露出來，\n\n電影大概會落在三小時左右，但是電影的體驗會優良許多(衷心希望可以出導剪版，光是\n\
  \n前面放慢速度，不要像跳入光速一樣一直催趕，就會好很多)。\n\n\n\n\n\n\n\n\n\n故事的一開始就以經典的黃字幕宣告西斯大帝的回歸。也許有人會認為只是在補救TLJ中\n\
  \n史諾克的死亡，硬是將Sheev Palpatine從死亡中拉回來。在EU的黑暗帝國(Dark Empire)\n\n中，白布丁死亡以後啟動了自己的複製人，只是TROS沒有解釋白普亭是怎麼活下來的，相\n\
  \n當可惜(或者是以西斯法術死而復生，他的肉體有縫合的痕跡)。迪士尼真的是拍一部規劃\n\n一部劇情嗎？我不太認為，甚至覺得他們在很早期就有相當的構架，但是在每次拍攝的時\n\
  \n候都有修改(而且喔對，GL應該都有參與劇本喔)，只是結果相當的…Original。\n\n\n\n\n\n\n\n\n凱羅在穆斯塔法找到了西斯尋路儀(Sith\
  \ Wayfinder)，來到西斯隱密世界：Exegol去面質\n\n理應死去的西斯大君。Exegol有著密布的雲層與似乎永無止盡的閃電，不知道是不是在致\n\n\
  敬舊共和中的西斯星球Dromund Kass(在Outer Rim，Exegol則是在未知領域)。從西斯聖\n\n殿與裡面的許多西斯雕像看起來(據說可能有Darth\
  \ Nihilus，但實在看得很不清楚)，也\n\n許是現在的正史中才設定出來的新星球吧，只是那個電梯向下的設計跟梯形建築真的很不\n\n搭嘎，明明最後還開了一個天窗。白普亭承諾給凱羅一隻大軍，只要他將芮殺掉，並告訴\n\
  \n了他芮的真實身分。\n\n\n\n\n\n\n\n這邊也提到”你腦海中的每個聲音都是我”，旁邊的生化艙裡飄著好幾個史諾克的身體。\n\n白普亭的存在可以解釋為什麼在TFA與TLJ拍完之後的周邊作品不太解釋史諾克到底是從哪\n\
  \n裡來的，只有TLJ的小說有提到史諾克曾是白普亭的下屬，從描述的方式來看似乎是不同\n\n人，當然也有可能是克隆體或是會使用原力但是被西帝輕易操縱的人。只是這點似乎不能\n\
  \n解釋TLJ中為什麼史諾克要芮死，真的要合理的話就是逼迫芮展現自己的實力(但是從TLJ\n\n的小說看起來史諾克是真的想殺了她，或是吃書)，這樣一樣會走到最後的路線。破土而\n\
  \n出的艦隊很有衝擊感，感覺西斯的資源很多，這樣還打輸真的是挺丟臉的….\n\n\n\n\n\n\n\n另一方面，芮在莉亞的指導下進行絕地訓練。芮喃喃自語be\
  \ with me，希望可以聽見絕地\n\n先師的教導，但很顯然沒用。訓練的過程中她心浮氣躁，被漂浮球痛宰，在一氣之下用隨\n\n身攜帶的長棍打爆了漂浮球。莉亞沒來由的要芮聽見什麼呢?絕地英靈的教誨嗎？即使呼\n\
  \n應了劇末的行動，這種毫無解釋的行為只是在破壞故事的節奏，算不上是埋梗。此時她將\n\n路克的藍色光劍交還莉亞，並研究路克搜刮來的古籍。波與芬恩經歷過一連串的冒險後成\n\
  \n功的得到了第一軍團內部間諜的資訊，不得不說lightspeed skpping特效看起來蠻刺激的\n\n，這個新的概念似乎也沒有引起老粉的不滿。接下來是三個人相聚後毫無必要的爭吵，沒\n\
  \n有埋下任何未來紛爭的種子，波跟芮之間也沒有任何的戰友火花，是一段拿掉也完全不會\n\n有影響的片段。間諜提供的訊息告訴我們再過幾個小時之後西斯的復仇軍隊將開往自由世\n\
  \n界大開殺戒，而西斯所在的星球Exegol的線索就這麼剛好出現在芮偷來的古籍中，而且路\n\n克也這麼剛好曾經去找了這個地方還留下了筆記？不管這個巧合，這也許暗示了我們路克\n\
  \n為了某個原因需要去Exegol，也許是為了文物，或是他感知到威脅需要做調查….芮堅持\n\n要獨自一人出發，這時莉亞又把路克的藍色光劍硬塞給芮，然後波一副沒事的樣子說我們\n\
  \n要一起出發。所以你們剛剛到底是在吵架三小?\n\n\n\n\n\n\n\n修好面具後，凱羅帶著Knights of Ren(目前漫畫中介紹到是一群至少有原力感知的集團\n\
  \n，首領自稱忍Ren，而Ren指的意思是光劍，只為了吞噬而生)回到旗艦上，鞋子沒清留下\n\n一堆泥土在地上，而且你們剛剛不是去了一個都是冰的星球嗎…. Boolio的頭被丟在桌上\n\
  \n(配音員是Mark Hamill喔XD)，忍憤怒的警告在他們之中有人是叛徒，還把一直碎碎念的\n\n將軍抓起來摔。赫斯敢開那個面具笑話真的是太有種了。\n\n\
  \n\n\n\n\n\nPasaana，沙漠星球。路克留下的最後線索指向這裡，絕地獵人帶著西斯尋路儀消失在這\n\n顆星球上。正巧他們遇上了42年一次的Aki-Aki祖先節，這個數字真是眼熟啊(棒讀)。這\n\
  \n邊表現比較好的地方是當地原住民的小朋友問芮她的姓氏的時候，她回答的那股笑容後面\n\n的落寞，點回了三部曲中最大的賣點：她到底是誰?這個時間點光明與黑暗之間的連結突\n\
  \n然開啟，凱羅嗆聲要芮加入他，還搶了心上人(X)的佛珠以便知道她的位置，不愧是跟蹤\n\n狂。我不是很愛Reylo所以…從第七集凱羅便一直要芮加入他，不僅看出她過人的內在力\n\
  \n量，也是從兩人的童年喪失中有所連結，幾次機會下凱羅都不願意痛下殺手。接下來遇見\n\n藍道(要藍道自己去見莉亞的那段話挺棒的，也是促成藍道回歸的主因)，用偷來的載具進\n\
  \n行逃亡(致敬EP 1的峽谷追逐)，they fly now的笑話真的不應該放在預告裡。被炸進流沙\n\n裡後這麼恰巧他們就找到了有西斯標誌的載具與絕地獵人的屍體。就一個隱藏在未知領域\n\
  \n的前任皇帝來說，派一個殺手搭著有西斯標誌的飛行車還真是低調啊。不論如何他們很快\n\n地找到了一把西斯匕首，卻在同時遇見了一隻受傷的大蛇，而擁有聖母光環的芮也很快跑\n\
  \n上去幫大蛇療傷(對，她不知道怎麼發現對方受傷，原力還強到可以轉送生命給對方)。\n\nForce healing並不是一個新的概念，但是能夠這樣直接復原傷口到近乎原貌?這種超級破\n\
  \n壞設定的能力怎麼沒有看到老粉出來嘴?西斯匕首上的文字雖然C3PO可以翻譯，但是它的\n\n系統被鎖住所以無法說出來?連導演都透過波的嘴吐槽，這樣的設定真的超級沒必要，只\n\
  \n是為了將主角群帶往下一個星球而設立。逃出地下洞穴後，找到了絕地獵人的飛船，芮卻\n\n在這時候感應到了來襲的威脅，獨自一人面對開著Tie whisper的最高首領凱羅‧忍。於\n\
  \n是就有了第一個預告精彩的後空翻，芮斬傷戰機讓凱羅化成火球。同時在船上東翻西找的\n\n眾人派邱仔來叫芮，然後邱仔就被出場時自帶環繞效果的忍武士團給抓走了?沒有經過任\n\
  \n何打鬥?而且他身上剛好有西斯匕首?誰來告訴我這部電影的巧合為什麼這麼多?為了拯救\n\n邱仔，凱羅與芮兩人用強大的原力拉扯小型的運輸艇，害怕再一次失去家人的芮，失控且\n\
  \n無意識的使出了原力閃電。小型運輸艇爆炸，芮痛徹心肺的尖叫聲真的很令人難過，當下\n\n我也無法置信元老級的角色便當領的這麼不值錢。凱羅似乎也震驚於芮的力量，就這樣放\n\
  \n她離開。\n\n\n\n\n\n\n\n搭乘被遺棄的船離開，以為他們已經失去了所有的希望，這時突然發現C3PO記得匕首上所\n\n有的西斯銘文，於是決定前往Kijimi去找專家破解C3PO身上的限制。這時畫面帶到他們從\n\
  \n小行星帶離開，另一艘船也跟蹤著他們，很明顯是跟忍武士團一樣型號的船。然後忍武士\n\n\n團在Kijimi上還找不到這些抵抗軍的位置？就叫你們不要戴面具跟頭盔了吧。他們很快地\n\
  遇上了Zorii Bliss(蠻喜歡她的造型設計)，她不僅是波的舊識，還供出了波的過去：原\n\n\n來他不只是反抗軍飛行員的後代，還是一名香料走私客(然後就一直被嗆XD)。進酒吧後的\n\
  \nbartender是John Williams應該就不用多說了。\n\n\n可愛的小外星人Babu告知說解開限制器的代價是wipe out C3PO的所有記憶，帶出了C3PO\n\
  \n跟大家說「看朋友最後一眼」的橋段，實際上是在跟粉絲說這個系列的完結(至少是\n\nSkywalker Saga)。喪失記憶的梗我覺得用的並不好，即使能夠帶出後來的笑話，很明顯\n\
  \n只是要短暫的賣情懷。翻譯西斯語言時臉部的顯示器變成紅色也是，迪士尼擅長的預告詐\n\n欺。波與Zorii明顯有一段情過，Zorii拿出第一軍團的上尉勳章，希望波跟她一起離開，\n\
  \n不過最後還是將勳章送給了波，以讓抵抗軍能夠順利的逃亡。芮此時感應到邱仔還活著(\n\n令人開心!)，於是大家很歡樂的就決定用勳章偷渡進第一軍團的星艦裡。上船後分頭找邱\n\
  \n仔，芮再度感應(已經第三次了)到西斯匕首與維達的頭盔，因此他們分頭進行。芮在跟蹤\n\n狂的房間找到了他阿公的面具，還有匕首。她從匕首上看到了她的父母被絕地獵人殺死。\n\
  \n此時私人聊天室又開啟，凱羅說了在Pasaana上是想要逼迫她，還有他從沒有告訴過她謊\n\n言(就算有，凱羅也不知道，而且使用黑暗原力的人說謊是很正常的)。他們倆在妖精打架\n\
  \n(X)的時候還不小心打爆了放阿公頭盔的櫃子，這時凱羅才知道他心儀的女子竟然在他房\n\n間裡亂晃!(還偷東西，壞壞)\n\n\n\n\n\n你知道嗎？我覺得光是寫下故事到這邊本身就是一種吐槽。\n\
  \n邱仔一行人沒有成功逃離，被忠誠將軍抓到，沒想到要被槍斃的時候，拯救他們的人竟然\n\n是–赫斯!這位甘草人物一開始就很小屁孩、納粹、自視甚高，但老實說，比起凱羅時常\n\
  \n不連貫的情感表達，他的始終如一反而討人喜歡一點點。他的背叛令人意外，而且理由幼\n\n稚到不科學：他沒有要幫助抵抗軍，只想要看到凱羅‧忍的失敗!三人奪回千年鷹號，剛\n\
  \n好趕上凱羅與芮在甲板上的對峙。原來，芮是白布丁的孫女，芮不僅不是無名小卒，身上\n\n還留著西斯大帝的血脈(棒讀)!真的是太令人吃驚了(棒讀)!從很久以前就有人提出Rey\n\
  \nPalpatine的理論(雖然大家比較喜歡Rey Kenobi)，而且據說芮是瑪莉蘇的聲浪在這個事\n\n實呈現後大幅減少。然而即使她來自於Sheev Palpatine的血脈，也無法解釋她如何能夠\n\
  \n無師自通使用mind trick，Force healing，反向入侵凱羅的腦海….她的這股raw power\n\n甚至比天行者的直系子孫還強。令人存疑的是老白的身體，就算從死亡中復活，似乎也年\n\
  \n紀大到不適合生育(當然談科學在星戰裡本身就是件不科學的事)，就算能夠生育，就Rey\n\n的父母是nobody來看，留下不會原力的後裔對白布丁沒有用，除非他早就透過vision看到\n\
  \nRey的到來….凱羅也提到他們是原力的二元體(dyad)，而迪士尼似乎打算用這個類似\n\nForce bond的新設定來解釋一切。Force bond夠強的話，的確可以從別人腦海中獲取資訊\n\
  \n，甚至可以強灌語言進去(Mighty Revan!)，Meetra在接受Kreia的訓練時也常常有Kreia\n\n身在遠處教學但是有如面授一般(空、空中大學?)。如果將這個能力延伸，那兩人輕易的\n\
  \n被連結，芮從凱羅的腦海學會如何mind trick與其他的原力知識，跨越時空感受到對方的\n\n環境與直接光劍對決….這些以往被視為不合理的關鍵點，突然間迎刃而解。\n\
  \n\n\n以下是我的推論，畢竟普通的Force bond再怎麼強也不可能隔空取物，順手的程度簡直就\n\n像自己的左手拿給右手一樣。所以，如果他們根本不是兩個人，而本來是一個人呢….?無\n\
  \n\n論是什麼宇宙的力量促成安納金‧天行者的誕生，都是為了要平衡巨大的黑暗，而這就是\n\n盧卡斯的中心思想，也是為什麼安納金必須要死亡的原因。有人提到盧卡斯說光明打敗黑\n\
  \n暗就是原力的平衡，這似乎與他說過的話互相矛盾。以下摘錄自2002年時代雜誌:\"I\n\nwanted to have this mythological\
  \ footing because I was basing the films on\n\nthe idea that the Force has two sides,\
  \ the good side, the evil side, and they\n\nboth need to be there. Most religions\
  \ are built on that, whether it's called\n\nyin and yang, God and the devil—everything\
  \ is built on the push-pull tension\n\ncreated by two sides of the equation. Right\
  \ from the very beginning, that was\n\nthe key issue in Star Wars.\" 有光明，必要有黑暗，路克也曾經提到:\
  \ powerful\n\nlight, powerful darkness，唯有兩者皆存，才能達到平衡。\n\n隨著西斯大帝在ROTJ的殞落，真正擊敗白普亭而轉向光明面的安納金就此死去，這本來應\n\
  \n\n該是征戰的結束，但是你知道嘛，這個IP總要延續下去，於是就有了皇帝複製人與復活的\n\n戲碼，因此EU的存在本身就已經否定了盧卡斯的意志….或者你也可以說，畢竟Chosen\n\
  \nOne這個概念的出現其實比較晚，盧卡斯藉由前傳三部曲否定了很多EU裡面的內容，畢竟\n\n看起來發生在ROTJ之後的故事根本不符合他的精神。\n\n\n\n\
  \n\n\n回到TROS，在這部電影中常常可以看到一些Dark Empire的影子，因此如果白普亭沒有死\n\n，或是他忠心的追隨者利用西斯法術將他復活，必然要有巨大的光明來阻止他，但是那股\n\
  \n光明已然死去….於是神秘的宇宙力量不知怎麼的一分為二(也許維達的黑暗與光明兩者皆\n\n仍然存在?)成了原力的二元體，也就是班‧索羅與芮‧白普亭。諷刺的是，光明寄宿在黑\n\
  \n暗面的血脈中，而黑暗則存於帶來光明的天行者身體裡。\n\n\n\n凱羅再度地邀請芮加入他，芮也再度拒絕，並搭乘千年鷹逃跑。得知了自己的真實身分，\n\n芮喃喃自語地說著她要殺了白普亭，這裡是少數芮展現出接近黑暗面的地方，也是我覺得\n\
  \n很可惜可以做更好的地方。芮在後傳三部曲幾乎沒有接近黑暗的時刻，即使在TLJ她在島\n\n上直直落入黑暗面，也沒有什麼跡象或暗示她會靠往黑暗面，只能說她單純地被吸引。這\n\
  \n一點非常可惜，浪費了她是白普亭後裔的設定。回到艦上，普萊德殺死了赫斯，結束他渺\n\n小可悲的一生。\n\n\n\n\n\n\n抵抗軍隨著匕首的指示來到Kef\
  \ Bir，Endor的衛星，也是第二死星墜落的地方。不得不說\n\n那把西斯匕首拿來找尋路儀的方式也太奇葩，看起來不是古物，應該就是西斯大帝派人做\n\n的…最好是有人記得那個形狀啦。看起來絕地獵人當初也身負著要去回收西斯尋路器的任\n\
  \n務?Anyway他們在降落時遇到了本作最沒有必要存在的新角色珍娜，前任暴風兵，拒絕屠\n\n殺平民而叛逃到此地。在修船的時候芬與珍娜述說彼此的故事，當芬提到「那是一種感覺\n\
  \n」，那個誇張不切實際的演技，搭配後來導演說他沒有講出口的話是他是一個原力敏感者\n\n，讓這個角色徹底的失敗。就在大家開心修船的時候，發現芮不見了，她一個人開著划艇\n\
  \n去找尋路儀。\n\n\n\n\n\n\n西斯尋路儀的位置在大家很懷念(X)的王座廳旁，有一個寶物庫。很可惜沒有多帶一點畫\n\n面，看寶物庫裡面是不是有其他的西斯神器，只有剩下的一個尋路器。無論如何，這裡的\n\
  \n黑暗原力必然十分強大，因為芮遇見了一身黑袍的自己，拿著紅色雙刃光劍向她發動攻擊\n\n。”Don’t be afraid who you are.”，再再提醒芮的血脈是來自強大的西斯，她不能\n\
