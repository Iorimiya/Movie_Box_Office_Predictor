url: https://www.ptt.cc/bbs/movie/M.1473844737.A.E7D.html
title: '[ 好雷] 使徒行者 看演技派飆戲就是爽'
content: '有雷







  小弟我沒看過港劇版 所以是一無所知的狀態下看到三大男星登場就去看了


  果然不會失望


  要我說這部戲的節奏分兩部份 而且我覺得還蠻大差別的


  先說說第一段比較輕鬆的是開始到阿丁被爆頭


  第一段給人感覺很中資的場面


  跑車飛車追逐阿 大樓爆破綁架 高科技辦公室


  大量的大樓遠鏡頭


  然後開始介紹一些背景


  剛開始覺得有點普普通通


  因為沒什麼港味


  不過吳鎮宇不愧是影帝


  氣場整個hold住


  他跟佘詩曼的互動有趣又自然


  以扮演承先啟後的重責大任來說算ok




  到了第二段我們的歡喜哥出場


  就很有濃濃的港味了


  整個劇情峰迴路轉


  古天樂張家輝 不斷的猜疑試探對方 大量的計中計兄弟情


  演技 劇情 都很不錯


  尤其是張家輝在運動場那邊用開槍打摩斯密碼那神情


  還有古天樂為了女兒要自殺


  堪稱全場兩大最帥moment


  這段主軸回到港片拿手的臥底兄弟情戲碼


  真的演繹的很好


  個人認為這部片比韓戰好看


  最後要提一下許紹雄不愧是老演員


  把皮笑肉不笑演的真是經典


  劇情 演技 都是一等一的


  90年代那派的香港演員真的很會演阿


  看他們飆戲就是爽









  --'
