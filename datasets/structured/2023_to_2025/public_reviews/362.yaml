url: https://www.ptt.cc/bbs/movie/M.1476527473.A.CD6.html
title: '[普雷] 使徒行者 '
content: '使徒行者，是從TVB使徒行者劇集延伸而來。劇裡的情節曲折離奇，所以，

  最後對劇的印象就是一堆臥底，搞不情究竟才誰才是真的！我喜歡電視劇裡

  的丁小嘉(佘詩曼飾)和薛家強(林峯飾)之間的火花，二人看似黑社會裡的小

  人物，其實，搞了半天才發覺彼此都是臥底。香港影視界自無間道之後，臥

  底角色充斥於警匪動作片中，原因無他，因為這具有莫大的戲劇張力！能夠

  讓演員戲中有戲，考驗的是演員的功力，也讓觀眾過足了癮。



  在電影版中，找尋失聯臥底警員的任務縮減成一人(電視劇中要找五位臥底

  警員)，但這一人究竟是阿藍(張家輝飾)還是少爺(古天樂飾)則是讓觀眾猜

  測不已。電影版其實保留了原女主角的性格，但其他對戲的男主角幾乎全換

  了人，其角色性格自然也是從無生起、無從比較。由電視劇引來的觀眾所期

  待的熟悉感尚存，但卻又相對地十分陌生，這究竟是好或是不好呢？此外，

  鋪陳的重點也從男女CP臥底轉成了矛盾的兄弟情，這也是一大特點。



  對我來說，使徒行者電影版，就宛如是個全新的故事，好看刺激，動作場面

  浩大，爾虞我詐十分精采。但是，看到尾時，實在有點混亂，因為好多人都

  在詐死，又活過來。歡喜哥活過來，丁小嘉也活過來，一堆人死了卻又活了

  ，害我到最後都認為"假的，你的眼睛業障重！"是這片的好註解，因為主角

  威能讓角色不斷地死而復生。所以，直到現在，我都認為阿藍和Q sir(吳鎮

  宇飾)會再次復活啊(如果有拍續集的話)！


  --'
