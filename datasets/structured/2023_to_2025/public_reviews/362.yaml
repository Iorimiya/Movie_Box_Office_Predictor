url: https://www.ptt.cc/bbs/movie/M.1585815521.A.302.html
title: '[好雷] 索命條碼 Repo Men - 當執行者變成被執行人'
content: '「當你繳不出車貸，銀行就收回你的車子；當你繳不出房貸，銀行就收回

  你的房子，那假如你繳不出人工器官的貸款呢？那就輪到我們了」


  電影開頭就很快速的交代了時空背景，一個人工器官盛行的年代，人們不

  在需要遙遙無期的等待器官捐贈，只要花錢明天你就是一個健康的人了。

  唯一的缺點就是人工器官的價格非常昂貴，多數人也只能貸款購買，而有

  人貸款，就一定有人還不出錢，因此追討人的工作應運而生。


  本片其實就是很典型的殺手被追殺類型的片，不意外的主角雷米（）

  是最優秀的追討人，跟他情同手足的好友傑克（佛瑞斯特惠特克）一同搭

  檔，然後接下來的劇情就也很不意外，意外發生，雷米也變成了器官奴，

  ，執行人淪落為被執行人的他，再也無法追討那些跟他同病相憐之人，因

  此決心反抗的的故事，細節就請去看電影吧。


  值得讚蓄的是，本片的世界觀建構十分完善，或許是因為這樣的系統早就

  在人類世界實行多年了，只是本片以更直觀的角度提出來檢視，並藉此鼓

  勵觀眾去思考系統、執行人與被執行人三者的關係。


  ----------------------------------------------------------------


  話說這部片其實還蠻好看的，為什麼在板上連一篇都沒?


  --

  我還蠻喜歡這樣的結局


  有呼應到之前埋的梗


  也很現實


  現實中每個人都想FUCK THE SYSTEM


  但事實是SYSTEM FUCK YOU EVERYTIME'
