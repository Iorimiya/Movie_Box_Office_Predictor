url: https://www.ptt.cc/bbs/movie/M.1578928208.A.F85.html
title: '[新聞] 1917踹天行者登北美票房冠軍 金球獎光環'
content: '1917踹天行者登北美票房冠軍 金球獎光環有保庇



  （中央社洛杉磯12日綜合外電報導）環球出品的戰爭劇情片「1917」在金球獎加持下，在

  北美票房登上榜首大位，據「北美院線聯盟」今天通報的數據，1917週末海撈約3650萬美

  元。


  1917撂倒迪士尼「STAR WARS：天行者的崛起」（Star Wars: The Rise of Skywalker）

  ，把自去年12月首映後即霸占北美票房龍頭寶座的天行者踢至亞軍位置。這部星戰完結篇

  本週末有1500萬美元進帳，國內總收入來到4億7800萬美元，全球票房僅略低於10億美元

  大關。


  1917於本月5日舉行的金球獎頒獎典禮上爆冷贏得劇情類最佳影片大獎，擊敗事前獲獎呼

  聲最高的「愛爾蘭人」（The Irishman）和「婚姻故事」（Marriage Story）贏得殊榮，

  導演山姆曼德斯（Sam Mendes）同樣獲得最佳導演獎肯定。


  排名第3的的是上週排名第2的索尼動作續集片「野蠻遊戲：全面晉級」（Jumanji: The

  Next Level），10日至12日有1400萬美元表現。


  排名第4的有兩部作品，分別為派拉蒙的「姐妹老闆」（Like a Boss）和華納兄弟的「不

  完美的正義」（Just Mercy），各進帳1000萬美元。


  排名第6到第10的電影依序為：「她們」（Little Women），770萬美元；「深海終劫站」

  （Underwater）700萬美元；「冰雪奇緣2」（Frozen II），580萬美元；「鋒迴路轉」（

  Knives Out），570萬美元；「變身特務」（Spies in Disguise），510萬美元。


  （譯者：蔡佳敏/核稿：陳政一）1090113



  新聞網址：





  --'
