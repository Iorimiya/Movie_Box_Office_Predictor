url: https://www.ptt.cc/bbs/movie/M.1576942257.A.5E1.html
title: '[好雷]《星際大戰9：天行者的崛起》別懼怕最真實的自己'
content: '以下有雷


  圖文好讀版：






  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  《星際大戰9：天行者的崛起》是一部美國科幻冒險電影，由JJ亞伯拉罕執導，亞當崔佛


  、黛西蕾德莉、約翰波耶加、奧斯卡伊薩克主演，劇情講述在路克天行者以自己生命拯救


  反叛軍的一年後，殘存的抵抗勢力將再次面對第一軍團，同時，絕地武士的最後希望芮和


  繼承黑武士血脈的凱羅忍，在得知西斯大帝白卜庭重新歸來，準備統治整個宇宙的計畫之


  後，準備以自己的方式，將上個世代所對他們造成的影響和矛盾做個了結。




  不知道從什麼時候開始，與其說星際大戰是有著迷人世界觀的系列電影，我更把它視為只


  要上映就必須進場朝聖的信仰。1977 年第一部星戰電影《星際大戰四部曲：曙光乍現》


  到現在已經過了 42 年，期間靠著包含外傳的這 11 部作品，還有其他周邊影集、漫畫、


  遊戲、小說，共同組成了這個極具影響力，只要把名字亮出來，任何電影都必須讓它三分


  的偉大帝國，而作為階段性任務的結束，《星際大戰9：天行者的崛起》究竟表現如何？




  在迪士尼收購盧卡斯影業之後，便決定在原有路克天行者與黑武士達斯維德的故事架構上


  創作出新的三部曲，不僅延續了舊有故事的主題，讓影迷能在多年後重溫自己當初熱愛的


  經典系列，以芮和凱羅忍這兩位新世代人物作為正反派的代表，更承襲過去幾位舊有角色


  經歷冒險後內心成長的精神，為星戰電影做出能讓人感受到創新與誠意，甚至可以說是發


  揚光大的詮釋。




  或許《星際大戰7：原力覺醒》、《星際大戰8：最後的絕地武士》兩部作品的評價都趨於


  兩極，都各有不同的觀點，但也不可否認，無論是導演 JJ 亞伯拉罕以《原力覺醒》以芮


  和凱羅忍兩人的愛恨情仇塑造了整個三部曲的整體架構，或者雷恩強生顛覆原本觀眾對故


  事的猜想，重新定義了星戰的價值，探討原力最根本的核心，我認為都讓整個系列比起過


  去六部本傳作品，有著更深入且更進一步的故事內容。




  而就如同前面兩集都有各自不同的毛病，《星際大戰9：天行者的崛起》不意外的也是如


  此。電影前段不僅節奏過於快速而導致敘事混亂，就劇情本身而言，完全複製過去遭遇某


  項威脅，必須前往某處找到某樣東西，在過程中又因為陷入瓶頸而必須先去找某人打探情


  報，直到最後才終於能夠進入「電影主題」的故事結構，這作為一部冒險電影當然沒有問


  題，事實上這本來就是好萊塢的老套路，但若是要為系列做結尾，這種廉價的編排方式也


  不禁讓我產生自己看的究竟是「首部曲」還是「最終章」的懷疑。




  但即便如此，作為星際大戰《天行者傳奇》的第九部曲，同時也是最後一部作品，《星際


  大戰9：天行者的崛起》確實透過人們對這個系列的認識與喜愛，把橫跨三個世代的天行


  者故事做了完整的起承轉合，為這段追夢和尋求自身認同、肯定與價值的旅程劃下完美的


  句點。




  就我個人而言，其實非常欣賞《最後的絕地武士》帶著影迷走向逐漸崛起的新時代，透過


  芮和凱羅忍遊走在光明與黑暗兩面，還有背後靈魂人物路克天行者內心掙扎與最後獲得救


  贖的過程，以許多讓人無法預料的劇情反轉帶出全片關於「原力的根本價值」和「必須拯


  救我們所愛」的中心思想，而《星際大戰9：天行者的崛起》同樣也跟隨著前面兩集的主


  題，並且把概念做了更完整詳細的延伸。




  儘管電影前段故事差強人意，但不可否認它還是達到醞釀、鋪陳西斯大帝白卜庭陰謀的目


  的。我很喜歡片中莉亞在芮準備離開時，叫她：「不要懼怕最真實自己。」的橋段，事實


  上這不僅為電影後段芮和凱羅忍兩人內心掙扎與轉變埋下伏筆，更是完全貫穿了整個新三


  部曲關於「天行者家族」、「絕地武士」、「光明與黑暗」，還有「原力」的故事主軸。




  從上集解鎖原力「私聊功能」開始，芮與凱羅忍的正邪掙扎和兩人的關係變化無疑變成所


  有影迷最關注的重點。身為天行者家族的凱羅忍（班索羅），因為路克的失誤而被西斯誘


  惑走向黑暗，雖然內心仍保有一絲良善，但被曾經最信任師傅背叛的憤怒，仍讓他極力抗


  拒成為一位絕地武士，因此在《原力覺醒》他便試圖以弒父來讓自己完全墜入黑暗，只不


  過無盡的燒殺擄掠非但沒有讓自己變得更壞，抗拒自己「善」的本質反而使他內心變得更


  加空洞，而更不巧的，唯一願意跟他談心的人還處於他的對立面，多麼的孤獨無助。




  而有趣的是，芮則正好跟凱羅忍相反，身為白卜庭家族的她原本註定要身處黑暗的命運，


  卻因為父母的選擇和犧牲，並在身邊許多人的陪伴和從旁引導之下，一路上對抗黑暗誘惑


  與對自己身世的懷疑，最終儘管得知背後隱藏的驚人真相，但依然能跟隨著內心最原始的


  善良本質。




  《星際大戰9：天行者的崛起》的高明之處，正是讓陷入自我認同矛盾，在光明與黑暗兩


  者之間掙扎的兩個人，重新回到自己心中最難以跨過的那道檻，無論是芮面對父母拋棄她


  的真相，內心產生必須為他們報仇的憤怒，或者凱羅忍重新審視自己當初殺死父親來走進


  黑暗的決定，內心感到無比的羞愧和悔恨，都以此體現人的多元複雜，並沒有絕對的善惡


  與正邪。




  就如同系列不斷強調「原力的平衡」，光明與黑暗的此消彼長一直都存在我們心中，重要


  的並不只是我們過去的所作所為，而是現在能否正視最真實的自己，不被一時的仇恨和衝


  動影響，做出符合我們內心真正所希望的選擇。到頭來，《星際大戰》這個集結所有帥、


  潮、酷元素的虛構太空歌劇電影，其故事核心講的其實還是最貼近我們的人性，告訴觀眾


  該如何面對生命中無數的挫折和阻礙，我想這就是這部作品最迷人的地方。




  或許有些人會認為《星際大戰9：天行者的崛起》打臉了上集「只要有心，人人都能擁有


  原力」的設定，認為芮是因為白卜庭後代才會如此強大，並對無名小卒終究沒有資格使用


  原力而暗自竊喜，從表面來看這似乎非常合理，但事實上卻完全不是如此。原力固然有無


  限潛能，但看完這三部曲，我們不仿回頭思考原力的真正存在價值與其代表意義，是只能


  讓人靈活使用光劍、隔空取物、勒脖子、放閃電這麼膚淺？又或者是當一個人充滿自信，


  深信自己能達成某項挑戰時，內心所展現出來的堅定意志？




  就如同：「人們聚集在一起的力量，總是比一位單打獨鬥的英雄要更強大。」這一直都是


  每部星戰電影想跟觀眾傳達的中心思想，片中芬恩和波總是知道自己目標方向的「感覺」


  何嘗不也是一種原力？我能在《星際大戰9：天行者的崛起》清楚看見導演 JJ 亞伯拉罕


  嘗試在所有角度尋找一個平衡點，完整詮釋那句：「願原力與你同在，直到永遠。」所做


  出的努力，配上亞當崔佛、黛西蕾德莉兩位演員精彩的表演，呈現角色內心複雜情緒，讓


  整部電影具有相當紮實的情感重量。




  雖然隨著天行者故事告一個段落，我們也到必須跟《星際大戰》道別的時刻，但在這強調


  意志和精神傳承的故事中，我們似乎也能在完結的同時，感受到這段傳奇還不斷在延續，


  甚至是以另一種形式存在我們心中的狀態。我想到了現在這個階段，迪士尼是否還會拍續


  集？會選擇怎樣的主題？芮會不會再度登場？對我們來說應該都不再是重點，我想更應該


  回顧自己在這三部，甚至是九部電影裡得到多少感動與啟發？




  就像是從《原力覺醒》、《最後的絕地武士》到《天行者的崛起》象徵了不管經過多少世


  代更迭，原力的本質都不會消減改變，而星際大戰本身所具有的魅力和地位，粉絲們熱愛


  星戰，帶著這份心意進場朝聖的動力同樣也永遠不會被時間給沖淡消失。



  --


