url: https://www.ptt.cc/bbs/movie/M.1666096980.A.472.html
title: '[新聞] 《孫行者傳》聚眾神 如東方版《雷神索爾》'
content: "《孫行者傳》聚眾神 如東方版《雷神索爾》\n\n2022/10/18 05:30\n\n\n《孫行者傳》動畫團隊對片中眾神形象非常考究。（數位領域電影文化提供）\n\
  \n〔記者鍾志均／台北報導〕3D動畫電影《孫行者傳》講述孫行者隨師父唐三藏一行人前往\n西方取經的故事，其中孫悟空大戰牛魔王的場面，讓導演莊家修費盡心思，最後呈現出孫\n\
  悟空和豬八戒、沙悟淨與神佛聯手對抗牛魔王的畫面，宛如東方版《雷神索爾》，眾神齊\n聚震撼人心。\n\n片中孫悟空和牛魔王首戰就化身成各種鳥類進行激烈空戰，各自變為天鵝、海東青、黃鷹\n\
  等，莊家修感謝大師杜篤之領軍的配音團隊，「配音師花很多時間從他們的聲音資料庫搜\n尋各種鳥類叫聲，一一修改製作後再混音，製造出緊張爭鬥的氣氛。」\n\n電影中眾多佛兵天將從四面八方包圍牛魔王，在3D畫面上氣勢十足，莊家修希望讓孫悟空\n\
  經歷死亡的氣息後再重生，以此彰顯他一心想保護師父到西方取經的強大意念，也是本片\n想傳達的訊息『永不放棄』。」《孫行者傳》全台上映中。\n\n--\n佛教經典的\n\
