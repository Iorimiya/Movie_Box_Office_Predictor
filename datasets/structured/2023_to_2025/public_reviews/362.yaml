url: https://www.ptt.cc/bbs/movie/M.1473847756.A.BCA.html
title: '[普雷] 嗑電影--使徒行者'
content: '~~使徒行者：滿出來的義氣！~~

  "康氏密碼"

  .

  整部電影充滿兄弟的義氣！

  滿到溢出了銀幕了！！！

  然後呢？

  就沒有然後了…

  .

  圖文護眼版或其它電影，歡迎上：


  .

  這是一部2014年的港劇所衍生出來的電影，

  我本身是完全沒看過這部電視劇啦，

  看的時侯沒有因此而有違和感，

  就是一部獨立的電影，

  就算沒看過電視劇也是可以輕鬆完食的喲！

  整部片的節奏很明快，

  劇情也有做到一定程度的峰迴路轉，

  雖然，個人覺得吳鎮宇這個角色有些被浪費了，

  但是整體來說，成績還算中上了，

  娛樂姓也不差，就是角色的深度比較淺了一些，

  最後一場兄弟倆一起對抗反派那邊，

  有滿出來的義氣感，

  前面的時間，似乎就是一般的警匪電影了，

  沒有辦法在臥底這一塊再創下更高的高峰了，

  不想拿它跟無間道比，

  因為整體的層次還是有些差異在的~~~

  .

  古天樂、張家輝、吳鎮宇

  三位都是有一定演技的硬底子演員，

  在銀幕上看到三位的演出，

  真的還蠻過癮的，

  但是礙於編導沒有把整部片的層次再拉高一層，

  所以他們的演出真的有點浪費了…

  幾場情緒轉折戲，他們的表現都不錯，

  真的是可惜了~~~

  .

  飾演小英的中國女星張慧雯還蠻正的，

  一整個就是我的菜XD~~~！


  --

  Sent from my Windows


  --'
