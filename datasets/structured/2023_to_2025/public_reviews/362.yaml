url: https://www.ptt.cc/bbs/movie/M.1473947732.A.89F.html
title: '[好雷] 使徒行者──走在道德線上的人'
content: "網誌版: \n\n\n\n======內文談及部分劇情，請自行選擇是否繼續觀看========\n\n\n\n上個月底應華映娛樂之邀，搶先看了這部由2014年香港TVB電視台同名港劇改編的電影。\n\
  因\n為又是衝著卡司去的，對故事背景完全不清楚，也不願冒著踩雷的風險去查，因此觀影時\n內心驚呼連連，既震懾於飛車爆破槍戰都來的大場面，也被片中性格鮮明的角色所吸引。\n\
  \n\n導演敘事的手法頗為明快，事件的發生幾乎讓人目不暇給，即便努力邊看邊動腦，也還是\n被劇情推著走，到走出戲院才有時間細想那些出乎意料的情節，也因此後勁十足，餘波蕩\n\
  漾，在心裡牽扯著漣漪。\n\n就我個人來說，這種狀況說明這部片是成功的。\n\n有些意外的是上網一查，評論反而是貶多於褒，有批它走不出港產警匪片老梗，沒有開創\n\
  新格局的；有批它基情滿滿、刻劃兄弟情匠氣太重的；有批它為翻轉而翻轉，轉折太牽強\n的；有批它結構鬆散、節奏慢，走不出電視劇框架（導演是原劇監製）的...\n\n\
  這時我不禁暗自慶幸，自己看的同類電影不多，還不至於看到同一種套路同一批演員就生\n膩，因此能夠單純地樂在其中。不過有趣的是，批評歸批評，火紅的票房還是證明它對觀\n\
  眾有一定的吸引力，至少就氛圍與角色的塑造、演員的表現、對動作戲的掌控等方面，編\n導有交出一定的成績，就一部娛樂商業片來說，或許這就夠了。\n\n在寫這篇文章前，我先將網路上找得到的影評看了一輪，關於拍攝手法、劇情佈局等，已\n\
  經很多人談過，太專業的幕後製作我也不懂，因此就只來談談這部片給我的一些感觸。\n\n一直覺得比起抬面上光明正大的黑白火拚，隱身暗處的警方臥底更為可憐。不只因為他們\n\
  被迫跟著殺人放火、隨時都要小心身份曝光、若知曉內情的人不在，清白也就跟著沉入海\n底，也因為若要順利完成任務，他們就得設法博取對方信任，這份「信任」固然讓他們做\n\
  起事來更方便，卻也如一道沉重的枷鎖，將他們鉗制在巨大的歉疚與自責之中。\n\n我原以為電影是電視劇的濃縮版，還興沖沖地去查港劇的演員陣容，想知道飾演三大男主\n\
  角的是誰，想不到除了佘詩曼飾演的丁小嘉與許紹雄飾演的歡喜哥，其他包括男主角在設\n定上全與電影版不同，講的也是幾乎獨立的故事，只有故事的骨架沒變──\n\n總督察康道行在黑道裡安插了五名臥底，在他離奇墜樓身亡前，將他們的資料悉數銷毀。\n\
  港劇版已找到這五名，電影版中，卻發現還有一名代號「Blackjack」的臥底，吳鎮宇飾\n演的刑事情報科主管Q Sir就要與前述的五名臥底之一丁小嘉（綽號阿釘）一起找出這第\n\
  六名臥底。但在追查的過程中，發現犯罪集團中的二名重臣──藍博文（張家輝飾）與邵\n志朗（古天樂飾）都有可能是「Blackjack」。究竟真正的臥底是誰？\n\n\
  劇名中的「使徒」與「行者」，分別指基督教與佛教中的「教徒」，暗喻「背負使命、傳\n遞訊息的人」；而英文名「Line Walker」，則是指「走在線上的人」，至於這條線所在\n\
  的，是善惡與黑白邊緣，還是人與野獸的分界，就留待觀者自己去定義。我覺得就命名的\n美感與寓意來說，英文版更勝一籌。\n\n為什麼說是人與野獸的分界呢？就像一個醫生，見多了生老病死，可能會從救世濟人的仁\n\
  心轉為麻木不仁的鐵石心；又比如一個劊子手，原只負責行刑，殺人並非出於個人好惡或\n恩怨，手裡沾的血腥多了，漸漸地也可能變得冷酷扭曲。警方的臥底也是人，儘管臥底是\n\
  任務需要，所待的時間久了，難免不會被影響而漸漸迷失。\n\n──如果你一生中做壞事的時間遠多於做好事的，那麼你這個人該算是好人還是壞人？如\n果你已習慣了活在黑暗裡，以後該怎麼回到太陽下？\n\
  \n看的時候，我總忍不住去想這些問題。\n\n臥底是人，他們要面對的犯罪集團同樣是。是人，就有優點缺點，就有各種感情。就算是\n希特勒，面對自己的至親也會流露慈愛。每個人的「臉」都是隨所面對的人事物而變化。\n\
  在警方或一般人眼中無惡不作的惡人，在自己的愛人兄弟面前可能也有情有義。一旦得到\n對方推心置腹的信任，卻要以出賣來回報，無論動機為何，都是一種巨大的內心煎熬。\n\
  \n所以當真正的「Blackjack」親眼看見保鏢小英死在眼前，他的悲痛，想必不只來自對方\n捨身以救，也不只因為他們已如同親密的朋友，或許有部份也是因為，她至死都不知道自\n\
  己救的是一個「警察」，是他們黑道的敵人。\n\n當然，或許她根本就不在乎這些，對她來說，捨身只是為了報他的恩義，與他是誰無關。\n但就算如此他也不見得會比較好受。因為他會想：「我並不是妳以為的那個人，不值得妳\n\
  對我這麼好。」\n\n而除了這層內心掙扎，臥底彷彿也將自己徹底獻給了公義，不能保有自我，更不能擁有家\n庭。就算有，也要有隨時失去的心理準備。就像片中的歡喜哥，即使聽殺妻仇人在面前拿\n\
  妻子慘死的經過來說笑，也得笑容滿面鎮靜如常地聽下去，脈搏還不能透露一絲異狀。若\n否，下一秒他已成了一個死人。想順利達成任務，就是要付出這麼大的代價。\n\n\
  因此聽他說：「就在我快忍不住的那瞬間，我看見你，讓我想起自己是一名警察。」當下\n聽的時候還不覺如何，後來玩味這句話，卻有些想哭。因為那是他拚命守住最後一道道德\n\
  防線，沒讓自己成為野獸的證明。他終究保住了身而為「人」的自己。\n\n\n\n有網友評價：「張家輝的魅力是一種演技和氣場雜揉的奇妙化學反應。」\n\n這話說得真是貼切。這部片的賣座，應有大半歸功於張家輝信手拈來的演技。他這個人的\n\
  氣質本身就兼具大男孩的頑皮跳脫與浪子凝煉的滄桑，笑起來令人如沐春風，一扳起臉卻\n又冷若冰霜，讓人摸不清哪一個才是真正的他。看他悠然遊走於這二種全然不同的面貌，\n\
  不禁想，由他來演古龍筆下《邊城浪子》的葉開，應該很合適。他天生就適合演那種背後\n藏有很深故事的人。\n\n古天樂又是另一種類型。正如他演過的經典角色楊過，他本身的氣質也亦正亦邪，最適合\n\
  遊走於正邪二道的邊緣角色。出場時我曾聽幾個男觀眾討論，說他「轉眼間眼神一變，就\n充滿邪氣」，語氣裡滿是佩服。\n\n確實，看戲時覺得他演的「少爺」（因為他姓邵而有的綽號？）外表吊兒郎當、玩世不恭\n\
  ，實則藏有很深的心機，而他也確實是，否則不會與自己的好兄弟暗中較勁，惹來諸多事\n端。因此這角色並不好演。\n\n和阿藍的忍辱負重不同，少爺心高氣傲、野心勃勃，但他心不夠狠，看見丁小嘉差點死在\n\
  眼前，他於心不忍；看見阿藍陷於險境，他下意識以肉身為盾為他擋槍。\n\n少爺是個更複雜更深沉更難演的角色，而古天樂也不負所望地演活了這個雖有貪欲卻不失\n可愛的人，只怪張家輝的存在感太強大，阿藍這角色的悲劇性又太搶眼，以致古天樂的演\n\
  出雖然令人驚豔，論外表帥度也樂勝張家輝，卻難以如張家輝般，在觀眾心裡留下深刻印\n象。\n\n但無論如何，我還是非常喜歡這對兄弟。\n\n從小喜歡武俠小說，就是喜歡男人間那種「不為什麼」的義氣。但人非聖賢，總是有七情\n\
  六欲，更難免猜疑妒忌，就像少爺內心不喜少爺晚他入行，卻爬得比他快；想插手毒品生\n意，藉機表現自己，也被阿藍阻攔，但最終他還是不願傷害阿藍；阿藍也在得知少爺可能\n\
  會破壞大局的時候，無法狠下心殺他滅口，只想為他準備一張遠走他方的船票。\n\n「做兄弟，在心中，你感受不到，我說一萬句都是廢的。」\n\n明知彼此是敵人，最後仍選擇了做兄弟，這份情誼，比始終兄友弟恭的關係更令我動容。\n\
  \n\n據說港劇版當年紅極一時，創下許多紀錄：TVB年度收視冠軍、在網路上的總播放量超過2\n4億，成為首部進入「20億俱樂部」的港劇、除了演完戲就離開TVB的男主角林峰，其他如\n\
  佘詩曼與許紹雄等，皆是拿獎拿到手軟...\n\n這巨大的成功，是電影版的助力，也是阻力。網路上許多給負評的，都是因為劇情、角色\n變動過大，而難以接受的港劇版粉絲。\n\
  \n但對我這種沒看過港劇版的人來說，劇情角色的變動只要不影響理解，就沒什麼差別，就\n連港劇版女主角佘詩曼在電影裡淪為舒緩氣氛用的甘草人物，對我來說都構不成遺憾。倒\n\
  是中途以為她死了，曾一度震撼，心想編劇連這麼大的角色都能賜死，看來是不持「保護\n要角」原則了，而看得更為緊張。\n\n....當然，不久就知道自己只是被擺了一道。\n\
  \n雖然我覺得丁小嘉太吵鬧，除了出場時貓捉老鼠那場飆車戲令人眼前一亮，其他時間基本\n上就只是出來搞笑的，對她沒有太大喜愛，但我還是要為佘詩曼致敬，她將這個市井氣很\n\
  重的臥底演得活靈活現，喜劇與正劇的切換得宜，與Q Sir那份最後才驚鴻一瞥的情愫也\n很動人。\n\n而影帝吳鎮宇雖然在片中戲份被分散掉了，但除了張家輝外，他是最令我心折的演員。警\n\
  方找阿藍來錄口供那場戲，他們隔著偵訊室的單向玻璃對話，雖然雙方都語氣平和、談笑\n風生，話裡卻針鋒相對、火花四濺，讓人看得大呼過癮。只恨後半他們便沒再正面對過戲\n\
  ，真的很想多看一點他倆互動軋演技的情節啊！\n\n其他諸如飾演大反派的李光潔與忠心女保鏢的張慧雯，除了因為是中國演員，需要配音，\n看起來稍微有點彆扭之外，表現都可圈可點，將重重殺機與外柔內剛的分寸把握得很好，\n\
  製造不少戲劇張力（我超喜歡小英超捨不得她死的啊啊啊～）。\n\n總之，若不是看膩了同類題材同樣演員，我會蠻推這部片的，至少就我個人來說，看完的\n當下，第一個念頭就是找時間去二刷（兼找張家輝其他作品來看）啊。\n\
  \n\n--"
