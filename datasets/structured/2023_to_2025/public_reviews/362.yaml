url: https://www.ptt.cc/bbs/movie/M.1427888083.A.1C8.html
title: '[好雷] 當起心動念時，就是舞蹈的原點：行者'
content: "Blog版本: \n\n\n那是《醮》的舞者在地上爬行的樣子，鏡頭拉得非常近，近到畫面上就只有舞者的側臉：\n濕透的頭髮、佈滿血絲的眼睛，還有精疲力盡仍要前進的神情。這一幕，深深地打動了我\n\
  ！\n\n\n\n《行者》是導演陳芯宜花了十年時間在拍攝無垢舞蹈劇場的紀錄片，以林麗珍對生命、生\n活與身體的體悟為主軸，用三部作品：《醮》、《花神祭》與《觀》來觀看無垢所創造出\n\
  的舞蹈詩篇。也因為拉長拍攝時間，導演得以從舞作的「起心動念」開始紀錄。身為一個\n戲看得比舞多的劇場觀眾，該從何種角度去解讀舞作，往往是我琢磨與研究再三的課題。\n\
  在以往看舞的場子裡，常常於演後座談碰到想窮究「意義」的觀眾：這樣的走位為何？那\n樣的燈光又是代表什麼？雖說追求舞蹈的意義並非錯誤，但更應該看重的，是作品觸動到\n\
  觀眾自身了沒有？「當起心動念時，就是舞蹈的原點。」因此，從媽祖遶境儀式入醮、杜\n鵑花開尋花神、鷹族子民觀天地，所有的作品都從日常周遭開始，無需刻意雕琢與尋找，\n\
  而是順任情勢且滑順地開展人與鬼、人與神、人與自然間的關係和可能。\n\n\n\n這些個「起心動念」到了排練場，並非一蹴可幾地就轉化成身體肌理可以詮釋的情感。舞\n\
  蹈技巧固然重要，但該如何表達內心的洶湧澎湃，而非只是照拍子跳出有著美麗線條的動\n作，是無垢給舞者們最大的考驗。所以，舞者會狼狽的在地上爬行，任由汗水浸濕滾落身\n\
  軀；也會不顧一切、絲毫不怕失衡摔倒的快速轉圈，再放縱身體用力的撞擊地板。只要全\n心投入，那個專注力就來了，舞者自然進到角色裡，無保留且赤裸的在舞台上呈現給觀眾\n\
  最真實的感受。也或許是因為如此，攝影機所捕捉到的表演後台，總是充滿了舞者情緒釋\n放後，流淚的臉龐。\n\n《行者》除了紀錄排練過程與演出實境外，還將場景拉到了戶外，讓舞者在霧嵐繚繞的層\n\
  疊山巒間、大浪驚濤的巨石沿岸邊、以及高聳陰鬱的筆直翠林裡，感受身體與四周環境的\n流動，並讓自己融入其中、吸納能量。換上演出妝扮的舞者們，直面著眼前的寬闊，不論\n\
  是靜謐地停留佇守，還是狂亂的朝空氣劃出陣陣疾風，那畫面都有著恰到好處與毫不突兀\n、不具侵略性的美麗，應證了無垢自始自終堅持的美學：從生活出發，以沈緩定心的心境\n\
  面對生命。\n\n在一段段說著作品故事的林麗珍老師身上，有著矛盾又特別的質地：平時的老師擁有寧靜\n且安穩的力量，但在講舞教舞時，那像是種子冒出土壤的、一瞬間的爆發力，卻又讓人感\n\
  到好激動，不自覺就會被她自然而然散發出的熱情給吸引。一如影片裡所呈現的作品，都\n是緩慢地拉到極限後，「砰」的力量如煙火炸裂開來，把大夥兒都震得體無完膚。\n\n\
  今晚的《行者》特映，看得我好是感動，席間更時不時傳來窸窣的抽面紙聲與抽鼻子聲。\n 總之，請一定要去看《行者》 (4/10上映)，他不只是一部記錄無垢歷程的電影作品，更\n\
  細膩地傳達舞作想要散播的，對於天地生命敬畏的純粹美好。\n\n\n看完《行者》後，超級想補齊《醮》、《花神祭》與《觀》三個作品，甚至連白沙屯媽祖\n遶境都想來補一下。《花神祭》將於2015年9月於國家劇院重新搬演，別錯過了唷！\n\
  \n\n--\nJimmyBlanca 一個跑劇場當跑趴的戲癡戲迷戲瘋子\nBlog: \nPlurk: \nFacebook: JimmyBlanca Tseng\n\
