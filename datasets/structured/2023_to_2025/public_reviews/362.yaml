url: https://www.ptt.cc/bbs/movie/M.1665985071.A.3C1.html
title: 'Re: [負雷] 孫行者傳 台灣導演蹉跎六年的空想動畫夢'
content: '這是台灣能做2D動畫的人可以畫出的畫面，接了中國動畫龍族OP的演出




  去日本的台灣原畫師邱桑能畫出來的，本人在台灣就已經能畫到這種程度，後來去日本了




  這個人跟他的朋友一起做的畢業動畫




  台灣不缺做動畫的人才啦，不管2/3D都是


  但這些什麼說有動畫夢或是魏德聖那種拿補助吹牛皮要做動畫的人又不會找這些人做


  所以就會出現很好笑的現象 喊什麼有夢想跟目標然後燒出來的東西比自家人才跑出去外

  面做的還爛好幾倍


  因為你就沒有真的找到最專業的來做，他們大概也不會找這些人來做


  然候宣傳電影時的重點永遠不是我做得多好，而是我多有夢想跟目標花了好幾年


  - -這最好有用


  這就是為什麼我現在看魏德聖吹那麼大都覺得根本在唬爛的原因，唉



  --


  台灣有專門接動畫外包或其他小動畫的動畫公司的 (例如小紅帽跟無肝者動畫)


  有些人還是有留下來 但特別厲害的通常當然還是會往外跑啦@@


  這部分是指2D的，3D厲害的應該更多人喔


  以動畫來說 你拿2000萬給不懂的人做，不如拿500萬給懂的人用喔


  因為錢當然是一個因素，但動畫表現上最重要的是人，專業厲害的人能做出來的東西就是

  不同的


  中國有人當到演出 也不用說一定要到日本動畫的監督啦 他們自己做的羅小黑評價就很高


  這點一堆日本業界大神都認可


  然後我認為真的做動畫的人是不會計較超啥趕啥的 而是一起交流看雙方有沒有更多可以

  學習的地方


  畢竟中日動畫業界交流已經行之有年了'
