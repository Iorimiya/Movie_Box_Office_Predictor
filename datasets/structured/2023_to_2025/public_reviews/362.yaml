url: https://www.ptt.cc/bbs/movie/M.1702915821.A.230.html
title: '[好雷] 夢行者保羅'
content: '夢行者保羅的翻譯讓我對這部片有著額外的期待，本來希望凱吉能像移動世界的感覺，在

  夢境中穿梭搞怪或是解謎找兇手啥的，可惜完全不是這麼回事，雖然年事已高，還是很希

  望凱吉來個小動作片之類的啊．



  說到劇情本身，保羅是個每天上下班的中年普通教職員，不知何故從某天開始，保羅慢慢

  的出現在他人的夢中，短時間內夢到他的人越來越多，讓他一夜間變成了現象級的人物，

  從學者到靈媒都給不出個解釋來，面對這莫名其妙突如其來的名氣，保羅反而覺得是個機

  會，但是這些無法被預期的夢，最後帶給他的是好運還是惡夢呢？



  這部片我覺得開頭很吸引人，引子夠強，但敘事手法卻稍嫌平淡，起承轉合也大概猜得到

  ，而最重要的原因，就是為什麼大家會夢到保羅這點卻沒說明，最後只丟了句從某天起大

  家就沒夢到保羅，就結束了故事，讓人覺得相當懸念．雖然故事中期帶出網路與取消文化

  時，大概就知道這才和導演和編劇想表達的主題，而不是保羅和夢的原因，就算如此還是

  很希望伏筆能被解決，而不是就這樣帶過了



  而凱吉還是那個百變凱吉，舉手投足都是戲，不管劇情是快是慢，奇怪或不奇怪，總是可

  以拉近角色和觀眾的距離感，讓人感受到角色的當下，陪著觀眾一起度過這個故事，那這

  次凱吉戲份也有不少讓人難忘，尤其是年輕正妹助理投懷送抱時，老保羅無奈 Jizz in

  my pants 後，自己半夜在床上的悔恨吶喊，以及保羅後來情勢所迫，對那些他沒做的事

  ，而錄了一段假到不行的道歉錄影，雖然錄影本身讓人感到假掰，但保羅的人設卻因此立

  體而圓滿，這段真中帶假的表演對戲迷來說真的非常過癮，印象極為深刻，老實說為了這

  個片段我覺得就夠本了，雖然伏筆草草帶過結束，但至少這片裡有滿滿的凱吉，光這點誠

  意就滿分，值得一看好雷推薦給大家


  --'
