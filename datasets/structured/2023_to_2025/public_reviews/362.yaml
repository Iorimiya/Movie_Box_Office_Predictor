title: '[討論] 星際大戰的天行者們'
content: '每個人喜愛星際大戰的理由不太一樣。

  對某些觀眾來說人物的魅力跟故事劇情同等重要，甚至更迷人。

  而被不少網友戲稱「天行者世家」的星際大戰，焦點更是脫離不了安納金、路克、莉亞這

  三位天行者。


  看完第八集我又跑回家看456123R1， 雖然看過很多遍，但這三位演員都讓我覺得很美，(

  大概我可以一直重複看他們的臉XD)

  下面收集了莉亞(Carrie Fisher)、路克(Mark Hamill)、安納金(Hayden Christensen)的

  照片。

  (圖片均來自google)


  當然每個人對外貌的看法很主觀，

  只能說我真的很贊成盧卡斯的審美觀，

  選卡司眼光真是每個都戳到我心坎裡～


  女士優先，我們的莉亞公主











  銀髮莉亞



  Carrie



  放一下老韓(亂入)






  Han Leia Luke







  銀髮路克



  Mark Hamill




  年輕路克











  安納金










  穆斯塔法幕後（燒傷化妝好細心！）




  Ep3最後的黑武士是海登穿盔甲，我覺得比456的盔甲纖細一點（still cool）





  海登的照片們







  去年Star Wars 40週年的天行者父子合影





  不過整個星戰歷史個人覺得最帥的還是這一幕


  如果黑武士活到第一軍團的時期，

  不知道他會不會把效率低落的First Order一半的人都掐死XD

  (evil me~ehehehe)


  --

  超帥的啊，續集所有人加起來都沒安納金帥啊（喂喂喂）


  R大抱歉，我完全不同意XDDDD


  我也喜歡海登的安納金（握手～）反正其他人再怎麼說，也無法批評他的長相（喂）他幕

  後花絮好好笑，一直撲街（有點可憐XD）


  幕後NG 前傳正傳~


  哈里遜福特還把麥克風吃掉! 在幹嘛XDDDD


  黑武士是他飾演的已成定局呀，而蠻多人都覺得海登很帥的

  海登嗎?XD

  不~~~為什麼要提醒我~~~(我好沒禮貌XD)

  神奇的年齡差!

  我記得娜坦莉波曼很早的訪問有被問到，為什麼帕米愛上安納金，

  她說just look at his face! (好直接的回答XD)

  超帥收尾!!!我喜歡R1很大原因為了最後五分鐘!!!

  Natalie我覺得戲外非常漂亮，戲裡莉亞比較亮眼!

  補一下~


  謝謝小羊大的說明! 我喜歡海登的詮釋，他讓我為安納金的悲劇動容

  謝謝a大,再一張莉亞美照!


  YEAH~


  劇本很多台詞頗尷尬

  好喜感XD

  Here!


