url: https://www.ptt.cc/bbs/movie/M.1519319991.A.DB1.html
title: '[新聞] 第90屆奧斯卡典禮 星戰「天行者」將任頒獎人'
content: "新聞網址：\n\n2018-02-22 20:43中央社 洛杉磯22日綜合外電報導\n\n飾演「星際大戰」電影角色路克天行者（Luke Skywalker）的馬克漢米爾，他將在3月4日\n\
  奧斯卡獎典禮擔任頒獎嘉賓，典禮過後還會得到好萊塢星光大道的星形獎章。\n\n法新社報導，馬克漢米爾（Mark Hamill）會出席3月4日第90屆奧斯卡頒獎典禮，且他在4\n\
  天後將榮獲好萊塢星光大道的個人星形獎章。\n\n奧斯卡典禮將在杜比劇院（Dolby Theater）進行，當天其他的頒獎嘉賓還有「神力女超\n人」女主角蓋兒加朵（Gal\
  \ Gadot）、艾米漢默（Armie Hammer）以及伊娃瑪莉桑特（\nEva Marie Saint）、韋斯史塔迪（Wes Studi）、凱利馬里特蘭（Kelly\
  \ Marie Tran）和\n辛蒂亞（Zendaya）等人。\n\n好萊塢星光大道儀式製作人馬蒂內茲（AnaMartinez）聲明指出：「來自世界各地的星際\n\
  大戰粉絲，以及相當遙遠的銀河系都會興奮地聽到，傳奇演員馬克漢米爾將在好萊塢星光\n大道留名。」\n\n馬克漢米爾將獲得星光大道第2630顆星形獎章。\n--\n\
  \n    \n\n\n--"
