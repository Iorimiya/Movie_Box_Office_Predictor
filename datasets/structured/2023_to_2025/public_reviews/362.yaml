url: https://www.ptt.cc/bbs/movie/M.1561201487.A.B53.html
title: '[新聞] AI「鬼娃」雲端學殺人 天行者路克「化聲」恰吉'
content: "新聞網址：\n\n2019-06-22 13:46 聯合晚報 記者黃保慧／綜合報導\n\n「鬼娃」電影「恰吉」原版配音布萊德杜瑞夫日前宣布退出重啟版「恰吉」的配音工作，\n\
  現在確定改為以星際大戰系列「天行者路克」一角廣為人知的馬克漢彌爾為新恰吉獻聲，\n令影迷期待不已。\n\n熟悉馬克漢彌爾的粉絲都知道，他不但是絕地武士，還是一流的聲優，他最具代表性的演\n\
  出，就是替DC系列作品中的「小丑」配音。在「恰吉」最新預告結尾的一句「晚安，安迪\n」，語氣中的瘋癲與冷血感，讓重啟版「恰吉」更能夠吸引年輕一代的新觀眾。\n\n\
  新版恰吉變成了擁有AI的高科技娃娃，內建WiFi連線、還具備雲端語音辨識功能、攝錄影\n、遠端遙控以及環境感應等智慧型功能，卻在程式遭到竄改後開始從雲端學習各類殺人技\n\
  巧。片中恰吉不擇手段除去任何擋在它和主角之間的障礙，只為得到贏得安迪的歡心，「\n一輩子的好麻吉」可說是當之無愧！\n\n將於本月上映的「恰吉」，正好與同為玩具題材的「玩具總動員4」同檔上映，片商鎖定\n\
  警長胡迪、巴斯光年和彈簧狗都成了恰吉手下的受害者，分別倒臥在血泊之中、雷射槍擊\n以及火烤伺候，不僅向觀眾宣告恰吉依舊寶刀未老，也定調電影「恰吉」令人莞爾的黑色\n\
  幽默風格。該片21日上映。\n--\n    \n\n ; \n\n \n\n--"
