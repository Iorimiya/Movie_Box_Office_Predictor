title: '[好雷] 行者  不知怎麼評價的好片'
content: "去看行者是因為曾經在去年時, 有幸看了無垢的花神祭\n\n深深的被感動與震憾\n\n所以行者這部記錄片上映後就決定一定要去看, 在有人包場預購時就買了票等開映\n\
  \n從4月看的那天到現在, 已經超過了2個半月的時間了\n\n這部片的心得文一直想寫, 卻不知道從何著手\n\n因為似乎會是部喜歡的人非常喜歡, 不喜歡的人會覺得無聊枯燥的片子\n\
  \n也因為又是記錄片, 又是記錄很特別的內容, 所以很難\n\n就一直放著快忘了這件事\n\n\n\n直到上週日去看賤熊2時, 赫然發現行者歷經了2個多月的時間\n\
  \n從一開始就是少少的廳, 然後少少的時段, 竟然在國賓長春\n\n仍然還上映著?   這真是太激勵人心的事, 重點是, 它是客滿的狀態\n\n\n\n今年的花神祭即將上映,\
  \ 而這部記錄片, 能夠一直到現在仍有檔期\n\n也希望能為它再推薦一下, 雖然, 真的很難著手\n\n但我想, 如果遇到知音跟喜歡的人, 一定會覺得會被這部片深深感動的\n\
  \n\n\n行者這部記錄片很有意思\n\n大部份的時候, 是一幅幅單張的照片, 以及無垢的靈魂人物, 林麗珍老師\n\n的生活中的舉止言談, 以及各種互動\n\n\
  如果是喜歡舞蹈的, 對舞台劇有感或喜歡的\n\n或是對於藝術表現形式, 以及像林麗珍老師這樣的大家, 對於一些生活中的\n\n感受體悟, 會有興趣的人, 都會很愛這部片\n\
  \n\n但如果是想看到特效? 對不起沒有\n\n想看到感人與高潮起伏的劇情? 對不起沒有, 但有舞者們真實人生中的感人故事\n\n想看到明星帥哥美女? 對不起沒有,\
  \ 但有比帥哥還酷帥的肢體動作, 比美女還美的舞姿\n\n以及一幅幅美到不行的單張定格畫面\n\n這部片\n\n如果喜歡像看見台灣這樣的記錄片的人, 應該來看\n\
  \n如果喜歡舞蹈不管是現代舞街舞的人, 應該來看\n\n如果是對藝術的表達形式感興趣的人, 應該來看\n\n趁著國賓長春還在一輪演出時就該去看, 因為在一輪電影院上映的愈久\n\
  \n愈能蘊釀一部好電影的口碑與後續的力道\n\n這是部一位導演在十幾年的累積, 在很有限的經費與預算下, 幾萬個小時的影片中剪輯出\n\n呈現出的感動人心與絕美畫面的作品,\
  \ 值得支持\n\n\n--\n\n     \"生活得最有意義的人，並不就是年歲活得最大的人，而是對生活最有感受的人\"\n\n              \
  \                  ~ 盧梭/愛彌兒 ~\n\n\n\n--\n期待它加映:P\n\n我想這並不是能不能打入那裡的市場, 而是目前台灣舞團們經營的方式與模式\n\
  還很陽春, 受限於舞團人手, 也受限於宣傳, 所以像無垢聽說這次去日本也是大受轟動\n\n但不管再造成轟動, 也仍然是經營的很辛苦, 我想這也是台灣文創產業結合性不足的地方\n\
  即使生出了有價值的金雞母, 卻缺乏協助將價值放大的營銷管道, 模式與人材...\n\n您說的沒錯\n\n然而我想最大的問題是, 藝術表演者本來就該讓他們專心在藝術的領域上,\
  \ 畢竟光\n是任何一個領域, 本身的登頂就是極困難的事情了, 任何一個大師\n\n都不是光靠資源就可以堆積的起來的\n\n\n現今的問題是, 缺乏對這些東西本質有了解的資本家與經營者\n\
  能將他們的價值放大\n\n\n這是個十分有意思的議題\n\n靠企業贊助畢竟仍不是個好方式\n\n只可惜大部份時候, 有資源的沒眼光, 有眼光的沒資源, 兩者都有的\n\
  要不就沒經驗, 要不就不屬於這個產業......\n\n有時候真的需要更多跨領域的人材跟資本家.."
