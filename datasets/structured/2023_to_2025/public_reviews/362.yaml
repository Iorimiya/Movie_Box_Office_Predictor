content: '★全新正式海報★





  《STAR WARS：天行者的崛起》（Star Wars:The Rise of Skywalker）是一部預定於2019

  年12月上映的電影，由JJ亞柏拉罕執導，劇本由亞柏拉罕與克里斯泰瑞歐共同編寫。本片

  是「星際大戰後傳三部曲（Star Wars sequel trilogy）」的第三和最後一部作品，同時

  是《星際大戰》系列電影的第九部作品，為2017年《STAR WARS：最後的絕地武士》的續

  集。電影由盧卡斯影業和壞機器人製片公司製作，華特迪士尼工作室電影負責發行。


  ★ 完整終極版預告★


