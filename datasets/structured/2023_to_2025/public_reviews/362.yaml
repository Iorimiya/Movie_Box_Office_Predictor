url: https://www.ptt.cc/bbs/movie/M.1480941142.A.2DF.html
title: '[無雷] 8+9的撒哈拉長跑《行者三太子-迎向曙光》'
content: '圖文版請於連結：

  註：文章的8+9並無貶意


  少年曙光，撒哈拉兩百多公里長征

  台灣因腹地狹小，政治情勢曖昧的關係，往往許多台灣人會試著想做出一些自我挑戰，或

  是國際賽事來讓世界知道台灣這片土地。台灣有豐厚的文化根源，其中佛、道宗教信仰就

  是一環，也是台灣土地上廣為人知的信仰之一。而宗教向來是是領於信徒一股助力，記錄

  片《行者三太子-迎向曙光》描述台灣民俗技藝團體「九天民俗技藝團」的成員不分男女

  挑戰全世界最嚴酷的馬拉松賽事之一「撒哈拉極限馬拉松」，除了完賽之外，他們也將背

  著三太子一起跑完全程，而最終是否真能如願完成這艱難的賽事？










  台灣有著個網路流行語叫做「8＋9」，音同台灣話「八家將」，這是一句帶著有點玩笑和

  嘲弄意味的稱呼，泛指那些跟著廟口，或跳民俗技藝的邊緣少年，比較不好聽的狹義也有

  「流氓」、「混混」等意涵。因為社會新聞觀感不佳，和黑社會長期控制台灣宗教廟宇，

  參與傳統廟宇習俗被看做「壞孩子」與「不學好」的象徵，但無非是一種固有的歧視，如

  有正當性哪怕是傳統技藝表演者和陣頭孩子，我們都不該帶有偏見的視角看待，反而這些

  人還保有傳成了台灣傳統的民俗文化。


  記錄片《行者三太子-迎向曙光》有著相當勵志的故事，講述觀於「九天民俗技藝團」一

  些團員不太榮耀或曲折的成長背景，而到參與九天團體的成長，以及團長一次突發奇想，

  受到神明旨意決定帶著團員勇闖全世界四大嚴峻的馬拉松賽事：「撒哈拉極限馬拉松」。

  電影從九天民俗團孩子們的成長背景開始，一直到馬拉松訓練，和參加比賽時那種突破自

  我的心路歷程，完整的紀錄下，而也讓台灣宗教文化的三太子奔於沙漠的印象，傳遞到世

  界各地。










  這並非九天第一場的電影秀，在過去二零一二年時，九天民俗技藝團就曾經參與以台灣民

  俗文化為特色的劇情片《陣頭》，在表演和故事角色中協力演出。該部電影也是取材於九

  天技藝團的故事改編而成。但故事畢竟是故事，在《行者三太子-迎向曙光》中才真正看

  得到不躲在電影劇情後頭，真正的九天民俗技藝團故事，這群曾經被社會忽略，自主放棄

  過的孩子，慢慢透過團隊經歷與摩擦，而蛻變自我的故事。


  但也許是想說的故事太多，沒辦法每個人都敘述到。雖然有資深藝術設計工作者蕭青陽指

  導，但是本片還是有許多流於太過向電視專題新聞的手法。尤其是旁白式的講解，和過於

  教育式的台詞，往往讓觀眾無法融入電影的感動之中。尤其雖後半貼近撒哈拉長征做為故

  事主軸，但與前段的紀錄形式有著突兀感，有如九天民俗技藝團的專訪上下特輯，這是電

  影中不足之處。但對於裡面畫面與特效呈現，還有角色的心路歷程，都還是本片值得一看

  之處。


  在傳統道教文化裡九天玄女常以救助危難、替天行道的仙女形象出現。而三太子源於佛家

  的護法之神，也從電影中意外一窺台灣佛道彼此影響的台式宗教習俗。而不管宗教的力量

  是否有科學根據，記錄電影《行者三太子-迎向曙光》片中所有努力走回正途之人，挑戰

  自己極限者，也許真在心中有著一股信仰力量，帶領他們往前走過荒蕪的沙漠之地和不愉

  快的過往，而得到人生的成就感。台灣也許需要更多這樣的力量，來翻轉社會大眾的偏見

  ；肯定更多元的人生發展。


  --'
