title: '[討論] STAR WARS:天行者的崛起 分級公佈'
content: '普遍級。


  今天剛公佈


  迪士尼時代星際大戰各片分級


  STAR WARS:原力覺醒              普遍級

  俠盜一號:星際大戰外傳           保護級

  STAR WARS:最後的絕地武士  保護級

  韓索羅:星際大戰外傳               保護級

  STAR WARS:天行者的崛起      普遍級


  北美則是除原力覺醒為PG外，包含本集皆為PG-13


  舊時代各集除ep3為 保護/PG-13 外皆為 普遍/PG



  =

  再補個同棚迪士尼旗下的好了

  只列上映時就屬於迪士尼、非動畫片且票房破十億的


  復仇者聯盟:終局之戰 保護級

  復仇者聯盟:無限之戰 保護級

  復仇者聯盟:奧創紀元 保護級

  黑豹                              保護級

  美女與野獸2017          普遍級

  美國隊長3:英雄內戰   輔12級

  驚奇隊長                      保護級

  阿拉丁2019                 普遍級

  愛麗絲夢遊仙境2010  普遍級


  有些的分級文化部網站沒寫，就不附了


