url: https://www.ptt.cc/bbs/movie/M.1435334049.A.FEF.html
title: '[負雷] 國光客運的電影急凍行者'
content: '個人網誌，無廣告，同内文








  (防雷)






  　　版上毫無負雷我有點小意外。羅永昌執導的科幻動作片，翻拍自1989年元彪、張曼玉

  主演的穿越電影「急凍奇俠」。主要演員有甄子丹（主角錦衣衛二哥賀英）、黃聖依（女

  主角小美）、喻亢（錦衣衛老三聶虎）、王寶強（錦衣衛老四薩獒）、任達華（副警務署

  長），其中錦衣衛三人組在同年也一起合作警匪動作電影「一個人的武林」。內文會提劇

  情。


  　　個人覺得在地名文字加上音效和特效實在很無謂，就好像用Microsoft Word中的文字

  藝術師來美化文案一樣，加上還有一些很假的3D動畫，低質感的開場讓我又回想起當初在

  看「天機：富春山居圖」的感覺。穿著古裝被冰凍的神祕武功高手在運送意外中逃脫，賀

  英遇到了貪財的小美，小美發現穿越時空的他身上有許多值錢的東西，於是瘋狂揩油。後

  來發現小美其實是個孝順的女孩，有夠矛盾，自己過著高檔的生活卻付不起媽媽養老院的

  錢，豈不是在打腫臉充胖子？最後那條價值連城的項鍊丟水裡時小美居然能這麼冷靜，不

  要說是愛慕虛榮的人了，要是我在場也一定馬上跳下去撈。


  　　尿尿很遠和濕婆神巨陽那邊不知道是不是某種港式幽默，我無法理解。我覺得看點在

