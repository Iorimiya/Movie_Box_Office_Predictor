title: '[好雷] 送行者'
content: '1.影片名稱 : 送行者


  2.觀影時間 : 拒答


  3.觀影地點 : 住家網路


  4.觀影方式 : DVD


  §其他防雷說明(非必要) : n刷等其他說明請於此區說明....可留空



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  由對立到和解──《送行者》的象徵意義





  （一）特殊行業


  看完榮獲2009年奧斯卡金像獎最佳外語片的《送行者‧禮儀師的樂章》，觀影過程中，雖

  然笑聲不斷，但一次又一次的「納棺」，隨著感人的音樂，每每流下淚水，而沉重的主題

  也讓人為之無言。


  《送行者‧禮儀師的樂章》是關於日本殯葬業「納棺師」的故事。原本在東京交響樂團擔

  任大提琴手的小林大悟（本木雅弘飾演），因樂團突然解散而放棄演奏家之路。失業的大

  悟只好和妻子美香（廣末涼子飾演，網頁設計師）回到故鄉山形縣，住在兩年前母親去世

  留下的房子。大悟在報上看到「旅途協助工作」的人事廣告，前往應徵，意外當場獲得錄

  用。詳問之下，方知此一工作是「納棺」，由於困於失業，加以社長（山崎努飾演）之半

  強迫半利誘，大悟心不甘情不願地「忍受」這份工作。


  起初大悟十分恐懼排斥，還得應付親友的誤解、週遭的鄙夷，尤其是妻子美香的激烈反對

  ，讓他興起辭職念頭。但在社長挽留之下，大悟還是留下來，獨自生活。後來，回娘家的

  妻子發現懷孕了，要求大悟換一個不令將來孩子抬不起頭來的工作，可是在親身經歷一場

  場送行儀式後，大悟漸漸瞭解到，禮儀師妝扮往生者「走上來生旅途」的重要意義，當妻

  子親眼看見丈夫工作時的專注投入與自信，她終於打開心結，衷心接納大悟的選擇。也因

  看盡死別的不捨與悲傷，大悟得知失去聯絡三十餘年的父親死訊，在同事百合子苦勸下，

  偕妻幫早年「拋妻棄子」的亡父收屍，於納棺過程中，大悟意外發現父親不為人知的思念

  兒子的親情，生前猶緊緊握住兒子相贈的小白石，於是前嫌冰釋，大悟也流下感動的淚水

  ，對於悲歡人生有了最深一層的體悟。


  （二）象徵意義豐富多元


  無論是編導、演員、攝影、剪輯等方面，《送行者‧禮儀師的樂章》都可圈可點，尤其「

  久石讓」哀淒的大提琴配樂，與「死亡」的主題水乳交融，為此片取得商業暨藝術成就的

  不二功臣。雖然此片明顯美化了「死亡」的處理，頗有可議之處，然瑕不掩瑜。而此片最

  值得一提的是，「象徵意義」豐富多元，令人回味再三。


  文學結構主義認為，象徵意義的產生，往往來自「區別」或「二元對立」，「對立」會逐

  漸發展成為龐大的對立模式，籠罩整個作品，並左右其意義，是為所謂的象徵語碼（

  Symbolic Code）。《送行者‧禮儀師的樂章》最明顯的對立象徵，即為「生與死」。生

  老病死，這就是人生；然人生卻又如謎，古今多少哲學家、文學家、藝術家莫不窮其一生

  ，尋找人生的答案；《送行者‧禮儀師的樂章》透過一場場葬禮，讓觀眾面對人人無可逃

  避的死亡，原來，「死亡」也可以如此莊嚴、淒美，並不若想像中那麼恐怖。電影中，「

  鶴之湯」澡堂的老顧客，在殯儀館擔任大體火化工作的大叔，於火化「鶴之湯」老闆娘之

  前，告訴老闆娘的兒子「山下」，死並非真是死，人只是經過這一道門，去到另一個世界

  ，所以彷如「守門人」的他總是跟死者說：「一路好走，來生再見！」是以，「死」乃另

  一種「生」的開始，此一理念應當可以幫助觀眾增加人生智慧。當然，編劇將主角取名「

  大悟」，且對禮儀師之工作由排斥轉為接受；以及妻子美香之懷孕，喜悅迎接新生，自是

  皆有其呼應主題之寓意吧！


  （三）具心靈療效


  又，片中關於親情的對立與和解，亦深具象徵意義。大悟痛恨開咖啡店的父親愛上店中的

  女服務生，離家出走，棄家庭而不顧，最後，年老的父親思念妻兒卻無顏返家，孤獨死於

  偏僻的小漁港，被通知前往處理後事的大悟，終於化解長久以來對父親的恨意，轉為親子

  之愛。妻子美香支持失業的丈夫返鄉，然獲知丈夫的工作內容則完全無法接受，與丈夫爆

  發激烈衝突，不讓丈夫碰觸自己的身體，嫌棄丈夫的手「髒死了」，直到美香見識了，禮

  儀師乃是為往生者安排「最美的送行」，這才欣然接受原本被認為「不正常」的職業。


  再者，大悟的家鄉同窗「山下」，在市公所上班，對於母親堅持繼續經營老舊的「鶴之湯

  」澡堂不以為然，主張出售改建大樓，母子意見不合，關係十分緊張，形成衝突、對立，

  後來，母親工作時倒下猝死，治喪過程中，「山下」了解自己的不孝，經由殯儀館大叔的

  開示，在母親大體火化之際痛哭失聲，祈求亡母的原諒。


  以上皆是親情形成對立，終而取得和解，蘊含象徵意義，對觀眾也有著催淚和心靈治療的

  效果。


  （四）痛快又讓人深思


  除了生死、親情的對立外，《送行者‧禮儀師的樂章》尚有「都市∕鄉下」、「正常∕不

  正常」、「美∕醜」、「男∕非男」、「植物∕動物」、「慎重∕草率」……等不同形式

  的對比，饒富象徵意義，值得細細去品味。


  綜觀之，只要有過至親大去之體驗者，觀賞《送行者‧禮儀師的樂章》必定感受加倍深刻

  ，泫然落淚乃是自然反應，因為電影院中太多人哭了，不哭反而變得「不正常」，所以毫

  不掩飾地邊看邊笑邊哭，絕對不會難為情，這的確是十分難得、痛快而又讓人深思的觀影

  經驗，手法高明的導演「瀧田洋二郎」，值得愛好電影者致上最崇高的敬意。









  --'
