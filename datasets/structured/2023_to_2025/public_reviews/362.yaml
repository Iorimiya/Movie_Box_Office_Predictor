title: '[討論]我想為星戰八的 路克天行者 平反一下'
content: '文長請慎入~




  看完星戰八 我對路克最後的表現與腳色的塑造感到非常激賞


  但是看到不少討論卻是在批評路克 說他害凱羅忍入黑暗面


  又龜縮在島上不去拯救全銀河 很懦弱啦之類的




  其實我覺得 所有對路克批評的這些言論


  反而正是讓路克變成星戰八這副老番顛模樣的原因




  試想看看  這些對路克不滿地批評


  其實都來自於 他們對於路克沒有完美的詮釋他們想像中的絕地大師所表達的不滿




  何謂想像中的絕地大師


  就是要像尤達 魁剛·金 歐比王 雲度大師 這樣


  充滿智慧 原力強大 正直 無私 嫉惡如仇 勇敢 不畏強權 面對困難永不放棄




  這樣的完美絕地大師形象 就是全銀河的人們 乃至於全世界的星戰影迷


  所期盼看到的 大家都希望在第六集打敗黑暗勢力後的大英雄


  能在星戰八裡 以完美的絕地大師-路克天行者的形象 出現在眾人面前




  能在黑暗勢力囂張而光明之力黯淡的銀河裡


  繼續扮演著過去魁剛·金跟歐比王的腳色 尋找下一個絕地天才


  訓練他 帶領他 引導他成為下一個絕地的希望 最後為了渡化他


  甚至為此犧牲自己而成為絕地英靈


  嗯~~好一個完美的絕地大師啊!!




  但是!! 偏偏這一集就不是照著大家想像的這樣演




  路克出現了


  卻是躲在偏遠的行星小島上龜縮 面對困難只會逃避抱怨


  還一手造成凱羅忍的黑化




  天啊 這根本不是傳統星戰裡 充滿智慧的絕地大師該有的樣子


  於是 難以接受的批評者開始大肆批評星戰八的路克




  但是!!


  我想請問的是  為何路克就一定要成為是傳統星戰裡的絕地大師呢?




  其實我們回想一下舊三部曲裡的路克天行者


  其本性 其實跟舊共和時期的傳統老絕地大師們格格不入




  老絕地們 注重傳統 教條 規範 戒律 身分地位 組織結構


  身分不到的你連出席會議的資格都沒有


  僵化而沒有變通的絕地大師們 跟舊三部曲的路克個性 其實並不相容




  而且嚴格說起來 路克根本沒有受過真正傳統老絕地式的訓練與薰陶


  路克一出生老絕地就被滅的差不多了


  後來歐比王與尤達對路克的訓練 根本也沒教完




  因此 我覺得 路克其實根本不適合老絕地那套


  甚至可以說 如果路克跟安納金一樣 是在傳統老絕地的環境下接觸原力與訓練


  說不定最後也跟他老爸一樣


  走上黑暗這條路




  所以 照理說 天性與老絕地不搭嘎的路克


  不應該會成為一個傳統僵化的老派絕地大師才對




  但是我們在星戰八裡看到的路克老番顛


  重建絕地聖殿 訓練學員 還小心翼翼的收藏絕地經典


  完全就是一副老派絕地大師的模樣啊




  為何如此??


  我認為 這就是大家對 絕地大師路克天行者


  賦予太多的期待與壓力 給路克所帶來的改變




  試想看看 第六集結束後


  一個剛打敗黑暗勢力 全銀河碩果僅存的絕地武士


  身繫全銀河的希望


  大家都期盼路克能再建絕地勢力




  而路克本人 一開始肯定也是這麼期許自己的


  於是 路克開始朝著大家希望他成為的那個路克天行者的腳色走去




  他披上傳統的絕地大師服裝


  重建聖殿 招集有天分的學員給予訓練


  收集絕地經典並小心珍藏


  路克所做的一切 都是傳統老絕地在做的事


  也是大家期盼並認為路克該做的事


  但是 這真的是路克的原始天性所想做的事嗎?




  之前有提過 路克的天性其實跟老絕地並不搭嘎


  注重教條 戒律 規範 身分地位 組織等等的老絕地束縛


  其實並不是符合路克天性的




  但是為了重建絕地 為了成為大家心裡期盼的那個絕地大師


  可以說 路克是一直違背著自己的天性 在做一個他自己並不開心的絕地大師




  所以 後面的挑戰就來了


  當路克發現自己的姪子凱羅忍 陷入光明與黑暗的抉擇時


  路克其實是束手無策的




  畢竟 他不是真正傳統意義上


  像尤達大師這種 擁有高度智慧的絕地大師


  他只是因為全銀河只剩他一個


  所以不得不為了迎合大家 把自己偽裝成一個好像很有智慧的絕地大師




  因此 他完全無法面對與解決凱羅忍的問題


  他唯一能做到的就是


  是否要在凱羅忍黑化前 為了全銀河的未來把他幹掉




  這裡 是很多人批評路克的一點


  批評路克為何不能好好地帶領凱羅忍脫離黑暗面 而是考慮殺掉他




  在此我想為路克辯駁一下




  也許 就是因為星戰八的路克 根本不是真正傳統意義上的絕地大師


  所以他不是不想帶領凱羅忍脫離黑暗


  而是他根本沒有這個智慧與能力可以做到




  別忘了 舊共和時期的老絕地


  要成為大師是要通過考驗跟絕地會議認可的




  啊路克成為絕地大師時 絕地組織根本就不存在了


  他的絕地大師搞不好根本是自己封的


  所以也許他根本就不是一個合格的絕地大師啊




  而且嚴格來說 路克的當初絕地訓練根本沒學完


  他本身的經驗跟智慧就不足了 要怎麼領導凱羅忍脫離黑暗面??




  總之 凱羅忍事件 是造成路克心性大變的原因


  此後的路克就變成了星戰八裡備受批評的老番顛




  這時的路克 開始對老絕地的傳統教條感到懷疑 與反思


  他或許開始覺得 這種老絕地式的訓練方式 根本違反人性


  甚或是製造出黑暗原力的根源


  畢竟


  路克自己的老爸安納金跟姪子凱羅忍 都是在這套訓練模式下走偏了路的




  所以當芮來找路克時 對芮想要他重建絕地的要求


  路克的回應是一臉不耐 歇斯底里 與滿口的酸言酸語



  “就因為我是路克天行者"


  "所以你期望我拿著一把光劍像救世主般的出現去挑戰一整個艦隊?? “



  記得電影院裡有看到一段類似這樣的台詞


  大部人都對後面那句拿著光劍挑戰艦隊感到幽默有趣




  但我其實更注意到的是 “就因為我是路克天行者” 這句




  對啊 就因為我是路克天行者


  我就要去幫你們打艦隊? 我就要復興絕地?


  就要重建聖殿? 訓練學員? 我就要一個人扛下所有人的期待 肩負起重建絕地的責任??




  然後 就因為我是路克天行者


  所以重建絕地是不准失敗的  一旦失敗了 我們可以看到


  凱羅忍事件後的路克天行者 完全的崩潰了




  在這裡 不單單只是因為表面上凱羅忍的背叛


  其實背後更隱含著 背負著唯一僅存的絕地大師的使命


  與全銀河(與全球影迷)的期待 所帶來的巨大壓力下


  一次致命的失敗 所造成的路克天行者的全面崩壞




  這樣的形象 是讓全球星戰影迷失望的


  他們想看到的不是這樣的路克天行者




  但是 跟有著完美形象的絕地大師 魁剛·金 歐比王等人相比起來


  這樣的絕地大師 路克天行者


  會崩潰 會逃避 會埋怨 甚至還會發酸文


  是不是更符合人性 感覺更真實的存在我們身邊呢?




  雖然有人不滿意這樣的路克天行者


  但對我來說 這樣的天行者


  內心與行為充滿著矛盾


  反而更立體化這個腳色 讓路克的存在更有深度與層次




  老實說 如果星戰八的路克沒有這些變化


  他依然是完美的詮釋著大家理想中的絕地大師


  也許這樣的路克會是個安全牌 不會引來那麼多的罵聲




  但這樣的話 不就又只是另外一個魁剛·金或是歐比王的腳色嗎?


  這樣沒有突破與改變的絕地大師路克 會是十分可惜的




  所以 對於導演跟編劇 敢給路克這個神主牌等級的腳色


  這麼大的嘗試與突破 我覺得是要給滿掌聲與鼓勵的




  最後 我覺得星戰八的主軸 其實完全顛覆了過去的英雄主義


  讓這些老英雄更具人性 也因為路克被塑造得更有血肉與人性以後




  片尾路克耗盡原力 為莉亞等人製造逃脫機會


  最後油盡燈枯而化為一陣風


  消失在夕陽下的精彩畫面


  就更顯得震撼與動人




  因為你會覺得


  現在在做這件偉大犧牲的事的人


  已經不再是理所當然的 傳統上的完美英雄了


  而是一個跟你我一樣 會崩潰 會逃避 會埋怨 會自我放逐


  是個更接近真實存在的活生生的平凡普通人啊!!




  最後 僅獻給最後的絕地大師 路克天行者一句感謝


  辛苦你了路克!!




  --



  PS:補充一下


  推文大家還是不能接受面對凱羅忍的黑化 路克選擇是否要殺掉他




  這裡我還是要試圖幫路克說點話




  其實認真回想一下  如果是真正舊共和時期的老絕地 像雲度大師這種


  在面對凱羅忍的黑化時 一定就是把你宰了




  所以 路克會在面對凱羅忍時 會有想要幹掉凱羅忍的念頭


  其實也是因為他正在試圖扮演一個完美的絕地大師


  而一個完美的老派絕地大師 面對凱羅忍的黑化 解決的辦法就是把你宰了




  但是 也因為路克的天性跟老絕地的做法其實格格不入


  所以在他考慮要動手時 最後還是順應自己的天性 下不了手


  因此也才會有後面他龜縮在島上後 開始對老絕地的一些反思與反省



  但這裡還是可以看得出路克的內心與行為的矛盾


  比方說 對老絕地的批評與不滿 卻又小心翼翼的珍藏絕地書籍


  但珍藏的絕地書籍 其實自己也根本沒看過



  也許 也是因為這樣的內心與行為的矛盾衝突 加上對老絕地的懷疑與不信任


  所以最後路克沒有遺留下絕地的繼承者




  他只把原力的道理留給了芮


  卻把絕地的傳統束縛留在自己身上




  他讓自己成為最後的絕地大師 讓絕地在自己身上終結


  並讓芮知道 原力本來就是一種自然存在於大自然的力量



  不是因為有絕地 才有原力的存在


  而是因為有原力的存在 才發展出絕地



  所以就算最後絕地消失了


  原力也不會不見


  片尾的小男孩就是最佳的說明'
