url: https://www.ptt.cc/bbs/movie/M.1472702941.A.7C8.html
title: '[好微雷]誰是Black Jack？《使徒行者》特映心得'
content: '先幫沒看過港劇版的各位解答一下，沒看過也別擔心，因為電影版《使徒行者》只是將主

  結構承襲電視劇版本設定，但除了女主角跟一位配角外，幾乎所有人物設定都是原創，就

  連故事也以全新劇本來包裝，所以還是可以放心進場觀賞哦！


  《使徒行者》電影版幾乎沒有電視劇主角群，除了佘詩曼原來就是港劇版女主角，另外

  三位香港實力派演員－吳鎮宇、張家輝、古天樂，甚至反派角色都是電影版加入的角色




  故事看似簡單，就是找出誰才是「臥底」！但電影版的《使徒行者》劇情更加峰迴路轉，

  也更為緊湊，甚至將部分重心放在張家輝與古天樂的兄弟情上，讓這部警匪片多了一份「

  忠義」！




  而基本上這部電影就是不斷反轉再反轉，編劇的企圖心是想讓所有看這部電影的人搞不懂

  到底誰是人？誰是鬼？誰好？誰壞？而事實上，編劇也的確做到這點，不到最後一刻，你

  永遠不知道Who is Black Jack？


  張家輝與古天樂兩人在戲中，雖然有出生入死的革命情感作為後盾，但在利益與兄弟間卻

  又各自猜疑，在這樣錯綜複雜的兄弟情下，兩人的演繹更勝先前《掃毒》。除了演技了得

  ，導演也沒忘記讓兩人耍帥，預告出現過的兩人在餐廳準備攜手抗敵的一幕，從大螢幕上

  看，帥氣度一整個破表！戲中金句：「做兄弟，在心中，你FU不到，我說一萬個理由也沒

  用」




  當吳鎮宇飾演沉默冷靜的情報科主管－Q Sir碰上佘詩曼飾演的古靈精怪屬下－丁小嘉，

  兩人在戲中的火花也成為一大亮點。承襲港劇中的個性，佘詩曼再演起丁小嘉不僅駕輕就

  熟，在幾位演技實力派男星中，也毫不遜色。而即使有張家輝與古天樂的精采對手戲，吳

  鎮宇也沒被比下去，再次展現收放自如的演技，自然而不做作，在果斷與沉穩間拿捏得當

  ，不虧是影帝！




  另外，這部電影的動作場面據說是採用與《寒戰2》相同的動作指導班底，也就是錢嘉樂

  先生創立的「錢家班」！所以動作場面完全不用擔心，劇組甚至遠赴巴西毒窟拍攝，那種

  只有巴西特有的緊張氛圍也紮實的傳遞給觀眾，除了誠意還是誠意！


  繼2002年《無間道》上映後，「臥底」便成了警匪動作片的重要因素之一，但在各國警匪

  片都在玩「臥底」梗時，《使徒行者》又是靠著什麼樣的創意來玩出不一樣的名堂呢？就

  留待各位9/14(三)親自進場觀賞囉！

  -------------------------------------------------------

  《好·嗑電影》：


  --'
