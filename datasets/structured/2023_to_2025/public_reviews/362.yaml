url: https://www.ptt.cc/bbs/movie/M.1474045607.A.B50.html
title: '[討論] 使徒行者,觀後心得(有雷)'
content: '昨天去看了使徒行者，看硬底子演員就是爽

  劇情也很不錯，可是節奏快了點，搞的好像開了金手指破關一樣

  沒啥太多阻礙，答案就呼之欲出了

  雖然多數描述兄弟情，不過我覺得也可以視為人不會有真正的自由，因為都被綁死了

  性格決定成敗，而情感的枷鎖則決定性格

  以阿藍的智慧，當上整個集團首腦也不是難事，但他始終被對父親的思念束縛住，依舊想

  找回警察的身份(或者說想回歸單純的生活,不再當臥底)

  以少爺的才能，真的黑掉整批貨然後全身而退甚至取代阿藍也並非難事，更何況他還是個

  駭客(能夠駭進警署偷資料，功力會差到那去?)但他還是被兄弟情綁住了，最終沒下殺手

  以阿瑛的身手，在停車場交戰裡逃掉根本很簡單，但對阿藍的忠義，讓她最後魂斷停車場

  (這幕我看了覺得酸酸的，原本張家輝要抱著她逃，結果被其他保鑣硬架離開，而眼睜睜

  的看著她喪命，張的眼神從期盼轉為無奈心死)

  也許每個人的誕生，都有他的使命要完成，就如同片名一樣

  大家都是使徒、是行者

  在這個花花世界裡去完成自己該有的天命

  人，從來就沒有自由過啊


  --'
