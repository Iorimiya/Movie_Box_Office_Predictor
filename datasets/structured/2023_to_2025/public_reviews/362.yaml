  (好像是白色那套長袖長褲)他看起來超蠢的，

  然後Carrie拉著他給全部的拍片組員看XDDD


  我看7之前就看過Driver的訪問，但那一拿下來個人真的很尷尬...


  Carrie超可愛~

  安納金戴眼鏡也好帥喔(喂)

  謝謝R大,不過我還是尊重你但保持已見了XD


  我反而更討厭劇本要鋪陳這個腳色的過程><(忍住!)


  我覺得他好可愛! 所以老了在我眼裡還是那個可愛的路克!(盲目)


  超多張(私心)



  3Q~~~




  中二帥哥



  請問是說Sebastian Stan嗎?很多人說很像我是覺得還好~

  乍看有點像,看久就不像了!


  QQ

  越貼越多張(誤


  ：D




  謝謝分享！：）

  Chosen one給他點特權嗎XD

  XD


  他們好可愛！


  那件褲子很醜外加想打編劇的感想@@

  帥～～～

  謝謝圖！這角度更像了 Mark推文好好笑！



  XD 謝謝補充









  盧卡斯、David Prowse、Irvin Kershner（帝國大反擊導演）

  很喜歡這系列照片：）））



