content: "【樂搜搜片報】\n皮行者 / 外星異種 / 金剛川\n\n低價促銷的《皮行者》在 4K 頂尖畫質下，參照美國印第安族神秘巫師\n傳說，結合《後窗》、《E.T.外星人》等\
  \ 1980 年代經典作的懸疑，打\n造對著孩童伸出魔掌的千古女巫，讓劇中面對焦慮的男孩，不禁捏把冷\n汗。\n\n如果喜愛《突變第三型》任外星人控制人類的驚悚營造，在這推薦中價\n\
  片《外星異種》。從俄羅斯金鷹獎提名編劇阿雷格莫拉維奇卡，延續《\n異星引力》宇宙生物侵擾世間的精神，和監製費多爾邦達爾丘克參照《\n現代啟示錄》為劇中製造衝擊，打造被異形寄生的恐怖氣氛。\n\
  \n新上架的《金剛川》繼《八佰》由管虎再度還原奮力抗戰的血汗史，採\n取三個角度重新探索 1953 年金城反擊戰。\n\n所以，各位要挑哪部來看呢？\n\n==\n\
  \n<<超低特價>>\n\n《熾愛》\niTunes Store 購買連結 NT$90\n>> \n\n《皮行者》(4K)\niTunes Store 購買連結\
