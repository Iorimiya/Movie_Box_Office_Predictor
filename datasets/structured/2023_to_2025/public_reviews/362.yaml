url: https://www.ptt.cc/bbs/movie/M.1751249082.A.299.html
title: '[好雷] 夢行者保羅Dream Scenario'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  印象中沒有看完《我恨我自己》，所以當初《夢行者保羅》上映時沒有動念去電影院看。

  週六看完《客製化先生》之後，覺得自己似乎有點開了胃口，想要多來點諷寓現實的作品

  。《夢行者保羅》自動跳進我的腦中。沒想到還真的是我想要看的那種電影。


  《夢行者保羅》有A24的高品質製作，延續了導演對社群亂象、網路爆紅效應、迷因與取

  消文化等問題的觀察，用荒謬劇的方式展開，可以說是沒有冷場的一部多議題電影。雖然

  故事偏向意想天開的路線，議題深度非其所求，但那點到為止的集體潛意識、新創產業圈

  、連夢都想要參與的科技發展等都我覺得十分起勁。觀看時對於推動主角情緒變化的那個

  「還在腦中那本關於蟻群理論的書」，對我來說更是非常精彩的畫龍點睛之筆（抄襲者的

  說詞可以說是某種範本？）。總覺得在這電影中能看到多少現實，就有多理解這時代的詭

  異與悲傷。


  然而我覺得本片最大的成功在於請了尼可拉斯凱吉～他的演出讓這部一開始就注定悲劇的

  電影，有了足夠吸引人看下去的趣味。




  ***


  這裡是我的樂園:





  --'
