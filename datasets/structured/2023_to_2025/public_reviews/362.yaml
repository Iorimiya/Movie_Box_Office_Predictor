title: '[討論] 路克天行者的學習曲線合理嗎？'
content: '有各種星戰雷！(40年前的片子還要防雷嗎)
















  一般絕地武士培訓，從幼稚園等級的絕地幼徒就開始抓進聖殿


  到13歲成為學徒正式開始受訓 (安納金要成為學徒時，雲度還說他有點太老)


  路克在19歲才正式接受歐比王的指導


  訓練只有歐比王的短短幾天，以及尤達大師的數周(?)


  反觀安納金/達斯維達，有接受正式的學徒訓練多年


  且成為絕地武士後，經過複製人戰爭和帝國初期的大整肅，身經百戰





  天行者父子都是光劍第五型，應該不像歐比王對安納金那種有相剋的邏輯


  由此看來，路克能擊敗達斯維達是不是在強度上不合理？


  除了主角威能+劇情需要以外，有其他理論能解釋路克的學習曲線嗎？





  凱羅忍：路克不來！




  --

  高地優勢又來啦


  迷地原蟲的設定到底有沒有被推翻啊XD


  好像有設定是四缺三之後原力感受會降低(?)


  秋森萬vs秋森萬，應該要回歸基本面了ㄅ


  電影也是這樣演吧，如果不是安納金晚3分鐘來西斯早死了

  那三位大師根本被秒，基本上是一打一


  因為風暴兵的頭盔會阻礙視野所以射不準，合理 (有嗎)'
