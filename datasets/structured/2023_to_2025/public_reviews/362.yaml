title: '[討論] 星戰七-路克.天行者 是 凱羅.忍 的機率?'
content: '天行者路克，安納金的兒子，其原力非但超越西斯大帝，可能也更勝安納金


  但是在星戰七的預告裡，除了他撫摸 R2D2 外，就沒有任何據透，


  理論上，在星戰六後，就不太有可能有人或是局可以殺掉他，


  而在最新的預告中，看到 凱羅 對著 維德面具發表誓言...


  就讓人覺得，可能是兒子在對老杯說話一樣，


  而且在早期的星戰故事中，為了催毀西斯的源頭，


  路克也去接觸暗黑原力，


  因此個人認為，路克 和 凱羅 應該是同一人...


  不知道大家怎麼想呢????



  --'
