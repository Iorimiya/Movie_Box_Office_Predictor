title: Fw:[新聞]天行者家族將串起整個 Star Wars 系列
content: "距離 原力甦醒；王者回歸 倒數70天\n擁有一顆反抗軍之心(Rebel Heart)的 瑪丹娜 女皇也來幫忙\n倒數衣錦還鄉的那一天：\n\n\
  新聞網址：\n娛樂新聞-新浪新聞中心\n\n註:以下經筆者重新微編修校正譯名\n\n\n【天行者家族將串起整部(個) Star Wars 系列】\n\n\n新浪娛樂訊\n\
  日期:10月2日消息\n\n    據國外媒體報導，盧卡斯影業的總裁凱瑟琳·甘迺迪\n（Kathleen Kennedy）近日接受Costco Connection雜誌\n\
  採訪時透露，Star Wars九部電影(the Star Wars saga）\n是有一條貫穿始終的主線的，而這條主線就是「天行者家族」\n（Skywalker\
  \ family）。\n\n　「天行者家族」始於安納金·天行者（Anakin），他長大后\n成為了黑武士達斯維德。不過在他黑化之前，他和帕德梅生下了\n一兒一女，分別是路克·天行者（Luke）和莉亞·天行者（Leia）。\n\
  \n《Star Wars前傳三部曲》就是以天行者安納金為主線，而\n\n《Star Wars經典三部曲》則以路克和莉亞為主線。\n\n　　但是目前為止，我們還不知道新的《Star\
  \ Wars新三部曲》\n裡，誰是天行者家族成員。此前曾有傳聞說黛西·雷德利\n（Daisy Ridley）飾演的女主角「蕾」（Rey）正是莉亞公主和\n韓·索羅的女兒，如果是這樣的話，那麼她也將是天行者的血脈。\n\
  這就與凱瑟琳·甘迺迪的說法吻合了。\n\n　　當然，也有很大的可能，《Star Wars 7、8、9》終會出現\n多個「天行者」後代，但是現在迪士尼和導演J·J·艾勃倫仕\n\
  (台譯 J.J.亞伯拉罕）對此都守口如瓶，大家只好打開腦洞各自\n猜測，而重點懷疑對象自然是那些沒有公佈姓氏的角色。\n\n《Star Wars EP7：原力覺醒》（Star\
  \ Wars： The Force Awakens）\n將於今年12月18日上映。 倒數70天：\n\n《Star Wars EP8：副標預定》（Star Wars：\
  \ Episode VIII）\n 由《迴路殺手》(\"Looper\" 其他譯名：環形使者）導演 雷恩‧強生\n（Rian Johnson）執導，將於2017年5月26日上映。\n\
  \n《Star Wars EP9：副標預定》（Star Wars： Episode IX）\n  由《侏羅紀世界》（Jurassic World ）導演 科林·崔佛洛\n\
  （Colin Trevorrow）執導，將於2019年上映。\n\n--\n延伸英聽資訊"
