url: https://www.ptt.cc/bbs/movie/M.1473930700.A.CAC.html
title: '[ 微好雷] 使徒行者之到底是誰好誰壞啦'
content: '個人是一直都很喜歡這類型的警匪片

  所以使徒行者上了就想說去看一下


  因為一開始古天樂和張家輝這兩個角色是和警察吳鎮宇互為對立的立場

  所以很自然的會將古天樂和張家輝想成壞人

  但後續才發現原來古天樂和張家輝其中一人是臥底

  我覺得因為角色的立場不是很明確，進而導致劇情的發展很難揣測


  不過其實看完之後我一直有個疑問

  就是張家輝保鑣小英，和張家輝是什麼關係?

  在裡面劇情只有小英自己說她的命是張家輝救回來的

  但詳細的經過是什麼啊?

  還有古天樂和張家輝回憶一起搶銀行那段我也不是很明白

  他們是透過搶銀行認識的?那怎麼當到公司董事的啊XD

  有點好奇他們目前故事的前身是什麼


  --'
