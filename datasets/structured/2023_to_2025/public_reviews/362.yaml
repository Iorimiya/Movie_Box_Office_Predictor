url: https://www.ptt.cc/bbs/movie/M.1462968504.A.74D.html
title: '[新聞] 有影無？酷寒戰士神似路克天行者引熱議'
content: "新聞網址：\n\n漫威公司所推出的新好萊塢電影「美國隊長3：英雄內戰」票房驚人，在美國與台灣都開\n出紅盤，而當中飾演「酷寒戰士」(Winter\
  \ Soldier)一角的賽巴斯汀史坦(Sebastian\nStan)被美國網友發現長相神似飾演「星際大戰」主角路克天行者的馬克漢彌爾(Mark\nHamill)，還被合成兩人照片，引發網路熱議。\n\
  \n\n▲乍看之下還分不出誰是誰呢(圖片來源:推特)\n\n根據美國娛樂媒體《Hypable》報導指出，這個傳聞已經由來已久，但是透過照片的合成\n之後，兩人的神似度更令人驚訝。這張照片是美國網友根據馬克漢彌爾在拍攝「星際大戰\n\
  」經典三部曲時期的照片所合成，兩者神似度極高，連馬克漢彌爾本人發現後也大讚「簡\n直可以當我兒子！」\n\n\n\n▲另外一張私服比較圖(圖片來源:Hypable)\n\
  \n賽巴斯汀史坦出生於羅馬尼亞，後來隨著家人輾轉搬到奧地利維也納，並在德語學校就讀\n。到了12歲才搬到美國，真正的落地生根。賽巴斯汀的戲路廣泛，從大螢幕、小螢幕、獨\n\
  立製片與舞台劇都有涉獵，可說是硬底子出身的演員。為國人所熟知的作品有「魔男生死\n鬥」、「黑天鵝」等。\n\n而馬克漢彌爾本人也正在著手進行星際大戰第八部曲的拍攝工作，由於迪士尼有意推出一\n\
  些星際大戰前傳作品，如果要找一位演員來飾演年輕的路克˙天行者，這下子他們有著落\n了。\n\n--\n                            \
  \         05/12 03:41\n                                     07/23 16:37"
