title: '[新聞] 馬克漢米爾證實自己將不再演出路克天行者'
content: '43年的絕地大師！馬克漢米爾證實自己將不再演出路克天行者




  馬克漢米爾在近日接受《娛樂周刊》採訪時親口證實，他在《STAR WARS》系列中扮演路

  克天行者的時代已經正式結束。這意味著即使以後路克以任何形式出現在未來的星際大戰

  系列作品中，他也將不會再次回歸飾演該角色。




  馬克漢米爾從1977年開始就扮演這個經典角色，他在採訪中表示自己在《STAR WARS：天

  行者的崛起》後和這個角色的告別是「苦中帶甜」。 他說：「自始至終我都在扮演路克

  ，這些電影帶給我的影響遠遠超過了我們最初開拍前的預期。因此在《STAR WARS：天行

  者的崛起》中和路克告別的滋味既苦又甜。我熱愛喬治盧卡斯創作的角色，但我不想太過

  貪婪。

  」




  在《STAR WARS：天行者的崛起》上映後不久，馬克漢米爾就寫過一封真情流露的致粉絲

  信，信中感謝了粉絲對整個天行者故事和星際大戰宇宙的貢獻，並指出「隨著新生代主角

  加入，整個星戰宇宙會更加龐大」。




  路克已經永遠卸下了他的絕地長袍，但馬克漢米爾依舊對這個IP的未來充滿興奮。他稱讚

  《曼達洛人》這部影集是「回歸本源」，而且具有西部片的風格，令人印象深刻。






  --'
