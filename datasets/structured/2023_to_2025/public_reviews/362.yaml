url: https://www.ptt.cc/bbs/movie/M.1474037924.A.689.html
title: '[好雷] 使徒行者'
content: '使徒行者說它是部臥底間諜片，不如說它是一部溫馨感人兄弟片><


  雖然說要猜誰是臥底感覺是件很難的事情!但由於港片真的拍太多間諜片了


  導致於臥底出現的方式都大同小異，反正第一個知道、信任的往往都是錯的XD


  那這部片，有什麼值得吸引我的地方去看呢?


  我看臥底片，通常都不是看劇情，都是看演員內心的描寫。躊躇不定、爾虞我詐


  勾心鬥角，我往往都把自身投射在電影裡面。我也是一個主角，我該信任誰?


  哪個是真正的敵人?哪個又是不會背叛我的朋友?



  以下有雷








  劇情看似太過複雜，但蠻好理解，劇情方面我就不多加以描述


  想要來描寫電影中人物的內心想法!




  丁小嘉 : 電影的一開頭就是她，個性不難看出是傻大姐的風格


  很愛犯花癡，又喜歡跟她的上司(男友?)鬥嘴，實在是太可愛了!


  缺點就是心思比較不細膩，但在臥底片，這種人都會活到最後阿XDD


  雖然喜歡鬥嘴，但不難以看出她對於上司的愛以及執行命力的盡責


  還有盡忠職守的態度，口風很緊，就連中間假死亡也演得不錯。




  吳鎮宇 : 電影中的男配角，心思細膩沉著。處理任務有他自己的一套風格


  這種角色通常都吃力不討好，因為臥底會太強，每次都會破解辦案手法進而脫逃


  而且又放在警察的身分，港劇的間諜片，透露出自己是警察身分的人最後都會領便當阿!


  果然這次也不意外QQ 而在愛情方面完全是個智障，心中也很喜歡丁小嘉但又愛裝酷


  雖然最後為了保護丁小嘉而死真的是有帥到，但是這個代價也太大了吧!!




  藍博文 : 最讓人摸不著頭緒的角色，中間那個射子彈打摩斯訊號


  先把邵志朗射耳鳴在透漏身分，根本就帥到掉渣，話說那把槍子彈有那麼多嗎XD


  還偷偷被跟蹤，讓邵志朗知道他真正的底細，究竟是選擇相信兄弟，還是要保護自己


  我想在電影最後他已經做了決定!




  邵志朗 : 一開始感覺像位主角掌握大局，但後期卻被藍博文智商壓制


  長期以來都比不贏他的好兄弟，從心生起了忌妒之心，也就是因為這樣


  才會導致好兄弟藍博文為自己犧牲吧!




  每個角色都有他自己的性格，我最欣賞藍博文，是真正擁有最高領導者的頭腦


  以及形式風範，但我最愛小瑛，裡面打架動作也太性感，而且對藍博文死心踏地


  最後死了真的很令人不捨QQ 她可能不知道或許藍博文更愛邵志朗吧(咦?)XD


  --'
