url: https://www.ptt.cc/bbs/movie/M.1468892224.A.BAD.html
title: '[新聞] 使徒行者電影版虛有其名，網友說不如改..'
content: "新聞網址 ：  \n\n新聞標題  : 《使徒行者》電影版虛有其名？  網友：不如叫《掃毒2》\n\n\n新聞內容 :\n\n\n再三說明沒有劇透，只是預告片透，被網民封為神劇的《使徒行者》，電影版下月上映，\n\
  \n日前上載了新的兩分鐘的預告片，不少網民看完，覺得所謂《使徒行者》其實名存實亡，\n\n除了沒有爆seed哥(林峯)和苗僑偉外，故事以跨境集團販毒做背景，以大篇講張家輝、古\n\
  \n天樂的兄弟情，十足十2013年的電影《掃毒》，甚至有網民覺得這套《使徒行者》電影版\n\n，應該叫《掃毒2》才對。\n\n\n(使徒行者電影預告在下方呦!!!)\n\
  \n\n(原新聞網址有圖片跟文字敘述，想看圖...請在麻煩請點擊過去了)\n\n\n\n\n圖片1\n\n\n\n《掃毒》有古仔、家輝，青雲，《使徒行者》就有兩位，又是講兄弟情，的確容易令人誤\n\
  會。\n\n\n\n圖片2\n\n\n港劇的影帝陳豪都有份，但在預告片只出現兩秒，感覺演大咖的角色呀?\n\n\n\n圖片3\n\n\n無綫投資的電影，當然有無綫藝員，簽了邵氏的朱璇都有份，還有吳鎮宇，不過戲份不多\n\
  \n\n\n圖片4\n\n\n\n重點不是釘姐，而是歐瑞偉，劇中第一集死，但電影版又出現?一定是回憶片段，希望是?\n\n\n\n圖片5\n\n\n\n歡喜哥劇集中明明死了，但在電影中就復活，真的要入場看了，才能解釋劇情始末!!!!\n\
  \n\n\n圖片6\n\n\n\n戲中有韓國女演員。李成敏  (Clara)，著三點式泳裝兼做女殺手，看來是吸睛的。\n\n\n\n\n電影預告 : \n\n\n\
  香港0811上映，台灣不知道會跟進嗎?  想看呀!!!!!!\n\n--\n                                       07/19\
  \ 10:58"
