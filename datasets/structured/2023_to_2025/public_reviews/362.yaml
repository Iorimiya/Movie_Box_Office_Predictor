title: '[新聞] 星戰9洛城世界首映 天行者的崛起料締票房'
content: '星戰9洛城世界首映 天行者的崛起料締票房佳績



  （中央社洛杉磯16日綜合外電報導）星際大戰系列最終章「STAR WARS：天行者的崛起」

  （Star Wars: The Rise of Skywalker）今天在洛杉磯舉行世界首映，40多年來參演影星

  也共襄盛舉，內容大致獲得影迷好評。


  飾演星戰系列靈魂人物韓索羅（Han Solo）的第一代演員哈里遜福特（Harrison Ford）

  ，以及飾演天行者路克（Luke Skywalker）的馬克漢米爾（Mark Hamill）都出席今天首

  映會。


  另外，好萊塢重量級大導演史蒂芬史匹柏（Steven Spielberg）、黑人名導史派克李（

  Spike Lee）及奧斯卡影后法蘭西絲麥朵曼（Frances McDormand）也出席這場盛會。


  昔日飾演莉亞公主（Princess Leia）的好萊塢女星嘉莉費雪（Carrie Fisher）已於2016

  年辭世，未能與影迷見面。


  不過，嘉莉費雪在「星際大戰七部曲：原力覺醒」（Star Wars: The Force Awakens）的

  未公開片段，透過處理在新片問世。


  飾演星戰機器人角色C-3PO的演員安東尼丹尼爾斯（Anthony Daniels）告訴法新社：「我

  很驕傲能身在這裡，並參與其中。」


  分析師預測，星戰9本週末將開出2億至2.25億美元國內票房佳績，將名列影史開映週末票

  房最高影片之一。星戰系列為影史總票房第二高的系列電影，迄今累積逾92億美元票房。


  星戰系列片商、迪士尼執行長艾格（Bob Iger）表示：「如果你考量自1977年以來就愛戴

  這個故事的全球粉絲群，歷經40多年…今晚堪稱這9部電影的高潮，是非常重要的夜晚。

  」


  這場首映大致獲得粉絲好評。在整部電影中，觀眾在重要劇情轉折時鼓掌、嘆息及歡呼。

  粉絲威爾森（Katie Wilson）驚嘆，這部電影「令我極度興奮」。


  （譯者：陳正健/核稿：林治平）1081217




  新聞網址：





  --'
