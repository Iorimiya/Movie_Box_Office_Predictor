title: '[消息]星戰9即將開拍 演員陣容天行者兄妹在列'
content: '盧卡斯影業官方表示


  由J.J. Abrams執掌的星九以及另一部暫定標註為"Star Wars: Episode XI"新三部曲之一

  ，將相偕於8月1日於英國松林片廠開拍。


  星九揭露的陣容除了飾演凱羅忍、芮、波、芬、羅絲、赫斯等眾演員，新演員有[惡女馬

  克白]裡的安娜Naomi Ackie



  [羅根]裡的萊斯醫師Richard E. Grant


  最新加入的Keri Russell



  馬克‧漢米爾、嘉莉費雪、安東尼‧丹尼斯及先前已在網路上先行自爆的比利‧迪‧威廉

  也都確認加入。


  JJ表示如果避開了嘉莉費雪，無法為天行者家族的傳奇找到一個真正讓人滿意的結果。並

  強調不會另找人飾演或以CG重現，將以先前星七時未使用的鏡頭編修。


  對詳細新聞有興趣的板友可GOOGLE

  Star Wars: Episode IX’ official press


  --------

  不知為何，看到老將被召回，很高興能見到他們，卻也心痛得難受...


  --'
