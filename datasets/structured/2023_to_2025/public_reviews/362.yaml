url: https://www.ptt.cc/bbs/movie/M.1473933350.A.FBB.html
title: '[微雷]使徒行者觀後感'
content: '前言

  我也就開門見山地直說了，使徒行者是一部很好看的電影，劇情很出眾。

  看完一部戲之後才發現原來沒有所謂的大卡司，有的只是把劇中人物詮釋非常到位

  的演員。至於為什麼會這麼寫，後面的內容之中會有提及。


  目錄

  前言

  由港劇延伸出的電影作

  三位男主角介紹-介紹三位男主角的原因

  劇情簡介

  演員-吳鎮宇和余詩曼/張慧雯/古天樂和張家輝

  感到可惜的地方


  由港劇延伸出的電影作

  記得一開始聽到使徒行者四個字的時候感覺是陌生的，雖然接觸了不少兩地三岸的戲劇，

  但是對於港劇這一環正巧是我不太熟悉的，查了之後才清楚原來使徒行者是由港劇延伸拍

  成電影版本的。


  三位男主角介紹

  古天樂、張家輝、吳鎮宇，三位都是能夠獨自扛起一部戲的男主角，

  而他們對於九零世代的我有著相當深含意義。


  古天樂，一開始認識他是在尋秦記裡面擔任男主角。隨著時間的演變，他開始扮演各式各

  樣不同的角色，但是之中最多的是古惑仔類型的角色，戲路廣泛的他，在近幾年也有接不少

  商業形式的喜劇片，但是可以從竊聽風雲等等的片子來看，會發現他的演技已經是越來越內

  斂了。


  張家輝，印象最深刻的就是劉德華賭俠2001身邊的小老千，化骨龍這個角色。

  黑馬王子的華弟，當然還有他和古天樂合作的中華賭俠裡所扮演的朋友兼跟班。

  有很長一段時間他都是扮演這種小弟形象的角色。

  講到這邊不得不提一下，張家輝最早是在李修賢的電影公司做幕後人員，

  之後就開始了演員的生涯，他的這種小弟類型配角的形象，是和李修賢搭檔開始的。

  但是從赤柱監獄系列的電影以來，可以發現張家輝開始轉型了，直至證人這部片得影帝之

  後，他的轉型才開始受到大家的注目，而在那個時期裡也是香港電影的大轉型。

  張家輝很成功的以他多年努力琢磨出來的演技開始受到影壇人的關注，此後幾年也成了金

  馬獎入圍的常客。


  吳鎮宇，典型的千面郎君，他的定位從來不是觀眾決定，而是手上的劇本來決定，

  演什麼就是什麼。

  最典型的舉例就是從1996年所演的三部戲可見一般古惑仔的靓坤、旺角揸fit人的叻

  君、決戰古惑女的佐治，就能看的出來同樣都是流氓，他卻能詮釋出讓觀眾印象深

  刻的三種不同的男主角。


  為什麼要花這麼多時間來介紹這三位演員?

  因為使徒行者的導演成功的讓這三位男主角在這個故事裡面都很有存在感。

  而這個存在感不是作為古天樂、張家輝、吳鎮宇，那種大卡司的存在感。

  而是劇中他們所扮演的人物少爺、老闆、Q sir三個人物三個故事給人的鮮明印象。

  想要掌握好大的卡司是很不容易的事情，很考驗導演及編劇的對於每個場景

  的掌鏡能力，在人物性格的刻畫上面，要怎樣才能善用元素來平衡搭配，

  不會顧彼失此這一點很重要，而且也是很不好掌握的一點，但是這一點使徒行者的

  導演做到了。


  劇情簡介

  警方負責臥底行動的指揮人Q SIR，收到一條來自失聯許久的臥底的訊息。

  收到臥底訊息的Q SIR，則派遣資深臥底阿丁前去和這名臥底接頭。

  故事也就這樣開始了....


  劇本

  劇情方面沒有什麼能夠挑剔的地方，很有劇情性。

  也有把握住「臥底」這個主題，在節奏上面也是相當流暢，

  沒有絲毫給人拖戲的感覺。


  演員部分

  吳鎮宇和余詩曼。

  只要劇中有余詩曼的地方，都會讓人感到很開心，她就是劇中的一個笑果。

  當這個笑果如果再配上一個懂得捧梗的人，那就是大大的絕配了。

  余詩曼對手戲最多的就是吳鎮宇，兩人在劇中搭配起來相得益彰，

  他們在劇中的場景雖然並不是最多的，但是吳鎮宇飾演的Q sir那看似漫不經心

  實際上對什麼都很在乎的形象配上余詩曼飾演的阿丁看似大辣辣內心小女人的特質

  不得不說讓人印象很深刻。

  如果使徒行者整部戲的劇本是偏灰黑色的，那他們兩位就是讓整這灰黑色看起來柔

  和的重要成分，柔和但是不搶戲，就是一個很棒的點綴。

  相信看完的人至今回想起使徒行者對於Q SIR與阿丁這一對搭檔至今仍然是歷歷在

  目吧。


  古天樂、張慧雯、張家輝。

  疑?古天樂和張家輝我知道，那張慧雯是誰?相信不少人對於這個名字都感到陌生吧?

  但是有看過電影的人應該都印象很深刻，張慧雯所飾演的女秘書身份成功連結古天

  樂所飾演的少爺和張家輝所飾演的老闆的重要配角。

  雖然台詞不多，戲份比起女一阿丁余詩曼來的少許多。但是那在人前精明能幹、

  在親近的人面前溫柔婉約、在敵人前勇敢果斷的女秘書、女保鑣形象，讓在爾虞我

  詐的劇情當中，讓觀眾溫暖了起來。而這一種人情味的特殊表現形式，也是香港電

  影的一種魅力。張慧雯利用僅有的戲份將這個機會把握住傳達給觀眾，不得不讓人

  為之一亮。


  古天樂、張家輝。

  如果說已經有了一名好的導演和編劇，也有了絕佳的配角來襯托，

  那主要演員除了把戲中人物詮釋得淋漓盡致之外還需要做些什麼?

  就是善用那些準備好的題材，將電影的整體提升到最好的境界。

  古天樂和張家輝兩位不愧是身經百戰的演員，他們不僅詮釋好了劇中的角色之外，

  還將提供給他們的素材給發揮到最好的程度，和他們有對手戲的人都讓我印象深

  刻，他們成功的帶動了電影整體的另一種氣氛，除了精彩的爾虞我詐之外，

  也帶動了屬於香港電影特有的人情味的氣氛，因為在壞的人也有內心柔軟的一面。

  這也是近幾年來香港電影比較缺少的一個元素。

  近幾年來越來越沉重的香港電影，如證人、大追捕、竊聽風雲、赤道、寒戰等等的

  片子，都意味著人性的現實成了亞洲電影的主流口味。

  但是張家輝和古天樂兩者的對手戲，成功的詮釋出了另一種風格，同樣是用人性，

  但是卻是用另一種寫實以及委婉方式去演出，這個效果我想是成功的。



  讓人感到可惜的地方

  比較可惜的是劇中反派人物部分刻畫的不足。比較像是走過場的感覺。

  也許是上述的男主角和女配角都太過鮮明了，導致反派人物的存在感較為不足，

  這一點是比較可惜的部分，但是這一點並不影響劇情的演繹，只能說是小小的缺

  點，比較屬於吹毛求疵的部分，但如果做到這一點，相信原本就精彩的劇情會因此

  而更加精采。



  --'
