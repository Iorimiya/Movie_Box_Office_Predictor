url: https://www.ptt.cc/bbs/movie/M.1473896152.A.609.html
title: '[超好雷] 使徒行者-值得一看再看 '
content: '看到網路上的評價有褒有貶


  但是又看到中國那裏的票房又是很高的


  想說就一定要探個虛實


  但是從來沒一個人看過電影的我



  於是就拉著我家那隻去看


  結果根本超。好。看


  前面的追逐場面有一定的水準，


  也有非常逗趣令人哈哈大笑的橋段


  不過更精采的是人物們的表現


  藍博文(張家輝)、邵志朗(古天樂)


  從一開始就諜對諜的飆戲，


  感覺各有計謀(沒想到好兄弟也會是間諜(大驚)


  但是其實又很有情義


  本劇中也很完整的把情義的細節表現出來


  電影的最後一個片段也真的很讓人省思(這就不爆雷了)


  ------------以下是雷-----------


  而且最後本劇能領便當的都領光


  吳鎮宇(Q Sir)與佘詩曼(丁小嘉)最後的那一幕


  真是令人糾心，連我旁邊的男人都倒下來讓我抱了


  可見這部戲的感情刻劃非常的動人



  總之這部戲非常的好看，我還會再看第二次的!!










  --'
