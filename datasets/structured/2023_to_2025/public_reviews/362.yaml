url: https://www.ptt.cc/bbs/movie/M.1508067477.A.C90.html
title: '[討論] 黑武士的演員為什麼沒有大紅？？'
content: '很奇怪


  黑武士現在幾乎已成為美國文化的一個標誌，


  照理說


  演黑武士的演員應該超級無敵紅才對啊


  能夠演到這個角色對演員來說應該是至上榮譽


  但是海登,克里斯唐森（Hayden Christensen)沒有大紅大紫


  對比同年齡層的安德魯加菲，晚出道，現在是當紅人氣演員，都二代蜘蛛人在叫的，


  但從沒聽說黑武士最近要演什麼電影?


