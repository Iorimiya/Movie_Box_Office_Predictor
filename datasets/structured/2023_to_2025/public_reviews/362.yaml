url: https://www.ptt.cc/bbs/movie/M.1513405930.A.AB9.html
title: 'Re: [討論]我想為星戰八的 路克天行者 平反一下'
content: '原PO說錯了吧，放逐自我的路克質疑的並不是絕地武士的教育和教條，路克質疑的


  是他自己，他被認為是大英雄，但忍的背叛和墮落讓他認清他並不是個好老師，不


  是什麼大英雄。


  「因為我是天行者路克，所以你期待我一人拿著光劍和帝國艦隊拚了？」這句話講白


  點就是：你這是要我背負我背不起的責任！


  尤達大師要路克去幫助芮，路克反駁：「我無法成為她需要的那樣子。」這句話講白


  點就是：我只是個徒有虛名、名過其實的老屁孩 ，不是什麼大英雄和睿智的導師！


  但後來路克就真的一人拿著光劍去跟帝國軍隊拚了！


  勇於面對失敗和承擔責任，就讓路克從一個不斷自責、逃避的老屁孩，變成一個真正的絕


  地大師！


  尤達大師出現時就叫路克：「年輕的天行者路克」，路克其實已是個老頭子了，尤達大師


  這麼叫，是指著路克的內心叫的，路克雖然年紀大了，但其實內心還是個不成熟的屁孩，


  心理年齡跟生理年齡實在不相符，這當然是缺陷，但重點應放在路克後來的重新振作，


  就像尤達大師片中講的：「失敗是最好的導師」


  --'
