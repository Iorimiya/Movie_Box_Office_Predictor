title: '[新聞] 耶誕假期電影賺飽飽 天行者再度笑傲江湖'
content: '耶誕假期電影賺飽飽 天行者再度笑傲江湖



  （中央社洛杉磯29日綜合外電報導）對許多電影來說，耶誕假期果然是豐收時節，這個週

  末電影票銷售額來到2億美元，較去年同期增加6.3%。


  收穫最豐的，是迪士尼和盧卡斯影業的「STAR WARS：天行者的崛起」（Star Wars: The

  Rise of Skywalker），3天週末期間有約7200萬美元進帳，耶誕5天期間有1億3600萬美元

  入袋，北美票房累計破3億6100萬美元門檻，且不到2週時間全球已經有7億2500萬美元成

  績，有望成為今年全球第10和全美第7的賣座強片。


  「天行者的崛起」這個週末再次以懸殊幅度領先亞軍片、索尼出品的「野蠻遊戲：全面晉

  級」（Jumanji: The Next Level）。由巨石強森（Dwayne "The Rock" Johnson）、凱文

  哈特（Kevin Hart）主演的最新「野蠻遊戲」，27至29日期間北美有3440萬美元表現，25

  日以來有5900萬美元成績，國內總票房來到1億7545萬美元。


  連續第2週排名第3的是迪士尼動畫「冰雪奇緣2」（Frozen II），週末收入1700萬美元，

  5天耶誕假期海撈2600萬美元。「冰2」上映迄今北美票房來到4億2100萬美元，全球吸金

  12億1000萬美元，超越2015年的「小小兵」（Minions），成為影史第3賣座的動畫片。


  排第4的是翻拍露易莎‧梅‧奧柯特（Louisa May Alcott）經典小說「小婦人」（

  Little Women）的「她們」（Little Women）。根據美國娛樂業界週刊「綜藝」（

  Variety）計算，「小婦人」被改編至少7次，但葛莉塔潔薇（Greta Gerwig）執導的最新

  版佳評如潮，首映在美國加拿大有1620萬美元進帳。


  排名第5的是福斯/迪士尼新片「變身特務」（Spies in Disguise），這部由「ID4星際終

  結者」威爾史密斯（Will Smith）和「蜘蛛人」湯姆霍蘭德（Tom Holland）幕後配音的

  兒童動畫片，吸金1340萬美元。


  排名第6到第10的作品依序為：「鋒迴路轉」（Knives Out），990萬美元；「原鑽」（

  Uncut Gems），940萬美元；「重磅腥聞」（Bombshell）480萬美元；「貓」（Cats），

  480萬美元；「李察朱威爾事件」（Richard Jewell），300萬美元。


  （譯者：蔡佳敏/核稿：陳政一）1081230



