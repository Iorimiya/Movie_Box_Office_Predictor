url: https://www.ptt.cc/bbs/movie/M.1702306702.A.8F8.html
title: '[好雷] 凱吉的【夢行者保羅】'
content: '夢行者保羅，由A24出品，凱吉主演。故事講述一名教授不斷出現在大眾的夢裡，因而一

  夜爆紅。劇情古怪又新穎算是A24的招牌之一了，加上凱吉的演出，自然讓這部片又更具

  魅力。

  -


  當然要先提凱吉的部分，這部真的是凱吉大禮包，因為有夢境的關係，所以能同時享受他

  內斂和瘋癲的演技，而保羅的世界逐漸崩壞後，還能看到他感性又深情的演出。但我覺得

  最精采的是他能夠把如此平凡的角色演得恰如其分，還帶有一點喜感，加強了故事的荒謬

  ，而劇情該嚴肅時，他的喜感也沒消失，卻變成了淡淡的哀傷。不愧是凱吉！身為粉絲的

  我看完很滿足！

  -


  很顯然劇情沒要解釋大家夢到保羅的緣由，而是著重在保羅的生活如何被這個現象影響。

  保羅就像很多紅極一時的網紅，在短時間內快速崛起，變成每個人口中的話題，但一段時

  間後又消失在大家的生活中。


  這現象本身沒什麼大不了，大家本來就愛跟風，但保羅好死不死是一個平凡低調的老好人

  。只要不過份，保羅不太會拒絕他人的請求，甚至還常常是弱勢的一方。一開始知道自己

  爆紅後，也沒博取過多的關注，而是希望自己能利用這波風潮來幫自己賣書。


  但當大家的惡夢開始之後，故事想討論的議題也逐漸明朗。除了諷刺群眾現象以外，還特

  別點名了現在流行文化中的「取消文化」，而凱吉飾演的保羅就像那匹烙單的弱勢斑馬，

  因為過於顯著而被掠食者（群眾）盯上。啪，工作沒了、朋友沒了、連家人都開始不喜歡

  自己。牆倒眾人推後，大家都拍拍屁股走人。


  最後保羅落得什麼下場，其實沒什麼人在乎，反倒是商人看準這現象所帶來的商機，順勢

  推出科技產品。而保羅即便在過程中不斷反抗、試圖為自己作主，最終仍屈服於群眾壓力

  ，先是道歉、後是到法國賣書（甚至不是自己想寫的那本，而是大家想看他寫的），還用

  了因自己而催生的科技產品來夢回妻子身邊。

  -


  雖然劇情過於負面且誇張，但導演充分表達他對於取消文化的不滿，當人們過於將自己的

  情緒投射在一個明顯的目標物身上時，從沒想過那個人也有自己的情緒、也有自己的惡夢

  ，只因為今天我們隱身在人群當中不被注目，就沒替他人想太多。雖然聽起來很可惡，但

  我們真的容易不自覺做出這樣的事對吧？

  -


  很多人說像是查理考夫曼的作品，我覺得概念很像，但還差那麼一點點，查理考夫曼還會

  再更瘋一些XD但這部也算是佳作了！而且有凱吉呢！真是恭喜他擺脫爛片王，近年來演的

  片子都很有趣，希望他進軍電視圈後能帶來更多有趣的作品。


  --

  對呀，步調比想像中快，故事很有趣、不沈悶。'
