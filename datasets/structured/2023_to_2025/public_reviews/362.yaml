title: '[新聞] 原力助攻 天行者的崛起輕鬆登北美票房龍頭'
content: "原力助攻 天行者的崛起輕鬆登北美票房龍頭\n\n最新更新：2019/12/23 12:26\n\n（中央社洛杉磯22日綜合外電報導）銀河系好人的原力依舊強強滾。追蹤票房表現的「北\n\
  美院線聯盟」今天通報，「STAR WARS：天行者的崛起」（Star Wars: The Rise of\nSkywalker）首映在北美海撈1億7550萬美元。\n\
  \n美國娛樂業界週刊「綜藝」（Variety）報導，這部迪士尼出產的影片寫下影史12月開片\n第3高紀錄，成績僅遜於另外兩部星戰系列片「STAR WARS：原力覺醒」（Star\
  \ Wars:\nThe Force Awakens）和「STAR WARS：最後的絕地武士」（Star Wars: The Last Jedi）\n。\n\n\
  「天行者的崛起」全球有3億7400萬美元成績，證明星戰系列仍是好萊塢最強吸金機之一\n，但表現遠不如2015年「原力覺醒」國內5.17億美元和2017年「最後的絕地武士」全球\n\
  4.50億美元表現。\n\n然而，天行者的崛起週末把其他對手都打趴。索尼以遊戲為靈感的「野蠻遊戲：全面晉級\n」（Jumanji: The Next Level）20日至22日2610萬美元收入，僅達天行者的崛起的1/7。\n\
  \n排名第3的是同樣出自迪士尼的「冰雪奇緣2」（Frozen II），收入1230萬美元。\n\n排名第4的是把安德魯．洛伊．韋伯（Andrew Lloyd Webber）歌舞劇「貓」搬上大銀幕的\n\
  環球同名電影，入袋650萬美元。本片導演是因執導過「王者之聲：宣戰時刻」（The\nKing's Speech）和「丹麥女孩」（The Danish Girl）而備受影評推崇的湯姆霍伯（Tom\n\
  Hooper）。\n\n儘管「貓」網羅「X戰警」伊恩麥克連（Ian McKellen）、「莎翁情史」茱蒂丹契（Judi\nDench）、「夢幻女郎」珍妮佛哈德遜（Jennifer\
  \ Hudson）、「路德探長」伊卓瑞斯艾巴\n（Idris Elba）等A咖助陣，評價卻意外的糟，「衛報」就稱「貓」是「一團恐怖的毛球\n」。\n\n本週排名第5的是獅門謀殺懸疑片「鋒迴路轉」（Knives\
  \ Out），票房610萬美元。\n\n排名第6到第10的作品依序為：「重磅腥聞」（Bombshell）510萬美元；「李察朱威爾事\n件」（Richard Jewell），260萬美元；「皇后與瘦子」（Queen\
  \ & Slim）190萬美元；「\n黑色聖誕節」（Black Christmas）180萬美元；「賽道狂人」（Ford v. Ferrari）180萬\n美元。（譯者：蔡佳敏/核稿：陳亦偉）1081223\n\
  \n--\n帝釋所問經講記78頁批：與那些相信生命永恆\n而讚頌的天堂沒有很重大的不同。這信仰很可能是基於那些想宣揚的佛教徒的著作。\n毗婆舍那講記(含法的醫療)說明如何修四念處增加智慧斷除所有煩惱。\n\
  才是 是\n、、、、()、、是。\n  是    是\n\n--"
