url: https://www.ptt.cc/bbs/movie/M.1473846962.A.57B.html
title: '[微好雷] 使徒行者-身份瘋狂切換'
content: '這真是一部看得我腦袋差點打結的電影，

  每個主角在劇情安排上都有兩個以上的身份，

  說真的，寒戰都沒這個複雜。


  --小小防雷線--


  首先登場身份瘋狂切換：誰是Black Jack？

  古天樂

  一如既往痞痞的似壞似好，似把妹又似認真在幹什麼事的演法，

  我早就猜出他有問題了！（自以為XD）

  張家輝

  一如既往總是像木頭的壞人卻心地極好，最後那段情和義值千金有讓我呆了一下。


  第二登場身份瘋狂切換：歡喜哥

  歡喜哥真是我完全無法理解一開始就埋的乾爹線，

  一下親手殺了乾女兒、一下又變成救援投手、一下又變成老婆被殺的復仇臥底。


  這部電影太多身份瘋狂切換以致於

  我本來以為警官吳鎮宇才是有問題的那個（誰叫他常常演壞人），

  言歸正傳，這部片我覺得要看第二次才能比較釐清一些細節，

  編劇埋了太多小線索在裡面了。

  尤其到底誰是BJ，為什麼古天樂知道那麼多BJ的事（知道沒後手跟他接應），

  我還在打結中。


  有人去看了也可以幫我解答一下:))


  --'
