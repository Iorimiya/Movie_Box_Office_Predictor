url: https://www.ptt.cc/bbs/movie/M.1429030723.A.ECD.html
title: '[好雷] 行者 每一小步都是人生大智慧'
content: '覺得這部好片可能因為玩命關頭熱映中而被淹沒

  以致迅速下片 所以想來推薦一下




  ----------------------------------


  踏進戲院的前一刻，其實是很擔心的。從沒看過任何一場舞團表演的我，

  竟然挑戰看一齣長達兩小時半的紀錄片，尤其前一天我還看張艾嘉的<念念>

  看到差點睡著。但電影第一幕，從一隻可愛的貓開作為初始鏡頭，慢慢帶到

  團長緩緩地敘述自身的故事，很自然的就突然被帶入電影的特殊氛圍裡。


  行者是一部花了長達十年拍攝完成的作品，從核心人物無垢舞團團長林麗珍

  作為整部戲的出發。無師自通即學會編舞創作的她，所有的創作皆來自自身

  的生活體驗，無論是小時候在基隆廟口幫忙母親的叫賣經驗，或是讓團員跟

  著媽祖遶境進行廟宇儀式文化的觀察，甚至是直接在 山川 森林 海洋 湖泊

  等地進行排演 尋找靈感，透過與大自然 整個環境的互動產生能量後轉化成

  每一個非常細微的肢體語言。


  這部戲動人之處在於，戲裡談的不只是舞蹈，更多的是她人生哲學的格局及

  高度。與一般人一樣，30多歲的她，陷入生命的茫然，決定效法土地休耕的

  重要性，毅然決然的停止舞團長達六七年，除了陪伴自己孩子成長外，更重

  新尋找創造靈感。而她復出後的 接連三部作品 <醮>、<觀>、<花神祭>，

  探討人與鬼神及環境的關係，完全將台灣土地的力量呈現的淋淋盡致，

  並多次受到法國藝術節的邀請。而她對工作的態度強調每一次盡力而為的

  專注力，你可以感受到那淹沒在速食文化的工藝精神又再一次的被看到。

  (內心O.S. : 這才是真文創 !!!!）


  片名取名“行者”主因為舞蹈裡很強調每一個步伐。當腳步踏在土地上時，

  去感受你與土地之間的連結，所以每個緩步其實都有它背後想表現意涵，

  讓我聯想到“接地氣”的概念。此外，她提到，有觀眾說看不懂她的戲，

  但看完後晚上都睡不著覺。她認為看不懂也很好，她認為舞蹈像詩，

  重要的是帶給觀眾一個觸動。在看這部片的過程，內心一直處於很感動

  的狀態，幾乎每一小段故事裡，那情感豐沛的程度，讓你很難不被打動

  。這好像也是我第一次看電影，靜靜的看著字幕跑完，才離開座位，

  好像完成某一種心靈淨化的儀式。直到走出戲院，那些感動突然又排山倒海

  而來，而當晚我也莫名地做了個好夢。


  雖然紀錄片真的很冷門，但私心以為，這是我今年為止最喜歡的電影。

  推薦給每一位感覺在人生中茫然所措需要能量的人。


  p.s. 觀影前記得上洗手間，片長兩小時半超長。


  --'
