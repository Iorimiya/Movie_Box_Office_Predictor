title: '[好雷] 使徒行者'
content: '防雷






































  應該算是近年來最有名的港片吧

  很久以前就聽過片名,即使現在才看

  看完覺得還算不錯吧,以現在港片來說

  動作戲不算多但恰到好處的加分

  只是劇情一直在反轉,反到我頭真的有點暈

  不過還在可以的範圍內,個人沒有很喜歡而已

  我特別喜歡一開始假裝槍殺女警的那位大叔

  笑起來威脅感十足,笑到每個人心裡發寒

  所以他在聽老婆怎麼死的那段很精彩

  即使知道高機率會因為劇情需要忍下來

  還是捏了冷汗,可惜結尾他沒有親手料理那個王八蛋

  聽說還有評價相對不怎麼樣的續集

  果然還是逃不過續集魔咒嗎哈哈哈

  也是,古天樂和張家輝的搭檔演出很難超越

  就連他們自己也不一定能更上一層樓


  ----

  Sent from  on my Samsung SM-S9280


  --

  一旦踏出去，就無法再回頭，朝三千世界的血海而去


  --'
