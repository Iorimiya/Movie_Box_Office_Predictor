title: '[好雷] 夢行者保羅:愛護凱吉哥'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  夢行者保羅是A24製片公司最新出品的劇情片，講述保羅是一個大學教授

  開始出現在女兒和學生的夢境中，隨著夢境的轉變，事情變得有點難收拾


  看的出來A24最近一直往大眾口味靠攏，從媽的多重宇宙就看的出來，不再

  堅持拍口味生硬的劇情片，畢竟娛樂大廠迪士尼也快差不多了


  凱吉哥可不是緋紅女巫，夢境進入他人夢境一開始只是啥都不做，後來可能是

  因為情緒變化，開始有傷人的舉動，於是整個社會開始迫害凱吉哥，甚至有人

  問他要不要上著名播客:美國館長喬羅根，以及心理學家喬登彼得森

  分享自己被取消文化傷害的經驗

  最後事情和「破天荒」一樣沒有理由的落幕了


  整體平淡中帶有一點韻味，喜歡凱吉的可以去看一下


  --'
