url: https://www.ptt.cc/bbs/movie/M.1546753744.A.FEA.html
title: '[大負雷]冰封俠2 : 時空行者 '
content: '真不知道是不是小時候的回憶太美好


  還是單純是新版的急凍奇俠是真的太糟糕


  難看到我文章都不知道要如何下筆?


  劇情不用說了 續集穿越回明朝想改變歷史

  但bug一大堆 一堆武林高手穿越回去


  還順便宣揚了一下抗日理念 看了有夠尷尬


  反派任達華還順手抄了一把散彈槍回去耀武揚威

  說好的打戲呢? 我還以為是在看槍戰


  不過也是 看任達華穿著笨重的盔甲 連走路都困難了

  還要他打戲 能看嗎?


  主角甄子丹一貫的臉攤演技 旁白說回到過去想改變歷史

  拯救被屠村 洗刷冤屈


  但完全沒作為的動作跟表情 你不是已經知道過去會發生甚麼事了嗎?

  結果回到當初 一點嘗試改變歷史的作為也沒有


  最後領悟 人類就算能穿越時空 但也無力改變歷史

  於是我成為了時空行者 (這到底在演三小?


  黃聖依造型很糟糕 可有可無的腳色  除了被散彈槍轟死之外

  完全不知道出來幹嘛


  打戲糟糕 只能演葉問的丹丹 簡直是票房毀滅機器

  還順便毀了我小時候的美好回憶









  --'
