title: '[討論] 迪士尼敢讓星戰本傳沒有天行者嗎?'
content: '星際大戰前6部電影都圍繞在天行者上，星際大戰也可說是天行者家族的故事



  但我認為星際大戰8本來就是要告訴大家:我們要告別天行者了



  從8的製作過程也看出迪士尼和盧卡斯影業的滿滿信心



  但8上映後在影迷的評價卻是前所未有的大分裂



  從史上最大的二周票房跌幅可看出不少影迷要退出了



  現在迪士尼還敢在第9集正式告別天行者家族嗎?


  --'
