title: '[無雷] 星際大戰 9 天行者的崛起 失望之作'
content: '應該無雷


  星際近代系列

  我個人排名是

  星戰七>>>俠盜一號>>>星戰八>>>韓索羅>>>星戰九


  今天衝了首場星戰九

  覺得很失望


  對白很無趣 一些嘴角勉強才能上揚的笑點

  角色性格表現也很扁平


  我還蠻喜歡JJ的戲 以前有笑點有熱血的點

  但這部都感受不到


  一些新人物出來有跟沒有一樣(雖然他們也不是重點)


  星戰部分覺得沒有七八那種流暢速度感

  光劍對戰也沒有令人熱血沸騰


  身世之謎解答的瞬間也只是覺得   就這樣


  戲裡面一堆致敬的東西 也只讓我覺得在看博物館陳列


  還有一些投影  讓我想到一些綜藝節目  想讓人大喊 讓我們一起來看VCR


  最終決戰我內心一片平靜


  整體而言就是蠻失望的QQ


  枉費我很喜歡前面幾部的說


  以上.....難過


  --'
