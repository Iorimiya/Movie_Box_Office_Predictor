url: https://www.ptt.cc/bbs/movie/M.1474017730.A.E68.html
title: '[普好雷]遊走在正邪之間的使徒行者 '
content: '在沒看過電視劇的情況下跟朋友去看


  原本沒抱什麼期待，結果還蠻出乎意料XD












  防雷。









  這部劇情大致就是圍繞在尋找Black Jack、兄弟情誼、毒品交易之間打轉


  劇情緊湊精彩，而釘姐跟Q Sir的互動又讓整部劇情顯得沒那麼沉重





  「如果有一天，你讓我知道你出賣我，你想我怎麼做？」


  「如果有一天，你讓我抓到你是叛徒，你想我怎麼做？」



  阿藍跟少爺看似玩笑的對話，背後暗藏的心思只有當事人才懂


  誰藏著計中計、誰還留了最後一手，不到最後一刻不知道誰能存活下來





  歡喜哥跟董餐桌上的對戲十分精采！


  充分表現出董疑神疑鬼的個性，以及歡喜哥的謹慎穩重



  最後歡喜哥雖然報了仇，卻也因為無法證明自己的身分而被逮捕


  （這邊其實有點不確定，我覺得是直接被逮捕但朋友覺得他乾女兒應該也能證明？）





  看完這部跑去找了主題曲來聽，覺得歌好聽、歌詞也寫得很貼切



  電影主題曲《行者》草蜢






  --'
