title: '[新聞] 《STAR WARS :天行者的崛起》海報劇照釋出'
content: '《STAR WARS : 天行者的崛起》海報劇照釋出



  《STAR WARS : 天行者的崛起》劇照。（迪士尼提供）


  【大紀元2019年08月26日訊】盧卡斯影業《STAR WARS : 天行者的崛起》於上週末登場的

  迪士尼D23博覽會釋出最新款前導海報。


  這次海報透露出一些訊息，除了出現大家一直想看到的芮VS.凱羅忍光劍對決外，背後更

  隱約可以看出曾出現在星際大戰電影中的大魔王——西斯大帝（白卜庭）的邪惡頭像，間

  接證實了前陣子前導預告中造成粉絲熱烈討論的結尾笑聲就是西斯大帝這件事。


  《STAR WARS : 天行者的崛起》前導海報，登場!

  代代相承的衣缽，天行者傳奇最終章

  #以下開放劇情預測

  #願原力與你同在



  在這次的D23博覽會場上，繼《STAR WARS : 原力覺醒》創下全美票房冠軍後，再度回歸

  執導系列最終章的億萬導演J.J. 亞柏拉漢更與片中演員芮、芬恩、藍道、丘巴卡、波與

  蘿絲一同現身會場。


  《STAR WARS : 天行者的崛起》是迪士尼買下盧卡斯影業之後的第五部作品，同時也是星

  際大戰正傳故事的第九部曲，更是從1977年開始橫跨42年的STAR WARS 天行者傳奇（

  Skywalker family）故事最終回。


  必看亮點有： 系列作最後一集，不管是不是粉絲都需要跟上的全球風潮；最原始反派西

  斯大帝白卜庭再現身，粉絲討論度100%；海報直接顯現大家最期待的光劍對決。



