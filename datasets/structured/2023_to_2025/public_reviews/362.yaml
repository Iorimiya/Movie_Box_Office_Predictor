url: https://www.ptt.cc/bbs/movie/M.1429196721.A.6A2.html
title: '[無雷] 行者 The Walkers '
content: '這是一部關於台灣舞蹈家-林麗珍的紀錄片，一位需要被看見的台灣之光，


  紀錄片本身我想是沒有好壞可言，令人驚豔的是本片少了很多訪談的片段，


  反而更聚焦在舞蹈肢體之美上。行者忠實地記錄了林麗珍的生活點滴，


  以及對於舞蹈藝術的堅持與追求，那種一絲不苟的態度完全的令人敬佩。





  而最令人感動的是林麗珍的編舞靈感都來自生活，舉凡文化、宗教以及自然


  等等，在舞蹈上表現出對於本土的關懷，莊嚴且肅穆得令人屏息，舞者的一


  動一靜都扣人心弦，這樣好的台灣藝術家需要被看見。而對於藝術工作者或


  是學生來說，或許能從這部片裡找到新的動力堅持下去。




  將來有機會一定要去現場看無垢的演出。




  小記.

  這部紀錄片我想稍微挑剔的是一些小標語中文部分採用的是「康熙字典體」，


  不過康熙字典體放在這邊其實比較不具美感，跟下方無襯線的英文字體搭配起


  來頗為尷尬，跟畫面的美感相較之下遜色很多，略為可惜，片中有看到麗珍老師


  的手寫字體很美，若每個小標都能用老師手寫字體的話我想會更加完美。




  --


  懇請支持



  --'
