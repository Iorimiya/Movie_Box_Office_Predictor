url: https://www.ptt.cc/bbs/movie/M.1474645593.A.ECA.html
title: '[好雷] 使徒行者讓人摸不著頭緒'
content: '自從看完神鬼獵人

  一直很佩服李奧納多能用眼神演戲

  沒想到張家輝和古天樂也不遑多讓啊！

  他們的眼神都透露出我才是真的臥底，

  到底應該相信誰，

  誰才是真正的BJ呢？


  薑還是老的辣，

  整部片中最讓我入戲的是歡喜哥在餐桌那段，

  董先生在描述如何殺害他老婆的時候，

  沒想到歡喜哥還是穩如泰山的面帶微笑，

  我好想幫他補董先生一槍啊～


  想請益最後一幕，

  我沒看過港劇版本，

  所以實在不懂最後一幕的含義！？


  比起寒戰系列我更喜歡這部，

  寒戰看完實在是很不懂想要呈現的是什麼，

  香港的警察體系有點太複雜，

  對於不常看港劇的實在有點難以理解究竟他們在爭什麼。

  而使徒行者相較之下傳達的非常明確，

  到底是各懷鬼胎還是兄弟情義深，

  留給觀眾自己遐想....




  --

  最後一幕是有個背影一直在丟彈力球（丟得有點久XD)看不太清楚是不是藍...'
