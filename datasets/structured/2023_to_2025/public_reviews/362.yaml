url: https://www.ptt.cc/bbs/movie/M.1598755060.A.34E.html
title: '[好雷]行者The Walkers'
content: '終於看了2014年陳芯宜導演拍攝的紀錄片《行者》。其實當年就聽到這部紀錄片不少好評

  ，身邊也有朋友看完不斷向我推薦，但我都錯過而遲遲沒有看。最近在catchplay+串流上

  看到這片，立馬想要有一個時間可以好好來看。


  此前看過陳芯宜前作，也看過她拍攝《行者》的開端與她自己這十年的創作思想與心靈追

  尋。因此是抱著非常期待的心情點開《行者》，十分好奇和期待，它到底講了什麼樣的故

  事。


  結果《行者》還是超越我的期待，它不僅是談無垢舞蹈劇場藝術總監林麗珍創作（這部分

  當然是重點）的故事，而是一個帶觀眾走過／走進無垢舞團的故事。




  《行者》分成一小段一小段，導演給每一段一個小標，但背後沒有一個方向或順序，只是

  從那段主題圈出一個標題，帶觀眾進入那個時空，去看林麗珍的創作、生活與觀點。


  導演陳芯宜大部分是隱藏的（雖然拍攝時必然是有對話，但在影片中大多數是隱藏的狀態

  ），因此我們更像是直接從導演的位置，進到整個無垢舞蹈劇場的空間。有時候在幕前、

  有時在幕後、有時在街頭、有時在山林、有時在海邊，也有很大量的時候是在林麗珍的家

  中，一切都是非常自然，慢慢累積引導我們理解無垢、理解林麗珍的創作。


  那個「慢慢」的過程，是電影的節奏，也是無垢的節奏。




  有人說《行者》像詩，而我感覺像詩的是無垢舞蹈劇團的舞。《行者》的語言極為直白、

  貼近生活、直觀且充滿生命力，像武林秘笈，像是一個學生跟隨老師，修習一種功夫，從

  內而外、從心靈到身體，像無垢舞者日常與林麗珍老師的相處那樣。它有詩的美和詩的時

  間，但看的時候，我們不僅僅是欣賞，而是重新調整我們的腦袋和感官，去理解和感受。


  看完《行者》，我回頭讀了自己寫紀錄片《曼菲》的心得。我發現《曼菲》是完全關於舞

  者的傳記，它吸引你，讓你想要看曼菲的舞。《行者》卻有些不同，它拍的是創作者的世

  界，是關於舞蹈與劇場，卻又不只是舞蹈和劇場。大量的儀式和話語，像是宗教，也真是

  濃烈宗教元素，最終帶著你走向的卻又不是宗教的方向，而是關於生命、藝術、身體、能

  量和自然等等的交流。




  老實說，我在看《行者》之前對於現在有點流行的「身心靈學」，並沒有太多認識，也不

  感覺被吸引。看《行者》的過程，好像漸漸理解所謂「身心靈學」應該是怎麼樣的東西，

  它的魅力在哪裡，以及為何現代人（也許不是多數）會被深深吸引。

  此外林麗珍與舞團成員的相處狀況，讓我回憶起大學後半段到研究所的時光。雖然後來我

  離開了學術，像是把此前所學一切都還給老師一般，做著一般的工作、過著忙碌重覆的生

  活。但那段時光仍然對我今日的生命樣貌有極大的影響，我觀看和思考的方式是經過訓練

  ，即或生活磨鈍了眼睛，在自己沒有意識到的時刻，它還是會回來，浮現在我的腦中。我

  感覺長時間跟隨一個老師能帶給你的東西就是這樣一種無意識的形塑。我想《行者》最感

  動我的是這個部分。



  ***


  這裡是我的樂園:




  FB:






  --

  感恩,更正!'
