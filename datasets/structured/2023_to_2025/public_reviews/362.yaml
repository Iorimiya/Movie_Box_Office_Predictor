title: '[負雷] 搶先觀看使徒行者2 (Line Walker 2)'
content: '雷文防雷資訊頁




  剛好人在緬甸出差，被當地人找去看了這部...


  我很久沒看港片了，但如果拿來跟是講諜對諜的無間道相比，


  這部格局只有大學畢業作品的影片程度。


  我也沒看一，就只看二，但似乎不太有甚麼影響，


  反正劇情很簡單，因為都有演員會口述劇情給你聽，好像怕觀眾不知道現在要演甚麼。








  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  真意外自己看了台灣還沒上映的電影，


  這部片子開頭就演兩個班上前兩名的小孩在課堂上互相比賽轉魔術方塊也彼此互相欣賞，

  然後比完後回家走著走著就遇到了麻匪...不，是綁架集團，把其中一位小孩給劫了

  故事就這樣開始。


  而好幾年後，有兩位駭客一男一女駭入了該集團，

  並發現該集團是專門培養反社會(?)小孩安插到警界然後當臥底...


  當甚麼臥底？沒提到，該集團幹甚麼壞事？也沒描述

  反正有集團培養小孩入警界就是壞壞壞，一定要查出來，

  (這是犯罪集團？我覺得比較像是警察補習班，

  然後小孩都能當上總警司還是主管的，各個超強，真的不考慮出來弄個警察特考補習班嗎)


  而當然由於集團祕密被駭客發現了，且駭客又多事把集團資料庫上鎖，

  所以集團要找到駭客解鎖，而且還是最廢的"物理"方式


  故事就這樣開始..


  開場集團派殺手找到坐在車上的女駭客，

  然後拿槍...射輪胎...

  把輪胎射爆再讓女駭客逃出車子上了公車，

  在大眾面前拿出小刀想把女駭客給殺了


  What~能把輪胎射爆還不直接拿槍朝駕駛射

  這部編劇我真想知道他寫這段知不知道自己在寫甚麼...

  反正這也不是最智障的，整部片水平差不多都這樣，


  後面劇情就是圍繞著一個女駭客，跟三位男主角的故事，

  與其說圍繞...不如說這時香港警察只剩下這三位會做事，其他不是打醬油就是雜魚，

  整部片子劇情就像一條直線，有時想到甚麼會突然岔出一個分支劇情維持頂多五分鐘，

  然後又回到那三位鏡頭。也就是要找出這三位誰才是犯罪集團安插的人員，

  但連反派的動機都懶得描述，幹...寫到這我也不知道在寫啥了，

  鏡頭也是毫不描述隨意切換，

  演員可以把劇情內容講解給觀眾，卻不在轉換場景上多作描述，

  可能上一個鏡頭才在吵架，下一個畫面就把女駭客移送畫面，想當然導演經驗很不足，

  每一個場景都一定要塞一個突發事件，

  且一定要發生毫無意義的槍戰，

  例如集團搶硬碟，硬碟都被送走了卻還是派更多人要把現場的警察殺光，

  當然主角也在裏頭，所以集團也是反被滅，


  而宣傳提到的西班牙場景大概是劇組經費太多想去那邊遊玩，

  因為為什麼要去那邊也沒特別說明，只說在西班牙有個買家想買女駭客，

  然後警察就整隊過去了，

  這比變形金剛二應切軍隊去埃及支援的理由還廢...


  最經典應該還是有血條的防彈車，從任何角度射擊都是扣車上顯示器所描述的"防彈100%"

  一直扣到0%才射得穿，就算歹徒已經靠近門邊也是用射的，

  而且明明是要抓人解鎖集團資料庫卻把人家射成蜂窩，完全無法理解，

  那個世界線的犯罪集團大概都是中二病在當吧。


  這部片沒有對甚麼人有過多描述，人死了都沒感覺，

  對話刻意安排次數過多，場景切換很莫名，

  最終反派挑了一個瞇瞇眼的有韓式風格的演員，但不會覺得他很厲害，

  因為根本沒特別著墨他身手。




  最後緬甸的妹妹說電影有點血腥，雖然我一點也沒感覺到。


  --

  你以為電影是今天拍明天上嗎..天真的小朋友，很明顯跟時事無關。

  而且電影裡面反派集團描述跟時事跟本就完全不同，

  我建議你下檔後去看一下再回頭更正你的想法都還來得及'
