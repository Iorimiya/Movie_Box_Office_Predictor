title: 'Re: [心得雷]背負罪惡的前英雄 路克天行者 '
content: '可否列出何謂艱苦訓練？

  我怎麼覺得前傳三部曲從來沒有看到過艱苦訓練的內容？

  路克在帝國大反擊當中至少還有背著尤達跑步翻筋斗的描述

  我怎麼從沒看過前傳的電影當中看過安納金受訓練的片段？

  這樣是要如何看出安納金的訓練很艱困呢？嘴巴講講？


  是說

  前傳三的打鬥不知為何都給我一種很兒戲的感覺

  我實在看不太出強弱，尤達最後怎麼輸的我都搞不清楚


  可是你要跟我說因為尤達打不贏白卜庭

  所以路克就是奇才 我也覺得好像不是同一件事


  可是這一點也不是我想提的主要重點啦

  而是路克為何會畏懼黑暗的原因

  可能可以解釋為因為她當年並沒有靠著自己的力量去擊敗黑暗

  因此看到黑暗再出現而衍生的恐懼感


  而有反論認為因為路克是奇才因此不會這樣

  我才特別提到我個人並不覺得路克是奇才就是



  好吧～那請告訴我他為何不想毀掉古蹟呢？

  我為他的這個舉動去做出我的解讀

  還請給我一些別的觀點，讓我不要這樣想



  是啊～這些事情都有可能發生，只要故事講得好，為什麼不可行？

  說到底，你們反對的原因難道就真的單純只是這故事不照著你們希望的方向走

  而在一開始就不願面對嗎？



  --


  男人是一種很悲哀又很容易控制的動物，因為他們往往拼了命的取悅異性，或是從各種媒

  介取得任何可以引起性幻想的事物，甚至還因而犯下強姦或是偷窺等大小不一的罪，但是

  追根究柢，目的卻只是想要從自己的身上擠出那麼5C.C的液體而已。

  粉絲團



  --'
