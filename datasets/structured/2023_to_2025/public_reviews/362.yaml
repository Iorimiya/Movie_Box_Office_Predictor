url: https://www.ptt.cc/bbs/movie/M.1514201692.A.1DB.html
title: '[新聞] 永遠的天行者路克 星戰傳奇馬克漢米爾'
content: "新聞網址：\n\n\n\n\n隨著《星際大戰八部曲：最後的絕地武士》（Star Wars Episode VIII: The Last Jedi\n\
  ）上映後創下票房記錄，讓這部從年首部電影上映以來，《星際大戰》（Star Wars\n）已經成為好萊塢科幻片的傳奇之一，這個系列不僅擴大了人們對外太空的想像，也捧紅\n\
  了不少影星，其中從（Star Wars Episode IV: A New\nHope）開始接演天行者路克（Luke Skywalker），男星在睽\n違30年後，再次重回《星際大戰》片場，續寫路克傳奇的一生。\n\
  \n\n現年66歲、從年輕路克演到老的馬克漢米爾，出生於加州奧克蘭，父親威廉是一名海軍上\n校，育有包含馬克在內共7名子女。由於父親職務調動因素，漢米爾高中期間曾赴日本橫\n\
  須賀生活唸書，畢業後返美進入洛杉磯城市學院（Los Angeles City College），主修戲\n劇。漢米爾的職業生涯從動畫配音開始，並曾在多部話劇尬上一角，也曾出演《檀島警騎\n\
  》、《中央醫院》、《鷓鴣家庭》等多部電視劇。\n\n\n↑年輕時期的馬克漢米爾（圖左）和尤達大師的頭套。（圖/ Dutch National Archives）\n\
  \n\n↑馬克漢米爾（圖右）與嘉莉費雪（圖左）在《星際大戰》內飾演路克莉亞兄妹。\n（圖/星際大戰官網）\n\n漢米爾成為路克的過程，可說是意外的收穫。\n，認為\n\
  漢米爾就是他心目中飾演路克的最佳人選，經過短暫的試演後，被選為《星際大戰》四部\n曲的男主角，並隨著電影的大紅，與哈里遜·福特（Harrison Ford）飾演的韓索羅（\n\
  Han Solo）和嘉莉·費雪（Carrie Frances Fisher）飾演的莉亞公主（Princess Leia\nOrgana），成為星戰最傳奇的組合之一。\n\
  \n\n↑飾演年輕天行者路克的馬克漢米爾。（圖/星際大戰官網）\n\n漢米爾曾藉由出演五、六兩集，獲得土星獎（Saturn Awards）最佳男演員。但對於馬克\n\
  漢米爾而言，他的演藝生涯可說是「」，1983年拍完《六部曲：絕地\n大反攻》（Star Wars Episode VI: Return of the Jedi）後，除了替多部動畫電影配音\n\
  外，幾乎沒有著名的作品，直到2014年回歸《星際大戰》片場為止。漢米爾除了是名演員\n，他也是一位著名的配音員，\n\n\n↑飾演路克的馬克漢米爾（圖右），偕同飾演新角色芮的黛西·蕾德莉（圖左）出席首映會\n\
  。（圖/路透社）\n\n↑因飾演路克出名的漢米爾（圖右）與妻子Marilou York（圖左）出席首映典禮。\n（圖/路透社）\n\n漢米爾於1978年與潔牙師Marilou\
  \ York結為夫妻，兩人育有3名子女，分別名為納森、格\n里芬與切爾西·伊麗莎白；長子納森還曾在1999年的《星際大戰首部曲：威脅潛伏》中客\n串那卜星的皇家衛兵。仔細比對漢米爾飾演路克前後的畫面，可以發現容貌有部份不同，\n\
  原因是漢米爾於1977年拍攝五部曲前夕，曾在一場車禍中造成鼻樑和左顴骨斷裂，緊急開\n工進行了7小時的手術才搶救回來。\n\n無論最新的第八集結局是否讓影迷接受，在眾多星戰粉絲的心中，漢米爾與費雪已是傳奇\n\
  人物，。只可惜，漢米爾與費雪並未能與「福伯」哈里遜福特一樣\n，走出星戰角色束縛，成功找到「印地安納瓊斯」等新的角色定位，讓星際大戰成為他們\n心中，又愛卻又無奈的一塊，如今隨著星戰話題再次炒熱，也讓漢米爾又一次重回大銀幕\n\
  之上，成為大家心中永遠的絕地武士、天行者路克。\n\n\n↑已於去年底逝世的嘉莉費雪，也讓莉亞公主在第八集後劃下休止符。\n（圖/星際大戰官網）\n\n\n最後，願與你同在！（May\
  \ the Force be with you！）\n\n\n\n\n\n\n\n--\n\n\n\n                            \
