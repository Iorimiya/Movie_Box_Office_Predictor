url: https://www.ptt.cc/bbs/movie/M.1519215435.A.E86.html
title: 'Re: [請益] 星際大戰8 路克天行者的光劍(有雷)'
content: "很想知道大家對於拿著兩種光劍的路克有什麼不同的感覺呢？\n\n我認為拿著綠色光劍的路克是英勇的\n他用這把綠色的光劍打敗了達斯維達\n這把綠色光劍也成就了路克的傳奇\n\
  \n但是拿著藍色的光劍感覺就是不夠強\n在5部曲中最後還被達斯維達砍掉手\n\n所以在8部曲中路克最後跟他外甥凱羅忍對決的時候竟然是拿出藍色的時候\n帶給我的感覺就是氣勢上弱了不少\n\
  我才會對於這一幕如此在意如此不滿\n更何況那把藍色光劍早在芮和凱羅忍的原力拉扯中毀壞了\n這時出現在路克手中未免太突兀了吧！\n如果路克是拿著綠色光劍跟凱羅忍對決\n\
  那他最後的身影才更顯得壯烈\n\n對此導演Rian Johnson的解釋是這樣的\n\"[Luke] is basically tailoring this projection\
  \ to have maximum effect on\nKylo,\" Johnson explained. \"He knows that Kylo’s Achilles\
  \ heel is his rage,\nand so that’s why he kind of makes himself look younger, the\
  \ way Kylo\nwould’ve last seen him in their confrontation at the temple,  and that’s\
  \ why\nhe decided to bring Kylo’s grandfather’s lightsaber down there -- the\nlightsaber\
  \ that Kylo screamed at Rey, ‘that’s mine, that belongs to me.’\"\nAs far as Johnson's\
  \ concerned, Luke believes that Anakin's lightsaber will\nhave a much more visceral\
  \ impact on the erstwhile Ben Solo than Luke's own\ngreen blade.\n\n我感覺他的解釋根本是事後硬湊而已罷了\n\
  \n但是無論如何，\n在美國一些討論網站上以及YouTube的留言中\n絕大多數還是認為路克選擇拿著綠色光劍跟凱羅忍對決比較好\n一方面綠色比較適合他\n一方面綠色是他成為絕地大師成為傳奇的象徵。\n\
  \n\n--\n                                 02/21 20:17"
