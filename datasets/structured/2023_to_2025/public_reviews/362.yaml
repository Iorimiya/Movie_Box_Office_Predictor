title: '[討論] 夢行者保羅/送葬人 iTunes 新上架租借中'
content: "情報來源：\n\n\n《夢行者保羅》\n◎ iTunes 立即看 NT$390 >> \n◎ YouTube 立即看 NT$350 >> \n\n\
  《我恨我自己》阿曼達獎編導克里斯托弗博格利再度挑戰瞬間成名題材！\n特邀尼可拉斯凱吉扮大學教授，一夕之間成數百萬陌生人夢見對象，莫名\n得來龐大關注，又跟著夢境變化，慢慢疊加對他醒後的壓迫感，反映現實\n\
