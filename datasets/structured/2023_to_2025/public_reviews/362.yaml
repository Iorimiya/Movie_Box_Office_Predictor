url: https://www.ptt.cc/bbs/movie/M.1429945664.A.07E.html
title: '[好雷] 行者'
content: "強烈推薦陳芯宜導演拍攝了十年的紀錄片《行者》，無垢劇場林麗珍老師的舞蹈與\n人生，她們比一百本經典都生動地演繹了「敬」這個字。貫串日常與舞台的敬意與專注\n\
  ，東方文明的現代舞，還有三隻搶戲而莫名其妙地和諧的貓咪。看過這部片讓我決定一\n定要買票去看無垢的現場表演了。\n\n　　昨天《行者》放完後，導演有來現場答客問，因為全廳只有三四十個座位，所以大\n\
  家到外面走廊圍一圈就聊開了。我問的問題是：「林麗珍老師有特別學過書法、繪畫嗎\n？」因為片裡她寫的字、畫的畫都很漂亮，但她又不是科班出身，學歷也不高，也沒有\n\
  家學（她家是漁民）。導演回答：「沒有！」\n\n　　真是神奇！從她的言行舉止和書畫，我敢說任何一個讀書人都會承認她是真懂藝術\n和生活哲學的，而她的書畫卻沒有師承，她的師承是美國傳來的現代舞，以及台灣民俗\n\
  信仰和文化。她將之自然地融合起來，你在她身上看不到流派，看不到民族與國籍，只\n會感覺那是一種東方的體現。導演說：「她的手稿線條也很簡單，都隨手畫的，但就是\n\
  很漂亮。」另一位觀眾也說：「她的字也好好看！」林麗珍老師的字是行書，也看不出\n流派，就是她隨意寫的。\n\n　　大概，一個練到了能掌握自己身體的人，寫字畫畫或者做別的事，也都能得心應手\n\
  。這令我想起以前看的一本徐紀所寫的談武術的書，說有一位師傅喜歡寫字畫畫，他的\n書畫也很簡單，沒有流派，但是寥寥幾筆間就融入了他的拳意，韻味深長，所以識貨的\n\
  、習武的人都很珍視。徐紀沒有附圖，我們只能想像；然而《行者》這部片把她大量作\n品和整個人都拍給你看了。\n\n　　導演說有練舞的人來看《行者》，從開場就哭得唏哩嘩啦一直到完，可見共鳴。我\n\
  想，不但練舞的人，如果有習武的朋友來看這部片，肯定也能有深刻的觸動吧！\n\n--\n\n　　　　　　　　　　\n\n\n--\n\n    補充：\n\n　　台灣的紀錄片遠比劇情片好看，其中一大原因是口條。紀錄片裡，每個人說的話都\n\
  是自然的（除了訪談時可能會卡一點，但那也是真實的反應），不存在演技的問題。劇\n情片就有這一關要過，編劇有，演員更有，而結果多半不及格。\n\n　　《行者》裡的會話尤其感人，特別是林麗珍老師排練時的訓話：「方便就不是劇場\n\
  了！」字字充滿能量；教舞時，講話和舞蹈節奏一體，尤其精彩。表演完後，舞者哭著\n說「我覺得這是我跳最好的一次」，那也是演不出來的，而且這種鏡頭可遇不可求。\n\n\
  　　劇情片口條的問題由來已久，也很多人說過了，但是說得再多，沒做到的就是沒做\n到。所以我近年和別人推薦台灣電影，我都推紀錄片。"
