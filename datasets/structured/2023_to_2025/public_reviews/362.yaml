url: https://www.ptt.cc/bbs/movie/M.1523967448.A.AE3.html
title: '[心得雷]背負罪惡的前英雄 路克天行者'
content: "原文網址：\n    \n\n    影片版\n    \n\n\n\n    【星際大戰：最後的絕地武士】對於路克天行者的描寫與馬克漢彌爾的表現\n\
  \    ，將這個科奇幻系列電影推上了深度劇情片之林，不再流於即食的爆米花電\n    影。\n\n    而且這種深度不僅僅是劇情的複雜度（否則一定會有許多星戰迷嚷著前傳也\n\
  \    很複雜），而是表演藝術與角色情感的渲染力道也達到一個新的境界。\n\n    在【原力覺醒】的片尾，芮終於找到了路克天行者，並且對他遞出了光劍，\n\
  \    電影就在氣氛高張之中結束，兩年後【最後的絕地武士】直接延續了這段相\n    會，然而，出乎意料的，路克天行者選擇把光劍丟棄，他放棄了「身為絕地\n\
  \    的精神象徵」的身份，而且還極度厭惡。\n\n\n    \n    在【帝國大反擊】當中遺失的光劍重回路克手中，這把光劍同時是他的父\n    親安納金所打造的。\n\
  \n\n    路克：你期望什麼？我會拿著雷射劍站出來對抗第一軍團嗎？\n\n    此時的路克甚至用了Laser Sword（雷射劍）而不是星戰電影對光劍的稱呼\n\
  \    LightSaber，一方面是在調侃芮，但另一方面，也代表了他已經完全失去了\n    對絕地的信仰，在之後對芮的課程當中也是透露出完全不同於以往的價值觀\n\
  \    。\n\n    路克：黑暗強大，光明也就強大，說絕地滅絕光明就滅絕是言過其實。\n\n    在芮的逼問之下，路克才終於透露了自己背棄絕地的原因，他在發現班索羅\n\
  \    潛藏的黑暗後，萬分恐懼之下，起了一絲膽怯的惡念，因而失去了整個絕地\n    學院，自此之後他無法面對自己的失敗，因此避世隱居，在路克試圖阻止芮\n\
  \    離開時，芮第二次把光劍遞給他，其實那個動作就是反問路克，若是不肯讓\n    芮做決定的話，那就起來做絕地武士應該做的事，而路克再次的退縮。\n\n\
  \    其實這邊顯示的，是路克的膽怯，他害怕面對自己的失敗與軟弱，才因此選\n    擇了自我放逐，由於自己一手造成凱羅忍的誕生，因此他不願意再授徒傳藝\n\
  \    ，同時，他也怯於面對凱羅忍，怯於面對莉亞與韓。\n\n    有趣的是，路克內心當中應該仍舊淺藏著一絲希望，期望有人能阻止他的自\n    我毀滅，因此【原力覺醒】當中，R2D2身上才會藏有他的去處的地圖，而他\n\
  \    嘴巴上雖說要摧毀絕地，卻仍舊下不了手燒毀絕地古蹟，直到先人現身點破\n    他的執迷。\n\n\n     \n    尤達在【最後的絕地武士】的現身化解了路克的執迷，不知為何，我看電影\n\
  \    的時候因為這一幕落淚，在剪側寫的時候再看一次還是忍不住垂淚。\n\n\n    尤達：失敗是最好的老師。唯有面對失敗，才是真正的成長，年輕的天行者\n\
  \    ，你依舊好高騖遠。\n\n    被點破之後，路克才終於願意面對自己的心魔，面對莉亞，面對凱羅忍，同\n    時也履行了眾人對他的期望－帶著光劍現身，面對千軍萬馬，成為眾人期盼\n\
  \    的抗暴象徵。\n\n\n    \n    路克在片尾終究實現了眾人對他的期望-成為傳奇，變成眾人的精神象徵，成\n    為片尾的孩童心目中的英雄人物，讓絕地的精神繼續傳承。\n\
  \n\n    而對凱羅忍，路克對他表達的是歉疚。\n\n    凱羅忍：你是來跟我說你原諒我，要拯救我的靈魂嗎？\n\n    路克：我辜負了你，班，我很抱歉。\n\
  \n    凱羅忍：我會毀滅她，毀滅你，毀滅一切！\n\n    路克：不，帶著怒氣擊倒我，我會一輩子跟著你，就像你父親那樣。\n\n    到了這個時刻，路克對凱羅忍所說話的帶有溫情與深意，路克不願凱羅忍再\n\
  \    次墮落，所以沒有像歐比王肯諾比與達斯維德戰鬥當中直接消逝，而是讓凱\n    羅忍看著他活著離去。\n\n    在最後一刻，用盡力量達成眾人的期望，也面對自己的心魔之後，路克在兩\n\
  \    個夕陽下成為了原力的一部分。\n\n\n    \n    數十年來遊走整個銀河系，路克人生最後的一刻眼中看到的卻是塔土印行星\n    上的雙星落日，也許塔土印還是他最大的鄉愁吧？\n\
  \n\n    天行者離去了，【星際大戰】最重要的一位主角成為了傳奇，在【原力覺醒\n    】當中，韓索羅走得太讓人痛心，而莉亞公主則在現實生活中成為了永恆。\n\
  \n    身為忠實的星戰觀眾，我衷心希望他還能夠再回歸。\n\n    即使是以原力的樣貌回來也無所謂。\n\n    因為，他是【星際大戰】系列當中，唯一還有現身機會的前主角。\n\
  \n--\n\n--\n\n男人是一種很悲哀又很容易控制的動物，因為他們往往拼了命的取悅異性，或是從各種媒\n介取得任何可以引起性幻想的事物，甚至還因而犯下強姦或是偷窺等大小不一的罪，但是\n\
  追根究柢，目的卻只是想要從自己的身上擠出那麼5C.C的液體而已。\n粉絲團\n\n\n--\n我倒是覺得路克在年輕時代的冒險一直都過得很驚險\n\n星際大戰當中他學得快，但是看起來就不是很強\n\
  大部份的過關都是靠著小聰明，唯一有用到原力是擊破死星\n還是在帝國明顯大意（德金總督輕視反抗軍，不想撤退）\n的狀態底下\n\n帝國大反擊當中光是要抬X戰機都很吃力\n\
  \n就算到了絕地大反攻，他的個性變得比較成熟\n可是也感受不到有多強大\n基本上他敵不過大魔王白卜庭，必須要哀求達斯維德才能勉強擊敗\n所以我一直都不覺得他有到達「奇才」的狀態\n\
  \n他在星戰8所擁有的回憶短，但是馬克漢彌爾與亞當崔佛兩位演員的表演都演得極佳\n這一點也是我之前覺得凱羅忍的角色描繪勝過安娜金的原因\n同樣的道理 帝國大反擊的達斯維德\
  \ 雖然內心戲極少\n但是就憑著不追擊千年鷹，就可以感受到他內心的猶豫\n角色的說服力這件事情 與其講得又臭又長又無法牽動觀眾\n還不如短暫但是表現極佳的演出\n\
  他討厭絕地其實只是嘴巴說說的，他討厭的是自己\n他怨恨絕地與西斯這些千年傳統讓他背負的壓力\n光是看他想毀掉古蹟又下不了手就表示了他根本就放不下\n\n我接受路克的軟弱，其實也是因為他到最後的奮起，\n\
  如果他在這其中的表現不佳，那我可能也不會覺得路克的故事好看了\n\n我個人覺得這個本寫得好，某方面，也是覺得這個故事有在投射現實世界\n路克其實就像是一個緬懷過去成功，但是現在一蹶不振的人\n\
  最後的結論是希望能夠承先啟後，把棒交給年輕人\n而且承認自己也會犯錯，並且「把犯錯的經驗」教導給後輩\n\n一個三十年前成功的英雄，在三十年後失敗為何會是一件奇怪的事呢？\n\
  原初的三部曲寫於1980年代的美國，當時的美國整體氛圍就是積極進取與勝利的年代\n2010年代末期的星戰故事，路克的身份其實應該也是代表了1980年代的年輕世代\n\
  所以我才會覺得寫路克的失敗對現實世界的現狀有某種程度的影射。\n\n如果以星際大戰過往的歷史來說，杜庫原本也是個絕地，最後黑化成為西斯\n安納金年紀輕輕就成為絕地大師，卻黑化成為西斯\n\
  然後在二十年後改邪歸正，這些全都是奇怪的事嗎？\n\n我個人覺得路克從英雄變成一厥不振的老人本身並不是一件不能接受的事\n故事既然這麼寫，那我會接受它，如果馬克漢彌爾表現得不好\n\
  我才會認為這個故事沒有講好\n\n但是目前反對的觀點看樣子並不在乎演員有沒有把角色詮釋好，\n而是覺得故事一開始就不該這樣寫"
