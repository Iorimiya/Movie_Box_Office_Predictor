title: 'Re: [討論] 星戰七-路克.天行者 是 凱羅.忍 的機率?'
content: '我倒是比較懷疑暴風兵黑人是路克的兒子可能性，


  因為有人說預片中他拿的是路克的藍色光劍，象徵著一種父子傳承。


  不過這樣一來，他媽是誰???


  現在有人在猜黑人暴風兵是藍道的兒子(不過藍道沒原力)


  或是雲度大師的後人(可能性高達八成)<==因為有名的黑人也就這幾個。


  但應該讓他拿紫光劍才對啊…



  至於凱羅．忍感覺不是這一集就卦點，就是下一集會變主角，


  跟苪談戀愛。


  因為綜觀星戰歷史，一開始中二病愈重的角色愈受歡迎。


  (韓蘇洛表示：...)


  因為中二角色往往是最受歡迎的。



  我的看法啦…


  --

  所以凱羅是莉亞生的嗎??這雷滿大的。'
