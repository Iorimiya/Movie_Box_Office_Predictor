url: https://www.ptt.cc/bbs/movie/M.1666065459.A.C27.html
title: '[負雷] 孫行者傳'
content: '背景尚可一看

  音樂平平

  其他地方....算了吧


  這部要不是今年的這計劃我不會去看

  看完後只覺得 和剛剛的1個半小時比起來 世界原來是這麼美好啊～～




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  在預告時看到動畫角色的動作就有不妙的感覺了

  上院線時果然....真的很不妙


  人物的動作 配音 臉部嘴型都慘不忍睹

  這部動畫聽說做了6年

  6年拿出這成品實在比不上中國做出來的大部份電玩宣傳動畫


  配音很奇怪 台灣明明有優秀的配音員

  像海綿寶寶 蠟筆小新 肥貓鬥小強

  把標準降低一點 今年初的諸葛四郎配音都沒這部那麼差


  于正昇 配過海綿寶寶裡的 皮老闆 海超人 小蝸

  江志倫 配過我妻善逸

  但在這部裡的配音不知為什麼實在聽不下去


  動作很生硬

  臉部...有時候在講話時角色嘴巴是沒在動的

  孫悟空的緊箍兒直接不見


  劇情更是OOXX

  雖然是熟悉的借芭蕉扇 火焰山故事

  但一開始就不打算講解這群人的背景

  中間遇到的人也是 孫悟空被吹走時去借定風珠的那位大師 我都在OS你是誰啊

  故事定位到底是要給不知西遊記的新朋友看？還是要給知道的人看？


  人物也沒有成長曲線 大家個性就都還是和電影開頭一樣

  例如唐僧快升天時跟佛祖到底聊了什麼？

  沒有講明的話感覺就只是拿來拖時間的CUT

  電影的副標題寫著永不放棄 然後就可以偷搶拐騙嗎？

  一開頭的觀音也是 直接打到紅孩兒皈依我佛 完全沒要講道理

  對話內容有夠空洞


  孫悟空各種騙羅剎女

  （我對西遊記沒研究 但記得小時看芭蕉扇是在鐵扇公主身上？查了一下似乎羅剎女和鐵

  扇公主是同一人）

  這部很不適合給小朋友看啊！！

  最後孫悟空+土地公軍團搶不過也打輸牛魔王 直接開機械神

  所有的神明都過來圍歐他是怎樣？暴力搶劫集團喔？

  三太子還要送牛魔王昇天 有夠兇的耶


  總之

  錢太多捐孤兒院

  時間太多去學數學


  ====


  只要是2022/1/1後首映 到 2022/12/31 23:59:59 的由台灣人出資51%以上的電影

  我都會去看和PO出簡短的影評


  如果有興趣的可以來這粉絲專頁喔




  --'
