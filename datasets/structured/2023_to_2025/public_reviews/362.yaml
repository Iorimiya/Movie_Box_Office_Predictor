url: https://www.ptt.cc/bbs/movie/M.1760508323.A.C12.html
title: '[新聞] 《天行者的崛起》成本近6億美金 英國補助1'
content: "《天行者的崛起》成本近6億美金 英國補助1億\n\n【大紀元2025年10月15日訊】（大紀元記者葉子杰編譯報導）當地13日，迪士尼透露，\n\
  2019年上映的電影《STAR WARS：天行者的崛起》（Star Wars: The Rise of Skywalker\n）的總製作成本達到5.937億美元，成為史上成本第三高的電影。\n\
  \n據《富比士》報導，《STAR WARS：天行者的崛起》製作該片的成本增加了1,010萬美元（\n800萬英鎊），總預算達到5.937億美元（4.502億英鎊，約新台幣184.1億），幾乎快接近\n\
  2015年《STAR WARS：原力覺醒》（Star Wars: The Force Awakens）的製作預算約為6.0\n34億美元（4.52億英鎊。新台幣184.8億）。\n\
  \n《天行者的崛起》成為史上成本第三高的電影，僅次於《原力覺醒》和《侏羅紀世界：統\n霸天下》（Jurassic World Dominion）。而《統霸天下》的製作預算約為6.055億美元（\n\
  4.536億英鎊，新台幣185.4億），是史上製作成本最高的電影。\n\n這些數據透過英國稅務紀錄公開，雖然提報的製作成本很高，但因為後製成本比預期便宜\n，《天行者的崛起》最後還是沒有超出預算。據報導，迪士尼從英國政府拿到了1.038億\n\
  美元的補助，這筆錢沒算進上面提到的成本裡，這樣算下來電影的總花費會低於5億美元\n。\n\n\n《STAR WARS：天行者的崛起》劇照。（2019 Lucasfilm\
  \ Ltd.）\n\n這個數據還不包括行銷費用，但也沒算進海外銷售、家庭影片、商品授權等方面的收益。\n《天行者的崛起》光是在票房就賺了10.77億美元。\n\n\
  在美國拍電影的預算通常嚴格保密，因為製片公司會把所有電影的成本合在一起算，並沒\n有把每部電影的花費詳細拆開。但在英國情況就不一樣了。在英國拍片的公司，只要在英\n\
  國花費的錢，佔電影核心成本的至少10%，就可以申請最高25.5%的費用補助。\n\n為了向政府證明這點，製片公司會專門在英國成立獨立公司來製作每一部電影，並且必須\n\
  提交具有法律效力的財務報告。與所有英國公司一樣，而這些備案文件會在相關期限結束\n後很久分階段發布。這個過程從前期製作開始，一直持續到首映結束後很長一段時間。\n\
  \n\n2019年，導演J.J.亞伯拉罕帶著主要演員出席東京首映會。（迪士尼提供）\n\n接下來，《曼達洛人與古古》（The Mandalorian & Grogu）將於\
  \ 2026 年 5 月在美國上\n映，《星際大戰：星際戰機》（Star Wars: Starfighter）將於 2027 年 5 月上映。《\n天行者崛起》目前可在\
  \ Disney+等串流媒體上觀看。\n\n責任編輯：蘇漾\n\n\n\n--\n\n                  \n\n\n\n--"
