url: https://www.ptt.cc/bbs/movie/M.1665747341.A.2BE.html
title: '[新聞] 尚未上映就招謾罵「同仁落淚」 《孫行者'
content: '新聞網址：


  尚未上映就招謾罵「同仁落淚」 《孫行者傳》導演正能量喊話


  記者許瑞麟／台北報導


  台灣原創3D動畫電影《孫行者傳》今（10）日下午舉行數位3D中文版首映，有小孩特地裝

  扮成孫悟空、牛魔王與《孫行者傳》電影中角色，吸引許多大小朋友爭相拍照合影，更有

  《西遊記》原著中代表性兩大美人鐵扇公主和玉面公主同台爭豔。


  其實首映會前，已超過2000人包場觀影，有許多熱心人士及學校包場觀賞，還有善心人士

  公益包場邀請家扶中心、孤兒院、中低收入戶的小朋友進戲院一起看電影。之前出席學校

  包場的孩子們，對於戴上立體眼鏡後能看到立體3D影像感到驚奇與震撼，尤其在孫悟空與

  牛魔王化身為各種動物的打鬥場面，更讓他們興奮不已直呼：「孫悟空好帥喔！」


  導演莊家修（左前3）出席《孫行者傳》首映會，感謝觀眾支持。（圖／數位領域電影文

  化提供）


  導演莊家修耗時6年率領團隊完成破百角色、50多個場景設計及3D化製作，製作過程相當

  不易，他表示最困難的事莫過於「製作經費拮据、資金籌措困難、沒有宣發預算」。電影

  屬於無形資產，在台灣不像美國募資容易又可以向銀行融資貸款，加上台灣的動畫電影尚

  無破億的票房紀錄，「在台灣動畫電影的募資就更困難了！」即使《西遊記》是全球知名

  的東方神話題材，但莊家修坦言，這個題材對台灣一般的投資人來說並不討喜，也有很多

  人對西遊記有很深的成見。


  因此導演的手機桌面上有這麼一句話時刻提醒自己：「團隊目標 – 努力對抗世俗對台灣

  動畫電影的成見與偏見。」且《孫行者傳》是一部沒有長片輔導金補助的電影，所有的製

  作資金全來自於台灣，「非常感謝最終認可我們團隊的投資人，支持我們完成這部電影。

  」


  《孫行者傳》4大角色齊聚一堂。（圖／數位領域電影文化提供）


  即使電影從製作期間就不被看好，導演每天自問：「我今天的努力夠了嗎？我今天的努力

  對得起投資人、製作團隊和未來進戲院的觀眾了嗎？」他深知團隊的努力就像電影想傳達

  的正能量，「團結一致、堅定信念、確立目標、永不放棄。」不過團隊近日在網路討論區

  、社交媒體、新聞報導留言板看到尚未觀影的網友或因偏見而毒舌批評與謾罵，年輕同事

  一度淚灑辦公室，「但他們相信大家的努力，觀眾一定會透過大銀幕感受到。」


  此外，電影日前在美國洛杉磯華納兄弟片場舉行的好萊塢銀幕電影節（Hollywood

  Silver Screen Festival 2022）被選中，在當地對公眾進行「特別放映」，影展贊助者

  與評審皆是奧斯卡及艾美獎得主與美國電影產業高管。這也激勵了團隊的士氣，盼讓更多

  人看到這部由台灣人創作、改編自經典文學的3D動畫。團隊也不忘提醒，大家進戲院觀看

  時選擇3D立體版本，以獲得最佳觀影體驗。


  《孫行者傳》將於10月14日在台上映。


  備註：


  預告






  PTT就有不少罵的


  不過我是覺得除了少數無腦罵外


  大多都還是有點道理的批評


  畢竟嫌貨才是買貨人


  這怎麼看都一定虧錢的...


  像之前紅孩兒、諸葛四郎這些動畫都賠到爛掉


  沒辦法吸引到市場


  唉 加油吧


  --'
