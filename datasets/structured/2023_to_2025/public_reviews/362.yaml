title: '[普雷]《使徒行者》哥混的不是無間，是兄弟~ '
content: "TVB  電視版五個臥底還嫌不夠，電影版要再加第六第七個？港劇版講林峰\n跟佘詩曼兩個臥底用痞子跟太妹的身份周旋黑幫，幫苗僑偉演的阿SIR 尋找其\n\
  他幾個失聯臥底，查出警隊內鬼，一步步尋找老長官康SIR被害真相，順道剷\n除野心龐大的犯罪集團；電影版角色大換血，吳鎮宇頂上苗僑偉角色，讓佘詩\n曼去挖出康SIR損毀的臥底檔案硬碟中最神秘的「黑傑克」，怎奈居然還碰上\n\
  Ａ貨假冒？\n\n\n\n　人人爭作二五仔（註）的劇情，雖然有點兒像《無間道》那個「給個機會，\n我以前沒得選，現在我想做個好人」的黑心洗白，但《使徒行者》真假臥底一\n\
  下變節一下背叛的洗牌遊戲，即便還是推理「誰是臥底」，但底牌不再是無間\n的黑暗，而是臥底臥出兄弟情的烈血情義！看著看著，還是覺得，那份「北上\n合拍」拍不出來的純正港式警匪黑幫裡的男性情義結盟戲，味道果然沒變。\n\
  \n\n　一句「做兄弟，在心中，你feel不到，我講一萬句都是廢話。」先是少爺（\n古天樂）被阿藍（張家輝）的槍指著的時候的告白，後來又輪到阿藍對著少爺\n的槍口說。兩個人從互相猜疑、針鋒相對，到拉去里約貧民窟開拍的毒品交易\n\
  黑吃黑，仍然打死不離好兄弟，最後在劇裡拍了又拍的【妹記茶館】，一起敲\n碎酒瓶、並肩殺敵的情義轉折，再再都讓人想起陳木勝那部殺去泰國取景《掃\n毒》，就……差一個劉青雲了。只可惜這部《使徒行者》吳鎮宇演的阿SIR，\n\
  戲份都浪費在跟差點變成吳君如「大笑姑婆」接班人的佘詩曼打情罵俏上，搞\n得前後兩段劇情活像兩部片，從王晶的鬧劇一下跳到烈血悲壯的港式兄弟情義\n片。\n\n\n\
  　這也是《使徒行者》劇本的缺失，吳鎮宇佘詩曼為救愛人的犧牲、古天樂張\n家輝的兄弟捨命相護，只靠著找回失聯臥底這條氣若游絲的線牽著；同樣，最\n後大反派的決鬥居然跟古天樂張家輝無關，他們只在外頭茶餐廳聯手跟大反派\n\
  的殺手廝殺，跟大反派對決的，竟然是從港劇到電影版「死而復生」的歡喜哥\n（許紹雄），讓他一路隱忍著亡妻被殺的滔天恨意來復仇。三條各自孤立的劇\n情線，僅靠著一面之緣的關係串起來，很可惜沒能把感情張力綁在一起，激盪\n\
  出更劇力萬鈞的火花。\n\n\n\n　難怪，電影原意要鋪陳那個隱藏得最深、看不見的臥底，在佈一個徹底摧毀\n犯罪集團的驚天「掃毒」行動大局，整個被烈血情義搶去主戲，成為一個很模\n\
  糊的局。看完，只記得張家輝西裝一件件換，連徹臉魚尾紋都能笑出戲來的「\n藍爵」身影。\n\n\n\n　臥底片，在黑幫片裡可以說香港是僅此一家別無分號，甚至拍出了某種反應\n\
  香港人身份認同焦慮的「臥底電影社會學」。從清道光年間陸續三個條約割據\n跟租給英國殖民，到二戰日軍攻陷佔領，回到港英時期又孺慕祖國，九七之後\n又懷念港英，幾乎每個重要事件香港人在公領域和內心裡邊都得選邊站，他們\n\
  像是歷史的人質，（註）也像天地會與少林和和反清復明時，朝廷收買少林武\n功排名第七的弟子那樣，無法擺脫「二五仔」的宿命。（註：二五仔也因這段\n典故成為黑幫稱叛徒臥底的行話，絕對不是因為陳永仁25號生日開始的\
  \ XD）\n\n\n\n　也因此，彷彿這些電影裡做臥底的，終極任務就是身份回歸。那些迷途的、\n沒機會回去的，就成為陳永仁、劉建明那樣的無間行者；又或者像是《掃毒》\n\
  、《使徒行者》，甚至韓國《太極旗：生死兄弟》那樣，立場轉了又換，在兩\n軍對壘的暗戰、血戰之中，才辯證出過命情誼，原來所有正邪立場都是假的，\n出來混，只有兄弟是真的。不過話說回來，電影裡人人搶作二五仔，智商高體\n\
  能強的都去混臥底了，難怪警隊越來越不濟，淨幹一堆在民主遊行抗議的場子\n拖老百姓到暗巷亂打一通，又被民眾拍到的蠢事。\n\n\n--\n圖文網誌 > \n--\n\
  \n--"
