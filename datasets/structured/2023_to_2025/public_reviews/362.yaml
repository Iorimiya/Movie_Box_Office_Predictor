url: https://www.ptt.cc/bbs/movie/M.1513385338.A.34B.html
title: 'Re: [討論]我想為星戰八的 路克天行者 平反一下'
content: "7, 8的時間點是6的幾十年後 幾十年間人的性格或許會改變\n\n可是迪士尼不把這種轉變在電影裡表現出來的話根本沒人知道\n\n觀眾現在看到的只有跟原三部曲兜不起來的路克\
  \ 我覺得這不能怪觀眾為何不去思考\n\n我也不覺得迪士尼會希望觀眾看個星戰還要腦補一堆背景\n\n看那鋪了一堆線索的7 觀眾腦補了兩年各種背景和發展 結果全被官方打臉\n\
  \n只能說米老鼠死好\n\n最後附上路克演員Mark Hamill對此次劇本的評語\n\nAfter reading the script for the film,\
  \ Mark Hamill told director Rian Johnson,\n \"I pretty much fundamentally disagree\
  \ with every choice you've made for this\ncharacter [Luke Skywalker]. Now, having\
  \ said that, I have gotten it off my che\nst, and my job now is to take what you've\
  \ created and do my best to realize yo\nur vision.\"\n\n看完劇本後 Hamill對導演說：我基本上不贊同你對路克所作的所有決定。現在我把它說\n\
  出來後舒服多了，我會全力演好你創造的角色，完成你的期待。\n\n\n--"
