url: https://www.ptt.cc/bbs/movie/M.1540440390.A.4E4.html
title: '[普雷] 女性的先行者 Woman Walks Ahead'
content: "雷文防雷資訊頁\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n1.影片名稱\
  \ : 女性的先行者 Woman Walks Ahead\n\n2.觀影時間 : 2018/10/23\n\n3.觀影地點 : 住家網路\n\n4.觀影方式 :\
  \ 網路，iTunes 美國版商店\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n閒來找片，從雀姐 Jessica Chastain 找起，我猜品質應有一定保證吧？就找到了這部以\
  \ 1890 年美國女畫家西部原民之旅為題材的真人真事改編電影《女性的先行者》。這譯名很神聖、很有雀姐關注女性題材的味道，不過其實不過就是女主角被取了個蘇族名字「女人走前面」而已，就像28年的「與狼共舞」一樣。\n\
  \n想想也有趣，雀姐出道作《喬琳娜》我一直覺得像是女版《阿甘正傳》、然後這部又很像女版《與狼共舞》，一定有個在原初社會有陰影創傷的白人主角、像個鄉巴佬來到了原住民部落（而且又是蘇族）、受到酋長與族人的智慧啟發、一起面臨現代西方文明的輾壓、美麗的部落必如歷史就此毀滅、但在白人拯救者的心中留下了改變的火種...\
  \ 嗯，近年大家更有印象的類似題材可能是阿湯哥《末代武士》？老梗看多了、背後的意識形態我們也都了然於胸了，那來放鬆看看它有沒有玩出什麼新把戲也好。\n\n\n\n\
  \        坐牛酋長 x 平權畫家\n\n電影時間設定在 1890 年，同樣拍蘇族已比《與狼共舞》晚二十幾年，此時歐裔美國人已強推 Dawes Act of\
  \ 1887「土地總分配法」推行印地安人保留區，也經過了印地安多部族抵抗的印地安戰爭，在和談與特赦後暫時進入一個不穩定平衡狀態。男主角「坐牛」Sitting Bull是在\
  \ 1876 年「大小角戰役」中全殲美軍第七步兵團的英雄酋長，女主角 Catherine Weldon 則是紐約布魯克林的獨立女畫家，她對印第安人權益很熱血對坐牛本人也很心折，就在\
  \ 1889-1890年來到了達科塔州「立巖區」畫坐牛肖像，並成了坐牛的秘書、翻譯兼幕僚。\n\n史實在 1890 時，兩人已各自59歲和46歲，兩位演員在拍攝時則是49歲和39歲，好像硬有那麼點降齡以製造男女浪漫關係的味道\
  \ XD 另外關於女畫家 Weldon 的史實也改動了些：史實她本來早就很叛逆、離了兩次婚獨立育一子、也早已投身印地安權益運動；電影中她卻像個被壓抑一生的籠中鳥，一直被禁錮在丈夫羽翼下直到喪夫、甚至還有一場丟掉丈夫肖像畫象徵擺脫父權的戲，彷彿這趟西行之旅是要給她這大女孩啟蒙為平權鬥士似地。\n\
  \n\n\n        民族壓迫 x 性別處境\n\n且不說編劇導演怎麼想，我覺得這種女性覺醒的敘事和雀姐選片的風格好像很合。一個女畫家 Weldon 要掙脫女性禁錮、一個蘇族酋長\
  \ Sitting Bull 要面對白人壓迫，兩個弱勢的結盟對話處處是火花！\n\n先不說此片的大時代歷史事件怎麼描繪，我認為電影最迷人之處在兩人之間，大概佔了全片中段\
  \ 1/3。紐約來的白人女畫家像個城市鄉巴佬、處處帶著文明人的成見嫌東嫌西的，面對原住民既充滿文化刻板印象、又帶著關心尊重要來幫助你們的白人解放者眼光... 電影就要讓雀姐演傲慢被一次次打臉、然後慢慢醒悟體察對方處境、並慢慢揭露自己身為女性受迫的創傷陰影作為印證、兩個弱勢守護者彼此激勵成長更強壯。\n\
  \n我們就看著兩人策馬走路一場場戲，彼此針鋒相對打通成見心眼開。妳當畫家畫畫賺錢、為什麼不是畫我肖像該付我錢？問我何不戴頭冠、那妳為何不穿婚紗？我裸體妳可以在旁觀看畫畫、妳自己又敢裸體嗎？妳當個畫家獨立賺錢、我不賺錢以繪畫紀錄一生不算個畫家？你不穿傳統服飾該穿白人西服有其民族屈服、那我穿束腹穿高跟又不敢騎馬何嘗沒有性別陰影？走在酋長前不尊敬、走在酋長後像俘虜、那你是要我走哪裡？喜歡走快的\
  \ Weldon 於是得到了「女人走在前」的蘇族名字，看雀姐為原民挺身而出卻被白人男性打成豬頭後，這名字得來既是血淚又是療癒。\n\n\n\n        民主鬥士，理想主義\n\
  \n不過在大歷史敘事上，電影看來改編有點大、訊息傳達得也有點模糊。此時盤旋天空的兩大歷史潮流，一是 1887 印地安人保留區法案、在片中由白人軍人與官員們推行、也等著蘇族人們出來投票或默默接受；二是蘇族新流行的\
  \ Ghost Dance「鬼舞」運動，是生活領域與天然資源處處被擠壓的蘇族人唯一的避世出口。\n\n歷史上美國白人很怕「鬼舞」代表著傳統部族的下一波集結反抗，也以鬼舞為藉口出兵逮捕並趁亂射殺坐牛、繼以「鬼舞戰爭」與「傷膝地大屠殺」；而此片告訴我們事實上鬼舞並不是這樣、坐牛不但不參與甚至還很憂心，因為那是蘇族人的迷信避世，而坐牛與進步蘇族青年要訴求更務實的獨立自主。\n\
  \n電影呈現的 1890 美國西部小鎮圖像，很複雜而有多種暗潮，有白人與印地安人間的壓迫卻也有交流的希望，只可惜電影談不太清楚容易令人一頭霧水，恐怕容易覺得此片是負面的人格分裂、而非正面的多角度衝突並陳。小鎮上的重要歷史人物是印地安事務官James\
  \ McLaughlin，由 Ciaran Hinds 演出可惜沒什麼存在感。史實中他積極推行法案壓迫原民，電影中卻像個中立的官僚只想把投票程序順風走過。史實他娶了原民妻子，電影一樣有這妻子還讓他拔擢了一位印地安警長，想要同化印地安人進入白人文化的企圖明顯，但印地安人同樣也在學習他們的組織智慧與策略。\n\
  \n\n電影中這位印地安警長兼坐牛姪兒，就是跟白人學習的進步派，他對「鬼舞」的迷信虛無痛心疾首，心知一定要用現代方法抵抗白人。同樣地電影也把史實較傳統的坐牛給描繪得進步開明，把史實還需Weldon翻譯的處境給拍成英語流利有現代視野但自主掌握「我想說英語時才說」。然後坐牛與Weldon的跨文化交流中，要學的竟是西方「民主」去投票！在電影描繪的坐牛殺戮一生已想放下屠刀逆來順受時，由Weldon告訴他「還能和平奮戰、就靠投票」，然後連競選演說和「競選委員會」都出現了\
  \ XD 還真的坐牛再次成為部落領袖號召大家投票反對保留地法案，超熱血！（誒）\n\n\n\n        黑暗編劇，務實主義\n\n不過此片編劇是 Steven\
  \ Knight，是《美麗壞東西》與《夜刑者》等倫敦底層黑暗題材出身的編劇，近年《同盟鶼鰈》也在浪漫愛情表面下談了諜報的罪咎與報應，我一直覺得他的電影不會這麼傻氣樂觀好棒棒。果然，在看起來很天真的投票過關擋下法案後，世故黑暗馬上襲來，而且以此片先前已經鋪出的幾個大梗給予一記殘酷的回馬槍。\n\
  \n第一個大梗，是 Sam Rockwell 飾演的虛構上校，一開始對理想主義 Weldon 女士處處充滿男性傲慢打她退堂鼓，在理想主義的 Weldon 反對保留區法案之不公不義時，他看起來則像是不公不義的擁護者而且嘴臉囂張。但到電影最後票都投完了，他的形像瞬間\
  \ 180度轉向，知道投票結果勢難挽回後，驚人地以女主角覺得他一定傲慢不懂也懶得學蘇族語言把坐牛沈痛打醒、把 Weldon 強勢拖離戰區。也許他才是本片中真正頭腦清楚努力把事做對的人？原來他是世故務實的戰地創傷心靈，才不相信有什麼原住民革命獨立的美好理想，知道保留區法案已是現實下保全人命的妥協。\n\
  \n\n第二個大梗，是曾被坐牛屠殺的第七騎兵團將軍George Crook，史實中在軍團地位不高、在印地安戰爭的角色也不重，在此片卻被提升為老謀深算高深莫測的大魔王。印地安這邊認為他要來血洗部落為同袍報仇了、白人這邊認為他一來鎮住局面就可以阻止印地安聲勢大好的投票了，誰知他竟一路奉公守法冷靜自持、甚至高談民主捍衛印地安投票權利，一度給人一種「戰場上性命相對才是血性漢子」的印象。然而到最後，讓印地安人投票通過只是個幌子，反正美國才沒有民主，假民主讓你過關後才有藉口展開真屠殺，反而強推保留地的白人官僚至少還心念印地安人生命存續。\n\
  \n\n\n        浪漫導演，熱血樂觀\n\n原來，Weldon這隻白人女性小白兔的美好理想，只是一場空，她自以為搞了一場如「女權之聲」的「原民之聲」民主運動後，反而把本來還能在白人文化輾壓下壓抑存活的蘇族朋友們推向了屠殺死路。突然間，一個好棒棒的東方主義白人拯救故事急轉直下、成為一個批判美國白人擴張也打臉理想主義者的警世故事，果然至少在敘事上\
  \ Steven Knight並沒有自我撤守，差堪告慰。\n\n只是空有好編劇的好故事架構，被導演 Susanna White拍起來卻失了那正邪難分、疑雲重重、經過價值辯論後恍然大悟的層次感，令人把電影看到前九十分鐘還覺得是一場直線樂觀不用多想的民主勵志片、到最後十分鐘才被回馬槍很狠打一巴掌，觀眾臉熱辣辣地疼痛還未能回神思考時、電影已經進入片尾\
  \ credit 不再做任何討論反思與後話了 XDD  我喜歡看人間複雜的寫實片、也並不排斥單純熱血的勵志片，但此片好像是個寫實編劇與勵志導演的 mismatch\
  \ ，令人有點不知該怎麼去理解那充滿矛盾又不說清楚的成品。\n\n這位 Susanna White的過去作品與風格我不熟，不過光看此片中，她處理得精彩的地方都在\
  \ Weldon 與坐牛兩人的跨文化交流。雀姐演技如常精彩不用說，男主角 Michael Greyeyes 竟也毫不輸人地將神聖酋長、滄桑中年、大地之子、異國情人等多種魅力集於一身！片中一場長達半小時的兩人作畫生活如田園詩畫，令人好希望外界紛擾都不存在、電影竟也拍得和外界紛擾毫無關係也是一絕\
  \ XD 此片要文化靈感很豐富、要浪漫交心很清雅、要政治驚悚也有些，只是混在一起有點掉漆，如有興趣是可以調整一下自己眼睛切成兩部片來看，也許會比較滿意。\n\n\
  \n--"
