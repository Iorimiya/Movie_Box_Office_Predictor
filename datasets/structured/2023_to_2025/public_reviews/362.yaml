url: https://www.ptt.cc/bbs/movie/M.1665566762.A.EDD.html
title: '[新聞] 6年打造《孫行者傳》　首映會「眾神雲集'
content: '新聞網址：



  6年打造《孫行者傳》　首映會「眾神雲集」他最圈粉


  2022.10.11 20:51 臺北時間


  文｜熊景玉


  台灣原創3D動畫電影《孫行者傳》歷經導演莊家修耗時6年率領團隊完成破百角色、50多

  個場景設計及3D化製作，數位3D中文版首映會上，除了有小朋友裝扮成孫悟空、牛魔王外

  ，《西遊記》原著中代表性兩大美人，同時也是牛魔王大小老婆的鐵扇公主和玉面公主，

  也在首映會同台爭豔。


  10月10日首映會前已有許多熱心人士及學校包場觀賞《孫行者傳》，還有善心人士公益包

  場邀請家扶中心、孤兒院、中低收入戶的小朋友進戲院一起看電影。團隊當時想製作這部

  電影的初心，就是想透過《西遊記》題材改編，來傳達各種正能量與愛。


  首映會之前已超過2,000人包場觀影，之前出席學校包場的孩子們，對於戴上立體眼鏡後

  能看到立體3D影像感到驚奇與震撼，尤其在孫悟空與牛魔王化身為各種動物後的打鬥場面

  更讓他們興奮不已，直呼：「孫悟空好帥喔！」對於片中取經團隊遇到困難永不放棄的精

  神，小朋友們都覺得獲得很多啟發，映後紛紛表示被這位2022年最新版的「孫行者」圈粉

  。


  《孫行者傳》的製作過程相當不易，導演莊家修表示最困難的事莫過於「製作經費拮倨、

  資金籌措困難、沒有宣發預算」。電影屬於無形資產，在台灣不像美國募資容易又可以向

  銀行融資貸款，加上台灣的動畫電影尚無破億的票房紀錄，「在台灣動畫電影的募資就更

  困難了！」


  美國洛杉磯華納兄弟片場舉行的好萊塢銀幕電影節（Hollywood Silver Screen

  Festival 2022）選中《孫行者傳》在美國洛杉磯對公眾進行「特別放映」，也激勵了團

  隊的士氣，盼讓更多人看到這部由台灣人創作、改編自經典文學的3D動畫。團隊還表示，

  希望大家進戲院觀看《孫行者傳》時選擇3D立體版本，以獲得最佳觀影體驗。《孫行者傳

  》將於10月14日上映。




  --'
