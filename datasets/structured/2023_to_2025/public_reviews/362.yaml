url: https://www.ptt.cc/bbs/movie/M.1513395731.A.59A.html
title: 'Re: [討論]我想為星戰八的 路克天行者 平反一下'
content: "恕刪\n\n補充一下好了 (會有電玩雷)\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n上個月推出的星際大戰 戰場前線2裡面\n\
  \n有一段路克的關卡，裡面是在講EP6之後\n\n路克尋找絕地聖地的過程\n\n其中一顆星球上有皇帝的收藏庫\n\n在那裡路克遇到了帝國軍煉獄小隊的戴爾\n\n\
  (本來遊戲推出時有人推斷是芮的父親\n 但是根據EP8的劇情這個應該不成立)\n\n順手救了他，展現出了絕地大師的風範\n\n如果是舊共和的絕地應該鳥都不鳥吧\n\
  更何況是帝國的菁英部隊\n\n但路克沒有這麼做，因為他本來就不是傳統的\n嫉惡如仇絕地武士(在說你啦安納金)\n\n因為路克那時應該已知道，絕對的正義並不會\n\
  永遠是光明面，有可能是導致墜入黑暗面的原因\n\n關卡最後路克找到了絕地聖地的羅盤\n跟戴爾分手時路克說:\n\n「很高興我們相遇，戴爾。」\n\n戴爾:「現在呢?我們各自離開，假裝什麼事都沒發生嗎?」\n\
  \n路克笑道:「我覺得你辦不到。你心中還有矛盾。」\n\n戴爾:「我心中當然有矛盾，我又不是瞎了，\n我知道帝國幹了什麼事。但...除了帝國還有什麼呢?」\n\n\
  路克:「你還有選擇。」\n\n戴爾問到:「你是說反抗軍?」\n\n路克:「不是，是讓自己變更好的選擇。」\n原文:\"No, the choice to be\
  \ better.\"\n\n戴爾:「....」\n\n路克:「願原力與你同在。」\n\n\n\n這樣的段落，也許才是符合路克心中\n那種絕地大師的模樣\n\n\
  \n可能路克那時候就就知道，\n絕地武士、反抗軍並不等於光明面\n而西斯、帝國軍，並非都是可恨之人\n只是取決你如何面對心中的矛盾\n\n只是後來的十幾年間又發生了許多事\n\
  才變成了EP8大家看到的絕地阿北\n\n這個可能...米老鼠之後再補完吧\n光靠電影解釋路克面對凱羅忍墜入黑暗面的過程\n仍稍嫌倉促些\n\n到了最後，我心中最懷念的\n\
  應該還是那個在遙遠邊境的星球上\n望著兩顆夕陽，一邊夢想著探索銀河、\n也探索自己的少年路克吧\n\n--\n= =? 抱歉讓你森77\n是還蠻無聊的 EA你知道的"
