url: https://www.ptt.cc/bbs/movie/M.1578659926.A.E20.html
title: '[  雷] 星際大戰9--天行者的崛起'
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\n\n\n這集在我的star\
  \ wars系列應該可以跟8不相上下，接著以「羊性」的觀眾角度去想，雖然\n\n7真的拍得超爛，但應該一切都是舖哏，而且可能最後的這個超大哏一開始就想好了。\n\
  \n僅就幾個元素聊一下：\n\n【節奏】\n\n太過緊湊。\n\n很多地方有很多很棒的情感，還沒辦法太深入情緒裡就接下一段，導演把觀眾想得太聰明\n\n(雖然這是安全棋)。整片超級緊湊、情感也很棒，但那故事性還是稍微讓我出戲(有點膩\n\
  \n了電影的「故事性」)\n\n【致敬】\n\n用得太多，但每一次致敬我還是發現自己雞皮疙瘩。\n\n【探討之題】\n\n我喜歡這部的一個原因是，它其實就是在講整個人生，換言之，討論的東西一點也不空泛\n\
  \n。\n\n1.「魔性」這東西真的本來就存在於每個人身體裡面，但依Kylo Ren走正之前的計畫，「\n\n面對它」老實說真的讓人不知道後果；接受了它，你會入魔？還是平靜地擺脫它？\n\
  \n我亦常感受到自己體內的魔性，是故，我對這議題很感興趣。\n\n最近才看了有關憂鬱症而自殺的青少年影片，那幾位父母共同的特點是，他們在當下根本\n\n不知道自己的孩子一直在承受著焦慮和憂鬱，因為孩子們總是裝出快樂的樣子。\n\
  \n這個體內的掙扎，亦是當世警語。\n\n2.「鍛鍊」跟「思考進步」本來就會讓人激動，而且處在那樣的狀態下，是很讓人平靜的\n\n。\n\nRey的求道之路，正代表，如果你想進pixar工作，那你就好好練3D\
  \ Max這樣的意思。\n\n3.有人說過，「原力」這東西會如此讓人著迷，就是它很玄；你永遠不知道那到底是什麼\n\n。\n\n是故，在裡面的角色提及代表惡的最終軍團、跟正義的反抗軍，所爭的不過就是正邪，但\n\
  \n語末來了個「原力」，你難道不會想去沙漠中看能不能悟道？你難道不想知道赫塞到底知\n\n道人生的意義了沒？\n\n4. Rey代表的，雖然是電影讓人喜愛的角色通則，但百看仍會激動；你喜歡巴菲特是因為\n\
  \n他有錢，但你絕不會忘了，你曾經尊敬過以前的翁山蘇姬、或甘地。\n\n「不求回報的付出」，永遠會讓人眼眶紅了。\n\n5. 路克代表的指導者，言語亦是有味，「面對自己的脆弱」向來是進步的方法，他說了\n\
  \n自己躲在那個島，是因為恐懼。\n\n那應該是我們都想追求的智慧吧。\n\n【角色】\n\nRey：從7的懵懵懂懂、到8的超級冒險，我突然發現她在這部的演技多了很多層次，很多\n\
  \n掙扎、靜思、激動、開心，都很容易讓人深入她心裡。當然我每集都是很久後才發現自己\n\n望著她，然後在心中一直說：「我愛妳」。\n\nRey終於成了絕地武士，因為她生來就是，但中間吃的苦也不是觀眾吃完爆米花就忘掉，\n\
  \n她最後得到的，不過就是反抗軍一些人的拍肩鼓勵。我在她於自身的正邪掙扎之苦、經歷\n\n一堆冒險後看到同伴無恙泛淚的眼睛，我亦是泛淚。\n\n她代表的，就是永遠亮晶晶的正直。\n\
  \n但她的「把一切往身上攬」既成就了她、亦是自身的太過剛正不阿。\n\n比如知道了自己的身世後決定獨自幹掉白卜庭，當時我心想為什麼不找Kylo一起去？(後\n\n\
  來證明這招是錯的)\n\n但決定犧牲自己拯救整個反抗軍，確是令人泛淚。\n\nKylo Ren：是個非常濃烈的角色，體內掙扎不斷、個性又不定時炸彈，說中二？倒是覺得\n\
  \n本身個性就太過偏激(抑或是情感太過濃烈)\n\n結局高潮的地方，我以為他會代替Rey幹掉白卜庭，讓西斯跑進身體裡後，再讓Rey殺掉自\n\n己，這個想法可能太狗血，但那確是我當時害怕的事。\n\
  \n由於挾著影帝之名，我一直在挑剔他演技，直到我的情感流洩出來後，才發現他剛剛的表\n\n演完全無斧作之跡(那瞬間我才真的服了)。\n\nHan Solo出現得實在太帥，老福就是永遠都會讓人喜歡的演員。\n\
  \n波和杜麗：相當詼諧的男女相戀，在杜麗拿第一軍團通行幣給波時，我想到了一個人。\n\n【劇情】\n\n劇情相當紮實，而且白卜庭的邪惡真的惡到讓人反胃。\n\n\
  【場景】\n\n每個場景都精緻、特別且有風味，不論是Kylo與Rey戰鬥的惡浪交織艦上、拜神節、或杜\n\n麗帶眾人進入的酒吧(我不知道為什麼幾乎每一集都喜歡在酒吧裡行關鍵之事)、白卜庭的\n\
  \n儀式進行場、各種空戰的場景，都超級棒。\n\n【特色】\n\n很喜歡這部裡絕地武士跟西斯的能力。\n\n比如Rey有了治癒的能力、導致Kylo後來也有；或Rey跟Kylo可以用心靈溝通；Rey甚至強\n\
  \n到可以隔空控制整艘戰艦(I love her)；Rey跟Kylo是充滿生命力的二元體；白卜庭的吸\n\n星大法。\n\n當然，我覺得最酷的是，西斯跟絕地武士的「預見能力」。\n\
  \n或許可說，他們早預見了一切，所以各自行了計畫，才有了這些故事。\n\n\n\n如果可以，我最想要預見能力。\n\n 一位網友說，好來屋連續劇怎會不留伏筆？但這集卻沒有，只是。\n\
  \n我記得在7還是8的時候，結尾有個小孩子使用了原力隔空控制掃把。我想，那應該是伏筆\n\n吧。(我仍是會期待)\n\n--\n\n\n--"
