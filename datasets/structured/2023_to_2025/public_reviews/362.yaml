url: https://www.ptt.cc/bbs/movie/M.1473235602.A.F4D.html
title: '[好雷] 媲美無間道的"使徒行者"'
content: '朋友抽到了使徒行者特映會的票券，因為多一張就分給我，於是

  就依造票卷的時間前去觀看，先去看了預告片，原來這是港劇的電影版，

  不知道沒看過港劇的我會不會看不懂呢?


  在這邊先解答:就算你沒看過港劇也沒關係，還是看得懂劇情的!


  以下有雷.

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  劇情:

  簡單來說，這部就是類似無間道的劇情啦，警察臥底在黑幫，代號叫做BLACKJACK，但記

  錄毀損，所以警察要找出這個臥底是誰(警察是吳鎮宇)

  反派的關鍵就是張家輝跟古天樂啦，至於誰是BJ，當然就是他們兩人其中之一，(這應該

  很明顯吧)看他們兩個尬戲真的很爽!

  劇情峰迴路轉，看到後面才會恍然大悟，像這種警察臥底片當然就是要這樣鋪陳才刺激。



  節奏:

  這部的節奏非常流暢，事件環環相扣(我猜是要敘述的事情太多了)，所以不會讓你覺得有

  拖戲的感覺，這點給個讚。


  打鬥場面:

  一開始的飛車橋段有點太商業化了，一般來說，飛車追逐都會有各式各樣的撞車…等等，

  但主角幾乎都閃過，根本是要強調跑車的性質= =  實在有點可惜

  不過中間的毒品搶奪槍戰以及最後面張家輝+古天樂 VS BOSS的打鬥，我就覺得還不錯，

  真的有演出兄弟情的感覺。


  搞笑場面:

  飾演警官的吳鎮宇與他的女友有許多搞笑的橋段，雖然是廣東話，不過還是可以被搞笑的

  畫面給吸引到:


  例如臨死前還要說~為什麼看A片不用錢….

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .


  不知道答案的請GOOGLE 或者自行去看電影吧(笑)


  總結:

  總分100分的話 我給這部80分  那天首映會出來 蠻多人也是讚譽有佳

  我認為這部片值得拿來跟無間道比 王晶終於拍出一部還不錯的片子啦!








  --


  因為大部分都是原來港劇迷用港劇的標準來評價 當然會覺得差


  就跟資深超人迷 抨擊超人大戰蝙蝠俠這部片一樣的意思


  我是沒看過港局 單純用警匪片的觀點 我是覺得不錯的


  光看古天樂跟張家輝飆戲我就覺得值得'
