url: https://www.ptt.cc/bbs/movie/M.1569666056.A.B4B.html
title: '[好雷] 《無間行動》工整的臥底劇情片  /火行者 '
content: '《無間行動》不難看，但我怎麼想不出文章標題


  火行者


  這篇文章的標題想了很久，因為《無間行動》不會讓我覺得有一個很鮮明的記憶點或想要

  特別強調的點，一時想不出能拿什麼來當標題。



  這部片子中的角色，都蠻…凡人的，包括壞蛋也包括FBI，可以說這是它真實的地方，本

  來小混混就有很多無腦的，FBI裡面也不是每個都超強，也是會搞砸也是會狀況外。只有

  主角（喬爾金納曼〔Joel Kinnaman〕）的設定比較精明，但偏偏倒媒，要幫FBI當線人，

  卻遇到搞不定狀況的FBI，讓他無法抽身，又惹上麻煩，讓他越陷越深。


  所以我們會看到的不是主角所嚮無敵，而是主角很努力了卻還是因為鳥人鳥事鳥

  運氣而越弄越糟。。簡單來說，我們就

  是在看主角夾在兇惡的黑幫、無能的FBI、狀況外的紐約警方、老是被當人質的老婆女兒

  之間，覺得很厭世卻一定要為了老婆女兒脫離這個情境。


  於是主角就一直持續在很煩的狀態，喜歡不喜歡這種

  感覺就看個人了，我是偏商業娛樂的觀眾，會覺得壓得我有點累，至少還能持續吸引我想

  知道接下來會如何。


  大部分的時候是「身不由己

  」純應變，到最後才展現出一些主動的謀略，算不上是太大的驚奇。



  除了主角以外的角色，都很平板，有羅莎蒙派克〔Rosamund Pike〕，設定應該是要有一

  些道德掙扎，可是沒什麼時間讓她好好掙扎，倒是常有真砸，真的搞砸，我個人覺得不夠

  鮮明，就落得只有功能性（要讓主角麻煩一點時，就請羅莎搞砸或整他，主角快不行時，

  就讓羅莎良心發現而幫一下）。我很喜歡的克里夫歐文〔Clive Owen〕，也浪費了，演個

  好像有點權的FBI長管，裝得很厲害的酷樣子，到最後卻是不太厲害的凡人，唯一有點搶

  演的是最後一個微笑，但微笑完就不再出場了。另外還有凡夫俗子來演紐約警察，屌屌的

  樣子，必要時出場一下（比如需要救人，FBI又不在時），一樣是功能角色。另外還有個

  老婆，沒什麼媽味，總是哭個不停，要她逃也不逃，專門當威脅主角用的工具，存在的目

  的是讓主角有個活著的目標。這些角色站著不動拍劇照都蠻好的，很有樣子，但動起來就

  弱了。


  因此，我不太覺得《無間行動》是個看角色的電影，就連主角本身的內心戲，大概都只有

  很煩、好煩、怎麼這麼煩而已。他總是處在「靠，放過我吧」的心境中，除了感到他真的

  很衰之外，沒感覺到什麼其他的。


  喜歡喬爾應該要看，他多半在耍憂鬱帥，還有露一下…。想看爽片就不建

  議，這種氣壓爽不太起來。


  不過，寫到最後，我還是整理不出《無間行動》的賣點，所以標題就只有這樣下了。








  --'
