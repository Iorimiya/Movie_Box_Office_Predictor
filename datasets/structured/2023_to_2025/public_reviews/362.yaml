url: https://www.ptt.cc/bbs/movie/M.1576716562.A.E8F.html
title: '[新聞] 《STAR WARS: 天行者的崛起》首波評價出'
content: '新聞網址：




  《STAR WARS：天行者的崛起》(STAR WARS: The Rise of Skywalker) 首波評價出爐！這

  次最終章找回《STAR WARS：原力覺醒》(STAR WARS: The Force Awakens) 導演 J.J.亞

  伯拉罕 (J.J. Abrams)，他將在電影中為雷恩強生 (Rian Johnson) 的《STAR WARS：最

  後的絕地武士》(STAR WARS: The Last Jedi) 做一個完美收尾。


  從首波評價來看，大部分評價都認為這次劇情豐富飽滿，並充滿著「服務粉絲」的內容，

  絕對會讓星戰迷滿意，但也有一部分影評人認為導演非常「不尊重」雷恩強生執導的上一

  集，其中某些發展讓人感到突兀。但大致上來看，這部電影為系列各角色都找到一個完美

  的安身之處。


  以下為目前《STAR WARS: 天行者的崛起》評價整理


  Uproxx 網站編輯 Mike Ryan：


  「《天行者的崛起》絕對是曲折複雜的一部《星際大戰》電影。我喜歡絕大部分的內容，

  但前半段充滿著大量的展示、新劇情、搞笑以及發射器，看起來像一次濃縮了三部電影一

  樣。我最喜歡的《星際大戰》特色就是將重點聚焦於角色本身，但這部電影的前半全都在

  「秀」，而之後確實就有好轉了。此外，藍道 (Lando) 棒透了！多數的劇情都有種趕火

  車的感覺，皇帝的劇情真的有點詭異。」


  IGN 娛樂內容部門 Laura Prudom：


  「我還在消化《天行者的崛起》。片中情緒的高點真是太壯觀了，許多故事線也都有了句

  點，有些有正面的結果，有些則沒有。但其中有些劇情感覺很沒必要，像是對於《最後的

  絕地武士》的導正，有一些看起來也毫無道理。我必須要再看一次。」



  紐約時報記者 Kyle Buchanan：


  「《天行者的崛起》想要對雷恩強生更不尊重的話，他們就得用上動作補幀技術了。」


  The Wrap 網站影評 Yolanda Machado：


  「雖然我對這部電影並沒有太過驚豔，但這一次感覺也太多服務粉絲的劇情了，而《天行

  者的崛起》在可預料的發展裡隱藏著許多無法預料的驚喜。所以我當下的反應就是：天啊

  ！我愛死這個系列了，而我絕對會想念天行者傳奇的。」


  Variety 網站編輯 Adam B. Vary：


  「我需要一點時間來消化《天行者的崛起》。這部電影的內容實在是太豐富了。但片中最

  棒的時刻都相當安靜且充滿情緒，讓這部電影可以成為一部發人深思的作品。」


  Fandango 總編輯 Erik Davis：


  「有夠史詩！整部片都一樣。《天行者的崛起》是一部傑出的最終章電影，將各種東西都

  塞了進去。動作、冒險、解答、幽默、真心、愛情以及意志。我在電影後段都一直熱淚盈

  眶，本片為天行者的故事畫下一個完美句點。」



  Mashable 網站編輯 Chris Taylor：


  「《天行者的崛起》內容相當豐富，就像把九部電影的劇情塞到一部裡一樣。我大概要花

  個九天才能消化完畢。」


  mashable 網站娛樂副總編 Angie J. Han：


  「《天行者的崛起》實在是太飽滿了！充滿大量的愛，無論是令人振奮的時刻、劇情轉折

  或是驚喜客串一樣都沒少，但也令人深思。其中有一些相當討喜的角色，無論是珍娜、

  D-0，當然還有芬恩。也是時候該向我們最愛的莉亞將軍好好道別了。」


  VanityFair 網站記者 Anthony Breznican：


  「當人們討論《星際大戰》系列時，他們會聯想到他們的童年、他們最棒的回憶、他們所

  愛的人以及分享對象。《天行者的崛起》重新帶回這一切的感覺。我愛死這部電影了。我

  的感覺就像……」


  Gizmodo 網站娛樂記者 Germain Lussier：


  「《天行者的崛起》確實帶來、甚至是超越粉絲們期望的一切。但這對我來說並不一定是

  一件好事，我喜歡其中幾個部分，但也有不太喜歡的。離開戲院時，我心中對這部電影仍

  相當矛盾。」


  影評人 Mark Ellis：


  「我充滿了情緒、出乎意料、驚訝、驚艷又震撼。更重要的是，我很滿意。感謝你的再次

  歸來……《星際大戰》。」


  影評人 Grae Drake：


  「這才叫做結局嘛！」


  Amazon Studios 的 Matthew Ball：


  「雖然迪士尼換了《星際大戰》電影的導演，也匆忙地推進這部續集的拍攝，這些問題依

  然能夠在《天行者的崛起》中看到，但電影也充滿著許多有趣、華麗及值得一看的內容。

  我不確定西斯大帝白卜庭 (Palpatine) 需要出現在第三集中，但他絕對是凱羅忍角色故

  事終曲的關鍵。片中具有大量能夠讓粉絲滿足的片段，其中某段還聽到有人大喊『讚啦！

  JJ』而其他觀眾附和著一起歡呼。觀影過程發生了許多次這樣的狀況，這也是繼『初代三

  部曲』後最『初代三部曲』的一部《星際大戰》電影。」


  CinemaBlend 網站影評 Eric Eisenberg：


  「《天行者的崛起》有許多精彩的部分，但同時也有一些讓我感到失望的片段。電影裡的

  一些走向似乎有點太過突兀，也有著一些不那麼好的服務粉絲劇情，更忽視了一些細節，

  我有點難過。」


  CinemaBlend 網站：


  「這個嘛……《天行者的崛起》徹底脫離《最後的絕地武士》，但同時也沒有像《原力覺

  醒》一樣令人振奮。這是一部滿是動作場面的電影，並具備著大量粉絲會愛的內容。《星

  際大戰》粉絲們，你們準備好了嗎？」




  ==

  原來國外影評給低分的理由，還能有因為不夠尊重雷恩強生喔？


  給我放尊重喔~!!不然我給你低分喔!!


  這三小狗屁理由？


  雷恩強生有尊重JJ的第七集嗎？有尊重星戰這一整系列嗎？


  他拍第八集就是為了自已自爽的好嗎？


  然後嘲笑那些自詡為老粉的星戰迷不懂星戰，


  刻意拍了一堆為反轉而反轉突兀片段，看著觀眾一臉怒意為樂。


  第九集為了力挽第八集製造的狂瀾，才會趕火車趕成這樣好嗎？



  國片影評：第九集就是為服務粉絲啦，沒劇情啦、不夠反轉啦、


  為粉絲服務就是糞，給我尊重雷恩強生喔~!!


  星八最高!!沒有之一!!!



  --

  我還看到一篇影評抱怨的點是蘿絲被邊緣化，這是好萊塢的性別與亞裔歧視，


  令人失望…?????


  星戰是一部標榜外星的太空電影，整天只會糾結在亞不亞裔與有沒有性別歧視上???


  那上一部不就在歧視外星種族跟機器人？


  這部給你滿滿的外星生物跟不要小看機器人耶'
