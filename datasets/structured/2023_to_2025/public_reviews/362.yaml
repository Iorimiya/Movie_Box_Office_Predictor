url: https://www.ptt.cc/bbs/movie/M.1513182084.A.7D1.html
title: '[討論] 星際大戰8 天行者家族 (有雷)'
content: '星際大戰8雖然好看，但我不禁感嘆"天行者血脈"大概是徹底終結了



  Rey最後真相大白，她真的只是nobody跟天行者家族毫無關聯



  路克的死亡，也代表Kylo是僅存的天行者血脈



  Kylo和Rey在電影中的互動真的讓我以為這兩人會有好的發展



  但最後Kylo卻是走向皇帝路線，天行者血脈幾乎是確定結束在他這一代了





  不得不說迪士尼很大膽，敢讓天行者家族徹底滅亡



  我是有想過Kylo會向佐助一樣被Rey揍回來，不過不太可能吧......


  --'
