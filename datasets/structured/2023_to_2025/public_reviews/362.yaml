title: '[好雷] 怒火邊界2：毒行者  '
content: '有帶到第一集一點點劇透，不致於影響觀影但不喜誤入。























  先講結論，怒火邊界2：毒刑者，依舊是一部值得觀賞的電影，劇情維持一貫風格的冷硬

  派寫實，但也有數場緊張的槍戰與吊人胃口的戲碼，喜歡第一集的人應該還是會喜歡這部

  作品。不過我個人實在非常喜歡第一部，而第二集老實說有點比不上，無論導演、編劇、

  攝影與配樂第一部皆是上乘之選，尤其結尾艾蜜莉布朗與班尼西歐的對峙，羅傑狄金斯用

  強烈對比營造出的攝影風格以及最後緩緩帶入的神配樂完全呼應了整部電影的核心，至今

  仍讓我無法忘懷。第二部相比之下就沒有如此傑出的場面，導演與攝影功力都沒有特別令

  人驚豔的地方。




  怒火邊界系列的主軸是美墨邊境問題，最大宗的兩部分毒品與非法移民，第一部講了前者

  ，第二部則著重在移民的部分，只是隔了一條河或一個只在地圖上才有的邊界線，對這兩

  個國家的人民而言便是天堂與地獄的區別。許多電影早已講述過這個議題，對於中南美洲

  的窮人，想要過好日子，除了繼續在原生國家裡加入幫派浮沉，就是得想辦法偷渡到美國

  找工作。




  第一部的劇情圍繞在女主角艾蜜莉布朗身上，較少對於兩位男主的著墨，第二部毒刑者則

  是對兩位男主角做了更深入的探討。在前作中，亞歷山卓彷彿就是復仇的化身，一絲情感

  都不存在，而麥特更是把人當工具使用的任務主管，除了完成任務一切都不在他考量之中

  。第二部則挑戰了觀眾對這兩位主角的原先看法，展現了他們人性的一面與各自不能退讓

  的部分。雖然沒有明說，但怒火邊界系列最大的反派即是美國政府自己，只要符合政府利

  益，法律都可以轉彎，政府製造紛爭再從中獲利，再把責任通通推給別人，兩面手法玩得

  不亦樂乎。




  推薦大家去看一下這部片，畢竟是台灣人不太可能接觸到的議題，劇情獨立，即使沒有看

  過第一部的人也不會有甚麼大問題，在MI6的特務生活外，也值得去看這種在美墨打滾的

  特務，並不是每個都像伊森一樣光鮮亮麗。


  --'
