title: '[好雷] 《夢行者保羅》，你夢見過這個人嗎？'
content: '部落格版：


  《夢行者保羅》是部相當有趣的電影，某方面來看很莫名其妙，某方面來看覺得很詭異，

  然而也有些時候看了很驚悚。這部由《我恨我自己》導演克里斯托弗博格利所執導的美國

  電影，不論是裡頭的故事情節或是由尼可拉斯凱吉所飾演的保羅他那扮相，都確實會讓人

  想起十多年前相當知名的都市傳說「夢男（This Man）」。而對於對夢男傳說隱約還有印

  象的觀眾來說，也許自己就像是餐廳那位女服務生，忍不住問著保羅是否在哪裡看過他？

  那種意外的既視感是又讓《夢行者保羅》多了些樂趣。即使後來夢男遭揭露是由當初最早

  提起的Andrea Natella所策劃的一場大型社會實驗與病毒式行銷，夢男形象照片也是修圖

  而來，可後來他也再度表示夢男並非純編造，提出了或許不是夢男來到每個人的夢裡，而

  是做夢的人們正在其他空間維度裡穿梭遇見了夢男的曖昧說法。只是不管真相如何，夢男

  的廣泛流傳，依舊引起了人們對於夢境、對於集體潛意識的探討。


  在由Andrea Natella架設的網站裡試著從不同理論來分析這個現象，從宗教理論、夢境投

  射理論到著名心理學家榮格提出來的原型理論等，而《夢行者保羅》雖然沒有明確告訴觀

  眾電影是否參考了夢男傳說，不過就整個劇情來看確實就像是夢男傳說的再包裝，在保羅

  開始廣泛出現在大眾的夢中時，劇中同樣有從心理學角度來切入整起事件，亦也有人用夢

  境版的曼德拉效應來形容之。但即使如此，《夢行者保羅》並沒有過度的艱澀難懂，相反

  的我認為導演克里斯托弗博格利似乎也沒有想要帶著觀眾去深入研究與分析，而是繼續延

  續著上部作品《我恨我自己》的黑色喜劇風格，把十多年前的都市傳說套上現代社會濾鏡

  ，讓當年從未有人「真正見過」的夢男真的走進大眾生活裡，看著主角保羅因爆紅後的自

  我膨脹再到後來因夢境內容改變導致他成了人人避之唯恐不及的人物的無所適從，反思著

  在這你我都有機會成名十五分鐘的網路時代裡，該如何去面對與調適瘋狂簇擁與無人聞問

  的強烈落差？



  《我恨我自己》猛力諷刺著當代社會渴求關注、渴望在乎成癮的現象，《夢行者保羅》則

  對網路帶起的來得快去得也快的流行文化進行嘲諷。如同電影沒有告訴觀眾，為什麼很多

  人都在夢中見到保羅？保羅為什麼是那個出現在許多人夢裡的男人？夢境內容從平和轉向

  劇烈的轉變是否因為保羅的情緒起伏有關？而最後又為什麼這樣的集體夢見保羅的現象會

  突然停止？電影沒有解釋，也不打算交代，因為不論是保羅還是「你夢見過這個人嗎？」

  （Ever Dream This Man？）所帶起的流行風潮，不過都會是熱度不再後的又一消逝在大

  眾生活裡的過去式，有誰會特別去在乎保羅後來怎麼了？於是這樣的沒理由的開始與沒理

  由的結束，不如說是導演克里斯托弗博格利太過了解現代社會普遍存在跟風現象而給出的

  結論，也就是「乾脆讓觀眾跟著裡頭的人們，追逐著保羅跑了一段路後各自解散」，至於

  為什麼要追著保羅跑？「喔，因為保羅現在很紅。」


  之所以《夢行者保羅》能這樣充滿戲謔感，很主要的原因是主角保羅的人設。尼可拉斯凱

  吉飾演的保羅並非像夢男那樣從未現身，他是你我日常周遭或多或少都有的那種不起眼的

  小人物，某方面來看他似乎也有像《我恨我自己》的女主角席格娜，他同樣渴望著自己能

  被看到，他希望自己不論是當名父親、丈夫還是教授，於家庭於工作、學術界都能被重視

  ，保羅雖然不是年輕人，但身為現代社會的一份子，他和席格娜都有著存在感焦慮。然而

  保羅和席格娜最大的不同是，他從來就不敢為了獲得他想要的一切去實際行動、甚至是付

  出代價。他不滿意自己在別人的夢裡只是個什麼都不做的旁觀者，卻也不滿意自己在後來

  的夢境中做了很多壞事，一邊說著平常的自己不會在別人需要幫助時袖手旁觀，一邊嚷著

  現實的自己不會外遇、不會傷人，不論什麼時候總是習慣先把自己當成弱勢，用可憐的受

  害者模樣講些別人聽來就是情緒勒索的話，反感不由自主的湧上，可又覺得自己也會跟保

  羅一樣。



  導演克里斯托弗博格利連兩部作品都反映著當代社會某種現象，即使沒有親身經歷保羅或

  者席格娜所經歷的，也能對身處同個資訊時代而有所感。《夢行者保羅》看似劇情天馬行

  空，但整個引起的話題與社會反應又都很貼近現實，導演克里斯托弗博格利不僅讓過去被

  人遺忘的都市傳說重新再被喚起，更賦予了此故事一個新的樣子，帶給觀眾熟悉又新鮮的

  感覺。而除了那些繽紛絢爛的特效是加分項外，尼可拉斯凱吉的表演亦是亮點，他把保羅

  這個說話枯燥又平庸無趣、總愛賣弄淵博學識，成名後又過度自我膨脹、脾氣變得暴躁的

  傳統中年男子角色給詮釋的很好，前後個性的壓抑與爆發強烈反差。喜歡這個角色的講話

  節奏與語調，前面聽著親切，後面聽著不耐，都在夢境內容轉變後有了分界，那種明明講

  話方式一樣，卻因他當紅與不紅而感受不同，更把這份感受轉換成對保羅的態度，一如對

  於爆紅卻無續航力的人事物的普遍態度。


  --'
