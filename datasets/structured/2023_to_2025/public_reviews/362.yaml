url: https://www.ptt.cc/bbs/movie/M.1572069055.A.F6F.html
title: '[新聞] 復4冠軍位子坐不穩 "天行者"馬上來逼宮?'
content: '2019-10-26 02:11 聯合報 記者蘇詠智／即時報導



  漫威巨片「復仇者聯盟：終局之戰」刷新影史票房紀錄還不滿半年，馬上碰到來自同屬迪

  士尼的新片強力挑戰，

  ，影迷也將和馬

  克漢彌爾、嘉莉費雪所扮演的路克與莉亞徹底告別，因而，果真

  美國開放預售第一天，就在著名的訂票網站Fandango締造「星戰」系列有史以來最佳預售

  紀錄。





  ，「天行者的崛起」若能夠維持首日預

  售大勝「原力覺醒」的氣勢，極有可能在北美再破史上票房紀錄，將「終局之戰」擠到第

  3名。




  ，特別是好萊塢影片目前海外最大票倉中國，迪

  士尼為了提振「星戰」系列在當地的低迷人氣，打算先推出中文版、適合中國觀眾口味的

  系列小說，先炒熱行情，試圖拉抬「天行者的崛起」票房，是否成功？年底上映時就見分

  曉。







  --'
