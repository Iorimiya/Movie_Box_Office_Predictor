url: https://www.ptt.cc/bbs/movie/M.1474200810.A.CB1.html
title: '[普雷] 使徒行者觀後感'
content: "我本身很少看香港的電影,除非有朋友介紹,才會陪同一起欣賞.\n最主要是因為對這些港星都不甚熟悉,如果真要說知道的話,應該就是古天樂吧!\n畢竟他拍過的戲實在太多了,再來就是對他也比較有好感一點~\n\
  所以這次會想看使徒行者,也是因為他的關係,才對我有些許的吸引力XD\n\n        剛開始裡面就提到跨國販毒組織,然後從這裏面想要找一位blackjack的警察臥底\n\
  ,這種電影內容,我印象中大概聽過無間道而已,大家互相諜對諜還挺有趣的,然後還出現一\n套特有的康氏密碼,好像和摩斯密碼差不多吧,感覺上是非常相似~真得沒學過的人不知道\n\
  在說什麼XD\n        其實就整體的架構內容還蠻撲朔迷離的,除了有警察的刑事中心針對這群毒梟之\n外,還有這群毒梟大老闆之間的攻防與相互猜忌;當然最大的重點是兩大男主角(張家輝和\n\
  古天樂)的情義相挺和心理作戰,當然裡面都是算計居多,這也算是這部片的精隨吧!!!\n這種片子也不免俗的需要一些槍戰打鬥畫面,增加一些味道,讓畫面更有可看性~\n\
  我覺得場景都選的不錯,不管是一開始的澳門或是接下來的巴西...都會讓人挑動神經\n        在裡面除了比較陽剛的打殺之外,內心戲方面也要來一點男女之間的感情橋段,像\n\
  是警官吳鎮宇和他女朋友阿丁,原本從打打鬧鬧到後來彼此之間相依相惜,讓人還挺感動的\n說! 另外張家輝和他的女保鑣之間,又是不一樣的情感聯繫,讓人體會到更深層的一面\n\
  \       最後的結局我也只能說,這位警察臥底blackjack到底是誰,真相會有那麼點不好猜\n,\n因為這當中都在變來變去,讓你看不透...\n   \
  \    就整體而言,我個人還蠻喜歡這兩大明星的對手戲,種種心理戰的互相轉變,真的看\n得十分過癮XD\n\n\n--"
