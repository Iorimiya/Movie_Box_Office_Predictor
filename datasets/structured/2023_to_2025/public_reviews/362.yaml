url: https://www.ptt.cc/bbs/movie/M.1471190836.A.16A.html
title: '[ 無雷] 好久沒看到那麼好看港片使徒行者'
content: '真的好久沒看到這麼好看的港片


  猶如當年無間道翻版


  張家輝真的渾身都是戲


  連他的魚尾紋都能帶出演技


  推薦大家可以進電影院看這部


  劇情峰迴路轉


  整個動作戲安排精彩


  很讓人入戲去猜接下來到底會怎樣


  幾個港片演員不愧是實力派


  看他們同台飆戲就是爽


  劇情非常緊湊


  劇本寫的很好不老套


  q sir是媽媽奶的那個(應該有人記得)


  張家輝雖然早期拍很多爛片


  但是那些片現在來看很經典很好笑


  但角色有點被定型


  後來沈澱以後


  推掉很多戲約


  後來選的劇本真的看出他的演技


  劇本選的好，演技也是磨的鋒芒綻放


  推薦大家去看


  比危城好看太多了。。。


  --'
