title: '[新聞] 絕地武士難當 天行者路克轉行當小丑'
content: "絕地武士難當 天行者路克轉行當小丑\n\n\n馬克漢米爾以《星際大戰》系列電影中的「天行者」為人所知。（翻攝自網路）\n\n〔娛樂頻道／綜合報導〕好萊塢男星馬克漢米爾以《星際大戰》系列電影中的「天行者」\n\
  為人所知；但事實上，他一直「獻聲」蝙蝠俠「小丑」；據報導，日前馬克拍完《星際大\n戰8》後，便在超英影集《閃電俠》的第三季中，飾演小丑。\n\n\n馬克漢米爾在《閃電俠》演小丑。（翻攝推特）\n\
  \n事實上，早在1992年，馬克就已經開始替動畫片《蝙蝠俠》中小丑配音，由於備受好評，\n他成了小丑的專屬配音員，舉凡電視、電影動畫及遊戲都由馬克配音。現在他終於不再躲\n\
  在幕後，可以正大光明揭露他的小丑身分了！\n\n\n馬克漢米爾一直幫小丑配音。（翻攝自網路）\n\n\n\n--\n\n                   \
  \                                          \n\n--"
