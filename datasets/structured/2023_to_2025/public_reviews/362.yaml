url: https://www.ptt.cc/bbs/movie/M.1513597850.A.88B.html
title: '[討論] 雷 星戰8的文戲'
content: '其它文裡面很多人求告知這部戲的文戲


  就用我最喜歡的老天行者當例子

  描寫一下他演出的心境


  原本456中二腦衝一哥

  經過50年的戰火摧殘洗禮 個性已跟當初不一樣


  看清自己能力有限:

  "妳期待什麼? 我拿著光劍一人砍翻第一軍團!? 這世界不是這樣運作的"


  害怕+無助:

  經過多年努力戰爭依然持續

  戰友幾乎全部死光只剩自己

  唯一不變的只有黑暗面

  不管如何燃燒自己都無法照亮的黑暗

  永遠存在

  仔細看在描述戰爭,反抗軍時 天行者沒落的眼神


  這恐懼在忍身上被點燃:

  "當我看到忍的黑暗面 一瞬間所有念頭從我腦中一閃而過"

  "就像是飛奔而過的影子 雖然只有一瞬間"

  "等我回過神來 感到的是無限的自責 與內疚"

  "還有忍 那害怕 失望的眼神"


  內疚:

  "回過神來看的的是 忍 那害怕還有失望的眼神"

  "莉亞覺得是史諾克的錯"(但我知道不是)

  (是我的錯)


  "砍死我 就好像砍死你老爸一樣 那情緒會永遠追著你"

  (就像我後悔拿刀對著你一樣)


  "你來幹嘛? 高高在上的說你要原諒我?"

  "不 我來跟你說 我很抱歉"


  害怕x2:

  "妳居然完全不抵抗黑暗面!?"

  "黑暗面不是引誘妳 它是覺得妳很適合!"

  "經過忍 這次我懂得要害怕!"


  身為英雄 把重擔往自己身上扛

  走越遠只覺得越懊悔 一事無成:

  "如果仔細看絕地的歷史 就會發現我們一無是處"

  "絕地在鼎盛時期 自己創造出了最強的黑暗"


  矛盾:

  下定決心要燒毀聖殿

  卻又在聖殿真的燒起來的時候急著滅火

  (很喜歡剛剛才跟尤達嗆完要放火

  結果馬上又慌慌張張想滅火的天行者

  很可愛)


  自傲:

  Rey耍笨時天行者白眼翻到後腦

  (這邊觀眾反應不錯)


  忍拿劍 擺出菜雞姿勢時

  天行者嘴角的偷笑

  (我很喜歡這笑容 很有氣勢)


  傳道:

  吐出真心話的1.2課

  看似沒教 但其實在大雨中有嘗試教導的第3課

  (仔細看在大雨中天行者怎麼和Rey拿棍子在對打)

  (Rey亂揮都被打回來 Rey被反打失去重心天行者就不出招 等Rey站穩揮出下一招再繼續

  根本超有愛的導師)


  (有人抱怨天行者怎麼打輸我也是呵呵

  安安沒在看電影就不要在電影板po文好嗎)


  愛:

  親吻莉亞

  大雨中用木棍陪Rey發泄情緒+教學實戰

  用最後的生命能量對忍道歉 嘗試開導忍



  基本上 一個壯年/老年男子 可以演出來的點差不多都有了 頂多就是拍的很趕


  --

  中二天行者成長了 變的更滄桑 事故

  傷痕纍纍 有味道

  期待中二天行者的觀眾也該成長了'
