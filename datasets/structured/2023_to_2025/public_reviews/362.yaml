url: https://www.ptt.cc/bbs/movie/M.1664331699.A.FAB.html
title: '[新聞] 3D動畫《孫行者傳》花6年打造 觀眾驚呼'
content: '3D動畫《孫行者傳》花6年打造 觀眾驚呼超逼真

  2022/09/26 05:30

  自由娛樂



  〔記者鍾志均／台北報導〕3D動畫電影《孫行者傳》由導演莊家修耗時6年率領團隊完成

  破百角色、50多個場景設計及3D化製作，描述唐僧一行人前往西方取經，孫悟空為借芭蕉

  扇而對上牛魔王和鐵扇公主的冒險故事，該片日前舉辦試映，吸引觀眾直呼「超逼真」！


  為描繪經典《西遊記》的角色，讓人物以立體3D動態在銀幕上各展神威，莊家修絞盡腦汁

  ，最後選擇讓角色造型介於真人與卡通的混合，「另外依照原著角色個性，設計符合的身

  高，當角色對戲時，才能達到鏡頭前視覺的平衡感。」


  另外台詞部分也是一項大工程，莊家修說：「劇本修改期間邀請各年齡層及不同行業的人

  讀劇本，給予關於對白的建議，經過60幾次的修正才定稿。」而考量到配音員當時的感情

  表達，很多對白甚至是在配音當下才完成。」《孫行者傳》10月14日在台上映。









  --'
