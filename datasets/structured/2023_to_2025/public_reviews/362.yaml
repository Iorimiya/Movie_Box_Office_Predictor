url: https://www.ptt.cc/bbs/movie/M.1218022267.A.036.html
title: '[好雷] 海角七號 伴隨著思念與勇氣的天行者'
content: "這部片實際上映的日期是在這個月底(8/22)\n但有機會得到了特映會的票  讓我有幸提早去看了這部令人動容的電影\n\n先外插一小段，如果有印象，之前魏德聖導演所製作\"\
  賽德克．巴萊\"短片，應該可以感受\n到魏導對於拍好一部片子的決心，雖然壯志未酬，但這部片卻反映了一部份對於國片品質\n的決心。這部片，斥資台幣近五千萬，就國片而言，算是大成本的製作了，而演員表一攤\n\
  開，有許多是我們熟知的國內藝人，如范逸臣、民雄、小應、馬念先等等...另外也請來\n如田中千慧與中孝介等日本藝人，為這部片增加了不一樣的活力。\n\n另外，在劇情中所用的言語和台詞，都可以讓人感覺到濃濃的在地風味，不論是笑點或是\n\
  景點，都是部具有\"台灣風味\"的電影。\n\n故事的劇情，從網站上看到的介紹，會覺得這是部劇情十分龐大的片子，跨越六十年的時\n間書信所繫起的愛情故事，一個現今充滿不安和問號的樂團，需要提及的部份實在太多，\n\
  在看完預告時對這部片充滿期待，也擔心如何才能消化這樣的內容。\n\n不過事實証明，我的擔心是多餘的。\n\n接下來，大好雷。\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n首先說一下它的演員部份。就選角方面，角色和本人的契合度算是相當高的，也不會讓人\n有太多\"\
  演戲\"的感覺，言語的表達和肢體的動作算是十分自然，也就像是生活在我們身旁\n的這群小人物般鮮明。尤其是在口語表達的部份，沒有矯情做作的詞彙，髒話罵得強而有\n\
  力又切中時間點，不避\"穢\"的演出，不論是劇中的那個人物，都有達到這樣的成效。\n\n第二個是剪接。前面提到了這算是一個前後敘述十分龐大的故事，一來必須將長達六十年\n\
  的故事做個交待，另外又必須與現正發生的事件相結合，在交錯剪接之下又不能讓人有著\n情緒連貫的效果。長達六十年的思念和壓縮在數天得要成軍的樂團，另外再加上每個角\n\
  色的部份人情趣味，不停的交揉而成的這段故事，有時是讓讀信的回憶將現實的情況用另\n一種記敘的方式呈現，有時又是用現實的進行曲拉長書信中六十年的執念，而這樣的交錯\n\
  ，一直到末段的舞台表演，用三首歌曲做了完美的傳達。\n\n劇情的設計是有轉折的。從開始到\"選秀\"這段，分述個故事中角色不同的性格和背景，一\n直到中後段的\"\
  辦桌\"之前，會讓所有人感覺\"現實\"的部份是完全無法進展的，呈現一種混\n亂的凝滯，衝突、分岐、意外，讓這一個臨時成軍的樂團在浪濤之中找不到前進的方向。\n\
  \"辦桌\"(or辦事...之後)，表現的是各個團員裡一種情緒的發洩，找到了舒發的管道，再\n配上各個空景與音樂的陳述，像是跌落谷底的人群找到了另一個光亮的出口。\n\
  \n以台灣國境之南為主題的一個故事，想當然爾需要許多的\"地理介紹\"，這部片將恆春這塊\n地方的風土人情和海岸風光做了相當切實的描寫，逆光的拍攝或是環境的構圖，都是十分\n\
  引人入勝的。\n\n與其說它是部讓小人物實現夢想的故事，到不如說它是部將思念和回憶交錯於現實行動中\n的一部片子。而音樂則是將這一切引爆的信號，在表演結束時聽到的安可，有種不由自主\n\
  想跟著大聲叫的衝動(還好忍住了...不然在電影院裡叫安可...播放員應該會傻眼)，舞台\n上三首歌曲的表演，各自有著它代表的意義...第一首是夢想的實現；第二首是情感的渲\n\
  洩；第三首則是古今的交疊...讓最末的情緒隨著影片的視線悠揚惆悵。\n\n以上，海角七號 Cape No.7\n\n大推這部讓人又哭又笑的好片\n請指教\n\n\
  感恩。\n\nps.另外附上 海角七號 官方部落閣\n   \n   看完它的狗仔獨家  其實還滿有趣的\\(^▽^)/\n\n--\n漂盪．流浪\n\n是一種生活情況，也是一種心理狀態\n\
  \n--\n◆ From: 125.225.20.16"
