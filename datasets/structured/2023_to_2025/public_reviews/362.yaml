url: https://www.ptt.cc/bbs/movie/M.1702962056.A.064.html
title: '[討論] ［好雷］夢行者保羅個人觀點'
content: "先講結論，我自己是超愛這部電影。第一次看到國外宣傳是「我恨我自己」的導演加上A24?\n作以及Ari Aster監製就決定一定要去電影院看。看完後確實有強烈感受到三方的強烈風格?\n\
  \ \n \n這邊想討論的是，究竟這部「夢行者保羅」想講的到底是什麼呢？我自己的想法是諷刺\n「置入性行銷」的廣告。在看電影的過程讓我最直觀的連結就是變形金剛。\n\
  \ \n最開始的廣告產品就像保羅出現在夢中時只是什麼都不做的在一旁看著，這時大眾會覺得很\n新奇，「喔！這個產品我用過（或是看過）欸」，一閃而過些觀眾日常會接觸到的東西會感\n\
  覺自己與影片的連結性更強。但接著保羅真的做出些行動時，卻開始讓觀眾感到厭煩甚至憤\n怒，當這些所謂廣告產品的目的性開始暴露出來，原本只是一閃而過的場景變成刻意為之的\n\
  特寫鏡頭，完全搶走了原本的重點，那批評聲自然會越來越多。\n \n導演的上一部電影「我恨我自己」就非常直接的諷刺現代社會中很多的人為了曝光，為了關\n注所做的事情，是一種極端自卑產生的極端自負。透過一件相對誇張的事件去講一個觀點。\n\
  當然，以上的想法只是我個人的感覺，每個人看完電影都應該會有不同的感觸，這邊只提供\n大家其中一個可能性。\n \n最後還是要稱讚一下我們的凱吉哥。把一個中年危機大叔的尷尬感演的很好，所有的冷笑話\n\
  、與家人女兒的對手戲、對前同事朋友的自卑感都展現的淋漓盡致。希望接下來還可以看到\n更多的凱吉！\n----\nSent from on my iPhone 12\n\
  \ \n--"
