url: https://www.ptt.cc/bbs/movie/M.1561776750.A.203.html
title: '[新聞] 「使徒行者2」集結3影帝 上演諜對諜'
content: "新聞網址：\n\n2019-06-28 18:21 聯合報 記者陳建嘉╱即時報導\n\n「使徒行者2諜影行動」由張家輝、古天樂及吳鎮宇三大金獎影帝再度合作演出，「無間\n\
  道」導演劉偉強監製，打造橫跨歐亞拍攝的超強巨製。電影宣佈拍攝續集時便備受觀注，\n今天公佈前導預告，充滿諜對諜的緊張氣氛，「人在做、天在看」的詭譎氛圍，互不信任\n\
  、敵我難分！\n\n「使徒行者2諜影行動」是「使徒行者」電影的續集，第一集在大陸和香港都賣出超高票\n房，在台灣沒有港劇的加持下，靠著緊湊又出人意料之外的情節，也創造了近千萬的票房\n\
  佳績，續集集合原班人馬，三大影帝張家輝、古天樂及吳鎮宇再合作，拍攝戰場也由前作\n「使徒行者」的巴西改為西班牙及緬甸，展開橫跨歐亞二大洲的臥底戰，無論動作場面、\n\
  以至情節格局都將更上層樓。製作團隊遠赴西班牙及緬甸取景拍攝，帶出異國危情。\n\n其中，演員們到緬甸出外景時，所到之處也都引來民眾圍觀，必需年動當地員警支援，才\n\
  能讓拍攝順利進行。電影劇情於熱情之都發生，呈現出一種異國天堂與地獄之間的情景差\n距，處處給觀眾帶來無限驚喜。\n\n「使徒行者2諜影行動」故事描述在香港市中心發生一起嚴重交通意外，刑事情報科（反\n\
  恐）警司葉國帆（吳鎮宇 飾）和總督察程滔（張家輝 飾）逮捕一名女駭客。保安部警司\n井進賢（古天樂 飾）認為葉國帆和程滔的逮捕行為非常可疑，向警務處處長要求禁止兩\n\
  人插手案件。調查範圍擴展到緬甸和西班牙，井進賢和程滔在多次的合作中產生矛盾，而\n在葉國帆的眼裡，這兩個人忠奸難分，警界高層則是認為葉國帆顛倒黑白，懷疑大量臥底\n\
  黑警滲入警隊，需深入某神秘組織調查事件。可是，警隊內人人皆有可疑，女駭客的口供\n裡也帶著誤導性，讓警隊高層更覺得霧裡看花，不曉得誰正誰邪。\n--\n   \
  \ \n\n ; \n\n \n\n--"
