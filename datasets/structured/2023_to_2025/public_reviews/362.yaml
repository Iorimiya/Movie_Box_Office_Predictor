url: https://www.ptt.cc/bbs/movie/M.1567351406.A.ED5.html
title: '[負雷]只剩演技的作品《使徒行者2：諜影行動》'
content: "不負責任影評-只剩演技的作品《使徒行者2：諜影行動》\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n大家好，我是老王。\n\n說到港片，警匪槍戰肯定是大宗了。\n\n97後我們能看到的喜劇少了許多，而在《無間道》後，講述警匪與臥底的作品也是越來越\n多。\n\
  \n無論是過去的香港四大天王，或是目前仍然活躍在一線的演員們，似乎經歷裡多少都有那\n麼四五部警匪片的作品。\n\n準備好瞧瞧這個佈滿臥底的混亂香港了嗎？\n\n\
  那麼，我們開始吧！\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\
  其實我一開始是有點擔心的。\n\n畢竟我沒看過《使徒行者》的相關作品，雖然知道是警匪臥底的題材，但一開始還是會擔\n心是否會跟前作有太多聯繫，而導致沒辦法充分體驗這部作品的魅力。\n\
  \n不過看完後我就安心了。\n\n《使徒行者2：諜影行動》是一部由由張家輝、古天樂及吳鎮宇共同主演的警匪動作片，\n故事以「臥底」為主題，圍繞著一份由身兼記者的駭客提供的警局臥底訊息。劇中張家輝\n\
  所飾演的程滔與古天樂飾演的井進賢為兒時玩伴，卻因為走私集團的綁票行動，而造就了\n自小分離。隨著臥底的調查深入，兩人塵封的兒時回憶也逐漸清晰明朗。\n\n港片的警匪追逐場面在這幾十年的薰陶下顯得異常成熟，無論是飛車鏡頭或是爆破鏡頭，\n\
  港片都有種不同於好萊塢的獨特魅力，而無論是張家輝、古天樂或是吳鎮宇都是備受兩岸\n三地各項獎項肯定的演員，這部作品以演技對飆來說，無疑是部合格的作品，但扣除演技\n\
  與爆破呢？我們還能看到什麼？\n\n這部作品為我詬病的地方有兩點，一是劇情，二是時間。\n\n劇情部分，整部作品雖然節奏緊湊，但故事線是十分單一的追逐戰，無論是反派的目的抑\n\
  或是臥底造成的危害，都沒有清楚的表現出來，僅只用較隱晦的情報洩漏去表現，但我們\n從劇情後面可以看的出來，潛入警局的臥底不只一人，但除了主角外，所有的臥底活像是\n\
  安分守己的公務員，沒發揮出一點用處。\n\n而眾人追尋的真相，到最後也沒發揮應有的價值與運用，反倒是靠著主角家中潛藏的名單\n，才將其他臥底揪出，那麼追尋那份警局臥底訊息的硬盤的舉動就顯得特別的沒有意義。\n\
  \n而時間部分，我只能說很多部分不如人意。\n\n大家也都知道香港現在面臨的問題與困難，在這個時候還在宣揚香港警方正面形象的作品\n，無疑是會受到一部分人民所唾棄的。\n\
  \n而即便這部作品中的演員都有一定聲望與能力，卻在時勢的驅動下，被更多的看法分散了\n焦點，造成這部作品註定無法得到應有的關注與評價。\n\n另外令我很出戲的一點在於，這部作品中有許多優秀的飛車場面與槍戰場面，但又顯得那\n\
  麼令人感到彆扭。\n\n是什麼樣的民眾車輛在槍林彈雨中還會繼續行駛？是什麼樣的車輛在翻車後都沒有人跑出\n來就能直接成為掩蔽物？\n\n是什麼樣的人可以半空中的車輛摔出來後立刻站起來？又是什麼樣的人能前一幕頭部中彈\n\
  ，下一幕變成擦傷？\n\n諸如此類令人不忍唏噓的畫面還有很多，這樣不嚴謹的表現方式也令人感到十分失望。\n\n我是老王，臥底沒錯，但請到告訴我這些臥底的價值是什麼！我們下次見。\n\
  \n圖文好讀 : \n\n更多影評 : \n\n--"
