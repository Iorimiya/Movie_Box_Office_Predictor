title: '[請益] 星戰九部曲天行者崛起在演啥？'
content: '防雷—————————













  休假沒事開串流平台看第九集，


  完全看不懂在演啥，


  西斯大帝莫名其妙就復活了，


  莫名其妙變成第一軍團等等一切都是他的計畫，


  然後凱羅忍為何可以看到韓索羅？


  韓又不是絕地英靈，也不是在夢境中，


  然後忽然又變好人了？



  凱羅忍為何要狂追芮，跟他一起統治帝國？


  自己爽不就好了？


  然後皇帝莫名其妙把兩個人的能量吸走就復活了？


  結果芮忽然得到千百代絕地英靈的支持，


  就秒殺了皇帝？


  片長2個多小時，要吐槽的實在有夠多，


  劇情完全沒連貫，


  我也可以接受電影不會跟現實一樣，


  但也不能不合理成這樣吧，


  踏上帝國巡弋艦是在外太空咧，


  還可以跟平常在陸地一樣戰鬥？


  重點是連太空衣、頭盔都不需要？



  我真的看不懂，


  如果不是有starwars的正字標記，


  我還以為是B級片，


  這部片到底在演啥？


  --'
