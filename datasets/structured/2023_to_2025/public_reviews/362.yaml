title: '[討論] 關於星戰有人誤以為天行者是稱號嗎'
content: '話說有人一開始就誤以為天行者是稱號，而不是姓氏嗎？


  記得最早接觸的是前傳的首部曲，當初看劇裡的人稱呼安納金為天行者，以為這是很會駕

  駛快艇而得來的稱號，畢竟這稱呼挺中二的，根本沒聯想到是姓氏


  多年後維基一查之下才知道天行者是姓氏，想知道有人跟我一樣嗎


  --'
