title: '[負雷] 星際大戰 天行者的崛起：爛得只剩特效 '
content: '圖文網址:


  【Star Wars：The Rise Of Skywalker】: 爛得只剩特效


  上映時間：2019/12/18    導演： J. J. Abrams


  觀影時間：2019/12/19


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  　　先說我不是星戰迷，但因為畢竟前面一到七都看了，這次第九集又標榜是系列最後一


  集，不去看好像哪裡怪怪的，所以就趁著今天休假跑去看了【星際大戰：天行者的崛起】


  。看完感想：這故事．．．星戰迷真的吃得下去嗎？？




  　　在開始之前，先聊聊我對前兩部的評價；【原力覺醒】的評價是不錯，看完真的會期


  待後續的故事；【最後的絕地武士】，我只覺得無聊，劇情很硬要，看完實在沒動力看第


  二次。這次的【星際大戰：天行者的崛起】，看完只覺得真的是夠難看，一堆莫名其妙的


  故事跟安排，看完真的不敢相信本片跟七是同一個導演拍的。




  　　【天行者的崛起】故事，其實就很星戰，大敵當前，反抗軍勢單力薄，主角們必須想


  辦法找到關鍵道具，早一步摧毀敵人的終極武器；而這次的故事絕對是這三部曲最詭異的


  ，先不論有無牴觸前幾集的故事，光這部電影自己的故事就說不通了。




  　　其實說句不中聽的，在看【天行者的崛起】時，一直給我一種【變形金剛】系列的既


  視感，雖然沒有到後者會看到生氣的程度，但真的有點神似，電影的劇情真的白痴到想不


  出戲都難；舉例說明一：某主角看著自己的朋友被抓上飛船，隨後飛船爆炸，主角們開始


  哀悼朋友的死，結果後來才發現他們搞錯飛船，朋友其實是在另一艘啦～沒事沒事。當時


  一群人在沙漠，全場就只有一艘飛船飛上天，想請問一下另一艘飛船是何時飛走的？？我


  怎麼不記得星戰裡有隱形飛船的設定？當初看著朋友被抓走的主角是被鬼遮眼了嗎？？舉


  例說明二：一行人潛入敵人大本營，二話不說槍殺了一堆敵人，結果隨後主角用心靈控制


  把敵人支開？？這麼方便低調的招式怎麼不一開始就用？非得要這樣打草驚蛇？？這類前


  後邏輯自打臉的故事在電影裡層出不窮，導致我在看電影時真的有點痛苦。而本片除了讓


  我出戲的故事外，還有一堆莫名其妙的故事。




  　　在【天行者的崛起】中，有一堆讓人感到問號的故事，第一軍團內的反抗軍間諜、


  C3PO的程式設定、Poe的過去等等，這些故事看到最後我只覺得寫故事的人是不是吃太飽


  了？這些元素就算全部拔掉也沒差，你今天單純放個類NPC的角色在那邊幫主角解任務都


  比這些不明所以的人好，搭配上沒邏輯的故事，整部電影真的越看越痛苦。




  　　再來，就是【天行者的崛起】最大的問題，也就是我們的兩位主角，Rey跟Kylo Ren


  ，這兩位主角在本片最讓我佩服的地方，就在於兩位把翻臉的功力練就到了爐火純精、甚


  至有點走火入魔的程度；本片雖然確實解答了Rey長久以來的身世之謎，但真相大白後只


  讓我覺得：「什麼？就這樣？這種鼻屎理由能讓你的理念動搖？現在的絕地武士是草莓不


  成？」結果在電影的最後，本片還真的證實了我的觀點：絕地武士真的是草莓。Kylo Ren


  的心靈真的脆弱的不可思議，他的腦袋到底在想什麼？他的內心究竟有什麼衝突，掙扎的


  點到底是什麼？我看完了三集依舊不懂，只覺得Kylo Ren想法轉變的速度已經快到我覺得


  他根本不是內心有掙扎，而是人格分裂，而這顆草莓能做到軍團第一武士完全是靠血統。


  本片絕大多數時間，就是看兩位草莓武士攜手演出超詭異的劇情；前一秒還殺個你死我活


  ，下一秒就可以握手言和；兩位在電影最後的某個舉動，真的害我直接飆髒話，前面三集


  完全沒有這方面的鋪陳吧？？現在是吊橋理論嗎？？？兩位主角嚴重缺乏刻劃絕對是這次


  三部曲最大的敗筆。




  　　至於Rey、Poe、Finn這三人組，故事上很明顯想把這三個人做成像【哈利波特】的主


  角三人組一樣，但說真的，這三部曲看完，我只記得這三個人大部分的時間都分頭行動，


  各做各的事情；當好不容易有三人集體行動的故事時，我只記得他們三個在吵架、鬥嘴，


  一路看下來真的看不出他們有什麼多強大的羈絆。而且Poe之前被詬病腦衝的問題，在這


  一集也還是沒改善，更瞎的是在這次的故事裡他竟然還被提拔！？反抗軍是沒人才了是不


  是？難怪被第一軍團打趴。Poe所擬定的作戰計畫，在我看來就是沒有計畫，完全是腦衝


  自殺秀，最後會贏根本是主角威能開到底，事前都看過劇本；而Finn脫離帝國風暴兵的這


  塊故事，我看完本片還是不知道電影想表達什麼，相信你的本能嗎？真的是有看沒有懂。




  　　至於【天行者的崛起】在特效這一塊，真的是本片欣慰的地方了，打鬥畫面還不錯，


  太空大戰的場面也夠大，可惜劇情實在太爛了，有些應該要熱血的橋段，白癡的故事卻讓

  我的情緒卻完全起不來。說到畫面，電影的開頭十分鐘真的讓我看了極度不舒服，但當電


  影演到後半段，回到一樣的場景時，我卻沒有不舒服的問題，不知道是我習慣了這種場面


  ，還是開場畫面真的太刺激。




  　　總結【星際大戰：天行者的崛起】，特效場面依舊不錯，可惜故事真的太爛，前後邏


  輯不通、主角反派缺乏刻劃、無意義劇情太多等敗因，都導致我在看電影時不斷出戲，看


  完感想就是四個字：莫名其妙！！




  【星際大戰：天行者的崛起】：難看，看了浪費時間。


  如果你是不太注重故事，只想看特效的星戰迷的話，還是可以看看啦～




  後記：　


  1.真的沒想到星戰會有給我【變形金剛】系列既視感的一天。


  2.看完本片，只覺得前一集路克的行為真的毫無邏輯。


  3.本片有滿滿的情懷，但因為我非星戰迷，所以不少地方只覺得眼熟，要我說這是前作的


  哪個橋段我還真的說不出來。


  --'
