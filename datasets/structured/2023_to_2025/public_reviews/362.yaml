url: https://www.ptt.cc/bbs/movie/M.1577329999.A.0BC.html
title: '[好雷]《STAR WARS：天行者的崛起》原力的傳承 '
content: "網頁版文章：\n\n\n\n\n\n影音影評：\n\n\n\n\n\n\n《STAR WARS：天行者的崛起》STAR WARS: The Rise\
  \ of Skywalker\n\n原力的傳承\n\n\n\n當「天行者的崛起」副標題一出，我真的很好奇這真的是最終章嗎？在觀賞完之後，我還\n\n是臣服於星戰這個世界所帶給我的感動，也再次讚嘆JJ亞伯拉罕能夠完全理解影迷們心中\n\
  \n的想法，也完全掌握到星戰世界所帶給影迷們的是什麼啟發與感動。\n\n\n\n想想這42年期間，《星際大戰》的故事一直離不開探討「原力」的本質，實際上正是回歸\n\
  \n探討我們「人」為何存在的真正價值；「崛起」在本部曲中被重新定義，不再只是像過去\n\n三部曲中的最後曲，描述反攻後的勝利，而是在於星戰的精神有沒有被「傳承」。\n\
  \n\n\n是呀！星戰幾個指標性的象徵：絕地武士的光劍、軍隊使用的爆能槍、帝國、反抗軍等組\n\n織，其實都只是故事中的角色元素；事實上它描述了我們在生命中所承受的成長與痛苦、\n\
  \n榮耀與喜悅，找尋平靜與幸福歸屬的過程。當我們在討論星戰的同時，喬治盧卡斯所建構\n\n的龐大世界觀，影響人們的並非只是劇情內容、片中那些狂想的物品，而是這整個文化的\n\
  \n融入，能否感受到片中那個描述虛無間存在的力量；「原力的傳承」其實無關九部曲是否\n\n劃下句點，而是能不能感受到其中的魅力與意義。\n\n\n\n它讓我想起在第八部曲，路克教導芮去感受原力存在的過程，也讓我想起首部曲金魁剛教\n\
  \n導安納金去感覺，不要想，相信直覺：「感覺」始終是我們閱讀星戰故事的方式。因為當\n\n我們試著解讀片中的邏輯，理性思考故事中的科幻情節，《星際大戰》這種被歸類成「太\n\
  \n空歌劇」，跳脫科學常理的電影類型，將會變得毫無意義。\n\n\n\n而本片做為第九部曲，將之定位為一個新三部曲的結束，我認為除了闡述星戰對於「原力\n\n\
  信仰」的傳承，也告訴著大家，我們正見證了一個時代的奇蹟，那是超越種族、血脈、甚\n\n至是年齡、性別、膚色，足以改變這個世界的核心價值。期待透過電影，或是電影所創造\n\
  \n出的周邊效應，讓我們這個世界變得更加美好精彩。\n\n\n\n我認為，《STAR WARS：原力覺醒》到《STAR WARS：最後的絕地武士》、《STAR\
  \ WARS：\n\n天行者的崛起》三部曲的整體概念，就在於我們能夠透過凱羅忍和芮兩人的改變，對光明\n\n與黑暗兩方的拉扯、糾纏與羈絆，都再再說明了在喬治盧卡斯後，不同的電影創作者對於\n\
  \n星戰故事和世界觀的詮釋，開始針對世代與世代間的衝突與矛盾加以深入闡述；而價值觀\n\n的「認同」，一直都是我認為這個新三部曲令我著迷的地方。\n\n\n\n\
  一個人能不能使用原力？到底是命中注定？能力強大與否，能夠靠著後天影響或訓練嗎？\n\n原本處於光明面的人，是否能夠輕易被動搖轉而投效黑暗？反之，試圖挺身而出、為了公\n\
  \n平正義犧牲奉獻，卻往往灰心喪志，就一定會轉向黑暗面嗎？我們在前傳三部曲能夠看到\n\n安納金如何一步步轉變投向黑暗，也在舊三部曲中看到人們為了信念而不顧一切地凝聚在\n\
  \n一起；新三部曲或許正是告訴了我們過去所謂的「天選之人」、「命中注定」論，其實無\n\n關血脈；信念的傳承，其實「認同」才是關鍵。\n\n\n\n回歸現實，我們正因為「認同」星戰，所以愛上星戰；我們正因為「認同」故事背後的內\n\
  \n涵，所以著迷於該世界觀裡的所有一切。那麼，我們理性來看看《天行者的崛起》，確實\n\n在前半段有著混亂而複雜的雙軸故事進行，醞釀了西斯大帝一直在暗中蠢蠢欲動的陰謀，\n\
  \n甚至是眾多天外救星的橋段安排；我們能不能在故事中段找到關鍵的切入點？讓後半段的\n\n高潮戲情緒一次爆發，我認為就也在於是否「認同」星戰罷了。\n\n\n\n\
  對我而言，本集故事從凱羅忍和芮兩人對自我認同出現轉折之處變得精彩動人；尤其是針\n\n對凱羅忍的轉變，「某位關鍵人物」的出現，絕對是本片最感動的地方。這個從《原力覺\n\
  \n醒》開始，不斷地對自我懷疑的角色，面對更強大的芮出現，相信在亞當崔佛這位極具爆\n\n發力演技的演員詮釋之下，擁有天行者血脈的凱羅忍，是我認為縱觀新三部曲一路走來讓\n\
  \n我最感動的角色。\n\n\n\n光明與黑暗不該一分為二，反而是共存且互相影響。為惡的同時，也能夠展現善的重要；\n\n反之為善的同時，勢必也會有觀念相左的人，與之對抗成為惡。藉由凱羅忍和芮兩人一消\n\
  \n一長之間的微妙變化，或許不正是對照到你我的人生，同時存在著善與惡呢？正如同星戰\n\n的世界紛紛擾擾，人們有七情六欲、權力不斷更迭，但核心本質的陰陽概念，善惡的共存\n\
  \n，旨在我們透過世間之事來更了解我們自己。\n\n\n\n不論如何，《STAR WARS：天行者的崛起》依舊讓我這個星戰迷看得痛哭流涕，內心澎湃\n\n又感動。而故事最終是否延續？是否有必要創造另一個傳奇故事，讓迪士尼繼續吸金？我\n\
  \n想都已不再重要。重要的是，我們能不能將星戰精神繼續傳承延續，認同星戰的理念，甚\n\n至是信仰，我想這才是本集「崛起」的概念，一個留個大家更寬廣的想像空間，讓我在有\n\
  \n限的生命中創造無限可能。\n\n\n\n願原力與所有人同在，直到永遠。\n\n\n\n--\n===========================Power\
  \ by============================\n        【XXY 視覺動物】  臉書粉絲團 / YouTube頻道\n      \
  \   \n\n=============================XXY===============================\n\n--"
