url: https://www.ptt.cc/bbs/movie/M.1579354766.A.323.html
title: '[好雷]【天行者的崛起】原力與我們同在 '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  對我來說《星際大戰：天行者的崛起》的結束，也象徵了我從孩提時一路看到成年的一個

  時代的落幕。因此我幾乎是噙著淚水看著整部電影落幕的。


  當片尾，芮站在塔土印行星上，看著巨大的雙星落日，在約翰威廉斯譜曲的絕地主題中拉

  上黑幕時。我內心無比的感動。我不可能不支持《天行者的崛起》，因為這是JJ特地為我

  而拍的電影，只有我這種人能夠理解他埋在電影當中的訊息，看得懂的我如果不愛這部電

  影 誰還會愛這部片呢？


  我愛《星際大戰》的世界，只因為它讓我在戲院當中，能夠離開日常生活，跟著劇中角色

  們去冒險，而我對這些角色愛得這麼深刻，他們在片中的離世與重逢，都讓我感動不已。

  因此，往後的《星際大戰》系列就算再放上大銀幕，我想到時候我應該也還是會仍舊含淚

  支持。


  像阿諾與史特龍，直到老還在為我們這些老觀眾拍《魔鬼終結者》與《藍波》。我們到底

  還有多少機會，能看得到這些銀幕上的英雄繼續存在於影院當中呢？


  我想，這也是身為一位愛著週遭人們都不關心的事物的觀眾的執著吧。

  其實這部電影已經是明顯的粉絲電影，他的意義其實已經不限於電影的本體了。





  --


  男人是一種很悲哀又很容易控制的動物，因為他們往往拼了命的取悅異性，或是從各種媒

  介取得任何可以引起性幻想的事物，甚至還因而犯下強姦或是偷窺等大小不一的罪，但是

  追根究柢，目的卻只是想要從自己的身上擠出那麼5C.C的液體而已。

  粉絲團



  --'
