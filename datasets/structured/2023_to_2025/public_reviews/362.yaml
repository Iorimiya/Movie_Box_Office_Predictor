url: https://www.ptt.cc/bbs/movie/M.1666176326.A.053.html
title: '[新聞] 台灣之光！花6年打造3D《孫行者傳》美國'
content: '新聞網址：




  台灣之光！花6年打造3D《孫行者傳》美國、東南亞搶談版權


  張綺云 焦漢文


  2022年10月18日 週二 下午11:52


  台灣原創3D動畫電影《孫行者傳》，改編《西遊記》題材，導演莊家修耗資6年打造的，

  率領團隊完成破百角色，加上50多個場景，讓人物以立體3D動態在大銀幕上各展神威，不

  少學校包場。這部動畫，已經在國際上，奪下超過30個獎項。


  預告《孫行者傳》：「師兄是怎麼了，被那該死的羅剎女給騙了。」


  揮著金箍棒孫悟空大顯身手，台灣原創3D動畫電影《孫行者傳》，改編《西遊記》題材，

  描述孫悟空為了借芭蕉扇，對上牛魔王與鐵扇公主，英雄冒險故事背後製作可不簡單。


  導演莊家修vs.團隊：「移動一下。」


  耐心指導團隊，把電腦裡的唐三藏化成立體，瞬間栩栩如生，他是導演莊家修從事3D動畫

  電影32年，為了《孫行者傳》，裡頭的破百角色及50多個場景，耗資6年打造。


  導演莊家修：「遇到最大的困難，我覺得應該是在執行的部分，那但是呢，我們在整個製

  作過程當中，一直都會有一些，應該說是貴人吧，能力理解我們想傳達的東西，給我們一

  些資金上的支持。」


  導演透露這次絞盡腦汁，前後改了60多次劇本，要讓角色介於真人和卡通，不少學校包場

  看小學生愛不釋手，各自扮喜愛角色。


  家長：「輕一點，輕一點。」


  《孫行者傳》不只在台灣受歡迎，還在國際短片節，擄獲30個國際獎項，甚至在美國影展

  播放也有熱烈迴響。


  導演莊家修：「在去年的美國電影展的時候，我們那時候完成60分鐘，那在當地有邀請很

  多美國的導演，我們對他們做一些私人的放映，他們給了我們很多很正面的評價。」


  導演莊家修說，目前和美國有影片合製的計畫，也等美國.東南亞、印度洽談版權。


  不只《孫行者傳》獲好評，余聿的動畫短片《島影》，在台中國際動畫影展中獲得台灣短

  片首獎，台灣3D動畫產業持續在國際上發光發熱。


  備註：


  台灣之光，全世界都在搶著買孫行者傳版權


  那之後可以在Netflix、Disney+上看了 對吧?


  票房破億應該也不是夢 是吧?


  --'
