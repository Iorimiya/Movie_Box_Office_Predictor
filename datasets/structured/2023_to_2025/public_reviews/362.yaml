url: https://www.ptt.cc/bbs/movie/M.1545132039.A.62A.html
title: '[新聞] 《星戰 9》劇情保密沒人性？「路克天行者'
content: '《星戰 9》劇情保密沒人性？「路克天行者」馬克漢米爾：我好像在 CIA 上班


  將於 2019 年底上映的《STAR WARS：星際大戰 9》(Star Wars: Episode IX)，將是天行

  者故事集大成之作。自 1977 年《星際大戰第四部曲：曙光乍現》(Star Wars: A New

  Hope) 以來的天行者家族故事將在此邁向終章，粉絲對本片自然十分期待。對此，盧卡斯

  影業 (Lucasfilm) 也必須採用全新的對策來防範各種劇透爆雷，不讓相關情報流入有心

  人士之手。飾演路克天行者的演員：馬克漢米爾 (Mark Hamill) 也透露了製作團隊是如

  何「保密防諜」的。


  《星戰 9》劇本簡直是最高機密

  「公司會派專人護送劇本搭飛機，」


  漢米爾最近向娛樂周刊表示：


  「他們負責將劇本送來給我，等我讀完之後還給他們。劇本不會在我手中過夜，現在也只

  能這樣了。」


  不僅是馬克漢米爾閱讀劇本的同時有專人監督，腳本還以「紅底黑字」印製，確保內容不

  會因遭到偷拍翻印而外流，他表示這和《曙光乍現》時整個天差地遠。


  「我還記得當我在讀第一部星戰劇本時，我的反應是『哇！這是我看過最天馬行空的劇本

  了！』我把它拿給我的好麻吉看，問他『你覺得如何？』，他說『這真是太狂了！我可以

  拿給 Meredith 看看嗎？』，我說『好啊！』」


  馬克漢米爾憶道：


  「劇本幾乎就這樣在我的朋友間傳了一輪。當然，那時候沒有人在意，但現在，搞的我好

  像在某個類似 CIA 那樣的最高諜報機關工作一樣！他們把印在紅紙上的劇本送到布拉格

  給你，讓你越讀頭越痛！」




  有實體劇本簡直奢侈──而且還不能做筆記


  由於馬克漢米爾的角色在《星際大戰》系列的身分十分關鍵，他因而可以使用實體腳本，

  但其他演員只有上了防拷機制的電子檔。但即便如此漢米爾可以拿到實體腳本，但還是必

  須恪守相關使用規範：


  「我喜歡做筆記，有時候還會塗個鴉幫助我想像畫面，」


  這位演員如此表示：


  「我比較老派，一直以來都習慣閱讀紙本腳本，但電子檔腳本完全沒辦法作筆記，這很不

  符合人性；當我們在拍《星際大戰八部曲：最後的絕地武士》(Star Wars: The Last

  Jedi) 時，他們同意留一份紙本腳本在我身邊，但我必須寸不離身的帶著它，晚上還得鎖

  在保險箱裡。


  我能理解他們如此謹慎行事的原因，因為一旦腳本外流，整部作品就危險了！」


  《STAR WARS：星際大戰 9》的相關細節目前尚未公開，雖然我們知道本片預計將於

  2019 年 12 月推出，但粉絲們一定還是希望能儘快獲得相關消息！




  --'
