  他真的想要征服其他世界根本不需要最後才亮出來\n老白根本也不認為芮會贏他  他只是要她的身體\n不然早就佈下重兵了\n沒有人會想要用艦隊打一個人\n\n\n\n\
  嗯?我以為他一開始就是要芮殺了他，他才能進入芮的身體\n你說有提到芮是唯一可以打敗老白是哪個部分呢?"
