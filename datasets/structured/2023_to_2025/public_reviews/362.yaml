url: https://www.ptt.cc/bbs/movie/M.1577064650.A.C3A.html
title: '[新聞] 《STAR WARS：天行者的崛起》評價也超兩'
content: "新聞網址：\n\n\n\n《STAR WARS：天行者的崛起》評價也超兩極！聽聽給予電影負評的影評人怎麼說——\n\n J.J. 亞伯拉罕 (J.J.Abrams)\
  \ 回歸執導的《STAR WARS：天行者的崛起》(Star Wars:\nThe Rise of Skywalker) 終於上映，但上映後卻引來相當兩極的評價，爛番茄的新鮮度\n\
  僅 59 %，負評的原因雖各不相同，但整體來說，多數影評人對最終章劇情的「過度豐富\n」以及忽略前作《STAR WARS：最後的絕地武士》(Star Wars:\
  \ The Last Jedi) 的設定，\n都感到失望。\n\n有趣的是，對雷恩強生 (Rian Johnson) 執導的《最後的絕地武士》有所不滿的粉絲，似\n\
  乎都相當滿意《天行者的崛起》，相反來說，喜歡《最後的絕地武士》的粉絲，對這集的\n劇情就感到有所不足。而給予電影負面評價的人認為電影哪裡不好？或許可以看看影評人\n\
  們怎麼說——\n\n《STAR WARS：天行者的崛起》負評原因是？\nAssociated Press 的 Jake Coyle ：\n\n「雷恩強生的《最後的絕地武士》某些地方值得爭論，但整體來說仍充滿力量。可是\n\
  J.J. 亞伯拉罕的 《天行者的崛起》卻漫無目的、節奏混亂，充滿著為粉絲服務的劇情。\n它運用了大部分過往的內容，彷彿有人按下重播鍵，回放先前的電影一般。」\n\
  \nWashington Post 的 Michael O’Sullivan：\n\n「這部電影節奏快速，事件層出不窮，雖然有不少讓人驚喜的地方，但也常讓人感到混亂\n\
  。『天行者傳奇』的最終章，的確忠實地呈現希望告訴觀眾們的事情。一方面來說，這是\n一件好事。但另一方面，或許這部電影不值得作為這系列的終點。」\n\n\nA.V.\
  \ Club 的 A.A. Dowd：\n\n「最終電影裡的每個人都像千年鷹上的全像棋 (Holochess) 一般、站在他們適當的位置\n。但引入這麼多新角色並將他們拉進舊的冒險意義何在？這部電影讓你開始懷念過去《星\n\
  際大戰》系列的電影，雖然它幾乎是過往電影的縮影，但你該保留一點對這部高成本賣座\n電影的同情。」\n\nUSA Today 的 Brian Truitt：\n\n\
  「在向所有事物致敬之前，這次《星際大戰》的結局的確是一場『過於安全』的著陸，儘\n管畫面壯觀但卻失去了成為史詩電影的機會。」\n\nIndieWire 的。Eric\
  \ Kohn：\n\n「電影所希望呈現的內容，已經超越電影的最終目標。大量讓影迷們興奮的情節以及懷舊\n的事物，讓電影變成了一個七拼八湊的混合體。」\n\n\n\
  \n整體來說，多數影評人認為《天行者的崛起》是毫無新意且過於倉促的故事，大部分劇情\n僅是為了糾正《最後的絕地武士》所犯下的錯誤，而非給粉絲一個真正的「傳奇」結尾。\n\
  由於先前《最後的絕地武士》引起了部分粉絲的強力撻伐，《天行者的崛起》選擇順從粉\n絲們的心聲，電影裡充滿著大量的懷舊元素，而劇情大量取材自《星際大戰六部曲：絕地\n\
  大反攻》(Star Wars Episode VI: Return of the Jedi) ，也讓影評人們認為誠意不足\n。\n\n不過，儘管電影有所缺陷，但對許多人來說，大量的「懷舊元素」以及「壯觀的對決場面\n\
  」都已經值回票價，也許 J.J. 亞伯拉罕 並沒有做到盡善盡美，但以「星戰鐵粉」的角\n度來看，這部電影的確勾起了許多美好回憶，並為各角色找到完美的落腳之處，創造不少\n\
  令人激昂的感動時刻。\n\n\nRolling Stone 的 Peter Travers：\n\n「J.J. 亞伯拉罕能夠提供粉絲想要的一切嗎？簡短回答：當然不可能。這對\
  \ J.J. 亞伯\n拉罕來說是一個很困難的工作。不過，雖然電影某些時候讓人感到混亂，但整體來說也是\n一場充滿愉悅、令人興奮的冒險旅程，許多時候讓人會心一笑，也不乏感動時刻。」\n\
  \nChicago Sun-Times 的 Richard Roeper：\n\n「《天行者的崛起》幾乎放棄了創造史詩級電影的機會，但這是一部實力堅強的幕後團隊\n\
  所共同打造送給星戰迷們的極致視聽覺饗宴。」\n\nCNN 的 Brian Lowry：\n\n「面對這一項挑戰，J.J. 亞伯拉罕清楚地知道這個任務的艱難。因此他選擇製作一部針\n\
  對『鐵粉』的《星際大戰》電影。《天行者的崛起》並不完美，但若從星戰迷的角度來看\n，這樣已經足夠。」\n\n\n\n==\n\n原來第八集那樣惡搞叫創新喔?敘事前後矛盾叫有新意喔？\n\
  \n我身為老粉覺得第九集好的部分是，\n\n他讓老三巨頭都有了好的歸宿，\n\n並且修正了上一集對人物性格錯誤描繪的悲劇。\n\n為粉絲服務又如何？這新三部曲把三巨頭拉出來，\n\
  \n不就是賣粉絲情懷用的？\n\n上一集把老角色給鞭得七零八落的，\n\n這集只是還給他們應該有的定位而已。\n\n難不成要讓嘉莉．費雪人生的最後一部戲，\n\n\
  是星8為反轉而反轉，嘲諷觀眾用的垃圾嗎?\n\n\n第8集毀了前面七集的努力，第9集能作到這樣算不錯了。\n\n\n\n\n--\n你那個對話根本就是斷章取義吧。\n\
  40"
