  沉默三秒(壞心)

  ???


  謝謝提醒^^




  知道結局再回去看好心酸喔...

  不~~~~他白回來我會覺得真是爛透了(對不起偏激發言)


  我也很感動QAQ 謝謝你!

  Excuse me? XD


  希望Howhow不會看到這篇，如果看到了我向您抱歉><

  其實我討厭凱羅不是因為長相(好沒說服力)

  但他的故事劇情讓我看得很憤怒@@

  安納金twitter(惡搞)


  我該怎麼封鎖我孫子?


  我犧牲自己，把高壓電帕普廷丟進死星垃圾桶，

  救了路克，不是為了讓我孫子對他key肖的!


  我，拜訪帕普廷的墳墓:有沒有辦法讓我用黑暗面的力量，

  換另一個對得起我太太的孫子?

  戲外比較好! 戲裡給我感覺就是個中二變態(怒)

