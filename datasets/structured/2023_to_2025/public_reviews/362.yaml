  想到7.8集就...還我大三角QAQ

  30年前的比基尼現在看還是很好看~

  不過雖然那套衣服有點太消費Carrie,但她穿著奴隸莊把奴隸主勒死,

  很有反抗的象徵!(個人感覺啦)


  這系列照片一直給我微妙的喜感,當然Carrie很美,

  但黑武士在旁邊好像「敢約我女兒出去掐死你」


