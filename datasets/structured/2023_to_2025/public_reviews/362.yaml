url: https://www.ptt.cc/bbs/movie/M.1665627172.A.7F1.html
title: 'Re: [新聞] 6年打造《孫行者傳》　首映會「眾神雲集'
content: '推 soma2016    : 輸中國情有可緣，目前3D技術亞洲中國最強，但孫行者  10/13 05:58

  → soma2016    : 傳3D至少比日本強拉                                10/13 05:59


  嗯…，


  我不同意你這段話，


  日本的3D動畫強是在強在跟2D結合，


  讓你不覺得像是看3D動畫，


  他們不會為了3D而3D，


  不論3D或2D都只是種技術，


  而技術是要為作品服務的，


  不是作品要來迎合技術。



  何況如果純論3D動畫，


  日本的遊戲公司在動畫上的技術還是世界數一數二的。


  不論是動作天尊卡普空還是手遊天尊SE社，






  而日本的動畫公司，不論是Trigger、幽浮社、WIT STUDIO


  作畫中都有大量的運用3D作背景跟特效，


  好跟2D作畫融合。


  他們強的地方是融合得很好，讓你不覺得是在看3D。


  何況這些還要趕得上時程緊湊的電視動畫時間。


  連新海誠的作畫，也是會用3D建模來模擬光影跟細節，


  來當作參考再作畫。


  人家只是點的技能樹方向不一樣。



  所以你說孫行者傳3D比日本強？？



  --'
