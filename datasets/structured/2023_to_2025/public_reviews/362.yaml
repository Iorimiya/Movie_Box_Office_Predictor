title: '[新聞] 《STAR WARS：天行者的崛起》原力撲台'
content: "《STAR WARS：天行者的崛起》原力撲台　「1晚橫掃千萬」首日票房冠軍\n\n\n記者羅凌筠／綜合報導\n\n星戰傳奇最終章《STAR WARS：天行者的崛起》18日在台上映，一天開出將近1350萬的票\n\
  房佳績，毫無懸念成為開片票房冠軍，眾多粉絲為了朝聖不畏氣溫忽冷忽熱，紛紛戴上配\n件、穿上最自豪的星戰服、用心打扮全裝出動，可見星戰延燒42年魅力不減。\n\n\
  「路克天行者」馬克漢米爾、「藍多卡瑞辛」比利迪威廉斯、9部星戰電影從未缺席的「\nC-3PO」安東尼丹尼爾斯全數回歸，就連逝世的凱莉費雪也再現大銀幕，導演J.J.亞柏拉\n\
  罕在凱莉費雪的家人幫助下，以當初拍攝《STAR WARS：原力覺醒》時沒有用上的片段，\n經過巧妙的後製安排，來完成莉亞公主的戲份。\n\nJ.J.亞柏拉罕感性表示：「我們深愛著凱莉費雪、想要替『天行者家族』系列畫下令人滿\n\
  意的句點，就絕對不能少了凱莉。我們不會重新選角，更不會用CG代替。」隨著電影上映\n，許多感到不捨的影迷表示，為了在大銀幕上見到「永遠的莉亞公主」，電影能夠多看幾\n\
  次就會多看幾次。\n\n黛西蕾德莉演了3集的女主角「芮」，她表示參與星際大戰的演出是一個改變她一生命運\n的事件，對這一切就要結束了感到非常的難過，但卻同時也感到無比榮幸，希望大家都能\n\
  夠見證並參與這歷史性的一刻；值得注意的是，導演J.J.亞伯拉罕透露，這次製作規模是\n過去星戰電影不曾有過的，也是特效公司光影魔幻工業 （ILM） 有史以來最為龐大的一\n\
  次。\n\n\ncr. \n\n--"
