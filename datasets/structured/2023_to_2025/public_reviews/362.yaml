title: '[負雷] 邊緣行者 好概念 爛劇本'
content: "▄\n \n\n\n\n\n\n\n\n\n\n\n▄▄\n--------------------------------------------------------------------------------\n\
  \n邊緣行者\n\n又是一個標準的 香港黑幫與警察的電影\n又是那種臥底來臥底去的 標準套路\n\n整體劇本的概念 我覺得還算不錯 就是正常的香港警察電影就是長那樣\n\
  派一個人去臥底 然後臥底又不只一人\n最後一定會有個大反派 大反派後一定會有一個大大反派 就是最後的BOSS大魔王\n\n可是實際上 真的太多BUG了 而且便當真的亂發一通\n\
  全部的男配角都死一輪了 反派不管參與幾次大會戰都還是死不了\n男主角也是 演到最後一個傷都沒有 然後身邊全部認識的人95%都領便當了\n\n再來就是 警察線 很多時候明明知道這樣做\
  \ 會有人要來殺他\n就是沒人穿 防彈背心 然後通通領便當 三小\n每個警察都覺得自己不會被開槍喔\n\n最後就是爛尾 根本沒交代清楚 就把線收了\n黑警到底有誰也沒說\
  \ 只說每個單位都有他們的人\n然後最大的大魔王 莫名其妙打個針 就死了\n\n這導演到底多愛發便當 好像10分鐘內 沒死一個人會不好看一樣\n這部就是一直吵架發便當死人\
  \ 然後換一個場景繼續大亂鬥發便當死人\n然後主角威能 就是不會受傷^.<\n---\n\n概念我覺得還行 就是一直亂發便當\n倒置這部電影變成大爛片...\n\
  \n--"
