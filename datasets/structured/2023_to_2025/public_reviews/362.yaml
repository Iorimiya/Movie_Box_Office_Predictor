title: '[新聞] 芮天行者將引領《星戰》新三部曲電影?'
content: '新聞網址：


  2023-11-25 13:15:22








  最近在宣傳與 班曼德森（Ben Mendelsohn）聯合主演的《沼澤王的女兒》（The Marsh

  King’s Daughter）電影時，黛西蕾德莉透露這部全新《星際大戰》電影和她想得不太一

  樣。今年年初，蕾德莉在日舞影展被許多記者問到回歸《星際大戰》宇宙一事，當時她矢

  口否認。然而她如今澄清，當時她是真的不知情：






  ：「我等不及拿到劇本了，因為老實說，我現在

  甚麼都不知道，這跟我預期的不太一樣，但我真的很興奮。」



  至於「芮天行者」是否將會再度引領一個全新的電影三部曲？蕾德莉坦言她不清楚：「我

  只知道一部電影的走向。這當然不代表就只拍一部，但我目前只知道這樣。我想這會是大

  家看到的下一部電影？我不知道，畢竟罷工才剛落幕，大家還需要時間回到正軌上。但目

  前為止，我只知道一部電影，我想大家也會很興奮的。」



  --'
