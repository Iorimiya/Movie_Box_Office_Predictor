url: https://www.ptt.cc/bbs/movie/M.1421115892.A.09B.html
title: '[新聞]《特種部隊3》有望請《第四行者》導演接任'
content: "新聞網址：\n新聞來源：好萊塢報導The Hollywood Report\n\n自從《特種部隊2》導演朱浩偉求去，他為了要執導《出神入化2》而不再執導《特種部隊\n\
  3》，新任導演目前正在洽談曾經執導過《獵殺第四行者》、《鷹眼》及《機動殺人》的\nD.J.克魯索，有極大機會他會接下。\n\n《特種部隊》當年上映時曾獲全球三億零兩百萬的驚人票房，第二集將巨石強森頂替查寧\n\
  坦圖為男主角之後，曾遇及3D特效製作不及而延後半年的困難，但票房反而更上一層樓，\n勇奪三億七千五百萬美金，第三集目前未有任何劇情動態，但日前傳聞會讓在第二集\n\
  開頭「消失」的查寧坦圖重新回歸演出。\n\n--\n歡迎來到我的新家\n白色豆腐蛋糕 \n也來我的粉絲團聊聊天\n白色豆腐蛋糕 \n\n--"
