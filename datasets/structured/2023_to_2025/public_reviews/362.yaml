url: https://www.ptt.cc/bbs/movie/M.1524891100.A.0DA.html
title: '[好雷] 來推一下老片《送行者：禮儀師的樂章》 '
content: '版上最近《復仇者聯盟3：無限之戰》的文章不斷，

  不想點進去被暴雷，想換換口味的朋友們歡迎~~~


  前幾天在Youtube看到了對岸網友的電影介紹與評論，

  看著看著看到了一部相當懷念的電影《送行者：禮儀師的樂章》。

  這是一部快10年的電影，當初也從這電影中獲得許多，

  所以也來寫寫我對這電影的感覺好了！








  ===防雷線再此，越線後任何風險請自行負責===


  (內文圖片都來自官方釋出的劇照，版權將歸回官方所有)







  這是一部很老的電影了，所以我想也不會有太多暴雷的問題！


  電影劇情描述男主-大悟所屬的管弦樂團突然解散而失業，在妻子-美香的陪伴下一同回到

  老家重新開始生活，住在男主爸過去所經營的咖啡館中。

  一天男主在報紙上看到了「旅途協助」的招募廣告，在認為這是旅行社的職缺後決定前

  往面試；殊不知這竟是一個「入殮師」的職缺，在面試過後男主雖然抱持著遲疑但依舊決

  定要做下去。

  男主就這樣開始了入殮師的一系列工作，雖然過程中也曾感覺工作內容不舒服、想過放棄

  ，朋友因此不願與他來往，甚至連妻子都在知道真相後選擇離開。但漸漸男主從老闆-佐

  佐木先生身上，看到了這工作的內涵，開始認同這份工作。

  最終男主工作時的嚴謹、認真，讓他的朋友與妻子改觀，認同並接納了「入殮師」這一份

  工作。



  場景上，透過周遭親友的表現來說明出了入殮師這份工作在社會上的不被諒解，以不同喪

  禮所面對的問題來展示在工作時的困擾。並以不同的風景來顯示男主的心境，風雪中的不

  安、夕陽港口的失落、田園小村的放鬆、草原堤畔的孤寂等等。

  配樂方面，透過大提琴悠揚而低沉的樂音，傳達了這份入殮師工作的嚴肅、莊重，以及男

  主對這份工作的認同、尊敬，還有在這份工作背後的責任。此外，親友背棄時男主的孤獨

  、寂寞，父親沉重、無言的愛都同樣地被完美的傳達出來。





  《送行者：禮儀師的樂章》與之前所推薦的《跟爺爺說再見》不同，他用嚴肅、沉重的方

  式描寫了社會對生與死的恐懼及悲傷。也確實地對觀眾們傳達了，送行儀式的目的在於「

  安撫人心」，安的是死者已逝去的靈魂、撫的是生者失去親友的心靈。

  《送行者》一部雖然有點年代，但依舊值得我們細心品嘗的電影！



  --

  來自冰封地層中~

  一根漂浮的純白羽毛!


  Blog:＊～冰羽天地～＊




  --'
