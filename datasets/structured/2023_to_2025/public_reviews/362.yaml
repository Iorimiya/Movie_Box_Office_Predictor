url: https://www.ptt.cc/bbs/movie/M.1578059048.A.808.html
title: 'Fw: [簡評] 天行者的崛起 十刷10個IMAX影廳'
content: '作者: hom746 (莫菲爾斯) 看板: Theater

  標題: [簡評]天行者的崛起 十刷10個IMAX影廳

  時間: Fri Jan  3 21:30:06 2020


  各位板友好，是的，還是我

  四年前那個八刷８個ＩＭＡＸ影廳原力覺醒



  以及兩年前九刷９個ＩＭＡＸ影廳最後的絕地武士



  這次依舊，挑戰十刷１０個ＩＭＡＸ影廳


  2019.12.18　新竹巨城威秀影城 (17.6*9.71，比例1.843:1)

  這一場看得是３Ｄ版，所以亮度較暗，其餘表現與先前的評價差異不大，依舊是

  爆棚感十足的影廳在此就不多述，可參考前兩次的文章


  2019.12.21　台北大直美麗華影城 (28.8*21.16，比例1.361:1)

  這場一樣是看３Ｄ版，但是鐳射３Ｄ相較威秀的亮度較為明亮由於影廳設計的關

  係，銀幕與座位有一段距離，而且高低落差有一層樓高，所以在重低音時較無法

  呈現爆棚感


  2019.12.21　台北日新威秀影城 (21*11.3，比例1.858:1)

  這廳在上一部的表現不佳，但是這次的表現出乎我意料之外的好，跟上次比起來

  ，可以說是判若兩廳，尤其是重低音的時候，真的會讓人起雞皮疙瘩，不過缺點

  依舊是影廳前後太長，後方的環繞喇叭音量明顯無法傳到前面


  2019.12.22　桃園台茂美麗新影城 (19*9.75，比例1.949:1)

  這廳的表現，是這十間影廳中，最讓我感到驚艷的，上次坐Ｇ排感覺離銀幕太遠

  ，所以這次選擇坐Ｆ排，然而神奇的事情就這樣發生了，從最一開始的廣告《越

  暗的地方你越亮》就可以感覺到立體聲，而在放預告片《神力女超人１９８４》

  時能感受到重低音的低頻轟炸，經過兩年的運作之後，喇叭總算是ＲＵＮ開了，

  或是有經過修正，這部分我就不清楚了，觀賞過日新威秀與這間之後，開始動搖

  巨城威秀在我心中最爆棚的地位了，不過可能只限於這一部而已，其它的電影沒

  有比較過，這點不敢下結論


  2019.12.25 花蓮新天堂樂園威秀影城 (21.5*12.04，比例1.786:1)

  ２０１８年底新開幕的ＩＭＡＸ影廳，標榜新一代鐳射４Ｋ放映系統，以及１２

  聲道，相較其他ＩＭＡＸ影廳，中間左右兩邊上方可以明顯看到各有一個環繞音

  響，可以清楚的分辨出前、中、後的感覺，不過很可惜的是，音響可能還要再運

  作一陣子，這次感覺還很糊，不夠清晰，至於４Ｋ放映部分，也很可惜，這部片

  大多有用３５ｍｍ膠卷拍攝，所以很多地方無法感受到４Ｋ，而預告片是《絕地

  戰警Ｆｏｒ　Ｌｉｆｅ》，這邊就能感受到４Ｋ清晰的感覺，最後，是影廳的設

  計，感覺得出來是在學習大直美麗華的配置，這次我坐中間Ｇ排，但是銀幕感覺

  較高，連我這種常看ＩＭＡＸ的人都覺得很有壓迫感，第一次來看的觀眾可能還

  是得從後面一點的座位開始適應


  2019.12.26　新北板橋大遠百威秀影城 (21.4*11.45，比例1.869:1)

  這一廳先前評價也是很好，重低音有，環繞效果也好，爆棚感也佳，甚至有一段

  是震到我頭皮發麻，真的要說缺點大概就只有沒４Ｋ放映了


  2019.12.30　台中大遠百威秀影城 (18.25*9，比例2.028:1)

  音響好，環繞好，重低音也有，影廳先天的缺點先前也有點出，這部片在這廳的

  表現也如預期的好，對我來說真的較無驚喜感


  2019.12.30　台中Tiger City威秀影城 (15.4*8.57，比例1.797:1)

  相較於先前感覺音響較為模糊，這次的感覺卻是相對清晰的，但也不是前幾名較

  佳的，這廳也是較無驚喜感


  2020.01.02　高雄大遠百威秀影城 (16*8.2，比例1.951:1)

  相較於其它廳都有維持水準或進步，這一廳卻是表現不佳，原本有清晰的感覺，

  這次卻變得模糊，聲音很悶，無穿透力，是這１０廳中讓我覺得退步的


  2020.01.02　台南南紡威秀影城 (22*12.2，比例1.803:1)

  這回刻意將之前我評價最好的廳留到最後，老實說有點不公平，主要是因為先前

  已被重低音轟炸過好幾回了，這廳的音響不是以重低音見長，但是音質依舊清晰

  ，環繞效果也佳，重低音表現也在前幾名，還好依舊維持一貫的水準


  總結這次的主觀排行

  ０１。台南南紡威秀影城

  ０２。新北板橋大遠百威秀影城

  ０３。台北大直美麗華影城

  ０４。桃園台茂美麗新影城

  ０５。台北日新威秀影城

  ０６。台中大遠百威秀影城

  ０７。新竹巨城威秀影城

  ０８。台中Tiger City威秀影城

  ０９。花蓮新天堂樂園威秀影城

  １０。高雄大遠百威秀影城


  當然，還要附上這次戰果



  感謝各位收看


  --'
