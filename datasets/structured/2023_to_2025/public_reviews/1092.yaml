title: '[雷] 其實沒有鬼的鬼聖胎（雷'
content: '看了這部


  前面氛圍感還不錯



  但後面超好笑XDDDDD


  然後一開始想逃跑但失敗的那個是伊莉莎白嗎...？



  以為是靈異宗教片但其實是科學驚悚片



  伊莉莎白：有點不是很懂這角色出來要幹嘛？莫名其妙就瘋了



  院長：最早被女主角拿下人頭的boss


  主教：一臉色鬼樣我還以為他是最大boss結果不是


  神父：紙房子的教授、但是說真的這麼帥的神父待在修道院適合嗎？如果有修女懷孕了他會

  立刻被當頭號嫌疑犯吧？

  本作鎖血外掛一號、那麼嚴重的燒燙傷還可以追女主角追超久


  服事：小Boss但中間莫名的就神隱了？






  關：本作唯一有腦袋的正常人/唯一正常有腦袋的人？正妹但是死了QQ


  婦產科醫生：我有點不知道他到底是好人還是壞人欸？他感覺不知道神父的機會？


  女主角：在驚悚片的世界裡面還算有腦的主角、車頭燈很難不讓人注意

  後期一個孕婦直接反殺三boss

  一手敲死院長阿嬤、另一手直接勒斃大主教

  用計放火燒了神父的實驗室、逃跑被抓到之後幹翻了神父

  然後她幹翻神父的時候不但接近臨盆而且肚子還被剖開


  堪稱本作最大鎖血外掛


  經歷了上面那一串倒楣事之後

  最後生了個不知道什麼的東西出來之後還有力氣搬石頭砸死她自己生的那個東西


  靠么喔妳根本鎖血技能點滿的神力女超人吧





  --'
