title: '[負雷] 鬼聖胎'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~
















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  不是鬼片，驚悚程度也很低


  就是女主被騙到義大利修道院


  那個修道院不知哪來的科技設備


  下藥迷昏了女主還讓她處女懷孕


  身為主角一定是天選之人


  當然是受孕最成功的一位


  據壞人所言孩子帶有耶穌的DNA


  可以研究出耶穌重生之謎


  但這不重要，重要的是女主怎麼逃脫


  因為這片其實是囚禁片，可惜我看完才意識到


  沒有反轉，看起來是伏筆的都不是伏筆


  收尾就是女主瘋狂暴走幹翻三位慘無人道的主謀


  只可惜死得還不夠慘


  最後逃到荒野生下一坨模糊的東東，賜死了它


  不要問那是什麼，因為模糊聚焦看不出來



  負雷原因:跟預期不符，以為會有什麼新把戲，是我想多了


  --

  有露點，但不是席妮，不建議為了露奶去看

  我不確定你問的是Simona Tabasco還是Benedetta Porcaroli，但都不多

  有激凸

  啊，那我記錯了'
