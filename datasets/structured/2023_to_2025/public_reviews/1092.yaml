url: https://www.ptt.cc/bbs/movie/M.1711255999.A.BFB.html
title: '[雷] 其實鬼聖胎是爽片ㄅ'
content: '今天去電影院看完新上映的恐怖片《鬼聖胎》


  故事講述一個來自美國的年輕女生，因為無家可歸只好到義大利的一間修道院當修女


  然後她居然神奇的處女懷胎，進一步發現這間修道院的黑暗面



  雖然有恐怖片的橋段，但是看完其實蠻爽ㄉ


  主要是女主反抗是有用的，所以絕望和無力感不重


  名字叫鬼聖胎，可是根本沒有鬼，最後女主也把迫害她的人一一殺死



  話說女主一個臨盆的孕婦還能三殺，其實你才是女超人吧XD


  電影結尾女主把生下的孩子砸死我覺得很不錯，不滿意的地方在孩子的聲音暗示他是怪物，

  可能是導演想避免女主的道德上有瑕疵？


  我覺得安排生一個普通的孩子，讓女主照樣砸死比較好


  修道院想人為創造一個聖母，這樣反而才證明他們找錯人了，女主是個跟聖母完全相反的狠

  人



  主角顏值跟身材都好，而且是反殺的爽快結尾，總體評價殺時間可以看看










  --'
