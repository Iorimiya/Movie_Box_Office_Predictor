url: https://www.ptt.cc/bbs/movie/M.1711202117.A.6E5.html
title: '[討論] 鬼聖胎……養眼驚悚片'
content: '今天來看看鬼聖胎.一開始都被音效嚇到

  然後很養眼.也很血腥

  只能算是小品.說推不推.也很尷尬

  但也算可以


  底下開始劇透

  剛開始就有一位修女想盡辦法要逃離修道院

  然後被抓到後.折斷她的腿.哇塞這真的太血腥了

  然後開始介紹女主角是一個掉到冰湖然後心臟停七分鐘被救回來.然後就想當修女

  然後一個神父引見進這個修道院

  一開始就是嚇死人的音效.增添氣氛

  然後怪了.沒性經驗的女主角懷孕了

  大家都稱為神蹟.然後開始有養眼畫面

  事情也越來越怪.開始有人想殺她

  然後殺她的人自殺

  修道院的人不準她去醫院

  女主還殺雞假裝流血.要大家載她去醫院

  沒想到被拆穿.然後就開始被虐待

  結果那個神父是主某.想用遺傳學去製造神蹟之子.但我還是很好奇.怎麼處女膜沒破

  然後懷孕.然後是什麼的DNA?

  後來女主準備要生了.就開始撕殺

  最後逃出來.然後生了……拿起旁邊的大石頭砸死那個小孩……..

  看到這邊.我覺得沒片可看的人也是可以看看啦～




  --



  好的～我快笑死～整個變搞笑片'
