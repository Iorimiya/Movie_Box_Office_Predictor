url: https://www.ptt.cc/bbs/movie/M.1711391008.A.CB1.html
title: '[新聞] 席妮史威妮《鬼聖胎》大開殺戒超血腥！'
content: "席妮史威妮《鬼聖胎》大開殺戒超血腥！自爆「兩個奶奶一直嚇到探頭」\n\n\n （Sydney Sweeney）暫時揮別《》鬧劇後，繼續在驚悚\n\
  電影《》（Immaculate）中交出了令人驚艷的演出。\n\n《》電影不僅全程將不寒而慄的驚悚氛圍拉到最高點，也在本片交出超具突\n破性又撕心裂肺的血腥演出，可說為其從影再添一部代表作。\n\
  \n而她近日宣傳透露，她的在電影中也尬上一角，但還是在觀影過程被嚇到喊出來\n。\n\n\n\n「我跟她們坐在一起，我對她們會有什麼反應感到很緊張。」\n\n\
  回憶：「有好幾次，她們都驚訝到探頭看著我說：『我的天啊！席德尼！』」\n\n這部電影講述她所飾演的年輕修女西西莉亞（Cecilia）加入了位於義大利的著名修道院\n\
  。\n\n不料，西西莉亞發現自己意外無性懷孕，並在了解到修道院及其所謂「」背後的恐怖\n真相後，必須想盡辦法逃脫。\n\n\n透露，她在電影的第三幕開始大開殺戒，這尤其讓她的祖母感到相當不適：\n\
  \n「毫無疑問，從第三幕開始，我就是瘋狂大開殺戒，這讓她感到很不舒服。」\n\n事實上，《》是席德尼與導演 （Michael Mohan）繼《諸事不炫！》（Ev\n\
  erything Sucks!）與《》（The Voyeurs）後三度合作，而她的祖母在這三次拍攝\n中都有客串。\n\n也說，這是一個有趣的小彩蛋：\n\n\
  「她們的夢想其實就是去義大利、去歐洲玩，她們從來沒有離開家鄉旅行過。」\n\n新聞網址：\n\n\n\n\n\n\n\n\n\n--"
