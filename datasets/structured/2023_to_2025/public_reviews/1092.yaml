url: https://www.ptt.cc/bbs/movie/M.1711466409.A.86E.html
title: '[普雷] 衝擊直接、設定單薄的《鬼聖胎》'
content: '其實無雷



  這是「驚悚劇情片」

  用鬼修女之流的方向去期待就錯了

  預告和劇照、展露出修道院懸疑詭異的調性

  但實際觀影體驗並不恐怖、算噁心虐殺元素吧？


  單刀直入的敘事力、跳嚇手法表淺張揚

  配樂怪異而有個性、無轉折與反轉懸念

  風格有點像30年前的驚悚片

  已非主流


  .

  與其用天魔、鬼孩、驅魔、恐怖修女的詞彙形容

  不如用針孔旅社、人皮客棧等驚悚殺人片比擬

  人物刻畫不立體且劇情易懂

  相信大家容易吸收且無門檻



  有一點點失望、但不難看

  不用期待太多什麼象徵或典故或環環相扣

  唯一恐怖的點是修女裝在晚上本來就恐怖

  老人本身在晚上冒出來也..恐怖（政治不正確）



  有幾幕噁爛到，畫面有點衝擊

  劇情人設較薄，後面轉為爽片

  （難怪前面的文都聚焦在車頭燈）


  整體就是

  塞了導演偏好元素的爆米花小品爽片




  __




  --

  大家都錯重點~~~~~請把視線往上移

  有兩幕有噁到，光看畫面不錯

  最後有段真的很難不注意亮點'
