url: https://www.ptt.cc/bbs/movie/M.1711700492.A.4E3.html
title: '[負雷] 鬼聖胎-偽驚悚片 '
content: "雷文防雷資訊頁\n\n\n恩_預告片看來是驚悚片\n進場後的確是驚悚片\n到後半變成了畸形倫理片\n以下多劇情雷，慎入。\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n劇情大綱:一個聚集了眾多修女的超大型養老院，有個企圖以遺傳學復活基督的神父，\n\
  \         與他的三個快樂小夥強迫一群修女人工受孕，最後被殺光(?)的怪作。\n\n嘈點:\n\n一、看伊沙貝拉的反應還有其一被烙印過的老修女來看，\n\
  \    要做人工受孕的起碼都有稍微洗腦過，或是觀察過一段時間，\n    願意配合的才下手，但女主卻很倒楣的一進去就被下藥後受孕。\n\n二、都是行動不便的孕婦了，你們把人家雙腳烙印是在哈囉?\n\
  \    萬一跌倒摔流產了你們不就當小丑s了，\n    雖然可以理解為要打擊或是阻斷她逃跑的機會。\n    但直接綁在輪椅上，每天派人輪班去服侍/監督他吃喝拉撒不是更好?\n\
  \n三、開頭那個想烙跑結果被折斷腳還丟入棺材活埋的人，到底跟後面劇情有啥關係?\n    本看到一半以為是多嘴的關，但後來越看越不對，關是被剪舌頭而已。\n \
  \   那開頭那段到底是要幹嘛用的?\n    純粹告訴觀眾:ㄟ~這是個恐怖的修道院?\n\n四、女人的忍痛力有多強，意志力有多悍?\n    看本片就知道了，一個羊水破的產婦，\n\
  \    可以先用燈檯/燭檯First Blood院長大人；\n    接著再用項鍊/念珠Doulbe Kill主教大人；\n    再來使用火烤/鐵釘Triple\
  \ Kill神父怪人；\n    最後無情擠出/石捶Quadra Kill謎樣嬰兒。\n    可惜少一個婦產醫生就完美的Penta Kill了說。\n\n結語:不要看本片，除了描述基督徒為了讓主再臨會有多少狂熱分子外。\n\
  \     實在不知道本片除了激凸外還有甚麼好看的了。\n\n--"
