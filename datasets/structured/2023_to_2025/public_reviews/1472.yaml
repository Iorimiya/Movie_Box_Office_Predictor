title: '[好雷]  無情荒地有琴天'
content: '1998年根據杜普蕾姐姐寫的傳記所改編


  摁......剛剛看完 好難過好憂鬱阿~~


  可是我覺得很好看！


  可能因為本人的生命就是那麼的戲劇化

  拍成電影一點也不失效果QAQ


  原本對她沒什麼了解  只知道拉琴的XDD


  一個光鮮亮麗的人 背後都有一些不為人知的事


  看到分享姐夫那邊 只覺得她完全是沒長大的小孩


  15歲開始奔走各大演奏會 其實心態會變成這樣也是有原因的


  但這個姐姐也太好了吧....好到很誇張阿-0-


  重點是.....選角也太厲害

  姐妹還有巴倫波因 真的跟本人照片有夠像的欸...


  個人覺得很可惜 聽說台灣上映期間沒有很久？

  大約一個禮拜~真的滿好看的


  這種電影敘事手法現在也很少見 分別兩條故事線

  再把頭跟尾接在一起 個人很喜歡~~


  最近補看了很多90年代的電影

  都很好看 完全不輸最近的片子

  到時候再整理成一篇好了~~


  --

  是啊傳記出來的

  蛤

  很難想像這種病 是感染還是哪種途徑得的阿

  完全兩部音樂神片！阿瑪迪斯我也很愛

  不知道欸 老師播的哈哈

  她還有播杜普蕾本人的記錄片

