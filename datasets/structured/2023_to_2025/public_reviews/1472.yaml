url: https://www.ptt.cc/bbs/movie/M.1128230895.A.08B.html
title: '[心得] 無情荒地有琴天'
content: '趁著颱風天,到百事達租了住片回家看

  杜普雷!

  聽說這部電影描述的是一部真實的故事

  電影的序書前半段主要分為2部份進行

  也就是分別敘述劇中2個姐妹主角(有點像是漫畫NANA剛開始那樣XD)

  在劇中姊姊希拉蕊是一個吹長笛的音樂家

  本可以在長笛的世界大放異采

  但他最後選擇了平常人的生活,與他的老公在鄉下過生活

  妹妹賈桂林則是一個大提琴超級天才

  也是這部戲描述的重點

  劇情主要是在敘述賈桂琳如何在國際樂壇上迅速成名,但卻傷害了她以及她所愛的人

  賈桂琳杜普蕾（艾蜜莉華特森飾）是二十世紀最偉大的音樂神童之一

  她以熱情不羈的音樂,令全世界的聽眾心眩神迷

  希拉蕊（瑞秋葛里菲斯飾）結婚成家

  賈桂林則長年與鋼琴家兼指揮家丈夫－丹尼爾巴倫波因做巡迴演出

  雖然這對夫妻所到之處皆備受禮遇

  但長期奔走各地,對賈姬的身心造成負荷

  她十分嚮往希拉蕊那種單純的生活

  其實在小時候妹妹就感覺有點精神異常

  以至於最後還搞上了她姊的老公

  演員在劇中表情詮釋的非常好

  心理在想什麼透露出的那種令人不安的眼神

  還有拉大提琴時的感情投入

  以及在最後得到了不治之症而不能拉琴的失落與頹廢

  都表現得入木三分

  一個音樂家在表演時

  觀眾是那麼的愛妳,那麼的擁護妳,也那麼的推崇妳

  但你除了大提琴以外什麼都不會

  而在當你不能拉琴的時候

  妳只會變的無所憑恃!!

  表演時的感覺,觀眾的掌聲,舞台的燈光...

  在她不能拉琴時還懷念著這些

  於是她的丈夫未他安排了一個小朋友的演奏會

  她只有打了一聲的鼓,就那麼一下

  她只是要再感覺一次從前

  打完那一下鼓,她卻也滿足的淚流滿面...

  劇中前半段有很一點點的小悶

  但看到後面時感觸真的很大

  也很真實的描寫了姐妹2人的感覺

  很推薦的一部片!!


  --

