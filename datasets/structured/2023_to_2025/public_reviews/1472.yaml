  \n《無名戰士》\niTunes NT$90\n>> \n\n《反恐行動：獨立日》名導阿庫盧米斯翻拍同名暢銷小說，問鼎芬蘭尤西\n獎十大殊榮！響應芬蘭建國百年，鎖定二戰家鄉派去預備應付蘇聯入侵的\n\
  機槍部隊，扛著一連串猛烈交戰的砲火，努力收回敵營佔據的領土，但士\n兵強壓隨時丟命的恐懼，反映踏入戰場的感慨。\n\n《守夜者》\niTunes NT$150\n\
  >> \n\n《萬惡世代》立陶宛銀鶴獎導演艾米利斯維萊維斯挑戰奇幻動作片！聯合\n《外星異種》俄羅斯金鷹獎提名編劇歐列格米契可夫寫本，任年輕快遞員\n拯救受強力圍攻的陌生人，意外得知對方是吸血鬼，也跟著帶去加入秘密\n\
  組織，展開夜晚抵抗威脅的魔界攻防戰。\n\n☆ 其他特價\n\n《生化禁區》\niTunes NT$90\n>> \n\n《你好，李煥英》\niTunes NT$150\n\
