title: '[心得] 無情荒地有琴天(有劇情)'
content: 'Hilary and Jackie是對姐妹


  西拉蕊是豎笛手


  賈姬是大提琴手


  小時候賈姬總是比不過希拉蕊


  到後來努力練習後


  反而超越她姊姊成為世界知名的大提琴手


  因而到處演出


  但卻因此而身心俱疲


  反而羨慕西拉蕊與其姐夫基佛的單純生活


  因為一次發現自己患病而不再能拉琴了


  便問她的鋼琴家兼指揮家丈夫丹尼爾


  如果我不再拉琴了你會愛我嗎


  "親愛的，人與才藝是分不開的"


  因而使賈姬絕望的一走了之


  她去找她親愛的姊姊


  希望能尋求慰藉


  她既羨慕又嫉妒姊姊單純的生活


  她要求能夠分享她的姊夫


  直到她發覺她不再受歡迎才離開


  丹尼爾而後一直很有耐心的照顧她


  人一生對愛情的追求是什麼?


  是希望到終老都能有個伴能互相扶持嗎?


  無論在最低落最無助的時候


  都能有人陪著你照顧妳


  儘管對愛情再不信任的人


  到老了也是需要有個伴相隨的吧


  我想我漸漸懂老爸的意思了


  而我似乎也漸漸可以預見未來寂寞空虛的我


  一次賈姬打電話給在巴黎的丈夫丹尼爾


  聽見嬰兒聲


  丹尼爾聽到賈姬無助的聲音


  說等等再打來


  賈姬掛掉電話後說了句混蛋


  即便再愛對方


  身處異鄉的丹尼爾


  也是抵擋不了在外的誘惑與寂寞而另有家庭了吧


  小時候希拉蕊總是贏賈姬


  賈姬最後成為知名大提琴家


  西拉蕊突破不了困境


  豎笛老是吹不好


  但賈姬獲得的是什麼


  是空虛


  是在異鄉因為語言無法溝通而必須把髒衣服寄回家洗的空虛


  是被取笑除了拉大提琴什麼也不能做的無助


  她對丹尼爾說難道你不嚮往我姊姊那樣單純的生活嗎


  我們根本就是被訓練出來的怪物


  病情日趨嚴重


  最後只能讓丈夫安排在一個樂團裡打一聲鼓


  贏得全場的掌聲


  賈姬似乎無法控制好她的情緒


  當她需要她姊姊的時候


  她強說著不需要她因為會有許多訪客


  還不時的將她姊姊與她分她老公的事情講出來羞辱她


  當她感到寂寞深深需要她姊姊的時候


  自私的不祝福她姊姊與基佛結婚


  她想要贏得她姊姊所有的祝福與支持


  卻又要搶奪她因為贏得名利所會失去的東西


  儘管她並未真正失去


  因為她有個愛她的老公丹尼爾


  她們之間有音樂的撞擊


  可是她一身就是被捧在手掌心上


  她姊姊愛她支持她


  她家人愛她支持她


  她丈夫愛她支持她


  所以她順著自己的感覺走


  當然賈姬也並未想要以自己的病來麻煩她人


  蔗也許就是為什麼它叫她老公放心的去巴黎交響樂團當指揮


  有空再回來倫敦看她就好


  也是為什麼她不要跟家人同住


  故作堅強的她最後卻不得不要求與她曾對不起的姊姊見面


  唯有她姊姊才能安撫她憔悴的心靈


  她知道希拉蕊是絕對愛她的


  連老公都可以分享了


  當她功成名就的時候


  西拉蕊也支持著她


  只有躺在她懷裡


  她才能漸漸平息她一顆快被病魔腐蝕光的心靈




  最近看到好多片都是塞翁失馬焉知非福的片


  有時呈現好的


  但結局不一定是好的


  有得必有失


  柘就是人生不停要面對的東西吧



  --

