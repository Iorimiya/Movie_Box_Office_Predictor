title: '[好雷]無情荒地有琴天 Hilary and Jackie'
content: "雷文防雷資訊頁\n\n無情荒地有琴天\nHilary and Jackie\n1998英國電影\n\n\n本片再現大提琴家賈桂琳杜普蕾演奏風采與傳奇事蹟，敘述賈桂琳杜普蕾如何在國際樂壇\n\
  上迅速成名，而她的名氣卻傷害了她以及她所愛的人……。\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~\n\n真人實事改編的電影，故事情節精彩感人，音樂動聽，主要演員表現出色，一些橋段很有\n\
  討論及閒聊的價值，哈哈哈。個人滿意度85分（滿分100）。\n\n以下有劇透。\n\n☺  ☺  ☺  ☺  ☺  ☺  ☺  ☺  ☺  ☺  ☺\n\n1.對兄弟姊妹關係的有趣研究:本片是一部可以在多個層面欣賞的電影。\
  \ 作為主角的姊妹\n二人Emily Watson和Rachel Griffiths的表演非常出色，扮演父母和姊妹丈夫的演員也很\n棒，扮演女孩的兩位年輕女演員也很棒。\
  \ 電影中的很多角色，都很有趣。 這部電影深入\n了解了一位音樂天才的一生，其中包括回報和勝利，以及衝突和犧牲。 這部電影的核心\n還有一個心理層面。 姊妹二人從一開始就有一種聯繫，幾乎是一種共生關係，但也存在\n\
  著激烈的競爭。 為了使呈現更加有趣，這種關係以兩個人角度呈現，第一個從Hilary的\n角度講述，第二個從Jackie的角度講述。 誰的更真實？ 有什麼不同嗎？\
  \ 多發性硬化症\n對Jackie造成傷害的最後一幕，非常扣人心弦。\n\n2.主角Emily Watson演技傑出。 她的個性極其複雜，她對Jackie所需的各種情感的駕馭\n\
  能力，非常出色。 古典音樂愛好者會欣賞豐富的配樂，和主角逼真的大提琴演奏。  199\n9 年，她憑藉這一表演獲得了奧斯卡最佳女演員提名，我認為她最有資格獲得該獎項，最\n\
  終Gwyneth Paltrow憑藉《莎翁情史》獲得了該獎項。 Paltrow的表演聰明而迷人，但Wat\nson在這部電影中所展現的力量，毫不遜色，只能夠說符合該屆眾多評審的喜好，就有得\n\
  獎運。 然而，Emily Watson是一位才華橫溢的女演員，令人佩服。\n\n對於那些欣賞強大而令人不安的戲劇、出色的表演、複雜的人物、美妙的古典音樂和非凡\n\
  的人物發展的觀眾來說，這部電影是必看的。\n\n3.本片講述了希拉蕊和賈桂琳杜普雷兩姊妹的故事，從她們早年作為形影不離的好姐妹和\n初出茅廬的音樂家，到她們作為職業獨奏家和家庭主婦的不同人生選擇。\n\
  \n就在Hilary決定結婚並在鄉村農場養家之際，Jackie的大提琴手生涯開始起飛。 音樂對\n於故事的發展是不可或缺的。 導演Anand Tucker用數位立體聲，突顯了音樂的豐富性以\n\
  及扣人心弦的音效。\n\n關鍵的戲劇性場景發生在影片的中心，Jackie離開她的丈夫Danny鋼琴家和指揮家，與Hil\nary和她的丈夫Kiffer Finzi住在一起。\
  \ 她向姐姐提出的令人驚訝的請求和請求的橋段，\n可以說，這不是一部適合兒童觀賞的電影。\n\n震撼人心的最終場景，將永遠留在人們的記憶中。 優美的音樂，應該鼓勵那些不熟悉Jac\n\
  kie Jacqueline Mary du Pr撽M她丈夫Daniel Barenboim職業生涯的人嘗試他們的唱片。\n 把這部精彩的電影列入你的必看清單。\n\
  \n\n\n4.天才和平凡的人生？何者比較容易？都有其難處：\n\nJackie天賦超群，有成熟的演奏技巧，可是離開了大提琴，離開燈光聚焦的舞台，她只是\n個心智尚未成熟的孩子。\n\
  \n她討厭飛來飛去的巡迴演出，她連自己的衣服都不懂得洗，把衣服寄回家給媽媽，收到幹\n淨衣服的包裹時，她原本疲乏的眼中頓時閃出光彩，彷彿口渴者見到水源一樣充滿喜悅和\n\
  滿足。她把衣服鋪在床上，躺在上面用衣服把自己包圍起來，深深吸著衣服堆中淡淡的家\n的香味。她是一個多戀家的小孩啊！\n\n她從演奏會中逃走了，去了她姐姐Hilary和姐夫Kiffer的農莊。晚上他們一邊喝酒一邊聊\n\
  天，她半開玩笑地跟Hilary說，I want to sleep with Kiffer. 她姐姐呆住了，她又說\n，You don’t mind，do you，\
  \ sis? We always did say that we’d share everything\n. Hilary又怎可能答應呢？Jackie不見得是愛Kiffer的，她就像小孩一樣，把姐夫當作一\n\
  只共同分享的大玩偶嗎？既然姐姐可以擁有，那她為啥不可以呢，她也要和Hilary分享這\n份樂趣。\n\n第二天Hilary發現Jackie失蹤了，不顧一切地衝進森林中去尋找。她還是很愛她妹妹的，\n\
  即使Jackie對她提出這樣無理的要求。當她看見Jackie的衣服一件又一件被棄在草地上時\n，她眼中流露出無比的惶恐和慌張，終於在一處灌木叢中，找到了渾身赤裸的Jackie。Ja\n\
  ckie環抱著雙腿在寒冷中劇烈地顫抖，她朝Hilary扔石頭，拒絕Hilary的靠近。她撕聲力\n竭地說，You don’t love me. Don’t fucking\
  \ love me.說完她就用松樹枝割自己的手\n腕。Jackie已經開始瘋了，Hilary用大衣裹起神志不清的她，痛心地把她抱在懷里。\n\n姐姐終於妥協了，她去說服Kiffer，Kiffer覺得不可理喻，然而Hilary說了句無法反駁的\n\
  話，She just wants to prove, prove that somebody loves her.\n\n導演接著安排了兩處極有對比的場面，第一次是夜中Kiffer和Jackie在做愛，Hilary卻獨\n\
  自一人躺在大床上翻來覆去睡不著，她內心一定很難受。最後她悄悄走去女兒的房間，擠\n在小床上把熟睡的女兒緊緊擁抱在懷里。讓出了丈夫，她唯一擁有的就是女兒了。\n\n\
  第二次是Kiffer發現了Hilary的傷心，他半夜偷偷溜回房間和Hilary親熱。Jackie發現了\n，深夜在客廳中拉起了大提琴，是Concerto for\
  \ Cello and Orchestra in E Minor，聲\n音淒切悲愴，彷佛受盡委屈。Hilary說，I’ve given you everything。然而那男人最終\n\
  不是屬於她的，她就像得不到喜歡的玩具，在父母面前撒耍賴的孩子一樣，用大提琴宣泄\n她的不忿。Jacqueline Du Pre所演奏的音樂中，充滿了許多複雜的訊息，痛苦、悲哀、\n\
  無奈，像她那麼年輕的女子，不應該在演奏當中帶有這麽多情感的？大提琴下哀怨低訴的\n，竟是絕望？\n\n最終她在清晨背上大提琴離開了農莊，一臉的毅然和決絕。她又回到了她極不情願的演奏\n\
  生活里面。像煙火一樣瞬間燦爛的演出落幕之後，留給她的，只有琴聲中永恒的寂寞。\n\n5.Jackie已到盛年的她，癱瘓了十幾年，臨死的時候在床上不住地抽搐，她丈夫無法穩住\n\
  她。而在千里之外，自小和她有心靈感應的Hilary，在風雨交加中趕過來。姐姐最終抱住\n她，她把手腳抽搐的Jackie抱在懷中，說起她們的童年，說起了那句在片中不斷重現的話\n\
  ，Everything’s going to be all right。似懂非懂的Jackie終於在姐姐的懷中平靜下\n來。\n\nJackie像是一股強大的不可抗拒的潮水，從她靈光乍現的第一天起，全家人便被這股潮水\n\
  捲攜著前行，越來越力不從心。Jackie是跌落凡間的一位精靈，她不理會人間的法則，她\n按自己的想法行事，她由著自己的性子生活，這是她的純真和直接，她用毫不掩飾的純真\n\
  和直接演奏出征服世界的音樂，也用毫不掩飾的純真和直接，傷害了身邊最愛她的人。\n\nJackie似乎從來不曾珍惜別人對她的愛，肆意妄為，性格乖張。她那不堪入目的生活，是\n\
  她內心寂寞的極致表現。音樂和名譽帶來了痛苦，失落，迷茫，她還太年輕，無法承載這\n麽沈重的情感。她只能在大提琴中把她積壓在心里的愛恨情愁演奏出來。\n\n寂寞確實跟孤單不一樣，孤單只表示身邊沒有別人。但寂寞是一種，你無法將感覺跟別人\n\
  溝通或分享的心理狀態。Jackie並不孤獨，她有愛她的父母姐姐和丈夫，但她有無法排遣\n的寂寞，這種寂寞是致命的毒藥，如同鬼魅一般，伴隨著她走完那如煙火一般絢爛的短暫\n\
  人生。\n\n\n--"
