url: https://www.ptt.cc/bbs/movie/M.1727235415.A.15A.html
title: 'Fw: [情報] 超/人:克里斯多夫李維傳奇故事 台灣上映'
content: '作者: dragon803 (AZKiちゃん大好き) 看板: C_Chat

  標題: [情報] 超/人:克里斯多夫李維傳奇故事 台灣上映

  時間: Wed Sep 25 11:34:39 2024


  這個是講永遠的超人 克里斯多夫李維傳奇的紀錄片


  本來在美國是只有特別場的，但昨天台灣華納宣布會引進了，11/1上映


  今天也公開了預告






  這部會記錄他的演藝生涯，成為超人的過程，癱瘓後如何發揮自己的影響力


  講述大家心目中永遠的超人的故事


  我覺得預告最感動的是最後他對英雄的定義


  "什麼是英雄?我以前的答案是勇於採取行動的人，但我現在的定義不同了，我想英雄

  是個普通人，能夠在面對巨大的困難，找到堅持和忍耐的力量。"


  雖然說每個人各自心目中喜歡的超人不同，例如我個人還是相當愛亨超


  但克里斯多夫李維真的戲裡戲外都是公認的超人


  到時候一定會進場觀看的，希望能對這位傳奇人物有更深的了解


  --'
