title: '[好雷] 花便當的記憶vs跨越時空的初吻'
content: '兩部都看了 都不錯

  結論 花便當勝


  如果你是演員粉絲

  就去支持各自的作品


  以電影面來說

  花便當擺明是來弄哭觀眾的 10分鐘一小哭 30分鐘一大哭 意圖拙劣但至少不掩飾

  導演功力夠 有效

  鈴木亮平演技真的強


  跨越時空初吻

  好像坂元裕二想要證明自己能寫出不一樣的穿越題材 但根本沒什麼新意 而且越到後面老油


  不難看

  但包袱感重到不行

  -----

  Sent from JPTT on my iPhone


