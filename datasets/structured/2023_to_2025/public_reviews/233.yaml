title: '[好雷] 跨越時空的初吻-如果愛能回到起點'
content: '原文＞＞＞






  電影《怪物》《花束般的戀愛》、日劇《四重奏》《大豆田永久子與三個前夫》，這些我

  很喜歡的作品，都來自於編劇坂元裕二之手，從此之後只要他有新作我都會列入必看清單

  中，甚至連他的短篇小說也不放過。


  《跨越時空的初吻》坂元和老搭檔松隆子再次合作，並加入SixTONES成員松村北斗，這次

  一樣用他獨到的生活觀察、觸及內心深處的精闢台詞，並將老掉牙的穿越題材重新翻玩，

  對婚姻關係做出不同於以往的解讀。


  婚姻一直都是我特別關注的題材，尤其日本電影在這方面的發揮更是獨有見解，因為除了

  同為亞洲文化、在婚姻的習性上會比較貼近之外，還會有前衛的「尺度」突破，劇情會在

  既有的發展上做了更有趣的規則變化。


  而跨越時空的題材讓坂元慣用的「前後反差」手法變得更加鮮明，但他沒有要玩燒腦的時

  間軸，也沒有要多解釋平行宇宙的遊戲規則，只是單純的敘說在這段殘忍的對比之下，還

  是有導向溫暖結局的可能。


  (以下微雷)






  《跨越時空的初吻》的故事設定是「那一天，我愛上了15年前的丈夫」，神奈在見到15年

  前的丈夫後，回到家對著他的遺照語帶詢問地說「我這樣應該不算外遇吧？」，可見雖然

  丈夫已經離開一段時間，兩人也已經簽訂離婚協議書，但在心理上的認定，神奈並沒有覺

  得自己已經是單身，所以才有是在外遇的念頭，這應該算是一種婚姻關係的有趣變體吧。



  那穿越電影的重點來了：如果再來一次，一切會不一樣嗎？


  15年前兩人相遇時陷入愛河的熱情，15年後生活在同一空間卻形同陌路的冷淡，從那頭初

  遇的夏天，到這頭離異的冬天，用氣溫呼應了心境上的不同。穿越結束後回到家，神奈做

  的第一件事是坐在丈夫遺照前跟他分享，到後來付諸行動想要靠改變過去來拯救丈夫，都

  可以證明死去的只是婚姻，但他們之間的愛還活著。


  兩人在過去重逢，神奈用盡方法改變未來，但他能改變的僅有一些與愛無關的行為，像是

  按下警急按鈕或改變購買行為，這些的確會為未來產生不一樣的結果。只不過不管再重來

  幾次，或是神奈刻意的不要讓丈夫愛上他，甚至想牽紅線給別人，丈夫會愛上他的結果最

  終還是不會改變。


  「戀愛是一個發現優點的過程，婚姻則是接受缺點的過程。」


  這段穿越所帶來最大的不同，在於丈夫得知神奈是來自於15年後的未來，而這個未來是兩

  人不再相愛，讓他意識到之後自己會慢慢做出與期望不同的行為，並造成令人後悔的結果

  ，所以他決意開始改變。


  他雖然還是離開喜歡的古生物研究領域、還是沒愛上教授的女兒、還是鼓起勇氣求了婚、

  還是為了拯救生命而犧牲自己，但這次不同的是，在結婚後開始不斷提醒自己不要因為一

  些瑣事的放大檢視，而忽略對於神奈的愛。最後在看得到終點的情形下，他把握住每個可

  以相愛的時刻，讓這段感情沒有留下遺憾。


  我對於愛情總是浪漫看待，和《跨越時空的初吻》一樣都抱著強烈的命定論，意思並不是

  要追求偶像劇式的「天時地利」，而是在看到對方毫無隱藏的展現自己時，反而更加喜歡

  的「人和」。在這種情形下只要能在茫茫人海中遇見彼此，那再怎麼刻意都無法將兩人分

  開。


  但我對於婚姻的期待總是悲觀看待，每次看到從感情步入婚姻後會出現的質變，是如同命

  運般的必然，就難免悲觀。雖然坂元這次和《花束般的戀愛》一樣，殘忍的把前後對比放

  在一起，但卻給出很樂觀的結論：


  只要別忘記自己心中還有對他的愛，好好把握每個當下的相處，做出愛與包容的決定，一

  切就會很好。


  --'
