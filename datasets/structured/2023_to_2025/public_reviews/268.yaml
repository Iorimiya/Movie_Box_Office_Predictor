title: '[無雷] 名偵探柯南 獨眼的殘像'
content: "這幾年從紺青之拳每集都有去看\n\n這集算這幾年我排倒數第二，去年那部是倒數第一\n\n這集真的是鼻屎大的動機汪洋般的殺意\n\n這集說是毛利的高光場面，但我覺得毛利整集都在瞎忙，讓我白期待一場\n\
  \n話說最後的說教\n\n美和子可能沒啥資格說吧，她老爸和她曖昧男死亡的案件她也是滿激動的，不過沒犯罪就是\n了\n\n這集場面還是不夠大，不過比去年好多了，我現在看柯南電影就想看動作戲和大爆炸\n\
  \n不過還是比紺青，黑鐵，萬聖節的場面小多了，這幾集我真的覺得好看\n\n這集跟去年的我就覺得偏無聊，尤其是這集的鳥動機...\n\n不過這集倒是滿幽默的 很多吐槽我和電影院觀眾都覺得有趣\n\
  --\n\n\n\n\n                                      06/30 21:55\n後來想想動機還好，不過威脅日本政府那段還是覺得很扯，然後殺警察不知道要幹嘛，這麼\n\
  大動作不會直接殺那兩位仇人嗎"
