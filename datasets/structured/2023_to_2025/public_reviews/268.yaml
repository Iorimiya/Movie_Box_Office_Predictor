url: https://www.ptt.cc/bbs/movie/M.1751112790.A.F2D.html
title: '[好雷]名偵探柯南 獨眼的殘像'
content: "防雷區放個海報紀念\n\n\n\n\n\n\n\n\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n作為算是大伏筆大和獨眼的由來\n\
  期望中應該是精彩的大案件\n實際上也不能說不大，但就是與想像中有落差\n\n鱷魚，作為毛利多年好友以為會有多一點戲份\n結果出場沒多久就掛了，整部都跟多數作品的「死去的爺爺」一樣在毛利的記憶刷存在\n\
  後面發現死的原因覺得更可憐，純粹推進劇情工具人\n而且後面大和恢復記憶把全部都跟柯南說了，直接從解答反推，幾乎不用推理\n兇手知不知道鱷魚是誰這個情報根本沒啥重要\n\
  \n推理，如前面提到\n這次改善了為人詬病的最大缺點「推理」，直接拿掉就沒缺點了\n主線幾乎沒有推理的成分，等時間到NPC大和敢助自動把兇手情報跟柯南說\n\n\
  算是有推理的部分反而是柯南推測出竊聽器是出自公安之手那邊\n\n接續前面說的\n這次多數笑點之一就是柯南挾情報以令公安\n利用公安自己裝的竊聽器隔空對話，甚至予取予求\n\
  完全是苦命工具人，尤其是風見，辛苦了笑點擔當之一\n\n\n再來就是柯南不管是中途下車尿尿、到獵人小屋過夜......等等\n硬要強行到某地點留下的話劇社演技，雖然不知道是不是預設笑點\n\
  但是「硬要」的也蠻好笑的，看很多人也都有笑\n\n\n其他小地方也有設計不少不錯的笑點\n\n\n\n另外柯南劇場版最重要的動作場面這次處理的算是還行\n\n\
  開場不久無視車流的滑板跟摩托車追逐戰\n武力天花板之一的小蘭與拿槍的兇手對戰\n賽車加上神槍手小五郎三槍命中同一個點\n還有其他小會戰\n\n\n後面得知殺手動機也可以理解\n\
  導致的國家危機出動公安也可以接受\n但好像就覺得少了些什麼有點草率\n\n綜合以上來說包含一些發糖等等的小橋段\n看片過程中有被娛樂到\n還可以算是好雷啦\n\n\
  最後零AKA安室透處理公安同事的兇手那段\n總覺得知道太多內部情報的柯南\n哪天被公安逮到機會也會被處理\n\n\n片尾後的下一部預告\n看起來就是安室透又會出場的一集\n\
  --\n題外話\n\n小小抱怨一下\n同場同一排隔兩三個位置遇到一個很大隻胖胖的男生\n影片開始就一直低語、碎念、亂叫、大聲喧嘩\n然後一直亂動又起立坐下(因為很大隻周遭椅子都會震動)\n\
  吵一下之後坐他旁邊疑似監護人(?)的就把他帶走，本來想說離場了\n過30秒又走回位置上，重複第一段行為\n\n就這樣整場重複好幾次，每次還都從大銀幕底下走過去\n\
  散場後他的位置周圍椅子地上到處散落爆米花\n嚴重懷疑是身心障礙跟ADHD之類的\n\n遇到這種不知道該怎麼辦，好像也不能怎麼樣就只能忍\n真的有點嚴重妨礙觀影體驗\n\
  也不是想歧視\n但這種能不能在家看NetFlix、迪士尼+這種就好\n感覺他來電影院也無心看片\n\n--\n\n--\n\n\n              \
  \                         06/29 06:01"
