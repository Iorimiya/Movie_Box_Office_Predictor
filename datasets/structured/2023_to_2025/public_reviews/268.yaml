title: '[好無雷] ULTRA4DX 名偵探柯南 獨眼的殘像'
content: '今天日本上映這個版本的


  開放訂票過一個小時就剩下最晚場的還有一個位置

  我運氣好訂到了= =

  原本打算在台灣再看的，但是實在太好奇screen X+4DX是什麼感覺，所以還是偷跑了



  日本這廳的銀幕很大

  有試著放馴龍高手的screen X

  效果很好

  就算坐邊邊也能享受電影的樂趣

  (這個QRCODE不知道台灣到時候會不會有)


  整體而言這場可以不用看4DX沒關係

  動作戲只有四分之一不到吧(甚至更低


  但整體而言能看到毛利小五郎耍帥就很值得了

  眾人的出場機率都很平均

  對，小鬼頭們也是


  犯人最後補的一個理由有點硬扯

  硬要和犯罪動機扯上關係

  這點我有點難認同


  回台灣應該還會再看一次

  因為孔明引用的詞句很多聽不懂

  只能聽小蘭解說


  --



  能沉浸並將自己代入在作品之中，那才是好的作品


  --'
