content: '劇情有些不合理能夠吐槽的地方我就不說了

  畢竟是電影，太過鑽牛角尖是不好的


  只說好的部分


  第一是有回顧到劇場版第十四號獵物毛利小五郎的槍法

  在這部電影是有給尊重的


  再來是推理的部分不算多

  戰鬥場面不少


  遺憾的部分是，插入曲BGM沒有最經典伊織-キミがいれば

  沒有這首歌，好可惜


  可能歷年來的劇場版都沒有這首歌

  這也是我第一部進電影院看的柯南劇場版


  單純覺得，沒有這首歌，可惜呀可惜


  --'
