url: https://www.ptt.cc/bbs/movie/M.1751268972.A.4A0.html
title: '[雷] 名偵探柯南 獨眼的殘像'
content: '柯南劇場粉絲年度例行工事又來辣

  預告和雷文全部都沒看

  完全0資訊進場

  以下

  防雷警告


























  _____________________________

  剛剛看完分享一下

  如果是想看柯南飛天遁地、

  各種牛頓棺材板壓不住的騷操作類型粉絲可以先Pass電影院了

  等串流上就好


  我個人是認為完全沒有進電影院看的價值


  要動作沒動作

  要劇情沒劇情

  要推理沒推理

  要爆炸沒爆炸

  要風景沒風景


  要愛情，好像有一點點愛情

  但是我本人剛好對阿敢的感情線是0好奇

  然後阿敢在車裡說女生嫁人了是什麼東西

  我沒追到啊，後續也沒在說了

  所以是有夫之婦在搞外遇？


  總之

  人生第一次在影院看柯南看到要睡著


  開場的追逐本來以為正片到了

  結果就只是小打小鬧一下

  殊不知

  下次要再看到飆風滑板已經是結尾了


  我到了結尾都還是搞不懂兇手到底在幹嘛

  他根本從頭到尾都在追殺那些不知道他做了什麼的人啊


  殺人動機比森谷帝二還莫名其妙


  要逃走然後開著軌道車

  主角一行人還搞了半天就為了弄翻車

  不是啊，他是軌道車你們明白嗎？


  孔明跳下去很帥，但是把手機丟上去更莫名其妙

  全世界都看到你掉下去了

  你還丟什麼求助通知啊

  就只是想點出因為這個操作所以犯人是警察

  看過生硬的，沒看過這麼硬要的

  而且從頭到尾也沒人針對這點做出任何推理


  這部給我的感覺就是想走推理劇但是故事說成一坨泥

  從頭到尾我也沒看到什麼推理環節


  最後等阿敢自己想起來後就自然會破案

  柯南跟了整集唯一的用處就是第一個聽了阿敢的話，然後就破案了


  總而言之這部是我看過最難看的一集

  之前被噴歪的第11位前鋒和唐紅的戀歌我都是看的津津有味


  但是這部我真的不行

  除了失望還是失望

  除了難看還是難看


  連柯南多年引以為傲的風景電影都慘兮兮

  所以這部主打的是天文台？


  --'
