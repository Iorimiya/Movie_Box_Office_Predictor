title: '[新聞] 唯一華語片！《女兒的女兒》前進多倫多影'
content: '唯一華語片！《女兒的女兒》前進多倫多影展  張艾嘉嗨喊「好光榮」



  由並將於多倫多全球首映，該片也是唯一華語競賽片，堪稱台

  灣之光。飾演電影女主角的張艾嘉得知消息後驚喜表示：「能入圍競賽我覺得太光榮了，

  很期待再訪多倫多影展這個老朋友！」


  《女兒的女兒》是導演黃熙自《強尼･凱克》後睽違六年的電影作品，自今年在坎城影展

  曝光之後備受各界影迷期待。電影講述由張艾嘉飾演的金艾霞，原本應該要開始享受孩子

  成家獨立後的悠閒下半生，卻因為一場意外打亂了生活節奏，不得不重新爬梳身為母親也

  同時身為女兒的複雜情結，並迎接自己從未想像過的新的挑戰。


  除了金獎影后張艾嘉參與演出之外，，讓電影更添細膩與感動。


  《女兒的女兒》從劇本發想到完成，費時超過五年，從一開始就點頭答應演出並身兼監製

  的張艾嘉回憶：「當時接到侯孝賢導演的電話，表示黃熙有個不錯的劇本想邀請我合作，

  我就一路陪伴這個作品到現在。」


  張艾嘉形容《女兒的女兒》不只是一個美麗又動人的故事，更是一位女演員非常期待的角

  色，因為人生最糾結的情感莫過於家人間的親情，這次飾演的女主角金艾霞就是夾在瘋狂

  母親與叛逆女兒之間，，這五年的拍片過程相當不容易。卻也讓

  張艾嘉感到非常過癮。


  當得知《女兒的女兒》入圍了多倫多影展站台競賽，一路陪著電影從0到1的張艾嘉也開心

  表示恭喜：「這次台灣電影能代表華語片進到競賽單元，我覺得對我來說真的是非常光榮

  的一件事！真的是太美好了！」



  張艾嘉在1992年就被多倫多影展選為「焦點影人」，成為東方女演員第一人，2015年也曾

  帶著導演作品《念念》在多倫多首映，所以對她來說多倫多影展就像是一個熟悉的老朋友

  ，她感性地說：「這麼久沒見，終於能再帶著喜愛的作品回到多倫多影展，我覺得非常高

  興！」





  --'
