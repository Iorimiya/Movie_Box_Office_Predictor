url: https://www.ptt.cc/bbs/movie/M.1727271079.A.495.html
title: '[新聞] 《女兒的女兒》再傳捷報！暌違20年台片入'
content: '《女兒的女兒》再傳捷報！暌違20年台片入圍東京影展主競賽



  19:38 2024/09/25 中時 孫伊萱



  林嘉欣，感性形容此次《女兒的女兒》跟張艾嘉同台演出就像兩面鏡子。

  （東昊影業提供）


  東京國際影展今（25日）公布入圍名單，15部主競賽片中，包括侯孝賢、張艾嘉監製的台

  片《女兒的女兒》，以及全片在台灣嘉義取景拍攝、日本名導片山慎三執導的台日合製片

  《雨中的慾情》。此外，台日美合製、李康生主演的《黑之牛》也獲選亞洲未來單元。


  《女兒的女兒》甫於多倫多影展世界首映，監製暨女主角張艾嘉的精彩演出，也讓影展破

  例頒發特別提及榮譽獎。今再下一城，也是暌違20年有台灣電影入圍東京影展主競賽單元

  。片中飾演女兒的林嘉欣表示：「恭喜團隊，能入圍東京影展好榮幸！」戲外也是母親的

  林嘉欣更感性分享：「我跟張姐在片中是母女，我們倆戲裡戲外都是母親同時也是女兒，

  這就像兩面鏡子一樣，她是我，我是她，但又是我自己。」更表示《女兒的女兒》的故事

  讓她體認「命運沒有偶然。」



  劉奕兒在《女兒的女兒》剃短髮演出，期待國際影展看到自己的突破。（東昊影業提供）


  曾經2度參加東京影展的劉奕兒，此次將首度踏上主競賽單元紅毯，她表示非常開心，很

  期待帶著新作再訪東京，「我為了《女兒的女兒》片中的角色做了很大的嘗試，除了造型

  上的突破，內心也做了很大的轉變，很開心這些努力都有被國際影展看見。」難掩興奮地

  說：「東京影展是我參與過最多次的國際影展，但這次能跟片中的媽媽張艾嘉同遊東京一

  定可以再創難忘回憶，更期待可以跟著電影繼續陪媽媽環遊世界！」《女兒的女兒》將於

  11月22日在台上映。


  《雨中的慾情》是執導過《海角上的兄妹》、《尋人啟弒》鬼才導演片山慎三所帶來的奇

  幻悲戀大尺度新作，故事描述日本昭和時代無名的漫畫家義男、想當小說家的男子伊守，

  和魅惑的寡婦福子在某個小鎮相遇，寂寞讓三人的慾望與野心交織，彼此關係不斷拉扯並

  逐漸產生離奇變化。卡司集結日本演技派型男成田凌、森田剛、中村映里子、竹中直人，

  台灣女星李杏也演出身份特別的神祕女子。



  《雨中的慾情》前導海報。（光年映畫提供）


  李杏表示，2019年《海角上的兄妹》在台灣上映，「當時有幸與來台交流的片山導演與演

  員們對談交流，沒想到再次見面即是合作電影，而且合作對象竟然是森田剛，還有竹中直

  人老師，這些夢幻人物光是見上一面就已經足夠讓我呼吸困難，現在竟然還要一起走上國

  際影展的紅毯，慢慢一步一步往我心中的目標前進。」她也將在10月28日出席影展開幕紅

  毯，以及參加10月30日東京影展世界首映，認為能跟著這部精彩作品一起去東京影展「是

  今年發生在我身上最好的事」。


  《黑之牛》由日本新銳導演蔦哲一朗編導，金馬影帝李康生演出明治時代在山中生活的男

  子，透過與一頭牛的共同生活經歷，嘗試與大自然重新連結的故事，他用超越語言的方式

  ，以身體、心靈與女主角「日本和牛」FUKUYO進行對話、建立關係。目前人在國外拍戲的

  李康生表示一定會參加11月初的東京影展《黑之牛》世界首映的映後座談會，「很高興這

  次東京電影節能邀請《黑之牛》參加亞洲未來單元，期待能夠在11月去東京與觀眾朋友見

  面，跟大家聊聊看完電影的觀影經驗，希望大家好好享受！」電影將於11月8日在台上映

  。



  李康生在首度擔綱日片男主角中，在《黑之牛》中以身心靈與女主角「日本和牛」

  進行對話。（光年映畫提供）



  新聞網址：



  --'
