title: '[選片] 小雁與吳愛麗or女兒的女兒'
content: '這兩部都是最近感到有興趣的國片，而且都上映一段時間，所以場次都變得很少

  但還是想趁下檔前去看一下


  楊貴媚在小雁與吳愛麗得最佳女配，夏予喬跟曾國城的演技也很期待

  黑白的畫面方式呈現也很想用大螢幕看～


  女兒的女兒就是去看張艾嘉跟林嘉欣的，身邊有去看朋友很推薦

  看預告、劇情故事都很期待，還有入圍今年多倫多國際影展！


  以上兩部都希望可以去電影院，可惜只能選一部

  想麻煩兩部都有看的版友們推薦一下了，謝謝～


  --'
