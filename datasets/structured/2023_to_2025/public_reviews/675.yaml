url: https://www.ptt.cc/bbs/movie/M.1730250311.A.8C1.html
title: '[新聞] 「女兒的女兒」東京影院放映 導演黃熙談'
content: '「女兒的女兒」東京影院放映 導演黃熙談劇本靈感



  2024/10/30 07:41（10/30 07:56 更新）


  （中央社記者戴雅真東京29日專電）入圍第37屆東京國際影展主競賽單元的台灣電影「女

  兒的女兒」今天在東京丸之內TOEI影院放映，現場座無虛席，一票難求。演員張艾嘉帶著

  電影中的2個女兒林嘉欣、劉奕兒，與導演黃熙一同出席放映後的問答環節。


  「女兒的女兒」由侯孝賢及張艾嘉監製，被選為入圍主競賽單元的15部作品之一，這是國

  片暌違20年入圍東京影展主競賽單元。


  「女兒的女兒」在東京國際影展的電影票一開賣就搶購一空，今天有忠實的日本粉絲身穿

  張艾嘉領取金馬獎畫面的T恤，到場支持偶像。文化部駐日台灣文化中心主任曾鈐龍也特

  別到影展相關設施東京Midtown日比谷，代表文化部向張艾嘉致意。


  張艾嘉在「女兒的女兒」中飾演已值耳順之年的金艾霞，因一場意外顛覆原本悠然的生活

  節奏，被迫憶起年輕時想逃離的一切糾結，同時必須面對與女兒的關係挑戰。


  林嘉欣先前錯過「女兒的女兒」在多倫多的世界首映，這次入圍東京影展主競賽單元，3

  人特別排開時間，在東京母女團圓。張艾嘉今天在開場問候時也開玩笑說，「今天我帶著

  我的2個女兒來了，我對她們的愛是平等的。」


  導演黃熙談到本片起源時說，很巧的是也與自己的母親有關。當時黃熙在美國洛杉磯度假

  ，剛好母親詢問出國旅遊是否有保險，結合在當地看到朋友尋求人工生殖，兩相結合，因

  而誕生這部電影。


  第一次在影院觀賞這部電影的林嘉欣說，她其實和觀眾一樣緊張，不知道自己的表演會被

  如何處理，很高興有機會詮釋這個富有挑戰性的角色。


  劉奕兒則語帶哽咽說，這是她2次觀看，反而哭得比第一次更兇，但每當感到難過的時候

  ，「會偷偷看我身邊的姊姊和媽媽」，就感覺放心了一點，很感謝能出演這部充滿感動的

  作品。


  今年的主競賽單元共有來自110個國家和地區的2023部影片參賽，經過嚴格篩選，共有15

  部影片將在影展期間上映，並將在閉幕式上決定各個獎項的歸屬。


  2024東京國際電影展於28日至11月6日舉辦，預計11月6日閉幕式中發表主競賽最佳影片、

  最佳導演、最佳女演員、最佳男演員、評審特別獎及最佳藝術貢獻獎等獎項。（編輯：唐

  佩君）1131030



