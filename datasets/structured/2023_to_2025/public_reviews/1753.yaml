url: https://www.ptt.cc/bbs/movie/M.1675942866.A.741.html
title: '[新聞] 【白日青春】強勢問鼎香港金像獎4項大獎'
content: '新聞網址：



  香港電影年度盛事「第41屆香港電影金像奬」，今日（2/9）下午公佈入圍名單。被譽為

  「年度最好看香港電影」的《白日青春》，繼去年榮獲金馬獎三項大獎肯定成為最大贏家

  之後，更接連獲得香港電影評論學會大獎「年度推薦電影」之一；如今再下一城，入圍金

  像獎最佳編劇（劉國瑞）、最佳男主角（黃秋生）、最佳新演員（林諾）、新晉導演（劉

  國瑞）等四項大獎。這也是黃秋生繼《八仙飯店之人肉叉燒包》、《野獸刑警》、《葉問

  ：終極一戰》、《淪落人》之後，第五度問鼎金像獎影帝，如果獲獎將是第四度奪得影帝

  ，他在開心之餘也坦言：「有點壓力」。不僅如此，本片也是導演劉國瑞與童星林諾首度

  入圍，導演更放話期待台灣觀眾：「可以支持這個描述異鄉人的電影。」《白日青春》台

  灣將與香港同步，於3月31日在台動人獻映。





  以特殊難民題材細膩刻劃香港隱祕暗角的《白日青春》，故事描述在70年代偷渡到香港、

  與兒子關係疏離的計程車司機「陳白日」，意外協助涉入黑幫而展開偷渡逃亡的「莫青春

  」、本名「哈山」的巴基斯坦難民男孩。不同種族、沒有血緣關係的兩人，在這段公路逃

  亡的旅程中交織出宛如父子般的特別情誼。本片早在去年金馬獎就累積大量好評，今日（

  2/9）更成功問鼎香港電影金像獎四項大獎。獲得「最佳編劇」與「新晉導演」提名的導

  演劉國瑞，一聽聞消息便立刻表示：「我所擁有關於電影創作的知識和想法，都是香港這

  座城市帶給我的。可以得到香港電影金像獎的肯定，提名新晉導演及最佳編劇，對我來說

  是個莫大的榮幸。作為一個移民，我把自己在香港十幾年的感受都放進這個電影裡。」他

  更同時與台灣觀眾喊話：「希望《白日青春》上映時，香港和台灣的觀眾可以支持這個描

  述異鄉人的電影。」





  演員獎項部份，這也是新科金馬影帝黃秋生第五度入圍金像獎影帝，如果順利獲獎將是第

  四座影帝。他對入圍開心表示：「入圍金像獎的最佳男主角當然很高興，開心得像是辦喜

  宴一樣，但辦喜宴又要花很多錢，所以呢，就有點壓力。」一席話不改幽默本色。而在片

  中與黃秋生有諸多對手戲的南亞裔素人演員林諾，首度演出就獲得一生一次的「最佳新演

  員」提名，目前正身處巴基斯坦的他，接獲入圍後也興奮表示：「沒有想過我會再獲提名

  金像獎，很開心得到提名！」



  這部獲得香港電影金像獎「最佳男主角」等四項大獎提名的《白日青春》，繼接連獲得金

  馬獎、香港電影評論學會大獎肯定之後，近日更也確定入選「第18屆大阪亞洲電影節」競

  賽單元，而台灣更將與香港同步，於3月31日在台動人獻映。本片劇情描述巴基斯坦裔難

  民男孩「莫青春」（林諾飾演），本名「哈山」的他，一心想跟家人移民到加拿大，沒想

  到父親卻因為車禍意外死亡。而在70年代偷渡到香港、與兒子關係疏離的計程車司機「陳

  白日」（黃秋生飾演），意外協助涉入黑幫而展開偷渡逃亡的哈山。只是追捕哈山的警察

  ，竟是白日的兒子；而白日幫助哈山的理由，也非哈山所能承受之重…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
