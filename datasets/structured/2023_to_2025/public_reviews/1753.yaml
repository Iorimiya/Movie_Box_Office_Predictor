title: '[好雷] 白日青春'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  入圍第59屆金馬獎六項大獎，最後抱回最佳新導演、最佳原著劇本與最佳男主角，《白日

  青春》讓黃秋生奪影帝，其以香港難民為主軸的情節發展，也完美示範如何把一個簡單的

  故事說好。



  巴基斯坦裔難民男孩「莫青春」，本名「哈山」的他，一心想跟家人移民到加拿大，沒想

  到父親卻因為車禍意外死亡。只是追捕哈山的警察，竟是白日的兒子；而白日幫助哈山的

  理由，也非哈山所能承受之重…。



  電影的主題是救贖，就像伊朗電影《贖罪風暴》裡的法官，由於自己犯下的錯而產生內疚

  感，進而在遺族不明白事情真相的情況下幫助對方。《贖罪風暴》中，女主角最後發現恩

  人正是判丈夫死刑的法官，遂動用私刑殺害對方；《白日青春》裡，哈山知道真相後，不

  願接受白日的幫助，但最後又在爸爸的車禍現場重新接納白日。最後白日沒有與哈山一起

  偷渡，無非是對自己兒子的贖罪。正如兒子所說，白日當年棄兒子於不顧，如今居然連孫

  子也不要。白日為了送哈山去加拿大，連吃飯工具的計程車牌都賣掉，已經仁至義盡，最

  後以留在香港結束他這段救贖之旅。



  當大部分的對話與情節都在白日與哈山之間發生，林諾與黃秋生的演技就成為《白日青春

  》成功的關鍵。巴基斯坦裔的香港移民林諾是素人演員，飾演集不甘、叛逆、徬徨、憤怒

  與無助於一身的哈山，情緒收放自如非常自然，與影帝黃秋生對起戲來也絲毫不膽怯遜色

  。雖說最後入圍新演員沒能獲獎，卻已經讓人看見巴基斯坦或香港的明日之星。



  黃秋生的演技當然沒話說，不過，他的角色陳白日從一開始的不被諒解、跋扈驕傲與脾氣

  暴躁，到最後心疼哈山也心疼兒子，即便是沒有台詞的戲，他眼神中流落出的落寞也精準

  傳達這位中年計程車司機的辛酸。即使是情緒收斂的戲，黃秋生也能用表情說話，讓觀眾

  透過大銀幕感受這位父親有苦難言的無奈。



  雖然全片的氛圍多數時候處於低迷狀態，但其實《白日青春》訴說的是一個關於「希望」

  的故事。不論是白日，還是哈山的父親，成為難民或游泳到香港，都是為了能夠過上更好

  的生活。片名的組成，也是兩位主角的名字：「白日」與「青春」，兩者都代表著「希望

  」。當黑暗過去，旭日東昇，又是新的一天；年僅10歲的哈山，本該期待前方充滿光明的

  未來。沒想到困在香港底層的他們，都無法盼到自己當初以為的生活，就算無法保證到加

  拿大以後就能一切順利，但白日還是想為哈山買一張通往希望的船票。



  《白日青春》把非典型難民的生活困境搬上大銀幕，我們可能都以為難民就是原生國戰亂

  或受政治迫害而逃往他國的人民，卻忽略還有自己放棄原本生活的人。哈山的父親在巴基

  斯坦是律師，即便國內狀況再怎麼差，他們應當至少是中產階級以上，但來到香港十年，

  非但沒有成功前往加拿大，還不能工作賺錢，只能每月領取微薄的食物券過活，甚至遇到

  不公義的事也只能為了不留下案底而忍氣吞聲。陳白日本來對這些來自南亞的難民很是歧

  視，但在兒子提醒自己當初也是偷渡到香港來，哈山的父親又意外身亡後，態度180度大

  轉變，畢竟他們都是難民，何苦為難彼此呢？



  在這段短暫的逃亡期間，白日與哈山終究建立起羈絆，白日擔心哈山年紀小偷渡無法自理

  ，哈山也開始依賴白日，希望對方跟自己一起前往加拿大。《白日青春》演繹的是另類公

  路情，從計程車上出發，最後結束在那艘只有一人登上的渡船。在與哈山對話的過程中，

  白日試圖理解兒子的想法，並思考怎樣可以彌補過去的缺憾；哈山也在不得已的情況下，

  從「殺父仇人」身上獲得他失去的父愛。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
