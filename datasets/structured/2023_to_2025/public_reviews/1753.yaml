url: https://www.ptt.cc/bbs/movie/M.1679145961.A.1E2.html
title: '[新聞] 【白日青春】林諾奪香港電影導演會新演員'
content: '新聞網址：



  被譽為「年度最好看香港電影」的《白日青春》，雖然領銜主演的巴基斯坦裔素人男孩林

  諾，在去年金馬獎與「最佳新演員獎」擦身而過，不過他在昨晚（3/16）舉辦的「香港電

  影導演會年度頒獎典禮」上，便成功奪得「最佳新演員獎」肯定，成為他演員生涯的第一

  個獎項，別具意義。他在獲獎時感謝父母、導演、選角指導、表演導師、發行商等人，更

  在最後感謝真主阿拉，給他機會和能力去拍戲。導演劉國瑞在得知他獲獎後，更是榮幸並

  開心地表示：「希望他可以在金像獎再度獲獎，成為金像獎第一個獲獎的南亞裔演員！」

  《白日青春》台灣將與香港同步，於3月31日在台動人獻映。





  榮獲本屆金馬獎最佳男主角、最佳新導演，以及最佳原著劇本等三項大獎，成為金馬獎最

  大贏家的香港電影《白日青春》，全片將鏡頭對準特殊的難民議題，揭開香港的隱祕暗角

  。新科金馬獎影帝黃秋生，這回搭檔巴基斯坦裔素人男孩林諾，即使兩人在片中沒有血緣

  關係，卻呈現出一段另類的公路父子情。尤其林諾拍攝《白日青春》時只有十歲，卻與黃

  秋生演對手戲時毫不怯場，演技真情流露，也讓他在昨晚（3/16）榮獲香港電影導演會的

  「最佳新演員獎」肯定。



  林諾在獲獎時，真誠感謝他的父母，給他這個機會，並一直支持他，讓他去拍戲。他也感

  謝導演劉國瑞選擇他，給他機會去演這個角色，並同時感謝了選角指導、表演導師、發行

  商，甚至在最後特別感謝他人生最重要的「天父」：「謝謝阿拉，給我這個機會和能力去

  拍戲，感謝天父。我覺得拍戲這件事很開心，我也學到很多東西，謝謝。」導演劉國瑞在

  得知他獲獎後，也覺得十分榮幸，並表示：「我自己是從香港電影導演會的課程出身，因

  此對於導演會有很深的敬意和感情。由香港導演們投票選出林諾為最佳新演員，讓我特別

  榮幸和開心。」值得一提的是，林諾日前也獲得香港金像獎的「最佳新演員獎」提名，導

  演因此為他集氣：「希望他可以在金像獎再度獲獎，成為金像獎第一個獲獎的南亞裔演員

  ！」



  這部榮獲金馬獎三項大獎、香港電影導演會最佳新演員獎、香港電影評論學會年度推薦電

  影肯定，並強勢問鼎香港電影金像獎四項大獎的《白日青春》，台灣將與香港同步，於3

  月31日在台動人獻映。本片劇情描述巴基斯坦裔難民男孩「莫青春」（林諾飾演），本名

  「哈山」的他，一心想跟家人移民到加拿大，沒想到父親卻因為車禍意外死亡。而在70年

  代偷渡到香港、與兒子關係疏離的計程車司機「陳白日」（黃秋生飾演），意外協助涉入

  黑幫而展開偷渡逃亡的哈山。只是追捕哈山的警察，竟是白日的兒子；而白日幫助哈山的

  理由，也非哈山所能承受之重…。



