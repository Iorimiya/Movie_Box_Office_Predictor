title: '[新聞] 黃秋生【白日青春】首扮廢佬：仍保我特色'
content: '新聞網址：



  榮獲本屆金馬獎三項大獎成為最大贏家，並強勢問鼎香港電影金像獎四項大獎的《白日青

  春》，即將在本週五（3/31）於台灣動人獻映。本片日前在香港舉辦首映會，導演劉國瑞

  率領新科金馬影帝黃秋生、小演員林諾、飾演林諾片中父母的潘文星及喬加雲，以及同為

  金像獎影帝的太保等人共同亮相。黃秋生現場大讚林諾的演技了得，稱他是「香港電影的

  愛因斯坦」，更直言上次金馬獎拿影帝時帶他上台，這次金像獎如果林諾得獎：「希望可

  以帶我上台了！」更不改幽默本色對林諾打趣放話：「你不帶我上去，我就扭你耳朵。」

  讓對方允諾：「一定會帶他上台！」黃秋生也期望到時能出席金像奬，可以跟劉青雲這群

  老友相聚。此外，台灣片商今天也曝光本片的黃秋生幕後花絮（

  ），不僅可以看到他與演員們集體讀劇本的排練片段，更

  可以看到他在拍攝現場跟林諾等其他演員對戲時的有趣互動。我也表示扮演過老人家、父

  親等角色，但這次的「廢佬」角色真的沒有扮演過：「但無論如何，這個角色都會有我特

  色的幽默感，所以拍攝完畢後，要把自己清洗一番，找些白水晶沖沖身。」





  《白日青春》在去年金馬獎拿下最佳男主角、最佳原著劇本、最佳新導演三項大獎，更同

  時入圍最佳劇情片、最佳新演員、最佳攝影。而在下個月即將頒發的香港電影金像獎上，

  本片再度入圍「最佳編劇」，劉國瑞被提名「新晉導演」，黃秋生及林諾各被提名「最佳

  男主角」及「最佳新演員」。面對本片獲得眾多獎項的提名與肯定，導演劉國瑞謙虛表示

  ：「以往拍片慣用素人，這次嘗試新挑戰跟影帝秋生哥合作，雖然很緊張，但其實學到了

  很多！」對於被提名金像獎「新晉導演」及「最佳編劇」，他表示能夠入圍就很開心：「

  可以入到五強，已經當作拿到獎了。」當問及本片創作起源，劉國瑞透露每位導演在自己

  的第一部電影裡，都想處理自己生命裡很重要的事情，尤其他一個人在香港生活了十多年

  ，和香港的異鄉人有很多情感上的共通點，認識了很多難民家庭。提到自己的南亞裔朋友

  ，劉國瑞表示：「某種程度，我們面對很多一樣的困難，不過我們都很喜歡這個城市，所

  以在香港生活其實我們都很開心。」所以他決定將他們的故事和自己心情，寫進《白日青

  春》這個劇本當中。



  至於以《白日青春》入圍金像獎影帝的黃秋生，也表示希望能夠出席金像奬，期盼到時候

  可以跟劉青雲這群老友聚一聚。此外，對於今年香港電影票房屢創新高，黃秋生也對本片

  票房表示：「無法預知票房會多少，因為好多事情都是未知，當然越高票房越好啦！」當

  被問起去年金馬獎奪影帝時，他帶著小演員林諾上台時，黃秋生先是謙虛地大讚林諾：「

  我發現自己不懂得演戲，但他演戲很厲害，天才！香港電影的愛因斯坦！」更笑言：「他

  （林諾）上次在導演會拿最佳新演員的時候沒帶我上台，希望他下次拿（金像）獎可以帶

  我上台了！」更還打趣對林諾表示：「你不帶我上去，我就扭你耳朵」一席話也先預祝林

  諾可以順利拿獎。尤其林諾首度踏上首映會，卻絲毫不怯場，當被問到內心是否非常激動

  時，他害羞地點頭回應：「大家都覺得秋生哥好可怕，但他其實對我很好，像爸爸這麼溫

  柔，並教了我很多東西，我會答應他下次拿獎的時候，一定會帶他上台！」林諾同時也分

  享他第一次演戲，最難的地方就是「表情」。譬如一幕被爸爸扭耳朵的戲，自己就忍不住

  「笑場」，結果重拍了十多次。





  此外，台灣片商今天也曝光《白日青春》的黃秋生幕後花絮。不僅公開演員們集體讀劇本的排練片段，更有他在拍

  攝現場跟林諾等其他演員對戲時的有趣互動。只見黃秋生一開始就自白：「現在很難得有

  人找我拍電影，這麼勇敢，我一直問導演，你肯定這部戲可以開拍？有人開拍，我就演。

  」他更進一步表示：「我看這好像不是港產片，是國際片。」尤其他為了本片扮老又扮肥

  ，他自己也坦言：「飾演這個角色一段日子後，自己也覺得身體狀態變差，走路也不順。

  那個模式，那個能量，有時我自己坐在一旁也會想『我怎麼了？一臉愁容。』」他也同時

  表示自己扮演過老人家、父親等角色，但「廢佬」的形象真的沒有扮演過：「野蠻、無知

  ，或者是一種自私，神經反射，或是動物本能，但他不是個壞人，是一個有血有肉的人，

  特別是我們現在的社會，更多這種人存在。但無論如何，這個角色都會有我特色的幽默感

  ，所以拍攝完畢後，要把自己清洗一番，找些白水晶沖沖身。」



  這部榮獲金馬獎三項大獎、香港電影導演會最佳新演員獎、香港電影評論學會年度推薦電

  影肯定，並強勢問鼎香港電影金像獎四項大獎的《白日青春》，台灣將與香港同步，於本

  週五（3/31）在台動人獻映。本片劇情描述巴基斯坦裔難民男孩「莫青春」（林諾飾演）

  ，本名「哈山」的他，一心想跟家人移民到加拿大，沒想到父親卻因為車禍意外死亡。而

  在70年代偷渡到香港、與兒子關係疏離的計程車司機「陳白日」（黃秋生飾演），意外協

  助涉入黑幫而展開偷渡逃亡的哈山。只是追捕哈山的警察，竟是白日的兒子；而白日幫助

  哈山的理由，也非哈山所能承受之重…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
