title: '[新聞] 【白日青春】林諾奪香港金像獎最佳新演員'
content: '新聞網址：



  第41屆香港電影金像獎於昨晚（4/16）揭曉得獎名單。目前正在台灣上映當中的《白日青

  春》，由年僅10歲的林諾強勢奪得「最佳新演員獎」肯定；這也是他繼香港電影導演會、

  第一屆香港網絡影評人HIGHLIGHT大獎之後，第三度獲得相同獎項肯定，更是首位斬獲金

  像獎的南亞裔演員。值得一提的是，新科奧斯卡影后楊紫瓊，特別到港參與頒獎盛會，便

  在第一個揭曉的新演員獎時，將獎座頒給林諾。林諾上台除了感謝天父、父母、導演、與

  他對戲的黃秋生，以及教他演戲的戲劇導師之外，也不忘替本片催票：「大家可以進戲院

  看《白日青春》嗎？謝謝大家！」值得一提的是，去年黃秋生在金馬獎奪得影帝時，曾帶

  著林諾一起上台，也讓林諾曾在日前承諾，如果獲得金像獎肯定，也會帶著黃秋生一起上

  台。只見這回他如願獲獎，卻只是單獨上台領獎？！當被問及此事時，林諾笑稱在準備上

  台時，就已經跟坐在第一排的黃秋生招手示意了：「有跟他說了，但他說『不用不用！你

  自己上去啦！』所以我自己就上去了。」一席話也窺出黃秋生低調將光彩獨留給林諾的影

  帝風範。





  日前已獲金馬獎最佳男主角、最佳新導演、最佳原著劇本的《白日青春》，這回在香港電

  影金像獎再下一城，由年僅10歲的林諾獲得「最佳新演員獎」肯定。尤其新人獎是本次頒

  發的第一個獎項，便由新科奧斯卡影后楊紫瓊擔任頒獎嘉賓。楊紫瓊在台上感謝主辦單位

  給她這個機會，也說自己很適合頒發這個獎項，因為她第一次獲得電影提名，就是在1986

  年演出《皇家師姐》的時候，入圍了金像獎的「最佳新演員獎」。楊紫瓊鼓勵大家：「永

  遠不要放棄，相信自己的夢想，夢想可以實現」之後，便將「最佳新演員」頒給了林諾，

  獲得全場熱烈掌聲。



  尤其這是林諾繼香港電影導演會、第一屆香港網絡影評人HIGHLIGHT大獎之後，再獲「最佳新演員獎」肯定，他一上台便表達感謝：「首先是天父，衪給了我能力和天賦去演戲，

  感謝金像獎頒這個獎給我。也要感謝我的父母，他們一直支持我，鼓勵我說『你做得到的

  』。再要感謝導演和黃秋生，謝謝導演給我機會演這個角色，黃秋生和導演經常也會在現

  場教導我，謝謝他們。另外，我要感謝表演導師的指導。」表達「拍戲真的好開心」的他

  ，更在最後不忘替本片催票：「大家可以進戲院看《白日青春》嗎？謝謝大家！」會後，

  林諾也透露未來會更加努力，希望在不影響拜神跟學業的情況下，可以繼續拍戲。





  巴基斯坦裔的林諾，本名Sahal Zaman，約莫四、五歲時便跟隨父親到香港定居。會跟《

  白日青春》結緣的主因，是劇組在籌拍時，走遍了全港各地的小學、少數族裔中心、NGO

  、伊斯蘭教堂，遍尋會說廣東話跟烏爾都語的小朋友。導演劉國瑞透露林諾其實並非「哈

  山」這角色的首選：「我從近200位小朋友當中，試鏡挑選了12人，參與為期個多月的訓

  練。林諾第一次試鏡就給我深刻印象，但起初我想選用比較沉靜的演員，他卻很有個性，

  很少小朋友願意在陌生的成年人面前，展露自己的特性，但他完全不怕和其他人互動，很

  懂得跟大家交流，是哈山的三位備選人之一。」導演並回憶：「我們花費數個月去相處與

  訓練，即使第一次見面的時候，他完全不知道我們在做什麼，但他是第一個願意和我們交

  流的小朋友。」最後林諾參與多次試鏡並接受戲劇訓練後，終於擊敗多位對手獲得「哈山

  」一角。只見正式拍攝時，林諾毫無怯場，很快融入劇組，不輕易喊累也不會發脾氣，讓

  片場每個工作人員都很喜歡他。他在片中出色的演出，更讓導演力讚：「我們所有人都為

  他感到驕傲。」



  這部榮獲金馬獎三項大獎、香港電影導演會暨第一屆香港網絡影評人HIGHLIGHT大獎最佳

  新演員獎、香港電影評論學會年度推薦電影肯定，並強勢獲得香港電影金像獎四項大獎提

  名，最終獲得最佳新演員獎肯定的《白日青春》，目前正在台灣動人獻映當中。本片劇情

  描述巴基斯坦裔難民男孩「莫青春」（林諾飾演），本名「哈山」的他，一心想跟家人移

  民到加拿大，沒想到父親卻因為車禍意外死亡。而在70年代偷渡到香港、與兒子關係疏離

  的計程車司機「陳白日」（黃秋生飾演），意外協助涉入黑幫而展開偷渡逃亡的哈山。只

  是追捕哈山的警察，竟是白日的兒子；而白日幫助哈山的理由，也非哈山所能承受之重…

  。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
