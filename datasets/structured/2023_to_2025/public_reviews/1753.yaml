title: '[新聞] 周國賢【白日青春】與黃秋生上演疏離父子'
content: '新聞網址：



  榮獲本屆金馬獎三項大獎成為最大贏家，並強勢問鼎香港電影金像獎四項大獎的《白日青

  春》，即將在3月31日於台灣動人獻映。全片除了由新科金馬影帝黃秋生、甫獲香港電影

  導演會最佳新演員獎肯定的林諾精彩對戲，並勾勒香港難民議題之外，片中飾演黃秋生兒

  子「陳康」的周國賢，更貢獻不惶多讓的精彩演技，尤其一幕跟黃秋生在車內的對話場面

  ，更是將父子之間難以言喻的情感給徹底宣洩，逼哭許多觀眾。據悉，「陳康」是導演劉

  國瑞在最後一刻才決定的角色，更如同導演自身的投影，光是選角就花費許多時間，也因

  為周國賢本身所特有的倔強氣質，讓導演認定他就是角色的不二人選。此外，周國賢也對

  片中的父子關係感動不已，更坦言角色跟自己有所連結。而在詮釋角色的過程中，他也參

  考一位親戚的作為，讓他因此更得以入戲。





  現年43歲的周國賢，2004年以歌手身份出道，持續推出音樂作品之外，演藝經歷更涵蓋電

  影、戲劇、廣告、舞台劇、廣播劇演出，並身兼MV導演身份，可說是全方位的多才型藝人

  。他在2021年更以電影《一秒拳王》勇奪香港電影導演會「年度大獎最佳男主角獎」，並

  在2022年以電影主題曲〈時間的初衷〉奪得香港電影金像獎「最佳原創電影歌曲」肯定。

  這回他在電影《白日青春》當中，飾演70年代偷渡來港的陳白日（黃秋生飾演）的兒子「

  陳康」。職業為警察的他，與父親關係疏離，某次在追捕巴基斯坦裔難民男孩哈山（林諾

  飾演）的過程中，竟遭到父親的阻撓，讓兩人的父子關係更是雪上加霜。尤其看到父親對

  難民男孩的關愛更甚自己，讓他質問父親：「你為這個毫無關係的小孩付出這麼多，那你

  自己的兒子呢？」一段話便將父子之間難以言喻的情感給徹底宣洩，逼哭許多觀眾。



  周國賢透露自己在閱讀劇本當下，對片中的父子關係為之動容：「陳白日因為偷渡來港，

  無奈先把兒子留在家鄉，之後兒子也來到香港，不過父子關係變得疏離，當中的細節相當

  寫實。陳康想找回成長中所失去的一部分，我感覺這角色跟自身有一些連結。」尤其片中

  陳白日對難民男孩的關懷更甚親生兒子，讓周國賢在詮釋角色時，參考自己一位親戚的作

  為，得以更加投入角色：「這位親戚對家人不太關心，反而對身邊的朋友給予許多幫忙，

  他甚至還因此向我借錢，讓我對他的行為百思不得其解。片中我質問黃秋生的那場戲，也

  正是想到這位親戚才得以投入演出。」





  據悉，「陳康」是導演劉國瑞到最後才決定的角色，也是最能代表導演心聲的人物。在選

  角上，導演認為他應該要是中生代演員，思考許久才靈光乍現想到「周國賢」，和監製討

  論過後，認為周國賢身上的倔強氣質是不二人選，即使戲份不多，卻是最接近自身視角的

  人，才因此網羅他來演出。此外，這角色更像是導演自身的縮影，起因於導演離開馬來西

  亞到外地留學打拼，與父親相隔兩地且幾乎失去聯繫，讓他必須自己學著如何成為一個男

  人。因此他將自身對父子關係的體會，以及成長過程的經驗融入《白日青春》當中，刻劃

  一個渴望父愛的孩子，以及一個掙扎該如何理解兒子的父親的故事，並視本片為和父親的

  對話。尤其導演的父親在多年前中風，導致行動不便並無法言語，無法像片中這對父子有

  機會說出心底話，本片也反映他對人生的遺憾與渴望。導演對此表示：「我不希望我的作

  品是終點，反而希望是個起點，也希望大家看完之後，可以想到自己的人生，然後多一點

  跟自己的連結。」



  這部榮獲金馬獎三項大獎、香港電影導演會最佳新演員獎、香港電影評論學會年度推薦電

  影肯定，並強勢問鼎香港電影金像獎四項大獎的《白日青春》，台灣將與香港同步，於3

  月31日在台動人獻映。本片劇情描述巴基斯坦裔難民男孩「莫青春」（林諾飾演），本名

  「哈山」的他，一心想跟家人移民到加拿大，沒想到父親卻因為車禍意外死亡。而在70年

  代偷渡到香港、與兒子關係疏離的計程車司機「陳白日」（黃秋生飾演），意外協助涉入

  黑幫而展開偷渡逃亡的哈山。只是追捕哈山的警察，竟是白日的兒子；而白日幫助哈山的

  理由，也非哈山所能承受之重…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
