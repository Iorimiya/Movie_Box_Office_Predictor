url: https://www.ptt.cc/bbs/movie/M.1668612309.A.EDD.html
title: '[新聞] 【白日青春】為難民發聲，暗埋驚喜彩蛋！'
content: '新聞網址：



  強勢入圍本屆金馬獎最佳劇情片、最佳男主角（黃秋生）、最佳新導演（劉國瑞）、最佳

  新演員（林諾）、最佳原著劇本（劉國瑞）、最佳攝影（梁銘佳）等六項大獎的香港電影

  《白日青春》，即將在明年四月於台灣隆重獻映。本片昨日（11/15）於金馬影展進行亞

  洲首映，門票早已銷售一空，現場座無虛席。導演劉國瑞應邀抵台出席本場放映，與台灣

  觀眾分享電影創作的心路歷程。尤其本片是導演的首部劇情長片，一開場就回憶自己三年

  前，還是金馬電影學院的學員，如今已經帶著自己的首部劇情長片回來台北，心情很是感

  激。導演透過本片強勢問鼎「最佳新導演」與「最佳原著劇本」兩項大獎，談及有無信心

  得獎？他謙虛表示自己已經觀賞其他入圍作品，表示因為新導演的影片都各有特色，評選

  結果會以平常心面對。





  馬來西亞導演劉國瑞，雖然並非香港出生，但他從自身移民背景出發，將鏡頭對準滯港難

  民議題，拍出屬於香港少數族裔的故事。劇情不僅呈現犀利寫實的難民困境，更展露小人

  物從現實世故，直到良心發現的人性光輝。映後分享雖然只有短短十五分鐘，然而現場觀

  眾接二連三的熱情提問，甚至影廳外排起長長簽名人龍，合照時還欲罷不能地繼續追問香

  港難民現況，足見本片已經引發大眾省思的正面迴響。導演解釋這次執導長片，承襲先前

  拍攝香港少數族裔難民的短片經驗，並化用自身移民生活，嘗試結合兩代難民背景，等於

  納入香港人的歷史視角，拍出一部屬於「難民與香港人的公路電影」，更企圖翻轉「這是

  難民自己選擇」的刻板印象。導演也觀察到亞洲地區，對異文化的隔閡與排斥感更強，讓

  難民處境更加困難，值得大家給予關注。另一方面，現場也有許多觀眾詢問男主角黃秋生

  所飾演角色的結局意義，導演解釋自己執導電影，並非是要述說一個英雄故事，而是更想

  呈現一般人面對關鍵抉擇時「要當普通人還是英雄」的掙扎。



  論及首度編導劇情長片的最大挑戰，導演坦言寫劇本時沒有想太多，實際到執行時「夜戲

  、車戲、外景」的困難全部都遇到了；不過現場團隊都嘗試去解決，讓他很感謝團隊的幫

  忙。他更揭露本片兩位主角「陳白日」、「莫青春」命名的箇中原因，原來這兩個名字的

  靈感，源於袁枚的詩句，是先有詩才發展成片中角色，是他創作的巧思之一。至於是什麼

  詩，則埋梗在本片劇情當中，有待影迷親自發現這個彩蛋。





  對於首度執導劇情長片《白日青春》，就找來香港金像獎影帝黃秋生主演，導演透露黃秋

  生「是個藝術家」，非常清楚自己在做什麼，不需要自己特別多要求什麼。對於黃秋生與

  巴基斯坦裔素人男孩林諾的合作，導演則揭露他們「性格非常像」，指出拍戲時黃秋生一

  直和林諾溝通，讓現場的工作氣氛非常好，更感謝黃秋生留給他更多時間與林諾討論。值

  得一提的是，本片也是黃秋生繼1998年《野獸刑警》、1999年《千言萬語》之後，第三度

  角逐金馬獎影帝。提到入圍最佳新演員的林諾，導演透露自己在香港南亞裔社區海選四個

  月，第一眼看到林諾的印象就是「非常銳利、聰明的小孩」。他稱讚林諾學得很快，雖然

  角色的情緒非常壓抑，但很快就能融入角色，直呼找他演出非常幸運。



  金馬獎開獎前夕，《白日青春》劇組也將陸續熱鬧抵台，導演劉國瑞偕同主演的黃秋生、

  林諾、潘文星、喬加雲，以及攝影師梁銘佳，也將於18日金馬影展映後共同亮相，與台灣

  觀眾面對面交流拍片點滴。當天多族裔劇組將有什麼互動，也格外讓人期待。



  這部強勢問鼎金馬獎六項大獎，不但深入關懷在港少數族裔難民議題，更真誠刻畫「父子

  關係」難解習題的香港電影《白日青春》，即將在明年四月於台灣隆重獻映。本片劇情描

  述巴基斯坦裔難民男孩「莫青春」（林諾飾演），本名「哈山」的他，一心想跟家人移

  民到加拿大，沒想到父親卻因為車禍意外死亡。而在70年代偷渡到香港、與兒子關係 疏

  離的計程車司機「陳白日」（黃秋生飾演），意外協助涉入黑幫而展開偷渡逃亡的 哈山

  。只是追捕哈山的警察，竟是白日的兒子；而白日幫助哈山的理由，也非哈山所 能承受

  之重…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
