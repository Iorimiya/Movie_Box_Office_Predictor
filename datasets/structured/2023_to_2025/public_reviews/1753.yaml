url: https://www.ptt.cc/bbs/movie/M.1668932784.A.BA2.html
title: '[新聞] 【白日青春】奪金馬3大獎，黃秋生登帝座!'
content: '新聞網址：



  第59屆金馬獎在昨日（11/19）圓滿落幕，香港電影《白日青春》風光拿下最佳男主角（

  黃秋生）、最佳新導演、最佳原著劇本（劉國瑞）三項大獎。黃秋生在典禮的後媒體聯訪

  表示：「到現在都還像做夢一樣」；聽到媒體轉述評審「全數通過」一致投票給他，更幽

  默大呼：「是神蹟啊！」甚至感嘆得獎像是「又復活了」。他吐露最想分享喜訊給天上的

  媽媽，正值失聯的舅舅還突然捎來消息，讓他感應到冥冥之中媽媽可能已經知情，才會發

  生這種巧合。而在凌晨舉辦的慶功宴上，金馬執委會主席李屏賓更特地前來與劇組祝賀，

  劉國瑞也收到《花路阿朱媽》入圍最佳新導演的何書銘道喜，兩位新銳導演開心搭肩合照

  ，分享影人參與金馬盛會的喜悅。《白日青春》是馬來西亞導演劉國瑞首度自編自導的劇

  情長片，他從自身移民生活出發，將鏡頭對準在港少數族裔難民議題，揭開香港的隱祕暗

  角。對於未來的作品，劉國瑞透露接下來希望執導原創劇本的作品，也不排斥跟其他編劇

  合作。





  本屆金馬獎最佳男主角，由《白日青春》黃秋生奪得榮耀。縱橫影壇40年，黃秋生曾憑《

  想飛》、《無間道》、《頭文字D》三度獲得金馬獎最佳男配角肯定，本片則是他睽違23

  年三度入圍影帝之後，首度奪下「金馬影帝」封號，也成為金馬獎史上獲獎最多次演技項

  目的男演員。黃秋生驚喜地感謝金馬獎，自己等了這座獎好多年：「真的沒有想過得獎，

  也完全沒有準備。」黃秋生分享以前媽媽問他為何出國領獎，行李箱卻空空如也？他回答

  ：「我要去買書」，果真當次就輸了，媽媽神準預測：「你去買書，會輸。」這讓他本屆

  帶著滿滿的行李箱出席：「應該是有空位把獎座帶回去。」一席話獲得全場喝采，他並哽

  咽表示：「最想告訴媽媽，我終於得到了。」



  黃秋生發言不改幽默本性，透露在台下預測獎項得主的訣竅，就是看攝影機的移動方向，

  已經當場猜中很多次，卻沒猜中自己就是男主角得主。他也謝謝劉國瑞，對他來說新導演

  似乎帶有運氣，直呼：「以後都要找新導演合作」。令人動容的是，黃秋生摟著林諾上台

  領獎，並數度鼓勵他發言，黃秋生表示之所以帶著林諾上台：「因為他沒得最佳新演員，

  想帶孩子感受一下。」林諾在頒獎台上更是忍不住落淚，兩人的互動延伸到戲外仍是情同

  父子。片中黃秋生演活一介喝酒度日的頹廢父親「陳白日」，由粗魯市儈轉化成暖心大叔

  ，進而踏上贖罪之路的心境歷程，評審認為黃秋生演活暴躁的計程車司機，感人之處引人

  落淚，渾身是戲。





  摘得「最佳新導演」與「最佳原著劇本」的馬來西亞導演劉國瑞，創作類型涵蓋短片、紀

  錄片，《白日青春》是他的首部劇情長片，甫一入圍就獲得金馬獎兩項大獎肯定，也是本

  屆唯一獲得兩獎的影人。劉國瑞獲頒最佳原著劇本時，藏不住震驚表示：「真的沒唸錯嗎

  ？完全沒有準備。」並在台上數度語塞。劉國瑞坦承拍片起初，不認為自己會成為導演，

  為了準備最佳新導演的得獎感言，還特地參考2020年《南巫》馬來西亞導演張吉安獲得本

  獎時的發言，昨日也驚喜收到他的祝福簡訊。劉國瑞上台感謝主演本片的黃秋生、林諾與

  團隊：「沒有他們，就沒辦法完成這部獨特的電影。」除了感謝金馬獎評審的肯定，他也

  向電影公司、監製及劇本顧問致意，感激他們包容自己的任性並給予專業建議，最後對家

  人與未婚妻溫馨喊話，謝謝他們一路以來的支持。



  在16日新導演論壇上，劉國瑞坦露之所以關注巴基斯坦難民議題，是因為在家鄉的主要信

  仰是伊斯蘭教，因此較能同理穆斯林文化不被華人社會接受的艱難處境。劉國瑞挑戰結合

  兩代難民背景，納入香港人觀點，拍出一部屬於「難民與香港人的公路電影」。至於故事

  中在兩大主角之間穿針引線的情感，是亞洲文化共同難解的「父子習題」，劉國瑞對此表

  示：「本片是關於一個渴望父愛的孩子，以及一個掙扎該如何理解兒子的父親的故事。這

  兩個角色刻劃了我的移民生活，而我視這部作品為我及父親之間的對話。」



  這部強勢問鼎金馬獎六項大獎，最後並榮獲最佳男主角（黃秋生）、最佳新導演、最佳原

  著劇本（劉國瑞）三項大獎的香港電影《白日青春》，即將在明年四月於台灣隆重獻映。

