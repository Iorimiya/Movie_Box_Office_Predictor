title: '[人生無奈雷] 白日青春'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  之前看電影就有看過預告，但不是我這種爽片腦會想看的類型

  剛好有公關票和太太去看的，這片的時間實在頗爛，進場前還可以先看一片龍與地下城

  看完跟太太有一樣的感想「無奈」


  黃秋生演的計程車司機「陳白日」，

  為了過更好的生活，和老婆靠著一個指南針游泳偷渡到香港

  本打算生活穩定後才回去接被放在故鄉的兒子，誰知道兒子一等就是11年

  而這11年也讓兒子不認老爸，連要結婚了也是在婚禮前四天才發訊息給老爸

  雖說他也有捐了半個肝給借酒澆愁喝到肝硬化的老爸，但那個被拋棄的恨還是放不下

  在婚禮上只感謝拉拔他長大、家境富裕的岳父岳母


  本以為黃秋生在劇中的老婆是到年老才過世，

  想不到是在快看到香港時回頭發現老婆已經大海沖走，聽到這段敘述我真的直接嘆氣

  表示他這大半輩子都是孤單一人度過，變成脾氣古怪、易怒的阿伯


  在劇中唯二露出笑容的就是兒子拿老婆超音波照片給他看，說他要當阿公了

  再來就是他在帶哈山逃亡時講起往事，感嘆兒子嫌棄開計程車沒前途時，

  聽哈山說「如果你教我，我一定肯學的」後，教他怎麼開車

  而那個欣慰的微笑也只是動了動嘴角罷了，只有一秒


  其餘時間都是愁眉苦臉


  第二主角，中文名為「莫青春」的巴基斯坦小男孩「哈山」，

  爸爸阿里是從巴基斯坦流亡到香港的難民

  哈山一家雖窮，但在巴基斯坦當律師的爸爸仍不斷對哈山循循善誘，

  希望他不要和其他難民小孩一樣變成小偷


  從哈山出生，爸爸就跟他和妻子說已經申請引渡到加拿大，

  但等了10年，直到因為跟陳白日發生交通事故身亡都沒能如願

  也因為那一場車禍，讓哈山最終還是加入幫派當起偷腳踏車的竊犯，

  還因為撿了警察的槍而被追緝


  而陳白日與莫青春也是因為這起車禍而有了接點，

  前者為了贖罪而找上後者，想要勸他脫離幫派


  而在跟蹤莫青春到幫派據點時剛好遇到警察上門追緝，陳白日情急之下叫莫青春上車

  一老一少就這樣踏上逃亡的旅程，

  最終莫青春還是發現他爸爸就是被身旁這個對他好、

  不惜賣掉計程車牌照籌錢也要幫他偷渡的阿伯害死的


  最後兩人雖有和解，過程也沒什麼大哭大鬧狗血，就是幾句好言相勸便說服了莫青春

  雖說不知是吉是凶，莫青春依舊如願搭上前往他的夢想之地．加拿大的偷渡船

  但第二次喝到肝硬化、劇中暗示來日不多的陳白日就這樣站在港邊，看著船離去

  整部戲在此劃下句點，留下一個開放式的結局


  總之我自己覺得這部戲從頭到尾就是被人生戲弄的無奈，

  現在應該沒多少戲院上了，可以等串流，我認為非常值得一看


  話說一開始我還以為片名是叫白「目」青春，想說這電影名也太怪

  被太太糾正才知道是白「日」


  --'
