url: https://www.ptt.cc/bbs/movie/M.1667223152.A.9D6.html
title: '[新聞] 黃秋生【白日青春】再觸在港外籍人士題材'
content: '新聞網址：



  強勢問鼎本屆金馬獎最佳劇情片、最佳男主角（黃秋生）、最佳新導演（劉國瑞）、最佳

  新演員（林諾）、最佳原著劇本（劉國瑞）、最佳攝影（梁銘佳）等六項大獎的香港電影

  《白日青春》，預計將在明年4月於台灣隆重獻映。這是黃秋生繼1999年《千言萬語》之

  後，第三度角逐金馬影帝。面對其他幾位來勢洶洶的影帝競爭對手，他在受訪時謙虛表示

  ：「絕對沒有信心」，更坦言目前的心情很平靜：「沒有希望，就沒有失望。」不過他確

  定將來台灣參與金馬獎盛會，並透露已經準備好「很貴的衣服」來參加頒獎典禮，讓人期

  待他屆時的紅毯戰袍模樣。





  《白日青春》是新銳導演劉國瑞的首部劇情長片，將鏡頭對準特殊的在港難民議題，揭開

  香港的隱祕暗角。故事透過名叫「莫青春」、本名「哈山」的巴基斯坦裔難民男孩，一心

  想跟家人移民到加拿大，沒想到父親卻因為一場車禍死亡。而在70年代偷渡到香港、與兒

  子關係疏離的計程車司機「陳白日」，意外協助涉入黑幫而展開偷渡逃亡的哈山。只是追

  捕哈山的警察，竟是白日的兒子；而白日幫助哈山的理由，也非哈山所能承受之重…。特

  別的在港外籍人士題材，也讓外界回想起黃秋生之前主演的電影《淪落人》。對於再度接

  演這類題材作品，他坦言：「我覺得早就應該要拍這樣的故事了，因為他們也屬於香港的

  一部分，比如說印度人在香港已經100多年了，都沒有香港電影講過他們的故事。」





  對於跟入圍金馬獎最佳新演員的巴基斯坦裔素人男孩林諾對戲，黃秋生直呼跟對方就如朋

  友一般：「他很聰明，表現很自然。」並表示：「我們大人的表演是學技巧，但他們是不

  用學的。」而這次跟入圍最佳新導演與最佳原著劇本兩項大獎的劉國瑞合作，黃秋生也表

  示跟他合作挺順、挺好的：「他每天都在現場跟大家溝通，讓我知道他要怎麼拍、他為什

  麼要這樣拍、他需要什麼。其實他對角色，或是他要我表達什麼，我都會去問，他也讓我

  清楚了解。」雖然過去他常跟名導合作，讓他沒必要主動去問這麼多：「因為這些名導，

  他們都已經知道要怎麼拍，什麼畫面都已經知道了，新導演則必須多一點溝通。」不過他

  依然樂意跟新導演合作，至於自己是否想要當導演？他則苦笑：「一直以來都想，只是一

  直都沒有人找，沒有這個機會。」



  黃秋生這回在《白日青春》當中，不僅詮釋性格頑固且好強的計程車司機，更也是跟兒子

  有諸多誤解與距離的父親。他坦言這回要超齡演出年老狀態，跟融入整個環境，是詮釋角

  色最具挑戰之處，更直呼拍攝本片當下，真的有角色上身、意識到「老了」的情況：「有

  一場晚上跟林諾在海邊沙灘上的戲，以前年輕的時候，還可以不穿鞋踩在沙子上面，可是

  拍攝當天拍不到半小時，就覺得腳底板很痛，要穿鞋子了，當下就覺得自己年紀大了。」

  不過下戲後，他反而覺得自己並非真的老了，甚至笑稱：「我連確診都是睡兩天後就好了

  。」身體硬朗的發言，也讓影迷鬆了一口氣。



  這部寫實內斂、餘韻動人，不僅對在港難民有著細膩凝視，更真誠刻劃「父子關係」難解

  習題的香港電影《白日青春》，預計將在明年4月於台灣隆重獻映。



