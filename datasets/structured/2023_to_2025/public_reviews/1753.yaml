url: https://www.ptt.cc/bbs/movie/M.1669911046.A.818.html
title: '[新聞] 金馬獎最大贏家【白日青春】定檔明年3/31'
content: '新聞網址：



  強勢問鼎本屆金馬獎六項大獎，最終榮獲最佳男主角（黃秋生）、最佳新導演（劉國瑞）

  、最佳原著劇本（劉國瑞）三項大獎，成為本屆最大贏家的香港電影《白日青春》，台灣

  片商原訂明年4月上映，不過看好本片的獲獎聲勢，決定將本片提前到明年3月31日正式上

  映，讓觀眾得以趁春假連續假期，進戲院觀賞這部口碑佳片。以本片成為新科金馬影帝的

  黃秋生，這回超齡演出，讓他首度看片時驚呼：「真的有這麼老嗎？老到自己都不敢相信

  ！」更幽默透露：「只關注銀幕上的大肚腩。」而小童星林諾跟黃秋生對戲時，更表示不

  會緊張，反而童言童語：「應該是他要覺得緊張。」此外，導演劉國瑞堅持選用少數族裔

  演出，希望「用手上的資源讓大家被看見。」因此讓飾演林諾父母的潘文星與喬加雲，透

  過本片讓更多台灣觀眾知道兩人的精湛演出。





  《白日青春》故事描述在70年代偷渡到香港、與兒子關係疏離的計程車司機「陳白日」，

  意外協助涉入黑幫而展開偷渡逃亡的「莫青春」、本名「哈山」的巴基斯坦難民男孩。不

  同種族、沒有血緣關係的兩人，在這段公路逃亡的旅程中交織出宛如父子般的特別情誼。

  新科金馬影帝黃秋生，日前出席本片在金馬影展的放映時，表示自己看了電影很訝異：「

  我真的有這麼老嗎？老到自己都不敢相信！」笑稱別人看電影稱讚自己演技多好，但他自

  己只關注銀幕上的大肚腩，還不忘幽默透露：「但是工作便當也不是特別好吃…。」妙語

  如珠點燃全場歡笑。



  至於入圍金馬獎「最佳新演員」的童星林諾，雖然最後跟獎項擦身而過，但入圍也讓自己

  不造作的演技獲得肯定，尤其他淚灑金馬獎頒獎典禮的畫面，至今依然讓觀眾感動不已。

  談及初次演戲的挑戰，他透露對白、動作之類會有小小的困難。至於跟黃秋生一起拍戲會

  不會緊張？林諾反而幽默回答：「應該是他要覺得緊張。」開起玩笑的功力還真是不輸黃

  秋生。





  至於以《白日青春》榮獲金馬獎「最佳新導演」與「最佳原著劇本」的劉國瑞，日前也在

  金馬影展放映時，感謝監製鄭保瑞為自己保留自由的創作空間，他形容：「片中有不那麼

  傳統的東西，首次執導長片就有這種待遇，實在是非常奢侈。」他也感謝鄭保瑞在自己不

  擅長的動作戲領域，有莫大的專業建議與幫助。另一方面，他也透露以本片問鼎金馬獎最

  佳攝影的梁銘佳，去年就已經憑《濁水漂流》入圍金馬獎相同獎項，只是去年因故缺席頒

  獎典禮，原因就是正在拍攝本片，現在一起以自己的電影回歸金馬舞台：「今年可以補償

  他，讓我覺得非常開心。」劉國瑞更透露本片堅持選用少數族裔演出的理由：「我是在港

  比較幸運的外國人，既然有機會製作一部長片，希望用手上的資源讓大家被看見。」



  除了林諾之外，片中飾演「哈山」爸爸的潘文星，是土生土長的香港人，他感謝劉國瑞在

  兩人見面時，就將故事解釋得非常清楚，並說自己跟林諾就像好朋友一樣；而黃秋生對他

  而言「如偶像一般」，實際合作時非常愉快。至於飾演「哈山」媽媽的印度裔演員喬加雲

  則分享：「一開始聽說黃秋生有點兇，但本人很好，讓我放心不少。」潘文星與喬加雲在

  片中飾演從巴基斯坦來港的難民家庭，將漂泊者的無奈詮釋得絲絲入扣，令人揪心。



  這部強勢問鼎金馬獎六項大獎，最後並榮獲最佳男主角（黃秋生）、最佳新導演、最佳原

  著劇本（劉國瑞）三項大獎的香港電影《白日青春》，台灣定檔將在明年3月31日隆重獻

  映。本片劇情描述巴基斯坦裔難民男孩「莫青春」（林諾飾演），本名「哈山」的他，一

  心想跟家人移民到加拿大，沒想到父親卻因為車禍意外死亡。而在70年代偷渡到香港、與

  兒子關係 疏離的計程車司機「陳白日」（黃秋生飾演），意外協助涉入黑幫而展開偷渡

  逃亡的 哈山。只是追捕哈山的警察，竟是白日的兒子；而白日幫助哈山的理由，也非哈

  山所 能承受之重…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。




  --'
