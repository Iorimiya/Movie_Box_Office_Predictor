title: '[普雷] 《白日青春》白日不到處，青春恰自來'
content: '記得2、3年前在香港旅遊時，看過劉國瑞的

  「末路窮途」、「九號公路」，劇中的主軸便是

  移民家庭及身份認同，當白日青春確定在台灣

  上映後，便很期待劉國瑞的首部長篇作品。



  「難民」一詞，貫穿全劇，個人覺得劇情調性

  有點承接「九號公路」加上「末路窮途」的

  風格，香港象徵「難民中轉站」，卻是看似繁

  華卻無情的城市，這座繁華都市，讓青春一

  家和生活形同地獄、一無所有。



  一個因意外失去父親的小孩移民，遇上一個

  急欲彌補過錯，但本身也與自己小孩有錯綜

  複雜情感關係的計程車司機，在法、理、情

  上，哪一個方面能凌駕之上？對於白日是個

  非常難以選擇的抉擇。



  題材上算是相當特別，看完後，情感的餘韻也

  是相當充足，但對我而言不算好看，並非劇本

  架構或導演功力不好，只是我認為還是缺乏了

  一些我認為應該需要的「美感」，不過美感是很

  主觀的事情，我還是滿推薦進場觀看，如果你

  對難民議題有相當興趣的話；雖然是導演首部

  執導的長片，但我很期待後續相關題材的作品。


  演員演技的部分，我想是本片最大亮點，黃秋

  生內斂的演技，光靠臉部細膩的表情，就已完

  全證明，金馬獎影帝是絕對實至名歸，尤其跟

  林諾的搭檔戲份，更是完美的搭配，再加上雖

  然戲份不算多的太保、劉錫賢、周國賢的配角

  演出，讓這部電影的節奏更加的完整，當然飾

  演青春的父親，也是功不可沒。




  白日不到處，青春恰自來


  身處不同身分地位世代的兩人，如同這首詩詞

  ，不同的地方有著相同的陰影。


  --'
