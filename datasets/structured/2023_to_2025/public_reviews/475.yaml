title: '[新聞] <電影版孤獨的美食家>松重豐讚台灣如故鄉'
content: '新聞網址：



  粉絲千呼萬喚！日本「吃播始祖」松重豐，終於在今日（3/7）六度訪台，宣傳由他首度

  自編、自導、自演的最新力作《電影版孤獨的美食家》。只見「五郎」的「孤獨」魅力席

  捲台灣，即使劇組這次沒有對外公開班機資訊，機場依然有熱情粉絲自主守候接機，讓人

  見識到他的超高人氣。松重豐下午緊接著出席記者會，親切秀台語與國語問候：「大家好

  ，我是松重豐」還有經典台詞「肚子餓了」，博得媒體好評。片商更在記者會現場奉上台

  灣傳統美食「麵線」讓他品嚐，看他大啖麵線的模樣，簡直重現片中角色「五郎」，尤其

  麵線的美味更讓他大力讚嘆：「在日本完全吃不到這個口味！」不僅如此，已經多次造訪

  台灣的他，得知下飛機後馬上可以品嚐到道地擔仔麵，毅然決然放棄飛機餐，並表達對台

  灣的熱愛：「台灣是《孤獨的美食家》海外篇第一站，對台灣有很特別的情感，感覺像回

  到故鄉。擔仔麵根本就是為了《孤獨的美食家》創造的小吃，份量跟口感都很適合，覺得

  很感動。」值得一提的是，曾對外放話本片如果票房不好，就打算辭演本系列的他，面對

  本次電影版在日本票房告捷，他也當場宣布「有大家的支持，就絕對不會引退！」讓全場

  拍手叫好！《電影版孤獨的美食家》即將在3月14日於全台盛大上映。





  日本「吃播始祖」松重豐，終於在今日（3/7）六度訪台，宣傳由他自編、自導、自演的

  最新力作《電影版孤獨的美食家》。只見松重豐不論體力與活力都宛如年輕人，即使現年

  已經62歲，但面對台灣片商這次安排馬不停蹄的密集宣傳行程，他都來者不拒，甚至今日

  （3/7）特地起了個大早，搭乘早班機於中午時分飛抵松山機場。值得一提的是，在日本

  之外，台灣可說是本片在亞洲地區最先上映的國家之一，所以日方相當慎重其事，光是經

  紀公司、梳化造型師、電影宣發團隊，加上松重豐本人，就有9人團隊抵台，足見日方對

  此次訪台的高度重視。即使劇組這次沒有對外公開班機資訊，但機場依然聚集約莫20位有

  想要碰運氣的熱情粉絲，自主在機場守候，甚至有人還跟公司請假過來，就怕錯過跟松重

  豐在機場見面的機會。



  當松重豐以一襲皮外套、牛仔褲等休閒勁裝現身機場入境大廳，機場瞬間陷入熱烈場面。

  不少粉絲不斷呼喊松重豐的名字，甚至是遞上簽名版，以及遠從日本帶回來的電影周邊、

  公仔想索取他的親筆簽名。看到有影迷自主接機，讓松重豐可說是又驚又喜，並用親切微

  笑跟所有人揮手致意、簽名與合照來者不拒，大展親民的一面，光是從一現身入境大廳到

  上到保姆車，竟然耗費20多分鐘，可說是粉絲服務做好做滿，更有不知情的國外旅客看到

  現場情況，彷彿見到難得一見的台灣奇觀，紛紛把握機會拿起相機猛拍。現場來接機的粉

  絲甚至透露自己對松重豐的崇拜：「從很久之前就一直觀賞他的作品，這次終於見到本人

  真的好開心！」讓人見識到他的超高人氣。





  這次是松重豐第六度造訪台灣，除了記者會外，更將參加位在台北與台中的四場電影見面

  會，票券也在第一時間銷售一空。來台行程滿檔的他，今日（3/7）一出機場後，先是走

  平民路線，享用機場附近小吃店的擔仔麵，稍事休息後，下午4點緊接著出席位在戲院舉

  辦的《電影版孤獨的美食家》記者會。只見現場滿滿的台灣媒體守候，等松重豐以一身亞

  麻淺色西裝登場，立即成為鎂光燈焦點。他一開始親切秀台語與國語問候：「大家好，我

  是松重豐」還有經典台詞：「肚子餓了」，博得媒體好評，同時表示自己對台灣美食念念

  不忘，包括指定晚上一定要去吃豆花、火鍋，再三稱讚不已的酸菜白肉鍋，還耳提面命說

  要去夜市吃雞排。對於想吃但還沒機會吃到的香蔥麵包與太陽餅，則是對如此樸實且單純

  的日常小吃，究竟有什麼好吃的秘訣感到好奇，並期望這次有時間可以大啖台北與台中兩

  地美食。不過，松重豐雖然在本系列吃了不少美食，仍舊保持完美體態，對此松重豐透露

  ：「節目拍攝從第一盤到最後一盤，都是認真地吃完、拍完，所以會刻意讓自己肚子餓，

  呈現出最真實的狀態。拍攝期間大部分時候，都只有拍攝的當下吃東西，其他時候則是享

  受看工作人員吃東西的畫面，所以我控制得很好。」



  值得一提的是，之前松重豐曾對外提及，如果本片票房不好，之後就想退出本系列演出，

  但如今電影在日本的累積票房，截至本週三（3/5）已經突破10億日元（約新台幣2.06億

  元），並吸引超過70萬觀賞人次，對此松重豐笑說：「非常感謝大家支持，這部片接下來

  會在台灣、南韓與亞洲其他地方上映，希望有更多觀眾可以去看，我就絕對不會考慮引退

  ，同時也開始思考接下來的拍攝。」主持人更接問有無再來台灣拍攝的機會？他也表示有

  機會的話，更想要將足跡延伸到南部。他也同時分享：「因為這個節目，台灣或日本各地

  很多餐廳都會張貼我們的海報，讓我非常感動。疫情期間也有很多餐廳經營困難，很希望

  透過我們這部作品給予更多的支持與幫助，這同時也是我拍攝這部作品的使命。」



  值得一提的是，本次記者會請來曾演出《孤獨的美食家》第五季、長期在台灣發展的日本

  女星大久保麻梨子擔任主持人。兩人睽違多年再度透過這部作品相會，也直呼超級有緣。

  同時，他也在記者會上與大久保進行「台灣美食心理測驗」，從魯肉飯、牛肉麵、茶葉蛋

  、麵線、珍珠奶茶等眾多台灣美食當中，選出自己最想吃的「麵線」，並從中一窺他在日

  常生活中的優缺點，更當場品嚐片商為他奉上的「麵線」，讓現場簡直就是重現片中「五

  郎」的經典吃飯場面，而他更稱讚台灣的麵線：「日本完全吃不到這個口味！高湯的香氣

  跟麵線彈牙的口感，真是太棒了！」



  這部由松重豐自編、自導、自演的最新作品《電影版孤獨的美食家》，即將在3月14日於

  全台盛大上映。欲知更多電影相關訊息，敬請密切留意電影官方臉書粉絲團

  與Instagram專頁

  。



  --'
