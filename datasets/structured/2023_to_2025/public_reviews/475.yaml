url: https://www.ptt.cc/bbs/movie/M.1741875018.A.F81.html
title: '[新聞] 【電影版孤獨的美食家】翻轉地方餐廳命運'
content: '新聞網址：



  熱播13年的美食神劇《孤獨的美食家》，松重豐這回編、導、演一把抓，推出集大成的輝

  煌之作《電影版孤獨的美食家》，即將在明日（3/14）於台灣美味獻映。過去在劇中品嚐

  過不少美食的松重豐，這回在劇本創作初期，就決定以「湯品」為主題，讓本片不但有美

  味的法式洋蔥湯、獨特的韓式明太魚解酒湯，更有讓人一喝難忘的日式神祕之湯，帶領觀

  眾不用出國，就得以透過大銀幕感受到異國湯品之美味。尤其本片遠赴法國、南韓、日本

  三地取景，所拍攝的餐廳都是實景，老闆娘更親自參與拍攝，甚至連老闆娘家人的畫也跟

  著入鏡。值得一提的是，本片在日本奈留島一處「蜜柑屋食堂」拍攝時，原本猶豫「可能

  不會經營太久」的老闆娘，也因為本色演出了這部電影，讓她的心境因此轉變，表示會再

  多經營一段時間，意外讓本片為入鏡的餐廳注入一大經營強心針。





  《電影版孤獨的美食家》在劇本創作初期，身兼導演、編劇與主演的松重豐，就決定要以

  「湯品」為主題。他表示：「湯是每個國家料理中不可或缺的部分，當你覺得『這真好喝

  』時，通常都會去想：『這是用什麼材料熬的高湯？』基於這樣的想法，即便跨越不同場

  景去尋找東西，湯品都可以成為故事的中心。」因此，由松重豐飾演的「五郎」，一到法

  國就品嚐經典洋蔥湯，等去南韓後，更因緣際會與「明太魚解酒湯」相會。松重豐補充：

  「一開始我們其實是想採用日本也常見到的明太魚乾湯，但等到了當地之後，我們一邊拍

  攝，一邊將新碰到的料理融入劇本當中。我跟共同編劇田口佳宏一起到各地進行劇本探索

  ，反覆討論、思考。」



  據悉，本片還找來曾參與戲劇《深夜食堂》、《舞伎家的料理人》，以及電影《南極料理

  人》、《海鷗食堂》等作品，有「美食造型師」之稱的飯島奈美加盟，一同為本片探索神

  祕美味。製作人小松幸敏表示：「在劇本編撰階段，我們只有一個籠統的想法，就是想將

  『山』與『海』的食材巧妙結合，創造出料理，但隨著飯島小姐加入，透過她在各地採購

  到的具體食材，五郎將在旅途中尋找什麼，也就跟著清晰了起來。」尤其飯島更在釜山的

  札嘎其市場與各店主交談，尋找合適食材，再帶回日本進行多次試驗，最後研製出片中五

  郎所品嚐到的明太魚解酒湯湯底。副導演北畑龍一也稱讚：「飯島小姐以廚師視角提出的

  見解與靈感，為本片增添了深度。」





  值得一提的是，《孤獨的美食家》時常選擇在真實的美食店家拍攝，來到這回《電影版孤

  獨的美食家》也不例外，並在拍攝過程當中，將店主與老闆娘的個性融入故事當中，並將

  現場體驗到的元素帶進電影裡頭。松重豐回憶在南韓一家名為「Jinine食堂」的拍攝過程

  ：「南韓的地域性很有特色，例如某個地區幾乎都是鰻魚料理店，接下來的海岸線則全是

  章魚料理店，就像某些特定料理集中在特定區域似的。我們從北邊沿著海岸線一路向南找

  適合餐廳，最後在距離釜山約一個半小時車程的港口小鎮發現了一家店，直覺告訴我：『

  就是這裡了！』而和老闆娘與她的女兒聊過之後，發現她們都是非常親切的人，而且餐廳

  的菜單裡剛好有『明太魚解酒湯』，所以我們立刻敲定了這家店。拍攝時，她們唯一的條

  件是希望能拍到女兒畫的畫，我立刻答應：『當然沒問題！』」



  此外，在日本五島列島拍攝時，劇組也選擇位在奈留島一家「蜜柑屋食堂」拍攝。據悉，

  老闆娘起初因為「店鋪可能不會經營太久」而產生猶豫，但在劇組真心誠意地請求下，終

  於獲得她的同意拍攝，甚至還讓她本人在片中本色演出。松重豐也微笑回憶：「老闆娘的

  表演非常自然，演得很好。也因為演出了電影，老闆娘的心情似乎有所改變，表示會再多

  經營一段時間。」這也讓本片的拍攝，為經營困難的餐家們，無疑注入一大經營強心針。



  這部由松重豐自編、自導、自演，並在日本突破10億日元（約新台幣2.06億元）票房佳績

  ，吸引超過70萬人次觀賞的《電影版孤獨的美食家》，即將在明日（3/14）於台灣美味獻

  映。本片劇情描述從事進口雜貨銷售的井之頭五郎（松重豐飾演），是個喜歡在工作之餘

  到處品嚐美饌的老饕。只要肚子一餓，就會秉持「吃飯皇帝大」的信念，拋下一切直奔周

  遭的餐廳食堂大快朵頤。他最愛享受用餐時不被人打擾，細細品嚐料理的美好時光，更愛

  在內心自言自語品評美食滋味。這回，他接到前女友的女兒——千秋（杏飾演）的委託，

  前往法國拜訪千秋的祖父一郎（鹽見三省飾演），並要幫助一郎找出童年時曾喝過的湯頭

  食譜。儘管線索相當稀少，五郎依舊踏上尋找「究極湯頭」的旅程，足跡遍及法國、南韓

  、長崎和東京。不過在這趟旅程當中，他卻意外捲入到一場更大的風暴當中…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



