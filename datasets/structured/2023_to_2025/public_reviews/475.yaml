url: https://www.ptt.cc/bbs/movie/M.1743783107.A.DCE.html
title: '[好雷] 電影版孤獨的美食家'
content: '身為孤獨的美食家的忠實觀眾，有電影版當然要來看一下啦


  看之前因為孤獨的美食家有出過過年特別節目，也是到處吃吃吃


  所以很好奇電影版會有什麼不一樣


  看完覺得真的是不同的感受阿~



  雷文防雷資訊頁，以下有雷

  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  劇情簡單說是五郎送貨到法國的時候意外接下了尋找湯頭的任務


  然後經過千辛萬苦弄了個好喝湯頭給委託人這樣的故事


  一開始飛機上點餐一直吃不到那邊很好笑XD告訴我們一定要吃完飛機餐才睡覺


  下飛機找到小餐廳開吃的洋蔥湯跟紅酒燉牛肉看起來超好吃的


  雖然有人說到了法國只吃這兩樣有點不夠，不過這兩樣就很經典的法餐阿~


  碰到了委託人千秋，這位女演員好高阿，五郎188女演員跟他走一起只矮一點


  接著受委託人祖父的拜託，前往五島列島尋找熬製童年湯頭需要的食材


  強棒麵應該是當地特色的什錦麵，也不錯


  五郎為了買食材在颱風天划SUP出海，沒死掉也只能說是主角威能了


  漂流到島上五郎做出毒菇蛤蜊納豆湯，口吐白沫那邊很好笑


  被人救起來之後才發現已經漂流到韓國管轄的島，要擇日去辦入境


  就在島上享受了當地一眾女生們做的生機食材餐


  這餐我覺得是看起來第二好吃的，雞肉香菇跟蔬菜看起來都很鮮美


  跟島上工作人員之一的志穗聊天得知他有位在東京經營拉麵店的老公


  (是說志穗的拼音Shiho跟柯南裡灰原的本名拼音一樣，但柯南裡翻志保?)


  搭船到本島後肚子餓的五郎在公務人員的眼皮下好好吃了一餐


  這餐還好，東西沒到很吸引人，主要是公務員要吃又吃不到的表情XD


  然後回到日本，找到志穗的老公，從一開始只做炒飯到後來願意試湯頭


  反正湯頭試成功也讓新聞台來拍孤獨美食家11季(要他演我之後不會再看)


  最後法國爺爺說這不是他記憶中的味道但很好喝


  五郎懷著有點惆悵的心情去吃下一頓飯了



  我覺得以森重豐第一次當導演的劇算90分了


  前半段是孤獨美食家的劇情，後面比較像各自的美食家(素人自己做菜博得五郎歡心)


  而後面更是好不好吃都OK但有本劇精神


  像最後拉麵店老闆的湯頭配上麵跟叉燒


  雖然看起來不是非常好吃，但就是個日常


  你看起來還好，但是很好吃，我下班要吃一次這樣的感覺



  好啦就說到這邊，歡迎大家來看


  然後不說了，我先去吃拉麵吧，掰~


  --'
