url: https://www.ptt.cc/bbs/movie/M.1739454691.A.AC3.html
title: '[新聞] <電影版孤獨的美食家>創日本票房口碑雙冠'
content: '新聞網址：



  開播至今已經邁向第13年、有「國民美食神劇」之稱的《孤獨的美食家》，在觀眾們的殷

  切期盼下，終於推出大銀幕限定的《電影版孤獨的美食家》，並將在3月14日於台灣美味

  獻映。這回，電影版的製作規模更加龐大，男主角「井之頭五郎」的足跡更將遍佈法國巴

  黎、南韓巨濟島、長崎五島群島與東京。主演松重豐在這13年來，自始至終支撐著這部作

  品，並深深了解其中的世界觀。對於推出電影版，松重豐原本想找《寄生上流》奧斯卡金

  獎名導奉俊昊執導，因為兩人曾在電影《東京狂想曲》有過合作經驗，甚至還親自寫信給

  對方提出邀約，只可惜對方時間無法配合，但這也讓他有了不同思考：「乾脆由我來執導

  怎麼樣？」於是他寫下一份劇情大綱給工作人員看，並獲得正面回饋：「覺得不錯，一起

  做吧。」因此成就出這部他出道40餘年來，首度擔任導演、編劇、主演的作品，更在日本

  上映之後，一舉奪下日本新片票房冠軍，甚至登頂日本最大影視口碑網站「Filmarks」的

  「初日滿意度」冠軍，可說是叫好又叫座！





  開播至今已達13年的國民美食神劇《孤獨的美食家》，最早是由久住昌之原作、谷口治郎

  作畫，於1994年開始連載的漫畫。從2012年拍攝成電視劇以來，已經累積11季劇集、12集

  特別篇，可說是日本最長壽的美食劇集。而這部紅遍海內外的美食神劇，如今終於以《電

  影版孤獨的美食家》跟所有觀眾在大銀幕見面。尤其本作最大的魅力，就是透過主角「井

  之頭五郎」在辛勤工作之後，找到一家偶然經過的餐廳用餐，並沉浸在努力工作後，享用

  美食的幸福時光當中，再透過主角豐富的內心戲，甚至是對美食的直覺，在不受任何人打

  擾、自由享受美食的情況下吃遍大街小巷，無比療癒著觀眾的身心靈，也讓領銜主演松重

  豐被觀眾封為「吃播之王」。



  尤其本片的製作規模更加龐大，足跡將遍佈法國巴黎、南韓巨濟島、長崎五島群島和東京

  ，踏上一場「尋找失傳終極湯頭之旅」。也因為松重豐的號召，本片齊聚豪華演出陣容，

  包括內田有紀、磯村勇斗、村田雄浩、鹽見三省、杏、小田切讓、遠藤憲一，以及曾演出

  《梨泰院Class》的韓星劉宰明特別加盟。尤其本片甫於日本上映，便強勢空降日本新片

  票房冠軍，累積票房更勇破8億日元（約新台幣1.65億元），吸引近60萬觀賞人次，甚至

  登頂日本最大影視口碑網站「Filmarks」的「初日滿意度」冠軍。不僅如此，本片也進軍

  國際，先後入選釜山影展、東京影展觀摩單元放映，透過笑淚交織的溫暖人心劇情，讓美

  食跨越國界，透過大銀幕轟動國際，值得觀眾進戲院，體驗五郎這場截然不同的美食冒險

  之旅。





  值得一提的是，松重豐這回更一肩扛起《電影版孤獨的美食家》導演、編劇、主演工作，

  尤其他在這13年來，自始至終支撐著本作，深深了解作品的世界觀，成為他出道40餘年首

  度自編、自導、自演之作。他回憶這次將作品「放大」成電影版的過程：「如果我沒記錯

  ，應該是拍攝電視劇第十季的2022年夏天。當時，長期參與系列作的製片人和工作人員因

  調動或轉職，讓人擔心沒人能綜觀全局並指引未來的方向。這讓我想到，既然正值十週年

  ，為了測試這部作品是否還能繼續、有更大規模的發展，我決定展開動搖根基的挑戰。基

  於這樣的想法，我選擇『電影化』這個方式，雖然並不確定本作的內容是否適合改編成電

  影，但希望能藉此進行一次重構。」



  尤其松重豐是本作唯一的常駐主演，這讓他產生一種責任感：「基於對未來發展的考量，

  我開始思考誰適合當導演。」而他最一開始，就是想找《寄生上流》奧斯卡金獎名導奉俊

  昊執導，他對此表示：「考慮到本作不僅在日本、在東亞地區、尤其是韓國都頗受歡迎。

  我也曾在多次赴韓取景時感受到觀眾的熱情，於是我便想到了奉俊昊導演。恰巧，我和他

  之前在《東京狂想曲》中的〈搖晃的東京〉短篇合作過，覺得如果他能將這部作品『烹調

  』成電影，會非常有趣。」松重豐甚至還親自寫信給奉俊昊提出邀約，只可惜對方回覆時

  間因素無法配合，但這也開啟他不同的思考：「我和事務所社長談起這件事，隨口說了一

  句：『要不乾脆我來當導演？』這就是最一開始的狀況。」他並補充：「之後，我並沒有

  太在意自己說話的分量，就順勢寫下了一份劇情大綱，拿給正在拍攝第十季的工作人員看

  ，跟他們說：『我打算以這份大綱來拍電影，大家覺得怎麼樣？我打算自己當導演。』結

  果他們回答：『我覺得不錯，一起做吧。』」而這也成就出本片最一開始的面貌。



  這部由松重豐自編、自導、自演，並一舉登上日本新片票房冠軍的《電影版孤獨的美食家

  》，即將在3月14日於台灣美味獻映。本片劇情描述從事進口雜貨銷售的井之頭五郎（松

  重豐飾演），是個喜歡在工作之餘到處品嚐美饌的老饕。只要肚子一餓，就會秉持「吃飯

  皇帝大」的信念，拋下一切直奔周遭的餐廳食堂大快朵頤。他最愛享受用餐時不被人打擾

  ，細細品嚐料理的美好時光，更愛在內心自言自語品評美食滋味。這回，他接到前女友的

  女兒——千秋（杏飾演）的委託，前往法國拜訪千秋的祖父一郎（鹽見三省飾演），並要

  幫助一郎找出童年時曾喝過的湯頭食譜。儘管線索相當稀少，五郎依舊踏上尋找「究極湯

  頭」的旅程，足跡遍及法國、南韓、長崎和東京。不過在這趟旅程當中，他卻意外捲入到

  一場更大的風暴當中…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
