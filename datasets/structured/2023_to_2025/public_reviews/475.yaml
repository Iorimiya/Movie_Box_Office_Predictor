url: https://www.ptt.cc/bbs/movie/M.1741096054.A.E6B.html
title: '[新聞] 【電影版孤獨的美食家】松重豐揭重字發音'
content: '新聞網址：



  「五郎」松重豐魅力無法擋！繼台灣片商公佈他將為自編、自導、自演新片《電影版孤獨

  的美食家》訪台宣傳，並在上週開賣台北與台中共四場見面會門票之後，近1100張門票便

  在第一時間火速完售，再度見證他在台灣的超高人氣。適逢他將在本週五（3/7）六度訪

  台，並考量他名字中的「重」是破音字，有二聲與四聲念法，為求慎重起見，片商特別在

  跟松重豐視訊會議時求解正確念法，如今確定正音他名字中的「重」為二聲「ㄔㄨㄥˊ」

  。片商並加碼追問原因，原來竟是四聲念起來「太像某種疾病」，原因讓人點頭稱是。此

  外，由於南韓是本片拍攝地點之一，讓松重豐在訪台之前，也抽空前往南韓進行一系列節

  目宣傳，尤其他跟片中飾演入境管理局審查官的演技派韓星劉宰明有精彩對手演出，一場

  餐桌戲，只見劉宰明眼巴巴看著松重豐大啖美食，逗趣模樣讓人為之莞爾。對於有機會演

  出本片，劉宰明更是感謝松重豐：「導演就像與我共事多年的同事一樣，積極吸收我的解

  釋與即興創意，讓我能自在地表現自己。」《電影版孤獨的美食家》即將在3月14日於全

  台美味獻映。





  即將在本週五（3/7）為《電影版孤獨的美食家》六度訪台的松重豐，台灣片商有感於他

  將出席記者會，以及位在台北及台中的見面會，將有不少機會念到他的名字。然而他名字

  中的「重」是破音字，有二聲跟四聲念法。為求慎重起見，片商特地在跟他與日方工作人

  員視訊會議的過程中，提問中文正確讀音是什麼。只見松重豐先是思考一番，並詢問一旁

  會中文的工作人員意見，最後取得共識，決定正音他名字中的「重」為二聲「ㄔㄨㄥˊ」

  。不過再有感不少台灣民眾都將他的「重」念成四聲，細究二聲的原因，原來是因為如果

  念成四聲，會讓他的名字聽起來「太像某種疾病」，也讓眾人在當下恍然大悟，點頭稱是

  。所以台灣粉絲們也歡迎趁他在本週訪台時，遇到他可以稱呼他為「松ㄔㄨㄥˊ豐」而不

  是「松ㄓㄨㄥˋ豐」了。





  《孤獨的美食家》系列開播以來，持續在台灣與南韓廣受歡迎。因此，這回《電影版孤獨

  的美食家》劇組更加重視台灣與南韓的宣傳，並決定要訪台進行宣傳，與台灣觀眾親密互

  動。而在松重豐即將來台之前，已經抽空前往南韓進行節目拍攝宣傳，不僅上了喜劇演員

  金大熙經營的影音頻道《吃飯吧》，更參與「國民MC」劉在錫等人主持的《玩什麼好呢》

  ，可說是為這部嘔心瀝血的自編、自導、自演之作奉獻良多，尤其聽聞「自己在南韓比大

  谷翔平還紅」這件事，讓是讓他感到不可置信，並幽默自嘲：「這樣我會有點得意忘形了

  ！」不過他在南韓的人氣確實有目共睹，尤其本片遠赴南韓巨濟島取景拍攝時，更迎來當

  地的熱烈歡迎。本片副導演北畑龍一回憶：「當地人的熱情非常驚人，一位當地企業家甚

  至包下一家咖啡館，提供餐飲為我們補給。共同演出的演員劉宰明先生，也為了感謝工作

  人員，特地舉辦聚餐，尤其他平時參與的南韓電影，大約有300位工作人員，如果要全額

  支付聚餐費用會非常昂貴。不過這次團隊只有約莫50人，也讓他開玩笑說：『真想每天請

  大家吃飯呢！』」



  尤其曾演出《請回答1988》、《梨泰院Class》、《幸福國度》等知名影視作品的劉宰明

  ，這回在本片飾演入境管理局審查官。一場兩人同框的餐桌戲，只見劉宰明眼巴巴看著松

  重豐大啖美食，逗趣模樣讓人為之莞爾。據悉，劉宰明與松重豐雖是以日語和韓語交談，

  但同樣身為演員，兩人似乎有著深刻默契。劉宰明更直言這次拍攝，是他難以忘懷的回憶

  ：「我對松重豐導演充滿感謝之情。我是屬於喜歡以靈活且感性、接近片中情境及導演志

  向的方式來進行表演。導演就像與我共事多年的同事一樣，積極吸收我的解釋與即興創意

  ，讓我能自在地表現自己。我認為，雖然語言與工作環境不同，但通過彼此信任與尊重，

  我們才得以達成這樣的成果。」



  這部由松重豐自編、自導、自演，並一舉登上日本新片票房冠軍的《電影版孤獨的美食家

  》，松重豐即將在3月7日至9日訪台宣傳，電影也將在3月14日於台灣美味獻映。台灣片商

  現正開賣「電影預售票」，一份300元內含五郎人形書籤乙張、珍藏電影票（有裁切線，

  可收藏上聯電影主視覺）乙張，請速上博客來售票網選購（

  ）。本片劇情描述從事進口雜

  貨銷售的井之頭五郎（松重豐飾演），是個喜歡在工作之餘到處品嚐美饌的老饕。只要肚

  子一餓，就會秉持「吃飯皇帝大」的信念，拋下一切直奔周遭的餐廳食堂大快朵頤。他最

  愛享受用餐時不被人打擾，細細品嚐料理的美好時光，更愛在內心自言自語品評美食滋味

  。這回，他接到前女友的女兒——千秋（杏飾演）的委託，前往法國拜訪千秋的祖父一郎

  （鹽見三省飾演），並要幫助一郎找出童年時曾喝過的湯頭食譜。儘管線索相當稀少，五

  郎依舊踏上尋找「究極湯頭」的旅程，足跡遍及法國、南韓、長崎和東京。不過在這趟旅

  程當中，他卻意外捲入到一場更大的風暴當中…。



