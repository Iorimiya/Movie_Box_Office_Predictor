url: https://www.ptt.cc/bbs/movie/M.1743311764.A.F6B.html
title: '[好無雷]電影版孤獨的美食家-更頂的五郎吃遍世界'
content: '圖文好讀版：




  終於朝聖本片！常在電視或YT看到井之頭五郎（松重豊飾）開吃，身為吃貨著實

  被他每次浮誇的內心話弄到不要不要，原本看預告一直覺得還好，

  想說電影版不過爾爾，結果片頭剛開始就發現錯了，完全走本人喜歡路線啊啊啊！！！

  精彩的全偷藏沒爆雷。


  《電影版 孤獨的美食家》 既然身為電影版，當然要強化世界觀，所以觀眾

  會陪五郎從巴黎、五島、韓國一路吃，再吃回東京，

  網友們形容此乃大型吃播現場很貼切，最經典的『お腹が減った』台詞，

  也會不斷重覆放送（到底餓了幾次這人XD）。


  巴黎那頓印象最深，剛好也是筆者頗愛的餐點。


  導演兼演員的松重豊，在每個橋段舖陳跟笑點安排得很好，時常不少畫面及鏡頭刻意

  停滯讓觀眾大笑，最後還送台灣專屬彩蛋；美食也從一開始的極致豪華到逐漸清淡，

  最後收尾在如同深夜食堂般的暖心，回歸料理初心。


  總體來說，《電影版 孤獨的美食家》便是我們電視上看到《孤独のグルメ》的組合拳，

  搭配些許電影效果和小故事穿插，組成一部搞笑又感人的美食冒險之旅。

  有些男配角超級有趣，那個Daniel和韓國移民官大叔……笑爛。



  放映結束後，觀眾們頗有默契，不約而同地說：「看完肚子都餓了！」


  跪求拍續作w





  --



  「喂，聽說秒速五公分。」

  「什麼？」

  「櫻花落下的速度呀，每秒五公分。



  --'
