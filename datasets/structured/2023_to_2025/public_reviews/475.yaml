title: '[新聞] 【電影版孤獨的美食家】松重豐訪台確定！'
content: '新聞網址：



  五郎魅力即將席捲全台！熱播13年的國民美食神劇《孤獨的美食家》，這回推出集大成輝

  煌之作《電影版孤獨的美食家》，即將在3月14日於台灣美味獻映。打從本片上映資訊公

  開之後，已經引來不少網友期盼，男主角松重豐更也在自己的社群上貼出台灣海報一起宣

  傳，讓不少網友留言希望他可以再來台灣大啖美食。這也讓電影公司與日方耗時多月密切

  接洽之後，終於在今日（2/19）傳來天大好消息，就是一手包辦全片導演、編劇、主演多

  職的松重豐，確定將在3月7日至9日進行三天兩夜的訪台行程！除了參加記者會與媒體分

  享拍攝趣事，他更將參與多場首映見面會，與粉絲近距離互動，以答謝忠實粉絲們長年對

  本作的支持。據悉，這是他在2023年訪台拍攝《孤獨的美食家》除夕特別篇後，第六度造

  訪台灣，預期將引爆粉絲追逐這位「吃播始祖」熱潮！同時，已經品嚐過眾多台灣美食的

  他，更期盼這次來台灣，可以吃到小籠包、酸菜白肉鍋、火鍋、麵線等好料，並直呼：「

  真是有太多想吃的了！」





  松重豐即將帶著自編、自導、自演新作《電影版孤獨的美食家》再度訪台，讓台日雙方不

  論電視台、製作公司與經紀公司全都慎重其事，尤其本片是製播本劇的東京電視台，開台

  60週年紀念作品，更是松重豐的演藝生涯代表作之一，也讓台日雙方自去年11月起，花費

  三個多月反覆安排，如今終於確認將從3月7日至9日進行三天兩夜的密集行程。除了松重

  豐之外，日方還將大陣仗出動8位隨行人員一起來台，並預計在7日一下飛機，稍微休息就

  將出席記者會跟台灣媒體會面，接下來更將出席多場電影放映與首映見面會，與影迷近距

  離接觸，分享拍片趣事。尤其松重豐本身是白髮，在片中則是黑髮造型登場。究竟記者會

  與首映見面會當天，他會以什麼樣的髮色現身？主辦單位也賣關子，敬請拭目以待！也因

  為這次停留台灣的時間較為充裕，讓他有更多機會跟粉絲互動，所以電影公司目前正密集

  籌備首映見面會活動細節，票價及活動資訊將在近期公佈，敬請密切留意發行商「采昌國

  際多媒體」的Facebook、Instagram、Threads等官方社群資訊發佈。





  《電影版孤獨的美食家》最大特色，就是男主角「五郎」這回不僅在日本吃，更將遠赴法

  國巴黎、南韓巨濟島等地大啖法、韓料裡，讓觀眾不用出國，就可以透過大銀幕滿足口腹

  之慾。而劇組也「加碼」，即將在三月飛來台灣宣傳。松重豐透過經紀公司表示期待之意

  ，直呼好想趕快造訪台灣，感受台灣粉絲們的熱情。尤其距離他在2023年11月來台拍攝《

  孤獨的美食家》除夕特別篇後，已經時隔一年多沒有吃到台灣道地好料了，所以這回訪台

  ，他也特別期盼能有機會吃到小籠包、酸菜白肉鍋、火鍋、麵線等好料，並直呼：「真是

  有太多想吃的了！」



  這部由松重豐自編、自導、自演，並一舉登上日本新片票房冠軍的《電影版孤獨的美食家

  》，松重豐即將在3月7日至9日訪台宣傳，電影也將在在3月14日於台灣美味獻映。本片劇

  情描述從事進口雜貨銷售的井之頭五郎（松重豐飾演），是個喜歡在工作之餘到處品嚐美

  饌的老饕。只要肚子一餓，就會秉持「吃飯皇帝大」的信念，拋下一切直奔周遭的餐廳食

  堂大快朵頤。他最愛享受用餐時不被人打擾，細細品嚐料理的美好時光，更愛在內心自言

  自語品評美食滋味。這回，他接到前女友的女兒——千秋（杏飾演）的委託，前往法國拜

  訪千秋的祖父一郎（鹽見三省飾演），並要幫助一郎找出童年時曾喝過的湯頭食譜。儘管

  線索相當稀少，五郎依舊踏上尋找「究極湯頭」的旅程，足跡遍及法國、南韓、長崎和東

  京。不過在這趟旅程當中，他卻意外捲入到一場更大的風暴當中…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
