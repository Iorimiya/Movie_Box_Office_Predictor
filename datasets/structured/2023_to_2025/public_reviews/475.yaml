url: https://www.ptt.cc/bbs/movie/M.1744721888.A.635.html
title: '[好雷] 電影版孤獨的美食家'
content: '這是由日本電視劇"孤獨的美食家"衍伸的電影版作品，

  由演出這系列主角的松重豐自編自導自演。


  原PO只有在大概S3~S7附近有斷斷續續追過，跟主角專心在小店享用美食的心情很有共感。

  當時的印象非常好，所以這次知道電影版有來台上映就找了個時間去看。


  先說結果是相當滿意，推薦給還在觀望的老粉去看，

  劇情導入方式也能讓沒看過連續劇的觀眾了解。

  在台上映檔期應該撐不到5月了，可以趕緊進電影院支持。



  ========以下有雷============
















  以下是粉絲向的心得


  電影版的劇情橫越法國、韓國、日本九州、東京，五郎還跑去SUP，讓老人家的筋骨大幅

  活動到，可以感受出來有給足了誠意。


  前期的故事合理性有點讓人出戲(委託緣由和度過颱風的部分)，甚至有一幕無法交代水源

  來源，直接獨白帶過：「還好剛好附近有河水」

  (其實寫這篇文有20%動機是想吐槽這句XD)


  但故事從中後期開始，越能抓回整部劇的核心，因為美食而讓人不孤單的初衷

  用餐情境的豐富度也讓這部片不顯單調(基本的餐館用餐、被人期待、被移民署官員盯著

  看、被拉麵店老闆討厭)


  劇中笑點不少，有一個自己覺得有趣的地方是，拉麵老闆問食材的來源，五郎直接答非所

  問：「我有便宜的來源」

  真的是表現出商人掌握了客戶需求的本色XD 看來五郎在吃東西以外的時刻還是滿盡職

  的


  劇中讓遠藤憲一登場的方式也非常巧妙，竟然是安排劇中劇，在這個世界裡也有"孤獨的

  美食家"這個連續劇存在，由遠藤憲一擔任劇中劇的主角，松重豐反而自己在裡面演路人，

  算是給老粉不少的欣慰和會心一笑


  最後的收尾也讓委託爺爺看似任性的要求，得到了一個很好的解釋，讓他對人生又多了一

  項期待，點到為止，並沒有過於濫情和交代背景，覺得是拿捏很恰當、舒服的收尾。


  邊打邊回憶，歡迎有進場觀賞的版友也留言交流感想～























  ========= 防雷分隔線=============


  --

  對呀，我也是認為五郎就是先掌握拉麵老闆想要的是什麼，才劈頭直接回這句～XD'
