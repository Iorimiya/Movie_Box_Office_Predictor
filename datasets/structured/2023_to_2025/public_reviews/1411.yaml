url: https://www.ptt.cc/bbs/movie/M.1442701718.A.38B.html
title: '[好雷] 達賴喇嘛14世：西藏大哉問'
content: '因在版上還沒看到相關討論跟觀後文，決定自己來推一下！

  第一次movie版首po就獻給這部了，希望大家鞭小力一點(抖



  達賴喇嘛完全是一部好片！


  先說結論，他無關佛教教義如何，光西藏這個"國家"的文化就夠讓人震撼以及驅使人反思

  現代社會的問題何在！


  我個人是對於導演訪談的編排有些意見，我認為導演的手法是在過濾也傳播他個人意見，

  以紀錄片而言我覺得不是很客觀，但並不影響這部片內容的可看性。


  另外，達賴個人的特質是促使我去看的最大因素，我一開始也是對本片興趣缺缺，但達賴

  非常幽默，這部片並不會讓人感到無聊(除非你就是沒有要看需要思考的片的意思....)


  非常認真的推薦達賴這部片，對我從來就不是任何教徒的人而言，我認為這部片傳達的思

  想，慈悲、誠實、放寬眼界等概念是讓人非常感動也是很根本的一些價值，很值得一看。



  --------------------防雷 --------------------












  這部片的訪談整理真的讓我很震驚，除了達賴對於教育的重視，在流亡政府設立初期就迅

  速建立教育制度以及收留養育孩童的機構，也可以看到片中西藏孩童跟年輕僧人都對於生

  活、對能夠受教育很滿意，對自己的國家及文化充滿深厚的情感，

  對於自己的語言和身分感到驕傲，並都希望為社會做出貢獻。


  另外，達賴的非暴力思想也的確讓人印象深刻。本片一開始會以為達賴是現實主義，在面

  對與中國的問題，他只是放棄抗爭流血尋求存活的表面和平，但到後來就會明白他想尋求

  的是真正的解決之道，就像小女孩說的，主動讓國際社會認識西藏、理解他們的困境、明

  白西藏人的良善，並打從心底感到慈悲而願意給予幫助。


  我想本片所傳達的這些想法是很令人敬佩的，但如果只是以尊佛禮佛的心態進電影院去看

  ，就真的浪費了。



  --

  Sent from my Android


  --

  我是持懷疑態度，畢竟那是中國自己的說法，這你敢信(?


  那位校長要求導演拍攝時要尊重小孩個人意願，這也是蠻讓人佩服的部份。


  真的很多老人.....幸好我那場沒遇到邊看邊講解的，我應該會受不了被打擾...

  他上映首日甚至還有喇嘛去看，頗特別的。


  已羨慕!!'
