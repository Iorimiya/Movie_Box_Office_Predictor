url: https://www.ptt.cc/bbs/movie/M.1441025660.A.EA9.html
title: '[新聞] 達賴喇嘛14世 9/11全台上映'
content: '（中央社記者黃于台北31日電）「達賴喇嘛14世」是曾在東京影展奪獎的導演光石富士朗

  的首部記錄電影，被譽為「史上最貼近達賴喇嘛的電影」將於9月11日在台上映。


  曾被美國「TIME」雜誌形容為「全世界最有影響力的人」的第14世達賴喇嘛，上月剛過完

  他的80大壽。而一部遠赴印度拍攝他與西藏流亡政府的記錄電影「達賴喇嘛14世：西藏大

  哉問」（The Dalai Lama, The 14th：The World Champion Of Peace）此刻也正在日本

  上映。


  這部費時六年拍攝達賴喇嘛流亡印度、重建藏人文化艱辛歷程的電影，卻因為題材太過敏

  感，在日本發行規模雖然不大，卻引發熱切報導。特別的是，「達賴喇嘛14世」看似日本

  送給達賴的80大壽賀禮，但片中達賴卻也對現今日本提出解惑與忠告，在二戰結束70年的

  今天看來，格外具有意義。這部被譽為「史上最貼近達賴喇嘛的電影」「達賴喇嘛14世」

  於9月11日在台上映。


  「達賴喇嘛14世」是曾在東京影展奪獎的導演光石富士朗的首部記錄電影。他原只是協助

  攝影師薄井父子、整理第14世達賴喇嘛的訪日影像，卻意外興起了探討達賴喇嘛心靈旅程

  的想法，最後遠赴西藏流亡政府－印度北方的達蘭薩拉（Dharmasala）拍攝完成。


  費時六年拍攝的「達賴喇嘛14世」，展現了第14世達賴喇嘛艱苦困頓的人生，以及西藏議

  題的複雜性。值得一提的是「達賴喇嘛14世」也探討了佛教中「業」的迴向，片中達賴誠

  懇地以「幸或不幸，都有更深層的遠因」，為日本民眾祈福解惑。


  導演光石富士朗則藉由達賴的話語，給了日本三一一震災後、最需要的人心省思。他更以

  「無土無國、一心向上」的流亡西藏學子，來對映「物資豐沛、苦悶不滿」的日本年輕人

  ，直指日本的未來隱憂。也使該片在二戰結束70年的今天，格外深具意義。「達賴喇嘛14

  世」將於9月11日在台上映。


