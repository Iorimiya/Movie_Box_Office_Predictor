title: '[新聞] 光石富士朗執導　史上最貼近達賴喇嘛的電'
content: "光石富士朗執導　史上最貼近達賴喇嘛的電影！\n\n新聞網址：\n\n2015年 09月 06日  01:56\n\n ▲《達賴喇嘛14世》被評為「史上最貼近達賴喇嘛的電影」。\n\
  \n（圖／海鵬，2015.09.05）\n\n\n娛樂中心／台北報導\n\n《達賴喇嘛14世：西藏大哉問》是東京影展導演光石富士朗的首部記錄電影。\n\n他原只是協助攝影師薄井父子、整理第\
  \ 14 世達賴喇嘛的訪日影像，\n卻意外興起了探討達賴喇嘛心靈旅程的想法，\n最後遠赴印度北方的達蘭薩拉（Dharmasala）拍攝完成。\n\n《達賴喇嘛14世》被評為「史上最貼近達賴喇嘛的電影」，\n\
  也首度披露了藏人流亡海外的生活、教育，以及他們對重返西藏的想法。\n\n第 14 世達賴喇嘛訪問日本，掀起空前轟動。\n\n肩負攝影重任的攝影師薄井父子，在拍攝之餘，還上街訪問年輕人，\n\
  卻驚訝發現很多人並不真正認識達賴喇嘛。\n\n導演光石富士朗於是決定遠赴印度北方，探尋拍攝「流浪在海外的西藏」，\n並讓世人看見達賴喇嘛的最真實樣貌…。\n\n\
  這部費時六年拍攝的《達賴喇嘛14世》，\n展現了第14世達賴喇嘛艱苦困頓的人生，以及西藏議題的複雜性；\n也檢視了達賴喇嘛開始後的「藏傳佛教」，\n更看見達賴喇嘛以及追隨他的子民們，\n\
  是如何胼手胝足地建立起這個風雨飄搖的流亡政府。\n\n值得一提的是，《達賴喇嘛14世》也探討了佛教中「業」的迴向，\n片中達賴誠懇地以「幸或不幸，都有更深層的遠因」，\n\
  為日本民眾祈福解惑。\n\n導演光石富士朗則藉由達賴的話語，給了日本 311 震災後、最需要的人心省思。\n\n他更以「無土無國、一心向上」的流亡西藏學子，\n\
  來對映「物資豐沛、苦悶不滿」的日本年輕人，直指日本的未來隱憂。\n\n也使該片在二戰結束七十年的今天，格外深具意義。\n\n▲《達賴喇嘛14世》被評為「史上最貼近達賴喇嘛的電影」。\n\
  \n（圖／海鵬，2015.09.05）\n\n\n達賴喇嘛兩歲時就被認定是「13世」轉世的靈童，\n並在 5 歲時繼任、成為藏傳佛教的最高領袖。\n\n23 歲的他被迫展開流亡生涯，\n\
  達賴喇嘛開始向全世界、提倡西藏自由與世界和平。\n\n他於 1989 年獲頒諾貝爾和平獎，\n2011 年更被美國【TIME】雜誌評為「世界史上最具代表性 25\
  \ 大政治家」，\n受到世人的景仰！\n\n現齡八十的達賴喇嘛，不僅是藏傳佛教的最高領袖，\n更是天下蒼生仰賴的精神導師。\n\n他決定退位！\n\n他是否轉世？\n\
  \n一舉一動都牽動著世界局勢…。\n\n有人問他「面對強大壓迫，為何膽敢堅持自由？」，\n\n也有人問他「何謂真正的和平？」，\n\n更有年輕人好奇「若能留髮，您會留什麼髮型？」，\n\
  \n且看達賴喇嘛既睿智又幽默的回應…。\n\n--\n 安全、無毒的食物\n 有錢結婚生養小孩\n買得起的房子\n被老闆當人看\n下班還來得及和親友吃晚餐\n\
  租得起房子找得到工作\n\n--\n                                 09/06 13:12"
