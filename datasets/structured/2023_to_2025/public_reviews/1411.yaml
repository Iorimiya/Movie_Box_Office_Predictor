title: '[新聞] 《達賴喇嘛：大腦故事》全台票房破百萬 '
content: '《達賴喇嘛：大腦故事》全台票房破百萬 佳評如潮熱映中



  《達賴喇嘛：大腦故事》11月12日正式上映，連續兩周全台票房破百萬、佳評如潮，影評

  一致熱烈強力推薦。


  《達賴喇嘛：大腦故事》是關於達賴喇嘛探討醫學和科學的電影。片中達賴喇嘛同猶太裔

  神經科學家理查‧戴維森（Richard J. Davidson）討論「復原力、慈悲心，以及科學治

  療今日」等主題。理查是威斯康辛大學神經科學實驗室主任，專研大腦皮層和皮層下功能

  ，他在大腦可塑性方面的研究成果，獲得了世界性聲譽。片中，同時也可以看到尊者和其

  他來賓「心智與生命」研究機構負責人蘇珊鮑爾吳（Susan Bauer-Wu）等人共同探討大腦

  的秘密。


  達賴喇嘛未曾展現過的一面。透過攝影機進入他私人的生活領域，觀眾近距離感受這位孜

  孜矻矻背誦經文、處理日常庶務的平凡僧人，看到他是如何運用佛學、科學等知識，開導

  眾人。


  知名影評人城邦出版集團布克文化副總編輯蘇士尹讚許：「透過這部電影，或許可以讓我

  們看到一些觀點；為了透過英文闡揚佛理，在傳授佛教修持上，同樣是入門理論，語法變

  得更淺白易懂，像是修行，英文用「practice」──練習，個人覺得「練習」這個詞更適

  合用來解釋修行上的日晚課：練習打坐、練習「聞思修」、練習大腦的思維邏輯習慣（轉

  負面情緒為平靜，甚至是正念）。更有意思的是，當科學家用腦波記錄「同理心」、「同

  情（慈悲）」，才發現，原來同理心可以讓我們感受別人的痛苦，可是卻無法消除因此而

  來的負面情緒，但慈悲可以，一種因同理心而付出的關懷與送出的溫暖，可以達到消除負

  面情緒的作用，呈現於腦波的區位和能量也不同。」



  Ettoday名家專欄「瘋電影家族」賴賴同樣也大讚：「這真的是一部尤其是這個時代的年

  輕人，最需要看的必讀電影，科學家滿滿的訊息，在透露這個時代我們該怎麼活下去，怎

  麼再去繁衍下一代，如何教育下一代，而不再不斷創造悲劇，而已經產生的難題也永遠解

  決不了，因為從學校教育開始就錯了，以至於這個時代不論哪個國家，精神病患憂鬱自殺

  ，永遠無法根絕，就連治療都很困難，相當有誠意的電影，從一開始的驚嚇破題，到最後

  苦口婆心，這不是宗教鼓吹的目的，而是在救下一代和下下一代，電影流暢好看，一點都

  不艱澀，訊息非常豐富，看了兩次還想再看。」


  影評人洪光遠則大讚：「以先進的大腦科學，探索生命奧祕的生命科學，是整合腦神經、

  認知心理、宗教、哲學，乃至人工智慧等跨領域的學門。這種結合了西方科學與東方佛教

  ，以探索人類最重要，且根本議題的唯有胸襟開放，識見超然的人類精神領袖能致之。參

  與這些盛事的佛教高僧與專家學者，似乎正帶動著觀眾，共同浸淫在無私無我的氛圍中

  ，一起邁向人類幸福之路反觀現實，週遭充斥著偏狹歧見，攻訐忌恨的邪說惡念，真心期

  盼本片如晨鐘暮鼓的理念，能滌除世間的濁流妖氛，還以清明。」


  台灣電影發行商聯影電影也宣布，同步推出票根抽獎活動，粉絲拍照首輪戲院票根至聯影

  電影FB粉絲團指定活動貼文，即可抽中多項好禮。




  新聞網址：



  --'
