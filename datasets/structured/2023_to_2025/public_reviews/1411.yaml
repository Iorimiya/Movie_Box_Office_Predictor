url: https://www.ptt.cc/bbs/movie/M.1441204116.A.80C.html
title: '[新聞] 「達賴喇嘛14世」試映 佛學博士朝聖'
content: '「達賴喇嘛14世」試映 佛學博士朝聖


  2015-09-02 19:48:02 聯合報 記者項貽斐／台北報導


  紀錄片「達賴喇嘛14世：西藏大哉問」2日舉行試片，受封「格西」（藏傳佛教佛學博士

  ）的見悲青增、札西彭措等4位喇嘛也前來朝聖。見悲青增看到該片海報十分興奮，立刻

  蹲下「合照」，顯現天真可愛的一面。


  出生於西藏、成長於印度，已在台灣定居15年的見悲青增，參見過達賴喇嘛超過20次，今

  年4月達賴喇嘛訪問日本時，他還特地飛到日本聽演講。由於近年兩岸的關係敏感，達賴

  喇嘛最近一次是2009年的八八水災後來台撫慰災民，見悲青增當時也跟隨在旁。見悲青增

  表示，達賴喇嘛4月在日本的演講讓他印象最深刻的是，當天來自台灣的民眾、甚至多過

  日本人，現場2000多位信眾還齊聲高喊「達賴喇嘛再來台灣」，讓他相當感動。


  日本導演光石富士朗遠赴印度拍攝的「達賴喇嘛14世」裡，達賴喇嘛輕鬆親切面對鏡頭喝

  茶、日課、甚至刷牙，笑說自己既非活佛、也非惡魔，只是平凡僧侶，不斷強調慈悲心的

  重要，即使許多問題以「不知道」回答，但也暗示只有身在其中的發問者最知道答案。




  --'
