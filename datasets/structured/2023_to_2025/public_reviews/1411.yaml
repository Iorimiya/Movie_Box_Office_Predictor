url: https://www.ptt.cc/bbs/movie/M.1441856161.A.8C1.html
title: '[新聞] 《達賴喇嘛14世》登台上映　大爆61年前'
content: '《達賴喇嘛14世》登台上映　大爆61年前毛澤東秘辛


  2015年09月10日 01:24 記者李湘文／台北報導


  日本導演光石富士朗遠赴印度拍攝的記錄電影《達賴喇嘛14世：西藏大哉問》，今年夏天

  在日本上映，吸引眾多民眾到戲院排隊欣賞，幾乎場場爆滿。電影中，有多段鏡頭拍攝到

  極其敏感、一度被視為「西藏獨立」標誌的「雪山獅子旗」，而達賴喇嘛還大爆毛澤東祕

  辛，呈現種種敏感社會話題。


  達賴喇嘛訪問日本時，看見有人高舉「雪山獅子旗」歡迎，還上前開玩笑說「這可是非法

  旗幟喔，你加入西藏分離運動了！」惹得全場哄堂大笑。但話鋒一轉，他回憶起61年前曾

  跟毛澤東和其他中共官員會晤，對方允諾讓「雪山獅子旗」留在西藏作號幟，沒想到今日

  大陸官員反倒認為它是藏獨標誌，總是懲罰、打壓這面旗幟。


  達賴喇嘛認真地對歡迎民眾說：「下次若有中國人跟你抗議，你大可跟他說，你們的最高

  領袖毛澤東主席，曾允諾我們使用這面旗。」為避免未來「達賴喇嘛15世」遭到如同「班

  禪喇嘛」的狀況，他可能也將終止已實行600多年的「達賴喇嘛轉世」。


  達賴喇嘛訪問日本，就在行程快結束時，意外遇見了一群西藏交換學生，特別趨向前跟她

  們握手致意，沒想到對方看見尊者上前，竟全都按禮俗蹲下身來，他特別要這群學生別蹲

  ，希望她們永遠以身為西藏人為榮。就在他要離去時，突然發現其中一個西藏女孩頭髮染

  成紫色，「妳在哪染頭髮的？在日本還是印度？」把女孩嚇得說不出話來，但他隨即說：

  「頭髮染成紫色、紅色都無所謂，只要擁有藏人的善心就夠了。」讓聽到的人都非常感動

  。《達賴喇嘛14世：西藏大哉問》將於9月11日在台上映。




  --'
