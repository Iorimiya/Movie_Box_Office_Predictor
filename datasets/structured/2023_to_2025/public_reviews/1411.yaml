title: '[好無雷] "達賴喇嘛遇見屠圖主教"無雷心得'
content: "近期一系列達賴喇嘛相關主題的電影: \"達賴的一生\"跟\"達賴喇嘛：大腦科學\"跟這部\n\"達賴喇嘛遇見屠圖主教\"，雖然各有各的可看之處，但相較於\"\
  大腦科學\"的資訊量龐大及\n\"達賴的一生\"較為主觀，這部電影是對此系列有興趣的朋友相對好入門的電影，並且片中\n也詳細描述了兩位宗教領袖的生平，可以在看完之後，再更詳細的去選擇\"\
  大腦科學\"補足\n片中提到的快樂科學理論，或者看\"達賴的一生\"了解更詳細的達賴生平。\n\n    兩個諾貝爾和平獎得主會面的對話，產出了\"最後一次相遇，我們只談喜悅\"\
  這本書，\n而這部電影則是詳細的紀錄了此次見面的過程，很可愛的是一切起源只是達賴喇嘛想幫好\n友屠圖主教過80歲生日，結果被政治壓迫不能成行，所以壽星就自己飛過去印度找他了，\n\
  由此也可以看出兩人真誠的友誼。\n\n    友誼的深淺有時候無關時間，有相同理念的人總是容易一見如故，片中兩位宗教領袖\n碰撞出了彼此的初心，兩個充滿智慧的的偉人瞬間變成了兩個搗蛋不正經的孩子，因為在\n\
  朋友面前他們更能呈現真實的自我，不同國籍跟宗教的背景讓他們看似有很大的差異，但\n卻有許多相似的成長過程及磨難，讓他們能夠彼此理解，看到他們在電影裡不自覺握過幾\n\
  百次的手，完全能感受他們心靈的貼近。\n\n    宗教的本意是勸人向善，兩位宗教領袖分享著彼此迴異的宗教理念，但在對於快樂的\n見解上卻是出奇的一至，快樂是需要學習的也是是一種技能，這個在\"\
  大腦科學\"裡就有提\n到過，但在本部電影裡，兩位主教則是利用自身的經驗跟所有人分享，他們是如何把自身\n苦難轉換成快樂及慈悲，進而去行善幫助他人，還有一些很有趣的國情跟宗教差異交流，\n\
  看著屠圖主教一直在害達賴喇嘛破戒也是會跟著笑的很開心。\n\n    \"達賴喇嘛遇見屠圖主教\"是一部看完心情會很輕鬆，有一點點鼻酸感動，但同時又會\n覺得心靈有學習成長的電影，推薦給大家，尤其是覺得自己不快樂的人，看完或許會有新\n\
  的醒悟。\n\n--"
