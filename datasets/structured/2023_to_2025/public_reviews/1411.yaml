title: '[好無雷] 《達賴喇嘛：大腦故事》無雷心得'
content: "本來以為這部紀錄片的主軸會放在達賴喇嘛身上，但這部電影的重點其實是完全環繞\n在心靈健康在宗教及科學的課題上，達賴喇嘛給我之前的印象是覺得他很有智慧，但在這\n\
  部紀錄片裡我還看到了他的遠見跟慈悲，藉由他的發起串連，有一群人利用宗教結合科學\n的力量，默默的已經花了30幾年時間在為全世界人的心理健康在做努力，這些人來自地球\n\
  四面八方，有不同的背景跟專業領域，卻為了一個共同的理念集結在一起，真的讓人覺得\n很了不起。\n\n    看完這部紀錄片很像是上完一堂課，他的模式也的確很適合在課堂中播放給學生觀看\n\
  ，專業的部分偏多，我是醫療相關背景都覺得資訊量很大，會讓你很想按暫停鍵停下來抄\n筆記，幸好配樂搭配很輕鬆讓人不會覺得很燒腦，片中也拋出了很多新穎觀點，像是“幸\n\
  福感是需要練習的”以及“同情心和同理心對人體的差異”“轉念對身體造成的科學影響\n”，心得寫得好像宗教推廣片，但真的是學到了很多，覺得這部片的格局競爭明年奧斯卡\n\
  最佳紀錄片很有機會，推薦給對生活感到壓力或對心靈健康議題有興趣的你。\n\n--"
