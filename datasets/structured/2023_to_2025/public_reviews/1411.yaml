url: https://www.ptt.cc/bbs/movie/M.1215159976.A.029.html
title: '[影評] 無以名狀的遠方 ──《達賴喇嘛十問》'
content: '放映周報  文 / 王舜薇



  遠方


  曾幾何時，圖博（Tibet）變成人人嚮往的化外仙境，旅遊書中這樣形容：與世無爭、民

  風純樸、虔誠神秘。遠方的概念，包圍著遠方之外的人們。


  美國導演瑞克雷（Rick Ray）接受製片公司委託，到印度拍攝一部旅遊紀錄片，沒有任何

  酬勞，唯一好處是有機會面對面訪問達賴喇嘛，結果卻發現根本沒有安排會面這回事，他

  必須自己想辦法跟達賴見上一面。光是這個過程就饒富趣味，讓人嗅到了「旅行」的血液

  。瑞克於是變成一個興奮過度的粉絲，迫不及待要見到偶像，又聽說達賴討厭笨蛋，因此

  非常認真地做功課，好像出發旅行前熟讀各種攻略指南，使得我們一不小心就看了半部國

  家地理頻道節目。


  不過，大概少有人會認為國家地理頻道不好看。瑞克非常用功：優美的圖博取景、大量珍

  貴的歷史影像，包括達賴喇嘛幼年登基、與毛澤東會面、中共全面入侵圖博、大肆燒殺擄

  掠、達賴被迫流亡印度等，清楚交代了圖博的歷史和苦難，但其中最令人印象深刻的片段

  ，卻是達賴年輕時充滿好奇心，走到哪兒都帶著攝影機到處拍攝的模樣，超可愛。


  瑞克在影片中的旁白口吻溫柔而小心，似乎害怕自己過於輕佻，而顯得政治不正確。對於

  他和世界上許多人而言，圖博是無以名狀的「遠方」，如何描繪遠方的輪廓，是一個旅行

  者的難題，於是在見到達賴之前，瑞克整整用了三個月時間斟酌要問的題目，戰戰兢兢完

  成任務，也訪問了達賴的貼身秘書，中規中矩地剪完這部紀錄片。


  瑞克雷的姿態告訴我們什麼？面對像達賴喇嘛這樣的一個人、像圖博這樣一個地方，我們

  似乎無法問「好」一個問題，只能在表面徘徊，無法進入事物的真正核心，從而我們發現

  ：所謂「關心」別人，不過就是把他人當成觀照自己、反省自己的一個參考座標，這不就

  跟現代意義下的「旅行」產生一種互文的趣味嗎？


  最近有越來越多的人，其中有公務員和大老闆，不停講著他們放下日理萬機的生活，跑去

  某個「遠方」旅行，然後找回了自我的故事，某種圍繞著旅行的教條於焉誕生。借用歌手

  李歐那孔恩（Leonard Cohen）的話：「我要對著教條微笑，但是誓死反對它」。



  達賴


  在流亡政府所在的達蘭薩拉（Daramsala），達賴是一個平凡的僧侶，他自稱「難民」，

  閒暇時喜歡鑽研宗教與科學，當兩者發生衝突時，「將傾向科學」。美國人喜歡他，是因

  為要對抗中共；諾貝爾獎頒發和平獎給他，也是基於一種在現代社會相當矛盾的價值──

  「和平」。


  事實上，達賴比較像是一位親切的老朋友，說著時常不合文法的英文，咧著嘴呵呵笑，讓

  人想跟他閒話家常，而不是問一些正經八百的問題。他討厭笨蛋，我就很想隨便跟他哈拉

  ，比如無聊的時候都在做些什麼，既然打發無聊已經成為我們這個時代的一項重要課題。


  三年前台北「西藏影展」放映的紀錄片「我們還剩下什麼」（What remains for us），

  講述一個藏族流亡女孩冒著生命危險，將一部內容為達賴喇嘛談話的影片偷偷帶入圖博地

  區，挨家挨戶放給藏民看，試圖讓他們知道達賴要傳達的訊息，見聞者無不激動流淚。記

  得那次電影映後，有觀眾問這位藏族女孩，受迫害者必須為了自己的權益站出來抗爭，那

  藏人呢？她說：「他們已經受盡苦難，不應該再由他們來承擔」。


  我想到瑞克在片中問達賴，若他不是圖博領袖，最想過什麼樣的生活？達賴說，「想當一

  隻受傷的獸，在某個靜僻之處安靜沈思」。走過了苦難，達賴變成了一個真正的旅人，當

  世界為了北京奧運和人權議題嘶吼時，圖博人仍然有權利選擇以遠方的達賴為圓心，繼續

  原有的生活。




  --'
