title: '[好雷] 偉大的十四世：達賴喇嘛'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  現年88歲的達賴喇嘛尊者，不但因其提倡和平的主張榮獲諾貝爾和平獎，也是西藏政治與

  宗教的象徵，更是藏傳佛教的最高領袖。不論認不認同達賴喇嘛的政治與宗教立場，能夠

  有一部紀錄片從尊者兩歲被認定為轉世靈童，一直記錄到拍攝當下，都是歷史、世界乃至

  於影史非常珍貴的寶藏。



  達賴喇嘛尊者親自口述的電影，公開他的個人、政治、精神與歷史事件始末。



  電影以達賴喇嘛為主題與敘述者，提供給觀影者一個獨特的親密關係，讓人可以了解他的

  人生故事與個人哲學的看法。值得一提的是，電影裡出現不少極為珍貴的影像：尊者合影

  的十六世噶瑪巴法王、兩位薩迦貢瑪法王、頂果欽哲仁波欽大德。而留下的倖存者，無一

  例外地遭遇殺劫之難，本片能夠見到達賴喇嘛尊者與這些法王合體的珍貴影像畫面。



  從童年到成年，在追求民主的過程中，達賴喇嘛的生活複雜性非凡及其前所未有的洞察力

  。這是一個歷史悠久的故事，揭示簡樸僧侶的靈魂深處，展示出權力的真實本質與人性的

  高貴。



  「我這一生有三大使命。」



  尊者在紀錄片裡闡述自己這一世的三大使命：全人類的福祉、宗教和平與西藏問題。為使

  全人類獲得幸福，達賴喇嘛尊者出外分享或演講時，都從哲學或世間道德的角度出發，而

  非宗教，這樣其他派別甚至無神論者才能獲得同樣的體會。這些世間道德包括利他與慈悲

  ，這也是為什麼達賴喇嘛稱自己為馬克思主義者的原因之一，他認為資本主義只把眼光放

  在利益與前財，反而丟失人與人之間最寶貴的相知相惜。



  尊重其他派別與宗教是尊者最值得尊敬的原因之一，很多宗教領袖要不批評其他派別，就

  是積極傳教。但對達賴喇嘛尊者來說，世間所有的宗教都是勸人為善、以愛為本，若有偏

  激或極端信徒，他肯定是由於那些人沒有好好研讀宗教的本質。紀錄片也收錄許多達賴喇

  嘛以與談人身分出席世界宗教論壇或研討會的畫面，他也透過親身與不同宗教領袖間互動

  來表達自己推崇宗教和平的信念。雖說身體仍舊硬朗，尊者也深知自己來日無多，並笑稱

  「如果有天堂，可能自己會到天堂。」倘若轉世，他則會繼續以自己微小的力量繼續為世

  界盡點心力。



  最後的西藏問題，達賴喇嘛尊者認為自己在2011年從政治角色「退休」後，就已經卸下這

  項使命。所以，現在的他全心全意推動前兩項使命，西藏問題交由未來的西藏人自己決定

  。一方面也是因為過去中國領導人曾經說過，西藏問題只握在一個人手上，等他消失就再

  也沒有問題了。不過，達賴喇嘛逃亡都已經超過一甲子，西藏問題仍然存在，即便他沒有

  將政治權力交付出去，相信這個關乎民族、國家與文化的問題也不會這麼容易就解決。



  《偉大的十四世：達賴喇嘛》作為史上第一部由尊者親自口述的紀錄片，固然意義非凡，

  但同樣地，也失去其平衡報導的機會。除了過去達賴喇嘛尊者與性別歧視或性騷擾相關的

  醜聞不可能出現之外，就連從其他人的眼裡看達賴喇嘛的角度也完全沒有納入。即使是從

  信眾或藏人的角度褒揚尊者都多多少少可以提供一些第三方，甚至只是「第二方」的意見

  。畢竟目前看到的《偉大的十四世：達賴喇嘛》完全是由他本人的口吻來述說過去種種，

  稍嫌可惜。



  但是，也由於本片是由達賴喇嘛尊者本人授權的團隊拍攝而成，電影收錄不少年代久遠且

  過去從未曝光的珍貴影片。觀眾不僅可以在聽達賴喇嘛口述的同時搭配畫面，還能一睹尊

  者年輕時清秀斯文的樣貌。這些影像包括年幼的達賴喇嘛尊者坐床前後的片段，以及隨著

  年齡增長，他慢慢接受佛學薰陶與教育，開始承擔政治與宗教責任的畫面，就連比較輕鬆

  的生活或玩樂影像也有，就像達賴喇嘛本人所說，他是一位沒有距離的尊者，透過這些珍

  貴的片段，的確讓人更貼近達賴喇嘛尊者。



  從第五世的達賴喇嘛開始，因為當時局勢所逼，尊者就此成為政教合一的領袖。但第十四

  世的達賴喇嘛尊者居然能夠在2011年宣布自己從流亡政府中「退休」，不只結束自己的政

  治生涯，也終結長達400多年達賴喇嘛政教合一的制度。光是這點，就足以證明第十四世

  尊者的偉大。雖說達賴喇嘛尊者自稱是馬克思主義者，但這與他崇尚民主的心並不衝突，

  他認為自己從中國逃亡的前幾年都必須假裝，表現行事都相當虛偽，但抵達印度後，他終

  於可以放心做自己，這也讓他得以遊歷世界，除了增廣見聞之外，也持續致力於推廣自己

  的三大使命。



  「宗教是毒藥。」



  達賴喇嘛說自己年輕的時候曾經與毛澤東建立不算太差的關係，但或許也由於信任，有一

  天毛澤東突然跟他說「宗教是毒藥。」他才警覺局勢正在改變。即便尊者至今仍稱毛澤東

  為偉大的領導者，但他在談論西藏的政治改革時也提到，權力掌握在一人或少數人手裡必

  會出事。當年，中國邀請達賴喇嘛尊者前往看戲，卻不讓西藏護衛隨行，眾人便包圍夏宮

  ，勸阻時年24歲的達賴喇嘛赴約，後來流亡藏人便將3月10日訂為西藏人民起義日。



  正因為尊者十分尊重其他派別與宗教，他對於自己離世後是否轉世並不是那麼在意，也曾

  多次改變自己的說法，倒是篤信無神論的中國比他還在乎下一世的達賴喇嘛尊者身在何處

  。中國甚至有《藏傳佛教活佛轉世管理辦法》，規定轉世行為要獲得政府批准，而早已流

  亡超過一甲子的達賴喇嘛稱自己要不中止轉世，要不在印度選擇一位轉世靈童，但中國肯

  定會自己另外「欽點」一位，形成非常矛盾的景象。



  過去，談論尊者的死對藏人來說是一種禁忌，但隨著第十四世的年紀越來越長，不光是他

  自己，藏人也開始思考下一任的宗教領袖。從五歲坐床以來，成為達賴喇嘛尊者已83載，

  是在世最久的達賴喇嘛，也是歷經流亡、政治動盪，卻依舊保持樂觀，持續在世界完成自

  己三大使命，甚至放下政治權力的尊者，第十四世絕對是偉大又與眾不同的一位達賴喇嘛

  尊者。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
