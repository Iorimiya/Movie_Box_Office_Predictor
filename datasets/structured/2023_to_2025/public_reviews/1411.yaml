url: https://www.ptt.cc/bbs/movie/M.1446054738.A.45B.html
title: 'Re: [好雷] 達賴喇嘛14世：西藏大哉問'
content: '達賴喇嘛14世：西藏大哉問 The Dalai Lama, The 14th：The World Champion Of Peace

  我原本不知道有農奴制的，也沒在意過喇嘛教和藏傳佛教有何不同

  感謝樓上兩位噓文的大大讓我找了一天的資料



  喇嘛教（德語：Lamaismus；英語：lamaism）是對藏傳佛教的一個民間稱呼。喇嘛教這個

  稱呼在藏語中和學術界被廣泛認為是一個輕蔑語或貶義詞（即暗示這種宗教是喇嘛揑造，

  而非傳承於佛教）[1][2]，中國或相關當局打算棄用這一詞，「目前多採用藏傳佛教代稱

  喇嘛教」[3]。


  看起來用藏傳佛教來稱呼是戳到一些人的痛點了


  再來看農奴制度


  其實這樣的稱呼也是極有爭議的，主要還是因為中國共產黨用來美化1960年入侵西藏

  就是打著解放農奴的正義大旗

  但是後來多方研究和平衡的解釋，是把他歸類在封建制度或是印度的種姓制度

  而且很多文字資料都被中國共產黨毀掉了

  現在那一套是中國共產黨所對外宣稱的

  而且西藏人常常的抗議，自焚再再的顯示，似乎它們沒有很開心自己被解放?


  至於佛教的分支我也稍微查了一下


  看起來分支眾多，但是藏傳佛教無疑是目前傳承相對比較古老的一支


  --'
