url: https://www.ptt.cc/bbs/movie/M.1443237940.A.44C.html
title: '[好雷] 達賴喇嘛14世-西藏大哉問'
content: "這部片的導演真的很用心，\n\n雖然一開始看的時候有點不知所以然，但後來真的是漸入佳境。\n\n整部片完，內心仍然餘波盪漾，很想要做些什麼事。\n\
  \n\n-----------------------以下為防雷頁----------------------------\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n------------------------------------------------------------------\n\
  \n這部片是由一位日本導演所拍攝的，全片都是日語旁白，\n\n日本年輕人普遍的價值觀其實與台灣年輕人普遍的價值觀十分相似，\n\n不想長大、不知道自己為什麼要讀書、也不知道出社會要做什麼，對前途一片茫然，\n\
  \n樣的價值觀到底是出了什麼問題？\n\n\n在這部片當中，透過訪談日本年輕人及西藏流亡政府所建立學校的年輕人，\n\n深刻的表現出兩邊文化與價值觀的差異，\n\
  \n只關心自己周遭的父母，教育出來的孩子不知道自己未來想做什麼，\n\n反觀流亡政府所建立的學校，許多孩子都沒有父母，與沒有血緣關係的人彼此照顧，\n\n卻培養出具有慈悲心與都對人生有著熱切的盼望的青年。\n\
  \n\n另外一幕，\n\n當達賴喇嘛對來到日本，看到來日本讀書的年輕藏民們時，\n\n達賴告訴他們藏族的佛教文化非常特別，是世界的重要寶藏，要對自己的文化有信心、\n\
  \n要做個有自信的人、不要仇恨中國的時候，\n\n年輕藏民們的眼淚流個不停，我的眼淚也流了下來，\n\n是啊...放下仇恨才能夠走向更寬廣的路，\n\n\n慈悲心從小就必須培養，無論是對自己人、或是敵人，\n\
  \n只有內心保持和平，才能夠真正營造出和平的關係，一切都從自己內在開始。\n\n而對於萬物的愛惜，對於自身傳統文化的瞭解與認同，將有助於找到生命的意義。\n\n\
  \n有人問，什麼是暴力？\n\n達賴喇嘛說：\n\n「只要你的出發心是來自於仇恨、怨懟、憤怒、貪婪等負面情緒，就是一種暴力，\n\n  即使你表現出來的行為或說出來的言語看似善的，它的本質仍是暴力，暴力雖然\n\
  \n  看似可以解決一些眼前的問題，卻會製造出更多的問題。」\n\n\n有人說，談論因果業報是為了逃避現實，\n\n但事實卻是，瞭解因果業報的法則之後，才能找到問題最根本的原因，\n\
  \n因為它讓人從內在去反省，每個念頭、每種行為都是一個因，\n\n你今天種下的是什麼因，未來就會得到什麼果。\n\n你過去、前世種下什麼因，你今世、現在受的就是什麼果，\n\
  \n唯一的解脫之道，就是接受現在的狀況，\n\n並且避免再種下這樣的因。\n\n\n總之，是一部相當讓人省思再三及值得推薦的好紀錄片。\n\n\n\n--"
