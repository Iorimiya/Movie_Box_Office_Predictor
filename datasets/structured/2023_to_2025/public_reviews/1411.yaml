title: '[新聞] 世界民族電影節 紀錄片夢迴西藏揭達賴喇嘛流亡路'
content: '世界民族電影節 紀錄片夢迴西藏揭達賴喇嘛流亡路


  2022/8/20 15:48（8/20 16:01 更新）



  紀錄片「夢迴西藏：軍官與達賴喇嘛」揭露第14世達賴喇嘛（圖）出走西藏及流亡印度期

  間事件，片中也拍下達賴喇嘛親口談到與已故印度軍官哈曼德辛格之間的故事。（海鵬影

  業提供）中央社記者王心妤傳真 111年8月20日


  （中央社記者王心妤台北20日電）世界民族電影節9月將登場，由蒙古片「愛是一本書」

  開幕，也將放映第14世達賴喇嘛流亡過程「夢迴西藏：軍官與達賴喇嘛」紀錄片及台灣女

  婿巴沃邱寧多傑掌鏡的「嘿嗎嘿嗎」。


  文化部蒙藏文化中心主辦的世界民族電影節，今年將播映17部電影，並分為「名門望族－

  民族大觀」、「新心相印－印太亞洲」、「大敵當前－世界局勢」及「薪火燎原－民族新

  勢力」等4大主題片單。


  承辦單位海鵬影業表示，開幕片「愛是一本書」是蒙古獨立電影導演甘奧其爾恩貝什（

  Gan-Ochir Enebish）首部劇情長片，改編蒙古作家巴森（Naminchimed Baasan）的著作

  「男孩與書」。


  全片藉由一對蒙古年輕人的成長與愛情，看見蒙古1990年和平革命後，面臨文化與教育的

  轉變。「愛是一本書」不依賴草原與戈壁風光，聚焦蒙古社會，帶領觀眾重新審視知識與

  文化的價值與真摯的情感。


  紀錄片「夢迴西藏：軍官與達賴喇嘛」揭露第14世達賴喇嘛出走西藏及流亡印度期間的事

  件。全片改編自英國作家拉妮辛格（Rani Singh）的著作「軍官與尊者」。片中也拍下達

  賴喇嘛親口談到已故印度軍官哈曼德辛格（Har Mander Singh）之間的故事。


  「夢迴西藏」片中運用藏人動畫藝術、西藏書法、藏傳佛教音樂及珍貴的歷史照片推展故

  事，並由「唐頓莊園」英國男星休博內威利（Hugh Bonneville）獻聲講述。


  另外還有泰雅族電影「只要我長大」、客語片「一八九五」，以及「不丹是教室」的台灣

  女婿導演巴沃邱寧多傑（Pawo Choyning Dorji）所掌鏡攝影，一窺喜馬拉雅山祕密森林

  儀式的尼泊爾電影「嘿嗎嘿嗎」。


  2022世界民族電影節將於9月16日至25日在台北、新北、台中、高雄4地同步開展。（編輯

  ：陳政偉）1110820



  --'
