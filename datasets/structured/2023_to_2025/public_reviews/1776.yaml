url: https://www.ptt.cc/bbs/movie/M.1639224989.A.82A.html
title: '[包場] 2gether the movie包場及首映資訊'
content: '泰國耽美劇2gether<<只因我們天生一對>>的電影終於要在台灣上映了！！


  正式上映日期為12/24，威視在12/20有搶先場(臉書資訊)




  北中南都有粉絲自己辦的包場，希望有興趣的朋友可以參考一下，

  北部三場都已收團(人多真好QQ)，中南部還有名額哦！


  台中-1/1大魯閣新時代(主辦有準備各種小禮物哦！)



  台南-12/26focus威秀影城(已關表單但有意願仍可聯絡主辦方)



  高雄-12/30三多大遠百威秀影城(流團Q_Q


  高雄-12/25高雄遠百威秀影城



  台北-1/8三站聯合(新增)





  因為2gether the movie主要還是由電視劇舊片段加新片段，

  所以沒看過電視劇也可以看得懂的，這個可以放心！！


  而且，2gether系列走清水向，最大的尺度就是親親而已(嘆氣)

  所以也不會看了會害羞之類的，重點是主演Bright和Win很帥(我是BWs)


  2gether the movie在日本已上映超過半年，在香港也是場場滿座

  身為一個BWs，我也希望2gether the movie在台灣的票房可以很好，

  所以整理出各地包場資訊，希望沒有違反板規(雙手合十


  ps台中場我會去，有關台中場的問題都可以詢問我哦！！


  --


  寶寶ig是什麼？？也是電影嗎？抱歉，我很少看ig @@


  畢竟是移動的羅浮宮啊wwww



  加入會員用儲值買會比較便宜一點點(340+20手續費)，沒有爆米花，

  但有兩個帥哥的扇子，也有很多粉絲會去送應援的！！'
