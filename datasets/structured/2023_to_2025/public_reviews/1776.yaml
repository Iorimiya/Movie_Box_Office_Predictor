content: "《聖☆哥傳 THE MOVIE～HOLYMEN VS 惡魔軍團～》藤原龍也將飾演墮天使路西法\n\n\n\n以中村光的漫畫為原著改編，預定 12\
  \ 月 20 日在日本上映的真人版電影《聖☆哥傳\n THE MOVIE～HOLYMEN VS 惡魔軍團～》，官方宣布墮天使路西法將由藤原龍也詮釋演出\n的消息。\n\
  \n\n\n《聖☆哥傳》故事描述佛陀與耶穌這兩位宗教始祖，在安然度過世紀末的危機之後，來到\n人間世界渡假。兩個人在日本東京的立川合租一間便宜的公寓，過著悠閒的渡假生活。但\n\
  沒想到佛陀非常注重金錢，小器得像個大嬸，而不熟悉東方文化的耶穌，則是覺得日本的\n一切都很新鮮，常常一時衝動買下東西。這兩個個性迥異的聖人，就這樣在人間世界開始\n\
  過起有趣的生活……\n\n　　由藤原龍也飾演的墮天使路西法，是天使長米迦勒的哥哥。過去做為天使長的他，因\n為與弟弟吵架落敗因此墮入地獄成為墮天使。而隨著藤原龍也飾演的消息公開，觀眾也可\n\
  以先藉由官方釋出的短片一窺角色魅力所在。\n\n\n\n--"
