title: '[普雷] THE LAST NARUTO THE MOVIE'
content: '標題雖然打THE LAST，但根本就不是最後一部XDD

  電影結束後已經預告明年八月要出新的電影版，

  而且似乎是由鳴人的兒子主演...。



















  -------------------------------------------------


  劇情的時間點是在鳴人跟左助幹架完兩年後到當上火影前發生的事件。

  但這次的敵人不是要毀滅木葉而是要毀滅全世界XD


  主線劇情沒什麼好說的，基本上還蠻公式化的。

  整部電影最大的賣點要算是支線的鳴人跟雛田的感情戲啊～～～

  雖然整體演出還蠻薄弱的...，但看到最後有情人終成眷屬還是蠻開心的...。


  總之，這部劇場版可以說是為了幫雛田扶正而產生的作品XDDD







  --'
