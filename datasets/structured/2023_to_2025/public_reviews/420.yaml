content: '首次約會竟變成一場惡夢 手機不斷收到陌生訊息 究竟是誰搞的鬼?


  【忌日快樂】導演+布倫屋製片公司 最新驚悚力作


  【無線殺機】精彩預告：

  4月11日 揪出真兇 戲院見


  參加抽獎方式：留言回答你想要搶先看【無線殺機】原因 並註明場次就有機會中獎

  （如：）



  特映會場次（一人得獎兩人同行）

  中午場 4月8日 11:30 MUVIE CINEMAS

  台北場 4月9日 19:30 喜樂時代影城西門店

  台中場 4月9日 19:00 台中站前秀泰影城

  高雄場 4月9日 19:30 高雄SKM PARK國賓影城


  公布得獎日期：3月24日公布得獎名單於回文內,得獎者請於3月26日前主動私訊回覆得獎

  者資料,恕不接受逾期回覆





  --'
