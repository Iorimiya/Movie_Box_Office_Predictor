url: https://www.ptt.cc/bbs/movie/M.1744356683.A.F17.html
title: '[好微雷] 無線殺機:不是哀鳳的負面宣傳'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看到預告第一個聯想到的是哀鳳的無線分享，不過其實一開始就揭曉女主用的不是哀鳳

  不知道是不是收到蘋果法務部的黑函哈哈


  無線殺機是「忌日快樂」系列導演克里斯多夫蘭登執導的為新作品，講述女主角在

  一次約會過程被無線分享訊息，威脅如果不照指示去做就做掉她的家人


  如同這位導演過去的作品，圍繞著浪漫愛情和懸疑驚悚的主題總是不會讓人失望的

  反派一開始真的神通廣大，全片一開始好像是柯南那種嫌疑人一二三號那種懸疑片

  無線分享意味著反派範圍限縮在餐廳之內，乍看之下抓人好像很簡單，實際上卻是

  毫無頭緒，最後破案的方式也是來的又快又令人無法準備，所以其實這部不是抽絲剝繭的

  偵探懸疑片，而是女主角單方面被反派虐，最後反派再莫名的落敗，甚至最後來一個

  蠻長的戰鬥爽，對比隔壁的復仇反擊戰幾乎沒打戲，可以說是很鮮明的對比

  是說反派槍法真的爛，超近距離開槍也殺不死人


  最近原創的好片真的不多了，大製作更是沒機會，頂多像是無痛先生這樣的規模吧，大家

  可以去支持一下


  --'
