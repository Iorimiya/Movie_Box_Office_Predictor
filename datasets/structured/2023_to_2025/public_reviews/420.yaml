url: https://www.ptt.cc/bbs/movie/M.1744506748.A.7D1.html
title: '[ 負雷]  無線殺機'
content: '預告打著「忌日快樂」導演、噤界製作團隊…


  以為是有一定水準的驚悚片


  但是從頭到電影結束前10分鐘


  劇情真的平鋪直敘超級無聊 充斥一些無意義廢話


  導演一直想著墨於創傷症候群 但也沒有很深入探討


  就只是帶過，然後在餐廳裡面 女主角跟餐廳人員


  包含跟男主角到對話都是一些日常對話可有可無


  然後你說反轉 也沒有 大概都猜的到壞人是誰


  可能比較有趣的就是那個軟體吧


  陌生人可以隨便發訊息給你


  而且從壞人要求女主角做的一些事


  就很明顯知道是因為男主角有蒐集到市長犯罪證據


  所以高層想要毀滅證據跟殺人滅口


  真正精彩也就只有最後那10分鐘


  其他時間真的看到快睡著



  --

  感謝提醒 已更正'
