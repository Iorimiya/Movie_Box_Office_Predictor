url: https://www.ptt.cc/bbs/movie/M.1744121850.A.719.html
title: '[討論] 【無線殺機】新預告'
content: '【無線殺機】誰是鬼篇




  曾獲艾美獎提名，並以熱門影集【白蓮花大飯店】和【模範愛侶】爆紅的女演員梅根費伊

  飾演薇莉，她是一名多年來第一次約會的寡婦和單親媽媽，她來到約會地點的一家高級餐

  廳之後，就因為她的約會對象亨利（【到我們為止】布蘭登斯克勒納 飾）比她預期中更

  有魅力和更帥氣感到非常高興。但是隨著一連串的匿名訊息開始陸續傳送到她的手機，薇

  莉就從一開始的煩躁逐漸陷入恐懼，而這兩人之間原本擦出的火花也開始冷卻下來。


  後來她收到指示不准把這件事告訴任何人，而且必須遵守匿名訊息的指令，否則她透過手

  機上的家用監視器看到的帽T神祕人物就會殺死薇莉年幼的兒子以及正在當他保姆的薇莉

  的姐姐。薇莉必須完全按照指令行動，否則她所愛的每個人都會死去，而一直在無形中折

  磨她的神秘人物最後的指令又是什麼？殺死亨利。


  --'
