title: '[好雷]龍與地下城：盜賊榮耀 '
content: '雷文防雷資訊頁



  一開始進電影院前還很擔心134分鐘會不會太久


  很怕中間看到睡著


  影廳明明是首日(扣掉口碑場)卻坐不滿


  電影前完全沒有置入廣告，只有預告片和電影院自己的宣傳


  看完後真的覺得為什麼會坐不滿啊XDD


  原本以為電影是骰塔的附贈品，看完覺得完全值回票價


  就算沒興趣進電影院，也很推薦之後上串流可以花時間好好看



  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  這部真的是好好說好一個故事的典範


  所有伏筆都有回收，劇情王道但張力足夠，沒有驚人的反轉，一切發展合情合理邏輯順暢


  小細節與人物塑造就不多提了，處理得恰到好處，


  節奏很緊湊，結構簡單扼要就是一路找夥伴找武器打魔王的故事


  但是演員表現極佳，角色塑造很鮮明，讓觀眾能很快喜歡上


  覺得這真的不是一件容易的事




  身為一個TRPG玩家(擔任GM的時間比較多)，看到很多橋段都會忍不住心想


  「啊，這裡應該是部分檢定成功」


  像是主角把布扔到石頭地龍（不太確定那隻石像有沒有名字）身上


  本來以為成功了，結果GM賞角色一個回馬槍




  中間有個片段是橋斷了，主角們試圖找方法過橋


  完全可以感受到場外玩家和GM爭辯過橋的合理手段


  「我有繩子，綁斧頭扔過去（做橋）不行嗎？」


  「岩石太堅硬了，刺不進去」


  這裡完全就是跑團時會出現的盤外風景啊


  看到手杖變成來回杖


  就覺得是GM窮途末路，查看角色卡的道具欄，裝作回收伏筆，實際上是臨場發揮XD



  整部片真的是超級愉快的冒險者團錄，玩家的骰子失敗的時機都太美妙了


  失敗和出乎預料的大成功正是TRPG好玩的地方XD




  就算沒玩過TRPG，我覺得這部也非常適合喜歡西方奇幻冒險故事的人看


  作為一部喜劇，這部真的拍很棒，扣掉開頭前幾分鐘，完全沒有冷場的地方


  版上有很多文章有寫到這部的優點，這邊就不多說了


  總之推薦給喜歡TRPG和不知道TRPG的人，相信觀影體驗會非常愉快!



  --'
