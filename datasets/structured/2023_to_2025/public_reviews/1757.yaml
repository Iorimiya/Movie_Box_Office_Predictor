url: https://www.ptt.cc/bbs/movie/M.1681016849.A.BC8.html
title: '[好雷] 看得很舒爽的 龍與地下城:盜賊榮耀'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  基本上我不算DND跑團咖


  但對TRPG有點興趣也會看相關的疑問


  遊戲只玩過柏德之門1，大概知道崔斯特是誰這種程度


  而自認奇幻宅的我


  魔戒跟哈利波特都不太看


  魔戒身為奇幻經典無庸置疑，但畢竟不是DND血統，多少還是會有點微妙


  而哈利波特....很多奇幻要素真的都覺得太「軟性」或是只擦到邊





  龍與地下城:盜賊榮耀 這部我真的是看得很舒服


  沒有什麼可以挑毛病的奇幻世界


  尤其看到那隻肥龍，真心爽快



  現代的龍通常都走稍微細長的風格 (像是MH的多數古龍種)


  要不然就是偏蠢的肥龍


  但DND的經典龍感覺就是要像這樣即便又肥又大，但就是充滿強度與威脅感





  而劇中人物的造型跟人設我認為真的是近乎完美



  克里斯潘恩身材算是好萊屋男星較為中等的 (沒爆大肌肌)


  但那個臉是真的有帥，深情望著你的時候真的會被吸進去


  完美符合吟遊詩人(?)或是說團隊領導 魅力值點到滿的設定




  演出霍爾嘉的蜜雪兒羅德里奎茲更是超讚的選角


  雖然近幾年連續看了幾部復仇者+雷神系列作品，也慢慢能接受女武神的長相(泰莎湯普森)


  但當時第一眼看到這種深膚色女漢子的角色 通常還是會直覺想到蜜雪兒


  畢竟在惡靈古堡、玩命關頭系列 她的形象真的植入人心


  感覺在此片有刻意再練壯一點 (或是服裝造型)


  一些近戰打擊摔技看起來就是超級爽快!! (雖然不知道是不是武打替身)




  賽門的魯蛇感也很可愛趣味


  最後那個駕馭頭盔那一幕我完全能想像如果在日系動畫會有多熱血




  聖武士贊柯雖然沒有打完全程


  但存在感依然非常強烈，幾幕有夠唯美的守序善良形象 會讓我莫名有點感動(?)




  多莉克演員的時裝造型看起來普普 (有一點點像艾倫佩姬)


  但劇中那個小紅捲髮跟雀斑，太可愛了 就是完全符合古靈精怪這四個字的形象


  好幾幕鏡頭特寫她我完全目不轉睛




  索菲娜也是時裝反而還好


  但電影中完全有那種魅惑人心的美麗女巫師的感覺




  休葛蘭演出的福吉其實也滿讚的


  角色形象就真的不是什麼十惡不赦(即使他燒了木精的森林跟判死很多人)


  終究就是個為了自己私利的小奸小惡之徒


  但其實有幾段他明確表明自己能給克蘿伊良好的照顧環境，多少有點讓人動容




  說真的啦


  這種所謂廣義的"政治正確"的選角，這部就弄得毫無違和


  你不要把一個原本就定位是白人角色的搞成黑人就好


  好的有色人種大家都喜聞樂見





  這部還有一個我覺得對跑團(或是會玩美系自由開放世界RPG)的人會津津樂道的點


  像是


  頭盔是給賽門戴而不是看起來就造型完美符合的贊柯


  手邊剛好就有傳送杖就這麼剛好


  最後用撒金幣把百姓引出競技場


  這些地方可能在純觀眾看來會覺得 「最好這麼剛好啦，齁 亂演」這樣


  但我真的覺得這就是DND的浪漫




  「你永遠不知道隨手撿到的垃圾剛好有什麼妙用、你永遠可以用奇怪的方式去解決任務」




  另外



  我個人玩這種遊戲是真的偏向不殺


  這部的主角團一開始也講了從來不殺人 (還是不亂殺無辜我忘了)


  雖然後來闖王城那邊有個士兵被奧爾嘉抓去撞火爐有燒起來，但看起來是有撲滅


  其實整部看下來的確沒直接殺到什麼無辜之人


  要不然以其他作品的調性，奧爾嘉那個斧頭我看是要大開殺戒





  這部的強度拿捏也很OK


  打的說真的並不是什麼超S級BOSS


  說起來就是一個比較厲害的術士 (姑且不論她放出DND設定的什麼高環法術)


  基本上一群人聯手打贏是完全合理的






  整片說真的流暢又爽


  唯有一處真的有點破壞情緒



  最後霍爾嘉被捅到那幕疑似有點轉場太快，大戰打完才發現 「欸妳怎麼坐在路邊!?」


  而且其實當下我想九成的觀眾都會知道接下來勢必是拿復活符去救她了


  所以那一整幕的感覺就是滿滿尷尬


  在其他作品可能會加個"符咒已經壞掉，但後來用對家人的愛 它就復原了"之類的橋段


  狗血 但至少是個轉折


  不然那時，符咒好好地沒壞，100%不會死的好嗎



  又或者 反正觀眾都知道她絕對不會死


  不如用搞笑一點的方式把她救回 (例如主角抱著她的時候胸口的符咒剛好碰到了就活了





  另外一點小小的意見



  中文翻譯的名稱真的有點太拗口了


  基本上台式翻譯奇幻名稱，通常不會有太多贅字


  (例如魔獸爭霸的阿薩斯，中國翻譯成阿"爾"薩斯)


  這次的主角 埃德金 聽起來就有種不太容易記憶的感覺，可能過一陣子就會忘記


  直接翻成艾金其實就可以 (甚至如果是古早台式可能會翻成阿金XD)


  而霍爾嘉其實那個爾也可以省掉


  不過這對觀影的確沒什麼影響，只是像我現在發文還要開著維基百科對照姓名



  看板上的心得通常也是以職業來稱呼


  (但其實劇中沒什麼明確提到各自的職業)





  最後


  這部畢竟算是「DND世界觀的奇幻電影」，而不是「玩DND(TRPG)的電影」


  所以一些骰骰子判定啦、能力屬性設定啦，甚至職業之類的要素都沒什麼體現



  如果真的要看


  衷心推薦一部跑團神片: The Gamers


  三集我認為都是神中之神 (一二算續集，第三集較為獨立)



  尤其自己比較喜歡玩TCG(集換式卡牌)的，第三集真的看到哭


  除了畫質真的是屎，畢竟十幾年前的作品，還是同人自拍的


  三部在YT都有中文翻譯版本，放這麼久沒被下架應該也沒有什麼版權疑慮了



  真心希望有生之年有電影公司把這三部拿去拍成現代電影版


  什麼都不用改編，完全照著拍，把特效跟演員換成院線主流程度就好了'
