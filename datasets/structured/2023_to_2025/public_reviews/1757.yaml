url: https://www.ptt.cc/bbs/movie/M.1680096460.A.56B.html
title: '[好雷] 盜賊榮耀也太好看了吧'
content: '雖然劇情就如同AD&D的設定一樣


  主角一行人最後打敗大魔王


  也知道是一部冒險片


  但是沒想到片長134分鐘內


  能夠把主角 和 他的歡樂夥伴 背景介紹很ok之外


  也把故事做一個很好的起承轉合


  甚至還能安插一個滿級的聖騎士帥一波

  (抱歉之前看柏杰頓時候沒特別注意他）


  最後也讓女兒出來發揮一下


  美中不足的就是


  希望如果有續集 在地下城的冒險能多一點阿！




  一開始逃獄蠻好笑的 配合結尾又笑了一次


  法師出場用反重力雖然很厲害的樣子 但沒什麼感覺

  （記得應該已經是高級魔法了吧


  多利克的造型和個性莫名的讓人喜歡


  變身逃出城的那段覺得做的還蠻棒的


  聖騎士根本就 突然找了一個SSR角色加入隊伍吧


  地下世界很可惜緊張的地方沒有比預告多太多


  逃出的過程最後竟然只有 露一手就轉場了


  法師做幻影跳針那邊不知道為什麼整個戳中笑點


  運動會的場地設計還蠻炫的


  看到移形怪出場就想到地獄神龍2

  （可以用盜賊撞出皮阿~~~~


  熱氣球發錢那段有某紙房子的感覺


  打物理無效的石像怪要打操控者這段


  真心覺得多莉克好聰明啊~~~


  賽門認真的跟boas決鬥那段也覺得蠻帥的


  然後最愛的就是大家combo 打王


  還致敬了一下某復仇者聯盟






  真心希望有續集



  趁連假再去刷一次好了~




  --






  -----

  Sent from JPTT on my Sony XQ-BC72.


  --'
