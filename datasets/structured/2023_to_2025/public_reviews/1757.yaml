url: https://www.ptt.cc/bbs/movie/M.1680150332.A.2C6.html
title: '[微雷] 【龍與地下城：盜賊榮耀】沒玩過看得懂嗎'
content: '繼怪奇物語又在國外帶起一波龍與地下城風潮，在台灣也因此有越來越多人對這款歷史悠久的桌遊有所耳聞 (我？)，這次【龍與地下城：盜賊榮耀】將桌遊改編從桌面躍身於大螢幕上，雖然預告裡特效和大場景都看起來挺不錯，也有參雜不少幽默笑點，但桌遊菜鳥的身份不免讓我心中產生了一個疑問：「沒玩過龍與地下城、不懂角色和規則的我看得懂這部片嗎？」接下來請大家下滑移步正文揭曉答案！







  ~~~~~~~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~

  首先，我要讚嘆一下這部電影的敘事手法整體運用得當，前後呼應的情節設計、情緒堆疊和笑點安排都發揮了極大的效用；例如開頭主角們的越獄橋段和結局反派相同的越獄場景同時達到了呼應和正邪的對比效果。再來是穩定的基調呈現，為對應龍與地下城中古世紀時空背景，從人物服裝、建築及飲食細節都相當統一無違和感，草原、冰原等大遠景也傳達出其該有的震撼及規模，但因為這還是一款奇幻類型的「遊戲」，一些現實、非現實結合的畫面視覺上也頗有趣。

  我覺得這部片厲害的地方是它將原本段落、篇章式的冒險遊戲串聯成一整個流暢、有起承轉合的完整故事，角色變得更加立體，主角們不再只是遊戲玩家而能讓我們窺探到他們的背景故事、情緒和成長。個人很喜歡贊柯在劇中的幽默表現，在經歷各種冒險前以詼諧語氣說明通關規則的橋段，私心希望贊柯的戲份可以再多一些（笑）。

  總結，這是一部很平易近人且無門檻的好作品。每個冒險、打鬥片段、施展魔法的畫面特效以及音效都做得恰到好處而精緻，整部電影集結了詼諧、幽默、驚悚等多種元素讓觀看者在觀賞同時可以感受到其豐富性和起伏，如果是對這類電影有興趣卻因為和龍與地下城不熟悉而選擇觀望的人，希望以上的一點小見解有幫助到你，也歡迎其他有看過這部的人在底下一起討論～


  -----

  Sent from JPTT on my iPhone


