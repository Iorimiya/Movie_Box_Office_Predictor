title: '[好雷] 《龍與地下城：盜賊榮耀》TRPG再登大螢幕'
content: '出色的改編一手，玩家要的其實不多


  現在只要談到遊戲，腦袋裡往往都是3A大作的電子遊戲，或是速食的手機遊戲與電競。而

  在電子遊戲還未發展成今天龍頭地位的時候，桌上遊戲朋友家人同樂的狀況幾乎是逢年過

  節可以看到的樣模。


  其中又以TRPG（桌上角色扮演），想想一張紙與筆、擲骰判定、DM控場節奏與多元的即時

  玩家互動，一群人共同譜寫奇幻世界的冒險是多麼迷人。


  改編世界上第一款商業桌上角色扮演遊戲《龍與地下城》的作品《龍與地下城：盜賊榮耀

  》，是一個受到許多過去紙上漫遊老玩家好評的改編電影。故事以一群拼裝起來的盜賊團

  ，為了找回丟失的遺物和救出吟遊詩人的女兒，開始一段小人物的史詩冒險，但很不幸的

  他們面對的敵人是過去試圖控制世界，法力高強的紅袍法師。







  《龍與地下城：盜賊榮耀》是什麼電影？

  雖然不是一位典型的桌遊玩家，也只在學生時期小小嘗試跟朋友跑團，玩了一款到現在也

  忘記了簡單桌上角色扮演遊戲，可以說自己對於桌遊的認知並不是很充足，但還是在那些

  玩遊戲的日子裡感覺到桌上遊戲的魅力。不管是《山中小屋》、《矮人礦坑》或通俗的《

  狼人殺》與闔家歡樂的《大富翁》等，可以說只要遊戲開始就很難停下來。


  在嘗試過一些桌上遊戲的同時，像角色扮演或很有故事性的桌遊，有時候需要好的遊戲管

  理人與投入遊戲的隊友，尤其在TRPG中更是如此。


  我想會不斷在投入於經典遊戲《龍與地下城》世界的冒險者，通常都是因為隊友和GM給予

  他們美好的奇幻體驗，玩家們面對面直接表達，甚至有著比網路更即時的互動方式，我想

  這就是桌上遊戲歷久不衰的主因。











  而經典遊戲改編成影視是否也能讓老玩家買單，過去有許多遊戲改編作品都面臨翻車，例

  如知名的《惡靈古堡》就是個例子，不管是角色或故事背景，都讓老玩家看了皺眉頭想說

  這真的是那款我耗盡上百小時投入的遊戲嗎？


  甚至在細節部分一些改編遊戲電影放到觀眾前可以，但卻逃不過老玩家略為苛刻的法眼，

  故能讓許多過去對作品愛好者讚許，可以說是個艱難的任務。


  這次又迎來改編的《龍與地下城》新電影《龍與地下城：盜賊榮耀》，則不是系列續集，

  而是一個全新詮釋《龍與地下城》背景的新故事。以吟遊詩人、蠻族、術士、德魯伊等冒

  險者拼裝出來的盜賊隊伍，懷著各自的期盼，準備偷取與展開復仇。但等著他們的卻是一

  道道艱難的關卡，失蹤的遺物、被俘虜的女兒、與想復活的愛人，到底烏合之眾該如何逆

  轉自身的命運。











  《龍與地下城：盜賊榮耀》分析與延伸：


  《龍與地下城》是一款聞名世界的奇幻桌上角色扮演遊戲，由前職業保險公司推銷員加里

  吉蓋克斯與朋友大衛亞耐森共同設計，在1974年時初次發表，獲得關注。一般玩家們認為

  《龍與地下城》的啟發是戰棋遊戲《鏈甲》的延伸，而廣為玩家接受。


  故許多遊戲研究者認為《龍與地下城》普遍影響了現代角色扮演遊戲和產業的基礎， 有

  許多奇幻電玩遊戲和影視作品都多少有著它的影子，並後續也有許多玩家繼續完整《龍與

  地下城》的世界觀。


  面對許多競品桌遊和後來居上的電玩遊戲，《龍與地下城》的成功其實有它自己的市場策

  略，在1977年後，該遊戲就分成兩種款式：一款式規則較少且對新手相對親切的輕量化《

  龍與地下城》、另一款則是有著更多規則限制、結構更扎實讓GM和重度冒險者都樂在其中

  的高級版龍與地下城。


  並且每隔幾年就頻繁修改裡面的規則不足和瑕疵，現在的遊戲則是以2003年修訂的第三版

  為基礎，也在這年度《龍與地下城》也開放公共版權許可，讓其他遊戲可以沿用它們故事

  的奇幻設定和共享，加速傳播遊戲設定的速度。






  但即便《龍與地下城》在當時的桌上遊戲圈內享譽美名，但當時社會架構普遍其實對於《

  龍與地下城》的玩家有著貶抑和負面看法，甚至被汙名化。不僅有一些宗教跟衛道組織認

  為這類的桌遊換殘害孩子的身心。


  在學校對於《龍與地下城》玩家的刻板印象，普遍認為是校園的邊緣人或異類份子，整體

  如同過去90年代喜歡ACG的亞洲御宅一樣，而在奇幻題材大放異才，跟桌遊開始普遍進入

  娛樂市場，才逐漸有所改善。


  《龍與地下城：盜賊榮耀》並不是《龍與地下城》遊戲首度改編成電影，在2000年時就首

  次搬上大螢幕（台灣譯名為：神龍傳奇。電影二代名稱則為：魔龍傳奇II：仁者無敵），

  但在當時雙雙票房失利，又因為複雜的版權問題而封印。


  2023年重新架構更貼近遊戲世界觀和多方彩蛋的《龍與地下城：盜賊榮耀》，除了版權歸

  屬有了著落外，導演與編劇用心展現桌上遊戲獨特的敘述風格，讓這部電影少見的在遊戲

  改編上獲得很多桌上遊戲玩家的好評。







  《龍與地下城：盜賊榮耀》值得一看嗎？


  雖然我本身不是《龍與地下城》的玩家也非粉絲，但是因為是經典奇幻作品，總還是知曉

  其名，整體看過一些國內、外玩家都對於這次電影展現出遊戲世界觀用了一個非常聰明又

  出色的改編，簡單來說《龍與地下城：盜賊榮耀》不是用很久很久以前，而是從主角簡單

  明瞭的身世開始介紹，在透過遇到的同伴共同把世界觀的撐起，如同遊戲人間一樣。


  很多遊戲改編的影視作品往往想加入更多，不管是政治正確、或是更深層的內涵、還是全

  新的故事改寫，但往往忘記第一個會因為片名去支持的，通常就是你改編作品的始終粉絲

  。


  雖然往往很難伺候，但其實這寫粉絲要求的只是看一部他們一直以來喜歡的東西，搬上大

  螢幕享受過去的想像的美夢成真，但往往太多影視團隊自以為的深度，反而出現讓人無法

  接受的作品，也讓這些次文化玩家戲稱：「慘遭真人化」。









  《龍與地下城：盜賊榮耀》它其實是一個很簡單，甚至老套的奇幻喜劇冒險故事。但為何

  還是受到許多觀眾買帳，我認為因為粉絲經歷過許多驚悚的改編作，要的真的不多。大家

  只是想要一個簡單可以享受過去支持遊戲，看到許多影子的普通電影。


  直接點說《龍與地下城：盜賊榮耀》的成功就是因為沒有搞一些亂七八糟遊戲外莫名其妙

  的東西，單純轉換遊戲在加入闔家歡樂的故事內容，讓它在許多可怕的改編中脫穎而出。


  也許以奇幻元素來說《龍與地下城：盜賊榮耀》可能沒有一些史詩大作的奇幻文學來得讓

  人眼睛一亮，但是它展現出來的是老玩家對於裡面出現景物的共鳴感，和讓沒有接觸過這

  個經典桌上角色扮演遊戲的新人和觀眾有一個不差的印象，甚至可能是如今成為家長告訴

  小孩過去跑團的青春。故粉絲觀眾要求其實沒有太多，只是想看見一款遊戲在不同媒介重

  新展放異彩，也許不需要想太多，而是更加知道這群人為何死忠。


  --

  個人Blog：

