url: https://www.ptt.cc/bbs/movie/M.1719586292.A.488.html
title: '[新聞]《龍與地下城：盜賊榮耀》續集有譜嗎？'
content: "新聞網址：\n\n原標題:\n\n\n2024-06-28\n\n\n克里斯潘恩仍然相信《龍與地下城：盜賊榮耀》可能會發展續集。這部《龍與地下城》電\n\
  影改編自標誌性的同名角色扮演遊戲，講述了四個不太算的冒險家的人，計劃搶劫以取回\n一件古代遺物，從而向他們的城市釋放了古代邪教的憤怒。\n\n\n《龍與地下城：盜賊榮耀》受到了遊戲粉絲的歡迎，但未能在票房上取得顯著成績，許多\n\
  粉絲相信永遠不會有續集出現。目前為止，派拉蒙確實尚未正式宣布拍攝第二部電影。\n\n\n但主演演員克里斯潘恩仍然抱有希望，他最近在 ACE 超級英雄動漫展上被問及《龍與地\n\
  下城：盜賊榮耀》續集的可能性時，他的反應出乎意料地樂觀。他不僅希望有續集，也他\n非常確定真的會有。\n\n\n\n他表示：\n\n「是的，當然。再說一次，這還是一顆界內球。這部電影做得很好，但還不夠好。\n\
  \n。孩之寶擁有這個系列的版權，如果他們能找到一個財務上的方法來實現，我相信他們會\n去做。」\n\n\n儘管改編自非常受歡迎的 IP（近年來人氣大幅提升），演員陣容也相當堅強，\n\
  \n\n\n\n\n《龍與地下城 2》需要減少預算\n\n如前所述，派拉蒙和孩之寶都尚未正式宣布《龍與地下城 2》正在開發中。然而，這並不\n意味這兩家公司完全排除這個想法。派拉蒙執行長布萊恩羅賓斯\
  \ (Brian Robbins) 在\n 2023 年 7 月接受《綜藝報》採訪時表示， 《龍與地下城 2》是有可能的，但電影製片\n人需要解決一個突出的問題：預算。\n\
  \n\n羅賓斯簡單地說：\n\n「我們必須找到方法降低成本。」\n\n\n雖然《龍與地下城 2》仍有可能推出，但另一個與《龍與地下城》相關的計畫已被正式取\n\
  消。串流品牌派拉蒙+ (Paramont+) 的真人版《龍與地下城》系列已正式流產，該劇共\n 8 集，是在《龍與地下城：盜賊之榮》上映之前簽約的，預計與電影配合。\n\
  \n\n派拉蒙+ 取消了該劇的 8 集訂單，不過也未必完全沒救；這部劇目前正在進行創意上的\n修改，然後才會重新回到市場，供潛在的網路／串流媒體購買播放。\n\n\
  \n--"
