url: https://www.ptt.cc/bbs/movie/M.1678808900.A.A6C.html
title: '[偏好雷] 龍與地下城:盜賊榮耀'
content: '看了一下好像比較缺非遊戲玩家的觀後感，於是來發一篇


  對龍與地下城的認識也來自廢柴聯盟XD  沒有親自玩過遊戲



  感想是偏好雷，沒有接觸遊戲也可以快樂看完整部


  整體蠻流暢的，節奏很快不水時間


  笑點部分我這場反應不錯，盜賊小隊角色都討喜


  小隊的劇情分配平均這點我很中意


  當然主要角色比較多一點但不是主角大發神威與他的快樂夥伴


  主軸就是我看預告時期望的團隊合作冒險尋寶(雖然跟我原本猜測的劇情不大一樣)








  對了本片有一個片尾彩蛋。








  底下開始有劇情雷





  雷




  雷






  再一個防雷













  為什麼只給偏好雷是因為有些部分還是略顯套路...以及我有些困惑的地方






  我不曉得是不是中途有些走神所以看漏什麼


  當主角小隊千辛萬苦拿到裂解頭盔，贊柯說有邪惡接近


  一轉頭喪屍反派小隊就出現在高地上


  他們從哪裡來的?他們跟蹤主角?可是橋斷了，這些人也沒有來去杖啊?其他路線?


  如果有提到是索菲娜送他們去的請跟我說，


  這個主角好不容易抵達寶藏點反派就瞬間出現的劇情真的讓我困惑到結尾



  然後就是片尾霍爾加中的那一劍，完全就是為了把石板消耗掉才安排的吧...


  我是有被音樂搭配拍攝感動到，也覺得這樣安排比較好


  霍爾加也是主角父女重要的家人，


  主角也承認自己想復活的其實是自己妻子，不是綺拉的母親


  這種情況下復活已經死去十幾年的席亞反而略微妙


  但霍爾加胸口中劍那一幕出來時要用掉石板的目的性太強烈，我感動都打了七折




  另外不知道算不算BUG的是，索菲娜籌畫那麼久，只為了把絕冬城變成己方勢力的領地


  然後，民眾們被天下掉下來的財寶吸引離開會場


  天降的變喪屍紅煙只有泡到高台VIP室裡的有錢人


  她的計畫...就這樣....失敗了....??? 失敗了????


  她竟然沒有想過要封鎖會場讓民眾不能離開之類的嗎...


  我本來以為會是賽門用來去杖開洞把紅煙引到無人的海上或是直接掉頭之類的，


  沒想到是民眾跑光光，還真的跑那麼快，一下子會場就空了...




  上面幾點就是我比較嫌棄的地方，其他都蠻喜歡的XDD



  地下的肥龍滾動好好好可愛哦!!!!!回來才發現發的特典卡片上面就是牠


  德魯伊多莉加非常棒，又正又可愛而且認真的性格非常討喜


  她第一次變成蒼蠅潛入、被索菲娜抓包


  從這裡開始一路不斷變身成各種動物逃亡的過程很好看，


  為了伙伴變身梟熊，勇敢抵抗索菲娜活化的龍也很棒(她只是會變身，武力並非特別高)



  但我中途最注意的其實是贊柯


  他比柏捷頓家族時帥多了，果然人設很重要，自帶光芒(物理


  人帥博學又可靠，武力值點滿，單挑喪屍小隊那段打戲私心是整部打最好看的，優雅俐落


  又能捨身拯救同伴


  以至於他完成頭盔任務後就退隊我還有點失望，


  不過他本來就不是盜賊，只是算協助主角一起去取他藏在地底深處的頭盔而已



  另外三個小隊成員我就不花太多時間講，但大致上都是討人喜歡的人設


  就連看起來對小隊最沒有幫助的克里斯潘也想出了灑金銀財寶讓民眾離開運動會的計畫


  他調轉船頭那幕真是帥XD



  雖然有上面提到的幾個點所以只給了偏好雷


  但整體來說這部我看得很開心也很投入


  我本身就是特別喜歡小隊集結合作冒險的類型


  (所以我也很喜歡在馬車塞進動手腳的畫像那段，多莉卡的變身技能真的很好用)


  笑點也都蠻中我的



  如果說還有什麼建議 可能是這部應該沒有必要看IMAX...


  --


  肥龍翻滾真的有夠可愛...


  只是有個問題是贊柯說死過一次的人不會那麼容易死，


  所以被吞掉的喪屍小隊是在肥龍肚子裡死了又死死了又死嗎......


  --'
