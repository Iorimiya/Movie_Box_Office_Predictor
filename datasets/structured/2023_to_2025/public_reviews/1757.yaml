url: https://www.ptt.cc/bbs/movie/M.1678801793.A.671.html
title: '[好雷] 龍與地下城 盜賊榮耀'
content: '感謝電影版跟廠商提供贈票，讓我這個不專

  業的D＆D老團員有機會提前觀賞特映會。


  文筆有限，無法表現劇中流暢節奏感，僅能

  略微描述。













  －－－－－－－－－雷－－－－－－－－－



  這是一場精采的冒險故事，發生在被遺忘的

  國度，講述一群默默無聞的英雄，意外拯救

  世界的故事。


  這個奇幻世界，這裡也是充滿劍與魔法的奇

  幻世界，有名人（伊爾明斯特）、有名勝（

  絕冬城）、有各種魔法（燃燒之手）、還有

  許多種族與不同職業（堅守正道的守序正義

  聖騎士）。


  克里斯·潘恩飾演個吟遊詩人，大部分時間

  都是透過他的口才驅動劇情，這讓他的角色

  極具戲份。在戰鬥時，即使掄起魯特琴，他

  的笑點仍然比殺傷力更高。


  蜜雪兒·羅德里奎茲應該是野蠻人，主力戰

  鬥職業，幾場戰鬥都是靠她出馬。非戰鬥時

  間的野蠻人，也是具有強烈表現欲的角色。


  賈斯特·史密斯是個術士，ａｋａ天生的魔

  法使用者，主要屬性是魅力…難怪不是個好

  術士。


  蘇菲亞·莉莉絲飾演百變怪，因為我認識的

  小D都不能在空中變形。潛入變形的轉場流

  暢，變化自如又恰如其分。最終戰看著梟獸

  發威，真D暴力、真D爽。


  休·葛蘭的雙眼透漏出的訊息多於雙唇，如

  果他的眼神開始飄移，特別是往右上方看去

  ，那下一句出口的幾乎是謊言。


  以選角來說，可以說是政治正確的選擇方式

  ，不過女角這麼能打，看得很爽就不會管正

  不正確。


  不會出現擲骰畫面，不過可以看到絕冬城內

  詩人的完美潛行、術士專注檢定失敗、術士

  閃避陷阱失敗、術士使用物品失敗、術士撞

  掉畫作…真的是雷包。


  半身人的退休生活都是寫遊記！


  －－－－－－－－－雷－－－－－－－－－













  整個故事始於一場竊盜行動，面對著各種不

  同的挑戰與考驗，盜賊之間雖然存在著競爭

  和矛盾，但也有著遵循信條的盜賊。故事的

  結局以竊盜的方式完成他們的目標，讓整個

  故事呈現出一個循環的感覺。


  套句全面啟動說的：大家都喜歡大團圓結局

  。雖然偏王道故事，就是這樣的冒險才深的

  人心。想當年比爾博也是出門一趟，在中土

  世界走出個震撼人心的冒險，才有後續佛羅

  多的遠征，希望能繼續看到系列作。


  總結來說，這部電影以其精彩的情節、華麗

  的特效和豐富的冒險元素吸引了我。如果你

  喜歡奇幻冒險類型的電影，這部作品絕對不

  容錯過。


  --'
