url: https://www.ptt.cc/bbs/movie/M.1686286852.A.892.html
title: '[新聞] 《龍與地下城：盜賊榮耀》導演檔籌拍動 '
content: '《龍與地下城：盜賊榮耀》導演檔籌拍動作新片！萊恩雷諾斯、肯尼斯布萊納加入主演




  強納森高斯坦（Jonathan Goldstein，下圖左）與約翰法蘭西斯戴利（John Francis

  Daley，下圖右）這對雙人組編導搭檔，在今年三月才剛推出了大獲好評的《龍與地下城

  ：盜賊榮耀》（Dungeons & Dragons：Honor Among Thieves），而據《Deadline》獨家

  報導，接下來他們則準備重回原創領域，與 Apple、天舞影業合拍另一部動作冒險電影《

  Mayday》。




  《Deadline》披露，高斯坦和戴利在今年初向天舞影業提案了《Mayday》的企劃，而深受

  故事吸引的萊恩雷諾斯（Ryan Reynolds）也很快就點頭加入，沒意外的話，本片就是他

  下一部準備開拍的電影。據《Deadline》的消息來源表示，這齣劇本早在好萊塢近期的編

  劇罷工潮開始之前就已經完成。


  目前《Mayday》的劇情仍被保密中，但肯尼斯布萊納（Kenneth Branagh）已經確定是第

  二位加入卡司陣容的演員。




  --'
