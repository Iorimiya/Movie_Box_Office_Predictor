title: '[好無雷] 《龍與地下城：盜賊榮耀》瑕不掩瑜的'
content: '海報取自於巴哈姆特GNN


  先說

  這片我沒看到睡著，所以我覺得這片很了不起

  為什麼會這樣說呢

  因為我看之前才吃了管四的安眠藥和抗憂鬱藥物之類的(副作用就是嗜睡)

  前天晚上是最後一場IMAX

  掃墓一整天累死，原本想說放掉不看IMAX，睡覺比較實際，所以才吃了藥，然後想法一轉，

  跑去衝最後一場

  結果就是累個半死又吃藥的情況下去看了……



  =====這樣還能不睡著，所以這片很厲害=====



  整體而言角色塑造算是滿成功的

  但是僅限於主要角色，尤其是埃德金和霍爾嘉，給他們的篇幅有點多，所以必然擠壓到配角

  的描寫，因此導致配角的部分相對比較淺薄，角色沒那麼有厚度

  印象就變成了「德魯伊很可愛」這種比較淪為表面上的印象


  因為片名的關係(盜賊)，一開始男主角自述故事時，我也是帶著半信半疑的角度去看，就害

  怕自己落入了「盜賊=騙子」的片面之詞

  不過沒想到這幾個角色都「具有自己扮演的角色」的明確定位，一路貫徹到底，或許這就是

  桌遊改編的好處吧？


  劇情上有幾個橋段用上了御都合主義，這是我比較嫌惡的部分

  尤其是賽門的幾個橋段，比起在劇情中自身的成長描寫，更像是編劇刻意幫忙安排好的一樣

  (就是所謂的御都合主義)


  但是整體而言，瑕不掩瑜！

  每個笑點都有GET到！

  劇情流暢程度也很順！

  不過就我的評分來看，大概跟沙贊2差不多，比沙贊2好一點，但也沒有能到「極好」的地步

  或許原因就出在配角的飽滿度太過單薄，還有御都合主義上面吧？




  --


  我推超可愛超萌超認真努力就是無法向上長

  胸圍還是72


  --



  我是覺得那個算不上雷啦

  不過還是刪掉好了'
