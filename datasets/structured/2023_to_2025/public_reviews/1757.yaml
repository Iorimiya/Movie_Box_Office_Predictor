title: '[好雷] '
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  好像是第一次在這個版上發文

  單純是在爬文時看到有版友說這部好像連回收成本都有困難覺得可惜才來簡單分享一下沒什麼營養的心得文


  這部真的蠻適合喜歡奇幻文學或是愛玩RPG類遊戲的受眾們

  雖然我完全沒接觸過DnD這款遊戲但在此之前也略有耳聞它的經典地位

  （經典美劇生活大爆炸影集主角群們就超愛玩）

  但總之就算沒聽過或玩過也不影響欣賞這部片啦


  由於各種意外進場時大概正片已開始快十分鐘（在審判那趴快要跳窗前），但是對於劇情還是可以很快理解，整體劇情流暢主軸明確，雖然有些地方有些粗糙但是不至於影響觀影感受

  而且我是直到觀看時才知道原來有休葛蘭XD


  冒險過程真的笑料不斷、真的很適合不想帶腦子（？）單純想放鬆的朋友


  我在打這篇心得時一想到可愛到爆炸（？）的肥龍&跳針到逐漸母湯遭經的男主角就真的完全無法克制自己的嘴角wwwww


  另外我也好關心那個被牧師咒喚醒的屍體何時才能解脫太慘了XDDDD


  總之感謝這部電影為我帶來了今晚滿滿的快樂


  希望如果有版友因為我這篇文而去觀看的也能跟我收穫一樣的快樂<3


  P.s身為女生也覺得多莉克（德魯伊）好可愛！有種空靈感～～

  -----

  Sent from JPTT on my iPhone


  --

  從前有一支火柴，有天洗澡完想把頭髮吹乾，沒想到頭竟然著火了，


  送到醫院包紮後，變成了棉花棒；康復後，因為頭髮燒光了，變成了牙籤；


  所謂一朝被蛇咬，十年怕草繩，他決定戴安全帽保護頭部，於是世界上有了加倍佳。


  --'
