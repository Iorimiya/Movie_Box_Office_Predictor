url: https://www.ptt.cc/bbs/movie/M.1679496790.A.D24.html
title: '[好雷]從玩家角度推荐龍與地下城：盜賊榮耀'
content: '我平常就有在帶龍與地下城的桌遊團，所以我想從粉絲以及DM的角度來推荐這部電影。


  先說缺點：

  1. 劇情偏老套

  2. 轉折基本上意料之内

  3. 有幾段CGI有點爛


  雖然有上述缺點，但是這部片還是抓到了自己的定位:

  給觀眾帶來歡樂，並且引導大家進入DND的世界


  先說給觀眾帶來歡樂，

  劇情老套從另一個角度來看，

  就是這種劇情最能引起大家的共鳴，所以才被用了這麼多次。

  這部片主題就是:家人，然後不要輕言失敗

  幹超級老套

  但這部電影就是用一個老套的主軸好好地講故事，中間穿插一些笑點。

  所以才這麼成功。


  我觀影的經驗是所有人一開始都矜持著，看到搞笑也在那邊僵著。

  但是之後就小聲的吃吃笑，到最後隨著劇情起伏很多人都笑出聲來。

  散場的時候我看到的人臉上都有笑容。


  再說引導大家進入DND的世界，

  最近改編奇幻電影/影集的趨勢，編劇會去故意更動原本的世界觀背景

  (力量之戒，獵魔士，Willow等等)

  更動是好是壞先不論(因為大部份都是壞)

  常常聽到謠言說，編劇不滿原作，所以要加以改動。


  而龍與地下城電影真是一股清流啊。

  你很容易就看得出來，這電影背後的團隊十分熱愛DND世界，

  並且忍不住要介绍給所有人。

  比如說預告片裡那隻炎漿裡的龍，本來可以隨便塞隻龍進去，

  但這電影特別去找了隻有名有姓的出來。

  電影裡提到的地名都其來有自，

  而且生物種族也都是DND粉絲熟知的

  避免暴雷就不多說了。


  與其說這是改編自某部DND背景的書，我認為這部電影是轉化了桌遊跑團的經驗。

  比如說這段


  DND 死者交談術

  看到這段我的感想就是: 原來不是只有我會這樣搞玩家

  有種英雄所見略同之感



  總而言之，

  闔家歡樂片，奇幻誠意之作

  如果你想知道DND桌遊團到底在玩什麽

  請看《龍與地下城：盜賊榮耀》



  --

  皆可 如果你對DnD不熟 或是你是跟著主角團視角走 那就像玩家

  如果你對DnD很熟 然後也有帶過團 那就感覺像GM慈愛地看著主角們冒險

  基本上這電影是走5e版規則 當然很多違反的部份

  (像是德魯伊不能變梟熊)

  但是都無傷大雅

  這個我實在是幫不上忙 我其實還沒看過imax或4dx電影......

  我只能說 這電影有很多壯觀的大場面 動作場景運鏡流暢

  要不要特殊影廳 就留待其他大大評論'
