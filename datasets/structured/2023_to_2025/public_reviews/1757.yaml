url: https://www.ptt.cc/bbs/movie/M.1681039407.A.B6A.html
title: '[好雷] 看得開心的龍與地下城：盜賊榮耀'
content: "雷文防雷資訊頁\n\n\n\n無雷部份：\n\n1.不用知道任何龍與地下城桌遊知識，也能看得懂\n  (包括我媽都完全能看懂)\n\n2.整體格局以奇幻作品來說偏小品\n\
  \  (若與魔戒那種整個中土的大災難相比)\n  但該有的冒險歷程、刺激化解危機還是有\n\n3.角色討喜，鋪陳得宜，智慧和能力也夠強大\n  有些片段碰到的困境和破解的方法都相當有巧思\n\
  \n4.品質蠻精緻，差點被預告騙了以為是很B級的低能笑鬧\n  但其實是誠意滿滿的呈現出世界觀\n  動作武打也是有用心設計\n\n5.克里斯潘恩一樣展現如同他在star\
  \ trek當領導者的魅力\n  而蜜雪兒羅里葛茲超級帥！是完全讓人信服的帥氣\n  休葛蘭的演出也很棒\n\n6.很值得看~看完心情蠻好的\n  親情、友情、冒險、鬥智、龍、魔法等元素都巧妙融合\n\
  \  也會讓人希望票房更高\n\n\n\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\
  \n\n\n\n\n\n1.這部劇情算是相當紮實了\n\n  推進的節奏和速度很OK\n\n  沒有一些慢動作拖時間\n\n  打鬥也相當乾脆不太會讓人覺得打完沒\
  \ (包括打王)\n\n  而且打得蠻帥的~呈現出的力道夠痛\n\n  打最終boss也不會拖到讓人不耐，很快速的展現各方能力\n\n  另外在前段德魯伊一路變身的長鏡頭很讓人過癮\n\
  \n\n\n\n  笑點的設計也不錯\n\n  有些可預期會那樣設計，也的確很適度的給出剛好的程度\n\n  (例如問屍體會有問不出東西的、問到一半死的、問到完全無關死法的)\n\
  \n  有些則是用反差的笑點\n\n  像講故事講一講很感性忽然回憶中的自己問大鳥來了沒那段也蠻好笑\n\n  然後說他嘴唇厚也是~好壞但是克里斯潘恩真的就嘴唇厚XD\n\
  \n\n\n  王道的鋪陳則是讓人不意外\n\n  包括一定會能成功連結頭盔、最後不意外的把復活用在好友\n\n  (尤其搭配回憶中的「讓她走」、還有贊柯也有講人死後新生活)\n\
  \n\n\n\n2.一些劇情轉折設計很不錯\n\n  包括如在車子送畫那段小出包的設計很有意思\n\n  從競技場逃脫的點子也很棒\n\n  等大鳥來以為要出獄結果是用牠飛走\n\
  \n  兌現承諾把財富分給在地居民的方式\n\n  以及最後封住最終boss的策略\n\n  都蠻有趣的\n\n\n\n\n3.雖然在看之前就在別篇文雷到\n\n\
  \  說女主角會吐便當\n\n  (真的很機車，尤其是有人故意講說最近某部片，啊除了F10不就這部)\n\n  但還好死法不是蠢死\n\n  復活的前面也有一點鋪陳她會被復\n\
  \n\n\n\n\n\n其他很多很棒的點別篇文也都有提到就不多說\n\n若以看完的滿足感而言\n\n今年目前這部最喜歡\n\n\n\n\n\n再來要繼續期待不可能任務7、印第安納瓊斯5了~~~~\n\
  \n\n\n--\n\n \n \n\n\n \n\n--"
