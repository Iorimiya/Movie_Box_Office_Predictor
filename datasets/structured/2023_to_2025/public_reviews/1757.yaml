url: https://www.ptt.cc/bbs/movie/M.1741309665.A.34D.html
title: '[新聞] 《龍與地下城：盜賊榮耀》導演檔加入'
content: '新聞網址：



  去年四月，獅門影業在 Cinema Con 宣佈，籌備進度卡關長達十幾年的《大富翁》（

  Monopoly）真人電影已確定交由瑪格羅比（Margot Robbie）共同創辦的製作公司

  LuckyChap 打造，她本人亦會擔任製片人，而如今時隔近一年，他們總算找到一對編劇搭

  檔接手這項企劃，而這對搭檔，就是拍出廣受好評的《龍與地下城：盜賊榮耀》（

  Dungeons & Dragons：Honor Among Thieves）導演檔 — 約翰法蘭西斯戴利（John

  Francis Daley，下圖右）和喬納森高斯坦（Jonathan Goldstein，下圖左）。


  高斯坦和法蘭西斯戴利主要以編劇身份活躍好萊塢，最早則是撰寫喜劇片起家，初期的作

  品有《名魔生死鬥》（The Incredible Burt Wonderstone）和《老闆不是人》（

  Horrible Bosses）系列，後來他們開始轉戰知名 IP，陸續參與了《蜘蛛人：返校日》（

  Spider-Man：Homecoming）、《閃電俠》（The Flash）等續集電影的編劇工作，近年則

  因為自編自導口碑極佳的《遊戲夜殺必死》（Game Night）和《盜賊榮耀》兩部代表作而

  備受影迷推崇。


  --'
