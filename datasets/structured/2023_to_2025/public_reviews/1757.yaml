title: '[好雷]龍與地下城：盜賊榮耀'
content: '連假的時候沒看，排在上週末進場看

  整體觀影體驗真的很棒


  一開始開假釋會議那段，本來以為主角是在畫虎爛

  結果經然還真的是他的親身經歷

  只是一時行差踏錯才被紅袍巫師滅門

  進而淪落成盜賊


  後面去找裂解頭盔那一段也很精彩

  刺客團出場的時候我還以為會有人被收

  結果聖騎竟然一人單刷....

  然後聖騎剛說完：「你很難殺死沒有靈魂的人」

  胖紅龍出場直接一口一個吃掉

  是有沒有那麼廢XD


  故事後段跟收尾的時候其實還滿老套的

  但忘記之前聽誰說過：

  「故事老不老梗不是重點，重點是說故事的人有沒有好好安排」

  感覺還蠻能體現這部電影給我的感覺

  雖然老套，但可以感覺到製作組的誠意


  --


  我也覺得應該是不死生物而已



  對啊XD



  真的～意外的好看'
