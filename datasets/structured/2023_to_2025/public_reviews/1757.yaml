url: https://www.ptt.cc/bbs/movie/M.1680190520.A.BC2.html
title: '[好無雷] 龍與地下城:盜賊榮耀　非粉絲觀影心得'
content: '其實我並不是要說什麼評論，純粹想推薦這部闔家觀賞的電影。


  我本身就喜歡奇幻電影，所以沒多想就衝去看，


  本部片段銜接都到位也無冷場，重點是很多笑點都有戳到我XD


  雖然不是那種會笑到肚子痛的場景，


  但很多段落跟笑點在看完回到家後，仍意猶未盡，


  正是因為這樣，真讓人想再去多刷觀看，也是這部魅力所在。


  導演選角都很到位，克里斯潘恩跟雷吉尚佩奇魅力值很高，女士們光看他就值回票價了，


  術士剛開始覺得很呆萌，但到後面為了團隊很賣力阿!給他掌聲鼓勵XD


  蘇菲亞莉莉絲更不用說超級可愛，演德魯伊可說是導演特別的安排吧?


  德魯伊一鏡到底的場景，配合蘇菲亞嬌小的身軀很到位。


  另外女野蠻人更不用說了，打鬥場景不馬虎，拳拳到肉的感覺看得很過癮，


  至於內容並不像預告那樣乏味的感覺，反而溫馨也不會使觀眾很混亂，


  我覺得劇本真的很用心，導演運鏡也很棒，2個多小時電影很超值，


  其實還有一點可能容易被大家忽略，電影裡面有些場景真的很美，

  (推文有說美景在北愛爾蘭跟冰島拍攝，難怪那麼美。我有看導演專訪有說很多場景如果能實景拍攝時，通常不會用綠幕，導演有說本身不是很喜歡綠幕。)


  可能美景過場有點快，所以大家會比較難以感受到。


  總之真是適合男女老少，闔家觀賞，希望大家不要錯過這部好電影，


  也希望能有續集，繼續看原團隊衝地下城XD


