title: '[普無雷] 龍與地下城 - 盜賊榮耀'
content: '其實整體不算太差

  但好像也沒有PTT和YT影評們吹的那麼神

  可能太多好評所以期待值過高?!

  或者是我沒玩過桌遊而無法體會其中醍醐味

  只有買周邊




  缺點:

  1. (基本上貫穿整部片.. )

  劇情對白偏慢而且有點尷尬，比索爾4還尬

  可以感受到這是製作團隊想刻意營造喜感

  只是可能節奏上個人覺得還沒有一般商業片剪的那麼流暢舒服 (例: 家人俠/漫威系列等

  等，雖然看完後回頭想想可能會覺得有些地方太無腦/蠢，但畫面目不暇給；而本片是讓

  你在觀影過程中就有空檔去思考這些XD)


  2. 呈上，笑點或許為了闔家歡，幾乎都頗老梗 (不是說老梗不好，之所以能成為老梗就

  是因為經典；可能差在情緒渲染不夠到位吧)

  另外好像還參雜原作遊戲梗? 看一些其他感想有提到一些劇情突然意外順利/大失敗=擲骰

  判定時爆骰/爛骰、某角色有故意營造NPC感.. 但經過這些解釋感覺好像也沒有改觀或加

  分 (或者說需要解釋這點本身好像就扣分了?!)


  3. 有些配樂不太搭嘎，明明沒幹麻但背景音樂搞得很史詩.. 造成些許出戲


  優點是動作戲大部分蠻精彩的！還有肥龍和德魯伊可愛<3

  我是沒後悔進戲院啦

  若不急著買周邊的話好像等串流就夠了(?


  據說老桌遊迷的反饋大多很正面

  的確整部電影的遊戲感都很明顯，從組隊、尋找NPC和寶物、綁定裝備等等..

  但對於要把遊戲中相對複雜的層層關卡濃縮成電影，用兩個多小時把故事講完來說；個人

  就是認為本片取捨不夠精確導致有點拖沓


  以音速小子為例

  遊戲的流程就是每關一直衝、蒐集金環/寶石然後打BOSS的循環

  若完全照該內容拍成電影八成吸引不到普羅大眾

  所以劇情上還是加以修飾；而原本的場景、道具或音效等等元素可以當作給老玩家的彩蛋

  ，這樣感覺更親民


  以上，第一次在本版發心得～希望沒講什麼不該說的話:/


  --

  不好意思各位是小弟不懂規矩，也不是說覺得好看的都是工讀生而只是半開玩笑的想說會

  不會有.. 已把那句刪掉抱歉

  比喻啊 就像在Google地圖看到五星店家那樣一面倒的好評

  就說不是認真的了.. 雖然我的確有被騙去看的感覺但也說了不後悔

  好吧那可能我跟本版主流意見真的不合.. 個人覺得索爾4其實還行不差

  我相信大部份人是真心覺得好看，或許是因為幾乎沒人提到缺點才有點不太真實XD

  原來如此，我是看到好評如潮才發現這片的

  三月底先買白龍，看完後又多入了一隻梟熊

  個人感受啦.. 可能剪輯留白太久？尤其領主出現的時候 (例如手指冷卻那裡尬了好一陣

  子還不趕快切下一幕|||

  就算爛片也有可以借鑑的地方 為何不能比'
