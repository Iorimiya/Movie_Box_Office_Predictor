title: '[新聞] 《龍與地下城：盜賊榮耀》擊敗《John W'
content: '《龍與地下城：盜賊榮耀》擊敗《John Wick: Chapter 4》榮登新任北美票房冠軍



  知名奇幻桌遊《龍與地下城 Dungeons & Dragons》最新改編電影《Dungeons & Dragons: H

  onor Among Thieves》（龍與地下城：盜賊榮耀/龍與地下城：盜亦有道）上週正式上映，

  於北美地區以 $3,850 萬美元擊敗Keanu Reeves主演動作電影《John Wick: Chapter 4》

  （捍衛任務 4 / 殺神 John Wick 4）成為新任票房冠軍。


  《Dungeons & Dragons: Honor Among Thieves》北美首週票房超乎預期，海外地區也拿下

  $3,300 萬美元的亮眼成績，首周全球票房來到 $7,150 萬美元。


  本片製作預算高達 $1.5億美金，在上映前不少資深玩家擔心本片將會失敗，不過在《Game

  Night》導演雙人組 John Daley 與 Jonathan Goldstein 的領銜之下，並搭配相當優秀

  的選角陣容，成功繳出一張出色的成績單。評價部分，爛番茄為 90% 新鮮度與 93% 網友評

  價、IMDb 為 7.6 分、Metascore 71 分與 Cinemascore A- 評分。



  一名魅力十足的盜賊和一群冒險家踏上一場史詩般的劫盜之旅，目的是奪取一件遺失的古物

  ，但是當他們惹上不該惹的人物，事情就變得非常危險。《龍與地下城：盜賊榮耀》一片將

  傳奇的角色扮演電玩遊戲精彩豐富的世界觀以及好玩有趣的精神搬上大銀幕，絕對是一部既

  搞笑又充滿驚險刺激動作場面的冒險動作片。





  《John Wick: Chapter 4》上映第二週票房為 $2,820 萬美元，位居北美上週票房亞軍，全

  美總票房來到 $1.227 億美元，全球總票房達到 $2.45 億美元。









  --'
