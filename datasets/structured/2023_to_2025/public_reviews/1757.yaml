url: https://www.ptt.cc/bbs/movie/M.1678793126.A.AD2.html
title: '[好雷] 龍與地下城 盜賊榮耀'
content: '感謝朋友邀約有機會看這場在美麗華imax的試映會

  想當初會接觸到這一塊是國中時

  剛上大學的老哥算是我們家的奇幻始祖XD

  一路在1997年第一次放暑假帶回D1跟FF7回家玩

  然後是之後的柏德之門一代

  想當初我哥一邊玩 我拿著英文字典坐在旁邊的畫面歷歷在目XD


  那幾年剛好有出新版的龍槍還因此收了一套回家

  國中時全校都在瘋金庸

  只有我帶龍槍去學校看

  被同學翻了兩頁就嫌難看 (到底兩頁是怎麼看出好不好看的?)

  害我從此至今一部金庸都沒看過XDDD (金庸表示:關我屁事)


  可惜現在兄弟倆分隔兩地+朋友臨時邀約

  不然真的很想跟老哥一起來看

  一定很有感


  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  先說結論

  我覺得非常好看

  節奏明快 敘事俐落 打鬥畫面也有到位

  整部片沒有給我一絲現在怎麼了的感覺

  撇開不管是不是粉的因素

  我可以給到至少八分以上


  在某一段戲中必須因為主角們的任務或當下劇情必須"重複的"幹某些事時

  很多電影會搞得太長太久

  讓人偶爾覺得有玩沒完 有點太長


  我覺得這一點在這部電影中做得很剛好

  包含一開始主角敘述他之前的故事

  還有他們在"玩屍體"的那段

  節奏都很棒 而且適時地以限時打斷再繼續

  不會有讓人覺得在拖 而給我一種 我為什麼要看你幹這些事情的感覺


  再來是故事劇情雖然說不上新穎 但前後敘事一致 不會亂開分支

  從頭到尾不用去想 他剛剛不是說甚麼 怎麼現在在這樣做

  一切都很好明瞭 大大增加觀影感受


  然後是裡面出現了一堆好讓人熟悉熟悉再熟悉不過的名詞

  我光看到就覺得興奮


  因為事前沒做功課 也都忍著不看預告片 所以不確定故事背景是在哪個系列

  直到回憶故事時就提到豎琴手

  哇哇哇 豎琴手耶

  這不就代表是被遺忘的國度嗎?

  那我其他熟悉的東西會出現嗎?

  還剛在想接下來旅途會去哪裡時

  主角就提到先去柏德之門

  這四個字一出現 就可以聽到影廳之中有些人發出聲音

  他們大概是跟我一樣 覺得這真的是在我們再熟悉不過的世界感到驚奇吧?


  後來決定去絕冬城我朋友則是一直推我的手XD

  因為我有玩BG但沒玩絕冬城之夜

  而他是剛好跟我相反

  事到這邊 我才真的覺得我正式踏上了追尋巴爾之子的道路了(?)


  後來還有提到好多


  劍灣 費倫大陸 深水城


  遜咖法師居然是伊利明斯特的後代?


  噴酸的 應該是黑龍?


  那一本代表豎琴手誓言的書 天啊 跟遊戲裡的道具圖示長的一模一樣啊XD

  以前還在想為什麼BG遊戲裡的書長那麼奇怪 原來現實中是這個樣子嗎


  對話中出現的眼魔會登場嗎? 有遇到的話這群奇幻版異攻隊會被全滅吧?


  還有噬腦怪的登場路過 直接證明了這一個團隊全是智障?


  當他們說要下去幽暗地域的時候

  我還在想 喔!雙刀男要出來了嗎?



  我問那麼多問題

  墳墓內的屍體應該都被我用完了吧?



  總之 只要是遊戲內出現過的東西或名詞被提到時 你都可以聽到影廳內有聲音或是笑聲

  很明顯的是大家都有在電影中接到梗


  這一團由 吟遊詩人 戰士 法師 德魯伊 與聖騎士組成的團隊

  各有所司 除了主角之外每個人都有發揮強大的作用


  主角就真的是一張嘴 老實說他好像從頭到尾除了一直嘴一直出主意之外

  好像沒幹甚麼特別厲害的事XD


  女戰士就是想到甚麼說甚麼完全沒想過婉轉一點 然後到底為什麼特愛半身人XD


  法師廢到難以理解他是伊利明斯特的後裔 然後雖然整路廢 還是不忘虧妹


  德魯伊超可愛 又可靠 各種變換型態在作戰任務中都起到相當大的作用


  恩...無聊的聖騎士..




  最後的決鬥也算是無意之中(其實應該是他刻意的啦) 搞出了一小段笑話

  主角決定實現誓言把搜刮到的錢財還於人民

  弄了一個天上熱氣球寶藏瀑布

  而間接地吸引民眾都去撿錢了

  導致紅袍法師想要藉由辦大賽而群聚的人群散去

  直接搞爆了他的大業

  他的那聲 不! 讓我直接笑出來


  果然要發錢就乾脆一點弄個大瀑布

  民眾都會很開心的

  不要在那邊吵...(咦?)


  最後大家一起齊心打倒壞蛋的過程也算有趣


  到了女戰士在死的過程中 我一直想 拜託不要像死侍2那樣 那太久了

  結果果然還是跟我前面講的一樣 非常的果決XD



  我覺得這部電影最大的優點就是他的節奏

  把握的非常的好

  從頭到尾沒有多餘的地方讓人出戲或覺得拖


  有些電影在想玩梗或笑話的畫面常常弄得好像是在等觀眾笑一樣

  拜託 這是電影 你人物在那邊尷尬兩三秒再下一動 我真的覺得不行


  這部的吐槽笑點都來的非常的快

  然後馬上繼續下一個亂搞環節


  總之我非常喜歡這部龍與地下城

  今天來看非常值得


  現在就是期待他的影集

  或是看之後有沒有續集了


  還有等柏德之門3的正式版發布


  最後抱歉小弟不是專業文字工作者

  如果分享的心得覺得寫得太差或讀的有困難 先說聲不好意思XD


  --

  我之前沒看預告 剛剛補了一下 我覺得看預告會知道故事在幹麻(誰是敵人啊之類的)

  但你要看才知道他們是為了甚麼才幹這些事

  中間沒有很硬的DND要素 可以當作一般奇幻文學改編即可

  真的XD

  真的很棒 希望票房好有續集

  我沒有待到片尾 名單出來一下大家都差不多都走了 影城員工也沒講

  所以不確定有沒有隱藏片尾'
