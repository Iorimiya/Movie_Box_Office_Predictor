url: https://www.ptt.cc/bbs/movie/M.1695576886.A.761.html
title: '[情報] HBO全台首播《龍與地下城：盜賊榮耀》'
content: 'HBO全台首播《龍與地下城：盜賊榮耀》


  日期  :  9/ 30 （六）  21:00


  頻道 ：HBO


  《龍與地下城：盜賊榮耀》




  導演：約翰法蘭西斯達利  強納森高斯汀


  編劇：約翰法蘭西斯達利  強納森高斯汀


  演員：克里斯潘恩   蜜雪兒羅莉葛茲


  雷吉尚佩奇      賈斯提斯史密斯


  蘇菲亞莉莉絲     休葛蘭



  劇情簡介：


  一名魅力十足的盜賊和一群冒險家踏上一場史詩般的劫盜之旅，目的是奪取一件遺失的古物

  ，但是當他們惹上不該惹的人物，事情就變得非常危險。


  《龍與地下城：盜賊榮耀》一片將

  傳奇的角色扮演電玩遊戲精彩豐富的世界觀以及好玩有趣的精神搬上大銀幕，絕對是一部既

  搞笑又充滿驚險刺激動作場面的冒險動作片。


  男主角克里斯潘恩表示，這將是一場偉大的英雄冒險旅程，一群烏合之眾，必須擊敗惡龍，

  打倒邪惡法師才能拯救世界。這部電影有絕妙的幽默感，拍片過程超歡樂，每個演員的演出

  都各有特色，電影才會這麼精彩。









