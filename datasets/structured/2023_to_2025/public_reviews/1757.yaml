url: https://www.ptt.cc/bbs/movie/M.1681050608.A.3AB.html
title: '[普好雷] 龍與地下城：盜賊榮耀，輕鬆小品'
content: '看到評價蠻好的，而且應該比較適合在電影院看，所以就看啦







  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  我得說電影前半段，我覺得實在是很沈悶，

  看得出來導演想塞不少笑點，但就真的不好笑，

  不是只有我特立獨行啦，同廳的至少50人都沒有人笑，

  唯一有笑的大概就只有梟熊最後對紅袍法師的一連串輸出吧，那段看得蠻爽的～


  總之沈悶的點，除了笑點不好笑之外，總體有一種格格不入的感覺

  可能是我要求太多，但我總覺得我無法融入電影的奇幻世界裡頭

  不知道是演技還是對話，總之我無法順利融入

  打鬥也很一般，看得出來有花功夫在拍，但我完全沒有體會到

  一般武打場面的緊張感



  講了一堆缺點，但我後來自動把它轉換成輕鬆小品來欣賞

  也不是沒有可取之處

  首先是特效部分，我很喜歡那隻肥肥的龍和梟熊

  迷宮挑戰的那隻豹型生物也做得不錯，還會使用幻術欺敵

  還有多莉化身成各種生物逃離絕冬城的一鏡到底，那段才真正讓我開始喜歡這部

  多位角色也沒有很明顯的智商下線或聖母婊自己人的行為

  這對現代電影來說已經謝天謝地了


  而且啊，最重要的是，

  主角一群人有很明確的目標

  針對目標不斷嘗試，不斷挑戰，愈挫愈勇

  遇到出其不意的敵人會隨機應變

  各自執行自己應該完成的任務

  而不是光說不練，也不是開無雙輾過去

  更不是嘴砲一下讓反派一秒洗白

  我其實覺得已經算合格了這樣


  但還是有我覺得可惜的地方啦

  像是紅袍法師、絕冬城等等，

  我相信背後都有不少故事可以說，但我也可以理解

  拍成電影要細說全部，反而會迷惑觀眾，不如直接呈現世界觀的輪廓就好


  另外，以我對一般遊戲的吟遊詩人（或是電影的豎琴手）的理解，

  應該多多少少會使用輔助性質的法術才對

  結果主角唯一有使用類似法術的場景，只有一開始開鎖的時候而已

  我是覺得蠻可惜的，不然我覺得主角可以再更有魅力一點

  而且一般沒有碰過遊戲的人，可能連吟遊詩人會魔法都不知道


  然後紅袍法師其實也是有點怪

  最終那個紅霧，由於場地太大，擴散得超級慢，量又有夠少

  雖然不知道是不是法師斷法跑去扁主角群的關係啦

  但我就覺得，嗯？就這麼點紅霧？

  還有瞬移的法術難道不能多用幾次就好嗎？

  可能是有cd時間？但我就沒玩過龍與地下城，只覺得她戰鬥智商不高



  好啦，結論就是，

  我覺得這部可以看，但是建議在電影院看吧

  不然看點本來就少了，在家看連特效都打折扣了，可能會影響觀感


  --


  「要死大家一起死啦！」-----呂布(西元199年)





  --

  我比較喜歡女主角的打法，贊柯那段我覺得套路的味道太重

  真的假的啦？我那場幾乎沒人笑，印象中唯一一幕笑就是梟熊海扁紅袍法師

  一排坐十人左右，大概6~7排吧

  我在欣欣秀泰看，供參考'
