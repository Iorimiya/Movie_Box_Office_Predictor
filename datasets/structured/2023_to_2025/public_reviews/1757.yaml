url: https://www.ptt.cc/bbs/movie/M.1681140878.A.042.html
title: '[新聞] 《龍與地下城：盜賊榮耀》導演已經在考'
content: '《龍與地下城：盜賊榮耀》導演已經在考慮續集



  《龍與地下城：盜賊榮耀》目前受到評論家和票房的強烈歡迎，當然，這部奇幻電影的續集

  已經引起了很多人的關注。在對polygon的新採訪中，電影約翰·   法蘭西斯·   戴利和喬?

  戈德斯坦的編劇兼導演談到了他們對續集的看法。


  當被問及是否有可能拍攝另一部電影時，戴利說「當我們加入這部電影時，我們從來沒有打

  算製作特許經營權。我認為這會影響我們完全專注於手頭電影的能力。許多製片廠犯的

  主要錯誤是本末倒置，在他們製作一部好的電影之前就開始製作一個電影宇宙。因此，對我

  們來說，首先也是最重要的一點是把這件事做好。


  戈德斯坦似乎確實喜歡續集的想法，但他希望它涉及與第一部電影相同的演員陣容。續集的

  好處是，你不必花太多時間介紹。觀眾知道他們，你可以更快地跳入劇情。顯然，我們對演

  員和他們扮演的這些角色都有很大的感情。但我們想在此過程中引入一些新人物，當然

  還有很多新怪物。


  在採訪中，導演們確實考慮了續集的想法，說他們還想增加一些更著名的D&D地點，同時升

  級角色以賦予他們新的能力。例如，讓克里斯·   潘恩（Chris Pine）的埃金（Edgin）使

  咒語

  ，他們似乎對此感到興奮。


  甚至有可能將Drizzt Do''urden 一個來自宇宙 粉絲最喜歡的角色——也包括在內。總

  的來說，在《龍與地下城：盜賊榮耀》續集中有很多地方可以涵蓋。希望我們很快就會看到

  一個。








  --'
