title: '[極好雷] 《龍與地下城：盜賊榮耀》'
content: '簡單打點心得，


  首先絕對值得一看！！


  劇情不拖泥帶水，簡單俐落，運鏡也十分流

  暢，整個世界故事觀非常的吸引人，主要角

  色都刻劃的很鮮明，都有表現出該有的特色

  奇幻生物也很大量出現，這次雙編導的非常

  成功。


  該好笑的地方也很好笑，該動作打戲的地方

  也不馬虎，然後蘇菲亞莉莉絲實在太可愛




  但可惜的地方還是有，高日運動會橋段可惜

  太短，喪失一點刺激感，反派也沒有描述的

  太強或絕望感，很公式化的解決，算是小可惜

  的地方。



  在台中新光LUXE廳觀看，特效跟畫面也都非

  常的精緻明亮，非常推薦在LUXE廳看，IMAX

  非必要，非常推薦一看。



  有一個片尾片段，還算好笑。


  -----

  Sent from JPTT on my Xiaomi 21091116UG.


  --'
