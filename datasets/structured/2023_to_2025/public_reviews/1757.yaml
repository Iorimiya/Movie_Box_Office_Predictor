title: '[好無雷]  龍與地下城：盜賊榮耀'
content: '感謝電影版以及辦活動抽票的廠商，

  讓小弟在入伍前有機會看到這部很有興趣的電影～

  還是沒看過的美麗華IMAX！

  不過不知道工作人員是不是睡過頭太晚到，

  原訂一個小時前取票，

  卻大概晚了半個小時才拿東西來準備開始XD


  由於是特映，

  進去觀影前有提醒拿出手機並轉靜音，

  工作人員會將手機裝袋密封後再歸還，

  待出場後再自行取出。

  這場目測還蠻多中老年人，

  也有人不能接受手機要裝袋跟工作人員盧，

  或許之後可以在排隊的時候先跟大家預告一下～




  ————無雷心得文————-


  自己雖然喜歡玩遊戲以及奇幻題材，

  但不是龍與地下城的玩家，

  對其的了解多是透過其他影集（廢柴聯盟、怪奇物語），

  不過覺得即使不甚瞭解遊戲背景與機制，

  也不太會影響觀影體驗，

  頂多是看到有些行為或對話覺得有點妙的時候，

  聽見有些觀眾笑得很開心，

  因此大概猜到是內梗。


  在場景與拍攝上，覺得很讓人滿意，

  有不少的大景、有趣的細節，

  不少的打鬥與魔法場面，

  以及一鏡到底的精彩追逐；

  自己很喜歡，不過同行友人覺得頭有點小暈，

  大家可以自行斟酌要不要看IMAX XD


  劇情安排上，

  不到驚艷但也還算合理，

  以遊戲（？）翻拍來說應該已經超過水準了。


  本片有少數幾處 jump scare，

  不過氣氛上還算可以猜測大概在什麼時候，

  不會到做不了心理準備～


  最後在經典改拍上最容易大爆死的演技方面，

  我覺得可能因為演員們硬底子夠，

  不會讓人太出戲，十分難得。


  整體而言，

  雖然因為聚焦於主角等人的冒險，

  因此沒有完整的背景介紹（關於不同職業、種族、能力、魔法設定和版圖等），

  但即使看之前絲毫不了解龍與地下城，

  放輕鬆享受場景、配樂以及流暢的打鬥和魔法，

  應該也能夠值回票價！


  --'
