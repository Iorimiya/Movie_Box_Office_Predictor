content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n給分:10分\n原本應該是9分,因為有一個場景有點假\n\
  不過因為過程中太多我熟悉的DND地名\n加一分\n\n\n\n\n\n\n\n\n\n其實沒啥雷點\n老實說\n在去看這部之前,我是完全沒有抱著\"他媽的就只是DND的電影\"\
  \n能有多好看?\n這種遊戲界小眾片應該不會吸引一般人吧\n看過之後我真的覺得我錯了\n靠杯好看啊~~~~\n\n滿場笑點不斷\n尤其是開頭那隻鳥 .....\n\
  前後呼應\n根本是完美成轉起和\n有笑點\n有美女(德魯伊滿可愛的) 希望她能紅\n過程中提到的劍灣\n柏德之門 絕冬城\n也很讓人懷念\n當然也有缺點,某一兩個場景看的出來有點假\n\
  但可以接受\n導演的運鏡我覺得很好\n特別是德魯伊在逃離城堡那一段\n看了真的是一氣呵成\n屌打許多商業超級英雄大片\n這片真的不希望賣賠錢\n希望他能長賣\n\
  今天去看,我那一廳幾乎客滿\n滿開心的\n雖然我沒看過捍衛任務4\n但如果用前三集比較\n個人私心覺得這片我比較愛(很多)\n捍衛任務有時候一直打到有點膩了就是...\n\
  PS:我最後爬聞才知道\n   原來那個城主是休葛蘭\n   難怪他的表情都是戲...\n\n--"
