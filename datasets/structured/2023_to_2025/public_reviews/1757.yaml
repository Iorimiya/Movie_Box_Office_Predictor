url: https://www.ptt.cc/bbs/movie/M.1680887035.A.FB0.html
title: '[極好無雷] 龍與地下城：盜賊榮耀  真的好讚... '
content: '《龍與地下城：盜賊榮耀》真的好讚…..  9/10分


  原以為會是粗製爛造的B級片(孰不知預算竟有1.5億美元！)

  畢竟看過太多類似的電影

  結果都是搔不到癢處

  或是格局太小、文戲太多…等

  但《龍與地下城：盜賊榮耀》從頭到尾給好給滿

  人物、故事、場景、寶物、魔法甚至是運鏡構圖

  都非常用心

  好幾段運鏡真的很棒

  還有很多劇情橋段也都很用心轉折跟鋪陳


  好幾次都想說：

  「那個地方一定不會去啦！」

  「阿等等那邊一定會草草帶過！」

  「那段一定是之後續集才會有吧？」

  結果都是被打臉

  甚至是更多的出乎意料

  不只沒偷懶 還給你更多場面！

  除了特效一點點小假 但真的是瑕不掩瑜


  整個觀影過程真的就像在玩美式RPG一樣

  從角色介紹 到慢慢的組織隊伍

  為了破主線 解鎖其他支線

  支線又衍伸出更多事件

  也漸漸的刻劃出每個角色的個性

  加上演員都演的恰如其分

  很有自己的個性

  看到最後真的滿感動的…

  真的會覺得：「這…這真的還可以一直看下去嗎！好讚…」

  甚至到了捨不得故事結束的感覺

  　

  不知道沒接觸過美式RPG的人

  看了會不會有這些感觸

  我絕對算不上什麼骨灰級玩家

  只是有玩過一些 也耳聞過大概的資訊

  像是電影中有提到「絕冬城」、「柏德之門」這些地方

  雖然沒玩過

  但聽到小時候有聽過的遊戲名稱

  就有一種參與感 覺得很讚


  結論

  我真的很喜歡《龍與地下城：盜賊榮耀》

  好久沒看到這麼純粹的角色扮演電影

  場面豐富、角色飽滿、不拖泥帶水、娛樂性足、故事背景吸引人

  接觸過美式RPG的不會後悔

  對這領域不了解的也非常推薦可以試試


  以上！

  　


  --


  無雷 電影/影集短評IG：




  --'
