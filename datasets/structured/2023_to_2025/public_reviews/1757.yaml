title: '[新聞] 克里斯潘恩對《龍與地下城：盜賊榮耀》 '
content: '克里斯潘恩對《龍與地下城：盜賊榮耀》續集有信心！談到回歸演出秒點頭




  今年稍早上映的奇幻動作電影《龍與地下城：盜賊榮耀》雖然在觀眾與媒體之間皆獲得了

  極高的評價，但因為差強人意的票房表現，讓不少觀眾擔心是否能夠順利發展成一個系列

  。


  不過，在片中飾演吟遊詩人艾德金的克里斯潘恩最近也透露，他對於《龍與地下城》電影

  版的未來發展懷抱著十足的信心。


  在為迪士尼新作《星願》接受《GamesRadar+》網站的訪談時，克里斯潘恩也稍微提到了

  《龍與地下城：盜賊榮耀》，並表示他對於重返這個系列的可能性感到相當樂觀。



  克里斯潘恩在談到續集時表示：



  「我確實聽到了一些傳聞，雖然我目前還一無所知，但我對於續集的成形很有信心。」


  而在被問到是否有意回歸演出時，他則給出了相當肯定的答案。





  經典桌上角色扮演遊戲《龍與地下城》在今年可說是引發了不少話題，除了《龍與地下城

  ：盜賊榮耀》電影版之外，同樣基於《龍與地下城》規則與世界觀的熱門電玩遊戲《柏德

  之門 3》也創下了相當驚人的銷售表現與評價，不僅在今年的金搖桿遊戲獎上獲得了終極

  年度最佳遊戲等大獎，也在有遊戲屆奧斯卡獎之稱的「TGA 遊戲大獎」中入圍了年度最佳

  遊戲等 8 項大獎。


  《龍與地下城：盜賊榮耀》由喬納森戈爾茨坦以及約翰法蘭西斯達利執導，除了克里斯潘

  恩之外，其他參與本片的演員還包含了休葛蘭、蜜雪兒羅德里奎茲、賈斯提史密斯、蘇菲

  亞莉莉絲、雷吉尚佩奇以及黛西希德。




  雖然《龍與地下城：盜賊榮耀》在上映後於爛番茄網站獲得了 91％ 的新鮮度以及 93％

  的爆米花評分，但本片最終僅在全球帶來了 2 億 800 萬美元的總票房。


  考慮到《龍與地下城》世界觀的龐大程度，《龍與地下城：盜賊榮耀》續集幾乎有著近乎

  無限的可能性，而在這之前，派拉蒙影業也曾談論過為本片推出續集的可能性，表示之後

  雖然依舊有可能推出續集，但在預算上可能會有所縮減。





  --'
