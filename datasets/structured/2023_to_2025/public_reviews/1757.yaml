url: https://www.ptt.cc/bbs/movie/M.1682075330.A.ED1.html
title: '[好雷] 龍與地下城：盜賊榮耀'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~
























  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  人生看過的奇幻電影中最棒的長鏡頭，我決定就頒給《龍與地下城：盜賊榮耀》了。片中

  那一段長鏡頭畫面帶來的震撼與感動絕對稱得上是驚喜，可以說光這段呈現就值回票價了

  。


  其實數月前看到《龍與地下城：盜賊榮耀》的預告時，一開始看海報字體我覺得有點Ｂ級

  片的味道。但基於對《龍與地下城》這個角色扮演類桌遊始祖的景仰，加上也的確被預告

  內容吸引，所以還是二話不說地跑去看，只能說慶幸當初沒有因Ｂ級片味而卻步。


  《龍與地下城》是一套角色扮演類型的桌遊，出過很多版本，有很龐大的世界觀設定，遊

  玩時會由一位玩家擔任主持人，玩家們可以選擇依循遊戲本身的劇本，或是強一點的主持

  人會自己設計一套劇本來進行遊戲。高中的時候曾經跟朋友跑過團，但因為這個遊戲相當

  龐大，通常玩起來可能要每週一兩天的玩上數週，後來也就沒繼續了，我們的「遊戲存檔

  」大概也早就不知道跑哪去了。整個遊戲的核心就是世界觀，所以改編成電影某種程度上

  比起劇情，世界觀的還原程度或許是遊戲迷更在意的事情。


  對於不夠熟悉遊戲的人如我，或是根本沒玩過的觀眾，只要你喜歡這類型的奇幻作品，一

  定也會深深著迷在電影架構出的龍與地下城世界中。尤其是我開頭提到的長鏡頭，指的就

  是電影中德魯伊多莉克從小蟲逃出塔樓後一路變身到最後變成鹿逃出城堡那一段，一鏡到

  底的呈現德魯伊如何因應環境變化成各種動物躲避追捕，流暢的變身以及動作設計的巧思

  ，我認真覺得對於奇幻作品的呈現來說這就是頂點了。相較之下還會覺得《魔獸世界》裡

  的德魯伊好廢，看看人家有幾段變身XD


  電影不只充分呈現了《龍與地下城》的世界觀與背景設定，劇情也是相當令人讚賞。也許

  故事有點老哏，但是劇情的合理度、人物動機以及轉折處都合情合理。再加上融入滿滿的

  笑點，有些笑點是即使你剛看到開頭就能猜到結果，甚至可能在預告中就已經看過，但實

  際呈現還是會讓你笑到流眼淚。更不用提事前完全不知道的驚喜，尤其是布萊德利庫柏的

  客串，那一段我狂笑，不只是驚訝他跑來客串，還加上他的角色以及與蜜雪兒羅德里奎茲

  的對手戲所呈現出來的反差感。而聖騎士在橋邊念的那一長串規則也讓人會心一笑，有玩

  過任何桌遊的人都知道聽到一長串複雜規則時的心情會是如何。還有聖騎士把「狗娘養的

  」解讀成「所以妳把他的過錯歸罪到他母親身上？」這種超直線條的思考方式也非常有趣

  。


  除了歡樂，讓我驚訝的還有這部居然也有淚水。我已經很久沒有對奇幻或科幻電影中的角

  色死亡這麼有感了，上一個讓我眼眶泛淚的角色死亡橋段好像要追朔到鋼鐵人；而《龍與

  地下城：盜賊榮耀》甚至馬上就猜得到等等角色會復活，但我還是被綺拉的回憶與埃德金

  的抉擇深深打動，就知道這個氣氛塑造的有多好。


  我很喜歡克里斯潘恩飾演的埃德金，也許跟他的職業有關吧，吟遊詩人不是一般遊戲中常

  見的玩家可選職業，可是我很喜歡這種角色散發出的自由不羈感，以及這個職業有種以旁

  觀者姿態近距離紀錄一切的感覺，所以除了法師，我最喜歡的職業就是吟遊詩人。而埃德

  金一開始單純的動機也是我覺得有趣的地方，我很喜歡這部電影一開始只是個由小人物們

  開展的小故事，但卻捲入並阻止了一個可能發展成大事件的契機，最後事情解決，而世界

  好像不曾面臨極大的風險，小人物們回家過著各自平靜的生活。


  蜜雪兒羅德里奎茲飾演的野蠻人戰士霍爾嘉相當令人驚艷，唐老大真的不行啊，你女朋友

  的演技海放你好幾條街啊～結局能這麼動人，霍爾嘉的表現也是功不可沒，而且放眼整個

  好萊塢，能把這個角色演得這麼到位的大概也只有她了。不過喜歡半身人男性，而且後來

  看到另一個半身人時那個眼睛為之一亮的神情，真的很有趣。


  電影架構在《龍與地下城》的龐大世界觀底下，而沒有特定的主線是這個作品的特色，如

  果日後要發展系列電影，這也可以算是一種優勢，畢竟近來超英電影實在是看得有點膩，

  我連《蟻人與黃蜂女：量子狂熱》跟《沙贊！眾神之怒》都還沒看；也好久沒有這種中古

  歐洲風的奇幻電影了，而且這部電影的魔法效果看得我好感動；再加上沒有特定主線，表

  示編劇可以更自由地撰寫想說的故事，不用拘束在既有主線的框架下，甚至是為了政治正

  確而修改既有主線反遭粉絲圍剿。不過最後這一點也可能是值得擔憂的地方，畢竟這就真

  的非常看重編劇的功力。


  作為一部主打世界觀的奇幻電影，《龍與地下城：盜賊榮耀》是個不錯的開始，雖然這塊

  招牌相對而言比較小眾，但也希望這次電影上映後能帶動熱潮，擴展一個新的奇幻電影世

  界觀。


  --'
