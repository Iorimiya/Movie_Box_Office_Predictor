url: https://www.ptt.cc/bbs/movie/M.1681049221.A.468.html
title: '[普負雷] 龍與地下城-盜賊榮耀'
content: "今天跑去看了這部movie版一片好雷的電影\n因為自己本身高中因緣際會看了龍槍系列\n也剛好趕上那一陣子AD&D遊戲熱潮\n不敢說自己是個AD&D忠實粉絲\n\
  (畢竟當時窮學生，也不像現在資訊獲取如此容易)\n只能說自己對這個桌遊體系曾經非常嚮往\n \n先說說優點:\n \n1.電影中穿插了各種被遺忘的國度的世界觀\n\
  \  諸如柏德之門/絕冬城/劍灣/幽暗地域/魔鄧肯等名詞\n  感受的到導演編劇的用心與誠意。\n \n2.不少笑點有戳中我\n \n3.Sophia Lillis\
  \ 好正，以前看it就覺得她有種說\n  不出來的漂亮，現在還是說不出來，但更漂亮了\n \n4.休格蘭把反派的油條感詮釋的蠻好的\n \n優點大概就只能講出這幾個了\n\
  缺點的話倒是不少\n \n1.福吉為了和主角搶女兒，決定把主角殺了，\n  這甚麼汪洋般的殺意，鼻屎般的動機。\n \n2.不知道為什麼，總覺得這部片的追逐戰速度感\n\
  \  都沒有表現出來，大家很賣力在跑，但沒甚麼位移\n \n3.競技場主角在轉角處看著Displacer Beast的幻影，似乎\n  完全沒發現另個方向就是本體，可見視角是這麼的窄的嗎?\n\
  \ \n4.大費周章把人群聚集起來，然後也不封個門\n \n  硬要在下賭盤的房間當著一群人面前施展法術，蘇菲娜妳\n  是有多中二阿?\n \n  主角噴一堆珠寶在競技場外面，競技場內的觀眾馬上就都\n\
  \  得知訊息而且快速的疏散淨空，徒留蘇菲娜在那裏法術施\n  一半大喊NO~~~~。這疏散速度估計不到三分鐘吧，大巨蛋\n  要不要參考一下???\n \n\
  \  反派前面搞得神神秘秘邪惡邪惡的，最後壓軸就這蠢樣???\n  真的是只差沒講那句人家女生耶了\n \n5.霍爾嘉葛屁的時候鏡頭帶過一堆她和綺拉相處的時光，說難\n\
  \  聽點一開始交代雙方關係交代的這麼簡陋，情緒根本沒有堆\n  積，這一段看的除了尷尬還是尷尬。\n \n6.印象裡被遺忘的國度裡的龍是上古高智慧，另人類絕望的生\n\
  \  物，結果這部片來個癡肥搞笑角?你可以說導演想要不落俗套\n  ，但是主角群和這隻肥龍互相追逐，緊湊感根本是0\n  即使主打輕鬆搞笑風格也不用這樣搞吧\n\
  \ \n7.賽門沒辦法綁定頭盔自我懷疑，主角群起口角，到主角自責\n  其實是自己害死老婆，接著馬上主角群又團結在一起，演繹\n  手法真的是老套又粗糙。\n\
  \ \n8.克里斯潘恩的臉實在很不適合奇幻類電影，這部分就個人看法\n \n9.Elminster 前面機機歪歪的，後面就這樣被打了一拳後就認同\n  賽門????\
  \ 這三小朋友???\n \n10.賽門和蘇菲娜彼此互相施展Bigby's Hand(應該是吧)，這段\n   精彩度實在不太夠，最後還是掰斷手指頭結束的???三小朋友\n\
  \ \n整體來說，其實感受的到製作團隊的誠意與用心，也能夠理解導\n演想要的是一種搞笑風格的奇幻片，但是各個環節的呈現真的都\n粗糙的只能算是B級片水準而已\n\
  \ \n雖然進電影院前本來就沒有期待能看到史詩般的大作，但是整體\n下來覺得連說是個以D&D為背景的輕鬆小品都很難稱上\n所以個人覺得真的是只能給普下雷而已\n\
  \ \n--\n...and this one's for grandma,\nwho said I'd never amount to anything more\
  \ than a butterknife!!\n \n--"
