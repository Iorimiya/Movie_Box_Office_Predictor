content: '龍與地下城 盜賊榮耀

  整體劇情挺順的，美術(場景、服裝)很強，人體鮮明立體，打劇也挺流暢的，笑點還ok。


  之前看影評很好，所以看完反而覺得還不錯而已，整體70-75分吧。


  但看得出世界觀很龐大，有很多故事可以說，之後若有續劇還是會進影城。


