url: https://www.ptt.cc/bbs/movie/M.1680603754.A.EC3.html
title: '[極好雷] 龍與地下城-盜賊榮耀'
content: '近年來難得一見，


  熱鬧又好看不沉悶，


  而且觀影無門檻的奇幻電影。



  我這麼說是因為近年的奇幻類改編電影，


  真的太難看了。


  不是魔改又摻雜製作方的私心，


  就是連一個完整的故事都講不好，


  而且看完你別說共鳴了，連角色都記不住。



  但這部不一樣，


  你就算完全沒有接觸過dnd的世界觀，


  不了解其中的術語、背景都無所謂。


  它的故事都是從角色出發，


  而且是要讓你先愛上這些角色，


  當你愛上他們的故事會引起共鳴，


  然後你就很快的接收這一切，甚至想了解更多一點。


  我覺得這才是改編題材想打開市場的正確方式。


  盜賊榮耀很好的作到既能滿足老粉絲的需求，


  又能吸引到新的觀眾。就算你完全沒跑過團，


  看過什麼厚厚一本的規則書都不會影響你觀影。



  裡面的人物塑造的都很飽滿，


  讓你有共鳴，無論是喪妻失女的吟遊詩人、


  為愛拋棄族人，結果又被愛人拋棄的女野蠻人、


  明明是大法師後裔卻只會使一手三流魔法的術士兼小偷，


  或是因為魔人身分而被父母拋棄的德魯伊。


  每一個角色都會讓你喜歡，


  連那個中間高大上只是來串場的聖騎士，


  你也會覺得他真的很帥，帥到翻掉。


  就連休葛蘭演的騙子城主，老實說，


  到最後一刻我也是對他討厭不起來，


  連紅袍光頭女巫，也讓人覺得好正。




  而且特效也不會令人覺得假假的，


  完全展現出一個奇幻世界的宏大世界觀，


  不論人物、角色、種族、背景，


  編導很巧妙的化物無聲，把這些東西塞到電影中，


  又不會讓人突兀。



  雖然整個故事結構滿簡單的，


  就是奇幻版的劫盜電影，


  你可以在不同的作品中看到它的劇情影子。


  像玩命關頭、瞞天過海、出神入化、甚至星際異攻隊。


  都有類似的情節，一夥人為了某種目的，


  而且要攻陷某種難攻不破的金庫。



  其實，觀眾早就猜到劇情發展了，


  故事本身也沒有什麼太大的反轉，


  但它的重點是很好的擺在角色上，


  還有觀眾跟他們一起經歷過的過程，


  你很能享受跟他們一起遊行、成長的過程。



  事實上，我看捍衛任務4的時候，


  雖然覺得打得很精彩，但中間還是一度有覺得打到不耐煩，


  出去上廁所又回來的，其實跳過一小段都沒差。



  但這部電影，我全程都很享受，完全沉浸其中，


  不會有絲毫的不耐、煩燥感，甚至最後的片尾，


  我也不知道會有彩蛋，我就只是想看完片尾，


  捨不得起身。





  感謝ptt一堆的好雷文，我才想去看這部電影，


  不然其實沒有預期想入場的。


  實在是近年來奇幻類改編作品，


  真的普遍令人太失望了。



  盜賊榮耀雖然不是最好的，甚至故事上有點老掉牙，


  但它說故事的手法卻是近年來難得一見的好改編方式，


  不賣情懷唬粉絲、不故弄玄虛整新觀眾。


  它讓奇幻改編、甚至遊戲真人化等作品，


  都看到一線曙光，知道什麼才叫真正的作品打開方式。





  只是我一直在想一個問題。


  為什麼女兒小時候明明是黑娃娃，


  長大後卻變白人了@@



  --'
