url: https://www.ptt.cc/bbs/movie/M.1684065290.A.B2C.html
title: '[好雷] 龍與地下城:盜賊榮耀。'
content: "文長，圖多。\n\n差不多一個月之前看了龍與地下城:盜賊榮耀。\n\n我習慣寫心得的時候要畫配圖，所以把自己推入了某種深淵。\n\n以下會提到除了龍與地下城的其他遊戲。\n\
  以及會講一些我覺得如果喜歡龍與地下城的電影的話。\n可以再看什麼作品或玩什麼遊戲。\n\n首先圖：\n\n\n這是我心中覺得龍與地下城會出現的狀況。\n也是我玩其他遊戲的時候常常出現的狀況。\n\
  \n嗯嗯嗯嗯嗯嗯～\n想想就覺得好棒喔來看吧～\n\n我先從開始說起：\n畫面部份我覺得非常棒，對我來說這樣的特效就足夠了。\n因為我還滿喜歡玩遊戲的，所以各種地形出現時都非常開心。\n\
  得知要去地底時感到非常興奮。\n地下的環境也還滿符合我對於奇幻世界的想像。\n\n最棒的部份當然是德魯伊在城堡中數次變身逃離的那段。\n\n唯一比較覺得可以加強的地方是前夫半身人那邊吧，因為就真的滿明顯很假。\n\
  可是就算這樣我在那邊居然有點泛淚。\n\n因為霍爾加一直很在意前夫的事。\n主角艾德金都說：拜託！他都寫信跟你分手了！你還要回去找他究竟？\n她到家後面帶微笑說：他重漆過窗戶欄杆了。\n\
  雖然是打鬥擔當可是其實心思很細膩。\n結果一進去整個錯愕。\n\n我也很喜歡半身人前夫說：現在的妻子不會讓我一個人在夜晚哭泣。\n霍爾加都能發現家具的不同難道不能發現枕邊人心情不好嗎。\n\
  半身人前夫應該也是有考慮到霍爾加離開了自己家園，很悲傷。\n所以也隱忍了自己的難過吧。\n我覺得互相都是很體貼的一對只是很可惜，就是沒辦法在一起。\n兩人就很和平的分手了。\n\
  \n再來我知道製作小組很認真的做了很多實體模型。\n但抱歉那個大魚還有小貓真的動態…很…不像…。\n\n\n劇情部份很簡單，但很順暢，看得懂，邏輯也沒有不通順。\n\
  沒有什麼大奸大惡或是故弄玄虛之類的。\n\n對我來說幾乎每個笑點都很棒。\n很喜歡他們之間的對話。\n\n像是德魯伊在城堡變身完之後，霍爾加很得意的說：所以還是有變成鹿。\n\
  \n或是福吉說：我…我不想看著你死。所以…我現在要離開房間了。\n原來不是要救，而是要先走的部份啊。ww\n\n還有福吉要索菲娜告訴領主們金庫的魔法有多堅固時。\n\
  福吉：告訴他們這是什麼魔法～\n索菲娜：魔鄧肯。\n領主：？？？\n索菲娜：…。\n福吉：唉～總之就是很棒啦～\n\n\n吟遊詩人艾德金：\n我喜歡他完全沒有特別耍帥的部份。\n\
  在那邊搓繩子搓很久也沒辦法啊ww\n他厲害的點是對周圍人的感知，然後就算事情進行不順利也不會一直埋怨。\n死屍問問題失敗那邊說：很棒～鏟子呢？很可愛ww\n\n\
  如果有人想體驗吟遊詩人的話：\n可以考慮玩玩看 Ghost of a Tale 這款遊戲：\n\n主角是一隻花栗鼠（吟遊詩人）。\n他因為一些事情被誣賴所以關到牢裡，為了要重回妻子身邊所以逃獄。\n\
  \n\n守衛是老鼠，不能被發現，因為主角完全沒有武力。\n但可以使用陷阱之類的打倒敵人。\n\n\n穿著敵人的盔甲，才可以騙過敵人。\n你的魯特琴不收好嗎？\n\
  \n\n逃到外面去的時候日出了，戴著小偷面罩的吟遊詩人。\n很可愛ww\n\n這個遊戲的光影變化很棒，而且角色設定又很可愛，美術又很好。\n推薦。\n\n戰士霍爾加：\n\
  冷面笑匠，心思細膩但是性格又很直所以就算心思細膩又好像沒有發揮成功。\n要被砍頭的時候故意問對方的斧頭多久磨一次。\n（我覺得雖然是拖時間用的，但霍爾加也是真的在意ww)\n\
  \n電影裡面提到很愛吃馬鈴薯。但是那個馬鈴薯其實又沒特別調味。\n這時候還是要翻出大家都喜歡的香草社設定集。\n\n\n我的遊戲跟設定集是PS3版本的。\n\n\
  讓我們翻到紮營料理部份。\n\n這是其中一半的料理。\n\n遊戲中是這樣煮這樣吃的：\n\n使用上一關打倒的魔物作為食材。\n\n附贈：\n噗卡餐廳與兔子咖啡廳甜點：\n\
  \n\n\n\n要…要餓死…！\n\n術士賽門：\n前面感覺很衰但是後面很厲害。雖然有一點血統至上（？）嫌疑。\n但沒關係因為他是靠自己解決的。\n\n要是想體驗術士的生活的話，\n\
  找得到的話，可以試試看The Immortal這款遊戲：\n\n超級麻煩的生活ww\n而且遊戲完全不會教玩家到底要幹嘛，要自己想出來。\n法術用完了就差不多死定了（但他還有乳酸戰鬥術所以還有機會繼續）。\n\
  遊戲中很有趣的是怪物的死法，非常多采多姿。\n\n德魯伊多莉克：\n很可愛很認真很有能力。\n我覺得電影中有特別帶到她有一條小尾巴，還捲在馬車上那段。\n非常細膩，既然人物角色有設定就要給觀眾看到，非常有愛。\n\
  \n聖騎士贊克：\n很帥。但是很悶騷這點很有趣。\n感覺他覺得主角總是要最後才出場，所以都會姍姍來遲。\n最後福吉逃跑，他站在上面看他，好像在說繩之以法就讓我來。\n\
  \n我也很喜歡他去救小貓的時候，主角一行人在旁邊看。\n艾德金一臉不屑，斜眼看他離開，想說這傢伙是怎樣的表情ww\n\n還有主角小聲說我討厭你。他聽到了就笑起來很有趣ww\n\
  \n並且最後走直線離開很硬要但很可愛ww\n\n巨龍鐵匠希博恰德：\n\n欸…？\n不是啊？\n龍…我威嚴的龍，我尊榮的龍呢…？\n\n但是…好可愛喔喔喔喔ww\n\
  \n我當下其實想到的是皮克敏2代地底洞窟之中的BOSS。\n\n就是這個影片第一隻BOSS。\n\n對啊？\n你的脖子去哪了龍的脖子很長耶？\n\n一般的紅龍不是應該：\n\
  \n像這個開頭影片這樣嗎？\n\n電影看完之後我很想知道胖紅龍的故事所以去查了。\n不過我查到的也沒有特別說到他怎樣了。\n我好想知道他的生態喔。\n\n城主（詐欺師）福吉：\n\
  我不知道休葛蘭有演，所以看到他的時候覺得很驚喜。\n但我的記憶還停留在他年輕的時候。\n他怎麼可以把那種話多煩人老害演那麼像…\n\n紅袍法師索菲娜：\n很喜歡他的戲服，雖然台詞很少但是他從頭到尾要不閉眼睛也是很辛苦。\n\
  我也滿喜歡他就是叫他幹嘛他就很直接的做。\n畢竟是死靈法師可能不想考慮人情世故？\n（直接把冰魔法放在手上泡到福吉杯子裡）\n\n\n我覺得音樂部份還好沒有特別打動我。\n\
  就是中規中矩吧。\n但宣傳是用齊柏林飛船的歌我喜歡。\n\n畫圖的時候我是聽：\n\n這首歌。\n因為覺得這首BGM很適合幽暗地域。\n\n感想：\n非常推薦。\n\
  我覺得電影把事情始末都交待的很完整，打鬥也不錯，又好笑，特效也很用心。\n也不用特別一定要玩過龍與地下城才能去看，其實都還滿好懂的。\n\n如果沒興趣玩電子遊戲想玩桌遊的話：\n\
  我個人覺得小老鼠與神秘客很棒。\n\n外盒是這樣。\n\n\n內裡模型，網路上面有人上傳了上色版。\n\n如果真的很沒時間，不想玩電子遊戲也不想玩桌遊。\n\n\
  可以考慮看漫畫。\n\n迷宮飯。\n\n目前出到12集。\n我就不拿下來了，只拍冒險者聖經（設定集）。\n是一個很好看的奇幻冒險漫畫，主要是邊冒險然後邊吃飯邊拯救親人。\n\
  快要完結篇了，有確定要出動畫。\n\n\n他的料理長這樣。\n我自己也試作了一個。\n滿意。\n\n最後附贈：\n當初魔龍寶冠的心得：\n\n\n被囚禁的妖精（雖然我畫不好）。\n\
  \n希望，朧村正可以連同DLC全部重新出在steam上。\n希望龍與地下城可以拍第二集。\n\n\n--\n\nThere is no dark side of\
  \ the moon, really.\nMatter of fact, it's all dark.\n\n--\n\n對欸經你這麼一說…\n她其實已經忍了耶…\n\
  \n\n主唱常常那樣亂叫啦ww\n\nLed Zeppelin - Whole Lotta Love (Official Audio)\n\n1960經典老搖滾團。\n\
  有興趣的話可以找他們精選輯來聽。\n\n基本上一定要聽的：\nImmigrant Song\nD'yer Mak'er\nBlack Dog\nStairway\
  \ To Heaven（被樂器行禁止彈奏因為聽到想吐）\n\n\n60年代的團都很鬼神喔。\n老搖滾真的都很好聽嗚嗚嗚嗚。\n\n\n胖ww\n\n我心中一直很喜歡奇幻生物，總覺得他們很帥氣。\n\
  突然來個胖的我被震懾到ww\n但想想對啊也不是不可以。就變得很喜歡了。\n\n我不想破梗不過如果去看迷宮飯的話。\n因為主角很懂奇幻生物（是奇幻生物宅）。\n\
  他面對奇幻生物的時候，有用他自己自創的特殊的方法應對。\n有些很好笑，自己幻想如果自己是魔物的心情的話，會爆笑出來的感覺ww\n\n\n他在講解橋的規則的時候我有聽（遊戲宅的想法：好，攻略來了要看一下）。\n\
  贊克：先直走但是每走五步要橫向移動一步。\n我：嗯，很簡單嘛。然後呢？\n贊克，但是橫向一步之後奇數時要再橫向一步。\n我：…嗯？所以先五步橫一步，然後一步（奇數）就要橫向一步。嗯然後？\n\
  \n（賽門移動）\n\n我：啊…他走過去我就…被影響沒在聽了…\n\n（踩)\n\n我：啊…\n\n\n就是因為覺得配圖會比較好所以畫了第一張，那麼多鱗片我快死了。\n\
  （我自己會再繼續畫啦，不過心得還是先發不然永遠不用發了。）\n\n\n好作品才會讓我覺得嗯嗯嗯來畫畫吧，雖然說沒有畫很好。\n\n\n很棒耶。\n因為我一個人看，所以沒有得到那個骰塔。\n\
  不然我還滿想要的ww\n\n                                          05/14 23:58"
