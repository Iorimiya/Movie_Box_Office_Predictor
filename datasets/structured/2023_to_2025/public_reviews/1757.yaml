title: '[好雷] 龍與地下城：盜賊榮耀'
content: '雷文防雷資訊頁





  人權圖

  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  總之，這部電影以娛樂性而言是真的很傑出。


  而作為龍與地下城的經驗者，很容易可以看到故事中保留的人物卡元素。


  比如克里斯潘恩演的主角在一開始的假釋庭上講的故事，其實就是玩家給自己的腳色設定

  的背景故事。


  而故事舞台的絕冬城，更是知名電子遊戲柏德之門系列的玩家十分熟悉的地方。


  另外還有某位聖騎士腳色。其發言就完全是DM控制的NPC會有的言行。


  （完全是基於守序善良陣營的立場。


  不過讓這部電影吸引人的還是那些經過巧思安排的無冷場搞笑環節。


  讓人看得十分開心。



  以至於忽視了某些腳色過於誇張的技能表。（可以在一天內變身多次的德魯伊？）


  (P.S.查過規則書後，才知道高等級的德魯伊的確可以達到一日內五次變身。

  所以五級的多利克可能是因為非人體質而有加強？


  不論如何，我還是蠻喜歡這個作品的。


  雖然你們明明到了幽暗地域，結果竟然沒有卓爾這點真的讓人小遺憾。


  黑龍骰塔也很讚。（雖然有骰子會卡住的小問題）





  -----

  Sent from JPTT on my Samsung SM-A217F.


  --'
