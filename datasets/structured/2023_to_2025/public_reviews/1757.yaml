url: https://www.ptt.cc/bbs/movie/M.1692085240.A.C4C.html
title: '[心得] 龍與地下城：盜賊榮耀'
content: '這部聽說是由電玩改編而成的，整劇下來挺好看的

  大致上是在說埃德金和霍爾嘉

  為了撫養埃德金的獨生女綺拉從事盜劫的工作

  並組成了一個團隊

  然而最後一次的行動被隊員福吉騙去偷復生牌而被抓

  出獄後發現福吉變絕冬城城主、帶著綺拉一起生活

  並欺騙綺拉說他父親不要她

  叫紅袍法師，索菲娜把埃德金和霍爾嘉弄死

  埃德金和霍爾嘉為了救出女兒並解釋其緣由而起的冒險經過


  整體的節奏挺快的，有些梗也挺好笑~

  比如一開始，大法官在裁決他們是否緩刑出獄那段

  他們以為又不能出獄

  還沒聽到判決就抓著其中一個大鳥法官跳窗而逃

  但其實法官們是想判可以出獄的XD

  回到劇後，福吉也想用同樣的方法

  反而撞到牆上，那個窗早就被補好了，一整個爆笑


  第一次看的時候還因為不太懂被跳過

  第二次才認真的把部電影看完

  有點反敘的手法

  但我覺得後來埃德金願意承認自己錯誤的時候挺動容的

  還有在他們搭著小船要離開時

  看到鬥技場上天空中的魔鬼儀式因而返回

  並使用熱氣球發放好不容易搶來的錢

  使人們逃離鬥技場那幕，真的太讚了

  (不過現實應該不太可能有這種人XD)

  還有贊柯和霍爾嘉各自的打鬥畫面看的很過癮

  華麗的劍術跟純粹的暴力，沒有很虛假的感覺！


  看到最後挺期待第二集的

  對了，還有阿媽養的龍也很可愛

  明明是boss戰，不知道為看到boss長這樣就緊張不起來

  雖然我不是進戲院看的，但可以想像當時戲院應該超多人笑出來XD


  --

  笑死 不要這樣

  入迷了

  可以等等看 我覺得有機會

  是吧果然要看過才知道

  結果你買了嗎

  XDDDD'
