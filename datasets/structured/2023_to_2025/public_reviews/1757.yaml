title: 'Re: [好雷] 【龍與地下城：盜賊榮耀】沒玩過桌遊的看'
content: "史悠\n大\n菜鳥\n得懂\n\n\n我覺得很多人都會對“我沒玩過龍與地下城 會不會看不懂”  而感到害怕\n\n\n\n   甚至有人連什麼是桌上型rpg都不太懂\n\
  \n\n\n  其實。我就直接說結論。龍與地下城的trpg 是\n\n“\n行動成功與否 看數值和骰子”\n\n\n三聖書也不是講什麼很奇怪的東西\n\n第一本主要介紹職業怎麼創造。紙上怎麼戰鬥\n\
  \n要怎麼判斷數值。魔法有哪些\n\n第二本GM要怎麼創立中古世界觀 還有npc骰判例\n\n還有稀奇的魔法道具和怪物 錢財怎麼創\n\n第三本就是怪物大全了\n\
  \n\n\n所以完全不瞭解龍與地下城 真的沒關係\n\n只要喜歡奇幻故事 冒險 中世紀和怪物。就可以進場了\n\n\n\n\n\n  但電影有也不是隨隨便便原創一個世界\n\
  畢竟這麼多年下來。龍與地下城也很多創作\n\n所以電影抓了“被遺忘的國度”這很多人都接觸過的世界來創立\n\n\n 電影角色也不會為你介紹這是哪裡哪裡 有著什麼什麼的做背景介紹\n\
  \n\n  而是帶觀眾自然的融入裡面\n\n即使突然冒出獸人。半身人 怪物。也沒多做介紹\n\n但一切就是那麼自然\n\n\n\n\n所以新手可以放心觀賞電影\n\
  \n老手也可以從中得到彩蛋和懷舊感\n\n\n\n\n\n----\nSent from  on my Vivo V2041\n\n--"
