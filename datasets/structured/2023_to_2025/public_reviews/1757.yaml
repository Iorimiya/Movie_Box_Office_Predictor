  完全是被板上一致好評燒到\n\n結果這部片完全出乎我的意料的厲害\n說神片什麼的可能不至於\n但它絕對是一部各方面都表現出高水準的傑作\n\n老梗但平易近人的親情主軸\n\
  人物合理的背景鋪陳和動機\n趣味的對話和喜劇演出\n刺激爽快的動作成分\n充滿冒險感的探索場景\n華麗又富有巧思魔法表現\n打戲和文戲絕佳的穿插平衡\n在寫實和遊戲設定間拿捏的恰當好處\n\
  \n甚至\n如果就RPG玩家渴望的奇幻冒險這部分\n可以毫不客氣的說\n這部電影超越了魔戒以來的所有奇幻電影\n\n推薦所有想看爽片、冒險或魔法的所有人去看\n\
  \n\n——-\n\nBTW\n我去看有一部分是想知道\n類B級片喜劇的奇幻電影是否能拍的成功好\n對我來說這種喜劇模式才是最符合\n我很喜歡的哈比人該有的片型\n\
  而不是PJ的狗屁史詩魔改三部曲\n結果D&D真的做到了，感慨\n\n\n\n\n\n-----\nSent from JPTT on my iPhone\n\n\
  --\n                          七瀨~~學姐就在你身邊~~\n                       競爭好激烈~你怎麼還在~暗戀~~\n\
  \                          七瀨~~後面還有個學妹~~\n                        快行動~在心葉被搶走之前~~~\n\
  \n                         ~{大家為琴吹七瀨加油歌}~\n\n--"
