url: https://www.ptt.cc/bbs/movie/M.1683885385.A.161.html
title: '[新聞]《龍與地下城：盜賊榮耀》有無機會推續集'
content: '《龍與地下城：盜賊榮耀》有無機會推續集？導演表示正面回饋讓他想加更多D&D元素





  電玩類改編電影《龍與地下城：盜賊榮耀》可說是今年 3 月底改編大螢幕作品的一匹黑

  馬，在大型評論網 metacritic 上，無論影評人或是一般影迷，都給出了中上分數。在有

  佳績的基礎下，外界也相當在意電影後續的規劃？有沒有機會推出續集？對此導演們抱持

  著樂觀其成的態度。


  導演兼編劇雙人組 Jonathan Goldstein 和 John Francis Daley 受訪時表示，雖然電影

  首週的票房不錯，但其實後續有受到《超級瑪利歐兄弟電影版》的影響， 2 億美元的票

  房收入僅屬中上；但粉絲們透過社群平台給了我們很多積極的回應。



  對於續集的內容，其實這兩位導演也已經在默默構思，他們說梟熊（Owlbear）有很大的

  機會會再次出現，因為觀眾太愛牠們了。此外很多粉絲喜歡的眼魔（Beholder）也是他們

  會很想放到以後作品中的魔物。不過和派拉蒙影業商討後續，還有一段路要走。


  此外，除了想加入更多 D&D 龍與地下城的代表性場景，他們也想讓原本觀眾熟悉的角色

  有新亮點。例如讓 Chris Pine 飾演的角色埃德金（Edgin）使用咒語，相信對 IP 和遊

  戲粉絲是很讓人興奮的一件事。



  新聞網址：





  --'
