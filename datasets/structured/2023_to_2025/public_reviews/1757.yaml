url: https://www.ptt.cc/bbs/movie/M.1679455658.A.9CC.html
title: '[好雷] 《龍與地下城：盜賊榮耀》笑點與冒險兼具'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  圖文重點標示好讀版↓




  2023年3月17日我有幸抽中威秀影城在3月21日舉辦的《龍與地下城：盜賊榮耀》首映會電

  影票，因此昨天就搶先去觀賞這部3月29日才上映的電影了！

  生平第一次參加首映會，感覺票根蠻有質感的。

  《龍與地下城：盜賊榮耀》的劇情是講述男主角在妻子遭殺害後，與女主角及兩個夥伴踏

  上盜賊旅程，而在一次行動中，其中一名夥伴背叛其他三人，使男女主角雙雙入獄（另一

  名夥伴當時幸運逃脫才沒入獄），並奪走男主角的女兒，兩年後男女主角逃獄後，為了救

  回男主角的女兒，除了找回當年逃脫的夥伴，並集結新的夥伴，再次踏上冒險之旅。

  個人認為，本片最大的亮點是蘇菲亞莉莉絲，她雖然不是女主角，但她在片中飾演的角色

  ，無論是穿著、髮色、身手敏捷度，都讓我覺得很像是史嘉蕾喬韓森在漫威電影宇宙系列

  電影裡飾演的黑寡婦，很有魅力！

  在劇情方面，是由眾多詼諧的笑點結合動作、奇幻冒險及一些勵志的橋段，最後再搭配讓

  人感動的結局而成。

  雖然本片整體不至於到令人完全耳目一新，但絕對是部值得一看的作品，因此雖然近期有

  諸多強片（《鈴芽之旅》、《沙贊！眾神之怒》及《捍衛任務4》），但《龍與地下城：

  盜賊榮耀》仍然是可以納入進電影院觀賞的選擇之一。

  最後不忘提醒，本片有片尾彩蛋，因此有打算去看的人，看完結局別急著離開！

  本文就分享到這了，感謝閱讀，希望《龍與地下城：盜賊榮耀》不會令大家失望！


  --

  我的FB專頁「阿培嘎嘎嘎」，歡迎大家按讚追蹤！



  --'
