url: https://www.ptt.cc/bbs/movie/M.1680766846.A.156.html
title: '[好雷] 龍與地下城-盜賊榮耀'
content: '看完後我其實是很感動的


  以下有內容雷


















  我並不是一個了解DnD的人，也不熟悉跑團

  頂多就是有看過別人跑團的一些紀錄的程度


  但這部電影成功的地方，我認為其一是取得了一個恰當的平衡

  所謂平衡，即是必須考量電影媒體的先天限制

  也就是有限的時間和篇幅

  有些作品想要用電影來說小說/漫畫/遊戲的整個故事，卻淪於什麼都講不好

  有些作品只把小說/漫畫/遊戲的名拿來用，裡面裝的卻是完全不相干的東西


  而今天看的這個作品，是令人舒服的

  他沒有塞一大堆鋼鐵粉絲才懂的名詞和設定，而使一般觀眾覺得枯燥卻步

  同時他又有一些內容，能夠使深入喜愛奇幻作品甚至DnD的粉絲會心一笑

  更有一些看似不太合理的地方，其實仔細查會發現和設定有關係!


  最重要的是，故事完整。

  沒錯，就是故事完整這麼簡單的一件事情，有好多好多的奇幻/超英電影都做不到

  故事先完整，才有引人去接觸相關作品的興趣

  故事要完整，才有作為值得一看的作品的價值

  不同的載體有各自適合的呈現方式，不能當作連故事都講不好的藉口

  而這部電影是有做到的。


  私心還有其他幾個感動的點:



  1. 不那麼政確


  是的，感謝上天他們沒有做出一個超政確德魯伊，而是給了可愛版本

  我相信很多人記憶點最強的地方之一，一定是這個角色

  各種變換動物的場面也很有趣

  以後也會繼續關注這個演員 Sophia Lillis (個人覺得她很有空靈的感覺)



  2. 肥龍和吐酸液的龍


  居然沒有做出爛大街的帥氣吐火飛龍! 真心非常驚訝



  3. 玩家的共鳴-超強NPC但一下子就離隊


  贊克先生就是典型的超強NPC但只會在任務中出現

  之後就不關隊伍的事情，連離開都是這麼直接



  4. 女戰士和主角女兒的感情


  雖然只帶過一些些的時間

  但養育之情表現得不錯啊...



  5. 強納森!


  鳥人審判官超好笑的啊

  而且看花絮好像真的是套皮去演的，真有喜感 XD




  總之我有點久沒有從一部電影中獲得這麼大的快樂了

  不是漫威，也不是DC


  希望這部可以回本....不過看起來有點困難

  如果不是老婆怕老鼠，還真想和她回去二刷呢



  p.s.

  工作每天都在說服人，心很累

  所以如果你不同意，那你是對的，以你為主


  --'
