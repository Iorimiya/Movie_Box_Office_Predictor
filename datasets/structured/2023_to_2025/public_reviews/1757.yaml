url: https://www.ptt.cc/bbs/movie/M.1680683283.A.1CC.html
title: '[好雷]令人興奮的冒險《龍與地下城：盜賊榮耀》 '
content: '令人興奮的冒險《龍與地下城：盜賊榮耀》


  圖文好讀：



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  接觸桌遊或是ACG領域的朋友，對於DND 的大名想必絕不陌生，而當想像化為大螢幕上一

  幕又一幕的冒險，那肯定是會令人熱血沸騰且格外興奮的，而《龍與地下城：盜賊榮耀》

  正是這樣的一部電影，派拉蒙影業與孩之寶合作，打造了引人入勝的世界，並上演著

  這個劍與魔法的大陸上，廣闊的冒險史詩。


  ~~~~~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  【細膩的設定，享受就好】


  DND 是一款設計非常細膩的遊戲，他有冗長的故事背景，多樣化的種族與職業，各種豐富

  的團體與勢力交錯，想要了解整個世界再來欣賞這部作品顯然對許多觀眾來說是不現實的

  ，但這次的電影幾乎撇除了整個世界的設定．全憑著角色間的對話讓觀眾對於豎琴手同盟

  、泰伊人、絕冬城等故事背景有更深一步的認識，少了大量的解釋性對話，讓整個故事節

  奏在運轉上順暢且刺激，即便是刻意搞笑的橋段，也因為各種設定顯得不那麼刻意，反而

  成了冒險過程中的無奈趣事。


  對於整個故事的架構，不用過度去要求與較真，欣賞著如同街頭藝人的吟遊詩人，野蠻人

  ，德魯伊與彆腳術士的冒險，這才是整部作品有趣的部份。


  如果回響出色，誰知道會不會讓聖騎士、哥布林、魔龍等角色譜出一段自己的冒險呢？




  【休葛蘭仍舊充滿魅力】


  作為該做的狡詐擔當，休葛蘭忠實呈現了該角色腹黑奸詐的一面，但又能看到這個角色的

  迷人之處。


  充足的領袖魅力，高超的畫餅才華、將人騙的一愣一愣的忽悠技術，這樣的休葛蘭即便擔

  任著反派，卻又令人一再期待他下次出場又想做什麼噁心人的事！


  與一般的邪惡，休葛蘭飾演的福吉稱不上是真正的邪惡，在我看來，她更像是憑藉著混亂

  從中得利的騙子與野心家，也就是尚書大人，風往哪吹人就往哪倒，我們能看到他雖然不

  安好心，但可從沒想髒了自己的手，加上那壞壞又有些邪氣的笑容，怎麼能讓人對他厭惡

  的起來，我甚至都期待他的再次出現了！




  【擺脫印象的演員們】


  老實說，我對於蜜雪兒·羅德里奎茲的演出非常滿意，至少我們終於不是在《玩命關頭》

  中看到他了，雖然今年又要來一次「家庭戲碼」。


  野蠻人的強硬魯莽形象在她的演出中像是出自內心一樣，有些笨拙，但純樸，凡事動腦前

  就先動手，深古銅色的黝黑線條搭配上野蠻人的服飾給她增添了不少魅力！


  而同樣擺脫形象的還有克里斯·潘恩，是的，我們終於不用再看到他與蓋兒加朵擁吻了，

  真是可喜可賀，同時克里斯在這部片中重新給予了失意但卻仍在掙扎的失敗父親一種新的

  形象，這種形象並非全然的落魄，而是一次又一次用歌曲鼓舞著朋友與家人，他也是凡人

  ，也需要生活，或許會背棄誓言，但不會放棄相信自己的夥伴！


  埃德金的角色非常有魅力，他有些小聰明，但成不了大事，總是擔任著攪局者與鼓舞者的

  角色，他不會是那個最強大，甚至可能是最好擊破的，但同時也是最麻煩，最搞不死的，

  這樣的對手，光是想都覺得棘手。


  此外令我驚訝的還有蘇菲亞·莉莉絲，在《牠》之後，蘇菲亞又嘗試了多元性別議題的作

  品《I Am Not Okay with This》以及這次的冒險作品，可以看的出來她正在朝著更多元

  ，豐沛的作品類型進行挑戰，雖然與同齡人相比，嬌小的她仍有些稚氣，但這樣的條件，

  也讓她能夠挑戰一些一般的好萊塢女星較不願意嘗試的角色，德魯伊的變身秀也是這次作

  品中特效最為吸睛的部分之一，這樣的妹子，怎麼能不愛呢？




  【刺激的特效帶來豐沛的冒險】


  《龍與地下城：盜賊榮耀》之所以能如此精彩，相較於導演強納森高斯汀，或許我們更該

  關心的是打造這部作品的特銷與CGI背後的團隊Legacy Effects，他們創造了鳥翼人、亡

  靈、巨型肥龍與絢爛的魔法效果，這些令人著迷的造型背後，有些是電腦特效，但同時也

  使用了現場佈景、電子動畫與螢幕外的機械操作等技術，這家公司同時也參與了《阿凡達

  ：水之道》與《終局之戰》的特效製作，相信經歷過詹姆斯卡麥隆與迪士尼的考驗，《龍

  與地下城》的特效表現確實是好萊塢水準之上的作品。



  《龍與地下城：盜賊榮耀》在爛番茄與IMDB上都拿下了不錯的成績，91%的新鮮度、93％

  的爆米花指數，與7.6的評分，他確實是一部有趣且令人喜愛的喜劇冒險電影．但令人擔

  憂的是，這部斥資1.5億拍攝的作品至今只拿到七千兩百萬美元的票房，其中有半數以上

  來自於國內票房，一部分甚至也暗示了DND在全球的吸引力恐怕仍舊有些不足，如果拍成

  這樣了還血本無歸，恐怕DND又將再次被打入冷宮，那肯定不會是什麼令人開心的事了。


  --'
