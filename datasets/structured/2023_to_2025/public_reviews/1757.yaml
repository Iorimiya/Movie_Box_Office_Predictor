title: '[好雷] 龍與地下城：盜賊榮耀'
content: '這種遊戲改編的電影一般雷率極高


  本來也沒啥興趣 畢竟沒玩過這桌遊


  被網上好評吸引去看 真的很讚


  整體節奏非常好  人物刻畫用心


  劇情雖然老套 但好好的說了一個好故事


  重點是看預告沒注意 裡面也太多熟人了吧


  聖騎士不就是柏捷頓家族的公爵嗎！


  他在裡面超帥 當初還被說最帥黑人


  這部表現也很帥 打戲也精彩


  看大家有說德魯伊很可愛


  真的 一直覺得她很眼熟！


  演過牠的蘇菲亞莉莉絲啊！


  她Netflix上也有一部這樣不OK也超好看


  整體10分可以給9分


  這幾天應該會找時間二刷


  應該近期最好的爆米花片了

  -----

  Sent from JPTT on my iPhone


