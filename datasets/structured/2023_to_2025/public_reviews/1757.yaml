url: https://www.ptt.cc/bbs/movie/M.1680846433.A.476.html
title: '[好無雷]龍與地下城：盜賊榮耀 '
content: '一開始以為龍與地下城是電玩遊戲改編，後來才知道是桌遊，

  不過也是影響近代角色扮演冒險遊戲非常深刻的起源，

  那些中世紀奇幻冒險的元素、確立各職業屬性的技能與個性都受到DnD很大的影響

  所以就算對龍與地下城完全陌生也還是可以輕鬆觀賞。


  不會說這部片是像魔戒般磅礴的史詩感，劇情上算得上是偏小品，

  中間好幾段推進劇情時的笑點我是笑成智障，

  實在好奇預告到底怎麼能剪得這麼尬。

  隨著這幾年影視發展，

  每部電影好像都要死去活來刻苦銘心波濤反轉，

  套句死侍說的：so dark.


  龍這樣順暢的奇幻冒險敘事幽默小品真的是難能可貴。

  世界觀與角色的立體塑造就彷彿小時候透過電玩看到另一個前所未聞的奇特世界一樣，

  想起從前在一次次的冒險中扮演的不同能力的角色、看見不同世界的景色、

  與不一樣的夥伴在城鎮中穿梭解決各種之現以推進劇情，看完就像破關一樣爽快。


  龍與地下城：盜賊榮耀就像是給每個玩RPG長大的孩子一封遲來的情書，

  跟著主角一同享受這個冒險的過程。

  當然沒在玩的也是可以啦，但感覺就少了一些RPG常見內梗帶來的愉悅（？）

  (跟朋友討論過，雖然也是宅掛但沒在玩RPG的

  表示他真的沒get到梗，也覺得這部普普而已)


  瑪利歐太強，好怕龍賺不夠，真心希望這部片可以長賣下去。




  --'
