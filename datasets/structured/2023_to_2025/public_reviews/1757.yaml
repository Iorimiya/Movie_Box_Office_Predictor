url: https://www.ptt.cc/bbs/movie/M.1679055174.A.A60.html
title: '[好無雷]龍與地下城：盜賊榮耀'
content: "身為沒玩過《龍與地下城》的觀眾，完全不會看不懂，真的是部有趣而精彩的奇幻冒險電影。另外不像《野蠻遊戲》是現實進入遊戲的設定，這部是直接以遊戲為故事背景。\n\
  場景豐富(雪地、荒原、洞窟、迷宮)，有著廣大的世界觀；角色特徵個性鮮明(吟遊詩人、蠻族、術士、德魯伊跟臨時隊友聖騎士)，看主角團彼此的互動很有趣，戲份也很平均，不會有誰特別薄弱，每人都能夠有所表現，這種團隊合作解任務的作品，加上途中老是計畫生變讓我連想到《不可能的任務：鬼影行動》。劇情發展中規中矩不難猜測，但是流暢有趣，像輕鬆詼諧版的《魔戒》，就是純粹的好看。\n\
  個人認為最為出色的片段是德魯伊變化為各種動物逃脫，模仿一鏡到底的手法讓逃脫過程行雲流水。而且德魯伊真的滿可愛的，每次都會不自覺的盯著看她的角跟晃來晃去的尾巴；另外遭遇到的那隻胖胖龍實在顛覆傳統對龍的認知，移動方式也很可愛。\n\
  其實原本看到宣傳圖跟宣傳立牌時沒有很期待，畢竟這類型真人改編電影搞砸的居多，但 看完後讓我完全改觀。\n我是看3/15台南國賓影城A廳的特映，第一次在這個廳看電影，音效真的不錯，總共20排雖然爬文都推薦10.11排，但我覺得坐8排視野剛剛好。\n\
  --\n\nSent from \n\n--"
