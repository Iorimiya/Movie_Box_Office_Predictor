url: https://www.ptt.cc/bbs/movie/M.1680452501.A.475.html
title: '[無雷] 龍與地下城:盜賊榮耀 超好看 看到哭'
content: '推文拜託別暴雷 懶得回來刪文


  今天晚上無聊想說去看個電影

  預計要看捍衛任務的

  沒想到板橋大遠百imax是演龍與地下城


  大概是以前被這種遊戲之類的改編電影嚇怕了

  本來以為就是劍魔法龍冒險隨便拍拍的作品


  沒想到

  這部電影真的超級用心 用心到爆炸那種

  我沒玩過龍與地下城 但從小到大也玩過一些類似的遊戲


  劇情部分並不算特別新穎 但起承轉合做得非常完整

  前3分之1我有一點點小不耐

  但有個關鍵人物出來之後 到結束大戰 都非常非常非常精采


  很多好笑北爛的地方  大家可以期待地下城與龍其中一段

  我笑到翻掉  明明是有點緊張的地方  我還可以覺得超好笑


  電影的打鬥也很精彩   在最後面整個大爆發


  chris pine真的很適合演這種有點北爛 不是很強 但又充滿勇氣的腳色

  後面有個關於他的轉折  我看到起雞皮疙瘩 超級有勇氣

  非常喜歡看有勇氣 無所畏懼的主角


  主角群跟配角群沒有一個是花瓶  全都很有功能  也很明顯可以感受他們的性格

  而且都很討喜   主角團我都很喜歡


  電影最後有個點讓我在電影院哭  超級感人


  希望可以有續集  大概是近期覺得最好看的電影


  當然這絕對不是100分的神作

  但絕對可以感受到整個劇組 演員的用心


  導演功力也很強  運鏡 情感的轉折 電影的節奏 拉得很好


