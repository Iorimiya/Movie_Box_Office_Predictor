url: https://www.ptt.cc/bbs/movie/M.1680322717.A.753.html
title: '[好雷] 龍與地下城-盜賊榮耀的詩人能力'
content: '帥氣的吟遊詩人，幾乎沒有攻擊力，偶爾彈彈魯特琴，搭配一些竊盜技能，總是在打嘴砲，看似制定有點兩光卻總是有用的策略。

  然而，以設定來說，他其實是高等魅力搭配演講能力，最強的能力就是在關鍵時刻總是能說服他人，想法該轉彎就不會糾結太久，本體是一個很適合當領隊的角色！

  1.拉角色加入隊伍

  說服法庭成功讓兩人脫罪

  說服野蠻人去找術士當隊員

  說服術士這趟任務可以有很多寶物 ，成功加入

  原本對人類沒好感的德魯伊，被主角掌握重點說是要討伐福吉，成功被拉攏

  說服聖騎士一起去拿頭盔

  制定計畫時快速回應隊友的質疑，讓大家沒有話說

  2.在隊員喪志的時候鼓舞士氣拉回來

  鼓勵術士他一定可以跟頭盔同步

  鼓勵野蠻人走出上一段感情

  隊員快整體解散發表演說，一席演說把所有人拉回來

  3.快被殺死時說服魔王給自己一條路

  本來在那邊中埋伏，應該會全軍覆沒，他打動了紅袍巫師的心，讓他們有機會在運動會最後一搏

  （在遊戲設定像是面對fallout 3最後的將軍，還是凱撒大帝，口才最高表現就是說服魔王）


  不過跟他不相上下的福吉的路線也很像 所以當他們兩個在話術交鋒的時候福吉都沒有讓主角占上風。


  4.想法高度彈性

  雖然討厭泰伊人，接受了野蠻人的說法，還是願意去找聖騎士

  聖騎士說要把錢都捐出去當作條件，他猶豫片刻不糾結，宣誓答應，後來順勢運用在戰略上


  然後，面對自己女兒，詩人高等的演講能力反而女兒不太買單，他最後選擇不用話術面對，終於找回女兒。


  總之，主角看似弱弱的，仔細想想他carry非常多事情啊！


  -----

  Sent from JPTT on my Google Pixel 6.


  --

  yep Thay

  不只啊 開頭他們還在那邊挖冰唱歌勒'
