url: https://www.ptt.cc/bbs/movie/M.1680702277.A.7EF.html
title: '[好雷] 龍與地下城：盜賊榮耀'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  由於「電玩」比較容易賦予完整的故事線，大部分的遊戲改編電影都是源自於此，不過，

  角色扮演遊戲也有同樣的特性，更不用說像「龍與地下城」這種結局開放但同時又有結構

  的角色扮演遊戲。拍成電影除了能夠滿足玩家的想像力具象化之外，也可以讓非玩家進入

  這個豐富多變的奇幻世界。



  一名魅力十足的盜賊和一群冒險家踏上一場史詩般的劫盜之旅，目的是奪取一件遺失的古

  物，但當他們惹上不該惹的人物，事情就變得非常危險。



  《龍與地下城：盜賊榮耀》的故事既然是一場冒險，一路上就會有一層一層的關卡。就像

  遊戲，主角們會有一個主任務，在執行主任務的過程裡，可能會觸發其他支線任務，或者

  出現因為最近的那條路闖關失敗而必須繞遠路的情況。以本片來說，主線任務就是取得「

  復活石板」這件道具，其他的挑戰不論是竊聽情報、詢問死者的解謎，還是勇闖地下城取

  得道具、格鬥場的比賽與迷宮等，都是讓這場大冒險更加精采的支線。



  而讓電影或「龍與地下城」這個遊戲本身更上一層樓的便是多樣的角色本身。《龍與地下

  城：盜賊榮耀》的主角埃德金是一名吟遊詩人，他的夥伴則是野蠻人霍爾嘉、明明擁有強

  大血統卻只能使出基礎法術的術士賽門與能夠變身為動物並掌控自然力量的「德魯伊」多

  莉克。其實，遊戲系統中還有其他的種族，但電影也透過主角群招募多莉克時，由她解釋

  自己身世背景來說明為何本片沒有出現。但是，眼尖的觀眾會許有注意到，迷宮當中有一

  位矮人，而令人驚喜的Bradley Cooper客串則是半身人，算是在不讓新手觀眾搞混的情況

  下，盡可能完整世界觀的作法。



  就像超級英雄電影一般，完美的角色往往得不到大家的投射，反而是充滿缺陷的人物更能

  獲得觀眾的喜愛。主角埃德金既然是一位吟遊詩人，就表示他本身是一位魅力十足的角色

  ，他也極需要魅力才能施展自己的一些特殊技能，而演員Chris Pine正好超級飾演吟遊詩

  人。表面看起來超廢，只會靠嘴上功夫，但其實「光說不做」就是埃德金最強的地方，他

  所能提供給團隊的「激勵」就在此。雖說他不是格鬥系的人物，但身上背的魯特琴可不是

  普通的武器，拿來打昏敵人完全都不會斷折或損壞，實在是超強的。



  其他角色也都忠實地展現自己的背景、職業與種族的獨特之處，霍爾嘉一個打十個；賽門

  在關鍵時刻靠著「相信自己之術」召喚出自己的血統加成；多莉克的變形能力也在冒險的

  過程中施展不少次。



  雖然《龍與地下城：盜賊榮耀》不是喜劇，但片中還是有很多笑點，觀眾大可將其視為每

  個人物背後負責操控的玩家犯下的錯誤，或者單純認定為負責主持遊戲的地下城主（

  Dungeon Master，DM）的惡意也行。像是吐槽遊戲裡一些不明所以的規則，沒人知道為什

  麼這樣定，但規則就是如此，還有不管是NPC還是如部分網友所說是「週末玩家聖騎士」

  的贊柯，毫無幽默感又一板一眼，甚至光是終於出現一隻龍，結果是可愛到爆的肥龍，都

  能讓影迷笑出聲。



  其實，如同同名遊戲，玩家的目標從來都不是達成目標進而獲勝，而是享受冒險的過程。

  《龍與地下城：盜賊榮耀》的重點也不是取勝，而是從錯誤中學習。埃德金認為自己過去

  不是個好爸爸、好丈夫，這也是驅使他踏上這趟旅程的原因：妻子因他的行為而死；霍爾

  嘉為愛離開族人，沒想到婚姻最後以失敗收場；沒有得到血統真傳的爛術士賽門就更不用

  說；多莉克也有著遭父母拋棄的可憐身世。但只要堅定自己的信念，成功最後都會隨之而

  來。



  最後，當然要提到玩家都會感到彩蛋滿滿的「遊戲彩蛋」。觀眾甚至不需玩過「龍與地下

  城」，只要角色扮演遊戲或桌遊玩得夠多，就足以認出片中大多數與遊戲相關的彩蛋。雖

  說許多人認為《龍與地下城：盜賊榮耀》一顆骰子都沒出現讓人有點失望，可是，還是有

  不少蛛絲馬跡清楚指出主角們是在玩遊戲。



  像是使用死者交談術必須或只能問五個問題，死者才能回去入土為安，這個設定也成為其

  中一個笑點。另外，在地下城裡遇見噬腦怪，贊柯說「智力越高越容易觸發攻擊」，這其

  實就是一種智力檢定，而最後噬腦怪完全沒有發動攻擊，除了主角們的運氣值太高這種解

  釋之外，真的就像埃德金所言「這還真是污辱人」，畢竟噬腦怪這樣視若無睹地從眾人身

  旁走過，也代表他們智力堪憂啊。還有，原定任務搞砸之後，居然只是發現自己身上帶著

  一件神器「來去杖」就能解決困境，這的確是玩遊戲時經常會發生的趣事。



  《龍與地下城：盜賊榮耀》或許尚不足以稱為今年最棒的電影，但以保護級的尺度拍出這

  樣一部闔家觀賞的動作冒險奇幻電影，又能滿足遊戲迷的想像，的確是極為成功的一部改

  編。


  --

  Viola''s World：Screen Scream影迷尖叫屋


  請大家多多指教~


  --'
