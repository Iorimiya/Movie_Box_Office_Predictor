url: https://www.ptt.cc/bbs/movie/M.1681635544.A.BAB.html
title: '[好雷] 《龍與地下城：盜賊榮耀》正統就是王道！'
content: "圖文好讀：\n\n自從奇幻始祖《魔戒》電影版問世以來，已經超過了２０個年頭了，奇幻影劇\n曾經盛極一時、風光無限；然而自從《權力的遊戲》評價雪崩的尾季、《獵魔\n\
  士》主演亨利．卡維爾辭演的風波、乃至《魔戒：力量之戒》影集的惡評如潮\n，奇幻影劇彷彿已經日薄西山，那高昂的成本猶如巨大的恐龍，即將絕種。\n\n好在，我們還有《龍族前傳》，我們還有《龍與地下城：盜賊榮耀》，在在提\n\
  醒：回歸初心的「正統」作品，依然可以很精彩！\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \n\n\n《龍與地下城：盜賊榮耀》正是改編自角色扮演型桌上遊戲《龍與地下城》（\nDungeons & Dragons，Ｄ＆Ｄ），是由數名玩家扮演特定角色，透過擲骰決定\n\
  事件走向，最終共同演出一整個故事。\n\n此遊戲系列影響力巨大，在基礎設定上承襲自《魔戒》的精靈、矮人、人類、\n半身人（哈比人）、半獸人等等的大架構，而下啟了半個世紀的現代奇幻作品\n\
  ，直接開創了ＲＰＧ類型遊戲，其影響力甚至飄洋過海，「轉生」成為了日式\n奇幻例如《羅德斯島戰記》系列、間接受其啟發的例如《勇者鬥惡龍》系列等等。\n\n知名美劇《怪奇物語》中第一季的開頭就是主角團在玩《龍與地下城》桌遊，而\n\
  第四季主角團上了高中後還加入了《龍與地下城》社團，劇情也提到在80年代《\n龍與地下城》曾經被家長與宗教團體抗議「涉及黑魔法」、「帶壞小孩」等等，\n都可讓人一窺這一ＩＰ的魅力。\n\
  \n遊戲玩家也許記得，自2000年代開始引進的《柏德之門》、《冰風之谷》、《絕\n冬城之夜》等作品，其完善的設定、詳盡的劇情、複雜的人物關係帶給中文遊戲\n界的震憾；奇幻小說讀者也許記得《龍槍》三部曲、《黑暗精靈》三部曲等作品\n\
  ，這些都是直接改編自《龍與地下城》的優秀之作。\n\n所以，當《龍與地下城：盜賊榮耀》的新電影版消息問世時，可以想像廣大的《\n龍與地下城》玩家群體以及旁邊看熱鬧的群眾有多麼期待－－而當發現這種期待\n\
  以更多的驚喜反饋回來時，又該是多麼開心！\n\n\n\n對於一個以盜賊為題目、以盜賊為主角、以盜賊為劇情的電影而言，觀眾也許會\n非常訝異地發現，這其實是一個關於愛與正義、責任與犧牲，一路蒐集神兵利器\n\
  直到最後圍毆大魔王的非常傳統、非常王道，甚至可以說是「老梗」的故事。\n\n要注意的是，老梗不代表著必定不好看；相反地，正是因為這類劇情能夠歷經時\n代考驗，不斷在每個世代中反覆出現，才會被稱為「老梗」。近年紅遍全球的《\n\
  鬼滅之刃》，故事內容是一目了然的「英雄打惡鬼」，劇情核心是可謂人類最古\n老之老梗的「家族愛」，這不妨礙它在這世代中脫穎而出，賺進大把鈔票，讓作\n者提早退休是也。\n\
  \n主角克里斯·潘恩飾演的吟遊詩人（豎琴手）以竊盜為生，但並非因為利益薰心\n或是藝高人膽大，而是為了在這個危險的世界中照顧家人。但他的職業帶給他的\n不只是財寶，也伴隨著巨大的風險，在付出慘痛代價後，他發誓要重新贏回他的\n\
  家人……\n\n女主角蜜雪兒·羅德里奎茲飾演的野蠻人女戰士遠離部落，看似粗豪莽撞的外表\n隱藏著一顆多愁善感的心；她與主角相識多年，相當於他女兒的另一個母親，但\n\
  在為了她的新家人出生入死的同時，卻始終放不下過去的傷痛……\n\n克里斯·潘恩與蜜雪兒·羅德里奎茲的合作演出值得一看。（《龍與地下城：盜\n賊榮耀》國際版預告）\n\
  \n故事從兩人開始，為了明確的目的（贏回家人），沿途召集各有心思的同伴，在\n探索這個廣大的奇幻世界的同時與惡勢力鬥智鬥勇，最終要從城堡中拯救「公主\n」，打倒「惡龍」，迎來HAPPY\
  \ END！\n\n在上一個十年中，看慣了好萊塢各種標新立異、「政治正確」的影劇，也看慣了\n日本各種花樣百出、「苦大仇深」的反套路作品，霎時間《龍與地下城：盜賊榮\n\
  耀》這麼單純、傳統的故事居然變得如此令人耳目一新，果然流行就像時尚，終\n究要回到正路上來的。\n\n因為簡單，所以純粹，不需要宣傳政治理念，不需要炫耀奇思怪想，所有的精力\n\
  就只須放在精打細磨的劇本上，再加上各個演技純熟的老牌演員們，帶著觀眾展\n開一場奇幻冒險－－好電影就該這樣。\n\n\n\n不得不說，《龍與地下城：盜賊榮耀》的預告片誤導性十足：主角以旁白口吻自\n\
  述屬於一個「盜賊團夥」，而團夥接了不該接的委託、偷了不該偷的東西、交付\n給了不該交付的人，於是世界即將毀滅，而他們必須負起責任，把東西偷回來……\n\n通過這似乎「劇透」精光的預告，彷彿可以想像一個完整的故事：前面９０％就\n\
  是主角團夥去偷這個「不該偷的東西」，後面１０％就是真相大白後主角團夥拯\n救世界－－百分比可以調整，但應該大差不多吧？\n\n直到真正進了電影院之後才發現，這段旁白還真的就只是一段「故事開始時交代\n\
  背景的旁白」，主角團夥早就經歷過了這段事件，主角本人甚至因此失風被捕，\n幾乎失去一切，正在蹲苦牢呢！\n\n更別說，在電影中佔據相當份量，可以說是主角「動機原點」的女兒一角，在預\n\
  告片中幾乎是看不到的！光看預告片，絕對不會想到「親情」、「家庭」在本片\n中擁有多大的重量。\n\n克蘿伊·柯爾曼飾演的女兒一角在片中占據關鍵戲份。（《龍與地下城：盜賊榮\n\
  耀》演員專訪預告）\n\n電影真正的內容、或說事件，在預告片中幾乎是被打散到完全看不出痕跡的！這\n年頭居然還能看到一部堅持「不劇透」，執著於「劇情保密」的預告片，而且還\n\
  是大眾娛樂片，何其難得！又讓觀眾多麼驚喜！\n\n這種故意誤導的「敘事詭計」不只出現一次，就在開頭劇情中主角為了假釋出獄\n，向假釋委員們娓娓道來自己如何淪落到如此地步時，觀眾也同時看到了主角的\n\
  前半生軌跡：他本一心嚮往正義，直到妻子受連累而死，導致他性情大變，改以\n盜竊為生，最終導致他失風被捕－－詭在詭在，根本無從得知哪些部份是真實的\n、哪些部分又是主角為了「賣慘」而誇飾甚至直接「唬爛」！\n\
  \n事實上，主角的計畫根本也不是成功機率未知的「假釋」，而是「逃獄」！換句\n話說這一整段推心置腹的自白其實用意只在拖延時間，不但更加深了他「不可靠\n的敘事者」的印象，並且建立了他極富煽動力與行動力，絕對要將命運掌握在自\n\
  己手中的「主角」形象。\n\n但這還沒完，就在劇情進入中後段時，主角才揭露這段開頭故事中藏著一個非常\n關鍵的「謊言」，這才是型塑他成為如今的盜賊團夥頭腦的根本原因。一個幾分\n\
  鐘的「背景設定」劇情，能夠起到反轉再反轉、前後呼應的效果，在劇本上下的\n功夫確實是非常紮實－－而這並非孤例，在故事中不斷出現這種「將前段劇情回\n收反轉再利用」，讓其印象不斷強化的手法，實在精采。\n\
  \n更進一步的說，會否整部電影都來自於某位特定的「不可靠的敘事者」？放映結\n束後，此般猜想給電影增加了更多韻味。\n\n\n\n傳統奇幻作品改編為影劇時，最大的難點在於其往往都自有一套龐大繁雜的「基\n\
  礎設定」，若不加以介紹，根本無從了解劇中人物的行為邏輯、思考模式，以至\n於霧裡看花，有看沒有懂。\n\n但若介紹得太多，又極容易使得觀眾無聊、「抽離」，畢竟「我們是來看電影的\n\
  ，不是來看小說！」實在是最為普遍、最為致命的感想。\n\n對此，《龍與地下城：盜賊榮耀》採用了極為正確的方式：那些設定，就算是非\n常短暫也要「實際演給觀眾看」，只有這樣子才能說服來看電影的觀眾投入到這\n\
  個奇幻世界中，而不是淪為枯燥的填鴨式體驗，亦即「Show, don't tell」。\n\n當然實際上還是有旁白在補完設定，但重點是必須有實際的、精彩的畫面演出效\n\
  果來滿足觀眾。事實上，還可以認為「旁白」本身就是在致敬實際的桌遊，因為\n在遊戲過程中總是要透過玩家扮演的地下城主（ＤＭ）口吻來推動遊戲事件。\n\n但為了不喧賓奪主、影響到實際要演出的劇情本身佔有的長度，這些介紹與設定\n\
  必須盡可能簡短有力，這就考驗導演的功力了……即使是廣受好評的彼得．傑克\n森《魔戒》三部曲，也在此做出妥協，刪改了極大量的原作段落；雖有部分放置\n於導演版中（也讓三部曲成為知名的馬拉松電影），但還是有不少地方是只能存\n\
  在於原作小說，實在是擠不出時間放進電影的。\n\n而比起《魔戒》那種硬派寫實的做法，《龍與地下城：盜賊榮耀》運用了取巧的\n方式：例如仰賴前述的「不可靠的敘述者」，往往還在講述的過程中被打斷、甚\n\
  至還會「回放」，除了製造笑點，也讓觀眾在「不知道該不該相信」的情況下全\n程保持著好奇的心理。\n\n又例如把大型事件進行拆分、細化，一場可以打上一整天的史詩級戰役，若是細\n\
  分到每個參與者的身上，就是每個只有幾秒鐘的「關鍵畫面」，透過這許多「只\n有幾秒鐘」的不斷演出，強迫觀眾打起精神，跟著主角團夥一起去拼湊整場戰役\n的印象，這也能形成極好的帶入體驗。\n\
  \n再加上維持「人設」，正因為角色人數眾多，每名角色能分配到的「背景設定」\n往往就那麼多時間，因此更需要徹底地維護每名角色的個性：主角的永不放棄、\n女野蠻人戰士的外冷內熱、魔人德魯伊的不諳世事、騙徒大師的心黑……無不從\n\
  開頭貫徹到結尾，每一句台詞、每一個互動都在增加其人設的可信度，給予觀眾\n更多的帶入感，防止其抽離－－這也同樣可以看做是致敬實際桌遊的作法。\n\n而那些《龍與地下城》粉絲們耳熟能詳的絕冬城、柏德之門、幽暗地域等等場景\n\
  ，有些作為背景對白中驚鴻一瞥的彩蛋，有些作為實際登場的故事舞台；經典怪\n物如寶箱怪、經典法術如魔法飛彈等等，都被挖空心思地安排在合理的地方、以\n可信的方式登場，連一般觀眾能夠輕鬆地融入其中。\n\
  \n而對於粉絲們來說，能夠找到多少致敬彩蛋，正可謂是一趟驚喜之旅。\n\n經典怪物們的輪番出場。（《龍與地下城：盜賊榮耀》預告）\n\n\n\n其實，對於這部電影最大的感想，就是裡面充斥著滿滿的愛。\n\
  \n不管是主角豎琴手對女兒帶有愧疚的父愛、女戰士對養女移情般的母愛、騙徒大\n師對養女扭曲的控制之愛、男術士對魔人德魯斯的戀慕之愛，或是更廣泛的聖騎\n士的正義之愛、紅袍法師的死亡之愛，都讓這部電影顯得如此多彩而絢麗。\n\
  \n再往上說，還包括了導演兼編劇的強納森·高斯汀與約翰·戴利對此部電影、對\n整個《龍與地下城》所傾注的愛。無論是敘事性的旁白口吻還是劇中角色忠實「\n扮演」自身個性的表現、團夥如多年老友般自然的嬉笑怒罵，都可說是在忠實致\n\
  敬真實的《龍與地下城》遊戲過程。\n\n電影固然是由演員來演出，但另一方面來說，何嘗不可看作由「玩家」來演出？\n觀影途中時不時浮現出的既視感，諸如「啊他爛骰了」、「啊他們在說幹話」、\n\
  「這也可以過？ＤＭ都快瘋了」……。\n\n為什麼我們熱愛奇幻故事？正因為奇幻本身能夠超脫現實的設計，在奇幻故事中\n，只要力量點得夠高，女性也能是開山闢石的戰士；只要骰運夠好，人人都可以\n\
  是化不可能為可能的逃脫大師；只要想要，男人也能扮演威力強大的女法師。\n\n何其有幸，我們生在一個《龍與地下城》電影可以是熱鬧繽紛、架構完整、娛樂\n性十足的時代！\n\
  \n--\n你吐槽熱門漫畫一定會被人批評\n而當你咬牙花了個多小時引經據典旁徵博引\n一定又會飄來一句\n                 　　　　　　　　　\
  \ 　～　歡迎您～\n\n\n--\n他同時是豎琴手也是吟遊詩人啊~\n\n真心不是業配，有看過業配快下檔了才發嗎XD\n然後有雷關燈：\n\n\n忘了正式譯名是黑暗精靈XD"
