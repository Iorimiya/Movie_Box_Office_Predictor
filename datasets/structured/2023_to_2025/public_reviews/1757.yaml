url: https://www.ptt.cc/bbs/movie/M.1681013316.A.794.html
title: '[微好雷] 龍與地下城：盜賊榮耀 好肥的龍'
content: '喜歡魔幻類型電影的人


  應該也會喜歡這部片




  劇情算是走馬看花 一點即過


  可以拍成兩三集的內容


  濃縮在一集內  片長拉到134分鐘  兩個多小時


  對我來講有點太長了


  但這可以說是缺點也是優點~~~





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  整部電影 更像是一次跑團


  在影片中進行 D & D 遊戲


  因此劇情推展會變得非常快速


  情感戲份變成硬傷


  轉折幾乎沒時間鋪墊


  女兒選擇復活霍爾嘉我能理解


  對她來講霍爾嘉才是跟她一起長大的媽媽


  但 對Elgin來講 也放棄得太快了吧


  至少去找別的方法復活老婆啊!



  魔物出現的種類不少


  不過預告幾乎都出現了


  沒有什麼太多的驚喜  蠻可惜的~



  片中的笑點  比較像


  星際特攻隊中 德克斯的笑話


  通常要繞一個小小的彎


  我個人是蠻愛的~



  一些小細節拍得很認真的


  實景畫面也很漂亮




  喜歡魔幻電影的人


  蠻推薦進場去看的


  票房不好 看一部少一部~~~



  --


  中間就用笑梗  在舖兩人的感情線


  應該說電影時間線推非常快


  對我這個感情潔癖的人來講


  像是老婆剛死沒多久  就去找新歡



  到最後女兒還是比水煮馬鈴薯重要



  霍爾嘉不是狗啊'
