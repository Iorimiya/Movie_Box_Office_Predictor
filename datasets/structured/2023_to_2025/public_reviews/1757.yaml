  好玩有趣的精神搬上大銀幕，是一部既搞笑又充滿驚險刺激動作場面的冒險動作片


  一名魅力十足的盜賊和一群冒險家踏上一場史詩般的劫盜之旅，

  目的是奪取一件遺失的古物，但是當他們惹上不該惹的人物，事情就變得非常危險。


