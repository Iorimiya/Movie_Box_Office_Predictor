url: https://www.ptt.cc/bbs/movie/M.1680758755.A.A77.html
title: '[好雷] 超級瑪利歐兄弟電影版 Super Mario Bros.'
content: "雷文防雷資訊頁\n\n\n\n無雷心得：\n\n1.劇情基本款穩定牌，沒有太出乎意料的轉折\n\n2.角色討喜，尤其碧奇\n\n3.最後有點趕場，整體會覺得略短\n\
  \n4.動作的部份會希望設計更多、更刺激\n\n5.玩過馬利歐系列電玩會更有感，無論場景、角色或配樂\n\n6.配音比想像中OK\n\n7.兩個片尾片段\n\n\
  8.翻譯沒有某白鴿那種垃圾二創，整體可接受\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n1.劇情推進的理由算蠻充足也很基本\n\
  \n  庫巴動機就把妹、西裝還跟奧德賽一樣，這個倒沒啥好提的\n\n  金剛參戰和帶到賽車不會太牽強(例如別部片「創」對戰我就覺得很突然)\n\n  而馬利歐跟碧奇同行也都各有各的目的(救弟弟、求援救國家)\n\
  \n\n\n\n2.畫面看起來算蠻舒服，也有一些過去電玩的場景\n\n  例如魚在跳的橋(馬1就有)、岩山(馬4、新超馬等)、空中倒金字塔(奧德賽)\n\n \
  \ 不過也都路過點到為止\n\n\n\n3.讓人會心一笑的角色出場時刻：\n\n  像市長波琳(咚奇剛、奧德賽)、史派克(拆屋工)\n\n  看到蘋果會很想吃的耀西群(馬4、銀河、新超馬等)\n\
  \n  咚奇剛的老爸竟然是國王\n\n  也有出現一下迪迪剛不過這次沒有什麼角色\n\n  庫巴軍的反派也蠻多常見的小兵，包括丟榔頭的最後在大街上也有出現\n\n\
  \  當然缺點也是就露臉讓大家懷舊一下，但沒有太多著墨\n\n  沒有專門為不同角色設計對戰\n\n  另外路易吉到黑暗地那邊其實是會讓人有點期待會不會有洋樓梗\n\
  \n  不過也還好沒有(不然其實那樣會有點硬要)\n\n  另外拿到貓裝(3D world)、貍裝(馬3等)也是玩家熟悉的道具\n\n  縮小菇感覺這次沒有被發揮它的功用，被碰到反而是變回原型\n\
  \n  或許之後庫巴重新復出會用到這個梗吧\n\n\n\n\n\n4.配樂有搭配場景，尤其彩虹賽道音樂一奏出時真是喚起回憶\n\n\n\n5.笑點安排OK；被庫巴吹火變骨龜那幕印象很深\n\
  \n  坐椅子坐到龜殼反彈的梗也蠻不錯\n\n\n\n6.角色蠻討喜，即便是庫巴也不會讓人覺得煩(雖說兩段鋼琴有點多)\n\n  覺得最棒的應該是碧奇，真的帥爆，騎機車、丟冰、練習關卡等都很強\n\
  \n  而且也真的有一國之主的風範\n\n  馬利歐在這部一開始被塑造得很魯，後面修煉橋段有點變成努力的天才\n\n  但其實在賽車那邊明明就很強，仔細想想忽然變強還是有點突兀但不影響整體\n\
  \n\n\n\n7.動作設計我覺得可以再更豐富、玩得更細緻\n\n  賽車那段應該算是全片精華，雖然讓人意猶未盡但也還是真的蠻短的\n\n  藍龜發射是還蠻熱血的(不過竟然是打跑第二快的XD)\n\
  \n  最後劇情推進覺得偏趕場\n\n  (路易吉用水溝蓋擋火那幕還不錯)\n\n\n\n\n\n8.配音的部份原本看預告和評論不抱期待，不過正片看完覺得是OK的\n\
  \n\n\n\n\n\n--\n\n \n \n\n\n \n\n--"
