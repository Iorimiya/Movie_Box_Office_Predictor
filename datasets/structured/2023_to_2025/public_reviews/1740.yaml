url: https://www.ptt.cc/bbs/movie/M.1685458413.A.589.html
title: '[好雷]遲來的心得 超級瑪利歐兄弟電影版'
content: 'Medium版：


  身為非粉玩家，我從來不知道瑪利歐的世界觀與人物設定，只關心破關的我以為公主就是

  個代表任務成功的象徵、蘑菇就是用來變大、甚至不知道他們有自己的王國。在進入滿滿

  遊戲元素的場景的同時我好像懂了一點他們的世界。


  其實這種改編的電影滿兩難的吧，在一般大眾與原作粉（包含原電玩、原小說、原劇）的

  需求之間很難平衡，不可能完全不改，因為電影就是需要改變，否則很難打進一般大眾；

  改了太多，又會遭到原作粉的批評。


  感覺起來瑪利歐兄弟電影版做的滿好的，至少我聽到的原作粉都很開心有各種懷舊遊戲的

  元素塞在裏頭（我也覺得滿驚喜的）。作為一般大眾來看，電影輕鬆有趣，不算有什麼大

  起大落，娛樂性質很高。總和來看，我弱弱的覺得大部分影評負雷很多是為酸而酸；它是

  部各個角色都很有魅力，也可以很愉快欣賞的電影。





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  以下我對各個角色的心得。


  瑪利歐：是我不太喜歡的角色，就是個滿魯的人。就我來看他不能算是布魯克林的英雄；

  他只是把另一個世界的戰爭帶了過來，破壞了布魯克林的一些建築，最後成功讓這個混亂

  不要造成更多傷害而已。


  在某些時刻我確實有點欣賞他的，比方說他很努力把蘑菇吞下去的時候，我確實覺得這滿

  困難的。還有他在闖關一直失敗、碧姬跟他說她以前更差的時候，他一眼就知道碧姬只是

  在安慰他，真是有自知之明。


  但如果我有小孩，看完電影我一定會跟他說千萬不要變的跟瑪利歐一樣，真實世界沒有一

  個蘑菇王國等著你去拯救（而且你也拯救不了）。


  路易吉：我都這樣評價瑪利歐了，自然認為路易吉跟他是一掛的；但是至少沒什麼人會把

  路易吉塑造成一個英雄角色，所以我也沒有特別反感。


  碧姬：算是影評滿熱烈討論的角色，公主不是個等待被救的定位，而是個堅強有能力的一

  國之君。她在各個場面（尤其是騎車）都帥爆。


  我唯一對她的不滿之處是她對瑪利歐太好了。大概是因為沒見過人類吧，她要是見過更多

  人類中的勝利組，絕對不會對瑪利歐有這麼多感情，頂多同情。


  咚奇剛：我最喜歡的角色！一出場就把我迷死。很得意秀自己的肌肉、在台上跟老爸打招

  呼的樣子都很有魅力，而且講話有夠中肯。我最喜歡他跟瑪利歐在鯊魚肚子裡那段，說瑪

  利歐的爸爸很有智慧（還是其實我就是喜歡他的靠北而已）。


  庫巴：我其實覺得各方面來說是個很不錯的對象，戰力強大、才華洋溢、還專一深情，就

  是有點太執著了。我也滿喜歡他們的王國，簡直像強者組成的歡樂夜總會。碧姬如果願意

  好好談條件的話，應該真的能跟他打造多采多姿的王國耶。


  奇諾比奧：身影比較單薄的一個角色，我單純覺得在蘑菇王國要毀滅時能不自量力地待在

  碧姬身邊說「我絕對不會離開你」，有一種很莫名的帥氣和決絕。


  監獄裡的藍色星星：超級搶眼的配角，沒有自己的故事線卻惱人的可愛，講的話其實也充

  滿一種虛無的道理，因為有點道理所以才是他最討人厭的地方吧。


  ~~


  這個電影其實成功讓我對瑪利歐的世界有了好奇心，想要知道這個系列有沒有完整的世界

  觀。碧姬為什麼是人類卻無緣無故到了蘑菇王國？藍色星星的身世是什麼？庫巴是怎麼開

  始對碧姬如此深情？瑪利歐後續的人生長什麼樣子？我會去認真玩玩遊戲好好探究的。


  --

  就這一個層面很OK，兄弟情義和在弟弟面前故作堅強的部分我也欣賞

  我認為就這部電影瑪莉歐的表現來看，適時的放棄是必要的吧。

  光是傾家蕩產只為了拍水管工的宣傳片我就覺得很不認同了。

  你這個留言好療癒喔，謝謝你，給了我日後吃更多誠實豆沙包的勇氣

  兄弟情義的部分我倒是認同

  我更喜歡在賽道上他們對話完，瑪莉歐馬上被咚奇剛嘲笑不能這樣把妹XD

  乾 超靠北

  這個解釋我客觀上接受，但看完的直覺就是覺得這角色太魯了不討我喜

  好，我會拭目以待續集。庫巴真的超強

  真的，如果是我我選庫巴'
