url: https://www.ptt.cc/bbs/movie/M.1682075859.A.B94.html
title: '[好雷] 超級瑪利歐兄弟電影版'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~























  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  在我小時候，電玩就是指電視遊樂器，曾經它的代名詞是任天堂的「紅白機」，而遊戲，

  就是指「超級瑪利歐」。在動畫預告裡，路易吉有一句台詞：「你以為我認識每一個留著

  小鬍子，穿得跟我一模一樣，帽子上繡有名字的人嗎？我才沒這麼厲害。」但是這一個留

  著小鬍子，穿著紅衣吊帶褲，頭上紅帽子繡著大Ｍ的紐約水管工，我還真的很難想像在知

  道電玩是甚麼的世界裡，有誰不認識他。


  我不是《超級瑪利歐》的忠實粉絲，對主遊戲的印象停留在 2D 8bit 時期，也從來沒有

  全破過任何一代，再接下來有接觸的就是《瑪利歐賽車》，但對整個遊戲世界的各種元素

  、配樂、角色卻從來沒有遺忘過，在動畫中看到每一項熟悉的要素出現都是一陣雞皮疙瘩

  掉滿地的感動。每個物件在瑪利歐世界裡你都能直接知道它代表的意義，這麼簡單純粹的

  圖像意義連結在人生中接觸過的作品裡非常少見，《超級瑪利歐兄弟電影版》的成功，就

  是因為《超級瑪利歐兄弟》太神了。


  有趣的是，也許後來在瑪利歐系列的其他遊戲有補完世界觀設定，但至少在我玩過的瑪利

  歐遊戲裡，我從來就不知道劇情是甚麼，只知道「公主被魔王帶走了，為了拯救公主，勇

  者要突破重重關卡去打敗魔王」這個貫串萬千遊戲的核心。瑪利歐怎麼到蘑菇王國？蘑菇

  王國的公主為什麼看起來像人類？庫巴的野心到底是甚麼？這些在今日的遊戲乃至於影視

  作品中會被玩家或觀眾反覆檢視的問題，在遊玩遊戲的當下完全被「通關」的渴望遮蔽而

  拋諸腦後。或許就像瑪利歐在動畫中接受碧姬的考驗一樣，無數次的被花咬死、砲彈撞死

  、踩空摔死，只差臨門一腳但還是功虧一簣時，碧姬突然說：「好了，出發吧。」瑪利歐

  第一反應卻是：「可是我還沒過關啊？」在那一瞬間彷彿忘了他一開始的目的是盡快去救

  弟弟，只想克服這該死的考驗關卡。


  但動畫畢竟不是遊戲，還是需要一個完整的主線故事。而《超級瑪利歐兄弟電影版》選擇

  用最直接簡潔的方式串起每一個你曾經可能對瑪利歐世界有過的疑問，將所有劇情緊貼「

  公主被魔王帶走了，為了拯救公主，勇者要突破重重關卡去打敗魔王」這個核心，又用個

  性鮮明的角色顛覆觀眾對這些身分的刻板印象，也不至於太過政治正確流於說教而引起觀

  眾的反感。


  或許這也是為什麼影評上映前的評價普遍不佳，但上映後觀眾卻佳評如潮。對看過成千上

  百部作品的影評來說，對電影的口味在不知不覺中已經越吃越重：瑪利歐堅持理想的背後

  應該要有深刻的人生體驗、路易吉膽小怕事的個性應該有更多被霸凌的刻畫、碧姬公主身

  為異世界外人，在蘑菇王國這個異鄉的辛酸成長史，怎麼可以只用幾幕畫面跟一句還有好

  多異世界帶過、是甚麼造就了庫巴的不可一世，以及他不愛江山愛美人的性格？沒有這些

  要素，怎麼豐富動畫本身關於「相信自己的能力，以及團結可以戰勝一切」這個主旨（如

  果這個主旨存在）？


  但影評可能無意識間過度將電影視為文化的載體，而忘了它也可以是一種單純的娛樂。觀

  眾進戲院不一定是要追求甚麼高大上的人生意義或社會正義，而只是單純地想要放鬆心情

  ，回顧那個曾經充滿歡樂的生活，對銀幕上每一個簡單可愛的角色動心（嘿呵最高！），

  沉浸在一個龐大群體的共同記憶裡，那裡人們說著共有的語言，對同樣的事物有共鳴，不

  分國界、種族，每個人進入那個世界都只是平凡的義大利裔水管工，奔向聳立在終點的那

  面旗子。


  也許是安雅泰勒喬伊配音的碧姬公主，那個與她本身在其他作品所呈現一貫看似嬌弱，實

  則堅強獨立自主的帥氣形象太強烈，而傑克布萊克配音的庫巴顛覆外型會帶來的刻板印象

  ，再加上無比深情又洗腦的《碧姬之歌》，獨特的嗓音讓我看完好幾天都還忘不了；相比

  之下瑪利歐與路易吉過於樸實與不知該說是優點還是缺點的忠於原作，以至於在跑片尾名

  單前我都還以為是原遊戲配音員查爾斯馬爾蒂內配的（可能這樣還比較好？），直到我看

  到克里斯普瑞特與查理戴的名字。而原配音員倒是配了瑪利歐的老爸以及那個陪兄弟倆看

  完廣告後做出瑪利歐跳並喊"Wahoo"的路人，難怪我覺得這個聲音比較到位（馬後炮）。


  現在《超級瑪利歐兄弟電影版》已經成為史上最賣座的電玩改編動畫，輕鬆超越了多年宿

  敵《音速小子》（算得上是對手嗎？）甚至在上映兩週後的現在，還幫它宣傳或許有點錦

  上添花，但如果這陣子只想好好找部電影放鬆心情，不需過多思考的沉浸在電影世界，那

  《超級瑪利歐兄弟電影版》是適合闔家觀賞的選擇，前兩篇介紹的《龍與地下城：盜賊榮

  耀》與《捍衛任務４》也不錯。至少在「辣群光頭肥牡蠣」出來飆車前可以帶來很好的娛

  樂效果。


  --'
