url: https://www.ptt.cc/bbs/movie/M.1681309370.A.DBB.html
title: '[好雷] 超級瑪利歐兄弟電影版'
content: '雷文防雷資訊頁


  超級瑪利歐兄弟電影版

  The Super Mario Bros. Movie

  2023美國/日本電影動畫




  劇情簡介：


  本片由影集《後翼棄兵》/《北方人》)安雅泰勒喬伊、《侏羅紀世界》系列克里斯普瑞特

  、《環太平洋》系列查理戴、《野蠻遊戲》系列傑克布萊克、《選情尬翻天》塞斯羅根、

  《尖叫旅社》系列基根麥可奇配音。改編自最受歡迎的電玩遊戲，敘述一名水管工瑪利歐

  和他的弟弟路易吉，試圖破解地下迷宮救出被抓走的碧姬公主。


  《超級瑪利歐兄弟電影版》一片的導演是亞倫霍瓦斯和麥可傑勒尼克（卡通影集《少年悍

  將GO！》、《電影少年悍將GO！》），編劇是馬修福格（《樂高玩電影2》、《小小兵2：

  格魯的崛起》），配音明星陣容超級堅強包括克里斯普瑞特（瑪利歐）、安雅泰勒喬伊（

  碧姬公主）、查理戴（路易吉）、傑克布萊克（庫巴）、基根麥可奇（奇諾比奧）、塞斯

  羅根（咚奇剛）、佛萊德阿米森（庫朗奇剛）、凱文麥可理查森（卡美克）以及賽巴斯汀

  曼尼斯葛爾柯（布拉奇）。這部動畫片的製片是照明娛樂創辦人和執行長克里斯梅勒丹德

  利以及任天堂的「瑪利歐之父」宮本茂。


  安雅泰勒喬伊負責配音的碧姬公主是蘑菇王國精明能幹的統治者，當大魔王庫巴率領他的

  邪惡軍團，打算摧毀蘑菇王國，碧姬公主為了捍衛她的家園，和瑪利歐一起踏上一場驚險

  刺激的冒險旅程。導演亞倫霍瓦斯說：「在這部電影中，碧姬公主不是一個被壞人綁架後

  等著被拯救的柔弱女生。」“我們覺得讓碧姬公主成為一個擁有強烈意志的堅強角色非常

  重要，而且她作為這部電影的主人翁踏上冒險旅程時的嚮導，在這個故事中扮演了非常關

  鍵的角色。她是蘑菇王國的統治者，必須經常抵抗大魔王庫巴的攻擊，所以她理所當然就

  必須變得精明強悍和能力非凡。”


  「當我得到扮演一個受到全球死忠粉絲喜愛的角色，真的是超開心的，但是我有機會能夠

  更深入地塑造這個角色，並且讓她成為這個故事的大英雄，更是讓我感到非常興奮。」安

  雅泰勒喬伊說：「碧姬公主重新定義了身為一位公主代表了什麼，因為她能夠掌控自己的

  命運，她並不是一個柔弱無助的落難公主，更不需要一名白馬王子來英雄救美，她根本就

  不需要任何人來拯救她。她也是一名充滿動力和決心的領導者，無畏無懼、堅忍不拔、精

  明能幹，而且充滿了愛心，非常關心蘑菇王國並希望大家都受到最好的照顧，平平安安地

  過生活。當看完這部電影，我真的受到很大的啟發，然後內心想說：『我也希望能夠變成

  跟她一樣的人。』」




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  超級瑪利歐兄弟電影版，全片感覺太可愛了，許多劇情畫面及角色有趣極了，連反派角色

  都很好笑。


  全片可愛充滿童趣，很合我口味，很喜歡。

  個人滿意度90分（滿分100）。


  這部電影是為任天堂和超級瑪利歐兄弟的粉絲準備的，同時也令猤是粉絲的觀眾包括我，

  也看得很開心                        。全片的大明星的配音效果很好，我喜歡他們整

  體，讓故事像好玩的一些兒童遊戲一樣簡單，全片感覺就像大銀幕上的視覺童趣遊戲。這

  部電影感覺就像一個精美的動畫遊樂園，電影中的所有音樂也很棒，充滿活潑動力，和劇

  情共同發揮相得益彰的作用，全片90 分鐘我感覺時間過得很快，感覺很棒，歡樂的時光

  過得特別快。我已經很久沒有在電影中，享受到如此感覺時光飛逝，且令我開懷，開心大

  笑的童趣的影片了。


  PS.

  本片角色配音的大明星之介紹：



