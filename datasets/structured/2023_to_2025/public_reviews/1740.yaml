title: '[開箱] 台版 超級瑪利歐兄弟電影版 4K+BD鐵盒版'
content: '英文片名：The Super Mario Bros. Movie

  中文片名：超級瑪利歐兄弟電影版


  老實說就現在的社會氛圍來看

  我一開始是真的對瑪利歐電影版沒啥信心可言

  還會開玩笑的說是路易吉要變黑人嗎!!XDD


  沒想到進電影院後可以讓我得到愉快的92分鐘

  當然很多人批評這片沒有「深度」、像是「看人玩遊戲」

  甚至是「這就不是電影」這種負面評價


  我尊重你，就算你五歲就開始看楚浮培養影評觀我也尊重

  那怕我只記得小時候看的比留子我也尊重


  但其實很多時候電影也就是個「娛樂」

  我想看到阿湯哥帥氣的開著飛機Dogfight

  我想看到英雄們浴血放大招打敗敵人

  我想看到江維克為了他的狗大殺四方


  我當然也想看到瑪利歐吃無敵星星擊敗庫巴

  我心中那個小男孩也想XDD


  我想全球票房跟台灣發售前就絕版的鐵盒也可以說明一切吧XD


  底下來開箱~


  外紙盒：






  鐵盒與碟片：





  不過誰來跟我講一下為啥BD碟面圖是路易吉

  有時候真的覺得這些選用圖都很微妙XD


  以上!!


  --








  --'
