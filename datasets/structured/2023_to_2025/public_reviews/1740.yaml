url: https://www.ptt.cc/bbs/movie/M.1680865046.A.730.html
title: '[好無雷] 超級瑪利歐兄弟電影版 - 玩家粉絲好爽'
content: '《超級瑪利歐兄弟電影版》 8/10分


  對一個任天堂及超級瑪利歐玩家來說

  這部片實在太讚

  很多遊戲梗若能領會

  整部片的娛樂性直接高了好幾個層級


  從角色/怪物/道具/場景 甚至是操作介面

  很多地方都直接重現

  Ex:瑪利歐64、瑪利歐賽車、瑪利歐奧德賽、大金剛熱帶急凍、路易吉洋樓、超級瑪利歐

  3D 世界、歷代的紅白機瑪利歐…反正太多了

  整個就是爽

  像是瑪利歐賽車的選車界面

  還真的原汁原味的搬上來

  實在是很有心

  (可惜沒有選毛蟲車跟綠色輪胎)


  而且意外的是

  整部片很多莫名其妙的笑點(稱讚意味)

  不像是平常的美式笑點

  有點是周星馳那種無俚頭的?

  像是有一個莫名講話超悲觀的角色

  從頭到尾沒交代他為什麼這麼悲觀(或是遊戲中設定有?)

  反正在各種時候就是唱衰

  我直接笑爆

  還有奇諾比奧莫名開一台超大的美國肌肉貨車

  還帶一個耍屌墨鏡

  我也是笑爆


  至於外媒負評說的劇情啥的

  我覺得不功不過

  前面是有一點點小無趣

  但一下子就到重點橋段了

  這方面實在沒什麼好機機歪歪的


  另外就是非遊戲玩家的觀賞性可能就少滿多的

  像是有玩遊戲的就知道飛彈會轉向

  但沒玩過的可能就覺得這機制很莫名吧


  總結

  喜歡任天堂角色或是有玩遊戲的必看

  對這些無感的就可看可不看吧

  但其實動畫也做得很精緻就是了


  推薦給大家


  --


  無雷 電影/影集短評IG：




  --'
