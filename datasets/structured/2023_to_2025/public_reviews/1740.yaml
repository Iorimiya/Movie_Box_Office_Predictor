title: '[新聞] 《超級瑪利歐兄弟電影版》打敗《冰雪奇緣》成影史賣座動畫'
content: '新聞網址：



  《超級瑪利歐兄弟電影版》打敗《冰雪奇緣》成影史賣座動畫第二名！票房第一「神片」

  仍難超越



  《超級瑪利歐兄弟電影版》/《冰雪奇緣》劇照


  【文／克里斯蒂】改編自任天堂最受歡迎電玩遊戲《超級瑪利歐兄弟》的動畫電影《超級

  瑪利歐兄弟電影版》，在全球上映已經兩個月，票房佳績不斷創下新紀錄，目前已在全球

  賣破12.88億美元（約395億台幣）票房，成影史最賣座電玩遊戲改編電影。該片近來再創

  下紀錄里程碑，超越迪士尼人氣動畫《冰雪奇緣》票房（12.84億美元），成為全球影史

  最賣座動畫電影第二名，僅次票房第一名的《冰雪奇緣2》（14.5億美元）。




  《超級瑪利歐兄弟電影版》劇照


  據外媒報導，《超級瑪利歐兄弟電影版》在全球上映期程已屆尾聲，若要在全球票房上超

  越《冰雪奇緣2》，不是容易達成的目標；不過，該片如果能在持續上映一段時間，仍有

  機會打破另一項紀錄，就是在北票房上，有望超越《超人特攻隊2》6.08億美元（約186億

  台幣）票房，成為北美影史最賣座動畫電影，目前《超級瑪利歐兄弟電影版》的北美票房

  是5.63億美元（約173億台幣），還有4500萬票房的差距。




  《冰雪奇緣2》劇照


  《超級瑪利歐兄弟電影版》由亞倫霍瓦斯（Aaron Horvat）和麥可傑勒尼克（Michael

  Jelenic）執導，上映後獲得褒貶不一的評價，甚至在知名影評網站「爛番茄」上，影評

  人給出的新鮮度好評只有59%，未達60%「新鮮」好評標準，但在一般觀眾給分卻高達96%

  滿意度，且該片不只小朋友喜歡，成人都能獲得共鳴，在大眾市場上表現出乎意料的好，

  也是今年截至目前為止，全球票房最高的電影，遠超過漫威超級英雄電影《星際異攻隊3

  》、《蟻人與黃蜂女：量子狂熱》、還在上映中的《玩命關頭X》等強片。




  《超級瑪利歐兄弟電影版》劇照


  除了在票房表現上亮眼，片中由喜劇男星傑克布萊克（Jack Black）聲演的大魔王「庫巴

  」的，他對碧姬公主獻唱的情歌《碧姬》（Peaches）也在網路上爆紅，片商環球影業更

  確認《碧姬》具備資格角逐奧斯卡最佳原創歌曲，並考慮替其報名，爭奪小金人榮譽。



  --

  月老 2.0 愛你愛你久久 2020/09/09 上線


  龍山寺月老 紅線都幫你各位求好了



  霞海城隍廟 兩位月老 法力加倍


