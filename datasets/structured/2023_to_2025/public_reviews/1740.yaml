title: '[好雷] 超級瑪利歐兄弟電影版心得(有雷)'
content: '我個人是瑪利歐迷，瑪利歐運動、賽車、派對都會選瑪利歐的那種


  玩過的作品大概從64開始，比較前面的作品有機會的時候有補一下


  剛剛大約9點多看完電影


  個人不是很喜歡


  不過完全能理解為什麼網路上普遍好評就是
























  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~








  先說結論，這電影很像任天堂處理瑪利歐IP的方式


  我的意思是：

  就像瑪利歐賽車、瑪利歐派對、Dance Dance Revolution: Mario Mix、瑪利歐醫生一樣

  ，十分功能性的作品，感覺是先把劇情主幹立好然後把瑪利歐系列的元素慢慢套進去。


  本質上就是魯蛇翻身記：

  原本是個魯蛇，被家人和死對頭看不起→因緣際會到了異空間，並且有一個目標(救路易

  吉)→遇到動畫片特有的搞笑擔當和一般尋常強勢女A→展開不凡的冒險並慢慢顯露其不凡

  的精神→拯救弟弟，被家人認可→全劇終


  我不討厭那樣的作品，但給我的感覺跟憤怒鳥大電影差不多


  基本上都是套皮，大家進電影院看那個皮怎麼套和套的品質如何


  以這個角度看，我覺得電影有很好的完成他的工作很不錯


  結論大概是這樣，以下我想到的再分開細講：






  先說配音部分，大部分的角色其實都是一個大種族不然就是原創配角，所以表現上我沒什

  麼想法。


  遊戲裡登場的角色部分：

  配最好的我認為庫巴，有把庫巴聲音有點低沉、沙啞的特質配出來，然後配合劇情演出上

  我覺得整個就很庫巴。


  再來是紅白奇諾比奧，基本上有把樂天的性格配出來，聲音也是有刻意把奇諾比奧沙啞的

  感覺配出來，我還蠻喜歡的。


  路易吉的配音是還好，但有微妙的把路易吉的感覺配出來，所以我還蠻OK的。


  DK是作品那種我覺得劇情表現不像DK，但是配音很有DK的那種角色，整體來說配音我蠻給

  好評的。


  瑪利歐原本聽星爵配預告是我覺得很爛，但後面劇情的表現上，我覺得配起來還OK，最後

  還稍微可以接受，但整體來說我還是不喜歡那配音的方式。


  碧琪是我最討厭的，從頭到尾配起來都像皮克斯、迪士尼近期作品的樣板女A，很沒鑑別

  度也很沒個性。




  人物性格的部分無論原創角還是遊戲登場的角色都只是魯蛇翻身記的角色套瑪利歐皮而已

  。但我覺得安插方式還是有差就是。


  整體來說，庫巴、路易吉的性格算是比較接近原本的遊戲，只是庫巴更強調他的殘暴、路

  易吉更強調他的懦弱，但這些為了電影劇情我是能接受。


  DK和我印象中的形象有差，但老實說我沒玩過DK系列的作品所以我不好評論，但我印象中

  DK是那種樂天友善猩猩，和電影裡那種痞痞好鬥的形象好像不太一樣。


  瑪利歐的部分有把他愛護弟弟的性格和挺身而出的性格演出來，我還蠻喜歡那幾個橋段的

  。但活力、開朗的部分被減去了不少，性格多了不少魯蛇窩囊的部分，我知道是為了劇情

  需要，但我自己是不喜歡的。


  碧琪完全像是被奪舍一般，變成皮克斯、迪士尼常出現的樣板強勢女強人角色，和原本的

  人設相差之大成為我電影裡最討厭的要素。原本的性格很無聊沒錯，但電影改成如此對我

  來說其實只是另一種無聊而已。劇情裡戲份佔比非常多，比較像是「超級瑪利歐與碧琪電

  影版」,一下示範破關、一下觀戰的在關鍵時刻當指示廚、一下與庫巴操戈對峙、一下變

  冰碧琪(而且樣子完全只是衣服變藍的)大戰庫巴百萬雄兵，然後整個配音和性格完全不像

  碧琪，我是真的很討厭。




  音樂的部分我覺得是電影最好的部分之一，甚至有不少音樂我感覺是為了電影版這專案生

  出來的(如：庫巴狂怒世界庫巴登場的音樂  )。不少音樂有所

  考據，出處也很豐富：有SFC彩虹跑道、有DK 64的DK RAP、瑪利歐世界的城堡音樂、有銀

  河瑪利歐的主題曲(片尾部分)、有瑪利歐64炸彈兵戰場，個人覺得十分滿意，這部分是真

  的很用心，閉眼當音樂會聽也值回票價。




  其他雜亂的感想：

  我還蠻喜歡把瑪利歐的元素融入一般市民的生活，像是用撞磚塊提款、電梯的樣子、複雜

  的水管通路這些元素。

  然後我知道瑪利歐開頭不少設定是過去的遠古設定回流的，但老實說我個人蠻不喜歡給瑪

  利歐角色加入這些設定的，對我來說瑪利歐有了身世、背景、家庭某種程度上讓這個作品

  的魔法稍微消失了一點，而如宮本茂曾經說過的一樣，也多加了一點束縛。我自己希望這

  只是電影版專用的設定，未來不會在遊戲強調。


  我個人最喜歡的是虛無主義奇可，劇情沒甚麼作用但還蠻可愛的，也是我印象中唯二電影

  版銀河瑪利歐要素。

  再來我還蠻高興寶琳市長能以布魯克林市長，雖然劇情沒有明說，但電影新聞裡形象讓人

  忍不住聯想到他，我希望自從奧德賽復活後他還能有更多在其他媒體登場的機會。也有點

  想看壞瑪利歐、壞路易吉、黛西、羅傑塔、奇諾比可這些角色在未來會如果登場。

  最後瑪利歐原來的配音員Charles Martinet在電影裡用你不可能不會注意到的方式客串演

  出，看到時蠻開心的但同時也對他沒在電影版幫瑪利歐、路易吉配音感到有點可惜。




  整體來說是不錯，我蠻推薦而且也相信大部分的人會很喜歡。只是瑪利歐系列很多角色的

  形象已經在我心中定型了，所以我看到改變時無法接受。


