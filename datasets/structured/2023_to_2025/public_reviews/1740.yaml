url: https://www.ptt.cc/bbs/movie/M.1688050200.A.75F.html
title: '[新聞]《超級瑪利歐兄弟電影版》登上動畫影史票房'
content: '《超級瑪利歐兄弟電影版》登上動畫影史票房第3！回顧全球票房最高的10大動畫電影


  這些經典的動畫電影，你看過了嗎？


  文 / 魯皓平


  2023-06-29



  這些動畫影史上最票房最高的作品，你看了幾部？


  全球影史票房最高的動畫電影，你看了幾部？


  一直以來，動畫電影就有著它獨特的魅力，在充滿想像力的情節和發人深省的寓意中，迸

  發扣人心弦的信念。這些作品通常充滿了歡笑、冒險，也在獨特的畫風和筆觸中交織著意

  猶未盡的美好，它絕對不只是個小孩子愛看的「卡通」，而是能讓大小朋友都受到鼓舞、

  永難忘懷的感動。


  《超級瑪利歐兄弟電影版》（The Super Mario Bros. Movie）上映至今，憑藉經典IP和

  強烈的電玩元素，它創下了許許多多的票房紀錄，不僅是2023年目前的票房冠軍，它還一

  口氣登上了全球動畫電影的第3名，更是影史最賣座電子遊戲改編電影。


  讓我們一起來回顧，影史票房最高的10大動畫電影，這些經典的故事，你看過了嗎？


  10、《海底總動員2：多莉去哪兒？》（Finding Dory）──票房10億2800萬美金



  圖／《海底總動員2：多莉去哪兒？》。 Disney


  2016年上映的《海底總動員2：多莉去哪兒？》，是2003年《海底總動員》（Finding

  Nemo）的續集，由於暌違長達13年，當年上映後的續集受到了全球廣大的迴響，這次故事

  講述前作主角尼莫的朋友、多莉受到記憶衝擊，回憶起自己的過往，展開尋找家人與故鄉

  的旅程。


  《海底總動員2：多莉去哪兒？》上映後，票房和名利雙收，獲得一致讚譽的極高評價，

  特別是動畫、情感、配樂和無比歡笑的幽默備受好評，它還深刻探究了海洋保育議題，有

  著發人深省的鼓舞和感動。




  9、《神偷奶爸3》（Despicable Me 3）──票房10億3400萬美金



  圖／《神偷奶爸3》。UIP


  2017年上映的《神偷奶爸3》，是神偷奶爸系列電影的第三部作品，這系列電影還直接捧

  紅了劇中的角色「小小兵」，使他成為全球知名的經典形象，當中以凱文、史都華和蘿蔔

  最為著名。由於故事充滿喜感、歡樂無限，票房也非常亮眼。


  《神偷奶爸3》描述，大壞蛋格魯改邪歸正，並與女特務露西喜結良緣，這次格魯在尋找

  自己失散多年的孿生兄弟德魯的同時，還得對抗巴瑟薩布萊德。面臨失業、中年危機和小

  小兵的背叛，格魯能否痛定思痛並重出江湖，與巴瑟薩布萊德展開正邪較量，並重奪「神

  偷奶爸」的地位？




  8、《玩具總動員3》（Toy Story 3）──票房10億6600萬美金



  圖／《玩具總動員3》。Disney


  2010年上映的《玩具總動員3》，是這系列經典作品的第3集，劇情描述，現年17歲的安弟

  即將升上大學，胡迪、巴斯光年和其他玩具被安弟的母親意外捐贈給了育幼中心，在得知

  安弟在尋找他們後，這些玩具即將一起展開史上最大規模的逃亡行動。本片捧紅了新角色

  「熊抱哥」，周邊商品更是暢銷。


  和前作相同，《玩具總動員3》在一上映後就獲得了排山倒海的正面鼓舞，特別是劇本的

  深度和整個動畫製作的精細，都讓人深深陶醉在它豐沛的故事情感中，而且電影中的寓意

  十分發人深省。本片也獲得了奧斯卡最佳動畫長片和最佳原創歌曲的榮耀。




  7、《玩具總動員4》（Toy Story 4）──票房10億7300萬美金



  圖／《玩具總動員4》。Disney


  2019年上映的《玩具總動員4》，在當時引起了廣大迴響。劇情敘述，小女孩邦妮製造了

  玩具「叉奇」，讓玩具們又得面對新人加入的議題，但叉奇始終不認為自己是個玩具，千

  方百計逃離自己的命運，卻連累有著保護眾玩具為使命的胡迪，在隨著邦妮踏上公路旅程

  的同時，玩具們也展開了全新的冒險。


  《玩具總動員4》就像個玩具們的公路電影，而公路電影最迷人的地方，就是故事主人翁

  往往在這段漫長的旅途上，意會人性的真諦和感念，它幽默、逗趣，也從無盡的歡樂氛圍

  中，點綴你從沒想過的豁然開朗。本片從故事、幽默、情感深度、音樂、動畫和表演而備

  受讚譽，最終也獲得奧斯卡最佳動畫長片的殊榮。




  6、《小小兵》（Minions）──票房11億5900萬美金



  圖／《小小兵》。UIP


  2015年上映的《小小兵》，是《神偷奶爸》系列的外傳和前傳作品。劇情描述，源起盤古

  開天時期，小小兵一族剛開始只是一些黃色的有機體，隨著時間漸漸演化成現在的小小兵

  種族，他們終身都需要服侍最邪惡的主人們，然而，從最初的暴龍到拿破崙都不小心被他

  們害死，小小兵們發現自己到後來沒有可以服侍的邪惡主人，遂把這個目標當成他們唯一

  的使命。


  《小小兵》故事十分幽默、笑料百出，非常惡搞又趣味，立基於他們的強大人氣，電影在

  推出後就獲得了票房上的巨大成功，總票房數超過11億美金，建立了獨特的「神偷奶爸電

  影宇宙」。




  5、《超人特攻隊2》（Incredibles 2）──票房12億4200萬美金



  圖／《超人特攻隊2》。Disney


  2018年上映的《超人特攻隊2》，是2004年《超人特攻隊》的續集，延續著14年前的經典

  ，《超人特攻隊2》在推出時就受到了許多老影迷們的期待，這部電影對許多人來說，是

  個童年及青春的記憶，寄託了歡笑與純真、理想與希望、善良與正義，更在大家心中埋下

  了希望種子。


  在過往，許許多多超級英雄電影常常帶給眾人光鮮亮麗的印象，但它卻很少詮釋在那風光

  背後，每個人都擁有的惆悵和壓力，也許是家庭、恐怕是世人眼光，而《超人特攻隊2》

  中把雙親和青少年男女之間的問題精湛呈現，逗趣爆笑又發人深省，動畫技術和配音、劇

  本的精湛，十分受到歡迎。




  4、《冰雪奇緣》（Frozen）──票房12億8400萬美金



  圖／《冰雪奇緣》。Disney


  2013年上映的《冰雪奇緣》，在全球掀起了一股〈Let It Go〉炫風，靠著出色的劇本核

  心、角色塑造、音樂渲染、視覺效果，《冰雪奇緣》帶來了迪士尼動畫的文藝復興，成了

  迪士尼動畫自己第一次榮獲奧斯卡最佳動畫片的作品。


  這部片在當時火紅的程度，幾乎讓所有小女孩都打扮成艾莎和安娜，雪寶的可愛形象更成

  了眾人熱愛的電影巨星，讓艾倫戴爾王國的公主，還有那擁有冰雪魔法的奇幻非常扣人心

  弦。《冰雪奇緣》動畫做工精細，不僅光是雪花就畫了超過2000多種，一個城堡的鏡頭，

  就為了顧及折射和光影，動用50位動畫師花費30個小時製作，讓人彷彿置身真實的冰雪世

  界。




  3、《超級瑪利歐兄弟電影版》（The Super Mario Bros. Movie）──票房13億3500萬美

  金（上映中） UIP



  圖／《超級瑪利歐兄弟電影版》。 UIP


  瑪利歐兄弟是許多人童年至今的回憶，而它的改編電影《超級瑪利歐兄弟電影版》更是以

  力拔山河之姿，從一上映後就在全球獲得熱烈迴響，不僅是2023年目前的票房冠軍，它還

  一口氣登上了全球動畫電影的第3名，更是影史最賣座電子遊戲改編電影。


  《超級瑪利歐兄弟電影版》是個獻給所有影迷的情書，特別是當所有電玩角色都齊聚一堂

  、而且人物個性設定鮮明時，故事自然受到歡迎，而且大小朋友都愛戴，也能深深陶醉在

  那令人意猶未盡的氛圍中。




  2、《冰雪奇緣2》（Frozen II）──票房14億5000萬美金 Disney



  圖／《冰雪奇緣2》。Disney


  延續著第1集的經典，《冰雪奇緣2》在推出之前就成了全球影迷們最期待的作品，延續著

  首集的信念、世界觀，本片用了更宏觀、完美的劇本設定，交織出整個故事扣人心弦的一

  面，主題曲〈Into the Unknown〉毫不意外再次成了傳唱經典，見證《冰雪奇緣2》的火

  紅程度。


  隨著《冰雪奇緣2》的故事發展，或許原先那位可能還懵懂天真的小女孩，也在時間的洗

  禮下有著煥然一新的體悟，因此劇本也在劇情中帶入了故事主人翁的成長，蛻變後的冒險

  更加成熟，也在回歸初心的堅持上，點綴迷人的夢幻。




  1、《獅子王》（The Lion King）──票房16億5600萬美金



  圖／《獅子王》。Disney


  全球動畫電影票房最高的作品，是2019年所上映的《獅子王》。1994年，距動畫電影上映

  25年前，《獅子王》動畫正式上映，亮麗的畫風、細膩的筆觸，浪漫的曠野世界觀和非洲

  大陸動物們獨特的和諧，勾勒出那傳奇舞台上，扣人心弦的歌舞饗宴。


  25年來，《獅子王》的形象以各種不同的形式深植在你我心中，除了動畫續集外，百老匯

  歌舞劇的震撼，更是讓故事中每一段令人朗朗上口的歌曲，都有著別開生面的激盪。


  特別是電影裡那維妙維肖、栩栩如生、生動逼真的畫面，將每一隻動物獨有的面貌都有煥

  然一新的體驗，從表情到喜怒哀樂的情緒變化，呈現出撫慰人心的療癒。《獅子王》磅礡

  的史詩氣度、對生命輪迴的體現描述，怪不得是永恆的經典象徵。




  遠見



  --'
