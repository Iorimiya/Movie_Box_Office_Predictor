  記者楊智仁／綜合報導


  改編自任天堂經典遊戲，由美日合製《超級瑪利歐兄弟電影版》自4月5日上映以來屢創佳

  績，截至目前為止，作品全球累積票房飆破10億美元，

  過去幾年，電影產業受到疫情衝擊有著不小影響，自疫情爆發後僅五部電影突

  破「10億美元」大關，而《超級瑪利歐兄弟電影版》短短時間就達成這項里程碑。




  《超級瑪利歐兄弟電影版》挾帶著任天堂的經典回憶，4月5日美國與台灣等地同步上映：

  地表最強水管工超級瑪利歐兄弟正式開業，包含「碧姬公主、奇諾比奧、咚奇剛」等熟悉

  角色接連登場，聯手對抗大魔王庫巴。《超級瑪利歐兄弟電影版》自上映以來全球首周票

  房飆破3.78億美元( 約115億台幣 )，後續在北美4.9億、海外5.32億美元的票房加持下，

  如今作品累積收入達到10.2億，不僅成為2023年全球票房冠軍，





  而《超級瑪利歐兄弟電影版》如今也晉升「

  10億美元俱樂部」。值得一提的是，電影在一般觀眾、影評人之間評價相當兩極， 舉知

  名評分網站「爛番茄」為例，影評人僅59%新鮮度，然而一般



  -----

  Sent from MeowPtt on my iPhone



