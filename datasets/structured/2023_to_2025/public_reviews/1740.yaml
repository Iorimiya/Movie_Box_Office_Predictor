url: https://www.ptt.cc/bbs/movie/M.1682611232.A.BFF.html
title: '[好無雷] 超級瑪利歐兄弟電影版'
content: "部落格原文好讀版\n\n\n 這篇文章理所當然地出現了。\n\n不久前冷蛋去看了《超級瑪利歐兄弟電影版》，在觀看之前就聽說這是一部觀眾很喜歡，\n\
  但影評卻評為平庸之作的作品。\n\n身為一般觀眾，想必我會喜歡吧？畢竟我也算是瑪莉歐的小粉絲之一，系列文的第一篇就是從 Super Mario Bros. 遊戲心得開始分享的。\n\
  \n這篇文章就來閒聊冷蛋的觀影心得，文章內不太會有劇情雷，只是可能會有幾句描述角色\n設定的文字，還沒看怕被暴雷的朋友可以自行斟酌。(個人認為算是無雷)\n\n\
  那麼，\n\n---\n\n\n\n\n\n在接觸到電影之前，想先分享我眼中的任天堂。\n\n任天堂讓人覺得是一間很保守的公司，我的感覺也差不多。因為工作的關係，冷蛋剛好有\n\
  幸對這家公司有多一點點的接觸與認識，嗯，他們真的，有著很堅持的一面，也難怪老任\n的法務部那麼出名呢！\n\n冷蛋愛玩遊戲，家中有 Switch 主機，主機的性能實在不怎樣，沒辦法跑畫面很精細的遊\n\
  戲。例如多少玩家希望能有 4K 畫質的《曠野之息》，讓人沉浸在美麗的海拉魯大陸，但\n官方主機就是跑不動。\n\n而且這不是第一次，一直以來任天堂的主機與遊戲在畫質上就是輸人一截，即使多少玩家\n\
  敲碗了幾年，他們也沒有生出強化版主機，感覺有夠固執。\n\n他們堅持的是什麼？在我看來是他們的強項，是藍海策略，是闔家歡樂。\n\n任天堂的遊戲一直以來都有獨特的魅力存在。相較於\
  \ SONY 和微軟的主機追求高畫質、擬\n真，任天堂反而是以讓人感到驚奇的遊戲性走出另一條路。\n\n一款《曠野之息》遊戲，被玩家譽為重新定義「開放世界遊戲」；一套\
  \ Wii 主機，在當\n年首先創造體感遊戲的風潮，看到廣告時讓人驚喜「遊戲居然能這麼玩，甚至能運動！」\n；一款《超級瑪利歐 64》，是 3D 遊戲經典始祖，在那個技術還不成熟的年代給出許多\n\
  至今仍適用的概念。\n\n也就是說，任天堂不只是一家固執與保守的公司，他們同時也有著引領遊戲產業的強大實\n力，在遊戲性與形式上持續創新，在闔家歡樂的概念上不斷堅持。\n\
  \n他們很懂自己的強項與弱點，堅持自己想走的路，結果是始終被模仿、從未被超越。\n\n最早的 Super Mario Bros. (超級瑪莉一代) 正是如此，對遊戲產業有著重大意義，而這\n\
  次的《超級瑪利歐兄弟電影版》，我相信是用同樣的理念做出嘗試。\n\n\n\n\n\n\n來談談這次電影版的劇情吧！嗯...劇情就是...那樣！\n\n抱歉了，說好的不暴雷\
  \ (笑)，而且劇情其實也沒有什麼說出來讓人腦洞大開、反轉再反\n轉的深度內容，就是一般小孩看了會很開心的那種。\n\n對，劇情普通、沒深度、爽片。\n\n就是任天堂堅持的「闔家歡樂」，他們再一次地讓玩家感受到瑪莉歐宇宙的趣味性，但這\n\
  只是開頭。\n\n事實上，任天堂宇宙累積了三十幾年，底下已經有著太過龐大，怎麼濃縮也不可能壓在一\n部電影裡的內容。\n\n而且就單說超級瑪莉歐系列就好，光是這個經典\
  \ IP，就已經有數不完的系列作及相關作\n品，冷蛋進電影院的時候都不知道他們應該要如何處理這麼龐大的世界觀，該把哪些內容\n放進來。\n\n劇情有忠於原著嗎？我認為不是有沒有的問題，而是「做不到」。\n\
  \n因為瑪莉歐系列本身的劇情每一代都不太一樣，自己就是平行宇宙了，人物設定細節本來\n就沒有完整，而且遊戲本身的劇情也不太重要，重點一直都是遊戲性。\n\n大部份人對瑪莉歐遊戲印象中的劇情只有「公主又被庫巴抓走了，我怎麼會說又呢？好吧\n\
  ，瑪莉歐去救她。」\n\n但那不重要，只要進入遊戲世界，就有著滿滿的驚奇與細節。任天堂這次又搞出些什麼花\n招？有什麼新道具新玩法？又會在哪裡藏了什麼讓人會心一笑的設計？\n\
  \n然後...挖賽！居然可以這樣玩！路易吉，這玩意兒比魔杖好用啊！(錯棚)\n\n這是任天堂的強項「令人驚喜的遊戲性」，我認為他們也把這樣的概念帶進了電影之中。\n\
  \n我在看電影時不斷注意老任埋了哪些彩蛋，但根本來不及思考。這裡背景一張圖、那裡的\n畫面根本就是哪裡的場景、背景音樂一段裡混了三個不同但熟悉的片段...\n\n\
  我覺得我不是在看電影，而是在玩電影，難怪有影評說這不像電影，而是遊樂園、派對遊\n戲。\n\n至於劇情好不好？只能說我認為沒有忠於原著。\n\n瑪莉歐的確是那個從小陪我長大的傢伙，不斷努力、不懂失敗，只要我拿起手把，就能繼\n\
  續挑戰，是標準的王道設定。\n\n大反派庫巴？我覺得他很帥啊！重金屬搖滾風格很不錯，但更讓所有人留下深刻印象的是\n他自彈自唱、深情款款的那段告白內心戲，記憶點十足。\n\
  \n(官方有放一段人氣歌曲《Peaches》的內容在網路上，不含劇情雷，有興趣的朋友可以上\n網聽聽，私心希望奧斯卡最佳原創歌曲能獲獎)\n\n至於公主碧姬？不再是遊戲中很多人以為的花瓶了！有著與身分符合的實力與魅力，存在\n\
  感破表，這也是任天堂有在做創新嘗試的證明。\n\n還有弟弟路易吉，本身存在感不高，但不是哥哥的影子，劇情上看來或許他是最「忠於原\n著」的角色，卻也是關鍵人物，畢竟電影名稱都叫「兄弟」了呢！\n\
  \n\n\n\n\n\n不管是不是瑪莉歐的粉絲，我想許多人都知道遊戲中一般分成兩大陣營：代表好人主角的\n瑪莉歐及蘑菇王國的居民，以及代表經典反派的庫巴大魔王與旗下許多怪物。\n\
  \n這次的《超級瑪利歐兄弟電影版》上映後，相較於電影本身普通的劇情，倒是場外自動分\n成了更掀起話題的兩大陣營：給低分的影評與好評價破表的一般群眾。\n\n一邊舉著「認真分析，電影要更好」的大旗，即使知道會被罵仍堅持自己的專業；另一邊\n\
  覺得好看、娛樂性滿滿就是好作品，劇情沒有很重要，影評不懂還吹毛求疵。\n\n兩邊似乎都覺得自己是守護正義的一方，一方守護電影專業、一方守護娛樂價值。\n\n或許正因為是任天堂，因為是瑪莉歐，這部電影才受到了這樣的放大檢視，感覺這部電影\n\
  也有「責任」要為「電影」做些什麼、引領什麼。\n\n要說影評都沒有玩過瑪莉歐遊戲嗎？我想不太可能，他們之中某些人或許也是電玩粉絲，\n但對電影的樣貌仍有某些堅持。\n\
  \n要說他們的評論都錯了嗎？客觀來說這部電影的確劇情普通，呈現的樣貌更像是遊樂園、\n派對遊戲，甚至被形容為大型廣告也的確起了這樣的作用。\n\n但我想一個問題出在「打分數」這件事上面。我們很多人看到的是影評給的分數很低，搭\n\
  配一些從媒體轉貼的句子，而非完整的評論文章。\n\n用一個簡單的數字給一個作品打分數，這明明是在現代很被詬病的一種評斷標準。用一個\n數字能評價一個人的好壞嗎？分數高的聰明程度就高？各方面就優秀？\n\
  \n但影評或群眾給出的就是 5 分、10 分、100 分這種一翻兩瞪眼的二元評價，好，或爛。\n\n我們被自己給評價的制度輕易分成了對立的兩邊，那豈不是就像電影中的劇情一樣單純？\n\
  \n\n\n\n\n\n我看了些文章討論與不同的聲音，大概可以了解影評一部份想法。\n\n不過身為瑪莉歐粉絲與一般觀眾，我還是想帶著私心給出一些個人心得，我看了\
  \ IMAX 大\n螢幕，而且覺得非常值得，我喜歡這部電影。\n\n如同上一段討論的，我們不該用二元評價來評論一部作品，我同意劇情普通、像是在遊樂\n園等說法，但電影一定要有某種樣貌或特質才能叫做電影嗎？\n\
  \n要是崇高的？探討議題的？劇情有敘事性的？做出戲劇張力的？第一段討論過，我認為任\n天堂做的事情沒有變：在遊戲性與形式上創新，在闔家歡樂的概念上堅持。\n\n\
  電影的形式可以是遊樂園嗎？可以是跳出螢幕與人互動的嗎？「電影可以是遊戲嗎？」\n\n這應該也不算創新，但我覺得任天堂這次的嘗試很不錯，而且這幾年他們不斷把瑪莉歐「\n\
  帶進真實世界」，從《超級瑪利歐 奧德賽》開始直接走進人類城市，到這次電影也跟現\n實世界連接，像是架起了一道橋梁。\n\n那是粉絲與遊戲的橋梁，是那個年代大人與現代小孩的橋樑，是同為玩家共鳴的橋樑，也\n\
  是成熟大人與自己內心小孩的橋樑。\n\n或許有些人覺得長大了就該有成熟的樣子、有深度的思想、追求更好的心態。\n\n那樣很好，但與此同時，我們的心中仍然有個單純的小孩、雀躍的小孩、看見環球影城瑪\n\
  莉歐世界會「哇！」開心地又跑又叫、跳起來撞磚塊的興奮小孩。\n\n如果一部電影帶給了許多人這樣的體驗，那我會認為這是一部好電影。\n\n或許有某些地方可以做得更好，但仍然是一部很棒的電影。\n\
  \n我看了一部覺得很不錯的電影，但抱歉，更好的電影在另一座城堡，我開始期待續集。\n\n\n\n\n--"
