content: "超級瑪利歐兄弟電影版The Super Mario Bros. Movie\n\n\n\n\n    我不是超級瑪利歐迷，小時候有玩紅白機的超級瑪莉1代(倒不是家裡有，是隔壁雜貨\n\
  店有一台，5元可以玩一回)；前幾年因為疫情，跟風買了Switch，說要練健身環，結果都\n在玩奧德賽與瑪利歐賽車。\n\n\n    大概就這個程度的接觸，前幾周我陪小孩去看瑪利歐得電影還是看得很開心，說情懷\n\
  也是情懷，更有一種「瑪利歐終於會說『Super Mario』以外的話了」、「這個操作好強\n喔，怎麼跳的」、「以為庫巴終於要硬起來征服世界了，結果怎麼還是在追碧琪啊」、「\n\
  好像在看瑪利歐的RPG遊戲，會升級耶」、「哇~彩虹賽道！」，大概就是這樣。\n\n\n    有些評論說這部電影情節稀薄，我個人是覺得還好，前陣子我在飛機上看了《復仇者\n\
  聯盟2》，劇情也差不多，只是演員裝B裝得比較好，不像瑪利歐就是個真誠的矮胖魯蛇。\n\n\n    由於我非常喜歡奧德賽，所以看電影時看到幾個奧德賽的畫面都會很激動，例如一閃\n\
  而過、有著飄浮倒金字塔的沙沙國(我女兒的叫法)；還有庫巴求婚的白西裝禮帽與食人花\n捧花。\n\n\n    我誠懇希望任天堂續集可以拍奧德賽，把遊戲照搬、不用劇情都沒關係，我就是想在\n\
  大銀幕上看瑪利歐附身到暴龍身上，或是寶琳市長一邊唱<Jump Up, Super Star!>瑪利歐\n一邊過都市國的慶典。\n\n\n\n\n\n--\n \
  \                                         \n\n--"
