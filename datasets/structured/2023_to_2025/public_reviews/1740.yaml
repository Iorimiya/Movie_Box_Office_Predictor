url: https://www.ptt.cc/bbs/movie/M.1680671770.A.1F4.html
title: '[普雷]超級瑪利歐兄弟電影版'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  粉絲可進場 彩蛋找不完 劇情不要期待

  基本上算照明社穩定發揮　不到小小兵那麼無腦

  大概在寵物當家跟歡樂好聲音的水準

  有兩段片尾


















  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  第一波預告後就沒注意消息

  進場才發現是穿越劇

  前面差點以為要變成　「自立當水管工的我穿越世界成為最強」這種毒物

  結果穿越以後還是廢廢的我就安心了

  劇情上就是公主要找人幫忙打庫巴　瑪利歐要找被庫巴抓的路易吉

  順勢就一起行動的故事　穿越的邏輯跟眾人的反應一概略過

  公主被問還直接說瑪利歐不重要XD


  整體來說動作戲很多　彩蛋很多

  笑點也不少

  很多的遊戲致敬　不管是角色　背景　還是橫向轉軸式鏡頭　都給好給滿

  大金剛戲份不少但耀西只有背景走過


  劇情上有些安排實在有點意義不明

  瑪利歐前面的訓練戲份很長但沒有跟後面有呼應的感覺

  路易吉被抓了好久　給了好多戲份　以為會在監獄有什麼突破

  結果一直到最後才有發揮作用

  奇諾比奧後面跟了整段冒險　劇情上有作用的只有最後偷渡冰花這段

  意外的是除了搞笑外還有認真的劇情

  但是效果.....實在讓人覺得很廉價 比起認可主角更像見風轉舵的感覺


  情懷基本上賣好賣滿 任天堂本家音樂外連選曲也是各種賣情懷

  不過Out for a Hero跟Take on me實在太多人用了吧

  最後無敵星的編曲我個人不太喜歡就是


  --

  我只看過最早本的預告一次所以沒注意到　這個部份沒什麼問題　只是有點意外XD

  完全沒注意過遊戲開頭是這個設定XD

  個性是這樣沒錯 但戲份編排上那邊變成監獄沒什麼劇情但卻花了不少時間

  應該是奇可家族的某一隻吧

  他們互動就預告那段而已

  好歹也露臉才算吧XD

  開頭文戲多一點以外幾乎一直都是動作戲了

  就剛好沒有適合的關卡 應該說這次只有訓練關卡

  應該是隨便都賺啦 光明社出過更隨便的劇本 瑪利歐知名度又更大XD

  我知道他是隊長 但作為唯一一個勇敢的蘑菇人 前面給了一堆戲份

  結果劇情上除了捧花外沒有作用阿 甚至馬車那邊都沒表現到

  實在很可惜啊

  是的 有些影城第一段有提醒第二段沒有 很多人以為一段而已就走了

  照明社哄小孩的功力不用懷疑XD'
