url: https://www.ptt.cc/bbs/movie/M.1680678556.A.031.html
title: '[好雷] 超級瑪利歐兄弟電影版'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  看完了，


  最讚的地方絕對是動畫本身，


  不會像以往看好萊塢皮克斯或迪士尼動畫那樣的僵屍感，滿滿細節都可以看得出任天堂在

  動畫的堅持


  整部片的進程富有動感、活力～


  在場景的轉換上非常多彩蛋～以前玩過遊戲肯定滿滿回憶


  特別喜歡開場的那支狗很有擬人化的兇勢，跟牠最後跟瑪利歐敬禮，簡直教官狗，有夠兇


  還有喜歡那個陽光小子，特別喜歡它的厭世視角，它的旁白跟在場大人的心態應該能非常

  對應，結尾還不忘開厭，說電影結束你們只能帶走空虛～實在被酸的有夠爽，最愛這支陽

  光小子


  還有配樂上最喜歡瑪利歐剛變狸貓飛天的配樂～就是滿滿回憶～


  其他還有很多場景轉換都有不同的彩蛋就無法一一列舉


  一個半小時片長的節奏不拖泥帶水


  適合全年齡的觀影者去觀賞～


  推推





  --

  不然怎叫無敵星

  我只有看到一個錯字

  看得懂 基本上是不用腦的

  「僵」'
