url: https://www.ptt.cc/bbs/movie/M.1680672418.A.8CA.html
title: '[新聞] 《超級瑪利歐兄弟電影版》外媒負評連連'
content: "新聞網址：\n\n\n2023-04-05 13:12:25\n\n\n由《電影少年悍將 GO！》（Teen Titans GO！To The\
  \ Movies）導演-亞倫霍瓦斯（\nAaron Horvath）、《電影少年悍將 GO！》製作人-麥可傑倫尼克（Michael Jelenic）聯\n合執導的《超級瑪利歐兄弟電影版》（The\
  \ Super Mario Bros. Movie）今日正式在台上\n映，而外媒的影評也首度解禁。\n\n\n綜觀來看，\n，雖然有人稱讚片中的彩蛋與懷舊元素，但最多也止步於\n\
  此，鮮少人實質的肯定電影本身的整體水準。\n\n\n以下簡短節錄自部份外媒發表的《超級瑪利歐兄弟電影版》評論：\n\n《ScreenCrush》網站 — 麥特辛格（Matt\
  \ Singer）：「為什麼要製作一部非常忠於原作\n的《超級瑪利歐》電影？它的存在意義就只是為了在大銀幕上重製電玩嗎？ 一款你無法\n實際操作遊玩的《超級瑪利歐》有什麼意義\
  \ ？真想拍出有價值的《超級瑪利歐》電影，\n就得給予電玩無法給予的東西，而在大多數的情況下，《超級瑪利歐兄弟電影版》沒有做\n到。」\n\n\n《娛樂週刊》（Entertainment\
  \ Weekly）— 克里斯欽霍魯布（Christian Holub）：「（\n自 1993 年真人版問世）的幾十年後，觀眾開始期待更忠實的改編作品會出現，於是乎我\n\
  們就有了一部新的《超級瑪利歐兄弟電影版》，它的畫風和氣氛更貼近任天堂的原作遊戲\n — 但也因為如此，它通常感覺更像是一個加長版的過場動畫。」\n\n\n《獨立報》（The\
  \ Independent）— 克利斯勞瑞（Clarisse Loughrey）：「本片的平庸\n程度，在選擇讓克里斯普瑞特擔任主角這方面得到了絕佳的體現 —\
  \ 他是目前通用、極易\n於推銷給觀眾的英雄角色代言人。」\n\n\n《衛報》（The Guardian）— 彼得布萊蕭（Peter Bradshaw）：「\n\
  \n。它的視覺之無趣，無趣到讓我想起了歐洲的山寨動畫片，而且在敘事方面也極其地\n懶惰，缺乏足夠有趣的台詞，缺到不可思議。」\n\n\n《IGN》網站 — 湯姆喬根森（Matt\
  \ Donato）：「《超級瑪利歐兄弟電影版》終於賦予了\n遊戲界最具指標性的角色應得的大銀幕冒險... 照明娛樂和任天堂致力於推出一部任何族\n群都能享受其中的《超級瑪利歐》電影，這包含即使對遊戲僅有粗略了解的人都足以沉浸\n\
  其中 — 而不可否認地，他們在這兩方面都成功做到了。」\n\n\n《The Playlist》網站 — 馬歇爾薛佛（Marshall Shaffer）：「這部電影忙著介紹角色\n\
  和推動情節的轉折，根本沒有時間讓照明娛樂的動畫團隊好好發揮他們的搞笑絕活，然而\n也這正是這些絕活造就了《神偷奶爸》系列出乎意料的成功。配音過多部《功夫熊貓》作\n\
  品、對動畫絲毫不陌生的傑克布萊克，是全片最靠得住的笑料泉源。」\n\n\n《Consequence》網站 — 莉茲香農米勒（Liz Shannon Miller）：「這是一封獻給原作\n\
  遊戲、寫得很單薄、但還算有趣的情書，最起碼，它比 1993 年的真人版還好看。」\n\n\n 《Mashable》網站 — 克莉絲蒂龐奇柯（ Kristy Puchko）：「看到最後，它感覺就像\n\
  一支漫長的廣告。是沒錯，我看完之後的確有想再回頭玩我的舊《瑪利歐》遊戲，但我同\n時也不想再回頭重看《超級瑪利歐兄弟電影版》。」\n\n\n《超級瑪利歐兄弟電影版》配音卡司網羅：「瑪利歐」克里斯普瑞特（Chris\
  \ Pratt）、\n「碧姬公主」安雅泰勒喬伊（Anya Taylor-Joy）、「森喜剛」塞斯羅根（Seth Rogen）\n、「庫巴」傑克布萊克（Jack\
  \ Black）、「奇諾比奧」基根麥可奇（Keegan-Michael Key\n）、「路易吉」查理戴（Charlie Day）等多位明星。北美預定 04 月\
  \ 07 日上映。\n\n\n--\n\n會爆嗎!!??\n\n--"
