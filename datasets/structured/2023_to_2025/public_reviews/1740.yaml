title: '[好雷] 超級瑪利歐兄弟電影版 The Super Mario Bros. Movie (2023)'
content: '孩子考完期末考大獎賞去看《超級瑪利歐兄弟電影版》！看前先去找了台電動把1985《超級瑪利歐兄弟》複習一次死好多台 XD 才打到會噴火的庫巴國王...
  這樣複習一遍再來看片真有源源不絕的靈感！雖然我們家爸媽也只打到以前稱作「金牌瑪利」的第二代，孩子則是玩《瑪利歐賽車》和我們經驗截然不同，不過看來每一代玩家心中的「瑪利歐童年」在此片都能找到溫暖的呼應？另外也很慶幸我們家拖了這麼久才來看，大人觀眾該看的好像都看完了，連假下午整廳
  100% 都親子觀眾，小孩們放心笑個不亦樂乎大人看了也開心！




  瑪利歐與路易基等電玩角色有沒有背景故事？這個我們以前還都沒想過，本片是否改編哪個原著故事我們也不知，放心看下去覺得還蠻單純王道就是個「練功打怪」的勵志故事：紐約布魯克林一個義大利勞工家庭兩兄弟
  Mario & Luigi，他倆也許沒別的長處但很努力要拼「水管工」創業，雖然實務做起來也是左支右絀惹一身腥 XD 但重點是兩人堅定在一起相信能克服一切，那人人七嘴八舌的義大利家庭晚餐儘管總是會有人問起「事業如何」令他們洩氣、但總有對孩子懷抱信心的媽咪「達文西年輕時也常受質疑呀」。（真的嗎？）


  故事開始：水管事業要做就做大的賭一把、一鳴驚人的希望就賭在紐約地下水道洪災、誰知兩人下去不久就被水管吸進奇幻世界！這奇幻世界當然有好人也有壞人、有加害者也有受害者、亦有許多裹足不前的人們等待英雄團結他們...
  所幸電影開場奠定調性再怎樣殘酷都要耍可愛，面對天火焚城般的暴君庫巴連「冰雪王國」企鵝們都能耍狠丟雪球 XD 話說這間企鵝城堡還真像「基輔聖索非亞大教堂」不知是否暗吃普亭豆腐？庫巴喜歡征服別人而下個獵物「蘑菇王國」竟是為了愛慕公主而征服
  XD 有時征服者滿口民族同胞通家之好這等大愛令人禁受不起呀...




  但重點還是 Mario個人旅程：他會落到蘑菇王國、會遇到小蘑菇 Toad 結為搭擋、更會遇到長得不像蘑菇的「碧姬公主」！話說今天看片前我都不知以前小時候打完 1-4
  至 8-4 救到的是蘑菇與公主 XD 倒是在孩子的《瑪利歐賽車》經驗中他們早已不是待救公主與待救蘑菇而是強力競爭者！本片基本也採這個觀點讓碧姬公主允文允武能領導戰鬥還能當
  Mario的師父！可說 Mario在此不是天降救星、只是他與當地人們有共同敵人而要以義結盟... 只是挺身而出首先竟要吃「蘑菇」，本片瑪利歐設定竟從在家就不愛「蘑菇義大利麵」？有些營養東西「吃得苦中苦」方為人上人！


  電影構圖除了視角隨時游動的一般劇情外，看來前段比較重視2D「橫版過關遊戲」的復古再現滿足我們老玩家、中段越來越多3D進深跳躍應是滿足九零年代老玩家、後來終於打到「森林王國」跟著大猩猩開起孩子喜歡的《瑪利歐賽車》！令人興奮的是在這奇幻世界每個角色都頗有個性激勵
  Mario勇敢前進：小蘑菇 Toad 喜愛冒險無所畏懼連選車都愛選大的、碧姬公主被收養長大就愛上這家什麼都勇於嘗試、連本來要碾壓 Mario的 Donkey Kong都頗自大愛現喜歡秀「彈跳胸肌」總被爸爸掩面碎念...
  但看來最終這些可愛角色們包括大猩猩的自我個性都值得抒發一回！




  最後當然是 Mario & Luigi兩兄弟親愛精誠不離不棄永遠相挺到底、最棒的是這一架打回老家人人刮目相看媽媽也欣慰！這樣的故事很直線單純「沒有劇情」或是「沒有成長」嗎？對越來越喜歡深刻成長且爛番茄越拿越高的大人動畫來說也許是如此，但此片就是一路練習奮鬥結交同道濟弱鋤強打怪到底、連萬惡反派都有顆熾熱的心只是用錯了地方
  XD 這對全場或小學或幼稚園的孩子們來說不就是最簡單的寓教於樂嗎？希望這樣適合小朋友的動畫電影未來多一點、也希望孩子熱情歡笑時大人也能包容點 XD 看看孩子考試成果暑假不買個任天堂
  (!)說不過去呀...



  --'
