title: '[新聞] 《超級瑪利歐兄弟電影版》又破紀錄！創下'
content: '新聞網址：


  又破紀錄！


  【文／克里斯蒂】改編自任天堂最受歡迎電玩遊戲《超級瑪利歐兄弟》的動畫電影《超級

  瑪利歐兄弟電影版》，在全球上映後屢屢開出票房佳績，而氣勢銳不可擋的《超級瑪利

  歐兄弟電影版》，


  《超級瑪利歐兄弟電影版》獲得的評價褒貶不一，在正式上映前，，但實際上映後，觀眾好評如潮，被讚是最佳

  電玩改編電影之一。，但其一般觀眾給分卻高達96%滿意度，出現一般觀眾和影評

  人看法兩極的特別現象。


  在北美票房上，《超級瑪利歐兄弟電影版》目前以5.5億美元（約169億台幣），成為「爛

  番茄」網站上，爛片裡最高票房的電影，在此之前，保持這一獨特成就的紀錄保持者是迪

  士尼真人電影《獅子王》，其北美票房為5.43億美元（約167億台幣）。


  目前《超級瑪利歐兄弟電影版》全球票房已達到12.5億美元，登上影史全球動畫電影票房

  第四名，擊敗原本第四名的《超人特攻隊2》，目前榜單的前三名為《獅子王》16.56億美

  元、《冰雪奇緣2》14.5億美元、《冰雪奇緣》12.8億美元，《超級瑪利歐兄弟電影版》

  是否會再刷新排名，引發外界關注。


  --'
