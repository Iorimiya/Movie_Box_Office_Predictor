title: '[Live] HBO 21:00 超級瑪利歐兄弟電影版'
content: 'HBO廣告很久，終於來了!


  21:00~22:35 超級瑪利歐兄弟電影版


  配音: 克里斯普瑞特、傑克布萊克等


  劇情: 這個不用介紹了吧，就是住在紐約的兩名水管工--

  瑪利歐和他的弟弟路易吉，有一天忽然間被召喚到蘑菇王國，

  對抗邪惡的庫巴大王入侵...


  話說我個人真的覺得最佳喜劇歌曲一定要頒給庫巴，太酷了!


  --'
