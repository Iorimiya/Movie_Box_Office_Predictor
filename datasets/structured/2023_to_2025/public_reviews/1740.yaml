title: '[好無雷] 超級瑪利歐兄弟電影版'
content: '超級瑪利歐兄弟電影版 / The Super Mario Bros. Movie　(2023)



  　　《超級瑪利歐兄弟》在任天堂上出現的1985年，那年我6歲。對我們這代的人來說，

  小時候不少人的童年都是在這遊戲的關卡裡渡過。那些熟到不能再熟的前面１到２大關，

  然後以及幾乎都沒看人玩到後面全破的後段關卡..  沉迷於家庭遊樂器，伴隨著一款款遊

  戲長大，就是我們這代的寫照。而長大後，在國中高中時街機橫行再到沒落，大學時代線

  上遊戲崛起，直至這十年來的手遊興盛，家庭遊樂器這派已成為遊戲人的部分分支。



  　　小時候再熟悉不過的瑪利歐，在我們成為中年大叔後，只是一個有點熟悉又不太熟悉

  的老朋友。我知道任天堂幾乎是日本遊戲界的一大宗派，但也有點疑惑為什麼瑪利歐還能

  紅。就一個紅衣鬍子胖叔叔，怪腔怪調，幾十年如一日…  瑪利歐兄弟系列作品成為了年

  輕一代的遊戲歲月，我們這代已跟瑪利歐脫節了。 但今天，這狀況改變了；這部電影的

  出現，是這接近要40年的任天堂遊戲史的一大里程碑。《超級瑪利歐兄弟電影版》串起了

  這幾十年來大人與小孩的遊戲歲月，邀請每個人一起來跳進這穿越的水管道。



  　　遊戲改編電影不是一件容易的事情，負評常常大過於正評。《超級瑪利歐兄弟電影版

  》這電影，雖然聽說當初許多影評人都給予負評，但是若以一般電影的標準來評斷，其實

  不太公平。這部電影不像一般電影只要說好一個故事，賺一筆大錢這樣。這部電影背負了

  更多..  這將近40年來玩家的期待，既要滿足大人，更要滿足小孩，其實是極困難的任務

  。這部電影要有豐富的情懷，要從幾十年來累積的馬利歐遊戲作品來取樣。此外，還帶著

  要振奮周邊遊戲市場的隱形目標。現在不只是一部改編電影了，其實，這電影就像漫威工

  作室在2008年拍出的《鋼鐵人》，《超級瑪利歐兄弟電影版》一樣身負重任，一樣是驚天

  一擊。



  　　對從小就不太玩遊戲的人來說，一個鬍子胖胖大叔真的能吸引到人嗎？..  我認為這

  部電影的劇本其實相當好.. 不是說一個劇本非要寫到多有深度或百轉千迴。這次的首要

  任務是要建立一個世界觀，一個遊戲世界與真實世界相通的邏輯性。它不能只是一部發生

  於遊戲世界的動畫片，因為那並不能說服非玩家觀眾。這部電影開始於真實，最後高潮也

  是在真實世界，當真實世界與遊戲世界能夠滑順地融合，遊戲電影的說服力就高了。舉幾

  個例子，《音速小子》電影，是不是看看就過去了。1993年真人版電影的《超級瑪利歐兄

  弟》，是不是一個惡夢？ 《惡靈古堡》系列電影、《古墓奇兵》系列電影，還保有了多

  少遊戲精神？　近年還有一部《魔物獵人》，這部評價就更差了。



  　　當比較下來，意外的發現其實《超級瑪利歐兄弟電影版》有種老少咸宜，一般觀眾與

  遊戲迷都能夠通吃的能耐。它雖然劇情簡單，但是經典，遊戲情懷滿滿，情感也還算豐富

  ，人物都相當有特色，各司其位。且電影片長不長(一個半小時)，讓小朋友觀眾的接受度

  提高。而細節更是塞好塞滿，頗能讓外行人看熱鬧，內行人看門道。劇本簡單並不是不好

  ，缺少邏輯性、塞進了多餘劇情，步調失衡、顧彼失此等.. 才是所謂不好的劇本。



  　　我個人給予這部電影是相當高的評價，但並不是說我多喜歡這個水管工人 (我喜歡碧

  姬公主～)。 瑪莉歐在電影裡面是一再地被擊倒，卻又不斷挺身而出；那不停纏鬥下

  去的精神，不就是當年握著搖桿不斷重來的我們，這才是這遊戲的核心靈魂。 其他，還

  有電影裡面那些水準極高的每一幕場景，上山下海、那些熟悉的掉落磚、升降梯、水管通

  道、彩虹賽車跑道、經典的城堡與升旗，以及那些看了數十年的熟悉角色.. 哪個不是喚

  起了心中曾經幻想、徜徉過的遊戲世界。高品質的美術表現，動作步調、運鏡剪接、生動

  人物，還有無可挑剔的音樂表現.. 都是頂級呈現。



  　　這次的電影做了一個相當好的開始。如果能夠維持住品質，任天堂的電影作品是有辦

  法建立起一個媲美漫威宇宙的電影王朝。雖然現在還只是在《鋼鐵人》階段，一切是言之

  過早。但挾帶著電影驚人的好成績，續集已經是勢在必行了，也將會帶動系列遊戲的一番

  回溫熱潮。英配不錯，中配意外地也沒什麼違和感，要重新對台灣的配音表現更新印象分

  數。電影我看了兩次，也都掉眼淚了，感動於角色之間的情感羈絆，感動於這個被打造出

  來的廣大世界，感動又遇見了曾經那個愛玩遊戲的自己。



  影''s 2023 04 23


  --





  --'
