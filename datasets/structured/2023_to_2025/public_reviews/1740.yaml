url: https://www.ptt.cc/bbs/movie/M.1680936571.A.E9A.html
title: '[好雷] 超級瑪利歐兄弟電影版，情懷童趣兩相宜'
content: '文長，連結如下：





  寫這篇文章，主要其實是想反駁「負評連連的外媒」（X



  影評跟大眾反應溫差那麼大，也真是蠻奇妙的。


  只能說，那些影評大概真沒打過電動，


  不了解玩家真正想要的是什麼。


  過度忠於電玩？那不是更棒了嗎！


  我相信在這次電影版製作上，宮本茂一定涉入很多，


  所以目標就是好玩有趣，故事相對不重要，


  （但人物塑造上，依然有成功反映出各個鮮明個性）


  這就如同他所製作的瑪利歐系列電玩一般，


  所有的設計，都是為了遊戲性服務的。



  別管劇情如何，說的極端一點，


  就算這九十分鐘都在演瑪利歐賽車，


  我也照樣看爆好嗎！彩虹賽道的演出真是太讚了！



  雖然電影版才剛上映，我卻已經開始期待續集了。


  儘管這次已經將大量的電玩彩蛋、致敬要素塞好塞滿，


  （看到瑪利歐64可怕的大海鰻現身，真的是很驚喜）


  但瑪利歐累積了將近四十年的文化資本，


  還是有超多東西可以再拿出來拍玩。


  像是只有匆匆驚鴻一瞥的耀西，


  從結尾彩蛋來看，大概會是續集要角。


  瑪利歐也還有許多種不同力量變身還沒拿出手，


  咚咚、汪汪等有趣的敵人也值得期待，


  更別說還有壞利歐跟其他公主了。



  這次電影上映，大概又會再刺激一波瑪利歐遊戲的銷量吧。


  希望票房能如期創造佳績，


  我還想續集在大螢幕上，看更多瑪利歐的各種玩意啊～



  --'
