url: https://www.ptt.cc/bbs/movie/M.1541507357.A.25B.html
title: '[新聞] 【親密陌生人】6天回本，觀眾:比原版好看'
content: '新聞網址：



  集結柳海真、廉晶雅等演技派紅星共同主演的《親密陌生人》，上週三（10/31）在南韓正式上映，強勢空降首週票房冠軍。雖然本片只是中小型製作規模，不過截至昨日（11/5）晚間，短短六天就吸引超過180萬觀影人數，順利突破電影損益平衡點，開始創造營收，也刷新今年南韓喜劇電影最快的票房累積速度。值得一提的是，女星廉晶雅在片中飾演養育三個孩子，還得侍奉婆婆的全職家庭主婦。被忙碌家庭生活壓得喘不過氣的她，竟也有自己一套轉換心情的方式，便是參加讀詩會，讓自己變身「文學控」，甚至走火入魔把朋友在手機裡的稱呼都改成作家的名字，飽滿的「

  詩意」也讓老公頭痛不已。不過現實生活中的她，同樣擁有家庭與小孩，也因為最近忙於電影宣傳，讓她在訪談中直呼「對不起老公」。《親密陌生人》目前也在台灣同步好評熱映中！





  《親密陌生人》以不到一個月的拍攝時間，僅花費38億韓圜（約新台幣1億元）製作費；如果涵蓋行銷費用，總製作費也僅有58億韓圜（約新台幣1.56億元）。這在南韓近期的商業電影中，只屬於中小型的製作規模。不過本片自南韓上映以來，短短四天就突破百萬觀影人次，上映第六天更突破180萬人次的損益平衡點。這不僅成?南韓今年上映喜劇電影當中，票房累積速度最快的作品；而在最近很難超越損益平衡點的南韓電影市場當中，本片不到一週就回本，實屬小兵立大功的佳作。評價普遍認?，片中每當手機響起的那一瞬間，都會有讓人意想不到的嶄新事件發生；雖然餐桌

  戲佔全片90%，不過持續反轉的劇情，讓人絲毫不覺得到無趣；尤其演員們精湛的演技與化學反應，也為這部製作精良的喜劇注入全新活力。



  值得一題的是，本片翻拍自義大利電影《完美陌生人》（Perfect

  Strangers）。挾帶原版的精彩劇本，韓版《親密陌生人》更在部分劇情當中，因應亞洲文化差異作出細節調整，使得每位角色的關係及個性更為立體，不僅值得沒有看過原版的觀眾進場感受本片精彩情節，更適合曾經觀賞過原版的觀眾，進戲院解讀兩個版本的差異。不僅如此，《完》片的翻拍版權，除了南韓也狂銷法國、德國、西班牙、希臘、中東等地，尤其翻拍的版權費用，更是比採購義大利原版的版權金高出五到六倍。這也讓《親密陌生人》導演?在奎打趣表示：「如果南韓票房成功的話，希望五年之後，就可以聚集各國的翻拍版本，共同舉辦一個影展。」





  曾以《失業女王聯盟》榮獲百想藝術大賞影后的廉晶雅，這回在新片《親密陌生人》飾演養育三個孩子，還必須要侍奉婆婆的全職主婦。被家庭生活壓得喘不過氣的她，轉換心情的唯一方法，就是參加讀詩會，並持續背誦、吟詠這些作品，搞得丈夫心煩意亂，叫她不要老是這麼「詩意」。在片中完美展現矛盾婚姻生活的她，現實生活就是有兩個孩子的媽。當被問到她作?妻子的形象是如何時，她也笑稱：「我也是非常適合丈夫的類型，雖然不像片中角色會對丈夫撒嬌，但是會經常開玩笑。」雖然演藝生活忙碌，但顧家的她也進一步表示：「我努力不讓自己成為家庭的空缺，ꤊ狴H結束工作返回家中，我還是會準備好孩子要準備的東西，也會去檢查他們完成的功課，甚至連他們隔天要穿的衣服都會準備好。」



  當被問到是否會像片中，對自己的丈夫公開手機內容？她也表示：「我們不會特別去看對方的手機，因為也沒什麼值得一看的內容；而且我們知道對方所有密碼，某種程度想看也可以看到。」言談之中盡顯自己和丈夫相互尊重的意念。不過她也感性表示：「因為結婚和育兒，讓我有一段時間處於鬱悶的空窗期。雖然每天都因為家庭忙碌，卻覺得自己一事無成，所以像最近能這樣跑宣傳，讓我感到非常開心幸福。雖然在外活動很開心，但某種程度也覺得對不起老公。」



  這部登上南韓首週票房冠軍的愛情驚悚話題新片《親密陌生人》，台灣也正同步熱映當中。台灣片商也舉辦首週票根抽獎活動，只要參加就有機會獲得演員親筆簽名場刊與原文劇本書，活動詳情請上。本片劇情描述七位相識多年的好友與夫妻檔，相約在月蝕之夜共進晚餐，就當相談甚歡、觥籌交錯之時，其中一人提議來玩「公開手機」遊戲──若對感情問心無愧，就把手機內容不論簡訊、來電或各種可能會出現的訊息給公開。這場引爆超越「真心話大冒險」的危險遊戲，引爆眾人不為人知的驚人秘辛，也讓他們的愛情與友情面臨嚴峻考驗…。



