title: '[新聞] 「親密陌生人」太挑戰 李瑞鎮憂看完分手'
content: '新聞網址：


  聯合報 記者陳建嘉╱即時報導


  在南韓成為話題的懸疑愛情新片「親密陌生人」，昨日（10/4）於首爾舉行製作發表會。導演李在奎率領主要演員柳海真、趙震雄、李瑞鎮、廉晶雅、金志秀、松?昀與尹卿鎬出席盛會，並大方分享演出心得。由於本片描述在看似完美的情侶聚會當中，因為眾人開始玩起「公開手機」遊戲，因而發生一連串難以收拾的連鎖效應。全體影人在現場一致表示：「現實生活絕對不會玩這個遊戲！」李瑞鎮更擔心表示：「真希望看完我們的電影之後，不要出現夫妻、情人因為玩這種遊戲而吵架甚至分手。」「親」片預計10月31日在韓上映，安排在11月2日與南韓同步上映。


  「親密陌生人」描述三對看似完美的情侶，跟另一位單身漢友人，七人在一場喬遷聚會中玩起「公開手機」遊戲。所有人都必須強制公開手機裡所有來電、簡訊，不料此舉卻讓他們深藏內心的秘密紛紛曝光，更讓在場情侶們的關係面臨崩解。本片內容緊扣現代人對手機的依賴，導演李在奎表示：「手機與我們的生活息息相關，誰都有手機與秘密，融合這兩個元素而展開的故事，讓我感受到魅力。尤其兩個人不論多麼親近，是否還是需要保持一定程度的距離呢？出於這個想法，讓我拍出了這部電影。」


  七位主要演員也在現場，被問到許多跟手機相關的問題，眾人也在現場一致表示：「現實生活絕對不會玩這個遊戲！」其中憑藉神劇「信號」演出而備受影迷喜愛的趙震雄就表示：「即使沒有隱瞞任何事情也絕對不會玩，適當留下神祕感會更好。」當他繼續被問到：「如果沒有手機還能不能活下去？」沒想到他竟然激動回答：「那事情就大條了！我每天都要打手遊，那些寶物對我來說非常重要，如果一天沒玩就會出大事！而且我還要跟朋友們配合一起玩，所以手機對我來說真的很重要！」可愛又誠實的反應，讓全場忍不住爆出笑聲。


  此外，近期因為實境節目「一日三餐」、「尹食堂」而大受歡迎的實力派演員李瑞鎮，這回跟演出大勢韓劇「馬成的喜悅」女主角而爆紅的松?昀，兩人雖然實際年齡相差15歲，卻在片中飾演一對夫妻，因此備受媒體矚目。李瑞鎮謹慎說道：「最近跟年輕女演員演情人，常常讓我因此被罵，但其實我真的很高興能跟不同世代的年輕演員合作。」而松?昀則大方表示，和李瑞鎮相處起來舒服又自在，絲毫感受不到年齡差距，她笑道：「李瑞鎮前輩很照顧我，他身上絲毫沒有大牌的感覺，真的是非常有魅力的人。」她並透露：「李瑞鎮在片中會有許多狂野奔放的台詞，我們演起來

  ，的確散發出新婚夫妻那種青澀的熱情。」




  --'
