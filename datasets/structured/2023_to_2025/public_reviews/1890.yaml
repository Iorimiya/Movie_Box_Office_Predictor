url: https://www.ptt.cc/bbs/movie/M.1693723653.A.55B.html
title: '[好雷] 希望能實體發行的《親密》(濱口龍介)'
content: '這部是濱口龍介的舊片《親密》

  (不是2022年在坎城影展得獎的歐洲電影)

  以下有上下集的雷 防雷





















  這部片分成上、下集放映，相隔一週上片。為了可以更容易融入下集的劇情，所以看下集

  的前一天又去二刷了上集，二刷上集的感覺跟一刷完全不同，原本不太懂的安排、略顯沉

  悶的詩與寫作，重看一次竟都散發出醍醐味而不覺得多餘。比如片中30分鐘一對一對話的

  練習，導演令子能跟不甚了解的演員相談甚歡，跟男友良平卻談到劍拔弩張摔椅子，二刷

  之後才了解這幕凸顯了「點頭之交但聊得來的朋友」和「親密但已吵到無話可說的另一半

  」之間面對面溝通的差異有多大。令子跟良平肯定都是有才華的，也都有劇場人的創作堅

  持，戲裡的專業如何跟戲外的感情生活取得溝通上的平衡？答案是沒有平衡，這兩人的感

  情聯繫也隨著這部戲的結束就此崩塌。


  片名雖是親密，卻更像是在講人跟人之間的疏離。距離感這個概念在片中有許多象徵：

  平行行駛的列車、南韓跟北韓、各懷心思的情侶、雖然能夠視訊卻完全無法在危急時刻

  拯救對方的兄弟。而所謂的疏離，指的並非是陌生人的相處，反而指的是就算是親近的

  人之間，「一個人也永遠無法完全了解另一個人」。片中不時出現的電子郵件(簡訊)，

  更加深了這個疏離的概念。當我們透過簡訊傳達訊息給對方，就能很清楚的表達所要訴說

  的要求。可是當令子跟良平見面的時候，即便只是將簡訊文字變成了說話，也會因為肢體

  語言、態度、說話的口氣，將兩人在想法上的差異凸顯並放大，因而積累了不滿。令子和

  良平在上集因為關係走到盡頭而欠缺的愛意，在下集的劇中劇被彌補，從劇中劇的劇本不

  難看出兩人都知道問題是什麼，可是即便知道了，也不代表是可以被解決的，也不代表是

  可以被挽回的。


  如果要說最喜歡這部片的是什麼，那麼肯定是結局，當兩人重逢、又分別，然後搭上各自

  行駛的列車。良平突然在車廂中追逐著、奔跑著，並且學著當初令子對他獻的飛吻，就像

  是共鳴震盪，看到後的令子也一起不斷的獻出飛吻，直到兩台列車在分岔路口駛向越離越

  遠的兩條軌道。這個結局讓我震撼不已，單就這個結尾來說，後座力恐怕不下《花束般的

  戀愛》(但如果以全片來看，《花束般的戀愛》應該好入口許多)。這會是個人每隔一段

  時間就想拿出來重溫的電影，而且現在就能預想每次重看的感觸應該都不會相同。



  --'
