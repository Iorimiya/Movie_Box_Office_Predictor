url: https://www.ptt.cc/bbs/movie/M.1742477475.A.E16.html
title: '[新聞] 葛妮絲派特洛：之前不知床戲會有「親密'
content: '近日葛妮絲派特洛（Gwyneth Paltrow）在接受《Vanity Fair》訪問時透露，她與提摩西夏

  勒

  梅（Timothée Chalamet）在電影《Marty Supreme》中有「很多」性愛場景，而這是她首

  次與親密指導師合作，因為她「之前根本

  不知道這種職位的存在」。



  「現在有一個叫做親密指導的職位，而我以前完全不知道有這種東西。」葛妮絲派特洛

  表示：「我當時想，『天啊，我可是來自那個時代，大家就直接脫光衣服，上床，攝影機

  開拍就行了。』」結果，她發現自己在沒有親密指導師的情況下，反而覺得更自在。


  「以前的我們會說：『我們應該沒問題了，你可以退下了。』」她解釋道，「我不知道對於

  剛入行的年輕演員來說這是怎樣的感受，但 如果有人在旁邊說，『好，接下來他的

  手要放在這裡』 作為一名演員，我會覺得

  這樣被限制發揮了。」


  而提到與甜茶的合作，葛妮絲開玩笑說：「我當時心想，『好吧，太棒了。我已經 109 歲

  了，你才14歲。』」


  如今，在好萊塢拍攝性愛場景時，親密指導幾乎已成為業界標準，但葛妮絲並不是唯一

  一位最近拒絕使用親密指導的演員。憑藉《艾諾拉》獲得奧斯卡女主角的演員麥琪·

  麥迪遜（Mikey Madison）在《Variety》的「Actors on Actors」單元中與潘蜜拉·安德

  森（Pamela Anderson）對談時也提到類似經驗，她表示在拍攝電影中大量的性愛場景時

  ，沒有使用親密指導：



  「飾演 Ivan 的 Mark Eydelshteyn 和我覺得，保持現場簡單會比較好。我的角色是一名

  性工作者，而我看過西恩（導演）的電影，知道他對真實性的執著。我已經準備好了，

  作為演員，我把這當作一份工作來看待。」


  可想而知，網路上對於葛妮絲派特洛的言論也有不少討論。一名推特用戶評論：「反對

  親密指導的聲音對我來說一直都很奇怪，因為你不是片場裡唯一一個要拍攝性愛場景的

  人。他們的存在是為了保護每個人。」


  不過，也有人有不同的看法：「在大家把這件事解讀成她在『貶低親密指導』之前，其實

  她的發言並沒有真正批評這個職業。她只是表達，自己突然被給予選擇時感到有些不習慣

  ，因為在過去，她從來沒有這樣的選擇。」


  根據美國演員工會（SAG-AFTRA）的定義：「親密指導是提倡者，他們的職責包括充當

  演員與製作團隊之間的溝通橋樑，並在涉及裸露、模擬性愛及其他高度曝光場景時，

  擔任動作指導或動作編排。」他們的工作是確保片場每個人的安全，同時維護導演的藝術

  視角。


  ———————————————————————


  參考外電：Glamour

  Gwyneth Paltrow Tells Vanity Fair She Didn’t Know Intimacy Coordinators ‘Exist

  ed’

  Until Her Latest Project



  心得：葛姐+茶爺兩大影星首度合作，自然是報以期待，只是我也沒想到兩個人在片中

  的首次合作會是演情侶XD

  畢竟年紀比葛妮絲小的蕾貝卡佛格森，都在沙丘演提摩西的媽媽了


  回頭介紹《Marty Supreme》，這是犯罪驚悚片《原鑽》導演Josh Safdie預計在今年

  耶誕檔期推出的運動愛情喜劇，劇情取材自

  美國史上成就最高的乒乓球好手，

  也預計是明年有希望挑戰奧斯卡的外卡之一


  不過由於本片的投資片商是A24，台灣會由誰引進就變成了未知數


  --'
