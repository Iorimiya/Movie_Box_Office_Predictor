url: https://www.ptt.cc/bbs/movie/M.1442236166.A.D85.html
title: '[新聞] 巴黎假期 郭采潔古天樂上演親密戲'
content: '（中央社台北14日電）浪漫愛情電影「巴黎假期」古天樂及郭采潔，兩人在浪漫之都譜戀

  曲，融化人的甜蜜畫面當然少不了，郭采潔穿上美麗白紗，還與古天樂玩親親，浪漫指數

  大爆表。


  古天樂在《巴黎假期》中為了和得了厭男症的室友郭采潔和平相處，大扮同志，和郭采潔

  成為交心閨蜜，而從好姐妹變情侶過程，誤會不斷但也趣味橫生，兩人不時大演親密鏡頭

  ，很快拉近彼此的距離，無論擁抱，玩親親，甚至在古天樂面前高高舉起腿都非常自然，

  演出很有默契。


  郭采潔表示，一開始也覺得古天樂是非常嚴肅的大哥，但為了演出好姐妹的Fu，她便主動

  出擊，不時鬧一下古天樂或是有空就找他講講話，讓古天樂說：「她真的好愛說話，嘰嘰

  喳喳的。」


  為了營造愛情的浪漫氣氛，古天樂與郭采潔親密畫面不斷，兩人不但正面擁抱，還背後環

  抱，有一幕兩人出遊到葡萄園，郭采潔竟腿抽筋，古天樂英雄救美，為了解救她的疼痛，

  不得不把的腿向上舉起90度，筋骨很嫩Q的郭采潔在他的面前跆起腿，有如「腿咚」古天

  樂，卻也絲毫不羞怯。


  而古天樂對急救抽筋似乎特別有一套，演出手法非常熟練，讓郭采潔十分讚嘆：「古仔哥

  拍這場戲好從容，先是拉伸，又按摩還加上點穴，真的是個好好先生啊！」


  「腿咚」後，導演阮世生更加碼玩親親，沒想到，兩人接吻戲拍得順利，但一場穿婚紗親

  額頭的戲，卻是頻頻NG。


  為了劇情需要，劇組特別安排兩人到巴黎近郊的蘇鎮公園拍照，公園內風景如畫，但遊客

  如織，不少當地遊客以為兩人真的拍婚紗照，一直圍觀湊熱鬧，讓兩人也不禁頻頻笑場。


  攝影師還示意郭采潔及古天樂要配合法國風情，上演法式熱吻，郭采潔更是笑彎了腰，而

  古天樂最後只是深情的吻了她的額頭，郭采潔說：「這場戲拍得我們一直笑場NG，導演還

  一直覺得古天樂親的力度不夠，但我那時覺得我的額頭都會被親出烙印了。」


  新聞網址：


  --'
