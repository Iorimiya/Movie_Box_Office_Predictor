title: '[超好雷]控制 -親密而窒息的愛'
content: "在看「控制」的專題訪問時。\n\n女主角蘿莎蒙．派克提到，\n\n「這部片想傳達的主旨就是『你是否真的了解你所愛的人？』『婚姻是什麼？』」\n\n\
  \n\n觀後感想：\n\n劇情一開始步調偏慢。\n\n［剛開始會有種像是「別相信任何人」的感覺（心中大祈禱！吶喊ＮＯ！）］\n\n 到了接近中段時，劇情進湊，步步懸疑。\n\
  \n但中間又穿插一些女主角的可愛反應（吐口水、雙腳跳躍）、男主角和律師練稿的過程，\n\n展現了小小的詼諧幽默。\n\n\n\n故事中的男女主角並非一方非常可憐、一方非常可惡。\n\
  \n而是雙方皆有人性中的缺點，因此貼近「真實」。\n\n\n\n男女主角的演技非常精湛！！！！！\n\n（比起安娜貝爾中的無關痛癢的丈夫好多了XD）\n\n\n\
  \n『你是否真的了解你所愛的人？』『婚姻是什麼？』\n\n看完這部電影後，完全能切確的了解導演想表達的主旨。\n\n導演大衛．芬奇的拍攝、鋪成手法，令人不得不佩服。\n\
  \n既《火線追緝令》及《鬥陣俱樂部》後又一驚豔之作。\n\n\n\n最後一幕，又呼應了起初那一幕。\n\n主角的掙扎，讓電影在最後關頭，用極致的無奈畫上了完美的句點。\n\
  \n「控制」之所以推薦，因為電影將如此平凡的感情，用極端的劇情呈現，\n\n然而時而覺得又貼近生活。\n\n還沒觀賞的朋友，快進電影院觀賞這部年度好片吧！\n\n\
  \n\n痞克幫:\n\n\n\n\n\n--"
