title: '[新聞] 劉品言大銀幕看親密戲 驚喊：「真大！」'
content: "劉品言大銀幕看親密戲 驚喊：「真大！」\n\n17:35 2023/11/11 中時 翁紫曦\n\n\n李英宏（左起）、林柏宏、劉品言、湯詠絮出席電影《莎莉》台灣首映。（羅永銘攝）\n\
  \n電影《莎莉》由劉品言、林柏宏、李英宏擔綱演出，該片11日於金馬影展台灣首映，導演\n練建宏與攜演員群劉品言、林柏宏、李英宏、湯詠絮全員出席。劉品言被問及在大銀幕上\n\
  看自己有什麼感覺？她表示心情十分緊張，儘管電影在釜山已首映過，但台灣的銀幕更大\n，看到自己演出的大尺度床戲直喊「真的大！」。林柏宏則補充：「看電影當下有感受覺\n\
  到坐在旁邊的她突然身體繃直。」\n\n《莎莉》論及當代交友軟體詐騙一事，導演練建宏特別補充：「受害者是完全不需要被責\n怪的」。片中，劉品言就是那位為愛飛去法國的農村姑娘。那私下有用交友軟體的經驗嗎\n\
  ？她坦言：「之前有用長得漂亮的朋友的照片申請交友軟體，想了解一下」更訝異表示「\n我發現有很多人在網路上有不同身分！但我是覺得當演員夠累了，不用再有更多身份」。\n\
  \n3位主演男帥女美，有遇過自己照片被盜用到交友軟體的事情嗎？林柏宏想起前陣子網路\n上的「紅樹林柏宏」事件，當時鬧得沸沸揚揚，因一名男子自認長得與林柏宏十分相似，\n\
  但女方看過照片後震驚不已，那他自己覺得男子長得像他嗎？林柏宏則竊笑，沒有回應。\n\n#林柏宏 #劉品言 #交友軟體 #大銀幕 #電影\n\n--\n佛法的\n\
  \ 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\n\n\n--"
