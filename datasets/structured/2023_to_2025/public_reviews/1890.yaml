title: '[新聞] 【親密陌生人】男神女神力挺：笑到超紓壓'
content: '新聞網址：



  備受矚目的南韓愛情懸疑新片《親密陌生人》，昨日（10/23）在首爾舉辦VIP試映會，現場除了導演?在奎率領主要演員柳海真、趙震雄、李瑞鎮、廉晶雅、松?昀、尹卿鎬等主要演員一同出席之外，在片中飾演趙震雄女兒的智友也首度亮相，一同參與宣傳，成為鎂光燈注目焦點。此外，許多重量級明星也到場共同助陣。演技派女神河智苑身穿一襲長版風衣帥氣現身，力挺曾合作過古裝大戲《茶母》的導演?在奎與李瑞鎮。而在影史票房神片《與神同行》中分飾「閻羅王」與「宋帝大王」的李政宰和金荷娜也盛裝出席。此外，在大勢韓劇《大力女子都奉順》中飾演部長的男神ꘊ筋陷荂B實境節目《一日三餐》中和李瑞鎮搭檔的金光奎、和柳海真合作電影《我的冠軍老爸》的新生代男星金旻載、李昇基的恩師李仙姬、韓劇《漢摩拉比小姐》女主角高雅羅、前「2NE1」成員Dara、電影《追擊者》女星徐令姬、曾出演《VOICE》的女演員李荷娜、《鬼怪》中的「三神奶奶」李依，以及在《陽光先生》中飾演李秉憲戰友的大衛李麥金尼斯（David-Lee-McInnis）等人都出席盛會。來自南韓演藝圈各領域的大咖藝人紛紛到場力挺，星光熠熠讓人目不暇給，也讓人見識到本片大腕演員們在演藝圈的超高影響力與絕佳人緣。Dara更在自己的IG曬出跟李瑞鎮的合照ꄊA並大讚本片：「太有趣了、捧腹大笑又讓人心驚膽戰，電影因?太好笑了，讓我跟著解除了壓力，觀賞前輩們的演技更是享受。」《親密陌生人》即將在11月2日於全台正式上映。





  值得一提的是，《親密陌生人》導演和主要演員也在日前接受電視節目訪問。只見眾人毫不客氣地互相鬥嘴，盡顯片場培養出來的好交情。尤其主持人問到：「哪位演員和片中角色差最大？」李瑞鎮馬上跳出來激動表示：「片中我飾演一位餐廳老闆，娶了個嫩妻，但根本就是個花花公子，跟我本人一點都不像！」不過一旁的柳海真卻馬上吐槽：「我倒覺得這個角色就是為李瑞鎮寫的！」導演馬上笑著補槍：「我就是想讓李瑞鎮演一個老牛吃嫩草的老不修。」聽得主持人也忍不住揶揄李瑞鎮：「娶嫩妻的感覺其實不錯吧？」惹得李瑞鎮堅決否認：「其實相處時間一長，嫩妻也

  沒特別棒啊。」此話一出，反而讓片中飾演李瑞鎮妻子的松?昀忍不住入戲地抗議：「明明我們才剛新婚不久啊？！」一來一往的幽默對話，讓現場爆笑不斷。



  這部超越「真心話大冒險」的愛情驚悚新片《親密陌生人》，台灣也將貼近南韓的10月31日檔期，於11月2日正式上映。超值預售票現正熱賣中，請上「博客來售票網」選購（）。本片劇情描述七位相識多年的好友與夫妻檔，相約在月蝕之夜共進晚餐，就當相談甚歡、觥籌交錯之時，其中一人提議來玩「公開手機」遊戲──若對感情問心無愧，就把手機內容不論簡訊、來電或各種可能會出現的訊息給公開。這場引爆超越「真心話大冒險」的危險遊戲，引爆眾人不為人知的驚人秘辛，也讓他們的愛情與友情面臨嚴峻考씊蝖K。



  欲知本片最新消息，

  請上電影官方部落格

  與臉書粉絲團查詢。



  --'
