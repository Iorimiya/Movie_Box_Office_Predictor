url: https://www.ptt.cc/bbs/movie/M.1547996961.A.003.html
title: '[討論] 親密陌生人的結局'
content: '就是

  中後段 開餐廳的不是被獸醫老婆抓包劈腿還讓人懷孕嗎？

  然後獸醫化完妝把婚戒丟桌上就走了，

  但是結局他們竟然又和好了！！！

  而且獸醫手上又戴上婚戒 而男生繼續劈腿，

  害我懷疑了一下是否中間一切都是夢-_-

