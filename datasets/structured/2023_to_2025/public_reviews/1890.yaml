url: https://www.ptt.cc/bbs/movie/M.1698723654.A.19C.html
title: '[好雷] 《親密》（Close）- 過渡即是終點 '
content: "今年二月上映過的電影。\n\n《芭蕾少女夢》比利時同志導演盧卡斯東特（Lukas Dhont）去年的坎城評審團大獎《親\n密》（Close），大多數討論比較著重少年成長經驗與性別議題。本文著重探討電影形式\n\
  的抽象與曖昧保持著某種純粹的開放性，如此看完其實會覺得《親密》會比《瘋狂富作用\n》更值得一座金棕櫚。\n\n\n雷文防雷資訊頁\n\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n (刊登於部落格原文，含圖片與連結)\n\
  \n\n\n《親密》講述少年成長歷程背景，巧妙的以國中時期人與人關係曖昧不明，性別不太明確\n的「中性」階段。在少年時期漸漸脫離家庭，參與外在世界逐漸意義化、邏輯化、社會化\n\
  必然的崩解過程，大部分少年電影會像是記憶的回顧，時常講述年少的經驗往往是暗示著\n那些經驗成為之後的我們。但《親密》卻非有此感，反而是以生命中曾經發生的事情，試\n\
  圖稀釋少年經驗電影結果式的「永恆」，以必然的孤立、抽象，不必太過交代人生後續的\n豁免感，呈現感受獨立、開放的存在。\n\n\n《親密》保持著一致的清澈、明亮質地，以捕抓細微動作表情的影像情動，巧妙利用國中\n\
  時期少年除了講話語意不清，以及尚未被賦予要把話說清楚的階段（ex：電影中以身體痛\n的淚水掩護心理上的哀傷），必然無法理解的曖昧話語。對於兩位曖昧關係主角，往往比\n\
  較像是在紀錄感情很好的「動物」描寫，「動物」並非貶義，而是更直覺靈巧的表達。關\n鍵的幾場戲：主角之一自殺的原因，以一種言不由衷，身體更誠實表示抗拒（或者接受）\n\
  的幽微暗示。\n\n\n電影名稱：「親密」除了是兩位感情很好的男孩十分的「親密」，更重要的是化約：人跟\n人之間的「親密性」：親密如何被度量？如何被在電影中（劇本、影像）感受人與人那種\n\
  有點親密可能又不太親密？《親密》劇本與影像渾然天成的契合（十分親密），可以說是\n教科書等級的良好示範（台灣導演們好好去看看吧）。影像上時常人物近景或特寫只捕抓\n\
  單人表情、動作，外在世界模糊不清。與劇本上的潔癖（稱讚之意），人與人關係只是點\n到為止，沒有太過於社會（群體）情感聯繫，表現著不太想建立任何立場（註1），盡可\n\
  能在低限的事件中（上學-死亡），呈現人物獨立、開放的情緒，這是從頭到尾《親密》\n盡可能維持的純粹與清新之處（註2）。\n\n\n同樣年少曖昧情誼「體質」可相提並論的是枝裕和的《怪物》最後一個鏡頭兩人奔跑象徵\n\
  性極強帶有的結語意味（註3），而《親密》則是以模糊的人去樓空背景，提示電影在這之\n前細膩布置著第一男主角Leo常去他們家會帶到的建築景觀鏡頭，並接續奔跑鏡頭的倫常感\n\
  ，這裡同樣的「奔跑動作」不像是《怪物》的故事性語法，而是在《親密》中一如往常重\n複的短暫片刻（如：打冰球、幫家人務農），試圖以重複相似的片段取代意義的推疊，同\n\
  時也可能是電影作為一種線性時間積累產物，《親密》像在大多是結論式故事語法的劇情\n長片中，找到一種「親密又陌生」的電影經驗逼近純粹獨立，開放的邊界（註4），甚至以\n\
  這樣相對於結論積累式的「過渡」時間經驗，告訴著這裡就是終點。\n\n\n\n\n（註1）\n以兩位主角上學之後的小團體政治性來說，導演在劇本與影像上處理顯然巧妙的刻意不過\n\
  於攀附在其他同學的小團體施加力道，而是很小孩式的開玩笑亂聊天等日常性幽微暗示一\n些些喜好與厭惡，比較深入的關係頂多就是後來Leo與冰球同好去他家玩電動過夜，試圖\n\
  找回過往舊愛背影？但也只是點到為止。\n\n\n（註2）\n包含電影後段人物死亡之後必須解釋或帶有某種療癒作用，電影在含糊中盡量不讓事件累\n積帶有的太多解謎感，而是等待時機輕輕的讓炸彈在水中爆炸（無聲）。\n\
  \n\n（註3）\n在此只是呈現比較，並無區別優劣之意。關於《怪物》部分可以詳見筆者前文\n\n\n\n（註4）\n舉例來說，電影後段主角打球被撞到手骨折，包石膏復健。後來拆掉石膏轉動手肘除了依\n\
  舊殘存著故事上重生之意。更讓人印象深刻的是，是在轉動手肘的特寫呈現某種錄像藝術\n式的抽象感（如舞蹈般），同時讓人想到布列松（Robert Bresson）式的純粹影像。\n\
  \n\n--\n\n拉特飯 - 以商業力量進入獨立市場\n(剛搬家內裝待修)\n\n--"
