url: https://www.ptt.cc/bbs/movie/M.1720396786.A.A8B.html
title: '[新聞] 女星拍性侵戲想請「親密指導」　男導演'
content: '女星拍性侵戲想請「親密指導」　男導演拒絕引發炎上




  【吳惠菁／綜合報導】29歲女星奈緒主演新片《老師的善意謊言》因有強暴性愛情節被

  列為輔15級，近日導演三木康一郎受訪，坦承自己拒絕了奈緒想要採用「親密指導」的

  要求，因而引發爭議，5日該片在日本上映，三木導演與主要演員出席宣傳活動，罕見

  由製片、三木導演道歉開場。


  《老師的善意謊言》（暫譯）改編自鳥飼茜的同名漫畫，以性侵、男女之間不平等的性

  關係為題材，故事圍繞在高中老師美鈴（奈緒飾）、班上男學生新妻（豬狩蒼彌飾），

  以及強暴美鈴的男人、也是美鈴閨蜜美奈子（三吉彩花飾）的未婚夫早藤（風間俊介

  飾）。


  三木導演日前受訪表示，自己以「不願其他人介入導演與演員之間」為由，拒絕了奈緒

  提出起用親密指導的要求，5日的電影活動上，首先由製片說明，拍攝當時，日本業界

  使用親密指導案例還是少數，製作方與演員經紀公司、導演討論後，選擇不透過第三者，

  由導演與演員直接溝通，在拍攝親密戲前，先用模擬圖向演員說明，之後由女性攝影師

  掌鏡，男性工作人員一律離場，若演員有任何不安，可向女性製作人或工作人員反映。

  製片表示，製作方原本認為這些措施已足夠，如今收到各方的意見與批評，讓他們體認

  到對於此事的認知有誤，配套措施不夠周全，製作方對此深切反省，並向漫畫作者、觀

  眾致歉。


  三木導演則表示：「我的無心之言對大家造成困擾與煩惱，想要藉著今天這個場合謝

  罪。」他稱自己讓該片演員、工作人員遭受很大的痛苦，也背叛了漫畫作者鳥飼茜的

  努力，邊說邊鞠躬道歉。


  輪到奈緒發言時，她劈頭便說「我沒事」，「我是真心喜歡原著漫畫，所以自己決定要

  演出這部電影。過程中確實有過溝通與分歧，但沒有我向權力屈服的事，我和導演站在

  對等的關係上談論，也表達了自己想說的事」。


  除了製片與導演道歉之外，電影官網當天也宣布場刊延後發售，今天就被發現官網悄悄

  更改了劇情介紹，原本為「美鈴雖然憎恨早藤，但因沉溺於快樂，仍然答應早藤的呼

  喚」，目前已刪除「但因沉溺於快樂」這句話。


  --'
