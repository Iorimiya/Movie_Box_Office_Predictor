title: '[新聞] 王真琳、宸頤演女同志親密戲交纏、互舔冰'
content: '新聞標題：王真琳、宸頤演女同志親密戲交纏、互舔冰淇淋！｜2023金穗影展開幕！


  完整新聞內文：


  【文/雀雀】金穗影展今（5/5）於華山光點舉辦開幕活動。其中以《春水奇譚》入圍劇情

  片的主創團隊包括導演黃丹琪、演員王真琳與宸頤皆有出席共襄盛舉。《春水奇譚》描述

  中年男子（宏都拉斯飾）遇到辣熟女好友（王彩樺飾）時，賀爾蒙總是賁張、蠢蠢欲動，

  偏偏性壓抑讓他生活著實苦悶，回家還會看到女兒（王真琳飾）與女友（宸頤飾）卿卿我

  我，更感難耐！


  女演員王真琳在《春水奇譚》首次祭出「同志情侶親密戲」，由於和導演黃丹琪有著七年

  的好交情，黃丹琪導演也刻意讓一向以甜美外型的王真琳嘗試中性同志裝扮，至於師妹宸

  頤則也讓造型師改造成觀眾沒看過的扮相示人。對於這次的表演，王真琳坦言一開始一直

  想著要把自己的甜美收起來，但在導演不斷提醒兩位女生要「鬆一點」且「更親密自然一

  點」，後來王真琳也就放手去演了。


  黃丹琪導演解釋《春水奇譚》中的這對女同志情侶當時是「女朋友住在王真琳家過暑假，

  在那一個月期間，兩人曬恩愛不怕人看，當然也不會管爸爸的眼光」。王真琳附和：「我

  們最重要的戲劇目的是要耍甜蜜，過程中有互舔冰淇淋、身體交纏在一起，目標就是要放

  閃到讓爸爸眼紅！」黃丹琪導演笑說：「如果爸爸晚點開門，就會看到更火熱的東西！」

  雖然在戲裡極盡親密之能事，但王真琳與宸頤皆異口同聲說在現實生活中並不會閃成這樣

  。宸頤坦白地說：「在家裡頂多牽手。」


  2023金穗影展即日起至13日在台北、台中與花蓮舉辦實體影展，也有「線上影展」通行證

  銷售中。第45屆金穗獎頒獎典禮則將於5月13日下午三點舉辦。


  新聞網址：


  --'
