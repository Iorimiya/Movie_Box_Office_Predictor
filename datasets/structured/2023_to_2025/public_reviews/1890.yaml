title: '[新聞] 質疑親密指導一職！麥可道格拉斯：片商'
content: '質疑親密指導一職！麥可道格拉斯：片商想奪走影人的主導權


  Yahoo奇摩電影戲劇編輯部


  2024年5月14日 週二 下午11:48




  《第六感追緝令》（圖：Tristar）


  1. 他過去曾打造出性感男神的大銀幕形象。


  2. 他跟莎朗史東、黛咪摩爾都曾同場飆戲。


  3. 如何讓女星感覺自在，應該是男星職責？


  【文／血紅蘭姆】


  拍過不少情欲電影的男星麥可道格拉斯直言，比起親密指導而言，如何讓同戲女星拍起床

  戲來感覺很自在，應該屬於男星的職責才對。


  現年七十九歲的老牌男星麥可道格拉斯近年來雖然不常出現在大銀幕上，主要是以《

  》系列電影中的漢克皮姆一角而聞名，但他不僅曾以《》奪下奧斯卡影帝、演技備

  受肯定，在八、九零年代更一連演出過多部經典情欲電影。


  在1987年電影《》中，麥可道格拉斯飾演一名抵擋不住誘惑的有婦之夫，就

  此跟發生一夜情，豈料這段出軌竟帶來了意料之外的後果。


  本片不僅一舉奠定了麥可道格拉斯的性感男神形象，也就此開啟了一波情欲懸疑片的熱潮

  。




  《桃色機密》（圖：Warner Bros.）


  在1992年電影《》中，麥可道格拉斯在追查兇殺案的過程中，也一步步掉進

  的迷人陷阱；到了1994年電影《》裡，在他和之間更上演了一

  段撲朔迷離的辦公室性騷擾醜聞。


  床戲經驗極其豐富的麥可道格拉斯，日前也向Radio Times談到了拍攝床戲一事：


  「我已經過了需要擔心這種事的年紀。不過親密指導一職十分值得玩味。感覺上像是片商

  高層想從影人手中奪走主導權，不過這方面的確曾出現過一些相當糟糕的失禮和騷擾之處

  。」


  「床戲就像動作戲一樣，一切都經過事先編排。就我個人經驗來說，身為男性，你必須負

  責讓女性感到相當自在，並對此好好討論一番。你會說：『好吧，如果可以的話，我會觸

  碰妳這個地方。』這十分緩慢，但看起來會很自然而然，而出色演技看起來正應如此。」


  「我相信有些人會跨越界線，但我們以前都會自行搞定這一類事情。他們會因此招致不好

  的名聲，而事情便會就此打住。但我跟一些女士們談過──因為我以前拍過一些情欲電影

  ──而我們現在對此打趣道，如果當時有親密指導跟我們一起共事的話，電影拍起來究竟

  會是什麼樣。」


  新聞網址：





  --'
