title: '[新聞]<親密陌生人>開千萬承諾?李瑞鎮:900萬就好'
content: '新聞網址：



  近日在南韓掀起話題討論的新片《親密陌生人》，昨日（10/16）於首爾舉辦媒體試映會，導演?在奎率領七位主要演員柳海真、趙震雄、李瑞鎮、廉晶雅、金志秀、松?昀、尹卿鎬出席盛會。本片劇情講述在看似完美的情侶聚會場合，眾人在歡笑聲中開始玩起「公開手機內容」遊戲，竟意外掀起彼此之間難以預測的情感風暴。由於這個危險遊戲涉及個人隱私，導演與全體演員都在活動現場直呼「反對公開手機！」不過，因為參與實境節目《一日三餐》、《尹食堂》而在全亞洲爆紅的李瑞鎮，日前就曾放話「觀影人數破千萬就公開手機內容」。但是在昨日的活動上，首次看完븊蒬★q影的他竟也開始擔心起來，改口：「希望觀影人數900萬就好。」引來全場莞爾。值得一提的是，本片男女演員戲份平均，也讓女星金志秀充滿感謝地表示：「在韓國演藝圈中，女演員常說自己沒有立足之地，所以希望本片能夠成功，讓女演員有更多立足之地。」一席話展現希望拓寬女演員地位的心情。《親密陌生人》即將在11月2日於全台正式上映。





  《親密陌生人》以堅強的台前幕後陣容，以及話題性十足的劇情，讓本片尚未上映，就已經在各大社群網站上造成轟動，也衍伸出許多讓人反覆辯證的議題。本片昨日在南韓舉辦媒體試映會，吸引廣大媒體前來觀賞，並以絕佳好評盛讚：「結構緊湊的劇本，聰明的導演方式，在長達兩小時的觀賞過程當中，無時無刻感到有限空間所帶來的壓迫，並利用音樂焦距家中其他場景而喚起氣氛，有時還會有一種恐怖、驚悚的感覺，是部讓人眼睛為之一亮、充滿笑聲與緊張感的優秀作品。」導演?在奎也在昨日的活動上表示：「韓國比其他國家更依賴手機與社群網路，已經成為沒有手븊鰲N活不下去的世界。這也意味隨?文明發展，手機比電腦更小、更智能，但反而成?枷鎖。雖然這樣說對家人不太好意思，但手機好像是最瞭解我的朋友，但有時候還是想離開這個朋友，讓我將這種心情拍成電影，並期望觀眾能夠看得開心，但在笑聲背後，也希望觀眾一起思考依賴手機的意義。」



  在片中飾演熟男餐廳老闆，卻因為和朋友聚餐時玩起「公開手機」遊戲，進而被爆出隱藏已久黑暗面的李瑞鎮，也開心透露睽違多年回歸大銀幕的感想：「很久沒拍電影，感覺真的很棒！我和李在奎導演認識很久了，非常信任他。尤其演員們都超棒，他們精湛的演技，補強了我的不足。」而他也對自己飾演的角色坦言：「這個輕浮的角色，對我來說真是頗大挑戰，因為我私下的個性一板一眼。片中我必須和年齡小很多的嫩妻，演出新婚夫妻的甜蜜狀態，是我演過最難的角色。」有趣的是，他之前曾為催票開出「千萬承諾」──只要電影屆時的觀影人數突破千萬，就會公開自

  己的手機內容。然而在昨日的活動上，他也開始擔心起來：「希望觀影人數900萬就好，這樣就不用公開手機了。」一席話讓眾人莞爾一笑。





  值得一提的是，《親密陌生人》集結南韓演技派群星共同演出，不僅男演員表現出色，女演員更是不惶多讓，展現出讓人不能忽視的存在感。曾榮獲百想藝術大賞影后肯定的廉晶雅，這回飾演柳海真的妻子。她對角色塑造也花費一番心力：「我飾演的角色，可說是專職家庭主婦代表，她為了打入朋友圈而作出許多妥協，而我也花費很多心思，去細膩詮釋這位平凡女性。」此外，在片中飾演提議玩起「手機公開遊戲」的金志秀，也因為全片男女角色的戲份平均，都有很大的發揮空間而表達感謝：「在韓國演藝圈中，女演員常說自己沒有立足之地，所以希望本片能夠成功，讓女

  演員有更多立足之地。」一席話展現希望拓寬女演員地位的心情。



  這部超越「真心話大冒險」的愛情驚悚新片《親密陌生人》，台灣也將貼近南韓的10月31日檔期，於11月2日正式上映。超值預售票現正熱賣中，請上「博客來售票網」選購（）。本片劇情描述七位相識多年的好友與夫妻檔，相約在月蝕之夜共進晚餐，就當相談甚歡、觥籌交錯之時，其中一人提議來玩「公開手機」遊戲──若對感情問心無愧，就把手機內容不論簡訊、來電或各種可能會出現的訊息給公開。這場引爆超越「真心話大冒險」的危險遊戲，引爆眾人不為人知的驚人秘辛，也讓他們的愛情與友情面臨嚴峻考씊蝖K。



  欲知本片最新消息，

  請上電影官方部落格

  與臉書粉絲團查詢。



  --'
