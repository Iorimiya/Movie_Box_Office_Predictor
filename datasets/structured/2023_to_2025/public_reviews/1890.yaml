title: '[好雷] 親密陌生人'
content: '已經上映一陣子的片

  由完美陌生人翻拍


  其實看完感覺兩部片滿像的

  電影的主題是

  每個人都有三個人生

  公開的一個

  私下的一個

  秘密的一個


  結局是當什麼都沒發現

  人們依然能維持和平的一面

  發現了可以選擇破碎或是隱忍

  但感覺還是不要發現會比較舒服一點

  畢竟人生短短的


  看完也覺得曾經討厭的人沒那麼可惡了

  因為誰沒有被討厭的部分

  這世界上沒有完美的人


  推薦給想更了解人性的人看

  會翻拍的原因大概是雖然是電影卻很真實吧～～


  --'
