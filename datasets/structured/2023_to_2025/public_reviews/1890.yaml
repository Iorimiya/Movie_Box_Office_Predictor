title: '[討論] 西恩賓認為親密指導員干擾床戲演出'
content: '【文／血紅蘭姆】一提到演員生涯初期所演的床戲，阿曼達塞佛瑞便顯得渾身不自在。


  如何演好床戲不僅是一門學問，近來更成為坊間議論不斷的熱門話題，因為




  自從王牌製片哈維韋恩斯坦在2017年爆發性侵醜聞之後，好萊塢便開始越來越重視演員在拍

  攝現場上的身體自主權，並就此引進了親密指導一職，好在卡司和劇組之間居中協調床戲要

  怎麼拍，以免演員在導演權勢威逼之下被迫作出妥協，逼不得已在攝影機前寬衣解帶。






  而早年曾在大銀幕上拍過不少床戲，更曾在《A片女神 深喉嚨》中飾演過情色片傳奇女星琳

  達蘿芙蕾斯一角的阿曼達塞佛瑞，如今也向Porter雜誌談到了自己當時拍攝床戲的親身經驗

  。


  十五歲便開始演戲的阿曼達塞佛瑞坦承，她很希望自己是在目前這個時代出道，因為親密指

  導如今已成為拍攝現場上不可或缺的必要職位，而演員們也比較有機會為自己發聲。


  戲齡超過二十年的阿曼達塞佛瑞表示，在以前那個不注重演員身體自主權和女性權益的時代

  ，自己雖然毫髮無傷地倖存了下來，但她也曾置身於許多讓她很不自在的狀況。


  「我當時才十九歲，卻得不穿內衣到處走來走去，你是在開我玩笑嗎？我是怎麼坐視這種事

  發生的？喔，我知道為什麼：我才十九歲，而我不想讓任何人不高興，也想保住自己的飯碗

  ，這就是箇中原因。」


  至於未來在拍攝床戲時，究竟要給演員們更多臨場發揮的空間，還是賦予他們一份願意解放

  身體的安全感，相信永遠都會是爭論不休的兩難議題。



  英文報導參考



  ===

  這件事87%會燒更大ㄎㄎ






  只能說齁 請你各位老白男謹言慎行啊


  --



  憑良心講 我不認為豆叔是想吃豆腐

  他只是認為演員自己懂得怎麼演

  不需要旁人一個口令一個動作的指導


  不過好萊塢出過那麼多包

  現在要安排有人在場監督 也是很合理啦


  XDDDD

  對 我蠢 刪掉那段'
