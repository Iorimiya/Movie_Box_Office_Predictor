url: https://www.ptt.cc/bbs/movie/M.1688803936.A.2C4.html
title: '[好雷]真愛旅程：探索自我是親密關係的革命之路'
content: "雖然這部片是2008年的電影了，但應該還是很多人沒看過，\n\n所以還是放個防雷頁。\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~\
  \ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n\n\n\n\n很多人說這部是鐵達尼號的續集，哈，這就是傑克跟蘿絲的雙雙被救起去了美國之後的婚\n\
  \n姻生活，這部的英文翻譯過來其實叫做「革命之路」，我覺得真愛旅程跟革命之路這兩個\n\n名字其實都蠻點題的。\n\n\n真愛旅程這個名字比較著重的是關係經營會重複經歷歸零跟重新開始的旅程，而革命之路\n\
  \n這個名字則是在講人生就是走在自我探索的這條革命道路之上。\n\n\n\n這部就是兩者合而為一的片子，藉由親密關係這個載體，實際在探討人如何因為自我的精\n\n\
  神空虛而毀壞關係，然後親密關係裡面的權力鬥爭如何毀了自己跟傷害對方，因為親密關\n\n係就是在照鏡子，但凡丟到對方身上的惡意跟負面，都會回到自己身上，親密關係其實是\n\
  \n一段不斷地發現自己是誰的旅程，就像在爬很多座小山一樣，當發現兩人已經到了一個瓶\n\n頸之後就代表又要重新開始探索對方了，因為每個人都跟冰山一樣有很多隱藏的部分。\n\
  \n\n\n看了很多心得文，我的感想跟其他人不太一樣，我覺得這部電影沒有在講男女平權或者婚\n\n姻失衡，這部電影的主軸在講找不到自我價值如何毀掉親密關係。電影一開始就是女主角\n\
  \n艾波挫敗的戲劇公演，當演員一直是她的夢想，但她卻做得很爛，她沒辦法接受自己的失\n\n敗，對於自己的感覺非常不好，而身為丈夫的法蘭克在我看來是希望她好受一點的，所以\n\
  \n他在接她回家的路上一直想辦法安慰艾波，但艾波處於巨大挫折的自我否定當中，根本就\n\n聽不進去，\n\n\n\n就這樣兩人開始了漫無止盡的爭執，陷入關係的權力鬥爭。法蘭克在這當中一直都試圖想\n\
  \n改善兩人的關係，他很盡力在表達也盡力在溝通，我看得出他很努力傳達出在乎跟關心，\n\n還有試圖想解釋目前發生的一切，但艾波的反應就是叫他不要講她不想聽。\n\
  \n\n\n她不想面對的是她的＂找不到自我價值＂的這個人生課題，不是不想面對法蘭克，當我們\n\n自己都沒辦法接受自己，就很容易把伴侶或者愛人推開。\n\n\n\
  \n至少我整部電影看下來，我覺得法蘭克是愛著艾波的，他用盡心力想維持關係，但艾波沒\n\n辦法，她的夢想都是失敗的，她沒做成演員只當了個家庭主婦，受困於日常繁瑣的雜務，\n\
  \n她的人生不如她所願，演員是她這麼喜歡的工作但沒有天份，這是很挫敗的事情，讓人覺\n\n得人生無望，還有什麼比這個更可怕的？在公演失敗跟丈夫吵架之後，她開始嚮往巴黎。\n\
  \n\n\n她把兩人不快樂的原因歸咎於鄰居都太平凡了，工作太乏味，我們這對夫妻應該是要跟別\n\n人不一樣的，說服丈夫既然你的工作枯燥乏味，這表示你還沒找到自己，所以她們一家應\n\
  \n該要搬到巴黎，搬到巴黎之後丈夫可以離開無聊的工作，自己去外出上班，這樣丈夫就有\n\n很多時間去探索自己的人生。\n\n\n\n聽起來很美好但就是哪裡怪怪的。\n\
  \n\n\n艾波以為去巴黎可以實現想要的生活，事實上怎麼知道其他巴黎人就沒有美國夢？問題根\n\n本就不在於巴黎或者是美國，而是艾波就只是想要逃。\n\n\n\n\
  電影的背景年代是1950年代，當時戰後的美國婦女在職場上就職比例已經來到了40%，而\n\n艾波說自己去巴黎之後也可以去找政府秘書的工作，那我想她在美國應該就不是屬於很難\n\
  \n找到工作的那一類型，真正的問題是艾波只是想逃避人生的空虛與找不到自我的事實，她\n\n以為去巴黎會找得到，慫恿丈夫並且貶低丈夫的工作也很無聊，應該一起去冒險探索未知\n\
  \n的世界。但法蘭克在影片後面談起電腦的科技進化感覺眼睛都稍微露出了一點光芒，他只\n\n是覺得每天的工作一直重複很無聊，但事實上任何人的工作到最後本來就會變成每日的\n\
  \nroutine，他並不是真的找不到自我，他只是不知道怎麼排遣無聊的時間。\n\n\n\n然後兩人就開始為了去巴黎陷入頻繁的爭吵跟發瘋，接著互相傷害，兩人都在劇烈爭吵過\n\
  \n後各自肉體出軌，我並不覺得這樣的肉體出軌有多麼的巨大到足以讓這兩人分開，這兩人\n\n選擇發洩痛苦的方式竟然一模一樣，而只有一樣的人才會在一起。法蘭克跟艾波坦承他是\n\
  \n因為在她身上受挫，他想要感覺自己更像個男人一點所以跟女同事上床；艾波則是逃去巴\n\n黎的事情受挫，人生無望所以跟鄰居上床，但這些舉措都沒辦法解決最根本的問題。\n\
  \n\n\n親密關係是探索自我的最快途徑，彼此太在意自己的傷痛也太在意對方，所以都滿足不了\n\n彼此，因為有著深深的誤會所以對話無法同頻，就這樣事情越演越烈終於迎來了悲\n\
  \n劇。這對夫妻如果在現代可以去做婚姻諮商，我的經驗是答案根本就不在外面，\n\n一條船會划，那什麼船都會划；如果本身就沒有把工作變得更有創意的能耐，\n\n\
  那是沒辦法去更有創意的公司的；\n\n\n\n解決問題的辦法就在當下，就在現在的生活，就在今天，如果本身就缺乏對現實的生活的\n\n接受跟享受，那去巴黎是好不到哪的。\n\
  \n\n\n這部血淋淋地呈現自我空虛如何毀掉親密關係，以及親密關係的真正困難之處，想看探索\n\n自我的電影推薦靈魂急轉彎跟土撥鼠之日。\n\n--\n\n \
  \                    HEY~~~HEY~~~CHAAAAARLIE~!\n   　    。。。。。   ◣        \n◣\n \
  \                   ㄟ◤\n \n◤\n\n--"
