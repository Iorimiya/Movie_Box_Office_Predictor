url: https://www.ptt.cc/bbs/movie/M.1541070270.A.6F8.html
title: '[新聞] 湯唯產後復出首作 親密戲「超立體」'
content: "新聞網址：\n\n2018-10-31 19:36 聯合報 記者黃保慧╱即時報導\n\n入圍本屆金馬獎5項大獎的電影「地球最後的夜晚」，日前在北京發佈會上，主要演員湯\n\
  唯、黃覺、李鴻其和陳永忠首次透露電影端倪，他們各自拿出了電影的關鍵道具，湯唯現\n場拿著口紅和化妝鏡說：「這是我和黃覺飾演的羅紘武見面的第一場戲。」也因為在化妝\n\
  鏡中和羅紘武的一次眼神交匯，兩個人的命運緊緊綁在了一起。\n\n在片中和湯唯有親密戲的黃覺則拿著3D眼鏡說：「戴上3D眼鏡看，湯唯會美得更立體。」\n李鴻其則拿一顆蘋果，爆料自己在片中有場邊吃蘋果邊哭的戲，笑言：「劇組準備的蘋果\n\
  應該夠我吃一整年了。」而飾演凱里市黑道老大左宏元的陳永忠則拿了麥克風，因為他一\n邊唱「堅強的理由」一邊吊打黃覺、拽湯唯頭髮的戲最讓觀眾印象深刻。11月8日「地球\n\
  最後的夜晚」導演畢贛也將會攜主創團隊出席金馬影展開幕。\n\n畢贛在發佈會上透露60分鐘3D長鏡頭幕後，竟是需要高達兩百多名工作人員全程身心投入\n才得以完成，而這個3D長鏡頭是引導觀眾「進入」角色夢境的通道。湯唯表示：「這個長\n\
  鏡頭拍得很過癮，所有人都像一家人，拍完之後全劇組歡呼，攝影師每次拍完都會直接倒\n下睡著，每個人都是山上山下來回奔波。」而黃覺也坦言：「拍完這個長鏡頭是凌晨五、\n\
  六點，我打電話給親友，但卻沒辦法把內心的激動表達出來，只有去看電影才能感受到，\n這部電影讓我跟導演成了忘年之交。」「地球最後的夜晚」定檔於12月31日在大陸上映，\n\
  台灣上映日期未定。\n\n該片講述了多年後回到貴州的羅紘武(黃覺飾)，偶然發現神秘女子萬綺雯(湯唯飾)的蹤跡\n，回想起12年前與她度過的那個秘密夏天，隨著羅紘武對萬綺雯的苦苦尋找，關於這個神\n\
  秘女子的越來越多線索浮出水面。\n--\n\n    \n\n\n\n--"
