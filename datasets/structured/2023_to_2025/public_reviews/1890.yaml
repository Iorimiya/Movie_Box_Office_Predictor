url: https://www.ptt.cc/bbs/movie/M.1589167955.A.3B5.html
title: '[討論] 韓親密陌生人哪版本結局比較好'
content: '上周末在mod上看了韓國版的親密陌生人，

  文章介紹可自己板上搜尋



  先說有雷，

  想自己發掘劇情的人不要往下看。

  =-=-=-=-=-=-=-=-=-=-=-=-=





  韓國版的電影在晚餐時段有分兩個版本，

  第一個佔據最多時間的版本就是大家小秘密爆開，朋友夫妻失和而陸續失望地離去。

  第二版本就是一切沒發生

  剛剛全部都是假想玩那個信任遊戲會有什麼後果，

  實際上大家酒足飯飽維持表面和平地回家。



  我想問說

  大家覺得哪個版本比較好，

  是赤裸真實發現各自秘密，

  重新釐清頭緒，再篩選修復關係比較好呢，

  還是一切都假假，各懷鬼胎等到真的無法隱瞞了才陸續坦承?

  感覺第二個可能造成後遺症比較大，

  但至少朋友會各自處理，

  而不會在多年好友面前公開不堪。



  你們覺得假如可以選擇的話

  自己寧願遇到哪版本的故事結局呢？



  另外我還有2個疑惑，

  一開始第一對夫妻到東道主家裡就說，

  唉唷你太太穿得褲子很緊呢

  是不是暗示她故意想在誰面前打扮?



  而且為什麼在沒有玩信任遊戲的劇情版本，

  好像只有一位男律師願意玩這個遊戲，

  我以為是女獸醫最坦蕩蕩才敢接受挑戰?


  --'
