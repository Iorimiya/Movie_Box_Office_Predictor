title: '[好雷] 親密 Close 2022比利時電影'
content: '雷文防雷資訊頁


  親密

  Close

  2022比利時電影




  從小一起長大的里歐和雷米，無話不談、天天都玩在一起，也常常留宿對方家中。當他們

  進入情感懞懂的青春期，同儕對於他們親密關係的嘲弄和檢視，讓里歐心生畏懼而刻意與

  雷米保持距離。心思細膩的雷米對於里歐的行徑無法理解也感到憤怒，兩人的關係從密不

  可分逐漸分崩離析、漸行漸遠。




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  刻畫友誼階段變化的無常。扮演主角里歐的比利時演員Eden Dambrine演出極佳，角色刻

  劃深刻。扮雷米的Gustav De Waele也非常出色，個人滿意度80分（滿分100）。


  本片場景美，劇情細膩。

  影片後半段的劇情呈現，令人挺揪心的，明明不用走到這地步的，卻為什麼遇上了？人世

  的無常可見一般，無常才是日常。珍惜人生的遇見，親情友情，每次見面當作一期一會的

  把握，且見且珍惜。


  以下有劇透，爆雷。




  雖然影片沒有明顯表現出來：雷米自殺身亡？為何要採取那麼激烈的行動呢？真的是讓人

  為之心碎。為什麼不多去想想活著的好處？更何況里歐的刻意疏遠的行動，並不是惡意的

  ，只能夠說雷米內心太脆弱了。雷米的爸媽都對雷米那麼地慈愛，仍然阻止不了雷米令人

  心碎的決定？里歐不夠心細及體貼，但是能夠去責怪他造成雷米自殺？這也太沈重了吧？

  主角二位男孩的家庭成員，都是善良可愛的人們，但仍然遭遇到這悲劇，人生啊。


  若雷米只是意外身亡，也許就沒有那麼多腦補的悲傷故事了。


  親密

  Close

  比利時電影


  --


  樓上的指責，受教了。

  所以完全不能夠碰瓷，文字書寫表達個人想法，要高尚正確就是了。

  請問你們是否要寫一下正確適當的心得感想，是什麼？


  你們二位有看完此片，認為雷米是憂鬱症患者？所以你們二位，認為如何去看待，陪伴，

  協助憂鬱患者，比較適當？


  謝謝樓上二人的指教。







  謝謝樓上P大的留言。感恩。貼人家標籤似乎是一般人的人性，而且有些偏向揶揄，惡意

  或調侃。

  人言可畏，真的是，時常要鍛鍊自己的身心，面對網路文字上，日常生活上，及有時因故

  對自己的指責....等等的可畏人言。





  謝謝樓上的留言。

  憂鬱症傷害殺害自己的人，和一些精神病傷害殺害別人而被輕判的人，都不能夠過於保護

  而不去處置。

  輕易地說別人不能夠指責這些患者，很簡單。


  這些患者，有些是偽裝的（逃避罪責），有些是確實的，的確需要更多的集思廣益並付諸

  配套行動，真的不容易。



  P大的温暖傳遞，收到了。謝謝你。



  謝謝樓上的留言。

  對於自殺的人，憂鬱症的人，提出自己的看法，說是指責，說是看法不正確，都是人言。

  人言，盡在人心，只有自己好好消化，別傷害自己。





  謝謝樓上小羊大大的留言，才得知導演前作也有涉及自殘的劇情。


  不同意見，多提出討論，都可以是正向的，真的很正向的態度。

  我只希望看完的人或沒看都留言的人，在留言前，能夠心存善意地記錄文字即可。'
