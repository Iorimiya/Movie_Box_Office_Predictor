title: '[新聞] 李奧納多談「被熊強暴」：感受到人獸親密'
content: '李奧納多談「被熊強暴」：感受到人獸親密感！


  李奧納多狄卡皮歐為了演出《神鬼獵人》犧牲好大，竟然被看過影片的影評人，形容說：

  「李奧納多在電影中被大熊撲倒，熊開始出現抽插動作，他就被強暴了，而且還是2次！

  」連他本人接受訪問都透露，該被侵襲場面是他演戲生涯中，遇到最困難的事情之一，令

  人想入非非。


  其實電影公司早前曾經發聲明表示，電影中的熊是雌性，所以根本不可能強姦李奧納多，

  該母熊只是覺得受到威脅，想攻擊他而已。但李奧納多昨天在接受《ABC''s 7.30》節目訪

  問時，講的卻完全不是這回事，不僅越描越黑，還完全沒澄清，竟表示：「那是一場很具

  革命性的戲。」


  李奧納多甚至語帶暗示說：「這場戲可以喚醒觀眾的另一種感受，會讓人感覺自己像某種

  有偷窺狂的動物，正在看著你不該看的東西。你們也能感受到人與野獸之間的親密感，能

  感受到來自動物的汗水和體熱。」講的像是真有那麼一回事的感覺。


  新聞網址：


  --'
