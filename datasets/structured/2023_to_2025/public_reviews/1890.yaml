url: https://www.ptt.cc/bbs/movie/M.1547902049.A.E2D.html
title: '[討論] 為藝術犧牲？親密戲怎麼拍？'
content: "跟各位分享演員在演出親密戲時的一些經驗\n專業真的很重要阿！！！！\n好讀網址版：\n\n---------------------------------------------------\n\
  \n去年戲來就演影展上有一部短片裡面有一段酒店小姐被客人硬上的戲，\n當時影展結束的座談上，所有的觀眾都在問那位女演員，\n說：『你是怎麼為戲犧牲的？』『拍攝尺度這麼大的戲，是如何在表演上營造\n\
  說服力的？』事實上，關於這類的問題，在漫長的影史中屢見不鮮，\n而回答的方式就只有兩個字：『專業』！\n\n專業分為兩個層面，一個是演員個人的專業，另一個是導演在引導上的專業。\n\
  \n專業造就信任，信任則成就了演出的說服力。回到上面的例子，導演在現場引導\n那場戲時，兩位男女演員是第一次碰面，彼此很不熟，因此導演在拍攝前做的第\n一件事情就是『營造可信任的拍攝環境』，除了必要的工作人員以外，現場不要\n\
  留太多人，開始排戲後，導演先跟兩位演員確認彼此的角色動機，以及這場戲的\n重點，然後開始排走位，拉出角色的戲劇動作，就如同在編排一支舞蹈一樣，先\n讓演員不帶感情的熟悉走位、動作、台詞，並同時在一些較『親密』的動作上，\n\
  事先讓演員知道我們的『保護措施』會怎麼做，演員之間的親密互動，也會讓他\n們在導演的引導之下一步步溝通好，所有的一切都是建立在『專業』這兩字的基\n礎之上進行。隨著排練的進行，兩個演員的信任度越來越高，等到開拍時，再依\n\
  照先前排練的內容，投入情緒演出，並且由於經過專業的排練，每一個鏡頭多半\n都拍三次以內就ok結束了，就是這樣，當大家以『專業技術』在面對戲的時候，\n自然就談不上尷不尷尬，犧不犧牲的問題了。除非，導演或演員的『心術不正』\n\
  ，別有用心的想藉戲獲得某些好處，這就另當別論。\n\n好的演員不需要真的變成某個角色，只要讓人相信自己就是那個角色就夠了，這\n句話的意思是，演殺人犯不需要真的殺人，演強暴犯也不需要真的有性侵的經驗，\n\
  在專業的演員詮釋下，依然可以營造具有說服力的表演。而且這也順便回答另一\n個一般人對表演的錯誤觀念，那就是：是不是演員一定要『入戲太深無法出戲』，\n才叫做好演員？這答案同樣也是錯的，真正好的演員，在入戲跟出戲之間，絕對\n\
  都有辦法自由進出。會有這樣的錯誤理解，其實真正入戲太深的往往是觀眾，而\n不是演員，這也代表演員的演出夠成功，才能讓觀眾以為這演員入戲太深，當然\n再加上一些媒體的『大肆宣揚』之下，其實這說穿了，都只是一些宣傳手法而已。\n\
  多虧了一些投機取巧之徒或是企圖得獎者對於此技巧的濫用，讓這年頭的「方法演技」\n在媒體刻意誇大某些演員入戲太深而『成魔』之下，扭曲其成為了市場行銷工具，\n一個借表演的正當、真實與重要性之名，來屏棄水準要求的方式。\n\
  \n那麼問題來了，『專業』該如何培養？答案是：有步驟且循序漸進的在一個經過驗\n證的表演體系中學習成長，同時保持對生活的熱情與對技巧鑽研的好奇，重點不是\n如何『達到』專業，而是享受追求專業的『過程』。我常遇到學生跟我說：\n\
  『這我學過了，為何還要特地拿出來講一次？』孩子，就是因為你這句話，所以我\n才特別要再教你一次，對演員來說第一次學叫做『知道』、第二次學叫『體驗』，\n第三次學叫『了解』，第四次學叫『體悟』，第五次學才有可能『內化』成為自己\n\
  隨時可用的東西。蹲馬步出正拳人人都可以輕易模仿，但為何同樣都是一拳，卻有\n著小混混與一代宗師之別？因為同樣的技術與知識，你面對它的態度，就決定了你\n最後的高度，道理就在這裡。\n\
  \n在戲來就演的課程中，我們也是按部就班的把課程拆成基礎、應用、高階與頂級四個\n類別，我們盡量做到讓演員可以在同樣的體系中，循序漸進的從『知道』，慢慢變\n\
  成『體悟與內化』，這部份的確需要強烈的邏輯性來編輯課程才有辦法做到，好的\n演員不一定會教，好的老師也不一定會演，演出需要的直覺與活在當下的特質，有\n些演員天生就有這樣的能力，但他不會教。而教學則是需要用大家都能理解的方式，\n\
  有步驟與邏輯的，一步一步盡量讓不同程度與天份的學生，都能達到相似的學習成\n效。關於這點，我們戲來就演，在課程的編排上，可說是非常用心在經營。\n\n回到本文開頭，再次強調『專業』的重要性，我們希望透過教學的專業，可以讓演\n\
  員在安全並可信任的環境中成長，如此，專業的教學，帶來專業的演員，專業的演員，\n成就專業的拍攝環境與作品，雖然台灣很小，但我們也可以很大，只要我們持續做對\n\
  的事情，終究會看到陽光。\n\n\n--\n                                    01/19 20:49\n        \
  \                           01/19 20:49"
