url: https://www.ptt.cc/bbs/movie/M.1689646177.A.867.html
title: '[好雷] 親密 Close'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  好像因為哪裡的暗示，決定在《怪物》之後接看這部片。還記得當初去看別部片時，遇到

  所有人搶買這部片的現場。等電影時看了預告，還在想這似乎不會是我的菜。


  結果，好看，是我的菜。男主角的眼神太令人相信。


  早就聽過在學校裡特別可愛或美麗的男孩容易被欺負（現在似乎比較流行使用「霸凌」）

  ，也讀到一些討論「性別」的書中寫到：男性需要透過社會上其他男性的肯定來確立自己

  的存在。電影拍出來主角從純粹的世界進到中學校園（一個小社會）時產生的轉變。兩個

  男孩之間沒有明說的一切，加深了其中一方的痛苦。那個痛苦在這故事裡沒有出口，因而

  傷害了他的父母，也使主角陷入混亂迷網。


  我自己是特別可以理解主角的情緒和想法，即使我從未需要在同學之間證明自己或希望自

  己融入團體，我也有類似經驗：國小時曾經像是雷米，大學時曾經像是里歐。有一天理解

  自己為了保護自己不是先被傷害的那一個，而提早做出傷害別人的行為時，我有如里歐一

  般的懊悔。可關係破裂是無法逆轉的事。我不知道當時被我傷害的人是否康復了。


  如果有人說《怪物》和《親密》說的是一樣的事，我會反對且質疑，但並不是說它們不值

  得對照來看。因為人與人之間的關係，並非一部電影可以說盡，就算議題相近，也有各自

  專注的面向。就我個人看來，《怪物》建立在「孩子恐懼未知」，世界以「慣性」運轉，

  只看到片面的人會作出不正確的判斷，其中的「傷害」與「罪」不是直來直往。《親密》

  則是更純粹一些，專注在兩位少年的關係變化，學校體制的影響不在體制，在於學校是一

  個小社會，主角判斷自己在那環境中如何生存，選擇與摯友拉開距離（電影沒有說，但可

  能同時也是背叛了真實的自己），不再親密。那種接開距離對摯友來說是一種無解，是一

  種拒絕。


  寫到這裡，感覺《伊尼舍林的女妖》也是類似的一個出發點，只是發生在成年人身上（可

  見不是只有少年人才會傷痛），少了性別認同與性傾向的探索，同時也少了社會同儕壓力

  ，更偏向寓言故事。


  ***


  這裡是我的樂園:




  --'
