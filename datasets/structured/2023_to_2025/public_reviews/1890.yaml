title: '[新聞] 梁朝偉與王家衛28年親密合作結束了？張震接棒一哥'
content: '新聞網址：


  今日，演員梁朝偉通過太太劉嘉玲向媒體宣布與澤東電影的經紀合約已到期（梁朝偉於

  1998年簽約澤東電影公司）。梁朝偉與王家衛自“阿飛正傳”（1990）起長達28年的合作

  會就此結束嗎？


  梁朝偉發給媒體的訊息中寫道：“各位記者朋友大家好，我是梁朝偉，我與

  澤東電影公司的經理人合約已經圓滿結束啦，以後大家有任何工作上的需要，可以暫時聯

  絡我太太劉嘉玲，多謝大家。“


  隨後劉嘉玲接受港媒採訪時表示，“我只是暫時性幫忙老公，做個聯絡人，

  等物色到適合經紀人，我會交給新經紀人處理。至於他為何這麼突然公佈，你們見到偉仔

  本人，自己問他本人啦！“


  自1990年“阿飛正傳”起，梁朝偉與王家衛一直保持著親密的合作關係，兩

  人合作的電影包括“阿飛正傳”，“重慶森林”，“東邪西毒”，“春光乍泄” “花樣

  年華”，“2046”，“一代宗師”等。事實上，王家衛導演的電影長片中，只有“旺角卡

  門”，“墮落天使”，“藍莓之夜”沒有梁朝偉出演。


  兩人合作的最後一部電影是2016年的“擺渡人”，在該片中，梁朝偉任男主

  角，王家衛任製作人。


  在與王家衛合作的電影中，“花樣年華”助梁朝偉斬獲戛納影帝，“重慶森

  林”，“春光乍泄”，“花樣年華”，“2046”助梁朝偉四度奪得香港電影金像獎影帝（

  梁朝偉共5次獲得該獎項），“重慶森林”助梁朝偉摘得金馬獎影帝（梁朝偉共3次獲得該

  獎項）。


  澤東電影公司是由王家衛和劉鎮偉於1992年年聯合成立，張曼玉，鞏俐，劉

  嘉玲等都曾簽約澤東。梁朝偉離開後，澤東電影旗下藝人還有張震，張榕容等。


  王家衛曾透露，澤東這個聽起來讓人有些浮想聯翩的名字其實並沒有多少深

  意。當年他們的公司開在九龍城秀竹園道，旁邊就是啟德機場，每天不斷有飛機從樓頂飛

  過，就想到了Jet Tone Film production這個名字（Jet有噴氣式飛機的意思），後來根

  據相近的發音取了“澤東電影”這個中文名。


  --'
