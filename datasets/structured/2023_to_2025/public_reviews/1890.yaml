title: '[好雷] 親密 Close'
content: '天哪 我上次哭得這麼慘是看美國女孩的時候了


  瘋狂富作用是個什麼東西 這部才應該得金棕櫚吧


  兩個小男生分別在電影前後繳出近乎完美的演出


  尤其是飾演 Leo 的 Eden Dambrine 從轉折點開始


  收放自如一氣呵成 衝向讓人直接哭死的結尾


  好佩服導演可以指導這兩位年少新人有如此表現


  另外有許多人物在快速移動的鏡頭都拍得好美


  然後彷彿怕還有人哭不出來 配樂也是大號催淚彈


  總之正式上映我是會去二刷的 面紙需要多加準備


  算是很好懂的片所以感覺在台灣票房會不錯


  希望有機會造成另一波口碑熱潮 絕對值得

  -----

  Sent from JPTT on my iPhone


  --'
