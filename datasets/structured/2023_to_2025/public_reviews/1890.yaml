url: https://www.ptt.cc/bbs/movie/M.1424882624.A.ADC.html
title: '[新聞] 新科【007】電影大反派，親密愛侶遭爆料'
content: '新聞網址：


  新科《007》電影大反派  遭爆愛侶疑似《驕傲大聯盟》編劇


  入圍今年金球獎最佳影片的《驕傲大聯盟》（Pride），是近年最受矚目的同

  志電影，集結眾多實力派演員共同演出，其中以電視影集《新世紀福爾摩斯》

  （Sherlock）大紅大紫的安德魯史考特（Andrew Scott），才在2013年底出

  櫃表明同志身分，接著便在《驕》片飾演同志，甚至還將在最新一集的007電

  影《007惡魔四伏》（Spectre）當中飾演反派要角。不過他認為《驕》片並

  不只是同志電影，也並不強調性愛及色情，反而著重在人性互助之上；且身

  為同志的他，更認為能演出本片是件非常榮幸的事，就如片名一樣以同志為

  榮：「我感到無比『驕傲』！」他在片中跟多明尼克魏斯特（Dominic West）

  飾演同志愛侶，更和多明尼克有吻戲，沒想到多明尼克卻私下爆出安德魯的

  感情狀態，說他是在安德魯的男友面前進行一個接吻的動作，而該位男友就

  是編寫本片的人，意味安德魯和編劇史蒂芬貝勒斯福（Stephen Beresford）

  在一起。此外，多明尼克除了挑戰男男接吻之外，也為電影大秀舞技，還花

  費兩、三個月準備一場長達四分鐘的舞蹈片段，還因為跳得太猛而濕身，連

  換九件衣服，就連導演馬修沃休斯（Matthew Warchus）都擔心他會不會跳

  到摔斷腿！《驕》片將於本週四（2/26）在台上映。



  《福爾摩斯》「莫娘」演Gay  《驕傲大聯盟》在男友面前舌勾野郎


  《驕傲大聯盟》雲集眾多好萊塢演技派巨星出演，其中極受矚目的，就是演

  出電視影集《新世紀福爾摩斯》而暴紅的安德魯史考特。他在《新》劇飾演

  大反派莫里亞蒂，還因角色頗有「娘」味，而被劇迷取了「莫娘」稱號。然

  而現實生活中的他，其實早在2013年11月就出櫃表明自己的同志身份，接著

  便演出有「近年最好看英國同志電影」之稱的《驕傲大聯盟》，以切身行動

  力挺同志族群。他在《驕》片飾演生於威爾斯小鎮的同志「蓋斯」，但母親

  無法接受他的同志身份，讓他只好遠走他鄉，在倫敦開了一間書店。談到出

  櫃後接演第一部同志電影的契機，他表示：「當我和導演開會時，比爾奈伊

  （Bill Nighy）和伊梅達史丹頓（Imelda Staunton）已經確定加盟演出，

  而我讀完劇本之後，覺得故事非常出色。當時我正想接演一個比較低調暗沉

  的角色，正巧『蓋斯』就是這樣的一個人。」



  安德魯史考特並認為，《驕傲大聯盟》不只是一部同志電影，更是一個關於

  人類的故事：「我喜歡片中這群同志，他們都不這麼色情，就像英雄一樣威

  勇，也十分具有憐憫心，而且電影更凸顯出諸多人性，令人耳目一新。這是

  一部重要且有影響力的電影，沒錯，片中的角色是同志，但我們不只是在探

  討情慾！」值得一提的是，片中常有一群演員在相同的場景裡飆戲，這讓安

  德魯感到十分有趣：「這就是我為什麼會如此喜歡這部電影的原因，這12位

  主要角色，全部都是同志耶！」此外，他也認為以同志身份詮釋同志角色，

  讓他非常滿足：「我感到無比驕傲。事實上，能參與這個故事，讓我感受到

  前所未有的光榮。」而且他在片中跟多明尼克魏斯特有吻戲，卻意外被多明

  尼克爆料感情生活，多明尼克透露：「我在開拍前就認識安德魯了，他是一

  個很棒的朋友，所以和他接吻很有趣，尤其是在他男友──那位編寫本片劇

  本的人面前。」耐人尋味的一席話，也暗指安德魯正在跟編劇史蒂芬貝勒斯

  福交往中。



  多明尼克魏斯特「舞」力全開濕透透  《驕傲大聯盟》獲本尊按讚


  爆料安德魯史考特感情生活的多明尼克魏斯特，在《驕傲大聯盟》中飾演「

  舞」功高強的同志，但其實他對跳舞並不在行，所以能被選中演出本片，讓

  他實在有點驚訝，他對此笑稱：「我曾經面試過導演馬修沃休斯執導的舞台

  劇，他是一個非常優秀的劇場導演，我一直很想和他合作，但他以前都不想

  跟我合作。不過我應該是做對了什麼事情，才讓他拿本片劇本給我看。」編

  劇史蒂芬貝勒斯福則透露，當時聽到多明尼克要飾演這個舞棍角色時，其實

  有點擔心：「多明尼克是個卓越的演員，而且他的形象也讓我想起強納森這

  位真實人物。但這角色的首要條件，就是要很會跳舞，所以一開始我就和他

  的經紀人強調這點。好在我們很快就發現，他真是天生跳舞的料！」



  多明尼克在片中有場令人驚艷的獨舞段落，乍看完美無缺的表現，可是讓他

  做足努力。光是一場四分鐘的跳舞片段，他便隨著頂尖編舞師，練習兩、三

  個月，全身濕透又精疲力盡，連編劇史蒂芬貝勒斯福都認可他的努力：「他

  不斷跳呀跳的，結果拍這場戲足足換了九件衣服。」而他的努力演出，甚至

  讓導演馬修沃休斯擔心他會受傷：「多明尼克拍完跳舞戲隔天，就要和哈利

  王子參加一場慈善步行，我真的很怕他會摔掉腿！」不過多明尼克的優異表

  現，也讓曾參與過片中這段歷史事件的強納森本尊讚不絕口：「他是一個多

  麼迷人、多麼謙遜的男人啊！他的詮釋讓人驚豔，且非常引人注目，我甚至

  很樂意變成他！」



  這部擁有強大卡司的得獎夯片《驕傲大聯盟》，即將於本週四（2/26）在台

  正式上映，超值預售票正在「博客來售票網」熱賣當中

  （）。本片劇情

  描述1984年，英國首相「鐵娘子」柴契爾夫人實行堅硬的經濟政策，打壓工

  會團體，削減勞工權利，使得各地工人心生不滿，決定發起大規模罷工來對

  抗政府。當時正值倫敦大遊行之際，一群男女同志同情工人處境，認為他們

  和同志族群一樣被政府迫害欺侮，決定發動募款活動，來支持工人團體。不

  過在接洽各地工會時，卻因為他們敏感的同志身份，讓捐款善意一直遭拒。

  不過他們並不氣餒，決定繞過工會，直接聯繫煤炭礦工。這群充滿勇氣和正

  義的男女同志們，親自前往南威爾斯的一個鄉村小鎮，將募來的款項獻給當

  地礦工。然而傳統又保守的礦工與當地居民，對這群突如其來的「貴賓」感

  到意外又困惑，甚至引發許多反對聲浪，讓同志們陷入窘境。究竟有著天壤

  之別的礦工及同志們，能否摒棄對彼此的歧見，攜手結盟呢？在雙方磨合的

  相處過程當中，又將擦出什麼爆笑火花呢？



  欲知電影最新消息，歡迎上電影官方部落格

  與臉書粉絲團查詢。



  --'
