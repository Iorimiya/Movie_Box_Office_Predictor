title: '[好雷] 《親密》，當他們成為了他與他之後。'
content: '部落格版：


  當坐在餐廳，看著一對大概四、五十歲的男女走進來，會想「啊，應該是夫妻吧？」；當

  走在路上，身旁一對穿著高中制服的男女笑著走過去，會想「嗯，應該是情侶吧？」，好

  像人總是這樣，不論有意還是無意的，都會習慣性的將人與人之間貼上「某種關係」的標

  籤，彷彿這個世界上除了陌生人以外，就不存在著「沒有關係」的相處。而我們也總是可

  以找到各種理由來去合理化這樣的行為，可能是想當話題聊，也可能是單純無聊，只是也

  許我們都沒想過的是，這樣不負責任的將擅自認定的關係標籤貼在「沒有關係」的兩個人

  身上，卻反而會真的造成兩個人因為本來沒有的關係而尷尬、甚至產生從此不再想要和對

  方有任何關係的想法。常見的例子是，在朋友聚會上如果有兩個人一起出現，「吼，該不

  會在一起了吧？」、「你們是什麼關係？」等的調侃與揶揄絕不會少，而在聚會結束之後

  ，兩個人、或者先意識到不對勁的一方，會下意識的和對方保持距離，說不上來為什麼，

  明明沒有吵架、也沒有不好，就只是想要保持距離，直到彼此退回到「沒有關係」為止，

  但遺憾的是，當有這種想法時，就註定兩個人不可能回到最初了。


  我很喜歡的《芭蕾少女夢》導演盧卡斯東特新作《親密》，所講述的就是這樣一部關於「

  兩個人因為關係上的被定義而失去彼此」的故事。就如前作《芭蕾少女夢》藉著劇情上的

  編排，來讓觀眾隔著銀幕都能感受到正在經歷漫長變性過程的主角，她對於性別與身體認

  同上的焦慮與掙扎，而在《親密》裡同樣順著劇情推動，讓觀眾能清楚且強烈的捕捉到正

  在邁入青春期的主角里歐、他害怕被他人定義與雷米間關係的焦躁與不安。兩部電影相像

  之處在於，兩位主角均是處在「格外在意他人眼光與想法的年紀」的少年與少女，特別對

  於《親密》的故事而言，主角並非絕對、但若是里歐這個年紀會是最好的，纖細而又敏感

  的，覺察到並且在意著周圍、尤其是同儕間每個字句裡不經意帶有的曖昧，導演盧卡斯東

  特知道，如果今日《親密》裡的情節發生在已有年紀、或是已出社會的成人身上，可能會

  被熟捻的笑著帶過，所以對我來說《親密》之所以能如此觸動到我，是因為對里歐和雷米

  的心疼與不捨，認為他們太早、也不該承受這些，太多的似曾相似讓人心痛。



  在只有里歐和雷米的世界裡，他們總是在花田裡追逐奔跑、在秘密基地裡玩著冒險遊戲，

  他們是如此的親密，親密的那麼耀眼，親密到你會捨不得拆散他們，親密到連里歐母親都

  笑著說「希望你總有一天會回家睡覺」，里歐和雷米的關係無需解釋，也不需要被解釋，

  他們就是單純的「里歐和雷米」。然而他們不可能永遠只在花田裡嬉鬧，也不可能永遠只

  和面對幻想出來的敵人作戰，他們還是被迫必須長大、被迫去面對兩人世界以外的世界，

  里歐和雷米最後終究會成為「里歐」和「雷米」，當原來澄澈明亮的雙眸染上憤怒、不解

  還有茫然，他們註定會在原來世界裡迷失，然後失去彼此。


  里歐和雷米看在同學眼裡是難以理解的過度親密，他們看似好奇的想要知道兩人之間的關

  係，但其實他們只是想要知道里歐和雷米「屬於哪裡」，如同他們自然而然分成了好幾個

  小團體，他們要依照兩人的回答來決定要把他們歸類在哪一團，後來里歐給了答案。他否

  認了和雷米的關係，和他刻意保持距離，抗拒被貼上同性戀標籤，羞恥而又憤怒的推開雷

  米，里歐害怕被異樣眼光看待、害怕被排擠在外，他加入冰上曲棍球隊更像是種出於本能

  的防衛行為，他在自己和雷米之間劃了條界線。剛開始，里歐還是會不時留意著雷米，放

  學以後兩人又像是沒事般的像過去一樣，只是不對勁的煩悶感依舊在里歐心頭揮之不去，

  開始什麼都不對了。於是漸漸的里歐不再看著雷米了，他不再等他一起上學、不再去他家

  玩、不再去秘密基地，那一次的吵架打著打著就哭了，不再相互依偎而是背對著彼此渡過

  難熬一夜，彷彿告訴著觀眾「里歐和雷米」已經不在了。



  導演盧卡斯東特讓世界傷害了里歐和雷米，即使有些殘忍的，也是在告訴著他們這是成長

  必然面對的過程，那些始終存在著的刻板印象與自以爲，總是輕易摧毀了美好的人事物，

  年少懵懂的單純都在長大之後悄然消逝，是失去也像是被帶走，《親密》沈痛的讓人難受

  。里歐和雷米母親在森林裡相擁，那是整部電影最美好可卻也最心碎的時刻，我認為雷米

  母親是原諒了里歐，但同時她又無法面對她所原諒的里歐，那份矛盾讓她選擇離開小鎮，

  留下裝滿著里歐和雷米回憶的空屋。我們都在銀幕這頭，陪著里歐承受著巨大的悲傷，無

  處宣洩的出口深怕他傷害了自己，但幸好的是，導演盧卡斯東特最後還是溫柔的接住了里

  歐。在這個年紀，難得可貴的是勇敢面對自己、勇於承認曾經做過的事，即使無法換得原

  諒，可至少這份勇氣可以推著自己繼續向前邁進。


  --'
