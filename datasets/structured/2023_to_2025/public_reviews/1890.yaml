  此區為發文防雷頁\n可選擇性提供上列 1~4 資訊  或不提供亦可\n觀影心得於分隔線下方發布即可\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線\
  \ ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n先前受朋友推薦，觀賞了本片的原作，獲得義大利奧斯卡「大衛獎」最佳影片的《\nPerfetti\
  \ sconosciuti完美陌生人》。除了讚嘆劇本的強大與演員的演技精湛之外，心情\n也是五味雜陳，雖說相比之下，韓版看似較為輕鬆詼諧，但同樣透過手機揭露不為人知秘\n\
  密的可怖與一段關係當中的人心黑暗，可是一點都不少的。\n\n\n故事講述，七名兒時好友與配偶在月蝕之夜相聚共餐，女主人提議玩比「真心話大冒險」\n更緊張刺激的「公布手機」遊戲，在晚餐期間所有接到的電話與收到的簡訊都必須公諸於\n\
  世。想當然爾，發生了許多悲劇，有被知道也沒關係只是有點難以啟齒的小祕密、有同志\n傾向被迫出櫃、有未讓伴侶知情的就診、有精神出軌也有肉體外遇、甚至產生了誤會必須\n\
  當場說開。每個人都有三段人生：公開的、私人的與秘密的。有的人的秘密只是不願被知\n道，而非不能被知道，但有些人的可是會鬧家庭革命的。\n\n\n其實，整部片「單調」到只有一組場景的電影還不少，像是《Locke失控》與《Phone\n\
  Booth絕命鈴聲》等，《親密陌生人》至少還有房子裡客廳以外的場景，加上韓版連童年\n與赴約前都一併拍攝了，畫面上已經豐富很多。不過，這類型電影最大的關鍵在於「演技\n\
  」。當觀眾花兩小時，只看角色在餐桌上對話與使用手機，演員們的情感流動與演技表現\n更顯重要。\n\n\n由於角色設定與演技要求，《親密陌生人》的演員群年齡層自然會落在中年，大致上皆接\n\
  近50歲。但是，片中少數沒有秘密被揭露，自己光明磊落所以對人信任的獸醫師，由年僅\n31歲的女星宋昰昀飾演。面對眾多演技精湛的前輩，她也不惶多讓，即便演出的角色是沒\n\
  有心機的單純少女，從信任到得知被背叛的心境轉折，宋昰昀也表現得令人心痛。韓版裡\n的男主角找來演出過《非常警探》、《暗殺》與《下女的誘惑》等知名韓國電影的演技派\n\
  男星趙震雄飾演，平常經常詮釋嚴肅角色的他，在《親密陌生人》裡化身為暖男整形醫生\n，明知老婆有染，卻仍充滿心疼與愛意的表情與眼神，由趙震雄詮釋，內斂且深刻。唯一\n\
  在角色塑造上，讓我有些微詞的是金志秀飾演的女主角。雖然原版裡，該角色就是控制慾\n強、與女兒有溝通隔閡的母親，但韓版裡好像過於艷麗，給人一種難以親近的感覺。義大\n\
  利版裡，較能凸顯個性上的反差，也更能在揭露她外遇時給觀眾驚喜。倒不是說外表較樸\n實的人不會外遇，反而是韓版裡平時不打扮，這場餐敘特別打扮才更讓人從頭開始就興起\n\
  懷疑之心。\n\n\n不過，自己很喜歡《親密陌生人》特別根據亞洲文化所做的一些細節調整，可以看出編劇\n的用心，也更能使這部電影所希望表達的概念傳播給亞洲觀眾。首先，女兒的年紀。在原\n\
  版當中，女兒16歲，還是高中的年紀，但是，韓版裡的女兒20歲，已經大學。同樣描繪母\n親在女兒包包找到保險套的震怒與震驚，搬到較為保守的亞洲社會，提高年齡似乎比較容\n\
  易說服身為父母的觀眾與孩子溝通的重要。再者，片中隱瞞自己同志身分的前體育老師，\n在義大利版裡，只談論到「不見得要結婚」，但《親密陌生人》裡，更深入的談到「人就\n\
  是要結婚生小孩」，符合亞洲社會的婚姻與家庭觀念。另外，不只擁有小三，甚至讓小四\n懷孕的花心男，在韓版當中雖說經常創業失敗，也是位目前擁有一家餐廳的生意人，卻仍\n\
  在爭執時說出「只因為我沒有讀好的大學，你們就處處看不起我。」凸顯出亞洲社會裡對\n於教育出身的重視。反觀原版，花心男的設定雖為計程車司機，但全片並沒有呈現出朋友\n\
  看不起他，或是他對於自身職業的自卑，畢竟是自有車並非純領薪水的上班族。( 並非指\n上班族帶有貶意，只因片中角色職業除家庭主婦與已失業的前教師之外，皆為自己開業\n\
  \ ) 最後，雖然屬於枝微末節，但在義大利版中，眾人週末的聚會為踢足球。考量到足球\n在亞洲並非一般人的休閒娛樂，改為打高爾夫。\n\n\n除了針對文化差異進行微調之外，《親密陌生人》更進一步修改原版中部分留給觀眾自行\n\
  解讀與想像的段落，使得每位角色更加立體。舉例來說，義大利版中，家庭主婦僅是一位\n有著個人特殊喜好 ( 不愛穿內褲 )，並且在網路上追求心靈慰藉的女子。 ( 心靈出軌算\n\
  不算出軌不在討論之列 ) 不過，韓版設定她為一位有在上文學課，富含文藝氣息，出口\n成章，卻會因為自己家庭主婦身分自卑的部落客。當觀眾觀影結束後描述一個角色，能夠\n\
  將其個性與習慣描述地越清楚，則角色就越立體，亦即觀眾能夠想像在電影外的時空中，\n他也有著這短短兩小時內沒看到的生活。而結尾前體育老師離去前向其丈夫補了句回馬槍\n\
  「她部落格裡描寫的24歲年輕小夥子，是當年準備司法考試的你阿，笨蛋。」除了建立連\n他男朋友都是忠實讀者之外，更加深這對夫妻其實彼此都還相愛，甚至先生還願意為老婆\n\
  頂罪，只是一直沒有用對方法重燃過去的感覺。\n\n\n與身為同志的體育老師相關的幾句台詞，雖說可能是翻譯上的差異，但在《親密陌生人\n》中就比較感受不到張力。在他受不了朋友們酸言酸語決定直接講明之後，韓文講的是「\n\
  喜歡男人就是Gay，對嗎」，翻譯寫「喜歡男人就是同志，對嗎？」不清楚單純表達Gay在\n韓文裡是否有貶意，但原版中的用字是「玻璃」，更強調出朋友們不停使用歧視性的字眼\n\
  。( 不懂義大利文，但翻譯上都有特別區別「玻璃」與「同志」，應該有區分禮貌用字與\n否的用意 ) 也因此，為了掩飾自己出軌拜託體育老師與自己換手機的律師，不得已承受\n\
  了朋友這樣的對待後，為體育老師發聲，同樣也是義大利版張力比較足夠，「我只當了兩\n小時的『玻璃』就受不了了，他當然不可能告訴我們他是同志。」以及體育老師離去前說\n\
  \ ( 到底離去前說了多少話 )：「今天出櫃的是你們，不是我。」在《親密陌生人》裡僅\n為「今天你們才是說真話的人。」但是，玩這個遊戲本來就是說真話阿，所以或許是翻譯\n\
  上的差異，但的確是原版在語言上較具張力。\n\n\n另外，有點忘記義大利版關於最後揭露了「一切都只是幻象」後所呈現的片段多寡，只是\n，女兒回家與律師/家庭主婦在這頓敘舊的晚餐過後重拾夫妻間的情趣這兩段似乎是韓版\n\
  特別加入的。雖然真心且語重心長地為女兒分析獻出初夜的優缺點，但做為父親，心裡當\n然還是希望女兒回家的。片尾聽到女兒回家的開門聲，滿足地關燈就寢的男主角真的好可\n\
  愛阿。( 其實你只是喜歡趙震雄吧 ) 重拾夫妻情趣稍顯突兀是因為，雖說《親密陌生人\n》讓律師丈夫終究發現了老婆換髮型這件事，但他們原本感情就不好，再加上罪惡感，觀\n\
  眾從奇妙的月蝕之夜抽離之後，角色們只是回到他們沒有玩「公開手機」遊戲前的互動，\n再怎麼樣他倆應該不會有那樣的互動。除非真的純粹因為稱讚了換髮型，那也達到強調「\n\
  溝通」的重要的目的了。\n\n\n最後，男主角的秘密雖然不是什麼見不得人的事，不過是虧了錢怕老婆擔心，但印象中原\n版當中，男主角除了瞞著太太找心理醫生諮商家庭問題與壓力之外，並沒有任何秘密。可\n\
  以理解韓版的調整或想呈現人非完美，但個人比較喜歡男主角「真的」沒有什麼不能告訴\n在場人的事，就像即使諮商的事情整桌都知道了，他也沒有生氣，就只是一件他覺得不需\n\
  要說，但說了也沒關係的事而已。\n\n\n或許有些人認為片尾想告訴我們的是「有謊言才能完美」，但我認為倘若電影希望我們這\n麼認為，根本就不必放入兩位 ( 甚至三位：體育老師問心無愧，他只是不想自己與愛人\n\
  受傷 ) 問心無愧的角色。雖說要全然沒有秘密是不可能的，但至少不要有「明知故犯」\n與認為不會被發現而說的謊，而那些非故意或無關緊要的謊言，就算有也不要拆穿。重點\n\
  是拆穿！如同男主角，明明早就知道老婆外遇，卻還為了家庭和諧向心理醫生諮詢，因為\n對他來說，「就算他們分開了，至少他嘗試過了。」\n\n\n\n\n\n\n\n\
  \n\n\n--\nViola's World：Screen Scream影迷尖叫屋\n\n請大家多多指教~\n\n--"
