content: '「我們曾經是親密的朋友…」伊莉莎白歐森坦承與克里斯伊凡的友誼變化



  憑藉「緋紅女巫」一角走紅的好萊塢演員伊莉莎白·  歐森一向以敢言誠實見稱，雖然身為

  漫威宇宙中一個十分受歡迎的英雄角色，但是她早前卻直接道：「漫威的魔法對我有點失效

  了

  」。近日她在接受採訪中，再度展現敢言一面，坦承與同僚「美國隊長」克里斯·  伊凡的

  友誼變化！





  伊莉莎白·  歐森日前在測謊環節中被問及與克里斯·  伊凡的友誼，雖然她曾親口指出自己

  和克里斯·  伊凡是十分親密的好友，但是在近日這個環節中卻轉了口風。她指出：「我們

  曾經十分相熟，那個時期我們會經常一起外出。我現在依然十分喜歡他，但是已不再如從前

  般經常一起相約遊玩」然後記者問到：「你不再喜歡與他聚會？」

  伊莉莎白·  歐森立即澄清指：不是！我不是指我不再喜歡與他成為朋友，只是我們在 LA

  居住時關係更親密。他擁有爽朗的笑聲，每當你說笑時，他都能給你非常好的回饋。」



  記者再度逼問：「你現在會否以最好的朋友來形容你們的關係？」她坦承：「不會，但是我

  們曾經是十分親密的朋友。為何現在好像他已經離世般？（笑）我們現在是朋友，只是不再

  像從前般經常相約外出。」




  不少人大讚伊莉莎白·  歐森是一位十分真誠的明星，在許多人都會裝作與同僚保持親密關?

  的好萊塢中，她的真性情彷如一股清泉。









  --'
