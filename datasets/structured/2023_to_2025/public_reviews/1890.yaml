url: https://www.ptt.cc/bbs/movie/M.1650696520.A.F05.html
title: '[新聞] 電影《售命》傅孟柏挑戰親密戲 曾之喬先喝'
content: "電影售命傅孟柏挑戰親密戲 曾之喬先喝薑母鴨壯膽\n  中央社記者王心妤\n\n電影「售命」由新銳導演鄧仲謀編導，金鐘視帝傅孟柏跟女星曾之喬、蔡淑臻都有親密戲\n\
  ，曾之喬透露拍攝前特別喝了碗薑母鴨壯膽。傅孟柏則是為角色心境轉變蓄鬍變「原始人\n」。\n\n「售命」舉辦試映會，傅孟柏片中從普通上班族變成蓄鬍亂髮的原始人狀態，反差令人\n\
  驚訝。鄧仲謀透露當時是先拍攝傅孟柏蓄鬍模樣，沒想到傅孟柏剃鬍演出上班族，反而\n讓導演認不出來，「我還問工作人員，孟柏人呢？」\n\n傅孟柏與曾之喬片中有親密接觸，2人開拍前一起上了表演課，曾之喬需要在蹲馬步的傅\n\
  孟柏身上爬來爬去且不能掉下來。曾之喬笑稱當時近到能聞到對方的味道，比健身還辛苦\n，說是曖昧不如像是軍中同袍在受訓，「所以床戲沒什麼尷尬的。」\n\n蔡淑臻被問到與傅孟柏的親密戲，她表示，「這場戲真的是全天下最難拍，沒想到床戲這\n\
  麼無聊。」幸好傅孟柏給了很多小技巧幫助放鬆，傅孟柏表示，片中動作雖然粗暴，但拍\n攝前反而更需要做準備，要比平常更有禮貌且溫柔些。「售命」將於29日全台上映。\n\
  \n-----\n\n【售命】正式預告  \n\n《返校》傅孟柏 /《聖人大盜》曾之喬 /《噬罪者》蔡淑臻 /《複身犯》李銘忠\n\n\n二十七歲的厭世保險員阿良（傅孟柏\
  \ 飾）一天到晚都在想要怎麼死，生命對他而言只是\n不停重複跳針，直到某天撿到日本文豪三島由紀夫的遺作《性命出售》才想通….就算要\n關門大吉，也應該先來個清倉大拍賣！\n\
  \n可是沒想到這條命在網上竟然乏人問津，就在他心灰意冷之際，阿良得知鄰居陳瑜真（曾\n之喬 飾）的兒子命在旦夕需要心臟移植，正當他猶豫是否捐出心臟時，一位美豔女總裁\n\
  沈晶（蔡淑臻 飾）開出天價要買阿良的命做人體實驗，同時又冒出一位黑道老大派出殺\n手鬼臂（李銘忠 飾）綁架了他父母威脅他賣命。\n\n阿良沒萬萬沒料到他一文不值的生命，現在竟然大家搶著要！但命就一條，阿良要如何全\n\
  身而退呢？\n\n\n\n--"
