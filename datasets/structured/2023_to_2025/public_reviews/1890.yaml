title: '[新聞] 孤僻女星渴望親密接觸　看A片配小熊軟糖'
content: '新聞網址：


  孤僻女星渴望親密接觸　看A片配小熊軟糖「進修」


  榮獲今年柏林影展金熊獎的匈牙利電影《夢鹿情謎》，由女星亞歷珊卓博爾貝伊（

  Alexandra Borbély）飾演具有嚴重社交障礙的女主角，她在片中為了想與曖昧的男主管

  能有更進一步的肢體接觸，創造了獨特的「練習法」，一場她關在家裡看三種不同系列A

  片的戲，A片情節無比露骨，她卻面不改色地嚼著小熊軟糖，事後還冷靜地將練習過程講

  給心理醫生聽，讓醫生頭大無比，衝突感十足的演技讓人印象深刻，精湛的演技讓她問鼎

  歐洲電影獎影后的寶座。


  其實亞歷山德拉私底下性格非常活潑開朗，但卻能將女主角自閉又死板的角色狀態詮釋到

  位。她在片中為打開身體和心理的愛情開關，做了各種超乎常人理解範圍內的嘗試。她站

  在唱片行一口氣試聽了20張情歌專輯、在公園窺視親熱中的情侶、用絨毛娃娃練習身體接

  觸、甚至不惜爆血自殘，大尺度詮釋了渴望愛情卻又手足無措的成長心情。


  為此導演在與攝影師進行討論時，將香港名導王家衛的《花樣年華》列為唯一的電影參考

  指標，希望學習該經典作品中看似風平浪靜、實則波濤洶湧的曖昧張力，導演也對最後細

  膩的拍攝結果感到非常滿意。


  劇情描述左手殘疾的安德烈是匈牙利一家屠宰場的財務總監，過著孤僻的獨身生活，直到

  他遇見了新來的食安檢測員瑪麗亞，逐漸被這位性格比他更乖僻、有著人際交流障礙的女

  孩所吸引。一場突如其來的竊盜案，卻意外讓他們發現彼此的神秘連結：彼此每晚作著同

  樣一個夢，夢中他們化身為一對雄鹿與雌鹿，在冬日的森林裡相戀、漫步。當他們嘗試將

  美好的夢境轉移到現實生活，肉體和言語卻成了阻礙他們的難關。電影今在台上映。 （

  謝宛儒／綜合報導）


  --

  我是男生，只愛男人。我是純真、開朗的0號男同性戀。希望將來能和彼此相愛的男人結婚


  喜歡和不同國籍、類型的帥哥猛男型男交友約會。已記不得、數不清和多少男人交往過了


  --'
