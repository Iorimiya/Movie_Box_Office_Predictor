url: https://www.ptt.cc/bbs/movie/M.1673499966.A.C5F.html
title: '[好雷] 「堅強」成長的割禮：《親密（close）》'
content: "本文為1/8 TITAN搶先場的觀後筆記，有涉及關鍵劇情，建議觀影後再讀。\n\n　　本片將於3/3日全台上映。\n\n\n　　圖文網頁版：\n\
  \n　　\n\n\n　　預告片：\n\n　　\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n\n\n「堅強」成長的割禮：《親密（close）》\n\n\n\n　　與相知相愛相信之人親密的渴望，原無分性別，那就像音樂與風，星光\n\n與夜空。然而，對於男性而言，因為陽剛氣質的要求，即使「同性戀」大多\n\
  \n已被「接受」，但與陰柔相連的行為與需求一旦展現出來，仍然引人側目，\n\n甚至視作異常。於是為了「正常」的認同，就必須將那些渴求，連帶將原有\n\n的情誼消滅。\n\
  \n\n\n　　里歐和雷米是一對親密的友伴，他們會在祕密基地想像士兵入侵的冒險，\n\n一起在花叢間笑著奔跑逃離；他們同床訴說著內心私密的想像與夢，擁抱著\n\n\
  背同眠，一起騎車到校，毋須競爭來證明自己；他們看得到對方身上與眾不\n\n同的色彩，且能彼此分享、欣賞與交融。世界連同月球任由他們旅行，光是\n\n彈跳床就可以摘下星星那樣的自由遼闊。但當這樣的色彩落入視為異常的環\n\
  \n境，有了定義與指名，就變成了必須連同血肉一起扯下的標籤──至少是里\n\n歐的。\n\n\n\n　　袒露脆弱與依戀的親密表現一直被視為女性的、陰柔的特質，女性之間\n\
  \n是習以為常可以隨時表演且毋須尷尬與否決，男性間卻往往直接被認定是跨\n\n越友誼的曖昧，無論他們是否如此認知，自此每當意識到親密與傾慕，便像\n\n袒露了隨時可被攻擊的私密之處，伴隨而來的便是無邊無際的恐懼。就這樣，\n\
  \n一點一點的，隨著時間和同學的嘲笑與側目，他們不再時刻相伴，不再彼此\n\n依偎和接納對方的柔軟，不再同床共寢──為此兩人第一次打架，雷米回到\n\n床上蜷曲，關進了廁所裡，「肚子痛」吃不下早餐──彷彿里歐所迴避的，\n\
  \n對雷米來說成了一個被徹底否決的確認。他的落淚，在里歐眼中卻溢出笑意，\n\n像是從傷害中確認對方的在乎，又或者僅是滿意自己的勝利與正確──過去\n\n的親密成了必須撕去的羞恥，他必須笑才會遺落疼痛，一旦在乎，便會前功\n\
  \n盡棄。\n\n\n\n　　此時里歐加入的冰上曲棍球隊成了令他安心的場域，在那裡即使落後，\n\n過大的裝備會使他更像個男人，而且那裡沒有雷米，即使他仍會注意他的動\n\
  \n向與位置，卻不願意他過來踏入這個屬於自己的鍛鍊場──既知雷米的「痛」\n\n在何處，更不要他來，不要他試，都已經迴避又怎麼可能讓他跨越？那是第\n\n一次，他們分開兩條路各自回家，里歐終於回自己的家睡卻無眠，提早出門\n\
  \n和同學競速──比起並騎也會更像男性。雷米堅持追問為什麼沒有等他，兩\n\n人推擠，落淚，里歐在作戲的同時更無從明白真正的需求與失落因何而起、\n\n從何而來，那場喧鬧是結蛹蛻變的過程，畢竟忍受疼痛的堅強一直是陽剛的\n\
  \n表現。而親密最脆弱之處，就是讓過去隱約可知的痛苦與渴望得到撫慰之後，\n\n再毫無防禦地被撕裂到底；過去毋須遮掩的情感流動，變成只能隱藏甚至銷\n\n毀的祕密。但生活一直沒有界線、也沒有手足可以傾吐的雷米怎麼懂得？善\n\
  \n感勝過應對的心靈又怎麼來得及理解與抵擋？早已預知的里歐不再在花間奔\n\n跑，他回家幫忙撿拾被攆碎的花，徹底和親密割捨，不再需要擔心入侵的士\n\n兵，因為他早已成功穿上盔甲成為他們的一員。\n\
  \n\n\n\n\n\n\n\n\n\n\n\n（以下涉關鍵劇情，請確認後再讀）\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n　　一直到那一天。\n\n\n\n　　那天之後，里歐一點一點的重新適應失去後的生活，持續著打冰球，即\n\n\
  使他一直撞牆、跌倒，但只有這裡，他可以一再得到「再站起來」、「加油」\n\n的鼓勵與認同，以對抗內心的脆弱、悲傷和罪惡感，那些落雪，輕勻緩慢的\n\n落下、堆積、冰封，只能由淚水一點一點的融化，讓問題慢慢冒出來：\n\
  \n\n\n　　「你覺得他有痛苦嗎？」\n\n　　「你真的覺得他很快樂嗎？」\n\n\n\n　　「每個人都有表達自己感受的權利。」\n\n\n\n　　他人即地獄，那個他人包括割捨的、過去的自己。當武裝與盔甲終於能\n\
  \n慢慢卸除，看見雷米保留他曾經塗鴉的畫像，被大雨淋濕、在冰場上冷得發\n\n抖的里歐只能不斷逃離與獨自面對，即使媽媽都試圖給他擁抱；他也去朋友\n\n家玩，卻發現不僅親密不可再現，連脆弱都無法託付──接著他在比賽中受\n\
  \n了傷，斷了手。\n\n\n\n　　學期結束，沒有冰球場和教室可以逃避，里歐終究必須面對自己的失去，\n\n直到他終於能開口，當他下車衝進森林裡，出乎預料的是他已熟習要用木棒\n\
  \n去防禦自己、和雷米母親的崩潰──然後得到兩人最需要的擁抱。\n\n\n\n\n\n　　再怎樣的傷口終會痊癒，斷了的手會再接起，人會學習成長和往前看。\n\n\
  里歐在牆上看著自己的倒影隨著光的移動消隱，在自己親手協助種下的花叢\n\n裡獨自奔跑，回過頭去看著無人跟隨相伴的空曠。他會持續前進，會逐漸長\n\n成他想要的、「男性」的、「陽剛」的樣子。而被他割捨的、親密（close）\n\
  \n裡包含的一切，會隨著時光永久遺落（lose）──沒有了風，音樂不再響起；\n\n失去了星光，黑暗仍會持續。那或許是絕大部分男性，或者為了「堅強」與\n\n\
  「正常」而決定接受的，必須有的「割禮」。\n\n\n\n　　「堅強不一定能忍住眼淚，還要解釋我為什麼哭。」\n\n\n\n　　畢竟理解和解釋自身情感的過程都太娘了，不是嗎？蜥蜴成功地蛻去那\n\
  \n層有著特殊色彩的皮，在環境的大力協助下，將會長成一個堅強的「男人」，\n\n至於過往的依偎是否還能再現，則得看他將雷米的靈魂擁抱多少、多久，以\n\n及多遠──畢竟那曾是發自內心的需求與思念、幾無界線的親密。\n\
  \n\n\n　　也是他曾將最單純的愛、友誼、傾慕與脆弱全然託付的自己。\n　　\n\n\n\n\n註：割禮在許多非洲和澳洲原住民部落的傳統中，被視為成年禮的一部份。\n\
  \n有一些非洲西部的民族如多貢族、多瓦悠族（在喀麥隆北部）相信萬物皆有\n\n靈，並且認為割包皮有如自男性身上去除「女性」的面向，使男孩變成真正\n\n的男子漢。\n\
  \n\n\n　　寫的時候本覺過程如同過去女性陰蒂的割禮，卻意外在維基查到這段不\n\n謀而合的解釋，以為記。\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n--\n一隻鳥飛過去了，天空還在。就是這樣。\n我懷疑，但，就是這樣了。\n有時候，眼睛只肯告訴我這麼多。\n\n\
  \                                  陳斐雯  貓蚤札（其三）\n\n--"
