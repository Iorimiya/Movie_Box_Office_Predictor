url: https://www.ptt.cc/bbs/movie/M.1541080119.A.13C.html
title: '[新聞] <親密陌生人>奪韓首日票房冠軍，台明上映'
content: '新聞網址：



  今年下半年最火熱的話題韓片《親密陌生人》，不僅在南韓的預售率奪冠，昨日（10/31）正式在南韓上映，更一如預期，擊敗蟬聯多日冠軍的古裝活屍電影，空降首日票房冠軍。本片以絕佳的好評口碑持續打破紀錄，並吸引眾多演藝圈當紅藝人以實際行動集氣為電影應援。本片主要演員聽聞台灣也將緊跟南韓檔期，在明日（11/2）盛大上映，更在忙碌的宣傳期中，主動為台灣影迷錄製影像留言（），李瑞鎮在影像中保證電影「有著無法預測、超乎想像、不可思議、捧腹大笑的內容。」趙震雄更相約「大家電影院見！」值得一提的是，在全片ꐊC位當紅演技派的主要演員之外，片中的「隱藏版演員」更是大有來頭，集結李順載、羅美蘭、曹政奭等人獻「聲」演出，主要演員事後得知，更驚訝原來自己是在跟他們對話。




  《親密陌生人》描述三對看似完美的情侶，以及另一位單身漢友人，在一場喬遷聚會中玩起「公開手機」遊戲，不料此舉卻讓眾人深藏內心的秘密紛紛曝光，更讓他們的關係面臨崩解。全片在爆笑之餘，蘊含真實到讓人頭皮發麻的愛情、友情、夫妻關係、父母與子女養育議題；尤其當手機內容曝光時，那不可預測的驚人笑料更是擄獲全世代觀眾共鳴。尤其本片在南韓正式上映前，就搶先在首爾、大田、光州、大邱、釜山等五個城市舉辦試映會，創下近90%的滿意度，以及89%的推薦度，就連李多熙、徐令姬

  、鄭多彬、朴素丹、高雅羅、李政宰、鄭雨盛等南韓演藝圈當紅影星，也都在觀賞完後貼出應援照，鼓勵觀眾進戲院觀賞這部別具話題的愛情驚悚片。



  挾帶火熱話題與討論，本片也在上映前持續穩坐預售率冠軍寶座，並在樂天、CGV等連鎖影城，以及Interpark、yes24、naver、daum等預售網站上大放異彩。根據南韓電影振興委員會資料統計，本片不負眾望，在昨日上映首日就空降首日冠軍寶座，首日並吸引超過27萬觀眾入場搶看，業界也預估本片將順利榮登首週票房冠軍。令人振奮的是，本片七位主要演員聽聞台灣即將上映，也特別抽空錄製影像留言問候台灣觀眾（），更大方在官方場刊中簽上自己的名字，準備送給台灣影迷，欲知如何獲得演員親筆簽名場刊，請留意台灣片商的臉書粉絲

  團（）。





  《親密陌生人》不只影像中看到的主要演員，就連打電話過來的「聲音演員」也大有來頭！有「國民爺爺」之稱的李順載，在片中獻聲詮釋尹卿鎬的父親，以及?海真、趙震雄、?瑞?的高中老師。聽到李順載在電話另一頭，用嚴肅的聲音對弟子們感到驕傲和不滿，聲音演技震撼全場。女演員羅美蘭則在片中詮釋廉晶雅的文學班友人，用聲音傳遞不可告人的八卦，嚇得廉晶雅冷汗直流，甚至不小心鬧出「水洗手機」的搞笑場面。至於人氣男星曹政奭則用聲音詮釋松?昀的前男友，用聲音完美表現前男友的悶聲悶氣，讓觀眾聽得爆笑不已。據悉，本片七位主要演員，在拍攝時也不

  知道那是曹政奭的聲音，以至於後來身份曝光當下，眾人都為之驚嚇不已！



  這部空降南韓首日票房冠軍的愛情驚悚新片《親密陌生人》，台灣也將貼近南韓檔期，於明日（11/2）日正式上映。超值預售票現正熱賣中，請上「博客來售票網」選購（）。本片劇情描述七位相識多年的好友與夫妻檔，相約在月蝕之夜共進晚餐，就當相談甚歡、觥籌交錯之時，其中一人提議來玩「公開手機」遊戲──若對感情問心無愧，就把手機內容不論簡訊、來電或各種可能會出現的訊息給公開。這場引爆超越「真心話大冒險」的危險遊戲，引爆眾人不為人知的驚人秘辛，也讓他們的愛情與友情面臨嚴峻考驗…

  。



  欲知本片最新消息，

  請上電影官方部落格

  與臉書粉絲團查詢。



  --'
