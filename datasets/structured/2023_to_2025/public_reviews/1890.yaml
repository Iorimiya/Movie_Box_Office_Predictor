url: https://www.ptt.cc/bbs/movie/M.1720406479.A.DDA.html
title: 'Re: [新聞] 女星拍性侵戲想請「親密指導」　男導演'
content: '台灣現在是有親密指導的，

  其實不妨把影視跟劇場等有關表演的創作本質想成是「溝通」，

  當「性」是為一個作品當中不可或缺的情境時，

  導演如何很好地跟演員說明他所想要呈現出來的畫面還有質地，

  當然也不只是性，每一段情節的演繹，演員、技術人員都可能提出質疑或想法，

  導演最終得要做出選擇，並透過各種手段進行溝通，統一劇組的風格、走向等。


  而「性」就是在所有情境當中有著相對高溝通成本以及難度的，

  畢竟在其中牽涉到性別差異、個人價值觀、身體界線等種種複雜曖昧的人性本質，

  當然，還有懷抱私心以藝術之名行性剝削之實的那些惡德導演跟演員們，

  因此在面對種種不同的情況，親密指導就有其存在必要性，

  保護演員的身心同時，也能夠協助導演完成其藝術理念，

  將性場面的設計視作有如一段舞蹈、一段武打編排的話就很容易理解了。


  --'
