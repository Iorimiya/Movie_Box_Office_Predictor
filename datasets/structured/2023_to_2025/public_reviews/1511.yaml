  三日（9/8-9/10）於高雄上映之影城觀賞《我和我的賽車老爸》，均享有160元的超值優

  惠票價，請高雄鄉親務必把握超值優惠期間進場觀影！





  《我和我的賽車老爸》以拉力賽包裹動人情感，描繪摩擦不斷的陌生父子，在遇到失意天

  才賽車手後，關係逐漸緊密、相互救贖的故事。本片由高雄市政府「高雄人」出品，全片

  有超過百分之七十的場景位在高雄，包括果貿社區、85大樓、瑞豐夜市、高雄港十號碼頭

  、中正技擊館天橋、南成國小、高雄TKS賽車場、乙順車廠、四維國宅、高雄三多商圈公

  寓等地皆有取景拍攝。尤其本片日前舉辦搶看會，不少觀眾在觀賞之後，都紛紛表示：「

  讓人想去高雄一趟！」「高雄好美！」「把高雄的景色拍得很棒！」



  導演也在昨晚（9/5）率領三位主演温昇豪、陳澤耀、陳少卉，以及演唱動人主題曲〈南

  風〉的許富凱「回老家」舉辦高雄首映會；現場集結近700位觀眾，高雄市文化局副局長

  簡美玲更到場支持。導演也在首映會上驚喜宣佈，特別為高雄市民獻上專屬「愛高雄160

  元票價優惠」，只要於電影上映首三日（9/8-9/10）於高雄上映之影城觀賞《我和我的賽

  車老爸》，均享有160元的超值優惠票價！導演進一步表示：「我是高雄囡仔，很高興有

  機會能把家鄉呈現在高雄的民眾面前。本片是台灣下半年少見的普遍級台灣劇情電影，希

  望大家能攜家帶眷進戲院支持這部電影。」他也期待觀眾們能透過本片，感受到拉力賽的

  熱血、親情的感動，以及高雄的美麗。也讓在場觀眾一聽到這消息，甚至在座位上發出驚

  呼：「也太划算了，簡直買一送一！」





  《我和我的賽車老爸》與高雄的緣分不只有拍攝地，從導演張書瑋、主演温昇豪、特別演

  出邵雨薇，以及主題曲演唱人許富凱都是高雄人！昨晚因為首映會再度回老家的温昇豪，

  為了接地氣還大秀台語，分享：「我也是高雄出生的高雄囡仔，能在這邊拍戲真的很高興

  ，天氣很好，又能看見熟悉的地方，我想也許高雄人們可以在本片當中找到居住的一角。

  」來自馬來西亞的陳澤耀也特別用台語跟大家打招呼，談到當初因為拍攝而長居高雄的日

  子，他開心說道：「在高雄拍攝時特別難忘，每天去吃早餐時，阿姨都叫我帥哥，讓我覺

  得自己好像真的很帥，也完全感受到高雄人的熱情。」童星陳少卉也對高雄鄉親的熱情印

  象深刻，尤其昨日的首映會休息室，現場就有熱情廠商準備白糖粿、雞排、珍珠奶茶餵飽

  劇組所有人，讓他也吃得不亦樂乎，此外更在首映會上透露自己對高雄的食物回味無窮：

  「高雄的食物真的很好吃！尤其蛋餅跟燒餅實在很讚！」同時還再三向觀眾呼籲：「電影

  破億就靠你們了！」此外，為本片獻唱感人主題曲〈南風〉的許富凱，也回到家鄉跟親朋

  好友同樂，甚至在首映會上清唱〈南風〉滿足影迷。已經看過電影的他也真情分享：「非

  常好看，高雄的美都在裡面，有優秀的演員，還有我感動的歌聲，請大家看完後一定要『

  一人揪十人』進戲院支持。」首映會現場還遇到同為高雄旗山出生的觀眾，讓許富凱笑讚

  ：「旗山出帥哥啦！」



  這部台灣影史首部結合拉力賽、親情、友情、勵志的電影《我和我的賽車老爸》，即將於

  本週五（9/8）全台溫馨獻映。電影預售票熱賣當中，單人票230元、雙人票450元，可至

  ibon官網與全台7-11門市ibon機台選購，只販售到本週四（9/7）晚間23:59截止，請觀眾

  把握購買最後機會。本片劇情描述年幼的周宇冬（陳少卉飾演）因母親驟逝，被迫交給素

  未謀面的爸爸周大隆（温昇豪飾演）撫養。大隆在宇冬出生前便與妻子離異，又因受傷僅

  靠保全工作浮沉度日。如今意外扛起父職，父子自然摩擦不斷，直到放棄賽車的天才車手

  阿駿（陳澤耀飾演），某日因緣際會闖入了兩人的世界，反而成為彼此溝通的橋樑，讓這

  對父子逐漸找回屬於彼此的溫暖。不過阿駿也有自己不願面對的過去，他懷抱罪惡感所躲

  避的一切，反而給了他必須重返賽道的力量。而大隆為了回應宇冬的期待並證明自己，也

  毅然決定跟阿駿共同搭檔挑戰拉力賽，再為自己的人生勇敢一回…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
