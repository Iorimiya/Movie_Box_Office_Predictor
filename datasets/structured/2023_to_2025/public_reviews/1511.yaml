url: https://www.ptt.cc/bbs/movie/M.1687861134.A.19B.html
title: '[新聞] 【我和我的賽車老爸】曝預告，温昇豪淚崩'
content: '新聞網址：



  由温昇豪、陳澤耀、陳少卉領銜主演，將為今年秋天全台戲院注入陣陣暖流的親情勵志電

  影《我和我的賽車老爸》，即將在9月8日於全台盛大上映。製作團隊在上週公開前導海報

  之後，引發全台網友熱議，紛紛留言表示：「難得又有想看大銀幕的國片了！」「終於等

  到了，期待！」「好讚！」這也讓劇組乘勝追擊，在今日（6/27）繼續公開備受期待的首

  支前導預告！在前導預告當中，可以看到更多温昇豪與陳少卉的父子親情互動。尤其兩人

  戲份吃重，絕大部分場面都是一起拍攝，這也讓温昇豪父愛爆棚，回憶起跟陳少卉的合作

  ，極力稱讚他：「長得很可愛，很有靈性！」陳少卉也感謝回應：「有幾場情緒較重跟拉

  扯的戲，昇豪爸爸都會很親切地教導我和如何保護自己。」






  由新銳導演張書瑋執導，兩屆金鐘獎最佳編劇得主溫郁芳執筆劇本的感人之作《我和我的

  賽車老爸》，故事描述一位因意外導致跛腳，還把生活過得一團糟，卻在某天得知自己有

  個兒子的魯蛇老爸（温昇豪飾演），跟他突如其來的陌生兒子（陳少卉飾演）之間的親情

  互動，同時還鋪陳出年輕車手（陳澤耀飾演）在人生路上跌跌撞撞之後，一段關於親情、

  友情、勵志和自我救贖的故事，並透過「拉力賽」這個新穎題材，成為近年國片的少見類

  型。



  在今天公開的前導預告當中，一開始就看見一位賽車手，站在冉冉升起的鐵捲門前的背影

  ，一瞬間便吸引了人們的視線，再搭配「今年最勵志催淚的台灣電影」標語，讓期待度立

  刻衝上最高點。尤其看到宛如人生失敗組，某天還必須擔負起父親責任的男主角「周大隆

  」，在港口對兒子哭喊說：「我承認我一開始不知道怎麼跟你相處嘛」的場面，以及父子

  間一連串冷戰、爭吵的緊張互動，也體會到這段重新展開的父子關係實在不簡單；再延伸

  到父子關係看似逐漸破冰，到最後一幕的賽車場面，將為這對父子帶來什麼樣的人生轉折

  ，更是讓人目不轉睛，引發強烈好奇心。





  《我和我的賽車老爸》前導預告中的許多場面，都讓男主角温昇豪點滴在心。尤其預告中

  他哭喪著臉，對陳少卉大喊：「我承認我一開始不知道怎麼跟你相處嘛」這一幕，讓他尤

  其印象深刻：「在港口的那場哭戲，當時風很大，海風一直吹著，再加上有優美的海景，

  讓我印象蠻深刻。」不僅如此，他跟「天才童星」陳少卉也有大量對手戲。面對全片眾多

  資深演員，陳少卉的表演也毫不扭捏，大方得宜，深獲劇組讚賞，也讓温昇豪回憶起跟陳

  少卉的演出，父愛爆棚地力讚他：「長得很可愛，很有靈性！」陳少卉也感謝地表示：「

  戲裡有幾場情緒較重跟拉扯的戲，昇豪爸爸都會很親切地教導我和如何保護自己。」




  這部台灣影史首部結合拉力賽、親情、友情、勵志的電影《我和我的賽車老爸》，不僅將

  在台北電影節世界首映，更獲選馬來西亞國際電影節閉幕片，之後也將在9月8日於全台盛

  大上映。本片劇情描述年幼的周宇冬（陳少卉飾演）因母親驟逝，被迫交給素未謀面的爸

  爸周大隆（温昇豪飾演）撫養。大隆在宇冬出生前便與妻子離異，又因受傷僅靠保全工作

  浮沉度日。如今意外扛起父職，父子自然摩擦不斷，直到放棄賽車的天才車手阿駿（陳澤

  耀飾演），某日因緣際會闖入了兩人的世界，反而成為彼此溝通的橋樑，讓這對父子逐漸

  找回屬於彼此的溫暖。不過阿駿也有自己不願面對的過去，他懷抱罪惡感所躲避的一切，

  反而給了他必須重返賽道的力量。而大隆為了回應宇冬的期待並證明自己，也毅然決定跟

  阿駿共同搭檔挑戰拉力賽，再為自己的人生勇敢一回…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
