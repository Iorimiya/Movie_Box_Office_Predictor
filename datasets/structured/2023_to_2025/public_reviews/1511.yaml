title: '[新聞] 【我和我的賽車老爸】10種拍攝現場全公開'
content: '新聞網址：




  台灣影史首部結合拉力賽、親情、友情、勵志的電影《我和我的賽車老爸》，現正在台感

  動獻映當中。在觀眾們的熱情響應之下，劇組今日（9/21）公開十張充滿輕鬆歡樂與熱情

  認真的拍攝花絮照，光是透過圖片，就得以感受製作團隊滿滿的真心，吸引了人們的視線

  。不僅如此，電影即將邁入上映第三週，據悉已經有忠實觀眾「10+刷」，更有不少網友

  討論片中膾炙人口的經典場面與台詞，讓人感動無比之餘，更刺激想要再次進場觀賞的慾

  望。





  以感動、歡笑、刺激與淚水，為今秋電影院帶來陣陣暖流的電影《我和我的賽車老爸》，

  在觀眾們的熱情響應之下，劇組今日公開十張充滿認真與歡樂氛圍的拍攝現場花絮照，光

  看圖片就能感受到劇組滿滿的真心與誠意。首先，導演張書瑋在拍攝車廠戲時，與演員陳

  澤耀、劉育仁、田士廣等人，認真盯著小螢幕確認演技與拍攝效果，積極溝通就是為了讓

  場面更盡善盡美。同時也看到童星陳少卉跟工作人員確認劇本與台詞，並練習如何將台詞

  念得更清楚而不含糊。當然在緊張的拍攝過程當中，也不乏團隊們樂在其中的片刻。只見

  對任何事物都感到好奇的陳少卉，戴起攝影指導的監聽耳機，變身成「小小攝影師」，他

  對此表示：「覺得攝影機很酷，所以當下我就拍了攝影師的背，問他能不能讓我碰碰看，

  攝影師也說可以教我：『讓我當下覺得自己都可以當攝影師了！』」而在片中飾演陳少卉

  長大後的李玉璽，也透過花絮照實現了角色穿戲服時，寶貴的「穿越時空同框照」；只見

  兩人站在一起時的神似眼神，讓劇組人員大讚是「神選角」。事實上，劇組在製作後期，

  添加了小男主角長大後的情節，因此選定李玉璽、涂善存、潘君侖、林家佑四位新生代男

  神特別演出。只見四人在修車廠精彩對戲之餘，更不放過跟賽車合照的機會，因此留下了

  寶貴的「賽車男神」合照，讓人眼睛為之一亮。



  接著，本片歷經33天的密集拍攝，其中也橫跨兩位男主角温昇豪與陳澤耀的生日。演員們

  趁拍片空檔替兩人驚喜慶生，留下充滿溫馨感的合照。其中，在左營拍攝地幫温昇豪慶生

  時，其實當天並沒有孫綻的戲份，但因為孫綻的家就住左營，所以他特地來探班慶生；眾

  人甚至還在慶生完後，一起去外面的籃球場打球。有趣的是，孫綻這次在片中飾演陳澤耀

  的賽車搭檔，兩人征戰過無數拉力賽事，並奪得多次冠軍。在幕後照當中，更可以看到孫

  綻在演繹獲獎當下，雀躍地抱住陳澤耀並親吻他臉頰的畫面。當孫綻回憶當下場面時，透

  露這其實是他額外加戲，兩人在私下排演時被捕捉的畫面：「這真的很有愛啊！」而一旁

  的陳澤耀則開玩笑說：「看來我要來發#MeToo囉！」另一方面，飾演陳澤耀賽車勁敵的劉

  育仁，兩人在戲裡水火不容，卻因為戲外拍賽車場面時，必須穿著非常悶熱的賽車防火服

  ，讓兩人在下戲後「盡釋前嫌」，上演「交杯甜筒」互舔彼此的冰淇淋，展現與片中截然

  不同的好交情。也由於片中有多場精彩刺激的賽車場面，只見温昇豪、陳澤耀、陳少卉與

  特別演出的邵雨薇，也把握機會跟賽車合影。讓這批捕捉到輕鬆與認真工作瞬間的照片，

  深深吸引了人們的視線。





  值得一提的是，《我和我的賽車老爸》上映即將邁入第三週，已經有不少觀賞過的網友，

  開始討論片中膾炙人口的經典場面與台詞。根據劇組對觀眾所做的問卷調查結果，也在今

  日公開「三大經典場面」，以及「三大經典台詞」。經典場面包括「主角父子的碼頭哭戲

  」、「拉力賽的刺激比賽過程」，以及溫昇豪與陳少卉在片中的「小被被爭執事件」。此

  外，「我是你爸爸，我不會不要你。」「孩子都是看著父母的背影長大的。」「如果現在

  不做，我一定會後悔。」三句經典台詞也讓觀眾津津樂道，讓人深受感動之餘，更刺激想

  要再度進戲院觀賞的慾望。



  這部集結温昇豪、陳澤耀、陳少卉領銜主演；邵雨薇、李玉璽、涂善存特別演出；檢場、

  于子育、劉育仁、田士廣、孫綻、潘君侖、林家佑等老將新秀聯合演出，台灣影史首部結

  合拉力賽、親情、友情、勵志的電影《我和我的賽車老爸》，現正在台感動熱映當中。本

  片劇情描述年幼的周宇冬（陳少卉飾演）因母親驟逝，被迫交給素未謀面的爸爸周大隆（

  温昇豪飾演）撫養。大隆在宇冬出生前便與妻子離異，又因受傷僅靠保全工作浮沉度日。

  如今意外扛起父職，父子自然摩擦不斷，直到放棄賽車的天才車手阿駿（陳澤耀飾演），

  某日因緣際會闖入了兩人的世界，反而成為彼此溝通的橋樑，讓這對父子逐漸找回屬於彼

  此的溫暖。不過阿駿也有自己不願面對的過去，他懷抱罪惡感所躲避的一切，反而給了他

  必須重返賽道的力量。而大隆為了回應宇冬的期待並證明自己，也毅然決定跟阿駿共同搭

  檔挑戰拉力賽，再為自己的人生勇敢一回…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
