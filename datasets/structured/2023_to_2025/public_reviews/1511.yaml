url: https://www.ptt.cc/bbs/movie/M.1687262383.A.FD2.html
title: '[新聞] 【我和我的賽車老爸】9/8上映，海報公開'
content: '新聞網址：




  由温昇豪、陳澤耀、陳少卉領銜主演，邵雨薇特別演出，台灣影史首部結合拉力賽、親情

  、友情、勵志的電影《我和我的賽車老爸》，今日（6/20）正式定檔9月8日於全台盛大上

  映。製作團隊也同步公開本片的前導海報暨國際版海報，搭配海報標語「幸福不遠，只要

  你在我身邊」，不僅吸引人們視線，更讓人拭目以待片中這對不期而遇的父子檔，究竟會

  隱藏什麼樣的感人故事。





  由新銳導演張書瑋執導，兩屆金鐘獎最佳編劇得主溫郁芳執筆劇本的感人之作《我和我的

  賽車老爸》，透過「拉力賽」這個新穎題材，鋪陳出一段關於親情、友情、勵志和自我救

  贖的故事，也是近年國片少見類型。全片集結温昇豪、陳澤耀、陳少卉、邵雨薇等人共同

  演出，感動人心的劇情也將在今年秋天為電影院帶來笑中帶淚的陣陣暖流，預計將再度掀

  起國片票房熱潮。



  在今天公開的「前導海報」當中，但見温昇豪、陳少卉這對原本素未謀面，後來卻必須相

  會的父子檔背影，陳少卉手中握著玩具汽車，抬頭望向温昇豪；而温昇豪則捧著陳少卉的

  頭，關愛地望著他，親情感爆棚；輔以多台賽車停在外面的背景，一下子就吸引人們視線

  ，再搭配「幸福不遠，只要你在我身邊」這句海報標語，也讓人好奇這對父子，究竟要如

  何從相互摩擦的父子關係，逐步進展到找回屬於彼此的溫暖，而兩人究竟又有著什麼樣的

  隱藏故事。



  此外，本片除了入選台北電影節世界首映，更獲選第六屆馬來西亞國際電影節閉幕片暨國

  際首映。製作團隊今天也同時公開「國際版海報」，除了放上兩個影展的圖案，更搭配「

  相信不可能（Believe the Impossible）」的熱血標語，一如片中的「拉力賽」，追求的

  就是完賽精神，不論賽事過程遇到什麼樣的突發狀況，就要堅持超越終點線！這也同時比

  喻著男主角「周大隆」與命運的拉力交戰一樣，不到終點，決不輕言放棄！製作團隊也期

  望透過這款國際版海報，展現從台灣出發，逐步邁向國際的決心。



  這部台灣影史首部結合拉力賽、親情、友情、勵志的電影《我和我的賽車老爸》，即將在

  9月8日於全台盛大上映。本片在馬來西亞國際電影節之前，也將搶先在台北電影節進行世

  界首映，首映會門票目前正在「OPENTIX兩廳院文化生活」平台熱銷當中（

  ），請務必把握搶票良機。本片

  劇情描述年幼的周宇冬（陳少卉飾演）因母親驟逝，被迫交給素未謀面的爸爸周大隆（温

  昇豪飾演）撫養。大隆在宇冬出生前便與妻子離異，又因受傷僅靠保全工作浮沉度日。如

  今意外扛起父職，父子自然摩擦不斷，直到放棄賽車的天才車手阿駿（陳澤耀飾演），某

  日因緣際會闖入了兩人的世界，反而成為彼此溝通的橋樑，讓這對父子逐漸找回屬於彼此

  的溫暖。不過阿駿也有自己不願面對的過去，他懷抱罪惡感所躲避的一切，反而給了他必

  須重返賽道的力量。而大隆為了回應宇冬的期待並證明自己，也毅然決定跟阿駿共同搭檔

  挑戰拉力賽，再為自己的人生勇敢一回…。



