url: https://www.ptt.cc/bbs/movie/M.1694109211.A.1AB.html
title: '[新聞] <我和我的賽車老爸>温昇豪、陳少卉大打出'
content: '新聞網址：



  由新銳導演張書瑋執導，台灣影史首部結合拉力賽、親情、友情、勵志的電影《我和我的

  賽車老爸》，即將在明日（9/8）於全台感動獻映。本片透過拉力賽包裹動人親情，在今

  日（9/7）公開的「父子篇」幕後花絮當中（），曝光由

  温昇豪與陳少卉飾演的陌生父子檔，兩人因為母親的離世而首度相會，卻在相處過程中數

  度爆發爭執與拉扯，展現剪不斷理還亂的親情羈絆。温昇豪透過傳統東方父權社會的思想

  去剖析角色，並表示觀眾可以很容易在角色中找到投射與共鳴。尤其已為人父的他更直言

  ：「當爸爸肯定比當演員還要難。」有趣的是，當劇組提問陳少卉面對温昇豪與陳澤耀的

  角色，如果掉下海裡面要救誰時，他也童言童語妙答：「應該是他們先救我。」不僅如此

  ，適逢本片即將上映，在觀眾們的熱烈期待下，出品人、監製暨三位主要演員也將在上映

  首週末的9月9日（週六）和10日（週日），在台北、高雄兩地進行近20場的戲院問候，請

  密切留意官方社群公告，並提早購票與影人近距離會面。





  在今日公開的《我和我的賽車老爸》幕後花絮「父子篇」當中，一開始就爆發温昇豪、陳

  少卉激烈的父子爭吵場面；爭執不休之下，更讓陳少卉對温昇豪怒喊：「我討厭你！」讓

  火爆的氣氛飆升至最高點。導演張書瑋表示：「這部電影就是在講父子兩人，透過相處與

  衝突，慢慢成為一家人的故事。這是一個平凡簡單的家庭故事，希望藉此傳達只要認真去

  對待、去感受，我們都可以成為一家人。」雖然温昇豪在片中對陳少卉嚴厲以待，但他也

  有感而發：「傳統東方父權社會的思想，讓男生不能輕易地哭，男生就是要用打罵表示愛

  你，直到最後我也不說我愛你，但是從肢體與眼神上面，就可以看到他們兩人愈來愈近。

  」雖然温昇豪在片中宛如嚴父，但陳少卉透露他私下反而不兇，只不過一場在家中的爭執

  戲，讓他印象非常深刻：「他把我推在床邊，我覺得自己好像飛了起來。」而温昇豪也剖

  析自己的角色：「我想這角色就是個大男孩，我覺得對男人、對冬冬這個小男孩來說，都

  是一個成長蛻變的開始。父子之間從不認同、排斥，一直到認同跟無法分割，我想這就是

  一般人會面臨的過程，我覺得觀眾應該很容易在角色裡面找到投射與共鳴。」



  尤其現實生活已為人父的温昇豪，被問到當演員還是當爸爸比較難時，他則回應：「肯定

  是當爸爸比較難。」並進一步解釋：「演員只是一份工作，是讓你可以餬口飯吃，可以安

  身立命的工作，但爸爸不是工作，而是責任，是一輩子的。」而在花絮最後，劇組也對陳

  少卉進行「終極二選一」，提問如果片中温昇豪與陳澤耀的角色，兩個人都掉下海裡面，

  只能救一個會救誰？只見陳少卉遲疑了一下，童言童語地妙答：「應該不是我救他們，應

  該是他們先救我。」回應讓人為之莞爾。





  《我和我的賽車老爸》從正式上映前的多場試映會開始，便以演員之間的化學效應、笑容

  、淚水與感動屢獲好評。在觀眾們的熱烈支持與期待下，出品人、監製暨三位主要演員，

  也確定將在上映首週末的9月9日（週六）和10日（週日），在台北、高雄兩地進行戲院問

  候。首先，監製王禮霖、導演張書瑋、主演温昇豪將在9日前往台北的信義威秀影城、

  MUVIE CINEMAS跟觀眾見面；同日，出品人張煒珍、主演陳澤耀、陳少卉也將南下高雄，

  依序前往喜樂時代影城高雄總圖店、大遠百威秀影城、夢時代秀泰影城、環球影城與觀眾

  見面。隔天（9/10），出品人張煒珍、監製王禮霖、導演張書瑋、主演陳澤耀、陳少卉則

  將共同在高雄合體，陸續前往岡山秀泰影城、夢時代秀泰影城、大遠百威秀影城、環球影

  城、喜樂時代影城高雄總圖店跟觀眾見面。影人們將在週末進行近20場的戲院問候，請密

  切留意官方社群公告，並提早購票與影人近距離會面。



  值得一提的是，《我和我的賽車老爸》這回也與飲料品牌「TEA''S原味」進行聯名飲品活

  動。只要在9月8日（五）至10月8日（日）聯名期間，到「TEA''S原味」全台任一門市，購

  買《我和我的賽車老爸》電影聯名飲品「芭芭梅子、芭芭愛玉檸、芭芭蜂蜜綠」任一杯，

  憑任一戲院《我和我的賽車老爸》電影票根，即可享5元折價，一杯限折一張，請影迷把

  握好康優惠活動。



  這部集結温昇豪、陳澤耀、陳少卉領銜主演；邵雨薇、李玉璽、涂善存特別演出；檢場、

  于子育、劉育仁、田士廣、孫綻、潘君侖、林家佑等老將新秀聯合演出，台灣影史首部結

  合拉力賽、親情、友情、勵志的電影《我和我的賽車老爸》，即將在明日（9/8）於全台

  感動獻映。本片劇情描述年幼的周宇冬（陳少卉飾演）因母親驟逝，被迫交給素未謀面的

  爸爸周大隆（温昇豪飾演）撫養。大隆在宇冬出生前便與妻子離異，又因受傷僅靠保全工

  作浮沉度日。如今意外扛起父職，父子自然摩擦不斷，直到放棄賽車的天才車手阿駿（陳

  澤耀飾演），某日因緣際會闖入了兩人的世界，反而成為彼此溝通的橋樑，讓這對父子逐

  漸找回屬於彼此的溫暖。不過阿駿也有自己不願面對的過去，他懷抱罪惡感所躲避的一切

  ，反而給了他必須重返賽道的力量。而大隆為了回應宇冬的期待並證明自己，也毅然決定

  跟阿駿共同搭檔挑戰拉力賽，再為自己的人生勇敢一回…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
