title: '[普雷] 我和我的賽車老爸'
content: '昨天把電影看完了

  劇情架構簡單，後面的發展也蠻好猜測


  但我印象比較深刻的是

  那個演兒子的演員陳少卉

  其中有幾幕有被他的演技驚艷到

  像是跟他爸起衝突之後，那個怒瞪他爸的眼神很強


  還有那場比賽後，痛哭的片段

  可以感受得到他的真摯和難過

  應該蠻能夠引起觀眾共鳴的

  期待未來可以看到他在演員這條路上繼續發展


  --'
