title: '[新聞] 陳澤耀【我和我的賽車老爸】變身天才車手'
content: '新聞網址：



  台灣影史首部結合拉力賽、親情、友情、勵志的電影《我和我的賽車老爸》，預計將在今

  年秋天於全台盛大上映。本片除了由温昇豪領銜主演，更邀請到曾演出《分貝人生》、《

  迷失安狄》等片的馬來西亞男星陳澤耀，詮釋擁有悲傷過去的天才賽車手「阿駿」。本身

  就有參加飄移甩尾比賽，還曾在甩尾賽拿下第三名佳績的他，這回首度接觸拉力賽車，不

  僅親自上陣演繹多場賽車場面，更為了營救素昧平生卻遭受欺負的主角「冬冬」，因此跟

  惡霸拳腳相向，讓他成為全片的「動作擔當」。對於有機會參與演出，陳澤耀感性表示：

  「我是幸運的，在拍電影的路上，能參演自己熱愛的賽車題材，這是難得可貴的。」而距

  離主要拍攝已經殺青兩年，更是讓他意猶未盡：「或許因為拍攝這部電影讓人印象深刻，

  又或許因為整個拍攝氛圍和團隊太棒了，讓我殺青以後，都還忘不了這一切。」





  身兼演員、歌手、賽車手等身份的馬來西亞男星陳澤耀，過去曾演出《高校鐵金剛》、《

  逆風18》、《我和我的兄弟‧恩》等電視劇，並以《我和我的兄弟‧恩》入圍金視獎最佳

  男主角獎。此外也演出《同學會》、《分貝人生》、《幻土》、《樂園》、《迷失安狄》

  等電影，除了以《分貝人生》榮獲上海電影節亞洲新人獎最佳男演員、中國-東盟電影節

  最佳男演員、華語青年影像論壇年度新銳男演員獎之外，他在《迷失安狄》詮釋聽障青年

  ，更裸身大秀精壯肉體，還與林心如及飾演跨性別者的李李仁上演親密吻戲，獻出演藝生

  涯最大尺度，讓人見識到他的角色發揮彈性。



  這回主演新片《我和我的賽車老爸》，他詮釋外表高瘦帥氣，冷酷寡言，17歲就贏得賽車

  冠軍，並曾被多國教練譽為難得一見的天才賽車手「阿駿」。可惜他在某場賽事當中，意

  外讓同車好友身亡，還入獄服刑斷送大好賽車生涯。出獄後，他因緣際會結識由温昇豪、

  陳少卉分飾的「大隆」與「冬冬」，也因為這對父子的熱情，間接替他療癒內心所傷，讓

  他決定為自己再戰一回，打算參加拉力賽重返賽界。值得一提的是，真實生活中的陳澤耀

  ，本身就有在參加飄移甩尾比賽，還曾在甩尾賽拿下第三名佳績。不過由於他是首度接觸

  拉力賽車，也因為馬來西亞是右駕，為了適應台灣的左駕模式，他在劇組安排下勤練賽車

  駕駛技巧，學習跳躍及甩尾動作。對於能夠透過電影學習新的賽車技能，也讓他開心直呼

  ：「真是個好玩又好爽的電影！」





  對於有機會挑戰自我，陳澤耀表示：「或許因為拍攝這部電影讓人印象深刻，又或許因為

  整個拍攝氛圍和團隊太棒了，讓我殺青以後，都還忘不了這一切。」更直言：「我是幸運

  的，在拍電影的路上，能參演自己熱愛的賽車題材，這是難得可貴的。」不僅如此，他也

  感謝戲裡戲外都是很棒的搭擋温昇豪：「哥在戲劇表演的部份幫助我很多，也給了許多的

  好建議，真的希望我們還有合作的機會。」他也向觀眾推薦這部笑中帶淚的感人之作：「

  《我和我的賽車老爸》是一部賽車與藝術的結合，熱血又動人。請大家期待，也希望你走

  進戲院，陪我們拉力熱血。」



  這部台灣影史首部結合拉力賽、親情、友情、勵志的電影《我和我的賽車老爸》，即將在

  今年秋天於全台盛大上映。本片劇情描述年幼的周宇冬（陳少卉飾演）因母親驟逝，被迫

  交給素未謀面的爸爸周大隆（温昇豪飾演）撫養。大隆在宇冬出生前便與妻子離異，又因

  受傷僅靠保全工作浮沉度日。如今意外扛起父職，父子自然摩擦不斷，直到放棄賽車的天

  才車手阿駿（陳澤耀飾演），某日因緣際會闖入了兩人的世界，反而成為彼此溝通的橋樑

  ，讓這對父子逐漸找回屬於彼此的溫暖。不過阿駿也有自己不願面對的過去，他懷抱罪惡

  感所躲避的一切，反而給了他必須重返賽道的力量。而大隆為了回應宇冬的期待並證明自

  己，也毅然決定跟阿駿共同搭檔挑戰拉力賽，再為自己的人生勇敢一回…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
