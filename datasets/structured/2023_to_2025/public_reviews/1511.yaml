url: https://www.ptt.cc/bbs/movie/M.1693576280.A.A1C.html
title: '[新聞] 【我和我的賽車老爸】觀眾盛讚劇情藏洋蔥'
content: '新聞網址：



  由新銳導演張書瑋執導，台灣影史首部結合拉力賽、親情、友情、勵志的電影《我和我的

  賽車老爸》，即將在9月8日於全台溫馨獻映。本片日前舉辦多場試映會引爆熱烈好評，在

  今日（9/1）曝光的「觀眾好評推薦影像」（）當中，更

  可見證觀眾大讚本片「十分感人！」「一定要帶爸媽來看！」「可以拉近親子之間的關係

  ！」甚至也分享片中印象最深刻及感動的場面，更有觀眾有感而發，透露自己最想對爸爸

  說的內心話。另一方面，男主角之一的馬來西亞男星陳澤耀，近期特地為本片飛來台灣

  Long Stay，更參與數十個媒體專訪與節目通告，積極參與本片宣傳。而有運動習慣的他

  ，也自曝即使每天的通告從早忙到晚，還是會找時間去健身房鍛鍊體魄，更常一大早起床

  去晨跑。他尤其推薦在台灣的河濱公園跑步，還笑稱他馬來西亞的朋友來台灣，除了把他

  們帶去夜市之外，更想帶他們去河濱公園，體驗台灣清新自然的好風光。





  馬來西亞男星陳澤耀，這次在主演新片《我和我的賽車老爸》當中，飾演曾經紅極一時的

  天才賽車手，卻因為一場意外讓人生變得鬱鬱寡歡，甚至沉默寡言、失去了原本開朗的笑

  容。沒想到現實生活中的陳澤耀，跟角色性格簡直天差地別。尤其他近期接受多家媒體專

  訪，面對五花八門的提問都是侃侃而談；有唱跳團體「東于哲」偶像身份的他，更是私毫

  不擺架子，讓每場訪問的氣氛都超級愉悅，親切態度讓他備受記者稱讚。



  即使近期他馬不停蹄，參與數十組媒體訪問與節目通告，時常從早忙到晚，但據悉他在一

  整天通告結束後，還會趁空檔去健身房鍛鍊體魄，更常一大早起床去晨跑，展現讓人吃驚

  的好體力。他透露自己最愛去河濱公園跑步，最愛從彩虹橋那邊開始跑，並進一步表示：

  「我都推薦來台灣的國外朋友，一定要來看看這邊的河濱公園，尤其台灣的河濱公園規畫

  都非常棒，讓我非常喜歡。」此外，他對台灣民眾的親切感尤其印象深刻，他甚至透露本

  片在高雄拍攝時，時常去片場附近的早餐店買早餐，還跟老闆娘結為好友，讓他直呼之後

  有機會去高雄時，還想要再去光顧。他更期待本片於下週上映之後，可以親臨戲院跟觀眾

  面對面，交流演出與觀後心得。





  《我和我的賽車老爸》從台北電影節世界世界首映，直到本週進行的台北首映以來，已經

  累積大量好評口碑，更讓許多觀眾感動到淚灑戲院，絕對是今秋最感動人心的台灣佳片。

  在今日（9/1）曝光的「觀眾好評推薦影像」（）當中，

  更可以見證觀眾幾乎給予本片滿分佳績，並肯定：「十分適合全家人來看！」「如果跟家

  人有矛盾或無法溝通的人，這部片可以讓他們知道彼此心裡要怎樣解開心結！」「溫馨又

  感人！」 「滿滿的感動在裡面！」此外，也有觀眾分享自己想對爸爸說的內心話，並感

  謝多年以來的養育之恩，也直呼：「帶爸爸來看這部電影很值得！」更還有父子檔觀眾，

  重現片中動人台詞，兒子對著爸爸說：「我是你兒子，我不會不要你。」爸爸也回應：「

  我是你爸爸，我不會不要你。」將親情的溫馨感拉到最高點。



  這部集結温昇豪、陳澤耀、陳少卉領銜主演；邵雨薇、李玉璽、涂善存特別演出；檢場、

  于子育、劉育仁、田士廣、孫綻、潘君侖、林家佑等老將新秀聯合演出，台灣影史首部結

  合拉力賽、親情、友情、勵志的電影《我和我的賽車老爸》，即將在9月8日於全台溫馨獻

  映。電影預售票目前也正熱賣當中，單人票230元、雙人票450元，可至ibon官網與全台

  7-11門市ibon機台選購。本片劇情描述年幼的周宇冬（陳少卉飾演）因母親驟逝，被迫交

  給素未謀面的爸爸周大隆（温昇豪飾演）撫養。大隆在宇冬出生前便與妻子離異，又因受

  傷僅靠保全工作浮沉度日。如今意外扛起父職，父子自然摩擦不斷，直到放棄賽車的天才

  車手阿駿（陳澤耀飾演），某日因緣際會闖入了兩人的世界，反而成為彼此溝通的橋樑，

  讓這對父子逐漸找回屬於彼此的溫暖。不過阿駿也有自己不願面對的過去，他懷抱罪惡感

  所躲避的一切，反而給了他必須重返賽道的力量。而大隆為了回應宇冬的期待並證明自己

  ，也毅然決定跟阿駿共同搭檔挑戰拉力賽，再為自己的人生勇敢一回…。



  欲知本片最新消息，

