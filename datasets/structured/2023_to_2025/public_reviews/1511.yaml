url: https://www.ptt.cc/bbs/movie/M.1694162816.A.20B.html
title: '[無雷] 我和我的賽車老爸  本片不是賽車片'
content: '賽車皮，親子骨的一部電影

  但實際上親子的部份也不怎麼優秀，

  感覺整部戲想灑狗血，

  但都灑得不怎麼高明，

  不如日本片灑狗血就是一整碗的倒給你，

  這部片想騷你癢但也騷不到癢處，

  最後某角色的處理完全沒有必要，

  感覺就是劇情推動裝置，

  看到片尾這段一點眼淚都沒流只讓我覺得有點好笑…



  也許是前幾周剛看了《GT：跨界玩家》，

  很容易的會把本片的賽車片段拿來比較，

  可惜的是本片完全就是不同類型，

  賽車片段完全展現不出競速逛飆的快感，

  預期可以看到速度感的觀眾應該會大失所望。



  做為國片鮮少看到的賽車題材，

  看到拍成這樣不免失望，

  但又其實這部片跟賽車可以說沒關聯，

  把賽車的部份拿掉換成任何一項運動都能融入故事。



  滿分5  我給2分

  國片加乘可給到3分


  --'
