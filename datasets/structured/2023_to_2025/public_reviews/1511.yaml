title: '[新聞]拉力皇后等真實車手加盟<我和我的賽車老爸'
content: '新聞網址：





  台灣影史首部結合拉力賽、親情、友情、勵志的電影《我和我的賽車老爸》，目前正在全

  台感動獻映當中。本片透過拉力賽包裹動人親情，在今日（9/14）公開的「拉力賽篇」幕

  後花絮當中，可以看到更多驚險刺激的拉力賽拍攝過程，以及一字排開搶眼萬分的帥氣賽

  車。導演張書瑋透露拍攝前不僅實地考察，拍攝過程更請來飛車團隊與擅長拍攝飛車、爆

  破等大型動作場面的金馬獎得主朱科豐（小朱哥），來拍攝車與車之間的撞擊。此外，本

  片除了有「甩尾界的傳奇車手」馮仁稚提供比賽車輛，更邀請到宋士宏、陳彥融、曾建勝

  、蘇鳳成、吳文棟、梁岦翔、翁俊生、周桉年、傅琮誠等真實賽車手參與演出，甚至有「

  台灣越野拉力皇后」之稱的沈佳穎也受邀參與拍攝，讓本片的賽車場面更具說服力。而為

  了拍攝片中最關鍵的拉力賽事，劇組還特別開拔到嘉義最美麗的爬坡道「梅山36彎」取景

  ，場面刺激驚險，絕對將帶給觀眾不一樣的大銀幕熱血體驗。





  在今日公開的《我和我的賽車老爸》幕後花絮「拉力賽篇」當中，導演張書瑋坦言：「一

  開始想要拍熱血的運動主題，後來選擇拉力賽這個本土運動題材。」尤其拍攝賽車場面難

  度相當大，導演進一步表示：「在前製時，我們便實地考察拉力比賽，也獲得UCRA華盟拉

  力賽運動推廣協會幫助，並選擇嘉義的梅山36彎，進一步體現片中驚險刺激、冒險的拉力

  賽事。」值得一提的是，為了達到逼真與充滿速度感的效果，劇組也請來飛車團隊，以及

  曾以電影《叱吒風雲》勇奪第58屆金馬獎「最佳動作設計」肯定的資深動作特技指導朱科

  豐（小朱哥），來拍攝車與車之間的撞擊，讓賽車元素更加緊張刺激。同時，也邀請到台

  灣最老車手之一，也是台灣年輕賽車手口中「不老車神」的高清榮擔任顧問，務求將拉力

  賽事的拍攝更顯專業。導演對此表示：「拍拉力賽車這個題材，就跟開拉力賽車的車手一

  樣，拼的就是一股熱情。拉力賽比的就是不放棄、堅持完賽、克服各種困難，這就是拉力

  精神，也是我們電影的精神。」



  男主角之一的陳澤耀，本身就擁有甩尾飄移賽車手身份，還曾在甩尾賽拿下第三名佳績。

  這回是他首度接觸不同以往的拉力賽車運動，也讓他對可以學習新的賽車技能感到相當開

  心。他分析兩種賽車的不同：「拉力賽跟甩尾飄移是不一樣的，差別在於它有副駕（領航

  員），專門報路況，開車之餘還要聽狀況與指揮，非常艱難與挑戰。」而在片中擔任他領

  航員的温昇豪，也跟陳澤耀親自上陣拍攝多場激烈賽車場面。也因為要在劇烈搖晃的車內

  看路況手冊，加上梅山36彎的曲折蜿蜒，讓不容易暈車的温昇豪也大喊吃不消。





  值得一提的是，《我和我的賽車老爸》除了有「甩尾界的傳奇車手」馮仁稚提供比賽車輛

  ，更邀請到宋士宏、陳彥融、曾建勝、蘇鳳成、吳文棟、梁岦翔、翁俊生、周桉年、傅琮

  誠等真實賽車手參與演出，甚至有「台灣越野拉力皇后」之稱的沈佳穎也受邀參與拍攝，

  為本片激烈的拉力賽事更添說服力。尤其擁有多次亞洲越野拉力賽冠軍頭銜的沈佳穎，直

  呼很榮幸能以拉力賽車手與特技車手的身份參與電影演出，更大讚：「整部片製作非常認

  真嚴謹，導演、編劇到整個劇組的成員和演員，對於正統拉力賽的考究要求不在話下，且

  是以真正的拉力賽車手，真真實實地參與演出！」她並補充：「在拍攝過程中，賽車手發

  揮速度感，黑影特技車手們則呈現在比賽中最不願發生的撞車翻車特技，更增添影片的精

  彩度！」她也推薦大家一定要來觀賞本片：「是真的非常值得推薦的好片呀！」



  《我和我的賽車老爸》在觀眾們的熱烈好評與支持下，演員陳澤耀、涂善存、孫綻三人也

  確定將在本週五（9/15）晚間，在台北的真善美劇院、in89豪華影城、喜滿客影城絕色店

  、欣欣秀泰影城進行多場戲院見面會，請密切留意官方社群公告，並提早購票與影人近距

  離會面。



  這部集結温昇豪、陳澤耀、陳少卉領銜主演；邵雨薇、李玉璽、涂善存特別演出；檢場、

  于子育、劉育仁、田士廣、孫綻、潘君侖、林家佑等老將新秀聯合演出，台灣影史首部結

  合拉力賽、親情、友情、勵志的電影《我和我的賽車老爸》，目前正在全台感動獻映當中

  。本片劇情描述年幼的周宇冬（陳少卉飾演）因母親驟逝，被迫交給素未謀面的爸爸周大

  隆（温昇豪飾演）撫養。大隆在宇冬出生前便與妻子離異，又因受傷僅靠保全工作浮沉度

  日。如今意外扛起父職，父子自然摩擦不斷，直到放棄賽車的天才車手阿駿（陳澤耀飾演

  ），某日因緣際會闖入了兩人的世界，反而成為彼此溝通的橋樑，讓這對父子逐漸找回屬

  於彼此的溫暖。不過阿駿也有自己不願面對的過去，他懷抱罪惡感所躲避的一切，反而給

  了他必須重返賽道的力量。而大隆為了回應宇冬的期待並證明自己，也毅然決定跟阿駿共

  同搭檔挑戰拉力賽，再為自己的人生勇敢一回…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
