title: '[新聞] 李玉璽、涂善存加盟【我和我的賽車老爸】'
content: '新聞網址：



  台灣影史首部結合拉力賽、親情、友情、勵志的電影《我和我的賽車老爸》，被劇組視為

  最高機密的兩位「神秘王牌」演員，隨著上週台北電影節的世界首映終於曝光，讓參與世

  界首映的觀眾原地驚呼：「原來李玉璽、涂善存也有演！」李玉璽在片中詮釋長大後的男

  主角「周宇冬」（小時候由童星陳少卉飾演），如今已經成為職業領航員，而涂善存則演

  繹跟他搭擋的專業拉力賽車手，兩人在片中展現換帖兄弟的絕佳默契。尤其首度演出主角

  長大後的李玉璽，大讚跟涂善存合作拍戲「很輕鬆舒服」；涂善存更透露其中一場戲，竟

  被導演說兩人的友誼互動「太有情愫」，必須收回來一些，意外出現的「粉紅泡泡」也讓

  他笑說：「如果我們這對搭檔的故事有繼續下去，那肯定是會很有火花、很令人期待的故

  事。」《我和我的賽車老爸》即將在9月8日於全台盛大上映。





  由新銳導演張書瑋執導，兩屆金鐘獎最佳編劇得主溫郁芳執筆劇本，温昇豪、陳澤耀、陳

  少卉領銜主演的感人之作《我和我的賽車老爸》，劇情不僅帶出年幼主角「周宇冬」跟素

  未謀面父親的親情拉扯，更還一路演到宇冬長大後的模樣。原來從小就喜歡賽車的宇冬，

  20年後已經成為職業領航員，與搭檔車手「楊智峰」征戰過無數拉力賽，並贏得多場拉力

  賽冠軍。然而，只缺一場太平站的比賽成績，兩人就能成為拉力賽大滿貫車手。不過宇冬

  卻在參加與否的最後關頭猶豫不決，讓搭檔智峰非常不解。長大後的宇冬，便由橫跨歌手

  與演員身份，近期更在《嗨！營業中第二季》擔任固定班底的李玉璽特別演出。



  值得一提的是，這是他首度挑戰主角長大後的模樣，他透露先是看了「小宇冬」陳少卉的

  演出之後，再去揣摩這個角色：「是很珍貴的體驗！」尤其他跟陳少卉都有一雙水汪汪的

  大眼睛，如果站在一起，真的頗有一個模子刻出來的相似度，也讓上週搶先觀賞本片的觀

  眾盛讚是「神選角」！李玉璽也感謝收到演出邀請，並透露：「在收到邀請前，不知道賽

  車有拉力賽這個賽制，覺得很有趣。雖然只是特別演出，但劇組非常用心去對待每場戲。

  」而對於在片中有大量對手戲的「換帖好兄弟」涂善存，他也表示：「和涂善存在合作之

  前，只有過一兩次緣分。對於在戲中要扮演夥伴，準備時間又不長的情況下，本來有點擔

  心，結果在讀本後馬上就熟識了，拍攝過程也很輕鬆舒服！」





  另一方面，涂善存在《我和我的賽車老爸》詮釋周宇冬長大之後，征戰多場拉力賽事的好

  搭擋「楊智峰」。雖然只是特別演出，但他也力讚劇組：「從讀本、定裝就感受到團隊的

  仔細。當置身在場景中，賽車所散發出來的魅力，更讓人感到能夠演出賽車手，是一件很

  令人興奮的事，更期待未來有機會能再以賽車手的角色演出。」對於這回跟李玉璽搭擋，

  他也回憶：「兩人在劇中的演出有很大的自由度，在現場彼此對於不同演法的接受度和默

  契都非常好。」有趣的是，雖然本片並非BL電影，不過兩位人高馬大的帥哥，要呈現好兄

  弟般的賽車戰友情誼，一個不小心，難免會詮釋過頭，冒出意料之外的「粉紅泡泡」，讓

  涂善存笑說：「其中一場戲，被導演說兩人的互動太有情愫，要拉回來一點。我想如果我

  們這對搭檔的故事有繼續下去，那肯定是會很有火花、很令人期待的故事。」



  這部台灣影史首部結合拉力賽、親情、友情、勵志的電影《我和我的賽車老爸》，即將在

  9月8日於全台盛大上映。本片劇情描述年幼的周宇冬（陳少卉飾演）因母親驟逝，被迫交

  給素未謀面的爸爸周大隆（温昇豪飾演）撫養。大隆在宇冬出生前便與妻子離異，又因受

  傷僅靠保全工作浮沉度日。如今意外扛起父職，父子自然摩擦不斷，直到放棄賽車的天才

  車手阿駿（陳澤耀飾演），某日因緣際會闖入了兩人的世界，反而成為彼此溝通的橋樑，

  讓這對父子逐漸找回屬於彼此的溫暖。不過阿駿也有自己不願面對的過去，他懷抱罪惡感

  所躲避的一切，反而給了他必須重返賽道的力量。而大隆為了回應宇冬的期待並證明自己

  ，也毅然決定跟阿駿共同搭檔挑戰拉力賽，再為自己的人生勇敢一回…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
