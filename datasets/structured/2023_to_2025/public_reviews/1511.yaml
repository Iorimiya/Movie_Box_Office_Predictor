title: '[新聞] 【我和我的賽車老爸】三人三色海報公開！'
content: '新聞網址：




  由温昇豪、陳澤耀、陳少卉領銜主演，台灣影史首部結合拉力賽、親情、友情、勵志的電

  影《我和我的賽車老爸》，即將在9月8日於全台感動獻映。製作團隊今日（8/25）公開三

  款角色海報，透過「三人三色」概念，表現出角色的魅力與內在，吸引了人們的目光。尤

  其在片中詮釋陌生父子的温昇豪與陳少卉，兩人都直言沒有刻意先去培養父子默契，而是

  依照角色從陌生到熟識的心路歷程去相處。陳少卉除了讚美温昇豪的演技「很強」之外，

  也直呼他是個風趣又親切的人。而陳澤耀也稱譽温昇豪是個很有溫度的人：「他很樂意去

  分享，演出也很自然。」讓温昇豪開玩笑說：「很有溫度，因為我姓温。」





  《我和我的賽車老爸》描繪一對摩擦不斷的陌生父子，在遇見失意天才賽車手後，關係逐

  漸緊密、相互救贖，直到再次看見希望，並決定為人生勇敢一回的故事。在今日（8/25）

  公開的角色海報當中，可以看到由温昇豪詮釋的「周大隆」，以堅定的眼神，微笑望向遠

  方，搭配台詞「人生，不就是冒險嗎？」暗示他不僅有個陌生兒子闖入人生當中，必須面

  對新手爸爸帶來的挑戰，更還要協助陳澤耀的角色去當拉力賽車領航員，讓人好奇他最後

  能否挑戰成功。接著，由陳澤耀飾演的天才賽車手「陳柏駿」，在角色海報中穿著賽車服

  ，以剛毅的目光望向前方；也因為角色在片中決定東山再起，打算再度挑戰拉力賽事，但

  由於拉力賽需要一位領航員作為夥伴，讓他在尋覓搭擋的過程中，一直期望「只要找到一

  個相信我的人，就夠了。」而由天才童星陳少卉詮釋的「周宇冬」，在角色海報展現天真

  活潑的氣質，也因為他最喜歡玩賽車，不僅視片中的阿駿哥哥為偶像，更立志「我長大以

  後，要成為最厲害的賽車手！」



  值得一提的是，這次公開的三款角色海報，以「三人三色」概念，表現出角色截然不同的

  魅力與內在。以藍色為主要色調的「周大隆」，代表著藍天與希望，期望透過截然不同的

  人生際遇，逐漸邁向新的人生。而以橘色為主要色調的「陳柏駿」，則展現對自己所熱愛

  的拉力賽的堅持，燃燒生命展現熱情。至於以綠色為主要色調的「周宇冬」，則代表著青

  春、稚嫩，猶如新生的嫩芽，展現出青春與活力，更對照周大隆代表的藍色，有「青出於

  藍」的涵意。透過三位演員在片中的化學效應，展現出完美默契，更為觀眾增添期待感。





  在《我和我的賽車老爸》當中，温昇豪與陳少卉詮釋一對陌生父子。當問及兩人如何培養

  父子默契時，兩人都直言沒有刻意先去培養默契，温昇豪表示：「就如片中角色一樣，看

  到這個小孩會想說『你是誰』？」陳少卉也回憶：「因為昇豪爸爸本身就是一位風趣又親

  切的人，所以跟他很快就熟了。」尤其曾獲金鐘獎肯定的温昇豪，更是讓陳少卉對他的精

  湛演出直呼「很強」：「一幕昇豪爸爸在家中把我推倒的戲，他在試戲的時候是一個人，

  拍攝時又是另一個人，覺得他很厲害。」有趣的是，反問温昇豪拍一些情緒比較激動的戲

  時，會不會擔心嚇到陳少卉呢？也讓温昇豪笑說：「他很專業的，因為他之前演過虎爺，

  反而是我才要敬畏他。」而陳澤耀也力讚温昇豪：「他是個很有溫度的人，從我們剛認識

  ，到對劇本的過程當中，就可以看到他對劇本的分析與想法，他也很樂意去分享，演出也

  很自然。」讓温豪豪打趣表示：「很有溫度，因為我姓温。」



  這部集結温昇豪、陳澤耀、陳少卉領銜主演；邵雨薇、李玉璽、涂善存特別演出；檢場、

  于子育、劉育仁、田士廣、孫綻、潘君侖、林家佑等老將新秀共同演出，台灣影史首部結

  合拉力賽、親情、友情、勵志的電影《我和我的賽車老爸》，即將在9月8日於全台溫馨獻

  映。電影預售票目前也正熱賣當中，單人票230元、雙人票450元，可至ibon官網與全台

  7-11門市ibon機台選購。本片劇情描述年幼的周宇冬（陳少卉飾演）因母親驟逝，被迫交

  給素未謀面的爸爸周大隆（温昇豪飾演）撫養。大隆在宇冬出生前便與妻子離異，又因受

  傷僅靠保全工作浮沉度日。如今意外扛起父職，父子自然摩擦不斷，直到放棄賽車的天才

  車手阿駿（陳澤耀飾演），某日因緣際會闖入了兩人的世界，反而成為彼此溝通的橋樑，

  讓這對父子逐漸找回屬於彼此的溫暖。不過阿駿也有自己不願面對的過去，他懷抱罪惡感

  所躲避的一切，反而給了他必須重返賽道的力量。而大隆為了回應宇冬的期待並證明自己

  ，也毅然決定跟阿駿共同搭檔挑戰拉力賽，再為自己的人生勇敢一回…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
