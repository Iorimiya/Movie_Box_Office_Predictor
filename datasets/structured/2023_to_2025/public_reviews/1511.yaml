url: https://www.ptt.cc/bbs/movie/M.1691496380.A.40F.html
title: '[新聞] 【我和我的賽車老爸】搶看會引發轟動好評'
content: '新聞網址：




  由温昇豪、陳澤耀、陳少卉領銜主演，台灣影史首部結合拉力賽、親情、友情、勵志的電

  影《我和我的賽車老爸》，即將在9月8日於全台溫馨獻映。今日（8/8）適逢父親節，製

  作團隊也選在父親節公開本片「正式海報」，搭配「我是你爸爸，我不會不要你…」如此

  讓人記憶猶新的強烈海報標語，不僅吸引人們視線，更讓人好奇片中這對不期而遇的父子

  檔，究竟會有什麼樣出乎意料的親情發展。不僅如此，温昇豪也特地跟陳少卉錄製影片（

  ），祝廣大父親們父親節快樂，並陳澤耀分享對父親節的

  回憶。即使兩人都感嘆今日要在工作中度過，不過陳澤耀也回憶以往父親節都會帶爸爸去

  吃日式料理，尤其父親不論怎樣都必點「鰻魚丼飯」；他更透露如果沒工作，最想帶家人

  一起去「越野露營」，展現出他活潑奔放的性格。值得一提的是，本片在上週六（8/6）

  也舉辦台北、台中、高雄三地的「父親節搶看會」，吸引不少家庭帶著爸爸一同來觀賞，

  更有不少觀眾被感人至深的情節逼出淚水，直呼：「高潮迭起！」「貼近生活！」「很適

  合帶孩子一同觀賞！」甚至還有觀眾感嘆：「每個男人都是有了孩子，才開始學習成為爸

  爸！」





  由新銳導演張書瑋執導，兩屆金鐘獎最佳編劇得主溫郁芳執筆劇本的感人之作《我和我的

  賽車老爸》，透過「拉力賽」這個新穎題材，鋪陳出一段關於親情、友情、勵志和自我救

  贖的故事，也是近年國片少見類型。全片集結温昇豪、陳澤耀、陳少卉、邵雨薇、李玉璽

  、涂善存、檢場、于子育、劉育仁、田士廣、孫綻、潘君侖、林家佑等老將新秀共同參與

  演出，感動人心的劇情，勢必將在為電影院帶來笑中帶淚的陣陣暖流，預計將再度掀起國

  片票房熱潮。



  在今天公開的「正式海報」當中，但見温昇豪、陳少卉這對不期而遇，彼此並不熟悉的父

  子共同望向遠方，輔以在片中飾演失意賽車手的陳澤耀，他若有所思的表情，以及他身邊

  多台魚貫而行的賽車畫面，一下子就吸引人們視線；再搭配「我是你爸爸，我不會不要你

  …」這句海報標語，也讓人好奇這對父子，究竟要如何從相互摩擦的父子關係，逐步進展

  到找回屬於彼此的溫暖。而這三人究竟又有著什麼樣的隱藏故事，也值得觀眾進戲院一探

  究竟。





  值得一提的是，《我和我的賽車老爸》呼應父子親情劇情，選在父親節公佈正式海報，兩

  位男主角温昇豪、陳澤耀也分享父親節的回憶。温昇豪坦言自己並沒有過節的習慣，今年

  父親節也是在工作中度過，不過如果有機會，會找家人們一起吃個飯。陳澤耀則回憶：「

  以往父親節都會帶爸爸去吃日式料理，因為老爸最愛的就是『鰻魚丼飯』，所以即使去到

  一家新的日式餐廳，老爸還是一如往常點鰻魚丼飯。」他也感嘆今年父親節正忙於拍攝工

  作，沒辦法跟爸爸一起度過，不過他也期盼：「如果沒忙工作的話，我想安排帶家人一起

  去『越野露營』，陪爸爸過父親節。」展現出他活潑奔放的性格。



  不僅如此，本片也在上週六（8/6）舉辦台北、台中、高雄三地的「父親節搶看會」，吸

  引民眾踴躍報名，三場不到一天時間便報名額滿，展現出讓人驚嘆的人氣。即使活動當天

  天氣不佳，仍然吸引不少家庭帶著爸爸一起來觀賞，甚至還有不少觀眾被感人至深的情節

  逼出淚水，在散場後紛紛與劇組分享：「高潮迭起！」「很適合帶孩子一同觀賞！」「親

  情之間的互動會讓人聯想到自己！」「很符合我們現今社會的寫照！」尤其片中大多數場

  景選在高雄拍攝，更是讓高雄場的觀眾，看到許多高雄知名景點而備感親切，直呼：「很

  貼近生活！」「把高雄拍得很美！」此外，片中的親子互動也讓觀眾感嘆：「每個男人都

  是有了孩子，才開始學習成為爸爸！」



  這部台灣影史首部結合拉力賽、親情、友情、勵志的電影《我和我的賽車老爸》，即將在

  9月8日於全台溫馨獻映。本片劇情描述年幼的周宇冬（陳少卉飾演）因母親驟逝，被迫交

  給素未謀面的爸爸周大隆（温昇豪飾演）撫養。大隆在宇冬出生前便與妻子離異，又因受

  傷僅靠保全工作浮沉度日。如今意外扛起父職，父子自然摩擦不斷，直到放棄賽車的天才

  車手阿駿（陳澤耀飾演），某日因緣際會闖入了兩人的世界，反而成為彼此溝通的橋樑，

  讓這對父子逐漸找回屬於彼此的溫暖。不過阿駿也有自己不願面對的過去，他懷抱罪惡感

  所躲避的一切，反而給了他必須重返賽道的力量。而大隆為了回應宇冬的期待並證明自己

  ，也毅然決定跟阿駿共同搭檔挑戰拉力賽，再為自己的人生勇敢一回…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
