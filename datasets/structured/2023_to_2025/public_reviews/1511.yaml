title: '[新聞] <我和我的賽車老爸>首映群星暢聊拍片趣聞'
content: '新聞網址：



  由新銳導演張書瑋執導，台灣影史首部結合拉力賽、親情、友情、勵志的電影《我和我的

  賽車老爸》，今晚（8/29）於台北微風影城舉辦星光首映會。現場眾星雲集，主要演員温

  昇豪、陳澤耀、陳少卉，特別演出邵雨薇、李玉璽、涂善存，以及共同演出的檢場、劉育

  仁、田士廣、孫綻、潘君侖、林家佑皆盛裝出席。多位男星齊聚一堂，也讓邵雨薇笑稱如

  果有票房公約的話：「票房好的話，感覺可以拍個『男郎』月曆。」不僅如此，「台語金

  曲歌王」許富凱也特別現身首映會，現場驚喜獻聲，清唱電影主題曲〈南風〉。除了許富

  凱特別到場之外，現場更開出「賽車造型蛋糕」，預祝票房能夠狂飆破億，讓演員們驚呼

  連連！





  《我和我的賽車老爸》透過獨特的「拉力賽」題材，呈現人與人之間的動人情感，其中的

  親情鋪陳與描繪更是感動人心。今日首映會現場的粉絲尖叫聲不斷，演員們拍起照來更是

  愛心連發、大踩油門、第一名的冠軍姿勢不斷，讓比較後段拍照的影人們笑稱：「還可以

  擺什麼Pose呢？！」在片中飾演給予主角周大隆父子諸多建議，並用心陪伴主角的熱血老

  師邵雨薇，也分享拍戲過程跟陳少卉的互動過程：「有一次我們一起搭公車，他突然表演

  那時候很紅的廣告。他在開拍時很害羞，但那一天就像突然把害羞丟掉一樣，讓我覺得超

  級可愛的！」本片除了親情賺人熱淚，拉力賽的勵志精神與深厚夥伴情誼也讓人熱血沸騰

  ，陳澤耀對此有感而發：「我和孫綻認識後，就有留Line聊天，一起幻想了很多賽事，而

  且孫綻是特別有愛的人，分享了很多兄弟之間的浪漫。」



  片中兄弟情的部分不只如此，回憶起其中一場集結李玉璽、涂善存、林家佑、潘君侖四人

  的戲份時，潘君侖特別分享：「我對他們三個有種特殊的關係，我和善存、家佑在《全明

  星運動會》一起奮戰，所以有革命情感；而我和玉璽除了心靈之外，還有『身體關係』。

  」讓一旁的李玉璽聽到驚呼，讓潘君侖趕緊補充：「因為我們一起健身，所以在場景當中

  才能很快融入啦！」值得一提的是，李玉璽這次飾演陳少卉長大之後，今晚也終於跟「年

  幼的自己」相見歡，兩人站在一起時，精準的選角都讓大家直呼：「真的有像！」李玉璽

  也玩笑表示：「身邊很多人都說我們很像，可能我才因此有這個工作機會吧！我自己覺得

  好像有一點，但他長得比我還好看。」





  《我和我的賽車老爸》以拉力賽包裹著動人情感，描繪摩擦不斷的陌生父子，在遇見失意

  天才賽車手後，關係逐漸緊密、相互救贖，大獲感動好評。今晚首映會上，主題曲〈南風

  〉演唱者，同時也是「台語金曲歌王」的許富凱更到場支持，甚至現場驚喜清唱主題曲，

  讓現場嘉賓又驚又喜！尤其本曲先前釋出後，一舉空降KKBOX台語日榜冠軍，歌曲對家人

  堅定與真摯的情感，更是讓網友大讚：「超催淚！」許富凱也分享對家的記憶：「這部戲

  在高雄拍攝，而我也是高雄人，所以看到那些場面很熟悉，也剛好讓我把劇情套上學生時

  代的畫面，和父母在高雄吃飯、做任何事的回憶。」尤其首映會驚喜連連，現場更開出「

  賽車造型蛋糕」，預祝票房能夠狂飆破億，讓眾人驚呼不斷，而由於本片男演員眾多，讓

  邵雨薇也玩笑說道：「這麼多男生，如果票房長紅，感覺可以拍個『男郎』月曆。」



  這部台灣影史首部結合拉力賽、親情、友情、勵志的電影《我和我的賽車老爸》，即將在

  9月8日於全台溫馨獻映。電影預售票目前也正熱賣當中，單人票230元、雙人票450元，可

  至ibon官網與全台7-11門市ibon機台選購。本片劇情描述年幼的周宇冬（陳少卉飾演）因

  母親驟逝，被迫交給素未謀面的爸爸周大隆（温昇豪飾演）撫養。大隆在宇冬出生前便與

  妻子離異，又因受傷僅靠保全工作浮沉度日。如今意外扛起父職，父子自然摩擦不斷，直

  到放棄賽車的天才車手阿駿（陳澤耀飾演），某日因緣際會闖入了兩人的世界，反而成為

  彼此溝通的橋樑，讓這對父子逐漸找回屬於彼此的溫暖。不過阿駿也有自己不願面對的過

  去，他懷抱罪惡感所躲避的一切，反而給了他必須重返賽道的力量。而大隆為了回應宇冬

  的期待並證明自己，也毅然決定跟阿駿共同搭檔挑戰拉力賽，再為自己的人生勇敢一回…

  。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
