url: https://www.ptt.cc/bbs/movie/M.1685449882.A.D1A.html
title: '[新聞] 温昇豪蓄鬍跛腳演繹【我和我的賽車老爸】'
content: '新聞網址：



  台灣影史首部結合拉力賽、親情、友情、勵志的電影《我和我的賽車老爸》，找來演技派

  男星温昇豪領銜主演，詮釋把生活過得一團糟，某日竟意外得知自己有個兒子的菜鳥老爸

  。呼應角色因為長短腳行動不便的模樣，溫昇豪不僅挑戰「跛腳」演出，更特意蓄鬍展現

  角色邋遢的模樣。他跟童星陳少卉演繹父子情，更展現出細膩內心戲，勢必將為所有年齡

  層觀眾帶來笑中帶淚的精彩演出。此外，本片也擄獲台北電影節青睞，即將在電影節期間

  進行世界首映。電影節選片人洪健倫不僅力讚本片的親情刻劃動人，更盛讚温昇豪的演出

  ：「能收能放，相當精彩動人。」本片預計將在今年秋天於全台盛大上映，熱血與感動兼

  具，勢必將為戲院注入陣陣暖流，再掀票房熱潮。





  以「拉力賽」為故事背景的《我和我的賽車老爸》，由兩屆金鐘獎最佳編劇得主溫郁芳擔

  綱編劇，新銳導演張書瑋執導，温昇豪、陳澤耀、陳少卉、卲雨薇領銜主演。透過菜鳥老

  爸與陌生兒子的親情交流，結合失意車手在人生路上的跌跌撞撞，彼此試圖重獲救贖，為

  人生再戰一回。全片勵志新穎，兼具勇氣、溫情、熱血與速度感，是近年台灣電影少見類

  型。以《敗犬女王》、《犀利人妻》廣為台灣觀眾熟知的温昇豪，這回飾演主角「周大隆

  」，角色因為意外而長短腳，還把生活過得一團糟。雖然表面上看來邋遢，卻比任何人都

  充滿感情，個性也相當真誠善良。某日他意外接獲社會局來電，得知自己有個十歲兒子「

  冬冬」，原來是當時分手的女友已有身孕卻沒告知，而在女友車禍驟逝後，讓他展開菜鳥

  單親老爸的生活；也因為跟賽車手「阿駿」相遇，意外開啟他在中年人生的賽車夢。



  為了演繹角色行動不便且邋遢的模樣，温昇豪不僅蓄鬍還跛腳演出，這也讓他直呼：「這

  次在肢體上，可能沒辦法那麼靈活跟協調了。」不過對於有機會接演如此特別的作品，他

  也開心表示：「這是我第一次拍關於賽車的電影。運動電影一直是我喜歡的類型，當然賽

  車更是如此。因為本身是男生，我很喜歡車，也很喜歡賽車，所以接到這部片非常開心。

  」對於片中跟童星陳少卉演繹父子情，他也補充：「拿到劇本的時候，我常常會想到《再

  見阿郎》，我們的故事就是圍繞著父子情。當時在拍的時候，腦海浮現了很多《再見阿郎

  》的影子。它是一部賽車電影，我們是拉力賽，所以還是有一點向它致敬的的味道。」他

  也將透過新手老爸與菜鳥車手的角色，展現更上一層樓的演出，有望問鼎各大電影獎的影

  帝肯定。





  透過尋找自我救贖的故事，《我和我的賽車老爸》即將帶給觀眾笑中帶淚的感動。這也讓

  本片獲得台北電影節青睞，即將在電影節期間進行世界首映。選片人洪健倫盛讚：「本片

  在親情的刻劃上頗為動人，主角周大隆從起初的排斥，到後來承擔起身為父親責任，讓人

  看見親情羈絆是如何發生。飾演周大隆的温昇豪在片中表現能收能放，相當精彩動人。」

  導演張書瑋也感性表示：「人，賦予電影說故事的能力 ; 而觀眾，讓電影充滿了生命力

  。感謝台北電影節，讓《我和我的賽車老爸》能在這個舞台與觀眾見面。這是集合眾多優

  秀電影人的台灣電影，期待大家會喜歡，謝謝！」台北電影節票券將於6月11日啟售，請

  觀眾務必把握世界首映的搶先觀賞機會！



  這部台灣影史首部結合拉力賽、親情、友情、勵志的電影《我和我的賽車老爸》，即將在

  今年秋天於台灣盛大上映。本片劇情描述年幼的周宇冬（陳少卉飾演）因母親驟逝，被迫

  交給素未謀面的爸爸周大隆（温昇豪飾演）撫養。大隆在宇冬出生前便與妻子離異，又因

  受傷僅靠保全工作浮沉度日。如今意外扛起父職，父子自然摩擦不斷，直到放棄賽車的天

  才車手阿駿（陳澤耀飾演），某日因緣際會闖入了兩人的世界，反而成為彼此溝通的橋樑

  ，讓這對父子逐漸找回屬於彼此的溫暖。不過阿駿也有自己不願面對的過去，他懷抱罪惡

  感所躲避的一切，反而給了他必須重返賽道的力量。而大隆為了回應宇冬的期待並證明自

  己，也毅然決定跟阿駿共同搭檔挑戰拉力賽，再為自己的人生勇敢一回…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
