title: '[新聞] <我和我的賽車老爸>曝演員訪談與拍攝現場'
content: '新聞網址：





  由新銳導演張書瑋執導，台灣影史首部結合拉力賽、親情、友情、勵志的電影《我和我的

  賽車老爸》，即將在本週五（9/8）於全台感動獻映。在今天（9/4）公開的「演員篇」幕

  後花絮當中，揭露了本片充滿活力的拍攝現場，以及包括導演及主要演員温昇豪、陳澤耀

  、陳少卉；特別演出邵雨薇等多位演員在內的訪談畫面。導演不僅盛讚温昇豪拋開以往迷

  人帥氣形象，透過蓄鬍、跛腳的頹廢外表，讓自己完美化身成角色本身，讓觀眾高度信服

  ，也透露陳澤耀本身的賽車手身份，讓他成為片中失意賽車手角色的不二人選。陳澤耀也

  自我剖析，認為「責任感重」是他跟角色的共通點。此外，導演也稱讚童星陳少卉是個心

  思細密，甚至有點穩重的孩子，笑稱跟他溝通，就像在跟「小大人」對話。而片中少數的

  女演員邵雨薇，也透露接演原因，啟發自她當時看到的一個節目訪談內容，認為她的角色

  可以透過對教學的熱情跟快樂，去影響一個小朋友的心靈，完美呈現出角色充滿愛心、耐

  心與關心的良善美德。





  在今日公開的《我和我的賽車老爸》幕後花絮「演員篇」當中，飾演新手魯蛇老爸「周大

  隆」的温昇豪，率先表示本片是「以父子為主題，用賽車包裝，關於贖罪、重生、勇氣的

  一部電影。」他更在拍攝過程與導演及編劇有諸多討論，也決定讓角色以蓄鬍、跛腳的外

  在形象，加強觀眾對情節產生不同定義。導演張書瑋回憶跟温昇豪的合作，笑稱一開始對

  他的印象就是「哇！他太帥了！」也擔心他能否得以忠實表現出角色的頹廢形象。沒想到

  一來到片場，導演跟所有工作人員看到他的演出，都豎起大拇指稱讚：「昇豪哥就是周大

  隆！」導演更肯定温昇豪：「他已經拋開他那種迷人帥氣的形象，對我們來說，這樣子的

  周大隆，在故事裡面是能夠讓觀眾信服的。」一席話表達出對他的感謝與尊敬。



  而在片中飾演失意賽車手「阿駿」的馬來西亞男星陳澤耀，也直呼角色跟他本人的個性有

  部分相似：「就是責任感滿重，因為我自己本來就會對事情在意，很難放下一些事情。」

  尤其真實生活的他，跟角色一樣都是賽車手，這也成為他得以演出本片的關鍵因素之一。

  導演回憶選角過程時透露：「一開始要找陳柏駿這個角色時，陳澤耀就是不二人選，除了

  他本身的演員能量足夠以外，更重要的是他本身就是賽車手，所以在我們拍拉力賽的過程

  當中，會有相當真實的呈現。」尤其他在本次的幕後花絮當中，還有令人吃驚的車禍畫面

  ，當中究竟發生了什麼事情，也值得觀眾進戲院一探究竟。





  由於《我和我的賽車老爸》清一色都是男性角色，讓導演張書瑋表示邵雨薇飾演的「康老

  師」一角，只要有她出現「畫面就是彩色的」，並稱讚她的出現總是充滿活潑與熱情，更

  盛讚她：「雨薇是一個非常細膩的演員，她常常會跟我們說她不怕吃苦。我們希望她怎麼

  做，她可以幫我們呈現，這樣我覺得非常棒。」就連邵雨薇本人都表示自己很想演出這個

  角色，並透露原因：「前陣子看了一個節目，有一個醫生講說：『如果我可以把你被火燒

  燙傷了的這個臉，給修復完整的話，也許我就可以改變你的一生，讓你重回你的自信。』

  那時候正好是我碰到這個劇本的時候，我就有一種感覺，覺得康老師也是屬於這樣子。她

  可以用對教學的熱情跟快樂，去影響一個小朋友的心靈。」她更進一步補充：「很多人都

  會到長大之後，才慢慢修復自己的愛，我覺得康老師在這時候就賦予很大的幫助，給冬冬

  一個很溫暖的愛，讓他可以很健全地長大，也幫助周大隆讓他們父子之間，互相給彼此溫

  暖。」完美呈現出角色對一切人事物充滿愛心、耐心與關心的良善美德。



  而在片中飾演周大隆兒子「冬冬」的童星陳少卉，導演也稱讚他是個心思細密，甚至有點

  穩重的孩子：「他一點都不怕生，他常常在現場會問我可不可以這樣演，可不可以看個回

  放，讓我覺得像是在跟一個小大人溝通。」導演也稱讚他跟温昇豪的父子合作：「是個很

  良好的化學反應。」



  這部集結温昇豪、陳澤耀、陳少卉領銜主演；邵雨薇、李玉璽、涂善存特別演出；檢場、

  于子育、劉育仁、田士廣、孫綻、潘君侖、林家佑等老將新秀聯合演出，台灣影史首部結

  合拉力賽、親情、友情、勵志的電影《我和我的賽車老爸》，即將在本週五（9/8）於全

  台感動獻映。電影預售票目前也正熱賣當中，單人票230元、雙人票450元，可至ibon官網

  與全台7-11門市ibon機台選購。本片劇情描述年幼的周宇冬（陳少卉飾演）因母親驟逝，

  被迫交給素未謀面的爸爸周大隆（温昇豪飾演）撫養。大隆在宇冬出生前便與妻子離異，

  又因受傷僅靠保全工作浮沉度日。如今意外扛起父職，父子自然摩擦不斷，直到放棄賽車

  的天才車手阿駿（陳澤耀飾演），某日因緣際會闖入了兩人的世界，反而成為彼此溝通的

  橋樑，讓這對父子逐漸找回屬於彼此的溫暖。不過阿駿也有自己不願面對的過去，他懷抱

  罪惡感所躲避的一切，反而給了他必須重返賽道的力量。而大隆為了回應宇冬的期待並證

  明自己，也毅然決定跟阿駿共同搭檔挑戰拉力賽，再為自己的人生勇敢一回…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
