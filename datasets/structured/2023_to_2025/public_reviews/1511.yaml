url: https://www.ptt.cc/bbs/movie/M.1694184908.A.9AD.html
title: 我和我的賽車老爸
content: "這是今年台北電影節來不及看的片，看到上映消息，今天下班就去看了。\n\n \n\n雷文防雷資訊頁\n \n \n \n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \ \n \n \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n \n \n\
  \n這部電影的內容算熱血追夢＋感人家庭親情片，情節主軸是放在拉力車上，一起去看的朋友\n是車迷，他說這部片他會想再二刷三刷。\n\n整部片看下來可以感受到電影團隊的用心，先前追劇組臉書就有看到他們為了拍攝比賽短短\n\
  20分鐘的畫面在嘉義山區待了兩個禮拜，而且這還是台灣電影史上第一部以拉力賽和父子親\n情結合的電影，裡面所有的賽車畫面都是實拍，出現的車隊也都是真的，畫面中出現的賽車\n\
  手是真賽車手，不是什麼替身、臨演，包含演主角的演員陳澤耀本身也是位賽車手，現實中\n是多項飄移競速賽的冠軍，來自馬來西亞。\n\n整體畫面感非常流暢，我想這跟專業賽車手親自上陣有很大的關係，這邊不得不提一下這部\n\
  片金馬有拿下最佳動作設計的朱科豐指導(片尾還有紀念畫面QQ)，如果很愛賽車類電影，喜\n歡動作片，這部大推。\n\n\n裡面除了賽車之外，還有父子親情的設定，講一個引水員因為意外失去高薪工作變成保全，\n\
  又突然生活中蹦出一個兒子，講單親爸爸跟小孩的相處，還有孩子在學校受到排擠、霸凌等\n問題。亮點是正到不行的老師（邵雨薇飾演）\n\n如果是喜歡親情溫馨類，這裡面也有，想看正到爆炸的邵雨薇也可以考慮進場。\n\
  \n我個人最喜歡的是小孩的部分，演技很不錯，非常喜歡他和阿駿的互動，那種純粹的關心讓\n我非常感動，也是因為他的真心，最後才能連結爸爸和阿駿之間那種算是跨越年記的情誼吧\n\
  ；中間看到爸爸願意和阿駿一起比賽真的很感動，溫把一個因為跛腳而喪志的中年男性的樣\n態，詮釋的很到味，尤其那種不知道怎麼和突然掉下來的一個兒子相處的窘迫，體現的很好\n\
  。\n\n最讓我大爆的還是小男孩哭著說被子不能洗，有媽媽的味道，那個瞬間騙掉我一把鼻涕一把\n眼淚，真是後悔進場前忘了準備小包衛生紙，只能對不起我的衣角了。\n\
  \n總歸這部電影我認為很療癒人心，如果你現在失意、不如意，不開心，應該都可以從電影中\n獲得一些力量的。\n\n--"
