title: '[新聞] 【我和我的賽車老爸】88元預售票88節開賣'
content: '新聞網址：



  台灣影史首部結合拉力賽、親情、友情、勵志的電影《我和我的賽車老爸》，即將在9月8

  日於全台感動獻映。劇組今日（8/2）公開包含温昇豪、陳澤耀、陳少卉、邵雨薇等人齊

  力熱演的八張場面劇照，展現出不同氣氛的化學效應，吸引了人們的目光。此外，適逢父

  親節即將到來，劇組也將應景在台北、台中、高雄三地舉辦「父親節搶先看」特別活動。

  只見活動一開放報名後，就收到如雪片般的踴躍報名，不到一天時間便報名額滿，展現出

  本片廣受民眾期待的超強氣勢，這也讓劇組決定「加碼」再祭好康優惠，將在父親節當天

  （8/8）中午12點於全台ibon機台和ibon官方網站啟售「爸」氣無比的超值「88元父親節

  限定預售票」，數量有限，售完即止。而本片也將接力在隔天（8/9）開始，繼續開賣「

  單人預售票」及「雙人預售票」，提供民眾不同的購票選擇。





  由新銳導演張書瑋執導，兩屆金鐘獎最佳編劇得主溫郁芳執筆劇本的感人之作《我和我的

  賽車老爸》，在最新公開的場面劇照當中，以温昇豪、陳澤耀、陳少卉、邵雨薇為首，展

  現出充滿溫馨、愉悅氣氛的化學效應，吸引了人們的目光。首先，由温昇豪飾演的魯蛇老

  爸「大隆」，某天突然得知自己有個兒子「冬冬」（陳少卉飾演），也讓他在跟這位陌生

  兒子的互動過程當中，逐漸學習如何成為一位父親。再加上由陳澤耀飾演的失意賽車手「

  阿駿」，某天意外闖入這對父子的生活，三人於是展開一段不尋常的「同居」生活。可從

  劇照當中窺見三人一起組裝傢俱、逛夜市並作勢用熱狗「乾杯」，光是從劇照就可以感受

  到愉悅的氛圍。此外，也因為阿駿決定重返拉力賽事，讓有賽車夢的大隆，也決定成為他

  在比賽中的領航員，可從劇照中一窺兩人用心準備比賽的畫面，引發人們對本片劇情發展

  的好奇心。



  另一方面，猶如本片「嬌」點的氣質女星邵雨薇，也在片中飾演冬冬的班導師「康老師」

  ，光是以剪刀、菜刀、針頭等「凶器插頭」的鬼怪造型登場，就讓人好奇當下究竟發生了

  什麼事情，展現出非典型的愉快魅力。此外，也可以看見康老師帶著冬冬，兩人一同為即

  將參與拉力賽的大隆與阿駿祈福，展現出康老師截然不同的反轉魅力。





  值得一提的是，適逢父親節即將到來，以父子親情為主題的《我和我的賽車老爸》，也將

  應景在台北、台中、高雄三地舉辦「父親節搶先看」特別活動。當活動於上週五（7/28）

  開放報名之後，隨即收到如雪片般的踴躍報名，不到一天時間便報名額滿，展現出本片廣

  受民眾期待的超強氣勢，這也讓劇組決定「加碼」再祭好康優惠，預計在父親節當天（

  8/8）中午12點，於全台ibon機台和ibon官方網站啟售「爸」氣無比的超值「88元父親節

  限定預售票」，數量有限，售完即止。此外，本片也將接力從隔天（8/9）0點開始，於全

  台ibon機台和ibon官方網站繼續熱賣「230元單人預售票」及「450元雙人預售票」，提供

  民眾不同的購票選擇，預計將販售至9月7日晚間23:59結束，請民眾務必把握搶票良機。



  這部台灣影史首部結合拉力賽、親情、友情、勵志的電影《我和我的賽車老爸》，即將在

  9月8日於全台盛大獻映。本片劇情描述年幼的周宇冬（陳少卉飾演）因母親驟逝，被迫交

  給素未謀面的爸爸周大隆（温昇豪飾演）撫養。大隆在宇冬出生前便與妻子離異，又因受

  傷僅靠保全工作浮沉度日。如今意外扛起父職，父子自然摩擦不斷，直到放棄賽車的天才

  車手阿駿（陳澤耀飾演），某日因緣際會闖入了兩人的世界，反而成為彼此溝通的橋樑，

  讓這對父子逐漸找回屬於彼此的溫暖。不過阿駿也有自己不願面對的過去，他懷抱罪惡感

  所躲避的一切，反而給了他必須重返賽道的力量。而大隆為了回應宇冬的期待並證明自己

  ，也毅然決定跟阿駿共同搭檔挑戰拉力賽，再為自己的人生勇敢一回…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



