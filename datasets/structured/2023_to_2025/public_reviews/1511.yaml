url: https://www.ptt.cc/bbs/movie/M.1694272353.A.9F3.html
title: '[好雷] 我和我的賽車老爸：三個男人的同居生活'
content: '急！在線等！突然變成菜鳥單親老爸怎麼辦？



  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  《我和我的賽車老爸》由温昇豪、陳澤耀、陳少卉領銜主演

  單身跛腳大叔---周大隆(温昇豪飾)

  有一天接到一通電話，喜得一個"臭臉"兒子(陳少卉飾)

  面對不願打開心胸接受自己的陌生兒子…菜鳥老爸束手無策…

  直到他們遇到落魄的天才賽車手阿駿(陳澤耀飾)

  開啟了三個男人的同居生活，父子之間漸漸產生了變化…



  温昇豪，台灣最強的帥大叔，到現在我還是很喜歡他

  演渣男還不讓觀眾討厭，是個很厲害的演員

  這次飾演跛腳的中年男，真的有練如何跛腳走路…



  一家人一定要有血緣嗎？

  周大隆、阿駿兩個人生失敗組的男人

  遇到周宇冬這個孩子之後，意外改變了人生

  跛腳老爸為了兒子參加了卡丁車比賽

  過程中阿駿輔導周大隆開車技巧，獲得了第二名

  同居三個男人的感情，比有血緣的更親更緊密


  孩子都是看著父母的背影長大的

  一句「你知道周大隆喜歡吃什麼嗎？」

  原來一點一滴的生活互動

  臭臉兒子也漸漸從抗拒到認同這個陌生老爸


  因著比賽意外，天才賽車手阿駿對友人很內疚…一蹶不振...

  周大隆鼓勵阿駿回歸賽車，但此路困難重重…

  但他想給自己一個機會

  如果現在不做，以後自己一定會後悔



  《我和我的賽車老爸》三個男人互相救贖

  充滿親情與溫情，還有勇氣與熱血

  說真的去看這部題材勵志的電影之前

  我沒想到我會因為這三個男人就讓我淚灑影院QQ 大推這部啊！

  現在電影似乎沒有女主角更好看？


  --

  奇摩電影附的圖哈哈哈

  哈哈哈 想想的確也算不上大哭

  我這年紀也不會哭出聲，一般生活的物理攻擊早已免疫

  這是我這十幾年掉最多淚的時侯，才會覺得算大哭吧...

  片名怎麼取才會賣座？

  我沒帶衛生紙，還好影廳冷氣強自然乾XD

