title: '[新聞] 温昇豪、陳澤耀站台【我和我的賽車老爸】'
content: '新聞網址：



  台灣影史首部結合拉力賽、親情、友情、勵志的電影《我和我的賽車老爸》，28日晚間在

  第六屆馬來西亞國際電影節（MIFFest）舉行國際首映，並為電影節圓滿閉幕。本片早在

  電影節票券開賣後，即獲得觀眾熱烈搶購，男主角温昇豪也在百忙之中特別飛往吉隆坡，

  與另一位男主角陳澤耀合體，共同現身戲院跟全場兩百位觀眾進行互動。不僅如此，温昇

  豪睽違七、八年再度光臨馬來西亞，身為馬來西亞人的陳澤耀更化身「領航員」，做東道

  主招待温昇豪體驗馬來西亞最道地的雞翅膀、魔鬼魚、椰子水等美食。值得一提的是，温

  昇豪更首度大膽嚐鮮「蛇皮果」，另類風味讓他一度露出耐人尋味的表情，讓陳澤耀誇他

  如片中角色一樣：「很有冒險精神！」《我和我的賽車老爸》預計將在9月8日於全台盛大

  獻映。





  由温昇豪、陳澤耀、陳少卉領銜主演的《我和我的賽車老爸》，繼日前台北電影節世界首

  映之後，再度勇闖國際，強勢獲邀成為第六屆馬來西亞國際電影節「閉幕片」，也是該電

  影節舉辦至今，第一部入選為閉幕片的台灣電影，意義十足。電影節主辦單位更盛讚本片

  ：「將帶您踏上一場穿越父子之間錯綜複雜關係的情感之旅。引人入勝的故事，超越了激

  增的腎上腺素，強調出韌性、毅力和不顧一切永不放棄夢想的價值觀。在夢想受到挑戰的

  世界裡，無論路上有什麼阻礙，本片是永不投降的有力證明。」



  温昇豪與陳澤耀也現身28日的閉幕放映，跟在場兩百位觀眾進行互動。只見不少觀眾被本

  片溫馨的情節逼出感動的淚水，讓温昇豪率先表示：「這次我飾演的『周大隆』，生命中

  突然闖入了一個小孩，從一個一籌莫展的爸爸，再到成為阿駿的領航員，兩者都是一個互

  補，把不圓滿的變圓滿，試圖把生命的拼圖給慢慢填補出來，是一種成長的過程。」本身

  就是賽車手的陳澤耀也表示，當初接到這部戲時就已經很興奮；而他之前演出的作品，都

  是比較內斂、沉重的角色，這次再度挑戰類似角色，陳澤耀表示：「雖然我的演藝事業看

  起來一帆風順，但也經歷過很多。這次角色的經歷，不是我在現實生活中會體驗得到，所

  以都靠寫日記的方式來走入阿駿的世界。很感謝昇豪哥在片場給予的指導及帶我入戲，讓

  我有種戲裡戲外都找到相信我的人的感覺。」





  不僅如此，兩人在《我和我的賽車老爸》與童星陳少卉有許多互動演出，他們笑說有「三

  人行」的畫面，周大隆是爸爸，而阿駿就像媽媽一樣，陳澤耀聽見後也忍不住自侃：「我

  是後媽。」他更繼續補充：「最近跟昇豪哥拍照時，都有粉紅泡泡的感覺。」温昇豪聞言

  更笑稱：「真的有這種感覺耶！」兩人逗趣畫面惹笑全場。另外，温昇豪也喊話：「希望

  大家多多幫我們宣傳這部片，在社群廣發，下次我們才可以有更大的（賽車場面），《我

  和我的賽車老爸》也可以有Part 2！」他也笑說：「就像電影中從電玩到卡丁車，再到拉

  力賽，下次我們再進階到F1。」兩人最後在影廳外的背板拍照時，更被熱情觀眾團團包圍

  索取簽名合照，差點無法離開，也展現出兩人在馬來西亞的超高人氣。





  由於温昇豪難得前往馬來西亞，本身就是馬來西亞人的陳澤耀也化身「領航員」，趁電影

  節空檔帶他體驗馬來西亞最道地的美食，包括雞翅膀、魔鬼魚、印度煎餅、椰子水等。已

  有七、八年沒有來到大馬的温昇豪，之前對大馬各種族文化交融的情景特別印象深刻，加

  上一直很掛念大馬美食，所以舊地重遊也異常興奮，化身「遊客Mode」在雙塔樓拍照打卡

  之外，途中也有不少民眾認出他，他也親切地跟大家打招呼及合照。



  尤其當温昇豪逛到路邊水果攤，看到外表十分獨特的「蛇皮果」時，好奇心大發，更主動

  提出要嚐鮮看看，讓陳澤耀說：「因為台灣沒有蛇皮果，他一看到就說要試試看，他真的

  很有冒險精神！」温昇豪也指出蛇皮果的味道，就像台灣的菠蘿蜜，雖然味道偏苦澀，可

  是卻有另一種風味。陳澤耀之後也帶温昇豪再去品嚐「水果之王」榴槤，更稱：「來到馬

  來西亞怎麼可能不吃榴槤呢？」把領航員這個「職務」做得盡善盡美，也讓他笑言：「這

  次我帶昇豪哥到處走，下次去台灣，換他來當我的領航員了！」



  這部台灣影史首部結合拉力賽、親情、友情、勵志的電影《我和我的賽車老爸》，即將在

  9月8日於全台盛大獻映。本片劇情描述年幼的周宇冬（陳少卉飾演）因母親驟逝，被迫交

  給素未謀面的爸爸周大隆（温昇豪飾演）撫養。大隆在宇冬出生前便與妻子離異，又因受

  傷僅靠保全工作浮沉度日。如今意外扛起父職，父子自然摩擦不斷，直到放棄賽車的天才

  車手阿駿（陳澤耀飾演），某日因緣際會闖入了兩人的世界，反而成為彼此溝通的橋樑，

  讓這對父子逐漸找回屬於彼此的溫暖。不過阿駿也有自己不願面對的過去，他懷抱罪惡感

  所躲避的一切，反而給了他必須重返賽道的力量。而大隆為了回應宇冬的期待並證明自己

  ，也毅然決定跟阿駿共同搭檔挑戰拉力賽，再為自己的人生勇敢一回…。



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
