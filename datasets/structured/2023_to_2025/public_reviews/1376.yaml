title: '[  大雷] 《哆啦A夢 大雄之宇宙英雄記》'
content: '22號晚上有幸去看特映會，


  有鑑於之前有看過《STAND BY ME》，所以對多拉A夢的電影還算感興趣，


  至於該給什麼雷……說實話我還真不知道，


  不過可以確定的是，







  它一定是普遍級 ＝ ＝




  ───────────── 提早出現的防大雷區 ─────────────























  故事從目前最火熱的卡通《銀河防衛隊》開始，


  幾乎是每個小孩都愛看（女生不一定），連多拉A夢也是，


  大雄看完卡通後，決定跟大家一起拍一部英雄電影，


  熟不知小夫的爸爸早就買了一部專業攝影機給他，


  也跟胖虎、靜香一起在後山拍攝；


  得知消息的大雄跑到後山，結果只落得演「宇宙怪獸大雄」的角色，


  哭著回去找正在房間cosplay《銀河防衛隊》隊長的多拉A夢，


  多拉A夢知道他們在拍片，便很高興的拉著大雄一起過去。



  到了後山，多拉A夢故意嘲笑他們拍攝手法粗糙，


  拿出道具「漢堡導演」讓他們體驗，胖虎覺得過癮要求多拉A夢一起拍，


  但多拉A夢提出兩個前提：他要演隊長，還有讓大雄參預演英雄。


  胖虎一開始不肯，小夫悄悄說以後再請導演重拍換隊長就好，


  終於最後五個人都可以成為開拍電影的英雄。



  多拉A夢用道具強化他們的服裝，讓大家擁有超人的能力，


  共同對付由玩具恐龍變成的大恐龍；


  同時，在旁邊的洞窟，一個外星人正在修著壞掉的大空船，


  修好後發現外面很吵，出去一看是五個人在對付怪物，


  戰鬥結束後跑過去拜託他們救救他的星球，一行人以為是漢堡導演的編劇，


  答應前（ㄆㄟˋ）去（ㄏㄜˊ）拯（ㄧㄢˇ）救（ㄔㄨ），


  跟著一起搭大空船前往他的星球。



  飛行過程中，外星人說他是「波庫爾星」的治安官‧亞隆，


  某天他的星球來了一台號稱是宇宙合作公司的太空船，


  說要來幫助開發他們的星球（事實上也做了），但真正目的是什麼還不知道；


  他冒險潛入建設中的宇宙塔，才知道原來他們是三個宇宙海盜佯裝的，


  其背後還有幕後黑手，


  跟他們「合作過」的星球都沒有好下場，


  偵查的時候不小心被保全發現，搭乘太空船逃跑時被擊中，經由空間跳躍到達地球，


  還好有銀河防衛隊願意幫他，他覺得很感激。



  到這裡，大雄一群人還認為這是漢堡導演的安排，


  直到抵達星球，和第一批保全展開戰鬥後，


  才知道原來這是真實世界，而不是虛擬空間，


  比較有正義感的大雄決定要繼續幫助這個星球，


  一群人便打起精神繼續對抗，輕鬆獲勝。


  最後他們決定兵分三路去找背後的陰謀，


  有主角威能的大雄誤打誤撞，發現宇宙塔底下的不明裝置，並稍微知道這東西的作用，


  但因為被海盜發現，除了多拉A夢、靜香跟漢堡導演以外的人都被抓住，


  多拉A夢發現了大雄遺漏的英雄胸章，研判應該發生了什麼危險，


  藉由漢堡導演的能力找到地牢並且救了出來，


  並且知道該裝置是要吸收波庫爾星的能量，並去破壞號稱「波庫爾星太陽」的星星，


  該星外層是由鑽石組成，內部是非常純跟高級的石墨，而BOSS需要石墨讓他恢復。



  被救出來的眾人心灰意冷，小夫吵著要回地球，


  最後大家還是決定保護這個星球，


  多拉A夢再幫大家強化，讓每個人都可以用超級必殺技，


  一行人決定再出發去阻止宇宙海盜的野心；


  結果三個宇宙海盜根本就變得跟渣一樣，大雄又誤打誤撞的傳送到BOSS的宇宙船，


  也很「不小心的」發出超必殺技，打倒了BOSS，


  但在星球上裝置無法阻止跟破壞，唯一的方式是在海盜宇宙船找到開關並破壞它，


  時間剩10分鐘，海盜宇宙船在距離35萬公里的地方，根本來不及，


  此時大雄傳送回星球，大家發現他可以瞬間到船上，趕緊傳送過去，


  在最後幾秒鐘，被打回原形沒掛的BOSS按下開關，


  裝置成功發射，並且開始破壞鑽石星星。



  - BAD END -
























  不，才不是這樣子咧 ＝ ＝



  多拉A夢用凝固槍 + 放大燈暫時阻止破壞，但只能維持五分鐘，


  在眾人無技可施的情形下，


  大雄突然說可以用漢堡導演的倒退功能回到發射前的樣子，


  成功解救了這個星球，全片結束。




  整部片就是很標準的多拉A夢大腸，咳，大長篇，


  不斷強調友情、勇氣，以及大雄的倒楣（？）


  不過多了很多搞笑細節，這邊不爆雷詳述，


  很多片段都逗得全場哈哈大笑，


  是真的很適合全家大小一起看的電影。


  --'
