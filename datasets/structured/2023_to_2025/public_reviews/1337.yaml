url: https://www.ptt.cc/bbs/movie/M.1698414997.A.439.html
title: '[好雷] 超危險保鑣--化敵為友'
content: "雷文防雷資訊頁\n \n \n分類在動作喜劇\n預告看起來也不錯\n很久沒PO文了\n以下多劇情雷\n慎入\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \ \n \n \n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n \n劇情:原本是特種部隊的約翰因某次任務失敗退休當了律師，某日好友找他當保鑣\n\
  \     但卻是護送一名記者到當年任務失敗的目標旁去做採訪，帶著複雜心情的他\n     上路了，旅途上三台車開一起一定會爆炸的定律下，真的又爆了，\n  \
  \   開始一路的躲藏，叢林到部落再回到首都，旅途中專訪總統到底為何要獨裁\n     而不開放民主，同時也解開了當年任務失敗背後真正的主因，\n     回到首都在一陣槍林彈雨後，帕多尼亞也正式往民主國家的路上邁進。\n\
  \ \n劇情其實蠻寫實的，在述說一個有著豐富天然資源的落後國家，身為一個國家領導\n如何為自己的國家及人民爭取最大的權益，從情搜到買通反政府分子到暗殺，現實\n\
  不也歷歷在目，不斷真實的發生在我們生活的世界上?只是我們幸運的不在那些地方。\n \n嘈點:\n一、追逐、槍戰、近身格鬥都只能說普普。\n二、在叢林被直升機追殺那段，太刻意了，主角怎麼被打都不會中的光環開太久。\n\
  三、約翰拿起槍慢動作掃射那段真是兼具效果跟笑果。\n四、反派首領被戳喉嚨沒補刀是在哈囉?\n \nBTW:影片後的彩蛋必看，必看，必看。\n \n結論:近期沒甚麼進影廳，算是中上約85分的程度吧?推薦假日可入場支持。\n\
  補充:個人很喜歡這部片總統的人設。\n--\n個人定位是劇情片。"
