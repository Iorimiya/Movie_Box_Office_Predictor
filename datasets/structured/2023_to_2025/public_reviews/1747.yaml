url: https://www.ptt.cc/bbs/movie/M.1680683896.A.CF5.html
title: 'Re: [請益] 鏡之孤城感情線疑惑（有雷）'
content: '大概回一下這篇


  原作裡小心跟理音算是CP嗎？


  其實不算 小心跟理音的互動在原作中跟其他七個人沒有太多的差別


  電影也沒有強行加戲 只是因為時長的關係電影更強調了心和理音的互動 但也沒有幫他們加

  太多新劇情

  跟原作不一樣的點大概是理音沒跟其他人提過姊姊還有狼小姐的事 電影都會讓心在旁邊參

  與


  那原作中心對理音有意思嗎？

  可能多少有一點 原作中也有一小部分心看到理音會有點臉紅 會比較在意理音想法的片段

  但比較像是對同屆的帥哥會有點小憧憬的那種感覺 而且理音對心的態度跟其他人基本一樣


  原作對小心的內心描寫非常細膩

  在開頭前幾個月的部分 她因為霸凌還有拒學的問題承受的精神壓力真的很大 原作裡的小心

  是那種更小心翼翼的感覺 她很在意鏡城裡其他人的言行 老是擔心自己的一舉一動會被別人

  討厭

  這種心理狀態下我覺得她其實沒什麼時間思考男女情愛XD


  我在某篇推文有說過 小心最需要的其實是那個會在人群中堅定走向她的朋友 這也反映在她

  鏡城的房間裡 房間不代表她有多喜歡童話 而是代表了東條萌對她有多重要（也反映了被背

  叛後對她的傷害有多大


  所以這其實是一個很優秀的、呼應開頭的場景 理音在人群中朝她走來 只是因為電影整體營

  造的關係變得好像CP感很重


  我自己覺得東條代表了幾個意義 首先是受歡迎的小孩子比較不容易被霸凌 心也提過能跟東

  條這麼可愛的女孩子成為朋友很讓人開心

  第二個是如果你沒有對被霸凌者伸出援手 你也很可能成為下一個被霸凌的對象 東條是我覺

  得最貼近正常人的人物 她因為擔心自己的人際關係所以疏遠了小心 但又因為罪惡感每天幫

  小心送資料 在學校看到難得出現的小心卻不敢打招呼 最後也把整個事件告訴了喜多嵨老師

  小心離開後她淪為下一個被霸凌者 但因為自身經歷加上又要轉學讓她能更容易地克服整件

  事

  很喜歡她最後那句 以後我要直接說出喜歡或討厭  最後說的“可能每個班級都需要她那種

  人”也很有意思


  最後講講被電影省略掉的理音課題 實生的去世對理音母親的打擊非常大 甚至曾對理音說過

  “你那麼健康 為什麼不能分一半給你姊姊”

  就算理音足球踢得再好 大部分時間他還是被母親無視

  理音畢業後 她母親不顧父親和理音的反對 堅持要送他到夏威夷深造足球 理音才理解了“

  原來她希望我消失在她的視線”這件事

  原作中沒有很清楚的提到母親後來心境的轉變 但結尾的意思應該是走出實生去世的陰影了

  小說前半對理音的人物描寫是最少的 這段很好的補足了他角色刻劃比較不足的部分


  對我來說鏡之孤城是七個人還有狼小姐的故事

  每個人都一樣重要 電影因為時長劇情只能集中在幾個人身上

  在讀原作的時候 你能知道小心最後一定會去救大家 因為他們是夥伴 是這幾個月牽絆的累

  積

  電影給我的感覺反而是找完了鑰匙大家才真正凝聚起來 這是我覺得比較可惜的部分


  手機發文有點難排版 回家再修一下XD



  ----

  Sent from on my Samsung SM-S9010


  --'
