title: '[討論] 薩爾加多的凝視/鏡之孤城 iTunes NT$90起'
content: "《薩爾加多的凝視》\niTunes NT$90\n>> \n\n《擁抱遺忘的過去》\niTunes NT$80\n>> \n\n《里斯本的故事》\n\
  iTunes NT$190 (4K)\n>> \n\n《我的完美日常》充分運用音樂、閱讀、人際互動描述役所廣司當清潔工\n度日的日常寫照，展現文溫德斯拍片足以勇奪日本金像獎最佳導演的本領\n\
  。正好有上列三部特價作品，可深入理解溫德斯受人推崇的獨特風格。\n\n《薩》片聚焦攝影大師塞巴斯提安薩爾加多長年往各國冷僻地帶探索留影\n拍照的背後思考、《擁》片藉詹姆斯法蘭科受深夜交通事故難以挽回的傷\n\
  痛逐步探究重新面對與省思的重要、《里》片跟上魯迪格福格勒持收音器\n材踏入尋人歷程而順勢看透里斯本的美好。\n\n《武士搬家好吃驚》\niTunes NT$90\n\
  >> \n\n《搖滾師匠：細野晴臣》\niTunes NT$90\n>> \n\n《春宵苦短，少女前進吧！》\niTunes NT$90\n>> \n\n日本明星星野源跨足影視、歌唱都有亮眼表現。《武》片同高橋一生等人\n\
  面對資源有限投入大型遷城計畫，玩出輕鬆幽默的時代劇情節。《搖》片\n則首次挑戰旁白解說，幫樂壇大師細野晴臣出道五十週年回顧有所加分。\n《春》片配合名導湯淺政明慣用的奇妙動畫風格，和花澤香菜共同聲演奇\n\
  幻無比的追愛情節。\n\n《鏡之孤城》\niTunes NT$250\n>> \n\n翻拍直木獎作家辻村深月同名暢銷書店大獎認證小說，入圍安妮動畫影展\n長片競賽！導演原惠一維持執導《蠟筆小新》劇場版「風起雲湧」三部曲\n\
  細膩刻劃的精神，將受邀住鏡中城堡的七名國中生，面對找關鍵鑰匙許願\n換來流失共處記憶的代價，逐漸描繪發自內心的痛苦與不捨，更強調保握\n相處時光的寶貴。\n\n\
  ☆ 其他特價\n\n《電影版 吹響吧！上低音號～莉茲與青鳥～》\niTunes NT$150\n>> \n\n《電影版 地獄少女》\niTunes NT$190\n\
  >> \n\n《酷愛電影的龐波小姐》\niTunes NT$190\n>> \n\n==\n\n訂閱電影優惠樂搜搜 Telegram 頻道立即收到通知：\n\n\
