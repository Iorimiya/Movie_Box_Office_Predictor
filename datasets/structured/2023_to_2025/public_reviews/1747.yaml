url: https://www.ptt.cc/bbs/movie/M.1686920263.A.F85.html
title: '[新聞] 《鏡之孤城》6月21日全台特別上映原創影'
content: '新聞網址：


  日本動畫電影《鏡之孤城》改編自書店大賞冠軍作品，在日本和台灣上映後，感動的好評

  聲浪不斷。台灣3月31日上映後好評熱賣近2300萬票房，劇情描述就讀中學的小心，與有

  著類似際遇的6名國中生，來到了神秘的鏡中世界，為了在期限內找出可以實現願望的鑰

  匙，7人的關係愈來愈緊密，彼此認識與陪伴，故事發人省思，觸及人心，為了呼應電影

  《鏡之孤城》中的城堡於5月「開城」，日本於今年5月舉辦特別上映，於電影片尾特別加

  映由原惠一導演全新製作《鏡之孤城》完全原創特別映像。本次台灣電影公司車庫娛樂也

  特別爭取，呼應《鏡之孤城》中女主角小心於6月「二次進城」，特別於6月21日起舉辦《

  鏡之孤城》全台特別上映，片尾同樣會特別加映「原惠一導演全新製作《鏡之孤城》完全

  原創特別映像」，邀請觀眾跟小心一起二度進城。不僅如此，為迎接《鏡之孤城》全台特

  別上映，本次特別上映也會贈送全新影城入場特典【電影特製銀箔鏡面票卡】，只要購買

  《鏡之孤城》電影票1張，即可兌換領取【電影特製銀箔鏡面票卡】1張。共2款隨機發贈

  ，數量有限，送完為止。《鏡之孤城》6月21日起於全台特別上映，再度開城！


  對於全新製作《鏡之孤城》完全原創特別映像，導演原惠一表示，「這次請來宮崎葵小姐

  擔任旁白，是由我想出來的。『沒有什麼命中注定』這句話既不是原著小說中，也不是電

  影中使用過的台詞，但是當我事後思考為什麼要使用這句台詞時，發現它是我最喜歡的電

  影中所用的台詞。」此外，他也透露在特別影片中加了一些小驚喜，推薦觀眾可以多看、

  多享受。為主角小心配音的當真亞美也分享自己的感想：「小心和理音的故事在那之後也

  持續發展，令我興奮不已。」


  《鏡之孤城》不僅票房、口碑都擁有好成績，還受到海外影展關注，並入選安錫國際動畫

  影展的競賽部門。對此，導演原惠一表示，「不管是在日本還是海外，喜歡的橋段都是一

  樣的，不同的是觀賞時的反應。日本觀眾通常比較安靜，而海外觀眾會在放映期間鼓掌，

  所以在海外放映並且得到與日本不同的反應，我覺得既新鮮又高興。」《鏡之孤城》6月

  21日起於全台特別上映，再度開城！


  --'
