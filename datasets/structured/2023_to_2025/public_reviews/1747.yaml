  厚友情。\n\n《限時追捕》\n◎ iTunes 立即看 NT$390 >> \n◎ Google Play 立即看 NT$350 >> \n\n《生命中最抓狂的小事》英國電影學院獎名導達米安斯基弗隆嘗試懸疑題\n\
  材，進軍好萊塢！拿無差別攻擊波及多人、當場線索提供有限為起點，話\n題明星雪琳伍德利演起飽受心理折磨的警察，不巧跟案件主謀擁有相同思\n維，給 FBI 招募隨人組隊探求背後真相。\n\
