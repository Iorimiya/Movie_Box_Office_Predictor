url: https://www.ptt.cc/bbs/movie/M.1680252198.A.71C.html
title: '[好無雷] 鏡之孤城'
content: "「不會讓你一個人。」\n\n\n                           「我們不是孤單一人。」\n\n\n           \
  \             「沒事的，你不是一個人喔。」\n\n\n\n                      真心的陪伴，是對孤獨者最好的救贖。\n\n\n\
  \n              ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n沒看過小說，一開始不知道這電影的存在\n\
  \n看預告也沒有特別吸引我，只覺得音樂很好聽\n\n但是一個留學日本的好朋友看到台灣確定上映，就特別大力的推廣\n\n恰好3/31休假，就訂了票看早上第一場了\n\
  \n\n\n\n\n可能因為跟太多大片撞檔期\n\n這次新光跟威秀都只開一個廳，最後選新光\n\n結果7廳的銀幕上面有很多一條條的痕跡，雖然看到中間就沒特別去注意了\n\
  \n但前面較亮畫面的時候看到那痕跡真的很不爽= =\n\n\n\n\n\n有送海報，本來以為跟鈴芽一樣是中文的，結果是送日文原版海報，加分\n\n\n\n\n\n\
  看完的感想\n\n個人覺得鏡之孤城是我這幾年看過最好的動畫電影\n\n甚至不輸給君名（個人排序：君名>天氣>鈴芽）\n\n\n在畫面的繪製上雖然就中規中舉，沒有新海誠那麼華麗的畫面\n\
  \n但劇情完整，敘事手法乾淨俐落，意象表達明確\n\n雖然前面鋪陳稍微有點沉悶，但後面的畫龍點睛相當精彩\n\n\n\n音樂表現上也相當出色，各情節搭的音樂都很合適\n\
  \n除了主題曲外，私心最愛這首\n\n\n\n\n\n\n\n撞期鈴芽跟捍衛4真的很可惜\n\n從宣傳跟影院給的時段廳級都看得出對這片票房預估不佳\n\n也許題材真的看起來不吸引人\n\
  \n但個人覺得這部真的不會輸給鈴芽，只是輸給了新海誠的名氣\n\n\n\n\n\n希望之後會有上IMAX或DOLBY廳的機會\n\n\n\n\n--\n\n真的雷=\
  \ =\n\n\n\\|/\n\n\n畢竟沒看過，評斷肯定是不會跟小說比\n就純粹看一個電影的劇情來講，沒啥看不懂需要特別去補小說的問題\n\n也許補完小說會有不同看法，但應該更多人是沒看過小說的\n\
  \n\n\n借用別版的圖"
