title: '[情報] 《鏡之孤城》正式預告'
content: '書店大賞史上最高票奇幻神作改編


  《》3/31(五)感動獻映




  「不會讓你孤單一個人。」


  正式預告




  更多資訊





  改編自  2018書店大賞冠軍原著小說


  《蠟筆小新》《河童之夏》資深動畫導演  執導


  新生代女星  千人海選脫穎而出，擔綱女主角


  超人氣男星  聲演爽朗少年


  《》新生代女星  再次挑戰動畫電影


  《》、《》


  等資深聲優熱情獻聲


  齊聚 、、


  等一線演員豪華共演


  《我們仍未知道那天所看見的花名。》


  動畫公司A-1 Pictures傾力打造


  超人氣創作歌手  獻唱主題曲


  第46屆日本奧斯卡 優秀動畫作品


  第52屆鹿特丹國際影展 Limelight單元


  當所有的謎團解開時，超乎想像的奇蹟將等待著你…



  就讀中學的小心，在學校遭受排擠而變得足不出戶，整天關在房間。就在某一天，房裡的

  鏡子突然綻放起神秘光芒，被吸入鏡中的小心，出現在她眼前的是童話故事中的城堡，以

  及6位素未謀面的國中生。


  帶著狼面具的少女「狼小姐」出現在7人面前，告訴他們是被選中的7個人，並且在城堡裡

  藏有一把鑰匙，找出鑰匙的人，就可以實現任何一個願望。


  時限為1年，在共同尋找鑰匙的期間，7人也愈來愈了解彼此，就在城堡逐漸變成7人特別

  的居身之所時，某起事件卻朝著他們來襲…



  資料來源：


  --'
