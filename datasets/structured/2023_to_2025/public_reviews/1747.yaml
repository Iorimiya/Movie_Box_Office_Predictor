url: https://www.ptt.cc/bbs/movie/M.1680939316.A.1FC.html
title: '[討論] 鏡之孤城 之鬼父米粉面罩'
content: '防個雷好了，雖然只有一點點。













  ----------------


  先附上人權 XD




  雖然說「鏡之孤城」對小說黨來說會覺得角色描寫不足，但我都是隨便看。

  感覺不要太考究的話其實製作不錯。


  心遇到的困難與壓抑完全能從畫面以及配樂傳達到觀眾內心。


  也可以感受到城堡成為眾人走出孤獨的一個中繼場所。



  ………


  不過討論劇情不是本文目的…

  我想問的是：



  早上再刷時發現繼父準備對小晶%%%時，臉上馬賽克好像縮短遮蔽時間了耶！


  我記得上週看都是從繼父進房、關上門的那瞬間就開始遮了。

  但今天卻是在之後（好像是按掉電話那邊，不太記得）。


  有沒有人注意到這點？



  是說這到底為什麼要遮？


  今天看疑似沒遮的也就靈堂臉配死魚眼，

  表情是會比須鄉噁？？


  有沒有人有相關八卦？



  -------------


  我這次看才發現片頭躺在白床上的原來是姊姊啊！


  --'
