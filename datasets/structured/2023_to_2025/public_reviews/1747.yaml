  大金尼獎十一項殊榮！集結麥可法斯賓達、維果莫天森、綺拉奈特莉，以\n精神科醫師卡爾榮格接觸患者作為契機，逐漸陷入情慾、婚姻糾纏的困境\n，又針對導師佛洛伊德產生歧異。\n\
