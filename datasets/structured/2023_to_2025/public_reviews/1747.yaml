  程增添熱血動人的渲染力。\n\n《神鬼第六感》\n◎ iTunes 立即看 NT$390 >> \n◎ Google Play 立即看 NT$350 >> \n\
  \n《點燃生命之海》奧斯卡得獎編導亞歷山卓亞曼納巴獻上恐怖力作，橫掃\n哥雅獎八大獎！影后妮可基嫚顧慮孩子得病無法接觸陽光，選擇帶他們住\n進孤島豪宅相處，但沒料到屋內出現離奇現象，造成妮可前期排練一度壓\n\
  力過大，差點提出離開劇組的請求。\n\n==\n\n訂閱電影優惠樂搜搜 Telegram 頻道立即收到通知：\n\n\n電影優惠樂搜搜粉絲團：\n\n\n--\n\
