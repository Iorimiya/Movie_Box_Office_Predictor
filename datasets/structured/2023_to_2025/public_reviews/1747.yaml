  甚至讓主角心可以遇到理音 而在最後回到學校去當她的朋友 完成她最初的願望


  總之是個沈重的主題 看不出來作者希望透過這樣的故事找到什麼解答

  雖然有喜多鳩老師的角色

  但也許在日本的社會氛圍下普遍情況就是沒有辦法解決的


  以上。一點心得



