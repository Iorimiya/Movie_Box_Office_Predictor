url: https://www.ptt.cc/bbs/movie/M.1680451583.A.DCB.html
title: '[好雷] 鏡之孤城 一些印象深刻的思考點/搞笑點'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~


  感想已經劇透結局，若不想被雷道請左轉













  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  我用列點式的方式敘述，因為我自己比較好奇從人際關係、人性本具的愛與隸屬需求來看


  ，大概就扣緊一些重點而有些零散的想法，也好奇版友對這些點的想法：


  1.一起在城堡裡吃蛋糕，好像沒什麼，卻是支撐眾人面對現實的回憶，勇氣的來源


  2.ㄟ.....主角沒做什麼事在找男友，卻在城堡的大冒險中，交到了夏威夷外掛男友


  好結局版的「我心目中的那個耀眼的他，有一天會來找我」 (東遊記：!?)


  而霸凌者真田，整天想找男友卻面臨男友離開，還被曾經攻擊的人帶回外掛男友逆襲！


  小心應該這次帶了男友，會比較有自信面對了吧XD??


  ㄟ小心理音不一定會變成情侶，就當我的期待吧XD


  話說那個夏威夷踢足球，是不是在致敬柯南啊XD  什麼都去夏威夷學就好了



  3.在現在與未來的循環中彼此救贖，城堡的小心現在時間線救了過去的晶子，


  現實的老晶子線(過去晶子的未來)救了現實的小心



  因為彼此內心的傷口與願力，連結了彼此，沒有很明顯的說教，但細想也有點


  心理治療學派的榮格學派的味道，大概是，一位助人者，藉由更深刻的覺察自身傷痛，


  在心靈的更深處與更大的整體連結，而成為更能理解負傷與療癒兩端的助人者。


  助人者也曾經被幫助，才成為今天的樣子。



  4.本片心理素質最強是誰？我想到 東條萌，

  萌：我說你們四個，都是XX，衝著我來我也不會拒學！ 還無意間幫助解謎了鏡之孤城


  可說是本片中，不顯眼但非常重要的配角，我知道理音線也十分亮眼，大概也猜到


  鏡之孤城是由理音姊死前的願力所形成，但東條同學的心理素質、氣場讓我覺得特別強XD


  不用進入城堡、不用求助或是藉由朋友的連結來面對本片惡役，


  硬扛，一打四沒在怕，雖然看得出來多少心裡還是有受傷



  5.許願的意義，進入城堡，或許是帶著某種現實的願望進來，晶子特別明顯，殺死那位


  男性長輩，願望常常跟某人、跟某段人際關係有關，卻也在城堡中形成新的人際關係，


  也形成新的願望！我看本片前，略略看到有人說這部連配角都寫得完整，我十分同意


  也正是因為腳色彼此都有故事，那種連結感最後一起爆發時，我有QQ



  簡單講，許願常常是為了某個人或自己，卻也在城堡中遇見新的人



  6.跟鈴芽之旅作比較，我想也有人說過，我個人感想是，鈴芽真的畫面、音樂很強，

  但我記憶點沒有很明顯，看解說後有多一點了解劇情。


  鏡之孤城看完後，後勁蠻強的，回想起安心教室就發現是某個伏筆，不過鏡之孤城的

  音樂、畫面我倒是記憶點比較少，大概是說兩部各有千秋。


  兩部片都跟創傷有關。


  --


  大概是感受會保留，這可能漫畫還是小說會比較明顯 我覺得電影就沒多說了


  謝謝tim版友的分享，感謝你帶來東條心中動搖的資訊，我的觀感主要從電影來的


  有些差別我想也是蠻正常的，我覺得東條心理素質相對強，是相對於鏡中七人來說的，


  或是相對一般人，就電影而言，風歌、政宗是因為個人興趣而不被同學認可而拒學，


  東條本身就有爸爸是教授這個光環，可能表現出來就是會讀書的樣子？


  所以被霸凌四人組認為東條看不起她們。


  在小心被排擠時，東條還願意每天幫送學校文件，這個行為我覺得有某種堅強。


  至於後來實際上自己被排擠，東條給我的感覺是，沒有想拒學，也是多少受到傷害


  但還能思考如何反擊與表達，而鏡中七人的風歌與嬉野、政宗，相對上如何去面對同學，


  感覺表達能力就比較受限？




  這個部份我想也是大家的懸念，設定上電影沒講太清楚，大概就是記憶會消掉，


  感受會殘存？這個tim版友帶來的小說資訊也有一些透漏


  我同意spp大，吃蛋糕在電影中沒太特別表現，但後來回想感覺蠻溫暖的




  電影中，晶的願望確實一開始不清楚，後面才講而已



  晶好慘啊QQ'
