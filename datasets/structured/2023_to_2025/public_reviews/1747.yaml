url: https://www.ptt.cc/bbs/movie/M.1680362796.A.583.html
title: '[好無雷] "鏡之孤城"無雷心得'
content: '這是一部小說改編的動畫版電影，主旨圍繞在孤獨與自我認同上，不得不說心理健康

  相關的議題真的有夠沉重，但努力撐下去看到結局還是會有讓人振作起來的感覺的，我覺

  得一般人應該都挺容易哭的，看的過程一直起雞皮疙瘩，應該是感動的關係，一開始充滿

  謎團的情境也營造的很有氣氛，雖然答案算挺好猜的，接近兩個小時的片長，但整體的故

  事內容非常豐富，所以還是會覺得有一點倉促(除了女主角走路很慢這點讓人有點不耐)，

  尤其聽到一些原著粉的吶喊，認為沒有完整呈現小說的細節跟交代所有角色，但以我沒看

  過原著來說，覺得故事主架構其實挺完整的，因此認為瑕不掩瑜，片中音樂也很好聽，畫

  面都很精緻，是一部很值得一看的電影，覺得自認有點宅的人都挺適合看的，在多年後應

  該也會是很經典的動畫電影，推薦給大家。



  --'
