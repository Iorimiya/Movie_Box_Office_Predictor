title: '[好雷] 鏡之孤城 一點心得'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~













  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  一直蠻喜歡日本動畫這種日常感又帶點奇幻風格的

  在看電影之前只大概知道是小說改編, 跟霸凌有關的作品

  就決定衝去看了

  雖然自己對霸凌的情節沒有產生太多共鳴

  然後剛開始看到女主角的願望只是想要討厭的同學在世界上消失

  會覺得這個願望不愧是國中生會想得到的

  但電影越到後面

  突然覺得, 其實許多生活中覺得簡單的小事情

  也許對某些人來說

  是天塌下來的壓力

  像女主角一樣

  我也不太敢把自己害怕或是煩惱的事告訴身邊的人

  深怕會被嘲笑, 或是被認為軟弱


  在小晶寧願躲在衣櫃裡面被狼吃掉

  也不願回去現實世界面對

  看到這邊真的是蠻有感觸的

  讓我想到有些人會嘲笑新聞裡自殺的人

  說為了一點小事就自殺真沒用什麼的


  還好主角最後救到了小晶

  然後我後知後覺的發現原來小晶就是之後的喜多嶋老師

  這種互相幫忙的設定我很喜歡


  在現實生活中, 應該很難遇到這種像喜多嶋老師一樣

  願意打從心底支持你的人吧

  雖然看完沒有大哭, 但回家的路上心裡悶悶的

  一直在思考著不想要與喜歡的事情, 要大聲說出來這件事真的是對的嗎?


  整體還是推薦給大家看


  --'
