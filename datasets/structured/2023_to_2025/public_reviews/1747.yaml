url: https://www.ptt.cc/bbs/movie/M.1677556778.A.DE1.html
title: '[新聞] 《鏡之孤城》好口碑榮獲日本奧斯卡獎項 '
content: "新聞網址：\n\n日本直木獎作家辻村深月的暢銷小說《鏡之孤城》，曾獲選2018年書店大賞冠軍，同時也\n是書店大賞史上得票數最高的作品，小說總發行數更高達170萬冊，這部高人氣奇幻小說\n\
  被改編成動畫電影，找來《蠟筆小新：大人帝國的反擊》資深動畫電影導演原惠一執導，\n由《我們仍未知道那天所看見的花名。》以及最近爆紅的《Lycoris Recoil\
  \ 莉可麗絲》\n、《輝夜姬想讓人告白-超級浪漫-》等人氣作品的動畫公司「A-1 Pictures」製作打造，\n集結新生代女星當真AMI、人氣演員北村匠海、吉柳咲良、板垣李光人、橫溝菜帆、麻生\n\
  久美子、蘆田愛菜、宮崎葵，大牌聲優高山南、梶裕貴等豪華配音卡司，將原作的奇幻世\n界觀搬上大銀幕，並帶領觀眾踏上奇幻之旅，共同探索鏡中世界以及感動的真相。《鏡之\n\
  孤城》故事講述就讀國中的小心在學校失去容身之處，而關在房間足不出戶，某天她房裡\n的鏡子突然發出神秘光芒，她被吸入鏡子後，映入眼簾的是一座城堡，以及與自己有類似\n\
  境遇的另外6位國中生。戴著狼面具的「狼小姐」出現在眾人面前，並告訴他們這座城堡\n裡藏有一支鑰匙，找到鑰匙的人就能實現願望，就在城堡逐漸變成7人特別的居身之所時\n\
  ，某起事件卻朝著他們來襲…。動畫電影《鏡之孤城》將於3月31日（週五）全台感動上\n映，敬請期待！\n\n《鏡之孤城》電影在日本上映後，感動的好評聲浪不斷，因上映首週獲得許多好口碑，讓\n\
  第二週的票房急速攀升，目前日本票房已突破10億大關，日本Yahoo電影更是拿下高達4.3\n顆星的高分數，超越《灌籃高手 THE FIRST SLAM DUNK》（4.2星）、《阿凡達：水之道\n\
  》（3.6星）等知名大作，甚至在眾多強檔大片接連上映的時期，在排行榜前10名保持了6\n週之久。許多名人也給予作品高度評價，知名動畫大師押井守大讚：「這真是太觸動人心\n\
  了。久違地想起了自己『一心一意的想法』差點被感動到哭出來。」；凍齡女星篠原涼子\n也淚推：「感動的心情無止盡地滿溢出來，下次想和孩子們一起進戲院觀賞。這是一部告\n\
  訴我們與孩子們交流的重要性的美好作品。」；逾25年來擔任「皮卡丘」聲優的大谷育江\n則感動地表示：「看了影像後非常感動！奇幻與推理，也是大家的冒險故事。後半段接二\n\
  連三的解謎，讓心底的雀躍感停不下來！也再次體認到『為他人著想』這份心中的力量有\n多麼重要。」《鏡之孤城》日前還登上鹿特丹國際影展Limelight部門，是有史以來首部\n\
  入選該部門的日本動畫電影，此外，也獲選第46屆日本電影學院獎「優秀動畫作品」，與\n《鈴芽之旅》、《灌籃高手 THE FIRST SLAM DUNK》等超人氣作品並列提名，受到評審相\n\
  當大的肯定。\n\n本作描寫誤闖「鏡中之城」的少女，成長的同時也找尋「自己的容身之處」，既寫實又細\n膩的描寫，帶給各年齡層扣人心弦又感動的奇幻故事。原惠一導演透露希望透過作品傳達\n\
  的想法：「並不是對不想去學校的孩子說：『請去上學』，而是希望身邊的大人或朋友、\n旁觀者能夠傾聽他們說話，原作和電影裡都充滿了這樣的訊息。」原作者辻村深月也表示\n\
  ：「很高興《鏡之孤城》能變成電影，讓更多人看見。有很多地方在第二次觀賞時才注意\n到，明明是我自己寫的，卻在很多地方流下淚水。不管看幾次都會有驚喜，是一部會長年\n\
  流傳的動畫作品。」同時也希望這部電影能帶給觀眾溫柔的感動。《鏡之孤城》將於3月\n31日（週五）全台感動上映！\n\n--\n                \
  \                 02/28 11:59"
