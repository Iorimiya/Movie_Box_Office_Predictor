title: '[ 普好雷] 就可惜那個設定的鏡之孤城'
content: '爬文才知道是漫畫改編

  但很想問原著就有手機遊戲機的概念嗎


  這一部同樣車庫代理，但我個人覺得整體比鈴芽之城喜歡多了

  不管是比較深刻深入去探討邊緣人的心情與議題

  前後呼應的伏筆，以及最後救贖的方式


  但，儘管當下順順看還沒什麼感覺

  也雖然其實中途就有猜到是不同時間線而來

  可是就算不去想時間線會否被介入改變的深刻Bug

  這些人整整相處記得有半年以上，也不是沒在聊天對話

  還沒辦法聊到覺得違和，進一步聊到跟日期時間有關的東西


  這點實在是太可惜了


  尤其是出現在遊戲這東西上，不要說有沒玩過

  跨度40年左右的科技，真的足夠讓人覺得進入SF的世界

  就算再怎麼對外界事物無動於衷

  超過想像外的東西，很難如此簡單看看帶過（還不只一個人）


  大家覺得如果不讓眼鏡仔拿手機出來玩比如改BG

  (比如大富翁跟現代進化版BG）

  亦或者把相處時間縮小到1-3個月

  會比較說服你，也讓故事更臻完美嗎？


  不過Anyway，我還是覺得得到比鈴芽更好的觀影體驗啦

  這部戲真正的重點還是在描寫友情心境，其他都只是串連故事的元素囉


  --'
