title: '[普雷] 鏡之孤城 原作黨的一點抱怨'
content: '雷文防雷資訊頁



  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~





  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  看完後有點小失望


  以讀過原作的讀者來說


  覺得前半段的節奏實在太快了


  原作其實透過蠻多事件跟小動作把七位角色刻劃的很豐富


  電影前半段這樣一個月一個月的跳


  我真的有點懷疑觀眾真的有認識心還有理音以外的人嗎


  保健室事件是這部作品的一個很大的轉捩點


  原作七個人在幾個月的朝夕相處後終於決定互相幫助


  而且見面是由嘴巴最壞的傲嬌政宗用半拜託的態度提出的


  讀到這部分是真的有感動到 很符合作品主旨“我們可以互相幫助”


  會覺得七個受傷的人能在鏡之城找到彼此真的很棒



  電影前面真的跳太快了 很難讓人感覺他們之間有很深刻的聯繫


  可以理解監督把時間都留給後半段找鑰匙的片段 演出也的確蠻優秀的


  但角色很不豐滿這點我覺得很可惜


  找鑰匙的時候也只有晶的片段特別加長演出 其他人也是輕輕帶過而已


  然後我覺得很重要的理音家庭線也被刪掉了


  姊姊死掉後的家庭關係是我認為理音之所以有資格進鏡城最大的原因


  刪掉後他不就是個爽朗足球帥哥而已嗎囧(不談狼小姐的伏筆的話


  最後結局前的七人談話也是 角色不夠立體所以感動程度差很多


  原作裡我真的很喜歡昴這個角色啊啊啊啊啊


  尤其他對政宗說的那句


  “那我來當那個開發遊戲的人，你就可以抬頭挺胸的說你認識我”


  電影講完卻讓我有點 呃......呃......



  整部電影的音樂都很棒 後半段的演出很優秀


  會動的狼小姐超級可愛(尤其是開場壓制小心拖著她進城堡


  但除了心 理音 晶 狼小姐四個人之外其他人都好影薄


  有點缺少原作那種在鏡城這個棲身之所大家相濡以沫的感覺


  會建議先讀原作再去看或是看完去補個原作 可以更了解整個故事


  --

  卅六平分左右同 金烏玉兔各西東


  芳草奈何早凋盡 情人無心怎相逢


  --'
