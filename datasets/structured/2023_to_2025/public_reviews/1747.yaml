  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  先來個無雷推薦

  這部主題是一群因為各自原因無法上學的孩子

  被狼小姐召喚到一座城堡裡尋找能實現願望鑰匙的故事

  起初只是有個共同的能休閒娛樂的集會所

  後來七個人才逐漸串起各自的身世、困難

  最後得到救贖


  前面有點平淡

  但我自己看動畫很能接受有空白、安靜的片段

  有些人可能會覺得無聊

  我覺得是一種內心的沉澱


  後面就進展得比較快

  某部分重要的線索不算難猜，有在看科幻電影或動畫的

  大概都知道原因


  我覺得很好看啦

  也很喜歡這種談論霸凌、少年身心疾病的電影或動畫

  (只是這種力道不好掌握，有時候會變主角無病呻吟，或是表現方式讓觀眾煩躁)

  之前待過一陣子精神專科

  我做的專題就是挑18歲以下的青少年少女的精神疾病來討論

  個人認為比起成年人治療

  小孩初入學校這個小型社會時，如果遇上困難能被好好解決

  對整個社會或單就長遠的健保治療費用都更有幫助

  而且限制行為能力人不一定能自己去看身心科或做諮商

  就算自己有病識感

  家人也不一定願意承認自己的小孩有這個狀況、帶他們去看醫生

  學校老師也不一定有專業能發現和處理這些事

  所以疾病的盛行率有一定程度地被低估



  不過這部沒有傳唱度高的配樂、主題曲

  只能靠口碑推薦其他人去看

  不像鈴芽光是看到新海誠就想進場一探究竟

  或是像我根本沒去看也聽過魯嚕 嚕嚕魯嚕的


  作畫我覺得算漂亮



  最後有幾個劇情的疑問

  用特典明信片防個雷




  話說本來上周要跟大學同學一起去看

  結果他突然確診

  他本來要去二刷還三刷就是為了這張明信片

  而我是有看沒看都無所謂的狀態(當時只知道有人說不錯看，不知道內容)

  所以他就說電影票他出

  我自己去看、明信片給他

  但我現在看完反而想要自己留下來XD 還在考慮中



  1.

  最重要的問題應該是七個人各自的記憶到底有沒有恢復

  從水守主動在校門外等小心

  找她一起走

  他的記憶應該是沒被剝奪

  但小心好像沒有很驚訝

  有點像是有種熟悉感但不認識這個人的樣子


  但說不定她知道對方

  只是兩人從頭到尾的互動都是這種不彰顯於外在的方式


  (前面就在猜兩人是不是互相喜歡，但真的沒有描寫太多互動，

  只有幾次刻意讓兩人獨處，然後每次見面都臉紅

  讓最後要離開鏡之孤城時，水守說的那句"讓我跟心在這相遇"超級突兀的XD)


  而aki在心之教室初次遇到小心時

  看起來是知道對方的，小心則否

  (這邊動畫怕大家沒有聽到前面同事叫她井上，還刻意在窗戶的玻璃比對大小aki的外觀)



  播完ed後

  電影有說為了感謝電影熱賣

  用畫面呈現第一周的特典

  內容來看也算是後日談

  有嬉野去聽風歌演奏會一見鍾情(呼應離開鏡之孤城時所說)

  還有政宗去昴的簽名會


  這些看起來都是剛好命中注定相遇

  不是早就知道對方是熟識的那位




  2.

  前面有刻意用政宗跟昴的興趣來展現年代差

  到了他們去學校卻找不到對方時

  我就有猜到是來自不同時代的人，而不是後來政宗猜的平行世界


  然後就像狼小姐所說

  明明大家只要稍微提一下學校的事

  就能發現都來自同一所學校了

  這邊也是，明明幾個人都有問學校老師有沒有叫那些名字的學生

  卻不問串連起大家的喜多嶋老師


  小心時代的喜多嶋老師可能還沒遇到所有人

  但嬉野時代的應該就遇過了

  (也許這邊有刻意讓後面時代的人沒有在保健室遇到喜多嶋老師?

  但我記得嬉野在校門口時，是兩位成年女性來找他)



  3.只是想吐槽一下狼姊姊就是幫弟弟找老婆就是了

  記憶的部分好好處理就算了

  連年齡都能改?讓他們變成同年還同班?


  雖然我不排斥戀愛發展啦

  也覺得小心很可愛，不是女生集團說的醜女，國小就有人喜歡她

  在班上要不是被女生集團欺負

  應該也會有男生對她不錯，正常生活應該不會被孤立




  4.就像我前面所說

  現實中不一定能遇到像小心媽媽這麼好的家長

  更不一定能遇到喜多嶋老師

  多的是伊田老師那種只想息事寧人、不站在受害者這邊的

  但我不是要說電影是烏托邦

  只希望大家成為家長或老師後能有這方面的敏銳度




  目前只想到這些

  有想到再補充~




  補充一下

  不知道有沒有要隱喻只要有人的地方就會有爭執、猜忌

  就算是再各自世界受傷的人

  還是會嘲笑嬉野的行為

  到後面才比較有同情各自遭遇的表現

  而前面不知道是不信任還是單純跟找鑰匙無關就沒講

  七人都沒說無法去上學的原因和各自的願望

  這樣的安排可能會讓一些觀眾覺得前面很無聊

  也不知道他們到底想幹嘛

  沒有目的


  還有aki劇中那段我還以為她被侵犯

  幸好結局看來是沒有



  --

  因為大家都是國中一二三年級

  所以來自的年代差異我直接當作歲數差異了

  對我的見解也是理音認識她

  她不認識或頂多有熟悉感

  這個我知道 那邊kokoro有回想起東條萌給她的書 有看到封面

  二刷可能要看看有沒有特典和時間允不允許

  現在我家這邊一天只剩中午一場

  會比較想買小說或漫畫來看(有中文的話)

  或是等上串流慢慢邊看邊暫停研究'
