url: https://www.ptt.cc/bbs/movie/M.1680324177.A.D34.html
title: '[好無雷] 絕不該被埋沒+錯過的「鏡之孤城」！'
content: '因為3月影院送的免費電影票昨天要過期了，

  （限一般影廳），

  只好稍微看一下ptt心得，

  找一部非IMAX的電影來看。


  剛好看到版友推這部「鏡之孤城」，

  感覺海報很頗美，就在毫無任何資訊的狀況下

  來看這部電影。

  （我連預告都沒看，對這部電影只知道片名XD)


  結果剛剛看完，真的完全不後悔！


  確實畫面背景不可能與新海誠相比，

  但劇情不愧是源自小說，

  真的蠻豐富的，近2小時片長仍意猶未盡。


  可能也歸功於導演的編排，

  在一部電影的時間內，

  想要傳達的理念跟內容都有確實傳遞給觀眾，

  人物的心境也描寫的很細膩，

  令人非常能代入電影之中，感同身受。


  可能有些看過小說的版友覺得前面太趕，

  幾位角色刻劃不夠深，

  但個人覺得以單看電影的人而言，

  也足以理解+喜歡他們了。


  整部片除了設定之外，不會有什麼不明之處，

  伏筆也算都有收到，是個完整的作品。


  認真覺得，實在是近年來除了動漫IP外，

  純動畫電影的佳作。


  非常值得推薦去電影院一看~~


  ps.跑字幕時會不定時有補充畫面出現，

  而且甚至可以算是主線的延續，

  大家別急著離場喔！


  -----

  Sent from JPTT on my Samsung SM-G781B.


  --

  彩蛋真的又泛淚一次

  其實還好啦，對小說黨來說才會有這問題

  對單純觀影者還好欸

  歌詞也很用心搭配劇情QQ

  這個套路當然是很好猜，

  但我一直覺得這部的主題並不在奇幻解謎

  而是在「有XX狀況學生的心境及轉換」

  親情部分也描繪得很寫實

  尤其有小孩更能感同身受

  會不自覺代入自己女兒...QQ

  覺得普&最糟的電影，應該有一大段差距吧？

  好神奇的感想XD

