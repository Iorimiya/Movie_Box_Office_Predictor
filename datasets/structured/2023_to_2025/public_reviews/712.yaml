url: https://www.ptt.cc/bbs/movie/M.1727001894.A.FEB.html
title: '[普雷] OVERLORD 聖王國篇'
content: '雷文防雷資訊頁

  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~

  先說總評

  這部電影評分的話必須要分成兩個標準


  如果你是小說愛好者已經看過聖王國篇 10分滿分給7分

  如果你是看動畫來認識這系列的 那這部電影10分滿分大概會變成4分吧


  評分理由寫在分隔線下面
























  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  好的地方

  "劇場版品質作畫(人物)"

  "犯罪眼(梅雅 這次的女主角)表現真的很可愛"

  "搞笑的時候的溫度差很大 挺有趣的"



  糟的地方

  劇情根本就是瘋狂趕進度 文戲幾乎全砍 跳過

  例如一開始的魔導國那段描寫被短短帶過 接見那段直接砍掉

  文戲就算了 畢竟小說兩本濃縮成一本

  但是更糟糕的是一堆戰鬥場次也被砍或是縮短


  例如攻略都市的時候的狂王巴薩爾戰 被砍掉

  魔導王VS女僕隊這邊也是只演開場一部分然後幾乎砍掉

  還有戰場上的動作表現也是慘 動起來該怎麼說 就是不夠華麗


  最過分的大概是你一個劇場版裡面居然塞了很多的"回憶畫面"

  王女(武器)這邊開頭演一次 劇中也回憶了兩次 有沒有這麼誇張的 劇場版耶


  這大概要分成上下集比較好 只用一部電影就要演完兩本進度真的太勉強了吧


  不過雖然說這麼多 這部還是有一看的價值


  --

  跳非常大

  一開始城堡被攻擊那邊算有演完整

  小說的話這邊之後就是聖騎士團到處求救 去王國找薔薇他們 打聽到飛飛的消息

  然後流浪到魔導國(完全跳過 開場就直接進城

  進去之後的入城講習也跳過 變成蛇人一邊倒退嚕一邊講解 畫面看起來很蠢

  如果不是看過小說 只會覺得莫名其妙一堆部分都沒講過程只給你看結果

  動畫最後的王國篇時間點在這聖王國篇之後

  如果後面還做就真的只剩下劇情微妙到炸的精靈王國篇...'
