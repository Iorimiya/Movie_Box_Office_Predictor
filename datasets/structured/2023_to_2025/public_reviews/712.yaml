url: https://www.ptt.cc/bbs/movie/M.1730448198.A.092.html
title: ［好雷］劇場版OVERLORD 聖王國篇 IMAX
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  Imax限量特典

  角色設計so-bin老師繪製收藏卡

  A3磨砂海報



  先說

  我沒看過這裡的小說

  動畫有看完，而且是喜歡這個作品的


  開頭Q版觀影注意事項小動畫蠻可愛的



  一開始對聖騎士妹妹巴拉哈，後面表現越來越可愛

  尤其是他跟希絲互動的地方

  希絲也很可愛（希絲：我很努力了）


  整部片基本上著重在聖騎士妹妹逐漸被攻略變成迷妹的過程

  最後轉職成傳教士


  開頭覺得聖王女長得蠻可愛的

  沒想到整部他最多戲份的地方就在開頭....

  （看不出是他的部分不算）


  團長

  個人不太喜歡他

  看到他的表現都覺得有點煩躁

  想說他什麼時候便當

  結局還能接受

  （不過他應該算是王國方最先看透真相提出來的，先知總是孤獨的...）


  其他人物這邊就不特別提了


  整部用了不少跳剪省略

  我覺得看的比較怪的是


  團長帶隊到魔導國求救中間的過程跳得有點突兀

  跟前面那段到安茲單騎出戰決定的過程

  （以為會跟動畫一樣後面會補詳細一點或是他中間跟小迪討論的過程）


  還有安茲掉落假死後到復出拯救聖王國中間的過程（還是這裡本來就不會在這邊演出來？）


  其他大致上都還能接受


  （）


  戰鬥方面

  我覺得亞達巴沃開場的虐殺排場很不錯，沒有給那位大人丟臉


  還有假亞達巴沃+女僕跟安茲打的那邊覺得可以多做一點

  就算演一下他們聊天假裝對打也好


  看的時候

  由於開頭有大概描述一下前言跟中間有些微介紹背景，但沒有詳細提到

  所以也有大概想像如果沒看本篇來看的人

  看的時候應該會跟聖王國的人一樣一直覺得亞達巴沃是大魔王，安茲是慈悲的大人來幫助他

  們


  看過本篇的人中間很多地方應該會覺得很好笑

  同場有一位觀眾狂笑超大聲


  整體來說個人是喜歡的而且有娛樂到我

  雖然我帶點私心

  但..8/10


  看過並對這部作品不排斥的都可以去看


  沒看過這部的人要看的話個人覺得會少一些樂趣


  --



  希絲很努力了QQ'
