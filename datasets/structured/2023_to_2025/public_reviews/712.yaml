url: https://www.ptt.cc/bbs/movie/M.1730716605.A.292.html
title: '[普雷] Overlord 聖王國篇'
content: '防雷


  ——————————



  首先上人權圖





  聖王國篇是Overlord我最喜歡的篇章

  因此當初知道聖王國篇會獨立出劇場版

  我是很興奮的

  因此趕緊趁著有空

  買了套餐拿限定海報


  一開始的城牆段落本來就不是很重要

  所以快速帶過我覺得很合理

  而卡林夏的聖王女之戰

  把聖王女與團長、葵拉特的對話全部刪掉

  我覺得很失敗

  可以說根本就沒有聖王女的戲份


  而且劇場版用了幾次回憶的方式

  來描述聖王女之戰

  卻搔不到癢處

  感受不到亞達巴沃（憤怒魔將）的強大

  就結束了

  WTF？


  聖王國使節團出使王國的部分

  也刪得一乾二淨

  看不到蒼薔薇的各位可愛漂亮女孩超可惜

  （對，我沒把格格蘭算進去）

  在魔導國的劇情也是進度極快

  這部分倒是還好，過個場而已


  但是接下來已經不是趕火車的速度了

  根本就是直接搭高鐵

  小收容所跟小都市戰役直接合併

  也幾乎沒什麼內容描述戰爭的殘酷與骨王展現的力量與信念

  沒錯，說的就是跟豪王戰鬥的內容也全部刪光了！

  接下來的都市防衛戰

  覺得還算及格

  可是王兄卡斯邦登的戲份也是能省則省

  許多我覺得很重要的話他也都沒能講

  刪光光

  然後剛打完防衛戰

  憤怒魔將就直接來了

  然後戰鬥畫面也是

  非常感人

  我覺得不應該把中間骨王和涅亞（小說翻寧亞）

  去救了很多人的部分刪掉

  聖王國人民對骨王的感激鋪成根本不夠

  應該要用一點點篇幅描述一下比較好


  寧亞與希姿的認識與對話

  倒是給了很多時間篇幅

  當然

  這部分是真的不能刪

  要是刪掉聖王國篇就完全沒東西可以看了


  而重要的奪回卡林夏之戰更是誇張

  直接搭飛機

  跳過最後的平原大戰

  剛攻陷卡林夏就來最後的對決了

  直接略過寧亞中間開始傳教

  與越來越聽希姿的話的部分

  最後大戰就是各種放煙火

  嗯，bj4

  都打完了之後

  寧亞才開始傳教


  總結

  純動畫黨角度

  我給普雷

  願意去電影院支持的話也不錯


  小說+動畫黨

  我給負雷

  內容大刪減

  情緒不到位

  不過也有許多小修改的地方

  我覺得改得很不錯

  反而增加了一點趣味

  不過還是等上串流再看吧！

  -----

  Sent from JPTT on my iPhone


  --'
