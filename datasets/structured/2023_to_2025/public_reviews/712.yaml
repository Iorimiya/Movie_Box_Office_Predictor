url: https://www.ptt.cc/bbs/movie/M.1731489363.A.439.html
title: '[  雷] Overlord聖王國篇'
content: '附上人權




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  先講講心得

  可能我不是原著黨

  所以不會覺得不好看

  但也是因為不是原著黨

  有些片段看的不是很懂

  我大致能夠瞭解

  這些都是小狄的佈局

  不過這篇章涅亞的角色塑造很成功就是了

  還有亞人拿人類小孩當盾牌的時候

  也是她第一個射箭的

  而且後續的棒讀演技（盧恩武器）

  納薩力克是希望推銷商品的同時 也塑造捏亞的形象吧

  除了有些看不懂之外 其實畫面跟傳達的東西都算清楚

  我有幾點不是很明白 想請原著黨幫我解惑

  1.騎士 神官跟聖王女（aka+9武器）

  她們有什麼特殊關係嗎

  因為當聖王女被當+9武器揮舞

  跟後續的角色塑造

  感覺就是那種無能狂怒型

  我猜是不是有什麼關係才讓她特別著急

  2.安滋帶著涅亞收復第一個山羊人統治的城後

  去到一個山洞

  裡面關著豬頭人

  他有問豬頭人遭受到了甚麼

  但劇情沒有正面回答

  3.為啥聖王國南北分裂啊 不是宗教國家嗎

  4.藍蛆的背叛 也是小迪的劇本嗎

  大概是John 謝謝


  -----

  Sent from JPTT on my Asus ASUS_AI2201_F.


  --'
