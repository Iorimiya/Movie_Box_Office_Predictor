title: '[普雷] Overlord聖王國篇'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  前提:

  本身純動畫檔 稍微做過功課

  知道+9王女劍的梗

  知道沒看過小說  多少會有點割裂感


  沒有抱很高的期待

  純粹對IP有愛  所以進場支持

  只要有動畫的水準就滿意了


  已做好心理準備

  知道評價兩極、知道會有大屠殺

  我是反對骨王變成為殺而殺的角色

  預期好看與否的關鍵  應該就在屠殺理由能否說服我



  觀後感:


  1. 說好的"殘暴"呢???

  本身不喜歡無意義的屠殺

  動畫裡的骨王  至少都是有政治目的性

  不是為殺而殺


  事前已經聽說

  聖王國篇號稱最殘暴的篇章

  因為太殘忍不能做成動畫，改出劇場版


  但看完根本沒有啊

  王國篇(黃金公主那邊)   殺的人也沒比較少啊

  唯一比較殘忍的  就是王女劍


  預告一直宣傳這點

  但...只有短短2秒不到  還是用回憶帶過


  都做成電影了  給個5-10秒差不多吧?

  搭配一點剪輯  營造更壓迫的氛圍

  也不是說越噁越好  但短成這樣  氣氛都沒了




  2. 聖王女戲份

  代理商FB

  一直宣傳聖王女的人設  確實看起來很吸引人

  對比她的遭遇   也是一個看點吧


  但實際上

  王女戲份也太少了吧  幾乎沒什麼刻劃

  都是在回憶中了解這角色



  總結:

  只講缺點是因為

  其他部分都覺得不錯  有維持動畫的水準

  整體給普雷


  滿喜歡涅亞心境轉變的描寫



  另外想問

  女僕貼在涅亞額頭的貼紙是什麼東西啊??


  以上


  --'
