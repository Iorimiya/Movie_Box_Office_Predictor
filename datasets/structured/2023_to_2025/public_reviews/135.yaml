url: https://www.ptt.cc/bbs/movie/M.1757891857.A.09D.html
title: '[影評] 大競走'
content: '雷



  這片像魷魚遊戲大逃殺美國版

  史提芬金就像日本的深作欣二

  名字一打下去就是驚悚片大師


  我自己也很喜歡健行

  以步行環島為目標來練

  曾來回走完臺灣大道一次

  來回大概是53公里的超馬

  時速大約一小時五公里

  戲裡規定時速3英里=4.8公里


  我晚上九點從台中火車站出發

  到隔天下午四點才走回火車站

  拿拐杖走了19個小時才走完


  從火車站大概走了5小時

  在終點台中港26公里折返

  折返到靜宜大學大約30多公里

  突然大腿筋就開始劇痛

  時速從5公里瞬間降為2公里

  之後都是一拐一拐的用小碎步走完

  深切體會很多老人為何會寸步難行

  因為連走小小一步全身都痛到爆


  就像戲裡第一個被爆頭的7號

  他大約也是30公里腳痛出局

  我去參加大概也會像他一樣


  大甲媽白沙屯繞境的常客

  有常在練的應該能走到最後

  但很難想像邊走變拉

  還有邊走邊睡還做夢

  連走五天還能維持時速3英里


  最後的同袍情誼蠻感人的

  就像魷魚遊戲2的男主角一樣

  最後都是為了義

  不要錢也不要命


  感想是少校就像是川普共和黨

  選手就像是好萊塢移民民主黨

  讓美國變得像納粹的獨裁政府


  少校說這比賽是要治療

  這個國家的懶惰病毒疫情

  年輕人會想賭命報名参戰

  就像一堆美國人去當美軍

  然後被派去中東打仗一樣

  窮人不簽賣身契當兵好像就

  只能當遊民或黑幫的感覺


  魷魚遊戲大逃殺其實跟

  現在去烏俄打仗沒兩樣

  如果沒死就能賺一大筆錢

  所以全世界有不少人去參戰

  台灣也有幾個自費過去

  薪水有十幾萬的確蠻高的


  但跟這些選手一樣

  賭自己命跟別人的命來賺錢

  全程直播就像看烏俄

  跟以巴戰爭一樣收視率高

  就更多人參加跟捐錢


  像拍古裝片是借古諷今

  但這片是借未來奉今

  就像大逃殺的BR法一樣

  就像中國德國北韓

  一夜解放變獨裁集權國家

  又一夜改革開放回到解放前


  台灣也是一換總統就解嚴了

  未來真是世事難料，想到腳就痛

  練習曲讓單車環島在台灣變流行


  但願這齣戲能讓步行環島

  在台灣變流行，要走一個月

  大約1000公里，完全不停的話

  大概真的會走斷腿，量力而為

  走一天休七天再繼續慢慢走

  所以食宿費大概要花不少錢


  我從小就是史提芬金的戲迷

  這片真的拍的蠻好的

  應該能算他的代表作之一

  不過跟魷魚遊戲真的蠻像的



  --

  已修正

  我看很多聽了愛國徵兵宣傳

  滿腔熱血去烏俄 越南 中東等

  參戰的人，去了才發現被騙了

  就像西線無戰事一樣事與願違

  熱血青年上戰場才知道超變態

  戰爭能把人都變成變態殺人狂

  最後像南京一樣殺到麻木不仁'
