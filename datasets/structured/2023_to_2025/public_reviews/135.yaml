url: https://www.ptt.cc/bbs/movie/M.1758006713.A.17E.html
title: '[好微雷] 大競走：死亡讓活的人過更好？'
content: '推薦給：喜歡走路或慢跑的人

  不推薦：受不了大量對話，場景視角單一


  一坨年輕人在起走線上聚集完畢，蓄勢待發的參加一場生死競賽，要嘛走到剩一人當贏家

  ，要嘛中途放棄被槍斃，沿途沒有關卡陷阱，全憑實力。因為很多人一起走，預期需要走

  好幾天才會分出勝負。


  大競走除了體力和嘴砲干擾別人的功力很重要，能不斷走下去的動力是你的意志力，而意

  志力的來源就是當初參加比賽的動機......電影有趣的地方就在這裡，這些來比賽的年輕

  人竟然都是自願報名！


  不像《饑餓遊戲》隨機抽隨便死。大競走比賽每個人都抱有走下去的理由，除了贏家財富

  全拿和附贈一個願望的誘因，有的人是為了讓父親接納自己，有的僅僅為了寫小說，而主

  角更是為了一個宏大的願景。


  我沒有看過史蒂芬金的原著小說，但電影的結局很好，留有餘韻和討論的空間。一票新人

  演員非常優秀，各個都是明日之星。


  然而電影架空的世界，有個呈現不佳的問題，就是電影告訴觀眾，年輕人都會因為國家貧

  窮的現況而自願報名參賽，也許是為了勇氣或榮譽，也有可能為了錢，幾乎無一例外，但

  是本片沒有把國家貧窮的狀況認真拍出來，電影視角緊緊跟著主角，一路競走的路僅僅是

  一般的農莊田園風光，加上主角生活在挺舒服的家境，所以為了貧窮生活，大家去拼命報

  名沒有什麼說服力，我沒有感覺到批判階級對立或討論公平正義的那一塊。


  我就把大競走賽事當作在諷刺當兵義務役，不管真心或假裝都要自願報效，來證明男人的

  勇氣和強壯，不然會被社會笑。像我們現在主流風氣也認為男生當個兵應該的，而連結到

  在美國當兵會真的派去打仗，和死亡就有了關聯。


  但是電影著墨的點不在反思社會狀況，好看的是在競走的過程中同伴情誼非常動人。每位

  選手都有小情緒，在烈日下、大雨中、甚至睡夢裡，沒日沒夜都要一直走下去，不然就會

  被開槍，每個人都處在失控的邊緣，這時候有不會背刺又能相互提攜的夥伴就很重要。


  這時候問題來了。友誼已經情比金堅，但最後又只能獨活一人怎麼辦？


  從他們沿途的對話中，你隱約知道有人會選擇犧牲，為的不只是同袍之愛，而是在探討彼

  此對世界有不同的理解後，意識到每個人的生命都有終點，做出為了讓活的人可以過更好

  的選擇。



  --'
