url: https://www.ptt.cc/bbs/movie/M.1757851095.A.3A0.html
title: '[好雷] 大競走結局後勁蠻強的'
content: '首先這部片不是整部都好看喔


  前半段很鳥 遊戲嘈點很多 （到底在走三小？）


  但越走越好看

  越走越深刻


  最後幾個出局我是都蠻有感的


  主角漸漸了解黑人是真正有大智慧能讓世界變更好的


  所以最後那個換位雖然驚訝但一點都不突兀


  黑人沒有聖人模式爆發而是真的選擇斃了上校 繼續走向不確定的未來


  這兩個都是 整趟苦行鋪陳的結果 收得很深刻俐落！


  另外 雖然這部是很明顯在省成本  但卡司不算差喔


  主角 菲利浦西摩霍夫曼兒子


  黑人 演新異形那個


  亞洲人 王斑


  這些都是業界已經有經歷 不是最便宜的選擇


  而事實證明他們都是新世代專業級演員


  所以總體來說仍然推薦



  -----

  Sent from JPTT on my iPhone


  --'
