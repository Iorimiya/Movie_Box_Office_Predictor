title: '[好雷]大競走 '
content: "雷文防雷資訊頁\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \  這部片的評價有好有壞，我是認為這部片很看個人，不喜歡的人是覺得大爛片\n\n  其實劇情很多人都知道，就是反烏托邦的故事，原作是史蒂芬金\n  在這裡要特別提一下，我沒看過原作小說，那是1979年的作品\n\
  \  所以其實我覺得，很多劇情跟描述上可能跟現在2025年相差甚遠\n  而且我看板上也說這部電影有改動不少\n  所以的確感覺上有些地方有點怪\n\n  劇情其實很簡單，就是在未來世界裡美國是一個獨裁國家\n\
  \  在世界大戰後全國人民都貧窮，而且管制言論與各種音樂，文化\n  為了激勵全國人民，政府每年會舉辦名為長征的競走\n  從全國志願招募50名青少年，沿著公路一直走\n\
  \n  規則很簡單，就是一直走\n\n  然後永遠不能停下來，必須保持時速3英里\n  低於3英里會收到一次警告，累積三次警告就當場槍斃\n  如果能保持1小時沒有收到警告，則可以抵消一次警告\n\
  \  比賽將持續到只剩最後一名參賽者為止，該人即是勝利者\n  換言之停下來不動，馬上會累積三次警告被槍決\n  還有如果離開公路也是當場格殺\n  就這樣\n\
  \n  也就是，走到死\n  最後的勝利者可以實現任何願望\n  --------------------------------\n  這個作品是1979年的小說，以現在的角度來看或許是太簡單了吧\n\
  \n  有人說是大逃殺的原型，在我看來它是很多東西的原型，就是這種類似煉蠱的\n  只能有一個存活者的遊戲\n\n  不過可能是1979年的作品(或是是因為改編過，我不知道)\n\
  \  也有可能是導演拍法的問題\n  這部片其實滿溫馨的，我覺得這就是本片評價兩極的原因，會被罵無聊的\n\n  因為它其實在片中並沒有設定各種劇情起伏的橋段與人心險惡什麼的\n\
  \  也沒有各種陷害\n  正常來說這種死亡遊戲，一定會有各種陷害\n  只有主角跟少數的人會堅持要團結活下去\n\n  可是本片一開始就講得很清楚，規則就這樣\n\
  \  而且軍方好像沒說能不能相互陷害\n  總之有數輛吉普車與裝甲車及士兵一直跟著主角們，作為魔王的少校時不時會來\n  片中基本上沒有人互相陷害\n  我一直以為會出現那種，當有人收到兩次警告時，某個壞傢伙故意去絆倒他\n\
  \  讓他吃第三次警告被槍斃的事\n  事實證明是我太邪惡了，片中並沒有人真正想這樣做\n  即便是那個討厭的巴科維奇，他也不是故意要害死別人的\n  他後來也因為自責而選擇自我了斷\n\
  \n  -----------------------\n  我覺得這部片其實滿良善的，片中的參賽者們都滿善良，頂多就是巴科維奇是怪咖\n  或許是因為原作是1979年吧，當時民風純樸\n\
  \n  還有，越戰是在1975年結束，本小說是1979年出的\n  所以我在猜想，當時越戰時反戰情緒很強，美國政府強制徵兵也的確專橫\n  這部作品明顯有反政府，政府是很可惡的，這個概念存在\n\
  \  或許是因為當時越戰給美國人民的傷害極大吧(當然越南也是)\n  其實很多有名的越戰電影，基本上都是在控訴這個\n  那個時期大概美國人都很討厭美國政府\n\
  \n  -----------------------\n  劇情中可以無限補充水，好像有少量食物\n  但無論如何不能停下來，所以就是要一邊走一邊大小便，主角等人甚至一邊走一邊睡覺\n\
  \  只能對身邊朋友幫助一下，扶他一下\n  但如果有人真的停下來，無論任何理由，主角等人都只能繼續往前走，\n  停下來的人會被打死\n\n  所以這部片其實從頭到尾就是在走路，大家一邊走一邊說話\n\
  \  從一開始的遠足心情，到後來人數不斷減少，大家漸漸沉默\n\n  在這裡可以清楚看到這似乎跟現代的逃殺片有明顯差異\n  其實所有參賽者都是自願的，大家都知道最後只會有一個勝利者，其他人全死\n\
  \  但是一開始大家還是歡樂聊天，甚至約定好要互相扶持到最後\n  這個部分就滿古早味的\n  明明知道你一直活著，那最後我就會死，我為什麼還要幫你??\n \
  \ 我反而是應該讓你精神崩潰(如果不能有動作陷害他人的話，那就用嘴說話)\n  就像巴科維奇一直侮辱別人一樣\n  可是這部片基本上沒有人想利用這種方式害人，就像上面說的\n\
  \  巴科維奇其實也只是個怪咖神經病而已\n  大家真的想要相互扶持\n  就很單純的走到倒下，直至最後一人\n  甚至不斷激勵其他人，別人倒下還用掉警告去把他們扶起來拉著走\n\
  \  只能說1979年的時候大家真的很單純\n  大家想贏又不想看到別人死，所以只能這樣\n  其實看了感覺不錯，完全沒有我想像的人性醜惡面\n\n  -----------------------------\n\
  \  關於主角雷參賽的理由是要殺死少校這件事，網友也說了是改了原作\n  所以我想不用特別多提\n\n  其實我個人是覺得這部片只能說普通，並沒有拍得很好\n\
  \  很多人說最後的反轉很震驚，我覺得沒有\n  走到最後就是雷與彼得這兩位好友必須決定誰會死，要面對現實了\n\n  在我看來真正要震驚的話，應該是在剩下三個人的時候\n\
  \  突然出現意外，甚至是對政府的反抗\n  當那個美州原住民帕克衝去搶軍人的槍並且射殺一個軍人的時候\n  我其實有想，該不會雷最後也會來這一招\n  直接搶槍並且擊斃少校，然後他會被打死，那麼他的願望其實已經實現了\n\
  \  他就讓彼得贏吧\n  結果並沒有.............還是走到死\n\n  在我來看並沒有什麼反轉，沒有震撼的最後逆襲之類的\n\n  我覺得這是很多因素組合的，首先原著小說是否就沒有這種震撼??\n\
  \  然後本片結局好像改了原著的結局，那既然都改了為何不更震撼一點?\n  然後我覺得導演在整體安排上，就沒有著重這個部分，導致電影其實有沉悶\n  而且觀眾早已預知結局大概就是這樣那樣，並沒有意外性\n\
  \  最後是演員\n  幾位演員都屬於年輕新秀\n  主角雷是已故影帝菲利浦西蒙霍夫曼的兒子，但我想他跟父親還有明顯差距\n  彼得是大衛榮松，目前作品不多，其實他就是異形羅慕路斯裡的彷生人安迪\n\
  \  他算比較有實力的，不過目前看來他也不是屬於情感表現強烈的演員\n  (異形羅慕路斯裡他是彷生人所以也沒有太多情緒)\n\n  反而是少校是馬克漢米爾  就天行者路克啦，他整部片戴墨鏡，不看演員表不會知道的\n\
  \  還有雷的媽媽是茱蒂葛瑞兒，這兩位都是實力派老演員了\n\n  我覺得在片中這個落差尤其明顯，只要少校跟媽媽出現\n  你會明顯感覺到情緒變得強烈\n  那個少校實在太可惡，而且他其實就是獨裁政府的一個化身，毫無人性\n\
  \  他就很明顯有一種，把人命當草在割的感覺，那種不在乎大家生命的感受他演得很好\n  真的希望雷能幹掉他\n  而當雷的媽媽出現的時候，整個感覺也令人難過\n\
  \  兩位資深演員的實力跟這群年輕演員的落差非常之明顯\n\n  我覺得這算是本片的一個大敗筆，事實上雖然年輕演員們感覺上非常努力了\n  但幾位主角的表現是沒有讓人入戲的\n\
  \  反而是那個討厭巴科維奇是查理普拉瑪，以年輕演員來說算是演過不少作品了\n  他很明顯非常突出，就很討人厭......\n\n  ----------------------------\n\
  \  我覺得片中會吸引我的，就是主角們的對話，以及各人有各人的情緒和想法\n  但同樣，本片只有主角雷有特別講個他的故事\n  其他人都沒有什麼故事，雷的故事應該本身就是改編追加的\n\
  \  其實我覺得應該要追加其他角色的故事，幾十秒講一個人就行，這樣他們死掉的時候\n  觀眾才會更有情緒張力\n  就是那種，他們其實都是好青年，竟然這樣就被殺害，的那種憤怒\n\
  \  我覺得本片並沒有表現出來\n\n  然後在走路中，也只有第一晚深夜那一段上坡路有驚嚇到我\n  原來少校說你們很多人活不過今晚指的是這個阿\n  在極端疲勞並且進入深夜，很多人已經想睡覺的情況下，忽然面對一個很陡的上坡\n\
  \  在這個情況下會有很多人的速度降至3英里以下\n  馬上就會連吃警告並且被槍殺\n  而且還有人因慌亂而腳斷掉\n  那一段的確非常緊張\n\n  但後面就再也沒有類似的橋段，我是覺得在最後關卡時應該要有點這種轉折才對\n\
  \  --------------------------\n  我覺得，這部片是有給我一些感觸\n\n  我想到的是，這群年輕人，就像每一位年輕人一樣，年輕的時候都有夢想\n\
  \  想要實現某些願望，很多人是想給家裡更好的生活\n  其實沒有人是壞人\n\n  而那些軍隊與少校，也的確就像國家政府一樣\n  我覺得那更像是所謂的\"\
  大人\" \"體制\" \"財團\" \"控制\" 等等這些力量\n  這個長征是自願參加，所以就像是你自願進入我們這間公司一樣\n  接下來各種不合理的事你都只能接受\n\
  \  你沒有選擇，只能繼續往前走\n\n  以前跟你一起的朋友，同學，夥伴，會在人生這條路上，漸漸消失\n  他們會發生各種事情，當然有些人會成功，但或許他從此也不會和你聯絡\n\
  \  這場人生競走是孤獨的，而這群主角試圖在孤獨走到死的過程中\n  找到意義與希望，就算死去，至少我曾努力過，已經足夠了\n  我覺得這部片到了後段就給我這種感受\n\
  \n  而這些年輕人們，面對獨裁政府，軍人手上有槍，他們無法反抗\n  這就像是很多年輕人在社會上活的非常痛苦(我是說其他國家)，但又無法反抗現狀\n  他們能做的就是像片中一樣，一邊唱歌一面大罵政府\n\
  \  但是這對那些軍人(有權勢有力量的人)  一點感覺都沒有\n  我覺得這部片給我的就是這種無奈\n\n  而片中很明顯刻意在強化殺人的橋段\n  包含開槍時把人的頭跟臉甚至嘴打爛，槍聲非常大，不是一般電影那種槍聲，很真實\n\
  \  甚至有裝甲車把人壓斷腿的畫面，就是有花錢拍\n  我覺得很像是在比喻現實社會中的各種殘酷\n\n  而到了最後，只剩雷與彼得，而他們也成了好友，他們不想讓對方死掉\n\
  \  其實不管誰勝出，都已經沒有勝利者\n\n  這場長征跟人生的長征一樣，沒有勝利者\n  就算你最後贏了，回頭看看，你失去什麼，剩下什麼?\n  其實贏了又好像沒贏\n\
  \  這就好像你非常努力賺了很多錢。人生成功\n  但又好像失去了青春，好像賺很多錢意義又不是當初那麼大了\n\n  結果反而是你在人生過程中的努力是你珍惜的回憶，而不是最後得到了什麼\n\
  \n  最後彼得選擇替雷完成願望，當然那個結局看起來像是他隨即被槍殺了\n  因為對彼得而言，他贏了其實也像是沒贏，反而他與雷的友情跟這幾天的長征\n  才是他得到的\n\
  \  最後要實現什麼願望並不重要了，他必須殺死少校\n  因為他想讓雷贏，因為他什麼都沒有，反而雷是有媽媽的，他其實想讓雷跟媽媽能團聚\n  結果雷卻犧牲了\n\
  \  彼得最後能做的，就是殺死少校，這樣看起來\n  就像是雷贏了這場比賽，實現了願望\n\n  我覺得在人生的長征裡，的確有這種感受\n  當初追求的東西，到了最後得到，或是即將得到的時候，反而沒那麼重要了\n\
  \  在過程中你經歷了整個人生，過程反而才是重要的\n  得到的是過程而非結果\n\n  ---------------\n  我其實會推薦這部片\n  但真的很看人，有些人會覺得很糟\n\
  \  所以，就看要不要看這部片吧\n\n--"
