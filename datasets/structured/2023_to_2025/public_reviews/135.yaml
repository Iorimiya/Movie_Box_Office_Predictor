url: https://www.ptt.cc/bbs/movie/M.1757695743.A.9AE.html
title: '[好雷] 大競走 超乎想像的好看'
content: '我沒看過小說

  但尬的這部簡直超乎想像的好看

  原本只是看了預告覺得還不錯

  沒想到電影實在拍得很好，驚為天人

  已經好久沒有這樣被一部電影衝擊到的感覺

  （今年看了幾十片都覺得還好 心如止水）


  你會覺得

  不就是一直走一直走，走到剩最後一人嗎？

  沒錯！

  但它就厲害在你都可以知道它在演什麼

  甚至結局會怎麼樣都能大概猜到

  但整個過程中就是會不斷被各種情感衝擊到


  它跟其他生存遊戲作品最不同的地方在於

  他不是一部大家真的想要贏的電影


  我們一共四個人去看

  其中一個哭到不行

  另一個對結局的解讀卻嚇壞我

  沒有看到有人討論結局

  只好自己來發文問問看過的人



  再重申我沒看過小說

  聽說導演有魔改

  但不管魔改什麼

  我都覺得現在的安排是完美的

  不過我看完就上博客來買書了

  實在太想知道史蒂芬金原本是怎麼寫的






  以下有大雷





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~






  很難想像一部殘酷的生存遊戲電影

  卻在講述一群孩子互相扶持、生死與共的情誼

  你以為這種背景環境下

  大家應該要勾心鬥角、爭個你死我活

  沒想到從第一個孩子死的那刻

  就定調了這不是那樣的電影


  大家想要贏，但沒有人希望其他人死去

  你以為的壞人，其實陷入深深的自責心魔中

  大家很清楚這是只有一個人能活下去的比賽

  但是他們依舊願意互相幫助

  扶一把快走不動的人

  拉一把停下來的人

  鼓勵彼此一起再走一段路吧



  最後雷對彼得說：

  「你眼中可以看到更美好的世界，我希望你活下去」


  但對彼得來說

  他最想要的是一個朋友、一個兄弟

  那是比錢更重要、比贏更重要、比活下來更重要的


  彼得原本的願望是，

  希望未來的大競走能有兩個贏家

  但他把自己的願望換成雷的願望了

  他希望雷放棄復仇，好好活下去、回到媽媽身邊

  但他卻代替雷成為拿起槍的人


  朋友看完後跟我說

  你知道雷為什麼要停下來，讓彼得活下去嗎？

  我說，因為彼得可以看到他所看不到的未來

  因為他對這個世界還有美好的想像

  他對生存和生活還有著期許

  那是雷對這個世界感受不到的東西


  朋友說：

  不是，是因為他知道彼得會為他殺了少校

  雷知道自己殺不了少校，但是彼得會為了他這麼做


  我整個有種世界崩潰的感覺

  彷彿剛剛感受到的感動被玷污了


  但朋友覺得

  若彼得為了雷而死，那是為了友情而死，是小愛

  但雷犧牲自己讓彼得活下來，

  讓彼得在全國民眾眼前殺了少校，

  才是真正有機會改變體制的契機，是大愛


  我不知道這個結局是史蒂芬金的結局

  還是導演法蘭西斯勞倫斯的結局

  但我想聽聽大家的想法

  要爆我小說結局也沒關係！







  --'
