title: 'Re: [負雷] 大競走 大失敗 不知所云的大爛片！'
content: '這部基本上是好人版大逃殺，可能也不是好人，但就很純樸鄉下農民的感覺


  開頭沒多久就死的那個小孩，死前才喊不公平，就是這麽傻，體能輸人一截難不成以為靠毅

  力能贏嗎？


  其他人看起來也是沒做啥功課，長途競走帶那些有的沒的幹嘛


  原版大逃殺看完是誰好壞誰好聰明，這版看完真的只有體制好可惡，明明這群人真的就是群

  善良順民，卻這樣被玩死


  結局很有意思，主角原本想復仇，最後被說服這世界還有很多美好，把機會讓出去，反而男

  二勸他放下，最後自己理智斷線


  然後這部不愧小說改的，台詞很多句覺得寫挺好

  ----

  Sent from  on my iPhone XS


  --'
