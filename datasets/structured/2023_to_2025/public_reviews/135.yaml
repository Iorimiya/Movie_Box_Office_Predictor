url: https://www.ptt.cc/bbs/movie/M.1757753401.A.D7A.html
title: '[負雷] 大競走 大失敗 不知所云的大爛片！'
content: '有雷


  先誇獎片商，真的很誠實


  主打一直走到死


  沒想到真就是一路拍到底


  嘈點太多，請聽我娓娓道來..


  1. 角色背景完全沒介紹


  除了47號小白給幾個家庭畫面

  其他角色完全沒說明，連參賽目的、願望都不知道

  小白大概給了5%故事，然後就說要一把槍，觀眾是看得一頭霧水


  2. 國家盛事，卻無人聞問


  說什麼辦完可以增加生產力，但一路上也就幾個路人旁觀

  電視直播也只是說說，最後放幾發煙火打發觀眾，完全感受不到賽事重要性


  3. 演員搞錯規則，一路集體發神經


  這部劇規則明明是走到最後一名才勝出

  但所有人卻像比賽有終點線一樣，一路起肖

  聊天交友？互相扶持？結成三劍客？

  看到其他人被處決不是暴怒，就是嚇得莫名其妙？

  初期挑釁其他選手行為的長髮哥反而很合理

  以為是什麼策略，結果長髮哥也就真只是發神經


  這部劇非要說優點

  就是唯一的正常人23號小黑勝出

  大家看著47號小白鬼吼鬼叫，一度很擔心

  想說讓這白癡勝出... 是在哈囉？

  結尾小黑演老梗 自願停下，我真的快崩潰

  幸好小白有自知之明，趕快退群結束比賽


  史蒂芬金的作品都讓我有種感覺

  明明可以拍得好看，卻總是差強人意

  而這部就是其中最糟糕 最噁心的


  如果想看一群人鬼吼鬼叫 法克法克

  沒其他鏡頭，就是拍人走路 晃啊晃的

  傷財傷眼又浪費時間的話就請便~



  --'
