title: '[負雷]《大競走》，HUNTER x HUNTER 獵人第一試'
content: '部落格版：


  即將於本月迎接78歲生日的恐怖小說大師史蒂芬金，是美國當代最具影響力的暢銷作家之

  一，許多作品包含《魔女嘉莉》、《鬼店》、《禁入墳場》等都曾被改編成電影，而今年

  初不僅有改編自史蒂芬金於1985年出版短篇集《史蒂芬金的故事販賣機》的同名短篇故事

  《史蒂芬金之猴子》，年底也有另部改編自1982年長篇小說《奔跑的男人》的反烏托邦黑

  色幽默動作驚悚片《逃亡遊戲》將上映。只是在這兩部電影的中間，其實也有一部同樣出

  自史蒂芬金之手的作品被搬上大螢幕，不過當時這本書的作者卻不是史蒂芬金，而是其為

  了在「每年只能替一位作者出版一本書」的不成文業界風氣下能夠再多出書，同時觀察若

  是拿掉史蒂芬金這個名字，他的作品是否還能熱賣、受到市場歡迎而取的筆名「理查史塔

  克」。


  這本1979年出版、可在台灣卻是2021年才由皇冠出版社出版中文版的《大競走》，雖是史

  蒂芬金以筆名理查史塔克發表的第二本小說，然而這篇長篇小說實際上是比史蒂芬金首部

  作品《魔女嘉莉》出版的1974年還要更早約八年前就完成，因此《大競走》通常被認為是

  這位恐怖大師真正的第一本著作。沒有讀過原著，僅從電影情節判斷的話，《大競走》故

  事背景設定在未明的年代，不確定是更早之前或者是近未來，只知美國當時仍陷於剛結束

  戰爭的折磨與煎熬，政府為了鼓舞人民並給人民帶來希望，於是每年便會舉辦名為「大競

  走」的比賽，在全國青少年中挑選五十位（小說應為一百位）參與比賽，規則相當簡單、

  那就是一直走，過程中必須維持一定速度，不能停下、不能休息、不能違規，在指定的路

  線裡無終點的走，直至剩下最後一名參賽者為止。


  《大競走》概念無不讓人想到導演法蘭西斯勞倫斯過去曾執導的系列電影《飢餓遊戲》，

  或許差別只在於《大競走》是從全國報名的人中挑選，而《飢餓遊戲》則是利用抽籤方式

  選出參加遊戲的貢品。不過《大競走》從由參加者主動報名到不斷走、不斷淘汰人的比賽

  機制，其實更像日本漫畫家富堅義博老師筆下《HUNTER x HUNTER 獵人》中，主角小傑等

  人參加的287期獵人試驗裡由薩茨擔任主考官的第一試驗。測驗內容就是單純的一直走，

  直到第二試驗的考場為止。而《大競走》有許多情節也都有《HUNTER x HUNTER 獵人》即

  視感，如有人走到精神崩潰、出現幻覺，也有參賽者出言挑釁影響其他人導致其遭淘汰，

  主角雷蓋瑞堤同樣如小傑結交三個好友互相打氣等等，不過《大競走》只能有一個勝出者

  。



  身為一個沒有讀過原著小說的觀眾，事前對於簡介的劇情與預告是好奇與期待的，很想知

  道這樣的劇情會如何發展，又或者會有怎樣的信息傳遞？不過當實際看完《大競走》，我

  只能用匪夷所思四個字來形容我看完電影的感受。我不會說電影沒頭沒尾，但確實從頭看

  到結束還是不知道電影的重點是什麼，開頭雖有稍加介紹大競走比賽的舉辦意義，可終究

  這個比賽能夠激勵到人民嗎？先姑且不論那些遭到射殺淘汰的參賽者們家長是否認為孩子

  們的死亡是種勇敢的榮譽，當比賽進入尾聲即將誕生優勝者，聚在一起的民眾看著上校開

  槍擊斃雷，或者看著彼得實現雷的願望，要了把槍反殺上校替其報仇時，他們真的能從這

  樣的結果對未來日子感到希望嗎？在《飢餓遊戲》裡被迫參賽的凱妮絲，在最後成為了民

  族英雄與精神領袖，她的挑釁與無畏激起人民反抗與推翻政權的心。


  反觀《大競走》裡不論是雷還是彼得，他們的死與勝出似乎帶給不了這個國家什麼。而既

  然談到雷與彼得，雖然我不曉得原著內容怎麼描寫，但我不是很喜歡電影裡暗示彼得是同

  性戀者且還對雷抱有好感，對我來說這是很多餘的設定。接著，前面會說到我對《大競走

  》感到匪夷所思，或許有很大部分原因在於這些參賽者。《飢餓遊戲》是被迫參賽，因此

  想方設法要逃離遊戲掌控或與有著相同想法的參賽者合作破壞遊戲是能夠理解的，而《

  HUNTER x HUNTER 獵人》則因沒有限定勝出者人數，彼此互相幫忙、攙扶到重點也是合理

  ，可是《大競走》中的比賽表明是完全自願報名，且舉辦了好幾屆每個人肯定都知道這場

  比賽不是死就是獨自勝出，結果整場比賽下來非但沒有你死我活的競爭意識，反而是人人

  散發和平聖光，不僅替領到警告的人加油打氣，還會不顧自己也會領到警告出手相救，如

  果說是主角會有這樣的表現我能接受，但《大競走》卻是所有人都走這個路線。


  在《HUNTER x HUNTER 獵人》的第一試驗中，有東巴這樣不以勝出為目標，而是阻礙其他

  參賽者為樂的人在，也有在參賽者快要撐不下去時，從旁不斷出言打擊對方直至其精神崩

  潰的亞摩里三兄弟。基本上我會認為有東巴或亞摩里三兄弟這樣的參賽者參與才是正常的

  ，尤其是大競走這樣早已表明「只有一個人能活到最後」的比賽裡更是。事實上電影中確

  實曾疑似出現兩個我覺得是這樣的角色，那就是蓋瑞與史戴本。前者在前面曾出言挑釁一

  名參賽者，最終導致該名參賽者的淘汰死亡，當雷等人紛紛指責蓋瑞的惡劣時他還強硬反

  擊，甚至還恐嚇雷等人要小心，本來想他應該就是這場比賽的東巴或亞摩里三兄弟。結果

  出乎意料的是，蓋瑞直至最後再無任何表現，只是不斷強調自己有多愧疚、還想試圖融入

  主角群...。



  至於後者，本來預期史戴本前面的寡言會在後面劇情上演什麼反轉，加上在剩餘五、六人

  時提議眾人若是再有誰撐不住了，每個人都要承諾會袖手旁觀，忍不住讓人對這個角色的

  安排有所期待，結果又一個出乎意料，史戴本就和蓋瑞一樣，走到生命盡頭也沒有任何表

  現，很突然的表明自己是上校的兒子，很突然的上演一段告白，很突然的自願退出比賽給

  軍人們開槍射殺，然後就沒了。其實不只蓋瑞與史戴本，《大競走》整個走向都是上一秒

  會介紹一個角色，下一秒就是這個角色領便當，從最前面的捲毛、想將比賽寫成書的眼鏡

  男、烙賽的男人、提音響的開朗男孩到後面莫名衝出去奪槍自殺的柯利等等，《大競走》

  就是寫了許多看似有戲份可實際卻完全不知道在幹嘛的角色，和同樣角色情感薄弱的三劍

  客相比，這些角色的出場更像是用來撐片長。


  至於最後的勝出者我是有感到意外，不過卻也再次回到最根本的問題，這場比賽與這些參

  賽者的重點到底是什麼？透過男主角雷精神到達極限後陷入的幻覺知道，他的父親堅信著

  自己的理想與信念，不屈服於任何迫害與淫威，最後遭到上校殺害，而雷來參賽的目標就

  是想要殺了上校，然而最後他卻選擇讓彼得勝出比賽，好讓他去實踐更偉大的理想，只是

  如此一來我就想，一是雷是否在這次比賽中領悟到了當時父親死前告訴他的那一番話，二

  是雷隨著比賽走到他的家鄉，看到母親站在路邊他不顧警告的危險也想上去討個擁抱，最

  後是母親和彼得等人的阻止才讓他邊嚷著對不起後悔參加這個比賽邊退回隊伍裡，但最後

  他選擇淘汰自己時卻沒有想到母親，這也是讓我無法理解的部分。


  整體來說，《大競走》好看的地方在於電影那些直接的畫面，無論是被槍擊爆頭或是參賽

  者身心逐漸崩潰的模樣，還有生理上的無法忍受等等，確實在某種程度上會讓觀眾感受到

  壓迫與緊張，但整個比賽過程幾乎、至少對我而言並沒有足夠的刺激感，而陪著這些角色

  走了好幾天，直到彼得勝出我還是抓不到這比賽的重點到底是什麼。《大競走》就是好像

  什麼都有但也什麼都不深刻，裡頭角色間的談話亦是，這樣單調的直線劇情重點很顯然會

  是這些對話，利用對話慢慢引出這部電影、這個比賽的存在價值與意義並拋給觀眾思考，

  但成效如何我個人持保留態度。


  --



  因為很喜歡看電影，

  或許不是寫得很好，

  不是所謂的專業影評，

  只是很單純的想把看完電影後的想法用文字述說出來。


  --

  原來如此，謝謝解答'
