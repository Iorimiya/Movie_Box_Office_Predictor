title: '[無雷] 意外無冷場的大競走'
content: '還沒看之前，大家都說這部片就是一直走而已，很無聊


  但是看完以後真的很不錯


  就是這麼簡單的規則，比賽裡面卻有很多的狀況，參賽者也會不斷有策略跟想法


  這些都是一般人根本不會去想到的問，題讓人忍不住思考


  裡面有很殘酷的，也有很感動的，看的是熱淚盈眶，沒有想到自己平凡的生活也能是這麼的幸福


  全程幾乎沒有冷場，從頭精彩到尾


  現在這部片的評價不太好，戲院裡戲院外都是


  但我覺得不要受到評價左右，有興趣就去看一下，不會失望的


  觀影前可以記得1英里等於1.6公里，這樣電影裡面在講他們走了多遠就大概有概念了


  評分8.4／10


