url: https://www.ptt.cc/bbs/movie/M.1757154186.A.E3C.html
title: '[情報] 史蒂芬金《大競走》上映戲院列表來了   '
content: "上映戲院列表來了\n\n\n\n繼續走，或者死。\n\n出自史蒂芬金震撼處女作《大競走》\n\n9月12日(五) 與全美同步上映\n\n  \n\
  \n這是場沒有終點線的比賽\n你...能走多遠？\n\n\n  出自「故事之王」史蒂芬金真正的處女作\n\n《飢餓遊戲系列》億萬名導法蘭西斯勞倫斯再一反烏托邦神作\n\
  \n《甘草披薩》金球獎最佳男主角提名庫柏霍夫曼領銜主演\n\n《星際大戰系列》「路克天行者」馬克漢米爾精彩演出\n\n繼續走，或者死。\n\n一群青少年在每年一度的比賽「大競走」中行走著，規則很簡單，他們必須保持一定的速\n\
  度步行，超速或停下來將會收到警告，當累積滿三次警告就會領到「罰單」——\n\n也就是遭到擊斃。\n\n這項比賽沒有終點線，直到產生最終的勝利者才算結束，想要活命只能一直走下去……\n\
  \n--"
