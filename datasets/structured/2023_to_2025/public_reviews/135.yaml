url: https://www.ptt.cc/bbs/movie/M.1757784759.A.3E4.html
title: '[好雷]  大競走  走讀的公路片'
content: '沒有看過史蒂芬金的小說


  但看完

  站在我這邊（Stand by me 1986) 後，

  覺得他把友情寫的好棒



  看 大競走 的預告以為是走 迷霧驚魂 那種

  恐懼帶來人性惡的走向


  意外整部主軸是友誼


  如果你是期待大逃殺的一路殺到底

  那這部可以跳過，

  基本上就是一部標準的公路電影，移動跟對話


  每個角色越接近死亡越真實


  喜歡對話的人，推薦去看

  每一個角色篇幅都不大

  導演強在短時間讓你認識角色


  相較一樣是史蒂芬金的牠（It)

  導演角色都編太長 力度又不夠


  另外看的時候一直想到

  布萊德彼特 在凱撒電影獎引述的

  問「旅程跟目的地哪個比較重要」

  答「同行的人」









  ~~~~~~~~~~~~~~~防雷~~~~~~~~~~~~~~~








  #47跟#23

  說他是為了殺父仇人 來復仇的


  #23

  沒有家人，為了贏得獎金

  幫助更多像他一樣的人


  最後一段 #23 失去 #47

  要了那把卡賓槍


  這段感情的流動 真的很讚



  我最喜歡的角色是#5

  史蒂芬金 一定有的嘴炮角色






  --'
