url: https://www.ptt.cc/bbs/movie/M.1758105967.A.762.html
title: '[討論] 大競走翻譯問題(無雷)'
content: '1. 人名翻譯

  刻意講姓名倒過來是現在翻譯的潮流嗎？

  比如雷蒙·蓋瑞提（Raymond Garraty）

  劇中翻譯寫成蓋瑞堤  雷蒙

  因為所有人名都這樣翻 應該是故意的

  以前沒看過這個做法 好奇問一下


  2.體重磅數直接換成公斤

  比如主角說自己177磅 翻譯寫成80公斤

  這點我也覺得蠻刻意的

  會讓人蠻出戲的

  而且後面miles又翻譯英里 沒換公里

  事情做一半 搞不懂翻譯的用意

  很容易製造觀眾混亂與出戲


  我不懂翻譯這兩點的用意

  是最近電影翻譯都有在刻意在地化人名跟量度單位嗎


  謝謝回答

  -----

  Sent from JPTT on my iPhone


