title: '[討論] 史蒂芬金「大競走」預告 飢餓遊戲導演'
content: '改編自史蒂芬金處女作

  飢餓遊戲法蘭西斯勞倫斯執導

  講述一群年輕人被極權政府壓迫玩一場一直走的生存遊戲


  原著小說沒有特定的主線，不知道電影會怎麼改

  史蒂芬金光是今年就有猴子、查克的一生、逃亡遊戲、影集還有機構，金老還有極限嗎?


  --

  別這樣，小說本來就不是年輕就能寫得好，艾西莫夫的基地也是寫得很爛

  你們兩位不要急著水桶，冷靜'
