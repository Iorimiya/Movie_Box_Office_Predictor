title: '[金馬] (6) 藥頭III：死神上門'
content: '本文轉載自超連結圖文版：


  本片是丹麥導演Nicolas Winding Refn著名的「藥頭三部曲」的第三集，被譽為

  是三部曲中最精彩、手法最成熟的一部傑作。曾在多倫多影展倫敦電影節、以及

  鹿特丹影展獲獎。沒看過前兩部「藥頭」系列的也可以直接看這部，因為除了幾個

  要角在前兩集有露過臉以外，劇情上並沒太緊要的關聯，可視作一個獨立的故事。

  更確切地講，第三集的男主角就是在第一集裡供貨給Frank、第二集也有少許露面

  機會的那位「哥本哈根藥頭」米羅（Zlatko Buric飾演）。


  《藥頭III：死神上門（Pusher 3: I''m the Angel of Death）》以菸毒勒戒中心

  一場宣誓要戒毒的聚會做開場。每個人一如往常，在例行「心得分享」中都希望當

  天能夠忍住不去碰毒品，「一定要撐過今天！希望能戒掉！」成員們掏心挖肺地互

  相加油打氣，一片溫暖祥和。然而對於互助小組成員之一的米羅而言，這將會是個

  艱難無比的一天。


  整部電影的劇情就發生在米羅生命中這看似平凡、實則非凡無比的一天。這天是他

  心愛的女兒梅琳娜（Marinela Dekic飾演）25歲生日。平日以做廚師為正業的米羅

  一方面得履行對女兒的承諾───負責60人份的生日派對餐───另一方面又得在

  競爭日趨激烈、年輕一輩毒梟崛起、搶奪地盤的威脅下，在這同一天處理好毒品生

  意上紛至沓來的棘手問題。


  這天他的上游供貨商搞錯送貨的車輛，原本該交到他手中的大批白粉卻成了他這把

  年紀的老毒梟不曾賣過的新玩意───10,000顆搖頭丸。為了阻止年輕一輩的毒梟

  坐大，在完全不懂搖頭丸的情況下，他決定硬著頭皮收下這批貨，透過難以完全

  信賴的下游掮客穆罕默德去幫他找買主。自己的親信手下當天早上吃了他的白菜捲

  （sarma）都食物中毒、上吐下瀉去了，沒能去幫他盯穆罕默德、也無法協助他張羅

  當晚生日派對的酒食；穆罕默德上午拿了10,000顆搖頭丸竟一去不返、杳無音信，

  讓取了貨又繳不出貨款的米羅遭受上游供貨幫派的施壓；為了預防早上的食物中毒

  重演，他倒掉60人份的白菜捲，改向附近的中國餐館買60份現成的「炸魚」，在等

  炸魚的期間，遇上過去的吸毒老友，送他一包白粉。生意和晚宴都失控的壓力，讓

  他再也抵擋不住眼前這包白粉的誘惑，躲到餐館廁所去「破戒」。


  他僱「打手」去幫他抓穆罕默德回來，同時向上游供貨的幫派爭取額外的寬限期。

  上游幫派份子同意給他寬限，只要他肯空出自己的店來讓他們「解決問題」，在

  別無選擇下，平日只賣毒品和餐飲的米羅被捲入波蘭黑幫販賣人口、逼良為娼、

  非法移民的勾當。所有這些愈搞愈複雜的事情都發生在這緊湊到得「與時間賽跑」

  的同一天裡。又因為被逼為娼的外籍非法移民少女與他女兒同一天過生日、激起了

  他的惻隱之心，同時波蘭人口販子給他吸的白粉又摻了「安仔」，讓他一時衝動竟

  拿鐵鎚敲死自己的上游毒梟。


  為了善後，他只得在三更半夜求助於昔日的道上摯友拉多凡（在第一集出現過，由

  Slavko Labovic飾演），使得劇情的最後段落變成活像「毀屍滅跡」教學影片。對

  於分屍前放血、清除內臟、以及切割方面鉅細靡遺的「詳解」，本片比

  《人肉叉燒包》、《德州電鋸殺人狂（The Texas Chainsaw Massacre）》等電影

  還要勁爆，展現出北歐電影在寬廣尺度容許下發揮出的奔放創作力。


  本片的有趣之處在於主人翁得在毒癮、江湖道義、以及親情壓力的掣肘下、在雙重

  身份的夾縫中求生存、根本難以隻手遮天的衝突感。從一早「白菜捲」引發一長串

  的連鎖反應，令後續所有事情都脫序失控。另外米羅與上游毒梟以及下游的穆罕默

  德之間談判議價的過程竟也在他與女兒梅琳娜之間發生，因為梅琳娜的未婚夫也替

  米羅販毒，父女倆為米羅的抽成問題做「在商言商」的談判，饒富諷刺意味。


  在經歷這嚴重挑戰心臟強度的一天後，米羅堪堪「過關」，在各方面都算勉強兼顧

  到了，而在「破戒」、「殺人」、「滅屍」後，唯一讓他得以脫除罪惡感的憑藉，

  竟是責任歸屬含糊不清的「假搖頭丸」糾紛───究竟是上游毒梟用便宜的糖果來

  冒充搖頭丸坑他、亦或是穆罕默德把搖頭丸調包成糖果，導演留給爆累了一天的米

  羅以及觀眾一個無解的結局。


  有時候真正重要的是問題的排除，而不在於事實的真相，因為在利益、立場的衝突

  下，真相早已淪為各有所圖、無從釐清的羅生門。


  影展放映時間：11月19日星期日04:10；11月19日星期日21:10




