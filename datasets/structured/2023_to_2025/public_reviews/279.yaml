url: https://www.ptt.cc/bbs/movie/M.1429363623.A.722.html
title: '[live] 活路：妒忌私家偵探社-衛視電影'
content: '活路：妒忌私家偵探社


  簡介(niotv):

  金馬得主張世首次執導，改編自台灣作家張妙如同名小說的懸疑推理國片，由楊謹華、劉

  以豪、林美秀、吳大維、屈中恆、郭書瑤、馮光榮攜手主演。


  剛從海外回台的富二代嚴肅君(劉以豪 飾)從小喜愛偵探小說，他在因緣際會下，來到了

  「妒忌偵探社」應徵助理。偵探社女主人杜紀苓(楊謹華 飾)是個靠著過人眼力與觀察力

  辦案，並也兼做算命館的神婆偵探。嚴肅君萬萬沒想到，他助理生涯居然都是協尋狗貓之

  類的雜碎小事，而杜紀苓幾乎都在替人算命，一度萌生退意。


  就在此時，一宗豪門謀殺案件上門：「建設公司老闆宋毅(吳大維 飾)，前來委託調查貴

  婦妻子林育敏(林美秀 飾)的離奇案件。」杜紀苓率嚴肅君循任何線索展開偵查，究竟神

  婆偵探加上菜鳥助手的這對姊弟偵探組合能否順利破案，找出真正的兇手？


  劉以豪在片中獻出大銀幕首次全裸演出，他因喝醉而躺在楊謹華香閨的床上，讓楊謹華親

  手扒光他的嘔吐衣物，再用手擦拭親撫他的胸膛。而林美秀也為本片獻出她從影以來首次

  床戲，她在片中和老公吳大維有場「超激烈」的床戲，兩人還特地為此在拍攝前去學吉魯

  巴。


  維基:活路



  --'
