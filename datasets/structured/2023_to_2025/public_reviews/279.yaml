url: https://www.ptt.cc/bbs/movie/M.1413865609.A.147.html
title: 'Fw: [心得]《活路:妒忌私家偵探社》推理小說改編電影'
content: "作者: geniusleuth (相信台灣，堅持本格) 看板: Crime_Movie\n標題: [心得]《活路:妒忌私家偵探社》推理小說改編電影\n\
  時間: Tue Oct 21 12:23:44 2014\n\n原文發表網址(附電影海報與預告片)\n\n\n因為參與《甜蜜殺機》編劇工作，因而認識了《活路：妒忌私家偵探社》編劇\n\
  之一的于尚民，早在認識尚民之前，就已聽聞此人在業界頗活躍，拿過幾次優\n良電影劇本獎；在認識尚民之後，他在編劇這塊領域的成就也愈來愈高，這一\n兩年頗受好評的國片《志氣》和《愛情無全順》，他皆參與其中，可說是創作\n\
  路線相當寬廣的一位編劇，這回《活路：妒忌私家偵探社》的編劇工作更涉及\n「小說改編」這塊次領域。\n\n在電影工業興盛的好萊塢，由小說改編的電影占的比例頗高，但在台灣，以改\n\
  編劇本拍攝的電影卻不多，我個人推測，可能是台灣大多數的文創產業不夠興\n盛，各個領域的產業根基自身都無法站穩了，哪還有辦法相互支援合作。所以\n《活路：妒忌私家偵探社》這樣一部難得由小說改編的電影，自然引起了我的\n\
  興趣，不單單只是因為有朋友參與編劇的關係。\n\n劇情描述曾找上私家偵探杜紀苓調查丈夫外遇的妻子某天中毒身亡，警方懷疑\n死者的丈夫涉有重嫌，而死者的丈夫為了自清，歪打正著地從妻子身上的名片\n\
  找上杜紀苓，於是杜紀苓帶著自國外回來、剛應徵上徵信社助理的「嚴肅君」\n，四處訪查死者丈夫的外遇對象們，試圖找出真相……\n\n《活路：妒忌私家偵探社》改編自作家張妙如的同名小說，我並未看過原著，\n\
  對這個系列也了解不深，可能是我自己偏愛重口味的本格推理作品，故事當中\n有越古怪越奇特的案件越能得到我的喜好。相較之下，「妒忌私家偵探社」偵\n辦的案件看起來似乎日常平淡了點，推理性或許也因為故事的重心偏重角色人\n\
  物而顯得有些弱化。\n\n比方說，全片近兩個小時，但看到後來剩十五分鐘不到，似乎都還沒有破案的\n跡象，我還一度擔心會不會沒破案就結束了（若是這樣，就是給觀眾「裝肖仔\n\
  」了吧XD）。最後雖然順利破案，卻不免讓我感到收尾收得有些倉促。\n\n說到破案，我本以為最後那個帳號線索代表「擁有這個帳號的人即是兇手」，\n然而，真相卻非如此（若非如此，同一個英文名字也太碰巧了吧），即便真凶\n\
  的身分仍帶有某種程度的意外性，但我卻又覺得公平性略顯不足。（我的意思\n是：為何線索一定是指向EMAIL？不會是其他物品的密碼？）\n\n還有，電影中的一些場景畫面置入顯得有點突兀，像男女主角跑去跳民族舞蹈\n\
  那段，以及帶到 101大樓的鏡頭，安排手法似乎太過刻意，不夠自然。（這似\n乎是導演的責任？）\n\n不過本片還是有相當精采的亮點，飾演杜紀苓的楊謹華表現得相當稱職，即便\n\
  我沒看過楊謹華演出的偶像劇，但我卻認為杜紀苓這個角色很可能是她到目前\n為止的演藝生涯最具突破性的演出，裡頭抽菸飆髒話幾乎是習慣動作，甚至還\n出現嚼檳榔的場景──楊謹華演來絲毫不拖泥帶水，令人激賞。\n\
  \n一方面演員的表現固然優異，另一方面，也歸功於角色的塑造十分用心，才能\n跟演員的演出相輔相成。\n\n此外，全片時間和節奏的控制不錯（除了我之前說的破案稍嫌太急之外），沒\n\
  有一般常見小說改編電影導致劇情有疏漏不完整的通病，就改編劇本來說，算\n是相當成功的案例。（至少沒看過原著的我看完電影，對於人物背景設定，沒\n有任何不懂的地方）\n\
  \n台灣電影近幾年蓬勃發展，各種類型電影也如雨後春筍般逐漸冒出頭來，很高\n興能看到《活路：妒忌私家偵探社》這種由小說改編的電影，期待未來台灣原\n創電影在蓬勃發展之餘，也能順勢帶起小說改編影視的熱潮。\n\
  \n\n\n--\n台灣第一部鑑識科學推理電視劇《iHero 鑑識英雄》\n\n30秒預告片\n\n3分鐘預告片\n\n\n--\n             \
  \                   10/21 12:26"
