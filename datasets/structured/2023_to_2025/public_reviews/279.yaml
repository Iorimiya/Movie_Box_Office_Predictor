url: https://www.ptt.cc/bbs/movie/M.1413480419.A.886.html
title: '[普雷] 活路：妒忌私家偵探社 '
content: "這幾年來台灣電影的題材越來越多樣化. 例如KANO. 等一個人的咖啡.\n\n想飛. 活路. 共犯...等. 儘管每部片褒貶不一. 但希望台灣電影\n\
  \n能慢慢的走入的國際. 而不是只有好萊塢的電影佔據台灣大多的廳院..\n\n\n\n---- 以下為雷-----\n\n活路：妒忌私家偵探社\n\n-如果你期待看到緊張刺激的破案經過.\
  \ 這部片可能會讓你失望.\n\n-但如果你只想看到呆萌的的劉以豪. 這部片會滿足你的期望\n\n\n\n活路的電影介紹為 杜紀(楊謹華飾)與助手嚴肅君(劉以豪飾)\n\
  \n一起找尋線索. 以偵破建設公司老闆的貴婦老婆的離奇死亡案..\n\n原以為偵查的經過會非常的緊湊以及刺激. 但導演可能想放的人物\n\n可能太多. 導致每個嫌疑犯可說的故事很短.\
  \ 便只能像流水帳\n\n一樣匆匆帶過. 不夠飽滿. 有些可惜. 也無法塑造出\n\n\"到底誰才是兇手\" 的懸疑+緊張感...\n\n\n\n雖然偵查案件過程並不吸引人.\
  \ 但是男女主角之間的互動.\n\n讓人感覺輕鬆.有趣. 觀眾也不斷有笑聲傳出.\n\n例如 杜紀用心教導(OR 欺壓?) 嚴肅君時. 兩人之間逗趣的對話以及動作\n\
  \n或是  杜紀假裝是嚴肅君的大肚未婚妻時的場景....\n\n感覺其實這部片的主菜其實這兩人之間的互動+劉以豪的呆萌秀.\n\n而案件只是小菜而已...\n\n\
  \n\n這部片其他演員. 有些表現有讓我意外到. 也有一些遺憾到\n\n-屈中恆演的雄哥. 逗趣. 最喜歡看她被女主用錄音機威脅的時候\n\n-林美秀演的貴婦.\
  \ 為什麼他最後的獨白. 要一直戴墨鏡.\n\n 我還蠻想看她用眼神演出.\n\n-郭書瑤演的詩娜. 造型有些失敗. 看不出來飾演的是 \"酒店名花\". 人物著墨也不深\n\
  \n-馮光榮演的貴婦前夫. 演的娘味+逗趣感十足. 我差點忘了他原本就是演員出身的\n\n\n\nPS. 這部片如果之後能上電視台播嗎?\n\n因為杜紀狂吸菸\
  \ + 罵髒話 + 吃檳榔. 應該會狂被消音+剪片吧~哈~\n\n(楊謹華是個認真的女演員.....)\n\n\n\n\n\n\n\n\n--"
