url: https://www.ptt.cc/bbs/movie/M.1754040846.A.C75.html
title: '[好無雷] 私家偵探'
content: '剛看完私家偵探，意外蠻喜歡的

  懸疑氛圍營造得不錯，不是靠高潮迭起的劇情推進

  比較像是用一種貼近日常的調性

  慢慢鋪陳人物、事件、線索，讓觀眾自己拼出全貌


  古天樂演的偵探有點邋遢、有點嘴硬

  辦案方式沒那麼正規，但觀察力很細

  他和那位染頭髮的小混混朋友互動很好笑

  看起來很鬧，實際上默契很好，意外讓整部片多了一點溫度


  劉冠廷表現也很亮眼

  他的角色比較壓抑、行事風格冷靜

  有幾場戲幾乎沒什麼台詞

  但光靠眼神和肢體就能把角色的情緒和掙扎演出來

  他跟古天樂的對戲也很有張力，不是正面衝突

  而是氣場的拉扯，也看的捏把冷汗

  整體來說，沒有大場面、不炫技，但劇情紮實、角色有溫度，很可以看


  --'
