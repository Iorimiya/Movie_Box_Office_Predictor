title: '[新聞] <夢想巨無霸>獲印尼副總統、政府官員推薦'
content: '新聞網址：



  印尼有史以來最賣座電影《夢想巨無霸》（Jumbo），即將在10月3日中秋連假以原文、中

  文配音雙版本同步在台獻映。全片集結親情、友情、冒險、奇幻元素，成為大人必看、小

  朋友也得以學習到家庭價值觀、努力的勇氣，以及面對困難的解決方法。這也讓本片吸引

  超過1000萬印尼民眾入場觀賞，成為全民運動，相當於每28個印尼人，就有一人觀賞過這

  部電影，展現驚人的現象級氣勢。同時，本片更獲得印尼副總統、文化部、外交部、創意

  經濟部、眾議院等政府部會的集體推薦，副總統吉布蘭拉卡布明拉卡（Gibran

  Rakabuming Raka）更包場邀請社會福利機構的小朋友們一同觀賞，鼓勵大家就要如片中

  主角一般，不要害怕做自己，要勇敢追夢，並在面對人生挑戰時保持堅韌不拔的精神，也

  讓本片成為不論家長、老師都可以放心帶小朋友觀賞的寓教於樂最佳動畫首選！





  《夢想巨無霸》描述主角「東東」是一位個性內向，又因為身材與外貌常遭同儕嘲笑與排

  擠的男孩。某天，他意外展開一段奇幻冒險，並在過程中學會勇敢面對自我、接納差異、

  團結他人，也找回屬於自己的光芒。印尼副總統吉布蘭拉卡布明拉卡認為，本片在印尼取

  得影史最高票房成就，也象徵印尼動畫產業邁向全新時代，更是印尼年輕世代能在全球舞

  台上展露自身實力的明證。吉布蘭強調，年輕世代在國家發展方向中扮演關鍵角色：「年

  輕一代不只是人口紅利，更是未來挑戰的答案。我們可以看到，如今已經有愈來愈多年輕

  人站上第一線。」他也進一步表示，片中所傳遞的價值觀，與印尼總統普拉伯沃蘇比安托

  （Prabowo Subianto）所提倡的「致力培養優秀青年世代」政策一致，成為邁向「黃金印

  尼」（Indonesia Emas）目標的支柱之一。



  有鑒於本片有助於塑造包容力強、且具備韌性與品格的印尼兒童，吉布蘭也在日前邀請來

  自雅加達社會福利機構近200名兒童，一同前往戲院觀賞本片。他並當場鼓勵小朋友們不

  要害怕做自己，要勇敢追夢，並在面對人生挑戰時保持堅韌不拔的精神。他也強調，與他

  人建立良好關係並培養自信，是迎向未來的重要資產。此外，本片也能激發孩子們的想像

  力，並促進他們在表達自我方面的創造力發展，也讓其中一位小朋友在觀賞後興奮表示：

  「很開心能跟副總統一起看電影，而且這部電影真的很好看！」





  除了有印尼副總統以實際行動為《夢想巨無霸》背書，本片也獲得印尼各大政府機構的高

  度肯定。創意經濟部部長特庫里夫基哈西亞（Teuku Riefky Harsya）就對本片大力讚賞

  ，並強調動畫電影作為創意產業的驅動力，並認為印尼動畫有潛力成為代表國家的文化出

  口，同時更表示將協助本片推向國際市場，成為印尼在國際舞台上的「軟實力」。文化部

  長法德利瓊（Fadli Zon）也稱本片是印尼電影業能夠塑造角色、傳達道德價值觀，並在

  國際舞台上強化國家文化地位的明證：「本片的出現，就像是在各種電影類型中出現的一

  片綠洲。它不僅是娛樂，更是一段動人且充滿訊息的情感旅程。這正是電影如何能夠塑造

  品格、強化文化價值的典範。」外交部也將本片列為重要外交資產，安排外國大使館的高

  層專場放映，向全球推廣印尼的文化魅力。



  同時，印尼眾議院第七委員會議員諾維塔哈迪尼（Novita Hardini）認為，本片除了展現

  高度創意，也體現孩子們「合作互助」的精神：「這部作品歷時五年製作，動員遍及全印

  尼的數百位創作者。這證明印尼具備製作高品質動畫的非凡實力，並已經準備好跟全球動

  畫電影競爭。」她並強調，本片反映出印尼影視創意產業的蓬勃發展：「這充分證明印尼

  年輕人的聰明才智，他們不僅能創作出適合本地觀眾的作品，更具備在國際市場上的競爭

  能力。」她更總結：「我親自觀賞本片後深有感觸，這是一部體現奉獻精神與互助合作的

  作品。它不僅在市場上取得成功，更成功提升了本地創意產業的地位。」



  這部吸引千萬民眾入場觀賞、刷新印尼影史賣座票房紀錄，並獲譽為「亞洲動畫新奇蹟」

  的《夢想巨無霸》，即將在10月3日中秋連假以原文、中文配音雙版本同步在台獻映。本

  片劇情描述東東是與眾不同的十歲孤兒，經常因為身材與外貌而遭同學嘲笑與排擠。父母

  留下的故事書，裡面滿載神奇的故事與精美插畫，成為他心靈的避風港，也點燃他內心的

  勇氣與夢想。正當學校即將舉辦年度才藝表演，東東決定以故事書中的奇幻故事編排一場

  舞台劇，希望透過表演贏得大家認同。正當他全心準備時，那本珍貴的故事書卻被一位朋

  友偷走，讓東東深陷絕望當中。所幸奶奶與摯友們始終陪伴左右，給予他無限的力量與支

  持。低潮中，東東還遇見一位神秘而可愛的小精靈，請他幫忙尋找自己的父母。這場跨越

  夢境與現實的旅程，不僅帶領東東重新認識自己，也教會他如何勇敢面對恐懼與孤獨。當

  舞台燈光亮起，東東能否突破重重困難，展現最真實且勇敢的自己？而那本承載著回憶與

  夢想的故事書，最終又能否重回他的手中呢？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
