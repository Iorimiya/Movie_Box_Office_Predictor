title: '[新聞] 【夢想巨無霸】傳遞寶貴主題獲教育家肯定'
content: '新聞網址：



  突破千萬觀賞人次，榮登印尼影史最賣座冠軍，並獲得印尼副總統、文化部、教育部聯合

  推薦的話題動畫《夢想巨無霸》（Jumbo），即將在本週五（10/3）以原文、中文配音雙

  版本同步在台獻映，絕對是中秋連假的闔家必看感動之作！本片不僅講述主角在冒險過程

  中所締結的珍貴友誼，故事並鼓勵父母可以更體貼地對待孩子，甚至大膽碰觸霸凌議題，

  以正面方式反思霸凌如何影響兒童心理。這也讓本片獲得眾多印尼教育學者的支持，穆罕

  默迪亞大學泗水分校（UMS）學前兒童教育師資培訓學程主任朱妮塔德薇瓦爾達妮（

  Junita Dwi Wardhani）便在受訪時給予高度肯定：「這部電影帶來了道德價值、勇氣，

  以及對於想像力的激發，這些都是孩子在成長過程中非常重要的養分。」值得一提的是，

  本片主題曲〈常在你心〉（Selalu Ada di Nadimu）憑藉詩意的歌詞和動人的旋律，傳遞

  了父母對孩子的愛與期盼，不僅成功將聽眾帶入深刻的情感之中，更在影音平台創下超過

  9000萬次播放紀錄，成為印尼今年最令人難忘的電影配樂之一。





  歷時五年打造、集結超過420位印尼本地創作者傾心投入的影史級動畫鉅作《夢想巨無霸

  》，故事大膽將主題擺在兒童於成長過程經常遭遇到的霸凌問題。電影不僅展現想像力和

  冒險的美好，更同時揭示兒童在社交互動中的陰暗。透過主角「東東」，帶領觀眾反思霸

  凌將如何影響兒童心理，以及來自環境支持的重要性。同時，本片也講述主角在冒險過程

  中締結的珍貴友誼。這些理念將在片中以動人的方式呈現，並提醒觀眾，無論身處何種困

  境，身邊最親近的人，都會給予希望與支持。不僅如此，本片也鼓勵父母要更加體貼地對

  待孩子，並傳達每個孩子都有權利感受到安全、關愛與安心。父母應該更加關注孩子可能

  會面臨的問題，並在應對霸凌時給予適當的協助。



  透過許多寶貴的主題與寓意，本片因此獲得眾多印尼教育學者的肯定。穆罕默迪亞大學泗

  水分校學前兒童教育師資培訓學程主任朱妮塔德薇瓦爾達妮便肯定本片極具豐富教育價值

  ，非常適合兒童、尤其是學齡前兒童觀賞：「這部電影既是一種清新的娛樂，也充滿了教

  育意義。現在的孩子們，非常渴望有一種與他們的年齡跟心理發展相契合的觀影內容。本

  片便帶來了道德價值、勇氣，以及對於想像力的激發，這些都是孩子在成長過程中非常重

  要的養分。」尤其當主角被刻畫成一位遭受霸凌，卻依然勇於面對挑戰並持續追求夢想的

  孩子，也讓朱妮塔有感而發：「本片也傳達關於韌性、自信與同理心的重要課題，甚至有

  一句觸動人心的台詞：不要只想說話，要學會傾聽。這對於兒童從小培養社交敏感度來說

  是非常重要的。」朱妮塔也指出，本片成功傳達保護隱私、尊重幕後工作者，以及培養孩

  子情感敏感度等重要價值：「一些簡單的行為，像是拿別人的東西前要先徵求同意，或是

  尊重幕後工作者的付出，這些都是非常重要的價值觀。這部電影成功透過細膩且觸動人心

  的方式，將這些價值傳遞出來。」這也讓本片成為值得家長帶小朋友一同進戲院觀賞的親

  子電影首選。





  《夢想巨無霸》在印尼取得影史最賣座票房佳績，動聽的音樂也是關鍵因素之一。主題曲

  〈常在你心〉憑藉扣人心弦的歌詞與溫暖旋律，成功傳遞父母對孩子深沉的愛與希望，充

  滿了祈禱、希望與溫暖，歌詞並傳達「即使孩子必須獨自面對人生中的挑戰與考驗，父母

  的愛與祝福，也將永遠陪伴在他身邊」這項訊息。這也讓本曲成功結合電影畫面，與聽眾

  建立深刻的情感連結，不僅受到兒童喜愛，成為「當代兒童國歌」，更受到父母和年輕人

  們的歡迎，甚至還有許多印尼家庭創作出本曲如中文、日文、韓文的翻唱版本，成為印尼

  今年最令人難忘的電影配樂之一，更在影音平台創下超過9000萬次播放紀錄，成為現象級

  國民金曲。





  這部吸引千萬民眾入場觀賞、刷新印尼影史賣座票房紀錄，並獲譽為「亞洲動畫新奇蹟」

  的《夢想巨無霸》，即將在本週五（10/3）以原文、中文配音雙版本同步在台獻映。只要

  購買本片第一週（10/3-10/9）期間場次電影票乙張，即可憑電影票於上映日起，至原購

  票影城兌換領取「A6歡樂貼貼紙」乙張，數量有限，送完為止。本片劇情描述東東是與眾

  不同的十歲孤兒，經常因為身材與外貌而遭同學嘲笑與排擠。父母留下的故事書，裡面滿

  載神奇的故事與精美插畫，成為他心靈的避風港，也點燃他內心的勇氣與夢想。正當學校

  即將舉辦年度才藝表演，東東決定以故事書中的奇幻故事編排一場舞台劇，希望透過表演

  贏得大家認同。正當他全心準備時，那本珍貴的故事書卻被一位朋友偷走，讓東東深陷絕

  望當中。所幸奶奶與摯友們始終陪伴左右，給予他無限的力量與支持。低潮中，東東還遇

  見一位神秘而可愛的小精靈，請他幫忙尋找自己的父母。這場跨越夢境與現實的旅程，不

  僅帶領東東重新認識自己，也教會他如何勇敢面對恐懼與孤獨。當舞台燈光亮起，東東能

  否突破重重困難，展現最真實且勇敢的自己？而那本承載著回憶與夢想的故事書，最終又

  能否重回他的手中呢？



  欲知本片最新消息，

  請上電影官方臉書粉絲團

  與Instagram專頁查詢。



  --'
