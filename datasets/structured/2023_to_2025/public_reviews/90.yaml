title: '[新聞] 印尼影史最賣座神片<夢想巨無霸>10/3上映'
content: '新聞網址：



  獲譽為「亞洲動畫新奇蹟」的感動話題巨作《夢想巨無霸》（Jumbo），即將在10月3日中

  秋連假隆重登上台灣大銀幕，並同步推出原文與中文配音版本，邀請大小觀眾一同走進戲

  院，體驗這場充滿歡笑與淚水的溫暖冒險。本片甫上映就橫掃東南亞票房，不僅成為印尼

  有史以來最賣座電影，更一舉刷新東南亞各國的動畫電影最高票房紀錄，掀起現象級觀影

  熱潮。短短60天就在印尼突破千萬觀賞人次，成為全民共鳴的現象級電影。本片甚至受到

  印尼副總統與文化、教育部門的高度肯定，更獲得眾多教育專家的聯合推薦，視為兼具娛

  樂性與教育價值的教學典範。本片以精緻畫風、細膩色彩與充滿魅力的角色設計，呈現堪

  比迪士尼與皮克斯的高水準製作，不論大人小孩都能在片中找到感動與啟發。面對本片創

  下歷史級票房成就，喜劇演員出身、首度執導動畫長片的導演萊恩阿德里安迪（Ryan

  Adriandhy）也感性表示：「這是一個簡單的故事，卻得到千萬觀眾真心的回應。這個曾

  經遙不可及的數字，如今化為現實。謝謝你們的信任，讓一個平凡的故事，變得不凡而有

  意義。」





  歷時五年打造，由印尼新銳導演瑞安阿德里安迪首度執導的動畫長片《夢想巨無霸》，集

  結超過兩百位動畫師、技術工程師、音樂家與視覺藝術家共同創作，完成了一部真正屬於

  印尼、也屬於全亞洲的驕傲之作。故事描述主角「東東」是一位個性內向，又因為身材與

  外貌常遭同儕嘲笑與排擠的男孩。某天，他意外展開一段奇幻冒險，並在過程中學會勇敢

  面對自我、接納差異、團結他人，也找回屬於自己的光芒。表面上，本片是一部充滿童趣

  的冒險電影，但本質上更像一面鏡子，映照出每個人在成長過程當中，曾經經歷的自我懷

  疑與不被理解。導演用最溫柔的方式說出最深刻的情感，不靠炫目的特效，也不靠劇烈的

  動作場面，而是透過細膩的情節與真摯的情感，深深打動觀眾的心。這也讓本片在印尼上

  映短短60天，便感動超過一千萬觀賞人次，一舉打破知名恐怖片《鬼舞村》（KKN di

  Desa Penari）創下的紀錄，榮登印尼影史最賣座電影寶座，更同步刷新東南亞各國動畫

  票房紀錄，成為現象級國民電影，國際媒體更盛讚本片是「亞洲動畫新奇蹟」。



  尤其印尼動畫在過去常被視為「只給小孩看的作品」，難以進入主流市場，但本片卻徹底

  打破這個偏見。全片無論在劇情深度或視覺呈現上，都遠超出預期，從精緻的畫風、細膩

  的色彩運用，到角色的豐富情感表現，每一幀畫面都充滿誠意，讓觀眾彷彿置身在國際動

  畫大廠的作品當中。不論是孩子、青少年，還是成年觀眾，都能在片中找到屬於自己的共

  鳴。這不只是孩子的冒險之旅，更是每個人心中那個「想被理解的小孩」的成長之路。導

  演與製作團隊更親自走訪印尼各地，尋找被埋沒在代工產業裡的本土動畫人才，將那些長

  年為國外動畫貢獻心力、卻少有機會開發原創的創作者們聚集起來，共同打造這部屬於印

  尼的動畫之作。這也讓本片不僅是一部電影，更像是一場文化運動，成為印尼動畫邁向國

  際舞台的重要里程碑。





  《夢想巨無霸》靈感取自導演萊恩阿德里安迪與編劇團隊的童年回憶與真實生命經驗，真

  摯描繪兒童心理創傷、校園霸凌與自我價值等成長議題。透過細膩動人的敘事與充滿情感

  的角色刻畫，不只感動無數孩子，更讓無數大人在觀影後淚灑影廳。這不僅是一部孩子會

  喜歡的動畫，更是一部每個人都能在片中找到自己影子的作品。它溫柔卻有力地提醒觀眾

  ：「每個孩子，都值得被理解、被傾聽，也值得被相信。」這樣深刻又真誠的情感，讓本

  片不只是影迷間口耳相傳的話題佳作，更被教育界、心理諮商師與家長們一致推崇為「必

  看電影」。無數學校與教育機構鼓勵親子一同觀賞，認為本片在情緒認知、自信建立、同

  理心培養等層面，都具有極高的教育價值與情感啟發力。導演並未閃避孩子成長中的陰影

  與脆弱，反而以孩子都能夠理解的語言，用影像帶領他們勇敢面對差異與痛苦，並從中找

  到屬於自己的位置。本片不僅適合孩子觀賞，更適合青少年、父母、甚至成年觀眾一同走

  進戲院，重拾內心深處那個曾經孤單、卻仍努力尋找自我的孩子，成為一場讓人笑中帶淚

  、看完後忍不住想擁抱身邊親人的溫暖體驗。



  面對本片創下歷史性票房成就，導演也感性表示：「我們非常感激這份祝福，這不只是對

  創作者的肯定，更是來自觀眾與印尼家庭間彼此分享的溫暖。能夠與這麼多對本片充滿歸

  屬感的人一起創造歷史，是我此生最大的榮幸。」而這部動畫，也將成為台灣觀眾心中永

  遠的驚喜。尤其在台灣觀眾少有機會接觸印尼動畫作品的情況下，本片以細膩的敘事與國

  際級的製作水準，讓人完全改觀。本片所要講述的，並非遙遠他方的故事，而是我們每個

  人都曾經歷過的渴望與勇氣。這是一部從孩子視角出發，卻能深深觸動每個世代心靈的作

  品，不只是闔家觀影首選，更是一場看完會讓人重新思考愛、理解與成長的動人旅程。



  這部吸引千萬民眾入場觀賞、刷新印尼影史賣座票房紀錄，並獲譽為「亞洲動畫新奇蹟」

  的《夢想巨無霸》，即將在10月3日中秋連假以原文、中文配音雙版本同步在台獻映。本

  片劇情描述東東是與眾不同的十歲孤兒，經常因為身材與外貌而遭同學嘲笑與排擠。父母

  留下的故事書，裡面滿載神奇的故事與精美插畫，成為他心靈的避風港，也點燃他內心的

  勇氣與夢想。正當學校即將舉辦年度才藝表演，東東決定以故事書中的奇幻故事編排一場

  舞台劇，希望透過表演贏得大家認同。正當他全心準備時，那本珍貴的故事書卻被一位朋

  友偷走，讓東東深陷絕望當中。所幸奶奶與摯友們始終陪伴左右，給予他無限的力量與支

  持。低潮中，東東還遇見一位神秘而可愛的小精靈，請他幫忙尋找自己的父母。這場跨越

  夢境與現實的旅程，不僅帶領東東重新認識自己，也教會他如何勇敢面對恐懼與孤獨。當

  舞台燈光亮起，東東能否突破重重困難，展現最真實且勇敢的自己？而那本承載著回憶與

  夢想的故事書，最終又能否重回他的手中呢？



