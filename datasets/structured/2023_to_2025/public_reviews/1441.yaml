url: https://www.ptt.cc/bbs/movie/M.1694183375.A.2E1.html
title: '[好雷] 查無此心'
content: '今天剛去看完

  覺得非常的好看

  趕快來推薦給大家！














  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~





  本來我對於驚悚片不是特別喜歡

  但是本片看完卻意外的覺的好看


  我覺得懸疑片該有的解謎與驚悚，本片都算是中規中矩

  從一開始就讓你無法喘息，跟著主角一步一步思考。


  但查無此心特別的是花了很多篇幅在描述對於主角內心的轉折刻畫

  多了很多的人文關懷。


  兇手揭曉之後，主要的戲劇張力也失去了，後面也許有些觀眾會覺得有點拖

  但我覺得如果為了完整交待主角們內心的轉折，後面的戲也不可少。


  戲中的角色們都經歷摯愛死去的痛苦，每個人面對的方式都不一樣。

  到最後看著Ace姊終於放下戒指，跟狗狗走出車子。

  終於得到最後的救贖


  心中真是暢快呢！



  --'
