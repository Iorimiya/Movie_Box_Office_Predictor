url: https://www.ptt.cc/bbs/movie/M.1693830849.A.DB9.html
title: '[影評] 《查無此心》翻玩觀眾想像　台灣犯罪類型'
content: '文／膝關節

  膝關節／《查無此心》翻玩觀眾想像　台灣犯罪類型突破


  《查無此心》，，更看見女主角張鈞甯如何突破過往。而且在警探犯罪這個推理路上，線索關

  聯性更難猜，最後轉折更見幾分驚悚。不得不說台灣在犯罪類型這條路上的突破，從《目

  擊者》、《緝魂》到《查無此心》都能見出製作細節耕耘巧思，與翻玩觀眾的類型想像。


  張鈞甯在本片飾演一個準備要自我登出的警探，因為同為警探的丈夫深受憂鬱症所苦導致

  自殺。正當選在跨年了結性命時，卻意外被路人找來查一起流水女屍。豈料這個女屍伴隨

  著落跑外勞、非法仲介，這個台灣底層多年來不願意被面對、尊重的議題，便燒出了整串

  生活悲歌之火。


  《查無此心》在犯罪結構上是很標準的類型，有著冷調硬頸的主人翁（張鈞甯），查案過

  程中慢慢地完成自己的救贖。張鈞甯片中的困頓就是無法理解丈夫為何選擇車內自殺而死

  ，不能諒解當時怎麼沒有陪在老公身邊，更跨不過去內心那些相伴積累的記憶門檻。她選

  擇把自己困在車內，那個丈夫最後終結自己性命座位上。


  張鈞甯這角色的寫法比較古典，所以搭配了狀況外卻又細心的菜鳥刑警（項婕如 飾），

  這兩位女警查案過程，在嚴肅節奏中妝點了許多很難寫的喜劇段落。這部分非常不容易，

  連辦案過程中狗屁倒灶情事接二連三，也能適時化解過於嚴肅血腥的收看高壓。相信觀眾

  絕對會被項婕如逗得哈哈大笑，畢竟張鈞甯一直在跟觀眾建立起那份瘦弱悲傷的纖細體型

  ，甚至還安排了一場入浴近乎半裸的大場面。


  說回來，犯罪推理這個路線確實不好拍，特別是當代觀眾隨時提防心態，太早把線索交代

  出來，中間大概就猜出兇手行兇原委。太晚才在結尾交代完畢，也會害觀眾覺得草草了事

  ，有時還會用說的講完劇情省事，省去用演的來交代。


  《查無此心》這個。解釋性的劇情固然有，但也因為犯罪動機能被充分合理化，最後的

  解釋空間就說得通。


  阮經天片中飾演非法仲介的江湖氣質，加上苦學泰語對白更能進入角色魂魄，片尾給足一

  場心碎爆哭考驗，這也是過去小天演技充滿爆發力的主場，他這回也把握很好。這段戲張

  力幾乎讓我回想《火線追緝令》中，布萊德彼特最後面對悲劇真相時的痛苦不堪。阮經天

  全方位崩潰絕讚演技，真心不騙不是蓋的。


  本戲還有許多亮眼綠葉，包括警隊長官陳為民，與協同辦案的黃鐙輝 ，以及戲份雖少但

  充滿亮點的薛仕凌。特別是陳為民片中口吻殺氣十足，又能疼惜張鈞甯的悲劇性角色，也

  給予不可氣的直球對決。


  兩人只要有對手戲都好看萬分，絕對是本片驚喜。四位編劇包括導演曾英庭， 楊貽茜、

  林品君、許世輝相信應該都花了大量時間完成田野調查，才能讓諸多角色立體有型，更足

  以說服觀眾相信台灣在犯罪推理這路線上的質感，值得入場體驗故事中的淒風苦雨，以及

  最後完成的人性拼圖。



  總體來說，《查無此心》片名裡的那顆心，恰如其分地成為本片最大懸念，有人失去了心

  ，變熱切地想考驗他人的真心。這些隻身來台打拼的異鄉人，多少人成了沒有名字、身份

  的孤苦無依者，也許在理解商業通俗題材學分之餘，更能理解這些異鄉人的寂寞。


  ----------




  可惜無法再度報名







  --'
