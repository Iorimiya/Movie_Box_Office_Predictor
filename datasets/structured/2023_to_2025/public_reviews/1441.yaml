url: https://www.ptt.cc/bbs/movie/M.1694176173.A.31B.html
title: '[好雷] 查無此心'
content: '本來我想發無雷文

  但懸疑片很容易爆雷

  乾脆就直接發心得文

  怕被雷就不要往下看

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  防雷

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  .

  當兇手說出反正沒人在乎移工這句話時其實很感嘆

  現今台灣有大量移工，逃逸的也不少

  因為低階層工作薪水少台灣人不做（像戲裡的屠宰場）雇主寧願請外籍移工也不願提高薪資


  阮的衝動演技不在話下，但較令我印象深刻的是遊，畢竟對資深演員的映像都在台劇而且大都是長輩角色，甚至還以為他是像宋串場而已

  直到最後謎底揭曉，看他每張相片笑的如此令人發寒呼應了他在拍照時說”拍照時的笑容要真實的”，當他幫手指戴上戒指以及保存了”真”心這些都是讓他在拍照時發自內心的快樂，一整個表現出這個角色的動機及慾望，完美呈現”一直笑，笑到你發寒”


  張串起了整部劇情推動，幸好這個角色的最後結果是好的，畢竟在整部戲的演出就算最後把他寫死也不意外(當然這比較不符合期待）但也因為整部片是以張的觀點推進所以觀眾會逐漸沈浸在他的心境轉折


  至於菜尾…就是戲裡的可愛擔當，警校第一畢業的可愛小女警會有一堆學長搶著照顧啦


  裡面的泰籍跟遊回憶裡的（印尼！？）演員很正，如果逃逸的是這種等級八成會有不少人搶著包…


  整部戲裡只有一段很好笑，就是黃鐙輝裝痞子表演彈舌被打的那段（果然脫離不了搞笑擔當）







  -----

  Sent from JPTT on my iPhone


  --'
