url: https://www.ptt.cc/bbs/movie/M.1704162778.A.B60.html
title: '[好雷] 查無此心'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  看似不適合新年，實際上超適合。意外很有誠意的一部片，靜景拍得好、幾位男性角色演

  出出色，以類型處理議題的方式難得不令人不舒服。


  個人覺得比較主要的缺點是菜尾那個角色的台詞有點太功能性，跟吳潔的對白幾乎沒有推

  理（雖然懸疑片，也並非一定要推理）。最亮眼的演出無疑是阮經天演出的阿生，各種語

  言之間的交替、動作表現都令人佩服。


  感謝Netflix迅速上架，雖然個人滿想知道一年前的金馬版本到底長什麼樣子，但院線版

  本，目前也還是滿意，會期待曾導下一部作品。



  ***


  這裡是我的樂園:




  --'
