url: https://www.ptt.cc/bbs/movie/M.1704170897.A.77B.html
title: '[好雷] 查無此心'
content: '張鈞甯監製的片

  第一次製作電影

  要找導演演員當老闆

  從中國回台後自己搞電影

  終於從痞子英雄的鑑識科

  當到了刑警，延續緝魂的職業


  這片我去二輪看的時候滿滿的人

  相較隔壁廳笨男人就人很少

  而且觀眾看這戲還很有反應

  都會順著戲的劇情跟著罵

  非常的入戲，張鈞甯粉絲真多


  這片的配角都是做工的人的班底

  有游安順、項婕如、薛40

  又找也是從中國返國的阮經天來當主角

  但這片好像也是票房不好，檔期寒冬


  這片看完覺得很像公視的單元劇

  只是攝影很有電影感而已

  但劇本實在感覺格局很小

  感覺看公視加減看還差不多


  完全不值得進戲院

  連二輪戲院都不值得進去看

  可能要再多拍幾部片才能抓到電影感

  不然還是感覺像電影的畫質

  卻像在看公視劇的品質


  這片在講東南亞女移工連環被殺案

  兩個女警一路查查到兇手

  冒著生命危險終於破案

  陳為民演兩個女警的偵查隊長

  陳為民演得也很爛，很少演電影

  可能因為他長得像柏林影帝廖凡

  所以歸國的張鈞甯也想捧他當影帝吧 ?

  看中國觀眾會不會把他認錯成廖凡 ?


  不過廖凡好像也消失很久了...


  閃光說傅孟伯很像變胖的修杰楷

  或許張鈞甯跟修杰楷演過痞子英雄

  找修杰楷演他已結婚不方便就找長的像

  又戲演的比修杰楷好的傅孟伯來客串他老公


  但願如果張鈞甯還有下部片的話

  能找個大導演來導才能把你拍得更美

  這片真的不太好看，拍得像公視人生劇展

  再加油，找對導演才能拍出好電影拿奧斯卡


  --'
