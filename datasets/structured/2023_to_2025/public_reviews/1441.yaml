url: https://www.ptt.cc/bbs/movie/M.1694347185.A.3E5.html
title: '[好無雷] 查無此心 少數沒有翻車的國片'
content: '會看這部完全是個意外

  朋友聚會少數服從多數選的

  雖然可能會被噴但我真的沒有很愛國片

  只能說很久沒看到劇情有亮點又沒爛尾的國片了！


  一開頭就是張鈞甯的演技大爆發，她真的把那種生無可戀的心境演得好好

  好幾度都被帶進那個角色的情感漩渦裡，跟著她一起難過

  這部沒有入圍金馬最佳女主真的很可惜

  然後阮經天真的很適合詮釋很有情緒起伏的角色

  演技很自然，跟張鈞甯的對手戲很反差很有火花

  唯一只有項婕如演技還是生硬了點，到她的part我會有點出戲


  劇情方面因為我本來就愛懸疑類型

  雖然現在很多懸疑片有點被玩爛了

  就是故意要讓觀眾猜不到，把八竿子打不到邊的角色拿來做兇手

  然後犯案動機跟芝麻一樣大

  不過查無此心我覺得算是有好好交代兇手背後的故事

  能夠在很短的時間裡感受到各個角色背後的故事被刻畫出來

  真的是只要把故事好好地說好，就能夠是一部好看的電影！

  而且劇情敘述很流暢，緊張懸疑的氣氛也有營造出

  該緊張的地方也有小小的捏一把冷汗


  總結以上我覺得算是一個很標準的懸疑片

  雖然略顯公式化，但也有很多意想不到的轉折

  整體而言還是推的！喜歡犯罪懸疑片的人可以考慮這部


  --'
