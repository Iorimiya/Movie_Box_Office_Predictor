title: '[請益] 查無此心疑問'
content: '昨天才到電影院看這部片，看完之後對於劇情有些小疑問，不知道是bug 還是我漏看了什麼，希望版友幫我解惑。以下有雷











  1. 電影末段范長福跟吳潔在燒過炭的密室中扭打，才打了一下子就快喘不過氣了，但Saipin 從范長福離開到後面被吳潔押回來，這麼長的時間都被關在裡面，是有可能還活著的嗎？


  2. 范長福跟吳潔在車上互相揭開對方過去那段，范長福最後說了一句”你以為我是那種忘不掉過去的人嗎”，讓人感覺他除了被女外勞背叛過以外還另有隱情，但後面似乎就沒再繼續交代范長福的過去了，是我漏看了什麼嗎？

  -----

  Sent from JPTT on my iPhone


  --

  不然是因為什麼？

  之前看到有人說這部比罪後真相好看，看完之後真的覺得沒有，整部的壓抑氛圍跟張鈞甯的演技是不錯，但劇情略顯單薄然後架構也不嚴謹，看完真有點小失望

  這部分前面驗屍的時候有交代吧？就是兇手想滿足那個愛情靜脈的傳說啊'
