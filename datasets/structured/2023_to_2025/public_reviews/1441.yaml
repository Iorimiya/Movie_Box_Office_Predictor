url: https://www.ptt.cc/bbs/movie/M.1695020618.A.851.html
title: '[ 好雷] 查無此心 阮經天表情真的很有戲XD'
content: "本來是衝著阮經天跟張鈞甯久違的對手戲而看的\n但看完後意外比想像中更好看，甚至還陪沒看過的朋友二刷\n懸疑包裝下的情感鋪陳與氣氛營造我也是給高分評價\n\
  \n裡面阮經天的演技是我最喜歡的！\n從前面的小痞子 吊兒郎當、到發現失去愛人 傷心欲絕的模樣\n演技最有發揮空間，小天也都駕馭的很好\n一刷主要在看劇情沒有特別注意，二刷才發現他的表情很多欸XD\n\
  \n以下只有找到部分預告&劇照有的畫面\n但此外真的是可以蒐集成表情包欸\n\n\n(劇照與文字小雷，請小心服用)\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n這邊是在警局審訊時，想證明自己是清白\
  \ 奮力的模樣\n那個青筋都爆出來了…\n\n\n這一幕的場景搭配阮講泰文，單純是我覺得有種傑哥不要的fu XD\n\n\n當對方拿著槍打算自盡，相較項婕如充滿憂心眼神，我覺得小天這邊的表現更符合一般人\n\
  ，極力的勸說對方放下槍，搭配他角色的個性展現出緊張感\n\n\n\n看到兇手的收藏品時，震驚到說不出話的模樣…\n\n\n\n\n崩潰癱軟在地上，接著發現女友永不在人世後\n\
  完全是聲嘶力竭 用全身力氣在哭\n完完全全可以感受到當下的崩潰與絕望\n這段真的可以感受到小天的實力，整個情緒銜接的非常流暢自然\n\n\n最後也說說我對這部的心得\n\
  以一部犯罪推理片來說兇手埋的算深\n過程中不斷推敲思索，緊張、刺激、甚至略為噁心的成分也有\n情感上的表達也很豐沛\n可以感同身受的跟著演員一起陷入名為心碎的泥沼之中\n\
  \n查無此心不單單只是一部犯罪片\n更有許多深刻的情感內涵\n但如果單純想看爽片的這部應該不適合你\n\n--\n 對 只可惜最後該秀演技的地方太短了 不然真的蠻厲害\
  \ 看到有點起雞皮疙瘩\n 表情真的有夠足！\n 但許的角色設定，我覺得表現很不錯了！\n\n 很有感情na\n 沒必要講成這樣吧 g大是阮黑粉?!\n 沒有在業\
  \ 單純是覺得阮的演技跟表情蠻有戲的 希望可以大家一起討論XD\n 若要講角色深度應該是兇手跟鈞甯比較多可以講 不過單純演技來說覺得阮還不錯(個人\n覺得啦\n\
  我也覺得很不錯欸 還是大家不滿意角色設定？\n我覺得如果是我 我可能哭的更誇張哈哈哈\n\n 我覺得女主部分算劇情感情鋪陳很重要的環節欸！\n 沒錯 我覺得如果是自己親人或男友\
  \ 一定哭更慘\n吳慷仁也是實力派啊\n 哈哈哈菜尾！\n 有人喜歡有人不喜歡嘛～\n 根本可以做成表情包\n 這部發揮很不錯啊！\n 沒錯沒錯"
