url: https://www.ptt.cc/bbs/movie/M.1694169536.A.5D0.html
title: '[好無雷] 查無此心'
content: '現在越來越多電影會採用交錯敘事手法來製造懸疑的氛圍，一部分能刺激觀眾思考，另一

  部分能呈現意想不到的驚喜感


  記憶拼圖、控制，都是我覺得使用這種手法不錯的電影


  開頭的緊張、女主的狀態、突發的狀況…等，一步步引導觀眾情緒，恰如其分的回應心中

  疑惑，甚至一些片段都不禁讓我跟著緊張起來


  故事題材雖然是常見的犯罪題材，但可以從中看到屬於台灣的素材，像外勞文化、公家機

  關處事方式與台灣人懂的笑點，故事劇情流暢、緊湊，收尾也算不錯沒有草草了事


  至於主演們的表現，亮點應該是阮經天，除了特地學泰文外，很多情緒都有展現出渲染力

  ，在情感的發揮上也很精采，透過屏幕也能夠感受到，真不愧是台灣金馬獎影帝，實力派

  演員問之無愧


  而張鈞甯在戲中警官的樣子，還有打鬥畫面都有感受到女性堅忍不拔的樣貌，所以當不時

  出現沒靈魂般無軀殼的樣子時，這對比也更讓人心疼，但我也很能體會這種感覺，因為我

  也是這樣走過來的，只是想解脫的方式不同罷了


  整體而言非常推薦大家去看看，支持台灣獨樹一格的懸疑犯罪佳作


  --'
