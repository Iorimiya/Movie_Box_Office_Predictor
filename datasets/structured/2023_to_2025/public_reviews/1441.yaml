url: https://www.ptt.cc/bbs/movie/M.1694653427.A.850.html
title: 'Re: [討論] 查無此心計程車問題'
content: '其實我覺得這設定很具巧思

  40演的計程車司機黃東祺，不是一般的計程車司機

  除了載一般客人外，還會專門載逃逸移工

  逃逸移工沒事不會隨便搭一般計程車

  不然可能搭著搭著就被送到警局了


  所以劇情內沒明說，但40跟林祐生還有照相館

  會在逃逸移工圈子小有名氣

  知道要叫計程車要找這號碼，要幫忙要找阿生之類

  所以偽裝成他的計程車，逃逸移工看到會信任就上車了

  這也是為啥犯人能一直犯案的原因

  偽裝別人的車就沒這效果

  然後因為是朋友，他很清楚40車長怎樣

  也知道40作息，偽裝他車最不容易被發現


  然後因為做假證件，他也會知道逃逸移工資料

  劇情沒說做幾次案，但很明顯水流屍不是第一起

  為啥能屢次犯案，就是整個設定讓犯案過程合理起來

  變得容易許多


  --'
