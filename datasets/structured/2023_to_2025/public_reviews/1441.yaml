title: '[討論] 查無此心計程車問題'
content: '衝著我的女神張鈞甯跑去看這部

  整體來說是推薦的

  不是因為有張鈞甯我就推，她之前演的一些片我也是看不太懂

  不過這部的劇情流暢性、緊張刺激、懸疑的地方都處理得不錯


  加上現在有蠻多的犯罪懸疑片大概看到一半就可以猜到兇手是誰

  但這次我是完全沒有猜到，反而還有點意外

  嫌疑人大概腦中跑過兩三個吧，劇情反轉再反轉

  最後的兇手也不會覺得牽強

  有充分的解釋道為何會有這樣的殺機與犯罪手法

  並沒有虎頭蛇尾就草草了事

  不過看完有先小地方想跟大家討論一下

  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~







  劇情巧妙地安排了共用車牌號碼使大家混淆

  我還是第一次知道計程車可以共用車牌

  但查過好像是需要親屬關係才可以共開

  但劇中的情況是兩輛不同車確是一樣的車牌，這個是有可能的嗎？

  還是根本是假冒計程車?

  還請大家解惑一下


  --'
