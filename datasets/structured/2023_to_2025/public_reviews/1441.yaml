url: https://www.ptt.cc/bbs/movie/M.1694268127.A.14F.html
title: '[好雷] 查無此心 '
content: '雷文防雷資訊頁


  繼上部懸疑國片 緝魂，時隔多年又看到一部水準之上的懸疑片


  這部的演員大部分都是戲精，好多段的對戲 看得當下覺得很過癮


  然後有些網友說兇手出現之後，劇情急轉直下


  我反而覺得後面兇手跟主角們的戲是整部的高潮


  飾演兇手的演員我認為氣場有蓋過主角們


  而且把那個角色的個性詮釋得淋漓盡致 有夠邪有夠狂





  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



  劇情的部分就不多加贅述 總之就是外勞移工心臟被挖走


  女警副隊長張均甯要去調查是怎麼回事


  牽扯到的關係人有非法仲介 阮經天、死者的妹妹



  說一下這部幾段劇情的亮點



  解剖室的那段劇情拍得很寫實，有美劇的風格


  宋少卿演的法醫很老練，翻女屍的動作駕輕就熟



  後面兇手出現，是飾演照相館老闆的游安順


  一開始真的以為他是串場路人，後面被發現是兇手真的有震驚到


  後面他跟張均甯的對話 蠻多攻心的對談 一來一往，氣勢不在下風


  裡面有一句對話讓我印象深刻


  張問他殺人就殺人，為什麼搞得怎麼有計畫，一個串一個


  游回她說他想看他要殺到幾個逃逸外勞，才會有人在乎這件事


  這個動機我覺得寫的蠻好的，也帶出了長期外勞不受重視的議題



  總之很推薦大家去看，好久沒看到這麼過癮的國片了


  --'
