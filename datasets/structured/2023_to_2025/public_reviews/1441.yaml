url: https://www.ptt.cc/bbs/movie/M.1694188870.A.569.html
title: '[好無雷]查無此心 有趣的觀影體驗 '
content: '看完查無此心有種感覺，裡面的演員換成西方人也成立的感覺，並不是在說

  這部片跟台灣沒有關係，岔開來說韓國影視的成功並不是他們走出自己的路

  ，而是奠基在對於好萊塢的學習，這部電影的出現代表我們已經有能力拍出

  自己的類型片，當然他不是沒有缺點，但是那些缺點就跟你看完一部好萊塢

  類型片會有的感受差不多，而其它比方很棒的音樂，攝影，沒什麼冷場的剪

  輯，讓這個觀影經驗十分不錯，也會期待下一次同一個團隊的新作品。


  故事從開頭想要自殺的女警意外發現一具外勞女屍開始帶出的事件。讓我想

  到致命武器第一集，裡面的一些背景故事或許沒有解釋太多，但是其實都是

  我們曾經在新聞上看過，或是可以理解的原因，我感覺沒有什麼影響觀看過

  程。這應該算是一部本格派的電影，兇手出現的時候我才發現線索其實真的

  非常非常簡單，也訝異團隊竟然敢放這麼簡單的線索，但是還是有像我這麼

  笨的人沒猜出來，所以當下有被娛樂到的感覺。


  其實最感動的還是片中的飾演外勞的演員們，提起早期外勞的電影或許會想

  起台北星期天或是其它的電影，但我想多年以後或許大家會記得這是台灣第

  一部講述外勞故事的商業片，只有當一件事進入商業領域，代表我們真的看

  重這件事，阮經天講著流利的泰文也是我覺得是他在片中最帥的時候。


  這部電影不只是一部娛樂電影，他還看見了我們每天看到的東西，透過這部

  電影我看見了每天在電車上看到的那些外籍勞工更深層的故事，但這並不是

  一部說教電影，裡面也沒有任何說教的部分，有的只是每一個想要奮力生活

  的人。大體上這是一部兼具藝術性、娛樂性與社會性的電影。


  推薦一看～






  --'
