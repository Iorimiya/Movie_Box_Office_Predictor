url: https://www.ptt.cc/bbs/movie/M.1694267676.A.AD7.html
title: '[普雷]查無此心 人類心理學人性仇恨'
content: '算是二次剪片上映電影

  防雷













  查無此心記得去年就有注意到

  似乎影院還是低迷期

  也無法橫掃獎項


  恢復主題


  片頭希望可以引用

  古羅馬人相信人體內有一條

  「愛情之脈Vena amoris」（vein of Love）

  由無名指的靜脈一路通往心臟

  古埃及人在訂婚或結婚時

  就會將戒指戴在左手無名指上


  先來說說兇手心境，影片後半段有點拉長時間

  稍微冗長，相信也想交代人生受到刺激的轉變

  因片段沒有打算詳細說明，不知道是被騙婚轉

  而逃逸外勞只為了有合法工作證件，所以想復

  仇所有逃逸外勞。還是曾經拯救逃逸外勞變成

  合法妻子，結果還是從遭受背叛，轉而想讓所

  有逃逸外勞成為心靈空洞的妻子。


  不過接近片尾感覺兇手保留所有照片及心臟和左手指，表現的意思是不在乎天長地久只需曾

  經擁有？！

  還是只是讓世人知道這些人曾經是勝利品。

  不過這一些照片覺得真的很像藝術家無法理解

  的層面，冰塊冰凍心臟及左手指和生日那天進

  行且拍照燭光晚餐畫面留影。


  不過有一畫面無法看清楚就是福馬林玻璃罐上

  貼的是什麼詩還是哪個故事？！


  再來述說女主角背負因工作繁忙卻發現丈夫憂

  鬱症自殺。逃不過人生自我內疚自責想一同殉

  情，片頭採用閃回剪輯方式以為要看藝術片。


  對於以警官角度某些細節似乎越來越覺得不合

  理，自己帶嫌犯去救囚犯？因為還在休假無法

  告知隊長跟隊員？正常還有兩人一組出勤，還

  是也要營造跟（九槍）一樣警力不足都只能一

  人完成不可能任務？！


  另外男主角非法仲介協助逃逸移工，對於真實

  面似乎是台灣未來面對事件，面對案件肯定會

  保護好所有非法移工保密一切，不過覺得演的

  有點力道過猛，包含在警局狠打黃鐙輝想殺兇

  手時刻，不過佩服的事學了不少東南亞語言。


  站在這些逃逸移工的角度，是不是台灣低薪及

  剝削造成這麼多移工逃逸？！還是人生太不自

  由為了工作賺錢只能接受不合理待遇？！



  --'
