url: https://www.ptt.cc/bbs/movie/M.1694541319.A.309.html
title: '[好雷] 查無此心  瑕不掩瑜的好國片 '
content: '[你知道甚麼人殺人最兇殘? 是感情受到傷害的人!]


  這是一部好國片，對於刑偵推理驚悚片來說絕對有水準之上！


  但這句貫穿整片的台詞（精髓）卻恰恰凸顯了本片傾斜失焦的缺點．．．．






  以下會提到劇情雷，請慎慎決定是否繼續閱讀！





  雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  首先得稱讚編導在女主心境上的轉變暗藏了不少心思，讓一個生無可戀的人重新找到

  活下去的意義!


  從一開始刑警丈夫開槍自殺的畫面，只有側面拿搶抵下巴的局部特寫，到中段開始認

  真追緝連續殺人犯時，丈夫自殺的畫面變成了正面全臉，再到後段與凶手現身之後的

  搏鬥之時，丈夫出現的畫面已經是充滿美好回憶的部分了，可以看的出來導演確實利

  用畫面無聲無息的交代了女主的心境轉變，這一點我給加分！


  但接下來我要開始扣分了！



  傻眼的［主角威能］或是［神力女超人］的傻眼情節：孤身一人押著兇手前往未知場

  所之外，整個警察的形象或是能力在這部片裡，連跑龍套的重要性都不到，實在很難

  想像這是2023年的警匪片，除了邏輯死亡之外，我不覺得非要這樣才能讓劇情前進，

  反倒很符合蠻多網友的看法：兇手現身之後整片智商下線．．．．．


  甚至說那一盆炭火是如何搞到一氧化碳中毒昏厥，我們就不用再深究了，不然小菜鳥

  插心窩那一刀就更讓人瞠目結舌了！



  然而，整部片我覺得最無法接受的，就是那一句貫穿全片也是電影宣傳的重點：［

  你知道甚麼人殺人最兇殘? 是感情受到傷害的人!］


  這是一部刑偵驚悚推理片，不是愛情片耶，全片編導著墨最多的愛情受傷部分卻是女

  主這個女警？


  兇手到底是受了多大的傷？需要一直連續殺人？片中只交代了捲款潛逃，有這麼深仇

  大恨嗎？你為什麼不多花一點篇幅描述鋪陳細節？


  更不用說放血/斷指/挖心這種"可能"需要一點專業醫學背景的知識能力，你一個照相

  館老闆這麼厲害？


  前面三十分鐘把兇手描述的多恐怖多厲害，後面三十分鐘就會讓觀眾自己覺得這部片

  的兇手有多弱智多低能，這完全是一個不對等的傾斜失衡，反倒有讓人覺得落入同類

  片的窠臼：隨便塞一個看起來讓你很意外的人當兇手．．．



  再說回感情受傷害這一部分，女主角一個人幾乎佔用了全片五分之一的時間呈現她所

  受到的傷害，但男主角阮經天的受傷程度卻只看到後段的結果，看不到前段的原因和

  過程，就會讓他的發狂或是歇斯底里變得很虛幻，觀眾的感覺一樣會覺得啊有這麼嚴

  重嗎？


  你知道甚麼人殺人最兇殘? 是感情受到傷害的人!


  但真正殺人的凶手有多受傷？被兇手殺害的配害者男友有多受傷？電影所呈現的好像

  他們的傷只需要一兩句話和幾顆鏡頭就夠了，但女主角那跟本案無關的傷卻要不停的

  反覆的呈現？


  還是我真的誤會了？這是一部愛情片不是刑偵驚悚片？




  這部片真的算得上是一部好的國片，但要說甚麼本年度天花板或是跟之前緝魂甚至更

  早的目擊者相比較，差距真的很明顯，這一點是事實騙不了人！


  甚至說關心移工的部分，我個人甚至認為比不上八尺門來的深刻．．．．．


  --'
