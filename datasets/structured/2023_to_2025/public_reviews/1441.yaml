  防雷


  防雷


  防雷


  防雷


  防雷


  為什麼警察及男主角去找阿曼時他要自殺 他不是兇手

  而且他很好心的讓女朋友

  名義上的回家


  就算是逃跑移工 也不用做這麼絕

  還是他是兇手的幫兇 所以才知道遺體在哪？


  還是我哪邊漏看 請各位大大解答


  -----

  Sent from JPTT on my Asus ASUS_X01BDA.


  --

  我是臭直男 不懂偽科學


  --'
