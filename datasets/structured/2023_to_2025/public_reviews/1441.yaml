title: 'Re: [負雷] 查無此心'
content: '串流平台看的，我的結論是負評。


  先說優點：

  男主演技很強 還學講泰文

  女主跟主管嗆聲那段 演技好強 但不知為何 女主的中文我會出戲(家人說不覺得出戲)

  菜鳥女配看起來好年輕 台劇有新人了?


  缺點：

  菜尾有電話叫支援 電話那頭對方也有討價還價 但片子演完 都沒看到警力


  兇手是拍照的 為何有開胸的技術知識 看yt自學?


  中間帶到某阿嬤怪怪的表情 配上沒有畫面的電視 是指?


  女主最後自幹那段就不提了 前文就有指出來了。





  --'
