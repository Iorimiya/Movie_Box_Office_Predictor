url: https://www.ptt.cc/bbs/movie/M.1694085854.A.9D9.html
title: '[無雷] 《查無此心》電影好看但有個致命的低級'
content: '新聞主播 賴正鎧/錯別字


  我直接說出感想，我覺得「非常好看」。


  電影《查無此心》講述刑警-吳潔(張鈞甯飾演)，調查一起挖心割指的水流屍命案，進而

  鎖定負責非法移工的仲介-林佑生(阮經天飾演)，卻沒想到循線拉出疑點的同時，也把自

  己捲入死神的刀口。


  懸疑驚悚片的好看，在於觀眾是「安全的刺激」下跟著警方一起找兇手，而《查無此心》

  的節奏好到讓觀眾都跟得上電影腳步，過癮的享受1小時45分鐘逮到兇手的快感，而兇手

  病態的殺人行為，也有合理且同情。


  我很討厭一種懸疑驚悚片。


  一開始以變態的死法吸引觀眾進場，最後兇手僅僅是因為神經病或宗教狂熱份子，就把動

  機通通推給聖經或教義，而《查無此心》並不是這樣，甚至一開始就遞給觀眾一句話


  「什麼人殺人最兇殘？是感情受傷害的人！」它是解開貫穿電影疑點的鑰匙。


  雖說又挖心臟又割手指頭的，但《查無此心》並沒有《奪魂鋸》或《絕命終結站》這麼灑

  番茄醬，恐懼噁心的調味拿捏的很剛好，多一秒鐘太噁，少一秒鐘太淡。


  如果你很喜歡《踏血尋梅》這部港片，我覺得《查無此心》你會喜歡，但如果你兩部都沒

  看過，先查無此心再踏血尋梅，這叫循序漸進。


  《查無此心》在2023年9月8號上映後，好評將會佔據你的臉書與IG版面，並不是人家請看

  電影我才寫得這麼好聽，上一部試映會我看完後的分享文，寫的就不好聽(因為真的是爛

  片)，而上一次好看到讓我激動分享的電影，是《咒》。



  至於一開始我說，電影犯了什麼低級的錯誤？



  當晚電影開始前，演員們出場跟觀眾打招呼，並一人一句話送給觀眾，其中一位演員就說


  「以後在路上看到我，別打我。」我他媽的就猜出你是兇手！


  所以當他說完，我瞬間啞口無言到影廳黑掉才回神，之後還安慰自己或許是因為，他的角

  色討人厭並不是兇手，結果電影開演後我一看到他的一個動作跟算一下出場時間，我可以

  下一萬塊壓這個人就是兇手，是一萬美金。


  所以他開場前的這一句話，完全毀掉了我猜兇手是誰的樂趣，只剩等待電影解釋他為何行

  兇的動機。


  我非常討厭爆雷，僅次於小拇指踢到桌腳，而這位演員也不是第一次拍片啊，我不敢相信

  他會說這句話，也許現場的觀眾沒我神經質，但一定有不少影癡會因為他這句話猜到結果

  。


  查無此點，我不開心。






  --'
