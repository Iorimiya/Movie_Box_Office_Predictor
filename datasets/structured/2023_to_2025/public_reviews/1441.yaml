title: '[討論] 查無此心'
content: '避免還沒看的網友被雷，先弄個防雷


























  後來想想也沒必要防雷，整部戲讓人吐糟的點有夠多，不如省下兩小時去做有意義的事情

  。



  該吐槽點點前面已經有網友發過了，在此不再贅「吐」，我只想討論一個問題


  整部片以一姊的未婚夫憂鬱症自殺開始，最後又以憂鬱症自殺告訴一姊要勇敢活下去收尾

  ，有人知道這種編排的邏輯在哪嗎？



  你既然要提醒主角勇敢活下去，那就不要以憂鬱症自殺來當作引子啊！我一開始還一直疑

  惑未婚夫自殺和外勞連續謀殺案的關聯在哪，結果似乎無關？即使把這部分拔除，也完全

  不影響劇情發展吧？


  結果到最後劇情跟我說原來未婚夫自殺只是拿來當鼓勵主角活下去的力量，看了超想吐槽


  糞作！

  不是演員爛，是劇本。


  --'
