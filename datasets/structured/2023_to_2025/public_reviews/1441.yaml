url: https://www.ptt.cc/bbs/movie/M.1694686987.A.2D9.html
title: '[好雷] 查無此心:什麼人殺人最兇殘?是感情受傷'
content: '什麼人殺人最兇殘? 是感情受傷害的人

  電影海報上的標語直接點出

  原本猜測只是情殺劇情

  其實也沒猜錯

  不過後面發展有點意外…


  ----------------------以下帶有主觀雷-----------------------


  人的情感有很多面向

  我喜歡劇中每個人對情傷的詮釋

  更覺得比起懸疑犯罪

  這部想傳達的更是面對一段失去的感情，

  大家所做的選擇



  女警吳潔

  一開始雙眼空洞無神帶有紅腫 面如死灰

  希望調離現職，選擇睡在一輛漏水的車上

  走不出喪夫之痛，對生命絕望的樣貌

  張鈞甯完美的演出了失去摯愛的樣貌

  還為此瘦了七公斤，

  完全看的出戲中憔悴無力的感覺

  活著 只是為了呼吸罷了



  移工仲介阿生

  一開始讓人捉摸不清是代表正還邪

  但當發現女友的死訊後，

  堅忍外表下也是一顆柔軟的心

  偵訊室的歇斯底里、看到兇手的暴走

  哭是人常見的情感表現

  但我真的很佩服阮的演技可以做到瞬間崩潰

  粗暴直接的情感



  兇手

  這邊就先不提兇手到底是誰

  但沒有人是天生的壞人

  看著被翻箱倒櫃的家、短短幾幕回憶

  不用台詞 與太多戲份的鋪陳

  僅僅細微的面部表情變化

  由愛生恨的過程往往就在一瞬間


  查無此心 這片名取得真好

  到底是被挖空(生理)的心可怕

  還是被掏空(心理)的心可怕呢

  用英文片名The Abandoned(被遺棄)來看 好像就清楚多了

  人的內心，住著一個天使，也住著一個魔鬼

  當事情的發展不如自己預想的結果那樣

  我們可能會失控

  甚至做出出乎自己意料的事


  一個不斷殘忍殺害他人

  一個曾經試圖自殺結束自己


  挖心斷指就像是兇手對愛人無聲的抗議

  挖心 代表著(兇手)自己的心也被掏空了

  斷指 代表著曾經該為我套上婚戒的位置

  被遺棄的心能不能找回來呢?


  很喜歡後面劇情的轉折

  吳潔被困在地下室的橋段

  不斷敲打玻璃 不斷湧現的回憶

  對比前面的生無可戀

  那是一個想活下去的人

  表現出的強烈情感

  報廢場輕撫車子的訣別

  與前面被困在車上形成呼應



  感情受傷之人，也可以等到撥雲見日的那天



  --'
