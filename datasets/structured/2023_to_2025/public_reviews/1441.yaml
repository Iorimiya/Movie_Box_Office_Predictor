url: https://www.ptt.cc/bbs/movie/M.1694519073.A.084.html
title: '[微好雷] 查無此心'
content: '先防雷


  跟前陣子看的罪後真相

  我覺得都算是近期不錯的犯罪懸疑國片

  雖然整體看起來還是有點瑕疵

  但是國片不要一直拍黑道就先給推








  以下有雷














  整體劇情算是很緊湊 蠻多線索都要前後呼應到

  最後公布真相的時候理由也不會很豪洨

  只是兇手現身的時候第一時間想說這是誰

  兇手的變態程度我覺得拍攝的很好

  真的有感覺到他的魔化及癲狂

  不過在跟被綁住的泰國妹說話的時候

  感覺如果提到當初拍照說的話會更有感覺


  本片我覺得最大的瑕疵就是警察的辦案手法太鬧了

  從兩個女警只帶一把槍啥都沒有在阮經天家外埋伏跟車，結果最後被外勞成功奪槍自殺

  到後來找到兇手支援還沒來就直接衝然後也是只有一把槍，結果菜鳥女警差點領便當

  這兩段我一直在想是不是可以用個辣椒噴霧？

  而且菜鳥女警差點領便當感覺也跟劇情推進沒有關係，只是單純幫手-1

  最後要去救泰國妹前阮經天失控女主角先一槍打癱阮經天（幫手再-1）

  最後單獨跟兇手去找泰國妹，手銬也隨便讓兇手銬前面方便活動

  看到這邊，我想說：哇耖 這是要自殺嗎

  後來想想片頭的女主角車內自殺未遂

  跟驗屍官說的有情傷的人手法特別狠

  嗯……好吧 前後呼應 ！



  感覺的出導演想要藉由比較商業片的方式探討台灣社會中移工問題的用心，舉凡逃逸外勞，非法外勞，外籍新娘所造成的影響

  剛好之前也有一部探討警察執法過當殺死外勞的紀錄電影：九槍，如果對外勞議題跟政府因應的規定還有一線執法者的執法作為有興趣，兩片都可以看


  總結來說真的是部不錯看的片

  但是阿肥我平日去電影院只有三個人 QQ

  -----

  Sent from JPTT on my iPhone


  --

  你不會就跟我同場吧..

  但看完會覺得這個片名取的蠻好的'
