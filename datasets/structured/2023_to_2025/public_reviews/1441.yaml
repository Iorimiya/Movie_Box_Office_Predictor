url: https://www.ptt.cc/bbs/movie/M.1695364850.A.C8E.html
title: '[討論] 愛嘴國片都是鬼甲九的人為何不支持查無此心?'
content: '《查無此心》不是鬼片

  沒有同志元素

  沒有歌頌8+9

  也不是國片偶有賣座的青春愛情題材


  老愛嘴國片題材狹隘

  都在拍加九片、甲片、鬼片的人

  現在有一部跟上述題材完全不相關的電影

  類型也是犯罪驚悚片

  這是典型的商業題材

  電影在執行層面上也不錯

  至少目前看到的評價是正>負


  這樣的一部片

  上映兩周到昨日為止票房也才破1200萬


  你們這些不看加九片、甲片、鬼片的人為何不捧場一下《查無此心》

  好讓這部片票房大賣???

  你們不捧場

  以後拍電影的人或投資者就有可能對同題材電影卻步

  繼續拍加九片、甲片、鬼片

  然後以後你們又繼續在加九片、甲片、鬼片相關的新聞下推文

  "國片真爛，只會拍加九片、甲片、鬼片"

  這不就陷入死循環了嗎?


  以後我如果在推文又看到你們這些人在靠北國片只會拍鬼甲九

  是不是可以先問問你們有沒有支持查無此心???


  --

  直接像ccr一樣說我就是愛外國片也不是不行

  那為何總是要把鬼甲九當藉口呢?

  回答你

  我本人沒看查無此心

  因為裡面有我討厭的演員

  不過我本人有沒有看電影對這篇文會有何影響嗎?

  所以你覺得我的目的是什麼??

  整天只會嘴國片只會拍鬼甲九的人不就更無聊

  版上討論的文章數還算可以

  但是下面這篇推文裡就有人扣業配帽子



  所以有宣傳-想騙人進電影院

  社群有討論度-是葉配

  怎麼樣都有得嘴'
