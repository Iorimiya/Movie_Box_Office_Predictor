title: '[新聞] 阮經天睽違8年再演國片落魄上陣《查無此心'
content: "阮經天睽違8年再演國片 落魄上陣「雨天挖屍」臭又髒\n  Yahoo奇摩新聞（記者 潘鈺楨）\n\n，這次為了力挺好友張鈞甯，扮演落魄仲介，蓄鬍捲髮頹廢上陣，苦學泰\n\
  文展現「中台泰」三聲道功力。一場「雨天挖屍戲」，張鈞甯、阮經天兩人淋成落湯雞，\n又髒又臭讓張鈞甯笑認：「像難兄難弟！」\n\n阮經天在《查無此心》飾演一名不修邊幅的移工仲介「阿生」，全片素顏上陣，滿臉落腮\n\
  鬍搭配一頭捲髮，天生自然捲的他，戲稱自己髮型：「簡直跟我剛起床一樣！」蓄鬍設定\n源自導演曾英庭的想法，監製張鈞甯誇他可愛，「從沒看過小天這樣，但會一直覺得他很\n\
  熱，也像某種小寵物，忍不住會想搔搔他」。小天本人則表示：「從沒演過這麼倒霉的人\n，這樣的角色真的是第一次」。\n\n除造型上突破，因劇情設定，阮經天大秀中台泰語三聲道，與泰國女星莎吉·阿皮旺有不\n\
  少充滿情緒起伏的對手戲，為此他花兩個月上語言課，勤背泰文台詞，自認記憶力好的小\n天都坦言泰文真的難，一個語氣錯誤，嚴肅的台詞立刻變活潑，讓對方笑場，小天解釋：\n\
  「泰文跟其他語言不一樣，完全是兩碼子事，尤其最難的是聽。它發聲位置很多是我們平\n常不會用到的，要反覆練習。」拍攝期間小天每次拍攝完走到監視器旁，第一時間不是看\n\
  導演，而是看翻譯，獲得肯定後才鬆口氣。不僅語言課，開拍前阮經天還看了七、八本以\n移工在台灣為題的書、親自與身邊外傭朋友聊天、撰寫角色自傳等準備，用心程度讓人佩\n\
  服。\n\n《查無此心》是表示看完劇本後，不知為何腦海閃過好友阮經天，於是以一通電話促成\n合作，阮經天笑說：「我一下就答應了，因爲是鈞甯！」片中他們一個扮演憔悴女警，一\n\
  個詮釋落魄仲介，片中兩人有場在滂沱大雨的泥濘中挖屍體的戲，劇組為此出動專業造雨\n團隊，小天儘管身著輕便雨衣仍渾身濕透，雙腳沾滿泥濘，張鈞甯回憶說：「我們變得又\n\
  髒又濕又臭，有種『難兄難弟』的感覺。」十多年後再合體，幕前幕後盡展好交情，阮經\n天大讚她：「張鈞甯的認真程度，經過十幾年，還是一樣的！」張鈞甯則說：「我覺得小\n\
  天變得更成熟穩重，一樣很真誠，超級開心是他來演！」\n\n《查無此心》故事描述總是無法在家中睡覺的女警吳潔（張鈞甯 飾）只能窩在自己一台\n車頂有洞的破車中休息。她計劃調離現場辦案的工作，想換個環境生活，但跨年夜出現了\n\
  無名女屍的殘忍命案，在長官（陳為民 飾）要求下，她必需和菜鳥女警（項婕如 飾）合\n作查案，她逐漸發現女屍似乎和一個非法移工仲介（阮經天 飾）有關聯，但他們越接近\n\
  真相，也陷入越大的危機之中。電影9月8日在台上映。\n\n\n\n\n\n\n\n--"
