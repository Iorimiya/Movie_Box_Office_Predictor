url: https://www.ptt.cc/bbs/movie/M.1695042537.A.FE0.html
title: '[好雷] 查無此心'
content: '《查無此心》的各種宣傳素材，都透露著台灣類型片難得的高質感。


  .

  比如海報，兩位主角表情扭曲而充滿故事，套上靛藍濾鏡，成功傳遞懸疑氛圍；比如劇照

  ，一幀張鈞甯在冬夜高舉探照燈的畫面，頓時營造出充滿電影感的構圖；比如預告，倒數

  音效搭配無名屍的發現，開展連環殺人命案調查，讓人坐立難安。


  .

  看過《查無此心》後，證明不只素材包裝得漂亮。精緻構圖的影像和壓抑的敘事節奏，很

  有效率地將觀眾拉進故事，保持緊繃卻享受的觀影體驗；加上主角演出讓人眼睛一亮、配

  角群也自然整齊。在商業電影的外殼底下，保有文藝片的氣質，並做到不突兀的兼容與切

  換。整體而言，的確是台灣類型電影的佳作。


  /


  深陷創傷的女警吳潔（張鈞甯 飾）養成在車上睡覺的奇怪習慣。之所以在這度過漫漫長

  夜，是因為這輛車乘載了她和丈夫的美好回憶、但也留下丈夫自轟身亡的彈孔。某個跨年

  夜，準備做傻事的她卻被車窗外的尖叫聲打斷，本著刑警的直覺她下車探勘，竟發現水溝

  出現水流女屍。「屍體會選人辦案，而祂選了我」，吳潔和菜鳥深入調查，發現這具無名

  屍指向移工仲介林佑生（阮經天 飾）；與此同時，也出現第二個被害者...


  .

  身兼監製的張鈞甯繼《緝魂》再次飾演女警，演出更有突破，深陷 PTSD 卻拒絕走出的人

  設在國片本就稀少，張鈞甯為戲爆瘦，生無可戀的眼神仍流露一絲堅毅；好久不見的阮經

  天則在油條頹廢與爆裂衝動之間，為角色找到最適合的狀態，同時展現苦練語言的成果，

  有幾場戲明顯是讓他發揮演技、他也把握住了（尤其看見受害者的崩潰痛哭，沒能入圍金

  馬真的是遺珠），可惜細究之下，對劇情而言有點多餘。


  .

  這幾年看國片和台劇，明顯感覺演員重複性極高：本片就有游安順、薛仕凌和項婕如三位

  《做工的人》，所幸這些演員每次都能繳出鮮明稱職的表現。必須再告白薛仕凌，無論戲

  份多寡都能將角色內化，本片飾演阮經天同夥，幾句調戲女移工的台詞夾雜泰文，輕浮又

  道地，讓人印象深刻；陳為民、黃鐙輝也展現冷面笑匠特質，為暗潮洶湧的氛圍提供不少

  笑點。


  .

  另外，傅孟柏應該是國片裡最適合念旁白的男子了吧。《返校》的他說「只要還活著，就

  會有希望吧」，本片也有類似台詞，雖然戲分不多，但低沈嗓音一出就讓全片情感重量定

  錨。他在本片自我了結的方式與電視電影《最後的詩句》相似，對於曾英庭導演的影迷來

  說，也是會心一笑的小彩蛋。


  /


  《查無此心》是曾英庭執導的首部電影長片，調度、剪接與運鏡卻不見新手的生澀。前段

  氣氛營造極佳，窒息地抽絲剝繭讓人想起《殺人回憶》，冷冽基調穿插黑色幽默則有《私

  法爭鋒》的神采，對白場景又夠接地氣，甚至保有《最後的詩句》的遲滯絕望感。就成果

  來說，本片優於去年金馬獎的競爭者《罪後真相》，不過類型頂標仍是程偉豪《目擊者》

  。


  .

  這份落差，關鍵在於《查無此心》後段缺乏說服力。隨著主角等人接近真相，也踏入許多

  推理影劇的通病，翻轉都是劇情說了算，加上角色某些行為違背常理，可惜了嫌犯很有意

  思的犯案動機，連帶拉垮前段煞有其事的鋪陳；但整體來說瑕不掩瑜，已經足夠讓觀眾期

  待曾英庭的下一部電影長片。


  .

  值得一提的是，曾英庭曾以短片《椰仔》獲得金穗獎肯定，該片寫實呈現移工在台灣的困

  境，《查無此心》某種程度也延續這份社會關懷，佐以情殺和警匪要素，包裝成商業掛帥

  的貓捉老鼠。在這個新住民人數超越原住民的時代，和台劇《八尺門的辯護人》與紀錄片

  《九槍》交互欣賞，可以對照出僱傭制度的缺陷、以及輿論凝視弱勢的眼光。


  /


  《查無此心》在去年金馬影展首映，相隔近一年才正式上映，也因為金馬版（128 分鐘）

  與院線版（104 分鐘）在劇情完整度和情緒鋪陳的落差，在網路引發熱議。我只看過目前

  上映這個版本，完成度頗高，但如前述提到的美中不足。如果有機會，還是希望能看看金

  馬影展的版本，是否能圓滿院線觀影時的缺憾。



  更多影評推薦，歡迎追蹤帳號：



  --'
