url: https://www.ptt.cc/bbs/movie/M.1694570274.A.A56.html
title: '[無雷] 演技掉漆的查無此心'
content: '優點：


  整部片的氣氛非常棒，瀰漫著壓抑的氛圍，蠻享受的，國片能達到這一種高度不簡單


  道具組還有特效妝的團隊很厲害，近幾年國片這一塊的水準都很高


  雖然是偵辦案情的片子，不過卻是在講黑工與外勞的問題，題材還算新穎


  沒有像緝魂一樣刻意避開台語，自然多了，但是有刻意抹滅跟現實的連結，像是全片沒有出現國旗國徽警察的鴿子等，不知道有沒有中國出資


  兇手有夠變態有夠毛，精采


  缺點：


  項婕如演技堪稱災難，非常棒讀，讓人頻頻出戲，本片最大缺點


  張鈞甯演技飄忽不定，一下子很厲害，一下子非常不自然，感覺是高潮戲的部分導演有特別去雕，但是在一般的日常戲中就頻頻漏餡，二號戰犯


  其他就沒什麼好挑剔的，配角老演員像陳為民這種演得真好，泰國演員與阮經天也表現得不錯，整體還是很值得一看


  評分：7.8/10









  -----

  Sent from JPTT on my Google Pixel 6a.


  --'
