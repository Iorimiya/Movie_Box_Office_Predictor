url: https://www.ptt.cc/bbs/movie/M.1694402766.A.854.html
title: '[ 好雷] 查無此心'
content: '先防雷


  我覺得最近的國片檔期很奇怪

  像查無此心，如果要這時候上

  那應該衝今年金馬，去年沒剪好就報

  演員也沒入圍，啥鬼…




  以下有雷


  張鈞甯演的很好，看這狀態很難相信她41歲

  真驚人，很值得入圍金馬

  整部演員演技在線

  游安順也很棒，一開始計程車司機想說很眼熟

  後來看一看，這不是40嘛

  靠北這造型跟做工的人裡面蠻像的啊

  他演的也很好，要上廁所被從背後踹倒很好笑

  阮經天的衝動仔感覺相當適合他演

  看他大腿被開一槍，影廳好多人笑的很開心XD

  項就比較中規中矩，還行吧

  劇情上殺機跟理由，手法也合理，

  沒有因為要反轉而硬湊

  一些細節做的不錯，像罰單那邊

  本來以為只是要表示兩人交情不錯

  後面才發現這是線索


  笑點也很突然，沒有硬安排這樣

  一句我感覺很痛啦，就全場大笑

  但整部比較偏沈重，移工處境沒有刻意著墨

  但從每人反應可以知道逃跑移工的艱難處境

  被警察找到就要遣返，所以出事也不會找警察


  最近國片很多，這部我覺得相當值得去看！


  --'
