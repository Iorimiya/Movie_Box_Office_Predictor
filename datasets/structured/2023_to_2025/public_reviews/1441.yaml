url: https://www.ptt.cc/bbs/movie/M.1706914386.A.089.html
title: '[負雷] 查無此心'
content: '雷文防雷資訊頁





  卡司很強，但編劇邏輯整個壞死






  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~













  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




  1. 最瞎就是吳潔壓著兇手要去找泰國妹的整個過程，都有充足的時間可以叫支援


  結果卻單槍匹馬的行動，阿如果兇手的基地另有其人不就直接買一送一?



  2. 最後兇手要逃，看得出來他也沒悔意了(後續密碼也不願意說)，結果要逃之前是把


  昏倒的泰國妹推給女警，脖子都插一半了應該就讓他放血吧?


  這樣女警為了要按住傷口就不可能阻止他逃離了阿


  進密室前手被門夾到也超87，怕殺了他又怕他跑，當然是他開門時就瞄腳阿


  他一個大叔要把身體弄進去門裡+關門的時間會不夠你扣板機射他的腳嗎


  射阮就知道要射腳==





  3. 最後場景打鬥完吳潔要離開，差點一氧化碳中毒，有那麼多力氣在那邊敲玻璃，


  為何不先去把木炭踩熄讓他不要繼續製造一氧化碳





  4. 前半段2女警+阮經天試著制伏男泰勞這段也有夠瞎


  2個女警好歹有通過訓練的吧? 阮經天也不是啥書生，泰勞也沒學泰拳，也不是館長體型


  竟然3個人制伏不了還被搶了槍，這個我看大家都要一起自盡了吧




  已經看完超過24小時了，印象不深，只是馬上想都還是可以想到這些毫無邏輯的劇情


  不太曉得這部到底要看啥，邏輯壞死一直讓人出戲


  稍微把劇情編的符合常理一點有這麼難嗎? 這又不是科幻片



  還沒看的人把時間省下來吧...






  --

  一開始還覺得菜尾很可愛...最後真的無腦到不行XDD


  有槍不能開...阿後面打阮經天腳就很乾脆XD

  三個人不能制伏一個泰勞真的是蠻沒邏輯的...


  兇手登場的方式也有點爛尾...前面搞得那麼懸疑

  結果兇手這麼簡單就被找到~_~


  真的...單獨跟兇手逛街真的低能到不行XDD

  乾脆做成科幻片，兇手會施法催眠之類的 邏輯還比較不那麼壞死...


  是因為演員都是好咖吧XD...最近那麼多台劇，最爛就這片 沒有之一'
