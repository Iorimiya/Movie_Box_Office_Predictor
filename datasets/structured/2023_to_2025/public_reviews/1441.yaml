title: '[新聞] 查無此心票房破千萬 張鈞甯絕望眼技催淚'
content: "查無此心票房破千萬 張鈞甯絕望眼技催淚\n\n2023/09/20 05:30\n\n\n張鈞甯在《查無此心》有激烈打戲，絕望感打動觀眾。（華映娛樂提供）\n\
  \n〔記者鍾志均／台北報導〕台片《查無此心》8日上映，上映至今全台賣破1100萬，有影\n評形容後勁極強，表示：「走出電影院時，還有心跳的感覺真好。」並有熱情粉絲十刷力\n\
  挺。\n\n該片挖掘移工困境，揭開隱藏在非法體制下的黑幕，不少名人看完大推，像是林柏宏分享\n道：「監製兼女主角的張鈞甯的打戲好猛烈，她絕望的眼神我也一起流眼淚。」另外包括\n\
  唐綺陽、邵雨薇、陳柏霖等人皆給出好評。\n\n劇組近來持續跑遍各大影城，有觀眾對張鈞甯與大魔王的打鬥戲印象深刻，尤其她被狂毆\n又被掐脖的戲分，讓粉絲直呼心疼，誇她「白眼翻得好」；張鈞甯回應說：「那場戲為了\n\
  在鏡頭前看起來逼真，我還沒被掐脖子前就開始停止呼吸。」讓觀眾大讚：「女神根本用\n生命在演戲！」\n\n此外，也有影迷好奇黃鐙輝向阮經天使出挑釁彈舌功，他自曝是和兒子學的技能，笑說：\n\
  「那表情真的好欠揍，給我靈感完成這場戲。」\n\n--\n佛教經典的\n是 是菩薩成佛之道\n        是 佛經\n  是 佛        是 菩薩\n\
  \n\n\n--"
