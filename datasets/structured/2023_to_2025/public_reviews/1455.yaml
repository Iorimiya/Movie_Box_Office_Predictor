url: https://www.ptt.cc/bbs/movie/M.1620797749.A.0F0.html
title: '[普雷] 奪魂鋸9'
content: "\"有雷劇透\"\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n普普通通,\n並不是特別突出的奪魂鋸電影\n因為我有受過長期嚴格的看金田一的訓練\n\
  所以邊看邊猜兇手就是我當觀眾的樂趣\n不過在一半的時候就猜到兇手了\n導致整體觀影樂趣大減\n\n兇手通常會是個有名有姓有鏡頭的角色\n不會是臨時突然冒出來住隔壁的阿伯當兇手\n\
  (奪魂鋸1其實是少數的例外)\n伏筆很多, 所以也很好猜中\n\n1. 兇手一開始說山繆傑克森局長是他的偶像\n   從12歲時他就開始期待當警察\n   結果回憶一出現,\n\
  \   山謬其實形象就像洪金寶張三豐一樣\n   罵來打去, 這讓實習警探的話大打折扣\n\n2. 進入兇案第二天後,\n   實習生的反應跟應對突然從第一天那個矬矬的新手\n\
  \   變成反應很像一回事的警探,\n   這就讓我起了疑心,\n\n   他的眼神變了。\n   如果他不是很爛的演員,\n   其實就是個很好的演員,\n\
  \   能把這種眼神的轉折展露出來, 來透露其實他就是兇手\n   這個時候我大概有5成把握猜他是兇手\n\n3. 當主角發現那個冒牌的兇手屍體時,\n   Jigsaw的錄音只放了一半,\n\
  \   加上一旁警員也沒有說一些確定身份的話時,\n   大概就幾乎明指他就是兇手拉\n   配合他兒子只出聲音,\n   老婆幾乎不見人影,\n   人都死了卻沒有把Jigsaw的遊戲演出來等,\n\
  \   這時大概有9成確定他是兇手\n\n4. 當女局長收到簡訊後要她去證物室後,\n   後面卻接到克里斯洛克再急找他,\n   就聯想到前面兇手有跟警察借手機,\n\
  \   這個時候我已經確定實習警探就是兇手,\n   這部片後面應該已經沒有驚喜\n\n5. 結果的確就是沒啥驚喜\n   兇手還自己跳出來講解他就是兇手\n\n\
  平心而論,\n這片不太屬於奪魂鋸續篇,\n螺旋符號的解釋也很牽強,\n這些遊戲也跟奪魂老頭想表達的形象不太雷同,\n反正就是要殺壞警察嘛, 跟奪魂老頭想要讓人重生的意圖不一樣\n\
  \n啊電影篇名From the Book of the Saw\nBOOK在哪裏？\n\n不過克里斯洛克演得還不錯\n但山繆傑克森的角色就可有可無, 事實上由他來演還破壞了氣氛一點\n\
  因為他演克里斯洛克的老爸很沒說服力\n配起來就沒有父子的感覺\n導致最後結局相當的沒力\n\n\n--\n我1-8集都有看 但除了1-2其他一概都沒印象了 都普普就是\n\
  機關不太有fu 越後面越沒fu\n原本想說From the book of saw是指兇手有一本遺傳自老頭的\n重重機關設計書之類的 可以搞得很high\n結果淪為普通的懸疑片"
