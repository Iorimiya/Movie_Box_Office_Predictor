url: https://www.ptt.cc/bbs/movie/M.1660650288.A.1ED.html
title: 'Re: [新聞] 奪魂鋸10將在2023年10月上映'
content: '奪魂鋸1當年電影院上映時我剛好在電影院工作

  只能說票房真的很可憐，我們還排在最大廳

  結果淪落ㄧ星期就要下檔的慘況

  不要說看的人多不多 有的場次甚至掛蛋

  我趕在下片前最後ㄧ場進去看

  全場只有三個人

  當時看完驚為天人想說這麼神的劇本竟然沒人賞臉，但當時網路看過都給好評我還沒

  進去看時也是半信半疑，只可惜看完也下檔了不知道要推薦給誰。

  結果後來不知道是不是DVD評價反轉大反攻？？

  還是國外電影院第一集票房不錯？？

  （以上我不確定）

  才有了後來的第二集...續集沒完沒了商機

  我至今依舊納悶為什麼當年第一集這麼慘

  （我覺得是沒什麼大牌演員+宣傳也少，畢竟預算成本也很低）

  :


  --


  你可能不懂戲院排片生態

  ㄧ星期票房不好是還有可能繼續排沒錯

  但也要給戲院看得到可能性的信心

  就像海角七號第一週就賣得普普但口碑很好

  第二三週直接往上翻

  但問題是奪魂鋸那星期是慘絕人寰的慘

  可能ㄧ天開六七場可能有ㄧ半以上場次都掛蛋

  所以站在戲院方角度當然就是下片啦

  不然影廳放在那養蚊子也不是辦法

  要累積口碑第一週也不能像這麼慘啊


  像當年功夫上映時 本來我們只排了四個廳播

  最大廳也不是它

  後來開播第ㄧ天直接排隊炸裂口碑也炸裂

  過兩天直接調整全影院九個廳全上功夫

  依舊排到當天早上就賣完晚上的票了

  那整個月從早排到晚賣票賣到懷疑人生'
