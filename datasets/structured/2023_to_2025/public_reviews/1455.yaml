url: https://www.ptt.cc/bbs/movie/M.1749131606.A.70D.html
title: '[新聞]布倫屋接手《奪魂鋸》！《恐怖大媽》續集'
content: '《奪魂鋸》系列版權易主、改由布倫屋影業接手！迷因神片《恐怖大媽》宣告籌拍續集



  《奪魂鋸》（Saw）系列本來要在今年推出第 11 集，但兩個月前卻傳出，製片人之間爆

  發嚴重衝突，導致第 11 集的籌製工作徹底停擺，連發行方獅門影業都無法介入協調，最

  後可能將面臨版權出售的命運。而沒想到兩個月後，這個命運成真了。外媒《Deadline》

  今獨家報導，專門產出恐怖片的布倫屋影業，已從原製作方 Twisted Pictures 的手中收

  購了《奪魂鋸》的版權。


  但這不代表《奪魂鋸》系列未來會改由經常和布倫屋合作的環球影業發行，獅門仍然是《

  奪魂鋸》的發行方，因為他們持有此 IP 的 50 % 股權。至於第 11 集何時復工，目前則

  未有消息。




  另外，布倫屋今天還在恐怖片商業研討會上宣佈，奧塔薇亞史班瑟（Octavia Spencer）

  將回歸主演《恐怖大媽》（Ma）續集。六年前僅以 500 萬美元製作的該片，在全球熱賣

  了超過 6000 萬美元的票房，這些年來更成為許多歐美影迷和年輕人為之著迷的作品，因

  為裡頭不少橋段和對白有其特殊的魔性魅力，非常適合做成迷因廣傳，這使得《恐怖大媽

  》在歐美網路圈享有頗高的人氣。如今隨著續集即將推出，網友們也將有更多迷因素材可

  供獲取。


  知名影視記者-傑夫史奈德（Jeff Sneider）稍早亦在他的部落格《The InSneider》補充

  ，《愛情昏迷中》（The Big Sick）導演-麥可休華特（Michael Showalter）正在洽談執

  導《恐怖大媽2》，布倫屋收購《奪魂鋸》的花費則將近 1 億美元左右，而且他們從去年

  就在洽談收購，只是因為價碼問題而斡旋至今。





  --'
