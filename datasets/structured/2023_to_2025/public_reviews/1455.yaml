url: https://www.ptt.cc/bbs/movie/M.1695983376.A.A2A.html
title: '[新聞] 《奪魂鋸X》學徒「亞曼達」強勢回歸'
content: '《奪魂鋸X》學徒「亞曼達」強勢回歸 「拼圖殺人魔」邀你釋放鮮血


  2023/09/28 琅琅悅讀／ 車庫娛樂




  《奪魂鋸X》劇照。圖／車庫娛樂


  睽違六年，《奪魂鋸》系列正宗續作《奪魂鋸X》將於9月28日搶先全美在台上映，本集不

  僅將故事背景設定在《奪魂鋸》第一、二集之間，更將把粉絲喜愛的「拼圖殺人魔」約翰

  克萊默和他的得意學徒「亞曼達」帶回大銀幕，並對兩位角色進行更多著墨。


  不只觀眾期待破表，外媒同樣也十分看好《奪魂鋸X》的票房表現，DEADLINE依據《奪魂

  鋸X》近期不斷攀升的預售票房及話題聲量，預測本週末北美將開出2000萬美金以上票房

  佳績，將有望超越《A.I.創世者》空降全美票房冠軍，預期將替九月疲軟的北美票房注入

  一劑強心針！《奪魂鋸X》將於9月28日在台搶先全美上映。




  《奪魂鋸X》劇照。圖／車庫娛樂


  另外，《奪魂鋸X》也和台北捐血中心合作舉辦「釋放你的鮮血」期間限定捐血活動，讓

  更多《奪魂鋸X》粉絲在大銀幕看別人噴血之餘，也一同加入捐血行列！


  只要在9月25日至10月1日期間，至台北西門町峨嵋號捐血車，就送《奪魂鋸X》限量電影

  贈品。此活動一公布，昨天活動第一天，就立刻湧入許多觀眾至捐血處捐出熱血拿電影周

  邊，用行動支持，更有眾多網友表示「好酷的活動！要衝」、「超屌的創意啦」、「提醒

  我要去捐血了」、「捐血給讚！」


  不僅如此，電影公司更加碼推出，只要於10月10日前於全台各捐血車、捐血中心捐出熱血

  ，就可於MAGIC HOUR平台參與活動，抽《奪魂鋸X》經典漁夫帽、比利帆布袋和經典電影T

  恤等電影限量周邊！詳情請上車庫娛樂粉絲團與台北捐血中心洽詢。




  「釋放你的鮮血」期間限定捐血活動。圖／車庫娛樂


  《奪魂鋸X》中經典的比利木偶騎著招牌小車車飄洋過海從美國到台灣啦！


  即日至10/21 (六) 23：59到全台各大指定影城與《奪魂鋸X》拼圖殺人魔刑具拍照背板、

  或比利腳踏車拍照背板照相合影，將照片上傳至車庫娛樂粉專並 Hashtag「 #奪魂鋸X 」

  、「#我在 _ _ _ _ 和比利玩遊戲 」，即可抽《奪魂鋸X》限量電影周邊：漁夫帽、比利

  馬克杯，還有比利T-shirt！詳情請上車庫娛樂粉絲團查詢。




  《奪魂鋸X》拍照合影活動。圖／車庫娛樂


  在《奪魂鋸》系列中飾演亞曼達的薛妮史密斯表示，「我飾演的亞曼達有著傷痕累累的過

  去，是個非常聰明的女孩。約翰克萊默讓她的人生重回正軌，她也全心全意地對約翰付出

  作為回報。」。


  她補充道，「托賓貝爾和我默契十足，我們是一個出色的團隊，我們兩人聚焦在「拼圖殺

  人魔」和亞曼達的故事上，讓粉絲們產生共鳴。這次能回到《奪魂鋸》的原點，真是太有

  趣了。」。


  對於薛妮史密斯回歸演出《奪魂鋸X》，導演凱文格勞特興奮地表示，「我對於亞曼達能

  出現在《奪魂鋸X》裡感到非常激動，也很高興薛妮史密斯願意再度詮釋這個重要的角色

  。


  這是個在亞曼達受到罪惡感、不安全感和懷疑所驅使，開始反對「拼圖殺人魔」的所作所

  為之前，深入探討亞曼達和約翰之間的互動和關係的機會。


  在《奪魂鋸X》中，我們可以看到亞曼達那瘋狂的幽默感，以及她對約翰展現出的深情和

  脆弱的一面，與此同時，她也對於目前正在進行的血腥復仇有所顧慮。」。


  導演凱文格勞特也透露，因為本片的故事背景是發生在觀眾上次見到約翰和亞曼達的數年

  之前。


  他表示，「我相信觀眾一定會討論到這兩位演員在首度演出約翰克萊默和亞曼達後，已經

  老了將近20歲。但我很高興他們都把自己照顧得很好，讓這部電影能夠順利完成。」。


  薛妮史密斯則打趣表示，「感謝上帝讓我保持不錯的身材！我這次飾演的可是比上次登場

  還要年輕18歲的亞曼達。」。


  《奪魂鋸X》將於9月28日在台搶先全美上映。




  《奪魂鋸X》劇照。圖／車庫娛樂




  《奪魂鋸X》比利現身西門町樂聲影城。圖／車庫娛樂




  《奪魂鋸X》拍照合影活動。圖／車庫娛樂




  「釋放你的鮮血」期間限定捐血活動。圖／車庫娛樂




  --

  亞曼達看起來老好多QQ

  以外國人來說應該算很好了

  可以啦，算獨立故事

  沒錯'
