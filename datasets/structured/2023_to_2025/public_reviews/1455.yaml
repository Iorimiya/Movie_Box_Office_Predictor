title: '[新聞] 《奪魂鋸》「拼圖殺人魔」現聲《閃電俠》'
content: '新聞網址：


  電影《奪魂鋸》系列中最主要的人物「拼圖殺人魔」約翰克萊默（John Kramer），獨特的

  殺人法則讓觀眾又愛又怕，他會將不尊重生命的罪人綁回，在他身上套上各種死亡機關，

  若能誠實面對自己的罪，就有機會存活，但身心勢必受到折磨和處罰，沒想到這個萬眾矚

  目的大反派，居然也出現在DC宇宙。


  而扮演這位傳奇人物「拼圖殺人魔Jigsaw」的演員托賓貝爾（Tobin Bell），13年來「血

  腥正義」形象早已深植人心，日前他更憑著低沉渾厚又帶著驚悚感的嗓音，加入DC宇宙，

  在電視劇《閃電俠》（The Flash）中為反派「薩維塔Savitar」獻聲配音，多年來訓練的

  獨特聲音表情，為這個角色注入更多邪惡。


  這不禁令DC迷好奇，已經出現在電影《正義聯盟》的閃電俠，未來不管自成一套電影或者

  出現在《正義聯盟》續集，這位「拼圖殺人魔」是不是也有機會現身或現聲大銀幕呢？


  --'
