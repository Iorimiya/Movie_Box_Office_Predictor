url: https://www.ptt.cc/bbs/movie/M.1510293207.A.1D6.html
title: '[普小  雷] 奪魂鋸8:遊戲重啓。觀後感'
content: '我承認我有點變態，這種探討人性的系列電影，1~7集都刷過且不小心成了鐵粉。今日台

  灣首度上映，迫不及待想給它"鉅"下去啦!


  -----------無雷---------------------

  這一等就是7年，奪魂鉅系列作品在2010年早已結束，因此第八集就是全新的故事線，但

  又不落俗套的跟前七集有些關聯性。

  本集的血腥場面也少了許多，大概是換了導演的關係，較著重在人性的刻畫以及緊湊的劇

  情鋪成。


  我只能說這一集，根本就是為了賺取票房而拍攝的作品，劇情雖說引導觀眾跟著故事一路

  走到最後才明白真相到底是如何?但我看百分之50的片長，就明白編劇在搞什麼名堂了，

  劇情相當緊湊，配樂及音效為這部作品再度增添懸疑與緊張感。但不得不說故事線有許多

  解釋的太過牽強，但確被拍攝的合理化。


  在這一集中，的確有一些意想不到安排，甚至連死亡遊戲機關的規模也更大。而中文片名

  的副標名為「遊戲重啟」是很有意思的，基本上「重啟」這個概念在這部電影上有多重意

  義。


  -------------防雷線-------------------------


  爆小雷(但這也是主要核心)


  事實上《奪魂鋸：遊戲重啟》的確提到了「拼圖殺人狂」真正的「第一場遊戲」，而這次

  的「遊戲」也的確是「重啟」了那個「第一場遊戲」，也補充了更多拼圖殺人魔執行血腥

  正義的動機，來爆一個小雷，那就是拼圖殺人魔從未出現在前7集中，真正「秘密」的第

  四位門徒現身了！

  整部片探討的核心價值就是贖罪，也是拼圖殺人狂最想說的信仰，接受試煉的人，都存在

  著不可告人的罪行，因此拼圖殺人狂就是要你承認罪行並且遵照他的指示完成遊戲，你就

  能得到救贖。


  當然由於這部為了拍攝而拍攝的作品，又多了許多伏筆，相對的電影公司將會有更多理由

  繼續"鉅"下去啦!!


  整體作品:4.5/5顆星

  劇情:3.8/5顆星

  拍攝剪接:3/5顆星

  後製音樂、音效:5/5顆星

  進戲院推薦:4/5顆星


  由於我去的戲院，硬體設備不像大戲院這麼好，因此整部作品的聲光效果營造感受度就不

  高了!但或許進到大戲院真的會嚇到吃手手。


  --'
