  \n\n\n只負責Strahm探員手機訊號的定位\n\n持續查案\n\n大魔頭的前妻，誰敢對她怎樣\n\n躺在玻璃棺材裡笑\n\n還是活在倒敘畫面中\n\n\n\
  \n\n\n切肉磅秤遊戲中輸給Simone，被鐵釘鑽入兩邊太陽穴而死\n\n被William誤以為是壞人而射傷，應該活不了了\n\n停止呼吸遊戲中輸給William，被腰部巨鉗鉗死\n\
  \n兩選一遊戲中，因William選擇救Addy嫂，被吊死(系列中最衰)\n\n在蒸氣迷宮遊戲中先被燙傷腿和臉，後在與William扭打中時間到點，身上裝置\n\
  \           射出尖釘並從高空墜地而死\n\n輪盤遊戲中，第一個最衰，措手不及就被槍射死\n\n被Josh揭穿在說謊，被槍射死\n\n說要給William錢，但不夠動人，被槍射死\n\
  \n兩個存活名額已滿，被槍射死\n\n被Hoffman用刀割頸，後被放火燒死\n\nPerez探員要開槍射Hoffman，被Hoffman拿來當肉墊擋子彈，\n\
  \                 身中三槍而死\n\n先被Hoffman用熱咖啡潑灑，後被小刀狂刺腹部而死\n\n被Brent把拉桿拉到DIE處，大釘板盪過來把他釘在壁上，\n\
