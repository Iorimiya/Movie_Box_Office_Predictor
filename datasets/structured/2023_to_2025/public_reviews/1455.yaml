  \n不是很確定 \"I know who you are.\" 這封信的時間點在 No.71。\n\n最後兩項也無法確定發生的順序，是在 Brit 逃出之前，還是之後。\n\
  \n以上表格若有錯誤、遺漏，歡迎在推文提出，也歡迎任何人自由引用、修改。\n\n--\n◆ From: 114.44.180.28\n\n沒錯，是第三集才對，大概\
  \ [複製-貼上] 貼過頭了...\n\n應該是 \"警尉\" (Detective Lieutenant) 才對^^\"\n\n感謝兩位幫忙指正 :)\n\n\
  \n基本上表格的目標，是以演出來的部份為主，將猜測、推論的成份降到最低\n\n\n影片內沒有明確演出 Kerry 到底是被誰抓的 (說是被 Amanda 抓的也有可能)\n\
  \n但 Kerry 的死亡，在影片中很明確地屬於 JigSaw 的案子\n\n所以，這個時間表內的 JigSaw 是一個泛稱，並不單指 JigSaw John\
  \ 一人\n\n\n在鏡頭帶到那封信的前幾秒，有先照到貼在牆上: Hoffman 救出 Jeff 女兒的剪報\n\n而且 Hoffman 進辦公室後，手上一直拿著疑似被頒獎的獎牌，直到看信前才丟在桌上\n\
  \n如果中間有換幕，那你說的也合理，但依影片給的有限訊息，仍無法判定一定是這樣\n                                    05/10\
