title: '[  好雷] 奪魂鋸8遊戲重啟'
content: '之前看到版上提到奪魂鋸，

  跑去看了之後就馬上愛上了這系列，

  8上了之後一直很想看，

  剛好前幾天有點忙，

  害我這幾天忍不住，

  今天終於看了，



  雷---------------------------------






  看到老頭出現在螢幕上真的很激動

  看了女助手的工作室裡的道具也很激動，

  毒氣室的左輪門，

  凱瑞的撕裂機關，

  史川的密閉水箱，

  以及最經典的反向捕獸夾，

  還有一向猜不透的劇情，

  致敬第1集的復活梗跟第2集的雙時間軸，

  真的是非常感動，

  雙時間軸有點震驚，

  因為發現玩家沒人認出

  這是拼圖殺人狂的遊戲時，

  就覺得應該是以前的遊戲了，

  可是又看到電視螢幕那麼新，

  感覺又是現代的時間，

  但是又出現錄音帶，

  而且第1個挑戰者的死亡過程沒拍，

  怎麼想都不對勁啊

  一直到最後響起經典音樂的同時

  才揭發真相。

  然後幫埃加的點滴下藥的人也沒拍到，

  感覺也是下一集的伏筆，

  正常的話最後閃畫面應該要有啊XD


  真的是貫徹了Follow the rule

  就沒錯了，子彈就是通往自由的鑰匙

  跟第2集的毒氣室一樣，

  密碼就在你們腦後，

  John都說的這麼清楚了XDD


  問題是，

  女助手是怎麼知道有果汁機的裝置呢？

  如果是共犯的話，

  那第7集中戈登醫生旁邊的

  其他2個豬頭人，

  就是他們2個嗎？

  好想看第9集啊啊啊啊！


  還有一個問題，

  複習第5集的時候看維基看到的


  第8點跟第10點我真的都沒看到阿@.@

  有人有看到嗎？


  --'
