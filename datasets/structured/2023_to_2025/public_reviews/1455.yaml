url: https://www.ptt.cc/bbs/movie/M.1510280169.A.A23.html
title: 'Re: [好雷]剛剛終於把經典神片奪魂鋸1補完了 '
content: '只有第一集可以叫做經典，

  後面都只能算是延續粉絲喜歡看的普通續集而已。


  第一集營造一種不得不有人犧牲，兩個素人(其實就是導演跟編劇)天人交戰，

  但是隨著劇情的推動，

  不但真相漸漸畢露，

  觀眾原先期待起碼要有人活著的心情也逐漸轉變成懷疑是否真的活下來會是好人，

  這其中警察還掛了一個，

  最後不得不說的是.......在最後一分鐘，真相才真的大白!



  約翰站起來那一幕...是我看過最驚悚也最爽快的一幕，

  驚悚是這個人他X的還沒死，

  爽快是原來他X的導演鋪梗鋪的這麼極致!



  因為知道奪魂鋸根本沒有花甚麼成本，

  導演絞盡腦汁就是用有限的經費，

  拍出恐怖感，血腥感，沒想到最後的結局這麼精緻!



  後來的續作當然隨著團隊越來越有錢所以越來越血腥，

  其實故事張力雖然每一次都還保留一些，

  但都不如第一集來的經典。



  我覺得這一部電影應該擺在一輩子要看一次的名單之中。


  --'
