title: '[新聞] 媽德法克也加入 「死亡漩渦：奪魂鋸新'
content: '媽德法克也加入 「死亡漩渦：奪魂鋸新遊戲」同步開鋸




  「死亡漩渦：奪魂鋸新遊戲」。圖／Catchplay提供


  2021-03-26 19:11聯合報 記者陳建嘉／即時報導


  2021年強檔電影受到新冠肺炎疫情衝擊之下，好萊塢重量電影紛紛延檔，但，全球影迷最

  期待的顫慄驚悚片「奪魂鋸」系列最新作品「死亡漩渦：奪魂鋸新遊戲」，今宣布定檔於

  5月14日台美同步開鋸！


  「死亡漩渦：奪魂鋸新遊戲」由奪魂鋸系列導演操刀，搭配曾為第一集執導的恐怖大師溫

  子仁監製，好萊塢巨星山繆傑克森與喜劇泰斗克里斯洛克攜手演出。


  深獲驚悚片影迷喜愛，血腥虐殺、百看不厭的奪魂鋸系列，在今日公佈的預告中，看到了

  向第一集「奪魂鋸」致敬的經典畫面，由克里斯洛克所飾演的警探一手被鐵銬緊鎖，而另

  一手則握著一把鋸子，表情充滿驚悚，而這也是身為「奪魂鋸」系列最初創作者的監製溫

  子仁獻給影迷的巧思。


  當然，巨星山謬傑柯森的加入，更是本片最大亮點，而他個人不論在任何電影中都會出現

  的台詞「媽德法克」，在「死亡漩渦：奪魂鋸新遊戲」依然沒有缺席，令影迷沸騰。


  從2004年開啟的奪魂鋸恐怖驚悚宇宙，經典台詞「I want to play a game」是全球影迷

  共同的回憶，歷時17年，火熱程度仍未退燒，系列電影中的反派角色亦是每年萬聖節變裝

  派對人氣首選，連台北市長柯文哲、藝人陳漢典也為之瘋狂，爭相扮演過片中經典的反派

  角色，讓該系列討論話題持續熱烈，影迷們也相當關注「死亡漩渦：奪魂鋸新遊戲」的上

  映資訊。


  這一次，影迷們終於不用再等了，今年最弒血、最痛快、最紓壓的虐殺恐怖片「死亡漩渦

  ：奪魂鋸新遊戲」即將於5月14日開鋸！




  「死亡漩渦：奪魂鋸新遊戲」。圖／Catchplay提供


  新聞網址：




  --'
