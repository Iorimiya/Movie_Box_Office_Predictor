url: https://www.ptt.cc/bbs/movie/M.1510669851.A.E02.html
title: '[好雷] 奪魂鋸8:遊戲重啟 (內有雷請注意)'
content: '奪魂鋸前面幾集大致上都看過了


  所以抱著不是很期待的心情去看這片。


  以下有雷請注意!









  -------------------------(防雷頁)-------------------------------------------









































  我覺得好雷的地方其實不是在於整個劇情上如何要人悔改什麼的


  而是在最後的橋段那邊，當主角跟警官玩遊戲的時候他早就知道警官會先按他。


  以往老人都是會給機會讓對方有真的贖罪的機會，只是主角這次用的機關太簡單了。




  在來就是這次特效比較爽，比較不著重在殺人的過程跟刻化人心的部分。


  主角最後對著警官說他老婆被殺的過程，還有他內心的惡已經不可被饒恕了。


  警官依然在堅持著「老人會讓人家有贏的機會，我贏了！所以你要放我走」



  由此可見其實人根本不會改變，那些被警官冤枉的人死的那麼慘，沒人替他們發聲


  「那我來替死人發聲」關門




  沒有人真的會改變自己的，總是犧牲別人成就自己，除了一開始遊戲的老人鄰居跟黑人男


  他們至少還會想逃出去，有稍微善良的一面


  但是依然沒人會坦承自己犯錯，深刻的悔悟，然後改變自己。



  其實這也是我個人一直以來所認同的觀點，人會因為被懲罰而改變自己，那世界早就美好


  那些屢勸不聽的叛逆少年也不會有被關進去，出來之後繼續犯法的生活



  報導出來的什麼黑道大哥悔改變成OOXX 充其量只是少數


  在多數的人根本是在每天對自己說謊，說自己犯的錯只是不小心的，為什麼自己要受懲罰




  這個橋段讓我想了很多，雖然劇情上不美麗，風評也還好


  但是整個想傳達的精神其實讓我覺得還不錯 可以給個好雷這樣。


  --

  劉備在洞房花燭夜當晚，笑淫淫的對著嬌妻說：


  該是老二出場的時候了；


  登時關羽自外破門而入，大喊：多謝大哥！


  --'
