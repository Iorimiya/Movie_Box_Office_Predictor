title: '[討論] 奪魂鋸3謎團推測(雷)'
content: "以下有雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n_________________雷雷雷________________________\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n推測重點:\n\n1.雅曼達  最後告訴約翰自己殺死警官以後\n  約翰說:你知道事後我幫你收拾殘局了嗎?\n\
  \n\n2.雅曼達看完信件後情緒失控\n\n\n\n3.在最後給JEFF的錄音帶中說到:這是我以\"防萬一錄\"的,\n  當你聽到這段錄音代表你大事不妙了\n\
  \n\n         以下為重點\n\n\n     重第一點很明顯的告知觀眾,其實殺人魔早就知道雅曼達將警察殺害了\n所以在事前錄了\"兩捲\"錄音帶,一捲是給雅曼達的,另外一捲就是他最後拿出\n\
  來那捲,兩捲的共同點是,都會告知他女兒被綁走\n\n        接著各位可以重兩個地方去想:\n  1.假如雅曼達沒有這麼情緒話呢?假如她真的乖乖的遵守規則,把醫生放了呢?\n\
  \    結局應該變成:\n         醫生頭套被解下,JEFF進到房間,殺人魔告訴他實情,如果JEFF\n    原諒他,就可以快樂的帶著老婆和女兒回家,而殺人魔死後將錄音帶交給雅曼達,\n\
  \    雅曼達成為接班人(大家未來也可能要去看第4集)\n\n\n   如果JEFF不原諒他,殺了他,他便會將錄音帶交給雅曼達,也順便告知JEFF女兒被\n\
  \   綁走,\n   讓他後悔一生,雅曼達依然成為接班人(依然要去看第4集)\n\n    PS:那顆子彈適用來給JEFF來MAKE A CHOISE\n\n\
  \  2.可是殺人魔重一開始看到他對醫生的手段,已經失去他的本意,而雅曼達看\n    完信之後更顯的情緒失控,所以他在跟醫生單獨再一起時才會毀掉那捲原本\n\
  \    要給雅曼達的錄音帶,接著雅曼達斃了醫生,經過一場大屠殺之後,殺人魔拿出\n    剩下那捲錄音帶(沒戲看了XD)\n\n無論怎麼樣,殺人魔最後是一定會死的,不是被JEFF打死也會因為生病而死\n\
  (頭殼都挖成這樣了,又沒有輸血,必死的阿)\n\n\n而信的內容,應該只是單純的告訴雅曼達,JEFF過關後把醫生給放了,所以又在一次\n提醒了雅曼達\"遵守規矩\"\
  \n\n\n\n\n個人看法,請各位板友指教\n...............................\n\n\n\n--\n◆ From: 218.175.59.212"
