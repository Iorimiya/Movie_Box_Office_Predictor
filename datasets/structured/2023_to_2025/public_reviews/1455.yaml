  片頭出來亮個相\n\n在John瀕死時想到她的畫面中初亮相\n\n\n\n\n\n鐵鍊拔河遊戲中被縫住雙眼，後被另一邊的律師Art用小斧頭砍入腦門而死\n\n\
  在扯髮機關中被Rigg警探所救，但怕犯罪照片被Rigg指控，拿刀殺Rigg的扭打過程\n       中被Rigg推去撞玻璃，傷重而死\n\n啟動機關自毀一眼後，另一眼在猶豫間時間到點，五馬分屍而死\n\
