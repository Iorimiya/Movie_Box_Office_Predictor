title: '[好雷] 奪魂鋸看完有點生氣(內文有提及劇情)'
content: '防雷頁


















  其實這部片就是在反諷 詐騙犯 首腦 跟 詐騙成員 做案後得到的懲罰十分不均等

  整齣戲其實很好看也很血腥 不過看完真的會讓人十分生氣


  首先那個計程車司機 參與這個詐騙 被腦癌老哥抓到以後 雙手直接被制裁

  他頂多就是個車手 但手沒了


  再來那個護士 參與這個詐騙 被腦癌老哥抓到以後 要切大腿抽骨髓

  過程極度噁心 但是又很過癮 最終時間不夠人也沒了


  下一個是那個假醫生 參與這個詐騙 被腦癌老哥抓到以後 腦子被制裁

  過程堪稱這部片最噁心的片段 但是觀影過程讓人極度享受 最終也因為時間不夠人沒了

  我身邊的同行夥伴是完全不敢看


  最後是那個八竿子打不著的端酒演員 參與這個詐騙 只是想買海洛因

  被腦癌老哥抓到 要敲掉手腳 最後被犯罪首腦滅口


  以上四個犯罪團夥有三個參與犯罪都得到不符合比例原則的懲罰


  犯罪首腦及犯罪高層而犯罪首腦跟犯罪高層(那個男生)

  犯罪首腦最後頭掛在那邊呼吸沒死 犯罪高層他被當棄子 被犯罪首腦桶死


  整齣戲讓我感覺就是很寫實

  在當今社會中詐騙 詐騙首腦頂多就是沒收犯罪所得

  在受懲罰的過程中還可以指揮下面的犯罪團夥成員當替死鬼

  甚至還可以反過來跟審判者討價還價

  最終受到的懲罰都非常低


  所以我覺得這部片用奪魂鋸的審判老梗過程讓觀眾看得很滿足

  也反映了現實中詐騙首腦跟最終受到的懲罰不成比例的事實

  很讚！

  推薦情侶可以一同觀影


  --'
