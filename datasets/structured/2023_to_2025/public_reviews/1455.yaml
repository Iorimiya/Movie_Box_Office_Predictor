title: '[請益] 看完奪魂鋸1後的疑問(有雷)'
content: '是這樣的

  小弟昨晚看完奪魂鋸1

  看完後真真切切體會到腳底發麻的感覺(you know)

  但有兩點疑問

  1.醫生拿不到手機為何不用衣服？

  是覺得要被殺了跑不掉所以直接開始鋸...

  還是單純瀕臨崩潰沒想那麼多？


  2.Adam鑰匙被沖走，但那醫生會出去求救，那他應該不會死掉吧？為何犯人離開後他要那

  麼崩潰，是因為一個人無法在黑暗中承受壓力？





  最後最重要的！

  爬文說1最好2.3還不錯

  但也有人說要看到7梗才會全都懂

  建議全部看完


  小弟想請問版友們

  我應該追到幾呢？

  （不喜歡單純血腥片，喜歡有點劇情有點爆點的）


  拜託2以後劇情別在下面雷我喔～謝謝


