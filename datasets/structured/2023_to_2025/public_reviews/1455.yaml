title: '[討論雷] 新的奪魂鋸一直致敬某部影史經典'
content: '新的奪魂鋸spiral有不少致敬某部影史名片的彩蛋，其實看到主演有馬德發克大家就猜到

  了吧？


  沒錯就是昆丁的pulp fiction



  老歐居看到的彩蛋就有四個：


  1.片頭zeke跟朋友在吵《阿甘正傳》經典在哪，然後zeke一直貶低這部，說很糞XDD

  >>>1995年，pulp fiction奧斯卡輸給forrest gump（當年入圍最佳影片的還有刺激1995

  ）


  2.zeke跟白人菜鳥警察開車，閒聊討論女人(zeke一直說bitches），對話超級北爛

  >>>致敬討論漢堡這段經典，運鏡方式幾乎一樣，而且也是一黑一白




  3.女警官進地下室被熱蠟殺死那段，證物室門鎖有個牌子寫Jules & Vincent（導演還

  故意close-up了三次）

  >>>沒錯就是這兩位的名字啦！

  Jules Winnfield & Vincent Vega



  4.片尾高潮戲，馬德發克被吊起來，情急之下大喊: Ezekiel, shoot that mdfker!!!

  這段不少人被嚇到吧？因為前面都只知道chris rock叫zeke，從來沒有人叫過他本名Ezek

  iel，這梗藏的很深。

  >>>當然就是致敬影史著名的Ezekiel25:17...the path of a righteous man...大家都會

  背了吧




  有趣的是這次叫完以西結後，被射成蜂窩的反而是馬德發克XDD



  有人發現其他彩蛋嗎？


  --'
