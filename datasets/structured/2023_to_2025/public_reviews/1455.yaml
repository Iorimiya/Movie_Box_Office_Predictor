title: 'Re: [討論] 奪魂鋸8一些時間線的問題 （雷）'
content: '我的理解是  第八集的劇情


  現在時間點死的人  都不是經過遊戲死的

  而是直接被殺死

  死法則是照著模擬的 Jigsaw 當年那場遊戲的內容一樣

  醫生故意要營造 Jigsaw 其實沒死的假象

  來重啟 Jigsaw的遊戲  而目的就是為了報仇

  把所有跟他老婆死亡有關的人都殺了

  而警察只會以為是Jigsaw又重現江湖了


  這跟Hoffman 一開始的劇情一模一樣吧

  Hoffman 一開始也是殺掉仇人 但是偽造成 Jigsaw的手法

  斷腿的那個  在第三關的時候其實已經通過考驗了

  只是因為他作弊  所以不算


  另外可以看他的心境改變  他知道拉那個拉把自己的一定很慘

  可是他還是決定要拉  代表他已經有悔悟的心態

  第五關的時候  他跟Jigsaw 的談話也改變了很多

  他變成仔細的思考 Jigsaw 在講什麼


  =============================================================


  我覺得第八集的劇本主角本來根本是照著  Gordon 醫生寫的

  本來應該是Gordon 的老婆被撞死了  Gordon 重新下海  依照 Jigsaw遺願重啟遊戲

  但是演員本來不想演  就另外創造出這集的醫生 還是同醫院的


  劇本修改後 保留 Gordon 又可以回到劇情的條件

  之前 七 是重金請 Gordon 演員回來來個好的結尾  他才願意


  --


  --'
