content: "首先感謝Ayiyaya大大之前的資料\n整理起來才可以這麼快速\n不過我因為不太會用表格\n所以我就沒有使用表格\n\n目前因為第六集只看了一次\n\
  前面五集是可以到出租店租得到\n所以應該大致可以確認沒甚麼問題\n除非往後被新的劇情給說明推翻\n怕第六集我有哪邊記錯\n\n以下如果有哪邊有問題\n請多多指教提出討論\n\
  \n\n\n\n\n順序                           事件                                      集\n\
  \n 00   Hoffman 的妹妹被男友 Seth 殺死。                                   5\n 00   John\
  \ 跟 Jill 肚子的嬰兒超音波圖拍照。                              6\n 00   雨傘保險公司老闆 Willam 曾與 John\
  \ 碰過面                           6\n 00   發生過一場火災，死了八個人。                        \
  \               5\n 00   William 再次用條款漏洞拒絕了一名男子有心臟疾病的保險索賠           6\n\n以上時間軸有點不確定，所以當作背景、前言處理\n\
  \n 01   John 與 Art 律師決裂。(猜測與火災有關)                             4\n      Art 與一名眼睛被縫住的男子進行鐵練拔河。(時間不明)\
  \                 4\n 02   Addison 在診所外搭訕 John，被 John 趕走。後來在第二集玩八人遊戲。  4\n 03  \
  \ Cecil 藉口外套沒拿進診所偷竊，開門時不小心害 Jill 流產。           4\n      Cecil 當時與 Amanda 同在    \
  \                                       6\n 04   John 被 Gordon 醫師宣告得了前額葉腫瘤和癌症。 \
  \                     1\n      John 想申請保險補助進行實驗，卻被 Willam 利用條款漏洞拒絕。        6\n 05\
  \   John 多次嘗試自殺，卻沒死成，開始想測試人性。(和人體的極限)        2\n 06   Cecil 在測驗中椅子毀壞脫困，但想殺 John\
  \ 而跌入鐵刺網裡身亡。       4\n 07   Jill 因 Cecil 死亡找上 John，發現詭異設計圖。離開後玻璃棺材亮相。  4\n 08  \
  \ John 進行了次數不明的測試遊戲，被稱為 JigSaw。\n 09   Hoffman 假冒 JigSaw，利用「鐘擺巨斧」殺了 Seth，被 JigSaw\
  \ 盯上。   5\n 10   Hoffman 通過獵槍測試，被迫選擇幫助 JigSaw，或讓 Seth 案真相曝光。  5\n 11   Paul 想自殺，卻被\
  \ JigSaw 和 Hoffman 抓起來測試，失敗死於鐵絲網陣。 1 5\n 12   Hoffman 要 JigSaw 注意 Tapp。JigSaw 拿\
  \ Gordon 的手電筒給 Hoffman。 5\n 13   Mark 全身被塗滿油，拿蠟燭找密碼而燒死。Gordon 的手電筒留在現場。   1\n 14\
  \   Amanda 因為吸毒被 JigSaw 抓去測試，必須從牢友的肚子裡取出鑰匙。    1\n 15   Amanda 通過測試，之後成為 JigSaw\
  \ 成員。                            2\n 16   Gordon 被列為嫌疑犯，Tapp 與 Sing 質詢他        \
  \                   1\n 17   警方約談 Gordon 後，在警局中見到 Amanda。                      \
