url: https://www.ptt.cc/bbs/movie/M.1136579825.A.FDC.html
title: 'Re: [問題] 奪魂鋸2的劇情<有雷>'
content: "其實這次的設計還頗真實化的,並非理想化\n        就像我們去遊樂園 但卻不一定有時間把每一項遊樂設施都玩過一樣\n        同樣的道理\
  \  要設計一個能把大家耍的團團轉失去理性的遊戲\n        不可能就只有電影中的那幾種..應該是很周詳的  而且超過那幾樣..\n        可能因為人的個性\
  \ 事件的巧合跟時間的限制\n        所以只能玩到偶然中的幾種機關而已..\n        還記得寫著人名的紙條嗎?  電影中只出現兩個人的\n  \
  \      其他房間一定還有其他人的姓名跟錄音帶\n        只是事件的發生恰巧沒有機會玩到其他遊戲\n        而且這次發生了連設計遊戲者都沒辦法料到的事情..\n\
  \        可以說這集把遊戲真實性也給考慮近來了..\n        讓人更不會懷疑兇手也在其中(因為看過第一集都知道兇手其實是在最近的距離)\n  \
  \      電影中第一次讓我懷疑到阿曼達的時候 是他從地下室上來大廳時\n        其他女生都陸續的吐血 臉色蒼白 但只有她氣色還保持裡面最好的\n \
  \       (難道姐姐有練過??) 不過這種懷疑一下子隨著她被丟下針海而消失\n        這集除了死亡的方式外 最令人讚賞的是演員的演技\n    \
  \    當阿曼答身上的針筒一根根被抽出來時\n        感覺好像在抽我身上的針一樣..=.=;  很逼真\n        最後 當她們逃到地下室時 當日光燈開啟的那剎時\n\
  \        心中有莫名的感動...原來...第一集中..\n        爬不出來的地方  是在這房屋的地下室阿..Q.Q\n        一些懷念的人.腳..鋸子...和馬桶...XD\n\
  \n        總之我覺得這集還不錯..因為第一集的佈局實在太完美了\n        要想出能夠超越的劇情  又要避免很多觀眾可以猜到結局..蠻難的..\n\
  \        而且這次被關的人太多..沒辦法詳細的交代每個人被抓來的背景\n        誰叫電影只有兩小時呢..\n\n\n--\n        好人金卡VIP會員\n\
  \n                ~三月陰雨杜鵑現,寒刃穿腸淚滿面~\n                  ~花紅似血晴不滅,心如止水似刀劍~\n\n   \
  \                                       \n\n--\n◆ From: 140.112.39.217"
