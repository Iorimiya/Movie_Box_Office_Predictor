url: https://www.ptt.cc/bbs/movie/M.1435429402.A.552.html
title: '[好雷] 奪魂鋸1&2'
content: "本魯妹真的就像撥接上網一樣lag\n這兩天才看了奪魂鋸1&2\n看完1覺得太好看 所以上wiki查演員名單\n但竟然被爆雷！！！超火大\n\n\n\
  防雷？\n\n\n我本人是比較喜歡1>2 原因是\n第二集比第一集血腥部分多\n重點是都是有意義的 跟變態隨機殺人不同\n\n不過第二集有些地方比較不明白\n\
  像是歐比要進去拿解藥的時候\n為什麼不先拿了第一劑就出來\n反正拿了第二劑還是要給其他人搶奪\n而且錄音帶有說只能相信惡魔\n也說解藥是有代價的\n不如就是讓願意付出代價的人去拿拿看\n\
  如果能得到就是你的\n還有在火爐裡面被燒的時候畫面有帶到\n一個惡魔的圖案在火爐裡面\n不知道是不是我看錯應該有一個旋轉的東西\n\n壯漢再跟警察兒子跟Amanda推門的時候\n\
  門上不是就有一把槍嗎 不管有沒有子彈\n如果可以試試看扣扳機搞不好就可以先\n殺死女生或小孩其中之一 反正都是機會\n\nAmanda聞毒氣沒事這個還好\n可能是事先有解藥\
  \ 不過被丟進針筒池中\n最起碼身上應該要有一些傷或是衣服破了\n沒想到在第一集那間浴室的場景\n她跟小孩在一塊的時候身上毫髮無傷\n衣服還很乾淨的感覺XD\n\
  \n看wiki就被爆雷知道Amanda會成為接班人\n所以已經預設她不會死的心態\n可能也因為這樣才覺得1比2好看吧\n真的很無奈連看演員表都會被爆雷\n\n\
  最後警察先生要進去地板那扇門之前的\n地上不是有一個解藥嗎！？！？\n\n好期待明天看第三集～～～\n\n--\nSent from my Android\n\n\
  --\n   我覺得被找來玩遊戲的人跟玩的遊戲都是某種程度上有意義的吧XD?\n   但僅限於1&2 第3集就真的看了很火大\n   我也有同樣的感受 所以第3集看得很痛苦\n\
  \   前半段意義不見了 血腥度增加\n   我爽快的點是Amanda被殺了XD\n\n第三集前面有兩個遊戲都是不給活路的 根本就是虐殺\n看得我超生氣 根本初心就不見啦\
  \ 所以當最後Amanda被殺\n我覺得很爽 再來就是Jeff進去第一間房間 那個女生是唯一目擊者\n因為膽小怕事 沒有去指認兇手 但是其實她的錯也不大\n兇手還是有被抓到\
  \ 而且也有被判刑 不過因為她是第一個活該倒楣\n所以就在Jeff意味不明的情況下被冰凍了 可能需要真心才能解開(誤)\n\nJeff一直不行動讓我看了很\"\
  阿紮\" 你不管要不要救都要快拿鑰匙阿\n不救拿了就走了 救了也是要鑰匙才能解開 一直在旁邊蹉跎有用嗎\n光看你臉特寫的內心戲 而且笨蛋都知道那個欄杆在冷凍的情況下\n\
  會使自己的臉被凍傷吧 你身上穿那麼多衣物 擋一下就好啦Orz\n\n第二個恐龍法官(X)我反而不會選擇救他 第三個是撞死兒子的兇手本人\n恐龍法官還叫Jeff趕快救他呀\
  \ 我內心超大os是那你去拿鑰匙阿\n\n中間穿插的部分讓我也很討厭Amanda 明明在第二集就沒那麼討人厭\n不過感覺Amanda有種崇拜?暗戀?John的感情XD\n\
  \n第四集覺得很亂 不管是時間點還是人物角色都有些複雜\n不過最可惜的地方是即使是這麼複雜 我還是不小心猜到結尾QAQ\n但我覺得第四集比第三集好看... 目前是1>2>4>3\n\
  其中2跟4在我心目中差不多 但是John加分 看完其實蠻喜歡這角色"
