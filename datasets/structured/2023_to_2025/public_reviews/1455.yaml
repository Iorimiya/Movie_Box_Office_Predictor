url: https://www.ptt.cc/bbs/movie/M.1509931652.A.3FB.html
title: 'Re: [討論] 奪魂鋸：遊戲重啟 爛番茄開盤 (重po)'
content: '補充meta分數...好像一個大爆死QQ


  目前分數是39分


  2篇正面 13篇普通 3篇負評


  USER比較高6.3分

  正面有34篇

  補一下前幾集

  1.46，8.1

  2.40，6.9

  3.48，6.7

  4.36，6.0

  5.20，5.6

  6.30，6.3

  7(3D).24，5.4



  大概看了一下評論給普通的主要是覺得

  這是個粉絲取向的作品，也滿有誠意的

  給負評的看起來是胃口不合XD


  Watching Jigsaw go about his torture business is about as interesting as

  watching a child burn ants — a dumb and ugly waste of energy, resources and

  time.


  簡單翻譯一下

  看拼圖殺人魔進行他的折磨事業就跟看著小孩子燒螞蟻一樣

  完全就是一種愚蠢又浪費時間的行為


  他整篇文章都在罵這種訴諸暴力然後包裝成有心理學或哲學層次的電影XDD

  有興趣的可以看一下這篇分析，真的有哲學家的說法XD


  簡單來說，人有三個層次(早期的基督教哲學)

  上帝只會創造好的，那為什麼有苦難

  早期的基督教找到的解釋當亞當夏娃偷吃蘋果

  讓我們跟神分離(離開伊甸園)

  人就有了罪 必須藉由受苦受難才能靠近神

  因此感受到痛苦是因為我們的罪產生的，而非神所創造的

  可以看一下達文西密碼裡面的白子就是類似的概念(鞭笞自己)


  事實上也有一位丹麥哲學家(索倫·奧貝·齊克果)(Søren Aabye Kierkegaard)

  A.K.A存在主義之父有類似的觀點

  他小時候也是一個悲劇人物...

  簡單說一下他的論點，人的存在有三種不同層次(才能成為真我trueself)

  1.貪圖享樂(感性):缺乏道德觀與約束(morality)，覺得人世間充滿可能。

  要往上爬就要藉由痛苦(suffer)，因為當你受到約束你會非常痛苦，但這是唯一一條路

  因為受苦人類才會反省(first doubt)，享樂不會

  也就是"為什麼我這麼衰小?為什麼這會發生在我身上"

  這時你會產生要改變的渴望(desire)

  更重要的是"舊的你"死了這樣"新的你"更好的你才能產生


  2.理性:受道德驅使(拘束)，現實的，知道這世界處處設限，充滿著不可能或疑問。

  但是理性的人遇到不可能的事情就是否認跟放棄

  這時候就要靠信仰之躍(Leap of Faith)!!!!(刺客教條萬歲!!!起源超好玩)

  用信念(宗教)戰勝不可能的事情

  註:有興趣的話可以看一下深夜加油站遇見蘇格拉底這本書


  3.宗教性:也就是相信上帝

  註:亞伯殺嬰獻祭的故事中，如果不是感性(殺小孩)理性(獻祭)都無法解釋

  只能用宗教性去解釋這樣的行為，相信神、奇蹟戰勝不可能。


  以上，希望這一集不要讓我失望!!!


  --'
