title: '[有雷] 奪魂鋸 時間線的問題'
content: '雷


























  這次的奪魂鋸的時間線


  很明顯羅根是在AMANDA之前的


  因為AMANDA使用的開嘴夾 就是羅根跟約翰一起打造的


  但這樣就會有一點點小缺點啦


  約翰其實一開始的機關並沒有這麼厲害的


  像是他的第一個實驗對象 讓他老婆流產的男人- 西索


  那個工具就不太完整又陽春



  因此奪魂鋸8的時間點是在西索到AMANDA之間


  中間可能還有夾一個霍夫曼


  整體來說雖然沒有甚麼太大的問題


  但是作為約翰的第一個多人數機關


  奪魂鋸8似乎有點太精緻了(?)



  而且居然沒有說約翰的屍體去哪了挖糙


  是被拿去暗網賣了嗎XDDD



  --


  對我也知道這是非戰之罪啦XD

  要是第八集了 機關還特別廢

  就不用賣錢了


  但約翰的遺體 我真的很好奇'
