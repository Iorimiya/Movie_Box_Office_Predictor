url: https://www.ptt.cc/bbs/movie/M.1510390102.A.52C.html
title: '[好雷] 奪魂鋸:遊戲重啟'
content: '圖文網誌版：


  第一集奪魂鋸在2004年推出，備受好評，往後每年萬聖節都會推出續作，相當應景，

  距離上一集奪魂鋸3D結束後，已經6年沒有奪魂鋸上映，直到今年，奪魂鋸回來了。　


  時隔這麼久，就像冷飯熱炒，我原先不看好，

  預告片中頭戴桶子的那一關，總讓我想到奪魂鋸5的搶鑰匙遊戲，

  在電影前半段，都普普通通，甚至有超多吐槽點跟不合理之處，

  唯一的期望只剩下結尾爆點，畢竟「劇情翻轉」一直是奪魂鋸系列的特色。　


  「奪魂鋸:遊戲重啟」最厲害的地方就在這，劇情進展至白熱化，

  謎底揭曉之時，之前的吐槽點卻成為我愛上這集的原因，

  光為了這個爆點，再加上奪魂鋸系列等好久終於重回大螢幕，就相當值得看！　


  可惜機關帶給人的驚喜與刺激感不夠，畢竟過去的系列都是以厲害機關為導向，

  同時，期待血腥畫面的觀眾也會有些失望，這集的痛都很快結束，血腥場面也不是很真。

  劇中有些跟奪魂鋸前作致敬的地方，發現時還滿開心的，回憶不斷湧上。



  第一關　

  參與者五位，頭上戴鐵桶，必須要貢獻鮮血給鋸子，只要感應到鮮血鋸子就會停下。

  提示很明顯，如果冷靜點很容易想出來；

  女主角自己得救後也救了其他人，可是有位昏迷不醒者依舊死亡。　


  這關讓我想到之前奪魂鋸5的搶鑰匙關卡，雖然破關方式不同，流程卻有點像。

  殺人魔把屍體掛在橋上，就是要吸引警方注意，

  當鐵桶打開時，頭部被削去一半，全場傳來「噁～」的聲音，

  死者指甲縫有哈洛倫警探的皮膚屑，實際上是羅根故意栽贓。

  因為這關卡而死亡的角色僅有一位。



  第二關

  參與者四位，沒有在時間內給女搶匪注射藥物，所有人都會被吊死，

  藥物總共有三管，一管是解藥、一管是食鹽水、一管是毒藥，

  唯一的線索就是「一條生命對你的價值是多少？」　

  女搶匪想起以前的事情，她搶奪被害人錢包後，

  被害人因為把藥品放在錢包內，病發時無藥可服用，

  女搶匪發現被害人倒地，依然沒有要搶救的意思。　

  最後，女搶匪從被害人的皮包內，翻出了僅僅幾塊美金，那就是一條生命對她的價值。　


  女搶匪回憶起這一切，其他人也知道她想起來了，

  可是出於對死亡的恐懼，女搶匪不願意注射任何一根針筒，

  最後四個人都被吊起，萊恩情急之下把三根針筒同時注射到女搶匪脖子上，

  最後女搶匪從脖子開始朝臉部肌膚都漸漸溶解毀壞。　


  之前第一具頭被削掉的屍體出現在橋上，我還不覺得怎樣，

  可是第二具屍體也很快地出現在警方面前，這時候我就開始吐槽，

  殺人魔速度是多快，一個人死了馬上就跑出去曬屍體，

  於此同時還要去醫院把開場的那位男生殺掉，

  並且埋入拼圖殺人狂約翰的棺材中，根本太不合理！　

  但這個不合理到最後讓我深感佩服。

  因為這關卡而死亡的角色，其實是兩個人。



  第三關　

  參與者共三位，進到新房間沒多久，萊恩就踩到陷阱，

  這時有個像塔一般的房間門口被開啟，

  安娜與米基進入查看，房門卻鎖上並且不斷往內倒入穀物跟利器，

  需要萊恩拉動桿子才能打開鎖上的門，

  萊恩最後鐵了心拉桿子，自己斷了一隻腳，

  安娜與米基得以順利逃脫，萊恩則一直處在失血過多的危險邊緣。　



  第四關　

  參賽者共三位，這關相比前面的關卡，算是比較仁慈，

  因為是針對米基，無論米基成功或失敗，都不會害到別人，

  之前出現在女驗屍官(?)秘密基地的大型機關，在這邊首次登場 ( 雖然是不同台 )

  外觀看起來超炫，運作起來卻覺得有點弱，

  呼應之前米基做過的事，米基在這裡的任務就是抓住剎車，

  萊恩已經身受重傷無法幫忙，安娜則既聰明又勇敢的跑到上方，用東西卡住車輪，

  機關暫時停下，米基認為自己得救了，開心的歡呼　（在觀眾眼裡他歡呼的時機超蠢）

  卻忘記抓住剎車，接著車輪彈開異物，機關繼續運作，米基恢復慘叫最後被分屍。　　


  跟米基相同死法的屍體，出現在女驗屍官的秘密基地，

  可是哈洛倫打開門時，屍體實在被毀到看不出來是誰，

  而且…那具屍體說不出的假，我一開始還以為是假人，專門嚇哈洛倫。

  因為這個關卡死亡的人實際是兩位。

  　


  第五關

  本來安娜想逃走，卻被拼圖殺人狂打暈，接著安娜跟萊恩都被上腳銬

  （萊恩腳已經斷了一隻，所以是沒事的那隻腳被銬上腳銬，不知道為何很慘卻有點好笑）

  拼圖殺人狂在這邊揭露兩個人過去做過的壞事，

  雖然萊恩一次害死很多人，可是就情感層面我認為安娜壞得徹底，


  這邊安娜的轉黑有點硬，畢竟她前面都很努力要救人，

  雖然可以是演的，但是她之前真的努力要救米基跟第一關的其他人。　


  拼圖殺人狂露面時，居然真的是約翰，在戲院看到的當下，真的相當失望，

  明明十年前就死了，還硬要扯「其實他沒死」就只為了續作推出。　


  這關的玩法是是給兩人一把槍，拼圖殺人狂並說道：

  「你們有可能兩人一起存活，或者一起死；這子彈會是你們通往自由的道路。」　

  相比過往奪魂鋸的線索，遊戲重啟這集的提示都很明顯，

  可是在當下過於緊張，也沒什麼心思去想拼圖殺人狂說的話，

  安娜搶了槍就急著對萊恩開槍，結果槍口其實是朝後的，安娜被自己開的槍射死，

  安娜死亡後，萊恩也沒得救，因為裝在子彈中的鑰匙，在子彈發射同時會碎成兩半。



  第六關

  羅根與女驗屍官找到拼圖殺人魔老婆的倉庫，

  在裡面與哈洛倫展開一番追逐打鬥後，羅根與哈洛德最後被拼圖殺人魔關到房間中，

  雙方要坦誠自己的錯誤才能得救；

  哈洛倫搶先按下羅根的按鈕，讓羅根死於雷射。　


  沒想到過不久哈洛倫的雷射也啟動了，這時候羅根爬起身，

  原來剛剛的血是幌子，這時畫面也帶出兩具屍體，看起來死了很久，

  其中一具屍體是安娜，另一具則是萊恩。　


  羅根解釋起一切的真相，原來萊恩、安娜等人進行的遊戲，是10年前發生的，

  當時的拼圖殺人狂是約翰，第一關因為昏迷不醒被鋸子割傷的人正是羅根，

  羅根當時將約翰病例誤植，約翰為此對羅根抱有恨意。


  可是約翰最後一刻心軟，醫治了羅根，並收羅根為徒弟，

  當時的這場遊戲，除了約翰以及羅根外，沒有別的活人知道。　


  10年後，羅根為了幫妻子報仇，特意模仿10年前的事件殺人，

  並且讓屍體明顯曝光，把拼圖殺人狂的屍體從墳墓中挖起，

  讓人猜想約翰真的死了嗎？又刻意讓一切線索導向哈洛倫，使自己不被懷疑。　


  看到這裡覺得好精彩，之前我吐槽的

  「為什麼拼圖殺人狂速度這麼快，一個死了就馬上放屍體再跑回來？」

  「約翰居然還沒死，也太扯了吧。」

  真相瘋狂打我臉，覺得好痛快！


  羅根背後的傷痕也不是戰爭造成，而是當時被鋸子割傷，

  這種精彩反轉才是我愛的奪魂鋸。　


  電影的最後，哈洛倫的頭被雷射切割成一朵花，

  羅根關起了門，此段明顯是跟第一集的關門致敬，希望藉由關門帶給人絕望感，

  最可惜的是羅根沒有說出「Game Over」（雖然他說了哈洛倫也聽不到）

  　　

  最新這集對我來說，劇情還不錯，

  如果機關能再精彩點、壓迫感強烈些，我會更喜歡。


  --'
