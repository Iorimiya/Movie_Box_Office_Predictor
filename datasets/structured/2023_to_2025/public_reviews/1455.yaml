url: https://www.ptt.cc/bbs/movie/M.1510758100.A.053.html
title: '[討論] 作為一個奪魂鋸10年粉絲'
content: '以下有最新奪魂鋸8雷


















  先說明，下列的文章串聯1~8集，若沒有程度的瞭解者可能看不懂


  做為一個自奪魂鋸第一集就上大銀幕觀賞的粉絲來說

  奪魂鋸8的表現不但達到水準，更出乎預期。

  但這篇文章主要不是想要探討奪魂鋸8，

  而是想單就整個奪魂鋸"影集"的脈絡，留下一些感想


  第一集約翰自血泊中站起來想必震驚很多人，包含我在內

  從此就成為系列電影的鐵粉，每年萬聖節都會衷心期盼著


  奪魂鋸精神裡，有一個非常吸引人

  就是他的屠殺是有道理的，藉著屠殺來讓人醒悟向善

  這種道理光上面那一句就讓人覺得根本是狗屁

  但奪魂鋸系列電影就是會藉著劇情鋪陳漸漸地說服你


  "我一直都有給你生路，是你執迷不悟看不見"

  "若是你看見了，就可以免於一死，還可以藉此得到根本的轉變"


  替單純的屠殺塑造了一種高於上的神性


  但狗屁仍舊是狗屁


  到了第三集，約翰甚至為了證明他的這個理念，自己跳下來玩遊戲

  他的生命取決於亞曼達是否改變，想當然耳，最後他們全都一起死了

  亞曼達甚至在死前承認，這根本沒有用，人是不會因為你把它丟入殺戮而向善的


  很多人覺得1~3集是整個系列的結束，後面都是同人創作

  就是因為在第三集的結局，已經完全告訴觀眾，

  這個所謂玄之又玄的神性根本是狗屁啊

  你還期待她費盡心思的虐待別人是有甚麼靈而上的旨意嗎?


  失去了神性的奪魂鋸，從第4集開始就是接班人的彼此互相殘殺

  神性沒了，看點反而變成強化約翰本身

  即使約翰的理念墜落了，但他早已想好所有因應對策


  他知道他的這些接班人根本也沒有甚麼悔過向善，只是沉淪在復仇遊戲

  亞曼達因為不懂得寬恕沒資格成為接班人，連帶她的生命也賠上

  霍夫曼也不是甚麼好東西，亞曼達的死基本上是他害的

  連帶害死了約翰，所以所有的一切都再次證明了這些接班人根本也沒有改變

  約翰的理念根本就是狗屁啊


  所以他在第六集的時候安排吉兒殺掉霍夫曼

  可惜沒有成功

  沒關係，若是吉兒死了，還有高登可以殺了霍夫曼


  這些全部都是約翰在死前就已經想好了的，在一次強化了約翰的神通廣大

  但全系列至此，也就只剩下這些，和不斷的賣弄血腥


  其中最讓我無法接受的就是第7集，竟然有人覺得第7集不錯

  吉布森被衝鋒槍射死；霍夫曼說時遲那時快，瞬間手刃了兩個幹員

  然後在警局大殺四方，直接殺到吉兒的看守所


  我到底在看甚麼啊?黑幫警匪片嗎? 這根本就不是奪魂鋸了麻!


  反而在第8集把這些複雜的人物關係全部斬掉之後

  回歸到單純的懸疑猜謎，讓人感覺奪魂鋸回來了

  而且還替奪魂鋸開創了新局面


  1~7集實際上全部都在約翰的掌握之中


  但第8集，就完全不是了(除非第9集出來打我的臉


  隔了這麼久，真是令人感動


  --'
