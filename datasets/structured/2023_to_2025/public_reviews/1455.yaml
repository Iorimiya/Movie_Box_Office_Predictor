url: https://www.ptt.cc/bbs/movie/M.1510624618.A.50B.html
title: '[新聞] 《奪魂鋸:遊戲重啟》奪全台新片票房冠軍'
content: '新聞網址：


  「奪魂鋸：遊戲重啟」（Jigsaw）上映3天，以全臺破1500萬元奪下首週末新片票房冠軍，

  因為綜合全系列的前作與後傳，口碑爆棚，網友盛讚：「結局震撼直逼第1集！」而「奪魂

  鋸：遊戲重啟」更超越系列紀錄，首次躍上全臺威秀影城4DX 與國賓影城D-BOX，限定放映

  只到11月15日。


  相較於前幾集，「奪魂鋸」的骨幹角色「拼圖殺人魔Jigsaw」，幾乎只有旁白及些許客串

  ，但在最新的「奪魂鋸」系列第8集中，遊戲創始人約翰克萊默John Kramer的現身讓觀眾

  倒抽一口氣，不只老影迷驚呼：「 他真的回來了！」新影迷更大讚這樣的劇情安排實在

  「出乎意料」。


  而對於本集中的死亡機關，不只向首集致敬意味濃厚，更串起了許多系列故事中間的起承

  轉合，所以「奪魂鋸：遊戲重啟」是綜合全系列的前作與後傳，電影中飾演「拼圖殺人魔

  」 約翰克萊默的演員托賓貝爾Tobin Bell說:「這1集交代了許多在系列中出現，但卻未解

  的謎題， 不看到最後絕對無法知道驚人結局。」


  --'
