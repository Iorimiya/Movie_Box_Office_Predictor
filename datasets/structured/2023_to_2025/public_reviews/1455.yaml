title: '[新聞] 「奪魂鋸」超狂回歸！要送觀眾9999元現金'
content: '「奪魂鋸」超狂回歸！要送觀眾9999元現金



  2021-05-02 22:05聯合報

  記者蘇詠智／即時報導


  驚悚虐殺經典「奪魂鋸」系列最新電影「死亡漩渦：奪魂鋸新遊戲」即將於5月12日搶先

  全球在台上映，發行此片的CATCHPLAY除了讓台灣粉絲成為全球首批觀賞系列新作的幸運

  觀眾之外，為了慶祝「奪魂鋸」推出第9集，繼續寫下「史上最長壽」血腥系列電影的紀

  錄，破天荒舉辦「『死亡漩渦：奪魂鋸新遊戲』天天送你現金9999」活動，第一波活動即

  日起開始，只要分享活動影片齊力衝破999次分享數，即有機會成為9999元現金得獎者。

  第二波活動更是好康連環送，將於電影上映後5月13日開始連續9天，只要於每日活動貼文

  下方上傳前一日電影票根一張，每天將抽出一位9999元得主。這次拼圖殺人魔絕不虐你砍

  你，而是邀請台灣粉絲一起加入超重口味的送現金新遊戲！活動詳情請上CATCHPLAY官方

  臉書：。


  「死亡漩渦：奪魂鋸新遊戲」除了黑人諧星克里斯洛克和「神盾局局長」山繆傑克森這組

  新搭檔之外，還找來了憑叫好叫座夯劇「使女的故事」爆紅、亦是「英倫情人」奧斯卡名

  導安東尼明格拉之子的性格男星麥克思明格拉加入演員陣容，他飾演剛畢業的警校高材生

  ，但這位菜鳥警探卻成為克里斯洛克辦案過程中的神隊友，兩人從各持己見到合作無間，

  齊心找出拼圖殺人魔的真面目。麥克將本集視為「奪魂鋸」系列新篇章，他說：「這部電

  影最棒的地方就是，就算你從沒看過『奪魂鋸』系列，也能馬上進入狀況、投入在劇情中

  ，同時片中的血腥狂殺和懸疑線索也絕對能夠滿足忠實粉絲。」




  新聞網址：



  --'
