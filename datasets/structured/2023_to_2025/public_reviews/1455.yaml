title: '[新聞] 《奪魂鋸：遊戲重啟》首支預告上線'
content: "新聞網址：\n\n\n\n2004 年上映的《奪魂鋸》（Saw）以優秀緊湊的劇本，開創了一個前所未見的「奪魂鋸系\n\n列」，連續 7 年萬聖節都可以看到拼圖殺人狂的各種計謀，更捧紅了當時的導演\n\
  \n，不過在 2010 年的「最終章」後，看來這個瘋狂的殺人狂還要繼續懲罰不珍惜生命的人\n\n類，全新一集首支預告登場。\n\n\n《奪魂鋸：遊戲重啟》找來《超時空攔截》（Predestination）導演彼得斯派瑞（Peter\n\
  \nSpierig）、麥可斯派瑞（Michael Spierig）兄弟執導，除了溫子仁與雷沃納爾（Leigh\n\nWhannell）兩位主創仍擔任編劇外，還加入了《食人魚3D》（Piranha\
  \ 3D）的橋許史托堡\n\n（Josh Stolberg）與彼得高芬格（Pete Goldfinger）一同執筆劇本。\n\n\n故事將設定在原主角拼圖殺人狂約翰克拉瑪（John\
  \ Krama）去世十年之後，城鎮各地開始\n\n發現許多屍體，而每一具屍體的死因都很獨特且可怕，然而隨著調查持續進行，所有證據\n\n都指向約翰克拉瑪，但是他已經離開人世十年之久，看來是有人在仿造他的手法。將在\n\
  \n。\n\n-------------------------------------------\n\n預告片: \n\n\nI want to play\
