url: https://www.ptt.cc/bbs/movie/M.1501011591.A.8DA.html
title: '[好雷]奪魂鋸3D - 致我永遠的搖滾天王 '
content: '大家好

  我是專看恐怖片的LittleDiDi

  我又來介紹恐怖片了


  其實本來的計畫不是要發這部的

  這是最近這個消息太令人震驚了

  不知道該說什麼

  除了看電影緬懷他的身影

  就是說聲Rest in peace


  Blog圖文版會更精采





  年份：2010


  國別：美國


  類型：懸疑、驚悚、殺人魔


  導演：Kevin Greutert





  [劇情簡介]


  本集故事敘述有一群幸運脫離「拼圖殺人狂」魔掌的倖存者聚集在一起，並且開始盲目的

  跟隨巴比(Bobby Dagen)，但是眾人不知道的是，巴比他擁有最深層的黑暗秘密，而且心

  裡正盤算著展開一場最極致的殺戮遊戲！


  (連IMDB的簡介都是這胡說八道版本，隨便看看就好，反正奪魂鋸的劇情就是......玩遊

  戲囉。)





  若是一位《奪魂鋸》的忠實影迷，最近應該樂得很，因為原本以為已經要從《奪魂鋸3D》

  結束本系列，片商已經正式宣告重啟，而且不是芭樂消息，連預告片都拍好了，且傳聞始

  祖溫子仁與沃爾都有參與編劇(只是從IMDB看後面還要備註什麼creator我就不太懂什麼意

  思)，如此看來應該是還算可以期待。


  既然如此，現在來帶各位看看這部《奪魂鋸3D》，複習複習做一點前情提要，應該是不錯

  的時機點，只是說，我會寫這部片，其實還有另一個原因，待會再說。


  我應該有說過吧，《奪魂鋸》系列一直都有前人亂鋪梗，有沒有用不知道，後面的作品可

  以逞見縫插針之便就好，這也因此故事與故事之間都有不少的關聯性，雖然跳著看也不至

  於看不下去，但就會好像少了點什麼的感覺，因此，最好把這系列當作一個長壽的影集逐

  步攻略，否則就像在看無腦殺人魔片而已，苦口婆心的呼籲我就不多說了，直接看本片的

  表現吧。


  因為沒講到劇情就談不下去，所以怕暴雷的就自己斟酌一下囉。


  《奪魂鋸3D》接續《奪魂鋸6》的結尾，電鋸門大弟子霍夫曼被已故掌門約翰認定，他已

  經背棄本門行規，變成嗜血成性、殺人不分左右的殺人魔，於是交代遺孀吉兒表了他一頓

  ，只不過向來料事如神的約翰卻沒想到，他的功力早已凌駕於約翰之上，老婆又像個智障

  一樣只會原地開大，怎麼可能幹掉強得像鬼一樣的霍夫曼。


  大難不死的霍夫曼，將會怎麼復仇呢?


  另一方面，電影一開始就有精彩的送給大家，一個劈腿女跟兩個癡情男被裝機關，在鬧區

  眾目睽睽之下要上演生死鬥，遊戲規則如下，三P前各有一把電鋸，只是劈腿女被綁在上

  頭，只能看下面兩個癡情的男子漢互相使力推著前面的電鋸去殘害對手，只要讓對手被自

  己胸前的電鋸斬死，自己就能生存還能英雄救美。


  救個壁雕，這個破麻除了胸部大了點，根本毫無顏值可言，所以這次的試煉我認為，根本

  不是終於有人認清事實，而是「Jigsaw」想表誰就表誰，當年為什麼要讓阿曼達不死，其

  實也是有原因的。至於這個跟主軸劇情有什麼關係，我想應該是沒有，只是開頭給大家一

  點沙必思的而已，不過如果你覺得這樣就沒了，那就大錯特錯了，本片的血腥度還蠻足夠

  的，3D也不是浪得虛名。


  回到主軸，吉兒自從沒幹掉霍夫曼後就整個人生活在恐懼之中，生活不能自理，連作夢都

  夢到自己被機關劈成肉醬，於是只好去找警方尋求保護，與此同時，警方也接到霍夫曼的

  自拍錄影帶，宣告自己將會在某時某分進來警局找吉兒鹹濕一番，不是那種汗水淋漓的鹹

  濕，是要讓吉兒死得很難看又鹹又濕，霍夫曼強過約翰就是因為保持童子之身，怎麼會對

  人妻有興趣呢?警方面對如此自信爆表，沒想到卻先示弱，反正爛六集了也沒差這集，就

  消極地把吉兒關進牢內，再派重兵看守，感覺得出來警方也不是很想保護吉兒，只是不想

  被霍夫曼看扁而已。


  另一方面，警方也派人追查霍夫曼的下落，錄影帶似乎透露了一點端倪。就在這個時候，

  又發生了「Jigsaw」抓人玩遊戲的事件，而這也是我會寫這部電影的最大主因，那就是有

  聯合公園的主唱Chester Bennington的參與演出。


  說起這件事情，我也是感慨萬千，不知道該說些什麼才好，坦白說，我稱不上聯合公園的

  忠實歌迷，只是在某一段準備考試的日子，聽著他們的音樂十足振奮人心，「天空之城美

  特拉」不停地來回repeat，心裡想著，天啦，怎麼可以有這麼完美的一張專輯，等到年紀

  漸長，才漸漸地能從「Numb」與「What I''ve done」的MV及歌詞當中體會到別具意義。


  我自認不夠格，所以只能用這樣的方式，致敬這位我永遠的搖滾天王。


  《奪魂鋸3D》也因此變成經典，雖然Chester Bennington也有在《快克殺手》軋一角，但

  那畫面實在太低調，如果真的想看他的英姿，本片不僅看得到，而且還頗有演技，身為「

  Jigsaw」遊戲者之一，他的背部被整個塗上瘋狂瞬間膠，黏在車的座椅上，為了拯救同伴

  ，他必須在時限內把車開走，否則底下有馬子會被輾死，前面有人會被撞死，後面有人會

  被拖死。


  無論是私心還是公德心，這幕當然堪稱本片最精彩的一幕，而這就不僅僅是像開頭的沙必

  思，而是電鋸門第一把交椅霍夫曼的精心佈局之一。講到這裡，其實還沒進入本片的重點

  呢，本片叫奪魂鋸，不免俗地當然還是要玩遊戲啊，本片的主遊戲者是一個叫Bobby

  Dagen，只能說這傢伙真的是該死，我是說對電鋸門而言，因為他打著自己是在遊戲中存

  活下來的倖存者自居，不僅上節目談自己的求生經驗，還去團契為劫後餘生的其他人說教

  ，教他們要堅強，更脫衣服秀白斬身材，胸前的兩個傷疤是活下來的證據。


  不用說，這一切都是為了他的新書做宣傳。


  從他真摯的眼神，信誓旦旦的語氣，說服力很高啊，只是後來想想想，對於一個前六集都

  沒出現過的人，是真是假答案應該很明顯。若要人不知，除非己莫為，電鋸門正愁下一位

  遊戲者要找誰呢，於是這次的遊戲方式，跟《奪魂鋸6》一樣，是一人闖關其他人遭殃。


  至於後面的闖關過程，我就不多說了，再說就寫不完了，大概提一下就好，整體與前面的

  主軸鋪陳比起來就顯得弱上許多，雖然血漿用量也是不少，但遊戲就稱不上有什麼創意，

  而且第一關與第二關感覺還有點重複，第三關更讓人覺得在瞎混，不過也不是沒有特別的

  啦，這次的倒楣鬼就如我先前所說，大概是系列作以來最該死的吧，雖然惡行比起《奪魂

  鋸6》的保險經紀人是沒那麼壞，但就觀眾的角度而言，「專打不長眼」就是這種，此也

  外諷刺了假造自己神蹟、嘩眾取寵的社會亂象。


  至於是在影射誰我就不知道了，總結一下本來是完結篇的《奪魂鋸3D》，承襲一貫的超展

  開，除了本篇主軸上，霍夫曼與約翰之間從原本的師徒變成仇家，不過這算是承襲《奪魂

  鋸6》的意外發展，本片擠牙膏似的只是稍稍又推進了一點，並不讓人意外，不過找回首

  部曲中的醫生與結局呼應，本來作為完結篇也算是同時具有致敬與秉持意外性的風格，然

  而隨著《奪魂鋸8》的推出，會再怎麼發展就看事辦事了。


  至於本篇遊戲者算是很合宜的選擇，不僅是精準描寫人性發災難財的劣根性，也終於讓觀

  眾對受害者被玩這件事有點爽度考量，只是說這次的遊戲內容就有點差強人意了，相較於

  此，反而其他支線的遊戲方式還比較亮眼，血腥度也強勁許多，整題而言算是還算能接受

  的偽完結篇。



  即刻短評(滿分5)


  劇情： 3  >>這次實在是不怎麼特別，不過被玩的對象倒是挑得不錯

  結局： 3  >>這系列已經爆到外星人入侵都不意外了

  血腥： 4  >>遊戲線還好，反而其餘支線口味偏重，道具也很精緻

  氣氛： 5  >>霍夫曼根本是賈克斯，一個打五十個

  推薦： 5  >>搖滾天王的英姿，給6分都可以




  --'
