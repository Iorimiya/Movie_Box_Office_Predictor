title: '[普雷] 奪魂鋸8-為我們的遊戲，開一條新的路'
content: '以下防雷




























  身為一個奪魂鋸多年的粉絲

  基本上每一集都很仔細的看每個細節

  因為這系列總是會在最後把一些細節串起來

  也很多次把這集沒交代的在之後做交代

  但是第8集就缺少了這個元素

  老實講是有一些失望的，根據之前的套路

  本來是很期待某一集的某個臺詞可能有什麼意涵

  或是某個過去的場景又出現一次（第一集廁所），

  或是某個玩過遊戲的腳色又出來一次，然後變成徒弟

  亦或者是把

  艾曼達 婕兒 霍夫曼 高登幾個之間的互相傷害做個完整交代等等的




  沒有。

  都沒有啊阿啊阿啊阿啊崩潰！！！

  等了這麼多年就是在等這些伏筆破梗啊QQ


  這集完全是為奪魂鋸開一條新的線

  一條之前從來沒提過的劇情

  曾經玩過遊戲，也是幫約翰製造遊戲道具的助手-一個參與過伊拉克戰爭的醫生

  老實說想起到這部分就又覺得很可惜了

  之前約翰的每個繼承者的身分都沒有重疊

  包含約翰太太.毒蟲女.警官.醫生，

  而每個都有運用一些職業本身的特性

  之前幾集有演過，

  艾曼達就是個很有行動力的小助理

  霍夫曼警官負責的是運用工作資源收集遊戲參與者的資料

  然後有幾場遊戲遇到需要開刀.縫紉傷口的技術，都是由高登醫生處理


  這次又來一個醫生，就跟高登醫生重疊了，可能也是因為這樣，

  所以編劇硬讓他當約翰的道具組（？）


  而與其說第8集是在致敬奪魂鋸整個系列，我倒覺得像在致敬 第4集

  因為第8集跟第4集一樣，劇情很容易將你引導到「新的拼圖殺人魔就是那個人」

  第4集黑人警察自己盲目的闖關，逼不得已要學拼圖的方式殺人

  但霍夫曼一直緊追在後，但又刻意塑造沒有他的事時，就知道霍夫曼這腳色有別的意義


  這集也是，一直把新醫生刻意地排除在外，沒有嫌疑時，我就大概知道是他了


  另外其實在第二個遊戲參與者犧牲（脖子被插三根針筒），

  然後連結到從高樓掉下來的屍體，

  就可以看出來兩具屍體並不是在同一時間點的同一屍體，

  因為遊戲時外面天還亮著，而屍體墜樓時已是傍晚了，

  這個運用時間混淆觀眾的手法在第二集也有玩過（用錄影）

  再來第三個黑人犧牲者被絞爛的屍體，出現在女驗屍官的工作室時，又更確定這個時間點

  的問題，

  因為當時剩下的兩位參與者都還在現場，

  根本不可能有誰去搬運屍體


  說真的在本集約翰還沒出來時，

  我還真的沒有想過那些錄音檔是約翰，

  因為跟以往講話的方式不太一樣，

  語氣跟說法都不一樣

  約翰以前的錄音，會先講一些引言，

  反正就是一種無法看透高深莫測的話

  所以約翰真的出來時我是想說，他口條怎麼變差了.....


  總之，這集就是一條奪魂鋸系列獨立出來的新路

  過去所有我們以為會交代但沒交代的伏筆，或是以為會出現沒出現的人，

  ex.

  約翰有沒有照約定告訴高登電鋸門的一切？

  霍夫曼有沒有死?

  第一集攝影師有沒有復活?

  第七集高登醫生旁邊兩個馬頭豬頭是誰?...高登醫生怎麼胖那麼多（大誤）等等


  那些在這集都不重要了

  因為編劇要你放下那些，

  用全新的路去思考這系列，

  很難說之後再出續集時，會不會交代以上這些問題，

  但至少目前這集，我是把他當外傳來看的。


  不過在最後有個伏筆是可以惦記一下的

  就是女驗屍官（也是約翰的粉絲）在最後跑掉了，

  而且沒有再出現過，這條線如果跟高登醫生的梗一樣的話，也可以說是致敬第一集了吧。


  --

  網路上蠻多老外都提了一些證據證明亞當沒死，例如屍體被調包過，屍體是另一個玩家等

  等，

  這部分有些人贊成有些人反對，我則不表示意見，但想想如果亞當也沒死，無論劇本怎麼

  是怎麼掰的，其實這樣也蠻有趣的

  譬如第一集的兩個玩家都沒死，最後出來互相傷害，大pk也很有趣


  亞當：幹，高登，啊不是說好會回來救我！'
