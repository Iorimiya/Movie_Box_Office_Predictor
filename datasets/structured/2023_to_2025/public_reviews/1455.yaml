url: https://www.ptt.cc/bbs/movie/M.1517741097.A.4FD.html
title: '[請益] 奪魂鋸8的約翰問題'
content: "今天又二刷奪魂鋸8，因為第一次看院線片時，很多地方看不懂，這次去終於看懂了xd\n\n我沒看過前面7集，所以可能很多地方沒感覺還是看不懂，不過有個地方應該和前幾集沒關係\n\
  \n\e[1;36m[1;33m就是棺材中的約翰，怎麼和十年前的約翰，看起來差這麼多？\n\n棺材中的約翰看起來還蠻年輕的，而且還有鬍子，鬍子也是白色的，很明顯並不老，但十年前捉弄那五個人的約翰，卻非常老，全都是白髮\n\
  \n這次去看，主要是有個地方發現到了，所以恍然大悟，所有的不解都清楚了\n\n就是約翰的繼承人(羅根)在現代時，也玩了個遊戲，遊戲就只有三個人，然後用這三個人的屍體假裝是十年前的遊戲\n\
  \n重點在十年後三個人參加的這個遊戲，從頭到尾都沒演出來，演的全都是十年前那4+1(羅根醫生)5人\n\n所以才讓人一直有時空錯亂的問題，第一次看完後，看到大家的談論，我才知道原來五個人是十年前，搞混了時間到，二刷才看懂，實在汗顏^\
  \ ^lll\n\n--"
