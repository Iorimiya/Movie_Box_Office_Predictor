url: https://www.ptt.cc/bbs/movie/M.1574518269.A.9E9.html
title: '[心得雷] 奪魂鋸一  神片當之無愧'
content: '從一開始藍藍的光流出浴缸


  兩人開始理解現況


  帶到兩人日前故事


  個案受害者、警探發瘋、到最後伏筆全收


  可謂全程高潮



  畫面除了切腹找鑰匙和斷頭外沒什麼血腥鏡頭


  但整部都讓人極為不安，畫面的安排總能喚起我自以為忘記的恐懼


  比如小女兒在房間裡，害怕有躲人


  當醫生老爸離開，衣櫃露出眼睛時


  我確實感受到背脊發涼，還下意識環視自己的房間



  還有兩位男主角的表現


  亞當最初慌張無助到後期掌握主導權


  醫生一開始理智但因為家人而逐漸失控


  -------原本我以為是這樣的


  沒想到最後的最後他們兩個原來是在演戲


  所以香煙那場是讓兇手以為在演戲而演的戲


  在這之後，真正兇手站了起來


  也就是說這一切他都看在眼裡，理解到此著實讓人不寒而慄



  音樂、運鏡，還有太多精彩的地方，但現在大腦還在震撼，打不出太具體的感想


  只能說編劇真的太厲害了，不愧為一代神作






  -----

  Sent from JPTT on my Asus ASUS_Z01RD.


  --'
