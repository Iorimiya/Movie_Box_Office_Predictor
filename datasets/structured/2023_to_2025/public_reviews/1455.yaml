url: https://www.ptt.cc/bbs/movie/M.1137776059.A.192.html
title: '[心得] 奪魂鋸1(有大雷)'
content: "今天用電腦看了這部片子，\n          幸好因為畫質比較暗，噁心的畫面看不太清楚，\n\n          整部片嚴格來說血腥程度並不會很高，但是卻一直讓人有種噁心\n\
  \          的感覺，而且是一種鬱悶地難以抒發的噁心，想吐卻吐不出來的感覺\n\n          不像是德州電鋸殺人狂那類的片子，兇手大剌剌西哩嘩啦的砍得亂七八糟\n\
  \          要死得還死得比較乾脆些，\n\n          我弟實在很膽小，他看到之前被害者陸續被設計，譬如身上塗滿易然物\n         \
  \ 還有臉上裝了撕裂裝置的Mandy，\n          被兇手設計那一段，就直嚷\"太噁了，我不要看了.....\"\n          (他已經二十幾歲了)\n\
  \n          老實說我也看得很不舒服，但是想知道他們要如何\n          逃脫的強烈好奇心，已經超越那種噁心的感覺。\n\n        \
  \  現在恐怖片，打打殺殺，血噴得到處都是的已經成了俗套，\n          還是得稍微探究一下心理學，瞭解人類的恐懼才能抓住人心，\n         \
  \ 伊藤潤二恐怖漫畫具創意且吸引人，也是因為他有研究過心裡學，\n\n          這部片子抓住人類對於選擇緩慢死亡抑，\n          或是選擇噁心痛苦這兩種情況下的恐懼掙扎，\n\
  \n          話說回來，我其實有點不明白，唯一的倖存者Mandy，在她被兇手整了之後，\n          存活下來，竟覺得人生改變了，被拯救了?!\n\
  \n          一般人碰到這樣的事情，不知情的情況下殺了獄友，又挖開她的身體，\n          存活下來通常都會有某種程度的人格障礙?!\n  \
  \        我總覺得有點不太合理。\n\n          另外，黑人警察雇用Adam偷拍醫生，目的只是想要製造一個誘餌嗎？\n          但是他怎麼敢肯定兇手一定會盯上他們呢？\n\
  \n          看到結局，不曉得醫生會不會活下來呢，他是否會爬出來找到循得求就管道？\n          還是失血過多死在半路上？\n\n     \
  \     關於Adam我翻了前面的文章，大部分的人都說他會死\n          但是，真兇不是本來已經要給他鑰匙了嗎？（說鑰匙放在浴缸裡面）\n    \
  \      還是我漏掉了什麼？是因為門關起來就代表他出不去了嗎？\n\n\n          這部片的確頗有創意，但是我實在很不喜歡看，\n       \
  \   可能因為暴露了太多人性醜惡的地方，尤其是為了逃生所迸出的醜惡面。\n          比起這點我可能還會比較喜歡看決命終結站。\n\n       \
  \   最後結局真的出人意表，應該不會有任何觀眾猜到，\n          中間的body就是兇手吧，\n\n          我們討論起這個，\n   \
  \       我老弟他咬著牙說：以後碰到這種狀況要先鞭屍~~\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n--\n◆ From: 61.228.82.6"
