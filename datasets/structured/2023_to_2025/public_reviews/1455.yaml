url: https://www.ptt.cc/bbs/movie/M.1508992066.A.FF1.html
title: '[新聞] 《奪魂鋸》虐殺再現　殺人魔公布殺人法則'
content: '新聞網址：


  全球火紅13年，被譽為恐怖虐殺影史最經典《奪魂鋸》，第8部續集《奪魂鋸：遊戲重啟》

  即將再度於大銀幕震撼觀眾，但卻是重新展開的劇情，已過世10年的「拼圖殺人魔Jigsaw

  」竟然再度犯案，究竟這是新的模仿犯，還是其實他根本沒死？驚奇的結局絕對讓觀眾震

  驚。


  身為影史最經典，《奪魂鋸》睽違7年再出續集讓影迷期待度破表，系列電影的特別之處在

  於每集都有各種不同的機關，讓不尊重生命的獵物自己選擇生或死，但不論怎麼選擇，身

  體與心靈都必會承受極大的痛楚，只要你能逃脫死亡機關，將獲得徹底重生；在新作《奪

  魂鋸：遊戲重啟》中，五位獵物從密室裡醒來，接連經歷「鋸齒鐵片讓人身首異處」、「

  毒針讓人臉爛腦破」、「旋轉刀片將人骨肉分離」或「雷射光束將人腦爆頭裂」等酷刑，

  「拼圖殺人魔」的目的只有一個，就是讓獵物真實面對自己犯下的錯，因為只有「真相會

  讓你解脫」。


  為了迎接即將到來的萬聖節，片商與飯店業者將在本周六夜晚聯合舉辦以即將上映的電影

  「奪魂鋸：遊戲重啟」為主題的－「W娃娃屋」詭魂遊戲狂歡派對，除了運用故事情節將

  WOOBAR打造成驚悚的詭譎氛圍，更將有「奪魂鋸比利木偶」真實現身，與觀眾們一起度過

  一個難忘又驚悚的遊戲夜。


  --'
