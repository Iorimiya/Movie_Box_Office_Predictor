title: '[普雷] 死亡漩渦：奪魂鋸新遊戲'
content: '今天去了戲院看了死亡漩渦：奪魂鋸新遊戲


  身為有在追這個系列的影迷，


  自然是不會錯過這系列的新作......


  以下開始有提到劇情，請慎入。






  （防雷，有大量劇透）






  這集新奪魂鋸的主角是個黑人警探，


  本來以為山謬傑克森是本集主角，


  結果主角是他兒子，一個看起來很衝動的警探。





  反正這個警察局似乎沒什麼好東西，


  一個一個死於非命，可憐哪，


  第一個警察因為常常說謊作偽證，


  因此被兇手吊起來處刑，


  不想被列車撞死的話只能把舌頭弄斷，


  結果還是被車撞死了，幫QQ


  (最衰的應該是駕駛員，求心理陰影面積）



  第二個警察好像也是常常做壞事，


  因為射殺一個小孩，而被兇手抓起來處刑，


  不想被電死的話，只能把自己的手指頭弄斷，


  （看起來很痛，幫QQ)


  不過弄斷之後還是死了，可憐哪



  第三個死的警察是黑人警探的白人菜鳥搭檔


  被處以剝皮之刑，黑人主角從刺青認出


  是他的菜鳥搭檔。



  第四個死的是黑人警探的美女上司，


  因為包庇局裡的貪污，而被兇手盯上，


  抓來處刑，死的也很慘，被熱燙的蠟弄死


  死狀淒慘，幾乎是毀容了，幫QQ


  黑人警探為了救她還把已凝固的蠟撥開


  想要救她，可惜也是回天乏術，可憐哪



  接下來換成黑人被抓，結果他醒來發現自己


  被關在一個地方，手被手銬銬住，


  旁邊丟了一個鋸子，然後黑人警探拿來弄手銬


  想當然是一定不行，看到這裡我還以為要跟第一集


  的高登醫生一樣鋸手了，好在沒有這樣幹


  對他很仁慈的是有根鐵絲掉在旁邊，


  警探撿起，輕鬆打開了手銬，免於鋸手的命運。



  結果前面不遠處還吊起一個人，原來是前搭檔


  兇手要警探選擇救他還是袖手旁觀


  結果聽著他的慘叫聲，心軟的警探還是救了他


  不過這位前搭檔還是死了，幫QQ


  （看到這裡覺得很像前面某一集的感覺）


  然後警探自己也受傷了......



  然後他逃了出去，在這裡看到了他的白人搭檔


  原來沒死，他才是這集的兇手，


  （完全不意外，前面就猜到沒死）


  然後他提出了要跟黑人警探一起


  實踐什麼正義的要求八拉八拉的，


  結果兇手早就綁架了他爸（山謬傑克森）


  最後來個什麼機關放血，看是要選擇救他爸


  還是要打死兇手，因為警探手上的槍只剩一顆彈


  警探選擇救他爸，他爸從放血機關掉落，


  山謬傑克森叫他兒子快去追兇手，


  警探跟兇手開始扭打一起，此時警察也趕到現場


  不過被門擋著，開始把門電焊開來，可誰知道


  門上有機關連動，此時山謬傑克森又被吊起


  手上也被機關操縱，舉槍對準進來的警察


  警察紛紛對著山謬傑克森開槍，然後慘死機關上


  在警探的慘叫聲中，


  兇手對著警探比了一個安靜的手勢，然後逃走......


  本片結束。



  感想：這集兇手太好猜了，所以後面沒有什麼感覺


  毫無驚喜感。


  拼圖老頭早就死了，所以戲分只有一張照片


  這集感覺沒什麼新梗，很像奪魂鋸番外篇


  跟前面什麼關係好像都沒有，可憐哪


  只是一個copycat在模仿拼圖老頭......






  --'
