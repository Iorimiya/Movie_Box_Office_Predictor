title: '[請益] 奪魂鋸的幾個問題'
content: '防雷
























  這次這集我會給好雷，比較回歸以前奪魂鋸的風格

  有比較多推理以及到結尾恍然大悟的感覺


  不過對於劇情有些問題想問一下，看的時候沒有仔細看清楚


  1. 約翰被診斷錯誤，所以他其實是沒得癌症的嗎?

  那第三集怎麼又會因為腦癌然後做開腦手術


  2. 羅根最後說，他一直都是拼圖，然後畫面出現他剪輯錄音帶的畫面

  是指從以前到現在的錄音帶聲音都是他的嗎?


  3. 約翰已經死十年了，他去哪弄到約翰的血液?


  4. 羅根背後的傷痕雖然劇情上是說被機關傷到的

  但是那些鋸子明明就是平行排下來的，怎麼傷痕像是被鞭子打

  有左有右，還有各種角度


  --'
