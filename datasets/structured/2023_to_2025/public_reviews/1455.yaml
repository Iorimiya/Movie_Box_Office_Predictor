url: https://www.ptt.cc/bbs/movie/M.1619270960.A.D92.html
title: '[新聞] 因疫情延一年 奪魂鋸新篇 台灣又領先全球'
content: "新聞網址： \n\n2021-04-24 20:44聯合報 記者蘇詠智／即時報導\n\n\n去年一堆由於新冠肺炎而延後檔期的影片即將陸續解封，台灣因防疫成績不差、戲院照常\n\
  營業，常能成為全球最早上映的地區。虐殺恐怖片「奪魂鋸」系列最新續篇\n就宣告，，本地影迷將成第一批\n見證拼圖殺人魔恐怖新遊戲的觀眾。\n\n\n有別於過往的「奪魂鋸」影片，「死亡漩渦：奪魂鋸新遊戲」卡司陣容就很有話題，破天\n\
  荒由以喜劇表演深入人心的掛帥，\n，粉絲更是期待不已。首次成為一員的克里斯洛克，對於受\n疫情波及延宕至今的這部片即將上映，興奮地說道：「我從2004年開始就是『奪魂鋸』的\n\
  忠實鐵粉，很高興能成為這個系列的一份子，我已經等不及帶觀眾進入更刺激扭曲的新境\n地了！」\n\n\n片中克里斯洛克飾演的警探莫名被疑似拼圖殺人魔的兇手盯上，不僅收到挑釁影片和血腥\n\
  包裹，警局裡的同事更一個個被捲入虐殺遊戲中，受盡折磨被迫玩到死。山繆傑克森飾演\n的資深刑警、也是他感情疏離的父親，他過去總覺得活在父親陰影之下，但在循線查緝後\n\
  ，所有的線索竟回頭指向他所任職的警局，兇手更意有所指地反問：「警探先生，上次看\n到你爸是什麼時候？」究竟父親和兇手之間有何關聯？有待觀眾進戲院揭曉。\n\n\n\
  --"
