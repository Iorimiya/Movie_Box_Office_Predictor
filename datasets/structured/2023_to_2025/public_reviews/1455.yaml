title: '[討論] 《奪魂鋸8》正式改名為《Jigsaw》'
content: '《奪魂鋸8》官方推特發推宣布改名，改名意味著電影劇情的走向可能和之前想像的不一樣

  。這部續集故事將圍繞虛構的人物約翰·克萊默展開，他被稱為“Jigsaw”，他喜歡設陷阱

  測試受害者的生存意志。

  《奪魂鋸8》（Jigsaw）將於10月27日，也就是美國萬聖節前四天上映，而大部分

  海外市場則要等到2018年初。


  　　這部電影去年11月開機，現在還處於後期製作階段。前作的。


  該片是七年來的第一部《奪魂鋸》系列電影






