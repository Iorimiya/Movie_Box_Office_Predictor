url: https://www.ptt.cc/bbs/movie/M.1163089794.A.1D9.html
title: '[影評] 「力圖振作，風華再現」 -- 奪魂鋸3 （ …'
content: "愛說教的殺人魔，Jigsaw再度現身！自從看了「奪魂鋸2」之後，總是心有不甘。難\n道曾讓我讚譽有加、連不愛看恐怖片的女友都稱好的「奪魂鋸」，註定只能跟其他泛泛\n\
  之「片」一樣，每況愈下，拍續集只能拿來騙錢？但第三集的編劇陣容把第二集缺席的\nJames Wan找回來，又燃起我心內一絲希望 --「去證明你的眼光吧！」，懷著既期待又\n\
  怕受傷的心情，我買票進了電影院。\n\n　　驚喜的是，我對第二集的批評(，在第三集裡都做了修\n正。比如在強度方面，這次便改得比較平衡 -- 正方主角是一個人，即便是無能也還合\n\
  理，不似第二集裡一大票警察卻都是蠢蛋，兩相對照之下反讓人覺得Jigsaw強得太誇張。\n此外，主角只有一個人也比較有描述的空間。因為「奪魂鋸」系列基本上是個小格局的\n\
  故事，長度不長，如果像第二集一般弄了一堆人，反倒沒有時間好好地敘述每個角色的\n背景及心理狀態，畢竟這可不是「恐怖旅社（Hostel）」或「人皮客棧（See No\
  \ Evil）」\n之類的虐殺片，心理驚悚才是重點，如果觀眾對角色的了解不深，無法將自己投射到主\n角身上，那麼驚悚的效果便打了折扣。\n\n　　另外，還記得第一集裡Jigsaw的教訓嗎？「不懂好好過生活，浪費生命的人，不值\n\
  得活下去」，因而所有的殺人機關，都圍繞著這個中心主旨設計，讓被害人付出極大的\n痛苦（代價），才能活著離開。相對於第二集的蕭規曹隨（或說是沒有創意！），這回\n\
  Jigsaw則提出了新的課題 --「寬恕」，而所有破解機關陷阱的關鍵，仍舊設計成與\n「寬恕」此主旨緊緊相扣，這實在不容易，由此也可看出編劇的用心。\n\n　　然而，美好的事物通常只屬於回憶。「奪魂鋸」系列拍到第三集，殺人的花樣終究\n\
  用盡，開始出現一些沒創意的東西，相較之下，第一集片初那段殺人短片裡的機關確是\n經典。影像方面，第一集的畫面不但灰暗懸疑、甚至帶點迷幻的色彩，這種特色在第二\n\
  集完全消失，只剩下「絕命終結站（Final Destination）」式的血流成河，雖然「奪3」\n略作修改，仍沒有第一集來得出色。並且，身為三部曲的最後一部，本片不能免俗地還\n\
  是出現一些用來「解釋前傳」的雞肋劇情，這些部份其實可以省去。我猜，像第一集一\n般，處處充滿伏筆、巧思的恐怖片大概是可遇不可求，還是別奢望太多。不過，恐怖片\n\
  拍三部曲有此成績已算不錯，希望片商見好就收，別再來個第四集，就讓老人Jigsaw\n好好地休息吧！\n\n-------\n\n 我的Blog: Movieee~~~\
  \  \n\n--\n◆ From: 61.230.181.42\n\n--\n◆ From: 61.230.181.42"
