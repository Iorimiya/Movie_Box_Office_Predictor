url: https://www.ptt.cc/bbs/movie/M.1508381438.A.72C.html
title: '[新聞] 《奪魂鋸：遊戲重啟》殺人魔復生再玩遊戲'
content: '新聞網址：



  睽違7年，全球狂砍百億票房的恐怖虐殺電影系列《奪魂鋸》將於11月10日以最新一集《奪

  魂鋸：遊戲重啟》（Jigsaw）在台震撼回歸，在今日公布的驚悚中文海報中，風靡全球13

  年讓影迷又愛又怕的「比利木偶」，臉上帶著令人不寒而慄的詭異笑容，彷彿在邀請影迷

  再次加入他的血腥遊戲，並正式宣告冷血殺人魔回來了。《奪魂鋸：遊戲重啟》不僅讓在

  前幾集已死的殺人魔恐怖復活，重啟血腥遊戲，更使出超越以往、喪盡天良的凌虐手法折

  磨獵物，如生人活埋、飛天利器、引擎絞肉機和雷射光腦袋開花等。


  《奪魂鋸：遊戲重啟》由首集導演溫子仁James Wan擔任監製，擅長科幻與驚悚風格的《超

  時空攔截》澳洲兄弟檔導演麥可斯派瑞格Michael Spierig和彼得斯派瑞格Peter Spierig

  操刀，不僅設計許多比前幾集更考驗人性的機關陷阱，還有神祕難測和跌宕離奇的故事轉

  折，而最讓影迷期待的「拼圖殺人魔」將再度出現，令人意想不到的逆轉結局絕對令人大

  呼過癮。飾演「拼圖殺人魔」一角成名的托賓貝爾Tobin Bell也向觀眾掛保證，這次的《

  奪魂鋸：遊戲重啟》會在《奪魂鋸》系列的脈絡中帶來耳目一新的感受，他更向觀眾喊話

  ：「看《奪魂鋸：遊戲重啟》就像在坐一趟刺激的雲霄飛車，你可得坐穩了。」


  《奪魂鋸：遊戲重啟》描述城市發生多起慘絕人寰的殺人案，死者死狀悽慘，面目全非，

  在調查過程中，所有證據都直指凶手是人稱「拼圖殺人魔」的約翰克萊默，但克萊默已經

  過世10年。究竟是有人故弄玄虛，模仿他的手法犯案，還是殺人魔其實沒有死，血腥的獵

  殺遊戲又重新開始？


  --'
