title: '[好雷] 《奪魂鋸10》約翰克萊默戲份最多的一集'
content: '雷文防雷資訊頁




  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  圖文重點標示好讀版↓




  回想起當年開始接觸《奪魂鋸》系列是在就讀高中時期，而且印象很深刻，我是先看《奪

  魂鋸2》，當時看完的感覺是覺得普通，但回頭把《奪魂鋸》補完後，真的覺得《奪魂鋸

  》系列是神作，所以之後每集都有去電影院看，今天剛上映的《奪魂鋸10》當然也不例外

  。

  《奪魂鋸》系列的核心角色是由托賓貝爾（Tobin Bell）所飾演的約翰克萊默，綽號「拼

  圖殺人魔」，但這個核心角色除了《奪魂鋸2》及《奪魂鋸3》以外，其他集要馬戲份很少

  ，要馬只出現在其他角色的回憶劇情裡，著實可惜。

  而《奪魂鋸10》終於讓影迷大飽眼福，可以看到約翰克萊默超多的戲份及以往所沒展現的

  一面。

  《奪魂鋸10》的故事背景是設定在《奪魂鋸》及《奪魂鋸2》之間，當約翰克萊默因腦癌

  末期絕望的寫遺囑時，意外得知一種可以治癒癌症的新療法，但這種新療法目前還沒被任

  何國家認可，因此只能透過特殊管道聯繫該醫療團隊，在一切就緒後，抱著一絲希望接受

  治療，雖然醫療費用總共花了25萬美金，但對約翰來說，能夠重獲新生是再值得不過了。

  滿懷欣喜的約翰買著禮物想報答醫療團隊，但回到原處時，卻發現是一場騙局，於是憤怒

  的約翰透過警探霍夫曼調查醫療詐騙集團一夥人的資料，並與亞曼達一起展開復仇。

  在復仇的過程中，免不了對受考驗者進行機關拷問，雖然最後劇情出現兩個反轉，但也難

  得讓觀眾可以看見約翰為了救無辜的人所展現溫和的一面，因此我個人認為《奪魂鋸10》

  是《奪魂鋸》系列最好看的一集！

  另外，《奪魂鋸10》有片尾彩蛋，我記得沒錯的話，是目前《奪魂鋸》系列裡唯一有片尾

  彩蛋的一集，所以有打算去看的人務必要留到最後，片尾彩蛋一樣很精彩！

  總之，非常推薦《奪魂鋸》系列的鐵粉觀賞《奪魂鋸10》！


  --

  我的FB專頁「阿培嘎嘎嘎」，歡迎大家按讚追蹤！



  --'
