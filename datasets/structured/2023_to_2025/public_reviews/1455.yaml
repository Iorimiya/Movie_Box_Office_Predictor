url: https://www.ptt.cc/bbs/movie/M.1697914084.A.1B9.html
title: '[普雷] 奪魂鋸X結尾是不是歷屆最爛？'
content: "奪魂鋸1～9不管過程再爛，\n\n結局至少都還有讓人想不到的梗\n\n第十集感覺直接炸裂。\n\n\n\n老頭治病過程，我還想說他那麼聰明\n\n\
  應該不會被老梗醫療團隊詐騙，\n\n甚至一開始完全沒提到費用，還以為\n\n是真的，結果竟然就這樣順順的騙下去。\n\n\n\n結尾冒出小屁孩是啥小，雖然很爛\n\
  \n但這也是唯一一集老頭失算，打亂\n\n他的計畫。\n\n\n但血刑風險也太大了吧，本來應該\n\n是設計老頭和阿曼達玩，把情侶騙上去\n\n但如果情侶心理變態看著他們玩呢？\n\
  \n那個鎖應該是毒氣室開始讀秒才能解\n\n電子鎖之類的。\n\n（而且情侶如果沒叫他們上去玩呢？\n     相較前幾集這邊太刻意）\n\n\n最後片尾竟然讓最壞的女醫生最爽？\n\
  \n她就這樣活了?（她贏了，毒氣關了）\n\n她夥伴衰小那麼難贏，還有個贏的被\n\n她踩死（這也是難得老頭失算）\n\n這樣依照慣例，接班人一堆欸，\n\n\
  根本活下來的都有機會接班\n\n（墨西哥司機、小屁孩、女醫生）\n\n\n最後霍夫曼還出來打醬油，我還以為\n\n血刑到一半是他要出來救場...\n\n\n\n\
  \n--\n死亡旋渦評價最爛但片尾也有反轉\n而且還有山謬的Mother fucker 笑點"
