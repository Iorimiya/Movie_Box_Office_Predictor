url: https://www.ptt.cc/bbs/movie/M.1696076973.A.9CA.html
title: '[負雷] 奪魂鋸 X，很一般的片'
content: '雷文防雷資訊頁































  ~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~




  ~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


  前面鋪陳太冗長

  演這麼久就只是為了敘述被騙錢

  看到一半想說我是不是走錯廳

  再來是教育理由太薄弱

  只是偷個手錶就要被掰手指吸眼睛

  覺得這個機關算是整個電影裡面最有創意的

  但對於遊戲的介紹有點太少

  沒有讓受刑人了解遊戲怎麼玩

  需要做什麼否則最後結局會怎樣

  印象只是說如果你想看到明天的太陽

  就把按鈕轉到五之類的

  結果演到最後還是約翰自己的幻想

  就是這個遊戲不需要任何理由

  誰都可以

  反正只是幻想而已


  然後就是對詐騙集團的復仇

  奪魂鋸系列都出到第十集

  覺得這樣程度的機關了無新意

  而且演員對於遊戲的恐懼不夠到位

  這也是因為要殺的人太多

  要亮相的遊戲也多

  比較少著墨在演員的內心的部分

  像是一醒來就知道自己要幹嗎了

  演技有點尬

  覺得第一集還是經典

  沒有太多血腥的畫面

  從內心層面說明約翰設計這個遊戲的目的


  但如果是為了商業目的

  遊戲的設計又太沒有創意

  像是毒癮的那位女孩

  不曉得為什麼要打手跟腳

  打完手之後不就掉在地上可以走路了

  然後首腦的結局真的太廢

  我原本期待會有什麼不一樣的機關

  最後怎麼會來個毒氣室

  就是兩個人互相殘殺而已

  看完沒有甚麼特別的感想

  約翰的起身也沒讓人驚訝

  猜的到的劇情


  如果是其他片會評價普雷

  但做為奪魂鋸的續集

  個人覺得應該要有某些看點

  有別於前作之類的

  但這部片沒有

  還拍了這麼多集

  因此給個負雷


  --

  35'
