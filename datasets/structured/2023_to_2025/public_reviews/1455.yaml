url: https://www.ptt.cc/bbs/movie/M.1510546442.A.195.html
title: '[負雷] 奪魂鋸：吉個搜'
content: '奪魂鋸1是公認劇情節奏等等最好的

  雖然跟後面比起來，其他集遜色了些

  不過都還是有他的特色


  至少設計的遊戲都能讓人反省

  雖然付出慘痛的代價，卻能重獲新生

  都是有教育意義的


  （鐘擺切肚子跟女警被破肚那個例外


  好像有集是五個人一樣被鎖鏈鎖住頭開頭的

  他們假如同心協力，其實每一關都不會死人的


  防雷

























  但是這集


  第一關單純就一直被拉，然後給點割傷的血就沒了


  R u fucking kidding me?

  所以這關卡設計的意義是啥？



  第二關三根針有水、食鹽水跟酸

  那三根上面都有不同的數字

  也就只有一根是有意義的

  怎麼不試？不試死4個，試了可能死一個但其他人能活

  啊另外兩根的數字就單純是開門的密碼？

  然後在那邊我不知道要選哪個真的讓人很火

  加上規則也沒說不能滴出來啊

  酸滴一滴出來到地上就知道

  只剩食鹽水跟解藥，食鹽水就是鹹

  那解藥不就很明顯




  第三關有人想要走捷徑腿被綁住

  假如他們都沒人要走捷徑那遊戲怎麼開始

  這遊戲是要懲罰走捷徑

  那怎麼還要跟第四關稻穀下武器雨做關聯

  媽的她們就只能看捷徑男要不要拉，這對在稻穀裡的兩個人不公平，

  完全沒教育意義，他們在裡面犧牲了什麼，也活不了

  還有假如在她們進去稻穀屋前，捷徑男就拉把手，這樣是要怎麼玩





  第五關

  就男的白癡，停止的時候不壓煞車把手

  所以被絞死

  這關還行，可能是付出手或身體會被割傷的代價





  第六關雖然很簡單但是卻讓我很深刻

  約翰也說了這是讓你們通往自由的鑰匙

  這關才有奪魂鋸遊戲的那種感覺




  第七關講做過的壞事，就不用被雷射切割

  喔～很誠實的講就沒事了呢

  你們不覺得很好笑嗎

  一看這遊戲就是有坑，果然醫生才是幕後

  啊你都錄音了還是把人切割

  所以單純給警方錄影讓他連死後的名聲也爛這樣喔= =

  都是徒弟了，關門不知道要喊個game over

  吉個搜白教了












  總結

  只能說要血腥沒血腥

  遊戲設計沒很好

  印象深刻的點也沒幾個

  就賣情懷吧

  5 / 10


  --

  或許吧，不過就原本的看來表現手法不好

  有一幕

  不是我要學啊，是給那些要玩遊戲的

  嗯後來出現她沒反省

  真的雷

  也是'
