url: https://www.ptt.cc/bbs/movie/M.1463852845.A.8C2.html
title: 'Fw: [問卦] 奪魂鋸跟絕命終結站很久「沒續集」？'
content: '作者: qweewqq (風一樣的男子) 看板: Gossiping

  標題: [問卦] 奪魂鋸跟絕命終結站很久「沒續集」？

  時間: Sun May 22 01:47:19 2016



  奪魂鋸最後一集，奪魂鋸3D於2010年上映


  奪魂鋸從2004開始，每年都會拍一部作品，不知為何長達六年沒有新作？


  照理說奪魂鋸應該超受歡迎票房大賣？


  至於絕命終結站更是廣為人知


  絕命終結站1 2000年上映，飛機失事，經典之作。演員拍完後不敢搭飛機。

  絕命終結站2 2003年上映，高速公路，開始試圖對抗死神

  絕命終結站3 2006年上映，雲霄飛車，大學同學，與失事的180號航班有所牽連

  絕命終結站4 2009年上映，照樣是與死神的對抗

  絕命終結站5 2011年上映，絕命終結站1的前傳


  絕命終結站系列幾乎每隔3年就會推出新作


  絕命終結站5於2011年上映，也是長達5年沒有作品



  奪魂鋸 I want to play a game


  以及絕命終結站「死神不喜歡被欺騙」


  大家都很愛看，請問這兩部電影為何那麼久沒推出新作？


  是有什麼特別的原因嗎？


