url: https://www.ptt.cc/bbs/movie/M.1510409801.A.4D6.html
title: '[無雷］奪魂鋸：遊戲重啓-從來沒看過這系列的人'
content: '這是我第一次看奪魂鋸系列的電影，之前聽到奪魂鋸一直以為和斷頭谷類似（？）


  這次是因為朋友送票，所以才想要去看看到底什麼是奪魂鋸。


  就劇情來說，淺顯易懂，不需要花什麼腦筋。但是我個人很愛一直在片中角色遇到危險的

  時候思考對策。


  節奏明快， 不會有看了很久看不完的感覺。我之前被朋友找去看解憂的時候一直覺得應

  該完了吧，結果一直沒結束(？)，害我看完覺得很累，幸好奪魂鋸不會有這樣的問題，應

  該算是如果在電影台轉到不會轉走的電影。


  沒有看過奪魂鋸的人在理解劇情的時候不會產生困難，只是如果有一些致敬的橋段的時候

  就不會發現跟前幾集的電影內容有關，但不會影響觀影樂趣。


  片尾謎底揭開的時候有一種「我竟然沒發現！」的恍然大悟感覺，是用心而且討人喜歡的

  。同行的朋友也覺得讚賞，是不著痕跡的伏筆。


  血腥度部分對我而言恰到好處，不會到太多以至於產生不舒服的感覺。但我個人平常重口

  味，同行的朋友覺得滿分五分的話，血腥度四分。


  票房感覺不錯，我四十分鐘前劃位，十牌的位子劃到第四排，後面左右全部都坐滿。原來

  大家口味都偏重啊（笑）


  --'
