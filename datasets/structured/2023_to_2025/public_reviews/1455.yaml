url: https://www.ptt.cc/bbs/movie/M.1739252766.A.B6D.html
title: '[新聞]《奪魂鋸11》恐怕無法如期上映？消息來源指出：獅門影業遭遇財務困境'
content: '新聞網址：


  不堪負荷

  2025-02-11



  Jigsaw 不會再有下一舞了嗎？《奪魂鋸》系列的第十一部電影《奪魂鋸 11》(Saw XI)

  正面臨困境。Scream Magazine 最新報導，根據「可靠消息來源」，這部恐怖系列的新作

  在幕後遭遇多重問題，包括：



  1. 獅門影業內部的財務困境


  2. 主演托賓貝爾的健康狀況


  3. 拍攝計畫延誤，導致檔期不穩



  這些問題讓外界擔憂，《奪魂鋸 11》可能無法如期在 2025 年 9 月上映。



  最初，《奪魂鋸 11》預計於 2024 年 9 月 27 日上映，但後來迅速被推遲至2025 年 9

  月 26 日。同時，官方確認托賓貝爾將回歸，繼續飾演傳奇殺人魔約翰克萊默，也就是拼

  圖殺人狂。



  然而，Scream Magazine 的消息人士指出：


  「現在看起來，《奪魂鋸 11》極有可能無法趕上 2025 年 9 月的新檔期。幕後存在重大

  問題，除非有什麼大變動，否則這部電影可能無法如期在明年秋季上映。」





  雖然財務問題並未被正式確認為《

  奪魂鋸 11》的延期原因，但資金短缺可能導致製作進一步推遲。



  比起製片方的財務問題，影迷更擔心的是托賓貝爾的年齡與身體狀況是否足以支撐整部電

  影的拍攝。



  托賓貝爾在 2004 年《奪魂鋸》首部電影 中首次飾演身患絕症的工程師約翰克萊默，他

  利用智慧與機關設計恐怖陷阱，對「不珍惜生命」的人進行致命測試。至今，他已在 10

  部《奪魂鋸》電影中出演了 9 次，可說是整個系列的靈魂人物。



  然而，托賓貝爾目前已經 81 歲，消息來源透露：







  如果貝爾無法再度勝任這個角色，這將是《奪魂鋸》系列的一大挑戰，因為他的精湛演技

  與角色魅力一直是該系列的關鍵賣點。



  目前，《奪魂鋸 11》仍然維持 2025 年 9 月的上映計畫，導演凱文格羅特 也將回歸執

  導，並由馬庫鄧斯坦負責劇本撰寫。然而，如果幕後問題持續未解，這部電影可能會再次

  延期，甚至被擱置。



  ，電影回歸早期經典風格，深入

  探討約翰·克萊默的內心世界。故事設定於 《奪魂鋸》與《奪魂鋸 2》之間，講述罹患

  癌症的約翰為了尋找治療方法，前往墨西哥接受一場實驗性醫療手術，卻發現這只是一場

  針對絕望病人的詐騙。他於是決定回歸自己的「正義審判」，親自設計陷阱懲罰這些騙子

  。



  這部電影獲得了爛番茄 81% 的「認證新鮮」評價，成為該系列歷史上最受好評的作品，

  全球票房突破 1.25 億美元，也讓粉絲對續集的期待值飆升。



  --


  大家還期待這一IP嗎???


  --'
