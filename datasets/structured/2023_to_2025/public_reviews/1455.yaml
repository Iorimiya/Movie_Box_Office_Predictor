url: https://www.ptt.cc/bbs/movie/M.1510353814.A.FC4.html
title: '[無雷] 奪魂鋸：遊戲重啟。舊影迷的小雀躍'
content: '【奪魂鋸：遊戲重啟 Jigsaw】


  #前言：

  奪魂鋸系列的第8集，俗稱奪魂G8。

  我個人最愛的當代恐怖片系列之一。

  但這集的英文片名

  不再是Saw(鋸子/看見)，

  而是Jigsaw(拼圖)。


  #評分：3.8 / 5


  #簡評無劇透：

  每逢萬聖節必朝聖的恐怖片，相隔7年

  再度重回大螢幕。保安！可以讓拼圖殺手

  這樣死了又死、死了又死的嗎？


  片商說：I do.


  當然比起黑色星期五的妖魔傑森、每集

  都不合理的復活，奪魂鋸的拼圖殺手在

  過往的集數中，只存在回憶裡登場，這

  已經算是很合理了。


  第8集還能變什麼把戲呢？要知道當年

  第7集為了搞3D這套，劇情被我嫌棄到

  臭頭，就看這集能否挽回我的心……


  答案是，嗯… 還好。


  劇情勉強在最後微微倒抽一口氣，真的

  是微微；血腥度輸第3467集；至於機關

  嘛，看得出一些致敬前作的成分，但整體

  來說機關的創意娛樂度不高。

  (就我看來這本該是第8集賣點才對)


  但就回鍋片來說，我認為誠意十足啦，

  熟悉的配樂啊、角色啊、道具啊，該

  懷念的都有到位。如果你跟我一樣很迷

  這系列，這些一定會讓你內心小雀躍。


  簡單來說，舊影迷必朝聖，新朋友可以

  考慮一下，畢竟不懂那些懷舊點，單論

  娛樂度實在低空飛過。


  噢，最後，我要說：


  I want to play a game....


  --'
