url: https://www.ptt.cc/bbs/movie/M.1137187479.A.7D1.html
title: '[討論] 奪魂鋸二的一點意見(雷)'
content: "我覺得編劇完全依循著奪魂鋸一的命題或本意進行二的創作\n\n1. 前面就有版友說過的，兇手通常是近距離存在於犯罪現場的，所以阿曼達的存在便是符\n\
  \   合這樣的要求\n\n2. 兇手沒有給予任何人固定的死法，他們嚴格說來，都是自己要往死路跳的(除了那名身\n   體虛弱到被毒氣毒死的女子)，所以其實原本他們都有活路，只是因為更多複雜的人性\n\
  \   因子，才導致這樣死傷慘重的情況\n\n3. 第一集中提過老人很喜歡\"現場\"觀賞他的傑作，而第二集老人在一開始卻沒有\"現場\"觀\n   賞，非常明顯的，這個關鍵點就在於老人已經\"\
  欣賞完\"他的傑作了，所以他沒有看轉播\n   ，這段可以說是編劇所安排的暗示\"這並不是現場\"的最早伏筆。\n\n以上三點是我覺得一跟二相承性很高而且很深的地方\n\
  \n\n另外再說到我覺得最恐怖的地方，即是老人對人性的掌控真的到神乎其技的神的地步\n\n1. 老人在與艾瑞克警察的遊戲中，其實一直在PUSH他失去控制，從一開始的\"\
  你兒子一定\n   是害怕懦弱地躲在角落裡\"(這也是影片重播的暗示)，到後來使出抽屜中的檔案夾((放\n   有那些被關在裡面的人的資料)的絕招，顯示出他兒子\"\
  處在雙重危機(毒氣、心有怨恨\n   的冤枉人)\"中的急迫情況(影片好像正好也在發現X的地方?)，讓艾瑞克終於忍受不住，\n   自己跑過去施刑，最後被老人帶去廢屋。其實艾瑞克的行動都在老人掌握之中，因為老\n\
  \   人要藉著艾瑞克帶他逃出被警察逮捕的危機，但是可能沒料到被打的那麼慘吧，或是說\n   其實老人要藉著苦肉計來讓艾瑞克相信，\"我是因為被你打到快不行了才向你求饒的\"\
  \n   (同時也讓觀眾相信這一點)，所以，老人只是利用艾瑞克的愛子心切逃脫現場。\n\n2. 老人本來就是要讓裡面的人互相殘殺的，因為他安排解藥的方法是\"\
  每次只出現不夠全\n   部人用的劑數)\"，而且一開始就說過\"解藥的劑數是全部的人數量減一劑\"(這似乎也是\n   暗示阿曼達是共犯的線索)，營造出\"\
  解藥絕對不夠，一定要搶\"的競爭和不信任心理，\n   所以要是真的有人拿到了解藥，不管拿到幾劑，一定會產生競爭或自相殘殺的情況。可\n   以推想這是老人對人性的測試，以及增加他觀賞的娛樂效果吧。(所以裡面的人如果可\n\
  \   以戰勝人性的考驗，合作無間，還是可以全部倖存的，但是大家知道這是不可能的)\n\n3. 有人說把兒子放在裡面不確定性太高，很容易死掉，但是指出一點，其實兒子到最後有\n\
  \   沒有死都並不重要，只要讓兒子活過兩小時，也就是活過他父親崩潰之前就好了，他兒\n   子只是逼使艾瑞克前往廢屋的誘餌，如果兒子真的死了，只要父親沒看到，那也無妨於\n\
  \   計畫的進行。最後兒子成功沒死也能順便達到\"諷刺\"父親的效果。\n\n4. 有人對第一個在房子裡陣亡的經理的死法覺得很不必然，其實在最一開始阿曼達醒來之\n\
  \   後便去找\"鬆磚塊之後\"的錄音帶，這就已經暗示人對\"背後的東西\"的好奇(雖然阿曼達\n   的動作動機是可議的)，所以會去看門上的小洞是合乎人情的，只是剛好在轉鑰匙的時\n\
  \   候看，就有點過於巧合了。\n\n\n另外關於共犯阿曼達的問題，就像前面某位版友說過的，他應該也是被施以\"保護兒子\"的\n指令之後就被老人丟進去的，她不應該是對所有情況都很了解的，但是因為他對老人遊戲\n\
  形式的了解，所以她才會那麼努力且有效的去找線索，如果她真的是在這個遊戲中站在制\n高點的位置的話，她早就把大漢ko了，何必要辛辛苦苦的左逃右躲，而且最後在奪魂鋸一\n\
  的場景中，我覺得阿曼達對於兒子的割喉行動是意料之外而且驚訝的，如果沒有兒子的奇\n襲，我想她是沒有任何辦法可想的。\n\n所以阿曼達的指令應該是\"保護兒子\"\
  →\"將兒子送回基地\"→\"回到原來場景等待\"\n\n如果說她沒有吐血，我想也是可能有以下理由\n\n1. 老人先動了手腳(我覺得這個可能性較高)。\n\n\
  2. 阿曼達自己動了手腳。\n\n3. 提出一個大膽的假設，針筒池裡面都是解藥，為老人所佈置的，因為阿曼達之前有提過\n   她是毒蟲，而大漢又被設定為是個自私的人，所以他一定不會自己下去，所以他找了一\n\
  \   個\"跟針頭最有關係\"的人下去，所以因此阿曼達就被救了。\n   (此說多有闕漏，只是假設。因為這是唯一阿曼達有接觸到針頭的畫面)\n\n還有阿曼達跟大漢割皮的橋段，我覺得阿曼達是不可能會讓他看數字的，看數字必接近，\n\
  而且阿曼達有沒有數字還是個問題(除去阿曼達之外屋內剛好有七人)，所以阿曼達情急之\n下說出自保策略的話(沒有我就沒人幫你看了)，然後就發生了之後的事，解救了阿曼達的\n\
  危機。所以可以推斷後來保險箱那管解藥是被阿曼達拿來救小孩的(符合阿曼達身陷在遊戲\n中須配合遊戲的前提)。\n\n\n另外最後艾瑞克到達黑人死去的地方時，黑人屍體腐爛的程度已經非常嚴重，就可以知道\n\
  已經過了很久，而且不知道我有沒有看錯，我似乎在這時候看到地道的入口附近有一管解\n藥劑，好像裡面還有黃綠色的液體。有沒有版友知道這個有什麼意義呢？還是我眼花看錯\n\
  \n\n\n說了一些拉哩拉雜的，只是一些瑣碎的個人的小意見，請大家多包含指教囉。\n\n\n\n\n--\n◆ From: 218.164.77.10"
