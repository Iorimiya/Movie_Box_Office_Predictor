title: 想討論一下關於奪魂鋸重啟的機關過法
content: '第一關:沾血


  第二關:正確的數字針筒(偷來的錢)，這關根本送分，只可惜女的不敢插


  第三關(綁腳):滿好奇如果不拉手把等人來救(如果有人會發現的話)可不可行


  第四關(穀倉):我這個很想問，下武器雨應該不可能是隨機下的吧，不然哪可能那麼剛好，

  致命武器跟要害都中不了?老頭不可能神算到連被埋的地點都知道，然後刻意慢慢下武器避

  開吧......算了  劇情需要也不多討論


  第五關(絞肉機):這是這次主要發文的重點，我想問這個有辦法過關嗎?


  看起來規則是讓人慢慢往下掉，然後身體要盡量成一直線避免被割到沒錯吧?

  然後女主幫忙亂入摩托車輪胎停了一下，絞肉機再開的時候黑人就直接死了


  想請問正常情況下這關要怎麼過呢?

  而且就算女主亂入了，其實黑人不亂動也還是可以過的吧?

  只是這關很危險，不小心一個閃失被攪進去就直接GG了

  但是如果從頭到尾身體呈一直線去拉到剎車，搞不好可以完美通關耶

  各位是怎麼看的呢?

  要討論其他機關也歡迎


  最後一關:把散彈槍打開拿鑰匙就可以無傷過


  --'
