url: https://www.ptt.cc/bbs/movie/M.1742289113.A.D05.html
title: '[新聞]《奪魂鋸》第11集不拍了？編劇證實：製片人爆發內鬥、該系列恐面臨腰斬'
content: "新聞網址：\n\n原標題:\n\n\nJoker 2025-03-18 10:35:23\n\n\n票房長紅超過 20 多年的《奪魂鋸》（Saw）系列，直到兩年前的第\
  \ 10 集《奪魂鋸X》（\nSaw X）全球都還能賣出 1.25 億美元的佳績，這讓獅門影業沒過多久就緊接著宣告繼續\n籌拍第 11 集。然而，原本進展順利的第\
  \ 11 集，後來卻突然將檔期延後一整年，從去年\n九月底延到年九月底，現在更是完全沒有要開拍的動靜，幕後顯然是碰到了某些困難。\n\n\n而第 11 集碰到的困難，似乎也終於露出了一點端倪。專門推廣恐怖作品的網站《\n\
  Bloody Disgusting》聲稱，\n\n\n\n\n\n消息來源亦提到，獅門內部沒人能調解這場紛爭，且最終恐將導致《奪魂鋸》系列出售給\n其它片廠重啟。\n\
  \n\n《奪魂鋸》第 6、7、10 集的導演-凱文格魯特（Kevin Greutert）本來會繼續執導第\n 11 集，第 4、5、6、7 集的編劇檔 — 派屈克梅爾頓（Patrick\
  \ Melton）、馬可斯鄧斯\n坦（Marcus Dunstan） 則會繼續撰寫劇本，而\n\n\n\n\n梅爾頓還預告，第 11 集的劇情和第 6 集有點近似，都和社會議題有連結，「拼圖殺人\n\
  魔」約翰克雷默將會替遭遇不公的民眾出氣。\n\n\n--"
