url: https://www.ptt.cc/bbs/movie/M.1510408864.A.77B.html
title: '[普雷] 有些失望的奪魂鋸：遊戲重啟'
content: '想當年還去電影院看了奪魂鋸6跟7 那時候的震撼到現在還餘悸猶存


  一轉眼已經過了7年了 不知道是我老了還是怎麼 總覺得看完都沒有害怕的感覺


  與其說是奪魂鋸8 不如說是奪魂鋸外傳 還比較貼切 這樣想就比較不會那麼失望了


  血腥程度不怎麼高 嚇人的地方也很少 比較偏向劇情片 (我認為啦)



  ～以下有雷～
























  剛開始的第一關 就是預告內演的鐵鍊栓桶子頭



  看得時候我還很疑惑 為什麼最邊邊的男子都沒反應 (放棄治療?)


  後面才知道 哦 可能是藥劑太重 醒得太晚才會這樣


  當時沒拍到被鋸成很多段的樣子也覺得很可惜 我想看噴血啊 QQ


  再來緊接著就是第二關上吊的


  要讓曾經的小偷(兼殺人)自首 選擇一個正確的針筒插下去


  演到這邊我就覺得有點弱掉了 跟以前的感覺好不一樣


  以往的奪魂鋸大概就是通關之後便能重生


  除了第6集的保險員(沒記錯的話?)是一直闖關


  不過他是選擇要不要犧牲自己幫助那些人


  感覺又是不一樣了 這部就是那5位 淘汰1位 剩下4位 又淘汰一位 直到剩下最後一人


  第三關 一定會有個衰鬼去開不能開的門 腳就被鐵絲纏住 直到拉下把手才能解脫


  第四關 進入一間小小房間 上面會一直有稻穀掉下來活埋他們


  除非第三關的人願意救他們 稻穀填滿大約到脖子之後 開始有凶器飛下來 XD


  看到的時候覺得有點好笑 有點假 而且凶器都不會剛好丟到要害也很厲害


  很期待看會不會掉個耙子剛好插在腦袋上 可惜沒有


  最後第三關的男子良心發現拉了把手 也讓第四關過關了


  第五關是黑人男的考驗 跟他以前害死人一樣 看要不要拉了手煞車


  他的機關很酷 可是我看不懂 只有看到瘋狂再轉轉的紅色圈圈 然後他的手好像被削到


  另外一個倖存女有幫助他 可惜效果不大 最後還是被機關殺死


  這個機關真的很帥 竟然不給他更多特寫 眨個眼睛就死掉了


  我連怎麼死都沒有看清楚 看這邊記得要睜大眼睛不然會錯過**


  第六關 倖存者兩位各自被栓在房間一邊 中間一把槍 看他們怎麼決定


  可惜那女的前面很聰明 後面就傻了被自殺 也害了萊恩要陪葬 (幫萊恩QQ)



  這集的劇情線 有開始娓娓道來關於十年前死去的約翰的故事


  以及約翰培養繼承人 一起研究新機關的故事


  ( os.約翰到底是培養幾個啊 怎感覺每集都有新的接班人蹦出來orz)


  第五關開始連結到十年前的故事 當時也是有五位人被抓來玩一樣的遊戲


  我的疑問就來了 即使看完電影還是覺得時間軸搞得我好混亂


  他們是說 十年前有五位人被抓來玩 一樣死了三個 最後兩個也死了 被埋在地板下


  就是安娜跟萊恩 有掀開地板看見他們的骨頭 (可證明 萊恩&安娜是死於十年前)


  那這次玩遊戲 只找了三位 剩下的兩位就是主角跟哈洛蘭警官


  死掉那三位應該就是 被吊在樹上1號 被假裝跳樓2號 以及女驗屍官工作室的3號


  所以前面拍的闖關的那五位到底是十年前的 還是現在這次的玩家啊？


  如果說是十年前死掉的 那屍體怎還這麼新鮮的可以血紅紅被跳樓


  啊那如果是這次玩遊戲死的三個人 那第一關最旁邊的男子不是主角又是誰？


  那麼那三位如果不是拍出來的那三個人 那是哪三個 怎麼被解剖的屍體跟拍出來的同個人


  劇情可能寫得很不錯 有跟前幾集有個照應 可是時間軸真的搞得我很混亂 看不懂


  最後面 哈洛蘭跟主角玩的遊戲 說明這次只有找三個人玩遊戲 (+女驗屍官)


  我覺得女驗屍官好像沒玩到遊戲 還是我又錯過什麼 只有看到他們兩個玩遊戲


  ( 那三具屍體到底又是誰 更疑惑 囧 )



  結局就跟第一集差不多 一樣是關上門 只差沒說出那句台詞 壞人也差不多死光


  用雷射切割機開花那邊真是超帥 讓我想到章魚 沒想到主角被開花是假的 juke到我了


  但是這樣對待一個使你這麼怨恨的人 好像又太過仁慈 至少也要先折磨一下吧 XD


  這集的血腥度 真的比起前幾集少了很多很多 屍體也少了很多很多


  機關的創意度也很少 因為玩遊戲的總共也不到十位 讓我很失望


  來電影院看這個就是要看大噴血 狂死人啊 結果都沒有 QQ 看了也是覺得亂亂


  可能是我領悟力比較低 有望大家指教 還是覺得6跟7 好看很多 比較噁爛!!!




  總結： 裡面玩的遊戲通通都在預告片裡面了 難怪預告片只拍這樣


  如果想去看虐殺的人 可以省下這筆 不然會跟我一樣失望


  但如果是想了解約翰&機關&如何挑選接班人的話 可以考慮去看


  ( 文筆不好 很少發文 邏輯有點亂 請別介意 QQ )



  --'
