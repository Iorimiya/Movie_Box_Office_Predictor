url: https://www.ptt.cc/bbs/movie/M.1491475581.A.F33.html
title: '[好雷]奪魂鋸3-神機妙算還是得死啊'
content: "大家好\n我是專看恐怖片的LittleDiDi\n我又來介紹恐怖片啦\n這次是來繼續假期前開的專題\ndou-zou\n\nBlog圖文版會更精彩\n\
  \n\n\n年份：2006\n\n國別：美國\n\n類型：懸疑、驚悚、殺人魔\n\n導演：Darren Lynn Bousman\n\n[劇情簡介]\n\n當警方正企圖逮捕拼圖殺人狂歸案之際，女醫生蓮恩戴倫（貝海兒舒米克\
  \ 飾）卻未警覺\n自己將成為下個死亡遊戲的目標。某晚當蓮恩從醫院下班時，慘遭拼圖殺人狂（托賓貝爾\n 飾）綁架，她醒來時發現自己被綑綁在一間廢棄的空屋裡頭，除此之外還有另外一名被\n\
  害男子傑夫（安格斯麥菲恩 飾）；此時拼圖殺人狂已經面臨瀕死邊緣，蓮恩被告知她必\n須讓拼圖殺人狂活下去，否則她和傑夫必須得死，在拼圖殺人狂微弱心跳限時內，心急如\n\
  焚的蓮恩設法讓拼圖殺人狂存活，但她萬萬沒想到，拼圖殺人狂暗地裡其實還有更可怕的\n殺人計畫……。\n\n\n雖然最近小弟的創作節奏也跟著連續假期放鬆一下，不過既然講好了，今天就繼續來進行\n\
  《奪魂鋸》專題。\n\n《奪魂鋸3》對於整個系列來說是一個很重要的分水嶺，就我之前所分，溫子仁開創的OP\n首部曲不算的話，本作應該稱得上是最精彩的一集。這次依舊由《奪魂鋸2》導演Darren\n\
  Lynn Bousman與金牌編劇Leigh Whannell合作，更找來溫子仁回鍋助拳，讓劇本更趨完善\n，會如此認真看待這集並不難理解，若是有看過整個系列作的話，會感覺當初應該是想跟\n\
  流行演個三部曲就收工，至於為什麼後來又跑出來四五六七集，導演跟編劇都換過一輪，\n變成影集還是本土鄉土劇動輒上百集長壽一樣，絕對是商業考量，就像《絕命終結站》，\n\
  每次出續集都說不看好，卻每一集都賣得嚇嚇叫。\n\n因此，聽說今年要出《奪魂鋸8》，我只能說不期不待不受傷害 。\n\n先來個前情提要好談下去，我先假設各位有看過前兩集，怕被雷麻煩自行注意。在上一集\n\
  中揭露了阿曼達是「Jigsaw」約翰的門徒，她因為通過了試煉改變自我並且成為金牌打手\n，而除了開頭的炸彈魔，「Jigsaw」則繼續惡搞警方三本柱，混蛋警探Matthews在《奪魂\n\
  鋸2》已經被設局成功被逮，女警探Kerry在本集也跟著遭殃，至於黑人Rigg相信早晚也會\n找他來玩（事後也證明如此）。至於為什麼「Jigsaw」這麼堅持中意他們，我想這就跟劇\n\
  中警方的無能程度一樣，不用考慮太多了。\n\n同樣無解的就是忠誠到嚇死寶寶了的阿曼達，這次她為了幫約翰延年益壽，綁來了擁有精\n湛手藝的外科醫生Lynn，但是她似乎也因為與老公有嫌隙而雀屏中選，為了正增向她醫治\n\
  約翰的決心，最好的方法就是命繫同一線，她的頭上被套了個炸彈裝置，引爆的開關與約\n翰的心跳同步。另一方面，隔壁的房間則繼續進行試驗，受試者是一個叫Jeff的父親，他\n\
  的兒子則是在一場車禍中喪生，這次，他要連續為了不願出面透露事實的女目擊者、輕判\n的法官與肇事的年輕大學生，抉擇在人命還是復仇。\n\n講了一堆，我來簡單幫各位重點整理，《奪魂鋸3》對整個系列的意義，除了繼續超展開\n\
  劇情，補足解釋約翰成為「Jigsaw」的理念動機，也講了他想延緩絕症交代後事的現在與\n未來展望，從表面上看來，阿曼達無疑是約翰最佳接班人選，而她自己似乎也很享受這樣\n\
  非法制裁的角色，但真的是這樣嗎?另一方面，這麼多外科醫生，為什麼偏偏找來房事不\n順的Lynn，另外Jeff這傢伙何方神聖，讓約翰人都要死了，還不忘繼續他的闖關遊戲。\n\
  \n最後所有支線精彩匯聚，《奪魂鋸3》同樣不僅不砸招牌，更稱得上本系列之最，結局意\n外性依舊不俗，不過說真的，再怎麼捧，你覺得《奪魂鋸》的劇情是能多精彩，講得東西\n\
  是能多有內涵，能跟《刺激1995》比嗎?不可能嘛，所以我們還是將重點放在賣點機關遊\n戲上會比較實際。\n\n這次的遊戲主軸的闖關模式也算是新模式，那就是「我闖關你遭殃」。讓我們來回顧一下\n\
  ，《奪魂鋸》屬於生死格鬥單挑型，《奪魂鋸2》是密室逃脫合作模式型，《奪魂鋸3》則\n是由一人闖天關，決定別人生殺大權的模式。可以發現，接下來的系列作不外乎就這三種\n\
  遊戲模式，其中生死格鬥變成片頭的開胃菜，密室逃脫會再現於《奪魂鋸5》，但我認為\n效果不好，至於其他幾乎都是一人闖關，本作發想的重要性可見一斑。\n\n有人可能會認為，比起以往遊戲者失敗就喪命，本作發展出這樣讓一個人去決定別人的死\n\
  活的遊戲模式，未免也太便宜這個遊戲者。確實，這樣的遊戲者的確不用太為自己的性命\n擔心，但折磨程度也沒好到哪去，畢竟讓一個人看見你的真面目，他處與生死存亡之際，\n\
  然後經常上演眼睜睜看著他死、他眼睜睜看著你讓他死，這樣決定別人生死的壓力何其大\n，各位可以自己想像。\n\n這邊我先問問大家對於系列很血腥的印象來自於何?說真格的，《奪魂鋸》與《奪魂鋸2》\n\
  對血腥片來說一點也稱不上血腥，然而我認為，真正的重口味應該要屬從《奪魂鋸3》開\n始，幾個機關的殘虐指數都不低，有畫面的就人體開腔活剝，沒畫面的就弄一堆勾在皮肉\n\
  上藕斷絲連的環，光聽演員連呼吸都覺得痛，甚者既有畫面又有想像的人體扭蛋，疼痛指\n數真的是不下於古代酷刑五馬分屍啊。\n\n至於其中有個差點被豬肉豆腐乳淹沒的法官，則是以噁心，但真的稱得上血腥殘虐，莫過\n\
  於全程直播的開腦手術吧，逼真得若沒說服自己那是假的，實在是令人不忍直視，尤其是\n那個電鋸拿來在頭蓋骨上尖銳的運轉聲，莫名的頭皮都毛毛的。因此，殺人魔的養成首要\n\
  來自於無動於衷的對人動刀，因此，怎麼的職業族群最適合發展成殺人魔......嘿嘿嘿\n......我什麼都沒說喔。\n\n由於我認為正宗的《奪魂鋸》應該到這就該完美收尾，後面幾部大概都是延伸(山寨)之作\n\
  ，所以這邊就來總結一下，我認為這個題材之所以為人津津樂道的幾個特色。第一當然就\n是「裝~~機~~關~~」(記得要配合韋小寶抓鰲拜的調調)，有別於一般虐殺片慢條斯理的割肉凌遲，\n\
  「Jigsaw」的虐殺是建立在時間與道具上的心理壓力，痛楚往往只是其次。第二則是「I\nwant to play a game」，這遊戲沒那麼簡單，在這三集發展出的模式都很一絕，各種心\n\
  機與線索細節，還小有推理的成分。第三則是劇情與結局意外性，當初看時沒想到，SAW\n系列可不是單純的殺人魔一直無聊抓人來虐殺這麼簡單，充滿佈局與巧思。最後則是社會\n\
  性，這個殺人魔不太一樣，「Jigsaw」要殺你是會跟你講道理的，而且一定會讓你有機會\n逃脫(正常來說的話)，雖然有點狗扯淡，最好有人會因為逃過一劫被你教化，然後還因此\n\
  變成的你的走狗，神邏輯，換作......不是我......任何人，不打爆你的頭才怪。\n\n總之，《奪魂鋸》開創了殺人魔新格局，好劇，不看嗎?\n\n\n即刻短評(滿分5)\n\
  \n劇情： 4   >>至少在殺人魔類型電影來說算很有內容了，但，它還是殺人魔電影\n結局： 4   >>原來這一切都是為了......Jigsaw神機妙算的有點離譜\n\
  血腥： 5   >>稱得上系列血腥之最，光開腦手術就夠嗆了\n氣氛： 3   >>一人游戲模式雖然多了點倡導放下仇恨的意味，但不免緊張度就降低許多\n推薦： 5\
  \   >>攻略本系列不得不看的結尾作\n\n\n\n\n--\n\n\n\n\n歡迎參觀我的部落格\n\n\n--"
