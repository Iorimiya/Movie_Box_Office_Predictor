url: https://www.ptt.cc/bbs/movie/M.1510586086.A.D8F.html
title: '[好雷] 奪魂鋸:遊戲重啟-經典是否延續？'
content: '雖然我不是奪魂鋸系列的忠實影迷，但是第一集在我心中的確是部經典。

  而且我老婆很愛這系列，每次上映時都有去看。有的人喜歡電影中的變態遊戲

  與精巧機關，有人喜歡其殘忍與血腥，有的人喜歡那種不寒而慄的懸疑氛圍。

  至於這一集呢，我覺得雖然無法撼動第一集的經典地位，但是也替已經陳舊的

  奪魂鋸系列開啟了一條新的道路。



  以下防雷。






















  說起第一集的經典，我覺得有兩個畫面在我腦中揮之不去。

  一個是高登鋸斷自己腳的那段，另一個是約翰從地上站起來的那段。

  而後續的續集，多淪為補完、與賣弄死法與死狀。

  而且最後的奪魂鋸3D更是被我老婆罵到不行。


  而這次奪魂鋸:遊戲重啟呢？先說缺點，我看完後總覺得差了一點：

  要血腥也不到位（除了第一句屍體讓我覺得重口味），

  要刻畫「玩者們」的心境也不夠深刻，要懸疑也覺得轉折太過牽強了些......

  那我給好評的原因是什麼？


  其實從第一幕開始的飛車追逐，就讓我覺得這次是新世代的奪魂鋸了——

  這次導演的確為奪魂鋸帶來了不同的味道。

  遊戲的第一關，鐵桶頭被圓鋸鋸死那幕被運境快速帶過，

  的確是讓我覺得不太對勁（當下想說是伏筆、還是口味變那麼多？），

  而且後來屍體的臉部整個被刻意鋸掉然後刻意被人發現，

  以前幾集從來沒有如這集般那麼像懸疑的連續殺人魔電影。

  （題外話：聽說雪人不會在台灣上映了，有點傷心。）


  一開始有點失望，覺得經典沒能延續；但再想想，如果能拋棄舊有的框架，

  重新詮釋奪魂鋸這個名詞的意義呢？

  就重開機的角度來看，我覺得也許這部會是個新世代奪魂鋸的開端。


  況且有些場景與劇情還是有跟舊系列致敬。像是被複製的殺人機關，

  跟羅根親自參與殺人遊戲（但似乎用意不是在觀察，而只是單純的設計人？）。

  而且時間線的交錯，讓人到最後一刻才能把所有的拼圖拼起來，

  也的確算是巧妙（但刻意）的安排。


  整體來說，滿分十分的話我只會給六分左右，因為許多粗糙的瑕疵扣了一些成績。

  但是，也許奪魂鋸系列能因此而獲得新的生命？

  也許這只能交給票房來決定了......


  但我個人是有點期待接下來劇情發展就是了。



  --'
