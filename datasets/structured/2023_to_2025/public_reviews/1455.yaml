title: '[討論] 奪魂鋸3D之前 1~6集你複習好了嗎?'
content: "為了迎接奪魂鋸3D的到來 前兩天我複習了1~6集\n連看的心得就是 好看好看太好看呀~!!!\n很多前後呼應的地方和小細節 搭配精華區反覆地看\n\
  也促使我寫下這篇 大家當作複習看看吧:)\n我想這系列難以釐清的就是：錄音帶Player的數量...多到一個不行XD\n以下如果哪裡有錯請不吝指教 我再來修文\
  \ 謝謝\n\n\n    \n\n\n衝不出過於密集的鐵絲網，傷重而死\n\n蠟燭引燃身上的易燃物，燒死\n\n被Amanda用小刀剖肚拿鑰匙，傷重而死\n\n\
  腳碰到細線引發機關，被槍射死\n\n與Zep扭打的過程中，被Zep射殺\n\n被Adam用馬桶水箱的蓋子打死\n\n\n\n鋸斷右小腿爬走\n\n被Gordon醫生射傷手臂，被John(JigSaw)關在浴室\n\
  \n\n沒被抓去玩遊戲，超幸運\n\nTapp警探和Sing警探發現被布蓋著的老人Jeff，後來Sing被槍射死，\n         Tapp被割喉，Tapp最後被救，老人Jeff應該也同時獲救\n\
  \n\nAlison掙脫繩縛，剪刀刺傷Zep，Tapp警探前來搭救中趁亂逃走\n\n假扮死屍，說Game Over關門\n\n\n\n\n\n不敢挖眼珠拿鑰匙，被補蠅草面具夾頭而死\n\
