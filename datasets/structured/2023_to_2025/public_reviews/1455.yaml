title: '[好雷]奪魂鋸8'
content: "電腦鍵盤壞了懶得買\n  為了po這文特地用手機發文\n\n  看完電影回來趁著記憶猶新抒發一下感想\n  以系列作全部 對我來說\n  排名是1\
  \ 7 8 2 其他\n  能排到第三名算ok了 是部中規中矩 不犯錯又賣粉絲面子的續集\n\n  以下開始有雷\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n  第一集是公認經典不說\n  第七集的高登醫生\n  第二集的雙時間軸都讓人印象深刻\n\n  這一集同時致敬了雙時間軸跟假死這兩個題材\n\
  \  雖然雙時間 在我看到女法醫說這機關是最早的遊戲 那時候就猜到了\n  但還是萬萬猜不到最後的羅根從地上站起來\n  那時候真的有感動到\n  在第一關的考驗\
  \ 還沒睡醒的羅根來不及做出反應就被捲到底了\n  當時我心裏就有莫名的違和感 說不出哪裡怪怪的\n  後來細想 對吼 作為一部血漿片 哪有不把慘死演出來的道理\n\
  \  但後面的劇情牽引讓我忽略了這間事情\n  看到John開鬼步救下羅根的時候我也覺得合情合理\n  畢竟人家連你要考驗三小都沒聽到(睡死了)\n  退迷藥的時間沒算準是John的疏忽\
  \ 畢竟是第一場遊戲咩\n  於是羅根成為了John的機關師(？)\n  但他也有自己的信念\n  不像John那樣的高尚 也不像阿曼達那樣的魯蛇\n  也不像豺狼般的霍夫曼\n\
  \  他認同John的理想 但是面對間接害死無辜小孩 甚至自己妻子的兇手\n  他選擇的是幫死者發聲 這邊又一語雙關\n  他發聲的是John 還是他老婆及其他冤死者\n\
  \  這點也許他跟我們這些凡人都更接近\n\n--\n身為經典之作的被害人\n把當初自己鋸腿的鋸子踢開 說 想都別想\n最後終於輪到他拉鐵門 喊出game over!\n\
  怎麼能不感動呢"
