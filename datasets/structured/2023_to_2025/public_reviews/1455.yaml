url: https://www.ptt.cc/bbs/movie/M.1618501087.A.605.html
title: '[新聞] 《奪魂鋸》回歸延續神話！不只血腥還大玩燒腦'
content: "《奪魂鋸》回歸延續神話！不只血腥還大玩燒腦\n\n2021/04/15 14:14\n\n\n克里斯洛克除了演出《死亡漩渦：奪魂鋸新遊戲》，並加入監製行列。\n\
  （CATCHPLAY提供）\n\n〔記者許世穎／綜合報導〕風靡全球影迷十餘年的虐殺恐怖片《奪魂鋸》系列推出新作《\n死亡漩渦：奪魂鋸新遊戲》，找來喜劇演員克里斯洛克演出並加入監製行列，導演戴倫連\n\
  恩布斯曼大讚克里斯為電影注入新巧思，讓故事不只血腥，還多了燒腦懸疑。\n\n該片除了執導《奪魂鋸》系列第2到4集的導演戴倫連恩布斯曼回鍋執導，概念始祖溫子仁\n\
  也回鍋擔任監製。故事聚焦在克里斯飾演的班克斯警探，描述他所任職的警局遭到疑似「\n拼圖殺人魔」的連環殺手鎖定，隨著身邊的員警一個個離奇失蹤慘死，他也必須在自己淪\n\
  為下一場虐殺遊戲的玩家之前揪出兇手。\n\n\n《死亡漩渦：奪魂鋸新遊戲》台灣版海報。（CATCHPLAY提供）\n\n電影的台版海報今也曝光，從圖中可看出有別於以往強調斷手斷腳的血腥風格，改以犯案\n\
  現場和兇手留下的死亡漩渦記號營造懸疑驚悚感，開啟《奪魂鋸》系列新篇章。導演也透\n露克里斯想走懸疑驚悚路線，提出許多詳盡又縝密的想法，「我們希望電影的氛圍看起來\n\
  更像是《火線追緝令》，同時又能延續《奪魂鋸》的神話。」\n\n此外，導演也保證該有的血漿不會少，但絕對會巧妙運用、不隨便賣弄血腥，「血腥暴力\n不再只是噱頭，而是為了服務故事的推進，這次會加重著墨人物、緊張感和恐懼感。」《\n\
  死亡漩渦：奪魂鋸新遊戲》將於5月14日在台上映。\n\n--\n、。帝釋所問經講記77頁拆穿佛法的。\n是 是菩薩成佛之道\n、、、、()、、是佛經。\n  是佛\
  \          是菩薩\n\n和破十方諸佛\n\n--"
