title: '[普雷] 奪魂鋸 IV'
content: "目前˙在二輪上映中 應該還是需要防雷頁 的吧?\n\n\n\n\n\n正文開始\n\n我個人並不愛好血腥暴力的場景 所以對於片中多種 [道具]\
  \ 不與置評\n奪魂鋸 IV 大體來說像是把一到三的劇情做一個統結 順便為了以後的劇情鋪路\n所以 穿插了很多一到三的支線劇情 如果除去支線不談 主線也是很令人回味\n\
  從原文的對話反覆地省思就可以得到很多線索\nex\nJigsaw 給 Detective Rigg 一開始的錄音帶就說了\n\nOfficer Rigg. Their\
  \ lives hang in the balance of your obsession(執念).\nWill you learn how to \nThe\
  \ choice is yours.\n\nie:如果你學會放手 他們就會真正得救\n\n---------------------------------------------------------------------------\n\
  之後遇到一個蓋豬頭面具的犯罪女 錄音帶說\nYour obsession tells you to save the victim.\n.\nThe choice\
  \ is yours\n\n如果Rigg 不碰豬頭面具 機關不會啟動 那女的不會受傷(頭皮撕裂)\n被救之後也不會為了怕被關而試圖殺害Rigg 也不會導致她最後的死亡(被Rigg殺)\n\
  \nie.如果Rigg不管 這個女的最多就是一直被綁在椅子上鬼吼鬼叫的 一點事都沒有\n(就告訴你走開就好啦~不就沒事了 不聽錄音帶言吃虧在眼前)\n\n--------------------------------------------------------------------------\n\
  Ivan-有性虐待狂的胖子說:just let me go, OK? (回應主題,雖然不是Jigsaw說的)\n\n但是Rigg還是繼續下去 去隔壁房間發現他的罪行\
  \ 使得自身情緒充滿憤怒\n決定根據錄音帶指示讓他自己面對選擇  也獲得如何去救 Eric Mathews 的下一步提示\n胖子就這樣被五馬分屍了.....(沒有勇氣弄瞎他另外一隻眼)\n\
  \n紙條:come back to where it began (他執念的開始:不論如何想救被家暴的小女孩)\n\n--------------------------------------------------------------------------\n\
  去一開始的警局(已被廢棄?)遇到被鐵條穿過的夫妻倆\n錄音帶說:\nOnce judgement has been made though, the key to\
  \ finding \n\n後來Rigg在圖後面找到的紙條上面寫了甚麼呢? 不就是o home 嗎?\n\n意思就是叫Rigg快點回家 但是Rigg的執念讓他繼續追查\n\
  也從不一樣的G字找到兩位警探被關所在的建築物(Gideon)(刀和刑具的皮帶上亦有G字)\n最終一如Jigsaw預期的導致 Eric Mathews 死亡 (被大冰塊爆頭)\n\
  也如一開始Rigg拿到兩把鑰匙紙條寫的:一把救人 另一把鑰匙卻奪人性命\n                                     \n--------------------------------------------------------------------------\n\
  Final test\n紙條寫著:Time is on your side!\n(時間是站在你這邊的 or 也可誤解成倒數的時鐘在你旁邊 時間快到囉 快救他們吧!)\n\
  \nTheir salvation was out of your hands.  <--他們不用靠你救\nTime was on your side, but\
  \ your obsession wouldn't let you wait.\n\nYou failed your final test.\n\n--------------------------------------------------------------------------\n\
  另外對於兩個FBI探員也有同樣的警語  兩個黃皮紙袋上面寫著紅字跟他們說:\nOpen the door and you will find me\n\n打開門的確會發現Jigsaw\
  \ (不過是被Jeff斷頭過的)\n卻會被誤導成打開門就會找到本集真正兇手(幫助Jigsaw和Amanda搬凱利的第三人)\n讓Agent Strahm 開門\
  \ 看到拿著槍的 Jeff 就毫不遲疑地開槍(殺了他?)\n\nyou are in danger of getting too close, \n\n一般而言\
  \ 上面的話會誤以為是兇手在警告警探不要繼續追查\n但是其實Jigsaw要說的是:東西會爆炸 該站後面一點 被炸到不管嘿\n\n後來在建築物裡找到的那個娃娃錄音帶對Agent\
  \ Perez說(女的FBI)\n  你的伙伴即將殺害一個無辜的人(saw III 裡面的Jeff)\n  你要阻止他\n  your next clue is\
  \ critical (不知道有沒有聽錯)\n                    critical 可解釋成關鍵的 or 致命的\n           \
  \                   ==>所以娃娃就爆炸了....hahahaha\n-------------------------------------------------------------------------\n\
  不可免俗地 Saw IV留了很多伏筆\nex. 1. Hoffman甚麼時候加入這個遊戲的?(奪三的時候就埋了這個梗) and WHY?\n    2. Jigsaw又要\
  \ Hoffman 玩甚麼遊戲?\n \n    3. Hoffman 給 Amanda 的信裡到底寫了些甚麼?\n\n另 關於電影的疑問\n    1. 為何剛好\
  \ Rigg 和 Strahm 不會走錯路? 天知道他們兩個誰會穿過那道門?\n    2. 萬一 Eric Mathews 從冰上跳下 不就沒得玩了? (會被知道高壓電沒作用)\n\
  \nANS: SAW V and SAW VI and SAW.....endless\n-------------------------------------------------------------------------\n\
  最後 我想觀眾應該都同意 Eric Mathews 的話\n\n\n\n\n\nI don't want to play anymore       快給我個結局吧....\n\
  \n\n\n\n--\n◆ From: 220.131.227.31"
