title: '[討論] 奪魂鋸X 最後的遊戲不合理（雷）'
content: '----防雷---
















  首先，最後的遊戲是雙層計謀

  我要強調毒氣室是沒什麼問題的

  但的設計讓人想不透

  約翰原本的計畫應該是

  如果賽希莉亞和帕克沒有機會反過來控制約翰跟阿曼達

  按原定計畫這兩人會玩血刑蹺蹺板，

  原因是帕克在毒氣室也有問賽希莉亞：

  這點也證實了這一點；刑


  如果他們玩完，也不會再讓他們去玩毒氣室了，因為那不符合奪魂鋸的精神


  ，就引導他們進入毒氣室去玩另一個自相殘殺的遊戲


  但是賽希莉亞跟帕克真的沒打算玩，踩進了約翰的下一個圈套，玩血刑蹺蹺板的變成約翰

  與小男孩


  接下來我們來看血刑蹺蹺板的玩法，其實不複雜，首先蹺蹺板兩頭躺著的人都會被血洗，

  直到其中有人去拉扳手，蹺蹺板會往拉扳手的那一方傾斜，所有的血也都會往拉扳手那一方的人臉上狂噴


  約翰和小男孩會主動去拉扳手

  是因為這兩人都有良知，不願意傷害對方

  約翰不想讓小男孩受苦，在一開始叫小男孩“”扳手，甚至犧牲已經受病痛折磨的

  自己去讓血狂噴


  但如果讓賽希莉亞與帕克、或是全奪魂鋸系列被懲罰的那些自私的敗類、人渣任選兩人來

  玩這個遊戲，正常會遇到的狀況是



  以上2點是不可能的，

  至少奪魂鋸裡的敗類不可能

  那扳手的設計意義又何在？


  不曉得大家能不能理解我的意思呢，總之我認為這個遊戲設計的不合人性...是否我漏看

  了什麼台詞或沒注意到約翰的哪一項思考，而不是遊戲設計的缺陷？有沒有人能夠解釋一

  下疑惑？


  --'
