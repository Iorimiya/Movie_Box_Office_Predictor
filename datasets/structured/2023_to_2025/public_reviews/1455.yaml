title: '[討論] 奪魂鋸：遊戲重啟（好雷'
content: '前幾集都有看，給個好雷。







  先從徒弟與老師的遊戲比較一下吧。


  徒弟啊，你不能只學到殺人那套啊！還有那句「犧牲才能救贖啊！」


  劇情裡面沒有講到三個線民是怎樣死掉的，但是從最後一幕看起來？為死者發聲似乎是徒

  弟的核心價值？


  在十年前的遊戲中，在每一項遊戲裡面，總是會有得救的方法。


  1.  獻上鮮血

  2. 三選一的針頭

  3. 自己的腿

  4. 順利拉到煞車桿

  5. 自由的彈頭


  但是這個徒弟好像就只是要人坦白自己的罪刑，然後殺掉？一點都不給活命的機會。john

  不會採取殺掉另一方，自己就能救贖的方式啊。


  在來感覺在暗網裡面跟女助理講話的就是羅根本人@@ 因為只有他才有那個10年前未公開

  的螺旋攪拌機。


  劇情其實有很多牽強的地方。

  警探前往重大可疑刑案現場而不叫警力支援；全家就是你家，犯人什麼地方可以進出自由

  ；街上、醫院從來沒有監視器；john已經死亡是既定事實，照理說，應該要從血液樣本哪

  邊來的下手。一群人被玩得團團轉就覺得好氣又好笑......


  不過血腥程度還不錯、豬頭很可愛、女助理打扮後差好多。


  小小心得XD


  --'
