title: '[新聞] 演了20年  Tobin Bell繼續回歸奪魂鋸XI'
content: '新聞網址：


  原標題:




  2023 年 9 月《奪魂鋸X》正式上映，是該系列的第十部作品，為了能述說更多「約翰·

  克拉瑪／拼圖殺人狂」的故事，將劇情設定在《奪魂鋸》和《奪魂鋸2》之間。



  而




  而在《奪魂鋸X》大受好評之後，獅門娛樂也於 2023 年 12 月宣布 ，續集《奪魂鋸XI》

  正在製作當中。







  從 2004 年第一部《奪魂鋸》就開始飾演該角的托賓今年已 82 歲，飾演拼圖殺人狂這個

  角色超過 20 年，他希望恐怖電影可以像其他類型的電影一樣具有層次性，同時也認為：

  「粉絲在跟我聊《奪魂鋸》時都是在談論劇中對於道德的探討而非血腥、恐怖的情節。」



  《奪魂鋸XI》預計將在 2025 年 9 月正式上映，喜歡這個系列的讀者可以持續追蹤相關

  報導。


  --


  大家還會想看嗎???


  --'
