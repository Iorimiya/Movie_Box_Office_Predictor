  \n被Matthews警探痛毆\n\n\n\n被放在保險櫃內\n\n持續查案\n\n持續查案\n\n假扮受害者，說Game Over關門\n\n\n\n\n來不及扯完勾入身體的鐵環，被炸彈炸死\n\
  \n手先被酸液腐蝕，後被Amanda設置解不開的機關扯開胸腔的肋骨，肚破腸流而死\n\n在冷凍房裡被灑水凍僵而死\n\n從豬絞肉泥的滅頂危機中存活，\n   \
  \        但在肇事者那關被散彈槍射死\n\n四肢及頭部被扭轉機器扭斷而死\n\n被Amanda為減輕他的痛苦，用塑膠袋悶死(畫面在此集呈現)\n\n射傷Lynn被Jeff看到，被Jeff槍殺\n\
  \n被Jeff用圓盤電鋸割喉而死\n\n先被Amanda射傷，後因John的心電儀歸零，引發Lynn項圈上的炸彈爆炸而死\n\n\n\n用馬桶水箱蓋斷腳逃出浴室，與Amanda的扭打中被踢中斷腳處，\n\
