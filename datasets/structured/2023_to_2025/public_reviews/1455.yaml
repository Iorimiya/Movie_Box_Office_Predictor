title: '[新聞] 根本是「世堅奪魂鋸」？「恰吉」捲土重來'
content: "根本是「世堅奪魂鋸」？「恰吉」捲土重來\n\n2019-04-19 17:40 聯合報 記者陳建嘉╱即時報導\n\n千呼萬喚始出來！全新重啟的鬼娃電影「恰吉」今日公佈正式版預告，立刻引發網友熱烈\n\
  討論，預告中除向觀眾介紹新版恰吉娃娃：人工智慧機器人「好夥伴」(Buddi)可遠端控\n制智慧型居家產品、內建攝影機及感應器等多項高科技功能外，更揭露恰吉如何運用這些\n\
  功能，讓殺人手法更加充滿「創意」，讓台灣網友直呼「根本王世堅版「奪魂鋸」！」。\n而先前大搞神祕的鬼娃恰吉也終於在預告最後露出了真身，不僅看起來膚質變好、頭髮也\n\
  更加柔順，這個新造型也讓國外網友看完預告後幽默表示：「新版恰吉超像迷你版阿湯哥\n啊！」。「恰吉」(Child’s Play)將於6月21日與全美同步上映。\n\
  \n日前，原版「恰吉」配音布萊德杜瑞夫(Brad Dourif)宣布退出重啟版「恰吉」的配音工\n作，令不少系列作的影迷大感失望，誰將接棒替「鬼娃恰吉」這個經典恐怖角色配音，也\n\
  成為了前陣子最熱門的討論話題之一。就在日前，以「星際大戰」（Star Wars）系列「\n天行者路克」一角廣為人知的馬克漢彌爾(Mark Hamill)，突然在個人推特上親自宣佈自\n\
  己將為新版恰吉獻聲演出，立即在網路上投下一顆震撼彈！熟悉馬克漢彌爾的粉絲都知道\n，他不但是絕地武士，還是一流的聲優，他最為粉絲津津樂道、最具代表性的演出，就是\n\
  替DC相關系列作品中的「小丑」配音。在今日公佈的新預告中，恰吉在結尾的一句「晚安\n，安迪。」，語氣中的瘋癲與冷血感，盡顯馬克漢彌爾的配音功力，也讓重啟版「恰吉」\n\
  除了老影迷外，更能夠吸引年輕一代的新觀眾。「恰吉」將於6月21日與全美同步上映。\n\n--\n\n帝釋所問經講記77頁拆穿的。\n毗婆舍那講記(含法的醫療)說明如何修四念處增加智慧斷除所有煩惱。\n\
  \  PTMC 寂靜禪園\n、、、、()、、是。\n  是    是\n\n--"
