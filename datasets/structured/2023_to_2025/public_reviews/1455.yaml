title: '[贈票]《奪魂鋸9》ㄇㄉㄈㄎ地表最強嘴砲加入遊戲'
content: '奪你魂預告：



  老鳥警探（山繆傑克森 飾）帶領警探（克里斯洛克 飾）調查慘絕人寰的連續殺警案，關


  於「拼圖殺人魔」重出江湖的傳言，再度勾起所有人心中的恐懼。這次新的遊戲規則，似


  乎直衝著警察而來。每個命案現場留下的「死亡漩渦」，將把他們捲進難以抽身的血腥深


  淵之中……。



  活動辦法：


  推文留言分享「」，電影《死亡漩渦：奪魂鋸新遊戲》中，ㄇㄉㄈㄎ 地表最強嘴砲


  山繆傑克森登陸奪魂鋸宇宙！【一路以  打天下的嘴砲王VS整天說「」的殺人魔】究竟誰會奪得最後的勝利呢...



  各位！小編 want to play a game...今天要來聽聽看鄉民身邊聽到就超煩的口頭禪，趕快留言推文就有機會獲得《奪魂鋸9》電影交換券喔！


  範例1：「I want to play a game...今晚打摟？」


  範例2：「乾笑死！」


  範例3：「喔喔是喔。」


  範例4：「真假？」



  推文寫下「」小編懂有些口頭禪是要搭配朋友特別的表情和語調才


  能變得靠北，所以很歡迎各位哥姐多做描述，小編已經準備好要拿去對付平常有夠欠揍的


  彭油們啦～來來來留言，就有機會獲得《》電影交換券哦！



  截止留言，當天公布得獎名單！


  《》5/12 ㄇㄉㄈㄎ 快加入遊戲！



  --'
