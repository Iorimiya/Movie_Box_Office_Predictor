url: https://www.ptt.cc/bbs/movie/M.1162053630.A.38A.html
title: '[心得] 奪魂鋸一二三大匯整  翻盤篇(集集有雷)'
content: "SAW系列最令人讚賞的應該就是它翻盤的劇情了\n再整理一下它翻盤的內容以及前後呼應的內容\n看到最後又再注意到之前有多少前後呼應的地方才是令人激賞的部份啊\n\
  以下集集有爆雷\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nSAW I\n\n唯一的翻盤劇情也是最大爆點: 真正的拼圖殺人狂就是從頭到尾躺在房間中的約翰\n\
  \n呼應部份:\n1.拼圖殺人狂喜歡近距離欣賞測試過程\n2.拼圖殺人狂身罹重病，離死不遠。\n3.劇情中有帶到有一名叫約翰的病患患有前額葉腫瘤。\n4.解開亞當鎖鏈的鑰匙一開始就被丟在浴缸中了(現在才想起這或許就是亞當的遊戲)\n\
  5.賽普對著高登醫生說:\"這是規則...\"顯見它也在遊戲之中。\n\nSAW II\n翻盤劇情在於艾瑞克的兒子打從一開始就在工作室中，艾曼達是幫兇。\n\n\
  呼應部份:\n1.打從一開始約翰說\"你兒子現在應該在角落哭泣吧\"就暗示監視器內容是預錄的\n2.從頭到尾約翰都保證著艾瑞克兒子非常安全地待在某個地方...\n\
  3.艾曼達和艾瑞克之子整個故事中都較無出現中毒出血的症狀\n4.在拿出艾瑞克父子合照時，艾蔓達在沒看到照片的狀況下說:\"別告訴我那真是你爸爸\"\n  算是露餡的一句話表示她對整件事情知情。\n\
  5.在發現預錄播放影機之前，凱莉無法在監視器看到艾瑞克的身影，此外艾瑞克所看到的\n  景象其實黑人屍體已經腐爛，保險箱旁也有注射過針頭出現。\n6.一開始捕蠅草鐵面人中內容就有提到約翰請\"\
  助手\"將鑰匙放在右眼中，暗示有後繼者\n  的存在。\n7.當約翰被艾瑞克打成不成人形說著:Game Over!意即艾瑞克的遊戲結束，準備受死。\n\n呼應上集部份:\n\
  1.兩人逃入第一集的房間，開燈的那一刻還真是駭人...(很懷念也很震驚)\n2.艾蔓達在第一集中對於警官的訪問對於拼圖殺然狂的感想: He helps me......\n\
  \  (這個伏筆還真牽強)\n3.艾蔓達第二次參加約翰的遊戲!\n4.Game Over!\n\nSAW III\n劇情翻盤部份在於真正的考驗是給艾蔓達的，以及傑夫最終的試煉。\n\
  \n呼應部份:\n1.艾蔓達一開始便設計不可能贏的遊戲，顯見她並不適合作為約翰的適任者。\n2.約翰一開始的規則講解其實是講給艾蔓達聽的，不過我想不會有人在那時就猜出來...\n\
  3.約翰一再強調琳恩的生命與艾蔓達習習相關，甚至求她不要殺害琳恩。反正follow\n  John's rule準沒錯就是...\n4.劇情中一再透露艾蔓達的情緒不穩定性...間接暗示她最後會殺了琳恩(有點牽強)\n\
  5.約翰告訴艾蔓達選林恩作為治療醫生只是\"其中一個原因\"，另一個原一則是傑夫是琳恩\n  的丈夫，只要艾蔓達殺了琳恩，傑夫又會殺了艾蔓達。\n6.傑夫測驗中莫名其妙的子彈與槍\
  \  啥時要用?\n\n與前兩集呼應部份:\n1.一開始鏡頭從艾瑞克逃出房間開始，用瓷磚敲爛自己的腳逃出，卻被艾蔓達殺害。\n2.第一集的浴室打從一開始艾蔓達就已經是幫兇了，綁架亞當與高登的也是她。\n\
  3.約翰可以裝死躺在浴室中那麼久是因為打了可以讓心跳變慢的肌肉遲緩劑(?)...\n4.最後殺害亞當的其實是艾蔓達，因不忍他受苦用塑膠袋窒息悶死。\n\n\n\
  最後私心的一些感想:\n\n血腥程度: 3>>2>1\n推薦程度: 1>3>2\n翻盤程度: 1>2>3\n\n第三集當我看到約翰說有東西叫艾蔓達看，再從過去兩集的邏輯思考就猜出這個試驗其實\n\
  是要留給艾蔓達的了...第二集雖然整體表現較差，可是翻盤的部份:錄影帶、後繼者真的\n還是非常令人shock的...\n不過第三集最後在傑夫身上再翻盤一次也還算是頗有意思的啦\n\
  雖然逆轉程度沒有前兩集傑出  整體劇情結構算是非常完整的佳片了\n\n還有我覺艾蔓達的造型第二集最好看  比較有活力...這集看起來有點糙老\n最後很惋惜的是凱莉就這樣被艾蔓達殺了，攝影機的引開注意力我很喜歡\n\
  對凱莉沒太多感覺但她好歹也是貫串三集的人物之一，解不開而死也就算了，居然是死在\n沒有勝算的遊戲之下...\n\n還有第三集的機關設計，幾乎都是空空大房間裡一個人，多半是全身都被什麼東西給固定\n\
  住，而且絕大部份還裸身(爆)  看來看去機關都快變成一個樣了XD\n從只玩頭部後來玩到全身也真狠\n\n--\n算是整理告個段落了吧\n這篇跟上篇不一樣  這種東西只能用零碎的記憶和過去板友們的討論拼湊\n\
  所以有其他覺得是前後呼應或暗示的也來討論吧\n--\n\n--\n◆ From: 140.112.248.94"
