title: '[新聞]《奪魂鋸》不排除再拍第11集！製片人承認「太早賜死」拼圖殺人魔'
content: '新聞網址：


  原標題:



  2023-10-03 10:56:20



  現正熱映的《奪魂鋸》（Saw）第十集《奪魂鋸 X》（Saw X）對此系列的粉絲來說，特別

  顯得有懷舊感，因為這次不僅找回在第九集缺席的拼圖殺人魔「約翰克萊默」托賓貝爾（

  Tobin Bell）回鍋主演，劇情發生的時間點更設定在第一集與第二集之間，讓影迷得以一

  窺克萊默在第三集領便當前的更多故事。



  雖然克萊默老早就被賜死，但後續集數仍拼命透過回憶畫面、填補各種時間線的空白來不

  斷追加他的戲份，這讓不少觀眾覺得，若當初別那麼快賜死克萊默，每次安排他回歸就不

  必這麼大費周章。而抱有這種想法的也不只有觀眾，連該系列的製片人也這麼認為。



  共同監製《奪魂鋸》所有集數的馬克柏格（Mark Burg），在《IndieWire》最新刊出的專

  訪中坦言，




  至於未來是否還會有《奪魂鋸 11》，柏格則語帶保留地回答：






