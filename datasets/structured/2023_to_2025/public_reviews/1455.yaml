url: https://www.ptt.cc/bbs/movie/M.1696844907.A.831.html
title: '[好雷] 奪魂鋸X 略微遺憾的編排'
content: '雷文防雷資訊頁






  這部以情懷來說幾乎滿分，


  看到阿曼達真的很開心，


  也比某幾部有說服力多，


  第七集就因為冒充拼圖殺人遊戲的倖存者，


  連帶他那些愛人被虐殺，


  這部不只是有說服力，更有帶入感，


  能以約翰的角度去看受害者的心理，


  只不過遊戲編排上有點差勁，


  從女醫生被綁來之後，


  就大概知道有幾個人會玩遊戲了，


  至少有四個遊戲可以看…


  第一個要用線鋸斷腿，


  （心裡os）怎麼第一個就要斷腿，


  然後還要抽骨髓？？


  這把後面虐殺期待值真的拉高太多了！


  而且這樣還沒活成？


  後面開腦也是讓人把期待值再拉高一個等級，


  而且還有類似阿茲特克的神像？


  感覺下個遊戲或下下個遊戲應該跟心臟有關，


  回收一下伏筆，


  結果沒有，接下來就斷手斷腳…


  然後女醫生甚至反過來囚禁約翰，


  還虐待小男孩讓他上去玩，


  明知道會反轉但還是很心疼很緊張，


  結果最後反轉只有毒氣室，


  原本期待是把那兩個狗男女迷昏在那，


  帶到新遊戲的房間，


  玩更刺激的遊戲，結果就這樣？


  不過整體而言還不錯，


  因為是首次去電影院看奪魂鋸系列！



  （然後最後小抱怨一下，

  最後一排的外勞好吵，

  還會踢椅子開閃光自拍，

  超級沒有觀影水準的，

  不過不針對外勞，

  之前台灣人不論長幼也有素質差勁的）



  --'
