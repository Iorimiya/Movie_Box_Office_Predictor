url: https://www.ptt.cc/bbs/movie/M.1510278970.A.24B.html
title: '[新聞] 影史最賣座虐殺電影 《奪魂鋸:遊戲重啟》'
content: '新聞網址：


  睽違7年，由「金氏世界紀錄」首次認證為「影史最賣座系列」恐怖虐殺電影第8集《奪魂

  鋸：遊戲重啟》（Jigsaw），即將於本週五（10日）在台上映；由《奪魂鋸》（SAW）原班

  製作團隊創作的第8集，被粉絲譽為最讓人期待恐怖片續集，票房名導麥可斯派瑞格

  Michael Spierig說:『我們創造了與以往幾集都不同的《奪魂鋸》續集，除了死亡遊戲的

  再度創新，最特別的是不看到最後都不會知道真相的驚人結局，絕對會讓影迷過癮。』


  13年前，由鬼才導演溫子仁James Wan創造的經典恐怖電影《奪魂鋸》（SAW）在全球引起

  影迷瘋狂，雖然續集屢破票房佳績，但在影迷心中卻始終難以突破最經典的第1集，而由首

  集製作團隊創作的第8集《奪魂鋸：遊戲重啟》，則被視為最正宗回歸，不只故事劇情與第

  1集有相當的關連，血腥的虐殺手法與顫慄的死亡機關亦再度創新，而不到最後一刻都無法

  知道驚人結局的反轉劇情則更讓影迷大呼過癮，飾演拼圖殺人魔的好萊塢演員托賓貝爾

  Tobin Bell說:『《奪魂鋸》系列不只血腥虐殺讓影迷難忘，最特別的是他獨特的殺人法則

  ，「Jigsaw拼圖殺人魔」從來不主動殺人，而是設局讓獵物透過死亡遊戲，自己決定生或

  死，對於那些不尊重生命的人，他提供了一次讓你脫胎換骨的機會，但不到最後，你不會

  知道到底誰才是真正設局的人。』


  《奪魂鋸：遊戲重啟》描述已過世10年的「拼圖殺人魔Jigsaw」竟然再度犯案，究竟這是

  新的模仿犯，還是其實他根本沒死…驚奇的結局絕對讓觀眾震驚，而你若想知道究竟他為

  什麼要殺人以及獨特的殺人法則。


  --'
