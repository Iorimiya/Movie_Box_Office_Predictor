url: https://www.ptt.cc/bbs/movie/M.1510248178.A.667.html
title: '[好雷]剛剛終於把經典神片奪魂鋸1補完了 '
content: '這是我第一次在movie版發文


  我也不知道這種老片到底需不需要防雷


  總之先空白防雷吧



















  近日似乎有這系列的新片上映


  讓我在看youtube的時候剛好看到這系列的介紹影片


  於是就心血來潮想說把大家都很推的奪魂鋸1給補了吧



  由於這系列都已經有一堆續集了   我也多少在電視上看過一些片斷


  所以我早就知道約翰才是真兇


  只是我在看的時候仍然一直在想:"約翰究竟什麼時候才會登場?"


  我一直預期約翰應該會坐在監視螢幕後監視遊戲  可是當我看到畫面:


  "喔喔是監視螢幕  那個人是......诶诶泰普警探哪诶喜立阿?"


  "又是監視螢幕   這次總該是......啥?齊普?你誰阿?"


  我還一直在想  到底誰才是拼圖殺人魔的同夥?


  可是如果是同夥  為何警探和齊普後面幾集都沒看到?


  一直到最後亞當拿出齊普的錄音帶播放   BGM一下


  約翰站起來的那一刻  我才全身起雞皮疙瘩


  並告訴亞當   他逃出的希望早在他醒來那刻就不存在了


  配上亞當絕望的臉  這氣氛營造實在太到位了







  John:「Game over」




  真是太好看了  明天晚上我要買鹹酥雞邊看第二集了


  --'
