title: '[討論] 奪魂鋸 I~V 時間表'
content: "┌─┬─────────────────────────────────┬─┐\n│No│    事                     \
  \                                 件    │集│\n├─┼─────────────────────────────────┼─┤\n\
  │01│Hoffman 的妹妹被男友 Seth 殺死。                                  │ V│\n├─┼─────────────────────────────────┼─┤\n\
  │02│Addison 在診所外搭訕 John，被 John 趕走。後來在第二集玩八人遊戲。 │IV│\n├─┼─────────────────────────────────┼─┤\n\
  │03│Cecil 藉口外套沒拿進診所偷竊，開門時不小心害 Jill 流產。          │IV│\n├─┼─────────────────────────────────┼─┤\n\
  │04│John 與 Art 律師決裂。可能已發現 Art 幫助不好的委託人？           │IV│\n├─┼─────────────────────────────────┼─┤\n\
  │05│John 被 Gordon 醫師宣告得了前額葉腫瘤和癌症。                     │ I│\n├─┼─────────────────────────────────┼─┤\n\
  │06│John 多次嘗試自殺，卻沒死成，開始想測試人性。(和人體的極限)       │II│\n├─┼─────────────────────────────────┼─┤\n\
  │07│Cecil 通過 John 的第一個測試，但想殺 John 而跌入鐵刺網裡身亡。    │IV│\n├─┼─────────────────────────────────┼─┤\n\
  │08│Jill 因 Cecil 死亡找上 John，發現詭異設計圖。離開後玻璃棺材亮相。 │IV│\n├─┼─────────────────────────────────┼─┤\n\
  │09│John 進行了次數不明的測試遊戲，被稱為 JigSaw。                    │ I│\n├─┼─────────────────────────────────┼─┤\n\
  │10│Hoffman 假冒 JigSaw，利用「鐘擺巨斧」殺了 Seth，被 JigSaw 盯上。  │ V│\n├─┼─────────────────────────────────┼─┤\n\
  │11│Hoffman 通過獵槍測試，被迫選擇幫助 JigSaw，或讓 Seth 案真相曝光。 │ V│\n├─┼─────────────────────────────────┼─┤\n\
  │12│Paul 想自殺，卻被 JigSaw 和 Hoffman 抓起來測試，失敗死於鐵絲網陣。│15│\n├─┼─────────────────────────────────┼─┤\n\
  │13│Hoffman 要 JigSaw 注意 Tapp。JigSaw 拿 Gordon 的手電筒給 Hoffman。│ V│\n├─┼─────────────────────────────────┼─┤\n\
  │14│Mark 全身被塗滿油，拿蠟燭找密碼而燒死。Gordon 的手電筒留在現場。  │ I│\n├─┼─────────────────────────────────┼─┤\n\
  │15│Amanda 因為吸毒被 JigSaw 抓去測試，必須從牢友的肚子裡取出鑰匙。   │ I│\n├─┼─────────────────────────────────┼─┤\n\
  │16│Amanda 通過測試，之後成為 JigSaw 成員。                           │II│\n├─┼─────────────────────────────────┼─┤\n\
  │17│警方約談 Gordon，在警局中見到 Amanda。                            │ I│\n├─┼─────────────────────────────────┼─┤\n\
  │18│Tapp 在 Amanda 的影帶裡發現火災線索，錄影地點露餡。(是 V 的火災？)│ I│\n├─┼─────────────────────────────────┼─┤\n\
  │19│Tapp 和 Sing 突襲錄影地點，Sing 救了 Jeff (老人)，後來死於陷阱。  │ I│\n├─┼─────────────────────────────────┼─┤\n\
  │20│被停職的 Tapp 僱用 Adam 暗中調查 Gordon 的動向。                  │ I│\n├─┼─────────────────────────────────┼─┤\n\
  │21│Zep 被 JigSaw 下毒，必須殺了 Gordon 和他的家人，才能拿到解藥。    │ I│\n├─┼─────────────────────────────────┼─┤\n\
