url: https://www.ptt.cc/bbs/movie/M.1707382425.A.DC3.html
title: '[新聞] 《奪魂鋸 11》今年九月再開「鋸」！'
content: '《奪魂鋸 11》今年九月再開「鋸」！《奪魂鋸 10》導演回歸繼續執導


  玩具人


  Joker


  2024-02-06 10:35:56


  《奪魂鋸》（Saw）第十集《奪魂鋸 X》（Saw X）在去年秋季檔持續以 1300 萬美元低廉

  預算，締造全球破億美元票房，眼見此系列的影迷基本盤始終雄厚，獅門影業自然不放過

  繼續把故事說下去的機會，隨即就於去年 12 月宣佈《奪魂鋸 11》的製作計劃，並馬上

  定檔今年 09 月 27 日上映，而今天，負責繼續執掌第 11 集的人選也正式揭曉。


  恐怖類型影視網站《Bloody Disgusting》今獨家披露，《奪魂鋸 X》的導演-凱文格魯特

  （Kevin Greutert，上圖）會繼續執導《奪魂鋸 11》，但本集的編劇陣容則尚未公佈。

  格魯特過去也執導了《奪魂鋸 6》（Saw VI）與《奪魂鋸 3D》（Saw 3D），並擔任過 1

  、2、3、4、5、8 集的剪輯師。


  今年正逢《奪魂鋸》全系列第一集的上映 20 週年，因此可預期獅門在正片裡或宣傳手法

  上，會有一些特別的操盤。


  文：Joker




  --'
