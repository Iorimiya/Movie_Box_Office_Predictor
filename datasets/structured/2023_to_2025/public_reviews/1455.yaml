url: https://www.ptt.cc/bbs/movie/M.1510811241.A.93A.html
title: '[請益] 有關奪魂鋸8的一個疑問'
content: '小弟第一次在Movie版發文

  首先防雷一頁
























  昨天剛看完奪魂鋸8 當中的一個劇情設定有點疑惑

  在電影開頭逃命的那位殺人犯

  在警探跟員警開槍打爛遙控器後因亂槍中被射到胸腔(其實這槍是醫生在遠處狙擊)

  但後續沒有安排這位殺人犯在醫院的治療畫面 直接設定他已陷入昏迷

  疑問點是在後面要開約翰的棺木時才發現其實殺人犯躺在裡面

  這時醫生被懷疑是模仿犯 但卻主動跟黑人警探說他可以取得殺人犯胸腔中的那發子彈

  一般在送醫時的第一時間  醫院的女醫生不是應該要把那顆胸腔中的子彈直接先取出嗎?


  不知道是不是小弟有漏看畫面 但整個覺得這樣也太離奇  胸腔中彈但卻不用把子彈取出

  反而是施打藥物讓那個殺人犯直接陷入昏迷

  黑人警探在聽到羅根說他能取得殺人犯胸中的子彈時

  似乎也沒有發現那顆子彈怎麼就這樣好端端地一直讓他待在殺人犯體內

  請問有人能解惑嗎? 謝謝


  --'
