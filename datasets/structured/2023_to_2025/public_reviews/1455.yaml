title: '[新聞] 《奪魂鋸》系列首次躍上4DX、D-BOX'
content: '新聞網址：


  讓影迷期待度破表的影史最賣座恐怖虐殺電影《奪魂鋸》（SAW）第8部續集《奪魂鋸：遊

  戲重啟》（Jigsaw），今日全台盛大上映，除了2D版本，更突破系列電影，首次於全台威

  秀影城4DX廳與全台國賓影城D-BOX廳上映，不只讓你視覺震撼，更讓你實現渴望身入其境

  。


  系列電影全球狂砍百億台幣的《奪魂鋸》，第8集《奪魂鋸：遊戲重啟》日前試片好評不斷

  ，不只被影迷譽為是導演向首集致敬的作品，驚人結局震撼更是直逼第1集，已過世十年的

  「拼圖殺人魔」在本集中居然還現身犯案，他到底有沒有死？是真正的凶手嗎？一切疑問

  都將隨著峰迴路轉的劇情揭開面紗，而再度創新的殘虐死亡機關更是讓觀眾尖叫聲不斷。


  雖然《奪魂鋸》系列向來被視為是恐怖虐殺電影，但其實劇中的主角「拼圖殺人魔」從未

  真正的殺過人，而是將輕易踐踏他人生命的罪人綁回，為他設計一系列的遊戲與機關，只

  有真相能還給這個罪人自由，所以網友也盛讚，「拼圖殺人魔」其實是「暗黑正義」的使

  者。


  《奪魂鋸：遊戲重啟》描述已過世10年的「拼圖殺人魔Jigsaw」竟然再度犯案，究竟這是

  新的模仿犯，還是其實他根本沒死…驚奇的結局絕對讓觀眾震驚，而你若想知道究竟他為

  什麼要殺人以及獨特的殺人法則，請看「殺人法則預告」

  。


  --'
