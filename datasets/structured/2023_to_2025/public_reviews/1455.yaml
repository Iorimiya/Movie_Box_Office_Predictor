  \ Rigg 被叫去休假。                 4\n 43   律師 Art 失蹤，嘴巴被綁起來，丟在一個房間和盲眼光頭玩鐵鍊生死鬥。  4\n\
  \ 44   Jeff 和他的女兒、仇人們，被 JigSaw 抓到 Gideon，準備進行闖關測試。 3\n 45   Lynn 被 Amanda 抓去 Gideon\
