url: https://www.ptt.cc/bbs/movie/M.1137826293.A.A09.html
title: 'Re: [心得] 奪魂鋸2 (有小雷)'
content: "嗯嗯嗯看完走出戲院我也有這種感觸\n片子裡最主要也最精采的一個「遊戲」\n就是考驗警探馬修是否能克服修正\n原先過於急躁易怒對待人事物沒有耐心的態度\n\
  (而正因為他這樣的性格導致了家庭親情的失和\n 還有工作上嫁禍栽贓，敷衍了事的習慣)\n\n當然，Jigsaw 爺爺設計的情勢對警探很不利\n處處在激怒試探他的痛處與底線\n\
  不過這不也正是整個「生存遊戲」的意義所在?\n讓人面對死亡激發出特強的生命力/意志，做出近乎不可能的抉擇\n片頭的線民必須要能狠下心自戕\n而警探則必須按奈得住慣有的脾氣\n\
  不過看來按捺自持的考驗並不比挖眼珠容易\n一個是心理層面一個是肉體層面\n卻都同樣暴露了人的軟弱和本性/習性難移\n\nJigsaw 爺爺偏激的做法和導致的後果當然不見容於社會的情理法\n\
  但是這些極端毀滅性的遊戲背後\n的確隱含了他所「諄諄教誨」的生命習題\n「為什人總是死到臨頭才會意識到自己真正活著?\n  才會開始珍惜活著這件事的重要性?\n\
  \  才會好好去善待自己和別人?\n  才會明白生命只有一回只走這一遭?」\n\n\n\"Seems to me that the knowledge of your\
  \ sons impending death is causing you\n to act... Why is that we're only willing\
  \ to do that, when a life is at stake?\"\n\n\n\"But most people have the luxury\
  \ of not knowing when that clock's going to\n go off. And the irony of it is that\
  \ that keeps them from really living their\n life. It keeps them drinking that glass\
  \ of water but never really tasting it.\"\n\n\"I am talking to you. You're not listening.\"\
  \n\n\"Would you... kindly get me a glass of water?\n I would very much appreciate\
  \ that...\"\n\n\n希望 Jigsaw 爺爺還出現在第三集最好戲份多一些\n這個演員詮釋起來超級有魅力的表演和聲音\n我整部電影都在期待他出現講話和警探互動\n\
  團體殺戮的部分對我來說都算鳥掉了(其他板友已經說了很多)\n還是第一集的鋪陳和設計有張力和說服力許多\n\nCheers!\n\n              \
  \                               Patsy \"Gallagher\"\n\n\n\n\n\n\n\n\n\n\n--\nSo,\
  \ here we go\nA face in the crowd,\nJump up and jump down\nBaby, can you see through\
  \ me?\n\n--Verve, KNOCK ON MY DOOR\n\n--\n◆ From: 220.139.113.40"
