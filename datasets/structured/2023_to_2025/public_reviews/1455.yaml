  想請問各位 我已經能接受我覺得蠻血腥恐怖的 「火線追緝令(七宗罪)」、「原罪犯」、「四海好傢伙」、血與冰淇淋三部曲(活人牲吃、終棘警探、醉後末日)，昆汀(如惡棍特工、黑色追緝令)和柯恩兄弟的片我也能接受

  但還是蠻怕的 (小時候還沒看那麼多電影的時候，奪魂鋸就是我心目中超血腥的片)，想請問各位大大，我這樣的程度可以看得下去奪魂鋸1嗎？真的是很想看看這部啊！


