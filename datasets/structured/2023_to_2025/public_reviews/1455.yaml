title: '[雷]奪魂鋸4遊戲一覽'
content: '1.跟冰塊賽跑


  Rigg警探必須在90分鐘內找出站在冰塊上的Metthew警探,否則冰塊融化Metthew會被勒死,


  而Metthew一旦離開冰塊一旁的Hoffman會被電死



  2.看不見說不出


  一個眼睛被縫住和一個嘴巴被縫住的人被鐵鍊鎖在一起,必須搶到對方身上的鑰匙解開鐵鍊


  否則會被逐漸收緊的鐵鍊勒死



  3.沒髮師


  Rigg必須在時間內找出密碼解開鎖,否則受害者的頭髮會被活生生撕掉



  4.恩將仇報


  沒髮師獲救後必須殺死Rigg,否則犯罪證據會曝光



  5.Eyes or body?


  受害者必須按下兩次開關戳瞎自己的眼睛,否則時間一到被五馬分屍



  6.你死我活


  被家暴的妻子和施暴丈夫被鐵刺穿在一起,但妻子的傷處不會致命,丈夫則會,妻子拔掉鐵刺

  即可脫身,但丈夫則會因此死亡



  7.好奇害死貓


  錄音帶一聽完鬼臉娃娃立刻爆炸,聽錄音帶的Perez警探性命垂危



  8.Face/Off


  John的第一個遊戲,被害者必須用臉頂開尖刀陣才能脫身,否則會流血而死



  9.你為什麼要這麼著急?


  Rigg警探在90分鐘後開門,則律師,Matthew,Hoffman都可獲救,


  若Rigg在90分鐘內開門,則三人均死,Matthew被兩塊大冰夾死


