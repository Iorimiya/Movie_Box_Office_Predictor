title: '[請益] 奪魂鋸2的小小疑問（有大雷）'
content: '最近小弟重新看了saw系列

  但看完第二集發現有些橋段很奇怪

  可能有些細節沒注意到

  請各位大大腦補 感激不禁


  1. 當馬修警探隨著拼圖殺人犯的指引 開車到所謂遊戲地點時 在第一集的廁所場景 被豬

  頭怪（拼圖的繼承人）襲擊 但是同時警察小隊方面也破解視頻來源 趕到目的地發現視頻

  不是live feed, 我的疑惑是 第二集的遊戲場地 跟第一集的廁所場景 是同一棟建築（馬

  修警探的小孩有跟遊戲者闖到此處 並割喉大隻佬）那麼為何馬修警探在裡面打呼小叫尋

  找 兒子 的時候 沒被警察小隊發現？？警察小隊又怎麼會沒發現那個馬修警探遇襲的廁

  所 而讓馬修在第三集片頭仍在那裡受困？？


  2.拼圖指示 每個人後腦勺有數字 並說要按照“彩虹”來拼湊密碼 但整片好像後來都沒

  講到彩虹線索 還是我漏看了？？


  --'
