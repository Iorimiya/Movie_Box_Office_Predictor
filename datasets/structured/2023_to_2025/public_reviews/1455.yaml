url: https://www.ptt.cc/bbs/movie/M.1288518324.A.3CD.html
title: '[好雷] 3D奪魂鋸之這連續鋸還沒演完！'
content: "我那交往近八年，今年年底即將結婚的老婆，外貌憨憨呆呆，有時候傻笑還會不小心流口\n\n水，如果是烤麵包給我吃的時候，我都會有一種奇怪的錯覺。老婆：「這是剛出爐的麵包\n\
  \n喔(歪頭傻笑)」。以上都不是重點，重點是這麼溫馴草食性的外貌下很難讓人想像她竟然\n\n非常的熱愛噬血噁爛片！\n\n\n我老婆窮極一生都在追尋更有創意更噁爛的虐殺片，我跟在她身邊，在她細心的調教之下\n\
  \n，也慢慢的練就出一身非凡的本領。從剛進大學，電影裡面如果出現一些尖物刺進身體、\n\n硬物敲頭爆血的畫面，我就覺得這是我的極限了。但是自從跟老婆交往，她跟我講了一句\n\
  \n：「今後的你，沒有極限。」之後，我的視野就被她帶到另外一種境界了。我開始敢看砍\n\n手筋、腳筋，進階到整隻手腳砍斷、折斷、鋸斷、扯斷，從開膛剖肚噴出一堆血，進階到\n\
  \n除了噴血還從裡面拉出各式各樣大腸、小腸，一坨又一坨心、肝、肺、胃之類的魯味拼盤\n\n。硬物敲頭噴血已經是基本盤了，還要打凹一個大洞加特寫，腦袋瓜的玩法有橫剖、直剖\n\
  \n、打爆等等。以前看到男性跨下被狠狠踢一腳的畫面心肝不自覺的會揪一下，現在除了整\n\n隻扯斷、砍斷餵狗、更有被魚咬一口再吐出來的終極惡搞畫面。\n\n\n\n\
  老婆在噁爛片「遭腫」那麼多年，她最推兩部片，「顫慄」跟「屍體解剖」，「顫慄」比\n\n較多人知道，之前住的社區有一個賣鹽酥雞的媽媽，老婆最愛去那邊光顧了，只因為那媽\n\
  \n媽長得很像「顫慄」的女主角(人格分裂的那個) =..= 我跟老婆最近看了「惡靈古堡3D」\n\n、「3D食人魚」(我覺得這齣味道算重)，不過她都覺得還好(噁爛指數)，所以我們對「奪\n\
  \n魂鋸3D」都是充滿了高度的期盼。唷，對了，老婆愛看噁爛的畫面只限於電影裡喔，現實\n\n生活裡她是一個光看到「拉牙」被媽媽打死都會難過的小女生。\n\nps.前一分鐘看到「拉牙」，老婆：「媽~~~~~有大蜘蛛、大蜘蛛！快打死牠！」\n\
  \n   下一分鐘看著扁掉的「拉牙」，老婆：「哭哭，牠好可憐喔！」阿都給妳講就好了阿！\n\n=======================終於進入正題的分隔線，下面有雷=========================\n\
  \n\n影片一開始竟然出現了第一集的高登醫生，他拖著斷了一截腳的身軀在地上吃力的往前\n\n爬，我彷彿看到新訓時被教育班長狂操「單兵戰鬥教練」好幾回的我。高登在地上匍伏前\n\
  \n進一會兒之後，看到眼前有一燒燙的鐵管，於是他用力操起他斷腿的截面，往鐵管伸去。\n\n「哧~~~~~！」的一聲，讓我決定明天中午來吃個鐵板燒。\n\n\n\
  接著就是開胃菜，在一人來人往的廣場上，一家商店櫥窗裡有一個男子突然甦醒，他的眼\n\n前有一巨大圓鋸片，而他的對面一樣有個男的，他一樣擁有一巨大圓鋸片。天花板上則是\n\
  \n吊掛著一個女的，姿勢還有點cosplay阿湯哥在不可能的任務裡的經典動作，不過她比較\n\n像是跳傘失敗卡在樹上的樣子，當然她的面前也有一巨大圓鋸片。這女人的手段高明，一\n\
  \n直把這兩個男的玩弄於股掌之間，為了懲罰他們的愚蠢，他們必須玩這場遊戲。只要其中\n\n一個男的把圓鋸片往前推，就可殺死對方，並讓自己和女子活下，但是如果兩個男子都不\n\
  \n推動眼前的圓鋸片，那上面的女子就會被鋸。結果最終的下場是女子惹惱了兩個男子，落\n\n得自己被高速轉動的圓鋸片對著柔嫩的小肚皮狂鋸，肉屑鮮血激噴，連粉腸都蹦出來了\n\
  \n，不過看起來怎麼很像菜市場旋轉小馬的老闆用來折小狗的長條氣球。開胃菜結束之後我\n\n轉過頭問一下老婆：「安怎，唔宋某？」，我以為她會回我：「就宋A！(愉悅貌)」不過\n\
  \n她只是微微的聳聳肩，沒關係，後面還有。\n\n\n這次的故事有兩條支線，先從巴比這條支線說起吧！因為拼圖特殊的殺人手法，再加上逃\n\n得過虐殺而能殘存下來的人數不多。抓住了人類好奇心的這個商機，巴比決定編造自己也\n\
  \n是逃過拼圖遊戲的倖存者。於是他開始出書、辦簽書會、上脫口秀還計畫出DVD，只差沒\n\n有安排來台灣跟馬英九握手。\n\n\n也因為這些「嗆秋」的行徑，巴比這個團隊被拼圖盯上了，只是執行者變成霍夫曼。霍夫\n\
  \n曼為他們設計了一系列非常好玩的遊戲，只是這一段的虐殺遊戲我覺得創意上沒有讓人驚\n\n艷的感覺，可是看到演員哭得柔腸寸斷，吼得哀爸叫母，激動得好像觀落陰看到祖公祖母\n\
  \n叫你吃飽穿暖一點，還是為畫面增添了不少緊張和刺激感。\n\n\n比較有感覺的應該是巴比要救他老婆的那一段，因為開門的密碼寫在巴比的牙齒上，所以\n\n要看到密碼必須用鉗子把牙齒硬生生拔下來，這比拔獅子的鬃毛還要刺激。巴比把鉗子固\n\
  \n定在牙齒上之後，奮力的撞牆要把牙齒弄斷，看到他這登峰造極激動派的演技，我的雙手\n\n大拇指不禁為他而勃起。而且這一段讓我長知識了，原來拔兩顆牙會爆出那麼多血，好想\n\
  \n拿衛生棉摀住他嘴巴，看哪個牌子比較會吸，以後可以順便跟我老婆推薦一下。\n\n\n巴比好不容易拔下牙齒獲得密碼，進到了囚禁他老婆的密室裡，繼續下一個挑戰的遊戲，\n\
  \n不過卻不幸失敗了。這一段超有創意的，他老婆的身邊機關瞬間啟動，出現了一個巨大的\n\n金爐，老婆在金爐的中心，然後金爐旁邊就開始不斷的噴出火焰！我的腦袋瓜突然出現\n\
  \n桶仔雞的畫面！是桶仔雞啊！這一定是某天編劇吃完桶仔雞之後所產生的靈感阿，實在太\n\n有才了。\n\n\n最後挑戰失敗的巴比只能失落無力的看著老婆變成桶仔雞，他唯一的收穫就是，他又可以\n\
  \n開始寫一些「虐殺後的七日」、「深夜停車場遇見霍夫曼」、「巴比師教你輕鬆出好料」\n\n之類的書來獲取更多的金錢跟知名度了。\n\n\n第二條支線則是吉兒和霍夫曼之間的恩怨，吉兒願意跟吉柏森抖出霍夫曼的一切，以尋求\n\
  \n自身的保護，畫面要從一個廢車廠開始說起，這是我覺得這齣電影最刺激的一段。艾文在\n\n廢車場的一輛車上甦醒，他半身赤裸背部被強力膠黏在椅背上，車子被千斤頂頂住，車下\n\
  \n是他女友，車子後面牽著一條鐵鍊，鐵鍊末端的鐵勾勾著他朋友的下巴，車子引擎蓋上則\n\n趴著他另一個朋友。他們因為種族歧視所以被抓來玩這個遊戲，艾文必須撕開被黏住的皮\n\
  \n肉去拉車頭前的一個拉桿，否則一連串的反應會害死所有的朋友。\n\n\n遊戲開始之後，艾文用力的扯開背後被黏住的皮肉，那皮肉被拉扯的樣子看起來有點像是\n\n\
  披薩剛出爐拿起其中一片整個牽絲的模樣，也有點像鏡頭特寫AV男優的拇指跟食指，並作\n\n出拇指食指開和的動作那種感覺。飾演艾文的是聯合公園的主唱，那撕開皮肉的痛楚透過\n\
  \n那強而有力的嘶吼，吼得如此驚心動魄，震撼人心，害我差點喊安可！\n\n\n時間終了，艾文來不及拉車頭前的那個拉桿，於是千金頂失效，汽車車輪壓爛了車下他女\n\
  \n友的臉，車輪並開始作出加速的動作，他女友的爛臉瞬間又被高速的車輪揉虐，有點像是\n\n鋼棍謝師父拿著鐵棒在桿麵團一樣。車子加速往前衝之後，那個在車子後面被鐵勾勾住下\n\
  \n巴的朋友，瞬間整個下巴被扯開，變成名副其實的開口笑。接著整輛車往前衝把牆壁撞出\n\n一個大洞，那力道應該不亞於賀力王把監獄打爆一個大洞，所以趴在引擎蓋上的老兄應該\n\
  \n是直接變成肉餅了吧！在那短短幾秒鐘四個人一起領便當，還真是「大家可以回家了！」\n\n\n\n\n警察到現場處理，並把一具一具的屍體裝進屍袋裡，霍夫曼在外面搞個爆炸吸引所有人離\n\
  \n開，這時候他把黃金開口笑的屍體從屍袋拖出來，他則自己躺回去裡面。不知情的小員警\n\n就這樣把這些屍袋都運進去警察局裡，木馬屠城即將上演。解剖室裡，霍夫曼從屍袋出來\n\
  \n，拿起一把刀子，逢人便用那101招-「摀嘴捅脖子放血」，手法乾淨俐落，毫不拖泥帶水\n\n，只差沒有拿臉盆裝糯米在下面盛，不然就更完美了。不過看這段有種看「藍波」的錯覺\n\
  \n，尤其霍夫曼某些角度在陰暗的地方突然晃過還有那麼一點史特龍的feel，再加上那瞬間\n\n秒殺的氣勢，我很期待他對著鏡頭說出：「Live for nothing\
  \ or die for something.」\n\n之後操起一把機槍瘋狂的掃射。\n\n\n最終霍夫曼找到了在警察局裡接受保護的吉兒，並為她帶上了傳說中的裂嘴器，可憐的吉\n\
  \n兒未能逃過裂嘴器的伺候，鏡頭還很夠意思的往正面拍攝，讓我們一窺被裂嘴器伺候過的\n\n嘴臉會是怎麼一回事。鏡頭帶到吉兒的正面，我看她嘴巴張得老開，一副笑得很開心的樣\n\
  \n子，很像死亡筆記本的死神。\n\n\n霍夫曼了結這一切之後，放了一把火準備遠離這個地方，不料卻被三個萬聖節還沒到就戴\n\n著面具出來嚇人的莫名男子堵住敲暈。霍夫曼就這樣被拖到第一集的場景去，而戴面具的\n\
  \n竟然是一開始在操「單兵戰鬥教練」的高登醫生。啥米！原來高登也是拼圖的接班人之一\n\n，後來高登把霍夫曼銬住，耍帥的對著鏡頭說出：「Game Over！」之後影片結束。\n\
  \n======================================後紀整理================================\n\n\
  \n電影好看程度：我是覺得還不差啦，該有的娛樂效果也還有，只是沒有更讓人驚艷的\n\n感覺。\n\n\n噁爛程度：我跟老婆都覺得還好，如果你很想看，可是又怕太噁心，其實這齣真的還好，\n\
  \n可以給不太敢見血的人放心觀看。\n\n\n緊張刺激程度：這點我給予很高的評價耶！很多玩遊戲的畫面都超刺激的，比「妹眉台正\n\n點」的遊戲還刺激哦！蓬萊仙山的「辣妹賓團」有點噓掉了！這是提外話！\n\
  \n\n3D效果：字幕還蠻立體的，其他的我覺得還好。看過的3D片比較有感覺的只有「阿凡達」\n\n跟「3D血腥情人節」，下一部3D電影只期待「3D肉蒲團之極樂寶鑑」。\n\
  \n==============================================================================\n\
  \n\n那天晚上跟老婆看完電影回家之後，騎著機車在中山北路上被一輛橫在馬路的客運擋住，\n\n我想說那客運幹麻橫在馬路上不走，後來我從旁邊騎過去之後，有看到旁邊有警察、救護\n\
  \n車，老婆說她有看到一個人躺在公車底下。唉，希望那個人可以平安無事才好！\n\n\n\n\n                                \
  \                        by  永遠的黃小偉~☆\n\n--\n黃小偉的小窩\n↓↓↓↓↓↓↓↓↓↓\n\n\n--\n◆ From:\
