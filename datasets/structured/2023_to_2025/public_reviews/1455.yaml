url: https://www.ptt.cc/bbs/movie/M.1693735136.A.54B.html
title: '[新聞] 奪魂鋸 10 拼圖殺人魔戲份史上最多！'
content: '《奪魂鋸 10》拼圖殺人魔「戲份史上最多」！導演酸片商沒找托賓貝爾拍第 9 集「很有

  種」




  （圖片來源：獅門影業）


  《奪魂鋸》（Saw）系列第十集《奪魂鋸 X》（Saw X）即將於 09 月 28 日在台上映，對

  於本系列影迷而言，此集的最大賣點，莫過於找回了上次缺席第九集《死亡漩渦：奪魂鋸

  新遊戲》（Spiral：From the Book of Saw）的托賓貝爾（Tobin Bell）繼續飾演靈魂人

  物 — 拼圖殺人魔「約翰克拉瑪」，導演-凱文格魯特（Kevin Greutert）接受《帝國》

  （Empire）雜誌時也對此表示，第九集沒找貝爾回歸是相當大膽的決定。


  執導過《奪魂鋸 6》（Saw VI）與《奪魂鋸 3D》（Saw 3D）的格魯特略帶嘲諷的說道：

  「他們上次嘗試在沒有托賓貝爾的情況下製作第九集，在我看來，那真的是滿有種的啦。

  」格魯特也預告，克拉瑪在《奪魂鋸 X》的戲份會是全系列有史以來最多的一次，這次他

  會比以前更像是一個主角。


  格魯特解釋，前幾集都是從受害者的視角去說故事，但這集會改從克拉瑪的視角出發：「

  《奪魂鋸 X》是你和約翰克拉瑪一起體驗的情感旅程，比較不是從受害者的角度去體驗克

  拉瑪設計的屠宰場。很顯然一定會有觀眾無法接受這點，但我覺得這種手法很有機會能吸

  引到不只是熱愛血腥殺戮的觀眾族群。」


  格魯特亦形容，相較於前幾集追求愈來愈花俏的殺戮機關，《奪魂鋸 X》的風格會更接近

  於回歸最初的寫實風格，雖然劇情不會像第一集那麼簡潔單純，但依舊多少很接近於第一

  集的基調。




  （圖片來源：Empire）


  《奪魂鋸 X》由第八、第九集的編劇搭檔 — 喬許史托柏格（Josh Stolberg）與彼特高

  芬傑（Pete Goldfinger）繼續執筆劇本，故事發生的時間點是介於第一集與第二集之間

  ，敘述絕望的約翰前往墨西哥準備進行一項危險的實驗性醫療手術，並希望能奇蹟般治好

  他的腦癌，然而約翰卻發現，這整個手術其實是一場專門欺騙弱勢群體的騙局。


  得知真相的約翰，決定活用他最拿手的殺人機關制裁，透過一系列狡猾、瘋狂、精密的陷

  阱來反攻這些詐欺犯。




  文：Joker



  新聞網址：





  --'
