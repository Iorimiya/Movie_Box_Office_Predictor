url: https://www.ptt.cc/bbs/movie/M.1510327654.A.DE4.html
title: '[無好雷]奪魂鋸：遊戲重啟'
content: '片名：奪魂鋸：遊戲重啟

  台灣上映日期:11/10

  心得：無雷 害怕些微雷可不看



















  ---------防雷線-------------------------------------------




























  第1集最讓人覺得好看的地方


  莫過於拼圖殺人狂一直暗示提醒你


  他的特色是什麼


  但到了電影最後一刻才讓你回想


  我早告訴你這些線索了


  你這個笨蛋 還猜不出來 兇手是誰


  而2~7集比較著重在殺人手法的不同


  暗示層面我個人覺得沒有做得有第1集好(個人觀感)


  而本集從電影片名就開始暗示


  【遊戲重啟】這個主軸


  除了告訴你重新回歸外 其實也串起整部電影的核心


  重啟並不是所謂向第1集致敬


  而是接近片尾時 才串起來


  不過因為有了奪粉的思維


  也時常懷疑東 懷疑西


  而劇情也接上這個套路


  讓你一下自以為猜到


  下一刻又否決了你的猜測


  這次這部片


  一樣有 挖哩


  原來你一直暗示我【遊戲重啟】的意思


  也一直拍線索給我看


  但我真是個笨蛋


  還是從 不夠的證據 去推測誰可能是兇手


  總之


  私心覺得


  第1集最好看


  再來就是這集了


  劇情：5

  結局：5

  駭人：3

  氣氛：3

  推薦：5

  其他：很多解剖畫面(請斟酌)


  --'
