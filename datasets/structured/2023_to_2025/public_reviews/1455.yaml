url: https://www.ptt.cc/bbs/movie/M.1513511440.A.448.html
title: '[好雷] 《奪魂鋸：遊戲重啟 Jigsaw》'
content: '[網誌圖文版： ]





  　　沒有看過1-7，對這系列只有殺人魔抓人來玩死亡關卡遊戲的概念。但就算都


  沒看過，直接切入第八集遊戲重啟，還是完全可以進入劇情無障礙～

  　



  　　2000-2010年期間歐美片盛行一種B級暴力美學，以充滿創意的血腥暴力、衝


  擊為主。如《奪魂鋸》及《絕命終結站》，特色都是配合各種創意死法，滿滿的


  血液與斷肢。

  　



  　　當年只看了《絕命終結站》，記不得劇情，只記得好多喪命設計因為很有生


  活既視感，所以會很歷久彌新深入意識的家庭醫學式可怕><

  　



  　　但一直沒有機會找《奪魂鋸》來看，倒對一個YOUTUBER試圖演奪魂鋸的殺人


  魔講台詞，結果被地表最強媽媽巴頭這影片倒還很印象深刻XD


  　　「PLAY蝦米GAME」-https://www.youtube.com/watch?v=Jwmdqqz1cf8

  　



  　　遵循系列概念原則進入遊戲，五個陌生人被繫上頸鐵鍊跟頭戴水桶關在密室。


  侷限的封閉空間、束縛的頸鍊與水桶、不完全的視線遮掩都增加焦慮感。



  　

  　　第一個關卡就頗有B級趣味跟必備品「鋸子」。


  　　頸鍊另一端的門設有無數轉動的圓型電鋸，經典音調與台詞播放後，鐵鍊作


  動將這五人往電鋸處拉扯。當然一片慌亂掙扎，狀似較有正義感跟聰惠，看來會


  是這遊戲主視點的女性安娜，她發現電鋸與對話的線索是『必需流血』，流血後


  門就會開了。

  　



  　　安娜選擇割手臂，但也有人伸出手指。覺得手指感覺更可怕啊！看不出轉速


  多快，接觸範圍太小的施力點，很可能一不小心手指就飛了吧！但沒有出現這種


  飛指片段，受害者也都很節制，沒有出現人性的衝突(本來想說會有推別人去割的陷害)




  　　傷比較嚴重是小太妹樣的卡莉(激動狀況來不及回神，只來的及轉過身，導致


  整片背靠到電鋸牆)跟另一位沒有醒來的男子一路被拖行，似乎就正面直擊死亡了？

  　　



  　　劇情以兩條線路前進，一邊是密室中的受害者們，爭扎著進行著遊戲；另一


  邊是社會上陸續曝光的屍體與拼圖傷口訊息，由兩位警員哈洛蘭及兩位法醫羅根


  及女助手合力調查。

  　



  　　衝擊開場後，陸續揭露受害者的過去。他們不是社會上所見做奸犯科的壞人，


  看來都是些升斗小民，卻各自因為『意外』有害死人命的罪過。

  　



  　　這些意外的人命罪過，並非存心，也沒有確鑿的證據可舉告，所以無法被法


  律判刑。




  　　但究竟有需要那麼可怕的私刑嚴懲嗎？似乎又頗有爭議，只是對於受害者家


  人來說，這也無法彌補他們內心的痛，存在各種角色立場異位思考後的灰色地帶。

  　



  　　第二個關卡開始產生針對者，是背部已被鋸傷的卡莉。


  　　所有人頸鍊往上卷，面臨吊死的危機。


  　　卡莉坦承的罪惡是『她曾經因為搶劫包包，來不及將藥還給包包主人，造成


  包包主人猝死。最後包包裡的現金也只有3塊多。』




  　　挽救機會是已在卡莉身上注射毒藥，天降三支有數字的針管，一支是解藥，


  一支是無用的食鹽水，一支是毒藥。

  　



  　　卡莉有發現其中一隻的數字，是她當初搶來的錢金額，但她遲遲無法決定。


  後來是眾人被懸釣窒息，大叔掙扎揮舞手臂，將三隻全插進去她脖子了。剛好跟


  她因為奪藥害死人的死法一樣，體內創傷融化的肌理組織，很畫面衝擊。

  　



  　　這邊會有幾個疑問跟想法，因為劇情沒說她有被逮捕，到底殺人魔怎麼得知


  這隱密的搶劫事件，甚至細到她搶到的數字金額？


  　　不過此處意外，倒可以連貫到揭露大叔的罪孽故事時，大叔的罪孽程度被虐


  殺頗有爭議的，但臨時加上卡莉這條誤殺的人命，似乎就也平衡了。

  　



  　　後面陸續發生的關卡試煉，如果能夠結合，多卡莉一個人力也許影響局勢發


  展，或許會更有趣。(穀倉關卡影響不大。雖然如果不要全員進去，有人能在外面


  堵住門口不能閉合，但當下那時還有安娜跟黑人小哥兩人，他們也還是選擇都進


  去了……<這就是一個囧邏輯啊>雖然機車關卡也許可以幫忙，一人堵住輪胎，一


  人從外頭伸手進去按煞車把手，但卡莉連選擇有機率是解藥都自私的態度，應該


  也不可能幫忙黑人小哥。


  　　唯一會影響應該只有最終槍把關卡，一人自轟後，還可以攜手逃出。但如果


  是三人應該就不會是槍把關了)

  　



  　　外界隨著屍體陸續出現驚慌，究竟是死亡多年的殺人魔，魔化為傑森那樣永


  恆的怪物嗎？還是模仿犯？警方莫名鎖定法醫女助手，特別去盤查她的上網紀錄，


  發現她曾有在暗網登錄、購買殺人機關的記錄。

  　



  　　第三位受害者原排訂是黑人小哥，但大叔就是地方的歐吉桑，一定要來亂一下。


  　　因為不聽指示想走捷徑，所以掉到陷阱，引起穀倉關卡後被截肢，注定就是


  沒人幫助難以獨立脫逃。




  　　黑人小哥的機車關卡特嚴苛，不像藥品關卡有選擇，還要靠人幫助，就算幫


  助了也還是無法搆到把手，幾乎完全無法破解。是因為黑人小哥販售故障車輛，


  害死的是殺人魔姪子，所以有家屬報復意味在裡頭嗎？

  　



  　　大叔的罪是年少時，在車上晃悠導致同車人拉扯車禍死亡。覺得這應該算最


  無心的，但錯就錯在他沒有坦承。只是同理卡莉的罪，也是很好奇他既然沒有坦


  承，那殺人魔從哪裡知道？?

  　



  　　最後一路展現救人正義感的安娜，罪孽剖白倒滿讓人意外。她誤殺了自己孩


  子後嫁禍丈夫，導至丈夫瘋狂自殺。比起前面意外害死人的罪過，可說最蓄意謀


  害，與前述鋪陳她的正義助人性格落差好大。揭露安娜的罪過，同時以為已經死


  亡的殺人魔約翰狀似無事登場，也很令人震驚。

  　



  　　當安娜遵守表面的遊戲規則，傻傻為了自救所以選擇開槍轟炸大叔，導致炸


  膛而死、斷腿大叔無法取得鑰匙也無法自行逃亡，最終全滅的結果，倒就不是那


  麼意外了。



  　

  　　如果只是搭配各種機關陷阱與死法，也許不會覺得這續集很驚豔。


  　　當最後揭曉，竟然是電影才能產生錯覺的時間軸設計，實在非常有趣。

  　



  　　原來安娜、大叔、黑人小哥、卡莉等都是在十年前就已經死亡的人，而法醫


  羅根其實是當年第一關卡睡著的蒙面人。他因為沒有看出殺人魔的癌症X光，導致


  約翰癌末沒得救，但約翰覺得這是非過失致死的業務疏失罪不至死，所以他雖然


  意識不清被拖行，最後其實沒有被電鉅切死，片中有照到的背部傷口其實是電鋸


  傷而非戰時留下的傷疤。最後被殺人魔救了，成為他的助手。

  　　



  　　只是電影利用剪接錯覺，羅根重新啟動遊戲，找來類似當年背景的受害者，


  測試他們會不會也因為同樣的狀況而死，再向社會大眾拋出屍體。但並非是安娜


  一夥人，觀眾看到那一組受害者經歷是十年前的那一場，並非現在時空點進行的


  受害者。

  　



  　　覺得這創意非常精彩，不僅是電影時空特有的錯覺，也同理解釋了很多原素。


  約翰狀似一個沒錢治病的老人，如何有體力能綁架諸多成年人？哪來經濟力能製


  造這些道具？原來是一直有個助手羅根，有軍人的體力、醫師的人體結構理解、


  醫師的經濟力支援等。而羅根既因醫療疏失對約翰於心有愧，又自己內心也因戰


  症症候群有所病態壓力，剛好一拍即合。

  　



  　　重啟這一回，羅根找了類似背景的受害者、玩類似的遊戲，也是彌補自己當


  時昏倒錯過那一段吧。(親眼所見當年一同參與的人，他們當時到底做了怎樣的決策)


  　　以一個病態犯的湊齊、集滿、的心理來說，也是很能理解的，並將這疑似未


  破獲實際是第一局的遊戲，再次展開成為自己的第一場遊戲，達成完美的傳承。

  　



  　　只是對於羅根時間表稍有困惑。


  　　從軍造成戰後心理創傷症候群，是被逮去參加遊戲前嗎？


  　　因為存在心理創傷，所以忽略了約翰的病徵？


  　　參加遊戲讓他內心有了病態式舒壓，那當約翰以單一殺人魔被逮捕後，他是


  怎樣渡過無法殺人的十年，要是他妻子的愛鎮住了他嗎？而警探以辦案為由收賄、


  放任線人行惡間接害死他妻子，所以選擇擴大報復這個社會？

  　



  　　整體來說非常刺激好看，氣氛緊湊，道具及角色背景的設定也很有意思，結


  局翻轉很意外。作為一部重開機的續集片，覺得表現亮眼。也會讓人很有興趣想


  要把前面幾集好好補全啊~




  --


