url: https://www.ptt.cc/bbs/movie/M.1750322572.A.7E7.html
title: '[新聞] 溫子仁宣告正式拿回成名作《奪魂鋸》版權'
content: "《厲陰宅》大導溫子仁宣告正式拿回成名作《奪魂鋸》版權！未來將親自參與更多續集的\n構思\n\n\n\n（圖片來源：獅門影業）\n\n本月初，各大外媒盛傳，恐怖片的專門大戶布倫屋影業，已開出近一億美金的價碼準備從\n\
  \ Twisted Pictures 手中收購《奪魂鋸》系列版權，而今天官方則證實，這場收購案已完\n成，布倫屋現在持有 Twisted Pictures 原本持有的《奪魂鋸》50\
  \ % 版權，另外 50 %\n則仍掌握在前十集的發行方獅門影業手上，而獅門也仍會負責往後續集的發行事宜。\n\n\n\n（圖片來源：溫子仁臉書）\n\n這場收購交易背後的另一層意義，是《奪魂鋸》第一集的導演\
  \ 溫子仁拿回了他的創意主\n導權，因為他創辦的原子怪獸製作公司早在三年前就已經和布倫屋合併，因此布倫屋買下\n《奪魂鋸》，等於也是溫子仁買回了《奪魂鋸》。\n\
  \n溫子仁稍早更於臉書、Instagram 興奮地發文分享此事，並預告他日後會參與續集的製作\n：\n\n「對我來說，這將是我自演藝生涯初期以來，首次以創作者身份回歸這系列，意義非常重\n\
  大。我很期待能繼續秉持原初的精神，並以大膽、出乎意料的方式，將這系列向前推進。\n」\n\n溫子仁雖然在前九部續集一直都保有執行製片人的頭銜，但那只是好萊塢常見的純掛名，\n\
  實際上身為該系列共同原創者的他，並沒有繼續參與製作，直到現在，溫子仁這才總算真\n正意義上重新掌權，而他顯然也樂意繼續不斷延伸新故事，不會就此止步第十集。\n\n\
  文：Joker\n\n\n新聞網址：\n\n\n\n--"
