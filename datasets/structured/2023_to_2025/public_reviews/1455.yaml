url: https://www.ptt.cc/bbs/movie/M.1490833180.A.5A5.html
title: '[好雷]奪魂鋸2 - 承先啟後的佳作'
content: "大家好\n我是專看恐怖片的LittleDiDi\n我又來介紹恐怖片啦\n撰寫動機我在文中寫得很清楚了\n就不贅述了\n\nBlog圖文版會更精采\n\
  \n\n年份：2005\n\n國別：美國\n\n類型：懸疑、驚悚、殺人魔\n\n導演：Darren Lynn Bousman\n\n[劇情簡介]\n\n影史最狡猾的殺人狂又回來了，這次將再度教訓不愛惜生命的人們……\n\
  \n當殘暴血腥的謀殺案件告一段落後，警探艾瑞克馬森（東尼瓦伯格 飾）預感嗜血的變態\n殺人狂將再次捲土重來大開殺戒，而艾瑞克的猜測果然應驗，這次冷血殺人狂將再度玩他\n\
  新設計的殺人遊戲，他將八個毫無關連的陌生人，包括了魯莽易怒的商人蓋斯（東尼拿坡\n 飾）、首集曾逃過殺人狂毒手的艾曼達（薛妮史密斯 飾）、冷靜求生的中年人賽維爾（\n\
  法藍奇吉 飾）、神經質受驚的蘿拉（碧佛莉蜜雪兒 飾）、藏有秘密的歐比（提姆伯德\n飾）、睿智明理的強納司（葛連普魯曼 飾）、美麗頑固的愛狄絲（艾曼紐瓦吉兒 飾）以\n\
  及艾瑞克馬森的兒子丹尼爾（艾瑞克克努德森 飾）關在同一間密室裡。\n\n密室裡不僅各處都有出乎意料的致命機關，另外更不斷地排放神經毒氣，八個人必須在吸\n入過多的致命毒氣以前找到出口活命，否則將無法重見天日……。　\n\
  \n\n\n\n既然宣告了有特別計畫，反正我也不是什麼大牌人物，既然說了就趕快做吧，言出必行是\n哥的一種風範，不僅如此，作為假文青的表率，不瞞各位，日省吾身更是家常便飯，某天\n\
  我就想到，作為一個恐怖片專才，版面居然沒有《奪魂鋸》的資料，作為恐怖片最經典系\n列之一，實在是有失水準，於是上個週末，我在一個晚上看完了奪魂鋸系列整整七集，當\n\
  下茅塞頓開還吟詩作對：\n\n木頭人騎車來說要玩個遊戲，玩得哥不高興就要你命；\n人生不過一場遊戲，他媽的規則都你訂；\n不怕豬一樣的隊友，就怕被陰卻開不了口；\n\
  沒有過不了的關，只是聽完規則滿腦子都是幹；\n無聊當有趣，是我《奪魂鋸》。\n\n嗯~~~好詩好濕。\n\n或許大家對《奪魂鋸》的盛名耳熟，可是不一定能熟，可能有人像我一樣前幾天才看，或\n\
  還沒看過，或可能連看都不敢看，沒關係，這邊就來簡單講一下這系列電影的概念，意思\n大概就是美國街頭出現了一個令許多人為之聞風喪膽稱的殺人魔，可怕之處不在於他會殺\n\
  死人，而是在於他會玩死人，他最擅長的就是製造各種機關訂定各種遊戲規則讓被害人決\n定要死要活，廢話，可以活誰會想死，問題是你要先生不如死，因為手段既特殊又殘忍，\n\
  而得到了「Jigsaw」的稱號。\n\n欸，可是可能有人會覺得納悶，怎麼不是從第一集開始寫呢?我來說明一下喔，看完這個\n系列，你會發現「預留伏筆、見縫插針」絕對是這系列最適合的寫照，一天之內看完這個\n\
  系列的我，給大家一個觀影順序的推薦，那就是把第二集當作本系列的首部曲，以後當作\n影集這樣看，然後第一集留到最後當作是SP，保證一定會像我一樣感到舒暢，莫名其妙也\n\
  變成一個詩人也說不定。\n\n《奪魂鋸2》作為溫子仁卸任後的首發，其實在很多方面兼任很重大的意義，由於換導演\n的關係，不免讓人擔心會不會砸招牌，幸好的是非但不會，接棒的Darren\
  \ Lynn Bousman\n更是雄才大略，很明顯感覺得出來，《奪魂鋸》是打算拍一部驚艷一下就收手，但從《奪\n魂鋸2》開始就四處可見各種「做戲留一線，日後好拍片」的痕跡，不管是還有沒有機會\n\
  拍續作，伏筆先做了再說，也讓《奪魂鋸》系列有著環環相扣是其重點特色之一。\n\n上面講得比較文謅謅，簡單講，想接拍《奪魂鋸》的導演，玩接龍的技巧不能太差。\n\n\
  問題是新科導演Darren Lynn Bousman要做的事情很多，但實際上他各方面也都做得很不\n錯。《奪魂鋸2》裡他要開始著手介紹「Jigsaw」的真面目與由來，本片始給了他名字叫\n\
  John Kramer，是一個病入膏肓的尋常老人，而且沒多久就被警察贓到了他的大本營，警\n方浩浩蕩蕩輾進去的時候還要挨幾下，代表了他老奸巨猾老謀深算老而彌堅又老番顛，大\n\
  本營各種機關道具設計圖說明了他是個十足的智慧犯，然後跟男主角打打嘴砲講他的犯罪\n動機與願景，雖然男主角覺得很狗屁，我也認同......是狗屁。\n\n只是高深莫測的John\
  \ Kramer會什麼都沒做就束手就擒嗎，當然不是，正當警察們磨刀霍\n霍正準備來點私刑正義之時，搜索現場的同時發現，電腦螢幕裡似乎正在監控著什麼，而\n其中男主角的兒子就龜縮在角落，表示無能。於是鏡頭拉到了現場，一群不認識的人就在\n\
  某處封閉的建築物裡甦醒，裡頭的人物有一個黑人、壯漢、酥胸女、平胸女、兒子、爆頭\n男、尖嘴猴腮男以及前一集遊戲的倖存者阿曼達，起初所有人不明究裡，直到曾經被玩過\n\
  的阿曼達出來提點幾句，這才明白，原來大家都落了「Jigsaw」的手上，想活命就要照規\n矩來。\n\n於是房子裡頭有各種提示，這樣的模式各位有沒有覺得跟一種實境遊戲很像，沒錯，就是\n\
  密室逃脫，如果各位有查一下時間順序，可以發現《奪魂鋸2》比真人密室逃脫起源還來\n得早一年，所以說《奪魂鋸2》根本就是密室逃脫這個遊戲的始祖吧(拜)。《奪魂鋸2》建\n\
  立了本系列密室逃脫的風格，但是電影裡頭的密室逃脫跟我們實際在網路上看到的可是非\n常不同，我不是說有沒有花錢買票的不同，電影裡頭的人是在玩命，跟我們嘻嘻哈哈還有\n\
  漂亮的工作人員在旁邊親切講解，那種氛圍是完全不同的，他們因為不知道身處在什麼地\n方而感到害怕，更因為室內正在瀰漫著慢性毒氣而有生命危險。\n\n因此可想而知，因為互不相識而勾心鬥角，腳色輪流猜疑與解謎，《奪魂鋸2》也因為設\n\
  計了幾個經典場景而頗負盛名，爆頭男為什麼我要叫他爆頭男，因為他不聽話，嘗試著想\n用鑰匙開門，然後就觸發門外的機關給開槍爆頭，沒錯，是被爆頭不是爆人家的頭，接著\n\
  是針筒地獄，雖然說用演得好像看不太出來很痛，但那需要心領神會一下，嗯，還是別想\n太多好了，雞皮疙瘩掉滿地，除此之外，電影開頭都要找一個衰尾仔來玩遊戲的慣例，也\n\
  是從本作開始的。\n\n師父引進門修行靠個人，所以說，溫子仁可以是《奪魂鋸》的概念始祖沒錯，但真正將本\n系列發揚光大的是Darren Lynn Bousman才是。\n\
  \n就這樣嗎?當然還不夠，《奪魂鋸》因為超級爆炸性的結局意外性而著稱，《奪魂鋸2》自\n然也不遑多讓，只是說為了保留更多觀影樂趣給各位，我就不便多說什麼，我就簡單提示\n\
  幾個不太意外的意外，你以為John Kramer會什麼都沒準備就讓這系列一向都沒什麼屁用\n的警察侵門踏戶嗎?當然是為了......嘿嘿嘿，不過我承認，看John\
  \ Kramer被揍的時候我\n還挺爽的。\n\n第三集下期繼續。\n\n即刻短評(滿分5)\n\n劇情： 5        >>承先啟後，溫子人御用編劇功不可沒\n\
  結局： 4        >>雖然不到前作的水準，但意外性也是很高的啦\n血腥： 3        >>普普通通，其實高血腥的風格這時還沒開始\n氣氛： 4 \
  \       >>九死一生的密室逃脫，高深莫測的Jigsaw，緊張度裡外兼顧\n推薦： 5        >>攻略本系列不得不看的初始作\n\n\n\n\n\n\
  --\n個人特色\n不然這片我大概三句話就講完了吧\n沒耐性可以直接跳最後的短評\n敬請期待\n我會講解我對第三集的看法"
