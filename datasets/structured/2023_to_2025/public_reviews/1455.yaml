title: '[微好雷] 奪魂鋸：遊戲重啟 Jigsaw, 2017'
content: "一言蔽之的心得：\n傳奇可以複製，無法超越\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n-----微雷分隔線-----\n\
  \n\n\n\n    第一集雖以血腥著名，卻不以血腥為樂。接下來的每一集，機關和死法都是主要賣點\n，主線劇情推展也還算順暢～就一路拍了七集\n\n    2～7集當爽片看都還算OK，但是第一集帶出的人性考驗和謎底揭曉的震撼，絕對是七\n\
  大武器之...痾...是七集之最，經典當之無愧\n\n    故事第八集來到了10年後，主線劇情算是無違和地重啟了這個系列，平穩中無明顯失\n誤地開啟新篇章。因為從第一集到第七集都看過，看第八集難免會有似曾相似的感覺，有\n\
  些通關的反應或結果，沒猜到也相去不遠，少了看第一集時的驚訝和無法猜透的意外感\n\n    就像快到片尾所說的，厲害的遊戲一項向很簡單。第一集主要用一間密室拍了18天，\n\
  2位演員在密室中的互動，創造了1.03億美元的票房，才能經典詮釋I wanna play a game\n\n\nPS：其實台版的play蝦咪game也蠻厲害的(大誤\n\
  \n--"
