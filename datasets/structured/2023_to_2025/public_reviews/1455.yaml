title: '[普無雷] 奪魂鋸X - 用心必看但爽度差了點'
content: "大家中秋節快樂\n \n以往的奪魂鋸故事都從受試者的視角出發，並以各種交叉敘事的方式，創造詭計與懸疑感。\n \n這次直接以一個很直線性敘事的方式，以老頭的視角出發，帶我們看老頭如何從接觸到一個事\n\
  件，綁架事件的人，到按排遊戲、觀察遊戲，很有幕後花絮的感覺。\n \n老頭的戲份很多，從中可以更了解約翰克萊默這個人及其與阿曼達間的師徒互動，看得出劇組\n花了不少心思去描寫，但缺點就是有點寫太多，導致故事有點不緊湊且少了以往的懸疑感，\n\
  畢竟都直接從老頭視角出發了，雖然導演還是有留一手做結局反轉，但真的也就一小手而已\n，這部分有點可惜，畢竟我來看奪魂鋸還是想看懸疑緊湊的劇情，跟意外的結局反轉。\n\
  \ \n當然殺人機關也是看點之一，這部總算有原汁原味的感覺了，第九集那個外傳根本沒得比，幾\n個遊戲我都看到全身不知不覺縮在一起，遊戲結束才發現原來自己緊張到都縮著。\n\
  \ \n身為奪魂鋸老粉認為這部基本上必看，你可以不看8跟9，但這集絕對必看，可是因為有些地方\n實在太冗長，看完完全不想二刷，爽度也沒有老七集的爽，真老頭粉再去電影院看就好。\n\
  \ \n \n--"
