title: '[負雷] 恐怖片負雷三連發 奪魂鋸X 詭屋 屍禁'
content: '奪魂鋸X

  道具簡陋 機關無聊

  都在同一個場所

  以前至少還有關卡

  為拍而拍

  負雷


  詭屋(日) sweet home

  一家人搬家到有病設計師房子設計的房子

  喪夫喪子後躲在設計的房子裡假裝是這一家的人

  房子裡住外人 住鬼  住神經病 住妖怪

  很多片子都拍過了

  無趣

  負雷



  屍禁

  女主角幫當地望族洗被惡魔附身的屍體

  非常無聊又非常不恐怖

  負雷




  今年上映看過比較推的就

