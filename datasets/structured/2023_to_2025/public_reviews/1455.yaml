url: https://www.ptt.cc/bbs/movie/M.1136458670.A.1D4.html
title: 'Re: [問題] 有關奪魂鋸2(小雷)'
content: "(大雷!!)\n\n\n當然這個電影沒有交代，所以沒有正確答案，\n不過從第一集可以稍微推斷出一點端倪。\n\n奪魂鋸的精神，就是每個人都必須遵守他的\"\
  遊戲規則\"\n在第一集中，就有人照著他的遊戲規則去抓別人來進入這個\"遊戲\"\n因為他知道不照這個遊戲規則走，自己就會死，\n所以他不得不這麼做，只是也許他做了還是不能逃出這個\"\
  遊戲\"就是了。\n\n第二集中，有人就明確的指出他是被那個被火燒死的男生抓進來的，\n而這個男生其實不能歸類為\"助手\"，而是受害者，\n因為他會抓別人也可能只是照著兇手給他的遊戲規則走，\n\
  至於他又是怎麼進來的，應該就是被女助手抓進來的。\n\n我推論應該不是老兇手抓的，原因有二，\n\n第一，老兇手當時體能狀況已經很差了。\n第二，這個在屋子裡面的遊戲應該可以說幾乎都是女助手設計的，\n\
  \      所以感覺有點粗糙感，每個人的死法並不能設計的那麼完美，\n      甚至連他自己會被推進針筒堆應胎都是他自己想不到的吧。\n\n嚴格來說，第二集只有三個遊戲，\n\
  第一個就是片頭把人臉夾爆的\"遊戲\"。這應該也是老兇手執行策劃的。\n第二個就是一群人在屋子裡面玩\"遊戲\"。這應該是女兇手執行策劃的。\n第三個就是玩弄警察於股掌間的\"\
  遊戲\"。這當然是老兇手執行策劃的。\n\n最後有為接下來做個鋪路，就是警察被關起來了，\n可能接下來就是要遵照女兇手的遊戲規則來玩遊戲了吧。\n但這應該不算一個完整的\"\
  遊戲\"，只是個開頭，所以不算。\n\n\nPS: 至於要怎麼抓人進到屋子裡，這就不用說了吧...\n    迷昏就好啦，而且一開始大家都是剛醒然後不知道發生什麼事的樣子不是嗎?\n\
  \n\n\n--\n\n \n\n--\n◆ From: 140.112.30.82"
