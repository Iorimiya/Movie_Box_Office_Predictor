  \         6\n 98   Ericson 請 Hoffman 找他一趟，解釋關於拼圖切割工具的不同。          6\n 99   William\
  \ 第三個測驗，協助秘書通過火焰迷宮，但秘書失敗。             6\n100   FBI 兩人表示，Seth 的錄音帶可以還原聲音，3人到工作室等待結果。\
  \     6\n101   Jill 起身前往 William 的遊戲現場監視室。                           6\n102   在聲音還原工作室，Hoffman\
  \ 的聲音被還原。                           6\n103   Hoffman 立即殺掉 Ericson, Perez 及工作人員3人。\
  \                    6\n104   William 第四個測驗，六人俄羅斯輪盤。只可救2名員工。                6\n\
  105   Hoffman 回到現場，Jill 以電椅擊昏 Hoffman。(第六個信封的測試者)    6\n106   William 最終測試，沒有主導權。Pamela\
  \ 是 William 的家人。(女朋友?)  6\n107   母子是心臟病男子的親屬，有最終測試選擇權，兒子按開關殺死 William。 6\n108  \
  \ Jill 安裝機關在 Hoffman 頭上，離開後， Hoffman 剩下45秒。          6\n109   Hoffman 熟知機關，利用地形爭取時間，撕裂右邊臉頰逃生。\
  \             6\n\n我自己也有幾個疑點啦\n目前看來\n劇情環繞在Jill、火災、Umbralla Health保險公司 跟 兩位門徒為主\n\
  火災整個主軸未明\nJill線索漸漸變多\n第五集的生還者Brit也去向未明\n(當然還有第一集的Gordon...失蹤最久...)\n\n\n然後Jill的心路歷程比較難以解釋\n\
  因為John在世時\nJill希望可以收手的\n可是第六集他整個就是積極要完成John的遺願\n這中間一定有發生甚麼事情\n畢竟他是第四集整個比較明朗的出現\n\
  但關於他的事情大家知道的太少\n\n而那個牛皮紙袋的去向真的讓人好奇\n\nHoffman到底會不會在下一集絕地大反攻?\n\n二擇一的老婦人+俄羅斯輪盤活下來的兩個員工\n\
  以後還有沒有戲份?\n\n最後鐵籠內的三個人又將會如何發展?\n看來又得等明年解答了\n\n--\n◆ From: 118.233.152.107\n感謝~哈\n\
  已經修正了^^\n\n因為為了去看奪魂鋸6\n想說把前面5集再複習一次XD\n\n恩恩\n的確是\n不過我朋友跟我說他應該失血過多?\n\n我有點想做XDDD\n\
  不過最近要期中考\n另一點是第二集的八人遊戲\n有些人的名字不清楚\n第六集關卡中被選擇的人\n也是有些名字不清楚(ex:六人小組)\nOK\n已經補充\n做為第1、2集\
  \ 與其他集數的主軸時間切割\n\n感謝timeline大大告訴我記者的名字^^\n是不明測驗\n因為第一集的所有測驗，Hoffman就有參與了。\n但在Hoffman加入前(鐘擺大斧)\n\
  他就被稱為JIGSAW了\n所以表示他一定有進行過不少測驗被世人知道\n才會被稱為JIGSAW\n在Hoffman加入前\n所知道的其一測驗就只有Cecil那個\n\
  感謝指教^^\n已經訂正\n其餘已經更正  謝謝大家指教\n突然翻了一年多前的舊文\n順手改一改XD\n只是3D的劇情我目前就沒時間更新在裡面了\n且3D的劇情幾乎是順敘\n\
  補的動力沒那麼強大XD"
