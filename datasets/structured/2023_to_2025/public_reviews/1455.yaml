url: https://www.ptt.cc/bbs/movie/M.1194440907.A.FC2.html
title: '[影評] 想他想的 ～ 我看讀魂鋸4 (內有雷)'
content: "防雷頁\n\n\n\n\n\n\n\n\n\n\n\n想寫這篇醞釀很久了  在我爬完整個版的奪4文之後  我決定寫一篇我自己的想法\n\n我的重點是\
  \  我想幫奪4平反一下  總覺得版上瀰漫一種\n奪4很不好看  不夠精緻  不夠嚴謹的氣氛\n可是我個人其實挺喜歡奪4的  所以我說一下自己的看法\n\n首先\
  \  我是在傳說中被室友推薦於寢室內看了奪1  結尾的一幕我大叫驚訝許久\n害我被室友罵= =\n此後就成為奪魂鋸的忠實觀眾  每一集都進戲院看\n此外  因為我是學醫的\
  \  所以其實很多恐怖片我看起來都不覺得恐怖\n只是有時候覺得它作的太假而已\n（想我看片的前幾個禮拜也拿著那個電鋸和電鑽在一個老伯頭上大興土木呀...\n \
  \ 害我整個看到那幕覺得親切...）\n\n我想先提這一集的重點  我覺得是「瞭解John（Jigsaw,以下簡寫為J）」\n也就如此  他選擇了Rigg做為主角\n\
  （也或許一方面是Hoffman想殺光所有的警探  是H選的...）\n\n影片試圖製作「J要R成為接班人  所以不斷讓R感受他的感覺」\n要讓比較腦殘那部分的我們認為\n\
  「說不定最後J會成功  R就成為下一集的主謀」\n但是另一個主軸是\n交代J的故事  讓我們體會為什麼J會殺人\n也就是「四片牆圍成一個家」裡寫到的\nsee\
  \ what i see, save what i save, feel what i feel...文字的意涵\n\n而奪魂鋸系列一項的精神是\n「不是我殺的\
  \  是他們自己選擇死亡  他們只能先犧牲  再自救  不然就是死」\n這也是J想教會R的最中心精神\n（在某個程度  也可以說是J要教我們這些觀眾這件事）\n\
  \n的確  如果R不管這些人  不玩這個遊戲  R並不會怎樣\n只是R的正義感使然  他想推翻J的想法\nR想救那些被害者  或者退一步說  幫那些被害者\n\n\
  諷刺的事  第一個女的就表達了\n「為了生存  就算是救人一命的恩人  也可以毫不猶豫地砍死」\n於是前一秒R救起的人  後一秒R就拿著槍對她\n（題外話  把頭皮掀起來的確不會死\
  \  頂多太痛而休克\n  但是頭皮下有一些動脈  如superficial temporal artery  很容易流血而死\n  就算沒傷到動脈  因為頭皮供血非常豐富\
  \  也可能bleed to death）\n\n而第二個男的  J很賤的要R把肥強暴犯綁在床上\n如果R不把他綁起來  R一點關係都沒有  但是正義感使然 \
  \ 他某部分也想懲罰這個男的\n於是  R就像另一個J的附身一樣  逼著肥強暴犯自己綁起自己  要肥強暴犯玩遊戲\n表達了：「你看看  身為警察也是會以自己的好惡去決定別人的」\n\
  （一般而言  應該是交給法律去制裁  不是警察）\n\n第三個夫妻  丈夫必死的  這很確定\n（好比第一集中  Amanda不把對方的肚子切開找到鑰匙  A就會死\n\
  \  被剖肚的人一樣  不管他意志如果  只要A敢剖  他就會死）\n而R被交代的任務是「救那個太太」\n如果R不打電話  不幫她拔下釘子\n依當時這位太太的流血量\
  \  她應該已經非常無力且虛弱了\n再不送醫  或許就快失血致死\n問題就是：「你面前的人是為了救自己而不得不殺了別人的人  你願意出手救她嗎？」\n而這問題\
  \  也就是J培養A時的重點\nA殺了全身不能動的男人  為了自己存活  於是A成了J的信徒\n這位太太也一樣  R救了這個自私鬼  好比J培養了A一樣\n\n\
  \n接著這話題  所以我想反駁有人說前妻不重要\n因為第四級重點在「瞭解J」  所以她是必要的\n因為她要交代J的過去  讓我們瞭解J從一開始為何會變得如此\n\
  此外  我覺得J的第一個機關也教了J一件事\n「並不是每個通過遊戲的人  下一個念頭就會珍惜自己的」\n所以那位搶犯一成功就想殺J  也使得J更努力讓機關複雜並自我保護\n\
  \n影片恐怖的地方在於\n一旦觀眾認為「這些罪犯死有餘辜」\n那麼  J就達到他的目的了\n因為觀眾已經saw what he saw, felt what he\
  \ felt.\n\n\n接下來是影片的重頭戲  誰是接班人  以及final test之意涵\n\n老實說  我沒有猜到  因為我並不刻意要自己去猜\n我覺得看第一級快樂之處\
  \  就是我們單純的以為那個醫院打雜工就是兇手\n我們當時不打算要和編劇鬥智  只是享受這部影片的鋪陳\n\n所以  我這一集也是如此  並不特別想要猜誰是兇手\n\
  只是順著影片的鋪陳  看下去\n（或許這是只看奪4沒看到1.2.3的人的樂趣吧）\n\n\nfinal test  分成幾個部分來講\n\n首先  我覺得H是兇手是有跡可尋的（當然是馬後砲）\n\
  因為原本站在冰塊上的警察想自殺時\nH對他說了：「照他說的作  不要亂來」\n\n當時我以為是：「不然我會被你電死」\n但是H想說的其實是：「不然我設計的遊戲就玩不下去了」\n\
  \n接下來  奪2好看之處在於  J所交代的規則\n只要兒子失蹤那位警探等到時間結束一切就ok的這一點（就是站冰塊那位  熊熊忘他名）\n其實只要警探乖乖遵守rule\
  \  就可以破關\n那麼  奪4的rule在哪裡？\n\n其實是H定的！\n\n當時去解救奪3死亡的女警探時  第一個衝進去的就是R\n等到大家下去現場時  H向R說了：\n\
  「不早跟你提過  未確認的門都不可以隨便開」\n而這一句話  就是final test的rule\n諷刺的事  就是在於這個rule和R的想法是背道而馳的\n\
  而整個遊戲  就是要test R是否會堅持自己的信念\n\n環顧而看  R有時有  有時沒有\n這也裁示R是一個平凡人  也確定了他不會成功破關\n\n而最後大家面對那張門問著：「到底誰會進來？」\n\
  史川推開的卻是奪3的門  並殺了那個不旦喪子  且女兒被綁架老婆也掛點的可憐老爸\nR不意外的沒有確認狀況  在最後一秒推開了門  殺光裡面除了H以外的所有人\n\
  \n\n不可諱言的\n這一集有些缺點\n包括了「人物辨識度不夠高」（我一開始很搞不懂律師,史川,H誰是誰...）\n「快速剪輯技巧的使用過多」（很多幕如果不認真看就立馬錯過...）\n\
  「剪輯方式過於破碎  時空交錯極多場景的掌握度不夠  觀眾不易掌握所有主線」\n\n但是在某個角度上看也是優點\n許多的迅速換景可以嚇到人（我被嚇到的都是它轉場那一剎那...）\n\
  時空交錯可以使人更加錯亂  不會猜到其實3.4是同一個時空\n\n\n最後一提  我覺得編劇最賤的是  很多事情他只要有交代就好\n我一直覺得他下一集怎麼拍 \
  \ 和他去蒐集網上所有bug  再努力編個故事\n誰知道「A沒有他人幫助  不可能將女警探放上機關」這件事\n是鋪好的梗還是他上網看到有人再抓bug時才靈機一動的呢？\n\
  \n所以  換個角度想  大家都是編劇  或許大家體內也有一個JOHN\n\n\n--\n◆ From: 140.129.79.44"
