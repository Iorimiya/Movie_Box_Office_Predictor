url: https://www.ptt.cc/bbs/movie/M.1510217682.A.CFB.html
title: '[好雷]奪魂鋸：遊戲重啟 連續鋸鋸不完阿'
content: '我跟老婆兩人都是臭俗仔，不過我們對噁爛血漿片都有一種無法自拔的追求跟熱愛，頭被


  砸洞，身體被開洞，心肝肺胃腸亂灑鮮血亂噴對我們來說是如此的療癒人心跟舒壓。手機


  如果看到國外噁爛片粉絲團把國外噁爛片精華剪輯，覺得夠猛就會馬上分享給老婆，手機


  另一頭的她想必也是對著手機滿意的微微笑，沒錯，我們就是如此的怪洨。不過這些怪異


  的行為僅止於電影，現實生活中，我們連路邊被撞死的小動物都不敢看。奪魂鋸電影是我


  們兩熱愛的系列之一，每一集都去電影院捧場，這次一獲知有機會去看特映會，我索性連


  預告片都不看，就想直接進電影院看看多年之後，新的奪魂鋸能夠給我什麼驚喜。




  ===============================以下或許有雷請慎入=============================


  先講噁爛程度，看完我覺得有點小失望，第一具男性屍體出現的時候我覺得很有誠意，坐


  我附近的觀眾都因為屍體作得擬真而各自倒抽一口氣，躺在解剖台上的男性，頭被橫剖，


  腦袋上半部不見了，作得很細又加特寫，讓我跟老婆眼睛對眼睛相視而笑，這就對了，讓


  我對這部片後面內容充滿期待。第二具女性屍體就還好，明顯遜於男性屍體，尤其一開始


  鏡頭從身體往上帶，我都還沒看清軀體的開口，甚至連乳頭是甚麼顏色都不知道，鏡頭就


  快速往上帶了，還好臉頰脖子處被強酸侵蝕的痛感有做出來，加分加分。第三具黑人屍體


  根本搞笑，黑人慘死叫很大聲，電影院坐我附近的卻笑很大聲，叫越慘笑越大，完全沒有


  同情心可言。第四個是被套在脖子上的環型雷射刀開腦，腦袋瓜直接被數個雷射刀直切成


  數片，接著腦袋瓜直接在脖子上開花，雖然稱不上噁心，不過夠噱頭又有創意，還算有點


  扳回一成。



  不過這樣的安排我覺得有點不妥，就像吃西餐一樣，一開始一定是莎拉、湯、麵包、前菜


  接著才上主菜，那味道跟食材是這樣慢慢鋪成疊加上去，結果你一開始的屍體那麼猛，後


  面反而弱掉。就像第一道菜就出乾式熟成牛排，結果主菜出蚵仔煎！並不是蚵仔煎不好吃


  ，其實用感情弄還是可以很好吃的，不過你的蚵仔煎卻蚵仔瘦小沒幾隻，菜才灑一點，其


  他勾芡勾一堆，好像在吃洨一樣，這種落差就會很大。就會感覺這部電影把所有道具的經


  費都拿去作第一具屍體，其他的就尚可，所以綜合以上評論，噁爛程度我覺得小失望。很


  久沒在電影院看噁爛片，爆漿到跟老婆激動的五指緊扣了，上一部應該是2013年的屍變，


  最後拿電鋸往頭顱捅進去狂噴血的時候，我也跟著快噴了，我是指眼淚啦，超感動，這道


  牆太高了，有點難超越。



  虐殺的方式一向也是這部戲的賣點，你願意為了活下去作多大的犧牲，之前看了一本書叫


  「狼圖騰」，裡面有提到草原狼如果被人用狼夾子夾住了，為了活命，他會毫不猶豫的用


  他的利齒咬斷他被夾住的腿，就為了脫身活下去。我每次看完奪魂鋸我都會想，如果是我


  ，我有辦法為了活下去而把自己的一顆眼球戳瞎、用鉗子拔光自己的牙齒、把手砍斷、把


  腳鋸斷嗎？就算你的勇氣是梁靜茹給的，大部分的人也沒辦法吧！叫我犧牲身體的部分來


  換取活下去的機會，我只敢拿指甲剪剪一片指甲或拿剪刀剪一撮頭髮，最大的犧牲頂多刮


  鬍刀刮掉眉毛。另一個不敢對自己下手的原因是，就算我為了拿到活下去的鑰匙弄斷我的


  腿，你就真的會讓我活下去嗎？我們的拼圖殺人魔是講信用的，他設計的遊戲跟規則你只


  要照著作，最後往往可以生存下來。



  一開始被抓去的五個人被鐵桶罩住臉，鐵桶連接著鐵鍊，鐵鍊被機器拉動，人就會一直往


  前走，每個人的眼前都有數片圓鋸片，拼圖殺人魔就提示了，把你身體的任何部位給圓鋸


  片鋸出血，就可以平安的到下一關。這其實有點徙木立信的味道，每個人雖然遲疑，不過


  忍痛把手或其他部位弄過去給高速運轉的鋸片鋸下去之後，果真都平安的通過了。這就是


  拼圖老頭的做事方式，我講信用，你照我的規矩，不投機取巧，不耍小聰明，執行下去就


  可以活下來。不過這集虐殺的痛感我也覺得尚可。



  既然噁心也還好，虐殺也尚可，那為什麼要給好雷，劇情！就是劇情！拼圖殺人魔都死亡


  多年了，可是這些受害者死亡的方式都跟當年拼圖殺人魔的手法如出一轍。一開始猜測可


  能是模仿犯，但是後來檢驗發現，死者的身上都有拼圖殺人魔的DNA。最後搞到人心惶惶


  還去開拼圖老頭的棺木，不開還好，一開發現老頭的屍體不在裡面，反而是另一個受害者


  死在棺材裡。看到這邊已經覺得很扯，想說編劇要怎麼圓回來，沒想到後面更扯，拼圖老


  頭直接現身跟最後的兩名倖存者玩遊戲。



  都死好多年的人怎麼可能還活著？難道當年詐死，不可能阿，有一集還解剖過拼圖阿。難


  道是雙胞胎兄弟？還是從蚊子體內血液，取得拼圖老頭的DNA、再複製出拼圖老頭？還是


  拼圖老頭的親人收集到七龍珠？這邊算是大雷就讓大家自己去看了，最後圓得還不錯，再


  加上這麼多年的支持，也算對這系列有深厚的感情了，所以就給好雷了。



  總而言之，雖然噁爛跟虐殺尚可，但拍攝手法跟劇情還不錯，所以給推了，上映的時候，


  喜愛奪魂鋸系列的各位可以去捧場捧場阿。


  --

  老頭有沒有死，這是大雷，可能要自己去看才知曉

  我是看特映會'
