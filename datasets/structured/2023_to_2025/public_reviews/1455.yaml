title: '[微好雷]奪魂鋸新遊戲 '
content: "雷文防雷資訊頁\n\n簡介:\n\n    齊克是一個孤立於團體的警探，隨著首樁警察被殺害的案件開始，身邊同事接二連三\n    遭到虐殺，遭到虐殺的警員間的連結，都指向他。新的連環殺人狂，是堅鋸的門徒，\n\
  \    還是堅鋸並沒有死?\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~*-*~\n\
  \n\n\n~~~~~~~~~~~~~~~~~~~ 雷文 主文分隔線 ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\n感想:\n\n\n\
  一、救贖對象\n\n    拼圖殺人狂以救贖他人思想，經過對肉體折磨及精神考驗，透過遊戲的方式進行選擇\n    此集開頭作偽證滿口謊言的警探(拔舌)、對無辜民眾開槍的警探(扣動板機的手指)、\n\
  \    掩蓋黑幕的女隊長(犧牲脊椎神經)、以及最後對主角的考驗(父親的親情與過去堅持\n    的正義)。\n\n    此次主角與凶手的連結起因於兇手兒時父親因為願意舉報其他警察的行為而遭開槍打\n\
  \    死，因此有了改正警界風氣的動機，此點與主角不謀而合。\n    然而此處對於主角個性上的設定卻在他對著兒時的兇手要求不得張揚的行為顯見矛盾\n   \
  \ 或許兇手也認為主角在正義與私情間仍無法真實面對內心的想法，最後安排了這道考\n    驗。\n\n二、刑具\n    刑具的設計是奪魂鋸相較其他虐殺片更能展現創意的部分，因此這是我看此系列著重\n\
  \    的點，這次安排的是舌頭固定器、即將通電的水池和手指拉扯機關、熱蠟澆灌系統和\n    脊椎破壞平台、酒瓶碎片發射器、最後是拉開門就得死的人肉傀儡。\n\
  \n    本集我覺得最有意思的是最後出現的傀儡，一方面懸在半空中的樣子像是片中時而\n    出現的木頭傀儡，另一方面這道關卡讓曾對民眾下令開槍的老隊長死於槍下。\n\
  \n三、主角\n\n    齊克的擇善固執以及衝勁讓他在團體中顯得使分獨特，也讓他與同事們相處得不是很\n    好。在一向力挺他的長官、好朋友、新建立感情的搭檔一一被殺後，先是在車上怒吼\n\
  \    到拯救過去曾舉報的惡劣同事，到後來父親的死成為他倒下的最後一根稻草。兇手達\n    到報復目標後映襯留在原地痛哭的齊克，這幕讓我留下深刻的印象。\n\
  \n\n\n  *結語\n\n   相較第八集須藉由故事發展下去猜測兇手是何人和受害者間的關係，本集算是淺顯易\n   懂。道具機關不錯，劇情整體的安排也滿合理的，算奪魂鋸系列小品作。\n\
  \n\n\n\n\n--"
