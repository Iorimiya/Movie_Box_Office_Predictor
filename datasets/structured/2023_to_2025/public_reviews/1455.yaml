url: https://www.ptt.cc/bbs/movie/M.1510336438.A.864.html
title: '[ 好雷]  奪魂鋸重啟的 優缺'
content: '以下有大雷特雷


  不想被雷請左轉



  這次重啟的非常成功


  4-7後期感覺都已經為了拍而拍


  人物關係與時間線錯綜複雜


  這次重啟沒有這個問題


  簡單明瞭的劇情線


  出乎意料的轉折


  最後才發現原來是十年前的遊戲


  雖然看到男主角背上的傷痕就知道他是倖存者之一


  但沒猜到從頭到尾都是十年前與現在的交錯劇情線


  另外訝異的是彰化台中的廳都好少

  最近也沒大片上映

  奪魂鋸的名聲也蠻響亮的

  怎麼會如此少廳


  最後聊聊這齣的優缺


  優點

  1.關卡設計和人物死法很有創意

  2.劇情緊湊毫無冷場

  3.很合理的把jagsaw重現江湖

  4.警察不像前幾集那麼智障了

  5.氣氛營造很好


  缺點

  1.不夠血腥 雖然都有看到腦看到內臟

  但都是結果了，最期待的過程反而都跳過


  2.被害人人格轉變不合理

  活到最後的殺嬰女應該是最聰明與勇敢的，第一個聽懂遊戲規則，並且在摩托車男關卡時

  候跳出來用鐵杆拯救，算是冷靜善良勇氣智慧集於一身的人，沒想到最後一個遊戲，也沒

  什麼急迫會造成傷亡的機關下

  連腦都不動就轟了跛腳男，人家好歹為了妳斷了腿阿


  3.關卡稍不合理處

  感覺saw已經把誰能活到那都預先猜好了

  第一個是注射女

  第二個是腳

  第三個是摩托車

  沒有自己關卡的是殺嬰女與軍醫

  以上如果不小心在鐵片就死了

  或是斷腳男不過去

  後面似乎就不用演了


  4.不合理處之二

  穀倉的電視有點現代感

  十年前的液晶應該沒有這麼先進


  5.反派動機不足

  壞警察認真來說沒有必要跟蹤主角到穀倉

  雖然死人都跟他有關

  但也都死光了

  加上一開始他去工作室就帶了大批警力過去

  怎麼反而要去大本營就單槍匹馬


  6.異於常人的工作效率

  男主角劇情時間軸上 同時一邊啟動關卡

  一邊處理驗屍本務

  殺了線人男還能把他跟saw的屍體交換

  在被警察盯上還能

  去助理工作室當晚就能回農舍

  把第三個人的屍體掛上去暗房

