url: https://www.ptt.cc/bbs/movie/M.1698233355.A.428.html
title: '[討論] 為何驚聲尖叫能？奪魂鋸不能？'
content: '今年看了兩部從小到大的恐怖片最新續集，分別是《驚聲尖叫6》跟《奪魂鋸X》。


  這兩部都有20年（或近20年）的歷史，演員也都老了。


  因此前幾部的續集都有盡可能的推新主角，開新主線，例如《驚聲尖叫5》開始減少席尼

  的劇情，交給姐妹花為主，甚至6已經離開了伍茲伯勒鎮，票房只輸給元祖前兩集，評價

  好得不得了。


  但《奪魂鋸》自從老頭3集領便當後，就一直靠回憶跟補充劇情中出現。


  8雖然也有老頭，但不像前7集那樣多，是一個全新的主線。9那個番外篇就不提了，有夠

  難看。


  但10又抓出來繼續演，為什麼奪魂鋸無法做到改朝換代？明明有羅根這麼新門徒，怎麼不

  繼續深耕下去。


  --'
