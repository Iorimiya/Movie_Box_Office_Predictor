  \ 突襲錄影地點，Sing 救了 Jeff (老人)，後來死於陷阱。   1\n 20   John 介紹重生的 Amanda 給 Jill 看。      \
  \                          6\n 21   被停職的 Tapp 僱用 Adam 暗中調查 Gordon 的動向。         \
