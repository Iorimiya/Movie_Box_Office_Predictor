url: https://www.ptt.cc/bbs/movie/M.1509719309.A.38D.html
title: '[好無雷]奪魂鋸:遊戲重啟-劇本還算用心'
content: "網誌好讀版: \n\n\n想當年大學四年每年的萬聖節就是看奪魂鋸，默默地也變成連續鋸鋸了四年之久，到最後\n\n看到眾望所歸的高登醫生再次出場，猜測了四年之久的梗得到應證的當下也有種說不出的\n\
  \n感動。\n\n\n片商隔了七年為了騙錢又再度冷飯熱炒，本來完全沒有帶一絲絲期待只是為了重溫拼圖殺\n\n人魔那低嗓的口氣跟經典配樂而進場，沒想到意外的故事相當完整。\n\
  \n\n拼圖殺人魔究竟為何還能夠犯案，編劇巧妙的鋪陳許多疑點，讓人會忍不住想要趕快看到\n\n結尾真相，當然過程很多看起來痛死人的機關還是有，但這次的機關創意度大概只有70分\n\
  \n左右的水準，印象中以前看過有些機關還更要人有刻骨銘心的痛。值得一提的是，一些看\n\n似有點像bug的點，或者是某些角色的不合理反應，到了結尾居然大部分都有圓回來並且\n\
  \n是梗的一部分倒是不錯，雖然常看逆轉系列電影的觀眾大概會有一點點眉目是怎麼回事，\n\n但看到最後經典配樂響起的瞬間還是會恍然大悟，散場之後更是會品嘗鋪梗的過程，雖然\n\
  \n有一些部分解釋的不通，但已經算是及格的爆點了，整體來說算是有用心的跟前面系列作\n\n連結。\n\n\n這種猜兇手跟真相的電影就是在觀影過程中一直挑戰觀眾的推理，一下懷疑A一下懷疑B，\n\
  \n但每次都推翻你的想法。還真的是得等到最後經典配樂響起才能知道全部真相，光是這部\n\n分就值得讚賞了。\n\n\n這次的遊戲重啟劇本還算有拉回一點奪魂鋸系列的宗旨，比起前面幾集為了續集而續集的\n\
  \n連續鋸，這一次的處理方式算是有回到一點精華。究竟為何拼圖殺人王John Kramer這集\n\n還有戲份，邏輯上解釋起來蠻通順的，至少不會有讓人覺得很硬扯的感覺。\n\
  \n\n此外看到很多奪魂鋸系列經典的刑具也相當勾起觀眾回憶啊，片尾最後也相當保守，不知\n\n道會不會有續集，應當是取決於票房，就希望每年萬聖節能夠再進場連續鋸一下了。\n\
  \n有看過前面系列的觀眾一定要進場再感受一下，但沒有看過的可能會有點一頭霧水甚至看\n\n不懂，所以至少複習到第三集會好一點。\n\n\n評分:7.5/10\n\
  \n--"
