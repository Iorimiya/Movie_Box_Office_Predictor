title: '[請益] 奪魂鋸是機關逃脫片的始祖嗎？'
content: '問題如題。


  這裡先界定一下，


  單就機關逃脫而言，奪魂鋸一定不是始祖，


  比如三四十年前的印第安那瓊斯就要從大滾石逃脫了，


  但那不是電影本身主打方向。



  我這裡問的是，像奪魂鋸那樣，


  故事情節賣點就是有心人/外星人/神秘力量，設計一連串匪夷所思的機關


  然後主角要一關一關去破，


  大家去看就是想知道這次有甚麼腦洞大開的設計，主角要怎麼突破，


  這類片還有比如 要聽神明說的話 之類。



  請教這樣前提的話，


  奪魂鋸是始祖嗎？



  謝謝大家。


  --

  感謝


  我查了一下 異次元殺陣是1997 奪魂鋸是2004


  那可以問題改成：有比異次元殺陣還早的破關片嗎？


