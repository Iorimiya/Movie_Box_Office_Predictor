title: '[討論] 各位覺得奪魂鋸的老頭真的有給選擇嗎'
content: '一不注意

  奪魂鋸這個系列就拍到第十集了

  這個奪魂鋸老頭

  雖然在劇情中被設定成罹患絕症

  病得搖搖欲墜

  似乎隨時都會死掉

  但是人設比不上魔王光環


  前前後後殺了不少健康人士了

  自己還是跟蟑螂一樣死不掉


  他玩遊戲前

  都會跟"被參賽者"說要玩遊戲

  然後會給它們選擇

  那些選擇看過的人都懂

  似乎還想給這些人一些人生教育


  各位覺得

  這老頭真的有要給人選擇的意思嗎?


  覺得他徒弟也是怪怪的


  --'
