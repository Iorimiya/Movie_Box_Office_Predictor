  \n\n\n只受到驚嚇和尿了一地\n\nWilliam被打動\n\n雖被黑人Dove吐槽她父母早和她斷絕關係了，但欺騙成功\n\n他們只是來玩遊戲的，JigSaw從不害無辜的妻小\n\
  \n劇情安排她不聽錄音帶摔掉算是個梗，其實她身處那間似乎\n                          也沒有危險，但受到喪兄之痛\n\n給Hoffman戴上面具，說Game\
  \ Over關門\n\n依舊活在倒敘畫面中\n\n\n\n\n\n\n實習生Carla(JigSaw對東方女沒興趣XD)、老人Jeff(及時被救)\n\nGordon醫生的老婆Alison和女兒Diana(無辜妻小)\n\
  \          、Jeff的女兒Corbett(變成孤兒了Q_Q)\n          、心臟病男Abbott的老婆Tara和兒子Brent(無辜妻小)\n\
  \nGordon醫生、夫妻組合的妻子Morgan、副總裁Brit、縱火吸毒男Mallick\n                、放高利貸黑人女Simone、Addy嫂、保險公司六人小組的Emily和Shelby\n\
  \nDaniel(一方面有Amanda在旁保護，一方面也逃過壯漢Xavier的追殺\n\n\n\n\n\n\n我還選了：\n\n醫生一般力氣不大，要把腿鋸斷勢必歷時非常久，也是第一集\n\
  \                    帶給大家的顫慄感\n\n警察力氣就大多了，而且是用馬桶水箱蓋砸，真不知道他逃出浴室\n               \
  \       是怎麼走的!?不過被Amanda踢到痛處，還被抓去關了半年，其間\n                      一定很痛\n\n起初先用刀子切，後來又往上一點再切，到最後時間來不及換用\n\
  \                      大菜刀剁，雖然一度剁紅了眼，但事後想必很痛\n\n\n頭被扭斷前，四肢一一被扭轉到開放性骨折，實在很痛\n\n如此碩大的巨斧邊擺盪邊下降，從一開始只是劃破肚皮到越切越深，\n\
  \                  恐懼感跟疼痛感都超高\n\n\n身體被貫穿而且還要一一拉出，痛痛痛\n\n全身10處扯得皮開肉綻，舌頭上卻還有1個\n\n\
  \n原本可以五個人分擔的血量，現在只剩2個人，而且Mallick肯定獻\n                     的比較多，手臂都分成兩截了，等血盛滿的時間也不短\n\
  \n兩臂先開放性骨折，身體再被壓成肉餅\n\n掉進針坑裡，被插了有20幾針吧!找鑰匙時雖然應該知道在哪裡，但翻找\n                 過程中還是會不斷被刺，最後Daniel一針針幫忙拔出也是痛痛痛呀\n\
  \n\n 第六集有拉升\n會成為鋸迷就是因為不斷有新東西\n不管是新劇情新角色或是經由討論再回頭找出當初沒留意到的新鮮事\n不論編導怎麼換 但大抵都有維持住風格與水準\n\
  只要把情節搞懂 再連看1~6集就能體會了\n像是第6集最後快閃畫面把四個關門畫面都剪進來 就很讚呀!\n第7集倖存者的idea也很讓人期待 聽說遊戲會更多 劇情會更錯綜複雜\n\
